    output: RateCard
    side_effects:
      - "Stores the card with status = PROPOSED, pinned_item_version = null, supersedes_rate_card_id = null."
      - "increments ContractedItem.version by 1 on success (exactly once per call, whether or not supersede fired)."
      - "supersede == true: the one APPROVED incumbent for the same item has effective_to set to the new card's effective_from minus one calendar day and status -> SUPERSEDED, the new card's supersedes_rate_card_id points at it, and ContractedItem.approved_rate_card_count is decremented by 1."
      - "supersede omitted or false: the closed-interval overlap check at priority 20 applies."
  - method: GET
    path: "/rate-cards/{rate_card_id}"
    description: "Fetch one rate card."
    roles: [GpoAdmin, RebateAnalyst, DisputeArbiter, ManufacturerRep]
    code: 200
    input: []
    output: RateCard
    side_effects: []
  - method: GET
    path: "/rate-cards"
    description: "List rate cards, created_at DESC; filter by item or by the card a given card superseded."
    roles: [GpoAdmin, RebateAnalyst, DisputeArbiter, ManufacturerRep]
    code: 200
    input: ["contracted_item_id?", "supersedes_rate_card_id?", "status?", "rate_type?", "limit?", "offset?"]
    output: RateCard[]
    side_effects: []
  - method: POST
    path: "/rate-cards/{rate_card_id}/approve"
    description: "Approve a proposed rate card, making it selectable by accrual."
    roles: [GpoAdmin]
    code: 200
    input: []
    output: RateCard
    side_effects:
      - "PROPOSED -> APPROVED; pinned_item_version = the ContractedItem.version observed at this instant."
      - "increments ContractedItem.approved_rate_card_count by 1 and ContractedItem.version by 1."

  # ----------------------------------------------------------- PurchaseBatch
  - method: POST
    path: "/purchase-batches"
    description: "Open a distributor purchase feed for a closed calendar period."
    roles: [DistributorFeed, RebateAnalyst]
    code: 201
    input: [distributor_id, period_start, period_end, source_reference]
    output: PurchaseBatch
    side_effects: ["Stores the batch with normalization_status = RECEIVED, audit_status = NOT_AUDITED, line_count = 0 and every case/money counter at 0."]
  - method: GET
    path: "/purchase-batches/{batch_id}"
    description: "Fetch one purchase batch with both state dimensions and its case counters."
    roles: [GpoAdmin, RebateAnalyst, DisputeArbiter, DistributorFeed]
    code: 200
    input: []
    output: PurchaseBatch
    side_effects: []
  - method: GET
    path: "/purchase-batches"
    description: "List purchase batches, created_at DESC; filter independently on either state dimension."
    roles: [GpoAdmin, RebateAnalyst, DisputeArbiter, DistributorFeed]
    code: 200
    input: ["distributor_id?", "normalization_status?", "audit_status?", "limit?", "offset?"]
    output: PurchaseBatch[]
    side_effects: []
  - method: POST
    path: "/purchase-batches/{batch_id}/normalize"
    description: "Run item normalization over the batch's UNMATCHED lines."
    roles: [RebateAnalyst]
    code: 200
    input: []
    output: PurchaseBatch
    side_effects:
      - "RECEIVED -> NORMALIZED."
      - "Runs calculation normalization_match per line in ascending created_at, writing each line's match_status, contracted_item_id and accrual_block_reason."
      - "Recomputes batch.matched_cases and batch.unmatched_cases; total_cases_ingested is untouched."
      - "Refreshes ManufacturerDeal.last_purchase_date for every deal that gained a MATCHED line."
  - method: POST
    path: "/purchase-batches/{batch_id}/renormalize"
    description: "Compensating action: unwind normalization (and accrual, if it ran) back to RECEIVED so the feed can be re-processed."
    roles: [RebateAnalyst]
    code: 200
    input: []
    output: PurchaseBatch
    side_effects:
      - "NORMALIZED -> RECEIVED, or ACCRUED -> RECEIVED."
      - "From ACCRUED: every accrual of the batch with status IN {ACCRUED, FLAGGED} -> REVERSED with reversal_reason = RENORMALIZED, and each Member money counter is decremented by that accrual's exact components. dispute_reversal_count and reconciliation_posture are NOT touched."
      - "Every line resets to match_status = UNMATCHED, contracted_item_id = null, accrual_block_reason = NONE."
      - "matched_cases = 0, unmatched_cases = total_cases_ingested, accrued_by_user_id = null."
      - "audit_status resets to NOT_AUDITED and batch.overbilled_cents plus every line.overbilled_cents reset to 0."
      - "Rejected once audit_status has reached RECOVERY_REQUESTED, RECOVERED or WRITTEN_OFF, and rejected when any accrual of the batch is VALIDATED, DISPUTED or PAID."
  - method: POST
    path: "/purchase-batches/{batch_id}/accrue"
    description: "Create rebate accruals for the batch's matched lines using the accrue-time MARGINAL_BATCH variant."
    roles: [RebateAnalyst]
    code: 200
    input: []
    output: PurchaseBatch
    side_effects:
      - "NORMALIZED -> ACCRUED; batch.accrued_by_user_id = the caller's X-User-ID."
      - "Per MATCHED line: rate_card_selection picks the APPROVED card, rebate_gross variant MARGINAL_BATCH computes gross_rebate_cents, rebate_split writes admin_fee_bps_applied, admin_fee_cents, net_distributable_cents, member_share_cents and gpo_retention_cents; a RebateAccrual is created with status = ACCRUED and basis = MARGINAL_BATCH."
      - "Increments Member.accrued_member_share_cents, Member.attributed_gpo_retention_cents and Member.attributed_admin_fee_cents by the corresponding components."
      - "MATCHED lines that resolve no APPROVED card get accrual_block_reason = NO_RATE_CARD and produce no accrual."
  - method: POST
    path: "/purchase-batches/{batch_id}/audit-markup"
    description: "Cost-plus markup audit of the batch: compute per-line and batch overbilling against the lower of the distributor's contracted markup and the member tier's cap."
    roles: [RebateAnalyst]
    code: 200
    input: []
    output: PurchaseBatch
    side_effects:
      - "Runs calculation markup_overbilling, writing every line.overbilled_cents then batch.overbilled_cents."
      - "NOT_AUDITED -> AUDIT_CLEAN when the computed batch.overbilled_cents == 0, otherwise NOT_AUDITED -> AUDIT_OVERBILLED."
      - "Leaves normalization_status untouched."
  - method: POST
    path: "/purchase-batches/{batch_id}/request-recovery"
    description: "Open an overbilling recovery request against the distributor."
    roles: [RebateAnalyst]
    code: 200
    input: []
    output: PurchaseBatch
    side_effects: ["AUDIT_OVERBILLED -> RECOVERY_REQUESTED; increments PurchaseBatch.version by 1."]
  - method: POST
    path: "/purchase-batches/{batch_id}/settle-recovery"
    description: "Settle an open recovery request: collect cents and credit the overbilled members, or write the claim off and suspend the distributor."
    roles: [GpoAdmin]
    code: 200
    input: [outcome, "recovered_cents?"]
    output: PurchaseBatch
    side_effects:
      - "outcome == RECOVERED: recovered_cents stored, RECOVERY_REQUESTED -> RECOVERED, calculation recovery_allocation credits Member.recovery_credit_cents, Distributor.overbilled_recovered_cents += recovered_cents."
      - "outcome == WRITTEN_OFF: recovered_cents forced to 0, RECOVERY_REQUESTED -> WRITTEN_OFF, no member credits, and cascade: the batch's Distributor ACTIVE -> SUSPENDED."
      - "recovered_cents is required when outcome == RECOVERED and MUST be omitted when outcome == WRITTEN_OFF."

  # ------------------------------------------------------------ PurchaseLine
  - method: POST
    path: "/purchase-lines"
    description: "Ingest one invoice line into an open purchase feed."
    roles: [DistributorFeed]
    code: 201
    input: [purchase_batch_id, member_id, distributor_sku, vendor_item_description, normalized_item_key_reported, cases_shipped, invoice_unit_cost_cents, distributor_base_cost_cents, invoice_date]
    output: PurchaseLine
    side_effects:
      - "Stores the line with match_status = UNMATCHED, contracted_item_id = null, accrual_block_reason = NONE, overbilled_cents = 0."
      - "Computes invoice_extended_cents by calculation line_extended_cost."
      - "Increments batch.line_count by 1, batch.total_cases_ingested and batch.unmatched_cases by cases_shipped."
      - "Rejected unless the batch's normalization_status == RECEIVED."
  - method: GET
    path: "/purchase-lines/{line_id}"
    description: "Fetch one purchase line."
    roles: [GpoAdmin, RebateAnalyst, DisputeArbiter, DistributorFeed, MemberOperator]
    code: 200
    input: []
    output: PurchaseLine
    side_effects: []
  - method: GET
    path: "/purchase-lines"
    description: "List purchase lines, created_at DESC; filter by batch, member, resolved item or match status."
    roles: [GpoAdmin, RebateAnalyst, DisputeArbiter, DistributorFeed, MemberOperator]
    code: 200
    input: ["purchase_batch_id?", "member_id?", "contracted_item_id?", "match_status?", "accrual_block_reason?", "limit?", "offset?"]
    output: PurchaseLine[]
    side_effects: []
  - method: POST
    path: "/purchase-lines/{line_id}/map"
    description: "Manually resolve an AMBIGUOUS line to one of its eligible contracted-item candidates."
    roles: [RebateAnalyst]
    code: 200
    input: [contracted_item_id]
    output: PurchaseLine
    side_effects:
      - "AMBIGUOUS -> MATCHED with contracted_item_id set."
      - "Recomputes the batch's matched_cases and unmatched_cases."
      - "Requires the batch's normalization_status == NORMALIZED and the supplied item to be in the line's eligible candidate set."

  # ----------------------------------------------------------- RebateAccrual
  - method: GET
    path: "/accruals/{accrual_id}"
    description: "Fetch one rebate accrual with its full split breakdown."
    roles: [GpoAdmin, RebateAnalyst, DisputeArbiter, MemberOperator]
    code: 200
    input: []
    output: RebateAccrual
    side_effects: []
  - method: GET
    path: "/accruals"
    description: "List rebate accruals, created_at DESC; filter by line, member, rate card or status."
    roles: [GpoAdmin, RebateAnalyst, DisputeArbiter, MemberOperator]
    code: 200
    input: ["purchase_line_id?", "member_id?", "rate_card_id?", "status?", "basis?", "limit?", "offset?"]
    output: RebateAccrual[]
    side_effects: []
  - method: POST
    path: "/accruals/{accrual_id}/validate"
    description: "Validate an accrual against a reconciled manufacturer claim; forks to VALIDATED or FLAGGED on the accrual-level variance."
    roles: [RebateAnalyst]
    code: 200
    input: [claim_id]
    output: RebateAccrual
    side_effects:
      - "Computes accrual_variance_bps by calculation claim_reconciliation_variance level 2."
      - "ACCRUED -> VALIDATED when accrual_variance_bps <= VARIANCE_TOLERANCE_BPS, otherwise ACCRUED -> FLAGGED."
      - "Records validated_by_user_id = the caller's X-User-ID (a segregation-of-duties input for the later dispute decision)."
      - "No money field changes."

  # -------------------------------------------------------- ManufacturerClaim
  - method: POST
    path: "/manufacturer-claims"
    description: "Manufacturer submits (or restates) a rebate claim for a deal period. Requires the caller's observed ManufacturerDeal.version."
    roles: [ManufacturerRep, GpoAdmin]
    code: 201
    input: [deal_id, expected_deal_version, period_start, period_end, claimed_units, claimed_amount_cents]
    output: ManufacturerClaim
    side_effects:
      - "Stores the claim with status = SUBMITTED, accrued_amount_cents = 0, variance_bps = 0, reconciled_at = null."
      - "increments ManufacturerDeal.version by 1 on success (exactly once per call)."
      - "Any incumbent claim for the same (deal_id, period_start, period_end) with status IN {SUBMITTED, VARIANCE_FLAGGED} transitions to SUPERSEDED."
  - method: GET
    path: "/manufacturer-claims/{claim_id}"
    description: "Fetch one manufacturer claim with its reconciliation figures."
    roles: [GpoAdmin, RebateAnalyst, DisputeArbiter, ManufacturerRep, MemberOperator]
    code: 200
    input: []
    output: ManufacturerClaim
    side_effects: []
  - method: GET
    path: "/manufacturer-claims"
    description: "List manufacturer claims, created_at DESC; filter by deal or status."
    roles: [GpoAdmin, RebateAnalyst, DisputeArbiter, ManufacturerRep, MemberOperator]
    code: 200
    input: ["deal_id?", "status?", "limit?", "offset?"]
    output: ManufacturerClaim[]
    side_effects: []
  - method: POST
    path: "/manufacturer-claims/{claim_id}/reconcile"
    description: "Reconcile a submitted claim against GPO accruals for the same deal period; forks to RECONCILED or VARIANCE_FLAGGED on the deal-period variance."
    roles: [RebateAnalyst]
    code: 200
    input: []
    output: ManufacturerClaim
    side_effects:
      - "Runs calculation claim_reconciliation_variance level 1, writing accrued_amount_cents and variance_bps."
      - "SUBMITTED -> RECONCILED with reconciled_at = logical clock now when variance_bps <= VARIANCE_TOLERANCE_BPS, otherwise SUBMITTED -> VARIANCE_FLAGGED with reconciled_at left null."
      - "Rejected while any batch overlapping the claim period is still RECEIVED or NORMALIZED."

  # ------------------------------------------------------------ RebateDispute
  - method: POST
    path: "/disputes"
    description: "Member disputes an accrual's member share, citing an optional manufacturer claim as evidence."
    roles: [MemberOperator]
    code: 201
    input: [accrual_id, "claim_id?", reason_code, disputed_amount_cents]
    output: RebateDispute
    side_effects:
      - "Stores the dispute with status = OPEN, evidence_round_count = 0, opened_by_user_id = the caller's X-User-ID."
      - "Records accrual_status_before = the accrual's current status, then transitions the accrual to DISPUTED."
      - "Rejected outside the tier's dispute_window_days, and rejected while another dispute for the same accrual is OPEN or EVIDENCE_REQUESTED."
  - method: GET
    path: "/disputes/{dispute_id}"
    description: "Fetch one dispute."
    roles: [GpoAdmin, RebateAnalyst, DisputeArbiter, MemberOperator]
    code: 200
    input: []
    output: RebateDispute
    side_effects: []
  - method: GET
    path: "/disputes"
    description: "List disputes, created_at DESC; filter by the disputed accrual, the cited claim or status."
    roles: [GpoAdmin, RebateAnalyst, DisputeArbiter, MemberOperator]
    code: 200
    input: ["accrual_id?", "claim_id?", "status?", "reason_code?", "limit?", "offset?"]
    output: RebateDispute[]
    side_effects: []
  - method: POST
    path: "/disputes/{dispute_id}/request-evidence"
    description: "Arbiter sends an open dispute back to the member for supporting evidence."
    roles: [DisputeArbiter]
    code: 200
    input: []
    output: RebateDispute
    side_effects: ["OPEN -> EVIDENCE_REQUESTED; the accrual stays DISPUTED; rejected when X-User-ID == dispute.opened_by_user_id."]
  - method: POST
    path: "/disputes/{dispute_id}/submit-evidence"
    description: "Member supplies the requested evidence, returning the dispute to OPEN for decision."
    roles: [MemberOperator]
    code: 200
    input: [evidence_note]
    output: RebateDispute
    side_effects: ["EVIDENCE_REQUESTED -> OPEN; increments evidence_round_count by 1. The cycle may repeat any number of times."]
  - method: POST
    path: "/disputes/{dispute_id}/decide"
    description: "Arbiter upholds or rejects an open dispute. UPHOLD runs the 4-hop reversal cascade; REJECT restores the accrual's pre-dispute status exactly."
    roles: [DisputeArbiter]
    code: 200
    input: [decision, decision_note]
    output: RebateDispute
    side_effects:
      - "decision == UPHOLD: dispute -> UPHELD; accrual -> REVERSED with reversal_reason = DISPUTE_UPHELD; the three Member money counters are decremented by that accrual's exact components; Member.dispute_reversal_count += 1; on reaching ProgramTier.reversal_posture_limit the member flips CLEAR -> RESTRICTED, payout_hold = true and every ACCRUED batch holding a line of this member gets payout_hold = true."
      - "decision == REJECT: dispute -> REJECTED; the accrual returns to exactly dispute.accrual_status_before; no money field and no counter anywhere changes."
      - "Rejected when X-User-ID equals dispute.opened_by_user_id, accrual.validated_by_user_id or the accrual's batch.accrued_by_user_id."

  # --------------------------------------------------------- ComplianceReview
  - method: POST
    path: "/compliance-reviews"
    description: "Run a contract-compliance review of one member against one deal over a closed calendar window; may cause deal loss."
    roles: [GpoAdmin, RebateAnalyst]
    code: 201
    input: [member_id, deal_id, window_start, window_end]
    output: ComplianceReview
    side_effects:
      - "Runs calculation compliance_purchase_ratio, writing window_days, committed_spend_prorated_cents, contracted_spend_cents, deal_wide_contracted_spend_cents, purchase_ratio_bps and result."
      - "result == BREACH: the member transitions ACTIVE -> SUSPENDED with payout_hold = true."
      - "result == DEAL_LOST: triggered_deal_loss = true and the 4-hop deal-loss cascade runs (deal -> LOST, items -> DELISTED, rate cards -> EXPIRED, matched lines -> EXCLUDED/ITEM_DELISTED, affected batches recount matched/unmatched cases)."
      - "The review row itself is immutable (common_fields: false — no version, no update endpoint)."
  - method: GET
    path: "/compliance-reviews/{review_id}"
    description: "Fetch one compliance review."
    roles: [GpoAdmin, RebateAnalyst, DisputeArbiter, MemberOperator]
    code: 200
    input: []
    output: ComplianceReview
    side_effects: []
  - method: GET
    path: "/compliance-reviews"
    description: "List compliance reviews, created_at DESC; filter by member, deal or verdict."
    roles: [GpoAdmin, RebateAnalyst, DisputeArbiter, MemberOperator]
    code: 200
    input: ["member_id?", "deal_id?", "result?", "limit?", "offset?"]
    output: ComplianceReview[]
    side_effects: []

  # ------------------------------------------------------------ computed read
  - method: GET
    path: "/members/{member_id}/savings-report"
    description: "Computed read: savings realized versus savings opportunity for one member over a closed calendar period, under either opportunity basis."
    roles: [MemberOperator, GpoAdmin, RebateAnalyst]
    code: 200
    input: [period_start, period_end, "basis?"]
    output: |
      { "member_id": string, "period_start": string, "period_end": string,
        "basis": "AS_PURCHASED" | "FULL_BASKET",
        "matched_cases": integer, "unmatched_cases": integer,
        "invoice_spend_cents": integer,
        "realized_cents": integer, "opportunity_cents": integer,
        "missed_opportunity_cents": integer, "capture_rate_bps": integer,
        "rebate_member_share_cents": integer, "recovery_credit_cents": integer }
    side_effects: ["Read-only. basis defaults to AS_PURCHASED when omitted; see calculation savings_realized_vs_opportunity."]

  # ------------------------------------------------------- test-driving clock
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical UTC clock. Before any call the clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to real wall-clock time."
    roles: [GpoAdmin]
    code: 200
    input: [current_utc]
    output: |
      { "current_utc": string, "letters_expired": integer, "rate_cards_expired": integer }
    side_effects:
      - "Every AuthorizationLetter with status == ACTIVE whose effective_to is at or before the new instant transitions ACTIVE -> EXPIRED, decrementing Member.active_letter_count and Distributor.active_letter_count."
      - "Every RateCard with status IN {PROPOSED, APPROVED} whose effective_to calendar date is strictly before the new instant's calendar date transitions to EXPIRED; APPROVED ones also decrement ContractedItem.approved_rate_card_count."
      - "Moving the clock backwards is permitted and reverses nothing already expired."

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:

  # --- authentication / authorization (priorities 1-3, 5, 6, 18) ------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, empty, or naming a role outside the six declared roles."
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "The caller's role is recognized but is not listed in the target endpoint's roles."
  - id: ERR_MEMBER_SCOPE_VIOLATION
    http: 403
    condition: "A MemberOperator acted on a resource whose owning Member id differs from its X-User-ID."
  - id: ERR_DISTRIBUTOR_SCOPE_VIOLATION
    http: 403
    condition: "A DistributorFeed acted on a resource whose owning Distributor id differs from its X-User-ID."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The deciding X-User-ID already appears on the workflow as the dispute opener, the accrual validator, or the batch accruer."

  # --- request shape (priorities 7, 8) --------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body, missing required field, wrong JSON type, unknown field, or an enum value outside the declared set."
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit outside 1..100 or offset negative or non-integer."

  # --- existence (priorities 4, 9) -----------------------------------------
  - id: ERR_PROGRAM_TIER_NOT_FOUND
    http: 404
    condition: "No ProgramTier row for the supplied tier id (path or tier_id body field)."
  - id: ERR_DISTRIBUTOR_NOT_FOUND
    http: 404
    condition: "No Distributor row for the supplied distributor id."
  - id: ERR_MEMBER_NOT_FOUND
    http: 404
    condition: "No Member row for the supplied member id."
  - id: ERR_LETTER_NOT_FOUND
    http: 404
    condition: "No AuthorizationLetter row for the supplied letter_id."
  - id: ERR_DEAL_NOT_FOUND
    http: 404
    condition: "No ManufacturerDeal row for the supplied deal id."
  - id: ERR_CONTRACTED_ITEM_NOT_FOUND
    http: 404
    condition: "No ContractedItem row for the supplied item id."
  - id: ERR_RATE_CARD_NOT_FOUND
    http: 404
    condition: "No RateCard row for the supplied rate_card_id."
  - id: ERR_BATCH_NOT_FOUND
    http: 404
    condition: "No PurchaseBatch row for the supplied batch id."
  - id: ERR_PURCHASE_LINE_NOT_FOUND
    http: 404
    condition: "No PurchaseLine row for the supplied line_id."
  - id: ERR_ACCRUAL_NOT_FOUND
    http: 404
    condition: "No RebateAccrual row for the supplied accrual id."
  - id: ERR_CLAIM_NOT_FOUND
    http: 404
    condition: "No ManufacturerClaim row for the supplied claim id."
  - id: ERR_DISPUTE_NOT_FOUND
    http: 404
    condition: "No RebateDispute row for the supplied dispute_id."
  - id: ERR_COMPLIANCE_REVIEW_NOT_FOUND
    http: 404
    condition: "No ComplianceReview row for the supplied review_id."

  # --- optimistic concurrency (priority 10) --------------------------------
  - id: ERR_STALE_PARENT_VERSION
    http: 412
    condition: "expected_contracted_item_version does not equal the ContractedItem's current version on POST /rate-cards, or expected_deal_version does not equal the ManufacturerDeal's current version on POST /manufacturer-claims."

  # --- state (priorities 11-17) --------------------------------------------
  - id: ERR_INVALID_STATE
    http: 409
    condition: "The requested transition is not declared from the row's current state, or a purchase line was posted to a batch that is no longer RECEIVED."
  - id: ERR_MEMBER_NOT_ENROLLED
    http: 409
    condition: "The referenced Member is PENDING, SUSPENDED or TERMINATED where enrollment_status == ACTIVE is required."
  - id: ERR_DISTRIBUTOR_SUSPENDED
    http: 409
    condition: "The referenced Distributor has status == SUSPENDED."
  - id: ERR_DEAL_NOT_OPEN_FOR_CHANGES
    http: 409
    condition: "The referenced ManufacturerDeal is SUSPENDED or LOST where status IN {DRAFT, ACTIVE} is required."
  - id: ERR_LOA_NOT_ACTIVE
    http: 409
    condition: "The line's Member has no ACTIVE AuthorizationLetter for the batch's Distributor covering the logical clock instant."
  - id: ERR_CLAIM_NOT_RECONCILED
    http: 409
    condition: "The claim cited by an accrual validation is SUBMITTED, VARIANCE_FLAGGED or SUPERSEDED rather than RECONCILED."
  - id: ERR_ITEM_NOT_A_CANDIDATE
    http: 422
    condition: "The contracted_item_id supplied to map is not in the ambiguous line's eligible candidate set."

  # --- temporal (priorities 19-26) -----------------------------------------
  - id: ERR_LOA_PERIOD_OVERLAP
    http: 409
    condition: "A SUBMITTED or ACTIVE authorization letter for the same (member, distributor) half-open-overlaps the requested window. Windows that merely touch do not overlap."
  - id: ERR_RATE_CARD_PERIOD_OVERLAP
    http: 409
    condition: "A PROPOSED or APPROVED rate card for the same contracted item closed-interval-overlaps the requested window. Windows that touch on a single calendar date DO overlap."
  - id: ERR_NO_INCUMBENT_RATE_CARD
    http: 409
    condition: "supersede == true but the item has no APPROVED rate card whose effective_to reaches the new card's effective_from."
  - id: ERR_PERIOD_BOUNDS_INVALID
    http: 422
    condition: "An end bound precedes its start bound (or equals it where strict ordering is required, as on AuthorizationLetter.effective_to)."
  - id: ERR_INVOICE_DATE_OUT_OF_PERIOD
    http: 422
    condition: "A purchase line's invoice_date falls outside its batch's closed [period_start, period_end]."
  - id: ERR_DISPUTE_WINDOW_CLOSED
    http: 409
    condition: "The logical clock is more than ProgramTier.dispute_window_days whole days past the accrual's created_at date."
  - id: ERR_REVIEW_WINDOW_IN_FUTURE
    http: 422
    condition: "ComplianceReview.window_end is after the logical clock's current calendar date."
  - id: ERR_CLAIM_PERIOD_ALREADY_RECONCILED
    http: 409
    condition: "A RECONCILED claim already exists for the same (deal_id, period_start, period_end)."

  # --- constraint satisfaction (priorities 27-33, 38) ----------------------
  - id: ERR_TIER_SPLIT_NOT_BALANCED
    http: 422
    condition: "member_share_bps + gpo_retention_bps != 10000."
  - id: ERR_RATE_CARD_SHAPE_INVALID
    http: 422
    condition: "The rate fields do not match rate_type, or tier_breaks is malformed (fewer than 2 entries, first min_cases != 0, non-increasing min_cases, or a rate below 1)."
  - id: ERR_INVALID_CASE_QUANTITY
    http: 422
    condition: "cases_shipped, invoice_unit_cost_cents or distributor_base_cost_cents is below 1."
  - id: ERR_DUPLICATE_DBA_CODE
    http: 409
    condition: "Another Distributor already uses this dba_code."
  - id: ERR_DUPLICATE_DEAL_CODE
    http: 409
    condition: "Another ManufacturerDeal already uses this deal_code."
  - id: ERR_DUPLICATE_TIER_CODE
    http: 409
    condition: "Another ProgramTier already uses this tier_code."
  - id: ERR_DUPLICATE_ITEM_SKU
    http: 409
    condition: "Another ContractedItem of the same deal already uses this manufacturer_sku."
  - id: ERR_DUPLICATE_BATCH_REFERENCE
    http: 409
    condition: "Another PurchaseBatch of the same distributor already uses this source_reference."
  - id: ERR_DUPLICATE_OPEN_DISPUTE
    http: 409
    condition: "Another RebateDispute for the same accrual is still OPEN or EVIDENCE_REQUESTED."

  # --- readiness / completeness (priorities 34-37) ------------------------
  - id: ERR_DEAL_HAS_NO_APPROVED_RATES
    http: 422
    condition: "Deal activation attempted while no ACTIVE contracted item of the deal has an APPROVED rate card."
  - id: ERR_MEMBER_HAS_NO_ACTIVE_LOA
    http: 422
    condition: "Member activation attempted while active_letter_count == 0."
  - id: ERR_NO_ACCRUABLE_LINES
    http: 422
    condition: "Accrual attempted on a normalized batch in which no MATCHED line resolves an APPROVED rate card for its invoice_date."
  - id: ERR_PERIOD_HAS_UNACCRUED_BATCHES
    http: 409
    condition: "Claim reconciliation or period close attempted while a batch overlapping the period is still RECEIVED or NORMALIZED."

  # --- fiscal (priorities 39-41) ------------------------------------------
  - id: ERR_RECOVERY_EXCEEDS_OVERBILLING
    http: 422
    condition: "settle-recovery with outcome == RECOVERED supplied recovered_cents greater than batch.overbilled_cents."
  - id: ERR_DISPUTE_AMOUNT_EXCEEDS_SHARE
    http: 422
    condition: "disputed_amount_cents is below 1 or above the cited accrual's member_share_cents."
  - id: ERR_MEMBER_PAYOUT_HELD
    http: 409
    condition: "Accrual validation attempted while the accrual's Member has payout_hold == true."

# =============================================================================
# §1.7 RBAC Matrix — role_model: segregation_of_duties
# =============================================================================
roles:

  - name: GpoAdmin
    description: "GPO contract administrator. Owns reference data (tiers, distributors, members, deals, items, rate cards), settles recoveries, closes rebate periods and drives the logical clock. Cannot ingest purchase data and cannot decide disputes."
    identity: opaque
    exclusive_operations:
      - "POST /program-tiers"
      - "POST /distributors"
      - "POST /members"
      - "POST /members/{member_id}/activate"
      - "POST /members/{member_id}/terminate"
      - "POST /manufacturer-deals"
      - "POST /manufacturer-deals/{deal_id}/activate"
      - "POST /manufacturer-deals/{deal_id}/suspend"
      - "POST /manufacturer-deals/{deal_id}/resume"
      - "POST /manufacturer-deals/{deal_id}/close-period"
      - "POST /contracted-items"
      - "POST /rate-cards"
      - "POST /rate-cards/{rate_card_id}/approve"
      - "POST /purchase-batches/{batch_id}/settle-recovery"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /authorization-letters (shared with MemberOperator)"
      - "POST /authorization-letters/{letter_id}/revoke (shared with MemberOperator)"
      - "POST /manufacturer-claims (shared with ManufacturerRep)"
      - "POST /compliance-reviews (shared with RebateAnalyst)"
      - "GET /members/{member_id}/savings-report (shared with MemberOperator and RebateAnalyst)"
      - "every GET listed in §1.5 except the member-scoped letter and dispute reads it already shares"

  - name: RebateAnalyst
    description: "GPO rebate operations analyst. Normalizes purchase feeds, maps ambiguous lines, accrues and validates rebates, reconciles manufacturer claims, audits cost-plus markup and opens recovery requests. Cannot approve rate cards, cannot settle recoveries and cannot decide disputes."
    identity: opaque
    exclusive_operations:
      - "POST /purchase-batches/{batch_id}/normalize"
      - "POST /purchase-batches/{batch_id}/renormalize"
      - "POST /purchase-batches/{batch_id}/accrue"
      - "POST /purchase-batches/{batch_id}/audit-markup"
      - "POST /purchase-batches/{batch_id}/request-recovery"
      - "POST /purchase-lines/{line_id}/map"
      - "POST /accruals/{accrual_id}/validate"
      - "POST /manufacturer-claims/{claim_id}/reconcile"
    shared_operations:
      - "POST /purchase-batches (shared with DistributorFeed)"
      - "POST /compliance-reviews (shared with GpoAdmin)"
      - "GET /members/{member_id}/savings-report (shared with GpoAdmin and MemberOperator)"
      - "the GET reads for members, letters, deals, items, rate cards, batches, lines, accruals, claims, disputes and reviews"

  - name: DisputeArbiter
    description: "Independent rebate dispute arbiter. The only role that can request evidence or decide a dispute, and is barred by segregation of duties from deciding any dispute it opened or whose accrual it validated or accrued."
    identity: opaque
    exclusive_operations:
      - "POST /disputes/{dispute_id}/request-evidence"
      - "POST /disputes/{dispute_id}/decide"
    shared_operations:
      - "the GET reads for tiers, members, deals, items, rate cards, batches, lines, accruals, claims, disputes and reviews"

  - name: MemberOperator
    description: "Restaurant operator acting for itself. X-User-ID is the Member id, so every letter, dispute, line read and savings report it touches must belong to that member."
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /disputes"
      - "POST /disputes/{dispute_id}/submit-evidence"
    shared_operations:
      - "POST /authorization-letters (shared with GpoAdmin)"
      - "POST /authorization-letters/{letter_id}/revoke (shared with GpoAdmin)"
      - "GET /members/{member_id}/savings-report (shared with GpoAdmin and RebateAnalyst)"
      - "GET /members/{member_id}, GET /authorization-letters, GET /purchase-lines, GET /accruals, GET /disputes, GET /manufacturer-claims, GET /compliance-reviews — always scoped to its own member id"

  - name: DistributorFeed
    description: "Distributor data-release service account. X-User-ID is the Distributor id, so it may only countersign its own letters and only post batches and lines under its own distributor id."
    identity: "entity_backed:Distributor"
    exclusive_operations:
      - "POST /authorization-letters/{letter_id}/countersign"
      - "POST /purchase-lines"
    shared_operations:
      - "POST /purchase-batches (shared with RebateAnalyst)"
      - "GET /distributors/{distributor_id}, GET /authorization-letters, GET /contracted-items, GET /purchase-batches, GET /purchase-lines — scoped to its own distributor id where the resource carries one"

  - name: ManufacturerRep
    description: "Manufacturer representative. Submits and restates rebate claims against its deals and reads deal-side data; never touches purchase feeds, accruals or disputes."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /manufacturer-claims (shared with GpoAdmin)"
      - "GET /manufacturer-deals, GET /manufacturer-deals/{deal_id}, GET /contracted-items, GET /rate-cards, GET /manufacturer-claims, GET /program-tiers, GET /distributors"
