# §1.9 Scaffold Corner Design (Breadth Claim Index)
# Task 2906 — Apartment Doorstep Trash Valet Service
# Sections and claim_type values are taken verbatim from
# references/claim-extraction-guide.md. Every grounds ref resolves into
# SCAFFOLD.yaml §1.1–§1.7; every excluded_because.difficulty_instance names a
# real instance in SCAFFOLD_DIFFICULTY_DESIGN.yaml. Money literals in `assert:`
# were computed by executing the §1.3 formulas against the pinned inputs.
scaffold_corner_design:

  - section: entities
    instances:

      - name: property_creation_applies_declared_defaults_and_computed_zeros
        claim_type: creation
        grounds:
          - entities.Property.fields.compactor_capacity_lbs
          - entities.Property.fields.status
          - entities.Property.fields.escalation_level
          - entities.Property.fields.pending_fine_revenue_cents
          - entities.Property.fields.delinquent_resident_count
          - state_machines.Property.initial_state
        distinguishing_aspect: "POST /valet/properties with only the three required inputs returns 201 and the response carries compactor_capacity_lbs 6000, status ONBOARDING, escalation_level 0, pending_fine_revenue_cents 0, delinquent_resident_count 0 and active_contract_id null."
        test_recipe:
          setup:
            - "Empty database; logical clock set to 2026-09-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /valet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /valet/properties"
              payload: { name: "Cedar Ridge", unit_count: 4, market_code: "ATL" }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
          assert:
            - "HTTP 201 and the envelope is { meta: { api_request_id, api_request_timestamp }, response_type: 'object', data: {...} }"
            - "Property.${prop_id}.name == 'Cedar Ridge', unit_count == 4, market_code == 'ATL'"
            - "Property.${prop_id}.compactor_capacity_lbs == 6000 — the declared default"
            - "Property.${prop_id}.status == 'ONBOARDING' and active_contract_id == null"
            - "Property.${prop_id}.escalation_level == 0, pending_fine_revenue_cents == 0, delinquent_resident_count == 0"
            - "Property.${prop_id}.id, created_at, updated_at and version are all present and server-generated"

      - name: contractor_retrieval_returns_stored_onboarding_state
        claim_type: retrieval
        grounds:
          - entities.ValetContractor.fields.legal_name
          - entities.ValetContractor.fields.onboarding_status
          - entities.ValetContractor.fields.classification
          - entities.ValetContractor.fields.control_score
        distinguishing_aspect: "GET /valet/contractors/{contractor_id} returns exactly the row written by the create + documents chain: onboarding_status BACKGROUND_PENDING, classification UNCLASSIFIED, control_score 0, tax_form_type W9."
        test_recipe:
          setup:
            - "One contractor created and document-complete, so onboarding_status is BACKGROUND_PENDING"
          setup_api_calls:
            - call: "POST /valet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /valet/contractors"
              payload: { legal_name: "Val Ito", equipment_provided_by_company: true, sets_own_schedule: true, works_exclusively: false, weekly_committed_hours: 20 }
              as: ValetOpsManager
              captures: { ct_id: $.data.id }
            - call: "POST /valet/contractors/${ct_id}/documents"
              payload: { tax_form_type: "W9", direct_deposit_on_file: true }
              as: ValetOpsManager
          trigger:
            - call: "GET /valet/contractors/${ct_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-screener"
          assert:
            - "HTTP 200 with ValetContractor.${ct_id}.legal_name == 'Val Ito'"
            - "ValetContractor.${ct_id}.onboarding_status == 'BACKGROUND_PENDING' and classification == 'UNCLASSIFIED'"
            - "ValetContractor.${ct_id}.tax_form_type == 'W9', direct_deposit_on_file == true, control_score == 0, observed_weekly_hours == 0"
            - "ValetContractor.${ct_id}.background_checked_by_user_id == null and classification_basis == null"

      - name: resident_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - entities.Resident.fields.property_id
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /valet/residents?property_id=…&limit=2&offset=0 returns 2 of 3 rows with total_count 3 and has_more true; the same query at offset 2 returns 1 row with has_more false."
        test_recipe:
          setup:
            - "Property 'Cedar Ridge' unit_count 4 with residents at units 101, 102 and 103"
          setup_api_calls:
            - call: "POST /valet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /valet/properties"
              payload: { name: "Cedar Ridge", unit_count: 4, market_code: "ATL" }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /valet/properties/${prop_id}/residents"
              payload: { unit_number: 101, full_name: "Rosa One", move_in_date: "2026-08-01" }
              as: PlatformAdmin
            - call: "POST /valet/properties/${prop_id}/residents"
              payload: { unit_number: 102, full_name: "Ravi Two", move_in_date: "2026-08-01" }
              as: PlatformAdmin
            - call: "POST /valet/properties/${prop_id}/residents"
              payload: { unit_number: 103, full_name: "Rita Three", move_in_date: "2026-08-01" }
              as: PlatformAdmin
          trigger:
            - call: "GET /valet/residents"
              payload: { property_id: "${prop_id}", limit: 2, offset: 0 }
              as: PropertyManager
              as_user_id: "${prop_id}"
            - call: "GET /valet/residents"
              payload: { property_id: "${prop_id}", limit: 2, offset: 2 }
              as: PropertyManager
              as_user_id: "${prop_id}"
          assert:
            - "the first call returns HTTP 200 with response_type 'array', exactly 2 rows, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "the second call returns exactly 1 row, total_count == 3, has_more == false, offset == 2"
            - "no row from the first page repeats on the second page — the 3 ids across both pages are distinct"

      - name: contractor_get_with_unknown_id_returns_contractor_not_found
        claim_type: not_found
        grounds:
          - validations[priority=3]
          - errors[ERR_CONTRACTOR_NOT_FOUND]
        distinguishing_aspect: "GET /valet/contractors/{unknown_uuid} returns HTTP 404 with error_id ERR_CONTRACTOR_NOT_FOUND and the error envelope shape from §1.0, not an empty 200."
        test_recipe:
          setup:
            - "Empty database apart from the logical clock"
          setup_api_calls:
            - call: "POST /valet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /valet/contractors/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: ValetOpsManager
          assert:
            - "HTTP 404 with data.error_id == 'ERR_CONTRACTOR_NOT_FOUND' and response_type == 'error'"
            - "data.message is a non-empty string and no ValetContractor row is created"

      - name: contract_create_missing_required_fee_returns_invalid_request
        claim_type: required_fields
        grounds:
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
          - entities.ServiceContract.fields.per_unit_monthly_fee_cents
        distinguishing_aspect: "POST /valet/properties/{id}/contracts omitting per_unit_monthly_fee_cents — an input field with no declared default — returns HTTP 422 ERR_INVALID_REQUEST and creates no ServiceContract."
        test_recipe:
          setup:
            - "Property 'Cedar Ridge' unit_count 4 in ONBOARDING with no contracts"
          setup_api_calls:
            - call: "POST /valet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /valet/properties"
              payload: { name: "Cedar Ridge", unit_count: 4, market_code: "ATL" }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
          trigger:
            - call: "POST /valet/properties/${prop_id}/contracts"
              payload: { property_revenue_share_bps: 1500, service_night_days: ["SUN", "MON", "TUE", "WED", "THU"], effective_from: "2026-09-01", effective_to: "2027-08-31", sla_missed_threshold_bps: 1000 }
              as: BillingAnalyst
              as_user_id: "analyst-drafter"
          assert:
            - "HTTP 422 with error_id == 'ERR_INVALID_REQUEST'"
            - "GET /valet/contracts?property_id=${prop_id} returns 0 rows and total_count == 0"
            - "Property.${prop_id}.status is still 'ONBOARDING' and active_contract_id == null"

      - name: resident_create_defaults_fee_passthrough_enabled_true
        claim_type: defaults
        grounds:
          - entities.Resident.fields.fee_passthrough_enabled
          - entities.Resident.fields.status
          - entities.Resident.fields.collections_status
          - entities.Resident.fields.move_out_date
          - state_machines.Resident.initial_state
        distinguishing_aspect: "Omitting the optional fee_passthrough_enabled input yields true, and the computed fields land on their declared defaults: status ACTIVE, collections_status CURRENT, fines_outstanding_cents 0, move_out_date null."
        test_recipe:
          setup:
            - "Property 'Cedar Ridge' unit_count 4"
          setup_api_calls:
            - call: "POST /valet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /valet/properties"
              payload: { name: "Cedar Ridge", unit_count: 4, market_code: "ATL" }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
          trigger:
            - call: "POST /valet/properties/${prop_id}/residents"
              payload: { unit_number: 101, full_name: "Rosa One", move_in_date: "2026-08-01" }
              as: PropertyManager
              as_user_id: "${prop_id}"
              captures: { r1_id: $.data.id }
          assert:
            - "HTTP 201 with Resident.${r1_id}.fee_passthrough_enabled == true"
            - "Resident.${r1_id}.status == 'ACTIVE', collections_status == 'CURRENT', move_out_date == null"
            - "Resident.${r1_id}.fines_outstanding_cents == 0 and fines_assessed_this_period_cents == 0"
            - "Resident.${r1_id}.property_id == '${prop_id}' — the parent is taken from the path, not the body"

      - name: route_assignment_coverage_count_is_computed_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.RouteAssignment.fields.unit_coverage_count
          - calculations.route_unit_coverage
          - entities.ServiceNight.fields.assigned_unit_coverage_count
        distinguishing_aspect: "A client-supplied unit_coverage_count of 99 is ignored: the created route reports unit_coverage_count 4, derived from the closed range [101, 104], and the night reports assigned_unit_coverage_count 4."
        test_recipe:
          setup:
            - "Property 'Cedar Ridge' unit_count 4, contract ACTIVE, night 2026-09-01 SCHEDULED, one cleared DECLARED-classified valet"
          setup_api_calls:
            - call: "POST /valet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /valet/properties"
              payload: { name: "Cedar Ridge", unit_count: 4, market_code: "ATL" }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /valet/properties/${prop_id}/contracts"
              payload: { per_unit_monthly_fee_cents: 3495, property_revenue_share_bps: 1500, service_night_days: ["SUN", "MON", "TUE", "WED", "THU"], effective_from: "2026-09-01", effective_to: "2027-08-31", sla_missed_threshold_bps: 1000 }
              as: BillingAnalyst
              as_user_id: "analyst-drafter"
              captures: { contract_id: $.data.id }
            - call: "POST /valet/contracts/${contract_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /valet/contractors"
              payload: { legal_name: "Val Ito", equipment_provided_by_company: true, sets_own_schedule: true, works_exclusively: false, weekly_committed_hours: 20 }
              as: ValetOpsManager
              captures: { ct_id: $.data.id }
            - call: "POST /valet/contractors/${ct_id}/documents"
              payload: { tax_form_type: "W9", direct_deposit_on_file: true }
              as: ValetOpsManager
            - call: "POST /valet/contractors/${ct_id}/background-check"
              payload: { result: "CLEAR" }
              as: ComplianceOfficer
              as_user_id: "co-screener"
            - call: "POST /valet/contractors/${ct_id}/classification"
              payload: { basis: "DECLARED" }
              as: ComplianceOfficer
              as_user_id: "co-screener"
            - call: "POST /valet/contracts/${contract_id}/service-nights"
              payload: { service_date: "2026-09-01", service_window_start: "2026-09-01T18:00:00.000Z", service_window_end: "2026-09-01T22:00:00.000Z" }
              as: ValetOpsManager
              captures: { n1_id: $.data.id, n1_v: $.data.version }
          trigger:
            - call: "POST /valet/service-nights/${n1_id}/route-assignments"
              payload: { contractor_id: "${ct_id}", unit_from: 101, unit_to: 104, unit_coverage_count: 99, expected_service_night_version: "${n1_v}" }
              as: ValetOpsManager
              captures: { rt1_id: $.data.id }
          assert:
            - "HTTP 201 with RouteAssignment.${rt1_id}.unit_coverage_count == 4, NOT 99 — the field is computed from unit_from and unit_to"
            - "RouteAssignment.${rt1_id}.status == 'ASSIGNED', scan_count == 0, accepted_at == null, completed_at == null"
            - "ServiceNight.${n1_id}.assigned_unit_coverage_count == 4"

      - name: service_scan_system_stamped_fields_input_ignored
        claim_type: system_fields
        grounds:
          - entities.ServiceScan.fields.scanned_at
          - entities.ServiceScan.fields.service_night_id
          - entities.ServiceScan.fields.offense_ordinal
          - entities.ServiceScan.fields.tag_status
        distinguishing_aspect: "Client-supplied id, scanned_at and service_night_id are ignored: scanned_at equals the logical clock 2026-09-01T19:30:00.000Z, service_night_id is derived from the route, and the id is server-minted."
        test_recipe:
          setup:
            - "Property 'Cedar Ridge' unit_count 4, contract ACTIVE, resident 101, night 2026-09-01 with an ACCEPTED route over 101-104"
            - "Logical clock advanced to 2026-09-01T19:30:00Z before the scan"
          setup_api_calls:
            - call: "POST /valet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /valet/properties"
              payload: { name: "Cedar Ridge", unit_count: 4, market_code: "ATL" }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /valet/properties/${prop_id}/contracts"
              payload: { per_unit_monthly_fee_cents: 3495, property_revenue_share_bps: 1500, service_night_days: ["SUN", "MON", "TUE", "WED", "THU"], effective_from: "2026-09-01", effective_to: "2027-08-31", sla_missed_threshold_bps: 1000 }
              as: BillingAnalyst
              as_user_id: "analyst-drafter"
              captures: { contract_id: $.data.id }
            - call: "POST /valet/properties/${prop_id}/residents"
              payload: { unit_number: 101, full_name: "Rosa One", move_in_date: "2026-08-01" }
              as: PlatformAdmin
              captures: { r1_id: $.data.id }
            - call: "POST /valet/contracts/${contract_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /valet/contractors"
              payload: { legal_name: "Val Ito", equipment_provided_by_company: true, sets_own_schedule: true, works_exclusively: false, weekly_committed_hours: 20 }
              as: ValetOpsManager
              captures: { ct_id: $.data.id }
            - call: "POST /valet/contractors/${ct_id}/documents"
              payload: { tax_form_type: "W9", direct_deposit_on_file: true }
              as: ValetOpsManager
            - call: "POST /valet/contractors/${ct_id}/background-check"
              payload: { result: "CLEAR" }
              as: ComplianceOfficer
              as_user_id: "co-screener"
            - call: "POST /valet/contractors/${ct_id}/classification"
              payload: { basis: "DECLARED" }
              as: ComplianceOfficer
              as_user_id: "co-screener"
            - call: "POST /valet/contracts/${contract_id}/service-nights"
              payload: { service_date: "2026-09-01", service_window_start: "2026-09-01T18:00:00.000Z", service_window_end: "2026-09-01T22:00:00.000Z" }
              as: ValetOpsManager
              captures: { n1_id: $.data.id, n1_v: $.data.version }
            - call: "POST /valet/service-nights/${n1_id}/route-assignments"
              payload: { contractor_id: "${ct_id}", unit_from: 101, unit_to: 104, expected_service_night_version: "${n1_v}" }
              as: ValetOpsManager
              captures: { rt1_id: $.data.id }
            - call: "POST /valet/route-assignments/${rt1_id}/accept"
              payload: {}
              as: Valet
              as_user_id: "${ct_id}"
            - call: "POST /valet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T19:30:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /valet/route-assignments/${rt1_id}/scans"
              payload: { resident_id: "${r1_id}", scan_result: "SERVICED", container_type: "TRASH_BIN", id: "11111111-1111-4111-8111-111111111111", scanned_at: "2020-01-01T00:00:00.000Z", service_night_id: "00000000-0000-4000-8000-000000000009" }
              as: Valet
              as_user_id: "${ct_id}"
              captures: { sc1_id: $.data.id }
          assert:
            - "HTTP 201 and ServiceScan.${sc1_id}.id != '11111111-1111-4111-8111-111111111111' — the id is server-minted"
            - "ServiceScan.${sc1_id}.scanned_at == '2026-09-01T19:30:00.000Z' — the logical clock, not the client's 2020 value"
            - "ServiceScan.${sc1_id}.service_night_id == '${n1_id}' — derived from the route, not from the body"
            - "ServiceScan.${sc1_id}.tag_status == 'NONE' and offense_ordinal == 0 for a SERVICED scan with no non_compliance_type"

      - name: contract_create_with_illegal_weekday_enum_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
          - entities.ServiceContract.fields.service_night_days
        distinguishing_aspect: "service_night_days containing 'FUNDAY' — not a member of the declared weekday enum — returns HTTP 422 ERR_INVALID_REQUEST, and a share_bps of 12000 (outside [0, 10000]) is rejected the same way."
        test_recipe:
          setup:
            - "Property 'Cedar Ridge' unit_count 4 with no contracts"
          setup_api_calls:
            - call: "POST /valet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /valet/properties"
              payload: { name: "Cedar Ridge", unit_count: 4, market_code: "ATL" }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
          trigger:
            - call: "POST /valet/properties/${prop_id}/contracts"
              payload: { per_unit_monthly_fee_cents: 3495, property_revenue_share_bps: 1500, service_night_days: ["SUN", "FUNDAY"], effective_from: "2026-09-01", effective_to: "2027-08-31", sla_missed_threshold_bps: 1000 }
              as: BillingAnalyst
              as_user_id: "analyst-drafter"
            - call: "POST /valet/properties/${prop_id}/contracts"
              payload: { per_unit_monthly_fee_cents: 3495, property_revenue_share_bps: 12000, service_night_days: ["SUN", "MON"], effective_from: "2026-09-01", effective_to: "2027-08-31", sla_missed_threshold_bps: 1000 }
              as: BillingAnalyst
              as_user_id: "analyst-drafter"
          assert:
            - "the FUNDAY payload returns HTTP 422 with error_id == 'ERR_INVALID_REQUEST'"
            - "the 12000-bps payload returns HTTP 422 with error_id == 'ERR_INVALID_REQUEST' — revenue share is constrained to [0, 10000]"
            - "GET /valet/contracts?property_id=${prop_id} returns 0 rows after both attempts"

      - name: resident_create_under_unknown_property_returns_property_not_found
        claim_type: parent_relationships
        grounds:
          - validations[priority=3]
          - errors[ERR_PROPERTY_NOT_FOUND]
          - entities.Resident.fields.property_id
        distinguishing_aspect: "A nested create under a non-existent parent id returns HTTP 404 ERR_PROPERTY_NOT_FOUND — the path id is validated before the body, so no Resident is written."
        test_recipe:
          setup:
            - "Empty database apart from the logical clock"
          setup_api_calls:
            - call: "POST /valet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /valet/properties/00000000-0000-4000-8000-000000000002/residents"
              payload: { unit_number: 101, full_name: "Rosa One", move_in_date: "2026-08-01" }
              as: PlatformAdmin
          assert:
            - "HTTP 404 with error_id == 'ERR_PROPERTY_NOT_FOUND'"
            - "GET /valet/residents returns total_count == 0"

      - name: scan_of_resident_from_another_property_rejected_cross_property
        claim_type: flat
        grounds:
          - validations[priority=7]
          - errors[ERR_CROSS_PROPERTY_REFERENCE]
          - entities.ServiceScan.fields.resident_id
        distinguishing_aspect: "Entity topology is flat, so a body FK can point anywhere: scanning property A's resident from property B's route returns HTTP 409 ERR_CROSS_PROPERTY_REFERENCE even though both the route and the resident exist."
        test_recipe:
          setup:
            - "Property A 'Cedar Ridge' unit_count 4 with resident 101"
            - "Property B 'Birch Row' unit_count 4, contract ACTIVE, night 2026-09-01 with an ACCEPTED route over 101-104 held by a cleared DECLARED valet"
          setup_api_calls:
            - call: "POST /valet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /valet/properties"
              payload: { name: "Cedar Ridge", unit_count: 4, market_code: "ATL" }
              as: PlatformAdmin
              captures: { propa_id: $.data.id }
            - call: "POST /valet/properties/${propa_id}/residents"
              payload: { unit_number: 101, full_name: "Rosa One", move_in_date: "2026-08-01" }
              as: PlatformAdmin
              captures: { ra1_id: $.data.id }
            - call: "POST /valet/properties"
              payload: { name: "Birch Row", unit_count: 4, market_code: "ATL" }
              as: PlatformAdmin
              captures: { propb_id: $.data.id }
            - call: "POST /valet/properties/${propb_id}/contracts"
              payload: { per_unit_monthly_fee_cents: 3495, property_revenue_share_bps: 1500, service_night_days: ["SUN", "MON", "TUE", "WED", "THU"], effective_from: "2026-09-01", effective_to: "2027-08-31", sla_missed_threshold_bps: 1000 }
              as: BillingAnalyst
              as_user_id: "analyst-drafter"
              captures: { contractb_id: $.data.id }
            - call: "POST /valet/contracts/${contractb_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /valet/contractors"
              payload: { legal_name: "Val Ito", equipment_provided_by_company: true, sets_own_schedule: true, works_exclusively: false, weekly_committed_hours: 20 }
              as: ValetOpsManager
              captures: { ct_id: $.data.id }
            - call: "POST /valet/contractors/${ct_id}/documents"
              payload: { tax_form_type: "W9", direct_deposit_on_file: true }
              as: ValetOpsManager
            - call: "POST /valet/contractors/${ct_id}/background-check"
              payload: { result: "CLEAR" }
              as: ComplianceOfficer
              as_user_id: "co-screener"
            - call: "POST /valet/contractors/${ct_id}/classification"
