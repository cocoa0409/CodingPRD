            - call: "GET /season-records"
              payload: { official_id: "${dan_id}" }
              as: OfficiatingDirector
              captures: { rec_post_cleared: "$.data[0].postseason_eligible", rec_index_cleared: "$.data[0].accuracy_index" }
          assert:
            - "${c1_points} == 0.00 and ${c2_points} == 0.00 — a CORRECT grade accrues nothing even at GAME_CRITICAL impact"
            - "${rec_n_clean} == 3, ${rec_index_clean} == 100.00, ${rec_acc_clean} == true (100.00 >= 95.00 and 3 >= 3) and ${rec_post_clean} == true with ${dan_status_clean} == ACTIVE"
            - "${da_a_status} == OPENED and ${dan_status_open_da} == ACTIVE — an ATTENDANCE WARNING is not one of the status-moving severities"
            - "${rec_index_da} == 100.00 and ${rec_acc_da} == true, yet ${rec_post_da} == false — the open action is the sole failing conjunct"
            - "${da_a_status_end} == CLEARED and ${rec_post_cleared} == true with ${rec_index_cleared} == 100.00 — leaving the non-terminal set restores eligibility without touching accuracy"

      - name: withdrawn_assignment_leaves_the_team_exposure_input_set
        claim_type: input_set_filtering
        grounds:
          - calculations.team_rotation_exposure
          - state_machines.CrewAssignment.PROPOSED_to_WITHDRAWN
          - errors[ERR_TEAM_ROTATION_LIMIT]
        distinguishing_aspect: "team_rotation_exposure counts only assignments in {PROPOSED, CONFIRMED, COMPLETED}, so withdrawing the second BUF assignment drops the count back to 1 and a third BUF game is then accepted rather than rejected at the cap of 2."
        test_recipe:
          setup:
            - "SeasonProgram 2026 is OPEN with crew_size_required 1, max_team_exposures_per_season 2, travel_lead_hours 24 and min_rest_hours_between_games 96."
            - "Dan is ACTIVE and preseason-cleared with affiliated_team_code null."
