            - { call: "POST /officials", payload: { meet_id: "${meet_id}", full_name: "Jud J", lsc_membership_id: "LSC-J1", certifications: ["STROKE_TURN_JUDGE"], certification_expires_on: "2027-01-01" }, as: MeetDirector, captures: { off_jud: "$.data.id" } }
            - { call: "POST /events/${ev1}/official-assignments", payload: { official_id: "${off_ref}", role_on_deck: "REFEREE" }, as: MeetDirector, captures: { oa_ref: "$.data.id" } }
            - { call: "POST /official-assignments/${oa_ref}/confirm", payload: {}, as: MeetReferee, as_user_id: "${off_ref}" }
            - { call: "POST /events/${ev1}/official-assignments", payload: { official_id: "${off_jud}", role_on_deck: "STROKE_TURN_JUDGE" }, as: MeetDirector, captures: { oa_jud: "$.data.id" } }
            - { call: "POST /official-assignments/${oa_jud}/confirm", payload: {}, as: DeckOfficial, as_user_id: "${off_jud}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T00:00:00Z" }, as: Any }
            - { call: "POST /meets/${meet_id}/close-entries", payload: {}, as: MeetDirector, captures: { meet_v: "$.data.version" } }
            - { call: "POST /meets/${meet_id}/seed", payload: { expected_meet_version: "${meet_v}" }, as: MeetDirector }
            - { call: "POST /events/${ev1}/start", payload: {}, as: MeetDirector, captures: { ev_v: "$.data.version" } }
            - { call: "GET /lane-assignments", payload: { entry_id: "${en_a}" }, as: Any, captures: { lane_a: "$.data[0].id" } }
            - { call: "POST /lane-assignments/${lane_a}/readings", payload: { pad_cs: 2400, backup1_cs: 2405, backup2_cs: 2407 }, as: TimingOperator }
            - { call: "POST /events/${ev1}/complete", payload: { expected_event_version: "${ev_v}" }, as: MeetDirector }
            - { call: "POST /events/${ev1}/publish", payload: {}, as: MeetDirector }
            - { call: "GET /records", payload: { event_id: "${ev1}", challenger_entry_id: "${en_a}" }, as: Any, captures: { rec_new: "$.data[0].id" } }
          trigger:
            - { call: "POST /records/${rec_new}/reject", payload: {}, as: RecordsOfficer, captures: { rec_new_st: "$.data.status" } }
