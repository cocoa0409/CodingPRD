        distinguishing_aspect: "Depth-2 cascade triggered by do-not-pay record creation: (1) the new record flags every pre-execution payment of the matching TIN (integrity_status FLAGGED); (2) the flag itself forces VERIFIED payments into processing_status HELD. The sibling cascade is depth 3 and triggered by payment reversal."
