  # ---- RBAC ----------------------------------------------------------------
  - section: rbac
    instances:
      - name: coordinator_cannot_create_client_returns_unauthorized
        claim_type: Role Restriction
        grounds: [roles.Coordinator, roles.Registrar]
        distinguishing_aspect: "POST /clients is Registrar-exclusive; a Coordinator receives ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /clients"
              payload: { name: "Nope", client_type: "INDIVIDUAL", billing_email: "n@x.example" }
              as: Coordinator
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_UNAUTHORIZED"
            - "response.http_status == 403"

      - name: client_books_other_clients_artwork_returns_forbidden
        claim_type: Ownership
        grounds: [roles.Client, "validations[priority=3]"]
        distinguishing_aspect: "A Client (entity_backed) creating a viewing booking with a client_id not equal to its own X-User-ID returns ERR_OWNERSHIP_REQUIRED (403)."
        test_recipe:
          setup: ["two clients C_self and C_other; one artwork owned by C_other; a room"]
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Self", client_type: "INDIVIDUAL", billing_email: "self@x.example" }
              as: Registrar
              captures: { self_id: $.data.id }
            - call: "POST /clients"
              payload: { name: "Other", client_type: "INDIVIDUAL", billing_email: "other@x.example" }
              as: Registrar
              captures: { other_id: $.data.id }
            - call: "POST /artworks"
              payload: { client_id: "${other_id}", title: "Theirs", artist: "T", size_class: "SMALL", fragility_class: "LOW", climate_class: "AMBIENT" }
              as: Registrar
              captures: { art_id: $.data.id }
            - call: "POST /viewing-rooms"
              payload: { name: "Salon 5", capacity_persons: 4 }
              as: Coordinator
              captures: { room_id: $.data.id }
          trigger:
            - call: "POST /viewing-bookings"
              payload: { artwork_id: "${art_id}", viewing_room_id: "${room_id}", client_id: "${other_id}", scheduled_start: "2026-05-02T10:00:00Z", scheduled_end: "2026-05-02T11:00:00Z" }
