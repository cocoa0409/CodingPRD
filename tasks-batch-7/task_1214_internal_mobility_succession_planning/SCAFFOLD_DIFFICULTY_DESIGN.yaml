            - { call: "GET /talent/successors", payload: { critical_role_id: "${r}" }, as: HRBusinessPartner, as_user_id: "${hrbp}" }
          assert:
            - "the 6th add without supersede failed with error_id == ERR_SLATE_FULL (cardinality already at SLATE_MAX 5)"
            - "SuccessorEntry.${e_new}.supersedes_entry_id == ${e3} and slate_position == 3 (inherited from the superseded entry)"
            - "SuccessorEntry.${e3}.status == REMOVED"
            - "the role's non-terminal slate cardinality is 5 before AND after the supersede — |{e: status in {DRAFT, ACTIVE, SUSPENDED}}| invariant holds (5 entries DRAFT + 1 REMOVED in the full list)"

      - name: hold_release_restores_active_hold_count
        grounds:
          - state_machines.PostingApplication.PENDING_MANAGER_CONSENT_to_MANAGER_HOLD
          - state_machines.PostingApplication.MANAGER_HOLD_to_CONSENT_GRANTED
          - entities.Employee.fields.active_hold_count
        distinguishing_aspect: |
          Conserved quantity: the employee's active-hold slot count
          |{a: a.employee_id == E AND a.status == MANAGER_HOLD}|. A hold raises
          it to 1 (a second concurrent hold is rejected with
          ERR_HOLD_LIMIT_REACHED at MAX_ACTIVE_HOLDS = 1); the compensating
          release-hold returns it to exactly its pre-hold value 0, after which
          a fresh hold on the other application succeeds.
        test_recipe:
          setup:
            - "Employee E_H (manager MH) has two PENDING_MANAGER_CONSENT applications on two different postings (two vacancies from two terminated incumbents)"
          setup_api_calls:
            - { call: "POST /talent/employees", payload: { employee_code: "HRPB18", full_name: "Hana Rbp", department: "HR", job_level: 7, hire_date: "2020-01-15", performance_rating: "STRONG" }, as: HRAdmin, captures: { hrbp: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "MGR18", full_name: "Mary Anager", department: "ENG", job_level: 7, hire_date: "2019-01-15", performance_rating: "STRONG" }, as: HRAdmin, captures: { mgr: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "INCA18", full_name: "Ian A", department: "ENG", job_level: 8, hire_date: "2019-03-01", performance_rating: "STRONG" }, as: HRAdmin, captures: { inc_a: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "INCB18", full_name: "Ian B", department: "ENG", job_level: 8, hire_date: "2019-03-01", performance_rating: "STRONG" }, as: HRAdmin, captures: { inc_b: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "EH18", full_name: "Erin Holder", department: "ENG", job_level: 5, hire_date: "2024-05-01", performance_rating: "SOLID", current_manager_id: "${mgr}" }, as: HRAdmin, captures: { e_h: $.data.id } }
            - { call: "POST /talent/critical-roles", payload: { role_title: "Role A", department: "ENG", criticality_tier: "TIER_2", assessment_method: "WEIGHTED" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { r_a: $.data.id } }
            - { call: "POST /talent/critical-roles/${r_a}/activate", payload: { incumbent_employee_id: "${inc_a}" }, as: HRBusinessPartner, as_user_id: "${hrbp}" }
            - { call: "POST /talent/employees/${inc_a}/terminate", as: HRAdmin }
            - { call: "GET /talent/vacancies", payload: { critical_role_id: "${r_a}" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { vac_a: "$.data[0].id" } }
            - { call: "POST /talent/vacancies/${vac_a}/postings", payload: { title: "Role A", planned_open_date: "2026-05-04", planned_close_date: "2026-05-15", min_tenure_months: 12 }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { p_a: $.data.id } }
            - { call: "POST /talent/postings/${p_a}/publish", as: HRBusinessPartner, as_user_id: "${hrbp}" }
            - { call: "POST /talent/critical-roles", payload: { role_title: "Role B", department: "ENG", criticality_tier: "TIER_2", assessment_method: "WEIGHTED" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { r_b: $.data.id } }
            - { call: "POST /talent/critical-roles/${r_b}/activate", payload: { incumbent_employee_id: "${inc_b}" }, as: HRBusinessPartner, as_user_id: "${hrbp}" }
            - { call: "POST /talent/employees/${inc_b}/terminate", as: HRAdmin }
            - { call: "GET /talent/vacancies", payload: { critical_role_id: "${r_b}" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { vac_b: "$.data[0].id" } }
            - { call: "POST /talent/vacancies/${vac_b}/postings", payload: { title: "Role B", planned_open_date: "2026-05-04", planned_close_date: "2026-05-15", min_tenure_months: 12 }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { p_b: $.data.id } }
            - { call: "POST /talent/postings/${p_b}/publish", as: HRBusinessPartner, as_user_id: "${hrbp}" }
            - { call: "POST /talent/postings/${p_a}/applications", as: Employee, as_user_id: "${e_h}", captures: { app1: $.data.id } }
            - { call: "POST /talent/postings/${p_b}/applications", as: Employee, as_user_id: "${e_h}", captures: { app2: $.data.id } }
          trigger:
            - { call: "POST /talent/applications/${app1}/hold", payload: { hold_reason: "CRITICAL_PROJECT" }, as: Manager, as_user_id: "${mgr}" }
            - { call: "GET /talent/employees/${e_h}", as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { cnt_after_hold: $.data.active_hold_count } }
            - { call: "POST /talent/applications/${app2}/hold", payload: { hold_reason: "PERFORMANCE_PLAN" }, as: Manager, as_user_id: "${mgr}", captures: { err: $.data.error_id } }
            - { call: "POST /talent/applications/${app1}/release-hold", as: Manager, as_user_id: "${mgr}" }
            - { call: "GET /talent/employees/${e_h}", as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { cnt_after_release: $.data.active_hold_count } }
            - { call: "POST /talent/applications/${app2}/hold", payload: { hold_reason: "PERFORMANCE_PLAN" }, as: Manager, as_user_id: "${mgr}", captures: { st2: $.data.status } }
          assert:
            - "after the first hold: Employee.${e_h}.active_hold_count == 1"
            - "the concurrent second hold fails with error_id == ERR_HOLD_LIMIT_REACHED (MAX_ACTIVE_HOLDS = 1)"
            - "after release-hold: Employee.${e_h}.active_hold_count == 0 — the hold + release pair leaves the conserved count unchanged"
            - "the retried hold on ${app2} now succeeds: PostingApplication.${app2}.status == MANAGER_HOLD"
