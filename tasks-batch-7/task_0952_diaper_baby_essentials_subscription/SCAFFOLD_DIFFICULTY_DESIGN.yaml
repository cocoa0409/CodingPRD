            - "no GiftOrder exists with registry_item_id == ${item_id}"

      - name: not_registry_owner_beats_registry_state_invalid
        grounds:
          - validations[priority=13]
          - validations[priority=27]
          - errors[ERR_NOT_REGISTRY_OWNER]
          - errors[ERR_REGISTRY_STATE_INVALID]
        distinguishing_aspect: |
          Category pair auth (priority 13, ERR_NOT_REGISTRY_OWNER) versus state (priority 27,
          ERR_REGISTRY_STATE_INVALID) — a third distinct pairing: a stranger reopening a registry
          that is still DRAFT violates both, and gate G5_OWNERSHIP outranks G7_LIFECYCLE.
        test_recipe:
          setup:
            - "Registry owned by account O sitting in DRAFT (never opened, so reopen is not a legal transition)."
            - "A second verified account X exists and acts with the RegistryOwner role but a foreign X-User-ID."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
