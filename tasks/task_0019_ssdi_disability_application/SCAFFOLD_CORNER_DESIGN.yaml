      - name: child_auxiliary_cdr_cessation_cascade_already_covered_by_difficulty
        claim_type: cascade_down
        grounds:
          - state_machines.Application.transitions.CDR_FROZEN_to_CESSATION
        excluded_because:
          difficulty_instance: cdr_cessation_cascade_application_award_children_supplement
          rationale: "Depth-3 cascade asserted as the side-effect chain of the named §1.8 transitive_cascade instance."

      - name: hearing_cancel_revert_already_covered_by_difficulty
        claim_type: cascade_down
        grounds:
          - state_machines.HearingRequest.transitions.REQUESTED_to_CANCELLED
        excluded_because:
          difficulty_instance: hearing_cancel_cascade_application_revert_to_reconsideration
          rationale: "Cancel→revert cascade is the §1.8 transitive_cascade instance."

  # =========================================================================
  # Section: calculations
  # =========================================================================
  - section: calculations
    instances:

      - name: pia_low_aime_only_tier1_applies
        claim_type: correct_result
        grounds:
          - calculations.pia_amount
        distinguishing_aspect: "AIME below BEND1 ($1,174 = 117400 cents) means only tier1 applies: PIA = round(0.9 * AIME). For AIME=100000, PIA=90000."
        test_recipe:
          setup:
            - "Claimant with 12 years credits at $12,000/yr earnings = 1200000 cents/yr → AIME = (12*1200000)/(12*12) = 100000 cents."
            - "Application submitted, evidence attached, approved at MEDICAL_REVIEW."
          setup_api_calls:
            - call: "POST /ssdi/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T00:00:00Z" }
              as: SSAAdmin
            - call: "POST /ssdi/claimants"
              payload: { ssn_last4: "2001", full_name: "Low PIA", date_of_birth: "1980-01-01T00:00:00Z", filing_state: "TX" }
              as: SSAAdmin
              captures: { lp_id: "$.data.id" }
            - call: "POST /ssdi/work-credits"
              payload: { claimant_id: "${lp_id}", year: 2014, credits_earned: 4, earnings_cents: 1200000 }
              as: SSAAdmin
            - call: "POST /ssdi/work-credits"
              payload: { claimant_id: "${lp_id}", year: 2015, credits_earned: 4, earnings_cents: 1200000 }
              as: SSAAdmin
            - call: "POST /ssdi/work-credits"
              payload: { claimant_id: "${lp_id}", year: 2016, credits_earned: 4, earnings_cents: 1200000 }
              as: SSAAdmin
            - call: "POST /ssdi/work-credits"
              payload: { claimant_id: "${lp_id}", year: 2017, credits_earned: 4, earnings_cents: 1200000 }
              as: SSAAdmin
            - call: "POST /ssdi/work-credits"
              payload: { claimant_id: "${lp_id}", year: 2018, credits_earned: 4, earnings_cents: 1200000 }
              as: SSAAdmin
            - call: "POST /ssdi/work-credits"
              payload: { claimant_id: "${lp_id}", year: 2019, credits_earned: 4, earnings_cents: 1200000 }
