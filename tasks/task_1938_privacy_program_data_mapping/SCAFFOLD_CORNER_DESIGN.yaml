      - name: rbac_shared_reads_allowed_for_all_staff
        claim_type: shared_operation_allowed
        grounds: [roles]
        distinguishing_aspect: "All five staff roles can read a vendor; Consumer cannot (not in the GET roles list)."
        test_recipe:
          setup: ["one vendor"]
