          - calculations.traveler_credited_seniority_hours.precision
          - entities.Registration.fields.credited_seniority_hours
        excluded_because:
          difficulty_instance: traveler_credit_rounds_per_entry_then_sums
          rationale: "That §1.8 combinatorial_formula instance already pins the rounding order with two .5-boundary entries (1003 h -> 502 and 1005 h -> 503, total 1005 versus 1004 for the sum-then-round order), which is exactly the precision claim for this calculation."
      - name: dispatch_order_variants_rank_the_same_registrants_differently
        claim_type: variant_divergence
        grounds:
          - calculations.dispatch_order_ranking.variants
          - endpoints["GET /hiring-hall/job-requests/{id}/dispatch-order"]
        excluded_because:
          difficulty_instance: dispatch_order_variant_diverges_on_short_call
          rationale: "That §1.8 dual_variant_calc instance holds the registrant data fixed and shows STRICT_GROUP_ORDER and SHORT_CALL_INTERFILED returning different rank-1 registrations, with both variants' full sort keys asserted."
      - name: back_pay_switches_variant_when_the_dispatch_ends
        claim_type: reconciliation
        grounds:
          - calculations.back_pay_make_whole.variants
          - entities.Grievance.fields.back_pay_variant
        excluded_because:
          difficulty_instance: back_pay_variant_diverges_on_dispatch_status
          rationale: "That §1.8 dual_variant_calc instance adjudicates the same grievance shape against a WORKING dispatch and an ended one, asserting both the SCHEDULED_HOURS projection (per-day rounding) and the ACTUAL_HOURS single rounding plus the delta between them."
