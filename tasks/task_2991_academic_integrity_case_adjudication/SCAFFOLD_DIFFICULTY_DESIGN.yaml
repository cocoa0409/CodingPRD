  - rule_id: priority_pair_validation_conflict
    instances:

      - name: state_check_priority_13_outranks_notice_period_priority_38_and_returns_case_state_invalid
        grounds:
          - validations[priority=13]
          - validations[priority=38]
          - designed_priority_conflicts.state-outranks-temporal-on-hearing-scheduling
          - errors.ERR_CASE_STATE_INVALID
          - errors.ERR_NOTICE_PERIOD_TOO_SHORT
        distinguishing_aspect: |
          A single POST /integrity/hearing-sessions violates BOTH the state gate at priority 13 (the case
          is already HEARING_SCHEDULED, which is not in the {NOTIFIED, FORMAL_REFERRED} entry set) and the
          notice-lead-time gate at priority 38 (start_at is 2 days after the ALLEGATION_NOTICE, far short
          of the 10-day minimum). Only ERR_CASE_STATE_INVALID (409) may come back. An implementation that
          validates temporal windows before state - the natural order if you check the request payload
          first and the stored aggregate second - returns ERR_NOTICE_PERIOD_TOO_SHORT and fails.
