  # ===========================================================================
  - section: validations
    instances:
      - name: missing_auth_header_returns_400
        claim_type: priority_ordering
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_MISSING_CONTEXT_HEADER]"
        distinguishing_aspect: "Auth outranks existence: a request sent with no X-User-ID / X-User-Role headers against a NONEXISTENT client id still returns 400 ERR_MISSING_CONTEXT_HEADER, never 404."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /bpp/clients/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "Request is sent WITHOUT X-User-ID and X-User-Role headers"
            - "err == ERR_MISSING_CONTEXT_HEADER and HTTP status == 400 (priority 1 beats the nonexistent id at priority 3)"

      - name: duplicate_rendition_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=18]"
          - "errors[ERR_DUPLICATE_RENDITION]"
