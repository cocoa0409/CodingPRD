          org_type: TEAM
          primary_admin_id: ${ba0}
        as: SystemAdmin
        captures:
          o5: $.data.id
      - call: POST /licensing/admins
        payload:
          email: oa5@o5.com
          full_name: Admin Five
          admin_kind: SYSTEM_ADMIN
          org_id: ${o5}
        as: SystemAdmin
        captures:
          oa5: $.data.id
      - call: POST /licensing/plans
        payload:
          code: P5
          segment: TEAM
          billing_model: MONTHLY
          monthly_price_cents: 3000
          annual_monthly_price_cents: 3000
          storage_gb_per_seat: 20
          seat_limit: -1
          deployment_modes:
          - NAMED_USER
          allows_offline_activation: false
          max_devices_per_seat: 2
          cancellation_window_days: 14
          etf_rate_pct: 0
        as: SystemAdmin
        captures:
          p5: $.data.id
      - call: POST /licensing/subscriptions
        payload:
          org_id: ${o5}
          plan_id: ${p5}
          seats_purchased: 2
        as: SystemAdmin
        captures:
          s5: $.data.id
      - call: POST /licensing/subscriptions/${s5}/activate
        payload: {}
        as: SystemAdmin
        captures:
          s5v: $.data.version
      - call: POST /licensing/seats
        payload:
          subscription_id: ${s5}
          expected_subscription_version: ${s5v}
        as: SystemAdmin
        captures:
          se5a: $.data.id
      - call: POST /licensing/end-users
        payload:
          email: u5a@o5.com
          full_name: User Five A
          org_id: ${o5}
        as: OrgAdmin
        as_user_id: ${oa5}
        captures:
          u5a: $.data.id
      - call: POST /licensing/seats/${se5a}/assign
        payload:
          end_user_id: ${u5a}
        as: OrgAdmin
        as_user_id: ${oa5}
      - call: POST /licensing/end-users/${u5a}/deactivate
        payload: {}
        as: OrgAdmin
        as_user_id: ${oa5}
      - call: POST /licensing/end-users/${u5a}/reactivate
        payload: {}
        as: OrgAdmin
        as_user_id: ${oa5}
      trigger:
