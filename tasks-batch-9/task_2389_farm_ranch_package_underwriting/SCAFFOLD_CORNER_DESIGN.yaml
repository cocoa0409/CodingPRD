            - call: "POST /farm-policies/${pol_id}/scheduled-items"
              payload: { item_class: "EQUIPMENT", description: "Combine", valuation_basis: "ACV", stated_value_cents: 30001000, age_years: 12, condition_grade: "B" }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { e_t2: $.data.error_id }
            - call: "PATCH /scheduled-items/${it_dw}"
              payload: { stated_value_cents: 45000000 }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { e_t3: $.data.error_id }
            - call: "PUT /farm-policies/${pol_id}/labor-profile"
              payload: { full_time_count: 1, seasonal_count: 0, migrant_h2a_count: 0 }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { e_t4: $.data.error_id }
            - call: "POST /inspections"
              payload: { policy_id: "${pol_id}", inspector_id: "${insp_id}", inspection_type: "INITIAL", scheduled_for: "2026-08-18T09:00:00Z", duration_minutes: 120 }
