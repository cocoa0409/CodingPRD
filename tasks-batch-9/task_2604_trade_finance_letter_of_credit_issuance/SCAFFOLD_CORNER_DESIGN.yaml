      - name: amendment_lifecycle_guards_reject_out_of_order_calls
        claim_type: error_triggerable
        grounds:
          - errors.ERR_EMPTY_CHANGE_SET
          - errors.ERR_AMENDMENT_NOT_PENDING_CONSENT
          - errors.ERR_AMENDMENT_NOT_DRAFT
          - errors.ERR_CONSENT_WINDOW_CLOSED
          - state_machines.Amendment
          - calculations.amendment_consent_requirement
        distinguishing_aspect: |
          Four amendment errors, each pinned to a different reason for refusing the
          same two endpoints. A change_set that only restates the credit's current
          amount_cents is 422 ERR_EMPTY_CHANGE_SET and no Amendment row is created.
          Consent on a DRAFT amendment is 409 ERR_AMENDMENT_NOT_PENDING_CONSENT -
          not NOT_FOUND, the row exists. Issuing the same amendment twice is 409
          ERR_AMENDMENT_NOT_DRAFT, which is a DIFFERENT error from the consent
          guard even though both are "wrong status". And consent on
          2026-08-21 against a consent_deadline_date of 2026-08-20 is 409
          ERR_CONSENT_WINDOW_CLOSED even though the row is still PENDING_CONSENT,
          because the deadline is enforced at the endpoint and not only by the
          sweep.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T09:00:00Z."
            - "Standard fixture: applicant Baltic Timber Imports AS (NO, CLEARED), USD facility limit_cents 50000000 collateral_required_pct 0 expiring 2027-06-30, bank Nordkyst Bank NDKBNOKK (NO, risk 12, AA, appetite 90000000), beneficiary Riga Sawmill SIA (LV, nominated bank = Nordkyst)."
            - "One credit of amount_cents 10000000, SIGHT_PAYMENT, tenor_days 0, tolerance_pct 0, FOB, latest_shipment_date 2026-10-31, expiry_date 2026-11-30, presentation_period_days 21, drafted by tfo_1, approved by co_2, issued and now ISSUED."
            - "AMENDMENT_CONSENT_DAYS is 10, so an amendment issued on 2026-08-10 carries consent_deadline_date 2026-08-20."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: SystemOperator
              as_user_id: "sysop_1"
            - call: "POST /applicants"
              payload: { legal_name: "Baltic Timber Imports AS", country_code: "NO", industry_code: "4671", internal_risk_grade: "A", kyc_status: "CLEARED" }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { app_id: $.data.id }
            - call: "POST /applicants/${app_id}/facilities"
              payload: { currency: "USD", limit_cents: 50000000, collateral_required_pct: 0, facility_expiry_date: "2027-06-30" }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { fac_id: $.data.id }
            - call: "POST /banks"
              payload: { bank_name: "Nordkyst Bank", swift_bic: "NDKBNOKK", country_code: "NO", country_risk_score: 12, credit_rating: "AA", confirmation_appetite_cents: 90000000 }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { bank_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { beneficiary_name: "Riga Sawmill SIA", country_code: "LV", nominated_bank_id: "${bank_id}" }
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
              captures: { ben_id: $.data.id }
            - call: "POST /credits"
              payload: { applicant_id: "${app_id}", beneficiary_id: "${ben_id}", facility_id: "${fac_id}", advising_bank_id: "${bank_id}", currency: "USD", amount_cents: 10000000, available_by: "SIGHT_PAYMENT", tenor_days: 0, tolerance_pct: 0, incoterm: "FOB", incoterm_place: "Port of Riga", latest_shipment_date: "2026-10-31", expiry_date: "2026-11-30", expiry_place: "Oslo", presentation_period_days: 21 }
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
              captures: { cr_id: $.data.id }
            - call: "POST /credits/${cr_id}/documentary-requirements"
