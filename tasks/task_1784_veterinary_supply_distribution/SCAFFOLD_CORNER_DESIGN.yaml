    distinguishing_aspect: 'Each role is refused another role''s exclusive operation with ERR_UNAUTHORIZED_ROLE (403): ComplianceOfficer cannot create products, ClinicBuyer cannot create clinics, AccountManager
      cannot resolve quarantine, SystemAdmin cannot read business resources.'
