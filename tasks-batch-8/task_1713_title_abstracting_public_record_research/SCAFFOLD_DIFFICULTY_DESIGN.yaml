          - state_machines.AbstractOrder.SEARCH_IN_PROGRESS_to_SEARCH_COMPLETE
          - state_machines.LegalDescriptionCheck
          - entities.AbstractOrder.fields.legal_hold
        distinguishing_aspect: |
          Entity pair AbstractOrder x LegalDescriptionCheck (with all SearchAssignments
          already ACCEPTED): the compound order transition is gated on legal_hold —
          a different cross-entity pair than the report x curative gate.
        test_recipe:
          setup:
            - "Order with one assignment submitted and a legal description check in MISMATCH (legal_hold true)"
          setup_api_calls:
            - call: "POST /api/abstract-orders"
              payload: { client_ref: "client_762", property_address: "900 Lavaca St", county: "Travis", state_code: "TX", legal_description_text: "LOT 15 BLK O", search_period_years: 30, effective_date: "2026-01-15" }
              as: Client
              as_user_id: client_762
              captures: { ord: $.data.id }
            - call: "POST /api/search-assignments"
              payload: { order_id: "${ord}", abstracter_ref: "abs_762", search_type: "CHAIN_OF_TITLE", window_start: "2026-08-01T09:00:00Z", window_end: "2026-08-01T17:00:00Z" }
              as: OperationsManager
              captures: { asg: $.data.id }
            - call: "POST /api/record-documents"
              payload: { order_id: "${ord}", assignment_id: "${asg}", instrument_type: "DEED", grantor_name: "A Smith", grantee_name: "B Jones", instrument_number: "INST-762-A", recording_date: "2014-12-01" }
              as: Abstracter
              as_user_id: abs_762
              captures: { doc: $.data.id }
            - call: "POST /api/record-documents/${doc}/verify"
              payload: {}
              as: Abstracter
              as_user_id: abs_762
            - call: "POST /api/legal-description-checks"
              payload: { order_id: "${ord}", survey_reference: "SURV-2026-100", checked_legal_description: "LOT 15 BLK O EXCEPT S 10 FT" }
              as: OperationsManager
              captures: { chk: $.data.id }
            - call: "POST /api/legal-description-checks/${chk}/submit-verdict"
              payload: { verdict: "MISMATCH", survey_exception_applied: true }
              as: OperationsManager
            - call: "POST /api/search-assignments/${asg}/submit"
              payload: {}
              as: Abstracter
              as_user_id: abs_762
          trigger:
            - call: "POST /api/search-assignments/${asg}/accept"
              payload: {}
              as: Examiner
              as_user_id: ex_762
            - call: "GET /api/abstract-orders/${ord}"
              as: OperationsManager
              captures: { st_blocked: $.data.status, hold1: $.data.legal_hold }
            - call: "POST /api/legal-description-checks/${chk}/resolve"
              payload: { resolved_description: "LOT 15 BLK O EXCEPT S 10 FT" }
              as: OperationsManager
            - call: "GET /api/abstract-orders/${ord}"
              as: OperationsManager
              captures: { st_free: $.data.status, hold2: $.data.legal_hold, ldt: $.data.legal_description_text }
          assert:
            - "captured hold1 == true and st_blocked == SEARCH_IN_PROGRESS (all assignments ACCEPTED yet the order cannot advance)"
            - "captured hold2 == false and st_free == SEARCH_COMPLETE (resolving the check released the guarded transition)"
            - "captured ldt == LOT 15 BLK O EXCEPT S 10 FT (order legal description overwritten by the resolution)"

  # =====================================================================
  # Rule 8 — resource_temporal_overlap
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: abstracter_window_half_open_touch_allowed_intersection_rejected
        grounds:
          - validations[priority=11]
        distinguishing_aspect: |
          Pure half-open interval semantics on the abstracter schedule resource:
          [09:00,11:00) and [11:00,13:00) touch and are BOTH legal; [12:30,14:00)
          intersects and is rejected. Distinct resource and interval geometry from
          the examiner buffered-slot rule.
        test_recipe:
          setup:
            - "Order with assignment A for abs_771 occupying [2026-08-01T09:00, 2026-08-01T11:00)"
          setup_api_calls:
            - call: "POST /api/abstract-orders"
              payload: { client_ref: "client_771", property_address: "1100 E 11th St", county: "Travis", state_code: "TX", legal_description_text: "LOT 16 BLK P", search_period_years: 30, effective_date: "2026-01-15" }
              as: Client
              as_user_id: client_771
              captures: { ord: $.data.id }
            - call: "POST /api/search-assignments"
              payload: { order_id: "${ord}", abstracter_ref: "abs_771", search_type: "CHAIN_OF_TITLE", window_start: "2026-08-01T09:00:00Z", window_end: "2026-08-01T11:00:00Z" }
              as: OperationsManager
              captures: { asgA: $.data.id }
          trigger:
            - call: "POST /api/search-assignments"
              payload: { order_id: "${ord}", abstracter_ref: "abs_771", search_type: "LIEN_JUDGMENT_TAX", window_start: "2026-08-01T11:00:00Z", window_end: "2026-08-01T13:00:00Z" }
              as: OperationsManager
              captures: { asgB: $.data.id }
            - call: "POST /api/search-assignments"
              payload: { order_id: "${ord}", abstracter_ref: "abs_771", search_type: "LIEN_JUDGMENT_TAX", window_start: "2026-08-01T12:30:00Z", window_end: "2026-08-01T14:00:00Z" }
              as: OperationsManager
              captures: { err: $.data.error_id }
          assert:
            - "touching window [11:00,13:00) was ACCEPTED (captured asgB is a uuid; HTTP 201) — half-open semantics treat end==start as no overlap"
            - "intersecting window [12:30,14:00) rejected: captured err == ERR_WINDOW_OVERLAP, HTTP 409"

      - name: examiner_review_slot_thirty_minute_buffer
        grounds:
          - validations[priority=12]
        distinguishing_aspect: |
          Buffered-gap interval semantics on the examiner schedule resource: a
          non-overlapping slot is STILL rejected when the gap to an existing slot is
          under 30 minutes (11:15 start -> gap 15), while exactly 30 minutes is
          allowed — buffer semantics, not pure overlap, on a different resource.
        test_recipe:
          setup:
            - "Two orders each driven to a SUBMITTED report; examiner ex_772 books report R1 for [2026-08-02T10:00, 2026-08-02T11:00)"
          setup_api_calls:
            - call: "POST /api/abstract-orders"
              payload: { client_ref: "client_772", property_address: "1200 Red River", county: "Travis", state_code: "TX", legal_description_text: "LOT 17 BLK Q", search_period_years: 30, effective_date: "2026-01-15" }
              as: Client
              as_user_id: client_772
              captures: { ord1: $.data.id }
            - call: "POST /api/search-assignments"
              payload: { order_id: "${ord1}", abstracter_ref: "abs_772a", search_type: "CHAIN_OF_TITLE", window_start: "2026-08-01T09:00:00Z", window_end: "2026-08-01T12:00:00Z" }
              as: OperationsManager
              captures: { asg1: $.data.id }
            - call: "POST /api/record-documents"
              payload: { order_id: "${ord1}", assignment_id: "${asg1}", instrument_type: "DEED", grantor_name: "A Smith", grantee_name: "B Jones", instrument_number: "INST-772-A", recording_date: "2010-01-01" }
              as: Abstracter
              as_user_id: abs_772a
              captures: { doc1: $.data.id }
            - call: "POST /api/record-documents/${doc1}/verify"
              payload: {}
              as: Abstracter
              as_user_id: abs_772a
            - call: "POST /api/search-assignments/${asg1}/submit"
              payload: {}
              as: Abstracter
              as_user_id: abs_772a
            - call: "POST /api/search-assignments/${asg1}/accept"
              payload: {}
              as: Examiner
              as_user_id: ex_772
            - call: "GET /api/abstract-orders/${ord1}"
              as: OperationsManager
              captures: { ord1_v: $.data.version }
            - call: "POST /api/abstract-reports"
              payload: { order_id: "${ord1}", title: "Report 772-1", expected_abstract_order_version: "${ord1_v}" }
              as: Abstracter
              as_user_id: abs_772a
              captures: { rep1: $.data.id }
            - call: "POST /api/abstract-reports/${rep1}/submit"
              payload: {}
              as: Abstracter
              as_user_id: abs_772a
            - call: "POST /api/abstract-reports/${rep1}/start-review"
              payload: { review_slot_start: "2026-08-02T10:00:00Z", review_slot_end: "2026-08-02T11:00:00Z" }
              as: Examiner
