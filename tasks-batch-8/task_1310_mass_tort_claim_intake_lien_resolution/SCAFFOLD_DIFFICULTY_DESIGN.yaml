              as: RecordsAnalyst
              captures: { r2_high: $.data.id }
            - call: "POST /settlement-programs/${pid_high}/claims/${cid_high}/medical-records/${r1_high}/accept"
              payload: {}
              as: RecordsAnalyst
            - call: "POST /settlement-programs/${pid_high}/claims/${cid_high}/medical-records/${r2_high}/accept"
              payload: {}
              as: RecordsAnalyst
            - call: "POST /settlement-programs/${pid_high}/claims/${cid_high}/verify-injury"
              payload: {}
