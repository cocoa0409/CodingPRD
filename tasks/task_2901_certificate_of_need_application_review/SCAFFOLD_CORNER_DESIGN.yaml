      - name: every_unknown_identifier_class_returns_its_own_not_found_code
        claim_type: error_triggerability
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - errors[ERR_CYCLE_NOT_FOUND]
          - errors[ERR_LOI_NOT_FOUND]
          - errors[ERR_APPLICATION_NOT_FOUND]
          - errors[ERR_COMPLETENESS_REVIEW_NOT_FOUND]
          - errors[ERR_INTERVENTION_NOT_FOUND]
          - errors[ERR_HEARING_NOT_FOUND]
          - errors[ERR_CERTIFICATE_NOT_FOUND]
          - errors[ERR_APPEAL_NOT_FOUND]
          - errors[ERR_FORMULA_NOT_FOUND]
          - errors[ERR_HEARING_ROOM_NOT_FOUND]
        distinguishing_aspect: "Each identifier class maps to its OWN 404 code rather than a generic not-found: path parameters resolve left to right and body foreign keys resolve in the order the fields appear in the endpoint's input list, so a valid hsa_id with a bogus formula_id yields ERR_FORMULA_NOT_FOUND and a valid batching_cycle_id with a bogus hearing_room_id yields ERR_HEARING_ROOM_NOT_FOUND."
        test_recipe:
          setup:
            - "Only HSA-NORTH and the ACUTE_CARE_BEDS formula exist; there are no cycles, letters, applications, interventions, hearings, certificates or appeals."
            - "Every identifier used below is a syntactically valid UUID that matches no stored row."
