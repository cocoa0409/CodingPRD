      - name: measured_abv_of_exactly_half_a_percent_is_alcoholic
        grounds:
          - calculations.abv_class_boundary
          - constants.NA_ABV_THRESHOLD_PCT
          - entities.FinishedLot.fields.abv_class
          - state_machines.PackagingRun.complete_run
        distinguishing_aspect: |
          The boundary is the numeric ABV threshold on
          POST /packaging-runs/{id}/complete: a measured 0.50 is ALCOHOLIC
          because the rule is at-or-above, while the projected 0.49 on the same
          batch stays NON_ALCOHOLIC.
