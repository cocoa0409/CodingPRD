  - method: GET
    path: "/shipments/{id}"
    description: "Read one shipment, including live days_past_due, late_fee and aging_bucket"
    roles: [SalesRep, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: Shipment
    side_effects: ["days_past_due, late_fee and aging_bucket re-derived per calculations.invoice_aging_and_late_fee"]

  - method: GET
    path: "/shipments"
