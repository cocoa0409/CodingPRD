              captures: { pn1_id: $.data.id }
            - call: "POST /voip/devices"
              payload: { account_id: "${acct_id}", mac_address: "AABBCC004301", device_type: "HANDSET", nomadic: false, assigned_number_id: "${pn1_id}" }
              as: AccountAdmin
              as_user_id: "${acct_id}"
              captures: { dev_id: $.data.id }
            - call: "POST /voip/e911-registrations"
              payload: { device_id: "${dev_id}", jurisdiction_id: "${jur_id}", address_line1: "42 QUILL QUAY", unit: "", city: "OAKLAND", state_code: "CA", postal_code: "94601" }
              as: AccountAdmin
              as_user_id: "${acct_id}"
              captures: { reg_id: $.data.id }
            - call: "POST /voip/e911-registrations/${reg_id}/verify"
              payload: { outcome: "VERIFIED" }
              as: E911Validator
            - call: "POST /voip/fee-assessments"
              payload: { account_id: "${acct_id}", jurisdiction_id: "${jur_id}", period_month: "2026-08" }
              as: BillingAdmin
              as_user_id: "billing-1"
              captures: { prov1_id: $.data.id }
          trigger:
            - call: "POST /voip/fee-assessments"
              payload: { account_id: "${acct_id}", jurisdiction_id: "${jur_id}", period_month: "2026-08" }
              as: BillingAdmin
              as_user_id: "billing-1"
            - call: "POST /voip/fee-assessments/${prov1_id}/void"
              payload: { void_note: "re-assessing" }
