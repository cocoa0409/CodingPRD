  - method: POST
    path: "/api/leave-bids"
    description: "Employee submits a vacation/personal-day bid."
    roles: [Employee]
    code: 201
    input: [employee_id, leave_type, start_date, end_date]
    output: LeaveBid
    side_effects: []

  - method: GET
    path: "/api/leave-bids"
    description: "Filtered leave-bid list."
    roles: [CrewManager, CrewCaller, Employee]
    code: 200
    input: ["employee_id?", "bid_status?", "limit?", "offset?"]
    output: "LeaveBid[]"
    side_effects: []

  - method: GET
    path: "/api/leave-bids/{id}"
    description: "Fetch one leave bid."
    roles: [CrewManager, CrewCaller, Employee]
    code: 200
    input: []
    output: LeaveBid
    side_effects: []

  - method: POST
    path: "/api/leave-bids/{id}/award"
    description: "Manager awards a bid (quota + overlap gated)."
    roles: [CrewManager]
    code: 200
    input: []
    output: LeaveBid
    side_effects: ["Employee -> ON_LEAVE", "slots VACATED", "board_rotation renumber"]

  - method: POST
    path: "/api/leave-bids/{id}/deny"
    description: "Manager denies a bid."
    roles: [CrewManager]
    code: 200
    input: []
    output: LeaveBid
    side_effects: []

  - method: POST
    path: "/api/leave-bids/{id}/cancel"
    description: "Employee cancels a submitted or not-yet-started awarded bid."
    roles: [Employee]
    code: 200
    input: []
    output: LeaveBid
    side_effects: ["if AWARDED: Employee ON_LEAVE -> AVAILABLE, appended to board tail"]

  - method: POST
    path: "/api/pay-records"
    description: "Manually create a DRAFT pay record for an assignment (e.g., supplemental claim)."
    roles: [Employee]
    code: 201
    input: [employee_id, assignment_id, claimed_minutes, "claimed_deadhead_minutes?"]
    output: PayRecord
    side_effects: []

  - method: GET
    path: "/api/pay-records"
    description: "Filtered pay-record list."
    roles: [CrewManager, CrewCaller, Employee]
    code: 200
    input: ["employee_id?", "assignment_id?", "record_status?", "limit?", "offset?"]
    output: "PayRecord[]"
    side_effects: []

  - method: GET
    path: "/api/pay-records/{id}"
    description: "Fetch one pay record."
    roles: [CrewManager, CrewCaller, Employee]
    code: 200
    input: []
    output: PayRecord
    side_effects: []

  - method: POST
    path: "/api/pay-records/{id}/submit"
    description: "Employee submits a draft claim; provisional pay computed."
    roles: [Employee]
    code: 200
    input: []
    output: PayRecord
    side_effects: ["agreement_pay PROVISIONAL"]

  - method: POST
    path: "/api/pay-records/{id}/dispute"
    description: "Manager disputes a submitted claim."
    roles: [CrewManager]
    code: 200
    input: []
    output: PayRecord
    side_effects: []

  - method: POST
    path: "/api/pay-records/{id}/resubmit"
    description: "Employee amends and resubmits a disputed claim."
    roles: [Employee]
    code: 200
    input: [claimed_minutes, "claimed_deadhead_minutes?"]
    output: PayRecord
    side_effects: ["agreement_pay PROVISIONAL recomputed"]

  - method: POST
    path: "/api/pay-records/{id}/finalize"
    description: "Manager finalizes a submitted claim; FINAL pay variant computed (OCC-guarded)."
    roles: [CrewManager]
    code: 200
    input: [expected_pay_record_version]
    output: PayRecord
    side_effects: ["agreement_pay FINAL", "increments PayRecord.version by 1"]

  - method: POST
    path: "/api/jobs/{id}/crew-shortages"
    description: "Manager declares a crew shortage on a job (e.g., an on-duty crew member must be relieved, or calling has failed to cover the job)."
    roles: [CrewManager]
    code: 201
    input: []
    output: CrewShortage
    side_effects: ["CrewShortage created with shortage_status OPEN, craft taken from the job"]

  - method: POST
    path: "/api/crew-shortages/{id}/begin-recrew"
    description: "Manager begins recrew coordination on an open shortage."
    roles: [CrewManager]
    code: 200
    input: []
    output: CrewShortage
    side_effects: []

  - method: POST
    path: "/api/crew-shortages/{id}/resolve"
    description: "Manager resolves a shortage by recrewing: target assignment relieved, replacement created."
    roles: [CrewManager]
    code: 200
    input: [assignment_id, relieving_employee_id, "deadhead_minutes?"]
    output: CrewShortage
    side_effects: ["target Assignment ON_DUTY -> RECREWED", "replacement Assignment ON_DUTY created", "relieved Employee -> ON_REST (RestPeriod opens)", "relieving Employee AVAILABLE -> ON_ASSIGNMENT"]

  - method: POST
    path: "/api/crew-shortages/{id}/escalate"
    description: "Manager escalates an open or recrewing shortage."
    roles: [CrewManager]
    code: 200
    input: []
    output: CrewShortage
    side_effects: []

  - method: GET
    path: "/api/crew-shortages"
    description: "Filtered shortage list."
    roles: [CrewManager, CrewCaller]
    code: 200
    input: ["job_id?", "shortage_status?", "limit?", "offset?"]
    output: "CrewShortage[]"
    side_effects: []

  - method: GET
    path: "/api/crew-shortages/{id}"
    description: "Fetch one crew shortage."
    roles: [CrewManager, CrewCaller]
    code: 200
    input: []
    output: CrewShortage
    side_effects: []

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing/blank X-User-Role or X-User-ID header, or undeclared role name"
  - id: ERR_UNAUTHORIZED_ROLE
    http: 403
    condition: "role not permitted on this endpoint (e.g., Employee issuing a call, CrewCaller finalizing pay)"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "entity-backed Employee id does not match the target resource's employee reference"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "path id does not resolve (left-to-right)"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "transition requested from a state not in the machine's from-set (e.g., accept a DECLINED call, tie-up a MARKED_UP assignment, award an already-DENIED bid)"
  - id: ERR_HOS_LIMIT_EXCEEDED
    http: 422
    condition: "call accept when employee.cumulative_duty_minutes_month + job projected tour minutes > 16560-minute monthly cap (equality passes)"
  - id: ERR_REST_NOT_SATISFIED
    http: 422
    condition: "mark-up from ON_REST with open RestPeriod undisturbed_minutes < 600"
  - id: ERR_TEMPORAL_WINDOW
    http: 422
    condition: "leave start after end or in the past; lay-off at/after report_time; on-duty earlier than report_time minus 60-minute early window"
  - id: ERR_LEAVE_CONFLICT
    http: 422
    condition: "award would overlap an existing AWARDED bid for the same employee (closed intervals) or exceed the per-craft-day leave quota"
  - id: ERR_JOB_ALREADY_FILLED
    http: 422
    condition: "call accept when job.filled_count >= job.crew_required"
  - id: ERR_REFERENTIAL_MISMATCH
    http: 422
    condition: "slot employee craft != board craft; job craft has no matching board for the terminal; pay record assignment belongs to another employee"
  - id: ERR_DUPLICATE
    http: 409
    condition: "employee_number or board_code already exists; employee already holds an ACTIVE/FROZEN slot on this board"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_pay_record_version or expected_job_version does not match the entity's current version"
  - id: ERR_PAY_INCOMPLETE
    http: 422
    condition: "submit with claimed_minutes <= 0, or complete while the assignment's PayRecord is still DRAFT"
  - id: ERR_CALL_POOL_EXHAUSTED
    http: 422
    condition: "calling_selector found zero eligible ACTIVE slots; no Call created, CrewShortage opened instead"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, wrong type, enum value outside the declared set, or negative numeric where forbidden"

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: Employee
    description: "Craft operating employee acting on their own calls, assignments, leave bids, and pay claims."
    identity: "entity_backed:Employee"
    exclusive_operations:
      - "POST /api/employees/{id}/lay-off"
      - "POST /api/employees/{id}/mark-up"
      - "POST /api/employees/{id}/return-from-leave"
      - "POST /api/calls/{id}/accept"
      - "POST /api/calls/{id}/decline"
      - "POST /api/assignments/{id}/on-duty"
      - "POST /api/assignments/{id}/tie-up"
      - "POST /api/assignments/{id}/lay-off"
      - "POST /api/leave-bids"
      - "POST /api/leave-bids/{id}/cancel"
      - "POST /api/pay-records"
      - "POST /api/pay-records/{id}/submit"
      - "POST /api/pay-records/{id}/resubmit"
    shared_operations:
      - "GET /api/employees/{id}"
      - "GET /api/jobs"
      - "GET /api/jobs/{id}"
      - "GET /api/calls"
      - "GET /api/assignments"
      - "GET /api/assignments/{id}"
      - "GET /api/rest-periods"
      - "GET /api/leave-bids"
      - "GET /api/pay-records"

