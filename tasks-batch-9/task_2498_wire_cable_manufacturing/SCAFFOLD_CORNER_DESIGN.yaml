      - name: surcharge_rounds_half_up_on_an_exact_half_cent
        claim_type: precision
        grounds:
          - calculations.order_quoted_total.precision
          - constants.SURCHARGE_PCT_TIER_1
        distinguishing_aspect: "A subtotal of 267.75 makes the tier-1 surcharge exactly 5.355 - a true half-cent tie that separates ROUND_HALF_UP (5.36) from truncation and from banker's rounding (both 5.35), and the unit price must stay at 4 decimals (107.1000) while the money fields sit at 2."
        test_recipe:
          setup:
            - "COPPER quote 4.10 effective 2026-07-30; SKU THHN-12-CU at 19.8 lbs/kft; order of 2.500 kft at conversion 85.32."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /metal-price-quotes"
              payload: { metal: "COPPER", effective_date: "2026-07-30", settlement_price_usd_per_lb: 4.10, source: "COMEX" }
              as: ProcurementBuyer
            - call: "POST /compounds"
              payload: { compound_code: "PVC-90-INS", layer_role: "INSULATION", temp_rating_c: 90, flame_test: "VW_1", max_voltage_v: 600, wet_rated: true, filler_pct: 12.5 }
              as: ProcessEngineer
              captures: { ins_id: $.data.id }
            - call: "POST /compounds/${ins_id}/qualify"
              payload: {}
              as: ProcessEngineer
            - call: "POST /listing-certifications"
              payload: { agency: "UL", file_number: "E12345", product_family_code: "BLDG-WIRE", initial_listing_date: "2026-06-01", inspection_interval_days: 90 }
              as: CertificationOfficer
              captures: { cert_id: $.data.id }
            - call: "POST /listing-certifications/${cert_id}/inspections"
              payload: { inspection_date: "2026-06-05", inspector_code: "INS-7", findings_count: 0, outcome: "PASS" }
              as: CertificationOfficer
            - call: "POST /catalog-products"
              payload: { product_code: "THHN-12-CU", awg_size: "12", conductor_metal: "COPPER", conductor_construction: "STRANDED_7", application_rating: "THHN", voltage_class: "LV_600", temp_rating_c: 90, insulation_thickness_mils: 28.0, conductor_lbs_per_kft: 19.8, insulation_compound_id: "${ins_id}", listing_certification_id: "${cert_id}", base_target_kft: 100.0 }
              as: ProcessEngineer
              captures: { prod_id: $.data.id }
            - call: "POST /catalog-products/${prod_id}/release"
              payload: {}
              as: ProcessEngineer
            - call: "POST /customers"
              payload: { account_code: "ACME", name: "Acme Electric Supply", market_region: "NORTHEAST", credit_limit_usd: 100000.00, pass_through_enabled: true, reel_program: "RETURNABLE" }
              as: BillingAnalyst
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /customer-orders"
              payload: { customer_id: "${cust_id}", product_id: "${prod_id}", order_number: "SO-TIE", ordered_kft: 2.500, price_basis: "ORDER_DATE_LOCK", conversion_price_usd_per_kft: 85.32, order_date: "2026-07-30" }
              as: BillingAnalyst
              captures: { ord_id: $.data.id }
          assert:
            - "quoted_unit_price_usd_per_kft == 107.1000 = round_half_up(85.32 + 19.8 * (4.1000 - 3.00), 4), carried at 4 decimals rather than collapsed to 107.10"
            - "quoted_subtotal_usd == 267.75 = round_half_up(107.1000 * 2.500, 2)"
            - "quoted_surcharge_usd == 5.36: the exact product 267.75 * 0.020 == 5.35500 is a half-cent tie and ROUND_HALF_UP takes it up; 5.35 (truncation or half-even) is wrong"
            - "quoted_total_usd == 273.11 = round_half_up(267.75 + 0.00 + 5.36, 2), i.e. the total is built from the ALREADY-rounded surcharge, not from 5.355"
            - "the tier is 0.020 because the pre-surcharge subtotal 267.75 < 5000"

      - name: inspection_cadence_gap_is_strict_and_counted_in_whole_days
        claim_type: precision
        grounds:
          - calculations.inspection_cadence
          - constants.INSPECTION_MIN_GAP_DAYS
          - errors[ERR_INSPECTION_WINDOW_CONFLICT]
        distinguishing_aspect: "The cadence guard compares with strict <, so day 59 after the previous visit is refused and day 60 is accepted; the accepted visit then sets next_inspection_due_date by adding the file's own inspection_interval_days across two month boundaries (2026-08-04 + 90 = 2026-11-02)."
        test_recipe:
          setup:
            - "UL file E12345 with inspection_interval_days 90 and one PASS inspection on 2026-06-05; logical clock at 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /listing-certifications"
              payload: { agency: "UL", file_number: "E12345", product_family_code: "BLDG-WIRE", initial_listing_date: "2026-06-01", inspection_interval_days: 90 }
              as: CertificationOfficer
              captures: { cert_id: $.data.id }
            - call: "POST /listing-certifications/${cert_id}/inspections"
              payload: { inspection_date: "2026-06-05", inspector_code: "INS-7", findings_count: 0, outcome: "PASS" }
              as: CertificationOfficer
              captures: { insp_1: $.data.id }
          trigger:
            - call: "POST /listing-certifications/${cert_id}/inspections"
              payload: { inspection_date: "2026-08-03", inspector_code: "INS-8", findings_count: 0, outcome: "PASS" }
              as: CertificationOfficer
              captures: { e_gap: $.data.error_id }
            - call: "POST /listing-certifications/${cert_id}/inspections"
              payload: { inspection_date: "2026-08-04", inspector_code: "INS-8", findings_count: 0, outcome: "PASS" }
              as: CertificationOfficer
              captures: { insp_2: $.data.id }
          assert:
            - "after the first inspection: ListingCertification.${cert_id}.status == \"ACTIVE\", last_inspection_date == \"2026-06-05\", next_inspection_due_date == \"2026-09-03\" (2026-06-05 + 90 days), open_variation_count == 0"
            - "FactoryInspection.${insp_1}.status == \"CLOSED\" and corrective_action_due_date == null because the outcome was PASS"
            - "${e_gap} == \"ERR_INSPECTION_WINDOW_CONFLICT\": 2026-08-03 is 59 whole days after 2026-06-05, and 59 < INSPECTION_MIN_GAP_DAYS 60"
            - "the refusal writes nothing: no FactoryInspection row is created and last_inspection_date is still \"2026-06-05\""
            - "the retry one day later is accepted: 2026-08-04 is exactly 60 days after 2026-06-05 and the comparison is strict <, so FactoryInspection.${insp_2} is created with status \"CLOSED\""
            - "ListingCertification.${cert_id}.last_inspection_date == \"2026-08-04\" and next_inspection_due_date == \"2026-11-02\" (2026-08-04 + 90 days, crossing August, September and October)"

