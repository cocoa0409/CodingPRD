      - name: missing_auth_header_returns_unauthenticated
        claim_type: Violation → Error
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A request with no X-User-Role header fails priority-1 auth with ERR_UNAUTHENTICATED (401) before any other check — even on an otherwise valid request."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /airports"
              payload: { iata_code: "XXX", name: "No Auth", city: "Nowhere", state_code: "ZZ" }
              as: Member
              captures: { err: $.data.error_id }
          assert:
            - "Role denial precedes everything: with X-User-Role set to a non-permitted role the response is 403 ERR_UNAUTHORIZED; with X-User-Role absent entirely the same request fails 401 ERR_UNAUTHENTICATED at priority 1 — auth outranks authorization"

