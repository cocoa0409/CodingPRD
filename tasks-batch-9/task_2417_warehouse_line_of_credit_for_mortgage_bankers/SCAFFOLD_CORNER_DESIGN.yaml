# =============================================================================
# §1.9 Scaffold Corner Design (Breadth Probe)
#
# Task 2417 — Warehouse Line of Credit for Mortgage Bankers
#
# Section / claim_type values are taken verbatim from
# references/claim-extraction-guide.md. §1.8 depth instances are not duplicated
# here — where a guide row is already exercised by a §1.8 instance, this file
# emits an `excluded_because:` stub naming it.
#
# Shared fixture: identical to §1.8's — facility "Meridian Mortgage Bankers LLC",
# committed 20,000,000,000 cents, CONFORMING advance_rate 0.98 / wet_haircut 0.02
# / dwell_limit_days 30 / aging_step_days 15 / curtailment_step_rate 0.005 /
# product_sublimit 15,000,000,000, settlement account "4417", clock at
# 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: corner_entity_facility_creation_returns_full_declared_shape
        claim_type: creation
        grounds:
          - entities.WarehouseFacility
          - endpoints["POST /facilities"]
          - response_envelope.success
        distinguishing_aspect: |
          A create with every required field returns 201 with the success envelope, every
          input field echoed verbatim, status PENDING_APPROVAL, version 1 and all seven
          computed rollup fields already materialised at 0 / NOT_TESTED rather than null.
        test_recipe:
          setup:
            - "Empty database; logical clock set to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - &c_clock_aug1
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: CreditOfficer
          trigger:
            - &c_facility
              call: "POST /facilities"
              payload:
                borrower_legal_name: "Meridian Mortgage Bankers LLC"
                committed_amount_cents: 20000000000
                wet_sublimit_cents: 20000000000
                aged_sublimit_cents: 2000000000
                scratch_and_dent_sublimit_cents: 1000000000
                min_tangible_net_worth_cents: 1500000000
                min_liquidity_cents: 500000000
                min_ttm_net_income_cents: 100000000
                max_investor_concentration_pct: 0.35
                bailee_period_days: 30
                unused_line_fee_rate: 0.0025
                settlement_account_last4: "4417"
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { fac_id: "$.data.id" }
          assert:
            - "HTTP 201 and response_type == object"
            - "meta.api_request_id and meta.api_request_timestamp are present"
            - "WarehouseFacility.${fac_id}.borrower_legal_name == Meridian Mortgage Bankers LLC"
            - "WarehouseFacility.${fac_id}.committed_amount_cents == 20000000000"
            - "WarehouseFacility.${fac_id}.settlement_account_last4 == 4417"
            - "WarehouseFacility.${fac_id}.status == PENDING_APPROVAL"
            - "WarehouseFacility.${fac_id}.version == 1"
            - "WarehouseFacility.${fac_id}.outstanding_principal_cents == 0"
            - "WarehouseFacility.${fac_id}.availability_cents == 20000000000"
            - "WarehouseFacility.${fac_id}.accrued_fee_balance_cents == 0"
            - "WarehouseFacility.${fac_id}.wet_outstanding_cents == 0"
            - "WarehouseFacility.${fac_id}.aged_outstanding_cents == 0"
            - "WarehouseFacility.${fac_id}.consecutive_breach_count == 0"
            - "WarehouseFacility.${fac_id}.last_covenant_status == NOT_TESTED"
            - "WarehouseFacility.${fac_id}.open_margin_call_count == 0"
            - "created_at and updated_at are present and equal 2026-08-01T00:00:00Z"

      - name: corner_entity_advance_retrieval_recomputes_derived_fields
        claim_type: retrieval
        grounds:
          - endpoints["GET /advances/{id}"]
          - entities.Advance.fields.dwell_days
          - entities.Advance.fields.eligible_collateral_value_cents
          - calculations.dwell_and_aging_classification
        distinguishing_aspect: |
          GET /advances/{id} returns the stored row AND re-derives dwell_days and the
          valuation triple against the current clock, so the same row read at 2026-08-01
          reports dwell_days 0 and at 2026-08-11 reports dwell_days 10 with no write in between.
        test_recipe:
          setup:
            - "Canonical ACTIVE facility; one DRY CONFORMING advance, loan 2,000,000,000, CLEAR receipt, funded to 1,960,000,000 at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - *c_clock_aug1
            - *c_facility
            - &c_par_conforming
              call: "POST /facilities/${fac_id}/product-advance-rates"
              payload:
                product_code: "CONFORMING"
                advance_rate: 0.98
                wet_funding_allowed: true
                wet_haircut: 0.02
                dwell_limit_days: 30
                aging_step_days: 15
                curtailment_step_rate: 0.005
                product_sublimit_cents: 15000000000
              as: CreditOfficer
              as_user_id: "co_1"
            - &c_approve_facility
              call: "POST /facilities/${fac_id}/approve"
              payload: {}
              as: CreditOfficer
              as_user_id: "co_2"
            - &c_custodian
              call: "POST /facilities/${fac_id}/custodians"
              payload: { custodian_name: "First Doc Custody NA", wet_receipt_deadline_hours: 48 }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { cust_id: "$.data.id" }
            - &c_investor_a
              call: "POST /facilities/${fac_id}/investors"
              payload: { investor_name: "Alpha Aggregator", counterparty_rating: "A", concentration_limit_pct: 0.60 }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { inv_a_id: "$.data.id" }
            - &c_investor_a_approve
              call: "POST /investors/${inv_a_id}/approve"
              payload: {}
              as: CreditOfficer
              as_user_id: "co_1"
            - &c_commitment_a
              call: "POST /facilities/${fac_id}/commitments"
              payload:
                investor_id: "${inv_a_id}"
                product_code: "CONFORMING"
                committed_amount_cents: 5000000000
                price_pct: 1.0125
                effective_on: "2026-08-01"
                expires_on: "2026-12-31"
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { comm_a_id: "$.data.id" }
            - &c_get_fac_v1
              call: "GET /facilities/${fac_id}"
              payload: {}
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { fac_v1: "$.data.version" }
            - &c_advance_dry_2b
              call: "POST /advances"
              payload:
                facility_id: "${fac_id}"
                custodian_id: "${cust_id}"
                investor_commitment_id: "${comm_a_id}"
                product_code: "CONFORMING"
                loan_amount_cents: 2000000000
                note_rate: 0.0650
                funding_type: "DRY"
                payee_name: "Summit Title & Escrow"
                payee_account_last4: "4417"
                payee_routing_last4: "0021"
                expected_facility_version: "${fac_v1}"
              as: CollateralAnalyst
              as_user_id: "ca_1"
              captures: { a1_id: "$.data.id" }
            - &c_receipt_clear_a1
              call: "POST /advances/${a1_id}/receipts"
              payload: { custodian_id: "${cust_id}", document_types: ["NOTE", "MORTGAGE", "ASSIGNMENT", "TITLE_POLICY"] }
              as: Custodian
              as_user_id: "${cust_id}"
              captures: { rcpt_a1_id: "$.data.id" }
            - &c_wire_a1
              call: "GET /advances/${a1_id}/wire-instructions"
              payload: {}
              as: WireOperator
              as_user_id: "wo_1"
              captures: { w1_id: "$.data[0].id" }
            - &c_verify_w1
              call: "POST /wire-instructions/${w1_id}/decision"
              payload: { decision: "VERIFY", callback_reference: "CB-901" }
              as: WireOperator
              as_user_id: "wo_1"
            - &c_fund_a1
              call: "POST /advances/${a1_id}/fund"
              payload: {}
              as: CollateralAnalyst
              as_user_id: "ca_1"
          trigger:
            - call: "GET /advances/${a1_id}"
              payload: {}
              as: CollateralAnalyst
              as_user_id: "ca_1"
              captures: { dwell_at_fund: "$.data.dwell_days" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-11T00:00:00Z" }
              as: CreditOfficer
            - call: "GET /advances/${a1_id}"
              payload: {}
              as: CollateralAnalyst
              as_user_id: "ca_1"
              captures: { dwell_later: "$.data.dwell_days" }
          assert:
            - "dwell_at_fund == 0 and dwell_later == 10"
            - "Advance.${a1_id}.funding_status == FUNDED and custody_status == RECEIVED_CLEAR"
            - "Advance.${a1_id}.loan_amount_cents == 2000000000 and advance_amount_cents == 1960000000"
            - "Advance.${a1_id}.market_value_cents == 2000000000"
            - "Advance.${a1_id}.effective_advance_rate == 0.98 at both reads"
            - "Advance.${a1_id}.eligible_collateral_value_cents == 1960000000 at both reads"
            - "Advance.${a1_id}.is_aged == false at both reads"
            - "Advance.${a1_id}.version is identical at both reads — a read performs no write"

      - name: corner_entity_advance_listing_filter_and_pagination_envelope
        claim_type: listing
        grounds:
          - endpoints["GET /advances"]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          With three advances on one facility — two FUNDED and one REQUESTED — the list
          endpoint must report total_count 3 unfiltered, total_count 2 under
          funding_status=FUNDED, and has_more true with exactly 1 row at limit=1&offset=0,
          ordered created_at ASC so the first row is the earliest-created advance.
        test_recipe:
          setup:
            - "Canonical ACTIVE facility with three CONFORMING advances created in order: A1 (DRY 2,000,000,000, funded), A2 (WET 1,000,000,000, funded), A3 (WET 300,000,000, still REQUESTED)."
          setup_api_calls:
            - *c_clock_aug1
            - *c_facility
            - *c_par_conforming
            - *c_approve_facility
            - *c_custodian
            - *c_investor_a
            - *c_investor_a_approve
            - *c_commitment_a
            - *c_get_fac_v1
            - *c_advance_dry_2b
            - *c_receipt_clear_a1
            - *c_wire_a1
            - *c_verify_w1
            - *c_fund_a1
            - call: "GET /facilities/${fac_id}"
              payload: {}
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { fac_v2: "$.data.version" }
            - call: "POST /advances"
              payload:
                facility_id: "${fac_id}"
                custodian_id: "${cust_id}"
                investor_commitment_id: "${comm_a_id}"
                product_code: "CONFORMING"
                loan_amount_cents: 1000000000
                note_rate: 0.0625
                funding_type: "WET"
                payee_name: "Summit Title & Escrow"
                payee_account_last4: "4417"
                payee_routing_last4: "0021"
                expected_facility_version: "${fac_v2}"
              as: CollateralAnalyst
              as_user_id: "ca_1"
              captures: { a2_id: "$.data.id" }
            - call: "GET /advances/${a2_id}/wire-instructions"
              payload: {}
              as: WireOperator
              as_user_id: "wo_1"
              captures: { w2_id: "$.data[0].id" }
            - call: "POST /wire-instructions/${w2_id}/decision"
              payload: { decision: "VERIFY", callback_reference: "CB-902" }
              as: WireOperator
              as_user_id: "wo_1"
            - call: "POST /advances/${a2_id}/fund"
              payload: {}
              as: CollateralAnalyst
              as_user_id: "ca_1"
            - call: "GET /facilities/${fac_id}"
              payload: {}
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { fac_v3: "$.data.version" }
            - call: "POST /advances"
              payload:
                facility_id: "${fac_id}"
                custodian_id: "${cust_id}"
                investor_commitment_id: "${comm_a_id}"
                product_code: "CONFORMING"
                loan_amount_cents: 300000000
                note_rate: 0.0700
                funding_type: "WET"
                payee_name: "Summit Title & Escrow"
                payee_account_last4: "4417"
                payee_routing_last4: "0021"
                expected_facility_version: "${fac_v3}"
              as: CollateralAnalyst
              as_user_id: "ca_1"
              captures: { a3_id: "$.data.id" }
          trigger:
            - call: "GET /advances"
              payload: { facility_id: "${fac_id}" }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { all_total: "$.data" }
            - call: "GET /advances"
              payload: { facility_id: "${fac_id}", funding_status: "FUNDED" }
              as: CreditOfficer
              as_user_id: "co_1"
            - call: "GET /advances"
              payload: { facility_id: "${fac_id}", limit: 1, offset: 0 }
              as: CreditOfficer
              as_user_id: "co_1"
            - call: "GET /advances"
              payload: { facility_id: "${fac_id}", limit: 1, offset: 2 }
              as: CreditOfficer
              as_user_id: "co_1"
          assert:
            - "unfiltered: response_type == array, total_count == 3, has_more == false, len(data) == 3"
            - "unfiltered: data[0].id == ${a1_id}, data[1].id == ${a2_id}, data[2].id == ${a3_id} (created_at ASC)"
            - "funding_status=FUNDED: total_count == 2 and the returned ids are exactly {${a1_id}, ${a2_id}}"
            - "limit=1&offset=0: len(data) == 1, data[0].id == ${a1_id}, total_count == 3, has_more == true"
            - "limit=1&offset=2: len(data) == 1, data[0].id == ${a3_id}, has_more == false"
            - "Advance.${a3_id}.funding_status == REQUESTED and outstanding_balance_cents == 0"

      - name: corner_entity_advance_not_found_for_unknown_id
        claim_type: not_found
        grounds:
          - validations[priority=3]
          - errors.ERR_ADVANCE_NOT_FOUND
          - endpoints["GET /advances/{id}"]
        distinguishing_aspect: |
          A syntactically valid but non-existent advance id returns 404 with error_id
          ERR_ADVANCE_NOT_FOUND and the error envelope, not 200 with a null body and not 422.
        test_recipe:
          setup:
            - "Canonical ACTIVE facility with zero advances."
          setup_api_calls:
            - *c_clock_aug1
            - *c_facility
            - *c_par_conforming
            - *c_approve_facility
          trigger:
            - call: "GET /advances/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: CollateralAnalyst
              as_user_id: "ca_1"
            - call: "GET /margin-calls/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: CreditOfficer
              as_user_id: "co_1"
          assert:
            - "the advance read returns HTTP 404, response_type == error, data.error_id == ERR_ADVANCE_NOT_FOUND"
            - "the margin-call read returns HTTP 404 with data.error_id == ERR_MARGIN_CALL_NOT_FOUND — the 404 code is per-entity, never a generic ERR_NOT_FOUND"
            - "both responses carry meta.api_request_id"

      - name: corner_entity_facility_missing_required_field_rejected
        claim_type: required_fields
        grounds:
          - validations[priority=7]
          - errors.ERR_VALIDATION
          - endpoints["POST /facilities"]
          - endpoints["POST /advances"]
        distinguishing_aspect: |
          Omitting a field that is `source: input` with no declared default —
          settlement_account_last4 on the facility, loan_amount_cents on the advance —
          returns 422 ERR_VALIDATION and persists nothing, whereas omitting
          bailee_period_days (which has a default) succeeds.
        test_recipe:
          setup:
            - "Empty database; logical clock set to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - *c_clock_aug1
          trigger:
            - call: "POST /facilities"
              payload:
                borrower_legal_name: "Incomplete Funding Corp"
                committed_amount_cents: 20000000000
                wet_sublimit_cents: 20000000000
                aged_sublimit_cents: 2000000000
                scratch_and_dent_sublimit_cents: 1000000000
                min_tangible_net_worth_cents: 1500000000
                min_liquidity_cents: 500000000
                min_ttm_net_income_cents: 100000000
                max_investor_concentration_pct: 0.35
                bailee_period_days: 30
                unused_line_fee_rate: 0.0025
              as: CreditOfficer
              as_user_id: "co_1"
            - call: "GET /facilities"
              payload: {}
              as: CreditOfficer
              as_user_id: "co_1"
          assert:
            - "the create returns HTTP 422 with data.error_id == ERR_VALIDATION"
            - "GET /facilities returns total_count == 0 — the rejected create persisted nothing"

      - name: corner_entity_declared_defaults_applied_on_omission
        claim_type: defaults
        grounds:
          - entities.WarehouseFacility.fields.bailee_period_days
          - entities.ProductAdvanceRate.fields.wet_funding_allowed
          - entities.ProductAdvanceRate.fields.wet_haircut
          - entities.ProductAdvanceRate.fields.aging_step_days
          - entities.ProductAdvanceRate.fields.curtailment_step_rate
          - entities.DocumentCustodian.fields.wet_receipt_deadline_hours
          - entities.CustodianReceipt.fields.exception_codes
        distinguishing_aspect: |
          Every §1.1 field that declares a `default:` is optional in its §1.5 `input:` and
          materialises that exact default when omitted: bailee_period_days 30,
          wet_funding_allowed true, wet_haircut 0.02, aging_step_days 15,
          curtailment_step_rate 0.005, wet_receipt_deadline_hours 72, exception_codes [].
        test_recipe:
          setup:
            - "Empty database; logical clock set to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - *c_clock_aug1
          trigger:
            - call: "POST /facilities"
              payload:
                borrower_legal_name: "Defaults Mortgage LLC"
                committed_amount_cents: 20000000000
                wet_sublimit_cents: 20000000000
                aged_sublimit_cents: 2000000000
                scratch_and_dent_sublimit_cents: 1000000000
                min_tangible_net_worth_cents: 1500000000
                min_liquidity_cents: 500000000
                min_ttm_net_income_cents: 100000000
                max_investor_concentration_pct: 0.35
                unused_line_fee_rate: 0.0025
                settlement_account_last4: "4417"
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { dflt_fac_id: "$.data.id", dflt_bailee: "$.data.bailee_period_days" }
            - call: "POST /facilities/${dflt_fac_id}/product-advance-rates"
              payload: { product_code: "CONFORMING", advance_rate: 0.98, dwell_limit_days: 30 }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { dflt_par_id: "$.data.id" }
            - call: "POST /facilities/${dflt_fac_id}/custodians"
              payload: { custodian_name: "Default Custody Trust" }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { dflt_cust_id: "$.data.id", dflt_hours: "$.data.wet_receipt_deadline_hours" }
          assert:
            - "dflt_bailee == 30"
            - "ProductAdvanceRate.${dflt_par_id}.wet_funding_allowed == true"
            - "ProductAdvanceRate.${dflt_par_id}.wet_haircut == 0.02"
            - "ProductAdvanceRate.${dflt_par_id}.aging_step_days == 15"
            - "ProductAdvanceRate.${dflt_par_id}.curtailment_step_rate == 0.005"
            - "ProductAdvanceRate.${dflt_par_id}.product_sublimit_cents is null — an omitted optional with no default stays null"
            - "dflt_hours == 72"
            - "DocumentCustodian.${dflt_cust_id}.status == APPROVED"
            - "WarehouseFacility.${dflt_fac_id}.status == PENDING_APPROVAL"

      - name: corner_entity_receipt_exception_codes_default_empty_yields_clear
        claim_type: defaults
        grounds:
          - entities.CustodianReceipt.fields.exception_codes
          - state_machines.CustodianReceipt.status
          - state_machines.Advance.custody_status.PENDING_RECEIPT_to_RECEIVED_CLEAR
          - endpoints["POST /advances/{id}/receipts"]
        distinguishing_aspect: |
          Omitting exception_codes entirely is not the same claim as passing an explicitly
          empty array by a different route: the omitted case must default to [] and drive
          receipt status CLEAR plus custody_status RECEIVED_CLEAR, with no EXCEPTION_HAIRCUT
          applied to the valuation.
        test_recipe:
          setup:
            - "Canonical ACTIVE facility; one REQUESTED DRY CONFORMING advance, loan 2,000,000,000, no receipts yet."
          setup_api_calls:
            - *c_clock_aug1
            - *c_facility
            - *c_par_conforming
            - *c_approve_facility
            - *c_custodian
            - *c_investor_a
            - *c_investor_a_approve
            - *c_commitment_a
            - *c_get_fac_v1
            - *c_advance_dry_2b
          trigger:
            - call: "POST /advances/${a1_id}/receipts"
              payload: { custodian_id: "${cust_id}", document_types: ["NOTE", "MORTGAGE", "ASSIGNMENT", "TITLE_POLICY"] }
              as: Custodian
              as_user_id: "${cust_id}"
              captures: { rcpt_id: "$.data.id", rcpt_exceptions: "$.data.exception_codes" }
          assert:
            - "HTTP 201 and rcpt_exceptions == []"
            - "CustodianReceipt.${rcpt_id}.status == CLEAR"
            - "CustodianReceipt.${rcpt_id}.cured_exception_codes == []"
            - "Advance.${a1_id}.custody_status == RECEIVED_CLEAR"
            - "Advance.${a1_id}.effective_advance_rate == 0.98 — no EXCEPTION_HAIRCUT"
            - "Advance.${a1_id}.eligible_collateral_value_cents == 1960000000"
            - "Advance.${a1_id}.funding_status == REQUESTED — a receipt is not a funding event"
            - "GET /custodians/${cust_id}/receipts returns total_count == 1"

      - name: corner_entity_advance_computed_fields_derived_not_supplied
        claim_type: computed_fields
        grounds:
          - entities.Advance.fields.market_value_cents
          - entities.Advance.fields.advance_amount_cents
          - entities.Advance.fields.outstanding_balance_cents
          - entities.Advance.fields.provisional_advance_amount_cents
          - endpoints["POST /advances"]
        distinguishing_aspect: |
          None of Advance's computed money fields are client inputs: at creation
          market_value_cents is seeded to loan_amount_cents (2,000,000,000),
          advance_amount_cents and outstanding_balance_cents are 0, and they only take their
          values from the fund calculation — 1,960,000,000 and 1,960,000,000 respectively.
        test_recipe:
          setup:
            - "Canonical ACTIVE facility; one REQUESTED DRY CONFORMING advance, loan 2,000,000,000, CLEAR receipt, wire VERIFIED."
          setup_api_calls:
            - *c_clock_aug1
            - *c_facility
            - *c_par_conforming
            - *c_approve_facility
            - *c_custodian
            - *c_investor_a
            - *c_investor_a_approve
            - *c_commitment_a
            - *c_get_fac_v1
            - *c_advance_dry_2b
            - *c_receipt_clear_a1
            - *c_wire_a1
            - *c_verify_w1
          trigger:
            - call: "GET /advances/${a1_id}"
              payload: {}
              as: CollateralAnalyst
              as_user_id: "ca_1"
              captures: { mv_at_create: "$.data.market_value_cents" }
            - call: "POST /advances/${a1_id}/fund"
              payload: {}
              as: CollateralAnalyst
              as_user_id: "ca_1"
          assert:
            - "mv_at_create == 2000000000 — market_value_cents seeds from loan_amount_cents"
            - "before funding: Advance.${a1_id}.advance_amount_cents == 0 and provisional_advance_amount_cents == 0 and outstanding_balance_cents == 0"
            - "after funding: Advance.${a1_id}.provisional_advance_amount_cents == 1960000000"
            - "after funding: Advance.${a1_id}.advance_amount_cents == 1960000000"
            - "after funding: Advance.${a1_id}.outstanding_balance_cents == 1960000000"
            - "after funding: Advance.${a1_id}.concentration_capped == false"
            - "after funding: WarehouseFacility.${fac_id}.outstanding_principal_cents == 1960000000"

      - name: corner_entity_ledger_entry_system_fields_and_ordering
        claim_type: system_fields
        grounds:
          - entities.LedgerEntry
          - endpoints["GET /advances/{id}/ledger-entries"]
          - endpoints["GET /facilities/{id}/ledger-entries"]
        distinguishing_aspect: |
          LedgerEntry rows are entirely system-minted: the client never supplies id,
          created_at, entry_type, direction or amount_cents, and the collection is returned
          in created_at ASC order so the ADVANCE_FUNDED DEBIT precedes the FEE_ACCRUAL DEBIT
          produced by the later aging-run.
        test_recipe:
          setup:
            - "Canonical ACTIVE facility; one DRY CONFORMING advance funded to 1,960,000,000 at 2026-08-01T00:00:00Z."
            - "Clock advanced to 2026-08-11T00:00:00Z and one aging-run executed, appending exactly one FEE_ACCRUAL entry."
          setup_api_calls:
            - *c_clock_aug1
            - *c_facility
            - *c_par_conforming
            - *c_approve_facility
            - *c_custodian
            - *c_investor_a
            - *c_investor_a_approve
            - *c_commitment_a
            - *c_get_fac_v1
            - *c_advance_dry_2b
            - *c_receipt_clear_a1
            - *c_wire_a1
            - *c_verify_w1
            - *c_fund_a1
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-11T00:00:00Z" }
              as: CreditOfficer
            - call: "POST /facilities/${fac_id}/aging-run"
              payload: {}
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { fee_cents: "$.data.fee_accrual_cents" }
          trigger:
            - call: "GET /facilities/${fac_id}/ledger-entries"
              payload: {}
              as: CreditOfficer
              as_user_id: "co_1"
            - call: "GET /facilities/${fac_id}/ledger-entries"
              payload: { entry_type: "FEE_ACCRUAL" }
              as: CreditOfficer
              as_user_id: "co_1"
          assert:
            - "unfiltered: total_count == 2"
            - "data[0].entry_type == ADVANCE_FUNDED, data[0].direction == DEBIT, data[0].amount_cents == 1960000000, data[0].created_at == 2026-08-01T00:00:00Z"
            - "data[1].entry_type == FEE_ACCRUAL, data[1].direction == DEBIT, data[1].created_at == 2026-08-11T00:00:00Z"
            - "every row carries a non-null id and created_at"
            - "fee_cents == 6016667 = round_half_up(1960000000 * (0.0650 + 0.0225) / 360 * 10) + round_half_up(18040000000 * 0.0025 / 360 * 10) = 4763889 + 1252778"
            - "entry_type=FEE_ACCRUAL: total_count == 1 and data[0].amount_cents == 6016667"
            - "data[0].advance_id == ${a1_id} for the ADVANCE_FUNDED row"

      - name: corner_entity_cure_payment_is_immutable_append_only
        claim_type: immutability
        grounds:
          - entities.CurePayment
          - entities.LedgerEntry
          - endpoints["GET /margin-calls/{id}/cure-payments"]
        distinguishing_aspect: |
          CurePayment and LedgerEntry declare common_fields: false, so their rows expose no
          version and no updated_at and §1.5 offers no PATCH/PUT/DELETE for either — a
          correction can only be expressed as a further append, never as an edit.
        test_recipe:
          setup:
            - "Canonical ACTIVE facility; one DRY CONFORMING advance funded to 1,960,000,000; a manual VALUATION_DECLINE margin call raised after a mark-down to 1,900,000,000 (call_amount_cents 98,000,000); one cure payment of 40,000,000 already applied."
          setup_api_calls:
            - *c_clock_aug1
            - *c_facility
            - *c_par_conforming
            - *c_approve_facility
            - *c_custodian
            - *c_investor_a
            - *c_investor_a_approve
            - *c_commitment_a
            - *c_get_fac_v1
            - *c_advance_dry_2b
            - *c_receipt_clear_a1
            - *c_wire_a1
            - *c_verify_w1
            - *c_fund_a1
            - &c_adv_v1
              call: "GET /advances/${a1_id}"
              payload: {}
              as: CollateralAnalyst
              as_user_id: "ca_1"
              captures: { adv_v1: "$.data.version" }
            - &c_valuation_1900
              call: "POST /advances/${a1_id}/valuation"
              payload: { market_value_cents: 1900000000, expected_advance_version: "${adv_v1}" }
              as: CollateralAnalyst
              as_user_id: "ca_1"
            - &c_mc_lookup
              call: "GET /facilities/${fac_id}/margin-calls"
              payload: { status: "ISSUED" }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { mc1_id: "$.data[0].id" }
            - call: "GET /margin-calls/${mc1_id}"
              payload: {}
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { mc_v1: "$.data.version" }
            - call: "POST /margin-calls/${mc1_id}/cure-payments"
              payload: { amount_cents: 40000000, expected_margin_call_version: "${mc_v1}" }
              as: Borrower
              as_user_id: "${fac_id}"
              captures: { cp1_id: "$.data.id" }
          trigger:
            - call: "GET /margin-calls/${mc1_id}/cure-payments"
