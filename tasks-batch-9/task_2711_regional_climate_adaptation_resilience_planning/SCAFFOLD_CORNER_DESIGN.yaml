      - name: project_prerequisite_repointed_into_a_cycle_rejected
        claim_type: Violation → Error
        grounds:
          - validations.priority_31_ERR_PROJECT_PREREQUISITE_CYCLE
          - validations.priority_5_ERR_JURISDICTION_NOT_FOUND
          - errors.ERR_PROJECT_PREREQUISITE_CYCLE
        distinguishing_aspect: "Project B already depends on A, so repointing A's prerequisite_project_id at B is refused with 409 ERR_PROJECT_PREREQUISITE_CYCLE, while the same PATCH carrying an unknown id returns 404 ERR_PROJECT_NOT_FOUND first — the walk runs only after the id resolves."
        test_recipe:
          setup:
            - "One ACTIVE Jurisdiction, one DRAFT PlanCycle, project A with no prerequisite and project B whose prerequisite_project_id is A; both still UNPROGRAMMED."
          setup_api_calls:
            - call: "POST /resilience/jurisdictions"
              payload: { name: "Harbor City", jurisdiction_code: "CITY-HARBOR", population: 180000, svi_score: 0.62, endorsement_weight: 4 }
