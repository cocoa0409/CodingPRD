            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T11:00:00Z" }, as: AssetManager }
            - { call: "POST /api/tours/${tour_id}/complete", as: TenantRep, as_user_id: rep-001 }
            - { call: "POST /api/lois", payload: { requirement_id: "${req_id}", site_id: "${site_id}", term_years: 5, leased_sf: 100000, base_rate_psf: 8.00, ti_allowance_psf: 10.00, free_rent_months: 6, escalation_pct: 0.03 }, as: TenantRep, as_user_id: rep-001, captures: { loi_id: $.data.id } }
          assert:
            - "first create: err == ERR_NO_COMPLETED_TOUR (tour CONFIRMED is not enough)"
            - "after completion: create succeeds, LOI.${loi_id}.status == DRAFT"

  - rule_id: resource_temporal_overlap
    instances:
      - name: site_tour_buffer_conflict
        grounds:
          - validations[priority=17]
        distinguishing_aspect: |
          Resource: Site schedule; semantics: 30-minute BUFFERED intervals — a tour
          10:00-11:00 blocks the site until 11:30, so an 11:20 request collides while an
          11:30 request is exactly outside the buffer ([start-30, end+30) half-open) and
          succeeds.
        test_recipe:
          setup:
            - "SITE_A and REQ_A exist; tour T1 REQUESTED for 2026-08-10 10:00-11:00 at SITE_A"
          setup_api_calls:
            - { call: "POST /api/tenant-requirements", payload: { tenant_name: "Acme Distribution", use_type: DISTRIBUTION, min_sf: 90000, max_sf: 120000, min_clear_height_ft: 32, min_dock_doors: 16, min_power_amps: 3000, min_yard_depth_ft: 150, target_submarket: "Inland Empire", required_delivery_date: "2027-01-01T00:00:00Z" }, as: TenantRep, as_user_id: rep-001, captures: { req_id: $.data.id } }
            - { call: "POST /api/sites", payload: { site_name: "Ridge Logistics Center", submarket: "Inland Empire", parcel_type: EXISTING, total_sf: 200000, clear_height_ft: 36, dock_doors: 20, power_amps: 4000, yard_depth_ft: 200, zoning_designation: "M-1", environmental_phase: PHASE_I_COMPLETE, asking_rate_psf: 6.00 }, as: LeasingManager, captures: { site_id: $.data.id } }
            - { call: "POST /api/tours", payload: { site_id: "${site_id}", requirement_id: "${req_id}", start_at: "2026-08-10T10:00:00Z", end_at: "2026-08-10T11:00:00Z" }, as: TenantRep, as_user_id: rep-001 }
          trigger:
            - { call: "POST /api/tours", payload: { site_id: "${site_id}", requirement_id: "${req_id}", start_at: "2026-08-10T11:20:00Z", end_at: "2026-08-10T12:00:00Z" }, as: TenantRep, as_user_id: rep-002, captures: { err: $.data.error_id } }
            - { call: "POST /api/tours", payload: { site_id: "${site_id}", requirement_id: "${req_id}", start_at: "2026-08-10T11:30:00Z", end_at: "2026-08-10T12:00:00Z" }, as: TenantRep, as_user_id: rep-002, captures: { tour3: $.data.id } }
          assert:
            - "11:20 request: err == ERR_TOUR_SITE_CONFLICT (11:20 < 11:00+30min buffer)"
            - "11:30 request: succeeds (11:30 is NOT < 11:30 — buffer boundary is exclusive), tour ${tour3} status REQUESTED"

      - name: rep_calendar_adjacency_allowed
        grounds:
          - validations[priority=18]
        distinguishing_aspect: |
          Resource: TenantRep calendar (different resource than the site schedule);
          semantics: PLAIN half-open [start, end) overlap with no buffer — a back-to-back
          tour at 11:00 immediately after a 10:00-11:00 tour is allowed, while a genuinely
          overlapping 10:30-11:30 request on a different site is rejected.
        test_recipe:
          setup:
            - "REQ_A plus SITE_A and SITE_B both qualifying; rep-001 already holds tour T1 10:00-11:00 at SITE_A"
          setup_api_calls:
            - { call: "POST /api/tenant-requirements", payload: { tenant_name: "Acme Distribution", use_type: DISTRIBUTION, min_sf: 90000, max_sf: 120000, min_clear_height_ft: 32, min_dock_doors: 16, min_power_amps: 3000, min_yard_depth_ft: 150, target_submarket: "Inland Empire", required_delivery_date: "2027-01-01T00:00:00Z" }, as: TenantRep, as_user_id: rep-001, captures: { req_id: $.data.id } }
            - { call: "POST /api/sites", payload: { site_name: "Ridge Logistics Center", submarket: "Inland Empire", parcel_type: EXISTING, total_sf: 200000, clear_height_ft: 36, dock_doors: 20, power_amps: 4000, yard_depth_ft: 200, zoning_designation: "M-1", environmental_phase: PHASE_I_COMPLETE, asking_rate_psf: 6.00 }, as: LeasingManager, captures: { site_a: $.data.id } }
            - { call: "POST /api/sites", payload: { site_name: "Summit Logistics Center", submarket: "Inland Empire", parcel_type: EXISTING, total_sf: 200000, clear_height_ft: 36, dock_doors: 20, power_amps: 4000, yard_depth_ft: 200, zoning_designation: "M-1", environmental_phase: PHASE_I_COMPLETE, asking_rate_psf: 6.50 }, as: LeasingManager, captures: { site_b: $.data.id } }
            - { call: "POST /api/sites", payload: { site_name: "Valley Commerce Center", submarket: "Inland Empire", parcel_type: EXISTING, total_sf: 200000, clear_height_ft: 36, dock_doors: 20, power_amps: 4000, yard_depth_ft: 200, zoning_designation: "M-1", environmental_phase: PHASE_I_COMPLETE, asking_rate_psf: 5.50 }, as: LeasingManager, captures: { site_c: $.data.id } }
            - { call: "POST /api/tours", payload: { site_id: "${site_a}", requirement_id: "${req_id}", start_at: "2026-08-10T10:00:00Z", end_at: "2026-08-10T11:00:00Z" }, as: TenantRep, as_user_id: rep-001 }
          trigger:
            - { call: "POST /api/tours", payload: { site_id: "${site_b}", requirement_id: "${req_id}", start_at: "2026-08-10T11:00:00Z", end_at: "2026-08-10T12:00:00Z" }, as: TenantRep, as_user_id: rep-001, captures: { tour2: $.data.id } }
            - { call: "POST /api/tours", payload: { site_id: "${site_c}", requirement_id: "${req_id}", start_at: "2026-08-10T10:30:00Z", end_at: "2026-08-10T11:30:00Z" }, as: TenantRep, as_user_id: rep-001, captures: { err: $.data.error_id } }
          assert:
            - "back-to-back 11:00 at SITE_B succeeds (adjacency allowed under plain half-open semantics): tour ${tour2} status REQUESTED"
            - "overlapping 10:30-11:30 at SITE_C: err == ERR_REP_CALENDAR_CONFLICT (10:30 < 11:00 AND 10:00 < 11:30)"

  - rule_id: compensating_invariant
    instances:
      - name: site_sf_reserve_release_conservation
        grounds:
          - state_machines.Site.LISTED_to_RESERVED
          - state_machines.Site.RESERVED_to_LISTED
          - entities.Site.fields.available_sf
        distinguishing_aspect: |
          Conserved quantity: square footage. Invariant pinned: available_sf + reserved_sf
          == total_sf (200000) after the forward reserve (accept: 100000+100000) and after
          the compensating release (withdraw from ACCEPTED: 200000+0) — no SF drift.
        test_recipe:
          setup:
            - "LOI_A SUBMITTED on SITE_A (total_sf 200000, leased_sf 100000)"
          setup_api_calls:
            - { call: "POST /api/tenant-requirements", payload: { tenant_name: "Acme Distribution", use_type: DISTRIBUTION, min_sf: 90000, max_sf: 120000, min_clear_height_ft: 32, min_dock_doors: 16, min_power_amps: 3000, min_yard_depth_ft: 150, target_submarket: "Inland Empire", required_delivery_date: "2027-01-01T00:00:00Z" }, as: TenantRep, as_user_id: rep-001, captures: { req_id: $.data.id } }
            - { call: "POST /api/sites", payload: { site_name: "Ridge Logistics Center", submarket: "Inland Empire", parcel_type: EXISTING, total_sf: 200000, clear_height_ft: 36, dock_doors: 20, power_amps: 4000, yard_depth_ft: 200, zoning_designation: "M-1", environmental_phase: PHASE_I_COMPLETE, asking_rate_psf: 6.00 }, as: LeasingManager, captures: { site_id: $.data.id } }
            - { call: "POST /api/tours", payload: { site_id: "${site_id}", requirement_id: "${req_id}", start_at: "2026-08-10T10:00:00Z", end_at: "2026-08-10T11:00:00Z" }, as: TenantRep, as_user_id: rep-001, captures: { tour_id: $.data.id } }
            - { call: "POST /api/tours/${tour_id}/confirm", as: LeasingManager }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T11:00:00Z" }, as: AssetManager }
            - { call: "POST /api/tours/${tour_id}/complete", as: TenantRep, as_user_id: rep-001 }
            - { call: "POST /api/lois", payload: { requirement_id: "${req_id}", site_id: "${site_id}", term_years: 5, leased_sf: 100000, base_rate_psf: 8.00, ti_allowance_psf: 10.00, free_rent_months: 6, escalation_pct: 0.03 }, as: TenantRep, as_user_id: rep-001, captures: { loi_id: $.data.id, loi_v: $.data.version } }
            - { call: "POST /api/lois/${loi_id}/submit", payload: { expected_loi_version: "${loi_v}" }, as: TenantRep, as_user_id: rep-001 }
          trigger:
            - { call: "POST /api/lois/${loi_id}/accept", as: LeasingManager }
            - { call: "GET /api/sites/${site_id}", as: LeasingManager, captures: { avail_mid: $.data.available_sf, res_mid: $.data.reserved_sf } }
            - { call: "POST /api/lois/${loi_id}/withdraw", as: TenantRep, as_user_id: rep-001 }
            - { call: "GET /api/sites/${site_id}", as: LeasingManager, captures: { avail_end: $.data.available_sf, res_end: $.data.reserved_sf, site_status: $.data.status } }
          assert:
            - "after accept: reserved_sf == 100000 and available_sf == 100000 (100000 + 100000 == 200000)"
            - "after withdraw-from-ACCEPTED: site_status == LISTED, reserved_sf == 0, available_sf == 200000 (200000 + 0 == 200000)"
            - "LOI.${loi_id}.status == WITHDRAWN"

      - name: commission_installment_split_conservation
        grounds:
          - calculations.broker_commission
          - state_machines.CommissionInvoice.INVOICED_to_DISPUTED
          - state_machines.CommissionInvoice.DISPUTED_to_INVOICED
        distinguishing_aspect: |
          Conserved quantity: money. Invariant pinned: installment_1_amount +
          installment_2_amount == total_commission, and tenant.total + landlord.total ==
          tiered combined 137419.26, both BEFORE and AFTER the forward/compensating pair
          issue -> dispute -> re-issue (the dispute cycle must not drift amounts).
        test_recipe:
          setup:
            - "EXECUTED LOI_A (GROSS_AGGREGATE); TENANT_REP invoice issued then paid installment 1"
          setup_api_calls:
            - { call: "POST /api/tenant-requirements", payload: { tenant_name: "Acme Distribution", use_type: DISTRIBUTION, min_sf: 90000, max_sf: 120000, min_clear_height_ft: 32, min_dock_doors: 16, min_power_amps: 3000, min_yard_depth_ft: 150, target_submarket: "Inland Empire", required_delivery_date: "2027-01-01T00:00:00Z" }, as: TenantRep, as_user_id: rep-001, captures: { req_id: $.data.id } }
            - { call: "POST /api/sites", payload: { site_name: "Ridge Logistics Center", submarket: "Inland Empire", parcel_type: EXISTING, total_sf: 200000, clear_height_ft: 36, dock_doors: 20, power_amps: 4000, yard_depth_ft: 200, zoning_designation: "M-1", environmental_phase: PHASE_I_COMPLETE, asking_rate_psf: 6.00 }, as: LeasingManager, captures: { site_id: $.data.id } }
            - { call: "POST /api/tours", payload: { site_id: "${site_id}", requirement_id: "${req_id}", start_at: "2026-08-10T10:00:00Z", end_at: "2026-08-10T11:00:00Z" }, as: TenantRep, as_user_id: rep-001, captures: { tour_id: $.data.id } }
            - { call: "POST /api/tours/${tour_id}/confirm", as: LeasingManager }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T11:00:00Z" }, as: AssetManager }
            - { call: "POST /api/tours/${tour_id}/complete", as: TenantRep, as_user_id: rep-001 }
            - { call: "POST /api/lois", payload: { requirement_id: "${req_id}", site_id: "${site_id}", term_years: 5, leased_sf: 100000, base_rate_psf: 8.00, ti_allowance_psf: 10.00, free_rent_months: 6, escalation_pct: 0.03, commission_basis: GROSS_AGGREGATE }, as: TenantRep, as_user_id: rep-001, captures: { loi_id: $.data.id, loi_v: $.data.version } }
            - { call: "POST /api/lois/${loi_id}/submit", payload: { expected_loi_version: "${loi_v}" }, as: TenantRep, as_user_id: rep-001 }
            - { call: "POST /api/lois/${loi_id}/accept", as: LeasingManager }
            - { call: "POST /api/compliance-reviews", payload: { site_id: "${site_id}", requirement_id: "${req_id}", review_type: ENVIRONMENTAL }, as: ComplianceOfficer, captures: { rev_e: $.data.id } }
            - { call: "POST /api/compliance-reviews/${rev_e}/begin", as: ComplianceOfficer }
            - { call: "POST /api/compliance-reviews/${rev_e}/resolve", payload: { outcome: CLEARED }, as: ComplianceOfficer }
            - { call: "POST /api/compliance-reviews", payload: { site_id: "${site_id}", requirement_id: "${req_id}", review_type: ZONING_USE }, as: ComplianceOfficer, captures: { rev_z: $.data.id } }
