              captures: { review_a: "$.data.id" }
            - call: "POST /lc-terms-reviews/${review_a}/findings"
              as: DocumentaryCreditReviewer
              as_user_id: "u_rev_bob"
              payload: { code: "PARTIAL_SHIPMENT_BARRED", severity: "MINOR", clause_ref: "OTHER", detail: "partial shipments prohibited without buyer consent" }
              captures: { finding_a: "$.data.id" }
          trigger:
            - call: "POST /discrepancy-findings/${finding_a}/waiver"
