          assert:
            - "trigger call 1 -> HTTP 201 with state == PROPOSED, and GET /development-agreements/${agreement_id} now reports a version strictly greater than ${v_read}"
            - "trigger call 2 -> HTTP 412 with data.error_id == ERR_STALE_AGREEMENT_VERSION; ChangeOrder.${co1_id} is untouched (still PROPOSED) and no second order exists"
            - "trigger call 4 -> HTTP 201 with requested_amount_cents == 350000 and state == PROPOSED"
            - "trigger call 5 -> HTTP 200 with ChangeOrder.${co1_id}.state == SUPERSEDED, which is exactly the outcome the stale write was refused for"
            - "the agreement version increased by exactly 1 on each of the two accepted creates and did NOT change on the rejected one"

      - name: corner_occ_royalty_statement_create_rejects_a_stale_agreement_version
        claim_type: optimistic_concurrency
