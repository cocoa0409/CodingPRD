          Rate discovery and cash movement are split across two roles that share one X-User-ID (the
          buyer): the BuyerAdmin who accepted the rate cannot reserve the payment, and the
          BuyerTreasury who reserves it cannot counter an offer. Both refusals are 403
          ERR_UNAUTHORIZED and the role gate precedes the state gate, so the treasury's counter
