        distinguishing_aspect: "With one DRAFT and one ACTIVE contract on two different properties, GET /valet/contracts?status=DRAFT returns exactly the DRAFT one and GET /valet/contracts?property_id=... returns exactly that property's contract — the two filters are independent, not an implicit AND on the last one given."
