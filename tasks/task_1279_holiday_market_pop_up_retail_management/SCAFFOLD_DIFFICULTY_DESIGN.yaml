        distinguishing_aspect: |
          Pair: state (priority 6, ERR_INVALID_STATE) vs business_fiscal
          (priority 15, ERR_INVALID_SETTLEMENT_AMOUNTS). Submitting a settlement
          with negative gross while assignment is not ACTIVE: state error wins.
