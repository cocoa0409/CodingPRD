          - endpoints[POST /licensing/license-applications]
        distinguishing_aspect: "One licensee may not hold two applications for the same classification in DRAFT/SUBMITTED/DEFICIENT, so the second create returns ERR_DUPLICATE_APPLICATION (422) while the first DRAFT row survives."
