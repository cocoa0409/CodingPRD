            - call: "POST /registrations"
              payload: { student_id: "${s1}", course_id: "${co1}" }
              as: Student
              as_user_id: "${s1}"
            - call: "POST /registrations"
              payload: { student_id: "${s2}", course_id: "${co1}" }
              as: Student
              as_user_id: "${s2}"
            - call: "POST /registrations"
              payload: { student_id: "${s1}", course_id: "${co2}" }
              as: Student
              as_user_id: "${s1}"
            - call: "POST /registrations"
              payload: { student_id: "${s3}", course_id: "${co2}" }
              as: Student
              as_user_id: "${s3}"
          trigger:
            - call: "POST /exam-sessions"
              payload: { course_id: "${co1}", room_name: "GYM", room_capacity: 2, start_at: "2027-05-05T09:00:00Z", end_at: "2027-05-05T11:00:00Z" }
              as: ApCoordinator
              captures: { se1: $.data.id }
            - call: "POST /registrations"
              payload: { student_id: "${s3}", course_id: "${co1}" }
              as: Student
              as_user_id: "${s3}"
              captures: { err_full: $.data.error_id }
            - call: "POST /exam-sessions"
              payload: { course_id: "${co2}", room_name: "LAB", room_capacity: 1, start_at: "2027-05-06T09:00:00Z", end_at: "2027-05-06T11:00:00Z" }
              as: ApCoordinator
              captures: { err_short: $.data.error_id }
          assert:
            - "ExamSession.${se1}.seats_reserved == 2 (capacity 2 exactly equals 2 REGISTERED registrations: equality fits)"
            - "Third registration for ${co1} fails with ERR_SESSION_FULL (3 > capacity 2 of the SCHEDULED session)"
            - "Session for ${co2} with capacity 1 fails with ERR_ROOM_CAPACITY_INSUFFICIENT (one short of 2 required seats)"

  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (ExamOrder×TeacherAuthorization vs ExamRegistration×IrregularityReport)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: order_lock_requires_authorized_teacher
        grounds:
          - state_machines.ExamOrder.SUBMITTED_to_LOCKED
          - entities.Course.fields.authorized_teacher_count
          - errors[ERR_TEACHER_NOT_AUTHORIZED]
        distinguishing_aspect: |
          Entity pair (ExamOrder, TeacherAuthorization): the SUBMITTED→LOCKED
          transition is gated on a different entity's state — every ordered
          course needs authorized_teacher_count >= 1. Fails with
          ERR_TEACHER_NOT_AUTHORIZED while the only record is PENDING_TRAINING,
          succeeds after the teacher's record flips to AUTHORIZED.
        test_recipe:
          setup:
            - "Cycle OPEN; course (SUSPENDED: no authorized teacher); one registration; order SUBMITTED on time"
            - "Teacher t1's authorization record exists but is only PENDING_TRAINING"
          setup_api_calls:
            - call: "POST /exam-cycles"
              payload: { name: "CYCLE-2027", registration_deadline_at: "2026-11-01T12:00:00Z", order_deadline_at: "2026-11-15T12:00:00Z", score_release_at: "2027-07-05T12:00:00Z", exam_window_start_at: "2027-05-03T00:00:00Z", exam_window_end_at: "2027-05-21T23:59:59Z", late_fee_cents: 4000, unused_exam_penalty_cents: 1500, fee_reduction_cents: 3600, budget_cap_cents: 100000000, rebate_rate_bp: 900 }
              as: ApCoordinator
              captures: { cy: $.data.id }
            - call: "POST /exam-cycles/${cy}/open"
              as: ApCoordinator
            - call: "POST /courses"
              payload: { cycle_id: "${cy}", subject_code: "AP_CALC_BC", program: "AP", exam_fee_cents: 9800, credit_threshold: 3 }
              as: ApCoordinator
              captures: { co: $.data.id }
            - call: "POST /students"
              payload: { full_name: "Stu A", grade_level: 11, subgroup_code: "GEN" }
              as: ApCoordinator
              captures: { s1: $.data.id }
            - call: "POST /registrations"
              payload: { student_id: "${s1}", course_id: "${co}" }
              as: Student
              as_user_id: "${s1}"
            - call: "POST /exam-orders"
              payload: { cycle_id: "${cy}" }
              as: ApCoordinator
              captures: { ord: $.data.id }
            - call: "POST /exam-orders/${ord}/submit"
              as: ApCoordinator
            - call: "POST /teachers"
              payload: { full_name: "T Instructor", email: "inst@x.edu" }
              as: ApCoordinator
              captures: { t1: $.data.id }
            - call: "POST /teacher-authorizations"
              payload: { teacher_id: "${t1}", course_id: "${co}" }
              as: ApCoordinator
              captures: { ta1: $.data.id }
          trigger:
            - call: "POST /exam-orders/${ord}/lock"
              as: ApCoordinator
              captures: { err: $.data.error_id }
            - call: "POST /teacher-authorizations/${ta1}/complete-training"
              as: Teacher
              as_user_id: "${t1}"
            - call: "POST /exam-orders/${ord}/lock"
              as: ApCoordinator
          assert:
            - "First lock attempt: error_id == ERR_TEACHER_NOT_AUTHORIZED (422) while the course's only record is PENDING_TRAINING"
            - "After complete-training flips the record to AUTHORIZED (course authorized_teacher_count 0 → 1): second lock succeeds, ExamOrder.${ord}.status == LOCKED"

      - name: score_release_blocked_by_open_irregularity
        grounds:
          - state_machines.ExamRegistration.PENDING_to_HELD
          - validations[priority=11]
          - errors[ERR_IRREGULARITY_OPEN]
        distinguishing_aspect: |
          Entity pair (ExamRegistration score record, IrregularityReport): the
          PENDING→RELEASED transition is gated on a different entity's state —
          a FILED report on the session holds the record, and the bulk release
          rejects the whole request with ERR_IRREGULARITY_OPEN, writing nothing
          (transactional). Different entity pair than the order-lock instance.
        test_recipe:
          setup:
            - "Cycle OPEN; course ACTIVE (t1 authorized); student registered r1; session created with proctor t2 ASSIGNED"
            - "Session administered with r1 present (SAT, score PENDING); t2 files an irregularity (record → HELD)"
            - "Clock at score_release_at"
          setup_api_calls:
            - call: "POST /exam-cycles"
              payload: { name: "CYCLE-2027", registration_deadline_at: "2026-11-01T12:00:00Z", order_deadline_at: "2026-11-15T12:00:00Z", score_release_at: "2027-07-05T12:00:00Z", exam_window_start_at: "2027-05-03T00:00:00Z", exam_window_end_at: "2027-05-21T23:59:59Z", late_fee_cents: 4000, unused_exam_penalty_cents: 1500, fee_reduction_cents: 3600, budget_cap_cents: 100000000, rebate_rate_bp: 900 }
              as: ApCoordinator
              captures: { cy: $.data.id }
            - call: "POST /exam-cycles/${cy}/open"
              as: ApCoordinator
            - call: "POST /courses"
              payload: { cycle_id: "${cy}", subject_code: "AP_CALC_BC", program: "AP", exam_fee_cents: 9800, credit_threshold: 3 }
              as: ApCoordinator
              captures: { co: $.data.id }
            - call: "POST /teachers"
              payload: { full_name: "T Instructor", email: "inst@x.edu" }
              as: ApCoordinator
              captures: { t1: $.data.id }
            - call: "POST /teachers"
              payload: { full_name: "T Proctor", email: "proc@x.edu" }
              as: ApCoordinator
              captures: { t2: $.data.id }
            - call: "POST /teacher-authorizations"
              payload: { teacher_id: "${t1}", course_id: "${co}" }
              as: ApCoordinator
              captures: { ta1: $.data.id }
            - call: "POST /teacher-authorizations/${ta1}/complete-training"
              as: Teacher
              as_user_id: "${t1}"
            - call: "POST /students"
              payload: { full_name: "Stu A", grade_level: 11, subgroup_code: "GEN" }
              as: ApCoordinator
              captures: { s1: $.data.id }
            - call: "POST /registrations"
              payload: { student_id: "${s1}", course_id: "${co}" }
              as: Student
              as_user_id: "${s1}"
              captures: { r1: $.data.id }
            - call: "POST /exam-sessions"
              payload: { course_id: "${co}", room_name: "GYM", room_capacity: 5, start_at: "2027-05-05T09:00:00Z", end_at: "2027-05-05T11:00:00Z" }
              as: ApCoordinator
              captures: { se: $.data.id }
            - call: "POST /proctor-assignments"
              payload: { session_id: "${se}", teacher_id: "${t2}" }
              as: ApCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-05-05T12:00:00Z" }
              as: ApCoordinator
            - call: "POST /exam-sessions/${se}/administer"
              payload: { present_registration_ids: ["${r1}"] }
              as: ApCoordinator
            - call: "POST /irregularity-reports"
              payload: { session_id: "${se}", category: "TIMING_ERROR", details: "Section 1 ran 5 minutes short" }
              as: Teacher
              as_user_id: "${t2}"
              captures: { ir: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-07-05T12:00:00Z" }
              as: ApCoordinator
          trigger:
            - call: "POST /exam-cycles/${cy}/release-scores"
              payload: { scores: [{ registration_id: "${r1}", score: 4 }] }
              as: Registrar
              captures: { err: $.data.error_id }
            - call: "GET /registrations/${r1}"
              as: ApCoordinator
          assert:
            - "IrregularityReport.${ir}.status == FILED and ExamSession.${se}.status == UNDER_INVESTIGATION (filing cascade)"
            - "Release attempt: error_id == ERR_IRREGULARITY_OPEN (409)"
            - "Transactional: ExamRegistration.${r1}.score_status == HELD and score is still null (nothing written)"

  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (room half-open vs proctor 30-minute buffer)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: room_half_open_adjacency_allowed
        grounds:
          - errors[ERR_ROOM_CONFLICT]
          - entities.ExamSession.fields.room_name
          - validations[priority=8]
        distinguishing_aspect: |
          Room resource with HALF-OPEN interval semantics: a session starting
          exactly when another ends (11:00 == 11:00) is allowed in the same
          room, while a one-minute overlap is rejected. Different interval
          semantics and different resource than the proctor-buffer instance.
        test_recipe:
          setup:
            - "Cycle OPEN; three ACTIVE courses co1, co2, co3 (same teacher authorized in all three)"
            - "Session for co1 occupies room R1 at 2027-05-05 09:00-11:00"
          setup_api_calls:
            - call: "POST /exam-cycles"
              payload: { name: "CYCLE-2027", registration_deadline_at: "2026-11-01T12:00:00Z", order_deadline_at: "2026-11-15T12:00:00Z", score_release_at: "2027-07-05T12:00:00Z", exam_window_start_at: "2027-05-03T00:00:00Z", exam_window_end_at: "2027-05-21T23:59:59Z", late_fee_cents: 4000, unused_exam_penalty_cents: 1500, fee_reduction_cents: 3600, budget_cap_cents: 100000000, rebate_rate_bp: 900 }
              as: ApCoordinator
              captures: { cy: $.data.id }
            - call: "POST /exam-cycles/${cy}/open"
              as: ApCoordinator
            - call: "POST /courses"
              payload: { cycle_id: "${cy}", subject_code: "AP_CALC_BC", program: "AP", exam_fee_cents: 9800, credit_threshold: 3 }
              as: ApCoordinator
              captures: { co1: $.data.id }
            - call: "POST /courses"
              payload: { cycle_id: "${cy}", subject_code: "AP_BIOLOGY", program: "AP", exam_fee_cents: 9800, credit_threshold: 3 }
              as: ApCoordinator
              captures: { co2: $.data.id }
            - call: "POST /courses"
              payload: { cycle_id: "${cy}", subject_code: "AP_CHEM", program: "AP", exam_fee_cents: 9800, credit_threshold: 3 }
              as: ApCoordinator
              captures: { co3: $.data.id }
            - call: "POST /teachers"
              payload: { full_name: "T One", email: "t1@x.edu" }
              as: ApCoordinator
              captures: { t1: $.data.id }
            - call: "POST /teacher-authorizations"
              payload: { teacher_id: "${t1}", course_id: "${co1}" }
              as: ApCoordinator
              captures: { ta1: $.data.id }
            - call: "POST /teacher-authorizations/${ta1}/complete-training"
              as: Teacher
              as_user_id: "${t1}"
            - call: "POST /teacher-authorizations"
              payload: { teacher_id: "${t1}", course_id: "${co2}" }
              as: ApCoordinator
              captures: { ta2: $.data.id }
            - call: "POST /teacher-authorizations/${ta2}/complete-training"
              as: Teacher
              as_user_id: "${t1}"
            - call: "POST /teacher-authorizations"
              payload: { teacher_id: "${t1}", course_id: "${co3}" }
              as: ApCoordinator
              captures: { ta3: $.data.id }
            - call: "POST /teacher-authorizations/${ta3}/complete-training"
              as: Teacher
              as_user_id: "${t1}"
            - call: "POST /exam-sessions"
              payload: { course_id: "${co1}", room_name: "R1", room_capacity: 5, start_at: "2027-05-05T09:00:00Z", end_at: "2027-05-05T11:00:00Z" }
              as: ApCoordinator
          trigger:
            - call: "POST /exam-sessions"
              payload: { course_id: "${co2}", room_name: "R1", room_capacity: 5, start_at: "2027-05-05T11:00:00Z", end_at: "2027-05-05T13:00:00Z" }
              as: ApCoordinator
              captures: { se2: $.data.id }
            - call: "POST /exam-sessions"
              payload: { course_id: "${co3}", room_name: "R1", room_capacity: 5, start_at: "2027-05-05T10:59:00Z", end_at: "2027-05-05T12:00:00Z" }
              as: ApCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "Back-to-back session (start 11:00 == prior end 11:00) succeeds: ExamSession.${se2}.status == SCHEDULED (half-open [start, end) semantics)"
            - "One-minute-overlap session (10:59 start) fails with ERR_ROOM_CONFLICT (409)"

      - name: proctor_buffered_gap_conflict
        grounds:
          - errors[ERR_PROCTOR_OVERLAP]
          - state_machines.ProctorAssignment
          - validations[priority=8]
        distinguishing_aspect: |
          Teacher resource with BUFFERED interval semantics: assignments conflict
          unless session windows are separated by a gap of at least 30 minutes —
          a 30-minute gap is allowed, a 29-minute gap is rejected. Different
          interval semantics (buffer vs half-open adjacency) and different
          resource (teacher, not room) than the room instance.
        test_recipe:
          setup:
            - "Cycle OPEN; three ACTIVE courses co1, co2, co3 (authorized teacher t_auth); proctor p holds NO authorizations"
            - "Sessions: s1 09:00-10:00 (room P1), s2 10:30-12:00 (room P2), s3 10:29-12:00 (room P3); p already ASSIGNED to s1"
