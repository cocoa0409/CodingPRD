  - rule_id: priority_pair_validation_conflict
    instances:
      - name: pvc_state_beats_temporal_on_record_result
        grounds:
          - validations[priority=8]
          - validations[priority=10]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_INSPECTION_DATE_INVALID]
        distinguishing_aspect: |
          Category pair state(8) vs business_temporal(10): recording a result on a CANCELLED
          inspection with a future occurred_at violates both rules; the state error
          ERR_INVALID_STATE (409) must win over ERR_INSPECTION_DATE_INVALID (422).
