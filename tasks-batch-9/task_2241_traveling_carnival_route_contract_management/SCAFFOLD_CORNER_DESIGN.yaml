      - name: settlement_variant_divergence_on_identical_ticket_rows
        claim_type: variant_divergence
        grounds:
          - calculations.stop_settlement.variants
          - entities.Settlement.fields.settlement_due_cents
        excluded_because:
          difficulty_instance: dual_variant_calc / settlement_provisional_vs_final_diverge_on_guarantee_basis_and_ride_count
          rationale: "Both variants are computed on one byte-identical fixture there, with the 1913759 -> 1618759 delta asserted field by field."

      - name: settlement_variant_selection_at_creation_versus_finalization
        claim_type: variant_selection
        grounds:
          - calculations.stop_settlement.variants
          - entities.Settlement.fields.variant
        excluded_because:
          difficulty_instance: dual_variant_calc / settlement_provisional_vs_final_diverge_on_guarantee_basis_and_ride_count
          rationale: "The same instance asserts variant == PROVISIONAL at creation and variant == FINAL after finalize, i.e. the selection rule itself."

      - name: worker_duty_exposure_reconciles_after_a_shift_is_released
        claim_type: reconciliation
        grounds:
          - calculations.worker_duty_exposure.variants
          - entities.Worker.fields.scheduled_hours_total
          - entities.Worker.fields.worked_days_count
        excluded_because:
          difficulty_instance: dual_variant_calc / worker_duty_exposure_scheduled_basis_gate_versus_worked_basis_counter
          rationale: "The release-and-rebook step of that instance is exactly the reconciliation between the SCHEDULED_BASIS and WORKED_BASIS variants."

      - name: split_tier_boundary_is_probed_from_both_sides
        claim_type: tiered_pricing
        grounds:
          - calculations.stop_settlement.constants.SPLIT_TIER_1_CENTS
          - entities.Settlement.fields.effective_operator_pct
        excluded_because:
          difficulty_instance: boundary_precision_check / split_tier_lower_bound_is_inclusive_at_exactly_two_million_net_cents
          rationale: "1999999 vs 2000000 taxable net cents are both driven there, with the 65 -> 67.5 pct step and the resulting split_share_cents asserted as literals."

      - name: labor_cost_aggregation_rounds_each_row_before_summing
        claim_type: aggregation
        grounds:
          - calculations.stop_labor_cost.precision
          - entities.RouteStop.fields.labor_cost_provisional_cents
        excluded_because:
          difficulty_instance: combinatorial_formula / stop_labor_cost_rounds_each_assignment_before_summing_the_lot_total
          rationale: "The 44638-vs-44637 round-then-sum divergence is the entire subject of that instance."

      - name: inspection_slot_waterfall_fills_the_earliest_free_day_first
        claim_type: waterfall_allocation
        grounds:
          - calculations.inspection_slot_selector
          - errors[ERR_INSPECTION_SLOTS_FULL]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / inspection_slot_buckets_are_half_open_utc_days_per_jurisdiction
          rationale: "Per-day capacity consumption, the earliest-day ranking and the full-bucket rejection are all asserted there."

      - name: power_headroom_threshold_admits_exact_equality
        claim_type: threshold
        grounds:
          - calculations.lot_capacity_charge.constants.POWER_HEADROOM_PCT
          - errors[ERR_LOT_POWER_EXCEEDED]
        excluded_because:
          difficulty_instance: boundary_precision_check / lot_power_headroom_admits_exact_equality_then_rejects_one_more_amp
          rationale: "The at-threshold and threshold+1 amp probes against allowed_amps 900.0 are driven there."

      - name: posture_ladder_propagates_to_a_fixed_point_before_the_gate
        claim_type: constraint_propagation
        grounds:
          - calculations.stop_compliance_posture
          - entities.RouteStop.fields.compliance_posture
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / open_gates_blocked_by_a_sibling_event_permit_still_awaiting_decision
          rationale: "That instance drives the posture from PERMIT_HOLD to CLEAR through a sibling permit decision and asserts the gate outcome on both sides of the propagation."

      - name: stop_settlement_pinned_step_order_produces_the_declared_result
        claim_type: correct_result
        grounds:
          - calculations.stop_settlement.formula
          - entities.Settlement.fields.split_share_cents
        excluded_because:
          difficulty_instance: combinatorial_formula / stop_settlement_pinned_step_order_resolves_tier_penalty_guarantee_cycle
          rationale: "All eight pinned steps and their literal intermediate values (gross 3032300, tax 197101, net 2835199, split 1913759) are asserted there."

      - name: makegood_cap_limits_the_final_deduction
        claim_type: constants_applied
        grounds:
          - calculations.makegood_amount.constants.MAKEGOOD_CAP_PCT
          - entities.Settlement.fields.makegood_deduction_cents
        excluded_because:
          difficulty_instance: dual_variant_calc / settlement_provisional_vs_final_diverge_on_guarantee_basis_and_ride_count
          rationale: "The uncapped 398700 raw amount and the 270000 cap (30 pct of a 900000 guarantee) are both asserted there."

  # ===========================================================================
  # SECTION 4 — Validations
  # ===========================================================================
  - section: validations
    instances:

      - name: a_setup_shift_starting_before_load_in_start_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=75]
          - errors[ERR_SHIFT_OUTSIDE_STOP_WINDOW]
          - entities.CrewAssignment.fields.shift_start
          - entities.RouteStop.fields.labor_cost_provisional_cents
        distinguishing_aspect: |
          SETUP and TEARDOWN shifts are bounded by [load_in_start, teardown_deadline] — a wider window than the
          [open_date, close_date] window that binds RIDE_OPERATOR and TICKETING — so a shift beginning two hours
          before load_in_start is a priority-75 ERR_SHIFT_OUTSIDE_STOP_WINDOW (422) and neither the stop's labor
          ledger nor the worker's scheduled hours move.
        test_recipe:
          setup:
            - "Jurisdiction OH, Venue V1, Route R1 in DRAFT with PLANNED stop A (load-in 2026-09-01T06:00Z, teardown 2026-09-08T12:00Z)."
            - "Worker Rigger One: PERMANENT, hourly_rate_cents 2000, housing_required false."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdictions"
              payload: { state_code: "OH", name: "Ohio", permit_lead_days: 10, amusement_tax_pct: 6.5, permit_fee_cents: 50000 }
              as: PlatformAdmin
