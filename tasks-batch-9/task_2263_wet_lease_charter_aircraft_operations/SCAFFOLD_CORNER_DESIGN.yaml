        grounds:
          - rbac.Lessee
          - rbac.LessorOpsController
          - rbac.BillingAdmin
          - rbac.RegulatoryAuthority
          - endpoints[POST /wetlease/substitutions/{substitutionId}/consent]
          - errors.ERR_UNAUTHORIZED
