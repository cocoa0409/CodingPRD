scenario: |
  Foreign exchange trading risk control system: trader limit management with per-trader daily/overnight limits,
  currency-pair sub-limits, stop-loss limit, intraday-and-overnight limit separation, limit-temporary-adjustment
  approval, and limit-utilization real-time tracking; position monitoring with per-trader and per-desk position
  aggregation, multi-currency position consolidation, real-time mark-to-market, position-limit warning thresholds,
  and end-of-day position reconciliation; exposure calculation with net-open-position and gross exposure,
  value-at-risk (VaR) calculation, sensitivity analysis (delta/gamma/vega for FX options), stress-test scenarios,
  and cross-currency netting; stop-loss triggering with rule-based stop-loss (price/loss-amount/loss-ratio),
  real-time price feed monitoring, trigger-action workflow (alert/forced-flatten), trader-acknowledgment-and-override
  rules, and stop-loss-event archiving; compliance reporting with regulatory reporting (large-trade/suspicious-
  transaction), internal-control reporting, deal-record retention, regulator-inquiry response support, and
  reporting-version control; counterparty credit rating with internal-rating model, external-rating ingestion,
  counterparty-limit by rating, rating-change-triggered limit adjustment, and watchlist management; settlement
  netting with bilateral and multilateral netting agreements, CLS-style payment-versus-payment, netting calculation
  engine, settlement-instruction generation, failed-settlement handling, and Nostro/Vostro reconciliation;
  event-driven synchronization with trading systems, market-data feed, banking, and regulatory reporting platforms;
  audit logging for limit changes and risk events.

domain_name: fx-risk-control
api_prefix: /fx-risk

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - cascading_side_effects
    - rate_threshold_triggers
    - dual_variant_calculation
    - scheduled_deferred_actions
    - idempotency
  entity_topology: flat
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — copied verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Trader
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: trader display name
      - name: desk_code
        type: string
        source: input
        description: trading desk this trader belongs to (e.g., G10_SPOT, EM_FX, OPTIONS)
        constraints: "must be one of {G10_SPOT, EM_FX, OPTIONS}"
      - name: status
        type: enum
        source: computed
        description: trader operational status
        constraints: "ACTIVE | SUSPENDED — SUSPENDED set when CounterpartyRating cascade or risk officer suspends"
        default: ACTIVE

  - name: CurrencyPair
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: pair code in BASE_QUOTE form, uppercase, six letters (e.g., EURUSD, USDJPY)
        constraints: "exactly 6 uppercase letters; unique across CurrencyPair"
      - name: base_ccy
        type: string
        source: input
        description: base currency ISO-4217 code (3 uppercase letters)
      - name: quote_ccy
        type: string
        source: input
        description: quote currency ISO-4217 code (3 uppercase letters)
      - name: mid_rate
        type: number
        source: input
        description: current mid market rate; updated by POST /market-data/quote
        constraints: "> 0; 6 decimal places"
      - name: daily_volatility
        type: number
        source: input
        description: 1-day historical volatility as decimal (e.g., 0.008 = 0.8%); used in VaR
        constraints: ">= 0; 6 decimal places"

  - name: Limit
    parent: Trader
    common_fields: true
    fields:
      - name: trader_id
        type: string
        source: input
        description: owning trader id
      - name: pair_code
        type: string
        source: input
        description: currency pair this limit applies to; null = aggregate limit across all pairs
        default: null
      - name: bucket
        type: enum
        source: input
        description: which exposure window this limit gates
        constraints: "INTRADAY | OVERNIGHT"
      - name: notional_cap_usd
        type: number
        source: input
        description: maximum absolute net-open-position in USD-equivalent the trader may hold in this bucket
        constraints: "> 0; 2 decimal places"
      - name: stop_loss_cap_usd
        type: number
        source: input
        description: maximum cumulative realized+unrealized loss in USD this bucket tolerates before stop-loss is armed
        constraints: ">= 0; 2 decimal places"
      - name: temporary_override_usd
        type: number
        source: computed
        description: additive override to notional_cap_usd while an APPROVED LimitAdjustmentRequest is in effect; 0 otherwise
        default: 0
      - name: utilization_usd
        type: number
        source: computed
        description: current absolute net-open-position in USD-equivalent within the bucket
        default: 0
      - name: utilization_pct
        type: number
        source: computed
        description: utilization_usd / (notional_cap_usd + temporary_override_usd) * 100; 2 decimal places
        default: 0

  - name: LimitAdjustmentRequest
    parent: Limit
    common_fields: true
    fields:
      - name: limit_id
        type: string
        source: input
        description: target Limit id
      - name: requested_delta_usd
        type: number
        source: input
        description: additive change to notional_cap_usd; positive only
        constraints: "> 0; 2 decimal places"
      - name: justification
        type: string
        source: input
        description: free-text business justification (1..500 chars)
      - name: expires_at
        type: datetime
        source: input
        description: ISO 8601 UTC; APPROVED override auto-expires at this instant
      - name: status
        type: enum
        source: computed
        description: workflow status
        constraints: "PENDING | APPROVED | REJECTED | REVISION_REQUESTED | EXPIRED"
        default: PENDING
      - name: requester_trader_id
        type: string
        source: system
        description: copy of X-User-ID at creation time (must equal limit.trader_id)
      - name: approver_user_id
        type: string
        source: system
        description: RiskOfficer user id who APPROVED or REJECTED; null until decided
        default: null

  - name: Trade
    parent: Trader
    common_fields: false
    fields:
      - name: trader_id
        type: string
        source: input
        description: trader who booked the trade
      - name: pair_code
        type: string
        source: input
        description: currency pair traded
      - name: side
        type: enum
        source: input
        description: BUY = long base, SELL = short base
        constraints: "BUY | SELL"
      - name: notional_base
        type: number
        source: input
        description: notional in base currency (positive)
        constraints: "> 0; 2 decimal places"
      - name: entry_rate
        type: number
        source: input
        description: execution rate (quote per base)
        constraints: "> 0; 6 decimal places"
      - name: executed_at
        type: datetime
        source: system
        description: ISO 8601 UTC at booking time
      - name: trading_day
        type: string
        source: system
        description: YYYY-MM-DD value of the system clock at booking; used for INTRADAY vs OVERNIGHT bucketing
      - name: counterparty_id
        type: string
        source: input
        description: Counterparty id facing this trade
      - name: status
        type: enum
        source: computed
        description: trade lifecycle status
        constraints: "BOOKED | NETTED | SETTLED | FAILED"
        default: BOOKED

  - name: Position
    parent: Trader
    common_fields: true
    fields:
      - name: trader_id
        type: string
        source: input
        description: trader owning the position
      - name: pair_code
        type: string
        source: input
        description: currency pair
      - name: net_base
        type: number
        source: computed
        description: signed sum of (BUY +notional_base, SELL -notional_base) over all BOOKED trades in current trading_day
        default: 0
      - name: net_open_usd
        type: number
        source: computed
        description: net_base * mid_rate_in_usd (see §1.3 net_open_position); 2 decimal places
        default: 0
      - name: mtm_pnl_usd
        type: number
        source: computed
        description: unrealized mark-to-market PnL in USD across BOOKED trades for this pair, recomputed on each quote update
        default: 0
      - name: warning_status
        type: enum
        source: computed
        description: NORMAL when utilization_pct < 80; WARNING when 80 <= utilization_pct < 100; BREACH when utilization_pct >= 100
        constraints: "NORMAL | WARNING | BREACH"
        default: NORMAL

  - name: StopLossEvent
    parent: Trader
    common_fields: true
    fields:
      - name: trader_id
        type: string
        source: input
        description: trader whose limit triggered
      - name: pair_code
        type: string
        source: input
        description: pair whose price/loss crossed the rule
      - name: rule_mode
        type: enum
        source: input
        description: which trigger metric to evaluate
        constraints: "PRICE | LOSS_AMOUNT | LOSS_RATIO"
      - name: threshold_value
        type: number
        source: input
        description: |
          mode-dependent: PRICE = absolute pair price level;
          LOSS_AMOUNT = USD loss magnitude (positive number);
          LOSS_RATIO = decimal loss/notional (e.g., 0.02 = 2%)
        constraints: "> 0"
      - name: action
        type: enum
        source: input
        description: action to perform on trigger
        constraints: "ALERT | FORCED_FLATTEN"
      - name: state
        type: enum
        source: computed
        description: workflow state of this stop-loss rule
        constraints: "ARMED | TRIGGERED | ACKNOWLEDGED | OVERRIDDEN | EXECUTED | ARCHIVED"
        default: ARMED
      - name: triggered_at
        type: datetime
        source: system
        description: ISO 8601 UTC when first transitioned ARMED→TRIGGERED; null otherwise
        default: null
      - name: triggering_value
        type: number
        source: system
        description: observed metric value at trigger time; null until TRIGGERED
        default: null

  - name: Counterparty
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: counterparty legal name
      - name: external_rating
        type: enum
        source: input
        description: external rating ingestion (S&P-style)
        constraints: "AAA | AA | A | BBB | BB | B | CCC | NR"
      - name: internal_score
        type: integer
        source: input
        description: internal-model score 0..100
        constraints: "0 <= internal_score <= 100"
      - name: rating_band
        type: enum
        source: computed
        description: |
          derived band used for limit assignment:
          band_from_external(AAA,AA → INVESTMENT; A,BBB → STANDARD; BB,B → SPECULATIVE; CCC,NR → WATCH)
          band_from_internal(>=80 → INVESTMENT; 60..79 → STANDARD; 40..59 → SPECULATIVE; <40 → WATCH)
          final = WORSE of the two bands (ordering INVESTMENT < STANDARD < SPECULATIVE < WATCH)
        constraints: "INVESTMENT | STANDARD | SPECULATIVE | WATCH"
        default: STANDARD
      - name: credit_limit_usd
        type: number
        source: computed
        description: ceiling on aggregate notional facing this counterparty; tiered by rating_band (see §1.3 counterparty_credit_limit)
        default: 0
      - name: on_watchlist
        type: boolean
        source: computed
        description: true iff rating_band == WATCH; toggled by ratings updates
        default: false

  - name: SettlementInstruction
    parent: Counterparty
    common_fields: true
    fields:
      - name: counterparty_id
        type: string
        source: input
        description: counterparty this instruction settles against
      - name: value_date
        type: string
        source: input
        description: YYYY-MM-DD settlement value date
      - name: ccy
        type: string
        source: computed
        description: ISO-4217 currency code; one row per (counterparty, value_date, ccy)
      - name: gross_pay_amount
        type: number
        source: computed
        description: total outbound flow in ccy before netting
        default: 0
      - name: gross_receive_amount
        type: number
        source: computed
        description: total inbound flow in ccy before netting
        default: 0
      - name: net_amount
        type: number
        source: computed
        description: signed net flow (positive = we pay, negative = we receive); see §1.3 multilateral_netting
        default: 0
      - name: status
        type: enum
        source: computed
        description: instruction lifecycle
        constraints: "GENERATED | SENT | SETTLED | FAILED | RECONCILED"
        default: GENERATED
      - name: client_request_id
        type: string
        source: input
        description: caller-supplied idempotency key for generation request
      - name: nostro_balance_delta
        type: number
        source: computed
        description: signed adjustment applied to the bank's Nostro account on SETTLED/RECONCILED transitions
        default: 0

  - name: ComplianceReport
    parent: null
    common_fields: false
    fields:
      - name: report_type
        type: enum
        source: input
        description: type of regulatory report
        constraints: "LARGE_TRADE | SUSPICIOUS_TRANSACTION | INTERNAL_CONTROL"
      - name: reference_trade_id
        type: string
        source: input
        description: triggering Trade id (null for INTERNAL_CONTROL)
        default: null
      - name: version
        type: integer
        source: system
        description: monotonic version for this report_type+reference_trade_id pair; 1 on first emission, +1 on each amendment
      - name: payload
        type: object
        source: computed
        description: canonical report body (trader, pair, notional_usd, counterparty, narrative)
      - name: filed_at
        type: datetime
        source: system
        description: ISO 8601 UTC; immutable
      - name: filed_by_user_id
        type: string
        source: system
        description: ComplianceOfficer id who filed

  - name: AuditLog
    parent: null
    common_fields: false
    fields:
      - name: event_type
        type: enum
        source: input
        description: kind of audit event
        constraints: "LIMIT_CHANGE | LIMIT_OVERRIDE_APPROVED | LIMIT_OVERRIDE_EXPIRED | STOP_LOSS_TRIGGERED | STOP_LOSS_OVERRIDDEN | RATING_CHANGE | TRADE_BOOKED | SETTLEMENT_FAILED | REPORT_FILED"
      - name: actor_user_id
        type: string
        source: system
        description: X-User-ID of actor (or "SYSTEM" for clock-driven events)
      - name: actor_role
        type: string
        source: system
        description: X-User-Role of actor
      - name: subject_entity
        type: string
        source: system
        description: entity name affected (Trader, Limit, StopLossEvent, ...)
      - name: subject_id
        type: string
        source: system
        description: id of affected entity
      - name: before_snapshot
        type: object
        source: system
        description: relevant field values pre-mutation; null for create
        default: null
      - name: after_snapshot
        type: object
        source: system
        description: relevant field values post-mutation

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: LimitAdjustmentRequest
    initial_state: PENDING
    terminal_states: [APPROVED, REJECTED, EXPIRED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /limit-adjustments/{id}/approve"
        actor: RiskOfficer
        preconditions:
          - "request.status == PENDING"
          - "approver X-User-ID != request.requester_trader_id (segregation of duties)"
          - "limit.trader.status == ACTIVE"
          - "request.expires_at > server clock now()"
        side_effects:
          - "Limit.temporary_override_usd += request.requested_delta_usd"
          - "Recompute Limit.utilization_pct (see §1.3 limit_utilization)"
          - "If Position.warning_status was BREACH and new utilization_pct < 100, transition Position.warning_status to WARNING or NORMAL accordingly (cross-entity cascade)"
          - "AuditLog row: event_type=LIMIT_OVERRIDE_APPROVED"

      - from: PENDING
        to: REJECTED
        trigger: "POST /limit-adjustments/{id}/reject"
        actor: RiskOfficer
        preconditions:
          - "request.status == PENDING"
          - "approver X-User-ID != request.requester_trader_id"
        side_effects:
          - "AuditLog row"

      - from: PENDING
        to: REVISION_REQUESTED
        trigger: "POST /limit-adjustments/{id}/request-revision"
        actor: RiskOfficer
        preconditions:
          - "request.status == PENDING"
        side_effects:
          - "AuditLog row"

      - from: REVISION_REQUESTED
        to: PENDING
        trigger: "PATCH /limit-adjustments/{id} (Trader resubmits)"
        actor: Trader
        preconditions:
          - "request.status == REVISION_REQUESTED"
          - "actor X-User-ID == request.requester_trader_id"
        side_effects:
          - "AuditLog row"

      - from: APPROVED
        to: EXPIRED
        trigger: "POST /_clock/advance crossing request.expires_at, OR POST /_sweep/run"
        actor: system
        preconditions:
          - "server clock now() >= request.expires_at"
        side_effects:
          - "Limit.temporary_override_usd -= request.requested_delta_usd  # invariant: returns to baseline cap"
          - "Recompute Limit.utilization_pct"
          - "If new utilization_pct >= 100 and Position.warning_status was NORMAL/WARNING, transition Position.warning_status to BREACH"
          - "AuditLog row: event_type=LIMIT_OVERRIDE_EXPIRED"

  - entity: StopLossEvent
    initial_state: ARMED
    terminal_states: [ARCHIVED]
    transitions:
      - from: ARMED
        to: TRIGGERED
        trigger: "POST /market-data/quote crossing rule threshold (system), or POST /stop-loss/{id}/evaluate"
        actor: system
        preconditions:
          - "event.state == ARMED"
          - "for PRICE rule: BUY → current_mid <= threshold_value; SELL → current_mid >= threshold_value"
          - "for LOSS_AMOUNT rule: |Position.mtm_pnl_usd| >= threshold_value AND mtm_pnl_usd < 0"
          - "for LOSS_RATIO rule: |Position.mtm_pnl_usd| / (Position.net_base * mid_rate_in_usd) >= threshold_value AND mtm_pnl_usd < 0"
        side_effects:
          - "Set triggered_at = now(); triggering_value = observed metric"
          - "AuditLog row: event_type=STOP_LOSS_TRIGGERED"

      - from: TRIGGERED
        to: ACKNOWLEDGED
        trigger: "POST /stop-loss/{id}/acknowledge"
        actor: Trader
        preconditions:
          - "event.state == TRIGGERED"
          - "actor X-User-ID == event.trader_id"
          - "Trader.status == ACTIVE"
        side_effects:
          - "AuditLog row"

      - from: ACKNOWLEDGED
        to: OVERRIDDEN
        trigger: "POST /stop-loss/{id}/override"
        actor: RiskOfficer
        preconditions:
          - "event.state == ACKNOWLEDGED"
          - "override actor X-User-ID != event.trader_id (segregation)"
        side_effects:
          - "Reset event.state plan: event re-enters ARMED at next /_sweep/run unless ARCHIVED first; record OVERRIDDEN in AuditLog"
          - "AuditLog row: event_type=STOP_LOSS_OVERRIDDEN"

      - from: OVERRIDDEN
        to: ARMED
        trigger: "POST /_sweep/run"
        actor: system
        preconditions:
          - "event.state == OVERRIDDEN"
        side_effects:
          - "Clear triggered_at and triggering_value"

      - from: TRIGGERED
        to: EXECUTED
        trigger: "POST /stop-loss/{id}/execute"
        actor: RiskOfficer
        preconditions:
          - "event.state == TRIGGERED"
          - "event.action == FORCED_FLATTEN"
          - "executor X-User-ID != event.trader_id"
        side_effects:
          - "Insert offsetting Trade closing Position.net_base to zero on event.pair_code at current mid_rate (cascading: Position recomputed, Limit.utilization recomputed)"
          - "If resulting Trade notional_usd >= LARGE_TRADE_THRESHOLD_USD (10000000), emit ComplianceReport (report_type=LARGE_TRADE) at version=N+1 (cascading)"
          - "AuditLog row"

      - from: EXECUTED
        to: ARCHIVED
        trigger: "POST /_sweep/run (next sweep after EXECUTED)"
        actor: system
        preconditions:
          - "event.state == EXECUTED"
        side_effects:
          - "Event becomes read-only; no further transitions"

  - entity: SettlementInstruction
    initial_state: GENERATED
    terminal_states: [RECONCILED, FAILED]
    transitions:
      - from: GENERATED
        to: SENT
        trigger: "POST /settlements/{id}/send"
        actor: SettlementOperator
        preconditions:
          - "instruction.status == GENERATED"
          - "Counterparty.on_watchlist == false (watchlist counterparties must be cleared by RiskOfficer first)"
        side_effects:
          - "AuditLog row"
      - from: SENT
        to: SETTLED
        trigger: "POST /settlements/{id}/confirm"
        actor: SettlementOperator
        preconditions:
          - "instruction.status == SENT"
        side_effects:
          - "Set nostro_balance_delta = -net_amount (we paid out our net obligation)"
          - "All linked Trade rows transition BOOKED→SETTLED"
      - from: SETTLED
        to: RECONCILED
        trigger: "POST /settlements/{id}/reconcile"
        actor: SettlementOperator
        preconditions:
          - "instruction.status == SETTLED"
        side_effects:
          - "AuditLog row; Nostro/Vostro reconciliation marker set"
      - from: SENT
        to: FAILED
        trigger: "POST /settlements/{id}/mark-failed"
        actor: SettlementOperator
        preconditions:
          - "instruction.status == SENT"
        side_effects:
          - "All linked Trade rows transition BOOKED→FAILED"
          - "AuditLog row: event_type=SETTLEMENT_FAILED"
          - "Counterparty.internal_score -= 5 (clamped >= 0); recompute Counterparty.rating_band; if band shifts toward WATCH, recompute Counterparty.credit_limit_usd; if new credit_limit < aggregate facing notional, set Trader.status=SUSPENDED for every trader who breached (transitive cascade depth 4: Settlement → Counterparty.score → Counterparty.band/limit → Trader.status)"

  - entity: Counterparty
    initial_state: STANDARD
    terminal_states: []
    transitions:
      - from: STANDARD
        to: WATCH
        trigger: "PATCH /counterparties/{id} updating external_rating or internal_score such that rating_band becomes WATCH"
        actor: ComplianceOfficer
        preconditions:
          - "computed rating_band == WATCH"
        side_effects:
          - "Set on_watchlist = true"
          - "Recompute credit_limit_usd via §1.3 counterparty_credit_limit (drops to WATCH tier amount)"
          - "AuditLog row: event_type=RATING_CHANGE"
          - "Any SettlementInstruction with status=GENERATED facing this counterparty stays GENERATED but POST /settlements/{id}/send is now blocked until counterparty is cleared (cross-entity gating)"
      - from: WATCH
        to: STANDARD
        trigger: "PATCH /counterparties/{id} updating rating fields away from WATCH"
        actor: ComplianceOfficer
        preconditions:
          - "computed rating_band != WATCH"
        side_effects:
          - "Set on_watchlist = false"
          - "Recompute credit_limit_usd"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two RiskOfficers simultaneously approve and reject the same LimitAdjustmentRequest"
    guarantee: "Exactly one decision is recorded; the loser sees the request already terminal"
    error_id: ERR_REQUEST_ALREADY_DECIDED
    http_status: 409
    serialization: "First-writer-wins on LimitAdjustmentRequest.status leaving PENDING"

  - scenario: "Two traders book trades that each fit individually but together exceed the same Limit.notional_cap_usd + temporary_override_usd"
    guarantee: "First trade is BOOKED; second is rejected (aggregate limit breach detected on write)"
    error_id: ERR_LIMIT_BREACH
    http_status: 409
    serialization: "First-writer-wins; second trade re-evaluates utilization against the post-write state"

  - scenario: "Two clients POST /settlements with the same client_request_id for the same (counterparty, value_date)"
    guarantee: "Exactly one SettlementInstruction is created; duplicate request returns the existing instruction id with 200 (idempotent replay)"
    error_id: ERR_IDEMPOTENCY_REPLAY
    http_status: 200
    serialization: "Idempotency-key-based; second caller receives the first caller's response body"

  - scenario: "Two operators simultaneously confirm and mark-failed the same SettlementInstruction in SENT"
    guarantee: "Exactly one terminal status sticks"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on SettlementInstruction.status leaving SENT"

  - scenario: "Stop-loss /override and /execute called simultaneously on a TRIGGERED FORCED_FLATTEN event"
    guarantee: "Exactly one wins; loser sees state already advanced"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on StopLossEvent.state leaving TRIGGERED"

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: net_open_position
    trigger: "Trade created, Trade status change, or POST /market-data/quote updating mid_rate; recompute Position.net_base and Position.net_open_usd for the (trader_id, pair_code) tuple"
    algorithm: aggregation
    formula: |
      # Inclusion set: Trade rows with status IN {BOOKED} and trading_day == current_trading_day(server clock)
      # Sort by executed_at ASC; tie-break by Trade.id lexicographic ASC
      signed_base = 0
      for t in sorted(included, key=(executed_at, id)):
          delta = t.notional_base if t.side == 'BUY' else -t.notional_base
          signed_base = signed_base + delta
      net_base = signed_base                                         # signed
      # Convert to USD using base_in_usd_rate(pair_code):
      #   if base_ccy == 'USD'  → 1
      #   if quote_ccy == 'USD' → mid_rate          (price is USD per 1 base when quote=USD)
      #   else                  → mid_rate * usd_rate(quote_ccy)
      #   where usd_rate(ccy)  → if ccy=='USD' then 1 else mid_rate of pair 'USD{ccy}' (look up triangulation)
      net_open_usd = round_half_up(net_base * base_in_usd_rate(pair_code), 2)
    input_set: "Trade rows with status IN {BOOKED} and trading_day == today"
    constants:
      ROUND_MODE: half_up
      DECIMALS_USD: 2
    precision: "2 decimal places, round_half_up"

  - name: limit_utilization
    trigger: "Recomputed whenever Position.net_open_usd changes, Limit fields change, an adjustment is APPROVED/EXPIRED, or POST /positions/recompute is invoked"
    algorithm: threshold
    formula: |
      effective_cap_usd = Limit.notional_cap_usd + Limit.temporary_override_usd
      utilization_usd = abs(Position.net_open_usd_for_bucket(bucket))
      utilization_pct = round_half_up(utilization_usd / effective_cap_usd * 100, 2)
      # Warning levels (strictly < / <= / >=, pin boundaries):
      if utilization_pct >= 100:  warning_status = BREACH      # >= 100 is a BREACH
      elif utilization_pct >= 80: warning_status = WARNING     # 80 <= x < 100
      else:                       warning_status = NORMAL
    input_set: |
      Per (trader_id, pair_code, bucket) where bucket ∈ {INTRADAY, OVERNIGHT}.
      Bucket selection: trades booked today AND server clock time-of-day in [00:00, 17:00) UTC contribute to INTRADAY;
      trades from prior trading_days OR booked today after 17:00 UTC contribute to OVERNIGHT.
      Boundary: exactly 17:00:00.000 UTC counts as OVERNIGHT (>= 17:00).
    constants:
      WARNING_PCT: 80
      BREACH_PCT: 100
      EOD_CUTOFF_UTC: "17:00:00"
    precision: "2 decimal places for utilization_pct"
    variants:
      - name: intraday_utilization
        when: "bucket == INTRADAY; same-day BOOKED trades only; excludes prior trading_day positions"
        difference: "denominator uses the INTRADAY Limit row's notional_cap_usd; positions reset to zero at EOD reconciliation"
      - name: overnight_utilization
        when: "bucket == OVERNIGHT; carries over prior trading_day positions; same-day trades booked at or after 17:00 UTC"
        difference: "denominator uses the OVERNIGHT Limit row; same set of trades produces a DIFFERENT utilization_pct number because the cap differs and the inclusion set is wider"

  - name: gross_exposure
    trigger: "GET /traders/{id}/exposure; recomputed on any Trade/Position change or quote update"
    algorithm: aggregation
    formula: |
      # Gross: sum of absolute USD positions across pairs (no netting across pairs)
      gross_usd = 0
      for p in Positions.where(trader_id == X):
          gross_usd = gross_usd + abs(p.net_open_usd)
      gross_usd = round_half_up(gross_usd, 2)
      # Net: cross-currency netted via leg decomposition into ISO currency exposures, then |sum| per currency, then sum
      legs = {}   # ccy → signed USD
      for p in Positions.where(trader_id == X):
          # BUY EURUSD long 1 → +EUR notional, -USD notional*entry_rate (we'll use mid_rate for current value)
          base_legs[p.base_ccy] += p.net_base * usd_rate(p.base_ccy)
          base_legs[p.quote_ccy] -= p.net_base * p.mid_rate * usd_rate(p.quote_ccy)
      net_usd = round_half_up(sum(abs(v) for v in base_legs.values()), 2)
    input_set: "All Position rows for the trader where net_base != 0"
    constants:
      ROUND_MODE: half_up
    precision: "2 decimal places, round_half_up"

  - name: value_at_risk
    trigger: "GET /traders/{id}/var; recomputed on any quote update or trade event"
    algorithm: weighted_scoring
    formula: |
      # Parametric 1-day VaR at 99% confidence, single-asset additive (correlation = 1 assumption):
      # Evaluation order (pinned):
      #   step 1: for each Position p compute exposure_usd = abs(p.net_open_usd)
      #   step 2: per-pair var_p = exposure_usd * pair.daily_volatility * Z_99
      #   step 3: round each var_p to 2 dp half-up
      #   step 4: total_var = sum(var_p over all pairs)
      # This is "round per-position then sum"; "sum then round" would produce a different cent for borderline inputs.
      Z_99 = 2.326
      var_total = 0
      for p in Positions.where(trader_id == X and net_base != 0):
          exposure = abs(p.net_open_usd)
          var_p = round_half_up(exposure * pair(p.pair_code).daily_volatility * Z_99, 2)
          var_total = var_total + var_p
      return var_total
    input_set: "Positions with net_base != 0 for the target trader"
    constants:
      Z_99: 2.326
      ROUND_MODE: half_up
      ROUND_ORDER: per_position_then_sum   # pinned; do NOT swap to sum_then_round
    precision: "2 decimal places, round_half_up"

  - name: stop_loss_evaluation
    trigger: "POST /market-data/quote updates CurrencyPair.mid_rate, or POST /stop-loss/{id}/evaluate"
    algorithm: threshold
    formula: |
      # Three modes; evaluation order: PRICE first, then LOSS_AMOUNT, then LOSS_RATIO when multiple apply on same event
      pos = Position.for(event.trader_id, event.pair_code)   # may be zero
      if event.rule_mode == 'PRICE':
          if pos.net_base > 0:   # long base: trigger when current_mid <= threshold (>= vs > NOT allowed — strict <= per spec)
              trigger = (pair.mid_rate <= event.threshold_value)
              observed = pair.mid_rate
          elif pos.net_base < 0: # short base: trigger when current_mid >= threshold
              trigger = (pair.mid_rate >= event.threshold_value)
              observed = pair.mid_rate
          else: trigger = False
      elif event.rule_mode == 'LOSS_AMOUNT':
          trigger = (pos.mtm_pnl_usd < 0) and (abs(pos.mtm_pnl_usd) >= event.threshold_value)   # >= (not >)
          observed = abs(pos.mtm_pnl_usd)
      elif event.rule_mode == 'LOSS_RATIO':
          notional_usd = abs(pos.net_base * base_in_usd_rate(pos.pair_code))
          if notional_usd == 0: trigger = False
          else:
              ratio = abs(pos.mtm_pnl_usd) / notional_usd
              trigger = (pos.mtm_pnl_usd < 0) and (ratio >= event.threshold_value)
              observed = round_half_up(ratio, 6)
    input_set: "StopLossEvent rows in ARMED state for the pair whose mid_rate changed, plus the relevant Position"
    constants:
      LOSS_RATIO_DECIMALS: 6

  - name: multilateral_netting
    trigger: "POST /settlements/generate emitted by SettlementOperator at end-of-day"
    algorithm: aggregation
    formula: |
      # Group BOOKED-status Trades by (counterparty_id, value_date=next_business_day, ccy), produce per-leg cash flows
      # For each Trade (side, notional_base, entry_rate):
      #   if side == BUY:   we receive base_ccy notional_base; we pay quote_ccy (notional_base * entry_rate)
      #   if side == SELL:  we pay base_ccy notional_base;     we receive quote_ccy (notional_base * entry_rate)
      # Then per (counterparty, value_date, ccy):
      #   gross_pay     = sum of outbound flows
      #   gross_receive = sum of inbound flows
      #   net_amount    = round_half_up(gross_pay - gross_receive, 2)   # positive = we pay
      # Order: process trades sorted by executed_at ASC, tie-break by Trade.id ASC.
      # IDEMPOTENCY: scoped per (counterparty_id, value_date, client_request_id);
      # replay of the same client_request_id returns the existing SettlementInstruction id (HTTP 200).
    input_set: "Trade rows with status == BOOKED and counterparty_id == X and trading_day <= today"
    constants:
      DECIMALS_USD: 2
      ROUND_MODE: half_up
    precision: "2 decimal places, round_half_up"

  - name: counterparty_credit_limit
    trigger: "Counterparty creation, PATCH /counterparties/{id} updating external_rating or internal_score, POST /_sweep/run"
    algorithm: tiered_pricing
    formula: |
      # Final rating_band = max(severity) of band_from_external and band_from_internal
      # Severity ordering: INVESTMENT(0) < STANDARD(1) < SPECULATIVE(2) < WATCH(3)
      bx = {AAA:INVESTMENT, AA:INVESTMENT, A:STANDARD, BBB:STANDARD, BB:SPECULATIVE, B:SPECULATIVE, CCC:WATCH, NR:WATCH}[external_rating]
      bi = INVESTMENT if internal_score >= 80 else STANDARD if internal_score >= 60 else SPECULATIVE if internal_score >= 40 else WATCH
      rating_band = max(bx, bi, by severity)
      # Tier table:
      tier = {INVESTMENT: 100_000_000.00, STANDARD: 50_000_000.00, SPECULATIVE: 10_000_000.00, WATCH: 1_000_000.00}
      credit_limit_usd = tier[rating_band]
      on_watchlist = (rating_band == WATCH)
    input_set: "Counterparty external_rating and internal_score"
    constants:
      INVESTMENT_TIER_USD: 100000000.00
      STANDARD_TIER_USD: 50000000.00
      SPECULATIVE_TIER_USD: 10000000.00
      WATCH_TIER_USD: 1000000.00
      INTERNAL_INVESTMENT_FLOOR: 80
      INTERNAL_STANDARD_FLOOR: 60
      INTERNAL_SPECULATIVE_FLOOR: 40

  - name: end_of_day_reconciliation
    trigger: "POST /_clock/advance crossing 17:00 UTC, OR POST /_sweep/run"
    algorithm: chronological
    formula: |
      # Sweep order (must be respected):
      #   1) For each LimitAdjustmentRequest with status==APPROVED and expires_at <= now(): expire it (cascade per state machine).
      #   2) Compute INTRADAY → OVERNIGHT carry: for each Trader, snapshot today's net_open_usd into Position.eod_net_open_usd.
      #   3) Recompute Position.warning_status using OVERNIGHT Limit caps.
      #   4) For each StopLossEvent in OVERRIDDEN: transition to ARMED (clear triggered_at/triggering_value).
      #   5) For each StopLossEvent in EXECUTED: transition to ARCHIVED.
      #   6) Emit one ComplianceReport (report_type=INTERNAL_CONTROL) version=prior_version+1 for the trading_day.
      # The first step is idempotent: re-running /_sweep/run yields the same final state.
    input_set: "All Limit, Position, StopLossEvent, LimitAdjustmentRequest rows"

# =============================================================================
# §1.4 Validation Rules Table (priority-ordered)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and non-empty"
    error_id: ERR_AUTH_REQUIRED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-Role must be permitted for the endpoint per §1.7 RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path id parameters must reference existing entities (left-to-right resolution: trader before limit before adjustment)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all id-bearing endpoints"

  - priority: 4
    category: state
    check: "Target entity must be in a valid state for the requested transition (e.g., LimitAdjustmentRequest must be PENDING for /approve)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 5
    category: business_safety
    check: "Segregation of duties — the actor user id must NOT equal the entity's requester or trader id for review/override/execute operations (approve own request, override own stop-loss, execute own stop-loss are forbidden)"
    error_id: ERR_SEGREGATION_VIOLATION
    http_status: 403
    applies_to: "/limit-adjustments/{id}/approve, /limit-adjustments/{id}/reject, /stop-loss/{id}/override, /stop-loss/{id}/execute"

  - priority: 6
    category: business_safety
    check: "When the counterparty is on_watchlist == true, POST /settlements/{id}/send is blocked"
    error_id: ERR_COUNTERPARTY_WATCHLIST
    http_status: 409
    applies_to: "/settlements/{id}/send"

  - priority: 7
    category: business_referential
    check: "POST /trades requires CurrencyPair.code, Counterparty.id, and Trader.id to exist; Trader.status must be ACTIVE; Counterparty NOT on_watchlist"
    error_id: ERR_TRADER_SUSPENDED
    http_status: 409
    applies_to: "/trades"

  - priority: 8
    category: business_constraint
    check: "Currency pair code must match regex ^[A-Z]{6}$ with base_ccy = code[0:3], quote_ccy = code[3:6]"
    error_id: ERR_INVALID_PAIR_FORMAT
    http_status: 422
    applies_to: "POST /currency-pairs"

  - priority: 9
    category: business_temporal
    check: "LimitAdjustmentRequest.expires_at must be strictly greater than server clock now() at creation AND at approval time"
    error_id: ERR_EXPIRES_IN_PAST
    http_status: 422
    applies_to: "POST /limit-adjustments, POST /limit-adjustments/{id}/approve"

  - priority: 10
    category: business_fiscal
    check: "Posting a Trade must not cause Limit.utilization_usd to exceed Limit.notional_cap_usd + Limit.temporary_override_usd in either the INTRADAY or OVERNIGHT bucket"
    error_id: ERR_LIMIT_BREACH
    http_status: 409
    applies_to: "POST /trades"

  - priority: 11
    category: business_fiscal
    check: "Posting a Trade must not cause aggregate notional facing the same Counterparty to exceed Counterparty.credit_limit_usd"
    error_id: ERR_COUNTERPARTY_LIMIT_BREACH
    http_status: 409
    applies_to: "POST /trades"

  - priority: 12
    category: business_constraint
    check: "Idempotency-key: if a POST /settlements/generate request supplies a client_request_id already used for the same counterparty+value_date, return the existing SettlementInstruction id (HTTP 200, not a fresh 201)"
    error_id: ERR_IDEMPOTENCY_REPLAY
    http_status: 200
    applies_to: "POST /settlements/generate"

  - priority: 13
    category: business_constraint
    check: "OCC: PATCH/PUT with `version` field must match current entity.version exactly"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: "all PATCH/PUT endpoints on entities with common_fields=true"

  - priority: 14
    category: business_constraint
    check: "Pagination limit must be in [1, 100]; offset >= 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 422
    applies_to: "all list endpoints"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Traders & Desks ---
  - method: POST
    path: /fx-risk/traders
    description: Register a new trader (RiskOfficer onboards).
    roles: [RiskOfficer]
    code: 201
    input: [name, desk_code]
    output: Trader
    side_effects: []

  - method: GET
    path: /fx-risk/traders/{id}
    description: Fetch trader.
    roles: [RiskOfficer, Trader, ComplianceOfficer]
    code: 200
    input: []
    output: Trader
    side_effects: []

  - method: GET
    path: /fx-risk/desks/{desk_code}/positions
    description: Per-desk aggregated positions across all traders on the desk.
    roles: [RiskOfficer, ComplianceOfficer]
    code: 200
    input: []
    output: Position[]
    side_effects: []

  # --- Currency Pairs & Market Data ---
  - method: POST
    path: /fx-risk/currency-pairs
    description: Register a currency pair (e.g., EURUSD).
    roles: [RiskOfficer]
    code: 201
    input: [code, base_ccy, quote_ccy, mid_rate, daily_volatility]
    output: CurrencyPair

  - method: POST
    path: /fx-risk/market-data/quote
    description: Push a new mid-market quote; updates CurrencyPair.mid_rate and triggers stop-loss evaluation + Position MtM recompute.
    roles: [RiskOfficer, MarketDataSystem]
    code: 200
    input: [code, mid_rate]
    output: CurrencyPair
    side_effects:
      - "Recompute Position.mtm_pnl_usd, Position.net_open_usd for affected pair"
      - "Evaluate every ARMED StopLossEvent on the pair (may transition ARMED→TRIGGERED)"
      - "Recompute Limit.utilization_usd / utilization_pct / Position.warning_status"

  # --- Limits ---
  - method: POST
    path: /fx-risk/traders/{trader_id}/limits
    description: Create a Limit row for a trader (per bucket, optionally per pair).
    roles: [RiskOfficer]
    code: 201
    input: ["pair_code?", bucket, notional_cap_usd, stop_loss_cap_usd]
    output: Limit

  - method: GET
    path: /fx-risk/traders/{trader_id}/limits
    description: List limits with current utilization for the trader.
    roles: [RiskOfficer, Trader, ComplianceOfficer]
    code: 200
    input: [limit, offset, "bucket?"]
    output: Limit[]

  - method: PATCH
    path: /fx-risk/limits/{id}
    description: Edit base notional_cap_usd or stop_loss_cap_usd (RiskOfficer only; does NOT bypass approval flow — see /limit-adjustments).
    roles: [RiskOfficer]
    code: 200
    input: ["notional_cap_usd?", "stop_loss_cap_usd?", version]
    output: Limit

  # --- Limit Adjustment Workflow ---
  - method: POST
    path: /fx-risk/limit-adjustments
    description: Trader requests a temporary additive override on one of their Limit rows.
    roles: [Trader]
    code: 201
    input: [limit_id, requested_delta_usd, justification, expires_at]
    output: LimitAdjustmentRequest

  - method: POST
    path: /fx-risk/limit-adjustments/{id}/approve
    description: RiskOfficer approves; immediately applies temporary_override_usd to the Limit.
    roles: [RiskOfficer]
    code: 200
    input: []
    output: LimitAdjustmentRequest
    side_effects:
      - "Limit.temporary_override_usd += request.requested_delta_usd"
      - "Recompute Limit.utilization_pct and Position.warning_status (cascade)"
      - "Insert AuditLog entry"

  - method: POST
    path: /fx-risk/limit-adjustments/{id}/reject
    description: RiskOfficer rejects.
    roles: [RiskOfficer]
    code: 200
    input: []
    output: LimitAdjustmentRequest

  - method: POST
    path: /fx-risk/limit-adjustments/{id}/request-revision
    description: RiskOfficer sends back for revision; trader may resubmit via PATCH.
    roles: [RiskOfficer]
    code: 200
    input: []
    output: LimitAdjustmentRequest

  - method: PATCH
    path: /fx-risk/limit-adjustments/{id}
    description: Trader edits a request in REVISION_REQUESTED back to PENDING.
    roles: [Trader]
    code: 200
    input: ["requested_delta_usd?", "justification?", "expires_at?", version]
    output: LimitAdjustmentRequest

  # --- Trades & Positions ---
  - method: POST
    path: /fx-risk/trades
    description: Book a spot FX trade.
    roles: [Trader]
    code: 201
    input: [pair_code, side, notional_base, entry_rate, counterparty_id]
    output: Trade
    side_effects:
      - "Recompute Position (net_base, net_open_usd, mtm_pnl_usd)"
      - "Recompute Limit.utilization (both INTRADAY and OVERNIGHT buckets if both exist)"
      - "If trade USD notional >= 10000000, emit ComplianceReport (report_type=LARGE_TRADE) at version=N+1 (cascade)"
      - "AuditLog event TRADE_BOOKED"

  - method: GET
    path: /fx-risk/traders/{trader_id}/positions
    description: List positions for a trader.
    roles: [RiskOfficer, Trader, ComplianceOfficer]
    code: 200
    input: [limit, offset]
    output: Position[]

  - method: GET
    path: /fx-risk/traders/{trader_id}/exposure
    description: Returns {gross_usd, net_usd} for the trader (see §1.3 gross_exposure).
    roles: [RiskOfficer, Trader, ComplianceOfficer]
    code: 200
    input: []
    output: object

  - method: GET
    path: /fx-risk/traders/{trader_id}/var
    description: Returns {var_99_1d_usd} for the trader (see §1.3 value_at_risk).
    roles: [RiskOfficer, Trader, ComplianceOfficer]
    code: 200
    input: []
    output: object

  # --- Stop-Loss ---
  - method: POST
    path: /fx-risk/stop-loss
    description: RiskOfficer creates a stop-loss rule for a trader+pair.
    roles: [RiskOfficer]
    code: 201
    input: [trader_id, pair_code, rule_mode, threshold_value, action]
    output: StopLossEvent

  - method: POST
    path: /fx-risk/stop-loss/{id}/evaluate
    description: Force a re-evaluation of the rule (idempotent if not crossed).
    roles: [RiskOfficer, MarketDataSystem]
    code: 200
    input: []
    output: StopLossEvent

  - method: POST
    path: /fx-risk/stop-loss/{id}/acknowledge
    description: Trader acknowledges a TRIGGERED event.
    roles: [Trader]
    code: 200
    input: []
    output: StopLossEvent

  - method: POST
    path: /fx-risk/stop-loss/{id}/override
    description: RiskOfficer overrides an acknowledged event (re-arms at next sweep).
    roles: [RiskOfficer]
    code: 200
    input: []
    output: StopLossEvent

  - method: POST
    path: /fx-risk/stop-loss/{id}/execute
    description: RiskOfficer executes FORCED_FLATTEN — books an offsetting trade closing the position.
    roles: [RiskOfficer]
    code: 200
    input: []
    output: StopLossEvent
    side_effects:
      - "Book offsetting Trade (cascade: Position recompute, Limit utilization recompute)"
      - "If offsetting Trade USD notional >= 10000000, emit ComplianceReport (LARGE_TRADE)"

  # --- Counterparties ---
  - method: POST
    path: /fx-risk/counterparties
    description: Register a counterparty.
    roles: [ComplianceOfficer]
    code: 201
    input: [name, external_rating, internal_score]
    output: Counterparty

  - method: PATCH
    path: /fx-risk/counterparties/{id}
    description: Update ratings; triggers credit_limit and watchlist recompute.
    roles: [ComplianceOfficer]
    code: 200
    input: ["external_rating?", "internal_score?", version]
    output: Counterparty

  # --- Settlement ---
  - method: POST
    path: /fx-risk/settlements/generate
    description: Compute multilateral netting for a counterparty+value_date and emit SettlementInstruction rows.
    roles: [SettlementOperator]
    code: 201
    input: [counterparty_id, value_date, client_request_id]
    output: SettlementInstruction[]

  - method: POST
    path: /fx-risk/settlements/{id}/send
    description: Mark a SettlementInstruction as SENT (blocked if counterparty on_watchlist).
    roles: [SettlementOperator]
    code: 200
    input: []
    output: SettlementInstruction

  - method: POST
    path: /fx-risk/settlements/{id}/confirm
    description: Mark SENT → SETTLED.
    roles: [SettlementOperator]
    code: 200
    input: []
    output: SettlementInstruction

  - method: POST
    path: /fx-risk/settlements/{id}/mark-failed
    description: Mark SENT → FAILED; cascades to trades and counterparty internal_score penalty.
    roles: [SettlementOperator]
    code: 200
    input: []
    output: SettlementInstruction

  - method: POST
    path: /fx-risk/settlements/{id}/reconcile
    description: Mark SETTLED → RECONCILED; Nostro/Vostro reconciliation marker set.
    roles: [SettlementOperator]
    code: 200
    input: []
    output: SettlementInstruction

  # --- Compliance Reports ---
  - method: GET
    path: /fx-risk/reports
    description: List filed compliance reports, optionally filtered by report_type or reference_trade_id; latest version per pair returned.
    roles: [ComplianceOfficer, RiskOfficer]
    code: 200
    input: [limit, offset, "report_type?", "reference_trade_id?"]
    output: ComplianceReport[]

  - method: POST
    path: /fx-risk/reports
    description: ComplianceOfficer manually files (or amends) a report; version auto-increments per (report_type, reference_trade_id).
    roles: [ComplianceOfficer]
    code: 201
    input: [report_type, "reference_trade_id?", payload]
    output: ComplianceReport

  # --- Audit ---
  - method: GET
    path: /fx-risk/audit-log
    description: Query audit log, paginated.
    roles: [ComplianceOfficer, RiskOfficer]
    code: 200
    input: [limit, offset, "event_type?", "subject_entity?", "subject_id?"]
    output: AuditLog[]

  # --- Test-driving infrastructure (required by §1.5 testability-completeness) ---
  - method: POST
    path: /fx-risk/_clock/advance
    description: Advance the server clock (for testing time-gated transitions like expires_at and 17:00 EOD cutoff).
    roles: [RiskOfficer]
    code: 200
    input: [to_iso]
    output: object
    side_effects:
      - "Re-evaluates time-gated state (does NOT itself run the sweep — call /_sweep/run for cascade)"

  - method: POST
    path: /fx-risk/_sweep/run
    description: Run the EOD reconciliation sweep idempotently (see §1.3 end_of_day_reconciliation).
    roles: [RiskOfficer]
    code: 200
    input: []
    output: object
    side_effects:
      - "Expire APPROVED LimitAdjustmentRequests past expires_at"
      - "Re-arm StopLossEvents in OVERRIDDEN; archive EXECUTED"
      - "Recompute Position.warning_status under OVERNIGHT caps"
      - "Emit one ComplianceReport (INTERNAL_CONTROL) per trading_day, version=prior+1"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_AUTH_REQUIRED
    http: 401
    condition: "X-User-ID or X-User-Role header missing/empty"

  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role lacks permission for endpoint per §1.7"

  - id: ERR_SEGREGATION_VIOLATION
    http: 403
    condition: "Actor cannot perform this operation on their own request/event (segregation of duties)"

  - id: ERR_NOT_FOUND
    http: 404
    condition: "Referenced entity (Trader, Limit, CurrencyPair, Counterparty, etc.) does not exist"

  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target entity is not in a state from which the requested transition is allowed"

  - id: ERR_REQUEST_ALREADY_DECIDED
    http: 409
    condition: "LimitAdjustmentRequest is not in PENDING (decided concurrently or earlier)"

  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "Provided version does not match current entity.version (optimistic concurrency)"

  - id: ERR_LIMIT_BREACH
    http: 409
    condition: "Trade would push utilization_usd above effective_cap_usd in INTRADAY or OVERNIGHT bucket"

  - id: ERR_COUNTERPARTY_LIMIT_BREACH
    http: 409
    condition: "Aggregate notional facing counterparty would exceed Counterparty.credit_limit_usd"

  - id: ERR_COUNTERPARTY_WATCHLIST
    http: 409
    condition: "Counterparty.on_watchlist == true and operation requires non-watchlist counterparty"

  - id: ERR_TRADER_SUSPENDED
    http: 409
    condition: "Trader.status == SUSPENDED at trade time"

  - id: ERR_EXPIRES_IN_PAST
    http: 422
    condition: "LimitAdjustmentRequest.expires_at <= server clock now() at creation or approval"

  - id: ERR_INVALID_PAIR_FORMAT
    http: 422
    condition: "CurrencyPair.code does not match ^[A-Z]{6}$ or base_ccy/quote_ccy disagree with code slices"

  - id: ERR_INVALID_PAGINATION
    http: 422
    condition: "limit outside [1, 100] or offset < 0"

  - id: ERR_IDEMPOTENCY_REPLAY
    http: 200
    condition: "Duplicate client_request_id on POST /settlements/generate — returns the original instruction set"

  - id: ERR_VALIDATION
    http: 422
    condition: "Generic input validation failure (missing required field, wrong type, out-of-range numeric)"

  - id: ERR_INVALID_STOPLOSS_MODE
    http: 422
    condition: "rule_mode not in {PRICE, LOSS_AMOUNT, LOSS_RATIO} or threshold_value <= 0"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Trader
    description: "Front-office trader; books trades, requests limit adjustments, acknowledges stop-loss events on their own positions."
    identity: "entity_backed:Trader"
    exclusive_operations:
      - "POST /fx-risk/trades"
      - "POST /fx-risk/limit-adjustments  (only on Limit rows where limit.trader_id == X-User-ID)"
      - "PATCH /fx-risk/limit-adjustments/{id}  (only on own requests in REVISION_REQUESTED)"
      - "POST /fx-risk/stop-loss/{id}/acknowledge  (only when StopLossEvent.trader_id == X-User-ID)"
    shared_operations:
      - "GET /fx-risk/traders/{trader_id}/limits, /positions, /exposure, /var  (only when trader_id == X-User-ID)"

  - name: RiskOfficer
    description: "Middle-office officer who provisions limits, approves overrides, creates and executes stop-loss rules; cannot trade."
    identity: "opaque"
    exclusive_operations:
      - "POST /fx-risk/traders"
      - "POST /fx-risk/currency-pairs"
      - "POST /fx-risk/traders/{trader_id}/limits"
      - "PATCH /fx-risk/limits/{id}"
      - "POST /fx-risk/limit-adjustments/{id}/approve"
      - "POST /fx-risk/limit-adjustments/{id}/reject"
      - "POST /fx-risk/limit-adjustments/{id}/request-revision"
      - "POST /fx-risk/stop-loss"
      - "POST /fx-risk/stop-loss/{id}/override"
      - "POST /fx-risk/stop-loss/{id}/execute"
      - "POST /fx-risk/_clock/advance"
      - "POST /fx-risk/_sweep/run"
    shared_operations:
      - "GET /fx-risk/traders/{trader_id}/positions, /exposure, /var (any trader)"
      - "GET /fx-risk/desks/{desk_code}/positions"
      - "POST /fx-risk/market-data/quote"
      - "POST /fx-risk/stop-loss/{id}/evaluate"
      - "GET /fx-risk/reports, /fx-risk/audit-log"

  - name: ComplianceOfficer
    description: "Files regulatory reports, manages counterparty ratings/watchlist, audits the system; cannot trade or approve limits."
    identity: "opaque"
    exclusive_operations:
      - "POST /fx-risk/counterparties"
      - "PATCH /fx-risk/counterparties/{id}"
      - "POST /fx-risk/reports"
    shared_operations:
      - "GET /fx-risk/reports, /fx-risk/audit-log"
      - "GET /fx-risk/traders/{trader_id}/positions, /exposure, /var (any trader)"
      - "GET /fx-risk/desks/{desk_code}/positions"

  - name: SettlementOperator
    description: "Back-office operator running netting calculation, sending instructions, handling failures, reconciling Nostro/Vostro."
    identity: "opaque"
    exclusive_operations:
      - "POST /fx-risk/settlements/generate"
      - "POST /fx-risk/settlements/{id}/send"
      - "POST /fx-risk/settlements/{id}/confirm"
      - "POST /fx-risk/settlements/{id}/mark-failed"
      - "POST /fx-risk/settlements/{id}/reconcile"
    shared_operations: []

  - name: MarketDataSystem
    description: "External market-data feed posting quotes; cannot mutate any business entity directly."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /fx-risk/market-data/quote"
      - "POST /fx-risk/stop-loss/{id}/evaluate"
