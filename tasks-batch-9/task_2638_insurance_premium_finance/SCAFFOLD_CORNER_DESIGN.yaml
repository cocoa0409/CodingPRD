              as: ComplianceOfficer
              captures: { sd_insurer: "$.data.id" }
            - call: "POST /agreements"
              payload: { insured_id: "${sd_insured}", producer_agent_id: "${sd_agent}", state_rule_id: "${sd_rule}", down_payment_cents: 100000, service_fee_cents: 2000, installment_count: 6, first_installment_due_date: "2026-10-01" }
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { sd_a: "$.data.id", sd_a_orig: "$.data.originated_by_user_id" }
            - call: "POST /agreements/${sd_a}/policies"
