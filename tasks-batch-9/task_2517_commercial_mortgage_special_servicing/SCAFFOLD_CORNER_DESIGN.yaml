              captures: { trust_loss_after: "$.data.realized_loss_usd", notional_after: "$.data.controlling_class_notional_usd", control_after: "$.data.control_status", count_after: "$.data.loans_in_special_servicing_count", trust_version_after: "$.data.version" }
