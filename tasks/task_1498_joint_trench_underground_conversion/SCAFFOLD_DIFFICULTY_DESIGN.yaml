          trigger:
            - { call: "POST /api/participations/${p2}/transition", payload: { to: WITHDRAWN }, as: UtilityCoordinator, as_user_id: "${p2}" }
            - { call: "GET /api/participations/${p1}", payload: {}, as: ProgramManager, captures: { b1: "$.data.provisional_share_cents" } }
            - { call: "GET /api/participations/${p2}", payload: {}, as: ProgramManager, captures: { b2: "$.data.provisional_share_cents" } }
            - { call: "GET /api/participations/${p3}", payload: {}, as: ProgramManager, captures: { b3: "$.data.provisional_share_cents" } }
          assert:
            - "a1 == 333301 and a2 == 333300 and a3 == 333400; a1+a2+a3 == 1000001 == estimated_total_cost_cents"
            - "b2 == 0 (withdrawn participant drops out of the allocation set)"
            - "b1 == 499900 and b3 == 500101; b1+b3 == 1000001 — the invariant holds exactly after the compensating rescale"
      - name: segment_depth_conservation_on_release
        grounds:
          - entities.TrenchSegment.fields.available_depth_inches
          - state_machines.OccupancySlot.RESERVED_to_RELEASED
          - calculations.depth_separation_requirement
        distinguishing_aspect: |
          Conserved quantity = segment depth budget (distinct from the money
          invariant of the sibling): reserve consumes, release compensates, and
          available_depth_inches returns exactly to its pre-reserve value (60)
          after both releases; occupied uses max(depth_bottom), not a sum.
        test_recipe:
          setup:
            - "mobilized 2-party project; scheduled segment max_depth 60 (available 60, occupied 0)"
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "Depth Project", rule20_credit_cents: 0, estimated_total_cost_cents: 1000000, target_cutover_on: "2026-12-31T00:00:00Z", contingency_days: 0 }, as: ProgramManager, captures: { proj: "$.data.id" } }
            - { call: "POST /api/participations", payload: { project_id: "${proj}", utility_name: "U1", utility_type: ELECTRIC, cost_share_bp: 7000, sequence_order: 1 }, as: ProgramManager, captures: { p1: "$.data.id" } }
            - { call: "POST /api/participations", payload: { project_id: "${proj}", utility_name: "U2", utility_type: TELECOM, cost_share_bp: 3000, sequence_order: 2 }, as: ProgramManager, captures: { p2: "$.data.id" } }
            - { call: "POST /api/participations/${p1}/transition", payload: { to: COMMITTED }, as: UtilityCoordinator, as_user_id: "${p1}" }
            - { call: "POST /api/participations/${p2}/transition", payload: { to: COMMITTED }, as: UtilityCoordinator, as_user_id: "${p2}" }
            - { call: "POST /api/projects/${proj}/lifecycle", payload: { action: MOBILIZE }, as: ProgramManager }
            - { call: "POST /api/trench-segments", payload: { project_id: "${proj}", segment_code: "SEG-1", length_ft: 100, max_depth_inches: 60 }, as: ProgramManager, captures: { seg: "$.data.id", seg_v: "$.data.version", avail0: "$.data.available_depth_inches" } }
            - { call: "POST /api/trench-segments/${seg}/schedule", payload: { excavation_start_on: "2026-09-01T00:00:00Z", excavation_end_on: "2026-09-10T00:00:00Z", expected_trench_segment_version: "${seg_v}" }, as: ProgramManager }
          trigger:
            - { call: "POST /api/occupancy-slots", payload: { trench_segment_id: "${seg}", participation_id: "${p1}", depth_top_inches: 36, depth_bottom_inches: 60, install_start_at: "2026-09-01T00:00:00Z", install_end_at: "2026-09-03T00:00:00Z" }, as: UtilityCoordinator, as_user_id: "${p1}", captures: { s1: "$.data.id" } }
            - { call: "POST /api/occupancy-slots", payload: { trench_segment_id: "${seg}", participation_id: "${p2}", depth_top_inches: 12, depth_bottom_inches: 24, install_start_at: "2026-09-03T00:00:00Z", install_end_at: "2026-09-05T00:00:00Z" }, as: UtilityCoordinator, as_user_id: "${p2}", captures: { s2: "$.data.id" } }
            - { call: "GET /api/trench-segments/${seg}", payload: {}, as: ProgramManager, captures: { occ_mid: "$.data.occupied_depth_inches", avail_mid: "$.data.available_depth_inches" } }
            - { call: "POST /api/occupancy-slots/${s2}/transition", payload: { to: RELEASED }, as: UtilityCoordinator, as_user_id: "${p2}" }
            - { call: "GET /api/trench-segments/${seg}", payload: {}, as: ProgramManager, captures: { occ_r1: "$.data.occupied_depth_inches", avail_r1: "$.data.available_depth_inches" } }
            - { call: "POST /api/occupancy-slots/${s1}/transition", payload: { to: RELEASED }, as: UtilityCoordinator, as_user_id: "${p1}" }
            - { call: "GET /api/trench-segments/${seg}", payload: {}, as: ProgramManager, captures: { occ_end: "$.data.occupied_depth_inches", avail_end: "$.data.available_depth_inches" } }
          assert:
            - "avail0 == 60 (creation-time budget)"
            - "occ_mid == 60 and avail_mid == 0 (occupied tracks max depth_bottom = 60, not 60+24)"
            - "occ_r1 == 60 and avail_r1 == 0 after releasing only the shallow slot (electric bottom still 60)"
            - "occ_end == 0 and avail_end == 60 — reserve/reserve followed by release/release conserves the budget exactly"
