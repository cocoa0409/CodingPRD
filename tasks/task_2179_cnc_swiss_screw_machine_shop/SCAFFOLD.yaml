scenario: "desgin task harder than expert level.!!!!2179. CNC Swiss Screw Machine Shop (precision machining supplier): bar stock diameter/alloy inventory, long-run quoting by cycle time & lights-out hours, tool life & offset drift monitoring, SPC/Cpk sampling by characteristic, deburr/wash & secondary routing, kanban release against blanket PO, chip/coolant reclamation, gauge R&R and calibration linkage"
domain_name: "cnc-swiss-screw-machine-shop"
api_prefix: "/swiss-shop"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: graph
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
  difficulty_level: expert_plus
  notes: |
    Blanket PO committed quantity is the finite pool: it is drawn down by kanban
    releases, held open while a work order runs, and returned by short-close.
    Layered on top is a compliance surface (SPC/Cpk sampling, gauge calibration
    and R&R linkage, segregation of duties between the machinist who ran the job
    and the inspector who measured it) that gates the disposition which finally
    consumes the pool. WorkOrder carries two independent state dimensions
    (machining_status and quality_status) that advance without reference to each
    other; ToolAssignment, Gauge, Machine, BlanketPO and RoutingStep all cycle.

entities:
  - name: Operator
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Full name of the shop-floor operator.
      - name: badge_code
        type: string
        source: input
        description: Shop badge code; unique across all Operator rows.
        constraints: "unique; 1-32 chars"
      - name: certifications
        type: array
        source: input
        description: Certification codes held by this operator.
        default: []
        constraints: "each element in {SWISS_SETUP, LIGHTS_OUT, CMM, DEBURR}"
      - name: status
        type: enum
        source: input
        description: Employment/eligibility status of the operator.
        default: ACTIVE
        constraints: "one of {ACTIVE, INACTIVE}"

  - name: Machine
    parent: null
    common_fields: true
    fields:
      - name: asset_tag
        type: string
        source: input
        description: Machine asset tag; unique across all Machine rows.
        constraints: "unique"
      - name: model
        type: string
        source: input
        description: Swiss lathe model designation.
        default: "SWISS-20"
      - name: max_bar_diameter_mm
        type: number
        source: input
        description: Largest bar diameter the guide bushing accepts, in millimetres.
        constraints: "> 0"
      - name: lights_out_certified
        type: boolean
        source: input
        description: True when this machine is approved for unattended lights-out running.
        default: false
      - name: status
        type: enum
        source: system
        description: Operating state of the machine.
        default: AVAILABLE
        constraints: "one of {AVAILABLE, RUNNING, DOWN}"
      - name: current_work_order_id
        type: string
        source: computed
        description: "Id of the WorkOrder whose machining_status is RUNNING on this machine, or null when none; mirrors WorkOrder.machine_id and is not a declared foreign key."
        default: null
      - name: chip_accrual_by_alloy
        type: object
        source: computed
        description: "Map of alloy_code -> kilograms of swarf accrued on this machine since the last reclamation settlement, each value rounded to 3 decimals."
        default: {}
      - name: coolant_makeup_liters
        type: number
        source: computed
        description: Litres of coolant make-up accrued since the last reclamation settlement, rounded to 3 decimals.
        default: 0
      - name: last_reclamation_credit_cents
        type: integer
        source: computed
        description: Net credit in cents produced by the most recent reclamation settlement; null before the first settlement.
        default: null
      - name: lifetime_reclamation_credit_cents
        type: integer
        source: computed
        description: Running sum of every net reclamation credit settled on this machine, in cents.
        default: 0

  - name: Part
    parent: null
    common_fields: true
    fields:
      - name: part_number
        type: string
        source: input
        description: Customer part number; unique across all Part rows.
        constraints: "unique"
      - name: alloy_code
        type: enum
        source: input
        description: Bar stock alloy the part must be machined from.
        constraints: "one of {303SS, 316SS, C360, 6061AL, 12L14}"
      - name: bar_diameter_mm
        type: number
        source: input
        description: Bar diameter the part requires, in millimetres.
        constraints: "> 0"
      - name: cut_off_length_mm
        type: number
        source: input
        description: Finished length consumed per piece before the parting kerf, in millimetres.
        constraints: "> 0"
      - name: cycle_time_sec
        type: number
        source: input
        description: Standard (engineered) spindle cycle time per piece, in seconds.
        constraints: "> 0"
      - name: setup_hours
        type: number
        source: input
        description: Standard setup hours charged once per quoted lot.
        constraints: ">= 0"
      - name: lights_out_eligible
        type: boolean
        source: input
        description: True when the part may be run unattended.
        default: false
      - name: secondary_required
        type: boolean
        source: input
        description: True when the part requires deburr/wash or other secondary routing.
        default: false
      - name: secondary_minutes_per_piece
        type: number
        source: input
        description: Secondary-operation minutes charged per piece.
        default: 0
        constraints: ">= 0"
      - name: material_cost_cents_per_meter
        type: integer
        source: input
        description: Purchased bar cost in cents per metre at this diameter and alloy.
        constraints: ">= 0"
      - name: finished_mass_g
        type: number
        source: input
        description: Mass of one finished piece in grams; used to close the chip-mass balance.
        constraints: "> 0"
      - name: observed_avg_cycle_time_sec
        type: number
        source: computed
        description: "Observed average seconds per accepted piece across every WorkOrder for this Part whose quality_status is ACCEPTED; null when no such WorkOrder exists. See calculations.observed_cycle_time."
        default: null
      - name: observed_accepted_qty
        type: integer
        source: computed
        description: Sum of qty_good over WorkOrders for this Part whose quality_status is ACCEPTED.
        default: 0

  - name: Characteristic
    parent: Part
    common_fields: true
    fields:
      - name: part_id
        type: string
        source: input
        description: "FK -> Part.id; the part this inspected characteristic belongs to."
      - name: char_code
        type: string
        source: input
        description: Print balloon / characteristic code, unique within the part.
        constraints: "unique within part_id"
      - name: nominal
        type: number
        source: input
        description: Nominal print dimension in millimetres.
      - name: usl
        type: number
        source: input
        description: Upper specification limit in millimetres.
        constraints: "> lsl"
      - name: lsl
        type: number
        source: input
        description: Lower specification limit in millimetres.
        constraints: "< usl"
      - name: cpk_min
        type: number
        source: input
        description: Minimum short-term capability index a subgroup must reach to be dispositioned ACCEPT.
        default: 1.33
        constraints: "> 0"
      - name: subgroup_size
        type: integer
        source: input
        description: Number of measurements required in every SpcSample for this characteristic.
        default: 5
        constraints: "one of {3, 5}"
      - name: sample_freq_pieces
        type: integer
        source: input
        description: Sampling frequency in pieces; one subgroup is required per this many ordered pieces.
        constraints: ">= 1"
      - name: required_gauge_type
        type: enum
        source: input
        description: Gauge family that must be used to measure this characteristic.
        constraints: "one of {MICROMETER, BORE_GAUGE, OPTICAL_COMPARATOR, CMM}"

  - name: Gauge
    parent: null
    common_fields: true
    fields:
      - name: gauge_code
        type: string
        source: input
        description: Gauge asset code; unique across all Gauge rows.
        constraints: "unique"
      - name: gauge_type
        type: enum
        source: input
        description: Gauge family.
        constraints: "one of {MICROMETER, BORE_GAUGE, OPTICAL_COMPARATOR, CMM}"
      - name: calibrated_at
        type: datetime
        source: input
        description: Timestamp of the most recent successful calibration, ISO 8601 UTC.
      - name: calibration_due_at
        type: datetime
        source: input
        description: Timestamp at which the current calibration lapses, ISO 8601 UTC.
      - name: grr_pct
        type: number
        source: input
        description: Gauge R&R study result as a percentage of tolerance from the most recent study.
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: Usability state of the gauge.
        default: IN_SERVICE
        constraints: "one of {IN_SERVICE, CALIBRATION_DUE, GRR_FAILED, RETIRED}"
      - name: calibration_count
        type: integer
        source: computed
        description: Number of calibration records posted against this gauge.
        default: 0

  - name: BarStockLot
    parent: null
    common_fields: true
    fields:
      - name: heat_number
        type: string
        source: input
        description: Mill heat number; unique across all BarStockLot rows.
        constraints: "unique"
      - name: alloy_code
        type: enum
        source: input
        description: Alloy of the bars in this lot.
        constraints: "one of {303SS, 316SS, C360, 6061AL, 12L14}"
      - name: bar_diameter_mm
        type: number
        source: input
        description: Diameter of every bar in this lot, in millimetres.
        constraints: "> 0"
      - name: bar_length_mm
        type: number
        source: input
        description: Length of a single bar in this lot, in millimetres.
        constraints: "> 0"
      - name: bars_received
        type: integer
        source: input
        description: Number of bars physically received into this lot.
        constraints: ">= 1"
      - name: mass_kg_per_meter
        type: number
        source: input
        description: Mass of one metre of bar at this diameter and alloy, in kilograms.
        constraints: "> 0"
      - name: feeder_slots
        type: integer
        source: input
        description: Maximum number of work orders whose closed staging intervals may intersect on this lot's bar feeder.
        default: 1
        constraints: ">= 1"
      - name: total_length_mm
        type: number
        source: computed
        description: "bars_received * bar_length_mm; immutable after creation and the conserved total for calculations.bar_length_ledger."
      - name: available_length_mm
        type: number
        source: computed
        description: Millimetres of bar not yet reserved or consumed.
      - name: reserved_length_mm
        type: number
        source: computed
        description: Millimetres of bar committed to scheduled or running work orders.
        default: 0
      - name: consumed_length_mm
        type: number
        source: computed
        description: Millimetres of bar irrevocably consumed by completed machining.
        default: 0
      - name: status
        type: enum
        source: system
        description: Material-release state of the lot.
        default: RECEIVED
        constraints: "one of {RECEIVED, CERTIFIED, QUARANTINED, DEPLETED}"
      - name: certificate_number
        type: string
        source: system
        description: Mill certificate number recorded when the lot was certified; null before certification.
        default: null

  - name: Quote
    parent: null
    common_fields: true
    fields:
      - name: part_id
        type: string
        source: input
        description: "FK -> Part.id; the part being quoted."
      - name: customer_code
        type: string
        source: input
        description: Customer short code the quote is addressed to.
      - name: lot_qty
        type: integer
        source: input
        description: Quoted lot quantity in pieces.
        constraints: ">= 1"
      - name: requested_lights_out_hours
        type: number
        source: input
        description: Unattended hours the customer asked to be priced into the lot.
        default: 0
        constraints: ">= 0"
      - name: costing_basis
        type: enum
        source: system
        description: Costing basis used by the most recent pricing run; null while the quote is DRAFT and unpriced.
        default: null
        constraints: "one of {STANDARD_CYCLE, HISTORICAL_CYCLE}"
      - name: cycle_time_used_sec
        type: number
        source: computed
        description: Seconds-per-piece actually fed into the most recent pricing run.
        default: null
      - name: effective_qty
        type: integer
        source: computed
        description: Lot quantity inflated by the scrap allowance and rounded up to whole pieces.
        default: null
      - name: run_cost_cents
        type: integer
        source: computed
        description: Attended plus lights-out spindle cost for the lot, in cents.
        default: null
      - name: setup_cost_cents
        type: integer
        source: computed
        description: Setup cost for the lot, in cents.
        default: null
      - name: secondary_cost_cents
        type: integer
        source: computed
        description: Deburr/wash and other secondary-operation cost for the lot, in cents.
        default: null
      - name: material_cost_cents
        type: integer
        source: computed
        description: Marked-up bar stock cost for the lot, in cents.
        default: null
      - name: quoted_lot_cost_cents
        type: integer
        source: computed
        description: Sum of the four rounded cost components, in cents.
        default: null
      - name: quoted_unit_price_cents
        type: integer
        source: computed
        description: Margin-loaded selling price per piece, in cents.
        default: null
      - name: status
        type: enum
        source: system
        description: Lifecycle state of the quote.
        default: DRAFT
        constraints: "one of {DRAFT, PRICED, ACCEPTED, CONSUMED, EXPIRED}"

  - name: BlanketPO
    parent: Quote
    common_fields: true
    fields:
      - name: quote_id
        type: string
        source: system
        description: "FK -> Quote.id; the quote this blanket order was created from."
      - name: part_id
        type: string
        source: system
        description: "FK -> Part.id; copied from the accepted quote."
      - name: customer_po_number
        type: string
        source: input
        description: Customer's blanket purchase order number.
      - name: total_committed_qty
        type: integer
        source: input
        description: Total pieces the customer commits to over the life of the blanket order; immutable and the conserved total for calculations.po_quantity_ledger.
        constraints: ">= 1"
      - name: expires_on
        type: datetime
        source: input
        description: Instant after which no further kanban release may be cut against this order, ISO 8601 UTC.
      - name: list_unit_price_cents
        type: integer
        source: computed
        description: quoted_unit_price_cents copied from the accepted quote, in cents.
      - name: pre_rebate_total_cents
        type: integer
        source: computed
        description: list_unit_price_cents * total_committed_qty; the value the rebate tier is selected from.
      - name: rebate_pct
        type: number
        source: computed
        description: Volume rebate fraction selected from pre_rebate_total_cents.
      - name: net_unit_price_cents
        type: integer
        source: computed
        description: Rebated selling price per piece, in cents.
      - name: committed_value_cents
        type: integer
        source: computed
        description: net_unit_price_cents * total_committed_qty, in cents.
      - name: remaining_qty
        type: integer
        source: computed
        description: Pieces still available to be released.
      - name: open_released_qty
        type: integer
        source: computed
        description: Pieces sitting on kanban releases that are RELEASED or IN_PRODUCTION.
        default: 0
      - name: fulfilled_qty
        type: integer
        source: computed
        description: Pieces accepted into the customer's account by fulfilled releases.
        default: 0
      - name: status
        type: enum
        source: system
        description: Lifecycle state of the blanket order.
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED, EXHAUSTED, EXPIRED}"
      - name: suspension_reason
        type: string
        source: system
        description: Reason captured on the most recent suspend; null when never suspended.
        default: null

  - name: KanbanRelease
    parent: BlanketPO
    common_fields: true
    fields:
      - name: blanket_po_id
        type: string
        source: input
        description: "FK -> BlanketPO.id; the blanket order this release draws against."
      - name: qty
        type: integer
        source: input
        description: Pieces released to the floor by this kanban signal.
        constraints: ">= 1"
      - name: due_at
        type: datetime
        source: input
        description: Customer dock date for this release, ISO 8601 UTC.
      - name: fulfilled_qty
        type: integer
        source: computed
        description: Good pieces credited to this release when its work order was accepted.
        default: 0
      - name: close_reason
        type: string
        source: system
        description: Reason recorded when the release was short-closed; null otherwise.
        default: null
      - name: status
        type: enum
        source: system
        description: Lifecycle state of the release.
        default: RELEASED
        constraints: "one of {RELEASED, IN_PRODUCTION, FULFILLED, SHORT_CLOSED}"

  - name: WorkOrder
    parent: KanbanRelease
    common_fields: true
    fields:
      - name: release_id
        type: string
        source: input
        description: "FK -> KanbanRelease.id; the kanban release this job satisfies."
      - name: machine_id
        type: string
        source: input
        description: "FK -> Machine.id; the Swiss lathe the job is scheduled on."
      - name: bar_lot_id
        type: string
        source: input
        description: "FK -> BarStockLot.id; the bar stock lot staged on the feeder for this job."
      - name: part_id
        type: string
        source: system
        description: "FK -> Part.id; copied from the release's blanket order at creation."
      - name: machinist_operator_id
        type: string
        source: system
        description: "FK -> Operator.id; set from the X-User-ID header on every start, null before the first start."
        default: null
      - name: qty_ordered
        type: integer
        source: input
        description: Pieces this work order is expected to produce.
        constraints: ">= 1"
      - name: scheduled_start_at
        type: datetime
        source: input
        description: Start of the scheduled occupancy window, ISO 8601 UTC.
      - name: scheduled_end_at
        type: datetime
        source: input
        description: End of the scheduled occupancy window, ISO 8601 UTC; must be strictly after scheduled_start_at.
      - name: lights_out_hours
        type: number
        source: input
        description: Hours of the window that will run unattended.
        default: 0
        constraints: ">= 0"
      - name: required_length_mm
        type: number
        source: computed
        description: Bar length the job needs including parting kerf and setup scrap, in millimetres.
      - name: bars_reserved
        type: integer
        source: computed
        description: Whole bars committed off the lot for this job.
      - name: reserved_length_mm
        type: number
        source: computed
        description: bars_reserved * BarStockLot.bar_length_mm; the millimetres moved from available to reserved at creation.
      - name: actual_run_seconds
        type: number
        source: system
        description: Spindle seconds reported at machining completion; null before completion.
        default: null
      - name: qty_good
        type: integer
        source: system
        description: Good pieces reported at machining completion.
        default: 0
      - name: qty_scrap
        type: integer
        source: system
        description: Scrapped pieces reported at machining completion.
        default: 0
      - name: chip_kg
        type: number
        source: computed
        description: Swarf mass in kilograms attributed to this job at machining completion, rounded to 3 decimals.
        default: 0
      - name: machining_status
        type: enum
        source: system
        description: Production dimension of the work order state; evolves independently of quality_status.
        default: SCHEDULED
        constraints: "one of {SCHEDULED, RUNNING, INTERRUPTED, MACHINING_COMPLETE, CANCELLED}"
      - name: quality_status
        type: enum
        source: system
        description: Quality dimension of the work order state; evolves independently of machining_status.
        default: PENDING_INSPECTION
        constraints: "one of {PENDING_INSPECTION, IN_SPC, QUALITY_HOLD, ACCEPTED, REJECTED}"
      - name: cancel_reason
        type: string
        source: system
        description: Reason recorded when the job was cancelled; null otherwise.
        default: null

  - name: ToolAssignment
    parent: Machine
    common_fields: true
    fields:
      - name: machine_id
        type: string
        source: input
        description: "FK -> Machine.id; the machine this tool station belongs to."
      - name: station
        type: integer
        source: input
        description: Gang/turret station number, unique per machine.
        constraints: ">= 1; unique within machine_id"
      - name: tool_code
        type: string
        source: input
        description: Tool catalogue code currently loaded in the station.
      - name: expected_life_pieces
        type: integer
        source: input
        description: Pieces the tool is rated for between indexes.
        constraints: ">= 1"
      - name: drift_limit_um
        type: number
        source: input
        description: Absolute cumulative offset drift in microns at or beyond which the station must be held.
        default: 8
        constraints: "> 0"
      - name: pieces_since_index
        type: integer
        source: computed
        description: Pieces produced since the station was last indexed.
        default: 0
      - name: cumulative_drift_um
        type: number
        source: computed
        description: Signed sum of every measured offset correction logged since the last index, in microns.
        default: 0
      - name: offset_log_count
        type: integer
        source: computed
        description: Number of offset logs posted since the station was last indexed.
        default: 0
      - name: status
        type: enum
        source: system
        description: Usability state of the tool station.
        default: IN_SERVICE
        constraints: "one of {IN_SERVICE, OFFSET_HOLD, LIFE_EXPIRED, RETIRED}"

  - name: SpcSample
    parent: WorkOrder
    common_fields: false
    fields:
      - name: work_order_id
        type: string
        source: input
        description: "FK -> WorkOrder.id; the job the subgroup was pulled from."
      - name: characteristic_id
        type: string
        source: input
        description: "FK -> Characteristic.id; the print characteristic measured."
      - name: gauge_id
        type: string
        source: input
        description: "FK -> Gauge.id; the gauge used to take the measurements."
      - name: inspector_operator_id
        type: string
        source: system
        description: "FK -> Operator.id; set from the X-User-ID header of the Inspector who posted the subgroup."
      - name: piece_index
        type: integer
        source: input
        description: Ordinal piece number in the run at which the subgroup was pulled.
        constraints: ">= 1"
      - name: measurements
        type: array
        source: input
        description: Individual measured values in millimetres; length must equal Characteristic.subgroup_size.
      - name: mean
        type: number
        source: computed
        description: Arithmetic mean of measurements, rounded to 4 decimals.
      - name: range
        type: number
        source: computed
        description: max(measurements) - min(measurements), rounded to 4 decimals.
      - name: sigma_within
        type: number
        source: computed
        description: Within-subgroup sigma estimated as range / d2, rounded to 6 decimals.
      - name: cpk_short_term
        type: number
        source: computed
        description: Short-term capability index for this subgroup, rounded to 3 decimals.
      - name: out_of_spec_count
        type: integer
        source: computed
        description: Number of measurements strictly outside the characteristic's [lsl, usl] band.
      - name: disposition
        type: enum
        source: computed
        description: Subgroup verdict derived from out_of_spec_count and cpk_short_term.
        constraints: "one of {ACCEPT, MARGINAL, REJECT}"

  - name: RoutingStep
    parent: WorkOrder
    common_fields: true
    fields:
      - name: work_order_id
        type: string
        source: input
        description: "FK -> WorkOrder.id; the job this secondary operation belongs to."
      - name: predecessor_step_id
        type: string
        source: input
        description: "FK -> RoutingStep.id; the step that must be COMPLETE before this one may start; null for the first step in the route."
        default: null
      - name: sequence
        type: integer
        source: input
        description: Route position, unique within work_order_id.
        constraints: ">= 1; unique within work_order_id"
      - name: operation
        type: enum
        source: input
        description: Secondary operation performed at this step.
        constraints: "one of {DEBURR, WASH, HEAT_TREAT, PLATING, INSPECTION_100PCT}"
      - name: status
        type: enum
        source: system
        description: Progress state of the routing step.
        default: PENDING
        constraints: "one of {PENDING, IN_PROGRESS, COMPLETE, BLOCKED}"
      - name: blocked_reason
        type: string
        source: system
        description: Reason recorded when the step was blocked by an upstream cascade; null otherwise.
        default: null

state_machines:
  - entity: WorkOrder
    dimension: machining_status
    shape: cyclic
    initial_state: SCHEDULED
    terminal_states: [MACHINING_COMPLETE, CANCELLED]
    note: |
      Production dimension. Advances without reference to quality_status; a job
      may reach MACHINING_COMPLETE while quality_status is still IN_SPC, and may
      reach quality_status ACCEPTED only after this dimension is terminal.
    transitions:
      - from: SCHEDULED
        to: RUNNING
        trigger: "POST /swiss-shop/work-orders/{id}/start"
        actor: Machinist
        preconditions:
          - "WorkOrder.machining_status == SCHEDULED"
          - "Machine.status == AVAILABLE for WorkOrder.machine_id"
          - "BarStockLot.status == CERTIFIED for WorkOrder.bar_lot_id"
          - "no ToolAssignment with machine_id == WorkOrder.machine_id has status IN {OFFSET_HOLD, LIFE_EXPIRED}"
          - "the Operator identified by X-User-ID exists and Operator.status == ACTIVE"
          - "when WorkOrder.lights_out_hours > 0, that Operator.certifications contains LIGHTS_OUT"
        side_effects:
          - "sets WorkOrder.machinist_operator_id to the X-User-ID of the acting Machinist"
          - "sets Machine.status to RUNNING and Machine.current_work_order_id to this WorkOrder.id"
          - "increments Machine.version by 1"
          - "sets KanbanRelease.status of WorkOrder.release_id from RELEASED to IN_PRODUCTION when it is RELEASED"
      - from: INTERRUPTED
        to: RUNNING
        trigger: "POST /swiss-shop/work-orders/{id}/start"
        actor: Machinist
        preconditions:
          - "WorkOrder.machining_status == INTERRUPTED"
          - "Machine.status == AVAILABLE for WorkOrder.machine_id"
          - "no ToolAssignment with machine_id == WorkOrder.machine_id has status IN {OFFSET_HOLD, LIFE_EXPIRED}"
          - "the Operator identified by X-User-ID exists and Operator.status == ACTIVE"
        side_effects:
          - "overwrites WorkOrder.machinist_operator_id with the X-User-ID of the acting Machinist"
          - "sets Machine.status to RUNNING and Machine.current_work_order_id to this WorkOrder.id"
          - "increments Machine.version by 1"
          - "sets every RoutingStep with work_order_id == this WorkOrder.id and status == BLOCKED back to PENDING and clears blocked_reason"
        note: "The revision loop back into RUNNING is what makes this dimension cyclic."
      - from: RUNNING
        to: INTERRUPTED
        trigger: "system cascade — second hop of the tool-hold chain, fired because Machine.status moved RUNNING -> DOWN"
        actor: system
        preconditions:
          - "WorkOrder.machining_status == RUNNING"
          - "the WorkOrder's Machine has just transitioned RUNNING -> DOWN"
        side_effects:
          - "clears Machine.current_work_order_id"
          - "sets every RoutingStep with work_order_id == this WorkOrder.id and status == PENDING to BLOCKED with blocked_reason = 'UPSTREAM_MACHINE_DOWN'"
      - from: RUNNING
        to: MACHINING_COMPLETE
        trigger: "POST /swiss-shop/work-orders/{id}/complete-machining"
        actor: Machinist
        preconditions:
          - "WorkOrder.machining_status == RUNNING"
          - "qty_good + qty_scrap <= WorkOrder.qty_ordered"
        side_effects:
          - "stores qty_good, qty_scrap and actual_run_seconds on the WorkOrder"
          - "moves WorkOrder.reserved_length_mm on the BarStockLot from reserved_length_mm to consumed_length_mm, leaving available_length_mm untouched"
          - "sets BarStockLot.status to DEPLETED when available_length_mm == 0 and reserved_length_mm == 0"
          - "computes WorkOrder.chip_kg per calculations.chip_and_coolant_accrual and adds it to Machine.chip_accrual_by_alloy[Part.alloy_code]"
          - "adds the job's coolant make-up litres to Machine.coolant_makeup_liters"
          - "sets Machine.status to AVAILABLE and clears Machine.current_work_order_id"
          - "increments Machine.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /swiss-shop/work-orders/{id}/cancel"
        actor: ShopPlanner
        preconditions:
          - "WorkOrder.machining_status IN {SCHEDULED, INTERRUPTED}"
        side_effects:
          - "returns WorkOrder.reserved_length_mm from BarStockLot.reserved_length_mm to BarStockLot.available_length_mm, leaving consumed_length_mm untouched, so calculations.bar_length_ledger is conserved"
          - "sets every RoutingStep with work_order_id == this WorkOrder.id and status IN {PENDING, BLOCKED, IN_PROGRESS} to BLOCKED with blocked_reason = 'WORK_ORDER_CANCELLED'"
          - "releases the machine when Machine.current_work_order_id == this WorkOrder.id by setting Machine.status to AVAILABLE, clearing current_work_order_id and incrementing Machine.version by 1"
      - from: INTERRUPTED
        to: CANCELLED
        trigger: "POST /swiss-shop/work-orders/{id}/cancel"
        actor: ShopPlanner
        preconditions:
          - "WorkOrder.machining_status == INTERRUPTED"
        side_effects:
          - "returns WorkOrder.reserved_length_mm from BarStockLot.reserved_length_mm to BarStockLot.available_length_mm"
          - "sets every RoutingStep with work_order_id == this WorkOrder.id and status IN {PENDING, BLOCKED, IN_PROGRESS} to BLOCKED with blocked_reason = 'WORK_ORDER_CANCELLED'"

  - entity: WorkOrder
    dimension: quality_status
    shape: cyclic
    initial_state: PENDING_INSPECTION
    terminal_states: [ACCEPTED, REJECTED]
    note: |
      Quality dimension. Runs on the same WorkOrder row as machining_status but
      is driven by SpcSample posts and QualityManager dispositions only.
    transitions:
      - from: PENDING_INSPECTION
        to: IN_SPC
        trigger: "system — first SpcSample accepted for this WorkOrder via POST /swiss-shop/spc-samples"
        actor: system
        preconditions:
          - "WorkOrder.quality_status == PENDING_INSPECTION"
          - "the posted SpcSample.disposition == ACCEPT"
        side_effects:
          - "no other entity is touched; machining_status is left exactly as it was"
      - from: PENDING_INSPECTION
        to: QUALITY_HOLD
        trigger: "system — first SpcSample accepted for this WorkOrder whose disposition is MARGINAL or REJECT"
        actor: system
        preconditions:
          - "WorkOrder.quality_status == PENDING_INSPECTION"
          - "the posted SpcSample.disposition IN {MARGINAL, REJECT}"
        side_effects:
          - "when the posted SpcSample.disposition == REJECT, sets the WorkOrder's Machine to DOWN, clears Machine.current_work_order_id and increments Machine.version by 1"
      - from: IN_SPC
        to: QUALITY_HOLD
        trigger: "system — SpcSample accepted for this WorkOrder whose disposition is MARGINAL or REJECT"
        actor: system
        preconditions:
          - "WorkOrder.quality_status == IN_SPC"
          - "the posted SpcSample.disposition IN {MARGINAL, REJECT}"
        side_effects:
          - "when the posted SpcSample.disposition == REJECT, sets the WorkOrder's Machine to DOWN, clears Machine.current_work_order_id and increments Machine.version by 1"
      - from: QUALITY_HOLD
        to: IN_SPC
        trigger: "POST /swiss-shop/work-orders/{id}/disposition with decision RELEASE_HOLD"
        actor: QualityManager
        preconditions:
          - "WorkOrder.quality_status == QUALITY_HOLD"
        side_effects:
          - "records the note on the WorkOrder; no sibling entity changes"
        note: "This return edge is what makes the quality dimension cyclic."
      - from: IN_SPC
        to: ACCEPTED
        trigger: "POST /swiss-shop/work-orders/{id}/disposition with decision ACCEPT"
        actor: QualityManager
        preconditions:
          - "WorkOrder.quality_status == IN_SPC"
          - "WorkOrder.machining_status == MACHINING_COMPLETE"
          - "for every Characteristic of WorkOrder.part_id, the count of SpcSample rows for this WorkOrder and that characteristic is >= ceil(WorkOrder.qty_ordered / Characteristic.sample_freq_pieces)"
          - "the long-term ppk of every Characteristic of WorkOrder.part_id, per calculations.capability_index variant ppk_long_term, is >= PPK_MIN_ACCEPT"
        side_effects:
          - "hop 1 of the fulfilment chain: sets KanbanRelease.fulfilled_qty of WorkOrder.release_id to WorkOrder.qty_good and its status from IN_PRODUCTION to FULFILLED"
          - "hop 2, caused by that release reaching FULFILLED: on the release's BlanketPO subtracts KanbanRelease.qty from open_released_qty, adds WorkOrder.qty_good to fulfilled_qty, adds (KanbanRelease.qty - WorkOrder.qty_good) back to remaining_qty and increments BlanketPO.version by 1"
          - "hop 3, caused by that BlanketPO recomputation landing on remaining_qty == 0 and open_released_qty == 0: sets BlanketPO.status from ACTIVE to EXHAUSTED"
          - "hop 4, caused by that BlanketPO reaching EXHAUSTED: sets the BlanketPO's Quote status from ACCEPTED to CONSUMED"
          - "recomputes Part.observed_avg_cycle_time_sec and Part.observed_accepted_qty per calculations.observed_cycle_time"
      - from: IN_SPC
        to: REJECTED
        trigger: "POST /swiss-shop/work-orders/{id}/disposition with decision REJECT"
        actor: QualityManager
        preconditions:
          - "WorkOrder.quality_status == IN_SPC"
          - "WorkOrder.machining_status == MACHINING_COMPLETE"
        side_effects:
          - "sets KanbanRelease.status of WorkOrder.release_id from IN_PRODUCTION to SHORT_CLOSED with close_reason = 'WORK_ORDER_REJECTED'"
          - "on the release's BlanketPO subtracts KanbanRelease.qty from open_released_qty, adds the same qty back to remaining_qty and increments BlanketPO.version by 1"
          - "Part.observed_avg_cycle_time_sec is NOT recomputed because rejected jobs are excluded from the observed input set"
      - from: QUALITY_HOLD
        to: REJECTED
        trigger: "POST /swiss-shop/work-orders/{id}/disposition with decision REJECT"
        actor: QualityManager
        preconditions:
          - "WorkOrder.quality_status == QUALITY_HOLD"
          - "WorkOrder.machining_status == MACHINING_COMPLETE"
        side_effects:
          - "sets KanbanRelease.status of WorkOrder.release_id from IN_PRODUCTION to SHORT_CLOSED with close_reason = 'WORK_ORDER_REJECTED'"
          - "on the release's BlanketPO subtracts KanbanRelease.qty from open_released_qty, adds the same qty back to remaining_qty and increments BlanketPO.version by 1"

  - entity: ToolAssignment
    dimension: status
    shape: cyclic
    initial_state: IN_SERVICE
    terminal_states: [RETIRED]
    transitions:
      - from: IN_SERVICE
        to: OFFSET_HOLD
        trigger: "POST /swiss-shop/tool-assignments/{id}/offset-logs — threshold branch, per calculations.tool_wear_state"
        actor: Machinist
        preconditions:
          - "ToolAssignment.status == IN_SERVICE"
          - "after the log is applied, pieces_since_index < expected_life_pieces"
          - "after the log is applied, abs(cumulative_drift_um) >= drift_limit_um"
        side_effects:
          - "hop 1 of the tool-hold chain: this station is held"
          - "hop 2, caused by this station reaching OFFSET_HOLD: the station's Machine transitions to DOWN when its status is RUNNING or AVAILABLE, and Machine.version is incremented by 1"
          - "hop 3, caused by that Machine reaching DOWN: the WorkOrder whose machine_id is that machine and whose machining_status is RUNNING moves to INTERRUPTED and Machine.current_work_order_id is cleared"
          - "hop 4, caused by that WorkOrder reaching INTERRUPTED: every RoutingStep of that WorkOrder with status PENDING moves to BLOCKED with blocked_reason = 'UPSTREAM_MACHINE_DOWN'"
      - from: IN_SERVICE
        to: LIFE_EXPIRED
        trigger: "POST /swiss-shop/tool-assignments/{id}/offset-logs — life branch, per calculations.tool_wear_state"
        actor: Machinist
        preconditions:
          - "ToolAssignment.status == IN_SERVICE"
          - "after the log is applied, pieces_since_index >= expected_life_pieces"
        side_effects:
          - "hop 2, caused by this station reaching LIFE_EXPIRED: the station's Machine transitions to DOWN when its status is RUNNING or AVAILABLE, and Machine.version is incremented by 1"
          - "hop 3, caused by that Machine reaching DOWN: the WorkOrder whose machine_id is that machine and whose machining_status is RUNNING moves to INTERRUPTED and Machine.current_work_order_id is cleared"
          - "hop 4, caused by that WorkOrder reaching INTERRUPTED: every RoutingStep of that WorkOrder with status PENDING moves to BLOCKED with blocked_reason = 'UPSTREAM_MACHINE_DOWN'"
        note: "The life branch is evaluated before the drift branch, so a log that crosses both thresholds lands in LIFE_EXPIRED."
      - from: OFFSET_HOLD
        to: IN_SERVICE
        trigger: "POST /swiss-shop/tool-assignments/{id}/index"
        actor: Machinist
        preconditions:
          - "ToolAssignment.status IN {OFFSET_HOLD, LIFE_EXPIRED}"
        side_effects:
          - "resets pieces_since_index to 0, cumulative_drift_um to 0 and offset_log_count to 0"
          - "replaces tool_code when new_tool_code is supplied"
          - "the Machine is NOT restored by this transition; POST /swiss-shop/machines/{id}/restore is the only way back to AVAILABLE"
        note: "This return edge is what makes the tool station cyclic."
      - from: LIFE_EXPIRED
        to: IN_SERVICE
        trigger: "POST /swiss-shop/tool-assignments/{id}/index"
        actor: Machinist
        preconditions:
          - "ToolAssignment.status == LIFE_EXPIRED"
        side_effects:
          - "resets pieces_since_index to 0, cumulative_drift_um to 0 and offset_log_count to 0"
          - "replaces tool_code when new_tool_code is supplied"
      - from: LIFE_EXPIRED
        to: RETIRED
        trigger: "POST /swiss-shop/tool-assignments/{id}/index with retire = true"
        actor: Machinist
        preconditions:
          - "ToolAssignment.status IN {OFFSET_HOLD, LIFE_EXPIRED}"
          - "the request body carries retire = true"
        side_effects:
          - "station is permanently retired; further offset logs and index calls are rejected with ERR_INVALID_STATE"
          - "the station stops blocking POST /swiss-shop/machines/{id}/restore because the guard only inspects statuses IN {OFFSET_HOLD, LIFE_EXPIRED}"
      - from: OFFSET_HOLD
        to: RETIRED
        trigger: "POST /swiss-shop/tool-assignments/{id}/index with retire = true"
        actor: Machinist
        preconditions:
          - "ToolAssignment.status == OFFSET_HOLD"
          - "the request body carries retire = true"
        side_effects:
          - "station is permanently retired; further offset logs and index calls are rejected with ERR_INVALID_STATE"

  - entity: Gauge
    dimension: status
    shape: cyclic
    initial_state: IN_SERVICE
    terminal_states: [RETIRED]
    transitions:
      - from: IN_SERVICE
        to: CALIBRATION_DUE
        trigger: "system — lazy re-evaluation on every read of the Gauge and on every POST /swiss-shop/spc-samples that names it"
        actor: system
        preconditions:
          - "Gauge.status == IN_SERVICE"
          - "the logical clock is at or after Gauge.calibration_due_at"
        side_effects:
          - "the gauge stops satisfying the business_safety check at validations priority 70"
      - from: CALIBRATION_DUE
        to: IN_SERVICE
        trigger: "POST /swiss-shop/gauges/{id}/calibrations"
        actor: QualityManager
        preconditions:
          - "Gauge.status IN {IN_SERVICE, CALIBRATION_DUE, GRR_FAILED}"
          - "the posted grr_pct <= GRR_MAX_PCT"
          - "the posted calibration_due_at is strictly after the logical clock"
        side_effects:
          - "overwrites calibrated_at, calibration_due_at and grr_pct and increments calibration_count by 1"
        note: "This return edge is what makes the gauge cyclic."
      - from: IN_SERVICE
        to: GRR_FAILED
        trigger: "POST /swiss-shop/gauges/{id}/calibrations with grr_pct > GRR_MAX_PCT and <= GRR_RETIRE_PCT"
        actor: QualityManager
        preconditions:
          - "Gauge.status IN {IN_SERVICE, CALIBRATION_DUE, GRR_FAILED}"
          - "GRR_MAX_PCT < posted grr_pct <= GRR_RETIRE_PCT"
        side_effects:
          - "overwrites calibrated_at, calibration_due_at and grr_pct and increments calibration_count by 1"
          - "the gauge stops satisfying the business_safety check at validations priority 70"
      - from: GRR_FAILED
        to: RETIRED
        trigger: "POST /swiss-shop/gauges/{id}/calibrations with grr_pct > GRR_RETIRE_PCT"
        actor: QualityManager
        preconditions:
          - "Gauge.status IN {IN_SERVICE, CALIBRATION_DUE, GRR_FAILED}"
          - "posted grr_pct > GRR_RETIRE_PCT"
        side_effects:
          - "gauge is permanently retired; further calibration posts are rejected with ERR_INVALID_STATE"

  - entity: Machine
    dimension: status
    shape: cyclic
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: RUNNING
        trigger: "POST /swiss-shop/work-orders/{id}/start"
        actor: Machinist
        preconditions:
          - "Machine.status == AVAILABLE"
        side_effects:
          - "sets current_work_order_id and increments Machine.version by 1"
      - from: RUNNING
        to: AVAILABLE
        trigger: "POST /swiss-shop/work-orders/{id}/complete-machining"
        actor: Machinist
        preconditions:
          - "Machine.current_work_order_id == the completing WorkOrder.id"
        side_effects:
          - "clears current_work_order_id and increments Machine.version by 1"
      - from: RUNNING
        to: DOWN
        trigger: "system cascade — a ToolAssignment on this machine reached OFFSET_HOLD or LIFE_EXPIRED, or an SpcSample with disposition REJECT was posted against the running job"
        actor: system
        preconditions:
          - "Machine.status == RUNNING"
        side_effects:
          - "increments Machine.version by 1 and propagates to the running WorkOrder"
      - from: AVAILABLE
        to: DOWN
        trigger: "system cascade — a ToolAssignment on this machine reached OFFSET_HOLD or LIFE_EXPIRED while no job was running"
        actor: system
        preconditions:
          - "Machine.status == AVAILABLE"
        side_effects:
          - "increments Machine.version by 1; no WorkOrder is affected because none is RUNNING"
      - from: DOWN
        to: AVAILABLE
        trigger: "POST /swiss-shop/machines/{id}/restore"
        actor: Machinist
        preconditions:
          - "Machine.status == DOWN"
          - "no ToolAssignment with machine_id == this machine has status IN {OFFSET_HOLD, LIFE_EXPIRED}"
        side_effects:
          - "increments Machine.version by 1"
        note: "Guarded cross-entity transition: the machine cannot come back until every held tool station has been indexed."

  - entity: BlanketPO
    dimension: status
    shape: cyclic
    initial_state: ACTIVE
    terminal_states: [EXHAUSTED, EXPIRED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /swiss-shop/blanket-pos/{id}/suspend"
        actor: ShopPlanner
        preconditions:
          - "BlanketPO.status == ACTIVE"
        side_effects:
          - "records suspension_reason and increments BlanketPO.version by 1"
          - "existing kanban releases are untouched; only new releases are blocked"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /swiss-shop/blanket-pos/{id}/reinstate"
        actor: ShopPlanner
        preconditions:
          - "BlanketPO.status == SUSPENDED"
          - "the logical clock is strictly before BlanketPO.expires_on"
        side_effects:
          - "clears suspension_reason and increments BlanketPO.version by 1"
        note: "This return edge is what makes the blanket order cyclic."
      - from: ACTIVE
        to: EXHAUSTED
        trigger: "system — hop 3 of the fulfilment chain, fired because a KanbanRelease reaching FULFILLED drove remaining_qty to 0"
        actor: system
        preconditions:
          - "BlanketPO.remaining_qty == 0"
          - "BlanketPO.open_released_qty == 0"
        side_effects:
          - "hop 4, caused by this order reaching EXHAUSTED: the BlanketPO's Quote moves ACCEPTED -> CONSUMED"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system — lazy re-evaluation when POST /swiss-shop/kanban-releases names this order and the logical clock is at or after expires_on"
        actor: system
        preconditions:
          - "BlanketPO.status == ACTIVE"
          - "the logical clock is at or after BlanketPO.expires_on"
        side_effects:
          - "the release request that triggered the re-evaluation is rejected with ERR_PO_EXPIRED and BlanketPO.version is incremented by 1"

  - entity: KanbanRelease
    dimension: status
    shape: branching
    initial_state: RELEASED
    terminal_states: [FULFILLED, SHORT_CLOSED]
    note: |
      Fork-join: from IN_PRODUCTION the release forks into FULFILLED or
      SHORT_CLOSED with divergent side-effect sets — FULFILLED credits
      fulfilled_qty and can drive the order to EXHAUSTED, SHORT_CLOSED returns
      the entire released quantity to remaining_qty and can never exhaust it.
    transitions:
      - from: RELEASED
        to: IN_PRODUCTION
        trigger: "POST /swiss-shop/work-orders/{id}/start for a WorkOrder whose release_id is this release"
        actor: Machinist
        preconditions:
          - "KanbanRelease.status == RELEASED"
        side_effects:
          - "no quantity moves on the BlanketPO; the pieces were already moved to open_released_qty at release creation"
      - from: IN_PRODUCTION
        to: FULFILLED
        trigger: "system — hop 1 of the fulfilment chain, fired by POST /swiss-shop/work-orders/{id}/disposition with decision ACCEPT"
        actor: system
        preconditions:
          - "KanbanRelease.status == IN_PRODUCTION"
          - "the accepting WorkOrder.release_id == this release"
        side_effects:
          - "sets fulfilled_qty to WorkOrder.qty_good"
          - "hop 2, caused by this release reaching FULFILLED: BlanketPO.open_released_qty -= qty, fulfilled_qty += WorkOrder.qty_good, remaining_qty += (qty - WorkOrder.qty_good), version += 1"
      - from: IN_PRODUCTION
        to: SHORT_CLOSED
        trigger: "system — fired by POST /swiss-shop/work-orders/{id}/disposition with decision REJECT"
        actor: system
        preconditions:
          - "KanbanRelease.status == IN_PRODUCTION"
        side_effects:
          - "sets close_reason to 'WORK_ORDER_REJECTED' and leaves fulfilled_qty at 0"
          - "on the BlanketPO: open_released_qty -= qty, remaining_qty += qty, fulfilled_qty unchanged, version += 1"
      - from: RELEASED
        to: SHORT_CLOSED
        trigger: "POST /swiss-shop/kanban-releases/{id}/short-close"
        actor: ShopPlanner
        preconditions:
          - "KanbanRelease.status == RELEASED"
          - "no WorkOrder with release_id == this release has machining_status IN {RUNNING, INTERRUPTED, MACHINING_COMPLETE}"
        side_effects:
          - "records close_reason from the request body"
          - "compensating action for calculations.po_quantity_ledger: BlanketPO.open_released_qty -= qty and BlanketPO.remaining_qty += qty, leaving total_committed_qty conserved"
          - "increments BlanketPO.version by 1"
      - from: IN_PRODUCTION
        to: SHORT_CLOSED
        trigger: "POST /swiss-shop/kanban-releases/{id}/short-close"
        actor: ShopPlanner
        preconditions:
          - "KanbanRelease.status == IN_PRODUCTION"
          - "every WorkOrder with release_id == this release has machining_status == CANCELLED"
        side_effects:
          - "records close_reason from the request body"
          - "BlanketPO.open_released_qty -= qty, BlanketPO.remaining_qty += qty, BlanketPO.version += 1"

  - entity: Quote
    dimension: status
    shape: branching
    initial_state: DRAFT
    terminal_states: [CONSUMED, EXPIRED]
    transitions:
      - from: DRAFT
        to: PRICED
        trigger: "POST /swiss-shop/quotes/{id}/price"
        actor: ShopPlanner
        preconditions:
          - "Quote.status IN {DRAFT, PRICED}"
          - "when costing_basis == HISTORICAL_CYCLE, the quoted Part must exist (its observed_avg_cycle_time_sec may be null, in which case the standard cycle time is used as the documented fallback)"
        side_effects:
          - "writes costing_basis, cycle_time_used_sec, effective_qty, the four cost components, quoted_lot_cost_cents and quoted_unit_price_cents per calculations.quote_pricing"
      - from: PRICED
        to: PRICED
        trigger: "POST /swiss-shop/quotes/{id}/price — re-price on a different costing basis"
        actor: ShopPlanner
        preconditions:
          - "Quote.status == PRICED"
        side_effects:
          - "overwrites every pricing field; the previous figures are not retained"
      - from: PRICED
        to: ACCEPTED
        trigger: "POST /swiss-shop/quotes/{id}/accept"
        actor: ShopPlanner
        preconditions:
          - "Quote.status == PRICED"
          - "the posted expires_on is strictly after the logical clock"
        side_effects:
          - "creates one BlanketPO whose list_unit_price_cents is Quote.quoted_unit_price_cents and whose rebate fields follow calculations.blanket_po_rebate"
          - "sets BlanketPO.remaining_qty to total_committed_qty, open_released_qty to 0 and fulfilled_qty to 0"
      - from: ACCEPTED
        to: CONSUMED
        trigger: "system — hop 4 of the fulfilment chain, fired because this quote's BlanketPO reached EXHAUSTED"
        actor: system
        preconditions:
          - "Quote.status == ACCEPTED"
          - "the quote's BlanketPO has just transitioned ACTIVE -> EXHAUSTED"
        side_effects:
          - "no further blanket order may be created from this quote"
      - from: PRICED
        to: EXPIRED
        trigger: "POST /swiss-shop/quotes/{id}/accept attempted when the logical clock is at or after QUOTE_VALID_UNTIL_DAYS after Quote.created_at"
        actor: ShopPlanner
        preconditions:
          - "Quote.status == PRICED"
          - "the logical clock is at or after Quote.created_at plus QUOTE_VALID_UNTIL_DAYS days"
        side_effects:
          - "the accept request is rejected with ERR_INVALID_STATE and the quote is left in EXPIRED"

  - entity: RoutingStep
    dimension: status
    shape: cyclic
    initial_state: PENDING
    terminal_states: [COMPLETE]
    transitions:
      - from: PENDING
        to: IN_PROGRESS
        trigger: "POST /swiss-shop/routing-steps/{id}/advance with to_status IN_PROGRESS"
        actor: Machinist
        preconditions:
          - "RoutingStep.status == PENDING"
          - "the step's WorkOrder.machining_status == MACHINING_COMPLETE"
          - "when predecessor_step_id is not null, that RoutingStep.status == COMPLETE"
        side_effects:
          - "no sibling entity changes"
      - from: IN_PROGRESS
        to: COMPLETE
        trigger: "POST /swiss-shop/routing-steps/{id}/advance with to_status COMPLETE"
        actor: Machinist
        preconditions:
          - "RoutingStep.status == IN_PROGRESS"
        side_effects:
          - "unblocks nothing automatically; successor steps become startable because their predecessor guard now passes"
      - from: PENDING
        to: BLOCKED
        trigger: "system cascade — hop 4 of the tool-hold chain, or the cancel cascade"
        actor: system
        preconditions:
          - "RoutingStep.status == PENDING"
          - "the step's WorkOrder has just moved to INTERRUPTED or CANCELLED"
        side_effects:
          - "records blocked_reason"
      - from: IN_PROGRESS
        to: BLOCKED
        trigger: "system cascade — the step's WorkOrder was cancelled"
        actor: system
        preconditions:
          - "RoutingStep.status == IN_PROGRESS"
          - "the step's WorkOrder has just moved to CANCELLED"
        side_effects:
          - "records blocked_reason = 'WORK_ORDER_CANCELLED'"
      - from: BLOCKED
        to: PENDING
        trigger: "system cascade — the step's WorkOrder moved INTERRUPTED -> RUNNING"
        actor: system
        preconditions:
          - "RoutingStep.status == BLOCKED"
          - "the step's WorkOrder has just moved INTERRUPTED -> RUNNING"
        side_effects:
          - "clears blocked_reason"
        note: "This return edge is what makes the routing step cyclic."

  - entity: BarStockLot
    dimension: status
    shape: linear
    initial_state: RECEIVED
    terminal_states: [QUARANTINED, DEPLETED]
    transitions:
      - from: RECEIVED
        to: CERTIFIED
        trigger: "POST /swiss-shop/bar-stock-lots/{id}/certify"
        actor: QualityManager
        preconditions:
          - "BarStockLot.status == RECEIVED"
        side_effects:
          - "records certificate_number; the lot becomes eligible to back a work order start"
      - from: CERTIFIED
        to: DEPLETED
        trigger: "system — POST /swiss-shop/work-orders/{id}/complete-machining drove available_length_mm and reserved_length_mm to 0"
        actor: system
        preconditions:
          - "BarStockLot.available_length_mm == 0"
          - "BarStockLot.reserved_length_mm == 0"
        side_effects:
          - "no further work order may reserve against the lot"
      - from: RECEIVED
        to: QUARANTINED
        trigger: "POST /swiss-shop/bar-stock-lots/{id}/certify with certificate_number equal to the literal string 'QUARANTINE'"
        actor: QualityManager
        preconditions:
          - "BarStockLot.status == RECEIVED"
        side_effects:
          - "the lot can never back a work order start"

concurrency_rules:
  - rule_id: kanban-release-stale-po
    parent_entity: BlanketPO
    write_endpoint: "POST /swiss-shop/kanban-releases"
    occ_field: "expected_blanket_po_version"
    description: |
      Cutting a kanban release against a BlanketPO whose version has advanced
      since the client last read it is rejected as a stale-version write. The
      order's remaining_qty, open_released_qty and status are all moved by
      earlier releases, by fulfilment hops and by suspend/reinstate, so a
      release authored against an out-of-date view of the order would draw down
      a pool the client never actually saw.
    error_id: ERR_STALE_PO_VERSION
    http_status: 412
  - rule_id: work-order-schedule-stale-machine
    parent_entity: Machine
    write_endpoint: "POST /swiss-shop/work-orders"
    occ_field: "expected_machine_version"
    description: |
      Scheduling a work order onto a Machine whose version has advanced since
      the client last read it is rejected as a stale-version write. Every
      accepted schedule, start, completion and tool-hold cascade advances the
      machine's version, so a window authored against an out-of-date calendar
      is refused before the overlap arithmetic is even attempted.
    error_id: ERR_STALE_MACHINE_VERSION
    http_status: 412

calculations:
  - name: quote_pricing
    trigger: "POST /swiss-shop/quotes/{id}/price (Quote DRAFT -> PRICED and PRICED -> PRICED)"
    algorithm: tiered_pricing
    combinatorial_mode: "(a) formula with >=3 inputs and non-linear interaction — nested min against the lights-out cap, a conditional branch on Part.lights_out_eligible, and two different spindle rates selected per hour bucket"
    formula: |
      # Step 1 — quantity inflated by scrap allowance, rounded UP to whole pieces
      effective_qty = ceil(Quote.lot_qty * (1 + SCRAP_ALLOWANCE_PCT))

      # Step 2 — cycle time selected by the requested variant (see variants below)
      cycle_time_used_sec = <variant-selected seconds per piece>

      # Step 3 — spindle hours, kept as an exact quotient (no intermediate rounding)
      run_hours = (effective_qty * cycle_time_used_sec) / 3600

      # Step 4 — lights-out split: conditional branch then nested min
      if Part.lights_out_eligible == false:
          lights_out_hours = 0
      else:
          lights_out_hours = min(Quote.requested_lights_out_hours,
                                 run_hours * LIGHTS_OUT_MAX_FRACTION)
      attended_hours = run_hours - lights_out_hours

      # Step 5 — the four cost components. ROUNDING ORDER IS PINNED: each of the
      # four components is rounded HALF_UP to a whole cent on its own, and the
      # four rounded integers are then summed. Summing unrounded components and
      # rounding once at the end is NOT the declared order.
      run_cost_cents       = round_half_up(attended_hours * MACHINE_ATTENDED_RATE_CENTS_PER_HOUR)
                             + round_half_up(lights_out_hours * MACHINE_LIGHTS_OUT_RATE_CENTS_PER_HOUR)
      setup_cost_cents     = round_half_up(Part.setup_hours * SETUP_RATE_CENTS_PER_HOUR)
      if Part.secondary_required:
          secondary_cost_cents = round_half_up(Quote.lot_qty * Part.secondary_minutes_per_piece / 60
                                               * SECONDARY_RATE_CENTS_PER_HOUR)
      else:
          secondary_cost_cents = 0
      bar_length_required_mm = effective_qty * (Part.cut_off_length_mm + PART_OFF_KERF_MM)
                               + SETUP_SCRAP_LENGTH_MM
      material_cost_cents  = round_half_up(bar_length_required_mm / 1000
                                           * Part.material_cost_cents_per_meter
                                           * (1 + MATERIAL_MARKUP_PCT))

      quoted_lot_cost_cents = run_cost_cents + setup_cost_cents
                              + secondary_cost_cents + material_cost_cents

      # Step 6 — margin load, single final HALF_UP rounding
      quoted_unit_price_cents = round_half_up(quoted_lot_cost_cents
                                              / Quote.lot_qty / (1 - MARGIN_PCT))
    input_set: |
      Exactly one Quote row and its Part row. The HISTORICAL_CYCLE variant also
      reads Part.observed_avg_cycle_time_sec, which itself aggregates only
      WorkOrder rows whose quality_status == ACCEPTED (see
      calculations.observed_cycle_time). Work orders in any other quality_status
      — including MACHINING_COMPLETE jobs still sitting in IN_SPC or
      QUALITY_HOLD — are excluded.
    constants:
      SCRAP_ALLOWANCE_PCT: 0.02
      MACHINE_ATTENDED_RATE_CENTS_PER_HOUR: 9500
      MACHINE_LIGHTS_OUT_RATE_CENTS_PER_HOUR: 6200
      SETUP_RATE_CENTS_PER_HOUR: 11000
      SECONDARY_RATE_CENTS_PER_HOUR: 7400
      LIGHTS_OUT_MAX_FRACTION: 0.60
      MATERIAL_MARKUP_PCT: 0.18
      MARGIN_PCT: 0.22
      PART_OFF_KERF_MM: 2.0
      SETUP_SCRAP_LENGTH_MM: 300
      QUOTE_VALID_UNTIL_DAYS: 30
    precision: "cents, integer; every round_half_up above is half-up to zero decimal places on a cent value"
    variants:
      - name: standard_cycle
        when: "request body carries costing_basis = STANDARD_CYCLE"
        difference: "cycle_time_used_sec = Part.cycle_time_sec (the engineered standard)"
      - name: historical_cycle
        when: "request body carries costing_basis = HISTORICAL_CYCLE"
        difference: "cycle_time_used_sec = Part.observed_avg_cycle_time_sec when it is not null, otherwise Part.cycle_time_sec. Because observed cycle time reflects real interrupted, lights-out-degraded running it is normally longer than the engineered standard, so the two bases produce different quoted_unit_price_cents from identical Quote and Part inputs."

  - name: blanket_po_rebate
    trigger: "POST /swiss-shop/quotes/{id}/accept (Quote PRICED -> ACCEPTED, BlanketPO created)"
    algorithm: threshold
    combinatorial_mode: "(c) circular-looking dependency with an explicitly pinned evaluation order — the rebate tier is keyed on an extended total that the rebate itself would otherwise change"
    formula: |
      # EVALUATION ORDER IS PINNED. The tier is selected from the PRE-rebate
      # extended total and is NEVER re-selected from committed_value_cents, even
      # when applying the rebate drops the order into a lower tier.
      pre_rebate_total_cents = Quote.quoted_unit_price_cents * total_committed_qty

      rebate_pct = REBATE_TIER_0_PCT   if pre_rebate_total_cents <  REBATE_TIER_1_MIN_CENTS
                 = REBATE_TIER_1_PCT   if REBATE_TIER_1_MIN_CENTS <= pre_rebate_total_cents <  REBATE_TIER_2_MIN_CENTS
                 = REBATE_TIER_2_PCT   if REBATE_TIER_2_MIN_CENTS <= pre_rebate_total_cents <  REBATE_TIER_3_MIN_CENTS
                 = REBATE_TIER_3_PCT   if pre_rebate_total_cents >= REBATE_TIER_3_MIN_CENTS

      net_unit_price_cents   = round_half_up(Quote.quoted_unit_price_cents * (1 - rebate_pct))
      committed_value_cents  = net_unit_price_cents * total_committed_qty
      list_unit_price_cents  = Quote.quoted_unit_price_cents
    input_set: "The single accepted Quote and the total_committed_qty supplied in the accept request body. No other order or release participates."
    constants:
      REBATE_TIER_1_MIN_CENTS: 500000
      REBATE_TIER_2_MIN_CENTS: 2000000
      REBATE_TIER_3_MIN_CENTS: 10000000
      REBATE_TIER_0_PCT: 0.00
      REBATE_TIER_1_PCT: 0.03
      REBATE_TIER_2_PCT: 0.06
      REBATE_TIER_3_PCT: 0.09
    precision: "cents, integer, round_half_up; tier boundaries are inclusive on the lower edge (>=) and exclusive on the upper edge (<)"

  - name: bar_length_ledger
    trigger: "POST /swiss-shop/work-orders (reserve), POST /swiss-shop/work-orders/{id}/complete-machining (consume), POST /swiss-shop/work-orders/{id}/cancel (return)"
    algorithm: aggregation
    formula: |
      # Reservation, evaluated at work order creation
      required_length_mm = WorkOrder.qty_ordered
                           * (Part.cut_off_length_mm + PART_OFF_KERF_MM)
                           + SETUP_SCRAP_LENGTH_MM
      usable_length_per_bar_mm = BarStockLot.bar_length_mm - BAR_REMNANT_MM
      bars_reserved      = ceil(required_length_mm / usable_length_per_bar_mm)
      reserved_length_mm = bars_reserved * BarStockLot.bar_length_mm   # WHOLE bars leave the rack

      # Ledger moves (never partial, never rounded)
      on create   : available_length_mm -= reserved_length_mm ; reserved_length_mm += reserved_length_mm
      on complete : reserved_length_mm  -= reserved_length_mm ; consumed_length_mm += reserved_length_mm
      on cancel   : reserved_length_mm  -= reserved_length_mm ; available_length_mm += reserved_length_mm

      # CONSERVED QUANTITY (invariant, checked before and after every move)
      BarStockLot.available_length_mm + BarStockLot.reserved_length_mm
        + BarStockLot.consumed_length_mm == BarStockLot.total_length_mm
    input_set: "One BarStockLot and every WorkOrder whose bar_lot_id names it and whose machining_status is not CANCELLED. Cancelled work orders contribute zero to all three buckets."
    constants:
      PART_OFF_KERF_MM: 2.0
      SETUP_SCRAP_LENGTH_MM: 300
      BAR_REMNANT_MM: 150
    precision: "millimetres, exact; bars_reserved is a whole-number ceiling, no fractional bar is ever taken"

  - name: po_quantity_ledger
    trigger: "POST /swiss-shop/kanban-releases (draw), POST /swiss-shop/kanban-releases/{id}/short-close (return), disposition ACCEPT/REJECT hops"
    algorithm: aggregation
    formula: |
      on release create : remaining_qty -= qty        ; open_released_qty += qty
      on short-close    : open_released_qty -= qty    ; remaining_qty     += qty
      on accept (hop 2) : open_released_qty -= qty    ; fulfilled_qty += WorkOrder.qty_good
                          remaining_qty     += (qty - WorkOrder.qty_good)
      on reject         : open_released_qty -= qty    ; remaining_qty += qty

      # CONSERVED QUANTITY (invariant, checked before and after every move)
      BlanketPO.remaining_qty + BlanketPO.open_released_qty
        + BlanketPO.fulfilled_qty == BlanketPO.total_committed_qty
    input_set: "One BlanketPO and every KanbanRelease whose blanket_po_id names it. Releases in RELEASED or IN_PRODUCTION contribute to open_released_qty; FULFILLED releases contribute their WorkOrder.qty_good to fulfilled_qty; SHORT_CLOSED releases contribute nothing."
    constants: {}
    precision: "whole pieces, exact; no rounding participates"

  - name: capability_index
    trigger: "POST /swiss-shop/spc-samples (short-term, per subgroup) and GET /swiss-shop/work-orders/{id}/quality-summary plus the ACCEPT disposition gate (long-term, per characteristic)"
    algorithm: weighted_scoring
    formula: |
      # --- variant cpk_short_term, evaluated on ONE subgroup ---
      mean_s          = sum(measurements) / len(measurements)
      range_s         = max(measurements) - min(measurements)
      d2              = D2_BY_SUBGROUP_SIZE[Characteristic.subgroup_size]
      sigma_within    = range_s / d2
      cpk_short_term  = round_half_up(
                          min(Characteristic.usl - mean_s, mean_s - Characteristic.lsl)
                          / (3 * sigma_within), 3)
      out_of_spec_count = count(m in measurements where m < Characteristic.lsl or m > Characteristic.usl)

      disposition = REJECT   if out_of_spec_count > 0
                  = MARGINAL if out_of_spec_count == 0 and cpk_short_term <  Characteristic.cpk_min
                  = ACCEPT   if out_of_spec_count == 0 and cpk_short_term >= Characteristic.cpk_min
      # Boundary is INCLUSIVE: cpk_short_term exactly equal to cpk_min is ACCEPT.

      # --- variant ppk_long_term, evaluated over EVERY subgroup of one
      #     characteristic on one work order, pooled to individual readings ---
      pooled          = concat(sample.measurements for every SpcSample of this
                               work_order_id + characteristic_id, ordered by
                               SpcSample.created_at ASC, tie-broken by
                               SpcSample.piece_index ASC)
      mean_l          = sum(pooled) / len(pooled)
      s_overall       = sqrt( sum((x - mean_l)^2 for x in pooled) / (len(pooled) - 1) )   # n-1 denominator
      ppk_long_term   = round_half_up(
                          min(Characteristic.usl - mean_l, mean_l - Characteristic.lsl)
                          / (3 * s_overall), 3)
      # Undefined (null) when len(pooled) < 2.
    input_set: |
      Short-term: exactly the one subgroup being posted; no other sample and no
      other work order participates. Long-term: every SpcSample row whose
      work_order_id and characteristic_id match, regardless of that sample's own
      disposition — MARGINAL and REJECT subgroups are pooled in, not filtered
      out. Samples belonging to any other work order are excluded even when they
      measure the same characteristic.
    constants:
      D2_BY_SUBGROUP_SIZE: { 3: 1.693, 5: 2.326 }
      PPK_MIN_ACCEPT: 1.00
      CPK_MIN_DEFAULT: 1.33
    precision: "3 decimal places, round_half_up, on both variants; sigma_within is retained to 6 decimals, mean and range to 4"
    variants:
      - name: cpk_short_term
        when: "a single SpcSample is being scored at POST time"
        difference: "sigma is estimated from the subgroup RANGE divided by the d2 constant for the subgroup size, so only within-subgroup scatter counts and drift between subgroups is invisible"
      - name: ppk_long_term
        when: "the work order's overall capability is scored at quality-summary read time and at the ACCEPT disposition gate"
        difference: "sigma is the n-1 sample standard deviation of every pooled individual reading, so between-subgroup drift IS counted. Identical measurement data therefore yields a different number from the short-term variant, and the ACCEPT gate is judged on the long-term value while the per-subgroup disposition is judged on the short-term one."

  - name: observed_cycle_time
    trigger: "system — side effect of the IN_SPC -> ACCEPTED disposition transition on WorkOrder"
    algorithm: aggregation
    formula: |
      accepted = every WorkOrder w where w.part_id == Part.id
                 and w.quality_status == ACCEPTED
      Part.observed_accepted_qty = sum(w.qty_good for w in accepted)
      if Part.observed_accepted_qty == 0:
          Part.observed_avg_cycle_time_sec = null
      else:
          Part.observed_avg_cycle_time_sec = round_half_up(
              sum(w.actual_run_seconds for w in accepted)
              / Part.observed_accepted_qty, 1)
    input_set: "WorkOrder rows filtered to quality_status == ACCEPTED only. PENDING_INSPECTION, IN_SPC, QUALITY_HOLD and REJECTED jobs are excluded even when machining_status is MACHINING_COMPLETE."
    constants: {}
    precision: "1 decimal place, round_half_up; null when the accepted good-piece count is zero"

  - name: tool_wear_state
    trigger: "POST /swiss-shop/tool-assignments/{id}/offset-logs"
    algorithm: threshold
    formula: |
      pieces_since_index  += pieces_produced
      cumulative_drift_um += measured_drift_um      # signed accumulation
      offset_log_count    += 1

      # BRANCH ORDER IS PINNED: life is evaluated first, drift second.
      if pieces_since_index >= expected_life_pieces:
          status = LIFE_EXPIRED
      elif abs(cumulative_drift_um) >= drift_limit_um:
          status = OFFSET_HOLD
      else:
          status = IN_SERVICE
      # Both comparisons are >= : a station that lands exactly on its rated life
      # or exactly on its drift limit IS held.
    input_set: "One ToolAssignment row and the single offset log being posted. Logs posted before the last index do not participate because index resets both accumulators to 0."
    constants:
      OFFSET_DRIFT_LIMIT_UM_DEFAULT: 8
    precision: "microns to 3 decimals for cumulative_drift_um; pieces_since_index is a whole count"

  - name: chip_and_coolant_accrual
    trigger: "POST /swiss-shop/work-orders/{id}/complete-machining"
    algorithm: aggregation
    formula: |
      consumed_meters = WorkOrder.reserved_length_mm / 1000
      chip_kg = round_half_up(
                  consumed_meters * BarStockLot.mass_kg_per_meter
                  - WorkOrder.qty_good * Part.finished_mass_g / 1000, 3)
      Machine.chip_accrual_by_alloy[Part.alloy_code] =
          round_half_up(existing_value_or_zero + chip_kg, 3)
      Machine.coolant_makeup_liters = round_half_up(
          Machine.coolant_makeup_liters
          + (WorkOrder.actual_run_seconds / 3600) * COOLANT_LITERS_PER_MACHINE_HOUR, 3)
    input_set: "The one completing WorkOrder, its BarStockLot and its Part. Scrapped pieces are deliberately NOT credited as finished mass, so their material stays in the chip bucket."
    constants:
      COOLANT_LITERS_PER_MACHINE_HOUR: 0.35
    precision: "3 decimal places, round_half_up, on both kilograms and litres"

  - name: reclamation_credit
    trigger: "POST /swiss-shop/machines/{id}/reclaim"
    algorithm: waterfall_allocation
    combinatorial_mode: "(b) nested rounding where the order matters — per-alloy line rounding then summation, which is pinned and which diverges by whole cents from sum-then-round"
    formula: |
      # ROUNDING ORDER IS PINNED. Each alloy line is rounded HALF_UP to a whole
      # cent on its own, and the rounded integers are then summed. Summing the
      # unrounded line values and rounding once is NOT the declared order and
      # produces a different total whenever the dropped fractions add up.
      lines = Machine.chip_accrual_by_alloy entries, iterated by alloy_code
              ASCENDING (ASCII order), skipping entries whose kilograms == 0
      chip_credit_cents = sum(
          round_half_up(kg * ALLOY_SCRAP_RATE_CENTS_PER_KG[alloy_code])
          for (alloy_code, kg) in lines)

      coolant_cost_cents = round_half_up(Machine.coolant_makeup_liters
                                         * COOLANT_COST_CENTS_PER_LITER)

      net_reclamation_credit_cents = chip_credit_cents - coolant_cost_cents

      # settlement
      Machine.last_reclamation_credit_cents      = net_reclamation_credit_cents
      Machine.lifetime_reclamation_credit_cents += net_reclamation_credit_cents
      Machine.chip_accrual_by_alloy              = {}
      Machine.coolant_makeup_liters              = 0
    input_set: "Exactly the accrual currently sitting on the one Machine named in the path. Work orders that have not yet reached MACHINING_COMPLETE contribute nothing because accrual is written at completion; already-settled accrual cannot be double counted because settlement zeroes both buckets."
    constants:
      ALLOY_SCRAP_RATE_CENTS_PER_KG: { "303SS": 118, "316SS": 132, "C360": 465, "6061AL": 87, "12L14": 41 }
      COOLANT_COST_CENTS_PER_LITER: 420
    precision: "cents, integer; round_half_up applied once per alloy line and once to the coolant line, never to the grand total"

  - name: machine_window_occupancy
    trigger: "POST /swiss-shop/work-orders — validations priority 78"
    algorithm: interval_merge
    formula: |
      # HALF-OPEN geometry with a CONDITIONAL changeover buffer.
      # The candidate job occupies [scheduled_start_at, scheduled_end_at).
      # Every existing WorkOrder e on the same machine whose machining_status is
      # not CANCELLED occupies the half-open interval
      #     [e.scheduled_start_at, e.scheduled_end_at + buffer(e, candidate))
      # where
      #     buffer(e, candidate) = 0 minutes
      #         when Part(e).bar_diameter_mm == Part(candidate).bar_diameter_mm
      #     buffer(e, candidate) = CHANGEOVER_BUFFER_MINUTES
      #         otherwise (the guide bushing and collets must be swapped)
      # The buffer is appended ONLY to the earlier interval's end; it is never
      # prepended to the candidate's start.
      conflict = exists e such that
          candidate.scheduled_start_at < e.scheduled_end_at + buffer(e, candidate)
          and e.scheduled_start_at < candidate.scheduled_end_at
      # Half-open means exact adjacency is legal: a candidate starting at the
      # instant the buffered interval ends does NOT conflict.
    input_set: "Every WorkOrder whose machine_id equals the candidate's machine_id and whose machining_status is not CANCELLED, evaluated in scheduled_start_at ASC order tie-broken by created_at ASC. Cancelled jobs release their window immediately."
    constants:
      CHANGEOVER_BUFFER_MINUTES: 45
    precision: "whole minutes; timestamps compared at second resolution in UTC"

  - name: bar_lot_feeder_occupancy
    trigger: "POST /swiss-shop/work-orders — validations priority 80"
    algorithm: interval_merge
    formula: |
      # CLOSED geometry with AGGREGATE CAPACITY — deliberately different
      # interval arithmetic from machine_window_occupancy.
      # The candidate job occupies the CLOSED interval
      #     [scheduled_start_at, scheduled_end_at]
      # on the feeder of its BarStockLot. Every existing WorkOrder e naming the
      # same bar_lot_id whose machining_status is not CANCELLED occupies
      #     [e.scheduled_start_at, e.scheduled_end_at]
      # with NO buffer of any kind.
      overlapping = count(e where
            candidate.scheduled_start_at <= e.scheduled_end_at
            and e.scheduled_start_at <= candidate.scheduled_end_at)
      conflict = (overlapping + 1) > BarStockLot.feeder_slots
      # Closed means touching endpoints DO collide: a candidate starting at the
      # exact instant an existing job ends is counted as overlapping, which is
      # the opposite of the machine rule. Capacity is aggregate, so on a lot with
      # feeder_slots = 2 the first intersecting job is admitted and only the
      # second is refused.
    input_set: "Every WorkOrder whose bar_lot_id equals the candidate's bar_lot_id and whose machining_status is not CANCELLED, on any machine. Work orders on other lots never participate."
    constants: {}
    precision: "timestamps compared at second resolution in UTC; the count is a whole number"

  - name: spc_sampling_requirement
    trigger: "POST /swiss-shop/work-orders/{id}/disposition (ACCEPT gate) and GET /swiss-shop/work-orders/{id}/quality-summary"
    algorithm: threshold
    formula: |
      for each Characteristic c where c.part_id == WorkOrder.part_id:
          required_c = ceil(WorkOrder.qty_ordered / c.sample_freq_pieces)
          actual_c   = count(SpcSample s where s.work_order_id == WorkOrder.id
                                          and s.characteristic_id == c.id)
      required_sample_count = sum(required_c over all c)
      sample_count          = sum(actual_c   over all c)
      characteristic_count  = count of those Characteristic rows
      complete = for every c: actual_c >= required_c
      # When the part declares zero characteristics, required_sample_count is 0,
      # sample_count is 0, complete is TRUE, and cpk_short_term_min and
      # ppk_long_term_min are both null.
      cpk_short_term_min = min(s.cpk_short_term over every SpcSample of this work
                               order) or null when sample_count == 0
      ppk_long_term_min  = min(ppk_long_term(c) over every c with actual_c >= 2)
                           or null when no characteristic has 2 or more subgroups
      out_of_spec_count  = sum(s.out_of_spec_count over every SpcSample of this
                               work order)
    input_set: "Every Characteristic of the work order's part and every SpcSample naming this work order, regardless of the sample's disposition. Samples on sibling work orders for the same part are excluded."
    constants:
      PPK_MIN_ACCEPT: 1.00
    precision: "whole counts; ceil is applied per characteristic BEFORE summation, never to the summed ratio"

validations:
  - priority: 10
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the four declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 20
    category: auth
    check: "the acting role appears in the endpoint's roles list in the §1.5 table"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 30
    category: business_constraint
    check: "request body carries every required field with the declared type, enum members are legal, numeric fields respect their declared bounds, scheduled_end_at is strictly after scheduled_start_at, and pagination limit is within 1..100 with offset >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 40
    category: existence
    check: "every resource named in the URL path exists, validated left to right"
    error_id: "ERR_<RESOURCE>_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path parameter"
  - priority: 45
    category: existence
    check: "every foreign key named in the request body exists, validated in the order the fields are declared on the entity in §1.1"
    error_id: "ERR_<RESOURCE>_NOT_FOUND"
    http_status: 404
    applies_to: "POST /swiss-shop/characteristics, POST /swiss-shop/quotes, POST /swiss-shop/kanban-releases, POST /swiss-shop/tool-assignments, POST /swiss-shop/work-orders, POST /swiss-shop/spc-samples, POST /swiss-shop/routing-steps"
  - priority: 50
    category: existence
    check: "for Machinist and Inspector calls the X-User-ID header names an existing Operator whose status is ACTIVE"
    error_id: ERR_OPERATOR_NOT_FOUND
    http_status: 404
    applies_to: "POST /swiss-shop/work-orders/{id}/start, POST /swiss-shop/work-orders/{id}/complete-machining, POST /swiss-shop/tool-assignments/{id}/offset-logs, POST /swiss-shop/tool-assignments/{id}/index, POST /swiss-shop/machines/{id}/restore, POST /swiss-shop/spc-samples, POST /swiss-shop/routing-steps/{id}/advance"
  - priority: 55
    category: state
    check: "expected_blanket_po_version equals the BlanketPO's current version, and expected_machine_version equals the Machine's current version"
    error_id: ERR_STALE_PO_VERSION
    http_status: 412
    applies_to: "POST /swiss-shop/kanban-releases (ERR_STALE_PO_VERSION), POST /swiss-shop/work-orders (ERR_STALE_MACHINE_VERSION)"
  - priority: 60
    category: state
    check: "the target resource is in a state from which this transition is declared in §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 61
    category: state
    check: "the BlanketPO named by the request is in status ACTIVE"
    error_id: ERR_PO_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /swiss-shop/kanban-releases, POST /swiss-shop/work-orders"
  - priority: 62
    category: business_temporal
    check: "the logical clock is strictly before BlanketPO.expires_on"
    error_id: ERR_PO_EXPIRED
    http_status: 409
    applies_to: "POST /swiss-shop/kanban-releases"
  - priority: 63
    category: state
    check: "the Machine named by the work order is in status AVAILABLE"
    error_id: ERR_MACHINE_NOT_AVAILABLE
    http_status: 409
    applies_to: "POST /swiss-shop/work-orders/{id}/start"
  - priority: 64
    category: state
    check: "the BarStockLot named by the work order is in status CERTIFIED"
    error_id: ERR_BAR_LOT_NOT_CERTIFIED
    http_status: 409
    applies_to: "POST /swiss-shop/work-orders/{id}/start"
  - priority: 65
    category: business_safety
    check: "no ToolAssignment on the work order's machine is in status OFFSET_HOLD or LIFE_EXPIRED"
    error_id: ERR_TOOL_LIFE_EXPIRED
    http_status: 409
    applies_to: "POST /swiss-shop/work-orders/{id}/start, POST /swiss-shop/machines/{id}/restore"
  - priority: 70
    category: business_safety
    check: "the Gauge named by the subgroup is in status IN_SERVICE after lazy calibration re-evaluation against the logical clock"
    error_id: ERR_GAUGE_NOT_IN_SERVICE
    http_status: 409
    applies_to: "POST /swiss-shop/spc-samples"
  - priority: 71
    category: business_safety
    check: "when WorkOrder.lights_out_hours > 0 the acting Operator's certifications contain LIGHTS_OUT"
    error_id: ERR_OPERATOR_NOT_CERTIFIED
    http_status: 403
    applies_to: "POST /swiss-shop/work-orders/{id}/start"
  - priority: 72
    category: business_safety
    check: "the Inspector's X-User-ID differs from the work order's machinist_operator_id — the operator who ran the job may not measure it"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /swiss-shop/spc-samples"
  - priority: 74
    category: business_constraint
    check: "BarStockLot.bar_diameter_mm equals Part.bar_diameter_mm and is <= Machine.max_bar_diameter_mm"
    error_id: ERR_BAR_DIAMETER_MISMATCH
    http_status: 422
    applies_to: "POST /swiss-shop/work-orders"
  - priority: 75
    category: business_constraint
    check: "BarStockLot.alloy_code equals Part.alloy_code"
    error_id: ERR_ALLOY_MISMATCH
    http_status: 422
    applies_to: "POST /swiss-shop/work-orders"
  - priority: 76
    category: business_constraint
    check: "when lights_out_hours > 0 both Part.lights_out_eligible and Machine.lights_out_certified are true"
    error_id: ERR_LIGHTS_OUT_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /swiss-shop/work-orders"
  - priority: 78
    category: business_temporal
    check: "the candidate half-open window does not intersect any non-cancelled window on the same machine after the conditional changeover buffer is appended, per calculations.machine_window_occupancy"
    error_id: ERR_MACHINE_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /swiss-shop/work-orders"
  - priority: 80
    category: business_constraint
    check: "the count of non-cancelled closed staging intervals intersecting the candidate on the same bar lot, plus one, does not exceed BarStockLot.feeder_slots, per calculations.bar_lot_feeder_occupancy"
    error_id: ERR_BAR_LOT_FEEDER_CONFLICT
    http_status: 409
    applies_to: "POST /swiss-shop/work-orders"
  - priority: 81
    category: business_constraint
    check: "len(measurements) equals Characteristic.subgroup_size"
    error_id: ERR_SUBGROUP_SIZE_MISMATCH
    http_status: 422
    applies_to: "POST /swiss-shop/spc-samples"
  - priority: 85
    category: business_referential
    check: "Characteristic.part_id equals the work order's part_id"
    error_id: ERR_CHARACTERISTIC_PART_MISMATCH
    http_status: 422
    applies_to: "POST /swiss-shop/spc-samples"
  - priority: 86
    category: business_referential
    check: "Gauge.gauge_type equals Characteristic.required_gauge_type"
    error_id: ERR_GAUGE_TYPE_MISMATCH
    http_status: 422
    applies_to: "POST /swiss-shop/spc-samples"
  - priority: 87
    category: business_referential
    check: "when predecessor_step_id is supplied, that RoutingStep belongs to the same work_order_id and its sequence is strictly less than the new step's sequence"
    error_id: ERR_PREDECESSOR_STEP_INVALID
    http_status: 422
    applies_to: "POST /swiss-shop/routing-steps"
  - priority: 90
    category: business_fiscal
    check: "the requested release qty is <= BlanketPO.remaining_qty"
    error_id: ERR_PO_QTY_EXCEEDED
    http_status: 409
    applies_to: "POST /swiss-shop/kanban-releases"
  - priority: 91
    category: business_fiscal
    check: "qty_ordered plus the qty_ordered of every non-cancelled sibling work order on the release is <= KanbanRelease.qty"
    error_id: ERR_RELEASE_QTY_EXCEEDED
    http_status: 409
    applies_to: "POST /swiss-shop/work-orders"
  - priority: 92
    category: business_fiscal
    check: "bars_reserved * BarStockLot.bar_length_mm is <= BarStockLot.available_length_mm, per calculations.bar_length_ledger"
    error_id: ERR_BAR_STOCK_INSUFFICIENT
    http_status: 409
    applies_to: "POST /swiss-shop/work-orders"
  - priority: 95
    category: business_safety
    check: "for every Characteristic of the part the subgroup count reaches ceil(qty_ordered / sample_freq_pieces), per calculations.spc_sampling_requirement"
    error_id: ERR_SPC_SAMPLING_INCOMPLETE
    http_status: 409
    applies_to: "POST /swiss-shop/work-orders/{id}/disposition with decision ACCEPT"
  - priority: 96
    category: business_safety
    check: "the long-term ppk of every characteristic with two or more subgroups is >= PPK_MIN_ACCEPT"
    error_id: ERR_CAPABILITY_BELOW_MINIMUM
    http_status: 409
    applies_to: "POST /swiss-shop/work-orders/{id}/disposition with decision ACCEPT"
  - priority: 97
    category: business_constraint
    check: "qty_good + qty_scrap is <= WorkOrder.qty_ordered"
    error_id: ERR_QTY_EXCEEDS_ORDERED
    http_status: 422
    applies_to: "POST /swiss-shop/work-orders/{id}/complete-machining"
  - priority: 98
    category: business_constraint
    check: "unique-key collisions: Part.part_number, Machine.asset_tag, Gauge.gauge_code, BarStockLot.heat_number, Operator.badge_code, Characteristic.char_code within part, ToolAssignment.station within machine, RoutingStep.sequence within work order"
    error_id: ERR_DUPLICATE_KEY
    http_status: 409
    applies_to: "POST /swiss-shop/operators, POST /swiss-shop/machines, POST /swiss-shop/parts, POST /swiss-shop/characteristics, POST /swiss-shop/gauges, POST /swiss-shop/bar-stock-lots, POST /swiss-shop/tool-assignments, POST /swiss-shop/routing-steps"

endpoints:
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock. Before the first call the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to real wall-clock time."
    roles: [ShopPlanner, QualityManager]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["re-evaluates Gauge lazy calibration state on the next read of each gauge"]

  - method: POST
    path: "/swiss-shop/operators"
    description: "Registers a shop-floor operator."
    roles: [ShopPlanner]
    code: 201
    input: [name, badge_code, "certifications?", "status?"]
    output: Operator
    side_effects: []
  - method: GET
    path: "/swiss-shop/operators/{id}"
    description: "Reads one operator."
    roles: [ShopPlanner, Machinist, Inspector, QualityManager]
    code: 200
    input: []
    output: Operator
    side_effects: []

  - method: POST
    path: "/swiss-shop/machines"
    description: "Registers a Swiss lathe."
    roles: [ShopPlanner]
    code: 201
    input: [asset_tag, max_bar_diameter_mm, "model?", "lights_out_certified?"]
    output: Machine
    side_effects: ["machine starts AVAILABLE with empty chip and coolant accrual"]
  - method: GET
    path: "/swiss-shop/machines/{id}"
    description: "Reads one machine including its live status, version and reclamation accrual."
    roles: [ShopPlanner, Machinist, Inspector, QualityManager]
    code: 200
    input: []
    output: Machine
    side_effects: []
  - method: POST
    path: "/swiss-shop/machines/{id}/restore"
    description: "Returns a DOWN machine to AVAILABLE once every held tool station has been indexed or retired."
    roles: [Machinist]
    code: 200
    input: []
    output: Machine
    side_effects: ["Machine DOWN -> AVAILABLE", "increments Machine.version by 1"]
  - method: POST
    path: "/swiss-shop/machines/{id}/reclaim"
    description: "Settles the machine's accrued swarf and coolant make-up into a net reclamation credit and zeroes both accrual buckets."
    roles: [ShopPlanner]
    code: 200
    input: [collected_at]
    output: Machine
    side_effects:
      - "runs calculations.reclamation_credit"
      - "writes last_reclamation_credit_cents and adds it to lifetime_reclamation_credit_cents"
      - "clears chip_accrual_by_alloy and sets coolant_makeup_liters to 0"
      - "increments Machine.version by 1"

  - method: POST
    path: "/swiss-shop/parts"
    description: "Creates a part master record."
    roles: [ShopPlanner]
    code: 201
    input: [part_number, alloy_code, bar_diameter_mm, cut_off_length_mm, cycle_time_sec, setup_hours, material_cost_cents_per_meter, finished_mass_g, "lights_out_eligible?", "secondary_required?", "secondary_minutes_per_piece?"]
    output: Part
    side_effects: ["observed_avg_cycle_time_sec starts null and observed_accepted_qty starts 0"]
  - method: GET
    path: "/swiss-shop/parts/{id}"
    description: "Reads one part including its observed cycle-time rollup."
    roles: [ShopPlanner, Machinist, Inspector, QualityManager]
    code: 200
    input: []
    output: Part
    side_effects: []

  - method: POST
    path: "/swiss-shop/characteristics"
    description: "Adds an inspected print characteristic to a part."
    roles: [ShopPlanner]
    code: 201
    input: [part_id, char_code, nominal, usl, lsl, sample_freq_pieces, required_gauge_type, "cpk_min?", "subgroup_size?"]
    output: Characteristic
    side_effects: ["raises required_sample_count for every future work order on the part"]
  - method: GET
    path: "/swiss-shop/characteristics/{id}"
    description: "Reads one characteristic."
    roles: [ShopPlanner, Machinist, Inspector, QualityManager]
    code: 200
    input: []
    output: Characteristic
    side_effects: []
  - method: GET
    path: "/swiss-shop/characteristics"
    description: "Lists characteristics, optionally filtered to one part."
    roles: [ShopPlanner, Machinist, Inspector, QualityManager]
    code: 200
    input: ["part_id?", "limit?", "offset?"]
    output: Characteristic[]
    side_effects: []

  - method: POST
    path: "/swiss-shop/gauges"
    description: "Registers a gauge with its current calibration window and gauge R&R result."
    roles: [QualityManager]
    code: 201
    input: [gauge_code, gauge_type, calibrated_at, calibration_due_at, grr_pct]
    output: Gauge
    side_effects: ["status is IN_SERVICE when grr_pct <= 10 and calibration_due_at is after the logical clock, GRR_FAILED when 10 < grr_pct <= 30, RETIRED when grr_pct > 30"]
  - method: GET
    path: "/swiss-shop/gauges/{id}"
    description: "Reads one gauge, lazily re-evaluating IN_SERVICE -> CALIBRATION_DUE against the logical clock."
    roles: [ShopPlanner, Machinist, Inspector, QualityManager]
    code: 200
    input: []
    output: Gauge
    side_effects: ["may transition Gauge IN_SERVICE -> CALIBRATION_DUE"]
  - method: POST
    path: "/swiss-shop/gauges/{id}/calibrations"
    description: "Records a calibration and gauge R&R study, returning the gauge to service or failing/retiring it."
    roles: [QualityManager]
    code: 200
    input: [calibrated_at, calibration_due_at, grr_pct]
    output: Gauge
    side_effects: ["overwrites the calibration window and grr_pct", "increments calibration_count by 1", "moves Gauge between IN_SERVICE, GRR_FAILED and RETIRED per the posted grr_pct"]

  - method: POST
    path: "/swiss-shop/bar-stock-lots"
    description: "Receives a bar stock lot into inventory."
    roles: [ShopPlanner]
    code: 201
    input: [heat_number, alloy_code, bar_diameter_mm, bar_length_mm, bars_received, mass_kg_per_meter, "feeder_slots?"]
    output: BarStockLot
    side_effects: ["sets total_length_mm and available_length_mm to bars_received * bar_length_mm with reserved and consumed at 0"]
  - method: GET
    path: "/swiss-shop/bar-stock-lots/{id}"
    description: "Reads one bar stock lot including its three-bucket length ledger."
    roles: [ShopPlanner, Machinist, Inspector, QualityManager]
    code: 200
    input: []
    output: BarStockLot
    side_effects: []
  - method: POST
    path: "/swiss-shop/bar-stock-lots/{id}/certify"
    description: "Records the mill certificate for a lot; the literal certificate_number QUARANTINE quarantines the lot instead."
    roles: [QualityManager]
    code: 200
    input: [certificate_number]
    output: BarStockLot
    side_effects: ["BarStockLot RECEIVED -> CERTIFIED, or RECEIVED -> QUARANTINED for the QUARANTINE sentinel"]

  - method: POST
    path: "/swiss-shop/quotes"
    description: "Opens a DRAFT quote for a part and lot quantity."
    roles: [ShopPlanner]
    code: 201
    input: [part_id, customer_code, lot_qty, "requested_lights_out_hours?"]
    output: Quote
    side_effects: []
  - method: GET
    path: "/swiss-shop/quotes/{id}"
    description: "Reads one quote including every pricing field."
    roles: [ShopPlanner, Machinist, Inspector, QualityManager]
    code: 200
    input: []
    output: Quote
    side_effects: []
  - method: GET
    path: "/swiss-shop/quotes"
    description: "Lists quotes, optionally filtered to one part."
    roles: [ShopPlanner, Machinist, Inspector, QualityManager]
    code: 200
    input: ["part_id?", "limit?", "offset?"]
    output: Quote[]
    side_effects: []
  - method: POST
    path: "/swiss-shop/quotes/{id}/price"
    description: "Prices the quote on the requested costing basis; may be re-run on a PRICED quote to switch bases."
    roles: [ShopPlanner]
    code: 200
    input: [costing_basis]
    output: Quote
    side_effects: ["runs calculations.quote_pricing", "Quote DRAFT -> PRICED or PRICED -> PRICED", "overwrites costing_basis, cycle_time_used_sec, effective_qty, the four cost components, quoted_lot_cost_cents and quoted_unit_price_cents"]
  - method: POST
    path: "/swiss-shop/quotes/{id}/accept"
    description: "Accepts a priced quote and cuts the blanket purchase order it becomes."
    roles: [ShopPlanner]
    code: 201
    input: [customer_po_number, total_committed_qty, expires_on]
    output: BlanketPO
    side_effects: ["Quote PRICED -> ACCEPTED", "creates one BlanketPO in status ACTIVE", "runs calculations.blanket_po_rebate", "sets remaining_qty to total_committed_qty with open_released_qty and fulfilled_qty at 0"]

  - method: GET
    path: "/swiss-shop/blanket-pos/{id}"
    description: "Reads one blanket order including its three-bucket quantity ledger and version."
    roles: [ShopPlanner, Machinist, Inspector, QualityManager]
    code: 200
    input: []
    output: BlanketPO
    side_effects: []
  - method: GET
    path: "/swiss-shop/blanket-pos"
    description: "Lists blanket orders, optionally filtered by originating quote or part."
    roles: [ShopPlanner, Machinist, Inspector, QualityManager]
    code: 200
    input: ["quote_id?", "part_id?", "limit?", "offset?"]
    output: BlanketPO[]
    side_effects: []
  - method: POST
    path: "/swiss-shop/blanket-pos/{id}/suspend"
    description: "Suspends a blanket order so no further kanban release may be cut against it."
    roles: [ShopPlanner]
    code: 200
    input: [reason]
    output: BlanketPO
    side_effects: ["BlanketPO ACTIVE -> SUSPENDED", "records suspension_reason", "increments BlanketPO.version by 1"]
  - method: POST
    path: "/swiss-shop/blanket-pos/{id}/reinstate"
    description: "Returns a suspended blanket order to ACTIVE."
    roles: [ShopPlanner]
    code: 200
    input: []
    output: BlanketPO
    side_effects: ["BlanketPO SUSPENDED -> ACTIVE", "clears suspension_reason", "increments BlanketPO.version by 1"]

  - method: POST
    path: "/swiss-shop/kanban-releases"
    description: "Cuts a kanban release against a blanket order, drawing pieces from remaining_qty into open_released_qty."
    roles: [ShopPlanner]
    code: 201
    input: [blanket_po_id, qty, due_at, expected_blanket_po_version]
    output: KanbanRelease
    side_effects: ["runs calculations.po_quantity_ledger draw", "BlanketPO.remaining_qty -= qty and open_released_qty += qty", "increments BlanketPO.version by 1"]
  - method: GET
    path: "/swiss-shop/kanban-releases/{id}"
    description: "Reads one kanban release."
    roles: [ShopPlanner, Machinist, Inspector, QualityManager]
    code: 200
    input: []
    output: KanbanRelease
    side_effects: []
  - method: GET
    path: "/swiss-shop/kanban-releases"
    description: "Lists kanban releases, optionally filtered to one blanket order."
    roles: [ShopPlanner, Machinist, Inspector, QualityManager]
    code: 200
    input: ["blanket_po_id?", "limit?", "offset?"]
    output: KanbanRelease[]
    side_effects: []
  - method: POST
    path: "/swiss-shop/kanban-releases/{id}/short-close"
    description: "Short-closes a release, returning its entire quantity to the blanket order's remaining pool."
    roles: [ShopPlanner]
    code: 200
    input: [reason]
    output: KanbanRelease
    side_effects: ["KanbanRelease RELEASED or IN_PRODUCTION -> SHORT_CLOSED", "compensating move of calculations.po_quantity_ledger: open_released_qty -= qty and remaining_qty += qty", "increments BlanketPO.version by 1"]

  - method: POST
    path: "/swiss-shop/tool-assignments"
    description: "Loads a tool into a machine station."
    roles: [ShopPlanner]
    code: 201
    input: [machine_id, station, tool_code, expected_life_pieces, "drift_limit_um?"]
    output: ToolAssignment
    side_effects: ["station starts IN_SERVICE with both accumulators at 0", "Machine.version is NOT incremented"]
  - method: GET
    path: "/swiss-shop/tool-assignments/{id}"
    description: "Reads one tool station."
    roles: [ShopPlanner, Machinist, Inspector, QualityManager]
    code: 200
    input: []
    output: ToolAssignment
    side_effects: []
  - method: GET
    path: "/swiss-shop/tool-assignments"
    description: "Lists tool stations, optionally filtered to one machine."
    roles: [ShopPlanner, Machinist, Inspector, QualityManager]
    code: 200
    input: ["machine_id?", "limit?", "offset?"]
    output: ToolAssignment[]
    side_effects: []
  - method: POST
    path: "/swiss-shop/tool-assignments/{id}/offset-logs"
    description: "Logs pieces produced and the measured offset correction on a station, re-deriving its wear state."
    roles: [Machinist]
    code: 200
    input: [pieces_produced, measured_drift_um]
    output: ToolAssignment
    side_effects:
      - "runs calculations.tool_wear_state"
      - "hop 1: ToolAssignment IN_SERVICE -> LIFE_EXPIRED or IN_SERVICE -> OFFSET_HOLD"
      - "hop 2: the station's Machine moves to DOWN and Machine.version is incremented by 1"
      - "hop 3: the WorkOrder RUNNING on that machine moves to INTERRUPTED and Machine.current_work_order_id is cleared"
      - "hop 4: that WorkOrder's PENDING RoutingSteps move to BLOCKED"
  - method: POST
    path: "/swiss-shop/tool-assignments/{id}/index"
    description: "Indexes or retires a held tool station, resetting its life and drift accumulators."
    roles: [Machinist]
    code: 200
    input: ["new_tool_code?", "retire?"]
    output: ToolAssignment
    side_effects: ["ToolAssignment OFFSET_HOLD or LIFE_EXPIRED -> IN_SERVICE, or -> RETIRED when retire is true", "resets pieces_since_index, cumulative_drift_um and offset_log_count to 0", "does NOT restore the Machine"]

  - method: POST
    path: "/swiss-shop/work-orders"
    description: "Schedules a work order against a kanban release, a machine window and a staged bar lot."
    roles: [ShopPlanner]
    code: 201
    input: [release_id, machine_id, bar_lot_id, qty_ordered, scheduled_start_at, scheduled_end_at, expected_machine_version, "lights_out_hours?"]
    output: WorkOrder
    side_effects:
      - "copies part_id from the release's BlanketPO"
      - "runs calculations.machine_window_occupancy and calculations.bar_lot_feeder_occupancy"
      - "runs calculations.bar_length_ledger reserve: BarStockLot.available_length_mm -= reserved_length_mm and reserved_length_mm += reserved_length_mm"
      - "increments Machine.version by 1"
  - method: GET
    path: "/swiss-shop/work-orders/{id}"
    description: "Reads one work order including both state dimensions."
    roles: [ShopPlanner, Machinist, Inspector, QualityManager]
    code: 200
    input: []
    output: WorkOrder
    side_effects: []
  - method: GET
    path: "/swiss-shop/work-orders"
    description: "Lists work orders filtered by any combination of release, machine, bar lot, part, machinist and machining status."
    roles: [ShopPlanner, Machinist, Inspector, QualityManager]
    code: 200
    input: ["release_id?", "machine_id?", "bar_lot_id?", "part_id?", "machinist_operator_id?", "machining_status?", "limit?", "offset?"]
    output: WorkOrder[]
    side_effects: []
  - method: POST
    path: "/swiss-shop/work-orders/{id}/start"
    description: "Starts or restarts machining; the acting Machinist becomes the work order's machinist_operator_id."
    roles: [Machinist]
    code: 200
    input: []
    output: WorkOrder
    side_effects:
      - "WorkOrder.machining_status SCHEDULED -> RUNNING or INTERRUPTED -> RUNNING"
      - "sets machinist_operator_id from X-User-ID"
      - "Machine AVAILABLE -> RUNNING, sets current_work_order_id, increments Machine.version by 1"
      - "KanbanRelease RELEASED -> IN_PRODUCTION"
      - "on a restart, BLOCKED RoutingSteps of this work order return to PENDING"
  - method: POST
    path: "/swiss-shop/work-orders/{id}/complete-machining"
    description: "Reports good and scrap counts plus actual spindle seconds and closes the production dimension."
    roles: [Machinist]
    code: 200
    input: [qty_good, qty_scrap, actual_run_seconds]
    output: WorkOrder
    side_effects:
      - "WorkOrder.machining_status RUNNING -> MACHINING_COMPLETE"
      - "runs calculations.bar_length_ledger consume: reserved_length_mm -> consumed_length_mm on the BarStockLot"
      - "runs calculations.chip_and_coolant_accrual and adds the result to Machine.chip_accrual_by_alloy and Machine.coolant_makeup_liters"
      - "Machine RUNNING -> AVAILABLE, clears current_work_order_id, increments Machine.version by 1"
      - "quality_status is left exactly as it was"
  - method: POST
    path: "/swiss-shop/work-orders/{id}/cancel"
    description: "Cancels a scheduled or interrupted work order and returns its reserved bar length to the lot."
    roles: [ShopPlanner]
    code: 200
    input: [reason]
    output: WorkOrder
    side_effects:
      - "WorkOrder.machining_status SCHEDULED or INTERRUPTED -> CANCELLED"
      - "compensating move of calculations.bar_length_ledger: reserved_length_mm -> available_length_mm, leaving consumed_length_mm untouched"
      - "the machine and bar-lot windows are released for reuse"
      - "RoutingSteps of the work order move to BLOCKED with blocked_reason WORK_ORDER_CANCELLED"
  - method: POST
    path: "/swiss-shop/work-orders/{id}/disposition"
    description: "Records the quality verdict: ACCEPT, REJECT or RELEASE_HOLD."
    roles: [QualityManager]
    code: 200
    input: [decision, "note?"]
    output: WorkOrder
    side_effects:
      - "decision ACCEPT: quality_status IN_SPC -> ACCEPTED, then hop 1 KanbanRelease -> FULFILLED, hop 2 BlanketPO ledger recompute with version += 1, hop 3 BlanketPO -> EXHAUSTED when remaining_qty and open_released_qty are both 0, hop 4 Quote ACCEPTED -> CONSUMED"
      - "decision ACCEPT also recomputes Part.observed_avg_cycle_time_sec and Part.observed_accepted_qty"
      - "decision REJECT: quality_status -> REJECTED, KanbanRelease -> SHORT_CLOSED, BlanketPO open_released_qty -> remaining_qty with version += 1"
      - "decision RELEASE_HOLD: quality_status QUALITY_HOLD -> IN_SPC with no sibling changes"
  - method: GET
    path: "/swiss-shop/work-orders/{id}/quality-summary"
    description: "Computed read of the work order's SPC coverage and both capability variants."
    roles: [ShopPlanner, Machinist, Inspector, QualityManager]
    code: 200
    input: ["characteristic_id?"]
    output: { work_order_id: string, characteristic_count: integer, sample_count: integer, required_sample_count: integer, out_of_spec_count: integer, cpk_short_term_min: number, ppk_long_term_min: number }
    side_effects: ["runs calculations.spc_sampling_requirement and calculations.capability_index variant ppk_long_term"]

  - method: POST
    path: "/swiss-shop/spc-samples"
    description: "Posts one measured subgroup against a work order and characteristic."
    roles: [Inspector]
    code: 201
    input: [work_order_id, characteristic_id, gauge_id, piece_index, measurements]
    output: SpcSample
    side_effects:
      - "runs calculations.capability_index variant cpk_short_term and writes mean, range, sigma_within, cpk_short_term, out_of_spec_count and disposition"
      - "sets inspector_operator_id from X-User-ID"
      - "WorkOrder.quality_status PENDING_INSPECTION -> IN_SPC on an ACCEPT subgroup, or -> QUALITY_HOLD on a MARGINAL or REJECT subgroup"
      - "a REJECT subgroup additionally sends the work order's Machine to DOWN and increments Machine.version by 1"
  - method: GET
    path: "/swiss-shop/spc-samples/{id}"
    description: "Reads one subgroup with its computed statistics."
    roles: [ShopPlanner, Machinist, Inspector, QualityManager]
    code: 200
    input: []
    output: SpcSample
    side_effects: []
  - method: GET
    path: "/swiss-shop/spc-samples"
    description: "Lists subgroups filtered by work order, characteristic, gauge or inspector."
    roles: [ShopPlanner, Machinist, Inspector, QualityManager]
    code: 200
    input: ["work_order_id?", "characteristic_id?", "gauge_id?", "inspector_operator_id?", "limit?", "offset?"]
    output: SpcSample[]
    side_effects: []

  - method: POST
    path: "/swiss-shop/routing-steps"
    description: "Adds a secondary routing step (deburr, wash, plating and so on) to a work order."
    roles: [ShopPlanner]
    code: 201
    input: [work_order_id, sequence, operation, "predecessor_step_id?"]
    output: RoutingStep
    side_effects: ["step starts PENDING"]
  - method: GET
    path: "/swiss-shop/routing-steps/{id}"
    description: "Reads one routing step."
    roles: [ShopPlanner, Machinist, Inspector, QualityManager]
    code: 200
    input: []
    output: RoutingStep
    side_effects: []
  - method: GET
    path: "/swiss-shop/routing-steps"
    description: "Lists routing steps filtered by work order or by predecessor step."
    roles: [ShopPlanner, Machinist, Inspector, QualityManager]
    code: 200
    input: ["work_order_id?", "predecessor_step_id?", "limit?", "offset?"]
    output: RoutingStep[]
    side_effects: []
  - method: POST
    path: "/swiss-shop/routing-steps/{id}/advance"
    description: "Advances a routing step to IN_PROGRESS or COMPLETE."
    roles: [Machinist]
    code: 200
    input: [to_status]
    output: RoutingStep
    side_effects: ["RoutingStep PENDING -> IN_PROGRESS or IN_PROGRESS -> COMPLETE"]

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of ShopPlanner, Machinist, Inspector, QualityManager"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "the acting role is not listed for the endpoint in the §1.5 table"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, wrong type, illegal enum member, scheduled_end_at not strictly after scheduled_start_at, or pagination outside limit 1..100 / offset >= 0"
  - id: ERR_DUPLICATE_KEY
    http: 409
    condition: "a declared unique key collides — part_number, asset_tag, gauge_code, heat_number, badge_code, char_code within part, station within machine, or sequence within work order"
  - id: ERR_OPERATOR_NOT_FOUND
    http: 404
    condition: "the operator id in the path, or the X-User-ID of a Machinist or Inspector call, names no ACTIVE Operator"
  - id: ERR_MACHINE_NOT_FOUND
    http: 404
    condition: "machine_id in the path or body names no Machine"
  - id: ERR_PART_NOT_FOUND
    http: 404
    condition: "part_id in the path or body names no Part"
  - id: ERR_CHARACTERISTIC_NOT_FOUND
    http: 404
    condition: "characteristic_id in the path or body names no Characteristic"
  - id: ERR_GAUGE_NOT_FOUND
    http: 404
    condition: "gauge_id in the path or body names no Gauge"
  - id: ERR_BAR_LOT_NOT_FOUND
    http: 404
    condition: "bar_lot_id in the path or body names no BarStockLot"
  - id: ERR_QUOTE_NOT_FOUND
    http: 404
    condition: "quote id in the path names no Quote"
  - id: ERR_BLANKET_PO_NOT_FOUND
    http: 404
    condition: "blanket_po_id in the path or body names no BlanketPO"
  - id: ERR_RELEASE_NOT_FOUND
    http: 404
    condition: "release_id in the path or body names no KanbanRelease"
  - id: ERR_WORK_ORDER_NOT_FOUND
    http: 404
    condition: "work_order_id in the path or body names no WorkOrder"
  - id: ERR_TOOL_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "tool assignment id in the path names no ToolAssignment"
  - id: ERR_SPC_SAMPLE_NOT_FOUND
    http: 404
    condition: "spc sample id in the path names no SpcSample"
  - id: ERR_ROUTING_STEP_NOT_FOUND
    http: 404
    condition: "routing step id in the path or predecessor_step_id in the body names no RoutingStep"
  - id: ERR_STALE_PO_VERSION
    http: 412
    condition: "expected_blanket_po_version does not equal the blanket order's current version"
  - id: ERR_STALE_MACHINE_VERSION
    http: 412
    condition: "expected_machine_version does not equal the machine's current version"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "the requested transition is not declared from the target's current state in §1.2"
  - id: ERR_PO_NOT_ACTIVE
    http: 409
    condition: "the blanket order is SUSPENDED, EXHAUSTED or EXPIRED when a release or work order is attempted against it"
  - id: ERR_PO_EXPIRED
    http: 409
    condition: "the logical clock is at or after BlanketPO.expires_on when a release is cut"
  - id: ERR_MACHINE_NOT_AVAILABLE
    http: 409
    condition: "the machine is RUNNING or DOWN when a work order start is attempted"
  - id: ERR_BAR_LOT_NOT_CERTIFIED
    http: 409
    condition: "the bar stock lot is RECEIVED, QUARANTINED or DEPLETED when a work order start is attempted"
  - id: ERR_TOOL_LIFE_EXPIRED
    http: 409
    condition: "a tool station on the machine is OFFSET_HOLD or LIFE_EXPIRED when a start or a machine restore is attempted"
  - id: ERR_GAUGE_NOT_IN_SERVICE
    http: 409
    condition: "the gauge is CALIBRATION_DUE, GRR_FAILED or RETIRED when a subgroup is posted"
  - id: ERR_OPERATOR_NOT_CERTIFIED
    http: 403
    condition: "a lights-out work order is started by an operator whose certifications do not contain LIGHTS_OUT"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the Inspector posting a subgroup is the same Operator recorded as the work order's machinist_operator_id"
  - id: ERR_BAR_DIAMETER_MISMATCH
    http: 422
    condition: "the lot's bar diameter differs from the part's, or exceeds the machine's max_bar_diameter_mm"
  - id: ERR_ALLOY_MISMATCH
    http: 422
    condition: "the lot's alloy_code differs from the part's alloy_code"
  - id: ERR_LIGHTS_OUT_NOT_PERMITTED
    http: 422
    condition: "lights_out_hours > 0 while the part is not lights_out_eligible or the machine is not lights_out_certified"
  - id: ERR_MACHINE_WINDOW_CONFLICT
    http: 409
    condition: "the candidate half-open window intersects an existing buffered window on the same machine"
  - id: ERR_BAR_LOT_FEEDER_CONFLICT
    http: 409
    condition: "the candidate closed staging interval pushes the bar lot's intersecting-job count past feeder_slots"
  - id: ERR_SUBGROUP_SIZE_MISMATCH
    http: 422
    condition: "the posted measurements array length differs from the characteristic's subgroup_size"
  - id: ERR_CHARACTERISTIC_PART_MISMATCH
    http: 422
    condition: "the characteristic belongs to a different part than the work order"
  - id: ERR_GAUGE_TYPE_MISMATCH
    http: 422
    condition: "the gauge's gauge_type differs from the characteristic's required_gauge_type"
  - id: ERR_PREDECESSOR_STEP_INVALID
    http: 422
    condition: "predecessor_step_id names a step on another work order or one whose sequence is not strictly lower"
  - id: ERR_PO_QTY_EXCEEDED
    http: 409
    condition: "the requested release qty exceeds BlanketPO.remaining_qty"
  - id: ERR_RELEASE_QTY_EXCEEDED
    http: 409
    condition: "qty_ordered plus the non-cancelled siblings on the release exceeds KanbanRelease.qty"
  - id: ERR_BAR_STOCK_INSUFFICIENT
    http: 409
    condition: "the whole bars the job needs exceed BarStockLot.available_length_mm"
  - id: ERR_QTY_EXCEEDS_ORDERED
    http: 422
    condition: "qty_good + qty_scrap exceeds WorkOrder.qty_ordered at machining completion"
  - id: ERR_SPC_SAMPLING_INCOMPLETE
    http: 409
    condition: "an ACCEPT disposition is attempted before every characteristic has reached its required subgroup count"
  - id: ERR_CAPABILITY_BELOW_MINIMUM
    http: 409
    condition: "an ACCEPT disposition is attempted while a characteristic's long-term ppk is below PPK_MIN_ACCEPT"

roles:
  - name: ShopPlanner
    description: "Owns the commercial and scheduling surface: masters, quoting, blanket orders, kanban releases, work order scheduling, cancellation, routing definition and reclamation settlement."
    identity: "opaque"
    exclusive_operations:
      - "POST /swiss-shop/operators"
      - "POST /swiss-shop/machines"
      - "POST /swiss-shop/machines/{id}/reclaim"
      - "POST /swiss-shop/parts"
      - "POST /swiss-shop/characteristics"
      - "POST /swiss-shop/bar-stock-lots"
      - "POST /swiss-shop/quotes"
      - "POST /swiss-shop/quotes/{id}/price"
      - "POST /swiss-shop/quotes/{id}/accept"
      - "POST /swiss-shop/blanket-pos/{id}/suspend"
      - "POST /swiss-shop/blanket-pos/{id}/reinstate"
      - "POST /swiss-shop/kanban-releases"
      - "POST /swiss-shop/kanban-releases/{id}/short-close"
      - "POST /swiss-shop/tool-assignments"
      - "POST /swiss-shop/work-orders"
      - "POST /swiss-shop/work-orders/{id}/cancel"
      - "POST /swiss-shop/routing-steps"
    shared_operations:
      - "POST /_clock/set_current_utc (shared with QualityManager)"
      - "every GET endpoint"
  - name: Machinist
    description: "Runs the spindle. Starts and completes machining, logs tool offsets, indexes and retires tool stations, restores machines and advances secondary routing steps."
    identity: "entity_backed:Operator"
    exclusive_operations:
      - "POST /swiss-shop/work-orders/{id}/start"
      - "POST /swiss-shop/work-orders/{id}/complete-machining"
      - "POST /swiss-shop/tool-assignments/{id}/offset-logs"
      - "POST /swiss-shop/tool-assignments/{id}/index"
      - "POST /swiss-shop/machines/{id}/restore"
      - "POST /swiss-shop/routing-steps/{id}/advance"
    shared_operations:
      - "every GET endpoint"
  - name: Inspector
    description: "Measures product. Posts SPC subgroups. Segregation of duties: an Inspector may never measure a work order they themselves ran as Machinist."
    identity: "entity_backed:Operator"
    exclusive_operations:
      - "POST /swiss-shop/spc-samples"
    shared_operations:
      - "every GET endpoint"
  - name: QualityManager
    description: "Owns the compliance surface: gauge registration and calibration/R&R linkage, bar lot certification and the final quality disposition of a work order."
    identity: "opaque"
    exclusive_operations:
      - "POST /swiss-shop/gauges"
      - "POST /swiss-shop/gauges/{id}/calibrations"
      - "POST /swiss-shop/bar-stock-lots/{id}/certify"
      - "POST /swiss-shop/work-orders/{id}/disposition"
    shared_operations:
      - "POST /_clock/set_current_utc (shared with ShopPlanner)"
      - "every GET endpoint"
