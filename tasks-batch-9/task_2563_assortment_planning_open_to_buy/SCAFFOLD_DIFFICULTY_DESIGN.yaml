              payload: {}
              as: CategoryBuyer
              captures: { m1_v: $.data.version }
          trigger:
            - call: "POST /otb/receipt-commitments"
              payload: { plan_month_id: "${m3_id}", assortment_item_id: "${item_x}", vendor_id: "${vendor_id}", units: 13000, unit_cost_cents: 1400, ship_window_start: "2027-03-05T00:00:00Z", ship_window_end: "2027-03-19T00:00:00Z", expected_plan_month_version: "${m3_v}" }
              as: CategoryBuyer
              as_user_id: "buyer-1"
              captures: { state_error: $.data.error_id }
            - call: "POST /otb/receipt-commitments"
              payload: { plan_month_id: "${m1_id}", assortment_item_id: "${item_x}", vendor_id: "${vendor_id}", units: 13000, unit_cost_cents: 1400, ship_window_start: "2027-03-05T00:00:00Z", ship_window_end: "2027-03-19T00:00:00Z", expected_plan_month_version: "${m1_v}" }
              as: CategoryBuyer
              as_user_id: "buyer-1"
              captures: { constraint_error: $.data.error_id }
            - call: "POST /otb/receipt-commitments"
              payload: { plan_month_id: "${m1_id}", assortment_item_id: "${item_x}", vendor_id: "${vendor_id}", units: 12000, unit_cost_cents: 1400, ship_window_start: "2027-03-05T00:00:00Z", ship_window_end: "2027-03-19T00:00:00Z", expected_plan_month_version: "${m1_v}" }
              as: CategoryBuyer
              as_user_id: "buyer-1"
              captures: { rc_ok: $.data.id }
          assert:
            - "setup precondition: ${m3_status} == DRAFT with PlanMonth.${m3_id}.otb_planned_cents == 0 and otb_open_cents == 0 - a month added after the approval is not retro-locked, while PlanMonth.${m1_id}.status == LOCKED_PLAN with otb_open_cents == 18200000"
            - "the first probe violates THREE rules at once: M3 is DRAFT rather than LOCKED_PLAN or IN_SEASON (priority 10), 0 loaded units + 13000 candidate units exceed weekly_unit_capacity 12000 (priority 31), and cost 18200000 (13000 * 1400) exceeds M3's otb_open_cents 0 (priority 37)"
            - "the first probe returns HTTP 409 with ${state_error} == ERR_PLAN_MONTH_NOT_OPEN, not ERR_VENDOR_CAPACITY_EXCEEDED and not ERR_OTB_EXCEEDED"
            - "the second probe changes only plan_month_id and the version literal: M1 is LOCKED_PLAN so priority 10 passes, and cost 18200000 is exactly equal to M1's otb_open_cents 18200000 so priority 37 passes too, leaving the capacity rule as the only violation - it returns HTTP 409 with ${constraint_error} == ERR_VENDOR_CAPACITY_EXCEEDED"
            - "${state_error} != ${constraint_error}, and both are 409, so an implementation that maps this conflict by status code cannot pass"
            - "neither rejected probe wrote anything: PlanMonth.${m1_id}.version is still ${m1_v} and PlanMonth.${m3_id}.version is still ${m3_v}, which is why the third probe can reuse ${m1_v}"
            - "the third probe shaves the units to exactly the vendor's weekly_unit_capacity: 0 + 12000 == 12000 is accepted (the rule rejects only a strict excess) and the category open-unit check 0 + 12000 <= 40000 passes, so it returns HTTP 201 with ReceiptCommitment.${rc_ok}.units == 12000, cost_cents == 16800000, commit_status == PROPOSED"
            - "after the third probe: PlanMonth.${m1_id}.otb_open_cents == 18200000 still, because a PROPOSED commitment reserves vendor capacity but not OTB dollars"

  - rule_id: boundary_precision_check
    instances:
      - name: otb_open_exact_cent_boundary_on_commitment_create
        grounds:
          - validations[priority=37].ERR_OTB_EXCEEDED
          - calculations.plan_month_open_to_buy
          - endpoints[POST /otb/receipt-commitments]
          - entities.PlanMonth.fields.otb_open_cents
        distinguishing_aspect: |
          Metric: MONEY IN INTEGER CENTS, on POST /otb/receipt-commitments. The tested boundary is
          PlanMonth.otb_open_cents exactly: a candidate cost one cent above the open balance is
          rejected, a cost exactly equal to it is accepted, and once the balance has been consumed a
          candidate of one single cent is rejected. There is no tolerance, no rounding and no
          percentage buffer anywhere near this comparison, and the probes are placed at
          balance + 1, balance - 1, balance and 0 + 1.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "the canonical spine with CategoryPlan SPRING 2027 APPROVED, PlanMonth M1 LOCKED_PLAN with otb_planned_cents == otb_open_cents == 18,200,000 and M2 LOCKED_PLAN with 21,970,000"
            - "Vendor Cinder Sample Co CIND with lead_time_days 45, weekly_unit_capacity 500, min_order_units 1, cancel_cutoff_days 0, AUTHORIZED, with an ACTIVE DRSS authorization for 500 open units - a sample vendor that will accept a one-unit order, so unit count never limits the probes"
            - "one CARRYOVER AssortmentItem S1 on OP1 supplied by Cinder"
          setup_api_calls:
            - call: "POST /otb/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: MerchOpsAdmin
            - call: "POST /otb/departments"
              payload: { name: "Womens Apparel", code: "WAPP", fiscal_year: 2027, sales_target_cents: 500000000, margin_target_bps: 5600, turn_target_x100: 320 }
              as: MerchOpsAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /otb/categories"
              payload: { department_id: "${dept_id}", name: "Dresses", code: "DRSS", role: "DESTINATION", sales_share_bps: 3000 }
              as: MerchOpsAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /otb/store-clusters"
              payload: { name: "Cold-A", climate_zone: "COLD", demographic_index_bps: 10500, volume_tier: "A", store_count: 40, sales_index_bps: 11500 }
              as: MerchOpsAdmin
              captures: { cluster_id: $.data.id }
            - call: "POST /otb/vendors"
              payload: { name: "Cinder Sample Co", code: "CIND", lead_time_days: 45, weekly_unit_capacity: 500, min_order_units: 1, cancel_cutoff_days: 0 }
              as: MerchOpsAdmin
              captures: { vendor_id: $.data.id }
            - call: "POST /otb/vendors/${vendor_id}/status"
              payload: { status: "AUTHORIZED" }
              as: MerchOpsAdmin
            - call: "POST /otb/vendor-authorizations"
              payload: { vendor_id: "${vendor_id}", category_id: "${cat_id}", max_open_units: 500 }
              as: MerchOpsAdmin
            - call: "POST /otb/category-plans"
              payload: { category_id: "${cat_id}", season_code: "SPRING", fiscal_year: 2027, planned_sales_cents: 150000000, planned_margin_bps: 5500, planned_turn_x100: 320 }
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { plan_id: $.data.id }
            - call: "POST /otb/plan-months"
              payload: { category_plan_id: "${plan_id}", month_index: 1, fiscal_month_label: "2027-03", first_receipt_date: "2027-03-05T00:00:00Z", bom_inventory_cents: 20000000, planned_sales_cents: 30000000, planned_markdown_cents: 2000000, planned_eom_cents: 22000000 }
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { m1_id: $.data.id }
            - call: "POST /otb/plan-months"
              payload: { category_plan_id: "${plan_id}", month_index: 2, fiscal_month_label: "2027-04", first_receipt_date: "2027-04-02T00:00:00Z", bom_inventory_cents: 22000000, planned_sales_cents: 36000000, planned_markdown_cents: 3000000, planned_eom_cents: 24000000 }
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { m2_id: $.data.id }
            - call: "POST /otb/option-plans"
              payload: { category_plan_id: "${plan_id}", store_cluster_id: "${cluster_id}", tier: "BETTER", breadth_target: 14, depth_units_per_option: 6, assumed_unit_cost_cents: 2400 }
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { op1_id: $.data.id }
            - call: "PUT /otb/option-plans/${op1_id}/size-curve"
              payload: { cells: [ { size_label: "OS", size_sort_order: 1, pct_bps: 10000 } ] }
              as: MerchandisePlanner
              as_user_id: "planner-1"
            - call: "POST /otb/category-plans/${plan_id}/submit"
              payload: { submission_note: "v1" }
              as: MerchandisePlanner
              as_user_id: "planner-1"
            - call: "POST /otb/category-plans/${plan_id}/approve"
              payload: { approval_note: "ok" }
              as: PlanningDirector
              as_user_id: "director-1"
            - call: "POST /otb/assortment-items"
              payload: { option_plan_id: "${op1_id}", vendor_id: "${vendor_id}", sku_code: "DRSS-SAMPLE-1", color_code: "STONE", lifecycle_stage: "CARRYOVER", unit_cost_cents: 2500, retail_price_cents: 6900, prior_season_sell_through_bps: 7100 }
              as: CategoryBuyer
              as_user_id: "buyer-1"
              captures: { item_s1: $.data.id }
            - call: "GET /otb/plan-months/${m1_id}"
              payload: {}
              as: CategoryBuyer
              captures: { m1_v1: $.data.version, m1_open_1: $.data.otb_open_cents }
          trigger:
            - call: "POST /otb/receipt-commitments"
              payload: { plan_month_id: "${m1_id}", assortment_item_id: "${item_s1}", vendor_id: "${vendor_id}", units: 1, unit_cost_cents: 18200001, ship_window_start: "2027-03-05T00:00:00Z", ship_window_end: "2027-03-19T00:00:00Z", expected_plan_month_version: "${m1_v1}" }
              as: CategoryBuyer
              as_user_id: "buyer-1"
              captures: { over_error: $.data.error_id }
            - call: "POST /otb/receipt-commitments"
              payload: { plan_month_id: "${m1_id}", assortment_item_id: "${item_s1}", vendor_id: "${vendor_id}", units: 1, unit_cost_cents: 18199999, ship_window_start: "2027-03-05T00:00:00Z", ship_window_end: "2027-03-19T00:00:00Z", expected_plan_month_version: "${m1_v1}" }
              as: CategoryBuyer
              as_user_id: "buyer-1"
              captures: { rc_under: $.data.id }
            - call: "GET /otb/plan-months/${m1_id}"
              payload: {}
              as: CategoryBuyer
              captures: { m1_v2: $.data.version }
            - call: "POST /otb/receipt-commitments"
              payload: { plan_month_id: "${m1_id}", assortment_item_id: "${item_s1}", vendor_id: "${vendor_id}", units: 1, unit_cost_cents: 18200000, ship_window_start: "2027-03-05T00:00:00Z", ship_window_end: "2027-03-19T00:00:00Z", expected_plan_month_version: "${m1_v2}" }
              as: CategoryBuyer
              as_user_id: "buyer-1"
              captures: { rc_exact: $.data.id }
            - call: "POST /otb/receipt-commitments/${rc_exact}/commit"
              payload: {}
              as: CategoryBuyer
              as_user_id: "buyer-1"
            - call: "GET /otb/plan-months/${m1_id}"
              payload: {}
              as: CategoryBuyer
              captures: { m1_v3: $.data.version, m1_open_2: $.data.otb_open_cents }
            - call: "POST /otb/receipt-commitments"
              payload: { plan_month_id: "${m1_id}", assortment_item_id: "${item_s1}", vendor_id: "${vendor_id}", units: 1, unit_cost_cents: 1, ship_window_start: "2027-03-05T00:00:00Z", ship_window_end: "2027-03-19T00:00:00Z", expected_plan_month_version: "${m1_v3}" }
              as: CategoryBuyer
              as_user_id: "buyer-1"
              captures: { one_cent_error: $.data.error_id }
          assert:
            - "baseline: ${m1_open_1} == 18200000 and PlanMonth.${m1_id}.otb_committed_cents == 0"
            - "BOUNDARY + 1: the first probe's cost_cents would be 18200001, exactly one cent above ${m1_open_1}, and it returns HTTP 422 with ${over_error} == ERR_OTB_EXCEEDED"
            - "BOUNDARY - 1: the second probe's cost 18199999 is one cent below the balance and returns HTTP 201 with ReceiptCommitment.${rc_under}.cost_cents == 18199999 and commit_status == PROPOSED"
            - "the second probe did NOT change the open balance: PlanMonth.${m1_id}.otb_open_cents == 18200000 still, because only the commit transition debits OTB - which is why the third probe can still ask for the full balance"
            - "BOUNDARY exactly: the third probe's cost 18200000 equals the open balance and returns HTTP 201 with ReceiptCommitment.${rc_exact}.cost_cents == 18200000 and open_cost_cents == 18200000"
            - "after committing ${rc_exact}: PlanMonth.${m1_id}.otb_committed_cents == 18200000 and ${m1_open_2} == 0, and the identity 0 + 18200000 + 0 == 18200000 holds"
            - "ZERO BOUNDARY: the fourth probe asks for one single cent (units 1 at unit_cost_cents 1) against an open balance of 0 and returns HTTP 422 with ${one_cent_error} == ERR_OTB_EXCEEDED - the rule is a strict > comparison against the balance, so even a one-cent buy is refused"
            - "the fourth probe is not pre-empted by the posture rule: CategoryPlan.${plan_id}.open_ratio_bps == 5469 (M1 open 0 plus M2 open 21970000 over planned 40170000) and otb_posture == OPEN, so priority 16 is satisfied and priority 37 is genuinely the failing rule"
            - "every probe stayed inside the vendor's limits, so priority 30 and 31 never fire: units are 1 each, min_order_units is 1, and the live PROPOSED plus COMMITTED unit load on Cinder never exceeds 3 against weekly_unit_capacity 500 and max_open_units 500"
            - "the two rejected probes wrote nothing: PlanMonth.${m1_id}.version equals ${m1_v3} after the fourth probe, and GET /otb/receipt-commitments filtered to plan_month_id ${m1_id} returns exactly two rows, ${rc_under} and ${rc_exact}"

      - name: variance_bps_breach_watch_boundary_on_actuals_post
        grounds:
          - calculations.variance_verdict
          - calculations.otb_posture
          - endpoints[POST /otb/actuals-posts]
          - entities.CategoryPlan.fields.sales_variance_bps
          - state_machines.CategoryPlan.APPROVED_to_REFORECAST_OPEN
        distinguishing_aspect: |
          A different metric on a different endpoint: BASIS POINTS on POST /otb/actuals-posts, at the
          inclusive VARIANCE_BREACH_UNDER_BPS edge of -1000. Two structurally identical plans receive
          one week of actuals each, differing by 750 cents of sales out of 6,750,000. That difference
          moves sales_variance_bps from exactly -1000 to exactly -999, which flips variance_status
          from BREACH to WATCH, flips otb_posture from FROZEN (breach override) to OPEN, and decides
          whether an automatic VARIANCE_BREACH reforecast cycle is opened at all. The edge is
          inclusive: -1000 is BREACH, not WATCH.
