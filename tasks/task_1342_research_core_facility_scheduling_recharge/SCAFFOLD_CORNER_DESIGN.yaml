  # ===========================================================================
  # Section 8 — cross_cutting_layers
  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_booking_reschedule_stale
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[booking-reschedule-stale-booking]"
          - "validations[priority=5]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "Reschedule #1 (version 2 -> 3, window 09:00-11:00, estimate recomputed to 24000) succeeds; reschedule #2 carrying the pre-#1 version is rejected 412 even though its target state would otherwise be valid."
        test_recipe:
          setup: ["canonical stack; b1 APPROVED 2026-09-01 09:00-10:30 (booking version 2 after approval, encumbrance 18000)"]
          setup_api_calls:
            - { call: "POST /users", payload: { full_name: "Rita Rao", email: "r1@uni.edu", affiliation: "INTERNAL", is_pi: true }, as: FacilityAdmin, as_user_id: "admin-1", captures: { u1: $.data.id } }
            - { call: "POST /instruments", payload: { name: "NMR-600", model: "Bruker AV600", location: "Lab 1", requires_training: true, booking_buffer_minutes: 30, min_booking_minutes: 30, max_booking_minutes: 480, cancellation_free_notice_hours: 24, late_cancel_penalty_pct: 0.5, no_show_penalty_pct: 1.0 }, as: FacilityAdmin, as_user_id: "admin-1", captures: { i1: $.data.id } }
            - { call: "POST /training-records", payload: { user_id: "${u1}", instrument_id: "${i1}" }, as: CoreStaff, as_user_id: "staff-1", captures: { t1: $.data.id } }
            - { call: "POST /training-records/${t1}/certify", payload: {}, as: CoreStaff, as_user_id: "staff-1" }
            - { call: "POST /fiscal-years", payload: { fiscal_year: 2026 }, as: FinanceOfficer, as_user_id: "fin-1" }
            - { call: "POST /rate-sets", payload: { fiscal_year: 2026, effective_from: "2026-08-01T00:00:00Z", lines: [ { instrument_id: "${i1}", internal_rate_cents_per_hour: 12000, external_rate_cents_per_hour: 18000, billing_increment_minutes: 15, min_charge_minutes: 30, projected_billable_hours: 500, break_even_waiver_reason: null } ] }, as: FacilityAdmin, as_user_id: "admin-1", captures: { rs26: $.data.id } }
            - { call: "POST /rate-sets/${rs26}/submit", payload: {}, as: FacilityAdmin, as_user_id: "admin-1" }
            - { call: "POST /rate-sets/${rs26}/approve", payload: {}, as: FinanceOfficer, as_user_id: "fin-1" }
            - { call: "POST /rate-sets/${rs26}/activate", payload: {}, as: FinanceOfficer, as_user_id: "fin-1" }
            - { call: "POST /grants", payload: { grant_code: "NIH-1", pi_user_id: "${u1}", title: "Ion channels", budget_total_cents: 100000, start_date: "2026-01-01", end_date: "2026-12-31" }, as: FinanceOfficer, as_user_id: "fin-1", captures: { g1: $.data.id } }
            - { call: "POST /bookings", payload: { user_id: "${u1}", instrument_id: "${i1}", grant_id: "${g1}", start_at: "2026-09-01T09:00:00Z", end_at: "2026-09-01T10:30:00Z", priority: "STANDARD" }, as: Researcher, as_user_id: "${u1}", captures: { b1: $.data.id } }
            - { call: "POST /bookings/${b1}/approve", payload: {}, as: CoreStaff, as_user_id: "staff-1", captures: { bv: $.data.version } }
          trigger:
            - { call: "POST /bookings/${b1}/reschedule", payload: { expected_booking_version: "${bv}", start_at: "2026-09-01T09:00:00Z", end_at: "2026-09-01T11:00:00Z" }, as: Researcher, as_user_id: "${u1}", captures: { v2: $.data.version, est2: $.data.estimated_charge_cents } }
            - { call: "POST /bookings/${b1}/reschedule", payload: { expected_booking_version: "${bv}", start_at: "2026-09-02T09:00:00Z", end_at: "2026-09-02T11:00:00Z" }, as: Researcher, as_user_id: "${u1}", captures: { err: $.data.error_id } }
            - { call: "GET /grants/${g1}", payload: {}, as: FinanceOfficer, as_user_id: "fin-1", captures: { enc: $.data.budget_encumbered_cents } }
          assert:
            - "First reschedule: version == 3 (2 at approval + 1), estimated_charge_cents == 24000 (120 min x 200), encumbrance adjusted to 24000"
            - "Second reschedule with the stale version: error_id == ERR_STALE_VERSION with HTTP 412; no fields change"
            - "Grant.${g1}.budget_encumbered_cents == 24000 (exactly one reschedule applied)"

      - name: occ_grant_amend_stale
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[grant-amend-stale-grant]"
          - "validations[priority=5]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "Two sequential legitimate budget amendments: the first (version 1 -> 2) succeeds; the second carrying the original version is rejected 412 — only the stale view fails, not any state precondition."
        test_recipe:
          setup: ["u1 PI; grant g1 created (version 1)"]
          setup_api_calls:
            - { call: "POST /users", payload: { full_name: "Rita Rao", email: "r1@uni.edu", affiliation: "INTERNAL", is_pi: true }, as: FacilityAdmin, as_user_id: "admin-1", captures: { u1: $.data.id } }
            - { call: "POST /grants", payload: { grant_code: "NIH-1", pi_user_id: "${u1}", title: "Ion channels", budget_total_cents: 100000, start_date: "2026-01-01", end_date: "2026-12-31" }, as: FinanceOfficer, as_user_id: "fin-1", captures: { g1: $.data.id, gv: $.data.version } }
          trigger:
            - { call: "PUT /grants/${g1}", payload: { expected_grant_version: "${gv}", budget_total_cents: 120000 }, as: FinanceOfficer, as_user_id: "fin-1", captures: { v2: $.data.version, tot: $.data.budget_total_cents } }
            - { call: "PUT /grants/${g1}", payload: { expected_grant_version: "${gv}", budget_total_cents: 150000 }, as: FinanceOfficer, as_user_id: "fin-1", captures: { err: $.data.error_id } }
          assert:
            - "First amendment: version == 2, budget_total_cents == 120000"
            - "Second amendment with stale version: error_id == ERR_STALE_VERSION with HTTP 412; total stays 120000"

