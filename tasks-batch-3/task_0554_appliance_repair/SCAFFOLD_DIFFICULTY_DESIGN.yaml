  - rule_id: cross_entity_state_dependency
    instances:
      - name: schedule_blocked_by_appliance_recall
        grounds:
          - state_machines.ServiceRequest.INTAKE_to_SCHEDULED
          - entities.Appliance.fields.recall_status
          - errors[ERR_SAFETY_RECALL_HOLD]
        distinguishing_aspect: "Pair ServiceRequest→Appliance: a fresh INTAKE request cannot advance to SCHEDULED because its Appliance.recall_status is RECALLED (an ACTIVE recall matches brand+model)."
