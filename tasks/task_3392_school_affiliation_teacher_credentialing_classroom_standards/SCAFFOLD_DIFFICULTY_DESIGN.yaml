              captures: { cred_id: $.data.id }
            - call: "POST /society/pd-events"
              payload: { title: "CE 18", provider_name: "Society", start_at: "2027-01-31T09:00:00Z", end_at: "2027-02-01T17:00:00Z", ce_hours: 18 }
              as: SocietyAdmin
              captures: { e1_id: $.data.id }
            - call: "POST /society/pd-events"
              payload: { title: "CE 12", provider_name: "Society", start_at: "2027-02-27T09:00:00Z", end_at: "2027-03-01T17:00:00Z", ce_hours: 12 }
              as: SocietyAdmin
              captures: { e2_id: $.data.id }
            - call: "POST /society/_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-02T00:00:00Z" }
              as: SocietyAdmin
            - call: "POST /society/pd-events/${e1_id}/attendance"
              payload: { credential_id: "${cred_id}" }
              as: SocietyAdmin
            - call: "POST /society/pd-events/${e2_id}/attendance"
              payload: { credential_id: "${cred_id}" }
              as: SocietyAdmin
              captures: { ce2_id: $.data.id }
            - call: "GET /society/credentials/${cred_id}"
              payload: {}
              as: Registrar
              captures: { cache_pre: $.data.ce_hours_cycle_credited }
          trigger:
            - call: "POST /society/ce-entries/${ce2_id}/void"
              payload: {}
              as: SocietyAdmin
            - call: "GET /society/credentials/${cred_id}"
              payload: {}
              as: Registrar
              captures: { cache_post: $.data.ce_hours_cycle_credited }
            - call: "GET /society/ce-entries"
              payload: { credential_id: "${cred_id}", status: "ACTIVE" }
              as: Registrar
              captures: { active_hours: "$.data[0].hours" }
            - call: "POST /society/pd-events/${e2_id}/attendance"
              payload: { credential_id: "${cred_id}" }
              as: SocietyAdmin
            - call: "GET /society/credentials/${cred_id}"
              payload: {}
              as: Registrar
              captures: { cache_final: $.data.ce_hours_cycle_credited }
          assert:
            - "cache_pre == 30.0 (18 + 12)"
            - "after void: cache_post == 18.0 and the only ACTIVE entry carries active_hours == 18.0 — cache == ledger sum, no drift"
            - "re-attending E2 after the void succeeds (void released the uniqueness slot) and cache_final == 30.0"
            - "CECreditEntry.${ce2_id}.status == VOID (compensating entry preserved, not deleted)"

      - name: classroom_transfer_conserves_school_enrollment
        grounds:
          - calculations.transfer_conservation
          - entities.School.fields.total_enrollment
          - errors.ERR_TRANSFER_EXCEEDS_ENROLLMENT
        distinguishing_aspect: "Conserved quantity = school.total_enrollment: a transfer of exactly the source classroom's full enrollment (boundary: 40 of 40) leaves the source at 0, and a subsequent partial reverse transfer of 15 keeps the school's total at exactly 50 across both mutations."
        test_recipe:
          setup:
            - "School T with classrooms A (enrolled 40) and B (enrolled 10), both EARLY_CHILDHOOD."
          setup_api_calls:
            - *clk_start
            - *cat_create
            - *cat_activate
            - call: "POST /society/schools"
              payload: { name: "T School", display_name: "T Schoolhouse", uses_method_name: false, contact_email: "t@x.org" }
              as: SocietyAdmin
              captures: { t_id: $.data.id }
            - call: "POST /society/classrooms"
              payload: { school_id: "${t_id}", name: "CA", age_level: "EARLY_CHILDHOOD", declared_age_span_years: 3, enrolled_student_count: 40, assistant_count: 2 }
              as: SchoolAdmin
              as_user_id: "${t_id}"
              captures: { ca_id: $.data.id }
            - call: "POST /society/classrooms"
              payload: { school_id: "${t_id}", name: "CB", age_level: "EARLY_CHILDHOOD", declared_age_span_years: 3, enrolled_student_count: 10, assistant_count: 1 }
              as: SchoolAdmin
              as_user_id: "${t_id}"
              captures: { cb_id: $.data.id }
            - call: "GET /society/schools/${t_id}"
              payload: {}
              as: SocietyAdmin
              captures: { total_pre: $.data.total_enrollment }
          trigger:
            - call: "POST /society/classrooms/${ca_id}/transfer-students"
              payload: { to_classroom_id: "${cb_id}", student_count: 40 }
              as: SchoolAdmin
              as_user_id: "${t_id}"
              captures: { tr1_from: "$.data.from_enrolled_student_count", tr1_to: "$.data.to_enrolled_student_count", tr1_total: "$.data.school_total_enrollment" }
            - call: "POST /society/classrooms/${cb_id}/transfer-students"
              payload: { to_classroom_id: "${ca_id}", student_count: 15 }
              as: SchoolAdmin
              as_user_id: "${t_id}"
              captures: { tr2_from: "$.data.from_enrolled_student_count", tr2_to: "$.data.to_enrolled_student_count", tr2_total: "$.data.school_total_enrollment" }
            - call: "GET /society/schools/${t_id}"
              payload: {}
              as: SocietyAdmin
              captures: { total_post: $.data.total_enrollment }
          assert:
            - "total_pre == 50"
            - "transfer of exactly 40 (== source enrollment) is allowed: tr1_from == 0 and tr1_to == 50 with tr1_total == 50"
            - "reverse transfer: tr2_from == 35 and tr2_to == 15 with tr2_total == 50"
            - "total_post == 50 — the conserved quantity is unchanged by the transfer pair"
