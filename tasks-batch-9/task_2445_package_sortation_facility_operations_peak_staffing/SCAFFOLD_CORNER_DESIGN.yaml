            - "500 packages inducted, an outbound load on L-WEST with 300 SMALL packages scanned, so L-WEST.sorted_package_count == 300"
            - "Logical clock 2026-08-03T09:00:00Z, inside every assignment window"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
