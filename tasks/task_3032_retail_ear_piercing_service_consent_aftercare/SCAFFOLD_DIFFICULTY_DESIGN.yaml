          trigger:
            - call: "POST /piercing-services/sterilization-cycles"
              payload: { store_location_id: "${store_id}", autoclave_unit_id: "AUTO-1", protocol_code: "AUTOCLAVE-B", cycle_start_at: "2026-09-01T08:45:00Z", cycle_end_at: "2026-09-01T09:30:00Z", temperature_celsius: 134.0 }
              as: SterilizationTechnician
              captures: { err: "$.data.error_id" }
          assert:
            - "the response error_id == ERR_AUTOCLAVE_CYCLE_OVERLAP with status 409"
            - "the response error_id != ERR_SLOT_OVERLAP"

  # ===========================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: cartridge_unit_balance_conserved_across_quarantine_and_release
        grounds:
          - calculations.cartridge_lot_availability
          - state_machines.CartridgeLot.AVAILABLE_to_QUARANTINED
          - state_machines.CartridgeLot.QUARANTINED_to_AVAILABLE
        distinguishing_aspect: |
          Conserved quantity: cartridge unit count. The forward action (cycle quarantine moving
          units_available into units_quarantined) paired with its compensation (cycle release moving
          them back) leaves units_available + units_consumed + units_quarantined equal to
          units_received, so no units leak in either direction.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Lot L1 with 50 units bound to cycle Y1 at store S1. Cycle Y1 is IN_PROGRESS."
          setup_api_calls:
            - call: "POST /piercing-services/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /piercing-services/jurisdictions"
              payload: { state_code: "IL", min_age_self_consent: 18, min_age_with_guardian: 6, min_age_absolute: 6, permitted_sites: ["LOBE"], requires_guardian_presence: false, record_retention_years: 7, consent_form_version: "IL-2026", sterilization_protocol_code: "AUTOCLAVE-B" }
              as: ComplianceOfficer
              captures: { jur_id: "$.data.id" }
            - call: "POST /piercing-services/stores"
              payload: { name: "Chicago Loop", jurisdiction_id: "${jur_id}", piercing_room_count: 2 }
              as: ComplianceOfficer
              captures: { store_id: "$.data.id" }
            - call: "POST /piercing-services/sterilization-cycles"
              payload: { store_location_id: "${store_id}", autoclave_unit_id: "AUTO-1", protocol_code: "AUTOCLAVE-B", cycle_start_at: "2026-08-30T08:00:00Z", cycle_end_at: "2026-08-30T08:45:00Z", temperature_celsius: 134.0 }
              as: SterilizationTechnician
              captures: { cyc_id: "$.data.id" }
            - call: "GET /piercing-services/stores/${store_id}"
              payload: { }
              as: AnyAuthenticated
              captures: { sv18: "$.data.version" }
            - call: "POST /piercing-services/cartridge-lots"
              payload: { store_location_id: "${store_id}", sterilization_cycle_id: "${cyc_id}", lot_number: "L-1", site_type: "LOBE", units_received: 50, expiration_date: "2027-01-01T00:00:00Z", expected_store_version: "${sv18}" }
              as: StoreManager
              captures: { lot_id: "$.data.id" }
            - call: "POST /piercing-services/sterilization-cycles/${cyc_id}/complete"
              payload: { temperature_celsius: 135.0, biological_indicator_passed: true }
              as: SterilizationTechnician
            - call: "POST /piercing-services/sterilization-cycles/${cyc_id}/quarantine"
              payload: { }
              as: ComplianceOfficer
          trigger:
            - call: "POST /piercing-services/sterilization-cycles/${cyc_id}/release"
              payload: { }
              as: ComplianceOfficer
          assert:
            - "CartridgeLot.${lot_id}.status == AVAILABLE"
            - "CartridgeLot.${lot_id}.units_available == 50"
            - "CartridgeLot.${lot_id}.units_quarantined == 0"
            - "CartridgeLot.${lot_id}.units_consumed == 0"
            - "CartridgeLot.${lot_id}.units_available + CartridgeLot.${lot_id}.units_consumed + CartridgeLot.${lot_id}.units_quarantined == CartridgeLot.${lot_id}.units_received"

      - name: refund_charge_balance_conserved_across_issue_and_reopen
        grounds:
          - calculations.incident_refund_allocation
          - state_machines.IncidentReport.RESOLVED_to_REFUND_ISSUED
