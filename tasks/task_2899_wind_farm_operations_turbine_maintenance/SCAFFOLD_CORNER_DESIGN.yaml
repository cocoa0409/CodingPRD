              captures: { co_b: $.data.id }
          assert:
            - "the settlement retry with the pre-approval version returns HTTP 412 with ${err_farm} == ERR_STALE_FARM_VERSION"
            - "the curtailment create with the pre-sync version returns HTTP 412 with ${err_turbine} == ERR_STALE_TURBINE_VERSION, a different code for the other rule"
            - "${farm_v_fresh} is greater than ${farm_v_seen} and ${t_v_fresh} is greater than ${t_v_seen}, so both parents' versions advanced on their business writes"
            - "after the two refusals GET /wind-ops/landowner-settlements filtered by wind_farm_id returns total_count 1 and GET /wind-ops/curtailment-orders filtered by turbine_id returns total_count 0"
            - "both retries with the freshly read versions succeed: LandownerSettlement.${ls_b}.state == DRAFT and CurtailmentOrder.${co_b}.state == PENDING"
            - "the payloads of the refused and the accepted attempts are identical apart from the expected version field"
      - name: remote_reset_counter_rolls_over_at_exactly_twenty_four_hours
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.remote_reset_eligibility
          - entities.Turbine.fields.remote_reset_count_24h
          - entities.Turbine.fields.reset_window_start_utc
        distinguishing_aspect: |
          The rolling window is bookkept BEFORE the quota comparison and its edge is inclusive: an
          attempt one second short of 24 hours still accumulates onto the old window, while an attempt
          at exactly the 24 hour mark restarts the window and resets the counter to 1 rather than 0 -
          the reset attempt that triggered the roll is itself counted.
        test_recipe:
          setup:
            - "one turbine and one RESETTABLE rule that permits two remote resets per 24 hours"
          setup_api_calls:
            - call: "POST /wind-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SiteAdmin
              as_user_id: "admin-1"
            - call: "POST /wind-ops/farms"
              payload: { name: "Elk Basin", region_code: "MT-E", grid_operator_code: "NWMT", road_levy_pct: 2.5, community_levy_pct: 1.5, landowner_budget_cap_cents: 500000000 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { farm_id: $.data.id }
            - call: "POST /wind-ops/turbine-models"
