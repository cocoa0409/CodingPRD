  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_temporal_on_cancelled_group_revision
        grounds:
          - validations[priority=8]
          - validations[priority=20]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_DATE_RANGE_INVALID]
        distinguishing_aspect: |
          Category pair state vs business_temporal: a revision creation against a
          CANCELLED group whose payload also carries an inverted date range
          (checkout_at before checkin_at) fails with ERR_INVALID_STATE
          (priority 8), never ERR_DATE_RANGE_INVALID (priority 20).
        test_recipe:
          setup:
            - "Building B TURN_ACTIVE, room R1 (3 beds); group G with 2 participants, CANCELLED from DRAFT (fee 0)"
