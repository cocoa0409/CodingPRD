      - name: freight_rounding_residual_is_absorbed_by_the_first_assigned_order
        claim_type: precision
        grounds:
          - calculations.freight_load_allocation
          - entities.DealerOrder.allocated_freight_cents
          - entities.DealerOrder.freight_sequence
        distinguishing_aspect: "Three identical kits on one STEP_DECK give each order the same independently rounded share of 76565 cents, whose sum 229695 overshoots linehaul_cost_cents 229694 by one cent. The residual is NEGATIVE one and is applied with its sign to the single order whose freight_sequence is 1, so that order alone reports 76564 while the other two report 76565. An implementation that clamps the residual at zero, spreads it, or hands it to the last order breaks the declared invariant that the shares re-sum to linehaul_cost_cents exactly. The load itself pins the STEP_DECK constants: max_cube_m3 74.0, max_weight_kg 22500 and LINEHAUL_BASE_CENTS 172000."
        test_recipe:
          setup:
            - "Jurisdiction NE-WEST, GrainProfile CORN, CoatingSpec G115, engineer PE-1001, Dealer Alpha with staging_slots 2."
            - "BinDesign D1 (12.0 m x 9.6 m, ASD)."
            - "Three DealerOrders on D1, all OFFSEASON / NONE / GRAVITY, so each has kit_weight_kg 6410.4 and kit_cube_m3 18.45."
            - "The dealer version is re-read immediately before the load create because order creation moves the dealer credit ledger."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { code: "NE-WEST", name: "Nebraska West", seal_required: false, min_design_wind_speed_mph: 95, seismic_design_category: "A", permit_review_days: 0 }
