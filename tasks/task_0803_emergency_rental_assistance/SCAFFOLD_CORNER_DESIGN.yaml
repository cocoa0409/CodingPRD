scaffold_corner_design:
  # -----------------------------------------------------------------
  # Entities
  # -----------------------------------------------------------------
  - section: entities
    instances:
      - name: create_program_returns_201_with_remaining_equals_total
        claim_type: Creation
        grounds:
          - entities.Program.fields.funding_pool_remaining_cents
          - entities.Program.fields.status
        distinguishing_aspect: "POST /programs with funding 500000 -> 201, funding_pool_remaining_cents == 500000, status == OPEN."
        test_recipe:
          setup:
            - "empty DB; logical clock at default"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-15T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /programs"
              payload: { name: "ERAP-New", funding_pool_total_cents: 500000, per_month_max_cents: 250000, monthly_income_limit_by_size: { "1": 500000 }, months_cap: 18 }
              as: ProgramAdmin
              captures: { pid: $.data.id }
          assert:
            - "trigger[0] response status_code == 201"
            - "Program.${pid}.funding_pool_remaining_cents == 500000"
            - "Program.${pid}.status == OPEN"

      - name: program_zero_funding_starts_exhausted
        claim_type: Computed Fields
        grounds:
          - entities.Program.fields.status
          - entities.Program.fields.funding_pool_remaining_cents
        distinguishing_aspect: "A program created with funding_pool_total_cents 0 initializes status == EXHAUSTED and remaining 0 (enum value closure for EXHAUSTED)."
        test_recipe:
          setup:
            - "empty DB"
          setup_api_calls: []
          trigger:
            - call: "POST /programs"
              payload: { name: "ERAP-Zero", funding_pool_total_cents: 0, per_month_max_cents: 250000, monthly_income_limit_by_size: { "1": 500000 }, months_cap: 18 }
              as: ProgramAdmin
              captures: { pid: $.data.id }
          assert:
            - "Program.${pid}.status == EXHAUSTED"
            - "Program.${pid}.funding_pool_remaining_cents == 0"

      - name: tenant_months_used_system_default_zero
        claim_type: Defaults
        grounds:
          - entities.Tenant.fields.months_used
        distinguishing_aspect: "A newly registered tenant has system field months_used == 0 regardless of input."
        test_recipe:
          setup:
            - "empty DB"
          setup_api_calls: []
          trigger:
            - call: "POST /tenants"
              payload: { full_name: "T New", email: "tn@x.com", household_size: 3 }
              as: Anonymous
              captures: { tid: $.data.id }
          assert:
            - "trigger[0] response status_code == 201"
            - "Tenant.${tid}.months_used == 0"

      - name: income_source_countable_computed_from_type
        claim_type: Computed Fields
        grounds:
          - entities.IncomeSource.fields.countable
        distinguishing_aspect: "A WAGES income source is computed countable == true; input cannot set countable directly."
        test_recipe:
          setup:
            - "an application in DRAFT state on unit U owned by landlord L"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "ERAP-IS", funding_pool_total_cents: 100000000, per_month_max_cents: 250000, monthly_income_limit_by_size: { "2": 566667 }, months_cap: 18 }
              as: ProgramAdmin
              captures: { pid: $.data.id }
            - call: "POST /tenants"
              payload: { full_name: "T Is", email: "tis@x.com", household_size: 2 }
              as: Anonymous
              captures: { tid: $.data.id }
            - call: "POST /landlords"
              payload: { legal_name: "L Is", email: "lis@x.com" }
              as: Anonymous
              captures: { lid: $.data.id }
            - call: "POST /units"
              payload: { landlord_id: "${lid}", address: "20 R St", monthly_rent_cents: 200000 }
              as: Landlord
              as_user_id: "${lid}"
              captures: { uid: $.data.id }
            - call: "POST /applications"
              payload: { program_id: "${pid}", tenant_id: "${tid}", landlord_id: "${lid}", unit_id: "${uid}", monthly_rent_cents: 200000, requested_prospective_months: 1, prospective_start_date: "2026-03-01", prospective_end_date: "2026-03-31" }
              as: Tenant
              as_user_id: "${tid}"
              captures: { aid: $.data.id }
          trigger:
            - call: "POST /applications/${aid}/income-sources"
              payload: { source_type: "WAGES", monthly_amount_cents: 400000 }
              as: Tenant
              as_user_id: "${tid}"
              captures: { isid: $.data.id }
          assert:
            - "trigger[0] response status_code == 201"
            - "IncomeSource.${isid}.countable == true"

      - name: application_not_found_returns_404
        claim_type: Not Found
        grounds:
          - errors[ERR_APPLICATION_NOT_FOUND]
        distinguishing_aspect: "GET /applications/{unknown-uuid} returns ERR_APPLICATION_NOT_FOUND with 404."
        test_recipe:
          setup:
            - "empty DB"
          setup_api_calls: []
          trigger:
            - call: "GET /applications/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: CaseWorker
              captures: { err: $.data.error_id }
          assert:
            - "trigger[0] response status_code == 404"
            - "trigger[0] response data.error_id == ERR_APPLICATION_NOT_FOUND"

      - name: create_application_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - errors[ERR_INVALID_REQUEST]
          - endpoints
        distinguishing_aspect: "POST /applications without required program_id is rejected with ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup:
            - "a tenant, landlord, and unit exist"
          setup_api_calls:
            - call: "POST /tenants"
              payload: { full_name: "T Mr", email: "tmr@x.com", household_size: 2 }
              as: Anonymous
              captures: { tid: $.data.id }
            - call: "POST /landlords"
              payload: { legal_name: "L Mr", email: "lmr@x.com" }
              as: Anonymous
              captures: { lid: $.data.id }
            - call: "POST /units"
              payload: { landlord_id: "${lid}", address: "21 S St", monthly_rent_cents: 200000 }
              as: Landlord
              as_user_id: "${lid}"
              captures: { uid: $.data.id }
          trigger:
            - call: "POST /applications"
              payload: { tenant_id: "${tid}", landlord_id: "${lid}", unit_id: "${uid}", monthly_rent_cents: 200000, requested_prospective_months: 1 }
              as: Tenant
              as_user_id: "${tid}"
              captures: { err: $.data.error_id }
          assert:
            - "trigger[0] response status_code == 400"
            - "trigger[0] response data.error_id == ERR_INVALID_REQUEST"

      - name: create_application_unit_landlord_mismatch_rejected
        claim_type: Type Constraints
        grounds:
          - validations[priority=7]
          - errors[ERR_UNIT_LANDLORD_MISMATCH]
        distinguishing_aspect: "POST /applications whose unit belongs to a different landlord than landlord_id -> ERR_UNIT_LANDLORD_MISMATCH (422)."
        test_recipe:
          setup:
            - "landlord L1 owns unit U1; a distinct landlord L2 exists"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "ERAP-MM", funding_pool_total_cents: 100000000, per_month_max_cents: 250000, monthly_income_limit_by_size: { "2": 566667 }, months_cap: 18 }
              as: ProgramAdmin
              captures: { pid: $.data.id }
            - call: "POST /tenants"
              payload: { full_name: "T Mm", email: "tmm@x.com", household_size: 2 }
              as: Anonymous
              captures: { tid: $.data.id }
            - call: "POST /landlords"
              payload: { legal_name: "L1 Mm", email: "l1mm@x.com" }
              as: Anonymous
              captures: { lid1: $.data.id }
            - call: "POST /landlords"
              payload: { legal_name: "L2 Mm", email: "l2mm@x.com" }
              as: Anonymous
              captures: { lid2: $.data.id }
            - call: "POST /units"
              payload: { landlord_id: "${lid1}", address: "22 T St", monthly_rent_cents: 200000 }
              as: Landlord
              as_user_id: "${lid1}"
              captures: { uid1: $.data.id }
          trigger:
            - call: "POST /applications"
              payload: { program_id: "${pid}", tenant_id: "${tid}", landlord_id: "${lid2}", unit_id: "${uid1}", monthly_rent_cents: 200000, requested_prospective_months: 1, prospective_start_date: "2026-03-01", prospective_end_date: "2026-03-31" }
              as: Tenant
              as_user_id: "${tid}"
              captures: { err: $.data.error_id }
          assert:
            - "trigger[0] response status_code == 422"
            - "trigger[0] response data.error_id == ERR_UNIT_LANDLORD_MISMATCH"

      - name: second_ledger_for_application_returns_already_exists
        claim_type: Parent Relationships
        grounds:
          - validations[priority=20]
          - errors[ERR_LEDGER_ALREADY_EXISTS]
        distinguishing_aspect: "A second POST /applications/{id}/ledger on an application that already has a ledger -> ERR_LEDGER_ALREADY_EXISTS (1:1)."
        test_recipe:
          setup:
            - "application with one submitted ledger already on file"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "ERAP-L2", funding_pool_total_cents: 100000000, per_month_max_cents: 250000, monthly_income_limit_by_size: { "2": 566667 }, months_cap: 18 }
              as: ProgramAdmin
              captures: { pid: $.data.id }
            - call: "POST /tenants"
              payload: { full_name: "T L2", email: "tl2@x.com", household_size: 2 }
              as: Anonymous
              captures: { tid: $.data.id }
            - call: "POST /landlords"
              payload: { legal_name: "L L2", email: "ll2@x.com" }
              as: Anonymous
              captures: { lid: $.data.id }
            - call: "POST /units"
              payload: { landlord_id: "${lid}", address: "23 U St", monthly_rent_cents: 200000 }
              as: Landlord
              as_user_id: "${lid}"
              captures: { uid: $.data.id }
            - call: "POST /applications"
              payload: { program_id: "${pid}", tenant_id: "${tid}", landlord_id: "${lid}", unit_id: "${uid}", monthly_rent_cents: 200000, requested_prospective_months: 1, prospective_start_date: "2026-03-01", prospective_end_date: "2026-03-31" }
              as: Tenant
              as_user_id: "${tid}"
              captures: { aid: $.data.id }
            - call: "POST /applications/${aid}/ledger"
              payload: { lines: [] }
              as: Landlord
              as_user_id: "${lid}"
          trigger:
            - call: "POST /applications/${aid}/ledger"
              payload: { lines: [] }
              as: Landlord
              as_user_id: "${lid}"
              captures: { err: $.data.error_id }
          assert:
            - "trigger[0] response status_code == 409"
            - "trigger[0] response data.error_id == ERR_LEDGER_ALREADY_EXISTS"

  # -----------------------------------------------------------------
  # State machines
  # -----------------------------------------------------------------
  - section: state_machines
    instances:
      - name: submit_with_incomplete_section_returns_section_incomplete
        claim_type: Precondition Enforcement
        grounds:
          - validations[priority=6]
          - state_machines.Application.DRAFT_to_SUBMITTED
          - errors[ERR_SECTION_INCOMPLETE]
        distinguishing_aspect: "Submitting while landlord_section_status is INCOMPLETE (only tenant section done) -> ERR_SECTION_INCOMPLETE."
        test_recipe:
          setup:
            - "DRAFT application; tenant section COMPLETE; landlord section still INCOMPLETE"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "ERAP-SI", funding_pool_total_cents: 100000000, per_month_max_cents: 250000, monthly_income_limit_by_size: { "2": 566667 }, months_cap: 18 }
              as: ProgramAdmin
              captures: { pid: $.data.id }
            - call: "POST /tenants"
              payload: { full_name: "T Si", email: "tsi@x.com", household_size: 2 }
              as: Anonymous
              captures: { tid: $.data.id }
            - call: "POST /landlords"
              payload: { legal_name: "L Si", email: "lsi@x.com" }
              as: Anonymous
              captures: { lid: $.data.id }
            - call: "POST /units"
              payload: { landlord_id: "${lid}", address: "24 V St", monthly_rent_cents: 200000 }
              as: Landlord
              as_user_id: "${lid}"
              captures: { uid: $.data.id }
            - call: "POST /applications"
              payload: { program_id: "${pid}", tenant_id: "${tid}", landlord_id: "${lid}", unit_id: "${uid}", monthly_rent_cents: 200000, requested_prospective_months: 1, prospective_start_date: "2026-03-01", prospective_end_date: "2026-03-31" }
              as: Tenant
              as_user_id: "${tid}"
              captures: { aid: $.data.id }
            - call: "POST /applications/${aid}/income-sources"
              payload: { source_type: "WAGES", monthly_amount_cents: 400000 }
              as: Tenant
              as_user_id: "${tid}"
            - call: "PATCH /applications/${aid}/tenant-section"
              payload: { hardship_type: "JOB_LOSS", hardship_attested: true }
              as: Tenant
              as_user_id: "${tid}"
          trigger:
            - call: "POST /applications/${aid}/submit"
              payload: {}
              as: Tenant
              as_user_id: "${tid}"
              captures: { err: $.data.error_id }
          assert:
            - "trigger[0] response status_code == 409"
            - "trigger[0] response data.error_id == ERR_SECTION_INCOMPLETE"

      - name: review_from_draft_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Application.SUBMITTED_to_UNDER_REVIEW
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "POST /applications/{id}/review on a DRAFT (not SUBMITTED) application -> ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "a DRAFT application"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "ERAP-RV", funding_pool_total_cents: 100000000, per_month_max_cents: 250000, monthly_income_limit_by_size: { "2": 566667 }, months_cap: 18 }
              as: ProgramAdmin
              captures: { pid: $.data.id }
            - call: "POST /tenants"
              payload: { full_name: "T Rv", email: "trv@x.com", household_size: 2 }
              as: Anonymous
              captures: { tid: $.data.id }
            - call: "POST /landlords"
              payload: { legal_name: "L Rv", email: "lrv@x.com" }
              as: Anonymous
              captures: { lid: $.data.id }
            - call: "POST /units"
              payload: { landlord_id: "${lid}", address: "25 W St", monthly_rent_cents: 200000 }
              as: Landlord
              as_user_id: "${lid}"
              captures: { uid: $.data.id }
            - call: "POST /applications"
              payload: { program_id: "${pid}", tenant_id: "${tid}", landlord_id: "${lid}", unit_id: "${uid}", monthly_rent_cents: 200000, requested_prospective_months: 1, prospective_start_date: "2026-03-01", prospective_end_date: "2026-03-31" }
              as: Tenant
              as_user_id: "${tid}"
              captures: { aid: $.data.id }
          trigger:
            - call: "POST /applications/${aid}/review"
              payload: {}
              as: CaseWorker
              captures: { err: $.data.error_id }
          assert:
            - "trigger[0] response status_code == 409"
            - "trigger[0] response data.error_id == ERR_INVALID_STATE"

      - name: verify_w9_from_missing_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Landlord.SUBMITTED_to_VERIFIED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "POST /landlords/{id}/w9/verify while w9_status == MISSING (never submitted) -> ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "a landlord with no W-9 submitted (w9_status MISSING)"
          setup_api_calls:
            - call: "POST /landlords"
              payload: { legal_name: "L W0", email: "lw0@x.com" }
              as: Anonymous
              captures: { lid: $.data.id }
          trigger:
            - call: "POST /landlords/${lid}/w9/verify"
              payload: { decision: "VERIFIED" }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "trigger[0] response status_code == 409"
            - "trigger[0] response data.error_id == ERR_INVALID_STATE"

      - name: recover_before_disbursement_cleared_returns_invalid_state
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.RecaptureCase.SUBSTANTIATED_to_RECOVERED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "POST /recapture-cases/{id}/recover while the targeted disbursement is still SENT (not CLEARED) -> ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Approved application; disbursement 1000000/5mo SENT (not cleared); recapture case OPEN->SUBSTANTIATED targeting it"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-15T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /programs"
              payload: { name: "ERAP-RB", funding_pool_total_cents: 100000000, per_month_max_cents: 250000, monthly_income_limit_by_size: { "2": 566667 }, months_cap: 18 }
              as: ProgramAdmin
              captures: { pid: $.data.id }
            - call: "POST /tenants"
              payload: { full_name: "T Rb", email: "trb@x.com", household_size: 2 }
              as: Anonymous
              captures: { tid: $.data.id }
            - call: "POST /landlords"
              payload: { legal_name: "L Rb", email: "lrb@x.com" }
              as: Anonymous
              captures: { lid: $.data.id }
            - call: "POST /landlords/${lid}/w9"
              payload: { tin: "21-2121212", banking_last4: "0019", mailing_address: "26 X St" }
              as: Landlord
              as_user_id: "${lid}"
            - call: "POST /landlords/${lid}/w9/verify"
              payload: { decision: "VERIFIED" }
              as: ProgramAdmin
            - call: "POST /units"
              payload: { landlord_id: "${lid}", address: "26 X St", monthly_rent_cents: 200000 }
              as: Landlord
              as_user_id: "${lid}"
              captures: { uid: $.data.id }
            - call: "POST /applications"
              payload: { program_id: "${pid}", tenant_id: "${tid}", landlord_id: "${lid}", unit_id: "${uid}", monthly_rent_cents: 200000, requested_prospective_months: 3, arrears_start_month: "2025-12", arrears_end_month: "2026-01", prospective_start_date: "2026-03-01", prospective_end_date: "2026-05-31" }
              as: Tenant
              as_user_id: "${tid}"
              captures: { aid: $.data.id }
            - call: "POST /applications/${aid}/income-sources"
              payload: { source_type: "WAGES", monthly_amount_cents: 400000 }
              as: Tenant
              as_user_id: "${tid}"
            - call: "PATCH /applications/${aid}/tenant-section"
              payload: { hardship_type: "JOB_LOSS", hardship_attested: true }
              as: Tenant
              as_user_id: "${tid}"
            - call: "POST /applications/${aid}/ledger"
              payload: { lines: [ { month: "2025-11", line_type: "CHARGE", charge_cents: 200000 }, { month: "2025-12", line_type: "CHARGE", charge_cents: 200000 }, { month: "2025-12", line_type: "PAYMENT", payment_cents: 100000 }, { month: "2026-01", line_type: "CHARGE", charge_cents: 200000 } ] }
              as: Landlord
              as_user_id: "${lid}"
            - call: "POST /applications/${aid}/ledger/verify"
              payload: { decision: "VERIFIED" }
              as: ProgramAdmin
            - call: "PATCH /applications/${aid}/landlord-section"
              payload: { ledger_confirmed: true }
              as: Landlord
              as_user_id: "${lid}"
            - call: "POST /applications/${aid}/submit"
              payload: {}
              as: Tenant
              as_user_id: "${tid}"
            - call: "POST /applications/${aid}/review"
              payload: {}
              as: CaseWorker
            - call: "POST /applications/${aid}/approve"
              payload: { decision_reason: "ok" }
              as: CaseWorker
              as_user_id: "cw-approver-rb"
              captures: { av: $.data.version }
            - call: "POST /applications/${aid}/disbursements"
              payload: { amount_cents: 1000000, months_covered: 5, coverage_kind: "COMBINED", expected_application_version: "${av}" }
              as: CaseWorker
              as_user_id: "cw-issuer-rb"
              captures: { did: $.data.id }
            - call: "POST /disbursements/${did}/send"
              payload: { payment_reference: "ACH-RB" }
              as: CaseWorker
            - call: "POST /recapture-cases"
              payload: { application_id: "${aid}", disbursement_id: "${did}", reason: "OTHER" }
              as: FraudInvestigator
              captures: { rcid: $.data.id }
            - call: "POST /recapture-cases/${rcid}/substantiate"
              payload: {}
              as: FraudInvestigator
          trigger:
            - call: "POST /recapture-cases/${rcid}/recover"
              payload: {}
              as: FraudInvestigator
              captures: { err: $.data.error_id }
          assert:
            - "trigger[0] response status_code == 409"
            - "trigger[0] response data.error_id == ERR_INVALID_STATE"

  # -----------------------------------------------------------------
  # Validations / Errors
  # -----------------------------------------------------------------
  - section: validations
    instances:
      - name: approve_without_hardship_attested_returns_error
        claim_type: Violation → Error
        grounds:
          - validations[priority=11]
          - errors[ERR_HARDSHIP_NOT_ATTESTED]
        distinguishing_aspect: "Approve with hardship_attested false (income eligible, W-9 verified, ledger verified) -> ERR_HARDSHIP_NOT_ATTESTED (422)."
        test_recipe:
          setup:
            - "Application UNDER_REVIEW; W-9 VERIFIED; ledger VERIFIED; income eligible; tenant section completed with hardship_attested false"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-15T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /programs"
              payload: { name: "ERAP-HA", funding_pool_total_cents: 100000000, per_month_max_cents: 250000, monthly_income_limit_by_size: { "2": 566667 }, months_cap: 18 }
              as: ProgramAdmin
              captures: { pid: $.data.id }
            - call: "POST /tenants"
              payload: { full_name: "T Ha", email: "tha@x.com", household_size: 2 }
              as: Anonymous
              captures: { tid: $.data.id }
            - call: "POST /landlords"
              payload: { legal_name: "L Ha", email: "lha@x.com" }
              as: Anonymous
              captures: { lid: $.data.id }
            - call: "POST /landlords/${lid}/w9"
              payload: { tin: "23-2323232", banking_last4: "0020", mailing_address: "27 Y St" }
              as: Landlord
              as_user_id: "${lid}"
            - call: "POST /landlords/${lid}/w9/verify"
              payload: { decision: "VERIFIED" }
              as: ProgramAdmin
            - call: "POST /units"
              payload: { landlord_id: "${lid}", address: "27 Y St", monthly_rent_cents: 200000 }
              as: Landlord
              as_user_id: "${lid}"
              captures: { uid: $.data.id }
            - call: "POST /applications"
              payload: { program_id: "${pid}", tenant_id: "${tid}", landlord_id: "${lid}", unit_id: "${uid}", monthly_rent_cents: 200000, requested_prospective_months: 2, prospective_start_date: "2026-03-01", prospective_end_date: "2026-04-30" }
              as: Tenant
              as_user_id: "${tid}"
              captures: { aid: $.data.id }
            - call: "POST /applications/${aid}/income-sources"
              payload: { source_type: "WAGES", monthly_amount_cents: 400000 }
              as: Tenant
              as_user_id: "${tid}"
            - call: "PATCH /applications/${aid}/tenant-section"
              payload: { hardship_type: "OTHER", hardship_attested: false }
              as: Tenant
              as_user_id: "${tid}"
            - call: "POST /applications/${aid}/ledger"
              payload: { lines: [] }
              as: Landlord
              as_user_id: "${lid}"
            - call: "POST /applications/${aid}/ledger/verify"
              payload: { decision: "VERIFIED" }
              as: ProgramAdmin
            - call: "PATCH /applications/${aid}/landlord-section"
              payload: { ledger_confirmed: true }
              as: Landlord
              as_user_id: "${lid}"
            - call: "POST /applications/${aid}/submit"
