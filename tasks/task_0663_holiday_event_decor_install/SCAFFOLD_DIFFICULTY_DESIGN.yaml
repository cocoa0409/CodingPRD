            - call: "POST /design-proposals/${proposal_id}/line-items"
              payload: { inventory_item_id: "${sku_id}", quantity: 5, unit_install_cents: 5000 }
              as: AccountManager
            - call: "POST /design-proposals/${proposal_id}/submit"
              payload: {}
              as: AccountManager
            - call: "POST /clients/${client_id}/contracts/${contract_id}/propose"
              payload: {}
              as: AccountManager
              captures: { contract_v: $.data.version }
            - call: "POST /design-proposals/${proposal_id}/accept"
              payload: { expected_contract_version: "${contract_v}" }
              as: ClientContact
              as_user_id: "${client_id}"
            - call: "POST /clients/${client_id}/contracts/${contract_id}/sign"
              payload: {}
              as: ClientContact
              as_user_id: "${client_id}"
            - call: "POST /clients/${client_id}/contracts/${contract_id}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /crews"
              payload: { crew_name: "Charlie", daily_capacity_minutes: 480, home_base_zip: "90001" }
              as: FieldSupervisor
              captures: { crew_id: $.data.id }
            - call: "POST /work-orders"
              payload: { contract_id: "${contract_id}", job_type: "TAKEDOWN" }
              as: FieldSupervisor
