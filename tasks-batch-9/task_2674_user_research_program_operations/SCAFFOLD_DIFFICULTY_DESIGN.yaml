  - rule_id: priority_pair_validation_conflict
    instances:
      - name: invite_state_closed_outranks_fiscal_budget_breach
        grounds:
          - validations[priority=23]
          - validations[priority=49]
          - calculations.incentive_reservation
        distinguishing_aspect: |
          Category pair `state` (priority 23, ERR_RECRUITMENT_CLOSED) versus `business_fiscal`
          (priority 49, ERR_INCENTIVE_BUDGET_EXCEEDED): one invite violates both at once and the
          409 state error must win over the 422 fiscal error.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z"
            - "Pool with a 6000-cent budget, contact cap 2, two POWER_USER / en-US participants"
            - "INTERVIEW study fielded with incentive_amount_cents 5000 and target_participant_count 1"
            - "Participant 1 invited (5000 reserved, 1000 available), screened in, scheduled and completed, so recruitment_status == QUOTA_MET"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ResearchOpsAdmin
              as_user_id: "u_ops_1"
