        claim_type: aggregate_validation
        grounds:
          - "§1.4 priority 12 (business_fiscal): 'Station.penalty_points_total + this filing's computed penalty_points must not exceed STATION_POINT_CEILING (5.00)' -> ERR_PENALTY_CEILING_EXCEEDED (422)"
