scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: prize_payout_cash_jackpot_vs_annuity_diverge_on_claim
        grounds:
          - calculations.prize_payout_calc
          - state_machines.PrizeClaim.ADJUDICATING_to_APPROVED_CASH
          - state_machines.PrizeClaim.ADJUDICATING_to_APPROVED_ANNUITY
          - entities.PrizeClaim.fields.gross_payout_cents
        distinguishing_aspect: |
          On the PrizeClaim domain, identical advertised gross G=1,000,000,000 yields gross_payout_cents=600,000,000
          for CASH (jackpot factor 0.60 applied) but 1,000,000,000 for ANNUITY (factor never applied) — two valid
          payout algorithms produce different numbers on the SAME ticket/claim subject.
        test_recipe:
          setup:
            - "An ACTIVE JACKPOT game (cash_option_factor 0.60, annuity_years 30) and an ACTIVE retailer+terminal."
            - "Two distinct VALIDATED_WINNER tickets on that game, each with gross_prize_cents 1,000,000,000 (>= threshold 600,000)."
            - "One claim elects CASH, the other ANNUITY; each begins-adjudication then approves with the SAME officer u-adj."
            - "Logical clock at 2026-01-05, before each ticket's claim_deadline (2026-02-09)."
          setup_api_calls:
            - call: "POST /games"
              payload: { name: "PowerDraw", game_type: "JACKPOT", claim_window_days: 30, federal_withholding_threshold_cents: 600000, cash_option_factor: 0.60, annuity_years: 30 }
              as: LotteryOfficer
              captures: { game_id: $.data.id }
            - call: "POST /retailers"
              payload: { business_name: "Corner Mart", tax_id: "TAX-1", commission_rate: 0.06, cashing_bonus_rate: 0.01 }
              as: LicensingAdmin
              captures: { ret_id: $.data.id }
            - call: "POST /retailers/${ret_id}/license/activate"
              payload: {}
              as: LicensingAdmin
            - call: "POST /terminals"
              payload: { retailer_id: "${ret_id}", serial_number: "SN-1" }
              as: LicensingAdmin
              captures: { term_id: $.data.id }
            - call: "POST /terminals/${term_id}/activate"
              payload: {}
              as: LicensingAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: LotteryOfficer
            - call: "POST /tickets"
              payload: { game_id: "${game_id}", terminal_id: "${term_id}", serial: "T-CASH", price_cents: 200, draw_date: "2026-01-10T00:00:00Z", declared_tier: 1, gross_prize_cents: 1000000000 }
              as: TerminalOperator
              captures: { tk_cash: $.data.id }
            - call: "POST /tickets"
              payload: { game_id: "${game_id}", terminal_id: "${term_id}", serial: "T-ANN", price_cents: 200, draw_date: "2026-01-10T00:00:00Z", declared_tier: 1, gross_prize_cents: 1000000000 }
              as: TerminalOperator
              captures: { tk_ann: $.data.id }
            - call: "POST /tickets/${tk_cash}/validate"
              payload: {}
              as: TerminalOperator
            - call: "POST /tickets/${tk_ann}/validate"
              payload: {}
              as: TerminalOperator
            - call: "POST /players"
              payload: { full_name: "Pat Win", government_id_number: "GID-1" }
              as: ClaimsClerk
              captures: { pl_id: $.data.id }
            - call: "POST /prize-claims"
              payload: { ticket_id: "${tk_cash}", player_id: "${pl_id}", payout_option: "CASH" }
              as: ClaimsClerk
              captures: { cl_cash: $.data.id }
            - call: "POST /prize-claims"
              payload: { ticket_id: "${tk_ann}", player_id: "${pl_id}", payout_option: "ANNUITY" }
              as: ClaimsClerk
              captures: { cl_ann: $.data.id }
            - call: "POST /prize-claims/${cl_cash}/begin-adjudication"
              payload: {}
              as: LotteryOfficer
              as_user_id: "u-adj"
            - call: "POST /prize-claims/${cl_ann}/begin-adjudication"
              payload: {}
              as: LotteryOfficer
              as_user_id: "u-adj"
          trigger:
            - call: "POST /prize-claims/${cl_cash}/approve"
              payload: {}
              as: LotteryOfficer
              as_user_id: "u-adj"
              captures: { cash_gross: $.data.gross_payout_cents }
            - call: "POST /prize-claims/${cl_ann}/approve"
              payload: {}
              as: LotteryOfficer
              as_user_id: "u-adj"
              captures: { ann_gross: $.data.gross_payout_cents }
          assert:
            - "PrizeClaim.${cl_cash}.gross_payout_cents == 600000000"
            - "PrizeClaim.${cl_ann}.gross_payout_cents == 1000000000"
            - "PrizeClaim.${cl_cash}.net_payout_cents == 426000000"
            - "PrizeClaim.${cl_ann}.net_payout_cents == 710000000"
            - "PrizeClaim.${cl_ann}.annual_installment_cents == 23666666"

      - name: settlement_net_floor_vs_gross_on_retailer_ledger
        grounds:
          - calculations.retailer_commission_settlement
          - entities.CommissionSettlement.fields.gross_commission_cents
          - entities.CommissionSettlement.fields.net_settlement_cents
          - state_machines.CommissionSettlement.DRAFT_to_FINALIZED
        distinguishing_aspect: |
          On the Retailer/CommissionSettlement domain (NOT the claim domain of the sibling instance), the gross-commission
          aggregation and the clawback-floored net are two different aggregations over the same window: gross_commission_cents=12
          but net_settlement_cents=0 because clawback (500) exceeds gross and net floors at 0.
        test_recipe:
          setup:
            - "ACTIVE retailer+terminal; commission_rate 0.06, cashing_bonus_rate 0.01."
            - "Within window [2026-03-01,2026-04-01): one plain sold ticket price 100 (tier 0) and one sold ticket price 100 carrying gross_prize 50,000 that is counter-paid (+500 bonus) then reversed (COUNTER_REVERSED), generating a 500-cent clawback."
            - "Clock set to 2026-03-15 for both sales and the counter-pay; the reversal needs no deadline."
          setup_api_calls:
            - call: "POST /games"
              payload: { name: "ScratchInstant", game_type: "INSTANT", claim_window_days: 5, federal_withholding_threshold_cents: 600000 }
              as: LotteryOfficer
              captures: { game_id: $.data.id }
            - call: "POST /retailers"
              payload: { business_name: "Quick Stop", tax_id: "TAX-2", commission_rate: 0.06, cashing_bonus_rate: 0.01 }
              as: LicensingAdmin
              captures: { ret_id: $.data.id }
            - call: "POST /retailers/${ret_id}/license/activate"
              payload: {}
              as: LicensingAdmin
            - call: "POST /terminals"
              payload: { retailer_id: "${ret_id}", serial_number: "SN-2" }
              as: LicensingAdmin
              captures: { term_id: $.data.id }
            - call: "POST /terminals/${term_id}/activate"
              payload: {}
              as: LicensingAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-15T00:00:00Z" }
              as: LotteryOfficer
            - call: "POST /tickets"
              payload: { game_id: "${game_id}", terminal_id: "${term_id}", serial: "S-SALE", price_cents: 100, draw_date: "2026-03-15T00:00:00Z", declared_tier: 0, gross_prize_cents: 0 }
              as: TerminalOperator
              captures: { tk_sale: $.data.id }
            - call: "POST /tickets"
              payload: { game_id: "${game_id}", terminal_id: "${term_id}", serial: "S-REV", price_cents: 100, draw_date: "2026-03-16T00:00:00Z", declared_tier: 2, gross_prize_cents: 50000 }
              as: TerminalOperator
              captures: { tk_rev: $.data.id }
            - call: "POST /tickets/${tk_rev}/validate"
              payload: {}
              as: TerminalOperator
            - call: "POST /tickets/${tk_rev}/reverse-counter-pay"
              payload: {}
              as: LotteryOfficer
            - call: "GET /retailers/${ret_id}"
              payload: {}
              as: LotteryOfficer
              captures: { ret_v: $.data.version }
          trigger:
            - call: "POST /commission-settlements"
              payload: { retailer_id: "${ret_id}", period_start: "2026-03-01T00:00:00Z", period_end: "2026-04-01T00:00:00Z", expected_retailer_version: "${ret_v}" }
              as: LotteryOfficer
              as_user_id: "u-prep"
              captures: { st_id: $.data.id }
          assert:
            - "CommissionSettlement.${st_id}.gross_commission_cents == 12"
            - "CommissionSettlement.${st_id}.clawback_cents == 500"
            - "CommissionSettlement.${st_id}.net_settlement_cents == 0"

  # ===========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: payout_branch_min_max_tiered_jackpot_threshold   # MODE (a)
        grounds:
          - calculations.prize_payout_calc
          - entities.DrawingGame.fields.game_type
          - entities.PrizeClaim.fields.payout_option
          - entities.DrawingGame.fields.federal_withholding_threshold_cents
        distinguishing_aspect: |
          MODE (a): the payout has >=3 inputs (game_type, payout_option, advertised G vs threshold T) with non-linear
          branch selection — factor applies only on CASH∧JACKPOT, withholding gates on G>=T not on gross_payout — so the
          output is a conditional tree, not a linear formula.
        test_recipe:
          setup:
            - "ACTIVE JACKPOT game, factor 0.60, threshold 600,000. One CASH claim on a VALIDATED_WINNER ticket gross_prize 1,000,000,000."
          setup_api_calls:
            - call: "POST /games"
              payload: { name: "MegaJackpot", game_type: "JACKPOT", claim_window_days: 30, federal_withholding_threshold_cents: 600000, cash_option_factor: 0.60, annuity_years: 30 }
              as: LotteryOfficer
              captures: { game_id: $.data.id }
            - call: "POST /retailers"
              payload: { business_name: "Mart A", tax_id: "TAX-3" }
              as: LicensingAdmin
              captures: { ret_id: $.data.id }
            - call: "POST /retailers/${ret_id}/license/activate"
              payload: {}
              as: LicensingAdmin
            - call: "POST /terminals"
              payload: { retailer_id: "${ret_id}", serial_number: "SN-3" }
              as: LicensingAdmin
              captures: { term_id: $.data.id }
            - call: "POST /terminals/${term_id}/activate"
              payload: {}
              as: LicensingAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: LotteryOfficer
            - call: "POST /tickets"
              payload: { game_id: "${game_id}", terminal_id: "${term_id}", serial: "MJ-1", price_cents: 200, draw_date: "2026-01-10T00:00:00Z", declared_tier: 1, gross_prize_cents: 1000000000 }
              as: TerminalOperator
              captures: { tk: $.data.id }
            - call: "POST /tickets/${tk}/validate"
              payload: {}
              as: TerminalOperator
            - call: "POST /players"
              payload: { full_name: "Mega Winner", government_id_number: "GID-3" }
              as: ClaimsClerk
              captures: { pl_id: $.data.id }
            - call: "POST /prize-claims"
              payload: { ticket_id: "${tk}", player_id: "${pl_id}", payout_option: "CASH" }
              as: ClaimsClerk
              captures: { cl: $.data.id }
            - call: "POST /prize-claims/${cl}/begin-adjudication"
              payload: {}
              as: LotteryOfficer
              as_user_id: "u-adj"
          trigger:
            - call: "POST /prize-claims/${cl}/approve"
              payload: {}
              as: LotteryOfficer
              as_user_id: "u-adj"
              captures: { gross: $.data.gross_payout_cents, fed: $.data.federal_withholding_cents }
          assert:
            - "PrizeClaim.${cl}.gross_payout_cents == 600000000"
            - "PrizeClaim.${cl}.federal_withholding_cents == 144000000"
            - "PrizeClaim.${cl}.state_withholding_cents == 30000000"
            - "PrizeClaim.${cl}.net_payout_cents == 426000000"

      - name: settlement_mixed_rounding_order_sum_then_round_vs_round_then_sum   # MODE (b)
        grounds:
          - calculations.retailer_commission_settlement
          - entities.CommissionSettlement.fields.gross_commission_cents
          - entities.Retailer.fields.commission_rate
          - entities.Retailer.fields.cashing_bonus_rate
        distinguishing_aspect: |
          MODE (b): nested rounding where ORDER matters and the scaffold pins it — the sales-commission half rounds ONCE on
          the summed price base (sum-then-round: 375*0.06 -> 23) while the cashing-bonus half rounds PER-TICKET then sums;
          using round-then-sum on the sales half (8+8+8=24) would yield a different cent total, proving the pinned order.
        test_recipe:
          setup:
            - "ACTIVE retailer+terminal; commission_rate 0.06, cashing_bonus_rate 0.01."
            - "Window [2026-05-01,2026-06-01): three sold tickets each price 125 (no counter-pays, no clawbacks)."
            - "Clock at 2026-05-10."
          setup_api_calls:
            - call: "POST /games"
              payload: { name: "DailyPick", game_type: "DAILY", claim_window_days: 10, federal_withholding_threshold_cents: 600000 }
              as: LotteryOfficer
              captures: { game_id: $.data.id }
            - call: "POST /retailers"
              payload: { business_name: "Mart B", tax_id: "TAX-4", commission_rate: 0.06, cashing_bonus_rate: 0.01 }
              as: LicensingAdmin
              captures: { ret_id: $.data.id }
            - call: "POST /retailers/${ret_id}/license/activate"
              payload: {}
              as: LicensingAdmin
            - call: "POST /terminals"
              payload: { retailer_id: "${ret_id}", serial_number: "SN-4" }
              as: LicensingAdmin
              captures: { term_id: $.data.id }
            - call: "POST /terminals/${term_id}/activate"
              payload: {}
              as: LicensingAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: LotteryOfficer
            - call: "POST /tickets"
              payload: { game_id: "${game_id}", terminal_id: "${term_id}", serial: "D-1", price_cents: 125, draw_date: "2026-05-10T00:00:00Z", declared_tier: 0, gross_prize_cents: 0 }
              as: TerminalOperator
            - call: "POST /tickets"
              payload: { game_id: "${game_id}", terminal_id: "${term_id}", serial: "D-2", price_cents: 125, draw_date: "2026-05-10T00:00:00Z", declared_tier: 0, gross_prize_cents: 0 }
              as: TerminalOperator
            - call: "POST /tickets"
              payload: { game_id: "${game_id}", terminal_id: "${term_id}", serial: "D-3", price_cents: 125, draw_date: "2026-05-10T00:00:00Z", declared_tier: 0, gross_prize_cents: 0 }
              as: TerminalOperator
            - call: "GET /retailers/${ret_id}"
              payload: {}
              as: LotteryOfficer
              captures: { ret_v: $.data.version }
          trigger:
            - call: "POST /commission-settlements"
              payload: { retailer_id: "${ret_id}", period_start: "2026-05-01T00:00:00Z", period_end: "2026-06-01T00:00:00Z", expected_retailer_version: "${ret_v}" }
              as: LotteryOfficer
              as_user_id: "u-prep"
              captures: { st_id: $.data.id }
          assert:
            - "CommissionSettlement.${st_id}.gross_commission_cents == 23"
            - "CommissionSettlement.${st_id}.clawback_cents == 0"
            - "CommissionSettlement.${st_id}.net_settlement_cents == 23"

  # ===========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: prizeclaim_fork_join_cash_vs_annuity_divergent_side_effects
        grounds:
          - state_machines.PrizeClaim.ADJUDICATING_to_APPROVED_CASH
          - state_machines.PrizeClaim.ADJUDICATING_to_APPROVED_ANNUITY
          - state_machines.PrizeClaim.APPROVED_ANNUITY_to_PAID
        distinguishing_aspect: |
          PrizeClaim is a branching fork from ADJUDICATING into {APPROVED_CASH, APPROVED_ANNUITY} whose side-effect sets
          differ (CASH leaves annual_installment_cents=0; ANNUITY populates it), then re-joins at PAID — a non-linear
          fork-join, distinct from the Retailer revert-cycle entity in the sibling instance.
        test_recipe:
          setup:
            - "ACTIVE JACKPOT game; a VALIDATED_WINNER ticket gross_prize 1,000,000,000; claim ANNUITY in ADJUDICATING by u-adj; clock 2026-01-05."
          setup_api_calls:
            - call: "POST /games"
              payload: { name: "ForkGame", game_type: "JACKPOT", claim_window_days: 30, federal_withholding_threshold_cents: 600000, cash_option_factor: 0.60, annuity_years: 30 }
              as: LotteryOfficer
              captures: { game_id: $.data.id }
            - call: "POST /retailers"
              payload: { business_name: "Mart C", tax_id: "TAX-5" }
              as: LicensingAdmin
              captures: { ret_id: $.data.id }
            - call: "POST /retailers/${ret_id}/license/activate"
              payload: {}
              as: LicensingAdmin
            - call: "POST /terminals"
              payload: { retailer_id: "${ret_id}", serial_number: "SN-5" }
              as: LicensingAdmin
              captures: { term_id: $.data.id }
            - call: "POST /terminals/${term_id}/activate"
              payload: {}
              as: LicensingAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: LotteryOfficer
            - call: "POST /tickets"
              payload: { game_id: "${game_id}", terminal_id: "${term_id}", serial: "FK-1", price_cents: 200, draw_date: "2026-01-10T00:00:00Z", declared_tier: 1, gross_prize_cents: 1000000000 }
              as: TerminalOperator
              captures: { tk: $.data.id }
            - call: "POST /tickets/${tk}/validate"
              payload: {}
              as: TerminalOperator
            - call: "POST /players"
              payload: { full_name: "Fork Winner", government_id_number: "GID-5" }
              as: ClaimsClerk
              captures: { pl_id: $.data.id }
            - call: "POST /prize-claims"
              payload: { ticket_id: "${tk}", player_id: "${pl_id}", payout_option: "ANNUITY" }
              as: ClaimsClerk
              captures: { cl: $.data.id }
            - call: "POST /prize-claims/${cl}/begin-adjudication"
              payload: {}
              as: LotteryOfficer
              as_user_id: "u-adj"
          trigger:
            - call: "POST /prize-claims/${cl}/approve"
              payload: {}
              as: LotteryOfficer
              as_user_id: "u-adj"
              captures: { st: $.data.status }
          assert:
            - "PrizeClaim.${cl}.status == APPROVED_ANNUITY"
            - "PrizeClaim.${cl}.annual_installment_cents == 23666666"
            - "PrizeClaim.${cl}.gross_payout_cents == 1000000000"

      - name: retailer_license_revert_cycle_active_suspended_active
        grounds:
          - state_machines.Retailer.ACTIVE_to_SUSPENDED
          - state_machines.Retailer.SUSPENDED_to_ACTIVE
          - entities.Retailer.fields.license_status
        distinguishing_aspect: |
          The Retailer license machine has a revert cycle ACTIVE -> SUSPENDED -> ACTIVE (a cycle on the Retailer entity),
          structurally distinct from the PrizeClaim fork-join in the sibling instance; license_status returns to ACTIVE
          while previously-cascaded terminals stay DEACTIVATED.
        test_recipe:
          setup:
            - "A retailer ACTIVE with one ACTIVE terminal; suspend (cascades terminal -> DEACTIVATED) then re-activate."
          setup_api_calls:
            - call: "POST /retailers"
              payload: { business_name: "Cycle Mart", tax_id: "TAX-6" }
              as: LicensingAdmin
              captures: { ret_id: $.data.id }
            - call: "POST /retailers/${ret_id}/license/activate"
              payload: {}
              as: LicensingAdmin
            - call: "POST /terminals"
              payload: { retailer_id: "${ret_id}", serial_number: "SN-6" }
              as: LicensingAdmin
              captures: { term_id: $.data.id }
            - call: "POST /terminals/${term_id}/activate"
              payload: {}
              as: LicensingAdmin
            - call: "POST /retailers/${ret_id}/license/suspend"
              payload: {}
              as: LicensingAdmin
          trigger:
            - call: "POST /retailers/${ret_id}/license/activate"
              payload: {}
              as: LicensingAdmin
              captures: { st: $.data.license_status }
          assert:
            - "Retailer.${ret_id}.license_status == ACTIVE"
            - "Terminal.${term_id}.status == DEACTIVATED"

  # ===========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: revoke_chain_retailer_terminal_then_sale_blocked   # depth >= 3 effect surface
        grounds:
          - state_machines.Retailer.ACTIVE_to_SUSPENDED
          - state_machines.Retailer.SUSPENDED_to_REVOKED
          - state_machines.Terminal.PROVISIONED_to_DEACTIVATED
          - validations[priority=16]
        distinguishing_aspect: |
          Depth-3 cascade triggered by the license REVOKE path: revoke mutates Retailer.license_status=REVOKED, which itself
          cascades each owned Terminal -> DEACTIVATED, which itself causes a subsequent POST /tickets on that terminal to be
          rejected ERR_TERMINAL_NOT_ACTIVE — each hop caused by the prior hop, originating from the suspend/revoke trigger.
        test_recipe:
          setup:
            - "Retailer ACTIVE with one ACTIVE terminal; suspend then revoke; then attempt a sale on the now-deactivated terminal."
          setup_api_calls:
            - call: "POST /games"
              payload: { name: "RevokeGame", game_type: "DAILY", claim_window_days: 10, federal_withholding_threshold_cents: 600000 }
              as: LotteryOfficer
              captures: { game_id: $.data.id }
            - call: "POST /retailers"
              payload: { business_name: "Revoke Mart", tax_id: "TAX-7" }
              as: LicensingAdmin
              captures: { ret_id: $.data.id }
            - call: "POST /retailers/${ret_id}/license/activate"
              payload: {}
              as: LicensingAdmin
            - call: "POST /terminals"
              payload: { retailer_id: "${ret_id}", serial_number: "SN-7" }
              as: LicensingAdmin
              captures: { term_id: $.data.id }
            - call: "POST /terminals/${term_id}/activate"
              payload: {}
              as: LicensingAdmin
            - call: "POST /retailers/${ret_id}/license/suspend"
              payload: {}
              as: LicensingAdmin
            - call: "POST /retailers/${ret_id}/license/revoke"
              payload: {}
              as: LicensingAdmin
          trigger:
            - call: "POST /tickets"
              payload: { game_id: "${game_id}", terminal_id: "${term_id}", serial: "RV-1", price_cents: 200, draw_date: "2026-01-10T00:00:00Z", declared_tier: 0, gross_prize_cents: 0 }
              as: TerminalOperator
              captures: { err: $.data.error_id }
          assert:
            - "Retailer.${ret_id}.license_status == REVOKED"
            - "Terminal.${term_id}.status == DEACTIVATED"
            - "HTTP status == 409 and data.error_id == ERR_TERMINAL_NOT_ACTIVE"

      - name: reject_claim_returns_ticket_then_reclaim_allowed   # depth >= 2, different trigger
        grounds:
          - state_machines.PrizeClaim.ADJUDICATING_to_REJECTED
          - state_machines.Ticket.CLAIM_PENDING_to_VALIDATED_WINNER
          - state_machines.Ticket.VALIDATED_WINNER_to_CLAIM_PENDING
        distinguishing_aspect: |
          Depth-2 compensation cascade from a DIFFERENT trigger (claim reject): rejecting the claim mutates
          PrizeClaim.status=REJECTED, which itself cascades the linked Ticket CLAIM_PENDING -> VALIDATED_WINNER, which then
          permits a brand-new prize claim against the same ticket to succeed.
        test_recipe:
          setup:
            - "A VALIDATED_WINNER ticket with a SUBMITTED->ADJUDICATING claim by u-adj; reject it, then open a new claim on the freed ticket."
          setup_api_calls:
            - call: "POST /games"
              payload: { name: "RejGame", game_type: "INSTANT", claim_window_days: 30, federal_withholding_threshold_cents: 600000 }
              as: LotteryOfficer
