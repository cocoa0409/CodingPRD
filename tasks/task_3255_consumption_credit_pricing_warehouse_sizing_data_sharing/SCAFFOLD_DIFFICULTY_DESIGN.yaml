  - rule_id: priority_pair_validation_conflict
    instances:
      - name: exhausted_allowance_vs_zero_amount_priority
        grounds:
          - validations[priority=9]
          - validations[priority=13]
          - errors[ERR_CONTRACT_CREDIT_EXHAUSTED]
          - errors[ERR_DRAWDOWN_AMOUNT_RANGE]
        distinguishing_aspect: "A drawdown whose amount breaches both the single-drawdown ceiling and the exhausted contract allowance is decided by priority 9 over priority 13, so the fiscal allowance error wins over the range error — a different error-category pair from the posture-versus-segregation conflict."
        test_recipe:
          setup:
            - "one ACTIVE contract with base_credits 1000 and no rollover, already fully drawn to remaining_credits 0"
          setup_api_calls:
            - call: "POST /v1/accounts"
              payload: { org_name: "Pri Fiscal", account_locator: "pf1001", cloud_provider: "SAME_CLOUD", region: "us-east-1", monitor_scope: "ACCOUNT_ONLY" }
              as: PlatformOperator
              captures: { acct_pf: $.data.id }
            - call: "POST /v1/warehouses"
              payload: { account_id: "${acct_pf}", name: "WH_PF", size: "SMALL", auto_suspend_seconds: 600, auto_resume: true, clusters_min: 1, clusters_max: 1, latency_slo_ms: 1000 }
              as: DataEngineer
              captures: { wh_pf: $.data.id }
            - call: "POST /v1/capacity-contracts"
              payload: { account_id: "${acct_pf}", term_start: "2026-09-01T00:00:00Z", term_end: "2026-10-01T00:00:00Z", base_credits: 1000, overage_rate_per_credit: 3.00, rollover_cap_credits: 200, currency: "USD" }
              as: FinanceController
              captures: { ct_pf: $.data.id }
            - call: "POST /v1/capacity-contracts/${ct_pf}/activate"
              payload: {}
              as: FinanceController
            - call: "GET /v1/capacity-contracts/${ct_pf}"
              payload: {}
              as: FinanceController
              captures: { ct_pf_v1: $.data.version }
            - call: "POST /v1/credit-drawdowns"
              payload: { contract_id: "${ct_pf}", warehouse_id: "${wh_pf}", amount_credits: 1000, source_kind: "SESSION", idempotency_key: "pf-1000", expected_contract_version: "${ct_pf_v1}" }
              as: DataEngineer
            - call: "GET /v1/capacity-contracts/${ct_pf}"
              payload: {}
              as: FinanceController
              captures: { ct_pf_v2: $.data.version }
          trigger:
            - call: "POST /v1/credit-drawdowns"
              payload: { contract_id: "${ct_pf}", warehouse_id: "${wh_pf}", amount_credits: 4000, source_kind: "SESSION", idempotency_key: "pf-bad", expected_contract_version: "${ct_pf_v2}" }
              as: DataEngineer
              captures: { err_pf: $.data.error_id }
          assert:
            - "${err_pf} == ERR_CONTRACT_CREDIT_EXHAUSTED"
            - "the same request would also raise ERR_DRAWDOWN_AMOUNT_RANGE on the 1000-credit ceiling, so priority 9 over priority 13 is what selects the reported error"
            - "CapacityContract.${ct_pf}.drawn_credits == 1000.0 and no second drawdown was created"
      - name: draining_account_vs_rule_conflict_on_close
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - errors[ERR_ACCOUNT_DRAINING]
          - errors[ERR_ROLE_CONFLICT]
        distinguishing_aspect: "A close attempted by the activating operator against a DRAINING account violates both the fiscal posture rule and the fiscal segregation rule, and priority 7 selects ERR_ACCOUNT_DRAINING — a fiscal-versus-fiscal pairing distinct from the allowance-versus-range instance."
        test_recipe:
          setup:
            - "one ACTIVE contract activated by operator fin-sod-1, on an account driven to DRAINING"
          setup_api_calls:
            - call: "POST /v1/accounts"
