            - { call: "POST /substitutes", payload: { full_name: "Sub A", base_daily_rate_cents: 20000 }, as: DistrictAdmin, captures: { subA: $.data.id } }
            - { call: "POST /qualifications", payload: { substitute_id: "${subA}", subject: "MATH", grade_band: "HIGH" }, as: DistrictAdmin }
            - { call: "POST /clearances", payload: { substitute_id: "${subA}", clearance_type: "BACKGROUND_CHECK", expires_on: "2027-12-31" }, as: DistrictAdmin, captures: { clr1: $.data.id } }
            - { call: "POST /clearances/${clr1}/verify", payload: {}, as: DistrictAdmin }
            - { call: "POST /clearances", payload: { substitute_id: "${subA}", clearance_type: "TEACHING_CREDENTIAL", expires_on: "2027-12-31" }, as: DistrictAdmin, captures: { clr2: $.data.id } }
            - { call: "POST /clearances/${clr2}/verify", payload: {}, as: DistrictAdmin }
            - { call: "POST /substitutes/${subA}/activate", payload: {}, as: DistrictAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-29T00:00:00Z" }, as: DistrictAdmin }
            - { call: "POST /absences", payload: { staff_member_id: "${t1}", start_date: "2026-08-03", end_date: "2026-08-03", absence_type: "SICK", required_subject: "MATH", required_grade_band: "HIGH" }, as: Teacher, as_user_id: "${t1}", captures: { abs1: $.data.id } }
            - { call: "POST /assignments", payload: { absence_id: "${abs1}", substitute_id: "${subA}" }, as: SchoolCoordinator, as_user_id: "${coord}", captures: { asg1: $.data.id } }
            - { call: "POST /assignments/${asg1}/respond", payload: { decision: "ACCEPT" }, as: Substitute, as_user_id: "${subA}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T18:00:00Z" }, as: DistrictAdmin }
            - { call: "POST /assignments/${asg1}/report-outcome", payload: { outcome: "WORKED" }, as: SchoolCoordinator, as_user_id: "${coord}" }
            - { call: "POST /timesheets", payload: { assignment_id: "${asg1}", work_date: "2026-08-03", hours_worked: 8.0 }, as: Substitute, as_user_id: "${subA}", captures: { ts1: $.data.id } }
            - { call: "POST /payroll-periods", payload: { district_id: "${dist}", period_start: "2026-08-03", period_end: "2026-08-07" }, as: PayrollClerk, captures: { pp: $.data.id } }
          trigger:
            - { call: "POST /payroll-periods/${pp}/export", payload: {}, as: PayrollClerk, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_PAYROLL_PERIOD_INVALID_STATE (SUBMITTED timesheet ${ts1} on a district assignment blocks export; the WORKED assignment ending in-period independently blocks too)"
            - "PayrollPeriod.${pp}.status == OPEN (no partial export occurred)"
            - "Assignment.${asg1}.status == WORKED (untouched by the rejected export)"

  - rule_id: resource_temporal_overlap
    instances:
      - name: substitute_assignment_day_overlap_adjacency_allowed
        grounds:
          - validations[priority=14]
          - errors[ERR_ASSIGNMENT_DATE_OVERLAP]
        distinguishing_aspect: |
          Closed day-interval exclusion semantics on the Substitute resource: an accept whose
          date range intersects an already-ACCEPTED assignment by one shared day is rejected
          (Aug 4-6 vs Aug 3-5), while a purely adjacent range (Aug 6-7) touches no shared day
          and succeeds — interval exclusion with adjacency permitted.
        test_recipe:
          setup:
            - "District defaults; school budget 1000000; teachers T1, T2, T3 all MATH/HIGH"
            - "Sub X ACTIVE qualified MATH/HIGH; absence A Mon 2026-08-03..Wed 2026-08-05 ACCEPTED by X"
