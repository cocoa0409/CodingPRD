              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 412"
            - "error_id == ERR_STALE_VERSION"

      - name: cascade_side_effects_from_agreement_cancel
        claim_type: cascading_side_effects
        grounds: ["state_machines.LicenseAgreement.ACTIVE_to_CANCELLED"]
        distinguishing_aspect: "Cancel cascades to performances, grants, alteration requests, payments"
        test_recipe:
          setup: ["Agreement ACTIVE with one SCHEDULED performance and one APPROVED recording grant"]
          setup_api_calls:
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: RightsAdmin
            - call: "POST /licensing/titles"
              payload: { name: "T", author: "A", title_kind: "PLAY", royalty_basis: "PER_PERFORMANCE", base_flat_fee_cents: 50000, gross_percent_bp: 0, restricted_material: false, perusal_fee_cents: 500, rental_deposit_cents: 20000, late_fee_per_day_cents: 500, restricted_late_fee_per_day_cents: 1500, recording_royalty_flat_cents: 30000 }
              as: RightsAdmin
              captures: { title_id: $.data.id }
            - call: "POST /licensing/organizations"
              payload: { legal_name: "O", org_kind: "COMMUNITY", home_territory_code: "US-CA" }
              as: RightsAdmin
              captures: { org_id: $.data.id }
            - call: "POST /licensing/applications"
              payload: { title_id: "${title_id}", organization_id: "${org_id}", requested_territory_code: "US-CA", requested_classification: "AMATEUR", venue_seating_capacity: 100, ticket_top_price_cents: 1000, performers_compensated: false, admission_charged: true, projected_gross_cents: 100000, performance_count: 1, first_performance_date: "2026-07-01T19:00:00Z", last_performance_date: "2026-07-01T19:00:00Z" }
              as: Applicant
              as_user_id: "${org_id}"
              captures: { app_id: $.data.id }
            - call: "POST /licensing/applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${org_id}"
            - call: "POST /licensing/applications/${app_id}/begin_review"
              payload: {}
              as: LicensingOfficer
            - call: "POST /licensing/applications/${app_id}/approve"
              payload: { expected_application_version: "${app_v}" }
              as: LicensingOfficer
              captures: { agreement_id: $.data.id }
            - call: "POST /licensing/agreements/${agreement_id}/activate"
              payload: {}
              as: RightsAdmin
            - call: "POST /licensing/agreements/${agreement_id}/performances"
              payload: { performance_at: "2026-07-01T19:00:00Z" }
              as: Applicant
              as_user_id: "${org_id}"
              captures: { perf_id: $.data.id }
            - call: "POST /licensing/recording-grants"
              payload: { agreement_id: "${agreement_id}", grant_kind: "CAST_RECORDING_AUDIO", distribution_scope: "CAST_CREW_ONLY" }
              as: Applicant
              as_user_id: "${org_id}"
              captures: { grant_id: $.data.id }
            - call: "POST /licensing/recording-grants/${grant_id}/approve"
              payload: {}
              as: RightsAdmin
          trigger:
            - call: "POST /licensing/agreements/${agreement_id}/cancel"
              payload: { reason: "x" }
              as: RightsAdmin
          assert:
            - "Performance.${perf_id}.status == CANCELLED"
            - "RecordingGrant.${grant_id}.status == REVOKED"
            - "LicenseAgreement.license_status == CANCELLED"

  # ---------------------------------------------------------------------------
  # Section: consistency_model
  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: immediate_consistency_reads_see_writes
        claim_type: immediate_consistency
        grounds: ["complexity_profile.consistency_model"]
        distinguishing_aspect: "All changes visible in same request's response (immediate model)"
        test_recipe:
          setup: ["Title created"]
          setup_api_calls:
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: RightsAdmin
          trigger:
            - call: "POST /licensing/titles"
              payload: { name: "T", author: "A", title_kind: "PLAY", royalty_basis: "PER_PERFORMANCE", base_flat_fee_cents: 50000, gross_percent_bp: 0, restricted_material: false, perusal_fee_cents: 500, rental_deposit_cents: 20000, late_fee_per_day_cents: 500, restricted_late_fee_per_day_cents: 1500, recording_royalty_flat_cents: 30000 }
              as: RightsAdmin
              captures: { title_id: $.data.id, title_status: $.data.status }
          assert:
            - "title_status == 'ACTIVE' (visible in same response)"
            - "version == 1 in same response"

