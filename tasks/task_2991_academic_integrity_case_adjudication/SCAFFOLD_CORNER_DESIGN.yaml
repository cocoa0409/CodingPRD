              as: FacultyReporter
              as_user_id: "${reporter_id}"
              captures: { report_b_id: $.data.id }
            - call: "POST /integrity/evidence-items"
              payload: { report_id: "${report_b_id}", kind: "SIMILARITY_REPORT", sha256: "2222222222222222222222222222222222222222222222222222222222222222", page_count: 4, similarity_pct: 45.00 }
              as: FacultyReporter
              as_user_id: "${reporter_id}"
            - call: "POST /integrity/reports/${report_b_id}/submit"
              as: FacultyReporter
              as_user_id: "${reporter_id}"
            - call: "POST /integrity/reports/${report_b_id}/triage"
              payload: { decision: "ACCEPT", triage_note: "Sufficient evidence." }
              as: IntegrityOfficer
            - call: "POST /integrity/cases"
              payload: { report_id: "${report_b_id}" }
              as: IntegrityOfficer
              captures: { case_b_id: $.data.id }
            - call: "POST /integrity/cases/${case_b_id}/dismiss"
              payload: { dismiss_reason: "The student produced contemporaneous drafts." }
              as: IntegrityOfficer
          trigger:
            - call: "GET /integrity/cases?pathway=FORMAL"
              as: IntegrityOfficer
            - call: "GET /integrity/cases?adjudication_status=DISMISSED"
              as: IntegrityOfficer
            - call: "GET /integrity/cases?pathway=FORMAL&adjudication_status=DISMISSED"
              as: IntegrityOfficer
            - call: "GET /integrity/cases?student_id=${student_b_id}&adjudication_status=DISMISSED"
              as: IntegrityOfficer
            - call: "GET /integrity/cases?student_id=00000000-0000-4000-8000-000000000000"
              as: IntegrityOfficer
              captures: { err_filter_student_missing: $.data.error_id }
            - call: "GET /integrity/students?limit=1"
              as: IntegrityOfficer
            - call: "GET /integrity/students?limit=100"
              as: IntegrityOfficer
            - call: "GET /integrity/students?limit=0"
              as: IntegrityOfficer
              captures: { err_limit_zero: $.data.error_id }
            - call: "GET /integrity/students?limit=101"
              as: IntegrityOfficer
              captures: { err_limit_over: $.data.error_id }
            - call: "GET /integrity/students?offset=-1"
              as: IntegrityOfficer
              captures: { err_offset_negative: $.data.error_id }
            - call: "GET /integrity/cases"
              as: IntegrityOfficer
          assert:
            - "pathway=FORMAL returns HTTP 200 with exactly 1 row, data[0].id == ${case_a_id}, total_count == 1"
            - "adjudication_status=DISMISSED returns exactly 1 row, data[0].id == ${case_b_id}, total_count == 1"
            - "pathway=FORMAL&adjudication_status=DISMISSED returns 0 rows with total_count == 0 and has_more == false - the filters are ANDed, not ORed"
            - "student_id=${student_b_id}&adjudication_status=DISMISSED returns exactly 1 row, data[0].id == ${case_b_id}"
            - "student_id=00000000-0000-4000-8000-000000000000 returns HTTP 404 with data.error_id == ERR_STUDENT_NOT_FOUND - an unresolvable filter key is a 404, not an empty page"
            - "limit=1 returns HTTP 200 with exactly 1 row, limit == 1, has_more == true (2 students exist)"
            - "limit=100 returns HTTP 200 with 2 rows, limit == 100, has_more == false - 100 is the inclusive maximum"
            - "limit=0 returns HTTP 400 with data.error_id == ERR_INVALID_PAGINATION"
            - "limit=101 returns HTTP 400 with data.error_id == ERR_INVALID_PAGINATION"
            - "offset=-1 returns HTTP 400 with data.error_id == ERR_INVALID_PAGINATION"
            - "the unparameterised GET /integrity/cases returns 2 rows with limit == 10 and offset == 0 - the declared defaults"

      - name: parent_scoped_sublists_return_only_their_own_children_and_404_on_an_unknown_parent
        claim_type: Cross-reference link
        grounds:
          - endpoints[GET /integrity/reports/{id}/evidence-items]
          - endpoints[GET /integrity/cases/{id}/notifications]
          - endpoints[GET /integrity/cases/{id}/advisor-engagements]
          - endpoints[GET /integrity/cases/{id}/appeals]
          - errors.ERR_REPORT_NOT_FOUND
          - errors.ERR_CASE_NOT_FOUND
        distinguishing_aspect: |
          Each nested list is scoped strictly to the parent in its path and agrees row-for-row with the
          equivalent flat list filtered by the same foreign key, so evidence attached to Lee's report
          never appears under Sam's report and an advisor engagement on Sam's case never appears under
          Lee's. A nested list whose parent id does not exist is that parent's OWN 404
          (ERR_REPORT_NOT_FOUND for the report path, ERR_CASE_NOT_FOUND for the case paths) rather than
          an empty page, and a parent that exists but has no children is an empty page rather than a 404.
        test_recipe:
          setup:
            - "clock at 2026-08-01T00:00:00Z; ENGL, reporter Rita trained, students Sam and Lee, ENGL-201"
            - "two FORMAL cases: Sam's report carries two evidence items and Sam has one advisor engagement; Lee's report carries one evidence item and Lee has none"
