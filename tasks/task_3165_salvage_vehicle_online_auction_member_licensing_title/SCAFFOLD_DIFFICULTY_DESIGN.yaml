          assert:
            - "Vehicle.${vehicle_id}.status == SALE_READY (availability identity restored)"
            - "Bid.${bid1}.is_winning == false — zero is_winning bids on the vehicle's item"
            - "Sale.${sale1}.status == CANCELLED — zero non-CANCELLED sales for the vehicle"
            - "GET /auctions/${auc1}/items shows item CLOSED and no QUEUED or LIVE rows for this vehicle"

      - name: title_record_count_conserved_across_sale_cancel
        grounds:
          - state_machines.TitleRecord.RECEIVED_to_TRANSFERRED
          - state_machines.Vehicle.SOLD_to_SALE_READY
          - entities.Vehicle.fields.title_brand
        distinguishing_aspect: |
          Conserved quantity: the vehicle's title-ownership cardinality —
          exactly ONE TitleRecord exists for the vehicle across the forward
          transfer (close-lot) and its compensating sale cancel, with status
          restored TRANSFERRED -> RECEIVED and Vehicle.title_brand restored
          to its pre-transfer value NONE after the FL NON_REPAIRABLE REBUILT
          stamping is rolled back. Drift would be a second title record, a
          stuck TRANSFERRED status, or a lingering REBUILT brand.
