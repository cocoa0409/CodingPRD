            - "${open_before} == 3"
            - "${a_status} == NOT_REPORTABLE and ${a_deadline} == null"
            - "${err_b} == ERR_EVENT_DETERMINATION_CONFLICT with HTTP 409"
            - "${b_status} == REPORTABLE and ${b_deadline} == \"2026-08-07T17:30:00Z\""
            - "${c_status} == REPORTABLE and ${c_deadline} == \"2026-08-07T17:30:00Z\""
            - "${open_after} == 2"

      - name: adding_a_pending_milestone_immediately_re_evaluates_the_forward_looking_minimum
        claim_type: forward_looking
        grounds:
          - calculations.cycle_milestone_slack
