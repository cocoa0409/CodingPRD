          assert:
            - "${sr_start} == 2026-08-01T00:00:00.000Z"
            - "${sr_due} == 2026-08-08T00:00:00.000Z"
            - "${now} == 2026-08-15T00:00:00.000Z"
            - "No entity was mutated by the clock call: Recall.${r_id}.version is unchanged from before it"

