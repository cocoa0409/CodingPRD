# §1.9 Scaffold Corner Design — breadth probe for task_2307_hand_tool_manufacturing.
# Taxonomy: references/claim-extraction-guide.md. Sections and claim_type values are
# taken verbatim from that guide's nine tables; no categories are invented.
# Corners already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml carry an
# `excluded_because:` stub naming the covering §1.8 instance.
scaffold_corner_design:

  - section: entities
    instances:

      - name: create_tool_sku_returns_computed_defaults_and_version_one
        claim_type: creation
        grounds:
          - endpoints[POST /toolworks/tool-skus]
          - entities.ToolSku
          - calculations.proof_torque_requirement
          - response_envelope
        distinguishing_aspect: "A single POST with all seven required inputs returns 201 and every declared ToolSku field, including the computed proof_torque_required_nm 115.8 and all seven counters at their declared defaults."
        test_recipe:
          setup:
            - "Empty database with the logical clock pinned to the default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /toolworks/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /toolworks/tool-skus"
              payload: { sku_code: "WR-17-BR", tool_family: "WRENCH", channel: "BRANDED", nominal_size_mm: 17, alloy_grade: "CR_MO", list_price_cents: 3300, warranty_tier: "LIFETIME" }
              as: ChannelManager
              captures: { sku_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "data.sku_code == 'WR-17-BR', tool_family == 'WRENCH', channel == 'BRANDED', nominal_size_mm == 17, alloy_grade == 'CR_MO', list_price_cents == 3300, warranty_tier == 'LIFETIME'"
            - "data.proof_torque_required_nm == 115.8"
            - "data.warranty_posture == 'OPEN' and data.brand_risk_score == 0 and data.confirmed_counterfeit_count == 0"
            - "data.units_received_total == 0, units_on_hand == 0, units_reserved == 0, units_shipped == 0"
            - "data.lineage_depth == 0 and data.supersedes_sku_id is null"
            - "data.version == 1 and data.id, data.created_at, data.updated_at are all present"

      - name: retrieve_production_lot_returns_pinned_and_ledger_fields
        claim_type: retrieval
        grounds:
          - endpoints[GET /toolworks/production-lots/{id}]
          - entities.ProductionLot
          - calculations.specimen_ledger
        distinguishing_aspect: "GET /{id} echoes the stored inputs and the creation-time derived state: proof_torque_required_nm pinned from the SKU (115.8), the three specimen buckets summing to specimen_pool_total, and the three initial state dimensions."
        test_recipe:
          setup:
            - "One BRANDED WRENCH SKU, 17 mm, CR_MO."
            - "One ProductionLot on that SKU with unit_count 500 and specimen_pool_total 40, untouched since creation."
          setup_api_calls:
            - call: "POST /toolworks/tool-skus"
              payload: { sku_code: "WR-17-BR", tool_family: "WRENCH", channel: "BRANDED", nominal_size_mm: 17, alloy_grade: "CR_MO", list_price_cents: 3300, warranty_tier: "LIFETIME" }
              as: ChannelManager
              captures: { sku_id: $.data.id }
            - call: "POST /toolworks/production-lots"
              payload: { sku_id: "${sku_id}", lot_code: "LOT-BR-A", unit_count: 500, specimen_pool_total: 40 }
              as: ProductionPlanner
              captures: { lot_id: $.data.id }
          trigger:
            - call: "GET /toolworks/production-lots/${lot_id}"
              payload: {}
              as: QualityEngineer
          assert:
            - "HTTP status == 200"
            - "data.sku_id == '${sku_id}', lot_code == 'LOT-BR-A', unit_count == 500, specimen_pool_total == 40"
            - "data.proof_torque_required_nm == 115.8 (pinned from the SKU at lot creation)"
            - "data.specimens_available == 40, specimens_committed == 0, specimens_consumed == 0"
            - "data.process_status == 'FORGED', cert_status == 'DRAFT', disposition == 'IN_PROCESS'"
            - "data.hardness_index_sample is null, hardness_index_pooled is null, certified_at is null, rework_cycle_count == 0"

      - name: list_tool_skus_paginates_and_rejects_bad_pagination
        claim_type: listing
        grounds:
          - endpoints[GET /toolworks/tool-skus]
          - response_envelope
          - validations[priority=310]
          - errors[ERR_INVALID_PAGINATION]
        distinguishing_aspect: "The list envelope reports total_count over the whole filtered set (3) while data holds only the page, has_more flips true->false at the last page, and limit 0 / offset -1 are refused with ERR_INVALID_PAGINATION rather than silently clamped."
        test_recipe:
          setup:
            - "Exactly three ToolSku rows created in a known order: WR-17-BR, then SO-20-BR, then PL-10-PL."
          setup_api_calls:
            - call: "POST /toolworks/tool-skus"
              payload: { sku_code: "WR-17-BR", tool_family: "WRENCH", channel: "BRANDED", nominal_size_mm: 17, alloy_grade: "CR_MO", list_price_cents: 3300, warranty_tier: "LIFETIME" }
              as: ChannelManager
              captures: { sku1_id: $.data.id }
            - call: "POST /toolworks/tool-skus"
              payload: { sku_code: "SO-20-BR", tool_family: "SOCKET", channel: "BRANDED", nominal_size_mm: 20, alloy_grade: "CR_V", list_price_cents: 1500, warranty_tier: "LIFETIME" }
              as: ChannelManager
              captures: { sku2_id: $.data.id }
            - call: "POST /toolworks/tool-skus"
              payload: { sku_code: "PL-10-PL", tool_family: "PLIER", channel: "PRIVATE_LABEL", nominal_size_mm: 10, alloy_grade: "S2", list_price_cents: 900, warranty_tier: "LIMITED_5Y" }
              as: ChannelManager
              captures: { sku3_id: $.data.id }
          trigger:
            - call: "GET /toolworks/tool-skus"
              payload: { limit: 2, offset: 0 }
              as: ChannelManager
            - call: "GET /toolworks/tool-skus"
              payload: { limit: 2, offset: 2 }
              as: ChannelManager
            - call: "GET /toolworks/tool-skus"
              payload: { channel: "BRANDED" }
              as: ChannelManager
            - call: "GET /toolworks/tool-skus"
              payload: { limit: 0 }
              as: ChannelManager
              captures: { err_limit: $.data.error_id }
            - call: "GET /toolworks/tool-skus"
              payload: { offset: -1 }
              as: ChannelManager
              captures: { err_offset: $.data.error_id }
          assert:
            - "First page: HTTP 200, len(data) == 2, total_count == 3, has_more == true, data[0].id == '${sku1_id}' and data[1].id == '${sku2_id}' (created_at ASC)"
            - "Second page: len(data) == 1, total_count == 3, has_more == false, data[0].id == '${sku3_id}'"
            - "channel=BRANDED page: len(data) == 2, total_count == 2, has_more == false"
            - "limit 0: HTTP 400 with error_id == 'ERR_INVALID_PAGINATION'"
            - "offset -1: HTTP 400 with error_id == 'ERR_INVALID_PAGINATION'"

      - name: not_found_family_is_specific_to_the_addressed_entity
        claim_type: not_found
        grounds:
          - validations[priority=200]
          - errors[ERR_TOOL_SKU_NOT_FOUND]
          - errors[ERR_PRODUCTION_LOT_NOT_FOUND]
          - errors[ERR_FURNACE_NOT_FOUND]
          - errors[ERR_CAMPAIGN_NOT_FOUND]
          - errors[ERR_CHAMBER_NOT_FOUND]
          - errors[ERR_TEST_RUN_NOT_FOUND]
          - errors[ERR_PACK_CONFIG_NOT_FOUND]
          - errors[ERR_WARRANTY_PROGRAM_NOT_FOUND]
          - errors[ERR_CLAIMANT_NOT_FOUND]
          - errors[ERR_CLAIM_NOT_FOUND]
          - errors[ERR_REPORT_NOT_FOUND]
        distinguishing_aspect: "Every {id}-carrying route resolves its path parameter against its own table and returns that table's member of the NOT_FOUND family — eleven distinct codes, never a generic 404 — for an id that exists in no table."
        test_recipe:
          setup:
            - "Empty database; no row of any entity exists, so the fixed id 00000000-0000-0000-0000-0000000000ff resolves nowhere."
          setup_api_calls:
            - call: "POST /toolworks/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /toolworks/tool-skus/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: ChannelManager
              captures: { e_sku: $.data.error_id }
            - call: "GET /toolworks/production-lots/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: ProductionPlanner
              captures: { e_lot: $.data.error_id }
            - call: "GET /toolworks/heat-treat-furnaces/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: ProductionPlanner
              captures: { e_furnace: $.data.error_id }
            - call: "GET /toolworks/furnace-campaigns/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: ProductionPlanner
              captures: { e_campaign: $.data.error_id }
            - call: "GET /toolworks/salt-spray-chambers/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: QualityEngineer
              captures: { e_chamber: $.data.error_id }
            - call: "GET /toolworks/test-runs/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: QualityEngineer
              captures: { e_run: $.data.error_id }
            - call: "GET /toolworks/pack-configurations/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: ChannelManager
              captures: { e_pack: $.data.error_id }
            - call: "GET /toolworks/warranty-programs/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: WarrantyAdministrator
              captures: { e_program: $.data.error_id }
            - call: "GET /toolworks/claimants/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: WarrantyAdministrator
              captures: { e_claimant: $.data.error_id }
            - call: "GET /toolworks/warranty-claims/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: WarrantyAdministrator
              captures: { e_claim: $.data.error_id }
            - call: "GET /toolworks/counterfeit-reports/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: BrandProtectionAnalyst
              captures: { e_report: $.data.error_id }
          assert:
            - "Every one of the eleven calls returns HTTP 404"
            - "error_ids in order are ERR_TOOL_SKU_NOT_FOUND, ERR_PRODUCTION_LOT_NOT_FOUND, ERR_FURNACE_NOT_FOUND, ERR_CAMPAIGN_NOT_FOUND, ERR_CHAMBER_NOT_FOUND, ERR_TEST_RUN_NOT_FOUND, ERR_PACK_CONFIG_NOT_FOUND, ERR_WARRANTY_PROGRAM_NOT_FOUND, ERR_CLAIMANT_NOT_FOUND, ERR_CLAIM_NOT_FOUND, ERR_REPORT_NOT_FOUND"
            - "Each response body carries both error_id and message"

      - name: missing_required_input_fields_rejected_with_invalid_request
        claim_type: required_fields
        grounds:
          - validations[priority=300]
          - errors[ERR_INVALID_REQUEST]
          - entities.ToolSku.fields.alloy_grade
          - entities.ProductionLot.fields.specimen_pool_total
        distinguishing_aspect: "Every field declared source: input without a default is mandatory: omitting ToolSku.alloy_grade or ProductionLot.specimen_pool_total yields ERR_INVALID_REQUEST at priority 300, before any FK or state check runs."
        test_recipe:
          setup:
            - "One BRANDED WRENCH SKU exists so the lot request's FK is valid and only the missing field can fail."
          setup_api_calls:
            - call: "POST /toolworks/tool-skus"
              payload: { sku_code: "WR-17-BR", tool_family: "WRENCH", channel: "BRANDED", nominal_size_mm: 17, alloy_grade: "CR_MO", list_price_cents: 3300, warranty_tier: "LIFETIME" }
              as: ChannelManager
              captures: { sku_id: $.data.id }
          trigger:
            - call: "POST /toolworks/tool-skus"
              payload: { sku_code: "WR-19-BR", tool_family: "WRENCH", channel: "BRANDED", nominal_size_mm: 19, list_price_cents: 3300, warranty_tier: "LIFETIME" }
              as: ChannelManager
              captures: { e_sku: $.data.error_id }
            - call: "POST /toolworks/production-lots"
              payload: { sku_id: "${sku_id}", lot_code: "LOT-BR-B", unit_count: 100 }
              as: ProductionPlanner
              captures: { e_lot: $.data.error_id }
            - call: "POST /toolworks/warranty-programs"
              payload: { program_code: "LIFETIME-1", reserve_funded_cents: 5000000 }
              as: WarrantyAdministrator
              captures: { e_prog: $.data.error_id }
          assert:
            - "All three calls return HTTP 400 with error_id == 'ERR_INVALID_REQUEST'"
            - "No ToolSku with sku_code 'WR-19-BR' exists afterwards: GET /toolworks/tool-skus returns total_count 1"
            - "No ProductionLot exists afterwards: GET /toolworks/tool-skus/${sku_id}/production-lots returns total_count 0"

      - name: omitted_supersedes_sku_id_defaults_to_null_lineage_depth_zero
        claim_type: defaults
        grounds:
          - entities.ToolSku.fields.supersedes_sku_id
          - entities.ToolSku.fields.lineage_depth
          - calculations.sku_lineage_depth
        distinguishing_aspect: "supersedes_sku_id is the only optional input on ToolSku creation; omitting it leaves the field null and pins the computed lineage_depth to its declared default 0 rather than leaving it null."
        test_recipe:
          setup:
            - "An existing WRENCH SKU that could have been superseded, so the null result is a choice rather than an absence of candidates."
          setup_api_calls:
            - call: "POST /toolworks/tool-skus"
              payload: { sku_code: "WR-17-BR", tool_family: "WRENCH", channel: "BRANDED", nominal_size_mm: 17, alloy_grade: "CR_MO", list_price_cents: 3300, warranty_tier: "LIFETIME" }
              as: ChannelManager
              captures: { sku1_id: $.data.id }
          trigger:
            - call: "POST /toolworks/tool-skus"
              payload: { sku_code: "WR-17-BR-V2", tool_family: "WRENCH", channel: "BRANDED", nominal_size_mm: 17, alloy_grade: "CR_MO", list_price_cents: 3600, warranty_tier: "LIFETIME" }
              as: ChannelManager
              captures: { sku2_id: $.data.id }
            - call: "POST /toolworks/tool-skus"
              payload: { sku_code: "WR-17-BR-V3", tool_family: "WRENCH", channel: "BRANDED", nominal_size_mm: 17, alloy_grade: "CR_MO", list_price_cents: 3900, warranty_tier: "LIFETIME", supersedes_sku_id: "${sku1_id}" }
              as: ChannelManager
              captures: { sku3_id: $.data.id }
          assert:
            - "Omitted case: data.supersedes_sku_id is null and data.lineage_depth == 0"
            - "Supplied case: data.supersedes_sku_id == '${sku1_id}' and data.lineage_depth == 1"
            - "GET /toolworks/tool-skus?supersedes_sku_id=${sku1_id} returns total_count 1 and data[0].id == '${sku3_id}'"

      - name: computed_proof_torque_recomputed_on_patch_not_client_supplied
        claim_type: computed_fields
        grounds:
          - calculations.proof_torque_requirement
          - endpoints[PATCH /toolworks/tool-skus/{id}]
          - entities.ToolSku.fields.proof_torque_required_nm
        distinguishing_aspect: "proof_torque_required_nm is absent from every endpoint's input: it is derived from tool_family, nominal_size_mm, alloy_grade and channel only, and a PATCH of nominal_size_mm from 17 to 19 moves it 115.8 -> 129.4 while the SOCKET SKU's 203.0 is untouched."
        test_recipe:
          setup:
            - "Two SKUs: BRANDED WRENCH 17 mm CR_MO (115.8) and BRANDED SOCKET 20 mm CR_V (203.0)."
          setup_api_calls:
            - call: "POST /toolworks/tool-skus"
              payload: { sku_code: "WR-17-BR", tool_family: "WRENCH", channel: "BRANDED", nominal_size_mm: 17, alloy_grade: "CR_MO", list_price_cents: 3300, warranty_tier: "LIFETIME" }
              as: ChannelManager
              captures: { sku1_id: $.data.id, torque1: $.data.proof_torque_required_nm }
            - call: "POST /toolworks/tool-skus"
              payload: { sku_code: "SO-20-BR", tool_family: "SOCKET", channel: "BRANDED", nominal_size_mm: 20, alloy_grade: "CR_V", list_price_cents: 1500, warranty_tier: "LIFETIME" }
              as: ChannelManager
              captures: { sku2_id: $.data.id, torque2: $.data.proof_torque_required_nm }
          trigger:
            - call: "PATCH /toolworks/tool-skus/${sku1_id}"
              payload: { nominal_size_mm: 19 }
              as: ChannelManager
            - call: "GET /toolworks/tool-skus/${sku2_id}"
              payload: {}
              as: ChannelManager
          assert:
            - "At creation: torque1 == 115.8 (4.2 * 17 * 1.15 * 1.10 + 1.5 * 17) and torque2 == 203.0 (6.5 * 20 * 1.00 * 1.10 + 3.0 * 20)"
            - "After PATCH: ToolSku.${sku1_id}.nominal_size_mm == 19 and proof_torque_required_nm == 129.4"
            - "ToolSku.${sku1_id}.version == 2 after the PATCH"
            - "ToolSku.${sku2_id}.proof_torque_required_nm == 203.0 (unaffected)"

      - name: system_fields_generated_on_claimant_creation
        claim_type: system_fields
        grounds:
          - entities.Claimant
          - endpoints[POST /toolworks/claimants]
          - response_envelope
        distinguishing_aspect: "The client supplies only email and claimant_type; id, created_at, updated_at, version, status and the three scoring counters are all system- or computed-sourced and arrive at their declared initial values."
        test_recipe:
          setup:
            - "Logical clock pinned to 2026-08-01T00:00:00Z so created_at is deterministic."
          setup_api_calls:
            - call: "POST /toolworks/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /toolworks/claimants"
              payload: { email: "c1@example.com", claimant_type: "CONSUMER" }
              as: WarrantyAdministrator
              captures: { claimant_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "data.status == 'ACTIVE' (system default, not client-supplied)"
            - "data.fraud_risk_score_intake == 0, fraud_risk_score_adjudication == 0, lifetime_claim_count == 0"
            - "data.version == 1 and data.created_at == '2026-08-01T00:00:00Z' and data.updated_at == '2026-08-01T00:00:00Z'"

      - name: enum_and_window_type_constraints_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority=300]
          - validations[priority=320]
          - errors[ERR_INVALID_REQUEST]
          - errors[ERR_INVALID_WINDOW]
          - entities.FurnaceCampaign.fields.window_end
        distinguishing_aspect: "Two different constraint families produce two different codes: an out-of-enum tool_family and an out-of-range nominal_size_mm are ERR_INVALID_REQUEST (400/priority 300), while window_start == window_end is the dedicated ERR_INVALID_WINDOW (400/priority 320) because ordering is a window constraint, not a type constraint."
        test_recipe:
          setup:
            - "One BRANDED WRENCH SKU, one CR_MO furnace and one FORGED lot, so the campaign request fails only on its window."
          setup_api_calls:
            - call: "POST /toolworks/tool-skus"
              payload: { sku_code: "WR-17-BR", tool_family: "WRENCH", channel: "BRANDED", nominal_size_mm: 17, alloy_grade: "CR_MO", list_price_cents: 3300, warranty_tier: "LIFETIME" }
              as: ChannelManager
              captures: { sku_id: $.data.id }
            - call: "POST /toolworks/heat-treat-furnaces"
              payload: { furnace_code: "FCE-1", max_charge_kg: 900, alloy_grades_supported: ["CR_MO"] }
              as: ProductionPlanner
              captures: { furnace_id: $.data.id }
            - call: "POST /toolworks/production-lots"
              payload: { sku_id: "${sku_id}", lot_code: "LOT-BR-A", unit_count: 500, specimen_pool_total: 20 }
              as: ProductionPlanner
              captures: { lot_id: $.data.id }
          trigger:
            - call: "POST /toolworks/tool-skus"
              payload: { sku_code: "HM-01-BR", tool_family: "HAMMER", channel: "BRANDED", nominal_size_mm: 17, alloy_grade: "CR_MO", list_price_cents: 3300, warranty_tier: "LIFETIME" }
              as: ChannelManager
              captures: { e_enum: $.data.error_id }
            - call: "POST /toolworks/tool-skus"
              payload: { sku_code: "WR-99-BR", tool_family: "WRENCH", channel: "BRANDED", nominal_size_mm: 81, alloy_grade: "CR_MO", list_price_cents: 3300, warranty_tier: "LIFETIME" }
              as: ChannelManager
              captures: { e_range: $.data.error_id }
            - call: "POST /toolworks/furnace-campaigns"
              payload: { lot_id: "${lot_id}", furnace_id: "${furnace_id}", window_start: "2026-08-02T06:00:00Z", window_end: "2026-08-02T06:00:00Z", charge_kg: 800 }
              as: ProductionPlanner
              captures: { e_window: $.data.error_id }
          assert:
            - "Bad enum: HTTP 400 with error_id == 'ERR_INVALID_REQUEST'"
            - "nominal_size_mm 81 (> 80): HTTP 400 with error_id == 'ERR_INVALID_REQUEST'"
            - "Zero-length window: HTTP 400 with error_id == 'ERR_INVALID_WINDOW'"
            - "GET /toolworks/furnace-campaigns?lot_id=${lot_id} returns total_count 0"

      - name: claim_line_is_immutable_and_carries_no_version
        claim_type: immutability
        grounds:
          - entities.ClaimLine
          - entities.PackMember
          - endpoints[POST /toolworks/warranty-claims/{id}/lines]
          - endpoints[GET /toolworks/warranty-claims/{id}/lines]
        distinguishing_aspect: "ClaimLine and PackMember are declared common_fields: false — they expose no version and no updated_at, §1.5 declares no PATCH or DELETE for either, and the only way to change a claim's reserve is to append another line."
        test_recipe:
          setup:
            - "One BRANDED WRENCH SKU with warranty_tier LIFETIME, one programme, one ACTIVE CONSUMER claimant and one SUBMITTED claim."
          setup_api_calls:
            - call: "POST /toolworks/tool-skus"
              payload: { sku_code: "WR-17-BR", tool_family: "WRENCH", channel: "BRANDED", nominal_size_mm: 17, alloy_grade: "CR_MO", list_price_cents: 3300, warranty_tier: "LIFETIME" }
              as: ChannelManager
              captures: { sku_id: $.data.id }
            - call: "POST /toolworks/warranty-programs"
              payload: { program_code: "LIFETIME-1", reserve_funded_cents: 5000000, fraud_score_threshold: 60 }
              as: WarrantyAdministrator
              captures: { prog_id: $.data.id }
            - call: "POST /toolworks/claimants"
              payload: { email: "c1@example.com", claimant_type: "CONSUMER" }
              as: WarrantyAdministrator
              captures: { claimant_id: $.data.id }
            - call: "POST /toolworks/warranty-claims"
              payload: { claimant_id: "${claimant_id}", sku_id: "${sku_id}", program_id: "${prog_id}", serial_code: "SN-0001", claim_reason: "BREAKAGE" }
              as: WarrantyAdministrator
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /toolworks/warranty-claims/${claim_id}/lines"
              payload: { component_code: "HANDLE", component_list_price_cents: 1099, quantity: 1 }
              as: WarrantyAdministrator
              captures: { line_id: $.data.id }
            - call: "GET /toolworks/warranty-claims/${claim_id}/lines"
              payload: {}
              as: WarrantyAdministrator
          assert:
            - "Line creation returns HTTP 201 with data.line_reserve_cents == 681 and data.id and data.created_at present"
            - "The ClaimLine response body contains no version field and no updated_at field"
            - "GET lines returns total_count 1 and data[0].id == '${line_id}'"
            - "§1.5 declares no PATCH or DELETE route under /toolworks/warranty-claims/{id}/lines, so the row cannot be mutated after creation"
            - "WarrantyClaim.${claim_id}.line_count == 1 and reserve_charge_cents == 681 (the parent absorbs the change, not the line)"

      - name: pack_member_requires_existing_parent_and_member_sku
        claim_type: parent_relationships
        grounds:
          - validations[priority=200]
          - validations[priority=210]
          - errors[ERR_PACK_CONFIG_NOT_FOUND]
          - errors[ERR_TOOL_SKU_NOT_FOUND]
          - entities.PackMember.fields.pack_id
        distinguishing_aspect: "A PackMember needs both ends of its association: an unknown pack in the path is ERR_PACK_CONFIG_NOT_FOUND (priority 200) and an unknown sku_id in the body is ERR_TOOL_SKU_NOT_FOUND (priority 210), so the path check precedes the body check."
        test_recipe:
          setup:
            - "One BRANDED WRENCH SKU and one DRAFT RETAIL_DISPLAY pack whose primary_sku_id is that SKU."
          setup_api_calls:
            - call: "POST /toolworks/tool-skus"
              payload: { sku_code: "WR-17-BR", tool_family: "WRENCH", channel: "BRANDED", nominal_size_mm: 17, alloy_grade: "CR_MO", list_price_cents: 3300, warranty_tier: "LIFETIME" }
              as: ChannelManager
              captures: { sku_id: $.data.id }
            - call: "POST /toolworks/pack-configurations"
              payload: { pack_code: "PK-RD-1", pack_type: "RETAIL_DISPLAY", primary_sku_id: "${sku_id}" }
              as: ChannelManager
              captures: { pack_id: $.data.id }
          trigger:
            - call: "POST /toolworks/pack-configurations/00000000-0000-0000-0000-0000000000ff/members"
              payload: { sku_id: "${sku_id}", quantity: 2 }
              as: ChannelManager
              captures: { e_pack: $.data.error_id }
            - call: "POST /toolworks/pack-configurations/${pack_id}/members"
              payload: { sku_id: "00000000-0000-0000-0000-0000000000ff", quantity: 2 }
              as: ChannelManager
              captures: { e_sku: $.data.error_id }
          assert:
            - "Unknown pack: HTTP 404 with error_id == 'ERR_PACK_CONFIG_NOT_FOUND'"
            - "Unknown member SKU: HTTP 404 with error_id == 'ERR_TOOL_SKU_NOT_FOUND'"
            - "GET /toolworks/pack-configurations/${pack_id}/members returns total_count 0 and PackConfiguration.${pack_id}.distinct_member_count == 0"

      - name: graph_topology_pack_membership_is_many_to_many
        claim_type: creation
        grounds:
          - complexity_profile.entity_topology
          - entities.PackMember
          - endpoints[GET /toolworks/tool-skus/{id}/pack-memberships]
          - validations[priority=920]
          - errors[ERR_DUPLICATE_PACK_MEMBER]
        distinguishing_aspect: "PackMember is the junction of the graph topology: one SKU may belong to several packs and one pack may hold several SKUs, but the pair (pack_id, sku_id) is unique, so the second membership of the same SKU in the same pack is ERR_DUPLICATE_PACK_MEMBER."
        test_recipe:
          setup:
            - "Two BRANDED SKUs and two DRAFT RETAIL_DISPLAY packs."
            - "SKU 1 is already a member of both packs; pack 1 already holds both SKUs."
          setup_api_calls:
            - call: "POST /toolworks/tool-skus"
              payload: { sku_code: "WR-17-BR", tool_family: "WRENCH", channel: "BRANDED", nominal_size_mm: 17, alloy_grade: "CR_MO", list_price_cents: 3300, warranty_tier: "LIFETIME" }
              as: ChannelManager
              captures: { sku1_id: $.data.id }
            - call: "POST /toolworks/tool-skus"
              payload: { sku_code: "SO-20-BR", tool_family: "SOCKET", channel: "BRANDED", nominal_size_mm: 20, alloy_grade: "CR_V", list_price_cents: 1500, warranty_tier: "LIFETIME" }
              as: ChannelManager
              captures: { sku2_id: $.data.id }
            - call: "POST /toolworks/pack-configurations"
              payload: { pack_code: "PK-RD-1", pack_type: "RETAIL_DISPLAY", primary_sku_id: "${sku1_id}" }
              as: ChannelManager
              captures: { pack1_id: $.data.id }
            - call: "POST /toolworks/pack-configurations"
              payload: { pack_code: "PK-RD-2", pack_type: "RETAIL_DISPLAY", primary_sku_id: "${sku1_id}" }
              as: ChannelManager
              captures: { pack2_id: $.data.id }
            - call: "POST /toolworks/pack-configurations/${pack1_id}/members"
              payload: { sku_id: "${sku1_id}", quantity: 2 }
              as: ChannelManager
              captures: { m1_id: $.data.id }
            - call: "POST /toolworks/pack-configurations/${pack1_id}/members"
              payload: { sku_id: "${sku2_id}", quantity: 3 }
              as: ChannelManager
              captures: { m2_id: $.data.id }
            - call: "POST /toolworks/pack-configurations/${pack2_id}/members"
              payload: { sku_id: "${sku1_id}", quantity: 1 }
              as: ChannelManager
              captures: { m3_id: $.data.id }
          trigger:
            - call: "POST /toolworks/pack-configurations/${pack1_id}/members"
              payload: { sku_id: "${sku1_id}", quantity: 5 }
              as: ChannelManager
              captures: { e_dup: $.data.error_id }
          assert:
            - "HTTP status == 409 with error_id == 'ERR_DUPLICATE_PACK_MEMBER'"
            - "PackMember.${m1_id}.line_extended_cents == 6600 and PackMember.${m2_id}.line_extended_cents == 4500 and PackMember.${m3_id}.line_extended_cents == 3300 (RETAIL_DISPLAY discount 1.00)"
            - "GET /toolworks/pack-configurations/${pack1_id}/members returns total_count 2 (the duplicate was not appended)"
            - "GET /toolworks/tool-skus/${sku1_id}/pack-memberships returns total_count 2 — the same SKU in two packs"
            - "PackConfiguration.${pack1_id}.distinct_member_count == 2 and member_subtotal_cents == 0 while still DRAFT (totals are computed at approval)"

  - section: state_machines
    instances:

      - name: initial_states_of_every_lifecycle_entity
        claim_type: initial_state
        grounds:
          - state_machines.ProductionLot.process_status.initial_state
          - state_machines.ProductionLot.cert_status.initial_state
          - state_machines.ProductionLot.disposition.initial_state
          - state_machines.HeatTreatFurnace.initial_state
          - state_machines.FurnaceCampaign.initial_state
          - state_machines.CounterfeitReport.initial_state
        distinguishing_aspect: "Newly created rows land in the declared initial_state of every dimension without any transition call: a lot is FORGED / DRAFT / IN_PROCESS across all three of its independent dimensions at once, a furnace is AVAILABLE, a campaign SCHEDULED and a report OPEN."
        test_recipe:
          setup:
            - "Logical clock at the default 2026-08-01T00:00:00Z; nothing but creation calls are issued."
          setup_api_calls:
            - call: "POST /toolworks/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /toolworks/tool-skus"
              payload: { sku_code: "WR-17-BR", tool_family: "WRENCH", channel: "BRANDED", nominal_size_mm: 17, alloy_grade: "CR_MO", list_price_cents: 3300, warranty_tier: "LIFETIME" }
              as: ChannelManager
              captures: { sku_id: $.data.id }
            - call: "POST /toolworks/heat-treat-furnaces"
              payload: { furnace_code: "FCE-1", max_charge_kg: 900, alloy_grades_supported: ["CR_MO"] }
              as: ProductionPlanner
              captures: { furnace_id: $.data.id, furnace_status: $.data.status }
            - call: "POST /toolworks/production-lots"
              payload: { sku_id: "${sku_id}", lot_code: "LOT-BR-A", unit_count: 500, specimen_pool_total: 20 }
              as: ProductionPlanner
              captures: { lot_id: $.data.id }
            - call: "POST /toolworks/furnace-campaigns"
              payload: { lot_id: "${lot_id}", furnace_id: "${furnace_id}", window_start: "2026-08-02T06:00:00Z", window_end: "2026-08-02T10:00:00Z", charge_kg: 800 }
              as: ProductionPlanner
              captures: { camp_id: $.data.id, camp_status: $.data.status }
            - call: "POST /toolworks/counterfeit-reports"
              payload: { sku_id: "${sku_id}", channel_name: "OpenBazaar", seller_handle: "torque_deals_99", evidence_grade: "WEAK", unit_estimate: 10 }
              as: BrandProtectionAnalyst
              captures: { report_id: $.data.id, report_status: $.data.status }
          assert:
            - "ProductionLot.${lot_id}.process_status == 'FORGED' and cert_status == 'DRAFT' and disposition == 'IN_PROCESS'"
            - "HeatTreatFurnace.${furnace_id}.status == 'AVAILABLE'"
            - "FurnaceCampaign.${camp_id}.status == 'SCHEDULED' and soak_minutes is null and buffered_end == '2026-08-02T10:45:00Z'"
            - "CounterfeitReport.${report_id}.status == 'OPEN' and risk_points == 5 and confirmation_note is null and dismissal_note is null"
            - "ToolSku.${sku_id}.brand_risk_score == 0 and warranty_posture == 'OPEN' (an OPEN report contributes nothing)"

      - name: campaign_completion_stores_soak_then_second_completion_rejected
        claim_type: valid_transition
        grounds:
          - state_machines.FurnaceCampaign.SCHEDULED_to_COMPLETED
          - validations[priority=405]
          - errors[ERR_CAMPAIGN_STATE_INVALID]
        distinguishing_aspect: "SCHEDULED -> COMPLETED applies every declared side effect (status, soak_minutes, version bump) and COMPLETED is terminal for that trigger, so replaying the identical request is ERR_CAMPAIGN_STATE_INVALID rather than a silent no-op."
        test_recipe:
          setup:
            - "One BRANDED WRENCH SKU, one CR_MO furnace, one FORGED lot and one SCHEDULED campaign at 2026-08-02T06:00Z-10:00Z."
          setup_api_calls:
            - call: "POST /toolworks/tool-skus"
              payload: { sku_code: "WR-17-BR", tool_family: "WRENCH", channel: "BRANDED", nominal_size_mm: 17, alloy_grade: "CR_MO", list_price_cents: 3300, warranty_tier: "LIFETIME" }
              as: ChannelManager
              captures: { sku_id: $.data.id }
            - call: "POST /toolworks/heat-treat-furnaces"
              payload: { furnace_code: "FCE-1", max_charge_kg: 900, alloy_grades_supported: ["CR_MO"] }
              as: ProductionPlanner
              captures: { furnace_id: $.data.id }
            - call: "POST /toolworks/production-lots"
              payload: { sku_id: "${sku_id}", lot_code: "LOT-BR-A", unit_count: 500, specimen_pool_total: 20 }
              as: ProductionPlanner
              captures: { lot_id: $.data.id }
            - call: "POST /toolworks/furnace-campaigns"
              payload: { lot_id: "${lot_id}", furnace_id: "${furnace_id}", window_start: "2026-08-02T06:00:00Z", window_end: "2026-08-02T10:00:00Z", charge_kg: 800 }
              as: ProductionPlanner
              captures: { camp_id: $.data.id, camp_v: $.data.version }
          trigger:
            - call: "POST /toolworks/furnace-campaigns/${camp_id}/complete"
              payload: { soak_minutes: 120 }
              as: ProductionPlanner
            - call: "POST /toolworks/furnace-campaigns/${camp_id}/complete"
              payload: { soak_minutes: 180 }
              as: ProductionPlanner
              captures: { e_state: $.data.error_id }
          assert:
            - "First call: HTTP 200, FurnaceCampaign.${camp_id}.status == 'COMPLETED', soak_minutes == 120, version == 2"
            - "Second call: HTTP 409 with error_id == 'ERR_CAMPAIGN_STATE_INVALID'"
            - "FurnaceCampaign.${camp_id}.soak_minutes is still 120 and version is still 2 (the refused call applied nothing)"
            - "ProductionLot.${lot_id}.process_status is still 'FORGED' (completion does not advance the lot by itself)"

      - name: advance_skipping_a_process_stage_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.ProductionLot.process_status.HEAT_TREATED_to_MACHINED
          - validations[priority=401]
          - errors[ERR_LOT_PROCESS_STATE_INVALID]
        distinguishing_aspect: "process_status advances strictly one stage at a time: a FORGED lot asked for MACHINED is ERR_LOT_PROCESS_STATE_INVALID even though a COMPLETED campaign exists, so the refusal is about stage adjacency and not about heat treatment."
        test_recipe:
          setup:
            - "One BRANDED WRENCH SKU, one CR_MO furnace, one FORGED lot and one COMPLETED campaign on that lot."
          setup_api_calls:
            - call: "POST /toolworks/tool-skus"
              payload: { sku_code: "WR-17-BR", tool_family: "WRENCH", channel: "BRANDED", nominal_size_mm: 17, alloy_grade: "CR_MO", list_price_cents: 3300, warranty_tier: "LIFETIME" }
              as: ChannelManager
              captures: { sku_id: $.data.id }
            - call: "POST /toolworks/heat-treat-furnaces"
              payload: { furnace_code: "FCE-1", max_charge_kg: 900, alloy_grades_supported: ["CR_MO"] }
              as: ProductionPlanner
              captures: { furnace_id: $.data.id }
            - call: "POST /toolworks/production-lots"
              payload: { sku_id: "${sku_id}", lot_code: "LOT-BR-A", unit_count: 500, specimen_pool_total: 20 }
              as: ProductionPlanner
              captures: { lot_id: $.data.id }
            - call: "POST /toolworks/furnace-campaigns"
              payload: { lot_id: "${lot_id}", furnace_id: "${furnace_id}", window_start: "2026-08-02T06:00:00Z", window_end: "2026-08-02T10:00:00Z", charge_kg: 800 }
              as: ProductionPlanner
              captures: { camp_id: $.data.id }
            - call: "POST /toolworks/furnace-campaigns/${camp_id}/complete"
              payload: { soak_minutes: 120 }
              as: ProductionPlanner
          trigger:
            - call: "POST /toolworks/production-lots/${lot_id}/advance"
              payload: { target_process_status: "MACHINED" }
              as: ProductionPlanner
              captures: { e_stage: $.data.error_id }
            - call: "POST /toolworks/production-lots/${lot_id}/advance"
              payload: { target_process_status: "FORGED" }
              as: ProductionPlanner
              captures: { e_back: $.data.error_id }
          assert:
            - "Both calls return HTTP 409 with error_id == 'ERR_LOT_PROCESS_STATE_INVALID'"
            - "ProductionLot.${lot_id}.process_status is still 'FORGED'"
            - "There is no FORGED -> FORGED or FORGED -> MACHINED edge in §1.2, so no side effect fires and lot.version is unchanged"

      - name: certify_while_cert_status_draft_rejected
        claim_type: invalid_transitions
        grounds:
          - state_machines.ProductionLot.cert_status.IN_TEST_to_CERTIFIED
          - validations[priority=400]
          - errors[ERR_LOT_CERT_STATE_INVALID]
        distinguishing_aspect: "The only inbound edge to CERTIFIED starts at IN_TEST, and IN_TEST is reached only by the first successful test-run; certifying a freshly created DRAFT lot is therefore ERR_LOT_CERT_STATE_INVALID at priority 400, ahead of the ASSEMBLED / mandatory-test / hardness gates."
        test_recipe:
          setup:
            - "One BRANDED WRENCH SKU and one lot on it with cert_status DRAFT and no TestRun rows at all."
          setup_api_calls:
            - call: "POST /toolworks/tool-skus"
              payload: { sku_code: "WR-17-BR", tool_family: "WRENCH", channel: "BRANDED", nominal_size_mm: 17, alloy_grade: "CR_MO", list_price_cents: 3300, warranty_tier: "LIFETIME" }
              as: ChannelManager
              captures: { sku_id: $.data.id }
            - call: "POST /toolworks/production-lots"
              payload: { sku_id: "${sku_id}", lot_code: "LOT-BR-A", unit_count: 500, specimen_pool_total: 20 }
              as: ProductionPlanner
              captures: { lot_id: $.data.id }
          trigger:
            - call: "POST /toolworks/production-lots/${lot_id}/certify"
              payload: {}
              as: QualityEngineer
              captures: { e_cert: $.data.error_id }
          assert:
            - "HTTP status == 409 with error_id == 'ERR_LOT_CERT_STATE_INVALID'"
            - "ProductionLot.${lot_id}.cert_status is still 'DRAFT' and certified_at is null"
            - "The response is NOT ERR_LOT_PROCESS_STATE_INVALID even though process_status is FORGED, because priority 400 precedes 401"

      - name: test_run_results_and_void_blocked_after_terminal_status
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.TestRun.terminal_states
          - validations[priority=404]
          - errors[ERR_TEST_RUN_STATE_INVALID]
        distinguishing_aspect: "PASSED, FAILED and VOID are all terminal for TestRun: resubmitting results to a PASSED run and voiding that same run both return ERR_TEST_RUN_STATE_INVALID, so a stored result can never be overwritten and the specimen ledger can never be double-counted."
        test_recipe:
          setup:
            - "One BRANDED WRENCH SKU, one CR_MO furnace, one lot heat-treated to HEAT_TREATED with specimen_pool_total 20."
            - "One HARDNESS TestRun on that lot with specimen_count 2 already resolved to PASSED by readings [52.0, 53.0]."
          setup_api_calls:
            - call: "POST /toolworks/tool-skus"
              payload: { sku_code: "WR-17-BR", tool_family: "WRENCH", channel: "BRANDED", nominal_size_mm: 17, alloy_grade: "CR_MO", list_price_cents: 3300, warranty_tier: "LIFETIME" }
              as: ChannelManager
              captures: { sku_id: $.data.id }
            - call: "POST /toolworks/heat-treat-furnaces"
              payload: { furnace_code: "FCE-1", max_charge_kg: 900, alloy_grades_supported: ["CR_MO"] }
              as: ProductionPlanner
              captures: { furnace_id: $.data.id }
            - call: "POST /toolworks/production-lots"
              payload: { sku_id: "${sku_id}", lot_code: "LOT-BR-A", unit_count: 500, specimen_pool_total: 20 }
              as: ProductionPlanner
              captures: { lot_id: $.data.id }
            - call: "POST /toolworks/furnace-campaigns"
              payload: { lot_id: "${lot_id}", furnace_id: "${furnace_id}", window_start: "2026-08-02T06:00:00Z", window_end: "2026-08-02T10:00:00Z", charge_kg: 800 }
              as: ProductionPlanner
              captures: { camp_id: $.data.id }
            - call: "POST /toolworks/furnace-campaigns/${camp_id}/complete"
              payload: { soak_minutes: 120 }
              as: ProductionPlanner
            - call: "POST /toolworks/production-lots/${lot_id}/advance"
              payload: { target_process_status: "HEAT_TREATED" }
              as: ProductionPlanner
            - call: "POST /toolworks/test-runs"
              payload: { lot_id: "${lot_id}", test_type: "HARDNESS", specimen_count: 2, window_start: "2026-08-03T08:00:00Z", window_end: "2026-08-03T09:00:00Z" }
              as: QualityEngineer
              captures: { run_id: $.data.id }
            - call: "POST /toolworks/test-runs/${run_id}/results"
              payload: { readings: [52.0, 53.0] }
              as: QualityEngineer
              captures: { run_status: $.data.status, run_mean: $.data.mean_reading }
          trigger:
            - call: "POST /toolworks/test-runs/${run_id}/results"
              payload: { readings: [58.0, 59.0] }
              as: QualityEngineer
              captures: { e_results: $.data.error_id }
            - call: "POST /toolworks/test-runs/${run_id}/void"
              payload: { void_reason: "Operator wants to discard the result" }
              as: QualityEngineer
              captures: { e_void: $.data.error_id }
          assert:
            - "Setup result call: TestRun.${run_id}.status == 'PASSED', mean_reading == 52.5, requirement_value == 50.0, result_margin_pct == 5.00"
            - "Both trigger calls return HTTP 409 with error_id == 'ERR_TEST_RUN_STATE_INVALID'"
            - "TestRun.${run_id}.readings is still [52.0, 53.0] and mean_reading is still 52.5"
            - "ProductionLot.${lot_id}.specimens_consumed == 2, specimens_committed == 0, specimens_available == 18 (unchanged by the refusals)"
            - "ProductionLot.${lot_id}.hardness_index_sample == 52.50 and hardness_index_pooled == 52.50 and cert_status == 'IN_TEST'"

      - name: void_returns_specimens_and_frees_chamber_capacity
        claim_type: side_effect_execution
        grounds:
          - state_machines.TestRun.SCHEDULED_to_VOID
          - calculations.specimen_ledger
          - calculations.chamber_capacity_occupancy
          - endpoints[POST /toolworks/test-runs/{id}/void]
        distinguishing_aspect: "Void is the exact compensating action of scheduling: the specimens move back from committed to available (not to consumed) and the run stops occupying its chamber interval, so a 24-coupon run fits the same window that a live 10-coupon run would have blocked."
        test_recipe:
          setup:
            - "One BRANDED WRENCH SKU, one CR_MO furnace, one SaltSprayChamber with coupon_capacity 24."
            - "One lot advanced to PLATED with specimen_pool_total 40 and one SCHEDULED 10-coupon SALT_SPRAY run over 2026-08-04T00:00Z-2026-08-06T00:00Z."
          setup_api_calls:
            - call: "POST /toolworks/tool-skus"
              payload: { sku_code: "WR-17-BR", tool_family: "WRENCH", channel: "BRANDED", nominal_size_mm: 17, alloy_grade: "CR_MO", list_price_cents: 3300, warranty_tier: "LIFETIME" }
              as: ChannelManager
              captures: { sku_id: $.data.id }
            - call: "POST /toolworks/heat-treat-furnaces"
              payload: { furnace_code: "FCE-1", max_charge_kg: 900, alloy_grades_supported: ["CR_MO"] }
              as: ProductionPlanner
              captures: { furnace_id: $.data.id }
            - call: "POST /toolworks/salt-spray-chambers"
              payload: { chamber_code: "SSC-1", coupon_capacity: 24 }
              as: QualityEngineer
              captures: { chamber_id: $.data.id }
            - call: "POST /toolworks/production-lots"
              payload: { sku_id: "${sku_id}", lot_code: "LOT-BR-A", unit_count: 500, specimen_pool_total: 40 }
              as: ProductionPlanner
              captures: { lot_id: $.data.id }
            - call: "POST /toolworks/furnace-campaigns"
              payload: { lot_id: "${lot_id}", furnace_id: "${furnace_id}", window_start: "2026-08-02T06:00:00Z", window_end: "2026-08-02T10:00:00Z", charge_kg: 800 }
              as: ProductionPlanner
              captures: { camp_id: $.data.id }
            - call: "POST /toolworks/furnace-campaigns/${camp_id}/complete"
              payload: { soak_minutes: 120 }
              as: ProductionPlanner
            - call: "POST /toolworks/production-lots/${lot_id}/advance"
              payload: { target_process_status: "HEAT_TREATED" }
              as: ProductionPlanner
            - call: "POST /toolworks/production-lots/${lot_id}/advance"
              payload: { target_process_status: "MACHINED" }
              as: ProductionPlanner
            - call: "POST /toolworks/production-lots/${lot_id}/advance"
              payload: { target_process_status: "PLATED" }
              as: ProductionPlanner
            - call: "POST /toolworks/test-runs"
              payload: { lot_id: "${lot_id}", test_type: "SALT_SPRAY", specimen_count: 10, chamber_id: "${chamber_id}", window_start: "2026-08-04T00:00:00Z", window_end: "2026-08-06T00:00:00Z" }
              as: QualityEngineer
              captures: { s1_id: $.data.id }
          trigger:
            - call: "POST /toolworks/test-runs/${s1_id}/void"
              payload: { void_reason: "Chamber recalibration invalidated the booking" }
              as: QualityEngineer
              captures: { void_status: $.data.status, void_note: $.data.void_reason }
            - call: "POST /toolworks/test-runs"
              payload: { lot_id: "${lot_id}", test_type: "SALT_SPRAY", specimen_count: 24, chamber_id: "${chamber_id}", window_start: "2026-08-04T00:00:00Z", window_end: "2026-08-06T00:00:00Z" }
              as: QualityEngineer
              captures: { s2_id: $.data.id }
          assert:
            - "Before the void: ProductionLot.${lot_id}.specimens_committed == 10, specimens_available == 30, specimens_consumed == 0"
            - "Void returns HTTP 200 with TestRun.${s1_id}.status == 'VOID' and void_reason == 'Chamber recalibration invalidated the booking'"
            - "After the void: specimens_committed == 0, specimens_available == 40, specimens_consumed == 0 — the specimens returned to available, not to consumed"
            - "The 24-coupon run in the identical window is accepted with HTTP 201 (a VOID row occupies no chamber capacity)"
            - "After it: specimens_committed == 24, specimens_available == 16, and 40 == 16 + 24 + 0"
            - "GET /toolworks/test-runs?chamber_id=${chamber_id} returns total_count 2"

      - name: dismissed_report_cannot_later_be_confirmed
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.CounterfeitReport.OPEN_to_DISMISSED
          - validations[priority=408]
          - errors[ERR_REPORT_STATE_INVALID]
          - calculations.brand_risk_rollup
        distinguishing_aspect: "DISMISSED is terminal, so a dismissed report can never be promoted to CONFIRMED; its risk_points stay frozen on the row while contributing nothing to brand_risk_score, which is what keeps the posture ladder monotonic in confirmed evidence only."
        test_recipe:
          setup:
            - "One BRANDED WRENCH SKU and one OPEN CounterfeitReport on it with evidence_grade STRONG and unit_estimate 600 (risk_points 50)."
          setup_api_calls:
            - call: "POST /toolworks/tool-skus"
              payload: { sku_code: "WR-17-BR", tool_family: "WRENCH", channel: "BRANDED", nominal_size_mm: 17, alloy_grade: "CR_MO", list_price_cents: 3300, warranty_tier: "LIFETIME" }
              as: ChannelManager
              captures: { sku_id: $.data.id }
            - call: "POST /toolworks/counterfeit-reports"
              payload: { sku_id: "${sku_id}", channel_name: "OpenBazaar", seller_handle: "torque_deals_99", evidence_grade: "STRONG", unit_estimate: 600 }
              as: BrandProtectionAnalyst
              captures: { report_id: $.data.id, points: $.data.risk_points }
          trigger:
            - call: "POST /toolworks/counterfeit-reports/${report_id}/dismiss"
              payload: { dismissal_note: "Seller produced a valid distributor invoice" }
              as: BrandProtectionAnalyst
              as_user_id: "bp-1"
            - call: "POST /toolworks/counterfeit-reports/${report_id}/confirm"
              payload: { confirmation_note: "Reopening after new evidence" }
              as: BrandProtectionAnalyst
              as_user_id: "bp-1"
              captures: { e_state: $.data.error_id }
          assert:
            - "risk_points == 50 at creation ((30 + 20) * 1.0 for BRANDED)"
            - "Dismiss returns HTTP 200 with status == 'DISMISSED' and dismissal_note stored"
            - "Confirm returns HTTP 409 with error_id == 'ERR_REPORT_STATE_INVALID'"
            - "CounterfeitReport.${report_id}.status is still 'DISMISSED' and confirmation_note is null"
            - "ToolSku.${sku_id}.brand_risk_score == 0, confirmed_counterfeit_count == 0 and warranty_posture == 'OPEN'"

      - name: blocking_an_already_blocked_claimant_rejected
        claim_type: idempotency
        grounds:
          - state_machines.Claimant.ACTIVE_to_BLOCKED
          - validations[priority=409]
          - errors[ERR_CLAIMANT_STATE_INVALID]
        distinguishing_aspect: "The block action requires status ACTIVE, so the second block of the same claimant is ERR_CLAIMANT_STATE_INVALID (409) — distinct from ERR_CLAIMANT_BLOCKED, which is what a BLOCKED claimant's own claim attempt returns."
        test_recipe:
          setup:
            - "One ACTIVE CONSUMER claimant."
          setup_api_calls:
            - call: "POST /toolworks/claimants"
              payload: { email: "c1@example.com", claimant_type: "CONSUMER" }
              as: WarrantyAdministrator
              captures: { claimant_id: $.data.id }
          trigger:
            - call: "POST /toolworks/claimants/${claimant_id}/block"
              payload: { block_reason: "Repeated fraudulent submissions" }
              as: WarrantyAdministrator
            - call: "POST /toolworks/claimants/${claimant_id}/block"
              payload: { block_reason: "Repeated fraudulent submissions" }
              as: WarrantyAdministrator
              captures: { e_state: $.data.error_id }
          assert:
            - "First block: HTTP 200 with Claimant.${claimant_id}.status == 'BLOCKED' and version == 2"
            - "Second block: HTTP 409 with error_id == 'ERR_CLAIMANT_STATE_INVALID'"
            - "Claimant.${claimant_id}.version is still 2 (no side effect from the refused call)"

      - name: furnace_status_toggles_and_rejects_unchanged_value
        claim_type: invalid_transitions
        grounds:
          - state_machines.HeatTreatFurnace.AVAILABLE_to_MAINTENANCE
          - state_machines.HeatTreatFurnace.MAINTENANCE_to_AVAILABLE
          - validations[priority=411]
          - errors[ERR_FURNACE_STATUS_UNCHANGED]
        distinguishing_aspect: "The furnace machine is a two-state toggle with no self-edges: setting MAINTENANCE on a MAINTENANCE furnace is ERR_FURNACE_STATUS_UNCHANGED, while the round trip AVAILABLE -> MAINTENANCE -> AVAILABLE bumps version twice."
        test_recipe:
          setup:
            - "One AVAILABLE furnace qualified for CR_MO."
          setup_api_calls:
            - call: "POST /toolworks/heat-treat-furnaces"
              payload: { furnace_code: "FCE-1", max_charge_kg: 900, alloy_grades_supported: ["CR_MO"] }
              as: ProductionPlanner
              captures: { furnace_id: $.data.id }
          trigger:
            - call: "POST /toolworks/heat-treat-furnaces/${furnace_id}/status"
              payload: { status: "AVAILABLE" }
              as: ProductionPlanner
              captures: { e_same: $.data.error_id }
            - call: "POST /toolworks/heat-treat-furnaces/${furnace_id}/status"
              payload: { status: "MAINTENANCE" }
              as: ProductionPlanner
            - call: "POST /toolworks/heat-treat-furnaces/${furnace_id}/status"
              payload: { status: "MAINTENANCE" }
              as: ProductionPlanner
              captures: { e_same2: $.data.error_id }
            - call: "POST /toolworks/heat-treat-furnaces/${furnace_id}/status"
              payload: { status: "AVAILABLE" }
              as: ProductionPlanner
          assert:
            - "Setting AVAILABLE on an AVAILABLE furnace: HTTP 409 with error_id == 'ERR_FURNACE_STATUS_UNCHANGED'"
            - "Setting MAINTENANCE succeeds with HTTP 200, status == 'MAINTENANCE', version == 2"
            - "Setting MAINTENANCE again: HTTP 409 with error_id == 'ERR_FURNACE_STATUS_UNCHANGED' and version still 2"
            - "Setting AVAILABLE succeeds with status == 'AVAILABLE' and version == 3"

      - name: withdrawing_a_draft_pack_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.PackConfiguration.APPROVED_to_WITHDRAWN
          - validations[priority=406]
          - errors[ERR_PACK_STATE_INVALID]
        distinguishing_aspect: "Withdrawal is only defined from APPROVED; a DRAFT pack has no WITHDRAWN edge, so the request is ERR_PACK_STATE_INVALID and the pack stays available for member edits."
        test_recipe:
          setup:
            - "One BRANDED SKU and one DRAFT RETAIL_DISPLAY pack with one member."
          setup_api_calls:
            - call: "POST /toolworks/tool-skus"
              payload: { sku_code: "WR-17-BR", tool_family: "WRENCH", channel: "BRANDED", nominal_size_mm: 17, alloy_grade: "CR_MO", list_price_cents: 3300, warranty_tier: "LIFETIME" }
              as: ChannelManager
              captures: { sku_id: $.data.id }
            - call: "POST /toolworks/pack-configurations"
              payload: { pack_code: "PK-RD-1", pack_type: "RETAIL_DISPLAY", primary_sku_id: "${sku_id}" }
              as: ChannelManager
              captures: { pack_id: $.data.id }
            - call: "POST /toolworks/pack-configurations/${pack_id}/members"
              payload: { sku_id: "${sku_id}", quantity: 2 }
              as: ChannelManager
              captures: { member_id: $.data.id }
          trigger:
            - call: "POST /toolworks/pack-configurations/${pack_id}/withdraw"
              payload: { withdrawal_reason: "Retail programme cancelled" }
              as: ChannelManager
              captures: { e_state: $.data.error_id }
          assert:
            - "HTTP status == 409 with error_id == 'ERR_PACK_STATE_INVALID'"
            - "PackConfiguration.${pack_id}.status is still 'DRAFT' and distinct_member_count == 1"
            - "A further member append still succeeds afterwards, proving the pack was not locked by the refusal"

      - name: denied_claim_is_terminal_for_every_subsequent_action
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.WarrantyClaim.SUBMITTED_to_DENIED
          - state_machines.WarrantyClaim.terminal_states
          - validations[priority=407]
          - errors[ERR_CLAIM_STATE_INVALID]
        distinguishing_aspect: "DENIED is terminal: hold, approve and fulfill all return ERR_CLAIM_STATE_INVALID from it, and none of them reaches the OCC check, the posture check or the reserve ledger — the denial_code stays as written."
        test_recipe:
          setup:
            - "One BRANDED WRENCH SKU with warranty_tier LIFETIME, one programme funded 5000000 with threshold 60, one ACTIVE CONSUMER claimant."
            - "One claim on that SKU with one line, already DENIED with denial_code 'NO_DEFECT_FOUND'."
          setup_api_calls:
            - call: "POST /toolworks/tool-skus"
              payload: { sku_code: "WR-17-BR", tool_family: "WRENCH", channel: "BRANDED", nominal_size_mm: 17, alloy_grade: "CR_MO", list_price_cents: 3300, warranty_tier: "LIFETIME" }
              as: ChannelManager
              captures: { sku_id: $.data.id }
            - call: "POST /toolworks/warranty-programs"
              payload: { program_code: "LIFETIME-1", reserve_funded_cents: 5000000, fraud_score_threshold: 60 }
              as: WarrantyAdministrator
              captures: { prog_id: $.data.id }
            - call: "POST /toolworks/claimants"
              payload: { email: "c1@example.com", claimant_type: "CONSUMER" }
              as: WarrantyAdministrator
              captures: { claimant_id: $.data.id }
            - call: "POST /toolworks/warranty-claims"
              payload: { claimant_id: "${claimant_id}", sku_id: "${sku_id}", program_id: "${prog_id}", serial_code: "SN-0001", claim_reason: "BREAKAGE" }
              as: WarrantyAdministrator
              captures: { claim_id: $.data.id }
            - call: "POST /toolworks/warranty-claims/${claim_id}/lines"
              payload: { component_code: "HANDLE", component_list_price_cents: 1099, quantity: 1 }
              as: WarrantyAdministrator
            - call: "POST /toolworks/warranty-claims/${claim_id}/deny"
              payload: { denial_code: "NO_DEFECT_FOUND" }
              as: WarrantyAdministrator
              as_user_id: "wa-1"
            - call: "GET /toolworks/warranty-programs/${prog_id}"
              payload: {}
              as: WarrantyAdministrator
              captures: { prog_v: $.data.version }
          trigger:
            - call: "POST /toolworks/warranty-claims/${claim_id}/hold"
              payload: { hold_reason: "Late fraud signal" }
              as: WarrantyAdministrator
              as_user_id: "wa-2"
              captures: { e_hold: $.data.error_id }
            - call: "POST /toolworks/warranty-claims/${claim_id}/approve"
              payload: { expected_program_version: "${prog_v}" }
              as: WarrantyAdministrator
              as_user_id: "wa-2"
              captures: { e_approve: $.data.error_id }
            - call: "POST /toolworks/warranty-claims/${claim_id}/fulfill"
              payload: { shipment_ref: "UPS-1Z-0001" }
              as: WarrantyAdministrator
              as_user_id: "wa-2"
              captures: { e_fulfill: $.data.error_id }
          assert:
            - "Deny in setup returned HTTP 200 with status == 'DENIED' and denial_code == 'NO_DEFECT_FOUND'"
            - "All three trigger calls return HTTP 409 with error_id == 'ERR_CLAIM_STATE_INVALID'"
            - "WarrantyClaim.${claim_id}.status is still 'DENIED' and shipment_ref is null and hold_reason is null"
            - "WarrantyProgram.${prog_id}.reserve_balance_cents == 5000000 and open_hold_count == 0"
            - "ToolSku.${sku_id}.units_reserved == 0 (the refused approve moved no stock)"

      - name: quarantined_lot_cannot_be_released
        claim_type: precondition_enforcement
        grounds:
          - state_machines.ProductionLot.disposition.IN_PROCESS_to_QUARANTINED
          - validations[priority=402]
          - errors[ERR_LOT_QUARANTINED]
        distinguishing_aspect: "Quarantine is checked at priority 402 on release, ahead of both the already-dispositioned check (403) and the not-certified check (514): a lot rejected by a failed mandatory test returns ERR_LOT_QUARANTINED, never ERR_LOT_NOT_CERTIFIED, even though it is also uncertified."
        test_recipe:
          setup:
            - "One BRANDED WRENCH SKU, one CR_MO furnace, one lot advanced to HEAT_TREATED with specimen_pool_total 20."
            - "One mandatory HARDNESS run on that lot resolved to FAILED by readings [40.0, 41.0], which cascaded the lot to cert_status REJECTED and disposition QUARANTINED."
          setup_api_calls:
            - call: "POST /toolworks/tool-skus"
              payload: { sku_code: "WR-17-BR", tool_family: "WRENCH", channel: "BRANDED", nominal_size_mm: 17, alloy_grade: "CR_MO", list_price_cents: 3300, warranty_tier: "LIFETIME" }
              as: ChannelManager
              captures: { sku_id: $.data.id }
            - call: "POST /toolworks/heat-treat-furnaces"
              payload: { furnace_code: "FCE-1", max_charge_kg: 900, alloy_grades_supported: ["CR_MO"] }
              as: ProductionPlanner
              captures: { furnace_id: $.data.id }
            - call: "POST /toolworks/production-lots"
              payload: { sku_id: "${sku_id}", lot_code: "LOT-BR-A", unit_count: 500, specimen_pool_total: 20 }
              as: ProductionPlanner
              captures: { lot_id: $.data.id }
            - call: "POST /toolworks/furnace-campaigns"
              payload: { lot_id: "${lot_id}", furnace_id: "${furnace_id}", window_start: "2026-08-02T06:00:00Z", window_end: "2026-08-02T10:00:00Z", charge_kg: 800 }
              as: ProductionPlanner
              captures: { camp_id: $.data.id }
            - call: "POST /toolworks/furnace-campaigns/${camp_id}/complete"
              payload: { soak_minutes: 120 }
              as: ProductionPlanner
            - call: "POST /toolworks/production-lots/${lot_id}/advance"
              payload: { target_process_status: "HEAT_TREATED" }
              as: ProductionPlanner
            - call: "POST /toolworks/test-runs"
              payload: { lot_id: "${lot_id}", test_type: "HARDNESS", specimen_count: 2, window_start: "2026-08-03T08:00:00Z", window_end: "2026-08-03T09:00:00Z" }
              as: QualityEngineer
              captures: { run_id: $.data.id }
            - call: "POST /toolworks/test-runs/${run_id}/results"
              payload: { readings: [40.0, 41.0] }
              as: QualityEngineer
              captures: { run_status: $.data.status }
            - call: "GET /toolworks/tool-skus/${sku_id}"
              payload: {}
              as: ProductionPlanner
              captures: { sku_v: $.data.version }
          trigger:
            - call: "POST /toolworks/production-lots/${lot_id}/release"
              payload: { expected_sku_version: "${sku_v}" }
              as: ProductionPlanner
              captures: { e_quar: $.data.error_id }
          assert:
            - "The failed run: TestRun.${run_id}.status == 'FAILED', mean_reading == 40.5, requirement_value == 50.0, result_margin_pct == -19.00, mandatory == true"
            - "ProductionLot.${lot_id}.cert_status == 'REJECTED' and disposition == 'QUARANTINED'"
            - "Release returns HTTP 409 with error_id == 'ERR_LOT_QUARANTINED'"
            - "ToolSku.${sku_id}.units_received_total == 0 and units_on_hand == 0 (no stock was booked)"
            - "ProductionLot.${lot_id}.disposition is still 'QUARANTINED'"

      - name: parallel_process_and_cert_dimensions_move_independently
        claim_type: valid_transition
        grounds:
          - state_machines.ProductionLot.process_status
          - state_machines.ProductionLot.cert_status
          - complexity_profile.state_machine_shape
        excluded_because:
          difficulty_instance: non_linear_state_machine / lot_parallel_process_and_cert_dimensions_with_rework_cycle
          rationale: "The parallel-shape claim — the two dimensions advancing on different triggers and the rework cycle regressing both — is the whole subject of that §1.8 instance."

      - name: counterfeit_confirmation_cascade_to_claim_and_posture
        claim_type: side_effect_execution
        grounds:
          - state_machines.CounterfeitReport.OPEN_to_CONFIRMED
          - state_machines.WarrantyClaim.SUBMITTED_to_FRAUD_HOLD
        excluded_because:
          difficulty_instance: transitive_cascade / counterfeit_confirm_cascades_to_claim_fraud_hold
          rationale: "Every link of the cross-entity cascade (report -> SKU posture -> open claim -> programme hold counter -> claimant score) is asserted end-to-end there."

      - name: revoke_reverses_every_approval_side_effect
        claim_type: side_effect_execution
        grounds:
          - state_machines.WarrantyClaim.APPROVED_to_REVOKED
          - calculations.reserve_ledger
        excluded_because:
          difficulty_instance: compensating_invariant / warranty_reserve_money_conserved_across_approve_revoke
          rationale: "The compensation pattern (undo transition reverses all original side effects with zero drift) is asserted cent-exactly there."

  - section: calculations
    instances:

      - name: proof_torque_correct_result_across_family_alloy_and_channel
        claim_type: correct_result
        grounds:
          - calculations.proof_torque_requirement
          - calculations.proof_torque_requirement.constants.BASE_TORQUE_PER_MM
          - calculations.proof_torque_requirement.constants.ALLOY_FACTOR
          - calculations.proof_torque_requirement.constants.CHANNEL_FACTOR
        distinguishing_aspect: "Four SKUs pin every constant table at once: the family base rate, the alloy factor, the channel factor and the size-tier additive term, each producing a different literal (115.8 / 128.1 / 164.4 / 36.4) from the same pinned evaluation order."
        test_recipe:
          setup:
            - "Empty database; the four SKUs differ in exactly the inputs the formula consumes."
          setup_api_calls:
            - call: "POST /toolworks/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /toolworks/tool-skus"
              payload: { sku_code: "WR-17-BR", tool_family: "WRENCH", channel: "BRANDED", nominal_size_mm: 17, alloy_grade: "CR_MO", list_price_cents: 3300, warranty_tier: "LIFETIME" }
              as: ChannelManager
              captures: { t_wr_br: $.data.proof_torque_required_nm }
            - call: "POST /toolworks/tool-skus"
              payload: { sku_code: "WR-17-PR", tool_family: "WRENCH", channel: "PROFESSIONAL", nominal_size_mm: 17, alloy_grade: "CR_MO", list_price_cents: 4200, warranty_tier: "LIFETIME" }
              as: ChannelManager
              captures: { t_wr_pr: $.data.proof_torque_required_nm }
            - call: "POST /toolworks/tool-skus"
              payload: { sku_code: "SO-19-BR", tool_family: "SOCKET", channel: "BRANDED", nominal_size_mm: 19, alloy_grade: "CR_V", list_price_cents: 1500, warranty_tier: "LIFETIME" }
              as: ChannelManager
              captures: { t_so_br: $.data.proof_torque_required_nm }
            - call: "POST /toolworks/tool-skus"
              payload: { sku_code: "PL-10-PL", tool_family: "PLIER", channel: "PRIVATE_LABEL", nominal_size_mm: 10, alloy_grade: "S2", list_price_cents: 900, warranty_tier: "LIMITED_5Y" }
              as: ChannelManager
              captures: { t_pl_pl: $.data.proof_torque_required_nm }
          assert:
            - "t_wr_br == 115.8  (4.2 * 17 * 1.15 = 82.11 -> * 1.10 = 90.321 -> + 1.5 * 17 = 115.821 -> 115.8)"
            - "t_wr_pr == 128.1  (82.11 * 1.25 = 102.6375 -> + 25.5 = 128.1375 -> 128.1)"
            - "t_so_br == 164.4  (6.5 * 19 * 1.00 = 123.5 -> * 1.10 = 135.85 -> + 28.5 = 164.35 -> 164.4, round_half_up at 1 decimal)"
            - "t_pl_pl == 36.4   (2.8 * 10 * 1.30 = 36.4 -> * 1.00 -> + 0.0 because nominal_size_mm <= 10)"

      - name: proof_torque_floor_and_ceiling_clamps_applied_after_additive_term
        claim_type: constants_applied
        grounds:
          - calculations.proof_torque_requirement.constants.FLOOR_NM
          - calculations.proof_torque_requirement.constants.CEIL_NM
          - calculations.proof_torque_requirement.constants.SIZE_TIER_ADD
        distinguishing_aspect: "The clamp is the last step before rounding: a tiny PLIER whose raw value is 11.2 is lifted to the FLOOR_NM 12.0 and an 80 mm S2 PROFESSIONAL socket whose raw value is 1085.0 is cut to the CEIL_NM 900.0, while the mid-range SKU passes through unclamped."
        test_recipe:
          setup:
            - "Empty database; three SKUs straddling the floor, the middle band and the ceiling."
          setup_api_calls:
            - call: "POST /toolworks/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /toolworks/tool-skus"
              payload: { sku_code: "PL-04-PL", tool_family: "PLIER", channel: "PRIVATE_LABEL", nominal_size_mm: 4, alloy_grade: "CR_V", list_price_cents: 500, warranty_tier: "LIMITED_5Y" }
              as: ChannelManager
              captures: { t_floor: $.data.proof_torque_required_nm }
            - call: "POST /toolworks/tool-skus"
              payload: { sku_code: "SO-80-PR", tool_family: "SOCKET", channel: "PROFESSIONAL", nominal_size_mm: 80, alloy_grade: "S2", list_price_cents: 9900, warranty_tier: "LIFETIME" }
              as: ChannelManager
              captures: { t_ceil: $.data.proof_torque_required_nm }
            - call: "POST /toolworks/tool-skus"
              payload: { sku_code: "WR-17-BR", tool_family: "WRENCH", channel: "BRANDED", nominal_size_mm: 17, alloy_grade: "CR_MO", list_price_cents: 3300, warranty_tier: "LIFETIME" }
              as: ChannelManager
              captures: { t_mid: $.data.proof_torque_required_nm }
          assert:
            - "t_floor == 12.0 (raw 2.8 * 4 * 1.00 * 1.00 + 0.0 = 11.2, lifted to FLOOR_NM)"
            - "t_ceil == 900.0 (raw 6.5 * 80 * 1.30 * 1.25 = 845.0 plus 3.0 * 80 = 240.0 gives 1085.0, cut to CEIL_NM)"
            - "t_mid == 115.8 (inside the band, untouched by either clamp)"

      - name: test_outcome_boundaries_at_exact_requirement_and_one_step_below
        claim_type: precision
        grounds:
          - calculations.test_run_outcome
          - calculations.test_run_outcome.constants.HARDNESS_MIN_HRC
          - calculations.test_run_outcome.constants.DIM_TOLERANCE_MM
          - calculations.test_run_outcome.constants.SALT_SPRAY_MIN_HOURS
        distinguishing_aspect: "Three test types are driven to their requirement exactly: AT_LEAST types (HARDNESS 50.0, SALT_SPRAY 96) and the AT_MOST type (DIMENSIONAL 0.15) all PASS with result_margin_pct 0.00, and a HARDNESS mean one tenth below (49.9) FAILS with -0.20, so the comparison is inclusive on both sides of the sign flip."
        test_recipe:
          setup:
            - "One BRANDED WRENCH SKU, 17 mm, CR_MO (HARDNESS_MIN_HRC 50.0, SALT_SPRAY_MIN_HOURS 96)."
            - "One CR_MO furnace, one chamber with coupon_capacity 24 and one lot advanced to PLATED with specimen_pool_total 20."
          setup_api_calls:
            - call: "POST /toolworks/tool-skus"
              payload: { sku_code: "WR-17-BR", tool_family: "WRENCH", channel: "BRANDED", nominal_size_mm: 17, alloy_grade: "CR_MO", list_price_cents: 3300, warranty_tier: "LIFETIME" }
              as: ChannelManager
              captures: { sku_id: $.data.id }
            - call: "POST /toolworks/heat-treat-furnaces"
              payload: { furnace_code: "FCE-1", max_charge_kg: 900, alloy_grades_supported: ["CR_MO"] }
              as: ProductionPlanner
              captures: { furnace_id: $.data.id }
            - call: "POST /toolworks/salt-spray-chambers"
              payload: { chamber_code: "SSC-1", coupon_capacity: 24 }
              as: QualityEngineer
              captures: { chamber_id: $.data.id }
            - call: "POST /toolworks/production-lots"
              payload: { sku_id: "${sku_id}", lot_code: "LOT-BR-A", unit_count: 500, specimen_pool_total: 20 }
              as: ProductionPlanner
              captures: { lot_id: $.data.id }
            - call: "POST /toolworks/furnace-campaigns"
              payload: { lot_id: "${lot_id}", furnace_id: "${furnace_id}", window_start: "2026-08-02T06:00:00Z", window_end: "2026-08-02T10:00:00Z", charge_kg: 800 }
              as: ProductionPlanner
              captures: { camp_id: $.data.id }
            - call: "POST /toolworks/furnace-campaigns/${camp_id}/complete"
              payload: { soak_minutes: 120 }
              as: ProductionPlanner
            - call: "POST /toolworks/production-lots/${lot_id}/advance"
              payload: { target_process_status: "HEAT_TREATED" }
              as: ProductionPlanner
            - call: "POST /toolworks/production-lots/${lot_id}/advance"
              payload: { target_process_status: "MACHINED" }
              as: ProductionPlanner
            - call: "POST /toolworks/production-lots/${lot_id}/advance"
              payload: { target_process_status: "PLATED" }
              as: ProductionPlanner
          trigger:
            - call: "POST /toolworks/test-runs"
