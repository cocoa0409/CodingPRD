            - "NumberAssignment.${asg1_id}.status == SUSPENDED_BY_CUSTOMER"
            - "NumberAssignment.${asg2_id}.status == SUSPENDED_BY_CUSTOMER"
            - "Provider.${prov_id}.active_assigned_number_count == 0"
            - "Provider.${prov_id}.overdue_traceback_count == 1"
            - "Provider.${prov_id}.penalty_points == 8"
            - "Provider.${prov_id}.open_notice_count == 0"
            - "Provider.${prov_id}.rmd_filing_status == COMPLETE"
            - "Provider.${prov_id}.auth_posture == GATEWAY_LIMITED"
