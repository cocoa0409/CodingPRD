  # ===========================================================================
  # Rule 3 - non_linear_state_machine (cyclic agreement loop; branching
  # delivery fork - two different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: agreement_amendment_cycle_returns_signed
        grounds:
          - state_machines.PlantingAgreement.SIGNED_to_AMENDMENT_PROPOSED
          - state_machines.PlantingAgreement.AMENDMENT_PROPOSED_to_SIGNED
          - state_machines.AgreementAmendment.PROPOSED_to_REJECTED
          - concurrency_rules[amendment-propose-stale-agreement]
        distinguishing_aspect: |
          PlantingAgreement is cyclic: SIGNED -> AMENDMENT_PROPOSED -> SIGNED on
          amendment reject, with terms unchanged after the loop (committed 200,
          unit price 250) and a terminal REJECTED amendment left behind.
        test_recipe:
          setup:
            - "Standard chain through a SIGNED agreement (committed 200, price 250) for an APPROVED local farm"
          setup_api_calls:
            - { call: "POST /f2s/program-years", payload: { school_year_label: "Y1", start_date: "2026-07-01", end_date: "2027-06-24", local_radius_miles: 100, preference_model: "TIERED", grant_award_cents: 1000000, local_spend_target_pct: 30 }, as: DistrictProgramAdmin, captures: { yr: $.data.id } }
            - { call: "POST /f2s/program-years/${yr}/open", payload: {}, as: DistrictProgramAdmin }
            - { call: "POST /f2s/products", payload: { name: "Tomato", category: "PRODUCE", unit: "LB", season_start_week: 1, season_end_week: 20 }, as: DistrictProgramAdmin, captures: { prod: $.data.id } }
