        claim_type: Precondition Enforcement
        grounds:
          - state_machines.DraftingRequest.null_to_SUBMITTED.preconditions
          - errors[ERR_SESSION_NOT_CONVENED]
        distinguishing_aspect: "The null -> SUBMITTED precondition 'session.status == CONVENED' is enforced: filing against a PENDING session returns 409 ERR_SESSION_NOT_CONVENED and does not debit the member's priority slot ledger even though priority_flag is true."
        test_recipe:
          setup:
            - "One PENDING session (never convened); one HOUSE member with priority_slots_total 2."
