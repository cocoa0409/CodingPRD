            - { call: "POST /trading/blocks", payload: { security_id: "${sec}", side: BUY }, as: Trader, captures: { blk: $.data.id } }
            - { call: "POST /trading/blocks/${blk}/orders", payload: { order_id: "${o1}" }, as: Trader }
            - { call: "POST /trading/blocks/${blk}/route", payload: { broker_id: "${brk}" }, as: Trader }
            - { call: "POST /trading/blocks/${blk}/fills", payload: { fill_qty: 100, fill_price_cents: 1000, executed_at: "2026-08-01T09:00:00Z" }, as: ExecutionDesk }
            - { call: "GET /trading/blocks/${blk}", as: Trader, captures: { blk_v: $.data.version } }
            - { call: "POST /trading/blocks/${blk}/allocation-plans", payload: { method: PRO_RATA, expected_block_version: "${blk_v}" }, as: Trader, as_user_id: "trader-1", captures: { plan: $.data.id } }
            - { call: "POST /trading/allocation-plans/${plan}/propose", as: Trader }
          trigger:
            - { call: "POST /trading/allocation-plans/${plan}/approve", as: DeskAdmin, as_user_id: "admin-1", captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_FORBIDDEN; plan remains PROPOSED"]

      - name: missing_auth_headers_unauthenticated
        claim_type: rbac_denial
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "Requests without X-User-Role/X-User-ID are rejected ERR_UNAUTHENTICATED (401) before role checks."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /trading/orders", as: Trader, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_UNAUTHENTICATED (request sent with headers stripped by the test harness)"]

  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_plan_create_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[plan-create-stale-block]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on BlockOrder.version: plan create carrying a stale expected_block_version is rejected 412 ERR_STALE_VERSION; the correct version succeeds and itself increments block.version, staling prior readers; the supersede of the earlier non-terminal plan is the legitimate state change the OCC check protects."
        test_recipe:
          setup: ["Block filled 100@1000; block version observed as V via GET; plan1 created with V (succeeds, block.version := V+1, plan1 DRAFT)"]
          setup_api_calls:
            - { call: "POST /trading/accounts", payload: { account_code: "A1", display_name: "A1", account_type: DISCRETIONARY, custodian_name: "CUSTO" }, as: DeskAdmin, captures: { a1: $.data.id } }
            - { call: "POST /trading/securities", payload: { ticker: "ACME", asset_class: EQUITY, lot_size: 1, reference_price_cents: 1000 }, as: DeskAdmin, captures: { sec: $.data.id } }
            - { call: "POST /trading/brokers", payload: { broker_code: "BRK1", display_name: "B1", commission_rate_bp: 50, supported_asset_classes: [EQUITY] }, as: DeskAdmin, captures: { brk: $.data.id } }
            - { call: "POST /trading/orders", payload: { account_id: "${a1}", security_id: "${sec}", side: BUY, order_qty: 100, order_type: MARKET }, as: Trader, captures: { o1: $.data.id } }
            - { call: "POST /trading/orders/${o1}/compliance-check", as: ComplianceOfficer }
            - { call: "POST /trading/blocks", payload: { security_id: "${sec}", side: BUY }, as: Trader, captures: { blk: $.data.id } }
            - { call: "POST /trading/blocks/${blk}/orders", payload: { order_id: "${o1}" }, as: Trader }
            - { call: "POST /trading/blocks/${blk}/route", payload: { broker_id: "${brk}" }, as: Trader }
            - { call: "POST /trading/blocks/${blk}/fills", payload: { fill_qty: 100, fill_price_cents: 1000, executed_at: "2026-08-01T09:00:00Z" }, as: ExecutionDesk }
            - { call: "GET /trading/blocks/${blk}", as: Trader, captures: { blk_v: $.data.version } }
            - { call: "POST /trading/blocks/${blk}/allocation-plans", payload: { method: PRO_RATA, expected_block_version: "${blk_v}" }, as: Trader, as_user_id: "trader-1", captures: { p1: $.data.id } }
          trigger:
            - { call: "POST /trading/blocks/${blk}/allocation-plans", payload: { method: EQUAL_SPLIT, expected_block_version: "${blk_v}" }, as: Trader, as_user_id: "trader-2", captures: { err: $.data.error_id } }
            - { call: "GET /trading/blocks/${blk}", as: Trader, captures: { blk_v2: $.data.version } }
            - { call: "POST /trading/blocks/${blk}/allocation-plans", payload: { method: EQUAL_SPLIT, expected_block_version: "${blk_v2}" }, as: Trader, as_user_id: "trader-2", captures: { p2: $.data.id } }
            - { call: "GET /trading/allocation-plans/${p1}", as: Trader, captures: { p1_st: $.data.status } }
          assert:
            - "Stale create with the pre-plan1 version: HTTP 412 error_id == ERR_STALE_VERSION"
            - "Fresh create succeeds (201); BlockOrder.version incremented again (each write bumps by 1)"
            - "AllocationPlan.${p1}.status == SUPERSEDED (the legitimate supersede the OCC check sequenced)"

