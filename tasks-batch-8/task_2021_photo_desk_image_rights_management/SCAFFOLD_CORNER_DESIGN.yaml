          setup_api_calls:
            - { call: "POST /photographers", payload: { full_name: "Sam Staff", email: "sam@acme.news", photographer_type: "STAFF", day_rate_cents: 25000, per_image_fee_cents: 40000, royalty_rate_per_use_cents: 305 }, as: PhotoEditor, captures: { p_id: $.data.id } }
            - { call: "POST /images", payload: { source_type: "WIRE", agency_name: "WireCo", base_license_fee_cents: 10000, caption: "Flooded main street looking north", credit_line: "WireCo Staff / WireCo" }, as: RightsManager, captures: { w_id: $.data.id } }
          trigger:
            - { call: "POST /images/${w_id}/clear", payload: {}, as: Photographer, as_user_id: "${p_id}", captures: { err: $.data.error_id } }
