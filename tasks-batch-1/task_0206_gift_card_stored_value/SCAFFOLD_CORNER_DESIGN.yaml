  # ===========================================================================
  - section: validations
    instances:
      - name: missing_role_header_returns_unauthenticated
        claim_type: Violation → Error
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_UNAUTHENTICATED]"
        distinguishing_aspect: "A request with no X-User-Role header → ERR_UNAUTHENTICATED (401)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /v1/programs"
              payload: { name: "Acme" }
              as: Anonymous
              captures: { eid: $.data.error_id }
          assert:
            - "response.status == 401"
            - "${eid} == ERR_UNAUTHENTICATED"

      - name: reload_below_min_rejected
        claim_type: Violation → Error
        grounds:
          - "validations[priority=13]"
          - "errors[ERR_RELOAD_BELOW_MIN]"
        distinguishing_aspect: "Reloading 100 cents when reload_min_cents=500 → ERR_RELOAD_BELOW_MIN (409)."
        test_recipe:
          setup: ["an ACTIVE card; program reload_min_cents 500"]
          setup_api_calls:
            - call: "POST /v1/programs"
              payload: { name: "Acme", reload_min_cents: 500, reload_max_balance_cents: 100000 }
              as: ProgramAdmin
              captures: { prog: $.data.id }
            - call: "POST /v1/cards"
              payload: { program_id: "${prog}", form_factor: "DIGITAL", state_code: "FL" }
              as: StoreAssociate
              captures: { card: $.data.id }
            - call: "POST /v1/cards/${card}/activate"
              payload: { initial_load_cents: 2000 }
              as: StoreAssociate
          trigger:
            - call: "POST /v1/cards/${card}/reload"
              payload: { amount_cents: 100 }
              as: StoreAssociate
              captures: { eid: $.data.error_id }
          assert:
            - "response.status == 409"
            - "${eid} == ERR_RELOAD_BELOW_MIN"

      - name: reload_over_cap_rejected
        claim_type: Aggregate validation
        grounds:
          - "validations[priority=13]"
          - "errors[ERR_BALANCE_CAP_EXCEEDED]"
        distinguishing_aspect: "Reloading 5000 onto a card at settled 98000 (cap 100000) → post-credit 103000 > cap → ERR_BALANCE_CAP_EXCEEDED (409)."
        test_recipe:
          setup: ["an ACTIVE card at settled 98000; program cap 100000"]
          setup_api_calls:
