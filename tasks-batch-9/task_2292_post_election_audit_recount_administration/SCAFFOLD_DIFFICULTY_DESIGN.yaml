            - call: "POST /recounts"
              payload: { contest_id: "${c3_id}", expected_contest_version: "${c3_v2}", trigger_type: "CANDIDATE_REQUESTED", scope: "PARTIAL_BATCHES", scope_batch_ids: ["${cb31_id}"], requested_by_candidate_name: "GRANT" }
              as: CandidateRepresentative
