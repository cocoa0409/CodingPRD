  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: listing_activation_requires_lot_in_stock
        grounds:
          - state_machines.Listing.DRAFT_to_ACTIVE
          - calculations.lot_posture_derivation
        distinguishing_aspect: |
          Pair Listing -> Lot: with an ACTIVE listing already on the lot, lot posture
          is LISTED, so activating a second DRAFT listing on the same lot is rejected
          ERR_LOT_NOT_IN_STOCK — the Listing transition is gated by the Lot's derived
          state, not by anything on the listing row itself.
        test_recipe:
          setup:
            - "BROKER_OWNED lot L13 qty 10 cost 4000 with listing A ACTIVE and listing B DRAFT asking 8000"
          setup_api_calls:
            - call: "POST /sellers"
              payload: { name: "Mike Micros", contact_email: "mike@x.com" }
              as: BrokerOps
              captures: { s13_id: $.data.id }
            - call: "POST /storage-bins"
              payload: { bin_code: "BIN-M1", capacity_units: 50 }
              as: BrokerOps
              captures: { bin13_id: $.data.id }
            - call: "POST /buy-offers"
              payload: { seller_id: "${s13_id}", mpn: "2N2222", quantity: 10, ask_price_per_unit_cents: 4000, provenance_doc_url: "https://docs.x.com/p13.pdf" }
              as: Seller
              as_user_id: "${s13_id}"
              captures: { o13_id: $.data.id }
            - call: "POST /buy-offers/${o13_id}/accept"
              payload: { agreed_unit_price_cents: 4000, acquisition_mode: "BROKER_OWNED" }
              as: BrokerOps
            - call: "POST /buy-offers/${o13_id}/receive"
              payload: {}
              as: BrokerOps
            - call: "POST /buy-offers/${o13_id}/inspect"
