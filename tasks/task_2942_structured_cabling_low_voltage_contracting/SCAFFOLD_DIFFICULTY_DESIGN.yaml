              as_user_id: "user-installer-01"
              captures: { err: $.data.error_id }
          assert:
            - "GET /cabling/links/${link_ok} returns permanent_link_length_m == 90.00 and channel_length_m == 92.40"
            - "GET /cabling/links/${link_over} returns permanent_link_length_m == 90.01 and channel_length_m == 92.41"
            - "the first pull returns 200 with install_state == \"PULLED\" and installer_user_id == \"user-installer-01\""
            - "the second pull returns 422 with error_id == \"ERR_LINK_LENGTH_EXCEEDED\""
            - "GET /cabling/links/${link_over} after the trigger still returns install_state == \"DESIGNED\" and installer_user_id == null"

      - name: zero_link_project_certification_summary_is_the_empty_set_boundary
        grounds:
          - calculations.project_certification_rollup
          - calculations.project_as_built_cost
          - calculations.warranty_coverage_determination
          - endpoints["GET /cabling/projects/{project_id}/certification-summary"]
        distinguishing_aspect: |
          Empty-input-set boundary rather than a threshold-equality boundary: a project with zero
          Link rows must report completeness_pct_strict 0.00 (not 100.00 from a vacuous
          all-certified reading, and not a division-by-zero failure),
          completeness_pct_provisional 0.00, as_built_cost_cents 0 and warranty_status
          NOT_ELIGIBLE.
        test_recipe:
          setup:
            - "A freshly created project RVT1 with no telecom rooms, no pathway segments and no links"
          setup_api_calls:
            - call: "POST /cabling/projects"
              payload: { name: "Riverside Tower Cabling", site_code: "RVT1", plenum_ceiling: true, identifier_scheme: "TIA_606_CLASS_1" }
              as: ProjectManager
              captures: { proj: $.data.id }
          trigger:
            - call: "GET /cabling/projects/${proj}/certification-summary"
              payload: {}
              as: ProjectManager
          assert:
            - "the response has total_link_count == 0 and certified_link_count == 0"
            - "the response has completeness_pct_strict == 0.00 and completeness_pct_provisional == 0.00"
            - "the response has as_built_cost_cents == 0 and consumed_mac_cents == 0"
            - "the response has warranty_status == \"NOT_ELIGIBLE\""
            - "the request returns 200 and no error_id, so the empty set is not a failure"

      - name: grounding_resistance_at_five_thousand_milliohms_is_the_inclusive_boundary
        grounds:
          - calculations.grounding_compliance_evaluation
          - state_machines.TelecomRoom.ROUGH_IN_to_GROUNDED
          - state_machines.TelecomRoom.GROUNDED_to_ROUGH_IN
        distinguishing_aspect: |
          A different constant, unit, precision and endpoint from the length boundary:
          MAX_GROUND_RESISTANCE_MILLIOHMS 5000 measured to 2 decimal places on POST
          /cabling/telecom-rooms/{room_id}/grounding-verification. Exactly 5000 grades COMPLIANT
          and promotes the room to GROUNDED; 5000.01 grades NON_COMPLIANT and demotes it back to
          ROUGH_IN, and the demotion is a recorded self-consistent write rather than an error.
        test_recipe:
          setup:
            - "Project RVT1 with telecom room TR01 in room_state ROUGH_IN and grounding_status UNVERIFIED"
          setup_api_calls:
            - call: "POST /cabling/projects"
              payload: { name: "Riverside Tower Cabling", site_code: "RVT1", plenum_ceiling: true, identifier_scheme: "TIA_606_CLASS_1" }
              as: ProjectManager
              captures: { proj: $.data.id }
            - call: "POST /cabling/telecom-rooms"
              payload: { project_id: "${proj}", room_code: "TR01", floor: 3, branch_circuit_amps: 20, ups_capacity_va: 3000 }
              as: ProjectManager
              captures: { room: $.data.id }
          trigger:
            - call: "POST /cabling/telecom-rooms/${room}/grounding-verification"
              payload: { tgb_installed: true, bonding_conductor_awg: 6, ground_resistance_milliohms: 5000 }
              as: ProjectManager
            - call: "POST /cabling/telecom-rooms/${room}/grounding-verification"
              payload: { tgb_installed: true, bonding_conductor_awg: 6, ground_resistance_milliohms: 5000.01 }
              as: ProjectManager
          assert:
            - "GET /cabling/telecom-rooms/${room} before the trigger returns room_state == \"ROUGH_IN\" and grounding_status == \"UNVERIFIED\""
            - "the first verification response has grounding_status == \"COMPLIANT\", room_state == \"GROUNDED\" and ground_resistance_milliohms == 5000.00"
            - "the second verification response has grounding_status == \"NON_COMPLIANT\", room_state == \"ROUGH_IN\" and ground_resistance_milliohms == 5000.01"
            - "the second verification returns 200 and no error_id, and GET /cabling/telecom-rooms/${room} returns a version 2 greater than the version returned before the trigger"

