              as: TaxPreparer
              captures: { ar_id: "$.data.id" }
            - call: "POST /amended-returns/${ar_id}/prepare"
              payload: {}
              as: TaxPreparer
              as_user_id: "u_prep_alex"
            - call: "POST /amended-returns/${ar_id}/sign"
              payload: {}
              as: TaxOfficer
              as_user_id: "u_sign_bo"
            - call: "POST /amended-returns/${ar_id}/submit"
              payload: {}
              as: TaxOfficer
              as_user_id: "u_sign_bo"
            - call: "POST /amended-returns/${ar_id}/agency-outcome"
              payload: { outcome: "ACCEPTED" }
              as: TaxOfficer
              as_user_id: "u_sign_bo"
            - call: "GET /control-remediations"
              payload: { correction_case_id: "${case_id}" }
              as: ControlsAuditor
              captures: { rem_id: "$.data[0].id" }
            - call: "POST /control-remediations/${rem_id}/assign"
              payload: { owner_user_id: "u_owner_cass" }
              as: ControlsAuditor
              as_user_id: "u_audit_dee"
            - call: "POST /control-remediations/${rem_id}/submit-verification"
              payload: { evidence_reference: "EV-2025Q1-001" }
              as: ControlsAuditor
              as_user_id: "u_owner_cass"
            - call: "POST /control-remediations/${rem_id}/verify"
              payload: { passed: true }
              as: ControlsAuditor
              as_user_id: "u_audit_dee"
          trigger:
            - call: "POST /correction-cases/${case_id}/close"
              payload: { closure_note: "Filing amended and control remediated." }
              as: TaxOfficer
              as_user_id: "u_sign_bo"
            - call: "POST /wage-repayments/${rp_id}/write-off"
              payload: { write_off_reason: "Employee separated; arrangement abandoned before agreement." }
              as: TaxOfficer
              as_user_id: "u_sign_bo"
            - call: "POST /correction-cases/${case_id}/close"
              payload: { closure_note: "Filing amended, control remediated, repayment cancelled." }
              as: TaxOfficer
              as_user_id: "u_sign_bo"
          assert:
            - "the first close returns HTTP 409 with error_id ERR_REPAYMENT_NOT_SETTLED"
            - "the refusal is not the remediation gate: ControlRemediation.${rem_id}.status == VERIFIED at that moment"
            - "after the refusal CorrectionCase.${case_id}.status is still REMEDIATION_PENDING with closed_at null"
            - "the write-off on a PROPOSED arrangement returns HTTP 200 with WageRepayment.${rp_id}.status == CANCELLED"
            - "the second close returns HTTP 200 with status CLOSED and closed_at == 2026-04-30T00:00:00Z"
            - "Employer.${emp_id}.open_exposure_cents == 0 after closure, down from 335625"
            - "CorrectionCase.${case_id}.repayment_recovered_cents == 0, because a cancelled arrangement recovers nothing"

      - name: window_and_buffer_and_slot_errors_have_their_own_probes
        claim_type: Error triggerability
        grounds:
          - errors.ERR_AMENDMENT_WINDOW_CLOSED
          - errors.ERR_AMENDMENT_COOLING_OFF_ACTIVE
          - errors.ERR_AMENDMENT_SLOT_OCCUPIED
        excluded_because:
          difficulty_instance: state_check_precedes_temporal_window_on_unsigned_late_submit
          rationale: "ERR_AMENDMENT_WINDOW_CLOSED is asserted there on the boundary day and the day after, ERR_AMENDMENT_COOLING_OFF_ACTIVE is asserted at min_days-1 and min_days by cooling_off_buffer_admits_exactly_min_days_between_amendments, and ERR_AMENDMENT_SLOT_OCCUPIED is asserted for every occupying status by amendment_slot_capacity_one_per_case_and_form_code."

      - name: remediation_gate_error_has_its_own_probe
        claim_type: Error triggerability
        grounds:
          - errors.ERR_REMEDIATION_NOT_VERIFIED
        excluded_because:
          difficulty_instance: case_close_depends_on_every_remediation_reaching_verified
          rationale: "That instance closes the same case twice — once with a second remediation still OPEN (409 ERR_REMEDIATION_NOT_VERIFIED) and once after it reaches VERIFIED — so the error is already asserted from both sides of its gate."

      - name: account_period_overlap_error_has_its_own_probe
        claim_type: Error triggerability
        grounds:
          - errors.ERR_ACCOUNT_PERIOD_OVERLAP
        excluded_because:
          difficulty_instance: agency_account_quarter_ranges_reject_overlap_but_admit_adjacency
          rationale: "That instance asserts the 409 for a one-quarter overlap and a 201 for the adjacent successor on the same employer-and-agency pair, which is the full boundary pair for this error."

  - section: rbac
    instances:

      - name: call_with_missing_x_user_role_header_returns_unauthenticated
        claim_type: Authentication
        grounds:
          - validations.priority_1
          - errors.ERR_UNAUTHENTICATED
          - endpoints.POST_/_clock/set_current_utc
        distinguishing_aspect: "Priority 1 sits above the role check, so a request with no identity headers is 401 and never 403; the clock endpoint is the single declared exemption and must still work with no headers at all."
        test_recipe:
          setup:
            - "No rows are needed: the header check precedes every existence and schema check."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-30T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /employers"
              payload: {}
              as: "(no X-User-ID and no X-User-Role header)"
            - call: "POST /employers"
              payload: { legal_name: "Acme Manufacturing", fein: "12-3456789", deposit_schedule: "MONTHLY", authorization_limit_cents: 5000000 }
              as: "(X-User-Role present, X-User-ID empty string)"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: "(no X-User-ID and no X-User-Role header)"
          assert:
            - "the headerless list returns HTTP 401 with error_id ERR_UNAUTHENTICATED"
            - "the empty-X-User-ID create returns HTTP 401 with error_id ERR_UNAUTHENTICATED, not 400 and not 403"
            - "no Employer row was created by the 401'd create"
            - "the headerless clock call returns HTTP 200 and the logical clock reads 2026-05-01T00:00:00Z afterwards"

      - name: payroll_analyst_creating_an_employer_is_forbidden
        claim_type: Role exclusivity
        grounds:
          - validations.priority_2
          - errors.ERR_FORBIDDEN_ROLE
          - rbac.PlatformAdmin
          - rbac.ControlsAuditor
          - rbac.TaxPreparer
        distinguishing_aspect: "The role check runs before existence and schema checks, so each of these refusals must be 403 even though two of them also carry a fabricated case id and would otherwise have been 404; an unknown role string is refused by the same rule."
        test_recipe:
          setup:
            - "No rows are needed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-30T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /employers"
              payload: { legal_name: "Acme Manufacturing", fein: "12-3456789", deposit_schedule: "MONTHLY", authorization_limit_cents: 5000000 }
              as: PayrollAnalyst
            - call: "POST /control-remediations"
              payload: { correction_case_id: "00000000-0000-0000-0000-000000009901", root_cause_code: "RATE_TABLE_STALE", control_gap_class: "PROCESS_CONTROL", owner_user_id: "u_owner_cass", target_date: "2026-06-30" }
              as: TaxPreparer
            - call: "POST /corrected-wage-statements"
              payload: { correction_case_id: "00000000-0000-0000-0000-000000009901", employee_id: "00000000-0000-0000-0000-000000009902", tax_year: 2025, delivery_channel: "MAIL" }
              as: PayrollAnalyst
            - call: "GET /employers"
              payload: {}
              as: "TaxWizard (not one of the seven declared roles)"
          assert:
            - "the employer create returns HTTP 403 with error_id ERR_FORBIDDEN_ROLE"
            - "the remediation create returns HTTP 403 with error_id ERR_FORBIDDEN_ROLE and NOT 404 for the fabricated case id"
            - "the statement create returns HTTP 403 with error_id ERR_FORBIDDEN_ROLE and NOT 404 for the fabricated case and employee ids"
            - "the undeclared role returns HTTP 403 with error_id ERR_FORBIDDEN_ROLE"
            - "no Employer, ControlRemediation or CorrectedWageStatement row exists afterwards"

      - name: employer_rep_with_an_unresolvable_identity_is_forbidden
        claim_type: Entity-backed identity
        grounds:
          - validations.priority_3
          - errors.ERR_IDENTITY_NOT_RESOLVABLE
        distinguishing_aspect: "For entity-backed roles the X-User-ID is itself a foreign key: an EmployerRep whose id names no Employer is 403 ERR_IDENTITY_NOT_RESOLVABLE, which is deliberately distinct from the 404 ERR_EMPLOYER_NOT_FOUND that the same UUID in the path would produce."
        test_recipe:
          setup:
            - "One employer exists."
          setup_api_calls:
            - call: "POST /employers"
              payload: { legal_name: "Acme Manufacturing", fein: "12-3456789", deposit_schedule: "MONTHLY", authorization_limit_cents: 5000000 }
              as: PlatformAdmin
              captures: { emp_id: "$.data.id" }
          trigger:
            - call: "GET /employers/${emp_id}"
              payload: {}
              as: EmployerRep
              as_user_id: "00000000-0000-0000-0000-000000009903"
            - call: "GET /employers/${emp_id}"
              payload: {}
              as: EmployerRep
              as_user_id: "${emp_id}"
          assert:
            - "the unresolvable-identity read returns HTTP 403 with error_id ERR_IDENTITY_NOT_RESOLVABLE"
            - "the identity check fires before the path lookup, so the 403 is returned even though the addressed employer exists"
            - "the self read with the resolvable identity returns HTTP 200 with data.id == ${emp_id}"

      - name: employer_rep_cannot_read_another_employers_case
        claim_type: Scope ownership
        grounds:
          - validations.priority_4
          - errors.ERR_NOT_RESOURCE_OWNER
        distinguishing_aspect: "Ownership is evaluated over the row's employer_id chain rather than the endpoint: the same GET is 200 for the rep's own case and 403 for the sibling employer's case, and an EmployeeSelfService caller is scoped to its own employee_id in the same way."
        test_recipe:
          setup:
            - "Two employers, Acme and Borealis, one federal agency, one OPEN 2025 Q1 case for each employer, and one employee on Acme."
          setup_api_calls:
            - call: "POST /employers"
              payload: { legal_name: "Acme Manufacturing", fein: "12-3456789", deposit_schedule: "MONTHLY", authorization_limit_cents: 5000000 }
              as: PlatformAdmin
              captures: { emp_a_id: "$.data.id" }
            - call: "POST /employers"
              payload: { legal_name: "Borealis Foods", fein: "98-7654321", deposit_schedule: "MONTHLY", authorization_limit_cents: 5000000 }
              as: PlatformAdmin
              captures: { emp_b_id: "$.data.id" }
            - call: "POST /tax-agencies"
              payload: { agency_code: "FED-941", level: "FEDERAL", jurisdiction_code: "US", interest_rate_bps_annual: 800, interest_method: "STATUTORY_DAILY", penalty_multiplier_bps: 10000, min_days_between_amendments: 30, amendment_window_days: 1095, requires_registration: false }
              as: PlatformAdmin
              captures: { fed_id: "$.data.id" }
            - call: "POST /correction-cases"
              payload: { employer_id: "${emp_a_id}", agency_id: "${fed_id}", tax_year: 2025, quarter: 1 }
              as: PayrollAnalyst
              captures: { case_a_id: "$.data.id" }
            - call: "POST /correction-cases"
              payload: { employer_id: "${emp_b_id}", agency_id: "${fed_id}", tax_year: 2025, quarter: 1 }
              as: PayrollAnalyst
              captures: { case_b_id: "$.data.id" }
            - call: "POST /employees"
              payload: { employer_id: "${emp_a_id}", full_name: "Dana Reed", national_id_last4: "4821", mailing_state_code: "NY" }
              as: PayrollAnalyst
              captures: { e1_id: "$.data.id" }
          trigger:
            - call: "GET /correction-cases/${case_a_id}"
              payload: {}
              as: EmployerRep
              as_user_id: "${emp_a_id}"
            - call: "GET /correction-cases/${case_b_id}"
              payload: {}
              as: EmployerRep
              as_user_id: "${emp_a_id}"
            - call: "GET /employees/${e1_id}"
              payload: {}
              as: EmployeeSelfService
              as_user_id: "${e1_id}"
            - call: "GET /correction-cases/${case_a_id}"
              payload: {}
              as: PayrollAnalyst
          assert:
            - "the rep's own case read returns HTTP 200"
            - "the sibling employer's case read returns HTTP 403 with error_id ERR_NOT_RESOURCE_OWNER, not 404"
            - "the employee's self read returns HTTP 200 with data.id == ${e1_id}"
            - "the staff role reads the same case with HTTP 200, so the restriction applies only to entity-backed roles"

      - name: remediation_owner_cannot_verify_their_own_remediation
        claim_type: Segregation of duties
        grounds:
          - validations.priority_56
          - errors.ERR_SEGREGATION_OF_DUTIES_VIOLATION
          - complexity_profile.role_model
        distinguishing_aspect: "The duty split is between owner_user_id and the acting X-User-ID on the verify call, not between roles: the same ControlsAuditor role performs both steps legitimately, and only the identity collision is refused — after which a different auditor verifies the very same evidence."
