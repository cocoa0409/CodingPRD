            - call: "POST /sessions"
              payload: { patient_id: "${pid}", order_id: "${oid}", station_id: "${sid}", shift_id: "${shid}", service_date: "2026-06-01", expected_patient_version: "${pv0}" }
              as: Scheduler
              captures: { sess: $.data.id }
            - call: "POST /sessions/${sess}/check-in"
              payload: {}
              as: Scheduler
          trigger:
            - call: "POST /sessions/${sess}/complete"
              payload: {}
              as: Scheduler
              captures: { billed: $.data.billed_amount_cents, st: $.data.clinical_status }
          assert:
            - "data.billed_amount_cents == 28500 and data.clinical_status == COMPLETED in the same response"
