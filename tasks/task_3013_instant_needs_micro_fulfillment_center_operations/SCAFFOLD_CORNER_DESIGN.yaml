            - call: "POST /mfc/_clock/set_current_utc"
              payload: { current_utc: "2026-12-25T00:00:00Z" }
              as: SiteOps
              captures: { clock_now: $.data.current_utc }
          assert:
            - "the response echoes current_utc == \"2026-12-25T00:00:00Z\""
            - "before any set call the clock reads 2026-09-01T00:00:00Z (startup default, asserted via a customer age computation in the pre-screen corner)"

