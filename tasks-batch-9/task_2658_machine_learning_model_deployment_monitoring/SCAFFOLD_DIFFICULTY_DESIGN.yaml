              payload: {}
              as: ReliabilityEngineer
              as_user_id: "u_rel_1"
              captures: { t_final: $.data.traffic_pct, i_final: $.data.ramp_step_index }
          assert:
            - "before the drift report: rollout_state 'RAMPING', health_state 'HEALTHY', traffic_pct 15.00, ramp_step_index 2"
            - "the WARN report moves ONLY the health dimension: DriftReport.${dr_id}.severity == 'WARN', Deployment.${d1_id}.health_state == 'DEGRADED', rollout_state still 'RAMPING', traffic_pct still 15.00"
            - "the DEGRADED ramp halves with truncation: nominal 35, raw 20.00, capped floor_2(20 * 0.5) == 10.00, so traffic_pct == 25.00 and ramp_step_index STAYS 2 (25.00 != 35)"
            - "the TrafficRampStep written by that ramp carries delta_pct 10.00, step_index 2 and health_state_at_step 'DEGRADED'"
            - "HOLD moves ONLY the rollout dimension: rollout_state == 'HELD', traffic_pct still 25.00, health_state still 'DEGRADED'"
            - "closing the second window recovers ONLY the health dimension: MonitoringWindow.${w2_id}.health_score == 94.60 (>= HEALTH_RECOVERY_MIN_SCORE 80.00), Deployment.${d1_id}.health_state == 'HEALTHY', rollout_state still 'HELD'"
            - "RESUME returns rollout_state to 'RAMPING' with traffic_pct unchanged at 25.00 and health_state still 'HEALTHY'"
            - "the post-recovery ramp is NOT halved: nominal 35, raw 10.00, granted 10.00 -> traffic_pct == 35.00 and ramp_step_index advances to 3"
            - "the same trigger (POST /deployments/{id}/ramp) produced 10.00 while DEGRADED at idx 2 and 10.00 landing exactly on 35.00 while HEALTHY — the index advanced only in the second case"
            - "the two dimensions never interfere: at no point does HOLD change health_state, nor does a window close change rollout_state"

      - name: challenger_evaluation_inconclusive_extend_cycle
        grounds:
          - state_machines.ChallengerEvaluation
          - state_machines.ChallengerEvaluation.COLLECTING_to_INCONCLUSIVE
          - state_machines.ChallengerEvaluation.INCONCLUSIVE_to_COLLECTING
          - entities.ChallengerEvaluation.fields.extension_count
          - entities.ChallengerEvaluation.fields.reserved_samples
          - entities.ChallengerEvaluation.fields.evaluation_ends_at
          - calculations.evaluation_sample_ledger
          - validations.priority_56
        distinguishing_aspect: |
          A different entity from the Deployment instance, and non-linear in a different way: the
          COLLECTING -> INCONCLUSIVE -> COLLECTING loop is a BOUNDED CYCLE whose bound lives in a
          counter (extension_count < 2), so the very same trigger (extend) succeeds twice and then
          returns 409 forever, leaving the row parked in a non-terminal INCONCLUSIVE state that is
