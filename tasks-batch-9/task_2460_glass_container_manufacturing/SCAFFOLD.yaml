    roles: [MoldEngineer]
    code: 200
    input: []
    output: MoldSet
    side_effects: ["subtracts cavity_count from FormingMachine.mounted_cavities", "clears forming_machine_id", "increments FormingMachine.version by 1"]
  - method: POST
