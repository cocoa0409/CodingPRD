              as: PlatformAdmin
              captures: { est1: $.data.estimate_units, delta1: $.data.restatement_delta_units, st1: $.data.status }
          assert:
            - "first recompute estimate_units == 1000 and restatement_delta_units is null"
            - "after suspension the cell is PENDING_RESTATEMENT; second recompute estimate_units == 2000"
            - "restatement_delta_units == 1000 (signed: 2000 - 1000) and status returns to CURRENT"

