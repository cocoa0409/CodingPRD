# PRD Benchmark Scaffold — §1.9 Corner Design (Coverage Index)
# Single top-level key scaffold_corner_design. Breadth coverage beyond §1.8.

scaffold_corner_design:

  - section: entities
    instances:
      - name: manufacturer_creation_returns_201_and_id
        claim_type: creation
        grounds: ["entities.Manufacturer"]
        distinguishing_aspect: "POST /manufacturers with all required fields returns 201 with server-minted id and status=ACTIVE."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /manufacturers", payload: { legal_name: "Mk Corp", duns: "303030303", manufacturer_type: "SOFTWARE_PUBLISHER", headquarters_country: "US" }, as: PlatformAdmin, captures: { m_id: "$.data.id" } }
          assert:
            - "status == 201"
            - "Manufacturer.${m_id}.status == ACTIVE"
            - "Manufacturer.${m_id}.id is a UUID (no type prefix)"

      - name: manufacturer_duns_uniqueness
        claim_type: type_constraint
        grounds: ["entities.Manufacturer.fields.duns", "errors[ERR_UNIQUENESS_VIOLATION\"]"]
        distinguishing_aspect: "Duplicate duns rejected with ERR_UNIQUENESS_VIOLATION 409."
        test_recipe:
          setup: ["Manufacturer with duns=404040404 exists"]
          setup_api_calls:
            - { call: "POST /manufacturers", payload: { legal_name: "First", duns: "404040404", manufacturer_type: "SOFTWARE_PUBLISHER", headquarters_country: "US" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /manufacturers", payload: { legal_name: "Second", duns: "404040404", manufacturer_type: "CLOUD_SAAS", headquarters_country: "GB" }, as: PlatformAdmin }
          assert: ["error_id == ERR_UNIQUENESS_VIOLATION", "http_status == 409"]

      - name: agreement_posture_computed_default_good_standing
        claim_type: computed_field
        grounds: ["entities.ManufacturerAgreement.fields.posture"]
        distinguishing_aspect: "posture is computed; input value ignored on create."
        test_recipe:
          setup: ["Manufacturer M ACTIVE"]
          setup_api_calls:
            - { call: "POST /manufacturers", payload: { legal_name: "P Corp", duns: "414141414", manufacturer_type: "SOFTWARE_PUBLISHER", headquarters_country: "US" }, as: PlatformAdmin, captures: { m_id: "$.data.id" } }
          trigger:
            - { call: "POST /agreements", payload: { manufacturer_id: "${m_id}", scope_tiers: ["FEDERAL"], mfc_discount_pct: 0.20, small_business_goal_pct: 0.10, product_scope: ["SW-"], term_start: "2026-01-01T00:00:00Z", term_end: "2027-01-01T00:00:00Z" }, as: ContractsManager, captures: { a_id: "$.data.id" } }
          assert:
            - "ManufacturerAgreement.${a_id}.posture == GOOD_STANDING"
            - "ManufacturerAgreement.${a_id}.status == DRAFT"
            - "ManufacturerAgreement.${a_id}.dispute_credit_cents == 0"

      - name: order_total_computed_input_ignored
        claim_type: computed_field
        grounds: ["entities.Order.fields.order_total_cents"]
        distinguishing_aspect: "order_total_cents derived from lines; client-supplied value (if any) ignored."
        test_recipe:
          setup: ["Full chain to ACTIVE price list (single SKU SW-1 offered=10000)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /manufacturers", payload: { legal_name: "C Corp", duns: "424242424", manufacturer_type: "SOFTWARE_PUBLISHER", headquarters_country: "US" }, as: PlatformAdmin, captures: { m_id: "$.data.id" } }
            - { call: "POST /agreements", payload: { manufacturer_id: "${m_id}", scope_tiers: ["FEDERAL"], mfc_discount_pct: 0.20, small_business_goal_pct: 0.10, product_scope: ["SW-"], term_start: "2026-01-01T00:00:00Z", term_end: "2027-01-01T00:00:00Z" }, as: ContractsManager, captures: { a_id: "$.data.id" } }
            - { call: "POST /agreements/${a_id}/activate", payload: {}, as: ContractsManager }
            - { call: "POST /vehicles", payload: { agreement_id: "${a_id}", vehicle_kind: "FED_SCHEDULE", buyer_tiers: ["FEDERAL"], ceiling_cents: 100000000, taa_required: false, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: ContractsManager, captures: { v_id: "$.data.id" } }
            - { call: "POST /vehicles/${v_id}/authorize", payload: {}, as: ContractsManager }
            - { call: "POST /price-lists", payload: { vehicle_id: "${v_id}", period_from: "2026-01-01T00:00:00Z", period_to: "2027-01-01T00:00:00Z", lines: [{ sku: "SW-1", basis_price_cents: 20000, offered_price_cents: 10000, origin_country: "US" }] }, as: ContractsManager, captures: { pl_id: "$.data.id" } }
            - { call: "POST /price-lists/${pl_id}/submit", payload: {}, as: ContractsManager }
            - { call: "POST /price-lists/${pl_id}/activate", payload: {}, as: ComplianceOfficer }
          trigger:
            - { call: "POST /orders", payload: { vehicle_id: "${v_id}", price_list_id: "${pl_id}", buyer_tier: "FEDERAL", lines: [{ sku: "SW-1", qty: 4 }] }, as: ResellerOps, captures: { o_id: "$.data.id" } }
          assert:
            - "Order.${o_id}.order_total_cents == 40000"

      - name: get_manufacturer_not_found
        claim_type: not_found
        grounds: ["entities.Manufacturer", "errors[ERR_NOT_FOUND\"]"]
        distinguishing_aspect: "GET with random UUID -> 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /manufacturers/00000000-0000-0000-0000-000000000000", payload: {}, as: PlatformAdmin }
          assert:
            - "http_status == 404"
            - "error_id == ERR_NOT_FOUND"

      - name: pagination_defaults_applied
        claim_type: listing
        grounds: ["response_envelope"]
        distinguishing_aspect: "GET list without limit/offset returns limit=10, offset=0, total_count, has_more per envelope."
        test_recipe:
          setup: ["12 manufacturers"]
          setup_api_calls:
            - { call: "POST /manufacturers", payload: { legal_name: "M01", duns: "510000001", manufacturer_type: "SOFTWARE_PUBLISHER", headquarters_country: "US" }, as: PlatformAdmin }
            - { call: "POST /manufacturers", payload: { legal_name: "M02", duns: "510000002", manufacturer_type: "SOFTWARE_PUBLISHER", headquarters_country: "US" }, as: PlatformAdmin }
            - { call: "POST /manufacturers", payload: { legal_name: "M03", duns: "510000003", manufacturer_type: "SOFTWARE_PUBLISHER", headquarters_country: "US" }, as: PlatformAdmin }
            - { call: "POST /manufacturers", payload: { legal_name: "M04", duns: "510000004", manufacturer_type: "SOFTWARE_PUBLISHER", headquarters_country: "US" }, as: PlatformAdmin }
            - { call: "POST /manufacturers", payload: { legal_name: "M05", duns: "510000005", manufacturer_type: "SOFTWARE_PUBLISHER", headquarters_country: "US" }, as: PlatformAdmin }
            - { call: "POST /manufacturers", payload: { legal_name: "M06", duns: "510000006", manufacturer_type: "SOFTWARE_PUBLISHER", headquarters_country: "US" }, as: PlatformAdmin }
            - { call: "POST /manufacturers", payload: { legal_name: "M07", duns: "510000007", manufacturer_type: "SOFTWARE_PUBLISHER", headquarters_country: "US" }, as: PlatformAdmin }
            - { call: "POST /manufacturers", payload: { legal_name: "M08", duns: "510000008", manufacturer_type: "SOFTWARE_PUBLISHER", headquarters_country: "US" }, as: PlatformAdmin }
            - { call: "POST /manufacturers", payload: { legal_name: "M09", duns: "510000009", manufacturer_type: "SOFTWARE_PUBLISHER", headquarters_country: "US" }, as: PlatformAdmin }
            - { call: "POST /manufacturers", payload: { legal_name: "M10", duns: "510000010", manufacturer_type: "SOFTWARE_PUBLISHER", headquarters_country: "US" }, as: PlatformAdmin }
            - { call: "POST /manufacturers", payload: { legal_name: "M11", duns: "510000011", manufacturer_type: "SOFTWARE_PUBLISHER", headquarters_country: "US" }, as: PlatformAdmin }
            - { call: "POST /manufacturers", payload: { legal_name: "M12", duns: "510000012", manufacturer_type: "SOFTWARE_PUBLISHER", headquarters_country: "US" }, as: PlatformAdmin }
          trigger:
            - { call: "GET /manufacturers", payload: {}, as: PlatformAdmin }
          assert:
            - "response.data is array of length 10"
            - "response contains limit=10, offset=0, total_count=12, has_more=true"

  - section: state_machines
    instances:
      - name: terminate_from_draft_returns_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.ManufacturerAgreement", "errors[ERR_INVALID_STATE\"]"]
        distinguishing_aspect: "DRAFT agreement cannot be terminated directly."
        test_recipe:
          setup: ["Agreement DRAFT"]
          setup_api_calls:
            - { call: "POST /manufacturers", payload: { legal_name: "T Corp", duns: "525252525", manufacturer_type: "SOFTWARE_PUBLISHER", headquarters_country: "US" }, as: PlatformAdmin, captures: { m_id: "$.data.id" } }
            - { call: "POST /agreements", payload: { manufacturer_id: "${m_id}", scope_tiers: ["FEDERAL"], mfc_discount_pct: 0.20, small_business_goal_pct: 0.10, product_scope: ["SW-"], term_start: "2026-01-01T00:00:00Z", term_end: "2027-01-01T00:00:00Z" }, as: ContractsManager, captures: { a_id: "$.data.id" } }
          trigger:
            - { call: "POST /agreements/${a_id}/terminate", payload: {}, as: ComplianceOfficer }
          assert:
            - "http_status == 409"
            - "error_id == ERR_INVALID_STATE"

      - name: invoice_overdue_lazy_evaluation
        claim_type: valid_transition
        grounds: ["state_machines.Invoice.ISSUED_to_OVERDUE"]
        distinguishing_aspect: "ISSUED invoice flips OVERDUE lazily on read after due_at passes."
        test_recipe:
          setup: ["Invoice ISSUED due_at=2026-10-31 (issued 2026-10-01 + 30 days)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /manufacturers", payload: { legal_name: "L Corp", duns: "535353535", manufacturer_type: "SOFTWARE_PUBLISHER", headquarters_country: "US" }, as: PlatformAdmin, captures: { m_id: "$.data.id" } }
            - { call: "POST /agreements", payload: { manufacturer_id: "${m_id}", scope_tiers: ["FEDERAL"], mfc_discount_pct: 0.20, small_business_goal_pct: 0.10, product_scope: ["SW-"], term_start: "2026-01-01T00:00:00Z", term_end: "2027-01-01T00:00:00Z" }, as: ContractsManager, captures: { a_id: "$.data.id" } }
            - { call: "POST /agreements/${a_id}/activate", payload: {}, as: ContractsManager }
            - { call: "POST /vehicles", payload: { agreement_id: "${a_id}", vehicle_kind: "FED_SCHEDULE", buyer_tiers: ["FEDERAL"], ceiling_cents: 100000000, taa_required: false, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: ContractsManager, captures: { v_id: "$.data.id" } }
            - { call: "POST /vehicles/${v_id}/authorize", payload: {}, as: ContractsManager }
            - { call: "POST /price-lists", payload: { vehicle_id: "${v_id}", period_from: "2026-01-01T00:00:00Z", period_to: "2027-01-01T00:00:00Z", lines: [{ sku: "SW-1", basis_price_cents: 20000, offered_price_cents: 10000, origin_country: "US" }] }, as: ContractsManager, captures: { pl_id: "$.data.id" } }
            - { call: "POST /price-lists/${pl_id}/submit", payload: {}, as: ContractsManager }
            - { call: "POST /price-lists/${pl_id}/activate", payload: {}, as: ComplianceOfficer }
            - { call: "POST /orders", payload: { vehicle_id: "${v_id}", price_list_id: "${pl_id}", buyer_tier: "FEDERAL", lines: [{ sku: "SW-1", qty: 1 }] }, as: ResellerOps, captures: { o_id: "$.data.id" } }
            - { call: "POST /orders/${o_id}/submit", payload: {}, as: ResellerOps }
            - { call: "POST /orders/${o_id}/deliver", payload: {}, as: ResellerOps }
            - { call: "POST /invoices", payload: { order_id: "${o_id}", period_label: "2026-10", payment_terms_days: 30 }, as: ResellerOps, captures: { inv_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-15T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "GET /invoices/${inv_id}", payload: {}, as: FinanceOps }
          assert:
            - "Invoice.${inv_id}.status == OVERDUE"

      - name: price_modification_approve_updates_line_and_prc
        claim_type: side_effect
        grounds: ["state_machines.PriceModification.PENDING_to_APPROVED", "calculations.prc_accumulator"]
        distinguishing_aspect: "Approving a price modification updates the line and recomputes vehicle prc_accumulator_cents."
        test_recipe:
          setup: ["ACTIVE list with line SKU=SW-1 basis=20000 offered=10000; vehicle.prc=0; one DELIVERED order qty=2 sold"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /manufacturers", payload: { legal_name: "Pm Corp", duns: "545454545", manufacturer_type: "SOFTWARE_PUBLISHER", headquarters_country: "US" }, as: PlatformAdmin, captures: { m_id: "$.data.id" } }
            - { call: "POST /agreements", payload: { manufacturer_id: "${m_id}", scope_tiers: ["FEDERAL"], mfc_discount_pct: 0.20, small_business_goal_pct: 0.10, product_scope: ["SW-"], term_start: "2026-01-01T00:00:00Z", term_end: "2027-01-01T00:00:00Z" }, as: ContractsManager, captures: { a_id: "$.data.id" } }
            - { call: "POST /agreements/${a_id}/activate", payload: {}, as: ContractsManager }
            - { call: "POST /vehicles", payload: { agreement_id: "${a_id}", vehicle_kind: "FED_SCHEDULE", buyer_tiers: ["FEDERAL"], ceiling_cents: 100000000, taa_required: false, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: ContractsManager, captures: { v_id: "$.data.id" } }
            - { call: "POST /vehicles/${v_id}/authorize", payload: {}, as: ContractsManager }
            - { call: "POST /price-lists", payload: { vehicle_id: "${v_id}", period_from: "2026-01-01T00:00:00Z", period_to: "2027-01-01T00:00:00Z", lines: [{ sku: "SW-1", basis_price_cents: 20000, offered_price_cents: 10000, origin_country: "US" }] }, as: ContractsManager, captures: { pl_id: "$.data.id", pl_v: "$.data.version" } }
            - { call: "POST /price-lists/${pl_id}/submit", payload: {}, as: ContractsManager }
            - { call: "POST /price-lists/${pl_id}/activate", payload: {}, as: ComplianceOfficer, captures: { pl_v: "$.data.version" } }
            - { call: "POST /orders", payload: { vehicle_id: "${v_id}", price_list_id: "${pl_id}", buyer_tier: "FEDERAL", lines: [{ sku: "SW-1", qty: 2 }] }, as: ResellerOps, captures: { o_id: "$.data.id" } }
            - { call: "POST /orders/${o_id}/submit", payload: {}, as: ResellerOps }
            - { call: "POST /orders/${o_id}/deliver", payload: {}, as: ResellerOps }
            - { call: "POST /price-modifications", payload: { price_list_id: "${pl_id}", sku: "SW-1", new_offered_price_cents: 9000, reason_code: "PRC_TRIGGERED", expected_price_list_version: "${pl_v}" }, as: ContractsManager, captures: { pm_id: "$.data.id" } }
          trigger:
            - { call: "POST /price-modifications/${pm_id}/approve", payload: {}, as: ComplianceOfficer }
            - { call: "GET /vehicles/${v_id}", payload: {}, as: ContractsManager }
          assert:
            - "PriceLine SW-1 offered_price_cents == 9000"
            - "ContractVehicle.${v_id}.prc_accumulator_cents == (20000 - 9000) * 2 == 22000"

  - section: calculations
    instances:
      - name: prc_accumulator_excludes_superseded_lists
        claim_type: input_set_filtering
        grounds: ["calculations.prc_accumulator"]
        distinguishing_aspect: "Only the ACTIVE list's lines contribute to prc_accumulator; SUPERSEDED list lines excluded."
        test_recipe:
          setup: ["Vehicle V with two lists P1 ACTIVE then P2 ACTIVE (P1 SUPERSEDED); P2 has line basis=20000 offered=10000 with sold_qty=0"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /manufacturers", payload: { legal_name: "S Corp", duns: "555555555", manufacturer_type: "SOFTWARE_PUBLISHER", headquarters_country: "US" }, as: PlatformAdmin, captures: { m_id: "$.data.id" } }
            - { call: "POST /agreements", payload: { manufacturer_id: "${m_id}", scope_tiers: ["FEDERAL"], mfc_discount_pct: 0.20, small_business_goal_pct: 0.10, product_scope: ["SW-"], term_start: "2026-01-01T00:00:00Z", term_end: "2027-01-01T00:00:00Z" }, as: ContractsManager, captures: { a_id: "$.data.id" } }
            - { call: "POST /agreements/${a_id}/activate", payload: {}, as: ContractsManager }
            - { call: "POST /vehicles", payload: { agreement_id: "${a_id}", vehicle_kind: "FED_SCHEDULE", buyer_tiers: ["FEDERAL"], ceiling_cents: 100000000, taa_required: false, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: ContractsManager, captures: { v_id: "$.data.id" } }
            - { call: "POST /vehicles/${v_id}/authorize", payload: {}, as: ContractsManager }
            - { call: "POST /price-lists", payload: { vehicle_id: "${v_id}", period_from: "2026-01-01T00:00:00Z", period_to: "2026-12-01T00:00:00Z", lines: [{ sku: "SW-1", basis_price_cents: 20000, offered_price_cents: 10000, origin_country: "US" }] }, as: ContractsManager, captures: { p1: "$.data.id" } }
            - { call: "POST /price-lists/${p1}/submit", payload: {}, as: ContractsManager }
            - { call: "POST /price-lists/${p1}/activate", payload: {}, as: ComplianceOfficer }
            - { call: "POST /price-lists", payload: { vehicle_id: "${v_id}", period_from: "2026-01-01T00:00:00Z", period_to: "2027-01-01T00:00:00Z", lines: [{ sku: "SW-1", basis_price_cents: 20000, offered_price_cents: 11000, origin_country: "US" }] }, as: ContractsManager, captures: { p2: "$.data.id" } }
            - { call: "POST /price-lists/${p2}/submit", payload: {}, as: ContractsManager }
            - { call: "POST /price-lists/${p2}/activate", payload: {}, as: ComplianceOfficer }
          trigger:
            - { call: "GET /vehicles/${v_id}", payload: {}, as: ContractsManager }
          assert:
            - "PriceList.${p1}.status == SUPERSEDED"
            - "PriceList.${p2}.status == ACTIVE"
            - "ContractVehicle.${v_id}.prc_accumulator_cents == (20000-11000) * 0 == 0 (sold_qty=0; superseded P1 lines excluded)"

      - name: sb_goal_attainment_zero_sales_trivially_met
        claim_type: correct_result
        grounds: ["calculations.sb_goal_attainment"]
        distinguishing_aspect: "total_sales_cents == 0 -> sb_goal_met := true (zero-guard)."
        test_recipe:
          setup: ["Agreement ACTIVE; SalesReport for 2026-09 with no invoices (totals 0)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /manufacturers", payload: { legal_name: "Sb Corp", duns: "565656565", manufacturer_type: "SOFTWARE_PUBLISHER", headquarters_country: "US" }, as: PlatformAdmin, captures: { m_id: "$.data.id" } }
            - { call: "POST /agreements", payload: { manufacturer_id: "${m_id}", scope_tiers: ["FEDERAL"], mfc_discount_pct: 0.20, small_business_goal_pct: 0.50, product_scope: ["SW-"], term_start: "2026-01-01T00:00:00Z", term_end: "2027-01-01T00:00:00Z" }, as: ContractsManager, captures: { a_id: "$.data.id" } }
            - { call: "POST /agreements/${a_id}/activate", payload: {}, as: ContractsManager }
            - { call: "POST /sales-reports", payload: { agreement_id: "${a_id}", period_label: "2026-09" }, as: FinanceOps, captures: { sr_id: "$.data.id" } }
          trigger:
            - { call: "POST /sales-reports/${sr_id}/finalize", payload: {}, as: FinanceOps }
          assert:
            - "SalesReport.${sr_id}.total_sales_cents == 0"
            - "SalesReport.${sr_id}.sb_goal_met == true"

      - name: audit_variance_materiality_boundary
        claim_type: correct_result
        grounds: ["calculations.audit_mfc_variance"]
        distinguishing_aspect: "variance == AUDIT_MATERIALITY_CENTS (250000) NOT material (> required); 250001 IS material."
        test_recipe:
          setup: ["Agreement ACTIVE; one FINALIZED SalesReport total_sales_cents=0; audit with attestation=250000"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /manufacturers", payload: { legal_name: "Au Corp", duns: "575757575", manufacturer_type: "SOFTWARE_PUBLISHER", headquarters_country: "US" }, as: PlatformAdmin, captures: { m_id: "$.data.id" } }
            - { call: "POST /agreements", payload: { manufacturer_id: "${m_id}", scope_tiers: ["FEDERAL"], mfc_discount_pct: 0.20, small_business_goal_pct: 0.10, product_scope: ["SW-"], term_start: "2026-01-01T00:00:00Z", term_end: "2027-01-01T00:00:00Z" }, as: ContractsManager, captures: { a_id: "$.data.id" } }
            - { call: "POST /agreements/${a_id}/activate", payload: {}, as: ContractsManager }
            - { call: "POST /audits", payload: { agreement_id: "${a_id}", scope: "PRICING_DISCLOSURE", mfc_attestation_cents: 250000 }, as: Auditor, captures: { au1: "$.data.id" } }
            - { call: "POST /audits", payload: { agreement_id: "${a_id}", scope: "PRICING_DISCLOSURE", mfc_attestation_cents: 250001 }, as: Auditor, captures: { au2: "$.data.id" } }
          trigger:
            - { call: "POST /audits/${au1}/issue-finding", payload: {}, as: Auditor }
            - { call: "POST /audits/${au2}/issue-finding", payload: {}, as: Auditor }
          assert:
            - "au1 returns ERR_AUDIT_NOT_MATERIAL (variance == materiality, not >)"
            - "au2 succeeds (variance > materiality) -> FINDING_ISSUED"

  - section: validations
    instances:
      - name: missing_auth_headers_401
        claim_type: violation_to_error
        grounds: ["validations[priority=1\"]", "errors[ERR_MISSING_AUTH_HEADERS]"]
        distinguishing_aspect: "No X-User-Role header -> 401."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            # No X-User-Role header is sent (header omitted). Role marker is a
            # sentinel meaning "no auth headers"; the implementation must return 401.
            - { call: "GET /manufacturers", payload: {}, as: PlatformAdmin }
          assert: ["http_status == 401", "error_id == ERR_MISSING_AUTH_HEADERS"]

      - name: order_lines_qty_zero_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=15\"]", "errors[ERR_ORDER_LINE_INVALID]"]
        distinguishing_aspect: "qty=0 rejected at create with ERR_ORDER_LINE_INVALID."
        test_recipe:
          setup: ["Full chain to ACTIVE list"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: PlatformAdmin }
