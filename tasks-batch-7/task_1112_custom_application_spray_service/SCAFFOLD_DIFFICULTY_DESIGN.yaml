            - "WO3 (13:59 < WO2 end 14:00) rejected: error == ERR_FIELD_TIME_CONFLICT (one minute of overlap suffices)"

      - name: applicator_overlap_travel_buffer
        grounds:
          - calculations.schedule_overlap_rules
          - errors[ERR_APPLICATOR_TIME_CONFLICT]
