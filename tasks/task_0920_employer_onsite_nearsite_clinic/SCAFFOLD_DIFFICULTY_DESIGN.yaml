  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: award_paid_then_reversed_conserves_period_incentive_money
        grounds:
          - conservation_invariants.incentive_money_conservation
          - state_machines.IncentiveAward.EXPORTED_to_PAID
          - state_machines.IncentiveAward.PAID_to_REVERSED
          - entities.ReportingPeriod.fields.incentive_reversed_cents
          - entities.Employer.fields.wellness_budget_committed_cents
        distinguishing_aspect: |
          The conserved quantity is MONEY: ReportingPeriod.incentive_awarded_cents stays at exactly 15000
          through approve, export, mark-paid and reverse, while the four sub-buckets repartition, and the
          employer's committed budget returns to 0 with no drift.
        test_recipe:
          setup:
            - "Employer Conserve Co with an OPEN June 2026 period, one ACTIVE participant and one PENDING PARTICIPATORY award of 15000 cents."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /employers"
              payload: { legal_name: "Conserve Co", employer_code: "CNS", annual_total_cost_of_coverage_cents: 1200000, wellness_budget_cents: 500000, tobacco_program_enabled: false }
              as: ProgramAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /reporting-periods"
              payload: { employer_id: "${emp_id}", period_start: "2026-06-01", period_end: "2026-06-30" }
              as: ProgramAdmin
              captures: { per_id: $.data.id }
            - call: "POST /eligibility-records"
              payload: { employer_id: "${emp_id}", subscriber_external_id: "S-2201", member_external_id: "M-2201", tier: "EMPLOYEE", effective_date: "2026-01-01" }
              as: EmployerBenefitsAdmin
              as_user_id: "${emp_id}"
              captures: { elig_id: $.data.id }
            - call: "POST /participants"
              payload: { employer_id: "${emp_id}", eligibility_record_id: "${elig_id}", display_name: "Money Tester" }
              as: EmployerBenefitsAdmin
              as_user_id: "${emp_id}"
              captures: { p_id: $.data.id }
            - call: "GET /participants/${p_id}"
              payload: {}
              as: EmployerBenefitsAdmin
              as_user_id: "${emp_id}"
              captures: { p_ver: $.data.version }
            - call: "POST /incentive-awards"
              payload: { participant_id: "${p_id}", reporting_period_id: "${per_id}", award_type: "PARTICIPATORY", expected_participant_version: "${p_ver}" }
              as: EmployerBenefitsAdmin
              as_user_id: "${emp_id}"
              captures: { award_id: $.data.id }
          trigger:
            - call: "POST /incentive-awards/${award_id}/approve"
              payload: {}
              as: EmployerBenefitsAdmin
              as_user_id: "${emp_id}"
            - call: "POST /incentive-awards/${award_id}/export"
              payload: { payroll_reference: "PR-2026-06-001" }
              as: PayrollProcessor
            - call: "POST /incentive-awards/${award_id}/mark-paid"
              payload: {}
              as: PayrollProcessor
            - call: "POST /incentive-awards/${award_id}/reverse"
              payload: {}
              as: EmployerBenefitsAdmin
              as_user_id: "${emp_id}"
          assert:
            - "After approve, IncentiveAward.${award_id}.status == APPROVED with approved_by_user_id == ${emp_id}, and ReportingPeriod.${per_id}.incentive_pending_cents is still 15000"
            - "After export, IncentiveAward.${award_id}.status == EXPORTED"
            - "After mark-paid, ReportingPeriod.${per_id}.incentive_awarded_cents == 15000, incentive_pending_cents == 0, incentive_paid_cents == 15000, incentive_reversed_cents == 0, incentive_forfeited_cents == 0"
            - "After reverse, ReportingPeriod.${per_id}.incentive_awarded_cents == 15000"
            - "After reverse, ReportingPeriod.${per_id}.incentive_pending_cents == 0 and incentive_paid_cents == 0 and incentive_reversed_cents == 15000 and incentive_forfeited_cents == 0"
            - "The four buckets sum to incentive_awarded_cents at every step"
            - "IncentiveAward.${award_id}.status == REVERSED with payroll_reference PR-2026-06-001 preserved"
            - "Employer.${emp_id}.wellness_budget_committed_cents == 0 and wellness_budget_remaining_cents == 500000"
            - "Participant.${p_id}.incentive_awarded_cents == 15000 because the award still exists"

      - name: book_cancel_noshow_and_checkin_conserve_the_site_slot_partition
        grounds:
          - conservation_invariants.site_slot_conservation
          - conservation_invariants.employer_quota_conservation
          - state_machines.Appointment.BOOKED_to_CANCELLED
          - state_machines.Appointment.BOOKED_to_NO_SHOW
          - state_machines.Appointment.BOOKED_to_CONSUMED
        distinguishing_aspect: |
          The conserved quantity is SLOT COUNT, not money: three appointments partition exactly across
          held, consumed, no-show and released buckets summing to slots_requested_total 3, and the
          contract's quota partition shows that a cancellation returns quota while a no-show does not.
        test_recipe:
          setup:
            - "Site with daily_slot_capacity 8, contract quota 20, one clinician with an 08:00-17:00 shift on 2026-06-08."
            - "Three BOOKED appointments at 09:00, 09:30 and 10:00 for the same ACTIVE participant."
