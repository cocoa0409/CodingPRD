          setup: ["empty database"]
          setup_api_calls:
            - { call: "POST /api/suppliers", payload: { supplier_code: "S1", name: "Engines Co", region: "NA" }, as: ProgramAdmin, captures: { s1_id: "$.data.id" } }
          trigger:
            - { call: "GET /api/suppliers/${s1_id}", payload: {}, as: ProgramAdmin, captures: { code: "$.data.supplier_code", nm: "$.data.name", rg: "$.data.region", v: "$.data.version" } }
          assert:
            - "GET returns supplier_code S1, name Engines Co, region NA, version 1 immediately after creation"
