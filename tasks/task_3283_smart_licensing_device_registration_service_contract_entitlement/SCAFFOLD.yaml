  - { method: GET, path: "/api/devices/{id}", description: "Get one device", roles: [PlatformAdmin, AccountAdmin, PartnerManager], code: 200, input: [], output: Device, side_effects: [] }
  - { method: POST, path: "/api/devices/{id}/activate", description: "Activate (register) a device; gated by account status, posture, and EOL milestones", roles: [PlatformAdmin, AccountAdmin, PartnerManager], code: 200, input: [], output: Device, side_effects: ["registration_state -> REGISTERED", "sets registered_at and last_sync_at", "increments Device.version by 1"] }
  - { method: POST, path: "/api/devices/{id}/deregister", description: "Deregister a device; releases its license assignments", roles: [PlatformAdmin, AccountAdmin, PartnerManager], code: 200, input: [], output: Device, side_effects: ["DeviceLicenseAssignment ACTIVE -> RELEASED, each release recomputing pool consumption and compliance", "registration_state -> DEREGISTERED", "increments Device.version by 1"] }
  - { method: POST, path: "/api/devices/{id}/retire", description: "Retire a deregistered, uncovered device", roles: [PlatformAdmin, AccountAdmin, PartnerManager], code: 200, input: [], output: Device, side_effects: ["registration_state DEREGISTERED -> RETIRED", "increments Device.version by 1"] }
  - { method: GET, path: "/api/devices/{id}/assignments", description: "List license assignments of a device", roles: [PlatformAdmin, AccountAdmin, PartnerManager], code: 200, input: ["limit?", "offset?"], output: "DeviceLicenseAssignment[]", side_effects: [] }
