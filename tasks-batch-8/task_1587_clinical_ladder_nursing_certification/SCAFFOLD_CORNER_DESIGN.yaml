      - name: pay_without_budget_guard_fails
        claim_type: violation_to_error
        grounds: ["validations[priority=21]", "errors[ERR_BUDGET_EXCEEDED]"]
        distinguishing_aspect: "Paying an approved claim when forecast-committed headroom is exhausted returns ERR_BUDGET_EXCEEDED."
        test_recipe:
