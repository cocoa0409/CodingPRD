      - name: ifsp_supersede_cascade_releases_units_to_pool
        grounds:
          - state_machines.IFSP[ACTIVE -> SUPERSEDED]
          - state_machines.IFSPService[PLANNED -> DISCONTINUED]
          - state_machines.ProviderAuthorization[ACTIVE -> REVOKED]
          - state_machines.ServiceVisit[SCHEDULED -> CANCELLED_PROGRAM]
          - calculations.service_unit_pool
          - endpoints[POST /ei/ifsps/{ifspId}/consent]
        distinguishing_aspect: |
          This instance walks a cascade that starts INSIDE the plan hierarchy and whose terminal hop
          is arithmetic on a conserved quantity: consenting to an ANNUAL plan supersedes the prior
          plan, discontinues its line, revokes the line's authorization with units_released equal to
          the exact unconsumed remainder (22 of 24 after one delivered 2-unit visit), and rebuilds
          units_committed to 2 and units_pool_remaining to 94 so the pool identity still sums to the
          96 planned units. A naive implementation releases all 24 units and loses the 2 already
