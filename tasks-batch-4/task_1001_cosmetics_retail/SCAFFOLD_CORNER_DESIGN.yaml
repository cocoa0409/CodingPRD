      - name: refund_settlement_rounds_the_line_share_once_and_applies_restocking_fee
        claim_type: precision
        grounds: ["calculations.refund_settlement", "entities.ReturnRequest.fields.restocking_fee_cents", "entities.ReturnRequest.fields.points_clawback"]
        distinguishing_aspect: |
          Line of 3 units at 999 (net 2997) for a VIB customer (tier_discount 300, discounted_subtotal 2697,
          39 EARN points). Returning 1 TESTER_APPLIED unit gives refund_line = round_half_up(2997/3) = 999,
          tier share = round_half_up(300*999/2997) = 100, restocking fee = round_half_up(99.9) = 100,
          refund = 799, clawback = floor(floor(799/100)*1.5) = 10, disposition DESTROY.
        test_recipe:
          setup:
            - "Customer seeded at tier VIB."
            - "TESTER_APPLIED product priced 999; SHIP_FROM_STORE order for 3 units, shipped and captured."
          setup_api_calls:
            - call: "POST /stores"
