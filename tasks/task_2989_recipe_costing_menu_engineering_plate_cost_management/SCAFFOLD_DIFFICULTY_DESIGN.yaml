  - rule_id: resource_temporal_overlap
    instances:
      - name: ingredient_price_windows_are_half_open_adjacent_accepted_open_ended_truncated_interior_window_collides
        grounds:
          - validations[priority 45]
          - state_machines.PriceFeed.DRAFT_to_PUBLISHED
          - entities.IngredientPrice.fields.effective_to
          - entities.IngredientPrice.fields.status
          - entities.PriceFeed.fields.superseded_price_count
          - endpoints[GET /culinary/ingredients/{ingredient_id}/prices]
        distinguishing_aspect: |
          Four publications against ONE (ingredient, region) axis separate the three outcomes the
          half-open rule distinguishes: a start equal to a bounded row's effective_to is ADJACENT
          and accepted with superseded_price_count 0, a start strictly after an open-ended row's
          start TRUNCATES that row (superseded_price_count 1, status SUPERSEDED), and a start at or
          before an existing PUBLISHED row's start COLLIDES. The interval resource here is a price
          window on an ingredient and the third outcome mutates an existing row; the other
          resource_temporal_overlap instance counts concurrent intervals against a capacity of 2
          without ever mutating a neighbour.
        test_recipe:
          setup:
            - "One ingredient CHEDDAR-BLOCK (pack_base_units 2268) and four DRAFT PriceFeeds, all region MW so every line competes on the same (ingredient_id, region_code) axis."
            - "Feed A: 22000000 over the bounded window [2026-05-01T00:00:00Z, 2026-06-01T00:00:00Z)."
            - "Feed B: 23000000 open-ended from 2026-06-01T00:00:00Z — exactly A's effective_to."
            - "Feed C: 25000000 open-ended from 2026-07-01T00:00:00Z — strictly inside B's open-ended window."
            - "Feed D: 24000000 open-ended from 2026-06-15T00:00:00Z — at or before C's effective_from."
            - "Publication order is A, B, C, D and the logical clock never moves."
          setup_api_calls:
            - call: "POST /culinary/ingredients"
              payload: { sku: "CHEDDAR-BLOCK", name: "Cheddar Block", base_uom: "GRAM", pack_base_units: 2268, trim_yield_bps: 10000, cook_shrink_bps: 0, allergen_mask: 1, kcal_per_base_unit_micros: 4000000, sodium_mcg_per_base_unit: 6200 }
              as: RecipeDeveloper
              captures: { ched_id: $.data.id }
            - call: "POST /culinary/price-feeds"
              payload: { distributor_code: "BROADLINE", region_code: "MW", feed_date: "2026-05-01T00:00:00.000Z" }
              as: CostAnalyst
              captures: { feed_a_id: $.data.id }
            - call: "POST /culinary/price-feeds/${feed_a_id}/lines"
              payload: { ingredient_id: "${ched_id}", pack_cost_micros: 22000000, effective_from: "2026-05-01T00:00:00.000Z", effective_to: "2026-06-01T00:00:00.000Z" }
              as: CostAnalyst
              captures: { line_a_id: $.data.id }
            - call: "POST /culinary/price-feeds"
              payload: { distributor_code: "BROADLINE", region_code: "MW", feed_date: "2026-06-01T00:00:00.000Z" }
              as: CostAnalyst
              captures: { feed_b_id: $.data.id }
            - call: "POST /culinary/price-feeds/${feed_b_id}/lines"
              payload: { ingredient_id: "${ched_id}", pack_cost_micros: 23000000, effective_from: "2026-06-01T00:00:00.000Z" }
              as: CostAnalyst
              captures: { line_b_id: $.data.id }
            - call: "POST /culinary/price-feeds"
              payload: { distributor_code: "BROADLINE", region_code: "MW", feed_date: "2026-07-01T00:00:00.000Z" }
              as: CostAnalyst
              captures: { feed_c_id: $.data.id }
            - call: "POST /culinary/price-feeds/${feed_c_id}/lines"
              payload: { ingredient_id: "${ched_id}", pack_cost_micros: 25000000, effective_from: "2026-07-01T00:00:00.000Z" }
              as: CostAnalyst
              captures: { line_c_id: $.data.id }
            - call: "POST /culinary/price-feeds"
              payload: { distributor_code: "BROADLINE", region_code: "MW", feed_date: "2026-06-15T00:00:00.000Z" }
              as: CostAnalyst
              captures: { feed_d_id: $.data.id }
            - call: "POST /culinary/price-feeds/${feed_d_id}/lines"
              payload: { ingredient_id: "${ched_id}", pack_cost_micros: 24000000, effective_from: "2026-06-15T00:00:00.000Z" }
              as: CostAnalyst
              captures: { line_d_id: $.data.id }
          trigger:
            - call: "POST /culinary/price-feeds/${feed_a_id}/publish"
              as: CostAnalyst
              captures: { a_status: $.data.status, a_superseded: $.data.superseded_price_count }
            - call: "POST /culinary/price-feeds/${feed_b_id}/publish"
              as: CostAnalyst
              captures: { b_status: $.data.status, b_superseded: $.data.superseded_price_count }
            - call: "POST /culinary/price-feeds/${feed_c_id}/publish"
              as: CostAnalyst
              captures: { c_status: $.data.status, c_superseded: $.data.superseded_price_count }
            - call: "POST /culinary/price-feeds/${feed_d_id}/publish"
              as: CostAnalyst
              captures: { d_error: $.data.error_id }
            - call: "GET /culinary/ingredients/${ched_id}/prices"
              as: CostAnalyst
              captures: { price_rows: $.data }
          assert:
            - "${a_status} == PUBLISHED and ${a_superseded} == 0 — nothing precedes it"
            - "${b_status} == PUBLISHED and ${b_superseded} == 0 — 2026-06-01 equals A's effective_to, which is adjacency, not overlap, and A is bounded so nothing is truncated"
            - "${c_status} == PUBLISHED and ${c_superseded} == 1 — B was open-ended with an earlier start, so it is truncated instead of colliding"
            - "${d_error} == ERR_PRICE_WINDOW_OVERLAP with HTTP 409 — 2026-06-15 is at or before C's 2026-07-01 start; the SUPERSEDED B row it also overlaps is irrelevant because the rule only guards PUBLISHED windows"
            - "${price_rows} has exactly 4 entries in effective_from ASC order: (2026-05-01, effective_to 2026-06-01, PUBLISHED, 22000000), (2026-06-01, effective_to 2026-07-01, SUPERSEDED, 23000000), (2026-06-15, effective_to null, PENDING, 24000000), (2026-07-01, effective_to null, PUBLISHED, 25000000)"
            - "IngredientPrice.${line_a_id}.effective_to == 2026-06-01T00:00:00.000Z and status == PUBLISHED — the adjacent publication left it alone"
            - "IngredientPrice.${line_b_id}.effective_to == 2026-07-01T00:00:00.000Z and status == SUPERSEDED — rewritten from null by C's publication"
            - "IngredientPrice.${line_c_id}.effective_to is null with status PUBLISHED"
            - "IngredientPrice.${line_d_id}.status == PENDING and PriceFeed.${feed_d_id}.status == DRAFT"

      - name: lto_launch_capacity_counts_only_overlapping_launched_windows_in_the_region
        grounds:
          - validations[priority 43]
          - constants.MAX_CONCURRENT_LTO_PER_REGION
          - state_machines.LTOCampaign.COSTED_to_LAUNCHED
          - concurrency_rules[lto-create-stale-menu-item]
          - entities.MenuItem.fields.open_lto_count
        distinguishing_aspect: |
          Four campaigns on one menu item pin what the capacity check counts: two LAUNCHED windows
          overlapping the candidate exhaust MAX_CONCURRENT_LTO_PER_REGION, a third overlapping
          candidate is refused while its own status stays COSTED, and a fourth whose window_start
          equals a LAUNCHED window's window_end launches freely because half-open adjacency is zero
          intersections — the COSTED-but-refused campaign is never counted either. This instance
          counts concurrent intervals against a capacity and mutates no neighbour; the other
          resource_temporal_overlap instance has a capacity of one implicit row and rewrites the
          neighbour's effective_to.
