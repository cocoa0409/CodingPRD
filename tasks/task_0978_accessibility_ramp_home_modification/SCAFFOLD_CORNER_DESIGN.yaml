        excluded_because:
          difficulty_instance: invoice_send_void_conserves_case_billing_ledger
          rationale: "The send-side ledger update (total_billed += total_cents, balance recompute) is asserted as the mid-chain observation of the named §1.8 compensating-invariant instance."

  # ===========================================================================
  # Section: calculations (Table 3 claims)
