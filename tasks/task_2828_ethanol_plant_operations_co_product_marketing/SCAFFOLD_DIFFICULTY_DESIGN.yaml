            - call: "POST /ethanol-ops/unit-train-shipments"
              payload: { shipment_code: "UT-D001", track_id: "${trk_id}", expected_track_version: "${trk_v0}", source_tank_id: "${t301_id}", destination_terminal: "Chicago Rail Terminal", railcar_count: 1, gallons_per_railcar: 2625.00, window_start: "2026-09-05T06:00:00Z", window_end: "2026-09-05T12:00:00Z", price_cents_per_gallon: 181.50 }
