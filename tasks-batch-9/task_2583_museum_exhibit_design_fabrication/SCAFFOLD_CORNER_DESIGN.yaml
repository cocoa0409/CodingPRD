            - "${t5} fails at 21 and ${t7} fails at 481, while the control row accepts ${zcap} == 20 and ${zdust} == 480 - both ceilings are INCLUSIVE"
            - "${t6} fails because visitor_route_order is constrained >= 1"
            - "the control zone is created with HTTP 201 and ${zavail} == 20 - available_case_slots is case_slot_capacity minus zero reserved"
            - "${t8} fails with NEITHER subject id and ${t9} fails with BOTH - the exclusive-or is enforced in both directions, and ${t8} is 400 rather than ERR_MATERIAL_NOT_FOUND 404 because priority 6 precedes priority 15"
            - "${t10} fails because interactive_id and case_id form the second exclusive-or pair; it is 400 rather than ERR_INVALID_PROJECT_PHASE 409, since the project is in SCHEMATIC and punch items need COMMISSIONING - shape beats state"
            - "${t11} fails on the unparseable datetime rather than reaching the ERR_INVALID_TIME_RANGE check at priority 34"

      - name: review_vote_rows_are_immutable_with_no_version_and_no_update_or_delete_endpoint
        claim_type: immutability
        grounds:
          - entities.ReviewVote
          - endpoints.GET_/review-rounds/{id}/votes
          - endpoints.POST_/review-rounds/{id}/votes
          - validations.priority_29
          - errors.ERR_DUPLICATE_VOTE
        distinguishing_aspect: |
          ReviewVote is the one entity declared with common_fields: false, so it must
          NOT carry id, created_at, updated_at or version, and §1.5 deliberately
          exposes no PATCH, PUT or DELETE for it. Immutability is therefore enforced
          by absence plus the priority-29 one-vote-per-role rule: the only way a
          panelist could change a position would be to re-post, and that is a 409.
          The vote is also the only place where voter_role and voter_user_id are
          system-captured from the headers, so a client-supplied voter_role in the
          body must be ignored rather than honoured.
        test_recipe:
          setup:
            - "a SCHEMATIC package with an OPEN round on a 3-role panel; the Curator has voted REVISE with a comment, the Conservator has not voted, so the round is still OPEN at 1 of 2 votes"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProjectManager
            - call: "POST /exhibit-projects"
              payload: { name: "Deep Time Hall", museum_name: "Ridgeline Museum", storyline_title: "Deep Time: Reading the Rock Record", objective_codes: ["OBJ-STRATA", "OBJ-EXTINCTION"], target_open_date: "2027-05-01T00:00:00Z", contract_value_cents: 9000000 }
              as: ProjectManager
              as_user_id: pm-01
              captures: { proj: $.data.id }
            - call: "POST /exhibit-projects/${proj}/advance-phase"
              payload: { to_phase: "SCHEMATIC" }
              as: ProjectManager
              as_user_id: pm-01
            - call: "GET /exhibit-projects/${proj}"
              payload: {}
              as: ProjectManager
              as_user_id: pm-01
              captures: { pv: $.data.version }
            - call: "POST /exhibit-projects/${proj}/design-packages"
              payload: { expected_project_version: "${pv}", stage: "SCHEMATIC", egress_clear_width_cm: 112, wheelchair_turning_radius_cm: 76, peak_visitors_per_hour: 180, circulation_area_sqm: 95.0 }
              as: ProjectManager
              as_user_id: pm-01
              captures: { pkg1: $.data.id }
            - call: "POST /design-packages/${pkg1}/review-rounds"
              payload: { panel_roles: ["Curator", "Conservator", "ProjectManager"], decision_deadline_at: "2026-08-20T00:00:00Z" }
              as: ProjectManager
              as_user_id: pm-01
              captures: { rnd1: $.data.id }
            - call: "POST /review-rounds/${rnd1}/votes"
              payload: { decision: "REVISE", comment: "Please widen the case-to-wall gap." }
              as: Curator
              as_user_id: cur-01
              captures: { rst1: $.data.status, cast1: $.data.cast_vote_count, rev1: $.data.revise_count }
          trigger:
            - call: "GET /review-rounds/${rnd1}/votes"
              payload: {}
              as: MuseumOperations
              as_user_id: ops-01
              captures: { vrole: "$.data[0].voter_role", vuid: "$.data[0].voter_user_id", vdec: "$.data[0].decision", vcom: "$.data[0].comment", vrid: "$.data[0].round_id" }
            - call: "POST /review-rounds/${rnd1}/votes"
              payload: { decision: "APPROVE", comment: "Changed my mind." }
              as: Curator
              as_user_id: cur-01
              captures: { dup: $.data.error_id }
            - call: "GET /review-rounds/${rnd1}/votes"
              payload: {}
              as: MuseumOperations
              as_user_id: ops-01
              captures: { vdec2: "$.data[0].decision", vcom2: "$.data[0].comment", rows2: $.data }
            - call: "POST /review-rounds/${rnd1}/votes"
              payload: { decision: "APPROVE" }
              as: Conservator
              as_user_id: con-01
              captures: { rst2: $.data.status, cast2: $.data.cast_vote_count, rev2: $.data.revise_count, app2: $.data.approve_count }
            - call: "GET /review-rounds/${rnd1}/votes"
              payload: {}
              as: MuseumOperations
              as_user_id: ops-01
              captures: { rows3: $.data, vcom3: "$.data[1].comment" }
          assert:
            - "${rst1} == OPEN with ${cast1} == 1 and ${rev1} == 1 - one REVISE does not resolve a 2-vote quorum"
            - "each row in ${rows2} carries exactly the five declared fields round_id, voter_role, voter_user_id, decision, comment - and NO id, created_at, updated_at or version, because ReviewVote is declared common_fields: false"
            - "${vrole} == Curator and ${vuid} == cur-01 - both are taken from the request headers, not from the body"
            - "${vdec} == REVISE, ${vcom} == \"Please widen the case-to-wall gap.\" and ${vrid} == ${rnd1}"
            - "${dup} == ERR_DUPLICATE_VOTE with HTTP 409 - the only conceivable update path is refused"
            - "${vdec2} == REVISE and ${vcom2} == ${vcom} - the refused re-post left the stored vote untouched; a last-write-wins implementation would show APPROVE here"
            - "${rows2} still has exactly 1 row - the refused re-post did not append a second vote either"
            - "the resolving Conservator vote returns ${rst2} == REVISION_REQUESTED with ${cast2} == 2, ${rev2} == 1 and ${app2} == 1 - quorum reached with at least one REVISE and no VETO"
            - "${rows3} has exactly 2 rows and ${vcom3} == null - comment is optional and stores as null, not as an empty string"
            - "§1.5 declares no PATCH, PUT or DELETE on /review-rounds/{id}/votes at all; any such request must be refused by the router, not handled"

      - name: every_graph_edge_refuses_a_row_that_exists_but_belongs_to_another_project
        claim_type: parent_relationships
        grounds:
          - complexity_profile.entity_topology.graph
          - validations.priority_22
          - validations.priority_61
          - errors.ERR_CROSS_PROJECT_REFERENCE
          - errors.ERR_ARTIFACT_NOT_IN_CASE
        distinguishing_aspect: |
          The topology is a graph, so several edges are body-supplied rather than
          implied by the URL: a case names a zone, a placement names an artifact, a
          drawing names a material and a subject. Priority 22 states the sharp rule
          that a referenced row which EXISTS but is misfiled is a 409, never the 404
          of priority 8-18 - the row is not hidden, it is in the wrong project. It
          also outranks the priority-61 membership check, so pointing a placement
          removal at a foreign artifact is a cross-project error and not an
          artifact-not-in-case error. The nested collections must stay
          parent-scoped: project B's artifact list may not leak project A's rows.
        test_recipe:
          setup:
            - "two projects both advanced to SCHEMATIC; project A has zone Z-A, artifact 2019.14.3 and empty case C-01; project B has zone Z-B and artifact 2020.77.1"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProjectManager
            - call: "POST /exhibit-projects"
