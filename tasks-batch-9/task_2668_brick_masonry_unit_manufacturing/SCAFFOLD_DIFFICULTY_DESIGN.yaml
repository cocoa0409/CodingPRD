      - name: order_cancel_cascades_four_hops_to_blend_components_and_lot_inventory
        grounds:
          - state_machines.Order.fulfillment_status.to_CANCELLED
          - state_machines.Order.freight_status.to_WAIVED
          - state_machines.ShippedBlend.COMPOSED_to_VOID
          - state_machines.BlendComponent.ALLOCATED_to_VOIDED
          - state_machines.FiredLot.RESERVED_to_AVAILABLE
          - state_machines.SamplePanel.SUBMITTED_to_WITHDRAWN
        distinguishing_aspect: |
          The cascade originates at POST /orders/{id}/cancel and travels down the ORDER
          side of the graph: order -> shipped blend -> blend components -> fired lot
          inventory, with a second branch withdrawing an in-flight sample panel. Its
          fourth hop RETURNS reserved units to available inventory, whereas the
          plant-idle instance's fourth hop releases committed clay tonnage; the
          originating transition, the entities traversed and the invariant restored are
          all different.
