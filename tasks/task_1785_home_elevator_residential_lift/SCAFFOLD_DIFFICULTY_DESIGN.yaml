    instances:
      - name: contractor_window_pure_overlap
        grounds:
          - state_machines.StructuralWorkOrder.DRAFT_to_RELEASED
          - errors[ERR_CONTRACTOR_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Pure half-open interval overlap on the Contractor resource: WO1 occupies
          [08-10, 08-20); WO2 [08-15, 08-25) intersects its interior -> rejected;
          adjacency (end == start) is NOT a conflict under this semantics.
        test_recipe:
          setup:
            - "Two structural projects (HYD-200 CONDITIONAL) for the same contractor BuildCo, both PERMIT_APPROVED"
            - "WO1 on project 1 RELEASED with window 2026-08-10 -> 2026-08-20"
