              payload: { member_id: "${mem_chair_id}", vote: "FOR" }
              as: CommitteeChair
              as_user_id: "${mem_chair_id}"
            - call: "POST /governance/motions/${motion_elig_one_id}/close"
              payload: {}
              as: CommitteeChair
              as_user_id: "${mem_chair_id}"
            - call: "POST /governance/motions/${motion_all_recuse_id}/votes"
              payload: { member_id: "${mem_chair_id}", vote: "RECUSE", recusal_basis: "Board seat at the incumbent manager" }
