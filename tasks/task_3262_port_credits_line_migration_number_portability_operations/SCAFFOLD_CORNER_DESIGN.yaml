            - "SubscriberLine.${line}.number_status == UNASSIGNED"
      - name: ops_run_is_idempotent_until_cancellation_deadline
        claim_type: conditional_action
        grounds:
          - endpoints["POST /portability/system-config/ops-run"]
          - entities.SystemConfig.fields.ops_run_epoch
        distinguishing_aspect: "Two ops runs inside the cancellation grace window leave ops_run_epoch at 1, while the run whose triggered_at is strictly after last_line_cancellation_deadline advances it to 2, pinning the exact boundary."
        test_recipe:
          setup:
            - "One FAMILY account with an ACTIVE POSTPAID line that is then cancelled, stamping last_line_cancellation_deadline to 2026-09-03T00:00:00Z"
          setup_api_calls:
            - call: "POST /portability/accounts"
              payload: { account_type: "FAMILY", tax_id_last4: "8181", payment_history_score: 720, existing_deposit_cents: 50000 }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /portability/subscriber-lines"
              payload: { account_id: "${acct}", mdn: "4155558101", billing_mode: "POSTPAID" }
              as: PlatformAdmin
              captures: { line: $.data.id }
            - call: "POST /portability/subscriber-lines/${line}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /portability/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /portability/subscriber-lines/${line}/cancel"
              payload: { reason_code: "NONPAYMENT" }
              as: PlatformAdmin
          trigger:
            - call: "POST /portability/system-config/ops-run"
              payload: { triggered_at: "2026-09-02T12:00:00Z" }
              as: PlatformAdmin
              captures: { cfg_a: $.data.ops_run_epoch }
            - call: "POST /portability/system-config/ops-run"
              payload: { triggered_at: "2026-09-03T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /portability/system-config/ops-run"
              payload: { triggered_at: "2026-09-03T06:00:00Z" }
              as: PlatformAdmin
          assert:
            - "SystemConfig.ops_run_epoch == 2"
            - "SystemConfig.last_ops_run_at == \"2026-09-03T06:00:00Z\""
            - "SubscriberLine.${line}.number_status == RECLAIMED"

  - section: errors
    instances:
      - name: mdn_conflict_on_second_line_creation
        claim_type: violation_to_error
        grounds:
          - errors[ERR_MDN_CONFLICT]
          - validations[priority=13]
          - entities.SubscriberLine.fields.mdn
        distinguishing_aspect: "Creating a second subscriber line carrying an mdn already held by a row whose number_status is ASSIGNED returns ERR_MDN_CONFLICT with status 409."
        test_recipe:
          setup: ["One FAMILY account already owning one ACTIVE line numbered 4155559101"]
          setup_api_calls:
            - call: "POST /portability/accounts"
              payload: { account_type: "FAMILY", tax_id_last4: "9191", payment_history_score: 720, existing_deposit_cents: 50000 }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /portability/subscriber-lines"
              payload: { account_id: "${acct}", mdn: "4155559101", billing_mode: "POSTPAID" }
              as: PlatformAdmin
              captures: { line: $.data.id }
            - call: "POST /portability/subscriber-lines/${line}/activate"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /portability/subscriber-lines"
              payload: { account_id: "${acct}", mdn: "4155559101", billing_mode: "POSTPAID" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_MDN_CONFLICT"
            - "Account.${acct}.active_line_count == 1"
