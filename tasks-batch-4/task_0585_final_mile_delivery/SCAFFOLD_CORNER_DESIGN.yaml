            - "trigger response HTTP status == 403"

      - name: customer_confirm_window_not_owner
        claim_type: Ownership
        grounds: [roles.Customer, "validations[priority=3]", "errors[ERR_NOT_RESOURCE_OWNER]"]
        distinguishing_aspect: "A different customer (B) confirming customer A's window returns ERR_NOT_RESOURCE_OWNER (403)."
        test_recipe:
          setup: ["Order owned by customer A with a RESERVED window; a second customer B exists."]
