              as: RfEngineer
              captures: { ring_id: $.data.id }
            - call: "POST /search-rings/${ring_id}/open"
              as: RfEngineer
            - call: "POST /landlords"
              payload: { legal_name: "Beacon Holdings LLC", entity_type: "LLC", contact_email: "asset@beacon.example", market_code: "MKT-NE-01", outreach_optout: false }
              as: SiteAcquisitionAgent
              as_user_id: "agent-001"
              captures: { ll_id: $.data.id }
            - call: "POST /candidates"
              payload: { search_ring_id: "${ring_id}", landlord_id: "${ll_id}", jurisdiction_id: "${jur_id}", owning_agent_user_id: "agent-001", site_type: "TOWER", lat: 42.3510, lon: -71.0620, distance_from_center_m: 200, agl_m: 60, months_to_availability: 3, measured_rsrp_dbm: -88, offered_capacity_gbps: 10 }
              as: SiteAcquisitionAgent
              as_user_id: "agent-001"
              captures: { cand_id: $.data.id }
            - call: "POST /utility-providers"
              payload: { name: "Bay State Power", market_code: "MKT-NE-01", concurrent_crew_capacity: 2, quoted_interval_days: 30 }
              as: ConstructionManager
              captures: { prov_id: $.data.id }
          trigger:
            - call: "POST /backhaul-orders"
              payload: { candidate_id: "${cand_id}", provider_id: "${prov_id}", order_type: "POWER", window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-05T00:00:00Z" }
              as: ConstructionManager
              captures: { bo_id: $.data.id }
            - call: "POST /backhaul-orders/${bo_id}/status-actions"
              payload: { action: "CANCEL" }
              as: ConstructionManager
          assert:
            - "before the create UtilityProvider.${prov_id}.committed_crew_days == 0"
            - "after the create UtilityBackhaulOrder.${bo_id}.crew_days == 4 and UtilityProvider.${prov_id}.committed_crew_days == 4"
            - "after the cancel UtilityProvider.${prov_id}.committed_crew_days == 0"
            - "UtilityBackhaulOrder.${bo_id}.status == CANCELLED"
            - "UtilityBackhaulOrder.${bo_id}.crew_days == 4"

      - name: certify_then_disqualify_conserves_ring_committed_capex
        grounds:
          - calculations.ring_committed_capex
          - state_machines.ModificationDesign.PEER_REVIEW_to_CERTIFIED
          - state_machines.Candidate.STRUCTURAL_HOLD_to_DISQUALIFIED
          - entities.SearchRing.fields.committed_capex_usd
        distinguishing_aspect: |
          A third conserved quantity: SearchRing.committed_capex_usd. Certifying a 45000.00 design raises
          the ring ledger 0 -> 45000.00, and the compensating event (a superseding analysis completing FAIL,
          which disqualifies the candidate) drops the same 45000.00 back out even though the design row
          stays CERTIFIED with its cost intact.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z, an OPEN ring with capex_budget_usd 250000.00"
            - "one RF-qualified candidate with a COMPLETED TIA_222_H analysis at (70, 6, 105 mph, 0.5 in) -> 99.70 PASS_WITH_MOD"
