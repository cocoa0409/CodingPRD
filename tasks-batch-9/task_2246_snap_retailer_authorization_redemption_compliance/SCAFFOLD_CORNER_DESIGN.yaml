  - section: consistency_model
    instances:
      - name: every_derived_field_is_visible_in_the_same_response_that_causes_it
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - state_machines.StoreVisit.IN_PROGRESS_to_FINDINGS_SUBMITTED.side_effects
          - state_machines.Application.PENDING_VISIT_to_UNDER_REVIEW
        distinguishing_aspect: "consistency_model is immediate, so no re-read is ever required: the findings response itself already carries all six computed verification fields, and the very next read of the application, the inspector and the store - with no intervening write - already shows the advanced status, the released minutes and the unchanged authorization, with no lag window."
        test_recipe:
          setup:
            - "An IN_PROGRESS pre-authorization visit at the convenience store."
          setup_api_calls:
            - *k_owner
            - *k_store
            - *k_app
            - *k_submit
            - *k_insp
            - *k_visit
            - *k_start
          trigger:
            - *k_findings
            - call: "GET /applications/${app_id}"
              payload: {}
              as: RetailerOwner
              as_user_id: "${owner_id}"
            - call: "GET /inspectors/${insp_id}"
              payload: {}
              as: FnsAdmin
              as_user_id: "fns-admin-1"
            - call: "GET /store-visits/${visit_id}"
              payload: {}
              as: Inspector
              as_user_id: "${insp_id}"
          assert:
            - "the findings response body itself carries verified_qualifying_categories, verified_perishable_categories, verified_criterion_a_pass, depth_of_stock_pass, shelf_discrepancy_bps and shelf_discrepancy_flag - none of them null"
            - "the findings response already shows status == FINDINGS_SUBMITTED with findings_submitted_at == the current logical clock"
            - "the immediately following application read shows status == UNDER_REVIEW and verified_criterion_pass == true"
            - "the immediately following inspector read shows committed_minutes == 0"
            - "the visit re-read is byte-identical to the findings response body"
            - "no delay, retry or re-read loop is needed anywhere"

      - name: cascaded_cross_aggregate_fields_are_immediate_too
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.owner_sanction_rollup
          - calculations.penalty_ledger_balance
        distinguishing_aspect: "Immediacy extends across aggregate boundaries and up two levels: the determination response carries the case's own penalty figures, and in the same instant the ledger endpoint, the store's sanction_status and the owner-level rollup - a grandparent of the case - already reflect them without any reconciliation pass."
        test_recipe:
