              captures: { ep3: $.data.id }
            - call: "POST /sessions"
              payload: { episode_id: "${ep3}", engineer_id: "${eng_id}", capture_mode: "STUDIO", scheduled_start_utc: "2026-03-07T08:00:00Z", scheduled_end_utc: "2026-03-07T09:00:00Z" }
              as: ProducerEng
              as_user_id: "${eng_id}"
              captures: { s3: $.data.id }
