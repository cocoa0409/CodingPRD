            - "PickSession.${sesB}.approved_by_user_id == null and PickSession.${sesB}.dispute_reason_code == TALLY_DISPUTED"
            - "PickSession.${sesB}.revision_count == 0"
            - "Crew.${crew}.accrued_wage_cents == 4950 (exactly session A's net, not 0 and not 13950)"
            - "HarvestWindow.${win}.harvested_clamshells == 20"
            - "Picker.${pk2}.total_clamshells_lifetime == 0 and Picker.${pk2}.total_hours_lifetime == 0.00 and Picker.${pk2}.avg_lbs_per_hour == 0.00"
            - "Picker.${pk1}.total_clamshells_lifetime == 20 and Picker.${pk1}.total_hours_lifetime == 3.00 and Picker.${pk1}.avg_lbs_per_hour == 6.67 (untouched)"
            - "PickSession.${sesA}.status == APPROVED"

      - name: allocation_release_restores_lot_and_commitment_pounds_exactly
        grounds:
          - state_machines.LotAllocation.RESERVED_to_RELEASED
          - state_machines.FruitLot.disposition_status
          - calculations.commitment_settlement
          - entities.FruitLot.fields.available_lbs
          - entities.BuyerCommitment.fields.open_lbs
        distinguishing_aspect: |
          A two-sided reversal on a DIFFERENT pair of ledgers from the wage
          instance, released in two steps: with 60.00 + 30.00 lbs reserved
          against a 100.00 lb lot, releasing the 60.00 line must land the lot on
          allocated 30.00 / available 70.00 while disposition_status STAYS
          RESERVED (a live line remains), and only the second release flips it
          back to UNCOMMITTED with allocated 0.00 / available 100.00 — the
          commitment's committed_lbs and open_lbs mirroring each step exactly.
        test_recipe:
          setup:
            - "One STRAWBERRY block with three passing water samples (40, 50, 60 MPN)."
            - "One crew and one PLANNED window spanning 2026-08-03; one tunnel with slot_capacity 4."
            - "One grade-A lot of 100 clamshells at 1.00 lb, cooled to 34.0 F, cold_chain_status COOLED, packed_lbs 100.00."
            - "One OPEN buyer commitment for 100.00 lbs at 500 cents/lb, shelf-life guarantee 3 days, delivery window 2026-08-01..2026-08-10."
            - "Two RESERVED allocation lines on that lot: 60.00 lbs then 30.00 lbs."
          setup_api_calls:
            - call: "POST /berry-ops/blocks"
              payload: { name: "BLK-CI2", variety: "STRAWBERRY", acres: 8.00, planting_year: 2021, irrigation_source_code: "WELL-18" }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { blk: $.data.id }
            - call: "POST /berry-ops/water-tests"
              payload: { block_id: "${blk}", sample_date: "2026-07-20", generic_ecoli_mpn: 40 }
              as: FoodSafetyOfficer
              as_user_id: "fso-1"
            - call: "POST /berry-ops/water-tests"
              payload: { block_id: "${blk}", sample_date: "2026-07-24", generic_ecoli_mpn: 50 }
              as: FoodSafetyOfficer
              as_user_id: "fso-1"
            - call: "POST /berry-ops/water-tests"
              payload: { block_id: "${blk}", sample_date: "2026-07-28", generic_ecoli_mpn: 60 }
              as: FoodSafetyOfficer
              as_user_id: "fso-1"
            - call: "POST /berry-ops/crews"
              payload: { name: "CREW-CI2", labor_program: "DOMESTIC", supervisor_user_id: "sup-1", planned_head_count: 1, contract_start_date: "2026-07-01", contract_end_date: "2026-09-30" }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { crew: $.data.id }
            - call: "POST /berry-ops/harvest-windows"
              payload: { block_id: "${blk}", crew_id: "${crew}", start_at: "2026-08-03T05:00:00Z", end_at: "2026-08-03T17:00:00Z", forecast_brix: 8.5, planned_volume_lbs: 150.00, piece_rate_cents_per_clamshell: 45, clamshell_net_weight_lbs: 1.00 }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { win: $.data.id }
            - call: "POST /berry-ops/cooling-tunnels"
              payload: { name: "TUN-CI2", slot_capacity: 4, target_pulp_temp_f: 34.0 }
              as: PackhouseOperator
              as_user_id: "pack-1"
              captures: { tun: $.data.id, tun_v1: $.data.version }
            - call: "POST /berry-ops/fruit-lots"
              payload: { harvest_window_id: "${win}", block_id: "${blk}", pick_date: "2026-08-03", variety: "STRAWBERRY", grade: "A", clamshell_count: 100, clamshell_net_weight_lbs: 1.00, pack_completed_at: "2026-08-03T06:00:00Z", field_pulp_temp_f: 61.0 }
              as: PackhouseOperator
              as_user_id: "pack-1"
              captures: { lot: $.data.id }
            - call: "POST /berry-ops/fruit-lots/${lot}/start-cooling"
              payload: { cooling_tunnel_id: "${tun}", cool_start_at: "2026-08-03T08:00:00Z", planned_cool_end_at: "2026-08-03T12:00:00Z", entry_pulp_temp_f: 55.0, pallet_slots: 2, expected_cooling_tunnel_version: "${tun_v1}" }
              as: PackhouseOperator
              as_user_id: "pack-1"
            - call: "POST /berry-ops/fruit-lots/${lot}/complete-cooling"
              payload: { cool_complete_at: "2026-08-03T12:00:00Z", exit_pulp_temp_f: 34.0 }
              as: PackhouseOperator
              as_user_id: "pack-1"
            - call: "POST /berry-ops/buyer-commitments"
              payload: { buyer_name: "MarketTwo", buyer_user_id: "buyer-5", variety: "STRAWBERRY", volume_commitment_lbs: 100.00, price_cents_per_lb: 500, shelf_life_guarantee_days: 3, window_start_date: "2026-08-01", window_end_date: "2026-08-10" }
              as: SalesManager
              as_user_id: "sales-1"
              captures: { com: $.data.id, com_v1: $.data.version }
            - call: "POST /berry-ops/lot-allocations"
              payload: { fruit_lot_id: "${lot}", buyer_commitment_id: "${com}", allocated_lbs: 60.00, expected_buyer_commitment_version: "${com_v1}" }
              as: SalesManager
              as_user_id: "sales-1"
              captures: { al1: $.data.id }
            - call: "GET /berry-ops/buyer-commitments/${com}"
              payload: {}
              as: SalesManager
              as_user_id: "sales-1"
              captures: { com_v2: $.data.version }
            - call: "POST /berry-ops/lot-allocations"
              payload: { fruit_lot_id: "${lot}", buyer_commitment_id: "${com}", allocated_lbs: 30.00, expected_buyer_commitment_version: "${com_v2}" }
              as: SalesManager
              as_user_id: "sales-1"
              captures: { al2: $.data.id }
          trigger:
            - call: "POST /berry-ops/lot-allocations/${al1}/release"
              payload: { release_reason_code: "BUYER_CANCELLED" }
              as: SalesManager
              as_user_id: "sales-1"
            - call: "POST /berry-ops/lot-allocations/${al2}/release"
              payload: { release_reason_code: "BUYER_CANCELLED" }
              as: SalesManager
              as_user_id: "sales-1"
          assert:
            - "before any release: FruitLot.${lot}.packed_lbs == 100.00 and FruitLot.${lot}.allocated_lbs == 90.00 and FruitLot.${lot}.available_lbs == 10.00 and FruitLot.${lot}.disposition_status == RESERVED"
            - "before any release: BuyerCommitment.${com}.committed_lbs == 90.00 and BuyerCommitment.${com}.open_lbs == 10.00 and BuyerCommitment.${com}.shipped_lbs == 0.00"
            - "first release: response status is 200 and LotAllocation.${al1}.status == RELEASED and LotAllocation.${al1}.release_reason_code == BUYER_CANCELLED"
            - "after first release: FruitLot.${lot}.allocated_lbs == 30.00 and FruitLot.${lot}.available_lbs == 70.00"
            - "after first release: FruitLot.${lot}.disposition_status == RESERVED (the 30.00 lb line is still live)"
            - "after first release: BuyerCommitment.${com}.committed_lbs == 30.00 and BuyerCommitment.${com}.open_lbs == 70.00 and BuyerCommitment.${com}.status == OPEN"
            - "second release: response status is 200 and LotAllocation.${al2}.status == RELEASED"
            - "after second release: FruitLot.${lot}.allocated_lbs == 0.00 and FruitLot.${lot}.available_lbs == 100.00 and FruitLot.${lot}.disposition_status == UNCOMMITTED"
            - "after second release: BuyerCommitment.${com}.committed_lbs == 0.00 and BuyerCommitment.${com}.open_lbs == 100.00 and BuyerCommitment.${com}.shipped_lbs == 0.00"
            - "FruitLot.${lot}.packed_lbs == 100.00 and FruitLot.${lot}.cold_chain_status == COOLED (untouched by either release)"
