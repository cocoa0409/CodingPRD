          setup:
            - "CF chain converted to permanent financing on 2027-03-01: three operating months at noi 18,000,000 / debt service 15,000,000 / occupied 4, conversion under T3."
            - "Conversion stamped compliance_start_date 2027-03-01, compliance_end_date 2042-03-01 and extended_use_end_date 2057-03-01, and activated all four unit rows."
