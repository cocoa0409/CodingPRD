            - { call: "POST /hotline/counselors", payload: { display_name: "Reviewer R", languages: ["en"], certified_jurisdiction_codes: ["CA"], certified_categories: ["EVICTION"], certification_expires_at: "2027-01-01T00:00:00Z", is_script_reviewer: true }, as: AgencyAdmin, captures: { rev: $.data.id } }
            - { call: "POST /hotline/scripts", payload: { jurisdiction_id: "${jur}", issue_category: "EVICTION", version_no: 1, body: "script v1" }, as: Counselor, as_user_id: "${auth}", captures: { scr1: $.data.id } }
            - { call: "POST /hotline/scripts/${scr1}/state", payload: { to_status: "IN_REVIEW" }, as: Counselor, as_user_id: "${auth}" }
            - { call: "POST /hotline/scripts/${scr1}/state", payload: { to_status: "PUBLISHED", effective_from: "2026-08-01T00:00:00Z" }, as: Counselor, as_user_id: "${rev}" }
            - { call: "POST /hotline/counselors", payload: { display_name: "Worker W", languages: ["en"], certified_jurisdiction_codes: ["CA"], certified_categories: ["EVICTION"], certification_expires_at: "2027-01-01T00:00:00Z", is_script_reviewer: false }, as: AgencyAdmin, captures: { wk: $.data.id } }
            - { call: "POST /hotline/counselors/${wk}/training-certifications", payload: { script_id: "${scr1}", score: 90 }, as: HotlineSupervisor }
            - { call: "POST /hotline/interpreters", payload: { display_name: "Interp I", language_code: "es" }, as: AgencyAdmin, captures: { interp: $.data.id } }
            - { call: "POST /hotline/callers", payload: { alias: "caller-es", phone: "+15550002", preferred_language: "es", channel: "PHONE", is_anonymous: false }, as: Anonymous, captures: { cal: $.data.id } }
            - { call: "POST /hotline/sessions", payload: { caller_id: "${cal}", jurisdiction_id: "${jur}", issue_category: "EVICTION" }, as: Anonymous, captures: { sess: $.data.id } }
            - { call: "POST /hotline/sessions/${sess}/state", payload: { to_status: "ASSIGNED", counselor_id: "${wk}" }, as: Counselor, as_user_id: "${wk}" }
          trigger:
            - { call: "POST /hotline/sessions/${sess}/interpretation", payload: { to_status: "REQUESTED", interpreter_id: "${interp}", scheduled_start_at: "2026-08-02T10:00:00Z", scheduled_end_at: "2026-08-02T11:00:00Z" }, as: Counselor, as_user_id: "${wk}" }
            - { call: "POST /hotline/sessions/${sess}/state", payload: { to_status: "ACTIVE" }, as: Counselor, as_user_id: "${wk}", captures: { err: $.data.error_id } }
            - { call: "POST /hotline/sessions/${sess}/interpretation", payload: { to_status: "CONNECTED" }, as: Counselor, as_user_id: "${wk}" }
            - { call: "POST /hotline/sessions/${sess}/state", payload: { to_status: "ACTIVE" }, as: Counselor, as_user_id: "${wk}", captures: { sstat: $.data.session_status, istat: $.data.interpretation_status, pin: $.data.pinned_script_id, wait: $.data.queue_wait_seconds } }
          assert:
            - "Interpretation REQUESTED while session ASSIGNED: dimensions evolve independently (interpretation_status == REQUESTED, session_status still ASSIGNED)"
            - "Start while REQUESTED rejected: error_id == ERR_INVALID_STATE (cross-dimension gate)"
            - "After CONNECTED: start succeeds; session_status == ACTIVE and interpretation_status == CONNECTED"
            - "pinned_script_id == ${scr1} (current PUBLISHED script pinned at ACTIVE time)"
            - "queue_wait_seconds == 0 (created and started at the same logical instant) and the language rule passed via CONNECTED interpretation despite counselor speaking only en"

