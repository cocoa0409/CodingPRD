          setup:
            - "Empty database, logical clock 2026-08-01T00:00:00Z."
            - "Maple St (LOCAL, area 3333.33) measures 69.1 -> MILL_AND_OVERLAY, cost 10,743,323, bcr 14381.0110."
            - "Grand Blvd (ARTERIAL, area 13333.33) measures 30.0 -> RECONSTRUCTION, cost 237,099,941, bcr 11809.3631."
            - "Candidates generate in condition ASC order, so data[0] is Grand Blvd (30.0) and data[1] is Maple St (69.1)."
            - "Scenario A is WORST_FIRST at 20,000,000 and has already been run; scenario B on the same survey is BENEFIT_COST at the same 20,000,000 and is run in the trigger."
            - "The scan does not stop at the first deferral, so the cheap candidate is funded under both strategies."
