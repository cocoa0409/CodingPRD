              as_user_id: "${company_g_admin_id}"
            - &k_sub_g
              call: "GET /api/companies/${company_g_id}/subscription"
              payload: {}
              as: PlatformAdmin
              captures: { sub_g_id: $.data.id, sub_g_v: $.data.version }
