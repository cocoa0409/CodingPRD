  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine: two non-linear machines on DIFFERENT
  # entities: Case (cyclic CLOSED->REOPENED->ASSIGNED loop, max 2 reopens)
  # and Finding (parallel dimensions substantiation_status x approval_status
  # with a reject revision loop).
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: case_closed_reopened_cycle_with_variant_flip
        grounds:
          - state_machines.Case.CLOSED_to_REOPENED
          - state_machines.Case.REOPENED_to_ASSIGNED
          - entities.Case.fields.reopen_count
          - entities.CredibilityAssessment.fields.active_variant
        distinguishing_aspect: |
          Cyclic machine on the Case entity (distinct from the Finding
          machine in the sibling instance): CLOSED -> REOPENED -> ASSIGNED is
          a true cycle that mutates global behavior — on REOPENED every
          CredibilityAssessment of the case flips active_variant to
          RECENCY_WEIGHTED so the same inputs now yield score_recency-driven
          gating, and reopen_count increments from 0 to 1.
        test_recipe:
          setup:
            - "A fully processed case in CLOSED status with one CredibilityAssessment (corro=3, contra=0, age=10) whose active_variant is CORROBORATION_WEIGHTED."
            - "Clock at 2026-08-20T00:00:00Z."
          setup_api_calls:
            - call: "POST /er/intake-channels"
              payload: { channel_code: "ANONYMOUS_LETTER", display_name: "Anonymous Letter", default_category: "SAFETY", default_severity: "MEDIUM", sla_business_days: 15 }
              as: ERManager
              captures: { ch1: $.data.id }
