# =============================================================================
# School-Based Medicaid Billing (LEA) — benchmark seed tables (§1.0–§1.7)
# =============================================================================

scenario: |
  School-Based Medicaid Billing (LEA): student & IEP-service eligibility,
  parental consent & provider credential, service log & documentation,
  encounter capture & Medicaid claim, random-moment time study (RMTS),
  cost-settlement, denial/rebill, reporting

domain_name: school-based-medicaid-billing-lea
api_prefix: /sbmb

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation

  entity_topology: flat
  # Peer entities joined by FK references; no nesting in URL paths. Every
  # collection sits directly under /sbmb; children carry parent FKs in the body.

  state_machine_shape: cyclic
  # Claim: SUBMITTED->DENIED->SUBMITTED (rebill) loop. ServiceLog:
  # DOCUMENTED->LOGGED (return) loop plus CLAIMED->DENIED->CLAIMED (rebill).

  relationship_patterns:
    - one_to_many        # Student -> IEPAuthorization / ParentalConsent / Claim / ServiceLog
    - cross_aggregate    # ServiceLog references IEPAuthorization, Provider, Student, Claim

  role_model: segregation_of_duties
  # ServiceProvider logs & documents; BillingCoordinator verifies & submits;
  # StateReviewer adjudicates & settles. No single role spans log -> verify,
  # nor submit -> adjudicate.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Student
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: medicaid_id, type: string, source: input, description: "State Medicaid member identifier" }
      - { name: first_name, type: string, source: input, description: "Student first name" }
      - { name: last_name, type: string, source: input, description: "Student last name" }
      - { name: date_of_birth, type: string, source: input, description: "ISO date YYYY-MM-DD" }
      - { name: district_student_id, type: string, source: input, description: "LEA-local student identifier" }
      - { name: medicaid_eligible, type: boolean, source: input, default: true, description: "Whether the student is currently Medicaid-enrolled" }
      - { name: status, type: enum, source: system, description: "ACTIVE -> WITHDRAWN. Constraints: value in {ACTIVE, WITHDRAWN}" }
      - { name: interim_paid_cents, type: integer, source: computed, default: 0, description: "Ledger: sum of interim_payment_cents over this student's Claims in status PAID (money-conserved quantity)" }
      - { name: verified_service_units, type: integer, source: computed, default: 0, description: "Ledger: sum of delivered_units over this student's ServiceLogs in status {VERIFIED, CLAIMED, PAID, DENIED} (unit-conserved quantity)" }

  - name: IEPAuthorization
    parent: null
    common_fields: true
    fields:
      - { name: student_id, type: string, source: input, description: "FK -> Student.id; the student this IEP service line authorizes" }
      - { name: service_type, type: enum, source: input, description: "Constraints: value in {SPEECH_THERAPY, OCCUPATIONAL_THERAPY, PHYSICAL_THERAPY, PSYCH_COUNSELING, NURSING, AUDIOLOGY}" }
      - { name: procedure_code, type: string, source: input, description: "HCPCS/CPT billing code for this service line, e.g. 92507" }
      - { name: unit_minutes, type: integer, source: input, description: "Minutes that constitute one billable unit for this procedure (e.g. 15)" }
      - { name: unit_rate_cents, type: integer, source: input, description: "Medicaid fee-schedule rate per billable unit, in cents" }
      - { name: authorized_minutes_per_session, type: integer, source: input, description: "IEP-authorized minutes per session (basis of the provisional units variant)" }
      - { name: sessions_per_week, type: integer, source: input, description: "IEP-authorized session frequency" }
      - { name: effective_date, type: string, source: input, description: "ISO date; start of the authorization window (inclusive)" }
      - { name: expiration_date, type: string, source: input, description: "ISO date; end of the authorization window (inclusive)" }
      - { name: status, type: enum, source: system, description: "DRAFT -> ACTIVE -> DISCONTINUED; ACTIVE -> EXPIRED (system, clock past expiration_date). Constraints: value in {DRAFT, ACTIVE, DISCONTINUED, EXPIRED}" }

  - name: ParentalConsent
    parent: null
    common_fields: true
    fields:
      - { name: student_id, type: string, source: input, description: "FK -> Student.id; the student this consent covers" }
      - { name: consent_type, type: enum, source: input, description: "Constraints: value in {BILLING, DISCLOSURE}. BILLING consent is required before any service is logged for billing" }
      - { name: signed_by, type: string, source: input, description: "Name of the parent/guardian who signed" }
      - { name: status, type: enum, source: system, description: "PENDING -> GRANTED -> REVOKED -> GRANTED (re-consent). Constraints: value in {PENDING, GRANTED, REVOKED}" }
      - { name: granted_date, type: string, source: system, description: "Logical-clock timestamp when last GRANTED; null while PENDING" }
      - { name: revoked_date, type: string, source: system, description: "Logical-clock timestamp when last REVOKED; null unless REVOKED" }

  - name: Provider
    parent: null
    common_fields: true
    fields:
      - { name: npi, type: string, source: input, description: "National Provider Identifier" }
      - { name: first_name, type: string, source: input, description: "Provider first name" }
      - { name: last_name, type: string, source: input, description: "Provider last name" }
      - { name: discipline, type: enum, source: input, description: "Constraints: value in {SLP, OT, PT, PSYCH, RN, AUD}" }
      - { name: employment_status, type: enum, source: system, description: "Constraints: value in {ACTIVE}; set ACTIVE at creation" }

  - name: ProviderCredential
    parent: null
    common_fields: true
    fields:
      - { name: provider_id, type: string, source: input, description: "FK -> Provider.id; the provider this credential belongs to" }
      - { name: credential_type, type: enum, source: input, description: "Constraints: value in {STATE_LICENSE, NPI_ENROLLMENT, MEDICAID_ENROLLMENT}" }
      - { name: license_number, type: string, source: input, description: "Credential/license number" }
      - { name: effective_date, type: string, source: input, description: "ISO date; start of validity window (inclusive, closed interval)" }
      - { name: expiration_date, type: string, source: input, description: "ISO date; end of validity window (inclusive, closed interval)" }
      - { name: status, type: enum, source: system, description: "PENDING -> ACTIVE -> SUSPENDED -> ACTIVE (reinstate); ACTIVE -> EXPIRED (system, clock past expiration_date). Constraints: value in {PENDING, ACTIVE, SUSPENDED, EXPIRED}" }

  - name: ServiceLog
    parent: null
    common_fields: true
    fields:
      - { name: iep_authorization_id, type: string, source: input, description: "FK -> IEPAuthorization.id; the authorized service line delivered" }
      - { name: provider_id, type: string, source: input, description: "FK -> Provider.id; the delivering provider; MUST equal X-User-ID of the ServiceProvider caller" }
      - { name: student_id, type: string, source: input, description: "FK -> Student.id; the student served" }
      - { name: claim_id, type: string, source: system, description: "FK -> Claim.id; set when attached to a claim, null otherwise" }
      - { name: service_date, type: string, source: input, description: "ISO date the service was delivered" }
      - { name: start_time, type: string, source: input, description: "ISO datetime session start (half-open interval start, inclusive)" }
      - { name: end_time, type: string, source: input, description: "ISO datetime session end (half-open interval end, exclusive)" }
      - { name: delivered_minutes, type: integer, source: input, description: "Actual minutes of service delivered (basis of the delivered/final units variant)" }
      - { name: group_size, type: integer, source: input, default: 1, description: "Number of students in the session; 1 for individual" }
      - { name: documentation_note, type: string, source: input, description: "Clinical documentation added at DOCUMENT; null while LOGGED" }
      - { name: return_reason, type: string, source: input, description: "Reason recorded when a DOCUMENTED log is RETURNED for correction; null otherwise" }
      - { name: delivered_units, type: integer, source: computed, default: 0, description: "Billable units captured at VERIFY = round_half_up(delivered_minutes / IEPAuthorization.unit_minutes)" }
      - { name: charge_cents, type: integer, source: computed, default: 0, description: "= delivered_units * IEPAuthorization.unit_rate_cents; set at VERIFY" }
      - { name: status, type: enum, source: system, description: "LOGGED -> DOCUMENTED -> VERIFIED -> CLAIMED -> PAID/DENIED; DOCUMENTED -> LOGGED (return); DENIED -> CLAIMED (rebill); CLAIMED/PAID -> VERIFIED (claim void detach); any non-terminal -> VOID. Constraints: value in {LOGGED, DOCUMENTED, VERIFIED, CLAIMED, PAID, DENIED, VOID}" }

  - name: Claim
    parent: null
    common_fields: true
    fields:
      - { name: student_id, type: string, source: input, description: "FK -> Student.id; the student billed on this claim" }
      - { name: service_month, type: string, source: input, description: "Billing period, YYYY-MM" }
      - { name: status, type: enum, source: system, description: "DRAFT -> SUBMITTED -> PAID/DENIED; DENIED -> SUBMITTED (rebill); {DRAFT,DENIED,PAID} -> VOID. Constraints: value in {DRAFT, SUBMITTED, PAID, DENIED, VOID}" }
      - { name: total_charge_cents, type: integer, source: computed, default: 0, description: "Sum over attached ServiceLogs (status in {CLAIMED, PAID, DENIED}) of ServiceLog.charge_cents; recomputed on attach/detach" }
      - { name: interim_payment_cents, type: integer, source: computed, default: 0, description: "FFS interim payment fixed at APPROVE = total_charge_cents; 0 until PAID" }
      - { name: denial_reason, type: enum, source: system, description: "Set on DENY; null otherwise. Constraints: value in {MISSING_CONSENT, CREDENTIAL_LAPSED, DUPLICATE_CLAIM, DOC_INCOMPLETE}" }
      - { name: rebill_count, type: integer, source: system, default: 0, description: "Number of times this claim has been resubmitted after a denial" }
      - { name: submitted_date, type: string, source: system, description: "Logical-clock timestamp of the most recent submit; null while DRAFT" }
      - { name: attached_log_count, type: integer, source: computed, default: 0, description: "Count of ServiceLogs whose claim_id == this claim and status in {CLAIMED, PAID, DENIED}" }

  - name: RMTSQuarter
    parent: null
    common_fields: true
    fields:
      - { name: fiscal_quarter, type: string, source: input, description: "Study period label, e.g. 2026-Q1" }
      - { name: status, type: enum, source: system, description: "OPEN -> CLOSED. Constraints: value in {OPEN, CLOSED}. Moments may be generated/responded/coded only while OPEN" }
      - { name: total_moments, type: integer, source: computed, default: 0, description: "Count of RMTSMoments in this quarter" }
      - { name: responded_moments, type: integer, source: computed, default: 0, description: "Count of RMTSMoments in this quarter with status == CODED" }
      - { name: medicaid_eligible_moments, type: integer, source: computed, default: 0, description: "Count of CODED RMTSMoments with is_medicaid_eligible_moment == true" }
      - { name: medicaid_eligibility_ratio, type: number, source: computed, default: 0, description: "Fixed at CLOSE = round_half_up(medicaid_eligible_moments / responded_moments, 4); 0 while OPEN" }

  - name: RMTSMoment
    parent: null
    common_fields: true
    fields:
      - { name: rmts_quarter_id, type: string, source: input, description: "FK -> RMTSQuarter.id; the study period this sampled moment belongs to" }
      - { name: provider_id, type: string, source: input, description: "FK -> Provider.id; the sampled provider who must respond; respond caller X-User-ID MUST equal this" }
      - { name: moment_timestamp, type: string, source: input, description: "ISO datetime of the sampled moment" }
      - { name: activity_response, type: string, source: input, description: "Free-text description the provider records at RESPOND; null while GENERATED" }
      - { name: activity_category, type: enum, source: input, description: "Assigned at CODE. Constraints: value in {DIRECT_MEDICAL, MEDICAL_ADMIN, GENERAL_ADMIN, NON_MEDICAL, NON_RESPONSE}" }
      - { name: is_medicaid_eligible_moment, type: boolean, source: computed, default: false, description: "= activity_category in {DIRECT_MEDICAL, MEDICAL_ADMIN}; set at CODE" }
      - { name: status, type: enum, source: system, description: "GENERATED -> RESPONDED -> CODED. Constraints: value in {GENERATED, RESPONDED, CODED}" }

  - name: CostSettlement
    parent: null
    common_fields: true
    fields:
      - { name: rmts_quarter_id, type: string, source: input, description: "FK -> RMTSQuarter.id; the CLOSED study period whose ratio feeds the settlement" }
      - { name: certified_cost_cents, type: integer, source: input, description: "Total certified LEA program cost for the pool, in cents" }
      - { name: iep_ratio_bps, type: integer, source: input, description: "IEP (special-education) ratio in basis points, e.g. 4000 = 40%" }
      - { name: fmap_bps, type: integer, source: input, description: "Federal Medical Assistance Percentage in basis points, e.g. 5000 = 50%" }
      - { name: interim_paid_cents, type: integer, source: input, description: "LEA-supplied total of interim FFS payments already reimbursed for the pool" }
      - { name: gross_medicaid_cost_cents, type: integer, source: computed, default: 0, description: "= round_half_up(round_half_up(certified_cost_cents * ratio) * iep_ratio_bps / 10000); Medicaid+IEP allocated cost before FMAP" }
      - { name: federal_share_cents, type: integer, source: computed, default: 0, description: "= round_half_up(gross_medicaid_cost_cents * fmap_bps / 10000); the cost-settled reimbursement (dual-variant counterpart to interim FFS)" }
      - { name: net_settlement_cents, type: integer, source: computed, default: 0, description: "= federal_share_cents - interim_paid_cents; may be negative (recoupment owed back to the state)" }
      - { name: status, type: enum, source: system, description: "CALCULATED -> CERTIFIED -> SETTLED. Constraints: value in {CALCULATED, CERTIFIED, SETTLED}" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Student
    initial_state: ACTIVE
    terminal_states: [WITHDRAWN]
    transitions:
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /sbmb/students/{studentId}/withdraw"
        actor: MedicaidCoordinator
        preconditions: ["student.status == ACTIVE"]
        side_effects:
          - "CASCADE link1: every IEPAuthorization with student_id == this student AND status == ACTIVE transitions ACTIVE -> DISCONTINUED"
          - "each DISCONTINUED IEPAuthorization then fires its own DISCONTINUED side_effects (see IEPAuthorization ACTIVE->DISCONTINUED), producing a depth-3 cascade"
        note: "Depth-3 cascade origin: student -> authorization -> service-log -> claim/ledger."

  - entity: IEPAuthorization
    initial_state: DRAFT
    terminal_states: [DISCONTINUED, EXPIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /sbmb/iep-authorizations/{authorizationId}/activate"
        actor: MedicaidCoordinator
        preconditions: ["authorization.status == DRAFT"]
        side_effects: []
      - from: ACTIVE
        to: DISCONTINUED
        trigger: "POST /sbmb/iep-authorizations/{authorizationId}/discontinue OR cascade from Student.withdraw"
        actor: MedicaidCoordinator
        preconditions: ["authorization.status == ACTIVE"]
        side_effects:
          - "CASCADE link1(from-discontinue) / link2(from-withdraw): every ServiceLog with iep_authorization_id == this authorization AND status in {LOGGED, DOCUMENTED, VERIFIED} transitions to VOID"
          - "each VOIDed ServiceLog then fires its own VOID side_effects (see ServiceLog *->VOID), producing the next cascade hop"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system: logical clock advances past expiration_date"
        actor: system
        preconditions: ["authorization.status == ACTIVE", "current_clock_date > authorization.expiration_date"]
        side_effects: []
        note: "Evaluated lazily whenever the authorization gates a service-log create."

  - entity: ParentalConsent
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: GRANTED
        trigger: "POST /sbmb/parental-consents/{consentId}/grant"
        actor: MedicaidCoordinator
        preconditions: ["consent.status == PENDING"]
        side_effects: ["granted_date = current logical clock"]
      - from: GRANTED
        to: REVOKED
        trigger: "POST /sbmb/parental-consents/{consentId}/revoke"
        actor: MedicaidCoordinator
        preconditions: ["consent.status == GRANTED"]
        side_effects: ["revoked_date = current logical clock"]
      - from: REVOKED
        to: GRANTED
        trigger: "POST /sbmb/parental-consents/{consentId}/grant"
        actor: MedicaidCoordinator
        preconditions: ["consent.status == REVOKED"]
        side_effects: ["granted_date = current logical clock", "revoked_date = null"]
        note: "Cyclic re-consent."

  - entity: ProviderCredential
    initial_state: PENDING
    terminal_states: [EXPIRED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /sbmb/provider-credentials/{credentialId}/activate"
        actor: MedicaidCoordinator
        preconditions:
          - "credential.status == PENDING"
          - "no other ProviderCredential for the same provider_id AND same credential_type in status ACTIVE has a validity window [effective_date, expiration_date] (closed) overlapping this credential's window"
        side_effects: []
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /sbmb/provider-credentials/{credentialId}/suspend"
        actor: MedicaidCoordinator
        preconditions: ["credential.status == ACTIVE"]
        side_effects: []
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /sbmb/provider-credentials/{credentialId}/activate"
        actor: MedicaidCoordinator
        preconditions:
          - "credential.status == SUSPENDED"
          - "no other ACTIVE ProviderCredential for same provider_id AND credential_type overlaps this window (closed interval)"
        side_effects: []
        note: "Reinstate."
      - from: ACTIVE
        to: EXPIRED
        trigger: "system: logical clock advances past expiration_date"
        actor: system
        preconditions: ["credential.status == ACTIVE", "current_clock_date > credential.expiration_date"]
        side_effects: []
        note: "Evaluated lazily whenever the credential gates a claim submit."

  - entity: ServiceLog
    initial_state: LOGGED
    terminal_states: [VOID]
    transitions:
      - from: LOGGED
        to: DOCUMENTED
        trigger: "POST /sbmb/service-logs/{serviceLogId}/document"
        actor: ServiceProvider
        preconditions: ["log.status == LOGGED", "caller X-User-ID == log.provider_id"]
        side_effects: ["documentation_note recorded"]
      - from: DOCUMENTED
        to: VERIFIED
        trigger: "POST /sbmb/service-logs/{serviceLogId}/verify"
        actor: BillingCoordinator
        preconditions: ["log.status == DOCUMENTED", "computed delivered_units >= 1"]
        side_effects:
          - "delivered_units = round_half_up(delivered_minutes / IEPAuthorization.unit_minutes)"
          - "charge_cents = delivered_units * IEPAuthorization.unit_rate_cents"
          - "Student.verified_service_units += delivered_units (forward action of the unit-conservation invariant)"
        note: "Encounter capture. Documentation and verification are segregated across roles."
      - from: DOCUMENTED
        to: LOGGED
        trigger: "POST /sbmb/service-logs/{serviceLogId}/return"
        actor: BillingCoordinator
        preconditions: ["log.status == DOCUMENTED"]
        side_effects: ["return_reason recorded", "documentation_note cleared to null"]
        note: "Cyclic revision loop; provider must re-document."
      - from: VERIFIED
        to: CLAIMED
        trigger: "POST /sbmb/claims/{claimId}/attach"
        actor: BillingCoordinator
        preconditions: ["log.status == VERIFIED", "log.claim_id == null", "log.student_id == claim.student_id"]
        side_effects: ["claim_id = claim.id", "claim.total_charge_cents recomputed", "claim.attached_log_count recomputed"]
      - from: VERIFIED
        to: VOID
        trigger: "POST /sbmb/service-logs/{serviceLogId}/void OR cascade from IEPAuthorization.discontinue"
        actor: BillingCoordinator
        preconditions: ["log.status == VERIFIED", "log.claim_id == null"]
        side_effects: ["Student.verified_service_units -= delivered_units (compensating action of the unit-conservation invariant)"]
      - from: LOGGED
        to: VOID
        trigger: "cascade from IEPAuthorization.discontinue / Student.withdraw"
        actor: system
        preconditions: ["log.status == LOGGED"]
        side_effects: []
      - from: DOCUMENTED
        to: VOID
        trigger: "cascade from IEPAuthorization.discontinue / Student.withdraw"
        actor: system
        preconditions: ["log.status == DOCUMENTED"]
        side_effects: []
      - from: CLAIMED
        to: PAID
        trigger: "cascade from Claim.adjudicate(APPROVE)"
        actor: system
        preconditions: ["log.status == CLAIMED"]
        side_effects: []
      - from: CLAIMED
        to: DENIED
        trigger: "cascade from Claim.adjudicate(DENY)"
        actor: system
        preconditions: ["log.status == CLAIMED"]
        side_effects: []
      - from: DENIED
        to: CLAIMED
        trigger: "cascade from Claim.submit (rebill of a DENIED claim)"
        actor: system
        preconditions: ["log.status == DENIED"]
        side_effects: []
        note: "Cyclic with CLAIMED->DENIED."
      - from: CLAIMED
        to: VERIFIED
        trigger: "cascade from Claim.void"
        actor: system
        preconditions: ["log.status == CLAIMED"]
        side_effects: ["claim_id = null", "claim.total_charge_cents recomputed"]
      - from: PAID
        to: VERIFIED
        trigger: "cascade from Claim.void"
        actor: system
        preconditions: ["log.status == PAID"]
        side_effects: ["claim_id = null", "claim.total_charge_cents recomputed"]

  - entity: Claim
    initial_state: DRAFT
    terminal_states: [VOID]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /sbmb/claims/{claimId}/submit"
        actor: BillingCoordinator
        preconditions:
          - "claim.status == DRAFT"
          - "claim.attached_log_count >= 1"
          - "for every attached ServiceLog, the delivering Provider has a ProviderCredential in status ACTIVE whose closed window covers the log.service_date"
          - "(current_clock_date - max attached ServiceLog.service_date) <= TIMELY_FILING_DAYS"
        side_effects: ["submitted_date = current logical clock"]
      - from: SUBMITTED
        to: PAID
        trigger: "POST /sbmb/claims/{claimId}/adjudicate  (outcome=APPROVE)"
        actor: StateReviewer
        preconditions: ["claim.status == SUBMITTED"]
        side_effects:
          - "interim_payment_cents = total_charge_cents"
          - "Student.interim_paid_cents += interim_payment_cents (forward action of the money-conservation invariant)"
          - "each attached ServiceLog CLAIMED -> PAID"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /sbmb/claims/{claimId}/adjudicate  (outcome=DENY)"
        actor: StateReviewer
        preconditions: ["claim.status == SUBMITTED", "denial_reason provided"]
        side_effects: ["denial_reason recorded", "each attached ServiceLog CLAIMED -> DENIED"]
      - from: DENIED
        to: SUBMITTED
        trigger: "POST /sbmb/claims/{claimId}/submit  (rebill)"
        actor: BillingCoordinator
        preconditions:
          - "claim.status == DENIED"
          - "for every attached ServiceLog, the delivering Provider has an ACTIVE ProviderCredential covering log.service_date"
          - "(current_clock_date - max attached ServiceLog.service_date) <= TIMELY_FILING_DAYS"
        side_effects:
          - "rebill_count += 1"
          - "submitted_date = current logical clock"
          - "denial_reason cleared to null"
          - "each attached ServiceLog DENIED -> CLAIMED"
        note: "Cyclic SUBMITTED->DENIED->SUBMITTED."
      - from: PAID
        to: VOID
        trigger: "POST /sbmb/claims/{claimId}/void"
        actor: BillingCoordinator
        preconditions: ["claim.status == PAID"]
        side_effects:
          - "Student.interim_paid_cents -= interim_payment_cents (compensating action of the money-conservation invariant)"
          - "each attached ServiceLog PAID -> VERIFIED (detach: claim_id=null)"
          - "total_charge_cents = 0, interim_payment_cents = 0, attached_log_count = 0"
      - from: DRAFT
        to: VOID
        trigger: "POST /sbmb/claims/{claimId}/void"
        actor: BillingCoordinator
        preconditions: ["claim.status == DRAFT"]
        side_effects:
          - "each attached ServiceLog CLAIMED -> VERIFIED (detach: claim_id=null)"
          - "total_charge_cents = 0, attached_log_count = 0"
      - from: DENIED
        to: VOID
        trigger: "POST /sbmb/claims/{claimId}/void"
        actor: BillingCoordinator
        preconditions: ["claim.status == DENIED"]
        side_effects:
          - "each attached ServiceLog DENIED -> VERIFIED (detach: claim_id=null)"
          - "total_charge_cents = 0, attached_log_count = 0"

  - entity: RMTSQuarter
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /sbmb/rmts-quarters/{quarterId}/close"
        actor: MedicaidCoordinator
        preconditions:
          - "quarter.status == OPEN"
          - "responded_moments >= MIN_RESPONDED_MOMENTS"
        side_effects: ["medicaid_eligibility_ratio = round_half_up(medicaid_eligible_moments / responded_moments, 4)"]

  - entity: RMTSMoment
    initial_state: GENERATED
    terminal_states: [CODED]
    transitions:
      - from: GENERATED
        to: RESPONDED
        trigger: "POST /sbmb/rmts-moments/{momentId}/respond"
        actor: ServiceProvider
        preconditions: ["moment.status == GENERATED", "moment.rmts_quarter.status == OPEN", "caller X-User-ID == moment.provider_id"]
        side_effects: ["activity_response recorded"]
      - from: RESPONDED
        to: CODED
        trigger: "POST /sbmb/rmts-moments/{momentId}/code"
        actor: MedicaidCoordinator
        preconditions: ["moment.status == RESPONDED", "moment.rmts_quarter.status == OPEN"]
        side_effects:
          - "is_medicaid_eligible_moment = (activity_category in {DIRECT_MEDICAL, MEDICAL_ADMIN})"
          - "quarter.responded_moments and quarter.medicaid_eligible_moments recomputed"

  - entity: CostSettlement
    initial_state: CALCULATED
    terminal_states: [SETTLED]
    transitions:
      - from: CALCULATED
        to: CERTIFIED
        trigger: "POST /sbmb/cost-settlements/{settlementId}/certify"
        actor: MedicaidCoordinator
        preconditions: ["settlement.status == CALCULATED"]
        side_effects: []
      - from: CERTIFIED
        to: SETTLED
        trigger: "POST /sbmb/cost-settlements/{settlementId}/settle"
        actor: StateReviewer
        preconditions: ["settlement.status == CERTIFIED"]
        side_effects: []
        note: "Segregation: LEA certifies, State settles."

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: settlement-create-stale-quarter
    parent_entity: RMTSQuarter
    write_endpoint: "POST /sbmb/cost-settlements"
    occ_field: "expected_rmts_quarter_version"
    description: |
      Creating a CostSettlement against an RMTSQuarter whose version has
      advanced since the client last observed it is rejected. A new settlement
      legitimately supersedes a prior settlement for the same closed quarter
      (corrections re-run the reconciliation); when another writer has already
      created a settlement — which bumps the quarter's version — the current
      writer's basis is stale and the create is refused on the stale version.
    error_id: ERR_STALE_QUARTER_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: service_log_billable_units
    trigger: "POST /sbmb/service-logs/{serviceLogId}/verify (final variant); provisional variant is derivable at any time from the authorization"
    algorithm: threshold
    formula: |
      unit_minutes  = IEPAuthorization.unit_minutes
      delivered_units = round_half_up(delivered_minutes / unit_minutes)   # nearest integer
      charge_cents    = delivered_units * IEPAuthorization.unit_rate_cents
    input_set: "The single ServiceLog being verified and its linked IEPAuthorization."
    constants: {}
    precision: "integer units, round_half_up on the minutes/unit quotient"
    variants:
      - name: authorized_provisional
        when: "Expected units from the IEP authorization, before delivery is known"
        difference: "units = round_half_up(IEPAuthorization.authorized_minutes_per_session / unit_minutes); uses authorized minutes, not delivered minutes"
      - name: delivered_final
        when: "At VERIFY, once the actual session length is known"
        difference: "units = round_half_up(delivered_minutes / unit_minutes); this is the persisted delivered_units"

  - name: claim_total_charge
    trigger: "recomputed on POST /sbmb/claims/{claimId}/attach and on any detach (claim void, log void)"
    algorithm: aggregation
    formula: |
      # Pinned order: round each ServiceLog to whole units, compute per-log
      # charge, THEN sum. Do NOT sum delivered_minutes across logs first.
      total_charge_cents = sum(
        round_half_up(log.delivered_minutes / log.authorization.unit_minutes) * log.authorization.unit_rate_cents
        for log in attached_logs
      )
      where attached_logs = ServiceLogs with claim_id == claim.id and status in {CLAIMED, PAID, DENIED}
    input_set: "Attached ServiceLogs in status {CLAIMED, PAID, DENIED}; VERIFIED-but-detached and VOID logs excluded."
    constants: {}
    precision: "integer cents; per-log round_half_up on units then multiply then sum (round-then-sum, NOT sum-then-round)"

  - name: claim_interim_payment
    trigger: "POST /sbmb/claims/{claimId}/adjudicate (outcome=APPROVE)"
    algorithm: aggregation
    formula: |
      interim_payment_cents = total_charge_cents   # full FFS fee-schedule allowed amount
    input_set: "The claim's own total_charge_cents at APPROVE time."
    constants: {}
    precision: "integer cents"
    variants:
      - name: interim_ffs
        when: "Interim claiming: reimbursement equals the fee-schedule charge"
        difference: "Equals total_charge_cents. Counterpart of the cost-settled reimbursement, which is cost-based and generally differs."

  - name: rmts_medicaid_eligibility_ratio
    trigger: "POST /sbmb/rmts-quarters/{quarterId}/close"
    algorithm: aggregation
    formula: |
      responded_moments        = count(moment in quarter where status == CODED)
      medicaid_eligible_moments = count(moment in quarter where status == CODED and is_medicaid_eligible_moment == true)
      medicaid_eligibility_ratio = round_half_up(medicaid_eligible_moments / responded_moments, 4)
    input_set: "All CODED RMTSMoments in the quarter; requires responded_moments >= MIN_RESPONDED_MOMENTS (boundary >=)."
    constants:
      MIN_RESPONDED_MOMENTS: 4
    precision: "ratio to 4 decimals, round_half_up; guarded by MIN_RESPONDED_MOMENTS"

  - name: cost_settlement_net
    trigger: "POST /sbmb/cost-settlements (computes at CALCULATED)"
    algorithm: waterfall_allocation
    formula: |
      ratio                    = RMTSQuarter.medicaid_eligibility_ratio           # quarter must be CLOSED
      medicaid_allocated_cents = round_half_up(certified_cost_cents * ratio)
      gross_medicaid_cost_cents = round_half_up(medicaid_allocated_cents * iep_ratio_bps / 10000)
      federal_share_cents      = round_half_up(gross_medicaid_cost_cents * fmap_bps / 10000)
      net_settlement_cents     = federal_share_cents - interim_paid_cents          # may be negative (recoupment)
    input_set: "The settlement's inputs plus the linked CLOSED quarter's ratio (>=4 inputs: certified_cost_cents, ratio, iep_ratio_bps, fmap_bps, interim_paid_cents)."
    constants: {}
    precision: "integer cents; round_half_up applied at EACH nested step in the pinned order above"
    variants:
      - name: cost_settled
        when: "Annual cost-settlement reconciliation"
        difference: "Cost-based federal share; compared against the interim FFS total for the same services, the two methods yield different reimbursement amounts."

  - name: student_interim_paid_ledger
    trigger: "recomputed on Claim.adjudicate(APPROVE) and Claim.void"
    algorithm: aggregation
    formula: |
      Student.interim_paid_cents = sum(claim.interim_payment_cents for claim in this student's Claims where status == PAID)
    input_set: "This student's Claims in status PAID."
    constants: {}
    precision: "integer cents; conserved quantity for the money-conservation invariant"

  - name: student_verified_service_units
    trigger: "recomputed on ServiceLog VERIFY and on ServiceLog VOID"
    algorithm: aggregation
    formula: |
      Student.verified_service_units = sum(log.delivered_units for log in this student's ServiceLogs where status in {VERIFIED, CLAIMED, PAID, DENIED})
    input_set: "This student's non-void ServiceLogs that have been verified (status in {VERIFIED, CLAIMED, PAID, DENIED})."
    constants: {}
    precision: "integer units; conserved quantity for the unit-conservation invariant"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except GET list/read which still require headers"
  - priority: 2
    category: auth
    check: "Caller's role is permitted for this endpoint per the RBAC matrix"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Every resource named in the path exists (validated left-to-right)"
    error_id: "ERR_<RESOURCE>_NOT_FOUND"
    http_status: 404
    applies_to: "all id-bearing paths"
  - priority: 4
    category: existence
    check: "Every FK referenced in the body exists (student_id, provider_id, iep_authorization_id, rmts_quarter_id, service_log_id)"
    error_id: "ERR_<RESOURCE>_NOT_FOUND"
    http_status: 404
    applies_to: "create + attach endpoints"
  - priority: 5
    category: state
    check: "Ownership: for ServiceProvider-actor endpoints (service-logs create/document, rmts-moments respond), X-User-ID equals the resource's provider_id"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /sbmb/service-logs, /document, POST /sbmb/rmts-moments/{id}/respond"
  - priority: 6
    category: state
    check: "Target resource is in a state that permits the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"
  - priority: 7
    category: state
    check: "Claim submit requires claim.status in {DRAFT, DENIED} (submittable)"
    error_id: ERR_CLAIM_NOT_SUBMITTABLE
    http_status: 409
    applies_to: "POST /sbmb/claims/{claimId}/submit"
  - priority: 8
    category: state
    check: "Claim attach requires the ServiceLog to be VERIFIED and unattached (claim_id == null)"
    error_id: ERR_LOG_NOT_BILLABLE
    http_status: 409
    applies_to: "POST /sbmb/claims/{claimId}/attach"
  - priority: 9
    category: business_safety
    check: "On service-log create the delivering Provider has an ACTIVE ProviderCredential covering service_date; on claim submit EVERY attached log's provider is so credentialed"
    error_id: ERR_PROVIDER_NOT_CREDENTIALED
    http_status: 422
    applies_to: "POST /sbmb/service-logs, POST /sbmb/claims/{claimId}/submit"
  - priority: 10
    category: business_referential
    check: "The student has a ParentalConsent of type BILLING in status GRANTED"
    error_id: ERR_CONSENT_NOT_GRANTED
    http_status: 422
    applies_to: "POST /sbmb/service-logs"
  - priority: 11
    category: business_referential
    check: "The IEPAuthorization is in status ACTIVE"
    error_id: ERR_AUTHORIZATION_NOT_ACTIVE
    http_status: 422
    applies_to: "POST /sbmb/service-logs"
  - priority: 12
    category: business_temporal
    check: "service_date is within the authorization's closed [effective_date, expiration_date] window"
    error_id: ERR_SERVICE_OUTSIDE_AUTH_WINDOW
    http_status: 422
    applies_to: "POST /sbmb/service-logs"
  - priority: 13
    category: business_temporal
    check: "Provider has no other ServiceLog whose [start_time, end_time) half-open interval overlaps this one (same provider); adjacency end==start is allowed"
    error_id: ERR_PROVIDER_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /sbmb/service-logs"
  - priority: 14
    category: business_temporal
    check: "Activating a credential must not create two ACTIVE credentials of the same provider_id+credential_type with overlapping closed [effective_date, expiration_date] windows (touching endpoints overlap)"
    error_id: ERR_CREDENTIAL_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /sbmb/provider-credentials/{credentialId}/activate"
  - priority: 15
    category: business_temporal
    check: "(current_clock_date - max attached ServiceLog.service_date) <= TIMELY_FILING_DAYS (=365); day 365 passes, 366 fails"
    error_id: ERR_TIMELY_FILING_EXCEEDED
    http_status: 422
    applies_to: "POST /sbmb/claims/{claimId}/submit"
  - priority: 16
    category: business_constraint
    check: "Verify requires computed delivered_units >= 1 (delivered_minutes must not round to 0 units)"
    error_id: ERR_ZERO_BILLABLE_UNITS
    http_status: 422
    applies_to: "POST /sbmb/service-logs/{serviceLogId}/verify"
  - priority: 17
    category: business_constraint
    check: "Claim submit requires attached_log_count >= 1"
    error_id: ERR_CLAIM_NO_ENCOUNTERS
    http_status: 422
    applies_to: "POST /sbmb/claims/{claimId}/submit"
  - priority: 18
    category: business_constraint
    check: "Quarter close requires responded_moments >= MIN_RESPONDED_MOMENTS (=4); exactly 4 passes, 3 fails"
    error_id: ERR_INSUFFICIENT_SAMPLE
    http_status: 422
    applies_to: "POST /sbmb/rmts-quarters/{quarterId}/close"
  - priority: 19
    category: business_referential
    check: "Cost-settlement create requires the linked RMTSQuarter to be in status CLOSED"
    error_id: ERR_QUARTER_NOT_CLOSED
    http_status: 422
    applies_to: "POST /sbmb/cost-settlements"
  - priority: 20
    category: business_constraint
    check: "OCC: expected_rmts_quarter_version must equal the current RMTSQuarter.version"
    error_id: ERR_STALE_QUARTER_VERSION
    http_status: 412
    applies_to: "POST /sbmb/cost-settlements"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Clock (test-driving) ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-05-01T00:00:00Z; before any call to this endpoint the clock reads exactly that default and never falls back to wall-clock time."
    roles: [MedicaidCoordinator, BillingCoordinator, StateReviewer, ServiceProvider]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock set to to_iso8601"]

  # ---- Students ----
  - method: POST
    path: "/sbmb/students"
    description: "Register a student"
    roles: [MedicaidCoordinator]
    code: 201
    input: [medicaid_id, first_name, last_name, date_of_birth, district_student_id, "medicaid_eligible?"]
    output: Student
    side_effects: ["status = ACTIVE", "interim_paid_cents = 0", "verified_service_units = 0"]
  - method: GET
    path: "/sbmb/students/{studentId}"
    description: "Get a student (with computed ledgers)"
    roles: [MedicaidCoordinator, BillingCoordinator, StateReviewer, ServiceProvider]
    code: 200
    input: []
    output: Student
    side_effects: []
  - method: POST
    path: "/sbmb/students/{studentId}/withdraw"
    description: "Withdraw a student; depth-3 cascade discontinues authorizations, voids their non-terminal service logs, detaches from draft claims"
    roles: [MedicaidCoordinator]
    code: 200
    input: []
    output: Student
    side_effects: ["status = WITHDRAWN", "cascade: ACTIVE IEPAuthorizations -> DISCONTINUED -> their ServiceLogs -> VOID -> ledger/claim adjustments"]

  # ---- Providers ----
  - method: POST
    path: "/sbmb/providers"
    description: "Register a provider"
    roles: [MedicaidCoordinator]
    code: 201
    input: [npi, first_name, last_name, discipline]
    output: Provider
    side_effects: ["employment_status = ACTIVE"]
  - method: GET
    path: "/sbmb/providers/{providerId}"
    description: "Get a provider"
    roles: [MedicaidCoordinator, BillingCoordinator, StateReviewer, ServiceProvider]
    code: 200
    input: []
    output: Provider
    side_effects: []

  # ---- Provider Credentials ----
  - method: POST
    path: "/sbmb/provider-credentials"
    description: "Add a credential for a provider (starts PENDING)"
    roles: [MedicaidCoordinator]
    code: 201
    input: [provider_id, credential_type, license_number, effective_date, expiration_date]
    output: ProviderCredential
    side_effects: ["status = PENDING"]
  - method: GET
    path: "/sbmb/provider-credentials/{credentialId}"
    description: "Get a credential"
    roles: [MedicaidCoordinator, BillingCoordinator, StateReviewer, ServiceProvider]
    code: 200
    input: []
    output: ProviderCredential
    side_effects: []
  - method: GET
    path: "/sbmb/provider-credentials"
    description: "List credentials, filterable by provider"
    roles: [MedicaidCoordinator, BillingCoordinator, StateReviewer, ServiceProvider]
    code: 200
    input: ["provider_id?", "status?", "limit?", "offset?"]
    output: "ProviderCredential[]"
    side_effects: []
  - method: POST
    path: "/sbmb/provider-credentials/{credentialId}/activate"
    description: "Activate (or reinstate) a credential; rejects overlapping active windows of the same type"
    roles: [MedicaidCoordinator]
    code: 200
    input: []
    output: ProviderCredential
    side_effects: ["status = ACTIVE (from PENDING or SUSPENDED)"]
  - method: POST
    path: "/sbmb/provider-credentials/{credentialId}/suspend"
    description: "Suspend an active credential"
    roles: [MedicaidCoordinator]
    code: 200
    input: ["reason?"]
    output: ProviderCredential
    side_effects: ["status = SUSPENDED"]

  # ---- IEP Authorizations ----
  - method: POST
    path: "/sbmb/iep-authorizations"
    description: "Create an IEP service authorization line (starts DRAFT)"
    roles: [MedicaidCoordinator]
    code: 201
    input: [student_id, service_type, procedure_code, unit_minutes, unit_rate_cents, authorized_minutes_per_session, sessions_per_week, effective_date, expiration_date]
    output: IEPAuthorization
    side_effects: ["status = DRAFT"]
  - method: GET
    path: "/sbmb/iep-authorizations/{authorizationId}"
    description: "Get an authorization"
    roles: [MedicaidCoordinator, BillingCoordinator, StateReviewer, ServiceProvider]
    code: 200
    input: []
    output: IEPAuthorization
    side_effects: []
  - method: GET
    path: "/sbmb/iep-authorizations"
    description: "List authorizations, filterable by student"
    roles: [MedicaidCoordinator, BillingCoordinator, StateReviewer, ServiceProvider]
    code: 200
    input: ["student_id?", "status?", "limit?", "offset?"]
    output: "IEPAuthorization[]"
    side_effects: []
  - method: POST
    path: "/sbmb/iep-authorizations/{authorizationId}/activate"
    description: "Activate an authorization (DRAFT -> ACTIVE)"
    roles: [MedicaidCoordinator]
    code: 200
    input: []
    output: IEPAuthorization
    side_effects: ["status = ACTIVE"]
  - method: POST
    path: "/sbmb/iep-authorizations/{authorizationId}/discontinue"
    description: "Discontinue an authorization; depth-2 cascade voids its non-terminal service logs and adjusts ledgers/claims"
    roles: [MedicaidCoordinator]
    code: 200
    input: []
    output: IEPAuthorization
    side_effects: ["status = DISCONTINUED", "cascade: non-terminal ServiceLogs -> VOID -> ledger/claim adjustments"]

  # ---- Parental Consent ----
  - method: POST
    path: "/sbmb/parental-consents"
    description: "Record a parental consent (starts PENDING)"
    roles: [MedicaidCoordinator]
    code: 201
    input: [student_id, consent_type, signed_by]
    output: ParentalConsent
    side_effects: ["status = PENDING"]
  - method: GET
    path: "/sbmb/parental-consents/{consentId}"
    description: "Get a consent"
    roles: [MedicaidCoordinator, BillingCoordinator, StateReviewer, ServiceProvider]
    code: 200
    input: []
    output: ParentalConsent
    side_effects: []
  - method: GET
    path: "/sbmb/parental-consents"
    description: "List consents, filterable by student"
    roles: [MedicaidCoordinator, BillingCoordinator, StateReviewer, ServiceProvider]
    code: 200
    input: ["student_id?", "status?", "limit?", "offset?"]
    output: "ParentalConsent[]"
    side_effects: []
  - method: POST
    path: "/sbmb/parental-consents/{consentId}/grant"
    description: "Grant (or re-grant) a consent"
    roles: [MedicaidCoordinator]
    code: 200
    input: []
    output: ParentalConsent
    side_effects: ["status = GRANTED", "granted_date = clock"]
  - method: POST
    path: "/sbmb/parental-consents/{consentId}/revoke"
    description: "Revoke a granted consent"
    roles: [MedicaidCoordinator]
    code: 200
    input: []
    output: ParentalConsent
    side_effects: ["status = REVOKED", "revoked_date = clock"]

  # ---- Service Logs ----
  - method: POST
    path: "/sbmb/service-logs"
    description: "Log a delivered service session (starts LOGGED). Provider self-logs; validates consent, authorization active/window, credential, no double-booking."
    roles: [ServiceProvider]
    code: 201
    input: [iep_authorization_id, provider_id, student_id, service_date, start_time, end_time, delivered_minutes, "group_size?"]
    output: ServiceLog
    side_effects: ["status = LOGGED", "claim_id = null"]
  - method: GET
    path: "/sbmb/service-logs/{serviceLogId}"
    description: "Get a service log"
    roles: [MedicaidCoordinator, BillingCoordinator, StateReviewer, ServiceProvider]
    code: 200
    input: []
    output: ServiceLog
    side_effects: []
  - method: GET
    path: "/sbmb/service-logs"
    description: "List service logs, filterable by authorization, provider, student, or claim"
    roles: [MedicaidCoordinator, BillingCoordinator, StateReviewer, ServiceProvider]
    code: 200
    input: ["iep_authorization_id?", "provider_id?", "student_id?", "claim_id?", "status?", "limit?", "offset?"]
    output: "ServiceLog[]"
    side_effects: []
  - method: POST
    path: "/sbmb/service-logs/{serviceLogId}/document"
    description: "Provider attaches documentation (LOGGED -> DOCUMENTED)"
    roles: [ServiceProvider]
    code: 200
    input: [documentation_note]
    output: ServiceLog
    side_effects: ["status = DOCUMENTED", "documentation_note recorded"]
  - method: POST
    path: "/sbmb/service-logs/{serviceLogId}/verify"
    description: "Encounter capture: BillingCoordinator verifies a documented log, computing delivered_units and charge (DOCUMENTED -> VERIFIED)"
    roles: [BillingCoordinator]
    code: 200
    input: []
    output: ServiceLog
    side_effects: ["status = VERIFIED", "delivered_units + charge_cents computed", "Student.verified_service_units += delivered_units"]
  - method: POST
    path: "/sbmb/service-logs/{serviceLogId}/return"
    description: "Return a documented log for correction (DOCUMENTED -> LOGGED)"
    roles: [BillingCoordinator]
    code: 200
    input: [return_reason]
    output: ServiceLog
    side_effects: ["status = LOGGED", "return_reason recorded", "documentation_note cleared"]
  - method: POST
    path: "/sbmb/service-logs/{serviceLogId}/void"
    description: "Void an unattached verified/logged/documented service log"
    roles: [BillingCoordinator]
    code: 200
    input: []
    output: ServiceLog
    side_effects: ["status = VOID", "if was VERIFIED: Student.verified_service_units -= delivered_units"]

  # ---- Claims ----
  - method: POST
    path: "/sbmb/claims"
    description: "Open a claim (starts DRAFT)"
    roles: [BillingCoordinator]
    code: 201
    input: [student_id, service_month]
    output: Claim
    side_effects: ["status = DRAFT", "total_charge_cents = 0", "attached_log_count = 0"]
  - method: GET
    path: "/sbmb/claims/{claimId}"
    description: "Get a claim"
    roles: [MedicaidCoordinator, BillingCoordinator, StateReviewer, ServiceProvider]
    code: 200
    input: []
    output: Claim
    side_effects: []
  - method: GET
    path: "/sbmb/claims"
    description: "List claims, filterable by student"
    roles: [MedicaidCoordinator, BillingCoordinator, StateReviewer, ServiceProvider]
    code: 200
    input: ["student_id?", "status?", "limit?", "offset?"]
    output: "Claim[]"
    side_effects: []
  - method: POST
    path: "/sbmb/claims/{claimId}/attach"
    description: "Attach a VERIFIED service log to a DRAFT claim (VERIFIED -> CLAIMED); recomputes total"
    roles: [BillingCoordinator]
    code: 200
    input: [service_log_id]
    output: Claim
    side_effects: ["log.claim_id set", "log VERIFIED -> CLAIMED", "total_charge_cents + attached_log_count recomputed"]
  - method: POST
    path: "/sbmb/claims/{claimId}/submit"
    description: "Submit a DRAFT claim, or rebill a DENIED claim; validates credential coverage and timely filing"
    roles: [BillingCoordinator]
    code: 200
    input: []
    output: Claim
    side_effects: ["status DRAFT->SUBMITTED or DENIED->SUBMITTED", "submitted_date = clock", "on rebill: rebill_count += 1, denial_reason cleared, DENIED logs -> CLAIMED"]
  - method: POST
    path: "/sbmb/claims/{claimId}/adjudicate"
    description: "State reviewer approves or denies a submitted claim"
    roles: [StateReviewer]
    code: 200
    input: [outcome, "denial_reason?"]
    output: Claim
    side_effects: ["APPROVE: status=PAID, interim_payment_cents set, Student.interim_paid_cents += it, logs -> PAID", "DENY: status=DENIED, denial_reason set, logs -> DENIED"]
  - method: POST
    path: "/sbmb/claims/{claimId}/void"
    description: "Void a DRAFT/DENIED/PAID claim; from PAID it recoups interim payment; detaches logs back to VERIFIED"
    roles: [BillingCoordinator]
    code: 200
    input: []
    output: Claim
    side_effects: ["status = VOID", "from PAID: Student.interim_paid_cents -= interim_payment_cents", "attached logs -> VERIFIED (detach)", "totals zeroed"]

  # ---- RMTS Quarters ----
  - method: POST
    path: "/sbmb/rmts-quarters"
    description: "Open an RMTS study period (starts OPEN)"
    roles: [MedicaidCoordinator]
    code: 201
    input: [fiscal_quarter]
    output: RMTSQuarter
    side_effects: ["status = OPEN", "counts = 0"]
  - method: GET
    path: "/sbmb/rmts-quarters/{quarterId}"
    description: "Get a quarter (with computed ratio and version)"
    roles: [MedicaidCoordinator, BillingCoordinator, StateReviewer, ServiceProvider]
    code: 200
    input: []
    output: RMTSQuarter
    side_effects: []
  - method: POST
    path: "/sbmb/rmts-quarters/{quarterId}/close"
    description: "Close a quarter; requires >= MIN_RESPONDED_MOMENTS coded; fixes the eligibility ratio"
    roles: [MedicaidCoordinator]
    code: 200
    input: []
    output: RMTSQuarter
    side_effects: ["status = CLOSED", "medicaid_eligibility_ratio computed"]

  # ---- RMTS Moments ----
  - method: POST
    path: "/sbmb/rmts-moments"
    description: "Generate a sampled moment for a provider in an OPEN quarter (starts GENERATED)"
    roles: [MedicaidCoordinator]
    code: 201
    input: [rmts_quarter_id, provider_id, moment_timestamp]
    output: RMTSMoment
    side_effects: ["status = GENERATED", "quarter.total_moments += 1"]
  - method: GET
    path: "/sbmb/rmts-moments/{momentId}"
    description: "Get a moment"
    roles: [MedicaidCoordinator, BillingCoordinator, StateReviewer, ServiceProvider]
    code: 200
    input: []
    output: RMTSMoment
    side_effects: []
  - method: GET
    path: "/sbmb/rmts-moments"
    description: "List moments, filterable by quarter or provider"
    roles: [MedicaidCoordinator, BillingCoordinator, StateReviewer, ServiceProvider]
    code: 200
    input: ["rmts_quarter_id?", "provider_id?", "status?", "limit?", "offset?"]
    output: "RMTSMoment[]"
    side_effects: []
  - method: POST
    path: "/sbmb/rmts-moments/{momentId}/respond"
    description: "Sampled provider records their activity (GENERATED -> RESPONDED); X-User-ID must equal the moment's provider_id"
    roles: [ServiceProvider]
    code: 200
    input: [activity_response]
    output: RMTSMoment
    side_effects: ["status = RESPONDED", "activity_response recorded"]
  - method: POST
    path: "/sbmb/rmts-moments/{momentId}/code"
    description: "Coordinator codes the response into a category (RESPONDED -> CODED); recomputes quarter counts"
    roles: [MedicaidCoordinator]
    code: 200
    input: [activity_category]
    output: RMTSMoment
    side_effects: ["status = CODED", "is_medicaid_eligible_moment computed", "quarter.responded_moments + medicaid_eligible_moments recomputed"]

  # ---- Cost Settlements ----
  - method: POST
    path: "/sbmb/cost-settlements"
    description: "Create a cost settlement against a CLOSED quarter; OCC on the quarter version. Computes the cost-settled reconciliation (CALCULATED)."
    roles: [MedicaidCoordinator]
    code: 201
    input: [rmts_quarter_id, certified_cost_cents, iep_ratio_bps, fmap_bps, interim_paid_cents, expected_rmts_quarter_version]
    output: CostSettlement
    side_effects: ["status = CALCULATED", "gross_medicaid_cost_cents + federal_share_cents + net_settlement_cents computed", "increments RMTSQuarter.version by 1"]
  - method: GET
    path: "/sbmb/cost-settlements/{settlementId}"
    description: "Get a cost settlement"
    roles: [MedicaidCoordinator, BillingCoordinator, StateReviewer, ServiceProvider]
    code: 200
    input: []
    output: CostSettlement
    side_effects: []
  - method: GET
    path: "/sbmb/cost-settlements"
    description: "List cost settlements, filterable by quarter"
    roles: [MedicaidCoordinator, BillingCoordinator, StateReviewer, ServiceProvider]
    code: 200
    input: ["rmts_quarter_id?", "status?", "limit?", "offset?"]
    output: "CostSettlement[]"
    side_effects: []
  - method: POST
    path: "/sbmb/cost-settlements/{settlementId}/certify"
    description: "LEA certifies the settlement (CALCULATED -> CERTIFIED)"
    roles: [MedicaidCoordinator]
    code: 200
    input: []
    output: CostSettlement
    side_effects: ["status = CERTIFIED"]
  - method: POST
    path: "/sbmb/cost-settlements/{settlementId}/settle"
    description: "State finalizes the settlement (CERTIFIED -> SETTLED)"
    roles: [StateReviewer]
    code: 200
    input: []
    output: CostSettlement
    side_effects: ["status = SETTLED"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Caller's role not permitted for the endpoint" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "ServiceProvider caller's X-User-ID != the resource's provider_id (self-log / self-respond only)" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed body, missing required field, bad type/enum, or invalid pagination params" }
  - { id: ERR_STUDENT_NOT_FOUND, http: 404, condition: "Referenced student does not exist" }
  - { id: ERR_PROVIDER_NOT_FOUND, http: 404, condition: "Referenced provider does not exist" }
  - { id: ERR_CREDENTIAL_NOT_FOUND, http: 404, condition: "Referenced credential does not exist" }
  - { id: ERR_AUTHORIZATION_NOT_FOUND, http: 404, condition: "Referenced IEP authorization does not exist" }
  - { id: ERR_CONSENT_NOT_FOUND, http: 404, condition: "Referenced parental consent does not exist" }
  - { id: ERR_SERVICE_LOG_NOT_FOUND, http: 404, condition: "Referenced service log does not exist" }
  - { id: ERR_CLAIM_NOT_FOUND, http: 404, condition: "Referenced claim does not exist" }
  - { id: ERR_QUARTER_NOT_FOUND, http: 404, condition: "Referenced RMTS quarter does not exist" }
  - { id: ERR_MOMENT_NOT_FOUND, http: 404, condition: "Referenced RMTS moment does not exist" }
  - { id: ERR_SETTLEMENT_NOT_FOUND, http: 404, condition: "Referenced cost settlement does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Requested transition not allowed from the resource's current state" }
  - { id: ERR_CLAIM_NOT_SUBMITTABLE, http: 409, condition: "Submit attempted on a claim not in {DRAFT, DENIED}" }
  - { id: ERR_LOG_NOT_BILLABLE, http: 409, condition: "Attach attempted on a service log that is not VERIFIED-and-unattached" }
  - { id: ERR_PROVIDER_NOT_CREDENTIALED, http: 422, condition: "Delivering provider has no ACTIVE credential covering the service_date" }
  - { id: ERR_CONSENT_NOT_GRANTED, http: 422, condition: "Student lacks a BILLING ParentalConsent in status GRANTED" }
  - { id: ERR_AUTHORIZATION_NOT_ACTIVE, http: 422, condition: "IEP authorization is not in status ACTIVE" }
  - { id: ERR_SERVICE_OUTSIDE_AUTH_WINDOW, http: 422, condition: "service_date falls outside the authorization's closed [effective, expiration] window" }
  - { id: ERR_PROVIDER_DOUBLE_BOOKED, http: 409, condition: "Provider already has a service log whose half-open [start,end) interval overlaps this one" }
  - { id: ERR_CREDENTIAL_PERIOD_OVERLAP, http: 409, condition: "Activating would create two ACTIVE same-type credentials with overlapping closed validity windows" }
  - { id: ERR_TIMELY_FILING_EXCEEDED, http: 422, condition: "Latest attached service_date is more than TIMELY_FILING_DAYS (365) before the current clock" }
  - { id: ERR_ZERO_BILLABLE_UNITS, http: 422, condition: "Verify would produce delivered_units == 0" }
  - { id: ERR_CLAIM_NO_ENCOUNTERS, http: 422, condition: "Submit attempted with attached_log_count == 0" }
  - { id: ERR_INSUFFICIENT_SAMPLE, http: 422, condition: "Quarter close attempted with responded_moments < MIN_RESPONDED_MOMENTS (4)" }
  - { id: ERR_QUARTER_NOT_CLOSED, http: 422, condition: "Cost-settlement create attempted against a quarter not in status CLOSED" }
  - { id: ERR_STALE_QUARTER_VERSION, http: 412, condition: "expected_rmts_quarter_version != current RMTSQuarter.version at settlement create" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ServiceProvider
    description: "Clinician who delivers services. Self-logs and documents sessions, and responds to RMTS moments sampled for them."
    identity: "entity_backed:Provider"
    exclusive_operations:
      - "POST /sbmb/service-logs (self; provider_id must equal X-User-ID)"
      - "POST /sbmb/service-logs/{id}/document"
      - "POST /sbmb/rmts-moments/{id}/respond"
    shared_operations:
      - "GET reads on students, providers, credentials, authorizations, consents, service-logs, claims, quarters, moments, settlements"
      - "POST /_clock/set_current_utc"
  - name: BillingCoordinator
    description: "LEA billing staff. Verifies documented logs (encounter capture), assembles/attaches/submits/rebills/voids claims."
    identity: "opaque"
    exclusive_operations:
      - "POST /sbmb/service-logs/{id}/verify"
      - "POST /sbmb/service-logs/{id}/return"
      - "POST /sbmb/service-logs/{id}/void"
      - "POST /sbmb/claims (create)"
      - "POST /sbmb/claims/{id}/attach"
      - "POST /sbmb/claims/{id}/submit"
      - "POST /sbmb/claims/{id}/void"
    shared_operations:
      - "GET reads (all collections)"
      - "POST /_clock/set_current_utc"
  - name: MedicaidCoordinator
    description: "LEA program administrator. Manages students, providers, credentials, authorizations, consents; runs the RMTS study and creates/certifies cost settlements."
    identity: "opaque"
    exclusive_operations:
      - "POST /sbmb/students, /sbmb/students/{id}/withdraw"
      - "POST /sbmb/providers"
      - "POST /sbmb/provider-credentials + /activate + /suspend"
      - "POST /sbmb/iep-authorizations + /activate + /discontinue"
      - "POST /sbmb/parental-consents + /grant + /revoke"
      - "POST /sbmb/rmts-quarters + /close"
      - "POST /sbmb/rmts-moments (generate) + /code"
      - "POST /sbmb/cost-settlements (create) + /certify"
    shared_operations:
      - "GET reads (all collections)"
      - "POST /_clock/set_current_utc"
  - name: StateReviewer
    description: "State Medicaid agency adjudicator. Approves/denies submitted claims and settles certified cost settlements. Segregated from claim submission and settlement certification."
    identity: "opaque"
    exclusive_operations:
      - "POST /sbmb/claims/{id}/adjudicate"
      - "POST /sbmb/cost-settlements/{id}/settle"
    shared_operations:
      - "GET reads (all collections)"
      - "POST /_clock/set_current_utc"
