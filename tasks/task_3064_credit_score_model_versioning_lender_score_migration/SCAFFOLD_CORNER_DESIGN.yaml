            - {call: "POST /score-variants/${v1}/release", payload: {}, as: ModelDeveloper}
            - {call: "POST /model-documentation", payload: {score_model_id: "${m1}", doc_type: "MODEL_RISK_REPORT", required_version_label: "CREDIT-DUAL-V1"}, as: ComplianceOfficer, captures: {md: $.data.id, mdv: $.data.version}}
            - {call: "POST /model-documentation/${md}/file", payload: {expected_documentation_version: "${mdv}"}, as: ComplianceOfficer}
            - {call: "GET /score-models/${m1}", payload: {}, as: ModelDeveloper, captures: {m1v: $.data.version}}
            - {call: "POST /score-models/${m1}/release", payload: {expected_model_version: "${m1v}"}, as: ModelDeveloper}
            - {call: "POST /consumers", payload: {consumer_ref: "cons-occ-1", age_years: 37, is_protected_class: false}, as: ModelDeveloper, captures: {c: $.data.id}}
            - {call: "POST /licenses", payload: {lender_name: "North Bank", lender_code: "LEND-NORTH", score_variant_id: "${v1}", volume_tier: "VOLUME_TIER_1", entitled_count: 500, window_start_month: "2026-01", window_end_month: "2027-01"}, as: ComplianceOfficer, captures: {lic: $.data.id}}
            - {call: "GET /licenses/${lic}", payload: {}, as: ComplianceOfficer, captures: {licv0: $.data.version}}
            - {call: "POST /licenses/${lic}/activate", payload: {expected_license_version: "${licv0}"}, as: ComplianceOfficer}
            - {call: "GET /licenses/${lic}", payload: {}, as: ComplianceOfficer, captures: {licv_act: $.data.version}}
            - {call: "POST /score-results", payload: {consumer_id: "${c}", score_variant_id: "${v1}", bureau_id: "${b_tuc}", license_id: "${lic}", raw_posted_score: 715, expected_license_version: "${licv_act}"}, as: ScoreConsumer, as_user_id: "${lic}"}
          trigger:
            - {call: "POST /score-results", payload: {consumer_id: "${c}", score_variant_id: "${v1}", bureau_id: "${b_tuc}", license_id: "${lic}", raw_posted_score: 716, expected_license_version: "${licv_act}"}, as: ScoreConsumer, as_user_id: "${lic}", captures: {err: $.data.error_id}}
          assert:
            - "the response status is 412 and data.err == \"ERR_STALE_VERSION\""
            - "the settled posting advanced the licence twice, once for the activation and once for the settlement, so the captured version is genuinely stale"
            - "GET /score-results?consumer_id=${c} reports total_count == 1, so the rejected posting settled nothing"

