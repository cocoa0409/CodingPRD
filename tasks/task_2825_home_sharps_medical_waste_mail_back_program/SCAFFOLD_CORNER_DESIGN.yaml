              captures: { e_reinstate: $.data.error_id }
          assert:
            - "all three calls return HTTP status == 409"
            - "${e_review} == \"ERR_INVALID_PATIENT_STATE\""
            - "${e_withdraw} == \"ERR_INVALID_PATIENT_STATE\""
            - "${e_reinstate} == \"ERR_INVALID_PATIENT_STATE\""
            - "Patient.${pat_r}.status == \"INELIGIBLE\""
            - "Patient.${pat_r}.version == 2 (unchanged by all three rejected calls)"

      - name: sponsor_reject_terminates_the_enrollment_without_touching_patient_or_ledger
        claim_type: side_effect_execution
        grounds:
          - state_machines.Enrollment.PENDING_SPONSOR_APPROVAL_to_REJECTED
