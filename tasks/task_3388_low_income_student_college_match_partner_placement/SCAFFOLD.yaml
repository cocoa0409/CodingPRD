# =============================================================================
# SCAFFOLD: Low-Income Student College Match & Partner Placement
# domain: low-income-college-match
# §1.0–§1.7 only. Difficulty index lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml;
# corner coverage index lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Low-Income Student College Match & Partner Placement (QuestBridge): student
  application with academic achievement and family income criteria and a
  separate application from the standard admission process, college partner
  network with commitment to meet full financial need for matched students,
  ranking process where students rank partner colleges and a binding match is
  made with early notification, match versus regular decision paths with
  students who do not match entering partner colleges' regular pools, financial
  aid packages guaranteed at matched institutions with no-loan or minimal-loan
  commitments, high school counselor and community partner recruitment to
  identify eligible students, summer program and college prep scholar programs
  feeding the applicant pool, outcome tracking on enrollment, persistence and
  graduation

domain_name: low-income-college-match
api_prefix: "/"

# =============================================================================
# §0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: quota_allocation        # finite match_slots per partner college, waterfall assignment, slot release compensation
  secondary_archetype: workflow_orchestration # phase-gated cycle pipeline with branching match/regular paths
  complexity_layers:
    - optimistic_concurrency                 # OCC on Application.version (ranking submit) and AidPackage.version (revise)
    - dual_variant_calculation               # EFC provisional-vs-verified; persistence on-track-vs-cohort150
    - cascading_side_effects                 # run-match 4-hop cascade; release compensation cascade
    - selector_policy                        # binding_match_assignment + regular-pool ordering, fully pinned
  entity_topology: flat                      # peer entities joined by FK references, no nested ownership tree
  state_machine_shape: branching             # Application forks MATCHED/UNMATCHED, self-loop ranking revision; AidPackage revision cycle
  relationship_patterns:
    - one_to_many
    - polymorphic                            # Referral referrer is Counselor XOR CommunityPartner
    - cross_aggregate
  role_model: segregation_of_duties          # the partner that referred/submitted may not decide the verification
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (13 entities, flat topology)
# All money is integer cents. All datetimes are ISO 8601 UTC and read the
# logical clock (see POST /_clock/set_current_utc; default 2026-09-01T00:00:00Z).
# =============================================================================
entities:
  - name: MatchCycle
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Cycle display name" }
      - { name: app_opens_at, type: datetime, source: input, description: "Application submission window opens (inclusive)" }
      - { name: app_closes_at, type: datetime, source: input, description: "Application submission window closes (inclusive)" }
      - { name: ranking_opens_at, type: datetime, source: input, description: "Ranking submission window opens (inclusive)" }
      - { name: ranking_closes_at, type: datetime, source: input, description: "Ranking submission window closes (inclusive)" }
      - { name: phase, type: enum, source: system, description: "SETUP | RECRUITMENT | APPLICATION_OPEN | REVIEW | RANKING | MATCH_RUN | REGULAR_DECISION | OUTCOME_TRACKING | CLOSED" }
      - { name: match_run_completed, type: boolean, source: system, description: "True after run-match executes", default: false }

  - name: PartnerCollege
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "College name" }
      - { name: aid_policy, type: enum, source: input, description: "NO_LOAN | MINIMAL_LOAN" }
      - { name: min_academic_index, type: integer, source: input, description: "Minimum Application.academic_index to be assigned a match slot" }
      - { name: match_slots, type: integer, source: input, description: "Total binding-match slots for a cycle (>= 0)" }
      - { name: coa_cents, type: integer, source: input, description: "Annual cost of attendance in cents" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED" }
      - { name: slots_committed, type: integer, source: computed, description: "Count of Matches with this college in status BINDING or ENROLLED" }
      - { name: enrolled_count, type: integer, source: computed, description: "Count of OutcomeRecords with this college ever created" }

  - name: Student
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Unique email (ERR_EMAIL_TAKEN)" }
      - { name: full_name, type: string, source: input, description: "Student full name" }
      - { name: state_code, type: string, source: input, description: "US state of residence" }
      - { name: source, type: enum, source: input, description: "SELF | COUNSELOR | COMMUNITY_PARTNER | PREP_PROGRAM" }
      - { name: student_stage, type: enum, source: computed, description: "PROSPECT | APPLICANT | FINALIST | MATCHED | ENROLLED — advanced by cascades", default: "PROSPECT" }

  - name: Counselor
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Counselor name" }
      - { name: school_name, type: string, source: input, description: "High school name" }
      - { name: state_code, type: string, source: input, description: "School state" }

  - name: CommunityPartner
    parent: null
    common_fields: true
    fields:
      - { name: org_name, type: string, source: input, description: "Community-based organization name" }
      - { name: state_code, type: string, source: input, description: "Organization state" }
      - { name: contact_email, type: string, source: input, description: "Contact email" }

  - name: Referral
    parent: null
    common_fields: true
    fields:
      - { name: student_id, type: string, source: input, description: "FK -> Student.id; nominated student" }
      - { name: cycle_id, type: string, source: input, description: "FK -> MatchCycle.id; cycle the nomination targets" }
      - { name: counselor_id, type: string, source: system, description: "FK -> Counselor.id; set from X-User-ID when the referrer role is Counselor, else null" }
      - { name: partner_id, type: string, source: system, description: "FK -> CommunityPartner.id; set from X-User-ID when the referrer role is PartnerStaff, else null" }
      - { name: note, type: string, source: input, description: "Free-text nomination note", default: "" }
      - { name: status, type: enum, source: system, description: "NOMINATED | CONVERTED | REVOKED | EXPIRED" }

  - name: PrepProgram
    parent: null
    common_fields: true
    fields:
      - { name: student_id, type: string, source: input, description: "FK -> Student.id; enrolled student" }
      - { name: program_type, type: enum, source: input, description: "SUMMER | SCHOLAR" }
      - { name: cohort_label, type: string, source: input, description: "Cohort label, e.g. 'summer-2026'" }
      - { name: starts_on, type: datetime, source: input, description: "Enrollment interval start (inclusive), half-open semantics" }
      - { name: ends_on, type: datetime, source: input, description: "Enrollment interval end (exclusive), half-open semantics" }
      - { name: status, type: enum, source: system, description: "ENROLLED | COMPLETED | WITHDRAWN" }

  - name: Application
    parent: null
    common_fields: true
    fields:
      - { name: student_id, type: string, source: system, description: "FK -> Student.id; set from X-User-ID of the creating Student" }
      - { name: cycle_id, type: string, source: input, description: "FK -> MatchCycle.id" }
      - { name: referral_id, type: string, source: input, description: "FK -> Referral.id; null when self-originated", default: null }
      - { name: household_income_cents, type: integer, source: input, description: "Self-reported annual household income, cents" }
      - { name: household_size, type: integer, source: input, description: "Household size (>= 1)" }
      - { name: self_reported_assets_cents, type: integer, source: input, description: "Self-reported household assets, cents", default: 0 }
      - { name: gpa_scaled, type: integer, source: input, description: "GPA x 100 (e.g. 375 = 3.75)" }
      - { name: test_score, type: integer, source: input, description: "SAT composite; null allowed", default: null }
      - { name: essay_text, type: string, source: input, description: "Personal essay", default: "" }
      - { name: status, type: enum, source: system, description: "DRAFT | UNDER_REVIEW | FINALIST | NOT_FINALIST | RANKING_SUBMITTED | RANKING_LOCKED | MATCHED | UNMATCHED | REGULAR_POOL | ADMITTED_REGULAR | REGULAR_DENIED | ENROLLED | WITHDRAWN" }
      - { name: academic_index, type: integer, source: computed, description: "min(AI_CAP, gpa_scaled*AI_GPA_WEIGHT + floor(test_score/AI_TEST_DIVISOR)); test null counts 0; computed at submit" }
      - { name: prep_alum, type: boolean, source: computed, description: "True iff student has a COMPLETED PrepProgram at submit time" }
      - { name: need_tier, type: enum, source: computed, description: "HIGH | STANDARD — HIGH iff household_income_cents <= half the household cap" }
      - { name: verification_flag, type: enum, source: system, description: "NONE | VERIFIED | DISCREPANCY | WAIVED", default: "NONE" }
      - { name: matched_college_id, type: string, source: system, description: "FK -> PartnerCollege.id; set when MATCHED, cleared on release", default: null }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock timestamp of submit", default: null }

  - name: RankingEntry
    parent: null
    common_fields: false
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> Application.id" }
      - { name: college_id, type: string, source: input, description: "FK -> PartnerCollege.id" }
      - { name: rank_position, type: integer, source: input, description: "1-based rank; contiguous 1..N within one submission" }
      - { name: list_seq, type: integer, source: system, description: "Submission sequence number; first accepted ranking submit is 1, increments per resubmission" }

  - name: Match
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> Application.id" }
      - { name: college_id, type: string, source: system, description: "FK -> PartnerCollege.id" }
      - { name: cycle_id, type: string, source: system, description: "FK -> MatchCycle.id" }
      - { name: rank_position_awarded, type: integer, source: system, description: "Rank position on the student's list at which the match was made" }
      - { name: status, type: enum, source: system, description: "BINDING | ENROLLED | RELEASED" }
      - { name: matched_at, type: datetime, source: system, description: "Logical-clock timestamp of the match run" }

  - name: AidPackage
    parent: null
    common_fields: true
    fields:
      - { name: match_id, type: string, source: system, description: "FK -> Match.id; null for regular-admission packages", default: null }
      - { name: application_id, type: string, source: system, description: "FK -> Application.id" }
      - { name: college_id, type: string, source: system, description: "FK -> PartnerCollege.id" }
      - { name: coa_cents, type: integer, source: system, description: "Cost of attendance copied from PartnerCollege.coa_cents at creation; revisable via revise" }
      - { name: efc_cents, type: integer, source: computed, description: "Expected family contribution per expected_family_contribution (variant per aid_variant)" }
      - { name: need_cents, type: integer, source: computed, description: "max(0, coa_cents - efc_cents)" }
      - { name: work_study_cents, type: integer, source: computed, description: "Work-study component per aid_package_composition" }
      - { name: loan_cents, type: integer, source: computed, description: "Loan component; 0 when college aid_policy is NO_LOAN" }
      - { name: grant_cents, type: integer, source: computed, description: "Grant component; remainder need - work_study - loan, never rounded" }
      - { name: aid_variant, type: enum, source: system, description: "PROVISIONAL | VERIFIED — which EFC variant produced current amounts" }
      - { name: guaranteed_full_need, type: boolean, source: system, description: "True for match-derived packages (binding full-need commitment), false for regular-admission packages" }
      - { name: status, type: enum, source: system, description: "PROVISIONAL | FINALIZED | REVISED | VOID" }

  - name: IncomeVerification
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> Application.id" }
      - { name: submitted_by_counselor_id, type: string, source: system, description: "Counselor user id who submitted the documents; null when submitted by partner staff" }
      - { name: submitted_by_partner_id, type: string, source: system, description: "CommunityPartner user id who submitted the documents; null when submitted by a counselor" }
      - { name: verified_income_cents, type: integer, source: input, description: "Document-verified annual household income, cents" }
      - { name: verified_assets_cents, type: integer, source: input, description: "Document-verified household assets, cents" }
      - { name: verified_household_size, type: integer, source: input, description: "Document-verified household size" }
      - { name: outcome, type: enum, source: system, description: "PENDING | VERIFIED | DISCREPANCY | WAIVED" }
      - { name: decided_by_partner_id, type: string, source: system, description: "CommunityPartner id that decided; null until decided", default: null }

  - name: OutcomeRecord
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> Application.id" }
      - { name: college_id, type: string, source: system, description: "FK -> PartnerCollege.id" }
      - { name: cycle_id, type: string, source: system, description: "FK -> MatchCycle.id" }
      - { name: match_id, type: string, source: system, description: "FK -> Match.id; null for regular-admission enrollees", default: null }
      - { name: status, type: enum, source: system, description: "ENROLLED_Y1 | PERSISTED_Y2 | PERSISTED_Y3 | GRADUATED | STOPPED_OUT | NOT_PERSISTED" }
      - { name: credits_completed, type: integer, source: input, description: "Cumulative credits completed", default: 0 }
      - { name: last_checkpoint_at, type: datetime, source: system, description: "Logical-clock timestamp of last checkpoint" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: MatchCycle
    field: phase
    initial_state: SETUP
    terminal_states: [CLOSED]
    transitions:
      - from: SETUP
        to: RECRUITMENT
        trigger: "POST /cycles/{id}/advance"
        actor: ProgramAdmin
        preconditions: []
        side_effects: ["increments MatchCycle.version by 1"]
      - from: RECRUITMENT
        to: APPLICATION_OPEN
        trigger: "POST /cycles/{id}/advance"
        actor: ProgramAdmin
        preconditions: []
        side_effects: ["increments MatchCycle.version by 1"]
      - from: APPLICATION_OPEN
        to: REVIEW
        trigger: "POST /cycles/{id}/advance"
        actor: ProgramAdmin
        preconditions: []
        side_effects:
          - "Every Referral of this cycle in NOMINATED -> EXPIRED"
          - "increments MatchCycle.version by 1"
      - from: REVIEW
        to: RANKING
        trigger: "POST /cycles/{id}/advance"
        actor: ProgramAdmin
        preconditions: []
        side_effects: ["increments MatchCycle.version by 1"]
      - from: RANKING
        to: MATCH_RUN
        trigger: "POST /cycles/{id}/advance"
        actor: ProgramAdmin
        preconditions:
          - "logical clock >= ranking_closes_at (ERR_CYCLE_BLOCKED)"
          - "no Application of this cycle in UNDER_REVIEW (ERR_CYCLE_BLOCKED)"
        side_effects:
          - "Every Application of this cycle in RANKING_SUBMITTED -> RANKING_LOCKED"
          - "Every Application of this cycle in FINALIST -> REGULAR_POOL"
          - "increments MatchCycle.version by 1"
      - from: MATCH_RUN
        to: REGULAR_DECISION
        trigger: "POST /cycles/{id}/advance"
        actor: ProgramAdmin
        preconditions:
          - "match_run_completed == true (ERR_CYCLE_BLOCKED)"
        side_effects: ["increments MatchCycle.version by 1"]
      - from: REGULAR_DECISION
        to: OUTCOME_TRACKING
        trigger: "POST /cycles/{id}/advance"
        actor: ProgramAdmin
        preconditions: []
        side_effects: ["increments MatchCycle.version by 1"]
      - from: OUTCOME_TRACKING
        to: CLOSED
        trigger: "POST /cycles/{id}/advance"
        actor: ProgramAdmin
        preconditions:
          - "all Applications of this cycle are in a terminal state (NOT_FINALIST, REGULAR_DENIED, WITHDRAWN, ENROLLED) or in MATCHED (ERR_CYCLE_BLOCKED)"
        side_effects: ["increments MatchCycle.version by 1"]

  - entity: PartnerCollege
    field: status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /colleges/{id}/suspend"
        actor: ProgramAdmin
        preconditions: []
        side_effects:
          - "College is excluded from future ranking submissions and from the next match run; existing Matches and AidPackages are unaffected"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /colleges/{id}/reinstate"
        actor: ProgramAdmin
        preconditions: []
        side_effects: []

  - entity: Referral
    field: status
    initial_state: NOMINATED
    terminal_states: [CONVERTED, REVOKED, EXPIRED]
    transitions:
      - from: NOMINATED
        to: CONVERTED
        trigger: "system (an Application citing referral_id completes submit)"
        actor: system
        preconditions:
          - "the citing Application's student_id equals Referral.student_id and cycle_id equals Referral.cycle_id"
        side_effects: ["Referral contributes REFERRAL_BONUS to match_priority_score for that application"]
      - from: NOMINATED
        to: REVOKED
        trigger: "POST /referrals/{id}/revoke"
        actor: "Counselor (own), PartnerStaff (own), ProgramAdmin"
        preconditions:
          - "Referral must be NOMINATED (ERR_INVALID_STATE)"
        side_effects: []
      - from: NOMINATED
        to: EXPIRED
        trigger: "system (cycle advances APPLICATION_OPEN -> REVIEW)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: PrepProgram
    field: status
    initial_state: ENROLLED
    terminal_states: [COMPLETED, WITHDRAWN]
    transitions:
      - from: ENROLLED
        to: COMPLETED
        trigger: "POST /prep-programs/{id}/close with outcome=COMPLETED"
        actor: ProgramAdmin
        preconditions:
          - "PrepProgram must be ENROLLED (ERR_INVALID_STATE)"
        side_effects:
          - "Student counts as prep_alum on subsequent application submits"
      - from: ENROLLED
        to: WITHDRAWN
        trigger: "POST /prep-programs/{id}/close with outcome=WITHDRAWN"
        actor: ProgramAdmin
        preconditions:
          - "PrepProgram must be ENROLLED (ERR_INVALID_STATE)"
        side_effects:
          - "Interval no longer participates in the overlap check and does not confer prep_alum"

  - entity: Application
    field: status
    initial_state: DRAFT
    terminal_states: [NOT_FINALIST, REGULAR_DENIED, WITHDRAWN, ENROLLED]
    transitions:
      - from: DRAFT
        to: UNDER_REVIEW
        trigger: "POST /applications/{id}/submit"
        actor: Student (own)
        preconditions:
          - "Application must be DRAFT (ERR_INVALID_STATE)"
          - "Cycle phase must be APPLICATION_OPEN (ERR_WRONG_CYCLE_PHASE)"
          - "logical clock within [app_opens_at, app_closes_at] inclusive (ERR_WINDOW_CLOSED)"
          - "academic eligibility per academic_eligibility (ERR_ACADEMIC_INELIGIBLE)"
          - "income eligibility per household_income_cap (ERR_INCOME_INELIGIBLE)"
        side_effects:
          - "computes and stores prep_alum, academic_index, need_tier; sets submitted_at to the logical clock"
          - "if referral_id set: that Referral NOMINATED -> CONVERTED"
          - "student.student_stage -> APPLICANT"
      - from: UNDER_REVIEW
        to: FINALIST
        trigger: "POST /applications/{id}/review with decision=FINALIST"
        actor: ProgramAdmin
        preconditions:
          - "Application must be UNDER_REVIEW (ERR_INVALID_STATE)"
          - "Cycle phase must be REVIEW (ERR_WRONG_CYCLE_PHASE)"
        side_effects: ["student.student_stage -> FINALIST"]
      - from: UNDER_REVIEW
        to: NOT_FINALIST
        trigger: "POST /applications/{id}/review with decision=NOT_FINALIST"
        actor: ProgramAdmin
        preconditions:
          - "Application must be UNDER_REVIEW (ERR_INVALID_STATE)"
          - "Cycle phase must be REVIEW (ERR_WRONG_CYCLE_PHASE)"
        side_effects: []
      - from: FINALIST
        to: RANKING_SUBMITTED
        trigger: "POST /applications/{id}/rankings (first accepted submission)"
        actor: Student (own)
        preconditions:
          - "Application must be FINALIST or RANKING_SUBMITTED (ERR_INVALID_STATE)"
          - "Cycle phase must be RANKING (ERR_WRONG_CYCLE_PHASE)"
          - "logical clock within [ranking_opens_at, ranking_closes_at] inclusive (ERR_WINDOW_CLOSED)"
          - "expected_application_version must equal current Application.version (ERR_STALE_VERSION)"
          - "every entry college_id must exist (ERR_UNKNOWN_COLLEGE) and be status ACTIVE (ERR_COLLEGE_INACTIVE)"
          - "1..MAX_RANKS entries (ERR_TOO_MANY_RANKS), rank_position exactly 1..N unique and colleges unique (ERR_RANK_ORDER_INVALID)"
        side_effects:
          - "replaces any prior RankingEntry rows atomically; new rows carry list_seq = prior list_seq + 1 (1 on first submit)"
          - "increments Application.version by 1"
      - from: RANKING_SUBMITTED
        to: RANKING_SUBMITTED
        trigger: "POST /applications/{id}/rankings (resubmission revision loop)"
        actor: Student (own)
        preconditions: ["same as FINALIST -> RANKING_SUBMITTED"]
        side_effects: ["same as FINALIST -> RANKING_SUBMITTED"]
      - from: RANKING_SUBMITTED
        to: RANKING_LOCKED
        trigger: "system (cycle advances RANKING -> MATCH_RUN)"
        actor: system
        preconditions: []
        side_effects: []
      - from: FINALIST
        to: REGULAR_POOL
        trigger: "system (cycle advances RANKING -> MATCH_RUN with no accepted ranking submission)"
        actor: system
        preconditions: []
        side_effects: []
      - from: RANKING_LOCKED
        to: MATCHED
        trigger: "system (run-match assigns a slot per binding_match_assignment)"
        actor: system
        preconditions: []
        side_effects:
          - "Link 1 of the run-match cascade: this transition creates the Match (BINDING, rank_position_awarded = winning rank_position)"
          - "Link 2: Match creation auto-creates the AidPackage (PROVISIONAL, guaranteed_full_need=true, coa_cents copied from PartnerCollege.coa_cents, amounts per expected_family_contribution PROVISIONAL variant + aid_package_composition) and increments PartnerCollege.slots_committed by 1"
          - "Link 3: sets matched_college_id to the winning college"
          - "Link 4: student.student_stage FINALIST -> MATCHED"
      - from: RANKING_LOCKED
        to: UNMATCHED
        trigger: "system (run-match finds no qualifying slot on the ranked list)"
        actor: system
        preconditions: []
        side_effects: ["immediately continues to UNMATCHED -> REGULAR_POOL within the same run"]
      - from: UNMATCHED
        to: REGULAR_POOL
        trigger: "system (automatic continuation of the run-match cascade)"
        actor: system
        preconditions: []
        side_effects: ["Application becomes visible on every partner college's regular-pool read"]
      - from: REGULAR_POOL
        to: ADMITTED_REGULAR
        trigger: "POST /applications/{id}/regular-decision with decision=ADMIT"
        actor: CollegeOfficer (admits on behalf of own college, X-User-ID = PartnerCollege.id)
        preconditions:
          - "Application must be REGULAR_POOL (ERR_INVALID_STATE)"
          - "Cycle phase must be REGULAR_DECISION (ERR_WRONG_CYCLE_PHASE)"
          - "Acting college must be status ACTIVE (ERR_COLLEGE_INACTIVE)"
        side_effects:
          - "creates AidPackage (PROVISIONAL, guaranteed_full_need=false, match_id=null, college_id = acting college, amounts per PROVISIONAL variant)"
      - from: REGULAR_POOL
        to: REGULAR_DENIED
        trigger: "POST /applications/{id}/regular-decision with decision=DENY"
        actor: CollegeOfficer
        preconditions:
          - "Application must be REGULAR_POOL (ERR_INVALID_STATE)"
          - "Cycle phase must be REGULAR_DECISION (ERR_WRONG_CYCLE_PHASE)"
        side_effects: []
      - from: ADMITTED_REGULAR
        to: ENROLLED
        trigger: "POST /applications/{id}/enroll"
        actor: Student (own)
        preconditions:
          - "Application must be ADMITTED_REGULAR (ERR_INVALID_STATE)"
          - "Cycle phase must be REGULAR_DECISION or OUTCOME_TRACKING (ERR_WRONG_CYCLE_PHASE)"
          - "an AidPackage for this Application exists in PROVISIONAL, FINALIZED, or REVISED (ERR_INVALID_STATE)"
        side_effects:
          - "creates OutcomeRecord (ENROLLED_Y1, match_id=null, college/cycle from the AidPackage)"
          - "PartnerCollege.enrolled_count += 1"
          - "student.student_stage -> ENROLLED"
      - from: MATCHED
        to: ENROLLED
        trigger: "system (cascade of POST /matches/{id}/enroll)"
        actor: system
        preconditions: []
        side_effects: ["student.student_stage -> ENROLLED"]
      - from: MATCHED
        to: REGULAR_POOL
        trigger: "system (cascade of POST /matches/{id}/release)"
        actor: system
        preconditions: []
        side_effects:
          - "matched_college_id cleared to null"
          - "student.student_stage -> FINALIST"
      - from: [DRAFT, UNDER_REVIEW, FINALIST, RANKING_SUBMITTED, REGULAR_POOL]
        to: WITHDRAWN
        trigger: "POST /applications/{id}/withdraw"
        actor: Student (own)
        preconditions:
          - "Application must be one of DRAFT, UNDER_REVIEW, FINALIST, RANKING_SUBMITTED, REGULAR_POOL (ERR_INVALID_STATE)"
          - "MATCHED is binding: withdraw is rejected (ERR_MATCH_BINDING)"
        side_effects:
          - "any AidPackage of this Application in PROVISIONAL, FINALIZED, or REVISED -> VOID"

  - entity: Match
    field: status
    initial_state: BINDING
    terminal_states: [ENROLLED, RELEASED]
    transitions:
      - from: BINDING
        to: ENROLLED
        trigger: "POST /matches/{id}/enroll"
        actor: "CollegeOfficer (own college), ProgramAdmin"
        preconditions:
          - "Match must be BINDING (ERR_INVALID_STATE)"
          - "Cycle phase must be REGULAR_DECISION or OUTCOME_TRACKING (ERR_WRONG_CYCLE_PHASE)"
        side_effects:
          - "creates OutcomeRecord (ENROLLED_Y1, match_id set, application/college/cycle copied from the Match)"
          - "PartnerCollege.enrolled_count += 1"
          - "Application MATCHED -> ENROLLED"
          - "student.student_stage -> ENROLLED"
      - from: BINDING
        to: RELEASED
        trigger: "POST /matches/{id}/release"
        actor: ProgramAdmin
        preconditions:
          - "Match must be BINDING (ERR_INVALID_STATE)"
        side_effects:
          - "Link 1 of the release cascade: this transition"
          - "Link 2: the AidPackage of this Match in PROVISIONAL, FINALIZED, or REVISED -> VOID, and PartnerCollege.slots_committed -= 1"
          - "Link 3: Application MATCHED -> REGULAR_POOL, matched_college_id cleared"
          - "Link 4: student.student_stage -> FINALIST"

  - entity: AidPackage
    field: status
    initial_state: PROVISIONAL
    terminal_states: [VOID]
    transitions:
      - from: PROVISIONAL
        to: FINALIZED
        trigger: "POST /aid-packages/{id}/finalize"
        actor: CollegeOfficer (own college)
        preconditions:
          - "AidPackage must be PROVISIONAL or REVISED (ERR_INVALID_STATE)"
          - "the latest decided IncomeVerification for the Application must have outcome VERIFIED or WAIVED (ERR_VERIFICATION_REQUIRED)"
        side_effects:
          - "if latest decided outcome is VERIFIED: recompute all amounts with the VERIFIED EFC variant and set aid_variant=VERIFIED"
          - "if latest decided outcome is WAIVED: keep PROVISIONAL variant amounts and aid_variant=PROVISIONAL"
          - "increments AidPackage.version by 1"
      - from: REVISED
        to: FINALIZED
        trigger: "POST /aid-packages/{id}/finalize"
        actor: CollegeOfficer (own college)
        preconditions: ["same as PROVISIONAL -> FINALIZED"]
        side_effects: ["same as PROVISIONAL -> FINALIZED"]
      - from: FINALIZED
        to: REVISED
        trigger: "POST /aid-packages/{id}/revise"
        actor: CollegeOfficer (own college)
        preconditions:
          - "AidPackage must be FINALIZED (ERR_INVALID_STATE)"
          - "expected_aid_package_version must equal current AidPackage.version (ERR_STALE_VERSION)"
        side_effects:
          - "if coa_cents supplied, it replaces coa_cents; all amounts recomputed with the current aid_variant"
          - "increments AidPackage.version by 1"
      - from: [PROVISIONAL, FINALIZED, REVISED]
        to: VOID
        trigger: "system (cascade of match release or application withdrawal)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: IncomeVerification
    field: outcome
    initial_state: PENDING
    terminal_states: [VERIFIED, DISCREPANCY, WAIVED]
    transitions:
      - from: PENDING
        to: VERIFIED
        trigger: "POST /income-verifications/{id}/decide with decision=VERIFY"
        actor: PartnerStaff
        preconditions:
          - "IncomeVerification must be PENDING (ERR_INVALID_STATE)"
          - "segregation: X-User-ID must differ from submitted_by_partner_id and from the partner_id of any Referral cited by the Application (ERR_SEGREGATION_OF_DUTIES)"
          - "discrepancy_assessment yields VERIFIED (|verified-reported| <= 10% of reported)"
        side_effects:
          - "decided_by_partner_id set from X-User-ID"
          - "application.verification_flag -> VERIFIED"
      - from: PENDING
        to: DISCREPANCY
        trigger: "POST /income-verifications/{id}/decide with decision=VERIFY"
        actor: PartnerStaff
        preconditions:
          - "same as PENDING -> VERIFIED, except discrepancy_assessment yields DISCREPANCY"
        side_effects:
          - "decided_by_partner_id set from X-User-ID"
          - "application.verification_flag -> DISCREPANCY"
      - from: PENDING
        to: WAIVED
        trigger: "POST /income-verifications/{id}/decide with decision=WAIVE"
        actor: PartnerStaff
        preconditions:
          - "IncomeVerification must be PENDING (ERR_INVALID_STATE)"
          - "same segregation rule as VERIFY (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "decided_by_partner_id set from X-User-ID"
          - "application.verification_flag -> WAIVED"

  - entity: OutcomeRecord
    field: status
    initial_state: ENROLLED_Y1
    terminal_states: [GRADUATED, NOT_PERSISTED]
    transitions:
      - from: ENROLLED_Y1
        to: PERSISTED_Y2
        trigger: "POST /outcomes/{id}/checkpoint with to_status=PERSISTED_Y2"
        actor: "CollegeOfficer (own college), ProgramAdmin"
        preconditions:
          - "OutcomeRecord must be ENROLLED_Y1 (ERR_INVALID_STATE)"
          - "Cycle phase must be OUTCOME_TRACKING (ERR_WRONG_CYCLE_PHASE)"
        side_effects: ["last_checkpoint_at set to logical clock", "credits_completed updated if supplied"]
      - from: PERSISTED_Y2
        to: PERSISTED_Y3
        trigger: "POST /outcomes/{id}/checkpoint with to_status=PERSISTED_Y3"
        actor: "CollegeOfficer (own college), ProgramAdmin"
        preconditions: ["OutcomeRecord must be PERSISTED_Y2 (ERR_INVALID_STATE)", "Cycle phase must be OUTCOME_TRACKING (ERR_WRONG_CYCLE_PHASE)"]
        side_effects: ["last_checkpoint_at set to logical clock", "credits_completed updated if supplied"]
      - from: PERSISTED_Y3
        to: GRADUATED
        trigger: "POST /outcomes/{id}/checkpoint with to_status=GRADUATED"
        actor: "CollegeOfficer (own college), ProgramAdmin"
        preconditions: ["OutcomeRecord must be PERSISTED_Y3 (ERR_INVALID_STATE)", "Cycle phase must be OUTCOME_TRACKING (ERR_WRONG_CYCLE_PHASE)"]
        side_effects: ["last_checkpoint_at set to logical clock"]
      - from: ENROLLED_Y1
        to: NOT_PERSISTED
        trigger: "POST /outcomes/{id}/checkpoint with to_status=NOT_PERSISTED"
        actor: "CollegeOfficer (own college), ProgramAdmin"
        preconditions: ["OutcomeRecord must be ENROLLED_Y1 (ERR_INVALID_STATE)", "Cycle phase must be OUTCOME_TRACKING (ERR_WRONG_CYCLE_PHASE)"]
        side_effects: ["last_checkpoint_at set to logical clock"]
      - from: [ENROLLED_Y1, PERSISTED_Y2, PERSISTED_Y3]
        to: STOPPED_OUT
        trigger: "POST /outcomes/{id}/checkpoint with to_status=STOPPED_OUT"
        actor: "CollegeOfficer (own college), ProgramAdmin"
        preconditions: ["OutcomeRecord must be ENROLLED_Y1, PERSISTED_Y2, or PERSISTED_Y3 (ERR_INVALID_STATE)", "Cycle phase must be OUTCOME_TRACKING (ERR_WRONG_CYCLE_PHASE)"]
        side_effects: ["last_checkpoint_at set to logical clock"]
      - from: STOPPED_OUT
        to: PERSISTED_Y2
        trigger: "POST /outcomes/{id}/checkpoint with to_status=PERSISTED_Y2 (re-enrollment loop)"
        actor: "CollegeOfficer (own college), ProgramAdmin"
        preconditions: ["OutcomeRecord must be STOPPED_OUT (ERR_INVALID_STATE)", "Cycle phase must be OUTCOME_TRACKING (ERR_WRONG_CYCLE_PHASE)"]
        side_effects: ["last_checkpoint_at set to logical clock"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only; all other conflicts are state preconditions)
# =============================================================================
concurrency_rules:
  - rule_id: ranking-submit-occ
    parent_entity: Application
    write_endpoint: "POST /applications/{id}/rankings"
    occ_field: expected_application_version
    description: |
      Submitting a ranking list against an Application whose version has
      advanced since the client last observed it is rejected. A prior accepted
      submission has legitimately replaced the list (and advanced the version),
      so the current writer's view of the application is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: aid-revise-occ
    parent_entity: AidPackage
    write_endpoint: "POST /aid-packages/{id}/revise"
    occ_field: expected_aid_package_version
    description: |
      Revising an AidPackage whose version has advanced since the client last
      observed it is rejected. A prior revise or finalize has legitimately
      recomputed the package (and advanced the version), so the current
      writer's view of the package is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: household_income_cap
    trigger: "POST /applications/{id}/submit (income eligibility screen)"
    algorithm: threshold
    formula: |
      cap_cents(size) = BASE_CAP_CENTS + (size - REF_HOUSEHOLD_SIZE) * PER_MEMBER_ADJUST_CENTS
      income_eligible = (household_income_cents <= cap_cents(household_size))
      Boundary: income exactly equal to the cap IS eligible (<=, not <).
    input_set: "the submitting Application's household_income_cents and household_size"
    constants:
      BASE_CAP_CENTS: 6500000
      REF_HOUSEHOLD_SIZE: 4
      PER_MEMBER_ADJUST_CENTS: 400000
    precision: "integer cents; exact comparison, no rounding"

  - name: prep_alum_flag
    trigger: "POST /applications/{id}/submit (before academic_eligibility)"
    algorithm: aggregation
    formula: |
      prep_alum = EXISTS PrepProgram P WHERE P.student_id == application.student_id
                  AND P.status == COMPLETED
      Snapshot stored on Application.prep_alum at submit; later prep completions
      do not retroactively change a submitted application.
    input_set: "PrepProgram rows for the student; only status == COMPLETED counts (ENROLLED and WITHDRAWN excluded)"

  - name: academic_index
    trigger: "POST /applications/{id}/submit"
    algorithm: weighted_scoring
    formula: |
      test_component = (test_score == null) ? 0 : floor(test_score / AI_TEST_DIVISOR)
      academic_index = min(AI_CAP, gpa_scaled * AI_GPA_WEIGHT + test_component)
    input_set: "the submitting Application's gpa_scaled and test_score"
    constants:
      AI_CAP: 2000
      AI_GPA_WEIGHT: 2
      AI_TEST_DIVISOR: 4
    precision: "integer; floor division for the test component"

  - name: academic_eligibility
    trigger: "POST /applications/{id}/submit (before household_income_cap)"
    algorithm: threshold
    formula: |
      if prep_alum:
        academic_eligible = (gpa_scaled >= PREP_WAIVER_MIN_GPA)
        # test_score waived for prep alumni
      else:
        academic_eligible = (gpa_scaled >= MIN_GPA_SCALED
                             AND test_score != null
                             AND test_score >= MIN_TEST_SCORE)
    input_set: "the submitting Application's prep_alum, gpa_scaled, test_score"
    constants:
      MIN_GPA_SCALED: 350
      MIN_TEST_SCORE: 1200
      PREP_WAIVER_MIN_GPA: 330
    precision: "integer; >= is inclusive at every comparison"

  - name: need_tier
    trigger: "POST /applications/{id}/submit"
    algorithm: threshold
    formula: |
      half_cap = round_half_up(household_income_cap.cap_cents(household_size) * NEED_HIGH_FRACTION)
      need_tier = HIGH if household_income_cents <= half_cap else STANDARD
    input_set: "the submitting Application's household_income_cents and household_size"
    constants:
      NEED_HIGH_FRACTION: 0.5
    precision: "half_cap rounded half_up to integer cents before comparison"

  - name: expected_family_contribution
    trigger: "AidPackage creation (PROVISIONAL variant) and POST /aid-packages/{id}/finalize with a VERIFIED IncomeVerification (VERIFIED variant)"
    algorithm: tiered_pricing
    formula: |
      # PROVISIONAL variant (self-reported figures from the Application):
      allowance_p = P_ALLOW_BASE_CENTS + household_size * P_ALLOW_PER_MEMBER_CENTS
      efc_p = max(0, round_half_up((household_income_cents - allowance_p) * P_RATE))
      # VERIFIED variant (document-verified figures from the latest VERIFIED IncomeVerification):
      asset_addback = round_half_up(verified_assets_cents * V_ASSET_RATE)
      allowance_v = V_ALLOW_BASE_CENTS + verified_household_size * V_ALLOW_PER_MEMBER_CENTS
      efc_v = max(0, round_half_up((verified_income_cents + asset_addback - allowance_v) * V_RATE))
    input_set: "PROVISIONAL: Application self-reported fields. VERIFIED: latest IncomeVerification with outcome == VERIFIED for the Application"
    constants:
      P_ALLOW_BASE_CENTS: 2400000
      P_ALLOW_PER_MEMBER_CENTS: 600000
      P_RATE: 0.20
      V_ASSET_RATE: 0.12
      V_ALLOW_BASE_CENTS: 2000000
      V_ALLOW_PER_MEMBER_CENTS: 550000
      V_RATE: 0.22
    precision: "integer cents, round_half_up; the asset add-back is rounded BEFORE the rate multiplication (pinned rounding order)"
    variants:
      - name: PROVISIONAL
        when: "package creation (match or regular admission) before any verification; also retained on finalize when the latest decided outcome is WAIVED"
        difference: "uses self-reported income, no asset add-back, larger allowance schedule, lower rate (0.20)"
      - name: VERIFIED
        when: "finalize when the latest decided IncomeVerification outcome is VERIFIED"
        difference: "uses verified income plus a 12% asset add-back, smaller allowance schedule, higher rate (0.22); produces different EFC for the same application"

  - name: aid_package_composition
    trigger: "AidPackage creation, finalize recompute, and revise recompute"
    algorithm: waterfall_allocation
    formula: |
      # Pinned evaluation order (also pinned rounding order — per-component, never sum-then-round):
      need_cents      = max(0, coa_cents - efc_cents)
      work_study_cents = min(WORK_STUDY_CAP_CENTS, round_half_up(need_cents * WORK_STUDY_RATE))
      if college.aid_policy == NO_LOAN:
        loan_cents = 0
      else:  # MINIMAL_LOAN
        loan_cents = min(LOAN_CAP_CENTS, round_half_up((need_cents - work_study_cents) * LOAN_RATE))
      grant_cents = need_cents - work_study_cents - loan_cents   # never rounded; absorbs remainder cents
      # Conserved invariant (compensating_invariant): work_study + loan + grant + efc == coa_cents
    input_set: "the AidPackage's coa_cents and efc_cents, and the college's aid_policy"
    constants:
      WORK_STUDY_CAP_CENTS: 300000
      WORK_STUDY_RATE: 0.10
      LOAN_CAP_CENTS: 150000
      LOAN_RATE: 0.20
    precision: "integer cents, round_half_up applied per component BEFORE the cap; grant is the unrounded remainder"

  - name: match_priority_score
    trigger: "GET /colleges/{id}/regular-pool (pair-wise ordering of the regular pool for the viewing college)"
    algorithm: weighted_scoring
    formula: |
      score(app, college) = app.academic_index
        + (PREP_ALUM_BONUS if app.prep_alum else 0)
        + (REFERRAL_BONUS if exists Referral R with R.id == app.referral_id AND R.status == CONVERTED else 0)
        + (NEED_AWARE_BONUS if college.aid_policy == NO_LOAN AND app.need_tier == HIGH else 0)
    input_set: "Applications with status == REGULAR_POOL of the cycle; scored pairwise against the viewing college"
    constants:
      PREP_ALUM_BONUS: 40
      REFERRAL_BONUS: 25
      NEED_AWARE_BONUS: 15
    precision: "integer"
    note: "Selector determinism for the regular-pool read: eligibility filter = Application.status == REGULAR_POOL in that cycle; ranking expression = match_priority_score DESC; tie-break = Application.created_at ASC; empty pool returns an empty array with 200, never an error. The conditional NEED_AWARE_BONUS branch means the same application can outrank a higher-academic_index application at a NO_LOAN college while losing to it at a MINIMAL_LOAN college."

  - name: binding_match_assignment
    trigger: "POST /cycles/{id}/run-match"
    algorithm: waterfall_allocation
    formula: |
      candidate_set = Applications of this cycle with status == RANKING_LOCKED
      processing_order = candidate_set sorted by academic_index DESC, tie-break created_at ASC (never id)
      for each application in processing_order:
        for each RankingEntry of the application's latest list_seq, rank_position ASC:
          college = entry.college
          if college.status == ACTIVE
             AND college.slots_committed < college.match_slots
             AND application.academic_index >= college.min_academic_index:
            create Match (BINDING, rank_position_awarded = entry.rank_position)
            college.slots_committed += 1
            -> application RANKING_LOCKED -> MATCHED (cascade per §1.2)
            break  # binding: first qualifying college on the list wins
        if no entry qualified:
          application RANKING_LOCKED -> UNMATCHED -> REGULAR_POOL
      # Slot conservation invariant (compensating_invariant): for every college,
      # match_slots == slots_committed + free_slots, where slots_committed counts
      # Matches in BINDING or ENROLLED; release of a match returns the slot exactly.
    input_set: "cycle applications in RANKING_LOCKED; colleges in any status (SUSPENDED skipped by the qualifier)"
    constants: {}
    precision: "integer comparisons; exact"
    note: "Empty candidate set is legal: run succeeds with matched_count 0, unmatched_count 0. A student whose ranked colleges are all full or SUSPENDED falls through to REGULAR_POOL — never an error."

  - name: ranking_list_shape
    trigger: "POST /applications/{id}/rankings"
    algorithm: aggregation
    formula: |
      N = count(entries)
      require 1 <= N <= MAX_RANKS            # else ERR_TOO_MANY_RANKS when N > MAX_RANKS, ERR_INVALID_REQUEST when N == 0
      require sorted(rank_position) == [1..N] # contiguous, 1-based, unique positions; else ERR_RANK_ORDER_INVALID
      require count(distinct college_id) == N # a college may appear at most once per list; else ERR_RANK_ORDER_INVALID
    input_set: "the entries array of the ranking submission"
    constants:
      MAX_RANKS: 12
    precision: "integer counts; exact"

  - name: discrepancy_assessment
    trigger: "POST /income-verifications/{id}/decide with decision=VERIFY"
    algorithm: threshold
    formula: |
      reported = application.household_income_cents
      if reported == 0:
        outcome = VERIFIED if verified_income_cents == 0 else DISCREPANCY
      else:
        diff = abs(verified_income_cents - reported)
        outcome = DISCREPANCY if diff * 100 > reported * DISCREPANCY_MAX_PCT else VERIFIED
      # Boundary: diff exactly equal to 10% of reported is VERIFIED (strictly greater breaches).
    input_set: "the IncomeVerification's verified_income_cents and the cited Application's household_income_cents"
    constants:
      DISCREPANCY_MAX_PCT: 10
    precision: "exact integer cross-multiplication; no floating point"

  - name: persistence_rates
    trigger: "GET /cycles/{id}/outcome-summary"
    algorithm: aggregation
    formula: |
      records = OutcomeRecords of the cycle (all statuses)
      den = count(records)
      on_track_num  = count(records with status IN {PERSISTED_Y2, PERSISTED_Y3, GRADUATED})
      cohort150_num = count(records with status == GRADUATED)
      on_track_rate_bp  = den == 0 ? 0 : round_half_up(on_track_num  * 10000 / den)
      cohort150_rate_bp = den == 0 ? 0 : round_half_up(cohort150_num * 10000 / den)
    input_set: "OutcomeRecords whose cycle_id equals the path cycle, any status"
    constants:
      RATE_SCALE_BP: 10000
    precision: "integer basis points, round_half_up"
    variants:
      - name: ON_TRACK
        when: "always reported"
        difference: "numerator counts PERSISTED_Y2, PERSISTED_Y3, and GRADUATED — measures continued enrollment"
      - name: COHORT_150
        when: "always reported"
        difference: "numerator counts only GRADUATED — measures completion; for the same records it diverges from ON_TRACK whenever any enrollee persists without graduating"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; first failure wins)
# =============================================================================
validations:
  - priority: 1
    category: request
    check: "Request body is well-formed; all required fields present; enum fields carry a declared member; integer fields are integers"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "X-User-Role header present and names a declared role; X-User-ID header present (required for every role except Anonymous)"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"
  - priority: 3
    category: auth
    check: "Role is listed in the endpoint's roles; entity-backed ownership: Student may only act on resources whose student_id equals X-User-ID; Counselor only on own referrals/submissions; PartnerStaff only on own referrals; CollegeOfficer only on resources of college_id == X-User-ID"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all endpoints"
  - priority: 4
    category: existence
    check: "Path parameters resolve to existing resources, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"
  - priority: 5
    category: state
    check: "Target entity is in a state from which the requested transition exists (per §1.2); includes ERR_MATCH_BINDING for withdraw after a binding match, ERR_MATCH_ALREADY_RUN for a second run-match, ERR_CYCLE_BLOCKED for an advance whose preconditions fail, and the OCC stale-version check ERR_STALE_VERSION on ranking submission and aid revision"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints; ERR_STALE_VERSION returns http 412"
  - priority: 6
    category: state
    check: "Cycle phase permits the operation: application create/submit only in APPLICATION_OPEN; review only in REVIEW; rankings only in RANKING; run-match only in MATCH_RUN; regular-decision only in REGULAR_DECISION; enroll and checkpoints only in REGULAR_DECISION/OUTCOME_TRACKING (checkpoints OUTCOME_TRACKING only); referrals only in RECRUITMENT or APPLICATION_OPEN; income-verification submit/decide only in REVIEW, RANKING, MATCH_RUN, or REGULAR_DECISION"
    error_id: ERR_WRONG_CYCLE_PHASE
    http_status: 409
    applies_to: "phase-bound endpoints"
  - priority: 7
    category: business_temporal
    check: "Logical clock inside the operation's window: submit within [app_opens_at, app_closes_at]; rankings within [ranking_opens_at, ranking_closes_at]; new cycle application window must not share any date with a non-CLOSED cycle's window (closed-interval semantics, touching dates conflict); new PrepProgram [starts_on, ends_on) must not intersect another non-WITHDRAWN PrepProgram of the same student (half-open semantics, touching endpoints allowed)"
    error_id: ERR_WINDOW_CLOSED
    http_status: 409
    applies_to: "submit, rankings (ERR_WINDOW_CLOSED); POST /cycles (ERR_CYCLE_OVERLAP); POST /prep-programs (ERR_PROGRAM_OVERLAP)"
  - priority: 8
    category: business_referential
    check: "Body-supplied references resolve and are consistent: referral_id must exist, be NOMINATED, and belong to the same student and cycle; every college_id in a ranking list must exist; POST /referrals requires existing student_id and cycle_id; POST /income-verifications requires an existing application_id; POST /prep-programs requires an existing student_id"
    error_id: ERR_REFERRAL_NOT_FOUND
    http_status: 422
    applies_to: "POST /applications (referral), POST /applications/{id}/rankings (ERR_UNKNOWN_COLLEGE, http 422); POST /referrals, POST /income-verifications, POST /prep-programs (ERR_NOT_FOUND, http 404)"
  - priority: 9
    category: business_constraint
    check: "Uniqueness and shape constraints: student email unique; at most one non-WITHDRAWN Application per (student, cycle); ranking list has 1..MAX_RANKS entries with rank_position exactly 1..N, unique positions and unique colleges; every ranked college must be status ACTIVE"
    error_id: ERR_DUPLICATE_APPLICATION
    http_status: 409
    applies_to: "POST /students (ERR_EMAIL_TAKEN 409), POST /applications (ERR_DUPLICATE_APPLICATION 409), POST /applications/{id}/rankings (ERR_RANK_ORDER_INVALID 422, ERR_TOO_MANY_RANKS 422, ERR_COLLEGE_INACTIVE 409)"
  - priority: 10
    category: business_safety
    check: "Segregation of duties: the PartnerStaff deciding an IncomeVerification must not be the partner that submitted it nor the partner that referred the application"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /income-verifications/{id}/decide"
  - priority: 11
    category: business_constraint
    check: "Academic eligibility screen per academic_eligibility (prep_alum waiver path or standard path)"
    error_id: ERR_ACADEMIC_INELIGIBLE
    http_status: 422
    applies_to: "POST /applications/{id}/submit"
  - priority: 12
    category: business_fiscal
    check: "Income eligibility per household_income_cap: household_income_cents <= cap_cents(household_size)"
    error_id: ERR_INCOME_INELIGIBLE
    http_status: 422
    applies_to: "POST /applications/{id}/submit"
  - priority: 13
    category: business_fiscal
    check: "Aid finalization requires a decided verification: the latest IncomeVerification of the application in a decided state must have outcome VERIFIED or WAIVED"
    error_id: ERR_VERIFICATION_REQUIRED
    http_status: 409
    applies_to: "POST /aid-packages/{id}/finalize"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed request: missing required field, wrong type, or undeclared enum member" }
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing X-User-Role, unknown role, or missing X-User-ID for a non-Anonymous role" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted on this endpoint, or entity-backed ownership check failed" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A path parameter does not resolve to an existing resource" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity is not in a state from which the requested transition exists" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not equal the parent entity's current version (OCC)" }
  - { id: ERR_MATCH_BINDING, http: 409, condition: "Withdrawal (or any student exit) attempted on a MATCHED application; the match is binding" }
  - { id: ERR_MATCH_ALREADY_RUN, http: 409, condition: "run-match requested for a cycle whose match_run_completed is already true" }
  - { id: ERR_CYCLE_BLOCKED, http: 409, condition: "Cycle advance precondition failed (UNDER_REVIEW applications remain, ranking window not closed, match run missing, or non-terminal applications remain at close)" }
  - { id: ERR_WRONG_CYCLE_PHASE, http: 409, condition: "Operation is not permitted in the cycle's current phase" }
  - { id: ERR_WINDOW_CLOSED, http: 409, condition: "Logical clock is outside the operation's declared window" }
  - { id: ERR_CYCLE_OVERLAP, http: 409, condition: "New cycle's application window shares at least one date with a non-CLOSED cycle's window (closed-interval semantics)" }
  - { id: ERR_PROGRAM_OVERLAP, http: 409, condition: "New PrepProgram [starts_on, ends_on) intersects another non-WITHDRAWN PrepProgram of the same student (half-open semantics)" }
  - { id: ERR_REFERRAL_NOT_FOUND, http: 422, condition: "referral_id does not exist, is not NOMINATED, or belongs to a different student or cycle" }
  - { id: ERR_UNKNOWN_COLLEGE, http: 422, condition: "A college_id in a ranking list does not resolve to an existing PartnerCollege" }
  - { id: ERR_COLLEGE_INACTIVE, http: 409, condition: "Operation requires a status ACTIVE college but the college is SUSPENDED" }
  - { id: ERR_DUPLICATE_APPLICATION, http: 409, condition: "Student already has a non-WITHDRAWN application in this cycle" }
  - { id: ERR_EMAIL_TAKEN, http: 409, condition: "A student with this email already exists" }
  - { id: ERR_RANK_ORDER_INVALID, http: 422, condition: "Ranking positions are not exactly 1..N unique, or a college appears twice in one list" }
  - { id: ERR_TOO_MANY_RANKS, http: 422, condition: "Ranking list exceeds MAX_RANKS (12) entries" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "The deciding PartnerStaff is the partner that submitted the verification or referred the application" }
  - { id: ERR_ACADEMIC_INELIGIBLE, http: 422, condition: "Application fails the academic_eligibility screen at submit" }
  - { id: ERR_INCOME_INELIGIBLE, http: 422, condition: "household_income_cents exceeds cap_cents(household_size) at submit" }
  - { id: ERR_VERIFICATION_REQUIRED, http: 409, condition: "Aid finalize requires a latest decided IncomeVerification with outcome VERIFIED or WAIVED" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- test-driving logical clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock. Before any call, the logical clock reads exactly 2026-09-01T00:00:00Z and never falls back to wall-clock time."
    roles: [ProgramAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects: ["all subsequent window/deadline checks read the new clock value"]

  # --- MatchCycle ---
  - method: POST
    path: "/cycles"
    description: "Create a match cycle"
    roles: [ProgramAdmin]
    code: 201
    input: [name, app_opens_at, app_closes_at, ranking_opens_at, ranking_closes_at]
    output: MatchCycle
    side_effects: ["phase=SETUP, match_run_completed=false", "closed-interval window overlap check against every non-CLOSED cycle (ERR_CYCLE_OVERLAP)"]
  - method: GET
    path: "/cycles/{id}"
    description: "Get a cycle"
    roles: [ProgramAdmin, Student, Counselor, PartnerStaff, CollegeOfficer]
    code: 200
    input: []
    output: MatchCycle
    side_effects: []
  - method: POST
    path: "/cycles/{id}/advance"
    description: "Advance the cycle one phase in the fixed pipeline order"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: MatchCycle
    side_effects: ["phase transitions per MatchCycle machine", "entering REVIEW: NOMINATED referrals -> EXPIRED", "entering MATCH_RUN: RANKING_SUBMITTED -> RANKING_LOCKED and FINALIST -> REGULAR_POOL", "increments MatchCycle.version by 1"]
  - method: POST
    path: "/cycles/{id}/run-match"
    description: "Execute binding_match_assignment over RANKING_LOCKED applications (once per cycle)"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: "{ matched_count: integer, unmatched_count: integer }"
    side_effects: ["assignment per binding_match_assignment", "per match: Match created, AidPackage PROVISIONAL created, college.slots_committed += 1, Application -> MATCHED, student_stage -> MATCHED", "unassigned -> UNMATCHED -> REGULAR_POOL", "match_run_completed = true", "increments MatchCycle.version by 1"]
  - method: GET
    path: "/cycles/{id}/outcome-summary"
    description: "Computed read: persistence_rates (both variants) for the cycle"
    roles: [ProgramAdmin, Student, Counselor, PartnerStaff, CollegeOfficer]
    code: 200
    input: []
    output: "{ enrolled_count: integer, on_track_numerator: integer, on_track_denominator: integer, on_track_rate_bp: integer, cohort150_numerator: integer, cohort150_denominator: integer, cohort150_rate_bp: integer }"
    side_effects: []

  # --- PartnerCollege ---
  - method: POST
    path: "/colleges"
    description: "Register a partner college (full-need commitment partner)"
    roles: [ProgramAdmin]
    code: 201
    input: [name, aid_policy, min_academic_index, match_slots, coa_cents]
    output: PartnerCollege
    side_effects: ["status=ACTIVE, slots_committed=0, enrolled_count=0"]
  - method: GET
    path: "/colleges"
    description: "List partner colleges"
    roles: [ProgramAdmin, Student, Counselor, PartnerStaff, CollegeOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: PartnerCollege[]
    side_effects: []
  - method: GET
    path: "/colleges/{id}"
    description: "Get a partner college"
    roles: [ProgramAdmin, Student, Counselor, PartnerStaff, CollegeOfficer]
    code: 200
    input: []
    output: PartnerCollege
    side_effects: []
  - method: POST
    path: "/colleges/{id}/suspend"
    description: "Suspend a college: excluded from new ranking lists and from the next match run"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: PartnerCollege
    side_effects: ["status -> SUSPENDED"]
  - method: POST
    path: "/colleges/{id}/reinstate"
    description: "Reinstate a suspended college"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: PartnerCollege
    side_effects: ["status -> ACTIVE"]
  - method: GET
    path: "/colleges/{id}/ranking-entries"
    description: "Reverse reachability: all RankingEntry rows (any list_seq) naming this college"
    roles: [ProgramAdmin, CollegeOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: RankingEntry[]
    side_effects: []
  - method: GET
    path: "/colleges/{id}/regular-pool"
    description: "Computed read: this cycle's REGULAR_POOL applications ordered by match_priority_score DESC against the viewing college, tie-break Application.created_at ASC; empty pool returns [] with 200"
    roles: [CollegeOfficer, ProgramAdmin]
    code: 200
    input: [cycle_id, "limit?", "offset?"]
    output: Application[]
    side_effects: []

  # --- Counselor / CommunityPartner / Student registration ---
  - method: POST
    path: "/counselors"
    description: "Register a high school counselor"
    roles: [ProgramAdmin]
    code: 201
    input: [full_name, school_name, state_code]
    output: Counselor
    side_effects: []
  - method: GET
    path: "/counselors/{id}"
    description: "Get a counselor"
    roles: [ProgramAdmin, Student, Counselor, PartnerStaff, CollegeOfficer]
    code: 200
    input: []
    output: Counselor
    side_effects: []
  - method: POST
    path: "/community-partners"
    description: "Register a community partner organization"
    roles: [ProgramAdmin]
    code: 201
    input: [org_name, state_code, contact_email]
    output: CommunityPartner
    side_effects: []
  - method: GET
    path: "/community-partners/{id}"
    description: "Get a community partner"
    roles: [ProgramAdmin, Student, Counselor, PartnerStaff, CollegeOfficer]
    code: 200
    input: []
    output: CommunityPartner
    side_effects: []
  - method: POST
    path: "/students"
    description: "Self-register a student"
    roles: [Anonymous]
    code: 201
    input: [email, full_name, state_code, source]
    output: Student
    side_effects: ["student_stage=PROSPECT", "email uniqueness (ERR_EMAIL_TAKEN)"]
  - method: GET
    path: "/students/{id}"
    description: "Get a student"
    roles: [ProgramAdmin, Student, Counselor, PartnerStaff, CollegeOfficer]
    code: 200
    input: []
    output: Student
    side_effects: []
  - method: GET
    path: "/students/{id}/prep-programs"
    description: "Reverse reachability: prep program enrollments of a student"
    roles: [ProgramAdmin, Student, Counselor, PartnerStaff]
    code: 200
    input: ["limit?", "offset?"]
    output: PrepProgram[]
    side_effects: []

  # --- Referral ---
  - method: POST
    path: "/referrals"
    description: "Nominate a student into a cycle; referrer identity taken from role + X-User-ID (counselor_id or partner_id set accordingly)"
    roles: [Counselor, PartnerStaff]
    code: 201
    input: [student_id, cycle_id, "note?"]
    output: Referral
    side_effects: ["status=NOMINATED"]
  - method: POST
    path: "/referrals/{id}/revoke"
    description: "Revoke a NOMINATED referral"
    roles: [Counselor, PartnerStaff, ProgramAdmin]
    code: 200
    input: []
    output: Referral
    side_effects: ["status -> REVOKED"]
  - method: GET
    path: "/referrals"
    description: "List referrals with optional filters"
    roles: [ProgramAdmin, Counselor, PartnerStaff, Student]
    code: 200
    input: ["student_id?", "counselor_id?", "partner_id?", "cycle_id?", "status?", "limit?", "offset?"]
    output: Referral[]
    side_effects: []
  - method: GET
    path: "/referrals/{id}"
    description: "Get a referral"
    roles: [ProgramAdmin, Counselor, PartnerStaff, Student]
    code: 200
    input: []
    output: Referral
    side_effects: []

  # --- PrepProgram ---
  - method: POST
    path: "/prep-programs"
    description: "Record a summer/college-prep scholar program enrollment for a student"
    roles: [ProgramAdmin]
    code: 201
    input: [student_id, program_type, cohort_label, starts_on, ends_on]
    output: PrepProgram
    side_effects: ["status=ENROLLED", "half-open overlap check per student over non-WITHDRAWN programs (ERR_PROGRAM_OVERLAP)"]
  - method: POST
    path: "/prep-programs/{id}/close"
    description: "Close a prep enrollment as COMPLETED or WITHDRAWN"
    roles: [ProgramAdmin]
    code: 200
    input: [outcome]
    output: PrepProgram
    side_effects: ["status -> COMPLETED | WITHDRAWN"]
  - method: GET
    path: "/prep-programs/{id}"
    description: "Get a prep program record"
    roles: [ProgramAdmin, Student, Counselor, PartnerStaff]
    code: 200
    input: []
    output: PrepProgram
    side_effects: []

  # --- Application ---
  - method: POST
    path: "/applications"
    description: "Create the (separate-from-standard-admission) match application; student_id taken from X-User-ID"
    roles: [Student]
    code: 201
    input: [cycle_id, "referral_id?", household_income_cents, household_size, "self_reported_assets_cents?", gpa_scaled, "test_score?", "essay_text?"]
    output: Application
    side_effects: ["status=DRAFT", "duplicate (student, cycle) check over non-WITHDRAWN applications (ERR_DUPLICATE_APPLICATION)"]
  - method: GET
    path: "/applications/{id}"
    description: "Get an application"
    roles: [ProgramAdmin, Student, CollegeOfficer, Counselor]
    code: 200
    input: []
    output: Application
    side_effects: []
  - method: GET
    path: "/applications"
    description: "List applications with optional filters"
    roles: [ProgramAdmin, CollegeOfficer, Counselor, PartnerStaff]
    code: 200
    input: ["student_id?", "cycle_id?", "referral_id?", "matched_college_id?", "status?", "limit?", "offset?"]
    output: Application[]
    side_effects: []
  - method: POST
    path: "/applications/{id}/submit"
    description: "Submit a DRAFT application: runs prep_alum_flag, academic_index, academic_eligibility, need_tier, household_income_cap"
    roles: [Student]
    code: 200
    input: []
    output: Application
    side_effects: ["status -> UNDER_REVIEW", "computes prep_alum, academic_index, need_tier; sets submitted_at", "cited Referral -> CONVERTED", "student_stage -> APPLICANT", "increments Application.version by 1"]
  - method: POST
    path: "/applications/{id}/withdraw"
    description: "Withdraw before the binding match; MATCHED is binding (ERR_MATCH_BINDING)"
    roles: [Student]
    code: 200
    input: []
    output: Application
    side_effects: ["status -> WITHDRAWN", "non-VOID AidPackages of this application -> VOID", "increments Application.version by 1"]
  - method: POST
    path: "/applications/{id}/review"
    description: "Committee decision: FINALIST or NOT_FINALIST"
    roles: [ProgramAdmin]
    code: 200
    input: [decision]
    output: Application
    side_effects: ["status -> FINALIST | NOT_FINALIST", "FINALIST: student_stage -> FINALIST", "increments Application.version by 1"]
  - method: POST
    path: "/applications/{id}/rankings"
    description: "Submit or revise the ranked college list (OCC on Application.version); atomic replace with list_seq + 1"
    roles: [Student]
    code: 200
    input: [entries, expected_application_version]
    output: Application
    side_effects: ["FINALIST -> RANKING_SUBMITTED (self-loop on resubmission)", "RankingEntry rows replaced atomically, list_seq incremented", "increments Application.version by 1"]
  - method: GET
    path: "/applications/{id}/rankings"
    description: "Current (max list_seq) RankingEntry rows of the application"
    roles: [ProgramAdmin, Student, CollegeOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: RankingEntry[]
    side_effects: []
  - method: GET
    path: "/applications/{id}/income-verifications"
    description: "Reverse reachability: income verification records of the application"
    roles: [ProgramAdmin, PartnerStaff, Counselor, Student]
    code: 200
    input: ["limit?", "offset?"]
    output: IncomeVerification[]
    side_effects: []
  - method: POST
    path: "/applications/{id}/regular-decision"
    description: "Partner college admits (ADMIT) or denies (DENY) a REGULAR_POOL application; ADMIT creates a non-guaranteed PROVISIONAL AidPackage for the acting college"
    roles: [CollegeOfficer]
    code: 200
    input: [decision]
    output: Application
    side_effects: ["status -> ADMITTED_REGULAR | REGULAR_DENIED", "ADMIT: creates AidPackage PROVISIONAL with guaranteed_full_need=false, college_id = X-User-ID", "increments Application.version by 1"]
  - method: POST
    path: "/applications/{id}/enroll"
    description: "Student accepts a regular admission; creates the OutcomeRecord"
    roles: [Student]
    code: 200
    input: []
    output: Application
    side_effects: ["status -> ENROLLED", "creates OutcomeRecord ENROLLED_Y1 (match_id null)", "college.enrolled_count += 1", "student_stage -> ENROLLED", "increments Application.version by 1"]

  # --- Match ---
  - method: GET
    path: "/matches/{id}"
    description: "Get a match"
    roles: [ProgramAdmin, Student, CollegeOfficer]
    code: 200
    input: []
    output: Match
    side_effects: []
  - method: GET
    path: "/matches"
    description: "List matches with optional filters"
    roles: [ProgramAdmin, Student, CollegeOfficer]
    code: 200
    input: ["application_id?", "college_id?", "cycle_id?", "status?", "limit?", "offset?"]
    output: Match[]
    side_effects: []
  - method: POST
    path: "/matches/{id}/release"
    description: "Administrative release from the binding match (extenuating circumstances); compensation cascade"
    roles: [ProgramAdmin]
    code: 200
    input: ["reason?"]
    output: Match
    side_effects: ["status -> RELEASED", "AidPackage -> VOID", "college.slots_committed -= 1", "Application MATCHED -> REGULAR_POOL, matched_college_id cleared", "student_stage -> FINALIST", "increments Match.version by 1"]
  - method: POST
    path: "/matches/{id}/enroll"
    description: "Record enrollment of a matched student; creates the OutcomeRecord"
    roles: [CollegeOfficer, ProgramAdmin]
    code: 200
    input: []
    output: Match
    side_effects: ["status -> ENROLLED", "creates OutcomeRecord ENROLLED_Y1", "college.enrolled_count += 1", "Application MATCHED -> ENROLLED", "student_stage -> ENROLLED", "increments Match.version by 1"]

  # --- AidPackage ---
  - method: GET
    path: "/aid-packages/{id}"
    description: "Get an aid package"
    roles: [ProgramAdmin, Student, CollegeOfficer]
    code: 200
    input: []
    output: AidPackage
    side_effects: []
  - method: GET
    path: "/aid-packages"
    description: "List aid packages with optional filters"
    roles: [ProgramAdmin, Student, CollegeOfficer]
    code: 200
    input: ["match_id?", "application_id?", "college_id?", "status?", "limit?", "offset?"]
    output: AidPackage[]
    side_effects: []
  - method: POST
    path: "/aid-packages/{id}/revise"
    description: "Revise a FINALIZED package (OCC on AidPackage.version); optional new coa_cents; recomputes with current aid_variant"
    roles: [CollegeOfficer]
    code: 200
    input: ["coa_cents?", expected_aid_package_version]
    output: AidPackage
    side_effects: ["status FINALIZED -> REVISED", "recompute per aid_package_composition", "increments AidPackage.version by 1"]
  - method: POST
    path: "/aid-packages/{id}/finalize"
    description: "Finalize a PROVISIONAL or REVISED package; VERIFIED verification switches amounts to the VERIFIED EFC variant"
    roles: [CollegeOfficer]
    code: 200
    input: []
    output: AidPackage
    side_effects: ["status -> FINALIZED", "VERIFIED outcome: recompute with VERIFIED variant, aid_variant=VERIFIED", "WAIVED outcome: keep PROVISIONAL variant", "increments AidPackage.version by 1"]

  # --- IncomeVerification ---
  - method: POST
    path: "/income-verifications"
    description: "Submit document-verified income figures for an application"
    roles: [Counselor, PartnerStaff]
    code: 201
    input: [application_id, verified_income_cents, verified_assets_cents, verified_household_size]
    output: IncomeVerification
    side_effects: ["outcome=PENDING", "submitted_by_counselor_id or submitted_by_partner_id set from role + X-User-ID"]
  - method: POST
    path: "/income-verifications/{id}/decide"
    description: "Decide a PENDING verification; VERIFY computes VERIFIED vs DISCREPANCY per discrepancy_assessment"
    roles: [PartnerStaff]
    code: 200
    input: [decision]
    output: IncomeVerification
    side_effects: ["outcome -> VERIFIED | DISCREPANCY | WAIVED", "decided_by_partner_id set", "application.verification_flag updated"]

  # --- OutcomeRecord ---
  - method: POST
    path: "/outcomes/{id}/checkpoint"
    description: "Advance an outcome record (persistence, graduation, stop-out, re-enrollment)"
    roles: [CollegeOfficer, ProgramAdmin]
    code: 200
    input: [to_status, "credits_completed?"]
    output: OutcomeRecord
    side_effects: ["status transition per OutcomeRecord machine", "last_checkpoint_at set to logical clock"]
  - method: GET
    path: "/outcomes/{id}"
    description: "Get an outcome record"
    roles: [ProgramAdmin, Student, CollegeOfficer]
    code: 200
    input: []
    output: OutcomeRecord
    side_effects: []
  - method: GET
    path: "/outcomes"
    description: "List outcome records with optional filters"
    roles: [ProgramAdmin, Student, CollegeOfficer]
    code: 200
    input: ["application_id?", "college_id?", "cycle_id?", "match_id?", "status?", "limit?", "offset?"]
    output: OutcomeRecord[]
    side_effects: []

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated applicant self-registering"
    identity: opaque
    exclusive_operations: ["POST /students"]
    shared_operations: []
  - name: ProgramAdmin
    description: "Consortium program operator; runs cycles, reviews, match, releases, prep records, registrations, clock"
    identity: opaque
    exclusive_operations: ["POST /_clock/set_current_utc", "POST /cycles", "POST /cycles/{id}/advance", "POST /cycles/{id}/run-match", "POST /colleges", "POST /colleges/{id}/suspend", "POST /colleges/{id}/reinstate", "POST /counselors", "POST /community-partners", "POST /applications/{id}/review", "POST /matches/{id}/release", "POST /prep-programs", "POST /prep-programs/{id}/close"]
    shared_operations: ["all GET endpoints", "POST /matches/{id}/enroll", "POST /outcomes/{id}/checkpoint", "POST /referrals/{id}/revoke"]
  - name: Student
    description: "Applicant; owns applications, rankings, enrollment acceptance"
    identity: "entity_backed:Student"
    exclusive_operations: ["POST /applications", "POST /applications/{id}/submit", "POST /applications/{id}/withdraw", "POST /applications/{id}/rankings", "POST /applications/{id}/enroll"]
    shared_operations: ["GET endpoints"]
  - name: Counselor
    description: "High school counselor; nominates students, submits income documents"
    identity: "entity_backed:Counselor"
    exclusive_operations: ["POST /referrals (as counselor)", "POST /income-verifications (as counselor)"]
    shared_operations: ["GET endpoints", "POST /referrals/{id}/revoke (own)"]
  - name: PartnerStaff
    description: "Community partner staff; nominates students, submits and decides income verifications (segregated on the same application)"
    identity: "entity_backed:CommunityPartner"
    exclusive_operations: ["POST /income-verifications/{id}/decide", "POST /referrals (as partner)", "POST /income-verifications (as partner)"]
    shared_operations: ["GET endpoints", "POST /referrals/{id}/revoke (own)"]
  - name: CollegeOfficer
    description: "Partner college admissions/aid officer for one college (X-User-ID = PartnerCollege.id)"
    identity: "entity_backed:PartnerCollege"
    exclusive_operations: ["POST /applications/{id}/regular-decision", "POST /aid-packages/{id}/revise", "POST /aid-packages/{id}/finalize"]
    shared_operations: ["GET endpoints", "POST /matches/{id}/enroll (own college)", "POST /outcomes/{id}/checkpoint (own college)"]
