scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: branch_score_point_in_time_vs_trailing_blend_band_divergence
        grounds:
          - calculations.branch_performance_score
          - entities.Branch.fields.scoring_variant
          - entities.Branch.fields.performance_band
          - entities.PerformanceSnapshot.fields.composite_score_bps
          - endpoints[GET /distribution/branches/{branchId}/performance-score]
        distinguishing_aspect: |
          This instance lives in the Branch scoring domain: over one identical three-period snapshot
          history POINT_IN_TIME returns 3332 bps / WATCH while TRAILING_BLEND returns 5228 bps /
          STABLE, so the two variants disagree on both the score and the band.
        test_recipe:
          setup:
            - "One MarketArea 'Riverbend North' (population 120000, 24 competitor branches) exists."
            - "One Branch RB-101 exists in that market with the default scoring_variant TRAILING_BLEND."
            - "RB-101 has exactly three PerformanceSnapshots: 2025-Q4 (composite 8305), 2026-Q1 (composite 6335) and 2026-Q2 (composite 3332) — a steadily deteriorating branch."
            - "Logical clock at its default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /distribution/market-areas"
              payload: { name: "Riverbend North", region_code: "MW-04", population: 120000, median_household_income_cents: 8500000, deposit_market_total_cents: 240000000000, competitor_branch_count: 24, household_growth_pct_bps: 350, digital_penetration_bps: 5200 }
              as: NetworkStrategist
              captures: { ma_id: $.data.id }
            - call: "POST /distribution/branches"
              payload: { market_area_id: "${ma_id}", branch_code: "RB-101", branch_type: "FULL_SERVICE", tenure_class: "LEASED", deposit_balance_cents: 4800000000, monthly_transaction_count: 3600, digital_adoption_bps: 5400, annual_noninterest_expense_cents: 38000000, annual_revenue_cents: 140000000, fte_count: 9, atm_count: 2, opened_on: "2005-03-01" }
              as: NetworkStrategist
              captures: { b1_id: $.data.id }
            - call: "POST /distribution/branches/${b1_id}/performance-snapshots"
              payload: { period_label: "2025-Q4", period_end_date: "2025-12-31", deposits_cents: 9600000000, transaction_count: 8100, digital_active_bps: 7200, revenue_cents: 300000000, noninterest_expense_cents: 165000000 }
              as: NetworkStrategist
            - call: "POST /distribution/branches/${b1_id}/performance-snapshots"
              payload: { period_label: "2026-Q1", period_end_date: "2026-03-31", deposits_cents: 7200000000, transaction_count: 6300, digital_active_bps: 6400, revenue_cents: 240000000, noninterest_expense_cents: 156000000 }
              as: NetworkStrategist
            - call: "POST /distribution/branches/${b1_id}/performance-snapshots"
              payload: { period_label: "2026-Q2", period_end_date: "2026-06-30", deposits_cents: 4800000000, transaction_count: 3600, digital_active_bps: 5400, revenue_cents: 140000000, noninterest_expense_cents: 120000000 }
              as: NetworkStrategist
              captures: { snap_q2_id: $.data.id }
          trigger:
            - call: "GET /distribution/branches/${b1_id}/performance-score"
              payload: { scoring_variant: "POINT_IN_TIME" }
              as: NetworkStrategist
              captures: { pit_score: $.data.performance_score_bps, pit_band: $.data.performance_band }
            - call: "GET /distribution/branches/${b1_id}/performance-score"
              payload: { scoring_variant: "TRAILING_BLEND" }
              as: NetworkStrategist
              captures: { trail_score: $.data.performance_score_bps, trail_band: $.data.performance_band }
          assert:
            - "PerformanceSnapshot.${snap_q2_id}.composite_score_bps == 3332"
            - "PerformanceSnapshot.${snap_q2_id}.band == WATCH"
            - "POINT_IN_TIME response performance_score_bps == 3332 and performance_band == WATCH"
            - "TRAILING_BLEND response performance_score_bps == 5228 and performance_band == STABLE"
            - "TRAILING_BLEND performance_score_bps - POINT_IN_TIME performance_score_bps == 1896"
            - "both responses report contributing_snapshot_count == 3"
            - "Branch.${b1_id}.performance_score_bps == 5228 and Branch.${b1_id}.performance_band == STABLE (persisted under the default TRAILING_BLEND)"
            - "Branch.${b1_id}.snapshot_count == 3"

      - name: retention_forecast_distance_decay_vs_segment_mix_divergence
        grounds:
          - calculations.deposit_retention_forecast
          - entities.RetentionForecast.fields.model_variant
          - entities.RetentionForecast.fields.retention_bps
          - entities.ConsolidationCase.fields.forecast_retention_bps
          - state_machines.ConsolidationCase.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          This instance lives in the ConsolidationCase retention domain and turns on interval
          rounding of the same 3.4-mile distance: DISTANCE_DECAY consumes floor(3.4) additively and
          yields 9200 bps / 4416000000 retained, while SEGMENT_MIX consumes ceil(3.4) as a
          multiplicative penalty on a segment-weighted base and yields 7432 bps / 3567360000.
        test_recipe:
          setup:
            - "MarketArea 'Riverbend North' with branches RB-101 (deposits 4800000000, digital_adoption_bps 5400) and RB-102 (deposits 9600000000)."
            - "One DRAFT ConsolidationCase closing RB-101 into RB-102."
            - "The case carries one ACTIVE DISTANCE_DECAY forecast at 3.4 miles before the second forecast is filed."
          setup_api_calls:
            - call: "POST /distribution/market-areas"
              payload: { name: "Riverbend North", region_code: "MW-04", population: 120000, median_household_income_cents: 8500000, deposit_market_total_cents: 240000000000, competitor_branch_count: 24, household_growth_pct_bps: 350, digital_penetration_bps: 5200 }
              as: NetworkStrategist
              captures: { ma_id: $.data.id }
            - call: "POST /distribution/branches"
              payload: { market_area_id: "${ma_id}", branch_code: "RB-101", branch_type: "FULL_SERVICE", tenure_class: "LEASED", deposit_balance_cents: 4800000000, monthly_transaction_count: 3600, digital_adoption_bps: 5400, annual_noninterest_expense_cents: 38000000, annual_revenue_cents: 140000000, fte_count: 9, atm_count: 2, opened_on: "2005-03-01" }
              as: NetworkStrategist
              captures: { b1_id: $.data.id, b1_v: $.data.version }
            - call: "POST /distribution/branches"
              payload: { market_area_id: "${ma_id}", branch_code: "RB-102", branch_type: "FULL_SERVICE", tenure_class: "OWNED", deposit_balance_cents: 9600000000, monthly_transaction_count: 7200, digital_adoption_bps: 6800, annual_noninterest_expense_cents: 118000000, annual_revenue_cents: 305000000, fte_count: 14, atm_count: 3, opened_on: "1998-06-15", onboarding_capacity_households_per_day: 60 }
              as: NetworkStrategist
              captures: { b2_id: $.data.id }
            - call: "POST /distribution/consolidation-cases"
              payload: { closing_branch_id: "${b1_id}", receiving_branch_id: "${b2_id}", rationale_code: "LOW_PERFORMANCE", planned_closure_date: "2026-11-15", expected_branch_version: "${b1_v}" }
              as: NetworkStrategist
              as_user_id: "u_strategist_1"
              captures: { case_id: $.data.id, case_v1: $.data.version }
            - call: "POST /distribution/retention-forecasts"
              payload: { consolidation_case_id: "${case_id}", model_variant: "DISTANCE_DECAY", distance_miles: 3.4, retail_share_bps: 6000, small_business_share_bps: 2500, wealth_share_bps: 1500, expected_case_version: "${case_v1}" }
              as: NetworkStrategist
              captures: { fc_dd_id: $.data.id }
            - call: "GET /distribution/consolidation-cases/${case_id}"
              payload: {}
              as: NetworkStrategist
              captures: { case_v2: $.data.version }
          trigger:
            - call: "POST /distribution/retention-forecasts"
              payload: { consolidation_case_id: "${case_id}", model_variant: "SEGMENT_MIX", distance_miles: 3.4, retail_share_bps: 6000, small_business_share_bps: 2500, wealth_share_bps: 1500, expected_case_version: "${case_v2}" }
              as: NetworkStrategist
              captures: { fc_sm_id: $.data.id }
          assert:
            - "RetentionForecast.${fc_dd_id}.retention_bps == 9200"
            - "RetentionForecast.${fc_dd_id}.retained_deposits_cents == 4416000000 and RetentionForecast.${fc_dd_id}.runoff_cents == 384000000"
            - "RetentionForecast.${fc_sm_id}.retention_bps == 7432"
            - "RetentionForecast.${fc_sm_id}.retained_deposits_cents == 3567360000 and RetentionForecast.${fc_sm_id}.runoff_cents == 1232640000"
            - "RetentionForecast.${fc_dd_id}.retention_bps - RetentionForecast.${fc_sm_id}.retention_bps == 1768"
            - "RetentionForecast.${fc_dd_id}.status == SUPERSEDED and RetentionForecast.${fc_sm_id}.status == ACTIVE"
            - "ConsolidationCase.${case_id}.forecast_retention_bps == 7432"
            - "ConsolidationCase.${case_id}.forecast_retained_deposits_cents == 3567360000 and ConsolidationCase.${case_id}.forecast_runoff_cents == 1232640000"
            - "RetentionForecast.${fc_dd_id}.baseline_deposits_cents == 4800000000 and RetentionForecast.${fc_dd_id}.digital_adoption_bps == 5400 (both copied from the closing branch)"

  - rule_id: combinatorial_formula
    instances:
      - name: severance_pool_round_then_sum_across_two_employees
        grounds:
          - calculations.severance_pool
          - entities.StaffDisposition.fields.weekly_pay_cents
          - entities.StaffDisposition.fields.severance_amount_cents
          - entities.ConsolidationCase.fields.severance_pool_cents
        distinguishing_aspect: |
          This instance is a pinned ROUNDING-ORDER combination: each employee's weekly pay is rounded
          to whole cents first (150001 and 100001) and only then multiplied by that employee's weeks
          and summed, giving 4240028; rounding after aggregation (13000080 / 52 = 250002) cannot
          reproduce that total.
        test_recipe:
          setup:
            - "MarketArea 'Riverbend North' with branches RB-101 (closing, fte_count 9) and RB-102 (receiving)."
            - "One DRAFT ConsolidationCase closing RB-101 into RB-102."
            - "Two SEVERANCE staff dispositions whose annual salaries are NOT divisible by 52: 7800050 cents at 150 tenure months and 5200030 cents at 30 tenure months."
          setup_api_calls:
            - call: "POST /distribution/market-areas"
              payload: { name: "Riverbend North", region_code: "MW-04", population: 120000, median_household_income_cents: 8500000, deposit_market_total_cents: 240000000000, competitor_branch_count: 24, household_growth_pct_bps: 350, digital_penetration_bps: 5200 }
              as: NetworkStrategist
              captures: { ma_id: $.data.id }
            - call: "POST /distribution/branches"
              payload: { market_area_id: "${ma_id}", branch_code: "RB-101", branch_type: "FULL_SERVICE", tenure_class: "LEASED", deposit_balance_cents: 4800000000, monthly_transaction_count: 3600, digital_adoption_bps: 5400, annual_noninterest_expense_cents: 38000000, annual_revenue_cents: 140000000, fte_count: 9, atm_count: 2, opened_on: "2005-03-01" }
              as: NetworkStrategist
              captures: { b1_id: $.data.id, b1_v: $.data.version }
            - call: "POST /distribution/branches"
              payload: { market_area_id: "${ma_id}", branch_code: "RB-102", branch_type: "FULL_SERVICE", tenure_class: "OWNED", deposit_balance_cents: 9600000000, monthly_transaction_count: 7200, digital_adoption_bps: 6800, annual_noninterest_expense_cents: 118000000, annual_revenue_cents: 305000000, fte_count: 14, atm_count: 3, opened_on: "1998-06-15", onboarding_capacity_households_per_day: 60 }
              as: NetworkStrategist
              captures: { b2_id: $.data.id }
            - call: "POST /distribution/consolidation-cases"
              payload: { closing_branch_id: "${b1_id}", receiving_branch_id: "${b2_id}", rationale_code: "LOW_PERFORMANCE", planned_closure_date: "2026-11-15", expected_branch_version: "${b1_v}" }
              as: NetworkStrategist
              as_user_id: "u_strategist_1"
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /distribution/staff-dispositions"
              payload: { consolidation_case_id: "${case_id}", employee_ref: "EMP-7741", role_title: "Branch Manager", tenure_months: 150, annual_salary_cents: 7800050, proposed_disposition: "SEVERANCE" }
              as: HRPartner
              captures: { sd1_id: $.data.id }
            - call: "POST /distribution/staff-dispositions"
              payload: { consolidation_case_id: "${case_id}", employee_ref: "EMP-8120", role_title: "Teller", tenure_months: 30, annual_salary_cents: 5200030, proposed_disposition: "SEVERANCE" }
              as: HRPartner
              captures: { sd2_id: $.data.id }
          assert:
            - "StaffDisposition.${sd1_id}.service_years == 12 and StaffDisposition.${sd1_id}.severance_weeks == 24"
            - "StaffDisposition.${sd1_id}.weekly_pay_cents == 150001 and StaffDisposition.${sd1_id}.severance_amount_cents == 3720024"
            - "StaffDisposition.${sd2_id}.service_years == 2 and StaffDisposition.${sd2_id}.severance_weeks == 4"
            - "StaffDisposition.${sd2_id}.weekly_pay_cents == 100001 and StaffDisposition.${sd2_id}.severance_amount_cents == 520004"
            - "ConsolidationCase.${case_id}.severance_pool_cents == 4240028"
            - "ConsolidationCase.${case_id}.pending_disposition_count == 2"
            - "ConsolidationCase.${case_id}.severed_fte_count == 0 and ConsolidationCase.${case_id}.redeployed_fte_count == 0"

      - name: net_savings_incentive_tier_pinned_to_gross_not_net
        grounds:
          - calculations.net_consolidation_savings
          - entities.ConsolidationCase.fields.gross_annual_savings_cents
          - entities.ConsolidationCase.fields.transition_incentive_rate_bps
          - entities.ConsolidationCase.fields.net_annual_savings_cents
          - state_machines.ConsolidationCase.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          This instance is a pinned EVALUATION-ORDER combination on an apparently circular dependency:
          gross 107600000 selects INCENTIVE_RATE_HIGH_BPS (12), producing net 98768000, which itself
          sits below INCENTIVE_TIER_HIGH_CENTS; a solver that re-derived the tier from net would
          charge 18 bps / 13248000 and report net 94352000.
        test_recipe:
          setup:
            - "MarketArea 'Riverbend North' with branches RB-301 (closing, deposits 8000000000, annual_noninterest_expense_cents 125000000) and RB-302 (receiving, deposits 9000000000)."
            - "One DRAFT case closing RB-301 into RB-302 with an ACTIVE DISTANCE_DECAY forecast at 3.4 miles (retention 9200 bps, retained 7360000000, runoff 640000000)."
            - "One PENDING LEASED PropertyDisposition on RB-301 at 250000 cents monthly rent (annual carry 3000000)."
          setup_api_calls:
            - call: "POST /distribution/market-areas"
              payload: { name: "Riverbend North", region_code: "MW-04", population: 120000, median_household_income_cents: 8500000, deposit_market_total_cents: 240000000000, competitor_branch_count: 24, household_growth_pct_bps: 350, digital_penetration_bps: 5200 }
              as: NetworkStrategist
              captures: { ma_id: $.data.id }
            - call: "POST /distribution/branches"
              payload: { market_area_id: "${ma_id}", branch_code: "RB-301", branch_type: "FULL_SERVICE", tenure_class: "LEASED", deposit_balance_cents: 8000000000, monthly_transaction_count: 4200, digital_adoption_bps: 5400, annual_noninterest_expense_cents: 125000000, annual_revenue_cents: 300000000, fte_count: 12, atm_count: 2, opened_on: "2001-09-04" }
              as: NetworkStrategist
              captures: { b1_id: $.data.id, b1_v: $.data.version }
            - call: "POST /distribution/branches"
              payload: { market_area_id: "${ma_id}", branch_code: "RB-302", branch_type: "FULL_SERVICE", tenure_class: "OWNED", deposit_balance_cents: 9000000000, monthly_transaction_count: 7000, digital_adoption_bps: 6600, annual_noninterest_expense_cents: 130000000, annual_revenue_cents: 320000000, fte_count: 15, atm_count: 3, opened_on: "1996-02-20", onboarding_capacity_households_per_day: 60 }
              as: NetworkStrategist
              captures: { b2_id: $.data.id }
            - call: "POST /distribution/consolidation-cases"
              payload: { closing_branch_id: "${b1_id}", receiving_branch_id: "${b2_id}", rationale_code: "MARKET_OVERLAP", planned_closure_date: "2026-11-15", expected_branch_version: "${b1_v}" }
              as: NetworkStrategist
              as_user_id: "u_strategist_1"
              captures: { case_id: $.data.id, case_v1: $.data.version }
            - call: "POST /distribution/retention-forecasts"
              payload: { consolidation_case_id: "${case_id}", model_variant: "DISTANCE_DECAY", distance_miles: 3.4, retail_share_bps: 6000, small_business_share_bps: 2500, wealth_share_bps: 1500, expected_case_version: "${case_v1}" }
              as: NetworkStrategist
              captures: { fc_id: $.data.id }
            - call: "POST /distribution/property-dispositions"
              payload: { branch_id: "${b1_id}", consolidation_case_id: "${case_id}", atm_disposition: "RELOCATE", atm_monthly_cost_cents: 30000, atm_monthly_surcharge_revenue_cents: 80000, monthly_rent_cents: 250000, lease_end_date: "2027-06-30", buyout_offer_cents: 500000 }
              as: RealEstateManager
              captures: { pd_id: $.data.id }
          trigger:
            - call: "POST /distribution/consolidation-cases/${case_id}/submit"
              payload: {}
              as: NetworkStrategist
              as_user_id: "u_strategist_1"
          assert:
            - "ConsolidationCase.${case_id}.forecast_runoff_cents == 640000000 and ConsolidationCase.${case_id}.forecast_retained_deposits_cents == 7360000000"
            - "PropertyDisposition.${pd_id}.annual_carry_cents == 3000000"
            - "ConsolidationCase.${case_id}.gross_annual_savings_cents == 107600000"
            - "ConsolidationCase.${case_id}.transition_incentive_rate_bps == 12"
            - "ConsolidationCase.${case_id}.transition_incentive_cents == 8832000"
            - "ConsolidationCase.${case_id}.net_annual_savings_cents == 98768000"
            - "ConsolidationCase.${case_id}.transition_incentive_cents != 13248000 (the value a net-derived tier would produce)"
            - "ConsolidationCase.${case_id}.status == SUBMITTED"

  - rule_id: non_linear_state_machine
    instances:
      - name: case_return_revise_resubmit_cycle_then_approved
        grounds:
          - state_machines.ConsolidationCase.SUBMITTED_to_RETURNED
          - state_machines.ConsolidationCase.RETURNED_to_DRAFT
          - state_machines.ConsolidationCase.SUBMITTED_to_APPROVED
          - entities.ConsolidationCase.fields.returned_count
          - validations[priority=35]
        distinguishing_aspect: |
          This instance is the CYCLIC + BRANCHING shape of ConsolidationCase: the same SUBMITTED state
          forks into APPROVED / RETURNED / REJECTED on one endpoint, and RETURNED loops back through
          DRAFT to SUBMITTED, with returned_count == 1 proving the loop counter advanced exactly once.
        test_recipe:
          setup:
            - "MarketArea 'Riverbend North' with branches RB-101 (closing) and RB-102 (receiving)."
            - "One DRAFT case with an ACTIVE DISTANCE_DECAY forecast, authored by u_strategist_1."
            - "Approver u_approver_1 is a different user, so segregation of duties is satisfied."
          setup_api_calls:
            - call: "POST /distribution/market-areas"
              payload: { name: "Riverbend North", region_code: "MW-04", population: 120000, median_household_income_cents: 8500000, deposit_market_total_cents: 240000000000, competitor_branch_count: 24, household_growth_pct_bps: 350, digital_penetration_bps: 5200 }
              as: NetworkStrategist
              captures: { ma_id: $.data.id }
            - call: "POST /distribution/branches"
              payload: { market_area_id: "${ma_id}", branch_code: "RB-101", branch_type: "FULL_SERVICE", tenure_class: "LEASED", deposit_balance_cents: 4800000000, monthly_transaction_count: 3600, digital_adoption_bps: 5400, annual_noninterest_expense_cents: 38000000, annual_revenue_cents: 140000000, fte_count: 9, atm_count: 2, opened_on: "2005-03-01" }
              as: NetworkStrategist
              captures: { b1_id: $.data.id, b1_v: $.data.version }
            - call: "POST /distribution/branches"
              payload: { market_area_id: "${ma_id}", branch_code: "RB-102", branch_type: "FULL_SERVICE", tenure_class: "OWNED", deposit_balance_cents: 9600000000, monthly_transaction_count: 7200, digital_adoption_bps: 6800, annual_noninterest_expense_cents: 118000000, annual_revenue_cents: 305000000, fte_count: 14, atm_count: 3, opened_on: "1998-06-15", onboarding_capacity_households_per_day: 60 }
              as: NetworkStrategist
              captures: { b2_id: $.data.id }
            - call: "POST /distribution/consolidation-cases"
              payload: { closing_branch_id: "${b1_id}", receiving_branch_id: "${b2_id}", rationale_code: "LOW_PERFORMANCE", planned_closure_date: "2026-11-15", expected_branch_version: "${b1_v}" }
              as: NetworkStrategist
              as_user_id: "u_strategist_1"
              captures: { case_id: $.data.id, case_v1: $.data.version }
            - call: "POST /distribution/retention-forecasts"
              payload: { consolidation_case_id: "${case_id}", model_variant: "DISTANCE_DECAY", distance_miles: 3.4, retail_share_bps: 6000, small_business_share_bps: 2500, wealth_share_bps: 1500, expected_case_version: "${case_v1}" }
              as: NetworkStrategist
              captures: { fc_id: $.data.id }
            - call: "POST /distribution/consolidation-cases/${case_id}/submit"
              payload: {}
              as: NetworkStrategist
              as_user_id: "u_strategist_1"
            - call: "GET /distribution/consolidation-cases/${case_id}"
              payload: {}
              as: ConsolidationApprover
              captures: { case_v2: $.data.version }
          trigger:
            - call: "POST /distribution/consolidation-cases/${case_id}/decision"
              payload: { decision: "RETURN", reason_code: "NEED_TRADE_AREA_DETAIL", expected_case_version: "${case_v2}" }
              as: ConsolidationApprover
              as_user_id: "u_approver_1"
            - call: "POST /distribution/consolidation-cases/${case_id}/revise"
              payload: { planned_closure_date: "2026-12-01" }
              as: NetworkStrategist
              as_user_id: "u_strategist_1"
            - call: "POST /distribution/consolidation-cases/${case_id}/submit"
              payload: {}
              as: NetworkStrategist
              as_user_id: "u_strategist_1"
            - call: "GET /distribution/consolidation-cases/${case_id}"
              payload: {}
              as: ConsolidationApprover
              captures: { case_v3: $.data.version }
            - call: "POST /distribution/consolidation-cases/${case_id}/decision"
              payload: { decision: "APPROVE", expected_case_version: "${case_v3}" }
              as: ConsolidationApprover
              as_user_id: "u_approver_1"
          assert:
            - "ConsolidationCase.${case_id}.returned_count == 1"
            - "ConsolidationCase.${case_id}.status == APPROVED"
            - "ConsolidationCase.${case_id}.planned_closure_date == 2026-12-01"
            - "ConsolidationCase.${case_id}.decided_by_user_id == u_approver_1"
            - "Branch.${b1_id}.status == UNDER_REVIEW throughout the cycle (the RETURN did not release the branch)"
            - "RetentionForecast.${fc_id}.status == ACTIVE (the revision cycle never superseded the forecast)"
            - "ConsolidationCase.${case_id}.net_annual_savings_cents == 18320000"

      - name: staff_disposition_notification_axis_independent_of_disposition_axis
        grounds:
          - state_machines.StaffDisposition.PENDING_to_NOTIFIED
          - state_machines.StaffDisposition.PROPOSED_to_OFFER_ACCEPTED
          - entities.StaffDisposition.fields.disposition_state
          - entities.StaffDisposition.fields.notification_state
        distinguishing_aspect: |
          This instance is the PARALLEL-DIMENSION shape: notify advances notification_state
          PENDING -> NOTIFIED while disposition_state stays PROPOSED, and the later accept advances
          disposition_state PROPOSED -> OFFER_ACCEPTED while notification_state stays NOTIFIED — the
          combined state (OFFER_ACCEPTED, NOTIFIED) is reached by two independent axes.
        test_recipe:
          setup:
            - "MarketArea 'Riverbend North' with branches RB-101 (closing, fte_count 9) and RB-102 (receiving, fte_count 14)."
            - "One APPROVED case closing RB-101 into RB-102 (author u_strategist_1, approver u_approver_1)."
            - "One REDEPLOYMENT StaffDisposition on that case targeting RB-102, in (PROPOSED, PENDING)."
            - "Logical clock at its default 2026-08-01T00:00:00Z."
          setup_api_calls:
