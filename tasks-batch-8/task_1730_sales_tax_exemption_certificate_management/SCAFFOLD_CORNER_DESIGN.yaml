        distinguishing_aspect: "Submit a cert with no CertificateVersion uploaded -> ERR_NO_CERT_VERSION"
        test_recipe:
          setup: ["tenant, jurisdiction, reason, customer onboarded, cert DRAFT with no version"]
          setup_api_calls:
            - call: "POST /tenants"
              payload: { legal_name: "T1", home_state_code: "NY" }
              as: TenantAdmin
              captures: { tid: $.data.id }
            - call: "POST /tenants/${tid}/jurisdiction_rules"
              payload: { state_code: "CA", accepted_form_types: ["RESALE"], validity_window_days: 0, anchor_rule: "EFFECTIVE_DATE", allows_drop_ship_resale: false, requires_state_registration_number: false, blanket_cert_allowed: false }
              as: TenantAdmin
            - call: "POST /tenants/${tid}/exemption_reasons"
              payload: { code: "RES", description: "R", tax_engine_code: "R", requires_certificate: true, allowed_form_types: ["RESALE"] }
              as: TenantAdmin
            - call: "POST /tenants/${tid}/customers"
              payload: { external_ref: "C1", legal_name: "C", primary_ship_to_state: "CA", exemption_reason_code: "RES" }
              as: ComplianceOfficer
              captures: { cid: $.data.id }
            - call: "POST /tenants/${tid}/customers/${cid}/complete_onboarding"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /tenants/${tid}/customers/${cid}/certificates"
              payload: { ship_to_state: "CA", form_type: "RESALE", exemption_reason_code: "RES", state_registration_number: "", signed_date: "2026-01-01", effective_date: "2026-01-01" }
              as: ComplianceOfficer
              as_user_id: "u_co1"
              captures: { cert: $.data.id }
          trigger:
            - call: "POST /tenants/${tid}/certificates/${cert}/submit"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "u_co1"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NO_CERT_VERSION"

      - name: cert_form_not_accepted_in_state
        claim_type: violation_to_error
        grounds: ["errors[ERR_FORM_NOT_ACCEPTED_IN_STATE]"]
        distinguishing_aspect: "Submitting a cert whose form_type is not in JurisdictionRule.accepted_form_types -> ERR_FORM_NOT_ACCEPTED_IN_STATE"
