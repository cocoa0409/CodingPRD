# ===========================================================================
# 3. CALCULATIONS
# ===========================================================================
- section: calculations
  instances:

  - name: chain_replay_is_chronological_not_insertion_ordered
    claim_type: Correct Result
    grounds:
    - calculations.net_mineral_acres_from_chain.algorithm=chronological
    - calculations.net_mineral_acres_from_chain.input_set
    distinguishing_aspect: "The replay sorts by instrument_date ASC, not by insertion order: filing the same four instruments in the order PATENT, ASSIGNMENT(2011), PROBATE(1988), DEED(1955) still certifies 80.0000 net mineral acres, the identical figure produced by filing them chronologically."
    test_recipe:
      setup:
      - "logical clock at its default 2026-08-01T00:00:00Z"
      - "one RESEARCH tract of 640.0000 gross acres"
      setup_api_calls:
      - call: "POST /tracts"
        payload: { county: "Reeves", state_code: "TX", gross_acres: 640.0000, operator_activity_tier: "HIGH" }
        as: TitleAnalyst
        captures: { c1t: $.data.id }
      - call: "POST /tracts/${c1t}/title-chain-entries"
        payload: { instrument_type: "PATENT", instrument_date: "1902-05-01", conveyed_fraction: 1.0, county_book_page: "100/1", grantor_name: "United States", grantee_name: "A Patentee" }
        as: TitleAnalyst
      - call: "POST /tracts/${c1t}/title-chain-entries"
        payload: { instrument_type: "ASSIGNMENT", instrument_date: "2011-01-05", conveyed_fraction: 0.0625, county_book_page: "780/301", grantor_name: "C Heir", grantee_name: "ORRI Holder" }
        as: TitleAnalyst
      - call: "POST /tracts/${c1t}/title-chain-entries"
        payload: { instrument_type: "PROBATE", instrument_date: "1988-07-20", conveyed_fraction: 0.5, county_book_page: "500/12", grantor_name: "A Patentee Estate", grantee_name: "C Heir" }
        as: TitleAnalyst
      - call: "POST /tracts/${c1t}/title-chain-entries"
        payload: { instrument_type: "DEED", instrument_date: "1955-03-12", conveyed_acres: 480.0000, county_book_page: "220/45", grantor_name: "A Patentee", grantee_name: "B Grantee" }
        as: TitleAnalyst
      trigger:
      - call: "POST /tracts/${c1t}/certify-title"
        payload: {}
        as: TitleAnalyst
      assert:
      - "HTTP 200 and data.net_mineral_acres_certified == 80.0000 - chronological replay 640.0000 -> 160.0000 (DEED 1955) -> 80.0000 (PROBATE 1988) -> 80.0000 (ASSIGNMENT 2011)"
      - "data.existing_burden_fraction == 0.0625 - only the single ASSIGNMENT contributes"
      - "data.title_status == CERTIFIED and data.chain_entry_count == 4"
      - "no intermediate insert was rejected: all four setup POSTs returned 201"

  - name: chain_with_probate_before_deed_is_rejected_as_acreage_negative
    claim_type: Correct Result
    grounds:
    - calculations.net_mineral_acres_from_chain.formula
    - validations[priority=68]
    - errors[ERR_CHAIN_ACREAGE_NEGATIVE]
    distinguishing_aspect: "Order sensitivity is real, not cosmetic: with the PROBATE dated 1955 and the DEED dated 1988 the replay runs 640.0000 -> 320.0000 -> -160.0000, so the DEED insert is rejected with ERR_CHAIN_ACREAGE_NEGATIVE (422) and is not persisted, leaving a two-entry chain that certifies at 320.0000."
    test_recipe:
      setup:
      - "logical clock at its default 2026-08-01T00:00:00Z"
      - "a RESEARCH tract of 640.0000 gross acres carrying PATENT(1902, 1.0) and PROBATE(1955-03-12, 0.5)"
      setup_api_calls:
      - call: "POST /tracts"
        payload: { county: "Reeves", state_code: "TX", gross_acres: 640.0000, operator_activity_tier: "HIGH" }
        as: TitleAnalyst
        captures: { c2t: $.data.id }
      - call: "POST /tracts/${c2t}/title-chain-entries"
        payload: { instrument_type: "PATENT", instrument_date: "1902-05-01", conveyed_fraction: 1.0, county_book_page: "100/1", grantor_name: "United States", grantee_name: "A Patentee" }
        as: TitleAnalyst
      - call: "POST /tracts/${c2t}/title-chain-entries"
        payload: { instrument_type: "PROBATE", instrument_date: "1955-03-12", conveyed_fraction: 0.5, county_book_page: "500/12", grantor_name: "A Patentee Estate", grantee_name: "C Heir" }
        as: TitleAnalyst
      trigger:
      - call: "POST /tracts/${c2t}/title-chain-entries"
        payload: { instrument_type: "DEED", instrument_date: "1988-07-20", conveyed_acres: 480.0000, county_book_page: "220/45", grantor_name: "C Heir", grantee_name: "B Grantee" }
        as: TitleAnalyst
        captures: { err: $.data.error_id }
      - call: "POST /tracts/${c2t}/certify-title"
        payload: {}
        as: TitleAnalyst
      assert:
      - "the DEED insert returns HTTP 422 with data.error_id == ERR_CHAIN_ACREAGE_NEGATIVE"
      - "Tract.${c2t}.chain_entry_count is still 2 - the rejected instrument was not persisted"
      - "the certify call returns HTTP 200 with net_mineral_acres_certified == 320.0000 and existing_burden_fraction == 0.0000"
      - "the same three instruments with the DEED dated 1955 and the PROBATE dated 1988 certify at 80.0000 instead, so the difference is purely chronological"

