scaffold_corner_design:
  - section: entities
    instances:
      - name: c_customer_creation_defaults
        claim_type: creation
        grounds: [entities.Customer.fields.status, entities.Customer.fields.missed_pickup_count, entities.Customer.fields.rebate_balance_cents]
        distinguishing_aspect: "A newly created customer starts PROSPECT with computed counters at zero and version 1; server-minted id/created_at are present."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { name: "New Site", site_address: "100 Grease Ln", site_max_container_gal: 5000 }
              as: FieldOpsManager
              captures: { cust: $.data.id, st: $.data.status, missed: $.data.missed_pickup_count, bal: $.data.rebate_balance_cents, v: $.data.version }
          trigger: []
          assert:
            - "Customer.${cust}.status == PROSPECT"
            - "Customer.${cust}.missed_pickup_count == 0 and rebate_balance_cents == 0 and version == 1"
            - "id is a server-minted UUID; created_at/updated_at are ISO8601 with 3 fractional digits"

      - name: c_customer_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "GET on a well-formed but nonexistent customer id returns the error envelope with ERR_NOT_FOUND and http 404."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/customers/123e4567-e89b-42d3-a456-426614174000"
              payload: {}
              as: FieldOpsManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND, response_type == error, http 404"

      - name: c_customer_computed_field_input_ignored
        claim_type: computed_fields
        grounds: [entities.Customer.fields.rebate_balance_cents]
        distinguishing_aspect: "A client-supplied rebate_balance_cents on create is ignored; the computed field initializes to 0."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { name: "Sneaky Site", site_address: "101 Grease Ln", site_max_container_gal: 5000, rebate_balance_cents: 999 }
              as: FieldOpsManager
              captures: { cust: $.data.id, bal: $.data.rebate_balance_cents }
          trigger: []
          assert:
            - "Customer.${cust}.rebate_balance_cents == 0 (client-supplied 999 ignored)"

      - name: c_customers_list_pagination_envelope
        claim_type: listing
        grounds: [response_envelope]
        distinguishing_aspect: "List endpoint returns the fixed envelope: response_type array with total_count and has_more; default limit 10 applies."
        test_recipe:
          setup: ["two customers created"]
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { name: "P1", site_address: "1 Pg Way", site_max_container_gal: 100 }
              as: FieldOpsManager
            - call: "POST /api/customers"
              payload: { name: "P2", site_address: "2 Pg Way", site_max_container_gal: 100 }
              as: FieldOpsManager
          trigger:
            - call: "GET /api/customers"
              payload: {}
              as: FieldOpsManager
          assert:
            - "response has meta.api_request_id, response_type == array, data length == 2"
            - "pagination fields: total_count == 2, has_more == false, limit == 10, offset == 0"

  - section: state_machines
    instances:
      - name: c_pickup_complete_from_scheduled_rejected
        claim_type: invalid_transition
        grounds: [state_machines.PickupVisit.EN_ROUTE_to_COMPLETED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "complete is defined only from EN_ROUTE; a SCHEDULED visit rejects with ERR_INVALID_STATE and no side effects fire."
        test_recipe:
          setup: ["customer ACTIVE with contract, container, truck; manifest 2026-08-05 dispatched; visit SCHEDULED"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: SystemAdmin }
            - call: "POST /api/customers"
              payload: { name: "SM House", site_address: "20 Fry Way", site_max_container_gal: 5000 }
              as: FieldOpsManager
              captures: { cust: $.data.id }
            - call: "POST /api/customers/${cust}/contracts"
              payload: { pricing_mode: REBATE, index_code: YG_CBI, term_start: "2026-07-01", term_end: "2027-07-01", floor_cents_per_gal: 50, cap_cents_per_gal: 150 }
              as: FieldOpsManager
              captures: { con: $.data.id }
            - { call: "POST /api/contracts/${con}/activate", payload: {}, as: FieldOpsManager }
            - call: "POST /api/customers/${cust}/containers"
              payload: { capacity_gallons: 300, est_fill_rate_gal_per_week: 100, lock_code: "LKS" }
              as: FieldOpsManager
              captures: { ctn: $.data.id }
            - call: "POST /api/trucks"
              payload: { plate: "T-C1", tank_capacity_gallons: 500 }
              as: RouteDispatcher
              captures: { trk: $.data.id }
            - call: "POST /api/route-manifests"
              payload: { truck_id: "${trk}", driver_ref: "drv-1", service_date: "2026-08-05", container_ids: ["${ctn}"] }
              as: RouteDispatcher
              captures: { man: $.data.id }
            - { call: "POST /api/route-manifests/${man}/dispatch", payload: { start_level_gallons: 0 }, as: RouteDispatcher }
            - call: "GET /api/route-manifests/${man}/pickup-visits"
              payload: {}
              as: RouteDispatcher
              captures: { v1: "$.data[0].id" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T08:00:00Z" }, as: SystemAdmin }
          trigger:
            - call: "POST /api/pickup-visits/${v1}/complete"
              payload: { pump_gallons: 100.00, field_moisture_pct: 5.0 }
              as: Driver
              as_user_id: "drv-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "PickupVisit.${v1}.status remains SCHEDULED"

      - name: c_terminated_contract_activate_rejected
        claim_type: terminal_lockdown
        grounds: [state_machines.Contract, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "TERMINATED_VOLUNTARY is terminal: activate from it fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["contract activated 2026-07-01, terminated VOLUNTARY at clock 2026-08-20 (past cooling-off, no settlements)"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T09:00:00Z" }, as: SystemAdmin }
            - call: "POST /api/customers"
              payload: { name: "TermLock", site_address: "21 Fry Way", site_max_container_gal: 5000 }
              as: FieldOpsManager
              captures: { cust: $.data.id }
            - call: "POST /api/customers/${cust}/contracts"
              payload: { pricing_mode: REBATE, index_code: YG_CBI, term_start: "2026-07-01", term_end: "2027-07-01", floor_cents_per_gal: 50, cap_cents_per_gal: 150 }
              as: FieldOpsManager
              captures: { con: $.data.id }
            - { call: "POST /api/contracts/${con}/activate", payload: {}, as: FieldOpsManager }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /api/contracts/${con}/terminate", payload: { reason: VOLUNTARY }, as: FieldOpsManager }
          trigger:
            - call: "POST /api/contracts/${con}/activate"
              payload: {}
              as: FieldOpsManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "Contract.${con}.status remains TERMINATED_VOLUNTARY"

      - name: c_container_unlock_blocked_by_confirmed_theft_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.Container.LOCKED_to_ACTIVE, "validations[priority=26]", "errors[ERR_THEFT_UNRESOLVED]"]
        distinguishing_aspect: "unlock is referentially blocked while a CONFIRMED incident exists; after resolve the same unlock succeeds — the guard reads incident state, not a container flag."
        test_recipe:
          setup: ["customer ACTIVE with contract; container ACTIVE (via dispatched manifest); theft incident CONFIRMED -> container LOCKED"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: SystemAdmin }
            - call: "POST /api/customers"
              payload: { name: "Lock House", site_address: "22 Fry Way", site_max_container_gal: 5000 }
              as: FieldOpsManager
              captures: { cust: $.data.id }
            - call: "POST /api/customers/${cust}/contracts"
              payload: { pricing_mode: REBATE, index_code: YG_CBI, term_start: "2026-07-01", term_end: "2027-07-01", floor_cents_per_gal: 50, cap_cents_per_gal: 150 }
              as: FieldOpsManager
              captures: { con: $.data.id }
            - { call: "POST /api/contracts/${con}/activate", payload: {}, as: FieldOpsManager }
            - call: "POST /api/customers/${cust}/containers"
              payload: { capacity_gallons: 300, est_fill_rate_gal_per_week: 100, lock_code: "LKU" }
              as: FieldOpsManager
              captures: { ctn: $.data.id }
            - call: "POST /api/trucks"
              payload: { plate: "T-C2", tank_capacity_gallons: 500 }
              as: RouteDispatcher
              captures: { trk: $.data.id }
            - call: "POST /api/route-manifests"
              payload: { truck_id: "${trk}", driver_ref: "drv-1", service_date: "2026-08-05", container_ids: ["${ctn}"] }
              as: RouteDispatcher
              captures: { man: $.data.id }
            - { call: "POST /api/route-manifests/${man}/dispatch", payload: { start_level_gallons: 0 }, as: RouteDispatcher }
            - call: "POST /api/theft-incidents"
              payload: { container_id: "${ctn}", evidence_note: "hinge cut" }
              as: FieldOpsManager
              captures: { thf: $.data.id }
            - { call: "POST /api/theft-incidents/${thf}/confirm", payload: {}, as: FieldOpsManager }
          trigger:
            - call: "POST /api/containers/${ctn}/unlock"
              payload: {}
              as: FieldOpsManager
              captures: { err: $.data.error_id }
            - { call: "POST /api/theft-incidents/${thf}/resolve", payload: { resolution_note: "lock replaced" }, as: FieldOpsManager }
            - call: "POST /api/containers/${ctn}/unlock"
              payload: {}
              as: FieldOpsManager
              captures: { st: $.data.status }
          assert:
            - "first unlock fails with error_id == ERR_THEFT_UNRESOLVED"
            - "after incident resolve, unlock succeeds and Container.${ctn}.status == ACTIVE"

      - name: c_theft_confirm_skips_only_scheduled_visits
        claim_type: conditional_cascade
        grounds: [state_machines.Container.ACTIVE_to_LOCKED, state_machines.PickupVisit.SCHEDULED_to_SKIPPED]
        distinguishing_aspect: "The skip cascade is conditional on visit state: the EN_ROUTE visit is untouched while the SCHEDULED one skips; missed_pickup_count counts only the skip (== 1)."
        test_recipe:
          setup: ["customer ACTIVE; container ACTIVE; two manifests (2026-08-03 and 2026-08-04) both dispatched; visit of manifest1 EN_ROUTE, visit of manifest2 SCHEDULED"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: SystemAdmin }
            - call: "POST /api/customers"
              payload: { name: "Cond House", site_address: "23 Fry Way", site_max_container_gal: 5000 }
              as: FieldOpsManager
              captures: { cust: $.data.id }
            - call: "POST /api/customers/${cust}/contracts"
              payload: { pricing_mode: REBATE, index_code: YG_CBI, term_start: "2026-07-01", term_end: "2027-07-01", floor_cents_per_gal: 50, cap_cents_per_gal: 150 }
              as: FieldOpsManager
              captures: { con: $.data.id }
            - { call: "POST /api/contracts/${con}/activate", payload: {}, as: FieldOpsManager }
            - call: "POST /api/customers/${cust}/containers"
              payload: { capacity_gallons: 300, est_fill_rate_gal_per_week: 100, lock_code: "LKCD" }
              as: FieldOpsManager
              captures: { ctn: $.data.id }
            - call: "POST /api/trucks"
              payload: { plate: "T-C3", tank_capacity_gallons: 500 }
              as: RouteDispatcher
              captures: { trk: $.data.id }
            - call: "POST /api/route-manifests"
              payload: { truck_id: "${trk}", driver_ref: "drv-1", service_date: "2026-08-03", container_ids: ["${ctn}"] }
              as: RouteDispatcher
              captures: { man1: $.data.id }
            - { call: "POST /api/route-manifests/${man1}/dispatch", payload: { start_level_gallons: 0 }, as: RouteDispatcher }
            - call: "POST /api/route-manifests"
              payload: { truck_id: "${trk}", driver_ref: "drv-1", service_date: "2026-08-04", container_ids: ["${ctn}"] }
              as: RouteDispatcher
              captures: { man2: $.data.id }
            - { call: "POST /api/route-manifests/${man2}/dispatch", payload: { start_level_gallons: 0 }, as: RouteDispatcher }
            - call: "GET /api/route-manifests/${man1}/pickup-visits"
              payload: {}
              as: RouteDispatcher
              captures: { v1: "$.data[0].id" }
            - call: "GET /api/route-manifests/${man2}/pickup-visits"
              payload: {}
              as: RouteDispatcher
              captures: { v2: "$.data[0].id" }
            - { call: "POST /api/pickup-visits/${v1}/start", payload: {}, as: Driver, as_user_id: "drv-1" }
            - call: "POST /api/theft-incidents"
              payload: { container_id: "${ctn}", evidence_note: "fresh tool marks" }
              as: FieldOpsManager
              captures: { thf: $.data.id }
          trigger:
            - { call: "POST /api/theft-incidents/${thf}/confirm", payload: {}, as: FieldOpsManager }
            - call: "GET /api/pickup-visits/${v1}"
              payload: {}
              as: RouteDispatcher
              captures: { v1_st: $.data.status }
            - call: "GET /api/pickup-visits/${v2}"
              payload: {}
              as: RouteDispatcher
              captures: { v2_st: $.data.status }
            - call: "GET /api/customers/${cust}"
              payload: {}
              as: FieldOpsManager
              captures: { missed: $.data.missed_pickup_count, cust_st: $.data.status }
          assert:
            - "PickupVisit.${v1}.status == EN_ROUTE (in-progress visit not skipped)"
            - "PickupVisit.${v2}.status == SKIPPED"
            - "Customer.${cust}.missed_pickup_count == 1 and status == ACTIVE (below threshold 3)"

      - name: c_sample_regrade_requires_dispute
        claim_type: invalid_transition
        grounds: [state_machines.QualitySample.GRADED_to_DISPUTED, state_machines.QualitySample.DISPUTED_to_GRADED, "errors[ERR_SAMPLE_ALREADY_GRADED]"]
        distinguishing_aspect: "grade on a GRADED sample fails; the GRADED -> DISPUTED -> GRADED loop re-grades with new lab values and overwrites the grade."
        test_recipe:
          setup: ["customer ACTIVE with contract/container/truck; visit completed 2026-08-05; sample submitted"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: SystemAdmin }
            - call: "POST /api/customers"
              payload: { name: "Sample House", site_address: "24 Fry Way", site_max_container_gal: 5000 }
              as: FieldOpsManager
              captures: { cust: $.data.id }
            - call: "POST /api/customers/${cust}/contracts"
              payload: { pricing_mode: REBATE, index_code: YG_CBI, term_start: "2026-07-01", term_end: "2027-07-01", floor_cents_per_gal: 50, cap_cents_per_gal: 150 }
              as: FieldOpsManager
              captures: { con: $.data.id }
            - { call: "POST /api/contracts/${con}/activate", payload: {}, as: FieldOpsManager }
            - call: "POST /api/customers/${cust}/containers"
              payload: { capacity_gallons: 300, est_fill_rate_gal_per_week: 100, lock_code: "LKSM" }
              as: FieldOpsManager
              captures: { ctn: $.data.id }
            - call: "POST /api/trucks"
              payload: { plate: "T-C4", tank_capacity_gallons: 500 }
              as: RouteDispatcher
              captures: { trk: $.data.id }
            - call: "POST /api/route-manifests"
              payload: { truck_id: "${trk}", driver_ref: "drv-1", service_date: "2026-08-05", container_ids: ["${ctn}"] }
              as: RouteDispatcher
              captures: { man: $.data.id }
            - { call: "POST /api/route-manifests/${man}/dispatch", payload: { start_level_gallons: 0 }, as: RouteDispatcher }
            - call: "GET /api/route-manifests/${man}/pickup-visits"
              payload: {}
              as: RouteDispatcher
              captures: { v1: "$.data[0].id" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T08:00:00Z" }, as: SystemAdmin }
            - { call: "POST /api/pickup-visits/${v1}/start", payload: {}, as: Driver, as_user_id: "drv-1" }
            - { call: "POST /api/pickup-visits/${v1}/complete", payload: { pump_gallons: 100.00, field_moisture_pct: 5.0 }, as: Driver, as_user_id: "drv-1" }
            - call: "POST /api/pickup-visits/${v1}/samples"
              payload: {}
              as: Driver
              as_user_id: "drv-1"
              captures: { smp: $.data.id }
            - { call: "POST /api/quality-samples/${smp}/submit", payload: {}, as: Driver, as_user_id: "drv-1" }
            - { call: "POST /api/quality-samples/${smp}/grade", payload: { lab_moisture_pct: 16.0, lab_impurity_pct: 1.0 }, as: PlantOperator }
          trigger:
            - call: "POST /api/quality-samples/${smp}/grade"
              payload: { lab_moisture_pct: 4.0, lab_impurity_pct: 1.0 }
              as: PlantOperator
              captures: { err: $.data.error_id }
            - { call: "POST /api/quality-samples/${smp}/dispute", payload: { note: "lab rerun requested" }, as: FieldOpsManager }
            - call: "POST /api/quality-samples/${smp}/grade"
              payload: { lab_moisture_pct: 4.0, lab_impurity_pct: 1.0 }
              as: PlantOperator
              captures: { g: $.data.grade }
          assert:
            - "second grade before dispute fails with error_id == ERR_SAMPLE_ALREADY_GRADED"
            - "after dispute, grade succeeds and QualitySample.${smp}.grade == A (overwritten from C)"

  - section: calculations
    instances:
      - name: c_grade_band_lower_edge_excluded
        claim_type: boundary
        grounds: [calculations.quality_grade_assignment]
        excluded_because:
          difficulty_instance: moisture_boundary_1500_grades_c
          rationale: "The 15.00/14.99 band-edge assertions are the difficulty instance's trigger and asserts."

      - name: c_provisional_price_uses_latest_prior_week
        claim_type: correct_result
        grounds: [calculations.provisional_index_price]
        distinguishing_aspect: "Provisional pricing picks the greatest week_start <= pickup date, not the highest price: with w07-27 @140 and w08-03 @100 published, the 2026-08-05 pickup prices at 100 (rate 90 after the 0.90 factor), total 16560."
        test_recipe:
          setup:
            - "customer ACTIVE with REBATE contract (floor 50, cap 150); container; visit completed pump 200.00 field 8.0 (field grade B)"
            - "quotes w2026-07-27 @140 and w2026-08-03 @100 published; clock 2026-08-15"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: SystemAdmin }
            - call: "POST /api/customers"
              payload: { name: "Price House", site_address: "25 Fry Way", site_max_container_gal: 5000 }
              as: FieldOpsManager
              captures: { cust: $.data.id }
            - call: "POST /api/customers/${cust}/contracts"
              payload: { pricing_mode: REBATE, index_code: YG_CBI, term_start: "2026-07-01", term_end: "2027-07-01", floor_cents_per_gal: 50, cap_cents_per_gal: 150 }
              as: FieldOpsManager
              captures: { con: $.data.id }
            - { call: "POST /api/contracts/${con}/activate", payload: {}, as: FieldOpsManager }
            - call: "POST /api/customers/${cust}/containers"
              payload: { capacity_gallons: 1200, est_fill_rate_gal_per_week: 200, lock_code: "LKPR" }
              as: FieldOpsManager
              captures: { ctn: $.data.id }
            - call: "POST /api/trucks"
              payload: { plate: "T-C5", tank_capacity_gallons: 2000 }
              as: RouteDispatcher
              captures: { trk: $.data.id }
            - call: "POST /api/route-manifests"
              payload: { truck_id: "${trk}", driver_ref: "drv-1", service_date: "2026-08-05", container_ids: ["${ctn}"] }
              as: RouteDispatcher
              captures: { man: $.data.id }
            - { call: "POST /api/route-manifests/${man}/dispatch", payload: { start_level_gallons: 0 }, as: RouteDispatcher }
            - call: "GET /api/route-manifests/${man}/pickup-visits"
              payload: {}
              as: RouteDispatcher
              captures: { v1: "$.data[0].id" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T08:00:00Z" }, as: SystemAdmin }
            - { call: "POST /api/pickup-visits/${v1}/start", payload: {}, as: Driver, as_user_id: "drv-1" }
            - { call: "POST /api/pickup-visits/${v1}/complete", payload: { pump_gallons: 200.00, field_moisture_pct: 8.0 }, as: Driver, as_user_id: "drv-1" }
            - call: "POST /api/market-index-quotes"
              payload: { index_code: YG_CBI, week_start: "2026-07-27", price_cents_per_gal: 140 }
              as: BillingAnalyst
              captures: { q0: $.data.id }
            - { call: "POST /api/market-index-quotes/${q0}/publish", payload: {}, as: BillingAnalyst }
            - call: "POST /api/market-index-quotes"
              payload: { index_code: YG_CBI, week_start: "2026-08-03", price_cents_per_gal: 100 }
              as: BillingAnalyst
              captures: { q1: $.data.id }
            - { call: "POST /api/market-index-quotes/${q1}/publish", payload: {}, as: BillingAnalyst }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: SystemAdmin }
          trigger:
            - call: "POST /api/settlements/generate"
              payload: { customer_id: "${cust}", period_start: "2026-08-01", period_end: "2026-08-15" }
              as: BillingAnalyst
              captures: { stl: $.data.id, tot: $.data.provisional_total_cents }
            - call: "GET /api/settlements/${stl}/lines"
              payload: {}
              as: BillingAnalyst
              captures: { rate: "$.data[0].rate_cents_per_gal" }
          assert:
            - "Settlement.${stl}.provisional_total_cents == 16560"
            - "the line's rate_cents_per_gal == 90 (from the w08-03 quote @100 x grade factor 0.90), not 126 (w07-27 @140)"

      - name: c_batch_input_mismatch_rejected
        claim_type: constants_applied
        grounds: ["errors[ERR_BATCH_INPUT_MISMATCH]", calculations.tank_conservation_check]
        distinguishing_aspect: "Batch intake must equal the manifest's reconciled collected_gallons exactly: input 999 against collected 1000 rejects with ERR_BATCH_INPUT_MISMATCH."
        test_recipe:
          setup: ["reconciled manifest with collected_gallons == 1000 (single pickup pump 1000.00, start 0, end 1000, spill 0)"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: SystemAdmin }
            - call: "POST /api/customers"
              payload: { name: "Mismatch House", site_address: "26 Fry Way", site_max_container_gal: 5000 }
              as: FieldOpsManager
              captures: { cust: $.data.id }
            - call: "POST /api/customers/${cust}/contracts"
