          assert:
            - "WarehouseSession.${ses_rs}.state == RESUMING"
            - "WarehouseSession.${ses_rs}.elapsed_seconds == 600 which is far above the 60-second floor"
            - "WarehouseSession.${ses_rs}.billed_seconds == 0 and billed_credits == 0.0 and metered_credits == 0.0"
            - "GET /v1/accounts/${acct_rs}/ledger-entries has no row whose source_entity_id equals ${ses_rs}"
      - name: conventional_idempotency_keys_do_not_reprice_a_usage_row
