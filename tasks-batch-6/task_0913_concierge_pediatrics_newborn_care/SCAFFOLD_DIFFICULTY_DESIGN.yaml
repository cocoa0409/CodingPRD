  - rule_id: resource_temporal_overlap
    instances:

      - name: consult_calendar_half_open_interval_plus_turnaround_buffer
        grounds:
          - validations[priority=30]
          - errors[ERR_SCHEDULE_CONFLICT]
          - entities.ConsultBooking.fields.consultant_physician_id
          - entities.ConsultBooking.fields.scheduled_start
        distinguishing_aspect: |
          Resource entity Physician, geometry half-open [start, end) padded by
          CONSULT_TURNAROUND_BUFFER_MINUTES on the trailing edge. A booking
          starting at 09:59 collides with an existing 09:00-09:45 booking because
          09:59 < 09:45 + 15min = 10:00, while a booking starting at exactly
          10:00 is accepted because the comparison is strictly "<". No aggregate
          count is involved - one prior booking is enough.
