      - name: listing_writers_paginates_with_total_count_has_more_and_a_filter
        claim_type: listing
        grounds:
          - endpoints.GET_/writers
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          total_count must count the whole filtered set rather than the returned page, and has_more must
          be computed from offset + returned versus total_count - so page 1 of 7 writers at limit 2 reports
          total_count 7 / has_more true while offset 6 reports 1 row / has_more false. Adding
          determined_level=STORY_EDITOR must re-scope total_count to 2, not merely slice the page.
        test_recipe:
          setup:
            - "Seven writers exist: SR (PRODUCER), W1 and W2 (STORY_EDITOR), W3 (STAFF_WRITER) and AR1..AR3 (CO_PRODUCER, 9 credits >= 7)."
          setup_api_calls:
            - *C_AG
            - *C_SR
            - *C_W1
            - *C_W2
            - *C_W3
            - *C_AR1
            - *C_AR2
            - *C_AR3
          trigger:
            - call: "GET /writers?limit=2&offset=0"
              payload: {}
              as: GuildAdministrator
            - call: "GET /writers?limit=2&offset=6"
              payload: {}
              as: GuildAdministrator
            - call: "GET /writers?determined_level=STORY_EDITOR"
              payload: {}
              as: GuildAdministrator
            - call: "GET /writers"
              payload: {}
              as: GuildAdministrator
          assert:
            - "Trigger call 1 returns response_type == \"array\" with exactly 2 rows, total_count == 7, has_more == true, limit == 2, offset == 0"
            - "Trigger call 2 returns exactly 1 row with total_count == 7 and has_more == false"
            - "Trigger call 3 returns exactly 2 rows (${w1} and ${w2}) with total_count == 2 and has_more == false"
            - "Trigger call 4 applies the declared defaults: limit == 10, offset == 0, all 7 rows returned, has_more == false"

      - name: unknown_ids_return_the_resource_specific_not_found_code
        claim_type: not_found
        grounds:
