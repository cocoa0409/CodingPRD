  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: firefighter_half_open_adjacent_tours_allowed_overlap_rejected
        grounds:
          - validations[priority=11].rules.ERR_DOUBLE_BOOKED_SHIFT
          - calculations.continuous_duty_hours
          - entities.ShiftAssignment.fields.scheduled_hours
          - endpoints["POST /fire-ops/shift-assignments"]
        distinguishing_aspect: |
          The contended resource is one Firefighter and the interval semantics are
          pairwise half-open: back-to-back 24-hour tours on 2026-08-11 and
          2026-08-12 touch at 08:00 with gap 0 and must both be accepted, while a
          12-hour seat that genuinely overlaps the 2026-08-11 tour must be
          rejected.
        test_recipe:
          setup:
            - "Station 56 with one company ENGINE-56 (minimum_crew_size 2, no required certifications), so seat capacity per shift is 3."
            - "Member ff56a on platoon C, Kelly 1, rate 4000 cents, already holding a REGULAR 24-hour seat on the published 2026-08-11 shift (interval 2026-08-11T08:00Z .. 2026-08-12T08:00Z)."
            - "A second shift on 2026-08-12 (platoon D) is published; CALLBACK seats are exempt from the platoon rotation rule, so a platoon C member may legally take one."
            - "Logical clock at its default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /fire-ops/stations"
              payload: { name: "Station 56", battalion_code: "C1", minimum_staffing_floor: 1, fiscal_ot_budget_cents: 9000000, fiscal_period_start_date: "2026-08-01", fiscal_period_end_date: "2026-09-30" }
