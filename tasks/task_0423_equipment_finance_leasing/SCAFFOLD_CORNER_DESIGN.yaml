  # ===========================================================================
  # Stubs: corners already exercised by §1.8 difficulty instances.
  # ===========================================================================
  - section: validations
    instances:
      - name: error_segregation_of_duties_on_approve
        claim_type: Violation -> Error
        grounds: ["validations[priority=7]"]
        excluded_because:
          difficulty_instance: sod_beats_approved_exceeds_requested
          rationale: "ERR_SEGREGATION_OF_DUTIES is asserted as the winning error of the named §1.8 priority-conflict instance."

      - name: error_vendor_not_approved_on_fund
        claim_type: Violation -> Error
        grounds: ["validations[priority=12]"]
        excluded_because:
          difficulty_instance: lease_fund_requires_vendor_approved
          rationale: "ERR_VENDOR_NOT_APPROVED is the asserted failure path of the named §1.8 cross-entity instance."

      - name: error_score_below_floor_on_approve
        claim_type: Violation -> Error
        grounds: ["validations[priority=9]"]
        excluded_because:
          difficulty_instance: credit_score_floor_580_inclusive
          rationale: "ERR_SCORE_BELOW_FLOOR (score 579) is asserted by the named §1.8 boundary instance."

      - name: error_lease_not_end_of_term_on_return
        claim_type: Violation -> Error
        grounds: ["validations[priority=16]"]
        excluded_because:
          difficulty_instance: equipment_return_requires_lease_end_of_term
          rationale: "ERR_LEASE_NOT_END_OF_TERM is the asserted failure path of the named §1.8 instance."

      - name: error_ucc_overlap_on_manual_filing
        claim_type: Violation -> Error
        grounds: ["validations[priority=23]"]
        excluded_because:
          difficulty_instance: ucc_half_open_coverage_overlap_rejected
          rationale: "ERR_UCC_OVERLAP is asserted by the named §1.8 temporal-overlap instance."

      - name: error_serial_reuse_too_soon
        claim_type: Violation -> Error
        grounds: ["validations[priority=22]"]
        excluded_because:
          difficulty_instance: serial_reuse_closed_buffer_blocks_within_30_days
          rationale: "ERR_SERIAL_REUSE_TOO_SOON is asserted by the named §1.8 temporal-overlap instance."

      - name: error_approved_exceeds_requested
        claim_type: Violation -> Error
        grounds: ["validations[priority=8]"]
        excluded_because:
          difficulty_instance: sod_beats_approved_exceeds_requested
          rationale: "ERR_APPROVED_EXCEEDS_REQUESTED is the lower-priority error in the named §1.8 priority-conflict instance, grounded in the same validation row."

      - name: error_buyout_not_paid_on_exercise
        claim_type: Violation -> Error
        grounds: ["validations[priority=17]"]
        excluded_because:
          difficulty_instance: credit_conservation_book_then_terminate
          rationale: "The named §1.8 instance exercises BUYOUT with the exact buyout_payment_cents; ERR_BUYOUT_NOT_PAID is the complementary negative path on the same validation row."

  - section: calculations
    instances:
      - name: residual_value_fmv_vs_trac_divergence
        claim_type: Variant Divergence
        grounds: [calculations.residual_value]
        excluded_because:
          difficulty_instance: residual_buyout_differs_by_lease_type
          rationale: "FMV-vs-TRAC residual/buyout divergence is the core assertion of the named §1.8 dual-variant instance."

      - name: sales_use_vs_property_tax_divergence
        claim_type: Variant Divergence
        grounds: [calculations.assessment_tax_amount]
        excluded_because:
          difficulty_instance: tax_amount_differs_sales_use_vs_property
          rationale: "SALES_USE vs PROPERTY tax divergence is asserted by the named §1.8 instance."

      - name: invoice_sales_tax_rounding_order
        claim_type: Precision
        grounds: [calculations.invoice_sales_tax]
        excluded_because:
          difficulty_instance: invoice_sales_tax_round_per_line_order
          rationale: "Per-line rounding (83 per invoice) is asserted by the named §1.8 combinatorial-rounding instance."

  - section: state_machines
    instances:
      - name: lease_auto_active_on_funded
        claim_type: compound
        grounds: [state_machines.Lease.transitions.BOOKED_to_ACTIVE]
        excluded_because:
          difficulty_instance: lease_parallel_lifecycle_and_funding_dimensions
          rationale: "The automatic BOOKED->ACTIVE on FUNDED is asserted by the named §1.8 parallel-dimensions instance."

      - name: addon_apply_cascade
        claim_type: Cross-entity
        grounds: [state_machines.AddOn.transitions.PROPOSED_to_APPLIED]
        excluded_because:
          difficulty_instance: addon_apply_depth3_cascade
          rationale: "The add-on apply cascade is the subject of the named §1.8 depth-3 cascade instance."

      - name: credit_application_revision_loop
        claim_type: cyclic
        grounds: [state_machines.CreditApplication.transitions.RETURNED_FOR_INFO_to_DRAFT]
        excluded_because:
          difficulty_instance: credit_application_revision_cycle
          rationale: "The RETURNED_FOR_INFO -> DRAFT revision loop is asserted by the named §1.8 cyclic instance."
