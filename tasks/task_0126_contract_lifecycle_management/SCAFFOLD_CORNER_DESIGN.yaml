            - call: "POST /deviation-approvals/${dev_id}/decide"
              payload: { decision: "GRANT" }
              as: RiskOfficer
              as_user_id: "dual-1"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_SELF_APPROVAL (drafter cannot decide own deviation)"

      - name: retire_contract_template_in_use_returns_template_in_use
        claim_type: violation_to_error
        grounds: ["state_machines.ContractTemplate.ACTIVE_to_RETIRED", "errors[ERR_TEMPLATE_IN_USE]"]
        distinguishing_aspect: "Retiring a ContractTemplate referenced by a DRAFT contract -> ERR_TEMPLATE_IN_USE (409)."
        test_recipe:
          setup: ["Org + clause + template; one DRAFT contract using the template."]
          setup_api_calls:
            - call: "POST /organizations"
              payload: { name: "Org" }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /clause-templates"
              payload: { organization_id: "${org_id}", clause_key: "K", category: "OTHER", standard_text: "s", risk_weight: 0 }
              as: ClauseLibrarian
              captures: { k_id: $.data.id }
            - call: "POST /contract-templates"
              payload: { organization_id: "${org_id}", name: "T", clause_template_ids: ["${k_id}"], default_term_months: 12, auto_renew_default: false }
              as: ClauseLibrarian
              captures: { ctpl_id: $.data.id }
            - call: "POST /contracts"
              payload: { organization_id: "${org_id}", contract_template_id: "${ctpl_id}", counterparty_name: "CP", title: "C", term_months: 12, auto_renew: false }
              as: ContractManager
              as_user_id: "mgr-1"
              captures: { contract_id: $.data.id }
          trigger:
            - call: "POST /contract-templates/${ctpl_id}/retire"
              payload: {}
              as: ClauseLibrarian
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_TEMPLATE_IN_USE"

      - name: resource_not_found_on_unknown_workflow
        claim_type: violation_to_error
        grounds: ["errors[ERR_RESOURCE_NOT_FOUND]", "endpoints.GET /approval-workflows/{id}"]
        distinguishing_aspect: "GET /approval-workflows/{id} with a non-existent id -> ERR_RESOURCE_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /approval-workflows/22222222-2222-4222-8222-222222222222"
              payload: {}
              as: ContractApprover
              as_user_id: "appr-1"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_RESOURCE_NOT_FOUND"

  # =========================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_risk_score_visible_in_submit_response
        claim_type: immediate
        grounds: ["calculations.risk_score", "endpoints.POST /contracts/{id}/submit"]
        distinguishing_aspect: "The recomputed provisional risk_score is visible in the same submit response (immediate consistency, not lagged)."
        test_recipe:
          setup: ["Contract v1 with one w=40 deviation; submit."]
          setup_api_calls:
            - call: "POST /organizations"
              payload: { name: "Org", risk_appetite_threshold: 200 }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /clause-templates"
              payload: { organization_id: "${org_id}", clause_key: "LIABILITY_CAP", category: "LIABILITY", standard_text: "s", risk_weight: 40 }
              as: ClauseLibrarian
              captures: { liab_id: $.data.id }
            - call: "POST /contract-templates"
              payload: { organization_id: "${org_id}", name: "T", clause_template_ids: ["${liab_id}"], default_term_months: 12, auto_renew_default: false }
              as: ClauseLibrarian
              captures: { ctpl_id: $.data.id }
            - call: "POST /contracts"
              payload: { organization_id: "${org_id}", contract_template_id: "${ctpl_id}", counterparty_name: "CP", title: "C", term_months: 12, auto_renew: false }
              as: ContractManager
              as_user_id: "mgr-1"
              captures: { contract_id: $.data.id, c_v0: $.data.version }
            - call: "POST /contracts/${contract_id}/versions"
              payload: { contract_id: "${contract_id}", authored_by_party: "INTERNAL", clauses: [ { clause_template_id: "${liab_id}", text: "edit", is_deviation: true } ], expected_contract_version: "${c_v0}" }
              as: ContractManager
              as_user_id: "mgr-1"
              captures: { c_v1: $.data.version }
          trigger:
            - call: "POST /contracts/${contract_id}/submit"
              payload: { expected_contract_version: "${c_v1}" }
              as: ContractManager
              as_user_id: "mgr-1"
              captures: { rs: $.data.risk_score, st: $.data.status }
          assert:
            - "submit response risk_score == 40 (immediately reflects the provisional recompute)"
            - "submit response status == UNDER_REVIEW"

