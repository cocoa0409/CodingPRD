        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[reschedule-stale-appointment-version]
          - errors[ERR_STALE_APPOINTMENT_VERSION]
          - endpoints[POST /appointments/{id}/reschedule]
        distinguishing_aspect: |
          Rescheduling is the one write that is always legal twice over — each move
          legitimately supersedes the previous visit — so nothing but the version guard can
          reject a client acting on an outdated view. The fixture bumps Appointment.version
          behind the client's back with an ordinary confirm, so the stale value is the one the
          booking response handed out; the 412 must fire before the selector runs, leaving the
          chair, the nurse and the row untouched, and the retry with the re-read version must
          then go through and mint the replacement.
