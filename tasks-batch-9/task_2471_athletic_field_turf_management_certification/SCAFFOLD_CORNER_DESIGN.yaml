      - name: field_reopen_after_administrative_closure_restores_open_posture
        claim_type: valid_transition
        grounds:
          - state_machines.Field
          - endpoints[POST /turf/fields/{id}/closure-order]
          - calculations.field_play_status
        distinguishing_aspect: "REOPEN on an administratively closed field clears admin_closure_active to false and admin_closure_reason_code to null, and because no remediation order is open the recomputed play_status is OPEN rather than RESTRICTED."
        test_recipe:
          setup:
            - "One NATURAL_GRASS field (Grass Practice 3) with no assessments, no bookings and no remediation orders."
            - "An administrative closure applied with reason_code IRRIGATION_MAIN_BREAK, so play_status is CLOSED_ADMIN."
          setup_api_calls:
            - call: "POST /turf/staff-members"
              payload: { full_name: "Dana Reyes", roles: ["FacilitiesDirector"] }
              as: FacilitiesDirector
              as_user_id: "00000000-0000-0000-0000-000000000000"
              captures: { s_dir: $.data.id }
            - call: "POST /turf/fields"
              payload: { name: "Grass Practice 3", surface_type: "NATURAL_GRASS", installed_on_date: "2025-08-01", expected_life_years: 12, area_sq_ft: 60000, sanctioned_level: "LOCAL", warranty_expires_on: "2030-08-01" }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
              captures: { f_new: $.data.id }
            - call: "POST /turf/fields/${f_new}/closure-order"
              payload: { action: "CLOSE_ADMIN", reason_code: "IRRIGATION_MAIN_BREAK" }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
              captures: { closed_status: $.data.play_status }
          trigger:
            - call: "POST /turf/fields/${f_new}/closure-order"
              payload: { action: "REOPEN", reason_code: "REPAIR_COMPLETE" }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
              captures: { reopened_status: $.data.play_status, reopened_ver: $.data.version }
          assert:
            - "after the setup closure Field.${f_new}.play_status == \"CLOSED_ADMIN\" and admin_closure_active == true"
            - "after the trigger Field.${f_new}.play_status == \"OPEN\", admin_closure_active == false, admin_closure_reason_code is null"
            - "Field.${f_new}.version == 3 - the create, the closure and the reopen each bumped the OCC token exactly once"
            - "a PRACTICE booking created after the reopen returns 201, whereas the same call during the closure returned 422 ERR_FIELD_NOT_PLAYABLE"

      - name: reopen_while_mandatory_remediation_open_is_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Field
          - validations[priority=53]
          - errors[ERR_UNSAFE_CLOSURE_IN_FORCE]
          - calculations.field_play_status
        distinguishing_aspect: "The REOPEN transition carries a precondition that no MANDATORY remediation order is open: with one open, REOPEN returns 409 ERR_UNSAFE_CLOSURE_IN_FORCE and play_status stays CLOSED_UNSAFE, so an administrator cannot override a safety closure."
        test_recipe:
          setup:
            - "One NATURAL_GRASS field (Grass Practice 3) and one SafetyInspector."
            - "One IMPACT_ATTENUATION assessment with three readings of 210.0, so result is FAIL, a MANDATORY RemediationOrder is OPEN, open_mandatory_remediation_count is 1 and play_status is CLOSED_UNSAFE."
          setup_api_calls:
