  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: superseding_a_batch_moves_earnings_without_creating_or_losing_a_cent
        grounds:
          - state_machines.PayoutBatch.transitions.OPEN_to_SKIPPED
          - state_machines.PayoutBatch.transitions.OPEN_to_LOCKED
          - calculations.payout_batch_totals
          - calculations.clinician_payout_line_amount_cents
          - calculations.clinician_payout_balance_cents
          - concurrency_rules[payout-batch-period-supersede]
          - endpoints.POST_/network/payout-batches/{id}/supersede
        distinguishing_aspect: "Retiring an open batch and rebuilding an overlapping one is a compensating pair over the conserved quantity summed line net: the voiding batch drops to zero earned cents while the replacement batch carries the identically resolved amounts, so the sum across both batches is invariant at 30000 cents before and after."
        test_recipe:
          setup:
            - "Logical clock at 2026-03-01T00:00:00Z, then 2026-06-20T00:00:00Z."
            - "Clinician Dana Reyes is BILLABLE with cash_basis_opt_in false, a WEEKLY schedule, one EFFECTIVE PAX enrollment and a 15000-cent rate row for (PAX, LCSW, CA, 90837)."
            - "Two COMPLETED sessions of hers in the shared window, each with a SIGNED 60-minute note: q1 on 2026-06-02T14:00:00Z for Priya and q2 on 2026-06-03T14:00:00Z for Marcus."
            - "Both sessions are billed: q1's claim is adjudicated PAID and q2's claim is adjudicated DENIED with denial_code NOT_COVERED, so neither session has been assigned to any payout line."
            - "Batch B1 covers 2026-06-01T00:00:00Z to 2026-06-08T00:00:00Z with schedule WEEKLY and is OPEN after being locked, then the lock is deliberately withheld until the invariant probes."
          setup_api_calls:
            - call: "POST /network/_clock/set_current_utc"
              payload: { current_utc: "2026-03-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /network/payers"
