          rationale: "The one-cent difference between per-link rounding and sum-then-round is asserted by the named §1.8 instance."

      - name: mac_discount_tier_is_keyed_on_the_subtotal
        claim_type: tiered_pricing
        grounds: [calculations.mac_ticket_billing]
        excluded_because:
          difficulty_instance: combinatorial_formula / mac_discount_tier_is_keyed_on_subtotal_not_billed_total
          rationale: "The tier boundary at VOLUME_TIER_1_CENTS and the expedite fee charged on the discounted base are asserted by the named §1.8 instance."

      - name: rack_unit_intervals_are_closed_with_capacity_one_per_unit
        claim_type: aggregation
        grounds: [calculations.rack_ru_ledger]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / rack_unit_intervals_are_closed_with_unit_capacity_one
          rationale: "Touching intervals admitted and any shared unit refused are asserted by the named §1.8 instance."

      - name: mac_window_buffer_is_added_to_both_ends_of_the_candidate
        claim_type: interval_merge
        grounds: [calculations.mac_window_occupancy_check]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / room_change_windows_are_half_open_with_a_thirty_minute_buffer
          rationale: "The half-open comparison and the exact thirty-minute gap admission are asserted by the named §1.8 instance."

      - name: grounding_resistance_comparison_is_inclusive
        claim_type: threshold
        grounds: [calculations.grounding_compliance_evaluation]
        excluded_because:
          difficulty_instance: boundary_precision_check / grounding_resistance_at_five_thousand_milliohms_is_the_inclusive_boundary
          rationale: "The 5000 / 5000.01 pair either side of MAX_GROUND_RESISTANCE_MILLIOHMS is asserted by the named §1.8 instance."

      - name: certification_summary_of_a_project_with_no_links
        claim_type: correct_result
        grounds: [calculations.project_certification_rollup]
        excluded_because:
          difficulty_instance: boundary_precision_check / zero_link_project_certification_summary_is_the_empty_set_boundary
          rationale: "The empty-set answers (0.00 rather than a division by zero) are asserted by the named §1.8 instance."

  - section: validations
    instances:
      - name: plenum_rating_applies_only_to_segments_inside_the_plenum_space
        claim_type: conditional_validation
        grounds:
          - validations[priority=80]
          - errors[ERR_PLENUM_RATING_REQUIRED]
        distinguishing_aspect: "One riser-rated CMR cable and one link are routed twice: the segment with in_plenum_space true refuses it with 422 while the segment with in_plenum_space false admits the identical cable, so the rule is keyed on the segment flag and not on the cable alone."
        test_recipe:
          setup:
            - "Project RVT1 with plenum_ceiling true"
            - "CMR cable type of outer_diameter_mm 7.9, segment PS-P (CABLE_TRAY, in_plenum_space true) and root segment PS-N (EMT_CONDUIT, in_plenum_space false)"
          setup_api_calls:
            - call: "POST /cabling/projects"
              payload: { name: "Riverside Tower Cabling", site_code: "RVT1", plenum_ceiling: true, identifier_scheme: "TIA_606_CLASS_1" }
              as: ProjectManager
              captures: { proj: $.data.id }
            - call: "POST /cabling/telecom-rooms"
              payload: { project_id: "${proj}", room_code: "TR01", floor: 3, branch_circuit_amps: 20, ups_capacity_va: 3000 }
              as: ProjectManager
              captures: { room: $.data.id }
            - call: "POST /cabling/cable-types"
              payload: { category: "CAT6A", jacket_rating: "CMR", outer_diameter_mm: 7.9, max_channel_length_m: 100.0, shielded: false, cost_per_meter_cents: 130, applications: ["DATA_HORIZONTAL"] }
              as: DesignEngineer
              captures: { ct_riser: $.data.id }
            - call: "POST /cabling/pathway-segments"
              payload: { project_id: "${proj}", segment_code: "PS-P", pathway_type: "CABLE_TRAY", usable_area_sq_mm: 20000.0, length_m: 40.0, bend_count: 0, in_plenum_space: true }
              as: DesignEngineer
              captures: { seg_p: $.data.id, seg_p_v1: $.data.version }
            - call: "POST /cabling/pathway-segments"
              payload: { project_id: "${proj}", segment_code: "PS-N", pathway_type: "EMT_CONDUIT", usable_area_sq_mm: 573.0, length_m: 20.0, bend_count: 0, in_plenum_space: false }
              as: DesignEngineer
              captures: { seg_n: $.data.id, seg_n_v1: $.data.version }
            - call: "POST /cabling/links"
              payload: { project_id: "${proj}", telecom_room_id: "${room}", cable_type_id: "${ct_riser}", identifier: "TR01-A01", application: "DATA_HORIZONTAL", horizontal_length_m: 40.00, consolidation_point_stub_m: 0, patch_cord_allowance_m: 2.00 }
              as: DesignEngineer
              captures: { link: $.data.id }
          trigger:
            - call: "POST /cabling/link-routes"
              payload: { link_id: "${link}", pathway_segment_id: "${seg_p}", sequence_index: 1, expected_segment_version: "${seg_p_v1}" }
              as: DesignEngineer
              captures: { err: $.data.error_id }
            - call: "POST /cabling/link-routes"
              payload: { link_id: "${link}", pathway_segment_id: "${seg_n}", sequence_index: 1, expected_segment_version: "${seg_n_v1}" }
              as: DesignEngineer
              captures: { route_ok: $.data.id }
          assert:
            - "the plenum route returns 422 with data.error_id == \"ERR_PLENUM_RATING_REQUIRED\""
            - "GET /cabling/pathway-segments/${seg_p} still returns occupying_route_count == 0, fill_area_used_sq_mm == 0 and version == ${seg_p_v1}"
            - "the non-plenum route returns 201 with route_state == \"OCCUPYING\" and consumed_area_sq_mm == 49.02"
            - "GET /cabling/links/${link} returns routed_segment_count == 1"

      - name: application_must_be_listed_on_the_selected_cable_type
        claim_type: violation_to_error
        grounds:
          - validations[priority=160]
          - errors[ERR_APPLICATION_NOT_SUPPORTED]
        distinguishing_aspect: "The check reads the cable's approved application list, not the application enum: a CAMERA link on a cable approved for DATA_HORIZONTAL only is refused with 422, while the same CAMERA link on a cable whose applications include CAMERA is created."
        test_recipe:
          setup: ["Project RVT1 with room TR01, a DATA_HORIZONTAL-only cable type and a DATA_HORIZONTAL + CAMERA cable type"]
          setup_api_calls:
            - call: "POST /cabling/projects"
              payload: { name: "Riverside Tower Cabling", site_code: "RVT1", plenum_ceiling: true, identifier_scheme: "TIA_606_CLASS_1" }
              as: ProjectManager
              captures: { proj: $.data.id }
            - call: "POST /cabling/telecom-rooms"
              payload: { project_id: "${proj}", room_code: "TR01", floor: 3, branch_circuit_amps: 20, ups_capacity_va: 3000 }
              as: ProjectManager
              captures: { room: $.data.id }
            - call: "POST /cabling/cable-types"
              payload: { category: "CAT6A", jacket_rating: "CMP", outer_diameter_mm: 7.9, max_channel_length_m: 100.0, shielded: false, cost_per_meter_cents: 150, applications: ["DATA_HORIZONTAL"] }
              as: DesignEngineer
              captures: { ct_data: $.data.id }
            - call: "POST /cabling/cable-types"
              payload: { category: "CAT6A", jacket_rating: "CMP", outer_diameter_mm: 7.9, max_channel_length_m: 100.0, shielded: false, cost_per_meter_cents: 155, applications: ["DATA_HORIZONTAL", "CAMERA"] }
