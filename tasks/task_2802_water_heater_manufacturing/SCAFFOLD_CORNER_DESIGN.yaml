      - name: recall_scope_range_and_budget_guards_rejected
        claim_type: priority_ordering
        grounds:
          - validations[priority 21]
          - validations[priority 22]
          - validations[priority 31]
          - errors[ERR_SERIAL_RANGE_INVALID]
          - errors[ERR_RECALL_SCOPE_EMPTY]
          - errors[ERR_RECALL_BUDGET_EXCEEDED]
          - state_machines.RecallCampaign.SCOPED_to_CANCELLED
        distinguishing_aspect: >
          The range well-formedness check sits at priority 21, ABOVE the empty-population check at 22, which is
          the only ordering that makes ERR_SERIAL_RANGE_INVALID reachable at all - an inverted range always
          resolves an empty population, so a resolver that counts first can never report the real defect. The
          budget is separately enforced at ANNOUNCEMENT rather than at scoping, so an over-budget campaign
          legitimately rests in SCOPED with its cost stored, and cancelling keeps that snapshot.
