          - state_machines.NominationCycle.CLOSED_to_PRORATED
        distinguishing_aspect: |
          The degenerate divisor boundary of the same family: with an empty nomination set the
          proration_factor is the pinned literal 1.000000 rather than a division by zero, and the
          whole 100000 bbl effective capacity lands in unallocated_capacity_bbl while
          allocated_total_bbl and nominated_total_bbl both stay 0.
