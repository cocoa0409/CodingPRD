            - { call: "POST /api/event-sources", payload: { name: "Vendor Alpha", source_type: "VENDOR", reliability_weight: 10 }, as: DeskAdministrator, captures: { s1: $.data.id } }
            - { call: "POST /api/event-sources", payload: { name: "Vendor Beta", source_type: "VENDOR", reliability_weight: 5 }, as: DeskAdministrator, captures: { s2: $.data.id } }
            - { call: "POST /api/source-notifications", payload: { source_id: "${s1}", security_id: "${sec_id}", event_type: "RIGHTS_OFFERING", record_date: "2026-05-15", announced_terms: { rights_ratio_num: 1, rights_ratio_den: 1, subscription_price_cents: 400, shares_offered: 1000, oversubscription_allowed: true } }, as: VendorFeed, captures: { n1: $.data.id } }
            - { call: "POST /api/source-notifications", payload: { source_id: "${s2}", security_id: "${sec_id}", event_type: "RIGHTS_OFFERING", record_date: "2026-05-15", announced_terms: { rights_ratio_num: 1, rights_ratio_den: 1, subscription_price_cents: 400, shares_offered: 1000, oversubscription_allowed: true } }, as: VendorFeed, captures: { n2: $.data.id } }
            - call: "POST /api/events"
