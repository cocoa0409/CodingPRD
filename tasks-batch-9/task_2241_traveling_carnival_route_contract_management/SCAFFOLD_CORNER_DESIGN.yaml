          - errors[ERR_CREW_COVERAGE_INSUFFICIENT]
        distinguishing_aspect: |
          The readiness read is a pure projection of the first-match posture ladder: with the EVENT permit APPROVED
          across the run and state inspection not required, rungs 1 and 2 clear and rung 3 fires because
          0 scheduled RIDE_OPERATOR shifts is short of MIN_OPERATORS_PER_RIDE (1) times 1 COMMITTED allocation,
          so the read returns LABOR_HOLD with blocking_error_id ERR_CREW_COVERAGE_INSUFFICIENT, event_permit_ok
          true, inspections_ok true, crew_coverage_ok false. Booking one certified operator flips the same read to
