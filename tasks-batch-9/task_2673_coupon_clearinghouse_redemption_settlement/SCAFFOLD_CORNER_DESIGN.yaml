      - name: lot_adjudicator_cannot_resolve_the_dispute_over_that_lot
        claim_type: segregation_of_duties
        grounds:
          - validations.priority_9.ERR_SOD_VIOLATION
          - roles.FraudAnalyst
          - entities.SubmissionLot.fields.adjudicated_by_user_id
        distinguishing_aspect: |
          SoD wall 1 keys on the user id stored by finalize, not on the role: the
          analyst who rejected the lot is refused with 403 even though the
