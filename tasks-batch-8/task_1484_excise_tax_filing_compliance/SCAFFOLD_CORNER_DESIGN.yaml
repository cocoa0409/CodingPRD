# =============================================================================
# §1.9 Scaffold Corner Design — Excise Tax Filing & Compliance
# Breadth probe: every testable claim of §1.1–§1.7 not already covered by §1.8.
# Sections follow references/claim-extraction-guide.md. Every recipe starts from
# empty DB; logical clock default 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: registrant_create_applies_system_defaults
        claim_type: creation
        grounds: [entities.Registrant]
        distinguishing_aspect: "A registrant is created ACTIVE with zeroed computed balances, version 1, and created_at stamped from the logical clock default 2026-08-01T00:00:00Z."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /registrants", payload: { legal_name: "Acme Fuels", fein: "12-3456789" }, as: ComplianceAdmin, captures: { rgt: $.data.id, st: $.data.status, liab: $.data.aggregate_open_liability_cents, over: $.data.overpayment_balance_cents, ver: $.data.version, cat: $.data.created_at } }
          assert:
            - "status == ACTIVE; aggregate_open_liability_cents == 0; overpayment_balance_cents == 0; version == 1"
            - "id is a UUID with no type prefix; created_at == 2026-08-01T00:00:00.000Z (logical clock default, 3 fractional digits)"

      - name: registrant_create_missing_required_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Registrant.fields.fein, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required input fein yields 400 ERR_INVALID_REQUEST and creates nothing."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /registrants", payload: { legal_name: "No Fein Co" }, as: ComplianceAdmin, captures: { err: $.data.error_id } }
          assert:
            - "400 with error_id == ERR_INVALID_REQUEST"

      - name: registrant_create_computed_field_input_ignored
        claim_type: computed_fields
        grounds: [entities.Registrant.fields.overpayment_balance_cents]
        distinguishing_aspect: "A client-supplied value for a computed field is ignored: the response reports the computed default 0, not the injected 999."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /registrants", payload: { legal_name: "Acme Fuels", fein: "12-3456789", overpayment_balance_cents: 999 }, as: ComplianceAdmin, captures: { over: $.data.overpayment_balance_cents } }
          assert:
            - "overpayment_balance_cents == 0 (client input for a source:computed field is ignored)"

      - name: jurisdiction_create_invalid_enum_rejected
        claim_type: type_constraints
        grounds: [entities.Jurisdiction.fields.level, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "level: REGIONAL is not a declared enum member (FEDERAL|STATE|LOCAL) and is rejected 400."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /jurisdictions", payload: { code: "XX", name: "Nowhere", level: "REGIONAL", return_frequency: "MONTHLY", deposit_frequency: "MONTHLY" }, as: ComplianceAdmin, captures: { err: $.data.error_id } }
          assert:
            - "400 with error_id == ERR_INVALID_REQUEST"

      - name: return_get_missing_id_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but nonexistent UUID yields 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /returns/00000000-0000-0000-0000-000000000000", payload: {}, as: TaxAnalyst, captures: { err: $.data.error_id } }
          assert:
            - "404 with error_id == ERR_NOT_FOUND"

      - name: taxable_events_list_pagination_envelope
        claim_type: listing
        grounds: [response_envelope, entities.TaxableEvent]
        distinguishing_aspect: "List responses carry the fixed envelope: data array plus meta, with limit/offset/total_count/has_more honored (page 1 of 2 then remainder)."
        test_recipe:
          setup:
            - "CA-BOE; DIESEL@24300mc; ACTIVE registration; three DRAFT events created in order"
          setup_api_calls:
            - { call: "POST /jurisdictions", payload: { code: "CA-BOE", name: "California", level: "STATE", return_frequency: "MONTHLY", deposit_frequency: "SEMI_MONTHLY" }, as: ComplianceAdmin, captures: { jur: $.data.id } }
            - { call: "POST /product-classes", payload: { code: "DIESEL", description: "Diesel fuel", base_unit: "GALLON" }, as: ComplianceAdmin, captures: { pc_d: $.data.id } }
            - { call: "POST /tax-rates", payload: { jurisdiction_id: "${jur}", product_class_id: "${pc_d}", rate_millicents_per_unit: 24300, effective_from: "2026-01-01T00:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /registrants", payload: { legal_name: "Acme Fuels", fein: "12-3456789" }, as: ComplianceAdmin, captures: { rgt: $.data.id } }
            - { call: "POST /registrations", payload: { registrant_id: "${rgt}", jurisdiction_id: "${jur}", deposit_method: "SAFE_HARBOR" }, as: ComplianceAdmin, captures: { rgn: $.data.id } }
            - { call: "POST /bonds", payload: { registration_id: "${rgn}", surety_name: "SureCo", principal_amount_cents: 1500000, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-06-01T00:00:00Z" }, as: ComplianceAdmin, captures: { bnd: $.data.id } }
            - { call: "POST /bonds/${bnd}/activate", payload: {}, as: ComplianceAdmin }
            - { call: "POST /registrations/${rgn}/activate", payload: {}, as: ComplianceAdmin }
            - { call: "POST /taxable-events", payload: { registration_id: "${rgn}", jurisdiction_id: "${jur}", product_class_id: "${pc_d}", event_date: "2026-08-03T00:00:00Z", quantity_units: 1 }, as: TaxAnalyst }
            - { call: "POST /taxable-events", payload: { registration_id: "${rgn}", jurisdiction_id: "${jur}", product_class_id: "${pc_d}", event_date: "2026-08-04T00:00:00Z", quantity_units: 2 }, as: TaxAnalyst }
            - { call: "POST /taxable-events", payload: { registration_id: "${rgn}", jurisdiction_id: "${jur}", product_class_id: "${pc_d}", event_date: "2026-08-05T00:00:00Z", quantity_units: 3 }, as: TaxAnalyst }
          trigger:
            - { call: "GET /taxable-events", payload: { registration_id: "${rgn}", limit: 2, offset: 0 }, as: TaxAnalyst }
            - { call: "GET /taxable-events", payload: { registration_id: "${rgn}", limit: 2, offset: 2 }, as: TaxAnalyst }
          assert:
            - "Page 1: 2 items, total_count == 3, has_more == true"
            - "Page 2 (offset 2): 1 item, total_count == 3, has_more == false"
            - "Ordering is created_at ASC: page1 quantities [1, 2], page2 [3]"

      - name: movement_default_transit_deadline_applied
        claim_type: defaults
        grounds: [entities.BondedMovement.fields.transit_deadline_days]
        distinguishing_aspect: "Omitting transit_deadline_days applies the default 30 days; the sweep defaults the movement when now passes dispatched_at + 30 days."
        test_recipe:
          setup:
            - "CA-BOE; DIESEL@24300mc; ACTIVE registration; movement created without transit_deadline_days and dispatched at 2026-08-01"
          setup_api_calls:
            - { call: "POST /jurisdictions", payload: { code: "CA-BOE", name: "California", level: "STATE", return_frequency: "MONTHLY", deposit_frequency: "SEMI_MONTHLY" }, as: ComplianceAdmin, captures: { jur: $.data.id } }
            - { call: "POST /product-classes", payload: { code: "DIESEL", description: "Diesel fuel", base_unit: "GALLON" }, as: ComplianceAdmin, captures: { pc_d: $.data.id } }
            - { call: "POST /tax-rates", payload: { jurisdiction_id: "${jur}", product_class_id: "${pc_d}", rate_millicents_per_unit: 24300, effective_from: "2026-01-01T00:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /registrants", payload: { legal_name: "Acme Fuels", fein: "12-3456789" }, as: ComplianceAdmin, captures: { rgt: $.data.id } }
            - { call: "POST /registrations", payload: { registrant_id: "${rgt}", jurisdiction_id: "${jur}", deposit_method: "SAFE_HARBOR" }, as: ComplianceAdmin, captures: { rgn: $.data.id } }
            - { call: "POST /bonds", payload: { registration_id: "${rgn}", surety_name: "SureCo", principal_amount_cents: 1500000, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-06-01T00:00:00Z" }, as: ComplianceAdmin, captures: { bnd: $.data.id } }
            - { call: "POST /bonds/${bnd}/activate", payload: {}, as: ComplianceAdmin }
            - { call: "POST /registrations/${rgn}/activate", payload: {}, as: ComplianceAdmin }
            - { call: "POST /bonded-movements", payload: { registration_id: "${rgn}", bond_id: "${bnd}", product_class_id: "${pc_d}", quantity_units: 10, origin_facility: "T-A", destination_facility: "T-B" }, as: TaxAnalyst, captures: { mvt: $.data.id, ddl: $.data.transit_deadline_days } }
            - { call: "POST /bonded-movements/${mvt}/dispatch", payload: {}, as: TaxAnalyst }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-31T00:00:00Z" }, as: ComplianceAdmin }
            - { call: "GET /bonded-movements/${mvt}", payload: {}, as: TaxAnalyst, captures: { st30: $.data.status } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: ComplianceAdmin }
            - { call: "GET /bonded-movements/${mvt}", payload: {}, as: TaxAnalyst, captures: { st31: $.data.status } }
          assert:
            - "Created with transit_deadline_days == 30 (default applied)"
            - "At 2026-08-31 (exactly dispatched_at + 30 days, not yet past): status still IN_TRANSIT"
            - "At 2026-09-01 (past the deadline): status == DEFAULTED"

      - name: quarterly_period_key_derivation
        claim_type: computed_fields
        grounds: [entities.TaxableEvent.fields.period, entities.TaxReturn.fields.due_date]
        distinguishing_aspect: "For a QUARTERLY jurisdiction an event dated 2026-08-15 derives period 2026-Q3, and a manually created 2026-Q3 return has due_date 2026-10-25T00:00:00Z (first day after quarter end + 24 days)."
        test_recipe:
          setup:
            - "Jurisdiction OR-TX QUARTERLY + MONTHLY deposits; DIESEL@24300mc; ACTIVE MONTHLY-deposit registration"
          setup_api_calls:
            - { call: "POST /jurisdictions", payload: { code: "OR-TX", name: "Oregon", level: "STATE", return_frequency: "QUARTERLY", deposit_frequency: "MONTHLY" }, as: ComplianceAdmin, captures: { jur: $.data.id } }
            - { call: "POST /product-classes", payload: { code: "DIESEL", description: "Diesel fuel", base_unit: "GALLON" }, as: ComplianceAdmin, captures: { pc_d: $.data.id } }
            - { call: "POST /tax-rates", payload: { jurisdiction_id: "${jur}", product_class_id: "${pc_d}", rate_millicents_per_unit: 24300, effective_from: "2026-01-01T00:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /registrants", payload: { legal_name: "Acme Fuels", fein: "12-3456789" }, as: ComplianceAdmin, captures: { rgt: $.data.id } }
            - { call: "POST /registrations", payload: { registrant_id: "${rgt}", jurisdiction_id: "${jur}", deposit_method: "SAFE_HARBOR" }, as: ComplianceAdmin, captures: { rgn: $.data.id } }
            - { call: "POST /bonds", payload: { registration_id: "${rgn}", surety_name: "SureCo", principal_amount_cents: 1500000, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-06-01T00:00:00Z" }, as: ComplianceAdmin, captures: { bnd: $.data.id } }
            - { call: "POST /bonds/${bnd}/activate", payload: {}, as: ComplianceAdmin }
            - { call: "POST /registrations/${rgn}/activate", payload: {}, as: ComplianceAdmin }
          trigger:
            - { call: "POST /taxable-events", payload: { registration_id: "${rgn}", jurisdiction_id: "${jur}", product_class_id: "${pc_d}", event_date: "2026-08-15T00:00:00Z", quantity_units: 10 }, as: TaxAnalyst, captures: { per: $.data.period } }
            - { call: "POST /returns", payload: { registration_id: "${rgn}", jurisdiction_id: "${jur}", period: "2026-Q3" }, as: TaxAnalyst, captures: { due: $.data.due_date } }
          assert:
            - "Event period == 2026-Q3"
            - "Return due_date == 2026-10-25T00:00:00Z"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: certificate_verify_valid_transition
        claim_type: valid_transition
        grounds: [state_machines.ExemptionCertificate.PENDING_VERIFICATION_to_ACTIVE]
        distinguishing_aspect: "verify moves PENDING_VERIFICATION -> ACTIVE and stamps updated_at."
        test_recipe:
          setup: ["CA-BOE; registrant; registration; one PENDING_VERIFICATION certificate"]
          setup_api_calls:
            - { call: "POST /jurisdictions", payload: { code: "CA-BOE", name: "California", level: "STATE", return_frequency: "MONTHLY", deposit_frequency: "SEMI_MONTHLY" }, as: ComplianceAdmin, captures: { jur: $.data.id } }
            - { call: "POST /registrants", payload: { legal_name: "Acme Fuels", fein: "12-3456789" }, as: ComplianceAdmin, captures: { rgt: $.data.id } }
            - { call: "POST /registrations", payload: { registrant_id: "${rgt}", jurisdiction_id: "${jur}", deposit_method: "SAFE_HARBOR" }, as: ComplianceAdmin, captures: { rgn: $.data.id } }
            - { call: "POST /exemption-certificates", payload: { registration_id: "${rgn}", customer_reference: "CUST-1", certificate_type: "RESALE", valid_from: "2026-03-01T00:00:00Z", valid_to: "2026-12-31T00:00:00Z" }, as: TaxAnalyst, captures: { crt: $.data.id, st0: $.data.status } }
          trigger:
            - { call: "POST /exemption-certificates/${crt}/verify", payload: {}, as: TaxReviewer, captures: { st1: $.data.status } }
          assert:
            - "Initial status == PENDING_VERIFICATION (initial_state claim)"
            - "After verify: status == ACTIVE"

      - name: certificate_auto_expiry_on_clock_sweep
        claim_type: valid_transition
        grounds: [state_machines.ExemptionCertificate.ACTIVE_to_EXPIRED]
        distinguishing_aspect: "The clock sweep expires an ACTIVE certificate once current date passes valid_to (closed interval end)."
        test_recipe:
          setup: ["CA-BOE; registrant; registration; certificate verified ACTIVE with valid_to 2026-08-20"]
          setup_api_calls:
            - { call: "POST /jurisdictions", payload: { code: "CA-BOE", name: "California", level: "STATE", return_frequency: "MONTHLY", deposit_frequency: "SEMI_MONTHLY" }, as: ComplianceAdmin, captures: { jur: $.data.id } }
            - { call: "POST /registrants", payload: { legal_name: "Acme Fuels", fein: "12-3456789" }, as: ComplianceAdmin, captures: { rgt: $.data.id } }
            - { call: "POST /registrations", payload: { registrant_id: "${rgt}", jurisdiction_id: "${jur}", deposit_method: "SAFE_HARBOR" }, as: ComplianceAdmin, captures: { rgn: $.data.id } }
            - { call: "POST /exemption-certificates", payload: { registration_id: "${rgn}", customer_reference: "CUST-1", certificate_type: "RESALE", valid_from: "2026-03-01T00:00:00Z", valid_to: "2026-08-20T00:00:00Z" }, as: TaxAnalyst, captures: { crt: $.data.id } }
            - { call: "POST /exemption-certificates/${crt}/verify", payload: {}, as: TaxReviewer }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: ComplianceAdmin }
            - { call: "GET /exemption-certificates/${crt}", payload: {}, as: TaxAnalyst, captures: { st_on: $.data.status } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-21T00:00:00Z" }, as: ComplianceAdmin }
            - { call: "GET /exemption-certificates/${crt}", payload: {}, as: TaxAnalyst, captures: { st_after: $.data.status } }
          assert:
            - "On valid_to itself (2026-08-20): still ACTIVE (closed interval)"
            - "One day later: EXPIRED"

      - name: bond_expiry_flips_registration_bond_deficient
        claim_type: side_effect_execution
        grounds: [state_machines.Bond.ACTIVE_to_EXPIRED, state_machines.Registration.ACTIVE_to_BOND_DEFICIENT]
        distinguishing_aspect: "Bond expiry by clock sweep recomputes coverage (1500000 -> 0) and flips the ACTIVE registration to BOND_DEFICIENT; bond-status read shows deficient == true."
        test_recipe:
          setup: ["CA-BOE; ACTIVE registration whose only bond has effective_to 2026-08-20"]
          setup_api_calls:
            - { call: "POST /jurisdictions", payload: { code: "CA-BOE", name: "California", level: "STATE", return_frequency: "MONTHLY", deposit_frequency: "SEMI_MONTHLY" }, as: ComplianceAdmin, captures: { jur: $.data.id } }
            - { call: "POST /registrants", payload: { legal_name: "Acme Fuels", fein: "12-3456789" }, as: ComplianceAdmin, captures: { rgt: $.data.id } }
            - { call: "POST /registrations", payload: { registrant_id: "${rgt}", jurisdiction_id: "${jur}", deposit_method: "SAFE_HARBOR" }, as: ComplianceAdmin, captures: { rgn: $.data.id } }
            - { call: "POST /bonds", payload: { registration_id: "${rgn}", surety_name: "SureCo", principal_amount_cents: 1500000, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-08-20T00:00:00Z" }, as: ComplianceAdmin, captures: { bnd: $.data.id } }
            - { call: "POST /bonds/${bnd}/activate", payload: {}, as: ComplianceAdmin }
            - { call: "POST /registrations/${rgn}/activate", payload: {}, as: ComplianceAdmin }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-21T00:00:00Z" }, as: ComplianceAdmin }
            - { call: "GET /bonds/${bnd}", payload: {}, as: ComplianceAdmin, captures: { bst: $.data.status } }
            - { call: "GET /registrations/${rgn}/bond-status", payload: {}, as: ComplianceAdmin, captures: { cov: $.data.bond_coverage_cents, def_: $.data.deficient } }
            - { call: "GET /registrations/${rgn}", payload: {}, as: ComplianceAdmin, captures: { rst: $.data.status } }
          assert:
            - "Bond status == EXPIRED"
            - "bond_coverage_cents == 0 and deficient == true"
            - "Registration status == BOND_DEFICIENT"

      - name: deposit_marked_late_by_sweep
        claim_type: valid_transition
        grounds: [state_machines.Deposit.SCHEDULED_to_LATE]
        distinguishing_aspect: "An unpaid deposit flips SCHEDULED -> LATE only when the sweep date passes its due_date (2026-08-25), not on the due date itself."
        test_recipe:
          setup: ["CA-BOE; DIESEL@24300mc; ACTIVE registration; 2026-08 return auto-created (depA due 2026-08-25)"]
          setup_api_calls:
            - { call: "POST /jurisdictions", payload: { code: "CA-BOE", name: "California", level: "STATE", return_frequency: "MONTHLY", deposit_frequency: "SEMI_MONTHLY" }, as: ComplianceAdmin, captures: { jur: $.data.id } }
            - { call: "POST /product-classes", payload: { code: "DIESEL", description: "Diesel fuel", base_unit: "GALLON" }, as: ComplianceAdmin, captures: { pc_d: $.data.id } }
            - { call: "POST /tax-rates", payload: { jurisdiction_id: "${jur}", product_class_id: "${pc_d}", rate_millicents_per_unit: 24300, effective_from: "2026-01-01T00:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /registrants", payload: { legal_name: "Acme Fuels", fein: "12-3456789" }, as: ComplianceAdmin, captures: { rgt: $.data.id } }
            - { call: "POST /registrations", payload: { registrant_id: "${rgt}", jurisdiction_id: "${jur}", deposit_method: "SAFE_HARBOR" }, as: ComplianceAdmin, captures: { rgn: $.data.id } }
            - { call: "POST /bonds", payload: { registration_id: "${rgn}", surety_name: "SureCo", principal_amount_cents: 1500000, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-06-01T00:00:00Z" }, as: ComplianceAdmin, captures: { bnd: $.data.id } }
            - { call: "POST /bonds/${bnd}/activate", payload: {}, as: ComplianceAdmin }
            - { call: "POST /registrations/${rgn}/activate", payload: {}, as: ComplianceAdmin }
            - { call: "POST /taxable-events", payload: { registration_id: "${rgn}", jurisdiction_id: "${jur}", product_class_id: "${pc_d}", event_date: "2026-08-03T00:00:00Z", quantity_units: 100 }, as: TaxAnalyst, captures: { ev: $.data.id } }
            - { call: "POST /taxable-events/${ev}/classify", payload: {}, as: TaxAnalyst }
            - { call: "POST /taxable-events/${ev}/rate", payload: {}, as: TaxAnalyst }
            - { call: "GET /deposits", payload: { registration_id: "${rgn}", period: "2026-08" }, as: TaxAnalyst, captures: { depA: "$.data[0].id" } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-25T00:00:00Z" }, as: ComplianceAdmin }
            - { call: "GET /deposits/${depA}", payload: {}, as: TaxAnalyst, captures: { st_on: $.data.status } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-26T00:00:00Z" }, as: ComplianceAdmin }
            - { call: "GET /deposits/${depA}", payload: {}, as: TaxAnalyst, captures: { st_after: $.data.status } }
          assert:
            - "On due_date: status still SCHEDULED (late only when current date > due_date)"
            - "Next day: status == LATE"

      - name: rate_scheduled_to_active_on_sweep
        claim_type: valid_transition
        grounds: [state_machines.TaxRate.SCHEDULED_to_ACTIVE]
        distinguishing_aspect: "A future-dated rate is SCHEDULED at creation and the sweep flips it to ACTIVE exactly at effective_from."
        test_recipe:
          setup: ["CA-BOE; class GASOLINE with no prior rate; new rate effective 2026-09-01"]
          setup_api_calls:
            - { call: "POST /jurisdictions", payload: { code: "CA-BOE", name: "California", level: "STATE", return_frequency: "MONTHLY", deposit_frequency: "SEMI_MONTHLY" }, as: ComplianceAdmin, captures: { jur: $.data.id } }
            - { call: "POST /product-classes", payload: { code: "GASOLINE", description: "Gasoline", base_unit: "GALLON" }, as: ComplianceAdmin, captures: { pc_g: $.data.id } }
            - { call: "POST /tax-rates", payload: { jurisdiction_id: "${jur}", product_class_id: "${pc_g}", rate_millicents_per_unit: 41100, effective_from: "2026-09-01T00:00:00Z" }, as: ComplianceAdmin, captures: { rate: $.data.id, st0: $.data.status } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: ComplianceAdmin }
            - { call: "GET /tax-rates/${rate}", payload: {}, as: ComplianceAdmin, captures: { st1: $.data.status } }
          assert:
            - "At creation (clock 2026-08-01 < effective_from): status == SCHEDULED"
            - "After clock reaches 2026-09-01: status == ACTIVE"

      - name: file_draft_return_rejected
        claim_type: invalid_transition
        grounds: [state_machines.TaxReturn, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "file is only valid from SUBMITTED; a DRAFT return rejects with 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["CA-BOE; DIESEL@24300mc; ACTIVE registration; one rated event -> DRAFT return"]
          setup_api_calls:
            - { call: "POST /jurisdictions", payload: { code: "CA-BOE", name: "California", level: "STATE", return_frequency: "MONTHLY", deposit_frequency: "SEMI_MONTHLY" }, as: ComplianceAdmin, captures: { jur: $.data.id } }
            - { call: "POST /product-classes", payload: { code: "DIESEL", description: "Diesel fuel", base_unit: "GALLON" }, as: ComplianceAdmin, captures: { pc_d: $.data.id } }
            - { call: "POST /tax-rates", payload: { jurisdiction_id: "${jur}", product_class_id: "${pc_d}", rate_millicents_per_unit: 24300, effective_from: "2026-01-01T00:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /registrants", payload: { legal_name: "Acme Fuels", fein: "12-3456789" }, as: ComplianceAdmin, captures: { rgt: $.data.id } }
