    roles: [TeamLeader, TeamAdmin]
    code: 201
    input: ["agent_id?"]
    output: Assignment
    side_effects: ["old assignment -> REASSIGNED with outcome_reason MANUAL", "successor created with supersedes_assignment_id", "lead claim_deadline_at refreshed", "agent capacity/last_assigned_at updated"]

