          assert:
            - "error_id == ERR_AUTH_REQUEST_NOT_FOUND, http 404"
      - name: duplicate_policy_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=20]"
          - "errors[ERR_DUPLICATE_POLICY]"
        distinguishing_aspect: "A second PayerPolicy with the same (payer_code, drug_code) pair is rejected with ERR_DUPLICATE_POLICY (409); a different drug_code succeeds."
        test_recipe:
          setup: ["Policy PAYERX/J9140 exists"]
          setup_api_calls:
            - { call: "POST /infusion/payer-policies", payload: { payer_code: "PAYERX", drug_code: "J9140", regimen_name: "Dup", benefit_channel: "MEDICAL", validity_days: 90, max_course_days: 60, max_dose_mg: 1000, deductible_cents: 100000, coinsurance_pct: 0.20, oop_max_cents: 500000, prepay_limit_cents: 250000 }, as: PolicyAdmin, as_user_id: "admin-1" }
          trigger:
            - { call: "POST /infusion/payer-policies", payload: { payer_code: "PAYERX", drug_code: "J9140", regimen_name: "Dup2", benefit_channel: "MEDICAL", validity_days: 30, max_course_days: 30, max_dose_mg: 500, deductible_cents: 0, coinsurance_pct: 0.10, oop_max_cents: 100000, prepay_limit_cents: 50000 }, as: PolicyAdmin, as_user_id: "admin-1", captures: { err_dp: $.data.error_id } }
            - { call: "POST /infusion/payer-policies", payload: { payer_code: "PAYERX", drug_code: "J9141", regimen_name: "Ok", benefit_channel: "MEDICAL", validity_days: 90, max_course_days: 60, max_dose_mg: 1000, deductible_cents: 100000, coinsurance_pct: 0.20, oop_max_cents: 500000, prepay_limit_cents: 250000 }, as: PolicyAdmin, as_user_id: "admin-1", captures: { ok_dp: $.data.id } }
          assert:
