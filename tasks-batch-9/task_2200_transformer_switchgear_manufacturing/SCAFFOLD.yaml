  # --- FailureAnalysisReport ------------------------------------------------
  - id: create_failure_analysis_report
    method: POST
    path: "/warranty-claims/{id}/failure-analysis-reports"
    description: "Open a DRAFT failure analysis on a received unit; moves the claim to ANALYSIS_IN_PROGRESS"
    roles: [QualityEngineer]
    code: 201
    input: ["attributed_supplier_id?", root_cause_code, authored_by_user_id, quarantine_recommended, defect_weight]
    output: FailureAnalysisReport
    side_effects: ["status := DRAFT", "claim.status := ANALYSIS_IN_PROGRESS"]
  - id: list_claim_failure_analysis_reports
    method: GET
    path: "/warranty-claims/{id}/failure-analysis-reports"
    description: "Reverse-reachability list of a claim's analysis reports"
    roles: [QualityEngineer, ContractAdmin, PlantAdmin, MaterialsPlanner]
    code: 200
    input: ["status?", "root_cause_code?", "limit?", "offset?"]
    output: FailureAnalysisReport[]
    side_effects: []
  - id: list_failure_analysis_reports
    method: GET
    path: "/failure-analysis-reports"
    description: "Filtered list resolving both the claim and attributed-supplier FKs"
    roles: [QualityEngineer, ContractAdmin, PlantAdmin, MaterialsPlanner]
    code: 200
    input: ["warranty_claim_id?", "attributed_supplier_id?", "status?", "root_cause_code?", "quarantine_recommended?", "limit?", "offset?"]
    output: FailureAnalysisReport[]
    side_effects: []
  - id: get_failure_analysis_report
    method: GET
    path: "/failure-analysis-reports/{id}"
    description: "Read one failure analysis report"
    roles: [QualityEngineer, ContractAdmin, PlantAdmin, MaterialsPlanner]
    code: 200
    input: []
    output: FailureAnalysisReport
    side_effects: []
  - id: publish_failure_analysis_report
    method: POST
    path: "/failure-analysis-reports/{id}/publish"
    description: "DRAFT -> PUBLISHED; decides the claim, scores the supplier and may quarantine the component"
    roles: [QualityEngineer]
    code: 200
    input: []
    output: FailureAnalysisReport
    side_effects: ["status := PUBLISHED, published_at := logical clock", "claim -> WARRANTABLE for SUPPLIER_DEFECT/WORKMANSHIP, else NON_WARRANTABLE", "run calc supplier_quality_index (TRAILING and LIFETIME); supplier may enter PROBATION", "quarantine_recommended true sets LongLeadComponent -> QUARANTINED and PREEMPTS that component's non-terminal allocations", "increments LongLeadComponent.version by 1"]
  - id: retract_failure_analysis_report
    method: POST
    path: "/failure-analysis-reports/{id}/retract"
    description: "DRAFT or PUBLISHED -> RETRACTED (terminal); reverses the claim decision and the supplier score"
    roles: [QualityEngineer, PlantAdmin]
    code: 200
    input: [retraction_reason]
    output: FailureAnalysisReport
    side_effects: ["status := RETRACTED", "the deciding claim reverts to ANALYSIS_IN_PROGRESS with analysis_round increased by 1 and credit_issued_cents := 0", "re-run calc supplier_quality_index; supplier may return to APPROVED"]

# =============================================================================
# 1.6 ERROR CODE CATALOG
# =============================================================================
errors:

  # --- authentication / authorization ---------------------------------------
  - id: ERR_MISSING_AUTH_HEADER
    http: 401
    condition: "X-User-ID or X-User-Role header absent or empty"
  - id: ERR_UNKNOWN_ROLE
    http: 401
    condition: "X-User-Role is not one of the 13 declared roles, or an entity_backed role's X-User-ID does not resolve to a live row of its backing entity"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "acting role is not listed in the endpoint's roles"
  - id: ERR_NOT_ORDER_OWNER
    http: 403
    condition: "acting SalesEngineer's X-User-ID differs from EngineeredOrder.owning_sales_user_id"
  - id: ERR_WITNESS_IDENTITY_MISMATCH
    http: 403
    condition: "acting CustomerWitness's X-User-ID differs from WitnessAssignment.witness_party_id"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the acting user already performed the paired upstream step (author vs reviewer, generator vs verifier, resolver vs closer, preparer vs accepter)"

  # --- existence ------------------------------------------------------------
  - id: ERR_ORDER_NOT_FOUND
    http: 404
    condition: "no EngineeredOrder matches the path id or engineered_order_id"
  - id: ERR_DRAWING_NOT_FOUND
    http: 404
    condition: "no SubmittalDrawing matches the path id, submittal_drawing_id or supersedes_drawing_id"
  - id: ERR_CLAUSE_NOT_FOUND
    http: 404
    condition: "no EscalationClause matches the path id or escalation_clause_id on the order in scope"
  - id: ERR_ADJUSTMENT_NOT_FOUND
    http: 404
    condition: "no EscalationAdjustment matches the path id"
  - id: ERR_INDEX_POINT_NOT_FOUND
    http: 404
    condition: "no CommodityIndexPoint matches the path id"
  - id: ERR_SUPPLIER_NOT_FOUND
    http: 404
    condition: "no Supplier matches the path id or attributed_supplier_id"
  - id: ERR_COMPONENT_NOT_FOUND
    http: 404
    condition: "no LongLeadComponent matches the path id, long_lead_component_id or suspect_component_id"
  - id: ERR_ALLOCATION_NOT_FOUND
    http: 404
    condition: "no ComponentAllocation matches the path id or preempted_for_allocation_id"
  - id: ERR_TEST_BAY_NOT_FOUND
    http: 404
    condition: "no TestBay matches the path id or test_bay_id"
  - id: ERR_FAT_NOT_FOUND
    http: 404
    condition: "no FactoryAcceptanceTest matches the path id, factory_acceptance_test_id or retest_of_fat_id"
  - id: ERR_WITNESS_PARTY_NOT_FOUND
    http: 404
    condition: "no WitnessParty matches the path id or witness_party_id"
  - id: ERR_WITNESS_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "no WitnessAssignment matches the path id"
  - id: ERR_TEST_REPORT_NOT_FOUND
    http: 404
    condition: "no TestReport matches the path id or test_report_id"
  - id: ERR_LABEL_NOT_FOUND
    http: 404
    condition: "no ComplianceLabel matches the path id"
  - id: ERR_SHIPMENT_NOT_FOUND
    http: 404
    condition: "no ShipmentRelease matches the path id or shipment_release_id"
  - id: ERR_STORAGE_AGREEMENT_NOT_FOUND
    http: 404
    condition: "no SiteStorageAgreement matches the path id"
  - id: ERR_COMMISSIONING_JOB_NOT_FOUND
    http: 404
    condition: "no CommissioningJob matches the path id or commissioning_job_id"
  - id: ERR_PUNCH_ITEM_NOT_FOUND
    http: 404
    condition: "no PunchListItem matches the path id"
  - id: ERR_WARRANTY_CLAIM_NOT_FOUND
    http: 404
    condition: "no WarrantyClaim matches the path id or warranty_claim_id"
  - id: ERR_FAILURE_REPORT_NOT_FOUND
    http: 404
    condition: "no FailureAnalysisReport matches the path id"

  # --- payload shape / pagination -------------------------------------------
  - id: ERR_MISSING_REQUIRED_FIELD
    http: 422
    condition: "a required body field is absent or null"
  - id: ERR_FIELD_TYPE_INVALID
    http: 422
    condition: "a body field has the wrong JSON type for its declared entity type"
  - id: ERR_ENUM_VALUE_INVALID
    http: 422
    condition: "an enum-valued input falls outside its declared domain"
  - id: ERR_FIELD_VALUE_OUT_OF_RANGE
    http: 422
    condition: "a numeric input violates its declared range (non-positive quantity, basis points outside 0..10000, etc.)"
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit outside 1..100 or offset negative"

  # --- optimistic concurrency ----------------------------------------------
  - id: ERR_STALE_ORDER_VERSION
    http: 412
    condition: "expected_engineered_order_version does not equal the current EngineeredOrder.version"
  - id: ERR_STALE_COMPONENT_VERSION
    http: 412
    condition: "expected_component_version does not equal the current LongLeadComponent.version"

  # --- state preconditions -------------------------------------------------
  - id: ERR_TERMINAL_STATE
    http: 409
    condition: "the target row already sits in a terminal state for the dimension being mutated"
  - id: ERR_INVALID_STATE_TRANSITION
    http: 409
    condition: "the target row's current status is not a legal source state for the requested transition"
  - id: ERR_ORDER_CANCELLED
    http: 409
    condition: "the owning EngineeredOrder.fulfillment_status is CANCELLED"
  - id: ERR_ORDER_FULFILLMENT_STATE_INVALID
    http: 409
    condition: "the owning order's fulfillment_status is not a legal source state for the requested fulfillment advance"
  - id: ERR_DESIGN_NOT_RELEASED
    http: 409
    condition: "the operation requires engineering_status == DESIGN_RELEASED but the order has not released its drawings"
  - id: ERR_ENGINEERING_CLOSED
    http: 409
    condition: "the order's engineering_status is ENG_CLOSED so no further submittal activity is admitted"
  - id: ERR_POSTURE_BLOCKED
    http: 409
    condition: "EngineeredOrder.production_posture is RESTRICTED or FROZEN and blocks this child mutation; posture_reason_codes are echoed"
  - id: ERR_FAT_NOT_ADMINISTRABLE
    http: 409
    condition: "the parent FactoryAcceptanceTest has advanced past witness administration (IN_PROGRESS, PASSED, FAILED or ABANDONED)"

  # --- safety / compliance --------------------------------------------------
  - id: ERR_ARC_ENERGY_UNLABELABLE
    http: 422
    condition: "computed incident_energy_cal_cm2 is at or above 40.0 cal/cm2 so no arc-flash label may be produced"
  - id: ERR_LABEL_STALE
    http: 409
    condition: "ComplianceLabel.pinned_drawing_revision no longer equals EngineeredOrder.released_drawing_revision"
  - id: ERR_LABEL_NOT_ISSUED
    http: 409
    condition: "no ComplianceLabel on the order is in status ISSUED"
  - id: ERR_TEST_REPORT_NOT_ISSUED
    http: 409
    condition: "the referenced TestReport is not ISSUED or does not carry pass_result true"
  - id: ERR_TEST_REPORT_INCOMPLETE
    http: 422
    condition: "a mandatory measured criterion is missing, including impulse_withstand_kv when the test requires_impulse"
  - id: ERR_BAY_KV_INSUFFICIENT
    http: 422
    condition: "order.rated_kv exceeds TestBay.max_kv"
  - id: ERR_BAY_IMPULSE_UNSUPPORTED
    http: 422
    condition: "the test requires_impulse but the chosen bay has supports_impulse false"
  - id: ERR_BAY_UNAVAILABLE
    http: 409
    condition: "the chosen TestBay.status is not AVAILABLE"
  - id: ERR_WITNESS_CREDENTIAL_EXPIRED
    http: 422
    condition: "WitnessParty.credential_expires_at is not after the test window start, or the party status is CREDENTIAL_EXPIRED or INACTIVE"
  - id: ERR_BLOCKING_PUNCH_OPEN
    http: 409
    condition: "CommissioningJob.blocking_punch_count is greater than zero at an energization step"
  - id: ERR_COMPONENT_QUARANTINED
    http: 409
    condition: "the LongLeadComponent.status is QUARANTINED or OBSOLETE"
  - id: ERR_SUPPLIER_SUSPENDED
    http: 409
    condition: "the owning Supplier.status is SUSPENDED"

  # --- constraint satisfaction ---------------------------------------------
  - id: ERR_DUPLICATE_ORDER_NUMBER
    http: 409
    condition: "another EngineeredOrder already uses this order_number"
  - id: ERR_DUPLICATE_CODE
    http: 409
    condition: "supplier_code, party_code, bay_code, part_number within a supplier, or claim_number is already taken in its scope"
  - id: ERR_DUPLICATE_INDEX_POINT
    http: 409
    condition: "a CommodityIndexPoint already exists for this (commodity, index_month) pair"
  - id: ERR_CLAUSE_ALREADY_EXISTS
    http: 409
    condition: "the order already carries an EscalationClause"
  - id: ERR_REVISION_ROUND_CONFLICT
    http: 409
    condition: "a sibling SubmittalDrawing on the order is still in DRAFT, SUBMITTED or UNDER_REVIEW"
  - id: ERR_DRAWING_REVISION_NOT_LATEST
    http: 409
    condition: "the drawing is not the highest revision_round on its order"
  - id: ERR_BAY_WINDOW_CONFLICT
    http: 409
    condition: "the requested bay window overlaps another non-terminal test's window plus changeover_buffer_hours"
  - id: ERR_WITNESS_ALREADY_ASSIGNED
    http: 409
    condition: "a non-terminal WitnessAssignment already pairs this test with this witness party"
  - id: ERR_WITNESS_TRAVEL_BLACKOUT
    http: 422
    condition: "the assignment's travel_region or blackout_days exclude a calendar day of the test window"
  - id: ERR_RETEST_PREDECESSOR_NOT_FAILED
    http: 409
    condition: "retest_of_fat_id does not name a FAILED test on the same order, or another non-terminal test already exists on that order"
  - id: ERR_STAGE_SHARE_TOTAL_INVALID
    http: 422
    condition: "the stage_share_bp of non-CANCELLED shipment releases on the order does not total exactly 10000"
  - id: ERR_MULTIPLE_FINAL_STAGES
    http: 409
    condition: "a second ShipmentRelease on the order sets is_final_stage true"
  - id: ERR_STAGE_INDEX_OUT_OF_SEQUENCE
    http: 409
    condition: "stage_index duplicates or skips a value, or an earlier stage has not yet reached IN_TRANSIT, DELIVERED or CANCELLED"

  # --- temporal -------------------------------------------------------------
  - id: ERR_INDEX_WINDOW_INVALID
    http: 422
    condition: "base_index_month is not strictly earlier than final_window_end_month"
  - id: ERR_INDEX_POINT_MISSING
    http: 422
    condition: "no usable CommodityIndexPoint exists for the base_index_month of a weighted commodity"
  - id: ERR_INDEX_WINDOW_EMPTY
    http: 422
    condition: "the FINAL variant window contains no usable non-provisional index point for a weighted commodity"
  - id: ERR_TEST_WINDOW_INVALID
    http: 422
    condition: "window_end_at is not strictly after window_start_at or is inconsistent with test_duration_hours"
  - id: ERR_NEED_BY_DATE_PASSED
    http: 422
    condition: "an allocation's need_by_date is earlier than the logical clock"
  - id: ERR_STORAGE_PERIOD_INVALID
    http: 422
    condition: "storage_end_at is not strictly after storage_start_at, or storage_start_at precedes the stage being staged"
  - id: ERR_WARRANTY_WINDOW_UNAVAILABLE
    http: 409
    condition: "no COMPLETE CommissioningJob on the order can anchor the warranty window"
  - id: ERR_WARRANTY_WINDOW_EXPIRED
    http: 409
    condition: "failure_reported_at is at or after the computed warranty expiry instant"

  # --- capacity / quota / fiscal -------------------------------------------
  - id: ERR_COMPONENT_INSUFFICIENT
    http: 409
    condition: "requested quantity exceeds LongLeadComponent.quantity_available and no allocation row is created"
  - id: ERR_WITNESS_DAY_CAPACITY
    http: 409
    condition: "confirming would push a witness party above daily_witness_capacity on some day of the window"
  - id: ERR_PREEMPTION_NOT_PERMITTED
    http: 409
    condition: "no admissible lower-priority victim set exists, so the higher-priority allocation cannot be satisfied by preemption"
  - id: ERR_ESCALATION_ADJUSTMENT_IN_FLIGHT
    http: 409
    condition: "another adjustment on the same clause is SUBMITTED_TO_CUSTOMER, DISPUTED or RECALCULATING"
  - id: ERR_WARRANTY_CAP_EXCEEDED
    http: 422
    condition: "the requested credit exceeds WarrantyClaim.liability_cap_cents"
  - id: ERR_CONSEQUENTIAL_NOT_COVERED
    http: 422
    condition: "consequential_claim_cents is non-zero while consequential_covered is false"
  - id: ERR_BILLING_EXCEEDS_CONTRACT
    http: 409
    condition: "billed_to_date_cents plus this stage's stage_billing_cents would exceed net_contract_value_cents"
  - id: ERR_RELEASE_PENALTY_UNBILLABLE
    http: 409
    condition: "a COMMITTED allocation carrying a release penalty cannot be released because the owning order is already CLOSED"

# =============================================================================
# 1.7 RBAC MATRIX
# =============================================================================
# Role model: segregation_of_duties. Four segregated pairs are enforced by
# validation priority 5: DesignEngineer authors / CustomerReviewer dispositions,
# ComplianceOfficer generates / QualityEngineer verifies a label,
# FieldServiceEngineer resolves / QualityEngineer or CustomerReviewer closes a
# punch item, ContractAdmin prepares / CustomerReviewer accepts an escalation.
# Only CustomerWitness is entity_backed; every other role is an opaque plant or
# customer-side operator identifier.
roles:

  - name: PlantAdmin
    description: "Plant superuser: master data, logical clock, supplier suspension, order cancellation and forced abandonment"
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /suppliers/{id}/suspend"
      - "PATCH /test-bays/{id}"
      - "PATCH /commodity-index-points/{id} (shared with ContractAdmin)"
    shared_operations:
      - "POST /engineered-orders and PATCH /engineered-orders/{id}"
      - "POST /engineered-orders/{id}/cancel"
      - "POST /engineered-orders/{id}/close-engineering"
      - "POST /suppliers, POST /suppliers/{id}/long-lead-components, POST /long-lead-components/{id}/obsolete"
      - "POST /test-bays, POST /witness-parties, PATCH /witness-parties/{id}"
      - "POST /factory-acceptance-tests/{id}/abandon, POST /witness-assignments/{id}/waive"
      - "POST /commissioning-jobs (create) and POST /commissioning-jobs/{id}/cancel"
      - "POST /failure-analysis-reports/{id}/retract"
      - "every GET in the catalog"

  - name: SalesEngineer
    description: "Owns the commercial relationship for the orders it books; read-mostly after handoff"
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /engineered-orders"
      - "GET /engineered-orders and GET /engineered-orders/{id}"
      - "GET /engineered-orders/{id}/financial-summary"
      - "GET /engineered-orders/{id}/escalation-clauses, GET /escalation-clauses/{id}, GET /escalation-adjustments"
      - "GET /commodity-index-points"
      - "GET /engineered-orders/{id}/shipment-releases, GET /shipment-releases/{id}"
      - "GET /shipment-releases/{id}/site-storage-agreements, GET /site-storage-agreements/{id}"

  - name: DesignEngineer
    description: "Authors submittal drawing revisions and closes engineering; never dispositions its own work"
    identity: "opaque"
    exclusive_operations:
      - "POST /engineered-orders/{id}/submittal-drawings"
      - "POST /submittal-drawings/{id}/submit"
    shared_operations:
      - "POST /engineered-orders/{id}/close-engineering"
      - "GET /engineered-orders, GET /engineered-orders/{id}"
      - "GET /engineered-orders/{id}/submittal-drawings, GET /submittal-drawings, GET /submittal-drawings/{id}"

  - name: ContractAdmin
    description: "Commercial administration: escalation clauses and adjustments, index publication, staged billing, warranty settlement"
    identity: "opaque"
    exclusive_operations:
      - "POST /engineered-orders/{id}/escalation-clauses"
      - "POST /engineered-orders/{id}/escalation-adjustments"
      - "POST /escalation-adjustments/{id}/submit"
      - "POST /escalation-adjustments/{id}/recalculate"
      - "POST /escalation-adjustments/{id}/withdraw"
      - "POST /warranty-claims/{id}/settle"
    shared_operations:
      - "POST /engineered-orders, PATCH /engineered-orders/{id}, POST /engineered-orders/{id}/cancel"
      - "POST /commodity-index-points, PATCH /commodity-index-points/{id}"
      - "POST /engineered-orders/{id}/shipment-releases"
      - "POST /site-storage-agreements/{id}/waive"
      - "POST /engineered-orders/{id}/warranty-claims, POST /warranty-claims/{id}/issue-rma, POST /warranty-claims/{id}/reject"
      - "read access across orders, drawings, escalation, shipments, commissioning and warranty"

  - name: MaterialsPlanner
    description: "Owns long-lead component stock, allocation, preemption and the material-readiness gate into production"
    identity: "opaque"
    exclusive_operations:
      - "POST /component-allocations"
      - "POST /component-allocations/{id}/commit"
      - "POST /component-allocations/{id}/release"
      - "POST /long-lead-components/{id}/receipts"
      - "POST /engineered-orders/{id}/start-production"
    shared_operations:
      - "POST /suppliers/{id}/long-lead-components, POST /long-lead-components/{id}/obsolete"
      - "POST /suppliers/{id}/receipt-events"
      - "POST /warranty-claims/{id}/receive-unit"
      - "GET on suppliers, components, allocations, warranty claims and failure analysis reports"

  - name: TestEngineer
    description: "Schedules and runs factory acceptance tests, records measured results as draft reports"
    identity: "opaque"
    exclusive_operations:
      - "POST /factory-acceptance-tests/{id}/schedule"
      - "POST /factory-acceptance-tests/{id}/start"
      - "POST /factory-acceptance-tests/{id}/test-reports"
    shared_operations:
      - "POST /factory-acceptance-tests, POST /factory-acceptance-tests/{id}/conclude, POST /factory-acceptance-tests/{id}/abandon"
      - "POST /test-bays"
      - "GET on orders, bays, bay schedules, tests, witness parties, witness loads, assignments and test reports"

  - name: WitnessCoordinator
    description: "Administers witness parties and their invitations to factory acceptance tests"
    identity: "opaque"
    exclusive_operations:
      - "POST /factory-acceptance-tests/{id}/witness-assignments"
      - "POST /witness-assignments/{id}/reinvite"
    shared_operations:
      - "POST /witness-parties, PATCH /witness-parties/{id}"
      - "POST /witness-assignments/{id}/confirm, POST /witness-assignments/{id}/decline (on behalf of a party)"
      - "POST /witness-assignments/{id}/waive"
      - "GET on orders, bays, bay schedules, tests, witness parties, witness loads and assignments"

  - name: CustomerWitness
    description: "Customer or third-party witness acting for one WitnessParty; confirms or declines its own invitations only"
    identity: "entity_backed:WitnessParty"
    exclusive_operations: []
    shared_operations:
      - "POST /witness-assignments/{id}/confirm and POST /witness-assignments/{id}/decline for assignments whose witness_party_id equals X-User-ID"
      - "GET /engineered-orders/{id}, GET /factory-acceptance-tests, GET /factory-acceptance-tests/{id}"
      - "GET /witness-parties/{id}, GET /factory-acceptance-tests/{id}/witness-assignments, GET /witness-assignments, GET /witness-assignments/{id}"
      - "GET /factory-acceptance-tests/{id}/test-reports, GET /test-reports/{id}"

  - name: CustomerReviewer
    description: "Customer-side approver of drawings, escalation money and punch closure; never authors the work it reviews"
    identity: "opaque"
    exclusive_operations:
      - "POST /submittal-drawings/{id}/begin-review"
      - "POST /submittal-drawings/{id}/disposition"
      - "POST /escalation-adjustments/{id}/accept"
      - "POST /escalation-adjustments/{id}/dispute"
    shared_operations:
      - "POST /commissioning-jobs/{id}/punch-list-items"
      - "POST /punch-list-items/{id}/close, POST /punch-list-items/{id}/reject"
      - "POST /engineered-orders/{id}/warranty-claims"
      - "GET on orders, drawings, escalation clauses/adjustments, index points, labels, test reports, commissioning jobs, punch items and warranty claims"

  - name: QualityEngineer
    description: "Quality gatekeeper: issues test reports, verifies labels, publishes and retracts failure analyses, closes punch items"
    identity: "opaque"
    exclusive_operations:
      - "POST /test-reports/{id}/issue"
      - "POST /compliance-labels/{id}/verify"
      - "POST /warranty-claims/{id}/failure-analysis-reports"
      - "POST /failure-analysis-reports/{id}/publish"
      - "POST /long-lead-components/{id}/release-quarantine"
    shared_operations:
      - "POST /suppliers, POST /suppliers/{id}/receipt-events"
      - "POST /factory-acceptance-tests, POST /factory-acceptance-tests/{id}/conclude"
      - "POST /compliance-labels/{id}/void"
      - "POST /commissioning-jobs/{id}/energize, POST /commissioning-jobs/{id}/punch-list-items"
      - "POST /punch-list-items/{id}/close, POST /punch-list-items/{id}/reject"
      - "POST /warranty-claims/{id}/issue-rma, POST /warranty-claims/{id}/receive-unit, POST /warranty-claims/{id}/reject"
      - "POST /failure-analysis-reports/{id}/retract"
      - "broad GET access across suppliers, components, tests, reports, labels, commissioning and warranty"

  - name: ComplianceOfficer
    description: "Owns arc-flash and rating labels: pins the drawing revision and test report, generates and issues the label"
    identity: "opaque"
    exclusive_operations:
      - "POST /engineered-orders/{id}/compliance-labels"
      - "POST /compliance-labels/{id}/generate"
      - "POST /compliance-labels/{id}/issue"
    shared_operations:
      - "POST /compliance-labels/{id}/void"
      - "GET on orders, submittal drawings, suppliers, components, tests, test reports and labels"

  - name: LogisticsCoordinator
    description: "Runs staged freight release, site storage and delivery"
    identity: "opaque"
    exclusive_operations:
      - "POST /shipment-releases/{id}/clear"
      - "POST /shipment-releases/{id}/stage"
      - "POST /shipment-releases/{id}/ship"
      - "POST /shipment-releases/{id}/site-storage-agreements"
      - "POST /site-storage-agreements/{id}/close"
    shared_operations:
      - "POST /engineered-orders/{id}/shipment-releases"
      - "POST /shipment-releases/{id}/deliver"
      - "POST /site-storage-agreements/{id}/waive"
      - "GET on orders, order posture, labels, shipment releases, storage agreements and commissioning jobs"

  - name: FieldServiceEngineer
    description: "Runs field commissioning and startup: mobilization, energization requests, punch resolution and demobilization"
    identity: "opaque"
    exclusive_operations:
      - "POST /commissioning-jobs/{id}/mobilize"
      - "POST /commissioning-jobs/{id}/request-energization"
      - "POST /commissioning-jobs/{id}/demobilize"
      - "POST /punch-list-items/{id}/assign"
      - "POST /punch-list-items/{id}/resolve"
