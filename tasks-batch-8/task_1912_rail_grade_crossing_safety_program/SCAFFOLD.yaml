# =============================================================================
# Task 1912 — Rail Grade Crossing Safety Program (state DOT rail safety office)
# Seed tables: sections 1.0-1.7. Difficulty design (1.8) and corner design (1.9)
# live in sibling files SCAFFOLD_DIFFICULTY_DESIGN.yaml / SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  1912. Rail Grade Crossing Safety Program (state DOT rail safety office): crossing
  inventory & exposure calculation, warning device upgrade prioritization & funding,
  diagnostic team review & recommendation, closure/consolidation negotiation with
  locality, incident investigation & data reporting, quiet zone application &
  supplemental safety measures, maintenance responsibility & work coordination,
  signal preemption with traffic control

domain_name: rail-crossing-safety
api_prefix: /

# =============================================================================
# Complexity profile (sections 0.1-0.4) — Expert band, justified by 8 coupled workflows
# =============================================================================
complexity_profile:
  primary_archetype: multi-party negotiation   # closure/consolidation with locality; quiet-zone applicant vs approver
  secondary_archetype: quota / allocation      # annual funding pool competed for by ranked upgrade projects
  complexity_layers:
    - optimistic_concurrency                   # OCC on Crossing.version (inventory patch) and FundingProgram.version (award)
    - cascading_side_effects                   # incident findings -> crossing stats -> project staleness -> program demand; closure -> zone membership -> zone suspension
    - rate_threshold_triggers                  # exposure >= threshold forces diagnostic review; FRA damage threshold; negotiation round cap
    - version-pinning on approval              # UpgradeProject.priority_score pinned at nomination; QZ riwh pinned at submit; stale detection on hazard recompute
  entity_topology: flat                        # peer collections joined by foreign keys; no nested CRUD paths
  state_machine_shape: cyclic                  # ClosureAgreement PROPOSED<->COUNTERED, QuietZone EFFECTIVE<->SUSPENDED; IncidentReport is branching fork-join
  relationship_patterns:
    - one_to_many                              # Crossing -> IncidentReport / DiagnosticReview / MaintenanceWorkOrder / ...
    - many_to_many                             # QuietZoneCrossing junction between QuietZoneApplication and Crossing
    - self_referential                         # ClosureAgreement.consolidation_target_crossing_id -> Crossing.id
    - cross_aggregate                          # UpgradeProject references both Crossing and FundingProgram aggregates
  role_model: segregation_of_duties            # the officer who tables a DOT offer may not accept it; applicant never approves own quiet zone
  consistency_model: immediate                 # every mutation is visible in the same request's response
  difficulty_level: Expert

# =============================================================================
# Conventions (binding for all tables below)
# =============================================================================
conventions:
  version_increments: |
    entity.version increments exactly when an endpoint's side_effects say so or when the entity's
    own fields are written through its own endpoints (e.g. PATCH inventory on Crossing, a transition
    endpoint on the entity itself, agreement EXECUTED writing Crossing.status). Derived-field
    recomputes cascading from OTHER entities' actions refresh updated_at but NEVER increment
    version: FundingProgram.eligible_demand_cents recompute on project nominate/staleness does not
    bump FundingProgram.version, and Crossing exposure/hazard/incident-count recomputes from
    incident findings or project completion do not bump Crossing.version. This keeps every OCC
    fixture deterministic: FundingProgram.version moves only on lock/award/rescind, Crossing.version
    only on PATCH inventory and closure execution.
  logical_clock: |
    All time-gated rules (incident 5-year window, work-order begin-work window, incident future
    check) read the logical clock. Startup default is exactly 2026-08-01T00:00:00Z; the clock never
    falls back to wall-clock time and moves only via POST /_clock/set_current_utc.

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table (13 entities, flat topology)
# =============================================================================
entities:
  - name: Crossing
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: dot_crossing_number, type: string, source: input, description: "Federally assigned crossing inventory number; unique across all crossings" }
      - { name: railroad_code, type: string, source: input, description: "Operating railroad reporting mark (e.g. BNSF); RailroadMaintainer users act with X-User-ID equal to this code" }
      - { name: road_authority_locality_id, type: string, source: input, description: "FK -> Locality.id; jurisdiction that owns the roadway at this crossing" }
      - { name: highway_functional_class, type: enum, source: input, description: "ARTERIAL | COLLECTOR | LOCAL" }
      - { name: annual_train_count, type: integer, source: input, description: "Trains per year through the crossing (>= 0)" }
      - { name: train_speed_max_mph, type: integer, source: input, description: "Maximum timetable train speed, 1..110 mph" }
      - { name: aadt, type: integer, source: input, description: "Annual average daily highway traffic (>= 0)" }
      - { name: school_bus_count, type: integer, source: input, default: 0, description: "School buses per day (>= 0)" }
      - { name: sight_distance_rating, type: integer, source: input, description: "1 (worst) .. 5 (best) approach sight distance rating" }
      - { name: warning_device_class, type: enum, source: input, description: "PASSIVE_CROSSBUCK | FLASHING_LIGHTS | GATES | FOUR_QUADRANT_GATES" }
      - { name: status, type: enum, source: system, description: "ACTIVE | CLOSURE_PENDING | CLOSED" }
      - { name: exposure_index, type: number, source: computed, description: "Snapshot exposure = round_half_up((annual_train_count/365)*aadt/1000, 2); see calculations.exposure_index" }
      - { name: projected_exposure_index, type: number, source: computed, description: "5-year growth-adjusted exposure variant; see calculations.exposure_index variant projected" }
      - { name: incident_count_5yr, type: integer, source: computed, description: "Count of investigated incidents in the trailing 5-year window; see calculations.incident_count_5yr" }
      - { name: hazard_score, type: number, source: computed, description: "Priority hazard score 0..100; see calculations.hazard_score" }
      - { name: diagnostic_review_due, type: boolean, source: computed, description: "true when exposure_index >= EXPOSURE_REVIEW_THRESHOLD or a FIELD_INVESTIGATION was assigned" }

  - name: Locality
    parent: null
    common_fields: false   # id + created_at only; configuration entity
    fields:
      - { name: locality_name, type: string, source: input, description: "Jurisdiction name (city/county)" }
      - { name: state_code, type: string, source: input, description: "Two-letter state code" }
      - { name: contact_email, type: string, source: input, description: "Public works contact email" }

  - name: DiagnosticTeam
    parent: null
    common_fields: true
    fields:
      - { name: team_name, type: string, source: input, description: "Diagnostic review team name" }
      - { name: lead_agency, type: string, source: input, description: "Lead agency for the team (DOT, railroad, FRA, locality)" }

  - name: DiagnosticReview
    parent: null
    common_fields: true
    fields:
      - { name: crossing_id, type: string, source: input, description: "FK -> Crossing.id; crossing under review" }
      - { name: team_id, type: string, source: input, description: "FK -> DiagnosticTeam.id; team assigned to perform the review" }
      - { name: scheduled_date, type: string, source: input, description: "ISO calendar date (YYYY-MM-DD) of the field review" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | IN_SESSION | RECOMMENDATIONS_ISSUED | ACCEPTED | SUPERSEDED | CANCELLED" }
      - { name: recommendations, type: array, source: system, description: "Enum list set by issue-recommendations: UPGRADE_DEVICES | CLOSE_CROSSING | CONSOLIDATE | INSTALL_PREEMPTION | NO_ACTION" }
      - { name: accepted_at, type: datetime, source: system, description: "Timestamp when the office accepted the recommendations; null until accepted" }
      - { name: superseded_by_review_id, type: string, source: system, description: "id of the newer ACCEPTED review that superseded this one; null unless SUPERSEDED" }

  - name: IncidentReport
    parent: null
    common_fields: true
    fields:
      - { name: crossing_id, type: string, source: input, description: "FK -> Crossing.id; crossing where the incident occurred" }
      - { name: occurred_at, type: datetime, source: input, description: "Incident timestamp; must not be after the logical clock" }
      - { name: severity, type: enum, source: input, description: "CASUALTY | INJURY | PROPERTY_DAMAGE | NEAR_MISS" }
      - { name: fatalities, type: integer, source: input, default: 0, description: "Fatalities count (>= 0)" }
      - { name: injuries, type: integer, source: input, default: 0, description: "Injuries count (>= 0)" }
      - { name: property_damage_cents, type: integer, source: input, default: 0, description: "Property damage in cents (>= 0)" }
      - { name: train_speed_at_impact_mph, type: integer, source: input, description: "Optional recorded train speed at impact" }
      - { name: narrative, type: string, source: input, description: "Optional free-text narrative" }
      - { name: fra_reportable, type: boolean, source: computed, description: "true iff fatalities > 0 OR injuries > 0 OR property_damage_cents >= FRA_DAMAGE_THRESHOLD_CENTS" }
      - { name: investigation_track, type: enum, source: system, description: "FIELD_INVESTIGATION | DESK_REVIEW; null until assign-track" }
      - { name: findings_summary, type: string, source: system, description: "Findings text set by issue-findings; null until issued" }
      - { name: warning_devices_functioning, type: boolean, source: system, description: "Whether warning devices functioned as designed; set by issue-findings" }
      - { name: fra_submitted_at, type: datetime, source: system, description: "Timestamp of FRA data submission; null until submitted" }
      - { name: status, type: enum, source: system, description: "REPORTED | SCREENED | FIELD_INVESTIGATION | DESK_REVIEW | FINDINGS_ISSUED | FRA_SUBMITTED | CLOSED | REJECTED" }

  - name: FundingProgram
    parent: null
    common_fields: true
    fields:
      - { name: fiscal_year, type: integer, source: input, description: "Program fiscal year; unique across all programs" }
      - { name: apportionment_cents, type: integer, source: input, description: "Total annual apportionment in cents (> 0)" }
      - { name: allocation_method, type: enum, source: input, description: "WATERFALL_BY_RANK | PROPORTIONAL_SHARE; selects the calculations.funding_allocation variant" }
      - { name: status, type: enum, source: system, description: "OPEN | ALLOCATION_LOCKED | CLOSED" }
      - { name: available_cents, type: integer, source: computed, description: "apportionment_cents minus cents awarded to projects in AWARDED | IN_PROGRESS | COMPLETED; starts equal to apportionment_cents" }
      - { name: encumbered_cents, type: integer, source: computed, description: "Sum of awarded_cents over projects in AWARDED | IN_PROGRESS | COMPLETED; invariant available_cents + encumbered_cents == apportionment_cents" }
      - { name: eligible_demand_cents, type: integer, source: computed, description: "Sum of estimated_cost_cents over this program's projects in ELIGIBLE status (derived field, recomputed on every project status change)" }

  - name: UpgradeProject
    parent: null
    common_fields: true
    fields:
      - { name: crossing_id, type: string, source: input, description: "FK -> Crossing.id; crossing to be upgraded" }
      - { name: program_id, type: string, source: input, description: "FK -> FundingProgram.id; program funding the project" }
      - { name: target_device_class, type: enum, source: input, description: "PASSIVE_CROSSBUCK | FLASHING_LIGHTS | GATES | FOUR_QUADRANT_GATES; must differ from the crossing's current warning_device_class" }
      - { name: estimated_cost_cents, type: integer, source: input, description: "Engineer's cost estimate in cents (> 0)" }
      - { name: priority_score, type: number, source: computed, description: "Crossing hazard_score pinned at nomination (version-pinning); null while PROPOSED" }
      - { name: score_stale, type: boolean, source: computed, description: "true when the crossing's live hazard_score no longer equals the pinned priority_score" }
      - { name: tentative_award_cents, type: integer, source: computed, description: "Award amount computed by the allocation sweep at lock; null unless SELECTED" }
      - { name: awarded_cents, type: integer, source: computed, description: "Final awarded amount; null until AWARDED, reset to null on rescind" }
      - { name: federal_share_cents, type: integer, source: computed, description: "round_half_up(awarded_cents * 0.80) computed per award line; null until AWARDED" }
      - { name: state_share_cents, type: integer, source: computed, description: "awarded_cents - federal_share_cents; null until AWARDED" }
      - { name: status, type: enum, source: system, description: "PROPOSED | ELIGIBLE | SELECTED | AWARDED | IN_PROGRESS | COMPLETED | WITHDRAWN" }

  - name: ClosureAgreement
    parent: null
    common_fields: true
    fields:
      - { name: crossing_id, type: string, source: input, description: "FK -> Crossing.id; crossing proposed for closure or consolidation" }
      - { name: locality_id, type: string, source: input, description: "FK -> Locality.id; locality negotiating with the DOT" }
      - { name: closure_type, type: enum, source: input, description: "CLOSURE | CONSOLIDATION" }
      - { name: consolidation_target_crossing_id, type: string, source: input, description: "FK -> Crossing.id; receiving crossing when closure_type == CONSOLIDATION; must be absent for CLOSURE, must differ from crossing_id and be ACTIVE" }
      - { name: computed_incentive_cents, type: integer, source: computed, description: "Minimum DOT incentive from calculations.closure_incentive_offer; fixed at creation" }
      - { name: current_offer_cents, type: integer, source: system, description: "Offer currently on the table; initialized to computed_incentive_cents, moved by counter" }
      - { name: negotiation_round, type: integer, source: system, description: "0 at DRAFT, 1 after propose, +1 per counter; counter rejected when negotiation_round >= MAX_NEGOTIATION_ROUNDS (6)" }
      - { name: created_by_party, type: enum, source: system, description: "DOT | LOCALITY; which side created the agreement" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the creator" }
      - { name: last_offer_by_party, type: enum, source: system, description: "DOT | LOCALITY; who tabled the current offer" }
      - { name: last_offer_by_user_id, type: string, source: system, description: "X-User-ID who tabled the current offer" }
      - { name: dot_accepted_by_user_id, type: string, source: system, description: "RailSafetyOfficer X-User-ID who accepted; null until DOT_ACCEPTED" }
      - { name: status, type: enum, source: system, description: "DRAFT | PROPOSED | COUNTERED | DOT_ACCEPTED | LOCALITY_RATIFIED | EXECUTED | REJECTED | WITHDRAWN" }

  - name: QuietZoneApplication
    parent: null
    common_fields: true
    fields:
      - { name: locality_id, type: string, source: input, description: "FK -> Locality.id; applicant jurisdiction; must equal the acting LocalAuthority user's X-User-ID" }
      - { name: notes, type: string, source: input, description: "Optional applicant notes" }
      - { name: riwh_pre_ssm, type: number, source: computed, description: "Risk Index With Horns before supplemental safety measures, pinned at submit; see calculations.quiet_zone_risk" }
      - { name: riwh_post_ssm, type: number, source: computed, description: "Risk index after SSM credits, pinned at submit; see calculations.quiet_zone_risk" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | UNDER_REVIEW | APPROVED | SUPPLEMENT_REQUIRED | REJECTED | EFFECTIVE | SUSPENDED | WITHDRAWN" }

  - name: QuietZoneCrossing
    parent: null
    common_fields: false   # junction entity: id + created_at only
    fields:
      - { name: quiet_zone_application_id, type: string, source: system, description: "FK -> QuietZoneApplication.id; set from the path of the nested member POST" }
      - { name: crossing_id, type: string, source: input, description: "FK -> Crossing.id; member crossing" }
      - { name: ssm_codes, type: array, source: input, default: [], description: "Supplemental safety measures for this crossing: FOUR_QUADRANT_GATES | MEDIANS | CHANNELIZATION | ONE_WAY_STREET | WAYSIDE_HORN" }
      - { name: membership_status, type: enum, source: system, description: "MEMBER | REMOVED (removed only by the crossing-closure cascade or DELETE while zone editable)" }

  - name: MaintenanceResponsibilityAssignment
    parent: null
    common_fields: true
    fields:
      - { name: crossing_id, type: string, source: input, description: "FK -> Crossing.id; crossing whose maintenance is assigned" }
      - { name: category, type: enum, source: input, description: "SIGNAL | SURFACE | VEGETATION | STRIPING" }
      - { name: responsible_party, type: enum, source: input, description: "RAILROAD | ROAD_AUTHORITY" }
      - { name: effective_from, type: string, source: input, description: "ISO date the assignment takes effect" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUPERSEDED | REVOKED; exactly one ACTIVE per (crossing_id, category) at all times" }

  - name: MaintenanceWorkOrder
    parent: null
    common_fields: true
    fields:
      - { name: crossing_id, type: string, source: input, description: "FK -> Crossing.id; crossing where work occurs" }
      - { name: category, type: enum, source: input, description: "SIGNAL | SURFACE | VEGETATION | STRIPING" }
      - { name: window_start, type: datetime, source: input, description: "Work window start (inclusive), ISO 8601 UTC" }
      - { name: window_end, type: datetime, source: input, description: "Work window end (exclusive), ISO 8601 UTC; must be after window_start" }
      - { name: fouls_track, type: boolean, source: input, description: "true when work fouls the track and therefore requires railroad flagging protection" }
      - { name: flagging_vendor, type: string, source: input, description: "Railroad flagging provider reference; REQUIRED when fouls_track is true (ERR_FLAGGING_PLAN_REQUIRED)" }
      - { name: responsible_party, type: enum, source: system, description: "Copied from the ACTIVE MaintenanceResponsibilityAssignment for (crossing_id, category) at creation" }
      - { name: status, type: enum, source: system, description: "PLANNED | FLAGGING_CONFIRMED | IN_WORK | COMPLETED | CANCELLED" }

  - name: PreemptionInterconnection
    parent: null
    common_fields: true
    fields:
      - { name: crossing_id, type: string, source: input, description: "FK -> Crossing.id; crossing whose warning signals are interconnected with a traffic signal" }
      - { name: traffic_signal_ref, type: string, source: input, description: "Traffic signal controller identifier" }
      - { name: track_approach_distance_ft, type: integer, source: input, description: "Distance from approach circuit start to crossing (> 0)" }
      - { name: design_train_speed_mph, type: integer, source: input, description: "Design train speed used for approach time (> 0)" }
      - { name: clear_storage_distance_ft, type: integer, source: input, description: "Storage distance to clear between crossing and signalized intersection (>= 0)" }
      - { name: advance_preemption_seconds, type: integer, source: input, description: "Designed advance preemption time (>= 0)" }
      - { name: track_clearance_green_seconds, type: integer, source: input, description: "Designed minimum track-clearance green interval (>= 0)" }
      - { name: approach_seconds, type: integer, source: computed, description: "ceil(track_approach_distance_ft / (design_train_speed_mph * 1.46667)); see calculations.preemption_timing_check" }
      - { name: required_clearance_green_seconds, type: integer, source: computed, description: "ceil(clear_storage_distance_ft / 15.0)" }
      - { name: required_advance_preemption_seconds, type: integer, source: computed, description: "max(0, required_clearance_green_seconds + 5 - 10)" }
      - { name: timing_check_pass, type: boolean, source: computed, description: "true iff all three timing checks pass; see calculations.preemption_timing_check" }
      - { name: status, type: enum, source: system, description: "DRAFT | TIMING_VERIFIED | COMMISSIONED | DECOMMISSIONED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Crossing
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: CLOSURE_PENDING
        trigger: "system (automatic on ClosureAgreement LOCALITY_RATIFIED -> EXECUTED)"
        actor: system
        preconditions: ["An agreement for this crossing reaches EXECUTED"]
        side_effects: ["Crossing.version increments", "updated_at refreshed"]
      - from: CLOSURE_PENDING
        to: CLOSED
        trigger: "POST /crossings/{crossingId}/confirm-closure"
        actor: ProgramAdministrator
        preconditions: ["Crossing.status == CLOSURE_PENDING (else ERR_INVALID_STATE_TRANSITION)"]
        side_effects:
          - "link 1: Crossing.status -> CLOSED"
          - "link 2 (junction cascade): every QuietZoneCrossing with crossing_id = this and membership_status == MEMBER becomes REMOVED"
          - "link 3 (zone cascade): each affected QuietZoneApplication recomputes riwh_post_ssm over remaining MEMBER rows (calculations.quiet_zone_risk); if the application is EFFECTIVE and (no MEMBER rows remain OR recomputed riwh_post_ssm > NSRT), it transitions EFFECTIVE -> SUSPENDED"
          - "parallel fan-out: non-terminal MaintenanceWorkOrders (PLANNED | FLAGGING_CONFIRMED) for this crossing -> CANCELLED; DRAFT | TIMING_VERIFIED | COMMISSIONED PreemptionInterconnections -> DECOMMISSIONED"

  - entity: DiagnosticReview
    initial_state: SCHEDULED
    terminal_states: [SUPERSEDED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_SESSION
        trigger: "POST /diagnostic-reviews/{reviewId}/transition (to_status=IN_SESSION)"
        actor: RailSafetyOfficer
        preconditions: ["status == SCHEDULED (else ERR_INVALID_STATE_TRANSITION)"]
        side_effects: []
      - from: IN_SESSION
        to: RECOMMENDATIONS_ISSUED
        trigger: "POST /diagnostic-reviews/{reviewId}/issue-recommendations"
        actor: RailSafetyOfficer
        preconditions: ["status == IN_SESSION (else ERR_INVALID_STATE_TRANSITION)", "recommendations non-empty (else ERR_INVALID_REQUEST)"]
        side_effects: ["recommendations stored"]
      - from: RECOMMENDATIONS_ISSUED
        to: ACCEPTED
        trigger: "POST /diagnostic-reviews/{reviewId}/transition (to_status=ACCEPTED)"
        actor: RailSafetyOfficer
        preconditions: ["status == RECOMMENDATIONS_ISSUED (else ERR_INVALID_STATE_TRANSITION)", "Crossing.status == ACTIVE (else ERR_CROSSING_NOT_ACTIVE)"]
        side_effects:
          - "accepted_at stamped"
          - "the unique prior ACCEPTED review for the same crossing_id (if any) -> SUPERSEDED with superseded_by_review_id set to this review's id"
      - from: ACCEPTED
        to: SUPERSEDED
        trigger: "system (automatic when a newer review for the same crossing is ACCEPTED)"
        actor: system
        preconditions: []
        side_effects: ["superseded_by_review_id set"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /diagnostic-reviews/{reviewId}/transition (to_status=CANCELLED)"
        actor: RailSafetyOfficer
        preconditions: []
        side_effects: []
      - from: IN_SESSION
        to: CANCELLED
        trigger: "POST /diagnostic-reviews/{reviewId}/transition (to_status=CANCELLED)"
        actor: RailSafetyOfficer
        preconditions: []
        side_effects: []

  - entity: IncidentReport
    initial_state: REPORTED
    terminal_states: [CLOSED, REJECTED]
    transitions:
      - from: REPORTED
        to: SCREENED
        trigger: "POST /incident-reports/{incidentId}/transition (to_status=SCREENED)"
        actor: RailSafetyOfficer
        preconditions: ["status == REPORTED (else ERR_INVALID_STATE_TRANSITION)"]
        side_effects: []
      - from: REPORTED
        to: REJECTED
        trigger: "POST /incident-reports/{incidentId}/transition (to_status=REJECTED)"
        actor: RailSafetyOfficer
        preconditions: ["status == REPORTED (else ERR_INVALID_STATE_TRANSITION)"]
        side_effects: []
      - from: SCREENED
        to: FIELD_INVESTIGATION
        trigger: "POST /incident-reports/{incidentId}/transition (to_status=FIELD_INVESTIGATION)"
        actor: RailSafetyOfficer
        preconditions: ["status == SCREENED (else ERR_INVALID_STATE_TRANSITION)"]
        side_effects: ["investigation_track := FIELD_INVESTIGATION", "branch side effect: Crossing.diagnostic_review_due := true"]
      - from: SCREENED
        to: DESK_REVIEW
        trigger: "POST /incident-reports/{incidentId}/transition (to_status=DESK_REVIEW)"
        actor: RailSafetyOfficer
        preconditions: ["status == SCREENED (else ERR_INVALID_STATE_TRANSITION)", "severity != CASUALTY (else ERR_SEVERITY_REQUIRES_FIELD_INVESTIGATION)"]
        side_effects: ["investigation_track := DESK_REVIEW", "branch side effect: none (diagnostic_review_due untouched)"]
      - from: FIELD_INVESTIGATION
        to: FINDINGS_ISSUED
        trigger: "POST /incident-reports/{incidentId}/issue-findings"
        actor: RailSafetyOfficer
        preconditions: ["status in {FIELD_INVESTIGATION, DESK_REVIEW} (else ERR_INVALID_STATE_TRANSITION)"]
        side_effects:
          - "findings_summary and warning_devices_functioning stored"
          - "link 1: Crossing.incident_count_5yr recomputed (calculations.incident_count_5yr) and Crossing.hazard_score recomputed (calculations.hazard_score)"
          - "link 2: because hazard_score changed, every UpgradeProject of this crossing with status == ELIGIBLE reverts ELIGIBLE -> PROPOSED and sets score_stale := true (pinned priority_score no longer matches the live hazard_score)"
          - "link 3: because projects left ELIGIBLE, each affected FundingProgram.eligible_demand_cents is recomputed (decreases by each reverted project's estimated_cost_cents)"
      - from: DESK_REVIEW
        to: FINDINGS_ISSUED
        trigger: "POST /incident-reports/{incidentId}/issue-findings"
        actor: RailSafetyOfficer
        preconditions: ["status in {FIELD_INVESTIGATION, DESK_REVIEW} (else ERR_INVALID_STATE_TRANSITION)"]
        side_effects: ["same link 1-3 cascade as FIELD_INVESTIGATION -> FINDINGS_ISSUED"]
      - from: FINDINGS_ISSUED
        to: FRA_SUBMITTED
        trigger: "POST /incident-reports/{incidentId}/transition (to_status=FRA_SUBMITTED)"
        actor: RailSafetyOfficer
        preconditions: ["status == FINDINGS_ISSUED (else ERR_INVALID_STATE_TRANSITION)", "fra_reportable == true (else ERR_FRA_NOT_REPORTABLE)"]
        side_effects: ["fra_submitted_at stamped"]
      - from: FRA_SUBMITTED
        to: CLOSED
        trigger: "POST /incident-reports/{incidentId}/transition (to_status=CLOSED)"
        actor: RailSafetyOfficer
        preconditions: ["status == FRA_SUBMITTED (else ERR_INVALID_STATE_TRANSITION)"]
        side_effects: []
      - from: FINDINGS_ISSUED
        to: CLOSED
        trigger: "POST /incident-reports/{incidentId}/transition (to_status=CLOSED)"
        actor: RailSafetyOfficer
        preconditions: ["status == FINDINGS_ISSUED (else ERR_INVALID_STATE_TRANSITION)", "fra_reportable == false (else ERR_INVALID_STATE_TRANSITION: reportable incidents must go through FRA_SUBMITTED)"]
        side_effects: []

  - entity: FundingProgram
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: ALLOCATION_LOCKED
        trigger: "POST /funding-programs/{programId}/transition (to_status=ALLOCATION_LOCKED)"
        actor: ProgramAdministrator
        preconditions: ["status == OPEN (else ERR_INVALID_STATE_TRANSITION)"]
        side_effects:
          - "runs calculations.funding_allocation with the program's allocation_method variant over candidate set {projects: program_id = this AND status == ELIGIBLE}"
          - "each funded project -> SELECTED with tentative_award_cents set; unfunded projects remain ELIGIBLE with tentative_award_cents null"
          - "zero ELIGIBLE projects is allowed: lock succeeds with no selections"
          - "FundingProgram.version increments"
      - from: ALLOCATION_LOCKED
        to: CLOSED
        trigger: "POST /funding-programs/{programId}/transition (to_status=CLOSED)"
        actor: ProgramAdministrator
        preconditions: ["status == ALLOCATION_LOCKED (else ERR_INVALID_STATE_TRANSITION)", "no project of this program in SELECTED | AWARDED | IN_PROGRESS (else ERR_PROGRAM_HAS_OPEN_PROJECTS)"]
        side_effects: []

  - entity: UpgradeProject
    initial_state: PROPOSED
    terminal_states: [COMPLETED, WITHDRAWN]
    transitions:
      - from: PROPOSED
        to: ELIGIBLE
        trigger: "POST /upgrade-projects/{projectId}/transition (to_status=ELIGIBLE)  [nominate]"
        actor: RailSafetyOfficer
        preconditions: ["status == PROPOSED (else ERR_INVALID_STATE_TRANSITION)", "Crossing.status == ACTIVE (else ERR_CROSSING_NOT_ACTIVE)", "FundingProgram.status == OPEN (else ERR_INVALID_STATE_TRANSITION)"]
        side_effects: ["priority_score := crossing.hazard_score (pinned; version-pinning on approval)", "score_stale := false", "FundingProgram.eligible_demand_cents recomputed"]
      - from: ELIGIBLE
        to: SELECTED
        trigger: "system (allocation sweep on program ALLOCATION_LOCKED)"
        actor: system
        preconditions: ["project funded by calculations.funding_allocation"]
        side_effects: ["tentative_award_cents set by the sweep"]
      - from: ELIGIBLE
        to: PROPOSED
        trigger: "system (hazard-staleness cascade from incident findings or device-upgrade completion)"
        actor: system
        preconditions: ["crossing hazard_score recomputed to a different value"]
        side_effects: ["score_stale := true", "FundingProgram.eligible_demand_cents recomputed"]
      - from: SELECTED
        to: AWARDED
        trigger: "POST /upgrade-projects/{projectId}/award"
        actor: ProgramAdministrator
        preconditions: ["status in {ELIGIBLE, SELECTED} (else ERR_PROJECT_NOT_SELECTED)", "FundingProgram.status in {OPEN, ALLOCATION_LOCKED} (else ERR_INVALID_STATE_TRANSITION)", "OCC: expected_funding_program_version == FundingProgram.version (else ERR_STALE_VERSION)", "effective award (award_cents input, default tentative_award_cents if SELECTED else estimated_cost_cents) in [1, estimated_cost_cents] (else ERR_AWARD_AMOUNT_INVALID)", "effective award <= FundingProgram.available_cents (else ERR_INSUFFICIENT_FUNDS)"]
        side_effects: ["awarded_cents := effective award", "federal_share_cents / state_share_cents per calculations.match_split (per-award rounding, pinned order)", "FundingProgram.encumbered_cents += awarded_cents; available_cents -= awarded_cents", "FundingProgram.version increments"]
      - from: ELIGIBLE
        to: AWARDED
        trigger: "POST /upgrade-projects/{projectId}/award  [rolling award from an OPEN program]"
        actor: ProgramAdministrator
        preconditions: ["same as SELECTED -> AWARDED"]
        side_effects: ["same as SELECTED -> AWARDED"]
      - from: AWARDED
        to: ELIGIBLE
        trigger: "POST /upgrade-projects/{projectId}/rescind-award"
        actor: ProgramAdministrator
        preconditions: ["status == AWARDED (else ERR_INVALID_STATE_TRANSITION)", "FundingProgram.status in {OPEN, ALLOCATION_LOCKED} (else ERR_INVALID_STATE_TRANSITION)"]
        side_effects: ["FundingProgram.encumbered_cents -= awarded_cents; available_cents += awarded_cents (compensating action: pool restored exactly)", "awarded_cents / federal_share_cents / state_share_cents := null", "FundingProgram.version increments"]
      - from: AWARDED
        to: IN_PROGRESS
        trigger: "POST /upgrade-projects/{projectId}/transition (to_status=IN_PROGRESS)"
        actor: ProgramAdministrator
        preconditions: ["status == AWARDED (else ERR_INVALID_STATE_TRANSITION)"]
        side_effects: []
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /upgrade-projects/{projectId}/transition (to_status=COMPLETED)"
        actor: ProgramAdministrator
        preconditions: ["status == IN_PROGRESS (else ERR_INVALID_STATE_TRANSITION)", "Crossing.status == ACTIVE (else ERR_CROSSING_NOT_ACTIVE)"]
        side_effects: ["Crossing.warning_device_class := target_device_class", "Crossing.hazard_score recomputed (device factor change)", "the same hazard-staleness cascade as incident findings runs: ELIGIBLE projects of this crossing revert to PROPOSED with score_stale := true and FundingProgram.eligible_demand_cents recomputes"]
      - from: PROPOSED
        to: WITHDRAWN
        trigger: "POST /upgrade-projects/{projectId}/transition (to_status=WITHDRAWN)"
        actor: RailSafetyOfficer
        preconditions: ["status in {PROPOSED, ELIGIBLE, SELECTED} (else ERR_INVALID_STATE_TRANSITION)"]
        side_effects: ["FundingProgram.eligible_demand_cents recomputed when leaving ELIGIBLE"]
      - from: ELIGIBLE
        to: WITHDRAWN
        trigger: "POST /upgrade-projects/{projectId}/transition (to_status=WITHDRAWN)"
        actor: RailSafetyOfficer
        preconditions: ["status in {PROPOSED, ELIGIBLE, SELECTED} (else ERR_INVALID_STATE_TRANSITION)"]
        side_effects: ["FundingProgram.eligible_demand_cents recomputed"]
      - from: SELECTED
        to: WITHDRAWN
        trigger: "POST /upgrade-projects/{projectId}/transition (to_status=WITHDRAWN)"
        actor: RailSafetyOfficer
        preconditions: ["status in {PROPOSED, ELIGIBLE, SELECTED} (else ERR_INVALID_STATE_TRANSITION)"]
        side_effects: ["tentative_award_cents := null"]

  - entity: ClosureAgreement
    initial_state: DRAFT
    terminal_states: [EXECUTED, REJECTED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: PROPOSED
        trigger: "POST /closure-agreements/{agreementId}/transition (to_status=PROPOSED)"
        actor: RailSafetyOfficer
        preconditions: ["status == DRAFT (else ERR_INVALID_STATE_TRANSITION)"]
        side_effects: ["negotiation_round := 1", "last_offer_by_party := created_by_party; last_offer_by_user_id := acting user", "current_offer_cents := computed_incentive_cents"]
        note: "either party may propose; the transition actor must match created_by_party's role (RailSafetyOfficer for DOT, LocalAuthority owner for LOCALITY) else ERR_FORBIDDEN_ROLE"
      - from: PROPOSED
        to: COUNTERED
        trigger: "POST /closure-agreements/{agreementId}/counter"
        actor: RailSafetyOfficer
        preconditions:
          - "status in {PROPOSED, COUNTERED} (else ERR_INVALID_STATE_TRANSITION)"
          - "turn alternation: actor's party must differ from last_offer_by_party (else ERR_COUNTER_TURN); LocalAuthority actor must own locality_id"
          - "negotiation_round < MAX_NEGOTIATION_ROUNDS (6) (else ERR_NEGOTIATION_ROUND_LIMIT)"
          - "LOCALITY counter: proposed_incentive_cents > current_offer_cents and <= MAX_INCENTIVE_CAP_CENTS (else ERR_INCENTIVE_REGRESSION / ERR_INCENTIVE_CAP_EXCEEDED)"
          - "DOT counter: proposed_incentive_cents < current_offer_cents and >= computed_incentive_cents (else ERR_INCENTIVE_REGRESSION)"
        side_effects: ["current_offer_cents := proposed_incentive_cents", "negotiation_round += 1", "last_offer_by_party/user updated", "state flips PROPOSED -> COUNTERED or COUNTERED -> PROPOSED (cycle)"]
      - from: COUNTERED
        to: PROPOSED
        trigger: "POST /closure-agreements/{agreementId}/counter"
        actor: LocalAuthority
        preconditions: ["same counter rules as PROPOSED -> COUNTERED"]
        side_effects: ["same counter effects as PROPOSED -> COUNTERED"]
      - from: PROPOSED
        to: DOT_ACCEPTED
        trigger: "POST /closure-agreements/{agreementId}/transition (to_status=DOT_ACCEPTED)"
        actor: RailSafetyOfficer
        preconditions: ["status in {PROPOSED, COUNTERED} (else ERR_INVALID_STATE_TRANSITION)", "segregation of duties: if last_offer_by_party == DOT then acting X-User-ID != last_offer_by_user_id (else ERR_SELF_ACCEPT_FORBIDDEN)"]
        side_effects: ["dot_accepted_by_user_id := acting user"]
      - from: COUNTERED
        to: DOT_ACCEPTED
        trigger: "POST /closure-agreements/{agreementId}/transition (to_status=DOT_ACCEPTED)"
        actor: RailSafetyOfficer
        preconditions: ["same as PROPOSED -> DOT_ACCEPTED"]
        side_effects: ["dot_accepted_by_user_id := acting user"]
      - from: DOT_ACCEPTED
        to: LOCALITY_RATIFIED
        trigger: "POST /closure-agreements/{agreementId}/transition (to_status=LOCALITY_RATIFIED)"
        actor: LocalAuthority
        preconditions: ["status == DOT_ACCEPTED (else ERR_INVALID_STATE_TRANSITION)", "acting X-User-ID == agreement.locality_id (else ERR_LOCALITY_MISMATCH)"]
        side_effects: []
      - from: LOCALITY_RATIFIED
        to: EXECUTED
        trigger: "POST /closure-agreements/{agreementId}/transition (to_status=EXECUTED)"
        actor: ProgramAdministrator
        preconditions: ["status == LOCALITY_RATIFIED (else ERR_INVALID_STATE_TRANSITION)"]
        side_effects: ["Crossing.status ACTIVE -> CLOSURE_PENDING", "Crossing.version increments"]
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /closure-agreements/{agreementId}/transition (to_status=REJECTED)"
        actor: LocalAuthority
        preconditions: ["status in {PROPOSED, COUNTERED, DOT_ACCEPTED} (else ERR_INVALID_STATE_TRANSITION)", "acting locality owns the agreement (else ERR_LOCALITY_MISMATCH)"]
        side_effects: []
      - from: COUNTERED
        to: REJECTED
        trigger: "POST /closure-agreements/{agreementId}/transition (to_status=REJECTED)"
        actor: LocalAuthority
        preconditions: ["same as PROPOSED -> REJECTED"]
        side_effects: []
      - from: DOT_ACCEPTED
        to: REJECTED
        trigger: "POST /closure-agreements/{agreementId}/transition (to_status=REJECTED)"
        actor: LocalAuthority
        preconditions: ["same as PROPOSED -> REJECTED"]
        side_effects: []
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /closure-agreements/{agreementId}/transition (to_status=WITHDRAWN)"
        actor: RailSafetyOfficer
        preconditions: ["status in {DRAFT, PROPOSED, COUNTERED, DOT_ACCEPTED} (else ERR_INVALID_STATE_TRANSITION)", "actor's party == created_by_party (DOT -> RailSafetyOfficer; LOCALITY -> LocalAuthority owner)"]
        side_effects: []
      - from: PROPOSED
        to: WITHDRAWN
        trigger: "POST /closure-agreements/{agreementId}/transition (to_status=WITHDRAWN)"
        actor: RailSafetyOfficer
        preconditions: ["same as DRAFT -> WITHDRAWN"]
        side_effects: []
      - from: COUNTERED
        to: WITHDRAWN
        trigger: "POST /closure-agreements/{agreementId}/transition (to_status=WITHDRAWN)"
        actor: RailSafetyOfficer
        preconditions: ["same as DRAFT -> WITHDRAWN"]
        side_effects: []
      - from: DOT_ACCEPTED
        to: WITHDRAWN
        trigger: "POST /closure-agreements/{agreementId}/transition (to_status=WITHDRAWN)"
        actor: RailSafetyOfficer
        preconditions: ["same as DRAFT -> WITHDRAWN"]
        side_effects: []

  - entity: QuietZoneApplication
    initial_state: DRAFT
    terminal_states: [REJECTED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /quiet-zone-applications/{qzId}/transition (to_status=SUBMITTED)"
        actor: LocalAuthority
        preconditions:
          - "status in {DRAFT, SUPPLEMENT_REQUIRED} (else ERR_INVALID_STATE_TRANSITION)"
          - "acting X-User-ID == locality_id (else ERR_LOCALITY_MISMATCH)"
          - ">= 1 QuietZoneCrossing with membership_status == MEMBER (else ERR_EMPTY_ZONE)"
          - "every member crossing has Crossing.status == ACTIVE (else ERR_CROSSING_NOT_ACTIVE)"
          - "every member crossing has at least one DiagnosticReview with status == ACCEPTED (else ERR_DIAGNOSTIC_REVIEW_REQUIRED)"
        side_effects: ["riwh_pre_ssm and riwh_post_ssm computed over current MEMBER rows and pinned (calculations.quiet_zone_risk)"]
      - from: SUPPLEMENT_REQUIRED
        to: SUBMITTED
        trigger: "POST /quiet-zone-applications/{qzId}/transition (to_status=SUBMITTED)"
        actor: LocalAuthority
        preconditions: ["same as DRAFT -> SUBMITTED"]
        side_effects: ["riwh_pre_ssm / riwh_post_ssm recomputed and re-pinned"]
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /quiet-zone-applications/{qzId}/transition (to_status=UNDER_REVIEW)"
        actor: RailSafetyOfficer
        preconditions: ["status == SUBMITTED (else ERR_INVALID_STATE_TRANSITION)"]
        side_effects: []
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /quiet-zone-applications/{qzId}/decide (server-computed outcome)"
        actor: RailSafetyOfficer
        preconditions: ["status == UNDER_REVIEW (else ERR_INVALID_STATE_TRANSITION)"]
        side_effects: ["decision per calculations.quiet_zone_risk evaluation order: APPROVED iff riwh_pre_ssm <= NSRT OR riwh_post_ssm <= NSRT"]
      - from: UNDER_REVIEW
        to: SUPPLEMENT_REQUIRED
        trigger: "POST /quiet-zone-applications/{qzId}/decide (server-computed outcome)"
        actor: RailSafetyOfficer
        preconditions: ["status == UNDER_REVIEW (else ERR_INVALID_STATE_TRANSITION)"]
        side_effects: ["SUPPLEMENT_REQUIRED iff riwh_pre_ssm > NSRT AND riwh_post_ssm > NSRT AND riwh_post_ssm < riwh_pre_ssm (SSMs help but are insufficient)"]
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /quiet-zone-applications/{qzId}/decide (server-computed outcome)"
        actor: RailSafetyOfficer
        preconditions: ["status == UNDER_REVIEW (else ERR_INVALID_STATE_TRANSITION)"]
        side_effects: ["REJECTED iff riwh_pre_ssm > NSRT AND riwh_post_ssm >= riwh_pre_ssm (no SSM progress)"]
      - from: APPROVED
        to: EFFECTIVE
        trigger: "POST /quiet-zone-applications/{qzId}/transition (to_status=EFFECTIVE)"
        actor: LocalAuthority
        preconditions: ["status == APPROVED (else ERR_INVALID_STATE_TRANSITION)", "acting X-User-ID == locality_id (else ERR_LOCALITY_MISMATCH)"]
        side_effects: []
      - from: EFFECTIVE
        to: SUSPENDED
        trigger: "POST /quiet-zone-applications/{qzId}/transition (to_status=SUSPENDED) OR system (crossing-closure cascade)"
        actor: RailSafetyOfficer
        preconditions: ["status == EFFECTIVE (else ERR_INVALID_STATE_TRANSITION); system path: a member crossing became CLOSED and recomputed riwh_post_ssm > NSRT or no MEMBER rows remain"]
        side_effects: []
      - from: SUSPENDED
        to: EFFECTIVE
        trigger: "POST /quiet-zone-applications/{qzId}/transition (to_status=EFFECTIVE)  [reinstate]"
        actor: RailSafetyOfficer
        preconditions: ["status == SUSPENDED (else ERR_INVALID_STATE_TRANSITION)", "recomputed riwh_post_ssm over current MEMBER rows (live hazard_score) <= NSRT and >= 1 MEMBER row exists (else ERR_SSM_INSUFFICIENT)"]
        side_effects: ["riwh_pre_ssm / riwh_post_ssm re-pinned to the recomputed values"]
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /quiet-zone-applications/{qzId}/transition (to_status=WITHDRAWN)"
        actor: LocalAuthority
        preconditions: ["status in {DRAFT, SUBMITTED} (else ERR_INVALID_STATE_TRANSITION)", "acting X-User-ID == locality_id (else ERR_LOCALITY_MISMATCH)"]
        side_effects: []
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /quiet-zone-applications/{qzId}/transition (to_status=WITHDRAWN)"
        actor: LocalAuthority
        preconditions: ["same as DRAFT -> WITHDRAWN"]
        side_effects: []

  - entity: QuietZoneCrossing
    initial_state: MEMBER
    terminal_states: [REMOVED]
    transitions:
      - from: MEMBER
        to: REMOVED
        trigger: "DELETE /quiet-zone-crossings/{memberId} (owner locality, zone in DRAFT | SUPPLEMENT_REQUIRED) OR system (crossing-closure cascade)"
        actor: LocalAuthority
        preconditions: ["manual path: membership_status == MEMBER and parent zone status in {DRAFT, SUPPLEMENT_REQUIRED} (else ERR_INVALID_STATE_TRANSITION); acting X-User-ID == zone.locality_id (else ERR_LOCALITY_MISMATCH)"]
        side_effects: ["parent QuietZoneApplication riwh values are NOT recomputed until next submit (pinned at last submit)"]

  - entity: MaintenanceResponsibilityAssignment
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED, REVOKED]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (automatic when a new assignment is created for the same (crossing_id, category))"
        actor: system
        preconditions: []
        side_effects: ["the new assignment becomes the single ACTIVE row for (crossing_id, category)"]
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /maintenance-assignments/{assignmentId}/revoke"
        actor: ProgramAdministrator
        preconditions: ["status == ACTIVE (else ERR_INVALID_STATE_TRANSITION)", "a fallback exists: at least one SUPERSEDED assignment for the same (crossing_id, category) (else ERR_NO_FALLBACK_ASSIGNMENT)"]
        side_effects: ["fallback selector: among SUPERSEDED rows for (crossing_id, category), the one with greatest updated_at (tie: greatest created_at) is reinstated to ACTIVE; compensating invariant: exactly one ACTIVE row per (crossing_id, category) before and after"]

  - entity: MaintenanceWorkOrder
    initial_state: PLANNED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PLANNED
        to: FLAGGING_CONFIRMED
        trigger: "POST /maintenance-work-orders/{workOrderId}/transition (to_status=FLAGGING_CONFIRMED)"
        actor: RailroadMaintainer
        preconditions: ["status == PLANNED (else ERR_INVALID_STATE_TRANSITION)", "acting RailroadMaintainer X-User-ID == crossing.railroad_code (flagging is always provided by the operating railroad) (else ERR_RESPONSIBILITY_MISMATCH)"]
        side_effects: []
      - from: PLANNED
        to: IN_WORK
        trigger: "POST /maintenance-work-orders/{workOrderId}/transition (to_status=IN_WORK)"
        actor: RailroadMaintainer
        preconditions:
          - "status in {PLANNED, FLAGGING_CONFIRMED} (else ERR_INVALID_STATE_TRANSITION)"
          - "if fouls_track == true then status must be FLAGGING_CONFIRMED (else ERR_FLAGGING_NOT_CONFIRMED)"
          - "logical clock within [window_start, window_end) (else ERR_OUTSIDE_WORK_WINDOW)"
          - "Crossing.status == ACTIVE (else ERR_CROSSING_NOT_ACTIVE)"
          - "actor matches responsible_party: RAILROAD -> RailroadMaintainer with X-User-ID == crossing.railroad_code; ROAD_AUTHORITY -> LocalAuthority with X-User-ID == crossing.road_authority_locality_id (else ERR_RESPONSIBILITY_MISMATCH)"
        side_effects: []
      - from: FLAGGING_CONFIRMED
        to: IN_WORK
        trigger: "POST /maintenance-work-orders/{workOrderId}/transition (to_status=IN_WORK)"
        actor: RailroadMaintainer
        preconditions: ["same as PLANNED -> IN_WORK"]
        side_effects: []
      - from: IN_WORK
        to: COMPLETED
        trigger: "POST /maintenance-work-orders/{workOrderId}/transition (to_status=COMPLETED)"
        actor: RailroadMaintainer
        preconditions: ["status == IN_WORK (else ERR_INVALID_STATE_TRANSITION)", "actor matches responsible_party (else ERR_RESPONSIBILITY_MISMATCH)"]
        side_effects: []
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /maintenance-work-orders/{workOrderId}/transition (to_status=CANCELLED) OR system (crossing-closure cascade)"
        actor: RailroadMaintainer
        preconditions: ["manual path: status in {PLANNED, FLAGGING_CONFIRMED} (else ERR_INVALID_STATE_TRANSITION); actor matches responsible_party"]
        side_effects: []
      - from: FLAGGING_CONFIRMED
        to: CANCELLED
        trigger: "POST /maintenance-work-orders/{workOrderId}/transition (to_status=CANCELLED) OR system (crossing-closure cascade)"
        actor: RailroadMaintainer
        preconditions: ["same as PLANNED -> CANCELLED"]
        side_effects: []

  - entity: PreemptionInterconnection
    initial_state: DRAFT
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: DRAFT
        to: TIMING_VERIFIED
        trigger: "POST /preemption-interconnections/{interconnectionId}/transition (to_status=TIMING_VERIFIED)"
        actor: RailSafetyOfficer
        preconditions: ["status == DRAFT (else ERR_INVALID_STATE_TRANSITION)", "calculations.preemption_timing_check passes (else ERR_PREEMPTION_TIMING_INADEQUATE, entity stays DRAFT)"]
        side_effects: ["timing_check_pass := true"]
      - from: TIMING_VERIFIED
        to: COMMISSIONED
        trigger: "POST /preemption-interconnections/{interconnectionId}/transition (to_status=COMMISSIONED)"
        actor: RailSafetyOfficer
        preconditions: ["status == TIMING_VERIFIED (else ERR_INVALID_STATE_TRANSITION)", "Crossing.status == ACTIVE (else ERR_CROSSING_NOT_ACTIVE)", "crossing.warning_device_class in {GATES, FOUR_QUADRANT_GATES} (else ERR_PREEMPTION_REQUIRES_GATES)"]
        side_effects: []
      - from: DRAFT
        to: DECOMMISSIONED
        trigger: "POST /preemption-interconnections/{interconnectionId}/transition (to_status=DECOMMISSIONED) OR system (crossing-closure cascade)"
        actor: ProgramAdministrator
        preconditions: ["manual path: status in {DRAFT, TIMING_VERIFIED, COMMISSIONED} (else ERR_INVALID_STATE_TRANSITION)"]
        side_effects: []
      - from: TIMING_VERIFIED
        to: DECOMMISSIONED
        trigger: "POST /preemption-interconnections/{interconnectionId}/transition (to_status=DECOMMISSIONED) OR system (crossing-closure cascade)"
        actor: ProgramAdministrator
        preconditions: ["same as DRAFT -> DECOMMISSIONED"]
        side_effects: []
      - from: COMMISSIONED
        to: DECOMMISSIONED
        trigger: "POST /preemption-interconnections/{interconnectionId}/transition (to_status=DECOMMISSIONED) OR system (crossing-closure cascade)"
        actor: ProgramAdministrator
        preconditions: ["same as DRAFT -> DECOMMISSIONED"]
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on parent version; only true create/update races)
# =============================================================================
concurrency_rules:
  - rule_id: crossing-inventory-update-stale
    parent_entity: Crossing
    write_endpoint: "PATCH /crossings/{crossingId}/inventory"
    occ_field: expected_crossing_version
    description: |
      Updating a crossing's inventory counts against a version the client no longer
      holds current is rejected: another writer has mutated the crossing (inventory
      patch, closure execution, or cascade-touched updated_at/version) since the
      client read it, so the client's expected_crossing_version is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: award-create-stale-program
    parent_entity: FundingProgram
    write_endpoint: "POST /upgrade-projects/{projectId}/award"
    occ_field: expected_funding_program_version
    description: |
      Issuing an award against a FundingProgram whose version has advanced since the
      client last observed it is rejected: a prior award or rescind has legitimately
      changed available_cents, so the client's expected_funding_program_version is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: exposure_index
    trigger: "Crossing creation and every PATCH /crossings/{id}/inventory"
    algorithm: forward_looking
    formula: |
      trains_per_day = annual_train_count / 365.0
      snapshot:  exposure_index = round_half_up(trains_per_day * aadt / 1000, 2)
      projected: projected_trains = annual_train_count * (1 + RAIL_GROWTH_PCT)^PROJECTION_HORIZON_YEARS
                 projected_aadt   = aadt * (1 + ROAD_GROWTH_PCT)^PROJECTION_HORIZON_YEARS
                 projected_exposure_index = round_half_up((projected_trains/365.0) * projected_aadt / 1000, 2)
      diagnostic_review_due := (exposure_index >= EXPOSURE_REVIEW_THRESHOLD) OR
                               (any IncidentReport of this crossing with investigation_track == FIELD_INVESTIGATION)
    input_set: "the single Crossing being created or patched"
    constants:
      EXPOSURE_REVIEW_THRESHOLD: 10.00
      PROJECTION_HORIZON_YEARS: 5
      RAIL_GROWTH_PCT: 0.02
      ROAD_GROWTH_PCT: 0.03
    precision: "2 decimal places, round_half_up"
    variants:
      - name: snapshot
        when: "threshold gating (diagnostic_review_due) and hazard_score input"
        difference: "uses current annual_train_count and aadt as recorded"
      - name: projected
        when: "5-year planning figure reported on the crossing record"
        difference: "applies compound rail/road growth over PROJECTION_HORIZON_YEARS; strictly greater than snapshot when either growth rate is positive"

  - name: hazard_score
    trigger: "Crossing creation; inventory PATCH; incident issue-findings cascade; upgrade project completion (device class change)"
    algorithm: weighted_scoring
    formula: |
      device_factor: PASSIVE_CROSSBUCK 1.50 | FLASHING_LIGHTS 1.20 | GATES 1.00 | FOUR_QUADRANT_GATES 0.90
      exposure_band (on snapshot exposure_index): >= 25 -> x1.40 (SEVERE); >= 10 -> x1.20 (HIGH); >= 3 -> x1.10 (MEDIUM); else x1.00 (LOW)
      incident_term = min(incident_count_5yr, INCIDENT_CAP) * INCIDENT_WEIGHT
      bus_term      = min(school_bus_count, BUS_CAP) * BUS_WEIGHT
      sight_mult    = 1.15 if sight_distance_rating <= SIGHT_POOR_THRESHOLD else 1.00
      hazard_score  = round_half_up(min((exposure_index * band_mult + incident_term + bus_term) * device_factor * sight_mult, SCORE_CAP), 2)
    input_set: "single Crossing; incident term uses calculations.incident_count_5yr"
    constants:
      INCIDENT_CAP: 5
      INCIDENT_WEIGHT: 8
      BUS_CAP: 20
      BUS_WEIGHT: 0.5
      SIGHT_POOR_THRESHOLD: 2
      SIGHT_POOR_MULTIPLIER: 1.15
      SCORE_CAP: 100
    precision: "2 decimal places, round_half_up"

  - name: incident_count_5yr
    trigger: "incident issue-findings cascade; also recomputed on read of Crossing"
    algorithm: aggregation
    formula: |
      count IncidentReport rows where crossing_id = this crossing
        AND status IN {FINDINGS_ISSUED, FRA_SUBMITTED, CLOSED}
        AND occurred_at IN [clock_now - 5 years, clock_now]  (both bounds INCLUSIVE)
      REPORTED | SCREENED | FIELD_INVESTIGATION | DESK_REVIEW | REJECTED incidents never count.
      clock_now is the logical clock (default 2026-08-01T00:00:00Z until POST /_clock/set_current_utc moves it).
    input_set: "IncidentReports of one crossing, status- and window-filtered as above"
    constants:
      WINDOW_YEARS: 5

  - name: fra_reportable
    trigger: "IncidentReport creation"
    algorithm: threshold
    formula: |
      fra_reportable = (fatalities > 0) OR (injuries > 0) OR (property_damage_cents >= FRA_DAMAGE_THRESHOLD_CENTS)
      Boundary: property_damage_cents == FRA_DAMAGE_THRESHOLD_CENTS is reportable (>=).
    input_set: "the single IncidentReport being created"
    constants:
      FRA_DAMAGE_THRESHOLD_CENTS: 1100000

  - name: funding_allocation
    trigger: "FundingProgram OPEN -> ALLOCATION_LOCKED (allocation sweep)"
    algorithm: waterfall_allocation
    formula: |
      Candidate set: UpgradeProjects with program_id = this program AND status == ELIGIBLE.
      Ranking: priority_score DESC; tie -> crossing.incident_count_5yr DESC; tie -> project.created_at ASC.
      WATERFALL_BY_RANK variant:
        remaining = available_cents
        for each project in ranking order:
          if remaining >= project.estimated_cost_cents: SELECTED, tentative_award_cents = estimated_cost_cents, remaining -= cost
          else: STOP immediately (no skipping to smaller projects)
      PROPORTIONAL_SHARE variant:
        total_requested = sum(estimated_cost_cents over candidates)
        for each candidate (order-insensitive): tentative = min(estimated_cost_cents, floor(available_cents * estimated_cost_cents / total_requested))
        every candidate becomes SELECTED; unallocated remainder cents stay in available_cents
      Boundary: estimated_cost_cents == remaining is funded exactly (>=), leaving remaining == 0.
    input_set: "ELIGIBLE projects of the locking program at lock time (pinned snapshot)"
    precision: "whole cents; proportional shares use floor"
    variants:
      - name: waterfall_by_rank
        when: "FundingProgram.allocation_method == WATERFALL_BY_RANK"
        difference: "full funding in rank order; first non-fitting project stops the sweep"
      - name: proportional_share
        when: "FundingProgram.allocation_method == PROPORTIONAL_SHARE"
        difference: "every candidate funded pro-rata (floor rounding, capped at cost); produces different awards than waterfall for identical data"

  - name: match_split
    trigger: "every successful POST /upgrade-projects/{id}/award"
    algorithm: tiered_pricing
    formula: |
      Per award line, in pinned order:
        1. federal_share_cents = round_half_up(awarded_cents * FEDERAL_SHARE_PCT)   -- round EACH award line first
        2. state_share_cents   = awarded_cents - federal_share_cents
      Program totals (sum over award lines) are computed by summing the per-line rounded values;
      the aggregate is NEVER re-rounded (round-per-line-then-sum, not sum-then-round).
    input_set: "the single award being issued"
    constants:
      FEDERAL_SHARE_PCT: 0.80
    precision: "whole cents, round_half_up at the per-award step only"

  - name: quiet_zone_risk
    trigger: "quiet zone submit / re-submit; decide reads the pinned values; reinstate and the closure cascade recompute live"
    algorithm: weighted_scoring
    formula: |
      Pinned evaluation order (circular-looking dependency made explicit):
        1. riwh_pre_ssm  = round_half_up(mean(hazard_score over MEMBER crossings), 2)
        2. if riwh_pre_ssm <= NSRT: decision APPROVED, SSM credits irrelevant (checked first)
        3. else per member crossing c: credit_c = min(sum(SSM_EFFECTIVENESS[s] for s in c.ssm_codes), MAX_SSM_CREDIT)
           riwh_post_ssm = round_half_up(mean(hazard_c * (1 - credit_c)), 2)
        4. APPROVED iff riwh_post_ssm <= NSRT;
           else SUPPLEMENT_REQUIRED iff riwh_post_ssm < riwh_pre_ssm;
           else REJECTED (riwh_post_ssm >= riwh_pre_ssm: proposed SSMs make no progress)
      Whether SSMs are needed depends on the post-SSM value, which depends on the chosen SSMs;
      the pinned order (pre-check, then credit computation, then post-check) makes the result well-defined.
    input_set: "QuietZoneCrossing rows of the application with membership_status == MEMBER; live hazard_score of each member crossing"
    constants:
      NSRT: 40.00
      MAX_SSM_CREDIT: 0.75
      SSM_EFFECTIVENESS: { FOUR_QUADRANT_GATES: 0.82, MEDIANS: 0.40, CHANNELIZATION: 0.33, ONE_WAY_STREET: 0.25, WAYSIDE_HORN: 0.15 }
    precision: "2 decimal places, round_half_up"

  - name: closure_incentive_offer
    trigger: "ClosureAgreement creation"
    algorithm: aggregation
    formula: |
      computed_incentive_cents = BASE[closure_type] + min(exposure_index, EXPOSURE_INCENTIVE_CAP) * PER_EXPOSURE_POINT_CENTS
      BASE: CLOSURE 250000 | CONSOLIDATION 175000
      current_offer_cents initialized to computed_incentive_cents.
      Counter rules (state machine): LOCALITY counters must raise (new > current) and stay <= MAX_INCENTIVE_CAP_CENTS;
      DOT counters must lower (new < current) but never below computed_incentive_cents.
    input_set: "the ClosureAgreement being created; exposure_index of its crossing"
    constants:
      BASE_CLOSURE_CENTS: 250000
      BASE_CONSOLIDATION_CENTS: 175000
      PER_EXPOSURE_POINT_CENTS: 5000
      EXPOSURE_INCENTIVE_CAP: 50.0
      MAX_INCENTIVE_CAP_CENTS: 1000000
      MAX_NEGOTIATION_ROUNDS: 6
    precision: "whole cents"

  - name: preemption_timing_check
    trigger: "PreemptionInterconnection transition DRAFT -> TIMING_VERIFIED"
    algorithm: threshold
    formula: |
      approach_seconds                    = ceil(track_approach_distance_ft / (design_train_speed_mph * FPS_PER_MPH))
      required_clearance_green_seconds    = ceil(clear_storage_distance_ft / CLEARANCE_SPEED_FPS)
      required_advance_preemption_seconds = max(0, required_clearance_green_seconds + PREEMPTION_BUFFER_SECONDS - OVERLAP_ALLOWANCE_SECONDS)
      timing_check_pass = (approach_seconds >= MIN_WARNING_SECONDS)
                      AND (track_clearance_green_seconds >= required_clearance_green_seconds)
                      AND (advance_preemption_seconds >= required_advance_preemption_seconds)
      All three comparisons are >= (equality passes). Failure -> ERR_PREEMPTION_TIMING_INADEQUATE, entity stays DRAFT.
    input_set: "the single PreemptionInterconnection being verified"
    constants:
      FPS_PER_MPH: 1.46667
      CLEARANCE_SPEED_FPS: 15.0
      PREEMPTION_BUFFER_SECONDS: 5
      OVERLAP_ALLOWANCE_SECONDS: 10
      MIN_WARNING_SECONDS: 20
    precision: "integer seconds, ceil as shown"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority; first match wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; X-User-Role names a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Acting role is listed in the endpoint's roles (incl. ownership rules: LocalAuthority X-User-ID must equal the target's locality_id where marked; RailroadMaintainer X-User-ID equals railroad_code where marked)"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
    note: "party/ownership mismatches that are business rules use ERR_LOCALITY_MISMATCH / ERR_RESPONSIBILITY_MISMATCH / ERR_COUNTER_TURN / ERR_SELF_ACCEPT_FORBIDDEN at priority 6"
  - priority: 3
    category: existence
    check: "Path ids and body foreign keys exist, validated left-to-right: ERR_CROSSING_NOT_FOUND | ERR_LOCALITY_NOT_FOUND | ERR_TEAM_NOT_FOUND | ERR_REVIEW_NOT_FOUND | ERR_INCIDENT_NOT_FOUND | ERR_PROGRAM_NOT_FOUND | ERR_PROJECT_NOT_FOUND | ERR_AGREEMENT_NOT_FOUND | ERR_QZ_APPLICATION_NOT_FOUND | ERR_QZ_MEMBER_NOT_FOUND | ERR_ASSIGNMENT_NOT_FOUND | ERR_WORK_ORDER_NOT_FOUND | ERR_INTERCONNECTION_NOT_FOUND"
    error_id: ERR_CROSSING_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids or FK-bearing bodies"
  - priority: 4
    category: state
    check: "Target entity is in a from-state the transition allows (ERR_INVALID_STATE_TRANSITION); cross-entity state gates: child creation/award/commission targets an ACTIVE crossing (ERR_CROSSING_NOT_ACTIVE); award requires project in ELIGIBLE | SELECTED (ERR_PROJECT_NOT_SELECTED)"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "all transition and action endpoints"
  - priority: 5
    category: concurrency
    check: "OCC: expected_crossing_version == Crossing.version (PATCH inventory); expected_funding_program_version == FundingProgram.version (award)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: ["PATCH /crossings/{crossingId}/inventory", "POST /upgrade-projects/{projectId}/award"]
  - priority: 6
    category: business_safety
    check: "fouls_track work order requires flagging_vendor at creation (ERR_FLAGGING_PLAN_REQUIRED); IN_WORK requires FLAGGING_CONFIRMED when fouls_track (ERR_FLAGGING_NOT_CONFIRMED); quiet-zone reinstate requires recomputed riwh_post_ssm <= NSRT with >= 1 member (ERR_SSM_INSUFFICIENT); preemption timing check (ERR_PREEMPTION_TIMING_INADEQUATE)"
    error_id: ERR_FLAGGING_PLAN_REQUIRED
    http_status: 422
    applies_to: ["POST /maintenance-work-orders", "POST /maintenance-work-orders/{workOrderId}/transition", "POST /quiet-zone-applications/{qzId}/transition", "POST /preemption-interconnections/{interconnectionId}/transition"]
  - priority: 7
    category: business_constraint
    check: "uniqueness (dot_crossing_number ERR_DUPLICATE_DOT_NUMBER; fiscal_year ERR_DUPLICATE_FISCAL_YEAR); self-consolidation (ERR_SELF_CONSOLIDATION); one non-terminal UpgradeProject per crossing (ERR_ACTIVE_PROJECT_EXISTS); one non-DECOMMISSIONED PreemptionInterconnection per crossing (ERR_ACTIVE_INTERCONNECTION_EXISTS); zone membership conflict (ERR_ZONE_MEMBERSHIP_CONFLICT); CASUALTY severity requires FIELD_INVESTIGATION (ERR_SEVERITY_REQUIRES_FIELD_INVESTIGATION); negotiation round cap (ERR_NEGOTIATION_ROUND_LIMIT); empty zone submit (ERR_EMPTY_ZONE); no fallback assignment on revoke (ERR_NO_FALLBACK_ASSIGNMENT); FRA submit requires fra_reportable (ERR_FRA_NOT_REPORTABLE); commission requires gates (ERR_PREEMPTION_REQUIRES_GATES); party rules (ERR_COUNTER_TURN, ERR_SELF_ACCEPT_FORBIDDEN, ERR_LOCALITY_MISMATCH, ERR_RESPONSIBILITY_MISMATCH); award amount bounds (ERR_AWARD_AMOUNT_INVALID); program close with open projects (ERR_PROGRAM_HAS_OPEN_PROJECTS); window_end after window_start and required fields (ERR_INVALID_REQUEST)"
    error_id: ERR_DUPLICATE_DOT_NUMBER
    http_status: 409
    applies_to: "create/action endpoints as named"
  - priority: 8
    category: business_referential
    check: "work order requires an ACTIVE MaintenanceResponsibilityAssignment for (crossing_id, category) (ERR_RESPONSIBILITY_GAP); quiet-zone submit requires every member crossing to have an ACCEPTED DiagnosticReview (ERR_DIAGNOSTIC_REVIEW_REQUIRED)"
    error_id: ERR_RESPONSIBILITY_GAP
    http_status: 409
    applies_to: ["POST /maintenance-work-orders", "POST /quiet-zone-applications/{qzId}/transition"]
  - priority: 9
    category: business_temporal
    check: "work windows on the same crossing must not overlap under half-open semantics [window_start, window_end) — adjacency (end == start) is allowed (ERR_WORK_WINDOW_OVERLAP); same-team review scheduled_dates must be >= TEAM_REVIEW_MIN_GAP_DAYS (2) apart among non-CANCELLED reviews (ERR_TEAM_SCHEDULE_BUFFER); begin-work only inside the window (ERR_OUTSIDE_WORK_WINDOW); occurred_at after logical clock rejected (ERR_INCIDENT_IN_FUTURE)"
    error_id: ERR_WORK_WINDOW_OVERLAP
    http_status: 409
    applies_to: ["POST /maintenance-work-orders", "POST /diagnostic-reviews", "POST /maintenance-work-orders/{workOrderId}/transition", "POST /incident-reports"]
  - priority: 10
    category: business_fiscal
    check: "effective award <= FundingProgram.available_cents (ERR_INSUFFICIENT_FUNDS); locality counter <= MAX_INCENTIVE_CAP_CENTS (ERR_INCENTIVE_CAP_EXCEEDED); counter direction rules (ERR_INCENTIVE_REGRESSION)"
    error_id: ERR_INSUFFICIENT_FUNDS
    http_status: 402
    applies_to: ["POST /upgrade-projects/{projectId}/award", "POST /closure-agreements/{agreementId}/counter"]

# =============================================================================
# 1.5 API Endpoint Table (55 endpoints)
# =============================================================================
endpoints:
  # --- Crossing inventory ---
  - { method: POST, path: "/crossings", description: "Create a crossing inventory record; computes exposure_index, projected_exposure_index, hazard_score, diagnostic_review_due", roles: [ProgramAdministrator], code: 201, input: [dot_crossing_number, railroad_code, road_authority_locality_id, highway_functional_class, annual_train_count, train_speed_max_mph, aadt, "school_bus_count?", sight_distance_rating, warning_device_class], output: Crossing, side_effects: ["initial status ACTIVE", "computed fields per calculations.exposure_index + hazard_score", "version starts at 1"] }
  - { method: GET, path: "/crossings", description: "List crossings with filters and pagination", roles: [ProgramAdministrator, RailSafetyOfficer, LocalAuthority, RailroadMaintainer], code: 200, input: ["status?", "railroad_code?", "road_authority_locality_id?", "diagnostic_review_due?", "limit?", "offset?"], output: "Crossing[]", side_effects: [] }
  - { method: GET, path: "/crossings/{crossingId}", description: "Get one crossing", roles: [ProgramAdministrator, RailSafetyOfficer, LocalAuthority, RailroadMaintainer], code: 200, input: [], output: Crossing, side_effects: [] }
  - { method: PATCH, path: "/crossings/{crossingId}/inventory", description: "Update inventory counts (OCC on Crossing.version); recomputes exposure_index, projected_exposure_index, hazard_score, diagnostic_review_due", roles: [ProgramAdministrator], code: 200, input: [expected_crossing_version, "annual_train_count?", "aadt?", "school_bus_count?", "sight_distance_rating?", "warning_device_class?", "train_speed_max_mph?"], output: Crossing, side_effects: ["increments Crossing.version by 1", "recomputed derived fields", "ERR_STALE_VERSION on version mismatch"] }
  - { method: POST, path: "/crossings/{crossingId}/confirm-closure", description: "Physically confirm closure (CLOSURE_PENDING -> CLOSED); fires the closure cascade", roles: [ProgramAdministrator], code: 200, input: [], output: Crossing, side_effects: ["junction memberships REMOVED", "affected EFFECTIVE quiet zones recompute and may SUSPEND", "non-terminal work orders CANCELLED", "interconnections DECOMMISSIONED"] }

  # --- Locality / DiagnosticTeam registration ---
  - { method: POST, path: "/localities", description: "Register a locality", roles: [ProgramAdministrator], code: 201, input: [locality_name, state_code, contact_email], output: Locality, side_effects: [] }
  - { method: GET, path: "/localities/{localityId}", description: "Get one locality", roles: [ProgramAdministrator, RailSafetyOfficer, LocalAuthority, RailroadMaintainer], code: 200, input: [], output: Locality, side_effects: [] }
  - { method: POST, path: "/diagnostic-teams", description: "Register a diagnostic review team", roles: [ProgramAdministrator], code: 201, input: [team_name, lead_agency], output: DiagnosticTeam, side_effects: [] }
  - { method: GET, path: "/diagnostic-teams/{teamId}", description: "Get one diagnostic team", roles: [ProgramAdministrator, RailSafetyOfficer, LocalAuthority, RailroadMaintainer], code: 200, input: [], output: DiagnosticTeam, side_effects: [] }

  # --- Diagnostic reviews ---
  - { method: POST, path: "/diagnostic-reviews", description: "Schedule a diagnostic review; enforces the team buffer rule and crossing ACTIVE", roles: [ProgramAdministrator], code: 201, input: [crossing_id, team_id, scheduled_date], output: DiagnosticReview, side_effects: ["ERR_TEAM_SCHEDULE_BUFFER when same team has a non-CANCELLED review < 2 days apart", "ERR_CROSSING_NOT_ACTIVE when crossing not ACTIVE"] }
  - { method: GET, path: "/diagnostic-reviews", description: "List diagnostic reviews (FK reverse-reachability for crossing_id and team_id)", roles: [ProgramAdministrator, RailSafetyOfficer, LocalAuthority, RailroadMaintainer], code: 200, input: ["crossing_id?", "team_id?", "status?", "limit?", "offset?"], output: "DiagnosticReview[]", side_effects: [] }
  - { method: GET, path: "/diagnostic-reviews/{reviewId}", description: "Get one diagnostic review", roles: [ProgramAdministrator, RailSafetyOfficer, LocalAuthority, RailroadMaintainer], code: 200, input: [], output: DiagnosticReview, side_effects: [] }
  - { method: POST, path: "/diagnostic-reviews/{reviewId}/transition", description: "State moves: to_status IN_SESSION | ACCEPTED | CANCELLED per state machine", roles: [ProgramAdministrator, RailSafetyOfficer], code: 200, input: [to_status], output: DiagnosticReview, side_effects: ["ACCEPTED supersedes the prior ACCEPTED review of the same crossing"] }
  - { method: POST, path: "/diagnostic-reviews/{reviewId}/issue-recommendations", description: "IN_SESSION -> RECOMMENDATIONS_ISSUED with the team's recommendation set", roles: [RailSafetyOfficer], code: 200, input: [recommendations], output: DiagnosticReview, side_effects: ["recommendations stored"] }

  # --- Incident investigation & FRA reporting ---
  - { method: POST, path: "/incident-reports", description: "File an incident report at a crossing (REPORTED); computes fra_reportable; occurred_at must not be in the future", roles: [ProgramAdministrator, RailSafetyOfficer, LocalAuthority, RailroadMaintainer], code: 201, input: [crossing_id, occurred_at, severity, "fatalities?", "injuries?", "property_damage_cents?", "train_speed_at_impact_mph?", "narrative?"], output: IncidentReport, side_effects: ["fra_reportable per calculations.fra_reportable", "ERR_INCIDENT_IN_FUTURE when occurred_at > logical clock"] }
  - { method: GET, path: "/incident-reports", description: "List incident reports (FK reverse-reachability for crossing_id)", roles: [ProgramAdministrator, RailSafetyOfficer, LocalAuthority, RailroadMaintainer], code: 200, input: ["crossing_id?", "status?", "limit?", "offset?"], output: "IncidentReport[]", side_effects: [] }
  - { method: GET, path: "/incident-reports/{incidentId}", description: "Get one incident report", roles: [ProgramAdministrator, RailSafetyOfficer, LocalAuthority, RailroadMaintainer], code: 200, input: [], output: IncidentReport, side_effects: [] }
  - { method: POST, path: "/incident-reports/{incidentId}/transition", description: "State moves: to_status SCREENED | REJECTED | FIELD_INVESTIGATION | DESK_REVIEW | FRA_SUBMITTED | CLOSED per state machine (DESK_REVIEW forbidden for CASUALTY)", roles: [RailSafetyOfficer], code: 200, input: [to_status], output: IncidentReport, side_effects: ["FIELD_INVESTIGATION sets crossing.diagnostic_review_due := true", "FRA_SUBMITTED stamps fra_submitted_at"] }
  - { method: POST, path: "/incident-reports/{incidentId}/issue-findings", description: "Issue investigation findings (FIELD_INVESTIGATION | DESK_REVIEW -> FINDINGS_ISSUED); fires the incident cascade", roles: [RailSafetyOfficer], code: 200, input: [findings_summary, warning_devices_functioning], output: IncidentReport, side_effects: ["link 1: crossing incident_count_5yr + hazard_score recomputed", "link 2: ELIGIBLE projects of the crossing revert to PROPOSED with score_stale := true", "link 3: affected programs recompute eligible_demand_cents"] }

  # --- Funding program & upgrade projects ---
  - { method: POST, path: "/funding-programs", description: "Create an annual funding program (OPEN); available_cents initialized to apportionment_cents", roles: [ProgramAdministrator], code: 201, input: [fiscal_year, apportionment_cents, allocation_method], output: FundingProgram, side_effects: ["available_cents := apportionment_cents; encumbered_cents := 0; eligible_demand_cents := 0"] }
  - { method: GET, path: "/funding-programs/{programId}", description: "Get one funding program", roles: [ProgramAdministrator, RailSafetyOfficer, LocalAuthority, RailroadMaintainer], code: 200, input: [], output: FundingProgram, side_effects: [] }
  - { method: POST, path: "/funding-programs/{programId}/transition", description: "to_status ALLOCATION_LOCKED (runs the allocation sweep) | CLOSED (requires no open projects)", roles: [ProgramAdministrator], code: 200, input: [to_status], output: FundingProgram, side_effects: ["ALLOCATION_LOCKED runs calculations.funding_allocation and increments version", "CLOSED guarded by ERR_PROGRAM_HAS_OPEN_PROJECTS"] }
  - { method: POST, path: "/upgrade-projects", description: "Propose a warning-device upgrade project (PROPOSED); crossing must be ACTIVE, target class must differ, one non-terminal project per crossing", roles: [ProgramAdministrator, RailSafetyOfficer], code: 201, input: [crossing_id, program_id, target_device_class, estimated_cost_cents], output: UpgradeProject, side_effects: ["ERR_CROSSING_NOT_ACTIVE", "ERR_ACTIVE_PROJECT_EXISTS", "ERR_INVALID_REQUEST when target_device_class == current class"] }
  - { method: GET, path: "/upgrade-projects", description: "List upgrade projects (FK reverse-reachability for crossing_id and program_id)", roles: [ProgramAdministrator, RailSafetyOfficer, LocalAuthority, RailroadMaintainer], code: 200, input: ["crossing_id?", "program_id?", "status?", "limit?", "offset?"], output: "UpgradeProject[]", side_effects: [] }
  - { method: GET, path: "/upgrade-projects/{projectId}", description: "Get one upgrade project", roles: [ProgramAdministrator, RailSafetyOfficer, LocalAuthority, RailroadMaintainer], code: 200, input: [], output: UpgradeProject, side_effects: [] }
  - { method: POST, path: "/upgrade-projects/{projectId}/transition", description: "State moves: to_status ELIGIBLE (nominate; pins priority_score) | IN_PROGRESS | COMPLETED (installs target device class on the crossing) | WITHDRAWN", roles: [ProgramAdministrator, RailSafetyOfficer], code: 200, input: [to_status], output: UpgradeProject, side_effects: ["ELIGIBLE pins priority_score := crossing.hazard_score", "COMPLETED sets crossing.warning_device_class := target_device_class and reruns the hazard-staleness cascade"] }
  - { method: POST, path: "/upgrade-projects/{projectId}/award", description: "Issue an award (OCC on FundingProgram.version); rolling from ELIGIBLE in OPEN program or from SELECTED after lock", roles: [ProgramAdministrator], code: 200, input: [expected_funding_program_version, "award_cents?"], output: UpgradeProject, side_effects: ["increments FundingProgram.version by 1", "awarded_cents := award_cents (default: tentative_award_cents if SELECTED else estimated_cost_cents)", "federal/state shares per calculations.match_split", "program available/encumbered updated"] }
  - { method: POST, path: "/upgrade-projects/{projectId}/rescind-award", description: "Rescind an AWARDED project (AWARDED -> ELIGIBLE); compensating action restores the pool exactly", roles: [ProgramAdministrator], code: 200, input: [], output: UpgradeProject, side_effects: ["program available_cents += awarded_cents; encumbered_cents -= awarded_cents", "share fields nulled", "FundingProgram.version increments"] }

  # --- Closure / consolidation negotiation ---
  - { method: POST, path: "/closure-agreements", description: "Open a closure/consolidation negotiation (DRAFT); computes the minimum incentive; created_by_party derived from role", roles: [RailSafetyOfficer, LocalAuthority], code: 201, input: [crossing_id, locality_id, closure_type, "consolidation_target_crossing_id?"], output: ClosureAgreement, side_effects: ["computed_incentive_cents per calculations.closure_incentive_offer; current_offer_cents := computed", "ERR_SELF_CONSOLIDATION; ERR_INVALID_REQUEST when target absent for CONSOLIDATION or present for CLOSURE", "ERR_CROSSING_NOT_ACTIVE for either crossing"] }
  - { method: GET, path: "/closure-agreements", description: "List closure agreements (FK reverse-reachability for crossing_id, locality_id, consolidation_target_crossing_id)", roles: [ProgramAdministrator, RailSafetyOfficer, LocalAuthority, RailroadMaintainer], code: 200, input: ["crossing_id?", "locality_id?", "consolidation_target_crossing_id?", "status?", "limit?", "offset?"], output: "ClosureAgreement[]", side_effects: [] }
  - { method: GET, path: "/closure-agreements/{agreementId}", description: "Get one closure agreement", roles: [ProgramAdministrator, RailSafetyOfficer, LocalAuthority, RailroadMaintainer], code: 200, input: [], output: ClosureAgreement, side_effects: [] }
  - { method: POST, path: "/closure-agreements/{agreementId}/transition", description: "State moves: to_status PROPOSED | DOT_ACCEPTED | LOCALITY_RATIFIED | EXECUTED | REJECTED | WITHDRAWN with per-target role and segregation-of-duties rules (1.4 p2/p6/p7)", roles: [ProgramAdministrator, RailSafetyOfficer, LocalAuthority], code: 200, input: [to_status], output: ClosureAgreement, side_effects: ["EXECUTED moves crossing ACTIVE -> CLOSURE_PENDING and increments Crossing.version"] }
  - { method: POST, path: "/closure-agreements/{agreementId}/counter", description: "Counter-offer (PROPOSED <-> COUNTERED cycle); alternation, round cap, direction and cap rules per calculations.closure_incentive_offer", roles: [RailSafetyOfficer, LocalAuthority], code: 200, input: [proposed_incentive_cents], output: ClosureAgreement, side_effects: ["current_offer_cents updated", "negotiation_round += 1", "state flips PROPOSED <-> COUNTERED"] }

  # --- Quiet zones ---
  - { method: POST, path: "/quiet-zone-applications", description: "Create a quiet zone application (DRAFT) for the acting locality", roles: [LocalAuthority], code: 201, input: [locality_id, "notes?"], output: QuietZoneApplication, side_effects: ["ERR_FORBIDDEN_ROLE when X-User-ID != locality_id"] }
  - { method: GET, path: "/quiet-zone-applications", description: "List quiet zone applications (FK reverse-reachability for locality_id)", roles: [ProgramAdministrator, RailSafetyOfficer, LocalAuthority, RailroadMaintainer], code: 200, input: ["locality_id?", "status?", "limit?", "offset?"], output: "QuietZoneApplication[]", side_effects: [] }
  - { method: GET, path: "/quiet-zone-applications/{qzId}", description: "Get one quiet zone application", roles: [ProgramAdministrator, RailSafetyOfficer, LocalAuthority, RailroadMaintainer], code: 200, input: [], output: QuietZoneApplication, side_effects: [] }
  - { method: POST, path: "/quiet-zone-applications/{qzId}/members", description: "Add a member crossing with SSM codes (zone must be DRAFT or SUPPLEMENT_REQUIRED); crossing must be ACTIVE and not a MEMBER of another non-terminal zone", roles: [LocalAuthority], code: 201, input: [crossing_id, "ssm_codes?"], output: QuietZoneCrossing, side_effects: ["ERR_ZONE_MEMBERSHIP_CONFLICT", "ERR_CROSSING_NOT_ACTIVE", "ERR_INVALID_STATE_TRANSITION when zone not editable"] }
  - { method: GET, path: "/quiet-zone-crossings", description: "List zone membership rows (FK reverse-reachability for quiet_zone_application_id and crossing_id)", roles: [ProgramAdministrator, RailSafetyOfficer, LocalAuthority, RailroadMaintainer], code: 200, input: ["quiet_zone_application_id?", "crossing_id?", "limit?", "offset?"], output: "QuietZoneCrossing[]", side_effects: [] }
  - { method: GET, path: "/quiet-zone-crossings/{memberId}", description: "Get one membership row", roles: [ProgramAdministrator, RailSafetyOfficer, LocalAuthority, RailroadMaintainer], code: 200, input: [], output: QuietZoneCrossing, side_effects: [] }
  - { method: DELETE, path: "/quiet-zone-crossings/{memberId}", description: "Remove a member while the zone is DRAFT | SUPPLEMENT_REQUIRED (owner locality only)", roles: [LocalAuthority], code: 204, input: [], output: null, side_effects: ["membership_status := REMOVED"] }
  - { method: POST, path: "/quiet-zone-applications/{qzId}/transition", description: "State moves: to_status SUBMITTED (owner; full submit validation + riwh pinning) | UNDER_REVIEW (officer) | EFFECTIVE (owner activate / officer reinstate) | SUSPENDED (officer) | WITHDRAWN (owner)", roles: [LocalAuthority, RailSafetyOfficer], code: 200, input: [to_status], output: QuietZoneApplication, side_effects: ["SUBMITTED pins riwh_pre_ssm / riwh_post_ssm", "reinstate recomputes riwh and requires <= NSRT"] }
  - { method: POST, path: "/quiet-zone-applications/{qzId}/decide", description: "Officer decision on an UNDER_REVIEW application; outcome computed by calculations.quiet_zone_risk (APPROVED | SUPPLEMENT_REQUIRED | REJECTED)", roles: [RailSafetyOfficer], code: 200, input: [], output: QuietZoneApplication, side_effects: ["status set per decision table"] }

  # --- Maintenance responsibility & work coordination ---
  - { method: POST, path: "/maintenance-assignments", description: "Create a maintenance responsibility assignment; supersedes the current ACTIVE row for (crossing_id, category)", roles: [ProgramAdministrator], code: 201, input: [crossing_id, category, responsible_party, effective_from], output: MaintenanceResponsibilityAssignment, side_effects: ["prior ACTIVE assignment for (crossing_id, category) -> SUPERSEDED", "ERR_CROSSING_NOT_ACTIVE"] }
  - { method: GET, path: "/maintenance-assignments", description: "List assignments (FK reverse-reachability for crossing_id)", roles: [ProgramAdministrator, RailSafetyOfficer, LocalAuthority, RailroadMaintainer], code: 200, input: ["crossing_id?", "category?", "status?", "limit?", "offset?"], output: "MaintenanceResponsibilityAssignment[]", side_effects: [] }
  - { method: GET, path: "/maintenance-assignments/{assignmentId}", description: "Get one assignment", roles: [ProgramAdministrator, RailSafetyOfficer, LocalAuthority, RailroadMaintainer], code: 200, input: [], output: MaintenanceResponsibilityAssignment, side_effects: [] }
  - { method: POST, path: "/maintenance-assignments/{assignmentId}/revoke", description: "Revoke the ACTIVE assignment; reinstates the most recently superseded row for (crossing_id, category)", roles: [ProgramAdministrator], code: 200, input: [], output: MaintenanceResponsibilityAssignment, side_effects: ["fallback selector: SUPERSEDED row with greatest updated_at (tie: greatest created_at) -> ACTIVE", "ERR_NO_FALLBACK_ASSIGNMENT when none"] }
  - { method: POST, path: "/maintenance-work-orders", description: "Plan a work window; requires ACTIVE responsibility assignment (creator must match the responsible party), half-open overlap rule per crossing, flagging plan when fouls_track", roles: [RailroadMaintainer, LocalAuthority], code: 201, input: [crossing_id, category, window_start, window_end, fouls_track, "flagging_vendor?"], output: MaintenanceWorkOrder, side_effects: ["responsible_party copied from the ACTIVE assignment", "ERR_RESPONSIBILITY_GAP / ERR_RESPONSIBILITY_MISMATCH / ERR_WORK_WINDOW_OVERLAP / ERR_FLAGGING_PLAN_REQUIRED"] }
  - { method: GET, path: "/maintenance-work-orders", description: "List work orders (FK reverse-reachability for crossing_id)", roles: [ProgramAdministrator, RailSafetyOfficer, LocalAuthority, RailroadMaintainer], code: 200, input: ["crossing_id?", "status?", "limit?", "offset?"], output: "MaintenanceWorkOrder[]", side_effects: [] }
  - { method: GET, path: "/maintenance-work-orders/{workOrderId}", description: "Get one work order", roles: [ProgramAdministrator, RailSafetyOfficer, LocalAuthority, RailroadMaintainer], code: 200, input: [], output: MaintenanceWorkOrder, side_effects: [] }
  - { method: POST, path: "/maintenance-work-orders/{workOrderId}/transition", description: "State moves: to_status FLAGGING_CONFIRMED (railroad only) | IN_WORK (flagging + window gates) | COMPLETED | CANCELLED", roles: [RailroadMaintainer, LocalAuthority], code: 200, input: [to_status], output: MaintenanceWorkOrder, side_effects: ["IN_WORK requires clock within [window_start, window_end)"] }

  # --- Signal preemption with traffic control ---
  - { method: POST, path: "/preemption-interconnections", description: "Register a signal-preemption interconnection design (DRAFT); computes approach/required timing fields", roles: [ProgramAdministrator], code: 201, input: [crossing_id, traffic_signal_ref, track_approach_distance_ft, design_train_speed_mph, clear_storage_distance_ft, advance_preemption_seconds, track_clearance_green_seconds], output: PreemptionInterconnection, side_effects: ["computed fields per calculations.preemption_timing_check", "ERR_ACTIVE_INTERCONNECTION_EXISTS when a non-DECOMMISSIONED interconnection exists for the crossing", "ERR_CROSSING_NOT_ACTIVE"] }
  - { method: GET, path: "/preemption-interconnections", description: "List interconnections (FK reverse-reachability for crossing_id)", roles: [ProgramAdministrator, RailSafetyOfficer, LocalAuthority, RailroadMaintainer], code: 200, input: ["crossing_id?", "status?", "limit?", "offset?"], output: "PreemptionInterconnection[]", side_effects: [] }
  - { method: GET, path: "/preemption-interconnections/{interconnectionId}", description: "Get one interconnection", roles: [ProgramAdministrator, RailSafetyOfficer, LocalAuthority, RailroadMaintainer], code: 200, input: [], output: PreemptionInterconnection, side_effects: [] }
  - { method: POST, path: "/preemption-interconnections/{interconnectionId}/transition", description: "State moves: to_status TIMING_VERIFIED (runs the timing check, ERR_PREEMPTION_TIMING_INADEQUATE on failure) | COMMISSIONED (requires gates) | DECOMMISSIONED", roles: [ProgramAdministrator, RailSafetyOfficer], code: 200, input: [to_status], output: PreemptionInterconnection, side_effects: ["TIMING_VERIFIED sets timing_check_pass", "COMMISSIONED requires warning_device_class in {GATES, FOUR_QUADRANT_GATES}"] }

  # --- Test-driving clock ---
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the logical clock. Startup default is exactly 2026-08-01T00:00:00Z; before any set call the clock reads this default and NEVER falls back to wall-clock time", roles: [ProgramAdministrator], code: 200, input: [to_iso8601], output: "{ current_utc: datetime }", side_effects: ["logical clock advanced; all window/expiry rules read this clock"] }

# =============================================================================
# 1.6 Error Code Catalog (43 codes)
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role or X-User-ID header missing, or role not a declared role" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Acting role is not in the endpoint's role list (incl. LocalAuthority acting for a locality it is not, at creation time)" }
  - { id: ERR_CROSSING_NOT_FOUND, http: 404, condition: "crossingId path segment or crossing_id body FK does not exist" }
  - { id: ERR_LOCALITY_NOT_FOUND, http: 404, condition: "localityId path segment or locality FK (road_authority_locality_id, locality_id) does not exist" }
  - { id: ERR_TEAM_NOT_FOUND, http: 404, condition: "teamId path segment or team_id body FK does not exist" }
  - { id: ERR_REVIEW_NOT_FOUND, http: 404, condition: "reviewId path segment does not exist" }
  - { id: ERR_INCIDENT_NOT_FOUND, http: 404, condition: "incidentId path segment does not exist" }
  - { id: ERR_PROGRAM_NOT_FOUND, http: 404, condition: "programId path segment or program_id body FK does not exist" }
  - { id: ERR_PROJECT_NOT_FOUND, http: 404, condition: "projectId path segment does not exist" }
  - { id: ERR_AGREEMENT_NOT_FOUND, http: 404, condition: "agreementId path segment does not exist" }
  - { id: ERR_QZ_APPLICATION_NOT_FOUND, http: 404, condition: "qzId path segment does not exist" }
  - { id: ERR_QZ_MEMBER_NOT_FOUND, http: 404, condition: "memberId path segment does not exist" }
  - { id: ERR_ASSIGNMENT_NOT_FOUND, http: 404, condition: "assignmentId path segment does not exist" }
  - { id: ERR_WORK_ORDER_NOT_FOUND, http: 404, condition: "workOrderId path segment does not exist" }
  - { id: ERR_INTERCONNECTION_NOT_FOUND, http: 404, condition: "interconnectionId path segment does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, type mismatch, unknown field, invalid enum, window_end <= window_start, missing/incorrect consolidation target for the closure_type, negative counts, target_device_class equal to current class, empty recommendations" }
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "The entity's current state is not a declared from-state for the requested to_status / action (incl. terminal-state lockdown and program OPEN/ALLOCATION_LOCKED gates)" }
  - { id: ERR_CROSSING_NOT_ACTIVE, http: 409, condition: "Operation requires Crossing.status == ACTIVE (child creation, nominate, review accept, commission, member add, agreement create)" }
  - { id: ERR_PROJECT_NOT_SELECTED, http: 409, condition: "Award requires the project to be in ELIGIBLE or SELECTED status" }
  - { id: ERR_PROGRAM_HAS_OPEN_PROJECTS, http: 409, condition: "Program close attempted while projects remain in SELECTED | AWARDED | IN_PROGRESS" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC mismatch: expected_*_version does not equal the parent entity's current version" }
  - { id: ERR_FLAGGING_PLAN_REQUIRED, http: 422, condition: "fouls_track == true but flagging_vendor absent at work-order creation (business_safety, beats temporal overlap at priority 6 vs 9)" }
  - { id: ERR_FLAGGING_NOT_CONFIRMED, http: 409, condition: "IN_WORK requested for a fouls_track work order still in PLANNED" }
  - { id: ERR_SSM_INSUFFICIENT, http: 409, condition: "Quiet-zone reinstate: recomputed riwh_post_ssm > NSRT or no MEMBER rows remain" }
  - { id: ERR_PREEMPTION_TIMING_INADEQUATE, http: 422, condition: "preemption_timing_check failed (approachSeconds < 20, or green < required, or advance < required); entity stays DRAFT" }
  - { id: ERR_PREEMPTION_REQUIRES_GATES, http: 409, condition: "Commission requires crossing.warning_device_class in {GATES, FOUR_QUADRANT_GATES}" }
  - { id: ERR_ACTIVE_INTERCONNECTION_EXISTS, http: 409, condition: "A non-DECOMMISSIONED PreemptionInterconnection already exists for the crossing" }
  - { id: ERR_DUPLICATE_DOT_NUMBER, http: 409, condition: "dot_crossing_number already exists" }
  - { id: ERR_DUPLICATE_FISCAL_YEAR, http: 409, condition: "A FundingProgram with this fiscal_year already exists" }
  - { id: ERR_SELF_CONSOLIDATION, http: 422, condition: "consolidation_target_crossing_id == crossing_id" }
  - { id: ERR_ACTIVE_PROJECT_EXISTS, http: 409, condition: "A non-terminal UpgradeProject (PROPOSED | ELIGIBLE | SELECTED | AWARDED | IN_PROGRESS) already exists for the crossing" }
  - { id: ERR_NO_FALLBACK_ASSIGNMENT, http: 409, condition: "Revoke requested but no SUPERSEDED assignment exists for (crossing_id, category) to reinstate" }
  - { id: ERR_FRA_NOT_REPORTABLE, http: 409, condition: "FRA_SUBMITTED requires fra_reportable == true" }
  - { id: ERR_SEVERITY_REQUIRES_FIELD_INVESTIGATION, http: 422, condition: "CASUALTY incidents must be assigned FIELD_INVESTIGATION, not DESK_REVIEW" }
  - { id: ERR_NEGOTIATION_ROUND_LIMIT, http: 409, condition: "counter attempted when negotiation_round >= 6" }
  - { id: ERR_EMPTY_ZONE, http: 422, condition: "Quiet-zone submit with zero MEMBER rows" }
  - { id: ERR_ZONE_MEMBERSHIP_CONFLICT, http: 409, condition: "Crossing is already a MEMBER of another zone whose status is not REJECTED | WITHDRAWN" }
  - { id: ERR_COUNTER_TURN, http: 403, condition: "Counter attempted by the same party that tabled the current offer" }
  - { id: ERR_SELF_ACCEPT_FORBIDDEN, http: 403, condition: "Segregation of duties: the RailSafetyOfficer who tabled the current DOT offer may not accept it" }
  - { id: ERR_LOCALITY_MISMATCH, http: 403, condition: "Acting LocalAuthority X-User-ID does not equal the resource's locality_id" }
  - { id: ERR_RESPONSIBILITY_MISMATCH, http: 403, condition: "Actor does not match the work order's responsible_party (railroad code or road-authority locality)" }
  - { id: ERR_RESPONSIBILITY_GAP, http: 409, condition: "No ACTIVE MaintenanceResponsibilityAssignment for (crossing_id, category)" }
  - { id: ERR_DIAGNOSTIC_REVIEW_REQUIRED, http: 409, condition: "Quiet-zone submit: a member crossing lacks an ACCEPTED DiagnosticReview" }
  - { id: ERR_WORK_WINDOW_OVERLAP, http: 409, condition: "Half-open overlap with a non-terminal work order on the same crossing (adjacency allowed)" }
  - { id: ERR_TEAM_SCHEDULE_BUFFER, http: 409, condition: "Same team has a non-CANCELLED review < 2 days from the requested scheduled_date" }
  - { id: ERR_OUTSIDE_WORK_WINDOW, http: 409, condition: "begin-work attempted with the logical clock outside [window_start, window_end)" }
  - { id: ERR_INCIDENT_IN_FUTURE, http: 422, condition: "occurred_at is after the logical clock" }
  - { id: ERR_INSUFFICIENT_FUNDS, http: 402, condition: "Effective award exceeds FundingProgram.available_cents" }
  - { id: ERR_AWARD_AMOUNT_INVALID, http: 422, condition: "award_cents < 1 or > estimated_cost_cents" }
  - { id: ERR_INCENTIVE_CAP_EXCEEDED, http: 422, condition: "Counter above MAX_INCENTIVE_CAP_CENTS (1000000)" }
  - { id: ERR_INCENTIVE_REGRESSION, http: 422, condition: "Locality counter not above current offer, or DOT counter not below current offer / below computed_incentive_cents" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ProgramAdministrator
    description: "State DOT rail safety office administrator; owns inventory, programs, assignments, interconnection registration, closure execution, and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /crossings, PATCH /crossings/{id}/inventory, POST /crossings/{id}/confirm-closure"
      - "POST /localities, POST /diagnostic-teams, POST /diagnostic-reviews"
      - "POST /funding-programs, POST /funding-programs/{id}/transition"
      - "POST /upgrade-projects/{id}/award, POST /upgrade-projects/{id}/rescind-award"
      - "POST /maintenance-assignments, POST /maintenance-assignments/{id}/revoke"
      - "POST /preemption-interconnections, POST /_clock/set_current_utc"
      - "ClosureAgreement to_status=EXECUTED"
    shared_operations:
      - "All GET list/detail endpoints"
      - "POST /incident-reports (any role may file a report)"
      - "POST /upgrade-projects and POST /upgrade-projects/{id}/transition (shared with RailSafetyOfficer)"
      - "POST /diagnostic-reviews/{id}/transition (shared with RailSafetyOfficer)"
      - "POST /preemption-interconnections/{id}/transition (shared with RailSafetyOfficer)"
  - name: RailSafetyOfficer
    description: "State DOT rail safety officer; runs diagnostic reviews and incident investigations, decides quiet zones, negotiates closures for the DOT"
    identity: opaque
    exclusive_operations:
      - "POST /diagnostic-reviews/{id}/issue-recommendations"
      - "POST /incident-reports/{id}/transition, POST /incident-reports/{id}/issue-findings"
      - "POST /quiet-zone-applications/{id}/decide"
      - "Quiet-zone to_status UNDER_REVIEW | SUSPENDED | EFFECTIVE (reinstate)"
    shared_operations:
      - "All GET list/detail endpoints"
      - "POST /incident-reports"
      - "POST /closure-agreements, /counter, and to_status PROPOSED | DOT_ACCEPTED | WITHDRAWN (DOT side)"
      - "POST /upgrade-projects and POST /upgrade-projects/{id}/transition (shared with ProgramAdministrator)"
      - "POST /diagnostic-reviews/{id}/transition (shared with ProgramAdministrator)"
      - "POST /preemption-interconnections/{id}/transition (shared with ProgramAdministrator)"
  - name: LocalAuthority
    description: "Locality (city/county) public authority; applies for quiet zones, negotiates closures, performs road-authority maintenance"
    identity: "entity_backed:Locality"
    exclusive_operations:
      - "POST /quiet-zone-applications, POST /quiet-zone-applications/{id}/members, DELETE /quiet-zone-crossings/{id}"
      - "Quiet-zone to_status SUBMITTED | WITHDRAWN | EFFECTIVE (activate)"
      - "Closure to_status LOCALITY_RATIFIED | REJECTED"
    shared_operations:
      - "All GET list/detail endpoints"
      - "POST /incident-reports"
      - "POST /closure-agreements (creates with created_by_party=LOCALITY), /counter (locality turn), to_status WITHDRAWN when creator"
      - "POST /maintenance-work-orders and /transition for ROAD_AUTHORITY-responsible work on crossings where road_authority_locality_id == X-User-ID"
  - name: RailroadMaintainer
    description: "Railroad maintenance organization; X-User-ID carries the railroad reporting code and must equal crossing.railroad_code for railroad-side work and flagging"
    identity: opaque
    exclusive_operations:
      - "MaintenanceWorkOrder to_status=FLAGGING_CONFIRMED (flagging is always railroad-provided)"
    shared_operations:
      - "All GET list/detail endpoints"
      - "POST /incident-reports"
      - "POST /maintenance-work-orders and /transition for RAILROAD-responsible work on crossings where railroad_code == X-User-ID"
