            - "one wrong facet empties each collection - GET /drone-ops/pilots?status=SUSPENDED, GET /drone-ops/knowledge-tests?pilot_id=${pb}, GET /drone-ops/aircraft?registration_status=GROUNDED, GET /drone-ops/remote-id-modules?status=EXPIRED, GET /drone-ops/airspace-zones?class_code=G, GET /drone-ops/airspace-authorizations?status=APPROVED, GET /drone-ops/waivers?status=APPROVED, GET /drone-ops/safety-cases?review_status=CLEARED and GET /drone-ops/insurance-policies?coverage_status=EXPIRED each return total_count 0 with an empty data array rather than an error"

  - section: errors
    instances:
      - name: every_not_found_error_id_is_triggerable_with_an_unknown_id
        claim_type: triggerable
        grounds:
          - errors.ERR_PILOT_NOT_FOUND
          - errors.ERR_KNOWLEDGE_TEST_NOT_FOUND
          - errors.ERR_CERTIFICATION_NOT_FOUND
          - errors.ERR_AIRCRAFT_NOT_FOUND
          - errors.ERR_MODULE_NOT_FOUND
          - errors.ERR_ZONE_NOT_FOUND
          - errors.ERR_AUTHORIZATION_NOT_FOUND
          - errors.ERR_WAIVER_NOT_FOUND
          - errors.ERR_SAFETY_CASE_NOT_FOUND
          - errors.ERR_POLICY_NOT_FOUND
          - errors.ERR_FLIGHT_NOT_FOUND
          - errors.ERR_REPORT_NOT_FOUND
          - errors.ERR_TFR_NOT_FOUND
          - validations.priority_6
        distinguishing_aspect: |
          §1.6 declares thirteen distinct existence errors and §1.4 priority 6 says the error_id
          must name the entity of the failing segment. One read per entity against an unknown id
          proves each code is reachable and, more importantly, that they are not collapsed into a
          single generic 404. Two body-FK probes extend the same rule to priority 9, where the
          unresolved id arrives in the payload rather than the path.
        test_recipe:
          setup:
            - "Empty database; logical clock at 2026-01-05T00:00:00Z. No row of any kind is created."
            - "One unknown id per entity, all well-formed and none of them stored."
          setup_api_calls:
            - call: "POST /drone-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: ComplianceOfficer
          trigger:
            - call: "GET /drone-ops/pilots/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: ComplianceOfficer
              captures: { e_pilot: $.data.error_id }
            - call: "GET /drone-ops/knowledge-tests/00000000-0000-4000-8000-000000000002"
              payload: {}
              as: ComplianceOfficer
              captures: { e_test: $.data.error_id }
            - call: "GET /drone-ops/certifications/00000000-0000-4000-8000-000000000003"
              payload: {}
              as: ComplianceOfficer
              captures: { e_cert: $.data.error_id }
            - call: "GET /drone-ops/aircraft/00000000-0000-4000-8000-000000000004"
              payload: {}
              as: ComplianceOfficer
              captures: { e_aircraft: $.data.error_id }
            - call: "GET /drone-ops/remote-id-modules/00000000-0000-4000-8000-000000000005"
              payload: {}
              as: ComplianceOfficer
              captures: { e_module: $.data.error_id }
            - call: "GET /drone-ops/airspace-zones/00000000-0000-4000-8000-000000000006"
              payload: {}
              as: ComplianceOfficer
              captures: { e_zone: $.data.error_id }
            - call: "GET /drone-ops/airspace-authorizations/00000000-0000-4000-8000-000000000007"
              payload: {}
              as: ComplianceOfficer
              captures: { e_auth: $.data.error_id }
            - call: "GET /drone-ops/waivers/00000000-0000-4000-8000-000000000008"
              payload: {}
              as: ComplianceOfficer
              captures: { e_waiver: $.data.error_id }
            - call: "GET /drone-ops/safety-cases/00000000-0000-4000-8000-000000000009"
              payload: {}
              as: ComplianceOfficer
              captures: { e_case: $.data.error_id }
            - call: "GET /drone-ops/insurance-policies/00000000-0000-4000-8000-000000000010"
              payload: {}
              as: ComplianceOfficer
              captures: { e_policy: $.data.error_id }
            - call: "GET /drone-ops/flights/00000000-0000-4000-8000-000000000011"
              payload: {}
              as: ComplianceOfficer
              captures: { e_flight: $.data.error_id }
            - call: "GET /drone-ops/accident-reports/00000000-0000-4000-8000-000000000012"
              payload: {}
              as: ComplianceOfficer
              captures: { e_report: $.data.error_id }
            - call: "GET /drone-ops/tfrs/00000000-0000-4000-8000-000000000013"
              payload: {}
              as: ComplianceOfficer
              captures: { e_tfr: $.data.error_id }
            - call: "POST /drone-ops/pilots/00000000-0000-4000-8000-000000000014/knowledge-tests"
              payload: { test_code: "TRUST_RECREATIONAL", scheduled_at: "2026-01-06T00:00:00Z" }
              as: ComplianceOfficer
              captures: { e_path_parent: $.data.error_id }
            - call: "POST /drone-ops/aircraft"
              payload: { owner_pilot_id: "00000000-0000-4000-8000-000000000015", model: "Ghost 1", serial_number: "SN-GHOST-01", takeoff_weight_g: 249, max_altitude_ft: 900 }
              as: ComplianceOfficer
              captures: { e_body_fk: $.data.error_id }
          assert:
            - "every call returns HTTP 404 with response_type \"error\" and a non-empty data.message"
            - "${e_pilot} == \"ERR_PILOT_NOT_FOUND\", ${e_test} == \"ERR_KNOWLEDGE_TEST_NOT_FOUND\", ${e_cert} == \"ERR_CERTIFICATION_NOT_FOUND\""
            - "${e_aircraft} == \"ERR_AIRCRAFT_NOT_FOUND\", ${e_module} == \"ERR_MODULE_NOT_FOUND\", ${e_zone} == \"ERR_ZONE_NOT_FOUND\""
            - "${e_auth} == \"ERR_AUTHORIZATION_NOT_FOUND\", ${e_waiver} == \"ERR_WAIVER_NOT_FOUND\", ${e_case} == \"ERR_SAFETY_CASE_NOT_FOUND\""
            - "${e_policy} == \"ERR_POLICY_NOT_FOUND\", ${e_flight} == \"ERR_FLIGHT_NOT_FOUND\", ${e_report} == \"ERR_REPORT_NOT_FOUND\", ${e_tfr} == \"ERR_TFR_NOT_FOUND\""
            - "${e_path_parent} == \"ERR_PILOT_NOT_FOUND\" - the parent segment of a nested create is validated before the body"
            - "${e_body_fk} == \"ERR_PILOT_NOT_FOUND\" - priority 9 names the unresolved entity from a body FK, and does not answer ERR_AIRCRAFT_NOT_FOUND for the row being created"
            - "all thirteen ids are distinct: an implementation returning one shared ERR_NOT_FOUND fails this instance"

      - name: every_uniqueness_error_id_is_triggerable_and_scoped_as_declared
        claim_type: triggerable
        grounds:
          - errors.ERR_DUPLICATE_PILOT_EMAIL
          - errors.ERR_DUPLICATE_AIRCRAFT_SERIAL
          - errors.ERR_DUPLICATE_MODULE_SERIAL
          - errors.ERR_DUPLICATE_ZONE_DESIGNATOR
          - errors.ERR_DUPLICATE_POLICY_NUMBER
          - validations.priority_10
        distinguishing_aspect: |
          All five uniqueness codes are triggered, and three of them are scoped rather than
          global: serial_number is unique within owner_pilot_id, module_serial within aircraft_id
          and policy_number within pilot_id. The instance therefore pairs each duplicate with a
          control that reuses the same string in a different scope and must succeed - so an
          implementation with a global unique index fails on the controls, and one with no index
          fails on the duplicates. Pilot email is additionally probed case-insensitively.
        test_recipe:
          setup:
            - "Logical clock at 2026-03-15T00:00:00Z."
            - "Pilot P1 (dup.owner@example.com) and Pilot P2 (second.owner@example.com), both COMMERCIAL."
            - "Airframe A1 under P1 with serial_number SN-DUP-01 carrying module MOD-DUP-01; airframe A2 under P1 with serial_number SN-DUP-02."
            - "Zone ZONE-DUP and one InsurancePolicy POL-DUP-01 under P1."
          setup_api_calls:
            - call: "POST /drone-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-15T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /drone-ops/pilots"
              payload: { full_name: "Dup Owner", email: "dup.owner@example.com", operator_category: "COMMERCIAL" }
              as: ComplianceOfficer
              captures: { p1: $.data.id }
            - call: "POST /drone-ops/pilots"
              payload: { full_name: "Second Owner", email: "second.owner@example.com", operator_category: "COMMERCIAL" }
              as: ComplianceOfficer
              captures: { p2: $.data.id }
            - call: "POST /drone-ops/aircraft"
              payload: { owner_pilot_id: "${p1}", model: "Dup 1", serial_number: "SN-DUP-01", takeoff_weight_g: 900, max_altitude_ft: 1200 }
              as: ComplianceOfficer
              captures: { a1: $.data.id }
            - call: "POST /drone-ops/aircraft"
              payload: { owner_pilot_id: "${p1}", model: "Dup 2", serial_number: "SN-DUP-02", takeoff_weight_g: 900, max_altitude_ft: 1200 }
              as: ComplianceOfficer
              captures: { a2: $.data.id }
            - call: "POST /drone-ops/aircraft/${a1}/remote-id-modules"
              payload: { module_serial: "MOD-DUP-01", broadcast_protocol: "BLUETOOTH_LE", firmware_version: "1.0.0" }
              as: ComplianceOfficer
              captures: { m1: $.data.id }
            - call: "POST /drone-ops/airspace-zones"
              payload: { designator: "ZONE-DUP", class_code: "G", class_ceiling_ft: 400, requires_authorization: false, max_concurrent_authorizations: 2 }
              as: AirspaceAuthority
              captures: { z1: $.data.id }
            - call: "POST /drone-ops/insurance-policies"
              payload: { pilot_id: "${p1}", insurer_name: "Dup Mutual", policy_number: "POL-DUP-01", coverage_limit_cents: 2000000, deductible_cents: 50000, effective_from: "2026-03-15T00:00:00Z", effective_until: "2027-03-15T00:00:00Z", indemnification_clause_accepted: true }
              as: ComplianceOfficer
              captures: { pol1: $.data.id }
          trigger:
            - call: "POST /drone-ops/pilots"
              payload: { full_name: "Case Twin", email: "DUP.OWNER@EXAMPLE.COM", operator_category: "RECREATIONAL" }
              as: ComplianceOfficer
              captures: { e_email: $.data.error_id }
            - call: "POST /drone-ops/aircraft"
              payload: { owner_pilot_id: "${p1}", model: "Dup 3", serial_number: "SN-DUP-01", takeoff_weight_g: 249, max_altitude_ft: 900 }
              as: ComplianceOfficer
              captures: { e_serial: $.data.error_id }
            - call: "POST /drone-ops/aircraft"
              payload: { owner_pilot_id: "${p2}", model: "Dup 4", serial_number: "SN-DUP-01", takeoff_weight_g: 249, max_altitude_ft: 900 }
              as: ComplianceOfficer
              captures: { ok_serial: $.data.id }
            - call: "POST /drone-ops/aircraft/${a1}/remote-id-modules"
              payload: { module_serial: "MOD-DUP-01", broadcast_protocol: "WIFI_NAN", firmware_version: "1.0.1" }
              as: ComplianceOfficer
              captures: { e_module: $.data.error_id }
            - call: "POST /drone-ops/aircraft/${a2}/remote-id-modules"
              payload: { module_serial: "MOD-DUP-01", broadcast_protocol: "WIFI_NAN", firmware_version: "1.0.1" }
              as: ComplianceOfficer
              captures: { ok_module: $.data.id }
            - call: "POST /drone-ops/airspace-zones"
              payload: { designator: "ZONE-DUP", class_code: "D", class_ceiling_ft: 500, requires_authorization: true, max_concurrent_authorizations: 1 }
              as: AirspaceAuthority
              captures: { e_zone: $.data.error_id }
            - call: "POST /drone-ops/insurance-policies"
              payload: { pilot_id: "${p1}", insurer_name: "Other Mutual", policy_number: "POL-DUP-01", coverage_limit_cents: 3000000, deductible_cents: 0, effective_from: "2026-03-15T00:00:00Z", effective_until: "2027-03-15T00:00:00Z", indemnification_clause_accepted: true }
              as: ComplianceOfficer
              captures: { e_policy: $.data.error_id }
            - call: "POST /drone-ops/insurance-policies"
              payload: { pilot_id: "${p2}", insurer_name: "Other Mutual", policy_number: "POL-DUP-01", coverage_limit_cents: 3000000, deductible_cents: 0, effective_from: "2026-03-15T00:00:00Z", effective_until: "2027-03-15T00:00:00Z", indemnification_clause_accepted: true }
              as: ComplianceOfficer
              captures: { ok_policy: $.data.id }
          assert:
            - "${e_email} == \"ERR_DUPLICATE_PILOT_EMAIL\" at HTTP 409 - the comparison is case-insensitive, so an upper-cased address is still the same pilot"
            - "${e_serial} == \"ERR_DUPLICATE_AIRCRAFT_SERIAL\" at 409, while ${ok_serial} is a new id - the same serial under P2 is legal because the scope is owner_pilot_id"
            - "${e_module} == \"ERR_DUPLICATE_MODULE_SERIAL\" at 409, while ${ok_module} is a new id - the same module_serial on A2 is legal because the scope is aircraft_id"
            - "${e_zone} == \"ERR_DUPLICATE_ZONE_DESIGNATOR\" at 409 - designator is the one globally unique key, so no control call can succeed"
            - "${e_policy} == \"ERR_DUPLICATE_POLICY_NUMBER\" at 409, while ${ok_policy} is a new id - the same policy_number under P2 is legal because the scope is pilot_id"
            - "no duplicate call wrote a row: P1 still has exactly two airframes, A1 exactly one module, and P1 exactly one policy"

      - name: repeat_actions_and_malformed_windows_are_rejected_with_their_own_codes
        claim_type: triggerable
        grounds:
          - errors.ERR_TEST_ALREADY_GRADED
          - errors.ERR_POLICY_INVALID_STATE
          - errors.ERR_FLIGHT_INVALID_STATE
          - errors.ERR_TFR_INVALID_STATE
          - errors.ERR_CLOCK_REWIND_FORBIDDEN
          - errors.ERR_INVALID_WINDOW
        distinguishing_aspect: |
          Six codes that only a second attempt or a malformed interval can reach, each carrying
          the name of the entity that blocks it rather than a shared conflict code. The clock
          probe uses an equal timestamp, not an earlier one, because the guard is declared as
          "at or before"; the window probes cover all three declared interval fields plus the
          flight-specific rule that planned_start may not precede the logical clock.
        test_recipe:
          setup:
            - "Logical clock at 2026-02-01T00:00:00Z."
            - "One RECREATIONAL pilot CERTIFIED via a graded TRUST_RECREATIONAL test, one REGISTERED 249 g airframe, one uncontrolled class G zone."
            - "One InsurancePolicy already verified ACTIVE and one TemporaryFlightRestriction already LIFTED."
            - "One PLANNED flight that is then CANCELLED."
          setup_api_calls:
            - call: "POST /drone-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /drone-ops/pilots"
              payload: { full_name: "Ivo Renk", email: "ivo.renk@example.com", operator_category: "RECREATIONAL" }
