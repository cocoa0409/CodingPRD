              as: StoreOperationsAdmin
              captures: { ladder_id: $.data.id }
            - call: "POST /fresh/markdown-ladders/${ladder_id}/activate"
              payload: {}
              as: StoreOperationsAdmin
            - call: "POST /fresh/departments"
              payload: { store_id: "${store_id}", markdown_ladder_id: "${ladder_id}", code: "PRODUCE", shelf_life_days_default: 5 }
              as: StoreOperationsAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /fresh/items"
              payload: { department_id: "${dept_id}", upc: "000444555666", description: "Blueberries 6oz", base_retail_cents: 599, unit_cost_cents: 300, daily_forecast_units: 8.00 }
              as: DepartmentManager
              captures: { item_id: $.data.id }
            - call: "POST /fresh/lots"
              payload: { item_id: "${item_id}", production_date: "2026-08-10", quantity_original: 10 }
              as: FreshClerk
              captures: { lot_id: $.data.id }
            - call: "POST /fresh/donation-pickups"
              payload: { store_id: "${store_id}", partner_id: "${partner_id}", dock_door_code: "D1", scheduled_window_start: "2026-08-13T14:00:00.000Z", scheduled_window_end: "2026-08-13T15:00:00.000Z" }
              as: DepartmentManager
              captures: { pickup_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-12T23:59:59.999Z" }
              as: StoreOperationsAdmin
          trigger:
            - call: "POST /fresh/donation-pickups/${pickup_id}/assignments"
              payload: { lot_id: "${lot_id}", quantity_units: 10 }
              as: FreshClerk
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-13T00:00:00.000Z" }
              as: StoreOperationsAdmin
            - call: "POST /fresh/donation-pickups/${pickup_id}/assignments"
              payload: { lot_id: "${lot_id}", quantity_units: 10 }
              as: FreshClerk
              captures: { line_id: $.data.id }
          assert:
            - "first response: HTTP 422 with data.error_id == 'ERR_DONATION_WINDOW_CLOSED'"
            - "after the refusal: DateCodeLot.${lot_id}.status == 'FRESH' and DonationPickup.${pickup_id}.assignment_count == 0"
            - "third call: HTTP 201 with data.status == 'ASSIGNED' and data.quantity_units == 10"
            - "DateCodeLot.${lot_id}.status == 'DONATION_PENDING'"

      - name: individually_valid_sale_and_shrink_collectively_exceed_the_lot
        claim_type: aggregate_validation
        grounds:
          - validations[priority 34]
          - errors[ERR_INSUFFICIENT_UNITS]
          - calculations.lot_unit_conservation
        distinguishing_aspect: |
          Neither 20 nor 5 exceeds the original 24, but after the 20-unit sale only 4 units remain,
          so the 5-unit shrink is ERR_INSUFFICIENT_UNITS (422) while a 4-unit shrink passes and
          drains the lot to DEPLETED with conservation intact: 24 == 0 + 20 + 4 + 0.
        test_recipe:
          setup:
            - "The MEAT base chain; one 24-unit lot; clock at 2026-08-10T08:00:00.000Z; 20 units already sold, leaving 4 on hand."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T08:00:00.000Z" }
              as: StoreOperationsAdmin
            - call: "POST /fresh/stores"
              payload: { store_number: "0412", name: "Fresh Market 0412", region_code: "MID-ATL" }
              as: StoreOperationsAdmin
              captures: { store_id: $.data.id }
            - call: "POST /fresh/markdown-ladders"
              payload: { name: "MEAT-STD-2026", department_code: "MEAT", rungs: [{ days_remaining_max: 3, discount_pct: 15, requires_manager_approval: false }, { days_remaining_max: 1, discount_pct: 50, requires_manager_approval: true }] }
              as: StoreOperationsAdmin
              captures: { ladder_id: $.data.id }
            - call: "POST /fresh/markdown-ladders/${ladder_id}/activate"
              payload: {}
              as: StoreOperationsAdmin
            - call: "POST /fresh/departments"
              payload: { store_id: "${store_id}", markdown_ladder_id: "${ladder_id}", code: "MEAT", shelf_life_days_default: 10 }
              as: StoreOperationsAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /fresh/items"
              payload: { department_id: "${dept_id}", upc: "000111222333", description: "Ribeye Steak 12oz", base_retail_cents: 599, unit_cost_cents: 420, daily_forecast_units: 4.00 }
              as: DepartmentManager
              captures: { item_id: $.data.id }
            - call: "POST /fresh/lots"
              payload: { item_id: "${item_id}", production_date: "2026-08-05", quantity_original: 24 }
              as: FreshClerk
              captures: { lot_id: $.data.id }
            - call: "POST /fresh/lots/${lot_id}/sales"
              payload: { quantity_units: 20, register_lane_code: "L07" }
              as: FreshClerk
          trigger:
            - call: "POST /fresh/shrink-events"
              payload: { lot_id: "${lot_id}", cause_code: "DAMAGE", quantity_units: 5 }
              as: FreshClerk
              as_user_id: "u-clerk-1"
            - call: "POST /fresh/shrink-events"
              payload: { lot_id: "${lot_id}", cause_code: "DAMAGE", quantity_units: 4 }
              as: FreshClerk
              as_user_id: "u-clerk-1"
              captures: { shrink_id: $.data.id }
            - call: "POST /fresh/shrink-events/${shrink_id}/verify"
              payload: {}
              as: DepartmentManager
              as_user_id: "u-mgr-1"
          assert:
            - "first response: HTTP 422 with data.error_id == 'ERR_INSUFFICIENT_UNITS'"
            - "second response: HTTP 201 with data.status == 'RECORDED' and data.quantity_units == 4"
            - "verify response: HTTP 200 with data.status == 'VERIFIED'"
            - "DateCodeLot.${lot_id}.quantity_on_hand == 0, units_sold == 20, units_shrunk == 4, units_donated == 0"
            - "DateCodeLot.${lot_id}.status == 'DEPLETED'"
            - "GET /fresh/departments/${dept_id} returns data.markdown_liability_cents == 0 (a DEPLETED lot leaves the aggregate)"

      - name: sampling_cause_code_depends_on_the_items_sampling_flag
        claim_type: conditional_validation
        grounds:
          - validations[priority 18]
          - errors[ERR_SAMPLING_NOT_ALLOWED]
          - entities.Item.fields.sampling_allowed
        distinguishing_aspect: |
          The rule only exists for one cause code and one flag: SAMPLING shrink on an item with
          sampling_allowed false is ERR_SAMPLING_NOT_ALLOWED (422), the identical request after a
          PATCH flipping the flag to true is a 201, and a DAMAGE event was never gated either way.
        test_recipe:
          setup:
            - "The MEAT base chain; the item keeps the default sampling_allowed false; one 24-unit lot."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T08:00:00.000Z" }
              as: StoreOperationsAdmin
            - call: "POST /fresh/stores"
              payload: { store_number: "0412", name: "Fresh Market 0412", region_code: "MID-ATL" }
              as: StoreOperationsAdmin
              captures: { store_id: $.data.id }
            - call: "POST /fresh/markdown-ladders"
              payload: { name: "MEAT-STD-2026", department_code: "MEAT", rungs: [{ days_remaining_max: 3, discount_pct: 15, requires_manager_approval: false }, { days_remaining_max: 1, discount_pct: 50, requires_manager_approval: true }] }
              as: StoreOperationsAdmin
              captures: { ladder_id: $.data.id }
            - call: "POST /fresh/markdown-ladders/${ladder_id}/activate"
              payload: {}
              as: StoreOperationsAdmin
            - call: "POST /fresh/departments"
              payload: { store_id: "${store_id}", markdown_ladder_id: "${ladder_id}", code: "MEAT", shelf_life_days_default: 10 }
              as: StoreOperationsAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /fresh/items"
              payload: { department_id: "${dept_id}", upc: "000111222333", description: "Ribeye Steak 12oz", base_retail_cents: 599, unit_cost_cents: 420, daily_forecast_units: 4.00 }
              as: DepartmentManager
              captures: { item_id: $.data.id }
            - call: "POST /fresh/lots"
              payload: { item_id: "${item_id}", production_date: "2026-08-05", quantity_original: 24 }
              as: FreshClerk
              captures: { lot_id: $.data.id }
          trigger:
            - call: "POST /fresh/shrink-events"
              payload: { lot_id: "${lot_id}", cause_code: "SAMPLING", quantity_units: 2 }
              as: FreshClerk
              as_user_id: "u-clerk-1"
            - call: "PATCH /fresh/items/${item_id}"
              payload: { sampling_allowed: true }
              as: DepartmentManager
            - call: "POST /fresh/shrink-events"
              payload: { lot_id: "${lot_id}", cause_code: "SAMPLING", quantity_units: 2 }
              as: FreshClerk
              as_user_id: "u-clerk-1"
              captures: { shrink_id: $.data.id }
          assert:
            - "first response: HTTP 422 with data.error_id == 'ERR_SAMPLING_NOT_ALLOWED'"
            - "patch response: HTTP 200 with data.sampling_allowed == true and data.version == 2"
            - "third response: HTTP 201 with data.cause_code == 'SAMPLING' and data.status == 'RECORDED'"
            - "third response: data.unit_cost_cents_snapshot == 420 and data.cost_value_cents == 840"
            - "GET /fresh/shrink-events?lot_id=${lot_id}&cause_code=SAMPLING returns total_count == 1"

      - name: unknown_pickup_id_answers_404_before_the_ownership_check_can_run
        claim_type: cascading_validation
        grounds:
          - validations[priority 4]
          - validations[priority 6]
          - errors[ERR_PICKUP_NOT_FOUND]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: |
          Priority 4 must resolve before priority 6 can even read partner_id: confirming an
          unknown pickup as a DonationPartner is 404 ERR_PICKUP_NOT_FOUND, while confirming a real
          pickup that belongs to the other partner is 403 ERR_UNAUTHORIZED. Reversing the order
          would leak a 403 for ids that do not exist.
        test_recipe:
          setup:
            - "Donation-enabled store 0412 with two MID-ATL partners accepting PRODUCE."
            - "One SCHEDULED pickup on dock D1 booked for partner ALPHA."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T08:00:00.000Z" }
              as: StoreOperationsAdmin
            - call: "POST /fresh/stores"
              payload: { store_number: "0412", name: "Fresh Market 0412", region_code: "MID-ATL", dock_door_codes: ["D1"], donation_program_enabled: true }
              as: StoreOperationsAdmin
              captures: { store_id: $.data.id }
            - call: "POST /fresh/food-bank-partners"
              payload: { name: "Alpha Pantry", contact_email: "ops@alpha.example", service_region_code: "MID-ATL", accepted_department_codes: ["PRODUCE"] }
              as: StoreOperationsAdmin
              captures: { partner_alpha: $.data.id }
            - call: "POST /fresh/food-bank-partners"
              payload: { name: "Beta Pantry", contact_email: "ops@beta.example", service_region_code: "MID-ATL", accepted_department_codes: ["PRODUCE"] }
              as: StoreOperationsAdmin
              captures: { partner_beta: $.data.id }
            - call: "POST /fresh/donation-pickups"
              payload: { store_id: "${store_id}", partner_id: "${partner_alpha}", dock_door_code: "D1", scheduled_window_start: "2026-08-13T14:00:00.000Z", scheduled_window_end: "2026-08-13T15:00:00.000Z" }
              as: DepartmentManager
              captures: { pickup_id: $.data.id }
          trigger:
            - call: "POST /fresh/donation-pickups/00000000-0000-4000-8000-000000000000/confirm"
              payload: {}
              as: DonationPartner
              as_user_id: "${partner_beta}"
            - call: "POST /fresh/donation-pickups/${pickup_id}/confirm"
              payload: {}
              as: DonationPartner
              as_user_id: "${partner_beta}"
            - call: "POST /fresh/donation-pickups/${pickup_id}/confirm"
              payload: {}
              as: DonationPartner
              as_user_id: "${partner_alpha}"
          assert:
            - "first response: HTTP 404 with data.error_id == 'ERR_PICKUP_NOT_FOUND'"
            - "second response: HTTP 403 with data.error_id == 'ERR_UNAUTHORIZED'"
            - "after the 403: DonationPickup.${pickup_id}.logistics_status == 'SCHEDULED'"
            - "third response: HTTP 200 with data.logistics_status == 'CONFIRMED' and data.manifest_status == 'DRAFT'"

  # =========================================================================
  # endpoints
  # =========================================================================
  - section: endpoints
    instances:
      - name: store_create_read_update_and_filtered_list_round_trip
        claim_type: standard_crud
        grounds:
          - endpoints[POST /fresh/stores]
          - endpoints[GET /fresh/stores/{storeId}]
          - endpoints[PATCH /fresh/stores/{storeId}]
          - endpoints[GET /fresh/stores]
        distinguishing_aspect: |
          The registry's CRUD is Create-Read-Update-List and deliberately has no Delete: §1.5
          declares no DELETE verb for any entity, so removal is expressed by Store.status
          CLOSED rather than by deletion, and the closed store is still readable by id and still
          counted by an unfiltered list while dropping out of a status=ACTIVE filter.
        test_recipe:
          setup:
            - "Clock at 2026-08-10T08:00:00.000Z; two stores in region MID-ATL, both ACTIVE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T08:00:00.000Z" }
              as: StoreOperationsAdmin
            - call: "POST /fresh/stores"
              payload: { store_number: "0412", name: "Fresh Market 0412", region_code: "MID-ATL", dock_door_codes: ["D1"] }
              as: StoreOperationsAdmin
              captures: { store_a: $.data.id }
            - call: "POST /fresh/stores"
              payload: { store_number: "0413", name: "Fresh Market 0413", region_code: "MID-ATL" }
              as: StoreOperationsAdmin
              captures: { store_b: $.data.id }
          trigger:
            - call: "GET /fresh/stores/${store_a}"
              payload: {}
              as: FreshClerk
            - call: "PATCH /fresh/stores/${store_a}"
              payload: { status: "CLOSED", donation_program_enabled: true, name: "Fresh Market 0412 (closed)" }
              as: StoreOperationsAdmin
            - call: "GET /fresh/stores/${store_a}"
              payload: {}
              as: FreshClerk
            - call: "GET /fresh/stores?region_code=MID-ATL&limit=10&offset=0"
              payload: {}
              as: FreshClerk
            - call: "GET /fresh/stores?status=ACTIVE&region_code=MID-ATL&limit=10&offset=0"
              payload: {}
              as: FreshClerk
          assert:
            - "first read: HTTP 200 with data.store_number == '0412', data.name == 'Fresh Market 0412', data.status == 'ACTIVE', data.donation_program_enabled == false, data.version == 1"
            - "patch: HTTP 200 with data.status == 'CLOSED', data.donation_program_enabled == true, data.name == 'Fresh Market 0412 (closed)', data.version == 2"
            - "patch: data.store_number == '0412' and data.region_code == 'MID-ATL' (untouched by the partial update)"
            - "second read: HTTP 200 with data.version == 2 and data.updated_at > data.created_at"
            - "unfiltered-by-status list: total_count == 2 and has_more == false"
            - "status=ACTIVE list: total_count == 1 and the single row's id == ${store_b}"

      - name: label_apply_refuses_a_queued_label_and_only_lifts_sell_through_once_applied
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /fresh/markdown-labels/{labelId}/print]
          - endpoints[POST /fresh/markdown-labels/{labelId}/apply]
          - state_machines[MarkdownLabel.status]
          - calculations.expected_sell_through
          - errors[ERR_LABEL_NOT_PRINTED]
        distinguishing_aspect: |
          The action endpoints are ordered and each enforces its own precondition: applying the
          freshly cut QUEUED label is ERR_LABEL_NOT_PRINTED (409), printing it twice is the same
          error from the other arm of the condition, and only the successful apply adds
          PROMO_LIFT_PCT, moving the lot's expected_sell_through_pct from exactly 50.00 to
          exactly 60.00.
        test_recipe:
          setup:
            - "The MEAT base chain with the clock advanced to 2026-08-12T00:00:00.000Z, where days_remaining is 3."
            - "One 24-unit lot marked down at rung 0, which cuts a QUEUED label."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T08:00:00.000Z" }
              as: StoreOperationsAdmin
            - call: "POST /fresh/stores"
              payload: { store_number: "0412", name: "Fresh Market 0412", region_code: "MID-ATL" }
              as: StoreOperationsAdmin
              captures: { store_id: $.data.id }
            - call: "POST /fresh/markdown-ladders"
              payload: { name: "MEAT-STD-2026", department_code: "MEAT", rungs: [{ days_remaining_max: 3, discount_pct: 15, requires_manager_approval: false }, { days_remaining_max: 1, discount_pct: 50, requires_manager_approval: true }] }
              as: StoreOperationsAdmin
              captures: { ladder_id: $.data.id }
            - call: "POST /fresh/markdown-ladders/${ladder_id}/activate"
              payload: {}
              as: StoreOperationsAdmin
            - call: "POST /fresh/departments"
              payload: { store_id: "${store_id}", markdown_ladder_id: "${ladder_id}", code: "MEAT", shelf_life_days_default: 10 }
              as: StoreOperationsAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /fresh/items"
              payload: { department_id: "${dept_id}", upc: "000111222333", description: "Ribeye Steak 12oz", base_retail_cents: 599, unit_cost_cents: 420, daily_forecast_units: 4.00 }
              as: DepartmentManager
              captures: { item_id: $.data.id }
            - call: "POST /fresh/lots"
              payload: { item_id: "${item_id}", production_date: "2026-08-05", quantity_original: 24 }
              as: FreshClerk
              captures: { lot_id: $.data.id, lot_v1: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-12T00:00:00.000Z" }
              as: StoreOperationsAdmin
            - call: "POST /fresh/lots/${lot_id}/markdowns"
              payload: { expected_lot_version: "${lot_v1}", pricing_variant: "LADDER_DAYS" }
              as: FreshClerk
              captures: { label_id: $.data.id }
          trigger:
            - call: "POST /fresh/markdown-labels/${label_id}/apply"
              payload: {}
              as: FreshClerk
            - call: "POST /fresh/markdown-labels/${label_id}/print"
              payload: {}
              as: FreshClerk
            - call: "POST /fresh/markdown-labels/${label_id}/print"
              payload: {}
              as: FreshClerk
            - call: "POST /fresh/markdown-labels/${label_id}/apply"
              payload: {}
              as: FreshClerk
          assert:
            - "first apply: HTTP 409 with data.error_id == 'ERR_LABEL_NOT_PRINTED'"
            - "after the refusal: MarkdownLabel.${label_id}.status == 'QUEUED' and applied_at == null"
            - "GET /fresh/lots/${lot_id} returns data.current_price_cents == 509, data.total_discount_pct == 15.03 and data.expected_sell_through_pct == 50.0"
            - "first print: HTTP 200 with data.status == 'PRINTED' and data.printed_at == '2026-08-12T00:00:00.000Z'"
            - "second print: HTTP 409 with data.error_id == 'ERR_LABEL_NOT_PRINTED' and the label still PRINTED"
            - "second apply: HTTP 200 with data.status == 'APPLIED' and data.applied_at == '2026-08-12T00:00:00.000Z'"
            - "GET /fresh/lots/${lot_id} now returns data.expected_sell_through_pct == 60.0 (4.00 * 1.00 * 3 + 24 * 10 / 100 = 14.4 of 24 units)"

      - name: one_sweep_touches_only_the_qualifying_rows_in_each_phase
        claim_type: bulk_action
        grounds:
          - endpoints[POST /fresh/departments/{departmentId}/run-date-code-sweep]
          - calculations.markdown_liability
          - calculations.shrink_cost_ratio
          - calculations.department_compliance_posture
        distinguishing_aspect: |
          The sweep is a five-phase bulk action that skips rather than fails: of three lots it
          flags exactly one as past date, auto-marks-down exactly that same one (the in-date lot
          has reached no rung and the withdrawn one is out of scope), posts the shrink event whose
          verified_at is exactly 24 hours old but not the one 1 ms younger, misses the elapsed
          pickup but not tomorrow's, and reports one sweep_epoch for the whole run.
        test_recipe:
          setup:
            - "Clock 2026-08-08T06:00:00.000Z; store 0412 with dock D1 and the donation program on; a single-rung MEAT ladder (days_remaining_max 3 @ 15%, no approval); department MEAT with shelf_life_days_default 10 and the default shrink_budget_pct 2.5."
            - "Lot A produced 2026-08-05 (24 units, sell_by 2026-08-15T00:00:00.000Z, in date), lot B produced 2026-07-30 (6 units, sell_by 2026-08-09T00:00:00.000Z, past date at sweep time), lot C produced 2026-07-30 (5 units) later withdrawn."
            - "10 units of lot A sold; shrink S1 (2 units) verified exactly 24 h before the sweep and shrink S2 (1 unit) verified 1 ms later."
            - "Pickup P1 for 2026-08-09T14:00-15:00 (elapsed at sweep time) and P2 for 2026-08-11T14:00-15:00 (still future), both on dock D1 with no lines."
