      - name: adjudicate_confirmed_event_returns_invalid_event_state
        claim_type: Precondition Enforcement
        grounds: [state_machines.VerificationEvent.REPORTED_to_CONFIRMED, errors.ERR_INVALID_EVENT_STATE]
        distinguishing_aspect: "Adjudication is a one-way gate: adjudicating an already-CONFIRMED event (either outcome) is 409 ERR_INVALID_EVENT_STATE and matched_product_ids is not recomputed."
        test_recipe:
          setup: ["One office, one zone; one verification event already adjudicated CONFIRMED."]
          setup_api_calls:
            - call: "POST /alerts/offices"
              payload: { office_code: "KADJ", name: "Adj Office", region: "WEST", area_method: "PLANAR" }
              as: PlatformAdmin
              captures: { j_off: $.data.id }
            - call: "POST /alerts/zones"
              payload: { zone_code: "ZAJ1", name: "Adj Zone", office_id: "${j_off}", lat_min: 0.0, lat_max: 0.1, lon_min: 0.0, lon_max: 0.1, surveyed_area_sq_km: 123.21, population_tier: "LOW", coastal: false }
              as: PlatformAdmin
              captures: { j_zone: $.data.id }
            - call: "POST /alerts/verification-events"
              payload: { zone_id: "${j_zone}", hazard_type: "SEVERE_THUNDERSTORM", observed_at: "2026-09-01T10:30:00Z", location_lat: 0.05, location_lon: 0.05, magnitude: "60mph" }
              as: VerificationAnalyst
              as_user_id: "va-1"
              captures: { j_ev: $.data.id }
            - call: "POST /alerts/verification-events/${j_ev}/adjudicate"
              payload: { outcome: "CONFIRMED" }
              as: VerificationAnalyst
              as_user_id: "va-1"
          trigger:
            - call: "POST /alerts/verification-events/${j_ev}/adjudicate"
              payload: { outcome: "REJECTED" }
              as: VerificationAnalyst
              as_user_id: "va-1"
              captures: { j_err: $.data.error_id }
          assert:
            - "the second adjudication is 409 with error_id == ERR_INVALID_EVENT_STATE"
            - "VerificationEvent.${j_ev}.status stays CONFIRMED and matched_product_ids == [] (no products exist)"

      - name: lift_from_recommended_withdraws_action
        claim_type: Valid Transition
        grounds: [state_machines.EmergencyAction.RECOMMENDED_to_WITHDRAWN]
        distinguishing_aspect: "The lift endpoint is two transitions in one: from RECOMMENDED it withdraws the recommendation (lifted_at stays null); only from ORDERED does it produce LIFTED."
        test_recipe:
          setup: ["One office, one zone, one forecaster, one DRAFT watch; an EmergencyAction in RECOMMENDED against the watch."]
          setup_api_calls:
