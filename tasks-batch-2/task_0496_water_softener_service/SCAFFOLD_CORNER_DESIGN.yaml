scaffold_corner_design:

  # ===========================================================================
  # Entities
  # ===========================================================================
  - section: entities
    instances:
      - name: create_service_account_returns_201_with_defaults
        claim_type: Creation
        grounds:
          - entities.ServiceAccount
          - endpoints
        distinguishing_aspect: "POST /accounts with customer_id, property_type, service_zone returns 201; credit_balance_cents defaults to 0 and standing defaults to GOOD, hardness_gpg null."
        test_recipe:
          setup:
            - "A customer exists."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Acct Owner", email: "acct@x.com" }
              as: BillingClerk
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /accounts"
              payload: { customer_id: "${cust_id}", property_type: "WELL_WHOLE_HOUSE", service_zone: "Z-SOUTH" }
              as: BillingClerk
              captures: { acct_id: $.data.id }
          assert:
            - "response.status == 201"
            - "ServiceAccount.${acct_id}.credit_balance_cents == 0"
            - "ServiceAccount.${acct_id}.standing == GOOD"
            - "ServiceAccount.${acct_id}.version == 1"

      - name: get_account_not_found_returns_404
        claim_type: Not Found
        grounds:
          - entities.ServiceAccount
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /accounts/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "GET /accounts/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ServiceManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: create_water_test_missing_required_field_returns_400
        claim_type: Required Fields
        grounds:
          - entities.WaterTest.fields.hardness_gpg
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /water-tests omitting required hardness_gpg returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup:
            - "An account exists."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Wt Owner", email: "wt@x.com" }
              as: ServiceManager
              captures: { cust_id: $.data.id }
            - call: "POST /accounts"
              payload: { customer_id: "${cust_id}", property_type: "MUNICIPAL_WHOLE_HOUSE", service_zone: "Z-NORTH" }
              as: ServiceManager
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /water-tests"
              payload: { account_id: "${acct_id}", iron_ppm: 0, tds_ppm: 200, household_size: 4 }
              as: FieldTech
              as_user_id: "ignored"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: create_water_test_invalid_enum_property_type_rejected
        claim_type: Type Constraints
        grounds:
          - entities.ServiceAccount.fields.property_type
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /accounts with property_type not in {MUNICIPAL_WHOLE_HOUSE, WELL_WHOLE_HOUSE, POINT_OF_USE} returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup:
            - "A customer exists."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "En Owner", email: "en@x.com" }
              as: ServiceManager
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /accounts"
              payload: { customer_id: "${cust_id}", property_type: "OCEAN", service_zone: "Z-NORTH" }
              as: ServiceManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: water_test_recommend_computed_fields_ignore_client_input
        claim_type: Computed Fields
        grounds:
          - entities.WaterTest.fields.recommended_grain_capacity
          - calculations.size_grain_capacity
        distinguishing_aspect: "recommended_grain_capacity is server-computed: a DRAFT test (hardness 15, iron 0, hh 4) recommends 32000 regardless of any client-supplied capacity; recommend body takes no inputs."
        test_recipe:
          setup:
            - "A DRAFT water test exists (hardness 15, iron 0, hh 4)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Cf Owner", email: "cf@x.com" }
              as: ServiceManager
              captures: { cust_id: $.data.id }
            - call: "POST /field-techs"
              payload: { full_name: "Cf Tech", home_zone: "Z-NORTH" }
              as: ServiceManager
              captures: { tech_id: $.data.id }
            - call: "POST /accounts"
              payload: { customer_id: "${cust_id}", property_type: "MUNICIPAL_WHOLE_HOUSE", service_zone: "Z-NORTH" }
              as: ServiceManager
              captures: { acct_id: $.data.id }
            - call: "POST /water-tests"
              payload: { account_id: "${acct_id}", hardness_gpg: 15, iron_ppm: 0, tds_ppm: 200, household_size: 4 }
              as: FieldTech
              as_user_id: "${tech_id}"
              captures: { wt_id: $.data.id }
          trigger:
            - call: "POST /water-tests/${wt_id}/recommend"
              payload: {}
              as: FieldTech
              as_user_id: "${tech_id}"
              captures: { cap: $.data.recommended_grain_capacity, ro: $.data.recommended_needs_ro }
          assert:
            - "WaterTest.${wt_id}.recommended_grain_capacity == 32000"
            - "WaterTest.${wt_id}.recommended_needs_ro == false"
            - "WaterTest.${wt_id}.status == RECOMMENDED"

      - name: recommend_iron_inflates_tank_size_to_48000
        claim_type: Computed Fields
        grounds:
          - calculations.size_grain_capacity
          - entities.WaterTest.fields.iron_ppm
        distinguishing_aspect: "iron_inflated variant: hardness 15 + iron 2 (effective 23 gpg), hh 4 -> required 44160 -> next tank 48000; needs_ro true at tds 600."
        test_recipe:
          setup:
            - "A DRAFT water test exists (hardness 15, iron 2, tds 600, hh 4)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Ir Owner", email: "ir@x.com" }
              as: ServiceManager
              captures: { cust_id: $.data.id }
            - call: "POST /field-techs"
              payload: { full_name: "Ir Tech", home_zone: "Z-NORTH" }
              as: ServiceManager
              captures: { tech_id: $.data.id }
            - call: "POST /accounts"
              payload: { customer_id: "${cust_id}", property_type: "WELL_WHOLE_HOUSE", service_zone: "Z-NORTH" }
              as: ServiceManager
              captures: { acct_id: $.data.id }
            - call: "POST /water-tests"
              payload: { account_id: "${acct_id}", hardness_gpg: 15, iron_ppm: 2, tds_ppm: 600, household_size: 4 }
              as: FieldTech
              as_user_id: "${tech_id}"
              captures: { wt_id: $.data.id }
          trigger:
            - call: "POST /water-tests/${wt_id}/recommend"
              payload: {}
              as: FieldTech
              as_user_id: "${tech_id}"
              captures: { cap: $.data.recommended_grain_capacity }
          assert:
            - "WaterTest.${wt_id}.recommended_grain_capacity == 48000"
            - "WaterTest.${wt_id}.recommended_needs_ro == true"

      - name: customer_immutable_no_version_field
        claim_type: Immutability
        grounds:
          - entities.Customer
        distinguishing_aspect: "Customer has common_fields:false — its create response carries id and created_at but no version field; there is no update endpoint."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /customers"
              payload: { full_name: "Im Owner", email: "im@x.com" }
              as: ServiceManager
              captures: { cust_id: $.data.id }
          assert:
            - "response.status == 201"
            - "response.data has field created_at"
            - "response.data has no field version"

      - name: account_list_pagination_envelope
        claim_type: Listing
        grounds:
          - entities.ServiceAccount
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /accounts returns a paginated array envelope with total_count and has_more; default limit 10."
        test_recipe:
          setup:
            - "One account exists."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Li Owner", email: "li@x.com" }
              as: BillingClerk
              captures: { cust_id: $.data.id }
            - call: "POST /accounts"
              payload: { customer_id: "${cust_id}", property_type: "MUNICIPAL_WHOLE_HOUSE", service_zone: "Z-NORTH" }
              as: BillingClerk
          trigger:
            - call: "GET /accounts"
              payload: {}
              as: BillingClerk
          assert:
            - "response.response_type == array"
            - "response.meta.total_count == 1"
            - "response.meta.has_more == false"

  # ===========================================================================
  # State Machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: water_test_initial_state_is_draft
        claim_type: Initial State
        grounds:
          - state_machines.WaterTest
        distinguishing_aspect: "A newly created WaterTest starts in status DRAFT with recommended_grain_capacity null."
        test_recipe:
          setup:
            - "An account exists."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Is Owner", email: "is@x.com" }
              as: ServiceManager
              captures: { cust_id: $.data.id }
            - call: "POST /accounts"
              payload: { customer_id: "${cust_id}", property_type: "MUNICIPAL_WHOLE_HOUSE", service_zone: "Z-NORTH" }
              as: ServiceManager
              captures: { acct_id: $.data.id }
            - call: "POST /field-techs"
              payload: { full_name: "Is Tech", home_zone: "Z-NORTH" }
              as: ServiceManager
              captures: { tech_id: $.data.id }
          trigger:
            - call: "POST /water-tests"
              payload: { account_id: "${acct_id}", hardness_gpg: 15, iron_ppm: 0, tds_ppm: 200, household_size: 4 }
              as: FieldTech
              as_user_id: "${tech_id}"
              captures: { wt_id: $.data.id }
          assert:
            - "WaterTest.${wt_id}.status == DRAFT"

      - name: accept_supersedes_prior_accepted_test_cascade
        claim_type: Side Effect Execution
        grounds:
          - state_machines.WaterTest.RECOMMENDED_to_ACCEPTED
          - state_machines.WaterTest.ACCEPTED_to_SUPERSEDED
          - entities.ServiceAccount.fields.hardness_gpg
        distinguishing_aspect: "Accepting a second water test for the same account transitions the prior ACCEPTED test to SUPERSEDED and updates account.hardness_gpg to the new reading (18)."
        test_recipe:
          setup:
            - "An account with a first ACCEPTED test (hardness 15); a second RECOMMENDED test (hardness 18) is ready to accept."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Su Owner", email: "su@x.com" }
              as: ServiceManager
              captures: { cust_id: $.data.id }
            - call: "POST /field-techs"
              payload: { full_name: "Su Tech", home_zone: "Z-NORTH" }
              as: ServiceManager
              captures: { tech_id: $.data.id }
            - call: "POST /accounts"
              payload: { customer_id: "${cust_id}", property_type: "MUNICIPAL_WHOLE_HOUSE", service_zone: "Z-NORTH" }
              as: ServiceManager
              captures: { acct_id: $.data.id }
            - call: "POST /water-tests"
              payload: { account_id: "${acct_id}", hardness_gpg: 15, iron_ppm: 0, tds_ppm: 200, household_size: 4 }
              as: FieldTech
              as_user_id: "${tech_id}"
              captures: { wt1: $.data.id }
            - call: "POST /water-tests/${wt1}/recommend"
              payload: {}
              as: FieldTech
              as_user_id: "${tech_id}"
            - call: "POST /water-tests/${wt1}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /water-tests"
              payload: { account_id: "${acct_id}", hardness_gpg: 18, iron_ppm: 0, tds_ppm: 200, household_size: 4 }
              as: FieldTech
              as_user_id: "${tech_id}"
              captures: { wt2: $.data.id }
            - call: "POST /water-tests/${wt2}/recommend"
              payload: {}
              as: FieldTech
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /water-tests/${wt2}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          assert:
            - "WaterTest.${wt1}.status == SUPERSEDED"
            - "WaterTest.${wt2}.status == ACCEPTED"
            - "ServiceAccount.${acct_id}.hardness_gpg == 18"

      - name: activate_from_ordered_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.SoftenerSystem.INSTALLED_to_ACTIVE
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Activating a system still in ORDERED (install not yet done) is not a defined transition and returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup:
            - "A system ORDERED from an ACCEPTED test (never installed)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Av Owner", email: "av@x.com" }
              as: ServiceManager
              captures: { cust_id: $.data.id }
            - call: "POST /field-techs"
              payload: { full_name: "Av Tech", home_zone: "Z-NORTH" }
              as: ServiceManager
              captures: { tech_id: $.data.id }
            - call: "POST /accounts"
              payload: { customer_id: "${cust_id}", property_type: "MUNICIPAL_WHOLE_HOUSE", service_zone: "Z-NORTH" }
              as: ServiceManager
              captures: { acct_id: $.data.id }
            - call: "POST /water-tests"
              payload: { account_id: "${acct_id}", hardness_gpg: 15, iron_ppm: 0, tds_ppm: 200, household_size: 4 }
              as: FieldTech
              as_user_id: "${tech_id}"
              captures: { wt_id: $.data.id }
            - call: "POST /water-tests/${wt_id}/recommend"
              payload: {}
              as: FieldTech
              as_user_id: "${tech_id}"
            - call: "POST /water-tests/${wt_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /systems"
              payload: { account_id: "${acct_id}", source_test_id: "${wt_id}", acquisition_mode: "PURCHASE", grain_capacity: 32000 }
              as: ServiceManager
              captures: { sys_id: $.data.id }
          trigger:
            - call: "POST /systems/${sys_id}/activate"
              payload: {}
              as: FieldTech
              as_user_id: "${tech_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: water_test_terminal_superseded_lockdown
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.WaterTest
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "A SUPERSEDED water test cannot be re-accepted; accept returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup:
            - "A water test wt1 that has been SUPERSEDED by a later accepted test."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Tl Owner", email: "tl@x.com" }
              as: ServiceManager
              captures: { cust_id: $.data.id }
            - call: "POST /field-techs"
              payload: { full_name: "Tl Tech", home_zone: "Z-NORTH" }
              as: ServiceManager
              captures: { tech_id: $.data.id }
            - call: "POST /accounts"
              payload: { customer_id: "${cust_id}", property_type: "MUNICIPAL_WHOLE_HOUSE", service_zone: "Z-NORTH" }
              as: ServiceManager
              captures: { acct_id: $.data.id }
            - call: "POST /water-tests"
              payload: { account_id: "${acct_id}", hardness_gpg: 15, iron_ppm: 0, tds_ppm: 200, household_size: 4 }
              as: FieldTech
              as_user_id: "${tech_id}"
              captures: { wt1: $.data.id }
            - call: "POST /water-tests/${wt1}/recommend"
              payload: {}
              as: FieldTech
              as_user_id: "${tech_id}"
            - call: "POST /water-tests/${wt1}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /water-tests"
              payload: { account_id: "${acct_id}", hardness_gpg: 18, iron_ppm: 0, tds_ppm: 200, household_size: 4 }
              as: FieldTech
              as_user_id: "${tech_id}"
              captures: { wt2: $.data.id }
            - call: "POST /water-tests/${wt2}/recommend"
              payload: {}
              as: FieldTech
              as_user_id: "${tech_id}"
            - call: "POST /water-tests/${wt2}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /water-tests/${wt1}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: decommission_blocked_by_active_contract
        claim_type: guarded transitions
        grounds:
          - state_machines.SoftenerSystem.ACTIVE_to_DECOMMISSIONED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Decommissioning a system that still has an ACTIVE rental contract is rejected (must terminate the contract first) with ERR_INVALID_STATE (409)."
        test_recipe:
          setup:
            - "An ACTIVE rented system with an ACTIVE rental contract."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Dc Owner", email: "dc@x.com" }
              as: ServiceManager
              captures: { cust_id: $.data.id }
            - call: "POST /field-techs"
              payload: { full_name: "Dc Tech", home_zone: "Z-NORTH" }
              as: ServiceManager
              captures: { tech_id: $.data.id }
            - call: "POST /accounts"
              payload: { customer_id: "${cust_id}", property_type: "MUNICIPAL_WHOLE_HOUSE", service_zone: "Z-NORTH" }
              as: ServiceManager
              captures: { acct_id: $.data.id }
            - call: "POST /water-tests"
              payload: { account_id: "${acct_id}", hardness_gpg: 15, iron_ppm: 0, tds_ppm: 200, household_size: 4 }
              as: FieldTech
              as_user_id: "${tech_id}"
              captures: { wt_id: $.data.id }
            - call: "POST /water-tests/${wt_id}/recommend"
              payload: {}
              as: FieldTech
              as_user_id: "${tech_id}"
            - call: "POST /water-tests/${wt_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /systems"
              payload: { account_id: "${acct_id}", source_test_id: "${wt_id}", acquisition_mode: "RENTAL", grain_capacity: 32000 }
              as: ServiceManager
              captures: { sys_id: $.data.id }
            - call: "POST /systems/${sys_id}/install"
              payload: {}
              as: FieldTech
              as_user_id: "${tech_id}"
            - call: "POST /systems/${sys_id}/activate"
              payload: {}
              as: FieldTech
              as_user_id: "${tech_id}"
            - call: "POST /rental-contracts"
              payload: { account_id: "${acct_id}", system_id: "${sys_id}", monthly_rate_cents: 4500, term_months: 12, start_date: "2026-01-01T00:00:00Z" }
              as: BillingClerk
              captures: { rc_id: $.data.id }
          trigger:
            - call: "POST /systems/${sys_id}/decommission"
              payload: {}
              as: ServiceManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"
            - "SoftenerSystem.${sys_id}.lifecycle_status == ACTIVE"

      - name: cartridge_evaluate_due_soon_within_lead_window
        claim_type: Valid Transition
        grounds:
          - state_machines.CartridgeSchedule.ON_TRACK_to_DUE_SOON
          - entities.CartridgeSchedule.fields.status
        distinguishing_aspect: "A cartridge schedule (interval 180, last_replaced 2026-01-01, due 2026-06-30) evaluated at clock 2026-06-20 (within the 14-day lead window) transitions ON_TRACK -> DUE_SOON."
        test_recipe:
          setup:
            - "An ACTIVE system with an RO_MEMBRANE cartridge schedule interval_days=180 last_replaced 2026-01-01; clock at 2026-06-20."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Cs Owner", email: "cs@x.com" }
              as: ServiceManager
              captures: { cust_id: $.data.id }
            - call: "POST /field-techs"
              payload: { full_name: "Cs Tech", home_zone: "Z-NORTH" }
              as: ServiceManager
              captures: { tech_id: $.data.id }
            - call: "POST /accounts"
              payload: { customer_id: "${cust_id}", property_type: "POINT_OF_USE", service_zone: "Z-NORTH" }
              as: ServiceManager
              captures: { acct_id: $.data.id }
            - call: "POST /water-tests"
              payload: { account_id: "${acct_id}", hardness_gpg: 15, iron_ppm: 0, tds_ppm: 600, household_size: 4 }
              as: FieldTech
              as_user_id: "${tech_id}"
              captures: { wt_id: $.data.id }
            - call: "POST /water-tests/${wt_id}/recommend"
              payload: {}
              as: FieldTech
              as_user_id: "${tech_id}"
            - call: "POST /water-tests/${wt_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /systems"
              payload: { account_id: "${acct_id}", source_test_id: "${wt_id}", acquisition_mode: "PURCHASE", grain_capacity: 32000 }
              as: ServiceManager
              captures: { sys_id: $.data.id }
            - call: "POST /systems/${sys_id}/install"
              payload: {}
              as: FieldTech
              as_user_id: "${tech_id}"
            - call: "POST /systems/${sys_id}/activate"
              payload: {}
              as: FieldTech
              as_user_id: "${tech_id}"
            - call: "POST /cartridge-schedules"
              payload: { system_id: "${sys_id}", cartridge_type: "RO_MEMBRANE", interval_days: 180, last_replaced_at: "2026-01-01T00:00:00Z" }
              as: ServiceManager
              captures: { cs_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-20T00:00:00Z" }
              as: Dispatcher
          trigger:
            - call: "POST /cartridge-schedules/${cs_id}/evaluate"
              payload: {}
              as: Dispatcher
              captures: { st: $.data.status }
          assert:
            - "CartridgeSchedule.${cs_id}.status == DUE_SOON"

      - name: cartridge_replace_resets_and_logs_replacement
        claim_type: Side Effect Execution
        grounds:
          - state_machines.CartridgeSchedule.DUE_SOON_to_ON_TRACK
          - entities.CartridgeSchedule.fields.replacements_logged
        distinguishing_aspect: "Replacing a DUE_SOON cartridge resets status to ON_TRACK, increments replacements_logged to 1, and creates a CARTRIDGE_REPLACE ServiceVisit."
        test_recipe:
          setup:
            - "A DUE_SOON cartridge schedule on an ACTIVE system; clock at 2026-06-20."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Cr Owner", email: "cr@x.com" }
              as: ServiceManager
              captures: { cust_id: $.data.id }
            - call: "POST /field-techs"
              payload: { full_name: "Cr Tech", home_zone: "Z-NORTH" }
              as: ServiceManager
              captures: { tech_id: $.data.id }
            - call: "POST /accounts"
              payload: { customer_id: "${cust_id}", property_type: "POINT_OF_USE", service_zone: "Z-NORTH" }
              as: ServiceManager
              captures: { acct_id: $.data.id }
            - call: "POST /water-tests"
