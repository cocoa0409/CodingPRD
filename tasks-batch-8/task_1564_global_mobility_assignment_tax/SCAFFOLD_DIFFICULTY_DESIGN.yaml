  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: record_post_cascade_to_overrun_gate
        grounds:
          - state_machines.ShadowPayrollRecord.DRAFT_to_POSTED
          - calculations.chargeback_period_cost
          - calculations.overrun_posture_check
          - validations[priority=13]
        distinguishing_aspect: |
          Depth-4 chain from the record-post trigger: post -> creates
          ChargebackEntry(PERIOD_COST, 1311444) -> Assignment.ytd_chargeback_cents
          mutates -> overrun_posture_check flips cost_posture to OVERRUN (1311444 >
          1186290 x 1 x 1.10 = 1304919) -> the OVERRUN gate then rejects
          extension approve with ERR_COST_OVERRUN_BLOCKED. Each hop is caused by
          the previous link's mutation, not by the original call.
        test_recipe:
          setup:
            - "Activated assignment WITHOUT totalization; CURRENT cost projection exists (monthly_cost_cents 1186290)"
            - "September record with total 1203188, 20 per-diem days, receipts 300000"
          setup_api_calls:
            - { call: "POST /mobility/programs", payload: { name: "GM Program", home_country_code: "US", cost_overrun_threshold_pct: 110 }, as: MobilityAdmin, captures: { prog_id: "$.data.id" } }
            - { call: "POST /mobility/employees", payload: { employee_ref: "E1001", full_name: "Ada Assignee", home_country_code: "US", family_size: 2, annual_base_salary_cents: 10800000 }, as: MobilityAdmin, captures: { emp_id: "$.data.id" } }
            - { call: "POST /mobility/allowance-policies", payload: { policy_name: "JP Standard", host_country_code: "JP", effective_from: "2026-01-01", effective_to: "2027-12-31", per_diem_daily_cents: 7500, housing_monthly_cap_cents: 300000, cola_pct: 15 }, as: MobilityAdmin, captures: { pol_id: "$.data.id" } }
            - { call: "POST /mobility/assignments", payload: { program_id: "${prog_id}", employee_id: "${emp_id}", policy_id: "${pol_id}", host_country_code: "JP", host_business_unit: "BU-TOKYO", assignment_type: "LONG_TERM", totalization_applies: false, start_date: "2026-09-01", planned_end_date: "2027-08-31" }, as: MobilityAdmin, captures: { asg_id: "$.data.id" } }
            - { call: "POST /mobility/compensation-packages", payload: { assignment_id: "${asg_id}", letter_title: "Letter A", home_base_annual_cents: 10800000 }, as: PayrollSpecialist, as_user_id: "ps-1", captures: { pkg_id: "$.data.id" } }
            - { call: "POST /mobility/compensation-packages/${pkg_id}/submit", as: PayrollSpecialist, as_user_id: "ps-1" }
            - { call: "POST /mobility/compensation-packages/${pkg_id}/approve", as: MobilityApprover, as_user_id: "ma-9" }
            - { call: "POST /mobility/payroll-splits", payload: { assignment_id: "${asg_id}", home_payroll_pct: 60, host_payroll_pct: 40 }, as: PayrollSpecialist, captures: { spl_id: "$.data.id" } }
            - { call: "POST /mobility/payroll-splits/${spl_id}/activate", as: PayrollSpecialist }
            - { call: "POST /mobility/assignments/${asg_id}/submit", as: MobilityAdmin, as_user_id: "adm-1" }
            - { call: "POST /mobility/assignments/${asg_id}/approve-bu", as: BusinessUnitApprover, as_user_id: "bu-1" }
            - { call: "POST /mobility/assignments/${asg_id}/approve-mobility", as: MobilityApprover, as_user_id: "ma-9" }
            - { call: "GET /mobility/assignments/${asg_id}", as: MobilityAdmin, captures: { asg_v: "$.data.version" } }
            - { call: "POST /mobility/cost-projections", payload: { assignment_id: "${asg_id}", expected_assignment_version: "${asg_v}" }, as: FinanceController, captures: { proj_id: "$.data.id" } }
            - { call: "POST /mobility/shadow-payroll-records", payload: { assignment_id: "${asg_id}", tax_year: 2026, period_month: 9, total_gross_cents: 1203188, per_diem_days: 20, housing_receipts_cents: 300000 }, as: PayrollSpecialist, captures: { rec_id: "$.data.id" } }
            - { call: "POST /mobility/shadow-payroll-records/${rec_id}/post", as: PayrollSpecialist }
            - { call: "GET /mobility/chargeback-entries?assignment_id=${asg_id}", as: MobilityAdmin, captures: { cb_amount: "$.data[0].amount_cents", cb_id: "$.data[0].id" } }
            - { call: "GET /mobility/assignments/${asg_id}", as: MobilityAdmin, captures: { asg_v2: "$.data.version", asg_posture: "$.data.cost_posture" } }
            - { call: "POST /mobility/extension-requests", payload: { assignment_id: "${asg_id}", requested_new_end_date: "2027-10-31", expected_assignment_version: "${asg_v2}" }, as: MobilityAdmin, captures: { ext_id: "$.data.id" } }
