            - "the setup's create against ${rejected_id} returns 422 ERR_OFFTAKER_NOT_QUALIFIED and creates nothing: GET /ppa/deals with anchor_offtaker_id ${rejected_id} returns total_count 0"
            - "Project.${project_id}.contracted_mw is still 0 and available_mw still 100.000 after the refusal, so the failed create reserved no capacity"
            - "Offtaker.${conditional_id}.qualification_status == CONDITIONAL with conditions holding the single stored string"
            - "the trigger returns 201 with Deal.${deal_id}.status DRAFT, contract_price_usd_per_mwh 22.75 and collateral_threshold_usd 800000.00 = min(10000000.00, round(40000000.00 * 0.02, 2)) from the STANDARD tier"
            - "Deal.${deal_id}.credit_support_required_usd == 750000.00: exposure 1394550.00 less the 800000.00 threshold is 594550.00, ceil(2.3782) = 3 increments"
            - "the same payload therefore succeeded or failed purely on the anchor buyer's qualification_status, and a CONDITIONAL buyer is admissible at structuring time"

      - name: round_answered_after_its_deadline_is_expired_not_accepted
        claim_type: temporal_validation
        grounds:
          - validations.priority_19_ERR_ROUND_EXPIRED
          - endpoints.POST_/ppa/rounds/{id}/respond
          - endpoints.POST_/ppa/deals/{id}/rounds
          - state_machines.TermSheetRound.OPEN_to_EXPIRED
        distinguishing_aspect: |
          The round is still stored as OPEN when the clock passes its deadline - nothing
          sweeps it - so the lateness must be decided at answer time by comparing the
          clock against the stored response_deadline, and the refusal must be
          ERR_ROUND_EXPIRED rather than the state gate's ERR_INVALID_STATE_TRANSITION.
          The remedy is the developer tabling a fresh round, which is what actually
          flips the lapsed round to EXPIRED, and only then can the buyer accept. The
          comparison is inclusive, so answering exactly at the deadline second would
          still be legal.
        test_recipe:
          setup:
            - "CHAIN A with the QUALIFIED Northwind buyer and a 25.000 MW deal, term sheet issued with response_deadline 2026-08-15T00:00:00Z."
            - "The logical clock is then moved to 2026-08-20T00:00:00Z, five days past the deadline, without any other call touching the round."
