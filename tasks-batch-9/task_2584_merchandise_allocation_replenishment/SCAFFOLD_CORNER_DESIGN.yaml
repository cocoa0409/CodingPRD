            - call: "POST /allocation/items"
              payload: { program_id: "${prog_id}", sku_code: "SKU-1001", style_code: "ST-100", item_class: "APPAREL_TOP", item_type: "SEASONAL", size_profile_id: "${sp_id}", unit_cost_usd: 14.20, retail_price_usd: 36.50 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { item_id: $.data.id }
            - call: "POST /allocation/programs/${prog_id}/activate"
              payload: {}
              as: PlanningAdmin
              as_user_id: "u-plan-1"
            - call: "POST /allocation/store-positions"
              payload: { store_id: "${s1_id}", item_id: "${item_id}", on_hand_units: 6, size_on_hand: [{ size_code: "S", units: 0 }, { size_code: "M", units: 4 }, { size_code: "L", units: 2 }, { size_code: "XL", units: 0 }], on_order_units: 4, min_units: 12, max_units: 48, weekly_forecast_units: 9, trailing_4wk_sales_units: 30 }
              as: Allocator
              as_user_id: "u-alloc-1"
              captures: { p1_id: $.data.id }
            - call: "POST /allocation/store-positions"
              payload: { store_id: "${s2_id}", item_id: "${item_id}", on_hand_units: 20, size_on_hand: [{ size_code: "S", units: 5 }, { size_code: "M", units: 7 }, { size_code: "L", units: 6 }, { size_code: "XL", units: 2 }], min_units: 8, max_units: 24, weekly_forecast_units: 5, trailing_4wk_sales_units: 16 }
              as: Allocator
              as_user_id: "u-alloc-1"
              captures: { p2_id: $.data.id }
            - call: "POST /allocation/store-positions"
              payload: { store_id: "${s3_id}", item_id: "${item_id}", on_hand_units: 2, size_on_hand: [{ size_code: "S", units: 0 }, { size_code: "M", units: 1 }, { size_code: "L", units: 1 }, { size_code: "XL", units: 0 }], min_units: 8, max_units: 20, weekly_forecast_units: 3, trailing_4wk_sales_units: 6 }
              as: Allocator
              as_user_id: "u-alloc-1"
              captures: { p3_id: $.data.id }
            - call: "POST /allocation/store-positions"
              payload: { store_id: "${s4_id}", item_id: "${item_id}", on_hand_units: 0, size_on_hand: [], min_units: 6, max_units: 20, weekly_forecast_units: 2, trailing_4wk_sales_units: 5 }
              as: Allocator
              as_user_id: "u-alloc-1"
              captures: { p4_id: $.data.id }
            - call: "POST /allocation/receipts"
              payload: { program_id: "${prog_id}", item_id: "${item_id}", reference: "ASN-8007", units_received: 60, size_received: [{ size_code: "S", units: 12 }, { size_code: "M", units: 21 }, { size_code: "L", units: 18 }, { size_code: "XL", units: 9 }], receipt_date: "2026-08-01T00:00:00Z" }
              as: Allocator
              as_user_id: "u-alloc-1"
              captures: { rcpt_id: $.data.id, rcpt_v1: $.data.version }
            - call: "POST /allocation/receipts/${rcpt_id}/allocation-runs"
              payload: { method: "DEMAND_DRIVEN", need_basis: "FORWARD_LOOKING", expected_receipt_version: "${rcpt_v1}" }
              as: Allocator
              as_user_id: "u-alloc-1"
              captures: { run_id: $.data.id }
            - call: "POST /allocation/allocation-runs/${run_id}/propose"
              payload: {}
              as: Allocator
              as_user_id: "u-alloc-1"
            - call: "POST /allocation/allocation-runs/${run_id}/commit"
              payload: {}
              as: AllocationManager
              as_user_id: "u-mgr-1"
            - call: "GET /allocation/allocation-lines"
              payload: { run_id: "${run_id}", store_id: "${s1_id}" }
              as: Allocator
              captures: { l1_id: "$.data[0].id" }
            - call: "GET /allocation/receipts/${rcpt_id}"
              payload: {}
              as: Allocator
              captures: { rcpt_v2: $.data.version }
            - call: "POST /allocation/receipts/${rcpt_id}/allocation-runs"
              payload: { method: "DEMAND_DRIVEN", need_basis: "FORWARD_LOOKING", expected_receipt_version: "${rcpt_v2}" }
              as: Allocator
              as_user_id: "u-alloc-1"
              captures: { run2_id: $.data.id }
            - call: "POST /allocation/allocation-runs/${run2_id}/propose"
              payload: {}
              as: Allocator
              as_user_id: "u-alloc-1"
            - call: "GET /allocation/allocation-lines"
              payload: { run_id: "${run2_id}", store_id: "${s1_id}" }
              as: Allocator
              captures: { l2_id: "$.data[0].id" }
          trigger:
            - call: "POST /allocation/receipts/${rcpt_id}/close"
              payload: {}
              as: AllocationManager
              as_user_id: "u-mgr-1"
            - call: "GET /allocation/allocation-runs/${run2_id}"
              payload: {}
              as: Allocator
            - call: "GET /allocation/allocation-lines/${l2_id}"
              payload: {}
              as: Allocator
            - call: "GET /allocation/allocation-runs/${run_id}"
              payload: {}
              as: Allocator
            - call: "GET /allocation/programs/${prog_id}"
              payload: {}
              as: Allocator
          assert:
            - "The close returns 200 with Receipt.${rcpt_id}.status == CLOSED"
            - "Cascade - AllocationRun.${run2_id}.status == CANCELLED with units_proposed 0 preserved as a record, and AllocationLine.${l2_id}.fulfillment_status == RECALLED with units_allocated 0"
            - "The committed run is untouched: AllocationRun.${run_id}.status == COMMITTED and AllocationLine.${l1_id}.fulfillment_status == PENDING with units_allocated == 26"
            - "The ledger is unchanged by the close: units_received 60, units_committed 44, units_unallocated 16 - closing forfeits the 16 units without booking them"
            - "AllocationProgram.${prog_id}.total_units_received == 60, total_units_committed == 44 and open_reserve_units == 16, because a CLOSED receipt stays in the rollup"
            - "Run 2's three lines all read RECALLED while run 1's three lines all read PENDING - the cascade is keyed on the run status, not on the receipt"
            - "StorePosition.${p1_id}.on_hand_units is still 6 and in_transit_units 0: no stock moved anywhere"
      - name: commit_preconditions_each_violated_in_isolation
        claim_type: precondition_enforcement
        grounds:
          - state_machines[AllocationRun].transitions[PROPOSED->COMMITTED].preconditions
          - validations[priority:13]
          - validations[priority:14]
        excluded_because:
          difficulty_instance: presentation_minimum_safety_beats_fixture_capacity_constraint
          rationale: "That instance already commits a run whose lines violate the presentation-minimum precondition and the fixture-capacity precondition simultaneously, and it pins which error surfaces, so both preconditions of PROPOSED -> COMMITTED are already exercised with a run that stays PROPOSED and a receipt whose units_unallocated does not move."
      - name: store_closing_to_closed_precondition_on_residual_inventory
        claim_type: precondition_enforcement
        grounds:
          - state_machines[Store].transitions[CLOSING->CLOSED].preconditions
          - validations[priority:27]
          - errors.ERR_STORE_HAS_INVENTORY
        excluded_because:
          difficulty_instance: store_closed_cascades_position_exit_then_item_lifecycle
          rationale: "That instance refuses CLOSING -> CLOSED for store 0102 while it still holds 12 units (ERR_STORE_HAS_INVENTORY, store stays CLOSING) and then completes the same transition for the empty store 0101, which is exactly the precondition-violated and precondition-satisfied pair."
      - name: commit_side_effects_all_applied
        claim_type: side_effect_execution
        grounds:
          - state_machines[AllocationRun].transitions[PROPOSED->COMMITTED].side_effects
          - entities.Receipt.fields.units_committed
          - entities.AllocationProgram.fields.open_reserve_units
        excluded_because:
          difficulty_instance: run_commit_cascades_lines_then_receipt_ledger_then_program_reserve
          rationale: "Every declared side effect of PROPOSED -> COMMITTED is asserted there link by link: units_allocated on all three lines, the receipt units_committed / units_unallocated pair, the receipt status flip and the program reserve, plus committed_by_user_id and the explicit fact that no stock moved."
      - name: receipt_auto_allocates_when_its_last_unit_is_committed
        claim_type: bubble_up
        grounds:
          - state_machines[Receipt].transitions[ALLOCATING->ALLOCATED]
          - calculations.receipt_unit_ledger_invariant
        excluded_because:
          difficulty_instance: run_commit_cascades_lines_then_receipt_ledger_then_program_reserve
          rationale: "The parent Receipt auto-transitions ALLOCATING -> ALLOCATED there precisely because its children consumed the last unit (units_unallocated reaches exactly 0), and the assert states it would have stayed ALLOCATING for any pool greater than 44."
      - name: transfer_gated_by_the_other_stores_status
        claim_type: cross_entity
        grounds:
          - validations[priority:26]
          - errors.ERR_STORE_NOT_ELIGIBLE
          - state_machines[TransferRecommendation].transitions[APPROVED->DISPATCHED]
        excluded_because:
          difficulty_instance: transfer_dispatch_and_create_gated_by_the_other_stores_status
          rationale: "That instance changes only the Store machine and re-issues the identical transfer calls, showing a REMODEL receiver blocking create, a CLOSING store donating but never receiving, and a receiver that leaves ACTIVE between approve and dispatch - entity A changing while entity B is asserted."
      - name: ancestor_ledger_reconciles_before_and_after
        claim_type: ledger_sync
        grounds:
          - calculations.receipt_unit_ledger_invariant
          - entities.Receipt.fields.units_unallocated
          - entities.AllocationProgram.fields.total_units_committed
        excluded_because:
          difficulty_instance: receipt_unit_ledger_survives_commit_recall_recommit_with_zero_drift
          rationale: "The before/after reconciliation of the ancestor ledger is the whole subject of that instance: 44 = 44 + 0 before recall, 44 = 0 + 44 after it, and 44 = 44 + 0 again after the re-commit, with the program totals asserted at each checkpoint."
      - name: undo_reverses_every_original_side_effect
        claim_type: compensation
        grounds:
          - calculations.network_on_hand_invariant
          - state_machines[TransferRecommendation].transitions[APPROVED->CANCELLED].side_effects
          - entities.StorePosition.fields.reserved_out_units
        excluded_because:
          difficulty_instance: network_on_hand_is_conserved_across_approve_cancel_and_approve_dispatch_receive
          rationale: "Cancel is shown to be the exact inverse of approve there - reserved_out_units returns to 0, available_units back to 30 and stock_status back to OVERSTOCK, with NET(item) == 39 asserted after every one of the seven calls, i.e. no drift."
      - name: action_supersession_only_when_the_position_recovers
        claim_type: conditional_cascade
        grounds:
          - state_machines[AssortmentAction].transitions[PENDING->SUPERSEDED]
          - calculations.assortment_health_derivation
        excluded_because:
          difficulty_instance: transfer_receive_cascades_position_then_item_then_assortment_action
          rationale: "That instance supersedes the PENDING action only because the position reached COMPLETE, and its sibling store-closure instance shows the same action staying PENDING when the position lands on EXITED instead - the same cascade step applied in one child state and skipped in the other."
      - name: execute_guarded_by_the_shared_items_lifecycle
        claim_type: guarded_transitions
        grounds:
          - validations[priority:10]
          - state_machines[AssortmentAction].transitions[PENDING->EXECUTED]
          - errors.ERR_ITEM_LIFECYCLE_BLOCKED
        excluded_because:
          difficulty_instance: assortment_action_execute_gated_by_the_shared_items_lifecycle_state
          rationale: "The cross-entity guard 'PENDING -> EXECUTED only if the Item is SIZE_OUT_WATCH or BROKEN' is tested there from both sides, including the case where executing one action changes the shared item state and thereby blocks the sibling action with ERR_ITEM_LIFECYCLE_BLOCKED."
  # section 1.3 calculations: algorithms, input sets, constants and precision
  - section: calculations
    instances:
      - name: resolved_replenishment_model_from_override_then_item_type
        claim_type: correct_result
        grounds:
          - calculations.replenishment_model_resolution
          - entities.Item.fields.replenishment_model
          - entities.Item.fields.replenishment_model_override
          - validations[priority:20]
          - errors.ERR_METHOD_MODEL_MISMATCH
          - endpoints.PATCH /allocation/items/{itemId}
        distinguishing_aspect: |
          The whole truth table of the resolution is walked with representative inputs: the three item_type
          mappings (BASIC -> MIN_MAX, SEASONAL -> DEMAND_DRIVEN, FASHION -> PUSH) and the override that beats
          the mapping. The result is only observable in two places, and both are checked - the computed
          Item.replenishment_model, and the run-creation gate that must pair MIN_MAX with MIN_MAX_TOPUP,
          DEMAND_DRIVEN with DEMAND_DRIVEN and PUSH with PUSH_SIZE_PROFILE. The resolution is then shown NOT
          to be frozen at item creation: a PATCH that adds an override flips which method the very next run
          creation will accept, and setting the override back to null restores the item_type mapping.
        test_recipe:
          setup:
            - "Program FA26 ACTIVE with store 0101 (shelf plan capacity 48 / pmin 12) and SizeProfile TOP-4SZ"
            - "Four items, all APPAREL_TOP on TOP-4SZ: SKU-1001 SEASONAL, SKU-2001 BASIC, SKU-3001 FASHION, and SKU-4001 FASHION with replenishment_model_override = MIN_MAX"
            - "Four 12-unit STAGED receipts, one per item; no store positions are needed because no run is proposed"
            - "Each item's wrong-method run creation is attempted FIRST, against the pristine receipt version, so the priority-20 method/model rule is reached and not shadowed by the priority-11 OCC rule"
          setup_api_calls:
            - call: "POST /allocation/programs"
              payload: { name: "FA26 Core Tops", season_code: "FA26", banner_code: "NORTH" }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { prog_id: $.data.id }
            - call: "POST /allocation/stores"
              payload: { program_id: "${prog_id}", store_code: "0101", grade: "A", grade_index_bp: 13000, cluster_code: "URBAN", freight_flat_usd: 41.00, historical_sell_through_bp: 6500 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { s1_id: $.data.id }
            - call: "POST /allocation/fixture-plans"
              payload: { store_id: "${s1_id}", item_class: "APPAREL_TOP", effective_from: "2026-07-01T00:00:00Z", fixture_count: 4, facings_per_fixture: 3, units_per_facing: 4, presentation_min_units: 12 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
            - call: "POST /allocation/size-profiles"
              payload: { program_id: "${prog_id}", profile_code: "TOP-4SZ", item_class: "APPAREL_TOP", size_curve: [{ size_code: "S", share_bp: 2000 }, { size_code: "M", share_bp: 3500 }, { size_code: "L", share_bp: 3000 }, { size_code: "XL", share_bp: 1500 }] }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { sp_id: $.data.id }
            - call: "POST /allocation/items"
              payload: { program_id: "${prog_id}", sku_code: "SKU-1001", style_code: "ST-100", item_class: "APPAREL_TOP", item_type: "SEASONAL", size_profile_id: "${sp_id}", unit_cost_usd: 14.20, retail_price_usd: 36.50 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { i1_id: $.data.id }
            - call: "POST /allocation/items"
              payload: { program_id: "${prog_id}", sku_code: "SKU-2001", style_code: "ST-200", item_class: "APPAREL_TOP", item_type: "BASIC", size_profile_id: "${sp_id}", unit_cost_usd: 14.20, retail_price_usd: 36.50 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { i2_id: $.data.id }
            - call: "POST /allocation/items"
              payload: { program_id: "${prog_id}", sku_code: "SKU-3001", style_code: "ST-300", item_class: "APPAREL_TOP", item_type: "FASHION", size_profile_id: "${sp_id}", unit_cost_usd: 14.20, retail_price_usd: 36.50 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { i3_id: $.data.id }
            - call: "POST /allocation/items"
              payload: { program_id: "${prog_id}", sku_code: "SKU-4001", style_code: "ST-400", item_class: "APPAREL_TOP", item_type: "FASHION", size_profile_id: "${sp_id}", unit_cost_usd: 14.20, retail_price_usd: 36.50, replenishment_model_override: "MIN_MAX" }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { i4_id: $.data.id }
            - call: "POST /allocation/programs/${prog_id}/activate"
              payload: {}
              as: PlanningAdmin
              as_user_id: "u-plan-1"
            - call: "POST /allocation/receipts"
              payload: { program_id: "${prog_id}", item_id: "${i1_id}", reference: "ASN-C101", units_received: 12, size_received: [{ size_code: "S", units: 2 }, { size_code: "M", units: 4 }, { size_code: "L", units: 4 }, { size_code: "XL", units: 2 }], receipt_date: "2026-08-01T00:00:00Z" }
              as: Allocator
              as_user_id: "u-alloc-1"
