              payload: {}
              as: PropertyManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "Lease.${lease_id}.status == ACTIVE"

  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: duplicate_recon_period_posted_year_collides
        grounds:
          - validations[priority=14]
          - errors[ERR_DUPLICATE_RECON_PERIOD]
          - entities.Reconciliation.fields.recon_year
        distinguishing_aspect: |
          Reconciliation resource, full-year closed-period semantics: once a
          reconciliation for (lease_id, recon_year=2025) is POSTED it claims the
          entire 2025 period; creating a second reconciliation for the same
          (lease, 2025) collides with ERR_DUPLICATE_RECON_PERIOD. The conflict is
          measured against POSTED periods only.
        test_recipe:
          setup:
            - "A POSTED reconciliation for (subject lease, 2025); attempt to create a SECOND reconciliation for the same lease and year."
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "DupProp", total_rentable_sqft: 10000, gross_up_occupancy_pct: 0.95 }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /tenants"
              payload: { legal_name: "DupAnchor", contact_email: "da@x.com" }
              as: PropertyManager
              captures: { ten_anchor_id: $.data.id }
            - call: "POST /tenants"
              payload: { legal_name: "DupSubj", contact_email: "ds@x.com" }
              as: PropertyManager
              captures: { ten_subj_id: $.data.id }
            - call: "POST /leases"
              payload: { property_id: "${prop_id}", tenant_id: "${ten_anchor_id}", leased_sqft: 7000, base_rent_cents_annual: 0 }
              as: PropertyManager
              captures: { lease_anchor_id: $.data.id }
            - call: "POST /leases/${lease_anchor_id}/activate"
              payload: {}
              as: PropertyManager
            - call: "POST /leases"
              payload: { property_id: "${prop_id}", tenant_id: "${ten_subj_id}", leased_sqft: 2500, base_rent_cents_annual: 0, estimated_cam_cents_monthly: 15000 }
              as: PropertyManager
              captures: { lease_subj_id: $.data.id }
            - call: "POST /leases/${lease_subj_id}/activate"
              payload: {}
              as: PropertyManager
            - call: "POST /expense-pools"
              payload: { property_id: "${prop_id}", pool_year: 2025, pro_rata_denominator: "TOTAL_RENTABLE", admin_fee_pct: 0 }
              as: Accountant
              captures: { pool_id: $.data.id }
            - call: "POST /expense-pools/${pool_id}/line-items"
              payload: { category: "UTILITIES", amount_cents: 800000, recoverability: "RECOVERABLE", is_variable: true }
              as: Accountant
            - call: "POST /expense-pools/${pool_id}/line-items"
              payload: { category: "INSURANCE", amount_cents: 200000, recoverability: "RECOVERABLE", is_variable: false }
              as: Accountant
            - call: "POST /reconciliations"
              payload: { lease_id: "${lease_subj_id}", pool_id: "${pool_id}", recon_year: 2025 }
              as: PropertyManager
              captures: { recon_id: $.data.id }
            - call: "POST /reconciliations/${recon_id}/submit"
              payload: {}
              as: PropertyManager
              as_user_id: "pm-001"
            - call: "GET /reconciliations/${recon_id}"
              payload: {}
              as: Accountant
              captures: { recon_v: $.data.version }
            - call: "POST /reconciliations/${recon_id}/post"
              payload: { expected_reconciliation_version: "${recon_v}" }
              as: Accountant
              as_user_id: "acct-001"
          trigger:
            - call: "POST /reconciliations"
              payload: { lease_id: "${lease_subj_id}", pool_id: "${pool_id}", recon_year: 2025 }
              as: PropertyManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_DUPLICATE_RECON_PERIOD"

      - name: percentage_rent_run_year_already_run_collides
        grounds:
          - validations[priority=15]
          - errors[ERR_PCT_RENT_ALREADY_RUN]
          - calculations.percentage_rent
          - entities.SalesReport.fields.period_year
        distinguishing_aspect: |
          Lease percentage-rent resource, single-occupancy-per-period semantics on
          a DIFFERENT resource than Reconciliation: a (lease, period_year=2025)
          percentage-rent run may occur at most once; a second run for the same
          (lease, 2025) collides with ERR_PCT_RENT_ALREADY_RUN. Unlike the closed-
          period recon rule, this guards a one-shot charge action, not a POSTED
          aggregate, so the interval arithmetic is occupancy-of-a-singleton.
        test_recipe:
          setup:
            - "Active lease with pct_rent_rate=0.06, breakpoint 3000000; a SalesReport for 2025 (gross 5000000); percentage rent already run once for 2025."
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "RunProp", total_rentable_sqft: 100000 }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /tenants"
              payload: { legal_name: "RunTen", contact_email: "r@x.com" }
              as: PropertyManager
              captures: { ten_id: $.data.id }
            - call: "POST /leases"
              payload: { property_id: "${prop_id}", tenant_id: "${ten_id}", leased_sqft: 1000, base_rent_cents_annual: 0, pct_rent_rate: 0.06, pct_rent_breakpoint_cents: 3000000 }
              as: PropertyManager
              captures: { lease_id: $.data.id }
            - call: "POST /leases/${lease_id}/activate"
              payload: {}
              as: PropertyManager
            - call: "POST /sales-reports"
              payload: { lease_id: "${lease_id}", period_year: 2025, gross_sales_cents: 5000000 }
              as: PropertyManager
            - call: "POST /leases/${lease_id}/percentage-rent-run"
              payload: { period_year: 2025 }
              as: PropertyManager
          trigger:
            - call: "POST /leases/${lease_id}/percentage-rent-run"
              payload: { period_year: 2025 }
              as: PropertyManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_PCT_RENT_ALREADY_RUN"
            - "Lease.${lease_id}.outstanding_balance_cents == 120000"

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: void_reverses_true_up_balance_invariant
        grounds:
          - state_machines.Reconciliation.DISPUTED_to_VOID
          - state_machines.Reconciliation.IN_REVIEW_to_POSTED
          - entities.Lease.fields.outstanding_balance_cents
          - entities.LedgerEntry.fields.amount_cents
        distinguishing_aspect: |
          Conserved quantity = Lease.outstanding_balance_cents. Forward action
          (post) adds a +70000 CAM_TRUEUP; compensating action (void via DISPUTED)
          adds an exact -70000 CREDIT_ADJUSTMENT, leaving outstanding_balance_cents
          back at its pre-post value of 0 (sum of all LedgerEntry.amount_cents == 0).
        test_recipe:
          setup:
            - "A POSTED reconciliation (true_up +70000) on subject lease (base_rent 0, pre-post balance 0), then tenant-disputed so it is VOID-eligible."
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "VoidProp", total_rentable_sqft: 10000, gross_up_occupancy_pct: 0.95 }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /tenants"
              payload: { legal_name: "VAnchor", contact_email: "va@x.com" }
              as: PropertyManager
              captures: { ten_anchor_id: $.data.id }
            - call: "POST /tenants"
              payload: { legal_name: "VSubj", contact_email: "vs@x.com" }
              as: PropertyManager
              captures: { ten_subj_id: $.data.id }
            - call: "POST /leases"
              payload: { property_id: "${prop_id}", tenant_id: "${ten_anchor_id}", leased_sqft: 7000, base_rent_cents_annual: 0 }
              as: PropertyManager
              captures: { lease_anchor_id: $.data.id }
            - call: "POST /leases/${lease_anchor_id}/activate"
              payload: {}
              as: PropertyManager
            - call: "POST /leases"
              payload: { property_id: "${prop_id}", tenant_id: "${ten_subj_id}", leased_sqft: 2500, base_rent_cents_annual: 0, estimated_cam_cents_monthly: 15000 }
              as: PropertyManager
              captures: { lease_subj_id: $.data.id }
            - call: "POST /leases/${lease_subj_id}/activate"
              payload: {}
              as: PropertyManager
            - call: "POST /expense-pools"
              payload: { property_id: "${prop_id}", pool_year: 2025, pro_rata_denominator: "TOTAL_RENTABLE", admin_fee_pct: 0 }
              as: Accountant
              captures: { pool_id: $.data.id }
            - call: "POST /expense-pools/${pool_id}/line-items"
              payload: { category: "UTILITIES", amount_cents: 800000, recoverability: "RECOVERABLE", is_variable: true }
              as: Accountant
            - call: "POST /expense-pools/${pool_id}/line-items"
              payload: { category: "INSURANCE", amount_cents: 200000, recoverability: "RECOVERABLE", is_variable: false }
              as: Accountant
            - call: "POST /reconciliations"
              payload: { lease_id: "${lease_subj_id}", pool_id: "${pool_id}", recon_year: 2025 }
              as: PropertyManager
              captures: { recon_id: $.data.id }
            - call: "POST /reconciliations/${recon_id}/submit"
              payload: {}
              as: PropertyManager
              as_user_id: "pm-001"
            - call: "GET /reconciliations/${recon_id}"
              payload: {}
              as: Accountant
              captures: { recon_v: $.data.version }
            - call: "POST /reconciliations/${recon_id}/post"
              payload: { expected_reconciliation_version: "${recon_v}" }
              as: Accountant
              as_user_id: "acct-001"
            - call: "POST /reconciliations/${recon_id}/dispute"
              payload: {}
              as: Tenant
              as_user_id: "${ten_subj_id}"
          trigger:
            - call: "POST /reconciliations/${recon_id}/void"
              payload: {}
              as: Accountant
              as_user_id: "acct-001"
          assert:
            - "Reconciliation.${recon_id}.status == VOID"
            - "Lease.${lease_subj_id}.outstanding_balance_cents == 0"
            - "ExpensePool.${pool_id}.status == OPEN"

      - name: activate_terminate_occupancy_invariant
        grounds:
          - state_machines.Lease.DRAFT_to_ACTIVE
          - state_machines.Lease.ACTIVE_to_TERMINATED
          - entities.Property.fields.occupied_sqft
        distinguishing_aspect: |
          Conserved quantity = Property.occupied_sqft (a DIFFERENT conserved
          quantity than the ledger balance). Forward action (activate) adds
          leased_sqft 2500; compensating action (terminate) subtracts the same
          2500, returning Property.occupied_sqft to its pre-activation value of 0.
        test_recipe:
          setup:
            - "A property with occupied_sqft 0 and a single lease of 2500 sqft activated then terminated (no open reconciliations blocking termination)."
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "InvProp", total_rentable_sqft: 10000 }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /tenants"
              payload: { legal_name: "InvTen", contact_email: "i@x.com" }
              as: PropertyManager
              captures: { ten_id: $.data.id }
            - call: "POST /leases"
              payload: { property_id: "${prop_id}", tenant_id: "${ten_id}", leased_sqft: 2500, base_rent_cents_annual: 0 }
              as: PropertyManager
              captures: { lease_id: $.data.id }
            - call: "POST /leases/${lease_id}/activate"
              payload: {}
              as: PropertyManager
          trigger:
            - call: "POST /leases/${lease_id}/terminate"
              payload: {}
              as: PropertyManager
          assert:
            - "Property.${prop_id}.occupied_sqft == 0"
            - "Lease.${lease_id}.status == TERMINATED"
