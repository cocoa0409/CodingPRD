  # ===========================================================================
  # Table 6 has no claim-type rows of its own: the guide's instruction is
  # "verify every error code is triggerable". Each instance below therefore
  # carries claim_type "Error triggerable" and names the codes it fires. The
  # codes already fired by SCAFFOLD_DIFFICULTY_DESIGN.yaml or by the sections
  # above are not repeated here; the ledger at the end of this section records
  # which instance owns each of the 59 catalog entries.
      - name: reclassification_and_cure_recompute_the_row_and_the_roll_up
        claim_type: Conditional action
        grounds: ["endpoints.POST /use-tax-purchases/{id}/reclassify", "endpoints.POST /exemption-certificates/{id}/cure", calculations.use_tax_liability, calculations.certificate_deficiency, errors.ERR_CAPITAL_ASSET_FMV_REQUIRED]
        distinguishing_aspect: |
          The two in-place recompute endpoints, each gated by its own condition.
          Reclassifying into the CAPITAL_ASSET stepdown branch (first_use_outside_state
          true, months_used_outside_state >= FMV_STEPDOWN_MONTHS) without a fair market
          value is refused 422 and must leave the row exactly as it was — 250000 due,
          reclassification_count still 0. Supplied, the same reclassification walks the
          whole formula: basis 4500000, gross 281250, credit clamped at 200000, due
          81250. On the certificate side, cure is the only endpoint that deliberately
          does NOT re-run the roll-up: after the cure the audit still carries the
          125000 it was assessed, and only the following VALIDATED review drops it to
          0. An implementation that recomputes on cure fails assert 5.
        test_recipe:
          setup:
            - "Permit P-2710-P8 carried to a FIELDWORK audit (agreed RATIO_ESTIMATION methodology) at clock 2026-06-30, with one CONSUMABLE purchase of 4000000 and one unlinked certificate covering 2000000 that fails good faith on form_complete."
