# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 Difficulty Rules x >=2 instances each. Every grounds/ref resolves into
# SCAFFOLD.yaml §1.1-§1.7. All formula-derived asserts are pre-computed literals.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: claim_payout_provisional_vs_final_diverge
        grounds:
          - calculations.claim_payout
          - entities.Claim.fields.provisional_payout_cents
          - entities.Claim.fields.final_payout_cents
          - state_machines.Claim.UNDER_REVIEW_to_APPROVED
        distinguishing_aspect: "On a FIXED program whose fund is partly depleted, the same claim's provisional (20000, advertised-based) and final (10000, fund-clamped) payouts differ — the divergence is on the Claim entity domain."
        test_recipe:
          setup:
            - "FIXED program PF2 OPEN: fund_total 30000, advertised 20000, per_claim_cap 25000, min_purchase 5000, min_documents 1, window 2026-06-01..2026-09-01"
            - "Two VERIFIED consumers A and B; claim CA (claimed 25000) already APPROVED debiting 20000 so fund_remaining is 10000; claim CB (claimed 25000) UNDER_REVIEW"
          setup_api_calls:
            - call: "POST /rebate-aggregator/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rebate-aggregator/programs"
              payload: { name: "PF2", settlement_case_id: "CASE_PF2", category: "PRODUCT_REBATE", distribution_method: "FIXED", fund_total_cents: 30000, advertised_amount_cents: 20000, per_claim_cap_cents: 25000, eligibility_min_purchase_cents: 5000, requires_proof: true, min_documents: 1, claim_window_open_at: "2026-06-01T00:00:00Z", claim_window_close_at: "2026-09-01T00:00:00Z" }
              as: ProgramManager
              captures: { pid: $.data.id }
            - call: "POST /rebate-aggregator/programs/${pid}/open"
              payload: {}
              as: ProgramManager
              captures: { pver1: $.data.version }
            - call: "POST /rebate-aggregator/consumers"
              payload: { email: "a@x.com", full_name: "A" }
              as: Anonymous
              captures: { cida: $.data.id }
            - call: "POST /rebate-aggregator/consumers/${cida}/verify"
              payload: {}
              as: PlatformAdmin
            - call: "POST /rebate-aggregator/consumers"
              payload: { email: "b@x.com", full_name: "B" }
              as: Anonymous
              captures: { cidb: $.data.id }
            - call: "POST /rebate-aggregator/consumers/${cidb}/verify"
              payload: {}
              as: PlatformAdmin
            - call: "POST /rebate-aggregator/claims"
              payload: { consumer_id: "${cida}", program_id: "${pid}", benefit_period_start: "2026-01-01T00:00:00Z", benefit_period_end: "2026-02-01T00:00:00Z", claimed_amount_cents: 25000 }
              as: Consumer
              as_user_id: "${cida}"
              captures: { clida: $.data.id }
            - call: "POST /rebate-aggregator/claims/${clida}/documents"
              payload: { doc_type: "RECEIPT", file_ref: "ra" }
              as: Consumer
              as_user_id: "${cida}"
              captures: { docida: $.data.id }
            - call: "POST /rebate-aggregator/claims/${clida}/submit"
              payload: {}
              as: Consumer
              as_user_id: "${cida}"
            - call: "POST /rebate-aggregator/documents/${docida}/verify"
              payload: {}
              as: ClaimReviewer
              as_user_id: "rev-1"
            - call: "POST /rebate-aggregator/claims/${clida}/start-review"
              payload: {}
              as: ClaimReviewer
              as_user_id: "rev-1"
            - call: "POST /rebate-aggregator/claims/${clida}/approve"
              payload: { expected_program_version: "${pver1}" }
              as: ClaimReviewer
              as_user_id: "rev-1"
            - call: "POST /rebate-aggregator/claims"
              payload: { consumer_id: "${cidb}", program_id: "${pid}", benefit_period_start: "2026-01-01T00:00:00Z", benefit_period_end: "2026-02-01T00:00:00Z", claimed_amount_cents: 25000 }
              as: Consumer
              as_user_id: "${cidb}"
              captures: { clidb: $.data.id }
            - call: "POST /rebate-aggregator/claims/${clidb}/documents"
              payload: { doc_type: "RECEIPT", file_ref: "rb" }
              as: Consumer
              as_user_id: "${cidb}"
              captures: { docidb: $.data.id }
            - call: "POST /rebate-aggregator/claims/${clidb}/submit"
              payload: {}
              as: Consumer
              as_user_id: "${cidb}"
            - call: "POST /rebate-aggregator/documents/${docidb}/verify"
              payload: {}
              as: ClaimReviewer
              as_user_id: "rev-1"
            - call: "POST /rebate-aggregator/claims/${clidb}/start-review"
              payload: {}
              as: ClaimReviewer
              as_user_id: "rev-1"
          trigger:
            - call: "GET /rebate-aggregator/programs/${pid}"
              payload: {}
              as: ProgramManager
              captures: { pver2: $.data.version }
            - call: "POST /rebate-aggregator/claims/${clidb}/approve"
              payload: { expected_program_version: "${pver2}" }
              as: ClaimReviewer
              as_user_id: "rev-1"
          assert:
            - "Claim.${clidb}.provisional_payout_cents == 20000"
            - "Claim.${clidb}.final_payout_cents == 10000"
            - "Claim.${clidb}.provisional_payout_cents != Claim.${clidb}.final_payout_cents"
            - "Claim.${clidb}.net_payout_cents == 8200"

      - name: consumer_risk_optimistic_vs_pessimistic_diverge
        grounds:
          - calculations.consumer_risk_score
          - entities.Consumer.fields.optimistic_risk_score
          - entities.Consumer.fields.pessimistic_risk_score
          - state_machines.FraudFlag.OPEN_to_CLEARED
        distinguishing_aspect: "For a VERIFIED consumer with two OPEN (unconfirmed) fraud flags, the optimistic score (0, excludes OPEN) and pessimistic score (50, includes OPEN) diverge — the divergence is on the Consumer entity domain, a different domain from claim_payout."
        test_recipe:
          setup:
            - "VERIFIED consumer with two DRAFT claims, each carrying one OPEN FraudFlag; no CONFIRMED flags, no REJECTED claims"
          setup_api_calls:
            - call: "POST /rebate-aggregator/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rebate-aggregator/programs"
              payload: { name: "PR", settlement_case_id: "CASE_PR", category: "PRODUCT_REBATE", distribution_method: "FIXED", fund_total_cents: 100000, advertised_amount_cents: 20000, per_claim_cap_cents: 30000, eligibility_min_purchase_cents: 5000, requires_proof: true, min_documents: 1, claim_window_open_at: "2026-06-01T00:00:00Z", claim_window_close_at: "2026-09-01T00:00:00Z" }
              as: ProgramManager
              captures: { pid: $.data.id }
            - call: "POST /rebate-aggregator/programs/${pid}/open"
              payload: {}
              as: ProgramManager
            - call: "POST /rebate-aggregator/consumers"
              payload: { email: "r@x.com", full_name: "R" }
              as: Anonymous
              captures: { cid: $.data.id }
            - call: "POST /rebate-aggregator/consumers/${cid}/verify"
              payload: {}
              as: PlatformAdmin
            - call: "POST /rebate-aggregator/claims"
              payload: { consumer_id: "${cid}", program_id: "${pid}", benefit_period_start: "2026-01-01T00:00:00Z", benefit_period_end: "2026-02-01T00:00:00Z", claimed_amount_cents: 25000 }
              as: Consumer
              as_user_id: "${cid}"
              captures: { cl1: $.data.id }
            - call: "POST /rebate-aggregator/claims"
              payload: { consumer_id: "${cid}", program_id: "${pid}", benefit_period_start: "2026-03-01T00:00:00Z", benefit_period_end: "2026-04-01T00:00:00Z", claimed_amount_cents: 25000 }
              as: Consumer
              as_user_id: "${cid}"
              captures: { cl2: $.data.id }
            - call: "POST /rebate-aggregator/claims/${cl1}/fraud-flags"
              payload: { reason: "SUSPICIOUS_DOCS" }
              as: FraudAnalyst
              as_user_id: "fraud-1"
            - call: "POST /rebate-aggregator/claims/${cl2}/fraud-flags"
              payload: { reason: "DUPLICATE" }
              as: FraudAnalyst
              as_user_id: "fraud-1"
          trigger:
            - call: "GET /rebate-aggregator/consumers/${cid}"
              payload: {}
              as: PlatformAdmin
              captures: { opt: $.data.optimistic_risk_score, pess: $.data.pessimistic_risk_score }
          assert:
            - "Consumer.${cid}.optimistic_risk_score == 0"
            - "Consumer.${cid}.pessimistic_risk_score == 50"
            - "Consumer.${cid}.optimistic_risk_score != Consumer.${cid}.pessimistic_risk_score"

  - rule_id: combinatorial_formula
    instances:
      - name: contingency_fee_tier_select_clamp_discount
        grounds:
          - calculations.contingency_fee
          - calculations.net_payout
          - entities.Claim.fields.contingency_fee_cents
          - state_machines.Claim.UNDER_REVIEW_to_APPROVED
        distinguishing_aspect: "Mode (a): fee on gross 20000 for a VERIFIED consumer combines tier-rate selection (20% tier2), min/max clamp, and the 10% verified discount into 3600 = round_half_up(min(max(round_half_up(20000*0.20),500),25000)*0.90)."
        test_recipe:
          setup:
            - "FIXED program OPEN: fund_total 100000, advertised 20000, per_claim_cap 30000; VERIFIED consumer; claim claimed 25000 reviewed to UNDER_REVIEW with a VERIFIED document"
          setup_api_calls:
            - call: "POST /rebate-aggregator/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rebate-aggregator/programs"
              payload: { name: "PA", settlement_case_id: "CASE_PA", category: "PRODUCT_REBATE", distribution_method: "FIXED", fund_total_cents: 100000, advertised_amount_cents: 20000, per_claim_cap_cents: 30000, eligibility_min_purchase_cents: 5000, requires_proof: true, min_documents: 1, claim_window_open_at: "2026-06-01T00:00:00Z", claim_window_close_at: "2026-09-01T00:00:00Z" }
              as: ProgramManager
              captures: { pid: $.data.id }
            - call: "POST /rebate-aggregator/programs/${pid}/open"
              payload: {}
              as: ProgramManager
              captures: { pver: $.data.version }
            - call: "POST /rebate-aggregator/consumers"
              payload: { email: "fa@x.com", full_name: "FA" }
              as: Anonymous
              captures: { cid: $.data.id }
            - call: "POST /rebate-aggregator/consumers/${cid}/verify"
              payload: {}
              as: PlatformAdmin
            - call: "POST /rebate-aggregator/claims"
              payload: { consumer_id: "${cid}", program_id: "${pid}", benefit_period_start: "2026-01-01T00:00:00Z", benefit_period_end: "2026-02-01T00:00:00Z", claimed_amount_cents: 25000 }
              as: Consumer
              as_user_id: "${cid}"
              captures: { clid: $.data.id }
            - call: "POST /rebate-aggregator/claims/${clid}/documents"
              payload: { doc_type: "RECEIPT", file_ref: "r1" }
              as: Consumer
              as_user_id: "${cid}"
              captures: { docid: $.data.id }
            - call: "POST /rebate-aggregator/claims/${clid}/submit"
              payload: {}
              as: Consumer
              as_user_id: "${cid}"
            - call: "POST /rebate-aggregator/documents/${docid}/verify"
              payload: {}
              as: ClaimReviewer
              as_user_id: "rev-1"
            - call: "POST /rebate-aggregator/claims/${clid}/start-review"
              payload: {}
              as: ClaimReviewer
              as_user_id: "rev-1"
          trigger:
            - call: "POST /rebate-aggregator/claims/${clid}/approve"
              payload: { expected_program_version: "${pver}" }
              as: ClaimReviewer
              as_user_id: "rev-1"
          assert:
            - "Claim.${clid}.final_payout_cents == 20000"
            - "Claim.${clid}.contingency_fee_cents == 3600"
            - "Claim.${clid}.net_payout_cents == 16400"

      - name: pro_rata_settlement_floor_then_distribute_remainder
        grounds:
          - calculations.pro_rata_settlement
          - state_machines.RebateProgram.OPEN_to_CLOSED
          - entities.Claim.fields.final_payout_cents
        distinguishing_aspect: "Mode (b): pool 100000 over claimed {50000,30000,20001} floors to {49999,29999,20000} then distributes the 2-cent remainder to the two earliest-created claims -> {50000,30000,20000}; sum-then-round would not reproduce these cents."
        test_recipe:
          setup:
            - "PRO_RATA program OPEN: fund_total 100000, per_claim_cap 60000, advertised 60000; three VERIFIED consumers A,B,C (created in that order)"
            - "Three APPROVED claims Ca(50000, earliest), Cb(30000), Cc(20001, latest), all with VERIFIED docs; program not yet closed"
          setup_api_calls:
            - call: "POST /rebate-aggregator/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rebate-aggregator/programs"
              payload: { name: "PP", settlement_case_id: "CASE_PP", category: "CLASS_ACTION", distribution_method: "PRO_RATA", fund_total_cents: 100000, advertised_amount_cents: 60000, per_claim_cap_cents: 60000, eligibility_min_purchase_cents: 5000, requires_proof: true, min_documents: 1, claim_window_open_at: "2026-06-01T00:00:00Z", claim_window_close_at: "2026-09-01T00:00:00Z" }
              as: ProgramManager
              captures: { pid: $.data.id }
            - call: "POST /rebate-aggregator/programs/${pid}/open"
              payload: {}
              as: ProgramManager
            - call: "POST /rebate-aggregator/consumers"
              payload: { email: "pa@x.com", full_name: "PA" }
              as: Anonymous
              captures: { ca: $.data.id }
            - call: "POST /rebate-aggregator/consumers/${ca}/verify"
              payload: {}
              as: PlatformAdmin
            - call: "POST /rebate-aggregator/consumers"
              payload: { email: "pb@x.com", full_name: "PB" }
              as: Anonymous
              captures: { cb: $.data.id }
            - call: "POST /rebate-aggregator/consumers/${cb}/verify"
              payload: {}
              as: PlatformAdmin
            - call: "POST /rebate-aggregator/consumers"
              payload: { email: "pc@x.com", full_name: "PC" }
              as: Anonymous
              captures: { cc: $.data.id }
            - call: "POST /rebate-aggregator/consumers/${cc}/verify"
              payload: {}
              as: PlatformAdmin
            - call: "POST /rebate-aggregator/claims"
              payload: { consumer_id: "${ca}", program_id: "${pid}", benefit_period_start: "2026-01-01T00:00:00Z", benefit_period_end: "2026-02-01T00:00:00Z", claimed_amount_cents: 50000 }
              as: Consumer
              as_user_id: "${ca}"
              captures: { cla: $.data.id }
            - call: "POST /rebate-aggregator/claims/${cla}/documents"
              payload: { doc_type: "RECEIPT", file_ref: "da" }
              as: Consumer
              as_user_id: "${ca}"
              captures: { da: $.data.id }
            - call: "POST /rebate-aggregator/claims/${cla}/submit"
              payload: {}
              as: Consumer
              as_user_id: "${ca}"
            - call: "POST /rebate-aggregator/documents/${da}/verify"
              payload: {}
              as: ClaimReviewer
              as_user_id: "rev-1"
            - call: "POST /rebate-aggregator/claims/${cla}/start-review"
              payload: {}
              as: ClaimReviewer
              as_user_id: "rev-1"
            - call: "GET /rebate-aggregator/programs/${pid}"
              payload: {}
              as: ProgramManager
              captures: { va: $.data.version }
            - call: "POST /rebate-aggregator/claims/${cla}/approve"
              payload: { expected_program_version: "${va}" }
              as: ClaimReviewer
              as_user_id: "rev-1"
            - call: "POST /rebate-aggregator/claims"
              payload: { consumer_id: "${cb}", program_id: "${pid}", benefit_period_start: "2026-01-01T00:00:00Z", benefit_period_end: "2026-02-01T00:00:00Z", claimed_amount_cents: 30000 }
              as: Consumer
              as_user_id: "${cb}"
              captures: { clb: $.data.id }
            - call: "POST /rebate-aggregator/claims/${clb}/documents"
              payload: { doc_type: "RECEIPT", file_ref: "db" }
              as: Consumer
              as_user_id: "${cb}"
              captures: { db: $.data.id }
            - call: "POST /rebate-aggregator/claims/${clb}/submit"
              payload: {}
              as: Consumer
              as_user_id: "${cb}"
            - call: "POST /rebate-aggregator/documents/${db}/verify"
              payload: {}
              as: ClaimReviewer
              as_user_id: "rev-1"
            - call: "POST /rebate-aggregator/claims/${clb}/start-review"
              payload: {}
              as: ClaimReviewer
              as_user_id: "rev-1"
            - call: "GET /rebate-aggregator/programs/${pid}"
              payload: {}
              as: ProgramManager
              captures: { vb: $.data.version }
            - call: "POST /rebate-aggregator/claims/${clb}/approve"
              payload: { expected_program_version: "${vb}" }
              as: ClaimReviewer
              as_user_id: "rev-1"
            - call: "POST /rebate-aggregator/claims"
              payload: { consumer_id: "${cc}", program_id: "${pid}", benefit_period_start: "2026-01-01T00:00:00Z", benefit_period_end: "2026-02-01T00:00:00Z", claimed_amount_cents: 20001 }
              as: Consumer
              as_user_id: "${cc}"
              captures: { clc: $.data.id }
            - call: "POST /rebate-aggregator/claims/${clc}/documents"
              payload: { doc_type: "RECEIPT", file_ref: "dc" }
              as: Consumer
              as_user_id: "${cc}"
              captures: { dc: $.data.id }
            - call: "POST /rebate-aggregator/claims/${clc}/submit"
              payload: {}
              as: Consumer
              as_user_id: "${cc}"
            - call: "POST /rebate-aggregator/documents/${dc}/verify"
              payload: {}
              as: ClaimReviewer
              as_user_id: "rev-1"
            - call: "POST /rebate-aggregator/claims/${clc}/start-review"
              payload: {}
              as: ClaimReviewer
              as_user_id: "rev-1"
            - call: "GET /rebate-aggregator/programs/${pid}"
              payload: {}
