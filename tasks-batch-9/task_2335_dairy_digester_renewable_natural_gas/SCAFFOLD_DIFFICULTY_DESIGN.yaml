  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: nlsm_agreement_fourth_counter_rejected_after_three_negotiation_rounds
        grounds:
          - state_machines.FeedstockAgreement.DRAFT_to_PENDING_DAIRY_SIGNATURE
          - state_machines.FeedstockAgreement.PENDING_DAIRY_SIGNATURE_to_COUNTERED
          - state_machines.FeedstockAgreement.COUNTERED_to_DRAFT
          - entities.FeedstockAgreement.fields.negotiation_round
          - errors.ERR_NEGOTIATION_ROUNDS_EXHAUSTED
        distinguishing_aspect: |
          The cycle DRAFT -> PENDING_DAIRY_SIGNATURE -> COUNTERED -> DRAFT is traversed three
          full times and the fourth counter is refused: negotiation_round stops at 3 and
          never reaches 4, the row stays in PENDING_DAIRY_SIGNATURE rather than COUNTERED,
          and version stops at 11 - a memoryless machine that allowed unlimited counters
          would show negotiation_round 4, status COUNTERED and version 12.
        test_recipe:
          setup:
            - "One PROSPECT dairy and one facility."
            - "One DRAFT agreement that is offered, countered and revised three times, then offered a fourth time so it is again awaiting the dairy signature."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin"
            - call: "POST /dairies"
              payload: { name: "Vista Verde Dairy", county: "Tulare", herd_size: 3000, manure_management_baseline: "LAGOON", haul_distance_km: 12.0, annual_nitrogen_budget_kg: 18000.000 }
              as: PlatformAdmin
              as_user_id: "u-admin"
              captures: { dairy1_id: "$.data.id" }
            - call: "POST /facilities"
              payload: { name: "Tulare Digester 1", digester_volume_m3: 6000.000, hydraulic_capacity_tonnes_per_day: 500.000, thermal_regime: "MESOPHILIC", target_temperature_c: 38.0, reserve_target_cents: 4000000, annual_debt_service_cents: 18000000, dscr_minimum: 1.250 }
              as: PlatformAdmin
              as_user_id: "u-admin"
              captures: { facility_id: "$.data.id" }
            - call: "POST /feedstock-agreements"
              payload: { dairy_id: "${dairy1_id}", facility_id: "${facility_id}", committed_tonnes_per_day: 180.000, minimum_total_solids_pct: 8.0, term_start_date: "2026-01-01", term_end_date: "2026-12-31", revenue_share_pct: 0.2200, revenue_share_basis: "NET", curtailable: true }
              as: ProjectOperator
              as_user_id: "u-ops"
              captures: { agr1_id: "$.data.id" }
            - call: "POST /feedstock-agreements/${agr1_id}/offer"
              payload: { cover_note: "Round 1 offer" }
              as: ProjectOperator
              as_user_id: "u-ops"
            - call: "POST /feedstock-agreements/${agr1_id}/counter"
              payload: { countered_tonnes_per_day: 200.000, countered_revenue_share_pct: 0.2600, comment: "Need more volume" }
              as: DairyPartner
              as_user_id: "${dairy1_id}"
            - call: "POST /feedstock-agreements/${agr1_id}/revise"
              payload: { committed_tonnes_per_day: 185.000, minimum_total_solids_pct: 8.0, revenue_share_pct: 0.2300 }
              as: ProjectOperator
              as_user_id: "u-ops"
            - call: "POST /feedstock-agreements/${agr1_id}/offer"
              payload: { cover_note: "Round 2 offer" }
              as: ProjectOperator
              as_user_id: "u-ops"
            - call: "POST /feedstock-agreements/${agr1_id}/counter"
              payload: { countered_tonnes_per_day: 198.000, countered_revenue_share_pct: 0.2550, comment: "Still short" }
              as: DairyPartner
              as_user_id: "${dairy1_id}"
            - call: "POST /feedstock-agreements/${agr1_id}/revise"
              payload: { committed_tonnes_per_day: 190.000, minimum_total_solids_pct: 8.0, revenue_share_pct: 0.2350 }
              as: ProjectOperator
              as_user_id: "u-ops"
            - call: "POST /feedstock-agreements/${agr1_id}/offer"
              payload: { cover_note: "Round 3 offer" }
              as: ProjectOperator
              as_user_id: "u-ops"
            - call: "POST /feedstock-agreements/${agr1_id}/counter"
              payload: { countered_tonnes_per_day: 195.000, countered_revenue_share_pct: 0.2500, comment: "Final ask" }
              as: DairyPartner
              as_user_id: "${dairy1_id}"
            - call: "POST /feedstock-agreements/${agr1_id}/revise"
              payload: { committed_tonnes_per_day: 192.000, minimum_total_solids_pct: 8.0, revenue_share_pct: 0.2400 }
              as: ProjectOperator
              as_user_id: "u-ops"
            - call: "POST /feedstock-agreements/${agr1_id}/offer"
              payload: { cover_note: "Round 4 offer - best and final" }
              as: ProjectOperator
              as_user_id: "u-ops"
          trigger:
            - call: "POST /feedstock-agreements/${agr1_id}/counter"
              payload: { countered_tonnes_per_day: 194.000, countered_revenue_share_pct: 0.2450, comment: "One more try" }
              as: DairyPartner
              as_user_id: "${dairy1_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status == 422"
            - "error_id == ERR_NEGOTIATION_ROUNDS_EXHAUSTED"
            - "FeedstockAgreement.${agr1_id}.negotiation_round == 3"
            - "FeedstockAgreement.${agr1_id}.status == PENDING_DAIRY_SIGNATURE"
            - "FeedstockAgreement.${agr1_id}.countered_tonnes_per_day == null"
            - "FeedstockAgreement.${agr1_id}.countered_revenue_share_pct == null"
            - "FeedstockAgreement.${agr1_id}.committed_tonnes_per_day == 192.000"
            - "FeedstockAgreement.${agr1_id}.revenue_share_pct == 0.2400"
            - "FeedstockAgreement.${agr1_id}.version == 11"
            - "Dairy.${dairy1_id}.status == PROSPECT"

      - name: nlsm_ops_day_status_and_gas_state_dimensions_advance_independently
        grounds:
          - state_machines.OperationsDay.OPEN_to_CLOSED
          - state_machines.OperationsDay.CLOSED_to_OPEN
          - state_machines.OperationsDay.RAW_to_OFFSPEC
          - state_machines.OperationsDay.OFFSPEC_to_PIPELINE_SPEC
          - entities.OperationsDay.fields.gas_state
          - entities.OperationsDay.fields.conditioning_attempts
        distinguishing_aspect: |
          The status dimension stays CLOSED while the gas dimension walks RAW -> OFFSPEC ->
          PIPELINE_SPEC across two conditioning attempts, and the single cyclic reopen then
          rewinds ONLY the gas dimension to NOT_PRODUCED with conditioning_attempts reset to
          0 while reopen_count advances to 1: a single-dimension machine would either refuse
          the second conditioning call or lose the CLOSED bookkeeping state at OFFSPEC.
