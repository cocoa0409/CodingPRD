              payload: { cook_id: "${cook_id}", subject_type: "COOK", category: "TEMP_ABUSE", severity: "MODERATE", description: "cold holding above 5C at a market stall", occurred_at: "2026-07-30T12:00:00Z" }
              as: SafetyOfficer
              as_user_id: so-1
              captures: { inc_id: "$.data.id", inc_status: "$.data.status" }
          trigger:
            - call: POST /cooks/${cook_id}/standing-actions
              payload: { action: "SUSPEND", reason: "pending temperature-abuse review" }
              as: SafetyOfficer
