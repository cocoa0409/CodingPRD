            - { call: "POST /packinghouse/groves/${ci_gr}/maturity-tests", payload: { sampled_at: "2026-07-31T10:00:00Z", brix: 9.0, acid_pct: 1.0, juice_pct: 45.0, expected_grove_version: "${ci_gr_v}" }, as: QualityInspector, as_user_id: "qi_ci1" }
            - { call: "POST /packinghouse/pools", payload: { variety: VALENCIA, week_start: "2026-07-27" }, as: PoolAccountant, captures: { ci_p: "$.data.id" } }
            - { call: "POST /packinghouse/allocation-channels", payload: { channel_code: "DOM-CI1", channel_type: DOMESTIC_FRESH, destination_market: DOMESTIC, variety: VALENCIA, week_start: "2026-07-27", allocation_boxes: 10, price_cents_per_box: 600, priority_rank: 1, accepts_grades: ["FANCY"] }, as: PackinghouseAdmin, captures: { ci_dom: "$.data.id" } }
            - { call: "POST /packinghouse/allocation-channels", payload: { channel_code: "JU-CI1", channel_type: JUICE, destination_market: NONE, variety: VALENCIA, week_start: "2026-07-27", allocation_boxes: 0, price_cents_per_box: 220, priority_rank: 9, accepts_grades: ["FANCY", "CHOICE", "STANDARD", "JUICE"] }, as: PackinghouseAdmin }
            - { call: "POST /packinghouse/crews", payload: { crew_code: "CR-CI1", daily_capacity_boxes: 400 }, as: PackinghouseAdmin, captures: { ci_c: "$.data.id" } }
            - { call: "POST /packinghouse/harvest-assignments", payload: { crew_id: "${ci_c}", grove_id: "${ci_gr}", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-01T12:00:00Z", planned_boxes: 50 }, as: FieldSupervisor, captures: { ci_a: "$.data.id" } }
            - { call: "POST /packinghouse/harvest-assignments/${ci_a}/start", payload: {}, as: FieldSupervisor }
            - { call: "POST /packinghouse/deliveries", payload: { grove_id: "${ci_gr}", assignment_id: "${ci_a}", gross_boxes: 10, tare_boxes: 0 }, as: FieldSupervisor, captures: { ci_d: "$.data.id", ci_d_v: "$.data.version" } }
            - { call: "POST /packinghouse/sort-runs", payload: { delivery_id: "${ci_d}", fancy_boxes: 10, choice_boxes: 0, standard_boxes: 0, juice_boxes: 0, cull_boxes: 0, color_score: 8, defect_pct: 5, expected_delivery_version: "${ci_d_v}" }, as: LineOperator, as_user_id: "op_ci1", captures: { ci_sr: "$.data.id" } }
            - { call: "POST /packinghouse/sort-runs/${ci_sr}/verify", payload: {}, as: QualityInspector, as_user_id: "qi_ci1" }
          trigger:
            - { call: "POST /packinghouse/sort-runs/${ci_sr}/post", payload: {}, as: LineOperator, as_user_id: "op_ci1" }
            - { call: "POST /packinghouse/sort-runs/${ci_sr}/reverse", payload: {}, as: PoolAccountant }
          assert:
            - "After post: Pool.${ci_p} posted_ge_boxes == 11.5, posted_proceeds_cents == 6000, sorted_field_boxes == 10, provisional == 522; DOM-CI1 remaining_boxes == 0"
            - "After reverse (the compensating action): Pool.${ci_p} posted_ge_boxes == 0, posted_proceeds_cents == 0, sorted_field_boxes == 0, provisional == 600 — exactly the pre-post values"
            - "AllocationChannel.${ci_dom}.remaining_boxes == 10 restored; Delivery.${ci_d}.processing_status == READY_TO_SORT; SortRun.${ci_sr}.status == VOIDED"

      - name: advance_amount_conserved_under_recoup_and_writeoff
        grounds:
          - entities.AdvancePayment.fields.outstanding_cents
          - state_machines.AdvancePayment.PARTIALLY_RECOUPED_to_WRITTEN_OFF
          - calculations.settlement_waterfall
        distinguishing_aspect: |
          Conserved quantity = the ADVANCE's own money partition (a
          ledger-conservation invariant, different quantity from pool boxes):
          amount_cents == recouped_cents + written_off_cents + outstanding_cents
