      - name: certification_gates_report_the_window_error_then_the_status_error
        claim_type: Priority Ordering
        grounds:
          - validations[priority=12]
          - validations[priority=19]
          - errors.ERR_OBJECTION_WINDOW_OPEN
          - errors.ERR_PETITION_STATUS_INVALID
          - errors.ERR_PENDING_OBJECTIONS
        distinguishing_aspect: |
          Two refusals of the same certify call, in the order the ladder dictates. While the case is still
          TALLY_POSTED the only violated rule is priority 19, so ERR_OBJECTION_WINDOW_OPEN is returned. Once
          an objection is filed the case is OBJECTIONS_PENDING, and after the window closes the priority 12
