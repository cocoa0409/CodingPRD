scaffold_difficulty_design:
  # =====================================================================
  # Rule 1 - dual_variant_calc
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: fuel_sale_provisional_vs_final_totals
        grounds:
          - calculations.fuel_sale_finalization
          - calculations.retail_quote_cents_per_gallon
          - state_machines.FuelSale.PENDING_FINALIZE_to_COMPLETED
        distinguishing_aspect: |
          Same pinned price snapshots produce two different money results on a FuelSale:
          the provisional variant prices max_gallons (11000 cents) while the final variant
          prices dispensed_gallons (10450 cents); entity domain is FuelSale money.
        test_recipe:
          setup:
            - "Site with DIESEL retail price 385 cents/gal (effective 2026-08-01), one pump, register float 20000, OPEN shift (cashier cash-1, opened by sm-1)"
            - "Loyalty member with 9000 points, ACTIVE enrollment in FleetPass network (0.10 $/gal off DIESEL)"
            - "Logical clock at 2026-08-12T10:00:00Z"
            - "FuelSale authorized: RETAIL DIESEL, redeem 200 points, max_gallons 40.000"
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Site A", parking_total_spaces: 60, parking_paid_capacity: 2, shower_units_count: 1, laundry_machines_count: 1 }, as: GeneralManager, captures: { site_id: "$.data.id", site_v: "$.data.version" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T10:00:00Z" }, as: GeneralManager }
            - { call: "POST /sites/${site_id}/fuel-prices", payload: { fuel_type: "DIESEL", retail_cents_per_gallon: 385, effective_from: "2026-08-01T00:00:00Z", expected_site_version: "${site_v}" }, as: FuelDeskLead }
            - { call: "POST /sites/${site_id}/pumps", payload: { pump_number: 1, fuel_types: ["DIESEL", "GAS_REGULAR"] }, as: FuelDeskLead, captures: { pump_id: "$.data.id" } }
            - { call: "POST /sites/${site_id}/registers", payload: { register_code: "R1", float_cents: 20000 }, as: GeneralManager, captures: { reg_id: "$.data.id" } }
            - { call: "POST /sites/${site_id}/shifts", payload: { register_id: "${reg_id}", cashier_user_id: "cash-1", shift_label: "DAY" }, as: ShiftManager, as_user_id: "sm-1", captures: { shift_id: "$.data.id" } }
            - { call: "POST /loyalty-members", payload: { full_name: "Driver A", email: "a@x.com" }, as: Cashier, as_user_id: "cash-1", captures: { m_id: "$.data.id" } }
            - { call: "POST /loyalty-members/${m_id}/adjustments", payload: { points_delta: 9000, reason: "seed" }, as: GeneralManager }
            - { call: "POST /discount-networks", payload: { name: "FleetPass", discount_per_gallon: 0.10, applicable_fuel_types: ["DIESEL"], program_cap: 2 }, as: GeneralManager, captures: { net_id: "$.data.id" } }
            - { call: "POST /discount-networks/${net_id}/activate", payload: {}, as: GeneralManager }
            - { call: "POST /loyalty-members/${m_id}/discount-enrollments", payload: { network_program_id: "${net_id}" }, as: Cashier, as_user_id: "cash-1", captures: { en_id: "$.data.id" } }
            - { call: "POST /discount-enrollments/${en_id}/activate", payload: {}, as: Cashier, as_user_id: "cash-1" }
            - { call: "POST /sites/${site_id}/fuel-sales", payload: { pump_id: "${pump_id}", shift_id: "${shift_id}", pricing_mode: "RETAIL", fuel_type: "DIESEL", tender_type: "CASH", loyalty_member_id: "${m_id}", requested_redeem_points: 200, max_gallons: 40.0 }, as: Cashier, as_user_id: "cash-1", captures: { sale_id: "$.data.id" } }
          trigger:
            - { call: "POST /fuel-sales/${sale_id}/dispensing-start", payload: {}, as: Cashier, as_user_id: "cash-1" }
            - { call: "POST /fuel-sales/${sale_id}/dispensing-complete", payload: { dispensed_gallons: 38.0 }, as: Cashier, as_user_id: "cash-1" }
            - { call: "POST /fuel-sales/${sale_id}/finalize", payload: {}, as: Cashier, as_user_id: "cash-1" }
            - { call: "GET /loyalty-members/${m_id}", payload: {}, as: Cashier, as_user_id: "cash-1" }
          assert:
            - "FuelSale.authorized_quote_cents_per_gallon == 275 (385 - 10 network - min(200,500) x 0.5 points)"
            - "FuelSale.provisional_fuel_total_cents == 11000 (275 x 40.000 authorized gallons)"
            - "FuelSale.total_cents == 10450 (275 x 38.000 dispensed gallons)"
            - "FuelSale.points_earned == 52 (round_half_up(104.50 x 0.5))"
            - "FuelSale.points_redeemed == 200"
            - "LoyaltyMember.points_balance == 8852 (9000 - 200 + 52)"
            - "provisional_fuel_total_cents (11000) != total_cents (10450) on identical pinned snapshots"

      - name: contract_tier_provisional_vs_confirmed
        grounds:
          - calculations.contract_quote_cents_per_gallon
          - calculations.fleet_tier_recompute
          - entities.FleetAccount.fields.pricing_tier
        distinguishing_aspect: |
          Same rack (2.7000) and freight (0.1500) inputs price differently under the two tier
          variants: a contract frozen at T1 quotes 283 cents/gal while a contract at the fleet's
          confirmed (recomputed) T2 tier quotes 280; entity domain is FleetAccount pricing tier,
          distinct from the FuelSale money domain of fuel_sale_provisional_vs_final_totals.
        test_recipe:
          setup:
            - "Site with DIESEL bulk tank (rack 2.7000 $/gal), pump, register, OPEN shift; clock 2026-08-12T10:00:00Z"
            - "Fleet (credit_limit 50000000, tier T1) with ACTIVE contract C-1 at pricing_tier T1, discount 0.00, window 2026-08-01..2027-08-01"
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Site B", parking_total_spaces: 60, parking_paid_capacity: 2, shower_units_count: 1, laundry_machines_count: 1 }, as: GeneralManager, captures: { site_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T10:00:00Z" }, as: GeneralManager }
            - { call: "POST /sites/${site_id}/bulk-tanks", payload: { product_type: "DIESEL", capacity_gallons: 20000, reorder_threshold_gallons: 3000, safety_stock_gallons: 1500, daily_usage_gallons: 950, lead_time_days: 4, initial_gallons: 8500, rack_price_cents_per_gallon_4dp: 2.7000 }, as: GeneralManager, captures: { tank_id: "$.data.id" } }
            - { call: "POST /sites/${site_id}/pumps", payload: { pump_number: 1, fuel_types: ["DIESEL"] }, as: FuelDeskLead, captures: { pump_id: "$.data.id" } }
            - { call: "POST /sites/${site_id}/registers", payload: { register_code: "R1", float_cents: 20000 }, as: GeneralManager, captures: { reg_id: "$.data.id" } }
            - { call: "POST /sites/${site_id}/shifts", payload: { register_id: "${reg_id}", cashier_user_id: "cash-1", shift_label: "DAY" }, as: ShiftManager, as_user_id: "sm-1", captures: { shift_id: "$.data.id" } }
            - { call: "POST /fleet-accounts", payload: { name: "Fleet A", credit_limit_cents: 50000000, pricing_tier: "T1" }, as: GeneralManager, captures: { f_id: "$.data.id" } }
            - { call: "POST /fleet-accounts/${f_id}/contracts", payload: { contract_code: "C-1", pricing_tier: "T1", discount_per_gallon_off: 0.0, applicable_fuel_types: ["DIESEL"], effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-08-01T00:00:00Z" }, as: GeneralManager, captures: { c1_id: "$.data.id" } }
            - { call: "POST /contracts/${c1_id}/activate", payload: {}, as: GeneralManager }
          trigger:
            - { call: "POST /sites/${site_id}/fuel-sales", payload: { pump_id: "${pump_id}", shift_id: "${shift_id}", pricing_mode: "CONTRACT", fuel_type: "DIESEL", tender_type: "FLEET_BILLING", fleet_account_id: "${f_id}", contract_id: "${c1_id}", max_gallons: 4900.0 }, as: Cashier, as_user_id: "cash-1", captures: { s1_id: "$.data.id" } }
            - { call: "POST /fuel-sales/${s1_id}/dispensing-start", payload: {}, as: Cashier, as_user_id: "cash-1" }
            - { call: "POST /fuel-sales/${s1_id}/dispensing-complete", payload: { dispensed_gallons: 4900.0 }, as: Cashier, as_user_id: "cash-1" }
            - { call: "POST /fuel-sales/${s1_id}/finalize", payload: {}, as: Cashier, as_user_id: "cash-1" }
            - { call: "POST /sites/${site_id}/fuel-sales", payload: { pump_id: "${pump_id}", shift_id: "${shift_id}", pricing_mode: "CONTRACT", fuel_type: "DIESEL", tender_type: "FLEET_BILLING", fleet_account_id: "${f_id}", contract_id: "${c1_id}", max_gallons: 200.0 }, as: Cashier, as_user_id: "cash-1", captures: { s2_id: "$.data.id" } }
            - { call: "POST /fuel-sales/${s2_id}/dispensing-start", payload: {}, as: Cashier, as_user_id: "cash-1" }
            - { call: "POST /fuel-sales/${s2_id}/dispensing-complete", payload: { dispensed_gallons: 200.0 }, as: Cashier, as_user_id: "cash-1" }
            - { call: "POST /fuel-sales/${s2_id}/finalize", payload: {}, as: Cashier, as_user_id: "cash-1" }
            - { call: "POST /fleet-accounts/${f_id}/tier-recompute", payload: {}, as: GeneralManager, captures: { f_tier: "$.data.pricing_tier", f_rolling: "$.data.rolling_30d_gallons" } }
            - { call: "POST /fleet-accounts/${f_id}/contracts", payload: { contract_code: "C-2", pricing_tier: "T2", discount_per_gallon_off: 0.0, applicable_fuel_types: ["DIESEL"], effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-08-01T00:00:00Z" }, as: GeneralManager, captures: { c2_id: "$.data.id" } }
            - { call: "POST /contracts/${c2_id}/activate", payload: {}, as: GeneralManager }
            - { call: "POST /sites/${site_id}/fuel-sales", payload: { pump_id: "${pump_id}", shift_id: "${shift_id}", pricing_mode: "CONTRACT", fuel_type: "DIESEL", tender_type: "FLEET_BILLING", fleet_account_id: "${f_id}", contract_id: "${c1_id}", max_gallons: 100.0 }, as: Cashier, as_user_id: "cash-1", captures: { s3_id: "$.data.id", s3_quote: "$.data.authorized_quote_cents_per_gallon" } }
            - { call: "POST /fuel-sales/${s3_id}/void", payload: { reason: "quote probe complete" }, as: ShiftManager, as_user_id: "sm-2" }
            - { call: "POST /sites/${site_id}/fuel-sales", payload: { pump_id: "${pump_id}", shift_id: "${shift_id}", pricing_mode: "CONTRACT", fuel_type: "DIESEL", tender_type: "FLEET_BILLING", fleet_account_id: "${f_id}", contract_id: "${c2_id}", max_gallons: 100.0 }, as: Cashier, as_user_id: "cash-1", captures: { s4_quote: "$.data.authorized_quote_cents_per_gallon" } }
          assert:
            - "Sale1 and sale2 quote 283 cents/gal (contract C-1 frozen at provisional tier T1: 2.7000 + 0.1500 - 0.02 = 2.8300)"
            - "FleetAccount.rolling_30d_gallons == 5100.0 after the two finalizations"
            - "FleetAccount.pricing_tier == T2 after crossing the 5000-gallon inclusive breakpoint"
            - "Sale3 on contract C-1 still quotes 283 (contract tier snapshot unchanged by fleet tier drift)"
            - "Sale4 on contract C-2 quotes 280 (confirmed fleet tier T2: 2.7000 + 0.1500 - 0.05 = 2.8000)"
            - "283 != 280 on identical rack and freight inputs"

  # =====================================================================
  # Rule 2 - combinatorial_formula (three different modes: a, b, c)
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: retail_quote_stacking_min_and_floor
        grounds:
          - calculations.retail_quote_cents_per_gallon
          - entities.LoyaltyMember.fields.stack_cap_points
        distinguishing_aspect: |
          Mode (a): the retail quote combines >=3 inputs (retail price, network discount, points
          redemption) with non-linear interaction: min(requested, stack_cap) caps the points leg
          and max(0, ...) floors the unit price at zero; the two clamps are exercised separately
          (325 via the cap, 0 via the floor) and differ from the uncapped result 275.
        test_recipe:
          setup:
            - "Site with DIESEL price 385 and GAS_REGULAR price 50, three pumps, register, OPEN shift; clock 2026-08-12T10:00:00Z"
            - "Member A (default cap 500, 9000 pts) and member B (stack_cap_points 100, 9000 pts), both actively enrolled in FleetPass (0.10 off DIESEL and GAS_REGULAR)"
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Site C", parking_total_spaces: 60, parking_paid_capacity: 2, shower_units_count: 1, laundry_machines_count: 1 }, as: GeneralManager, captures: { site_id: "$.data.id", site_v: "$.data.version" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T10:00:00Z" }, as: GeneralManager }
            - { call: "POST /sites/${site_id}/fuel-prices", payload: { fuel_type: "DIESEL", retail_cents_per_gallon: 385, effective_from: "2026-08-01T00:00:00Z", expected_site_version: "${site_v}" }, as: FuelDeskLead }
            - { call: "GET /sites/${site_id}", payload: {}, as: GeneralManager, captures: { site_v2: "$.data.version" } }
            - { call: "POST /sites/${site_id}/fuel-prices", payload: { fuel_type: "GAS_REGULAR", retail_cents_per_gallon: 50, effective_from: "2026-08-01T00:00:00Z", expected_site_version: "${site_v2}" }, as: FuelDeskLead }
            - { call: "POST /sites/${site_id}/pumps", payload: { pump_number: 1, fuel_types: ["DIESEL"] }, as: FuelDeskLead, captures: { pump1: "$.data.id" } }
            - { call: "POST /sites/${site_id}/pumps", payload: { pump_number: 2, fuel_types: ["DIESEL"] }, as: FuelDeskLead, captures: { pump2: "$.data.id" } }
            - { call: "POST /sites/${site_id}/pumps", payload: { pump_number: 3, fuel_types: ["GAS_REGULAR"] }, as: FuelDeskLead, captures: { pump3: "$.data.id" } }
            - { call: "POST /sites/${site_id}/registers", payload: { register_code: "R1", float_cents: 20000 }, as: GeneralManager, captures: { reg_id: "$.data.id" } }
            - { call: "POST /sites/${site_id}/shifts", payload: { register_id: "${reg_id}", cashier_user_id: "cash-1", shift_label: "DAY" }, as: ShiftManager, as_user_id: "sm-1", captures: { shift_id: "$.data.id" } }
            - { call: "POST /loyalty-members", payload: { full_name: "Driver A", email: "a@x.com" }, as: Cashier, as_user_id: "cash-1", captures: { ma: "$.data.id" } }
            - { call: "POST /loyalty-members/${ma}/adjustments", payload: { points_delta: 9000, reason: "seed" }, as: GeneralManager }
            - { call: "POST /loyalty-members", payload: { full_name: "Driver B", email: "b@x.com", stack_cap_points: 100 }, as: Cashier, as_user_id: "cash-1", captures: { mb: "$.data.id" } }
            - { call: "POST /loyalty-members/${mb}/adjustments", payload: { points_delta: 9000, reason: "seed" }, as: GeneralManager }
            - { call: "POST /discount-networks", payload: { name: "FleetPass", discount_per_gallon: 0.10, applicable_fuel_types: ["DIESEL", "GAS_REGULAR"], program_cap: 2 }, as: GeneralManager, captures: { net_id: "$.data.id" } }
            - { call: "POST /discount-networks/${net_id}/activate", payload: {}, as: GeneralManager }
            - { call: "POST /loyalty-members/${ma}/discount-enrollments", payload: { network_program_id: "${net_id}" }, as: Cashier, as_user_id: "cash-1", captures: { ena: "$.data.id" } }
            - { call: "POST /discount-enrollments/${ena}/activate", payload: {}, as: Cashier, as_user_id: "cash-1" }
            - { call: "POST /loyalty-members/${mb}/discount-enrollments", payload: { network_program_id: "${net_id}" }, as: Cashier, as_user_id: "cash-1", captures: { enb: "$.data.id" } }
            - { call: "POST /discount-enrollments/${enb}/activate", payload: {}, as: Cashier, as_user_id: "cash-1" }
          trigger:
            - { call: "POST /sites/${site_id}/fuel-sales", payload: { pump_id: "${pump1}", shift_id: "${shift_id}", pricing_mode: "RETAIL", fuel_type: "DIESEL", tender_type: "CASH", loyalty_member_id: "${ma}", requested_redeem_points: 200, max_gallons: 10.0 }, as: Cashier, as_user_id: "cash-1", captures: { quote_a: "$.data.authorized_quote_cents_per_gallon" } }
            - { call: "POST /sites/${site_id}/fuel-sales", payload: { pump_id: "${pump2}", shift_id: "${shift_id}", pricing_mode: "RETAIL", fuel_type: "DIESEL", tender_type: "CASH", loyalty_member_id: "${mb}", requested_redeem_points: 120, max_gallons: 10.0 }, as: Cashier, as_user_id: "cash-1", captures: { quote_b: "$.data.authorized_quote_cents_per_gallon" } }
            - { call: "POST /sites/${site_id}/fuel-sales", payload: { pump_id: "${pump3}", shift_id: "${shift_id}", pricing_mode: "RETAIL", fuel_type: "GAS_REGULAR", tender_type: "CASH", loyalty_member_id: "${ma}", requested_redeem_points: 100, max_gallons: 10.0 }, as: Cashier, as_user_id: "cash-1", captures: { sale_c: "$.data.id", quote_c: "$.data.authorized_quote_cents_per_gallon" } }
            - { call: "POST /fuel-sales/${sale_c}/dispensing-start", payload: {}, as: Cashier, as_user_id: "cash-1" }
            - { call: "POST /fuel-sales/${sale_c}/dispensing-complete", payload: { dispensed_gallons: 10.0 }, as: Cashier, as_user_id: "cash-1" }
            - { call: "POST /fuel-sales/${sale_c}/finalize", payload: {}, as: Cashier, as_user_id: "cash-1", captures: { total_c: "$.data.total_cents", redeemed_c: "$.data.points_redeemed" } }
            - { call: "GET /loyalty-members/${ma}", payload: {}, as: Cashier, as_user_id: "cash-1", captures: { bal_a: "$.data.points_balance" } }
          assert:
            - "quote_a == 275 (385 - 10 - min(200, 500) x 0.5 cents)"
            - "quote_b == 325 (stack cap clamps min(120, 100) = 100 points -> 50 cents)"
            - "quote_c == 0 (max(0, 50 - 10 - 50) floor binds)"
            - "sale C finalizes with total_cents == 0 and points_redeemed == 100 (burn proceeds even though the floor made the points worthless)"
            - "member A points_balance == 8900 (9000 - 100 + 0 earned)"

      - name: loyalty_accrual_per_line_rounding
        grounds:
          - calculations.loyalty_points_accrual
          - entities.FuelSale.fields.points_earned
          - entities.StoreSale.fields.points_earned
        distinguishing_aspect: |
          Mode (b): rounding order is pinned per source line - fuel $142.50 earns round(71.25)=71
          and store $11.49 earns round(11.49)=11, total 82; rounding the combined fractional
          points (82.74) once would give 83. The scaffold pins per-line rounding.
        test_recipe:
          setup:
            - "Site with DIESEL price 385, pump, register, OPEN shift; clock 2026-08-12T10:00:00Z"
            - "Member M with 0 points, ACTIVE FleetPass enrollment (0.10 off DIESEL)"
            - "Stock items SNACK-A (999 cents, 50 on hand) and DRINK-B (150 cents, 50 on hand)"
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Site D", parking_total_spaces: 60, parking_paid_capacity: 2, shower_units_count: 1, laundry_machines_count: 1 }, as: GeneralManager, captures: { site_id: "$.data.id", site_v: "$.data.version" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T10:00:00Z" }, as: GeneralManager }
            - { call: "POST /sites/${site_id}/fuel-prices", payload: { fuel_type: "DIESEL", retail_cents_per_gallon: 385, effective_from: "2026-08-01T00:00:00Z", expected_site_version: "${site_v}" }, as: FuelDeskLead }
            - { call: "POST /sites/${site_id}/pumps", payload: { pump_number: 1, fuel_types: ["DIESEL"] }, as: FuelDeskLead, captures: { pump_id: "$.data.id" } }
            - { call: "POST /sites/${site_id}/registers", payload: { register_code: "R1", float_cents: 20000 }, as: GeneralManager, captures: { reg_id: "$.data.id" } }
            - { call: "POST /sites/${site_id}/shifts", payload: { register_id: "${reg_id}", cashier_user_id: "cash-1", shift_label: "DAY" }, as: ShiftManager, as_user_id: "sm-1", captures: { shift_id: "$.data.id" } }
            - { call: "POST /loyalty-members", payload: { full_name: "Driver M", email: "m@x.com" }, as: Cashier, as_user_id: "cash-1", captures: { m_id: "$.data.id" } }
            - { call: "POST /discount-networks", payload: { name: "FleetPass", discount_per_gallon: 0.10, applicable_fuel_types: ["DIESEL"], program_cap: 2 }, as: GeneralManager, captures: { net_id: "$.data.id" } }
            - { call: "POST /discount-networks/${net_id}/activate", payload: {}, as: GeneralManager }
            - { call: "POST /loyalty-members/${m_id}/discount-enrollments", payload: { network_program_id: "${net_id}" }, as: Cashier, as_user_id: "cash-1", captures: { en_id: "$.data.id" } }
            - { call: "POST /discount-enrollments/${en_id}/activate", payload: {}, as: Cashier, as_user_id: "cash-1" }
            - { call: "POST /sites/${site_id}/stock-items", payload: { sku: "SNACK-A", name: "Snack A", category: "RETAIL", unit: "ea", unit_price_cents: 999, reorder_point: 5, initial_on_hand_quantity: 50 }, as: GeneralManager, captures: { item_a: "$.data.id" } }
            - { call: "POST /sites/${site_id}/stock-items", payload: { sku: "DRINK-B", name: "Drink B", category: "RETAIL", unit: "ea", unit_price_cents: 150, reorder_point: 5, initial_on_hand_quantity: 50 }, as: GeneralManager, captures: { item_b: "$.data.id" } }
          trigger:
            - { call: "POST /sites/${site_id}/fuel-sales", payload: { pump_id: "${pump_id}", shift_id: "${shift_id}", pricing_mode: "RETAIL", fuel_type: "DIESEL", tender_type: "CASH", loyalty_member_id: "${m_id}", requested_redeem_points: 0, max_gallons: 40.0 }, as: Cashier, as_user_id: "cash-1", captures: { sale_id: "$.data.id" } }
            - { call: "POST /fuel-sales/${sale_id}/dispensing-start", payload: {}, as: Cashier, as_user_id: "cash-1" }
            - { call: "POST /fuel-sales/${sale_id}/dispensing-complete", payload: { dispensed_gallons: 38.0 }, as: Cashier, as_user_id: "cash-1" }
            - { call: "POST /fuel-sales/${sale_id}/finalize", payload: {}, as: Cashier, as_user_id: "cash-1", captures: { fuel_total: "$.data.total_cents", fuel_earned: "$.data.points_earned" } }
            - { call: "POST /sites/${site_id}/store-sales", payload: { shift_id: "${shift_id}", tender_type: "CASH", loyalty_member_id: "${m_id}", lines: [ { stock_item_id: "${item_a}", quantity: 1 }, { stock_item_id: "${item_b}", quantity: 1 } ] }, as: Cashier, as_user_id: "cash-1", captures: { store_total: "$.data.total_cents", store_earned: "$.data.points_earned" } }
            - { call: "GET /loyalty-members/${m_id}", payload: {}, as: Cashier, as_user_id: "cash-1", captures: { bal: "$.data.points_balance" } }
          assert:
            - "FuelSale.total_cents == 14250 ((385 - 10) x 38.000) and points_earned == 71 (round_half_up(71.25))"
            - "StoreSale.total_cents == 1149 and points_earned == 11 (round_half_up(11.49))"
            - "LoyaltyMember.points_balance == 82 (71 + 11), not 83 which sum-then-round of 82.74 would produce"
            - "StockItem SNACK-A on_hand_quantity == 49 and DRINK-B on_hand_quantity == 49"

      - name: shift_expected_then_deposit_order
        grounds:
          - calculations.shift_expected_cash
          - entities.ShiftReconciliation.fields.deposit_total_cents
        distinguishing_aspect: |
