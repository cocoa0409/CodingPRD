            - call: "POST /equipment-units/${e1}/install-status"
              payload: { install_status: "INSTALLED" }
              as: Contractor
              as_user_id: "u-contractor-1"
            - call: "POST /prefunctional-checklists"
              payload: { equipment_id: "${e1}", template_code: "PFC-BLR-STD" }
              as: CxAuthority
              as_user_id: "u-cxa-1"
              captures: { cl1: $.data.id }
            - call: "POST /prefunctional-checklists/${cl1}/items"
              payload: { item_code: "PFC-01", description: "Gas train leak tested", is_safety_critical: true }
              as: CxAuthority
              as_user_id: "u-cxa-1"
            - call: "POST /prefunctional-checklists/${cl1}/record-item"
              payload: { item_code: "PFC-01", result: "PASS" }
              as: Contractor
              as_user_id: "u-contractor-1"
            - call: "POST /prefunctional-checklists/${cl1}/execute"
              payload: {}
              as: Contractor
              as_user_id: "u-contractor-1"
            - call: "POST /prefunctional-checklists/${cl1}/verify"
              payload: {}
              as: CxAuthority
              as_user_id: "u-cxa-1"
            - call: "GET /equipment-units/${e1}"
