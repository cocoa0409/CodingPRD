                as: ProtocolCoordinator
                captures: { ms_past_id: $.data.id }
              - call: "POST /programs/enrollments/${enr_id}/milestones"
                payload: { milestone_sequence: 2, description: "Future", requires_main_campus: true, target_at: "2026-10-01T00:00:00Z" }
                as: ProtocolCoordinator
