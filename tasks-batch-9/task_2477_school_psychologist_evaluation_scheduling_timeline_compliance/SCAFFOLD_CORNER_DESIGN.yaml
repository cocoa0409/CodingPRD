              as: IntakeCoordinator
              captures: { ry: $.data.id }
            - call: "POST /psych-services/referrals/${ry}/consent-events"
              payload: { event_type: "CONSENT_RECEIVED", effective_at: "2026-05-31T09:00:00Z", parent_signature_reference: "SIG-26" }
              as: IntakeCoordinator
              captures: { evaly: $.data.active_evaluation_id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /psych-services/referrals"
              payload: { school_id: "${s1}", student_local_id: "STU-27", referral_type: "INITIAL", requested_domains: ["COGNITIVE"] }
              as: IntakeCoordinator
              captures: { rx: $.data.id }
            - call: "POST /psych-services/referrals/${rx}/consent-events"
              payload: { event_type: "CONSENT_RECEIVED", effective_at: "2026-06-01T09:00:00Z", parent_signature_reference: "SIG-27" }
              as: IntakeCoordinator
              captures: { evalx: $.data.active_evaluation_id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T00:00:00Z" }
              as: DistrictAdmin
          trigger:
            - call: "POST /psych-services/compliance-runs"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "HTTP 200 with evaluated_count == 2, at_risk_evaluation_ids == [] and breached_evaluation_ids containing both ${evalx} and ${evaly}"
            - "Evaluation.${evalx}: elapsed_statutory_days == 65, days_remaining == -5, compliance_status == BREACHED"
            - "Evaluation.${evaly}: elapsed_statutory_days == 66, days_remaining == -6, compliance_status == BREACHED"
            - "The TimelineBreach of ${evalx} (GET /psych-services/evaluations/${evalx}/timeline-breaches) has breach_days == 5, severity == MINOR, minutes_breach_day_basis == 150, minutes_missed_service_basis == 150 (the bands agree only in the MINOR band's first week)"
            - "The TimelineBreach of ${evaly} has breach_days == 6, severity == MODERATE, minutes_breach_day_basis == 225 (6 * 30 * 1.25) and minutes_missed_service_basis == 190 (round5 of 1 * 150 * 1.25 == 187.5 goes UP)"
            - "Both breaches have status == DETECTED with detected_at == \"2026-08-05T00:00:00Z\", remedy_basis == null, additional_minutes == 0, remedy_minutes_awarded == 0 and corrective_action_note == null"

      - name: pressure_index_variant_selection_stub
        claim_type: variant_selection
        grounds:
          - calculations.caseload_pressure_index.variants
          - calculations.psychologist_assignment_rank_score
        excluded_because:
          difficulty_instance: dual_variant_calc / pressure_index_variant_divergence_drives_selector
          rationale: "Which pressure variant the selector consumes — and the divergence between the two — is the entire subject of that §1.8 instance."

      - name: exclusion_interval_credit_stub
        claim_type: interval_merge
        grounds:
          - calculations.exclusion_day_credit
        excluded_because:
          difficulty_instance: boundary_precision_check / exclusion_overlap_days_one_day_window_edge
          rationale: "The one-day overlap edge, the disjoint (zero-credit) case and the per-type cap are asserted by that §1.8 instance."

      - name: timeline_clock_propagation_stub
        claim_type: constraint_propagation
        grounds:
          - calculations.evaluation_timeline_clock
        excluded_because:
          difficulty_instance: combinatorial_formula / timeline_clock_base_window_evaluation_order_pin
          rationale: "The pinned step order — base window first, credit second, extended due date last — and its fixed point are exactly what that §1.8 instance pins."

      - name: conservation_aggregation_stub
        claim_type: aggregation
        grounds:
          - calculations.license_seat_conservation
          - calculations.caseload_points_conservation
        excluded_because:
          difficulty_instance: compensating_invariant / license_seat_release_restores_seat_conservation
          rationale: "Both conservation aggregates are asserted before and after their compensating actions by the two §1.8 compensating_invariant instances."

  - section: validations
