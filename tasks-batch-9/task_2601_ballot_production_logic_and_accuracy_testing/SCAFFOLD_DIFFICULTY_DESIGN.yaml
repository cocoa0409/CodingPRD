      - name: ci_open_seal_count_conservation_across_deploy_break_seal_and_retention
        grounds:
          - state_machines.TabulatorUnit.custody_status
          - entities.Election.fields.open_seal_count
          - endpoints["POST /tabulator-units/{id}/break-seal"]
          - endpoints["POST /tabulator-units/{id}/seal-retention"]
        distinguishing_aspect: |
          election.open_seal_count is a conserved quantity over the custody ledger: it must equal
          (count of SEAL_APPLIED events) + (count of RETENTION_SEAL events) - (count of SEAL_BROKEN
          events) at every instant. break-seal is the exact compensation of deploy, so the count
          returns to its pre-deploy value and the precinct falls back to NOT_READY; close-polls moves
          both units DEPLOYED -> RETURNED while RETAINING their seals, so it must NOT change the
          count; and seal-retention increments it again after reconciliation. The recipe walks
          1 -> 2 -> 1 -> 2 -> 2 -> 3 -> 4 so an implementation that decrements on close-polls, or that
          double-counts the re-deploy, is caught.
        test_recipe:
          setup:
            - "An election in STYLES_LOCKED with locked style S-100 assigned to BOTH precincts P-001 and P-002 (each 100 registered voters, required_ballot_quantity 110)."
