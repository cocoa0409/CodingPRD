  - section: consistency_model
    instances:

      - name: every_cross_entity_side_effect_is_readable_in_the_very_next_request
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - state_machines.RiskManagementService.PENDING -> ACTIVE
          - calculations.risk_credit_pct
          - calculations.exposure_score
          - calculations.indicated_premium
          - endpoints.POST /epli/claims/{claim_id}/defense-assignments
        distinguishing_aspect: "Nothing in this system lags: the write that flips a RiskManagementService to ACTIVE leaves Applicant.risk_credit_pct and exposure_score already restated for the next read, the price response itself carries the premium that credit produced (1690374 rather than the 1803600 of the same applicant with no services), and the assignment response's sibling DefensePanelFirm already reads open_matter_count 1 — while the PENDING service before it is proof that immediate visibility is not the same as counting rows that do not qualify."
