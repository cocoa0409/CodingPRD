  - rule_id: cross_entity_state_dependency
    instances:
      - name: open_case_requires_application_eligible_state
        grounds:
          - state_machines.IntakeApplication.ELIGIBLE_to_OPENED
          - validations[priority=7]
          - errors[ERR_INVALID_APPLICATION_STATE]
        distinguishing_aspect: |
          Entity pair = Case -> IntakeApplication: the Case-creation transition exists only when the linked
          application's status is exactly ELIGIBLE (SCREENED-but-undecided is rejected). The sibling instance
          crosses a different pair (Referral -> ReferralPanelMember).
        test_recipe:
          setup:
            - "Application SCREENED (computed ELIGIBLE) but decide-eligibility NOT yet called; conflict CLEAR"
          setup_api_calls:
            - { call: "POST /venue-rules", payload: { county: "CountyA", case_type: "EVICTION_DEFENSE", venue: "HOUSING_COURT", priority_base_weight: 50, extended_eligible: true }, as: ProgramDirector }
            - { call: "POST /staff-members", payload: { full_name: "Intake One", staff_type: "INTAKE_SPECIALIST", admitted_counties: ["CountyA"], practice_areas: ["EVICTION_DEFENSE"] }, as: ProgramDirector, captures: { intake_id: "$.data.id" } }
            - { call: "POST /staff-members", payload: { full_name: "Sup One", staff_type: "ATTORNEY", admitted_counties: ["CountyA"], practice_areas: ["EVICTION_DEFENSE"], max_units: 40 }, as: ProgramDirector, captures: { sup_id: "$.data.id" } }
            - { call: "POST /clients", payload: { full_name: "Cli Dep", residence_county: "CountyA", household_size: 1, annual_gross_income_cents: 1000000, annual_countable_income_cents: 900000, receives_means_tested_benefits: false }, as: IntakeSpecialist, as_user_id: "${intake_id}", captures: { client_id: "$.data.id" } }
            - { call: "POST /intake-applications", payload: { client_id: "${client_id}", case_type: "EVICTION_DEFENSE", opposing_party_name: "Landlord LLC", incident_county: "CountyA" }, as: IntakeSpecialist, as_user_id: "${intake_id}", captures: { app_id: "$.data.id" } }
            - { call: "POST /intake-applications/${app_id}/screen", payload: {}, as: IntakeSpecialist, as_user_id: "${intake_id}" }
            - { call: "POST /intake-applications/${app_id}/conflict-checks", payload: { result: "CLEAR" }, as: IntakeSpecialist, as_user_id: "${intake_id}" }
          trigger:
            - { call: "POST /intake-applications/${app_id}/open-case", payload: { service_level: "ADVICE_ONLY" }, as: SupervisingAttorney, as_user_id: "${sup_id}", captures: { err: "$.data.error_id" } }
            - { call: "POST /intake-applications/${app_id}/decide-eligibility", payload: { determination: "ELIGIBLE" }, as: IntakeSpecialist, as_user_id: "${intake_id}" }
            - { call: "POST /intake-applications/${app_id}/open-case", payload: { service_level: "ADVICE_ONLY" }, as: SupervisingAttorney, as_user_id: "${sup_id}", captures: { case_id: "$.data.id" } }
          assert:
            - "SCREENED (not yet ELIGIBLE): error_id == ERR_INVALID_APPLICATION_STATE — the computed determination alone does not unlock case opening"
            - "After decide-eligibility ELIGIBLE: open-case succeeds, Case created with application_id == ${app_id}"

      - name: referral_accept_requires_active_panel_member
        grounds:
          - state_machines.Referral.OFFERED_to_ACCEPTED
          - validations[priority=7]
          - errors[ERR_PANEL_MEMBER_NOT_ACTIVE]
        distinguishing_aspect: |
          Entity pair = Referral -> ReferralPanelMember: an OFFERED referral cannot be accepted while the linked
          panel member is SUSPENDED, even though the referral's own state is valid. Different pair from the
          sibling (Case -> IntakeApplication).
        test_recipe:
          setup:
            - "ADVICE_ONLY case PENDING_ASSIGNMENT; panel member (covers EVICTION_DEFENSE/CountyA, max 2) was ACTIVE at offer time; referral OFFERED exists"
          setup_api_calls:
            - { call: "POST /venue-rules", payload: { county: "CountyA", case_type: "EVICTION_DEFENSE", venue: "HOUSING_COURT", priority_base_weight: 50, extended_eligible: true }, as: ProgramDirector }
            - { call: "POST /staff-members", payload: { full_name: "Intake One", staff_type: "INTAKE_SPECIALIST", admitted_counties: ["CountyA"], practice_areas: ["EVICTION_DEFENSE"] }, as: ProgramDirector, captures: { intake_id: "$.data.id" } }
            - { call: "POST /staff-members", payload: { full_name: "Sup One", staff_type: "ATTORNEY", admitted_counties: ["CountyA"], practice_areas: ["EVICTION_DEFENSE"], max_units: 40 }, as: ProgramDirector, captures: { sup_id: "$.data.id" } }
            - { call: "POST /referral-panel-members", payload: { full_name: "Panel Pat", practice_areas: ["EVICTION_DEFENSE"], counties: ["CountyA"], max_active_referrals: 2 }, as: ProgramDirector, captures: { member_id: "$.data.id" } }
            - { call: "POST /clients", payload: { full_name: "Cli Ref", residence_county: "CountyA", household_size: 1, annual_gross_income_cents: 1000000, annual_countable_income_cents: 900000, receives_means_tested_benefits: false }, as: IntakeSpecialist, as_user_id: "${intake_id}", captures: { client_id: "$.data.id" } }
            - { call: "POST /intake-applications", payload: { client_id: "${client_id}", case_type: "EVICTION_DEFENSE", opposing_party_name: "Landlord LLC", incident_county: "CountyA" }, as: IntakeSpecialist, as_user_id: "${intake_id}", captures: { app_id: "$.data.id" } }
            - { call: "POST /intake-applications/${app_id}/screen", payload: {}, as: IntakeSpecialist, as_user_id: "${intake_id}" }
            - { call: "POST /intake-applications/${app_id}/decide-eligibility", payload: { determination: "ELIGIBLE" }, as: IntakeSpecialist, as_user_id: "${intake_id}" }
            - { call: "POST /intake-applications/${app_id}/conflict-checks", payload: { result: "CLEAR" }, as: IntakeSpecialist, as_user_id: "${intake_id}" }
            - { call: "POST /intake-applications/${app_id}/open-case", payload: { service_level: "ADVICE_ONLY" }, as: SupervisingAttorney, as_user_id: "${sup_id}", captures: { case_id: "$.data.id" } }
            - { call: "POST /cases/${case_id}/referrals", payload: { panel_member_id: "${member_id}" }, as: SupervisingAttorney, as_user_id: "${sup_id}", captures: { ref_id: "$.data.id" } }
          trigger:
            - { call: "PATCH /referral-panel-members/${member_id}", payload: { status: "SUSPENDED" }, as: ProgramDirector }
            - { call: "POST /referrals/${ref_id}/respond", payload: { decision: "ACCEPT", service_start_date: "2026-09-01", service_end_date: "2026-10-01" }, as: SupervisingAttorney, as_user_id: "${sup_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_PANEL_MEMBER_NOT_ACTIVE (accept gated on the OTHER entity's state)"
            - "Referral.${ref_id}.status remains OFFERED; panel member active_referral_count remains 0"

  - rule_id: resource_temporal_overlap
    instances:
      - name: referral_service_window_halfopen_adjacency
        grounds:
          - validations[priority=27]
          - errors[ERR_PANEL_WINDOW_OVERLAP]
          - entities.Referral.fields.service_start_date
        distinguishing_aspect: |
          Resource = ReferralPanelMember, interval semantics = HALF-OPEN [start, end): an accept whose start
          equals an existing ACCEPTED window's end (adjacency) is NOT an overlap and succeeds, while a strictly
          intersecting window is rejected. The sibling instance uses CLOSED-interval semantics (boundary touch
          IS overlap) on a different resource (GrantProgram).
