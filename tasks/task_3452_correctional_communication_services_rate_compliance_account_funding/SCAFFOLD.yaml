    roles: [PlatformAdmin]
    code: 201
    input: [facility_id, commission_pct, commission_basis, deposit_fee_cents, closure_fee_cents, effective_from, "effective_to?"]
    output: FacilityContract
    side_effects: ["status = DRAFT"]
  - method: GET
    path: "/comm-services/contracts/{id}"
    description: "Get a contract"
    roles: [PlatformAdmin, StateRegulator, FacilityStaff, AccountHolder, RecipientParty, ComplianceOfficer]
    code: 200
    input: []
    output: FacilityContract
    side_effects: []
  - method: GET
    path: "/comm-services/contracts"
    description: "List contracts (FK reverse-reachability for FacilityContract.facility_id)"
    roles: [PlatformAdmin, StateRegulator, FacilityStaff, AccountHolder, RecipientParty, ComplianceOfficer]
    code: 200
    input: ["facility_id?", "status?", "limit?", "offset?"]
    output: "FacilityContract[]"
    side_effects: []
  - method: POST
    path: "/comm-services/contracts/{id}/activate"
    description: "Activate a contract (commission cap-checked; one ACTIVE contract per facility)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: FacilityContract
    side_effects: ["status -> ACTIVE"]
  - method: POST
    path: "/comm-services/contracts/{id}/terminate"
    description: "Terminate a contract; its ACTIVE schedule is superseded"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: FacilityContract
    side_effects: ["status -> TERMINATED", "ACTIVE RateSchedule on this contract -> SUPERSEDED"]

  # --- RateSchedule ---
  - method: POST
    path: "/comm-services/contracts/{id}/rate-schedules"
    description: "Create a DRAFT rate schedule on a contract (contract must not be TERMINATED)"
    roles: [PlatformAdmin]
    code: 201
    input: [local_per_minute_cents, intrastate_per_minute_cents, interstate_per_minute_cents, international_per_minute_cents, connection_fee_cents, message_price_cents, video_session_fee_cents]
    output: RateSchedule
    side_effects: ["status = DRAFT"]
  - method: GET
    path: "/comm-services/rate-schedules/{id}"
    description: "Get a rate schedule"
    roles: [PlatformAdmin, StateRegulator, FacilityStaff, AccountHolder, RecipientParty, ComplianceOfficer]
    code: 200
    input: []
    output: RateSchedule
    side_effects: []
  - method: GET
    path: "/comm-services/rate-schedules"
    description: "List rate schedules (FK reverse-reachability for RateSchedule.contract_id)"
    roles: [PlatformAdmin, StateRegulator, FacilityStaff, AccountHolder, RecipientParty, ComplianceOfficer]
    code: 200
    input: ["contract_id?", "status?", "limit?", "offset?"]
    output: "RateSchedule[]"
    side_effects: []
  - method: POST
    path: "/comm-services/rate-schedules/{id}/activate"
    description: "Activate a schedule against the current regulatory caps; supersedes the contract's prior ACTIVE schedule (OCC on contract version)"
    roles: [PlatformAdmin]
    code: 200
    input: [expected_contract_version]
    output: RateSchedule
    side_effects: ["status -> ACTIVE", "prior ACTIVE schedule -> SUPERSEDED", "activated_at = clock", "increments FacilityContract.version by 1", "ERR_STALE_VERSION (412) on version mismatch"]

