scenario: |
  Medical Device Contract Manufacturing (ISO 13485): design transfer & device
  master record, process validation (IQ/OQ/PQ) & revalidation trigger, lot/UDI
  traceability & label control, supplier qualification & change notification,
  nonconformance/CAPA & complaint linkage, sterile barrier & shelf-life study,
  quality agreement & audit rights, field-action support

domain_name: medical-device-contract-manufacturing
api_prefix: /api

# =============================================================================
# Complexity Profile (Step 0)
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit          # ISO 13485 quality-system compliance
  secondary_archetype: workflow_orchestration  # IQ/OQ/PQ pipeline, CAPA loop
  complexity_layers:
    - optimistic_concurrency        # OCC on Supplier.version (agreement create-supersede) and DeviceMasterRecord.version (revision create-supersede)
    - cascading_side_effects        # NCR->part->supplier->lots; CAPA->protocols->lots; SCN->parts->lots->protocols; clock->agreements->supplier->parts->lots
    - dual_variant_calculation      # lot expiry provisional-vs-final; supplier score current-vs-finalized
    - version_pinning_on_approval   # lots pin DMR revision + protocol; labels pin label_revision; protocols pin dmr revision
  entity_topology: graph            # flat collections; many-to-many genealogy (LotComponent), self-referential DMR revisions, cross-aggregate links
  state_machine_shape: parallel     # DeviceLot disposition_status x hold_status; cyclic machines on ValidationProtocol / CAPA / Supplier / Complaint / NonconformanceReport
  relationship_patterns:
    - one_to_many
    - many_to_many                  # DeviceLot <-> SupplierPart via LotComponent
    - self_referential              # DeviceMasterRecord.parent_dmr_id (revision chain)
    - cross_aggregate               # CAPA -> Complaint/NCR; FieldAction -> Complaint; SCN -> SupplierPart
  role_model: segregation_of_duties # author!=approver (DMR), executor!=approver (validation phases), initiator!=closer (NCR, CAPA)
  consistency_model: immediate      # every mutation + cascade visible in the same request's response / subsequent reads

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: DeviceMasterRecord
    parent: null
    common_fields: true
    fields:
      - { name: device_code, type: string, source: input, description: "Device family code; unique together with revision_code" }
      - { name: revision_code, type: string, source: input, description: "Revision label, e.g. 'A'; for revisions created via POST /device-master-records/{id}/revisions the client supplies the new code" }
      - { name: revision_seq, type: integer, source: system, default: 1, description: "1 for first revision; parent revision_seq + 1 for successor revisions" }
      - { name: parent_dmr_id, type: string, source: system, description: "FK -> DeviceMasterRecord.id; prior revision this one derives from (null on first revision)" }
      - { name: sterile, type: boolean, source: input, description: "Whether the device is supplied sterile (gates sterile-barrier study + sterility release)" }
      - { name: shelf_life_claim_months, type: integer, source: input, description: "Target shelf-life claim in months (> 0)" }
      - { name: confirmed_shelf_life_months, type: integer, source: system, description: "Set from SterileBarrierStudy.result_months_confirmed when a study PASSED; null until then" }
      - { name: complaint_rate_per_100k, type: number, source: computed, default: 0, description: "Confirmed complaints per 100k released units (see complaint_rate_per_100k calc)" }
      - { name: field_action_review_required, type: boolean, source: computed, default: false, description: "true when complaint_rate_per_100k >= 5.0" }
      - { name: author_user_id, type: string, source: system, description: "X-User-ID of creator (segregation of duties on approve)" }
      - { name: approver_user_id, type: string, source: system, description: "X-User-ID of approver; null until APPROVED" }
      - { name: approved_at, type: datetime, source: system, description: "Logical clock time of approval; null until APPROVED" }
      - { name: status, type: enum, source: system, description: "DRAFT | APPROVED | SUPERSEDED | OBSOLETE" }

  - name: ManufacturingLine
    parent: null
    common_fields: true
    fields:
      - { name: line_code, type: string, source: input, description: "Unique line code" }
      - { name: description, type: string, source: input, description: "Free-text description", default: "" }
      - { name: changeover_buffer_hours, type: integer, source: input, default: 24, description: "Mandatory gap between validation windows on this line" }

  - name: Supplier
    parent: null
    common_fields: true
    fields:
      - { name: supplier_code, type: string, source: input, description: "Unique supplier code" }
      - { name: name, type: string, source: input, description: "Supplier legal name" }
      - { name: status, type: enum, source: system, description: "PENDING_QUALIFICATION | QUALIFIED | SUSPENDED | DISQUALIFIED" }
      - { name: quality_score, type: number, source: computed, default: 100, description: "max(0, 100 - applied_penalty_points); includes DISPOSITIONED + CLOSED supplier-fault NCR penalties and completed-audit penalties" }
      - { name: quality_score_finalized, type: number, source: computed, default: 100, description: "max(0, 100 - applied_finalized_penalty_points); counts only CLOSED NCR penalties + completed-audit penalties (drives risk_tier)" }
      - { name: applied_penalty_points, type: number, source: computed, default: 0, description: "Sum of active penalties (DISPOSITIONED/CLOSED supplier-fault NCRs + completed audits); reversed on NCR reopen" }
      - { name: applied_finalized_penalty_points, type: number, source: computed, default: 0, description: "Sum of penalties from CLOSED supplier-fault NCRs + completed audits" }
      - { name: risk_tier, type: enum, source: computed, default: LOW, description: "LOW (finalized >= 90) | MEDIUM (>= 70) | HIGH (< 70)" }
      - { name: last_audit_completed_at, type: datetime, source: system, description: "Completion time of latest COMPLETED audit; null if none" }
      - { name: next_audit_due_at, type: datetime, source: computed, description: "last_audit_completed_at + tier interval (LOW 24mo / MEDIUM 12mo / HIGH 6mo); supplier.created_at + 12mo when never audited" }
      - { name: is_audit_overdue, type: boolean, source: computed, default: false, description: "true when next_audit_due_at <= logical now and supplier.status != DISQUALIFIED" }

  - name: QualityAgreement
    parent: null
    common_fields: true
    fields:
      - { name: supplier_id, type: string, source: input, description: "FK -> Supplier.id" }
      - { name: agreement_code, type: string, source: input, description: "Unique agreement code" }
      - { name: audit_rights_granted, type: boolean, source: input, description: "Whether audit rights are granted" }
      - { name: audit_notice_days, type: integer, source: input, default: 30, description: "Notice days required before an audit window may start" }
      - { name: change_notice_days, type: integer, source: input, default: 90, description: "Minimum days between SCN notification and proposed_effective_date" }
      - { name: effective_from, type: datetime, source: input, description: "Agreement effective start (inclusive)" }
      - { name: effective_to, type: datetime, source: input, description: "Agreement effective end (exclusive for activity; expiry sweep fires when now >= effective_to)" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | SUPERSEDED | EXPIRED | TERMINATED" }

  - name: SupplierPart
    parent: null
    common_fields: true
    fields:
      - { name: supplier_id, type: string, source: input, description: "FK -> Supplier.id" }
      - { name: part_number, type: string, source: input, description: "Unique per supplier" }
      - { name: description, type: string, source: input, description: "Part description" }
      - { name: critical, type: boolean, source: input, default: false, description: "Critical component flag (sampling multiplier + SCN revalidation scope)" }
      - { name: quantity_received, type: integer, source: computed, default: 0, description: "Cumulative received units (receive endpoint)" }
      - { name: quantity_remaining, type: integer, source: computed, default: 0, description: "Uncommitted units" }
      - { name: quantity_committed, type: integer, source: computed, default: 0, description: "Units committed to lots in IN_PRODUCTION/COMPLETED" }
      - { name: quantity_in_released_lots, type: integer, source: computed, default: 0, description: "Units consumed by RELEASED/RECALLED lots" }
      - { name: quantity_in_scrapped_lots, type: integer, source: computed, default: 0, description: "Units consumed by SCRAPPED lots" }
      - { name: status, type: enum, source: system, description: "QUALIFIED | ON_HOLD | DISQUALIFIED" }

  - name: SupplierChangeNotification
    parent: null
    common_fields: true
    fields:
      - { name: supplier_id, type: string, source: system, description: "FK -> Supplier.id; from path" }
      - { name: supplier_part_id, type: string, source: input, description: "FK -> SupplierPart.id; optional scope of the change" }
      - { name: change_description, type: string, source: input, description: "Description of the supplier change" }
      - { name: impact_class, type: enum, source: input, description: "MINOR | MAJOR" }
      - { name: proposed_effective_date, type: datetime, source: input, description: "Proposed date the change takes effect" }
      - { name: notified_at, type: datetime, source: system, description: "Logical clock time at submission" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | UNDER_REVIEW | ACCEPTED | REJECTED" }

  - name: SupplierAudit
    parent: null
    common_fields: true
    fields:
      - { name: supplier_id, type: string, source: system, description: "FK -> Supplier.id; from path" }
      - { name: scheduled_start, type: datetime, source: input, description: "Audit window start (inclusive)" }
      - { name: scheduled_end, type: datetime, source: input, description: "Audit window end (exclusive; half-open interval)" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED | CANCELLED" }
      - { name: findings_count, type: integer, source: input, description: "Minor findings recorded at completion (>= 0)" }
      - { name: major_findings_count, type: integer, source: input, description: "Major findings recorded at completion (>= 0)" }
      - { name: penalty_points, type: number, source: computed, default: 0, description: "findings_count*2 + major_findings_count*8, applied at completion" }
      - { name: completed_at, type: datetime, source: system, description: "Logical clock time of completion; null until COMPLETED" }

  - name: ValidationProtocol
    parent: null
    common_fields: true
    fields:
      - { name: protocol_code, type: string, source: input, description: "Unique protocol code" }
      - { name: dmr_id, type: string, source: input, description: "FK -> DeviceMasterRecord.id; pinned revision under validation" }
      - { name: line_id, type: string, source: input, description: "FK -> ManufacturingLine.id; reserved line for the planned window" }
      - { name: planned_start, type: datetime, source: input, description: "Planned execution window start (inclusive)" }
      - { name: planned_end, type: datetime, source: input, description: "Planned execution window end (inclusive; buffered interval semantics)" }
      - { name: status, type: enum, source: system, description: "DRAFT | IQ_EXECUTION | IQ_REVIEW | OQ_EXECUTION | OQ_REVIEW | PQ_EXECUTION | PQ_REVIEW | VALIDATED | REVALIDATION_REQUIRED" }
      - { name: iq_executor_user_id, type: string, source: system, description: "X-User-ID that submitted IQ for review; cleared on IQ reject" }
      - { name: iq_approver_user_id, type: string, source: system, description: "X-User-ID that approved IQ" }
      - { name: oq_executor_user_id, type: string, source: system, description: "X-User-ID that submitted OQ for review; cleared on OQ reject" }
      - { name: oq_approver_user_id, type: string, source: system, description: "X-User-ID that approved OQ" }
      - { name: pq_executor_user_id, type: string, source: system, description: "X-User-ID that submitted PQ for review; cleared on PQ reject" }
      - { name: pq_approver_user_id, type: string, source: system, description: "X-User-ID that approved PQ" }
      - { name: validated_at, type: datetime, source: system, description: "Logical clock time when status became VALIDATED" }
      - { name: revalidation_due_at, type: datetime, source: computed, description: "validated_at + 36 months" }
      - { name: revalidation_reason, type: enum, source: system, default: NONE, description: "NONE | TIME_EXPIRY | SUPPLIER_CHANGE | CAPA_PROCESS_CHANGE | STUDY_FAILURE" }
      - { name: generation, type: integer, source: system, default: 1, description: "Validation cycle; +1 each time execution restarts from REVALIDATION_REQUIRED" }

  - name: SterileBarrierStudy
    parent: null
    common_fields: true
    fields:
      - { name: dmr_id, type: string, source: input, description: "FK -> DeviceMasterRecord.id" }
      - { name: study_type, type: enum, source: input, description: "REAL_TIME | ACCELERATED" }
      - { name: claimed_months, type: integer, source: input, description: "Shelf-life months under test (> 0)" }
      - { name: started_at, type: datetime, source: system, description: "Logical clock time at creation" }
      - { name: status, type: enum, source: system, description: "IN_PROGRESS | PASSED | FAILED | INVALIDATED" }
      - { name: result_months_confirmed, type: integer, source: input, description: "Confirmed shelf-life months; required when completing with passed=true" }

  - name: DeviceLot
    parent: null
    common_fields: true
    fields:
      - { name: lot_number, type: string, source: input, description: "Unique per DMR" }
      - { name: dmr_id, type: string, source: input, description: "FK -> DeviceMasterRecord.id; pinned revision at creation" }
      - { name: validation_protocol_id, type: string, source: input, description: "FK -> ValidationProtocol.id; protocol the lot is produced under" }
      - { name: quantity, type: integer, source: input, description: "Manufactured quantity (> 0)" }
      - { name: manufactured_at, type: datetime, source: input, description: "Manufacturing timestamp (drives expiry + field-action scope)" }
      - { name: sample_qty, type: integer, source: computed, default: 0, description: "Sterility sample size, computed at lot completion (sterile_sample_qty calc)" }
      - { name: releasable_qty, type: integer, source: computed, description: "quantity - sample_qty" }
      - { name: expiry_date, type: datetime, source: computed, description: "manufactured_at + expiry months (lot_expiry calc, dual variant)" }
      - { name: expiry_basis, type: enum, source: computed, description: "PROVISIONAL | FINAL" }
      - { name: sterility_result, type: enum, source: system, description: "PENDING | PASSED | FAILED" }
      - { name: disposition_status, type: enum, source: system, description: "IN_PRODUCTION | COMPLETED | RELEASED | SCRAPPED | RECALLED" }
      - { name: hold_status, type: enum, source: system, description: "CLEAR | ON_HOLD (parallel dimension, independent of disposition_status)" }
      - { name: hold_reason, type: enum, source: system, default: NONE, description: "NONE | MANUAL | NCR_OPEN | SUPPLIER_QUALITY | REVALIDATION | STERILITY_FAILURE | FIELD_ACTION" }

  - name: LotComponent
    parent: null
    common_fields: true
    fields:
      - { name: lot_id, type: string, source: system, description: "FK -> DeviceLot.id; from path" }
      - { name: supplier_part_id, type: string, source: input, description: "FK -> SupplierPart.id" }
      - { name: quantity_used, type: integer, source: input, description: "Units consumed (> 0)" }
      - { name: supplier_lot_number, type: string, source: input, description: "Supplier's lot/batch number for genealogy" }

  - name: UDILabel
    parent: null
    common_fields: true
    fields:
      - { name: lot_id, type: string, source: system, description: "FK -> DeviceLot.id; from path" }
      - { name: udi_di, type: string, source: input, description: "14-digit UDI-DI; final digit must satisfy GS1 check digit" }
      - { name: udi_pi, type: string, source: computed, description: "'LOT-' + lot.lot_number + '-EXP-' + expiry_date as YYYYMMDD" }
      - { name: label_revision, type: string, source: system, description: "DMR revision_code of the lot at label creation" }
      - { name: status, type: enum, source: system, description: "DRAFT | APPROVED | PRINTED | VOID" }
      - { name: printed_at, type: datetime, source: system, description: "Logical clock time of print; null until PRINTED" }
      - { name: void_reason, type: enum, source: system, default: NONE, description: "NONE | LOT_SCRAPPED | LOT_RECALLED | MANUAL" }

  - name: NonconformanceReport
    parent: null
    common_fields: true
    fields:
      - { name: ncr_code, type: string, source: input, description: "Unique NCR code" }
      - { name: lot_id, type: string, source: input, description: "FK -> DeviceLot.id; optional, but at least one of lot_id / supplier_part_id required" }
      - { name: supplier_part_id, type: string, source: input, description: "FK -> SupplierPart.id; optional" }
      - { name: description, type: string, source: input, description: "Nonconformance description" }
      - { name: severity, type: enum, source: input, description: "MINOR | MAJOR | CRITICAL" }
      - { name: fault, type: enum, source: system, description: "UNDETERMINED | INTERNAL | SUPPLIER" }
      - { name: disposition, type: enum, source: system, description: "NONE | USE_AS_IS | REWORK | SCRAP | RETURN_TO_SUPPLIER" }
      - { name: status, type: enum, source: system, description: "OPEN | CONTAINED | DISPOSITIONED | CLOSED" }
      - { name: initiator_user_id, type: string, source: system, description: "X-User-ID of creator (segregation of duties on close)" }
      - { name: penalty_points_applied, type: number, source: computed, default: 0, description: "Severity penalty applied to supplier while fault=SUPPLIER and status in DISPOSITIONED/CLOSED (MINOR 5 / MAJOR 15 / CRITICAL 30)" }

  - name: Complaint
    parent: null
    common_fields: true
    fields:
      - { name: complaint_code, type: string, source: input, description: "Unique complaint code" }
      - { name: lot_id, type: string, source: input, description: "FK -> DeviceLot.id; complained unit's lot" }
      - { name: severity, type: enum, source: input, description: "COSMETIC | MINOR | SERIOUS_INJURY | DEATH" }
      - { name: description, type: string, source: input, description: "Complaint description" }
      - { name: confirmed, type: boolean, source: system, default: false, description: "Set at complete-investigation" }
      - { name: received_at, type: datetime, source: system, description: "Logical clock time at intake" }
      - { name: investigator_user_id, type: string, source: system, description: "X-User-ID that started investigation" }
      - { name: status, type: enum, source: system, description: "RECEIVED | UNDER_INVESTIGATION | INVESTIGATED | CLOSED" }

  - name: CAPA
    parent: null
    common_fields: true
    fields:
      - { name: capa_code, type: string, source: input, description: "Unique CAPA code" }
      - { name: dmr_id, type: string, source: input, description: "FK -> DeviceMasterRecord.id" }
      - { name: source_type, type: enum, source: input, description: "COMPLAINT | NCR | AUDIT | MANUAL" }
      - { name: source_complaint_id, type: string, source: input, description: "FK -> Complaint.id; required when source_type=COMPLAINT" }
      - { name: source_ncr_id, type: string, source: input, description: "FK -> NonconformanceReport.id; required when source_type=NCR" }
      - { name: process_change, type: boolean, source: input, default: false, description: "Whether the CAPA changes a validated process (triggers revalidation cascade at IMPLEMENTING)" }
      - { name: action_summary, type: string, source: input, description: "Action plan text (required at plan-actions)" }
      - { name: initiator_user_id, type: string, source: system, description: "X-User-ID of creator (segregation of duties on verify-effectiveness)" }
      - { name: closer_user_id, type: string, source: system, description: "X-User-ID that closed the CAPA; null until CLOSED" }
      - { name: effectiveness_cycles, type: integer, source: system, default: 0, description: "+1 on each restart-investigation from INEFFECTIVE" }
      - { name: status, type: enum, source: system, description: "INITIATED | INVESTIGATING | ACTION_PLANNED | IMPLEMENTING | EFFECTIVENESS_CHECK | CLOSED | INEFFECTIVE" }

  - name: FieldAction
    parent: null
    common_fields: true
    fields:
      - { name: action_code, type: string, source: input, description: "Unique field-action code" }
      - { name: dmr_id, type: string, source: input, description: "FK -> DeviceMasterRecord.id" }
      - { name: action_type, type: enum, source: input, description: "CORRECTION | REMOVAL" }
      - { name: scope_mfg_start, type: datetime, source: input, description: "Recall scope: lots with manufactured_at >= this (closed interval)" }
      - { name: scope_mfg_end, type: datetime, source: input, description: "Recall scope: lots with manufactured_at <= this (closed interval)" }
      - { name: reason_complaint_id, type: string, source: input, description: "FK -> Complaint.id; confirmed SERIOUS_INJURY/DEATH complaint" }
      - { name: issued_at, type: datetime, source: system, description: "Logical clock time of issue; null until ISSUED" }
      - { name: recalled_lot_count, type: integer, source: computed, default: 0, description: "Lots transitioned to RECALLED by issue" }
      - { name: status, type: enum, source: system, description: "DRAFT | ISSUED | CLOSED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: DeviceMasterRecord
    initial_state: DRAFT
    terminal_states: [OBSOLETE]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /api/device-master-records/{id}/approve"
        actor: QualityManager
        preconditions:
          - "status == DRAFT (else ERR_INVALID_STATE_TRANSITION)"
          - "X-User-ID != author_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "sets approver_user_id, approved_at"
          - "any other revision of same device_code in APPROVED -> SUPERSEDED (including parent_dmr_id chain)"
          - "cascade: each such SUPERSEDED revision's SterileBarrierStudy in IN_PROGRESS -> INVALIDATED"
      - from: APPROVED
        to: OBSOLETE
        trigger: "POST /api/device-master-records/{id}/obsolete"
        actor: QualityManager
        preconditions:
          - "status in {APPROVED, SUPERSEDED} (else ERR_INVALID_STATE_TRANSITION)"
          - "no DeviceLot with dmr_id == this and disposition_status in {IN_PRODUCTION, COMPLETED} (else ERR_LOTS_IN_FLIGHT)"
          - "no ValidationProtocol with dmr_id == this and status in {DRAFT, IQ_EXECUTION, IQ_REVIEW, OQ_EXECUTION, OQ_REVIEW, PQ_EXECUTION, PQ_REVIEW} (else ERR_PROTOCOLS_IN_FLIGHT)"
        side_effects:
          - "SterileBarrierStudy of this DMR in IN_PROGRESS -> INVALIDATED"
      - from: SUPERSEDED
        to: OBSOLETE
        trigger: "POST /api/device-master-records/{id}/obsolete"
        actor: QualityManager
        preconditions:
          - "status in {APPROVED, SUPERSEDED} (else ERR_INVALID_STATE_TRANSITION)"
          - "no DeviceLot with dmr_id == this and disposition_status in {IN_PRODUCTION, COMPLETED} (else ERR_LOTS_IN_FLIGHT)"
          - "no ValidationProtocol with dmr_id == this and status in {DRAFT..PQ_REVIEW} (else ERR_PROTOCOLS_IN_FLIGHT)"
        side_effects:
          - "SterileBarrierStudy of this DMR in IN_PROGRESS -> INVALIDATED"
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system (a newer revision of the same device_code is approved)"
        actor: system
        preconditions: []
        side_effects:
          - "SterileBarrierStudy of this DMR in IN_PROGRESS -> INVALIDATED"

  - entity: Supplier
    initial_state: PENDING_QUALIFICATION
    terminal_states: [DISQUALIFIED]
    transitions:
      - from: PENDING_QUALIFICATION
        to: QUALIFIED
        trigger: "POST /api/suppliers/{id}/qualify"
        actor: SupplierQualityEngineer
        preconditions:
          - "status == PENDING_QUALIFICATION (else ERR_INVALID_STATE_TRANSITION)"
          - "at least one QualityAgreement with supplier_id == this and status == ACTIVE (else ERR_NO_ACTIVE_QUALITY_AGREEMENT)"
        side_effects: []
      - from: QUALIFIED
        to: SUSPENDED
        trigger: "POST /api/suppliers/{id}/suspend OR system auto when quality_score < 50"
        actor: SupplierQualityEngineer | system
        preconditions:
          - "status == QUALIFIED (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "all SupplierPart of this supplier in QUALIFIED -> ON_HOLD"
          - "cascade: DeviceLots in IN_PRODUCTION/COMPLETED containing any such part -> hold_status ON_HOLD (hold_reason SUPPLIER_QUALITY)"
      - from: SUSPENDED
        to: QUALIFIED
        trigger: "POST /api/suppliers/{id}/reinstate"
        actor: SupplierQualityEngineer
        preconditions:
          - "status == SUSPENDED (else ERR_INVALID_STATE_TRANSITION)"
          - "quality_score >= 50 (else ERR_SCORE_BELOW_REINSTATE_THRESHOLD)"
          - "at least one ACTIVE QualityAgreement (else ERR_NO_ACTIVE_QUALITY_AGREEMENT)"
        side_effects:
          - "all SupplierPart of this supplier in ON_HOLD -> QUALIFIED (hold-release on parts; lot holds must still be cleared individually)"
      - from: QUALIFIED
        to: DISQUALIFIED
        trigger: "POST /api/suppliers/{id}/disqualify"
        actor: SupplierQualityEngineer
        preconditions:
          - "status in {QUALIFIED, SUSPENDED} (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "all SupplierPart of this supplier in {QUALIFIED, ON_HOLD} -> DISQUALIFIED"
          - "cascade: DeviceLots in IN_PRODUCTION/COMPLETED containing any such part -> hold_status ON_HOLD (hold_reason SUPPLIER_QUALITY)"
          - "QualityAgreement of this supplier in ACTIVE -> TERMINATED"
      - from: SUSPENDED
        to: DISQUALIFIED
        trigger: "POST /api/suppliers/{id}/disqualify"
        actor: SupplierQualityEngineer
        preconditions:
          - "status in {QUALIFIED, SUSPENDED} (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "all SupplierPart of this supplier in {QUALIFIED, ON_HOLD} -> DISQUALIFIED"
          - "cascade: DeviceLots in IN_PRODUCTION/COMPLETED containing any such part -> hold_status ON_HOLD (hold_reason SUPPLIER_QUALITY)"
          - "QualityAgreement of this supplier in ACTIVE -> TERMINATED"

  - entity: QualityAgreement
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, EXPIRED, TERMINATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /api/quality-agreements/{id}/activate"
        actor: SupplierQualityEngineer
        preconditions:
          - "status == DRAFT (else ERR_INVALID_STATE_TRANSITION)"
          - "effective_from <= now < effective_to (else ERR_AGREEMENT_NOT_IN_EFFECT)"
          - "supplier.status != DISQUALIFIED (else ERR_SUPPLIER_DISQUALIFIED)"
        side_effects:
          - "any other QualityAgreement of same supplier in ACTIVE -> SUPERSEDED"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /api/quality-agreements/{id}/terminate"
        actor: SupplierQualityEngineer
        preconditions:
          - "status == ACTIVE (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "if no other ACTIVE agreement for supplier and supplier.status == QUALIFIED -> supplier SUSPENDED (with its part/lot cascade)"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (clock sweep: now >= effective_to)"
        actor: system
        preconditions: []
        side_effects:
          - "if no other ACTIVE agreement for supplier and supplier.status == QUALIFIED -> supplier SUSPENDED (with its part/lot cascade)"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system (a new QualityAgreement is created for the same supplier)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (another agreement of the same supplier is activated)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: SupplierPart
    initial_state: QUALIFIED
    terminal_states: [DISQUALIFIED]
    transitions:
      - from: QUALIFIED
        to: ON_HOLD
        trigger: "system (SCN accepted MAJOR on part, NCR disposition fault=SUPPLIER, or supplier suspension)"
        actor: system
        preconditions: []
        side_effects:
          - "DeviceLots in IN_PRODUCTION/COMPLETED with a LotComponent referencing this part -> hold_status ON_HOLD (hold_reason SUPPLIER_QUALITY)"
      - from: ON_HOLD
        to: QUALIFIED
        trigger: "POST /api/supplier-parts/{id}/reinstate OR system (supplier reinstate)"
        actor: SupplierQualityEngineer | system
        preconditions:
          - "status == ON_HOLD (else ERR_INVALID_STATE_TRANSITION)"
          - "for the endpoint: supplier.status not in {SUSPENDED, DISQUALIFIED} (else ERR_SUPPLIER_NOT_CLEAR)"
          - "for the endpoint: no SupplierChangeNotification on this part in {SUBMITTED, UNDER_REVIEW} (else ERR_SCN_PENDING)"
        side_effects: []
      - from: QUALIFIED
        to: DISQUALIFIED
        trigger: "system (supplier disqualified)"
        actor: system
        preconditions: []
        side_effects:
          - "DeviceLots in IN_PRODUCTION/COMPLETED containing this part -> hold_status ON_HOLD (SUPPLIER_QUALITY)"
      - from: ON_HOLD
        to: DISQUALIFIED
        trigger: "system (supplier disqualified)"
        actor: system
        preconditions: []
        side_effects:
          - "DeviceLots in IN_PRODUCTION/COMPLETED containing this part -> hold_status ON_HOLD (SUPPLIER_QUALITY)"

  - entity: SupplierChangeNotification
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /api/change-notifications/{id}/start-review"
        actor: SupplierQualityEngineer
        preconditions:
          - "status == SUBMITTED (else ERR_INVALID_STATE_TRANSITION)"
        side_effects: []
      - from: UNDER_REVIEW
        to: ACCEPTED
        trigger: "POST /api/change-notifications/{id}/accept"
        actor: SupplierQualityEngineer
        preconditions:
          - "status == UNDER_REVIEW (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "if impact_class == MAJOR and supplier_part_id set: that SupplierPart (if QUALIFIED) -> ON_HOLD; cascade to lots (SUPPLIER_QUALITY)"
          - "if impact_class == MAJOR and the affected part is critical: ValidationProtocols in VALIDATED whose DMR revision has lots containing the part -> REVALIDATION_REQUIRED (reason SUPPLIER_CHANGE); cascade: that transition holds in-flight lots (REVALIDATION)"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /api/change-notifications/{id}/reject"
        actor: SupplierQualityEngineer
        preconditions:
          - "status == UNDER_REVIEW (else ERR_INVALID_STATE_TRANSITION)"
        side_effects: []

  - entity: SupplierAudit
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /api/supplier-audits/{id}/complete"
        actor: SupplierQualityEngineer
        preconditions:
          - "status == SCHEDULED (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "penalty_points = findings_count*2 + major_findings_count*8; supplier.applied_penalty_points += penalty; applied_finalized_penalty_points += penalty; recompute quality_score, quality_score_finalized, risk_tier"
          - "supplier.last_audit_completed_at = now; recompute next_audit_due_at from current risk_tier"
          - "if quality_score < 50 and supplier.status == QUALIFIED -> supplier SUSPENDED (with part/lot cascade)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /api/supplier-audits/{id}/cancel"
        actor: SupplierQualityEngineer
        preconditions:
          - "status == SCHEDULED (else ERR_INVALID_STATE_TRANSITION)"
        side_effects: []

  - entity: ValidationProtocol
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: IQ_EXECUTION
        trigger: "POST /api/validation-protocols/{id}/execute-phase"
        actor: QualityEngineer
        preconditions:
          - "status in {DRAFT, REVALIDATION_REQUIRED} (else ERR_INVALID_STATE_TRANSITION)"
          - "dmr.status == APPROVED (else ERR_DMR_NOT_APPROVED)"
        side_effects:
          - "if entered from REVALIDATION_REQUIRED: generation += 1; clears all phase executor/approver ids; revalidation_reason := NONE"
      - from: REVALIDATION_REQUIRED
        to: IQ_EXECUTION
        trigger: "POST /api/validation-protocols/{id}/execute-phase"
        actor: QualityEngineer
        preconditions:
          - "status in {DRAFT, REVALIDATION_REQUIRED} (else ERR_INVALID_STATE_TRANSITION)"
          - "dmr.status == APPROVED (else ERR_DMR_NOT_APPROVED)"
        side_effects:
          - "generation += 1; clears iq/oq/pq executor+approver ids; revalidation_reason := NONE"
      - from: IQ_EXECUTION
        to: IQ_REVIEW
        trigger: "POST /api/validation-protocols/{id}/submit-phase-review"
        actor: QualityEngineer
        preconditions:
          - "status in {IQ_EXECUTION, OQ_EXECUTION, PQ_EXECUTION} (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "iq_executor_user_id := X-User-ID"
      - from: OQ_EXECUTION
        to: OQ_REVIEW
        trigger: "POST /api/validation-protocols/{id}/submit-phase-review"
        actor: QualityEngineer
        preconditions:
          - "status in {IQ_EXECUTION, OQ_EXECUTION, PQ_EXECUTION} (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "oq_executor_user_id := X-User-ID"
      - from: PQ_EXECUTION
        to: PQ_REVIEW
        trigger: "POST /api/validation-protocols/{id}/submit-phase-review"
        actor: QualityEngineer
        preconditions:
          - "status in {IQ_EXECUTION, OQ_EXECUTION, PQ_EXECUTION} (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "pq_executor_user_id := X-User-ID"
      - from: IQ_REVIEW
        to: OQ_EXECUTION
        trigger: "POST /api/validation-protocols/{id}/approve-phase"
        actor: QualityManager
        preconditions:
          - "status in {IQ_REVIEW, OQ_REVIEW, PQ_REVIEW} (else ERR_INVALID_STATE_TRANSITION)"
          - "X-User-ID != executor of current phase (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "iq_approver_user_id := X-User-ID"
      - from: OQ_REVIEW
        to: PQ_EXECUTION
        trigger: "POST /api/validation-protocols/{id}/approve-phase"
        actor: QualityManager
        preconditions:
          - "status in {IQ_REVIEW, OQ_REVIEW, PQ_REVIEW} (else ERR_INVALID_STATE_TRANSITION)"
          - "X-User-ID != oq_executor_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "oq_approver_user_id := X-User-ID"
      - from: PQ_REVIEW
        to: VALIDATED
        trigger: "POST /api/validation-protocols/{id}/approve-phase"
        actor: QualityManager
        preconditions:
          - "status in {IQ_REVIEW, OQ_REVIEW, PQ_REVIEW} (else ERR_INVALID_STATE_TRANSITION)"
          - "X-User-ID != pq_executor_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "pq_approver_user_id := X-User-ID; validated_at := now; revalidation_due_at := validated_at + 36 months; revalidation_reason := NONE"
      - from: IQ_REVIEW
        to: IQ_EXECUTION
        trigger: "POST /api/validation-protocols/{id}/reject-phase"
        actor: QualityManager
        preconditions:
          - "status in {IQ_REVIEW, OQ_REVIEW, PQ_REVIEW} (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "iq_executor_user_id := null (rework may be performed by any QualityEngineer)"
      - from: OQ_REVIEW
        to: OQ_EXECUTION
        trigger: "POST /api/validation-protocols/{id}/reject-phase"
        actor: QualityManager
        preconditions:
          - "status in {IQ_REVIEW, OQ_REVIEW, PQ_REVIEW} (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "oq_executor_user_id := null"
      - from: PQ_REVIEW
        to: PQ_EXECUTION
        trigger: "POST /api/validation-protocols/{id}/reject-phase"
        actor: QualityManager
        preconditions:
          - "status in {IQ_REVIEW, OQ_REVIEW, PQ_REVIEW} (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "pq_executor_user_id := null"
      - from: VALIDATED
        to: REVALIDATION_REQUIRED
        trigger: "system (clock sweep now >= revalidation_due_at | SCN MAJOR on critical part | CAPA implement with process_change | sterile study FAILED)"
        actor: system
        preconditions: []
        side_effects:
          - "revalidation_reason set per trigger (TIME_EXPIRY | SUPPLIER_CHANGE | CAPA_PROCESS_CHANGE | STUDY_FAILURE)"
          - "DeviceLots with validation_protocol_id == this and disposition_status in {IN_PRODUCTION, COMPLETED} -> hold_status ON_HOLD (hold_reason REVALIDATION)"

  - entity: SterileBarrierStudy
    initial_state: IN_PROGRESS
    terminal_states: [PASSED, FAILED, INVALIDATED]
    transitions:
      - from: IN_PROGRESS
        to: PASSED
        trigger: "POST /api/sterile-barrier-studies/{id}/complete with passed=true"
        actor: QualityManager
        preconditions:
          - "status == IN_PROGRESS (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "dmr.confirmed_shelf_life_months := result_months_confirmed"
          - "recompute expiry_date (FINAL variant) for DeviceLots of this DMR with disposition_status in {IN_PRODUCTION, COMPLETED}; set expiry_basis = FINAL (RELEASED/RECALLED lots keep pinned expiry)"
      - from: IN_PROGRESS
        to: FAILED
        trigger: "POST /api/sterile-barrier-studies/{id}/complete with passed=false"
        actor: QualityManager
        preconditions:
          - "status == IN_PROGRESS (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "ValidationProtocols of this DMR in VALIDATED -> REVALIDATION_REQUIRED (reason STUDY_FAILURE); cascade holds in-flight lots (REVALIDATION)"
      - from: IN_PROGRESS
        to: INVALIDATED
        trigger: "system (DMR superseded or obsoleted)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: DeviceLot
    initial_state: "disposition_status=IN_PRODUCTION, hold_status=CLEAR"
    terminal_states: [SCRAPPED, RECALLED]
    parallel_dimensions: [disposition_status, hold_status]
    transitions:
      - from: "IN_PRODUCTION (disposition)"
        to: COMPLETED
        trigger: "POST /api/device-lots/{id}/complete"
        actor: ProductionOperator
        preconditions:
          - "disposition_status == IN_PRODUCTION (else ERR_INVALID_STATE_TRANSITION)"
          - "at least one LotComponent exists for the lot (else ERR_NO_COMPONENTS_RECORDED)"
        side_effects:
          - "sample_qty := sterile_sample_qty(quantity, any component part critical, count of RELEASED/RECALLED lots under same validation_protocol_id)"
          - "releasable_qty := quantity - sample_qty"
      - from: "COMPLETED (disposition)"
        to: RELEASED
        trigger: "POST /api/device-lots/{id}/release"
        actor: QualityManager
        preconditions:
          - "disposition_status == COMPLETED (else ERR_INVALID_STATE_TRANSITION)"
          - "hold_status == CLEAR (else ERR_LOT_ON_HOLD)"
          - "sterility_result == PASSED when dmr.sterile (else ERR_STERILITY_NOT_PASSED)"
          - "validation protocol status == VALIDATED (else ERR_PROTOCOL_NOT_VALIDATED)"
          - "no NonconformanceReport with lot_id == this and status in {OPEN, CONTAINED} (else ERR_OPEN_NCRS_EXIST)"
          - "at least one UDILabel of this lot in PRINTED with label_revision == dmr.revision_code (else ERR_NO_PRINTED_LABEL)"
          - "dmr.status == APPROVED (else ERR_DMR_NOT_APPROVED)"
        side_effects:
          - "for each LotComponent: part.quantity_committed -= quantity_used; part.quantity_in_released_lots += quantity_used"
          - "recompute dmr complaint_rate_per_100k (denominator includes this lot's releasable_qty)"
      - from: "IN_PRODUCTION (disposition)"
        to: SCRAPPED
        trigger: "POST /api/device-lots/{id}/scrap"
        actor: QualityEngineer
        preconditions:
          - "disposition_status in {IN_PRODUCTION, COMPLETED} (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "for each LotComponent: part.quantity_committed -= quantity_used; part.quantity_in_scrapped_lots += quantity_used"
          - "UDILabels of this lot in {DRAFT, APPROVED, PRINTED} -> VOID (void_reason LOT_SCRAPPED)"
          - "NonconformanceReports of this lot in {OPEN, CONTAINED} -> DISPOSITIONED (disposition=SCRAP, fault unchanged)"
      - from: "COMPLETED (disposition)"
        to: SCRAPPED
        trigger: "POST /api/device-lots/{id}/scrap"
        actor: QualityEngineer
        preconditions:
          - "disposition_status in {IN_PRODUCTION, COMPLETED} (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "for each LotComponent: part.quantity_committed -= quantity_used; part.quantity_in_scrapped_lots += quantity_used"
          - "UDILabels of this lot in {DRAFT, APPROVED, PRINTED} -> VOID (void_reason LOT_SCRAPPED)"
          - "NonconformanceReports of this lot in {OPEN, CONTAINED} -> DISPOSITIONED (disposition=SCRAP, fault unchanged)"
      - from: "RELEASED (disposition)"
        to: RECALLED
        trigger: "system (FieldAction issue with lot in scope)"
        actor: system
        preconditions: []
        side_effects:
          - "UDILabels of this lot in {APPROVED, PRINTED} -> VOID (void_reason LOT_RECALLED)"
          - "recompute dmr complaint_rate_per_100k (denominator drops this lot's releasable_qty) — evaluation order: disposition mutations, then denominator, then numerator, then rate, then flag"
      - from: "CLEAR (hold)"
        to: ON_HOLD
        trigger: "POST /api/device-lots/{id}/place-hold (MANUAL) OR system cascades (NCR_OPEN | SUPPLIER_QUALITY | REVALIDATION | STERILITY_FAILURE | FIELD_ACTION)"
        actor: QualityEngineer | system
        preconditions:
          - "hold_status == CLEAR (else ERR_INVALID_STATE_TRANSITION; cascades are no-ops when already ON_HOLD)"
          - "disposition_status in {IN_PRODUCTION, COMPLETED} for manual hold (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "hold_reason set per trigger"
      - from: "ON_HOLD (hold)"
        to: CLEAR
        trigger: "POST /api/device-lots/{id}/release-hold"
        actor: QualityEngineer
        preconditions:
          - "hold_status == ON_HOLD (else ERR_INVALID_STATE_TRANSITION)"
          - "hold_reason resolution: NCR_OPEN -> no NCR on lot in {OPEN, CONTAINED}; SUPPLIER_QUALITY -> all component parts status == QUALIFIED; REVALIDATION -> lot's validation protocol status == VALIDATED; STERILITY_FAILURE -> never clearable; MANUAL -> always; FIELD_ACTION -> never clearable (else ERR_HOLD_CONDITION_UNRESOLVED)"
        side_effects:
          - "hold_reason := NONE"
    notes:
      - "sterility_result transition: PENDING -> PASSED | FAILED via POST /api/device-lots/{id}/record-sterility-result (QualityEngineer); requires disposition_status == COMPLETED and sterility_result == PENDING (else ERR_STERILITY_ALREADY_RESULTED / ERR_INVALID_STATE_TRANSITION); FAILED also sets hold_status ON_HOLD (hold_reason STERILITY_FAILURE)"

  - entity: UDILabel
    initial_state: DRAFT
    terminal_states: [VOID]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /api/udi-labels/{id}/approve"
        actor: QualityManager
        preconditions:
          - "status == DRAFT (else ERR_INVALID_STATE_TRANSITION)"
          - "no other UDILabel of same lot in {APPROVED, PRINTED} (else ERR_ACTIVE_LABEL_EXISTS)"
          - "label_revision == revision_code of the APPROVED revision of the lot's device_code family (else ERR_LABEL_REVISION_MISMATCH); if no revision is APPROVED (lot's DMR superseded/obsoleted), approve fails with ERR_DMR_NOT_APPROVED"
          - "lot.disposition_status in {IN_PRODUCTION, COMPLETED} (else ERR_INVALID_STATE_TRANSITION)"
        side_effects: []
      - from: APPROVED
        to: PRINTED
        trigger: "POST /api/udi-labels/{id}/print"
        actor: ProductionOperator
        preconditions:
          - "status == APPROVED (else ERR_INVALID_STATE_TRANSITION)"
          - "lot.disposition_status == COMPLETED (else ERR_LOT_NOT_COMPLETED)"
        side_effects:
          - "printed_at := now"
      - from: DRAFT
        to: VOID
        trigger: "POST /api/udi-labels/{id}/void OR system (lot scrapped)"
        actor: QualityManager | system
        preconditions:
          - "status in {DRAFT, APPROVED, PRINTED} (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "void_reason := MANUAL (endpoint) | LOT_SCRAPPED | LOT_RECALLED (cascades)"
      - from: APPROVED
        to: VOID
        trigger: "POST /api/udi-labels/{id}/void OR system (lot scrapped/recalled)"
        actor: QualityManager | system
        preconditions:
          - "status in {DRAFT, APPROVED, PRINTED} (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "void_reason := MANUAL | LOT_SCRAPPED | LOT_RECALLED"
      - from: PRINTED
        to: VOID
        trigger: "POST /api/udi-labels/{id}/void OR system (lot scrapped/recalled)"
        actor: QualityManager | system
        preconditions:
          - "status in {DRAFT, APPROVED, PRINTED} (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "void_reason := MANUAL | LOT_SCRAPPED | LOT_RECALLED"

  - entity: NonconformanceReport
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CONTAINED
        trigger: "POST /api/nonconformance-reports/{id}/contain"
        actor: QualityEngineer
        preconditions:
          - "status == OPEN (else ERR_INVALID_STATE_TRANSITION)"
        side_effects: []
      - from: CONTAINED
        to: DISPOSITIONED
        trigger: "POST /api/nonconformance-reports/{id}/disposition"
        actor: QualityEngineer
        preconditions:
          - "status == CONTAINED (else ERR_INVALID_STATE_TRANSITION)"
          - "if disposition == SCRAP and lot_id set: lot.disposition_status in {IN_PRODUCTION, COMPLETED} (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "sets fault + disposition from input"
          - "if fault == SUPPLIER: penalty = {MINOR:5, MAJOR:15, CRITICAL:30}[severity]; penalty_points_applied := penalty; supplier.applied_penalty_points += penalty; recompute supplier.quality_score; if quality_score < 50 and supplier QUALIFIED -> SUSPENDED (cascade: its QUALIFIED parts -> ON_HOLD; those parts hold in-flight lots SUPPLIER_QUALITY)"
          - "if fault == SUPPLIER and supplier_part_id set: part -> ON_HOLD (cascade: in-flight lots containing it -> ON_HOLD SUPPLIER_QUALITY)"
          - "if disposition == SCRAP and lot_id set: lot -> SCRAPPED (with its full side-effect set: components to scrapped bucket, labels VOID, other open NCRs auto-dispositioned)"
      - from: DISPOSITIONED
        to: CLOSED
        trigger: "POST /api/nonconformance-reports/{id}/close"
        actor: QualityManager
        preconditions:
          - "status == DISPOSITIONED (else ERR_INVALID_STATE_TRANSITION)"
          - "X-User-ID != initiator_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "if fault == SUPPLIER: penalty moves to finalized (applied_finalized_penalty_points += penalty_points_applied; recompute quality_score_finalized, risk_tier, next_audit_due_at)"
          - "if lot's hold_reason == NCR_OPEN and no other NCR of the lot in {OPEN, CONTAINED}: lot hold -> CLEAR (hold_reason NONE)"
      - from: DISPOSITIONED
        to: OPEN
        trigger: "POST /api/nonconformance-reports/{id}/reopen"
        actor: QualityEngineer
        preconditions:
          - "status == DISPOSITIONED (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "if fault == SUPPLIER: reverse penalty exactly (supplier.applied_penalty_points -= penalty_points_applied; recompute quality_score); penalty_points_applied := 0; fault := UNDETERMINED; disposition := NONE"
          - "if lot_id set and lot.disposition_status == IN_PRODUCTION: lot hold -> ON_HOLD (NCR_OPEN); COMPLETED lots are governed by the release gate ERR_OPEN_NCRS_EXIST instead"
      - from: OPEN
        to: DISPOSITIONED
        trigger: "system (parent lot scrapped)"
        actor: system
        preconditions: []
        side_effects:
          - "disposition := SCRAP (fault unchanged; no supplier penalty while fault == UNDETERMINED)"
      - from: CONTAINED
        to: DISPOSITIONED
        trigger: "system (parent lot scrapped)"
        actor: system
        preconditions: []
        side_effects:
          - "disposition := SCRAP (fault unchanged)"
    notes:
      - "creation side effect (POST /api/nonconformance-reports): if lot_id set and lot.disposition_status in {IN_PRODUCTION, COMPLETED}: lot hold -> ON_HOLD (hold_reason NCR_OPEN)"

  - entity: Complaint
    initial_state: RECEIVED
    terminal_states: [CLOSED]
    transitions:
      - from: RECEIVED
        to: UNDER_INVESTIGATION
        trigger: "POST /api/complaints/{id}/start-investigation"
        actor: RegulatoryAffairs
        preconditions:
          - "status == RECEIVED (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "investigator_user_id := X-User-ID"
      - from: UNDER_INVESTIGATION
        to: INVESTIGATED
        trigger: "POST /api/complaints/{id}/complete-investigation"
        actor: RegulatoryAffairs
        preconditions:
          - "status == UNDER_INVESTIGATION (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "confirmed := input.confirmed"
          - "recompute dmr complaint_rate_per_100k + field_action_review_required (numerator from confirmed complaints in {INVESTIGATED, CLOSED})"
          - "if confirmed and severity in {SERIOUS_INJURY, DEATH}: auto-create CAPA (status INITIATED, source_type COMPLAINT, source_complaint_id = this, dmr_id = lot.dmr_id, initiator_user_id = investigator_user_id, process_change = false)"
          - "if confirmed and severity in {SERIOUS_INJURY, DEATH}: DeviceLots of same dmr_id with disposition_status == COMPLETED and hold_status == CLEAR -> hold ON_HOLD (hold_reason FIELD_ACTION)"
      - from: INVESTIGATED
        to: UNDER_INVESTIGATION
        trigger: "POST /api/complaints/{id}/reopen"
        actor: RegulatoryAffairs
        preconditions:
          - "status == INVESTIGATED (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "confirmed := false; recompute dmr complaint_rate_per_100k + flag (numerator drops this complaint)"
      - from: INVESTIGATED
        to: CLOSED
        trigger: "POST /api/complaints/{id}/close"
        actor: RegulatoryAffairs
        preconditions:
          - "status == INVESTIGATED (else ERR_INVALID_STATE_TRANSITION)"
          - "every CAPA with source_complaint_id == this is CLOSED (else ERR_CAPA_NOT_CLOSED)"
        side_effects: []
    notes:
      - "confirmed-serious complaint cascade holds other COMPLETED lots of the same DMR with hold_reason FIELD_ACTION (investigation hold pending field-action decision)"

  - entity: CAPA
    initial_state: INITIATED
    terminal_states: [CLOSED]
    transitions:
      - from: INITIATED
        to: INVESTIGATING
        trigger: "POST /api/capas/{id}/begin-investigation"
        actor: QualityEngineer
        preconditions:
          - "status == INITIATED (else ERR_INVALID_STATE_TRANSITION)"
        side_effects: []
      - from: INVESTIGATING
        to: ACTION_PLANNED
        trigger: "POST /api/capas/{id}/plan-actions"
        actor: QualityEngineer
        preconditions:
          - "status == INVESTIGATING (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "action_summary := input.action_summary"
      - from: ACTION_PLANNED
        to: IMPLEMENTING
        trigger: "POST /api/capas/{id}/implement"
        actor: QualityEngineer
        preconditions:
          - "status == ACTION_PLANNED (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "if process_change: ValidationProtocols with dmr_id == capa.dmr_id in VALIDATED -> REVALIDATION_REQUIRED (reason CAPA_PROCESS_CHANGE); cascade: each such transition holds in-flight lots (REVALIDATION)"
      - from: IMPLEMENTING
        to: EFFECTIVENESS_CHECK
        trigger: "POST /api/capas/{id}/complete-implementation"
        actor: QualityEngineer
        preconditions:
          - "status == IMPLEMENTING (else ERR_INVALID_STATE_TRANSITION)"
        side_effects: []
      - from: EFFECTIVENESS_CHECK
        to: CLOSED
        trigger: "POST /api/capas/{id}/verify-effectiveness with effective=true"
        actor: QualityManager
        preconditions:
          - "status == EFFECTIVENESS_CHECK (else ERR_INVALID_STATE_TRANSITION)"
          - "X-User-ID != initiator_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "if source_ncr_id set: that NCR status == CLOSED (else ERR_SOURCE_NOT_CLOSED)"
        side_effects:
          - "closer_user_id := X-User-ID"
      - from: EFFECTIVENESS_CHECK
        to: INEFFECTIVE
        trigger: "POST /api/capas/{id}/verify-effectiveness with effective=false"
        actor: QualityManager
        preconditions:
          - "status == EFFECTIVENESS_CHECK (else ERR_INVALID_STATE_TRANSITION)"
          - "X-User-ID != initiator_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects: []
      - from: INEFFECTIVE
        to: INVESTIGATING
        trigger: "POST /api/capas/{id}/restart-investigation"
        actor: QualityEngineer
        preconditions:
          - "status == INEFFECTIVE (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "effectiveness_cycles += 1"

  - entity: FieldAction
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /api/field-actions/{id}/issue"
        actor: RegulatoryAffairs
        preconditions:
          - "status == DRAFT (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "issued_at := now"
          - "DeviceLots with dmr_id == fa.dmr_id, disposition_status == RELEASED, scope_mfg_start <= manufactured_at <= scope_mfg_end -> RECALLED (with per-lot label VOID cascade); recalled_lot_count := number transitioned"
      - from: ISSUED
        to: CLOSED
        trigger: "POST /api/field-actions/{id}/close"
        actor: RegulatoryAffairs
        preconditions:
          - "status == ISSUED (else ERR_INVALID_STATE_TRANSITION)"
          - "reason complaint status == CLOSED (else ERR_SOURCE_NOT_CLOSED)"
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: agreement-create-stale-supplier
    parent_entity: Supplier
    write_endpoint: "POST /api/suppliers/{supplierId}/quality-agreements"
    occ_field: expected_supplier_version
    description: |
      Creating a QualityAgreement against a Supplier whose version has advanced
      since the client last observed it is rejected. Creating an agreement
      legitimately supersedes the supplier's existing DRAFT agreements, so a
      writer holding a stale supplier version would silently supersede an
      agreement it never saw.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: revision-create-stale-dmr
    parent_entity: DeviceMasterRecord
    write_endpoint: "POST /api/device-master-records/{dmrId}/revisions"
    occ_field: expected_dmr_version
    description: |
      Creating a successor revision against a DeviceMasterRecord whose version
      has advanced since the client last observed it is rejected. Revision
      creation is only meaningful from the latest APPROVED revision, and a
      prior revision-creation or approval moves the version forward.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: lot_expiry
    trigger: "lot creation; SterileBarrierStudy PASSED (recompute for lots of that DMR in IN_PRODUCTION/COMPLETED)"
    algorithm: threshold
    formula: |
      if dmr.confirmed_shelf_life_months is null (no PASSED study):
        variant PROVISIONAL: months = min(ceil(dmr.shelf_life_claim_months * 0.5), 12); expiry_basis = PROVISIONAL
      else:
        variant FINAL: months = min(dmr.confirmed_shelf_life_months, 60); expiry_basis = FINAL
      expiry_date = manufactured_at + months (calendar-month arithmetic: same day-of-month, clamped to month end; time-of-day preserved)
    input_set: "DeviceLot being created or recomputed; its pinned DeviceMasterRecord revision"
    constants:
      PROVISIONAL_RATIO: 0.5
      PROVISIONAL_CAP_MONTHS: 12
      FINAL_CAP_MONTHS: 60
    precision: "integer months; expiry_date at second precision UTC"
    variants:
      - name: provisional
        when: "no SterileBarrierStudy PASSED for the lot's DMR"
        difference: "months = min(ceil(claim * 0.5), 12) — deliberately conservative half-claim capped at 12"
      - name: final
        when: "a SterileBarrierStudy for the lot's DMR is PASSED"
        difference: "months = min(confirmed_shelf_life_months, 60) — full confirmed claim"

  - name: supplier_quality_score
    trigger: "NCR disposition (fault=SUPPLIER), NCR reopen, NCR close, SupplierAudit completion, SupplierAudit cancellation (no-op)"
    algorithm: weighted_scoring
    formula: |
      ncr_penalties(supplier, statuses) = sum over NonconformanceReport where fault == SUPPLIER
          and status in statuses and (supplier_part_id belongs to supplier OR lot's components contain a part of supplier):
          SEVERITY_PENALTY[ncr.severity]
      audit_penalties(supplier) = sum over SupplierAudit where supplier_id == supplier and status == COMPLETED:
          findings_count*2 + major_findings_count*8
      applied_penalty_points          = ncr_penalties({DISPOSITIONED, CLOSED}) + audit_penalties
      applied_finalized_penalty_points = ncr_penalties({CLOSED}) + audit_penalties
      quality_score           = max(0, 100 - applied_penalty_points)
      quality_score_finalized = max(0, 100 - applied_finalized_penalty_points)
      risk_tier = LOW if quality_score_finalized >= 90 else MEDIUM if >= 70 else HIGH
      if quality_score < 50 and supplier.status == QUALIFIED: supplier -> SUSPENDED (auto, with cascade)
    input_set: "NCRs of the supplier (via supplier_part_id directly, or via lot genealogy when only lot_id set) in the given statuses; COMPLETED audits of the supplier"
    constants:
      SEVERITY_PENALTY: { MINOR: 5, MAJOR: 15, CRITICAL: 30 }
      AUDIT_FINDING_PENALTY: 2
      AUDIT_MAJOR_FINDING_PENALTY: 8
      AUTO_SUSPEND_BELOW: 50
      TIER_LOW_MIN: 90
      TIER_MEDIUM_MIN: 70
    precision: "1 decimal place, round_half_up (all penalty terms are integers, so scores are integers)"
    variants:
      - name: current
        when: "auto-suspend decision and default supplier view"
        difference: "counts NCR penalties while NCR in DISPOSITIONED (provisional) or CLOSED"
      - name: finalized
        when: "risk_tier / audit-interval derivation"
        difference: "counts NCR penalties only once the NCR is CLOSED; DISPOSITIONED-not-closed penalties excluded"

  - name: sterile_sample_qty
    trigger: "lot completion (POST /api/device-lots/{id}/complete)"
    algorithm: tiered_pricing
    formula: |
      prior_released = count of DeviceLot with validation_protocol_id == lot.validation_protocol_id
                       and disposition_status in {RELEASED, RECALLED}
      if prior_released < MATURITY_MIN_LOTS: sample_qty = quantity            # process-maturity 100% inspection
      else:
        base = tier(quantity): <=25 -> quantity | 26..150 -> 20 | 151..1200 -> 32 | 1201..10000 -> 80 | >10000 -> 125
        if any LotComponent of the lot references a SupplierPart with critical == true: base = ceil(base * 1.5)
        sample_qty = min(quantity, base)
      releasable_qty = quantity - sample_qty
    input_set: "the completing lot, its LotComponents (for criticality), sibling lots under the same validation protocol"
    constants:
      MATURITY_MIN_LOTS: 3
      CRITICAL_MULTIPLIER: 1.5
    precision: "integer units; ceil applied once after the 1.5 multiplier; no intermediate rounding"

  - name: complaint_rate_per_100k
    trigger: "complaint complete-investigation (confirmed=true), complaint reopen, lot release, lot recall"
    algorithm: constraint_propagation
    formula: |
      Evaluation order is pinned (feedback loop: recall shrinks denominator, which can re-cross the threshold):
        1. apply all entity mutations of the triggering action (complaint confirmation set, or lot dispositions flipped)
        2. denominator = sum of releasable_qty over DeviceLot with dmr_id == D and disposition_status == RELEASED
        3. numerator = count of Complaint with lot.dmr_id == D and confirmed == true and status in {INVESTIGATED, CLOSED}
        4. rate = denominator == 0 ? 0 : round_half_up(numerator / denominator * 100000, 4)
        5. dmr.complaint_rate_per_100k := rate; dmr.field_action_review_required := (rate >= FLAG_THRESHOLD)
    input_set: "RELEASED lots of the DMR (denominator); confirmed complaints in {INVESTIGATED, CLOSED} whose lot belongs to the DMR (numerator)"
    constants:
      FLAG_THRESHOLD: 5.0
    precision: "4 decimal places, round_half_up"

  - name: audit_due_schedule
    trigger: "SupplierAudit completion; supplier risk_tier change; supplier creation"
    algorithm: forward_looking
    formula: |
      interval_months = { LOW: 24, MEDIUM: 12, HIGH: 6 }[supplier.risk_tier]
      if supplier.last_audit_completed_at is null: next_audit_due_at = supplier.created_at + 12 months
      else: next_audit_due_at = last_audit_completed_at + interval_months
      is_audit_overdue = (next_audit_due_at <= now) and supplier.status != DISQUALIFIED
    input_set: "the supplier, its latest COMPLETED audit, current risk_tier"
    constants:
      INTERVAL_LOW_MONTHS: 24
      INTERVAL_MEDIUM_MONTHS: 12
      INTERVAL_HIGH_MONTHS: 6
      INITIAL_INTERVAL_MONTHS: 12
    precision: "calendar-month arithmetic; datetime comparison at second precision (<= is inclusive: due exactly at now is overdue)"

  - name: udi_check_digit
    trigger: "UDILabel creation (POST /api/device-lots/{lotId}/udi-labels)"
    algorithm: weighted_scoring
    formula: |
      udi_di must be exactly 14 digits. Over the first 13 digits d1..d13:
        s = sum(d_i * (3 if (13 - i) is odd else 1))   # weights 3,1 alternating counting from the right
        expected_check = (10 - (s mod 10)) mod 10
      digit 14 must equal expected_check, else ERR_UDI_CHECK_DIGIT_MISMATCH
      udi_pi = 'LOT-' + lot.lot_number + '-EXP-' + format(lot.expiry_date, 'YYYYMMDD')
    input_set: "the udi_di string in the request"
    constants:
      UDI_DI_LENGTH: 14
    precision: "integer mod-10 arithmetic"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; role is one of the declared roles"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all
  - priority: 2
    category: auth
    check: "Role is permitted for this endpoint per §1.5 roles"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all
  - priority: 3
    category: business_constraint
    check: "Request body shape: required fields present, types match, enum values valid, integer ranges (> 0 / >= 0) respected, datetime strings parse, scope_mfg_start < scope_mfg_end, scheduled_start < scheduled_end, planned_start < planned_end; UDILabel create additionally enforces the GS1 check digit on udi_di (ERR_UDI_CHECK_DIGIT_MISMATCH, also 400, same priority)"
    error_id: "ERR_VALIDATION | ERR_UDI_CHECK_DIGIT_MISMATCH"
    http_status: 400
    applies_to: all
  - priority: 4
    category: existence
    check: "Path ids exist (left-to-right); body-referenced FK ids (dmr_id, line_id, supplier_part_id, lot_id, validation_protocol_id, source_complaint_id, source_ncr_id, reason_complaint_id) exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all resource endpoints
  - priority: 5
    category: business_constraint
    check: "OCC: expected_<parent>_version equals current parent version (only on the two concurrency-rule endpoints)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /api/suppliers/{id}/quality-agreements; POST /api/device-master-records/{id}/revisions"
  - priority: 6
    category: auth
    check: "Segregation of duties: DMR approver != author; phase approver != that phase's executor; NCR closer != NCR initiator; CAPA verifier != CAPA initiator"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST .../approve (dmr), POST .../approve-phase, POST .../nonconformance-reports/{id}/close, POST .../capas/{id}/verify-effectiveness"
  - priority: 7
    category: state
    check: "State-machine shape: the trigger is a declared transition from the entity's current state"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: all action endpoints
  - priority: 8
    category: state
    check: "Named state preconditions: lot hold CLEAR for release (ERR_LOT_ON_HOLD), sterility not already resulted (ERR_STERILITY_ALREADY_RESULTED), lot COMPLETED for label print (ERR_LOT_NOT_COMPLETED), hold resolution conditions (ERR_HOLD_CONDITION_UNRESOLVED)"
    error_id: "ERR_LOT_ON_HOLD | ERR_STERILITY_ALREADY_RESULTED | ERR_LOT_NOT_COMPLETED | ERR_HOLD_CONDITION_UNRESOLVED"
    http_status: 409
    applies_to: "lot release-hold/release/scrap, record-sterility-result, label print"
  - priority: 9
    category: business_safety
    check: "Release safety gates: sterility PASSED for sterile DMRs (ERR_STERILITY_NOT_PASSED), protocol VALIDATED (ERR_PROTOCOL_NOT_VALIDATED), no OPEN/CONTAINED NCRs (ERR_OPEN_NCRS_EXIST), printed label with matching revision (ERR_NO_PRINTED_LABEL), DMR APPROVED (ERR_DMR_NOT_APPROVED); complaint intake requires lot RELEASED/RECALLED (ERR_LOT_NOT_RELEASED)"
    error_id: "ERR_STERILITY_NOT_PASSED | ERR_PROTOCOL_NOT_VALIDATED | ERR_OPEN_NCRS_EXIST | ERR_NO_PRINTED_LABEL | ERR_DMR_NOT_APPROVED | ERR_LOT_NOT_RELEASED"
    http_status: 409
    applies_to: "POST .../device-lots/{id}/release; POST /api/complaints; POST .../validation-protocols/{id}/execute-phase"
  - priority: 10
    category: business_temporal
    check: "Temporal windows: agreement effective_from <= now < effective_to (ERR_AGREEMENT_NOT_IN_EFFECT); SCN proposed_effective_date - now >= change_notice_days of the ACTIVE agreement (ERR_CHANGE_NOTICE_WINDOW_BREACHED); audit window does not overlap another SCHEDULED audit of the supplier (half-open; ERR_AUDIT_WINDOW_OVERLAP); audit start respects audit_notice_days of ACTIVE agreement (ERR_AUDIT_NOTICE_WINDOW_BREACHED); protocol window does not violate line changeover buffer vs other occupying protocols (ERR_LINE_WINDOW_CONFLICT)"
    error_id: "ERR_AGREEMENT_NOT_IN_EFFECT | ERR_CHANGE_NOTICE_WINDOW_BREACHED | ERR_AUDIT_WINDOW_OVERLAP | ERR_AUDIT_NOTICE_WINDOW_BREACHED | ERR_LINE_WINDOW_CONFLICT"
    http_status: 409
    applies_to: "agreement activate; SCN create; audit create; protocol create"
  - priority: 11
    category: business_referential
    check: "Cross-reference coherence: SCN supplier_part_id belongs to path supplier (ERR_PART_NOT_OF_SUPPLIER); lot's validation_protocol_id references a protocol whose dmr_id == lot.dmr_id (ERR_PROTOCOL_DMR_MISMATCH); label approve: label_revision must equal the revision_code of the currently APPROVED revision of the lot's device_code family (ERR_LABEL_REVISION_MISMATCH); CAPA source linkage matches source_type (COMPLAINT requires source_complaint_id, NCR requires source_ncr_id; AUDIT/MANUAL require neither) and, for COMPLAINT, the complaint lot's dmr_id == capa.dmr_id (ERR_SOURCE_MISMATCH); field-action reason complaint confirmed SERIOUS_INJURY/DEATH and complaint lot's dmr == fa.dmr_id (ERR_COMPLAINT_NOT_ACTIONABLE); protocol dmr APPROVED at creation (ERR_DMR_NOT_APPROVED)"
    error_id: "ERR_PART_NOT_OF_SUPPLIER | ERR_PROTOCOL_DMR_MISMATCH | ERR_LABEL_REVISION_MISMATCH | ERR_SOURCE_MISMATCH | ERR_COMPLAINT_NOT_ACTIONABLE | ERR_DMR_NOT_APPROVED"
    http_status: 422
    applies_to: "SCN create; lot create; label approve; CAPA create; field-action create; protocol create"
  - priority: 12
    category: business_constraint
    check: "Uniqueness + capacity: (device_code, revision_code) unique (ERR_DUPLICATE_DMR_REVISION); supplier_code/line_code/agreement_code/protocol_code/lot_number-per-dmr/ncr_code/complaint_code/capa_code/action_code unique (ERR_DUPLICATE_CODE); (lot_id, supplier_part_id, supplier_lot_number) unique (ERR_DUPLICATE_COMPONENT_LOT); one IN_PROGRESS study per DMR (ERR_STUDY_ALREADY_ACTIVE); one {APPROVED, PRINTED} label per lot (ERR_ACTIVE_LABEL_EXISTS); part quantity_remaining >= quantity_used (ERR_INSUFFICIENT_PART_QUANTITY); lot create requires quantity > 0; supplier DISQUALIFIED blocks agreement activation (ERR_SUPPLIER_DISQUALIFIED); part/supplier state for component commit (ERR_PART_NOT_QUALIFIED); NCR requires at least one of lot_id/supplier_part_id (ERR_VALIDATION at priority 3)"
    error_id: "ERR_DUPLICATE_DMR_REVISION | ERR_DUPLICATE_CODE | ERR_DUPLICATE_COMPONENT_LOT | ERR_STUDY_ALREADY_ACTIVE | ERR_ACTIVE_LABEL_EXISTS | ERR_INSUFFICIENT_PART_QUANTITY | ERR_SUPPLIER_DISQUALIFIED | ERR_PART_NOT_QUALIFIED"
    http_status: 409
    applies_to: "create endpoints; label approve; component create; part reinstate"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- DeviceMasterRecord ---
  - method: POST
    path: "/api/device-master-records"
    description: "Create first revision of a Device Master Record (status DRAFT)"
    roles: [QualityEngineer]
    code: 201
    input: [device_code, revision_code, sterile, shelf_life_claim_months]
    output: DeviceMasterRecord
    side_effects: ["status=DRAFT", "author_user_id=X-User-ID", "revision_seq=1"]

  - method: GET
    path: "/api/device-master-records"
    description: "List DMRs with optional filters"
    roles: [QualityEngineer, QualityManager, ProductionOperator, SupplierQualityEngineer, RegulatoryAffairs, QMSAdmin]
    code: 200
    input: ["device_code?", "status?", "parent_dmr_id?", "limit?", "offset?"]
    output: "DeviceMasterRecord[]"
    side_effects: []

  - method: GET
    path: "/api/device-master-records/{id}"
    description: "Get one DMR (includes computed complaint_rate_per_100k, field_action_review_required)"
    roles: [QualityEngineer, QualityManager, ProductionOperator, SupplierQualityEngineer, RegulatoryAffairs, QMSAdmin]
    code: 200
    input: []
    output: DeviceMasterRecord
    side_effects: []

  - method: POST
    path: "/api/device-master-records/{id}/approve"
    description: "Approve a DRAFT DMR; supersedes other APPROVED revision of same device_code"
    roles: [QualityManager]
    code: 200
    input: []
    output: DeviceMasterRecord
    side_effects: ["status APPROVED; prior APPROVED revision -> SUPERSEDED; its IN_PROGRESS studies -> INVALIDATED"]

  - method: POST
    path: "/api/device-master-records/{id}/obsolete"
    description: "Obsolete an APPROVED/SUPERSEDED DMR (guarded by in-flight lots/protocols)"
    roles: [QualityManager]
    code: 200
    input: []
    output: DeviceMasterRecord
    side_effects: ["status OBSOLETE; IN_PROGRESS studies -> INVALIDATED"]

  - method: POST
    path: "/api/device-master-records/{id}/revisions"
    description: "Create successor revision (DRAFT) of an APPROVED DMR; OCC-guarded on DMR version"
    roles: [QualityEngineer]
    code: 201
    input: [revision_code, shelf_life_claim_months, sterile, expected_dmr_version]
    output: DeviceMasterRecord
    side_effects: ["new DMR: device_code inherited, revision_seq+1, parent_dmr_id=path id, status DRAFT", "increments DeviceMasterRecord (path id).version by 1"]

  # --- ManufacturingLine ---
  - method: POST
    path: "/api/manufacturing-lines"
    description: "Register a manufacturing line"
    roles: [QMSAdmin]
    code: 201
    input: [line_code, "description?", "changeover_buffer_hours?"]
    output: ManufacturingLine
    side_effects: []

  - method: GET
    path: "/api/manufacturing-lines"
    description: "List manufacturing lines"
    roles: [QualityEngineer, QualityManager, ProductionOperator, SupplierQualityEngineer, RegulatoryAffairs, QMSAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "ManufacturingLine[]"
    side_effects: []

  - method: GET
    path: "/api/manufacturing-lines/{id}"
    description: "Get one manufacturing line"
    roles: [QualityEngineer, QualityManager, ProductionOperator, SupplierQualityEngineer, RegulatoryAffairs, QMSAdmin]
    code: 200
    input: []
    output: ManufacturingLine
    side_effects: []

  # --- Supplier ---
  - method: POST
    path: "/api/suppliers"
    description: "Register a supplier (status PENDING_QUALIFICATION, score 100)"
    roles: [SupplierQualityEngineer]
    code: 201
    input: [supplier_code, name]
    output: Supplier
    side_effects: ["quality_score=100", "next_audit_due_at=created_at+12mo"]

  - method: GET
    path: "/api/suppliers"
    description: "List suppliers with optional status filter"
    roles: [QualityEngineer, QualityManager, ProductionOperator, SupplierQualityEngineer, RegulatoryAffairs, QMSAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Supplier[]"
    side_effects: []

  - method: GET
    path: "/api/suppliers/{id}"
    description: "Get one supplier (score, tier, audit due fields)"
    roles: [QualityEngineer, QualityManager, ProductionOperator, SupplierQualityEngineer, RegulatoryAffairs, QMSAdmin]
    code: 200
    input: []
    output: Supplier
    side_effects: []

  - method: POST
    path: "/api/suppliers/{id}/qualify"
    description: "Qualify a supplier (requires ACTIVE quality agreement)"
    roles: [SupplierQualityEngineer]
    code: 200
    input: []
    output: Supplier
    side_effects: ["status QUALIFIED"]

  - method: POST
    path: "/api/suppliers/{id}/suspend"
    description: "Suspend a QUALIFIED supplier (cascades parts ON_HOLD, lots ON_HOLD)"
    roles: [SupplierQualityEngineer]
    code: 200
    input: []
    output: Supplier
    side_effects: ["status SUSPENDED", "parts QUALIFIED -> ON_HOLD", "in-flight lots with those parts -> ON_HOLD (SUPPLIER_QUALITY)"]

  - method: POST
