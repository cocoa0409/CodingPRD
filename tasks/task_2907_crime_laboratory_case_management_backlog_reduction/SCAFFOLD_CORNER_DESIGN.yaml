            - "Case C1 (OTHER -> P3_ROUTINE) ACCEPTED with BIOLOGICAL item E1 and CHEMICAL item E2. R1 = (E1, M_BIO, 1) is assigned to A1; R2 = (E2, M_CHEM, 1) stays QUEUED."
            - "Hand-executed for the late CHEMISTRY analyst A2: available round_half_up(20.00 - 4.00, 2) == 16.00 and post_assignment_pct round_half_up(3.00 / 16.00 * 100, 2) == 18.75."
