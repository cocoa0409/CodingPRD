          - response_envelope.pagination_defaults
        distinguishing_aspect: "limit below the minimum of 1, limit above the maximum of 100 and a negative offset each return ERR_INVALID_PAGINATION (400) rather than a clamped page, while limit=2 over three assets pages correctly and the default limit of 10 returns all three."
        test_recipe:
          setup:
