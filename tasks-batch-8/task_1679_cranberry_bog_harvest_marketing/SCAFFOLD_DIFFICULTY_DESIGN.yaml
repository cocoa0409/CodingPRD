            - call: "POST /coop/harvest-tickets"
              payload: { bog_id: "${b1}", season_id: "${s1}", method: "DRY", window_start: "2026-10-01T00:00:00Z", window_end: "2026-10-05T00:00:00Z" }
              as: GrowerMember
              as_user_id: "${m1}"
              captures: { t1: "$.data.id" }
