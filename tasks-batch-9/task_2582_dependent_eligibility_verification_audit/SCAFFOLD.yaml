scenario: |
  Generate task harder than expert level!

  2582. Dependent Eligibility Verification Audit (employee benefits audit program): audit scope
  decision across full census, targeted or new-dependent verification with communication planning,
  documentation requirements by relationship type with acceptable proof lists and privacy handling,
  amnesty period allowing voluntary removal without penalty, response tracking with reminder cadence
  and escalation to termination of coverage, appeal review for documentation exceptions such as
  domestic partnerships and custody arrangements, coverage termination effective dates with
  continuation coverage rights, claims recovery for ineligible dependents already paid, savings
  measurement and ongoing point-of-enrollment verification design

domain_name: dependent-eligibility-verification-audit
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - ops_run_checkpoint          # POST /audit-programs/{id}/run-sweep advances the audit epoch
    - cascading_side_effects      # escalation and appeal-grant compensation chains span 4 entities
    - dual_variant_calculation    # savings PROVISIONAL vs AUDITED; recovery STRICT vs EQUITABLE
    - optimistic_concurrency      # OCC on AuditProgram.version and Dependent.version
    - scheduled_deferred_actions  # amnesty end, response deadline, notice effective date, POE grace

  entity_topology: flat
  # Every entity is a top-level collection linked by explicit FK fields; no business identity is
  # carried in URL nesting. Sub-resource GETs exist only as reverse-reachability read paths.

  state_machine_shape: cyclic
  # AuditCase cycles ESCALATED -> IN_PROGRESS on a granted appeal; Appeal cycles
  # REMANDED -> SUBMITTED; ProofSubmission carries two independent state dimensions
  # (review_status x privacy_status); AuditProgram is compound (phase advanced by the sweep from
  # aggregate case state).

  relationship_patterns:
    - one_to_many        # Employee -> Dependent, AuditProgram -> AuditCase, AuditCase -> ProofSubmission
    - cross_aggregate    # ClaimRecovery -> TerminationNotice -> Dependent spans three aggregates
    - polymorphic        # TerminationNotice.origin AUDIT_ESCALATION (case_id set) vs POE_LAPSE (case_id null)

  role_model: segregation_of_duties
  # The X-User-ID that reviewed any ProofSubmission for a dependent may not review that
  # dependent's Appeal; the assigned AppealReviewer is the only user who may decide it.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: AuditProgram
    parent: null
    common_fields: true
    fields:
      - name: program_name
        type: string
        source: input
        description: Human label for the audit wave.
        constraints: "1-120 chars; (plan_year, program_name) unique -> ERR_DUPLICATE_PROGRAM"
      - name: plan_year
        type: integer
        source: input
        description: Benefit plan year the audit covers; savings proration runs to Dec 31 of this year.
        constraints: "2020-2100"
      - name: scope_type
        type: enum
        source: system
        description: Scope decision recorded by POST /audit-programs/{id}/scope; null while DRAFT.
        default: null
        constraints: "FULL_CENSUS | TARGETED | NEW_DEPENDENT_ONLY"
      - name: status
        type: enum
        source: system
        description: Program phase; see state_machines.AuditProgram.
        default: DRAFT
        constraints: "DRAFT | SCOPED | AMNESTY_OPEN | RESPONSE_WINDOW | ESCALATION | RECONCILIATION | CLOSED"
      - name: amnesty_days
        type: integer
        source: input
        description: Length of the penalty-free voluntary-removal window measured from announcement_at.
        default: 21
        constraints: "0-90"
      - name: response_days
        type: integer
        source: input
        description: Length of the documentation response window measured from announcement_at.
        default: 45
        constraints: "7-180"
      - name: reminder_min_gap_days
        type: integer
        source: input
        description: Minimum whole-day gap between consecutive reminder communications on one case.
        default: 7
        constraints: "1-60"
      - name: max_reminders
        type: integer
        source: input
        description: Maximum REMINDER CommunicationEvents allowed per AuditCase.
        default: 3
        constraints: "1-10"
      - name: poe_verification_enabled
        type: boolean
        source: input
        description: When true this program supplies point-of-enrollment rules to new dependent adds.
        default: true
      - name: announcement_at
        type: datetime
        source: system
        description: Logical-clock instant at which POST /audit-programs/{id}/communicate ran; null before.
        default: null
      - name: amnesty_end_at
        type: datetime
        source: computed
        description: "announcement_at + amnesty_days days; null before communicate."
        default: null
      - name: response_deadline_at
        type: datetime
        source: computed
        description: "announcement_at + response_days days; null before communicate."
        default: null
      - name: sweep_epoch
        type: integer
        source: system
        description: Increments by 1 on every POST /audit-programs/{id}/run-sweep that mutates anything.
        default: 0
      - name: in_scope_case_count
        type: integer
        source: computed
        description: Count of AuditCase rows for this program with status != VOIDED.
        default: 0
      - name: in_scope_dependent_count
        type: integer
        source: computed
        description: Total length of AuditCase.in_scope_dependent_ids across non-VOIDED cases.
        default: 0
      - name: pending_dependent_count
        type: integer
        source: computed
        description: In-scope dependents with coverage_status == PENDING_VERIFICATION.
        default: 0
      - name: verified_dependent_count
        type: integer
        source: computed
        description: In-scope dependents with coverage_status IN {VERIFIED, REINSTATED}.
        default: 0
      - name: amnesty_removed_count
        type: integer
        source: computed
        description: In-scope dependents with coverage_status == AMNESTY_REMOVED.
        default: 0
      - name: termination_pending_count
        type: integer
        source: computed
        description: In-scope dependents with coverage_status == TERMINATION_PENDING.
        default: 0
      - name: terminated_dependent_count
        type: integer
        source: computed
        description: In-scope dependents with coverage_status == TERMINATED.
        default: 0
      - name: responded_case_count
        type: integer
        source: computed
        description: Cases with status IN {IN_PROGRESS, COMPLETE, CLOSED} that hold at least one ProofSubmission or AmnestyRemoval.
        default: 0
      - name: non_responsive_case_count
        type: integer
        source: computed
        description: Cases with status IN {NON_RESPONSIVE, ESCALATED}.
        default: 0
      - name: provisional_annual_savings_cents
        type: integer
        source: computed
        description: Output of calculations.savings_measurement variant PROVISIONAL.
        default: 0
      - name: audited_annual_savings_cents
        type: integer
        source: computed
        description: Output of calculations.savings_measurement variant AUDITED.
        default: 0
      - name: last_savings_variant
        type: enum
        source: system
        description: Variant of the most recent POST /audit-programs/{id}/measure-savings call.
        default: null
        constraints: "PROVISIONAL | AUDITED"
      - name: recovery_ledger_cents
        type: integer
        source: computed
        description: "Sum of ClaimRecovery.net_demand_cents over recoveries of this program's in-scope dependents whose status IN {DEMAND_ISSUED, PARTIALLY_RECOVERED, RECOVERED}."
        default: 0
      - name: recovered_total_cents
        type: integer
        source: computed
        description: "Sum of ClaimRecovery.recovered_cents over the same dependents whose status != VOIDED."
        default: 0
      - name: refund_due_total_cents
        type: integer
        source: computed
        description: "Sum of ClaimRecovery.refund_due_cents over the same dependents (non-zero only on VOIDED rows)."
        default: 0

  - name: Employee
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Subscriber name.
      - name: work_email
        type: string
        source: input
        description: Notification address; unique across employees -> ERR_INVALID_REQUEST on duplicate.
      - name: coverage_tier
        type: enum
        source: input
        description: Enrollment tier held by the subscriber.
        constraints: "EMPLOYEE_ONLY | EMPLOYEE_SPOUSE | EMPLOYEE_CHILDREN | FAMILY"
      - name: employer_monthly_premium_cents
        type: integer
        source: input
        description: Employer's total monthly cost for the subscriber's tier (reported, not used in savings math).
        constraints: ">= 0"
      - name: hire_date
        type: string
        source: input
        description: ISO 8601 date (YYYY-MM-DD) of hire.
      - name: enrolled_dependent_count
        type: integer
        source: computed
        description: Count of this employee's Dependent rows with coverage_status == ENROLLED.
        default: 0

  - name: Dependent
    parent: null
    common_fields: true
    fields:
      - name: employee_id
        type: string
        source: input
        description: FK -> Employee.id; the subscriber this dependent is enrolled under.
      - name: relationship_type
        type: enum
        source: input
        description: Relationship class driving the documentation requirement set.
        constraints: "SPOUSE | DOMESTIC_PARTNER | CHILD_BIOLOGICAL | STEPCHILD | ADOPTED_CHILD | DISABLED_ADULT_CHILD | LEGAL_GUARDIANSHIP"
      - name: full_name
        type: string
        source: input
        description: Dependent name.
      - name: date_of_birth
        type: string
        source: input
        description: ISO 8601 date (YYYY-MM-DD).
      - name: enrolled_at
        type: string
        source: system
        description: ISO 8601 date (YYYY-MM-DD) the dependent was added to coverage; set to the date part of the logical clock at creation and never accepted from the request; drives NEW_DEPENDENT_ONLY scope.
      - name: coverage_status
        type: enum
        source: system
        description: Eligibility lifecycle; see state_machines.Dependent.
        default: ENROLLED
        constraints: "ENROLLED | PENDING_VERIFICATION | VERIFIED | AMNESTY_REMOVED | TERMINATION_PENDING | TERMINATED | REINSTATED"
      - name: coverage_end_date
        type: string
        source: system
        description: ISO date on which coverage ends; set on AMNESTY_REMOVED and TERMINATED, cleared on REINSTATED.
        default: null
      - name: poe_program_id
        type: string
        source: system
        description: "FK -> AuditProgram.id; the point-of-enrollment program whose rule gated this add (null when the dependent enrolled without POE gating)."
        default: null
      - name: poe_deadline_at
        type: datetime
        source: computed
        description: "created-at clock instant + DocumentationRule.grace_days days for the POINT_OF_ENROLLMENT rule; null when poe_program_id is null."
        default: null
      - name: monthly_cost_cents
        type: integer
        source: computed
        description: "constants.RELATIONSHIP_MONTHLY_COST_CENTS[relationship_type]; the per-dependent employer cost used by every savings and continuation calculation."
      - name: accepted_proof_type_count
        type: integer
        source: computed
        description: Count of DISTINCT ProofSubmission.proof_type values for this dependent with review_status == ACCEPTED.
        default: 0
      - name: documentation_complete
        type: boolean
        source: computed
        description: Output of calculations.documentation_completeness for this dependent.
        default: false
      - name: recovery_revision
        type: integer
        source: system
        description: Increments by 1 each time a ClaimRecovery is created against this dependent (drives OCC on POST /claim-recoveries).
        default: 0
      - name: paid_claims_total_cents
        type: integer
        source: computed
        description: Sum of PaidClaimLine.paid_cents for this dependent.
        default: 0
      - name: reinstated_at
        type: datetime
        source: system
        description: Clock instant at which a granted appeal restored coverage after TERMINATED.
        default: null

  - name: DocumentationRule
    parent: null
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: FK -> AuditProgram.id; the program whose documentation policy this row belongs to.
      - name: relationship_type
        type: enum
        source: input
        description: Relationship class this rule governs.
        constraints: "SPOUSE | DOMESTIC_PARTNER | CHILD_BIOLOGICAL | STEPCHILD | ADOPTED_CHILD | DISABLED_ADULT_CHILD | LEGAL_GUARDIANSHIP"
      - name: phase
        type: enum
        source: input
        description: AUDIT rules govern the verification audit; POINT_OF_ENROLLMENT rules govern new dependent adds.
        constraints: "AUDIT | POINT_OF_ENROLLMENT; (program_id, relationship_type, phase) unique -> ERR_DOCUMENTATION_RULE_CONFLICT"
      - name: acceptable_proof_types
        type: array
        source: input
        description: Allowed ProofSubmission.proof_type values for this relationship/phase.
        constraints: "non-empty; members of MARRIAGE_CERTIFICATE | JOINT_TAX_RETURN | JOINT_ACCOUNT_STATEMENT | DOMESTIC_PARTNER_AFFIDAVIT | SHARED_RESIDENCE_PROOF | BIRTH_CERTIFICATE | ADOPTION_DECREE | COURT_ORDER | DISABILITY_CERTIFICATION | TAX_DEPENDENCY_PROOF"
      - name: min_accepted_documents
        type: integer
        source: input
        description: Number of DISTINCT accepted proof types required before the dependent is VERIFIED.
        constraints: "1-5"
      - name: affidavit_allowed
        type: boolean
        source: input
        description: When true, a DOMESTIC_PARTNERSHIP_AFFIDAVIT appeal ground is supported for this relationship.
        default: false
      - name: requires_recency_days
        type: integer
        source: input
        description: Maximum age in days (relative to program.announcement_at date) of a proof whose type is in constants.RECENCY_SCOPED_PROOF_TYPES.
        default: 365
        constraints: "30-1095"
      - name: grace_days
        type: integer
        source: input
        description: POINT_OF_ENROLLMENT only - days from the dependent add during which proof may be supplied.
        default: null
        constraints: "required and 1-180 when phase == POINT_OF_ENROLLMENT; must be null when phase == AUDIT"
      - name: auto_terminate_on_lapse
        type: boolean
        source: input
        description: POINT_OF_ENROLLMENT only - when true the sweep terminates a dependent whose grace lapsed incomplete.
        default: false

  - name: AuditCase
    parent: null
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: system
        description: FK -> AuditProgram.id; created by the scope run.
      - name: employee_id
        type: string
        source: system
        description: FK -> Employee.id; the subscriber who must respond.
      - name: status
        type: enum
        source: system
        description: Response-tracking lifecycle; see state_machines.AuditCase.
        default: SELECTED
        constraints: "SELECTED | NOTIFIED | IN_PROGRESS | COMPLETE | NON_RESPONSIVE | ESCALATED | CLOSED | VOIDED"
      - name: in_scope_dependent_ids
        type: array
        source: system
        description: Frozen list of Dependent.id values pulled into scope by the scope run; the authoritative in-scope set for this case.
      - name: in_scope_dependent_count
        type: integer
        source: computed
        description: Length of in_scope_dependent_ids.
        default: 0
      - name: unverified_dependent_count
        type: integer
        source: computed
        description: Members of in_scope_dependent_ids whose coverage_status IN {PENDING_VERIFICATION, TERMINATION_PENDING}.
        default: 0
      - name: proof_submission_count
        type: integer
        source: computed
        description: Count of ProofSubmission rows with case_id == this case.
        default: 0
      - name: reminders_sent_count
        type: integer
        source: computed
        description: Count of CommunicationEvent rows for this case with kind == REMINDER.
        default: 0
      - name: priority_score
        type: integer
        source: computed
        description: Output of calculations.case_escalation_priority_score; recomputed on every case mutation and at the start of sweep step S2.
        default: 0
      - name: notified_at
        type: datetime
        source: system
        description: Clock instant of the ANNOUNCEMENT CommunicationEvent for this case.
        default: null
      - name: last_reminder_at
        type: datetime
        source: system
        description: sent_at of the most recent REMINDER CommunicationEvent for this case.
        default: null
      - name: communication_sequence_no
        type: integer
        source: system
        description: Highest sequence_no issued to a CommunicationEvent of this case.
        default: 0
      - name: non_responsive_at
        type: datetime
        source: system
        description: Clock instant at which the sweep marked the case NON_RESPONSIVE.
        default: null
      - name: escalated_at
        type: datetime
        source: system
        description: Clock instant at which termination notices were issued for this case.
        default: null
      - name: completed_at
        type: datetime
        source: system
        description: Clock instant at which the last in-scope dependent reached a resolved status.
        default: null

  - name: ProofSubmission
    parent: null
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: FK -> AuditCase.id; the case this document answers.
      - name: dependent_id
        type: string
        source: input
        description: FK -> Dependent.id; must be a member of AuditCase.in_scope_dependent_ids.
      - name: proof_type
        type: enum
        source: input
        description: Document class offered as proof.
        constraints: "MARRIAGE_CERTIFICATE | JOINT_TAX_RETURN | JOINT_ACCOUNT_STATEMENT | DOMESTIC_PARTNER_AFFIDAVIT | SHARED_RESIDENCE_PROOF | BIRTH_CERTIFICATE | ADOPTION_DECREE | COURT_ORDER | DISABILITY_CERTIFICATION | TAX_DEPENDENCY_PROOF"
      - name: document_reference
        type: string
        source: input
        description: Opaque handle of the uploaded document image.
      - name: document_date
        type: string
        source: input
        description: ISO 8601 date printed on the document; drives the recency check.
      - name: redaction_applied
        type: boolean
        source: input
        description: Submitter's assertion that identifiers were masked before upload.
      - name: review_status
        type: enum
        source: system
        description: Review dimension; evolves independently of privacy_status.
        default: SUBMITTED
        constraints: "SUBMITTED | UNDER_REVIEW | ACCEPTED | REJECTED"
      - name: privacy_status
        type: enum
        source: system
        description: Privacy dimension; evolves independently of review_status.
        default: null
        constraints: "NOT_REQUIRED | REDACTED | REDACTION_REQUIRED | PURGED"
      - name: privacy_class
        type: enum
        source: computed
        description: "SENSITIVE when proof_type IN constants.SENSITIVE_PROOF_TYPES, else STANDARD."
        constraints: "STANDARD | SENSITIVE"
      - name: reviewed_by_user_id
        type: string
        source: system
        description: X-User-ID of the VerificationAnalyst who last decided this submission; feeds the segregation-of-duties check on appeal assignment.
        default: null
      - name: decision_reason_code
        type: enum
        source: input
        description: Reason recorded with a REJECT or ACCEPT decision.
        default: null
        constraints: "VERIFIED_MATCH | ILLEGIBLE | EXPIRED_DOCUMENT | WRONG_DEPENDENT | INSUFFICIENT_PROOF"
      - name: decided_at
        type: datetime
        source: system
        description: Clock instant of the ACCEPT/REJECT decision.
        default: null
      - name: redacted_document_reference
        type: string
        source: input
        description: Handle of the re-uploaded masked document supplied by POST /proof-submissions/{id}/redaction.
        default: null

  - name: AmnestyRemoval
    parent: null
    common_fields: false
    fields:
      - name: dependent_id
        type: string
        source: input
        description: FK -> Dependent.id; the dependent voluntarily removed.
      - name: case_id
        type: string
        source: input
        description: FK -> AuditCase.id; the case this removal answers.
      - name: reason_code
        type: enum
        source: input
        description: Employee-declared reason for removal.
        constraints: "NO_LONGER_ELIGIBLE | DIVORCE_FINALIZED | AGE_LIMIT_EXCEEDED | DOCUMENTATION_UNAVAILABLE | OTHER"
      - name: attestation_signed
        type: boolean
        source: input
        description: Must be true; the employee attests the dependent is ineligible.
        constraints: "must equal true -> ERR_INVALID_REQUEST"
      - name: recorded_at
        type: datetime
        source: system
        description: Logical-clock instant the removal was accepted.
      - name: coverage_end_date
        type: string
        source: computed
        description: Last calendar day of the month containing recorded_at (ISO date).
      - name: penalty_waived
        type: boolean
        source: computed
        description: Always true - the amnesty period removes penalties.
        default: true
      - name: claims_recovery_waived
        type: boolean
        source: computed
        description: Always true - no ClaimRecovery may be opened against an AMNESTY_REMOVED dependent.
        default: true
      - name: audited_savings_contribution_cents
        type: integer
        source: computed
        description: "Dependent.monthly_cost_cents * (12 - calendar month number of coverage_end_date)."

  - name: Appeal
    parent: null
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: FK -> AuditCase.id; the escalated case under appeal.
      - name: dependent_id
        type: string
        source: input
        description: FK -> Dependent.id; the dependent whose termination is appealed.
      - name: grounds
        type: enum
        source: input
        description: Documentation-exception ground asserted by the employee.
        constraints: "DOMESTIC_PARTNERSHIP_AFFIDAVIT | CUSTODY_ARRANGEMENT | DOCUMENT_UNAVAILABLE | ADMINISTRATIVE_ERROR"
      - name: statement
        type: string
        source: input
        description: Employee narrative supporting the exception.
      - name: affidavit_reference
        type: string
        source: input
        description: Handle of the signed domestic-partnership affidavit; required for grounds DOMESTIC_PARTNERSHIP_AFFIDAVIT.
        default: null
      - name: custody_order_reference
        type: string
        source: input
        description: Handle of the custody or guardianship order; required for grounds CUSTODY_ARRANGEMENT.
        default: null
      - name: status
        type: enum
        source: system
        description: Appeal lifecycle; see state_machines.Appeal.
        default: SUBMITTED
        constraints: "SUBMITTED | UNDER_REVIEW | GRANTED | DENIED | REMANDED"
      - name: round_number
        type: integer
        source: system
        description: Review round; incremented by POST /appeals/{id}/resubmit, capped at constants.MAX_APPEAL_ROUNDS.
        default: 1
      - name: reviewer_user_id
        type: string
        source: system
        description: X-User-ID of the AppealReviewer assigned by POST /appeals/{id}/assign.
        default: null
      - name: assigned_at
        type: datetime
        source: system
        description: Clock instant of assignment.
        default: null
      - name: decided_at
        type: datetime
        source: system
        description: Clock instant of GRANT/DENY/REMAND.
        default: null
      - name: decision_rationale
        type: string
        source: input
        description: Reviewer narrative recorded with the decision.
        default: null
      - name: remand_reason
        type: string
        source: input
        description: What additional documentation the reviewer requires on REMAND.
        default: null

  - name: TerminationNotice
    parent: null
    common_fields: true
    fields:
      - name: dependent_id
        type: string
        source: system
        description: FK -> Dependent.id; the dependent losing coverage.
      - name: case_id
        type: string
        source: system
        description: "FK -> AuditCase.id; set when origin == AUDIT_ESCALATION, null when origin == POE_LAPSE."
        default: null
      - name: origin
        type: enum
        source: system
        description: Which sweep step issued the notice.
        constraints: "AUDIT_ESCALATION | POE_LAPSE"
      - name: status
        type: enum
        source: system
        description: Notice lifecycle; see state_machines.TerminationNotice.
        default: ISSUED
        constraints: "ISSUED | FINAL | RESCINDED"
      - name: issued_at
        type: datetime
        source: system
        description: Logical-clock instant of issuance.
      - name: effective_date
        type: string
        source: computed
        description: Output of calculations.termination_effective_date (ISO date); coverage ends at end of this day.
      - name: batch_sequence_no
        type: integer
        source: computed
        description: 1-based position of this notice within the sweep batch that issued it, assigned in case-priority processing order.
      - name: grace_days_applied
        type: integer
        source: computed
        description: constants.TERMINATION_GRACE_DAYS used in the effective-date computation.
      - name: continuation_election_status
        type: enum
        source: system
        description: Continuation-coverage election dimension.
        default: NOT_ELECTED
        constraints: "NOT_ELECTED | ELECTED | WAIVED | WINDOW_EXPIRED"
      - name: continuation_election_deadline
        type: datetime
        source: computed
        description: "issued_at + constants.CONTINUATION_ELECTION_DAYS days."
      - name: continuation_start_date
        type: string
        source: computed
        description: "effective_date + 1 day (ISO date); inclusive start of the continuation interval."
      - name: continuation_end_date
        type: string
        source: computed
        description: "continuation_start_date + constants.CONTINUATION_MONTHS calendar months (ISO date); EXCLUSIVE end of the half-open interval."
      - name: continuation_monthly_premium_cents
        type: integer
        source: computed
        description: Output of calculations.continuation_premium; 0 until an ELECT election is recorded.
        default: 0
      - name: continuation_elected_at
        type: datetime
        source: system
        description: Clock instant of the ELECT/WAIVE election.
        default: null
      - name: rescinded_at
        type: datetime
        source: system
        description: Clock instant at which a granted appeal rescinded the notice.
        default: null
      - name: rescission_reason
        type: enum
        source: system
        description: Why the notice was rescinded.
        default: null
        constraints: "APPEAL_GRANTED"

  - name: ClaimRecovery
    parent: null
    common_fields: true
    fields:
      - name: dependent_id
        type: string
        source: input
        description: FK -> Dependent.id; the ineligible dependent whose paid claims are pursued.
      - name: termination_notice_id
        type: string
        source: input
        description: FK -> TerminationNotice.id; the FINAL notice that establishes ineligibility.
      - name: recovery_variant
        type: enum
        source: input
        description: Which recovery algorithm variant priced this demand.
        constraints: "STRICT | EQUITABLE"
      - name: ineligibility_onset_date
        type: string
        source: input
        description: ISO date from which the dependent is treated as ineligible; STRICT includes claims on/after it.
      - name: recoverable_subtotal_cents
        type: integer
        source: computed
        description: Output of calculations.claims_recovery_amount for the selected variant.
        default: 0
      - name: admin_fee_pct
        type: number
        source: computed
        description: Tier rate selected by calculations.net_recovery_demand from recoverable_subtotal_cents.
        default: 0
      - name: admin_fee_cents
        type: integer
        source: computed
        description: Rounded administrative fee computed before the waiver credit is applied.
        default: 0
      - name: waiver_credit_cents
        type: integer
        source: input
        description: Goodwill credit applied by the RecoveryAgent at demand time.
        default: 0
        constraints: ">= 0 and <= recoverable_subtotal_cents -> ERR_WAIVER_EXCEEDS_SUBTOTAL"
      - name: net_demand_cents
        type: integer
        source: computed
        description: Output of calculations.net_recovery_demand; the amount actually demanded.
        default: 0
      - name: recovered_cents
        type: integer
        source: computed
        description: Sum of accepted payments against this demand.
        default: 0
      - name: refund_due_cents
        type: integer
        source: computed
        description: Equals recovered_cents once status == VOIDED, else 0.
        default: 0
      - name: status
        type: enum
        source: system
        description: Recovery lifecycle; see state_machines.ClaimRecovery.
        default: OPEN
        constraints: "OPEN | DEMAND_ISSUED | PARTIALLY_RECOVERED | RECOVERED | WRITTEN_OFF | VOIDED | SUPERSEDED"
      - name: demand_issued_at
        type: datetime
        source: system
        description: Clock instant the demand letter was issued.
        default: null

  - name: PaidClaimLine
    parent: null
    common_fields: false
    fields:
      - name: dependent_id
        type: string
        source: input
        description: FK -> Dependent.id; the dependent the claim was adjudicated for.
      - name: service_date
        type: string
        source: input
        description: ISO 8601 date of service; the only date the recovery variants filter on.
      - name: paid_cents
        type: integer
        source: input
        description: Amount the plan paid on this line.
        constraints: "> 0"
      - name: employee_premium_offset_cents
        type: integer
        source: input
        description: Employee premium contribution credited against this line under the EQUITABLE variant.
        default: 0
        constraints: ">= 0"
      - name: claim_reference
        type: string
        source: input
        description: Payer claim number.
      - name: provider_type
        type: enum
        source: input
        description: Benefit component the claim was paid under.
        constraints: "MEDICAL | DENTAL | VISION | PHARMACY"

  - name: CommunicationEvent
    parent: null
    common_fields: false
    fields:
      - name: case_id
        type: string
        source: input
        description: FK -> AuditCase.id; the case this outreach belongs to.
      - name: kind
        type: enum
        source: system
        description: Which communication in the plan this event realizes.
        constraints: "ANNOUNCEMENT | REMINDER | AMNESTY_CONFIRMATION | TERMINATION_NOTICE | RESCISSION_NOTICE"
      - name: channel
        type: enum
        source: input
        description: Delivery channel chosen by the communication plan.
        constraints: "EMAIL | MAIL | PORTAL"
      - name: sequence_no
        type: integer
        source: computed
        description: 1-based per-case ordinal; equals AuditCase.communication_sequence_no after insertion.
      - name: sent_at
        type: datetime
        source: system
        description: Logical-clock instant of dispatch.
      - name: template_code
        type: string
        source: input
        description: Communication template identifier recorded for audit.
        default: null

state_machines:
  - entity: AuditProgram
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: SCOPED
        trigger: "POST /audit-programs/{id}/scope"
        actor: ProgramAdmin
        preconditions:
          - "status == DRAFT"
          - "expected_program_version == AuditProgram.version"
          - "scope_type == TARGETED requires non-empty targeted_employee_ids; scope_type == NEW_DEPENDENT_ONLY requires new_dependent_since_date -> ERR_SCOPE_PARAMETERS_INVALID"
          - "candidate employee set (per calculations.scope_candidate_selection) is non-empty -> ERR_SCOPE_EMPTY"
          - "an AUDIT-phase DocumentationRule exists for every relationship_type present in the selected dependent set -> ERR_DOCUMENTATION_RULE_MISSING"
        side_effects:
          - "creates one AuditCase per candidate Employee with status SELECTED and in_scope_dependent_ids = that employee's Dependent ids with coverage_status == ENROLLED (ordered created_at ASC)"
          - "each selected Dependent transitions ENROLLED -> PENDING_VERIFICATION"
          - "sets scope_type; recomputes in_scope_case_count, in_scope_dependent_count, pending_dependent_count"
          - "recomputes AuditCase.priority_score for every created case"
          - "increments AuditProgram.version by 1"
      - from: SCOPED
        to: SCOPED
        trigger: "POST /audit-programs/{id}/scope (re-scope, supersedes the prior scope snapshot)"
        actor: ProgramAdmin
        preconditions:
          - "status == SCOPED (no case has yet been notified)"
          - "expected_program_version == AuditProgram.version -> ERR_STALE_PROGRAM_VERSION"
          - "candidate set non-empty -> ERR_SCOPE_EMPTY"
        side_effects:
          - "every existing AuditCase of this program with status == SELECTED transitions to VOIDED"
          - "because those cases are VOIDED, each of their in-scope Dependents transitions PENDING_VERIFICATION -> ENROLLED"
          - "creates the new AuditCase set exactly as in the DRAFT -> SCOPED transition"
          - "recomputes all program counters; increments AuditProgram.version by 1"
        note: "The only sanctioned CREATE-with-supersede path in the scaffold; guarded by concurrency_rules.scope-run-stale-program."
      - from: SCOPED
        to: AMNESTY_OPEN
        trigger: "POST /audit-programs/{id}/communicate"
        actor: ProgramAdmin
        preconditions:
          - "status == SCOPED"
          - "at least one AuditCase with status == SELECTED exists"
          - "no case's Employee holds another AuditCase with status IN {NOTIFIED, IN_PROGRESS, NON_RESPONSIVE, ESCALATED} whose program response window collides per validations[priority=26] -> ERR_CASE_WINDOW_OVERLAP (atomic: no case is notified when any collides)"
        side_effects:
          - "sets announcement_at = current logical clock; amnesty_end_at = announcement_at + amnesty_days days; response_deadline_at = announcement_at + response_days days"
          - "every AuditCase with status == SELECTED transitions SELECTED -> NOTIFIED (notified_at = announcement_at)"
          - "because each case was notified, one CommunicationEvent (kind ANNOUNCEMENT, sequence_no 1) is appended per case and AuditCase.communication_sequence_no becomes 1"
          - "increments AuditProgram.version by 1"
      - from: AMNESTY_OPEN
        to: RESPONSE_WINDOW
        trigger: "POST /audit-programs/{id}/run-sweep step S1 (system, clock-driven)"
        actor: system
        preconditions:
          - "status == AMNESTY_OPEN"
          - "current clock >= amnesty_end_at"
        side_effects:
          - "closes the amnesty window: further POST /amnesty-removals for this program fail"
          - "increments sweep_epoch by 1; increments AuditProgram.version by 1"
        note: "One run-sweep call executes S1..S6 in order, so a single sweep run after response_deadline_at performs S1 and then S2."
      - from: RESPONSE_WINDOW
        to: ESCALATION
        trigger: "POST /audit-programs/{id}/run-sweep step S2 (system, clock-driven)"
        actor: system
        preconditions:
          - "status == RESPONSE_WINDOW"
          - "current clock >= response_deadline_at"
        side_effects:
          - "recomputes AuditCase.priority_score for every case with status IN {NOTIFIED, IN_PROGRESS}, then processes those cases ordered priority_score DESC, created_at ASC"
          - "each processed case transitions NOTIFIED|IN_PROGRESS -> NON_RESPONSIVE (non_responsive_at = clock)"
          - "because a case became NON_RESPONSIVE, each of its in_scope_dependent_ids members with coverage_status == PENDING_VERIFICATION transitions PENDING_VERIFICATION -> TERMINATION_PENDING (dependents ordered created_at ASC)"
          - "because a dependent entered TERMINATION_PENDING, a TerminationNotice (origin AUDIT_ESCALATION, status ISSUED, batch_sequence_no assigned 1..N in processing order) is created and a CommunicationEvent (kind TERMINATION_NOTICE) is appended to its case"
          - "because notices were issued for a case, that case transitions NON_RESPONSIVE -> ESCALATED (escalated_at = clock)"
          - "recomputes program counters and provisional_annual_savings_cents; increments sweep_epoch and version by 1"
      - from: ESCALATION
        to: RECONCILIATION
        trigger: "POST /audit-programs/{id}/run-sweep step S5 (system, aggregate-driven)"
        actor: system
        preconditions:
          - "status == ESCALATION"
          - "every AuditCase of this program has status IN {COMPLETE, CLOSED, VOIDED}"
        side_effects:
          - "recomputes audited_annual_savings_cents, recovery_ledger_cents, recovered_total_cents, refund_due_total_cents"
          - "increments sweep_epoch and version by 1"
      - from: RECONCILIATION
        to: CLOSED
        trigger: "POST /audit-programs/{id}/close"
        actor: ProgramAdmin
        preconditions:
          - "status == RECONCILIATION"
          - "no Appeal of this program's cases has status IN {SUBMITTED, UNDER_REVIEW, REMANDED} -> ERR_OPEN_APPEALS_REMAIN"
          - "no ClaimRecovery of this program's in-scope dependents has status IN {DEMAND_ISSUED, PARTIALLY_RECOVERED} -> ERR_OPEN_RECOVERIES_REMAIN"
        side_effects:
          - "every ClaimRecovery of this program's dependents with status == OPEN transitions OPEN -> WRITTEN_OFF"
          - "every ProofSubmission of this program's cases with privacy_class == SENSITIVE and review_status == ACCEPTED has privacy_status set to PURGED (privacy retention rule)"
          - "recomputes audited_annual_savings_cents; increments version by 1"

  - entity: AuditCase
    initial_state: SELECTED
    terminal_states: [CLOSED, VOIDED]
    transitions:
      - from: SELECTED
        to: NOTIFIED
        trigger: "POST /audit-programs/{id}/communicate (bulk)"
        actor: ProgramAdmin
        preconditions: ["program.status == SCOPED", "case.status == SELECTED"]
        side_effects:
          - "notified_at = program.announcement_at"
          - "appends CommunicationEvent kind ANNOUNCEMENT sequence_no 1; communication_sequence_no = 1"
      - from: SELECTED
        to: VOIDED
        trigger: "POST /audit-programs/{id}/scope (re-scope supersede)"
        actor: ProgramAdmin
        preconditions: ["case.status == SELECTED"]
        side_effects: ["each in-scope Dependent transitions PENDING_VERIFICATION -> ENROLLED"]
      - from: NOTIFIED
        to: IN_PROGRESS
        trigger: "POST /proof-submissions or POST /amnesty-removals (first response on this case)"
        actor: Employee
        preconditions: ["case.status == NOTIFIED", "program.status IN {AMNESTY_OPEN, RESPONSE_WINDOW}"]
        side_effects: ["recomputes proof_submission_count, unverified_dependent_count, priority_score", "program.responded_case_count recomputed"]
      - from: IN_PROGRESS
        to: COMPLETE
        trigger: "system, on the last in-scope dependent reaching a resolved status (VERIFIED, REINSTATED or AMNESTY_REMOVED)"
        actor: system
        preconditions: ["every member of in_scope_dependent_ids has coverage_status IN {VERIFIED, REINSTATED, AMNESTY_REMOVED, TERMINATED}"]
        side_effects: ["completed_at = clock", "program.responded_case_count and savings counters recomputed"]
      - from: NOTIFIED
        to: COMPLETE
        trigger: "system, when a single-response case resolves its only in-scope dependent"
        actor: system
        preconditions: ["every member of in_scope_dependent_ids has coverage_status IN {VERIFIED, REINSTATED, AMNESTY_REMOVED, TERMINATED}"]
        side_effects: ["completed_at = clock"]
        note: "Reachable when the resolving action is itself the first response, in which case NOTIFIED -> IN_PROGRESS -> COMPLETE both fire inside the same request; the persisted end state is COMPLETE."
      - from: NOTIFIED
        to: NON_RESPONSIVE
        trigger: "POST /audit-programs/{id}/run-sweep step S2"
        actor: system
        preconditions: ["clock >= program.response_deadline_at", "case.status IN {NOTIFIED, IN_PROGRESS}"]
        side_effects: ["non_responsive_at = clock", "cascade: PENDING_VERIFICATION dependents -> TERMINATION_PENDING"]
      - from: IN_PROGRESS
        to: NON_RESPONSIVE
        trigger: "POST /audit-programs/{id}/run-sweep step S2"
        actor: system
        preconditions: ["clock >= program.response_deadline_at", "at least one in-scope dependent still PENDING_VERIFICATION"]
        side_effects: ["non_responsive_at = clock", "cascade: PENDING_VERIFICATION dependents -> TERMINATION_PENDING"]
      - from: NON_RESPONSIVE
        to: ESCALATED
        trigger: "POST /audit-programs/{id}/run-sweep step S2 (same pass, after notices are issued)"
        actor: system
        preconditions: ["at least one TerminationNotice was created for this case in this sweep pass"]
        side_effects: ["escalated_at = clock", "program.non_responsive_case_count recomputed"]
      - from: ESCALATED
        to: IN_PROGRESS
        trigger: "POST /appeals/{id}/decision with decision GRANT"
        actor: AppealReviewer
        preconditions: ["appeal.case_id == this case", "at least one member of in_scope_dependent_ids still has coverage_status IN {PENDING_VERIFICATION, TERMINATION_PENDING}"]
        side_effects: ["recomputes unverified_dependent_count and priority_score", "program.non_responsive_case_count recomputed"]
        note: "The cycle: an escalated case re-opens for response when an appeal restores a dependent while siblings remain unresolved."
      - from: ESCALATED
        to: COMPLETE
        trigger: "POST /appeals/{id}/decision with decision GRANT (last unresolved dependent restored)"
        actor: AppealReviewer
        preconditions: ["every member of in_scope_dependent_ids has coverage_status IN {VERIFIED, REINSTATED, AMNESTY_REMOVED, TERMINATED}"]
        side_effects: ["completed_at = clock", "program counters recomputed"]
      - from: ESCALATED
        to: CLOSED
        trigger: "POST /audit-programs/{id}/run-sweep step S4 (all notices of this case reached FINAL)"
        actor: system
        preconditions: ["every TerminationNotice of this case has status IN {FINAL, RESCINDED}", "no member of in_scope_dependent_ids has coverage_status IN {PENDING_VERIFICATION, TERMINATION_PENDING}", "the appeal window has closed on every notice of this case: clock > notice.issued_at + constants.APPEAL_WINDOW_DAYS days -> otherwise the case stays ESCALATED so an appeal is still filable"]
        side_effects: ["program.non_responsive_case_count and terminated_dependent_count recomputed"]
      - from: COMPLETE
        to: CLOSED
        trigger: "POST /audit-programs/{id}/close"
        actor: ProgramAdmin
        preconditions: ["program.status == RECONCILIATION"]
        side_effects: ["no further ProofSubmission, AmnestyRemoval or Appeal may reference this case"]

  - entity: Dependent
    initial_state: ENROLLED
    terminal_states: [AMNESTY_REMOVED, REINSTATED]
    transitions:
      - from: ENROLLED
        to: PENDING_VERIFICATION
        trigger: "POST /audit-programs/{id}/scope, or POST /employees/{id}/dependents when a POINT_OF_ENROLLMENT rule applies"
        actor: ProgramAdmin
        preconditions: ["coverage_status == ENROLLED"]
        side_effects:
          - "on scope: added to AuditCase.in_scope_dependent_ids"
          - "on POE add: sets poe_program_id and poe_deadline_at = clock + DocumentationRule.grace_days days"
      - from: PENDING_VERIFICATION
        to: ENROLLED
        trigger: "POST /audit-programs/{id}/scope (re-scope supersede voids the prior case)"
        actor: ProgramAdmin
        preconditions: ["the owning AuditCase transitioned SELECTED -> VOIDED in this request"]
        side_effects: ["program.pending_dependent_count recomputed"]
      - from: PENDING_VERIFICATION
        to: VERIFIED
        trigger: "POST /proof-submissions/{id}/decision with decision ACCEPT (completeness reached)"
        actor: VerificationAnalyst
        preconditions: ["calculations.documentation_completeness returns true for this dependent"]
        side_effects:
          - "documentation_complete = true; accepted_proof_type_count recomputed"
          - "because the dependent resolved, its AuditCase recomputes unverified_dependent_count and may auto-transition to COMPLETE"
          - "program.verified_dependent_count and pending_dependent_count recomputed"
      - from: PENDING_VERIFICATION
        to: AMNESTY_REMOVED
        trigger: "POST /amnesty-removals"
        actor: Employee
        preconditions: ["program.status == AMNESTY_OPEN", "clock <= program.amnesty_end_at", "no AmnestyRemoval already exists for this dependent"]
        side_effects:
          - "coverage_end_date = last day of the month containing the clock instant"
          - "appends CommunicationEvent kind AMNESTY_CONFIRMATION to the case"
          - "case NOTIFIED -> IN_PROGRESS (and possibly -> COMPLETE)"
          - "program.amnesty_removed_count, pending_dependent_count and provisional_annual_savings_cents recomputed"
      - from: PENDING_VERIFICATION
        to: TERMINATION_PENDING
        trigger: "POST /audit-programs/{id}/run-sweep step S2 (audit escalation) or step S3 (POE grace lapse)"
        actor: system
        preconditions:
          - "S2: the owning case became NON_RESPONSIVE in this pass"
          - "S3: poe_deadline_at != null and clock >= poe_deadline_at and documentation_complete == false and the POE rule's auto_terminate_on_lapse == true"
        side_effects: ["a TerminationNotice is created (origin AUDIT_ESCALATION for S2, POE_LAPSE for S3)", "program.termination_pending_count recomputed"]
      - from: TERMINATION_PENDING
        to: TERMINATED
        trigger: "POST /audit-programs/{id}/run-sweep step S4"
        actor: system
        preconditions: ["the dependent's TerminationNotice has status == ISSUED", "clock date > notice.effective_date"]
        side_effects:
          - "coverage_end_date = notice.effective_date; notice ISSUED -> FINAL"
          - "program.terminated_dependent_count, termination_pending_count and audited_annual_savings_cents recomputed"
      - from: TERMINATION_PENDING
        to: VERIFIED
        trigger: "POST /appeals/{id}/decision with decision GRANT (before finalization)"
        actor: AppealReviewer
        preconditions: ["appeal.status == UNDER_REVIEW", "the dependent's TerminationNotice status == ISSUED"]
        side_effects:
          - "documentation_complete = true (exception granted in lieu of documentation)"
          - "because the dependent left TERMINATION_PENDING, its TerminationNotice transitions ISSUED -> RESCINDED"
          - "program counters and both savings figures recomputed"
      - from: TERMINATED
        to: REINSTATED
        trigger: "POST /appeals/{id}/decision with decision GRANT (after finalization)"
        actor: AppealReviewer
        preconditions: ["appeal.status == UNDER_REVIEW", "the dependent's TerminationNotice status == FINAL"]
        side_effects:
          - "coverage_end_date = null; reinstated_at = clock"
          - "because the dependent left TERMINATED, its TerminationNotice transitions FINAL -> RESCINDED"
          - "because the notice was rescinded, every ClaimRecovery of this dependent with status IN {OPEN, DEMAND_ISSUED, PARTIALLY_RECOVERED} transitions to VOIDED with refund_due_cents = recovered_cents"
          - "because recoveries were voided, program.recovery_ledger_cents, recovered_total_cents, refund_due_total_cents and audited_annual_savings_cents are recomputed"

  - entity: ProofSubmission
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /proof-submissions/{id}/decision with decision ACCEPT"
        actor: VerificationAnalyst
        preconditions:
          - "program.status IN {RESPONSE_WINDOW, ESCALATION}"
          - "privacy_status IN {NOT_REQUIRED, REDACTED} -> ERR_PRIVACY_HOLD otherwise"
        side_effects:
          - "reviewed_by_user_id = X-User-ID; decided_at = clock"
          - "dependent.accepted_proof_type_count recomputed; may cascade dependent PENDING_VERIFICATION -> VERIFIED"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /proof-submissions/{id}/decision with decision REJECT"
        actor: VerificationAnalyst
        preconditions: ["program.status IN {RESPONSE_WINDOW, ESCALATION}"]
        side_effects: ["reviewed_by_user_id = X-User-ID; decision_reason_code recorded"]
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /proof-submissions/{id}/decision with decision REQUEST_REDACTION"
        actor: VerificationAnalyst
        preconditions: ["program.status IN {RESPONSE_WINDOW, ESCALATION}"]
        side_effects:
          - "privacy dimension: privacy_status -> REDACTION_REQUIRED (independent of the review dimension)"
          - "reviewed_by_user_id = X-User-ID"
        note: "Parallel dimensions: the review dimension parks at UNDER_REVIEW while the privacy dimension advances."
      - from: UNDER_REVIEW
        to: ACCEPTED
        trigger: "POST /proof-submissions/{id}/decision with decision ACCEPT"
        actor: VerificationAnalyst
        preconditions: ["privacy_status IN {NOT_REQUIRED, REDACTED} -> ERR_PRIVACY_HOLD otherwise", "program.status IN {RESPONSE_WINDOW, ESCALATION}"]
        side_effects: ["as in SUBMITTED -> ACCEPTED"]
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /proof-submissions/{id}/decision with decision REJECT"
        actor: VerificationAnalyst
        preconditions: ["program.status IN {RESPONSE_WINDOW, ESCALATION}"]
        side_effects: ["decision_reason_code recorded"]
      - from: "privacy_status REDACTION_REQUIRED"
        to: "privacy_status REDACTED"
        trigger: "POST /proof-submissions/{id}/redaction"
        actor: Employee
        preconditions: ["privacy_status == REDACTION_REQUIRED", "review_status IN {SUBMITTED, UNDER_REVIEW}", "acting Employee owns the dependent"]
        side_effects: ["redacted_document_reference stored", "review_status is left unchanged (parallel dimension)"]
      - from: "privacy_status REDACTED (review_status ACCEPTED)"
        to: "privacy_status PURGED"
        trigger: "POST /audit-programs/{id}/close"
        actor: ProgramAdmin
        preconditions: ["privacy_class == SENSITIVE", "review_status == ACCEPTED"]
        side_effects: ["document_reference retained for audit but the privacy dimension records destruction of the sensitive copy"]

  - entity: Appeal
    initial_state: SUBMITTED
    terminal_states: [GRANTED, DENIED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /appeals/{id}/assign"
        actor: AppealReviewer
        preconditions:
          - "status == SUBMITTED"
          - "X-User-ID does not appear as reviewed_by_user_id on any ProofSubmission of this appeal's dependent -> ERR_SEGREGATION_OF_DUTIES"
        side_effects: ["reviewer_user_id = X-User-ID; assigned_at = clock"]
      - from: UNDER_REVIEW
        to: GRANTED
        trigger: "POST /appeals/{id}/decision with decision GRANT"
        actor: AppealReviewer
        preconditions: ["status == UNDER_REVIEW", "X-User-ID == reviewer_user_id -> ERR_APPEAL_REVIEWER_MISMATCH"]
        side_effects:
          - "dependent TERMINATION_PENDING -> VERIFIED or TERMINATED -> REINSTATED"
          - "notice RESCINDED; RESCISSION_NOTICE CommunicationEvent appended; recoveries VOIDED; case re-opened or completed"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /appeals/{id}/decision with decision DENY"
        actor: AppealReviewer
        preconditions: ["status == UNDER_REVIEW", "X-User-ID == reviewer_user_id"]
        side_effects: ["decided_at = clock; the TerminationNotice proceeds unchanged"]
      - from: UNDER_REVIEW
        to: REMANDED
        trigger: "POST /appeals/{id}/decision with decision REMAND"
        actor: AppealReviewer
        preconditions: ["status == UNDER_REVIEW", "X-User-ID == reviewer_user_id", "round_number < constants.MAX_APPEAL_ROUNDS"]
        side_effects: ["remand_reason recorded; decided_at = clock"]
      - from: REMANDED
        to: SUBMITTED
        trigger: "POST /appeals/{id}/resubmit"
        actor: Employee
        preconditions:
          - "status == REMANDED"
          - "round_number < constants.MAX_APPEAL_ROUNDS -> ERR_APPEAL_ROUNDS_EXHAUSTED"
          - "acting Employee owns the dependent"
        side_effects: ["round_number += 1; reviewer_user_id and assigned_at cleared so the case must be re-assigned"]
        note: "The revision cycle; capped at MAX_APPEAL_ROUNDS = 2 rounds."

  - entity: TerminationNotice
    initial_state: ISSUED
    terminal_states: [RESCINDED]
    transitions:
      - from: ISSUED
        to: FINAL
        trigger: "POST /audit-programs/{id}/run-sweep step S4"
        actor: system
        preconditions: ["status == ISSUED", "clock date > effective_date"]
        side_effects: ["dependent TERMINATION_PENDING -> TERMINATED with coverage_end_date = effective_date"]
      - from: ISSUED
        to: RESCINDED
        trigger: "POST /appeals/{id}/decision with decision GRANT"
        actor: AppealReviewer
        preconditions: ["status == ISSUED", "the granted appeal names this notice's dependent"]
        side_effects: ["rescinded_at = clock; rescission_reason = APPEAL_GRANTED", "appends CommunicationEvent kind RESCISSION_NOTICE"]
      - from: FINAL
        to: RESCINDED
        trigger: "POST /appeals/{id}/decision with decision GRANT"
        actor: AppealReviewer
        preconditions: ["status == FINAL", "the granted appeal names this notice's dependent"]
        side_effects:
          - "rescinded_at = clock; rescission_reason = APPEAL_GRANTED"
          - "cascades ClaimRecovery -> VOIDED for this dependent"
      - from: "continuation_election_status NOT_ELECTED"
        to: "continuation_election_status ELECTED"
        trigger: "POST /termination-notices/{id}/continuation-election with election ELECT"
        actor: Employee
        preconditions:
          - "status IN {ISSUED, FINAL}"
          - "continuation_election_status == NOT_ELECTED"
          - "clock <= continuation_election_deadline -> ERR_CONTINUATION_ELECTION_WINDOW_CLOSED"
        side_effects: ["continuation_monthly_premium_cents = calculations.continuation_premium output", "continuation_elected_at = clock"]
      - from: "continuation_election_status NOT_ELECTED"
        to: "continuation_election_status WAIVED"
        trigger: "POST /termination-notices/{id}/continuation-election with election WAIVE"
        actor: Employee
        preconditions: ["status IN {ISSUED, FINAL}", "continuation_election_status == NOT_ELECTED", "clock <= continuation_election_deadline"]
        side_effects: ["continuation_elected_at = clock; continuation_monthly_premium_cents stays 0"]
      - from: "continuation_election_status NOT_ELECTED"
        to: "continuation_election_status WINDOW_EXPIRED"
        trigger: "POST /audit-programs/{id}/run-sweep step S6"
        actor: system
        preconditions: ["continuation_election_status == NOT_ELECTED", "clock > continuation_election_deadline", "status IN {ISSUED, FINAL}"]
        side_effects: ["no further election is accepted on this notice"]

  - entity: ClaimRecovery
    initial_state: OPEN
    terminal_states: [RECOVERED, WRITTEN_OFF, VOIDED, SUPERSEDED]
    transitions:
      - from: OPEN
        to: DEMAND_ISSUED
        trigger: "POST /claim-recoveries/{id}/issue-demand"
        actor: RecoveryAgent
        preconditions:
          - "status == OPEN"
          - "recoverable_subtotal_cents >= constants.DE_MINIMIS_RECOVERY_CENTS -> ERR_RECOVERY_BELOW_DE_MINIMIS"
          - "waiver_credit_cents <= recoverable_subtotal_cents -> ERR_WAIVER_EXCEEDS_SUBTOTAL"
        side_effects:
          - "admin_fee_pct, admin_fee_cents and net_demand_cents written per calculations.net_recovery_demand"
          - "demand_issued_at = clock; program.recovery_ledger_cents recomputed"
      - from: DEMAND_ISSUED
        to: PARTIALLY_RECOVERED
        trigger: "POST /claim-recoveries/{id}/payments (payment < outstanding)"
        actor: RecoveryAgent
        preconditions: ["status IN {DEMAND_ISSUED, PARTIALLY_RECOVERED}", "recovered_cents + amount_cents < net_demand_cents"]
        side_effects: ["recovered_cents += amount_cents; program.recovered_total_cents recomputed"]
      - from: PARTIALLY_RECOVERED
        to: RECOVERED
        trigger: "POST /claim-recoveries/{id}/payments (payment closes the balance)"
        actor: RecoveryAgent
        preconditions: ["recovered_cents + amount_cents == net_demand_cents -> otherwise ERR_PAYMENT_EXCEEDS_DEMAND"]
        side_effects: ["recovered_cents = net_demand_cents; program.recovered_total_cents recomputed"]
      - from: DEMAND_ISSUED
        to: RECOVERED
        trigger: "POST /claim-recoveries/{id}/payments (single full payment)"
        actor: RecoveryAgent
        preconditions: ["recovered_cents + amount_cents == net_demand_cents"]
        side_effects: ["recovered_cents = net_demand_cents; program.recovered_total_cents recomputed"]
      - from: OPEN
        to: SUPERSEDED
        trigger: "POST /claim-recoveries (a new recovery is created for the same dependent)"
        actor: RecoveryAgent
        preconditions: ["status IN {OPEN, DEMAND_ISSUED}", "the new row targets the same dependent_id"]
        side_effects: ["Dependent.recovery_revision += 1 and Dependent.version += 1 (guarded by concurrency_rules.recovery-create-stale-dependent)", "program.recovery_ledger_cents recomputed"]
      - from: DEMAND_ISSUED
        to: SUPERSEDED
        trigger: "POST /claim-recoveries (recalculated demand replaces the outstanding one)"
        actor: RecoveryAgent
        preconditions: ["status == DEMAND_ISSUED", "recovered_cents == 0"]
        side_effects: ["program.recovery_ledger_cents recomputed to exclude the superseded row"]
      - from: OPEN
        to: WRITTEN_OFF
        trigger: "POST /audit-programs/{id}/close"
        actor: ProgramAdmin
        preconditions: ["status == OPEN at program close"]
        side_effects: ["no demand is ever issued on this row"]
      - from: DEMAND_ISSUED
        to: VOIDED
        trigger: "POST /appeals/{id}/decision with decision GRANT (notice rescinded)"
        actor: AppealReviewer
        preconditions: ["the dependent's TerminationNotice transitioned to RESCINDED in this request"]
        side_effects:
          - "refund_due_cents = recovered_cents"
          - "program.recovery_ledger_cents, recovered_total_cents and refund_due_total_cents recomputed"
      - from: PARTIALLY_RECOVERED
        to: VOIDED
        trigger: "POST /appeals/{id}/decision with decision GRANT (notice rescinded)"
        actor: AppealReviewer
        preconditions: ["the dependent's TerminationNotice transitioned to RESCINDED in this request"]
        side_effects: ["refund_due_cents = recovered_cents", "program money counters recomputed"]
      - from: OPEN
        to: VOIDED
        trigger: "POST /appeals/{id}/decision with decision GRANT (notice rescinded before any demand)"
        actor: AppealReviewer
        preconditions: ["the dependent's TerminationNotice transitioned to RESCINDED in this request"]
        side_effects: ["refund_due_cents stays 0"]

concurrency_rules:
  - rule_id: scope-run-stale-program
    parent_entity: AuditProgram
    write_endpoint: "POST /audit-programs/{id}/scope"
    occ_field: "expected_program_version"
    description: |
      A scope run carrying a program version older than AuditProgram.version is rejected. This is the
      CREATE-with-supersede path: a re-scope legitimately voids the prior AuditCase snapshot and
      returns its dependents to ENROLLED, so a writer whose view of the program predates an earlier
      scope run (or any other program mutation) would silently discard case state it never saw.
    error_id: ERR_STALE_PROGRAM_VERSION
    http_status: 412
  - rule_id: recovery-create-stale-dependent
    parent_entity: Dependent
    write_endpoint: "POST /claim-recoveries"
    occ_field: "expected_dependent_version"
    description: |
      Creating a ClaimRecovery against a Dependent whose version has advanced since the client last
      observed it is rejected. A new recovery legitimately supersedes the dependent's prior OPEN or
      DEMAND_ISSUED row, so a stale writer would supersede a recalculated demand it never read.
    error_id: ERR_STALE_DEPENDENT_VERSION
    http_status: 412

calculations:
  - name: scope_candidate_selection
    trigger: "POST /audit-programs/{id}/scope, before any AuditCase is created"
    algorithm: constraint_propagation
    formula: |
      # (a) eligibility filter over Employee/Dependent fields - explicit, no adjectives
      enrolled(e)  := { d in Dependent : d.employee_id == e.id AND d.coverage_status == ENROLLED }
      if scope_type == FULL_CENSUS:
          candidates := { e in Employee : |enrolled(e)| >= 1 }
      if scope_type == TARGETED:
          candidates := { e in Employee : e.id IN request.targeted_employee_ids AND |enrolled(e)| >= 1 }
      if scope_type == NEW_DEPENDENT_ONLY:
          candidates := { e in Employee : exists d in enrolled(e) with d.enrolled_at >= request.new_dependent_since_date }
      # (b) processing / creation order (ranking): Employee.created_at ASC
      # (c) tie-break when two employees share created_at: Employee.work_email ASC (never id)
      # (d) empty candidate set -> ERR_SCOPE_EMPTY (422); no case is created and status stays DRAFT/SCOPED
      for each e in candidates ordered by (created_at ASC, work_email ASC):
          in_scope_ids(e) := ids of enrolled(e) ordered by (Dependent.created_at ASC)
          # NEW_DEPENDENT_ONLY narrows the per-case set to the new dependents only:
          if scope_type == NEW_DEPENDENT_ONLY:
              in_scope_ids(e) := [ d.id for d in enrolled(e) if d.enrolled_at >= request.new_dependent_since_date ]
          create AuditCase(program_id, employee_id=e.id, status=SELECTED, in_scope_dependent_ids=in_scope_ids(e))
    input_set: "Employees with at least one Dependent in coverage_status == ENROLLED; dependents in any other coverage_status are never pulled into a new case."
    constants:
      SCOPE_TYPES: "FULL_CENSUS | TARGETED | NEW_DEPENDENT_ONLY"
    precision: "integer counts; no rounding"

  - name: documentation_completeness
    trigger: "after every POST /proof-submissions/{id}/decision with decision ACCEPT, and in run-sweep step S3 for POE dependents"
    algorithm: aggregation
    formula: |
      rule := the DocumentationRule with program_id == <program in context>
                                   AND relationship_type == dependent.relationship_type
                                   AND phase == (POINT_OF_ENROLLMENT if dependent.poe_program_id != null
                                                 and the program in context == dependent.poe_program_id
                                                 else AUDIT)
      accepted := { s in ProofSubmission : s.dependent_id == dependent.id
                                       AND s.review_status == ACCEPTED
                                       AND s.privacy_status IN {NOT_REQUIRED, REDACTED, PURGED} }
      accepted_proof_type_count := | DISTINCT s.proof_type for s in accepted |
      documentation_complete := accepted_proof_type_count >= rule.min_accepted_documents
    input_set: "Only ACCEPTED submissions count; SUBMITTED, UNDER_REVIEW and REJECTED rows are excluded. Duplicate accepted rows of the same proof_type count once."
    constants:
      PROOF_TYPES: "MARRIAGE_CERTIFICATE | JOINT_TAX_RETURN | JOINT_ACCOUNT_STATEMENT | DOMESTIC_PARTNER_AFFIDAVIT | SHARED_RESIDENCE_PROOF | BIRTH_CERTIFICATE | ADOPTION_DECREE | COURT_ORDER | DISABILITY_CERTIFICATION | TAX_DEPENDENCY_PROOF"
      SENSITIVE_PROOF_TYPES: "{ JOINT_TAX_RETURN, JOINT_ACCOUNT_STATEMENT, DISABILITY_CERTIFICATION, TAX_DEPENDENCY_PROOF }  # submitted without redaction_applied == true -> ERR_PRIVACY_REDACTION_REQUIRED"
      RECENCY_SCOPED_PROOF_TYPES: "{ JOINT_TAX_RETURN, JOINT_ACCOUNT_STATEMENT }  # only these are checked against requires_recency_days"
      PROOF_PRIVACY_CLASS: "SENSITIVE for every member of SENSITIVE_PROOF_TYPES, STANDARD for every other proof type"
    precision: "integer count; comparison uses >= (exactly min_accepted_documents distinct types is sufficient)"

  - name: savings_measurement
    trigger: "POST /audit-programs/{id}/measure-savings; also recomputed as a side effect of amnesty removal, run-sweep steps S2/S4/S5, appeal GRANT and program close"
    algorithm: aggregation
    formula: |
      # in-scope set: dependents whose id appears in AuditCase.in_scope_dependent_ids of a case whose
      # status != VOIDED for this program.
      month_no(iso_date) := calendar month number 1..12 of iso_date   # plan year is program.plan_year
      months_remaining(d) := 12 - month_no(d.coverage_end_date)

      PROVISIONAL := sum over d in in_scope with d.coverage_status IN
                       {AMNESTY_REMOVED, TERMINATION_PENDING, TERMINATED}
                     of ( d.monthly_cost_cents * 12 )
      AUDITED     := sum over d in in_scope with d.coverage_status IN
                       {AMNESTY_REMOVED, TERMINATED}
                     of ( d.monthly_cost_cents * months_remaining(d) )
      # REINSTATED, VERIFIED, PENDING_VERIFICATION and ENROLLED dependents contribute 0 to both.
    input_set: "PROVISIONAL counts not-yet-final terminations at a full 12 months; AUDITED counts only dependents whose coverage actually ended and prorates from the coverage_end_date month to the end of the plan year."
    constants:
      RELATIONSHIP_MONTHLY_COST_CENTS: "{ SPOUSE: 49713, DOMESTIC_PARTNER: 49713, CHILD_BIOLOGICAL: 30500, STEPCHILD: 30500, ADOPTED_CHILD: 30500, LEGAL_GUARDIANSHIP: 30500, DISABLED_ADULT_CHILD: 36238 }"
    precision: "integer cents; every term is an exact integer product, no rounding"
    variants:
      - name: PROVISIONAL
        when: "variant == PROVISIONAL on POST /audit-programs/{id}/measure-savings, and every automatic recompute before a notice reaches FINAL"
        difference: "Includes TERMINATION_PENDING dependents and annualizes every removal at 12 months regardless of when coverage actually ended; written to provisional_annual_savings_cents."
      - name: AUDITED
        when: "variant == AUDITED, and every automatic recompute triggered by notice finalization, appeal grant or program close"
        difference: "Excludes TERMINATION_PENDING dependents entirely and prorates each remaining dependent by 12 - month_no(coverage_end_date); written to audited_annual_savings_cents."

  - name: claims_recovery_amount
    trigger: "POST /claim-recoveries (row creation) and re-evaluated on POST /claim-recoveries/{id}/issue-demand"
    algorithm: chronological
    formula: |
      d      := the Dependent named by dependent_id
      lines  := PaidClaimLine rows with dependent_id == d.id, processed in (service_date ASC, created_at ASC) order
      window_end := d.coverage_end_date if d.coverage_end_date != null else the notice.effective_date
      if recovery_variant == STRICT:
          recoverable_subtotal_cents := sum( l.paid_cents
                                             for l in lines
                                             if l.service_date >= ineligibility_onset_date      # INCLUSIVE
                                            and l.service_date <= window_end )                  # INCLUSIVE
      if recovery_variant == EQUITABLE:
          cutoff := date(program.announcement_at)     # the notification date, not the onset date
          recoverable_subtotal_cents := sum( max(l.paid_cents - l.employee_premium_offset_cents, 0)
                                             for l in lines
                                             if l.service_date >= cutoff                        # INCLUSIVE
                                            and l.service_date <= window_end )
    input_set: "Only PaidClaimLine rows of the named dependent inside the [onset|announcement, coverage_end] closed date window. Lines outside the window contribute 0 under both variants."
    constants:
      DE_MINIMIS_RECOVERY_CENTS: 25000
    precision: "integer cents; the per-line max(...,0) floor is applied per line before summation (never on the total)"
    variants:
      - name: STRICT
        when: "recovery_variant == STRICT"
        difference: "Reaches back to ineligibility_onset_date and ignores employee premium contributions entirely - the gross plan-paid amount."
      - name: EQUITABLE
        when: "recovery_variant == EQUITABLE"
        difference: "Starts at the audit announcement date and nets each line by employee_premium_offset_cents with a per-line floor of 0, producing a strictly smaller subtotal whenever any pre-announcement line or any offset exists."

  - name: net_recovery_demand
    trigger: "POST /claim-recoveries/{id}/issue-demand"
    algorithm: tiered_pricing
    formula: |
      # Evaluation order is PINNED (this is the circular-looking dependency: the administrative fee is
      # a tiered percentage of the demand, and the demand includes the fee).
      # STEP 1 - subtotal from calculations.claims_recovery_amount (already stored on the row):
      subtotal := recoverable_subtotal_cents
      # STEP 2 - the tier is keyed on the SUBTOTAL, never on the fee-inclusive total:
      admin_fee_pct := 0.00  if subtotal <  100000
                       0.05  if 100000 <= subtotal < 500000
                       0.08  if subtotal >= 500000
      # STEP 3 - fee is rounded once, computed BEFORE the waiver credit:
      admin_fee_cents := round_half_up(subtotal * admin_fee_pct)
      # STEP 4 - waiver credit is subtracted last:
      net_demand_cents := subtotal + admin_fee_cents - waiver_credit_cents
    input_set: "One ClaimRecovery row; waiver_credit_cents comes from the issue-demand request (default 0) and must be <= subtotal."
    constants:
      ADMIN_FEE_TIER_1_MAX_CENTS: 100000
      ADMIN_FEE_TIER_2_MAX_CENTS: 500000
      ADMIN_FEE_PCT_TIER_1: 0.00
      ADMIN_FEE_PCT_TIER_2: 0.05
      ADMIN_FEE_PCT_TIER_3: 0.08
    precision: "2-decimal percentage applied to integer cents, round_half_up to whole cents; exactly one rounding step, at STEP 3"

  - name: continuation_premium
    trigger: "POST /termination-notices/{id}/continuation-election with election ELECT"
    algorithm: tiered_pricing
    formula: |
      components := COMPONENT_COST_CENTS[dependent.relationship_type]   # ordered MEDICAL, DENTAL, VISION
      # ROUNDING ORDER IS PINNED: round each component AFTER the load factor, THEN sum.
      continuation_monthly_premium_cents :=
          sum( round_half_up(components[c] * CONTINUATION_LOAD_FACTOR) for c in [MEDICAL, DENTAL, VISION] )
      # The forbidden alternative order - round_half_up(sum(components) * CONTINUATION_LOAD_FACTOR) -
      # differs by 1 cent for SPOUSE/DOMESTIC_PARTNER (50708 vs 50707) and MUST NOT be used.
    input_set: "The single dependent named by the notice; component costs are constants keyed by relationship_type."
    constants:
      CONTINUATION_LOAD_FACTOR: 1.02
      CONTINUATION_ELECTION_DAYS: 60
      CONTINUATION_MONTHS: 18
      COMPONENT_COST_CENTS: "{ SPOUSE: {MEDICAL: 45125, DENTAL: 3313, VISION: 1275}, DOMESTIC_PARTNER: {MEDICAL: 45125, DENTAL: 3313, VISION: 1275}, CHILD_BIOLOGICAL: {MEDICAL: 27450, DENTAL: 2137, VISION: 913}, STEPCHILD: {MEDICAL: 27450, DENTAL: 2137, VISION: 913}, ADOPTED_CHILD: {MEDICAL: 27450, DENTAL: 2137, VISION: 913}, LEGAL_GUARDIANSHIP: {MEDICAL: 27450, DENTAL: 2137, VISION: 913}, DISABLED_ADULT_CHILD: {MEDICAL: 33188, DENTAL: 2137, VISION: 913} }"
    precision: "round_half_up to whole cents, applied per component (three rounding steps), then summed exactly"

  - name: termination_effective_date
    trigger: "TerminationNotice creation in run-sweep steps S2 and S3"
    algorithm: interval_merge
    formula: |
      grace := TERMINATION_GRACE_DAYS
      if origin == AUDIT_ESCALATION:
          base  := date(notice.issued_at) + grace days
          floor := date(program.response_deadline_at)
          anchor := max(base, floor)
      if origin == POE_LAPSE:
          anchor := date(dependent.poe_deadline_at) + grace days     # no response-deadline floor
      effective_date := last calendar day of the month containing anchor
      continuation_start_date := effective_date + 1 day               # inclusive
      continuation_end_date   := continuation_start_date + CONTINUATION_MONTHS calendar months   # EXCLUSIVE
      continuation_election_deadline := notice.issued_at + CONTINUATION_ELECTION_DAYS days
    input_set: "One notice; the AUDIT_ESCALATION branch also reads program.response_deadline_at as a floor so an early sweep can never end coverage before the response window closes."
    constants:
      TERMINATION_GRACE_DAYS: 14
      APPEAL_WINDOW_DAYS: 30          # an appeal must be filed within 30 days of notice.issued_at
      MAX_APPEAL_ROUNDS: 2            # a remanded appeal may be resubmitted once
    precision: "whole dates; month-end resolution uses the real calendar (e.g. anchor 2026-10-31 -> effective_date 2026-10-31)"

  - name: case_escalation_priority_score
    trigger: "recomputed on every AuditCase mutation and at the start of run-sweep step S2, before ordering"
    algorithm: weighted_scoring
    formula: |
      unverified_ratio := unverified_dependent_count / max(1, in_scope_dependent_count)
      sensitive_flag   := 1 if any in-scope dependent has relationship_type IN
                              {DOMESTIC_PARTNER, STEPCHILD, LEGAL_GUARDIANSHIP} else 0
      reminder_ratio   := reminders_sent_count / max(1, program.max_reminders)
      silence_flag     := 1 if proof_submission_count == 0 else 0
      priority_score   := min(100, round_half_up( 40 * unverified_ratio
                                                + 25 * sensitive_flag
                                                + 20 * reminder_ratio
                                                + 15 * silence_flag ))
      # Sweep step S2 processing order: priority_score DESC, then AuditCase.created_at ASC.
      # Within one case, dependents are processed Dependent.created_at ASC.
      # TerminationNotice.batch_sequence_no is assigned 1..N in exactly that order.
    input_set: "One AuditCase plus its program's max_reminders; ratios use real division and are rounded once at the end."
    constants:
      WEIGHT_UNVERIFIED: 40
      WEIGHT_SENSITIVE_RELATIONSHIP: 25
      WEIGHT_REMINDERS: 20
      WEIGHT_SILENCE: 15
      SCORE_CEILING: 100
    precision: "single round_half_up to an integer after the weighted sum; ceiling applied after rounding"

  - name: reminder_cadence_gap
    trigger: "POST /audit-cases/{id}/reminders"
    algorithm: threshold
    formula: |
      anchor  := AuditCase.last_reminder_at if last_reminder_at != null else AuditCase.notified_at
      gap_days := floor( (current_clock - anchor) / 86400 seconds )    # whole elapsed days
      accepted := gap_days >= program.reminder_min_gap_days            # >= : an exact-gap reminder is allowed
      # rejected -> ERR_REMINDER_CADENCE_VIOLATION; reminders_sent_count == max_reminders -> ERR_REMINDER_LIMIT_REACHED
    input_set: "The case's own CommunicationEvent history; ANNOUNCEMENT anchors the first reminder, each REMINDER anchors the next."
    constants: {}
    precision: "whole days by floor division; 6 days 23:59:59 yields gap_days == 6"

  - name: poe_program_selection
    trigger: "POST /employees/{id}/dependents when poe_program_id is not supplied in the request"
    algorithm: topological
    formula: |
      # (a) eligibility filter:
      candidates := { p in AuditProgram : p.poe_verification_enabled == true
                                      AND p.plan_year == calendar year of the current clock
                                      AND p.status IN {AMNESTY_OPEN, RESPONSE_WINDOW, ESCALATION}
                                      AND a DocumentationRule exists with program_id == p.id
                                          AND phase == POINT_OF_ENROLLMENT
                                          AND relationship_type == request.relationship_type }
      # (b) ranking: created_at ASC   (c) tie-break: amnesty_end_at ASC
      # (d) empty pool fallback: the dependent is created with coverage_status ENROLLED,
      #     poe_program_id null, poe_deadline_at null - no error.
      if |candidates| >= 2 after applying (b) and (c) and the top two still tie on both keys:
          reject with ERR_POE_PROGRAM_AMBIGUOUS (409)
      selected := first of candidates ordered by (created_at ASC, amnesty_end_at ASC)
      poe_deadline_at := current_clock + selected_rule.grace_days days
    input_set: "AuditPrograms of the current plan year in an open phase that publish a POINT_OF_ENROLLMENT rule for the requested relationship_type. An explicit request.poe_program_id bypasses the selector and is validated for existence and rule presence instead."
    constants: {}
    precision: "date arithmetic in whole days on the logical clock"

  - name: amnesty_coverage_end
    trigger: "POST /amnesty-removals"
    algorithm: projection
    formula: |
      coverage_end_date := last calendar day of the month containing date(current_clock)
      audited_savings_contribution_cents := dependent.monthly_cost_cents * (12 - month_no(coverage_end_date))
    input_set: "One dependent and the logical clock at removal time."
    constants: {}
    precision: "whole dates; integer cents"

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is one of the declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "every path-segment resource exists, validated left-to-right"
    error_id: "ERR_PROGRAM_NOT_FOUND | ERR_EMPLOYEE_NOT_FOUND | ERR_DEPENDENT_NOT_FOUND | ERR_CASE_NOT_FOUND | ERR_SUBMISSION_NOT_FOUND | ERR_APPEAL_NOT_FOUND | ERR_NOTICE_NOT_FOUND | ERR_RECOVERY_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path parameters"
  - priority: 4
    category: auth
    check: "when X-User-Role == Employee, the addressed resource resolves to an Employee whose id equals X-User-ID (dependent, case, submission, appeal and notice ownership all resolve through Dependent.employee_id / AuditCase.employee_id)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "GET /employees/{id}, GET /employees/{id}/dependents, GET /dependents/{id}, GET /dependents/{id}/amnesty-removals, GET /termination-notices/{id}, POST /employees/{id}/dependents, POST /proof-submissions, POST /proof-submissions/{id}/redaction, POST /amnesty-removals, POST /appeals, POST /appeals/{id}/resubmit, POST /termination-notices/{id}/continuation-election"
  - priority: 5
    category: business_constraint
    check: "request body shape: required fields present, enum members valid, integers within declared ranges, attestation_signed == true, pagination limit in [1,100] and offset >= 0, Employee.work_email unique"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 6
    category: existence
    check: "every FK supplied in the request body exists"
    error_id: "ERR_EMPLOYEE_NOT_FOUND | ERR_DEPENDENT_NOT_FOUND | ERR_CASE_NOT_FOUND | ERR_NOTICE_NOT_FOUND | ERR_PROGRAM_NOT_FOUND"
    http_status: 404
    applies_to: "POST /proof-submissions, POST /amnesty-removals, POST /appeals, POST /claim-recoveries, POST /employees/{id}/dependents"
  - priority: 7
    category: business_safety
    check: "the assigning X-User-ID does not appear as reviewed_by_user_id on any ProofSubmission of the appeal's dependent (segregation of duties)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /appeals/{id}/assign"
  - priority: 8
    category: business_safety
    check: "the deciding X-User-ID equals Appeal.reviewer_user_id"
    error_id: ERR_APPEAL_REVIEWER_MISMATCH
    http_status: 403
    applies_to: "POST /appeals/{id}/decision"
  - priority: 9
    category: state
    check: "AuditProgram.status permits the operation (scope: DRAFT|SCOPED; communicate: SCOPED; amnesty removal: AMNESTY_OPEN; proof submission: AMNESTY_OPEN|RESPONSE_WINDOW; proof decision: RESPONSE_WINDOW|ESCALATION; close: RECONCILIATION)"
    error_id: ERR_PROGRAM_PHASE_INVALID
    http_status: 409
    applies_to: "all program, case, submission, amnesty and appeal write endpoints"
  - priority: 10
    category: state
    check: "AuditCase.status permits the operation (proof submission and amnesty removal: NOTIFIED|IN_PROGRESS; appeal creation: ESCALATED|NON_RESPONSIVE)"
    error_id: ERR_CASE_STATE_INVALID
    http_status: 409
    applies_to: "POST /proof-submissions, POST /amnesty-removals, POST /appeals, POST /audit-cases/{id}/reminders"
  - priority: 11
    category: state
    check: "Dependent.coverage_status and scope membership permit the operation (proof: PENDING_VERIFICATION and id IN case.in_scope_dependent_ids; amnesty: coverage_status IN {PENDING_VERIFICATION, AMNESTY_REMOVED} and id IN case.in_scope_dependent_ids, the already-removed state being admitted here so the duplicate-removal rule at priority 31 reports ERR_AMNESTY_ALREADY_RECORDED rather than a state error; appeal: TERMINATION_PENDING|TERMINATED; recovery create: TERMINATED and no AmnestyRemoval exists for the dependent)"
    error_id: ERR_DEPENDENT_STATE_INVALID
    http_status: 409
    applies_to: "POST /proof-submissions, POST /amnesty-removals, POST /appeals, POST /claim-recoveries"
  - priority: 12
    category: state
    check: "ProofSubmission.review_status IN {SUBMITTED, UNDER_REVIEW} for a decision; privacy_status == REDACTION_REQUIRED for a redaction upload"
    error_id: ERR_SUBMISSION_STATE_INVALID
    http_status: 409
    applies_to: "POST /proof-submissions/{id}/decision, POST /proof-submissions/{id}/redaction"
  - priority: 13
    category: state
    check: "Appeal.status permits the operation (assign: SUBMITTED; decision: UNDER_REVIEW; resubmit: REMANDED); at most one Appeal per dependent may sit in {SUBMITTED, UNDER_REVIEW, REMANDED}"
    error_id: ERR_APPEAL_STATE_INVALID
    http_status: 409
    applies_to: "POST /appeals, POST /appeals/{id}/assign, POST /appeals/{id}/decision, POST /appeals/{id}/resubmit"
  - priority: 14
    category: state
    check: "TerminationNotice.status == FINAL for recovery creation; status IN {ISSUED, FINAL} and continuation_election_status == NOT_ELECTED for a continuation election"
    error_id: ERR_NOTICE_STATE_INVALID
    http_status: 409
    applies_to: "POST /claim-recoveries, POST /termination-notices/{id}/continuation-election"
  - priority: 15
    category: state
    check: "ClaimRecovery.status == OPEN for issue-demand; status IN {DEMAND_ISSUED, PARTIALLY_RECOVERED} for a payment"
    error_id: ERR_RECOVERY_STATE_INVALID
    http_status: 409
    applies_to: "POST /claim-recoveries/{id}/issue-demand, POST /claim-recoveries/{id}/payments"
  - priority: 16
    category: state
    check: "expected_program_version equals AuditProgram.version (OCC, concurrency_rules.scope-run-stale-program)"
    error_id: ERR_STALE_PROGRAM_VERSION
    http_status: 412
    applies_to: "POST /audit-programs/{id}/scope"
  - priority: 17
    category: state
    check: "expected_dependent_version equals Dependent.version (OCC, concurrency_rules.recovery-create-stale-dependent)"
    error_id: ERR_STALE_DEPENDENT_VERSION
    http_status: 412
    applies_to: "POST /claim-recoveries"
  - priority: 18
    category: business_safety
    check: "a submission whose proof_type is in constants.SENSITIVE_PROOF_TYPES must carry redaction_applied == true"
    error_id: ERR_PRIVACY_REDACTION_REQUIRED
    http_status: 422
    applies_to: "POST /proof-submissions"
  - priority: 19
    category: business_safety
    check: "an ACCEPT decision requires privacy_status IN {NOT_REQUIRED, REDACTED}"
    error_id: ERR_PRIVACY_HOLD
    http_status: 422
    applies_to: "POST /proof-submissions/{id}/decision"
  - priority: 20
    category: business_temporal
    check: "current clock <= AuditProgram.amnesty_end_at (inclusive at the boundary instant)"
    error_id: ERR_AMNESTY_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /amnesty-removals"
  - priority: 21
    category: business_temporal
    check: "current clock <= AuditProgram.response_deadline_at (inclusive at the boundary instant)"
    error_id: ERR_RESPONSE_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /proof-submissions"
  - priority: 22
    category: business_temporal
    check: "current clock <= the dependent's non-rescinded TerminationNotice.issued_at + constants.APPEAL_WINDOW_DAYS days"
    error_id: ERR_APPEAL_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /appeals"
  - priority: 23
    category: business_temporal
    check: "current clock <= TerminationNotice.continuation_election_deadline"
    error_id: ERR_CONTINUATION_ELECTION_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /termination-notices/{id}/continuation-election"
  - priority: 24
    category: business_temporal
    check: "calculations.reminder_cadence_gap: gap_days >= AuditProgram.reminder_min_gap_days measured from last_reminder_at, or from notified_at for the first reminder"
    error_id: ERR_REMINDER_CADENCE_VIOLATION
    http_status: 409
    applies_to: "POST /audit-cases/{id}/reminders"
  - priority: 25
    category: business_constraint
    check: "AuditCase.reminders_sent_count < AuditProgram.max_reminders"
    error_id: ERR_REMINDER_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /audit-cases/{id}/reminders"
  - priority: 26
    category: business_constraint
    check: "no case Employee already holds an AuditCase with status IN {NOTIFIED, IN_PROGRESS, NON_RESPONSIVE, ESCALATED} whose program's closed response-window date interval [date(announcement_at), date(response_deadline_at)] intersects this program's projected window [date(clock), date(clock) + response_days days]; endpoints that touch (shared boundary date) DO collide"
    error_id: ERR_CASE_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /audit-programs/{id}/communicate"
  - priority: 27
    category: business_referential
    check: "proof_type is a member of the AUDIT-phase DocumentationRule.acceptable_proof_types for the dependent's relationship_type"
    error_id: ERR_PROOF_TYPE_NOT_ACCEPTED
    http_status: 422
    applies_to: "POST /proof-submissions"
  - priority: 28
    category: business_referential
    check: "when proof_type is in constants.RECENCY_SCOPED_PROOF_TYPES, document_date >= date(program.announcement_at) - DocumentationRule.requires_recency_days days"
    error_id: ERR_PROOF_STALE_DOCUMENT
    http_status: 422
    applies_to: "POST /proof-submissions"
  - priority: 29
    category: business_referential
    check: "grounds DOMESTIC_PARTNERSHIP_AFFIDAVIT requires affidavit_reference != null AND the AUDIT DocumentationRule for the dependent's relationship_type has affidavit_allowed == true; grounds CUSTODY_ARRANGEMENT requires custody_order_reference != null AND relationship_type IN {CHILD_BIOLOGICAL, STEPCHILD, ADOPTED_CHILD, LEGAL_GUARDIANSHIP}"
    error_id: ERR_APPEAL_GROUNDS_UNSUPPORTED
    http_status: 422
    applies_to: "POST /appeals"
  - priority: 30
    category: business_constraint
    check: "Appeal.round_number < constants.MAX_APPEAL_ROUNDS on resubmit and on REMAND"
    error_id: ERR_APPEAL_ROUNDS_EXHAUSTED
    http_status: 409
    applies_to: "POST /appeals/{id}/resubmit, POST /appeals/{id}/decision"
  - priority: 31
    category: business_constraint
    check: "no AmnestyRemoval already exists for the dependent"
    error_id: ERR_AMNESTY_ALREADY_RECORDED
    http_status: 409
    applies_to: "POST /amnesty-removals"
  - priority: 32
    category: business_referential
    check: "an AUDIT-phase DocumentationRule exists for every relationship_type in the selected dependent set (scope) and for the submitted dependent (submission)"
    error_id: ERR_DOCUMENTATION_RULE_MISSING
    http_status: 422
    applies_to: "POST /audit-programs/{id}/scope, POST /proof-submissions"
  - priority: 33
    category: business_constraint
    check: "(program_id, relationship_type, phase) is unique; grace_days present iff phase == POINT_OF_ENROLLMENT"
    error_id: ERR_DOCUMENTATION_RULE_CONFLICT
    http_status: 409
    applies_to: "POST /audit-programs/{id}/documentation-rules"
  - priority: 34
    category: business_constraint
    check: "scope_type TARGETED requires a non-empty targeted_employee_ids; NEW_DEPENDENT_ONLY requires new_dependent_since_date; FULL_CENSUS forbids both"
    error_id: ERR_SCOPE_PARAMETERS_INVALID
    http_status: 422
    applies_to: "POST /audit-programs/{id}/scope"
  - priority: 35
    category: business_constraint
    check: "calculations.scope_candidate_selection yields at least one candidate Employee"
    error_id: ERR_SCOPE_EMPTY
    http_status: 422
    applies_to: "POST /audit-programs/{id}/scope"
  - priority: 36
    category: business_constraint
    check: "calculations.poe_program_selection resolves to at most one program after ranking and tie-break"
    error_id: ERR_POE_PROGRAM_AMBIGUOUS
    http_status: 409
    applies_to: "POST /employees/{id}/dependents"
  - priority: 37
    category: business_constraint
    check: "(plan_year, program_name) is unique across AuditProgram"
    error_id: ERR_DUPLICATE_PROGRAM
    http_status: 409
    applies_to: "POST /audit-programs"
  - priority: 38
    category: business_fiscal
    check: "waiver_credit_cents <= recoverable_subtotal_cents"
    error_id: ERR_WAIVER_EXCEEDS_SUBTOTAL
    http_status: 422
    applies_to: "POST /claim-recoveries/{id}/issue-demand"
  - priority: 39
    category: business_fiscal
    check: "recoverable_subtotal_cents >= constants.DE_MINIMIS_RECOVERY_CENTS (25000); exactly 25000 passes"
    error_id: ERR_RECOVERY_BELOW_DE_MINIMIS
    http_status: 422
    applies_to: "POST /claim-recoveries/{id}/issue-demand"
  - priority: 40
    category: business_fiscal
    check: "recovered_cents + amount_cents <= net_demand_cents"
    error_id: ERR_PAYMENT_EXCEEDS_DEMAND
    http_status: 422
    applies_to: "POST /claim-recoveries/{id}/payments"
  - priority: 41
    category: business_constraint
    check: "no Appeal of this program's cases has status IN {SUBMITTED, UNDER_REVIEW, REMANDED}"
    error_id: ERR_OPEN_APPEALS_REMAIN
    http_status: 409
    applies_to: "POST /audit-programs/{id}/close"
  - priority: 42
    category: business_constraint
    check: "no ClaimRecovery of this program's in-scope dependents has status IN {DEMAND_ISSUED, PARTIALLY_RECOVERED}"
    error_id: ERR_OPEN_RECOVERIES_REMAIN
    http_status: 409
    applies_to: "POST /audit-programs/{id}/close"

endpoints:
  # ---------- clock ----------
  - method: POST
    path: /_clock/set_current_utc
    code: 200
    description: "Set the deterministic logical clock. The clock starts at 2026-08-01T00:00:00Z on a fresh process; every timestamp field, window check and effective-date calculation reads this clock."
    input:
      - to_iso8601
    output: "inline { current_utc: datetime }"
    side_effects:
      - "the logical clock is set to to_iso8601; no entity is mutated"
    roles: [ProgramAdmin, VerificationAnalyst, AppealReviewer, RecoveryAgent]
  # ---------- employees and dependents ----------
  - method: POST
    path: /employees
    code: 201
    description: "Register a benefits-enrolled employee."
    input:
      - full_name
      - work_email
      - coverage_tier
      - employer_monthly_premium_cents
      - hire_date
    output: Employee
    side_effects:
      - "Employee created with enrolled_dependent_count = 0"
    roles: [ProgramAdmin]
  - method: GET
    path: /employees/{id}
    code: 200
    description: "Read one employee."
    input: []
    output: Employee
    side_effects: []
    roles: [ProgramAdmin, VerificationAnalyst, AppealReviewer, RecoveryAgent, Employee]
  - method: POST
    path: /employees/{id}/dependents
    code: 201
    description: "Enroll a dependent. When a POINT_OF_ENROLLMENT rule set applies, calculations.poe_program_selection binds the dependent to a program and opens a point-of-enrollment verification window instead of enrolling outright."
    input:
      - relationship_type
      - full_name
      - date_of_birth
      - monthly_cost_cents
    output: Dependent
    side_effects:
      - "Dependent created with enrolled_at = clock"
      - "calculations.poe_program_selection resolves poe_program_id; when a program is selected, coverage_status = PENDING_VERIFICATION, poe_deadline_at = clock + POINT_OF_ENROLLMENT DocumentationRule.grace_days days, and accepted_proof_type_count = 0 with documentation_complete = false; otherwise coverage_status = ENROLLED, poe_program_id = null and poe_deadline_at = null"
      - "Employee.enrolled_dependent_count incremented"
    roles: [ProgramAdmin, Employee]
  - method: GET
    path: /employees/{id}/dependents
    code: 200
    description: "List an employee's dependents (FK reverse lookup on Dependent.employee_id)."
    input:
      - coverage_status?
      - limit?
      - offset?
    output: "Dependent[]"
    side_effects: []
    roles: [ProgramAdmin, VerificationAnalyst, AppealReviewer, RecoveryAgent, Employee]
  - method: GET
    path: /dependents/{id}
    code: 200
    description: "Read one dependent."
    input: []
    output: Dependent
    side_effects: []
    roles: [ProgramAdmin, VerificationAnalyst, AppealReviewer, RecoveryAgent, Employee]
  - method: POST
    path: /dependents/{id}/paid-claims
    code: 201
    description: "Record a claim already paid on behalf of the dependent; the recovery calculation reads these lines."
    input:
      - service_date
      - paid_cents
      - employee_premium_offset_cents?
      - claim_reference
      - provider_type?
    output: PaidClaimLine
    side_effects:
      - "PaidClaimLine created (immutable)"
      - "Dependent.paid_claims_total_cents increased by paid_cents"
    roles: [ProgramAdmin, RecoveryAgent]
  - method: GET
    path: /dependents/{id}/paid-claims
    code: 200
    description: "List paid claim lines for a dependent (FK reverse lookup on PaidClaimLine.dependent_id)."
    input:
      - limit?
      - offset?
    output: "PaidClaimLine[]"
    side_effects: []
    roles: [ProgramAdmin, RecoveryAgent, VerificationAnalyst]
  - method: GET
    path: /dependents/{id}/amnesty-removals
    code: 200
    description: "List amnesty removals recorded for a dependent (FK reverse lookup on AmnestyRemoval.dependent_id)."
    input:
      - limit?
      - offset?
    output: "AmnestyRemoval[]"
    side_effects: []
    roles: [ProgramAdmin, VerificationAnalyst, RecoveryAgent, Employee]
  # ---------- audit programs ----------
  - method: POST
    path: /audit-programs
    code: 201
    description: "Create an audit program in DRAFT."
    input:
      - program_name
      - plan_year
      - amnesty_days?
      - response_days?
      - reminder_min_gap_days?
      - max_reminders?
      - poe_verification_enabled?
    output: AuditProgram
    side_effects:
      - "AuditProgram created with status = DRAFT, scope_type = null, all counters 0 and all money ledgers 0"
    roles: [ProgramAdmin]
  - method: GET
    path: /audit-programs/{id}
    code: 200
    description: "Read one audit program including its counters and money ledgers."
    input: []
    output: AuditProgram
    side_effects: []
    roles: [ProgramAdmin, VerificationAnalyst, AppealReviewer, RecoveryAgent]
  - method: GET
    path: /audit-programs
    code: 200
    description: "List audit programs."
    input:
      - status?
      - plan_year?
      - limit?
      - offset?
    output: "AuditProgram[]"
    side_effects: []
    roles: [ProgramAdmin, VerificationAnalyst, AppealReviewer, RecoveryAgent]
  - method: POST
    path: /audit-programs/{id}/documentation-rules
    code: 201
    description: "Declare the documentation requirement for one relationship_type in one phase."
    input:
      - relationship_type
      - phase
      - acceptable_proof_types
      - min_accepted_documents
      - affidavit_allowed?
      - requires_recency_days?
      - grace_days?
      - auto_terminate_on_lapse?
    output: DocumentationRule
    side_effects:
      - "DocumentationRule created"
    roles: [ProgramAdmin]
  - method: GET
    path: /audit-programs/{id}/documentation-rules
    code: 200
    description: "List a program's documentation rules (FK reverse lookup on DocumentationRule.program_id)."
    input:
      - phase?
      - relationship_type?
      - limit?
      - offset?
    output: "DocumentationRule[]"
    side_effects: []
    roles: [ProgramAdmin, VerificationAnalyst, AppealReviewer]
  - method: GET
    path: /audit-programs/{id}/dependents
    code: 200
    description: "List dependents bound to this program for point-of-enrollment verification (FK reverse lookup on Dependent.poe_program_id)."
    input:
      - coverage_status?
      - limit?
      - offset?
    output: "Dependent[]"
    side_effects: []
    roles: [ProgramAdmin, VerificationAnalyst]
  - method: POST
    path: /audit-programs/{id}/scope
    code: 200
    description: "Decide audit scope and materialise one AuditCase per selected employee. Re-scoping a SCOPED program supersedes the previous case set."
    input:
      - expected_program_version
      - scope_type
      - targeted_employee_ids?
      - new_dependent_since_date?
    output: AuditProgram
    side_effects:
      - "calculations.scope_candidate_selection selects employees; one AuditCase per employee is created in SELECTED with priority_score = 0 and in_scope_dependent_ids = the employee's ENROLLED dependents ordered by created_at ASC"
      - "every selected Dependent moves ENROLLED -> PENDING_VERIFICATION and Employee.enrolled_dependent_count is recomputed"
      - "on re-scope, every AuditCase of the previous set that is still in SELECTED moves to VOIDED first and each of its dependents moves PENDING_VERIFICATION -> ENROLLED"
      - "AuditProgram.status = SCOPED, scope_type set, in_scope_case_count, in_scope_dependent_count and pending_dependent_count refreshed, version incremented"
    roles: [ProgramAdmin]
  - method: POST
    path: /audit-programs/{id}/communicate
    code: 200
    description: "Publish the audit announcement: opens the amnesty period and the response window and notifies every selected case."
    input:
      - channel
      - template_code?
    output: AuditProgram
    side_effects:
      - "AuditProgram.status = AMNESTY_OPEN, announcement_at = clock, amnesty_end_at = clock + amnesty_days days, response_deadline_at = clock + response_days days"
      - "every AuditCase in SELECTED moves to NOTIFIED with notified_at = clock and communication_sequence_no = 1"
      - "one CommunicationEvent kind = ANNOUNCEMENT per notified case with sequence_no = 1"
    roles: [ProgramAdmin]
  - method: POST
    path: /audit-programs/{id}/run-sweep
    code: 200
    description: "Run the deferred-action checkpoint. One call executes steps S1..S6 in order against the current logical clock; every step whose preconditions fail is a no-op, so the endpoint is safe to call repeatedly. sweep_epoch and version increment once per call that mutated anything."
    input: []
    output: AuditProgram
    side_effects:
      - "S1 (amnesty close): status == AMNESTY_OPEN and clock >= amnesty_end_at -> status = RESPONSE_WINDOW; no case or dependent changes"
      - "S2 (audit escalation): status == RESPONSE_WINDOW and clock >= response_deadline_at -> status = ESCALATION; calculations.case_escalation_priority_score is recomputed for every case in NOTIFIED or IN_PROGRESS and those cases are processed priority_score DESC then created_at ASC; each moves to NON_RESPONSIVE (non_responsive_at = clock); each of its in-scope dependents still in PENDING_VERIFICATION (ordered created_at ASC) moves to TERMINATION_PENDING and receives one TerminationNotice in ISSUED with origin = AUDIT_ESCALATION, issued_at = clock, grace_days_applied = TERMINATION_GRACE_DAYS, effective_date per calculations.termination_effective_date, continuation_election_deadline = issued_at + CONTINUATION_ELECTION_DAYS days, continuation_monthly_premium_cents = 0 (populated only on election) and batch_sequence_no assigned 1..N in that processing order; one CommunicationEvent kind = TERMINATION_NOTICE per notice; each case that received a notice moves NON_RESPONSIVE -> ESCALATED (escalated_at = clock); non_responsive_case_count, pending_dependent_count, termination_pending_count and provisional_annual_savings_cents are recomputed"
      - "S3 (point-of-enrollment lapse): every Dependent with poe_program_id == this program, coverage_status == PENDING_VERIFICATION, clock >= poe_deadline_at, documentation_complete == false and the POINT_OF_ENROLLMENT DocumentationRule.auto_terminate_on_lapse == true (ordered created_at ASC) moves to TERMINATION_PENDING and receives one TerminationNotice in ISSUED with origin = POE_LAPSE, case_id = null and effective_date per the POE_LAPSE branch of calculations.termination_effective_date"
      - "S4 (finalization): every TerminationNotice in ISSUED whose effective_date < date(clock) moves to FINAL and its Dependent moves TERMINATION_PENDING -> TERMINATED with coverage_end_date = effective_date; every AuditCase in ESCALATED whose notices are all FINAL or RESCINDED, whose in-scope dependents are all resolved and whose every notice is past its APPEAL_WINDOW_DAYS appeal window (clock > issued_at + 30 days) moves to CLOSED; terminated_dependent_count, termination_pending_count and audited_annual_savings_cents are recomputed"
      - "S5 (reconciliation): status == ESCALATION and every AuditCase of the program is COMPLETE, CLOSED or VOIDED -> status = RECONCILIATION; audited_annual_savings_cents, recovery_ledger_cents, recovered_total_cents and refund_due_total_cents are recomputed"
      - "S6 (election expiry): every TerminationNotice in ISSUED or FINAL with continuation_election_status == NOT_ELECTED and clock > continuation_election_deadline moves to continuation_election_status = WINDOW_EXPIRED"
      - "sweep_epoch and version increment by 1 when any of S1..S6 mutated state"
    roles: [ProgramAdmin]
  - method: POST
    path: /audit-programs/{id}/measure-savings
    code: 200
    description: "Run calculations.savings_measurement in the requested variant and post the result to the program."
    input:
      - variant
    output: AuditProgram
    side_effects:
      - "PROVISIONAL: provisional_annual_savings_cents recomputed from relationship-type standard costs"
      - "AUDITED: audited_annual_savings_cents recomputed from realised coverage_end_date exposure"
      - "last_savings_variant set to the requested variant"
    roles: [ProgramAdmin]
  - method: POST
    path: /audit-programs/{id}/close
    code: 200
    description: "Close the program once no appeal and no recovery is open; purges sensitive documentation."
    input: []
    output: AuditProgram
    side_effects:
      - "AuditProgram.status = CLOSED and version incremented"
      - "every AuditCase of the program in COMPLETE moves to CLOSED"
      - "every ProofSubmission of the program with privacy_class == SENSITIVE and review_status == ACCEPTED moves to privacy_status = PURGED (document_reference is retained for audit)"
      - "every ClaimRecovery of the program's dependents in OPEN moves to WRITTEN_OFF"
      - "audited_annual_savings_cents recomputed"
    roles: [ProgramAdmin]
  # ---------- audit cases ----------
  - method: GET
    path: /audit-cases/{id}
    code: 200
    description: "Read one audit case."
    input: []
    output: AuditCase
    side_effects: []
    roles: [ProgramAdmin, VerificationAnalyst, AppealReviewer, RecoveryAgent]
  - method: GET
    path: /audit-cases
    code: 200
    description: "List audit cases (FK reverse lookup on AuditCase.program_id and AuditCase.employee_id)."
    input:
      - program_id?
      - employee_id?
      - status?
      - limit?
      - offset?
    output: "AuditCase[]"
    side_effects: []
    roles: [ProgramAdmin, VerificationAnalyst, AppealReviewer, RecoveryAgent]
  - method: POST
    path: /audit-cases/{id}/reminders
    code: 200
    description: "Send one reminder against an unresolved case, subject to the cadence gap and the reminder cap."
    input:
      - channel
      - template_code?
    output: AuditCase
    side_effects:
      - "AuditCase.reminders_sent_count incremented, last_reminder_at = clock, communication_sequence_no incremented"
      - "one CommunicationEvent kind = REMINDER with sequence_no = the new communication_sequence_no"
      - "AuditCase.priority_score recomputed per calculations.case_escalation_priority_score"
    roles: [ProgramAdmin, VerificationAnalyst]
  - method: GET
    path: /audit-cases/{id}/communications
    code: 200
    description: "List communication events for a case (FK reverse lookup on CommunicationEvent.case_id)."
    input:
      - kind?
      - limit?
      - offset?
    output: "CommunicationEvent[]"
    side_effects: []
    roles: [ProgramAdmin, VerificationAnalyst, AppealReviewer]
  - method: GET
    path: /audit-cases/{id}/amnesty-removals
    code: 200
    description: "List amnesty removals recorded under a case (FK reverse lookup on AmnestyRemoval.case_id)."
    input:
      - limit?
      - offset?
    output: "AmnestyRemoval[]"
    side_effects: []
    roles: [ProgramAdmin, VerificationAnalyst, RecoveryAgent]
  # ---------- proof submissions ----------
  - method: POST
    path: /proof-submissions
    code: 201
    description: "Submit one proof document for an in-scope dependent."
    input:
      - case_id
      - dependent_id
      - proof_type
      - document_reference
      - document_date
      - redaction_applied?
    output: ProofSubmission
    side_effects:
      - "ProofSubmission created in review_status = SUBMITTED with privacy_class from constants.PROOF_PRIVACY_CLASS and privacy_status = REDACTED when the proof_type is sensitive and redaction_applied is true, otherwise NOT_REQUIRED"
      - "AuditCase moves from NOTIFIED to IN_PROGRESS on the first response and AuditCase.proof_submission_count is incremented; communication_sequence_no is unchanged"
      - "AuditCase.priority_score and AuditProgram.responded_case_count recomputed"
    roles: [Employee, VerificationAnalyst]
  - method: GET
    path: /proof-submissions/{id}
    code: 200
    description: "Read one proof submission."
    input: []
    output: ProofSubmission
    side_effects: []
    roles: [ProgramAdmin, VerificationAnalyst, AppealReviewer]
  - method: GET
    path: /proof-submissions
    code: 200
    description: "List proof submissions (FK reverse lookup on ProofSubmission.case_id and ProofSubmission.dependent_id)."
    input:
      - case_id?
      - dependent_id?
      - review_status?
      - privacy_status?
      - limit?
      - offset?
    output: "ProofSubmission[]"
    side_effects: []
    roles: [ProgramAdmin, VerificationAnalyst, AppealReviewer]
  - method: POST
    path: /proof-submissions/{id}/decision
    code: 200
    description: "Analyst decision on a submission: ACCEPT, REJECT, or REQUEST_REDACTION."
    input:
      - decision
      - reason_code?
      - reviewer_note?
    output: ProofSubmission
    side_effects:
      - "review_status = ACCEPTED | REJECTED for ACCEPT | REJECT, or SUBMITTED -> UNDER_REVIEW for REQUEST_REDACTION while the privacy dimension moves to privacy_status = REDACTION_REQUIRED; reviewed_by_user_id = X-User-ID, decided_at = clock, decision_reason_code set"
      - "on ACCEPT, calculations.documentation_completeness is re-evaluated and Dependent.accepted_proof_type_count is refreshed; when the dependent becomes documentation_complete it moves PENDING_VERIFICATION -> VERIFIED with documentation_complete = true, AuditCase.unverified_dependent_count and priority_score are recomputed and AuditProgram.verified_dependent_count and pending_dependent_count are recomputed"
      - "when every in-scope dependent of the case is resolved the AuditCase moves to COMPLETE with completed_at = clock"
    roles: [VerificationAnalyst]
  - method: POST
    path: /proof-submissions/{id}/redaction
    code: 200
    description: "Upload the redacted replacement for a submission held for privacy."
    input:
      - redacted_document_reference
    output: ProofSubmission
    side_effects:
      - "privacy_status = REDACTED and redacted_document_reference set; review_status is left unchanged (parallel dimension - it is UNDER_REVIEW because only a REQUEST_REDACTION decision can set REDACTION_REQUIRED)"
    roles: [Employee, VerificationAnalyst]
  # ---------- amnesty ----------
  - method: POST
    path: /amnesty-removals
    code: 201
    description: "Voluntarily remove a dependent during the amnesty period, without penalty and without claims recovery."
    input:
      - dependent_id
      - case_id
      - reason_code
      - attestation_signed
    output: AmnestyRemoval
    side_effects:
      - "AmnestyRemoval created (immutable) with recorded_at = clock, penalty_waived = true, claims_recovery_waived = true, coverage_end_date per calculations.amnesty_coverage_end and audited_savings_contribution_cents per the AUDITED savings variant"
      - "Dependent moves to AMNESTY_REMOVED with coverage_end_date = the removal's coverage_end_date"
      - "AuditCase moves NOTIFIED -> IN_PROGRESS on the first response, unverified_dependent_count and priority_score are recomputed, and when every in-scope dependent is resolved the case moves to COMPLETE with completed_at = clock"
      - "AuditProgram.amnesty_removed_count and pending_dependent_count recomputed; audited_annual_savings_cents increased by the removal's audited_savings_contribution_cents and provisional_annual_savings_cents recomputed"
      - "one CommunicationEvent kind = AMNESTY_CONFIRMATION"
    roles: [Employee, ProgramAdmin]
  # ---------- appeals ----------
  - method: POST
    path: /appeals
    code: 201
    description: "Appeal a documentation exception such as a domestic partnership affidavit or a custody arrangement."
    input:
      - case_id
      - dependent_id
      - grounds
      - statement
      - affidavit_reference?
      - custody_order_reference?
    output: Appeal
    side_effects:
      - "Appeal created in SUBMITTED with round_number = 1, reviewer_user_id = null"
    roles: [Employee]
  - method: GET
    path: /appeals/{id}
    code: 200
    description: "Read one appeal."
    input: []
    output: Appeal
    side_effects: []
    roles: [ProgramAdmin, AppealReviewer, VerificationAnalyst]
  - method: GET
    path: /appeals
    code: 200
    description: "List appeals (FK reverse lookup on Appeal.case_id and Appeal.dependent_id)."
    input:
      - case_id?
      - dependent_id?
      - status?
      - limit?
      - offset?
    output: "Appeal[]"
    side_effects: []
    roles: [ProgramAdmin, AppealReviewer, VerificationAnalyst]
  - method: POST
    path: /appeals/{id}/assign
    code: 200
    description: "An appeal reviewer takes the appeal. Segregation of duties: a user who reviewed any proof submission of the appealed dependent may not take the appeal."
    input: []
    output: Appeal
    side_effects:
      - "Appeal.status = UNDER_REVIEW, reviewer_user_id = X-User-ID, assigned_at = clock"
    roles: [AppealReviewer]
  - method: POST
    path: /appeals/{id}/decision
    code: 200
    description: "Decide the appeal: GRANT reinstates coverage and compensates every downstream side effect, DENY confirms termination, REMAND returns the appeal for one more round."
    input:
      - decision
      - decision_rationale?
      - remand_reason?
    output: Appeal
    side_effects:
      - "Appeal.status = GRANTED | DENIED | REMANDED, decided_at = clock, decision_rationale set (remand_reason set for REMANDED)"
      - "on GRANT (compensating cascade, in this order): the Dependent moves TERMINATION_PENDING -> VERIFIED with documentation_complete = true, or TERMINATED -> REINSTATED with reinstated_at = clock and coverage_end_date = null; every TerminationNotice of that dependent in ISSUED or FINAL moves to RESCINDED with rescinded_at = clock and rescission_reason = APPEAL_GRANTED; one CommunicationEvent kind = RESCISSION_NOTICE is appended to the case; every ClaimRecovery of that dependent in OPEN, DEMAND_ISSUED or PARTIALLY_RECOVERED moves to VOIDED with refund_due_cents = recovered_cents; the AuditCase moves ESCALATED -> IN_PROGRESS, or ESCALATED -> COMPLETE when the restored dependent was the last unresolved one; AuditProgram.verified_dependent_count, terminated_dependent_count, termination_pending_count, non_responsive_case_count, recovery_ledger_cents, recovered_total_cents, refund_due_total_cents, provisional_annual_savings_cents and audited_annual_savings_cents are recomputed"
      - "on DENY: the TerminationNotice proceeds unchanged; when the case has no other unresolved dependent it moves to COMPLETE"
      - "on REMAND: remand_reason recorded; the notice, the dependent and the case are untouched"
    roles: [AppealReviewer]
  - method: POST
    path: /appeals/{id}/resubmit
    code: 200
    description: "Resubmit a remanded appeal with additional documentation; increments the appeal round."
    input:
      - statement
      - affidavit_reference?
      - custody_order_reference?
    output: Appeal
    side_effects:
      - "Appeal.status = SUBMITTED, round_number incremented, remand_reason cleared, reviewer_user_id and assigned_at cleared so the appeal must be re-assigned"
    roles: [Employee]
  # ---------- termination notices ----------
  - method: GET
    path: /termination-notices/{id}
    code: 200
    description: "Read one termination notice with its continuation coverage rights."
    input: []
    output: TerminationNotice
    side_effects: []
    roles: [ProgramAdmin, VerificationAnalyst, AppealReviewer, RecoveryAgent, Employee]
  - method: GET
    path: /termination-notices
    code: 200
    description: "List termination notices (FK reverse lookup on TerminationNotice.dependent_id and TerminationNotice.case_id)."
    input:
      - dependent_id?
      - case_id?
      - status?
      - origin?
      - limit?
      - offset?
    output: "TerminationNotice[]"
    side_effects: []
    roles: [ProgramAdmin, VerificationAnalyst, AppealReviewer, RecoveryAgent]
  - method: POST
    path: /termination-notices/{id}/continuation-election
    code: 200
    description: "Elect or waive continuation coverage before the election deadline."
    input:
      - election
    output: TerminationNotice
    side_effects:
      - "continuation_election_status = ELECTED for election ELECT, WAIVED for election WAIVE; continuation_elected_at = clock"
      - "on ELECT: continuation_monthly_premium_cents = calculations.continuation_premium, continuation_start_date = effective_date + 1 day and continuation_end_date = continuation_start_date + CONTINUATION_MONTHS calendar months (EXCLUSIVE end)"
      - "on WAIVE: continuation_monthly_premium_cents stays 0 and both continuation dates stay null"
    roles: [Employee, ProgramAdmin]
  # ---------- claims recovery ----------
  - method: POST
    path: /claim-recoveries
    code: 201
    description: "Open a claims recovery for a dependent whose termination is final, in the STRICT or EQUITABLE variant."
    input:
      - dependent_id
      - termination_notice_id
      - recovery_variant
      - ineligibility_onset_date
      - expected_dependent_version
    output: ClaimRecovery
    side_effects:
      - "ClaimRecovery created in OPEN with recoverable_subtotal_cents per calculations.claims_recovery_amount, admin_fee_cents = 0, waiver_credit_cents = 0, net_demand_cents = 0, recovered_cents = 0, refund_due_cents = 0"
      - "any prior ClaimRecovery of the same dependent in OPEN, or in DEMAND_ISSUED with recovered_cents == 0, moves to SUPERSEDED and AuditProgram.recovery_ledger_cents is recomputed to exclude it"
      - "Dependent.recovery_revision incremented and Dependent.version incremented"
    roles: [RecoveryAgent]
  - method: GET
    path: /claim-recoveries/{id}
    code: 200
    description: "Read one claims recovery."
    input: []
    output: ClaimRecovery
    side_effects: []
    roles: [ProgramAdmin, RecoveryAgent, AppealReviewer]
  - method: GET
    path: /claim-recoveries
    code: 200
    description: "List claims recoveries (FK reverse lookup on ClaimRecovery.dependent_id and ClaimRecovery.termination_notice_id)."
    input:
      - dependent_id?
      - termination_notice_id?
      - status?
      - recovery_variant?
      - limit?
      - offset?
    output: "ClaimRecovery[]"
    side_effects: []
    roles: [ProgramAdmin, RecoveryAgent, AppealReviewer]
  - method: POST
    path: /claim-recoveries/{id}/issue-demand
    code: 200
    description: "Price and issue the recovery demand: applies the tiered administrative fee and any waiver credit."
    input:
      - waiver_credit_cents?
    output: ClaimRecovery
    side_effects:
      - "calculations.net_recovery_demand sets admin_fee_pct, admin_fee_cents and net_demand_cents"
      - "ClaimRecovery.status = DEMAND_ISSUED, demand_issued_at = clock"
      - "AuditProgram.recovery_ledger_cents recomputed (the row's net_demand_cents now counts)"
    roles: [RecoveryAgent]
  - method: POST
    path: /claim-recoveries/{id}/payments
    code: 200
    description: "Apply a payment against an issued demand."
    input:
      - amount_cents
      - received_date
    output: ClaimRecovery
    side_effects:
      - "recovered_cents increased by amount_cents; status = RECOVERED when recovered_cents == net_demand_cents, otherwise PARTIALLY_RECOVERED"
      - "AuditProgram.recovered_total_cents recomputed; recovery_ledger_cents is unchanged because a RECOVERED row still counts toward the ledger"
    roles: [RecoveryAgent]

errors:
  # --- authentication / authorization ---
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or the role is not one of the five declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed in the endpoint's roles"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "an Employee-role caller addresses a resource that does not resolve to their own Employee id"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the assigning appeal reviewer has already reviewed a proof submission of the appealed dependent"
  - id: ERR_APPEAL_REVIEWER_MISMATCH
    http: 403
    condition: "an appeal decision is attempted by a user who is not the appeal's assigned reviewer"
  # --- existence ---
  - id: ERR_PROGRAM_NOT_FOUND
    http: 404
    condition: "the addressed or referenced AuditProgram does not exist"
  - id: ERR_EMPLOYEE_NOT_FOUND
    http: 404
    condition: "the addressed or referenced Employee does not exist"
  - id: ERR_DEPENDENT_NOT_FOUND
    http: 404
    condition: "the addressed or referenced Dependent does not exist"
  - id: ERR_CASE_NOT_FOUND
    http: 404
    condition: "the addressed or referenced AuditCase does not exist"
  - id: ERR_SUBMISSION_NOT_FOUND
    http: 404
    condition: "the addressed ProofSubmission does not exist"
  - id: ERR_APPEAL_NOT_FOUND
    http: 404
    condition: "the addressed Appeal does not exist"
  - id: ERR_NOTICE_NOT_FOUND
    http: 404
    condition: "the addressed or referenced TerminationNotice does not exist"
  - id: ERR_RECOVERY_NOT_FOUND
    http: 404
    condition: "the addressed ClaimRecovery does not exist"
  # --- request shape ---
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, unknown enum member, out-of-range integer, attestation_signed not true, pagination outside limit 1..100 / offset >= 0, or duplicate Employee.work_email"
  # --- state ---
  - id: ERR_PROGRAM_PHASE_INVALID
    http: 409
    condition: "AuditProgram.status does not permit the requested operation"
  - id: ERR_CASE_STATE_INVALID
    http: 409
    condition: "AuditCase.status does not permit the requested operation"
  - id: ERR_DEPENDENT_STATE_INVALID
    http: 409
    condition: "Dependent.coverage_status or scope membership does not permit the requested operation"
  - id: ERR_SUBMISSION_STATE_INVALID
    http: 409
    condition: "ProofSubmission.review_status or privacy_status does not permit the requested operation"
  - id: ERR_APPEAL_STATE_INVALID
    http: 409
    condition: "Appeal.status does not permit the requested operation, or the dependent already has an open appeal"
  - id: ERR_NOTICE_STATE_INVALID
    http: 409
    condition: "TerminationNotice.status or continuation_election_status does not permit the requested operation"
  - id: ERR_RECOVERY_STATE_INVALID
    http: 409
    condition: "ClaimRecovery.status does not permit the requested operation"
  # --- optimistic concurrency ---
  - id: ERR_STALE_PROGRAM_VERSION
    http: 412
    condition: "expected_program_version does not match the AuditProgram's current version"
  - id: ERR_STALE_DEPENDENT_VERSION
    http: 412
    condition: "expected_dependent_version does not match the Dependent's current version"
  # --- privacy / compliance ---
  - id: ERR_PRIVACY_REDACTION_REQUIRED
    http: 422
    condition: "a sensitive proof type is submitted without redaction_applied = true"
  - id: ERR_PRIVACY_HOLD
    http: 422
    condition: "a submission is accepted while its privacy_status is REDACTION_REQUIRED or PURGED"
  # --- temporal windows ---
  - id: ERR_AMNESTY_WINDOW_CLOSED
    http: 409
    condition: "the amnesty removal is attempted after AuditProgram.amnesty_end_at"
  - id: ERR_RESPONSE_WINDOW_CLOSED
    http: 409
    condition: "a proof submission is attempted after AuditProgram.response_deadline_at"
  - id: ERR_APPEAL_WINDOW_CLOSED
    http: 409
    condition: "an appeal is filed more than APPEAL_WINDOW_DAYS days after the termination notice was issued"
  - id: ERR_CONTINUATION_ELECTION_WINDOW_CLOSED
    http: 409
    condition: "a continuation election is attempted after TerminationNotice.continuation_election_deadline"
  - id: ERR_REMINDER_CADENCE_VIOLATION
    http: 409
    condition: "a reminder is sent before reminder_min_gap_days whole days have elapsed since the previous communication"
  # --- business constraints ---
  - id: ERR_REMINDER_LIMIT_REACHED
    http: 409
    condition: "the case has already received max_reminders reminders"
  - id: ERR_CASE_WINDOW_OVERLAP
    http: 409
    condition: "announcing the program would place an employee under two audit response windows whose date intervals intersect, including a shared boundary date"
  - id: ERR_APPEAL_ROUNDS_EXHAUSTED
    http: 409
    condition: "a resubmission or remand would push the appeal past MAX_APPEAL_ROUNDS"
  - id: ERR_AMNESTY_ALREADY_RECORDED
    http: 409
    condition: "an AmnestyRemoval already exists for the dependent"
  - id: ERR_DOCUMENTATION_RULE_CONFLICT
    http: 409
    condition: "a documentation rule already exists for the (program, relationship_type, phase) triple, or grace_days is set for the wrong phase"
  - id: ERR_POE_PROGRAM_AMBIGUOUS
    http: 409
    condition: "point-of-enrollment program selection cannot be reduced to a single program after ranking and tie-break"
  - id: ERR_DUPLICATE_PROGRAM
    http: 409
    condition: "an AuditProgram with the same plan_year and program_name already exists"
  - id: ERR_OPEN_APPEALS_REMAIN
    http: 409
    condition: "program close is attempted while an appeal is SUBMITTED, UNDER_REVIEW or REMANDED"
  - id: ERR_OPEN_RECOVERIES_REMAIN
    http: 409
    condition: "program close is attempted while a claims recovery is DEMAND_ISSUED or PARTIALLY_RECOVERED"
  # --- referential / documentation ---
  - id: ERR_PROOF_TYPE_NOT_ACCEPTED
    http: 422
    condition: "the submitted proof_type is not in the acceptable_proof_types of the AUDIT rule for the dependent's relationship_type"
  - id: ERR_PROOF_STALE_DOCUMENT
    http: 422
    condition: "a recency-scoped proof document_date is older than requires_recency_days before the announcement date"
  - id: ERR_APPEAL_GROUNDS_UNSUPPORTED
    http: 422
    condition: "the appeal grounds are unsupported for the dependent's relationship_type, or the required affidavit or custody order reference is absent"
  - id: ERR_DOCUMENTATION_RULE_MISSING
    http: 422
    condition: "no AUDIT-phase documentation rule exists for a relationship_type the operation needs"
  - id: ERR_SCOPE_PARAMETERS_INVALID
    http: 422
    condition: "the scope parameters do not match the requested scope_type"
  - id: ERR_SCOPE_EMPTY
    http: 422
    condition: "scope candidate selection produced no employee"
  # --- fiscal ---
  - id: ERR_WAIVER_EXCEEDS_SUBTOTAL
    http: 422
    condition: "waiver_credit_cents exceeds recoverable_subtotal_cents"
  - id: ERR_RECOVERY_BELOW_DE_MINIMIS
    http: 422
    condition: "recoverable_subtotal_cents is below DE_MINIMIS_RECOVERY_CENTS"
  - id: ERR_PAYMENT_EXCEEDS_DEMAND
    http: 422
    condition: "the payment would push recovered_cents above net_demand_cents"

roles:
  - name: ProgramAdmin
    description: "Benefits program administrator: builds the program, decides scope, publishes communications, runs the deferred-action sweep, measures savings and closes the program."
    identity: opaque
    exclusive_operations:
      - "POST /audit-programs"
      - "POST /audit-programs/{id}/documentation-rules"
      - "POST /audit-programs/{id}/scope"
      - "POST /audit-programs/{id}/communicate"
      - "POST /audit-programs/{id}/run-sweep"
      - "POST /audit-programs/{id}/measure-savings"
      - "POST /audit-programs/{id}/close"
      - "POST /employees"
    shared_operations:
      - "POST /employees/{id}/dependents (with Employee)"
      - "POST /dependents/{id}/paid-claims (with RecoveryAgent)"
      - "POST /audit-cases/{id}/reminders (with VerificationAnalyst)"
      - "POST /amnesty-removals (with Employee)"
      - "POST /termination-notices/{id}/continuation-election (with Employee)"
      - "all GET reads"
  - name: VerificationAnalyst
    description: "Reviews proof submissions, requests redaction of sensitive documents, and drives the reminder cadence."
    identity: opaque
    exclusive_operations:
      - "POST /proof-submissions/{id}/decision"
    shared_operations:
      - "POST /proof-submissions (with Employee)"
      - "POST /proof-submissions/{id}/redaction (with Employee)"
      - "POST /audit-cases/{id}/reminders (with ProgramAdmin)"
      - "program, case, submission, appeal, dependent, notice and claim reads"
  - name: AppealReviewer
    description: "Independent reviewer of documentation exceptions. Takes an appeal only when segregation of duties allows it, and decides only the appeals assigned to them."
    identity: opaque
    exclusive_operations:
      - "POST /appeals/{id}/assign"
      - "POST /appeals/{id}/decision"
    shared_operations:
      - "program, case, submission, appeal, notice and claim reads"
  - name: RecoveryAgent
    description: "Pursues claims already paid on ineligible dependents: opens recoveries, issues priced demands and applies payments."
    identity: opaque
    exclusive_operations:
      - "POST /claim-recoveries"
      - "POST /claim-recoveries/{id}/issue-demand"
      - "POST /claim-recoveries/{id}/payments"
    shared_operations:
      - "POST /dependents/{id}/paid-claims (with ProgramAdmin)"
      - "program, case, dependent, notice and claim reads"
  - name: Employee
    description: "The enrolled employee under audit. X-User-ID is the Employee.id; every read and write must resolve to their own employee record through Dependent.employee_id or AuditCase.employee_id."
    identity: "entity_backed:Employee"
    exclusive_operations:
      - "POST /appeals"
      - "POST /appeals/{id}/resubmit"
    shared_operations:
      - "POST /employees/{id}/dependents (with ProgramAdmin)"
      - "POST /proof-submissions (with VerificationAnalyst)"
      - "POST /proof-submissions/{id}/redaction (with VerificationAnalyst)"
      - "POST /amnesty-removals (with ProgramAdmin)"
      - "POST /termination-notices/{id}/continuation-election (with ProgramAdmin)"
      - "owner-scoped reads: GET /employees/{id}, GET /employees/{id}/dependents, GET /dependents/{id}, GET /dependents/{id}/amnesty-removals, GET /termination-notices/{id}"
