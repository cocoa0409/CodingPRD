              captures: { est: $.data.id }
            - call: "POST /estimates/${est}/submit"
              payload: {}
              as: ConstructionManager
            - call: "POST /estimates/${est}/reconcile"
              payload: { decision: "ACCEPT" }
              as: OwnerRepresentative
            - call: "GET /projects/${proj}"
              payload: {}
              as: ConstructionManager
              captures: { pv2: $.data.version }
            - call: "POST /gmp-proposals"
              payload: { project_id: "${proj}", based_on_estimate_id: "${est}", cost_of_work_total: 1000000.00, general_conditions_total: 100000.00, owner_contingency_amount: 50000.00, construction_contingency_amount: 40000.00, expected_project_version: "${pv2}" }
              as: ConstructionManager
              captures: { prop: $.data.id }
            - call: "POST /gmp-proposals/${prop}/submit"
              payload: {}
              as: ConstructionManager
            - call: "POST /gmp-proposals/${prop}/decide"
              payload: { decision: "EXECUTE" }
              as: OwnerRepresentative
            - call: "GET /projects/${proj}"
              payload: {}
              as: ConstructionManager
              captures: { pv3: $.data.version }
          trigger:
            - call: "POST /gmp-proposals"
              payload: { project_id: "${proj}", based_on_estimate_id: "${est}", cost_of_work_total: 1010000.00, general_conditions_total: 100000.00, owner_contingency_amount: 50000.00, construction_contingency_amount: 40000.00, expected_project_version: "${pv3}" }
              as: ConstructionManager
              captures: { e1: $.data.error_id }
          assert:
            - "the response code is 409 with data.error_id == ERR_GMP_ALREADY_EXECUTED, not 412 and not ERR_STALE_PROJECT_VERSION: ${pv3} is the current version"
            - "GmpProposal.${prop}.status is still EXECUTED and its status was not moved to SUPERSEDED by the refused write"
            - "CmarProject.${proj}.gmp_amount is still 1245897.60, cost_of_work_budget_total is still 1000000.00 and version == ${pv3}"
            - "GET /gmp-proposals?project_id=${proj} returns total_count == 1"

      - name: classify_and_review_before_the_event_is_under_review_return_change_event_state_invalid
        claim_type: error_triggerable
        grounds:
          - errors.ERR_CHANGE_EVENT_STATE_INVALID
          - validations.priority_68
          - state_machines.ChangeEvent.status
        distinguishing_aspect: |
          classify is reachable only from UNDER_REVIEW, which means the owner must have opened the
          review first: a DRAFT event and even a SUBMITTED event are both refused with
          ERR_CHANGE_EVENT_STATE_INVALID. The refusal on a DRAFT event also proves the
          segregation-of-duties check at priority 80 is not what rejected it - submitted_by_user_id
          is still null there, so no identity comparison could have fired.
