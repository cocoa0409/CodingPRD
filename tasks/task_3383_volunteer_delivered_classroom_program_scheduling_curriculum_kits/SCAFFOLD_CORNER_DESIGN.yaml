  - section: validations
    instances:
      - name: corner_district_create_missing_auth_unauthenticated
        claim_type: Violation → Error
        grounds:
          - validations[priority=1]
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: "A POST without valid X-User-Role/X-User-ID headers is rejected 401 ERR_UNAUTHENTICATED before any role, shape, or existence check runs."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. One area office."
          setup_api_calls:
            - *clk
            - *office
          trigger:
            - call: "POST /ja-programs/districts"
              payload: { area_office_id: "${office_id}", name: "No Auth Unified" }
              as: Anonymous
              captures: { err: $.data }
          assert:
            - "the request is sent without recognized X-User-Role / X-User-ID headers"
            - "the response status is 401 and data.error_id == ERR_UNAUTHENTICATED"
            - "no district is created"

      - name: corner_funder_create_district_forbidden
        claim_type: Violation → Error
        grounds:
          - validations[priority=2]
          - errors.ERR_FORBIDDEN
          - roles.Funder
        distinguishing_aspect: "Funder is a read-only role: POST /districts is outside its shared GET surface, so a well-formed request is rejected 403 ERR_FORBIDDEN."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. One area office."
          setup_api_calls:
            - *clk
            - *office
          trigger:
            - call: "POST /ja-programs/districts"
              payload: { area_office_id: "${office_id}", name: "Funder Unified" }
              as: Funder
              captures: { err: $.data }
          assert:
            - "the response status is 403 and data.error_id == ERR_FORBIDDEN"
            - "GET /ja-programs/districts?area_office_id=${office_id} still returns 0 rows"

      - name: corner_district_transition_unknown_action_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=3]
          - endpoints.POST_/ja-programs/districts/{district_id}/transition
        distinguishing_aspect: "An action value outside the endpoint's declared set (FROB) is a 400 ERR_VALIDATION body-shape error, not a state error — the action lexicon is checked before the state machine."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Office; district PROSPECT."
          setup_api_calls:
            - *clk
            - *office
            - *dist
          trigger:
            - call: "POST /ja-programs/districts/${dist_id}/transition"
              payload: { action: "FROB" }
              as: AreaDirector
              captures: { err: $.data }
          assert:
            - "the response status is 400 and data.error_id == ERR_VALIDATION"
            - "SchoolDistrict.${dist_id}.relationship_status remains PROSPECT"

      - name: corner_duplicate_inventory_rejected
        claim_type: Violation → Error
        grounds:
          - entities.KitInventory
          - errors.ERR_DUPLICATE_INVENTORY
        distinguishing_aspect: "Kit inventory is unique per (area_office_id, program_catalog_id): the second POST for the same pair is rejected 409 ERR_DUPLICATE_INVENTORY."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Office; program JA-BIZ; one inventory row already created for the pair."
          setup_api_calls:
            - *clk
            - *office
            - *prog4
            - *inv4
          trigger:
            - call: "POST /ja-programs/kit-inventories"
              payload: { area_office_id: "${office_id}", program_catalog_id: "${prog4_id}" }
              as: LogisticsCoordinator
              captures: { err: $.data }
          assert:
            - "the response status is 409 and data.error_id == ERR_DUPLICATE_INVENTORY"
            - "GET /ja-programs/kit-inventories?area_office_id=${office_id}&program_catalog_id=${prog4_id} returns exactly 1 row"

      - name: corner_duplicate_capstone_rejected
        claim_type: Violation → Error
        grounds:
          - entities.CapstoneEvent
          - errors.ERR_DUPLICATE_CAPSTONE
        distinguishing_aspect: "A delivery may have at most one non-CANCELLED capstone: the second create for the same delivery is rejected 409 ERR_DUPLICATE_CAPSTONE."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Full base chain; program JA-TOWNC (capstone SIMULATED_TOWN, 4 sessions); agreement ACTIVE (pledge 175000)."
            - "Delivery (enrolled 10) PLANNED; one capstone already created (PLANNED) for 2026-10-13."
          setup_api_calls:
            - *clk
            - *office
            - *dist
            - *dist_act
            - *school
            - *partner1
            - *partner1_act
            - *vol1
            - *vol1_clear
            - *vol1_begin
            - *vol1_complete
            - call: "POST /ja-programs/program-catalogs"
              payload: { code: "JA-TOWNC", title: "Our Town Compact", grade_band_low: 4, grade_band_high: 5, session_count: 4, minutes_per_session: 60, capstone_required: true, capstone_facility: "SIMULATED_TOWN", min_students: 4, max_students: 30 }
              as: PlatformAdmin
              captures: { progt_id: $.data.id }
            - call: "POST /ja-programs/partnership-agreements"
              payload: { school_id: "${school_id}", program_catalog_id: "${progt_id}", sponsor_partner_id: "${partner1_id}", school_year: "2026-2027", funding_pledged_cents: 175000 }
              as: AreaDirector
              captures: { agr_id: $.data.id }
            - call: "POST /ja-programs/partnership-agreements/${agr_id}/transition"
              payload: { action: "PROPOSE" }
              as: AreaDirector
            - call: "POST /ja-programs/partnership-agreements/${agr_id}/transition"
              payload: { action: "ACTIVATE" }
              as: AreaDirector
              captures: { agr_v: $.data.version }
            - call: "POST /ja-programs/deliveries"
              payload: { agreement_id: "${agr_id}", lead_volunteer_id: "${vol1_id}", classroom_label: "Room AA", teacher_email: "taa@rv.example", enrolled_count: 10, expected_agreement_version: "${agr_v}" }
              as: ProgramCoordinator
              captures: { del_id: $.data.id }
            - call: "POST /ja-programs/deliveries/${del_id}/transition"
              payload: { action: "PLAN" }
              as: ProgramCoordinator
            - call: "POST /ja-programs/capstone-events"
              payload: { delivery_id: "${del_id}", facility: "SIMULATED_TOWN", event_date: "2026-10-13", start_minutes: 540, end_minutes: 720, rotation_slot_count: 2 }
