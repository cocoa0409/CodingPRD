  - rule_id: resource_temporal_overlap
    instances:
      - name: claim_line_service_date_unique_per_claim_day_granularity
        grounds:
          - validations[priority=11]
          - entities.ClaimLine.fields.service_date
          - errors[ERR_DUPLICATE_SERVICE_PERIOD]
        distinguishing_aspect: |
          Day-granularity interval semantics on ClaimLine: two lines on the same claim with the
          identical service_date 2026-03-01 collide (a single service DAY cannot be billed twice)
          -> ERR_DUPLICATE_SERVICE_PERIOD.
