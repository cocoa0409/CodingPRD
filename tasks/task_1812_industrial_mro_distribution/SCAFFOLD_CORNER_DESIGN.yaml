      - name: complete_before_fulfilled_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_ORDER_NOT_FULFILLED]", state_machines.SalesOrder.CONFIRMED_to_COMPLETED]
        distinguishing_aspect: "Complete requires fulfillment FULFILLED; completing a merely CONFIRMED order fails with ERR_ORDER_NOT_FULFILLED."
