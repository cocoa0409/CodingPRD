    description: "List host hour records in a period"
    roles: [BillingAdmin, FinanceReader]
    code: 200
    input: ["limit?", "offset?"]
    output: HostHourRecord[]
    side_effects: []

  # --- MeterAccumulator ---
  - method: GET
    path: "/api/billing-accounts/{id}/billing-periods/{id}/meter-accumulators"
    description: "List meters for the period"
    roles: [BillingAdmin, FinanceReader, TeamLead]
