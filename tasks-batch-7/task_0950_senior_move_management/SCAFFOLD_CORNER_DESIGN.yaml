      - name: coordination_fee_tier_two_cap_binds_at_exactly_eight_hundred_thousand
        claim_type: tiered_pricing
        grounds: ['calculations.invoice_coordination_fee', 'calculations.invoice_subtotal', 'endpoints["POST /invoice-lines"]', 'endpoints["GET /engagements/{id}/summary"]']
        distinguishing_aspect: "COORD_FEE_TIER2_MAX_CENTS is the inclusive top of tier 2, so a pre-fee subtotal of exactly 800000 selects the 42000 cap even though six percent would be 48000, and the projected total is 842000."
        test_recipe:
          setup: ["One PACKAGE HOUSE engagement whose invoice carries the 620000 PACKAGE_BASE line plus a 180000 manual adjustment, with all three surcharges inside their free allowances."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T09:00:00.000Z" }
              as: MOVE_MANAGER
            - call: "POST /clients"
              payload: { full_name: "Ada Whitfield", phone: "+1-555-0142" }
