  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: financial_review_passes_at_exactly_capacity_band_adequate
        grounds:
          - calculations.owner_capacity_score
          - state_machines.Application.financial_review_status.NOT_STARTED_to_PASSED
          - state_machines.Application.financial_review_status.NOT_STARTED_to_FAILED
          - entities.Owner.fields.capacity_band_standalone
        distinguishing_aspect: |
          Metric: the capacity score against CAPACITY_BAND_ADEQUATE == 55.00, exercised on
          POST /applications/{id}/financial-review. Two owners differ by 10000.00 of liquid assets:
          1000000.00 lands the weighted roll-up on exactly 55.00 (>= is ADEQUATE, review PASSED)
          while 990000.00 lands on 54.91 (INSUFFICIENT, review FAILED). The pair also pins the
          normative rounding order — components rounded to 2dp before weighting — since rounding
          only at the end would move the 54.91 case.
        test_recipe:
          setup:
            - "Brand SOLARIS with no existing units."
            - "Owner AT-BAND: 1000000.00 liquid (20.00), 10500000.00 net worth (70.00), credit 800 (100.00) and no units -> 9.00 + 21.00 + 25.00 = 55.00 exactly."
            - "Owner BELOW-BAND: identical except 990000.00 liquid (19.80) -> 8.91 + 21.00 + 25.00 = 54.91."
            - "One UNDER_REVIEW application per owner; both reviewed on the STANDALONE basis on 2026-08-05."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FranchiseDevelopmentManager
            - call: "POST /brands"
              payload: { code: "SOLARIS", name: "Solaris Collection", tier: "UPSCALE", base_royalty_rate_pct: 5.00, marketing_fund_rate_pct: 2.50, protected_radius_miles: 5.00, min_room_count: 80, standard_term_years: 20 }
              as: BrandStandardsDirector
              captures: { brand_id: $.data.id }
            - call: "POST /owners"
              payload: { legal_name: "Boundary Exact Lodging LLC", contact_email: "cfo@boundaryexact.example", liquid_assets_amount: 1000000.00, net_worth_amount: 10500000.00, credit_score: 800, existing_units_count: 0 }
              as: FranchiseDevelopmentManager
              captures: { owner_at_band_id: $.data.id }
            - call: "POST /owners"
              payload: { legal_name: "Boundary Short Lodging LLC", contact_email: "cfo@boundaryshort.example", liquid_assets_amount: 990000.00, net_worth_amount: 10500000.00, credit_score: 800, existing_units_count: 0 }
              as: FranchiseDevelopmentManager
              captures: { owner_below_band_id: $.data.id }
            - call: "POST /applications"
              payload: { owner_id: "${owner_at_band_id}", brand_id: "${brand_id}", property_name: "Boundary Exact Hotel", market_code: "SEASO", property_x_miles: 0.00, property_y_miles: 0.00, room_count: 120, current_affiliation: "INDEPENDENT", building_age_years: 14, requested_term_years: 20, requested_conversion_date: "2026-10-01" }
              as: FranchiseDevelopmentManager
              captures: { app_at_band_id: $.data.id }
            - call: "POST /applications"
              payload: { owner_id: "${owner_below_band_id}", brand_id: "${brand_id}", property_name: "Boundary Short Hotel", market_code: "SEASO", property_x_miles: 40.00, property_y_miles: 0.00, room_count: 120, current_affiliation: "INDEPENDENT", building_age_years: 14, requested_term_years: 20, requested_conversion_date: "2026-10-01" }
              as: FranchiseDevelopmentManager
              captures: { app_below_band_id: $.data.id }
            - call: "POST /applications/${app_at_band_id}/start-review"
              payload: {}
              as: FranchiseDevelopmentManager
            - call: "POST /applications/${app_below_band_id}/start-review"
              payload: {}
              as: FranchiseDevelopmentManager
            - call: "POST /_clock/set_current_utc"
