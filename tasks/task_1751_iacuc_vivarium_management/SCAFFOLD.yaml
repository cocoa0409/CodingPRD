scenario: |
  IACUC & Vivarium Management (university animal care program): protocol submission with species/number justification, designated-member vs full-committee review, semiannual facility inspection & program review, animal census & per-diem billing to grants, breeding colony management & cage capacity, veterinary care & adverse-condition reporting, training/occupational-health enrollment for personnel, protocol deviation & suspension

domain_name: iacuc-vivarium-management
api_prefix: /iacuc

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: hybrid
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Investigator
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Principal investigator legal name
      - name: email
        type: string
        source: input
        description: Institutional email; unique across investigators
        constraints: "unique"
      - name: department
        type: string
        source: input
        description: Academic department
      - name: status
        type: enum
        source: system
        description: Lifecycle state
        default: ACTIVE
        constraints: "ACTIVE | SUSPENDED | DEACTIVATED"

  - name: Grant
    parent: null
    common_fields: true
    fields:
      - name: grant_number
        type: string
        source: input
        description: Sponsor award number; unique
        constraints: "unique"
      - name: investigator_id
        type: string
        source: input
        description: "FK -> Investigator.id; owning PI"
      - name: budget_total_cents
        type: integer
        source: input
        description: Total animal-care budget in cents
        constraints: ">= 0"
      - name: budget_remaining_cents
        type: integer
        source: computed
        description: budget_total_cents minus posted per-diem charges (per_diem_billing)
      - name: expires_on
        type: datetime
        source: input
        description: Award end date; per-diem posting forbidden after this date

  - name: Personnel
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Staff member name
      - name: email
        type: string
        source: input
        description: Institutional email; unique
        constraints: "unique"
      - name: role_on_protocols
        type: enum
        source: input
        description: Declared role when added to a protocol
        constraints: "TECHNICIAN | CO_PI | STUDENT"
      - name: training_completed
        type: boolean
        source: computed
        description: true iff every required TrainingEnrollment is COMPLETED (training_gate)
      - name: occ_health_cleared
        type: boolean
        source: computed
        description: true iff an OccHealthEnrollment in CLEARED state exists (occ_health_gate)
      - name: status
        type: enum
        source: system
        description: Lifecycle
        default: ACTIVE
        constraints: "ACTIVE | SUSPENDED"

  - name: TrainingEnrollment
    parent: null
    common_fields: true
    fields:
      - name: personnel_id
        type: string
        source: input
        description: "FK -> Personnel.id"
      - name: course_code
        type: enum
        source: input
        description: Required course identifier
        constraints: "ANIMAL_HANDLING | ASEPTIC_TECHNIQUE | EUTHANASIA | SPECIES_SPECIFIC"
      - name: state
        type: enum
        source: system
        description: Enrollment lifecycle
        default: ENROLLED
        constraints: "ENROLLED | COMPLETED | EXPIRED"
      - name: completed_at
        type: datetime
        source: system
        description: Set on completion; expiry computed as completed_at + 365 days
      - name: expires_at
        type: datetime
        source: computed
        description: completed_at + 365 days; null until COMPLETED

  - name: OccHealthEnrollment
    parent: null
    common_fields: true
    fields:
      - name: personnel_id
        type: string
        source: input
        description: "FK -> Personnel.id"
      - name: state
        type: enum
        source: system
        description: Occupational health lifecycle
        default: ENROLLED
        constraints: "ENROLLED | CLEARED | EXPIRED"
      - name: cleared_at
        type: datetime
        source: system
        description: Set when occupational health nurse clears
      - name: expires_at
        type: datetime
        source: computed
        description: cleared_at + 365 days; null until CLEARED

  - name: Protocol
    parent: null
    common_fields: true
    fields:
      - name: protocol_number
        type: string
        source: system
        description: Server-minted human-readable number, format IACUC-YYYY-NNNN
      - name: investigator_id
        type: string
        source: input
        description: "FK -> Investigator.id; principal investigator"
      - name: grant_id
        type: string
        source: input
        description: "FK -> Grant.id; funding source billed for per-diem"
      - name: title
        type: string
        source: input
        description: Study title
      - name: species
        type: enum
        source: input
        description: Primary species
        constraints: "MOUSE | RAT | RABBIT | ZEBRAFISH"
      - name: max_animals_justified
        type: integer
        source: input
        description: Justified animal ceiling (species/number justification)
        constraints: "> 0"
      - name: pain_category
        type: enum
        source: input
        description: USDA pain/distress category
        constraints: "B | C | D | E"
      - name: review_path
        type: enum
        source: input
        description: Designated-member review or full-committee review
        constraints: "DMR | FCR"
      - name: status
        type: enum
        source: system
        description: Protocol lifecycle
        default: DRAFT
        constraints: "DRAFT | SUBMITTED | DMR_REVIEW | FCR_REVIEW | APPROVED | SUSPENDED | EXPIRED | WITHDRAWN"
      - name: approved_at
        type: datetime
        source: system
        description: When approval became effective
      - name: expires_at
        type: datetime
        source: computed
        description: approved_at + 3 years; null until APPROVED
      - name: animals_used_count
        type: integer
        source: computed
        description: Count of Animal rows linked to this protocol not in TRANSFERRED_OUT
        default: 0

  - name: ProtocolReviewer
    parent: null
    common_fields: true
    fields:
      - name: protocol_id
        type: string
        source: input
        description: "FK -> Protocol.id"
      - name: reviewer_name
        type: string
        source: input
        description: Committee member name
      - name: reviewer_kind
        type: enum
        source: input
        description: designated member or full-committee member
        constraints: "DESIGNATED_MEMBER | COMMITTEE_MEMBER"
      - name: decision
        type: enum
        source: system
        description: Recorded vote
        default: PENDING
        constraints: "PENDING | APPROVE | REQUIRE_MODIFICATIONS | WITHHOLD"

  - name: Cage
    parent: null
    common_fields: true
    fields:
      - name: cage_barcode
        type: string
        source: input
        description: Physical barcode; unique
        constraints: "unique"
      - name: room_code
        type: string
        source: input
        description: Vivarium room identifier
      - name: species
        type: enum
        source: input
        description: Species housed
        constraints: "MOUSE | RAT | RABBIT | ZEBRAFISH"
      - name: cage_kind
        type: enum
        source: input
        description: STANDARD or BREEDING (breeding pairs + litters)
        constraints: "STANDARD | BREEDING"
      - name: capacity_adults
        type: integer
        source: input
        description: "Maximum adult animals allowed (policy: mice 5, rats 2, rabbits 1, zebrafish 20)"
        constraints: "> 0"
      - name: status
        type: enum
        source: system
        description: Cage lifecycle
        default: EMPTY
        constraints: "EMPTY | OCCUPIED | OVER_CAPACITY | DECOMMISSIONED"
      - name: protocol_id
        type: string
        source: input
        description: "FK -> Protocol.id; protocol this cage is billed to"

  - name: Animal
    parent: null
    common_fields: true
    fields:
      - name: animal_tag
        type: string
        source: input
        description: Ear tag / tattoo identifier; unique
        constraints: "unique"
      - name: cage_id
        type: string
        source: input
        description: "FK -> Cage.id; current housing"
      - name: protocol_id
        type: string
        source: input
        description: "FK -> Protocol.id; protocol of record"
      - name: species
        type: enum
        source: input
        description: Species
        constraints: "MOUSE | RAT | RABBIT | ZEBRAFISH"
      - name: date_of_birth
        type: datetime
        source: input
        description: Birth date (for age calculations)
      - name: sex
        type: enum
        source: input
        description: Sex
        constraints: "M | F"
      - name: status
        type: enum
        source: system
        description: Animal lifecycle
        default: ALIVE
        constraints: "ALIVE | RETIRED | EUTHANIZED | TRANSFERRED_OUT"
      - name: litter_id
        type: string
        source: input
        description: "FK -> Litter.id; null for adults not born in-house"
        default: null

  - name: Litter
    parent: null
    common_fields: true
    fields:
      - name: cage_id
        type: string
        source: input
        description: "FK -> Cage.id; breeding cage where born"
      - name: protocol_id
        type: string
        source: input
        description: "FK -> Protocol.id; breeding protocol"
      - name: born_on
        type: datetime
        source: input
        description: Birth date of the litter
      - name: pup_count
        type: integer
        source: input
        description: Number of pups born
        constraints: "> 0"
      - name: weaned_count
        type: integer
        source: computed
        description: Pups weaned (moved to standard cages) via wean action
        default: 0
      - name: state
        type: enum
        source: system
        description: Litter lifecycle
        default: NURSING
        constraints: "NURSING | WEANED | CLOSED"

  - name: CensusRecord
    parent: null
    common_fields: true
    fields:
      - name: cage_id
        type: string
        source: input
        description: "FK -> Cage.id"
      - name: census_date
        type: datetime
        source: input
        description: Calendar day of the census (midnight UTC)
      - name: physical_count
        type: integer
        source: input
        description: Animals physically counted in the cage
        constraints: ">= 0"
      - name: system_count
        type: integer
        source: computed
        description: Animals with cage_id == this cage and status == ALIVE on census_date
      - name: discrepancy
        type: integer
        source: computed
        description: physical_count - system_count (census_reconciliation)

  - name: BillingRun
    parent: null
    common_fields: true
    fields:
      - name: period_start
        type: datetime
        source: input
        description: First billable day (inclusive, midnight UTC)
      - name: period_end
        type: datetime
        source: input
        description: Last billable day (exclusive, midnight UTC); must be > period_start
      - name: state
        type: enum
        source: system
        description: Billing run lifecycle
        default: DRAFT
        constraints: "DRAFT | PROVISIONAL | FINALIZED | POSTED | VOIDED"
      - name: hold_reason
        type: string
        source: system
        description: Set when census discrepancy puts the run on HOLD (stored on run while PROVISIONAL)
        default: null

  - name: PerDiemCharge
    parent: null
    common_fields: true
    fields:
      - name: billing_run_id
        type: string
        source: input
        description: "FK -> BillingRun.id"
      - name: cage_id
        type: string
        source: input
        description: "FK -> Cage.id"
      - name: protocol_id
        type: string
        source: input
        description: "FK -> Protocol.id"
      - name: grant_id
        type: string
        source: input
        description: "FK -> Grant.id; debited on POST"
      - name: cage_days
        type: integer
        source: computed
        description: Billable cage-days in the period (per_diem_billing)
      - name: rate_cents
        type: integer
        source: computed
        description: Daily rate applied (tiered by species/age mix for rats; flat otherwise)
      - name: amount_cents
        type: integer
        source: computed
        description: cage_days * rate_cents, rounded per-line then summed (per_diem_billing)
      - name: variant
        type: enum
        source: computed
        description: Which billing variant produced this charge
        constraints: "PROVISIONAL | FINAL"

  - name: FacilityInspection
    parent: null
    common_fields: true
    fields:
      - name: inspection_kind
        type: enum
        source: input
        description: Semiannual facility inspection or program review
        constraints: "FACILITY | PROGRAM_REVIEW"
      - name: scheduled_for
        type: datetime
        source: input
        description: Planned date
      - name: due_by
        type: datetime
        source: computed
        description: last completed inspection of same kind + 180 days (inspection_scheduling)
      - name: completed_at
        type: datetime
        source: system
        description: When the inspection was completed; null until COMPLETED
      - name: state
        type: enum
        source: system
        description: Inspection lifecycle
        default: SCHEDULED
        constraints: "SCHEDULED | COMPLETED | LAPSED"
      - name: deficiency_count
        type: integer
        source: input
        description: Number of deficiencies found
        default: 0

  - name: AdverseEventReport
    parent: null
    common_fields: true
    fields:
      - name: protocol_id
        type: string
        source: input
        description: "FK -> Protocol.id"
      - name: animal_id
        type: string
        source: input
        description: "FK -> Animal.id"
      - name: reported_by_personnel_id
        type: string
        source: input
        description: "FK -> Personnel.id; reporter"
      - name: severity
        type: enum
        source: input
        description: Severity grade
        constraints: "MINOR | MODERATE | SEVERE | MORBUND"
      - name: description
        type: string
        source: input
        description: Clinical description
      - name: state
        type: enum
        source: system
        description: Report lifecycle
        default: OPEN
        constraints: "OPEN | UNDER_TREATMENT | RESOLVED | ESCALATED"
      - name: reported_at
        type: datetime
        source: system
        description: When filed
      - name: resolved_at
        type: datetime
        source: system
        description: When resolved; resolution deadline = reported_at + 72 hours

  - name: ProtocolDeviation
    parent: null
    common_fields: true
    fields:
      - name: protocol_id
        type: string
        source: input
        description: "FK -> Protocol.id"
      - name: reported_by_personnel_id
        type: string
        source: input
        description: "FK -> Personnel.id"
      - name: description
        type: string
        source: input
        description: Deviation narrative
      - name: seriousness
        type: enum
        source: input
        description: Minor deviation vs serious (reportable to OLAW)
        constraints: "MINOR | SERIOUS"
      - name: state
        type: enum
        source: system
        description: Deviation lifecycle
        default: REPORTED
        constraints: "REPORTED | UNDER_REVIEW | CLOSED | SUSPENSION_IMPOSED"

  - name: ProcedureRoomBooking
    parent: null
    common_fields: true
    fields:
      - name: room_code
        type: string
        source: input
        description: Procedure room identifier
      - name: protocol_id
        type: string
        source: input
        description: "FK -> Protocol.id"
      - name: booked_by_personnel_id
        type: string
        source: input
        description: "FK -> Personnel.id"
      - name: start_at
        type: datetime
        source: input
        description: Booking start (UTC)
      - name: end_at
        type: datetime
        source: input
        description: Booking end (UTC); half-open interval [start_at, end_at)
      - name: state
        type: enum
        source: system
        description: Booking lifecycle
        default: CONFIRMED
        constraints: "CONFIRMED | CANCELLED"

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Protocol
    initial_state: DRAFT
    terminal_states: [EXPIRED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /iacuc/protocols/{id}/submit"
        actor: Investigator
        preconditions:
          - "Protocol.investigator_id == X-User-ID"
          - "Protocol.status == DRAFT"
          - "Grant referenced by grant_id has budget_remaining_cents > 0"
          - "Grant.expires_on > current clock time"
        side_effects:
          - "Increments Protocol.version"
          - "review_path == DMR -> status becomes DMR_REVIEW; review_path == FCR -> status becomes FCR_REVIEW (modeled as SUBMITTED then auto-advance; see note)"
        note: "Submission auto-routes to DMR_REVIEW or FCR_REVIEW per review_path in the same request; SUBMITTED is instantaneous."
      - from: SUBMITTED
        to: DMR_REVIEW
        trigger: "system auto-route on submit (review_path == DMR)"
        actor: system
        preconditions: ["Protocol.review_path == DMR"]
        side_effects: ["Create 1 ProtocolReviewer row kind=DESIGNATED_MEMBER decision=PENDING"]
      - from: SUBMITTED
        to: FCR_REVIEW
        trigger: "system auto-route on submit (review_path == FCR)"
        actor: system
        preconditions: ["Protocol.review_path == FCR"]
        side_effects: ["Create 3 ProtocolReviewer rows kind=COMMITTEE_MEMBER decision=PENDING"]
      - from: DMR_REVIEW
        to: APPROVED
        trigger: "POST /iacuc/protocols/{id}/review-decisions"
        actor: IacucAdministrator
        preconditions:
          - "Protocol.status == DMR_REVIEW"
          - "The single ProtocolReviewer kind=DESIGNATED_MEMBER has decision == APPROVE (set in this request body)"
        side_effects:
          - "approved_at = now; expires_at = approved_at + 3 years"
          - "Increments Protocol.version"
      - from: FCR_REVIEW
        to: APPROVED
        trigger: "POST /iacuc/protocols/{id}/review-decisions"
        actor: IacucAdministrator
        preconditions:
          - "Protocol.status == FCR_REVIEW"
          - "At least 2 of 3 COMMITTEE_MEMBER reviewers vote APPROVE and none vote WITHHOLD"
        side_effects:
          - "approved_at = now; expires_at = approved_at + 3 years"
          - "Increments Protocol.version"
      - from: DMR_REVIEW
        to: DRAFT
        trigger: "POST /iacuc/protocols/{id}/review-decisions with REQUIRE_MODIFICATIONS"
        actor: IacucAdministrator
        preconditions: ["Designated member decision == REQUIRE_MODIFICATIONS"]
        side_effects: ["Protocol returns to DRAFT for revision; reviewer rows reset to PENDING"]
      - from: FCR_REVIEW
        to: DRAFT
        trigger: "POST /iacuc/protocols/{id}/review-decisions with majority REQUIRE_MODIFICATIONS"
        actor: IacucAdministrator
        preconditions: ["Majority vote REQUIRE_MODIFICATIONS and no WITHHOLD"]
        side_effects: ["Protocol returns to DRAFT; reviewer rows reset to PENDING"]
      - from: DMR_REVIEW
        to: WITHDRAWN
        trigger: "POST /iacuc/protocols/{id}/review-decisions with WITHHOLD"
        actor: IacucAdministrator
        preconditions: ["Designated member decision == WITHHOLD"]
        side_effects: ["Protocol WITHDRAWN (terminal)"]
      - from: FCR_REVIEW
        to: WITHDRAWN
        trigger: "POST /iacuc/protocols/{id}/review-decisions with any WITHHOLD"
        actor: IacucAdministrator
        preconditions: ["Any committee member votes WITHHOLD"]
        side_effects: ["Protocol WITHDRAWN (terminal)"]
      - from: APPROVED
        to: SUSPENDED
        trigger: "POST /iacuc/protocols/{id}/suspend"
        actor: IacucAdministrator
        preconditions:
          - "Protocol.status == APPROVED"
          - "A ProtocolDeviation on this protocol is in state SUSPENSION_IMPOSED (causal chain: deviation review -> suspension)"
        side_effects:
          - "Cascade: every Cage with protocol_id == this protocol and status == OCCUPIED becomes OVER_CAPACITY (frozen: no new animals)"
          - "Cascade: every AdverseEventReport on this protocol in OPEN or UNDER_TREATMENT becomes ESCALATED"
          - "Increments Protocol.version"
      - from: SUSPENDED
        to: APPROVED
        trigger: "POST /iacuc/protocols/{id}/reinstate"
        actor: IacucAdministrator
        preconditions:
          - "Protocol.status == SUSPENDED"
          - "All ProtocolDeviation rows on this protocol are in CLOSED or SUSPENSION_IMPOSED terminal-review state"
        side_effects:
          - "Cascade: Cages in OVER_CAPACITY that are within capacity_adults return to OCCUPIED (recount)"
          - "Increments Protocol.version"
      - from: APPROVED
        to: EXPIRED
        trigger: "system clock reaches Protocol.expires_at"
        actor: system
        preconditions: ["current clock time >= Protocol.expires_at"]
        side_effects: ["Terminal; no new animals may be added; existing animals must be transferred or euthanized"]

  - entity: Cage
    initial_state: EMPTY
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: EMPTY
        to: OCCUPIED
        trigger: "POST /iacuc/animals (first animal placed)"
        actor: AnimalCareStaff
        preconditions:
          - "Cage.status == EMPTY"
          - "Cage.protocol_id == Animal.protocol_id"
          - "Cage.species == Animal.species"
        side_effects: ["Cage.status -> OCCUPIED", "Increments Cage.version"]
      - from: OCCUPIED
        to: OVER_CAPACITY
        trigger: "POST /iacuc/animals or wean aging (pups age past 21 days) or protocol suspension"
        actor: system
        preconditions: ["effective occupancy > capacity_adults (cage_capacity) OR protocol suspended"]
        side_effects: ["No further animal additions accepted", "Increments Cage.version"]
      - from: OVER_CAPACITY
        to: OCCUPIED
        trigger: "POST /iacuc/animals/{id}/transfer or euthanasia reducing occupancy, or protocol reinstatement"
        actor: AnimalCareStaff
        preconditions: ["effective occupancy <= capacity_adults after the move AND protocol not SUSPENDED"]
        side_effects: ["Cage.status -> OCCUPIED", "Increments Cage.version"]
      - from: OCCUPIED
        to: EMPTY
        trigger: "last animal removed (transfer out / euthanasia / retirement)"
        actor: system
        preconditions: ["count of ALIVE animals in cage == 0"]
        side_effects: ["Cage.status -> EMPTY"]
      - from: EMPTY
        to: DECOMMISSIONED
        trigger: "POST /iacuc/cages/{id}/decommission"
        actor: FacilityManager
        preconditions: ["Cage.status == EMPTY"]
        side_effects: ["Cage excluded from future census and billing"]

  - entity: Litter
    initial_state: NURSING
    terminal_states: [CLOSED]
    transitions:
      - from: NURSING
        to: WEANED
        trigger: "POST /iacuc/litters/{id}/wean"
        actor: AnimalCareStaff
        preconditions:
          - "Litter.state == NURSING"
          - "current clock time >= born_on + 21 days (weaning age)"
        side_effects:
          - "weaned_count = pup_count"
          - "Each pup Animal row gets cage_id reassigned to target standard cages in request"
          - "Increments Litter.version"
      - from: WEANED
        to: CLOSED
        trigger: "POST /iacuc/litters/{id}/close"
        actor: AnimalCareStaff
        preconditions: ["Litter.state == WEANED"]
        side_effects: ["Terminal"]

  - entity: TrainingEnrollment
    initial_state: ENROLLED
    terminal_states: [EXPIRED]
    transitions:
      - from: ENROLLED
        to: COMPLETED
        trigger: "POST /iacuc/training-enrollments/{id}/complete"
        actor: TrainingCoordinator
        preconditions: ["TrainingEnrollment.state == ENROLLED"]
        side_effects:
          - "completed_at = now; expires_at = completed_at + 365 days"
          - "Recompute Personnel.training_completed (training_gate)"
          - "Increments TrainingEnrollment.version"
      - from: COMPLETED
        to: EXPIRED
        trigger: "system clock reaches expires_at"
        actor: system
        preconditions: ["current clock time >= expires_at"]
        side_effects: ["Recompute Personnel.training_completed (training_gate)"]

  - entity: OccHealthEnrollment
    initial_state: ENROLLED
    terminal_states: [EXPIRED]
    transitions:
      - from: ENROLLED
        to: CLEARED
        trigger: "POST /iacuc/occ-health-enrollments/{id}/clear"
        actor: OccHealthNurse
        preconditions: ["OccHealthEnrollment.state == ENROLLED"]
        side_effects:
          - "cleared_at = now; expires_at = cleared_at + 365 days"
          - "Recompute Personnel.occ_health_cleared (occ_health_gate)"
      - from: CLEARED
        to: EXPIRED
        trigger: "system clock reaches expires_at"
        actor: system
        preconditions: ["current clock time >= expires_at"]
        side_effects: ["Recompute Personnel.occ_health_cleared (occ_health_gate)"]

  - entity: BillingRun
    initial_state: DRAFT
    terminal_states: [POSTED, VOIDED]
    transitions:
      - from: DRAFT
        to: PROVISIONAL
        trigger: "POST /iacuc/billing-runs/{id}/compute-provisional"
        actor: BillingCoordinator
        preconditions:
          - "BillingRun.state == DRAFT"
          - "No CensusRecord in the period has discrepancy != 0 (else hold_reason set, run stays DRAFT with ERR_CENSUS_DISCREPANCY)"
        side_effects:
          - "Create PerDiemCharge rows variant=PROVISIONAL for every cage occupied in the period (per_diem_billing)"
          - "Increments BillingRun.version"
      - from: PROVISIONAL
        to: FINALIZED
        trigger: "POST /iacuc/billing-runs/{id}/finalize"
        actor: BillingCoordinator
        preconditions:
          - "BillingRun.state == PROVISIONAL"
          - "expected_billing_run_version matches (OCC)"
        side_effects:
          - "Recompute PerDiemCharge rows variant=FINAL using reconciled census (per_diem_billing FINAL variant)"
          - "Increments BillingRun.version"
      - from: FINALIZED
        to: POSTED
        trigger: "POST /iacuc/billing-runs/{id}/post"
        actor: BillingCoordinator
        preconditions:
          - "BillingRun.state == FINALIZED"
          - "For every PerDiemCharge: grant.budget_remaining_cents >= amount_cents AND grant.expires_on >= period_end"
        side_effects:
          - "Debit each Grant.budget_remaining_cents by sum of its PerDiemCharge amounts (per_diem_billing)"
          - "Increments BillingRun.version"
      - from: DRAFT
        to: VOIDED
        trigger: "POST /iacuc/billing-runs/{id}/void"
        actor: BillingCoordinator
        preconditions: ["BillingRun.state == DRAFT"]
        side_effects: ["No charges created"]
      - from: PROVISIONAL
        to: VOIDED
        trigger: "POST /iacuc/billing-runs/{id}/void"
        actor: BillingCoordinator
        preconditions: ["BillingRun.state == PROVISIONAL"]
        side_effects: ["Delete provisional PerDiemCharge rows"]

  - entity: Animal
    initial_state: ALIVE
    terminal_states: [EUTHANIZED, TRANSFERRED_OUT]
    transitions:
      - from: ALIVE
        to: RETIRED
        trigger: "POST /iacuc/animals/{id}/retire"
        actor: AnimalCareStaff
        preconditions: ["Animal.status == ALIVE"]
        side_effects: ["cage occupancy recompute (cage_capacity)", "increments Animal.version"]
      - from: RETIRED
        to: EUTHANIZED
        trigger: "POST /iacuc/animals/{id}/euthanize"
        actor: AnimalCareStaff
        preconditions: ["Animal.status in {ALIVE, RETIRED}"]
        side_effects: ["cage occupancy recompute"]
      - from: ALIVE
        to: EUTHANIZED
        trigger: "POST /iacuc/animals/{id}/euthanize"
        actor: AnimalCareStaff
        preconditions: ["Animal.status == ALIVE"]
        side_effects: ["cage occupancy recompute"]
      - from: ALIVE
        to: TRANSFERRED_OUT
        trigger: "POST /iacuc/animals/{id}/transfer-out"
        actor: AnimalCareStaff
        preconditions: ["Animal.status == ALIVE"]
        side_effects: ["cage occupancy recompute", "protocol animals_used_count recompute (decrement)"]
      - from: ALIVE
        to: ALIVE
        trigger: "POST /iacuc/animals/{id}/transfer (cage change only)"
        actor: AnimalCareStaff
        preconditions: ["Animal.status == ALIVE", "target cage passes cage_capacity and species/protocol match"]
        side_effects: ["source and target cage occupancy recompute", "increments both Cage versions"]

  - entity: AdverseEventReport
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: UNDER_TREATMENT
        trigger: "POST /iacuc/adverse-events/{id}/begin-treatment"
        actor: AttendingVeterinarian
        preconditions: ["AdverseEventReport.state == OPEN"]
        side_effects: ["Increments AdverseEventReport.version"]
      - from: UNDER_TREATMENT
        to: RESOLVED
        trigger: "POST /iacuc/adverse-events/{id}/resolve"
        actor: AttendingVeterinarian
        preconditions:
          - "AdverseEventReport.state == UNDER_TREATMENT"
          - "current clock time <= reported_at + 72 hours (else must escalate first)"
        side_effects: ["resolved_at = now"]
      - from: OPEN
        to: ESCALATED
        trigger: "POST /iacuc/adverse-events/{id}/escalate"
        actor: AttendingVeterinarian
        preconditions: ["AdverseEventReport.state in {OPEN, UNDER_TREATMENT}"]
        side_effects:
          - "If severity == SEVERE or MORBUND: auto-file ProtocolDeviation seriousness=SERIOUS on same protocol (deviation_escalation cascade)"
      - from: UNDER_TREATMENT
        to: ESCALATED
        trigger: "POST /iacuc/adverse-events/{id}/escalate or system 72h deadline breach"
        actor: AttendingVeterinarian
        preconditions: ["AdverseEventReport.state == UNDER_TREATMENT"]
        side_effects: ["Same deviation cascade as OPEN->ESCALATED"]
      - from: ESCALATED
        to: RESOLVED
        trigger: "POST /iacuc/adverse-events/{id}/resolve"
        actor: AttendingVeterinarian
        preconditions: ["AdverseEventReport.state == ESCALATED"]
        side_effects: ["resolved_at = now"]

  - entity: ProtocolDeviation
    initial_state: REPORTED
    terminal_states: [CLOSED, SUSPENSION_IMPOSED]
    transitions:
      - from: REPORTED
        to: UNDER_REVIEW
        trigger: "POST /iacuc/protocol-deviations/{id}/begin-review"
        actor: IacucAdministrator
        preconditions: ["ProtocolDeviation.state == REPORTED"]
        side_effects: ["Increments ProtocolDeviation.version"]
      - from: UNDER_REVIEW
        to: CLOSED
        trigger: "POST /iacuc/protocol-deviations/{id}/close"
        actor: IacucAdministrator
        preconditions:
          - "ProtocolDeviation.state == UNDER_REVIEW"
          - "seriousness == MINOR (SERIOUS deviations cannot be closed without suspension decision)"
        side_effects: ["Terminal"]
      - from: UNDER_REVIEW
        to: SUSPENSION_IMPOSED
        trigger: "POST /iacuc/protocol-deviations/{id}/impose-suspension"
        actor: IacucAdministrator
        preconditions: ["ProtocolDeviation.state == UNDER_REVIEW"]
        side_effects:
          - "Cascade: Protocol.status APPROVED -> SUSPENDED (protocol_suspension cascade)"
          - "That protocol suspension then cascades to Cages and AdverseEventReports (see Protocol machine)"
          - "Increments ProtocolDeviation.version"

  - entity: ProcedureRoomBooking
    initial_state: CONFIRMED
    terminal_states: [CANCELLED]
    transitions:
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /iacuc/room-bookings/{id}/cancel"
        actor: AnimalCareStaff
        preconditions: ["ProcedureRoomBooking.state == CONFIRMED"]
        side_effects: ["Booking removed from room_booking_conflict candidate set"]

  - entity: FacilityInspection
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, LAPSED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /iacuc/inspections/{id}/complete"
        actor: IacucAdministrator
        preconditions: ["FacilityInspection.state == SCHEDULED", "completed_at <= due_by"]
        side_effects: ["completed_at set"]
      - from: SCHEDULED
        to: LAPSED
        trigger: "POST /iacuc/inspections/{id}/complete with completed_at > due_by, or system clock passes due_by"
        actor: IacucAdministrator
        preconditions: ["completed_at > due_by"]
        side_effects: ["Terminal; ERR_INSPECTION_LAPSED surfaced to the caller"]

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: billing-finalize-stale-run
    parent_entity: BillingRun
    write_endpoint: "POST /iacuc/billing-runs/{id}/finalize"
    occ_field: "expected_billing_run_version"
    description: |
      Finalizing a BillingRun whose version has advanced since the client last
      observed it is rejected. This captures the case where another writer has
      already finalized (or re-opened via void) the same run and the current
      writer's view of the run is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: protocol-suspend-stale-protocol
    parent_entity: Protocol
    write_endpoint: "POST /iacuc/protocols/{id}/suspend"
    occ_field: "expected_protocol_version"
    description: |
      Suspending a Protocol whose version has advanced since the client last
      observed it is rejected. A second writer reading the protocol after a
      prior suspension/reinstatement has a stale view and must re-read.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: per_diem_billing
    description: Per-diem charge per cage per billing period
    trigger: "BillingRun compute-provisional / finalize / post"
    inputs: [cage occupancy, species, animal ages, billing period]
    algorithm: tiered_pricing
    formula: |
      PROVISIONAL variant (cage-day model):
        cage_days = number of calendar days in [period_start, period_end) on which
                    the cage held >= 1 ALIVE animal (any headcount).
        rate_cents:
          MOUSE    -> 125
          RABBIT   -> 400
          ZEBRAFISH-> 40
          RAT      -> tiered by the AGES of rats in the cage on each day:
            for each rat, daily rate = PUP 75 if age < 21d, AGED 210 if age > 365d, else ADULT 150.
            cage rate_cents for that day = max over rats in the cage (mixed-age cage billed at highest rat tier).
            cage_days are then partitioned by daily rate; charge = sum over days of daily rate.
        amount_cents = sum over days (each day's charge rounded to integer cents BEFORE summing; round_half_up).
      FINAL variant (reconciled-census model):
        identical to PROVISIONAL except cage_days uses only days where the reconciled
        census (CensusRecord rows with discrepancy == 0) confirms occupancy, AND
        animals with status RETIRED or EUTHANIZED before period_end are excluded
        from the day's headcount on and after their status-change date.
        The two variants therefore produce different cage_days for the same period
        whenever a mid-period euthanasia/retirement occurred.
    constants:
      MOUSE_RATE: 125
      RAT_PUP_RATE: 75
      RAT_ADULT_RATE: 150
      RAT_AGED_RATE: 210
      RABBIT_RATE: 400
      ZEBRAFISH_RATE: 40
      PUP_AGE_DAYS: 21
      AGED_AGE_DAYS: 365
    precision: "integer cents, round per-day then sum, round_half_up"
    variants:
      - name: PROVISIONAL
        when: "BillingRun compute-provisional"
        difference: "Uses raw occupancy (any ALIVE animal on the day), ignoring mid-period retirements/euthanasia"
      - name: FINAL
        when: "BillingRun finalize"
        difference: "Uses reconciled census and excludes RETIRED/EUTHANIZED animals from their status-change date onward"

  - name: cage_capacity
    description: Effective occupancy and OVER_CAPACITY detection for breeding cages
    trigger: "Animal create / transfer / wean / protocol suspension / daily clock tick"
    inputs: [cage kind, adult count, litter pup ages]
    algorithm: threshold
    formula: |
      effective_occupancy(cage) =
        (count of ALIVE animals in cage with litter_id == null)        # adults
        + (count of ALIVE animals in cage whose litter pup age > PUP_AGE_DAYS days)
      # Pups aged <= 21 days are exempt from the cap (nursing exemption).
      # Boundary: a pup is exempt through its 21st day of age; on day 22 it counts.
      if effective_occupancy > capacity_adults -> cage.status = OVER_CAPACITY
      else if effective_occupancy == 0 -> EMPTY
      else -> OCCUPIED (unless protocol suspended forces OVER_CAPACITY regardless)
    constants:
      PUP_AGE_DAYS: 21
    precision: "integer animal count"

  - name: census_reconciliation
    description: Compare physical count to system census
    trigger: "CensusRecord create"
    inputs: [physical_count, ALIVE animals in cage on census_date]
    algorithm: aggregation
    formula: |
      system_count = count of Animal with cage_id == this cage AND status == ALIVE
      discrepancy = physical_count - system_count
      if discrepancy != 0 -> any BillingRun covering census_date in DRAFT is held
        (compute-provisional rejected with ERR_CENSUS_DISCREPANCY)
    precision: "integer"

  - name: breeding_productivity
    description: Breeding-cage productivity score for colony management reports
    trigger: "GET /iacuc/cages/{id}/productivity"
    inputs: [weaned litters, weaned pups, nonproductive days]
    algorithm: weighted_scoring
    formula: |
      score = max(0, 3 * (count of Litter in cage with state in {WEANED, CLOSED})
                   + 0.5 * (sum of Litter.weaned_count over those litters)
                   - 0.05 * nonproductive_days)
      nonproductive_days = days since cage became OCCUPIED with no NURSING/WEANED litter
    precision: "2 decimal places, round_half_up"
    constants:
      LITTER_WEIGHT: 3
      PUP_WEIGHT: 0.5
      NONPROD_PENALTY: 0.05

  - name: inspection_scheduling
    description: Semiannual due-date computation and lapse detection
    trigger: "FacilityInspection create / complete / daily clock tick"
    inputs: [last completed inspection of same kind]
    algorithm: chronological
    formula: |
      due_by = (completed_at of most recent COMPLETED FacilityInspection of same kind) + 180 days
      if no prior completed inspection -> due_by = scheduled_for (first cycle free)
      if completed_at > due_by -> state = LAPSED (terminal; cannot complete late)
      Boundary: completion exactly at due_by is on-time (inclusive); one second past is LAPSED.
    constants:
      SEMIANNUAL_DAYS: 180
    precision: "datetime to the second"

  - name: training_gate
    description: Whether a personnel member is cleared for animal contact
    trigger: "TrainingEnrollment complete/expire; protocol personnel-add; adverse-event file"
    inputs: [all TrainingEnrollment rows for the personnel]
    algorithm: aggregation
    formula: |
      required = {ANIMAL_HANDLING, ASEPTIC_TECHNIQUE, EUTHANASIA, SPECIES_SPECIFIC}
      training_completed = for every course in required, exists a TrainingEnrollment
                           with personnel_id == this personnel AND course_code == course
                           AND state == COMPLETED AND (expires_at == null OR expires_at > now)
    precision: "boolean"

  - name: occ_health_gate
    description: Occupational health clearance check
    trigger: "OccHealthEnrollment clear/expire; protocol personnel-add"
    inputs: [OccHealthEnrollment rows for the personnel]
    algorithm: aggregation
    formula: |
      occ_health_cleared = exists OccHealthEnrollment with personnel_id == this personnel
                           AND state == CLEARED AND (expires_at == null OR expires_at > now)
    precision: "boolean"

  - name: room_booking_conflict
    description: Procedure-room double-booking detection with turnover buffer
    trigger: "ProcedureRoomBooking create"
    inputs: [existing CONFIRMED bookings for the room]
    algorithm: interval_merge
    formula: |
      A new booking [start_at, end_at) conflicts with an existing CONFIRMED booking
      [s, e) for the same room_code iff:
        start_at < e + TURNOVER_MINUTES minutes  AND  s < end_at + TURNOVER_MINUTES minutes
      # i.e. each booking occupies [start, end + 30m) for conflict purposes.
      # Boundary: start_at == e + 30m exactly is ALLOWED (half-open after buffer).
    constants:
      TURNOVER_MINUTES: 30
    precision: "datetime to the second"

  - name: protocol_animal_cap
    description: Species/number justification enforcement
    trigger: "Animal create"
    inputs: [protocol animals_used_count, max_animals_justified]
    algorithm: threshold
    formula: |
      animals_used_count = count of Animal with protocol_id == this protocol
                           AND status != TRANSFERRED_OUT
      adding an animal is rejected when animals_used_count >= max_animals_justified
      # Boundary: at exactly max, one more is rejected (>= not >).
    precision: "integer"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role is permitted for this endpoint per §1.7"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: business_constraint
    check: "Required input fields present and well-typed; enum values in declared sets; integers in range"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 4
    category: existence
    check: "Every path-template id and body FK resolves to an existing row"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 5
    category: existence
    check: "Entity-backed identity: for ownership-checked endpoints, X-User-ID matches the resource's owner FK (e.g. Protocol.investigator_id)"
    error_id: ERR_NOT_OWNER
    http_status: 403
    applies_to: "protocol submit, animal create by investigator contexts"
  - priority: 6
    category: state
    check: "Target resource is in a state from which the requested transition exists in §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 7
    category: state
    check: "OCC: expected_<parent>_version matches current version on guarded endpoints"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "billing finalize, protocol suspend"
  - priority: 8
    category: business_safety
    check: "Segregation of duties: an Investigator may not file a review-decision on their own protocol; the same X-User-ID may not both report and close the same ProtocolDeviation"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "review-decisions, deviation close"
  - priority: 9
    category: business_safety
    check: "Training gate: personnel added to a protocol or filing an adverse event must have training_completed == true and occ_health_cleared == true"
    error_id: ERR_TRAINING_INCOMPLETE
    http_status: 422
    applies_to: "protocol personnel add, adverse-event create, room booking create"
  - priority: 10
    category: business_safety
    check: "Protocol animal cap: animals_used_count >= max_animals_justified rejects additional animals (protocol_animal_cap)"
    error_id: ERR_ANIMAL_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /iacuc/animals"
  - priority: 11
    category: business_safety
    check: "Protocol must be APPROVED to add animals, book rooms, or file adverse events against it"
    error_id: ERR_PROTOCOL_NOT_APPROVED
    http_status: 409
    applies_to: "POST /iacuc/animals, POST /iacuc/room-bookings, POST /iacuc/adverse-events"
  - priority: 12
    category: business_safety
    check: "A SERIOUS ProtocolDeviation under review cannot be closed; it must be resolved via impose-suspension"
    error_id: ERR_SERIOUS_DEVIATION_NOT_CLOSABLE
    http_status: 422
    applies_to: "POST /iacuc/protocol-deviations/{id}/close"
  - priority: 13
    category: business_constraint
    check: "Species/cage consistency: Animal.species == Cage.species; Cage.protocol_id == Animal.protocol_id; cage not DECOMMISSIONED"
    error_id: ERR_CAGE_MISMATCH
    http_status: 422
    applies_to: "POST /iacuc/animals, POST /iacuc/animals/{id}/transfer"
  - priority: 14
    category: business_constraint
    check: "Cage capacity: adding the animal would push effective_occupancy > capacity_adults (cage_capacity; pups <= 21 days exempt)"
    error_id: ERR_CAGE_OVER_CAPACITY
    http_status: 422
    applies_to: "POST /iacuc/animals, POST /iacuc/animals/{id}/transfer, POST /iacuc/litters/{id}/wean"
  - priority: 15
    category: business_constraint
    check: "review-decisions payload must form a valid tally for the protocol's review path (DMR: exactly one DESIGNATED_MEMBER decision; FCR: decisions for all 3 COMMITTEE_MEMBER rows)"
    error_id: ERR_INVALID_VOTE_TALLY
    http_status: 422
    applies_to: "POST /iacuc/protocols/{id}/review-decisions"
  - priority: 16
    category: business_temporal
    check: "Room booking start_at must be >= current logical clock time"
    error_id: ERR_BOOKING_IN_PAST
    http_status: 422
    applies_to: "POST /iacuc/room-bookings"
  - priority: 17
    category: business_temporal
    check: "Room booking conflict: overlapping CONFIRMED booking for same room_code within turnover buffer (room_booking_conflict)"
    error_id: ERR_ROOM_CONFLICT
    http_status: 409
    applies_to: "POST /iacuc/room-bookings"
  - priority: 18
    category: business_temporal
    check: "Weaning age: litter may not be weaned before born_on + 21 days"
    error_id: ERR_LITTER_TOO_YOUNG
    http_status: 422
    applies_to: "POST /iacuc/litters/{id}/wean"
  - priority: 19
    category: business_temporal
    check: "Adverse-event resolution deadline: resolve after reported_at + 72h requires ESCALATED state first"
    error_id: ERR_RESOLUTION_OVERDUE
    http_status: 422
    applies_to: "POST /iacuc/adverse-events/{id}/resolve"
  - priority: 20
    category: business_temporal
    check: "Inspection lapse: completing an inspection after due_by marks LAPSED instead of COMPLETED"
    error_id: ERR_INSPECTION_LAPSED
    http_status: 422
    applies_to: "POST /iacuc/inspections/{id}/complete"
  - priority: 21
    category: business_referential
    check: "Census discrepancy hold: billing compute-provisional rejected while any CensusRecord in the period has discrepancy != 0"
    error_id: ERR_CENSUS_DISCREPANCY
    http_status: 422
    applies_to: "POST /iacuc/billing-runs/{id}/compute-provisional"
  - priority: 22
    category: business_fiscal
    check: "Grant solvency at posting: every PerDiemCharge amount_cents <= its Grant.budget_remaining_cents and Grant.expires_on >= period_end"
    error_id: ERR_GRANT_INSOLVENT
    http_status: 402
    applies_to: "POST /iacuc/billing-runs/{id}/post"
  - priority: 23
    category: business_fiscal
    check: "Grant solvency at protocol submission: grant.budget_remaining_cents > 0 and not expired"
    error_id: ERR_GRANT_EXHAUSTED
    http_status: 402
    applies_to: "POST /iacuc/protocols/{id}/submit"
  - priority: 24
    category: business_constraint
    check: "Uniqueness: email, grant_number, cage_barcode, animal_tag, protocol_number unique"
    error_id: ERR_DUPLICATE
    http_status: 409
    applies_to: "create endpoints"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- logical clock (test-driving) ---
  - method: POST
    path: "/iacuc/_clock/set_current_utc"
    description: "Set the server's logical clock. Default startup time is exactly 2026-08-01T00:00:00Z; the logical clock MUST NOT fall back to wall-clock time."
    roles: [IacucAdministrator]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["Trigger any time-based system transitions (protocol expiry, training expiry, inspection lapse, room bookings unchanged)"]

  # --- investigators / grants / personnel ---
  - method: POST
    path: "/iacuc/investigators"
    description: "Register an investigator"
    roles: [IacucAdministrator]
    code: 201
    input: [full_name, email, department]
    output: Investigator
    side_effects: []
  - method: GET
    path: "/iacuc/investigators/{id}"
    description: "Fetch investigator"
    roles: [IacucAdministrator, Investigator]
    code: 200
    input: []
    output: Investigator
    side_effects: []
  - method: POST
    path: "/iacuc/grants"
    description: "Register a grant"
    roles: [IacucAdministrator]
    code: 201
    input: [grant_number, investigator_id, budget_total_cents, expires_on]
    output: Grant
    side_effects: ["budget_remaining_cents initialized to budget_total_cents"]
  - method: GET
    path: "/iacuc/grants/{id}"
    description: "Fetch grant (includes computed budget_remaining_cents)"
    roles: [IacucAdministrator, Investigator, BillingCoordinator]
    code: 200
    input: []
    output: Grant
    side_effects: []
  - method: GET
    path: "/iacuc/investigators/{id}/grants"
    description: "List grants for an investigator (FK reverse-reachability)"
    roles: [IacucAdministrator, Investigator]
    code: 200
    input: []
    output: Grant[]
    side_effects: []

  - method: POST
    path: "/iacuc/personnel"
    description: "Register personnel"
    roles: [IacucAdministrator]
    code: 201
    input: [full_name, email, role_on_protocols]
    output: Personnel
    side_effects: []
  - method: GET
    path: "/iacuc/personnel/{id}"
    description: "Fetch personnel (includes computed training_completed, occ_health_cleared)"
    roles: [IacucAdministrator, TrainingCoordinator, OccHealthNurse, AttendingVeterinarian]
    code: 200
    input: []
    output: Personnel
    side_effects: []

  - method: POST
    path: "/iacuc/training-enrollments"
    description: "Enroll personnel in a course"
    roles: [TrainingCoordinator]
    code: 201
    input: [personnel_id, course_code]
    output: TrainingEnrollment
    side_effects: []
  - method: GET
    path: "/iacuc/personnel/{id}/training-enrollments"
    description: "List training enrollments for personnel (FK reverse-reachability)"
    roles: [TrainingCoordinator, IacucAdministrator]
    code: 200
    input: []
    output: TrainingEnrollment[]
    side_effects: []
  - method: POST
    path: "/iacuc/training-enrollments/{id}/complete"
    description: "Mark a course completed"
