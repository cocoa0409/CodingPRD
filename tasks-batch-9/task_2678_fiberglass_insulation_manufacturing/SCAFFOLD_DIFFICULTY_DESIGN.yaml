  - rule_id: priority_pair_validation_conflict
    instances:
      - name: uncertified_binder_outranks_oven_zone_mismatch_on_run_scheduling
        grounds:
          - validations.priority_52_ERR_BINDER_NOT_CERTIFIED
          - validations.priority_66_ERR_OVEN_ZONE_MISMATCH
          - errors.ERR_BINDER_NOT_CERTIFIED
          - errors.ERR_OVEN_ZONE_MISMATCH
        distinguishing_aspect: |
          One request violates two rules at once and the ladder must return the
          business_safety rule at priority 52 (409) even though the shape-adjacent
          business_referential rule at priority 66 (422) is cheaper to evaluate and
          reads like a request-shape problem. Two contrast calls prove the pair is
          genuinely ordered rather than accidentally satisfied: fixing only the
          binder surfaces ERR_OVEN_ZONE_MISMATCH, and fixing only the array still
          yields ERR_BINDER_NOT_CERTIFIED.
        test_recipe:
          setup:
            - "Plant NWK has oven_zone_count 4 and production_line_count 2, melt_posture OPEN."
            - "Binder BF-FREE-1 is CERTIFIED; binder BF-DRAFT-1 was created and never submitted, so it is DRAFT."
            - "SKU PL-A sits on BF-FREE-1; SKU PL-F sits on BF-DRAFT-1. Neither SKU needs to be certified, because POST /production-runs does not gate on certification_status."
