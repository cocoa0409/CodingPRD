            - { call: "POST /credit-union/membership-applications/${app1}/approve", as: MembershipOfficer, as_user_id: "officer-2", captures: { m1: "$.data.resulting_member_id" } }
          trigger:
            - { call: "POST /credit-union/share-accounts", payload: { member_id: "${m1}", account_type: "PRIMARY", initial_deposit_cents: 499 }, as: MembershipOfficer, captures: { err_open: "$.data.error_id" } }
            - { call: "POST /credit-union/share-accounts", payload: { member_id: "${m1}", account_type: "PRIMARY", initial_deposit_cents: 500 }, as: MembershipOfficer, captures: { acct1: "$.data.id", bal0: "$.data.balance_cents" } }
            - { call: "POST /credit-union/share-accounts/${acct1}/transactions", payload: { kind: "DEPOSIT", amount_cents: 99500, posted_date: "2026-08-01" }, as: OperationsOfficer }
            - { call: "POST /credit-union/share-accounts/${acct1}/transactions", payload: { kind: "WITHDRAWAL", amount_cents: 99500, posted_date: "2026-08-01" }, as: OperationsOfficer, captures: { rb: "$.data.running_balance_cents" } }
            - { call: "POST /credit-union/share-accounts/${acct1}/transactions", payload: { kind: "WITHDRAWAL", amount_cents: 1, posted_date: "2026-08-01" }, as: OperationsOfficer, captures: { err_wd: "$.data.error_id" } }
          assert:
            - "err_open == ERR_BELOW_PAR_VALUE (422); bal0 == 500 on the exact-par opening"
            - "rb == 500 after withdrawing back to par"
            - "err_wd == ERR_PAR_VALUE_BREACH (422)"

      - name: primary_account_uniqueness_and_close_guard
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_PRIMARY_ACCOUNT_EXISTS]", "errors[ERR_PRIMARY_ACCOUNT_REQUIRED]"]
        distinguishing_aspect: "One PRIMARY per member (second yields 409) and the PRIMARY cannot be manually closed while the member is ACTIVE."
