      - name: standard_supersede_error_family_is_covered_by_the_difficulty_design
        claim_type: violation_to_error
        grounds:
          - errors.ERR_STANDARD_NOT_ACTIVE
          - errors.ERR_MODEL_NOT_CERTIFIED
        distinguishing_aspect: "Superseding the pinned edition must make certify-compliance fail on the pinned-standard gate and must decertify the affected models, so both codes are reachable from the cascade."
        excluded_because:
          difficulty_instance: standard_supersede_cascades_to_decert_models_placements_project_and_quote
          rationale: "That transitive_cascade instance walks all four cascade hops and asserts the resulting codes and states directly."

      - name: firm_quote_fiscal_and_safety_error_codes_are_covered_by_the_difficulty_design
        claim_type: violation_to_error
        grounds:
          - errors.ERR_SURFACING_DEPTH_INSUFFICIENT
          - errors.ERR_QUOTE_EXCEEDS_BUDGET
        distinguishing_aspect: "Both codes hang off POST /playground/quotes with variant FIRM and must be reachable independently of one another."
        excluded_because:
          difficulty_instance: firm_quote_surfacing_safety_error_precedes_budget_overrun
          rationale: "That priority_pair_validation_conflict instance triggers each code in turn on the same project."

      - name: empty_scope_quote_code_is_covered_by_the_difficulty_design
        claim_type: violation_to_error
        grounds:
          - errors.ERR_QUOTE_EMPTY_SCOPE
        distinguishing_aspect: "A FIRM quote over a project whose placements are all DRAFT has an empty input set and must report the dedicated empty-scope code rather than pricing zero."
        excluded_because:
          difficulty_instance: firm_quote_with_empty_validated_placement_set_rejected
          rationale: "That boundary_precision_check instance issues exactly that FIRM quote and asserts ERR_QUOTE_EMPTY_SCOPE."

      - name: installation_booking_error_family_is_covered_by_the_difficulty_design
        claim_type: violation_to_error
        grounds:
          - errors.ERR_INSTALLER_BOOKING_CONFLICT
          - errors.ERR_CREW_CAPACITY_EXCEEDED
        distinguishing_aspect: "The travel-buffer conflict and the crew-capacity ceiling are separate codes and each must be reachable without the other firing."
        excluded_because:
          difficulty_instance: installer_booking_requires_one_clear_travel_day_between_jobs
          rationale: "That resource_temporal_overlap instance asserts each code on its own booking attempt, including the case where both are violated and only the higher-priority one is reported."

      - name: job_start_gate_error_family_is_covered_by_the_difficulty_design
        claim_type: violation_to_error
        grounds:
          - errors.ERR_INSTALLER_NOT_ACTIVE
          - errors.ERR_JOB_NOT_YET_STARTABLE
        distinguishing_aspect: "A job start is gated both by the installer's status and by the scheduled start date, and the two codes must be distinguishable."
        excluded_because:
          difficulty_instance: job_start_blocked_when_installer_suspended
          rationale: "That cross_entity_state_dependency instance asserts both codes from the same scheduled job."

      - name: rework_limit_and_review_threshold_codes_are_covered_by_the_difficulty_design
        claim_type: violation_to_error
        grounds:
          - errors.ERR_REWORK_LIMIT_EXCEEDED
          - errors.ERR_INSUFFICIENT_COMMUNITY_INPUT
        distinguishing_aspect: "Both codes are cumulative-counter thresholds (rework_cycles against MAX_REWORK_CYCLES, votes against MIN_REVIEW_VOTES) and must fire exactly at their boundary."
        excluded_because:
          difficulty_instance: installation_job_rework_cycle_returns_to_inspection_pending
          rationale: "That non_linear_state_machine instance asserts ERR_REWORK_LIMIT_EXCEEDED at the third rework, and the community-input boundary is asserted by community_approval_exactly_sixty_pct_approves_design."

  # =========================================================================
  - section: rbac
    instances:

      - name: exclusive_operation_denial_matrix_and_header_validation
        claim_type: exclusive_operations
        grounds:
          - roles.ManufacturerAdmin.exclusive_operations
          - roles.DesignConsultant.exclusive_operations
          - roles.ComplianceOfficer.exclusive_operations
          - roles.ClientRepresentative.exclusive_operations
          - roles.InstallerOperator.exclusive_operations
          - roles.SafetyAuditor.exclusive_operations
          - validations[priority=1]
          - validations[priority=2]
          - validations[priority=10]
          - validations[priority=20]
          - errors.ERR_FORBIDDEN_ROLE
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: >-
          One probe per role pair proves every §1.7 exclusive_operations entry is closed to the other five
          roles with ERR_FORBIDDEN_ROLE (403), and — because the role gate sits at priority 10, ABOVE the
          priority-20 path resolution — the denial is returned even when the path id does not exist at all.
          The same endpoint answers 401 ERR_UNAUTHENTICATED when the X-User-Role header is absent
          (priority 1) or carries a name outside the six declared roles (priority 2), and answers
          404 (not 403) for a role that IS allowed, which is the falsifier: an implementation that
          resolved the path before checking the role would return 404 on probes 1-10 and an
          implementation that checked membership after authentication would return 403 on probes 11-12.
        test_recipe:
          setup:
            - "One PlaygroundStandard exists in DRAFT so that the 401 probes and the positive control act on a real row; every 403 probe deliberately uses a syntactically valid but non-existent UUID."
          setup_api_calls:
            - call: "POST /playground/standards"
              payload: { code: "ASTM_F1487", edition_year: 2024, effective_from: "2024-01-01", min_use_zone_clearance_cm: 183, max_fall_height_cm_toddler: 122, max_fall_height_cm_preschool: 152, max_fall_height_cm_school_age: 244, requires_accessible_route: false }
              as: ManufacturerAdmin
              as_user_id: "admin-1"
              captures: { std_id: $.data.id }
          trigger:
            # --- probe 1: ComplianceOfficer-exclusive standard activation, attempted by the plant admin
            - call: "POST /playground/standards/11111111-1111-4111-8111-111111111111/activate"
              payload: {}
              as: ManufacturerAdmin
              as_user_id: "admin-1"
              captures: { err_activate: $.data.error_id }
            # --- probe 2: ComplianceOfficer-exclusive model certification, attempted by the consultant
            - call: "POST /playground/component-models/22222222-2222-4222-8222-222222222222/certify"
              payload: {}
              as: DesignConsultant
              as_user_id: "consultant-1"
              captures: { err_certify_model: $.data.error_id }
            # --- probe 3: DesignConsultant-exclusive consultation start, attempted by the client rep
            - call: "POST /playground/projects/33333333-3333-4333-8333-333333333333/start-consultation"
              payload: {}
              as: ClientRepresentative
              as_user_id: "client-1"
              captures: { err_start_consult: $.data.error_id }
            # --- probe 4: DesignConsultant-exclusive placement validation, attempted by the auditor
            - call: "POST /playground/placements/44444444-4444-4444-8444-444444444444/validate"
              payload: {}
              as: SafetyAuditor
              as_user_id: "auditor-1"
              captures: { err_validate: $.data.error_id }
            # --- probe 5: ClientRepresentative-exclusive quote acceptance, attempted by the issuing consultant
            - call: "POST /playground/quotes/55555555-5555-4555-8555-555555555555/accept"
              payload: {}
              as: DesignConsultant
              as_user_id: "consultant-1"
              captures: { err_accept: $.data.error_id }
            # --- probe 6: ClientRepresentative-exclusive pledge collection, attempted by the plant admin
            - call: "POST /playground/pledges/66666666-6666-4666-8666-666666666666/collect"
              payload: {}
              as: ManufacturerAdmin
              as_user_id: "admin-1"
              captures: { err_collect: $.data.error_id }
            # --- probe 7: InstallerOperator-exclusive job start, attempted by the auditor
            - call: "POST /playground/installation-jobs/77777777-7777-4777-8777-777777777777/start"
              payload: {}
              as: SafetyAuditor
              as_user_id: "auditor-1"
              captures: { err_job_start: $.data.error_id }
            # --- probe 8: ComplianceOfficer-exclusive compliance certification, attempted by an installer
            - call: "POST /playground/projects/88888888-8888-4888-8888-888888888888/certify-compliance"
              payload: {}
              as: InstallerOperator
              as_user_id: "99999999-9999-4999-8999-999999999999"
              captures: { err_certify_project: $.data.error_id }
            # --- probe 9: ManufacturerAdmin-exclusive shipping, attempted by the consultant
            - call: "POST /playground/orders/aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa/ship"
              payload: {}
              as: DesignConsultant
              as_user_id: "consultant-1"
              captures: { err_ship: $.data.error_id }
            # --- probe 10: DesignConsultant-exclusive placement deletion, attempted by the client rep
            - call: "DELETE /playground/placements/bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb"
              payload: {}
              as: ClientRepresentative
              as_user_id: "client-1"
              captures: { err_delete: $.data.error_id }
            # --- probe 11: both auth headers omitted entirely (empty string = header not sent, never a blank/whitespace value)
            - call: "POST /playground/standards/${std_id}/activate"
              payload: {}
              as: ""
              as_user_id: ""
              captures: { err_no_headers: $.data.error_id }
            # --- probe 12: X-User-ID present, X-User-Role carries a name outside the six declared roles
            - call: "POST /playground/standards/${std_id}/activate"
              payload: {}
              as: "SiteInspector"
              as_user_id: "officer-1"
              captures: { err_unknown_role: $.data.error_id }
            # --- probe 13: control - a role that IS allowed on a read reaches path resolution and gets 404
            - call: "GET /playground/standards/cccccccc-cccc-4ccc-8ccc-cccccccccccc"
              payload: {}
              as: InstallerOperator
              as_user_id: "99999999-9999-4999-8999-999999999999"
              captures: { err_not_found: $.data.error_id }
            # --- probe 14: control - the one role that owns the operation succeeds on the real row
            - call: "POST /playground/standards/${std_id}/activate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { std_status: $.data.status }
          assert:
            - "probes 1-10 each return HTTP 403 with response_type == 'error' and error_id == ERR_FORBIDDEN_ROLE: ${err_activate}, ${err_certify_model}, ${err_start_consult}, ${err_validate}, ${err_accept}, ${err_collect}, ${err_job_start}, ${err_certify_project}, ${err_ship} and ${err_delete} are all ERR_FORBIDDEN_ROLE"
            - "none of probes 1-10 returns 404 even though every path id in them is a non-existent UUID - validations[priority=10] outranks validations[priority=20]"
            - "probe 11 returns HTTP 401 with ${err_no_headers} == ERR_UNAUTHENTICATED (validations[priority=1]: both X-User-ID and X-User-Role must be present and non-empty)"
            - "probe 12 returns HTTP 401 with ${err_unknown_role} == ERR_UNAUTHENTICATED, NOT 403: an unrecognised role name fails authentication at priority 2 before endpoint membership is consulted at priority 10"
            - "probes 11 and 12 leave PlaygroundStandard.${std_id}.status == DRAFT and its version unchanged"
            - "probe 13 returns HTTP 404 with ${err_not_found} == ERR_STANDARD_NOT_FOUND - InstallerOperator is listed in the GET endpoint's roles, so the request passes the role gate and fails only on path resolution"
            - "probe 14 returns HTTP 200 with ${std_status} == ACTIVE, proving the endpoint itself is functional and probes 1 and 11-12 failed on authorisation alone"
            - "every error body carries meta.api_request_id and meta.api_request_timestamp and data holds exactly {error_id, message} per response_envelope.error"

      - name: shared_operations_admit_each_of_their_declared_roles
        claim_type: shared_operations
        grounds:
          - roles.ManufacturerAdmin.shared_operations
          - roles.ComplianceOfficer.shared_operations
          - roles.DesignConsultant.shared_operations
          - roles.ClientRepresentative.shared_operations
          - endpoints[POST /playground/standards]
          - endpoints[POST /playground/projects/{id}/pledges]
          - endpoints[POST /playground/placements/{id}/retrofit]
          - endpoints[POST /playground/warranty-claims]
          - validations[priority=10]
        distinguishing_aspect: >-
          The four endpoints §1.7 declares as shared must accept BOTH of their declared roles on the same
          resource. Two of them (pledges, standards) are proved by a 201 from each role; the other two are
          proved by the priority ladder — a shared role that is refused for a business reason returns that
          business code (409 ERR_PLACEMENT_INVALID_STATE at priority 40, 422 ERR_PROJECT_NOT_INSTALLED at
          priority 74), never 403 ERR_FORBIDDEN_ROLE at priority 10. An implementation that copied the
          exclusive-owner role onto a shared endpoint fails on the second role of each pair.
        test_recipe:
          setup:
            - "Clock 2026-08-01T09:00:00Z. Standard ASTM_F1487/2024 created by the ManufacturerAdmin and ACTIVE. One certified POST model. One project in CONSULTATION with a PRESCHOOL_2_5 area holding one VALIDATED placement. accessible_route_required is false and the standard does not require an accessible route, so no accessibility gate interferes."
          setup_api_calls:
            - call: "POST /playground/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T09:00:00Z" }
              as: ManufacturerAdmin
              as_user_id: "admin-1"
            - call: "POST /playground/standards"
              payload: { code: "ASTM_F1487", edition_year: 2024, effective_from: "2024-01-01", min_use_zone_clearance_cm: 183, max_fall_height_cm_toddler: 122, max_fall_height_cm_preschool: 152, max_fall_height_cm_school_age: 244, requires_accessible_route: false }
              as: ManufacturerAdmin
              as_user_id: "admin-1"
              captures: { std_id: $.data.id }
            - call: "POST /playground/standards/${std_id}/activate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /playground/component-models"
              payload: { sku: "POST-STD-120", category: "POST", age_group: "PRESCHOOL_2_5", deck_height_cm: 0, use_zone_footprint_cm: 60, color_options: ["FOREST_GREEN", "CRIMSON"], unit_price_cents: 10750, hardware_bag_count: 4, warranty_years: 10, parts_support_until_year: 2040, accessible_transfer_ready: false, supersedes_model_id: null }
              as: ManufacturerAdmin
              as_user_id: "admin-1"
              captures: { m_post_id: $.data.id }
            - call: "POST /playground/component-models/${m_post_id}/certify"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /playground/projects"
              payload: { client_name: "Shared Ops Park", site_length_cm: 3000, site_width_cm: 2000, site_soil_type: "SANDY_LOAM", budget_cents: 500000, fundraising_deadline: "2026-12-31", required_age_groups: ["PRESCHOOL_2_5"], accessible_route_required: false }
              as: DesignConsultant
              as_user_id: "consultant-1"
              captures: { p_id: $.data.id }
            - call: "POST /playground/projects/${p_id}/start-consultation"
              payload: {}
              as: DesignConsultant
              as_user_id: "consultant-1"
            - call: "POST /playground/projects/${p_id}/play-areas"
              payload: { age_group: "PRESCHOOL_2_5", axis_origin_cm: 0, axis_length_cm: 1200, surfacing_material: "ENGINEERED_WOOD_FIBER", surfacing_depth_cm: 30 }
              as: DesignConsultant
              as_user_id: "consultant-1"
              captures: { a_id: $.data.id }
            - call: "POST /playground/play-areas/${a_id}/placements"
              payload: { component_model_id: "${m_post_id}", color_choice: "FOREST_GREEN", x_start_cm: 200, quantity: 3 }
              as: DesignConsultant
              as_user_id: "consultant-1"
              captures: { pl_id: $.data.id }
            - call: "POST /playground/placements/${pl_id}/validate"
              payload: {}
              as: DesignConsultant
              as_user_id: "consultant-1"
          trigger:
            # --- POST /playground/standards is shared by ManufacturerAdmin (used in setup) and ComplianceOfficer
            - call: "POST /playground/standards"
              payload: { code: "ASTM_F1487", edition_year: 2025, effective_from: "2027-01-01", min_use_zone_clearance_cm: 183, max_fall_height_cm_toddler: 122, max_fall_height_cm_preschool: 152, max_fall_height_cm_school_age: 244, requires_accessible_route: true }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { std2_id: $.data.id, std2_status: $.data.status }
            # --- POST pledges is shared by ClientRepresentative and DesignConsultant
            - call: "POST /playground/projects/${p_id}/pledges"
              payload: { amount_cents: 20000, pledged_at: "2026-08-01" }
              as: ClientRepresentative
              as_user_id: "client-1"
              captures: { pledge_client_id: $.data.id, pledge_client_status: $.data.status }
            - call: "POST /playground/projects/${p_id}/pledges"
              payload: { amount_cents: 30000, pledged_at: "2026-08-01" }
              as: DesignConsultant
              as_user_id: "consultant-1"
              captures: { pledge_consultant_id: $.data.id }
            - call: "GET /playground/projects/${p_id}/pledges"
              payload: {}
              as: ClientRepresentative
              as_user_id: "client-1"
              captures: { pledge_total: $.meta.total_count }
            # --- POST retrofit is shared by ClientRepresentative and DesignConsultant; the placement is
            #     VALIDATED (not NEEDS_RECERTIFICATION) so both roles must fail on STATE, never on ROLE
            - call: "POST /playground/placements/${pl_id}/retrofit"
              payload: { replacement_model_id: "${m_post_id}", quantity: 1 }
              as: ClientRepresentative
              as_user_id: "client-1"
              captures: { err_retrofit_client: $.data.error_id }
            - call: "POST /playground/placements/${pl_id}/retrofit"
              payload: { replacement_model_id: "${m_post_id}", quantity: 1 }
              as: DesignConsultant
              as_user_id: "consultant-1"
              captures: { err_retrofit_consultant: $.data.error_id }
            # --- POST warranty-claims is shared by ClientRepresentative and ComplianceOfficer; the project
            #     is not INSTALLED so both roles must fail on priority 74, never on priority 10
            - call: "POST /playground/warranty-claims"
              payload: { project_id: "${p_id}", placement_id: "${pl_id}", quantity: 1, failure_date: "2026-08-01" }
              as: ClientRepresentative
              as_user_id: "client-1"
              captures: { err_claim_client: $.data.error_id }
            - call: "POST /playground/warranty-claims"
              payload: { project_id: "${p_id}", placement_id: "${pl_id}", quantity: 1, failure_date: "2026-08-01" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { err_claim_officer: $.data.error_id }
          assert:
            - "the ComplianceOfficer standard create returns HTTP 201 with ${std2_status} == DRAFT: POST /playground/standards is shared, and creating a second edition of the same code is legal while it stays DRAFT (only activation is exclusive to the officer)"
            - "PlaygroundStandard.${std_id} is still the single ACTIVE edition after ${std2_id} is created"
            - "both pledge creates return HTTP 201 with status == PLEDGED; ${pledge_client_status} == PLEDGED and ${pledge_client_id} != ${pledge_consultant_id}"
            - "${pledge_total} == 2 and DesignProject.${p_id}.funds_collected_cents is still 0 (a PLEDGED pledge is not collected money)"
            - "${err_retrofit_client} == ERR_PLACEMENT_INVALID_STATE with HTTP 409 and ${err_retrofit_consultant} == ERR_PLACEMENT_INVALID_STATE with HTTP 409 - identical codes from both roles, so neither role was refused at priority 10"
            - "${err_claim_client} == ERR_PROJECT_NOT_INSTALLED with HTTP 422 and ${err_claim_officer} == ERR_PROJECT_NOT_INSTALLED with HTTP 422 - again identical from both declared roles"
            - "no probe in this instance ever yields ERR_FORBIDDEN_ROLE"
            - "ComponentPlacement.${pl_id}.status is still VALIDATED and its retrofit_* fields are still 0/null/false after the two refused retrofits"

      - name: segregation_of_duties_separates_certifier_job_owner_and_second_auditor
        claim_type: segregation_of_duties
        grounds:
          - complexity_profile.role_model
          - roles.ComplianceOfficer
          - roles.InstallerOperator
          - roles.SafetyAuditor
          - validations[priority=12]
          - validations[priority=14]
          - validations[priority=15]
          - errors.ERR_SEGREGATION_OF_DUTIES
          - errors.ERR_NOT_JOB_OWNER
          - state_machines.DesignProject.DESIGN_APPROVED_to_CERTIFIED
          - state_machines.InstallationJob
          - entities.InstallationInspection
        distinguishing_aspect: >-
          §1.7 declares role_model segregation_of_duties, so three independent X-User-ID identity checks
          must hold on top of the role checks: the ComplianceOfficer certifying compliance may not be the
          consultant that created the project (priority 14), an InstallerOperator may only drive its OWN
          job (priority 12, and it outranks the priority-71 not-yet-startable check so the ownership
          denial is returned even before the scheduled start date), and the SafetyAuditor filing the
          POST_INSTALL_AUDIT may not be the auditor recorded in job.install_inspector_user_id (priority
          15). Each denial is then immediately re-run with a DIFFERENT user id in the same role and
          succeeds, so an implementation that only checked X-User-Role — or that recorded
          install_inspector_user_id but never compared it — fails exactly three of the six probes while
          passing every other call in the pipeline.
        test_recipe:
          setup:
            - "Clock 2026-08-01T09:00:00Z. Standard ASTM_F1487/2024 ACTIVE, requires_accessible_route false. One certified PRESCHOOL_2_5 POST model at 10750 cents. The project is created by consultant user id 'consultant-9' (the id the SoD probe will reuse) with accessible_route_required false, one PRESCHOOL_2_5 area at depth 30 (required depth 15 because the post's deck_height_cm is 0) and one VALIDATED placement of quantity 3. Community review closes at exactly 60.0 pct on 15 yes / 10 no, so the project reaches DESIGN_APPROVED. Two ACTIVE installers exist, both certified for POST and both with crew capacity 6."
          setup_api_calls:
            - call: "POST /playground/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T09:00:00Z" }
              as: ManufacturerAdmin
              as_user_id: "admin-1"
            - call: "POST /playground/standards"
              payload: { code: "ASTM_F1487", edition_year: 2024, effective_from: "2024-01-01", min_use_zone_clearance_cm: 183, max_fall_height_cm_toddler: 122, max_fall_height_cm_preschool: 152, max_fall_height_cm_school_age: 244, requires_accessible_route: false }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { std_id: $.data.id }
            - call: "POST /playground/standards/${std_id}/activate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /playground/component-models"
              payload: { sku: "POST-STD-120", category: "POST", age_group: "PRESCHOOL_2_5", deck_height_cm: 0, use_zone_footprint_cm: 60, color_options: ["FOREST_GREEN", "CRIMSON"], unit_price_cents: 10750, hardware_bag_count: 4, warranty_years: 10, parts_support_until_year: 2040, accessible_transfer_ready: false, supersedes_model_id: null }
              as: ManufacturerAdmin
              as_user_id: "admin-1"
              captures: { m_post_id: $.data.id }
            - call: "POST /playground/component-models/${m_post_id}/certify"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /playground/projects"
              payload: { client_name: "Duties Split Park", site_length_cm: 3000, site_width_cm: 2000, site_soil_type: "SANDY_LOAM", budget_cents: 500000, fundraising_deadline: "2026-12-31", required_age_groups: ["PRESCHOOL_2_5"], accessible_route_required: false }
              as: DesignConsultant
              as_user_id: "consultant-9"
              captures: { p_id: $.data.id, consultant_of_record: $.data.consultant_user_id }
            - call: "POST /playground/projects/${p_id}/start-consultation"
              payload: {}
              as: DesignConsultant
              as_user_id: "consultant-9"
            - call: "POST /playground/projects/${p_id}/play-areas"
              payload: { age_group: "PRESCHOOL_2_5", axis_origin_cm: 0, axis_length_cm: 1200, surfacing_material: "ENGINEERED_WOOD_FIBER", surfacing_depth_cm: 30 }
              as: DesignConsultant
              as_user_id: "consultant-9"
              captures: { a_id: $.data.id }
            - call: "POST /playground/play-areas/${a_id}/placements"
              payload: { component_model_id: "${m_post_id}", color_choice: "FOREST_GREEN", x_start_cm: 200, quantity: 3 }
              as: DesignConsultant
              as_user_id: "consultant-9"
              captures: { pl_id: $.data.id }
            - call: "POST /playground/placements/${pl_id}/validate"
              payload: {}
              as: DesignConsultant
              as_user_id: "consultant-9"
            - call: "POST /playground/projects/${p_id}/renderings"
              payload: { pinned_standard_id: "${std_id}" }
              as: DesignConsultant
              as_user_id: "consultant-9"
              captures: { r_id: $.data.id }
            - call: "POST /playground/renderings/${r_id}/community-votes"
              payload: { yes_votes: 15, no_votes: 10 }
              as: ClientRepresentative
              as_user_id: "client-1"
              captures: { approval_pct: $.data.community_approval_pct }
            - call: "POST /playground/renderings/${r_id}/close-review"
              payload: {}
              as: DesignConsultant
              as_user_id: "consultant-9"
              captures: { design_status_after_review: $.data.design_status }
            - call: "POST /playground/installers"
              payload: { company_name: "Northwind Play Installers", certification_level: "MASTER", certified_categories: ["POST", "DECK"], crew_capacity_per_day: 6, certification_expires_on: "2030-12-31", region_code: "TX" }
              as: ManufacturerAdmin
              as_user_id: "admin-1"
              captures: { inst_a_id: $.data.id }
            - call: "POST /playground/installers"
              payload: { company_name: "Southgate Play Crews", certification_level: "CERTIFIED", certified_categories: ["POST"], crew_capacity_per_day: 6, certification_expires_on: "2030-12-31", region_code: "TX" }
              as: ManufacturerAdmin
              as_user_id: "admin-1"
              captures: { inst_b_id: $.data.id }
          trigger:
            # --- probe 1 (priority 14): the officer role is correct but the acting user id IS the consultant of record
            - call: "POST /playground/projects/${p_id}/certify-compliance"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "consultant-9"
              captures: { err_sod_certify: $.data.error_id }
            # --- probe 2: same role, an independent officer id, same project -> succeeds
            - call: "POST /playground/projects/${p_id}/certify-compliance"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { certified_status: $.data.design_status, compliance_after_certify: $.data.compliance_status }
            - call: "GET /playground/projects/${p_id}"
              payload: {}
              as: DesignConsultant
              as_user_id: "consultant-9"
