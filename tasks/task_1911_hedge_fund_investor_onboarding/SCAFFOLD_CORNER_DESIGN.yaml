scaffold_corner_design:

  # =========================================================================
  # Section: entities — creation, retrieval, listing, defaults, computed fields
  # =========================================================================
  - section: entities
    instances:
      - name: fund_creation_returns_201_with_all_fields
        claim_type: creation
        grounds:
          - "entities.Fund"
        distinguishing_aspect: "POST /funds with all required fields returns 201 and a Fund body including system-minted id, version=1, created_at."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /funds"
              payload: { fund_name: "Alpha", domicile: "Cayman", gate_threshold_pct: 0.25, lockup_months_default: 12, notice_days_default: 30, fiscal_year_end_month: 12 }
              as: FundAdmin
              captures: { fid: $.data.id, fversion: $.data.version }
          assert:
            - "HTTP 201"
            - "Fund.id matches UUID format"
            - "Fund.version == 1"
            - "Fund.suspension_status == NOT_SUSPENDED (default)"

      - name: share_class_default_open_flags_true
        claim_type: defaults
        grounds:
          - "entities.ShareClass.fields.is_open_for_subscription"
          - "entities.ShareClass.fields.is_open_for_redemption"
        distinguishing_aspect: "ShareClass is_open_for_subscription and is_open_for_redemption default to true on creation."
        test_recipe:
          setup: ["Fund F exists"]
          setup_api_calls:
            - call: "POST /funds"
              payload: { fund_name: "F1", domicile: "Cayman", gate_threshold_pct: 0.25, lockup_months_default: 12, notice_days_default: 30, fiscal_year_end_month: 12 }
              as: FundAdmin
              captures: { fid: $.data.id }
          trigger:
            - call: "POST /funds/${fid}/share-classes"
              payload: { class_code: "A", min_initial_investment_cents: 1000, min_additional_investment_cents: 500, management_fee_bps: 100, performance_fee_bps: 1000, hurdle_rate_bps: 0, high_water_mark_required: false, lockup_months: 0, notice_days: 0, redemption_frequency: "MONTHLY" }
              as: FundAdmin
              captures: { sc: $.data }
          assert:
            - "ShareClass.is_open_for_subscription == true"
            - "ShareClass.is_open_for_redemption == true"

      - name: investor_aggregate_unfunded_commitment_computed
        claim_type: computed_fields
        grounds:
          - "entities.Investor.fields.aggregate_unfunded_commitment_cents"
        distinguishing_aspect: "aggregate_unfunded_commitment_cents starts at 0 and updates as subscriptions are created/funded."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /investors"
              payload: { legal_name: "X", investor_type: "INDIVIDUAL", tax_id: "T", email: "x@x.com", residence_country: "US", is_us_person: true }
              as: FundAdmin
              captures: { inv: $.data.id }
          trigger:
            - call: "GET /investors/${inv}"
              payload: {}
              as: FundAdmin
          assert:
            - "Investor.aggregate_unfunded_commitment_cents == 0"
            - "Investor.kyc_status == NOT_STARTED"
            - "Investor.accreditation_status == UNVERIFIED"

      - name: get_nonexistent_fund_returns_404
        claim_type: not_found
        grounds:
          - "entities.Fund"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET /funds/{unknown-uuid} returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /funds/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: FundAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404"
            - "error_id == ERR_NOT_FOUND"

      - name: list_funds_pagination_envelope
        claim_type: listing
        grounds:
          - "response_envelope"
          - "endpoints[GET /funds]"
        distinguishing_aspect: "List response includes limit, offset, total_count, has_more in meta."
        test_recipe:
          setup: ["Two funds exist"]
          setup_api_calls:
            - call: "POST /funds"
              payload: { fund_name: "F1", domicile: "Cayman", gate_threshold_pct: 0.25, lockup_months_default: 12, notice_days_default: 30, fiscal_year_end_month: 12 }
              as: FundAdmin
            - call: "POST /funds"
              payload: { fund_name: "F2", domicile: "Delaware", gate_threshold_pct: 0.20, lockup_months_default: 6, notice_days_default: 45, fiscal_year_end_month: 3 }
              as: FundAdmin
          trigger:
            - call: "GET /funds"
              payload: {}
              as: FundAdmin
          assert:
            - "response.meta has pagination_fields limit, offset, total_count, has_more"
            - "total_count >= 2"

      - name: missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds:
          - "entities.Fund"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /funds without fund_name returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - call: "POST /funds"
              payload: { domicile: "Cayman", gate_threshold_pct: 0.25, lockup_months_default: 12, notice_days_default: 30, fiscal_year_end_month: 12 }
              as: FundAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400"
            - "error_id == ERR_INVALID_REQUEST"

      - name: invalid_enum_investor_type_rejected
        claim_type: type_constraints
        grounds:
          - "entities.Investor.fields.investor_type"
        distinguishing_aspect: "POST /investors with investor_type='FOOBAR' returns 400."
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - call: "POST /investors"
              payload: { legal_name: "X", investor_type: "FOOBAR", tax_id: "T", email: "x@x.com", residence_country: "US", is_us_person: true }
              as: FundAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400"
            - "error_id == ERR_INVALID_REQUEST"

      - name: kyc_case_auto_populates_required_documents
        claim_type: computed_fields
        grounds:
          - "entities.KycCase.fields.required_documents"
        distinguishing_aspect: "KycCase.required_documents is system-computed from risk_rating × investor_type; client input for required_documents is ignored."
        test_recipe:
          setup: ["Investor exists"]
          setup_api_calls:
            - call: "POST /investors"
              payload: { legal_name: "Y", investor_type: "CORPORATION", tax_id: "T", email: "y@x.com", residence_country: "US", is_us_person: true }
              as: FundAdmin
              captures: { inv: $.data.id }
          trigger:
            - call: "POST /investors/${inv}/kyc-cases"
              payload: { risk_rating: "MEDIUM", pep_hit: false, sanctions_hit: false, adverse_media_hit: false }
              as: ComplianceOfficer
              captures: { case_data: $.data }
          assert:
            - "KycCase.required_documents is non-empty array"
            - "KycCase.status == OPEN (initial state)"

  # =========================================================================
  # Section: state_machines — invalid transitions, initial state, terminal lockdown
  # =========================================================================
  - section: state_machines
    instances:
      - name: subscription_submit_from_accepted_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - "state_machines.Subscription.transitions"
        distinguishing_aspect: "ACCEPTED is non-terminal but submit is not a valid outgoing transition from ACCEPTED → ERR_INVALID_STATE."
        test_recipe:
          setup: ["Subscription in ACCEPTED"]
          setup_api_calls:
            - call: "POST /funds"
              payload: { fund_name: "F1", domicile: "Cayman", gate_threshold_pct: 0.25, lockup_months_default: 0, notice_days_default: 0, fiscal_year_end_month: 12 }
              as: FundAdmin
              captures: { fid: $.data.id }
            - call: "POST /funds/${fid}/share-classes"
              payload: { class_code: "A1", min_initial_investment_cents: 100000, min_additional_investment_cents: 50000, management_fee_bps: 200, performance_fee_bps: 2000, hurdle_rate_bps: 0, high_water_mark_required: false, lockup_months: 0, notice_days: 0, redemption_frequency: "MONTHLY" }
              as: FundAdmin
              captures: { cid: $.data.id }
            - call: "POST /funds/${fid}/nav-periods"
              payload: { period_end_utc: "2026-08-31T23:59:59Z" }
              as: FundAdmin
            - call: "POST /investors"
              payload: { legal_name: "Z", investor_type: "INDIVIDUAL", tax_id: "T", email: "z@x.com", residence_country: "US", is_us_person: true }
              as: FundAdmin
              captures: { inv: $.data.id }
            - call: "POST /funds/${fid}/subscriptions"
              payload: { investor_id: "${inv}", share_class_id: "${cid}", commitment_amount_cents: 200000, funding_deadline_utc: "2026-08-10T00:00:00Z" }
              as: FundAdmin
              captures: { sub: $.data.id }
            - call: "POST /funds/${fid}/subscriptions/${sub}/submit"
              payload: {}
              as: TransferAgent
            - call: "POST /funds/${fid}/subscriptions/${sub}/compliance-approve"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /funds/${fid}/subscriptions/${sub}/fundings"
              payload: { amount_cents: 200000, received_at_utc: "2026-08-05T00:00:00Z" }
              as: TransferAgent
            - call: "GET /funds/${fid}"
              payload: {}
              as: FundAdmin
              captures: { fv: $.data.version }
            - call: "POST /funds/${fid}/subscriptions/${sub}/accept"
              payload: { expected_fund_version: "${fv}" }
              as: FundAdmin
          trigger:
            - call: "POST /funds/${fid}/subscriptions/${sub}/submit"
              payload: {}
              as: TransferAgent
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "error_id == ERR_INVALID_STATE"

      - name: cancelled_subscription_terminal_no_further_transitions
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.Subscription.terminal_states"
        distinguishing_aspect: "CANCELLED subscription rejects all further transitions (submit, approve, fundings, cancel)."
        test_recipe:
          setup: ["Subscription CANCELLED after deadline miss"]
          setup_api_calls:
            - call: "POST /funds"
              payload: { fund_name: "F1", domicile: "Cayman", gate_threshold_pct: 0.25, lockup_months_default: 0, notice_days_default: 0, fiscal_year_end_month: 12 }
              as: FundAdmin
              captures: { fid: $.data.id }
            - call: "POST /funds/${fid}/share-classes"
              payload: { class_code: "A1", min_initial_investment_cents: 100, min_additional_investment_cents: 50, management_fee_bps: 200, performance_fee_bps: 2000, hurdle_rate_bps: 0, high_water_mark_required: false, lockup_months: 0, notice_days: 0, redemption_frequency: "MONTHLY" }
              as: FundAdmin
              captures: { cid: $.data.id }
            - call: "POST /investors"
              payload: { legal_name: "T", investor_type: "INDIVIDUAL", tax_id: "T", email: "t@x.com", residence_country: "US", is_us_person: true }
              as: FundAdmin
              captures: { inv: $.data.id }
            - call: "POST /funds/${fid}/subscriptions"
              payload: { investor_id: "${inv}", share_class_id: "${cid}", commitment_amount_cents: 500, funding_deadline_utc: "2026-08-05T00:00:00Z" }
              as: FundAdmin
              captures: { sub: $.data.id }
            - call: "POST /funds/${fid}/subscriptions/${sub}/submit"
              payload: {}
              as: TransferAgent
            - call: "POST /funds/${fid}/subscriptions/${sub}/compliance-approve"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /funds/${fid}/subscriptions/${sub}/fundings"
              payload: { amount_cents: 100, received_at_utc: "2026-08-04T00:00:00Z" }
              as: TransferAgent
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: FundAdmin
            - call: "POST /funds/${fid}/subscriptions/${sub}/cancel"
              payload: {}
              as: FundAdmin
          trigger:
            - call: "POST /funds/${fid}/subscriptions/${sub}/submit"
              payload: {}
              as: TransferAgent
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "error_id == ERR_INVALID_STATE"

      - name: new_kyc_case_initial_state_open
        claim_type: initial_state
        grounds:
          - "state_machines.KycCase.initial_state"
        distinguishing_aspect: "Fresh KycCase has status OPEN on creation before any document submission."
        test_recipe:
          setup: ["Investor exists"]
          setup_api_calls:
            - call: "POST /investors"
              payload: { legal_name: "K", investor_type: "INDIVIDUAL", tax_id: "T", email: "k@x.com", residence_country: "US", is_us_person: true }
              as: FundAdmin
              captures: { inv: $.data.id }
          trigger:
            - call: "POST /investors/${inv}/kyc-cases"
              payload: { risk_rating: "LOW", pep_hit: false, sanctions_hit: false, adverse_media_hit: false }
              as: ComplianceOfficer
              captures: { case_status: $.data.status }
          assert:
            - "KycCase.status == OPEN (or auto-AWAITING_DOCUMENTS via immediate system transition)"

      - name: redemption_cancel_after_settle_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - "state_machines.RedemptionRequest.transitions"
        distinguishing_aspect: "SETTLED redemption cannot be cancelled."
        test_recipe:
          setup: ["RedemptionRequest SETTLED after period close"]
          setup_api_calls:
            - call: "POST /funds"
              payload: { fund_name: "F1", domicile: "Cayman", gate_threshold_pct: 0.50, lockup_months_default: 0, notice_days_default: 0, fiscal_year_end_month: 12 }
              as: FundAdmin
              captures: { fid: $.data.id }
            - call: "POST /funds/${fid}/share-classes"
              payload: { class_code: "A1", min_initial_investment_cents: 100000, min_additional_investment_cents: 50000, management_fee_bps: 200, performance_fee_bps: 2000, hurdle_rate_bps: 0, high_water_mark_required: false, lockup_months: 0, notice_days: 0, redemption_frequency: "MONTHLY" }
              as: FundAdmin
              captures: { cid: $.data.id }
            - call: "POST /funds/${fid}/nav-periods"
              payload: { period_end_utc: "2026-08-31T23:59:59Z" }
              as: FundAdmin
              captures: { pid: $.data.id }
            - call: "POST /investors"
              payload: { legal_name: "S", investor_type: "INDIVIDUAL", tax_id: "T", email: "s@x.com", residence_country: "US", is_us_person: true }
              as: FundAdmin
              captures: { inv: $.data.id }
            - call: "POST /funds/${fid}/subscriptions"
              payload: { investor_id: "${inv}", share_class_id: "${cid}", commitment_amount_cents: 500000, funding_deadline_utc: "2026-08-05T00:00:00Z" }
              as: FundAdmin
              captures: { sub: $.data.id }
            - call: "POST /funds/${fid}/subscriptions/${sub}/submit"
              payload: {}
              as: TransferAgent
            - call: "POST /funds/${fid}/subscriptions/${sub}/compliance-approve"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /funds/${fid}/subscriptions/${sub}/fundings"
              payload: { amount_cents: 500000, received_at_utc: "2026-08-04T00:00:00Z" }
              as: TransferAgent
            - call: "GET /funds/${fid}"
              payload: {}
              as: FundAdmin
              captures: { fv: $.data.version }
            - call: "POST /funds/${fid}/subscriptions/${sub}/accept"
              payload: { expected_fund_version: "${fv}" }
              as: FundAdmin
            - call: "GET /investors/${inv}/capital-accounts"
              payload: {}
              as: FundAdmin
              captures: { ca: "$.data[0].id" }
            - call: "POST /funds/${fid}/redemptions"
              payload: { capital_account_id: "${ca}", requested_amount_cents: 100000, requested_effective_period_id: "${pid}" }
              as: TransferAgent
              captures: { red: $.data.id }
            - call: "POST /funds/${fid}/redemptions/${red}/approve"
              payload: {}
              as: FundAdmin
            - call: "GET /funds/${fid}"
              payload: {}
              as: FundAdmin
              captures: { fv2: $.data.version }
            - call: "POST /funds/${fid}/nav-periods/${pid}/finalize"
              payload: { gross_return_bps: 0, expected_fund_version: "${fv2}" }
              as: FundAdmin
            - call: "POST /funds/${fid}/nav-periods/${pid}/close"
              payload: {}
              as: FundAdmin
          trigger:
            - call: "POST /funds/${fid}/redemptions/${red}/cancel"
              payload: {}
              as: Investor
              as_user_id: "${inv}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "error_id == ERR_INVALID_STATE"

      - name: idempotent_double_kyc_approve_returns_invalid_state
        claim_type: idempotency
        grounds:
          - "state_machines.KycCase.transitions"
        distinguishing_aspect: "Second approve on already-APPROVED KycCase is rejected ERR_INVALID_STATE."
        test_recipe:
          setup: ["KycCase IN_REVIEW (all docs submitted)"]
          setup_api_calls:
            - call: "POST /investors"
              payload: { legal_name: "I", investor_type: "INDIVIDUAL", tax_id: "T", email: "i@x.com", residence_country: "US", is_us_person: true }
              as: FundAdmin
              captures: { inv: $.data.id }
            - call: "POST /investors/${inv}/kyc-cases"
              payload: { risk_rating: "LOW", pep_hit: false, sanctions_hit: false, adverse_media_hit: false }
              as: ComplianceOfficer
              captures: { kyc: $.data.id }
            - call: "POST /investors/${inv}/kyc-cases/${kyc}/approve"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "POST /investors/${inv}/kyc-cases/${kyc}/approve"
              payload: {}
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "error_id == ERR_INVALID_STATE"

  # =========================================================================
  # Section: calculations — correctness, boundary, precision
  # =========================================================================
  - section: calculations
    instances:
      - name: equalization_factor_zero_when_return_below_hurdle
        claim_type: correct_result
        grounds:
          - "calculations.series_equalization_factor"
        distinguishing_aspect: "When gross_return <= hurdle_return, equalization_factor_bps is exactly 0 (no fee due)."
        test_recipe:
          setup: ["OPEN Series in OPEN NavPeriod; finalize with gross_return_bps below hurdle"]
          setup_api_calls:
            - call: "POST /funds"
              payload: { fund_name: "F1", domicile: "Cayman", gate_threshold_pct: 0.25, lockup_months_default: 0, notice_days_default: 0, fiscal_year_end_month: 12 }
              as: FundAdmin
              captures: { fid: $.data.id }
            - call: "POST /funds/${fid}/share-classes"
              payload: { class_code: "A1", min_initial_investment_cents: 100000, min_additional_investment_cents: 50000, management_fee_bps: 200, performance_fee_bps: 2000, hurdle_rate_bps: 800, high_water_mark_required: false, lockup_months: 0, notice_days: 0, redemption_frequency: "MONTHLY" }
              as: FundAdmin
              captures: { cid: $.data.id }
            - call: "POST /funds/${fid}/nav-periods"
              payload: { period_end_utc: "2026-08-31T23:59:59Z" }
              as: FundAdmin
              captures: { pid: $.data.id }
            - call: "POST /investors"
              payload: { legal_name: "E", investor_type: "INDIVIDUAL", tax_id: "T", email: "e@x.com", residence_country: "US", is_us_person: true }
              as: FundAdmin
              captures: { inv: $.data.id }
            - call: "POST /funds/${fid}/subscriptions"
              payload: { investor_id: "${inv}", share_class_id: "${cid}", commitment_amount_cents: 200000, funding_deadline_utc: "2026-08-05T00:00:00Z" }
              as: FundAdmin
              captures: { sub: $.data.id }
            - call: "POST /funds/${fid}/subscriptions/${sub}/submit"
              payload: {}
              as: TransferAgent
            - call: "POST /funds/${fid}/subscriptions/${sub}/compliance-approve"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /funds/${fid}/subscriptions/${sub}/fundings"
              payload: { amount_cents: 200000, received_at_utc: "2026-08-04T00:00:00Z" }
              as: TransferAgent
            - call: "GET /funds/${fid}"
              payload: {}
              as: FundAdmin
              captures: { fv: $.data.version }
            - call: "POST /funds/${fid}/subscriptions/${sub}/accept"
              payload: { expected_fund_version: "${fv}" }
              as: FundAdmin
            - call: "GET /funds/${fid}"
              payload: {}
              as: FundAdmin
              captures: { fv2: $.data.version }
          trigger:
            - call: "POST /funds/${fid}/nav-periods/${pid}/finalize"
              payload: { gross_return_bps: 300, expected_fund_version: "${fv2}" }
              as: FundAdmin
            - call: "GET /funds/${fid}/share-classes/${cid}/series"
              payload: {}
              as: FundAdmin
              captures: { series_eq: "$.data[0].equalization_factor_bps" }
          assert:
            - "equalization_factor_bps == 0 (300 bps gross < 800 bps annualized hurdle * 31/365)"

      - name: notice_days_liquidity_clause_reduction
        claim_type: correct_result
        grounds:
          - "calculations.notice_days_validation"
        distinguishing_aspect: "LIQUIDITY MFN clause reduces required notice days; reduction applies at approve time."
        test_recipe:
          setup: ["CapitalAccount with SideLetter elected LIQUIDITY clause reducing notice by 5 days"]
          setup_api_calls:
            - call: "POST /funds"
              payload: { fund_name: "F1", domicile: "Cayman", gate_threshold_pct: 0.50, lockup_months_default: 0, notice_days_default: 30, fiscal_year_end_month: 12 }
              as: FundAdmin
              captures: { fid: $.data.id }
            - call: "POST /funds/${fid}/share-classes"
              payload: { class_code: "A1", min_initial_investment_cents: 100000, min_additional_investment_cents: 50000, management_fee_bps: 200, performance_fee_bps: 2000, hurdle_rate_bps: 0, high_water_mark_required: false, lockup_months: 0, notice_days: 30, redemption_frequency: "QUARTERLY" }
              as: FundAdmin
              captures: { cid: $.data.id }
            - call: "POST /funds/${fid}/nav-periods"
              payload: { period_end_utc: "2026-09-30T00:00:00Z" }
              as: FundAdmin
              captures: { pid: $.data.id }
            - call: "POST /funds/${fid}/mfn-clauses"
              payload: { clause_tag: "LIQUIDITY", clause_text: "shave 5", capacity_threshold_cents: 0, fee_rebate_bps: 0, notice_days_reduction: 5 }
              as: FundAdmin
              captures: { clause: $.data.id }
            - call: "POST /investors"
              payload: { legal_name: "L", investor_type: "INDIVIDUAL", tax_id: "T", email: "l@x.com", residence_country: "US", is_us_person: true }
              as: FundAdmin
              captures: { inv: $.data.id }
            - call: "POST /funds/${fid}/subscriptions"
              payload: { investor_id: "${inv}", share_class_id: "${cid}", commitment_amount_cents: 500000, funding_deadline_utc: "2026-08-05T00:00:00Z" }
              as: FundAdmin
              captures: { sub: $.data.id }
            - call: "POST /funds/${fid}/subscriptions/${sub}/submit"
              payload: {}
              as: TransferAgent
            - call: "POST /funds/${fid}/subscriptions/${sub}/compliance-approve"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /funds/${fid}/subscriptions/${sub}/fundings"
              payload: { amount_cents: 500000, received_at_utc: "2026-08-04T00:00:00Z" }
              as: TransferAgent
            - call: "GET /funds/${fid}"
              payload: {}
              as: FundAdmin
              captures: { fv: $.data.version }
            - call: "POST /funds/${fid}/subscriptions/${sub}/accept"
              payload: { expected_fund_version: "${fv}" }
              as: FundAdmin
