          setup:
            - "Clock 2028-02-29T00:00:00Z from the start; one store, R-404A, SYS1 (full 100.0, initial 80.0, installed 2025-01-15), T1 certified to 2029-12-31, EQ1 last verified 2028-01-15, CYL1 with 40.0 lbs."
