            - "One 2,000,000 cent FINAL remittance has been received, so the waterfall put 1,000,000 into the debt-service reserve and 1,000,000 into the capital fund, flipping bond_coverage_status to SATISFIED."
            - "That flip auto-funded the 800,000 cent obligation and released CapitalProject P1 from APPROVED to FUNDED."
            - "The obligation has then been PAID, dropping coverage cash to 200,000 and bond_coverage_status back to DEFICIENT."
