          assert:
            - "EOApplication.${eo_id}.status == CLEARED_TO_BIND after the two PASSED reviews, with legal_review_status == PASSED, underwriting_review_status == PASSED and premium_cents == 60000"
            - "the first DELIVERED attempt returns 409 with error_id ERR_EO_NOT_BOUND"
            - "after that rejection DeliveryPackage.${pkg_id}.status is still VALIDATED and its version did not change"
            - "the second DELIVERED attempt (after BOUND) returns 200 and DeliveryPackage.${pkg_id}.status == DELIVERED"
            - "EOApplication.${eo_id}.status == BOUND with policy_number EO-2026-55 and premium_cents still 60000"
            - "Production.${prod_id}.posture == OPEN throughout, so ERR_PRODUCTION_POSTURE_RESTRICTED (priority 15) never fires and only the sibling-state rule was responsible"

  - rule_id: resource_temporal_overlap
    instances:

      - name: license_term_adjacency_allowed_but_one_day_intersection_refused
        grounds:
          - validations[priority=38]
          - entities.License.fields.term_start_date
          - entities.License.fields.term_end_date
          - errors.ERR_LICENSE_TERM_OVERLAP
        distinguishing_aspect: |
          Half-open interval semantics on the SAME asset/leg/media/territory tuple: a term starting
          exactly on the incumbent's term_end_date is adjacent and must be accepted, while backing
          that start date off by a single day creates a one-day intersection that must be refused.
          The instance also proves the guard is tuple-scoped, not asset-scoped: a DOMESTIC-only
          request over the identical dates is still refused because WORLD swallows DOMESTIC.
        test_recipe:
          setup:
            - "A production in CLEARANCE with one 45-second asset holding an EXECUTED FOOTAGE / BROADCAST / WORLD licence over the half-open term [2026-08-15, 2027-08-15)."
          setup_api_calls:
            - call: "POST /productions"
              payload: { title: "Back To Back Terms", delivery_deadline_date: "2027-12-31" }
              as: ProductionAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /productions/${prod_id}/state"
              payload: { to_status: "CLEARANCE" }
              as: ProductionAdmin
            - call: "POST /archives"
              payload: { name: "Pathe Vault", holder_type: "FILM_ARCHIVE" }
              as: ArchiveResearcher
              captures: { arch_id: $.data.id }
            - call: "POST /archives/${arch_id}/rate-cards"
              payload: { base_rate_per_30s_cents: 60000, minimum_fee_cents: 150000, festival_minimum_fee_cents: 40000, effective_from_date: "2026-01-01" }
              as: ArchiveResearcher
              captures: { rc_id: $.data.id }
            - call: "POST /productions/${prod_id}/assets"
              payload: { asset_type: "ARCHIVAL_FOOTAGE", title: "Market street", timecode_in_seconds: 0, timecode_out_seconds: 45, usage_purpose: "CRITICAL_COMMENTARY" }
              as: ArchiveResearcher
              captures: { asset_id: $.data.id }
            - call: "POST /assets/${asset_id}/source-candidates"
              payload: { archive_id: "${arch_id}", availability_status: "AVAILABLE" }
              as: ArchiveResearcher
              captures: { cand_id: $.data.id }
            - call: "POST /assets/${asset_id}/select-source"
              payload: { source_candidate_id: "${cand_id}" }
              as: ArchiveResearcher
            - call: "POST /licenses"
              payload: { production_id: "${prod_id}", asset_id: "${asset_id}", archive_id: "${arch_id}", rights_leg: "FOOTAGE", media: "BROADCAST", territory: "WORLD", window_class: "ALL_MEDIA_WINDOW", term_months: 12, term_start_date: "2026-08-15", term_end_date: "2027-08-15" }
              as: ClearanceSupervisor
              captures: { lic_a: $.data.id, lic_a_v: $.data.version }
            - call: "POST /licenses/${lic_a}/negotiation-rounds"
              payload: { party: "LICENSOR", proposed_fee_cents: 258750, expected_license_version: "${lic_a_v}" }
              as: RightsHolderRep
              as_user_id: "${arch_id}"
            - call: "POST /licenses/${lic_a}/state"
              payload: { to_status: "EXECUTED" }
              as: ClearanceSupervisor
          trigger:
            - call: "POST /licenses"
              payload: { production_id: "${prod_id}", asset_id: "${asset_id}", archive_id: "${arch_id}", rights_leg: "FOOTAGE", media: "BROADCAST", territory: "WORLD", window_class: "ALL_MEDIA_WINDOW", term_months: 12, term_start_date: "2027-08-14", term_end_date: "2028-08-14" }
              as: ClearanceSupervisor
            - call: "POST /licenses"
              payload: { production_id: "${prod_id}", asset_id: "${asset_id}", archive_id: "${arch_id}", rights_leg: "FOOTAGE", media: "BROADCAST", territory: "DOMESTIC", window_class: "ALL_MEDIA_WINDOW", term_months: 12, term_start_date: "2027-08-14", term_end_date: "2028-08-14" }
              as: ClearanceSupervisor
            - call: "POST /licenses"
              payload: { production_id: "${prod_id}", asset_id: "${asset_id}", archive_id: "${arch_id}", rights_leg: "FOOTAGE", media: "BROADCAST", territory: "WORLD", window_class: "ALL_MEDIA_WINDOW", term_months: 12, term_start_date: "2027-08-15", term_end_date: "2028-08-15" }
              as: ClearanceSupervisor
              captures: { lic_c: $.data.id }
          assert:
            - "the first trigger call (start 2027-08-14, one day inside the incumbent's half-open term) returns 409 with error_id ERR_LICENSE_TERM_OVERLAP"
            - "the second trigger call is ALSO 409 ERR_LICENSE_TERM_OVERLAP — the incumbent's WORLD territory overlaps a DOMESTIC request"
            - "the third trigger call (start 2027-08-15, exactly the incumbent's term_end_date) returns 201 — adjacency is not overlap"
            - "License.${lic_c}.rate_card_fee_cents == 258750 and its status == DRAFT"
            - "GET /licenses?asset_id=${asset_id} returns exactly 2 rows, proving neither rejected call persisted anything"
            - "Production.${prod_id}.committed_fee_cents == 258750 — the accepted adjacent licence is not executed, so it adds nothing to the ledger"

      - name: depiction_window_thirty_day_quiet_buffer_and_status_filtered_blockers
        grounds:
          - validations[priority=39]
          - entities.SubjectRelease.fields.depiction_from_date
          - entities.SubjectRelease.fields.depiction_to_date
          - entities.SubjectRelease.fields.subject_person_key
          - state_machines.SubjectRelease.SENT_to_REFUSED
          - errors.ERR_DEPICTION_WINDOW_CONFLICT
        distinguishing_aspect: |
          A different overlap geometry on a different entity: CLOSED windows widened by a 30-day
          quiet buffer on each side, so two windows that do not touch at all still conflict when the
          gap is 30 days but clear at 31. It is also STATUS-FILTERED — a REFUSED release for the
          same subject_person_key is invisible to the guard, so an identical window that was
          refused earlier does not block the new one.
        test_recipe:
          setup:
            - "A production in CLEARANCE with no assets."
            - "One SENT SubjectRelease for subject_person_key 'walsh-eileen' over the closed window [2026-03-01, 2026-03-31]."
            - "One REFUSED SubjectRelease for subject_person_key 'dunne-martin' over the closed window [2026-06-01, 2026-06-30]."
          setup_api_calls:
            - call: "POST /productions"
              payload: { title: "Quiet Buffer", delivery_deadline_date: "2027-03-31" }
              as: ProductionAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /productions/${prod_id}/state"
              payload: { to_status: "CLEARANCE" }
              as: ProductionAdmin
            - call: "POST /productions/${prod_id}/subject-releases"
              payload: { subject_person_key: "walsh-eileen", release_type: "APPEARANCE", depiction_from_date: "2026-03-01", depiction_to_date: "2026-03-31" }
              as: ProductionAdmin
              captures: { rel_w1: $.data.id }
            - call: "POST /subject-releases/${rel_w1}/state"
              payload: { to_status: "SENT" }
              as: ProductionAdmin
            - call: "POST /productions/${prod_id}/subject-releases"
              payload: { subject_person_key: "dunne-martin", release_type: "LIFE_RIGHTS", depiction_from_date: "2026-06-01", depiction_to_date: "2026-06-30" }
              as: ProductionAdmin
              captures: { rel_d1: $.data.id }
            - call: "POST /subject-releases/${rel_d1}/state"
              payload: { to_status: "SENT" }
              as: ProductionAdmin
            - call: "POST /subject-releases/${rel_d1}/state"
              payload: { to_status: "REFUSED", reason: "Subject declined" }
              as: ProductionAdmin
          trigger:
            - call: "POST /productions/${prod_id}/subject-releases"
              payload: { subject_person_key: "walsh-eileen", release_type: "DEPICTION", depiction_from_date: "2026-04-30", depiction_to_date: "2026-05-31" }
              as: ProductionAdmin
            - call: "POST /productions/${prod_id}/subject-releases"
              payload: { subject_person_key: "walsh-eileen", release_type: "DEPICTION", depiction_from_date: "2026-05-01", depiction_to_date: "2026-05-31" }
              as: ProductionAdmin
              captures: { rel_w2: $.data.id }
            - call: "POST /productions/${prod_id}/subject-releases"
              payload: { subject_person_key: "dunne-martin", release_type: "LIFE_RIGHTS", depiction_from_date: "2026-06-01", depiction_to_date: "2026-06-30" }
              as: ProductionAdmin
              captures: { rel_d2: $.data.id }
          assert:
            - "the first trigger call is 409 ERR_DEPICTION_WINDOW_CONFLICT — widening [2026-04-30, 2026-05-31] by 30 days on each side reaches back to 2026-03-31 and touches the incumbent's closing day"
            - "the second trigger call is 201 — one day later, the widened window opens on 2026-04-01, clear of the incumbent by a single day"
            - "the third trigger call is 201 even though its window is byte-identical to the REFUSED release ${rel_d1}, whose status is outside the blocker set {SENT, REVISION_REQUESTED, SIGNED, APPROVAL_GRANTED}"
            - "SubjectRelease.${rel_w2}.status == DRAFT and SubjectRelease.${rel_d2}.status == DRAFT (creation never auto-sends)"
            - "GET /subject-releases?production_id=${prod_id} returns exactly 4 rows"
            - "Production.${prod_id}.posture is unaffected by these releases because none of them is attached to an asset_id"

  - rule_id: compensating_invariant
    instances:

      - name: termination_reverses_the_mfn_topup_it_received_leaving_no_ledger_residue
        grounds:
          - calculations.production_committed_fee_ledger
          - calculations.mfn_adjusted_fee_cents
          - state_machines.License.EXECUTED_to_TERMINATED
          - entities.License.fields.mfn_topup_cents
          - entities.Asset.fields.lapse_count
        distinguishing_aspect: |
          The compensation must undo an amount the licence NEVER NEGOTIATED: the MASTER leg was
          executed at 28750, then retroactively topped up to 57500 by the PUBLISHING leg's MFN
          parity. Terminating both legs must return committed_fee_cents to exactly 0, which is only
          possible if the debit uses the CURRENT executed_fee_cents (57500) rather than the original
          28750 — a naive implementation strands 28750 cents forever.
        test_recipe:
          setup:
            - "A production in CLEARANCE with one 60-second MUSIC asset (billable_units 2, duration tier 2)."
            - "Two archives, each with one ACTIVE rate card: label 'Harmony Masters' at base 10000, publisher 'Ash Grove Music' at base 20000; both floors 20000."
            - "Both legs are executed with mfn_requested true, MASTER first (28750) then PUBLISHING (57500), which retroactively lifts MASTER to 57500 with mfn_topup_cents 28750."
          setup_api_calls:
            - call: "POST /productions"
              payload: { title: "Parity Ledger", delivery_deadline_date: "2027-12-15" }
              as: ProductionAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /productions/${prod_id}/state"
              payload: { to_status: "CLEARANCE" }
              as: ProductionAdmin
            - call: "POST /archives"
              payload: { name: "Harmony Masters", holder_type: "RECORD_LABEL" }
              as: ArchiveResearcher
              captures: { label_id: $.data.id }
            - call: "POST /archives/${label_id}/rate-cards"
              payload: { base_rate_per_30s_cents: 10000, minimum_fee_cents: 20000, festival_minimum_fee_cents: 10000, effective_from_date: "2026-01-01" }
              as: ArchiveResearcher
              captures: { label_rc: $.data.id }
            - call: "POST /archives"
              payload: { name: "Ash Grove Music", holder_type: "MUSIC_PUBLISHER" }
              as: ArchiveResearcher
              captures: { pub_id: $.data.id }
            - call: "POST /archives/${pub_id}/rate-cards"
              payload: { base_rate_per_30s_cents: 20000, minimum_fee_cents: 20000, festival_minimum_fee_cents: 10000, effective_from_date: "2026-01-01" }
              as: ArchiveResearcher
              captures: { pub_rc: $.data.id }
            - call: "POST /productions/${prod_id}/assets"
              payload: { asset_type: "MUSIC", title: "Reel to reel theme", timecode_in_seconds: 0, timecode_out_seconds: 60, usage_purpose: "ILLUSTRATIVE_BACKGROUND" }
              as: ArchiveResearcher
              captures: { asset_id: $.data.id }
            - call: "POST /licenses"
              payload: { production_id: "${prod_id}", asset_id: "${asset_id}", archive_id: "${label_id}", rights_leg: "MASTER", media: "BROADCAST", territory: "DOMESTIC", window_class: "ALL_MEDIA_WINDOW", term_months: 12, term_start_date: "2026-08-15", term_end_date: "2027-08-15", mfn_requested: true }
              as: ClearanceSupervisor
              captures: { lic_m: $.data.id, lic_m_v: $.data.version }
            - call: "POST /licenses/${lic_m}/negotiation-rounds"
              payload: { party: "LICENSOR", proposed_fee_cents: 28750, expected_license_version: "${lic_m_v}" }
              as: RightsHolderRep
              as_user_id: "${label_id}"
            - call: "POST /licenses/${lic_m}/state"
              payload: { to_status: "EXECUTED" }
              as: ClearanceSupervisor
            - call: "POST /licenses"
              payload: { production_id: "${prod_id}", asset_id: "${asset_id}", archive_id: "${pub_id}", rights_leg: "PUBLISHING", media: "BROADCAST", territory: "DOMESTIC", window_class: "ALL_MEDIA_WINDOW", term_months: 12, term_start_date: "2026-08-15", term_end_date: "2027-08-15", mfn_requested: true }
              as: ClearanceSupervisor
              captures: { lic_p: $.data.id, lic_p_v: $.data.version }
            - call: "POST /licenses/${lic_p}/negotiation-rounds"
              payload: { party: "LICENSOR", proposed_fee_cents: 57500, expected_license_version: "${lic_p_v}" }
              as: RightsHolderRep
              as_user_id: "${pub_id}"
            - call: "POST /licenses/${lic_p}/state"
              payload: { to_status: "EXECUTED" }
              as: ClearanceSupervisor
          trigger:
            - call: "POST /licenses/${lic_p}/state"
              payload: { to_status: "TERMINATED", reason: "Publisher rescinded" }
              as: ClearanceSupervisor
            - call: "POST /licenses/${lic_m}/state"
              payload: { to_status: "TERMINATED", reason: "Cue dropped from the cut" }
              as: ClearanceSupervisor
          assert:
            - "before the trigger: License.${lic_m}.executed_fee_cents == 57500 with mfn_topup_cents == 28750, License.${lic_p}.executed_fee_cents == 57500 with mfn_topup_cents == 0, and Production.${prod_id}.committed_fee_cents == 115000"
            - "after terminating ${lic_p}: committed_fee_cents == 57500 and Asset.${asset_id}.licensing_status == PARTIALLY_CLEARED with lapse_count == 1"
            - "after terminating ${lic_m}: committed_fee_cents == 0 — the debit was 57500, not the originally negotiated 28750"
            - "License.${lic_m}.mfn_topup_cents is still 28750 after termination (history is retained; only the ledger is compensated)"
            - "Asset.${asset_id}.licensing_status == LAPSED, rights_basis == UNDETERMINED, and lapse_count is still 1 — the second termination started from PARTIALLY_CLEARED, so no second lapse is counted"
            - "the §1.3 ledger invariant holds at every step: committed_fee_cents equals the sum of executed_fee_cents over licences in {EXECUTED, ACTIVE, EXPIRING}, which is the empty sum 0 at the end"
            - "Production.${prod_id}.posture == BLOCKED and cleared_asset_count == 0"

      - name: eo_rebind_after_cure_restores_coverage_without_re_rating_or_double_counting
        grounds:
          - state_machines.EOApplication.REMEDIATION_REQUIRED_to_BOUND
          - state_machines.Asset.LAPSED_to_CLEARED
          - calculations.production_committed_fee_ledger
          - calculations.production_clearance_posture
          - entities.EOApplication.fields.premium_cents
          - entities.EOApplication.fields.legal_reviewer_user_id
          - entities.DeliveryPackage.fields.suspension_reason
        distinguishing_aspect: |
          The reverse direction of a compensation, and it is deliberately ASYMMETRIC: curing the
          lapse must restore the E&O policy with premium_cents and both reviewer identities
          UNCHANGED (no re-rating on the way back), must leave the money ledger equal to the
          replacement licence alone (never the expired one plus the replacement), and must NOT
          silently un-suspend the delivery package or reset Asset.lapse_count — the scars stay.
        test_recipe:
          setup:
            - "The exact end state of rights_sweep_expiry_cascades_five_hops_to_eo_remediation: clock 2027-08-20, licence EXPIRED, asset LAPSED with lapse_count 1, posture BLOCKED, chart STALE, package SUSPENDED, E&O REMEDIATION_REQUIRED with premium_cents 60000, policy_number EO-2026-77, legal_reviewer_user_id counsel-beta, underwriting_reviewer_user_id supervisor-one, committed_fee_cents 0, production back in CLEARANCE."
            - "A replacement 12-month licence over [2027-08-20, 2028-08-20) is negotiated on the same asset from the same archive and executed, curing the lapse."
          setup_api_calls:
            - call: "POST /licenses"
              payload: { production_id: "${prod_id}", asset_id: "${asset_id}", archive_id: "${arch_id}", rights_leg: "FOOTAGE", media: "BROADCAST", territory: "WORLD", window_class: "ALL_MEDIA_WINDOW", term_months: 12, term_start_date: "2027-08-20", term_end_date: "2028-08-20" }
              as: ClearanceSupervisor
              captures: { lic_r: $.data.id, lic_r_v: $.data.version }
            - call: "POST /licenses/${lic_r}/negotiation-rounds"
              payload: { party: "LICENSOR", proposed_fee_cents: 258750, expected_license_version: "${lic_r_v}" }
              as: RightsHolderRep
              as_user_id: "${arch_id}"
            - call: "POST /licenses/${lic_r}/state"
              payload: { to_status: "EXECUTED" }
              as: ClearanceSupervisor
          setup_note: "The replacement is accepted despite the earlier term because the incumbent's status EXPIRED is outside the priority-38 blocker set."
          trigger:
            - call: "POST /eo-applications/${eo_id}/state"
              payload: { to_status: "BOUND" }
              as: ProductionAdmin
          assert:
            - "executing ${lic_r} moves Asset.${asset_id} LAPSED -> CLEARED with rights_basis LICENSED, and Production.${prod_id}.posture returns to OPEN with cleared_asset_count 1 and open_asset_count 0"
            - "Asset.${asset_id}.lapse_count is still 1 — curing does not erase the lapse history"
            - "Production.${prod_id}.committed_fee_cents == 258750 exactly: the EXPIRED licence contributes nothing, so the replacement is not double-counted"
            - "the trigger returns 200 and EOApplication.${eo_id}.status == BOUND"
            - "EOApplication.${eo_id}.premium_cents is still 60000 — the re-bind does not re-rate, even though the chart is STALE and a fresh rating would be computed against different rows"
            - "EOApplication.${eo_id}.legal_review_status == PASSED, underwriting_review_status == PASSED, legal_reviewer_user_id == counsel-beta, underwriting_reviewer_user_id == supervisor-one, policy_number == EO-2026-77"
            - "DeliveryPackage.${pkg_id}.status is still SUSPENDED with its suspension_reason intact — the cure does not resurrect a suspended delivery, whose only remaining move is WITHDRAWN"
            - "ClearanceChart.${chart_id}.status is still STALE — only a new pinning supersedes it"
