  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: confidentiality_wall_preempts_not_found_on_unknown_visit_id
        grounds:
          - validations[priority=3]
          - validations[priority=4]
          - errors[ERR_CONFIDENTIALITY_WALL]
          - errors[ERR_VISIT_NOT_FOUND]
        distinguishing_aspect: |
          The conflicting pair is business_safety (rung 3) versus existence (rung 4): an
          EmployerBenefitsAdmin reading a visit id that does not exist receives ERR_CONFIDENTIALITY_WALL
          with 403, while a ProgramAdmin reading the identical id receives ERR_VISIT_NOT_FOUND with 404 -
          proving the wall runs before id resolution and cannot leak existence.
        test_recipe:
          setup:
            - "One employer exists. No visits exist at all."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /employers"
              payload: { legal_name: "Wall Co", employer_code: "WAL", annual_total_cost_of_coverage_cents: 1200000, wellness_budget_cents: 500000, tobacco_program_enabled: false }
              as: ProgramAdmin
              captures: { emp_id: $.data.id }
          trigger:
            - call: "GET /visits/1f0f2a4c-8d2b-4c31-9f77-6b3a91d0c5e1"
              payload: {}
              as: EmployerBenefitsAdmin
              as_user_id: "${emp_id}"
              captures: { err_wall: $.data.error_id }
            - call: "GET /visits/1f0f2a4c-8d2b-4c31-9f77-6b3a91d0c5e1"
              payload: {}
              as: ProgramAdmin
              captures: { err_admin: $.data.error_id }
          assert:
            - "The EmployerBenefitsAdmin read returns HTTP 403 with error_id ERR_CONFIDENTIALITY_WALL"
            - "The ProgramAdmin read returns HTTP 404 with error_id ERR_VISIT_NOT_FOUND"
            - "Neither response body contains any visit field"

      - name: period_freeze_preempts_invalid_enum_on_visit_amend
        grounds:
          - validations[priority=6]
          - validations[priority=8]
          - errors[ERR_PERIOD_FINALIZED]
          - errors[ERR_INVALID_ENUM]
          - state_machines.ReportingPeriod.OPEN_to_FINALIZED
