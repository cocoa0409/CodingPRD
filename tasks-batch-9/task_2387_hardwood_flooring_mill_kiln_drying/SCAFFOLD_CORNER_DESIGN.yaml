            - { call: "POST /mill/kiln-charges/${charge_a}/begin_conditioning", payload: {}, as: KilnOperator }
          trigger:
            - { call: "POST /mill/kiln-charges/${charge_a}/record_stress_test", payload: { shell_moisture_pct: 5.9, core_moisture_pct: 8.0 }, as: KilnOperator }
            - { call: "POST /mill/kiln-charges/${charge_a}/resume_conditioning", payload: {}, as: KilnOperator }
            - { call: "POST /mill/kiln-charges/${charge_a}/record_stress_test", payload: { shell_moisture_pct: 5.9, core_moisture_pct: 8.0 }, as: KilnOperator }
            - { call: "POST /mill/kiln-charges/${charge_a}/resume_conditioning", payload: {}, as: KilnOperator }
            - { call: "POST /mill/kiln-charges/${charge_a}/record_stress_test", payload: { shell_moisture_pct: 5.9, core_moisture_pct: 8.0 }, as: KilnOperator }
            - { call: "POST /mill/kiln-charges/${charge_a}/record_stress_test", payload: { shell_moisture_pct: 6.4, core_moisture_pct: 8.2 }, as: KilnOperator }
          assert:
