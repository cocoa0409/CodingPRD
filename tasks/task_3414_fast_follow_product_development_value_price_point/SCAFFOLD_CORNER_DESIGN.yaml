# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# task_3414_fast_follow_product_development_value_price_point
#
# Breadth probe over §1.1–§1.7. Corners already exercised by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as excluded_because stubs.
# Anchors &c_* are defined at first use and aliased (*c_*) afterwards.
#
# Error-coverage map (all 44 errors -> exercising instance):
#   ERR_UNAUTHENTICATED -> trend_create_missing_auth_returns_unauthenticated
#   ERR_FORBIDDEN_ROLE -> manufacturer_rep_quote_for_foreign_cm_forbidden,
#     launch_plan_patch_field_level_role_split,
#     sourcing_lead_cannot_create_retail_partner_but_can_read,
#     quote_withdraw_restricted_to_owning_manufacturer_rep
#   ERR_INVALID_REQUEST -> concept_create_missing_required_name_returns_invalid_request,
#     trend_create_conditional_field_invalid_request,
#     concept_create_invalid_price_point_and_invalid_enum_rejected,
#     review_dimension_outcome_mismatch_invalid_request
#   12x *_NOT_FOUND -> cost_quote_get_unknown_id_returns_cost_quote_not_found,
#     unknown_ids_return_entity_specific_not_found_per_endpoint,
#     concept_and_quote_body_foreign_keys_checked_in_input_order,
#     product_patch_unknown_id_returns_not_found_before_state_check
#   ERR_INVALID_STATE -> archived_trend_rejects_all_further_transitions,
#     product_kill_reverts_concept_and_supersedes_quotes,
#     quote_double_accept_rejected_invalid_state, quote_settle_requires_launched_product,
#     sampling_activate_requires_executed_plan, slot_creation_temporal_gates,
#     distribute_gates_on_sampling_status_and_committed_units,
#     formula_project_auto_abandoned_at_max_rounds
#   ERR_STALE_VERSION -> quote_create_with_stale_product_version_returns_412,
#     slot_create_with_stale_line_review_version_returns_412
#   ERR_TREND_SCORE_BELOW_THRESHOLD -> diff: trend_score_exactly_at_threshold_selects,
#     trend_score_social_variant_uses_spread_input
#   ERR_TREND_NOT_SELECTED -> concept_create_requires_selected_trend
#   ERR_DUPLICATE_CONCEPT_NAME -> concept_name_unique_until_killed
#   ERR_INVALID_PRICE_POINT -> concept_create_invalid_price_point_and_invalid_enum_rejected
#   ERR_CONCEPT_NOT_SELECTED / ERR_FORMULA_NOT_APPROVED / ERR_QUOTE_NOT_ACCEPTED
#     -> product_advance_referential_gates_fire_in_chain_order
#   ERR_PRODUCT_NOT_SOURCING -> diff: quote_accept_requires_product_in_sourcing
#   ERR_PRODUCT_NOT_LAUNCH_READY -> slot_create_for_not_launch_ready_product_rejected
#   ERR_CM_SUSPENDED -> suspended_cm_blocks_formula_create_and_quote_create
#   ERR_QUOTE_EXPIRED -> quote_lazy_expiry_blocks_accept
#   ERR_BELOW_MOQ -> quote_accept_below_moq_rejected
#   ERR_COST_TARGET_EXCEEDED -> diff: landed_cost_exactly_at_target_accepts_one_cent_over_rejects
#   ERR_CAPACITY_EXCEEDED -> diff: facings_exactly_at_capacity_commits_one_over_rejects,
#     cm_quarterly_capacity_first_accepted_wins, capacity_shrink_blocked_by_active_slot_is_atomic
#   ERR_DOSSIER_ALREADY_EXISTS -> second_dossier_for_same_product_conflict
#   ERR_COMPLIANCE_GATE_FAILED -> diff: plan_approve_blocked_by_lapsed_cert
#   ERR_WINDOW_OVERLAP -> diff: line_review_windows_half_open_adjacency_allowed
#   ERR_SUBMISSION_WINDOW_CLOSED -> slot_creation_temporal_gates
#   ERR_OCCUPANCY_CONFLICT -> diff: slot_occupancy_closed_interval_requires_14day_buffer
#   ERR_UNRESOLVED_SLOTS -> planogram_lock_with_unresolved_slots_rejected
#   ERR_SLOT_NOT_COMMITTED -> diff: referential_error_beats_fiscal_error_on_plan_approve
#   ERR_LAUNCH_WINDOW_NOT_OPEN -> launch_execute_before_occupancy_start_rejected
#   ERR_BUDGET_EXCEEDED -> budget_clamp_below_moq_returns_budget_exceeded
#   ERR_SAMPLE_OVERDRAW -> sample_commit_at_and_over_cap_boundary,
#     distribute_gates_on_sampling_status_and_committed_units
#   ERR_SUCCESSOR_INVALID -> discontinuation_successor_validation
#   ERR_SEGREGATION_OF_DUTIES -> discontinuation_approve_by_proposing_user_returns_forbidden
#   ERR_INVALID_DATE_RANGE -> line_review_invalid_date_range_rejected
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:
      - name: trend_signal_create_system_field_input_ignored
        claim_type: Creation
        grounds:
          - entities.TrendSignal
          - endpoints.POST_/trend-signals
        distinguishing_aspect: "A trend created with the four required inputs comes back 201 in DISCOVERED with version 1, a null momentum_score, and server-minted id/created_at/updated_at — client-supplied id/version/created_at in the body are ignored, never stored."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - &c_clock
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /trend-signals"
              payload: { id: "00000000-0000-4000-8000-0000000000aa", version: 99, created_at: "1999-01-01T00:00:00Z", source: "PRESTIGE_LAUNCH", platform: "runway", category: "EYES", mention_velocity_7d: 4000, engagement_growth_pct: 1.0, prestige_similarity: 0.75 }
              as: TrendScout
              as_user_id: "ts-ivy"
              captures: { t0_id: $.data.id, t0_version: $.data.version }
          assert:
            - "the response status is 201 and response_type is object"
            - "TrendSignal.${t0_id}.status == DISCOVERED and momentum_score is null"
            - "t0_version == 1 and the returned id is a fresh server UUID != 00000000-0000-4000-8000-0000000000aa"
            - "created_at == 2026-09-01T00:00:00Z (the logical clock), not the client-supplied 1999 value"
            - "meta.api_request_id and meta.api_request_timestamp are present"

      - name: products_list_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/products
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three products on file, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true; offset=2 returns the last row with has_more false — total_count counts the full filtered set, not the page."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One SELECTED trend; three concepts (Alpha/Beta/Gamma) each commercialized into a product."
          setup_api_calls:
            - *c_clock
            - &c_trend
              call: "POST /trend-signals"
              payload: { source: "PRESTIGE_LAUNCH", platform: "runway", category: "EYES", mention_velocity_7d: 4000, engagement_growth_pct: 1.0, prestige_similarity: 0.75 }
              as: TrendScout
              as_user_id: "ts-ivy"
              captures: { trend_id: $.data.id }
            - &c_trend_eval
              call: "PATCH /trend-signals/${trend_id}"
              payload: { status: "EVALUATING" }
              as: TrendScout
              as_user_id: "ts-ivy"
            - &c_trend_select
              call: "PATCH /trend-signals/${trend_id}"
              payload: { status: "SELECTED" }
              as: TrendScout
              as_user_id: "ts-ivy"
            - &c_concept
              call: "POST /concepts"
              payload: { trend_signal_id: "${trend_id}", name: "Alpha Lash", category: "EYES", target_price_point_cents: 1000 }
              as: TrendScout
              as_user_id: "ts-ivy"
              captures: { concept_id: $.data.id }
            - &c_concept_select
              call: "PATCH /concepts/${concept_id}"
              payload: { status: "SELECTED" }
              as: TrendScout
              as_user_id: "ts-ivy"
            - call: "POST /concepts"
              payload: { trend_signal_id: "${trend_id}", name: "Beta Brow", category: "EYES", target_price_point_cents: 600 }
              as: TrendScout
              as_user_id: "ts-ivy"
              captures: { concept_b: $.data.id }
            - call: "PATCH /concepts/${concept_b}"
              payload: { status: "SELECTED" }
              as: TrendScout
              as_user_id: "ts-ivy"
            - call: "POST /concepts"
              payload: { trend_signal_id: "${trend_id}", name: "Gamma Glow", category: "EYES", target_price_point_cents: 300 }
              as: TrendScout
              as_user_id: "ts-ivy"
              captures: { concept_c: $.data.id }
            - call: "PATCH /concepts/${concept_c}"
              payload: { status: "SELECTED" }
              as: TrendScout
              as_user_id: "ts-ivy"
            - &c_product
              call: "POST /products"
              payload: { concept_id: "${concept_id}", sku_name: "ALPHA-01", tooling_code: "LASH-TUBE-V1" }
              as: ProductManager
              as_user_id: "pm-nadia"
              captures: { product_id: $.data.id, product_v0: $.data.version }
            - call: "POST /products"
              payload: { concept_id: "${concept_b}", sku_name: "BETA-01" }
              as: ProductManager
              as_user_id: "pm-nadia"
            - call: "POST /products"
              payload: { concept_id: "${concept_c}", sku_name: "GAMMA-01" }
              as: ProductManager
              as_user_id: "pm-nadia"
          trigger:
            - call: "GET /products"
              payload: { limit: 2, offset: 0 }
              as: ProductManager
              as_user_id: "pm-nadia"
          assert:
            - "the response status is 200 and response_type is array"
            - "page 1 returns exactly 2 rows with total_count == 3 and has_more == true"
            - "GET /products with limit=2&offset=2 returns exactly 1 row with total_count == 3 and has_more == false"
            - "GET /products with no query parameters applies defaults limit=10, offset=0 and returns all 3 rows"

      - name: concept_get_roundtrips_stored_and_computed_fields
        claim_type: Retrieval
        grounds:
          - entities.Concept
          - endpoints.GET_/concepts/{id}
        distinguishing_aspect: "GET returns the concept exactly as posted plus the SELECTED side effects — target_unit_cost_cents 260 computed from price point 1000 and a non-null selected_at."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Trend SELECTED; concept Alpha Lash SELECTED."
          setup_api_calls:
            - *c_clock
            - *c_trend
            - *c_trend_eval
            - *c_trend_select
            - *c_concept
            - *c_concept_select
          trigger:
            - call: "GET /concepts/${concept_id}"
              payload: {}
              as: ProductManager
              as_user_id: "pm-nadia"
          assert:
            - "the response status is 200"
            - "Concept.${concept_id}.name == \"Alpha Lash\" and category == \"EYES\" and target_price_point_cents == 1000"
            - "Concept.${concept_id}.status == SELECTED and target_unit_cost_cents == 260 and selected_at == 2026-09-01T00:00:00Z"

      - name: cost_quote_get_unknown_id_returns_cost_quote_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/cost-quotes/{id}
          - errors.ERR_COST_QUOTE_NOT_FOUND
        distinguishing_aspect: "A syntactically valid but unallocated quote id returns the entity-specific 404 ERR_COST_QUOTE_NOT_FOUND, not a generic 404 and not a 400."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. No quotes exist."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "GET /cost-quotes/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: SourcingLead
              as_user_id: "sl-omar"
              captures: { err_nf: $.data.error_id }
          assert:
            - "the response status is 404 and err_nf == ERR_COST_QUOTE_NOT_FOUND"
            - "response_type is error and data carries both error_id and message"

      - name: unknown_ids_return_entity_specific_not_found_per_endpoint
        claim_type: Not Found
        grounds:
          - errors.ERR_CONCEPT_NOT_FOUND
          - errors.ERR_PRODUCT_NOT_FOUND
          - errors.ERR_MANUFACTURER_NOT_FOUND
          - errors.ERR_FORMULA_PROJECT_NOT_FOUND
          - errors.ERR_DOSSIER_NOT_FOUND
          - errors.ERR_RETAIL_PARTNER_NOT_FOUND
          - errors.ERR_LINE_REVIEW_NOT_FOUND
          - errors.ERR_PLANOGRAM_SLOT_NOT_FOUND
          - errors.ERR_LAUNCH_PLAN_NOT_FOUND
          - errors.ERR_DISCONTINUATION_REVIEW_NOT_FOUND
        distinguishing_aspect: "Every single-resource GET maps an unknown id to its OWN error code — eleven entity-specific 404s, never a shared generic."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "GET /concepts/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: PlatformAdmin
              captures: { e_concept: $.data.error_id }
            - call: "GET /products/00000000-0000-4000-8000-000000000002"
              payload: {}
              as: PlatformAdmin
              captures: { e_product: $.data.error_id }
            - call: "GET /manufacturers/00000000-0000-4000-8000-000000000003"
              payload: {}
              as: PlatformAdmin
              captures: { e_cm: $.data.error_id }
            - call: "GET /formula-projects/00000000-0000-4000-8000-000000000004"
              payload: {}
              as: PlatformAdmin
              captures: { e_fp: $.data.error_id }
            - call: "GET /compliance-dossiers/00000000-0000-4000-8000-000000000005"
              payload: {}
              as: PlatformAdmin
              captures: { e_dossier: $.data.error_id }
            - call: "GET /retail-partners/00000000-0000-4000-8000-000000000006"
              payload: {}
              as: PlatformAdmin
              captures: { e_partner: $.data.error_id }
            - call: "GET /line-reviews/00000000-0000-4000-8000-000000000007"
              payload: {}
              as: PlatformAdmin
              captures: { e_lr: $.data.error_id }
            - call: "GET /planogram-slots/00000000-0000-4000-8000-000000000008"
              payload: {}
              as: PlatformAdmin
              captures: { e_slot: $.data.error_id }
            - call: "GET /launch-plans/00000000-0000-4000-8000-000000000009"
              payload: {}
              as: PlatformAdmin
              captures: { e_plan: $.data.error_id }
            - call: "GET /discontinuation-reviews/00000000-0000-4000-8000-00000000000a"
              payload: {}
              as: PlatformAdmin
              captures: { e_dr: $.data.error_id }
          assert:
            - "e_concept == ERR_CONCEPT_NOT_FOUND and e_product == ERR_PRODUCT_NOT_FOUND and e_cm == ERR_MANUFACTURER_NOT_FOUND"
            - "e_fp == ERR_FORMULA_PROJECT_NOT_FOUND and e_dossier == ERR_DOSSIER_NOT_FOUND and e_partner == ERR_RETAIL_PARTNER_NOT_FOUND"
            - "e_lr == ERR_LINE_REVIEW_NOT_FOUND and e_slot == ERR_PLANOGRAM_SLOT_NOT_FOUND and e_plan == ERR_LAUNCH_PLAN_NOT_FOUND and e_dr == ERR_DISCONTINUATION_REVIEW_NOT_FOUND"
            - "all ten responses are 404 with response_type error"

      - name: concept_create_missing_required_name_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Concept.fields.name
          - validations[priority=3]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "Omitting the required name is a 400 ERR_INVALID_REQUEST from the shape check — it precedes even the trend-existence check, so an unknown trend_signal_id in the same body does not change the answer."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Trend SELECTED."
          setup_api_calls:
            - *c_clock
            - *c_trend
            - *c_trend_eval
            - *c_trend_select
          trigger:
            - call: "POST /concepts"
              payload: { trend_signal_id: "${trend_id}", category: "EYES", target_price_point_cents: 1000 }
              as: TrendScout
              as_user_id: "ts-ivy"
              captures: { err_req: $.data.error_id }
          assert:
            - "the response status is 400 and err_req == ERR_INVALID_REQUEST"
            - "GET /concepts?trend_signal_id=${trend_id} returns 0 rows"

      - name: trend_create_conditional_field_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.TrendSignal.fields.prestige_similarity
          - entities.TrendSignal.fields.cross_platform_spread
          - validations[priority=3]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "Conditional requiredness keyed on source: PRESTIGE_LAUNCH without prestige_similarity is a 400, SOCIAL_PLATFORM without cross_platform_spread is a 400, and SOCIAL_PLATFORM WITH spread (and no prestige_similarity) succeeds — the requirement flips with the enum value."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /trend-signals"
              payload: { source: "PRESTIGE_LAUNCH", platform: "runway", category: "EYES", mention_velocity_7d: 1000, engagement_growth_pct: 0.5 }
              as: TrendScout
              as_user_id: "ts-ivy"
              captures: { err_cond1: $.data.error_id }
            - call: "POST /trend-signals"
              payload: { source: "SOCIAL_PLATFORM", platform: "tiktok", category: "LIPS", mention_velocity_7d: 1000, engagement_growth_pct: 0.5 }
              as: TrendScout
              as_user_id: "ts-ivy"
              captures: { err_cond2: $.data.error_id }
            - call: "POST /trend-signals"
              payload: { source: "SOCIAL_PLATFORM", platform: "tiktok", category: "LIPS", mention_velocity_7d: 2500, engagement_growth_pct: 1.0, cross_platform_spread: 0.9 }
              as: TrendScout
              as_user_id: "ts-ivy"
              captures: { t_soc: $.data.id }
          assert:
            - "the first two creates return 400 with err_cond1 == err_cond2 == ERR_INVALID_REQUEST"
            - "the third create returns 201 and TrendSignal.${t_soc}.status == DISCOVERED"
            - "GET /trend-signals returns exactly 1 row"

      - name: concept_create_invalid_price_point_and_invalid_enum_rejected
        claim_type: Type Constraints
        grounds:
          - validations[priority=19]
          - validations[priority=3]
          - errors.ERR_INVALID_PRICE_POINT
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "Two type-level rejections on different fields: a price point of 700 cents is not one of the five fixed retail price points (422 ERR_INVALID_PRICE_POINT), and a status value outside the machine's enum on PATCH (\"BOGUS\") is a 400 ERR_INVALID_REQUEST before any state logic runs."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Trend SELECTED."
          setup_api_calls:
            - *c_clock
            - *c_trend
            - *c_trend_eval
            - *c_trend_select
          trigger:
            - call: "POST /concepts"
              payload: { trend_signal_id: "${trend_id}", name: "Off Price", category: "EYES", target_price_point_cents: 700 }
              as: TrendScout
              as_user_id: "ts-ivy"
              captures: { err_pp: $.data.error_id }
            - call: "PATCH /trend-signals/${trend_id}"
              payload: { status: "BOGUS" }
              as: TrendScout
              as_user_id: "ts-ivy"
              captures: { err_enum: $.data.error_id }
          assert:
            - "the concept create returns 422 and err_pp == ERR_INVALID_PRICE_POINT"
            - "the PATCH returns 400 and err_enum == ERR_INVALID_REQUEST"
            - "GET /concepts?trend_signal_id=${trend_id} returns 0 rows and TrendSignal.${trend_id}.status is still SELECTED"

      - name: quote_create_omitting_tooling_fee_defaults_to_zero
        claim_type: Defaults
        grounds:
          - entities.CostQuote.fields.tooling_fee_cents
          - calculations.landed_unit_cost
        distinguishing_aspect: "tooling_fee_cents declares default 0: omitting it stores 0 (not null), so the provisional landed cost carries no amortization component — 200 + 0 + 4 + 20 = 224, not 234."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Product in SOURCING with APPROVED formula (FastLab CM onboarded)."
          setup_api_calls:
            - *c_clock
            - *c_trend
            - *c_trend_eval
            - *c_trend_select
            - *c_concept
            - *c_concept_select
            - &c_cm
              call: "POST /manufacturers"
              payload: { name: "FastLab Cosmetics", capabilities: ["EYES", "LIPS"], base_lead_time_weeks: 4, moq_units: 500, quality_tier: "STANDARD", capacity_slots_per_quarter: 4 }
              as: SourcingLead
              as_user_id: "sl-omar"
              captures: { cm_id: $.data.id }
            - *c_product
            - &c_fp
              call: "POST /formula-projects"
              payload: { product_id: "${product_id}", contract_manufacturer_id: "${cm_id}", brief: "Volumizing mascara, vegan wax blend" }
              as: SourcingLead
              as_user_id: "sl-omar"
              captures: { fp_id: $.data.id }
            - &c_fp_sample
              call: "PATCH /formula-projects/${fp_id}"
              payload: { status: "SAMPLE_REVIEW" }
              as: ManufacturerRep
              as_user_id: "${cm_id}"
            - &c_fp_approve
              call: "PATCH /formula-projects/${fp_id}"
              payload: { status: "APPROVED" }
              as: SourcingLead
              as_user_id: "sl-omar"
            - &c_prod_sourcing
              call: "PATCH /products/${product_id}"
              payload: { status: "SOURCING" }
              as: ProductManager
              as_user_id: "pm-nadia"
              captures: { product_v: $.data.version }
          trigger:
            - call: "POST /cost-quotes"
              payload: { product_id: "${product_id}", contract_manufacturer_id: "${cm_id}", unit_cost_cents: 200, freight_total_cents: 40000, unit_weight_grams: 50, shipment_weight_grams: 500000, duty_rate: 0.10, initial_order_qty: 1000, valid_until: "2026-12-31T00:00:00Z", production_quarter: "2026-Q4", expected_product_version: "${product_v}" }
              as: ManufacturerRep
              as_user_id: "${cm_id}"
              captures: { q_def: $.data.id, q_def_landed: $.data.landed_provisional_cents }
          assert:
            - "the response status is 201"
            - "CostQuote.${q_def}.tooling_fee_cents == 0  (default applied, not null)"
            - "q_def_landed == 224  (200 + ceil(0/1000)=0 + round(40000*50/500000)=4 + round(204*0.10)=20)"

      - name: concept_select_computes_target_cost_and_input_ignored
        claim_type: Computed Fields
        grounds:
          - entities.Concept.fields.target_unit_cost_cents
          - calculations.target_unit_cost
        distinguishing_aspect: "target_unit_cost_cents is computed at SELECTED: a client-supplied value at creation is ignored, and after selection the field reads exactly floor(1000 * 0.26) = 260 — input never leaks into a computed field."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Trend SELECTED."
          setup_api_calls:
            - *c_clock
            - *c_trend
            - *c_trend_eval
            - *c_trend_select
          trigger:
            - call: "POST /concepts"
              payload: { trend_signal_id: "${trend_id}", name: "Sneaky Cost", category: "EYES", target_price_point_cents: 1000, target_unit_cost_cents: 1 }
              as: TrendScout
              as_user_id: "ts-ivy"
              captures: { c_sneak: $.data.id }
            - call: "PATCH /concepts/${c_sneak}"
              payload: { status: "SELECTED" }
              as: TrendScout
              as_user_id: "ts-ivy"
              captures: { sneak_cost: $.data.target_unit_cost_cents }
          assert:
            - "at creation Concept.${c_sneak}.target_unit_cost_cents is null  (the supplied 1 was ignored)"
            - "after selection sneak_cost == 260  (floor(1000 * 0.26))"

      - name: concept_and_quote_body_foreign_keys_checked_in_input_order
        claim_type: Parent Relationships
        grounds:
          - validations[priority=5]
          - endpoints.POST_/concepts
          - endpoints.POST_/cost-quotes
          - errors.ERR_TREND_SIGNAL_NOT_FOUND
          - errors.ERR_PRODUCT_NOT_FOUND
          - complexity_profile.entity_topology
        distinguishing_aspect: "Flat topology puts FKs in the body, checked in declared input order: a concept with an unknown trend yields ERR_TREND_SIGNAL_NOT_FOUND; a quote with BOTH product_id and contract_manufacturer_id unknown reports ERR_PRODUCT_NOT_FOUND first because product_id is declared before contract_manufacturer_id."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One product exists (trend -> concept -> product), so the quote's OCC version is a real captured value; the quote body then references an unknown product_id AND an unknown contract_manufacturer_id."
          setup_api_calls:
            - *c_clock
            - *c_trend
            - *c_trend_eval
            - *c_trend_select
            - *c_concept
            - *c_concept_select
            - *c_product
          trigger:
            - call: "POST /concepts"
              payload: { trend_signal_id: "00000000-0000-4000-8000-0000000000f1", name: "Ghost Concept", category: "EYES", target_price_point_cents: 1000 }
              as: TrendScout
              as_user_id: "ts-ivy"
              captures: { err_fk1: $.data.error_id }
            - call: "POST /cost-quotes"
              payload: { product_id: "00000000-0000-4000-8000-0000000000f2", contract_manufacturer_id: "00000000-0000-4000-8000-0000000000f3", unit_cost_cents: 200, freight_total_cents: 40000, unit_weight_grams: 50, shipment_weight_grams: 500000, duty_rate: 0.10, initial_order_qty: 1000, valid_until: "2026-12-31T00:00:00Z", production_quarter: "2026-Q4", expected_product_version: "${product_v0}" }
              as: ManufacturerRep
              as_user_id: "00000000-0000-4000-8000-0000000000f3"
              captures: { err_fk2: $.data.error_id }
          assert:
            - "the concept create returns 404 and err_fk1 == ERR_TREND_SIGNAL_NOT_FOUND"
            - "the quote create returns 404 and err_fk2 == ERR_PRODUCT_NOT_FOUND  (product_id precedes contract_manufacturer_id in the input list)"
            - "err_fk2 != ERR_MANUFACTURER_NOT_FOUND"

      - name: concept_create_requires_selected_trend
        claim_type: Parent Relationships
        grounds:
          - validations[priority=9]
          - errors.ERR_TREND_NOT_SELECTED
        distinguishing_aspect: "Referential gate on the flat FK: the trend exists and is even EVALUATING (score 70.0 computed), but until it is SELECTED the concept create fails with ERR_TREND_NOT_SELECTED — existence alone is not enough."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Trend evaluated to score 70.0 but never SELECTED."
          setup_api_calls:
            - *c_clock
            - *c_trend
            - *c_trend_eval
          trigger:
            - call: "POST /concepts"
              payload: { trend_signal_id: "${trend_id}", name: "Too Early", category: "EYES", target_price_point_cents: 1000 }
              as: TrendScout
              as_user_id: "ts-ivy"
              captures: { err_ref: $.data.error_id }
          assert:
            - "the response status is 422 and err_ref == ERR_TREND_NOT_SELECTED"
            - "GET /concepts?trend_signal_id=${trend_id} returns 0 rows"

  - section: state_machines
    instances:
      - name: trend_park_and_reevaluate_cycle_recomputes_score
        claim_type: Valid Transition
        grounds:
          - state_machines.TrendSignal.EVALUATING_to_PARKED
          - state_machines.TrendSignal.PARKED_to_EVALUATING
        distinguishing_aspect: "The cyclic edge PARKED -> EVALUATING is legal and re-runs the scoring side effect: evaluated_at is re-stamped and momentum_score recomputed (same inputs -> same 70.0) — the loop does not corrupt the derived field."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Trend EVALUATING with score 70.0."
          setup_api_calls:
            - *c_clock
            - *c_trend
            - *c_trend_eval
          trigger:
            - call: "PATCH /trend-signals/${trend_id}"
              payload: { status: "PARKED" }
              as: TrendScout
              as_user_id: "ts-ivy"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-08T00:00:00Z" }
              as: PlatformAdmin
            - call: "PATCH /trend-signals/${trend_id}"
              payload: { status: "EVALUATING" }
              as: TrendScout
              as_user_id: "ts-ivy"
              captures: { t_score2: $.data.momentum_score, t_eval2: $.data.evaluated_at }
          assert:
            - "the PARKED transition returns 200 and status PARKED"
            - "the re-EVALUATING transition returns 200 with status EVALUATING"
            - "t_score2 == 70.0  (recomputed from unchanged inputs)"
            - "t_eval2 == 2026-09-08T00:00:00Z  (side effect re-stamped at the logical clock)"

      - name: archived_trend_rejects_all_further_transitions
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.TrendSignal
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "ARCHIVED is terminal: every further status target (EVALUATING shown, also PARKED/SELECTED/ARCHIVED) is rejected with 409 ERR_INVALID_STATE and nothing changes."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Trend DISCOVERED then ARCHIVED directly."
          setup_api_calls:
            - *c_clock
            - *c_trend
            - call: "PATCH /trend-signals/${trend_id}"
              payload: { status: "ARCHIVED" }
              as: TrendScout
              as_user_id: "ts-ivy"
          trigger:
            - call: "PATCH /trend-signals/${trend_id}"
              payload: { status: "EVALUATING" }
              as: TrendScout
              as_user_id: "ts-ivy"
              captures: { err_term: $.data.error_id }
            - call: "PATCH /trend-signals/${trend_id}"
              payload: { status: "SELECTED" }
              as: TrendScout
              as_user_id: "ts-ivy"
              captures: { err_term2: $.data.error_id }
          assert:
            - "both attempts return 409 with err_term == err_term2 == ERR_INVALID_STATE"
            - "TrendSignal.${trend_id}.status is still ARCHIVED and momentum_score is still null"

      - name: formula_project_auto_abandoned_at_max_rounds
        claim_type: Valid Transition
        grounds:
          - state_machines.FormulaProject.SAMPLE_REVIEW_to_ABANDONED
          - state_machines.FormulaProject.SAMPLE_REVIEW_to_IN_DEVELOPMENT
        distinguishing_aspect: "The third sample rejection (round_count == MAX_FORMULA_ROUNDS == 3) does not loop back to IN_DEVELOPMENT — the machine auto-transitions to ABANDONED instead, and ABANDONED is terminal."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Product in FORMULATION with one formula project (round_count 1)."
          setup_api_calls:
            - *c_clock
            - *c_trend
            - *c_trend_eval
            - *c_trend_select
            - *c_concept
            - *c_concept_select
            - *c_cm
            - *c_product
            - *c_fp
          trigger:
            - *c_fp_sample
            - call: "PATCH /formula-projects/${fp_id}"
              payload: { status: "IN_DEVELOPMENT" }
              as: SourcingLead
              as_user_id: "sl-omar"
              captures: { fp_r2: $.data.round_count }
            - *c_fp_sample
            - call: "PATCH /formula-projects/${fp_id}"
              payload: { status: "IN_DEVELOPMENT" }
              as: SourcingLead
              as_user_id: "sl-omar"
              captures: { fp_r3: $.data.round_count }
            - *c_fp_sample
            - call: "PATCH /formula-projects/${fp_id}"
              payload: { status: "IN_DEVELOPMENT" }
              as: SourcingLead
              as_user_id: "sl-omar"
              captures: { fp_final: $.data.status }
            - call: "PATCH /formula-projects/${fp_id}"
              payload: { status: "SAMPLE_REVIEW" }
              as: SourcingLead
              as_user_id: "sl-omar"
              captures: { err_dead: $.data.error_id }
          assert:
            - "fp_r2 == 2 and fp_r3 == 3  (each rejection increments the round)"
            - "the third rejection lands fp_final == ABANDONED, not IN_DEVELOPMENT"
            - "the fourth submit attempt returns 409 and err_dead == ERR_INVALID_STATE  (ABANDONED is terminal)"

      - name: product_kill_reverts_concept_and_supersedes_quotes
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Product.SOURCING_to_KILLED
          - state_machines.Concept.IN_DEVELOPMENT_to_SELECTED
          - state_machines.CostQuote.UNDER_EVALUATION_to_SUPERSEDED
        distinguishing_aspect: "Killing a SOURCING product is a compensation: the concept loops back to SELECTED (re-commercializable) and the live UNDER_EVALUATION quote is SUPERSEDED — both side effects fire atomically."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Product in SOURCING with an APPROVED formula and a quote UNDER_EVALUATION."
          setup_api_calls:
            - *c_clock
            - *c_trend
            - *c_trend_eval
            - *c_trend_select
            - *c_concept
            - *c_concept_select
            - *c_cm
            - *c_product
            - *c_fp
            - *c_fp_sample
            - *c_fp_approve
            - *c_prod_sourcing
            - &c_quote
              call: "POST /cost-quotes"
              payload: { product_id: "${product_id}", contract_manufacturer_id: "${cm_id}", unit_cost_cents: 200, tooling_fee_cents: 10000, freight_total_cents: 40000, unit_weight_grams: 50, shipment_weight_grams: 500000, duty_rate: 0.10, initial_order_qty: 1000, valid_until: "2026-12-31T00:00:00Z", production_quarter: "2026-Q4", expected_product_version: "${product_v}" }
              as: ManufacturerRep
              as_user_id: "${cm_id}"
              captures: { quote_id: $.data.id }
            - &c_quote_eval
              call: "PATCH /cost-quotes/${quote_id}"
              payload: { status: "UNDER_EVALUATION" }
              as: SourcingLead
              as_user_id: "sl-omar"
          trigger:
            - call: "PATCH /products/${product_id}"
              payload: { status: "KILLED" }
              as: ProductManager
              as_user_id: "pm-nadia"
          assert:
            - "Product.${product_id}.status == KILLED"
            - "Concept.${concept_id}.status == SELECTED  (revision loop — the concept survives its product)"
            - "CostQuote.${quote_id}.status == SUPERSEDED"
            - "a fresh POST /products with concept_id ${concept_id} returns 201  (the loop is re-enterable)"

      - name: quote_double_accept_rejected_invalid_state
        claim_type: Idempotency
        grounds:
          - state_machines.CostQuote.UNDER_EVALUATION_to_ACCEPTED
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "The ACCEPTED transition is not idempotent: repeating the same PATCH on an already-ACCEPTED quote is a 409 ERR_INVALID_STATE, and the second attempt must not re-pin the formula version or double-consume CM capacity."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Product in SOURCING; quote ACCEPTED (pinned formula_version 1, one 2026-Q4 slot consumed)."
          setup_api_calls:
            - *c_clock
            - *c_trend
            - *c_trend_eval
            - *c_trend_select
            - *c_concept
            - *c_concept_select
