            - call: "POST /atfm/tmis/${tmi}/activate"
              as: FlowManager
            - call: "POST /atfm/tmis/${tmi}/substitutions"
              payload: { flight_id_1: "${f1}", flight_id_2: "${f3}" }
              as: Operator
              as_user_id: "${op_a}"
          trigger:
            - call: "POST /atfm/tmis/${tmi}/cancel"
