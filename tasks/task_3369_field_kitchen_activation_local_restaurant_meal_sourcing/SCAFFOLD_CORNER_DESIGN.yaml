          - state_machines.Supplier.transitions
          - errors[ERR_SUPPLIER_NOT_APPROVED]
        distinguishing_aspect: "reliability_score is 50 + 10*delivered_count - 25*disputed_count, so two delivered orders give exactly 70 and APPROVED while one delivered plus one disputed gives 35, which is below the 40 suspension threshold and forces SUSPENDED."
