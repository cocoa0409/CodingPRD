# =============================================================================
# PRD Benchmark Scaffold — Urgent Care Walk-In Queue & Visit
# Difficulty tier: EXPERT (§0.4)
# Files: SCAFFOLD.yaml (§1.0–§1.7) + SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8)
#        + SCAFFOLD_CORNER_DESIGN.yaml (§1.9)
# =============================================================================

scenario: |
  Urgent Care Walk-In Queue & Visit: online check-in/save-my-spot, triage (ESI)
  & wait estimate, registration/insurance/self-pay, visit charting, occupational
  health (drug screen/physical), referral/transfer to ER, discharge instructions,
  follow-up

domain_name: urgent-care-walk-in-queue
api_prefix: /
# Flat/hybrid topology: many top-level collections (/clinics, /patients, /visits,
# /coverages, /occ-health-orders, /referrals, /charges, /exam-rooms, /providers,
# /queue-entries, /discharge-instructions). Root prefix keeps every collection a
# first-class top-level resource rather than forcing a single owning tree.

# -----------------------------------------------------------------------------
# §0.3 Complexity profile
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: hybrid
  # Clinic is the root aggregate; ExamRoom/Provider/QueueEntry hang off it;
  # Patient/Coverage/Visit/Charge/OccHealthOrder/Referral/DischargeInstruction
  # are flat peers linked by FK references across aggregate boundaries.

  state_machine_shape: compound
  # QueueEntry & Visit are non-linear (Visit carries two parallel state
  # dimensions clinical_status × billing_status; QueueEntry has a revision
  # cycle TRIAGED→IN_REGISTRATION→TRIAGED for re-triage). Clinic posture is a
  # derived aggregate field over ExamRoom occupancy and active QueueEntry load.

  relationship_patterns:
    - one_to_many        # Clinic -> ExamRoom / Provider / QueueEntry
    - cross_aggregate    # Visit references Patient, QueueEntry, ExamRoom, Provider
    - polymorphic        # Charge.source_ref polymorphic over Visit / OccHealthOrder

  role_model: peer_roles
  # FrontDeskClerk (registration), TriageNurse (ESI), Provider (charting),
  # ClinicManager (capacity/posture/ops), Patient (self check-in). Each owns a
  # distinct slice of the surface; ClinicManager has operational overrides only.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Clinic
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: name, type: string, source: input, description: "Clinic display name" }
      - { name: exam_room_capacity, type: integer, source: input, description: "Total exam rooms physically available; informational ceiling, ExamRoom rows are created explicitly", constraints: ">= 1" }
      - { name: surge_threshold, type: integer, source: input, default: 8, description: "Active-queue depth at which posture escalates OPEN -> SURGE (>=, see §1.3 clinic_posture)", constraints: ">= 1" }
      - { name: diversion_threshold, type: integer, source: input, default: 14, description: "Active-queue depth at which posture escalates to DIVERSION (>=, see §1.3 clinic_posture)", constraints: "> surge_threshold" }
      - { name: avg_provider_minutes_per_esi, type: object, source: input, description: "Map ESI level (1..5) -> mean provider minutes; used by wait-estimate calc", default: "{\"1\":40,\"2\":30,\"3\":20,\"4\":12,\"5\":8}" }
      - { name: self_pay_discount_pct, type: number, source: input, default: 0.30, description: "Prompt-pay discount fraction applied to self-pay charge totals (see §1.3 charge_total)", constraints: "0 <= x < 1" }
      - { name: posture, type: enum, source: computed, description: "OPEN | SURGE | DIVERSION — derived from active-queue depth vs thresholds (§1.3 clinic_posture)" }
      - { name: active_queue_depth, type: integer, source: computed, default: 0, description: "Count of QueueEntry under this clinic in WAITING or TRIAGED or IN_REGISTRATION or READY_FOR_PROVIDER (§1.3 clinic_posture input_set)" }
      - { name: rooms_occupied, type: integer, source: computed, default: 0, description: "Count of ExamRoom under this clinic in OCCUPIED state" }
      - { name: ops_run_index, type: integer, source: system, default: 0, description: "Monotone epoch counter incremented by POST /clinics/{id}/run-ops" }

  - name: ExamRoom
    parent: Clinic
    common_fields: true
    fields:
      - { name: clinic_id, type: string, source: input, description: "FK -> Clinic.id" }
      - { name: room_label, type: string, source: input, description: "Human room label e.g. 'Room A'" }
      - { name: room_type, type: enum, source: input, default: "STANDARD", description: "STANDARD | ISOLATION | PROCEDURE — ISOLATION required for AIRBORNE precaution visits" }
      - { name: status, type: enum, source: system, default: "AVAILABLE", description: "AVAILABLE | OCCUPIED | CLEANING | OUT_OF_SERVICE" }
      - { name: current_visit_id, type: string, source: system, default: null, description: "Denormalized back-pointer to the Visit currently in this room (Visit.id); set while OCCUPIED, cleared on release. Discover the room from a visit via GET /exam-rooms?current_visit_id=." }

  - name: Provider
    parent: Clinic
    common_fields: true
    fields:
      - { name: clinic_id, type: string, source: input, description: "FK -> Clinic.id" }
      - { name: full_name, type: string, source: input, description: "Provider name" }
      - { name: credential, type: enum, source: input, description: "MD | DO | NP | PA" }
      - { name: on_shift, type: boolean, source: input, default: true, description: "Whether provider is currently rostered; only on-shift providers count toward throughput" }
      - { name: active_visit_count, type: integer, source: computed, default: 0, description: "Count of Visit assigned to this provider in clinical_status IN_EXAM or CHARTING" }
      - { name: max_concurrent_visits, type: integer, source: input, default: 2, description: "Cap on simultaneous IN_EXAM/CHARTING visits this provider may hold", constraints: ">= 1" }

  - name: QueueEntry
    parent: Clinic
    common_fields: true
    fields:
      - { name: clinic_id, type: string, source: input, description: "FK -> Clinic.id" }
      - { name: patient_id, type: string, source: system, default: null, description: "FK -> Patient.id; set when registration links a Patient record" }
      - { name: arrival_channel, type: enum, source: input, description: "ONLINE | WALK_IN — ONLINE entries are save-my-spot reservations" }
      - { name: chief_complaint, type: string, source: input, description: "Free-text reason for visit" }
      - { name: reserved_at, type: datetime, source: system, default: null, description: "When an ONLINE save-my-spot hold was created" }
      - { name: hold_expires_at, type: datetime, source: system, default: null, description: "ONLINE holds expire RESERVATION_HOLD_MINUTES after reserved_at unless patient arrives (§1.3 hold_window)" }
      - { name: esi_level, type: integer, source: system, default: null, description: "Emergency Severity Index 1 (most acute) .. 5 (least); set at triage", constraints: "1 <= x <= 5" }
      - { name: airborne_precaution, type: boolean, source: system, default: false, description: "Set at triage; requires ISOLATION room at rooming" }
      - { name: priority_rank, type: integer, source: computed, default: null, description: "Server-assigned queue position among active entries (§1.3 queue_ordering); 1 = next" }
      - { name: estimated_wait_minutes, type: integer, source: computed, default: null, description: "Projected minutes until rooming (§1.3 wait_estimate)" }
      - { name: triaged_at, type: datetime, source: system, default: null, description: "When ESI was assigned" }
      - { name: status, type: enum, source: system, default: "RESERVED", description: "RESERVED | WAITING | TRIAGED | IN_REGISTRATION | READY_FOR_PROVIDER | ROOMED | LEFT_WITHOUT_SEEN | EXPIRED | CANCELLED" }

  - name: Patient
    parent: null
    common_fields: true
    fields:
      - { name: queue_entry_id, type: string, source: input, description: "FK -> QueueEntry.id; the walk-in this registration record belongs to" }
      - { name: legal_name, type: string, source: input, description: "Patient legal name" }
      - { name: date_of_birth, type: string, source: input, description: "ISO date YYYY-MM-DD" }
      - { name: is_minor, type: boolean, source: computed, default: false, description: "True when age < 18 at registration relative to current clock (§1.3 minor_flag)" }
      - { name: guarantor_name, type: string, source: input, default: null, description: "Required when is_minor; financial guarantor" }
      - { name: consent_signed, type: boolean, source: input, default: false, description: "Treatment consent captured at registration" }

  - name: Coverage
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: coverage_type, type: enum, source: input, description: "INSURANCE | SELF_PAY" }
      - { name: payer_name, type: string, source: input, default: null, description: "Required when coverage_type=INSURANCE" }
      - { name: member_id, type: string, source: input, default: null, description: "Required when coverage_type=INSURANCE" }
      - { name: copay_cents, type: integer, source: input, default: 0, description: "Fixed visit copay in cents for INSURANCE; ignored for SELF_PAY", constraints: ">= 0" }
      - { name: eligibility_status, type: enum, source: system, default: "UNVERIFIED", description: "UNVERIFIED | ELIGIBLE | INELIGIBLE — set by POST /coverages/{id}/verify" }
      - { name: verified_at, type: datetime, source: system, default: null, description: "When eligibility was verified" }

  - name: Visit
    parent: null
    common_fields: true
    fields:
      - { name: queue_entry_id, type: string, source: input, description: "FK -> QueueEntry.id; the rooming event that started this encounter" }
      - { name: patient_id, type: string, source: system, description: "FK -> Patient.id; copied from queue_entry at rooming" }
      - { name: exam_room_id, type: string, source: system, default: null, description: "FK -> ExamRoom.id; occupied room while clinical_status in IN_EXAM/CHARTING" }
      - { name: provider_id, type: string, source: input, description: "FK -> Provider.id; provider taking the encounter" }
      - { name: clinical_status, type: enum, source: system, default: "IN_EXAM", description: "IN_EXAM | CHARTING | PENDING_DISCHARGE | DISCHARGED | TRANSFERRED — parallel dimension A" }
      - { name: billing_status, type: enum, source: system, default: "OPEN", description: "OPEN | CHARGES_POSTED | INVOICED | SETTLED — parallel dimension B, evolves independently of clinical_status" }
      - { name: chart_note, type: string, source: input, default: null, description: "Provider charting free-text; required to leave CHARTING" }
      - { name: acuity_at_rooming, type: integer, source: system, description: "ESI level snapshot copied from QueueEntry at rooming (1..5)" }
      - { name: charges_subtotal_cents, type: integer, source: computed, default: 0, description: "Sum of Charge.amount_cents posted to this visit (§1.3 charge_total)" }
      - { name: patient_responsibility_cents, type: integer, source: computed, default: 0, description: "Final amount owed by patient after coverage rules (§1.3 charge_total, dual-variant)" }
      - { name: disposition, type: enum, source: system, default: null, description: "HOME | ER_TRANSFER | LWBS — set at clinical terminal transition" }

  - name: Charge
    parent: Visit
    common_fields: true
    fields:
      - { name: visit_id, type: string, source: input, description: "FK -> Visit.id" }
      - { name: cpt_code, type: string, source: input, description: "Billing code label" }
      - { name: amount_cents, type: integer, source: input, description: "Gross charge in cents", constraints: "> 0" }
      - { name: source_type, type: enum, source: input, default: "VISIT", description: "VISIT | OCC_HEALTH — polymorphic origin of this charge" }
      - { name: voided, type: boolean, source: system, default: false, description: "True once reversed; voided charges excluded from charges_subtotal_cents" }

  - name: OccHealthOrder
    parent: null
    common_fields: true
    fields:
      - { name: queue_entry_id, type: string, source: input, description: "FK -> QueueEntry.id" }
      - { name: order_type, type: enum, source: input, description: "DRUG_SCREEN | PHYSICAL | RESPIRATOR_FIT" }
      - { name: employer_name, type: string, source: input, description: "Sponsoring employer (occupational health is employer-billed)" }
      - { name: scheduled_start, type: datetime, source: input, description: "Booked appointment start (ISO 8601 UTC)" }
      - { name: duration_minutes, type: integer, source: input, default: 30, description: "Slot length; defines [scheduled_start, scheduled_start+duration) occupation window", constraints: ">= 5" }
      - { name: collector_id, type: string, source: input, description: "FK -> Provider.id; collector/examiner running the order" }
      - { name: room_id, type: string, source: input, default: null, description: "FK -> ExamRoom.id; required when order_type in {PHYSICAL, RESPIRATOR_FIT} (need a room), null for DRUG_SCREEN. Room slots use buffer-padded overlap (§1.3 room_slot_overlap), distinct from the collector's half-open slot." }
      - { name: result, type: enum, source: system, default: "PENDING", description: "PENDING | NEGATIVE | POSITIVE | PASS | FAIL — set by POST /occ-health-orders/{id}/result" }
      - { name: status, type: enum, source: system, default: "SCHEDULED", description: "SCHEDULED | IN_PROGRESS | COMPLETED | CANCELLED" }

  - name: Referral
    parent: Visit
    common_fields: true
    fields:
      - { name: visit_id, type: string, source: input, description: "FK -> Visit.id" }
      - { name: destination_facility, type: string, source: input, description: "Receiving ER / facility name" }
      - { name: transfer_reason, type: enum, source: input, description: "ACUITY_ESCALATION | CAPABILITY_GAP | PATIENT_REQUEST" }
      - { name: mode, type: enum, source: input, default: "AMBULANCE", description: "AMBULANCE | PRIVATE_VEHICLE — AMBULANCE required when source visit acuity_at_rooming <= 2" }
      - { name: accepted_at, type: datetime, source: system, default: null, description: "When receiving facility acknowledged" }
      - { name: status, type: enum, source: system, default: "INITIATED", description: "INITIATED | ACCEPTED | CANCELLED" }

  - name: DischargeInstruction
    parent: Visit
    common_fields: true
    fields:
      - { name: visit_id, type: string, source: input, description: "FK -> Visit.id" }
      - { name: instructions_text, type: string, source: input, description: "Patient-facing discharge instructions" }
      - { name: follow_up_within_days, type: integer, source: input, default: null, description: "Recommended follow-up window in days; null = none", constraints: ">= 0" }
      - { name: follow_up_due_at, type: datetime, source: computed, default: null, description: "current_clock + follow_up_within_days (§1.3 follow_up_due); null when follow_up_within_days is null" }
      - { name: follow_up_status, type: enum, source: system, default: "NONE", description: "NONE | PENDING | DUE | OVERDUE — advanced by run-ops vs clock (§1.3 follow_up_due): NONE when no follow-up, PENDING at creation, DUE when clock reaches follow_up_due_at, OVERDUE GRACE_DAYS later" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---------------------------------------------------------------------------
  - entity: QueueEntry
    initial_state: RESERVED   # ONLINE; WALK_IN entries start at WAITING (see create transition note)
    terminal_states: [ROOMED, LEFT_WITHOUT_SEEN, EXPIRED, CANCELLED]
    transitions:
      - from: "(none)"
        to: RESERVED
        trigger: "POST /clinics/{id}/queue-entries with arrival_channel=ONLINE"
        actor: Patient
        preconditions:
          - "Clinic.posture != DIVERSION"
        side_effects:
          - "Set reserved_at = current clock"
          - "Set hold_expires_at = reserved_at + RESERVATION_HOLD_MINUTES (§1.3 hold_window)"
          - "RESERVED holds do NOT count toward Clinic.active_queue_depth (excluded from §1.3 clinic_posture input_set); depth and posture unchanged"

      - from: "(none)"
        to: WAITING
        trigger: "POST /clinics/{id}/queue-entries with arrival_channel=WALK_IN"
        actor: FrontDeskClerk
        preconditions:
          - "Clinic.posture != DIVERSION"
        side_effects:
          - "Increment Clinic.active_queue_depth and recompute Clinic.posture (§1.3 clinic_posture)"
          - "Recompute priority_rank for all active entries (§1.3 queue_ordering)"

      - from: RESERVED
        to: WAITING
        trigger: "POST /clinics/{id}/queue-entries/{qid}/arrive"
        actor: FrontDeskClerk
        preconditions:
          - "QueueEntry.status == RESERVED"
          - "current clock <= hold_expires_at (else hold has expired — see EXPIRED transition)"
        side_effects:
          - "Clear hold_expires_at"
          - "Increment Clinic.active_queue_depth (entry now counts) and recompute Clinic.posture (§1.3 clinic_posture)"
          - "Recompute priority_rank for all active entries (§1.3 queue_ordering)"

      - from: RESERVED
        to: EXPIRED
        trigger: "POST /clinics/{id}/run-ops (system sweep)"
        actor: system
        preconditions:
          - "current clock > hold_expires_at"
        side_effects:
          - "RESERVED never counted toward active_queue_depth, so depth and posture unchanged"
          - "Entry removed from active set; recompute priority_rank for remaining active entries"

      - from: WAITING
        to: TRIAGED
        trigger: "POST /clinics/{id}/queue-entries/{qid}/triage"
        actor: TriageNurse
        preconditions:
          - "QueueEntry.status == WAITING"
          - "esi_level in request is 1..5"
        side_effects:
          - "Set esi_level, airborne_precaution, triaged_at"
          - "Recompute priority_rank for all active entries (§1.3 queue_ordering)"
          - "Recompute estimated_wait_minutes for all active entries (§1.3 wait_estimate)"

      - from: TRIAGED
        to: IN_REGISTRATION
        trigger: "POST /patients (registration links this QueueEntry)"
        actor: FrontDeskClerk
        preconditions:
          - "QueueEntry.status == TRIAGED"
        side_effects:
          - "Set QueueEntry.patient_id to the new Patient.id"

      - from: IN_REGISTRATION
        to: TRIAGED
        trigger: "POST /clinics/{id}/queue-entries/{qid}/re-triage"
        actor: TriageNurse
        preconditions:
          - "QueueEntry.status == IN_REGISTRATION"
          - "new esi_level is 1..5"
        side_effects:
          - "Overwrite esi_level (revision loop), set triaged_at = current clock"
          - "Recompute priority_rank and estimated_wait_minutes for all active entries"
        note: "Revision cycle IN_REGISTRATION -> TRIAGED -> IN_REGISTRATION makes QueueEntry non-linear (cyclic)"

      - from: IN_REGISTRATION
        to: READY_FOR_PROVIDER
        trigger: "POST /clinics/{id}/queue-entries/{qid}/mark-ready"
        actor: FrontDeskClerk
        preconditions:
          - "QueueEntry.status == IN_REGISTRATION"
          - "A Patient exists for this QueueEntry with consent_signed == true"
          - "A Coverage exists for the Patient (any coverage_type)"
        side_effects:
          - "Recompute priority_rank and estimated_wait_minutes for all active entries"

      - from: READY_FOR_PROVIDER
        to: ROOMED
        trigger: "POST /visits (rooming creates the Visit)"
        actor: Provider
        preconditions:
          - "QueueEntry.status == READY_FOR_PROVIDER"
          - "QueueEntry is the lowest priority_rank among READY_FOR_PROVIDER entries (§1.4 P40) OR an override"
          - "Target ExamRoom.status == AVAILABLE and (room_type == ISOLATION if airborne_precaution else any)"
          - "Provider.on_shift == true and Provider.active_visit_count < Provider.max_concurrent_visits"
        side_effects:
          - "Create Visit (clinical_status=IN_EXAM, billing_status=OPEN); copy acuity_at_rooming from esi_level"
          - "ExamRoom -> OCCUPIED, set current_visit_id (cascade, see ExamRoom machine)"
          - "Increment Provider.active_visit_count"
          - "Decrement Clinic.active_queue_depth, recompute Clinic.posture and rooms_occupied"
          - "Recompute priority_rank and estimated_wait_minutes for remaining active entries"

      - from: WAITING
        to: LEFT_WITHOUT_SEEN
        trigger: "POST /clinics/{id}/queue-entries/{qid}/lwbs"
        actor: FrontDeskClerk
        preconditions:
          - "QueueEntry.status in {WAITING, TRIAGED, IN_REGISTRATION, READY_FOR_PROVIDER}"
        side_effects:
          - "Decrement Clinic.active_queue_depth, recompute Clinic.posture"
          - "Recompute priority_rank and estimated_wait_minutes for remaining active entries"
        note: "Same lwbs trigger is valid from TRIAGED, IN_REGISTRATION, READY_FOR_PROVIDER (any pre-rooming active state)"

      - from: RESERVED
        to: CANCELLED
        trigger: "POST /clinics/{id}/queue-entries/{qid}/cancel"
        actor: Patient
        preconditions:
          - "QueueEntry.status in {RESERVED, WAITING}"
        side_effects:
          - "If prior status == WAITING: decrement Clinic.active_queue_depth and recompute posture. If prior status == RESERVED: depth/posture unchanged (RESERVED never counted)."
          - "Recompute priority_rank for remaining active entries"

  # ---------------------------------------------------------------------------
  - entity: Visit
    initial_state: IN_EXAM     # clinical_status dimension
    terminal_states: [DISCHARGED, TRANSFERRED]
    transitions:
      # --- clinical_status dimension ---
      - from: IN_EXAM
        to: CHARTING
        trigger: "POST /visits/{id}/start-charting"
        actor: Provider
        preconditions:
          - "Visit.clinical_status == IN_EXAM"
        side_effects: []

      - from: CHARTING
        to: PENDING_DISCHARGE
        trigger: "POST /visits/{id}/complete-charting"
        actor: Provider
        preconditions:
          - "Visit.clinical_status == CHARTING"
          - "Visit.chart_note is non-empty"
        side_effects:
          - "ExamRoom -> CLEANING (room released; cascade, see ExamRoom machine)"
          - "Decrement Provider.active_visit_count; recompute Clinic.rooms_occupied"

      - from: PENDING_DISCHARGE
        to: DISCHARGED
        trigger: "POST /visits/{id}/discharge"
        actor: Provider
        preconditions:
          - "Visit.clinical_status == PENDING_DISCHARGE"
          - "Visit.billing_status in {CHARGES_POSTED, INVOICED, SETTLED} (charges finalized before discharge — §1.4 P52)"
          - "A DischargeInstruction exists for this Visit"
        side_effects:
          - "Set disposition = HOME"

      - from: IN_EXAM
        to: TRANSFERRED
        trigger: "POST /visits/{id}/transfer (creates Referral, ER escalation)"
        actor: Provider
        preconditions:
          - "Visit.clinical_status in {IN_EXAM, CHARTING}"
          - "mode == AMBULANCE when acuity_at_rooming <= 2 (§1.4 P51)"
        side_effects:
          - "Create Referral (status=INITIATED)"
          - "Set disposition = ER_TRANSFER"
          - "ExamRoom -> CLEANING (cascade), decrement Provider.active_visit_count, recompute rooms_occupied"
          - "Cancel any SCHEDULED OccHealthOrder on the same QueueEntry (cascade -> §1.3 occ_cancel_on_transfer)"
        note: "TRANSFERRED reachable from IN_EXAM or CHARTING — branching with divergent side-effects vs discharge path"

      # --- billing_status dimension (independent of clinical_status) ---
      - from: OPEN
        to: CHARGES_POSTED
        trigger: "POST /visits/{id}/post-charges"
        actor: Provider
        preconditions:
          - "Visit.billing_status == OPEN"
          - "At least one non-voided Charge exists on the Visit"
        side_effects:
          - "Recompute charges_subtotal_cents and patient_responsibility_cents (§1.3 charge_total)"

      - from: CHARGES_POSTED
        to: INVOICED
        trigger: "POST /visits/{id}/invoice"
        actor: FrontDeskClerk
        preconditions:
          - "Visit.billing_status == CHARGES_POSTED"
        side_effects:
          - "Freeze patient_responsibility_cents (no further charge posting allowed — §1.4 P53)"

      - from: INVOICED
        to: SETTLED
        trigger: "POST /visits/{id}/settle"
        actor: FrontDeskClerk
        preconditions:
          - "Visit.billing_status == INVOICED"
          - "expected_visit_version matches current Visit.version (OCC)"
        side_effects:
          - "increments Visit.version by 1"

  # ---------------------------------------------------------------------------
  - entity: ExamRoom
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: OCCUPIED
        trigger: "system cascade from Visit rooming (POST /visits)"
        actor: system
        preconditions:
          - "ExamRoom.status == AVAILABLE"
        side_effects:
          - "Set current_visit_id"

      - from: OCCUPIED
        to: CLEANING
        trigger: "system cascade from Visit complete-charting or transfer"
        actor: system
        preconditions:
          - "ExamRoom.status == OCCUPIED"
        side_effects:
          - "Clear current_visit_id"

      - from: CLEANING
        to: AVAILABLE
        trigger: "POST /clinics/{id}/exam-rooms/{rid}/mark-clean"
        actor: ClinicManager
        preconditions:
          - "ExamRoom.status == CLEANING"
        side_effects:
          - "Recompute Clinic.rooms_occupied"

      - from: AVAILABLE
        to: OUT_OF_SERVICE
        trigger: "POST /clinics/{id}/exam-rooms/{rid}/take-offline"
        actor: ClinicManager
        preconditions:
          - "ExamRoom.status == AVAILABLE"
        side_effects: []

      - from: OUT_OF_SERVICE
        to: AVAILABLE
        trigger: "POST /clinics/{id}/exam-rooms/{rid}/return-online"
        actor: ClinicManager
        preconditions:
          - "ExamRoom.status == OUT_OF_SERVICE"
        side_effects: []

  # ---------------------------------------------------------------------------
  - entity: OccHealthOrder
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /occ-health-orders/{id}/start"
        actor: Provider
        preconditions:
          - "OccHealthOrder.status == SCHEDULED"
          - "current clock >= scheduled_start"
        side_effects: []

      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /occ-health-orders/{id}/result"
        actor: Provider
        preconditions:
          - "OccHealthOrder.status == IN_PROGRESS"
          - "result in {NEGATIVE, POSITIVE, PASS, FAIL}"
        side_effects:
          - "Set result"
          - "Create an OCC_HEALTH Charge on any Visit for the same QueueEntry if one exists (employer-billed; §1.3 charge_total notes)"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /occ-health-orders/{id}/cancel OR cascade from Visit transfer"
        actor: Provider
        preconditions:
          - "OccHealthOrder.status in {SCHEDULED, IN_PROGRESS}"
        side_effects:
          - "Free the [scheduled_start, scheduled_start+duration) collector slot and, if room_id set, the room slot"

  # ---------------------------------------------------------------------------
  - entity: Referral
    initial_state: INITIATED
    terminal_states: [ACCEPTED, CANCELLED]
    transitions:
      - from: INITIATED
        to: ACCEPTED
        trigger: "POST /referrals/{id}/accept"
        actor: ClinicManager
        preconditions:
          - "Referral.status == INITIATED"
        side_effects:
          - "Set accepted_at = current clock"

      - from: INITIATED
        to: CANCELLED
        trigger: "POST /referrals/{id}/cancel"
        actor: ClinicManager
        preconditions:
          - "Referral.status == INITIATED"
          - "Source Visit.clinical_status == TRANSFERRED"
        side_effects:
          - "Revert source Visit.clinical_status TRANSFERRED -> CHARTING; set disposition = null (compensation)"
          - "Re-open an ExamRoom: if a CLEANING room with current_visit_id == this visit exists, leave as-is; else no room re-acquired (provider must re-room)"
        note: "Compensating action; see §1.9 compensation claim"

  # ---------------------------------------------------------------------------
  - entity: Coverage
    initial_state: UNVERIFIED
    terminal_states: [INELIGIBLE]
    transitions:
      - from: UNVERIFIED
        to: ELIGIBLE
        trigger: "POST /coverages/{id}/verify with outcome=ELIGIBLE"
        actor: FrontDeskClerk
        preconditions:
          - "Coverage.eligibility_status == UNVERIFIED"
          - "coverage_type == INSURANCE"
        side_effects:
          - "Set verified_at = current clock"

      - from: UNVERIFIED
        to: INELIGIBLE
        trigger: "POST /coverages/{id}/verify with outcome=INELIGIBLE"
        actor: FrontDeskClerk
        preconditions:
          - "Coverage.eligibility_status == UNVERIFIED"
          - "coverage_type == INSURANCE"
        side_effects:
          - "Set verified_at = current clock"
        note: "SELF_PAY coverages skip verification entirely and remain UNVERIFIED"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: visit-settle-stale-version
    parent_entity: Visit
    write_endpoint: "POST /visits/{id}/settle"
    occ_field: "expected_visit_version"
    description: |
      Settling an INVOICED Visit whose version has advanced since the client
      last observed it is rejected on a stale-version check. A prior settle (or
      a cascaded billing recompute) already advanced Visit.version; a settle
      request still carrying the pre-advance version is rejected.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: room-room-stale-clinic
    parent_entity: Clinic
    write_endpoint: "POST /visits"
    occ_field: "expected_clinic_version"
    description: |
      Rooming a patient (creating a Visit) against a Clinic whose version has
      advanced since the client last read it is rejected. Another rooming or a
      posture/room-state recompute has already advanced Clinic.version and freed
      or consumed the room the current writer believed was available; the stale
      view is rejected so the writer re-reads room availability before retrying.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: wait_estimate
    trigger: "On triage, re-triage, arrive, mark-ready, lwbs, cancel, rooming, and run-ops — any change to the active queue"
    algorithm: forward_looking
    formula: |
      # Estimated minutes until THIS entry is roomed.
      # Step 1: determine entries ahead = active entries with strictly lower
      #   priority_rank (i.e. ahead in line) that are in {TRIAGED, IN_REGISTRATION,
      #   READY_FOR_PROVIDER}. WAITING (un-triaged) entries are EXCLUDED from the
      #   ahead-set because their service time is unknown until ESI is assigned.
      # Step 2: effective_servers = count of Provider with on_shift==true.
      #   If effective_servers == 0 -> estimated_wait_minutes = null.
      # Step 3: work_ahead_minutes = sum over ahead-set of
      #   avg_provider_minutes_per_esi[entry.esi_level]
      # Step 4: estimated_wait_minutes = ceil(work_ahead_minutes / effective_servers)
      # Boundary: an entry that is itself rank 1 (no one ahead) -> 0 minutes.
    input_set: "Active QueueEntry under the same Clinic in {TRIAGED, IN_REGISTRATION, READY_FOR_PROVIDER} with priority_rank strictly less than this entry's; ahead-set excludes WAITING/RESERVED."
    constants:
      DEFAULT_ESI_MINUTES: "{1:40, 2:30, 3:20, 4:12, 5:8}"
    precision: "integer minutes, ceil after division"
    variants:
      - name: optimistic
        when: "estimated_wait_minutes surfaced on GET /queue-entries/{id} for an ONLINE save-my-spot reservation that has not yet arrived (status RESERVED)"
        difference: "Divides work_ahead_minutes by (effective_servers + 1) assuming a fast-track server, then ceil — a strictly lower (or equal) estimate than the conservative variant for identical queue state when effective_servers >= 1."
      - name: conservative
        when: "estimated_wait_minutes persisted on the entry after triage (status in {TRIAGED.., READY_FOR_PROVIDER})"
        difference: "Divides by effective_servers only (base formula); used for the posted board estimate."

  - name: queue_ordering
    trigger: "Any active-queue mutation: arrive, triage, re-triage, mark-ready, rooming, lwbs, cancel, expire"
    algorithm: chronological
    formula: |
      # Assign priority_rank (1 = next to be roomed) over the active set
      # {WAITING, TRIAGED, IN_REGISTRATION, READY_FOR_PROVIDER}.
      # Sort key (ascending => lower rank => served sooner):
      #   1) esi_level ASC  (ESI 1 most acute first; un-triaged WAITING entries
      #      use esi_level = 5 sentinel for ordering so they sort AFTER any
      #      triaged entry of better acuity but among themselves...)
      #   2) triaged_at ASC for triaged entries; for un-triaged WAITING entries,
      #      use created_at ASC
      #   3) created_at ASC  (final deterministic tie-break — NEVER id)
      # Then priority_rank = 1-based index in this sorted order.
    input_set: "QueueEntry under the Clinic in {WAITING, TRIAGED, IN_REGISTRATION, READY_FOR_PROVIDER}; terminal entries excluded."
    constants:
      UNTRIAGED_ESI_SENTINEL: 5
    precision: "integer rank, 1-based"
    variants: []

  - name: charge_total
    trigger: "POST /visits/{id}/post-charges (billing_status OPEN -> CHARGES_POSTED)"
    algorithm: aggregation
    formula: |
      # Step 1 (order pinned): subtotal first, THEN apply coverage rule. Rounding
      #   is applied ONCE at the end (sum-then-discount-then-round), NOT per line.
      # charges_subtotal_cents = sum of Charge.amount_cents over this Visit where
      #   voided == false AND source_type == 'VISIT'
      #   (OCC_HEALTH charges are employer-billed and EXCLUDED from patient
      #    responsibility).
      # Step 2: locate the Coverage for the Visit's patient_id.
      #   - INSURANCE & eligibility_status == ELIGIBLE:
      #       patient_responsibility_cents = copay_cents
      #         (payer covers the balance; patient owes only the copay)
      #   - INSURANCE & eligibility_status in {UNVERIFIED, INELIGIBLE}:
      #       treat as self-pay fallback (see SELF_PAY branch)
      #   - SELF_PAY (or insurance fallback):
      #       discounted = charges_subtotal_cents * (1 - self_pay_discount_pct)
      #       patient_responsibility_cents = round_half_up(discounted)  # cents
      # The two branches are the dual variant: identical Charge rows yield a flat
      # copay under verified insurance vs a discounted subtotal under self-pay.
    input_set: "Non-voided VISIT-source Charge rows on the Visit; the Patient's single Coverage; Clinic.self_pay_discount_pct."
    constants:
      ROUNDING: "round_half_up to whole cents"
    precision: "integer cents, round_half_up applied once after discount"
    variants:
      - name: insured_eligible
        when: "Coverage.coverage_type == INSURANCE and eligibility_status == ELIGIBLE"
        difference: "patient_responsibility_cents = copay_cents flat, independent of subtotal."
      - name: self_pay
        when: "Coverage.coverage_type == SELF_PAY, or INSURANCE with eligibility_status in {UNVERIFIED, INELIGIBLE}"
        difference: "patient_responsibility_cents = round_half_up(subtotal * (1 - self_pay_discount_pct)); scales with subtotal."

  - name: clinic_posture
    trigger: "Any change to active_queue_depth (create/arrive/triage/rooming/lwbs/cancel/expire) and on run-ops"
    algorithm: threshold
    formula: |
      # active_queue_depth = count of QueueEntry under Clinic in
      #   {WAITING, TRIAGED, IN_REGISTRATION, READY_FOR_PROVIDER}
      #   (RESERVED holds NOT counted until arrival; terminal states excluded).
      # posture:
      #   if active_queue_depth >= diversion_threshold -> DIVERSION
      #   elif active_queue_depth >= surge_threshold    -> SURGE
      #   else                                          -> OPEN
      # Boundary is INCLUSIVE (>=): depth == surge_threshold IS SURGE;
      # depth == diversion_threshold IS DIVERSION.
    input_set: "QueueEntry under the Clinic in {WAITING, TRIAGED, IN_REGISTRATION, READY_FOR_PROVIDER}."
    constants: {}
    precision: "exact integer comparison"
    variants: []

  - name: occ_slot_overlap
    trigger: "POST /occ-health-orders (booking) and cascade on transfer (slot free)"
    algorithm: interval_merge
    formula: |
      # An OccHealthOrder occupies the half-open interval
      #   [scheduled_start, scheduled_start + duration_minutes) on its collector.
      # A new order for collector C is REJECTED if its interval overlaps any
      # existing SCHEDULED or IN_PROGRESS order on C, where overlap is:
      #   new.start < existing.end AND existing.start < new.end
      # Half-open semantics: back-to-back orders (new.start == existing.end) do
      # NOT overlap and ARE allowed (gap == 0 permitted).
    input_set: "OccHealthOrder rows on the same collector_id in {SCHEDULED, IN_PROGRESS}."
    constants: {}
    precision: "datetime comparison, half-open [start, end)"
    variants: []

  - name: hold_window
    trigger: "POST /clinics/{id}/queue-entries with arrival_channel=ONLINE"
    algorithm: threshold
    formula: |
      # reserved_at = current server clock at creation.
      # hold_expires_at = reserved_at + RESERVATION_HOLD_MINUTES minutes.
      # On run-ops a RESERVED entry with current_clock > hold_expires_at is
      # swept to EXPIRED. Boundary: at exactly hold_expires_at the hold is still
      # valid (arrive allowed when current_clock <= hold_expires_at); strictly
      # after it the run-ops sweep expires it (current_clock > hold_expires_at).
    input_set: "Single QueueEntry being created with arrival_channel ONLINE."
    constants:
      RESERVATION_HOLD_MINUTES: 30
    precision: "datetime arithmetic; <= at boundary still valid"
    variants: []

  - name: minor_flag
    trigger: "POST /patients (registration)"
    algorithm: threshold
    formula: |
      # age_years = floor((current_clock_date - date_of_birth) in whole years).
      # is_minor = (age_years < 18) at the current clock.
      # Boundary: a patient whose 18th birthday is exactly the current clock date
      #   is NOT a minor (age_years == 18 -> is_minor=false); one day before their
      #   18th birthday (age_years == 17) is a minor.
    input_set: "Patient.date_of_birth vs current server clock."
    constants:
      MAJORITY_AGE: 18
    precision: "whole years, floor"
    variants: []

  - name: room_slot_overlap
    trigger: "POST /occ-health-orders when room_id is set (PHYSICAL / RESPIRATOR_FIT)"
    algorithm: interval_merge
    formula: |
      # A room-bound OccHealthOrder occupies its room for the CLOSED, buffer-padded
      # window [scheduled_start, scheduled_start + duration_minutes + CLEAN_BUFFER_MINUTES].
      # A new room-bound order for room R is REJECTED if its padded window overlaps
      # any existing SCHEDULED/IN_PROGRESS room-bound order on R. Overlap here uses
      # CLOSED intervals WITH the buffer baked into each end, so two orders are only
      # allowed if separated by at least CLEAN_BUFFER_MINUTES:
      #   reject if  new.start < existing.end + CLEAN_BUFFER_MINUTES
      #          AND existing.start < new.end + CLEAN_BUFFER_MINUTES
      # Adjacency is NOT allowed (back-to-back new.start == existing.end is rejected
      # because the buffer is mandatory) — the OPPOSITE of the collector's half-open
      # gap=0-allowed semantics (§1.3 occ_slot_overlap).
    input_set: "Room-bound OccHealthOrder rows on the same room_id in {SCHEDULED, IN_PROGRESS}."
    constants:
      CLEAN_BUFFER_MINUTES: 15
    precision: "datetime comparison, closed interval padded by CLEAN_BUFFER_MINUTES on each side"
    variants: []

  - name: follow_up_due
    trigger: "POST /discharge-instructions (compute follow_up_due_at) and POST /clinics/{id}/run-ops (advance follow_up_status)"
    algorithm: threshold
    formula: |
      # At creation: if follow_up_within_days is null -> follow_up_due_at = null,
      #   follow_up_status = NONE.
      # else follow_up_due_at = current_clock + follow_up_within_days days,
      #   follow_up_status = PENDING.
      # On run-ops, for each DischargeInstruction with follow_up_status PENDING:
      #   if current_clock >= follow_up_due_at -> follow_up_status = DUE
      # A DUE record left un-completed for more than GRACE_DAYS past due flips to
      #   OVERDUE on a later run-ops:
      #   if current_clock >= follow_up_due_at + GRACE_DAYS days and status==DUE
      #     -> OVERDUE
      # Boundary: exactly at follow_up_due_at (>=) is DUE, one second before is
      #   still PENDING.
    input_set: "DischargeInstruction rows with follow_up_within_days not null."
    constants:
      GRACE_DAYS: 3
    precision: "datetime comparison, inclusive >= at boundary"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /clinics and /_clock/* and /_seed/*"

  - priority: 2
    category: auth
    check: "Acting role is permitted for the operation per §1.7 RBAC matrix"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 10
    category: existence
    check: "Path-referenced resources exist, validated left-to-right (clinic before queue-entry before exam-room, etc.)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all path-parameterized endpoints"

  - priority: 11
    category: existence
    check: "Body FK references resolve (clinic_id, patient_id, visit_id, provider_id, collector_id, queue_entry_id, coverage)"
    error_id: ERR_FK_NOT_FOUND
    http_status: 404
    applies_to: "all create endpoints with FK body fields"

  - priority: 20
    category: business_constraint
    check: "Request body well-formed: required fields present, enums in range, esi_level 1..5, amount_cents > 0, duration_minutes >= 5"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all create/action endpoints"

  - priority: 30
    category: state
    check: "Target resource is in a state from which this transition is defined (§1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 31
    category: state
    check: "OCC expected_*_version matches the parent entity's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /visits/{id}/settle, POST /visits"

  - priority: 40
    category: business_constraint
    check: "Rooming targets the lowest priority_rank READY_FOR_PROVIDER entry unless 'override' flag set; out-of-order rooming without override is rejected"
    error_id: ERR_QUEUE_ORDER_VIOLATION
    http_status: 409
    applies_to: "POST /visits"

  - priority: 41
    category: business_safety
    check: "When QueueEntry.airborne_precaution is true, the target ExamRoom.room_type must be ISOLATION"
    error_id: ERR_ISOLATION_REQUIRED
    http_status: 409
    applies_to: "POST /visits"

  - priority: 42
    category: business_safety
    check: "Clinic.posture != DIVERSION when creating a new QueueEntry (clinic on diversion accepts no new walk-ins/reservations)"
    error_id: ERR_CLINIC_ON_DIVERSION
    http_status: 409
    applies_to: "POST /clinics/{id}/queue-entries"

  - priority: 43
    category: business_constraint
    check: "Target ExamRoom.status == AVAILABLE at rooming"
    error_id: ERR_ROOM_UNAVAILABLE
    http_status: 409
    applies_to: "POST /visits"

  - priority: 44
    category: business_constraint
    check: "Provider.on_shift == true and Provider.active_visit_count < max_concurrent_visits at rooming"
    error_id: ERR_PROVIDER_AT_CAPACITY
    http_status: 409
    applies_to: "POST /visits"

  - priority: 45
    category: business_temporal
    check: "New OccHealthOrder collector interval does not overlap an existing SCHEDULED/IN_PROGRESS order on the same collector (half-open §1.3 occ_slot_overlap)"
    error_id: ERR_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /occ-health-orders"

  - priority: 48
    category: business_temporal
    check: "When room_id is set, the new room window (padded by CLEAN_BUFFER_MINUTES) does not overlap an existing SCHEDULED/IN_PROGRESS room-bound order on that room (buffer-padded §1.3 room_slot_overlap)"
    error_id: ERR_ROOM_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /occ-health-orders"

  - priority: 49
    category: business_constraint
    check: "order_type in {PHYSICAL, RESPIRATOR_FIT} requires room_id; DRUG_SCREEN must omit room_id"
    error_id: ERR_OCC_ROOM_REQUIRED
    http_status: 422
    applies_to: "POST /occ-health-orders"

  - priority: 46
    category: business_referential
    check: "mark-ready requires a Patient with consent_signed==true AND a Coverage for that patient"
    error_id: ERR_REGISTRATION_INCOMPLETE
    http_status: 409
    applies_to: "POST /clinics/{id}/queue-entries/{qid}/mark-ready"

  - priority: 47
    category: business_referential
    check: "Registration of a minor patient (is_minor==true) requires guarantor_name"
    error_id: ERR_GUARANTOR_REQUIRED
    http_status: 422
    applies_to: "POST /patients"

  - priority: 51
    category: business_safety
    check: "Transfer of a Visit with acuity_at_rooming <= 2 must use mode == AMBULANCE"
    error_id: ERR_AMBULANCE_REQUIRED
    http_status: 409
    applies_to: "POST /visits/{id}/transfer"

  - priority: 52
    category: business_fiscal
    check: "Discharge requires billing_status in {CHARGES_POSTED, INVOICED, SETTLED} (charges finalized before discharge)"
    error_id: ERR_CHARGES_NOT_FINALIZED
    http_status: 409
    applies_to: "POST /visits/{id}/discharge"

  - priority: 53
    category: business_fiscal
    check: "post-charges rejected once billing_status has advanced past CHARGES_POSTED (INVOICED/SETTLED frozen)"
    error_id: ERR_BILLING_FROZEN
    http_status: 409
    applies_to: "POST /visits/{id}/post-charges"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Clinic ----
  - method: POST
    path: "/clinics"
    description: "Create a clinic (bootstrap; no auth required)"
    roles: [ClinicManager, Anonymous]
    code: 201
    input: [name, exam_room_capacity, "surge_threshold?", "diversion_threshold?", "avg_provider_minutes_per_esi?", "self_pay_discount_pct?"]
    output: Clinic
    side_effects: ["posture initialized OPEN", "active_queue_depth=0", "rooms_occupied=0"]

  - method: GET
    path: "/clinics/{id}"
    description: "Fetch a clinic with computed posture and depth"
    roles: [ClinicManager, FrontDeskClerk, TriageNurse, Provider, Patient]
    code: 200
    input: []
    output: Clinic
    side_effects: []

  - method: GET
    path: "/clinics"
    description: "List clinics (paginated)"
    roles: [ClinicManager, FrontDeskClerk, TriageNurse, Provider, Patient]
    code: 200
    input: ["limit?", "offset?"]
    output: Clinic[]
    side_effects: []

  - method: POST
    path: "/clinics/{id}/run-ops"
    description: "Advance ops epoch: expire stale RESERVED holds, advance follow-up statuses, recompute posture"
    roles: [ClinicManager]
    code: 200
    input: []
    output: Clinic
    side_effects:
      - "Increment ops_run_index"
      - "Expire RESERVED entries past hold_expires_at -> EXPIRED (§1.2)"
      - "Advance DischargeInstruction follow_up_status PENDING->DUE->OVERDUE (§1.3 follow_up_due)"
      - "Recompute active_queue_depth, posture, rooms_occupied"

  # ---- ExamRoom ----
  - method: POST
    path: "/clinics/{id}/exam-rooms"
    description: "Provision an exam room under a clinic"
    roles: [ClinicManager]
    code: 201
    input: [room_label, "room_type?"]
    output: ExamRoom
    side_effects: []

  - method: GET
    path: "/clinics/{id}/exam-rooms"
    description: "List exam rooms under a clinic (reverse-reachability for ExamRoom.clinic_id)"
    roles: [ClinicManager, FrontDeskClerk, TriageNurse, Provider]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ExamRoom[]
    side_effects: []

  - method: GET
    path: "/exam-rooms/{id}"
    description: "Fetch an exam room"
    roles: [ClinicManager, FrontDeskClerk, TriageNurse, Provider]
    code: 200
    input: []
    output: ExamRoom
    side_effects: []

  - method: GET
    path: "/exam-rooms"
    description: "List exam rooms across clinics; filter by current_visit_id to find the room holding a visit"
    roles: [ClinicManager, FrontDeskClerk, TriageNurse, Provider]
    code: 200
    input: ["current_visit_id?", "status?", "limit?", "offset?"]
    output: ExamRoom[]
    side_effects: []

  - method: POST
    path: "/clinics/{id}/exam-rooms/{rid}/mark-clean"
    description: "CLEANING -> AVAILABLE"
    roles: [ClinicManager]
    code: 200
    input: []
    output: ExamRoom
    side_effects: ["Recompute Clinic.rooms_occupied"]

  - method: POST
    path: "/clinics/{id}/exam-rooms/{rid}/take-offline"
    description: "AVAILABLE -> OUT_OF_SERVICE"
    roles: [ClinicManager]
    code: 200
    input: []
    output: ExamRoom
    side_effects: []

  - method: POST
    path: "/clinics/{id}/exam-rooms/{rid}/return-online"
    description: "OUT_OF_SERVICE -> AVAILABLE"
    roles: [ClinicManager]
    code: 200
    input: []
    output: ExamRoom
    side_effects: []

  # ---- Provider ----
  - method: POST
    path: "/clinics/{id}/providers"
    description: "Roster a provider under a clinic"
    roles: [ClinicManager]
    code: 201
    input: [full_name, credential, "on_shift?", "max_concurrent_visits?"]
    output: Provider
    side_effects: []

  - method: GET
    path: "/clinics/{id}/providers"
    description: "List providers under a clinic (reverse-reachability for Provider.clinic_id)"
    roles: [ClinicManager, FrontDeskClerk, TriageNurse, Provider]
    code: 200
    input: ["on_shift?", "limit?", "offset?"]
    output: Provider[]
    side_effects: []

  - method: GET
    path: "/providers/{id}"
    description: "Fetch a provider"
    roles: [ClinicManager, FrontDeskClerk, TriageNurse, Provider]
    code: 200
    input: []
    output: Provider
    side_effects: []

  # ---- QueueEntry ----
  - method: POST
    path: "/clinics/{id}/queue-entries"
    description: "Create a walk-in (WALK_IN -> WAITING) or save-my-spot (ONLINE -> RESERVED)"
    roles: [FrontDeskClerk, Patient]
    code: 201
    input: [arrival_channel, chief_complaint]
    output: QueueEntry
    side_effects:
      - "ONLINE: set reserved_at, hold_expires_at; status=RESERVED"
      - "WALK_IN: status=WAITING"
      - "Increment Clinic.active_queue_depth, recompute posture (§1.3 clinic_posture)"
      - "Recompute priority_rank for active entries (§1.3 queue_ordering)"

  - method: GET
    path: "/clinics/{id}/queue-entries"
    description: "List queue entries under a clinic (reverse-reachability for QueueEntry.clinic_id); filter by status"
    roles: [ClinicManager, FrontDeskClerk, TriageNurse, Provider, Patient]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: QueueEntry[]
    side_effects: []

  - method: GET
    path: "/queue-entries/{id}"
    description: "Fetch a queue entry with priority_rank and estimated_wait_minutes"
    roles: [ClinicManager, FrontDeskClerk, TriageNurse, Provider, Patient]
    code: 200
    input: []
    output: QueueEntry
    side_effects: []

  - method: GET
    path: "/queue-entries"
    description: "List queue entries across clinics; filter by patient_id (reverse-reachability for QueueEntry.patient_id) or status"
    roles: [ClinicManager, FrontDeskClerk, TriageNurse, Provider, Patient]
    code: 200
    input: ["patient_id?", "status?", "limit?", "offset?"]
    output: QueueEntry[]
    side_effects: []

  - method: POST
    path: "/clinics/{id}/queue-entries/{qid}/arrive"
    description: "RESERVED -> WAITING (patient checks in for a save-my-spot hold)"
    roles: [FrontDeskClerk, Patient]
    code: 200
    input: []
    output: QueueEntry
    side_effects: ["Clear hold_expires_at", "Recompute priority_rank, estimated_wait_minutes"]

  - method: POST
    path: "/clinics/{id}/queue-entries/{qid}/triage"
    description: "WAITING -> TRIAGED (assign ESI)"
    roles: [TriageNurse]
    code: 200
    input: [esi_level, "airborne_precaution?"]
    output: QueueEntry
    side_effects: ["Set esi_level, airborne_precaution, triaged_at", "Recompute priority_rank, estimated_wait_minutes (§1.3)"]

  - method: POST
    path: "/clinics/{id}/queue-entries/{qid}/re-triage"
    description: "IN_REGISTRATION -> TRIAGED (revision loop; overwrite ESI)"
    roles: [TriageNurse]
    code: 200
    input: [esi_level, "airborne_precaution?"]
    output: QueueEntry
    side_effects: ["Overwrite esi_level, triaged_at", "Recompute priority_rank, estimated_wait_minutes"]

  - method: POST
    path: "/clinics/{id}/queue-entries/{qid}/mark-ready"
    description: "IN_REGISTRATION -> READY_FOR_PROVIDER (registration complete)"
    roles: [FrontDeskClerk]
    code: 200
    input: []
    output: QueueEntry
    side_effects: ["Recompute priority_rank, estimated_wait_minutes"]

  - method: POST
    path: "/clinics/{id}/queue-entries/{qid}/lwbs"
    description: "active pre-rooming -> LEFT_WITHOUT_SEEN"
    roles: [FrontDeskClerk]
    code: 200
    input: []
    output: QueueEntry
    side_effects: ["Decrement active_queue_depth, recompute posture", "Recompute priority_rank, estimated_wait_minutes"]

  - method: POST
    path: "/clinics/{id}/queue-entries/{qid}/cancel"
    description: "RESERVED/WAITING -> CANCELLED"
    roles: [FrontDeskClerk, Patient]
    code: 200
    input: []
    output: QueueEntry
    side_effects: ["Decrement active_queue_depth, recompute posture", "Recompute priority_rank"]

  # ---- Patient ----
  - method: POST
    path: "/patients"
    description: "Register a patient against a TRIAGED queue entry (TRIAGED -> IN_REGISTRATION)"
    roles: [FrontDeskClerk]
    code: 201
    input: [queue_entry_id, legal_name, date_of_birth, "guarantor_name?", "consent_signed?"]
    output: Patient
    side_effects: ["Compute is_minor (§1.3 minor_flag)", "Set QueueEntry.patient_id; QueueEntry TRIAGED -> IN_REGISTRATION"]

  - method: GET
    path: "/patients/{id}"
    description: "Fetch a patient"
    roles: [ClinicManager, FrontDeskClerk, TriageNurse, Provider]
    code: 200
    input: []
    output: Patient
    side_effects: []

  - method: GET
    path: "/patients"
    description: "List patients; filter by queue_entry_id (reverse-reachability for Patient.queue_entry_id)"
    roles: [ClinicManager, FrontDeskClerk, TriageNurse, Provider]
    code: 200
    input: ["queue_entry_id?", "limit?", "offset?"]
    output: Patient[]
    side_effects: []

  # ---- Coverage ----
  - method: POST
    path: "/coverages"
    description: "Attach insurance or self-pay coverage to a patient"
    roles: [FrontDeskClerk]
    code: 201
    input: [patient_id, coverage_type, "payer_name?", "member_id?", "copay_cents?"]
    output: Coverage
    side_effects: []

  - method: GET
    path: "/coverages"
    description: "List coverages; filter by patient_id (reverse-reachability for Coverage.patient_id)"
    roles: [ClinicManager, FrontDeskClerk, Provider]
    code: 200
    input: ["patient_id?", "limit?", "offset?"]
    output: Coverage[]
    side_effects: []

  - method: GET
    path: "/coverages/{id}"
    description: "Fetch a coverage"
    roles: [ClinicManager, FrontDeskClerk, Provider]
    code: 200
    input: []
    output: Coverage
    side_effects: []

  - method: POST
    path: "/coverages/{id}/verify"
    description: "UNVERIFIED -> ELIGIBLE/INELIGIBLE (insurance only)"
    roles: [FrontDeskClerk]
    code: 200
    input: [outcome]
    output: Coverage
    side_effects: ["Set eligibility_status, verified_at"]

  # ---- Visit ----
  - method: POST
    path: "/visits"
    description: "Room a READY_FOR_PROVIDER queue entry: create Visit, occupy room (READY_FOR_PROVIDER -> ROOMED)"
    roles: [Provider]
    code: 201
    input: [queue_entry_id, provider_id, exam_room_id, expected_clinic_version, "override?"]
    output: Visit
    side_effects:
      - "QueueEntry -> ROOMED; copy patient_id and acuity_at_rooming"
      - "ExamRoom AVAILABLE -> OCCUPIED (cascade)"
      - "Increment Provider.active_visit_count"
      - "Decrement Clinic.active_queue_depth, recompute posture, rooms_occupied"
      - "increments Clinic.version by 1"

  - method: GET
    path: "/visits/{id}"
    description: "Fetch a visit with computed charges_subtotal_cents and patient_responsibility_cents"
    roles: [ClinicManager, FrontDeskClerk, Provider]
    code: 200
    input: []
    output: Visit
    side_effects: []

  - method: GET
    path: "/visits"
    description: "List visits; filter by queue_entry_id, provider_id, exam_room_id, patient_id (reverse-reachability for Visit.queue_entry_id, Visit.provider_id, Visit.exam_room_id, Visit.patient_id)"
    roles: [ClinicManager, FrontDeskClerk, Provider]
    code: 200
    input: ["queue_entry_id?", "provider_id?", "exam_room_id?", "patient_id?", "limit?", "offset?"]
    output: Visit[]
    side_effects: []

  - method: POST
    path: "/visits/{id}/start-charting"
    description: "clinical IN_EXAM -> CHARTING"
    roles: [Provider]
    code: 200
    input: []
    output: Visit
    side_effects: []

  - method: POST
    path: "/visits/{id}/complete-charting"
    description: "clinical CHARTING -> PENDING_DISCHARGE; release room"
    roles: [Provider]
    code: 200
    input: [chart_note]
    output: Visit
    side_effects: ["ExamRoom OCCUPIED -> CLEANING (cascade)", "Decrement Provider.active_visit_count, recompute rooms_occupied"]

  - method: POST
    path: "/visits/{id}/discharge"
    description: "clinical PENDING_DISCHARGE -> DISCHARGED"
    roles: [Provider]
    code: 200
    input: []
    output: Visit
    side_effects: ["Set disposition = HOME"]

  - method: POST
    path: "/visits/{id}/transfer"
    description: "clinical IN_EXAM/CHARTING -> TRANSFERRED; create Referral; cascade room release + occ cancel"
    roles: [Provider]
    code: 200
    input: [destination_facility, transfer_reason, "mode?"]
    output: Visit
    side_effects:
      - "Create Referral (INITIATED)"
      - "Set disposition = ER_TRANSFER"
      - "ExamRoom OCCUPIED -> CLEANING (cascade), decrement Provider.active_visit_count, recompute rooms_occupied"
      - "Cancel SCHEDULED OccHealthOrder on same QueueEntry (cascade)"

  - method: POST
    path: "/visits/{id}/post-charges"
    description: "billing OPEN -> CHARGES_POSTED; compute responsibility"
    roles: [Provider]
    code: 200
    input: []
    output: Visit
    side_effects: ["Recompute charges_subtotal_cents, patient_responsibility_cents (§1.3 charge_total)"]

  - method: POST
    path: "/visits/{id}/invoice"
    description: "billing CHARGES_POSTED -> INVOICED (freeze responsibility)"
    roles: [FrontDeskClerk]
    code: 200
    input: []
    output: Visit
    side_effects: ["Freeze patient_responsibility_cents"]

  - method: POST
    path: "/visits/{id}/settle"
    description: "billing INVOICED -> SETTLED (OCC-guarded)"
    roles: [FrontDeskClerk]
    code: 200
    input: [expected_visit_version]
    output: Visit
    side_effects: ["increments Visit.version by 1"]

  # ---- Charge ----
  - method: POST
    path: "/visits/{id}/charges"
    description: "Add a charge line to a visit (billing must be OPEN)"
    roles: [Provider]
    code: 201
    input: [cpt_code, amount_cents, "source_type?"]
    output: Charge
    side_effects: []

  - method: GET
    path: "/visits/{id}/charges"
    description: "List charges on a visit (reverse-reachability for Charge.visit_id)"
    roles: [ClinicManager, FrontDeskClerk, Provider]
    code: 200
    input: ["limit?", "offset?"]
    output: Charge[]
    side_effects: []

  - method: POST
    path: "/charges/{id}/void"
    description: "Void a charge (excluded from subtotal); only while billing OPEN"
    roles: [Provider]
    code: 200
    input: []
    output: Charge
    side_effects: ["Set voided=true"]

  # ---- OccHealthOrder ----
  - method: POST
    path: "/occ-health-orders"
    description: "Book an occupational-health order (drug screen / physical / fit-test) on a collector slot (and a room slot for PHYSICAL/RESPIRATOR_FIT)"
    roles: [FrontDeskClerk, ClinicManager]
    code: 201
    input: [queue_entry_id, order_type, employer_name, scheduled_start, collector_id, "room_id?", "duration_minutes?"]
    output: OccHealthOrder
    side_effects:
      - "Reject on collector slot overlap (half-open §1.3 occ_slot_overlap)"
      - "Reject on room slot overlap (buffer-padded §1.3 room_slot_overlap) when room_id set"

  - method: GET
    path: "/occ-health-orders"
    description: "List occ-health orders; filter by queue_entry_id, collector_id, room_id (reverse-reachability for OccHealthOrder.queue_entry_id, collector_id, room_id)"
    roles: [ClinicManager, FrontDeskClerk, Provider]
    code: 200
    input: ["queue_entry_id?", "collector_id?", "room_id?", "limit?", "offset?"]
    output: OccHealthOrder[]
    side_effects: []

  - method: GET
    path: "/occ-health-orders/{id}"
    description: "Fetch an occ-health order"
    roles: [ClinicManager, FrontDeskClerk, Provider]
    code: 200
    input: []
    output: OccHealthOrder
    side_effects: []

  - method: POST
    path: "/occ-health-orders/{id}/start"
    description: "SCHEDULED -> IN_PROGRESS"
    roles: [Provider]
    code: 200
    input: []
    output: OccHealthOrder
    side_effects: []

  - method: POST
    path: "/occ-health-orders/{id}/result"
    description: "IN_PROGRESS -> COMPLETED with a result"
    roles: [Provider]
    code: 200
    input: [result]
    output: OccHealthOrder
    side_effects: ["Set result", "Create OCC_HEALTH Charge on linked Visit if present"]

  - method: POST
    path: "/occ-health-orders/{id}/cancel"
    description: "SCHEDULED/IN_PROGRESS -> CANCELLED; free slot"
    roles: [FrontDeskClerk, ClinicManager, Provider]
    code: 200
    input: []
    output: OccHealthOrder
    side_effects: ["Free collector slot"]

  # ---- Referral ----
  - method: GET
    path: "/visits/{id}/referrals"
    description: "List referrals for a visit (reverse-reachability for Referral.visit_id)"
    roles: [ClinicManager, FrontDeskClerk, Provider]
    code: 200
    input: ["limit?", "offset?"]
    output: Referral[]
    side_effects: []

  - method: GET
    path: "/referrals/{id}"
    description: "Fetch a referral"
    roles: [ClinicManager, FrontDeskClerk, Provider]
    code: 200
    input: []
    output: Referral
    side_effects: []

  - method: POST
    path: "/referrals/{id}/accept"
    description: "INITIATED -> ACCEPTED"
    roles: [ClinicManager]
    code: 200
    input: []
    output: Referral
    side_effects: ["Set accepted_at"]

  - method: POST
    path: "/referrals/{id}/cancel"
    description: "INITIATED -> CANCELLED; compensate source Visit back to CHARTING"
    roles: [ClinicManager]
    code: 200
    input: []
    output: Referral
    side_effects: ["Revert Visit TRANSFERRED -> CHARTING, clear disposition (compensation)"]

  # ---- DischargeInstruction ----
  - method: POST
    path: "/visits/{id}/discharge-instructions"
    description: "Attach discharge instructions and follow-up to a visit"
    roles: [Provider]
    code: 201
    input: [instructions_text, "follow_up_within_days?"]
    output: DischargeInstruction
    side_effects: ["Compute follow_up_due_at, follow_up_status (§1.3 follow_up_due)"]

  - method: GET
    path: "/visits/{id}/discharge-instructions"
    description: "List discharge instructions for a visit (reverse-reachability for DischargeInstruction.visit_id)"
    roles: [ClinicManager, FrontDeskClerk, Provider, Patient]
    code: 200
    input: ["limit?", "offset?"]
    output: DischargeInstruction[]
    side_effects: []

  - method: GET
    path: "/discharge-instructions/{id}"
    description: "Fetch a discharge instruction with follow_up_due_at"
    roles: [ClinicManager, FrontDeskClerk, Provider, Patient]
    code: 200
    input: []
    output: DischargeInstruction
    side_effects: []

  # ---- Test-driving (clock + seed) ----
  - method: POST
    path: "/_clock/set"
    description: "Set the server's current UTC clock (test-driving; outside business surface)"
    roles: [ClinicManager, Anonymous]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["All current-clock reads use this value until next set"]

  - method: POST
    path: "/_seed/queue-depth"
    description: "Test-driving: bulk-create N WALK_IN WAITING queue entries under a clinic to reach a target active_queue_depth without hand-rolling each create"
    roles: [ClinicManager, Anonymous]
    code: 201
    input: [clinic_id, count]
    output: Clinic
    side_effects: ["Create `count` WALK_IN entries in WAITING", "Recompute active_queue_depth, posture"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing X-User-Role or X-User-ID on an auth-required endpoint" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Acting role not permitted for this operation per §1.7" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path-referenced resource does not exist" }
  - { id: ERR_FK_NOT_FOUND, http: 404, condition: "Body foreign-key reference does not resolve to an existing resource" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, enum out of range, esi_level not 1..5, amount_cents <= 0, duration < 5" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Transition not defined from the resource's current state (§1.2)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC expected_*_version does not match parent's current version" }
  - { id: ERR_QUEUE_ORDER_VIOLATION, http: 409, condition: "Rooming a non-front READY_FOR_PROVIDER entry without override" }
  - { id: ERR_ISOLATION_REQUIRED, http: 409, condition: "airborne_precaution entry roomed into a non-ISOLATION room" }
  - { id: ERR_CLINIC_ON_DIVERSION, http: 409, condition: "Creating a queue entry while Clinic.posture == DIVERSION" }
  - { id: ERR_ROOM_UNAVAILABLE, http: 409, condition: "Target exam room not AVAILABLE at rooming" }
  - { id: ERR_PROVIDER_AT_CAPACITY, http: 409, condition: "Provider off-shift or at max_concurrent_visits at rooming" }
  - { id: ERR_SLOT_CONFLICT, http: 409, condition: "Occ-health order overlaps an existing slot on the same collector (half-open)" }
  - { id: ERR_ROOM_SLOT_CONFLICT, http: 409, condition: "Room-bound occ-health order overlaps an existing room slot within CLEAN_BUFFER_MINUTES (buffer-padded closed interval)" }
  - { id: ERR_OCC_ROOM_REQUIRED, http: 422, condition: "PHYSICAL/RESPIRATOR_FIT order missing room_id, or DRUG_SCREEN order supplying a room_id" }
  - { id: ERR_REGISTRATION_INCOMPLETE, http: 409, condition: "mark-ready without consent-signed Patient and a Coverage" }
  - { id: ERR_GUARANTOR_REQUIRED, http: 422, condition: "Minor patient registered without guarantor_name" }
  - { id: ERR_AMBULANCE_REQUIRED, http: 409, condition: "Transfer of ESI<=2 visit without mode=AMBULANCE" }
  - { id: ERR_CHARGES_NOT_FINALIZED, http: 409, condition: "Discharge attempted while billing_status==OPEN" }
  - { id: ERR_BILLING_FROZEN, http: 409, condition: "post-charges or void attempted after billing advanced past CHARGES_POSTED" }
  - { id: ERR_COVERAGE_TYPE_MISMATCH, http: 422, condition: "verify called on a SELF_PAY coverage, or INSURANCE coverage missing payer_name/member_id" }
  - { id: ERR_VALIDATION_PAGINATION, http: 400, condition: "limit/offset out of bounds (limit<1 or >100, offset<0)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ClinicManager
    description: "Operations: provisions rooms/providers, manages room state, runs ops epoch, accepts/cancels referrals"
    identity: opaque
    exclusive_operations:
      - "POST /clinics/{id}/exam-rooms"
      - "POST /clinics/{id}/exam-rooms/{rid}/mark-clean"
      - "POST /clinics/{id}/exam-rooms/{rid}/take-offline"
      - "POST /clinics/{id}/exam-rooms/{rid}/return-online"
      - "POST /clinics/{id}/providers"
      - "POST /clinics/{id}/run-ops"
      - "POST /referrals/{id}/accept"
      - "POST /referrals/{id}/cancel"
    shared_operations:
      - "POST /clinics"
      - "POST /occ-health-orders"
      - "POST /occ-health-orders/{id}/cancel"
      - "GET endpoints (read access across the clinic)"

  - name: FrontDeskClerk
    description: "Registration & front desk: walk-in intake, arrival, registration, coverage, billing invoice/settle"
    identity: opaque
    exclusive_operations:
      - "POST /patients"
      - "POST /coverages"
      - "POST /coverages/{id}/verify"
      - "POST /clinics/{id}/queue-entries/{qid}/mark-ready"
      - "POST /clinics/{id}/queue-entries/{qid}/lwbs"
      - "POST /visits/{id}/invoice"
      - "POST /visits/{id}/settle"
    shared_operations:
      - "POST /clinics/{id}/queue-entries (with Patient)"
      - "POST /clinics/{id}/queue-entries/{qid}/arrive (with Patient)"
      - "POST /clinics/{id}/queue-entries/{qid}/cancel (with Patient)"
      - "POST /occ-health-orders, /occ-health-orders/{id}/cancel"
      - "GET endpoints"

  - name: TriageNurse
    description: "Clinical triage: assigns and revises ESI level and airborne precaution"
    identity: opaque
    exclusive_operations:
      - "POST /clinics/{id}/queue-entries/{qid}/triage"
      - "POST /clinics/{id}/queue-entries/{qid}/re-triage"
    shared_operations:
      - "GET endpoints"

  - name: Provider
    description: "Clinician: rooms patients, charts visits, posts charges, transfers, discharges, runs occ-health"
    identity: entity_backed:Provider
    exclusive_operations:
      - "POST /visits"
      - "POST /visits/{id}/start-charting"
      - "POST /visits/{id}/complete-charting"
      - "POST /visits/{id}/discharge"
      - "POST /visits/{id}/transfer"
      - "POST /visits/{id}/post-charges"
      - "POST /visits/{id}/charges"
      - "POST /charges/{id}/void"
      - "POST /visits/{id}/discharge-instructions"
      - "POST /occ-health-orders/{id}/start"
      - "POST /occ-health-orders/{id}/result"
    shared_operations:
      - "POST /occ-health-orders/{id}/cancel"
      - "GET endpoints"

  - name: Patient
    description: "Self-service: online save-my-spot reservation, arrival check-in, self-cancel"
    identity: entity_backed:Patient
    exclusive_operations: []
    shared_operations:
      - "POST /clinics/{id}/queue-entries (ONLINE save-my-spot)"
      - "POST /clinics/{id}/queue-entries/{qid}/arrive"
      - "POST /clinics/{id}/queue-entries/{qid}/cancel"
      - "GET /clinics/{id}, /queue-entries/{id}, /discharge-instructions/{id}, /visits/{id}/discharge-instructions"

  - name: Anonymous
    description: "Unauthenticated bootstrap caller (clinic creation, clock/seed test-driving)"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /clinics"
      - "POST /_clock/set"
      - "POST /_seed/queue-depth"
