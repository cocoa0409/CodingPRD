              payload: { work_shift_id: "${ws_thu_id}", participant_id: "${p1_id}" }
              as: CaseManager
              captures: { err: $.data.error_id }
          assert:
            - "trigger 1 responds HTTP 201: ShiftAssignment.${sa_wed_id}.status == ASSIGNED (committed hours land on exactly 28.000, which the inclusive cap accepts)"
            - "Participant.${p1_id}.scheduled_hours_current_week == 28.000 after trigger 1"
            - "trigger 2 responds HTTP 409 with data.error_id == ERR_WEEKLY_HOURS_CAP_EXCEEDED (28.000 + 0.500 = 28.500 > 28)"
            - "WorkShift.${ws_thu_id}.assigned_count == 0 and Participant.${p1_id}.scheduled_hours_current_week is still 28.000"

      - name: viability_composite_floor_boundary_exactly_70_00
        grounds:
          - calculations.composite_viability_score
          - validations[priority=12]
          - state_machines.BusinessLine.DRAFT_to_APPROVED
          - errors[ERR_VIABILITY_GATE_NOT_MET]
        distinguishing_aspect: |
          A boundary on a DIFFERENT metric (a weighted decimal score, not accumulated hours) reached
          through a DIFFERENT endpoint (POST /business-lines/{id}/review): scores (70, 70, 70) give
          composite 70.00, which the `>=` floor accepts, while (70, 70, 69) give 69.75 and are rejected
          with ERR_VIABILITY_GATE_NOT_MET even though every dimension still clears the 50 floor.
        test_recipe:
          setup:
            - "Two DRAFT business lines: L_at_floor scored (70, 70, 70) and L_below_floor scored (70, 70, 69)."
            - "No other state is needed - the review gate reads only the line's own three scores."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-07T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /business-lines"
              payload: { name: "Grounds Crew", market_viability_score: 70, training_relevance_score: 70, mission_alignment_score: 70, training_slots_total: 3, supervisor_capacity: 2, target_gross_margin_pct: 0.1500, subsidy_cap_cents: 5000000 }
              as: ProgramDirector
              captures: { bl_at_floor_id: $.data.id, at_floor_score: $.data.composite_viability_score }
            - call: "POST /business-lines"
              payload: { name: "Print Shop", market_viability_score: 70, training_relevance_score: 70, mission_alignment_score: 69, training_slots_total: 3, supervisor_capacity: 2, target_gross_margin_pct: 0.1500, subsidy_cap_cents: 5000000 }
              as: ProgramDirector
              captures: { bl_below_id: $.data.id, below_score: $.data.composite_viability_score }
          trigger:
            - call: "POST /business-lines/${bl_at_floor_id}/review"
              payload: { decision: "APPROVED" }
              as: ProgramDirector
              captures: { at_floor_status: $.data.status }
            - call: "POST /business-lines/${bl_below_id}/review"
              payload: { decision: "APPROVED" }
              as: ProgramDirector
              captures: { err: $.data.error_id }
          assert:
            - "BusinessLine.${bl_at_floor_id}.composite_viability_score == 70.00 (0.40*70 + 0.35*70 + 0.25*70) and status == APPROVED after trigger 1"
            - "BusinessLine.${bl_below_id}.composite_viability_score == 69.75 (0.40*70 + 0.35*70 + 0.25*69)"
            - "trigger 2 responds HTTP 422 with data.error_id == ERR_VIABILITY_GATE_NOT_MET"
            - "BusinessLine.${bl_below_id}.status is still DRAFT with rejection_reason == null (a failed gate is not a rejection)"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: support_delivery_depends_on_open_period_covering_now
        grounds:
          - calculations.open_period_selector
          - state_machines.SupportActivity.PLANNED_to_DELIVERED
          - validations[priority=21]
          - errors[ERR_NO_OPEN_SUBSIDY_PERIOD]
        distinguishing_aspect: |
          Entity pair SupportActivity -> SubsidyPeriod: the PLANNED -> DELIVERED transition is legal only
          when a SubsidyPeriod of the participant's line is OPEN *and* covers the logical clock now. The
          same activity is rejected with ERR_NO_OPEN_SUBSIDY_PERIOD at clock 2026-09-07 (the only period
          starts 2026-10-01) and succeeds unchanged at clock 2026-10-05.
        test_recipe:
          setup:
            - "Launched line with exactly one SubsidyPeriod 2026-10-01..2026-10-31 (OPEN, supervisor_hours 40.0)."
            - "Participant p1 enrolled at clock 2026-09-07 (enrollment needs no period)."
            - "One PLANNED JOB_COACHING activity of 90 minutes costing 6000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-07T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /business-lines"
              payload: { name: "Cafe & Catering", market_viability_score: 90, training_relevance_score: 80, mission_alignment_score: 75, training_slots_total: 3, supervisor_capacity: 2, target_gross_margin_pct: 0.2000, subsidy_cap_cents: 5000000 }
