# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Fence & Deck Installation — Expert tier. 9 rules x 2 instances = 18 instances.
# Every assert numeric literal was computed against the §1.3 formulas + constants.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: estimate_estimated_vs_reconciled_total_diverge
        grounds:
          - calculations.reconcile_estimate
          - calculations.estimate_rollup
          - entities.Estimate.fields.contract_total
          - entities.Estimate.fields.reconciled_total
          - state_machines.SiteMeasure.RECORDED_to_APPROVED
        distinguishing_aspect: |
          Same line set, two valid bases on the Estimate domain: contract_total from
          input quantity_units (120 ft) vs reconciled_total from measured_units (132 ft)
          differ by exactly 660.98, and Project.contract_total flips to the reconciled value.
        test_recipe:
          setup:
            - "Customer + DRAFT project; estimate with two PRICED line items (fence 120 ft, deck 200 sqft) accepted; contract_total 21605.04"
            - "A RECORDED site measure overriding the fence line to 132 measured units, setback_ok true"
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Jane Owner", email: "jane@x.com", hoa_governed: false }
              as: ProjectManager
              captures: { cust_id: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust_id}", site_address: "12 Oak Ln", job_type: "FENCE_AND_DECK" }
              as: ProjectManager
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/estimates"
              payload: { tax_rate_pct: 7.25 }
              as: Estimator
              captures: { est_id: $.data.id }
            - call: "POST /line-items"
              payload: { estimate_id: "${est_id}", work_type: "FENCE", material: "CEDAR", style: "PRIVACY", quantity_units: 120, accessory: "SINGLE_GATE", grade_slope_pct: 10 }
              as: Estimator
              captures: { li_fence_id: $.data.id }
            - call: "POST /line-items"
              payload: { estimate_id: "${est_id}", work_type: "DECK", material: "COMPOSITE", style: "DECK_STANDARD", quantity_units: 200, accessory: "STAIR_SET", grade_slope_pct: 20 }
              as: Estimator
            - call: "POST /projects/${proj_id}/estimates/${est_id}/price"
              payload: {}
              as: Estimator
            - call: "POST /projects/${proj_id}/estimates/${est_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /projects/${proj_id}/site-measures"
              payload: { measured_quantities: [ { line_item_id: "${li_fence_id}", measured_units: 132 } ], property_line_note: "5ft setback respected, no encroachment", setback_ok: true }
              as: FieldTech
              captures: { sm_id: $.data.id }
          trigger:
            - call: "POST /projects/${proj_id}/site-measures/${sm_id}/approve"
              payload: {}
              as: ProjectManager
          assert:
            - "Estimate.${est_id}.contract_total == 21605.04"
            - "Estimate.${est_id}.reconciled_total == 22266.02"
            - "Project.${proj_id}.contract_total == 22266.02"
            - "reconciled_total - contract_total == 660.98"

      - name: change_order_estimate_basis_vs_measured_basis_reprice_diverge
        grounds:
          - calculations.change_order_reprice
          - calculations.change_order_reprice.variants
          - state_machines.ChangeOrder.DRAFT_to_APPLIED
          - entities.ChangeOrder.fields.total_delta
        distinguishing_aspect: |
          The SAME change order (fence line -> 150 units) applied on the ChangeOrder/Project
          domain yields total_delta 1652.44 on the estimate basis (project ESTIMATED, sibling
          deck at estimate 200) — a different conserved subject than instance 1's Estimate
          reconciliation — proving dual-variant logic spans a second entity domain.
        test_recipe:
          setup:
            - "Accepted estimate (fence 120 ft + deck 200 sqft), project ESTIMATED, contract_total 21605.04, version captured"
            - "No site measure approved yet, so change-order apply uses the estimate basis"
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Ed Basis", email: "ed@x.com", hoa_governed: false }
              as: ProjectManager
              captures: { cust_id: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust_id}", site_address: "3 Pine Ct", job_type: "FENCE_AND_DECK" }
              as: ProjectManager
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/estimates"
              payload: {}
              as: Estimator
              captures: { est_id: $.data.id }
            - call: "POST /line-items"
              payload: { estimate_id: "${est_id}", work_type: "FENCE", material: "CEDAR", style: "PRIVACY", quantity_units: 120, accessory: "SINGLE_GATE", grade_slope_pct: 10 }
              as: Estimator
              captures: { li_fence_id: $.data.id }
            - call: "POST /line-items"
              payload: { estimate_id: "${est_id}", work_type: "DECK", material: "COMPOSITE", style: "DECK_STANDARD", quantity_units: 200, accessory: "STAIR_SET", grade_slope_pct: 20 }
              as: Estimator
            - call: "POST /projects/${proj_id}/estimates/${est_id}/price"
              payload: {}
              as: Estimator
            - call: "POST /projects/${proj_id}/estimates/${est_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /projects/${proj_id}"
              payload: {}
              as: ProjectManager
              captures: { pv: $.data.version }
            - call: "POST /change-orders"
              payload: { project_id: "${proj_id}", line_item_id: "${li_fence_id}", expected_project_version: "${pv}", new_quantity_units: 150 }
              as: ProjectManager
              captures: { co_id: $.data.id }
          trigger:
            - call: "POST /change-orders/${co_id}/apply"
              payload: {}
              as: ProjectManager
          assert:
            - "ChangeOrder.${co_id}.status == APPLIED"
            - "ChangeOrder.${co_id}.total_delta == 1652.44"
            - "Project.${proj_id}.contract_total == 23257.48"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: line_item_estimate_three_input_nonlinear_slope_tier
        grounds:
          - calculations.line_item_estimate
          - entities.LineItem.fields.line_material_cost
          - entities.LineItem.fields.grade_slope_pct
          - state_machines.Estimate.DRAFT_to_PRICED
        distinguishing_aspect: |
          Mode (a): line_material_cost = round(rate(material,style)*quantity_units*slope_mult + accessory_adder)
          interacts >=3 inputs non-linearly — tiered (material,style) rate selection, a conditional
          slope multiplier gated on grade_slope_pct, and a flat accessory adder — giving 10701.60 for
          the deck line (38.25*200*1.12 + 420), not a linear sum.
        test_recipe:
          setup:
            - "Estimate with one deck line: COMPOSITE/DECK_STANDARD, 200 sqft, STAIR_SET, slope 20 (>=15 triggers surcharge)"
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Combo A", email: "ca@x.com", hoa_governed: false }
              as: ProjectManager
              captures: { cust_id: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust_id}", site_address: "9 Deck Rd", job_type: "DECK" }
              as: ProjectManager
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/estimates"
              payload: { tax_rate_pct: 7.25 }
              as: Estimator
              captures: { est_id: $.data.id }
            - call: "POST /line-items"
              payload: { estimate_id: "${est_id}", work_type: "DECK", material: "COMPOSITE", style: "DECK_STANDARD", quantity_units: 200, accessory: "STAIR_SET", grade_slope_pct: 20 }
              as: Estimator
              captures: { li_id: $.data.id }
          trigger:
            - call: "POST /projects/${proj_id}/estimates/${est_id}/price"
              payload: {}
              as: Estimator
          assert:
            - "LineItem.${li_id}.line_material_cost == 8988.00"
            - "Estimate.${est_id}.status == PRICED"

      - name: estimate_rollup_material_tax_round_per_line_then_sum
        grounds:
          - calculations.estimate_rollup
          - entities.Estimate.fields.material_tax
          - entities.Estimate.fields.contract_total
          - state_machines.Estimate.DRAFT_to_PRICED
        distinguishing_aspect: |
          Mode (b): three identical lines (CEDAR/PRIVACY, qty 2, NONE, slope 0 -> 85.00 each).
          material_tax rounds PER LINE then sums to 18.48 (round(6.1625)=6.16 x3), whereas
          sum-then-round (round(255.00*0.0725)=18.49) would differ by 0.01 — the scaffold pins per-line.
        test_recipe:
          setup:
            - "Estimate with three identical CEDAR/PRIVACY lines, quantity_units 2, accessory NONE, slope 0; line_material_cost 85.00 each"
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Combo B", email: "cb@x.com", hoa_governed: false }
              as: ProjectManager
              captures: { cust_id: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust_id}", site_address: "7 Round St", job_type: "FENCE" }
              as: ProjectManager
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/estimates"
              payload: { tax_rate_pct: 7.25 }
              as: Estimator
              captures: { est_id: $.data.id }
            - call: "POST /line-items"
              payload: { estimate_id: "${est_id}", work_type: "FENCE", material: "CEDAR", style: "PRIVACY", quantity_units: 2, accessory: "NONE", grade_slope_pct: 0 }
              as: Estimator
            - call: "POST /line-items"
              payload: { estimate_id: "${est_id}", work_type: "FENCE", material: "CEDAR", style: "PRIVACY", quantity_units: 2, accessory: "NONE", grade_slope_pct: 0 }
              as: Estimator
            - call: "POST /line-items"
              payload: { estimate_id: "${est_id}", work_type: "FENCE", material: "CEDAR", style: "PRIVACY", quantity_units: 2, accessory: "NONE", grade_slope_pct: 0 }
              as: Estimator
          trigger:
            - call: "POST /projects/${proj_id}/estimates/${est_id}/price"
              payload: {}
              as: Estimator
          assert:
            - "Estimate.${est_id}.material_subtotal == 255.00"
            - "Estimate.${est_id}.material_tax == 18.48"
            - "Estimate.${est_id}.contract_total == 980.48"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: permit_submitted_returned_resubmitted_cycle
        grounds:
          - state_machines.Permit.SUBMITTED_to_RETURNED
          - state_machines.Permit.RETURNED_to_SUBMITTED
          - entities.Permit.fields.return_reason
        distinguishing_aspect: |
          Permit exhibits a true cycle SUBMITTED->RETURNED->SUBMITTED (revision loop) on the
          Permit entity: a RETURNED permit re-enters SUBMITTED and return_reason is cleared to null.
        test_recipe:
          setup:
            - "Project advanced to MEASURED (estimate accepted, site measure approved) so a permit can be submitted"
            - "A DRAFT FENCE_PERMIT submitted then RETURNED with a reason"
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Perm Cy", email: "pc@x.com", hoa_governed: false }
              as: ProjectManager
              captures: { cust_id: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust_id}", site_address: "1 Permit Way", job_type: "FENCE" }
              as: ProjectManager
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/estimates"
              payload: {}
              as: Estimator
              captures: { est_id: $.data.id }
            - call: "POST /line-items"
              payload: { estimate_id: "${est_id}", work_type: "FENCE", material: "CEDAR", style: "PRIVACY", quantity_units: 100, accessory: "NONE", grade_slope_pct: 0 }
              as: Estimator
              captures: { li_id: $.data.id }
            - call: "POST /projects/${proj_id}/estimates/${est_id}/price"
              payload: {}
              as: Estimator
            - call: "POST /projects/${proj_id}/estimates/${est_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /projects/${proj_id}/site-measures"
              payload: { measured_quantities: [ { line_item_id: "${li_id}", measured_units: 100 } ], property_line_note: "clear", setback_ok: true }
              as: FieldTech
              captures: { sm_id: $.data.id }
            - call: "POST /projects/${proj_id}/site-measures/${sm_id}/approve"
              payload: {}
              as: ProjectManager
            - call: "POST /projects/${proj_id}/permits"
              payload: { permit_type: "FENCE_PERMIT", jurisdiction: "City of Elm" }
              as: PermitClerk
              captures: { permit_id: $.data.id }
            - call: "POST /projects/${proj_id}/permits/${permit_id}/submit"
              payload: {}
              as: PermitClerk
            - call: "POST /projects/${proj_id}/permits/${permit_id}/decide"
              payload: { decision: "RETURN", return_reason: "Missing site plan" }
              as: PermitClerk
          trigger:
            - call: "POST /projects/${proj_id}/permits/${permit_id}/submit"
              payload: {}
              as: PermitClerk
          assert:
            - "Permit.${permit_id}.status == SUBMITTED"
            - "Permit.${permit_id}.return_reason == null"

      - name: change_order_branching_apply_reject_withdraw_fork
        grounds:
          - state_machines.ChangeOrder.DRAFT_to_APPLIED
          - state_machines.ChangeOrder.DRAFT_to_REJECTED
          - state_machines.ChangeOrder.DRAFT_to_WITHDRAWN
        distinguishing_aspect: |
          ChangeOrder is a branching fork DRAFT->{APPLIED, REJECTED, WITHDRAWN} on a different
          entity than Permit: from DRAFT a reject path lands REJECTED with no reprice side effect,
          distinct from the APPLIED branch's reprice cascade.
        test_recipe:
          setup:
            - "Accepted estimate, project ESTIMATED, contract_total 21605.04, project version captured; one DRAFT change order"
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Fork CO", email: "fc@x.com", hoa_governed: false }
              as: ProjectManager
              captures: { cust_id: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust_id}", site_address: "2 Fork Ave", job_type: "FENCE_AND_DECK" }
              as: ProjectManager
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/estimates"
              payload: {}
              as: Estimator
              captures: { est_id: $.data.id }
            - call: "POST /line-items"
              payload: { estimate_id: "${est_id}", work_type: "FENCE", material: "CEDAR", style: "PRIVACY", quantity_units: 120, accessory: "SINGLE_GATE", grade_slope_pct: 10 }
              as: Estimator
              captures: { li_fence_id: $.data.id }
            - call: "POST /line-items"
              payload: { estimate_id: "${est_id}", work_type: "DECK", material: "COMPOSITE", style: "DECK_STANDARD", quantity_units: 200, accessory: "STAIR_SET", grade_slope_pct: 20 }
              as: Estimator
            - call: "POST /projects/${proj_id}/estimates/${est_id}/price"
              payload: {}
              as: Estimator
            - call: "POST /projects/${proj_id}/estimates/${est_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /projects/${proj_id}"
              payload: {}
              as: ProjectManager
              captures: { pv: $.data.version }
            - call: "POST /change-orders"
              payload: { project_id: "${proj_id}", line_item_id: "${li_fence_id}", expected_project_version: "${pv}", new_quantity_units: 150 }
              as: ProjectManager
              captures: { co_id: $.data.id }
          trigger:
            - call: "POST /change-orders/${co_id}/decide"
              payload: { decision: "REJECT" }
              as: ProjectManager
          assert:
            - "ChangeOrder.${co_id}.status == REJECTED"
            - "Project.${proj_id}.contract_total == 21605.04"
            - "ChangeOrder.${co_id}.total_delta == null"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: change_order_apply_cascades_lineitem_estimate_draws_depth3
        grounds:
          - state_machines.ChangeOrder.DRAFT_to_APPLIED
          - calculations.change_order_reprice
          - calculations.draw_rebalance
          - entities.Draw.fields.amount
        distinguishing_aspect: |
          Depth-3 chain from change_order apply: (1) target LineItem.line_material_cost recomputed,
          which (2) forces Estimate/Project.contract_total recompute to 23257.48, which (3) drives
          draw_rebalance so the non-PAID DELIVERY draw becomes 6977.24 — each link caused by the prior.
        test_recipe:
          setup:
            - "Accepted estimate (fence 120 + deck 200), contract_total 21605.04, four SCHEDULED draws (DEPOSIT 4321.01, DELIVERY 6481.51, FRAMING 6481.51, FINAL 4321.01), version captured"
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Casc A", email: "cca@x.com", hoa_governed: false }
              as: ProjectManager
              captures: { cust_id: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust_id}", site_address: "4 Casc Ln", job_type: "FENCE_AND_DECK" }
              as: ProjectManager
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/estimates"
              payload: {}
              as: Estimator
              captures: { est_id: $.data.id }
            - call: "POST /line-items"
              payload: { estimate_id: "${est_id}", work_type: "FENCE", material: "CEDAR", style: "PRIVACY", quantity_units: 120, accessory: "SINGLE_GATE", grade_slope_pct: 10 }
              as: Estimator
              captures: { li_fence_id: $.data.id }
            - call: "POST /line-items"
              payload: { estimate_id: "${est_id}", work_type: "DECK", material: "COMPOSITE", style: "DECK_STANDARD", quantity_units: 200, accessory: "STAIR_SET", grade_slope_pct: 20 }
              as: Estimator
            - call: "POST /projects/${proj_id}/estimates/${est_id}/price"
              payload: {}
              as: Estimator
            - call: "POST /projects/${proj_id}/estimates/${est_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /projects/${proj_id}"
              payload: {}
              as: ProjectManager
              captures: { pv: $.data.version }
            - call: "POST /change-orders"
              payload: { project_id: "${proj_id}", line_item_id: "${li_fence_id}", expected_project_version: "${pv}", new_quantity_units: 150 }
              as: ProjectManager
              captures: { co_id: $.data.id }
          trigger:
            - call: "POST /change-orders/${co_id}/apply"
              payload: {}
              as: ProjectManager
          assert:
            - "LineItem.${li_fence_id}.line_material_cost == 6660.00"
            - "Project.${proj_id}.contract_total == 23257.48"
            - "the project's DELIVERY Draw.amount == 6977.24 (rebalanced, no deposit paid yet)"
            - "the project's FINAL Draw.amount == 4651.50"

      - name: final_draw_pay_cascades_project_completed_warranty_depth2
        grounds:
          - state_machines.Draw.INVOICED_to_PAID
          - state_machines.Project.IN_PROGRESS_to_COMPLETED
          - state_machines.Warranty.transitions
          - entities.Warranty.fields.status
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (FINAL draw pay): paying the FINAL draw (1) bubbles
          Project IN_PROGRESS->COMPLETED, which (2) issues a Warranty in ISSUED — the Warranty creation
          is caused by the Project transition, not directly by the pay call.
        test_recipe:
          setup:
            - "Project fully advanced to IN_PROGRESS with DEPOSIT, DELIVERY, FRAMING draws PAID; FINAL draw INVOICED"
            - "Single fence line estimate (CEDAR/PRIVACY 100 ft, NONE, slope 0): material 4250.00 + labor 1600.00 + tax 308.13 = contract_total 6158.13"
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Warr A", email: "wa@x.com", hoa_governed: false }
              as: ProjectManager
              captures: { cust_id: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust_id}", site_address: "5 Warr Rd", job_type: "FENCE" }
              as: ProjectManager
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/estimates"
              payload: {}
              as: Estimator
              captures: { est_id: $.data.id }
            - call: "POST /line-items"
