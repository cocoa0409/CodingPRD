            - "Spent this month = 0; 0 + 200 = 200; 200 >= 200 -> rejected"
            - "Response status == 403 and error_id == ERR_PARENTAL_SPEND_LIMIT"
            - "PurchaseOrder.${po_g}.status == PENDING (unchanged)"
            - "Child robux_balance unchanged at 1250"

      - name: resale_floor_exactly_at_floor_accepted
        grounds:
          - calculations.resale_price_floor
          - errors.ERR_RESALE_FLOOR_VIOLATION
        distinguishing_aspect: |
          Different metric (a price floor on a ResaleListing) AND different
          boundary operator (>= floor is ACCEPTED, < floor is REJECTED) AND
          different endpoint (POST /ugc/resale-listings, not purchase-orders).
          item.price_robux = 101 -> floor = floor(101 * 0.5) = 50; ask 50 is
          accepted, ask 49 is rejected with ERR_RESALE_FLOOR_VIOLATION.
