  - rule_id: transitive_cascade
    instances:

      - name: dispute_upheld_cascade_reaches_the_concessionaire_at_depth_five
        depth: 5
        grounds:
          - state_machines.DeductionDispute.RAISED_to_UPHELD
          - state_machines.DeductionEvent.DISPUTED_to_OVERTURNED
          - state_machines.ServicePeriod.payment_status.PAID_to_ADJUSTED
          - state_machines.EnforcementAction.STEP_IN_ACTIVE_to_CURED
          - state_machines.Concession.STEP_IN_to_OPERATIONS
          - state_machines.Concessionaire.STEPPED_IN_to_ACTIVE
          - calculations.persistent_breach_evaluation
          - calculations.service_period_net_payment
        distinguishing_aspect: |
          Trigger = POST /ppp/deduction-disputes/{id}/adjudicate (decision UPHOLD).
          One request walks five distinct entity hops: LINK 1 DeductionDispute -> UPHELD,
          LINK 2 DeductionEvent -> OVERTURNED with allowed_amount_cents zeroed, LINK 3 the
          owning ServicePeriod re-runs the pinned allocation chain and moves PAID -> ADJUSTED,
          LINK 4 the Concession's availability_deduction_ytd_cents / deduction_points_ytd /
          persistent_breach_flag are recomputed and the flag flips true -> false, LINK 5 that
          flip cures the open STEP_IN EnforcementAction, which in turn returns the Concession
          to OPERATIONS and the Concessionaire to ACTIVE. An implementation that stops at
          LINK 3 leaves a stepped-in project that has no breach.
