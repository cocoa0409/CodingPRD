# =============================================================================
# task_2339 — Food Broker Retail Authorization & Slotting Management
# Scaffold seed tables (§1.0–§1.7). Difficulty band: Expert (stressed).
# =============================================================================

scenario: |
  2339. Food Broker Retail Authorization & Slotting Management (Advantage Solutions): manufacturer principal agreement with commission rates by retailer and category, retailer category review calendar and presentation preparation, slotting fee negotiation and amortization against forecast volume, authorization tracking to store-level distribution and voids reporting, promotional planning, deduction management and post-audit recovery, sample and demo coordination with the retailer, new item setup, UPC and catalog data submission, principal conflict rules within a category

domain_name: food-broker-authorization-slotting
api_prefix: ""          # flat peer collections, e.g. /principals, /category-reviews, /slotting-deals

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers

  entity_topology: graph
  # graph: ConflictRule is a symmetric edge between two Principal nodes scoped by
  # category_code (+ optional Retailer), Authorization is a junction of
  # CategoryReview × Item × Retailer × SlottingDeal, and DistributionSnapshot is
  # self-referential (REVERSAL entries point at the POSTING they reverse).

  state_machine_shape: cyclic
  # cyclic: SlottingDeal PROPOSED→COUNTERED→PROPOSED negotiation rounds,
  # CategoryReview PRESENTATION_LOCKED→OPEN reopen, Item REJECTED→SUBMITTED
  # resubmission, Authorization AT_RISK⇄AUTHORIZED, Deduction DENIED→FILED refile.
  # Layered with parallel dimensions on Authorization (authorization_state ×
  # settlement_state) and on Deduction (settlement_state × dispute_state), and a
  # branching fork at CategoryReview.decide (ACCEPTED vs DECLINED presentations
  # with divergent side-effect sets).

  relationship_patterns:
    - one_to_many          # Principal → Item, CategoryReview → Presentation
    - many_to_many         # ConflictRule joins Principal × Principal within a category_code
    - self_referential     # DistributionSnapshot.reverses_snapshot_id, Deduction.original_deduction_id
    - cross_aggregate      # SlottingDeal (broker aggregate) ↔ CommissionAgreement (contract aggregate)

  role_model: segregation_of_duties
  # The BrokerAccountManager who files a post-audit claim can never approve it;
  # approval is exclusive to BrokerAuditManager AND must come from a different
  # X-User-ID than the filer. Layered on peer roles (RetailerBuyer owns the
  # review calendar / deductions, BrokerAccountManager owns items / deals /
  # promotions, PrincipalPortalUser is read-only on its own principal).

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Retailer
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Retail chain name" }
      - { name: chain_code, type: string, source: input, description: "Short chain code; globally unique (ERR_CHAIN_CODE_DUPLICATE)", constraints: "1..16 chars, uppercase letters/digits/underscore" }
      - { name: total_store_count, type: integer, source: input, description: "Number of stores in the chain; upper bound for any authorized_store_count", constraints: ">= 1" }
      - { name: void_rate_basis_default, type: enum, source: input, default: STORE_COUNT_BASIS, description: "Basis copied onto every Authorization created for this retailer: STORE_COUNT_BASIS | REPORTED_BASIS", constraints: "STORE_COUNT_BASIS | REPORTED_BASIS" }
      - { name: at_risk_void_rate_bps, type: integer, source: input, default: 1500, description: "Void-rate threshold in basis points; Authorization flips to AT_RISK when void_rate_bps >= this value (inclusive)", constraints: "0..10000" }
      - { name: deduction_dispute_window_days, type: integer, source: input, default: 90, description: "Days after Deduction.deduction_date during which a post-audit claim may be filed (inclusive last day)", constraints: ">= 0" }
      - { name: demo_changeover_buffer_minutes, type: integer, source: input, default: 30, description: "Buffer minutes added on BOTH sides of a committed DEMO_SAMPLING window when testing occupancy of a store demo slot", constraints: ">= 0" }
      - { name: max_concurrent_demos, type: integer, source: input, default: 2, description: "Maximum number of buffer-overlapping DEMO_SAMPLING events allowed per (retailer, store_code)", constraints: ">= 1" }
      - { name: review_blackout_days, type: integer, source: input, default: 14, description: "Blackout buffer in days applied on BOTH sides of an existing CategoryReview window when scheduling a new review for the same (retailer, category_code)", constraints: ">= 0" }

  - name: Principal
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Manufacturer principal name" }
      - { name: code, type: string, source: input, description: "Principal short code; globally unique (ERR_PRINCIPAL_CODE_DUPLICATE)", constraints: "1..16 chars" }
      - { name: slotting_budget_cents, type: integer, source: input, description: "Annual slotting budget the broker may commit on this principal's behalf", constraints: ">= 0" }
      - { name: status, type: enum, source: system, default: PROSPECT, description: "PROSPECT → ACTIVE ⇄ SUSPENDED → TERMINATED", constraints: "PROSPECT | ACTIVE | SUSPENDED | TERMINATED" }
      - { name: slotting_committed_cents, type: integer, source: computed, default: 0, description: "Sum of SlottingDeal.accepted_fee_cents over deals of this principal with state IN {ACCEPTED, AMORTIZING, RECOVERY_HOLD}" }
      - { name: open_slotting_liability_cents, type: integer, source: computed, default: 0, description: "Sum of SlottingDeal.unamortized_balance_cents over deals of this principal with state IN {AMORTIZING, RECOVERY_HOLD}" }
      - { name: open_deduction_cents, type: integer, source: computed, default: 0, description: "Sum of Deduction.open_cents over deductions of this principal with settlement_state == OPEN" }
      - { name: at_risk_authorization_count, type: integer, source: computed, default: 0, description: "Count of Authorizations whose item belongs to this principal and whose authorization_state == AT_RISK" }
      - { name: liability_ratio_bps, type: integer, source: computed, default: 0, description: "floor((open_slotting_liability_cents + open_deduction_cents) * 10000 / slotting_budget_cents); exactly 0 when slotting_budget_cents == 0" }
      - { name: credit_posture, type: enum, source: computed, default: NORMAL, description: "NORMAL | WATCH | RESTRICTED — gate for presentation submission and deal acceptance; see calculations.principal_credit_posture", constraints: "NORMAL | WATCH | RESTRICTED" }

  - name: CommissionAgreement
    parent: null
    common_fields: true
    fields:
      - { name: principal_id, type: string, source: input, description: "FK -> Principal.id; the represented manufacturer" }
      - { name: retailer_id, type: string, source: input, description: "FK -> Retailer.id; the retailer this rate card covers" }
      - { name: category_code, type: enum, source: input, description: "Retailer category this rate card covers", constraints: "FROZEN_SNACKS | DAIRY | BEVERAGE | SNACK_NUTS | HBC" }
      - { name: effective_start_date, type: string, source: input, description: "Inclusive start date (YYYY-MM-DD) of the commission window" }
      - { name: effective_end_date, type: string, source: input, description: "Exclusive end date (YYYY-MM-DD) of the commission window; must be > effective_start_date" }
      - { name: base_commission_bps, type: integer, source: input, description: "Commission rate in basis points applied to the tier-1 portion of statement shipped dollars", constraints: "0..10000" }
      - { name: tier_threshold_cents, type: integer, source: input, description: "Statement shipped-dollar breakpoint; the portion at or below it earns base_commission_bps, the portion above earns tier_commission_bps", constraints: ">= 0" }
      - { name: tier_commission_bps, type: integer, source: input, description: "Marginal commission rate in basis points above tier_threshold_cents", constraints: "0..10000" }
      - { name: exclusive_in_category, type: boolean, source: input, default: false, description: "When true, no other principal may submit a presentation in this (retailer, category_code) while this agreement is ACTIVE and date-covering" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT → ACTIVE → TERMINATED", constraints: "DRAFT | ACTIVE | TERMINATED" }
      - { name: activated_at, type: datetime, source: system, description: "Logical-clock instant of the DRAFT→ACTIVE transition; null while DRAFT" }

  - name: ConflictRule
    parent: null
    common_fields: true
    fields:
      - { name: category_code, type: enum, source: input, description: "Category in which the two principals conflict", constraints: "FROZEN_SNACKS | DAIRY | BEVERAGE | SNACK_NUTS | HBC" }
      - { name: principal_a_id, type: string, source: input, description: "FK -> Principal.id; first side of the symmetric conflict edge" }
      - { name: principal_b_id, type: string, source: input, description: "FK -> Principal.id; second side of the symmetric conflict edge; must differ from principal_a_id" }
      - { name: scope, type: enum, source: input, description: "NATIONAL (applies at every retailer) | RETAILER_LEVEL (applies only at retailer_id)", constraints: "NATIONAL | RETAILER_LEVEL" }
      - { name: retailer_id, type: string, source: input, description: "FK -> Retailer.id; REQUIRED when scope == RETAILER_LEVEL and MUST be omitted when scope == NATIONAL" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE → WAIVED (terminal)", constraints: "ACTIVE | WAIVED" }
      - { name: waiver_reason, type: string, source: input, description: "Reason recorded on the ACTIVE→WAIVED transition; null while ACTIVE" }

  - name: Item
    parent: null
    common_fields: true
    fields:
      - { name: principal_id, type: string, source: input, description: "FK -> Principal.id; owning manufacturer" }
      - { name: upc, type: string, source: input, description: "12-digit UPC-A; last digit must satisfy the GS1 mod-10 check (ERR_UPC_CHECK_DIGIT_INVALID); globally unique (ERR_UPC_DUPLICATE)", constraints: "exactly 12 numeric characters" }
      - { name: description, type: string, source: input, description: "Item description as it appears on the retailer's item-setup form" }
      - { name: case_pack_units, type: integer, source: input, description: "Consumer units per shipping case", constraints: ">= 1" }
      - { name: list_price_cents, type: integer, source: input, description: "List price per case in cents; multiplied by reported_case_volume to derive shipped dollars", constraints: ">= 1" }
      - { name: unit_cost_cents, type: integer, source: input, description: "Landed cost per case in cents", constraints: ">= 1" }
      - { name: gtin14, type: string, source: input, description: "Case GTIN-14 supplied with catalog data; must equal '00' + upc (ERR_CATALOG_GTIN_MISMATCH); null until first catalog submission" }
      - { name: dimensions_cm, type: string, source: input, description: "Case dimensions LxWxH in cm supplied with catalog data; null until first catalog submission" }
      - { name: gross_weight_g, type: integer, source: input, description: "Case gross weight in grams supplied with catalog data; null until first catalog submission", constraints: ">= 1" }
      - { name: nutrition_panel_url, type: string, source: input, description: "URL of the nutrition panel asset supplied with catalog data; null until first catalog submission" }
      - { name: shelf_life_days, type: integer, source: input, description: "Shelf life in days supplied with catalog data; must be >= 30 (ERR_CATALOG_SHELF_LIFE_TOO_SHORT)" }
      - { name: catalog_state, type: enum, source: system, default: INCOMPLETE, description: "INCOMPLETE → SUBMITTED → VALIDATED | REJECTED; REJECTED → SUBMITTED on resubmission", constraints: "INCOMPLETE | SUBMITTED | VALIDATED | REJECTED" }
      - { name: catalog_submission_round, type: integer, source: system, default: 0, description: "Incremented by one on every accepted catalog submission" }
      - { name: catalog_reject_reason, type: string, source: system, description: "Reason recorded by the retailer on a REJECTED decision; cleared to null on resubmission" }

  - name: CategoryReview
    parent: null
    common_fields: true
    fields:
      - { name: retailer_id, type: string, source: input, description: "FK -> Retailer.id; the retailer whose category review calendar this slot belongs to" }
      - { name: category_code, type: enum, source: input, description: "Category under review", constraints: "FROZEN_SNACKS | DAIRY | BEVERAGE | SNACK_NUTS | HBC" }
      - { name: review_window_start, type: string, source: input, description: "Inclusive first date (YYYY-MM-DD) on which the review may be decided" }
      - { name: review_window_end, type: string, source: input, description: "Exclusive last date (YYYY-MM-DD) of the decision window; must be > review_window_start" }
      - { name: submission_deadline, type: datetime, source: input, description: "ISO 8601 UTC instant after which presentations can no longer be submitted; must be strictly before review_window_start at 00:00:00Z" }
      - { name: new_item_slots, type: integer, source: input, description: "Number of new-item slots the buyer has to award in this review", constraints: ">= 0" }
      - { name: slots_awarded, type: integer, source: computed, default: 0, description: "Count of Authorizations created by this review's decide call" }
      - { name: slots_remaining, type: integer, source: computed, description: "= new_item_slots - slots_awarded" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED → OPEN → PRESENTATION_LOCKED → DECIDED; PRESENTATION_LOCKED → OPEN on reopen", constraints: "SCHEDULED | OPEN | PRESENTATION_LOCKED | DECIDED" }
      - { name: reopen_count, type: integer, source: system, default: 0, description: "Number of PRESENTATION_LOCKED→OPEN reopen transitions; capped at MAX_REVIEW_REOPENS" }
      - { name: decided_at, type: datetime, source: system, description: "Logical-clock instant of the PRESENTATION_LOCKED→DECIDED transition; null before" }

  - name: Presentation
    parent: null
    common_fields: true
    fields:
      - { name: review_id, type: string, source: input, description: "FK -> CategoryReview.id; the review this deck is prepared for" }
      - { name: principal_id, type: string, source: input, description: "FK -> Principal.id; the principal being presented" }
      - { name: item_ids, type: array, source: input, description: "Ordered array of Item.id values in the deck; every element must reference an Item whose principal_id equals this presentation's principal_id (ERR_ITEM_PRINCIPAL_MISMATCH)", constraints: "1..5 elements, no duplicates" }
      - { name: prep_completeness_bps, type: integer, source: computed, description: "floor(count(item_ids with catalog_state == VALIDATED) * 10000 / count(item_ids))" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT → SUBMITTED → ACCEPTED | DECLINED (both set by the review's decide fork)", constraints: "DRAFT | SUBMITTED | ACCEPTED | DECLINED" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock instant of the DRAFT→SUBMITTED transition; null while DRAFT" }
      - { name: authorized_item_count, type: integer, source: computed, default: 0, description: "Count of this presentation's item_ids that the decide call awarded an Authorization" }

  - name: SlottingDeal
    parent: null
    common_fields: true
    fields:
      - { name: presentation_id, type: string, source: input, description: "FK -> Presentation.id; the deck this fee negotiation belongs to" }
      - { name: requested_fee_per_store_cents, type: integer, source: input, description: "Retailer's opening ask per store per item, recorded at creation", constraints: ">= 0" }
      - { name: current_fee_per_store_cents, type: integer, source: system, description: "Fee per store per item currently on the table; set from requested_fee_per_store_cents at creation and overwritten by every propose/counter" }
      - { name: last_offer_side, type: enum, source: system, description: "Which side made current_fee_per_store_cents: BROKER (set by propose) | RETAILER (set by counter); null while DRAFT", constraints: "BROKER | RETAILER" }
      - { name: store_count_in_scope, type: integer, source: input, description: "Stores the fee covers; must be 1..retailer.total_store_count", constraints: ">= 1" }
      - { name: item_count_in_scope, type: integer, source: input, description: "Items the fee covers; must be 1..count(presentation.item_ids)", constraints: ">= 1" }
      - { name: forecast_annual_units, type: integer, source: input, description: "Forecast annual case volume used for the volume credit and for VOLUME_WEIGHTED amortization", constraints: ">= 0" }
      - { name: amortization_periods, type: integer, source: input, description: "Number of reporting periods over which the accepted fee is amortized", constraints: "1..12" }
      - { name: amortization_method, type: enum, source: input, default: FORECAST_STRAIGHT, description: "FORECAST_STRAIGHT | VOLUME_WEIGHTED — selects the amortization variant applied to every distribution posting", constraints: "FORECAST_STRAIGHT | VOLUME_WEIGHTED" }
      - { name: round_index, type: integer, source: system, default: 0, description: "Number of retailer counters so far; capped at MAX_NEGOTIATION_ROUNDS" }
      - { name: gross_fee_cents, type: integer, source: computed, description: "current_fee_per_store_cents * store_count_in_scope * item_count_in_scope (recomputed on every propose/counter)" }
      - { name: volume_credit_cents, type: integer, source: computed, description: "min(forecast_annual_units * CREDIT_PER_UNIT_CENTS, floor(gross_fee_cents * VOLUME_CREDIT_CAP_BPS / 10000))" }
      - { name: net_before_admin_cents, type: integer, source: computed, description: "gross_fee_cents - volume_credit_cents; the ONLY value the admin-fee tier is keyed on" }
      - { name: admin_fee_cents, type: integer, source: computed, description: "round_half_up(net_before_admin_cents * admin_bps / 10000) where admin_bps is tiered on net_before_admin_cents" }
      - { name: quoted_fee_cents, type: integer, source: computed, description: "net_before_admin_cents + admin_fee_cents for the fee currently on the table" }
      - { name: accepted_fee_cents, type: integer, source: computed, default: 0, description: "quoted_fee_cents frozen at the DRAFT/COUNTERED/PROPOSED→ACCEPTED transition; 0 before acceptance" }
      - { name: cost_per_forecast_unit_cents, type: number, source: computed, description: "round_half_up(accepted_fee_cents / forecast_annual_units, 2) at acceptance; null when forecast_annual_units == 0" }
      - { name: recovered_cents, type: integer, source: computed, default: 0, description: "Sum of amortized_amount_cents over this deal's non-reversed DistributionSnapshot postings" }
      - { name: written_off_cents, type: integer, source: computed, default: 0, description: "Unrecovered balance charged off when a linked Authorization is discontinued" }
      - { name: unamortized_balance_cents, type: integer, source: computed, default: 0, description: "= accepted_fee_cents - recovered_cents - written_off_cents (conserved quantity)" }
      - { name: periods_posted, type: integer, source: computed, default: 0, description: "Number of amortization postings applied so far" }
      - { name: state, type: enum, source: system, default: DRAFT, description: "DRAFT → PROPOSED ⇄ COUNTERED → ACCEPTED → AMORTIZING ⇄ RECOVERY_HOLD → RECOVERED | WRITTEN_OFF; PROPOSED/COUNTERED → REJECTED", constraints: "DRAFT | PROPOSED | COUNTERED | ACCEPTED | AMORTIZING | RECOVERY_HOLD | RECOVERED | WRITTEN_OFF | REJECTED" }
      - { name: reject_reason, type: string, source: input, description: "Reason recorded on the →REJECTED transition; null otherwise" }

  - name: Authorization
    parent: null
    common_fields: true
    fields:
      - { name: review_id, type: string, source: input, description: "FK -> CategoryReview.id; the review that awarded this authorization" }
      - { name: item_id, type: string, source: input, description: "FK -> Item.id; the authorized item" }
      - { name: retailer_id, type: string, source: input, description: "FK -> Retailer.id; denormalized from the awarding review for scope checks" }
      - { name: slotting_deal_id, type: string, source: input, description: "FK -> SlottingDeal.id; the non-terminal deal of the item's presentation at award time, or null when the presentation had no open deal" }
      - { name: authorized_store_count, type: integer, source: system, description: "Stores authorized: slotting_deal.store_count_in_scope when a deal is linked, else the decide call's default_store_count" }
      - { name: void_rate_basis, type: enum, source: system, description: "Copied from retailer.void_rate_basis_default at award time and never re-read afterwards", constraints: "STORE_COUNT_BASIS | REPORTED_BASIS" }
      - { name: periods_reported, type: integer, source: computed, default: 0, description: "Count of non-reversed DistributionSnapshot POSTING entries for this authorization" }
      - { name: distributed_store_count, type: integer, source: computed, default: 0, description: "distributed_store_count of the latest non-reversed POSTING; 0 when none" }
      - { name: void_store_count, type: integer, source: computed, default: 0, description: "See calculations.void_rate — depends on void_rate_basis" }
      - { name: pending_store_count, type: integer, source: computed, description: "= authorized_store_count - distributed_store_count - void_store_count (conserved quantity)" }
      - { name: void_rate_bps, type: integer, source: computed, default: 0, description: "Void rate in basis points under void_rate_basis; 0 when periods_reported == 0" }
      - { name: slotting_share_cents, type: integer, source: computed, default: 0, description: "This authorization's share of the linked deal's accepted_fee_cents, allocated at acceptance by calculations.slotting_share_allocation; 0 when slotting_deal_id is null" }
      - { name: promo_settled_funding_cents, type: integer, source: computed, default: 0, description: "Sum of actual_funding_cents over this authorization's PromotionEvents in state SETTLED" }
      - { name: trade_spend_total_cents, type: integer, source: computed, default: 0, description: "= slotting_share_cents + promo_settled_funding_cents" }
      - { name: authorization_state, type: enum, source: system, default: PENDING_SETUP, description: "Distribution dimension: PENDING_SETUP → AUTHORIZED ⇄ AT_RISK → DISCONTINUED", constraints: "PENDING_SETUP | AUTHORIZED | AT_RISK | DISCONTINUED" }
      - { name: settlement_state, type: enum, source: system, default: UNBILLED, description: "Slotting dimension, independent of authorization_state: UNBILLED → SLOTTING_AMORTIZING → SLOTTING_RECOVERED | SLOTTING_WRITTEN_OFF; SLOTTING_RECOVERED → SLOTTING_AMORTIZING on posting reversal", constraints: "UNBILLED | SLOTTING_AMORTIZING | SLOTTING_RECOVERED | SLOTTING_WRITTEN_OFF" }
      - { name: discontinue_reason, type: string, source: input, description: "Reason recorded on the →DISCONTINUED transition; null otherwise" }

  - name: DistributionSnapshot
    parent: null
    common_fields: false      # append-only ledger entry: only id + created_at; never mutated, never versioned
    fields:
      - { name: authorization_id, type: string, source: input, description: "FK -> Authorization.id; the authorization this entry reports on" }
      - { name: entry_kind, type: enum, source: system, description: "POSTING (created by POST /distribution-snapshots) | REVERSAL (created by the reverse action)", constraints: "POSTING | REVERSAL" }
      - { name: reverses_snapshot_id, type: string, source: system, description: "FK -> DistributionSnapshot.id; the POSTING this REVERSAL cancels; null on POSTING entries" }
      - { name: period_index, type: integer, source: input, description: "1-based reporting period; a POSTING must carry authorization.periods_reported + 1; a REVERSAL copies the reversed POSTING's value", constraints: ">= 1" }
      - { name: reported_store_count, type: integer, source: input, description: "Stores that reported scan data this period; must be <= authorization.authorized_store_count", constraints: ">= 0" }
      - { name: distributed_store_count, type: integer, source: input, description: "Stores actually carrying the item this period; must be <= reported_store_count", constraints: ">= 0" }
      - { name: reported_case_volume, type: integer, source: input, description: "Cases shipped in the period; drives VOLUME_WEIGHTED amortization and commission shipped dollars", constraints: ">= 0" }
      - { name: amortized_amount_cents, type: integer, source: computed, description: "Slotting amount this entry posted to the linked deal; negative on REVERSAL entries; 0 when no deal is linked" }
      - { name: is_reversed, type: boolean, source: computed, default: false, description: "True when a REVERSAL entry exists whose reverses_snapshot_id equals this entry's id" }
      - { name: posted_at, type: datetime, source: system, description: "Logical-clock instant at which the entry was written" }

  - name: PromotionEvent
    parent: null
    common_fields: true
    fields:
      - { name: authorization_id, type: string, source: input, description: "FK -> Authorization.id; the authorized item being promoted" }
      - { name: event_type, type: enum, source: input, description: "PRICE_FEATURE | DISPLAY | DEMO_SAMPLING", constraints: "PRICE_FEATURE | DISPLAY | DEMO_SAMPLING" }
      - { name: store_code, type: string, source: input, description: "Store hosting the demo; REQUIRED when event_type == DEMO_SAMPLING and MUST be omitted otherwise" }
      - { name: window_start, type: datetime, source: input, description: "Inclusive ISO 8601 UTC start of the promotion/demo window" }
      - { name: window_end, type: datetime, source: input, description: "Exclusive ISO 8601 UTC end; must be > window_start" }
      - { name: planned_funding_cents, type: integer, source: input, description: "Trade funds the principal plans to spend on this event", constraints: ">= 0" }
      - { name: sample_units_requested, type: integer, source: input, default: 0, description: "Sample cases requested for the demo; must be >= 1 when event_type == DEMO_SAMPLING", constraints: ">= 0" }
      - { name: actual_funding_cents, type: integer, source: input, description: "Funding actually consumed, supplied at execute; null before" }
      - { name: settled_funding_cents, type: integer, source: computed, default: 0, description: "Cumulative conceded_cents of this event's PROMO_BILLBACK deductions that have left settlement_state OPEN" }
      - { name: state, type: enum, source: system, default: PLANNED, description: "PLANNED → COMMITTED → EXECUTED → SETTLED; PLANNED/COMMITTED → CANCELLED", constraints: "PLANNED | COMMITTED | EXECUTED | SETTLED | CANCELLED" }
      - { name: committed_at, type: datetime, source: system, description: "Logical-clock instant of the PLANNED→COMMITTED transition; null before" }

  - name: Deduction
    parent: null
    common_fields: true
    fields:
      - { name: retailer_id, type: string, source: input, description: "FK -> Retailer.id; the retailer that took the deduction" }
      - { name: principal_id, type: string, source: input, description: "FK -> Principal.id; the principal whose invoice was short-paid" }
      - { name: promotion_event_id, type: string, source: input, description: "FK -> PromotionEvent.id; REQUIRED when reason_code == PROMO_BILLBACK, MUST be omitted for every other reason_code" }
      - { name: original_deduction_id, type: string, source: input, description: "FK -> Deduction.id; REQUIRED when reason_code == DUPLICATE_BILLBACK (the deduction being re-taken), MUST be omitted otherwise" }
      - { name: reason_code, type: enum, source: input, description: "PROMO_BILLBACK | SHORTAGE | COMPLIANCE_FINE | DUPLICATE_BILLBACK", constraints: "PROMO_BILLBACK | SHORTAGE | COMPLIANCE_FINE | DUPLICATE_BILLBACK" }
      - { name: amount_cents, type: integer, source: input, description: "Amount deducted from the principal's invoice", constraints: ">= 1" }
      - { name: deduction_date, type: string, source: input, description: "Date (YYYY-MM-DD) the retailer took the deduction; anchors the dispute window" }
      - { name: claim_amount_cents, type: integer, source: input, default: 0, description: "Amount claimed back in the post-audit dispute; must be <= amount_cents; 0 while NOT_DISPUTED" }
      - { name: recovered_cents, type: integer, source: computed, default: 0, description: "Amount recovered from the retailer on an approved claim" }
      - { name: conceded_cents, type: integer, source: computed, default: 0, description: "Amount accepted as valid trade spend (conceded outright, or the non-recoverable remainder of an approved claim)" }
      - { name: open_cents, type: integer, source: computed, description: "= amount_cents - recovered_cents - conceded_cents (conserved quantity)" }
      - { name: substantiation_doc_count, type: integer, source: computed, default: 0, description: "Number of substantiate calls accepted for the current claim; reset to 0 on every DENIED→FILED refile" }
      - { name: filed_by_user_id, type: string, source: system, description: "X-User-ID of the BrokerAccountManager who filed the current claim; null while NOT_DISPUTED" }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID of the BrokerAuditManager who approved the claim; MUST differ from filed_by_user_id" }
      - { name: refile_count, type: integer, source: system, default: 0, description: "Number of DENIED→FILED refiles; capped at MAX_REFILES" }
      - { name: settlement_state, type: enum, source: system, default: OPEN, description: "Money dimension: OPEN → RECOVERED | CONCEDED", constraints: "OPEN | RECOVERED | CONCEDED" }
      - { name: dispute_state, type: enum, source: system, default: NOT_DISPUTED, description: "Claim dimension, independent of settlement_state: NOT_DISPUTED → FILED → SUBSTANTIATED → APPROVED | DENIED; DENIED → FILED on refile", constraints: "NOT_DISPUTED | FILED | SUBSTANTIATED | APPROVED | DENIED" }
      - { name: denial_reason, type: string, source: input, description: "Reason recorded on the SUBSTANTIATED→DENIED transition; null otherwise" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Principal
    state_field: status
    initial_state: PROSPECT
    terminal_states: [TERMINATED]
    transitions:
      - from: PROSPECT
        to: ACTIVE
        trigger: "POST /principals/{principalId}/status with status=ACTIVE"
        actor: BrokerAdmin
        preconditions: ["At least one CommissionAgreement with status == ACTIVE exists for this principal (ERR_PRINCIPAL_HAS_NO_AGREEMENT)"]
        side_effects: ["credit_posture recomputed (calculations.principal_credit_posture)"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /principals/{principalId}/status with status=SUSPENDED"
        actor: BrokerAdmin
        preconditions: []
        side_effects: ["Presentation submission and slotting-deal acceptance for this principal are blocked with ERR_PRINCIPAL_NOT_ACTIVE while SUSPENDED"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /principals/{principalId}/status with status=ACTIVE"
        actor: BrokerAdmin
        preconditions: []
        side_effects: ["credit_posture recomputed"]
        note: "Cycle: a principal may be reinstated any number of times."
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /principals/{principalId}/status with status=TERMINATED"
        actor: BrokerAdmin
        preconditions: ["No Authorization of this principal's items has authorization_state IN {PENDING_SETUP, AUTHORIZED, AT_RISK} (ERR_PRINCIPAL_HAS_LIVE_AUTHORIZATIONS)"]
        side_effects: ["All CommissionAgreements of this principal with status == ACTIVE are set to TERMINATED"]
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /principals/{principalId}/status with status=TERMINATED"
        actor: BrokerAdmin
        preconditions: ["No Authorization of this principal's items has authorization_state IN {PENDING_SETUP, AUTHORIZED, AT_RISK} (ERR_PRINCIPAL_HAS_LIVE_AUTHORIZATIONS)"]
        side_effects: ["All CommissionAgreements of this principal with status == ACTIVE are set to TERMINATED"]

  - entity: CommissionAgreement
    state_field: status
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /commission-agreements/{agreementId}/activate"
        actor: BrokerAdmin
        preconditions:
          - "No other CommissionAgreement with status == ACTIVE for the same (principal_id, retailer_id, category_code) whose half-open date window overlaps this one: reject when new.effective_start_date < other.effective_end_date AND other.effective_start_date < new.effective_end_date (ERR_AGREEMENT_WINDOW_OVERLAP). Adjacency (new.effective_start_date == other.effective_end_date) is allowed."
          - "principal.status != TERMINATED (ERR_PRINCIPAL_TERMINATED)"
        side_effects: ["activated_at = logical clock now", "Unblocks presentation submission and deal acceptance for date-covered (principal, retailer, category_code) triples"]
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /commission-agreements/{agreementId}/terminate, or cascaded from Principal ACTIVE/SUSPENDED→TERMINATED"
        actor: BrokerAdmin
        preconditions: ["No SlottingDeal of this (principal, retailer, category_code) is in state IN {PROPOSED, COUNTERED} (ERR_AGREEMENT_HAS_OPEN_NEGOTIATION)"]
        side_effects: ["Presentation submission and deal acceptance for this triple now fail with ERR_NO_ACTIVE_COMMISSION_AGREEMENT"]

  - entity: ConflictRule
    state_field: status
    initial_state: ACTIVE
    terminal_states: [WAIVED]
    transitions:
      - from: ACTIVE
        to: WAIVED
        trigger: "POST /conflict-rules/{conflictRuleId}/waive"
        actor: BrokerAdmin
        preconditions: []
        side_effects: ["waiver_reason recorded", "The pair is no longer considered by the ERR_PRINCIPAL_CONFLICT check at presentation submission"]

  - entity: Item
    state_field: catalog_state
    initial_state: INCOMPLETE
    terminal_states: [VALIDATED]
    transitions:
      - from: INCOMPLETE
        to: SUBMITTED
        trigger: "POST /items/{itemId}/catalog-submissions"
        actor: BrokerAccountManager
        preconditions:
          - "gtin14 == '00' + item.upc (ERR_CATALOG_GTIN_MISMATCH)"
          - "shelf_life_days >= MIN_SHELF_LIFE_DAYS (ERR_CATALOG_SHELF_LIFE_TOO_SHORT)"
          - "principal.status IN {PROSPECT, ACTIVE} (ERR_PRINCIPAL_NOT_ACTIVE)"
        side_effects: ["catalog_submission_round += 1", "catalog_reject_reason = null", "Catalog payload fields (gtin14, dimensions_cm, gross_weight_g, nutrition_panel_url, shelf_life_days) persisted on the Item"]
      - from: SUBMITTED
        to: VALIDATED
        trigger: "POST /items/{itemId}/catalog-decision with decision=VALIDATED"
        actor: RetailerBuyer
        preconditions: []
        side_effects: ["Item becomes eligible for presentation submission and for authorization at decide", "prep_completeness_bps of every DRAFT Presentation containing this item is recomputed"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /items/{itemId}/catalog-decision with decision=REJECTED"
        actor: RetailerBuyer
        preconditions: ["reject_reason is present (ERR_INVALID_REQUEST)"]
        side_effects: ["catalog_reject_reason recorded", "prep_completeness_bps of every DRAFT Presentation containing this item is recomputed"]
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /items/{itemId}/catalog-submissions"
        actor: BrokerAccountManager
        preconditions: ["gtin14 == '00' + item.upc (ERR_CATALOG_GTIN_MISMATCH)", "shelf_life_days >= MIN_SHELF_LIFE_DAYS (ERR_CATALOG_SHELF_LIFE_TOO_SHORT)"]
        side_effects: ["catalog_submission_round += 1", "catalog_reject_reason = null"]
        note: "Cycle: rejected catalog data may be corrected and resubmitted without limit."

  - entity: CategoryReview
    state_field: status
    initial_state: SCHEDULED
    terminal_states: [DECIDED]
    transitions:
      - from: SCHEDULED
        to: OPEN
        trigger: "POST /category-reviews/{reviewId}/open"
        actor: RetailerBuyer
        preconditions: ["logical clock now < submission_deadline (ERR_REVIEW_SUBMISSION_CLOSED)"]
        side_effects: ["Presentations for this review may now be submitted"]
      - from: OPEN
        to: PRESENTATION_LOCKED
        trigger: "POST /category-reviews/{reviewId}/lock"
        actor: RetailerBuyer
        preconditions: ["logical clock now >= submission_deadline (ERR_SUBMISSION_WINDOW_STILL_OPEN)"]
        side_effects: ["Presentation submission now fails with ERR_REVIEW_NOT_OPEN", "Deck is frozen for the buyer's decision"]
      - from: PRESENTATION_LOCKED
        to: OPEN
        trigger: "POST /category-reviews/{reviewId}/reopen"
        actor: RetailerBuyer
        preconditions:
          - "reopen_count < MAX_REVIEW_REOPENS (ERR_REVIEW_REOPEN_LIMIT)"
          - "logical clock now < review_window_start at 00:00:00Z (ERR_REVIEW_WINDOW_STARTED)"
          - "new_submission_deadline > logical clock now AND new_submission_deadline < review_window_start at 00:00:00Z (ERR_REVIEW_CALENDAR_INVALID)"
        side_effects: ["submission_deadline = new_submission_deadline", "reopen_count += 1"]
        note: "Cycle: lock → reopen → lock, bounded by MAX_REVIEW_REOPENS."
      - from: PRESENTATION_LOCKED
        to: DECIDED
        trigger: "POST /category-reviews/{reviewId}/decide"
        actor: RetailerBuyer
        preconditions:
          - "expected_review_version == review.version (ERR_STALE_REVIEW_VERSION)"
          - "review_window_start <= logical clock date < review_window_end (ERR_REVIEW_WINDOW_CLOSED)"
          - "Every authorized_item_ids element belongs to an Item listed by a Presentation of this review whose status == SUBMITTED (ERR_ITEM_NOT_IN_SUBMITTED_PRESENTATION)"
          - "Every authorized item has catalog_state == VALIDATED (ERR_ITEM_CATALOG_NOT_VALIDATED)"
          - "count(authorized_item_ids) <= slots_remaining (ERR_REVIEW_SLOTS_EXCEEDED)"
        side_effects:
          - "decided_at = logical clock now; slots_awarded += count(authorized_item_ids)"
          - "FORK BRANCH A — for every authorized item, in Item.upc ASC order: create Authorization(authorization_state=PENDING_SETUP, settlement_state=UNBILLED, retailer_id=review.retailer_id, void_rate_basis=retailer.void_rate_basis_default, slotting_deal_id = the SlottingDeal of that item's presentation whose state IN {PROPOSED, COUNTERED} or null when none, authorized_store_count = that deal's store_count_in_scope or the call's default_store_count when no deal)"
          - "FORK BRANCH A — every Presentation of this review with >= 1 authorized item: status SUBMITTED→ACCEPTED, authorized_item_count set; its open deal stays in {PROPOSED, COUNTERED} and becomes acceptable"
          - "FORK BRANCH B — every Presentation of this review with 0 authorized items: status SUBMITTED→DECLINED; every SlottingDeal of that presentation in state IN {DRAFT, PROPOSED, COUNTERED} → REJECTED with reject_reason='PRESENTATION_DECLINED'"
          - "Authorizations created with slotting_deal_id == null immediately auto-advance PENDING_SETUP→AUTHORIZED and stay settlement_state=UNBILLED"
          - "review.version += 1"

  - entity: Presentation
    state_field: status
    initial_state: DRAFT
    terminal_states: [ACCEPTED, DECLINED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /presentations/{presentationId}/submit"
        actor: BrokerAccountManager
        preconditions:
          - "review.status == OPEN (ERR_REVIEW_NOT_OPEN)"
          - "logical clock now < review.submission_deadline (ERR_REVIEW_SUBMISSION_CLOSED)"
          - "principal.status == ACTIVE (ERR_PRINCIPAL_NOT_ACTIVE)"
          - "principal.credit_posture != RESTRICTED (ERR_PRINCIPAL_CREDIT_RESTRICTED)"
          - "An ACTIVE CommissionAgreement exists for (principal_id, review.retailer_id, review.category_code) whose [effective_start_date, effective_end_date) contains the logical clock date (ERR_NO_ACTIVE_COMMISSION_AGREEMENT)"
          - "No ACTIVE ConflictRule pairs this principal with a principal that already has a Presentation in status IN {SUBMITTED, ACCEPTED} in this review, where the rule's category_code == review.category_code and (scope == NATIONAL or (scope == RETAILER_LEVEL and retailer_id == review.retailer_id)) (ERR_PRINCIPAL_CONFLICT)"
          - "No other principal holds an ACTIVE, date-covering CommissionAgreement with exclusive_in_category == true for (review.retailer_id, review.category_code) (ERR_CATEGORY_EXCLUSIVITY)"
          - "Every item in item_ids has catalog_state == VALIDATED (ERR_ITEM_CATALOG_NOT_VALIDATED)"
        side_effects: ["submitted_at = logical clock now", "prep_completeness_bps recomputed (10000 on success)"]
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "system — FORK BRANCH A of POST /category-reviews/{reviewId}/decide"
        actor: system
        preconditions: ["At least one of this presentation's item_ids appears in the decide call's authorized_item_ids"]
        side_effects: ["authorized_item_count = count of this presentation's items awarded", "Its open SlottingDeal remains acceptable"]
      - from: SUBMITTED
        to: DECLINED
        trigger: "system — FORK BRANCH B of POST /category-reviews/{reviewId}/decide"
        actor: system
        preconditions: ["None of this presentation's item_ids appears in the decide call's authorized_item_ids"]
        side_effects: ["authorized_item_count stays 0", "Every SlottingDeal of this presentation in state IN {DRAFT, PROPOSED, COUNTERED} → REJECTED (reject_reason='PRESENTATION_DECLINED')"]

  - entity: SlottingDeal
    state_field: state
    initial_state: DRAFT
    terminal_states: [RECOVERED, WRITTEN_OFF, REJECTED]
    transitions:
      - from: DRAFT
        to: PROPOSED
        trigger: "POST /slotting-deals/{dealId}/propose"
        actor: BrokerAccountManager
        preconditions: ["presentation.status IN {DRAFT, SUBMITTED, ACCEPTED} (ERR_PRESENTATION_DECLINED)"]
        side_effects: ["current_fee_per_store_cents = proposed_fee_per_store_cents", "last_offer_side = BROKER", "gross_fee_cents / volume_credit_cents / net_before_admin_cents / admin_fee_cents / quoted_fee_cents recomputed (calculations.slotting_quote)"]
      - from: PROPOSED
        to: COUNTERED
        trigger: "POST /slotting-deals/{dealId}/counter"
        actor: RetailerBuyer
        preconditions:
          - "round_index < MAX_NEGOTIATION_ROUNDS (ERR_NEGOTIATION_ROUNDS_EXHAUSTED)"
          - "counter_fee_per_store_cents > current_fee_per_store_cents (ERR_COUNTER_NOT_HIGHER)"
        side_effects: ["round_index += 1", "current_fee_per_store_cents = counter_fee_per_store_cents", "forecast_annual_units = counter_forecast_annual_units when supplied", "last_offer_side = RETAILER", "quote fields recomputed"]
      - from: COUNTERED
        to: PROPOSED
        trigger: "POST /slotting-deals/{dealId}/propose"
        actor: BrokerAccountManager
        preconditions: ["proposed_fee_per_store_cents < current_fee_per_store_cents (ERR_PROPOSAL_NOT_LOWER)"]
        side_effects: ["current_fee_per_store_cents = proposed_fee_per_store_cents", "last_offer_side = BROKER", "quote fields recomputed"]
        note: "Cycle: PROPOSED→COUNTERED→PROPOSED negotiation rounds, bounded by MAX_NEGOTIATION_ROUNDS counters."
      - from: PROPOSED
        to: ACCEPTED
        trigger: "POST /slotting-deals/{dealId}/accept"
        actor: RetailerBuyer
        preconditions:
          - "last_offer_side == BROKER, i.e. the accepting side is NOT the offeror (ERR_ACCEPT_BY_OFFEROR)"
          - "expected_principal_version == principal.version (ERR_STALE_PRINCIPAL_VERSION)"
          - "review.status == DECIDED (ERR_REVIEW_NOT_DECIDED)"
          - "presentation.status == ACCEPTED (ERR_PRESENTATION_NOT_ACCEPTED)"
          - "principal.status == ACTIVE (ERR_PRINCIPAL_NOT_ACTIVE)"
          - "principal.credit_posture != RESTRICTED (ERR_PRINCIPAL_CREDIT_RESTRICTED)"
          - "An ACTIVE CommissionAgreement exists for (principal_id, review.retailer_id, review.category_code) whose [effective_start_date, effective_end_date) contains the logical clock date (ERR_NO_ACTIVE_COMMISSION_AGREEMENT)"
          - "principal.slotting_committed_cents + quoted_fee_cents <= principal.slotting_budget_cents (ERR_SLOTTING_BUDGET_EXCEEDED)"
        side_effects:
          - "accepted_fee_cents = quoted_fee_cents; cost_per_forecast_unit_cents computed (null when forecast_annual_units == 0); unamortized_balance_cents = accepted_fee_cents"
          - "System auto-advances ACCEPTED→AMORTIZING inside the same request"
          - "principal.version += 1"
      - from: COUNTERED
        to: ACCEPTED
        trigger: "POST /slotting-deals/{dealId}/accept"
        actor: BrokerAccountManager
        preconditions:
          - "last_offer_side == RETAILER, i.e. the accepting side is NOT the offeror (ERR_ACCEPT_BY_OFFEROR)"
          - "expected_principal_version == principal.version (ERR_STALE_PRINCIPAL_VERSION)"
          - "review.status == DECIDED (ERR_REVIEW_NOT_DECIDED)"
          - "presentation.status == ACCEPTED (ERR_PRESENTATION_NOT_ACCEPTED)"
          - "principal.status == ACTIVE (ERR_PRINCIPAL_NOT_ACTIVE)"
          - "principal.credit_posture != RESTRICTED (ERR_PRINCIPAL_CREDIT_RESTRICTED)"
          - "An ACTIVE CommissionAgreement exists for (principal_id, review.retailer_id, review.category_code) whose [effective_start_date, effective_end_date) contains the logical clock date (ERR_NO_ACTIVE_COMMISSION_AGREEMENT)"
          - "principal.slotting_committed_cents + quoted_fee_cents <= principal.slotting_budget_cents (ERR_SLOTTING_BUDGET_EXCEEDED)"
        side_effects:
          - "accepted_fee_cents = quoted_fee_cents; cost_per_forecast_unit_cents computed; unamortized_balance_cents = accepted_fee_cents"
          - "System auto-advances ACCEPTED→AMORTIZING inside the same request"
          - "principal.version += 1"
      - from: ACCEPTED
        to: AMORTIZING
        trigger: "system — immediately after the →ACCEPTED transition inside POST /slotting-deals/{dealId}/accept"
        actor: system
        preconditions: []
        side_effects:
          - "CASCADE HOP 1 — every Authorization with slotting_deal_id == this deal: authorization_state PENDING_SETUP→AUTHORIZED and settlement_state UNBILLED→SLOTTING_AMORTIZING"
          - "CASCADE HOP 2 — slotting_share_cents allocated across those Authorizations (calculations.slotting_share_allocation); trade_spend_total_cents recomputed on each"
          - "CASCADE HOP 3 — principal.slotting_committed_cents, open_slotting_liability_cents and liability_ratio_bps recomputed; credit_posture re-derived (may move NORMAL→WATCH→RESTRICTED)"
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /slotting-deals/{dealId}/reject, or system FORK BRANCH B of POST /category-reviews/{reviewId}/decide"
        actor: RetailerBuyer
        preconditions: []
        side_effects: ["reject_reason recorded", "Every Authorization with slotting_deal_id == this deal and authorization_state == PENDING_SETUP → DISCONTINUED (discontinue_reason='DEAL_REJECTED')"]
      - from: COUNTERED
        to: REJECTED
        trigger: "POST /slotting-deals/{dealId}/reject, or system FORK BRANCH B of POST /category-reviews/{reviewId}/decide"
        actor: RetailerBuyer
        preconditions: []
        side_effects: ["reject_reason recorded", "Every Authorization with slotting_deal_id == this deal and authorization_state == PENDING_SETUP → DISCONTINUED (discontinue_reason='DEAL_REJECTED')"]
      - from: DRAFT
        to: REJECTED
        trigger: "system — FORK BRANCH B of POST /category-reviews/{reviewId}/decide"
        actor: system
        preconditions: []
        side_effects: ["reject_reason = 'PRESENTATION_DECLINED'"]
      - from: AMORTIZING
        to: RECOVERY_HOLD
        trigger: "system — an Authorization linked to this deal transitions AUTHORIZED→AT_RISK during POST /distribution-snapshots"
        actor: system
        preconditions: ["unamortized_balance_cents > 0 (a deal that reached RECOVERED in the same request is never moved to RECOVERY_HOLD)"]
        side_effects: ["principal.open_slotting_liability_cents unchanged, but principal.at_risk_authorization_count += 1 and credit_posture re-derived"]
      - from: RECOVERY_HOLD
        to: AMORTIZING
        trigger: "system — every Authorization linked to this deal has left AT_RISK (void_rate_bps back below retailer.at_risk_void_rate_bps, or the AT_RISK authorization was discontinued)"
        actor: system
        preconditions: []
        side_effects: ["principal.at_risk_authorization_count and credit_posture re-derived"]
        note: "Cycle: AMORTIZING ⇄ RECOVERY_HOLD tracks the void-rate threshold in both directions."
      - from: AMORTIZING
        to: RECOVERED
        trigger: "system — an amortization posting during POST /distribution-snapshots drives unamortized_balance_cents to 0"
        actor: system
        preconditions: ["unamortized_balance_cents == 0 after the posting"]
        side_effects: ["Every Authorization with slotting_deal_id == this deal: settlement_state SLOTTING_AMORTIZING→SLOTTING_RECOVERED", "principal.open_slotting_liability_cents recomputed (this deal now contributes 0) and credit_posture re-derived"]
      - from: RECOVERY_HOLD
        to: RECOVERED
        trigger: "system — an amortization posting during POST /distribution-snapshots drives unamortized_balance_cents to 0 while on recovery hold"
        actor: system
        preconditions: ["unamortized_balance_cents == 0 after the posting"]
        side_effects: ["Every linked Authorization: settlement_state SLOTTING_AMORTIZING→SLOTTING_RECOVERED", "principal aggregates and credit_posture re-derived"]
      - from: RECOVERED
        to: AMORTIZING
        trigger: "system — POST /distribution-snapshots/{snapshotId}/reverse un-posts the amortization that closed the deal"
        actor: system
        preconditions: []
        side_effects: ["Every linked Authorization: settlement_state SLOTTING_RECOVERED→SLOTTING_AMORTIZING", "principal.open_slotting_liability_cents recomputed upward and credit_posture re-derived"]
        note: "Cycle: a reversal reopens a closed deal; accepted_fee_cents == recovered_cents + unamortized_balance_cents + written_off_cents must still hold."
      - from: AMORTIZING
        to: WRITTEN_OFF
        trigger: "system — POST /authorizations/{authorizationId}/discontinue on the deal's last non-DISCONTINUED authorization"
        actor: system
        preconditions: ["unamortized_balance_cents > 0"]
        side_effects: ["written_off_cents += unamortized_balance_cents (balance driven to 0)", "Every linked Authorization: settlement_state SLOTTING_AMORTIZING→SLOTTING_WRITTEN_OFF", "principal.slotting_committed_cents and open_slotting_liability_cents recomputed (deal leaves both sets) and credit_posture re-derived"]
      - from: RECOVERY_HOLD
        to: WRITTEN_OFF
        trigger: "system — POST /authorizations/{authorizationId}/discontinue on the deal's last non-DISCONTINUED authorization"
        actor: system
        preconditions: ["unamortized_balance_cents > 0"]
        side_effects: ["written_off_cents += unamortized_balance_cents", "Every linked Authorization: settlement_state → SLOTTING_WRITTEN_OFF", "principal aggregates and credit_posture re-derived"]

  - entity: Authorization
    state_field: authorization_state
    initial_state: PENDING_SETUP
    terminal_states: [DISCONTINUED]
    transitions:
      - from: PENDING_SETUP
        to: AUTHORIZED
        trigger: "system — the linked SlottingDeal reaches AMORTIZING inside POST /slotting-deals/{dealId}/accept, or immediately at decide when slotting_deal_id is null"
        actor: system
        preconditions: ["item.catalog_state == VALIDATED (already enforced at decide)"]
        side_effects: ["Distribution postings and promotion commits become possible", "slotting_share_cents allocated when a deal is linked"]
      - from: AUTHORIZED
        to: AT_RISK
        trigger: "system — POST /distribution-snapshots posts a period whose recomputed void_rate_bps >= retailer.at_risk_void_rate_bps"
        actor: system
        preconditions: []
        side_effects:
          - "CASCADE HOP 2 — linked SlottingDeal AMORTIZING→RECOVERY_HOLD (skipped when the deal reached RECOVERED in this same request)"
          - "CASCADE HOP 3 — principal.at_risk_authorization_count += 1, liability_ratio_bps recomputed, credit_posture re-derived"
          - "New PromotionEvent commits for this authorization fail with ERR_AUTHORIZATION_AT_RISK"
      - from: AT_RISK
        to: AUTHORIZED
        trigger: "system — a later POST /distribution-snapshots posting, or POST /distribution-snapshots/{snapshotId}/reverse, recomputes void_rate_bps < retailer.at_risk_void_rate_bps"
        actor: system
        preconditions: []
        side_effects: ["Linked SlottingDeal RECOVERY_HOLD→AMORTIZING when no other linked authorization is AT_RISK", "principal.at_risk_authorization_count -= 1 and credit_posture re-derived"]
        note: "Cycle: AUTHORIZED ⇄ AT_RISK follows the void-rate threshold in both directions."
      - from: PENDING_SETUP
        to: DISCONTINUED
        trigger: "POST /authorizations/{authorizationId}/discontinue, or system when the linked SlottingDeal is REJECTED"
        actor: RetailerBuyer
        preconditions: []
        side_effects: ["discontinue_reason recorded", "settlement_state stays UNBILLED (nothing was ever amortized)", "review.slots_awarded is NOT decremented — an awarded slot stays consumed"]
      - from: AUTHORIZED
        to: DISCONTINUED
        trigger: "POST /authorizations/{authorizationId}/discontinue"
        actor: RetailerBuyer
        preconditions: ["No PromotionEvent of this authorization is in state IN {COMMITTED, EXECUTED} (ERR_AUTHORIZATION_HAS_LIVE_PROMOTION)"]
        side_effects: ["discontinue_reason recorded", "When this is the deal's last non-DISCONTINUED authorization and unamortized_balance_cents > 0: deal AMORTIZING/RECOVERY_HOLD→WRITTEN_OFF and settlement_state → SLOTTING_WRITTEN_OFF", "principal aggregates and credit_posture re-derived"]
      - from: AT_RISK
        to: DISCONTINUED
        trigger: "POST /authorizations/{authorizationId}/discontinue"
        actor: RetailerBuyer
        preconditions: ["No PromotionEvent of this authorization is in state IN {COMMITTED, EXECUTED} (ERR_AUTHORIZATION_HAS_LIVE_PROMOTION)"]
        side_effects: ["discontinue_reason recorded", "principal.at_risk_authorization_count -= 1", "Deal RECOVERY_HOLD→AMORTIZING when no other linked authorization is AT_RISK, then →WRITTEN_OFF when this was the last non-DISCONTINUED authorization and unamortized_balance_cents > 0", "credit_posture re-derived"]

  - entity: Authorization
    state_field: settlement_state
    initial_state: UNBILLED
    terminal_states: [SLOTTING_WRITTEN_OFF]
    transitions:
      - from: UNBILLED
        to: SLOTTING_AMORTIZING
        trigger: "system — linked SlottingDeal reaches AMORTIZING inside POST /slotting-deals/{dealId}/accept"
        actor: system
        preconditions: ["slotting_deal_id is not null"]
        side_effects: ["slotting_share_cents allocated; trade_spend_total_cents recomputed"]
        note: "Parallel dimension: settlement_state evolves independently of authorization_state — an AT_RISK authorization stays SLOTTING_AMORTIZING, and a DISCONTINUED one may be SLOTTING_RECOVERED."
      - from: SLOTTING_AMORTIZING
        to: SLOTTING_RECOVERED
        trigger: "system — linked SlottingDeal reaches RECOVERED during POST /distribution-snapshots"
        actor: system
        preconditions: ["deal.unamortized_balance_cents == 0"]
        side_effects: []
      - from: SLOTTING_RECOVERED
        to: SLOTTING_AMORTIZING
        trigger: "system — POST /distribution-snapshots/{snapshotId}/reverse reopens the deal"
        actor: system
        preconditions: []
        side_effects: []
      - from: SLOTTING_AMORTIZING
        to: SLOTTING_WRITTEN_OFF
        trigger: "system — linked SlottingDeal reaches WRITTEN_OFF during POST /authorizations/{authorizationId}/discontinue"
        actor: system
        preconditions: ["deal.unamortized_balance_cents > 0 before the write-off"]
        side_effects: []

  - entity: PromotionEvent
    state_field: state
    initial_state: PLANNED
    terminal_states: [SETTLED, CANCELLED]
    transitions:
      - from: PLANNED
        to: COMMITTED
        trigger: "POST /promotion-events/{promotionEventId}/commit"
        actor: BrokerAccountManager
        preconditions:
          - "authorization.authorization_state == AUTHORIZED (ERR_AUTHORIZATION_AT_RISK when AT_RISK, ERR_AUTHORIZATION_NOT_AUTHORIZED otherwise)"
          - "window_start >= logical clock now (ERR_PROMO_WINDOW_IN_PAST)"
          - "For event_type == DEMO_SAMPLING: count of COMMITTED/EXECUTED DEMO_SAMPLING events on the same (authorization.retailer_id, store_code) whose buffered window [window_start - buffer, window_end + buffer) intersects this window is < retailer.max_concurrent_demos (ERR_DEMO_SLOT_CAPACITY)"
        side_effects: ["committed_at = logical clock now", "The demo slot is now occupied for capacity purposes"]
      - from: COMMITTED
        to: EXECUTED
        trigger: "POST /promotion-events/{promotionEventId}/execute"
        actor: BrokerAccountManager
        preconditions:
          - "logical clock now >= window_end (ERR_PROMO_NOT_ELAPSED)"
          - "actual_funding_cents <= floor(planned_funding_cents * FUNDING_TOLERANCE_BPS / 10000) (ERR_PROMO_FUNDING_OVERRUN)"
        side_effects: ["actual_funding_cents persisted", "PROMO_BILLBACK deductions may now be validated against actual_funding_cents"]
      - from: EXECUTED
        to: SETTLED
        trigger: "system — CASCADE HOP 2 of POST /deductions/{deductionId}/approve-recovery or POST /deductions/{deductionId}/concede"
        actor: system
        preconditions: ["settled_funding_cents >= actual_funding_cents after the deduction settlement"]
        side_effects: ["CASCADE HOP 3 — authorization.promo_settled_funding_cents += actual_funding_cents and trade_spend_total_cents recomputed"]
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /promotion-events/{promotionEventId}/cancel"
        actor: BrokerAccountManager
        preconditions: []
        side_effects: []
      - from: COMMITTED
        to: CANCELLED
        trigger: "POST /promotion-events/{promotionEventId}/cancel"
        actor: BrokerAccountManager
        preconditions: []
        side_effects: ["The demo slot is released: this event no longer counts toward ERR_DEMO_SLOT_CAPACITY"]

  - entity: Deduction
    state_field: settlement_state
    initial_state: OPEN
    terminal_states: [RECOVERED, CONCEDED]
    transitions:
      - from: OPEN
        to: RECOVERED
        trigger: "system — POST /deductions/{deductionId}/approve-recovery with recoverable_cents > 0"
        actor: system
        preconditions: ["dispute_state == SUBSTANTIATED", "calculations.post_audit_recovery yields recoverable_cents > 0"]
        side_effects:
          - "recovered_cents = recoverable_cents; conceded_cents = amount_cents - recoverable_cents; open_cents → 0"
          - "CASCADE HOP 2 — for reason_code == PROMO_BILLBACK: promotion_event.settled_funding_cents += conceded_cents, and PromotionEvent EXECUTED→SETTLED once settled_funding_cents >= actual_funding_cents"
          - "principal.open_deduction_cents and liability_ratio_bps recomputed; credit_posture re-derived"
      - from: OPEN
        to: CONCEDED
        trigger: "POST /deductions/{deductionId}/concede, or system during approve-recovery when recoverable_cents == 0"
        actor: BrokerAccountManager
        preconditions: ["dispute_state IN {NOT_DISPUTED, DENIED, SUBSTANTIATED}"]
        side_effects:
          - "conceded_cents = amount_cents - recovered_cents; open_cents → 0"
          - "CASCADE HOP 2 — for reason_code == PROMO_BILLBACK: promotion_event.settled_funding_cents += conceded_cents, and PromotionEvent EXECUTED→SETTLED once settled_funding_cents >= actual_funding_cents"
          - "principal.open_deduction_cents recomputed; credit_posture re-derived"

  - entity: Deduction
    state_field: dispute_state
    initial_state: NOT_DISPUTED
    terminal_states: [APPROVED]
    transitions:
      - from: NOT_DISPUTED
        to: FILED
        trigger: "POST /deductions/{deductionId}/dispute"
        actor: BrokerAccountManager
        preconditions:
          - "settlement_state == OPEN (ERR_DEDUCTION_ALREADY_SETTLED)"
          - "logical clock date <= deduction_date + retailer.deduction_dispute_window_days (ERR_DISPUTE_WINDOW_CLOSED)"
          - "claim_amount_cents <= amount_cents (ERR_CLAIM_EXCEEDS_DEDUCTION)"
        side_effects: ["claim_amount_cents persisted", "filed_by_user_id = X-User-ID", "substantiation_doc_count = 0"]
        note: "Parallel dimension: dispute_state moves while settlement_state stays OPEN."
      - from: FILED
        to: SUBSTANTIATED
        trigger: "POST /deductions/{deductionId}/substantiate"
        actor: BrokerAccountManager
        preconditions: []
        side_effects: ["substantiation_doc_count += 1"]
        note: "Repeat substantiate calls while SUBSTANTIATED only increment substantiation_doc_count (self-loop, no state change)."
      - from: SUBSTANTIATED
        to: APPROVED
        trigger: "POST /deductions/{deductionId}/approve-recovery"
        actor: BrokerAuditManager
        preconditions:
          - "X-User-ID != filed_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "substantiation_doc_count >= MIN_SUBSTANTIATION_DOCS (ERR_SUBSTANTIATION_INSUFFICIENT)"
          - "settlement_state == OPEN (ERR_DEDUCTION_ALREADY_SETTLED)"
        side_effects: ["approved_by_user_id = X-User-ID", "settlement_state OPEN→RECOVERED (or →CONCEDED when recoverable_cents == 0)"]
      - from: SUBSTANTIATED
        to: DENIED
        trigger: "POST /deductions/{deductionId}/deny-recovery"
        actor: BrokerAuditManager
        preconditions: ["X-User-ID != filed_by_user_id (ERR_SEGREGATION_OF_DUTIES)"]
        side_effects: ["denial_reason recorded", "settlement_state stays OPEN and open_cents is unchanged — the deny/dispute pair is money-neutral"]
      - from: DENIED
        to: FILED
        trigger: "POST /deductions/{deductionId}/dispute"
        actor: BrokerAccountManager
        preconditions:
          - "refile_count < MAX_REFILES (ERR_REFILE_LIMIT_REACHED)"
          - "logical clock date <= deduction_date + retailer.deduction_dispute_window_days (ERR_DISPUTE_WINDOW_CLOSED)"
          - "claim_amount_cents <= amount_cents (ERR_CLAIM_EXCEEDS_DEDUCTION)"
        side_effects: ["refile_count += 1", "substantiation_doc_count = 0", "denial_reason = null", "filed_by_user_id = X-User-ID"]
        note: "Cycle: DENIED→FILED→SUBSTANTIATED→DENIED, bounded by MAX_REFILES."

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on a parent entity's version — the only
# sanctioned write-write conflict mechanism)
# =============================================================================
concurrency_rules:
  - rule_id: deal-accept-stale-principal
    parent_entity: Principal
    write_endpoint: "POST /slotting-deals/{dealId}/accept"
    occ_field: "expected_principal_version"
    description: |
      Accepting a SlottingDeal commits quoted_fee_cents against the shared
      principal budget. When the client's expected_principal_version is behind
      Principal.version — because a different deal's acceptance, a status change
      or a deduction settlement has since moved the principal's committed and
      liability aggregates — the acceptance is rejected on the stale version
      rather than being evaluated against a budget the client never saw.
    error_id: ERR_STALE_PRINCIPAL_VERSION
    http_status: 412

  - rule_id: snapshot-post-stale-authorization
    parent_entity: Authorization
    write_endpoint: "POST /distribution-snapshots"
    occ_field: "expected_authorization_version"
    description: |
      A distribution posting is written against the Authorization's period
      sequence, void counters and the linked deal's amortization ledger. When
      expected_authorization_version is behind Authorization.version — because a
      prior posting, a reversal, a void-rate state change or a promotion
      settlement has since advanced it — the posting is rejected on the stale
      version instead of being applied on top of counters the client never saw.
    error_id: ERR_STALE_AUTHORIZATION_VERSION
    http_status: 412

  - rule_id: review-decide-stale-review
    parent_entity: CategoryReview
    write_endpoint: "POST /category-reviews/{reviewId}/decide"
    occ_field: "expected_review_version"
    description: |
      The decide call awards slots against slots_remaining and forks every
      SUBMITTED presentation. When expected_review_version is behind
      CategoryReview.version — because a reopen extended the submission deadline
      or a further presentation was submitted after the client read the review —
      the decision is rejected on the stale version rather than awarding slots
      from a deck the client never saw.
    error_id: ERR_STALE_REVIEW_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation & Algorithm Table
# =============================================================================
calculations:
  - rule_id: slotting_quote
    name: "Slotting fee quote (gross → volume credit → net → admin tier → quoted fee)"
    algorithm_type: tiered_pricing
    trigger: "POST /slotting-deals, POST /slotting-deals/{dealId}/propose, POST /slotting-deals/{dealId}/counter (recomputed on every offer); frozen into accepted_fee_cents at POST /slotting-deals/{dealId}/accept"
    inputs:
      - "SlottingDeal.current_fee_per_store_cents"
      - "SlottingDeal.store_count_in_scope"
      - "SlottingDeal.item_count_in_scope"
      - "SlottingDeal.forecast_annual_units"
    constants:
      CREDIT_PER_UNIT_CENTS: 3
      VOLUME_CREDIT_CAP_BPS: 4000
      ADMIN_TIER_1_MAX_CENTS: 5000000
      ADMIN_BPS_TIER_1: 250
      ADMIN_BPS_TIER_2: 150
    formula: |
      Evaluated strictly in this order; every intermediate is persisted so the
      quote is auditable and so no step may be re-derived from a later one.

        step 1  gross_fee_cents      = current_fee_per_store_cents
                                       * store_count_in_scope
                                       * item_count_in_scope
        step 2  credit_raw           = forecast_annual_units * CREDIT_PER_UNIT_CENTS
                credit_cap           = floor(gross_fee_cents * VOLUME_CREDIT_CAP_BPS / 10000)
                volume_credit_cents  = min(credit_raw, credit_cap)
        step 3  net_before_admin_cents = gross_fee_cents - volume_credit_cents
        step 4  admin_bps            = ADMIN_BPS_TIER_1
                                         when net_before_admin_cents <= ADMIN_TIER_1_MAX_CENTS
                                       else ADMIN_BPS_TIER_2
        step 5  admin_fee_cents      = round_half_up(net_before_admin_cents * admin_bps / 10000)
        step 6  quoted_fee_cents     = net_before_admin_cents + admin_fee_cents
        step 7  cost_per_forecast_unit_cents =
                  null                                  when forecast_annual_units == 0
                  round_half_up(accepted_fee_cents / forecast_annual_units, 2)  otherwise
                  (computed at accept time only, from accepted_fee_cents)

      CIRCULAR-LOOKING DEPENDENCY (must be resolved as written): the admin tier
      in step 4 is keyed on net_before_admin_cents — the value BEFORE the admin
      fee is added — never on quoted_fee_cents / accepted_fee_cents, even though
      the admin fee is itself part of the quoted fee. The larger fee is the
      obvious-looking driver and is wrong.

      The volume credit is a discount, so a larger forecast lowers the fee, but
      the discount is capped at VOLUME_CREDIT_CAP_BPS of gross: beyond
      floor(gross * 4000 / 10000 / 3) forecast units the credit stops growing.
    output_fields:
      - "SlottingDeal.gross_fee_cents"
      - "SlottingDeal.volume_credit_cents"
      - "SlottingDeal.net_before_admin_cents"
      - "SlottingDeal.admin_fee_cents"
      - "SlottingDeal.quoted_fee_cents"
      - "SlottingDeal.accepted_fee_cents (accept only)"
      - "SlottingDeal.cost_per_forecast_unit_cents (accept only)"
    worked_examples:
      - name: "credit below cap, tier 1"
        given: "fee_per_store=25000, stores=100, items=2, forecast=120000"
        expect: "gross=5000000; credit_raw=360000, cap=2000000 → credit=360000; net=4640000; admin_bps=250 → admin=116000; quoted=4756000; at accept cost_per_forecast_unit=39.63"
      - name: "tier boundary — net exactly ADMIN_TIER_1_MAX_CENTS"
        given: "fee_per_store=28000, stores=100, items=2, forecast=200000"
        expect: "gross=5600000; credit=600000; net=5000000 → tier 1 (inclusive) → admin=125000; quoted=5125000. Keying the tier on the quoted fee (5125000 > 5000000 → 150 bps) would yield admin=76875 and quoted=5076875 — wrong."
      - name: "one cent over the tier boundary"
        given: "fee_per_store=28000, stores=100, items=2, forecast=199999"
        expect: "gross=5600000; credit=599997; net=5000003 → tier 2 → admin=round_half_up(75000.045)=75000; quoted=5075003 (LOWER quoted fee than the 200000-forecast case — the tier break dominates the lost credit)"
      - name: "volume credit cap binds"
        given: "fee_per_store=10000, stores=100, items=1, forecast=200000"
        expect: "gross=1000000; credit_raw=600000 but cap=400000 → credit=400000; net=600000; admin=15000; quoted=615000"
      - name: "half-up rounding of the admin fee"
        given: "fee_per_store=50001, stores=20, items=1, forecast=0"
        expect: "gross=1000020; credit=0; net=1000020; 1000020*250/10000 = 25000.5 → admin=25001 (banker's rounding would give 25000); quoted=1025021; cost_per_forecast_unit=null"

  - rule_id: slotting_amortization
    name: "Slotting fee amortization against reported volume (dual variant)"
    algorithm_type: aggregation
    trigger: "POST /distribution-snapshots (POSTING entry) and POST /distribution-snapshots/{snapshotId}/reverse (REVERSAL entry)"
    inputs:
      - "SlottingDeal.accepted_fee_cents"
      - "SlottingDeal.amortization_periods"
      - "SlottingDeal.amortization_method"
      - "SlottingDeal.forecast_annual_units"
      - "SlottingDeal.unamortized_balance_cents (running)"
      - "SlottingDeal.periods_posted (running)"
      - "DistributionSnapshot.reported_case_volume of the posting period"
    variants:
      - variant_id: FORECAST_STRAIGHT
        applies_when: "SlottingDeal.amortization_method == FORECAST_STRAIGHT"
        formula: |
          base_amount   = floor(accepted_fee_cents / amortization_periods)
          amount_cents  = base_amount
                            when periods_posted + 1 < amortization_periods
                          = accepted_fee_cents - base_amount * (amortization_periods - 1)
                            when periods_posted + 1 == amortization_periods   # true-up period
          amount_cents  = min(amount_cents, unamortized_balance_cents)
          reported_case_volume is recorded but does NOT affect the amount.
      - variant_id: VOLUME_WEIGHTED
        applies_when: "SlottingDeal.amortization_method == VOLUME_WEIGHTED"
        formula: |
          period_target_units = ceil(forecast_annual_units / amortization_periods)
          ratio_bps = 0                                        when period_target_units == 0
                    = min(floor(reported_case_volume * 10000 / period_target_units), 10000)
                                                               otherwise
          amount_cents = round_half_up(accepted_fee_cents * ratio_bps
                                       / (10000 * amortization_periods))
          amount_cents = min(amount_cents, unamortized_balance_cents)
          A period that under-ships amortizes proportionally less, so the deal may
          still carry a balance after amortization_periods postings; a period that
          over-ships is capped at 10000 bps (one full period, never more).
    divergence: |
      Same deal, same posting: accepted_fee_cents=4756000, amortization_periods=6,
      forecast_annual_units=120000, first period reported_case_volume=15000.
        FORECAST_STRAIGHT → 792666 (volume ignored)
        VOLUME_WEIGHTED   → period_target=ceil(120000/6)=20000,
                            ratio_bps=floor(15000*10000/20000)=7500,
                            round_half_up(4756000*7500/60000)=594500
      Delta = 198166 cents on the very first period, and the two methods drive
      different unamortized_balance_cents, hence different →RECOVERED timing.
    side_effects: |
      recovered_cents += amount_cents; unamortized_balance_cents -= amount_cents;
      periods_posted += 1. A REVERSAL entry applies the negation of the amount of
      the POSTING it reverses (recovered_cents -= amount, balance += amount,
      periods_posted -= 1). Postings are accepted only while
      SlottingDeal.state IN {AMORTIZING, RECOVERY_HOLD}.
    invariant: "accepted_fee_cents == recovered_cents + unamortized_balance_cents + written_off_cents, after every posting, every reversal and every write-off."
    output_fields:
      - "DistributionSnapshot.amortized_amount_cents"
      - "SlottingDeal.recovered_cents"
      - "SlottingDeal.unamortized_balance_cents"
      - "SlottingDeal.periods_posted"
    worked_examples:
      - name: "FORECAST_STRAIGHT true-up on the final period"
        given: "accepted=4756000, periods=6, five periods already posted at 792666"
        expect: "base=792666; sixth amount = 4756000 - 792666*5 = 792670; balance → 0; deal → RECOVERED"
      - name: "VOLUME_WEIGHTED over-ship is capped at one period"
        given: "accepted=4756000, periods=6, forecast=120000, reported_case_volume=44000"
        expect: "period_target=20000; ratio_raw=22000 → capped to 10000; amount=round_half_up(4756000*10000/60000)=792667 (never more than a full period)"

  - rule_id: void_rate
    name: "Store-level distribution / void rate (dual variant by basis)"
    algorithm_type: threshold
    trigger: "POST /distribution-snapshots, POST /distribution-snapshots/{snapshotId}/reverse, GET /authorizations/{authorizationId}/voids-report"
    inputs:
      - "Authorization.authorized_store_count"
      - "Authorization.void_rate_basis (pinned from Retailer.void_rate_basis_default at award)"
      - "latest = the DistributionSnapshot of this authorization with the highest period_index among entry_kind == POSTING entries that are not reversed (is_reversed == false); ties impossible (one POSTING per period_index)"
      - "Retailer.at_risk_void_rate_bps"
    constants: {}
    variants:
      - variant_id: STORE_COUNT_BASIS
        applies_when: "Authorization.void_rate_basis == STORE_COUNT_BASIS"
        formula: |
          distributed_store_count = latest.distributed_store_count      (0 when no live POSTING)
          void_store_count        = authorized_store_count - distributed_store_count
          void_rate_bps           = 0 when authorized_store_count == 0
                                    else floor(void_store_count * 10000 / authorized_store_count)
          pending_store_count     = 0
          Every store the retailer never reported on counts as a void: the
          denominator is the AUTHORIZED store count.
      - variant_id: REPORTED_BASIS
        applies_when: "Authorization.void_rate_basis == REPORTED_BASIS"
        formula: |
          distributed_store_count = latest.distributed_store_count
          void_store_count        = latest.reported_store_count - distributed_store_count
          void_rate_bps           = 0 when latest.reported_store_count == 0
                                    else floor(void_store_count * 10000 / latest.reported_store_count)
          pending_store_count     = authorized_store_count
                                    - distributed_store_count - void_store_count
          Only stores the retailer actually reported on are in the denominator;
          unreported stores are pending, not void.
    divergence: |
      authorized_store_count=400, latest POSTING reported_store_count=380,
      distributed_store_count=340, retailer.at_risk_void_rate_bps=1500.
        STORE_COUNT_BASIS → void=60,  rate=floor(60*10000/400)=1500,
                            pending=0 → 1500 >= 1500 → AUTHORIZED→AT_RISK
        REPORTED_BASIS    → void=40,  rate=floor(40*10000/380)=1052,
                            pending=20 → 1052 < 1500  → stays AUTHORIZED
      The same snapshot therefore does or does not put the linked SlottingDeal on
      RECOVERY_HOLD purely by the basis pinned on the authorization.
    threshold_rule: "AT_RISK when void_rate_bps >= Retailer.at_risk_void_rate_bps (INCLUSIVE at the threshold); back to AUTHORIZED when a later live snapshot yields void_rate_bps < the threshold."
    output_fields:
      - "Authorization.distributed_store_count"
      - "Authorization.void_store_count"
      - "Authorization.pending_store_count"
      - "Authorization.void_rate_bps"
      - "Authorization.authorization_state"

  - rule_id: commission_statement
    name: "Principal commission statement (per-line tiered rate, per-line rounding then sum)"
    algorithm_type: tiered_pricing
    trigger: "GET /principals/{principalId}/commission-statement?retailer_id=&category_code="
    inputs:
      - "CommissionAgreement.base_commission_bps, tier_threshold_cents, tier_commission_bps for the (principal, retailer, category_code) agreement with status == ACTIVE whose [effective_start_date, effective_end_date) contains the logical clock date"
      - "One line per Item of the principal that has at least one Authorization for that retailer with authorization_state IN {AUTHORIZED, AT_RISK, DISCONTINUED}, whose review.category_code matches"
      - "line_shipped_cents = (sum of reported_case_volume over that item's live POSTING snapshots) * Item.list_price_cents"
    constants: {}
    formula: |
      Lines are ordered by Item.upc ASC (a total order — never by id, never by
      insertion order). A running cumulative shipped total drives the tier split:

        running = 0
        for each line in Item.upc ASC:
            tier1_part      = max(0, min(line_shipped_cents,
                                         tier_threshold_cents - running))
            tier2_part      = line_shipped_cents - tier1_part
            line_raw        = tier1_part * base_commission_bps  / 10000
                            + tier2_part * tier_commission_bps  / 10000
            line_commission_cents = round_half_up(line_raw)     # ROUND PER LINE
            running        += line_shipped_cents
        total_commission_cents = sum(line_commission_cents)      # THEN SUM

      COMBINATION ORDER (must be as written): round each line to whole cents
      first, then sum the rounded lines. Summing the raw per-line values and
      rounding the total once — or applying the tier to the aggregate shipped
      total instead of walking lines in upc order — gives a different answer.
    output_fields:
      - "GET /principals/{principalId}/commission-statement → lines[].line_commission_cents"
      - "GET /principals/{principalId}/commission-statement → total_commission_cents"
    worked_examples:
      - name: "per-line rounding beats aggregate rounding by 1 cent"
        given: "base_commission_bps=500, tier_commission_bps=300, tier_threshold_cents=3000000; three lines in upc ASC with line_shipped_cents = 1000010, 1000010, 1500000"
        expect: |
          line 1: tier1=1000010, tier2=0      → raw 50000.5  → 50001
          line 2: tier1=1000010, tier2=0      → raw 50000.5  → 50001   (running 1000010)
          line 3: tier1=999980,  tier2=500020 → raw 64999.6  → 65000   (running 2000020)
          total_commission_cents = 165002
          Rounding once at the end (aggregate 3500020 → 3000000 @ 500bps + 500020 @ 300bps
          = 165000.6 → 165001) is off by 1 cent.

  - rule_id: slotting_share_allocation
    name: "Allocation of accepted slotting fee across the deal's authorizations"
    algorithm_type: waterfall_allocation
    trigger: "system — SlottingDeal ACCEPTED→AMORTIZING inside POST /slotting-deals/{dealId}/accept"
    inputs:
      - "SlottingDeal.accepted_fee_cents"
      - "The Authorizations with slotting_deal_id == deal.id, ordered created_at ASC then Item.upc ASC"
    constants: {}
    formula: |
      n         = count(linked authorizations)                # n >= 1 guaranteed
      base      = floor(accepted_fee_cents / n)
      remainder = accepted_fee_cents - base * n               # 0 <= remainder < n
      The first `remainder` authorizations in (created_at ASC, Item.upc ASC) order
      receive base + 1; the rest receive base. The ordering is deterministic and
      never depends on id.
    invariant: "sum(Authorization.slotting_share_cents over the deal's authorizations) == SlottingDeal.accepted_fee_cents, exactly, with no cent lost or duplicated."
    output_fields:
      - "Authorization.slotting_share_cents"
      - "Authorization.trade_spend_total_cents"
    worked_examples:
      - name: "indivisible fee — remainder to the earliest authorization"
        given: "accepted_fee_cents=5125000 across 3 authorizations"
        expect: "base=1708333, remainder=1 → shares 1708334, 1708333, 1708333; sum == 5125000"

  - rule_id: principal_credit_posture
    name: "Principal liability ratio and credit posture gate"
    algorithm_type: threshold
    trigger: "system — recomputed on every write that changes a SlottingDeal state/balance, an Authorization AT_RISK flag, or a Deduction settlement"
    inputs:
      - "Principal.slotting_budget_cents"
      - "Principal.open_slotting_liability_cents"
      - "Principal.open_deduction_cents"
      - "Principal.at_risk_authorization_count"
    constants:
      WATCH_RATIO_BPS: 5000
      RESTRICTED_RATIO_BPS: 7500
      RESTRICTED_AT_RISK_COUNT: 2
    formula: |
      liability_ratio_bps =
        0                                                   when slotting_budget_cents == 0
        floor((open_slotting_liability_cents + open_deduction_cents)
              * 10000 / slotting_budget_cents)              otherwise

      credit_posture =
        RESTRICTED  when at_risk_authorization_count >= RESTRICTED_AT_RISK_COUNT
                      OR liability_ratio_bps >= RESTRICTED_RATIO_BPS
        WATCH       else when at_risk_authorization_count >= 1
                      OR liability_ratio_bps >= WATCH_RATIO_BPS
        NORMAL      otherwise

      Both thresholds are INCLUSIVE. A zero budget yields ratio 0, so a
      zero-budget principal is never RESTRICTED by ratio — only by at-risk count.
      RESTRICTED blocks POST /presentations/{presentationId}/submit and
      POST /slotting-deals/{dealId}/accept with ERR_PRINCIPAL_CREDIT_RESTRICTED.
    output_fields:
      - "Principal.liability_ratio_bps"
      - "Principal.credit_posture"
    worked_examples:
      - name: "ratio-driven WATCH"
        given: "budget=10000000, open_slotting_liability=5125000, open_deduction=400000, at_risk_count=0"
        expect: "liability_ratio_bps = floor(5525000*10000/10000000) = 5525 → >= 5000 and < 7500 → WATCH"
      - name: "at-risk-driven RESTRICTED overrides a healthy ratio"
        given: "budget=10000000, open_slotting_liability=1000000, open_deduction=0, at_risk_count=2"
        expect: "liability_ratio_bps = 1000 (NORMAL by ratio) but at_risk_count >= 2 → RESTRICTED"

  - rule_id: post_audit_recovery
    name: "Post-audit recoverable amount by deduction reason code"
    algorithm_type: waterfall_allocation
    trigger: "POST /deductions/{deductionId}/approve-recovery"
    inputs:
      - "Deduction.reason_code"
      - "Deduction.amount_cents"
      - "Deduction.claim_amount_cents"
      - "PromotionEvent.actual_funding_cents and state (PROMO_BILLBACK only)"
      - "Deduction.original_deduction_id (DUPLICATE_BILLBACK only)"
    constants:
      SHORTAGE_ALLOWANCE_BPS: 5000
    formula: |
      recoverable_cents by reason_code:

        DUPLICATE_BILLBACK  → claim_amount_cents
              (the original deduction already covers the charge; the duplicate is
               fully recoverable)
        PROMO_BILLBACK      → min(claim_amount_cents,
                                  max(0, amount_cents - substantiated_funding))
              where substantiated_funding = promotion_event.actual_funding_cents
                    when promotion_event.state IN {EXECUTED, SETTLED}, else 0.
              (funding the broker can prove was actually delivered is conceded;
               only the excess is recoverable)
        SHORTAGE            → min(claim_amount_cents,
                                  floor(amount_cents * SHORTAGE_ALLOWANCE_BPS / 10000))
              (a contractual allowance caps recovery at half the deduction)
        COMPLIANCE_FINE     → 0
              (fines are never recoverable)

      Then, for every reason_code:
        recovered_cents = recoverable_cents
        conceded_cents  = amount_cents - recoverable_cents
        open_cents      = amount_cents - recovered_cents - conceded_cents   # == 0
        settlement_state = RECOVERED when recoverable_cents > 0 else CONCEDED
    invariant: "amount_cents == recovered_cents + conceded_cents + open_cents at all times. While the dispute is merely FILED / SUBSTANTIATED / DENIED, recovered_cents == conceded_cents == 0 and open_cents == amount_cents — a deny/refile round trip is money-neutral."
    output_fields:
      - "Deduction.recovered_cents"
      - "Deduction.conceded_cents"
      - "Deduction.open_cents"
      - "Deduction.settlement_state"
      - "PromotionEvent.settled_funding_cents (cascade)"
    worked_examples:
      - name: "PROMO_BILLBACK with proven funding"
        given: "amount=500000, claim=500000, promotion_event.state=EXECUTED, actual_funding_cents=320000"
        expect: "recoverable=min(500000, 500000-320000)=180000 → recovered=180000, conceded=320000, open=0, settlement_state=RECOVERED; cascade: promo.settled_funding_cents 0→320000 >= actual → EXECUTED→SETTLED"
      - name: "SHORTAGE allowance halves the claim"
        given: "amount=90000, claim=90000"
        expect: "recoverable=min(90000, floor(90000*5000/10000)=45000)=45000 → recovered=45000, conceded=45000, RECOVERED"
      - name: "COMPLIANCE_FINE is never recoverable"
        given: "amount=75000, claim=75000, substantiation_doc_count=2"
        expect: "recoverable=0 → recovered=0, conceded=75000, open=0, settlement_state=CONCEDED (dispute_state still moves SUBSTANTIATED→APPROVED)"
      - name: "PROMO_BILLBACK where funding was never executed"
        given: "amount=500000, claim=400000, promotion_event.state=COMMITTED (actual_funding_cents=0)"
        expect: "substantiated_funding=0 → recoverable=min(400000, 500000)=400000 → recovered=400000, conceded=100000, RECOVERED"

# =============================================================================
# §1.4 Validation Rules Table (evaluated in ascending priority; the FIRST
# violated rule determines the response — later violations are never reported)
# =============================================================================
validations:
  - rule_id: v-auth-headers
    priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the five declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - rule_id: v-role-permitted
    priority: 2
    category: auth
    check: "X-User-Role is listed in the endpoint's roles"
    error_id: ERR_ROLE_FORBIDDEN
    http_status: 403
    applies_to: all

  - rule_id: v-request-shape
    priority: 3
    category: existence
    check: "Required body fields present; types, enum members and numeric ranges valid (e.g. amortization_periods 1..12, item_ids length 1..5, bps 0..10000, upc exactly 12 digits, dates ISO-8601)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"

  - rule_id: v-upc-checksum
    priority: 3
    category: existence
    check: "Item.upc satisfies the GS1 mod-10 check digit (weights 3,1,3,1,... over the first 11 digits)"
    error_id: ERR_UPC_CHECK_DIGIT_INVALID
    http_status: 400
    applies_to: "POST /items"

  - rule_id: v-path-existence
    priority: 4
    category: existence
    check: "Every id in the path exists, validated left-to-right; then every FK id in the body exists"
    error_id: "ERR_RETAILER_NOT_FOUND | ERR_PRINCIPAL_NOT_FOUND | ERR_AGREEMENT_NOT_FOUND | ERR_CONFLICT_RULE_NOT_FOUND | ERR_ITEM_NOT_FOUND | ERR_REVIEW_NOT_FOUND | ERR_PRESENTATION_NOT_FOUND | ERR_DEAL_NOT_FOUND | ERR_AUTHORIZATION_NOT_FOUND | ERR_SNAPSHOT_NOT_FOUND | ERR_PROMOTION_NOT_FOUND | ERR_DEDUCTION_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path or body ids"

  - rule_id: v-retailer-scope
    priority: 5
    category: business_safety
    check: "When X-User-Role == RetailerBuyer, X-User-ID equals the retailer_id that owns the target resource (review.retailer_id, deal → presentation → review.retailer_id, authorization.retailer_id, deduction.retailer_id)"
    error_id: ERR_RETAILER_SCOPE_FORBIDDEN
    http_status: 403
    applies_to: "all RetailerBuyer endpoints"

  - rule_id: v-principal-scope
    priority: 5
    category: business_safety
    check: "When X-User-Role == PrincipalPortalUser, X-User-ID equals the principal_id that owns the target resource (item.principal_id, presentation.principal_id, deduction.principal_id, deal → presentation.principal_id)"
    error_id: ERR_PRINCIPAL_SCOPE_FORBIDDEN
    http_status: 403
    applies_to: "all PrincipalPortalUser endpoints"

  - rule_id: v-occ-principal
    priority: 6
    category: concurrency
    check: "expected_principal_version == Principal.version (§1.2.1 deal-accept-stale-principal)"
    error_id: ERR_STALE_PRINCIPAL_VERSION
    http_status: 412
    applies_to: "POST /slotting-deals/{dealId}/accept"

  - rule_id: v-occ-authorization
    priority: 6
    category: concurrency
    check: "expected_authorization_version == Authorization.version (§1.2.1 snapshot-post-stale-authorization)"
    error_id: ERR_STALE_AUTHORIZATION_VERSION
    http_status: 412
    applies_to: "POST /distribution-snapshots"

  - rule_id: v-occ-review
    priority: 6
    category: concurrency
    check: "expected_review_version == CategoryReview.version (§1.2.1 review-decide-stale-review)"
    error_id: ERR_STALE_REVIEW_VERSION
    http_status: 412
    applies_to: "POST /category-reviews/{reviewId}/decide"

  - rule_id: v-state-precondition
    priority: 7
    category: state
    check: "The target resource is in a state from which the requested transition exists (§1.2), and companion resources are in the states the transition names: review.status, presentation.status, deal.state, authorization.authorization_state / settlement_state, promotion.state, deduction.settlement_state / dispute_state, principal.status, agreement.status, item.catalog_state"
    error_id: "ERR_INVALID_STATE | ERR_REVIEW_NOT_OPEN | ERR_REVIEW_NOT_DECIDED | ERR_PRESENTATION_NOT_ACCEPTED | ERR_PRESENTATION_DECLINED | ERR_PRINCIPAL_NOT_ACTIVE | ERR_PRINCIPAL_TERMINATED | ERR_AUTHORIZATION_NOT_AUTHORIZED | ERR_AUTHORIZATION_AT_RISK | ERR_DEDUCTION_ALREADY_SETTLED | ERR_SNAPSHOT_ALREADY_REVERSED"
    http_status: 409
    applies_to: "all action endpoints"

  - rule_id: v-accept-by-offeror
    priority: 7
    category: state
    check: "The accepting side is not the side that made the standing offer: RetailerBuyer may accept only when last_offer_side == BROKER, BrokerAccountManager only when last_offer_side == RETAILER"
    error_id: ERR_ACCEPT_BY_OFFEROR
    http_status: 409
    applies_to: "POST /slotting-deals/{dealId}/accept"

  - rule_id: v-review-submission-window
    priority: 8
    category: business_temporal
    check: "logical clock now < CategoryReview.submission_deadline when opening a review or submitting a presentation"
    error_id: ERR_REVIEW_SUBMISSION_CLOSED
    http_status: 422
    applies_to: "POST /category-reviews/{reviewId}/open, POST /presentations/{presentationId}/submit"

  - rule_id: v-review-decision-window
    priority: 8
    category: business_temporal
    check: "review_window_start <= logical clock date < review_window_end when deciding; and logical clock now >= submission_deadline when locking; and logical clock now < review_window_start when reopening"
    error_id: "ERR_REVIEW_WINDOW_CLOSED | ERR_SUBMISSION_WINDOW_STILL_OPEN | ERR_REVIEW_WINDOW_STARTED"
    http_status: 422
    applies_to: "POST /category-reviews/{reviewId}/decide, POST /category-reviews/{reviewId}/lock, POST /category-reviews/{reviewId}/reopen"

  - rule_id: v-dispute-window
    priority: 8
    category: business_temporal
    check: "logical clock date <= Deduction.deduction_date + Retailer.deduction_dispute_window_days (inclusive last day) when filing or refiling a post-audit claim"
    error_id: ERR_DISPUTE_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /deductions/{deductionId}/dispute"

  - rule_id: v-promo-window
    priority: 8
    category: business_temporal
    check: "window_start >= logical clock now when committing a promotion; logical clock now >= window_end when executing it"
    error_id: "ERR_PROMO_WINDOW_IN_PAST | ERR_PROMO_NOT_ELAPSED"
    http_status: 422
    applies_to: "POST /promotion-events/{promotionEventId}/commit, POST /promotion-events/{promotionEventId}/execute"

  - rule_id: v-principal-conflict
    priority: 9
    category: business_safety
    check: "No ACTIVE ConflictRule (matching category_code and scope) pairs the submitting principal with a principal that already holds a SUBMITTED or ACCEPTED presentation in the same review"
    error_id: ERR_PRINCIPAL_CONFLICT
    http_status: 409
    applies_to: "POST /presentations/{presentationId}/submit"

  - rule_id: v-category-exclusivity
    priority: 9
    category: business_safety
    check: "No other principal holds an ACTIVE, date-covering CommissionAgreement with exclusive_in_category == true for this (retailer, category_code)"
    error_id: ERR_CATEGORY_EXCLUSIVITY
    http_status: 409
    applies_to: "POST /presentations/{presentationId}/submit"

  - rule_id: v-segregation-of-duties
    priority: 9
    category: business_safety
    check: "The X-User-ID approving or denying a post-audit recovery differs from Deduction.filed_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /deductions/{deductionId}/approve-recovery, POST /deductions/{deductionId}/deny-recovery"

  - rule_id: v-substantiation
    priority: 9
    category: business_safety
    check: "Deduction.substantiation_doc_count >= MIN_SUBSTANTIATION_DOCS (2) before a recovery may be approved"
    error_id: ERR_SUBSTANTIATION_INSUFFICIENT
    http_status: 409
    applies_to: "POST /deductions/{deductionId}/approve-recovery"

  - rule_id: v-agreement-coverage
    priority: 10
    category: business_referential
    check: "An ACTIVE CommissionAgreement exists for (principal_id, retailer_id, category_code) whose half-open [effective_start_date, effective_end_date) window contains the logical clock date"
    error_id: ERR_NO_ACTIVE_COMMISSION_AGREEMENT
    http_status: 422
    applies_to: "POST /presentations/{presentationId}/submit, POST /slotting-deals/{dealId}/accept, GET /principals/{principalId}/commission-statement"

  - rule_id: v-catalog-validated
    priority: 10
    category: business_referential
    check: "Every referenced Item has catalog_state == VALIDATED (presentation submit, review decide) and gtin14 == '00' + upc with shelf_life_days >= 30 (catalog submission)"
    error_id: "ERR_ITEM_CATALOG_NOT_VALIDATED | ERR_CATALOG_GTIN_MISMATCH | ERR_CATALOG_SHELF_LIFE_TOO_SHORT"
    http_status: 422
    applies_to: "POST /presentations/{presentationId}/submit, POST /category-reviews/{reviewId}/decide, POST /items/{itemId}/catalog-submissions"

  - rule_id: v-award-membership
    priority: 10
    category: business_referential
    check: "Every authorized_item_ids element is an item listed by a SUBMITTED presentation of this review, and the item's principal is not TERMINATED"
    error_id: ERR_ITEM_NOT_IN_SUBMITTED_PRESENTATION
    http_status: 422
    applies_to: "POST /category-reviews/{reviewId}/decide"

  - rule_id: v-presentation-items-owned
    priority: 10
    category: business_referential
    check: "Every item in item_ids belongs to the presenting principal (item.principal_id == presentation.principal_id)"
    error_id: ERR_ITEM_PRINCIPAL_MISMATCH
    http_status: 422
    applies_to: "POST /presentations"

  - rule_id: v-duplicate-linkage
    priority: 10
    category: business_referential
    check: "reason_code == DUPLICATE_BILLBACK requires original_deduction_id referencing a different Deduction of the same (retailer_id, principal_id) with an equal amount_cents; reason_code == PROMO_BILLBACK requires promotion_event_id whose authorization belongs to the same principal and retailer"
    error_id: "ERR_DUPLICATE_LINK_INVALID | ERR_PROMO_LINK_INVALID"
    http_status: 422
    applies_to: "POST /deductions"

  - rule_id: v-uniqueness
    priority: 11
    category: business_constraint
    check: "Retailer.chain_code, Principal.code and Item.upc are globally unique; ConflictRule is unique per (category_code, unordered {principal_a_id, principal_b_id}, scope, retailer_id) and principal_a_id != principal_b_id; one Presentation per (review_id, principal_id); one POSTING DistributionSnapshot per (authorization_id, period_index)"
    error_id: "ERR_CHAIN_CODE_DUPLICATE | ERR_PRINCIPAL_CODE_DUPLICATE | ERR_UPC_DUPLICATE | ERR_CONFLICT_RULE_DUPLICATE | ERR_CONFLICT_RULE_SELF | ERR_PRESENTATION_DUPLICATE | ERR_PERIOD_ALREADY_POSTED"
    http_status: 409
    applies_to: "POST /retailers, POST /principals, POST /items, POST /conflict-rules, POST /presentations, POST /distribution-snapshots"

  - rule_id: v-agreement-overlap
    priority: 11
    category: business_constraint
    check: "Activating a CommissionAgreement must not produce two ACTIVE agreements for the same (principal_id, retailer_id, category_code) with overlapping half-open windows: violation iff new.effective_start_date < other.effective_end_date AND other.effective_start_date < new.effective_end_date. Exact adjacency (new.start == other.end) is legal."
    error_id: ERR_AGREEMENT_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /commission-agreements/{agreementId}/activate"

  - rule_id: v-review-blackout
    priority: 11
    category: business_constraint
    check: "A new CategoryReview for the same (retailer_id, category_code) must not fall inside an existing review's blackout-buffered window: violation iff new.review_window_start < other.review_window_end + review_blackout_days AND other.review_window_start - review_blackout_days < new.review_window_end (existing reviews with status == DECIDED still block)"
    error_id: ERR_REVIEW_BLACKOUT_CONFLICT
    http_status: 409
    applies_to: "POST /category-reviews"

  - rule_id: v-review-calendar-shape
    priority: 11
    category: business_constraint
    check: "review_window_start < review_window_end and submission_deadline < review_window_start at 00:00:00Z, and (on reopen) new_submission_deadline is strictly between now and review_window_start"
    error_id: ERR_REVIEW_CALENDAR_INVALID
    http_status: 409
    applies_to: "POST /category-reviews, POST /category-reviews/{reviewId}/reopen"

  - rule_id: v-demo-capacity
    priority: 11
    category: business_constraint
    check: "Committing a DEMO_SAMPLING event requires fewer than Retailer.max_concurrent_demos already-committed/executed DEMO_SAMPLING events on the same (retailer_id, store_code) whose windows, expanded by demo_changeover_buffer_minutes on both sides, intersect the requested window (half-open: touching buffered edges do NOT intersect)"
    error_id: ERR_DEMO_SLOT_CAPACITY
    http_status: 409
    applies_to: "POST /promotion-events/{promotionEventId}/commit"

  - rule_id: v-negotiation-bounds
    priority: 11
    category: business_constraint
    check: "round_index < MAX_NEGOTIATION_ROUNDS (3) on counter; a counter must be strictly higher and a re-proposal strictly lower than current_fee_per_store_cents; refile_count < MAX_REFILES (2) on refile; reopen_count < MAX_REVIEW_REOPENS (1) on reopen; store_count_in_scope <= Retailer.total_store_count; authorized_store_count <= Retailer.total_store_count; claim_amount_cents <= amount_cents"
    error_id: "ERR_NEGOTIATION_ROUNDS_EXHAUSTED | ERR_COUNTER_NOT_HIGHER | ERR_PROPOSAL_NOT_LOWER | ERR_REFILE_LIMIT_REACHED | ERR_REVIEW_REOPEN_LIMIT | ERR_STORE_COUNT_EXCEEDS_CHAIN | ERR_CLAIM_EXCEEDS_DEDUCTION"
    http_status: 409
    applies_to: "POST /slotting-deals/{dealId}/counter, POST /slotting-deals/{dealId}/propose, POST /deductions/{deductionId}/dispute, POST /category-reviews/{reviewId}/reopen, POST /slotting-deals, POST /category-reviews/{reviewId}/decide"

  - rule_id: v-snapshot-sequence
    priority: 11
    category: business_constraint
    check: "period_index == Authorization.periods_reported + 1 (strictly sequential, no gaps); distributed_store_count <= reported_store_count <= Authorization.authorized_store_count; only the highest-period live POSTING may be reversed"
    error_id: "ERR_PERIOD_OUT_OF_SEQUENCE | ERR_DISTRIBUTION_EXCEEDS_REPORTED | ERR_REPORTED_EXCEEDS_AUTHORIZED | ERR_SNAPSHOT_NOT_LATEST"
    http_status: 409
    applies_to: "POST /distribution-snapshots, POST /distribution-snapshots/{snapshotId}/reverse"

  - rule_id: v-review-slots
    priority: 12
    category: business_fiscal
    check: "count(authorized_item_ids) <= CategoryReview.slots_remaining"
    error_id: ERR_REVIEW_SLOTS_EXCEEDED
    http_status: 409
    applies_to: "POST /category-reviews/{reviewId}/decide"

  - rule_id: v-credit-posture
    priority: 12
    category: business_fiscal
    check: "Principal.credit_posture != RESTRICTED"
    error_id: ERR_PRINCIPAL_CREDIT_RESTRICTED
    http_status: 409
    applies_to: "POST /presentations/{presentationId}/submit, POST /slotting-deals/{dealId}/accept"

  - rule_id: v-slotting-budget
    priority: 12
    category: business_fiscal
    check: "Principal.slotting_committed_cents + SlottingDeal.quoted_fee_cents <= Principal.slotting_budget_cents"
    error_id: ERR_SLOTTING_BUDGET_EXCEEDED
    http_status: 409
    applies_to: "POST /slotting-deals/{dealId}/accept"

  - rule_id: v-funding-overrun
    priority: 12
    category: business_fiscal
    check: "actual_funding_cents <= floor(planned_funding_cents * FUNDING_TOLERANCE_BPS / 10000) with FUNDING_TOLERANCE_BPS = 11000 (110% of plan)"
    error_id: ERR_PROMO_FUNDING_OVERRUN
    http_status: 409
    applies_to: "POST /promotion-events/{promotionEventId}/execute"

# =============================================================================
# §1.5 API Endpoint Table (64 endpoints, flat peer collections)
# Header contract on every endpoint: X-User-Role + X-User-ID.
# =============================================================================
endpoints:
  # ---------------------------------------------------------------- Retailers
  - method: POST
    path: "/retailers"
    description: "Register a retail chain with its void-rate basis default, at-risk threshold, dispute window, demo buffer/capacity and review blackout policy."
    roles: [BrokerAdmin]
    code: 201
    input: [name, chain_code, total_store_count, "void_rate_basis_default?", "at_risk_void_rate_bps?", "deduction_dispute_window_days?", "demo_changeover_buffer_minutes?", "max_concurrent_demos?", "review_blackout_days?"]
