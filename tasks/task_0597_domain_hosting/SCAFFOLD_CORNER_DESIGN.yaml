scaffold_corner_design:

  # =========================================================================
  # Entities
  # =========================================================================
  - section: entities
    instances:
      - name: create_account_applies_defaults_and_system_fields
        claim_type: defaults
        grounds:
          - entities.Account.fields.status
          - entities.Account.fields.credit_balance_cents
          - entities.Account.fields.auto_renew_default
          - endpoints[POST /registrar/accounts]
        distinguishing_aspect: "A freshly created Account returns status ACTIVE, payment_method_on_file false, credit_balance_cents 0, net_cash_cents 0, risk_score 0, auto_renew_default true, version 1 and a server-minted UUID id with no type prefix."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /registrar/accounts"
              payload: { email: "new@corp.example", company_name: "Corp Example" }
              as: Anonymous
              captures: { acct_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Account.${acct_id}.status == 'ACTIVE'"
            - "Account.${acct_id}.payment_method_on_file == false and payment_method_token is null"
            - "Account.${acct_id}.credit_balance_cents == 0 and net_cash_cents == 0 and risk_score == 0"
            - "Account.${acct_id}.auto_renew_default == true (default applied when omitted)"
            - "Account.${acct_id}.version == 1 and id matches the bare-UUID format (no 'acct_' prefix)"
            - "response envelope has meta.api_request_id, meta.api_request_timestamp and response_type == 'object'"

      - name: get_domain_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_DOMAIN_NOT_FOUND]
          - validations[priority=4]
          - endpoints[GET /registrar/domains/{domain_id}]
        distinguishing_aspect: "A GET on a well-formed but unregistered domain UUID returns 404 ERR_DOMAIN_NOT_FOUND with the error envelope, not an empty 200."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /registrar/domains/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: SupportAgent
              as_user_id: "support-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "error_id == 'ERR_DOMAIN_NOT_FOUND' and response_type == 'error'"

      - name: register_domain_missing_required_field_invalid_request
        claim_type: required_fields
        grounds:
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
          - endpoints[POST /registrar/domains]
        distinguishing_aspect: "POST /domains without term_years (a required input with no default) returns 400 ERR_INVALID_REQUEST and creates no Domain and no Invoice."
        test_recipe:
          setup: ["One account with a card on file."]
          setup_api_calls:
            - call: "POST /registrar/accounts"
              payload: { email: "req@corp.example", company_name: "Corp Example" }
              as: Anonymous
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /registrar/domains"
              payload: { account_id: "${acct_id}", domain_name: "example", tld: "com", registrant_name: "Ada L", registrant_email: "ada@corp.example" }
              as: Registrant
              as_user_id: "${acct_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "error_id == 'ERR_INVALID_REQUEST'"
            - "GET /registrar/domains?account_id=${acct_id} returns total_count == 0"
            - "GET /registrar/invoices?account_id=${acct_id} returns total_count == 0"

      - name: invalid_tld_enum_value_rejected
        claim_type: type_constraints
        grounds:
          - entities.Domain.fields.tld
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "tld is a closed enum {com, net, io, xyz}; 'org' is rejected with 400 ERR_INVALID_REQUEST rather than silently priced."
        test_recipe:
          setup: ["One account."]
          setup_api_calls:
            - call: "POST /registrar/accounts"
              payload: { email: "enum@corp.example", company_name: "Corp Example" }
              as: Anonymous
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /registrar/domains"
              payload: { account_id: "${acct_id}", domain_name: "example", tld: "org", term_years: 1, registrant_name: "Ada L", registrant_email: "ada@corp.example" }
              as: Registrant
              as_user_id: "${acct_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400 and error_id == 'ERR_INVALID_REQUEST'"

      - name: domain_computed_fields_are_server_owned
        claim_type: computed_fields
        grounds:
          - entities.Domain.fields.lifecycle_status
          - entities.Domain.fields.is_premium
          - entities.Domain.fields.fqdn
          - entities.Domain.fields.epp_auth_code
        distinguishing_aspect: "At registration the server sets lifecycle_status PENDING_PAYMENT, lock_status LOCKED, fqdn 'example.com', is_premium false, registered_at null and epp_auth_code null — none of them can be supplied by the client (the endpoint's input list does not accept them)."
        test_recipe:
          setup: ["One account with a card on file."]
          setup_api_calls:
            - call: "POST /registrar/accounts"
              payload: { email: "comp@corp.example", company_name: "Corp Example" }
              as: Anonymous
              captures: { acct_id: $.data.id }
            - call: "POST /registrar/accounts/${acct_id}/payment-method"
              payload: { card_token: "tok_visa_4242" }
              as: Registrant
              as_user_id: "${acct_id}"
          trigger:
            - call: "POST /registrar/domains"
              payload: { account_id: "${acct_id}", domain_name: "example", tld: "com", term_years: 1, registrant_name: "Ada L", registrant_email: "ada@corp.example" }
              as: Registrant
              as_user_id: "${acct_id}"
              captures: { dom_id: $.data.id }
          assert:
            - "Domain.${dom_id}.lifecycle_status == 'PENDING_PAYMENT' and lock_status == 'LOCKED'"
            - "Domain.${dom_id}.fqdn == 'example.com' and is_premium == false"
            - "Domain.${dom_id}.registered_at is null, expires_at is null, epp_auth_code is null"
            - "Domain.${dom_id}.whois_privacy_enabled == false (default) and auto_renew_enabled == true (copied from Account.auto_renew_default)"

      - name: list_domains_pagination_envelope_and_filter
        claim_type: listing
        grounds:
          - endpoints[GET /registrar/domains]
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /domains?account_id=..&limit=1&offset=1 returns response_type 'array' with limit 1, offset 1, total_count 2, has_more false, and the second domain in created_at ASC order."
        test_recipe:
          setup: ["One account with two PENDING_PAYMENT domains: example.com created first, shop.net second."]
          setup_api_calls:
            - call: "POST /registrar/accounts"
              payload: { email: "page@corp.example", company_name: "Corp Example" }
              as: Anonymous
              captures: { acct_id: $.data.id }
            - call: "POST /registrar/domains"
              payload: { account_id: "${acct_id}", domain_name: "example", tld: "com", term_years: 1, registrant_name: "Ada L", registrant_email: "ada@corp.example" }
              as: Registrant
              as_user_id: "${acct_id}"
              captures: { d1_id: $.data.id }
            - call: "POST /registrar/domains"
              payload: { account_id: "${acct_id}", domain_name: "shop", tld: "net", term_years: 1, registrant_name: "Ada L", registrant_email: "ada@corp.example" }
              as: Registrant
              as_user_id: "${acct_id}"
              captures: { d2_id: $.data.id }
          trigger:
            - call: "GET /registrar/domains"
              payload: { account_id: "${acct_id}", limit: 1, offset: 1 }
              as: Registrant
              as_user_id: "${acct_id}"
          assert:
            - "response_type == 'array'; meta pagination limit == 1, offset == 1, total_count == 2, has_more == false"
            - "data[0].id == '${d2_id}' (created_at ASC ordering, never id ordering)"

      - name: whois_privacy_masks_registrant_fields_for_anonymous
        claim_type: computed_fields
        grounds:
          - entities.Domain.fields.whois_privacy_enabled
          - entities.Domain.fields.registrant_email
          - endpoints[GET /registrar/domains/{domain_id}]
        distinguishing_aspect: "With whois_privacy_enabled true, an Anonymous GET returns registrant_name 'REDACTED FOR PRIVACY', registrant_email 'privacy@proxy.example' and epp_auth_code null, while the owning Registrant sees the real values."
        test_recipe:
          setup: ["An ACTIVE budgetsite.xyz domain registered with whois_privacy true."]
          setup_api_calls:
            - call: "POST /registrar/accounts"
              payload: { email: "priv@corp.example", company_name: "Corp Example" }
              as: Anonymous
              captures: { acct_id: $.data.id }
            - call: "POST /registrar/accounts/${acct_id}/payment-method"
              payload: { card_token: "tok_visa_4242" }
              as: Registrant
              as_user_id: "${acct_id}"
            - call: "POST /registrar/domains"
              payload: { account_id: "${acct_id}", domain_name: "budgetsite", tld: "xyz", term_years: 1, registrant_name: "Ada Lovelace", registrant_email: "ada@corp.example", whois_privacy: true, auto_renew: false }
              as: Registrant
              as_user_id: "${acct_id}"
              captures: { dom_id: $.data.id }
            - call: "GET /registrar/invoices"
              payload: { account_id: "${acct_id}", status: "ISSUED" }
              as: Registrant
              as_user_id: "${acct_id}"
              captures: { inv_id: "$.data[0].id" }
            - call: "POST /registrar/invoices/${inv_id}/pay"
              payload: { use_credit: false }
              as: Registrant
              as_user_id: "${acct_id}"
          trigger:
            - call: "GET /registrar/domains/${dom_id}"
              payload: {}
              as: Anonymous
            - call: "GET /registrar/domains/${dom_id}"
              payload: {}
              as: Registrant
              as_user_id: "${acct_id}"
          assert:
            - "Anonymous view: registrant_name == 'REDACTED FOR PRIVACY', registrant_email == 'privacy@proxy.example', epp_auth_code is null"
            - "Registrant view: registrant_name == 'Ada Lovelace', registrant_email == 'ada@corp.example', epp_auth_code is a non-null 16-character string"

  # =========================================================================
  # State machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: reinstate_an_active_domain_returns_invalid_domain_state
        claim_type: invalid_transition
        grounds:
          - validations[priority=22]
          - errors[ERR_INVALID_DOMAIN_STATE]
          - endpoints[POST /registrar/domains/{domain_id}/reinstate]
        distinguishing_aspect: "Reinstate is only legal from SUSPENDED; calling it on an ACTIVE domain returns 409 ERR_INVALID_DOMAIN_STATE and fires no side effects."
        test_recipe:
          setup: ["An ACTIVE example.com domain."]
          setup_api_calls:
            - call: "POST /registrar/accounts"
              payload: { email: "rein@corp.example", company_name: "Corp Example" }
              as: Anonymous
              captures: { acct_id: $.data.id }
            - call: "POST /registrar/accounts/${acct_id}/payment-method"
              payload: { card_token: "tok_visa_4242" }
              as: Registrant
              as_user_id: "${acct_id}"
            - call: "POST /registrar/domains"
              payload: { account_id: "${acct_id}", domain_name: "example", tld: "com", term_years: 1, registrant_name: "Ada L", registrant_email: "ada@corp.example", auto_renew: false }
              as: Registrant
              as_user_id: "${acct_id}"
              captures: { dom_id: $.data.id }
            - call: "GET /registrar/invoices"
              payload: { account_id: "${acct_id}", status: "ISSUED" }
              as: Registrant
              as_user_id: "${acct_id}"
              captures: { inv_id: "$.data[0].id" }
            - call: "POST /registrar/invoices/${inv_id}/pay"
              payload: { use_credit: false }
              as: Registrant
              as_user_id: "${acct_id}"
          trigger:
            - call: "POST /registrar/domains/${dom_id}/reinstate"
              payload: { reason: "customer asked" }
              as: SupportAgent
              as_user_id: "support-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409 and error_id == 'ERR_INVALID_DOMAIN_STATE'"
            - "Domain.${dom_id}.lifecycle_status == 'ACTIVE' and suspension_reason is null"

      - name: uphold_an_open_report_without_review_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.AbuseReport.OPEN_to_UNDER_REVIEW
          - validations[priority=27]
          - errors[ERR_ABUSE_REPORT_INVALID_STATE]
        distinguishing_aspect: "UPHELD is only reachable from UNDER_REVIEW; upholding a report still in OPEN returns 409 ERR_ABUSE_REPORT_INVALID_STATE and suspends nothing."
        test_recipe:
          setup: ["An ACTIVE example.com domain with one OPEN abuse report."]
          setup_api_calls:
            - call: "POST /registrar/accounts"
              payload: { email: "open@corp.example", company_name: "Corp Example" }
              as: Anonymous
              captures: { acct_id: $.data.id }
            - call: "POST /registrar/accounts/${acct_id}/payment-method"
              payload: { card_token: "tok_visa_4242" }
              as: Registrant
              as_user_id: "${acct_id}"
            - call: "POST /registrar/domains"
              payload: { account_id: "${acct_id}", domain_name: "example", tld: "com", term_years: 1, registrant_name: "Ada L", registrant_email: "ada@corp.example", auto_renew: false }
              as: Registrant
              as_user_id: "${acct_id}"
              captures: { dom_id: $.data.id }
            - call: "GET /registrar/invoices"
              payload: { account_id: "${acct_id}", status: "ISSUED" }
              as: Registrant
              as_user_id: "${acct_id}"
              captures: { inv_id: "$.data[0].id" }
            - call: "POST /registrar/invoices/${inv_id}/pay"
              payload: { use_credit: false }
              as: Registrant
              as_user_id: "${acct_id}"
            - call: "POST /registrar/abuse-reports"
              payload: { domain_id: "${dom_id}", category: "MALWARE", severity: "CRITICAL", reporter_email: "watch@ngo.example" }
              as: Anonymous
              captures: { rep_id: $.data.id }
          trigger:
            - call: "POST /registrar/abuse-reports/${rep_id}/uphold"
              payload: { decision_note: "skip the review" }
              as: AbuseAnalyst
              as_user_id: "analyst-2"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409 and error_id == 'ERR_ABUSE_REPORT_INVALID_STATE'"
            - "AbuseReport.${rep_id}.status == 'OPEN' and decider_user_id is null"
            - "Domain.${dom_id}.lifecycle_status == 'ACTIVE' and Account.${acct_id}.risk_score == 0"

      - name: closing_an_already_closed_billing_period_rejected
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.BillingPeriod.OPEN_to_CLOSED
          - validations[priority=26]
          - errors[ERR_PERIOD_ALREADY_CLOSED]
        distinguishing_aspect: "CLOSED is terminal for BillingPeriod; a second close returns 409 ERR_PERIOD_ALREADY_CLOSED and does not raise a second overage invoice."
        test_recipe:
          setup: ["An ACTIVE DELUXE subscription whose first BillingPeriod [2026-05-01, 2026-05-31) has already been closed with zero usage."]
          setup_api_calls:
            - call: "POST /registrar/hosting-plans"
              payload: { plan_code: "DLX-C1", tier: "DELUXE", storage_quota_mb: 5120, bandwidth_quota_mb: 10240, monthly_price_cents: 4999, included_mailboxes: 5, included_ssl: true, overage_rate_cents_per_gb: 200 }
              as: BillingAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /registrar/accounts"
              payload: { email: "close@corp.example", company_name: "Corp Example" }
              as: Anonymous
              captures: { acct_id: $.data.id }
            - call: "POST /registrar/accounts/${acct_id}/payment-method"
              payload: { card_token: "tok_visa_4242" }
              as: Registrant
              as_user_id: "${acct_id}"
            - call: "POST /registrar/hosting-subscriptions"
              payload: { account_id: "${acct_id}", plan_id: "${plan_id}" }
              as: Registrant
              as_user_id: "${acct_id}"
              captures: { sub_id: $.data.id }
            - call: "GET /registrar/invoices"
              payload: { account_id: "${acct_id}", status: "ISSUED" }
              as: Registrant
              as_user_id: "${acct_id}"
              captures: { inv_sub: "$.data[0].id" }
            - call: "POST /registrar/invoices/${inv_sub}/pay"
              payload: { use_credit: false }
              as: Registrant
              as_user_id: "${acct_id}"
            - call: "GET /registrar/hosting-subscriptions/${sub_id}/billing-periods"
              payload: {}
              as: BillingAdmin
              captures: { p0_id: "$.data[0].id" }
            - call: "POST /registrar/billing-periods/${p0_id}/close"
              payload: {}
              as: BillingAdmin
          trigger:
            - call: "POST /registrar/billing-periods/${p0_id}/close"
              payload: {}
              as: BillingAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409 and error_id == 'ERR_PERIOD_ALREADY_CLOSED'"
            - "BillingPeriod.${p0_id}.status == 'CLOSED' and final_overage_cents == 0"
            - "GET /registrar/invoices?account_id=${acct_id}&billing_period_id=${p0_id} returns total_count == 0 (no overage invoice was raised, and no second one either)"

      - name: transfer_request_reaches_failed_after_third_rejection
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.TransferRequest.PENDING_ACK_to_FAILED
          - validations[priority=68]
          - errors[ERR_TRANSFER_MAX_ATTEMPTS]
          - entities.TransferRequest.fields.attempt_count
        distinguishing_aspect: "After the third submit is rejected (attempt_count == 3 == MAX_TRANSFER_ATTEMPTS) the request lands in the terminal FAILED state, and a further retry returns 409 ERR_TRANSFER_MAX_ATTEMPTS."
        test_recipe:
          setup: ["An account and an inbound TransferRequest for acquired.net in INITIATED."]
          setup_api_calls:
            - call: "POST /registrar/accounts"
              payload: { email: "fail@corp.example", company_name: "Corp Example" }
              as: Anonymous
              captures: { acct_id: $.data.id }
            - call: "POST /registrar/transfer-requests"
              payload: { account_id: "${acct_id}", direction: "IN", domain_name: "acquired", tld: "net", epp_auth_code: "EPP-1" }
              as: Registrant
              as_user_id: "${acct_id}"
              captures: { tr_id: $.data.id }
            - call: "POST /registrar/transfer-requests/${tr_id}/submit"
              payload: {}
              as: Registrant
              as_user_id: "${acct_id}"
            - call: "POST /registrar/transfer-requests/${tr_id}/registry-response"
              payload: { outcome: "REJECTED", reason: "bad auth" }
              as: PlatformAdmin
            - call: "POST /registrar/transfer-requests/${tr_id}/retry"
              payload: { epp_auth_code: "EPP-2" }
              as: Registrant
              as_user_id: "${acct_id}"
            - call: "POST /registrar/transfer-requests/${tr_id}/submit"
              payload: {}
              as: Registrant
              as_user_id: "${acct_id}"
            - call: "POST /registrar/transfer-requests/${tr_id}/registry-response"
              payload: { outcome: "REJECTED", reason: "bad auth" }
              as: PlatformAdmin
            - call: "POST /registrar/transfer-requests/${tr_id}/retry"
              payload: { epp_auth_code: "EPP-3" }
              as: Registrant
              as_user_id: "${acct_id}"
            - call: "POST /registrar/transfer-requests/${tr_id}/submit"
              payload: {}
              as: Registrant
              as_user_id: "${acct_id}"
          trigger:
            - call: "POST /registrar/transfer-requests/${tr_id}/registry-response"
              payload: { outcome: "REJECTED", reason: "final rejection" }
              as: PlatformAdmin
            - call: "POST /registrar/transfer-requests/${tr_id}/retry"
              payload: { epp_auth_code: "EPP-4" }
              as: Registrant
              as_user_id: "${acct_id}"
              captures: { err: $.data.error_id }
          assert:
            - "TransferRequest.${tr_id}.attempt_count == 3"
            - "TransferRequest.${tr_id}.status == 'FAILED' after the third rejection (attempt_count >= MAX_TRANSFER_ATTEMPTS)"
            - "the retry: HTTP status == 409 and error_id == 'ERR_TRANSFER_MAX_ATTEMPTS'"
            - "TransferRequest.${tr_id}.status is still 'FAILED'"

      - name: sweep_auto_renews_a_domain_with_auto_renew_and_a_card
        claim_type: valid_transition
        grounds:
          - state_machines.Domain.lifecycle_status.ACTIVE_to_ACTIVE
          - calculations.domain_expiry_sweep
          - entities.Domain.fields.auto_renew_enabled
        distinguishing_aspect: "The sweep's auto-renew branch keeps the domain ACTIVE, extends expires_at by exactly 365 days to 2028-04-30 and settles a 1298-cent renewal invoice immediately, so expired_count is 0 and auto_renewed_count is 1."
        test_recipe:
          setup: ["Account with a card; example.com ACTIVE since 2026-05-01 with auto_renew_enabled true (expires_at 2027-05-01)."]
          setup_api_calls:
            - call: "POST /registrar/accounts"
              payload: { email: "auto@corp.example", company_name: "Corp Example" }
              as: Anonymous
              captures: { acct_id: $.data.id }
            - call: "POST /registrar/accounts/${acct_id}/payment-method"
              payload: { card_token: "tok_visa_4242" }
              as: Registrant
              as_user_id: "${acct_id}"
            - call: "POST /registrar/domains"
              payload: { account_id: "${acct_id}", domain_name: "example", tld: "com", term_years: 1, registrant_name: "Ada L", registrant_email: "ada@corp.example", auto_renew: true }
              as: Registrant
              as_user_id: "${acct_id}"
              captures: { dom_id: $.data.id }
            - call: "GET /registrar/invoices"
              payload: { account_id: "${acct_id}", status: "ISSUED" }
              as: Registrant
              as_user_id: "${acct_id}"
              captures: { inv_id: "$.data[0].id" }
            - call: "POST /registrar/invoices/${inv_id}/pay"
              payload: { use_credit: false }
              as: Registrant
              as_user_id: "${acct_id}"
            - call: "POST /registrar/_clock/set_current_utc"
              payload: { to_iso8601: "2027-05-02T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /registrar/_ops/run-expiry-sweep"
              payload: {}
              as: PlatformAdmin
          assert:
            - "sweep response auto_renewed_count == 1 and expired_count == 0"
            - "Domain.${dom_id}.lifecycle_status == 'ACTIVE'"
            - "Domain.${dom_id}.expires_at == '2028-04-30T00:00:00.000Z' (2027-05-01 + 365 days)"
            - "GET /registrar/invoices?account_id=${acct_id}&status=PAID returns total_count == 2 (the registration invoice and the auto-settled 1298-cent renewal invoice)"

      - name: sweep_ladder_carries_an_expired_domain_all_the_way_to_deleted
        claim_type: valid_transition
        grounds:
          - calculations.domain_expiry_sweep
          - state_machines.Domain.lifecycle_status.REDEMPTION_to_PENDING_DELETE
          - state_machines.Domain.lifecycle_status.PENDING_DELETE_to_DELETED
          - state_machines.HostingSubscription.ACTIVE_to_CANCELLED
        distinguishing_aspect: "A single sweep run at 2027-07-06 (expires_at + 66 days) walks the whole ladder ACTIVE -> EXPIRED -> REDEMPTION -> PENDING_DELETE -> DELETED, cancels the domain's add-ons and its primary subscription, and frees the fqdn for re-registration."
        test_recipe:
          setup:
            - "Account with a card; example.com ACTIVE since 2026-05-01, auto_renew disabled, expires_at 2027-05-01."
