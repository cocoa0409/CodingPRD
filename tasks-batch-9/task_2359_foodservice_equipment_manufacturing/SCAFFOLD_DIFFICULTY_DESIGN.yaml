            - call: "POST /warranty-claims"
              payload: { connected_unit_id: "${unit_id}", service_partner_id: "${sp_id}", technician_certification_id: "${tc1_id}", claim_code: "CLM-B", parts_cost_cents: 50000, labor_hours: 1.0 }
              as: ServicePartnerUser
              as_user_id: "${sp_id}"
              captures: { err_low: $.data.error_id }
          assert:
