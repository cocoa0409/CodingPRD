  - { method: POST, path: "/api/transfer-requests/{id}/set_status", description: "Review workflow (UNDER_REVIEW | INFO_REQUESTED | APPROVED | REJECTED | WITHDRAWN); fee computed entering UNDER_REVIEW; fee invoice on APPROVED", roles: [PremiumSalesRep, AccountHolder, StadiumAdmin], code: 200, input: [target_status], output: TransferRequest, side_effects: ["see TransferRequest machine"] }
