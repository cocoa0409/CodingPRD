        distinguishing_aspect: "Child remedies bubble up two levels and only the LAST one flips the parents: after the first remedy the build still has recall_hold true and the order still reads RECALL_HOLD, after the second both clear, and only then does close succeed — a close attempted at remedied 1 of 2 is ERR_CAMPAIGN_NOT_CLOSEABLE."
        test_recipe:
