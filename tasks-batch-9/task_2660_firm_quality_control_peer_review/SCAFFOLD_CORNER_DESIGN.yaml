            - *k_insp_select
          assert:
            - "HTTP 200"
            - "data.state == \"SELECTION_COMPLETE\" and data.engagements_selected_count == 1"
            - "data.must_select_eligible_count == 0 and data.must_select_selected_count == 0"
            - "data.must_select_coverage_pct == 100.00"
            - "a follow-up GET /inspection-selections?inspection_id=${insp_id} returns exactly one row whose engagement_id == ${eng_id}"
            - "a follow-up GET /partners/${ep_id} returns last_inspected_year == 2026"

      - name: residual_risk_diverges_between_design_and_operating_basis
        claim_type: Variant Divergence
        grounds:
          - calculations.residual_risk_score.variants
          - complexity_profile.complexity_layers.dual_variant_calculation
        distinguishing_aspect: >-
          Two structurally identical risks (inherent 25, three TESTED responses all
          EFFECTIVE) diverge by variant. DESIGN_BASIS is additive and capped:
          mitigation 3*0.35 = 1.05 -> min(0.80, 1.05) = 0.80, residual
          round(25*0.20, 2) = 5.00 -> MODERATE. OPERATING_BASIS folds
          multiplicatively and is uncapped: 25*0.70*0.70*0.70 = 8.575 ->
          round_half_up 8.58 -> HIGH. The bands differ, so an implementation that
          shares one code path (or forgets the 0.80 cap, giving -1.25) fails.
        test_recipe:
          setup:
            - "Two quality risks in different SQM components, each with three responses that have all been tested EFFECTIVE/EFFECTIVE."
          setup_api_calls:
            - *k_clock
            - *k_firm
            - *k_qcd
            - *k_risk_a
            - &k_resp_a1
              call: "POST /quality-risks/${risk_a_id}/responses"
              payload: { response_type: "PREVENTIVE", description: "Mandatory second-partner review of all significant estimate workpapers." }
              as: QualityControlDirector
              as_user_id: "${qcd_id}"
              captures: { resp_a1_id: "$.data.id" }
            - &k_test_a1
              call: "POST /risk-responses/${resp_a1_id}/effectiveness-tests"
              payload: { design_effectiveness: "EFFECTIVE", operating_effectiveness: "EFFECTIVE" }
              as: QualityControlDirector
              as_user_id: "${qcd_id}"
            - call: "POST /quality-risks/${risk_a_id}/responses"
              payload: { response_type: "DETECTIVE", description: "Quarterly monitoring sample of estimate documentation." }
              as: QualityControlDirector
              as_user_id: "${qcd_id}"
              captures: { resp_a2_id: "$.data.id" }
            - call: "POST /risk-responses/${resp_a2_id}/effectiveness-tests"
              payload: { design_effectiveness: "EFFECTIVE", operating_effectiveness: "EFFECTIVE" }
              as: QualityControlDirector
              as_user_id: "${qcd_id}"
            - call: "POST /quality-risks/${risk_a_id}/responses"
              payload: { response_type: "PREVENTIVE", description: "Annual specialist training on estimate audit procedures." }
              as: QualityControlDirector
              as_user_id: "${qcd_id}"
              captures: { resp_a3_id: "$.data.id" }
            - call: "POST /risk-responses/${resp_a3_id}/effectiveness-tests"
              payload: { design_effectiveness: "EFFECTIVE", operating_effectiveness: "EFFECTIVE" }
              as: QualityControlDirector
              as_user_id: "${qcd_id}"
            - call: "POST /quality-risks/${risk_a_id}/evaluations"
              payload: { basis: "DESIGN_BASIS" }
              as: QualityControlDirector
              as_user_id: "${qcd_id}"
            - &k_risk_b
              call: "POST /firms/${firm_id}/quality-risks"
              payload:
                component: "RESOURCES"
                quality_objective_code: "RES-01"
                risk_statement: "Staffing levels may be insufficient for peak-season engagement supervision."
                likelihood: 5
                impact: 5
              as: QualityControlDirector
              as_user_id: "${qcd_id}"
              captures: { risk_b_id: "$.data.id" }
            - call: "POST /quality-risks/${risk_b_id}/responses"
              payload: { response_type: "PREVENTIVE", description: "Capacity model reviewed before every busy season." }
              as: QualityControlDirector
              as_user_id: "${qcd_id}"
              captures: { resp_b1_id: "$.data.id" }
            - call: "POST /risk-responses/${resp_b1_id}/effectiveness-tests"
              payload: { design_effectiveness: "EFFECTIVE", operating_effectiveness: "EFFECTIVE" }
              as: QualityControlDirector
              as_user_id: "${qcd_id}"
            - call: "POST /quality-risks/${risk_b_id}/responses"
              payload: { response_type: "DETECTIVE", description: "Monthly utilisation exception report to the QC director." }
              as: QualityControlDirector
              as_user_id: "${qcd_id}"
              captures: { resp_b2_id: "$.data.id" }
            - call: "POST /risk-responses/${resp_b2_id}/effectiveness-tests"
              payload: { design_effectiveness: "EFFECTIVE", operating_effectiveness: "EFFECTIVE" }
              as: QualityControlDirector
              as_user_id: "${qcd_id}"
            - call: "POST /quality-risks/${risk_b_id}/responses"
              payload: { response_type: "PREVENTIVE", description: "Contract reviewer bench retained for overflow supervision." }
              as: QualityControlDirector
              as_user_id: "${qcd_id}"
              captures: { resp_b3_id: "$.data.id" }
            - call: "POST /risk-responses/${resp_b3_id}/effectiveness-tests"
              payload: { design_effectiveness: "EFFECTIVE", operating_effectiveness: "EFFECTIVE" }
              as: QualityControlDirector
              as_user_id: "${qcd_id}"
          trigger:
            - call: "POST /quality-risks/${risk_b_id}/evaluations"
              payload: { basis: "OPERATING_BASIS" }
              as: QualityControlDirector
              as_user_id: "${qcd_id}"
          assert:
            - "HTTP 200"
            - "data.residual_risk_score == 8.58 and data.severity_band == \"HIGH\""
            - "data.evaluation_basis == \"OPERATING_BASIS\" and data.state == \"EVALUATED\""
            - "a follow-up GET /quality-risks/${risk_a_id} returns residual_risk_score == 5.00, severity_band == \"MODERATE\", evaluation_basis == \"DESIGN_BASIS\""
            - "a follow-up GET /firms/${firm_id} returns critical_risk_count == 0 and risk_posture == \"STABLE\""

      - name: deficiency_severity_index_firm_pervasive_adds_systemic_bonus
        claim_type: Variant Selection
        grounds:
          - calculations.deficiency_severity_index.variants
          - state_machines.InternalInspection.IN_PROGRESS_to_FINDINGS_CLASSIFIED
        distinguishing_aspect: >-
          severity_index_basis is chosen by the request body, and FIRM_PERVASIVE
          must ignore is_must_select entirely: one SYSTEMIC DEFICIENCY in
          ENGAGEMENT_PERFORMANCE gives (max comp_points 3 + 5*1 systemic) /
          max(1, 1 distinct component) = 8.00, whereas the ENGAGEMENT_WEIGHTED
          variant on the same data would give 3 * 1.5 / 1 = 4.50. Picking the
          wrong variant, or applying the must-select multiplier under
          FIRM_PERVASIVE, is caught.
        test_recipe:
          setup:
            - "Inspection cycle IN_PROGRESS with one selection carrying a single SYSTEMIC DEFICIENCY finding."
          setup_api_calls:
            - *k_clock
            - *k_firm
            - *k_mp
            - *k_ep
            - *k_qcd
            - *k_eng
            - *k_eng_fw
            - *k_eng_eqrp
            - *k_eng_cleared
            - *k_eng_released
            - *k_insp
            - *k_insp_select
            - *k_sel_lookup
            - *k_insp_inprog
            - *k_finding
            - &k_classify_systemic
              call: "POST /inspection-findings/${finding_id}/classification"
              payload: { classification: "DEFICIENCY", pervasiveness: "SYSTEMIC", affects_report_conclusion: false }
              as: QualityControlDirector
              as_user_id: "${qcd_id}"
          trigger:
            - &k_insp_classified_fp
              call: "POST /internal-inspections/${insp_id}/transitions"
              payload: { to_state: "FINDINGS_CLASSIFIED", severity_index_basis: "FIRM_PERVASIVE" }
              as: QualityControlDirector
              as_user_id: "${qcd_id}"
          assert:
            - "HTTP 200"
            - "data.state == \"FINDINGS_CLASSIFIED\" and data.severity_index_basis == \"FIRM_PERVASIVE\""
            - "data.deficiency_severity_index == 8.00 (not 4.50)"
            - "a follow-up GET /inspection-selections?inspection_id=${insp_id} returns data[0].weighted_points == 0.00 (the declared default; only ENGAGEMENT_WEIGHTED writes per-selection points)"

      - name: inspection_selection_waterfall_overrides_the_target_count
        claim_type: Correct Result
        grounds:
          - calculations.inspection_engagement_selection
          - calculations.must_select_coverage_pct
        distinguishing_aspect: >-
          target_engagement_count is 1, yet blocks A and B are both mandatory:
          the released ERISA_AUDIT lands in A at rank 1 with reason
          MUST_SELECT_ERISA_AUDIT, then the never-inspected partner's remaining
          engagement lands in B at rank 2 with MUST_SELECT_PARTNER_COVERAGE, and
          block C fills max(0, 1 - 1 - 1) = 0 rows. Coverage counts only block A
          in the numerator: 1/1 -> 100.00.
        test_recipe:
          setup:
            - "Firm with two released engagements (one REVIEW, one ERISA_AUDIT) sharing one engagement partner, and a 2026 cycle targeting a single engagement."
          setup_api_calls:
            - *k_clock
            - *k_firm
            - *k_mp
            - *k_ep
            - *k_qcd
            - *k_eqrp
            - *k_eng
            - *k_eng_fw
            - *k_eng_eqrp
            - *k_eng_cleared
            - *k_eng_released
            - *k_eng2
            - *k_eng2_fw
            - *k_eqr
            - *k_eqr_start
            - *k_eng2_eqrp
            - *k_eqr_concur
            - *k_eng2_cleared
            - *k_eng2_released
            - *k_insp
          trigger:
            - *k_insp_select
          assert:
            - "HTTP 200"
            - "data.engagements_selected_count == 2 (target_engagement_count 1 is overridden)"
            - "data.must_select_eligible_count == 1 and data.must_select_selected_count == 1"
            - "data.must_select_coverage_pct == 100.00 and data.state == \"SELECTION_COMPLETE\""
            - "a follow-up GET /inspection-selections?inspection_id=${insp_id} returns two rows: the row with engagement_id == ${eng2_id} has selected_rank == 1, selection_reason == \"MUST_SELECT_ERISA_AUDIT\", is_must_select == true; the row with engagement_id == ${eng_id} has selected_rank == 2, selection_reason == \"MUST_SELECT_PARTNER_COVERAGE\", is_must_select == true"

      - name: root_cause_depth_score_saturates_at_the_declared_cap
        claim_type: Precision
        grounds:
          - calculations.root_cause_depth_score
        distinguishing_aspect: >-
          2*5 factors + FISHBONE 3 = 13 raw, clamped by DEPTH_CAP to 10 and
          stored with two decimals as 10.00. recurrence_flag is false because no
          VALIDATED analysis of the same root_cause_category exists in 2024/2025,
          so the +2 recurrence bonus never even enters the sum — an
          implementation that clamps before the method bonus, or stores the
          integer 10 instead of 10.00, fails.
        test_recipe:
          setup:
            - "Classified DEFICIENCY finding with a DRAFTED five-factor FISHBONE root cause analysis."
          setup_api_calls:
            - *k_clock
            - *k_firm
            - *k_mp
            - *k_ep
            - *k_qcd
            - *k_eng
            - *k_eng_fw
            - *k_eng_eqrp
            - *k_eng_cleared
            - *k_eng_released
            - *k_insp
            - *k_insp_select
            - *k_sel_lookup
            - *k_insp_inprog
            - *k_finding
            - *k_classify_def
            - &k_rca_deep
              call: "POST /inspection-findings/${finding_id}/root-cause-analyses"
              payload:
                method: "FISHBONE"
                root_cause_category: "SUPERVISION_REVIEW"
                contributing_factor_count: 5
                narrative: "Five interacting factors span planning, staffing, supervision, review timing and file assembly."
              as: QualityControlDirector
              as_user_id: "${qcd_id}"
              captures: { rca_deep_id: "$.data.id" }
          trigger:
            - call: "POST /root-cause-analyses/${rca_deep_id}/validation"
              payload: { outcome: "VALIDATED" }
              as: QualityControlDirector
              as_user_id: "${qcd_id}"
          assert:
            - "HTTP 200"
            - "data.state == \"VALIDATED\" and data.validated_at == \"2026-08-01T00:00:00Z\""
            - "data.depth_score == 10.00 (not 13.00)"
            - "data.recurrence_flag == false"

      - name: peer_review_rating_is_pass_with_deficiency_at_one_scope_limitation
        claim_type: Constants Applied
        grounds:
          - calculations.peer_review_rating
          - state_machines.PeerReview.FIELDWORK_to_RATING_DRAFTED
        distinguishing_aspect: >-
          The sole COMMITTED selection carries disposition FFC (which never
          affects the rating on its own) plus is_scope_limitation true. At exactly
          PWD_SCOPE_LIMITATION_AT the rating is PASS_WITH_DEFICIENCY, not FAIL
          (FAIL needs 2) and not PASS (FFC alone would give PASS).
        test_recipe:
          setup:
            - "Peer review in FIELDWORK (the firm's 2026 inspection cycle is CONCLUDED) with one committed selection flagged as a scope limitation and dispositioned FFC."
          setup_api_calls:
            - *k_clock
            - *k_firm
            - *k_mp
            - *k_ep
            - *k_qcd
            - *k_eng
            - *k_eng_fw
            - *k_eng_eqrp
            - *k_eng_cleared
            - *k_eng_released
            - *k_insp
            - *k_insp_select
            - *k_insp_inprog
            - *k_insp_classified
            - *k_insp_concluded
            - *k_reviewer
            - *k_pr
            - *k_pr_assign
            - *k_pr_scope
            - &k_pr_sel_lim
              call: "POST /peer-reviews/${pr_id}/selections"
              payload:
                engagement_id: "${eng_id}"
                hours_committed: 12
                is_scope_limitation: true
                expected_peer_review_version: "${pr_v_scope}"
              as: PeerReviewer
              as_user_id: "${reviewer_id}"
              captures: { prsel_lim_id: "$.data.id" }
            - *k_pr_fieldwork
            - &k_pr_disp_ffc
              call: "POST /peer-review-selections/${prsel_lim_id}/disposition"
              payload: { disposition: "FFC", non_conforming: false }
              as: PeerReviewer
              as_user_id: "${reviewer_id}"
          trigger:
            - *k_pr_rating
          assert:
            - "HTTP 200"
            - "data.state == \"RATING_DRAFTED\""
            - "data.rating == \"PASS_WITH_DEFICIENCY\" (neither \"PASS\" nor \"FAIL\")"
            - "data.scope_limitation_count == 1"
            - "data.unallocated_hours == 28 (40 scope hours less the 12 committed)"

      - name: reviewer_assignment_with_an_empty_pool_flags_the_firm
        claim_type: Correct Result
        grounds:
          - calculations.peer_reviewer_selection
          - errors.ERR_NO_ELIGIBLE_REVIEWER
        distinguishing_aspect: >-
          With zero PeerReviewer rows registered the eligibility pool is empty, so
          the declared fallback fires: 409 ERR_NO_ELIGIBLE_REVIEWER, the review
          stays SCHEDULED (it must not slide to PLANNING), and the firm's
          unassigned_review_flag flips true as a durable side effect of a failed
          request.
        test_recipe:
          setup:
            - "Firm with a SCHEDULED system review and no peer reviewers on the roster."
          setup_api_calls:
            - *k_clock
            - *k_firm
            - *k_pr
          trigger:
            - call: "POST /peer-reviews/${pr_id}/reviewer-assignment"
              payload: {}
              as: PeerReviewCommittee
              as_user_id: "prc-01"
              captures: { pool_err: "$.data.error_id" }
          assert:
            - "HTTP 409"
            - "data.error_id == \"ERR_NO_ELIGIBLE_REVIEWER\""
            - "a follow-up GET /peer-reviews/${pr_id} returns state == \"SCHEDULED\" and assigned_reviewer_id == null"
            - "a follow-up GET /firms/${firm_id} returns unassigned_review_flag == true"

  - section: validations
    instances:

      - name: eqr_window_check_outranks_cooling_off_and_returns_not_in_eqr_window
        claim_type: Priority Ordering
        grounds:
          - validation_priority_notes[0]
          - validations.priority_18
          - validations.priority_38
        distinguishing_aspect: >-
          Two rules are violated by one request: the engagement is already
          REPORT_RELEASED (priority 18) and the candidate reviewer left the
          client's team only 400 days before period_end, short of the 730-day
          cooling-off (priority 38). The lower priority number must win, so the
          body carries ERR_ENGAGEMENT_NOT_IN_EQR_WINDOW and never
          ERR_COOLING_OFF_NOT_MET. The OCC field is correct, so priority 15
          cannot mask the comparison.
        test_recipe:
          setup:
            - "Released REVIEW engagement for Aurora Metals Inc plus an EQ-eligible partner who exited that client's team on 2025-02-24 (400 days before period_end 2026-03-31)."
          setup_api_calls:
            - *k_clock
            - *k_firm
            - *k_mp
            - *k_ep
            - *k_eng
            - *k_eng_fw
            - *k_eng_eqrp
            - *k_eng_cleared
            - *k_eng_released
            - &k_eqrp_cool
              call: "POST /firms/${firm_id}/partners"
              payload:
                full_name: "Priya Raman"
                cpa_license_state: "TX"
                designations: ["EQ_REVIEWER"]
                cpe_hours_last_3y: 160
                prior_engagement_team_clients:
                  - { client_name: "Aurora Metals Inc", exit_date: "2025-02-24" }
              as: SystemAdmin
              as_user_id: "sysadmin-01"
              captures: { eqrp_cool_id: "$.data.id" }
          trigger:
            - call: "POST /engagements/${eng_id}/quality-reviews"
              payload:
                reviewer_partner_id: "${eqrp_cool_id}"
                objectivity_attested: true
                expected_engagement_version: "${eng_v_rel}"
              as: FirmManagingPartner
              as_user_id: "${mp_id}"
              captures: { prio_err: "$.data.error_id" }
          assert:
            - "HTTP 409"
            - "data.error_id == \"ERR_ENGAGEMENT_NOT_IN_EQR_WINDOW\" (not \"ERR_COOLING_OFF_NOT_MET\", not \"ERR_STALE_VERSION\")"
            - "a follow-up GET /quality-reviews?engagement_id=${eng_id} returns meta.total_count == 0"
            - "a follow-up GET /partners/${eqrp_cool_id} returns open_eqr_count == 0"

      - name: engagement_firm_mismatch_outranks_scope_hours_exceeded
        claim_type: Priority Ordering
        grounds:
          - validation_priority_notes[1]
          - validations.priority_31
          - validations.priority_61
        distinguishing_aspect: >-
          The named engagement belongs to a second firm (priority 31) AND
          hours_committed 200 far exceeds the review's 40 unallocated hours
          (priority 61, the last fiscal check). Referential integrity is
          evaluated first, so the fiscal error must not surface — an
          implementation that budgets hours before resolving ownership fails.
        test_recipe:
          setup:
            - "Firm A peer review in SCOPE_SET with 40 unallocated hours; a second firm with its own released-state engagement."
          setup_api_calls:
            - *k_clock
            - *k_firm
            - *k_mp
            - *k_ep
            - *k_eng
            - *k_eng_fw
            - *k_eng_eqrp
            - *k_eng_cleared
            - *k_eng_released
            - *k_reviewer
            - *k_pr
            - *k_pr_assign
            - *k_pr_scope
            - *k_firm_b
            - &k_mp_b
              call: "POST /firms/${firm_b_id}/partners"
              payload:
                full_name: "Greta Lindqvist"
                cpa_license_state: "NV"
                designations: ["MANAGING_PARTNER"]
              as: SystemAdmin
              as_user_id: "sysadmin-01"
              captures: { mp_b_id: "$.data.id" }
            - *k_ep_b
            - &k_eng_b
              call: "POST /engagements"
              payload:
                firm_id: "${firm_b_id}"
                client_name: "Silverbrook Utilities"
                engagement_type: "REVIEW"
                period_end: "2026-05-31"
                engagement_partner_id: "${ep_b_id}"
              as: FirmManagingPartner
              as_user_id: "${mp_b_id}"
              captures: { eng_b_id: "$.data.id" }
          trigger:
            - call: "POST /peer-reviews/${pr_id}/selections"
              payload:
                engagement_id: "${eng_b_id}"
                hours_committed: 200
                expected_peer_review_version: "${pr_v_scope}"
              as: PeerReviewer
              as_user_id: "${reviewer_id}"
              captures: { mismatch_err: "$.data.error_id" }
          assert:
            - "HTTP 409"
            - "data.error_id == \"ERR_ENGAGEMENT_FIRM_MISMATCH\" (not \"ERR_SCOPE_HOURS_EXCEEDED\")"
            - "a follow-up GET /peer-reviews/${pr_id} returns unallocated_hours == 40 and state == \"SCOPE_SET\""
            - "a follow-up GET /peer-review-selections?peer_review_id=${pr_id} returns meta.total_count == 0"

      - name: reviewer_window_conflict_outranks_reviewer_at_capacity
        claim_type: Priority Ordering
        grounds:
          - validation_priority_notes[2]
          - validations.priority_43
          - validations.priority_51
        distinguishing_aspect: >-
          The named reviewer has max_concurrent_reviews 1 and is already carrying
          a PLANNING review over 2026-10-12..2026-10-20, which collides with the
          new 2026-10-01..2026-10-15 window under the 5-day travel buffer
          (10-01 < 10-25 and 10-12 < 10-15). Temporal priority 43 must beat the
          capacity check at 51.
        test_recipe:
          setup:
            - "One out-of-state-accepting reviewer with a single concurrency slot already committed to another firm's overlapping review."
          setup_api_calls:
            - *k_clock
            - *k_firm
            - *k_firm_b
            - &k_reviewer_solo
              call: "POST /peer-reviewers"
              payload:
                reviewer_firm_name: "Halloway & Reid LLP"
                license_state: "TX"
                accepts_out_of_state: true
                qualified_categories: ["ERISA_AUDIT", "SINGLE_AUDIT", "BROKER_DEALER", "GOVERNMENTAL", "PUBLIC_INTEREST"]
                max_concurrent_reviews: 1
                experience_hours: 3000
              as: PeerReviewCommittee
              as_user_id: "prc-01"
              captures: { reviewer_solo_id: "$.data.id" }
            - &k_pr_b
              call: "POST /firms/${firm_b_id}/peer-reviews"
              payload:
                review_type: "SYSTEM_REVIEW"
                year_end: "2026-06-30"
                scheduled_window_start: "2026-10-12"
                scheduled_window_end: "2026-10-20"
              as: PeerReviewCommittee
              as_user_id: "prc-01"
              captures: { pr_b_id: "$.data.id" }
            - &k_pr_b_assign
              call: "POST /peer-reviews/${pr_b_id}/reviewer-assignment"
              payload: { reviewer_id: "${reviewer_solo_id}" }
              as: PeerReviewCommittee
              as_user_id: "prc-01"
            - *k_pr
          trigger:
            - call: "POST /peer-reviews/${pr_id}/reviewer-assignment"
              payload: { reviewer_id: "${reviewer_solo_id}" }
              as: PeerReviewCommittee
              as_user_id: "prc-01"
              captures: { window_err: "$.data.error_id" }
          assert:
            - "HTTP 409"
            - "data.error_id == \"ERR_REVIEWER_WINDOW_CONFLICT\" (not \"ERR_REVIEWER_AT_CAPACITY\")"
            - "a follow-up GET /peer-reviews/${pr_id} returns state == \"SCHEDULED\" and assigned_reviewer_id == null"
            - "a follow-up GET /peer-reviewers/${reviewer_solo_id} returns active_review_count == 1 (unchanged)"
            - "a follow-up GET /firms/${firm_id} returns unassigned_review_flag == false (the flag is only set by the empty-pool auto-selection fallback)"

      - name: documentation_lock_at_exactly_sixty_days_is_accepted
        claim_type: Satisfaction → Pass
        grounds:
          - validations.priority_44
          - state_machines.Engagement.file_state.ASSEMBLED_to_LOCKED
        distinguishing_aspect: >-
          report_release_date is 2026-08-01 and the clock is advanced to
          2026-09-30, exactly 60 days later. The rule is `<= 60`, so the lock
          must succeed at the boundary; an implementation using `< 60` closes the
          window a day early.
        test_recipe:
          setup:
            - "Released engagement whose file is ASSEMBLED, with the clock advanced to the 60th day after release."
          setup_api_calls:
            - *k_clock
            - *k_firm
            - *k_mp
            - *k_ep
            - *k_eng
            - *k_eng_fw
            - *k_eng_eqrp
            - *k_eng_cleared
            - *k_eng_released
            - &k_file_assembled
              call: "POST /engagements/${eng_id}/file-transitions"
              payload: { to_state: "ASSEMBLED" }
              as: EngagementPartner
              as_user_id: "${ep_id}"
            - &k_clock_day60
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-30T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "sysadmin-01"
          trigger:
            - call: "POST /engagements/${eng_id}/file-transitions"
              payload: { to_state: "LOCKED" }
              as: EngagementPartner
              as_user_id: "${ep_id}"
          assert:
            - "HTTP 200"
            - "data.file_state == \"LOCKED\" and data.workflow_state == \"REPORT_RELEASED\""
            - "data.report_release_date == \"2026-08-01\" and data.reopened_count == 0"
            - "data.version == 7 (5 after release, +1 for ASSEMBLED, +1 for LOCKED)"

      - name: documentation_lock_on_day_sixty_one_is_rejected
        claim_type: Violation → Error
        grounds:
          - validations.priority_44
          - errors.ERR_DOCUMENTATION_WINDOW_CLOSED
        distinguishing_aspect: >-
          One day past the boundary (clock 2026-10-01, 61 days after the
          2026-08-01 release) the same request is 409
          ERR_DOCUMENTATION_WINDOW_CLOSED and file_state must stay ASSEMBLED —
          the temporal guard is evaluated against the logical clock, never
          against wall time.
        test_recipe:
          setup:
            - "Released engagement whose file is ASSEMBLED, with the clock advanced to the 61st day after release."
          setup_api_calls:
            - *k_clock
            - *k_firm
            - *k_mp
            - *k_ep
            - *k_eng
            - *k_eng_fw
            - *k_eng_eqrp
            - *k_eng_cleared
            - *k_eng_released
            - *k_file_assembled
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "sysadmin-01"
          trigger:
            - call: "POST /engagements/${eng_id}/file-transitions"
              payload: { to_state: "LOCKED" }
              as: EngagementPartner
              as_user_id: "${ep_id}"
              captures: { window_closed: "$.data.error_id" }
          assert:
            - "HTTP 409"
            - "data.error_id == \"ERR_DOCUMENTATION_WINDOW_CLOSED\""
            - "a follow-up GET /engagements/${eng_id} returns file_state == \"ASSEMBLED\" and version == 6"

      - name: material_failure_without_report_impact_is_rejected
        claim_type: Violation → Error
        grounds:
          - validations.priority_55
          - errors.ERR_MATERIAL_FAILURE_REQUIRES_REPORT_IMPACT
        distinguishing_aspect: >-
          The rule is conditional on the classification value: MATERIAL_FAILURE
          demands affects_report_conclusion true, while DEFICIENCY happily accepts
          false. Sending MATERIAL_FAILURE with false is 422 and, crucially, none
          of the five-link MATERIAL_FAILURE cascade may run — the finding stays
          IDENTIFIED/UNCLASSIFIED and the firm's counters stay at zero.
        test_recipe:
          setup:
            - "Inspection cycle IN_PROGRESS with one unclassified finding."
          setup_api_calls:
            - *k_clock
            - *k_firm
            - *k_mp
            - *k_ep
            - *k_qcd
            - *k_eng
            - *k_eng_fw
            - *k_eng_eqrp
            - *k_eng_cleared
            - *k_eng_released
            - *k_insp
            - *k_insp_select
            - *k_sel_lookup
            - *k_insp_inprog
            - *k_finding
          trigger:
            - call: "POST /inspection-findings/${finding_id}/classification"
              payload: { classification: "MATERIAL_FAILURE", pervasiveness: "SYSTEMIC", affects_report_conclusion: false }
              as: QualityControlDirector
              as_user_id: "${qcd_id}"
              captures: { mf_err: "$.data.error_id" }
          assert:
            - "HTTP 422"
            - "data.error_id == \"ERR_MATERIAL_FAILURE_REQUIRES_REPORT_IMPACT\""
            - "a follow-up GET /inspection-findings/${finding_id} returns classification == \"UNCLASSIFIED\", state == \"IDENTIFIED\" and class_points == 0"
            - "a follow-up GET /firms/${firm_id} returns open_material_failure_count == 0 and risk_posture == \"STABLE\""
            - "a follow-up GET /engagements/${eng_id} returns reopened_count == 0"

      - name: operating_basis_without_a_tested_response_is_rejected
        claim_type: Violation → Error
        grounds:
          - validations.priority_56
          - errors.ERR_NO_TESTED_RESPONSE
        distinguishing_aspect: >-
          The OPERATING_BASIS input set is TESTED responses only. A risk whose
          single response is still DESIGNED has an empty fold input, and the
          declared behaviour is a 409 rather than a vacuous residual equal to the
          inherent score. DESIGN_BASIS on the identical data would have succeeded,
          so the check must be variant-specific.
        test_recipe:
          setup:
            - "Quality risk in RESPONDED with exactly one DESIGNED (never tested) response."
          setup_api_calls:
            - *k_clock
            - *k_firm
            - *k_qcd
            - *k_risk_a
            - *k_resp_a1
          trigger:
            - call: "POST /quality-risks/${risk_a_id}/evaluations"
              payload: { basis: "OPERATING_BASIS" }
              as: QualityControlDirector
              as_user_id: "${qcd_id}"
              captures: { untested_err: "$.data.error_id" }
          assert:
            - "HTTP 409"
            - "data.error_id == \"ERR_NO_TESTED_RESPONSE\""
            - "a follow-up GET /quality-risks/${risk_a_id} returns state == \"RESPONDED\", residual_risk_score == null, severity_band == \"NONE\", evaluation_basis == \"NONE\""
            - "a follow-up GET /risk-responses/${resp_a1_id} returns status == \"DESIGNED\" and operating_effectiveness == \"NOT_TESTED\""

      - name: second_selection_exceeding_the_remaining_hours_is_rejected
        claim_type: Violation → Error
        grounds:
          - validations.priority_61
          - calculations.peer_review_hours_scope
          - errors.ERR_SCOPE_HOURS_EXCEEDED
        distinguishing_aspect: >-
          Aggregate validation: with an ERISA_AUDIT in the pool the scope is 48
          hours, so 30 alone is legal and 20 alone is legal, but 30 + 20 = 50
          overruns the budget. The check is against the live unallocated_hours
          (18 after the first commit), not against total_scope_hours.
        test_recipe:
          setup:
            - "Peer review in SCOPE_SET with 48 scope hours and one committed 30-hour selection; the review's version is re-read after that commit."
          setup_api_calls:
            - *k_clock
            - *k_firm
            - *k_mp
            - *k_ep
            - *k_qcd
            - *k_eqrp
            - *k_eng
            - *k_eng_fw
            - *k_eng_eqrp
            - *k_eng_cleared
            - *k_eng_released
            - *k_eng2
            - *k_eng2_fw
            - *k_eqr
            - *k_eqr_start
            - *k_eng2_eqrp
            - *k_eqr_concur
            - *k_eng2_cleared
            - *k_eng2_released
            - *k_reviewer
            - *k_pr
            - *k_pr_assign
            - *k_pr_scope
            - call: "POST /peer-reviews/${pr_id}/selections"
              payload:
                engagement_id: "${eng_id}"
                hours_committed: 30
                expected_peer_review_version: "${pr_v_scope}"
              as: PeerReviewer
              as_user_id: "${reviewer_id}"
            - &k_pr_reread
              call: "GET /peer-reviews/${pr_id}"
              payload: {}
              as: PeerReviewer
              as_user_id: "${reviewer_id}"
              captures: { pr_v_after_sel: "$.data.version" }
          trigger:
            - call: "POST /peer-reviews/${pr_id}/selections"
              payload:
                engagement_id: "${eng2_id}"
                hours_committed: 20
                expected_peer_review_version: "${pr_v_after_sel}"
              as: PeerReviewer
              as_user_id: "${reviewer_id}"
              captures: { hours_err: "$.data.error_id" }
          assert:
            - "HTTP 409"
            - "data.error_id == \"ERR_SCOPE_HOURS_EXCEEDED\" (not \"ERR_STALE_VERSION\": the re-read version is current)"
            - "a follow-up GET /peer-reviews/${pr_id} returns total_scope_hours == 48 and unallocated_hours == 18"
            - "a follow-up GET /peer-review-selections?peer_review_id=${pr_id} returns meta.total_count == 1"
            - "a follow-up GET /peer-reviewers/${reviewer_id} returns committed_hours_balance == 30"

      - name: peer_review_fieldwork_without_a_concluded_inspection_is_rejected
        claim_type: Violation → Error
        grounds:
          - validations.priority_26
          - errors.ERR_INSPECTION_NOT_CONCLUDED
        distinguishing_aspect: >-
          Cross-entity validation: the SCOPE_SET -> FIELDWORK leg depends on the
          state of a different aggregate. The firm's highest-year inspection
          exists but is only SELECTION_COMPLETE, so the peer review may not start
          fieldwork. An implementation that checks only for the inspection's
          existence, or looks at any CONCLUDED cycle rather than the newest one,
          passes when it should fail.
        test_recipe:
          setup:
            - "Peer review in SCOPE_SET with one committed selection, while the firm's 2026 inspection is still SELECTION_COMPLETE."
          setup_api_calls:
            - *k_clock
            - *k_firm
            - *k_mp
            - *k_ep
            - *k_qcd
            - *k_eng
            - *k_eng_fw
            - *k_eng_eqrp
            - *k_eng_cleared
            - *k_eng_released
            - *k_insp
            - *k_insp_select
            - *k_reviewer
            - *k_pr
            - *k_pr_assign
            - *k_pr_scope
            - *k_pr_sel
          trigger:
            - call: "POST /peer-reviews/${pr_id}/transitions"
              payload: { to_state: "FIELDWORK" }
              as: PeerReviewer
              as_user_id: "${reviewer_id}"
              captures: { insp_err: "$.data.error_id" }
          assert:
            - "HTTP 409"
            - "data.error_id == \"ERR_INSPECTION_NOT_CONCLUDED\""
            - "a follow-up GET /peer-reviews/${pr_id} returns state == \"SCOPE_SET\""
            - "a follow-up GET /internal-inspections/${insp_id} returns state == \"SELECTION_COMPLETE\""

      - name: list_read_with_limit_zero_returns_pagination_out_of_range
        claim_type: Violation → Error
        grounds:
          - validations.priority_12
          - errors.ERR_PAGINATION_OUT_OF_RANGE
        distinguishing_aspect: >-
          limit 0 is below the declared floor of 1 on every list endpoint, and a
          negative offset is likewise rejected; both are 422 with the same
          error_id rather than an empty page or a silently clamped default. The
          check fires before any filtering, so a well-formed firm_id filter does
          not rescue the request.
        test_recipe:
          setup:
            - "One firm with one engagement so a legal page would be non-empty."
          setup_api_calls:
            - *k_clock
            - *k_firm
            - *k_mp
            - *k_ep
            - *k_eng
          trigger:
            - call: "GET /engagements?firm_id=${firm_id}&limit=0"
              payload: {}
              as: FirmManagingPartner
              as_user_id: "${mp_id}"
              captures: { page_err: "$.data.error_id" }
          assert:
            - "HTTP 422"
            - "data.error_id == \"ERR_PAGINATION_OUT_OF_RANGE\""
            - "a repeat call GET /engagements?firm_id=${firm_id}&offset=-1 also returns 422 ERR_PAGINATION_OUT_OF_RANGE"
            - "a repeat call GET /engagements?firm_id=${firm_id}&limit=1 returns HTTP 200 with meta.total_count == 1"

  - section: endpoints
    instances:

      - name: firm_patch_raises_the_base_tier_of_a_later_scope
        claim_type: Standard CRUD
        grounds:
          - endpoints."PATCH /firms/{firm_id}"
          - calculations.peer_review_hours_scope
        distinguishing_aspect: >-
          The committee maintenance PATCH writes aa_hours_last_year and bumps
          Firm.version, and the declared side effect is that a scope determined
          AFTERWARDS uses the new tier: 20000 hours falls in the else tier, so
          BASE_TIER is 64 rather than the 40 the same firm would have drawn at
          9000. Fields not named in the body are untouched.
        test_recipe:
          setup:
            - "Firm registered at 9000 A&A hours with a scheduled, reviewer-assigned system review."
          setup_api_calls:
            - *k_clock
            - *k_firm
            - *k_mp
            - *k_ep
            - *k_eng
            - *k_eng_fw
            - *k_eng_eqrp
            - *k_eng_cleared
            - *k_eng_released
            - *k_reviewer
            - *k_pr
            - *k_pr_assign
            - &k_firm_patch_hours
              call: "PATCH /firms/${firm_id}"
              payload: { aa_hours_last_year: 20000 }
              as: PeerReviewCommittee
              as_user_id: "prc-01"
          trigger:
            - *k_pr_scope
          assert:
            - "HTTP 200"
            - "data.total_scope_hours == 64 and data.unallocated_hours == 64"
            - "data.must_select_categories == []"
            - "a follow-up GET /firms/${firm_id} returns aa_hours_last_year == 20000, version == 2, state_code == \"TX\", peer_review_year_end == \"2026-06-30\", enrolled_program == \"AICPA_PRC\""

      - name: quality_management_summary_is_a_pure_computed_read
        claim_type: Computed read
        grounds:
          - endpoints."GET /firms/{firm_id}/quality-management-summary"
          - calculations.firm_risk_posture
        distinguishing_aspect: >-
          The summary must agree with the underlying rows it derives from: one
          EVALUATED risk at residual 2.60 (inherent 4 * (1 - 0.35)) bands LOW, so
          critical_risk_count stays 0 and posture STABLE; the released ERISA_AUDIT
          puts ERISA_AUDIT in the categories the firm would attract; and the latest
          cycle's state is echoed. The read has no side effects, so Firm.version
          must not move.
        test_recipe:
          setup:
            - "Firm with a released REVIEW and a released ERISA_AUDIT engagement, one low EVALUATED DESIGN_BASIS risk, and a 2026 cycle in SELECTION_COMPLETE."
          setup_api_calls:
            - *k_clock
            - *k_firm
            - *k_mp
            - *k_ep
            - *k_qcd
            - *k_eqrp
            - *k_eng
            - *k_eng_fw
            - *k_eng_eqrp
            - *k_eng_cleared
            - *k_eng_released
            - *k_eng2
            - *k_eng2_fw
            - *k_eqr
            - *k_eqr_start
            - *k_eng2_eqrp
            - *k_eqr_concur
            - *k_eng2_cleared
            - *k_eng2_released
            - &k_risk_low
              call: "POST /firms/${firm_id}/quality-risks"
              payload:
                component: "INFORMATION_COMMUNICATION"
                quality_objective_code: "IC-01"
                risk_statement: "Firm-wide quality communications may not reach seasonal staff."
                likelihood: 2
                impact: 2
              as: QualityControlDirector
              as_user_id: "${qcd_id}"
              captures: { risk_low_id: "$.data.id" }
            - &k_resp_low
              call: "POST /quality-risks/${risk_low_id}/responses"
              payload: { response_type: "PREVENTIVE", description: "Quarterly quality bulletin acknowledged by every engagement team member." }
              as: QualityControlDirector
              as_user_id: "${qcd_id}"
              captures: { resp_low_id: "$.data.id" }
            - &k_test_low
              call: "POST /risk-responses/${resp_low_id}/effectiveness-tests"
              payload: { design_effectiveness: "EFFECTIVE", operating_effectiveness: "EFFECTIVE" }
              as: QualityControlDirector
              as_user_id: "${qcd_id}"
            - &k_eval_low_design
              call: "POST /quality-risks/${risk_low_id}/evaluations"
              payload: { basis: "DESIGN_BASIS" }
              as: QualityControlDirector
              as_user_id: "${qcd_id}"
            - *k_insp
            - *k_insp_select
          trigger:
            - call: "GET /firms/${firm_id}/quality-management-summary"
              payload: {}
              as: QualityControlDirector
              as_user_id: "${qcd_id}"
          assert:
            - "HTTP 200"
            - "data.risk_posture == \"STABLE\" and data.critical_risk_count == 0"
            - "data.open_deficiency_count == 0 and data.open_material_failure_count == 0"
            - "data.last_peer_review_rating == \"NONE\" and data.unassigned_review_flag == false"
            - "the summary's must_select_categories == [\"ERISA_AUDIT\"] and the latest inspection state is \"SELECTION_COMPLETE\""
            - "a follow-up GET /quality-risks/${risk_low_id} returns residual_risk_score == 2.60 and severity_band == \"LOW\""
            - "a follow-up GET /firms/${firm_id} returns version == 1 (a computed read writes nothing)"

      - name: selection_delete_restores_hours_on_both_sides
        claim_type: Standard CRUD
        grounds:
          - state_machines.PeerReviewSelection.withdrawal
          - endpoints."DELETE /peer-reviews/{peer_review_id}/selections/{selection_id}"
        distinguishing_aspect: >-
          Withdrawal is a compensating delete: 204 with no body, the review's
          unallocated_hours climbs back from 28 to the full 40, the reviewer's
          conserved committed_hours_balance returns to 0, scope_limitation_count is
          recomputed to 0, and the selection is WITHDRAWN rather than erased (its
          row is still readable and excluded from the rating input set).
        test_recipe:
          setup:
            - "Peer review in SCOPE_SET with one committed 12-hour scope-limitation selection."
          setup_api_calls:
            - *k_clock
            - *k_firm
            - *k_mp
            - *k_ep
            - *k_eng
            - *k_eng_fw
            - *k_eng_eqrp
            - *k_eng_cleared
            - *k_eng_released
            - *k_reviewer
            - *k_pr
            - *k_pr_assign
            - *k_pr_scope
            - *k_pr_sel_lim
