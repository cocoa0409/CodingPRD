      - call: POST /v1/claims/${claim_id}/review
        payload: {}
        as: ClaimsAdjuster
      assert:
      - ClaimsCase.${claim_id}.liability_limit_cents == 100000000
      - ClaimsCase.${claim_id}.price_cap_cents == 7500000
      - ClaimsCase.${claim_id}.provisional_liability_cents == 7500000
      - ClaimsCase.${claim_id}.review_rounds == 1 and ClaimsCase.${claim_id}.status == UNDER_REVIEW
      - ClaimsCase.${claim_id}.provisional_liability_cents != 20000000
  - name: settlement_gross_struck_before_the_quick_pay_discount
    grounds:
    - calculations.settlement_net_payable
    - calculations.quick_pay_discount_tier
    - entities.CarrierSettlement.fields.gross_payable_cents
    - state_machines.CarrierSettlement.READY_to_PAID
    distinguishing_aspect: 'The evaluation order pins gross_payable_cents = 270000 (180000 line haul + 15000 detention + 0
      claim deduction - 0), then takes the tier discount on that gross, then strikes net: with 4 prior paid settlements the
      tier rate is 0.0300 so the discount is 8100 and the net is 261900. Multiplying the line haul alone, or netting before
      discounting, produces a different integer.'
    test_recipe:
      setup:
      - Logical clock at 2026-09-20T00:00:00Z. One shipper on 20-day terms, lane TX>CA, one VERIFIED carrier with four already-PAID
        settlements on its history and one READY settlement carrying a 180000-cent line haul plus a 15000-cent closed detention
        charge.
      setup_api_calls:
      - call: POST /v1/shippers
        payload:
          name: Gulf Fabricators LLC
          billing_state_code: TX
          payment_terms_days: 30
          quick_pay_discount_pct: 0.03
          credit_limit_cents: 20000000
          load_credit_limit: 10
        as: PlatformAdmin
        captures:
          shipper_id: $.data.id
      - call: POST /v1/facilities
        payload:
          name: Gulf Fabricators Houston
          state_code: TX
          dock_capacity: 3
          default_appointment_minutes: 60
          free_dwell_minutes: 120
          detention_rate_per_hour_cents: 7500
        as: PlatformAdmin
        captures:
          origin_facility_id: $.data.id
      - call: POST /v1/facilities
        payload:
          name: Inland Empire DC
