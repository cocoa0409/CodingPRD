# =============================================================================
# Bird & Aviary Supply — seed tables (Expert)
# =============================================================================
scenario: |
  1023. Bird & Aviary Supply: livestock & species, feed/subscription & fresh,
  grooming (wing/nail) & boarding, health & quarantine, cage/build & special
  order, permit (CITES), club/event, inventory

domain_name: bird-aviary-supply
api_prefix: "/"

complexity_profile:
  primary_archetype: compliance_audit          # CITES permit gating + quarantine health compliance
  secondary_archetype: temporal_windowing      # cage boarding + grooming slot scheduling
  complexity_layers:
    - dual_variant_calculation                 # boarding cost + quarantine risk (provisional vs final)
    - cascading_side_effects                   # quarantine-fail and permit-revoke cascades
    - optimistic_concurrency                   # OCC on CageUnit.version for config updates
    - derived_field_reconciliation             # inventory on-hand/allocated, species listed count

  entity_topology: graph                        # flat peer entities + many-to-many via EventRegistration-less club tier; FK links, no URL nesting except reverse-reachability sub-resources
  state_machine_shape: parallel                 # SpecialOrder carries payment_status x build_status; QuarantineRecord is cyclic
  relationship_patterns:
    - one_to_many                               # Species->Bird, Customer->FeedSubscription
    - cross_aggregate                           # Bird listing depends on Species/CitesPermit; BoardingReservation depends on CageUnit
    - self_referential: false
  role_model: peer_roles                        # Customer / AviaryStaff / ComplianceOfficer / StoreManager own distinct surfaces
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID (identity only)" }
      - { name: full_name, type: string, source: input, description: "Customer full name" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: club_tier, type: enum, source: system, default: "NONE", description: "Club membership tier: NONE | SILVER | GOLD; set only via POST /customers/{id}/club-membership" }
      - { name: wallet_credit_cents, type: integer, source: system, default: 0, description: "Store-credit balance in cents; debited on charges, credited on refunds; never below 0" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | SUSPENDED (SUSPENDED customers cannot open new subscriptions/orders)" }

  - name: Species
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: common_name, type: string, source: input, description: "e.g., African Grey Parrot" }
      - { name: scientific_name, type: string, source: input, description: "Binomial name" }
      - { name: cites_appendix, type: enum, source: input, description: "CITES listing: I | II | III | NONE; drives base quarantine risk and permit requirement" }
      - { name: permit_required, type: boolean, source: computed, description: "True iff cites_appendix in {I, II, III}; false when NONE" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | RESTRICTED; RESTRICTED blocks listing/sale of its Birds (set by permit revoke/expiry cascade)" }
      - { name: listed_bird_count, type: integer, source: computed, description: "Count of Birds of this species whose status == LISTED (derived, recomputed on Bird status change)" }

  - name: CitesPermit
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: species_id, type: string, source: input, description: "FK -> Species.id; the species this permit authorizes trade for" }
      - { name: permit_number, type: string, source: input, description: "External CITES permit reference" }
      - { name: valid_until, type: datetime, source: input, description: "ISO8601 UTC expiry instant; permit auto-EXPIRED once logical clock passes this" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | SUBMITTED | APPROVED | REVOKED | EXPIRED" }

  - name: Bird
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: species_id, type: string, source: input, description: "FK -> Species.id; the species of this livestock bird" }
      - { name: housing_cage_id, type: string, source: system, description: "FK -> CageUnit.id; quarantine/holding cage this bird occupies while IN_QUARANTINE/CLEARED, null after SOLD/REJECTED" }
      - { name: band_code, type: string, source: input, description: "Leg-band identifier (unique per bird)" }
      - { name: imported, type: boolean, source: input, default: false, description: "True if imported (adds intake risk penalty)" }
      - { name: list_price_cents, type: integer, source: input, description: "Sale price in cents once LISTED" }
      - { name: provisional_risk_score, type: integer, source: computed, description: "Intake risk estimate (species base + import penalty)" }
      - { name: final_risk_score, type: integer, source: computed, description: "Post-quarantine risk (species base + failed-test/retest penalties); set when quarantine closes" }
      - { name: status, type: enum, source: system, default: "INTAKE", description: "INTAKE | IN_QUARANTINE | CLEARED | LISTED | SOLD | REJECTED | SUSPENDED" }

  - name: QuarantineRecord
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: bird_id, type: string, source: input, description: "FK -> Bird.id; the bird under quarantine (one open record per bird)" }
      - { name: opened_at, type: datetime, source: system, description: "Logical-clock instant the record was opened" }
      - { name: min_clear_at, type: datetime, source: system, description: "opened_at + QUARANTINE_MIN_DAYS; cannot CLEAR before this instant" }
      - { name: failed_test_count, type: integer, source: system, default: 0, description: "Number of failed diagnostic tests recorded" }
      - { name: retest_count, type: integer, source: system, default: 0, description: "Number of OPEN<-UNDER_TEST retest loops completed" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | UNDER_TEST | CLEARED | FAILED" }

  - name: CageUnit
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: label, type: string, source: input, description: "Cage label/location" }
      - { name: cage_class, type: enum, source: input, description: "Usage class: HOUSING (livestock quarantine) | BOARDING (customer boarding)" }
      - { name: capacity, type: integer, source: input, description: "Maximum number of occupants (>=1)" }
      - { name: nightly_rate_cents, type: integer, source: input, default: 0, description: "Boarding nightly rate in cents (BOARDING cages only)" }
      - { name: current_occupancy, type: integer, source: computed, description: "Count of birds currently housed (HOUSING) or checked-in reservations (BOARDING)" }
      - { name: status, type: enum, source: system, default: "AVAILABLE", description: "AVAILABLE | OCCUPIED (occupancy==capacity) | OUT_OF_SERVICE" }

  - name: BoardingReservation
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; owner of the boarded bird" }
      - { name: cage_id, type: string, source: input, description: "FK -> CageUnit.id; must be a BOARDING-class cage" }
      - { name: planned_check_in, type: datetime, source: input, description: "ISO8601 UTC planned start" }
      - { name: planned_check_out, type: datetime, source: input, description: "ISO8601 UTC planned end (must be > planned_check_in)" }
      - { name: actual_check_out, type: datetime, source: system, description: "Logical-clock instant of checkout; null until CHECKED_OUT" }
      - { name: provisional_cost_cents, type: integer, source: computed, description: "Estimate at reservation: nightly_rate * planned nights" }
      - { name: final_cost_cents, type: integer, source: computed, description: "Charged at checkout: nightly_rate * actual nights + late fee" }
      - { name: status, type: enum, source: system, default: "RESERVED", description: "RESERVED | CHECKED_IN | CHECKED_OUT | CANCELLED" }

  - name: GroomingStation
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: label, type: string, source: input, description: "Station label" }
      - { name: service_types, type: array, source: input, description: "Supported services subset of {WING_TRIM, NAIL_TRIM}" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | CLOSED (CLOSED stations reject new appointments)" }

  - name: GroomingAppointment
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; appointment owner" }
      - { name: grooming_station_id, type: string, source: input, description: "FK -> GroomingStation.id; station performing the service" }
      - { name: service_type, type: enum, source: input, description: "WING_TRIM | NAIL_TRIM; must be in station.service_types" }
      - { name: slot_start, type: datetime, source: input, description: "ISO8601 UTC slot start" }
      - { name: slot_end, type: datetime, source: input, description: "ISO8601 UTC slot end (> slot_start)" }
      - { name: fee_cents, type: integer, source: input, description: "Flat service fee in cents" }
      - { name: status, type: enum, source: system, default: "BOOKED", description: "BOOKED | COMPLETED | CANCELLED | NO_SHOW" }

  - name: FeedSubscription
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; subscriber (charge drawn from this customer's wallet)" }
      - { name: tier, type: enum, source: input, description: "STANDARD | PREMIUM (base fee tier)" }
      - { name: bird_count, type: integer, source: input, description: "Number of birds fed (>=1); scales per-bird fee" }
      - { name: fresh_feed, type: boolean, source: input, default: false, description: "True to include perishable fresh feed (adds surcharge, requires FRESH inventory)" }
      - { name: fresh_item_id, type: string, source: input, description: "FK -> InventoryItem.id; the FRESH inventory item allocated when fresh_feed is true; null otherwise" }
      - { name: monthly_charge_cents, type: integer, source: computed, description: "Computed monthly charge (tier base + per-bird + fresh surcharge, less club discount)" }
      - { name: created_charge_cents, type: integer, source: system, description: "Amount debited from wallet at creation (snapshot of first monthly_charge)" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | PAUSED | CANCELLED" }

  - name: InventoryItem
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: sku, type: string, source: input, description: "Stock-keeping unit code" }
      - { name: feed_kind, type: enum, source: input, description: "DRY | FRESH (FRESH is perishable, used by fresh subscriptions and special orders)" }
      - { name: quantity_on_hand, type: integer, source: system, description: "Unallocated units available" }
      - { name: quantity_allocated, type: integer, source: system, default: 0, description: "Units reserved to active subscriptions/orders (conserved: on_hand+allocated invariant under allocate/release)" }

  - name: SpecialOrder
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the ordering customer" }
      - { name: cage_item_id, type: string, source: input, description: "FK -> InventoryItem.id; DRY build component (cage kit) allocated on order create" }
      - { name: build_qty, type: integer, source: input, description: "Units of cage_item allocated for the build (>=1)" }
      - { name: line_items, type: array, source: input, description: "Array of {unit_price_cents:int, quantity:int, tax_rate:number}; priced with per-line rounding" }
      - { name: invoice_total_cents, type: integer, source: computed, description: "Sum over line items of (line_subtotal + round_half_up(line_subtotal*tax_rate))" }
      - { name: payment_status, type: enum, source: system, default: "UNPAID", description: "Payment axis: UNPAID | PAID | REFUNDED (independent of build_status)" }
      - { name: build_status, type: enum, source: system, default: "QUEUED", description: "Build axis: QUEUED | IN_BUILD | BUILT | DELIVERED | CANCELLED (independent of payment_status)" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---- CitesPermit: branching + revision loop (SUBMITTED->DRAFT) ----
  - entity: CitesPermit
    field: status
    initial_state: DRAFT
    terminal_states: [REVOKED, EXPIRED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /cites-permits/{id}/submit"
        actor: ComplianceOfficer
        preconditions: ["permit is DRAFT"]
        side_effects: []
      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /cites-permits/{id}/return-for-revision"
        actor: ComplianceOfficer
        preconditions: ["permit is SUBMITTED"]
        side_effects: []
        note: "Revision loop — cyclic edge back to DRAFT."
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /cites-permits/{id}/approve"
        actor: ComplianceOfficer
        preconditions:
          - "permit is SUBMITTED"
          - "valid_until is strictly after the current logical clock (ERR_PERMIT_EXPIRED_INPUT)"
        side_effects:
          - "Species.status set to ACTIVE (permit authorizes trade)"
      - from: APPROVED
        to: REVOKED
        trigger: "POST /cites-permits/{id}/revoke"
        actor: ComplianceOfficer
        preconditions: ["permit is APPROVED"]
        side_effects:
          - "CASCADE B link1: Species.status -> RESTRICTED"
          - "CASCADE B link2: every Bird of this species with status==LISTED -> SUSPENDED; Species.listed_bird_count recomputed"
      - from: APPROVED
        to: EXPIRED
        trigger: "system (logical clock passes valid_until)"
        actor: system
        preconditions: ["clock now >= valid_until"]
        side_effects:
          - "Species.status -> RESTRICTED"
          - "every Bird of this species with status==LISTED -> SUSPENDED"
        note: "Same cascade as revoke; evaluated lazily whenever the permit or its species is read/acted upon after the clock advances."

  # ---- Bird: livestock lifecycle with cross-entity guards ----
  - entity: Bird
    field: status
    initial_state: INTAKE
    terminal_states: [SOLD, REJECTED]
    transitions:
      - from: INTAKE
        to: IN_QUARANTINE
        trigger: "POST /birds/{id}/start-quarantine"
        actor: AviaryStaff
        preconditions:
          - "bird is INTAKE"
          - "a HOUSING cage with current_occupancy < capacity exists and is supplied as cage_id (ERR_NO_HOUSING_CAPACITY)"
        side_effects:
          - "creates QuarantineRecord (OPEN) for the bird"
          - "bird.housing_cage_id set; target CageUnit.current_occupancy += 1; cage.status -> OCCUPIED if occupancy==capacity"
          - "bird.provisional_risk_score computed"
      - from: IN_QUARANTINE
        to: CLEARED
        trigger: "system (QuarantineRecord -> CLEARED)"
        actor: system
        preconditions: ["the bird's QuarantineRecord reached CLEARED"]
        side_effects:
          - "bird.final_risk_score computed"
      - from: IN_QUARANTINE
        to: REJECTED
        trigger: "system (QuarantineRecord -> FAILED)"
        actor: system
        preconditions: ["the bird's QuarantineRecord reached FAILED"]
        side_effects:
          - "CASCADE A link1: bird.final_risk_score computed; bird -> REJECTED"
          - "CASCADE A link2: housing CageUnit.current_occupancy -= 1; bird.housing_cage_id cleared"
          - "CASCADE A link3: that CageUnit.status recomputed -> AVAILABLE when occupancy drops below capacity"
      - from: CLEARED
        to: LISTED
        trigger: "POST /birds/{id}/list-for-sale"
        actor: AviaryStaff
        preconditions:
          - "bird is CLEARED"
          - "Species.status == ACTIVE (ERR_SPECIES_RESTRICTED)"
          - "if Species.permit_required: an APPROVED, non-expired CitesPermit exists for the species (ERR_PERMIT_NOT_APPROVED)"
        side_effects:
          - "Species.listed_bird_count += 1"
      - from: LISTED
        to: SUSPENDED
        trigger: "system (permit revoke/expiry cascade)"
        actor: system
        preconditions: ["owning Species.status became RESTRICTED"]
        side_effects:
          - "Species.listed_bird_count -= 1"
      - from: SUSPENDED
        to: LISTED
        trigger: "POST /birds/{id}/relist"
        actor: AviaryStaff
        preconditions:
          - "bird is SUSPENDED"
          - "Species.status == ACTIVE (a fresh APPROVED permit restored the species)"
        side_effects:
          - "Species.listed_bird_count += 1"
      - from: LISTED
        to: SOLD
        trigger: "POST /birds/{id}/sell"
        actor: AviaryStaff
        preconditions:
          - "bird is LISTED"
          - "Species.status == ACTIVE (ERR_SPECIES_RESTRICTED)"
          - "buyer Customer.status == ACTIVE (ERR_CUSTOMER_SUSPENDED)"
        side_effects:
          - "Species.listed_bird_count -= 1"
          - "housing CageUnit.current_occupancy -= 1; cage.status recomputed; bird.housing_cage_id cleared"

  # ---- QuarantineRecord: CYCLIC (OPEN <-> UNDER_TEST retest loop) ----
  - entity: QuarantineRecord
    field: status
    initial_state: OPEN
    terminal_states: [CLEARED, FAILED]
    transitions:
      - from: OPEN
        to: UNDER_TEST
        trigger: "POST /quarantine-records/{id}/start-test"
        actor: AviaryStaff
        preconditions: ["record is OPEN"]
        side_effects: []
      - from: UNDER_TEST
        to: OPEN
        trigger: "POST /quarantine-records/{id}/record-test-result (result=RETEST)"
        actor: AviaryStaff
        preconditions: ["record is UNDER_TEST"]
        side_effects:
          - "retest_count += 1"
        note: "Cyclic edge: an inconclusive test returns the record to OPEN for another round."
      - from: UNDER_TEST
        to: UNDER_TEST
        trigger: "POST /quarantine-records/{id}/record-test-result (result=FAIL)"
        actor: AviaryStaff
        preconditions: ["record is UNDER_TEST"]
        side_effects:
          - "failed_test_count += 1"
        note: "Recording a failed test increments the counter but stays UNDER_TEST (self-loop)."
      - from: [OPEN, UNDER_TEST]
        to: CLEARED
        trigger: "POST /quarantine-records/{id}/clear"
        actor: AviaryStaff
        preconditions:
          - "current logical clock >= min_clear_at (ERR_QUARANTINE_TOO_EARLY)"
          - "final risk score (species base + penalties) < QUARANTINE_FAIL_THRESHOLD (ERR_RISK_TOO_HIGH_TO_CLEAR)"
        side_effects:
          - "owning Bird -> CLEARED (bubble up); Bird.final_risk_score set"
      - from: [OPEN, UNDER_TEST]
        to: FAILED
        trigger: "POST /quarantine-records/{id}/fail"
        actor: AviaryStaff
        preconditions: ["record is OPEN or UNDER_TEST"]
        side_effects:
          - "owning Bird -> REJECTED (triggers CASCADE A)"

  # ---- BoardingReservation: linear with revert (cancel) ----
  - entity: BoardingReservation
    field: status
    initial_state: RESERVED
    terminal_states: [CHECKED_OUT, CANCELLED]
    transitions:
      - from: RESERVED
        to: CHECKED_IN
        trigger: "POST /boarding-reservations/{id}/check-in"
        actor: AviaryStaff
        preconditions:
          - "reservation is RESERVED"
          - "current logical clock >= planned_check_in"
          - "cage.status != OUT_OF_SERVICE and cage.current_occupancy < cage.capacity (ERR_NO_BOARDING_CAPACITY)"
        side_effects:
          - "cage.current_occupancy += 1; cage.status -> OCCUPIED if occupancy==capacity"
      - from: CHECKED_IN
        to: CHECKED_OUT
        trigger: "POST /boarding-reservations/{id}/check-out"
        actor: AviaryStaff
        preconditions: ["reservation is CHECKED_IN"]
        side_effects:
          - "actual_check_out set to current clock; final_cost_cents computed"
          - "Customer.wallet_credit_cents -= final_cost_cents (ERR_INSUFFICIENT_WALLET if it would go below 0)"
          - "cage.current_occupancy -= 1; cage.status recomputed -> AVAILABLE when below capacity"
      - from: RESERVED
        to: CANCELLED
        trigger: "POST /boarding-reservations/{id}/cancel"
        actor: Customer
        preconditions: ["reservation is RESERVED (never checked in)"]
        side_effects: []
        note: "Only a not-yet-checked-in reservation may be cancelled; no cage occupancy was ever taken."

  # ---- GroomingAppointment: linear with cancel/no-show ----
  - entity: GroomingAppointment
    field: status
    initial_state: BOOKED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: BOOKED
        to: COMPLETED
        trigger: "POST /grooming-appointments/{id}/complete"
        actor: AviaryStaff
        preconditions: ["appointment is BOOKED"]
        side_effects:
          - "Customer.wallet_credit_cents -= fee_cents (ERR_INSUFFICIENT_WALLET if it would go below 0)"
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /grooming-appointments/{id}/cancel"
        actor: Customer
        preconditions: ["appointment is BOOKED"]
        side_effects: []
      - from: BOOKED
        to: NO_SHOW
        trigger: "POST /grooming-appointments/{id}/no-show"
        actor: AviaryStaff
        preconditions:
          - "appointment is BOOKED"
          - "current logical clock >= slot_end"
        side_effects: []

  # ---- FeedSubscription: cyclic ACTIVE <-> PAUSED, terminal CANCELLED ----
  - entity: FeedSubscription
    field: status
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    transitions:
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /feed-subscriptions/{id}/pause"
        actor: Customer
        preconditions: ["subscription is ACTIVE"]
        side_effects:
          - "if fresh_feed: release fresh allocation -> InventoryItem.quantity_allocated -= bird_count; quantity_on_hand += bird_count"
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /feed-subscriptions/{id}/resume"
        actor: Customer
        preconditions:
          - "subscription is PAUSED"
          - "if fresh_feed: fresh InventoryItem.quantity_on_hand >= bird_count (ERR_INSUFFICIENT_INVENTORY)"
        side_effects:
          - "if fresh_feed: re-allocate -> InventoryItem.quantity_allocated += bird_count; quantity_on_hand -= bird_count"
      - from: [ACTIVE, PAUSED]
        to: CANCELLED
        trigger: "POST /feed-subscriptions/{id}/cancel"
        actor: Customer
        preconditions: ["subscription is ACTIVE or PAUSED"]
        side_effects:
          - "if refund_wallet==true and subscription is ACTIVE (still within first cycle): Customer.wallet_credit_cents += created_charge_cents (COMPENSATION: exact reversal of creation debit)"
          - "if fresh_feed and subscription was ACTIVE: release fresh allocation -> quantity_allocated -= bird_count; quantity_on_hand += bird_count"

  # ---- SpecialOrder: PARALLEL dimensions payment_status x build_status ----
  - entity: SpecialOrder
    field: [payment_status, build_status]
    initial_state: { payment_status: UNPAID, build_status: QUEUED }
    terminal_states: { payment_status: [REFUNDED], build_status: [DELIVERED, CANCELLED] }
    transitions:
      # payment axis
      - from: { payment_status: UNPAID }
        to: { payment_status: PAID }
        trigger: "POST /special-orders/{id}/pay"
        actor: Customer
        preconditions:
          - "payment_status is UNPAID (ERR_ORDER_ALREADY_PAID)"
          - "build_status != CANCELLED (ERR_ORDER_CANCELLED)"
          - "Customer.wallet_credit_cents >= invoice_total_cents (ERR_INSUFFICIENT_WALLET)"
        side_effects:
          - "Customer.wallet_credit_cents -= invoice_total_cents"
      - from: { payment_status: PAID }
        to: { payment_status: REFUNDED }
        trigger: "POST /special-orders/{id}/refund"
        actor: StoreManager
        preconditions:
          - "payment_status is PAID"
          - "build_status == CANCELLED (only cancelled builds are refundable)"
        side_effects:
          - "Customer.wallet_credit_cents += invoice_total_cents (COMPENSATION: exact reversal of pay debit)"
      # build axis (independent)
      - from: { build_status: QUEUED }
        to: { build_status: IN_BUILD }
        trigger: "POST /special-orders/{id}/start-build"
        actor: StoreManager
        preconditions: ["build_status is QUEUED"]
        side_effects: []
      - from: { build_status: IN_BUILD }
        to: { build_status: BUILT }
        trigger: "POST /special-orders/{id}/mark-built"
        actor: StoreManager
        preconditions: ["build_status is IN_BUILD"]
        side_effects: []
      - from: { build_status: BUILT }
        to: { build_status: DELIVERED }
        trigger: "POST /special-orders/{id}/deliver"
        actor: StoreManager
        preconditions:
          - "build_status is BUILT"
          - "payment_status == PAID (ERR_ORDER_NOT_PAID) -- cross-axis guard: cannot deliver an unpaid order"
        side_effects:
          - "consume build allocation: InventoryItem.quantity_allocated -= build_qty (units leave the system as finished goods)"
      - from: { build_status: [QUEUED, IN_BUILD] }
        to: { build_status: CANCELLED }
        trigger: "POST /special-orders/{id}/cancel-build"
        actor: StoreManager
        preconditions: ["build_status is QUEUED or IN_BUILD"]
        side_effects:
          - "release build allocation: InventoryItem.quantity_allocated -= build_qty; quantity_on_hand += build_qty (COMPENSATION: exact reversal of create allocation)"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: cage-config-update-stale
    parent_entity: CageUnit
    write_endpoint: "PATCH /cage-units/{id}"
    occ_field: "expected_cage_version"
    description: |
      Updating a CageUnit's mutable config (nightly_rate_cents, capacity, status)
      against a version older than the cage's current version is rejected. A plain
      field update carries no state precondition that would otherwise reject a
      second sequential writer, so OCC on the parent version is the only mechanism
      that detects a writer acting on a stale view (e.g., after a check-in already
      advanced the cage's version and occupancy).
    error_id: ERR_STALE_CAGE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  # ---- COMBINATORIAL mode (a): >=3 inputs, non-linear (tier select + conditional surcharge + club discount) ----
  - name: subscription_monthly_charge
    trigger: "POST /feed-subscriptions (create); recomputed on read of monthly_charge_cents"
    algorithm: tiered_pricing
    formula: |
      base        = TIER_BASE_CENTS[tier]                 # STANDARD=4000, PREMIUM=7000
      per_bird    = PER_BIRD_CENTS * bird_count           # PER_BIRD_CENTS=1500
      subtotal    = base + per_bird
      if fresh_feed: subtotal = subtotal + FRESH_SURCHARGE_CENTS   # 2500
      discount_pct = CLUB_DISCOUNT_PCT[customer.club_tier]  # NONE=0.00, SILVER=0.10, GOLD=0.20
      monthly_charge_cents = round_half_up(subtotal * (1 - discount_pct))   # integer cents
    input_set: "single FeedSubscription; club_tier read from the owning Customer at creation time"
    constants:
      TIER_BASE_CENTS: { STANDARD: 4000, PREMIUM: 7000 }
      PER_BIRD_CENTS: 1500
      FRESH_SURCHARGE_CENTS: 2500
      CLUB_DISCOUNT_PCT: { NONE: 0.00, SILVER: 0.10, GOLD: 0.20 }
    precision: "integer cents, round_half_up on the final product"
    note: "created_charge_cents snapshots this value at creation; it is what a refund-on-cancel reverses."

  # ---- COMBINATORIAL mode (b): nested rounding, per-line then sum (order pinned) ----
  - name: special_order_invoice_total
    trigger: "POST /special-orders (create); stored in invoice_total_cents"
    algorithm: aggregation
    formula: |
      # ORDER IS PINNED: round each line's tax to cents FIRST, then sum lines.
      # (sum-then-round would produce a different total in cents.)
      invoice_total_cents = 0
      for line in line_items:
        line_subtotal = line.unit_price_cents * line.quantity
        line_tax      = round_half_up(line_subtotal * line.tax_rate)   # per-line rounding
        invoice_total_cents += line_subtotal + line_tax
    input_set: "the order's own line_items array"
    constants: {}
    precision: "integer cents; round_half_up applied per line BEFORE summation"
    note: "Round-per-line-then-sum, NOT sum-then-round. Divergence example: two lines with tax 218 (from 217.5) and 73 (from 72.5) sum to 291 per-line vs 290 sum-then-round."

  # ---- DUAL-VARIANT #1 (entity domain: BoardingReservation cost accounting) ----
  - name: boarding_cost
    trigger: "provisional at POST /boarding-reservations; final at check-out"
    algorithm: forward_looking
    formula: |
      nights_between(a, b) = ceil((b - a) / 86400 seconds)   # partial day counts as a full night, min 1
      # PROVISIONAL (variant estimate at reservation):
      provisional_cost_cents = cage.nightly_rate_cents * nights_between(planned_check_in, planned_check_out)
      # FINAL (variant actual at checkout):
      actual_nights = nights_between(planned_check_in, actual_check_out)
      late = LATE_FEE_CENTS if actual_check_out > planned_check_out else 0    # LATE_FEE_CENTS=2000
      final_cost_cents = cage.nightly_rate_cents * actual_nights + late
    input_set: "single reservation and its cage; provisional uses planned window, final uses actual checkout clock"
    constants:
      LATE_FEE_CENTS: 2000
    precision: "integer cents; nights via ceil (min 1)"
    variants:
      - name: provisional
        when: "at reservation creation (planned window)"
        difference: "uses planned_check_out; no late fee; charges nothing to wallet"
      - name: final
        when: "at check-out (actual clock)"
        difference: "uses actual_check_out (may exceed planned -> more nights + LATE_FEE_CENTS); debits wallet"

  # ---- DUAL-VARIANT #2 (entity domain: Bird / QuarantineRecord risk scoring) ----
  - name: bird_risk_score
    trigger: "provisional at start-quarantine; final at quarantine clear/fail"
    algorithm: weighted_scoring
    formula: |
      base = SPECIES_RISK[species.cites_appendix]     # I=40, II=25, III=15, NONE=5
      # PROVISIONAL (variant at intake):
      provisional_risk_score = base + (IMPORT_PENALTY if bird.imported else 0)   # IMPORT_PENALTY=20
      # FINAL (variant at quarantine close):
      final_risk_score = base
                       + FAILED_TEST_PENALTY * quarantine.failed_test_count      # 15 each
                       + RETEST_PENALTY * quarantine.retest_count                 # 5 each
      # CLEAR requires final_risk_score < QUARANTINE_FAIL_THRESHOLD (60); >= 60 must FAIL
    input_set: "single bird, its species, and its QuarantineRecord counters"
    constants:
      SPECIES_RISK: { I: 40, II: 25, III: 15, NONE: 5 }
      IMPORT_PENALTY: 20
      FAILED_TEST_PENALTY: 15
      RETEST_PENALTY: 5
      QUARANTINE_FAIL_THRESHOLD: 60
    precision: "integer points"
    variants:
      - name: provisional
        when: "at start-quarantine"
        difference: "adds IMPORT_PENALTY for imported birds; ignores test outcomes (none yet)"
      - name: final
        when: "at quarantine clear/fail"
        difference: "ignores import; adds per-failed-test and per-retest penalties; gates the CLEAR/FAIL boundary at 60"

  # ---- Derived-field reconciliation: inventory conservation ----
  - name: inventory_conservation
    trigger: "allocate on subscription/order create + resume; release on pause/cancel/cancel-build; consume on deliver"
    algorithm: aggregation
    formula: |
      # For every InventoryItem the following invariant holds across allocate/release:
      #   quantity_on_hand + quantity_allocated == total_units   (constant)
      # allocate(n): quantity_on_hand -= n; quantity_allocated += n
      # release(n):  quantity_allocated -= n; quantity_on_hand += n
      # consume(n):  quantity_allocated -= n   (finished goods leave; total_units decreases by n on deliver)
    input_set: "single InventoryItem"
    constants: {}
    precision: "integer units; quantity_on_hand and quantity_allocated never negative"
    note: "Conserved quantity #1 = quantity_on_hand + quantity_allocated (unchanged by any allocate/release pair)."

  # ---- Quarantine minimum-hold window ----
  - name: quarantine_min_clear_at
    trigger: "at start-quarantine (QuarantineRecord creation)"
    algorithm: threshold
    formula: |
      min_clear_at = opened_at + QUARANTINE_MIN_DAYS * 86400 seconds   # QUARANTINE_MIN_DAYS=14
      # CLEAR is rejected while current clock < min_clear_at
    input_set: "single QuarantineRecord"
    constants:
      QUARANTINE_MIN_DAYS: 14
    precision: "second-resolution instant comparison; boundary is >= (exactly at min_clear_at is allowed)"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_USER_CONTEXT
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this operation per §1.7"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: "For entity_backed Customer actions on an owned resource, X-User-ID must equal the resource's customer_id"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "Customer-owned mutations (subscriptions, boarding, grooming, special-orders)"

  - priority: 4
    category: existence
    check: "Path/body resource ids resolve (validated left-to-right)"
    error_id: "ERR_CUSTOMER_NOT_FOUND / ERR_SPECIES_NOT_FOUND / ERR_PERMIT_NOT_FOUND / ERR_BIRD_NOT_FOUND / ERR_QUARANTINE_NOT_FOUND / ERR_CAGE_NOT_FOUND / ERR_RESERVATION_NOT_FOUND / ERR_STATION_NOT_FOUND / ERR_APPOINTMENT_NOT_FOUND / ERR_SUBSCRIPTION_NOT_FOUND / ERR_INVENTORY_NOT_FOUND / ERR_ORDER_NOT_FOUND"
    http_status: 404
    applies_to: all endpoints with path/body ids

  - priority: 5
    category: business_constraint
    check: "Request body well-formed: required fields present, correct types, enum members valid, planned_check_out>planned_check_in, slot_end>slot_start, capacity>=1, bird_count>=1, build_qty>=1"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all mutating endpoints

  - priority: 6
    category: state
    check: "Target resource in a legal state for the requested transition (state-machine from: set)"
    error_id: "ERR_INVALID_STATE (domain-specific: ERR_ORDER_ALREADY_PAID, ERR_ORDER_NOT_PAID, ERR_ORDER_CANCELLED, ERR_QUARANTINE_NOT_OPEN, etc.)"
    http_status: 409
    applies_to: all transition endpoints

  - priority: 7
    category: state
    check: "OCC: expected_cage_version matches CageUnit.version on PATCH /cage-units/{id}"
    error_id: ERR_STALE_CAGE_VERSION
    http_status: 412
    applies_to: "PATCH /cage-units/{id}"

  - priority: 8
    category: business_referential
    check: "Listing/selling a Bird requires owning Species.status==ACTIVE and (if permit_required) an APPROVED non-expired CitesPermit"
    error_id: "ERR_SPECIES_RESTRICTED / ERR_PERMIT_NOT_APPROVED"
    http_status: 409
    applies_to: "POST /birds/{id}/list-for-sale, POST /birds/{id}/relist, POST /birds/{id}/sell"

  - priority: 9
    category: business_safety
    check: "Quarantine CLEAR requires clock>=min_clear_at AND final_risk_score < QUARANTINE_FAIL_THRESHOLD"
    error_id: "ERR_QUARANTINE_TOO_EARLY / ERR_RISK_TOO_HIGH_TO_CLEAR"
    http_status: 409
    applies_to: "POST /quarantine-records/{id}/clear"

  - priority: 10
    category: business_temporal
    check: "Boarding reservation window must not overlap another non-cancelled reservation on the same cage within CLEANING_BUFFER_HOURS (12h) after a prior planned_check_out"
    error_id: ERR_CAGE_TIME_CONFLICT
    http_status: 409
    applies_to: "POST /boarding-reservations"

  - priority: 11
    category: business_temporal
    check: "Grooming appointment [slot_start, slot_end) must not overlap another non-cancelled appointment on the same station (adjacency allowed, no buffer)"
    error_id: ERR_STATION_TIME_CONFLICT
    http_status: 409
    applies_to: "POST /grooming-appointments"

  - priority: 12
    category: business_constraint
    check: "Capacity: HOUSING/BOARDING cage occupancy must be < capacity before adding an occupant; grooming service_type must be in station.service_types"
    error_id: "ERR_NO_HOUSING_CAPACITY / ERR_NO_BOARDING_CAPACITY / ERR_SERVICE_NOT_OFFERED"
    http_status: 409
    applies_to: "start-quarantine, check-in, POST /grooming-appointments"

  - priority: 13
    category: business_constraint
    check: "Inventory sufficiency: allocating fresh feed / build components requires quantity_on_hand >= requested units"
    error_id: ERR_INSUFFICIENT_INVENTORY
    http_status: 409
    applies_to: "POST /feed-subscriptions (fresh), POST /feed-subscriptions/{id}/resume, POST /special-orders"

  - priority: 14
    category: business_fiscal
    check: "Wallet sufficiency: a debit (subscription charge, special-order pay, boarding/grooming settlement) must not drive wallet_credit_cents below 0"
    error_id: ERR_INSUFFICIENT_WALLET
    http_status: 402
    applies_to: "POST /feed-subscriptions, POST /special-orders/{id}/pay, check-out, complete"

  - priority: 15
    category: business_constraint
    check: "SUSPENDED customers cannot open new FeedSubscriptions or SpecialOrders"
    error_id: ERR_CUSTOMER_SUSPENDED
    http_status: 409
    applies_to: "POST /feed-subscriptions, POST /special-orders, POST /birds/{id}/sell"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Test-driving: logical clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-07-01T00:00:00Z; before any call here the clock reads exactly that default (never real wall-clock)."
    roles: [StoreManager, AviaryStaff, ComplianceOfficer, Customer]
    code: 200
    input: [to_iso8601]
    output: "null"
    side_effects: ["logical clock set to to_iso8601; lazily triggers permit auto-EXPIRED evaluation on next read/act"]

  # ---- Customer ----
  - method: POST
    path: "/customers"
    description: "Create a customer"
    roles: [StoreManager]
    code: 201
    input: [full_name, email]
    output: Customer
    side_effects: ["status=ACTIVE, club_tier=NONE, wallet_credit_cents=0"]
  - method: GET
    path: "/customers"
    description: "List customers"
    roles: [StoreManager, AviaryStaff, ComplianceOfficer, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: "Customer[]"
    side_effects: []
  - method: GET
    path: "/customers/{id}"
    description: "Get a customer"
    roles: [StoreManager, AviaryStaff, ComplianceOfficer, Customer]
    code: 200
    input: []
    output: Customer
    side_effects: []
  - method: POST
    path: "/customers/{id}/club-membership"
    description: "Set a customer's club tier (affects subscription discount)"
    roles: [StoreManager]
    code: 200
    input: [club_tier]
    output: Customer
    side_effects: ["club_tier updated"]
  - method: POST
    path: "/customers/{id}/wallet/adjustments"
    description: "Credit store credit to a customer's wallet (admin top-up)"
    roles: [StoreManager]
    code: 200
    input: [amount_cents]
    output: Customer
    side_effects: ["wallet_credit_cents += amount_cents"]
  - method: POST
    path: "/customers/{id}/suspend"
    description: "Suspend a customer"
    roles: [StoreManager]
    code: 200
    input: []
    output: Customer
    side_effects: ["status -> SUSPENDED"]

  # ---- Species ----
  - method: POST
    path: "/species"
    description: "Create a species record"
    roles: [ComplianceOfficer]
    code: 201
    input: [common_name, scientific_name, cites_appendix]
    output: Species
    side_effects: ["permit_required computed from cites_appendix; status=ACTIVE; listed_bird_count=0"]
  - method: GET
    path: "/species"
    description: "List species"
    roles: [StoreManager, AviaryStaff, ComplianceOfficer, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: "Species[]"
    side_effects: []
  - method: GET
    path: "/species/{id}"
    description: "Get a species"
    roles: [StoreManager, AviaryStaff, ComplianceOfficer, Customer]
    code: 200
    input: []
    output: Species
    side_effects: []
  - method: GET
    path: "/species/{id}/permits"
    description: "List CitesPermits for a species (reverse-reachability for CitesPermit.species_id)"
    roles: [StoreManager, AviaryStaff, ComplianceOfficer, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: "CitesPermit[]"
    side_effects: []

  # ---- CitesPermit ----
  - method: POST
    path: "/cites-permits"
    description: "Create a CITES permit in DRAFT"
    roles: [ComplianceOfficer]
    code: 201
    input: [species_id, permit_number, valid_until]
    output: CitesPermit
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/cites-permits/{id}"
    description: "Get a permit"
    roles: [StoreManager, AviaryStaff, ComplianceOfficer, Customer]
    code: 200
    input: []
    output: CitesPermit
    side_effects: []
  - method: POST
    path: "/cites-permits/{id}/submit"
    description: "Submit a DRAFT permit"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: CitesPermit
    side_effects: ["status -> SUBMITTED"]
  - method: POST
    path: "/cites-permits/{id}/return-for-revision"
    description: "Return a SUBMITTED permit to DRAFT (revision loop)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: CitesPermit
    side_effects: ["status -> DRAFT"]
  - method: POST
    path: "/cites-permits/{id}/approve"
    description: "Approve a SUBMITTED permit"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: CitesPermit
    side_effects: ["status -> APPROVED; Species.status -> ACTIVE"]
  - method: POST
    path: "/cites-permits/{id}/revoke"
    description: "Revoke an APPROVED permit (triggers CASCADE B)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: CitesPermit
    side_effects: ["status -> REVOKED; Species -> RESTRICTED; LISTED Birds of species -> SUSPENDED; listed_bird_count recomputed"]

  # ---- Bird ----
  - method: POST
    path: "/birds"
    description: "Register a livestock bird (INTAKE)"
    roles: [AviaryStaff]
    code: 201
    input: [species_id, band_code, "imported?", list_price_cents]
    output: Bird
    side_effects: ["status=INTAKE; housing_cage_id=null"]
  - method: GET
    path: "/birds"
    description: "List/filter birds (reverse-reachability for Bird.species_id and Bird.housing_cage_id)"
    roles: [StoreManager, AviaryStaff, ComplianceOfficer, Customer]
    code: 200
    input: ["species_id?", "housing_cage_id?", "limit?", "offset?"]
    output: "Bird[]"
    side_effects: []
  - method: GET
    path: "/birds/{id}"
    description: "Get a bird"
    roles: [StoreManager, AviaryStaff, ComplianceOfficer, Customer]
    code: 200
    input: []
    output: Bird
    side_effects: []
  - method: GET
    path: "/birds/{id}/quarantine-records"
    description: "List QuarantineRecords for a bird (reverse-reachability for QuarantineRecord.bird_id)"
    roles: [StoreManager, AviaryStaff, ComplianceOfficer, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: "QuarantineRecord[]"
    side_effects: []
  - method: POST
    path: "/birds/{id}/start-quarantine"
    description: "Move bird INTAKE->IN_QUARANTINE; open a QuarantineRecord and occupy a HOUSING cage"
    roles: [AviaryStaff]
    code: 200
    input: [cage_id]
    output: Bird
    side_effects: ["creates QuarantineRecord(OPEN); housing_cage_id set; cage occupancy+1; provisional_risk_score computed"]
  - method: POST
    path: "/birds/{id}/list-for-sale"
    description: "List a CLEARED bird for sale"
    roles: [AviaryStaff]
    code: 200
    input: []
    output: Bird
    side_effects: ["status -> LISTED; Species.listed_bird_count += 1"]
  - method: POST
    path: "/birds/{id}/relist"
    description: "Re-list a SUSPENDED bird after species restored"
    roles: [AviaryStaff]
    code: 200
    input: []
    output: Bird
    side_effects: ["status -> LISTED; Species.listed_bird_count += 1"]
  - method: POST
    path: "/birds/{id}/sell"
    description: "Sell a LISTED bird to a customer"
    roles: [AviaryStaff]
    code: 200
    input: [buyer_customer_id]
    output: Bird
    side_effects: ["status -> SOLD; listed_bird_count -= 1; housing cage occupancy -= 1"]

  # ---- QuarantineRecord ----
  - method: GET
    path: "/quarantine-records/{id}"
    description: "Get a quarantine record"
    roles: [StoreManager, AviaryStaff, ComplianceOfficer, Customer]
    code: 200
    input: []
    output: QuarantineRecord
    side_effects: []
  - method: POST
    path: "/quarantine-records/{id}/start-test"
    description: "OPEN -> UNDER_TEST"
    roles: [AviaryStaff]
    code: 200
    input: []
    output: QuarantineRecord
    side_effects: ["status -> UNDER_TEST"]
  - method: POST
    path: "/quarantine-records/{id}/record-test-result"
    description: "Record a test result: FAIL (failed_test_count+1, stays UNDER_TEST) or RETEST (retest_count+1, -> OPEN)"
    roles: [AviaryStaff]
    code: 200
    input: [result]
    output: QuarantineRecord
    side_effects: ["FAIL: failed_test_count+=1; RETEST: retest_count+=1 and status->OPEN"]
  - method: POST
    path: "/quarantine-records/{id}/clear"
    description: "Clear quarantine (guarded by min-hold window and risk threshold); bubbles Bird->CLEARED"
    roles: [AviaryStaff]
    code: 200
    input: []
    output: QuarantineRecord
    side_effects: ["status -> CLEARED; Bird -> CLEARED; Bird.final_risk_score set"]
  - method: POST
    path: "/quarantine-records/{id}/fail"
    description: "Fail quarantine; bubbles Bird->REJECTED (triggers CASCADE A)"
    roles: [AviaryStaff]
    code: 200
    input: []
    output: QuarantineRecord
    side_effects: ["status -> FAILED; Bird -> REJECTED; cage occupancy released; cage status recomputed"]

  # ---- CageUnit ----
  - method: POST
    path: "/cage-units"
    description: "Create a cage unit"
    roles: [StoreManager]
    code: 201
    input: [label, cage_class, capacity, "nightly_rate_cents?"]
    output: CageUnit
    side_effects: ["status=AVAILABLE; current_occupancy=0"]
  - method: GET
    path: "/cage-units"
    description: "List cage units"
    roles: [StoreManager, AviaryStaff, ComplianceOfficer, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: "CageUnit[]"
    side_effects: []
  - method: GET
    path: "/cage-units/{id}"
    description: "Get a cage unit"
    roles: [StoreManager, AviaryStaff, ComplianceOfficer, Customer]
    code: 200
    input: []
    output: CageUnit
    side_effects: []
  - method: PATCH
    path: "/cage-units/{id}"
    description: "Update mutable cage config with OCC on version"
    roles: [StoreManager]
    code: 200
    input: [expected_cage_version, "nightly_rate_cents?", "capacity?", "status?"]
    output: CageUnit
    side_effects: ["fields updated; increments CageUnit.version by 1"]

  # ---- BoardingReservation ----
  - method: POST
    path: "/boarding-reservations"
    description: "Create a boarding reservation on a BOARDING cage"
    roles: [Customer]
    code: 201
    input: [customer_id, cage_id, planned_check_in, planned_check_out]
    output: BoardingReservation
    side_effects: ["status=RESERVED; provisional_cost_cents computed; cage-time-conflict + capacity checks applied"]
  - method: GET
    path: "/boarding-reservations"
    description: "List/filter reservations (reverse-reachability for customer_id and cage_id)"
    roles: [StoreManager, AviaryStaff, ComplianceOfficer, Customer]
    code: 200
    input: ["customer_id?", "cage_id?", "limit?", "offset?"]
    output: "BoardingReservation[]"
    side_effects: []
  - method: GET
    path: "/boarding-reservations/{id}"
    description: "Get a reservation"
    roles: [StoreManager, AviaryStaff, ComplianceOfficer, Customer]
    code: 200
    input: []
    output: BoardingReservation
    side_effects: []
  - method: POST
    path: "/boarding-reservations/{id}/check-in"
    description: "RESERVED -> CHECKED_IN (occupies cage)"
    roles: [AviaryStaff]
    code: 200
    input: []
    output: BoardingReservation
    side_effects: ["cage occupancy +1; cage status recomputed"]
  - method: POST
    path: "/boarding-reservations/{id}/check-out"
    description: "CHECKED_IN -> CHECKED_OUT; compute final_cost_cents and debit wallet"
    roles: [AviaryStaff]
    code: 200
    input: []
    output: BoardingReservation
    side_effects: ["actual_check_out set; final_cost_cents computed; wallet -= final_cost_cents; cage occupancy -1"]
  - method: POST
    path: "/boarding-reservations/{id}/cancel"
    description: "Cancel a RESERVED reservation"
    roles: [Customer]
    code: 200
    input: []
    output: BoardingReservation
    side_effects: ["status -> CANCELLED"]

  # ---- GroomingStation ----
  - method: POST
    path: "/grooming-stations"
    description: "Create a grooming station"
    roles: [StoreManager]
    code: 201
    input: [label, service_types]
    output: GroomingStation
    side_effects: ["status=OPEN"]
  - method: GET
    path: "/grooming-stations"
    description: "List grooming stations"
    roles: [StoreManager, AviaryStaff, ComplianceOfficer, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: "GroomingStation[]"
    side_effects: []
  - method: GET
    path: "/grooming-stations/{id}"
    description: "Get a grooming station"
    roles: [StoreManager, AviaryStaff, ComplianceOfficer, Customer]
    code: 200
    input: []
    output: GroomingStation
    side_effects: []
  - method: POST
    path: "/grooming-stations/{id}/close"
    description: "Close a station (rejects new appointments)"
    roles: [StoreManager]
    code: 200
    input: []
    output: GroomingStation
    side_effects: ["status -> CLOSED"]

  # ---- GroomingAppointment ----
  - method: POST
    path: "/grooming-appointments"
    description: "Book a grooming appointment (station slot overlap + service check)"
    roles: [Customer]
    code: 201
    input: [customer_id, grooming_station_id, service_type, slot_start, slot_end, fee_cents]
    output: GroomingAppointment
    side_effects: ["status=BOOKED; station-time-conflict + service-offered checks applied"]
  - method: GET
    path: "/grooming-appointments"
    description: "List/filter appointments (reverse-reachability for customer_id and grooming_station_id)"
    roles: [StoreManager, AviaryStaff, ComplianceOfficer, Customer]
    code: 200
    input: ["customer_id?", "grooming_station_id?", "limit?", "offset?"]
    output: "GroomingAppointment[]"
    side_effects: []
  - method: GET
    path: "/grooming-appointments/{id}"
    description: "Get an appointment"
    roles: [StoreManager, AviaryStaff, ComplianceOfficer, Customer]
    code: 200
    input: []
    output: GroomingAppointment
    side_effects: []
  - method: POST
    path: "/grooming-appointments/{id}/complete"
    description: "Complete an appointment and settle fee from wallet"
    roles: [AviaryStaff]
    code: 200
    input: []
    output: GroomingAppointment
    side_effects: ["status -> COMPLETED; wallet -= fee_cents"]
  - method: POST
    path: "/grooming-appointments/{id}/cancel"
    description: "Cancel a BOOKED appointment"
    roles: [Customer]
    code: 200
    input: []
    output: GroomingAppointment
    side_effects: ["status -> CANCELLED"]
  - method: POST
    path: "/grooming-appointments/{id}/no-show"
    description: "Mark a past-slot BOOKED appointment as NO_SHOW"
    roles: [AviaryStaff]
    code: 200
    input: []
    output: GroomingAppointment
    side_effects: ["status -> NO_SHOW"]

  # ---- FeedSubscription ----
  - method: POST
    path: "/feed-subscriptions"
    description: "Create a feed subscription; charge first cycle to wallet; allocate fresh inventory if fresh_feed"
    roles: [Customer]
    code: 201
    input: [customer_id, tier, bird_count, "fresh_feed?", "fresh_item_id?"]
    output: FeedSubscription
    side_effects: ["monthly_charge_cents + created_charge_cents computed; wallet -= created_charge_cents; if fresh: InventoryItem.quantity_allocated += bird_count, quantity_on_hand -= bird_count; status=ACTIVE"]
  - method: GET
    path: "/feed-subscriptions"
    description: "List/filter subscriptions (reverse-reachability for customer_id and fresh_item_id)"
    roles: [StoreManager, AviaryStaff, ComplianceOfficer, Customer]
    code: 200
    input: ["customer_id?", "fresh_item_id?", "limit?", "offset?"]
    output: "FeedSubscription[]"
    side_effects: []
  - method: GET
    path: "/feed-subscriptions/{id}"
    description: "Get a subscription"
    roles: [StoreManager, AviaryStaff, ComplianceOfficer, Customer]
    code: 200
    input: []
    output: FeedSubscription
    side_effects: []
  - method: POST
    path: "/feed-subscriptions/{id}/pause"
    description: "ACTIVE -> PAUSED (release fresh allocation)"
    roles: [Customer]
    code: 200
    input: []
    output: FeedSubscription
    side_effects: ["status -> PAUSED; if fresh: release allocation"]
  - method: POST
    path: "/feed-subscriptions/{id}/resume"
    description: "PAUSED -> ACTIVE (re-allocate fresh if available)"
    roles: [Customer]
    code: 200
    input: []
    output: FeedSubscription
    side_effects: ["status -> ACTIVE; if fresh: re-allocate (inventory sufficiency checked)"]
  - method: POST
    path: "/feed-subscriptions/{id}/cancel"
    description: "Cancel subscription; optional wallet refund of created_charge_cents (compensation)"
    roles: [Customer]
    code: 200
    input: ["refund_wallet?"]
    output: FeedSubscription
    side_effects: ["status -> CANCELLED; if refund_wallet and was ACTIVE: wallet += created_charge_cents; release fresh allocation if held"]

  # ---- InventoryItem ----
  - method: POST
    path: "/inventory-items"
    description: "Create an inventory item with initial stock"
    roles: [StoreManager]
    code: 201
    input: [sku, feed_kind, quantity_on_hand]
    output: InventoryItem
    side_effects: ["quantity_allocated=0"]
  - method: GET
    path: "/inventory-items"
    description: "List inventory items"
    roles: [StoreManager, AviaryStaff, ComplianceOfficer, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: "InventoryItem[]"
    side_effects: []
  - method: GET
    path: "/inventory-items/{id}"
    description: "Get an inventory item"
    roles: [StoreManager, AviaryStaff, ComplianceOfficer, Customer]
    code: 200
    input: []
    output: InventoryItem
    side_effects: []
  - method: POST
    path: "/inventory-items/{id}/restock"
    description: "Add units to quantity_on_hand"
    roles: [StoreManager]
    code: 200
    input: [units]
    output: InventoryItem
    side_effects: ["quantity_on_hand += units"]

  # ---- SpecialOrder ----
  - method: POST
    path: "/special-orders"
    description: "Create a special/cage-build order; allocate DRY build components; compute invoice_total_cents"
    roles: [Customer]
    code: 201
    input: [customer_id, cage_item_id, build_qty, line_items]
    output: SpecialOrder
    side_effects: ["payment_status=UNPAID; build_status=QUEUED; invoice_total_cents computed; InventoryItem.quantity_allocated += build_qty, quantity_on_hand -= build_qty"]
  - method: GET
    path: "/special-orders"
    description: "List/filter special orders (reverse-reachability for customer_id and cage_item_id)"
    roles: [StoreManager, AviaryStaff, ComplianceOfficer, Customer]
    code: 200
    input: ["customer_id?", "cage_item_id?", "limit?", "offset?"]
    output: "SpecialOrder[]"
    side_effects: []
  - method: GET
    path: "/special-orders/{id}"
    description: "Get a special order"
    roles: [StoreManager, AviaryStaff, ComplianceOfficer, Customer]
    code: 200
    input: []
    output: SpecialOrder
    side_effects: []
  - method: POST
    path: "/special-orders/{id}/pay"
    description: "Pay an UNPAID order from wallet"
    roles: [Customer]
    code: 200
    input: []
    output: SpecialOrder
    side_effects: ["payment_status -> PAID; wallet -= invoice_total_cents"]
  - method: POST
    path: "/special-orders/{id}/refund"
    description: "Refund a PAID+CANCELLED order to wallet (compensation)"
    roles: [StoreManager]
    code: 200
    input: []
    output: SpecialOrder
    side_effects: ["payment_status -> REFUNDED; wallet += invoice_total_cents"]
  - method: POST
    path: "/special-orders/{id}/start-build"
    description: "QUEUED -> IN_BUILD"
    roles: [StoreManager]
    code: 200
    input: []
    output: SpecialOrder
    side_effects: ["build_status -> IN_BUILD"]
  - method: POST
    path: "/special-orders/{id}/mark-built"
    description: "IN_BUILD -> BUILT"
    roles: [StoreManager]
    code: 200
    input: []
    output: SpecialOrder
    side_effects: ["build_status -> BUILT"]
  - method: POST
    path: "/special-orders/{id}/deliver"
    description: "BUILT -> DELIVERED (requires PAID); consumes build allocation"
    roles: [StoreManager]
    code: 200
    input: []
    output: SpecialOrder
    side_effects: ["build_status -> DELIVERED; InventoryItem.quantity_allocated -= build_qty"]
  - method: POST
    path: "/special-orders/{id}/cancel-build"
    description: "QUEUED/IN_BUILD -> CANCELLED; release build allocation (compensation)"
    roles: [StoreManager]
    code: 200
    input: []
    output: SpecialOrder
    side_effects: ["build_status -> CANCELLED; quantity_allocated -= build_qty; quantity_on_hand += build_qty"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_MISSING_USER_CONTEXT, http: 400, condition: "X-User-ID or X-User-Role header missing/invalid" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Customer acting on a resource whose customer_id != X-User-ID" }
  # --- not found ---
  - { id: ERR_CUSTOMER_NOT_FOUND, http: 404, condition: "Customer id does not resolve" }
  - { id: ERR_SPECIES_NOT_FOUND, http: 404, condition: "Species id does not resolve" }
  - { id: ERR_PERMIT_NOT_FOUND, http: 404, condition: "CitesPermit id does not resolve" }
  - { id: ERR_BIRD_NOT_FOUND, http: 404, condition: "Bird id does not resolve" }
  - { id: ERR_QUARANTINE_NOT_FOUND, http: 404, condition: "QuarantineRecord id does not resolve" }
  - { id: ERR_CAGE_NOT_FOUND, http: 404, condition: "CageUnit id does not resolve" }
  - { id: ERR_RESERVATION_NOT_FOUND, http: 404, condition: "BoardingReservation id does not resolve" }
  - { id: ERR_STATION_NOT_FOUND, http: 404, condition: "GroomingStation id does not resolve" }
  - { id: ERR_APPOINTMENT_NOT_FOUND, http: 404, condition: "GroomingAppointment id does not resolve" }
  - { id: ERR_SUBSCRIPTION_NOT_FOUND, http: 404, condition: "FeedSubscription id does not resolve" }
  - { id: ERR_INVENTORY_NOT_FOUND, http: 404, condition: "InventoryItem id does not resolve" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "SpecialOrder id does not resolve" }
  # --- request validation ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, bad type, invalid enum, or invalid interval/quantity (end<=start, capacity<1, bird_count<1, build_qty<1)" }
  - { id: ERR_PERMIT_EXPIRED_INPUT, http: 400, condition: "Approving a permit whose valid_until is not strictly after the current clock" }
  # --- state ---
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a legal state for the requested transition" }
  - { id: ERR_QUARANTINE_NOT_OPEN, http: 409, condition: "start-test requires record OPEN; record-test-result requires UNDER_TEST" }
  - { id: ERR_ORDER_ALREADY_PAID, http: 409, condition: "pay called on a non-UNPAID order" }
  - { id: ERR_ORDER_NOT_PAID, http: 409, condition: "deliver called on an order whose payment_status != PAID" }
  - { id: ERR_ORDER_CANCELLED, http: 409, condition: "pay called on an order whose build_status == CANCELLED" }
  # --- concurrency ---
  - { id: ERR_STALE_CAGE_VERSION, http: 412, condition: "expected_cage_version != CageUnit.version on PATCH /cage-units/{id}" }
  # --- business_referential ---
  - { id: ERR_SPECIES_RESTRICTED, http: 409, condition: "List/relist/sell a bird whose Species.status == RESTRICTED" }
  - { id: ERR_PERMIT_NOT_APPROVED, http: 409, condition: "List a bird of a permit_required species lacking an APPROVED non-expired CitesPermit" }
  # --- business_safety ---
  - { id: ERR_QUARANTINE_TOO_EARLY, http: 409, condition: "clear before current clock >= min_clear_at" }
  - { id: ERR_RISK_TOO_HIGH_TO_CLEAR, http: 409, condition: "clear when final_risk_score >= QUARANTINE_FAIL_THRESHOLD (60)" }
  # --- business_temporal ---
  - { id: ERR_CAGE_TIME_CONFLICT, http: 409, condition: "Boarding window overlaps another non-cancelled reservation on the cage within the 12h cleaning buffer" }
  - { id: ERR_STATION_TIME_CONFLICT, http: 409, condition: "Grooming [slot_start,slot_end) overlaps another non-cancelled appointment on the station" }
  # --- business_constraint ---
  - { id: ERR_NO_HOUSING_CAPACITY, http: 409, condition: "HOUSING cage occupancy == capacity at start-quarantine" }
  - { id: ERR_NO_BOARDING_CAPACITY, http: 409, condition: "BOARDING cage occupancy == capacity (or OUT_OF_SERVICE) at check-in" }
  - { id: ERR_SERVICE_NOT_OFFERED, http: 409, condition: "Requested service_type not in station.service_types (or station CLOSED)" }
  - { id: ERR_INSUFFICIENT_INVENTORY, http: 409, condition: "quantity_on_hand < requested units for fresh allocation / build allocation" }
  - { id: ERR_CUSTOMER_SUSPENDED, http: 409, condition: "SUSPENDED customer opening subscription/order or buying a bird" }
  # --- business_fiscal ---
  - { id: ERR_INSUFFICIENT_WALLET, http: 402, condition: "Debit would drive wallet_credit_cents below 0" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Customer
    description: "End customer; owns and manages their own subscriptions, boarding reservations, grooming appointments, and special orders."
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /boarding-reservations — create own reservation"
      - "POST /boarding-reservations/{id}/cancel — cancel own reservation"
      - "POST /grooming-appointments — book own appointment"
      - "POST /grooming-appointments/{id}/cancel — cancel own appointment"
      - "POST /feed-subscriptions — open own subscription"
      - "POST /feed-subscriptions/{id}/pause|resume|cancel — manage own subscription"
      - "POST /special-orders — open own order"
      - "POST /special-orders/{id}/pay — pay own order"
    shared_operations:
      - "GET reads across the catalog"

  - name: AviaryStaff
    description: "Frontline livestock/health/service staff; intake, quarantine lifecycle, listing, sales, boarding check-in/out, grooming service."
    identity: "opaque"
    exclusive_operations:
      - "POST /birds — register livestock"
      - "POST /birds/{id}/start-quarantine|list-for-sale|relist|sell"
      - "POST /quarantine-records/{id}/start-test|record-test-result|clear|fail"
      - "POST /boarding-reservations/{id}/check-in|check-out"
      - "POST /grooming-appointments/{id}/complete|no-show"
    shared_operations:
      - "GET reads across the catalog"

  - name: ComplianceOfficer
    description: "Regulatory officer; owns Species records and the CITES permit lifecycle."
    identity: "opaque"
    exclusive_operations:
      - "POST /species — create species"
      - "POST /cites-permits — create permit"
      - "POST /cites-permits/{id}/submit|return-for-revision|approve|revoke"
    shared_operations:
      - "GET reads across the catalog"

  - name: StoreManager
    description: "Store operations/admin; owns customers, cages, grooming stations, inventory, pricing config, order build lifecycle and refunds."
    identity: "opaque"
    exclusive_operations:
      - "POST /customers — create customer"
      - "POST /customers/{id}/club-membership|wallet/adjustments|suspend"
      - "POST /cage-units, PATCH /cage-units/{id}"
      - "POST /grooming-stations, POST /grooming-stations/{id}/close"
      - "POST /inventory-items, POST /inventory-items/{id}/restock"
      - "POST /special-orders/{id}/start-build|mark-built|deliver|cancel-build|refund"
      - "POST /_clock/set_current_utc — test-driving clock control"
    shared_operations:
      - "GET reads across the catalog"
