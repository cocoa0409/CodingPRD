  # ===========================================================================
  # Section: endpoints
  # ===========================================================================
  - section: endpoints
    instances:
      - name: response_envelope_shape_success_and_error
        claim_type: standard_crud
        grounds: ["response_envelope"]
        distinguishing_aspect: "Success responses carry meta.api_request_id, response_type object/array and data; error responses carry response_type error and data.error_id/data.message."
        test_recipe:
          setup: ["one carrier"]
          setup_api_calls:
            - call: "POST /agency/carriers"
              payload: { name: "Carrier ENV", carrier_code: "CENV" }
              as: AgencyAdmin
              captures: { c_id: "$.data.id" }
          trigger:
            - call: "GET /agency/carriers/${c_id}"
              payload: {}
              as: AgencyAdmin
            - call: "GET /agency/carriers/44444444-4444-4444-4444-444444444444"
              payload: {}
              as: AgencyAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "Success GET: meta.api_request_id present, response_type == object, data.id == carrier id"
            - "Error GET: response_type == error and data.error_id == ERR_NOT_FOUND"

      - name: computed_read_matches_calculation
        claim_type: computed_read
        grounds: ["endpoints.\"GET /agency/producers/{producerId}", "calculations.producer_balance_recompute"]
        distinguishing_aspect: "GET producer is a computed read: after a 400000 payout is marked PAID against a 1200000 balance, the endpoint reports commission_balance_cents == 800000 immediately (immediate consistency)."
        test_recipe:
          setup: ["producer tax_form_on_file=true; bound policy (balance 1200000); payout 400000 created and PAID"]
          setup_api_calls:
            - call: "POST /agency/producers"
              payload: { name: "CR C", license_number: "LIC-E1E", tax_form_on_file: true }
              as: AgencyAdmin
              captures: { w_id: "$.data.id", w_v: "$.data.version" }
            - call: "POST /agency/carriers"
              payload: { name: "Carrier E1E", carrier_code: "CE1E" }
              as: AgencyAdmin
              captures: { c_id: "$.data.id" }
            - call: "POST /agency/products"
              payload: { carrier_id: "${c_id}", product_code: "PE1E", name: "Product E1E", line_of_business: "LIFE" }
              as: AgencyAdmin
              captures: { p_id: "$.data.id", p_v: "$.data.version" }
            - call: "POST /agency/products/${p_id}/commission-schedules"
              payload: { tier: "STANDARD", commission_rate_bps: 5000, override_rate_bps: 0, advance_months: 12, effective_from: "2026-01-01", expected_product_version: "${p_v}" }
              as: AgencyAdmin
            - call: "POST /agency/policies"
              payload: { policy_number: "P-E1E", product_id: "${p_id}", producer_id: "${w_id}", insured_name: "I", billing_type: "DIRECT_BILL", premium_annual_cents: 2400000, effective_date: "2026-08-01" }
              as: AgencyAdmin
              captures: { pol_id: "$.data.id" }
            - call: "GET /agency/producer-disclosures"
              payload: { policy_id: "${pol_id}" }
              as: AgencyAdmin
              captures: { d_id: "$.data[0].id" }
            - call: "POST /agency/producer-disclosures/${d_id}/deliver"
              payload: {}
              as: AgencyAdmin
            - call: "POST /agency/policies/${pol_id}/bind"
              payload: {}
              as: AgencyAdmin
            - call: "GET /agency/producers/${w_id}"
              payload: {}
              as: AgencyAdmin
              captures: { w_v2: "$.data.version", bal0: "$.data.commission_balance_cents" }
            - call: "POST /agency/producers/${w_id}/payouts"
              payload: { amount_cents: 400000, expected_producer_version: "${w_v2}" }
              as: AgencyAdmin
              captures: { po_id: "$.data.id" }
          trigger:
            - call: "POST /agency/payouts/${po_id}/mark-paid"
              payload: {}
              as: AgencyAdmin
            - call: "GET /agency/producers/${w_id}"
              payload: {}
              as: AgencyAdmin
              captures: { bal1: "$.data.commission_balance_cents" }
          assert:
            - "Balance before payout == 1200000"
            - "Balance after mark-paid == 800000 in the immediately following read (no lag)"

  # ===========================================================================
  # Section: errors (every catalog error triggerable; §1.8-covered ones stubbed)
