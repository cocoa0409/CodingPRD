          rationale: "That §1.8 instance already walks the full four-hop chain end to end — substantiate flips the case, re-derives Facility.posture to SANCTIONED, reverts a second VALIDATED submission to DRAFT with a FACILITY_SANCTIONED FATAL finding, and recomputes the measure under the audit_adjusted variant — so a separate corner case would only re-assert the same hops."

