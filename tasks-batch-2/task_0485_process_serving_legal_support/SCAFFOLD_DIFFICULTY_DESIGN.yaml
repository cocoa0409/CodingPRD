              payload: { county_id: "${county_id}" }
              as: Admin
            - call: "POST /clients"
              payload: { firm_name: "Tau Law", email: "u@law.com" }
              as: Admin
              captures: { client_id: $.data.id }
            - call: "POST /service-requests"
              payload: { client_id: "${client_id}", county_id: "${county_id}", recipient_name: "R", service_address: "2 St", service_lat: 37.9, service_lng: -118.9 }
              as: Dispatcher
              captures: { sr_id: $.data.id }
            - call: "POST /service-requests/${sr_id}/documents"
              payload: { doc_type: "SUMMONS", page_count: 1 }
              as: Dispatcher
            - call: "POST /service-requests/${sr_id}/submit"
              payload: {}
              as: Dispatcher
              captures: { sr_v: $.data.version }
            - call: "POST /service-requests/${sr_id}/assignments"
              payload: { server_id: "${server_id}", expected_service_request_version: "${sr_v}" }
              as: Dispatcher
              captures: { asg_id: $.data.id }
            - call: "POST /assignments/${asg_id}/accept"
              payload: {}
              as: Server
              as_user_id: "${server_id}"
            - call: "GET /servers/${server_id}"
              payload: {}
              as: Dispatcher
              captures: { mid_count: $.data.active_assignment_count }
          trigger:
            - call: "POST /service-requests/${sr_id}/reassign"
              payload: {}
              as: Dispatcher
          assert:
            - "Server.${server_id}.active_assignment_count was 1 after accept"
            - "Assignment.${asg_id}.status == REASSIGNED"
            - "Server.${server_id}.active_assignment_count == 0"
