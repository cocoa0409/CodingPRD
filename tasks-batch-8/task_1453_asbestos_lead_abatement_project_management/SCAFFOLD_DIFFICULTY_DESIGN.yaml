            - { call: "POST /abatement/surveys/${s_id}/submit", payload: {}, as: ContractorAdmin }
            - { call: "POST /abatement/samples/${samp_a}/result", payload: { lab_result: "POSITIVE", asbestos_pct: 40 }, as: IndustrialHygienist, as_user_id: "ih_1" }
            - { call: "POST /abatement/surveys/${s_id}/finalize", payload: {}, as: ContractorAdmin }
            - { call: "POST /abatement/workers", payload: { full_name: "Han One", certification_level: "HANDLER", cert_expires_at: "2027-01-01T00:00:00Z", medical_clearance_expires_at: "2027-01-01T00:00:00Z", respirator_fit_expires_at: "2027-01-01T00:00:00Z" }, as: ContractorAdmin, captures: { w_id: "$.data.id" } }
            - { call: "POST /abatement/assignments", payload: { project_id: "${p_id}", worker_id: "${w_id}", role_on_site: "HANDLER", start_at: "2026-08-11T00:00:00Z", end_at: "2026-08-20T00:00:00Z" }, as: ContractorAdmin, captures: { a1_id: "$.data.id" } }
          trigger:
            - { call: "POST /abatement/assignments", payload: { project_id: "${p_id}", worker_id: "${w_id}", role_on_site: "HANDLER", start_at: "2026-08-21T00:00:00Z", end_at: "2026-08-25T00:00:00Z" }, as: ContractorAdmin, captures: { a2_id: "$.data.id" } }
            - { call: "GET /abatement/workers/${w_id}", payload: {}, as: ContractorAdmin, captures: { h_mid: "$.data.assigned_scheduled_hours" } }
            - { call: "POST /abatement/assignments/${a2_id}/cancel", payload: {}, as: ContractorAdmin }
            - { call: "GET /abatement/workers/${w_id}", payload: {}, as: ContractorAdmin, captures: { h_after: "$.data.assigned_scheduled_hours" } }
          assert:
            - "Worker.${w_id}.assigned_scheduled_hours == 312 after A2 create (216 + 96)"
            - "Worker.${w_id}.assigned_scheduled_hours == 216 after A2 cancel (invariant restored)"
            - "CrewAssignment.${a1_id}.status remains SCHEDULED throughout"
