                source_system_id: "${src_id}"
                batch_label: "Conditional Action Single"
                records:
                  - external_id: "CA1"
                    email_raw: "ca1@example.com"
                    phone_raw: "+1 (555) 550-0001"
                    loyalty_number: "LY00005501"
                    first_name: "Ada"
                    last_name: "Alpha"
                    postal_code: "10001"
                    address_line: null
                    event_timestamp: "2026-07-30T10:00:00Z"
                    consent_signals:
                      - { channel: "EMAIL", purpose: "MARKETING", consent_state: "OPT_IN" }
              as: DataEngineer
              as_user_id: "u_eng"
              captures: { batch_id: "$.data.id" }
            - call: "POST /cdp/ingest-batches/${batch_id}/validate"
              payload: {}
              as: DataEngineer
              as_user_id: "u_eng"
            - call: "POST /cdp/ingest-batches/${batch_id}/promote"
              payload: {}
              as: DataEngineer
              as_user_id: "u_eng"
            - call: "GET /cdp/profiles"
              payload: { origin_batch_id: "${batch_id}" }
              as: PrivacyOfficer
              as_user_id: "u_privacy"
              captures: { subject_id: "$.data[0].id", subject_v: "$.data[0].version" }
            - call: "POST /cdp/destinations"
              payload:
                code: "EP_COND_DEST"
                platform_kind: "MESSAGING"
                channel: "EMAIL"
                hashing_algorithm: "SHA256_EMAIL_LOWER"
                daily_hash_quota: 300
                min_audience_size: 1
                min_match_rate: 0.10
              as: DataPlatformAdmin
              as_user_id: "u_admin"
              captures: { dest_id: "$.data.id" }
            - call: "POST /cdp/segments"
              payload:
                name: "Conditional Action Segment"
                criteria:
                  - { attribute: "postal_code", operator: "EQ", value: "10001" }
              as: SegmentAnalyst
              as_user_id: "u_analyst"
              captures: { seg_id: "$.data.id" }
            - call: "POST /cdp/segments/${seg_id}/submit-for-review"
