# =============================================================================
# §1.9 Scaffold Corner Design (Breadth Probe)
# task_2246_snap_retailer_authorization_redemption_compliance
#
# Walk of references/claim-extraction-guide.md against this scaffold's §1.1-§1.7.
# Section / claim_type vocabulary is taken verbatim from that guide; nothing new
# is invented. Corners already asserted by a §1.8 instance appear as
# excluded_because: stubs naming that instance.
#
# Reusable chains are anchored on first use (&k_owner, &k_store, ... ) and reused
# by alias. The logical clock default is 2026-08-01T00:00:00Z; chains that need
# no time travel set no clock.
# =============================================================================

scaffold_corner_design:

  - section: entities
    instances:

      - name: owner_creation_from_empty_db_returns_201_with_system_and_computed_defaults
        claim_type: Creation
        grounds:
          - entities.Owner
          - endpoints.POST_/owners
          - calculations.owner_sanction_rollup
        distinguishing_aspect: "POST /owners with the three required fields returns 201 with id/created_at/updated_at/version populated, permanent_disqualification_count 0, cmp_outstanding_cents 0, sanction_flag CLEAR and status ACTIVE."
        test_recipe:
          setup:
            - "Empty database; the only endpoint reachable by Anonymous is POST /owners."
          setup_api_calls: []
          trigger:
            - &k_owner
              call: "POST /owners"
              payload: { legal_name: "Rio Retail LLC", ownership_type: "LLC", tax_id_last4: "4417" }
              as: Anonymous
              captures: { owner_id: $.data.id }
          assert:
            - "the response is 201 with response_type == object and data.id present"
            - "Owner.${owner_id}.legal_name == Rio Retail LLC"
            - "Owner.${owner_id}.ownership_type == LLC"
            - "Owner.${owner_id}.tax_id_last4 == 4417"
            - "Owner.${owner_id}.permanent_disqualification_count == 0"
            - "Owner.${owner_id}.cmp_outstanding_cents == 0"
            - "Owner.${owner_id}.sanction_flag == CLEAR"
            - "Owner.${owner_id}.status == ACTIVE"
            - "Owner.${owner_id}.version == 1"

      - name: store_creation_omitting_optional_inputs_applies_declared_defaults
        claim_type: Defaults
        grounds:
          - entities.Store.fields.tax_rate_bps
          - entities.Store.fields.hardship_designated
          - entities.Store.fields.predecessor_store_id
          - entities.Store.fields.authorization_status
          - entities.Store.fields.redemption_flag_level
        distinguishing_aspect: "Omitting tax_rate_bps, hardship_designated and predecessor_store_id yields 0, false and null, while the system fields land on NOT_AUTHORIZED / NONE / FLAG_L0 / active_terminal_count 0."
        test_recipe:
          setup:
            - "One owner."
          setup_api_calls:
            - *k_owner
          trigger:
            - call: "POST /stores"
              payload: { owner_id: "${owner_id}", store_name: "Rio Bare Defaults", state_code: "TX", store_type: "GROCERY", checkout_lane_count: 3, staple_shelf_linear_feet: 60, annual_gross_sales_cents: 36000000, annual_staple_sales_cents: 20000000, max_terminal_slots: 2 }
              as: FnsAdmin
              as_user_id: "fns-admin-1"
              captures: { store_def_id: $.data.id }
          assert:
            - "Store.${store_def_id}.tax_rate_bps == 0"
            - "Store.${store_def_id}.hardship_designated == false"
            - "Store.${store_def_id}.predecessor_store_id == null"
            - "Store.${store_def_id}.authorization_status == NOT_AUTHORIZED"
            - "Store.${store_def_id}.sanction_status == NONE"
            - "Store.${store_def_id}.redemption_flag_level == FLAG_L0"
            - "Store.${store_def_id}.active_terminal_count == 0"
            - "Store.${store_def_id}.fns_number == null"
            - "Store.${store_def_id}.authorized_at == null"
            - "Store.${store_def_id}.permanently_disqualified == false"

      - name: store_retrieval_by_id_returns_the_stored_row
        claim_type: Retrieval
        grounds:
          - endpoints.GET_/stores/{storeId}
          - entities.Store
        distinguishing_aspect: "GET /stores/{storeId} echoes every stored input field and the derived staple_sales_bps without mutating version."
        test_recipe:
          setup:
            - "One owner and the shared CONVENIENCE store fixture."
          setup_api_calls:
            - *k_owner
            - &k_store
              call: "POST /stores"
              payload: { owner_id: "${owner_id}", store_name: "Rio Convenience", state_code: "TX", store_type: "CONVENIENCE", checkout_lane_count: 2, staple_shelf_linear_feet: 30, annual_gross_sales_cents: 36000000, annual_staple_sales_cents: 20000000, max_terminal_slots: 2, tax_rate_bps: 825, hardship_designated: true }
              as: FnsAdmin
              as_user_id: "fns-admin-1"
              captures: { store_id: $.data.id, store_v: $.data.version }
          trigger:
            - call: "GET /stores/${store_id}"
              payload: {}
              as: FnsAnalyst
              as_user_id: "fns-analyst-1"
              captures: { store_read_v: $.data.version }
          assert:
            - "the response is 200 with response_type == object"
            - "Store.${store_id}.store_name == Rio Convenience"
            - "Store.${store_id}.tax_rate_bps == 825"
            - "Store.${store_id}.hardship_designated == true"
            - "Store.${store_id}.staple_sales_bps == 5555"
            - "Store.${store_id}.criterion_b_pass == true"
            - "${store_read_v} == ${store_v} (a read never bumps version)"

      - name: stores_listing_filters_by_owner_and_paginates_with_envelope_counts
        claim_type: Listing
        grounds:
          - endpoints.GET_/stores
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /stores?owner_id=…&limit=2&offset=0 returns 2 of the owner's 3 stores with total_count 3 and has_more true, and the second page returns the remaining 1 with has_more false."
        test_recipe:
          setup:
            - "One owner with three stores in TX and a second owner with one store that must not appear in the filtered list."
          setup_api_calls:
            - *k_owner
            - *k_store
            - call: "POST /stores"
              payload: { owner_id: "${owner_id}", store_name: "Rio Corner Market", state_code: "TX", store_type: "CONVENIENCE", checkout_lane_count: 1, staple_shelf_linear_feet: 30, annual_gross_sales_cents: 24000000, annual_staple_sales_cents: 14000000, max_terminal_slots: 1 }
              as: FnsAdmin
              as_user_id: "fns-admin-1"
              captures: { store_p2_id: $.data.id }
            - call: "POST /stores"
              payload: { owner_id: "${owner_id}", store_name: "Rio Depot Grocery", state_code: "TX", store_type: "GROCERY", checkout_lane_count: 4, staple_shelf_linear_feet: 80, annual_gross_sales_cents: 90000000, annual_staple_sales_cents: 50000000, max_terminal_slots: 3 }
              as: FnsAdmin
              as_user_id: "fns-admin-1"
              captures: { store_p3_id: $.data.id }
            - &k_owner2
              call: "POST /owners"
              payload: { legal_name: "Second Street Foods Inc", ownership_type: "CORPORATION", tax_id_last4: "9032" }
              as: Anonymous
              captures: { owner2_id: $.data.id }
            - call: "POST /stores"
              payload: { owner_id: "${owner2_id}", store_name: "Second Street Market", state_code: "TX", store_type: "GROCERY", checkout_lane_count: 2, staple_shelf_linear_feet: 60, annual_gross_sales_cents: 30000000, annual_staple_sales_cents: 12000000, max_terminal_slots: 1 }
              as: FnsAdmin
              as_user_id: "fns-admin-1"
              captures: { store_other_id: $.data.id }
          trigger:
            - call: "GET /stores?owner_id=${owner_id}&limit=2&offset=0"
              payload: {}
              as: FnsAdmin
              as_user_id: "fns-admin-1"
            - call: "GET /stores?owner_id=${owner_id}&limit=2&offset=2"
              payload: {}
              as: FnsAdmin
              as_user_id: "fns-admin-1"
          assert:
            - "the first page returns 200 with response_type == array, 2 rows, total_count == 3, limit == 2, offset == 0 and has_more == true"
            - "the second page returns 1 row with total_count == 3, offset == 2 and has_more == false"
            - "${store_other_id} appears in neither page"

      - name: store_get_with_unknown_uuid_returns_store_not_found
        claim_type: Not Found
        grounds:
          - validations.priority_3_path_id_resolution
          - errors.ERR_STORE_NOT_FOUND
        distinguishing_aspect: "A syntactically valid but unused UUID in the path returns 404 ERR_STORE_NOT_FOUND rather than 200 with an empty body."
        test_recipe:
          setup:
            - "One owner and one store, so the collection is non-empty."
          setup_api_calls:
            - *k_owner
            - *k_store
          trigger:
            - call: "GET /stores/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: FnsAdmin
              as_user_id: "fns-admin-1"
              captures: { store_404_error_id: $.data.error_id }
          assert:
            - "the response is 404 with response_type == error and ${store_404_error_id} == ERR_STORE_NOT_FOUND"
            - "GET /stores returns total_count == 1 (the probe created nothing)"

      - name: application_create_without_claimed_criterion_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - validations.priority_7_request_shape
          - errors.ERR_INVALID_REQUEST
          - endpoints.POST_/applications
        distinguishing_aspect: "Omitting the required claimed_criterion input returns 400 ERR_INVALID_REQUEST and persists no Application, even though every other required field including expected_store_version is present and valid."
        test_recipe:
          setup:
            - "One owner and the shared store fixture at version 1."
          setup_api_calls:
            - *k_owner
            - *k_store
          trigger:
            - call: "POST /applications"
              payload:
                store_id: "${store_id}"
                expected_store_version: "${store_v}"
                application_type: "INITIAL"
                reported_inventory_lines: &k_inv_pass
                  - { category: "BREAD_CEREAL", variety_key: "RICE", unit_count: 4, is_perishable: false }
                  - { category: "BREAD_CEREAL", variety_key: "OATS", unit_count: 3, is_perishable: false }
                  - { category: "BREAD_CEREAL", variety_key: "TORTILLA", unit_count: 5, is_perishable: false }
                  - { category: "DAIRY", variety_key: "MILK", unit_count: 6, is_perishable: true }
                  - { category: "DAIRY", variety_key: "CHEESE", unit_count: 4, is_perishable: true }
                  - { category: "DAIRY", variety_key: "YOGURT", unit_count: 3, is_perishable: true }
                  - { category: "FRUIT_VEG", variety_key: "APPLE", unit_count: 5, is_perishable: true }
                  - { category: "FRUIT_VEG", variety_key: "ONION", unit_count: 4, is_perishable: true }
                  - { category: "FRUIT_VEG", variety_key: "CANNED_CORN", unit_count: 3, is_perishable: false }
                  - { category: "MEAT_POULTRY_FISH", variety_key: "CHICKEN", unit_count: 3, is_perishable: true }
                  - { category: "MEAT_POULTRY_FISH", variety_key: "TUNA_CAN", unit_count: 4, is_perishable: false }
                  - { category: "MEAT_POULTRY_FISH", variety_key: "GROUND_BEEF", unit_count: 3, is_perishable: true }
              as: RetailerOwner
              as_user_id: "${owner_id}"
              captures: { missing_field_error_id: $.data.error_id }
          assert:
            - "the response is 400 and ${missing_field_error_id} == ERR_INVALID_REQUEST"
            - "GET /applications?store_id=${store_id} returns total_count == 0"
            - "Store.${store_id}.version == ${store_v} (a rejected create never bumps the OCC parent)"

      - name: store_computed_staple_sales_bps_ignores_client_supplied_value
        claim_type: Computed Fields
        grounds:
          - calculations.criterion_b_staple_sales_share
          - entities.Store.fields.staple_sales_bps
          - entities.Store.fields.criterion_b_pass
        distinguishing_aspect: "staple_sales_bps is derived as floor(20000000 * 10000 / 36000000) == 5555 with criterion_b_pass true; a client-supplied staple_sales_bps or criterion_b_pass in the request body is ignored, not echoed."
        test_recipe:
          setup:
            - "One owner."
          setup_api_calls:
            - *k_owner
          trigger:
            - call: "POST /stores"
              payload: { owner_id: "${owner_id}", store_name: "Rio Computed Probe", state_code: "TX", store_type: "CONVENIENCE", checkout_lane_count: 2, staple_shelf_linear_feet: 30, annual_gross_sales_cents: 36000000, annual_staple_sales_cents: 20000000, max_terminal_slots: 2 }
              as: FnsAdmin
              as_user_id: "fns-admin-1"
              captures: { store_calc_id: $.data.id }
          assert:
            - "Store.${store_calc_id}.staple_sales_bps == 5555"
            - "Store.${store_calc_id}.criterion_b_pass == true"
            - "the response contains no field named annual_staple_sales_pct and no client-writable staple_sales_bps"

      - name: owner_system_fields_are_server_generated_and_client_values_ignored
        claim_type: System Fields
        grounds:
          - entities.Owner.common_fields
          - entities.Owner.fields.status
          - entities.Owner.fields.permanent_disqualification_count
        distinguishing_aspect: "Supplying id, created_at, version, status and permanent_disqualification_count in the POST /owners body leaves them server-assigned: the returned id differs from the submitted one, status is ACTIVE and the count is 0."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /owners"
              payload: { legal_name: "Ghostwriter Foods", ownership_type: "SOLE_PROPRIETOR", tax_id_last4: "0001" }
              as: Anonymous
              captures: { owner_sys_id: $.data.id }
          assert:
            - "Owner.${owner_sys_id}.id is a server-minted identifier not equal to any client-submitted value"
            - "Owner.${owner_sys_id}.created_at == 2026-08-01T00:00:00Z"
            - "Owner.${owner_sys_id}.updated_at == 2026-08-01T00:00:00Z"
            - "Owner.${owner_sys_id}.version == 1"
            - "Owner.${owner_sys_id}.status == ACTIVE"
            - "Owner.${owner_sys_id}.permanent_disqualification_count == 0"

      - name: store_create_with_unknown_store_type_enum_is_rejected
        claim_type: Type Constraints
        grounds:
          - validations.priority_7_request_shape
          - entities.Store.fields.store_type
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "store_type BODEGA is outside the declared enum {SUPERMARKET, GROCERY, CONVENIENCE, SPECIALTY, FARMERS_MARKET, MEAL_SERVICE} and returns 400 ERR_INVALID_REQUEST, so no store is created and no MIN_SHELF_LINEAR_FEET lookup can be attempted."
        test_recipe:
          setup:
            - "One owner."
          setup_api_calls:
            - *k_owner
          trigger:
            - call: "POST /stores"
              payload: { owner_id: "${owner_id}", store_name: "Rio Bodega", state_code: "TX", store_type: "BODEGA", checkout_lane_count: 2, staple_shelf_linear_feet: 30, annual_gross_sales_cents: 36000000, annual_staple_sales_cents: 20000000, max_terminal_slots: 2 }
              as: FnsAdmin
              as_user_id: "fns-admin-1"
              captures: { enum_error_id: $.data.error_id }
          assert:
            - "the response is 400 and ${enum_error_id} == ERR_INVALID_REQUEST"
            - "GET /stores?owner_id=${owner_id} returns total_count == 0"

      - name: store_visit_create_with_window_end_before_window_start_is_rejected
        claim_type: Type Constraints
        grounds:
          - validations.priority_7_request_shape
          - errors.ERR_INVALID_REQUEST
          - entities.StoreVisit.fields.window_minutes
        distinguishing_aspect: "window_end 2026-08-01T02:00 with window_start 2026-08-01T04:00 violates the declared window_end > window_start bound and returns 400 ERR_INVALID_REQUEST before any interval-conflict or daily-ceiling check can run, leaving committed_minutes at 0."
        test_recipe:
          setup:
            - "One owner, the shared store, a SUBMITTED CRITERION_A application and one ACTIVE inspector."
          setup_api_calls:
            - *k_owner
            - *k_store
            - &k_app
              call: "POST /applications"
              payload: { store_id: "${store_id}", expected_store_version: "${store_v}", application_type: "INITIAL", claimed_criterion: "CRITERION_A", reported_inventory_lines: *k_inv_pass }
              as: RetailerOwner
              as_user_id: "${owner_id}"
              captures: { app_id: $.data.id }
            - &k_submit
              call: "POST /applications/${app_id}/submit"
              payload: {}
              as: RetailerOwner
              as_user_id: "${owner_id}"
            - &k_insp
              call: "POST /inspectors"
              payload: { full_name: "Dana Ruiz", state_code: "TX", max_daily_minutes: 480 }
              as: FnsAdmin
              as_user_id: "fns-admin-1"
              captures: { insp_id: $.data.id }
          trigger:
            - call: "POST /store-visits"
              payload: { application_id: "${app_id}", inspector_id: "${insp_id}", visit_type: "PRE_AUTHORIZATION", window_start: "2026-08-01T04:00:00Z", window_end: "2026-08-01T02:00:00Z" }
              as: FnsAnalyst
              as_user_id: "fns-analyst-1"
              captures: { window_order_error_id: $.data.error_id }
          assert:
            - "the response is 400 and ${window_order_error_id} == ERR_INVALID_REQUEST"
            - "Inspector.${insp_id}.committed_minutes == 0"
            - "Application.${app_id}.status == SUBMITTED (no PENDING_VISIT transition fired)"
            - "GET /store-visits?application_id=${app_id} returns total_count == 0"

      - name: penalty_ledger_entries_are_append_only_with_no_version_and_no_mutator
        claim_type: Immutability
        grounds:
          - entities.PenaltyLedgerEntry
          - calculations.penalty_ledger_balance
          - endpoints.GET_/sanction-cases/{id}/penalty-ledger
          - endpoints.POST_/sanction-cases/{caseId}/cmp-payments
        distinguishing_aspect: "PenaltyLedgerEntry declares common_fields false, so rows carry id/created_at only: there is no version field, no PATCH and no DELETE anywhere in §1.5, and a partial payment appends a second row instead of editing the assessment row."
        test_recipe:
          setup:
            - "An authorized hardship store with four CLOSED periods and a CMP_IN_LIEU determination of 423,456c already assessed."
          setup_api_calls:
            - *k_owner
            - *k_store
            - *k_app
            - *k_submit
            - *k_insp
            - &k_visit
              call: "POST /store-visits"
              payload: { application_id: "${app_id}", inspector_id: "${insp_id}", visit_type: "PRE_AUTHORIZATION", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-01T02:00:00Z" }
              as: FnsAnalyst
              as_user_id: "fns-analyst-1"
              captures: { visit_id: $.data.id }
            - &k_start
              call: "POST /store-visits/${visit_id}/start"
              payload: {}
              as: Inspector
              as_user_id: "${insp_id}"
            - &k_findings
              call: "POST /store-visits/${visit_id}/findings"
              payload: { observed_inventory_lines: *k_inv_pass, observed_staple_shelf_linear_feet: 30 }
              as: Inspector
              as_user_id: "${insp_id}"
            - &k_decision
              call: "POST /applications/${app_id}/decision"
              payload: { outcome: "APPROVED" }
              as: FnsAdmin
              as_user_id: "fns-admin-1"
            - &k_p1
              call: "POST /redemption-periods"
              payload: { store_id: "${store_id}", period_index: 1, period_start: "2026-02-01T00:00:00Z", period_end: "2026-03-01T00:00:00Z" }
              as: FnsAnalyst
              as_user_id: "fns-analyst-1"
              captures: { p1_id: $.data.id }
            - &k_p1_import
              call: "POST /redemption-periods/${p1_id}/settlement-import"
              payload: { imported_total_cents: 1234567, imported_transaction_count: 40, imported_large_transaction_cents: 0, imported_even_dollar_transaction_count: 0 }
              as: FnsAnalyst
              as_user_id: "fns-analyst-1"
            - &k_p1_close
              call: "POST /redemption-periods/${p1_id}/close"
              payload: {}
              as: FnsAnalyst
              as_user_id: "fns-analyst-1"
            - &k_p2
              call: "POST /redemption-periods"
              payload: { store_id: "${store_id}", period_index: 2, period_start: "2026-03-01T00:00:00Z", period_end: "2026-04-01T00:00:00Z" }
              as: FnsAnalyst
              as_user_id: "fns-analyst-1"
              captures: { p2_id: $.data.id }
            - &k_p2_import
              call: "POST /redemption-periods/${p2_id}/settlement-import"
              payload: { imported_total_cents: 1000000, imported_transaction_count: 30, imported_large_transaction_cents: 0, imported_even_dollar_transaction_count: 0 }
              as: FnsAnalyst
              as_user_id: "fns-analyst-1"
            - &k_p2_close
              call: "POST /redemption-periods/${p2_id}/close"
              payload: {}
              as: FnsAnalyst
              as_user_id: "fns-analyst-1"
            - &k_p3
              call: "POST /redemption-periods"
              payload: { store_id: "${store_id}", period_index: 3, period_start: "2026-04-01T00:00:00Z", period_end: "2026-05-01T00:00:00Z" }
              as: FnsAnalyst
              as_user_id: "fns-analyst-1"
              captures: { p3_id: $.data.id }
            - &k_p3_import
              call: "POST /redemption-periods/${p3_id}/settlement-import"
              payload: { imported_total_cents: 900000, imported_transaction_count: 28, imported_large_transaction_cents: 0, imported_even_dollar_transaction_count: 0 }
              as: FnsAnalyst
              as_user_id: "fns-analyst-1"
            - &k_p3_close
              call: "POST /redemption-periods/${p3_id}/close"
              payload: {}
              as: FnsAnalyst
              as_user_id: "fns-analyst-1"
            - &k_p4
              call: "POST /redemption-periods"
              payload: { store_id: "${store_id}", period_index: 4, period_start: "2026-05-01T00:00:00Z", period_end: "2026-06-01T00:00:00Z" }
              as: FnsAnalyst
              as_user_id: "fns-analyst-1"
              captures: { p4_id: $.data.id }
            - &k_p4_import
              call: "POST /redemption-periods/${p4_id}/settlement-import"
              payload: { imported_total_cents: 2000000, imported_transaction_count: 50, imported_large_transaction_cents: 0, imported_even_dollar_transaction_count: 0 }
              as: FnsAnalyst
              as_user_id: "fns-analyst-1"
            - &k_p4_close
              call: "POST /redemption-periods/${p4_id}/close"
              payload: {}
              as: FnsAnalyst
              as_user_id: "fns-analyst-1"
            - &k_inv_open
              call: "POST /investigations"
              payload: { store_id: "${store_id}", opened_reason: "TIP" }
              as: FnsAnalyst
              as_user_id: "fns-analyst-1"
              captures: { inv_id: $.data.id }
            - &k_ev_household
              call: "POST /investigations/${inv_id}/evidence"
              payload: { evidence_type: "HOUSEHOLD_INTERVIEW", observed_at: "2026-07-15T00:00:00Z" }
              as: FnsAnalyst
              as_user_id: "fns-analyst-1"
            - &k_conclude_ineligible
              call: "POST /investigations/${inv_id}/conclude"
              payload: { substantiated_violation: "INELIGIBLE_ITEM_SALES" }
              as: FnsAnalyst
              as_user_id: "fns-analyst-2"
            - &k_case
              call: "POST /sanction-cases"
              payload: { investigation_id: "${inv_id}", violation_type: "INELIGIBLE_ITEMS_HARDSHIP" }
              as: FnsAdmin
              as_user_id: "fns-admin-1"
              captures: { case_id: $.data.id }
            - &k_charge
              call: "POST /sanction-cases/${case_id}/charge-letter"
              payload: { charge_summary: "Repeated sales of ineligible items observed during household interviews." }
              as: FnsAdmin
              as_user_id: "fns-admin-1"
              captures: { case_v: $.data.version }
            - &k_election
              call: "POST /sanction-cases/${case_id}/cmp-elections"
