        distinguishing_aspect: "A monetization review with decision APPROVE submitted while the channel is MONETIZATION_NOT_APPLIED and its posture is RESTRICTED violates the state rule (priority 4) and the business_safety posture rule (priority 5); ERR_INVALID_STATE must win over ERR_POSTURE_RESTRICTED."
