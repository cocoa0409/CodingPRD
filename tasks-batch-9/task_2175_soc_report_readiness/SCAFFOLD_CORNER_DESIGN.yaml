              payload: { client_name: "Scope Coherence", report_type: "SOC_2_TYPE_2", observation_period_start: "2026-09-01T00:00:00.000Z", observation_period_end: "2026-11-30T00:00:00.000Z", required_criteria_categories: ["SECURITY"] }
              as: ComplianceLead
