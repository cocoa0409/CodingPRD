              payload: { address: "2 Cons", geo_zone: "Z1", activity_type: "FILMING", requested_start_at: "2026-06-01T06:00:00Z", requested_end_at: "2026-06-01T20:00:00Z", uses_road_closure: true }
              as: ProductionCompany
              as_user_id: "${pc2_id}"
            - call: "POST /road-closure-bookings"
              payload: { application_id: "${app2_id}", street_segment_id: "${seg1_id}", closure_start_at: "2026-06-01T09:00:00Z", closure_end_at: "2026-06-01T11:00:00Z" }
              as: ProductionCompany
              as_user_id: "${pc2_id}"
              captures: { b2_id: $.data.id }
            - call: "POST /applications/${app1_id}/submit"
              payload: {}
              as: ProductionCompany
              as_user_id: "${pc1_id}"
            - call: "GET /department-reviews?application_id=${app1_id}&department_id=${dept_pol_id}"
              as: FilmOfficeCoordinator
              captures: { rev1_id: "$.data[0].id" }
            - call: "POST /department-reviews/${rev1_id}/decision"
              payload: { decision: "APPROVE" }
              as: DepartmentReviewer
              as_user_id: "${dept_pol_id}"
            - call: "POST /applications/${app1_id}/payments"
              payload: { entry_type: "PERMIT_FEE", amount_cents: 82400 }
              as: ProductionCompany
              as_user_id: "${pc1_id}"
            - call: "GET /applications/${app1_id}"
              as: FilmOfficeCoordinator
              captures: { v1a_issue: $.data.version }
            - call: "POST /applications/${app1_id}/issue"
              payload: { expected_application_version: "${v1a_issue}" }
              as: FilmOfficeCoordinator
            - call: "GET /road-closure-bookings/${b2_id}"
              as: FilmOfficeCoordinator
              captures: { b2_blocked: $.data.status }
          trigger:
            - call: "POST /applications/${app1_id}/withdraw"
              payload: {}
              as: ProductionCompany
              as_user_id: "${pc1_id}"
            - call: "GET /road-closure-bookings/${b2_id}"
              as: FilmOfficeCoordinator
              captures: { b2_final: $.data.status }
            - call: "GET /road-closure-bookings/${b1_id}"
              as: FilmOfficeCoordinator
              captures: { b1_final: $.data.status }
          assert:
            - "Before withdraw the captured b2_blocked == BLOCKED (B2 in seg1's active set)"
            - "After app1's surrender RoadClosureBooking.${b2_id}.status == PENDING (restored; block->restore kept B2 active with zero drift)"
            - "RoadClosureBooking.${b1_id}.status == RELEASED (B1 leaves the active set only by the explicit release)"
