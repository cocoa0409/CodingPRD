        grounds: [state_machines.StatuteWaiver.VOIDED, "endpoints.POST /statute-waivers/{id}/void", "endpoints.POST /statute-waivers/{id}/execute", errors.ERR_INVALID_STATE]
        distinguishing_aspect: |
          VOIDED is terminal for a waiver, and a waiver voided while still DRAFTED
          never contributed days. Executing it afterwards must be refused with
          ERR_INVALID_STATE (409) and must not move the audit's statute_expiry_date
          off the base 2029-06-29 (2026-06-30 + 1095) or lift waiver_days_added
          above 0.
        test_recipe:
          setup:
            - "SCOPED audit (scope 2026-01-01..2026-06-30, base expiry 2029-06-29) with one DRAFTED waiver that is then voided."
          setup_api_calls:
