          - errors[ERR_EVALUATION_NOT_ALLOWED]
        distinguishing_aspect: "Submitting an evaluation from an ENROLLED registration in an OPEN cohort (not ATTENDED/NO_SHOW, cohort not DELIVERED/CLOSED) returns ERR_EVALUATION_NOT_ALLOWED (409)."
