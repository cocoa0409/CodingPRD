      - name: lab_credit_returned_exactly_on_lab_order_cancellation
        grounds:
          - state_machines.LabOrder.ORDERED_to_CANCELLED
          - conservation_invariants.membership_lab_credit_units
          - entities.Membership.fields.lab_credits_consumed
          - entities.LabOrder.fields.lab_credit_cost
        distinguishing_aspect: |
          Conserved quantity: LAB-PANEL CREDIT UNITS, a third distinct quantity. A
          DUTCH_HORMONE order costs 2 credits and drives a CORE membership to
          remaining 0; cancelling returns exactly 2, restoring
          lab_credits_granted == consumed + remaining + forfeited as 2 == 0 + 2 + 0.
        test_recipe:
          setup:
            - "A CORE membership opened 2026-05-01 with lab_credits_granted 2"
            - "One DUTCH_HORMONE lab order funded by MEMBERSHIP_CREDIT, consuming both credits"
            - "The patient has no protocol, so no wash-out interference exists and the order is ORDERED"
          setup_api_calls:
            - call: "POST /practitioners"
              payload: { full_name: "Dr Nora Vance", credential: "ND", licensed_state_codes: ["OR"], npi: "1234567893" }
              as: PracticeAdmin
              captures: { nd_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Ada Reyes", email: "ada@example.com", state_code: "OR", primary_practitioner_id: "${nd_id}" }
              as: PracticeAdmin
              captures: { pt_id: $.data.id }
            - call: "POST /memberships"
              payload: { patient_id: "${pt_id}", tier: "CORE", cycle_start_date: "2026-05-01" }
              as: PracticeAdmin
              captures: { mem_id: $.data.id }
            - call: "POST /lab-orders"
              payload: { patient_id: "${pt_id}", panel_code: "DUTCH_HORMONE", funding_source: "MEMBERSHIP_CREDIT", requested_collection_date: "2026-05-20", cycle_day: 20 }
              as: NaturopathicDoctor
              as_user_id: "${nd_id}"
              captures: { lo_id: $.data.id }
          trigger:
            - call: "POST /lab-orders/${lo_id}/cancel"
              payload: { reason: "patient deferred" }
              as: NaturopathicDoctor
              as_user_id: "${nd_id}"
          assert:
            - "LabOrder.${lo_id}.lab_credit_cost == 2"
            - "LabOrder.${lo_id}.price_cents == 0"
            - "LabOrder.${lo_id}.status == CANCELLED"
            - "Membership.${mem_id}.lab_credits_granted == 2"
            - "Membership.${mem_id}.lab_credits_consumed == 0"
            - "Membership.${mem_id}.lab_credits_remaining == 2"
            - "Membership.${mem_id}.lab_credits_forfeited == 0"
            - "Patient.${pt_id}.cash_charged_total_cents == 0"
