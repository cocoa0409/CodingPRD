              as: Allocator
              as_user_id: "u-alloc-1"
              captures: { p2_id: $.data.id }
            - call: "POST /allocation/receipts"
              payload: { program_id: "${prog_id}", item_id: "${i1_id}", reference: "ASN-C701", units_received: 16, size_received: [{ size_code: "M", units: 16 }], receipt_date: "2026-08-01T00:00:00Z" }
              as: Allocator
              as_user_id: "u-alloc-1"
              captures: { r1_id: $.data.id, r1_v1: $.data.version }
            - call: "POST /allocation/receipts"
              payload: { program_id: "${prog_id}", item_id: "${i2_id}", reference: "ASN-C702", units_received: 10, size_received: [{ size_code: "S", units: 3 }, { size_code: "M", units: 3 }, { size_code: "L", units: 3 }, { size_code: "XL", units: 1 }], receipt_date: "2026-08-01T00:00:00Z" }
              as: Allocator
              as_user_id: "u-alloc-1"
              captures: { r2_id: $.data.id, r2_v1: $.data.version }
          trigger:
            - call: "POST /allocation/receipts/${r1_id}/allocation-runs"
              payload: { method: "DEMAND_DRIVEN", need_basis: "FORWARD_LOOKING", expected_receipt_version: "${r1_v1}" }
              as: Allocator
              as_user_id: "u-alloc-1"
              captures: { run1_id: $.data.id }
            - call: "POST /allocation/allocation-runs/${run1_id}/propose"
              payload: {}
              as: Allocator
              as_user_id: "u-alloc-1"
            - call: "GET /allocation/allocation-lines"
              payload: { run_id: "${run1_id}", store_id: "${s1_id}" }
              as: Allocator
              captures: { l1_id: "$.data[0].id" }
            - call: "POST /allocation/receipts/${r2_id}/allocation-runs"
              payload: { method: "DEMAND_DRIVEN", need_basis: "FORWARD_LOOKING", expected_receipt_version: "${r2_v1}" }
              as: Allocator
