      - name: session_parallel_dimensions
        grounds:
          - state_machines.CallSession.QUEUED_to_ASSIGNED
          - state_machines.CallSession.ASSIGNED_to_ACTIVE
          - state_machines.CallSession.NOT_REQUIRED_to_REQUESTED
          - state_machines.CallSession.REQUESTED_to_CONNECTED
          - validations[priority=7]
        distinguishing_aspect: |
          CallSession carries two independent state dimensions on one row
          (session_status x interpretation_status): the interpretation dimension
          advances NOT_REQUIRED -> REQUESTED -> CONNECTED while session_status
          sits in QUEUED/ASSIGNED, and the ACTIVE gate on the session dimension
          reads the interpretation dimension (start while REQUESTED fails with
          ERR_INVALID_STATE; start once CONNECTED succeeds and pins the script).
          Distinct entity and distinct non-linear shape from the Case cycle.
        test_recipe:
          setup:
            - "Clock default; CA; EVICTION script published; worker counselor speaks en only, certified+trained; caller preferred_language es; interpreter I speaks es"
          setup_api_calls:
            - { call: "POST /hotline/jurisdictions", payload: { code: "CA", name: "California", level: "STATE", eviction_notice_days: 3, habitability_repair_days: 14, deposit_cap_months: 1.0, deposit_interest_required: false, deposit_interest_rate_pct: 0.0 }, as: AgencyAdmin, captures: { jur: $.data.id } }
