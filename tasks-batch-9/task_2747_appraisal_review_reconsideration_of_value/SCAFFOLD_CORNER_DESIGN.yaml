          - calculations.bias_risk_index
          - endpoints.POST_bias_flags_id_adjudicate
        distinguishing_aspect: "The INDICATED -> CLEAR edge on the parent is guarded by a cross-entity condition on the children: clearing the first two of three OPEN flags leaves the parent INDICATED, and only the third clearance flips it, while bias_risk_index stays frozen at 36."
        test_recipe:
          setup:
            - "One AMC, one ACTIVE panelled appraiser, one loan file, and one appraisal whose narrative contains exactly three PROHIBITED_TERMS at indexes 1, 2 and 8 ('desirable neighborhood', 'pride of ownership', 'family-oriented') and which has no comparables, so comp_skew_bps is 0 and the index is 12 * 3 + 0 == 36."
