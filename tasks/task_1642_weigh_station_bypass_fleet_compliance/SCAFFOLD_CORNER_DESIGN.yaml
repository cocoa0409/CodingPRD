              captures: { d4: $.data.decision, d4r: $.data.decision_reasons }
          assert:
            - "veh1 at TRANSPONDER-only station with only app credential: PULL_IN [CHANNEL_UNSUPPORTED]"
            - "veh1 at BOTH station (PILOT config): BYPASS_GRANTED selecting ${cred_app} (MOBILE_APP)"
            - "after a TRANSPONDER is also ACTIVE on veh1: still BYPASS_GRANTED selecting ${cred_app} — PILOT selector prefers MOBILE_APP over the usual TRANSPONDER-first rule"
            - "veh2 (TRANSPONDER only) at BOTH station under PILOT: PULL_IN [PILOT_APP_ONLY]"

