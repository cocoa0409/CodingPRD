# =============================================================================
# Task 1541 — Sports Agency Contract & Cap Management
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index for Non-Difficulty Tests
#
# Walks claim-extraction-guide.md sections against §1.1–§1.7 and enumerates
# every testable claim not already covered by §1.8. Sections with no
# applicable claims are omitted without ceremony.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: agency_creation_returns_defaults
        claim_type: creation
        grounds:
          - entities.Agency
          - endpoints."POST /agencies"
        distinguishing_aspect: "POST /agencies returns 201 + status=ACTIVE + id populated + created_at populated."
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - call: "POST /agencies"
              payload: { name: "DefaultCo", fee_cap_pct: 0.03 }
              as: LeagueOfficer
              captures: { aid: $.data.id, a_status: $.data.status }
          assert:
            - "Agency.${aid}.status == ACTIVE  # default applied"
            - "Agency.${aid}.created_at is present"
            - "Agency.${aid}.version == 1"

      - name: agency_creation_missing_required_field_returns_400
        claim_type: required_fields
        grounds:
          - entities.Agency.fields.fee_cap_pct
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /agencies without fee_cap_pct -> 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - call: "POST /agencies"
              payload: { name: "NoFee" }
              as: LeagueOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"
            - "http status == 400"

      - name: agent_get_returns_stored_entity
        claim_type: retrieval
        grounds:
          - entities.Agent
          - endpoints."GET /agencies/{agencyId}/agents/{agentId}"
        distinguishing_aspect: "GET on existing agent returns the entity with its declared fields."
        test_recipe:
          setup: ["One Agency + one Agent registered"]
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "FetchCo", fee_cap_pct: 0.05 }
              as: LeagueOfficer
              captures: { aid: $.data.id }
            - call: "POST /agencies/${aid}/agents"
              payload: { full_name: "Gettable", email: "g@f.example", cert_number: "GET-1" }
              as: AgencyManager
              captures: { ag_id: $.data.id }
          trigger:
            - call: "GET /agencies/${aid}/agents/${ag_id}"
              as: LeagueOfficer
          assert:
            - "Agent.${ag_id}.full_name == 'Gettable'"
            - "Agent.${ag_id}.cert_status == PENDING"
            - "Agent.${ag_id}.is_manager == false  # default applied"

      - name: get_nonexistent_agent_returns_404
        claim_type: not_found
        grounds:
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /agencies/{aid}/agents/{random-uuid} returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["One Agency"]
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "404Co", fee_cap_pct: 0.05 }
              as: LeagueOfficer
              captures: { aid: $.data.id }
          trigger:
            - call: "GET /agencies/${aid}/agents/00000000-0000-0000-0000-000000000000"
              as: LeagueOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND"
            - "http status == 404"

      - name: agent_is_manager_default_false
        claim_type: defaults
        grounds:
          - entities.Agent.fields.is_manager
        distinguishing_aspect: "POST /agents without is_manager yields false."
        test_recipe:
          setup: ["One Agency"]
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "DefAg", fee_cap_pct: 0.05 }
              as: LeagueOfficer
              captures: { aid: $.data.id }
          trigger:
            - call: "POST /agencies/${aid}/agents"
              payload: { full_name: "NoMgr", email: "nm@d.example", cert_number: "DNM" }
              as: AgencyManager
              captures: { ag_id: $.data.id }
          assert:
            - "Agent.${ag_id}.is_manager == false"

      - name: contract_aav_is_computed_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.Contract.fields.aav_cents
        distinguishing_aspect: "Client cannot inject aav_cents at create — server computes it from formula."
        test_recipe:
          setup: ["Agency/team/cap-season/agent/client provisioned"]
          setup_api_calls:
            - call: "POST /teams"
              payload: { name: "T", league_code: "NBA" }
              as: LeagueOfficer
              captures: { team_id: $.data.id }
            - call: "POST /teams/${team_id}/cap_seasons"
              payload: { season_year: 2026, cap_limit_cents: 500000000, luxury_threshold_cents: 600000000 }
              as: LeagueOfficer
              captures: { cs_id: $.data.id }
            - call: "POST /agencies"
              payload: { name: "CalcA", fee_cap_pct: 0.03 }
              as: LeagueOfficer
              captures: { aid: $.data.id }
            - call: "POST /agencies/${aid}/agents"
              payload: { full_name: "M", email: "m@c.example", cert_number: "MC", is_manager: true }
              as: AgencyManager
              captures: { m_id: $.data.id }
            - call: "POST /agencies/${aid}/agents/${m_id}/certify"
              payload: {}
              as: AgencyManager
              as_user_id: "${m_id}"
            - call: "POST /agencies/${aid}/agents"
              payload: { full_name: "A", email: "a@c.example", cert_number: "AC" }
              as: AgencyManager
              as_user_id: "${m_id}"
              captures: { a_id: $.data.id }
            - call: "POST /agencies/${aid}/agents/${a_id}/certify"
              payload: {}
              as: AgencyManager
              as_user_id: "${m_id}"
            - call: "POST /agencies/${aid}/clients"
              payload: { primary_agent_id: "${a_id}", full_name: "P", position: "PG" }
              as: Agent
              as_user_id: "${a_id}"
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /agencies/${aid}/clients/${c_id}/contracts"
              payload: { team_id: "${team_id}", cap_season_id: "${cs_id}", start_season_year: 2026, years: 1, base_salary_cents: 10000000, guaranteed_cents: 10000000, signing_bonus_cents: 0, incentive_cents: 0, escalator_pct: 0 }
              as: Agent
              as_user_id: "${a_id}"
              captures: { con_id: $.data.id }
          assert:
            - "Contract.${con_id}.aav_cents == 10000000   # computed: (10M + 0 + 0)/1"
            - "Contract.${con_id}.total_value_cents == 10000000"

      - name: list_clients_pagination_envelope
        claim_type: listing
        grounds:
          - endpoints."GET /agencies/{agencyId}/clients"
          - response_envelope
        distinguishing_aspect: "GET /clients with no params returns pagination envelope with limit=10, offset=0, total_count, has_more."
        test_recipe:
          setup: ["One Agency with 2 clients"]
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "PageCo", fee_cap_pct: 0.03 }
              as: LeagueOfficer
              captures: { aid: $.data.id }
            - call: "POST /agencies/${aid}/agents"
              payload: { full_name: "M", email: "m@pg.example", cert_number: "MPG", is_manager: true }
              as: AgencyManager
              captures: { m_id: $.data.id }
            - call: "POST /agencies/${aid}/agents/${m_id}/certify"
              payload: {}
              as: AgencyManager
              as_user_id: "${m_id}"
            - call: "POST /agencies/${aid}/agents"
              payload: { full_name: "A", email: "a@pg.example", cert_number: "APG" }
              as: AgencyManager
              as_user_id: "${m_id}"
              captures: { a_id: $.data.id }
            - call: "POST /agencies/${aid}/agents/${a_id}/certify"
              payload: {}
              as: AgencyManager
              as_user_id: "${m_id}"
            - call: "POST /agencies/${aid}/clients"
              payload: { primary_agent_id: "${a_id}", full_name: "P1", position: "PG" }
              as: Agent
              as_user_id: "${a_id}"
            - call: "POST /agencies/${aid}/clients"
              payload: { primary_agent_id: "${a_id}", full_name: "P2", position: "SG" }
              as: Agent
              as_user_id: "${a_id}"
          trigger:
            - call: "GET /agencies/${aid}/clients"
              as: LeagueOfficer
          assert:
            - "response.meta.api_request_id is present"
            - "response.response_type == 'array'"
            - "total_count == 2"
            - "limit == 10   # default"
            - "offset == 0"
            - "has_more == false"

      - name: list_clients_filter_by_status
        claim_type: listing
        grounds:
          - endpoints."GET /agencies/{agencyId}/clients"
        distinguishing_aspect: "?status=RELEASED returns only RELEASED clients."
        test_recipe:
          setup: ["One Agency, two clients; one is released"]
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "FilterCo", fee_cap_pct: 0.03 }
              as: LeagueOfficer
              captures: { aid: $.data.id }
            - call: "POST /agencies/${aid}/agents"
              payload: { full_name: "M", email: "m@fc.example", cert_number: "MFC", is_manager: true }
              as: AgencyManager
              captures: { m_id: $.data.id }
            - call: "POST /agencies/${aid}/agents/${m_id}/certify"
              payload: {}
              as: AgencyManager
              as_user_id: "${m_id}"
            - call: "POST /agencies/${aid}/agents"
              payload: { full_name: "A", email: "a@fc.example", cert_number: "AFC" }
              as: AgencyManager
              as_user_id: "${m_id}"
              captures: { a_id: $.data.id }
            - call: "POST /agencies/${aid}/agents/${a_id}/certify"
              payload: {}
              as: AgencyManager
              as_user_id: "${m_id}"
            - call: "POST /agencies/${aid}/clients"
              payload: { primary_agent_id: "${a_id}", full_name: "Stay", position: "PG" }
              as: Agent
              as_user_id: "${a_id}"
              captures: { c_stay: $.data.id }
            - call: "POST /agencies/${aid}/clients"
              payload: { primary_agent_id: "${a_id}", full_name: "Go", position: "SG" }
              as: Agent
              as_user_id: "${a_id}"
              captures: { c_go: $.data.id }
            - call: "POST /agencies/${aid}/clients/${c_go}/release"
              payload: {}
              as: AgencyManager
              as_user_id: "${m_id}"
          trigger:
            - call: "GET /agencies/${aid}/clients?status=RELEASED"
              as: LeagueOfficer
          assert:
            - "total_count == 1"
            - "data[0].id == ${c_go}"
            - "data[0].status == RELEASED"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: agent_initial_state_is_pending
        claim_type: initial_state
        grounds:
          - state_machines.Agent
        distinguishing_aspect: "Freshly created Agent has cert_status == PENDING."
        test_recipe:
          setup: ["One Agency"]
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "InitCo", fee_cap_pct: 0.03 }
              as: LeagueOfficer
              captures: { aid: $.data.id }
          trigger:
            - call: "POST /agencies/${aid}/agents"
              payload: { full_name: "Fresh", email: "f@i.example", cert_number: "F1" }
              as: AgencyManager
              captures: { ag_id: $.data.id }
          assert:
            - "Agent.${ag_id}.cert_status == PENDING"

      - name: certify_from_certified_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Agent.PENDING_to_CERTIFIED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Second certify attempt on a CERTIFIED agent must fail."
        test_recipe:
          setup: ["Agency + manager + certified agent"]
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "CertCo", fee_cap_pct: 0.03 }
              as: LeagueOfficer
              captures: { aid: $.data.id }
            - call: "POST /agencies/${aid}/agents"
              payload: { full_name: "M", email: "m@cert.example", cert_number: "MCE", is_manager: true }
              as: AgencyManager
              captures: { m_id: $.data.id }
            - call: "POST /agencies/${aid}/agents/${m_id}/certify"
              payload: {}
              as: AgencyManager
              as_user_id: "${m_id}"
            - call: "POST /agencies/${aid}/agents"
              payload: { full_name: "A", email: "a@cert.example", cert_number: "ACE" }
              as: AgencyManager
              as_user_id: "${m_id}"
              captures: { a_id: $.data.id }
            - call: "POST /agencies/${aid}/agents/${a_id}/certify"
              payload: {}
              as: AgencyManager
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /agencies/${aid}/agents/${a_id}/certify"
              payload: {}
              as: AgencyManager
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "http status == 409"

      - name: grievance_terminal_state_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Grievance
        distinguishing_aspect: "RESOLVED is terminal; any further transition attempt on RESOLVED fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Grievance driven FILED -> UNDER_REVIEW -> ARBITRATION -> RESOLVED"]
          setup_api_calls:
            - call: "POST /teams"
              payload: { name: "GT", league_code: "NBA" }
              as: LeagueOfficer
              captures: { team_id: $.data.id }
            - call: "POST /teams/${team_id}/cap_seasons"
              payload: { season_year: 2026, cap_limit_cents: 500000000, luxury_threshold_cents: 600000000 }
              as: LeagueOfficer
              captures: { cs_id: $.data.id }
            - call: "POST /agencies"
              payload: { name: "GA", fee_cap_pct: 0.03 }
              as: LeagueOfficer
              captures: { aid: $.data.id }
            - call: "POST /agencies/${aid}/agents"
              payload: { full_name: "M", email: "m@g.example", cert_number: "MG", is_manager: true }
              as: AgencyManager
              captures: { m_id: $.data.id }
            - call: "POST /agencies/${aid}/agents/${m_id}/certify"
              payload: {}
              as: AgencyManager
              as_user_id: "${m_id}"
            - call: "POST /agencies/${aid}/agents"
              payload: { full_name: "A", email: "a@g.example", cert_number: "AG" }
              as: AgencyManager
              as_user_id: "${m_id}"
              captures: { a_id: $.data.id }
            - call: "POST /agencies/${aid}/agents/${a_id}/certify"
              payload: {}
              as: AgencyManager
              as_user_id: "${m_id}"
            - call: "POST /agencies/${aid}/clients"
              payload: { primary_agent_id: "${a_id}", full_name: "P", position: "PG" }
              as: Agent
              as_user_id: "${a_id}"
              captures: { c_id: $.data.id }
            - call: "POST /agencies/${aid}/clients/${c_id}/contracts"
              payload: { team_id: "${team_id}", cap_season_id: "${cs_id}", start_season_year: 2026, years: 1, base_salary_cents: 5000000, guaranteed_cents: 5000000, signing_bonus_cents: 0, incentive_cents: 0, escalator_pct: 0 }
              as: Agent
              as_user_id: "${a_id}"
              captures: { con_id: $.data.id }
            - call: "POST /agencies/${aid}/clients/${c_id}/contracts/${con_id}/proposals"
              payload: { proposed_by_agent_id: "${a_id}", proposed_aav_cents: 5000000, proposed_guaranteed_cents: 5000000 }
              as: Agent
              as_user_id: "${a_id}"
              captures: { p_id: $.data.id }
            - call: "GET /teams/${team_id}/cap_seasons/${cs_id}"
              as: LeagueOfficer
              captures: { cs_v: $.data.version }
            - call: "POST /agencies/${aid}/clients/${c_id}/contracts/${con_id}/proposals/${p_id}/submit"
              payload: { expected_cap_season_version: "${cs_v}" }
              as: Agent
              as_user_id: "${a_id}"
            - call: "POST /agencies/${aid}/clients/${c_id}/contracts/${con_id}/proposals/${p_id}/accept"
              payload: {}
              as: Team
              as_user_id: "${team_id}"
            - call: "GET /agencies/${aid}/clients/${c_id}/contracts/${con_id}"
              as: Agent
              as_user_id: "${a_id}"
              captures: { con_v: $.data.version }
            - call: "POST /agencies/${aid}/clients/${c_id}/contracts/${con_id}/sign"
              payload: { expected_contract_version: "${con_v}" }
              as: Agent
              as_user_id: "${a_id}"
            - call: "POST /agencies/${aid}/clients/${c_id}/contracts/${con_id}/grievances"
              payload: { filed_by_agent_id: "${a_id}", category: "NON_PAYMENT", description: "Missing check", claimed_amount_cents: 500000 }
              as: Agent
              as_user_id: "${a_id}"
              captures: { g_id: $.data.id }
            - call: "POST /agencies/${aid}/clients/${c_id}/contracts/${con_id}/grievances/${g_id}/start_review"
              payload: {}
              as: LeagueOfficer
            - call: "POST /agencies/${aid}/clients/${c_id}/contracts/${con_id}/grievances/${g_id}/escalate"
              payload: {}
              as: LeagueOfficer
            - call: "POST /agencies/${aid}/clients/${c_id}/contracts/${con_id}/grievances/${g_id}/resolve"
              payload: { resolution_outcome: "UPHELD" }
              as: LeagueOfficer
          trigger:
            - call: "POST /agencies/${aid}/clients/${c_id}/contracts/${con_id}/grievances/${g_id}/start_review"
              payload: {}
              as: LeagueOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE  # RESOLVED is terminal"
            - "http status == 409"

      - name: grievance_under_review_to_filed_revert
        claim_type: valid_transition
        grounds:
          - state_machines.Grievance.UNDER_REVIEW_to_FILED
        distinguishing_aspect: "LeagueOfficer can return a grievance UNDER_REVIEW -> FILED (branching revert loop)."
        test_recipe:
          setup: ["Grievance FILED then start_review -> UNDER_REVIEW"]
          setup_api_calls:
            - call: "POST /teams"
              payload: { name: "GRT", league_code: "NBA" }
              as: LeagueOfficer
              captures: { team_id: $.data.id }
            - call: "POST /teams/${team_id}/cap_seasons"
              payload: { season_year: 2026, cap_limit_cents: 500000000, luxury_threshold_cents: 600000000 }
              as: LeagueOfficer
              captures: { cs_id: $.data.id }
            - call: "POST /agencies"
              payload: { name: "GRA", fee_cap_pct: 0.03 }
              as: LeagueOfficer
              captures: { aid: $.data.id }
            - call: "POST /agencies/${aid}/agents"
              payload: { full_name: "M", email: "m@gr.example", cert_number: "MGR", is_manager: true }
              as: AgencyManager
              captures: { m_id: $.data.id }
            - call: "POST /agencies/${aid}/agents/${m_id}/certify"
              payload: {}
              as: AgencyManager
              as_user_id: "${m_id}"
            - call: "POST /agencies/${aid}/agents"
              payload: { full_name: "A", email: "a@gr.example", cert_number: "AGR" }
              as: AgencyManager
              as_user_id: "${m_id}"
              captures: { a_id: $.data.id }
            - call: "POST /agencies/${aid}/agents/${a_id}/certify"
              payload: {}
              as: AgencyManager
              as_user_id: "${m_id}"
            - call: "POST /agencies/${aid}/clients"
              payload: { primary_agent_id: "${a_id}", full_name: "P", position: "PG" }
              as: Agent
              as_user_id: "${a_id}"
              captures: { c_id: $.data.id }
            - call: "POST /agencies/${aid}/clients/${c_id}/contracts"
              payload: { team_id: "${team_id}", cap_season_id: "${cs_id}", start_season_year: 2026, years: 1, base_salary_cents: 5000000, guaranteed_cents: 5000000, signing_bonus_cents: 0, incentive_cents: 0, escalator_pct: 0 }
              as: Agent
              as_user_id: "${a_id}"
              captures: { con_id: $.data.id }
            - call: "POST /agencies/${aid}/clients/${c_id}/contracts/${con_id}/grievances"
              payload: { filed_by_agent_id: "${a_id}", category: "BONUS_DISPUTE", description: "d", claimed_amount_cents: 100000 }
              as: Agent
              as_user_id: "${a_id}"
              captures: { g_id: $.data.id }
            - call: "POST /agencies/${aid}/clients/${c_id}/contracts/${con_id}/grievances/${g_id}/start_review"
              payload: {}
              as: LeagueOfficer
          trigger:
            - call: "POST /agencies/${aid}/clients/${c_id}/contracts/${con_id}/grievances/${g_id}/return_for_cure"
              payload: {}
              as: LeagueOfficer
          assert:
            - "Grievance.${g_id}.status == FILED  # revert loop"

      - name: proposal_side_effect_releases_reserved_on_reject
        claim_type: side_effect_execution
        grounds:
          - state_machines.Proposal.SUBMITTED_to_REJECTED
        distinguishing_aspect: "Rejection releases reserved_cents on the linked CapSeason."
        test_recipe:
          setup: ["CapSeason reserved=20M via one submitted proposal"]
          setup_api_calls:
            - call: "POST /teams"
              payload: { name: "RejT", league_code: "NBA" }
              as: LeagueOfficer
              captures: { team_id: $.data.id }
            - call: "POST /teams/${team_id}/cap_seasons"
              payload: { season_year: 2026, cap_limit_cents: 500000000, luxury_threshold_cents: 600000000 }
              as: LeagueOfficer
              captures: { cs_id: $.data.id }
            - call: "POST /agencies"
              payload: { name: "RejA", fee_cap_pct: 0.03 }
              as: LeagueOfficer
              captures: { aid: $.data.id }
            - call: "POST /agencies/${aid}/agents"
              payload: { full_name: "M", email: "m@rj.example", cert_number: "MRJ", is_manager: true }
              as: AgencyManager
              captures: { m_id: $.data.id }
            - call: "POST /agencies/${aid}/agents/${m_id}/certify"
              payload: {}
              as: AgencyManager
              as_user_id: "${m_id}"
            - call: "POST /agencies/${aid}/agents"
              payload: { full_name: "A", email: "a@rj.example", cert_number: "ARJ" }
              as: AgencyManager
              as_user_id: "${m_id}"
              captures: { a_id: $.data.id }
            - call: "POST /agencies/${aid}/agents/${a_id}/certify"
              payload: {}
              as: AgencyManager
              as_user_id: "${m_id}"
            - call: "POST /agencies/${aid}/clients"
              payload: { primary_agent_id: "${a_id}", full_name: "P", position: "PG" }
              as: Agent
              as_user_id: "${a_id}"
              captures: { c_id: $.data.id }
            - call: "POST /agencies/${aid}/clients/${c_id}/contracts"
              payload: { team_id: "${team_id}", cap_season_id: "${cs_id}", start_season_year: 2026, years: 1, base_salary_cents: 20000000, guaranteed_cents: 20000000, signing_bonus_cents: 0, incentive_cents: 0, escalator_pct: 0 }
              as: Agent
              as_user_id: "${a_id}"
              captures: { con_id: $.data.id }
            - call: "POST /agencies/${aid}/clients/${c_id}/contracts/${con_id}/proposals"
              payload: { proposed_by_agent_id: "${a_id}", proposed_aav_cents: 20000000, proposed_guaranteed_cents: 20000000 }
              as: Agent
              as_user_id: "${a_id}"
