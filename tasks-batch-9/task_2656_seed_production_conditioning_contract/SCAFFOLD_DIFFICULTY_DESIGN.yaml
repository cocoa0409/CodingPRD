# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_2656_seed_production_conditioning_contract
#
# Every instance grounds in SCAFFOLD.yaml §1.1-§1.7 only. Numeric asserts were
# produced by executing the §1.3 formulas with their declared constants.
# Fixture conventions used by every chain below:
#   - the logical clock starts at its declared default 2026-08-01T00:00:00Z
#   - variety HRW-Sable: isolation_min_m 200.0, restricted {WHEAT, TRITICALE},
#     3-year look-back, germ_min 85.0, purity_min 97.0, off-type tol 10.0/10000,
#     weed tol 5.0/10000, disease tol 2.0 pct, book shrink 8.0 pct,
#     germ_validity_days 270, treatment_required false
#   - contract HRW-2026: base 1850 c/unit, conditioning charge 220 c/unit,
#     advance 1200000 c, UNIT_KG 25.0
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: clean_unit_variant_divergence_provisional_vs_final
        grounds:
          - calculations.clean_seed_unit_accounting
          - entities.HarvestEvent.fields.provisional_clean_units
          - entities.SeedLot.fields.final_clean_units
          - state_machines.SeedLot.conditioning_status_SIZED_to_BAGGED
        distinguishing_aspect: |
          This instance is mass/unit accounting on the HarvestEvent+SeedLot entity domain: the same
          41000.0 kg harvest yields 1452.22 provisional units from the book moisture dockage and book
          8.0 pct conditioning shrink, but 1380.05 final units from the measured bagged mass, so the
          two variants disagree by 72.17 units on identical harvest inputs.
        test_recipe:
          setup:
            - "One WHEAT variety with estimated_conditioning_shrink_pct 8.0 and treatment_required false"
            - "One grower in GOOD_STANDING owning a 320-acre field with 250.0 m isolation and a CANOLA 2024 history row"
            - "A 2026 CERTIFIED contract signed and inspected PASSED, so the contract is INSPECTION_PASSED"
            - "A combine certified clean for that variety and a conditioning line with a 60-minute cleanout requirement"
            - "The harvest event books 41000.0 kg at 14.5 pct moisture with 25.0 kg bags; the lot is then cleaned, sized and bagged to 34501.25 kg"
            - "Logical clock advanced to 2026-09-14T00:00:00Z so every window is elapsed"
          setup_api_calls:
            - call: "POST /seed-ops/varieties"
              payload: { crop_kind: "WHEAT", variety_name: "HRW-Sable", max_seed_class: "CERTIFIED", isolation_min_m: 200.0, restricted_prior_crop_kinds: ["WHEAT", "TRITICALE"], restricted_prior_crop_years: 3, germination_min_pct: 85.0, purity_min_pct: 97.0, max_off_type_per_10000: 10.0, max_restricted_weed_per_10000: 5.0, max_disease_incidence_pct: 2.0, max_rogueing_rounds: 2, estimated_conditioning_shrink_pct: 8.0, germ_validity_days: 270, max_carryover_generations: 2, treatment_required: false }
              as: ProgramAdmin
              captures: { v_id: $.data.id }
            - call: "POST /seed-ops/growers"
              payload: { grower_name: "Prairie Ridge Farms", region_code: "ND-07", contact_email: "ops@prairieridge.example" }
              as: ProgramAdmin
              captures: { g_id: $.data.id }
            - call: "POST /seed-ops/production-fields"
              payload: { grower_id: "${g_id}", field_code: "F-North-12", acres: 320.0, isolation_distance_m: 250.0 }
              as: ProgramAdmin
              captures: { f_id: $.data.id }
            - call: "POST /seed-ops/production-fields/${f_id}/history"
              payload: { crop_kind: "CANOLA", crop_year: 2024 }
              as: FieldOfficer
            - call: "POST /seed-ops/production-contracts"
              payload: { grower_id: "${g_id}", variety_id: "${v_id}", production_field_id: "${f_id}", season_year: 2026, seed_class: "CERTIFIED", contracted_acres: 300.0, base_price_per_unit_cents: 1850, conditioning_charge_per_unit_cents: 220, advance_total_cents: 1200000 }
              as: ProgramAdmin
              captures: { c_id: $.data.id }
            - call: "POST /seed-ops/production-contracts/${c_id}/offer"
              payload: {}
              as: ProgramAdmin
            - call: "POST /seed-ops/production-contracts/${c_id}/sign"
              payload: { planted_on: "2026-04-15" }
              as: Grower
              as_user_id: "${g_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /seed-ops/field-inspections"
              payload: { production_contract_id: "${c_id}", inspected_on: "2026-08-20", sampled_plants: 20000, off_type_plants: 12, restricted_weed_plants: 4, diseased_plants: 100, isolation_verified_m: 250.0 }
              as: FieldOfficer
              as_user_id: "fo-1"
            - call: "POST /seed-ops/harvest-equipment"
              payload: { equipment_code: "CMB-7", equipment_kind: "COMBINE", cleanout_minutes_required: 45 }
              as: ConditioningManager
              captures: { eq_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-14T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /seed-ops/harvest-equipment/${eq_id}/cleanout-certification"
              payload: { variety_id: "${v_id}", cleaned_at: "2026-09-09T18:00:00Z" }
              as: ConditioningManager
            - call: "POST /seed-ops/conditioning-lines"
              payload: { line_code: "LN-1", cleanout_minutes_required: 60, capacity_kg_per_hour: 8000.0 }
              as: ConditioningManager
              captures: { ln_id: $.data.id }
            - call: "POST /seed-ops/harvest-events"
              payload: { production_contract_id: "${c_id}", harvest_equipment_id: "${eq_id}", window_start: "2026-09-10T08:00:00Z", window_end: "2026-09-10T18:00:00Z", gross_weight_kg: 41000.0, moisture_pct: 14.5, bag_size_kg: 25.0 }
              as: ConditioningManager
              captures: { he_id: $.data.id, lot_id: $.data.seed_lot_id }
            - call: "POST /seed-ops/conditioning-runs"
              payload: { seed_lot_id: "${lot_id}", conditioning_line_id: "${ln_id}", stage: "CLEANING", window_start: "2026-09-12T06:00:00Z", window_end: "2026-09-12T12:00:00Z", input_kg: 41000.0 }
              as: ConditioningManager
              captures: { r1_id: $.data.id }
            - call: "POST /seed-ops/conditioning-runs/${r1_id}/complete"
              payload: { output_kg: 37800.0 }
              as: ConditioningManager
            - call: "POST /seed-ops/conditioning-runs"
              payload: { seed_lot_id: "${lot_id}", conditioning_line_id: "${ln_id}", stage: "SIZING", window_start: "2026-09-12T13:00:00Z", window_end: "2026-09-12T17:00:00Z", input_kg: 37800.0 }
              as: ConditioningManager
              captures: { r2_id: $.data.id }
            - call: "POST /seed-ops/conditioning-runs/${r2_id}/complete"
              payload: { output_kg: 36000.0 }
              as: ConditioningManager
            - call: "POST /seed-ops/conditioning-runs"
              payload: { seed_lot_id: "${lot_id}", conditioning_line_id: "${ln_id}", stage: "BAGGING", window_start: "2026-09-13T06:00:00Z", window_end: "2026-09-13T10:00:00Z", input_kg: 36000.0 }
              as: ConditioningManager
              captures: { r3_id: $.data.id }
          trigger:
            - call: "POST /seed-ops/conditioning-runs/${r3_id}/complete"
              payload: { output_kg: 34501.25 }
              as: ConditioningManager
          assert:
            - "HarvestEvent.${he_id}.moisture_dockage_pct == 3.75"
            - "HarvestEvent.${he_id}.provisional_clean_kg == 36305.500"
            - "HarvestEvent.${he_id}.provisional_clean_units == 1452.22"
            - "SeedLot.${lot_id}.final_clean_units == 1380.05"
            - "SeedLot.${lot_id}.bag_count == 1380"
            - "SeedLot.${lot_id}.provisional_clean_units == 1452.22 and SeedLot.${lot_id}.final_clean_units == 1380.05 (the two variants disagree)"
            - "ProductionContract.${c_id}.provisional_clean_units_total == 1452.22 (unchanged by the FINAL_BAGGED_BASIS variant)"
            - "SeedLot.${lot_id}.conditioning_status == BAGGED and SeedLot.${lot_id}.certification_status == UNSAMPLED"

      - name: eligibility_variant_divergence_strict_vs_decay
        grounds:
          - calculations.field_eligibility_assessment
          - entities.ProductionField.fields.last_assessed_risk_score
          - entities.FieldHistoryRecord.fields.crop_year
          - endpoints[POST /seed-ops/production-fields/{production_field_id}/eligibility-assessments]
        distinguishing_aspect: |
          This instance is contamination risk scoring on the ProductionField entity domain - a
          different subject and metric from the mass/unit variant above: a field carrying WHEAT in
          2024 is INELIGIBLE under STRICT_HISTORY yet ELIGIBLE under DECAY_WEIGHTED because the
          decayed score is exactly 25.00, the inclusive eligibility ceiling.
        test_recipe:
          setup:
            - "One WHEAT variety with restricted_prior_crop_kinds {WHEAT, TRITICALE} and a 3-crop-year look-back"
            - "One field with 250.0 m isolation (no shortfall) whose only history row is WHEAT in crop_year 2024"
            - "No contract exists yet; the assessment endpoint is queried directly for season 2026"
          setup_api_calls:
            - call: "POST /seed-ops/varieties"
              payload: { crop_kind: "WHEAT", variety_name: "HRW-Sable", max_seed_class: "CERTIFIED", isolation_min_m: 200.0, restricted_prior_crop_kinds: ["WHEAT", "TRITICALE"], restricted_prior_crop_years: 3, germination_min_pct: 85.0, purity_min_pct: 97.0, max_off_type_per_10000: 10.0, max_restricted_weed_per_10000: 5.0, max_disease_incidence_pct: 2.0, max_rogueing_rounds: 2, estimated_conditioning_shrink_pct: 8.0, germ_validity_days: 270, max_carryover_generations: 2, treatment_required: false }
              as: ProgramAdmin
              captures: { v_id: $.data.id }
            - call: "POST /seed-ops/growers"
              payload: { grower_name: "Prairie Ridge Farms", region_code: "ND-07", contact_email: "ops@prairieridge.example" }
              as: ProgramAdmin
              captures: { g_id: $.data.id }
            - call: "POST /seed-ops/production-fields"
              payload: { grower_id: "${g_id}", field_code: "F-South-3", acres: 180.0, isolation_distance_m: 250.0 }
              as: FieldOfficer
              captures: { f_id: $.data.id }
            - call: "POST /seed-ops/production-fields/${f_id}/history"
              payload: { crop_kind: "WHEAT", crop_year: 2024 }
              as: FieldOfficer
          trigger:
            - call: "POST /seed-ops/production-fields/${f_id}/eligibility-assessments"
              payload: { variety_id: "${v_id}", season_year: 2026, seed_class: "CERTIFIED" }
              as: FieldOfficer
            - call: "POST /seed-ops/production-fields/${f_id}/eligibility-assessments"
              payload: { variety_id: "${v_id}", season_year: 2026, seed_class: "COMMERCIAL_INCREASE" }
              as: FieldOfficer
          assert:
            - "First response data.strict_history_result == INELIGIBLE"
            - "First response data.decay_weighted_result == ELIGIBLE"
            - "First response data.restricted_record_count == 1"
            - "First response data.history_component == 25.00"
            - "First response data.isolation_component == 0.00"
            - "First response data.contamination_risk_score == 25.00"
            - "First response data.isolation_shortfall_m == 0.00"
            - "First response data.applied_variant == STRICT_HISTORY and data.applied_result == INELIGIBLE and data.blocking_error_id == ERR_FIELD_HISTORY_RESTRICTED"
            - "Second response data.applied_variant == DECAY_WEIGHTED and data.applied_result == ELIGIBLE and data.blocking_error_id == null"
            - "ProductionField.${f_id}.last_assessed_risk_score == 25.00"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: price_adjustment_nonlinear_quality_interaction
        grounds:
          - calculations.adjusted_price_per_unit
          - entities.SeedLot.fields.adjusted_price_per_unit_cents
          - entities.SeedLot.fields.intake_moisture_pct
          - state_machines.SeedLot.certification_status_SAMPLED_to_PASSED
        distinguishing_aspect: |
          MODE (a): four independent inputs (germination_pct, purity_pct, weed_seed_count_per_kg and
          the lot's intake_moisture_pct) select three separate inclusive-lower-bound tiers whose
          signed percentages are then folded through nested min/max clamping, so germination 91.0,
          purity 97.5, 6 weed seeds/kg and 13.0 pct intake moisture land on 1730 cents rather than
          the 1850-cent base.
        test_recipe:
          setup:
            - "Golden reference data and a signed, PASSED-inspected 2026 CERTIFIED contract at base price 1850 cents"
            - "Harvest of 41000.0 kg at 13.0 pct moisture, so the lot's intake_moisture_pct is 13.0 and the moisture dockage is 1.50 pct"
            - "Lot conditioned to BAGGED (34501.25 kg, 1380 bags) and sampled INITIAL"
            - "Logical clock at 2026-09-14T00:00:00Z"
          setup_api_calls:
            - call: "POST /seed-ops/varieties"
              payload: { crop_kind: "WHEAT", variety_name: "HRW-Sable", max_seed_class: "CERTIFIED", isolation_min_m: 200.0, restricted_prior_crop_kinds: ["WHEAT", "TRITICALE"], restricted_prior_crop_years: 3, germination_min_pct: 85.0, purity_min_pct: 97.0, max_off_type_per_10000: 10.0, max_restricted_weed_per_10000: 5.0, max_disease_incidence_pct: 2.0, max_rogueing_rounds: 2, estimated_conditioning_shrink_pct: 8.0, germ_validity_days: 270, max_carryover_generations: 2, treatment_required: false }
              as: ProgramAdmin
              captures: { v_id: $.data.id }
            - call: "POST /seed-ops/growers"
              payload: { grower_name: "Prairie Ridge Farms", region_code: "ND-07", contact_email: "ops@prairieridge.example" }
              as: ProgramAdmin
              captures: { g_id: $.data.id }
            - call: "POST /seed-ops/production-fields"
              payload: { grower_id: "${g_id}", field_code: "F-North-12", acres: 320.0, isolation_distance_m: 250.0 }
              as: ProgramAdmin
              captures: { f_id: $.data.id }
            - call: "POST /seed-ops/production-fields/${f_id}/history"
              payload: { crop_kind: "CANOLA", crop_year: 2024 }
              as: FieldOfficer
            - call: "POST /seed-ops/production-contracts"
              payload: { grower_id: "${g_id}", variety_id: "${v_id}", production_field_id: "${f_id}", season_year: 2026, seed_class: "CERTIFIED", contracted_acres: 300.0, base_price_per_unit_cents: 1850, conditioning_charge_per_unit_cents: 220, advance_total_cents: 1200000 }
              as: ProgramAdmin
              captures: { c_id: $.data.id }
            - call: "POST /seed-ops/production-contracts/${c_id}/offer"
              payload: {}
              as: ProgramAdmin
            - call: "POST /seed-ops/production-contracts/${c_id}/sign"
              payload: { planted_on: "2026-04-15" }
              as: Grower
              as_user_id: "${g_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /seed-ops/field-inspections"
              payload: { production_contract_id: "${c_id}", inspected_on: "2026-08-20", sampled_plants: 20000, off_type_plants: 12, restricted_weed_plants: 4, diseased_plants: 100, isolation_verified_m: 250.0 }
              as: FieldOfficer
              as_user_id: "fo-1"
            - call: "POST /seed-ops/harvest-equipment"
              payload: { equipment_code: "CMB-7", equipment_kind: "COMBINE", cleanout_minutes_required: 45 }
              as: ConditioningManager
              captures: { eq_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-14T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /seed-ops/harvest-equipment/${eq_id}/cleanout-certification"
              payload: { variety_id: "${v_id}", cleaned_at: "2026-09-09T18:00:00Z" }
              as: ConditioningManager
            - call: "POST /seed-ops/conditioning-lines"
              payload: { line_code: "LN-1", cleanout_minutes_required: 60, capacity_kg_per_hour: 8000.0 }
              as: ConditioningManager
              captures: { ln_id: $.data.id }
            - call: "POST /seed-ops/harvest-events"
              payload: { production_contract_id: "${c_id}", harvest_equipment_id: "${eq_id}", window_start: "2026-09-10T08:00:00Z", window_end: "2026-09-10T18:00:00Z", gross_weight_kg: 41000.0, moisture_pct: 13.0, bag_size_kg: 25.0 }
              as: ConditioningManager
              captures: { lot_id: $.data.seed_lot_id }
            - call: "POST /seed-ops/conditioning-runs"
              payload: { seed_lot_id: "${lot_id}", conditioning_line_id: "${ln_id}", stage: "CLEANING", window_start: "2026-09-12T06:00:00Z", window_end: "2026-09-12T12:00:00Z", input_kg: 41000.0 }
              as: ConditioningManager
              captures: { r1_id: $.data.id }
            - call: "POST /seed-ops/conditioning-runs/${r1_id}/complete"
              payload: { output_kg: 37800.0 }
              as: ConditioningManager
            - call: "POST /seed-ops/conditioning-runs"
              payload: { seed_lot_id: "${lot_id}", conditioning_line_id: "${ln_id}", stage: "SIZING", window_start: "2026-09-12T13:00:00Z", window_end: "2026-09-12T17:00:00Z", input_kg: 37800.0 }
              as: ConditioningManager
              captures: { r2_id: $.data.id }
            - call: "POST /seed-ops/conditioning-runs/${r2_id}/complete"
              payload: { output_kg: 36000.0 }
              as: ConditioningManager
            - call: "POST /seed-ops/conditioning-runs"
              payload: { seed_lot_id: "${lot_id}", conditioning_line_id: "${ln_id}", stage: "BAGGING", window_start: "2026-09-13T06:00:00Z", window_end: "2026-09-13T10:00:00Z", input_kg: 36000.0 }
              as: ConditioningManager
              captures: { r3_id: $.data.id }
            - call: "POST /seed-ops/conditioning-runs/${r3_id}/complete"
              payload: { output_kg: 34501.25 }
              as: ConditioningManager
            - call: "POST /seed-ops/lot-samples"
              payload: { seed_lot_id: "${lot_id}", sample_kind: "INITIAL", sampled_on: "2026-09-14" }
              as: CertificationAgency
              as_user_id: "agency-1"
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /seed-ops/lot-samples/${s_id}/results"
              payload: { germination_pct: 91.0, purity_pct: 97.5, inert_pct: 2.0, weed_seed_count_per_kg: 6, tested_at: "2026-09-14T00:00:00Z" }
              as: CertificationAgency
              as_user_id: "agency-1"
          assert:
            - "LotSample.${s_id}.result == PASS"
            - "SeedLot.${lot_id}.intake_moisture_pct == 13.0"
            - "SeedLot.${lot_id}.adjusted_price_per_unit_cents == 1730"
            - "SeedLot.${lot_id}.certification_status == PASSED"
            - "SeedLot.${lot_id}.germination_pct == 91.0 and SeedLot.${lot_id}.purity_pct == 97.5 and SeedLot.${lot_id}.weed_seed_count_per_kg == 6"

      - name: settlement_per_line_rounding_before_summation
        grounds:
          - calculations.settlement_line_rollup
          - entities.GrowerSettlement.fields.gross_payable_cents
          - entities.GrowerSettlement.fields.conditioning_charges_cents
          - entities.SeedLot.fields.final_clean_units
        distinguishing_aspect: |
          MODE (b): two tagged lots of one contract carry final_clean_units 1380.05 and 940.05 at
          1929 cents/unit, so rounding each line to whole cents BEFORE summation yields
          gross_payable_cents 4475472 while the forbidden sum-then-round order yields 4475473 - a
          one-cent divergence that pins the declared rounding order.
        test_recipe:
          setup:
            - "Golden reference data, one 2026 CERTIFIED contract at base 1850 / charge 220 / advance 1200000"
            - "Two harvest events on the same contract: 41000.0 kg and 28000.0 kg, both at 14.5 pct moisture with 25.0 kg bags"
            - "The combine is re-certified for the variety between the two harvests and the two harvest windows do not touch"
            - "Both lots conditioned to BAGGED on line LN-1 with non-overlapping windows: lot A to 34501.25 kg (1380.05 units), lot B to 23501.25 kg (940.05 units)"
            - "Both lots tested germination 96.0 / purity 99.6 / 0 weed seeds, so both price at 1929 cents per unit, and both fully tagged"
            - "Logical clock at 2026-09-14T00:00:00Z"
          setup_api_calls:
            - call: "POST /seed-ops/varieties"
              payload: { crop_kind: "WHEAT", variety_name: "HRW-Sable", max_seed_class: "CERTIFIED", isolation_min_m: 200.0, restricted_prior_crop_kinds: ["WHEAT", "TRITICALE"], restricted_prior_crop_years: 3, germination_min_pct: 85.0, purity_min_pct: 97.0, max_off_type_per_10000: 10.0, max_restricted_weed_per_10000: 5.0, max_disease_incidence_pct: 2.0, max_rogueing_rounds: 2, estimated_conditioning_shrink_pct: 8.0, germ_validity_days: 270, max_carryover_generations: 2, treatment_required: false }
              as: ProgramAdmin
              captures: { v_id: $.data.id }
            - call: "POST /seed-ops/growers"
              payload: { grower_name: "Prairie Ridge Farms", region_code: "ND-07", contact_email: "ops@prairieridge.example" }
              as: ProgramAdmin
              captures: { g_id: $.data.id }
            - call: "POST /seed-ops/production-fields"
              payload: { grower_id: "${g_id}", field_code: "F-North-12", acres: 320.0, isolation_distance_m: 250.0 }
              as: ProgramAdmin
              captures: { f_id: $.data.id }
            - call: "POST /seed-ops/production-fields/${f_id}/history"
              payload: { crop_kind: "CANOLA", crop_year: 2024 }
              as: FieldOfficer
            - call: "POST /seed-ops/production-contracts"
              payload: { grower_id: "${g_id}", variety_id: "${v_id}", production_field_id: "${f_id}", season_year: 2026, seed_class: "CERTIFIED", contracted_acres: 300.0, base_price_per_unit_cents: 1850, conditioning_charge_per_unit_cents: 220, advance_total_cents: 1200000 }
              as: ProgramAdmin
              captures: { c_id: $.data.id }
            - call: "POST /seed-ops/production-contracts/${c_id}/offer"
              payload: {}
              as: ProgramAdmin
            - call: "POST /seed-ops/production-contracts/${c_id}/sign"
              payload: { planted_on: "2026-04-15" }
              as: Grower
              as_user_id: "${g_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /seed-ops/field-inspections"
              payload: { production_contract_id: "${c_id}", inspected_on: "2026-08-20", sampled_plants: 20000, off_type_plants: 12, restricted_weed_plants: 4, diseased_plants: 100, isolation_verified_m: 250.0 }
              as: FieldOfficer
              as_user_id: "fo-1"
            - call: "POST /seed-ops/harvest-equipment"
              payload: { equipment_code: "CMB-7", equipment_kind: "COMBINE", cleanout_minutes_required: 45 }
              as: ConditioningManager
              captures: { eq_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-14T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /seed-ops/harvest-equipment/${eq_id}/cleanout-certification"
              payload: { variety_id: "${v_id}", cleaned_at: "2026-09-09T18:00:00Z" }
              as: ConditioningManager
            - call: "POST /seed-ops/conditioning-lines"
              payload: { line_code: "LN-1", cleanout_minutes_required: 60, capacity_kg_per_hour: 8000.0 }
