            - "Retiree R3 'Priya Raghunathan': identical dates but credited_service_months 143, likewise GRANDFATHERED_A."
            - "Both retirees clear the subordinate gates: age_years_at_retirement 63 >= GRANDFATHERED_MIN_AGE 55, and service_years 12 and 11 both >= GRANDFATHERED_MIN_SERVICE_YEARS 10, so points is the only discriminator."
