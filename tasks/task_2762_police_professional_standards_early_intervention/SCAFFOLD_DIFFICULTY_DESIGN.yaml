  - rule_id: boundary_precision_check
    instances:
      - name: preponderance_decided_on_the_rounded_support_pct_not_the_raw_ratio
        grounds:
          - calculations.preponderance_evaluation
          - entities.Allegation.fields.support_pct
          - endpoints["POST /investigations/{id}/findings"]
          - endpoints["POST /allegations/{id}/disposition"]
          - validations[priority=12]
        distinguishing_aspect: |
          Evidence weights 5001 against 5000 give a raw ratio of 50.005 percent, which is above
          the threshold, yet the comparison runs on the value rounded to two places, so
          support_pct is 50.00 and preponderance_met is false; weights 5002 against 5000 round up
          to 50.01 and the same disposition then succeeds.
        test_recipe:
          setup:
            - "One CLASS_II complaint carries a single offense_class C allegation against Officer Vance."
            - "Investigator Ahn is assigned and one interview has been held, so findings may be submitted."
            - "Commander Reyes never investigated the case, so the segregation-of-duties rule is satisfied on every disposition attempt."
            - "The logical clock stands at 2026-08-05T09:00:00Z."
