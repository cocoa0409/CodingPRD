  # =========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: voucher_commit_release_and_void_conserve_sponsor_ledger_identity
        grounds:
          - calculations.corporate_voucher_ledger
          - state_machines.Voucher.ISSUED_to_VOIDED
          - state_machines.Voucher.ASSIGNED_to_VOIDED
          - state_machines.Offering.OPEN_to_CANCELLED
          - entities.CorporateAccount.fields.funded_cents
          - entities.CorporateAccount.fields.available_cents
        distinguishing_aspect: |
          Conserved quantity 1 - SPONSOR MONEY. The named identity
          funded_cents == available_cents + unallocated_voucher_cents +
          committed_cents + consumed_cents must equal 500000 at every step: after the
          voucher commit (300000 + 137600 + 62400 + 0), after the compensating
          release driven by the offering cancellation (300000 + 200000 + 0 + 0), and
          after the voucher is voided (500000 + 0 + 0 + 0). Zero drift.
        test_recipe:
          setup:
            - "CorporateAccount ACME funded 500000 cents with one voucher of face_value_cents 200000 ASSIGNED to learner Ada."
            - "One OPEN TERM offering on EXT-101 with min_enrollment 3, census_at 2026-09-05, tuition_cents 60000, staffed by a SIGNED SENIOR contract."
            - "Ada is the offering's only registration and paid by VOUCHER, so total_due_cents 62400 sits in the voucher's committed bucket."
            - "Ledger immediately before the trigger: funded 500000, available 300000, unallocated 137600, committed 62400, consumed 0."
            - "Logical clock at 2026-09-05T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /courses"
              payload: { course_code: "EXT-101", title: "Foundations of Project Delivery", ceu_units: 1.2, contact_hours: 12, list_price_cents: 60000, delivery_mode: "ONLINE_SYNC", cpl_credit_units: 3.0 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { c_base_id: $.data.id }
            - call: "POST /offerings"
              payload: { course_id: "${c_base_id}", scheduling_mode: "TERM", term_code: "2026FA", start_date: "2026-09-20T00:00:00Z", end_date: "2026-11-20T00:00:00Z", census_at: "2026-09-05T00:00:00Z", session_count: 10, min_enrollment: 3, max_enrollment: 10, tuition_cents: 60000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { o_small_id: $.data.id }
            - call: "POST /instructors"
              payload: { email: "dana@ext.edu", full_name: "Dana Reyes", credential_level: "SENIOR" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { ins_a_id: $.data.id }
            - call: "POST /instructor-contracts"
              payload: { offering_id: "${o_small_id}", instructor_id: "${ins_a_id}", base_stipend_cents: 250000, per_enrollment_cents: 12345, enrollment_cap_for_pay: 8 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { k_small_id: $.data.id }
            - call: "POST /instructor-contracts/${k_small_id}/sign"
              payload: { decision: "ACCEPT" }
              as: Instructor
              as_user_id: "${ins_a_id}"
            - call: "POST /offerings/${o_small_id}/open"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { o_v0: $.data.version }
            - call: "POST /corporate-accounts"
              payload: { org_name: "ACME Industrial", billing_email: "ap@acme.example" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { acct_id: $.data.id }
            - call: "POST /corporate-accounts/${acct_id}/deposits"
              payload: { amount_cents: 500000 }
              as: CorporateSponsor
              as_user_id: "${acct_id}"
              captures: { acct_v1: $.data.version }
            - call: "POST /corporate-accounts/${acct_id}/vouchers"
              payload: { face_value_cents: 200000, expires_at: "2027-06-30T00:00:00Z", expected_corporate_account_version: "${acct_v1}" }
              as: CorporateSponsor
              as_user_id: "${acct_id}"
              captures: { v1_id: $.data.id }
            - call: "POST /learners"
              payload: { email: "ada@x.com", full_name: "Ada Ito", marketing_opt_in: true }
              as: Anonymous
              captures: { l1_id: $.data.id }
            - call: "POST /vouchers/${v1_id}/assign"
              payload: { learner_id: "${l1_id}" }
              as: CorporateSponsor
              as_user_id: "${acct_id}"
            - call: "POST /offerings/${o_small_id}/registrations"
              payload: { learner_id: "${l1_id}", expected_offering_version: "${o_v0}" }
              as: Learner
              as_user_id: "${l1_id}"
              captures: { r1_id: $.data.id }
            - call: "POST /registrations/${r1_id}/pay"
              payload: { method: "VOUCHER", voucher_id: "${v1_id}" }
              as: Learner
              as_user_id: "${l1_id}"
            - call: "GET /corporate-accounts/${acct_id}"
              payload: {}
              as: CorporateSponsor
              as_user_id: "${acct_id}"
              captures: { avail_committed: $.data.available_cents, unalloc_committed: $.data.unallocated_voucher_cents, comm_committed: $.data.committed_cents }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /offerings/${o_small_id}/census"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "GET /corporate-accounts/${acct_id}"
              payload: {}
              as: CorporateSponsor
              as_user_id: "${acct_id}"
              captures: { avail_released: $.data.available_cents, unalloc_released: $.data.unallocated_voucher_cents, comm_released: $.data.committed_cents, cons_released: $.data.consumed_cents }
            - call: "POST /vouchers/${v1_id}/void"
              payload: {}
              as: CorporateSponsor
              as_user_id: "${acct_id}"
              captures: { v_status: $.data.status }
            - call: "GET /corporate-accounts/${acct_id}"
              payload: {}
              as: CorporateSponsor
              as_user_id: "${acct_id}"
              captures: { avail_voided: $.data.available_cents, unalloc_voided: $.data.unallocated_voucher_cents }
          assert:
            - "${avail_committed} == 300000"
            - "${unalloc_committed} == 137600"
            - "${comm_committed} == 62400"
            - "${avail_released} == 300000"
            - "${unalloc_released} == 200000"
            - "${comm_released} == 0"
            - "${cons_released} == 0"
            - "${v_status} == VOIDED"
            - "${avail_voided} == 500000"
            - "${unalloc_voided} == 0"
            - "CorporateAccount.${acct_id}.funded_cents == 500000"
            - "CorporateAccount.${acct_id}.consumed_cents == 0"
            - "CorporateAccount.${acct_id}.committed_cents == 0"

      - name: completion_award_then_revoke_conserves_learner_ceu_total
        grounds:
          - calculations.learner_loyalty_and_ceu
          - state_machines.CompletionRecord.ISSUED_to_REVOKED
          - state_machines.Registration.ENROLLED_to_COMPLETED
          - entities.Learner.fields.lifetime_ceu_total
          - entities.Learner.fields.loyalty_tier
        distinguishing_aspect: |
          Conserved quantity 2 - CEU CREDIT, a different type of conserved quantity
          from sponsor money. The named identity lifetime_ceu_total ==
          round_half_up(sum of ceu_awarded over the learner's ISSUED
          CompletionRecords, 1) must hold before the award (0.0), after the award
          (1.2) and after the compensating revocation (back to exactly 0.0), with
          loyalty_tier tracking NEW -> RETURNING -> NEW and no residual drift.
        test_recipe:
          setup:
            - "One CENSUS_LOCKED TERM offering on EXT-101 (ceu_units 1.2), term_code 2026FA, session_count 10, min_enrollment 1."
            - "A SENIOR instructor holds an ACTIVE contract on it."
            - "Learner Ada is ENROLLED x PAID with sessions_attended 10, lifetime_completed_count 0, lifetime_ceu_total 0.0, loyalty_tier NEW."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /courses"
              payload: { course_code: "EXT-101", title: "Foundations of Project Delivery", ceu_units: 1.2, contact_hours: 12, list_price_cents: 60000, delivery_mode: "ONLINE_SYNC", cpl_credit_units: 3.0 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { c_base_id: $.data.id }
            - call: "POST /offerings"
              payload: { course_id: "${c_base_id}", scheduling_mode: "TERM", term_code: "2026FA", start_date: "2026-09-15T00:00:00Z", end_date: "2026-11-15T00:00:00Z", census_at: "2026-09-01T00:00:00Z", session_count: 10, min_enrollment: 1, max_enrollment: 10, tuition_cents: 60000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { o_one_id: $.data.id }
            - call: "POST /instructors"
              payload: { email: "dana@ext.edu", full_name: "Dana Reyes", credential_level: "SENIOR" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { ins_a_id: $.data.id }
            - call: "POST /instructor-contracts"
              payload: { offering_id: "${o_one_id}", instructor_id: "${ins_a_id}", base_stipend_cents: 250000, per_enrollment_cents: 12345, enrollment_cap_for_pay: 8 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { k_one_id: $.data.id }
            - call: "POST /instructor-contracts/${k_one_id}/sign"
              payload: { decision: "ACCEPT" }
              as: Instructor
              as_user_id: "${ins_a_id}"
            - call: "POST /offerings/${o_one_id}/open"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { o_v0: $.data.version }
            - call: "POST /learners"
              payload: { email: "ada@x.com", full_name: "Ada Ito", marketing_opt_in: true }
              as: Anonymous
              captures: { l1_id: $.data.id }
            - call: "POST /offerings/${o_one_id}/registrations"
              payload: { learner_id: "${l1_id}", expected_offering_version: "${o_v0}" }
              as: Learner
              as_user_id: "${l1_id}"
              captures: { r1_id: $.data.id }
            - call: "POST /registrations/${r1_id}/pay"
              payload: { method: "SELF_PAY" }
              as: Learner
              as_user_id: "${l1_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
