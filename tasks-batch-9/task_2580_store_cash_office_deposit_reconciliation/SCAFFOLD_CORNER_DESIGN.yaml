          - state_machines.VarianceCase.terminal_states
          - errors[ERR_VARIANCE_CASE_INVALID_STATE]
        distinguishing_aspect: >
          CLOSED_SUBSTANTIATED is terminal for research too: an attribution against the closed case
          returns 409 ERR_VARIANCE_CASE_INVALID_STATE at priority 40, before the priority-68 version
          check and before the priority-60 conservation check.
        test_recipe:
          setup:
            - "Store S-1966 (default thresholds), MANUAL safe SAFE-A (500000), cashier E-100, journal 2026-08-03"
            - "Session reconciles 60000 short; the SESSION_VARIANCE case is attributed 1000, escalated and closed SUBSTANTIATED"
