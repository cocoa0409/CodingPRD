      - name: the_project_wide_closure_capacity_counts_the_shared_instant_the_per_zone_rule_ignores
        grounds:
          - calculations.project_closure_capacity_peak
          - validations.priority_90
          - validations.priority_88
          - entities.ExhibitProject.fields.max_concurrent_closures
        distinguishing_aspect: |
          The scaffold deliberately runs two different interval geometries on the
          same rows. The per-zone conflict rule is half-open on buffered bounds,
          so 08:00-10:00 and 10:00-12:00 do not collide. The project-wide closure
          capacity rule is CLOSED on nominal bounds, so those same two spans are
          concurrent at the instant 10:00 and peak at 2. With
          max_concurrent_closures = 1 the second window is therefore refused on
          different zones - where no per-zone rule could ever apply - and accepted
          when it is moved one minute later. The final call shows the contrast
          directly: the identical 10:00-12:00 span is legal on the SAME zone as the
          first closure once requires_gallery_closure is false, because then only
          the half-open rule runs.
        test_recipe:
          setup:
            - "project created with max_concurrent_closures = 1 and advanced to FABRICATION"
            - "two zones Z-A and Z-B, both closure_allowed true, max_noise_dba 85.0"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProjectManager
            - call: "POST /exhibit-projects"
