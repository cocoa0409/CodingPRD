scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — dual_variant_calc (two variants, different entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: batch_yield_provisional_vs_final_diverge
        grounds:
          - calculations.provisional_yield_estimation
          - entities.ProcessingBatch.fields.yield_pct_provisional
          - entities.ProcessingBatch.fields.yield_pct_final
        distinguishing_aspect: |
          ProcessingBatch yield is computed twice over the SAME input composition:
          the provisional variant (BASE_YIELD x GRADE_FACTOR model) yields 41.30%
          while the final variant (measured actual_output_kg) yields 36.67% — a
          cost/accounting-domain dual variant, distinct from the food-safety
          histamine variant pair.
        test_recipe:
          setup:
            - "Approved supplier; RELEASED entry; two ACCEPTED TUNA lots: A = 100.000 kg grade A, B = 50.000 kg grade B"
            - "FILLET batch for TUNA consuming all of both lots (input_total 150.000 kg)"
          setup_api_calls:
            - { call: "POST /seafood/suppliers", payload: { legal_name: "Pacific Harvest Ltd", country_code: "JP", facility_registration_number: "FRN-1001" }, as: ComplianceManager, captures: { sup_id: "$.data.id", sup_v: "$.data.version" } }
            - { call: "POST /seafood/supplier-evaluations", payload: { supplier_id: "${sup_id}", expected_supplier_version: "${sup_v}", period_start: "2024-01-01T00:00:00Z", period_end: "2024-12-31T00:00:00Z", hazard_analysis_score: 90, record_review_score: 90, performance_score: 90 }, as: ComplianceManager }
            - { call: "POST /seafood/import-entries", payload: { supplier_id: "${sup_id}", entry_number: "E-1001", species_declared: "TUNA", transport_mode: "VESSEL", scheduled_arrival: "2026-08-10T00:00:00Z", port_code: "USLAX", goods_value_cents: 1000000, freight_cost_cents: 50000, duty_rate_pct: 0.03, total_weight_kg: 200 }, as: ImportCoordinator, captures: { ent_id: "$.data.id" } }
            - { call: "POST /seafood/import-entries/${ent_id}/file-prior-notice", payload: {}, as: ImportCoordinator }
            - { call: "POST /seafood/import-entries/${ent_id}/file-entry", payload: {}, as: ImportCoordinator }
            - { call: "POST /seafood/import-entries/${ent_id}/fda-disposition", payload: { outcome: "RELEASED" }, as: ImportCoordinator }
            - { call: "POST /seafood/receipt-lots", payload: { import_entry_id: "${ent_id}", vessel_name: "FV Pacific", harvest_date: "2026-07-20T00:00:00Z", catch_area_code: "FAO77", harvest_country_code: "US", production_method: "WILD", species_declared: "TUNA", grade: "A", quantity_received_kg: 100, ice_deduction_pct: 0, receiving_temp_c: 2.0, freeze_protocol: "NONE" }, as: ReceivingInspector, captures: { lot_a: "$.data.id" } }
            - { call: "POST /seafood/haccp-monitoring-records", payload: { hazard_type: "HISTAMINE", receipt_lot_id: "${lot_a}", phase: "SCREENING", measured_value: 30.0, measured_at: "2026-07-25T10:00:00Z" }, as: QualityAssuranceTech }
            - { call: "POST /seafood/species-verifications", payload: { receipt_lot_id: "${lot_a}", test_method: "DNA_BARCODING", sample_size: 3, verified_species: "TUNA" }, as: ReceivingInspector }
            - { call: "POST /seafood/receipt-lots/${lot_a}/accept", payload: {}, as: ReceivingInspector }
            - { call: "POST /seafood/receipt-lots", payload: { import_entry_id: "${ent_id}", vessel_name: "FV Pacific", harvest_date: "2026-07-20T00:00:00Z", catch_area_code: "FAO77", harvest_country_code: "US", production_method: "WILD", species_declared: "TUNA", grade: "B", quantity_received_kg: 50, ice_deduction_pct: 0, receiving_temp_c: 2.0, freeze_protocol: "NONE" }, as: ReceivingInspector, captures: { lot_b: "$.data.id" } }
            - { call: "POST /seafood/haccp-monitoring-records", payload: { hazard_type: "HISTAMINE", receipt_lot_id: "${lot_b}", phase: "SCREENING", measured_value: 25.0, measured_at: "2026-07-25T10:05:00Z" }, as: QualityAssuranceTech }
            - { call: "POST /seafood/species-verifications", payload: { receipt_lot_id: "${lot_b}", test_method: "SENSORY", sample_size: 3, verified_species: "TUNA" }, as: ReceivingInspector }
            - { call: "POST /seafood/receipt-lots/${lot_b}/accept", payload: {}, as: ReceivingInspector }
            - { call: "POST /seafood/processing-batches", payload: { target_species: "TUNA", product_form: "FILLET" }, as: ProcessingSupervisor, captures: { bat_id: "$.data.id" } }
            - { call: "POST /seafood/processing-batches/${bat_id}/inputs", payload: { receipt_lot_id: "${lot_a}", quantity_kg: 100 }, as: ProcessingSupervisor }
            - { call: "POST /seafood/processing-batches/${bat_id}/inputs", payload: { receipt_lot_id: "${lot_b}", quantity_kg: 50 }, as: ProcessingSupervisor }
            - { call: "GET /seafood/processing-batches/${bat_id}", payload: {}, as: ProcessingSupervisor, captures: { bat_v: "$.data.version" } }
          trigger:
            - { call: "POST /seafood/processing-batches/${bat_id}/complete", payload: { expected_batch_version: "${bat_v}", actual_output_kg: 55.0, trim_waste_kg: 80.0, other_waste_kg: 15.0 }, as: ProcessingSupervisor }
          assert:
            - "ProcessingBatch.${bat_id}.input_total_kg == 150.000"
            - "ProcessingBatch.${bat_id}.provisional_output_kg == 61.950  (42.000 from lot A + 19.950 from lot B, per-lot 3dp rounding then sum)"
            - "ProcessingBatch.${bat_id}.yield_pct_provisional == 41.30"
            - "ProcessingBatch.${bat_id}.yield_pct_final == 36.67"
            - "ProcessingBatch.${bat_id}.yield_variance_pct == -4.63"
            - "yield_pct_provisional (41.30) != yield_pct_final (36.67) for identical inputs"

      - name: histamine_screening_vs_confirmatory_diverge
        grounds:
          - calculations.histamine_verdict
          - entities.HaccpMonitoringRecord.fields.verdict
        distinguishing_aspect: |
          The SAME ReceiptLot's histamine data produces DEVIATION under the
          SCREENING variant (single value 60.0 >= 50.0 ppm) but PASS under the
          CONFIRMATORY variant (subsamples [45.0, 48.0, 52.0]: avg 48.33 < 50.0
          and max 52.0 < 100.0) — a food-safety-domain dual variant on
          ReceiptLot, a different entity domain than ProcessingBatch yield.
        test_recipe:
          setup:
            - "Approved supplier; RELEASED entry; one TUNA lot in UNDER_INSPECTION"
          setup_api_calls:
            - { call: "POST /seafood/suppliers", payload: { legal_name: "Bluefin Traders", country_code: "ES", facility_registration_number: "FRN-2001" }, as: ComplianceManager, captures: { sup_id: "$.data.id", sup_v: "$.data.version" } }
            - { call: "POST /seafood/supplier-evaluations", payload: { supplier_id: "${sup_id}", expected_supplier_version: "${sup_v}", period_start: "2024-01-01T00:00:00Z", period_end: "2024-12-31T00:00:00Z", hazard_analysis_score: 90, record_review_score: 90, performance_score: 90 }, as: ComplianceManager }
            - { call: "POST /seafood/import-entries", payload: { supplier_id: "${sup_id}", entry_number: "E-2001", species_declared: "TUNA", transport_mode: "VESSEL", scheduled_arrival: "2026-08-10T00:00:00Z", port_code: "USLAX", goods_value_cents: 500000, freight_cost_cents: 20000, duty_rate_pct: 0.03, total_weight_kg: 100 }, as: ImportCoordinator, captures: { ent_id: "$.data.id" } }
            - { call: "POST /seafood/import-entries/${ent_id}/file-prior-notice", payload: {}, as: ImportCoordinator }
            - { call: "POST /seafood/import-entries/${ent_id}/file-entry", payload: {}, as: ImportCoordinator }
            - { call: "POST /seafood/import-entries/${ent_id}/fda-disposition", payload: { outcome: "RELEASED" }, as: ImportCoordinator }
            - { call: "POST /seafood/receipt-lots", payload: { import_entry_id: "${ent_id}", vessel_name: "FV Azul", harvest_date: "2026-07-20T00:00:00Z", catch_area_code: "FAO27", harvest_country_code: "ES", production_method: "WILD", species_declared: "TUNA", grade: "A", quantity_received_kg: 80, ice_deduction_pct: 0, receiving_temp_c: 1.5, freeze_protocol: "NONE" }, as: ReceivingInspector, captures: { lot_id: "$.data.id" } }
          trigger:
            - { call: "POST /seafood/haccp-monitoring-records", payload: { hazard_type: "HISTAMINE", receipt_lot_id: "${lot_id}", phase: "SCREENING", measured_value: 60.0, measured_at: "2026-07-25T10:00:00Z" }, as: QualityAssuranceTech, as_user_id: "qa-01", captures: { rec1_verdict: "$.data.verdict" } }
            - { call: "POST /seafood/haccp-monitoring-records", payload: { hazard_type: "HISTAMINE", receipt_lot_id: "${lot_id}", phase: "CONFIRMATORY", subsample_values: [45.0, 48.0, 52.0], measured_at: "2026-07-26T10:00:00Z" }, as: QualityAssuranceTech, as_user_id: "qa-01", captures: { rec2_verdict: "$.data.verdict" } }
          assert:
            - "screening record verdict == DEVIATION (60.0 >= 50.0)"
            - "confirmatory record verdict == PASS (avg 48.33 < 50.0 and max 52.0 < 100.0)"
            - "ReceiptLot.${lot_id}.status == QUARANTINED after the screening DEVIATION"
            - "GET /seafood/corrective-actions?receipt_lot_id=${lot_id} returns exactly 1 row with source_type == HISTAMINE_DEVIATION, status == OPEN, opened_by == qa-01"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (different modes)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: freeze_combo_protocol_cumulative
        grounds:
          - calculations.freeze_protocol_compliance
          - entities.ReceiptLot.fields.freeze_compliant
        distinguishing_aspect: |
          Mode (a) combinatorial: >= 3 inputs (protocol branch, per-interval
          core_temp_c, interval bounds) with conditional phase branches — COMBO
          requires >= 240 min at <= -35.0C AND >= 1440 min at <= -20.0C counting
          only intervals starting after the first blast interval ends; an
          intervening -18.0C interval PAUSES accumulation without resetting it.
        test_recipe:
          setup:
            - "Approved supplier; RELEASED entry; one SALMON lot (freeze_protocol COMBO) in UNDER_INSPECTION"
          setup_api_calls:
            - { call: "POST /seafood/suppliers", payload: { legal_name: "Nordic Fish Co", country_code: "NO", facility_registration_number: "FRN-3001" }, as: ComplianceManager, captures: { sup_id: "$.data.id", sup_v: "$.data.version" } }
            - { call: "POST /seafood/supplier-evaluations", payload: { supplier_id: "${sup_id}", expected_supplier_version: "${sup_v}", period_start: "2024-01-01T00:00:00Z", period_end: "2024-12-31T00:00:00Z", hazard_analysis_score: 90, record_review_score: 90, performance_score: 90 }, as: ComplianceManager }
            - { call: "POST /seafood/import-entries", payload: { supplier_id: "${sup_id}", entry_number: "E-3001", species_declared: "SALMON", transport_mode: "AIR", scheduled_arrival: "2026-08-10T00:00:00Z", port_code: "USJFK", goods_value_cents: 800000, freight_cost_cents: 90000, duty_rate_pct: 0.0, total_weight_kg: 120 }, as: ImportCoordinator, captures: { ent_id: "$.data.id" } }
            - { call: "POST /seafood/import-entries/${ent_id}/file-prior-notice", payload: {}, as: ImportCoordinator }
            - { call: "POST /seafood/import-entries/${ent_id}/file-entry", payload: {}, as: ImportCoordinator }
            - { call: "POST /seafood/import-entries/${ent_id}/fda-disposition", payload: { outcome: "RELEASED" }, as: ImportCoordinator }
            - { call: "POST /seafood/receipt-lots", payload: { import_entry_id: "${ent_id}", vessel_name: "FV Nord", harvest_date: "2026-07-20T00:00:00Z", catch_area_code: "FAO27", harvest_country_code: "NO", production_method: "FARMED", species_declared: "SALMON", grade: "A", quantity_received_kg: 120, ice_deduction_pct: 0, receiving_temp_c: 0.0, freeze_protocol: "COMBO" }, as: ReceivingInspector, captures: { lot_id: "$.data.id" } }
          trigger:
            - { call: "POST /seafood/temperature-logs", payload: { receipt_lot_id: "${lot_id}", interval_start: "2026-07-25T08:00:00Z", interval_end: "2026-07-25T13:00:00Z", core_temp_c: -36.0, avg_temp_c: -33.0, source: "CONTINUOUS_MONITOR" }, as: QualityAssuranceTech }
            - { call: "GET /seafood/receipt-lots/${lot_id}", payload: {}, as: QualityAssuranceTech, captures: { fc1: "$.data.freeze_compliant" } }
            - { call: "POST /seafood/temperature-logs", payload: { receipt_lot_id: "${lot_id}", interval_start: "2026-07-25T13:00:00Z", interval_end: "2026-07-25T15:00:00Z", core_temp_c: -18.0, avg_temp_c: -16.0, source: "CONTINUOUS_MONITOR" }, as: QualityAssuranceTech }
            - { call: "GET /seafood/receipt-lots/${lot_id}", payload: {}, as: QualityAssuranceTech, captures: { fc2: "$.data.freeze_compliant" } }
            - { call: "POST /seafood/temperature-logs", payload: { receipt_lot_id: "${lot_id}", interval_start: "2026-07-25T15:00:00Z", interval_end: "2026-07-26T16:00:00Z", core_temp_c: -22.0, avg_temp_c: -21.0, source: "CONTINUOUS_MONITOR" }, as: QualityAssuranceTech }
            - { call: "GET /seafood/receipt-lots/${lot_id}", payload: {}, as: QualityAssuranceTech, captures: { fc3: "$.data.freeze_compliant" } }
          assert:
            - "after 300 min at -36.0C (blast phase met, hold not started): freeze_compliant == false"
            - "after the -18.0C interval (above -20.0C hold threshold, pause not reset): freeze_compliant == false"
            - "after 1500 min at -22.0C (hold >= 1440 min): freeze_compliant == true"

      - name: per_lot_round_then_sum_yield
        grounds:
          - calculations.provisional_yield_estimation
          - entities.BatchInputLot.fields.provisional_yield_kg
        distinguishing_aspect: |
          Mode (b) nested rounding: two 10.001 kg grade-A lots into a LOIN batch
          contribute round(10.001 * 0.55, 3) = 5.501 each; the pinned
          per-lot-round-then-sum order yields provisional_output_kg == 11.002,
          whereas sum-then-round would yield 11.001 — a 0.001 kg divergence
          decided purely by rounding order.
        test_recipe:
          setup:
            - "Approved supplier; RELEASED entry; two ACCEPTED TUNA lots of exactly 10.001 kg each, grade A"
            - "LOIN batch for TUNA with both lots fully consumed"
          setup_api_calls:
            - { call: "POST /seafood/suppliers", payload: { legal_name: "Island Catch SA", country_code: "PA", facility_registration_number: "FRN-3002" }, as: ComplianceManager, captures: { sup_id: "$.data.id", sup_v: "$.data.version" } }
            - { call: "POST /seafood/supplier-evaluations", payload: { supplier_id: "${sup_id}", expected_supplier_version: "${sup_v}", period_start: "2024-01-01T00:00:00Z", period_end: "2024-12-31T00:00:00Z", hazard_analysis_score: 90, record_review_score: 90, performance_score: 90 }, as: ComplianceManager }
            - { call: "POST /seafood/import-entries", payload: { supplier_id: "${sup_id}", entry_number: "E-3002", species_declared: "TUNA", transport_mode: "VESSEL", scheduled_arrival: "2026-08-10T00:00:00Z", port_code: "USLAX", goods_value_cents: 300000, freight_cost_cents: 10000, duty_rate_pct: 0.0, total_weight_kg: 25 }, as: ImportCoordinator, captures: { ent_id: "$.data.id" } }
            - { call: "POST /seafood/import-entries/${ent_id}/file-prior-notice", payload: {}, as: ImportCoordinator }
            - { call: "POST /seafood/import-entries/${ent_id}/file-entry", payload: {}, as: ImportCoordinator }
            - { call: "POST /seafood/import-entries/${ent_id}/fda-disposition", payload: { outcome: "RELEASED" }, as: ImportCoordinator }
            - { call: "POST /seafood/receipt-lots", payload: { import_entry_id: "${ent_id}", vessel_name: "FV Isla", harvest_date: "2026-07-20T00:00:00Z", catch_area_code: "FAO77", harvest_country_code: "PA", production_method: "WILD", species_declared: "TUNA", grade: "A", quantity_received_kg: 10.001, ice_deduction_pct: 0, receiving_temp_c: 2.0, freeze_protocol: "NONE" }, as: ReceivingInspector, captures: { lot_a: "$.data.id" } }
            - { call: "POST /seafood/haccp-monitoring-records", payload: { hazard_type: "HISTAMINE", receipt_lot_id: "${lot_a}", phase: "SCREENING", measured_value: 20.0, measured_at: "2026-07-25T10:00:00Z" }, as: QualityAssuranceTech }
            - { call: "POST /seafood/species-verifications", payload: { receipt_lot_id: "${lot_a}", test_method: "DNA_BARCODING", sample_size: 2, verified_species: "TUNA" }, as: ReceivingInspector }
            - { call: "POST /seafood/receipt-lots/${lot_a}/accept", payload: {}, as: ReceivingInspector }
            - { call: "POST /seafood/receipt-lots", payload: { import_entry_id: "${ent_id}", vessel_name: "FV Isla", harvest_date: "2026-07-20T00:00:00Z", catch_area_code: "FAO77", harvest_country_code: "PA", production_method: "WILD", species_declared: "TUNA", grade: "A", quantity_received_kg: 10.001, ice_deduction_pct: 0, receiving_temp_c: 2.0, freeze_protocol: "NONE" }, as: ReceivingInspector, captures: { lot_b: "$.data.id" } }
            - { call: "POST /seafood/haccp-monitoring-records", payload: { hazard_type: "HISTAMINE", receipt_lot_id: "${lot_b}", phase: "SCREENING", measured_value: 20.0, measured_at: "2026-07-25T10:05:00Z" }, as: QualityAssuranceTech }
            - { call: "POST /seafood/species-verifications", payload: { receipt_lot_id: "${lot_b}", test_method: "DNA_BARCODING", sample_size: 2, verified_species: "TUNA" }, as: ReceivingInspector }
            - { call: "POST /seafood/receipt-lots/${lot_b}/accept", payload: {}, as: ReceivingInspector }
            - { call: "POST /seafood/processing-batches", payload: { target_species: "TUNA", product_form: "LOIN" }, as: ProcessingSupervisor, captures: { bat_id: "$.data.id" } }
            - { call: "POST /seafood/processing-batches/${bat_id}/inputs", payload: { receipt_lot_id: "${lot_a}", quantity_kg: 10.001 }, as: ProcessingSupervisor, captures: { in_a_yield: "$.data.provisional_yield_kg" } }
            - { call: "POST /seafood/processing-batches/${bat_id}/inputs", payload: { receipt_lot_id: "${lot_b}", quantity_kg: 10.001 }, as: ProcessingSupervisor, captures: { in_b_yield: "$.data.provisional_yield_kg" } }
          trigger:
            - { call: "GET /seafood/processing-batches/${bat_id}", payload: {}, as: ProcessingSupervisor }
          assert:
            - "each BatchInputLot.provisional_yield_kg == 5.501 (round(10.001 * 0.55 * 1.00, 3) half-up)"
            - "ProcessingBatch.${bat_id}.provisional_output_kg == 11.002 (per-lot round then sum; sum-then-round would give 11.001)"
            - "ProcessingBatch.${bat_id}.input_total_kg == 20.002"
            - "ProcessingBatch.${bat_id}.yield_pct_provisional == 55.00"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: supplier_reevaluation_cycle
        grounds:
          - state_machines.ForeignSupplier.APPROVED_to_REEVALUATION_DUE
          - state_machines.ForeignSupplier.REEVALUATION_DUE_to_APPROVED
        distinguishing_aspect: |
          ForeignSupplier traverses the cycle APPROVED -> REEVALUATION_DUE ->
          APPROVED: the clock sweep past next_evaluation_due (2027-12-31, LOW
          tier 36 months) demotes the supplier, and a fresh passing evaluation
          re-approves it — a true cycle, not a pipeline.
        test_recipe:
          setup:
            - "Supplier approved by evaluation covering [2024-01-01, 2024-12-31] with overall 90.00 (risk 4.00, tier LOW, next_evaluation_due 2027-12-31T00:00:00Z)"
          setup_api_calls:
            - { call: "POST /seafood/suppliers", payload: { legal_name: "Andes Seafood", country_code: "CL", facility_registration_number: "FRN-4001" }, as: ComplianceManager, captures: { sup_id: "$.data.id", sup_v: "$.data.version" } }
            - { call: "POST /seafood/supplier-evaluations", payload: { supplier_id: "${sup_id}", expected_supplier_version: "${sup_v}", period_start: "2024-01-01T00:00:00Z", period_end: "2024-12-31T00:00:00Z", hazard_analysis_score: 90, record_review_score: 90, performance_score: 90 }, as: ComplianceManager }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2028-01-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "GET /seafood/suppliers/${sup_id}", payload: {}, as: ComplianceManager, captures: { st_mid: "$.data.fsvp_status", sup_v2: "$.data.version" } }
            - { call: "POST /seafood/supplier-evaluations", payload: { supplier_id: "${sup_id}", expected_supplier_version: "${sup_v2}", period_start: "2027-01-01T00:00:00Z", period_end: "2027-12-31T00:00:00Z", hazard_analysis_score: 80, record_review_score: 80, performance_score: 80 }, as: ComplianceManager }
            - { call: "GET /seafood/suppliers/${sup_id}", payload: {}, as: ComplianceManager, captures: { st_end: "$.data.fsvp_status" } }
          assert:
            - "after clock sweep to 2028-01-01: fsvp_status == REEVALUATION_DUE"
            - "after passing evaluation (overall 80.00): fsvp_status == APPROVED"
            - "risk_score == 8.00 and risk_tier == LOW after the second evaluation"
            - "next_evaluation_due == 2030-12-31T00:00:00Z (2027-12-31 + 36 months)"

      - name: lot_quarantine_accept_loop
        grounds:
          - state_machines.ReceiptLot.ACCEPTED_to_QUARANTINED
          - state_machines.ReceiptLot.QUARANTINED_to_ACCEPTED
        distinguishing_aspect: |
          ReceiptLot traverses the revert loop ACCEPTED -> QUARANTINED ->
          ACCEPTED twice (manual hold then compliance release, no open CAs) — a
          branching-with-revert shape on a different entity than the
          ForeignSupplier cycle.
        test_recipe:
          setup:
            - "Approved supplier; RELEASED entry; one COD lot ACCEPTED (freeze NONE, not histamine-susceptible)"
          setup_api_calls:
            - { call: "POST /seafood/suppliers", payload: { legal_name: "Atlantic Whitefish", country_code: "IS", facility_registration_number: "FRN-4002" }, as: ComplianceManager, captures: { sup_id: "$.data.id", sup_v: "$.data.version" } }
            - { call: "POST /seafood/supplier-evaluations", payload: { supplier_id: "${sup_id}", expected_supplier_version: "${sup_v}", period_start: "2024-01-01T00:00:00Z", period_end: "2024-12-31T00:00:00Z", hazard_analysis_score: 90, record_review_score: 90, performance_score: 90 }, as: ComplianceManager }
            - { call: "POST /seafood/import-entries", payload: { supplier_id: "${sup_id}", entry_number: "E-4002", species_declared: "COD", transport_mode: "VESSEL", scheduled_arrival: "2026-08-10T00:00:00Z", port_code: "USSEA", goods_value_cents: 400000, freight_cost_cents: 15000, duty_rate_pct: 0.0, total_weight_kg: 100 }, as: ImportCoordinator, captures: { ent_id: "$.data.id" } }
            - { call: "POST /seafood/import-entries/${ent_id}/file-prior-notice", payload: {}, as: ImportCoordinator }
            - { call: "POST /seafood/import-entries/${ent_id}/file-entry", payload: {}, as: ImportCoordinator }
            - { call: "POST /seafood/import-entries/${ent_id}/fda-disposition", payload: { outcome: "RELEASED" }, as: ImportCoordinator }
            - { call: "POST /seafood/receipt-lots", payload: { import_entry_id: "${ent_id}", vessel_name: "FV Ice", harvest_date: "2026-07-20T00:00:00Z", catch_area_code: "FAO27", harvest_country_code: "IS", production_method: "WILD", species_declared: "COD", grade: "A", quantity_received_kg: 100, ice_deduction_pct: 0, receiving_temp_c: 1.0, freeze_protocol: "NONE" }, as: ReceivingInspector, captures: { lot_id: "$.data.id" } }
            - { call: "POST /seafood/species-verifications", payload: { receipt_lot_id: "${lot_id}", test_method: "SENSORY", sample_size: 3, verified_species: "COD" }, as: ReceivingInspector }
            - { call: "POST /seafood/receipt-lots/${lot_id}/accept", payload: {}, as: ReceivingInspector }
          trigger:
            - { call: "POST /seafood/receipt-lots/${lot_id}/quarantine", payload: { reason: "late document audit" }, as: QualityAssuranceTech }
            - { call: "POST /seafood/receipt-lots/${lot_id}/quarantine-release", payload: {}, as: ComplianceManager }
            - { call: "POST /seafood/receipt-lots/${lot_id}/quarantine", payload: { reason: "second hold" }, as: QualityAssuranceTech }
            - { call: "POST /seafood/receipt-lots/${lot_id}/quarantine-release", payload: {}, as: ComplianceManager }
            - { call: "GET /seafood/receipt-lots/${lot_id}", payload: {}, as: ComplianceManager, captures: { st: "$.data.status", v: "$.data.version" } }
          assert:
            - "status == ACCEPTED after the second release (QUARANTINED -> ACCEPTED traversed twice)"
            - "version == 6 (create 1, accept 2, quarantine 3, release 4, quarantine 5, release 6)"
            - "manual quarantine created no CorrectiveAction (release precondition vacuously satisfied)"

  # ===========================================================================
  # Rule 4 — transitive_cascade (different triggers; depths 3 and 2)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: species_mismatch_cascade_depth3
        grounds:
          - state_machines.SpeciesVerification.creation_to_MISMATCH
          - entities.ForeignSupplier.fields.total_species_mismatches
          - calculations.supplier_risk_score
        distinguishing_aspect: |
          Depth-3 chain from the verification-create trigger: mismatch (A)
          quarantines the ReceiptLot (B); the lot's quarantine-entry auto-creates
          a CorrectiveAction (C); the CA creation increments supplier counters
          and recomputes risk (D) — each link caused by the previous link, not
          by the original request. Risk moves 4.00 -> 14.50.
        test_recipe:
          setup:
            - "Approved supplier (evaluation 90/90/90 -> risk_score 4.00, tier LOW); RELEASED entry; one TUNA lot in UNDER_INSPECTION"
          setup_api_calls:
            - { call: "POST /seafood/suppliers", payload: { legal_name: "Crimson Gulf Fisheries", country_code: "MX", facility_registration_number: "FRN-5001" }, as: ComplianceManager, captures: { sup_id: "$.data.id", sup_v: "$.data.version" } }
            - { call: "POST /seafood/supplier-evaluations", payload: { supplier_id: "${sup_id}", expected_supplier_version: "${sup_v}", period_start: "2024-01-01T00:00:00Z", period_end: "2024-12-31T00:00:00Z", hazard_analysis_score: 90, record_review_score: 90, performance_score: 90 }, as: ComplianceManager }
            - { call: "POST /seafood/import-entries", payload: { supplier_id: "${sup_id}", entry_number: "E-5001", species_declared: "TUNA", transport_mode: "VESSEL", scheduled_arrival: "2026-08-10T00:00:00Z", port_code: "USLAX", goods_value_cents: 600000, freight_cost_cents: 25000, duty_rate_pct: 0.03, total_weight_kg: 90 }, as: ImportCoordinator, captures: { ent_id: "$.data.id" } }
            - { call: "POST /seafood/import-entries/${ent_id}/file-prior-notice", payload: {}, as: ImportCoordinator }
            - { call: "POST /seafood/import-entries/${ent_id}/file-entry", payload: {}, as: ImportCoordinator }
            - { call: "POST /seafood/import-entries/${ent_id}/fda-disposition", payload: { outcome: "RELEASED" }, as: ImportCoordinator }
            - { call: "POST /seafood/receipt-lots", payload: { import_entry_id: "${ent_id}", vessel_name: "FV Golfo", harvest_date: "2026-07-20T00:00:00Z", catch_area_code: "FAO77", harvest_country_code: "MX", production_method: "WILD", species_declared: "TUNA", grade: "B", quantity_received_kg: 90, ice_deduction_pct: 0, receiving_temp_c: 2.0, freeze_protocol: "NONE" }, as: ReceivingInspector, captures: { lot_id: "$.data.id" } }
            - { call: "GET /seafood/suppliers/${sup_id}", payload: {}, as: ComplianceManager, captures: { risk_before: "$.data.risk_score" } }
          trigger:
            - { call: "POST /seafood/species-verifications", payload: { receipt_lot_id: "${lot_id}", test_method: "DNA_BARCODING", sample_size: 5, verified_species: "ESCOLAR" }, as: ReceivingInspector, as_user_id: "ri-01", captures: { ver_id: "$.data.id", ver_status: "$.data.status" } }
            - { call: "GET /seafood/receipt-lots/${lot_id}", payload: {}, as: QualityAssuranceTech, captures: { lot_status: "$.data.status" } }
            - { call: "GET /seafood/corrective-actions?receipt_lot_id=${lot_id}", payload: {}, as: ComplianceManager, captures: { ca_id: "$.data[0].id", ca_src: "$.data[0].source_type", ca_opened_by: "$.data[0].opened_by", ca_sup: "$.data[0].supplier_id" } }
            - { call: "GET /seafood/suppliers/${sup_id}", payload: {}, as: ComplianceManager, captures: { mismatches: "$.data.total_species_mismatches", open_ca: "$.data.open_corrective_action_count", risk_after: "$.data.risk_score", tier_after: "$.data.risk_tier" } }
          assert:
            - "SpeciesVerification.${ver_id}.status == MISMATCH (is_match false: ESCOLAR != TUNA)"
            - "link 1: ReceiptLot.${lot_id}.status == QUARANTINED"
            - "link 2: CorrectiveAction ${ca_id} exists with source_type == SPECIES_MISMATCH, status == OPEN, opened_by == ri-01, supplier_id == ${sup_id}"
            - "link 3: supplier.total_species_mismatches == 1 and open_corrective_action_count == 1"
            - "supplier.risk_score == 4.00 before, == 14.50 after (0.4*10 + 0.3*10 + 0.3*25)"
            - "supplier.risk_tier == LOW both before and after (14.50 < 30)"

      - name: escalate_recall_lot_cascade_depth2
        grounds:
          - state_machines.CorrectiveAction.OPEN_to_ESCALATED
          - state_machines.FinishedProductLot.RELEASED_to_RECALLED
        distinguishing_aspect: |
          Depth-2 chain from the escalate trigger (a different trigger than the
          species-verification cascade): escalate (A) creates the Recall (B);
          the Recall's creation transitions every in-scope RELEASED
          FinishedProductLot to RECALLED (C).
        test_recipe:
          setup:
            - "Full chain to a RELEASED finished lot: COD batch completed with |variance| 12.00 (YIELD_VARIANCE CA auto-created by ps-01, then resolved by cm-01), batch RECONCILED, finished lot labeled and RELEASED"
            - "A second COD lot on the same entry gets a species mismatch -> fresh OPEN SPECIES_MISMATCH CA (opened_by ri-01) used as the escalation origin"
          setup_api_calls:
            - { call: "POST /seafood/suppliers", payload: { legal_name: "Nordic Fish Co", country_code: "NO", facility_registration_number: "FRN-5002" }, as: ComplianceManager, captures: { sup_id: "$.data.id", sup_v: "$.data.version" } }
            - { call: "POST /seafood/supplier-evaluations", payload: { supplier_id: "${sup_id}", expected_supplier_version: "${sup_v}", period_start: "2024-01-01T00:00:00Z", period_end: "2024-12-31T00:00:00Z", hazard_analysis_score: 90, record_review_score: 90, performance_score: 90 }, as: ComplianceManager }
            - { call: "POST /seafood/import-entries", payload: { supplier_id: "${sup_id}", entry_number: "E-5002", species_declared: "COD", transport_mode: "VESSEL", scheduled_arrival: "2026-08-10T00:00:00Z", port_code: "USSEA", goods_value_cents: 700000, freight_cost_cents: 30000, duty_rate_pct: 0.0, total_weight_kg: 200 }, as: ImportCoordinator, captures: { ent_id: "$.data.id" } }
            - { call: "POST /seafood/import-entries/${ent_id}/file-prior-notice", payload: {}, as: ImportCoordinator }
            - { call: "POST /seafood/import-entries/${ent_id}/file-entry", payload: {}, as: ImportCoordinator }
            - { call: "POST /seafood/import-entries/${ent_id}/fda-disposition", payload: { outcome: "RELEASED" }, as: ImportCoordinator }
            - { call: "POST /seafood/receipt-lots", payload: { import_entry_id: "${ent_id}", vessel_name: "FV Nord", harvest_date: "2026-07-20T00:00:00Z", catch_area_code: "FAO27", harvest_country_code: "NO", production_method: "WILD", species_declared: "COD", grade: "A", quantity_received_kg: 100, ice_deduction_pct: 0, receiving_temp_c: 1.0, freeze_protocol: "NONE" }, as: ReceivingInspector, captures: { lot_id: "$.data.id" } }
            - { call: "POST /seafood/species-verifications", payload: { receipt_lot_id: "${lot_id}", test_method: "SENSORY", sample_size: 3, verified_species: "COD" }, as: ReceivingInspector }
            - { call: "POST /seafood/receipt-lots/${lot_id}/accept", payload: {}, as: ReceivingInspector }
            - { call: "POST /seafood/processing-batches", payload: { target_species: "COD", product_form: "FILLET" }, as: ProcessingSupervisor, captures: { bat_id: "$.data.id" } }
            - { call: "POST /seafood/processing-batches/${bat_id}/inputs", payload: { receipt_lot_id: "${lot_id}", quantity_kg: 100 }, as: ProcessingSupervisor }
            - { call: "GET /seafood/processing-batches/${bat_id}", payload: {}, as: ProcessingSupervisor, captures: { bat_v: "$.data.version" } }
            - { call: "POST /seafood/processing-batches/${bat_id}/complete", payload: { expected_batch_version: "${bat_v}", actual_output_kg: 30.0, trim_waste_kg: 55.0, other_waste_kg: 15.0 }, as: ProcessingSupervisor, as_user_id: "ps-01" }
            - { call: "GET /seafood/corrective-actions?processing_batch_id=${bat_id}", payload: {}, as: ComplianceManager, captures: { yield_ca: "$.data[0].id" } }
            - { call: "POST /seafood/corrective-actions/${yield_ca}/investigate", payload: {}, as: ComplianceManager, as_user_id: "cm-01" }
            - { call: "POST /seafood/corrective-actions/${yield_ca}/resolve", payload: { resolution_note: "reworked trim loss" }, as: ComplianceManager, as_user_id: "cm-01" }
            - { call: "POST /seafood/processing-batches/${bat_id}/reconcile", payload: {}, as: ProcessingSupervisor }
            - { call: "POST /seafood/finished-product-lots", payload: { processing_batch_id: "${bat_id}", net_weight_kg: 30.0 }, as: ProcessingSupervisor, captures: { fin_id: "$.data.id" } }
            - { call: "POST /seafood/product-labels", payload: { market_name: "Pacific Cod", scientific_name: "Gadus macrocephalus", species: "COD", production_method: "WILD", country_of_origin: "NO", keep_frozen_statement: true }, as: ComplianceManager, captures: { lbl_id: "$.data.id" } }
            - { call: "POST /seafood/product-labels/${lbl_id}/approve", payload: {}, as: ComplianceManager }
            - { call: "POST /seafood/finished-product-lots/${fin_id}/apply-label", payload: { product_label_id: "${lbl_id}" }, as: ProcessingSupervisor }
            - { call: "POST /seafood/finished-product-lots/${fin_id}/release", payload: {}, as: ComplianceManager }
            - { call: "POST /seafood/receipt-lots", payload: { import_entry_id: "${ent_id}", vessel_name: "FV Nord", harvest_date: "2026-07-21T00:00:00Z", catch_area_code: "FAO27", harvest_country_code: "NO", production_method: "WILD", species_declared: "COD", grade: "B", quantity_received_kg: 50, ice_deduction_pct: 0, receiving_temp_c: 1.0, freeze_protocol: "NONE" }, as: ReceivingInspector, captures: { lot2_id: "$.data.id" } }
            - { call: "POST /seafood/species-verifications", payload: { receipt_lot_id: "${lot2_id}", test_method: "DNA_BARCODING", sample_size: 4, verified_species: "POLLOCK" }, as: ReceivingInspector, as_user_id: "ri-01" }
            - { call: "GET /seafood/corrective-actions?receipt_lot_id=${lot2_id}", payload: {}, as: ComplianceManager, captures: { ca_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /seafood/corrective-actions/${ca_id}/escalate", payload: { reason: "mislabeled species entered commerce", scope_lot_ids: ["${fin_id}"] }, as: ComplianceManager, as_user_id: "cm-01", captures: { ca_status: "$.data.status", recall_id: "$.data.recall_id" } }
            - { call: "GET /seafood/recalls/${recall_id}", payload: {}, as: ComplianceManager, captures: { recall_status: "$.data.status" } }
            - { call: "GET /seafood/finished-product-lots/${fin_id}", payload: {}, as: ComplianceManager, captures: { fin_status: "$.data.status" } }
            - { call: "GET /seafood/suppliers/${sup_id}", payload: {}, as: ComplianceManager, captures: { open_ca: "$.data.open_corrective_action_count", risk_after: "$.data.risk_score" } }
          assert:
            - "CorrectiveAction.${ca_id}.status == ESCALATED and recall_id is set"
            - "link 1: Recall.${recall_id}.status == INITIATED with corrective_action_id == ${ca_id}"
            - "link 2: FinishedProductLot.${fin_id}.status == RECALLED (was RELEASED)"
            - "supplier.open_corrective_action_count == 0 after escalate (ESCALATED is no longer open)"
            - "supplier.risk_score == 11.50 (0.4*10 + 0.3*0 + 0.3*25: one lifetime mismatch, zero open CAs)"

  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_safety_on_accept
        grounds:
          - validations[priority=6]
          - validations[priority=9]
        distinguishing_aspect: |
          Pair {state, business_safety}: accepting a QUARANTINED TUNA lot that
          also lacks any PASS histamine record violates both rule 6 (wrong
          from-state) and rule 9 (missing safety pass); the state error
          ERR_INVALID_STATE (409) MUST win over ERR_HISTAMINE_CRITICAL_LIMIT.
        test_recipe:
          setup:
            - "Approved supplier; RELEASED entry; TUNA lot in UNDER_INSPECTION with NO histamine record; lot then manually quarantined"
          setup_api_calls:
            - { call: "POST /seafood/suppliers", payload: { legal_name: "Delta Seafood", country_code: "VN", facility_registration_number: "FRN-6001" }, as: ComplianceManager, captures: { sup_id: "$.data.id", sup_v: "$.data.version" } }
            - { call: "POST /seafood/supplier-evaluations", payload: { supplier_id: "${sup_id}", expected_supplier_version: "${sup_v}", period_start: "2024-01-01T00:00:00Z", period_end: "2024-12-31T00:00:00Z", hazard_analysis_score: 90, record_review_score: 90, performance_score: 90 }, as: ComplianceManager }
            - { call: "POST /seafood/import-entries", payload: { supplier_id: "${sup_id}", entry_number: "E-6001", species_declared: "TUNA", transport_mode: "VESSEL", scheduled_arrival: "2026-08-10T00:00:00Z", port_code: "USLAX", goods_value_cents: 200000, freight_cost_cents: 8000, duty_rate_pct: 0.03, total_weight_kg: 40 }, as: ImportCoordinator, captures: { ent_id: "$.data.id" } }
            - { call: "POST /seafood/import-entries/${ent_id}/file-prior-notice", payload: {}, as: ImportCoordinator }
            - { call: "POST /seafood/import-entries/${ent_id}/file-entry", payload: {}, as: ImportCoordinator }
            - { call: "POST /seafood/import-entries/${ent_id}/fda-disposition", payload: { outcome: "RELEASED" }, as: ImportCoordinator }
            - { call: "POST /seafood/receipt-lots", payload: { import_entry_id: "${ent_id}", vessel_name: "FV Delta", harvest_date: "2026-07-20T00:00:00Z", catch_area_code: "FAO71", harvest_country_code: "VN", production_method: "FARMED", species_declared: "TUNA", grade: "B", quantity_received_kg: 40, ice_deduction_pct: 0, receiving_temp_c: 2.0, freeze_protocol: "NONE" }, as: ReceivingInspector, captures: { lot_id: "$.data.id" } }
            - { call: "POST /seafood/receipt-lots/${lot_id}/quarantine", payload: { reason: "document hold" }, as: QualityAssuranceTech }
          trigger:
            - { call: "POST /seafood/receipt-lots/${lot_id}/accept", payload: {}, as: ReceivingInspector, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_INVALID_STATE with http 409 (QUARANTINED is not a from-state of accept)"
            - "error_id != ERR_HISTAMINE_CRITICAL_LIMIT even though the histamine safety gate also fails"
            - "ReceiptLot.${lot_id}.status remains QUARANTINED"

      - name: safety_beats_constraint_on_input
        grounds:
          - validations[priority=12]
          - validations[priority=20]
        distinguishing_aspect: |
          Pair {business_safety, business_constraint}: a batch input whose lot
          species (TUNA) differs from batch.target_species (SALMON) AND whose
          quantity (999 kg) exceeds remaining (50.000 kg) violates both rule 12
          and rule 20; the safety error ERR_SPECIES_MISMATCH (422) MUST win
          over ERR_INSUFFICIENT_LOT_REMAINING. Different category pair than
          {state, business_safety}.
        test_recipe:
          setup:
            - "Approved supplier; RELEASED entry; one ACCEPTED TUNA lot of 50.000 kg; one IN_PROCESS batch with target_species SALMON"
          setup_api_calls:
            - { call: "POST /seafood/suppliers", payload: { legal_name: "Delta Seafood", country_code: "VN", facility_registration_number: "FRN-6002" }, as: ComplianceManager, captures: { sup_id: "$.data.id", sup_v: "$.data.version" } }
            - { call: "POST /seafood/supplier-evaluations", payload: { supplier_id: "${sup_id}", expected_supplier_version: "${sup_v}", period_start: "2024-01-01T00:00:00Z", period_end: "2024-12-31T00:00:00Z", hazard_analysis_score: 90, record_review_score: 90, performance_score: 90 }, as: ComplianceManager }
            - { call: "POST /seafood/import-entries", payload: { supplier_id: "${sup_id}", entry_number: "E-6002", species_declared: "TUNA", transport_mode: "VESSEL", scheduled_arrival: "2026-08-10T00:00:00Z", port_code: "USLAX", goods_value_cents: 200000, freight_cost_cents: 8000, duty_rate_pct: 0.0, total_weight_kg: 50 }, as: ImportCoordinator, captures: { ent_id: "$.data.id" } }
            - { call: "POST /seafood/import-entries/${ent_id}/file-prior-notice", payload: {}, as: ImportCoordinator }
            - { call: "POST /seafood/import-entries/${ent_id}/file-entry", payload: {}, as: ImportCoordinator }
            - { call: "POST /seafood/import-entries/${ent_id}/fda-disposition", payload: { outcome: "RELEASED" }, as: ImportCoordinator }
            - { call: "POST /seafood/receipt-lots", payload: { import_entry_id: "${ent_id}", vessel_name: "FV Delta", harvest_date: "2026-07-20T00:00:00Z", catch_area_code: "FAO71", harvest_country_code: "VN", production_method: "WILD", species_declared: "TUNA", grade: "A", quantity_received_kg: 50, ice_deduction_pct: 0, receiving_temp_c: 2.0, freeze_protocol: "NONE" }, as: ReceivingInspector, captures: { lot_id: "$.data.id" } }
            - { call: "POST /seafood/haccp-monitoring-records", payload: { hazard_type: "HISTAMINE", receipt_lot_id: "${lot_id}", phase: "SCREENING", measured_value: 22.0, measured_at: "2026-07-25T10:00:00Z" }, as: QualityAssuranceTech }
            - { call: "POST /seafood/species-verifications", payload: { receipt_lot_id: "${lot_id}", test_method: "DNA_BARCODING", sample_size: 3, verified_species: "TUNA" }, as: ReceivingInspector }
            - { call: "POST /seafood/receipt-lots/${lot_id}/accept", payload: {}, as: ReceivingInspector }
            - { call: "POST /seafood/processing-batches", payload: { target_species: "SALMON", product_form: "FILLET" }, as: ProcessingSupervisor, captures: { bat_id: "$.data.id" } }
          trigger:
            - { call: "POST /seafood/processing-batches/${bat_id}/inputs", payload: { receipt_lot_id: "${lot_id}", quantity_kg: 999 }, as: ProcessingSupervisor, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_SPECIES_MISMATCH with http 422"
            - "error_id != ERR_INSUFFICIENT_LOT_REMAINING even though 999 > 50.000 remaining"
            - "ReceiptLot.${lot_id}.consumed_kg == 0 and remaining_kg == 50.000 (no partial consumption)"

  # ===========================================================================
  # Rule 6 — boundary_precision_check (different metrics, different endpoints)
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: histamine_exact_50ppm_deviation
        grounds:
          - calculations.histamine_verdict
        distinguishing_aspect: |
          ppm metric boundary on POST /seafood/haccp-monitoring-records: the
          critical limit is >= 50.0, so 49.9 ppm is PASS while exactly 50.0 ppm
          is DEVIATION (with quarantine + CA side effects).
        test_recipe:
          setup:
            - "Approved supplier; RELEASED entry; two TUNA lots in UNDER_INSPECTION"
          setup_api_calls:
            - { call: "POST /seafood/suppliers", payload: { legal_name: "Meridian Marine", country_code: "EC", facility_registration_number: "FRN-7001" }, as: ComplianceManager, captures: { sup_id: "$.data.id", sup_v: "$.data.version" } }
            - { call: "POST /seafood/supplier-evaluations", payload: { supplier_id: "${sup_id}", expected_supplier_version: "${sup_v}", period_start: "2024-01-01T00:00:00Z", period_end: "2024-12-31T00:00:00Z", hazard_analysis_score: 90, record_review_score: 90, performance_score: 90 }, as: ComplianceManager }
            - { call: "POST /seafood/import-entries", payload: { supplier_id: "${sup_id}", entry_number: "E-7001", species_declared: "TUNA", transport_mode: "VESSEL", scheduled_arrival: "2026-08-10T00:00:00Z", port_code: "USLAX", goods_value_cents: 500000, freight_cost_cents: 20000, duty_rate_pct: 0.0, total_weight_kg: 160 }, as: ImportCoordinator, captures: { ent_id: "$.data.id" } }
            - { call: "POST /seafood/import-entries/${ent_id}/file-prior-notice", payload: {}, as: ImportCoordinator }
            - { call: "POST /seafood/import-entries/${ent_id}/file-entry", payload: {}, as: ImportCoordinator }
            - { call: "POST /seafood/import-entries/${ent_id}/fda-disposition", payload: { outcome: "RELEASED" }, as: ImportCoordinator }
            - { call: "POST /seafood/receipt-lots", payload: { import_entry_id: "${ent_id}", vessel_name: "FV Meridiano", harvest_date: "2026-07-20T00:00:00Z", catch_area_code: "FAO87", harvest_country_code: "EC", production_method: "WILD", species_declared: "TUNA", grade: "A", quantity_received_kg: 80, ice_deduction_pct: 0, receiving_temp_c: 2.0, freeze_protocol: "NONE" }, as: ReceivingInspector, captures: { lot1: "$.data.id" } }
            - { call: "POST /seafood/receipt-lots", payload: { import_entry_id: "${ent_id}", vessel_name: "FV Meridiano", harvest_date: "2026-07-20T00:00:00Z", catch_area_code: "FAO87", harvest_country_code: "EC", production_method: "WILD", species_declared: "TUNA", grade: "A", quantity_received_kg: 80, ice_deduction_pct: 0, receiving_temp_c: 2.0, freeze_protocol: "NONE" }, as: ReceivingInspector, captures: { lot2: "$.data.id" } }
          trigger:
            - { call: "POST /seafood/haccp-monitoring-records", payload: { hazard_type: "HISTAMINE", receipt_lot_id: "${lot1}", phase: "SCREENING", measured_value: 49.9, measured_at: "2026-07-25T10:00:00Z" }, as: QualityAssuranceTech, captures: { v1: "$.data.verdict" } }
            - { call: "POST /seafood/haccp-monitoring-records", payload: { hazard_type: "HISTAMINE", receipt_lot_id: "${lot2}", phase: "SCREENING", measured_value: 50.0, measured_at: "2026-07-25T10:01:00Z" }, as: QualityAssuranceTech, as_user_id: "qa-07", captures: { v2: "$.data.verdict" } }
            - { call: "GET /seafood/receipt-lots/${lot2}", payload: {}, as: QualityAssuranceTech, captures: { lot2_status: "$.data.status" } }
          assert:
            - "lot1 record verdict == PASS at 49.9 ppm"
            - "lot2 record verdict == DEVIATION at exactly 50.0 ppm (>= boundary)"
            - "ReceiptLot.${lot2}.status == QUARANTINED; ReceiptLot.${lot1}.status == UNDER_INSPECTION"

      - name: last_kg_consumption_auto_consumed
        grounds:
          - state_machines.ReceiptLot.ACCEPTED_to_CONSUMED
          - entities.ReceiptLot.fields.remaining_kg
        distinguishing_aspect: |
          Zero-quantity boundary on POST /seafood/processing-batches/{id}/inputs:
          consuming exactly the remaining 10.000 kg drives remaining_kg to
          exactly 0 and auto-transitions the lot ACCEPTED -> CONSUMED; a further
          0.001 kg input is then rejected ERR_LOT_NOT_ACCEPTED. Different metric
          (kg-remaining zero vs ppm threshold) and different endpoint than the
          histamine boundary.
        test_recipe:
          setup:
            - "Approved supplier; RELEASED entry; one ACCEPTED COD lot of 10.000 kg; IN_PROCESS COD PORTION batch"
          setup_api_calls:
            - { call: "POST /seafood/suppliers", payload: { legal_name: "Harbor Fresh", country_code: "US", facility_registration_number: "FRN-7002" }, as: ComplianceManager, captures: { sup_id: "$.data.id", sup_v: "$.data.version" } }
            - { call: "POST /seafood/supplier-evaluations", payload: { supplier_id: "${sup_id}", expected_supplier_version: "${sup_v}", period_start: "2024-01-01T00:00:00Z", period_end: "2024-12-31T00:00:00Z", hazard_analysis_score: 90, record_review_score: 90, performance_score: 90 }, as: ComplianceManager }
            - { call: "POST /seafood/import-entries", payload: { supplier_id: "${sup_id}", entry_number: "E-7002", species_declared: "COD", transport_mode: "ROAD", scheduled_arrival: "2026-08-10T00:00:00Z", port_code: "USBLA", goods_value_cents: 50000, freight_cost_cents: 2000, duty_rate_pct: 0.0, total_weight_kg: 10 }, as: ImportCoordinator, captures: { ent_id: "$.data.id" } }
            - { call: "POST /seafood/import-entries/${ent_id}/file-prior-notice", payload: {}, as: ImportCoordinator }
            - { call: "POST /seafood/import-entries/${ent_id}/file-entry", payload: {}, as: ImportCoordinator }
            - { call: "POST /seafood/import-entries/${ent_id}/fda-disposition", payload: { outcome: "RELEASED" }, as: ImportCoordinator }
            - { call: "POST /seafood/receipt-lots", payload: { import_entry_id: "${ent_id}", vessel_name: "FV Harbor", harvest_date: "2026-07-20T00:00:00Z", catch_area_code: "FAO67", harvest_country_code: "US", production_method: "WILD", species_declared: "COD", grade: "A", quantity_received_kg: 10, ice_deduction_pct: 0, receiving_temp_c: 1.0, freeze_protocol: "NONE" }, as: ReceivingInspector, captures: { lot_id: "$.data.id" } }
            - { call: "POST /seafood/species-verifications", payload: { receipt_lot_id: "${lot_id}", test_method: "SENSORY", sample_size: 2, verified_species: "COD" }, as: ReceivingInspector }
            - { call: "POST /seafood/receipt-lots/${lot_id}/accept", payload: {}, as: ReceivingInspector }
            - { call: "POST /seafood/processing-batches", payload: { target_species: "COD", product_form: "PORTION" }, as: ProcessingSupervisor, captures: { bat_id: "$.data.id" } }
          trigger:
            - { call: "POST /seafood/processing-batches/${bat_id}/inputs", payload: { receipt_lot_id: "${lot_id}", quantity_kg: 10.000 }, as: ProcessingSupervisor }
            - { call: "GET /seafood/receipt-lots/${lot_id}", payload: {}, as: ProcessingSupervisor, captures: { st: "$.data.status", rem: "$.data.remaining_kg" } }
            - { call: "POST /seafood/processing-batches/${bat_id}/inputs", payload: { receipt_lot_id: "${lot_id}", quantity_kg: 0.001 }, as: ProcessingSupervisor, captures: { err: "$.data.error_id" } }
          assert:
            - "after consuming exactly 10.000 kg: remaining_kg == 0 and status == CONSUMED (auto-transition at the zero boundary)"
            - "second input of 0.001 kg rejected: error_id == ERR_LOT_NOT_ACCEPTED with http 409"

  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: entry_filing_requires_supplier_approved
        grounds:
          - validations[priority=13]
          - state_machines.ImportEntry.DRAFT_to_PRIOR_NOTICE_FILED
        distinguishing_aspect: |
          Pair (ImportEntry -> ForeignSupplier): file-prior-notice is gated on
          the supplier's fsvp_status; suspending the supplier after entry
          creation makes the filing fail with ERR_SUPPLIER_NOT_APPROVED while
          the entry stays DRAFT.
        test_recipe:
          setup:
            - "Supplier APPROVED via evaluation; ImportEntry created in DRAFT; supplier then SUSPENDED"
          setup_api_calls:
            - { call: "POST /seafood/suppliers", payload: { legal_name: "Southern Seas", country_code: "AR", facility_registration_number: "FRN-8001" }, as: ComplianceManager, captures: { sup_id: "$.data.id", sup_v: "$.data.version" } }
            - { call: "POST /seafood/supplier-evaluations", payload: { supplier_id: "${sup_id}", expected_supplier_version: "${sup_v}", period_start: "2024-01-01T00:00:00Z", period_end: "2024-12-31T00:00:00Z", hazard_analysis_score: 90, record_review_score: 90, performance_score: 90 }, as: ComplianceManager }
            - { call: "POST /seafood/import-entries", payload: { supplier_id: "${sup_id}", entry_number: "E-8001", species_declared: "SHRIMP", transport_mode: "VESSEL", scheduled_arrival: "2026-08-10T00:00:00Z", port_code: "USMIA", goods_value_cents: 300000, freight_cost_cents: 12000, duty_rate_pct: 0.0, total_weight_kg: 60 }, as: ImportCoordinator, captures: { ent_id: "$.data.id" } }
            - { call: "POST /seafood/suppliers/${sup_id}/suspend", payload: {}, as: ComplianceManager }
          trigger:
            - { call: "POST /seafood/import-entries/${ent_id}/file-prior-notice", payload: {}, as: ImportCoordinator, captures: { err: "$.data.error_id" } }
            - { call: "GET /seafood/import-entries/${ent_id}", payload: {}, as: ImportCoordinator, captures: { ent_status: "$.data.status" } }
          assert:
            - "error_id == ERR_SUPPLIER_NOT_APPROVED with http 422"
            - "ImportEntry.${ent_id}.status remains DRAFT"

      - name: finished_release_requires_batch_reconciled
        grounds:
          - state_machines.FinishedProductLot.LABELED_to_RELEASED
        distinguishing_aspect: |
          Pair (FinishedProductLot -> ProcessingBatch): release is gated on the
          parent batch being RECONCILED; with the batch merely COMPLETED the
          release fails ERR_INVALID_STATE and the lot stays LABELED — a
          different entity pair than (ImportEntry -> ForeignSupplier).
        test_recipe:
          setup:
            - "COD batch COMPLETED with zero yield variance (no CA), finished lot LABELED with an APPROVED label; batch NOT reconciled"
          setup_api_calls:
            - { call: "POST /seafood/suppliers", payload: { legal_name: "Harbor Fresh", country_code: "US", facility_registration_number: "FRN-8002" }, as: ComplianceManager, captures: { sup_id: "$.data.id", sup_v: "$.data.version" } }
            - { call: "POST /seafood/supplier-evaluations", payload: { supplier_id: "${sup_id}", expected_supplier_version: "${sup_v}", period_start: "2024-01-01T00:00:00Z", period_end: "2024-12-31T00:00:00Z", hazard_analysis_score: 90, record_review_score: 90, performance_score: 90 }, as: ComplianceManager }
            - { call: "POST /seafood/import-entries", payload: { supplier_id: "${sup_id}", entry_number: "E-8002", species_declared: "COD", transport_mode: "ROAD", scheduled_arrival: "2026-08-10T00:00:00Z", port_code: "USBLA", goods_value_cents: 100000, freight_cost_cents: 5000, duty_rate_pct: 0.0, total_weight_kg: 100 }, as: ImportCoordinator, captures: { ent_id: "$.data.id" } }
            - { call: "POST /seafood/import-entries/${ent_id}/file-prior-notice", payload: {}, as: ImportCoordinator }
            - { call: "POST /seafood/import-entries/${ent_id}/file-entry", payload: {}, as: ImportCoordinator }
            - { call: "POST /seafood/import-entries/${ent_id}/fda-disposition", payload: { outcome: "RELEASED" }, as: ImportCoordinator }
            - { call: "POST /seafood/receipt-lots", payload: { import_entry_id: "${ent_id}", vessel_name: "FV Harbor", harvest_date: "2026-07-20T00:00:00Z", catch_area_code: "FAO67", harvest_country_code: "US", production_method: "WILD", species_declared: "COD", grade: "A", quantity_received_kg: 100, ice_deduction_pct: 0, receiving_temp_c: 1.0, freeze_protocol: "NONE" }, as: ReceivingInspector, captures: { lot_id: "$.data.id" } }
            - { call: "POST /seafood/species-verifications", payload: { receipt_lot_id: "${lot_id}", test_method: "SENSORY", sample_size: 2, verified_species: "COD" }, as: ReceivingInspector }
            - { call: "POST /seafood/receipt-lots/${lot_id}/accept", payload: {}, as: ReceivingInspector }
            - { call: "POST /seafood/processing-batches", payload: { target_species: "COD", product_form: "FILLET" }, as: ProcessingSupervisor, captures: { bat_id: "$.data.id" } }
            - { call: "POST /seafood/processing-batches/${bat_id}/inputs", payload: { receipt_lot_id: "${lot_id}", quantity_kg: 100 }, as: ProcessingSupervisor }
            - { call: "GET /seafood/processing-batches/${bat_id}", payload: {}, as: ProcessingSupervisor, captures: { bat_v: "$.data.version" } }
            - { call: "POST /seafood/processing-batches/${bat_id}/complete", payload: { expected_batch_version: "${bat_v}", actual_output_kg: 42.0, trim_waste_kg: 50.0, other_waste_kg: 8.0 }, as: ProcessingSupervisor }
            - { call: "POST /seafood/finished-product-lots", payload: { processing_batch_id: "${bat_id}", net_weight_kg: 42.0 }, as: ProcessingSupervisor, captures: { fin_id: "$.data.id" } }
            - { call: "POST /seafood/product-labels", payload: { market_name: "Pacific Cod", scientific_name: "Gadus macrocephalus", species: "COD", production_method: "WILD", country_of_origin: "US", keep_frozen_statement: true }, as: ComplianceManager, captures: { lbl_id: "$.data.id" } }
            - { call: "POST /seafood/product-labels/${lbl_id}/approve", payload: {}, as: ComplianceManager }
            - { call: "POST /seafood/finished-product-lots/${fin_id}/apply-label", payload: { product_label_id: "${lbl_id}" }, as: ProcessingSupervisor }
          trigger:
            - { call: "POST /seafood/finished-product-lots/${fin_id}/release", payload: {}, as: ComplianceManager, captures: { err: "$.data.error_id" } }
            - { call: "GET /seafood/finished-product-lots/${fin_id}", payload: {}, as: ComplianceManager, captures: { fin_status: "$.data.status" } }
          assert:
            - "error_id == ERR_INVALID_STATE with http 409 (batch COMPLETED, not RECONCILED)"
            - "FinishedProductLot.${fin_id}.status remains LABELED"

  # ===========================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: temperature_log_adjacent_half_open_allowed
        grounds:
          - validations[priority=19]
          - entities.TemperatureLog.fields.interval_start
        distinguishing_aspect: |
          Half-open semantics on the ReceiptLot temperature timeline: a new
          interval starting exactly at an existing interval's end (11:00 ==
          11:00) is adjacency and MUST be accepted, while a true overlap
          (10:30-11:30) is rejected ERR_TEMPERATURE_INTERVAL_OVERLAP.
        test_recipe:
          setup:
            - "Approved supplier; RELEASED entry; one COD lot in UNDER_INSPECTION"
          setup_api_calls:
            - { call: "POST /seafood/suppliers", payload: { legal_name: "Harbor Fresh", country_code: "US", facility_registration_number: "FRN-9001" }, as: ComplianceManager, captures: { sup_id: "$.data.id", sup_v: "$.data.version" } }
            - { call: "POST /seafood/supplier-evaluations", payload: { supplier_id: "${sup_id}", expected_supplier_version: "${sup_v}", period_start: "2024-01-01T00:00:00Z", period_end: "2024-12-31T00:00:00Z", hazard_analysis_score: 90, record_review_score: 90, performance_score: 90 }, as: ComplianceManager }
            - { call: "POST /seafood/import-entries", payload: { supplier_id: "${sup_id}", entry_number: "E-9001", species_declared: "COD", transport_mode: "ROAD", scheduled_arrival: "2026-08-10T00:00:00Z", port_code: "USBLA", goods_value_cents: 100000, freight_cost_cents: 5000, duty_rate_pct: 0.0, total_weight_kg: 100 }, as: ImportCoordinator, captures: { ent_id: "$.data.id" } }
            - { call: "POST /seafood/import-entries/${ent_id}/file-prior-notice", payload: {}, as: ImportCoordinator }
            - { call: "POST /seafood/import-entries/${ent_id}/file-entry", payload: {}, as: ImportCoordinator }
            - { call: "POST /seafood/import-entries/${ent_id}/fda-disposition", payload: { outcome: "RELEASED" }, as: ImportCoordinator }
            - { call: "POST /seafood/receipt-lots", payload: { import_entry_id: "${ent_id}", vessel_name: "FV Harbor", harvest_date: "2026-07-20T00:00:00Z", catch_area_code: "FAO67", harvest_country_code: "US", production_method: "WILD", species_declared: "COD", grade: "A", quantity_received_kg: 100, ice_deduction_pct: 0, receiving_temp_c: 1.0, freeze_protocol: "NONE" }, as: ReceivingInspector, captures: { lot_id: "$.data.id" } }
          trigger:
            - { call: "POST /seafood/temperature-logs", payload: { receipt_lot_id: "${lot_id}", interval_start: "2026-07-25T10:00:00Z", interval_end: "2026-07-25T11:00:00Z", core_temp_c: -21.0, avg_temp_c: -20.0, source: "CONTINUOUS_MONITOR" }, as: QualityAssuranceTech }
            - { call: "POST /seafood/temperature-logs", payload: { receipt_lot_id: "${lot_id}", interval_start: "2026-07-25T11:00:00Z", interval_end: "2026-07-25T12:00:00Z", core_temp_c: -21.0, avg_temp_c: -20.0, source: "CONTINUOUS_MONITOR" }, as: QualityAssuranceTech }
            - { call: "POST /seafood/temperature-logs", payload: { receipt_lot_id: "${lot_id}", interval_start: "2026-07-25T10:30:00Z", interval_end: "2026-07-25T11:30:00Z", core_temp_c: -21.0, avg_temp_c: -20.0, source: "MANUAL_PROBE" }, as: QualityAssuranceTech, captures: { err: "$.data.error_id" } }
          assert:
            - "first two intervals (10:00-11:00, 11:00-12:00) both accepted: adjacency is not overlap under half-open semantics"
            - "third interval (10:30-11:30) rejected with error_id == ERR_TEMPERATURE_INTERVAL_OVERLAP, http 422"
            - "GET /seafood/temperature-logs?receipt_lot_id=${lot_id} returns exactly 2 rows"

      - name: evaluation_period_shared_day_overlap
        grounds:
          - validations[priority=18]
          - entities.SupplierEvaluation.fields.period_start
        distinguishing_aspect: |
          Closed-interval semantics on the ForeignSupplier evaluation coverage
          resource: a new period starting on the existing period's final day
          (2024-12-31 == 2024-12-31) IS an overlap (boundary day shared) and is
          rejected, while starting the next day (2025-01-01) is accepted —
          opposite adjacency treatment to the half-open temperature timeline,
          on a different resource entity.
        test_recipe:
          setup:
            - "Supplier APPROVED with an existing evaluation covering closed interval [2024-01-01, 2024-12-31]"
          setup_api_calls:
            - { call: "POST /seafood/suppliers", payload: { legal_name: "Andes Seafood", country_code: "CL", facility_registration_number: "FRN-9002" }, as: ComplianceManager, captures: { sup_id: "$.data.id", sup_v: "$.data.version" } }
            - { call: "POST /seafood/supplier-evaluations", payload: { supplier_id: "${sup_id}", expected_supplier_version: "${sup_v}", period_start: "2024-01-01T00:00:00Z", period_end: "2024-12-31T00:00:00Z", hazard_analysis_score: 90, record_review_score: 90, performance_score: 90 }, as: ComplianceManager }
            - { call: "GET /seafood/suppliers/${sup_id}", payload: {}, as: ComplianceManager, captures: { sup_v2: "$.data.version" } }
          trigger:
            - { call: "POST /seafood/supplier-evaluations", payload: { supplier_id: "${sup_id}", expected_supplier_version: "${sup_v2}", period_start: "2024-12-31T00:00:00Z", period_end: "2025-12-31T00:00:00Z", hazard_analysis_score: 80, record_review_score: 80, performance_score: 80 }, as: ComplianceManager, captures: { err: "$.data.error_id" } }
            - { call: "POST /seafood/supplier-evaluations", payload: { supplier_id: "${sup_id}", expected_supplier_version: "${sup_v2}", period_start: "2025-01-01T00:00:00Z", period_end: "2025-12-31T00:00:00Z", hazard_analysis_score: 80, record_review_score: 80, performance_score: 80 }, as: ComplianceManager, captures: { ev_outcome: "$.data.outcome", ev_overall: "$.data.overall_score" } }
            - { call: "GET /seafood/suppliers/${sup_id}", payload: {}, as: ComplianceManager, captures: { st: "$.data.fsvp_status", due: "$.data.next_evaluation_due" } }
          assert:
            - "period_start == 2024-12-31 (shared boundary day) rejected: error_id == ERR_EVALUATION_PERIOD_OVERLAP, http 422"
            - "period_start == 2025-01-01 accepted: outcome == APPROVED, overall_score == 80.00"
            - "supplier.fsvp_status == APPROVED (self-transition re-certification), next_evaluation_due == 2028-12-31T00:00:00Z"
            - "failed overlap attempt did not bump supplier.version (OCC value ${sup_v2} still valid for the retry)"

  # ===========================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: batch_input_add_remove_conserves_mass
        grounds:
          - entities.ReceiptLot.fields.consumed_kg
          - entities.ReceiptLot.fields.remaining_kg
        distinguishing_aspect: |
          Conserved quantity is MASS (kg): for any ReceiptLot,
          consumed_kg + remaining_kg == quantity_accepted_kg must hold after
          every step; the add(30.000) + delete compensating pair returns
          remaining_kg to exactly 80.000 with zero drift.
        test_recipe:
          setup:
            - "Approved supplier; RELEASED entry; one ACCEPTED COD lot of 80.000 kg; IN_PROCESS COD FILLET batch"
          setup_api_calls:
            - { call: "POST /seafood/suppliers", payload: { legal_name: "Harbor Fresh", country_code: "US", facility_registration_number: "FRN-1001B" }, as: ComplianceManager, captures: { sup_id: "$.data.id", sup_v: "$.data.version" } }
            - { call: "POST /seafood/supplier-evaluations", payload: { supplier_id: "${sup_id}", expected_supplier_version: "${sup_v}", period_start: "2024-01-01T00:00:00Z", period_end: "2024-12-31T00:00:00Z", hazard_analysis_score: 90, record_review_score: 90, performance_score: 90 }, as: ComplianceManager }
            - { call: "POST /seafood/import-entries", payload: { supplier_id: "${sup_id}", entry_number: "E-1001B", species_declared: "COD", transport_mode: "ROAD", scheduled_arrival: "2026-08-10T00:00:00Z", port_code: "USBLA", goods_value_cents: 100000, freight_cost_cents: 5000, duty_rate_pct: 0.0, total_weight_kg: 80 }, as: ImportCoordinator, captures: { ent_id: "$.data.id" } }
            - { call: "POST /seafood/import-entries/${ent_id}/file-prior-notice", payload: {}, as: ImportCoordinator }
            - { call: "POST /seafood/import-entries/${ent_id}/file-entry", payload: {}, as: ImportCoordinator }
            - { call: "POST /seafood/import-entries/${ent_id}/fda-disposition", payload: { outcome: "RELEASED" }, as: ImportCoordinator }
            - { call: "POST /seafood/receipt-lots", payload: { import_entry_id: "${ent_id}", vessel_name: "FV Harbor", harvest_date: "2026-07-20T00:00:00Z", catch_area_code: "FAO67", harvest_country_code: "US", production_method: "WILD", species_declared: "COD", grade: "A", quantity_received_kg: 80, ice_deduction_pct: 0, receiving_temp_c: 1.0, freeze_protocol: "NONE" }, as: ReceivingInspector, captures: { lot_id: "$.data.id" } }
            - { call: "POST /seafood/species-verifications", payload: { receipt_lot_id: "${lot_id}", test_method: "SENSORY", sample_size: 2, verified_species: "COD" }, as: ReceivingInspector }
            - { call: "POST /seafood/receipt-lots/${lot_id}/accept", payload: {}, as: ReceivingInspector }
            - { call: "POST /seafood/processing-batches", payload: { target_species: "COD", product_form: "FILLET" }, as: ProcessingSupervisor, captures: { bat_id: "$.data.id" } }
          trigger:
            - { call: "POST /seafood/processing-batches/${bat_id}/inputs", payload: { receipt_lot_id: "${lot_id}", quantity_kg: 30.000 }, as: ProcessingSupervisor, captures: { in_id: "$.data.id" } }
            - { call: "GET /seafood/receipt-lots/${lot_id}", payload: {}, as: ProcessingSupervisor, captures: { cons1: "$.data.consumed_kg", rem1: "$.data.remaining_kg" } }
            - { call: "DELETE /seafood/batch-input-lots/${in_id}", payload: {}, as: ProcessingSupervisor }
            - { call: "GET /seafood/receipt-lots/${lot_id}", payload: {}, as: ProcessingSupervisor, captures: { cons2: "$.data.consumed_kg", rem2: "$.data.remaining_kg" } }
          assert:
            - "after add: consumed_kg == 30.000 and remaining_kg == 50.000 (sum == 80.000 == quantity_accepted_kg)"
            - "after compensating delete: consumed_kg == 0 and remaining_kg == 80.000 exactly (no rounding drift)"
            - "invariant consumed_kg + remaining_kg == quantity_accepted_kg holds at every step"

      - name: quarantine_release_conserves_allocated_cost
        grounds:
          - calculations.entry_cost_allocation
          - entities.ReceiptLot.fields.allocated_cost_cents
        distinguishing_aspect: |
          Conserved quantity is MONEY (cents): sum of allocated_cost_cents over
          ACCEPTED lots == allocatable_total_cents (1080001) at every step;
          the quarantine(B) + quarantine-release(B) pair returns each lot to
          exactly its original allocation (A 540001 / B 540000, remainder cent
          to the earlier-created lot) with zero drift. Different conserved
          quantity than the mass invariant.
        test_recipe:
          setup:
            - "Entry with goods_value_cents 1000001, freight 50000, duty_rate 0.03 -> duty_cents 30000, allocatable_total_cents 1080001; two ACCEPTED COD lots A (50 kg, created first) and B (50 kg)"
            - "After both accepts: A.allocated_cost_cents == 540001 (floor 540000 + remainder cent, tie broken by created_at ASC), B == 540000"
          setup_api_calls:
            - { call: "POST /seafood/suppliers", payload: { legal_name: "Harbor Fresh", country_code: "US", facility_registration_number: "FRN-1002B" }, as: ComplianceManager, captures: { sup_id: "$.data.id", sup_v: "$.data.version" } }
            - { call: "POST /seafood/supplier-evaluations", payload: { supplier_id: "${sup_id}", expected_supplier_version: "${sup_v}", period_start: "2024-01-01T00:00:00Z", period_end: "2024-12-31T00:00:00Z", hazard_analysis_score: 90, record_review_score: 90, performance_score: 90 }, as: ComplianceManager }
            - { call: "POST /seafood/import-entries", payload: { supplier_id: "${sup_id}", entry_number: "E-1002B", species_declared: "COD", transport_mode: "ROAD", scheduled_arrival: "2026-08-10T00:00:00Z", port_code: "USBLA", goods_value_cents: 1000001, freight_cost_cents: 50000, duty_rate_pct: 0.03, total_weight_kg: 100 }, as: ImportCoordinator, captures: { ent_id: "$.data.id" } }
            - { call: "POST /seafood/import-entries/${ent_id}/file-prior-notice", payload: {}, as: ImportCoordinator }
