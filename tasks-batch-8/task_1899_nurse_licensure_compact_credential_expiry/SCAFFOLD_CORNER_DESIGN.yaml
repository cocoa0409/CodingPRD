            - { call: "POST /credentialing/state-licenses", payload: { nurse_id: "${n_id}", state_code: "AZ", license_number: "RN-AZ-SD1", license_class: "RN", multistate_flag: true, issued_on: "2026-06-15", expires_on: "2027-06-30" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { lic_id: "$.data.id" } }
            - { call: "POST /credentialing/state-licenses/${lic_id}/submit", payload: {}, as: CredentialingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /credentialing/primary-source-verifications", payload: { license_id: "${lic_id}", channel: "NURSYS" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { psv_id: "$.data.id" } }
            - { call: "POST /credentialing/primary-source-verifications/${psv_id}/record-result", payload: { outcome: "VERIFIED" }, as: PrimarySourceVerifier, as_user_id: "ver-1" }
          trigger:
            - { call: "POST /credentialing/state-licenses/${lic_id}/attest", payload: {}, as: PrimarySourceVerifier, as_user_id: "spec-1", captures: { err: "$.data.error_id" } }
            - { call: "POST /credentialing/state-licenses/${lic_id}/attest", payload: {}, as: PrimarySourceVerifier, as_user_id: "ver-1" }
          assert:
            - "First attest fails 403 error_id == 'ERR_SEGREGATION_OF_DUTIES' (attester id equals created_by_user_id 'spec-1')"
            - "Second attest (ver-1) succeeds: status == 'ACTIVE', verified_by_user_id == 'ver-1'"

      - name: discipline_adjudicate_same_officer_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=6]"
          - "errors[ERR_SEGREGATION_OF_DUTIES]"
          - "state_machines.DisciplinaryAction.UNDER_REVIEW_to_ADJUDICATED"
        distinguishing_aspect: "Four-eyes rule: the ComplianceOfficer who acknowledged the action cannot adjudicate it (403 ERR_SEGREGATION_OF_DUTIES); a second officer can."
        test_recipe:
          setup: ["Clock 2026-08-01; ACTIVE nurse (license attested); PRIVILEGE-scope REPRIMAND REPORTED then acknowledged by co-1."]
          setup_api_calls:
            - { call: "POST /credentialing/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemOperator, as_user_id: "ops-1" }
            - { call: "POST /credentialing/nurses", payload: { full_name: "Four Eyes", email: "four.eyes@x.com", primary_state_of_residence: "AZ", employment_type: "STAFF", hire_date: "2026-07-01" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { n_id: "$.data.id" } }
            - { call: "POST /credentialing/state-licenses", payload: { nurse_id: "${n_id}", state_code: "AZ", license_number: "RN-AZ-FE1", license_class: "RN", multistate_flag: true, issued_on: "2026-06-15", expires_on: "2027-06-30" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { lic_id: "$.data.id" } }
            - { call: "POST /credentialing/state-licenses/${lic_id}/submit", payload: {}, as: CredentialingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /credentialing/primary-source-verifications", payload: { license_id: "${lic_id}", channel: "NURSYS" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { psv_id: "$.data.id" } }
            - { call: "POST /credentialing/primary-source-verifications/${psv_id}/record-result", payload: { outcome: "VERIFIED" }, as: PrimarySourceVerifier, as_user_id: "ver-1" }
            - { call: "POST /credentialing/state-licenses/${lic_id}/attest", payload: {}, as: PrimarySourceVerifier, as_user_id: "ver-1" }
            - { call: "POST /credentialing/nurses/${n_id}/activate", payload: {}, as: CredentialingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /credentialing/disciplinary-actions", payload: { nurse_id: "${n_id}", scope: "PRIVILEGE", action_type: "REPRIMAND", effective_on: "2026-08-01" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { da_id: "$.data.id" } }
            - { call: "POST /credentialing/disciplinary-actions/${da_id}/acknowledge", payload: {}, as: ComplianceOfficer, as_user_id: "co-1" }
          trigger:
            - { call: "POST /credentialing/disciplinary-actions/${da_id}/adjudicate", payload: { outcome: "SUSTAINED" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { err: "$.data.error_id" } }
            - { call: "POST /credentialing/disciplinary-actions/${da_id}/adjudicate", payload: { outcome: "SUSTAINED" }, as: ComplianceOfficer, as_user_id: "co-2" }
          assert:
