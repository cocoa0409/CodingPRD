              captures: { note_npv: "$.data.npv_usd", note_rank: "$.data.rank" }
          assert:
            - "At creation both alternatives are status PROPOSED with npv_usd == null, discounted_pv_usd == null and rank == null"
            - "After SCORED the MODIFICATION reports discounted_pv_usd == 8133922.68 (925925.93 + 857338.82 + 6350657.93) and npv_usd == 8033922.68"
            - "After SCORED the NOTE_SALE reports discounted_pv_usd == 7870370.37 and npv_usd == 7780370.37"
            - "Both alternatives are status SCORED and rank 1 (MODIFICATION) and 2 (NOTE_SALE); plan.recommended_alternative_id == ${alt_mod_id}"
            - "Under CONTRACTUAL the shift is 0, so the first period is divided by 1.08 exactly once — a shift of 1 would give 857338.82 for period 1"
