              payload: { full_name: "Iggy Insufficient", phone: "555-1008" }
              as: CounterClerk
              captures: { ii_id: "$.data.id" }
            - call: "POST /custom-orders"
              payload: { customer_id: "${ii_id}", order_kind: "STANDARD", lines: [ { cut_type_id: "${ribeye_id}", ordered_weight_g: 2000 } ] }
