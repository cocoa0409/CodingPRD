scaffold_corner_design:

  # ==========================================================================
  # SECTION 1 - entities (§1.1 surface)
  # Walks the guide's Table-1 rows against this scaffold: creation, retrieval,
  # listing, not-found, required fields, defaults, computed fields, system
  # fields, type/uniqueness constraints and parent relationships. The
  # `immutability` row is skipped: every entity here declares
  # common_fields: true, so there is no immutable entity to probe.
  # ==========================================================================
  - section: entities
    instances:

      - name: create_brief_returns_201_with_echoed_inputs_and_system_defaults
        claim_type: creation
        grounds:
          - entities.Brief
          - endpoints[POST /briefs]
          - entities.Brief.fields.status
          - entities.Brief.fields.asset_count
          - response_envelope.success
        distinguishing_aspect: |
          Pins the create contract for the root entity: 201, every one of the eight
          input fields echoed back unmodified (including the nested structural_spec and
          net_contents_declaration objects), the four common fields present, and the
          two server-owned fields at their declared defaults - status DRAFT and
          asset_count 0. An implementation that returns 200, drops the nested objects,
          or starts a brief in APPROVED fails a named field rather than a vague shape.
        test_recipe:
          setup:
            - "Empty database."
            - "Logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-08-01T00:00:00Z"}
              as: PlatformAdmin
              as_user_id: "u_admin"
          trigger:
            - call: "POST /briefs"
              payload:
                sku_code: "SKU-1001"
                product_name: "Northgate Cocoa Carton 340g"
                regulatory_scheme: "FDA_FOOD"
                market_codes: ["US"]
                language_codes: ["en"]
                required_element_codes: ["NET_CONTENTS", "INGREDIENT_STATEMENT", "ALLERGEN_STATEMENT", "DATE_CODE_ZONE", "BARCODE", "RECYCLING_MARK", "ADDRESS_BLOCK"]
                structural_spec: { component_type: "CARTON", dimensions_mm: { l: 120, w: 60, h: 200 }, substrate_class: "COATED_PAPER", print_process: "OFFSET_LITHO" }
                net_contents_declaration: { metric_value: 340, metric_uom: "g", us_value: 12, us_uom: "oz" }
              as: PackagingCoordinator
              as_user_id: "u_coord"
              captures: { brief_id: "$.data.id" }
          assert:
            - "POST /briefs returns 201 and response_type == object"
            - "data.sku_code == SKU-1001, data.product_name == Northgate Cocoa Carton 340g, data.regulatory_scheme == FDA_FOOD"
            - "data.market_codes == [US] and data.language_codes == [en] and data.required_element_codes has all 7 codes"
            - "data.structural_spec.component_type == CARTON, data.structural_spec.substrate_class == COATED_PAPER, data.structural_spec.print_process == OFFSET_LITHO"
            - "data.net_contents_declaration.metric_value == 340 and data.net_contents_declaration.us_uom == oz"
            - "data.status == DRAFT, data.asset_count == 0, data.approved_by_user_id is null and data.approved_at is null"
            - "data.id is non-empty, data.version == 1, data.created_at == 2026-08-01T00:00:00Z and data.updated_at == 2026-08-01T00:00:00Z"
            - "the envelope carries meta.api_request_id and meta.api_request_timestamp"

      - name: get_artwork_asset_returns_stored_row_with_derived_unit_cost_and_zero_ledgers
        claim_type: retrieval
        grounds:
          - endpoints[GET /artwork-assets/{id}]
          - entities.ArtworkAsset.fields.standard_unit_cost_cents
          - entities.ArtworkAsset.fields.committed_plate_cost_cents
          - entities.ArtworkAsset.fields.obsolete_units_total
          - entities.ArtworkAsset.fields.changeover_cost_committed_cents
        distinguishing_aspect: |
          A read must return the persisted row plus the fields the create request
          derived rather than accepted: standard_unit_cost_cents is looked up from
          STANDARD_UNIT_COST_CENTS[CARTON] == 42 and is never an input, and the three
          conserved ledgers must read 0 on a fresh asset - not null, not absent.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Brief SKU-1001 APPROVED (FDA_FOOD / [US] / [en])."
            - "One ArtworkAsset on that brief: market US, component CARTON, substrate COATED_PAPER, brand_critical_color false, plate_budget_cents 500000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-08-01T00:00:00Z"}
              as: PlatformAdmin
              as_user_id: "u_admin"
            - call: "POST /briefs"
              payload:
                sku_code: "SKU-1001"
                product_name: "Northgate Cocoa Carton 340g"
                regulatory_scheme: "FDA_FOOD"
                market_codes: ["US"]
                language_codes: ["en"]
                required_element_codes: ["NET_CONTENTS", "INGREDIENT_STATEMENT", "ALLERGEN_STATEMENT", "DATE_CODE_ZONE", "BARCODE", "RECYCLING_MARK", "ADDRESS_BLOCK"]
                structural_spec: { component_type: "CARTON", dimensions_mm: { l: 120, w: 60, h: 200 }, substrate_class: "COATED_PAPER", print_process: "OFFSET_LITHO" }
                net_contents_declaration: { metric_value: 340, metric_uom: "g", us_value: 12, us_uom: "oz" }
              as: PackagingCoordinator
              as_user_id: "u_coord"
              captures: { brief_id: "$.data.id" }
            - call: "POST /briefs/${brief_id}/decision"
              payload: {decision: "APPROVED", review_note: "Scheme and net contents confirmed."}
              as: RegulatoryReviewer
              as_user_id: "u_reg"
            - call: "POST /artwork-assets"
              payload:
                brief_id: "${brief_id}"
                market_code: "US"
                language_codes: ["en"]
                component_type: "CARTON"
                substrate_class: "COATED_PAPER"
                brand_critical_color: false
                plate_budget_cents: 500000
              as: PackagingCoordinator
              as_user_id: "u_coord"
              captures: { asset_id: "$.data.id", asset_v1: "$.data.version" }
          trigger:
            - call: "GET /artwork-assets/${asset_id}"
              payload: {}
              as: PackagingCoordinator
              as_user_id: "u_coord"
          assert:
            - "GET /artwork-assets/${asset_id} returns 200 with data.id == ${asset_id}"
            - "data.brief_id == ${brief_id}, data.market_code == US, data.component_type == CARTON, data.substrate_class == COATED_PAPER"
            - "data.language_codes == [en] and data.brand_critical_color == false and data.plate_budget_cents == 500000"
            - "data.standard_unit_cost_cents == 42 (STANDARD_UNIT_COST_CENTS[CARTON], never supplied by the client)"
            - "data.obsolescence_state == ACTIVE, data.version_counter == 0 and data.current_approved_version_id is null"
            - "data.committed_plate_cost_cents == 0, data.obsolete_units_total == 0 and data.changeover_cost_committed_cents == 0"
            - "data.version == 1"

      - name: list_briefs_pages_newest_first_and_filters_by_status
        claim_type: listing
        grounds:
          - endpoints[GET /briefs]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
          - entities.Brief.fields.status
        distinguishing_aspect: |
          Three rows created on three DIFFERENT logical days make the declared
          created_at DESC ordering falsifiable - an ascending implementation answers
          page 1 with SKU-1001 first instead of SKU-1003 - and every window is
          unambiguous because no two rows share a created_at. The filter must also
          compose with pagination rather than being applied after the window is cut:
          status APPROVED with limit 1 offset 1 must return SKU-1001, the second
          APPROVED row in newest-first order, not the second row of page 1.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z for all three creates."
            - "The logical clock is advanced before each create - SKU-1001 at 2026-08-01T00:00:00Z, SKU-1002 at 2026-08-02T00:00:00Z, SKU-1003 at 2026-08-03T00:00:00Z - so the three created_at stamps strictly increase."
            - "SKU-1001 and SKU-1002 are then APPROVED by the regulatory reviewer; SKU-1003 is left DRAFT."
            - "Only the brief decision calls change status; nothing reorders created_at."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-08-01T00:00:00Z"}
              as: PlatformAdmin
              as_user_id: "u_admin"
            - call: "POST /briefs"
              payload:
                sku_code: "SKU-1001"
                product_name: "Northgate Cocoa Carton 340g"
                regulatory_scheme: "FDA_FOOD"
                market_codes: ["US"]
                language_codes: ["en"]
                required_element_codes: ["NET_CONTENTS", "INGREDIENT_STATEMENT", "ALLERGEN_STATEMENT", "DATE_CODE_ZONE", "BARCODE", "RECYCLING_MARK", "ADDRESS_BLOCK"]
                structural_spec: { component_type: "CARTON", dimensions_mm: { l: 120, w: 60, h: 200 }, substrate_class: "COATED_PAPER", print_process: "OFFSET_LITHO" }
                net_contents_declaration: { metric_value: 340, metric_uom: "g", us_value: 12, us_uom: "oz" }
              as: PackagingCoordinator
              as_user_id: "u_coord"
              captures: { brief_1: "$.data.id" }
            - call: "POST /briefs/${brief_1}/decision"
              payload: {decision: "APPROVED", review_note: "Scheme and net contents confirmed."}
              as: RegulatoryReviewer
              as_user_id: "u_reg"
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-08-02T00:00:00Z"}
              as: PlatformAdmin
              as_user_id: "u_admin"
            - call: "POST /briefs"
              payload:
                sku_code: "SKU-1002"
                product_name: "Northgate Cocoa Carton 500g"
                regulatory_scheme: "FDA_FOOD"
                market_codes: ["US"]
                language_codes: ["en"]
                required_element_codes: ["NET_CONTENTS", "INGREDIENT_STATEMENT", "ALLERGEN_STATEMENT", "DATE_CODE_ZONE", "BARCODE", "RECYCLING_MARK", "ADDRESS_BLOCK"]
                structural_spec: { component_type: "CARTON", dimensions_mm: { l: 120, w: 60, h: 200 }, substrate_class: "COATED_PAPER", print_process: "OFFSET_LITHO" }
                net_contents_declaration: { metric_value: 340, metric_uom: "g", us_value: 12, us_uom: "oz" }
              as: PackagingCoordinator
              as_user_id: "u_coord"
              captures: { brief_2: "$.data.id" }
            - call: "POST /briefs/${brief_2}/decision"
              payload: {decision: "APPROVED", review_note: "Scheme and net contents confirmed."}
              as: RegulatoryReviewer
              as_user_id: "u_reg"
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-08-03T00:00:00Z"}
              as: PlatformAdmin
              as_user_id: "u_admin"
            - call: "POST /briefs"
              payload:
                sku_code: "SKU-1003"
                product_name: "Northgate Cocoa Sachet 20g"
                regulatory_scheme: "FDA_FOOD"
                market_codes: ["US"]
                language_codes: ["en"]
                required_element_codes: ["NET_CONTENTS", "INGREDIENT_STATEMENT", "ALLERGEN_STATEMENT", "DATE_CODE_ZONE", "BARCODE", "RECYCLING_MARK", "ADDRESS_BLOCK"]
                structural_spec: { component_type: "CARTON", dimensions_mm: { l: 120, w: 60, h: 200 }, substrate_class: "COATED_PAPER", print_process: "OFFSET_LITHO" }
                net_contents_declaration: { metric_value: 340, metric_uom: "g", us_value: 12, us_uom: "oz" }
              as: PackagingCoordinator
              as_user_id: "u_coord"
              captures: { brief_3: "$.data.id" }
          trigger:
            - call: "GET /briefs"
              payload: {limit: 2, offset: 0}
              as: PackagingCoordinator
              as_user_id: "u_coord"
            - call: "GET /briefs"
              payload: {limit: 2, offset: 2}
              as: PackagingCoordinator
              as_user_id: "u_coord"
            - call: "GET /briefs"
              payload: {status: "DRAFT"}
              as: PackagingCoordinator
              as_user_id: "u_coord"
            - call: "GET /briefs"
              payload: {status: "APPROVED", limit: 1, offset: 1}
              as: PackagingCoordinator
              as_user_id: "u_coord"
          assert:
            - "GET /briefs?limit=2&offset=0 returns 200, response_type == array, data has 2 entries, data[0].sku_code == SKU-1003 and data[1].sku_code == SKU-1002 - newest created_at first"
            - "that response reports total_count == 3, has_more == true, limit == 2, offset == 0"
            - "GET /briefs?limit=2&offset=2 returns data with 1 entry whose sku_code == SKU-1001, total_count == 3 and has_more == false"
            - "GET /briefs?status=DRAFT returns exactly 1 entry (SKU-1003) with total_count == 1"
            - "GET /briefs?status=APPROVED&limit=1&offset=1 returns exactly 1 entry whose sku_code == SKU-1001 and total_count == 2 - the older of the two APPROVED rows"

      - name: reads_of_unknown_ids_return_the_per_entity_not_found_error
        claim_type: not_found
        grounds:
          - errors[ERR_BRIEF_NOT_FOUND]
          - errors[ERR_ARTWORK_VERSION_NOT_FOUND]
          - errors[ERR_REVIEW_TASK_NOT_FOUND]
          - errors[ERR_INVENTORY_RUNOUT_NOT_FOUND]
          - errors[ERR_ERROR_ESCAPE_NOT_FOUND]
          - validations[priority=1]
          - response_envelope.error
        distinguishing_aspect: |
          Each collection must answer with ITS OWN 404 error_id, not a shared generic
          one, and must do so on an empty database where no row of any kind exists - so
          an implementation that only checks existence after loading a parent, or that
          collapses all 404s into one code, is caught per endpoint.
        test_recipe:
          setup:
            - "Empty database - no Brief, ArtworkVersion, ReviewTask, InventoryRunout or ErrorEscape row exists."
            - "Every trigger uses a syntactically valid but unknown id."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-08-01T00:00:00Z"}
              as: PlatformAdmin
              as_user_id: "u_admin"
          trigger:
            - call: "GET /briefs/br_absent"
              payload: {}
              as: PackagingCoordinator
              as_user_id: "u_coord"
            - call: "GET /artwork-versions/av_absent"
              payload: {}
              as: PackagingCoordinator
              as_user_id: "u_coord"
            - call: "GET /review-tasks/rt_absent"
              payload: {}
              as: BrandReviewer
              as_user_id: "u_brand"
            - call: "GET /inventory-runouts/ir_absent"
              payload: {}
              as: PackagingCoordinator
              as_user_id: "u_coord"
            - call: "GET /error-escapes/ee_absent"
              payload: {}
              as: QualityReviewer
              as_user_id: "u_qa"
          assert:
            - "GET /briefs/br_absent returns 404 with data.error_id == ERR_BRIEF_NOT_FOUND"
            - "GET /artwork-versions/av_absent returns 404 with data.error_id == ERR_ARTWORK_VERSION_NOT_FOUND"
            - "GET /review-tasks/rt_absent returns 404 with data.error_id == ERR_REVIEW_TASK_NOT_FOUND"
            - "GET /inventory-runouts/ir_absent returns 404 with data.error_id == ERR_INVENTORY_RUNOUT_NOT_FOUND"
            - "GET /error-escapes/ee_absent returns 404 with data.error_id == ERR_ERROR_ESCAPE_NOT_FOUND"
            - "every one of those responses has response_type == error and a non-empty data.message"

      - name: omitting_a_required_input_field_returns_invalid_request
        claim_type: required_fields
        grounds:
          - errors[ERR_INVALID_REQUEST]
          - endpoints[POST /artwork-assets]
          - endpoints[POST /printers]
          - entities.ArtworkAsset.fields.plate_budget_cents
          - entities.Printer.fields.recovery_liability_cap_cents
        distinguishing_aspect: |
          Every field in a §1.5 `input:` list without a trailing `?` is mandatory,
          and the three probes cover a required integer (plate_budget_cents), a
          required enum (substrate_class) and a required integer on a different
          entity (recovery_liability_cap_cents). All three must be 400 with
          ERR_INVALID_REQUEST and must create nothing - an implementation that
          substitutes a zero default silently succeeds instead.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Brief SKU-1001 APPROVED, so brief_id resolves and no 404 can mask the field error."
            - "No ArtworkAsset and no Printer row exists yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-08-01T00:00:00Z"}
              as: PlatformAdmin
              as_user_id: "u_admin"
            - call: "POST /briefs"
              payload:
                sku_code: "SKU-1001"
                product_name: "Northgate Cocoa Carton 340g"
                regulatory_scheme: "FDA_FOOD"
                market_codes: ["US"]
                language_codes: ["en"]
                required_element_codes: ["NET_CONTENTS", "INGREDIENT_STATEMENT", "ALLERGEN_STATEMENT", "DATE_CODE_ZONE", "BARCODE", "RECYCLING_MARK", "ADDRESS_BLOCK"]
                structural_spec: { component_type: "CARTON", dimensions_mm: { l: 120, w: 60, h: 200 }, substrate_class: "COATED_PAPER", print_process: "OFFSET_LITHO" }
                net_contents_declaration: { metric_value: 340, metric_uom: "g", us_value: 12, us_uom: "oz" }
              as: PackagingCoordinator
              as_user_id: "u_coord"
              captures: { brief_id: "$.data.id" }
            - call: "POST /briefs/${brief_id}/decision"
              payload: {decision: "APPROVED", review_note: "Scheme and net contents confirmed."}
              as: RegulatoryReviewer
              as_user_id: "u_reg"
          trigger:
            - call: "POST /artwork-assets"
              payload: {brief_id: "${brief_id}", market_code: "US", language_codes: ["en"], component_type: "CARTON", substrate_class: "COATED_PAPER"}
              as: PackagingCoordinator
              as_user_id: "u_coord"
            - call: "POST /artwork-assets"
              payload: {brief_id: "${brief_id}", market_code: "US", language_codes: ["en"], component_type: "CARTON", plate_budget_cents: 500000}
              as: PackagingCoordinator
              as_user_id: "u_coord"
            - call: "POST /printers"
              payload: {name: "Cascade Print Co", color_standard: "G7_MASTER", certified_substrates: ["COATED_PAPER"]}
              as: PlatformAdmin
              as_user_id: "u_admin"
          assert:
            - "POST /artwork-assets without plate_budget_cents returns 400 with data.error_id == ERR_INVALID_REQUEST"
            - "POST /artwork-assets without substrate_class returns 400 with data.error_id == ERR_INVALID_REQUEST"
            - "POST /printers without recovery_liability_cap_cents returns 400 with data.error_id == ERR_INVALID_REQUEST"
            - "no ArtworkAsset row and no Printer row exists after the three refusals"
            - "Brief.${brief_id}.asset_count is still 0"

      - name: omitted_optional_fields_take_their_declared_defaults
        claim_type: defaults
        grounds:
          - entities.ArtworkAsset.fields.brand_critical_color
          - entities.ArtworkVersion.fields.claim_ids
          - entities.ArtworkVersion.fields.state
          - entities.ArtworkVersion.fields.open_condition_codes
          - entities.ArtworkVersion.fields.pinned_claim_snapshot
          - entities.ArtworkVersion.fields.requires_reverification
        distinguishing_aspect: |
          The two optional inputs on the create path (brand_critical_color and
          claim_ids) must materialise as false and [] respectively - not null and not
          absent - because downstream logic branches on them (press_check_required
          reads the flag; the claim checks iterate the array). The system-owned
          defaults on a fresh version are asserted in the same breath so a
          half-initialised row is caught.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Brief SKU-1001 APPROVED (FDA_FOOD / [US] / [en])."
            - "The asset create payload deliberately omits brand_critical_color; the version create payload deliberately omits claim_ids and supersedes_version_id."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-08-01T00:00:00Z"}
              as: PlatformAdmin
              as_user_id: "u_admin"
            - call: "POST /briefs"
              payload:
                sku_code: "SKU-1001"
                product_name: "Northgate Cocoa Carton 340g"
                regulatory_scheme: "FDA_FOOD"
                market_codes: ["US"]
                language_codes: ["en"]
                required_element_codes: ["NET_CONTENTS", "INGREDIENT_STATEMENT", "ALLERGEN_STATEMENT", "DATE_CODE_ZONE", "BARCODE", "RECYCLING_MARK", "ADDRESS_BLOCK"]
                structural_spec: { component_type: "CARTON", dimensions_mm: { l: 120, w: 60, h: 200 }, substrate_class: "COATED_PAPER", print_process: "OFFSET_LITHO" }
                net_contents_declaration: { metric_value: 340, metric_uom: "g", us_value: 12, us_uom: "oz" }
              as: PackagingCoordinator
              as_user_id: "u_coord"
              captures: { brief_id: "$.data.id" }
            - call: "POST /briefs/${brief_id}/decision"
              payload: {decision: "APPROVED", review_note: "Scheme and net contents confirmed."}
              as: RegulatoryReviewer
              as_user_id: "u_reg"
          trigger:
            - call: "POST /artwork-assets"
              payload: {brief_id: "${brief_id}", market_code: "US", language_codes: ["en"], component_type: "CARTON", substrate_class: "COATED_PAPER", plate_budget_cents: 500000}
              as: PackagingCoordinator
              as_user_id: "u_coord"
              captures: { asset_id: "$.data.id", asset_v1: "$.data.version" }
            - call: "POST /artwork-assets/${asset_id}/versions"
              payload:
                expected_artwork_asset_version: "${asset_v1}"
                reason_for_change_code: "NEW_LAUNCH"
                change_description: "Initial launch artwork."
                mandatory_elements:
                  net_contents: { metric_value: 340, metric_uom: "g", us_value: 12, us_uom: "oz" }
                  ingredient_statement: { text: "WATER, SUGAR, COCOA, MILK POWDER, SALT", descending_order: true }
                  allergen_statement: { text: "CONTAINS MILK", allergen_emphasis: true }
                  date_code_zone: { zone_mm2: 240, position: "BACK_PANEL_LOWER_RIGHT" }
                  barcode: { gtin14: "00012345678905" }
                  recycling_mark: { present: true }
                  address_block: { text: "Northgate Foods, Portland OR 97209" }
              as: PackagingCoordinator
              as_user_id: "u_coord"
              captures: { v1_id: "$.data.id" }
          assert:
            - "the asset create returns 201 with data.brand_critical_color == false (not null)"
            - "the version create returns 201 with data.claim_ids == [] and data.supersedes_version_id is null"
            - "the new version has data.state == DRAFT, data.revision_cycle_count == 0, data.route_count == 0, data.check_run_no == 0"
            - "data.failed_element_count == 0, data.waived_element_count == 0, data.requires_reverification == false"
            - "data.open_condition_codes == [] and data.pinned_claim_snapshot == []"

      - name: computed_counters_and_lookups_are_server_derived_not_client_supplied
        claim_type: computed_fields
        grounds:
          - entities.Brief.fields.asset_count
          - entities.MarketingClaim.fields.usage_count
          - entities.ArtworkAsset.fields.standard_unit_cost_cents
          - calculations.cost_recovery_amount.constants.STANDARD_UNIT_COST_CENTS
          - endpoints[GET /marketing-claims/{id}]
        distinguishing_aspect: |
          Three `source: computed` fields on three entities, each with a different
          derivation: a child-row counter (Brief.asset_count == 2 after two assets), a
          reverse-reference counter (MarketingClaim.usage_count == 1 once one version
          lists the claim in claim_ids), and a constant-table lookup keyed on another
          field of the same row (LABEL maps to 9, not the CARTON 42). None of the
          three appears in any §1.5 `input:` list, so a client cannot set them and an
          implementation that stores a static zero is caught by a named number.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Brief SKU-1001 APPROVED (FDA_FOOD / [US] / [en], all seven elements required)."
            - "MarketingClaim CLM-NAS-01 for market US is CLEARED for [2026-08-01T00:00:00Z, 2026-12-01T00:00:00Z), usage_count 0."
            - "Two ArtworkAssets on the brief: one CARTON on COATED_PAPER, one LABEL on UNCOATED_PAPER (a different component_type, so the (brief_id, market_code, component_type) uniqueness rule is satisfied)."
            - "No ArtworkVersion exists yet, so usage_count starts at 0."
