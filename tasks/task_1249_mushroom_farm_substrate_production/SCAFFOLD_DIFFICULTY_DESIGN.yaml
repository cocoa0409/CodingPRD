  - rule_id: priority_pair_validation_conflict
    instances:
      - name: cycle_create_state_beats_window_overlap
        grounds:
          - validations[priority=7]
          - validations[priority=9]
          - errors[ERR_BATCH_NOT_SPAWNED]
          - errors[ERR_ROOM_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Category pair {state, business_temporal} on POST /api/room-cycles: the request
          violates both (batch merely CONDITIONED, window colliding with an existing cycle's
          buffered interval); the state error ERR_BATCH_NOT_SPAWNED (priority 7) must win over
          ERR_ROOM_WINDOW_OVERLAP (priority 9).
