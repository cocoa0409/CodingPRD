# =============================================================================
# PRD Benchmark Scaffold — Public Warning & Evacuation Zone Management
# Difficulty: Expert
# =============================================================================

scenario: |
  Public Warning & Evacuation Zone Management: zone/geofence & population
  estimate, evacuation-order level (voluntary/mandatory), route & shelter
  capacity, re-entry & access credential, functional-needs registry,
  multi-channel alert & IPAWS, contraflow/traffic, all-clear

domain_name: evacuation-zone-management
api_prefix: /evac

complexity_profile:
  primary_archetype: posture-driven gating      # Zone.order_level gates registrant/assignment ops; Shelter.status gates check-in
  secondary_archetype: quota / allocation        # finite shelter beds reserved/committed/released
  complexity_layers:
    - optimistic_concurrency                     # OCC on Registrant.version for supersede-create of ShelterAssignment
    - cascading_side_effects                     # Zone->Registrant->ShelterAssignment->Shelter; Incident->Zone->AccessCredential
    - dual_variant_calculation                   # day/night population; provisional/confirmed shelter capacity
    - derived_field_reconciliation               # reserved_beds/occupied_beds, ipaws_slots_reserved, clearance_estimate

  entity_topology: flat                          # peer entities linked by FK; collections one level under /evac
  state_machine_shape: parallel                  # AlertDispatch has independent per-channel dimensions; Zone is also cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles                          # each operational role owns a distinct resource family
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Incident
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Human label for the emergency incident"
      - name: jurisdiction
        type: string
        source: input
        description: "County/city operating the response"
      - name: hazard_type
        type: enum
        source: input
        description: "Hazard driving the evacuation"
        constraints: "one of WILDFIRE, FLOOD, HURRICANE, HAZMAT, TSUNAMI"
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: "Incident phase"
        constraints: "one of DRAFT, ACTIVE, ALL_CLEAR, STOOD_DOWN"
      - name: ipaws_daily_slot_budget
        type: integer
        source: input
        default: 5
        description: "Max IPAWS-bearing alert dispatches that may be queued/sent for this incident"
        constraints: ">= 0"
      - name: ipaws_slots_reserved
        type: integer
        source: computed
        description: "Count of IPAWS-bearing AlertDispatch rows currently QUEUED (see incident_ipaws_slots_reserved). Conserved quantity."
      - name: activated_at
        type: datetime
        source: system
        description: "Clock instant the incident moved DRAFT->ACTIVE; null while DRAFT"
      - name: all_clear_at
        type: datetime
        source: system
        description: "Clock instant the incident moved ACTIVE->ALL_CLEAR; null otherwise"
      - name: clearance_estimate_minutes
        type: integer
        source: computed
        description: "Estimated minutes to clear all zones under order (see evacuation_clearance_time); null when no open route throughput"

  - name: Zone
    parent: null
    common_fields: true
    fields:
      - name: incident_id
        type: string
        source: input
        description: "FK -> Incident.id; owning incident"
      - name: name
        type: string
        source: input
        description: "Zone label (e.g. Zone-3)"
      - name: geofence_wkt
        type: string
        source: input
        description: "WKT polygon describing the zone boundary"
      - name: residential_population
        type: integer
        source: input
        description: "Census resident headcount"
        constraints: ">= 0"
      - name: transient_population
        type: integer
        source: input
        default: 0
        description: "Daytime commuters/visitors present only during daytime hours"
        constraints: ">= 0"
      - name: daytime_occupancy_factor
        type: number
        source: input
        default: 1.0
        description: "Multiplier applied to residents during daytime"
        constraints: "0 <= x <= 2"
      - name: nighttime_occupancy_factor
        type: number
        source: input
        default: 1.0
        description: "Multiplier applied to residents during nighttime"
        constraints: "0 <= x <= 2"
      - name: order_level
        type: enum
        source: system
        default: NONE
        description: "Current evacuation-order posture; gates child operations"
        constraints: "one of NONE, VOLUNTARY, MANDATORY, RE_ENTRY_ALLOWED"
      - name: population_at_risk
        type: integer
        source: computed
        description: "Day/night-adjusted headcount (see zone_population_at_risk)"
      - name: order_issued_at
        type: datetime
        source: system
        description: "Clock instant of the most recent order transition; null while NONE"

  - name: Shelter
    parent: null
    common_fields: true
    fields:
      - name: incident_id
        type: string
        source: input
        description: "FK -> Incident.id; owning incident"
      - name: name
        type: string
        source: input
        description: "Shelter label"
      - name: physical_capacity
        type: integer
        source: input
        description: "Maximum beds the facility physically holds"
        constraints: ">= 0"
      - name: ada_reserved_pct
        type: number
        source: input
        default: 0.10
        description: "Fraction of usable beds reserved for functional-needs access"
        constraints: "0 <= x <= 1"
      - name: power_backup
        type: boolean
        source: input
        default: true
        description: "True if the shelter has backup power for electricity-dependent evacuees"
      - name: status
        type: enum
        source: system
        default: STANDBY
        description: "Operating posture"
        constraints: "one of STANDBY, OPEN, FULL, CLOSED"
      - name: staffed_capacity_now
        type: integer
        source: computed
        description: "Sum of staffed_beds over SCHEDULED StaffShifts covering the current clock (half-open)"
      - name: effective_capacity
        type: integer
        source: computed
        description: "General-population usable beds (see shelter_effective_capacity)"
      - name: reserved_beds
        type: integer
        source: computed
        description: "Sum of party_size over RESERVED ShelterAssignments. Conserved quantity."
      - name: occupied_beds
        type: integer
        source: computed
        description: "Sum of party_size over CHECKED_IN ShelterAssignments"
      - name: provisional_available
        type: integer
        source: computed
        description: "effective_capacity - reserved_beds - occupied_beds (PROVISIONAL variant)"
      - name: confirmed_available
        type: integer
        source: computed
        description: "effective_capacity - occupied_beds (CONFIRMED variant)"

  - name: StaffShift
    parent: null
    common_fields: true
    fields:
      - name: shelter_id
        type: string
        source: input
        description: "FK -> Shelter.id; shelter staffed by this shift"
      - name: role_label
        type: string
        source: input
        description: "Staffing role (e.g. NURSE, GENERAL)"
      - name: staffed_beds
        type: integer
        source: input
        description: "Beds this shift is able to staff"
        constraints: ">= 0"
      - name: start_utc
        type: datetime
        source: input
        description: "Shift start (inclusive)"
      - name: end_utc
        type: datetime
        source: input
        description: "Shift end (inclusive)"
        constraints: "must be strictly after start_utc"
      - name: status
        type: enum
        source: system
        default: SCHEDULED
        description: "Shift lifecycle"
        constraints: "one of SCHEDULED, CANCELLED"

  - name: EvacuationRoute
    parent: null
    common_fields: true
    fields:
      - name: incident_id
        type: string
        source: input
        description: "FK -> Incident.id; owning incident"
      - name: name
        type: string
        source: input
        description: "Route label"
      - name: corridor_label
        type: string
        source: input
        description: "Physical corridor name"
      - name: throughput_vph
        type: integer
        source: input
        description: "Vehicles-per-hour the route can move"
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        default: PLANNED
        description: "Route posture"
        constraints: "one of PLANNED, OPEN, CONGESTED, CLOSED"

  - name: ContraflowSegment
    parent: null
    common_fields: true
    fields:
      - name: route_id
        type: string
        source: input
        description: "FK -> EvacuationRoute.id; route this contraflow window applies to"
      - name: segment_key
        type: string
        source: input
        description: "Identifier of the physical road segment being reversed"
      - name: direction
        type: enum
        source: input
        description: "Contraflow direction"
        constraints: "one of INBOUND_REVERSED, OUTBOUND"
      - name: window_start_utc
        type: datetime
        source: input
        description: "Start of the contraflow window (inclusive)"
      - name: window_end_utc
        type: datetime
        source: input
        description: "End of the contraflow window (exclusive)"
        constraints: "must be strictly after window_start_utc"
      - name: status
        type: enum
        source: system
        default: SCHEDULED
        description: "Contraflow lifecycle"
        constraints: "one of SCHEDULED, ACTIVE, CANCELLED, COMPLETED"

  - name: Registrant
    parent: null
    common_fields: true
    fields:
      - name: zone_id
        type: string
        source: input
        description: "FK -> Zone.id; zone the household lives in"
      - name: household_name
        type: string
        source: input
        description: "Registrant/household label"
      - name: party_size
        type: integer
        source: input
        description: "Number of people in the household"
        constraints: ">= 1"
      - name: functional_needs
        type: enum
        source: input
        default: NONE
        description: "Functional-needs classification"
        constraints: "one of NONE, MOBILITY, MEDICAL_ELECTRICITY, OXYGEN, COGNITIVE"
      - name: transport_required
        type: boolean
        source: input
        default: false
        description: "True if the household needs assisted transport"
      - name: status
        type: enum
        source: system
        default: REGISTERED
        description: "Evacuation status; set at creation from the zone's current order_level, then advanced by cascades"
        constraints: "one of REGISTERED, ADVISED, ORDERED, SHELTERED, CLEARED_FOR_REENTRY"
      - name: current_assignment_id
        type: string
        source: system
        description: "Id of the household's active ShelterAssignment; null when none"

  - name: ShelterAssignment
    parent: null
    common_fields: true
    fields:
      - name: registrant_id
        type: string
        source: input
        description: "FK -> Registrant.id; household being sheltered"
      - name: shelter_id
        type: string
        source: input
        description: "FK -> Shelter.id; destination shelter"
      - name: party_size
        type: integer
        source: system
        description: "Copied from the Registrant at creation; the bed count this assignment consumes"
      - name: status
        type: enum
        source: system
        default: RESERVED
        description: "Assignment lifecycle"
        constraints: "one of RESERVED, CHECKED_IN, CHECKED_OUT, CANCELLED"
      - name: checked_in_at
        type: datetime
        source: system
        description: "Clock instant of check-in; null until CHECKED_IN"

  - name: AccessCredential
    parent: null
    common_fields: true
    fields:
      - name: zone_id
        type: string
        source: input
        description: "FK -> Zone.id; zone the credential grants access to"
      - name: registrant_id
        type: string
        source: input
        description: "FK -> Registrant.id; holder of the credential"
      - name: credential_type
        type: enum
        source: input
        description: "Access class"
        constraints: "one of RESIDENT, ESSENTIAL_WORKER, UTILITY"
      - name: valid_from_utc
        type: datetime
        source: input
        description: "Start of the credential validity window (inclusive)"
      - name: valid_until_utc
        type: datetime
        source: input
        description: "End of the credential validity window (exclusive)"
        constraints: "must be strictly after valid_from_utc"
      - name: status
        type: enum
        source: system
        default: ISSUED
        description: "Credential lifecycle"
        constraints: "one of ISSUED, ACTIVE, SUSPENDED, EXPIRED, REVOKED"

  - name: AlertDispatch
    parent: null
    common_fields: true
    fields:
      - name: zone_id
        type: string
        source: input
        description: "FK -> Zone.id; zone targeted by the alert"
      - name: message
        type: string
        source: input
        description: "Alert body text"
      - name: severity
        type: enum
        source: input
        description: "Alert severity"
        constraints: "one of ADVISORY, WATCH, WARNING, EXTREME"
      - name: channels
        type: array
        source: input
        description: "Requested delivery channels; non-empty subset of [WEA, EAS, IPAWS, SMS]"
      - name: wea_status
        type: enum
        source: system
        description: "WEA channel dimension (parallel); PENDING if requested else NA"
        constraints: "one of NA, PENDING, SENT, FAILED"
      - name: eas_status
        type: enum
        source: system
        description: "EAS channel dimension (parallel)"
        constraints: "one of NA, PENDING, SENT, FAILED"
      - name: ipaws_status
        type: enum
        source: system
        description: "IPAWS channel dimension (parallel)"
        constraints: "one of NA, PENDING, SENT, FAILED"
      - name: sms_status
        type: enum
        source: system
        description: "SMS channel dimension (parallel)"
        constraints: "one of NA, PENDING, SENT, FAILED"
      - name: overall_status
        type: enum
        source: system
        default: DRAFT
        description: "Rollup lifecycle derived from per-channel dimensions"
        constraints: "one of DRAFT, QUEUED, SENT, PARTIAL, FAILED, CANCELLED"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Incident
    initial_state: DRAFT
    terminal_states: [STOOD_DOWN]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /evac/incidents/{id}/phase {to_phase: ACTIVE}"
        actor: IncidentCommander
        preconditions: ["incident.status == DRAFT"]
        side_effects:
          - "set activated_at = current logical clock"
          - "increments Incident.version by 1"
      - from: ACTIVE
        to: ALL_CLEAR
        trigger: "POST /evac/incidents/{id}/phase {to_phase: ALL_CLEAR}"
        actor: IncidentCommander
        preconditions:
          - "incident.status == ACTIVE"
          - "NO Zone z (z.incident_id == incident.id) has order_level == MANDATORY (else ERR_ALL_CLEAR_BLOCKED)"
        side_effects:
          - "set all_clear_at = current logical clock"
          - "CASCADE hop1: every Zone z (z.incident_id==incident.id) with order_level == VOLUNTARY -> RE_ENTRY_ALLOWED (each Zone.version +1). MANDATORY zones cannot exist here — all-clear is blocked while any zone is MANDATORY. NONE zones are untouched."
          - "CASCADE hop2: for each Zone that just became RE_ENTRY_ALLOWED, every AccessCredential c (c.zone_id==z.id) with status==ISSUED and valid_from_utc <= now < valid_until_utc -> ACTIVE (each AccessCredential.version +1)"
          - "increments Incident.version by 1"
        note: "Depth-2 transitive cascade Incident -> Zone -> AccessCredential."
      - from: ALL_CLEAR
        to: STOOD_DOWN
        trigger: "POST /evac/incidents/{id}/phase {to_phase: STOOD_DOWN}"
        actor: IncidentCommander
        preconditions: ["incident.status == ALL_CLEAR"]
        side_effects:
          - "every Shelter (shelter.incident_id==incident.id) in {OPEN, FULL} -> CLOSED; every RESERVED ShelterAssignment on those shelters -> CANCELLED releasing reserved_beds"
          - "increments Incident.version by 1"

  - entity: Zone
    initial_state: NONE
    terminal_states: []
    transitions:
      - from: NONE
        to: VOLUNTARY
        trigger: "POST /evac/zones/{id}/order {level: VOLUNTARY}"
        actor: IncidentCommander
        preconditions: ["incident.status == ACTIVE (else ERR_INCIDENT_NOT_ACTIVE)"]
        side_effects:
          - "recompute population_at_risk"
          - "CASCADE: every Registrant r (r.zone_id==zone.id) with status==REGISTERED -> ADVISED (r.version +1)"
          - "set order_issued_at = now"
          - "increments Zone.version by 1"
      - from: NONE
        to: MANDATORY
        trigger: "POST /evac/zones/{id}/order {level: MANDATORY}"
        actor: IncidentCommander
        preconditions: ["incident.status == ACTIVE (else ERR_INCIDENT_NOT_ACTIVE)"]
        side_effects:
          - "recompute population_at_risk"
          - "CASCADE hop1: every Registrant r (r.zone_id==zone.id) with status in {REGISTERED, ADVISED} -> ORDERED (r.version +1)"
          - "CASCADE hop2: for each such Registrant whose current_assignment_id points to a ShelterAssignment in status RESERVED, that assignment -> CHECKED_IN (checked_in_at=now; assignment.version +1) and the Registrant -> SHELTERED"
          - "CASCADE hop3: each Shelter receiving a check-in recomputes reserved_beds/occupied_beds; if occupied_beds >= effective_capacity it transitions OPEN -> FULL (shelter.version +1)"
          - "set order_issued_at = now"
          - "increments Zone.version by 1"
        note: "Depth-3 transitive cascade Zone -> Registrant -> ShelterAssignment -> Shelter."
      - from: VOLUNTARY
        to: MANDATORY
        trigger: "POST /evac/zones/{id}/order {level: MANDATORY}"
        actor: IncidentCommander
        preconditions: ["incident.status == ACTIVE (else ERR_INCIDENT_NOT_ACTIVE)"]
        side_effects:
          - "recompute population_at_risk"
          - "CASCADE hop1: every Registrant r (r.zone_id==zone.id) with status in {REGISTERED, ADVISED} -> ORDERED (r.version +1)"
          - "CASCADE hop2: for each such Registrant whose current_assignment_id points to a RESERVED ShelterAssignment, that assignment -> CHECKED_IN (checked_in_at=now; assignment.version +1) and the Registrant -> SHELTERED"
          - "CASCADE hop3: each Shelter receiving a check-in recomputes occupied_beds; if occupied_beds >= effective_capacity it transitions OPEN -> FULL (shelter.version +1)"
          - "increments Zone.version by 1"
        note: "Depth-3 transitive cascade Zone -> Registrant -> ShelterAssignment -> Shelter."
      - from: MANDATORY
        to: VOLUNTARY
        trigger: "POST /evac/zones/{id}/order {level: VOLUNTARY}"
        actor: IncidentCommander
        preconditions: ["incident.status == ACTIVE"]
        side_effects:
          - "recompute population_at_risk"
          - "CASCADE: every Registrant r (r.zone_id==zone.id) with status==ORDERED -> ADVISED (r.version +1)"
          - "increments Zone.version by 1"
        note: "Downgrade — makes the Zone machine cyclic (MANDATORY <-> VOLUNTARY)."
      - from: VOLUNTARY
        to: NONE
        trigger: "POST /evac/zones/{id}/order {level: NONE}"
        actor: IncidentCommander
        preconditions: ["incident.status == ACTIVE"]
        side_effects:
          - "recompute population_at_risk"
          - "CASCADE: every Registrant r (r.zone_id==zone.id) with status==ADVISED -> REGISTERED (r.version +1)"
          - "increments Zone.version by 1"
      - from: MANDATORY
        to: RE_ENTRY_ALLOWED
        trigger: "POST /evac/zones/{id}/order {level: RE_ENTRY_ALLOWED}"
        actor: IncidentCommander
        preconditions: ["incident.status in {ACTIVE, ALL_CLEAR}"]
        side_effects:
          - "CASCADE: every Registrant r (r.zone_id==zone.id) with status in {ORDERED, SHELTERED} -> CLEARED_FOR_REENTRY (r.version +1)"
          - "increments Zone.version by 1"
      - from: VOLUNTARY
        to: RE_ENTRY_ALLOWED
        trigger: "system — Incident ACTIVE->ALL_CLEAR cascade (hop1)"
        actor: system
        preconditions: ["owning Incident is transitioning ACTIVE->ALL_CLEAR"]
        side_effects:
          - "CASCADE: every Registrant r (r.zone_id==zone.id) with status==ADVISED -> CLEARED_FOR_REENTRY (r.version +1)"
          - "increments Zone.version by 1"
        note: "System-only transition; there is no direct VOLUNTARY->RE_ENTRY_ALLOWED operator order."
      - from: RE_ENTRY_ALLOWED
        to: MANDATORY
        trigger: "POST /evac/zones/{id}/order {level: MANDATORY}"
        actor: IncidentCommander
        preconditions: ["incident.status == ACTIVE (else ERR_INCIDENT_NOT_ACTIVE)"]
        side_effects:
          - "CASCADE (compensation): every AccessCredential c (c.zone_id==zone.id) with status==ACTIVE -> SUSPENDED (c.version +1)"
          - "CASCADE: every Registrant r with status==CLEARED_FOR_REENTRY -> ORDERED (r.version +1)"
          - "increments Zone.version by 1"
        note: "Re-evacuation loop — RE_ENTRY_ALLOWED back to MANDATORY makes the machine cyclic."

  - entity: Shelter
    initial_state: STANDBY
    terminal_states: [CLOSED]
    transitions:
      - from: STANDBY
        to: OPEN
        trigger: "POST /evac/shelters/{id}/status {state: OPEN}"
        actor: ShelterCoordinator
        preconditions: ["staffed_capacity_now > 0 (at least one SCHEDULED StaffShift covers the current clock) else ERR_INVALID_STATE"]
        side_effects: ["increments Shelter.version by 1"]
      - from: OPEN
        to: FULL
        trigger: "system — evaluated after a check-in"
        actor: system
        preconditions: ["occupied_beds >= effective_capacity"]
        side_effects: ["increments Shelter.version by 1"]
        note: "Boundary: FULL fires at occupied_beds == effective_capacity (>=), not strictly greater."
      - from: FULL
        to: OPEN
        trigger: "system — evaluated after a check-out or RESERVED cancel"
        actor: system
        preconditions: ["occupied_beds < effective_capacity"]
        side_effects: ["increments Shelter.version by 1"]
      - from: STANDBY
        to: CLOSED
        trigger: "POST /evac/shelters/{id}/status {state: CLOSED}"
        actor: ShelterCoordinator
        preconditions: ["shelter.status == STANDBY"]
        side_effects: ["increments Shelter.version by 1"]
      - from: OPEN
        to: CLOSED
        trigger: "POST /evac/shelters/{id}/status {state: CLOSED}"
        actor: ShelterCoordinator
        preconditions: ["no ShelterAssignment on this shelter in status CHECKED_IN (else ERR_INVALID_STATE)"]
        side_effects:
          - "every RESERVED ShelterAssignment on this shelter -> CANCELLED releasing reserved_beds (and clearing its Registrant.current_assignment_id)"
          - "increments Shelter.version by 1"

  - entity: StaffShift
    initial_state: SCHEDULED
    terminal_states: [CANCELLED]
    transitions:
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /evac/staff-shifts/{id}/cancel"
        actor: ShelterCoordinator
        preconditions: ["staff_shift.status == SCHEDULED"]
        side_effects:
          - "recompute parent Shelter.staffed_capacity_now and effective_capacity"
          - "increments StaffShift.version by 1"

  - entity: EvacuationRoute
    initial_state: PLANNED
    terminal_states: [CLOSED]
    transitions:
      - from: PLANNED
        to: OPEN
        trigger: "POST /evac/routes/{id}/status {state: OPEN}"
        actor: TrafficManager
        preconditions: ["incident.status == ACTIVE (else ERR_INCIDENT_NOT_ACTIVE)"]
        side_effects: ["increments EvacuationRoute.version by 1"]
      - from: OPEN
        to: CONGESTED
        trigger: "POST /evac/routes/{id}/status {state: CONGESTED}"
        actor: TrafficManager
        preconditions: ["route.status == OPEN"]
        side_effects: ["increments EvacuationRoute.version by 1"]
      - from: CONGESTED
        to: OPEN
        trigger: "POST /evac/routes/{id}/status {state: OPEN}"
        actor: TrafficManager
        preconditions: ["route.status == CONGESTED"]
        side_effects: ["increments EvacuationRoute.version by 1"]
      - from: OPEN
        to: CLOSED
        trigger: "POST /evac/routes/{id}/status {state: CLOSED}"
        actor: TrafficManager
        preconditions: ["route.status in {OPEN, CONGESTED}"]
        side_effects:
          - "every ContraflowSegment (segment.route_id==route.id) in {SCHEDULED, ACTIVE} -> CANCELLED (each ContraflowSegment.version +1)"
          - "increments EvacuationRoute.version by 1"
      - from: CONGESTED
        to: CLOSED
        trigger: "POST /evac/routes/{id}/status {state: CLOSED}"
        actor: TrafficManager
        preconditions: ["route.status in {OPEN, CONGESTED}"]
        side_effects:
          - "every ContraflowSegment (segment.route_id==route.id) in {SCHEDULED, ACTIVE} -> CANCELLED (each ContraflowSegment.version +1)"
          - "increments EvacuationRoute.version by 1"

  - entity: ContraflowSegment
    initial_state: SCHEDULED
    terminal_states: [CANCELLED, COMPLETED]
    transitions:
      - from: SCHEDULED
        to: ACTIVE
        trigger: "POST /evac/contraflow-segments/{id}/status {state: ACTIVE}"
        actor: TrafficManager
        preconditions:
          - "parent EvacuationRoute.status == OPEN (else ERR_ROUTE_NOT_OPEN)"
          - "window_start_utc <= now < window_end_utc (else ERR_INVALID_STATE)"
        side_effects: ["increments ContraflowSegment.version by 1"]
        note: "Cross-entity state dependency ContraflowSegment -> EvacuationRoute."
      - from: ACTIVE
        to: COMPLETED
        trigger: "system — when now >= window_end_utc"
        actor: system
        preconditions: ["now >= window_end_utc"]
        side_effects: ["increments ContraflowSegment.version by 1"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /evac/contraflow-segments/{id}/status {state: CANCELLED}"
        actor: TrafficManager
        preconditions: ["segment.status == SCHEDULED"]
        side_effects: ["increments ContraflowSegment.version by 1"]
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /evac/contraflow-segments/{id}/status {state: CANCELLED}"
        actor: TrafficManager
        preconditions: ["segment.status == ACTIVE"]
        side_effects: ["increments ContraflowSegment.version by 1"]

  - entity: Registrant
    initial_state: REGISTERED
    terminal_states: []
    transitions:
      - from: REGISTERED
        to: ADVISED
        trigger: "system — Zone NONE->VOLUNTARY cascade (or created into a VOLUNTARY zone)"
        actor: system
        preconditions: ["owning Zone.order_level == VOLUNTARY"]
        side_effects: ["increments Registrant.version by 1"]
      - from: REGISTERED
        to: ORDERED
        trigger: "system — Zone ->MANDATORY cascade (or created into a MANDATORY zone)"
        actor: system
        preconditions: ["owning Zone.order_level == MANDATORY"]
        side_effects: ["increments Registrant.version by 1"]
      - from: ADVISED
        to: ORDERED
        trigger: "system — Zone VOLUNTARY->MANDATORY cascade"
        actor: system
        preconditions: ["owning Zone.order_level == MANDATORY"]
        side_effects: ["increments Registrant.version by 1"]
      - from: ORDERED
        to: SHELTERED
        trigger: "system — the household's ShelterAssignment becomes CHECKED_IN"
        actor: system
        preconditions: ["current_assignment_id's ShelterAssignment.status == CHECKED_IN"]
        side_effects: ["increments Registrant.version by 1"]
      - from: ORDERED
        to: CLEARED_FOR_REENTRY
        trigger: "system — Zone MANDATORY->RE_ENTRY_ALLOWED cascade"
        actor: system
        preconditions: ["owning Zone.order_level == RE_ENTRY_ALLOWED"]
        side_effects: ["increments Registrant.version by 1"]
      - from: SHELTERED
        to: CLEARED_FOR_REENTRY
        trigger: "system — Zone MANDATORY->RE_ENTRY_ALLOWED cascade"
        actor: system
        preconditions: ["owning Zone.order_level == RE_ENTRY_ALLOWED"]
        side_effects: ["increments Registrant.version by 1"]
      - from: ADVISED
        to: REGISTERED
        trigger: "system — Zone VOLUNTARY->NONE rescind cascade"
        actor: system
        preconditions: ["owning Zone.order_level == NONE"]
        side_effects: ["increments Registrant.version by 1"]
      - from: ORDERED
        to: ADVISED
        trigger: "system — Zone MANDATORY->VOLUNTARY downgrade cascade"
        actor: system
        preconditions: ["owning Zone.order_level == VOLUNTARY"]
        side_effects: ["increments Registrant.version by 1"]
      - from: CLEARED_FOR_REENTRY
        to: ORDERED
        trigger: "system — Zone RE_ENTRY_ALLOWED->MANDATORY re-evacuation cascade"
        actor: system
        preconditions: ["owning Zone.order_level == MANDATORY"]
        side_effects: ["increments Registrant.version by 1"]

  - entity: ShelterAssignment
    initial_state: RESERVED
    terminal_states: [CHECKED_OUT, CANCELLED]
    transitions:
      - from: RESERVED
        to: CHECKED_IN
        trigger: "POST /evac/shelter-assignments/{id}/status {action: CHECK_IN} (or system via Zone MANDATORY cascade)"
        actor: ShelterCoordinator
        preconditions:
          - "parent Shelter.status != CLOSED (else ERR_SHELTER_CLOSED)"
          - "parent Shelter.status == OPEN (STANDBY -> ERR_SHELTER_NOT_OPEN)"
          - "assignment.status == RESERVED (else ERR_INVALID_STATE)"
          - "SAFETY: if Registrant.functional_needs in {MEDICAL_ELECTRICITY, OXYGEN} then Shelter.power_backup == true (else ERR_SHELTER_NOT_POWER_CAPABLE)"
          - "FISCAL: occupied_beds + assignment.party_size <= effective_capacity (else ERR_SHELTER_CAPACITY_EXCEEDED)"
        side_effects:
          - "occupied_beds += party_size; reserved_beds -= party_size; set checked_in_at = now"
          - "owning Registrant -> SHELTERED (registrant.version +1)"
          - "if occupied_beds >= effective_capacity, Shelter OPEN -> FULL (shelter.version +1)"
          - "increments ShelterAssignment.version by 1"
      - from: CHECKED_IN
        to: CHECKED_OUT
        trigger: "POST /evac/shelter-assignments/{id}/status {action: CHECK_OUT}"
        actor: ShelterCoordinator
        preconditions: ["assignment.status == CHECKED_IN"]
        side_effects:
          - "occupied_beds -= party_size; clear Registrant.current_assignment_id"
          - "if Shelter.status == FULL and occupied_beds < effective_capacity, Shelter FULL -> OPEN (shelter.version +1)"
          - "increments ShelterAssignment.version by 1"
      - from: RESERVED
        to: CANCELLED
        trigger: "POST /evac/shelter-assignments/{id}/status {action: CANCEL}"
        actor: ShelterCoordinator
        preconditions: ["assignment.status == RESERVED"]
        side_effects:
          - "reserved_beds -= party_size; clear Registrant.current_assignment_id"
          - "increments ShelterAssignment.version by 1"

  - entity: AccessCredential
    initial_state: ISSUED
    terminal_states: [EXPIRED, REVOKED]
    transitions:
      - from: ISSUED
        to: ACTIVE
        trigger: "POST /evac/access-credentials/{id}/status {state: ACTIVE} (or system via Incident all-clear / Zone re-entry cascade)"
        actor: Registrar
        preconditions:
          - "owning Zone.order_level == RE_ENTRY_ALLOWED (else ERR_ZONE_NOT_REENTRY)"
          - "valid_from_utc <= now < valid_until_utc (else ERR_CREDENTIAL_WINDOW_INVALID)"
        side_effects: ["increments AccessCredential.version by 1"]
        note: "Cross-entity state dependency AccessCredential -> Zone."
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system — Zone RE_ENTRY_ALLOWED->MANDATORY re-evacuation cascade"
        actor: system
        preconditions: ["owning Zone.order_level == MANDATORY"]
        side_effects: ["increments AccessCredential.version by 1"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /evac/access-credentials/{id}/status {state: ACTIVE}"
        actor: Registrar
        preconditions:
          - "owning Zone.order_level == RE_ENTRY_ALLOWED (else ERR_ZONE_NOT_REENTRY)"
          - "valid_from_utc <= now < valid_until_utc (else ERR_CREDENTIAL_WINDOW_INVALID)"
        side_effects: ["increments AccessCredential.version by 1"]
      - from: ISSUED
        to: EXPIRED
        trigger: "system — when now >= valid_until_utc"
        actor: system
        preconditions: ["now >= valid_until_utc"]
        side_effects: ["increments AccessCredential.version by 1"]
      - from: ACTIVE
        to: EXPIRED
        trigger: "system — when now >= valid_until_utc"
        actor: system
        preconditions: ["now >= valid_until_utc"]
        side_effects: ["increments AccessCredential.version by 1"]
      - from: ISSUED
        to: REVOKED
        trigger: "POST /evac/access-credentials/{id}/status {state: REVOKED}"
        actor: Registrar
        preconditions: ["credential.status in {ISSUED, ACTIVE, SUSPENDED}"]
        side_effects: ["increments AccessCredential.version by 1"]
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /evac/access-credentials/{id}/status {state: REVOKED}"
        actor: Registrar
        preconditions: ["credential.status in {ISSUED, ACTIVE, SUSPENDED}"]
        side_effects: ["increments AccessCredential.version by 1"]

  - entity: AlertDispatch
    initial_state: DRAFT
    terminal_states: [SENT, PARTIAL, FAILED, CANCELLED]
    transitions:
      - from: DRAFT
        to: QUEUED
        trigger: "POST /evac/alerts/{id}/status {state: QUEUED}"
        actor: PublicInfoOfficer
        preconditions:
          - "alert.overall_status == DRAFT"
          - "if 'IPAWS' in channels: count(AlertDispatch a where a.zone_id in incident zones and 'IPAWS' in a.channels and a.overall_status in {QUEUED, SENT, PARTIAL}) < incident.ipaws_daily_slot_budget (else ERR_IPAWS_SLOTS_EXHAUSTED)"
        side_effects:
          - "if 'IPAWS' in channels, this row now counts toward incident.ipaws_slots_reserved (QUEUED)"
          - "increments AlertDispatch.version by 1"
      - from: QUEUED
        to: SENT
        trigger: "system — evaluated after a POST /evac/alerts/{id}/channel-result when all PENDING channels have resolved SENT"
        actor: system
        preconditions: ["every channel in channels has status == SENT"]
        side_effects: ["release IPAWS QUEUED reservation (no longer counts toward ipaws_slots_reserved)", "increments AlertDispatch.version by 1"]
      - from: QUEUED
        to: PARTIAL
        trigger: "system — evaluated after a channel-result when all PENDING channels resolved with a mix of SENT and FAILED"
        actor: system
        preconditions: ["every requested channel resolved; at least one SENT and at least one FAILED"]
        side_effects: ["release IPAWS QUEUED reservation", "increments AlertDispatch.version by 1"]
      - from: QUEUED
        to: FAILED
        trigger: "system — evaluated after a channel-result when all requested channels resolved FAILED"
        actor: system
        preconditions: ["every requested channel resolved FAILED"]
        side_effects: ["release IPAWS QUEUED reservation", "increments AlertDispatch.version by 1"]
      - from: QUEUED
        to: CANCELLED
        trigger: "POST /evac/alerts/{id}/status {state: CANCELLED}"
        actor: PublicInfoOfficer
        preconditions: ["alert.overall_status == QUEUED"]
        side_effects:
          - "release IPAWS QUEUED reservation (compensation — restores incident.ipaws_slots_reserved to its pre-queue value)"
          - "increments AlertDispatch.version by 1"
    note: |
      Parallel dimensions: wea_status, eas_status, ipaws_status, sms_status each
      advance independently PENDING->SENT|FAILED via POST /evac/alerts/{id}/channel-result
      {channel, result}. overall_status is the rollup: it can only leave QUEUED once
      every requested channel has resolved.

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: assignment-create-stale-registrant
    parent_entity: Registrant
    write_endpoint: "POST /evac/shelter-assignments"
    occ_field: "expected_registrant_version"
    description: |
      Creating a ShelterAssignment for a Registrant supersedes that
      registrant's prior active assignment: the new placement replaces the old
      one and the old RESERVED reservation is released. A create whose
      expected_registrant_version no longer equals the Registrant's current
      version is rejected — the client's view is stale because another
      placement has already advanced the registrant and released/redirected its
      beds. Resolved purely by comparing the submitted version to the stored
      Registrant.version; no wall-clock or ordering assumptions.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: zone_population_at_risk
    trigger: "Zone creation; POST /evac/zones/{id}/order; POST /evac/_clock/set_current_utc; any read of Zone"
    algorithm: forward_looking
    formula: |
      hour = UTC hour-of-day of the current logical clock (integer 0..23)
      is_daytime = (6 <= hour < 18)
      if is_daytime:
        population_at_risk = round_half_up(residential_population * daytime_occupancy_factor + transient_population)
      else:
        population_at_risk = round_half_up(residential_population * nighttime_occupancy_factor)
    input_set: "A single Zone; depends only on that zone's own fields and the logical clock hour"
    constants: {}
    precision: "integer, round_half_up at 0 decimal places"
    variants:
      - name: DAYTIME
        when: "logical clock hour-of-day in [6, 18)"
        difference: "includes transient_population and uses daytime_occupancy_factor"
      - name: NIGHTTIME
        when: "logical clock hour-of-day outside [6, 18)"
        difference: "excludes transient_population entirely and uses nighttime_occupancy_factor"

  - name: shelter_effective_capacity
    trigger: "Any read of Shelter; ShelterAssignment CHECK_IN; StaffShift create/cancel; POST /evac/_clock/set_current_utc"
    algorithm: constraint_propagation
    formula: |
      staffed_now = sum(s.staffed_beds for StaffShift s
                        where s.shelter_id == shelter.id
                          and s.status == SCHEDULED
                          and s.start_utc <= now <= s.end_utc)
      base = min(physical_capacity, staffed_now)
      ada_reserved_beds = ceil(base * ada_reserved_pct)
      effective_capacity = max(0, base - ada_reserved_beds)
    input_set: "One Shelter, its SCHEDULED StaffShifts covering the clock, and three numeric inputs (physical_capacity, staffed_now, ada_reserved_pct)"
    constants: {}
    precision: "integer; ceil() on ada_reserved_beds; max(0, .) floor"
    note: "Combinatorial mode (a): >=3 inputs with nested min/max and a conditional ceil reservation."

  - name: shelter_available_capacity
    trigger: "Any read of Shelter; ShelterAssignment create / CHECK_IN / CHECK_OUT / CANCEL"
    algorithm: aggregation
    formula: |
      reserved_beds = sum(a.party_size for ShelterAssignment a where a.shelter_id==shelter.id and a.status==RESERVED)
      occupied_beds = sum(a.party_size for ShelterAssignment a where a.shelter_id==shelter.id and a.status==CHECKED_IN)
      provisional_available = effective_capacity - reserved_beds - occupied_beds
      confirmed_available    = effective_capacity - occupied_beds
    input_set: "One Shelter; its ShelterAssignments filtered by status RESERVED and CHECKED_IN"
    constants: {}
    precision: "integer"
    variants:
      - name: PROVISIONAL
        when: "deciding whether a NEW reservation fits (planning view)"
        difference: "subtracts BOTH reserved_beds and occupied_beds"
      - name: CONFIRMED
        when: "physical occupancy accounting (who is actually inside)"
        difference: "subtracts ONLY occupied_beds; ignores RESERVED"

  - name: evacuation_clearance_time
    trigger: "Any read of Incident (populates clearance_estimate_minutes)"
    algorithm: aggregation
    formula: |
      # Rounding order is PINNED: ceil per-zone vehicle count, THEN sum, THEN final ceil on minutes.
      total_vehicles = 0
      for each Zone z where z.incident_id==incident.id and z.order_level in {VOLUNTARY, MANDATORY}:
          total_vehicles += ceil(z.population_at_risk / AVG_VEHICLE_OCCUPANCY)      # per-zone ceil
      total_throughput_vph = sum(r.throughput_vph for EvacuationRoute r
                                 where r.incident_id==incident.id and r.status in {OPEN, CONGESTED})
      if total_throughput_vph == 0:
          clearance_estimate_minutes = null
      else:
          clearance_estimate_minutes = ceil( (total_vehicles / total_throughput_vph) * 60 )
    input_set: "Zones under VOLUNTARY/MANDATORY order and EvacuationRoutes in OPEN/CONGESTED for this incident"
    constants: { AVG_VEHICLE_OCCUPANCY: 2.5 }
    precision: "ceil per zone (integer vehicles) -> integer sum -> ceil() minutes. The alternative order (sum populations then divide) yields a different value and is explicitly NOT used."
    note: "Combinatorial mode (b): result depends on the pinned per-zone-then-sum rounding order."

  - name: incident_ipaws_slots_reserved
    trigger: "AlertDispatch DRAFT->QUEUED; QUEUED->CANCELLED; QUEUED->SENT/PARTIAL/FAILED"
    algorithm: aggregation
    formula: |
      ipaws_slots_reserved = count(AlertDispatch a
                                   where a.zone_id in {z.id : z.incident_id==incident.id}
                                     and 'IPAWS' in a.channels
                                     and a.overall_status == QUEUED)
    input_set: "AlertDispatch rows for the incident's zones with IPAWS channel and overall_status == QUEUED"
    constants: {}
    precision: "integer count"
    note: "Conserved quantity for compensating invariant: DRAFT->QUEUED adds exactly 1, QUEUED->CANCELLED subtracts exactly 1, so queue+cancel nets to zero."

  - name: shelter_reserved_bed_conservation
    trigger: "ShelterAssignment create; ShelterAssignment CHECK_IN / CHECK_OUT / CANCEL"
    algorithm: aggregation
    formula: |
      reserved_beds = sum(a.party_size for ShelterAssignment a
                          where a.shelter_id==shelter.id and a.status==RESERVED)
    input_set: "One Shelter; its RESERVED ShelterAssignments"
    constants: {}
    precision: "integer"
    note: "Conserved quantity: creating a RESERVED assignment adds party_size to reserved_beds; cancelling it from RESERVED subtracts exactly the same party_size, leaving reserved_beds unchanged across the create+cancel pair."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; lower number wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_USER_CONTEXT
    http_status: 400
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role is permitted to perform this operation per §1.7"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Every resource id in the path exists (validated left-to-right)"
    error_id: "ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 4
    category: existence
    check: "Every FK in the request body references an existing resource"
    error_id: "ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: "POST /evac/zones, /evac/shelters, /evac/staff-shifts, /evac/routes, /evac/contraflow-segments, /evac/registrants, /evac/shelter-assignments, /evac/access-credentials, /evac/alerts"

  - priority: 5
    category: state
    check: "OCC — when expected_registrant_version is provided it must equal the current Registrant.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /evac/shelter-assignments"
    note: "Checked before business logic; see §1.2.1."

  - priority: 6
    category: business_constraint
    check: "Required body fields present and each field's type/range/enum membership valid"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all POST endpoints"

  - priority: 7
    category: business_constraint
    check: "Enum-typed fields carry a declared member; array channels is a non-empty subset of [WEA,EAS,IPAWS,SMS]"
    error_id: ERR_INVALID_ENUM
    http_status: 422
    applies_to: "all POST endpoints with enum/array inputs"

  - priority: 8
    category: state
    check: "Incident must be ACTIVE for the operation (issuing a VOLUNTARY/MANDATORY/RE_ENTRY_ALLOWED zone order, opening a route, re-evacuating)"
    error_id: ERR_INCIDENT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /evac/zones/{id}/order, POST /evac/routes/{id}/status"

  - priority: 9
    category: state
    check: "Requested zone order transition is legal from the zone's current order_level"
    error_id: ERR_INVALID_ORDER_TRANSITION
    http_status: 409
    applies_to: "POST /evac/zones/{id}/order"

  - priority: 10
    category: state
    check: "Incident all-clear is blocked while any zone is still MANDATORY"
    error_id: ERR_ALL_CLEAR_BLOCKED
    http_status: 409
    applies_to: "POST /evac/incidents/{id}/phase"

  - priority: 11
    category: state
    check: "Shelter is not CLOSED for a check-in"
    error_id: ERR_SHELTER_CLOSED
    http_status: 409
    applies_to: "POST /evac/shelter-assignments/{id}/status"

  - priority: 12
    category: state
    check: "Shelter is OPEN (not STANDBY) for a check-in"
    error_id: ERR_SHELTER_NOT_OPEN
    http_status: 409
    applies_to: "POST /evac/shelter-assignments/{id}/status"

  - priority: 13
    category: state
    check: "Generic transition legality — target resource is in a state from which the requested transition is defined (assignment not RESERVED for CHECK_IN, credential/alert/route/contraflow/shelter/staff-shift invalid from-state)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 14
    category: state
    check: "AccessCredential activation requires the owning Zone.order_level == RE_ENTRY_ALLOWED"
    error_id: ERR_ZONE_NOT_REENTRY
    http_status: 409
    applies_to: "POST /evac/access-credentials/{id}/status"

  - priority: 15
    category: state
    check: "ContraflowSegment activation requires the parent EvacuationRoute.status == OPEN"
    error_id: ERR_ROUTE_NOT_OPEN
    http_status: 409
    applies_to: "POST /evac/contraflow-segments/{id}/status"

  - priority: 16
    category: business_referential
    check: "ShelterAssignment create requires the Registrant's owning Zone.order_level in {VOLUNTARY, MANDATORY}"
    error_id: ERR_ZONE_NOT_UNDER_ORDER
    http_status: 409
    applies_to: "POST /evac/shelter-assignments"

  - priority: 17
    category: business_safety
    check: "Check-in of a Registrant with functional_needs in {MEDICAL_ELECTRICITY, OXYGEN} requires Shelter.power_backup == true"
    error_id: ERR_SHELTER_NOT_POWER_CAPABLE
    http_status: 409
    applies_to: "POST /evac/shelter-assignments/{id}/status"

  - priority: 18
    category: business_temporal
    check: "Two SCHEDULED StaffShifts on the same shelter must be at least MIN_HANDOVER_BUFFER_MIN (30) minutes apart: next.start_utc - prev.end_utc >= 30min (closed intervals + buffer)"
    error_id: ERR_STAFF_SHIFT_OVERLAP
    http_status: 409
    applies_to: "POST /evac/staff-shifts"

  - priority: 19
    category: business_temporal
    check: "Two SCHEDULED/ACTIVE ContraflowSegments on the same route_id + segment_key must not overlap on half-open [window_start_utc, window_end_utc); adjacency (prev.end == next.start) is permitted"
    error_id: ERR_CONTRAFLOW_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /evac/contraflow-segments"

  - priority: 20
    category: business_temporal
    check: "AccessCredential activation requires valid_from_utc <= now < valid_until_utc"
    error_id: ERR_CREDENTIAL_WINDOW_INVALID
    http_status: 409
    applies_to: "POST /evac/access-credentials/{id}/status"

  - priority: 21
    category: business_fiscal
    check: "Check-in requires occupied_beds + party_size <= effective_capacity"
    error_id: ERR_SHELTER_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /evac/shelter-assignments/{id}/status"

  - priority: 22
    category: business_fiscal
    check: "Queuing an IPAWS-bearing alert requires the incident's IPAWS slot budget not be exhausted"
    error_id: ERR_IPAWS_SLOTS_EXHAUSTED
    http_status: 409
    applies_to: "POST /evac/alerts/{id}/status"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Logical clock (test-driving) ----------------------------------------
  - method: POST
    path: "/evac/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-03-01T00:00:00Z (before any set call the clock reads exactly this default, never real wall-clock time)."
    roles: [IncidentCommander]
    code: 200
    input: [to_iso8601]
    output: "null"
    side_effects: ["recompute clock-dependent fields (zone population_at_risk day/night, shelter staffed_capacity_now/effective_capacity)"]

  # ---- Incident ------------------------------------------------------------
  - method: POST
    path: "/evac/incidents"
    description: "Create an incident (DRAFT)"
    roles: [IncidentCommander]
    code: 201
    input: [name, jurisdiction, hazard_type, "ipaws_daily_slot_budget?"]
    output: Incident
    side_effects: []
  - method: GET
    path: "/evac/incidents/{id}"
    description: "Fetch an incident (includes computed ipaws_slots_reserved and clearance_estimate_minutes)"
    roles: [IncidentCommander, ShelterCoordinator, TrafficManager, Registrar, PublicInfoOfficer]
    code: 200
    input: []
    output: Incident
    side_effects: []
  - method: POST
    path: "/evac/incidents/{id}/phase"
    description: "Advance incident phase (ACTIVE / ALL_CLEAR / STOOD_DOWN)"
    roles: [IncidentCommander]
    code: 200
    input: [to_phase]
    output: Incident
    side_effects: ["ALL_CLEAR: cascade zones -> RE_ENTRY_ALLOWED -> activate credentials; STOOD_DOWN: close shelters, cancel RESERVED assignments"]

  # ---- Zone ----------------------------------------------------------------
  - method: POST
    path: "/evac/zones"
    description: "Create a zone under an incident"
    roles: [IncidentCommander]
    code: 201
    input: [incident_id, name, geofence_wkt, residential_population, "transient_population?", "daytime_occupancy_factor?", "nighttime_occupancy_factor?"]
    output: Zone
    side_effects: ["compute population_at_risk from the current clock"]
  - method: GET
    path: "/evac/zones/{id}"
    description: "Fetch a zone"
    roles: [IncidentCommander, ShelterCoordinator, TrafficManager, Registrar, PublicInfoOfficer]
    code: 200
    input: []
    output: Zone
    side_effects: []
  - method: GET
    path: "/evac/zones"
    description: "List zones, optionally filtered by incident_id (reverse-reachability for Zone.incident_id)"
    roles: [IncidentCommander, ShelterCoordinator, TrafficManager, Registrar, PublicInfoOfficer]
    code: 200
    input: ["incident_id?", "limit?", "offset?"]
    output: Zone[]
    side_effects: []
  - method: POST
    path: "/evac/zones/{id}/order"
    description: "Set the zone evacuation-order level (drives the cyclic Zone state machine)"
    roles: [IncidentCommander]
    code: 200
    input: [level]
    output: Zone
    side_effects: ["cascade to Registrants; on MANDATORY auto-check-in reserved households; recompute population_at_risk"]

  # ---- Shelter -------------------------------------------------------------
  - method: POST
    path: "/evac/shelters"
    description: "Create a shelter (STANDBY)"
    roles: [ShelterCoordinator]
    code: 201
    input: [incident_id, name, physical_capacity, "ada_reserved_pct?", "power_backup?"]
    output: Shelter
    side_effects: []
  - method: GET
    path: "/evac/shelters/{id}"
    description: "Fetch a shelter (includes computed capacity fields)"
    roles: [IncidentCommander, ShelterCoordinator, TrafficManager, Registrar, PublicInfoOfficer]
    code: 200
    input: []
    output: Shelter
    side_effects: []
  - method: GET
    path: "/evac/shelters"
    description: "List shelters, optionally filtered by incident_id (reverse-reachability for Shelter.incident_id)"
    roles: [IncidentCommander, ShelterCoordinator, TrafficManager, Registrar, PublicInfoOfficer]
    code: 200
    input: ["incident_id?", "limit?", "offset?"]
    output: Shelter[]
    side_effects: []
  - method: POST
    path: "/evac/shelters/{id}/status"
    description: "Open or close a shelter"
    roles: [ShelterCoordinator]
    code: 200
    input: [state]
    output: Shelter
    side_effects: ["CLOSED: cancel RESERVED assignments releasing reserved_beds"]
  - method: GET
    path: "/evac/shelters/{id}/staff-shifts"
    description: "List a shelter's staff shifts (reverse-reachability for StaffShift.shelter_id)"
    roles: [IncidentCommander, ShelterCoordinator, TrafficManager, Registrar, PublicInfoOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: StaffShift[]
    side_effects: []

  # ---- StaffShift ----------------------------------------------------------
  - method: POST
    path: "/evac/staff-shifts"
    description: "Schedule a staffing shift on a shelter (buffered overlap-checked)"
    roles: [ShelterCoordinator]
    code: 201
    input: [shelter_id, role_label, staffed_beds, start_utc, end_utc]
    output: StaffShift
    side_effects: ["recompute parent Shelter.staffed_capacity_now / effective_capacity"]
  - method: POST
    path: "/evac/staff-shifts/{id}/cancel"
    description: "Cancel a scheduled staff shift"
    roles: [ShelterCoordinator]
    code: 200
    input: []
    output: StaffShift
    side_effects: ["recompute parent Shelter.staffed_capacity_now / effective_capacity"]

  # ---- EvacuationRoute -----------------------------------------------------
  - method: POST
    path: "/evac/routes"
    description: "Create an evacuation route (PLANNED)"
    roles: [TrafficManager]
    code: 201
    input: [incident_id, name, corridor_label, throughput_vph]
    output: EvacuationRoute
    side_effects: []
  - method: GET
    path: "/evac/routes/{id}"
    description: "Fetch a route"
    roles: [IncidentCommander, ShelterCoordinator, TrafficManager, Registrar, PublicInfoOfficer]
    code: 200
    input: []
    output: EvacuationRoute
    side_effects: []
  - method: GET
    path: "/evac/routes"
    description: "List routes, optionally filtered by incident_id (reverse-reachability for EvacuationRoute.incident_id)"
    roles: [IncidentCommander, ShelterCoordinator, TrafficManager, Registrar, PublicInfoOfficer]
    code: 200
    input: ["incident_id?", "limit?", "offset?"]
    output: EvacuationRoute[]
    side_effects: []
  - method: POST
    path: "/evac/routes/{id}/status"
    description: "Transition route posture (OPEN / CONGESTED / CLOSED)"
    roles: [TrafficManager]
    code: 200
    input: [state]
    output: EvacuationRoute
    side_effects: ["CLOSED: cancel this route's SCHEDULED/ACTIVE contraflow segments"]
  - method: GET
    path: "/evac/routes/{id}/contraflow-segments"
    description: "List a route's contraflow segments (reverse-reachability for ContraflowSegment.route_id)"
    roles: [IncidentCommander, ShelterCoordinator, TrafficManager, Registrar, PublicInfoOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: ContraflowSegment[]
    side_effects: []

  # ---- ContraflowSegment ---------------------------------------------------
  - method: POST
    path: "/evac/contraflow-segments"
    description: "Schedule a contraflow window on a route segment (overlap-checked, half-open)"
    roles: [TrafficManager]
    code: 201
    input: [route_id, segment_key, direction, window_start_utc, window_end_utc]
    output: ContraflowSegment
    side_effects: []
  - method: POST
    path: "/evac/contraflow-segments/{id}/status"
    description: "Activate or cancel a contraflow segment"
    roles: [TrafficManager]
    code: 200
    input: [state]
    output: ContraflowSegment
    side_effects: []

  # ---- Registrant ----------------------------------------------------------
  - method: POST
    path: "/evac/registrants"
    description: "Register a household (functional-needs registry) in a zone"
    roles: [Registrar]
    code: 201
    input: [zone_id, household_name, party_size, "functional_needs?", "transport_required?"]
    output: Registrant
    side_effects: ["initial status set from the owning zone's current order_level"]
  - method: GET
    path: "/evac/registrants/{id}"
    description: "Fetch a registrant"
    roles: [IncidentCommander, ShelterCoordinator, TrafficManager, Registrar, PublicInfoOfficer]
    code: 200
    input: []
    output: Registrant
    side_effects: []
  - method: GET
    path: "/evac/registrants"
    description: "List registrants, optionally filtered by zone_id (reverse-reachability for Registrant.zone_id)"
    roles: [IncidentCommander, ShelterCoordinator, TrafficManager, Registrar, PublicInfoOfficer]
    code: 200
    input: ["zone_id?", "limit?", "offset?"]
    output: Registrant[]
    side_effects: []

  # ---- ShelterAssignment ---------------------------------------------------
  - method: POST
    path: "/evac/shelter-assignments"
    description: "Reserve a shelter bed block for a household (supersedes any prior active assignment; OCC on Registrant.version)"
    roles: [ShelterCoordinator, Registrar]
    code: 201
    input: [registrant_id, shelter_id, expected_registrant_version]
    output: ShelterAssignment
    side_effects:
      - "copy party_size from Registrant; reserved_beds += party_size"
      - "supersede: if the Registrant already has a RESERVED/CHECKED_IN assignment, that assignment -> CANCELLED releasing its beds"
      - "set Registrant.current_assignment_id; increments Registrant.version by 1"
  - method: GET
    path: "/evac/shelter-assignments/{id}"
    description: "Fetch a shelter assignment"
    roles: [IncidentCommander, ShelterCoordinator, TrafficManager, Registrar, PublicInfoOfficer]
    code: 200
    input: []
    output: ShelterAssignment
    side_effects: []
  - method: GET
    path: "/evac/shelter-assignments"
    description: "List shelter assignments, filtered by registrant_id and/or shelter_id (reverse-reachability for both FKs)"
    roles: [IncidentCommander, ShelterCoordinator, TrafficManager, Registrar, PublicInfoOfficer]
    code: 200
    input: ["registrant_id?", "shelter_id?", "limit?", "offset?"]
    output: ShelterAssignment[]
    side_effects: []
  - method: POST
    path: "/evac/shelter-assignments/{id}/status"
    description: "Check in / check out / cancel an assignment"
    roles: [ShelterCoordinator]
    code: 200
    input: [action]
    output: ShelterAssignment
    side_effects: ["CHECK_IN: move party_size reserved->occupied, Registrant->SHELTERED, maybe Shelter->FULL; CHECK_OUT: release occupied, maybe FULL->OPEN; CANCEL: release reserved"]

  # ---- AccessCredential ----------------------------------------------------
  - method: POST
    path: "/evac/access-credentials"
    description: "Issue a re-entry access credential for a household in a zone"
    roles: [Registrar]
    code: 201
    input: [zone_id, registrant_id, credential_type, valid_from_utc, valid_until_utc]
    output: AccessCredential
    side_effects: []
  - method: GET
    path: "/evac/access-credentials/{id}"
    description: "Fetch an access credential"
    roles: [IncidentCommander, ShelterCoordinator, TrafficManager, Registrar, PublicInfoOfficer]
    code: 200
    input: []
    output: AccessCredential
    side_effects: []
  - method: GET
    path: "/evac/access-credentials"
    description: "List access credentials, filtered by zone_id and/or registrant_id (reverse-reachability for both FKs)"
    roles: [IncidentCommander, ShelterCoordinator, TrafficManager, Registrar, PublicInfoOfficer]
    code: 200
    input: ["zone_id?", "registrant_id?", "limit?", "offset?"]
    output: AccessCredential[]
    side_effects: []
  - method: POST
    path: "/evac/access-credentials/{id}/status"
    description: "Activate or revoke an access credential"
    roles: [Registrar]
    code: 200
    input: [state]
    output: AccessCredential
    side_effects: []

  # ---- AlertDispatch -------------------------------------------------------
  - method: POST
    path: "/evac/alerts"
    description: "Draft a multi-channel alert for a zone"
    roles: [PublicInfoOfficer]
    code: 201
    input: [zone_id, message, severity, channels]
    output: AlertDispatch
    side_effects: ["per-channel status = PENDING for requested channels else NA; overall_status = DRAFT"]
  - method: GET
    path: "/evac/alerts/{id}"
    description: "Fetch an alert dispatch (all four per-channel statuses + overall_status)"
    roles: [IncidentCommander, ShelterCoordinator, TrafficManager, Registrar, PublicInfoOfficer]
    code: 200
    input: []
    output: AlertDispatch
    side_effects: []
  - method: GET
    path: "/evac/alerts"
    description: "List alerts, optionally filtered by zone_id (reverse-reachability for AlertDispatch.zone_id)"
    roles: [IncidentCommander, ShelterCoordinator, TrafficManager, Registrar, PublicInfoOfficer]
    code: 200
    input: ["zone_id?", "limit?", "offset?"]
    output: AlertDispatch[]
    side_effects: []
  - method: POST
    path: "/evac/alerts/{id}/status"
    description: "Queue an alert (reserving an IPAWS slot when IPAWS is a channel) or cancel a queued alert (releasing the slot)"
    roles: [PublicInfoOfficer]
    code: 200
    input: [state]
    output: AlertDispatch
    side_effects: ["QUEUED: reserve IPAWS slot; CANCELLED: release IPAWS slot"]
  - method: POST
    path: "/evac/alerts/{id}/channel-result"
    description: "Record a per-channel delivery result (parallel dimension), possibly rolling overall_status to SENT/PARTIAL/FAILED"
    roles: [PublicInfoOfficer]
    code: 200
    input: [channel, result]
    output: AlertDispatch
    side_effects: ["set the named channel's status; if all requested channels resolved, roll overall_status and release IPAWS reservation"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_MISSING_USER_CONTEXT
    http: 400
    condition: "X-User-ID or X-User-Role header missing/malformed"
  - id: ERR_UNAUTHORIZED_ROLE
    http: 403
    condition: "Authenticated role may not perform this operation"
  - id: ERR_VALIDATION
    http: 400
    condition: "Missing required body field or type/range violation"
  - id: ERR_INVALID_ENUM
    http: 422
    condition: "Enum field carries a non-member value, or channels is empty / has an unknown channel"
  - id: ERR_INCIDENT_NOT_FOUND
    http: 404
    condition: "Referenced incident id does not exist"
  - id: ERR_ZONE_NOT_FOUND
    http: 404
    condition: "Referenced zone id does not exist"
  - id: ERR_SHELTER_NOT_FOUND
    http: 404
    condition: "Referenced shelter id does not exist"
  - id: ERR_STAFF_SHIFT_NOT_FOUND
    http: 404
    condition: "Referenced staff shift id does not exist"
  - id: ERR_ROUTE_NOT_FOUND
    http: 404
    condition: "Referenced route id does not exist"
  - id: ERR_CONTRAFLOW_NOT_FOUND
    http: 404
    condition: "Referenced contraflow segment id does not exist"
  - id: ERR_REGISTRANT_NOT_FOUND
    http: 404
    condition: "Referenced registrant id does not exist"
  - id: ERR_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "Referenced shelter assignment id does not exist"
  - id: ERR_CREDENTIAL_NOT_FOUND
    http: 404
    condition: "Referenced access credential id does not exist"
  - id: ERR_ALERT_NOT_FOUND
    http: 404
    condition: "Referenced alert dispatch id does not exist"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_registrant_version does not match the current Registrant.version (OCC supersede-create)"
  - id: ERR_INCIDENT_NOT_ACTIVE
    http: 409
    condition: "Operation requires incident.status == ACTIVE"
  - id: ERR_INVALID_ORDER_TRANSITION
    http: 409
    condition: "Requested zone order level is not reachable from the zone's current order_level"
  - id: ERR_ALL_CLEAR_BLOCKED
    http: 409
    condition: "All-clear attempted while at least one zone is MANDATORY"
  - id: ERR_SHELTER_CLOSED
    http: 409
    condition: "Check-in attempted against a CLOSED shelter"
  - id: ERR_SHELTER_NOT_OPEN
    http: 409
    condition: "Check-in attempted against a STANDBY shelter"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Requested transition is not defined from the resource's current state"
  - id: ERR_ZONE_NOT_REENTRY
    http: 409
    condition: "Credential activation requires the owning zone in RE_ENTRY_ALLOWED"
  - id: ERR_ROUTE_NOT_OPEN
    http: 409
    condition: "Contraflow activation requires the parent route in OPEN"
  - id: ERR_ZONE_NOT_UNDER_ORDER
    http: 409
    condition: "Shelter-assignment create requires the registrant's zone in VOLUNTARY or MANDATORY"
  - id: ERR_SHELTER_NOT_POWER_CAPABLE
    http: 409
    condition: "Electricity/oxygen-dependent registrant checked into a shelter lacking power_backup"
  - id: ERR_STAFF_SHIFT_OVERLAP
    http: 409
    condition: "New staff shift is within MIN_HANDOVER_BUFFER_MIN of an existing SCHEDULED shift on the same shelter"
  - id: ERR_CONTRAFLOW_WINDOW_OVERLAP
    http: 409
    condition: "New contraflow window overlaps an existing SCHEDULED/ACTIVE window on the same route_id + segment_key"
  - id: ERR_CREDENTIAL_WINDOW_INVALID
    http: 409
    condition: "Credential activation attempted outside [valid_from_utc, valid_until_utc)"
  - id: ERR_SHELTER_CAPACITY_EXCEEDED
    http: 409
    condition: "Check-in would push occupied_beds beyond effective_capacity"
  - id: ERR_IPAWS_SLOTS_EXHAUSTED
    http: 409
    condition: "Queuing an IPAWS-bearing alert exceeds the incident's ipaws_daily_slot_budget"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: IncidentCommander
    description: "Owns the incident lifecycle, zone evacuation orders, and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /evac/incidents"
      - "POST /evac/incidents/{id}/phase"
      - "POST /evac/zones"
      - "POST /evac/zones/{id}/order"
      - "POST /evac/_clock/set_current_utc"
    shared_operations:
      - "all GET reads"
  - name: ShelterCoordinator
    description: "Owns shelters, staffing, and shelter assignments"
    identity: opaque
    exclusive_operations:
      - "POST /evac/shelters"
      - "POST /evac/shelters/{id}/status"
      - "POST /evac/staff-shifts"
      - "POST /evac/staff-shifts/{id}/cancel"
      - "POST /evac/shelter-assignments/{id}/status"
    shared_operations:
      - "POST /evac/shelter-assignments (shared with Registrar)"
      - "all GET reads"
  - name: TrafficManager
    description: "Owns evacuation routes and contraflow scheduling"
    identity: opaque
    exclusive_operations:
      - "POST /evac/routes"
      - "POST /evac/routes/{id}/status"
      - "POST /evac/contraflow-segments"
      - "POST /evac/contraflow-segments/{id}/status"
    shared_operations:
      - "all GET reads"
  - name: Registrar
    description: "Owns the functional-needs registry and re-entry access credentials"
    identity: opaque
    exclusive_operations:
      - "POST /evac/registrants"
      - "POST /evac/access-credentials"
      - "POST /evac/access-credentials/{id}/status"
    shared_operations:
      - "POST /evac/shelter-assignments (shared with ShelterCoordinator)"
      - "all GET reads"
  - name: PublicInfoOfficer
    description: "Owns multi-channel alerting and IPAWS dispatch"
    identity: opaque
    exclusive_operations:
      - "POST /evac/alerts"
      - "POST /evac/alerts/{id}/status"
      - "POST /evac/alerts/{id}/channel-result"
    shared_operations:
      - "all GET reads"
