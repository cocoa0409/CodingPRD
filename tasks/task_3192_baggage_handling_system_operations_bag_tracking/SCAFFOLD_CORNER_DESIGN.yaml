              as: SortationAgent
            - call: "POST /baggage/bags/${bag}/load"
              payload: {}
              as: LoadAgent
          assert:
            - "Station.${st}.active_bag_count reads 1 in the acceptance response and is still 1 in the assign-makeup response"
            - "MakeupArea.${ma}.occupied_slots reads 1 in the assign-makeup response itself, without a follow-up GET"
            - "Flight.${f1}.loaded_bag_count reads 1 in the load response itself"
            - "MakeupArea.${ma}.occupied_slots drops to 0 in that same load response, because LOADED releases the slot"
            - "Station.${st}.active_bag_count is still 1 after the load, since LOADED remains a counted state"
            - "a GET of the station taken immediately afterwards returns the identical figures, so nothing was reconciled later"

      - name: invalid_transition_refusals_leave_every_derived_counter_untouched
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - errors[ERR_INVALID_STATE]
          - calculations.station_active_bag_count
          - calculations.flight_loaded_bag_count
        distinguishing_aspect: "A refused transition changes no derived counter at all — not the station population, not the flight load count, not the area occupancy — so the failure path is as immediately consistent as the success path."
        test_recipe:
          setup:
            - "clock 2026-09-01T07:00:00Z; station SEA with make-up area MA-3 of 2 slots and lane EDS-2; airline DL; flight DL1423 departs 15:00"
            - "bag B1 48 lb DOMESTIC cleanly screened, assigned to MA-3 and loaded so active_bag_count is 1 and flight loaded_bag_count is 1"
