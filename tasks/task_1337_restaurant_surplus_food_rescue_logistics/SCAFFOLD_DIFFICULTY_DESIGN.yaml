          setup:
            - "Donor D ACTIVE; agency AG cold capacity 100, committed 0; driver V1 ACTIVE certified window 2026-08-02T09:00-15:00Z; cooler C1 30L"
            - "Offer O COLD_HELD est 45 window 2026-08-02T10:00-12:00Z OPEN; clock 09:30Z"
