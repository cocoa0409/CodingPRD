              captures: { err_moq23: $.data.error_id }
          assert:
            - "qty-24 order: submit returns 200, payment_status == AUTHORIZED, quote_variant == PROVISIONAL"
            - "qty-23 order: 422 and err_moq23 == ERR_BELOW_MINIMUM_QUANTITY"
            - "CustomizationOrder.${order_moq_low}.payment_status stays UNPAID and quote_variant stays NONE"

      - name: slot_capacity_exact_fit_then_zero_available_waitlists
        grounds:
          - calculations.slot_capacity_ledger
          - state_machines.CustomizationOrder.schedule_status
          - errors.ERR_CAPACITY_EXCEEDED
        distinguishing_aspect: |
          Minutes metric via reserve-slot (different endpoint and metric than MOQ): a booking
          needing exactly the remaining capacity (40 == 40) is HELD and drives
          available_minutes to exactly 0; the next 2-minute booking does not fail but
          WAITLISTED — the boundary is '>= needed fits' with zero remaining.
        test_recipe:
          setup:
            - "Clock 2026-09-01T06:00:00Z. Line CUP10 (MOQ 1), standard drop, off-peak PAD slot P-2 2026-09-11 09:00-09:40 with capacity_minutes 40. Two submitted orders: qty 20 PAD (40 min) and qty 1 PAD (2 min)."
          setup_api_calls:
            - *d_clock_sep1
            - call: "POST /drinkware/product-lines"
              payload: { name: "Cup 10 oz", category: "DRINKWARE", base_sku: "CUP10", base_custom_price_cents: 2200, map_price_cents: 2799, min_custom_quantity: 1, warranty_months_lid: 24, warranty_months_insulation: 36, warranty_months_hardware: 12 }
              as: PlatformAdmin
              captures: { pl_bf: $.data.id }
            - call: "POST /drinkware/colorway-drops"
              payload: { product_line_id: "${pl_bf}", color_name: "White", pantone_code: "PMS White", drop_type: "STANDARD", total_units: 3000, dtc_reserved_units: 500, dealer_unit_price_cents: 1500, allocation_opens_at: "2026-09-05T00:00:00Z", allocation_closes_at: "2026-09-20T00:00:00Z", go_live_at: "2026-10-01T00:00:00Z", sales_end_at: "2026-12-31T00:00:00Z" }
              as: PlatformAdmin
              captures: { drop_bf: $.data.id }
            - call: "POST /drinkware/print-slots"
              payload: { station_code: "P-2", technology: "PAD", window_start: "2026-09-11T09:00:00Z", window_end: "2026-09-11T09:40:00Z", capacity_minutes: 40 }
              as: ProductionLead
              captures: { slot_bf: $.data.id }
            - call: "POST /drinkware/customization-orders"
              payload: { buyer_type: "INDIVIDUAL", buyer_ref: "buyer-fit20", product_line_id: "${pl_bf}", colorway_drop_id: "${drop_bf}", quantity: 20, declared_color_count: 1, declared_placement_count: 1, print_technology: "PAD", requested_ship_date: "2026-09-12T00:00:00Z" }
              as: Buyer
              as_user_id: "buyer-fit20"
              captures: { order_fit20: $.data.id }
            - call: "POST /drinkware/customization-orders"
              payload: { buyer_type: "INDIVIDUAL", buyer_ref: "buyer-fit1", product_line_id: "${pl_bf}", colorway_drop_id: "${drop_bf}", quantity: 1, declared_color_count: 1, declared_placement_count: 1, print_technology: "PAD", requested_ship_date: "2026-09-12T00:00:00Z" }
              as: Buyer
              as_user_id: "buyer-fit1"
              captures: { order_fit1: $.data.id }
            - call: "POST /drinkware/customization-orders/${order_fit20}/submit"
              payload: {}
              as: Buyer
              as_user_id: "buyer-fit20"
            - call: "POST /drinkware/customization-orders/${order_fit1}/submit"
              payload: {}
              as: Buyer
              as_user_id: "buyer-fit1"
          trigger:
            - call: "POST /drinkware/customization-orders/${order_fit20}/reserve-slot"
              payload: { slot_id: "${slot_bf}" }
              as: Buyer
              as_user_id: "buyer-fit20"
            - call: "POST /drinkware/customization-orders/${order_fit1}/reserve-slot"
              payload: { slot_id: "${slot_bf}" }
              as: Buyer
              as_user_id: "buyer-fit1"
          assert:
            - "20-unit order (needs exactly 40 min): reservation_status == HELD, schedule_status == RESERVED — exact fit is allowed"
            - "PrintSlot.${slot_bf}.booked_minutes == 40 and available_minutes == 0"
            - "1-unit order (needs 2 min > 0 remaining): reservation_status == WAITLISTED and schedule_status stays UNSCHEDULED (no partial booking)"
            - "PrintSlot.${slot_bf}.available_minutes stays 0 after the waitlisted attempt (invariant: capacity == booked + available)"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: start_production_requires_locked_slot
        grounds:
          - state_machines.CustomizationOrder.schedule_status
          - entities.CustomizationOrder.fields.slot_id
          - errors.ERR_SLOT_NOT_LOCKED
        distinguishing_aspect: |
          Entity pair CustomizationOrder -> PrintSlot: the order's CONFIRMED -> IN_PRODUCTION
          transition is gated on the SLOT's status being LOCKED, not on any order-local field;
          the same call fails with ERR_SLOT_NOT_LOCKED while the slot is OPEN and succeeds
          immediately after the slot locks.
        test_recipe:
          setup:
            - "Clock 2026-09-01T06:00:00Z. Line MUG14 (MOQ 5), standard drop, off-peak LASER slot L-3 capacity 120. Order qty 5 submitted and art-approved; reservation CONFIRMED."
          setup_api_calls:
            - *d_clock_sep1
            - call: "POST /drinkware/product-lines"
              payload: { name: "Mug 14 oz", category: "DRINKWARE", base_sku: "MUG14", base_custom_price_cents: 2600, map_price_cents: 3199, min_custom_quantity: 5, warranty_months_lid: 24, warranty_months_insulation: 36, warranty_months_hardware: 12 }
              as: PlatformAdmin
              captures: { pl_lp: $.data.id }
            - call: "POST /drinkware/colorway-drops"
              payload: { product_line_id: "${pl_lp}", color_name: "Black", pantone_code: "PMS Black", drop_type: "STANDARD", total_units: 3000, dtc_reserved_units: 500, dealer_unit_price_cents: 1700, allocation_opens_at: "2026-09-05T00:00:00Z", allocation_closes_at: "2026-09-20T00:00:00Z", go_live_at: "2026-10-01T00:00:00Z", sales_end_at: "2026-12-31T00:00:00Z" }
              as: PlatformAdmin
              captures: { drop_lp: $.data.id }
            - call: "POST /drinkware/print-slots"
              payload: { station_code: "L-3", technology: "LASER", window_start: "2026-09-14T09:00:00Z", window_end: "2026-09-14T11:00:00Z", capacity_minutes: 120 }
              as: ProductionLead
              captures: { slot_lp: $.data.id }
            - call: "POST /drinkware/customization-orders"
              payload: { buyer_type: "INDIVIDUAL", buyer_ref: "buyer-lock", product_line_id: "${pl_lp}", colorway_drop_id: "${drop_lp}", quantity: 5, declared_color_count: 1, declared_placement_count: 1, print_technology: "LASER", requested_ship_date: "2026-09-16T00:00:00Z" }
              as: Buyer
              as_user_id: "buyer-lock"
              captures: { order_lp: $.data.id }
            - call: "POST /drinkware/customization-orders/${order_lp}/submit"
              payload: {}
              as: Buyer
              as_user_id: "buyer-lock"
            - call: "POST /drinkware/customization-orders/${order_lp}/reserve-slot"
              payload: { slot_id: "${slot_lp}" }
              as: Buyer
              as_user_id: "buyer-lock"
            - call: "POST /drinkware/artwork-proofs"
              payload: { order_id: "${order_lp}", artwork_file_ref: "s3://art/lock-v1.ai", color_count: 1, placement_count: 1, pantone_codes: ["PMS Black"] }
              as: Buyer
              as_user_id: "buyer-lock"
              captures: { proof_lp: $.data.id }
            - call: "POST /drinkware/artwork-proofs/${proof_lp}/approve"
              payload: {}
              as: PrepressTech
              as_user_id: "pp-1"
          trigger:
            - call: "POST /drinkware/customization-orders/${order_lp}/start-production"
              payload: {}
              as: ProductionLead
              as_user_id: "pl-1"
              captures: { err_slot_open: $.data.error_id }
            - call: "POST /drinkware/print-slots/${slot_lp}/lock"
              payload: {}
              as: ProductionLead
              as_user_id: "pl-1"
            - call: "POST /drinkware/customization-orders/${order_lp}/start-production"
              payload: {}
              as: ProductionLead
              as_user_id: "pl-1"
          assert:
            - "first start-production: 409 and err_slot_open == ERR_SLOT_NOT_LOCKED (reservation CONFIRMED but slot still OPEN)"
            - "after POST /drinkware/print-slots/${slot_lp}/lock: slot status == LOCKED"
            - "second start-production: 200 and CustomizationOrder.${order_lp}.schedule_status == IN_PRODUCTION"
            - "the order's own fields were identical across both attempts — only the slot's state changed"

      - name: probation_dealer_blocked_from_allocation_request
        grounds:
          - state_machines.LaunchAllocation.REQUESTED
          - entities.LaunchAllocation.fields.dealer_id
          - errors.ERR_DEALER_NOT_AUTHORIZED
          - calculations.dealer_infraction_points
        distinguishing_aspect: |
          Entity pair LaunchAllocation -> Dealer (different pair than order->slot): allocation
          creation requires the DEALER's status == AUTHORIZED; a dealer sitting at exactly 8
          infraction points (PROBATION) is rejected with ERR_DEALER_NOT_AUTHORIZED even though
          the drop is open and the credit check would pass.
        test_recipe:
          setup:
            - "Dealer authorized, then two MAP_VIOLATION cases confirmed (4 + 4 = 8 points) -> PROBATION. Drop CANOPY-2 open for allocation at clock 2026-09-06 (pool 30, price 2000c)."
          setup_api_calls:
