# =============================================================================
# Scaffold: Drinkware Customization Program & Dealer Channel Management
# =============================================================================

scenario: |
  Drinkware Customization Program & Dealer Channel Management (YETI): customization order intake for corporate and individual buyers with artwork proofing, color matching and minimum quantities, laser and pad printing capacity scheduling with seasonal peaks around corporate gifting, dealer authorization requiring physical storefronts with brand presentation standards and pricing policies, unauthorized reseller detection and enforcement across online marketplaces, product line management across hard coolers, soft goods and drinkware with launch color drops and limited editions, warranty claim handling for lid, insulation and hardware failures with replacement policy, direct-to-consumer growth managed against dealer relationships, customization return policy where personalized goods cannot be restocked

domain_name: drinkware-customization-dealer-channel
api_prefix: /drinkware

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: quota_allocation        # print-station minutes + launch-drop unit pools
  secondary_archetype: compliance_audit      # dealer authorization + marketplace enforcement
  complexity_layers:
    - optimistic_concurrency                 # OCC on Dealer.version and ColorwayDrop.version
    - cascading_side_effects                 # enforcement -> standing -> allocation forfeit -> pool ledger
    - rate_threshold_triggers                # infraction-point thresholds, fraud-claim threshold
    - selector_policy                        # waitlist promotion + largest-remainder allocation
  entity_topology: flat                      # peer entities joined by FK references, no nested URLs
  state_machine_shape: parallel              # CustomizationOrder: artwork x schedule x payment x return axes
  relationship_patterns: [one_to_many, cross_aggregate]
  role_model: segregation_of_duties          # application inspector / docs reviewer / decider must differ
  consistency_model: immediate
  difficulty_calibration: beyond_expert      # density-first: 10 entities, deep coupling

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Dealer
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Registered business name" }
      - { name: storefront_address, type: string, source: input, description: "Physical storefront street address (authorization requires a brick-and-mortar location)" }
      - { name: region_code, type: string, source: input, description: "Sales territory code, e.g. TX-CT" }
      - { name: tier, type: enum, source: input, default: STANDARD, description: "STANDARD | PREMIER dealer tier", constraints: "enum: STANDARD | PREMIER" }
      - { name: credit_limit_cents, type: integer, source: input, default: 500000, description: "Wholesale credit ceiling", constraints: ">= 0" }
      - { name: sell_through_pct, type: number, source: input, description: "Trailing sell-through percentage 0..100 feeding allocation_score", constraints: "0 <= x <= 100" }
      - { name: tenure_years, type: integer, source: input, description: "Years as a dealer, feeding allocation_score", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "PENDING | AUTHORIZED | PROBATION | SUSPENDED | TERMINATED; starts PENDING", constraints: "initial PENDING" }
      - { name: storefront_verified, type: boolean, source: system, default: false, description: "True once an application with a PASSED site inspection is approved" }
      - { name: brand_presentation_score, type: integer, source: system, description: "Score 0..100 from the latest PASSED inspection; 0 until then" }
      - { name: infraction_points, type: integer, source: computed, description: "Sum of infraction_points over EnforcementCases with matched_dealer_id = this dealer, status CONFIRMED_VIOLATION, clock < infraction_expires_at" }
      - { name: outstanding_balance_cents, type: integer, source: computed, description: "Sum of allocated_units x unit_price_cents over this dealer's LaunchAllocations in status ALLOCATED" }
      - { name: allocation_score, type: number, source: computed, description: "Season-variant weighted score (see calculations.dealer_allocation_score), 2 decimals round_half_up" }

  - name: DealerApplication
    parent: null
    common_fields: true
    fields:
      - { name: dealer_id, type: string, source: input, description: "FK -> Dealer.id; the dealer being vetted" }
      - { name: has_physical_storefront, type: boolean, source: input, description: "Declared physical storefront; approval impossible without it" }
      - { name: storefront_sqft, type: integer, source: input, description: "Storefront square footage", constraints: "> 0" }
      - { name: document_refs, type: array, source: input, description: "Array of document reference strings (business license, resale certificate)" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | VETTING | APPROVED | REJECTED; starts SUBMITTED" }
      - { name: inspection_status, type: enum, source: system, description: "UNSCHEDULED | SCHEDULED | PASSED | FAILED; starts UNSCHEDULED" }
      - { name: docs_status, type: enum, source: system, description: "PENDING | VERIFIED | REJECTED; starts PENDING" }
      - { name: inspector_user_id, type: string, source: system, description: "FieldInspector X-User-ID who owns the site visit; null until scheduled" }
      - { name: inspection_window_start, type: datetime, source: system, description: "Site-visit window start (closed interval); null until scheduled" }
      - { name: inspection_window_end, type: datetime, source: system, description: "Site-visit window end (closed interval); null until scheduled" }
      - { name: brand_presentation_score, type: integer, source: system, description: "0..100 recorded at inspection; null until recorded" }
      - { name: inspection_recorded_by, type: string, source: system, description: "X-User-ID that recorded the inspection outcome (SoD input)" }
      - { name: docs_reviewed_by, type: string, source: system, description: "X-User-ID that verified documents (SoD input)" }
      - { name: decision_reason, type: string, source: system, description: "Free-text rationale captured at decide; null until decided" }

  - name: EnforcementCase
    parent: null
    common_fields: true
    fields:
      - { name: marketplace, type: enum, source: input, description: "AMAZON | EBAY | WALMART | OTHER marketplace where the listing was detected" }
      - { name: seller_handle, type: string, source: input, description: "Marketplace seller handle of the suspected unauthorized reseller" }
      - { name: listing_url, type: string, source: input, description: "URL of the detected listing" }
      - { name: matched_dealer_id, type: string, source: input, description: "FK -> Dealer.id; authorized dealer the listing is traced to; null when unattributed", constraints: "optional, nullable" }
      - { name: status, type: enum, source: system, description: "UNDER_REVIEW | ESCALATED_LEGAL | CONFIRMED_VIOLATION | DISMISSED | OVERTURNED; starts UNDER_REVIEW" }
      - { name: infraction_category, type: enum, source: system, description: "MAP_VIOLATION | UNAUTHORIZED_MARKETPLACE | BRAND_STANDARD | CHANNEL_DIVERSION; set at confirm; null otherwise" }
      - { name: infraction_points, type: integer, source: system, description: "Points from INFRACTION_POINTS table; 0 unless confirmed against a matched dealer" }
      - { name: infraction_issued_at, type: datetime, source: system, description: "Logical-clock timestamp of confirmation; null until confirmed" }
      - { name: infraction_expires_at, type: datetime, source: computed, description: "infraction_issued_at + 365 days; null until confirmed" }
      - { name: infraction_state, type: enum, source: computed, description: "NONE | ACTIVE | EXPIRED | OVERTURNED derived from status + clock vs infraction_expires_at" }
      - { name: resolution_notes, type: string, source: system, description: "Notes captured at resolve/overturn; null until then" }

  - name: ProductLine
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Display name, e.g. Rambler 20 oz Tumbler" }
      - { name: category, type: enum, source: input, description: "HARD_COOLER | SOFT_GOOD | DRINKWARE" }
      - { name: base_sku, type: string, source: input, description: "Canonical SKU root; unique across product lines" }
      - { name: base_custom_price_cents, type: integer, source: input, description: "Customization unit base price", constraints: "> 0" }
      - { name: map_price_cents, type: integer, source: input, description: "Minimum advertised price dealers must honor", constraints: "> 0" }
      - { name: min_custom_quantity, type: integer, source: input, description: "Minimum order quantity for customization orders on this line", constraints: ">= 1" }
      - { name: warranty_months_lid, type: integer, source: input, description: "Warranty months for LID component failures", constraints: "> 0" }
      - { name: warranty_months_insulation, type: integer, source: input, description: "Warranty months for INSULATION component failures", constraints: "> 0" }
      - { name: warranty_months_hardware, type: integer, source: input, description: "Warranty months for HARDWARE component failures", constraints: "> 0" }
      - { name: status, type: enum, source: system, description: "ACTIVE | DISCONTINUED; starts ACTIVE" }

  - name: ColorwayDrop
    parent: null
    common_fields: true
    fields:
      - { name: product_line_id, type: string, source: input, description: "FK -> ProductLine.id; line this colorway belongs to" }
      - { name: color_name, type: string, source: input, description: "Marketing color name, e.g. Rescue Red" }
      - { name: pantone_code, type: string, source: input, description: "Pantone reference used for customization color matching" }
      - { name: drop_type, type: enum, source: input, description: "STANDARD | LIMITED_EDITION" }
      - { name: total_units, type: integer, source: input, description: "Total manufactured units in the drop", constraints: "> 0" }
      - { name: dtc_reserved_units, type: integer, source: input, description: "Units reserved for the direct-to-consumer channel; dealer pool is total minus this", constraints: "0 <= x <= total_units" }
      - { name: dealer_unit_price_cents, type: integer, source: input, description: "Wholesale unit price charged to dealers", constraints: "> 0" }
      - { name: allocation_opens_at, type: datetime, source: input, description: "Start of the dealer allocation-request window" }
      - { name: allocation_closes_at, type: datetime, source: input, description: "End of the allocation-request window; locking allowed at or after this instant" }
      - { name: go_live_at, type: datetime, source: input, description: "Instant the drop goes on sale (status flips ALLOCATION_LOCKED -> LIVE)" }
      - { name: sales_end_at, type: datetime, source: input, description: "Instant the drop closes (LIVE -> CLOSED)" }
      - { name: status, type: enum, source: system, description: "ANNOUNCED | ALLOCATION_OPEN | ALLOCATION_LOCKED | LIVE | CLOSED; starts ANNOUNCED; LIVE/CLOSED are lazy clock-driven transitions evaluated on every read or write" }
      - { name: dealer_committed_units, type: integer, source: computed, description: "Sum of allocated_units over LaunchAllocations in status ALLOCATED for this drop" }
      - { name: warranty_reserved_units, type: integer, source: computed, description: "Count of WarrantyClaims in APPROVED_REPLACEMENT with replacement_colorway_resolution SAME_COLORWAY tied to this drop" }
      - { name: unallocated_units, type: integer, source: computed, description: "total_units - dtc_reserved_units - dealer_committed_units - warranty_reserved_units" }

  - name: LaunchAllocation
    parent: null
    common_fields: true
    fields:
      - { name: dealer_id, type: string, source: input, description: "FK -> Dealer.id; requesting dealer (must equal acting Dealer identity)" }
      - { name: drop_id, type: string, source: input, description: "FK -> ColorwayDrop.id" }
      - { name: requested_units, type: integer, source: input, description: "Units requested by the dealer", constraints: ">= 1" }
      - { name: unit_price_cents, type: integer, source: system, description: "Snapshot of drop.dealer_unit_price_cents at request time" }
      - { name: allocated_units, type: integer, source: computed, description: "Units granted at lock-allocation; 0 until then" }
      - { name: status, type: enum, source: system, description: "REQUESTED | ALLOCATED | EXPIRED | FORFEITED; starts REQUESTED" }
      - { name: forfeit_reason, type: enum, source: system, description: "DEALER_CHOICE | DEALER_SUSPENDED | DEALER_TERMINATED; null until forfeited" }

  - name: CustomizationOrder
    parent: null
    common_fields: true
    fields:
      - { name: buyer_type, type: enum, source: input, description: "CORPORATE | INDIVIDUAL" }
      - { name: buyer_ref, type: string, source: input, description: "Opaque buyer identifier; must equal acting Buyer X-User-ID" }
      - { name: product_line_id, type: string, source: input, description: "FK -> ProductLine.id" }
      - { name: colorway_drop_id, type: string, source: input, description: "FK -> ColorwayDrop.id; chosen colorway (color matching enforced at submit)" }
      - { name: quantity, type: integer, source: input, description: "Units ordered", constraints: ">= 1" }
      - { name: declared_color_count, type: integer, source: input, description: "Buyer-declared artwork colors, feeds PROVISIONAL quote", constraints: "1..8" }
      - { name: declared_placement_count, type: integer, source: input, description: "Buyer-declared print placements, feeds PROVISIONAL quote", constraints: "1..4" }
      - { name: print_technology, type: enum, source: input, description: "LASER | PAD print technology the order will consume" }
      - { name: requested_ship_date, type: datetime, source: input, description: "Buyer-requested ship date; peak-window probe for the PROVISIONAL quote" }
      - { name: order_state, type: enum, source: system, description: "ACTIVE | CANCELLED; starts ACTIVE" }
      - { name: artwork_status, type: enum, source: system, description: "NO_ART | PROOF_SUBMITTED | CHANGES_REQUESTED | ART_APPROVED | PROOF_EXHAUSTED; starts NO_ART" }
      - { name: proof_round, type: integer, source: system, description: "Count of proofs submitted (0..3)" }
      - { name: schedule_status, type: enum, source: system, description: "UNSCHEDULED | RESERVED | CONFIRMED | IN_PRODUCTION | COMPLETE; starts UNSCHEDULED" }
      - { name: payment_status, type: enum, source: system, description: "UNPAID | AUTHORIZED | CAPTURED | PARTIALLY_REFUNDED | REFUNDED; starts UNPAID" }
      - { name: return_status, type: enum, source: system, description: "NONE | RETURN_REQUESTED | RETURN_DENIED | RETURN_SETTLED; starts NONE" }
      - { name: return_reason, type: enum, source: system, description: "DEFECT | ARTWORK_MISMATCH | BUYERS_REMORSE; null until a return is requested" }
      - { name: return_resolution, type: enum, source: system, description: "REMAKE | PARTIAL_CREDIT | FULL_REFUND; null until decided" }
      - { name: affected_unit_count, type: integer, source: system, description: "Units covered by the approved return; null until requested" }
      - { name: slot_id, type: string, source: system, description: "FK -> PrintSlot.id; reserved capacity window; null until reserve-slot", constraints: "nullable" }
      - { name: reservation_status, type: enum, source: system, description: "NONE | HELD | WAITLISTED | CONFIRMED | CONSUMED | RELEASED; starts NONE" }
      - { name: reserved_minutes, type: integer, source: system, description: "quantity x PER_UNIT_MINUTES[print_technology], frozen at reserve time" }
      - { name: quote_variant, type: enum, source: system, description: "NONE | PROVISIONAL | FINAL; which quote calculation is current" }
      - { name: peak_applied, type: boolean, source: computed, description: "True when the peak multiplier entered the current quote" }
      - { name: provisional_quote_cents, type: integer, source: computed, description: "PROVISIONAL quote from declared counts + requested_ship_date peak probe; null until submit" }
      - { name: final_quote_cents, type: integer, source: computed, description: "FINAL quote from the approved proof + reserved-slot peak probe; null until proof approval" }
      - { name: cancellation_fee_cents, type: integer, source: computed, description: "Fee charged at cancel; 0 before art approval, 10% of final_quote_cents after" }
      - { name: refund_cents, type: integer, source: computed, description: "Cumulative refund granted via cancel or return settlement" }
      - { name: qc_fail_count, type: integer, source: system, description: "Number of failed QC outcomes (rework loops)" }
      - { name: completed_at, type: datetime, source: system, description: "Logical-clock timestamp of production completion; anchors warranty and return windows; null until COMPLETE" }

  - name: ArtworkProof
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> CustomizationOrder.id" }
      - { name: artwork_file_ref, type: string, source: input, description: "Reference to the uploaded artwork file" }
      - { name: color_count, type: integer, source: input, description: "Actual colors in the artwork, feeds FINAL quote", constraints: "1..8" }
      - { name: placement_count, type: integer, source: input, description: "Actual print placements, feeds FINAL quote", constraints: "1..4" }
      - { name: pantone_codes, type: array, source: input, description: "Array of Pantone codes used in the artwork" }
      - { name: round_number, type: integer, source: system, description: "1..3 proof round for the order" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | APPROVED | CHANGES_REQUESTED | SUPERSEDED; starts SUBMITTED" }
      - { name: review_notes, type: string, source: system, description: "Reviewer notes captured at request-changes; null otherwise" }
      - { name: submitted_by, type: string, source: system, description: "X-User-ID of the Buyer who submitted the proof" }

  - name: PrintSlot
    parent: null
    common_fields: true
    fields:
      - { name: station_code, type: string, source: input, description: "Physical print station identifier; overlap rules are scoped per station_code" }
      - { name: technology, type: enum, source: input, description: "LASER | PAD technology this window runs" }
      - { name: window_start, type: datetime, source: input, description: "Window start (half-open interval [start, end))" }
      - { name: window_end, type: datetime, source: input, description: "Window end; must be after window_start" }
      - { name: capacity_minutes, type: integer, source: input, description: "Bookable machine-minutes in the window; must be <= window duration in minutes", constraints: "> 0" }
      - { name: peak_overlap, type: boolean, source: computed, description: "True when [window_start, window_end) intersects the PEAK_WINDOW constant" }
      - { name: booked_minutes, type: integer, source: computed, description: "Sum of reserved_minutes over orders with slot_id = this slot and reservation_status in {HELD, CONFIRMED, CONSUMED}" }
      - { name: available_minutes, type: integer, source: computed, description: "capacity_minutes - booked_minutes" }
      - { name: status, type: enum, source: system, description: "OPEN | LOCKED | CLOSED; starts OPEN; CLOSED is a lazy clock-driven transition (clock >= window_end) evaluated on every read or write" }

  - name: WarrantyClaim
    parent: null
    common_fields: true
    fields:
      - { name: claim_source, type: enum, source: input, description: "DTC | DEALER; who sold the item" }
      - { name: dealer_id, type: string, source: input, description: "FK -> Dealer.id; required iff claim_source = DEALER", constraints: "conditionally required, nullable" }
      - { name: buyer_ref, type: string, source: input, description: "Opaque buyer reference; required iff claim_source = DTC", constraints: "conditionally required, nullable" }
      - { name: order_id, type: string, source: input, description: "FK -> CustomizationOrder.id; set when the claimed item is a customized order", constraints: "optional, nullable" }
      - { name: product_line_id, type: string, source: input, description: "FK -> ProductLine.id; required iff order_id absent", constraints: "conditionally required, nullable" }
      - { name: serial_number, type: string, source: input, description: "Item serial number" }
      - { name: component, type: enum, source: input, description: "LID | INSULATION | HARDWARE failed component" }
      - { name: failure_description, type: string, source: input, description: "Free-text failure description" }
      - { name: purchase_date, type: datetime, source: input, description: "Purchase date; required iff order_id absent", constraints: "conditionally required, nullable" }
      - { name: filed_at, type: datetime, source: system, description: "Logical-clock timestamp at claim creation" }
      - { name: warranty_anchor_at, type: datetime, source: system, description: "order.completed_at when order_id present, else purchase_date" }
      - { name: warranty_expires_at, type: datetime, source: computed, description: "warranty_anchor_at + warranty_months[component] calendar months from the product line" }
      - { name: fraud_flag, type: boolean, source: system, description: "True at creation when the claimant has >= 3 other non-DENIED claims filed within the trailing 365 days" }
      - { name: replacement_colorway_resolution, type: enum, source: system, description: "SAME_COLORWAY | NEAREST_AVAILABLE | CREDIT_EQUIVALENT; set at APPROVE_REPLACEMENT; null otherwise" }
      - { name: credit_equivalent_cents, type: integer, source: system, description: "map_price_cents snapshot when resolution is CREDIT_EQUIVALENT; null otherwise" }
      - { name: status, type: enum, source: system, description: "FILED | UNDER_REVIEW | APPROVED_REPAIR | APPROVED_REPLACEMENT | DENIED; starts FILED" }
      - { name: decision_reason, type: string, source: system, description: "Reviewer rationale at decide; null until decided" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Dealer
    field: status
    initial_state: PENDING
    terminal_states: [TERMINATED]
    transitions:
      - from: PENDING
        to: AUTHORIZED
        trigger: "system (cascade from POST /drinkware/dealer-applications/{id}/decide with decision=APPROVE)"
        actor: system
        preconditions: ["approving application reached the join: inspection_status == PASSED and docs_status == VERIFIED"]
        side_effects:
          - "Dealer.storefront_verified := true"
          - "Dealer.brand_presentation_score := application.brand_presentation_score"
          - "increments Dealer.version by 1"
      - from: AUTHORIZED
        to: PROBATION
        trigger: "system (cascade: dealer_infraction_points recompute after an enforcement resolve/overturn lands points in [PROBATION_THRESHOLD, SUSPEND_THRESHOLD))"
        actor: system
        preconditions: ["8 <= infraction_points < 12 after recompute"]
        side_effects:
          - "increments Dealer.version by 1"
        note: "Threshold crossings only tighten standing automatically; they never relax it. PROBATION dealers are excluded from allocation eligibility at lock time."
      - from: [AUTHORIZED, PROBATION]
        to: SUSPENDED
        trigger: "POST /drinkware/dealers/{id}/suspend (manual) OR system (cascade: infraction_points >= SUSPEND_THRESHOLD after recompute)"
        actor: "ChannelManager or system"
        preconditions: ["manual: none beyond state", "system: infraction_points >= 12 after recompute"]
        side_effects:
          - "Cascade: every LaunchAllocation of this dealer in status REQUESTED or ALLOCATED whose drop is in status ANNOUNCED | ALLOCATION_OPEN | ALLOCATION_LOCKED transitions to FORFEITED with forfeit_reason DEALER_SUSPENDED; allocations on drops already LIVE or CLOSED are untouched"
          - "Each ALLOCATED forfeiture recomputes its drop's dealer_committed_units and unallocated_units (freed units return to the pool) and increments the drop's version by 1"
          - "increments Dealer.version by 1"
      - from: [SUSPENDED, PROBATION]
        to: AUTHORIZED
        trigger: "POST /drinkware/dealers/{id}/reinstate"
        actor: ChannelManager
        preconditions: ["recomputed infraction_points < PROBATION_THRESHOLD (8)"]
        side_effects: ["increments Dealer.version by 1"]
      - from: SUSPENDED
        to: PROBATION
        trigger: "POST /drinkware/dealers/{id}/reinstate"
        actor: ChannelManager
        preconditions: ["8 <= recomputed infraction_points < 12"]
        side_effects: ["increments Dealer.version by 1"]
        note: "Reinstate recomputes standing from the clock; the landing state is derived, never chosen by the caller. Overturning a case lowers points but never auto-restores status — only reinstate does. PROBATION relaxes to AUTHORIZED only through reinstate as well."
      - from: [PENDING, AUTHORIZED, PROBATION, SUSPENDED]
        to: TERMINATED
        trigger: "POST /drinkware/dealers/{id}/terminate"
        actor: ChannelManager
        preconditions: []
        side_effects:
          - "Cascade: every LaunchAllocation of this dealer in status REQUESTED or ALLOCATED whose drop is in status ANNOUNCED | ALLOCATION_OPEN | ALLOCATION_LOCKED transitions to FORFEITED with forfeit_reason DEALER_TERMINATED"
          - "Each ALLOCATED forfeiture recomputes its drop's dealer_committed_units and unallocated_units and increments the drop's version by 1"
          - "Any SUBMITTED or VETTING DealerApplication of this dealer transitions to REJECTED with decision_reason 'dealer terminated'"
          - "increments Dealer.version by 1"

  - entity: DealerApplication
    field: status
    initial_state: SUBMITTED
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: VETTING
        trigger: "POST /drinkware/dealer-applications/{id}/schedule-inspection OR POST /drinkware/dealer-applications/{id}/verify-documents (either branch may start first — fork)"
        actor: "FieldInspector or ChannelManager"
        preconditions: []
        side_effects: []
      - from: VETTING
        to: APPROVED
        trigger: "POST /drinkware/dealer-applications/{id}/decide with decision=APPROVE (join)"
        actor: ChannelManager
        preconditions:
          - "inspection_status == PASSED (else ERR_APPLICATION_INCOMPLETE)"
          - "docs_status == VERIFIED (else ERR_APPLICATION_INCOMPLETE)"
          - "has_physical_storefront == true (else ERR_STOREFRONT_REQUIRED)"
          - "brand_presentation_score >= 70 (else ERR_BRAND_STANDARD_BELOW_THRESHOLD)"
          - "acting X-User-ID != inspection_recorded_by AND != docs_reviewed_by (segregation of duties, else ERR_SOD_VIOLATION)"
          - "dealer.status == PENDING"
        side_effects:
          - "Dealer PENDING -> AUTHORIZED cascade (see Dealer machine)"
      - from: [SUBMITTED, VETTING]
        to: REJECTED
        trigger: "POST /drinkware/dealer-applications/{id}/decide with decision=REJECT"
        actor: ChannelManager
        preconditions: []
        side_effects: ["decision_reason recorded"]
    note: "Fork-join: the inspection leg (UNSCHEDULED->SCHEDULED->PASSED/FAILED) and the docs leg (PENDING->VERIFIED/REJECTED) advance independently; decide is the join and refuses until both legs pass."

  - entity: EnforcementCase
    field: status
    initial_state: UNDER_REVIEW
    terminal_states: [DISMISSED, OVERTURNED]
    transitions:
      - from: UNDER_REVIEW
        to: ESCALATED_LEGAL
        trigger: "POST /drinkware/enforcement-cases/{id}/resolve with outcome=ESCALATED_LEGAL"
        actor: ChannelManager
        preconditions: []
        side_effects: []
      - from: [UNDER_REVIEW, ESCALATED_LEGAL]
        to: CONFIRMED_VIOLATION
        trigger: "POST /drinkware/enforcement-cases/{id}/resolve with outcome=CONFIRMED_VIOLATION"
        actor: ChannelManager
        preconditions:
          - "if matched_dealer_id is set: infraction_category is required and expected_dealer_version must equal the dealer's current version (OCC, ERR_STALE_DEALER_VERSION)"
        side_effects:
          - "infraction_category, infraction_points (from INFRACTION_POINTS), infraction_issued_at := clock, infraction_expires_at := clock + 365 days (only when a dealer is matched; unmatched confirmations record points 0 and no expiry)"
          - "matched dealer: recompute dealer_infraction_points; increments Dealer.version by 1; if points >= 12 the Dealer SUSPENDED cascade fires; else if points >= 8 and dealer is AUTHORIZED the Dealer PROBATION transition fires"
      - from: [UNDER_REVIEW, ESCALATED_LEGAL]
        to: DISMISSED
        trigger: "POST /drinkware/enforcement-cases/{id}/resolve with outcome=DISMISSED"
        actor: ChannelManager
        preconditions: []
        side_effects: []
      - from: CONFIRMED_VIOLATION
        to: OVERTURNED
        trigger: "POST /drinkware/enforcement-cases/{id}/overturn"
        actor: ChannelManager
        preconditions: ["if matched_dealer_id is set: expected_dealer_version must equal the dealer's current version (OCC, ERR_STALE_DEALER_VERSION)"]
        side_effects:
          - "matched dealer: recompute dealer_infraction_points (this case now excluded); increments Dealer.version by 1"
          - "Dealer.status is NOT auto-restored — standing relaxes only via POST /drinkware/dealers/{id}/reinstate"

  - entity: ProductLine
    field: status
    initial_state: ACTIVE
    terminal_states: [DISCONTINUED]
    transitions:
      - from: ACTIVE
        to: DISCONTINUED
        trigger: "POST /drinkware/product-lines/{id}/discontinue"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "New customization orders may still be created referencing the line, but submit rejects them with ERR_PRODUCT_LINE_DISCONTINUED"
          - "New colorway drops for the line are rejected with ERR_PRODUCT_LINE_DISCONTINUED"

  - entity: ColorwayDrop
    field: status
    initial_state: ANNOUNCED
    terminal_states: [CLOSED]
    transitions:
      - from: ANNOUNCED
        to: ALLOCATION_OPEN
        trigger: "POST /drinkware/colorway-drops/{id}/open-allocation"
        actor: PlatformAdmin
        preconditions: ["allocation_opens_at <= clock < allocation_closes_at (else ERR_ALLOCATION_WINDOW_NOT_OPEN)"]
        side_effects: ["increments ColorwayDrop.version by 1"]
      - from: ALLOCATION_OPEN
        to: ALLOCATION_LOCKED
        trigger: "POST /drinkware/colorway-drops/{id}/lock-allocation"
        actor: PlatformAdmin
        preconditions:
          - "clock >= allocation_closes_at (else ERR_ALLOCATION_WINDOW_OPEN)"
          - "expected_drop_version == current version (OCC, ERR_STALE_DROP_VERSION)"
        side_effects:
          - "Runs calculations.launch_allocation_distribution: eligible REQUESTED allocations (dealer.status == AUTHORIZED at lock) become ALLOCATED with allocated_units; eligible requests that receive 0 units and every request from a non-AUTHORIZED dealer become EXPIRED"
          - "Recomputes dealer_committed_units and unallocated_units"
          - "increments ColorwayDrop.version by 1"
      - from: ALLOCATION_LOCKED
        to: LIVE
        trigger: "system (lazy: clock >= go_live_at, evaluated on every read or write of the drop)"
        actor: system
        preconditions: []
        side_effects: []
      - from: LIVE
        to: CLOSED
        trigger: "system (lazy: clock >= sales_end_at, evaluated on every read or write of the drop)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: LaunchAllocation
    field: status
    initial_state: REQUESTED
    terminal_states: [EXPIRED, FORFEITED]
    transitions:
      - from: REQUESTED
        to: ALLOCATED
        trigger: "system (cascade from POST /drinkware/colorway-drops/{id}/lock-allocation when this request is eligible and receives > 0 units)"
        actor: system
        preconditions: ["dealer.status == AUTHORIZED at lock time"]
        side_effects: ["allocated_units set by launch_allocation_distribution"]
      - from: REQUESTED
        to: EXPIRED
        trigger: "system (cascade from lock-allocation when the dealer is not AUTHORIZED or the request receives 0 units)"
        actor: system
        preconditions: []
        side_effects: []
      - from: [REQUESTED, ALLOCATED]
        to: FORFEITED
        trigger: "POST /drinkware/launch-allocations/{id}/forfeit OR system cascade (dealer suspended/terminated)"
        actor: "Dealer (own), ChannelManager, or system"
        preconditions: ["manual forfeit requires the drop to be in ANNOUNCED | ALLOCATION_OPEN | ALLOCATION_LOCKED (allocations on LIVE or CLOSED drops cannot be forfeited: ERR_INVALID_STATE_TRANSITION)"]
        side_effects:
          - "forfeit_reason := DEALER_CHOICE (manual) | DEALER_SUSPENDED | DEALER_TERMINATED (system)"
          - "if ALLOCATED: drop.dealer_committed_units and unallocated_units recompute (units return to the pool); increments the drop's version by 1"
          - "if REQUESTED: increments the drop's version by 1"

  - entity: CustomizationOrder
    field: artwork_status
    initial_state: NO_ART
    terminal_states: [ART_APPROVED, PROOF_EXHAUSTED]
    transitions:
      - from: [NO_ART, CHANGES_REQUESTED]
        to: PROOF_SUBMITTED
        trigger: "POST /drinkware/artwork-proofs"
        actor: Buyer
        preconditions: ["order_state == ACTIVE", "proof_round < 3 (else ERR_PROOF_ROUND_EXHAUSTED)"]
        side_effects:
          - "proof_round += 1; new ArtworkProof created SUBMITTED with round_number := proof_round"
          - "the order's previous CHANGES_REQUESTED proof (if any) transitions to SUPERSEDED"
      - from: PROOF_SUBMITTED
        to: ART_APPROVED
        trigger: "POST /drinkware/artwork-proofs/{id}/approve on the latest proof"
        actor: PrepressTech
        preconditions: ["order_state == ACTIVE", "proof.status == SUBMITTED", "proof.round_number == order.proof_round (only the latest round is reviewable; older rounds are SUPERSEDED)"]
        side_effects:
          - "proof SUBMITTED -> APPROVED"
          - "computes calculations.customization_quote_cents FINAL variant -> final_quote_cents, quote_variant := FINAL, peak_applied recomputed"
          - "if reservation_status == HELD: reservation_status -> CONFIRMED and schedule_status RESERVED -> CONFIRMED"
      - from: PROOF_SUBMITTED
        to: CHANGES_REQUESTED
        trigger: "POST /drinkware/artwork-proofs/{id}/request-changes on the latest proof"
        actor: PrepressTech
        preconditions: ["order_state == ACTIVE", "proof.status == SUBMITTED", "proof.round_number == order.proof_round"]
        side_effects:
          - "proof SUBMITTED -> CHANGES_REQUESTED with review_notes"
          - "if proof_round == 3: artwork_status -> PROOF_EXHAUSTED instead (cycle closes; only cancel remains)"
    note: "Cyclic axis: PROOF_SUBMITTED -> CHANGES_REQUESTED -> PROOF_SUBMITTED loops up to 3 rounds; the third CHANGES_REQUESTED lands in PROOF_EXHAUSTED."

  - entity: CustomizationOrder
    field: schedule_status
    initial_state: UNSCHEDULED
    terminal_states: [COMPLETE]
    transitions:
      - from: UNSCHEDULED
        to: RESERVED
        trigger: "POST /drinkware/customization-orders/{id}/reserve-slot when capacity fits (HELD) or via waitlist promotion"
        actor: "Buyer or system"
        preconditions:
          - "order_state == ACTIVE, schedule_status == UNSCHEDULED, reservation_status in {NONE, RELEASED}"
          - "payment_status == AUTHORIZED"
          - "slot.technology == order.print_technology (else ERR_TECHNOLOGY_MISMATCH)"
          - "slot.status == OPEN (else ERR_SLOT_NOT_OPEN)"
          - "if slot.peak_overlap: artwork_status == ART_APPROVED (else ERR_ARTWORK_NOT_APPROVED); off-peak slots accept reservations while art is still pending"
          - "reservation_status := HELD when slot.available_minutes >= quantity x PER_UNIT_MINUTES[technology] (exact fit allowed), else WAITLISTED and schedule_status stays UNSCHEDULED"
        side_effects:
          - "HELD: slot.booked_minutes += reserved_minutes (invariant capacity == booked + available preserved)"
          - "if artwork_status == ART_APPROVED at reserve time, the new reservation confirms atomically: reservation_status HELD -> CONFIRMED and schedule_status RESERVED -> CONFIRMED in the same request"
      - from: RESERVED
        to: CONFIRMED
        trigger: "system (cascade from artwork approval while HELD, from waitlist promotion when art is already approved, or atomically at reserve time when art is already approved)"
        actor: system
        preconditions: ["artwork_status == ART_APPROVED"]
        side_effects: []
      - from: CONFIRMED
        to: IN_PRODUCTION
        trigger: "POST /drinkware/customization-orders/{id}/start-production"
        actor: ProductionLead
        preconditions: ["order_state == ACTIVE", "reservation_status == CONFIRMED", "slot.status == LOCKED (else ERR_SLOT_NOT_LOCKED)"]
        side_effects: []
      - from: IN_PRODUCTION
        to: COMPLETE
        trigger: "POST /drinkware/customization-orders/{id}/complete-production with qc_outcome=PASS"
        actor: ProductionLead
        preconditions: ["order_state == ACTIVE"]
        side_effects:
          - "reservation_status -> CONSUMED (minutes stay booked — the capacity was spent)"
          - "payment_status AUTHORIZED -> CAPTURED (captures final_quote_cents)"
          - "completed_at := clock"
      - from: IN_PRODUCTION
        to: CONFIRMED
        trigger: "POST /drinkware/customization-orders/{id}/complete-production with qc_outcome=FAIL (rework loop)"
        actor: ProductionLead
        preconditions: ["order_state == ACTIVE"]
        side_effects: ["qc_fail_count += 1"]
      - from: [RESERVED, CONFIRMED]
        to: UNSCHEDULED
        trigger: "POST /drinkware/customization-orders/{id}/release-slot"
        actor: Buyer
        preconditions: ["order_state == ACTIVE", "reservation_status in {HELD, CONFIRMED, WAITLISTED}"]
        side_effects:
          - "reservation_status -> RELEASED; slot_id cleared; reserved_minutes freed from slot.booked_minutes when the reservation was HELD or CONFIRMED"
          - "waitlist promotion cascade: see calculations.waitlist_promotion_order — promotes eligible WAITLISTED orders on the freed slot in rank order while capacity fits"

  - entity: CustomizationOrder
    field: payment_status
    initial_state: UNPAID
    terminal_states: [REFUNDED]
    transitions:
      - from: UNPAID
        to: AUTHORIZED
        trigger: "POST /drinkware/customization-orders/{id}/submit"
        actor: Buyer
        preconditions:
          - "order_state == ACTIVE (a second submit hits this guard: ERR_INVALID_STATE_TRANSITION)"
          - "payment_status == UNPAID"
          - "product line status == ACTIVE (else ERR_PRODUCT_LINE_DISCONTINUED)"
          - "colorway drop's product_line_id == order.product_line_id and drop status != CLOSED (else ERR_COLORWAY_NOT_AVAILABLE)"
          - "quantity >= product_line.min_custom_quantity (else ERR_BELOW_MINIMUM_QUANTITY)"
        side_effects:
          - "computes calculations.customization_quote_cents PROVISIONAL variant -> provisional_quote_cents, quote_variant := PROVISIONAL, peak_applied set"
      - from: AUTHORIZED
        to: CAPTURED
        trigger: "system (cascade from complete-production with qc_outcome=PASS)"
        actor: system
        preconditions: []
        side_effects: []
      - from: [AUTHORIZED, CAPTURED]
        to: REFUNDED
        trigger: "POST /drinkware/customization-orders/{id}/cancel OR decide-return with FULL_REFUND"
        actor: "Buyer, PlatformAdmin, CustomerCare"
        preconditions: ["cancel: order_state == ACTIVE and schedule_status in {UNSCHEDULED, RESERVED, CONFIRMED} (IN_PRODUCTION -> ERR_ORDER_IN_PRODUCTION; COMPLETE orders use the return flow)"]
        side_effects:
          - "cancel: cancellation_fee_cents := 0 when artwork_status != ART_APPROVED else round_half_up(final_quote_cents x 0.10); refund_cents := 0 when payment was AUTHORIZED (authorization voided), else final_quote_cents - fee (floor 0)"
          - "cancel: order_state -> CANCELLED; any HELD/CONFIRMED/WAITLISTED reservation is released (frees slot capacity -> waitlist promotion cascade)"
          - "return FULL_REFUND: refund_cents := final_quote_cents"
      - from: CAPTURED
        to: PARTIALLY_REFUNDED
        trigger: "decide-return with resolution=PARTIAL_CREDIT"
        actor: CustomerCare
        preconditions: []
        side_effects: ["refund_cents := round_half_up(final_quote_cents x affected_unit_count / quantity)"]

  - entity: CustomizationOrder
    field: return_status
    initial_state: NONE
    terminal_states: [RETURN_DENIED, RETURN_SETTLED]
    transitions:
      - from: NONE
        to: RETURN_REQUESTED
        trigger: "POST /drinkware/customization-orders/{id}/request-return"
        actor: Buyer
        preconditions:
          - "order_state == ACTIVE, schedule_status == COMPLETE, payment_status == CAPTURED"
          - "clock < completed_at + 45 days (else ERR_RETURN_WINDOW_CLOSED)"
          - "affected_unit_count in 1..quantity"
        side_effects: ["return_reason and affected_unit_count recorded"]
      - from: RETURN_REQUESTED
        to: RETURN_DENIED
        trigger: "POST /drinkware/customization-orders/{id}/decide-return with decision=DENY"
        actor: CustomerCare
        preconditions: []
        side_effects: []
      - from: RETURN_REQUESTED
        to: RETURN_SETTLED
        trigger: "POST /drinkware/customization-orders/{id}/decide-return with decision=APPROVE"
        actor: CustomerCare
        preconditions:
          - "return_reason == BUYERS_REMORSE is never approvable (personalized goods cannot be restocked: ERR_PERSONALIZED_NOT_RETURNABLE)"
          - "return_reason == ARTWORK_MISMATCH admits only FULL_REFUND or REMAKE (PARTIAL_CREDIT -> ERR_RETURN_RESOLUTION_MISMATCH)"
          - "resolution == PARTIAL_CREDIT requires affected_unit_count < quantity (else ERR_RETURN_RESOLUTION_MISMATCH — use FULL_REFUND)"
          - "resolution == REMAKE requires the order's slot status != CLOSED and slot.available_minutes >= reserved_minutes (else ERR_CAPACITY_EXCEEDED)"
        side_effects:
          - "FULL_REFUND / PARTIAL_CREDIT: refund math per payment axis; goods are written off, never restocked (no inventory returns to any pool)"
          - "REMAKE: schedule_status COMPLETE -> CONFIRMED (rework), reservation_status -> HELD on the same slot, slot.booked_minutes += reserved_minutes"

  - entity: ArtworkProof
    field: status
    initial_state: SUBMITTED
    terminal_states: [APPROVED, SUPERSEDED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /drinkware/artwork-proofs/{id}/approve"
        actor: PrepressTech
        preconditions: ["latest round for its order", "order ACTIVE"]
        side_effects: ["order artwork axis cascade (see CustomizationOrder.artwork_status)"]
      - from: SUBMITTED
        to: CHANGES_REQUESTED
        trigger: "POST /drinkware/artwork-proofs/{id}/request-changes"
        actor: PrepressTech
        preconditions: ["latest round for its order", "order ACTIVE"]
        side_effects: ["order artwork axis cascade"]
      - from: CHANGES_REQUESTED
        to: SUPERSEDED
        trigger: "system (a new proof round is created for the same order)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: PrintSlot
    field: status
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: LOCKED
        trigger: "POST /drinkware/print-slots/{id}/lock"
        actor: ProductionLead
        preconditions: []
        side_effects: ["new reservations are rejected with ERR_SLOT_NOT_OPEN; existing HELD/CONFIRMED reservations are unaffected; orders CONFIRMED on this slot may start-production"]
      - from: [OPEN, LOCKED]
        to: CLOSED
        trigger: "system (lazy: clock >= window_end, evaluated on every read or write of the slot)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: WarrantyClaim
    field: status
    initial_state: FILED
    terminal_states: [APPROVED_REPAIR, APPROVED_REPLACEMENT, DENIED]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /drinkware/warranty-claims/{id}/start-review"
        actor: WarrantyAgent
        preconditions: []
        side_effects: []
      - from: [FILED, UNDER_REVIEW]
        to: APPROVED_REPAIR
        trigger: "POST /drinkware/warranty-claims/{id}/decide with outcome=APPROVE_REPAIR"
        actor: WarrantyAgent
        preconditions: ["fraud_flag == false OR status == UNDER_REVIEW (fraudulent-pattern claims must pass through review first: ERR_FRAUD_REVIEW_REQUIRED)"]
        side_effects: []
      - from: [FILED, UNDER_REVIEW]
        to: APPROVED_REPLACEMENT
        trigger: "POST /drinkware/warranty-claims/{id}/decide with outcome=APPROVE_REPLACEMENT"
        actor: WarrantyAgent
        preconditions: ["fraud_flag == false OR status == UNDER_REVIEW (else ERR_FRAUD_REVIEW_REQUIRED)"]
        side_effects:
          - "replacement_colorway_resolution := SAME_COLORWAY when order_id is set and that order's drop status is in {ALLOCATION_LOCKED, LIVE} and drop.unallocated_units >= 1 — and the drop's warranty_reserved_units += 1 (unit-ledger invariant preserved); else NEAREST_AVAILABLE when the product line is ACTIVE; else CREDIT_EQUIVALENT with credit_equivalent_cents := product_line.map_price_cents"
      - from: [FILED, UNDER_REVIEW]
        to: DENIED
        trigger: "POST /drinkware/warranty-claims/{id}/decide with outcome=DENY"
        actor: WarrantyAgent
        preconditions: ["fraud_flag == false OR status == UNDER_REVIEW (else ERR_FRAUD_REVIEW_REQUIRED)"]
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: enforcement-resolve-stale-dealer
    parent_entity: Dealer
    write_endpoint: "POST /drinkware/enforcement-cases/{id}/resolve"
    occ_field: "expected_dealer_version"
    description: |
      Resolving an enforcement case as CONFIRMED_VIOLATION against a matched
      dealer whose version has advanced since the client last read the dealer
      is rejected. Each confirmation legitimately accumulates onto the dealer's
      infraction standing, so a stale view of that standing (e.g. another case
      against the same dealer was just confirmed, bumping Dealer.version) must
      be re-read before this write may proceed.
    error_id: ERR_STALE_DEALER_VERSION
    http_status: 412
  - rule_id: infraction-overturn-stale-dealer
    parent_entity: Dealer
    write_endpoint: "POST /drinkware/enforcement-cases/{id}/overturn"
    occ_field: "expected_dealer_version"
    description: |
      Overturning a confirmed case against a matched dealer whose version has
      advanced since the client last read the dealer is rejected; the overturn
      recomputes infraction standing and must be based on a current read.
    error_id: ERR_STALE_DEALER_VERSION
    http_status: 412
  - rule_id: drop-lock-stale-request-set
    parent_entity: ColorwayDrop
    write_endpoint: "POST /drinkware/colorway-drops/{id}/lock-allocation"
    occ_field: "expected_drop_version"
    description: |
      Locking allocation against a drop whose version has advanced since the
      client last read the drop is rejected. Allocation request creation and
      forfeiture both increment ColorwayDrop.version, so a stale version means
      the request set the client based the lock decision on is out of date.
    error_id: ERR_STALE_DROP_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: customization_quote_cents
    trigger: "order submit (PROVISIONAL variant) and artwork-proof approval (FINAL variant)"
    algorithm: tiered_pricing
    formula: |
      unit = product_line.base_custom_price_cents
             + max(0, color_count - 1) * COLOR_SURCHARGE_CENTS
             + max(0, placement_count - 1) * PLACEMENT_SURCHARGE_CENTS
      subtotal = quantity * unit
      rate = 0
      if buyer_type == CORPORATE:
          if quantity >= 500: rate = 0.22
          elif quantity >= 144: rate = 0.15
          elif quantity >= 48:  rate = 0.08
      # INDIVIDUAL orders never receive a quantity rate
      discounted = round_half_up(subtotal * (1 - rate))          # ROUNDING ORDER PINNED: tier discount first
      setup = 0 if quantity >= SETUP_WAIVER_QTY else SETUP_FEE_CENTS  # waiver is quantity-based, both buyer types
      peak = peak_probe()                                         # see variants
      total = round_half_up((discounted + setup) * (PEAK_MULTIPLIER if peak else 1.0))
    input_set: "the order plus its product line; color_count/placement_count source differs per variant"
    constants:
      COLOR_SURCHARGE_CENTS: 150
      PLACEMENT_SURCHARGE_CENTS: 200
      SETUP_FEE_CENTS: 8000
      SETUP_WAIVER_QTY: 144
      PEAK_MULTIPLIER: 1.25
      PEAK_WINDOW_START: "2026-10-15T00:00:00Z"
      PEAK_WINDOW_END: "2026-12-21T00:00:00Z"
    precision: "integer cents; two pinned round_half_up steps: after the tier discount, and after the peak multiplier"
    variants:
      - name: PROVISIONAL
        when: "computed at POST /customization-orders/{id}/submit"
        difference: "color_count := order.declared_color_count, placement_count := order.declared_placement_count; peak_probe() := requested_ship_date within [PEAK_WINDOW_START, PEAK_WINDOW_END)"
      - name: FINAL
        when: "computed at artwork-proof approval"
        difference: "color_count/placement_count := the approved proof's actual values; peak_probe() := the reserved slot's peak_overlap when reservation_status in {HELD, WAITLISTED, CONFIRMED}, else the requested_ship_date probe"
    note: "Same order, two valid evidence sets, different totals — the FINAL quote replaces, never adjusts, the PROVISIONAL one."

  - name: dealer_allocation_score
    trigger: "computed on every Dealer read and consumed by launch_allocation_distribution at lock time"
    algorithm: weighted_scoring
    formula: |
      season = PEAK when clock is within [PEAK_WINDOW_START, PEAK_WINDOW_END) else STANDARD
      STANDARD: score = 0.50 * sell_through_pct + 0.30 * brand_presentation_score + 2 * tenure_years - 5 * infraction_points
      PEAK:     score = 0.35 * sell_through_pct + 0.45 * brand_presentation_score + 2 * tenure_years - 8 * infraction_points
      score = round_half_up(score, 2 decimal places)
    input_set: "the dealer's sell_through_pct, brand_presentation_score, tenure_years, and live infraction_points"
    constants:
      PEAK_WINDOW_START: "2026-10-15T00:00:00Z"
      PEAK_WINDOW_END: "2026-12-21T00:00:00Z"
    precision: "2 decimal places, round_half_up"
    variants:
      - name: STANDARD
        when: "clock outside the peak window"
        difference: "sell-through weighted 0.50, brand presentation 0.30, infraction penalty 5 per point"
      - name: PEAK
        when: "clock inside the peak window (corporate-gifting season reallocates weight toward brand presentation and punishes infractions harder)"
        difference: "sell-through weighted 0.35, brand presentation 0.45, infraction penalty 8 per point"

  - name: launch_allocation_distribution
    trigger: "POST /drinkware/colorway-drops/{id}/lock-allocation"
    algorithm: waterfall_allocation
    formula: |
      dealer_pool = drop.total_units - drop.dtc_reserved_units - drop.warranty_reserved_units
      eligible = [a for a in drop's allocations with status REQUESTED if a.dealer.status == AUTHORIZED]
      ineligible REQUESTED -> EXPIRED
      if sum(a.requested_units for a in eligible) <= dealer_pool:
          each eligible a: allocated_units = requested_units -> ALLOCATED
      else:
          weight_i = max(dealer.allocation_score, 1)               # score per current season variant
          raw_i = dealer_pool * weight_i / sum(weights)
          # ROUNDING ORDER PINNED: floor the raw share first, then cap at requested
          base_i = min(requested_i, floor(raw_i))
          leftover = dealer_pool - sum(base_i)
          # remainder passes: rank candidates with base_i < requested_i by
          #   (fractional part of raw_i DESC, allocation_score DESC, allocation.created_at ASC);
          # grant 1 unit per candidate per pass in that order; repeat passes until
          # leftover == 0 or no candidate can take more (residue stays unallocated)
      requests granted 0 units -> EXPIRED; requests granted > 0 -> ALLOCATED
    input_set: "allocations in status REQUESTED on this drop; dealer.status and dealer.allocation_score read at lock time"
    precision: "integer units; floor before cap, then largest-remainder passes"
    note: "Floor-then-cap then iterative remainder passes is THE pinned order; capping first and re-sharing the pool produces different units and is wrong."

  - name: dealer_infraction_points
    trigger: "recomputed on enforcement resolve (confirm), overturn, reinstate, and on every Dealer read"
    algorithm: aggregation
    formula: |
      points = sum(case.infraction_points for case in cases
                   where case.matched_dealer_id == dealer.id
                     and case.status == CONFIRMED_VIOLATION
                     and clock < case.infraction_expires_at)
      # Expired (clock >= expires_at) and OVERTURNED cases contribute 0.
      # Threshold crossings evaluated only at resolve time:
      #   points >= SUSPEND_THRESHOLD  -> Dealer -> SUSPENDED (from AUTHORIZED or PROBATION)
      #   PROBATION_THRESHOLD <= points < SUSPEND_THRESHOLD and status == AUTHORIZED -> PROBATION
    input_set: "the dealer's matched enforcement cases; trailing window enforced by per-case expiry"
    constants:
      INFRACTION_POINTS: { MAP_VIOLATION: 4, UNAUTHORIZED_MARKETPLACE: 6, BRAND_STANDARD: 3, CHANNEL_DIVERSION: 5 }
      INFRACTION_EXPIRY_DAYS: 365
      PROBATION_THRESHOLD: 8
      SUSPEND_THRESHOLD: 12
    precision: "integer points; thresholds use >= (8 points exactly is PROBATION, 12 exactly is SUSPENDED)"

  - name: slot_capacity_ledger
    trigger: "reserve-slot, release-slot, waitlist promotion, REMAKE return settlement, complete-production bookkeeping"
    algorithm: aggregation
    formula: |
      slot.booked_minutes = sum(order.reserved_minutes for orders with slot_id == slot.id
                                and reservation_status in {HELD, CONFIRMED, CONSUMED})
      slot.available_minutes = slot.capacity_minutes - slot.booked_minutes
      INVARIANT: capacity_minutes == booked_minutes + available_minutes at all times.
      A HELD/CONFIRMED booking followed by its release MUST restore available_minutes exactly.
    constants:
      PER_UNIT_MINUTES: { LASER: 4, PAD: 2 }
    precision: "integer minutes"

  - name: drop_unit_ledger
    trigger: "lock-allocation, allocation forfeit, warranty SAME_COLORWAY replacement reservation"
    algorithm: aggregation
    formula: |
      dealer_committed_units = sum(allocated_units over ALLOCATED allocations of the drop)
      warranty_reserved_units = count of APPROVED_REPLACEMENT claims with SAME_COLORWAY on this drop
      unallocated_units = total_units - dtc_reserved_units - dealer_committed_units - warranty_reserved_units
      INVARIANT: total_units == dealer_committed_units + dtc_reserved_units + warranty_reserved_units + unallocated_units.
      An ALLOCATED allocation followed by its forfeiture MUST restore unallocated_units exactly.
    precision: "integer units"

  - name: return_refund_cents
    trigger: "decide-return APPROVE with PARTIAL_CREDIT or FULL_REFUND; cancel with art approved"
    algorithm: threshold
    formula: |
      FULL_REFUND:    refund = final_quote_cents
      PARTIAL_CREDIT: refund = round_half_up(final_quote_cents * affected_unit_count / quantity)   # single rounding step, pinned
      cancel fee:     fee = 0 when artwork_status != ART_APPROVED
                            else round_half_up(final_quote_cents * CANCEL_FEE_RATE)
    input_set: "the order's final_quote_cents, quantity, affected_unit_count"
    constants:
      CANCEL_FEE_RATE: 0.10
      RETURN_WINDOW_DAYS: 45
    precision: "integer cents, round_half_up; one rounding step per refund — never round per unit then sum"

  - name: warranty_window_and_fraud
    trigger: "warranty claim creation (window + fraud flag) and decide (fraud gate)"
    algorithm: threshold
    formula: |
      warranty_expires_at = warranty_anchor_at + warranty_months[component] calendar months
      claim valid only while filed_at < warranty_expires_at (strict: filing exactly at expiry is ERR_WARRANTY_EXPIRED)
      fraud_flag := count of the claimant's OTHER claims with status != DENIED
                    and filed_at within [clock - 365 days, clock) >= FRAUD_PRIOR_THRESHOLD
      claimant key = dealer_id when claim_source == DEALER else buyer_ref
    constants:
      FRAUD_PRIOR_THRESHOLD: 3
    precision: "calendar-month arithmetic; expiry at the same clock time of the expiry month-day; strict less-than"

  - name: waitlist_promotion_order
    trigger: "release-slot or cancel frees capacity on a slot"
    algorithm: selector_policy
    formula: |
      candidate set: orders with slot_id == freed slot, reservation_status == WAITLISTED,
        order_state == ACTIVE, and (slot.peak_overlap == false OR artwork_status == ART_APPROVED)
      rank: requested_ship_date ASC, then created_at ASC (earlier request first)
      walk the ranked list; promote each candidate whose reserved_minutes <= current available_minutes:
        reservation_status WAITLISTED -> HELD, schedule_status UNSCHEDULED -> RESERVED,
        booked_minutes += reserved_minutes; then if artwork_status == ART_APPROVED the
        reservation auto-confirms (HELD -> CONFIRMED, RESERVED -> CONFIRMED)
      empty candidate set or no fitting candidate: no-op (fallback = leave capacity open)
    precision: "deterministic; no id-based tie-breaks anywhere"

  - name: print_slot_overlap
    trigger: "POST /drinkware/print-slots (creation)"
    algorithm: interval_merge
    formula: |
      Windows on the same station_code use HALF-OPEN intervals [window_start, window_end):
        same technology: reject iff intervals intersect; touching endpoints (a.end == b.start) are allowed
        different technologies: additionally require a CHANGEOVER_BUFFER_MINUTES gap between the
          windows on both sides; a gap < 20 minutes is rejected (ERR_SLOT_OVERLAP_CONFLICT)
      capacity_minutes must be <= window duration in minutes (ERR_CAPACITY_EXCEEDS_WINDOW)
      window_end must be after window_start (ERR_INVALID_WINDOW_ORDER)
    constants:
      CHANGEOVER_BUFFER_MINUTES: 20
    precision: "minute granularity"

  - name: inspection_schedule_conflict
    trigger: "POST /drinkware/dealer-applications/{id}/schedule-inspection"
    algorithm: interval_merge
    formula: |
      An inspector's site-visit windows are CLOSED intervals [start, end] (both endpoints occupied):
        two windows sharing an endpoint conflict outright.
        Between consecutive windows on the same inspector_user_id a TRAVEL_BUFFER_MINUTES gap
        of at least 60 minutes is required: next.start - prev.end >= 60 minutes.
      Only applications with inspection_status == SCHEDULED occupy the inspector's calendar.
    constants:
      TRAVEL_BUFFER_MINUTES: 60
    precision: "minute granularity; closed-interval semantics (opposite of print slots)"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; first failure wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers are present, and X-User-Role names a declared role"
    error_id: ERR_MISSING_OR_INVALID_CONTEXT_HEADER
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "The role is listed on the endpoint; AND ownership: Dealer role acts only on its own dealer id (and own applications/allocations), Buyer role only on orders/proofs/claims whose buyer_ref equals X-User-ID, FieldInspector only on inspections it is assigned to (inspector_user_id == X-User-ID)"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Request body shape: required fields present, types match, enum values in range, conditionally-required fields satisfied (infraction_category when confirming a matched case; dealer_id when claim_source is DEALER; product_line_id and purchase_date when order_id absent; resolution when decision is APPROVE)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all endpoints with a request body

  - priority: 4
    category: existence
    check: "Path ids resolve left-to-right; then body foreign keys resolve in the endpoint's declared input order (entity-specific 404s)"
    error_id: ERR_DEALER_NOT_FOUND | ERR_APPLICATION_NOT_FOUND | ERR_CASE_NOT_FOUND | ERR_PRODUCT_LINE_NOT_FOUND | ERR_DROP_NOT_FOUND | ERR_ALLOCATION_NOT_FOUND | ERR_ORDER_NOT_FOUND | ERR_PROOF_NOT_FOUND | ERR_SLOT_NOT_FOUND | ERR_CLAIM_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 5
    category: state
    check: "The target resource's current state permits the requested transition (generic ERR_INVALID_STATE_TRANSITION plus the specific state errors ERR_DROP_NOT_OPEN_FOR_ALLOCATION on the path resource, ERR_SLOT_NOT_LOCKED, ERR_ORDER_IN_PRODUCTION, ERR_FRAUD_REVIEW_REQUIRED)"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: all state-transition endpoints
    note: "A CANCELLED order, a TERMINATED dealer, a DECIDED application, a SUPERSEDED proof, a non-REQUESTED return, a decided claim — every replay of a consumed transition lands here."

  - priority: 6
    category: state
    check: "Optimistic concurrency: expected_dealer_version / expected_drop_version equals the parent's current version (only on endpoints declaring the field; required whenever a matched dealer / lock decision is involved)"
    error_id: ERR_STALE_DEALER_VERSION | ERR_STALE_DROP_VERSION
    http_status: 412
    applies_to: "POST /drinkware/enforcement-cases/{id}/resolve, POST /drinkware/enforcement-cases/{id}/overturn, POST /drinkware/colorway-drops/{id}/lock-allocation"

  - priority: 7
    category: state
    check: "Cross-entity state gates: dealer must be AUTHORIZED for allocation requests; product line must be ACTIVE for order submit and drop creation; drop must be ALLOCATION_OPEN for requests; slot must be OPEN for reservations; artwork must be ART_APPROVED for peak-window reservations"
    error_id: ERR_DEALER_NOT_AUTHORIZED | ERR_PRODUCT_LINE_DISCONTINUED | ERR_DROP_NOT_OPEN_FOR_ALLOCATION | ERR_SLOT_NOT_OPEN | ERR_ARTWORK_NOT_APPROVED
    http_status: "403 | 409 | 409 | 409 | 409"
    applies_to: "allocation create, order submit, drop create, reserve-slot"

  - priority: 8
    category: business_safety
    check: "Segregation of duties and brand standards: application decide requires a decider distinct from the inspection recorder and the docs reviewer; approval requires a physical storefront and a brand presentation score >= 70"
    error_id: ERR_SOD_VIOLATION | ERR_STOREFRONT_REQUIRED | ERR_BRAND_STANDARD_BELOW_THRESHOLD
    http_status: "403 | 422 | 422"
    applies_to: "POST /drinkware/dealer-applications/{id}/decide"

  - priority: 9
    category: business_referential
    check: "Cross-references must be coherent: the order's colorway drop must belong to the order's product line; a DEALER-source claim's dealer must exist; a claim's order must match the claim's buyer/dealer"
    error_id: ERR_COLORWAY_NOT_AVAILABLE
    http_status: 422
    applies_to: "order submit, warranty claim create"

  - priority: 10
    category: business_temporal
    check: "Time-window rules: print-slot overlap incl. changeover buffer; inspector schedule conflict incl. travel buffer; allocation requests only while clock < allocation_closes_at; open-allocation only inside [opens_at, closes_at); lock only at/after closes_at; warranty filed before expiry; return requested within 45 days of completion; inspection recordable only at/after window end"
    error_id: ERR_SLOT_OVERLAP_CONFLICT | ERR_INSPECTOR_SCHEDULE_CONFLICT | ERR_ALLOCATION_WINDOW_CLOSED | ERR_ALLOCATION_WINDOW_NOT_OPEN | ERR_ALLOCATION_WINDOW_OPEN | ERR_WARRANTY_EXPIRED | ERR_RETURN_WINDOW_CLOSED | ERR_INSPECTION_WINDOW_NOT_REACHED
    http_status: "409 | 409 | 422 | 422 | 422 | 422 | 422 | 422"
    applies_to: "slot create, schedule-inspection, allocation create, open/lock-allocation, warranty claim create, request-return, record-inspection"

  - priority: 11
    category: business_constraint
    check: "Shape and uniqueness rules: quantity >= product line minimum; proof rounds <= 3; reservation minutes vs slot availability; capacity_minutes <= window minutes; window_end after window_start; one open application per dealer; one REQUESTED allocation per (dealer, drop); unique base_sku; return-resolution consistency; technology match; dtc_reserved_units <= total_units"
    error_id: ERR_BELOW_MINIMUM_QUANTITY | ERR_PROOF_ROUND_EXHAUSTED | ERR_CAPACITY_EXCEEDED | ERR_CAPACITY_EXCEEDS_WINDOW | ERR_INVALID_WINDOW_ORDER | ERR_APPLICATION_ALREADY_OPEN | ERR_DUPLICATE_ALLOCATION_REQUEST | ERR_DUPLICATE_SKU | ERR_RETURN_RESOLUTION_MISMATCH | ERR_TECHNOLOGY_MISMATCH | ERR_DTC_RESERVE_EXCEEDS_TOTAL
    http_status: "422 | 422 | 422 | 422 | 422 | 409 | 409 | 409 | 422 | 422 | 422"
    applies_to: "create/submit/reserve/return endpoints"

  - priority: 12
    category: business_fiscal
    check: "Dealer credit: outstanding_balance_cents + requested_units x dealer_unit_price_cents must be <= credit_limit_cents at allocation request time"
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /drinkware/launch-allocations"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Logical clock (test-driving) ---
  - method: POST
    path: "/drinkware/_clock/set_current_utc"
    description: "Sets the server's logical clock. Before any call to this endpoint the logical clock reads exactly 2026-09-01T00:00:00Z and never falls back to wall-clock time. Lazy status transitions (drop LIVE/CLOSED, slot CLOSED, infraction expiry) are re-evaluated from the new clock on subsequent reads and writes."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["no eager transitions; lazy re-evaluation on read/write"]

  # --- Dealers ---
  - method: POST
    path: "/drinkware/dealers"
    description: "Register a dealer (status PENDING until an application is approved)"
    roles: [PlatformAdmin]
    code: 201
    input: [legal_name, storefront_address, region_code, "tier?", "credit_limit_cents?", sell_through_pct, tenure_years]
    output: Dealer
    side_effects: ["status := PENDING, storefront_verified := false, brand_presentation_score := 0"]

  - method: GET
    path: "/drinkware/dealers/{id}"
    description: "Read a dealer (Dealer role: own record only)"
    roles: [PlatformAdmin, ChannelManager, Dealer, WarrantyAgent]
    code: 200
    input: []
    output: Dealer
    side_effects: ["recomputes infraction_points, outstanding_balance_cents, allocation_score from current clock"]

  - method: GET
    path: "/drinkware/dealers"
    description: "List dealers with filters and pagination"
    roles: [PlatformAdmin, ChannelManager, WarrantyAgent]
    code: 200
    input: ["status?", "tier?", "limit?", "offset?"]
    output: Dealer[]
    side_effects: []

  - method: POST
    path: "/drinkware/dealers/{id}/suspend"
    description: "Manually suspend an AUTHORIZED or PROBATION dealer; forfeits non-live-drop allocations"
    roles: [ChannelManager]
    code: 200
    input: [reason]
    output: Dealer
    side_effects: ["Dealer -> SUSPENDED", "allocation forfeit cascade (reason DEALER_SUSPENDED)", "increments Dealer.version by 1"]

  - method: POST
    path: "/drinkware/dealers/{id}/reinstate"
    description: "Reinstate a SUSPENDED dealer; landing state recomputed from live infraction points (AUTHORIZED when < 8, PROBATION when 8..11)"
    roles: [ChannelManager]
    code: 200
    input: []
    output: Dealer
    side_effects: ["Dealer SUSPENDED -> AUTHORIZED or PROBATION per recomputed points", "increments Dealer.version by 1"]

  - method: POST
    path: "/drinkware/dealers/{id}/terminate"
    description: "Terminate a dealer (terminal); forfeits non-live-drop allocations and rejects open applications"
    roles: [ChannelManager]
    code: 200
    input: [reason]
    output: Dealer
    side_effects: ["Dealer -> TERMINATED", "allocation forfeit cascade (reason DEALER_TERMINATED)", "open applications -> REJECTED", "increments Dealer.version by 1"]

  # --- Dealer applications ---
  - method: POST
    path: "/drinkware/dealer-applications"
    description: "Open an authorization application for a PENDING dealer; at most one application per dealer may be in SUBMITTED or VETTING (else ERR_APPLICATION_ALREADY_OPEN)"
    roles: [ChannelManager]
    code: 201
    input: [dealer_id, has_physical_storefront, storefront_sqft, document_refs]
    output: DealerApplication
    side_effects: ["status := SUBMITTED, inspection_status := UNSCHEDULED, docs_status := PENDING"]

  - method: GET
    path: "/drinkware/dealer-applications/{id}"
    description: "Read an application (Dealer role: own dealer's applications only)"
    roles: [ChannelManager, FieldInspector, Dealer]
    code: 200
    input: []
    output: DealerApplication
    side_effects: []

  - method: GET
    path: "/drinkware/dealer-applications"
    description: "List applications with filters and pagination"
    roles: [ChannelManager, FieldInspector]
    code: 200
    input: ["dealer_id?", "status?", "limit?", "offset?"]
    output: DealerApplication[]
    side_effects: []

  - method: POST
    path: "/drinkware/dealer-applications/{id}/schedule-inspection"
    description: "Schedule the site-visit window; inspector_user_id must equal the acting FieldInspector; conflicts with the inspector's other SCHEDULED windows per calculations.inspection_schedule_conflict"
    roles: [FieldInspector]
    code: 200
    input: [inspector_user_id, window_start, window_end]
    output: DealerApplication
    side_effects: ["inspection_status -> SCHEDULED", "status SUBMITTED -> VETTING", "inspector_user_id and window recorded"]

  - method: POST
    path: "/drinkware/dealer-applications/{id}/record-inspection"
    description: "Record the inspection outcome (only the assigned inspector; only once the window has ended)"
    roles: [FieldInspector]
    code: 200
    input: [outcome, brand_presentation_score]
    output: DealerApplication
    side_effects: ["inspection_status -> PASSED or FAILED", "inspection_recorded_by := acting X-User-ID"]

  - method: POST
    path: "/drinkware/dealer-applications/{id}/verify-documents"
    description: "Verify or reject the document leg of vetting"
    roles: [ChannelManager]
    code: 200
    input: [outcome]
    output: DealerApplication
    side_effects: ["docs_status -> VERIFIED or REJECTED", "docs_reviewed_by := acting X-User-ID", "status SUBMITTED -> VETTING"]

  - method: POST
    path: "/drinkware/dealer-applications/{id}/decide"
    description: "Authorization decision (the fork-join join): APPROVE requires PASSED inspection, VERIFIED docs, physical storefront, brand score >= 70, and segregation of duties"
    roles: [ChannelManager]
    code: 200
    input: [decision, decision_reason]
    output: DealerApplication
    side_effects: ["APPROVE: Dealer PENDING -> AUTHORIZED cascade (storefront_verified := true, brand_presentation_score copied)", "REJECT: application -> REJECTED"]

  # --- Enforcement cases ---
  - method: POST
    path: "/drinkware/enforcement-cases"
    description: "Open an unauthorized-reseller detection case from a marketplace listing"
    roles: [ChannelManager]
    code: 201
    input: [marketplace, seller_handle, listing_url, "matched_dealer_id?"]
    output: EnforcementCase
    side_effects: ["status := UNDER_REVIEW"]

  - method: GET
    path: "/drinkware/enforcement-cases/{id}"
    description: "Read an enforcement case (infraction_state computed from the clock)"
    roles: [ChannelManager, PlatformAdmin]
    code: 200
    input: []
    output: EnforcementCase
    side_effects: []

  - method: GET
    path: "/drinkware/enforcement-cases"
    description: "List enforcement cases with filters and pagination"
    roles: [ChannelManager, PlatformAdmin]
    code: 200
    input: ["matched_dealer_id?", "status?", "marketplace?", "limit?", "offset?"]
    output: EnforcementCase[]
    side_effects: []

  - method: POST
    path: "/drinkware/enforcement-cases/{id}/resolve"
    description: "Resolve a case: CONFIRMED_VIOLATION (from UNDER_REVIEW or ESCALATED_LEGAL), DISMISSED, or ESCALATED_LEGAL (from UNDER_REVIEW only). Confirming against a matched dealer requires expected_dealer_version (OCC) and infraction_category."
    roles: [ChannelManager]
    code: 200
    input: [outcome, "infraction_category?", "resolution_notes?", "expected_dealer_version?"]
    output: EnforcementCase
    side_effects: ["on matched CONFIRMED_VIOLATION: points table applied, issued_at/expires_at set, dealer_infraction_points recomputed, Dealer.version incremented, PROBATION/SUSPEND threshold cascade (incl. allocation forfeits) may fire"]

  - method: POST
    path: "/drinkware/enforcement-cases/{id}/overturn"
    description: "Overturn a CONFIRMED_VIOLATION (e.g. successful appeal); removes the points but never auto-restores dealer status"
    roles: [ChannelManager]
    code: 200
    input: [reason, "expected_dealer_version?"]
    output: EnforcementCase
    side_effects: ["status -> OVERTURNED", "matched dealer: points recompute excludes this case, increments Dealer.version by 1"]

  # --- Product lines ---
  - method: POST
    path: "/drinkware/product-lines"
    description: "Create a product line (hard cooler, soft good, or drinkware)"
    roles: [PlatformAdmin]
    code: 201
    input: [name, category, base_sku, base_custom_price_cents, map_price_cents, min_custom_quantity, warranty_months_lid, warranty_months_insulation, warranty_months_hardware]
    output: ProductLine
    side_effects: ["status := ACTIVE"]

  - method: GET
    path: "/drinkware/product-lines/{id}"
    description: "Read a product line"
    roles: [PlatformAdmin, ChannelManager, FieldInspector, Dealer, Buyer, PrepressTech, ProductionLead, WarrantyAgent, CustomerCare]
    code: 200
    input: []
    output: ProductLine
    side_effects: []

  - method: GET
    path: "/drinkware/product-lines"
    description: "List product lines with filters and pagination"
    roles: [PlatformAdmin, ChannelManager, FieldInspector, Dealer, Buyer, PrepressTech, ProductionLead, WarrantyAgent, CustomerCare]
    code: 200
    input: ["category?", "status?", "limit?", "offset?"]
    output: ProductLine[]
    side_effects: []

  - method: POST
    path: "/drinkware/product-lines/{id}/discontinue"
    description: "Discontinue a product line (terminal); new drops and new order submits are rejected"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: ProductLine
    side_effects: ["status -> DISCONTINUED"]

  # --- Colorway drops ---
  - method: POST
    path: "/drinkware/colorway-drops"
    description: "Announce a colorway drop or limited edition with its dealer/DTC unit split and allocation window"
    roles: [PlatformAdmin]
    code: 201
    input: [product_line_id, color_name, pantone_code, drop_type, total_units, dtc_reserved_units, dealer_unit_price_cents, allocation_opens_at, allocation_closes_at, go_live_at, sales_end_at]
    output: ColorwayDrop
    side_effects: ["status := ANNOUNCED; validates product line ACTIVE and window ordering opens < closes < go_live < sales_end"]

  - method: GET
    path: "/drinkware/colorway-drops/{id}"
    description: "Read a drop (lazy LIVE/CLOSED evaluation; unit ledgers recomputed)"
    roles: [PlatformAdmin, ChannelManager, FieldInspector, Dealer, Buyer, PrepressTech, ProductionLead, WarrantyAgent, CustomerCare]
    code: 200
    input: []
    output: ColorwayDrop
    side_effects: ["lazy clock transitions applied before responding"]

  - method: GET
    path: "/drinkware/colorway-drops"
    description: "List drops with filters and pagination"
    roles: [PlatformAdmin, ChannelManager, FieldInspector, Dealer, Buyer, PrepressTech, ProductionLead, WarrantyAgent, CustomerCare]
    code: 200
    input: ["product_line_id?", "status?", "limit?", "offset?"]
    output: ColorwayDrop[]
    side_effects: ["lazy clock transitions applied before responding"]

  - method: POST
    path: "/drinkware/colorway-drops/{id}/open-allocation"
    description: "Open the dealer allocation window (requires clock inside [allocation_opens_at, allocation_closes_at))"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: ColorwayDrop
    side_effects: ["status ANNOUNCED -> ALLOCATION_OPEN", "increments ColorwayDrop.version by 1"]

  - method: POST
    path: "/drinkware/colorway-drops/{id}/lock-allocation"
    description: "Close the window and distribute the dealer pool via largest-remainder allocation (OCC on the drop's request-set version)"
    roles: [PlatformAdmin]
    code: 200
    input: [expected_drop_version]
    output: ColorwayDrop
    side_effects: ["runs calculations.launch_allocation_distribution", "status ALLOCATION_OPEN -> ALLOCATION_LOCKED", "recomputes dealer_committed_units / unallocated_units", "increments ColorwayDrop.version by 1"]

  # --- Launch allocations ---
  - method: POST
    path: "/drinkware/launch-allocations"
    description: "Dealer requests units from an open drop (dealer_id must equal the acting Dealer identity)"
    roles: [Dealer]
    code: 201
    input: [dealer_id, drop_id, requested_units]
    output: LaunchAllocation
    side_effects: ["status := REQUESTED, unit_price_cents snapshot", "increments the drop's version by 1 (request-set membership changed)"]

  - method: GET
    path: "/drinkware/launch-allocations/{id}"
    description: "Read an allocation (Dealer role: own allocations only)"
    roles: [Dealer, PlatformAdmin, ChannelManager]
    code: 200
    input: []
    output: LaunchAllocation
    side_effects: []

  - method: GET
    path: "/drinkware/launch-allocations"
    description: "List allocations (Dealer role: dealer_id filter is forced to the acting dealer)"
    roles: [Dealer, PlatformAdmin, ChannelManager]
    code: 200
    input: ["dealer_id?", "drop_id?", "status?", "limit?", "offset?"]
    output: LaunchAllocation[]
    side_effects: []

  - method: POST
    path: "/drinkware/launch-allocations/{id}/forfeit"
    description: "Forfeit a REQUESTED or ALLOCATED allocation while its drop is not yet LIVE; ALLOCATED forfeits return units to the pool"
    roles: [Dealer, ChannelManager]
    code: 200
    input: []
    output: LaunchAllocation
    side_effects: ["status -> FORFEITED with forfeit_reason DEALER_CHOICE", "ALLOCATED: drop ledgers recompute", "increments the drop's version by 1"]

  # --- Customization orders ---
  - method: POST
    path: "/drinkware/customization-orders"
    description: "Create a customization order (buyer_ref must equal acting Buyer identity; existence of line/drop checked here, line/colorway state gates deferred to submit)"
    roles: [Buyer]
    code: 201
    input: [buyer_type, buyer_ref, product_line_id, colorway_drop_id, quantity, declared_color_count, declared_placement_count, print_technology, requested_ship_date]
    output: CustomizationOrder
    side_effects: ["all four axes at initial states; quote_variant := NONE"]

  - method: GET
    path: "/drinkware/customization-orders/{id}"
    description: "Read an order (Buyer role: own orders only)"
    roles: [Buyer, PlatformAdmin, ProductionLead, PrepressTech, CustomerCare, WarrantyAgent]
    code: 200
    input: []
    output: CustomizationOrder
    side_effects: []

  - method: GET
    path: "/drinkware/customization-orders"
    description: "List orders (Buyer role: buyer_ref filter forced to the acting buyer)"
    roles: [Buyer, PlatformAdmin, ProductionLead, CustomerCare]
    code: 200
    input: ["buyer_ref?", "product_line_id?", "colorway_drop_id?", "slot_id?", "schedule_status?", "reservation_status?", "limit?", "offset?"]
    output: CustomizationOrder[]
    side_effects: []

  - method: POST
    path: "/drinkware/customization-orders/{id}/submit"
    description: "Submit the order: validates MOQ, colorway match, line status; computes the PROVISIONAL quote and authorizes payment"
    roles: [Buyer]
    code: 200
    input: []
    output: CustomizationOrder
    side_effects: ["computes customization_quote_cents PROVISIONAL", "payment_status UNPAID -> AUTHORIZED"]

  - method: POST
    path: "/drinkware/customization-orders/{id}/cancel"
    description: "Cancel an order that is not yet in production; cancellation fee applies once art is approved; releases any reservation and triggers waitlist promotion"
    roles: [Buyer, PlatformAdmin]
    code: 200
    input: []
    output: CustomizationOrder
    side_effects: ["order_state -> CANCELLED", "cancellation fee + refund per calculations.return_refund_cents", "reservation release cascade with waitlist promotion", "payment_status -> REFUNDED only when it was AUTHORIZED or CAPTURED; UNPAID stays UNPAID"]

  - method: POST
    path: "/drinkware/customization-orders/{id}/reserve-slot"
    description: "Reserve print capacity on an OPEN slot; exact-fit allowed; insufficient capacity waitlists the order; peak-window slots require approved art"
    roles: [Buyer]
    code: 200
    input: [slot_id]
    output: CustomizationOrder
    side_effects: ["reservation_status -> HELD (schedule RESERVED) or WAITLISTED (schedule stays UNSCHEDULED)", "HELD: slot booked_minutes increases by reserved_minutes"]

  - method: POST
    path: "/drinkware/customization-orders/{id}/release-slot"
    description: "Release a HELD/CONFIRMED reservation or abandon a WAITLISTED spot; freed capacity promotes the waitlist per calculations.waitlist_promotion_order"
    roles: [Buyer]
    code: 200
    input: []
    output: CustomizationOrder
    side_effects: ["reservation_status -> RELEASED, schedule_status -> UNSCHEDULED", "slot booked_minutes reduced when HELD/CONFIRMED", "waitlist promotion cascade"]

  - method: POST
    path: "/drinkware/customization-orders/{id}/start-production"
    description: "Begin printing: requires a CONFIRMED reservation on a LOCKED slot"
    roles: [ProductionLead]
    code: 200
    input: []
    output: CustomizationOrder
    side_effects: ["schedule_status CONFIRMED -> IN_PRODUCTION"]

  - method: POST
    path: "/drinkware/customization-orders/{id}/complete-production"
    description: "Finish a production run: PASS completes the order and captures payment; FAIL loops back to CONFIRMED for rework"
    roles: [ProductionLead]
    code: 200
    input: [qc_outcome]
    output: CustomizationOrder
    side_effects: ["PASS: schedule COMPLETE, reservation CONSUMED, payment CAPTURED, completed_at := clock", "FAIL: schedule IN_PRODUCTION -> CONFIRMED, qc_fail_count += 1"]

  - method: POST
    path: "/drinkware/customization-orders/{id}/request-return"
    description: "Request a return on a completed, captured order within 45 days of completion"
    roles: [Buyer]
    code: 200
    input: [reason, affected_unit_count]
    output: CustomizationOrder
    side_effects: ["return_status NONE -> RETURN_REQUESTED, return_reason and affected_unit_count recorded"]

  - method: POST
    path: "/drinkware/customization-orders/{id}/decide-return"
    description: "Decide a return request; personalized goods are never restocked — BUYERS_REMORSE cannot be approved; approval settles immediately (refund or capacity re-booking for REMAKE)"
    roles: [CustomerCare]
    code: 200
    input: [decision, "resolution?", "decision_notes?"]
    output: CustomizationOrder
    side_effects: ["DENY -> RETURN_DENIED", "APPROVE -> RETURN_SETTLED with refund / remake side effects per the return axis"]

  # --- Artwork proofs ---
  - method: POST
    path: "/drinkware/artwork-proofs"
    description: "Submit a proof round for an order (max 3 rounds; supersedes a CHANGES_REQUESTED predecessor)"
    roles: [Buyer]
    code: 201
    input: [order_id, artwork_file_ref, color_count, placement_count, pantone_codes]
    output: ArtworkProof
    side_effects: ["order artwork axis NO_ART|CHANGES_REQUESTED -> PROOF_SUBMITTED, proof_round += 1", "prior CHANGES_REQUESTED proof -> SUPERSEDED"]

  - method: GET
    path: "/drinkware/artwork-proofs/{id}"
    description: "Read a proof (Buyer role: own orders' proofs only)"
    roles: [Buyer, PrepressTech, PlatformAdmin]
    code: 200
    input: []
    output: ArtworkProof
    side_effects: []

  - method: GET
    path: "/drinkware/artwork-proofs"
    description: "List proofs with filters and pagination"
    roles: [PrepressTech, PlatformAdmin]
    code: 200
    input: ["order_id?", "status?", "limit?", "offset?"]
    output: ArtworkProof[]
    side_effects: []

  - method: POST
    path: "/drinkware/artwork-proofs/{id}/approve"
    description: "Approve the latest proof round: computes the FINAL quote and confirms a held reservation"
    roles: [PrepressTech]
    code: 200
    input: []
    output: ArtworkProof
    side_effects: ["proof -> APPROVED", "order artwork_status -> ART_APPROVED", "computes customization_quote_cents FINAL", "reservation HELD -> CONFIRMED cascade"]

  - method: POST
    path: "/drinkware/artwork-proofs/{id}/request-changes"
    description: "Request artwork changes on the latest proof round (the third such request exhausts the order's proof rounds)"
    roles: [PrepressTech]
    code: 200
    input: [review_notes]
    output: ArtworkProof
    side_effects: ["proof -> CHANGES_REQUESTED", "order artwork_status -> CHANGES_REQUESTED (or PROOF_EXHAUSTED on round 3)"]

  # --- Print slots ---
  - method: POST
    path: "/drinkware/print-slots"
    description: "Open a capacity window on a print station; overlap rules per calculations.print_slot_overlap (half-open intervals, 20-minute cross-technology changeover)"
    roles: [ProductionLead]
    code: 201
    input: [station_code, technology, window_start, window_end, capacity_minutes]
    output: PrintSlot
    side_effects: ["status := OPEN; peak_overlap computed against PEAK_WINDOW"]

  - method: GET
    path: "/drinkware/print-slots/{id}"
    description: "Read a slot (lazy CLOSED evaluation; ledgers recomputed)"
    roles: [PlatformAdmin, ChannelManager, FieldInspector, Dealer, Buyer, PrepressTech, ProductionLead, WarrantyAgent, CustomerCare]
    code: 200
    input: []
    output: PrintSlot
    side_effects: ["lazy clock transitions applied before responding"]

  - method: GET
    path: "/drinkware/print-slots"
    description: "List slots with filters and pagination"
    roles: [PlatformAdmin, ChannelManager, FieldInspector, Dealer, Buyer, PrepressTech, ProductionLead, WarrantyAgent, CustomerCare]
    code: 200
    input: ["station_code?", "technology?", "status?", "limit?", "offset?"]
    output: PrintSlot[]
    side_effects: ["lazy clock transitions applied before responding"]

  - method: POST
    path: "/drinkware/print-slots/{id}/lock"
    description: "Lock a slot for production day; blocks new reservations; enables start-production for CONFIRMED orders"
    roles: [ProductionLead]
    code: 200
    input: []
    output: PrintSlot
    side_effects: ["status OPEN -> LOCKED"]

  # --- Warranty claims ---
  - method: POST
    path: "/drinkware/warranty-claims"
    description: "File a warranty claim (DTC buyers or dealers); warranty window and fraud flag computed at creation. When order_id is present the order must be schedule_status COMPLETE (else ERR_INVALID_STATE_TRANSITION) and the warranty anchors on its completed_at; otherwise purchase_date and product_line_id anchor and scope the claim."
    roles: [Buyer, Dealer, WarrantyAgent]
    code: 201
    input: [claim_source, serial_number, component, failure_description, "dealer_id?", "buyer_ref?", "order_id?", "product_line_id?", "purchase_date?"]
    output: WarrantyClaim
    side_effects: ["status := FILED", "warranty anchor and expiry resolved (order completed_at or purchase_date)", "fraud_flag computed from claimant history"]

  - method: GET
    path: "/drinkware/warranty-claims/{id}"
    description: "Read a claim (Buyer/Dealer roles: own claims only)"
    roles: [WarrantyAgent, PlatformAdmin, Dealer, Buyer]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: []

  - method: GET
    path: "/drinkware/warranty-claims"
    description: "List claims with filters and pagination"
    roles: [WarrantyAgent, PlatformAdmin]
    code: 200
    input: ["dealer_id?", "buyer_ref?", "order_id?", "product_line_id?", "status?", "limit?", "offset?"]
    output: WarrantyClaim[]
    side_effects: []

  - method: POST
    path: "/drinkware/warranty-claims/{id}/start-review"
    description: "Move a claim FILED -> UNDER_REVIEW (mandatory first step for fraud-flagged claims)"
    roles: [WarrantyAgent]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["status -> UNDER_REVIEW"]

  - method: POST
    path: "/drinkware/warranty-claims/{id}/decide"
    description: "Decide a claim: APPROVE_REPAIR, APPROVE_REPLACEMENT (with colorway-resolution cascade), or DENY"
    roles: [WarrantyAgent]
    code: 200
    input: [outcome, decision_reason]
    output: WarrantyClaim
    side_effects: ["APPROVE_REPLACEMENT: replacement_colorway_resolution computed; SAME_COLORWAY reserves a unit on the order's drop (warranty_reserved_units += 1)"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_MISSING_OR_INVALID_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing, or the role is not a declared role" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Role not listed on the endpoint, or ownership check failed (Dealer acting on another dealer's resources, Buyer on another buyer_ref's, FieldInspector on another inspector's window)" }
  # --- existence (404s, entity-specific) ---
  - { id: ERR_DEALER_NOT_FOUND, http: 404, condition: "No dealer with the given id" }
  - { id: ERR_APPLICATION_NOT_FOUND, http: 404, condition: "No dealer application with the given id" }
  - { id: ERR_CASE_NOT_FOUND, http: 404, condition: "No enforcement case with the given id" }
  - { id: ERR_PRODUCT_LINE_NOT_FOUND, http: 404, condition: "No product line with the given id" }
  - { id: ERR_DROP_NOT_FOUND, http: 404, condition: "No colorway drop with the given id" }
  - { id: ERR_ALLOCATION_NOT_FOUND, http: 404, condition: "No launch allocation with the given id" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "No customization order with the given id" }
  - { id: ERR_PROOF_NOT_FOUND, http: 404, condition: "No artwork proof with the given id" }
  - { id: ERR_SLOT_NOT_FOUND, http: 404, condition: "No print slot with the given id" }
  - { id: ERR_CLAIM_NOT_FOUND, http: 404, condition: "No warranty claim with the given id" }
  # --- generic request ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, wrong type, out-of-range value, unknown enum member, or a conditionally-required field absent (e.g. infraction_category on a matched confirmation, dealer_id on a DEALER-source claim)" }
  # --- state (409) ---
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "The target resource's current state does not permit the requested transition (replay of a consumed transition, terminal-state writes, decide on a decided application, etc.)" }
  - { id: ERR_APPLICATION_ALREADY_OPEN, http: 409, condition: "The dealer already has a SUBMITTED or VETTING application" }
  - { id: ERR_DROP_NOT_OPEN_FOR_ALLOCATION, http: 409, condition: "Allocation request or forfeit attempted while the drop is not ALLOCATION_OPEN / allocation not yet lockable state" }
  - { id: ERR_SLOT_NOT_OPEN, http: 409, condition: "Reservation or REMAKE re-booking attempted on a LOCKED or CLOSED slot" }
  - { id: ERR_SLOT_NOT_LOCKED, http: 409, condition: "start-production attempted while the order's slot is not LOCKED" }
  - { id: ERR_ORDER_IN_PRODUCTION, http: 409, condition: "Cancel or release-slot attempted on an order IN_PRODUCTION (or already COMPLETE)" }
  - { id: ERR_FRAUD_REVIEW_REQUIRED, http: 409, condition: "Decide attempted directly from FILED on a fraud_flagged claim; start-review is mandatory first" }
  - { id: ERR_PRODUCT_LINE_DISCONTINUED, http: 409, condition: "Order submit or drop creation references a DISCONTINUED product line" }
  - { id: ERR_DUPLICATE_ALLOCATION_REQUEST, http: 409, condition: "The dealer already has a REQUESTED allocation on this drop" }
  - { id: ERR_DUPLICATE_SKU, http: 409, condition: "base_sku already used by another product line" }
  # --- optimistic concurrency (412) ---
  - { id: ERR_STALE_DEALER_VERSION, http: 412, condition: "expected_dealer_version does not match the dealer's current version" }
  - { id: ERR_STALE_DROP_VERSION, http: 412, condition: "expected_drop_version does not match the drop's current version" }
  # --- cross-entity state ---
  - { id: ERR_DEALER_NOT_AUTHORIZED, http: 403, condition: "Allocation request from a dealer not in AUTHORIZED status (PENDING, PROBATION, SUSPENDED, TERMINATED)" }
  - { id: ERR_ARTWORK_NOT_APPROVED, http: 409, condition: "Peak-window reservation attempted while the order's artwork is not ART_APPROVED" }
  # --- business safety ---
  - { id: ERR_SOD_VIOLATION, http: 403, condition: "Application decider is the same X-User-ID as the inspection recorder or the docs reviewer" }
  - { id: ERR_STOREFRONT_REQUIRED, http: 422, condition: "APPROVE attempted on an application with has_physical_storefront = false" }
  - { id: ERR_BRAND_STANDARD_BELOW_THRESHOLD, http: 422, condition: "APPROVE attempted with brand_presentation_score < 70" }
  - { id: ERR_APPLICATION_INCOMPLETE, http: 422, condition: "APPROVE attempted before inspection PASSED and docs VERIFIED (the fork-join join is not satisfied)" }
  # --- business referential ---
  - { id: ERR_COLORWAY_NOT_AVAILABLE, http: 422, condition: "Order submit references a drop whose product_line_id differs from the order's, or a drop already CLOSED" }
  # --- business temporal ---
  - { id: ERR_SLOT_OVERLAP_CONFLICT, http: 409, condition: "New slot window collides with another slot on the same station_code (half-open overlap; < 20-minute cross-technology gap)" }
  - { id: ERR_INSPECTOR_SCHEDULE_CONFLICT, http: 409, condition: "Site-visit window collides with the inspector's other SCHEDULED windows (closed-interval overlap or < 60-minute travel gap)" }
  - { id: ERR_ALLOCATION_WINDOW_CLOSED, http: 422, condition: "Allocation request attempted at or after allocation_closes_at" }
  - { id: ERR_ALLOCATION_WINDOW_NOT_OPEN, http: 422, condition: "open-allocation attempted outside [allocation_opens_at, allocation_closes_at)" }
  - { id: ERR_ALLOCATION_WINDOW_OPEN, http: 422, condition: "lock-allocation attempted before allocation_closes_at" }
  - { id: ERR_WARRANTY_EXPIRED, http: 422, condition: "Claim filed at or after warranty_expires_at for the claimed component" }
  - { id: ERR_RETURN_WINDOW_CLOSED, http: 422, condition: "Return requested at or after completed_at + 45 days" }
  - { id: ERR_INSPECTION_WINDOW_NOT_REACHED, http: 422, condition: "record-inspection attempted before the scheduled window has ended" }
  # --- business constraint ---
  - { id: ERR_BELOW_MINIMUM_QUANTITY, http: 422, condition: "Order quantity below the product line's min_custom_quantity" }
  - { id: ERR_PROOF_ROUND_EXHAUSTED, http: 422, condition: "Fourth proof submission for an order (proof_round already 3)" }
  - { id: ERR_CAPACITY_EXCEEDED, http: 422, condition: "REMAKE re-booking requires more minutes than the slot currently has available" }
  - { id: ERR_CAPACITY_EXCEEDS_WINDOW, http: 422, condition: "capacity_minutes exceeds the slot window's duration in minutes" }
  - { id: ERR_INVALID_WINDOW_ORDER, http: 422, condition: "window_end <= window_start, or drop window fields not strictly ordered opens < closes < go_live < sales_end" }
  - { id: ERR_RETURN_RESOLUTION_MISMATCH, http: 422, condition: "PARTIAL_CREDIT with affected_unit_count == quantity, or PARTIAL_CREDIT for an ARTWORK_MISMATCH return" }
  - { id: ERR_PERSONALIZED_NOT_RETURNABLE, http: 422, condition: "Attempt to APPROVE a BUYERS_REMORSE return; personalized goods cannot be restocked" }
  - { id: ERR_TECHNOLOGY_MISMATCH, http: 422, condition: "reserve-slot on a slot whose technology differs from the order's print_technology" }
  - { id: ERR_DTC_RESERVE_EXCEEDS_TOTAL, http: 422, condition: "dtc_reserved_units > total_units on drop creation" }
  # --- business fiscal ---
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 422, condition: "Allocation request would push outstanding_balance_cents above the dealer's credit_limit_cents" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Brand operations administrator; owns catalog (product lines, drops, allocation windows), the logical clock, and dealer registration"
    identity: opaque
    exclusive_operations:
      - "POST /drinkware/_clock/set_current_utc"
      - "POST /drinkware/dealers"
      - "POST /drinkware/product-lines and /discontinue"
      - "POST /drinkware/colorway-drops, /open-allocation, /lock-allocation"
    shared_operations:
      - "reads of dealers, cases, allocations, orders, proofs, slots, claims"
      - "POST /drinkware/customization-orders/{id}/cancel (shared with Buyer)"

  - name: ChannelManager
    description: "Dealer channel manager; vets applications, manages dealer standing, runs marketplace enforcement"
    identity: opaque
    exclusive_operations:
      - "POST /drinkware/dealer-applications and /verify-documents and /decide"
      - "POST /drinkware/dealers/{id}/suspend, /reinstate, /terminate"
      - "POST /drinkware/enforcement-cases, /resolve, /overturn"
    shared_operations:
      - "reads of dealers, applications, cases, allocations"
      - "POST /drinkware/launch-allocations/{id}/forfeit (shared with Dealer)"

  - name: FieldInspector
    description: "Site-visit inspector; schedules and records storefront inspections (segregated from the authorization decision)"
    identity: opaque
    exclusive_operations:
      - "POST /drinkware/dealer-applications/{id}/schedule-inspection (own windows only)"
      - "POST /drinkware/dealer-applications/{id}/record-inspection (own inspections only)"
    shared_operations:
      - "reads of applications, product lines, drops, slots"

  - name: Dealer
    description: "Authorized dealer account; requests launch allocations and files dealer-source warranty claims"
    identity: "entity_backed:Dealer"
    exclusive_operations:
      - "POST /drinkware/launch-allocations (dealer_id must equal X-User-ID)"
    shared_operations:
      - "POST /drinkware/launch-allocations/{id}/forfeit (own allocations)"
      - "POST /drinkware/warranty-claims with claim_source DEALER (dealer_id == X-User-ID)"
      - "reads of own dealer record, own applications/allocations, catalog"

  - name: Buyer
    description: "Corporate or individual customization buyer; owns orders, proofs, returns, and DTC warranty claims"
    identity: opaque
    exclusive_operations:
      - "POST /drinkware/customization-orders, /submit, /reserve-slot, /release-slot, /request-return (buyer_ref == X-User-ID)"
      - "POST /drinkware/artwork-proofs (on own orders)"
    shared_operations:
      - "POST /drinkware/customization-orders/{id}/cancel (shared with PlatformAdmin)"
      - "POST /drinkware/warranty-claims with claim_source DTC (buyer_ref == X-User-ID)"
      - "reads of own orders/proofs, catalog, slots"

  - name: PrepressTech
    description: "Prepress reviewer; approves or rejects artwork proofs (segregated from proof submission, which is the Buyer's)"
    identity: opaque
    exclusive_operations:
      - "POST /drinkware/artwork-proofs/{id}/approve"
      - "POST /drinkware/artwork-proofs/{id}/request-changes"
    shared_operations:
      - "reads of orders, proofs, catalog, slots"

  - name: ProductionLead
    description: "Print-floor lead; owns capacity windows and production progression"
    identity: opaque
    exclusive_operations:
      - "POST /drinkware/print-slots and /lock"
      - "POST /drinkware/customization-orders/{id}/start-production and /complete-production"
    shared_operations:
      - "reads of orders, slots, catalog"

  - name: WarrantyAgent
    description: "Warranty claims adjuster; reviews and decides claims"
    identity: opaque
    exclusive_operations:
      - "POST /drinkware/warranty-claims/{id}/start-review and /decide"
    shared_operations:
      - "POST /drinkware/warranty-claims (shared with Buyer/Dealer for intake)"
      - "reads of dealers, claims, orders, catalog"

  - name: CustomerCare
    description: "Customer care lead; decides customization return requests"
    identity: opaque
    exclusive_operations:
      - "POST /drinkware/customization-orders/{id}/decide-return"
    shared_operations:
      - "reads of orders, catalog"
