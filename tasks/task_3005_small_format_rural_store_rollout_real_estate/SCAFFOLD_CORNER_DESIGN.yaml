              as: PROGRAM_ADMIN
            - call: "POST /rollouts/trade-areas"
              payload: { rollout_program_id: "${rid}", name: "B", drive_time_minutes: 10, household_count: 5000, median_household_income_cents: 5000000, grocery_gap_pct: 40 }
              as: PROGRAM_ADMIN
