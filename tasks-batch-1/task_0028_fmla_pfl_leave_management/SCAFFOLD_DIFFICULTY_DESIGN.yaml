              as: HRAdmin
              captures: { worker1249_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /leave/cases"
              payload: { employee_id: "${worker1250_id}", qualifying_reason: "OWN_SERIOUS_HEALTH_CONDITION", leave_type: "CONTINUOUS", requested_start_at: "2026-06-01T00:00:00.000Z", requested_end_at: "2026-07-01T00:00:00.000Z" }
              as: HRAdmin
              captures: { case1250_id: $.data.id }
            - call: "POST /leave/cases"
              payload: { employee_id: "${worker1249_id}", qualifying_reason: "OWN_SERIOUS_HEALTH_CONDITION", leave_type: "CONTINUOUS", requested_start_at: "2026-06-01T00:00:00.000Z", requested_end_at: "2026-07-01T00:00:00.000Z" }
              as: HRAdmin
              captures: { case1249_id: $.data.id }
          trigger:
            - call: "POST /leave/cases/${case1250_id}/evaluate-eligibility"
