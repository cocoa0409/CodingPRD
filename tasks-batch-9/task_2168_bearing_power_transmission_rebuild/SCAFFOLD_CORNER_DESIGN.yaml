              captures: { core_id: $.data.id }
            - call: "POST /shop/rebuild-orders"
              payload: { customer_id: "${cust_id}", core_unit_id: "${core_id}", customer_asset_id: "${asset_id}", labor_hours: 4.0 }
              as: Planner
              captures: { order_id: $.data.id }
            - call: "POST /shop/vibration-readings"
              payload: { customer_asset_id: "${asset_id}", reading_at: "2026-08-02T06:00:00Z", overall_velocity_mm_s: 2.10, bpfo_amplitude_g: 0.30, bpfi_amplitude_g: 0.25, baseline_amplitude_g: 0.20 }
              as: ReliabilityEngineer
              captures: { vr_id: $.data.id }
            - call: "POST /shop/inspections"
              payload: { rebuild_order_id: "${order_id}", linked_vibration_reading_id: "${vr_id}" }
              as: Inspector
              as_user_id: "insp-1"
              captures: { insp_id: $.data.id }
            - call: "POST /shop/inspections/${insp_id}/measurements"
              payload: { feature_code: "BORE", measured_um: 85 }
              as: Inspector
              as_user_id: "insp-1"
            - call: "POST /shop/inspections/${insp_id}/advance"
              payload: { action: "SUBMIT" }
              as: Inspector
              as_user_id: "insp-1"
          trigger:
            - call: "POST /shop/inspections/${insp_id}/advance"
              payload: { action: "ACCEPT" }
              as: Inspector
              as_user_id: "insp-1"
              captures: { err: $.data.error_id }
            - call: "POST /shop/inspections/${insp_id}/advance"
              payload: { action: "ACCEPT" }
              as: Inspector
              as_user_id: "insp-9"
          assert:
            - "the self-acceptance returns HTTP 403 with error_id == ERR_SEGREGATION_OF_DUTIES"
            - "after the rejected attempt Inspection.${insp_id}.status == SUBMITTED and CoreUnit.${core_id}.status == INSPECTING"
            - "after the rejected attempt Customer.${cust_id}.core_credit_balance_cents == 67500 (still the provisional value)"
            - "the second inspector's ACCEPT returns HTTP 200 with accepted_by_user_id == insp-9"
            - "CoreUnit.${core_id}.final_core_credit_cents == 90000 and Customer.${cust_id}.core_credit_balance_cents == 90000"

  # ===========================================================================
  - section: cross_cutting_layers
    instances:

      - name: occ_stale_order_version_rejects_a_second_part_line_create
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[part-line-create-stale-order]
          - validations[priority=8]
          - errors[ERR_STALE_VERSION]
          - endpoints[POST /shop/rebuild-orders/{id}/part-lines]
        distinguishing_aspect: "The first part-line create advances RebuildOrder.version, so a second create still carrying the version observed before it returns HTTP 412 ERR_STALE_VERSION; re-reading the order and retrying with the fresh version succeeds."
        test_recipe:
          setup:
            - "One DRAFT order with no part lines and a freshly read version."
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { name: "OCC Mill", account_code: "OCC-001" }
              as: ShopAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /shop/customers/${cust_id}/assets"
              payload: { asset_tag: "OCC-01-GBX", criticality: "STANDARD", duty_class: "CONTINUOUS" }
              as: ShopAdmin
              captures: { asset_id: $.data.id }
            - call: "POST /shop/clearance-standards"
              payload: { model_code: "SKF-22324-CCK", base_core_value_cents: 90000, max_rebuild_count: 3, warranty_hours: 8000, warranty_months: 18, cleanroom_required: false, required_feature_codes: ["BORE"], feature_bands: [{feature_code: "BORE", min_um: 40, max_um: 90, rework_extension_um: 15, deduction_pct: 0.10, weight: 0.40}] }
              as: ShopAdmin
              captures: { std_id: $.data.id }
            - call: "POST /shop/core-units"
              payload: { customer_id: "${cust_id}", clearance_standard_id: "${std_id}", serial_no: "SN-OCC-1", rebuild_count: 0, declared_condition_grade: "GRADE_B" }
              as: ShopAdmin
              captures: { core_id: $.data.id }
            - call: "POST /shop/rebuild-orders"
              payload: { customer_id: "${cust_id}", core_unit_id: "${core_id}", customer_asset_id: "${asset_id}", labor_hours: 4.0 }
              as: Planner
              captures: { order_id: $.data.id }
            - call: "GET /shop/rebuild-orders/${order_id}"
              as: Planner
              captures: { v_stale: $.data.version }
          trigger:
            - call: "POST /shop/rebuild-orders/${order_id}/part-lines"
              payload: { part_no: "BRG-22324", source_class: "OEM", qty: 1, unit_cost_cents: 40000, expected_order_version: "${v_stale}" }
              as: Planner
              captures: { pl_1: $.data.id }
            - call: "POST /shop/rebuild-orders/${order_id}/part-lines"
              payload: { part_no: "SEAL-9", source_class: "OEM", qty: 1, unit_cost_cents: 5000, expected_order_version: "${v_stale}" }
              as: Planner
              captures: { err: $.data.error_id }
            - call: "GET /shop/rebuild-orders/${order_id}"
              as: Planner
              captures: { v_fresh: $.data.version }
            - call: "POST /shop/rebuild-orders/${order_id}/part-lines"
              payload: { part_no: "SEAL-9", source_class: "OEM", qty: 1, unit_cost_cents: 5000, expected_order_version: "${v_fresh}" }
              as: Planner
              captures: { pl_2: $.data.id }
          assert:
            - "the first create returns HTTP 201 and RebuildOrder.${order_id}.version advanced past ${v_stale}"
            - "the second create carrying ${v_stale} returns HTTP 412 with error_id == ERR_STALE_VERSION"
            - "the rejected create left RebuildOrder.${order_id}.part_revision_counter == 1"
            - "the retry with ${v_fresh} returns HTTP 201"
            - "GET /shop/rebuild-orders/${order_id}/part-lines returns total_count == 2"

      - name: occ_stale_customer_version_rejects_a_manual_credit_note
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[credit-note-issue-stale-customer]
          - validations[priority=8]
          - errors[ERR_STALE_VERSION]
          - calculations.customer_credit_balances
        distinguishing_aspect: "Receiving a core posts an exchange credit and advances Customer.version, so an adjustment computed against the pre-receipt version returns HTTP 412 ERR_STALE_VERSION and leaves the balance at the exchange credit alone."
        test_recipe:
          setup:
            - "One customer read before any core is received, plus a standard to receive against."
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { name: "Ledger OCC Mill", account_code: "OCC-002" }
              as: ShopAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /shop/clearance-standards"
              payload: { model_code: "SKF-22324-CCK", base_core_value_cents: 90000, max_rebuild_count: 3, warranty_hours: 8000, warranty_months: 18, cleanroom_required: false, required_feature_codes: ["BORE"], feature_bands: [{feature_code: "BORE", min_um: 40, max_um: 90, rework_extension_um: 15, deduction_pct: 0.10, weight: 0.40}] }
              as: ShopAdmin
              captures: { std_id: $.data.id }
            - call: "GET /shop/customers/${cust_id}"
              as: ShopAdmin
              captures: { cv_stale: $.data.version }
          trigger:
            - call: "POST /shop/core-units"
              payload: { customer_id: "${cust_id}", clearance_standard_id: "${std_id}", serial_no: "SN-OCC-2", rebuild_count: 1, declared_condition_grade: "GRADE_D" }
              as: ShopAdmin
              captures: { core_id: $.data.id }
            - call: "POST /shop/customers/${cust_id}/credit-notes"
              payload: { amount_cents: 5000, memo: "computed against a stale balance", expected_customer_version: "${cv_stale}" }
              as: ShopAdmin
              captures: { err: $.data.error_id }
            - call: "GET /shop/customers/${cust_id}"
              as: ShopAdmin
              captures: { cv_fresh: $.data.version }
            - call: "POST /shop/customers/${cust_id}/credit-notes"
              payload: { amount_cents: 5000, memo: "re-posted against the fresh balance", expected_customer_version: "${cv_fresh}" }
              as: ShopAdmin
              captures: { note_id: $.data.id }
          assert:
            - "the core receipt posts a CORE_EXCHANGE note of 10800 and advances Customer.${cust_id}.version past ${cv_stale}"
            - "the note carrying ${cv_stale} returns HTTP 412 with error_id == ERR_STALE_VERSION"
            - "immediately after the rejection Customer.${cust_id}.total_credit_balance_cents == 10800"
            - "the retry with ${cv_fresh} returns HTTP 201 with kind == MANUAL_ADJUSTMENT"
            - "Customer.${cust_id}.manual_credit_balance_cents == 5000 and total_credit_balance_cents == 15800"

      - name: occ_stale_asset_version_rejects_an_installation
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[installation-create-stale-asset]
          - validations[priority=8]
          - errors[ERR_STALE_VERSION]
          - errors[ERR_UNIT_NOT_DELIVERED]
        distinguishing_aspect: "The asset OCC check sits at priority 8, ahead of the priority-11 delivery gate: an installation carrying a version one behind the asset's current one returns HTTP 412 ERR_STALE_VERSION even though the referenced order is only DRAFT and would otherwise fail with ERR_UNIT_NOT_DELIVERED."
        test_recipe:
          setup:
            - "One asset read at its current version, and one DRAFT order whose core has never been shipped."
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { name: "Asset OCC Mill", account_code: "OCC-003" }
              as: ShopAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /shop/customers/${cust_id}/assets"
              payload: { asset_tag: "OCC-03-GBX", criticality: "STANDARD", duty_class: "CONTINUOUS" }
              as: ShopAdmin
              captures: { asset_id: $.data.id }
            - call: "POST /shop/clearance-standards"
              payload: { model_code: "SKF-22324-CCK", base_core_value_cents: 90000, max_rebuild_count: 3, warranty_hours: 8000, warranty_months: 18, cleanroom_required: false, required_feature_codes: ["BORE"], feature_bands: [{feature_code: "BORE", min_um: 40, max_um: 90, rework_extension_um: 15, deduction_pct: 0.10, weight: 0.40}] }
              as: ShopAdmin
              captures: { std_id: $.data.id }
            - call: "POST /shop/core-units"
              payload: { customer_id: "${cust_id}", clearance_standard_id: "${std_id}", serial_no: "SN-OCC-3", rebuild_count: 0, declared_condition_grade: "GRADE_B" }
              as: ShopAdmin
              captures: { core_id: $.data.id }
            - call: "POST /shop/rebuild-orders"
              payload: { customer_id: "${cust_id}", core_unit_id: "${core_id}", customer_asset_id: "${asset_id}", labor_hours: 4.0 }
              as: Planner
              captures: { order_id: $.data.id }
            - call: "GET /shop/assets/${asset_id}"
              as: ShopAdmin
              captures: { av: $.data.version }
          trigger:
            - call: "POST /shop/installations"
              payload: { core_unit_id: "${core_id}", customer_asset_id: "${asset_id}", rebuild_order_id: "${order_id}", expected_asset_version: "${av} - 1" }
              as: ShopAdmin
              captures: { e_stale: $.data.error_id }
            - call: "POST /shop/installations"
              payload: { core_unit_id: "${core_id}", customer_asset_id: "${asset_id}", rebuild_order_id: "${order_id}", expected_asset_version: "${av}" }
              as: ShopAdmin
              captures: { e_gate: $.data.error_id }
          assert:
            - "the install carrying a version one behind ${av} returns HTTP 412 with error_id == ERR_STALE_VERSION"
            - "the same install with the correct ${av} returns HTTP 409 with error_id == ERR_UNIT_NOT_DELIVERED"
            - "CustomerAsset.${asset_id}.version is unchanged after both rejections"
            - "GET /shop/installations?customer_asset_id=${asset_id} returns total_count == 0"

      - name: cascading_side_effects_layer_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Inspection.SUBMITTED_to_ACCEPTED
          - state_machines.RebuildOrder.DRAFT_to_CANCELLED
        excluded_because:
          difficulty_instance: transitive_cascade / inspection_accept_five_hop_ledger_cascade
          rationale: "Both multi-hop chains and their ordering are asserted hop by hop by the two §1.8 transitive_cascade instances."

      - name: dual_variant_calculation_layer_divergence
        claim_type: dual_variant_calculation
        grounds:
          - calculations.core_credit_valuation
          - calculations.warranty_pro_rata_credit
        excluded_because:
          difficulty_instance: dual_variant_calc / core_credit_provisional_vs_final_diverge_on_same_core
          rationale: "The provisional-versus-final and hours-versus-calendar divergences are both pinned to literal cents by the §1.8 dual_variant_calc instances."

      - name: rate_threshold_trigger_at_the_expedite_tier_floor
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.order_quote_total
        excluded_because:
          difficulty_instance: combinatorial_formula / expedite_surcharge_tier_then_credit_cap_evaluation_order
          rationale: "The §1.8 instance pins the mid tier and the §1.9 calculations instance expedite_low_tier_applies_thirty_percent_below_the_hundred_thousand_floor pins both sides of the floor."

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: cascaded_fields_are_visible_in_the_response_that_caused_them
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - state_machines.Inspection.SUBMITTED_to_ACCEPTED
          - calculations.customer_credit_balances
        distinguishing_aspect: "The consistency model is immediate: the ACCEPT response already reports status ACCEPTED, and a read issued straight afterwards - with no intervening write - shows the core GRADED, the new note POSTED and the customer's balance moved, with no lag."
        test_recipe:
          setup:
            - "One SUBMITTED inspection on a rebuild_count 0 core whose provisional credit is 67500."
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { name: "Immediate Mill", account_code: "IMD-001" }
              as: ShopAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /shop/customers/${cust_id}/assets"
              payload: { asset_tag: "IMD-01-GBX", criticality: "STANDARD", duty_class: "CONTINUOUS" }
              as: ShopAdmin
              captures: { asset_id: $.data.id }
            - call: "POST /shop/clearance-standards"
              payload: { model_code: "SKF-22324-CCK", base_core_value_cents: 90000, max_rebuild_count: 3, warranty_hours: 8000, warranty_months: 18, cleanroom_required: false, required_feature_codes: ["BORE"], feature_bands: [{feature_code: "BORE", min_um: 40, max_um: 90, rework_extension_um: 15, deduction_pct: 0.10, weight: 0.40}] }
              as: ShopAdmin
              captures: { std_id: $.data.id }
            - call: "POST /shop/core-units"
              payload: { customer_id: "${cust_id}", clearance_standard_id: "${std_id}", serial_no: "SN-IMD-1", rebuild_count: 0, declared_condition_grade: "GRADE_B" }
              as: ShopAdmin
              captures: { core_id: $.data.id }
            - call: "POST /shop/rebuild-orders"
              payload: { customer_id: "${cust_id}", core_unit_id: "${core_id}", customer_asset_id: "${asset_id}", labor_hours: 4.0 }
              as: Planner
              captures: { order_id: $.data.id }
            - call: "POST /shop/vibration-readings"
              payload: { customer_asset_id: "${asset_id}", reading_at: "2026-08-02T06:00:00Z", overall_velocity_mm_s: 2.10, bpfo_amplitude_g: 0.30, bpfi_amplitude_g: 0.25, baseline_amplitude_g: 0.20 }
              as: ReliabilityEngineer
              captures: { vr_id: $.data.id }
            - call: "POST /shop/inspections"
              payload: { rebuild_order_id: "${order_id}", linked_vibration_reading_id: "${vr_id}" }
              as: Inspector
              as_user_id: "insp-1"
              captures: { insp_id: $.data.id }
            - call: "POST /shop/inspections/${insp_id}/measurements"
              payload: { feature_code: "BORE", measured_um: 85 }
              as: Inspector
              as_user_id: "insp-1"
            - call: "POST /shop/inspections/${insp_id}/advance"
              payload: { action: "SUBMIT" }
              as: Inspector
              as_user_id: "insp-1"
          trigger:
            - call: "POST /shop/inspections/${insp_id}/advance"
              payload: { action: "ACCEPT" }
              as: Inspector
              as_user_id: "insp-2"
            - call: "GET /shop/core-units/${core_id}"
              as: ShopAdmin
            - call: "GET /shop/customers/${cust_id}"
              as: ShopAdmin
            - call: "GET /shop/credit-notes"
              payload: { customer_id: "${cust_id}" }
              as: ShopAdmin
          assert:
            - "the ACCEPT response itself already reports status == ACCEPTED and remaining_life_grade == GRADE_A"
            - "the immediately following core read reports status == GRADED, condition_grade == GRADE_A and final_core_credit_cents == 90000"
            - "the immediately following customer read reports core_credit_balance_cents == 90000 and total_credit_balance_cents == 90000"
            - "GET /shop/credit-notes?customer_id=${cust_id} returns total_count == 2, one VOID at 67500 and one POSTED at 90000"
            - "no second request is needed for any of these values to settle"
