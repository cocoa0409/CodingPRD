              captures: { v_after: $.data.version }
            - call: "GET /provost/decision-records"
              payload: { cycle_id: "${cycle_id}", limit: 10, offset: 0 }
              as: Provost
              as_user_id: "provost-second"
            - call: "POST /provost/review-cycles/${cycle_id}/decision-records"
              payload: { outcome: "IMPROVEMENT_PLAN", rationale: "Second reading: give them a year.", effective_term_index: 4, improvement_target_score: 55.00, improvement_review_term_index: 6, improvement_milestones: ["Recruit two cohorts"], expected_cycle_version: "${v_after}" }
              as: Provost
              as_user_id: "provost-second"
              captures: { dec2_id: $.data.id }
