            - "BereavementCase.${bc_id}.status == CLOSED"

  # =========================================================================
  # Calculations
  # =========================================================================
  - section: calculations
    instances:
      - name: respite_per_diem_correct_result
        claim_type: Correct Result
        grounds:
          - calculations.day_per_diem
          - entities.CareDay.fields.payment_cents
          - endpoints["POST /hospice/care-days"]
        distinguishing_aspect: "A RESPITE day pays exactly RESPITE_CENTS == 47000 regardless of elapsed day index."
        test_recipe:
          setup:
            - "Election elected 2026-01-02; clock 2026-01-02."
          setup_api_calls:
            - call: "POST /hospice/providers"
              payload: { name: "CalRes Hospice", cap_year_start: "2026-01-01T00:00:00Z", per_beneficiary_cap_cents: 3490000 }
              as: BillingAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-02T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /hospice/elections"
              payload: { provider_id: "${prov_id}", patient_name: "Res Pt", election_date: "2026-01-02T00:00:00Z", attending_physician_id: "ext-att-c18" }
              as: IntakeCoordinator
              captures: { e_id: $.data.id }
          trigger:
            - call: "POST /hospice/care-days"
              payload: { election_id: "${e_id}", service_date: "2026-01-02T00:00:00Z", level_of_care: "RESPITE", high_intensity: false }
              as: ClinicalManager
              captures: { cd_id: $.data.id }
          assert:
            - "CareDay.${cd_id}.payment_cents == 47000"
            - "CareDay.${cd_id}.respite_run_length == 1"

      - name: benefit_period_sequencing_constants_applied
        claim_type: Constants Applied
        grounds:
          - calculations.period_sequencing
          - entities.BenefitPeriod.fields.length_days
          - entities.BenefitPeriod.fields.start_offset_days
          - endpoints["GET /hospice/elections/{id}/benefit-periods"]
        distinguishing_aspect: "Period 1 has length_days 90 and start_offset_days 0 (the 90/90/60 cadence constants), materialized at election."
        test_recipe:
          setup:
            - "Election elected 2026-01-01; clock 2026-01-01."
          setup_api_calls:
            - call: "POST /hospice/providers"
              payload: { name: "CalSeq Hospice", cap_year_start: "2026-01-01T00:00:00Z", per_beneficiary_cap_cents: 3490000 }
              as: BillingAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /hospice/elections"
              payload: { provider_id: "${prov_id}", patient_name: "Seq Pt", election_date: "2026-01-01T00:00:00Z", attending_physician_id: "ext-att-c19" }
              as: IntakeCoordinator
              captures: { e_id: $.data.id }
          trigger:
            - call: "GET /hospice/elections/${e_id}/benefit-periods"
              payload: {}
              as: ClinicalManager
          assert:
            - "data array length == 1"
            - "data[0].sequence == 1"
            - "data[0].length_days == 90"
            - "data[0].start_offset_days == 0"

      - name: cap_summary_input_set_filters_in_window_caredays
        claim_type: Input Set Filtering
        grounds:
          - calculations.provisional_cap_liability
          - entities.Provider.fields.total_paid_cents
          - endpoints["GET /hospice/providers/{id}/cap-summary"]
        distinguishing_aspect: "A single in-window GIP day (110000) yields total_paid_cents 110000; only care-days inside [cap_year_start, +365d) are summed."
        test_recipe:
          setup:
            - "Provider cap_year_start 2026-01-01; election with 1 GIP day on 2026-01-02 (in window); clock 2026-01-02."
          setup_api_calls:
            - call: "POST /hospice/providers"
              payload: { name: "CalFilt Hospice", cap_year_start: "2026-01-01T00:00:00Z", per_beneficiary_cap_cents: 3490000 }
              as: BillingAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-02T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /hospice/elections"
              payload: { provider_id: "${prov_id}", patient_name: "Filt Pt", election_date: "2026-01-02T00:00:00Z", attending_physician_id: "ext-att-c20" }
              as: IntakeCoordinator
              captures: { e_id: $.data.id }
            - call: "POST /hospice/care-days"
              payload: { election_id: "${e_id}", service_date: "2026-01-02T00:00:00Z", level_of_care: "GIP", high_intensity: false }
              as: ClinicalManager
          trigger:
            - call: "GET /hospice/providers/${prov_id}/cap-summary"
              payload: {}
              as: BillingAdmin
          assert:
            - "Provider.${prov_id}.total_paid_cents == 110000"
            - "Provider.${prov_id}.counted_beneficiaries == 1"

      - name: settle_cap_freezes_final_liability
        claim_type: Reconciliation
        grounds:
          - calculations.final_cap_settlement
          - entities.Provider.fields.cap_settled
          - entities.Provider.fields.cap_liability_cents
          - endpoints["POST /hospice/providers/{id}/settle-cap"]
        distinguishing_aspect: "Settling a provider whose single beneficiary spent 330000 against a 200000 per-beneficiary cap freezes cap_liability_cents at 130000 and sets cap_settled=true."
        test_recipe:
          setup:
            - "Provider per_beneficiary_cap_cents 200000; one election with 3 GIP days (330000); clock 2026-01-10."
          setup_api_calls:
            - call: "POST /hospice/providers"
              payload: { name: "CalSettle Hospice", cap_year_start: "2026-01-01T00:00:00Z", per_beneficiary_cap_cents: 200000 }
              as: BillingAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-02T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /hospice/elections"
              payload: { provider_id: "${prov_id}", patient_name: "Settle Pt", election_date: "2026-01-02T00:00:00Z", attending_physician_id: "ext-att-c21" }
              as: IntakeCoordinator
              captures: { e_id: $.data.id }
            - call: "POST /hospice/care-days"
              payload: { election_id: "${e_id}", service_date: "2026-01-02T00:00:00Z", level_of_care: "GIP", high_intensity: false }
              as: ClinicalManager
            - call: "POST /hospice/care-days"
              payload: { election_id: "${e_id}", service_date: "2026-01-03T00:00:00Z", level_of_care: "GIP", high_intensity: false }
              as: ClinicalManager
            - call: "POST /hospice/care-days"
              payload: { election_id: "${e_id}", service_date: "2026-01-04T00:00:00Z", level_of_care: "GIP", high_intensity: false }
              as: ClinicalManager
          trigger:
            - call: "POST /hospice/providers/${prov_id}/settle-cap"
              payload: {}
              as: BillingAdmin
              captures: { liab: $.data.cap_liability_cents, settled: $.data.cap_settled }
          assert:
            - "Provider.${prov_id}.cap_liability_cents == 130000"
            - "Provider.${prov_id}.cap_settled == true"

      - name: careday_posting_after_settlement_rejected
        claim_type: Precision
        grounds:
          - validations[priority=5]
          - entities.Provider.fields.cap_settled
          - errors[ERR_CAP_YEAR_SETTLED]
          - endpoints["POST /hospice/care-days"]
        distinguishing_aspect: "Posting a care-day dated inside a settled cap year returns ERR_CAP_YEAR_SETTLED (the frozen window is immutable)."
        test_recipe:
          setup:
            - "Provider settled for 2026 cap year; election under it; clock 2026-01-10."
          setup_api_calls:
            - call: "POST /hospice/providers"
              payload: { name: "CalLock Hospice", cap_year_start: "2026-01-01T00:00:00Z", per_beneficiary_cap_cents: 3490000 }
              as: BillingAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
