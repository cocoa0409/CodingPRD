              as: SortSupervisor
            - call: "POST /sortation/trailer-appointments"
              payload: { sort_center_id: "${center_id}", door_id: "${door_in_id}", trailer_code: "T-A", window_start: "2026-08-03T09:00:00Z", window_end: "2026-08-03T10:00:00Z", priority_class: "STANDARD", manifest_package_count: 100 }
