              as: EvidenceTechnician
              as_user_id: "${tech_id}"
              captures: { found_mail_item: $.data.id }
            - call: "POST /evidence-items"
              payload: { case_id: "${case1_id}", item_description: "Seized toolbox", category: "GENERAL", packaging_type: "RIGID_BOX", appraised_value_cents: 8000, seized_at: "2026-07-31T12:00:00Z" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
              captures: { seized_item: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T00:00:00Z" }
              as: PropertyRoomManager
          trigger:
            - call: "POST /owner-claims"
              payload: { evidence_item_id: "${found_pub_item}", claimant_name: "Unknown owner", claimant_contact: "Legal notices page 4", notice_method: "PUBLICATION" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
              captures: { pub_deadline: $.data.claim_deadline_at, pub_notified: $.data.notified_at }
            - call: "POST /owner-claims"
              payload: { evidence_item_id: "${found_mail_item}", claimant_name: "Dana Vale", claimant_contact: "12 Fern Street", notice_method: "CERTIFIED_MAIL" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
              captures: { mail_deadline: $.data.claim_deadline_at }
            - call: "POST /owner-claims"
              payload: { evidence_item_id: "${seized_item}", claimant_name: "Omar Beck", claimant_contact: "88 Grove Road", notice_method: "IN_PERSON" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
              captures: { seized_deadline: $.data.claim_deadline_at }
          assert:
            - "${pub_notified} == '2026-08-05T00:00:00.000Z' — notified_at is the logical clock at claim creation"
            - "${pub_deadline} == '2026-11-18T00:00:00.000Z': FOUND_PROPERTY_NOTICE_DAYS 90 + PUBLICATION_EXTRA_DAYS 15 == 105 days"
            - "${mail_deadline} == '2026-11-03T00:00:00.000Z': the same found item family with CERTIFIED_MAIL gets 90 days and no publication extra"
            - "${seized_deadline} == '2026-09-04T00:00:00.000Z': SEIZED_PROPERTY_NOTICE_DAYS 30, because is_found_property defaulted to false"
            - "The publication extra is additive on top of the base, not a substitute: ${pub_deadline} is exactly 15 days after ${mail_deadline}"
            - "All three claims are created with status == 'NOTICE_SENT' and proof_document_ref == null"

      - name: transfer_window_exceeding_purpose_limit_rejected
        claim_type: threshold (value at threshold and threshold+1)
        grounds:
          - "calculations.transfer_window_limit"
          - "validations[priority=20]"
          - "errors[ERR_TRANSFER_WINDOW_TOO_LONG]"
        test_recipe:
          setup:
            - "Base fixture; one GENERAL item stored in G-01, no open transfers."
          setup_api_calls:
            - *c_clock
            - *c_room
            - *c_stat_th3
            - *c_loc_g
            - *c_tech
            - *c_lab
            - *c_inv
            - *c_case1
            - call: "POST /evidence-items"
              payload: { case_id: "${case1_id}", item_description: "Tool mark standard", category: "GENERAL", packaging_type: "RIGID_BOX", appraised_value_cents: 2000, seized_at: "2026-07-31T12:00:00Z" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
              captures: { item_id: $.data.id }
            - call: "POST /evidence-items/${item_id}/storage-assignment"
              payload: { storage_location_id: "${loc_g_id}" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /custody-transfers"
              payload: { evidence_item_id: "${item_id}", to_custodian_id: "${lab_id}", purpose: "LAB_ANALYSIS", released_at: "2026-08-02T09:00:00Z", due_back_at: "2026-09-01T09:00:00.001Z" }
              as: LabAnalyst
              as_user_id: "${lab_id}"
              captures: { long_err: $.data.error_id }
            - call: "POST /custody-transfers"
              payload: { evidence_item_id: "${item_id}", to_custodian_id: "${inv_id}", purpose: "COURT_PRESENTATION", released_at: "2026-08-02T09:00:00Z", due_back_at: "2026-08-06T09:00:00Z" }
              as: Investigator
              as_user_id: "${inv_id}"
              captures: { court_err: $.data.error_id }
            - call: "POST /custody-transfers"
              payload: { evidence_item_id: "${item_id}", to_custodian_id: "${lab_id}", purpose: "LAB_ANALYSIS", released_at: "2026-08-02T09:00:00Z", due_back_at: "2026-09-01T09:00:00Z" }
              as: LabAnalyst
              as_user_id: "${lab_id}"
              captures: { ok_transfer: $.data.id, ok_status: $.data.status }
          assert:
            - "LAB_ANALYSIS at 30 days + 1 ms responds 422 with ${long_err} == 'ERR_TRANSFER_WINDOW_TOO_LONG'"
            - "COURT_PRESENTATION at 4 days responds 422 with ${court_err} == 'ERR_TRANSFER_WINDOW_TOO_LONG': the limit is per purpose (3 days), not global"
            - "LAB_ANALYSIS at exactly 30 days responds 201 with ${ok_status} == 'REQUESTED', so the boundary is permitted and only one millisecond more is refused"
            - "Only the accepted attempt persists: GET /custody-transfers?evidence_item_id=${item_id} returns total_count == 1 with id == ${ok_transfer}"
            - "GET /evidence-items/${item_id} shows open_transfer_count == 1 — the two rejected attempts left no counter residue"

      - name: risk_index_recomputed_when_discrepancy_resolves_out_of_input_set
        claim_type: Input Set Filtering
        grounds:
          - "calculations.audit_risk_index"
          - "entities.AuditSession.fields.risk_index"
          - "entities.Discrepancy.fields.weight_contribution"
          - "state_machines.Discrepancy.OPEN_to_RESOLVED_FOUND"
        test_recipe:
          setup:
            - "Base fixture plus a spare GENERAL bin G-02 (capacity 4); two GENERAL items appraised 300000 and 400000 are stored in G-02."
            - "An audit session is scheduled and started on the empty bin G-09, so expected_item_count == 0 and no MISSING discrepancy can arise."
            - "Both G-02 items are then scanned into the G-09 audit, each raising a MISPLACED discrepancy, and the session is reconciled."
          setup_api_calls:
            - *c_clock
            - *c_room
            - *c_stat_th3
            - *c_loc_g9
            - *c_tech
            - *c_aud
            - *c_case1
            - &c_loc_g2_spare
              call: "POST /storage-locations"
              payload: { property_room_id: "${room_id}", code: "G-02", category: "GENERAL", capacity_slots: 4 }
              as: PropertyRoomManager
              captures: { loc_g2s_id: $.data.id, loc_g2s_v: $.data.version }
            - call: "POST /evidence-items"
              payload: { case_id: "${case1_id}", item_description: "Misplaced camera", category: "GENERAL", packaging_type: "RIGID_BOX", appraised_value_cents: 300000, seized_at: "2026-07-31T12:00:00Z" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
              captures: { itemX_id: $.data.id, barcodeX: $.data.barcode }
            - call: "POST /evidence-items/${itemX_id}/storage-assignment"
              payload: { storage_location_id: "${loc_g2s_id}" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
            - call: "POST /evidence-items"
              payload: { case_id: "${case1_id}", item_description: "Misplaced laptop", category: "GENERAL", packaging_type: "RIGID_BOX", appraised_value_cents: 400000, seized_at: "2026-07-31T12:05:00Z" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
              captures: { itemY_id: $.data.id, barcodeY: $.data.barcode }
            - call: "POST /evidence-items/${itemY_id}/storage-assignment"
              payload: { storage_location_id: "${loc_g2s_id}" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
            - call: "POST /audit-sessions"
              payload: { storage_location_id: "${loc_g9_id}", auditor_id: "${aud_id}", scheduled_start_at: "2026-08-10T09:00:00Z", scheduled_end_at: "2026-08-10T17:00:00Z", expected_storage_location_version: "${loc_g9_v}" }
              as: InternalAuditor
              as_user_id: "${aud_id}"
              captures: { sess_id: $.data.id }
            - call: "POST /audit-sessions/${sess_id}/start"
              payload: {}
              as: InternalAuditor
              as_user_id: "${aud_id}"
            - call: "POST /audit-sessions/${sess_id}/scan"
              payload: { barcode: "${barcodeX}" }
              as: InternalAuditor
              as_user_id: "${aud_id}"
            - call: "POST /audit-sessions/${sess_id}/scan"
              payload: { barcode: "${barcodeY}" }
              as: InternalAuditor
              as_user_id: "${aud_id}"
            - call: "POST /audit-sessions/${sess_id}/reconcile"
              payload: {}
              as: InternalAuditor
              as_user_id: "${aud_id}"
              captures: { index_after_reconcile: $.data.risk_index }
            - call: "GET /discrepancies?audit_session_id=${sess_id}&evidence_item_id=${itemX_id}"
              payload: {}
              as: PropertyRoomManager
              captures: { discX_id: "$.data[0].id", discX_weight: "$.data[0].weight_contribution" }
          trigger:
            - call: "POST /discrepancies/${discX_id}/resolve"
              payload: { resolution: "FOUND", resolution_note: "Camera relocated into the audited bin G-09" }
              as: PropertyRoomManager
            - call: "GET /audit-sessions/${sess_id}"
              payload: {}
              as: InternalAuditor
              as_user_id: "${aud_id}"
              captures: { index_after_resolve: $.data.risk_index }
          assert:
            - "Both scans raised MISPLACED discrepancies because the items' storage_location_id was G-02, not the audited G-09"
            - "${discX_weight} == 2.60: MISPLACED weight 2.0 * (1 + 300000/1000000) * 1.0 (G-09 is GENERAL, so no sensitive-category multiplier)"
            - "The other discrepancy carries weight_contribution == 2.80 (2.0 * 1.4 * 1.0), and ${index_after_reconcile} == 5.40"
            - "${index_after_resolve} == 2.80: the RESOLVED_FOUND discrepancy leaves the {OPEN, UNDER_INVESTIGATION} input set and the index is re-derived from the survivors, not decremented blindly"
            - "The surviving discrepancy's weight_contribution is still 2.80 — filtering changes the input set, not the per-row weights"
            - "GET /evidence-items/${itemX_id} shows storage_location_id == ${loc_g9_id}; G-09 accepted the relocation even while SEALED_FOR_AUDIT, because the seal blocks intake-side assignment, release and return, not audit resolution"
            - "GET /property-rooms/${room_id} shows open_discrepancy_count == 1 and posture == 'RESTRICTED'"

      - name: retention_variant_divergence_on_one_item
        claim_type: Variant Divergence
        excluded_because:
          difficulty_instance: retention_preliminary_vs_final_diverge_on_same_item
          rationale: "The §1.8 dual-variant instance already computes both retention variants on one unchanged item and pins the 107-day delta plus both statute_days_applied values."

      - name: proceeds_variant_selection_by_lifecycle_stage
        claim_type: Variant Selection
        excluded_because:
          difficulty_instance: auction_estimated_vs_settled_proceeds_diverge
          rationale: "The §1.8 instance shows ESTIMATED applied at order creation and SETTLED applied at settlement on the same order, which is exactly the variant-selection claim for calculations.disposition_proceeds."

      - name: required_storage_category_threshold_boundary
        claim_type: threshold (value at threshold)
        excluded_because:
          difficulty_instance: appraised_value_exactly_500000_requires_high_value_vault
          rationale: "The §1.8 boundary instance pins the inclusive >= 500000 edge for calculations.required_storage_category at 499999 / 500000, so a breadth duplicate would repeat it."

      - name: risk_index_rounding_does_not_drift
        claim_type: weighted_scoring (rounding accumulation doesn't drift)
        excluded_because:
          difficulty_instance: audit_risk_index_rounds_per_discrepancy_before_summing
          rationale: "The §1.8 combinatorial instance pins the round-then-sum order and shows it differs from sum-then-round (19.51 vs 19.50)."

      - name: storage_recovery_cap_share_of_subtotal
        claim_type: Precision
        excluded_because:
          difficulty_instance: settlement_recovery_cap_measured_against_post_commission_subtotal
          rationale: "The §1.8 instance pins the pinned five-step order of calculations.disposition_proceeds, including that the 30% cap is measured on the post-commission subtotal rather than gross."

      - name: room_posture_constants_applied_per_branch
        claim_type: Constants Applied
        excluded_because:
          difficulty_instance: room_posture_branches_on_three_independent_counters
          rationale: "The §1.8 instance walks each LOCKED_DOWN branch constant of calculations.room_posture (missing_high_risk_count 1, open_discrepancy_count 5, unresolved risk sum 25.00) independently."

      - name: escort_load_interval_semantics
        claim_type: interval_merge (overlapping intervals)
        excluded_because:
          difficulty_instance: custodian_escort_capacity_closed_interval_third_overlap_rejected
          rationale: "The §1.8 resource_temporal_overlap instance pins the closed-interval semantics and the aggregate limit 2 of calculations.escort_concurrency_load."

      - name: custody_window_adjacency_gap_zero
        claim_type: interval_merge (adjacent intervals, gap = 0)
        excluded_because:
          difficulty_instance: item_custody_windows_half_open_adjacency_allowed
          rationale: "The §1.8 instance already tests that a window starting exactly when the previous one ends is accepted for calculations.item_custody_window_conflict, and that one millisecond of overlap is refused."

  # ===========================================================================
  - section: validations
    instances:

      - name: narcotics_packaged_in_sharps_tube_rejected
        claim_type: Violation → Error
        grounds:
          - "validations[priority=16]"
          - "entities.EvidenceItem.fields.packaging_type"
          - "errors[ERR_PACKAGING_NOT_PERMITTED]"
        test_recipe:
          setup:
            - "Base fixture; case 26-00001 accepts intake."
          setup_api_calls:
            - *c_clock
            - *c_room
            - *c_stat_th3
            - *c_tech
            - *c_case1
          trigger:
            - call: "POST /evidence-items"
              payload: { case_id: "${case1_id}", item_description: "Suspected fentanyl powder", category: "NARCOTICS", packaging_type: "SHARPS_TUBE", appraised_value_cents: 0, seized_at: "2026-07-31T12:00:00Z" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
              captures: { narc_err: $.data.error_id }
            - call: "POST /evidence-items"
              payload: { case_id: "${case1_id}", item_description: "Loose paperwork", category: "GENERAL", packaging_type: "SHARPS_TUBE", appraised_value_cents: 0, seized_at: "2026-07-31T12:00:00Z" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
              captures: { gen_err: $.data.error_id }
          assert:
            - "Responds 422 with ${narc_err} == 'ERR_PACKAGING_NOT_PERMITTED': NARCOTICS admits only SEALED_ENVELOPE or RIGID_BOX"
            - "${gen_err} == 'ERR_PACKAGING_NOT_PERMITTED' too: GENERAL admits every packaging EXCEPT SHARPS_TUBE, so the matrix is a per-category allow-list, not a single global rule"
            - "No EvidenceItem rows exist: GET /evidence-items?case_id=${case1_id} returns total_count == 0 and item_count on the case is still 0"

      - name: permitted_packaging_intake_succeeds
        claim_type: Satisfaction → Pass
        grounds:
          - "validations[priority=16]"
          - "entities.EvidenceItem.fields.category"
          - "calculations.required_storage_category"
        test_recipe:
          setup:
            - "Base fixture; three intakes are attempted with packaging that the matrix permits for their category."
          setup_api_calls:
            - *c_clock
            - *c_room
            - *c_stat_th3
            - *c_tech
            - *c_case1
          trigger:
            - call: "POST /evidence-items"
              payload: { case_id: "${case1_id}", item_description: "Blood tube", category: "BIOLOGICAL", packaging_type: "SHARPS_TUBE", appraised_value_cents: 0, seized_at: "2026-07-31T12:00:00Z" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
              captures: { bio_item: $.data.id, bio_required: $.data.required_storage_category }
            - call: "POST /evidence-items"
              payload: { case_id: "${case1_id}", item_description: "Seized revolver", category: "FIREARM", packaging_type: "CHAIN_TAG_ONLY", appraised_value_cents: 45000, seized_at: "2026-07-31T12:00:00Z" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
              captures: { gun_item: $.data.id, gun_required: $.data.required_storage_category }
            - call: "POST /evidence-items"
              payload: { case_id: "${case1_id}", item_description: "Wrapped pallet of copper pipe", category: "OVERSIZED", packaging_type: "PALLET_WRAP", appraised_value_cents: 90000, seized_at: "2026-07-31T12:00:00Z" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
              captures: { over_item: $.data.id, over_required: $.data.required_storage_category }
          assert:
            - "All three respond 201: SHARPS_TUBE is permitted for BIOLOGICAL, CHAIN_TAG_ONLY for FIREARM and PALLET_WRAP for OVERSIZED"
            - "${bio_required} == 'REFRIGERATED', ${gun_required} == 'HIGH_VALUE_VAULT' (a firearm is high-risk regardless of its 45000 appraisal) and ${over_required} == 'OVERSIZED_YARD'"
            - "GET /cases/${case1_id} shows item_count == 3 and undisposed_item_count == 3, with barcodes ending -0001-, -0002- and -0003-"

      - name: refrigerated_bin_above_four_degrees_assignment_rejected
        claim_type: Conditional validation
        grounds:
          - "validations[priority=17]"
          - "entities.StorageLocation.fields.temperature_c"
          - "calculations.storage_location_autoselect"
          - "errors[ERR_REFRIGERATION_OUT_OF_RANGE]"
        test_recipe:
          setup:
            - "Base fixture; R-01 records 3.5 C and R-09 records 6.0 C, both REFRIGERATED with free capacity."
            - "Two BIOLOGICAL items are logged into case 26-00001, so both require REFRIGERATED storage."
          setup_api_calls:
            - *c_clock
            - *c_room
            - *c_stat_th3
            - *c_loc_r
            - *c_loc_rw
            - *c_tech
            - *c_case1
            - call: "POST /evidence-items"
              payload: { case_id: "${case1_id}", item_description: "Sexual assault kit", category: "BIOLOGICAL", packaging_type: "RIGID_BOX", appraised_value_cents: 0, seized_at: "2026-07-31T12:00:00Z" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
              captures: { item1_id: $.data.id }
            - call: "POST /evidence-items"
              payload: { case_id: "${case1_id}", item_description: "Buccal swab set", category: "BIOLOGICAL", packaging_type: "SHARPS_TUBE", appraised_value_cents: 0, seized_at: "2026-07-31T12:05:00Z" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
              captures: { item2_id: $.data.id }
          trigger:
            - call: "POST /evidence-items/${item1_id}/storage-assignment"
              payload: { storage_location_id: "${loc_rw_id}" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
              captures: { warm_err: $.data.error_id }
            - call: "POST /evidence-items/${item1_id}/storage-assignment"
              payload: { storage_location_id: "${loc_r_id}" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
              captures: { cold_location: $.data.storage_location_id }
            - call: "POST /evidence-items/${item2_id}/storage-assignment"
              payload: {}
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
              captures: { autoselected: $.data.storage_location_id }
          assert:
            - "Assigning into the 6.0 C bin responds 409 with ${warm_err} == 'ERR_REFRIGERATION_OUT_OF_RANGE' — the category matches, only the reading is out of compliance"
            - "${cold_location} == ${loc_r_id}: the same item is accepted into the 3.5 C bin, so the rule is conditional on temperature_c, not on the bin's identity"
            - "${autoselected} == ${loc_r_id}, not ${loc_rw_id}: calculations.storage_location_autoselect excludes REFRIGERATED bins above 4.0 C from the eligible pool even though R-09 has more free slots after the first assignment"
            - "GET /storage-locations/${loc_rw_id} shows occupied_slots == 0 — the refused assignment left no slot reserved"

      - name: high_value_item_assigned_to_general_bin_rejected
        claim_type: Cross-entity validation
        grounds:
          - "validations[priority=17]"
          - "calculations.required_storage_category"
          - "errors[ERR_STORAGE_CATEGORY_MISMATCH]"
        test_recipe:
          setup:
            - "Base fixture; a CURRENCY item is logged into case 26-00001, so required_storage_category == HIGH_VALUE_VAULT."
          setup_api_calls:
            - *c_clock
            - *c_room
            - *c_stat_th3
            - *c_loc_g
            - *c_loc_v
            - *c_tech
            - *c_case1
            - call: "POST /evidence-items"
              payload: { case_id: "${case1_id}", item_description: "Banded currency 2500 dollars", category: "CURRENCY", packaging_type: "SEALED_ENVELOPE", appraised_value_cents: 250000, seized_at: "2026-07-31T12:00:00Z" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
              captures: { item_id: $.data.id }
          trigger:
            - call: "POST /evidence-items/${item_id}/storage-assignment"
              payload: { storage_location_id: "${loc_g_id}" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
              captures: { err: $.data.error_id }
            - call: "POST /evidence-items/${item_id}/storage-assignment"
              payload: { storage_location_id: "${loc_v_id}" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
              captures: { good_location: $.data.storage_location_id, custody: $.data.custody_state }
          assert:
            - "The GENERAL bin responds 409 with ${err} == 'ERR_STORAGE_CATEGORY_MISMATCH' although G-01 has free capacity: suitability depends on the item's derived category, not on space"
            - "${good_location} == ${loc_v_id} and ${custody} == 'STORED' on the vault attempt"
            - "GET /storage-locations/${loc_g_id} shows occupied_slots == 0 and GET /storage-locations/${loc_v_id} shows occupied_slots == 1"

      - name: release_from_dual_signature_vault_without_witness_rejected
        claim_type: Conditional validation
        grounds:
          - "validations[priority=18]"
          - "entities.StorageLocation.fields.requires_dual_signature"
          - "entities.CustodyTransfer.fields.witness_signature"
          - "errors[ERR_WITNESS_SIGNATURE_REQUIRED]"
        test_recipe:
          setup:
            - "Base fixture; a CURRENCY item is stored in V-01, which sets requires_dual_signature true, and a LAB_ANALYSIS transfer to L-200 is requested."
          setup_api_calls:
            - *c_clock
            - *c_room
            - *c_stat_th3
            - *c_loc_v
            - *c_tech
            - *c_lab
            - *c_case1
            - call: "POST /evidence-items"
              payload: { case_id: "${case1_id}", item_description: "Banded currency for counterfeit exam", category: "CURRENCY", packaging_type: "SEALED_ENVELOPE", appraised_value_cents: 250000, seized_at: "2026-07-31T12:00:00Z" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
              captures: { item_id: $.data.id }
            - call: "POST /evidence-items/${item_id}/storage-assignment"
              payload: { storage_location_id: "${loc_v_id}" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
            - call: "POST /custody-transfers"
              payload: { evidence_item_id: "${item_id}", to_custodian_id: "${lab_id}", purpose: "LAB_ANALYSIS", released_at: "2026-08-02T09:00:00Z", due_back_at: "2026-08-12T09:00:00Z" }
              as: LabAnalyst
              as_user_id: "${lab_id}"
              captures: { transfer_id: $.data.id }
          trigger:
            - call: "POST /custody-transfers/${transfer_id}/release"
              payload: { released_signature: "sig-solo" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
              captures: { err: $.data.error_id }
            - call: "POST /custody-transfers/${transfer_id}/release"
              payload: { released_signature: "sig-solo", witness_signature: "sig-witness" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
              captures: { status_after: $.data.status, witness_stored: $.data.witness_signature }
          assert:
            - "Omitting witness_signature responds 422 with ${err} == 'ERR_WITNESS_SIGNATURE_REQUIRED' because the item's location requires dual signature"
            - "${status_after} == 'RELEASED' and ${witness_stored} == 'sig-witness' once the witness signature is supplied"
            - "The rule is conditional on the location: the identical single-signature release succeeds for an item stored in a bin created without requires_dual_signature"
            - "GET /evidence-items/${item_id} shows custody_state == 'CHECKED_OUT' only after the second attempt; the first attempt left custody_state == 'STORED'"

      - name: transfer_due_back_not_after_release_rejected
        claim_type: Temporal validation
        grounds:
          - "validations[priority=20]"
          - "entities.CustodyTransfer.fields.due_back_at"
          - "errors[ERR_INVALID_TRANSFER_WINDOW]"
        test_recipe:
          setup:
            - "Base fixture; one GENERAL item stored in G-01."
          setup_api_calls:
            - *c_clock
            - *c_room
            - *c_stat_th3
            - *c_loc_g
            - *c_tech
            - *c_inv
            - *c_case1
            - call: "POST /evidence-items"
              payload: { case_id: "${case1_id}", item_description: "Notebook for review", category: "GENERAL", packaging_type: "PAPER_BAG", appraised_value_cents: 500, seized_at: "2026-07-31T12:00:00Z" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
              captures: { item_id: $.data.id }
            - call: "POST /evidence-items/${item_id}/storage-assignment"
              payload: { storage_location_id: "${loc_g_id}" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /custody-transfers"
              payload: { evidence_item_id: "${item_id}", to_custodian_id: "${inv_id}", purpose: "INVESTIGATIVE_REVIEW", released_at: "2026-08-02T09:00:00Z", due_back_at: "2026-08-02T09:00:00Z" }
              as: Investigator
              as_user_id: "${inv_id}"
              captures: { equal_err: $.data.error_id }
            - call: "POST /custody-transfers"
              payload: { evidence_item_id: "${item_id}", to_custodian_id: "${inv_id}", purpose: "INVESTIGATIVE_REVIEW", released_at: "2026-08-02T09:00:00Z", due_back_at: "2026-08-01T09:00:00Z" }
              as: Investigator
              as_user_id: "${inv_id}"
              captures: { inverted_err: $.data.error_id }
            - call: "POST /custody-transfers"
              payload: { evidence_item_id: "${item_id}", to_custodian_id: "${inv_id}", purpose: "INVESTIGATIVE_REVIEW", released_at: "2026-08-02T09:00:00Z", due_back_at: "2026-08-02T09:00:00.001Z" }
              as: Investigator
              as_user_id: "${inv_id}"
              captures: { ok_status: $.data.status }
          assert:
            - "A zero-length window responds 422 with ${equal_err} == 'ERR_INVALID_TRANSFER_WINDOW': due_back_at must be STRICTLY after released_at"
            - "An inverted window responds 422 with ${inverted_err} == 'ERR_INVALID_TRANSFER_WINDOW'"
            - "A one-millisecond window responds 201 with ${ok_status} == 'REQUESTED', so the exclusion is exactly at equality"
            - "GET /custody-transfers?evidence_item_id=${item_id} returns total_count == 1: neither refused window persisted"

      - name: destruction_of_biological_indefinite_case_rejected
        claim_type: Cross-entity validation
        grounds:
          - "validations[priority=23]"
          - "entities.OffenseStatute.fields.preservation_class"
          - "errors[ERR_PRESERVATION_CLASS_FORBIDS_DESTRUCTION]"
        test_recipe:
          setup:
            - "Base fixture; a BIOLOGICAL item is logged into case 26-00003, whose statute BIO-1 carries preservation_class BIOLOGICAL_INDEFINITE, and is stored in R-01."
            - "Because the preservation class is indefinite, calculations.retention_release_at yields retention_release_at == null and retention_basis == INDEFINITE, so the item can never mature."
          setup_api_calls:
            - *c_clock
            - *c_room
            - *c_stat_bio
            - *c_loc_r
            - *c_tech
            - *c_case3
            - call: "POST /evidence-items"
              payload: { case_id: "${case3_id}", item_description: "Preserved assault kit", category: "BIOLOGICAL", packaging_type: "RIGID_BOX", appraised_value_cents: 0, seized_at: "2026-07-31T12:00:00Z" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
              captures: { item_id: $.data.id, basis: $.data.retention_basis, release: $.data.retention_release_at }
            - call: "POST /evidence-items/${item_id}/storage-assignment"
              payload: { storage_location_id: "${loc_r_id}" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /disposition-orders"
              payload: { evidence_item_id: "${item_id}", type: "DESTRUCTION", requested_by_custodian_id: "${tech_id}" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
              captures: { err: $.data.error_id }
          assert:
            - "${basis} == 'INDEFINITE' and ${release} == null at intake"
            - "Responds 409 with ${err} == 'ERR_PRESERVATION_CLASS_FORBIDS_DESTRUCTION'"
            - "This request also violates priority 24 (case 26-00003 is OPEN) and priority 25 (the item is RETAINED and can never mature), yet the priority 23 error is the one returned"
            - "GET /evidence-items/${item_id} shows disposition_state == 'RETAINED' and no DispositionOrder row exists for the item"

      - name: unadjudicated_case_disposition_order_rejected
        claim_type: Cross-entity validation
        grounds:
          - "validations[priority=24]"
          - "entities.Case.fields.status"
          - "state_machines.EvidenceItem.RETAINED_to_DISPOSAL_ELIGIBLE"
          - "errors[ERR_CASE_NOT_DISPOSABLE]"
        test_recipe:
          setup:
            - "Base fixture; a GENERAL item is logged into case 26-00001 (statute TH-3, 365 statutory days) at clock 2026-08-01 and stored in G-01, giving retention_release_at 2027-08-01."
            - "The case is charged but never adjudicated; the clock is advanced to 2027-08-01 and the daily sweep runs, so sweep step 3 marks the item DISPOSAL_ELIGIBLE while the case is still CHARGED."
          setup_api_calls:
            - *c_clock
            - *c_room
            - *c_stat_th3
            - *c_loc_g
            - *c_tech
            - *c_inv
            - *c_case1
            - call: "POST /evidence-items"
              payload: { case_id: "${case1_id}", item_description: "Stolen power tool", category: "GENERAL", packaging_type: "RIGID_BOX", appraised_value_cents: 30000, seized_at: "2026-07-31T12:00:00Z" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
              captures: { item_id: $.data.id }
            - call: "POST /evidence-items/${item_id}/storage-assignment"
              payload: { storage_location_id: "${loc_g_id}" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
            - call: "POST /cases/${case1_id}/charge"
              payload: {}
              as: Investigator
              as_user_id: "${inv_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-08-01T00:00:00Z" }
              as: PropertyRoomManager
            - call: "POST /property-rooms/${room_id}/daily-sweep"
              payload: {}
              as: PropertyRoomManager
              captures: { eligible_count: $.data.disposal_eligible_count }
          trigger:
            - call: "POST /disposition-orders"
              payload: { evidence_item_id: "${item_id}", type: "DESTRUCTION", requested_by_custodian_id: "${tech_id}" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
              captures: { err: $.data.error_id }
          assert:
            - "${eligible_count} == 1 and GET /evidence-items/${item_id} shows disposition_state == 'DISPOSAL_ELIGIBLE': retention maturity alone is satisfied"
            - "Responds 409 with ${err} == 'ERR_CASE_NOT_DISPOSABLE' because case 26-00001 is CHARGED, not ADJUDICATED or CLOSED, and the item is not found property"
            - "Priority 23 does not fire (TH-3 is STANDARD) and priority 25 does not fire (the item already matured), so the failure isolates the case-status condition"
            - "After POST /cases/${case1_id}/adjudicate the identical order request responds 201 with status == 'PENDING_COURT_AUTH' and the item moves to disposition_state == 'ORDER_PENDING'"

      - name: retention_not_matured_order_rejected
        claim_type: Cascading validation
        grounds:
          - "validations[priority=25]"
          - "validations[priority=11]"
          - "entities.EvidenceItem.fields.retention_release_at"
          - "errors[ERR_RETENTION_NOT_MATURED]"
        test_recipe:
          setup:
            - "Base fixture; a GENERAL item is logged into case 26-00001 at clock 2026-08-01 and stored in G-01."
            - "The case is charged, the clock advanced to 2026-09-15 and the case adjudicated, so the FINAL retention lands at 2027-04-16 — still in the future — and the item stays RETAINED."
          setup_api_calls:
            - *c_clock
            - *c_room
            - *c_stat_th3
            - *c_loc_g
            - *c_tech
            - *c_inv
            - *c_case1
            - call: "POST /evidence-items"
              payload: { case_id: "${case1_id}", item_description: "Stolen power tool", category: "GENERAL", packaging_type: "RIGID_BOX", appraised_value_cents: 30000, seized_at: "2026-07-31T12:00:00Z" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
              captures: { item_id: $.data.id }
            - call: "POST /evidence-items/${item_id}/storage-assignment"
              payload: { storage_location_id: "${loc_g_id}" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
            - call: "POST /cases/${case1_id}/charge"
              payload: {}
              as: Investigator
              as_user_id: "${inv_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: PropertyRoomManager
            - call: "POST /cases/${case1_id}/adjudicate"
              payload: {}
              as: CourtClerk
          trigger:
            - call: "POST /disposition-orders"
              payload: { evidence_item_id: "${item_id}", type: "DESTRUCTION", requested_by_custodian_id: "${tech_id}" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
              captures: { err: $.data.error_id }
          assert:
            - "GET /evidence-items/${item_id} shows retention_release_at == '2027-04-16T00:00:00.000Z', retention_basis == 'FINAL' and disposition_state == 'RETAINED'"
            - "Responds 409 with ${err} == 'ERR_RETENTION_NOT_MATURED', NOT 'ERR_ITEM_DISPOSITION_STATE_INVALID': the priority 11 carve-out for POST /disposition-orders hands RETAINED and COURT_HOLD items to priorities 23-25, so the check that must run first (case status, priority 24) has already passed"
            - "Priority 24 is satisfied because the case is ADJUDICATED, which is what makes the priority 25 result observable rather than masked"
            - "No DispositionOrder row is created and the item's version is unchanged by the refused call"

      - name: scan_barcode_from_other_room_rejected
        claim_type: Cross-entity validation
        grounds:
          - "validations[priority=27]"
          - "endpoints[POST /audit-sessions/{sessionId}/scan]"
          - "entities.PropertyRoom.fields.agency_code"
