            - { call: "GET /api/auction-sales/${sale_id}", as: Auctioneer, captures: { sv2: $.data.version } }
            - { call: "POST /api/auction-sales/${sale_id}/postponements", payload: { new_sale_start_at: "2026-11-30T10:00:00Z", reason: "TRUSTEE_DISCRETION", announced_via: "ADVANCE", expected_auction_sale_version: "${sv2}" }, as: Auctioneer }
            - { call: "GET /api/auction-sales/${sale_id}", as: Auctioneer, captures: { sv3: $.data.version } }
            - { call: "POST /api/auction-sales/${sale_id}/postponements", payload: { new_sale_start_at: "2026-12-05T10:00:00Z", reason: "TRUSTEE_DISCRETION", announced_via: "ADVANCE", expected_auction_sale_version: "${sv3}" }, as: Auctioneer, captures: { post3: $.data.id } }
