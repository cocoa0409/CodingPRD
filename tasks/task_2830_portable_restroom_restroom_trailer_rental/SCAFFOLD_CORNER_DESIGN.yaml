              as: PermitCoordinator
              captures: { permit_id: $.data.id }
            - call: "POST /placement-permits/${permit_id}/submit"
              payload: {}
              as: PermitCoordinator
            - call: "POST /placement-permits/${permit_id}/approve"
              payload: { authority_decision_ref: "AD-10601" }
              as: ComplianceOfficer
            - call: "POST /routes"
              payload: { route_code: "RT-MON-63", service_day: "MON", truck_capacity_units: 13, waste_capacity_gallons: 2600 }
