  - section: errors
    instances:
      - name: an_unauthenticated_caller_is_rejected_before_any_lookup
        claim_type: error_triggerable
        grounds:
          - errors.ERR_UNAUTHENTICATED
          - validations[priority 1] ERR_UNAUTHENTICATED
        distinguishing_aspect: "A caller presenting an X-User-Role that is not one of the five declared roles is 401 ERR_UNAUTHENTICATED, not 403 ERR_FORBIDDEN_ROLE: an unrecognised role is an authentication failure (priority 1), while a recognised-but-wrong role is an authorisation failure (priority 2). The distinction is observable on a read-only endpoint that every declared role may call."
        test_recipe:
          setup:
            - "An empty system; no header rewriting or role aliasing is performed by the server."
          setup_api_calls: []
          trigger:
            - call: "GET /projects"
              payload: {}
              as: NotADeclaredRole
              as_user_id: "ghost-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 401"
            - "response.data.error_id == ERR_UNAUTHENTICATED"

      - name: activating_an_unknown_assignment_id_is_404
        claim_type: error_triggerable
        grounds:
          - errors.ERR_ASSIGNMENT_NOT_FOUND
          - endpoints.POST /contract-assignments/{id}/activate
        distinguishing_aspect: "The activate endpoint takes no body at all, so the only thing that can be wrong is the path id: an unknown assignment id must produce 404 ERR_ASSIGNMENT_NOT_FOUND rather than a 409 invalid-state error, which is what an implementation that loads-or-defaults would return."
        test_recipe:
          setup:
            - "An empty system; no contract assignment has ever been created."
          setup_api_calls: []
          trigger:
            - call: "POST /contract-assignments/00000000-0000-4000-8000-0000000000a1/activate"
              payload: {}
              as: PortalAdmin
              as_user_id: "admin-ann"
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_ASSIGNMENT_NOT_FOUND"

      - name: finalizing_an_unknown_submission_id_is_404
        claim_type: error_triggerable
        grounds:
          - errors.ERR_SUBMISSION_NOT_FOUND
          - endpoints.POST /payroll-submissions/{id}/finalize
        distinguishing_aspect: "Finalize runs the whole wage engine; on an unknown id it must fail fast with 404 ERR_SUBMISSION_NOT_FOUND before any calculation is attempted, and it must not create a submission shell as a side effect."
        test_recipe:
          setup:
            - "An empty system; no payroll submission has ever been created."
          setup_api_calls: []
          trigger:
            - call: "POST /payroll-submissions/00000000-0000-4000-8000-0000000000a2/finalize"
              payload: {}
              as: PayrollPreparer
              as_user_id: "prep-pat"
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_SUBMISSION_NOT_FOUND"

      - name: disbursing_an_unknown_restitution_id_is_404
        claim_type: error_triggerable
        grounds:
          - errors.ERR_RESTITUTION_NOT_FOUND
          - endpoints.POST /restitution-payments/{id}/disburse
        distinguishing_aspect: "Disburse is the endpoint that moves money and cascades into the contractor's outstanding balance; on an unknown payment id it is 404 ERR_RESTITUTION_NOT_FOUND and no contractor or project counter moves anywhere in the system."
        test_recipe:
          setup:
            - "An empty system; no restitution payment has ever been created."
          setup_api_calls: []
          trigger:
            - call: "POST /restitution-payments/00000000-0000-4000-8000-0000000000a3/disburse"
              payload: {}
              as: PayrollPreparer
              as_user_id: "prep-pat"
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_RESTITUTION_NOT_FOUND"

      - name: cancelling_an_unknown_interview_id_is_404
        claim_type: error_triggerable
        grounds:
          - errors.ERR_INTERVIEW_NOT_FOUND
          - endpoints.POST /interviews/{id}/cancel
        distinguishing_aspect: "Path existence (priority 3) is checked before the interview state gate (priority 8): a well-formed cancellation reason on an id that never existed is 404 ERR_INTERVIEW_NOT_FOUND, never 409 ERR_INVALID_INTERVIEW_STATE."
        test_recipe:
          setup:
            - "An empty system; no interview has ever been scheduled."
          setup_api_calls: []
          trigger:
            - call: "POST /interviews/00000000-0000-4000-8000-0000000000a4/cancel"
              payload: { cancellation_reason: "Auditor reassigned." }
              as: LaborStandardsAuditor
              as_user_id: "auditor-cruz"
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_INTERVIEW_NOT_FOUND"

      - name: an_unknown_apprentice_program_id_in_the_body_is_404
        claim_type: error_triggerable
        grounds:
          - errors.ERR_PROGRAM_NOT_FOUND
          - validations[priority 4] body foreign keys
          - endpoints.POST /workers
        distinguishing_aspect: "apprentice_program_id is an optional body FK, and optional does not mean unchecked: when it is supplied it must resolve, so a worker citing a program id that does not exist is 404 ERR_PROGRAM_NOT_FOUND and no Worker row is created. Omitting the field entirely would have succeeded."
        test_recipe:
          setup:
            - "One registered contractor exists; no apprentice program has been registered."
          setup_api_calls:
            - call: "POST /contractors"
              payload: { legal_name: "Acme Electric", dir_registration_number: "PW-1001" }
              as: PortalAdmin
              captures: { contractor_id: $.data.id }
          trigger:
            - call: "POST /workers"
              payload: { employer_contractor_id: "${contractor_id}", worker_number: "W-003", full_name: "Ada Apprentice", default_classification_code: "ELEC-INSIDE-APP", apprentice_program_id: "00000000-0000-4000-8000-0000000000a5", apprentice_period: 2 }
              as: PayrollPreparer
              as_user_id: "prep-pat"
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_PROGRAM_NOT_FOUND"

      - name: an_unknown_reporting_portal_id_on_a_new_project_is_404
        claim_type: error_triggerable
        grounds:
          - errors.ERR_PORTAL_NOT_FOUND
          - validations[priority 4] body foreign keys
          - endpoints.POST /projects
        distinguishing_aspect: "A project carries two required body FKs; the determination resolves and the portal does not, so the error is specifically ERR_PORTAL_NOT_FOUND. Body FKs are validated in declaration order, and wage_determination_id precedes reporting_portal_id, which proves the checker keeps going after the first FK resolves instead of stopping at the first success."
        test_recipe:
          setup:
            - "One ACTIVE determination for CA-ALAMEDA exists; no reporting portal has been registered."
          setup_api_calls:
            - call: "POST /wage-determinations"
              payload: { decision_number: "CA20260014", modification_number: 0, locality_code: "CA-ALAMEDA", effective_date: "2026-01-01T00:00:00.000Z" }
              as: PortalAdmin
              captures: { wd_id: $.data.id }
            - call: "POST /wage-determinations/${wd_id}/wage-rates"
              payload: { classification_code: "ELEC-INSIDE-JW", trade_code: "ELEC", zone_code: "BASE", base_hourly_rate_cents: 5000, fringe_hourly_rate_cents: 2000, zone_adjustment_cents: 0, apprentice_scale_pct: [50, 60, 70, 80] }
              as: PortalAdmin
            - call: "POST /wage-determinations/${wd_id}/activate"
              payload: {}
              as: PortalAdmin
          trigger:
            - call: "POST /projects"
              payload: { project_name: "Alameda Transit Center", awarding_agency: "City of Alameda", locality_code: "CA-ALAMEDA", zone_code: "BASE", wage_determination_id: "${wd_id}", reporting_portal_id: "00000000-0000-4000-8000-0000000000a6", funding_source: "FEDERAL_DAVIS_BACON", contract_award_date: "2026-02-01T00:00:00.000Z" }
              as: PortalAdmin
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_PORTAL_NOT_FOUND"

      - name: a_determination_with_an_expiry_before_its_effective_date_is_422
        claim_type: error_triggerable
        grounds:
          - errors.ERR_VALIDATION
          - validations[priority 7] body shape and field constraints
          - entities.WageDetermination
        distinguishing_aspect: "Field-level shape validation covers cross-field ordering inside one body: expiry_date strictly before effective_date is 422 ERR_VALIDATION at creation time, before the row exists, so it can never be caught later by the governing-interval overlap rule at priority 25."
        test_recipe:
          setup:
            - "An empty system."
          setup_api_calls: []
          trigger:
            - call: "POST /wage-determinations"
              payload: { decision_number: "CA20260099", modification_number: 0, locality_code: "CA-ALAMEDA", effective_date: "2026-06-01T00:00:00.000Z", expiry_date: "2026-03-01T00:00:00.000Z" }
              as: PortalAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_VALIDATION"

      - name: an_unknown_preparer_staff_id_on_a_new_filing_is_404
        claim_type: error_triggerable
        grounds:
          - errors.ERR_STAFF_NOT_FOUND
          - validations[priority 4] body foreign keys
          - endpoints.POST /payroll-submissions
        distinguishing_aspect: "prepared_by_staff_id is a required body FK checked at priority 4, i.e. before the OCC version comparison at priority 10. The recipe supplies a correct expected_contract_assignment_version and a non-existent staff id, so the answer is 404 ERR_STAFF_NOT_FOUND and the assignment's version does NOT increment -- an implementation that stamps the version bump first leaves the tenant unable to file at all."
