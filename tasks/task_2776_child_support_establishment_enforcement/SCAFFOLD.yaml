# =============================================================================
# PRD-BENCH SCAFFOLD — Child Support Establishment & Enforcement
# Task 2776 — state child support (IV-D) enforcement agency
# =============================================================================
scenario: |
  2776. Child Support Establishment & Enforcement (state child support enforcement
  agency): case opening from public assistance referral or direct application with
  locate services, paternity establishment through voluntary acknowledgment or
  genetic testing with rescission periods, order establishment using state
  guidelines with income imputation and deviation findings, income withholding
  order issuance to employers with multi-state jurisdiction rules, modification
  review on substantial change with periodic review cycles, enforcement remedies
  including license suspension, tax refund intercept, liens and contempt referral,
  interstate case processing with responding and initiating state responsibilities,
  arrears calculation, interest accrual and compromise programs

domain_name: child-support-enforcement
api_prefix: /child-support

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency
  difficulty_level: expert_plus

  entity_topology: flat
  # 12 peer entities joined by explicit FK fields; no entity nests inside another
  # in its own URL path. Every collection lives directly under /child-support and
  # is discovered by FK filter (GET /child-support/orders?case_id=...), so a test
  # can reach any row without walking a URL tree. Two child creations are
  # expressed as actions on a peer (POST /cases/{case_id}/orders) but the created
  # row is addressed flat afterwards (GET /child-support/orders/{order_id}).

  state_machine_shape: parallel
  # SupportCase carries two independent dimensions (case_status x
  # enforcement_posture); IncomeWithholdingOrder carries two more
  # (service_status x remittance_status). PaternityAction and ModificationReview
  # are cyclic; SupportOrder and EnforcementAction are branching fork-join.

  relationship_patterns:
    - one_to_many        # SupportCase -> SupportOrder, ObligationCharge, PaymentTransaction
    - cross_aggregate    # ModificationReview -> InterstateReferral (CEJ gate); EnforcementAction -> CompromiseOffer
    - self_referential   # SupportOrder.superseded_by_order_id -> SupportOrder.id
    - polymorphic        # PaymentTransaction.source spans withholding, intercept, levy, installment, reversal

  role_model: segregation_of_duties
  # The user who drafts an order may not approve its deviation findings; the user
  # who proposes an enforcement action may not decide its contest review.
  # Layered on top of peer roles (EmployerAgent owns remittances, the two party
  # roles own their own consents) with no hierarchical override anywhere.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 ENTITY-RELATIONSHIP TABLE
# =============================================================================
entities:

  - name: Participant
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: role_type
        type: enum
        source: input
        description: whether this person is the custodial or the noncustodial party
        constraints: "one of {CUSTODIAL_PARTY, NONCUSTODIAL_PARTY}"
      - name: full_name
        type: string
        source: input
        description: legal name of the participant
        constraints: "1..120 chars"
      - name: ssn_last4
        type: string
        source: input
        description: last four digits of the SSN used for locate matching
        constraints: "exactly 4 digits"
      - name: residence_state_code
        type: string
        source: input
        description: two-letter code of the state where the participant resides
        constraints: "one of {MN, TX, NY, WI, FL, CA, PA}"
      - name: employer_name
        type: string
        source: input
        description: self-reported employer name; presence makes a wage-registry locate succeed
        default: null
      - name: monthly_gross_income_cents
        type: integer
        source: input
        description: gross monthly income in cents; null means unknown
        default: null
        constraints: ">= 0 when present"
      - name: income_verification_source
        type: enum
        source: input
        description: provenance of monthly_gross_income_cents
        default: NONE
        constraints: "one of {VERIFIED_WAGE_RECORD, SELF_REPORTED, NONE}"
      - name: supports_second_family
        type: boolean
        source: input
        description: true when the NCP supports a second family in the same household (CCPA tier input)
        default: false
      - name: has_valid_drivers_license
        type: boolean
        source: input
        description: true when the participant holds an unsuspended state driver license
        default: true
      - name: locate_status
        type: enum
        source: system
        description: outcome of locate services for this participant
        default: NOT_NEEDED
        constraints: "one of {NOT_NEEDED, PENDING, LOCATED, UNLOCATABLE}"
      - name: locate_attempt_count
        type: integer
        source: system
        description: number of locate requests fired against this participant
        default: 0
      - name: license_suspension_active
        type: boolean
        source: system
        description: true while an ACTIVE LICENSE_SUSPENSION enforcement action names this participant
        default: false
      - name: lien_recorded
        type: boolean
        source: system
        description: true while an ACTIVE PROPERTY_LIEN enforcement action names this participant
        default: false
      - name: credit_bureau_reported
        type: boolean
        source: system
        description: true while an ACTIVE CREDIT_BUREAU_REPORT enforcement action names this participant
        default: false
      - name: enforcement_risk_score
        type: integer
        source: computed
        description: 0..100 score from calculations.ncp_compliance_risk_score, variant enforcement_screen
        constraints: "0..100; always 0 for role_type CUSTODIAL_PARTY"
      - name: enforcement_risk_tier
        type: enum
        source: computed
        description: tier band of enforcement_risk_score
        constraints: "one of {LOW, MEDIUM, HIGH}"
      - name: compromise_risk_score
        type: integer
        source: computed
        description: 0..100 score from calculations.ncp_compliance_risk_score, variant compromise_screen
        constraints: "0..100; always 0 for role_type CUSTODIAL_PARTY"
      - name: compromise_risk_tier
        type: enum
        source: computed
        description: tier band of compromise_risk_score
        constraints: "one of {LOW, MEDIUM, HIGH}"
      - name: total_arrears_certified_cents
        type: integer
        source: computed
        description: >
          sum over every SupportCase whose noncustodial_party_id equals this
          participant id and whose case_status != CLOSED of
          (arrears_principal_cents + statutory interest total); cross-entity computed field
      - name: open_case_count
        type: integer
        source: computed
        description: count of SupportCase rows referencing this participant in either party field with case_status != CLOSED

  - name: SupportCase
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: case_type
        type: enum
        source: input
        description: how the case entered the IV-D program
        constraints: "one of {PA_REFERRAL, DIRECT_APPLICATION}"
      - name: custodial_party_id
        type: string
        source: input
        description: FK -> Participant.id; must have role_type CUSTODIAL_PARTY
      - name: noncustodial_party_id
        type: string
        source: input
        description: FK -> Participant.id; must have role_type NONCUSTODIAL_PARTY
      - name: child_count
        type: integer
        source: input
        description: number of children covered by the case
        constraints: "1..6"
      - name: tanf_assistance
        type: boolean
        source: input
        description: true when the custodial household receives TANF, which assigns arrears to the state
        constraints: "MUST be true when case_type == PA_REFERRAL; MUST be false when case_type == DIRECT_APPLICATION"
      - name: good_cause_claim
        type: boolean
        source: input
        description: true when a family-violence good-cause claim bars locate and enforcement disclosure
        default: false
      - name: case_status
        type: enum
        source: system
        description: lifecycle dimension of the case (independent of enforcement_posture)
        default: OPENED
        constraints: "one of {OPENED, LOCATE, PATERNITY_PENDING, ORDER_ESTABLISHMENT, ENFORCEMENT, CLOSED}"
      - name: enforcement_posture
        type: enum
        source: system
        description: escalation dimension of the case, evolving independently of case_status
        default: NORMAL
        constraints: "one of {NORMAL, ESCALATED, STAYED}"
      - name: interstate_role
        type: enum
        source: system
        description: role this state plays once an InterstateReferral exists on the case
        default: NONE
        constraints: "one of {NONE, INITIATING, RESPONDING}"
      - name: locate_referral_count
        type: integer
        source: system
        description: number of locate-request calls made on this case
        default: 0
      - name: arrears_principal_cents
        type: integer
        source: computed
        description: >
          sum of ObligationCharge.unpaid_balance_cents for this case over charges with
          status == OPEN and due_date <= current clock date
      - name: total_charged_principal_cents
        type: integer
        source: system
        description: running sum of amount_cents of every non-VOID ObligationCharge created on this case
        default: 0
      - name: total_collected_principal_cents
        type: integer
        source: system
        description: running sum of applied_current + applied_medical + applied_arrears + applied_genetic_cost across this case's payments
        default: 0
      - name: interest_collected_cents
        type: integer
        source: system
        description: running sum of applied_interest_cents across this case's payments
        default: 0
      - name: interest_written_off_cents
        type: integer
        source: system
        description: interest currently waived by an ACCEPTED/ACTIVE/COMPLETED CompromiseOffer; reversed on DEFAULTED
        default: 0
      - name: interest_receivable_cents
        type: integer
        source: computed
        description: "aggregate-variant interest total minus interest_written_off_cents minus interest_collected_cents; floor 0"
      - name: assigned_arrears_cents
        type: integer
        source: computed
        description: >
          portion of arrears_principal_cents assigned to the state: equals
          arrears_principal_cents when tanf_assistance is true, else 0
      - name: unassigned_arrears_cents
        type: integer
        source: computed
        description: arrears_principal_cents - assigned_arrears_cents
      - name: unapplied_credit_cents
        type: integer
        source: system
        description: money received that no bucket could absorb, plus applications reversed by order vacatur
        default: 0
      - name: closed_reason
        type: enum
        source: system
        description: why the case was closed
        default: null
        constraints: "one of {ARREARS_SATISFIED, NO_JURISDICTION, CP_REQUEST, CHILD_EMANCIPATED}"
      - name: closed_at
        type: datetime
        source: system
        description: logical-clock instant at which case_status became CLOSED
        default: null

  - name: PaternityAction
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: case_id
        type: string
        source: input
        description: FK -> SupportCase.id; at most one PaternityAction per case
      - name: method
        type: enum
        source: input
        description: establishment route selected at creation
        constraints: "one of {VOLUNTARY_ACKNOWLEDGMENT, GENETIC_TEST, PRESUMED_MARITAL}"
      - name: status
        type: enum
        source: system
        description: cyclic paternity lifecycle; PRESUMED_MARITAL initializes directly to NOT_REQUIRED
        default: PENDING
        constraints: "one of {PENDING, AOP_SIGNED, AOP_RESCINDED, GENETIC_ORDERED, GENETIC_COLLECTED, ESTABLISHED, EXCLUDED, NOT_REQUIRED}"
      - name: notary_verified
        type: boolean
        source: input
        description: true when the acknowledgment of parentage was executed before a notary
        default: false
      - name: aop_signed_at
        type: datetime
        source: system
        description: logical-clock instant the acknowledgment was signed
        default: null
      - name: rescission_deadline_at
        type: datetime
        source: computed
        description: aop_signed_at + RESCISSION_WINDOW_DAYS (60); null whenever aop_signed_at is null
        default: null
      - name: rescission_count
        type: integer
        source: system
        description: number of times an acknowledgment on this action has been rescinded
        default: 0
      - name: genetic_test_ordered_at
        type: datetime
        source: system
        description: logical-clock instant genetic testing was ordered
        default: null
      - name: collection_appointment_at
        type: datetime
        source: input
        description: scheduled specimen-collection instant supplied when genetic testing is ordered
        default: null
      - name: specimen_collected_at
        type: datetime
        source: system
        description: logical-clock instant the specimen was collected
        default: null
      - name: specimen_rejection_count
        type: integer
        source: system
        description: number of specimens rejected for broken chain of custody
        default: 0
      - name: chain_of_custody_ok
        type: boolean
        source: system
        description: chain-of-custody flag reported at the most recent collection
        default: null
      - name: genetic_probability_pct
        type: number
        source: system
        description: probability of paternity reported by the lab, 2 decimal places
        default: null
        constraints: "0.00..100.00"
      - name: genetic_cost_cents
        type: integer
        source: system
        description: >
          cost of the genetic test in cents; stamped to GENETIC_TEST_COST_CENTS
          (48000) by POST /paternity-actions/{id}/genetic-test-order, never
          supplied by the caller
        default: 0
      - name: genetic_cost_liable_party
        type: enum
        source: system
        description: >
          who is billed for the genetic test once paternity is settled; NCP on an
          ESTABLISHED result, STATE on an EXCLUDED result
        default: NONE
        constraints: "one of {NONE, NCP, STATE}"
      - name: established_at
        type: datetime
        source: system
        description: logical-clock instant status became ESTABLISHED
        default: null
      - name: established_method
        type: enum
        source: system
        description: route that actually established paternity
        default: null
        constraints: "one of {VOLUNTARY_ACKNOWLEDGMENT, GENETIC_TEST, PRESUMED_MARITAL}"

  - name: SupportOrder
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: case_id
        type: string
        source: input
        description: FK -> SupportCase.id
      - name: order_type
        type: enum
        source: input
        description: >
          what the order obligates. Interval-overlap (validation priority 22),
          controlling-order determination and the enforcement obligation lookup
          are all scoped per order_type, so a case may carry one live order of
          each type simultaneously.
        constraints: "one of {CURRENT_SUPPORT, MEDICAL_SUPPORT}"
      - name: origin_state_code
        type: string
        source: input
        description: state that issued the order; foreign orders registered under UIFSA carry the other state's code
        default: MN
        constraints: "one of {MN, TX, NY, WI, FL, CA, PA}"
      - name: status
        type: enum
        source: system
        description: branching order lifecycle with a findings-rejection revert edge
        default: DRAFT
        constraints: "one of {DRAFT, CALCULATED, PENDING_DEVIATION_FINDINGS, ENTERED, SUPERSEDED, VACATED}"
      - name: effective_date
        type: string
        source: input
        description: ISO date (YYYY-MM-DD) the obligation starts; may be retroactive within RETROACTIVE_SUPPORT_LIMIT_DAYS
      - name: terminated_date
        type: string
        source: system
        description: ISO date the obligation stopped, set when the order is SUPERSEDED or VACATED
        default: null
      - name: requested_monthly_cents
        type: integer
        source: input
        description: monthly amount the caseworker asks the order to carry; null means take the guideline amount
        default: null
        constraints: ">= 0 when present"
      - name: medical_support_monthly_cents
        type: integer
        source: input
        description: monthly cash medical support add-on
        default: 0
        constraints: ">= 0"
      - name: guideline_monthly_cents
        type: integer
        source: computed
        description: output of calculations.guideline_support_obligation; null until calculate-guideline runs
        default: null
      - name: guideline_cp_income_cents
        type: integer
        source: system
        description: CP income actually used by the last guideline run (imputed value when imputation applied)
        default: null
      - name: guideline_ncp_income_cents
        type: integer
        source: system
        description: NCP income actually used by the last guideline run (imputed value when imputation applied)
        default: null
      - name: guideline_basic_obligation_cents
        type: integer
        source: system
        description: basic obligation for the combined income tier before the NCP share is applied
        default: null
      - name: guideline_ncp_share_ratio
        type: number
        source: system
        description: NCP income share rounded half-up to 4 decimal places
        default: null
      - name: multi_family_credit_cents
        type: integer
        source: system
        description: credit subtracted for the NCP's other ENTERED orders
        default: 0
      - name: imputation_applied
        type: boolean
        source: system
        description: true when the last guideline run imputed income for a party
        default: false
      - name: monthly_obligation_cents
        type: integer
        source: system
        description: current-support amount the order actually charges; null until the order is ENTERED
        default: null
      - name: arrears_recovery_monthly_cents
        type: integer
        source: computed
        description: round_half_up(monthly_obligation_cents * ARREARS_RECOVERY_PCT); 0 before entry
        default: 0
      - name: deviation_applied
        type: boolean
        source: system
        description: true when the entered amount deviates from guideline_monthly_cents by more than DEVIATION_TOLERANCE_PCT
        default: false
      - name: deviation_requested_cents
        type: integer
        source: system
        description: amount awaiting deviation findings; cleared when findings are rejected
        default: null
      - name: deviation_reason
        type: enum
        source: system
        description: statutory basis recorded by the approving attorney
        default: null
        constraints: "one of {EXTRAORDINARY_MEDICAL, SHARED_PARENTING, HIGH_INCOME, HARDSHIP}"
      - name: deviation_rejection_count
        type: integer
        source: system
        description: number of times deviation findings were rejected on this order
        default: 0
      - name: drafted_by_user_id
        type: string
        source: system
        description: X-User-ID of the CaseWorker that created the order (segregation-of-duties anchor)
      - name: findings_approved_by_user_id
        type: string
        source: system
        description: X-User-ID of the SupervisingAttorney that approved deviation findings
        default: null
      - name: superseded_by_order_id
        type: string
        source: system
        description: FK -> SupportOrder.id; set on the prior order when a modification order is entered
        default: null
      - name: next_accrual_due_date
        type: string
        source: system
        description: ISO date of the next obligation period start not yet charged; frozen when the order leaves ENTERED
        default: null
      - name: vacate_reason
        type: enum
        source: system
        description: why the order was vacated
        default: null
        constraints: "one of {PATERNITY_EXCLUDED, JURISDICTION_DEFECT, CLERICAL_ERROR}"

  - name: Employer
    parent: null
    common_fields: true
    entity_kind: configuration
    fields:
      - name: legal_name
        type: string
        source: input
        description: registered legal name of the employer
      - name: fein
        type: string
        source: input
        description: federal employer identification number, NN-NNNNNNN
        constraints: "matches ^[0-9]{2}-[0-9]{7}$; unique across employers"
      - name: state_code
        type: string
        source: input
        description: state of the employer's principal place of business; governs the withholding cap under UIFSA
        constraints: "one of {MN, TX, NY, WI, FL, CA, PA}"
      - name: pay_frequency
        type: enum
        source: input
        description: payroll cycle used to schedule remittances
        constraints: "one of {WEEKLY, BIWEEKLY, SEMIMONTHLY, MONTHLY}"
      - name: remittance_fee_cents
        type: integer
        source: input
        description: per-payment administrative fee the employer may retain from the employee
        default: 0
        constraints: "0..500"
      - name: statutory_cap_pct
        type: number
        source: computed
        description: STATE_CAP_TABLE[state_code]; the ceiling this employer's state law places on withholding
      - name: active_iwo_count
        type: integer
        source: computed
        description: count of IncomeWithholdingOrder rows with employer_id == this id and service_status IN {ISSUED, SERVED, AMENDED}

  - name: IncomeWithholdingOrder
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: order_id
        type: string
        source: input
        description: FK -> SupportOrder.id; the ENTERED order this withholding implements
      - name: employer_id
        type: string
        source: input
        description: FK -> Employer.id; the payor of income being served
      - name: service_status
        type: enum
        source: system
        description: service dimension, independent of remittance_status
        default: ISSUED
        constraints: "one of {ISSUED, SERVED, AMENDED, TERMINATED}"
      - name: remittance_status
        type: enum
        source: system
        description: payment-behavior dimension, independent of service_status
        default: NOT_DUE
        constraints: "one of {NOT_DUE, CURRENT, DELINQUENT, DEFAULTED}"
      - name: jurisdiction_state_code
        type: string
        source: computed
        description: copy of the Employer.state_code whose law caps this withholding
      - name: reported_disposable_income_cents
        type: integer
        source: computed
        description: >
          employer-reported disposable income when supplied at service, otherwise
          ncp.monthly_gross_income_cents - round_half_up(gross * MANDATORY_DEDUCTION_PCT)
      - name: federal_cap_pct
        type: number
        source: computed
        description: CCPA federal tier from supports_second_family x arrears-at-or-over-3-months
      - name: ccpa_cap_pct
        type: number
        source: computed
        description: min(federal_cap_pct, Employer.statutory_cap_pct) — the multi-state effective cap
      - name: ccpa_cap_amount_cents
        type: integer
        source: computed
        description: round_half_up(reported_disposable_income_cents * ccpa_cap_pct)
      - name: arrears_recovery_cents
        type: integer
        source: computed
        description: round_half_up(order.monthly_obligation_cents * ARREARS_RECOVERY_PCT) when case arrears > 0, else 0
      - name: requested_amount_cents
        type: integer
        source: computed
        description: order.monthly_obligation_cents + order.medical_support_monthly_cents + arrears_recovery_cents
      - name: withholding_amount_cents
        type: integer
        source: computed
        description: min(requested_amount_cents, ccpa_cap_amount_cents)
      - name: employer_fee_cents
        type: integer
        source: computed
        description: min(Employer.remittance_fee_cents, reported_disposable_income_cents - withholding_amount_cents); never counted against the cap
      - name: served_at
        type: datetime
        source: system
        description: logical-clock instant the employer acknowledged service
        default: null
      - name: first_withholding_due_at
        type: datetime
        source: system
        description: served_at + IWO_FIRST_WITHHOLDING_LAG_DAYS (14)
        default: null
      - name: next_remittance_due_at
        type: datetime
        source: system
        description: instant the next remittance is expected; advances one month per satisfied or missed cycle
        default: null
      - name: missed_remittance_count
        type: integer
        source: system
        description: number of remittance cycles closed with no INCOME_WITHHOLDING payment
        default: 0
      - name: terminated_reason
        type: enum
        source: system
        description: why the withholding order stopped
        default: null
        constraints: "one of {EMPLOYMENT_ENDED, ORDER_VACATED, ORDER_SUPERSEDED, SUPERSEDED_BY_NEW_IWO, CASE_CLOSED}"

  - name: ObligationCharge
    parent: null
    common_fields: false
    entity_kind: event
    fields:
      - name: case_id
        type: string
        source: system
        description: FK -> SupportCase.id
      - name: order_id
        type: string
        source: system
        description: FK -> SupportOrder.id; the order that generated this charge
      - name: charge_type
        type: enum
        source: system
        description: what the charge bills for
        constraints: "one of {CURRENT_SUPPORT, MEDICAL_SUPPORT, ARREARS_JUDGMENT, GENETIC_TEST_COST}"
      - name: period_start_date
        type: string
        source: system
        description: ISO date, inclusive start of the obligation period
      - name: period_end_date
        type: string
        source: system
        description: ISO date, EXCLUSIVE end of the obligation period; adjacency (prev end == next start) is legal
      - name: due_date
        type: string
        source: system
        description: >
          ISO date the charge became payable; caller-supplied and MUST satisfy
          period_start_date <= due_date < period_end_date. It is the anchor for
          the statutory interest variant, so it is NOT forced to the period start.
      - name: amount_cents
        type: integer
        source: system
        description: amount billed for the period
      - name: paid_cents
        type: integer
        source: system
        description: cumulative amount applied to this charge by payment distribution
        default: 0
      - name: unpaid_balance_cents
        type: integer
        source: computed
        description: amount_cents - paid_cents; 0 when status is SATISFIED or VOID
      - name: interest_accrued_cents
        type: integer
        source: computed
        description: statutory per-charge interest from calculations.arrears_interest_accrual variant statutory_per_charge
      - name: status
        type: enum
        source: system
        description: charge lifecycle
        default: OPEN
        constraints: "one of {OPEN, SATISFIED, VOID}"

  - name: PaymentTransaction
    parent: null
    common_fields: false
    entity_kind: event
    fields:
      - name: case_id
        type: string
        source: system
        description: FK -> SupportCase.id
      - name: iwo_id
        type: string
        source: system
        description: FK -> IncomeWithholdingOrder.id; null for payments not received through withholding
        default: null
      - name: compromise_offer_id
        type: string
        source: input
        description: FK -> CompromiseOffer.id; set when the payment is a compromise installment
        default: null
      - name: source
        type: enum
        source: input
        description: collection channel that produced the money
        constraints: "one of {INCOME_WITHHOLDING, DIRECT_PAY, TAX_REFUND_INTERCEPT, LIEN_LEVY, COMPROMISE_INSTALLMENT, REVERSAL}"
      - name: amount_cents
        type: integer
        source: input
        description: money received; negative only when source == REVERSAL
        constraints: "> 0 unless source == REVERSAL, in which case < 0"
      - name: received_at
        type: datetime
        source: system
        description: logical-clock instant the payment posted
      - name: applied_current_cents
        type: integer
        source: computed
        description: bucket 1 of calculations.payment_distribution_waterfall
      - name: applied_medical_cents
        type: integer
        source: computed
        description: bucket 2 of calculations.payment_distribution_waterfall
      - name: applied_arrears_cents
        type: integer
        source: computed
        description: bucket 3 of calculations.payment_distribution_waterfall
      - name: applied_interest_cents
        type: integer
        source: computed
        description: bucket 4 of calculations.payment_distribution_waterfall
      - name: applied_genetic_cost_cents
        type: integer
        source: computed
        description: bucket 5 of calculations.payment_distribution_waterfall
      - name: unapplied_credit_cents
        type: integer
        source: computed
        description: overflow that no bucket absorbed, added to SupportCase.unapplied_credit_cents
      - name: retained_by_state_cents
        type: integer
        source: computed
        description: portion kept by the state under TANF assignment
      - name: disbursed_to_cp_cents
        type: integer
        source: computed
        description: amount_cents - retained_by_state_cents

  - name: ModificationReview
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: case_id
        type: string
        source: system
        description: FK -> SupportCase.id; copied from the reviewed order
      - name: order_id
        type: string
        source: input
        description: FK -> SupportOrder.id; the ENTERED order under review
      - name: trigger_type
        type: enum
        source: input
        description: statutory basis for opening the review
        constraints: "one of {PARTY_REQUEST, PERIODIC_36_MONTH, PA_MANDATORY}"
      - name: status
        type: enum
        source: system
        description: cyclic review lifecycle; INFO_PENDING returns to REQUESTED when information arrives
        default: REQUESTED
        constraints: "one of {REQUESTED, INFO_PENDING, THRESHOLD_MET, THRESHOLD_NOT_MET, ORDER_PROPOSED}"
      - name: current_obligation_snapshot_cents
        type: integer
        source: system
        description: order.monthly_obligation_cents captured at creation; the denominator of the variance test
      - name: recalculated_guideline_cents
        type: integer
        source: computed
        description: guideline_support_obligation re-run against current incomes at screening time
        default: null
      - name: variance_numerator_cents
        type: integer
        source: computed
        description: abs(recalculated_guideline_cents - current_obligation_snapshot_cents)
        default: null
      - name: substantial_change_met
        type: boolean
        source: computed
        description: output of calculations.substantial_change_variance
        default: null
      - name: info_request_count
        type: integer
        source: system
        description: number of times screening bounced to INFO_PENDING
        default: 0
      - name: info_requested_reason
        type: enum
        source: system
        description: which party's income blocked screening
        default: null
        constraints: "one of {NCP_INCOME_UNVERIFIED, CP_INCOME_UNVERIFIED}"
      - name: review_eligible_date
        type: string
        source: computed
        description: order.effective_date + PERIODIC_REVIEW_MONTHS (36); PERIODIC_36_MONTH reviews may not be created before it
      - name: screened_at
        type: datetime
        source: system
        description: logical-clock instant of the most recent screening
        default: null
      - name: proposed_order_id
        type: string
        source: system
        description: FK -> SupportOrder.id; the CALCULATED successor order created by propose-order
        default: null

  - name: EnforcementAction
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: case_id
        type: string
        source: input
        description: FK -> SupportCase.id
      - name: action_type
        type: enum
        source: input
        description: remedy pursued
        constraints: "one of {LICENSE_SUSPENSION, TAX_REFUND_INTERCEPT, PROPERTY_LIEN, CONTEMPT_REFERRAL, CREDIT_BUREAU_REPORT}"
      - name: status
        type: enum
        source: system
        description: fork-join lifecycle; NOTICE_SENT forks to CONTESTED or straight to ACTIVE
        default: PROPOSED
        constraints: "one of {PROPOSED, NOTICE_SENT, CONTESTED, ACTIVE, DENIED, RELEASED}"
      - name: arrears_certified_snapshot_cents
        type: integer
        source: system
        description: statutory-variant certified arrears at proposal time (principal + statutory interest)
      - name: eligibility_threshold_cents
        type: integer
        source: system
        description: threshold from calculations.enforcement_eligibility_thresholds that the snapshot had to clear
      - name: notice_sent_at
        type: datetime
        source: system
        description: logical-clock instant the pre-deprivation notice went out
        default: null
      - name: contest_deadline_at
        type: datetime
        source: system
        description: notice_sent_at + CONTEST_WINDOW_DAYS (30)
        default: null
      - name: contested_at
        type: datetime
        source: system
        description: logical-clock instant the NCP contested
        default: null
      - name: contest_grounds
        type: enum
        source: input
        description: NCP's stated basis for contesting
        default: null
        constraints: "one of {MISTAKE_OF_FACT, IDENTITY, PAYMENT_MADE, INABILITY_TO_PAY}"
      - name: review_decision
        type: enum
        source: input
        description: administrative review outcome on a contested action
        default: null
        constraints: "one of {UPHOLD, VACATE}"
      - name: proposed_by_user_id
        type: string
        source: system
        description: X-User-ID of the proposer (segregation-of-duties anchor)
      - name: review_decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the attorney that decided the contest; MUST differ from proposed_by_user_id
        default: null
      - name: activated_at
        type: datetime
        source: system
        description: logical-clock instant the remedy took effect
        default: null
      - name: released_at
        type: datetime
        source: system
        description: logical-clock instant the remedy was lifted
        default: null
      - name: release_reason
        type: enum
        source: system
        description: why the remedy was lifted
        default: null
        constraints: "one of {ARREARS_SATISFIED, COMPROMISE_ACCEPTED, ORDER_VACATED, PLAN_COMPLIANT, INTERCEPT_REVERSED}"
      - name: remedy_applied
        type: boolean
        source: system
        description: true while the participant-level flag for this action_type is set
        default: false

  - name: InterstateReferral
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: case_id
        type: string
        source: input
        description: FK -> SupportCase.id
      - name: direction
        type: enum
        source: input
        description: INITIATING when this state asks another state to act; RESPONDING when this state acts for another
        constraints: "one of {INITIATING, RESPONDING}"
      - name: other_state_code
        type: string
        source: input
        description: the sister state on the transmittal
        constraints: "one of {TX, NY, WI, FL, CA, PA}"
      - name: child_home_state_code
        type: string
        source: input
        description: home state of the child; the first ranking key of the controlling-order determination
        constraints: "one of {MN, TX, NY, WI, FL, CA, PA}"
      - name: transmittal_type
        type: enum
        source: input
        description: what the transmittal asks for
        constraints: "one of {ESTABLISHMENT, ENFORCEMENT, MODIFICATION}"
      - name: status
        type: enum
        source: system
        description: UIFSA transmittal lifecycle
        default: DRAFT
        constraints: "one of {DRAFT, TRANSMITTED, REGISTERED, ENFORCING, RETURNED}"
      - name: transmitted_at
        type: datetime
        source: system
        description: logical-clock instant the transmittal was sent
        default: null
      - name: ack_due_at
        type: datetime
        source: system
        description: transmitted_at + ACK_WINDOW_DAYS (10)
        default: null
      - name: registered_at
        type: datetime
        source: system
        description: logical-clock instant the foreign order was registered here
        default: null
      - name: controlling_order_id
        type: string
        source: system
        description: FK -> SupportOrder.id; winner of calculations.controlling_order_determination
        default: null
      - name: controlling_order_state_code
        type: string
        source: system
        description: origin_state_code of the controlling order; gates modification authority (CEJ)
        default: null
      - name: returned_reason
        type: enum
        source: system
        description: why the transmittal came back unworked
        default: null
        constraints: "one of {NO_ACK_RECEIVED, INSUFFICIENT_INFO, NO_JURISDICTION}"

  - name: CompromiseOffer
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: case_id
        type: string
        source: input
        description: FK -> SupportCase.id
      - name: status
        type: enum
        source: system
        description: compromise lifecycle; DEFAULTED reverses the waiver
        default: PROPOSED
        constraints: "one of {PROPOSED, ACCEPTED, ACTIVE, COMPLETED, DEFAULTED, SUPERSEDED}"
      - name: principal_due_snapshot_cents
        type: integer
        source: system
        description: case.arrears_principal_cents captured at offer creation
      - name: interest_due_snapshot_cents
        type: integer
        source: system
        description: aggregate-variant interest total captured at offer creation
      - name: pre_waiver_total_cents
        type: integer
        source: computed
        description: principal_due_snapshot_cents + interest_due_snapshot_cents; the ONLY input to the waiver-tier lookup
      - name: waiver_tier_pct
        type: number
        source: computed
        description: WAIVER_TIER_TABLE band selected by pre_waiver_total_cents
      - name: interest_waiver_cents
        type: integer
        source: computed
        description: round_half_up(interest_due_snapshot_cents * waiver_tier_pct)
      - name: settlement_total_cents
        type: integer
        source: computed
        description: pre_waiver_total_cents - interest_waiver_cents
      - name: installment_count
        type: integer
        source: input
        description: number of monthly installments
        constraints: "3..36"
      - name: monthly_installment_cents
        type: integer
        source: computed
        description: floor(settlement_total_cents / installment_count)
      - name: final_installment_cents
        type: integer
        source: computed
        description: settlement_total_cents - monthly_installment_cents * (installment_count - 1)
      - name: accepted_at
        type: datetime
        source: system
        description: logical-clock instant the NCP accepted
        default: null
      - name: next_installment_due_date
        type: string
        source: system
        description: ISO date of the next unpaid installment; accepted_at date + k months
        default: null
      - name: compliance_payment_count
        type: integer
        source: system
        description: number of COMPROMISE_INSTALLMENT payments credited to this offer
        default: 0
      - name: defaulted_at
        type: datetime
        source: system
        description: logical-clock instant the plan defaulted
        default: null
      - name: completed_at
        type: datetime
        source: system
        description: logical-clock instant the final installment posted
        default: null

# =============================================================================
# 1.2 STATE MACHINE TABLE
# 13 machine entries over 9 stateful entities. SupportCase carries three
# independent dimensions and IncomeWithholdingOrder two, so those entities get
# one entry per dimension (`dimension:` names the field being driven).
# =============================================================================
state_machines:

  - entity: SupportCase
    dimension: case_status
    initial_state: OPENED
    terminal_states: [CLOSED]
    transitions:
      - from: OPENED
        to: LOCATE
        trigger: "POST /child-support/cases/{case_id}/locate-referrals"
        actor: CaseWorker
        preconditions:
          - "case.good_cause_claim == false (a good-cause case may not be referred to locate)"
          - "noncustodial party locate_status in {NOT_NEEDED, PENDING}"
        side_effects:
          - "case.locate_referral_count += 1"
          - "noncustodial Participant.locate_status := PENDING"
          - "noncustodial Participant.locate_attempt_count += 1"
      - from: LOCATE
        to: LOCATE
        trigger: "POST /child-support/cases/{case_id}/locate-referrals (repeat referral)"
        actor: CaseWorker
        preconditions:
          - "noncustodial Participant.locate_status == PENDING"
          - "noncustodial Participant.locate_attempt_count < MAX_LOCATE_ATTEMPTS (3)"
        side_effects:
          - "case.locate_referral_count += 1"
          - "noncustodial Participant.locate_attempt_count += 1"
          - "on the attempt that reaches MAX_LOCATE_ATTEMPTS the participant is set locate_status := UNLOCATABLE"
        note: "self-loop; the 4th referral is rejected with ERR_LOCATE_ATTEMPTS_EXHAUSTED"
      - from: LOCATE
        to: PATERNITY_PENDING
        trigger: "POST /child-support/cases/{case_id}/paternity-actions with method in {VOLUNTARY_ACKNOWLEDGMENT, GENETIC_TEST}"
        actor: CaseWorker
        preconditions:
          - "noncustodial Participant.locate_status == LOCATED"
          - "no PaternityAction already exists on the case"
        side_effects:
          - "PaternityAction created in PENDING"
      - from: OPENED
        to: PATERNITY_PENDING
        trigger: "POST /child-support/cases/{case_id}/paternity-actions with method in {VOLUNTARY_ACKNOWLEDGMENT, GENETIC_TEST}"
        actor: CaseWorker
        preconditions:
          - "case.good_cause_claim == true (locate is barred, so paternity may start straight from OPENED)"
        side_effects:
          - "PaternityAction created in PENDING"
        note: "the good-cause bypass; without the flag a case must pass through LOCATE first"
      - from: OPENED
        to: ORDER_ESTABLISHMENT
        trigger: "POST /child-support/cases/{case_id}/paternity-actions with method == PRESUMED_MARITAL"
        actor: CaseWorker
        preconditions:
          - "no PaternityAction already exists on the case"
        side_effects:
          - "PaternityAction created directly in terminal NOT_REQUIRED"
          - "case skips PATERNITY_PENDING entirely"
      - from: PATERNITY_PENDING
        to: ORDER_ESTABLISHMENT
        trigger: "system: PaternityAction reaches ESTABLISHED"
        actor: system
        preconditions:
          - "PaternityAction.status == ESTABLISHED"
        side_effects:
          - "case becomes eligible for POST /child-support/cases/{case_id}/orders"
      - from: ORDER_ESTABLISHMENT
        to: ENFORCEMENT
        trigger: "system: POST /child-support/orders/{order_id}/entry on a CURRENT_SUPPORT order of this case"
        actor: system
        preconditions:
          - "SupportOrder.status becomes ENTERED"
        side_effects:
          - "order.next_accrual_due_date := order.effective_date"
          - "case becomes eligible for withholding, enforcement and modification"
      - from: PATERNITY_PENDING
        to: CLOSED
        trigger: "system: PaternityAction reaches EXCLUDED"
        actor: system
        preconditions:
          - "PaternityAction.status == EXCLUDED"
        side_effects:
          - "case.closed_reason := NO_JURISDICTION"
          - "case.closed_at := current logical clock"
          - "cascade: every non-terminal SupportOrder on the case is VACATED"
          - "cascade: every OPEN ObligationCharge on the case is VOID"
          - "cascade: every non-terminal EnforcementAction on the case is RELEASED with release_reason ORDER_VACATED"
        note: "depth-4 cascade: paternity -> case -> orders -> charges/enforcement -> Participant remedy flags"
      - from: LOCATE
        to: CLOSED
        trigger: "POST /child-support/cases/{case_id}/closure"
        actor: SupervisingAttorney
        preconditions:
          - "noncustodial Participant.locate_status == UNLOCATABLE"
          - "closed_reason == NO_JURISDICTION"
        side_effects:
          - "case.closed_at := current logical clock"
      - from: ENFORCEMENT
        to: CLOSED
        trigger: "POST /child-support/cases/{case_id}/closure"
        actor: SupervisingAttorney
        preconditions:
          - "case.arrears_principal_cents == 0 when closed_reason == ARREARS_SATISFIED"
          - "no EnforcementAction on the case is in ACTIVE"
          - "no CompromiseOffer on the case is in {ACCEPTED, ACTIVE}"
        side_effects:
          - "case.closed_at := current logical clock"
          - "cascade: every SERVED IncomeWithholdingOrder on the case is TERMINATED with terminated_reason CASE_CLOSED"
          - "Participant.open_case_count recomputed for both parties"
      - from: ORDER_ESTABLISHMENT
        to: CLOSED
        trigger: "POST /child-support/cases/{case_id}/closure"
        actor: SupervisingAttorney
        preconditions:
          - "closed_reason in {CP_REQUEST, CHILD_EMANCIPATED}"
          - "case.tanf_assistance == false (an assigned-arrears case may not close on CP request)"
        side_effects:
          - "case.closed_at := current logical clock"

  - entity: SupportCase
    dimension: enforcement_posture
    initial_state: NORMAL
    terminal_states: []
    transitions:
      - from: NORMAL
        to: ESCALATED
        trigger: "system: POST /child-support/enforcement-actions/{enforcement_action_id}/activation"
        actor: system
        preconditions:
          - "EnforcementAction.status becomes ACTIVE"
        side_effects:
          - "case.enforcement_posture := ESCALATED"
      - from: ESCALATED
        to: NORMAL
        trigger: "system: last ACTIVE EnforcementAction on the case is released"
        actor: system
        preconditions:
          - "count of EnforcementAction with status == ACTIVE on the case reaches 0"
        side_effects:
          - "case.enforcement_posture := NORMAL"
      - from: NORMAL
        to: STAYED
        trigger: "system: POST /child-support/compromise-offers/{compromise_offer_id}/acceptance"
        actor: system
        preconditions:
          - "CompromiseOffer.status becomes ACCEPTED"
        side_effects:
          - "case.interest_written_off_cents += offer.interest_waiver_cents"
      - from: ESCALATED
        to: STAYED
        trigger: "system: POST /child-support/compromise-offers/{compromise_offer_id}/acceptance"
        actor: system
        preconditions:
          - "CompromiseOffer.status becomes ACCEPTED"
        side_effects:
          - "case.interest_written_off_cents += offer.interest_waiver_cents"
          - "cascade: every ACTIVE EnforcementAction on the case is RELEASED with release_reason COMPROMISE_ACCEPTED"
          - "cascade: the released actions clear Participant.license_suspension_active / lien_recorded / credit_bureau_reported"
        note: "the stay is what makes enforcement and compromise mutually exclusive on one case"
      - from: STAYED
        to: ESCALATED
        trigger: "POST /child-support/compromise-offers/{compromise_offer_id}/default-declaration"
        actor: FinanceOfficer
        preconditions:
          - "CompromiseOffer.status in {ACCEPTED, ACTIVE}"
          - "current logical clock date > offer.next_installment_due_date"
        side_effects:
          - "offer.status := DEFAULTED"
          - "case.interest_written_off_cents -= offer.interest_waiver_cents (the waiver is reinstated as receivable)"
          - "case becomes eligible for new EnforcementAction rows again"
      - from: STAYED
        to: NORMAL
        trigger: "system: final installment payment posted to the offer"
        actor: system
        preconditions:
          - "offer.compliance_payment_count == offer.installment_count"
        side_effects:
          - "offer.status := COMPLETED; offer.completed_at := current logical clock"
          - "case.interest_written_off_cents keeps the waiver permanently"

  - entity: SupportCase
    dimension: interstate_role
    initial_state: NONE
    terminal_states: []
    transitions:
      - from: NONE
        to: INITIATING
        trigger: "system: POST /child-support/interstate-referrals/{interstate_referral_id}/transmittal on a referral with direction INITIATING"
        actor: system
        preconditions:
          - "InterstateReferral.status becomes TRANSMITTED"
        side_effects:
          - "case.interstate_role := INITIATING"
      - from: NONE
        to: RESPONDING
        trigger: "system: POST /child-support/interstate-referrals/{interstate_referral_id}/registration on a referral with direction RESPONDING"
        actor: system
        preconditions:
          - "InterstateReferral.status becomes REGISTERED"
        side_effects:
          - "case.interstate_role := RESPONDING"
          - "referral.controlling_order_id / controlling_order_state_code set from controlling_order_determination"
      - from: INITIATING
        to: NONE
        trigger: "system: POST /child-support/interstate-referrals/{interstate_referral_id}/return"
        actor: system
        preconditions:
          - "no other InterstateReferral on the case is in {TRANSMITTED, REGISTERED, ENFORCING}"
        side_effects:
          - "case.interstate_role := NONE"
      - from: RESPONDING
        to: NONE
        trigger: "system: POST /child-support/interstate-referrals/{interstate_referral_id}/return"
        actor: system
        preconditions:
          - "no other InterstateReferral on the case is in {TRANSMITTED, REGISTERED, ENFORCING}"
        side_effects:
          - "case.interstate_role := NONE"

  - entity: PaternityAction
    dimension: status
    initial_state: PENDING
    terminal_states: [ESTABLISHED, EXCLUDED, NOT_REQUIRED]
    transitions:
      - from: PENDING
        to: NOT_REQUIRED
        trigger: "POST /child-support/cases/{case_id}/paternity-actions with method == PRESUMED_MARITAL"
        actor: CaseWorker
        preconditions: []
        side_effects:
          - "the row is created directly in NOT_REQUIRED (never observed in PENDING)"
          - "case.case_status := ORDER_ESTABLISHMENT"
        note: "creation-time short circuit for the marital presumption"
      - from: PENDING
        to: AOP_SIGNED
        trigger: "POST /child-support/paternity-actions/{paternity_action_id}/acknowledgment"
        actor: CaseWorker
        preconditions:
          - "action.method == VOLUNTARY_ACKNOWLEDGMENT"
          - "payload notary_verified == true"
          - "signed_by_participant_id == case.noncustodial_party_id"
        side_effects:
          - "action.aop_signed_at := current logical clock"
          - "action.rescission_deadline_at := aop_signed_at + RESCISSION_WINDOW_DAYS (60)"
          - "action.notary_verified := true"
      - from: AOP_SIGNED
        to: AOP_RESCINDED
        trigger: "POST /child-support/paternity-actions/{paternity_action_id}/rescission"
        actor: NoncustodialParty
        preconditions:
          - "current logical clock <= action.rescission_deadline_at (inclusive boundary)"
          - "action.rescission_count < RESCISSION_LIMIT (1)"
        side_effects:
          - "action.rescission_count += 1"
          - "action.aop_signed_at := null; action.rescission_deadline_at := null"
      - from: AOP_RESCINDED
        to: AOP_SIGNED
        trigger: "POST /child-support/paternity-actions/{paternity_action_id}/acknowledgment (re-execution)"
        actor: CaseWorker
        preconditions:
          - "payload notary_verified == true"
        side_effects:
          - "a fresh RESCISSION_WINDOW_DAYS window opens from the new aop_signed_at"
        note: "the cycle AOP_SIGNED -> AOP_RESCINDED -> AOP_SIGNED; a second rescission is rejected because rescission_count already equals RESCISSION_LIMIT"
      - from: AOP_SIGNED
        to: ESTABLISHED
        trigger: "system: POST /child-support/_clock/set_current_utc advances the clock past action.rescission_deadline_at"
        actor: system
        preconditions:
          - "new clock value > action.rescission_deadline_at"
        side_effects:
          - "action.established_at := the new clock value"
          - "action.established_method := VOLUNTARY_ACKNOWLEDGMENT"
          - "case.case_status := ORDER_ESTABLISHMENT"
        note: "the only system-driven establishment; a clock set exactly equal to the deadline does NOT establish"
      - from: PENDING
        to: GENETIC_ORDERED
        trigger: "POST /child-support/paternity-actions/{paternity_action_id}/genetic-test-order"
        actor: SupervisingAttorney
        preconditions:
          - "action.method == GENETIC_TEST"
          - "payload collection_appointment_at > current logical clock"
        side_effects:
          - "action.genetic_test_ordered_at := current logical clock"
          - "action.collection_appointment_at := payload value"
          - "action.genetic_cost_cents := GENETIC_TEST_COST_CENTS (48000)"
      - from: AOP_RESCINDED
        to: GENETIC_ORDERED
        trigger: "POST /child-support/paternity-actions/{paternity_action_id}/genetic-test-order"
        actor: SupervisingAttorney
        preconditions:
          - "payload collection_appointment_at > current logical clock"
        side_effects:
          - "action.method := GENETIC_TEST (the rescission converts the case to the genetic track)"
          - "action.genetic_cost_cents := GENETIC_TEST_COST_CENTS (48000)"
      - from: GENETIC_ORDERED
        to: GENETIC_ORDERED
        trigger: "POST /child-support/paternity-actions/{paternity_action_id}/specimen-collection with chain_of_custody_ok == false"
        actor: CaseWorker
        preconditions:
          - "current logical clock >= action.collection_appointment_at"
          - "action.specimen_rejection_count < SPECIMEN_REJECTION_LIMIT (2)"
        side_effects:
          - "action.specimen_rejection_count += 1"
          - "action.chain_of_custody_ok := false"
          - "action.specimen_collected_at stays null"
        note: "self-loop; the third rejected specimen is refused with ERR_SPECIMEN_REJECTION_LIMIT"
      - from: GENETIC_ORDERED
        to: GENETIC_COLLECTED
        trigger: "POST /child-support/paternity-actions/{paternity_action_id}/specimen-collection with chain_of_custody_ok == true"
        actor: CaseWorker
        preconditions:
          - "current logical clock >= action.collection_appointment_at"
        side_effects:
          - "action.specimen_collected_at := current logical clock"
          - "action.chain_of_custody_ok := true"
      - from: GENETIC_COLLECTED
        to: ESTABLISHED
        trigger: "POST /child-support/paternity-actions/{paternity_action_id}/genetic-result with genetic_probability_pct >= 99.0"
        actor: SupervisingAttorney
        preconditions:
          - "action.chain_of_custody_ok == true"
        side_effects:
          - "action.established_at := current logical clock"
          - "action.established_method := GENETIC_TEST"
          - "action.genetic_cost_liable_party := NCP"
          - "case.case_status := ORDER_ESTABLISHMENT"
      - from: GENETIC_COLLECTED
        to: EXCLUDED
        trigger: "POST /child-support/paternity-actions/{paternity_action_id}/genetic-result with genetic_probability_pct < 99.0"
        actor: SupervisingAttorney
        preconditions:
          - "action.chain_of_custody_ok == true"
        side_effects:
          - "action.genetic_cost_liable_party := STATE"
          - "case.case_status := CLOSED with closed_reason NO_JURISDICTION"
          - "cascade level 2: non-terminal SupportOrder rows on the case -> VACATED"
          - "cascade level 3: OPEN ObligationCharge rows of those orders -> VOID"
          - "cascade level 3: non-terminal EnforcementAction rows -> RELEASED (release_reason ORDER_VACATED)"
          - "cascade level 4: Participant.license_suspension_active / lien_recorded / credit_bureau_reported cleared; Participant.open_case_count recomputed"

  - entity: SupportOrder
    dimension: status
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, VACATED]
    transitions:
      - from: DRAFT
        to: CALCULATED
        trigger: "POST /child-support/orders/{order_id}/guideline-calculation"
        actor: CaseWorker
        preconditions:
          - "case.case_status in {ORDER_ESTABLISHMENT, ENFORCEMENT}"
          - "both parties have monthly_gross_income_cents set OR the NCP qualifies for imputation"
        side_effects:
          - "guideline_* fields and guideline_monthly_cents written from calculations.guideline_support_obligation"
          - "order.imputation_applied := true when the NCP income was imputed"
          - "order.multi_family_credit_cents written when the NCP supports_second_family"
          - "order.drafted_by_user_id := X-User-ID of the caller"
      - from: CALCULATED
        to: CALCULATED
        trigger: "POST /child-support/orders/{order_id}/guideline-calculation (re-run after an income update)"
        actor: CaseWorker
        preconditions:
          - "order.deviation_applied == false"
        side_effects:
          - "all guideline_* fields recomputed against current Participant incomes"
        note: "self-loop keeps the draft in sync with income changes before entry"
      - from: CALCULATED
        to: ENTERED
        trigger: "POST /child-support/orders/{order_id}/entry"
        actor: SupervisingAttorney
        preconditions:
          - "order.guideline_monthly_cents is not null"
          - "no other ENTERED order of the same order_type exists on the case with an overlapping effective interval"
          - "case.interstate_role != RESPONDING or the controlling order of the case originates in this state (CEJ)"
        side_effects:
          - "order.monthly_obligation_cents := order.guideline_monthly_cents"
          - "order.next_accrual_due_date := order.effective_date"
          - "case.case_status := ENFORCEMENT"
      - from: CALCULATED
        to: PENDING_DEVIATION_FINDINGS
        trigger: "POST /child-support/orders/{order_id}/deviation-request"
        actor: CaseWorker
        preconditions:
          - "abs(deviation_requested_cents - guideline_monthly_cents) * 100 >= guideline_monthly_cents * MIN_DEVIATION_PCT (10)"
          - "deviation_reason is one of the enumerated statutory reasons"
        side_effects:
          - "order.deviation_requested_cents / deviation_reason recorded"
      - from: PENDING_DEVIATION_FINDINGS
        to: ENTERED
        trigger: "POST /child-support/orders/{order_id}/deviation-findings with decision == APPROVE"
        actor: SupervisingAttorney
        preconditions:
          - "X-User-ID != order.drafted_by_user_id (segregation of duties)"
        side_effects:
          - "order.deviation_applied := true"
          - "order.findings_approved_by_user_id := X-User-ID"
          - "order.monthly_obligation_cents := order.deviation_requested_cents"
          - "order.next_accrual_due_date := order.effective_date"
          - "case.case_status := ENFORCEMENT"
        note: "join point: the guideline path and the deviation path converge on ENTERED with different monthly_obligation_cents"
      - from: PENDING_DEVIATION_FINDINGS
        to: CALCULATED
        trigger: "POST /child-support/orders/{order_id}/deviation-findings with decision == REJECT"
        actor: SupervisingAttorney
        preconditions:
          - "X-User-ID != order.drafted_by_user_id"
          - "order.deviation_rejection_count < DEVIATION_REJECTION_LIMIT (2)"
        side_effects:
          - "order.deviation_rejection_count += 1"
          - "order.deviation_requested_cents / deviation_reason cleared"
        note: "branch-with-revert; the third rejected request is refused with ERR_DEVIATION_REJECTION_LIMIT"
      - from: ENTERED
        to: SUPERSEDED
        trigger: "system: a successor order produced by POST /child-support/modification-reviews/{modification_review_id}/proposed-order reaches ENTERED"
        actor: system
        preconditions:
          - "successor.effective_date > this order.effective_date"
          - "successor.order_type == this order.order_type"
        side_effects:
          - "order.superseded_by_order_id := successor.id"
          - "order.terminated_date := successor.effective_date minus one day (closed-interval semantics)"
          - "no new ObligationCharge may be created against the superseded order"
      - from: ENTERED
        to: VACATED
        trigger: "POST /child-support/orders/{order_id}/vacatur"
        actor: SupervisingAttorney
        preconditions:
          - "no CompromiseOffer on the case is in {ACCEPTED, ACTIVE}"
        side_effects:
          - "order.vacate_reason recorded; order.terminated_date := current logical clock date"
          - "cascade: every OPEN ObligationCharge of the order -> VOID"
          - "cascade: applied_current / applied_arrears / applied_interest amounts of payments that had landed on those charges are returned to case.unapplied_credit_cents"
          - "cascade: every SERVED IncomeWithholdingOrder of the order -> TERMINATED with terminated_reason ORDER_VACATED"
          - "cascade: Employer.active_iwo_count decremented for each terminated IWO"
      - from: DRAFT
        to: VACATED
        trigger: "POST /child-support/orders/{order_id}/vacatur"
        actor: SupervisingAttorney
        preconditions: []
        side_effects:
          - "order.vacate_reason recorded; no charges or IWOs exist yet, so no cascade runs"

  - entity: IncomeWithholdingOrder
    dimension: service_status
    initial_state: ISSUED
    terminal_states: [TERMINATED]
    transitions:
      - from: ISSUED
        to: SERVED
        trigger: "POST /child-support/withholding-orders/{iwo_id}/service"
        actor: CaseWorker
        preconditions:
          - "iwo.withholding_amount_cents > 0"
          - "the parent SupportOrder.status == ENTERED"
        side_effects:
          - "iwo.served_at := current logical clock"
          - "iwo.first_withholding_due_at := served_at + EMPLOYER_IMPLEMENTATION_DAYS (14)"
          - "iwo.next_remittance_due_at := first_withholding_due_at"
          - "iwo.remittance_status := NOT_DUE (unchanged; the remittance dimension starts running only at the first due date)"
          - "Employer.active_iwo_count += 1"
      - from: SERVED
        to: AMENDED
        trigger: "POST /child-support/withholding-orders/{iwo_id}/amendment"
        actor: CaseWorker
        preconditions:
          - "payload reported_disposable_income_cents differs from the stored value"
        side_effects:
          - "ccpa_cap_pct / ccpa_cap_amount_cents / withholding_amount_cents / employer_fee_cents recomputed by calculations.withholding_amount"
          - "iwo.remittance_status is untouched (the two dimensions are independent)"
      - from: AMENDED
        to: AMENDED
        trigger: "POST /child-support/withholding-orders/{iwo_id}/amendment (further amendment)"
        actor: CaseWorker
        preconditions:
          - "payload reported_disposable_income_cents differs from the stored value"
        side_effects:
          - "cap fields recomputed again"
        note: "self-loop; unlimited amendments are permitted while the order stands"
      - from: ISSUED
        to: TERMINATED
        trigger: "POST /child-support/withholding-orders/{iwo_id}/termination"
        actor: CaseWorker
        preconditions: []
        side_effects:
          - "iwo.terminated_reason recorded; Employer.active_iwo_count is NOT decremented (it was never incremented before service)"
      - from: SERVED
        to: TERMINATED
        trigger: "POST /child-support/withholding-orders/{iwo_id}/termination"
        actor: CaseWorker
        preconditions: []
        side_effects:
          - "iwo.terminated_reason recorded"
          - "Employer.active_iwo_count -= 1"
          - "cascade: remittance dimension frozen; iwo.next_remittance_due_at := null"
          - "cascade: if this was the last SERVED IWO on the case's NCP, the aggregate withholding capacity check frees up for a new IWO"
      - from: AMENDED
        to: TERMINATED
        trigger: "POST /child-support/withholding-orders/{iwo_id}/termination"
        actor: CaseWorker
        preconditions: []
        side_effects:
          - "iwo.terminated_reason recorded"
          - "Employer.active_iwo_count -= 1"
          - "iwo.next_remittance_due_at := null"

  - entity: IncomeWithholdingOrder
    dimension: remittance_status
    initial_state: NOT_DUE
    terminal_states: [DEFAULTED]
    transitions:
      - from: NOT_DUE
        to: CURRENT
        trigger: "POST /child-support/withholding-orders/{iwo_id}/remittances"
        actor: EmployerAgent
        preconditions:
          - "iwo.service_status in {SERVED, AMENDED}"
          - "X-User-ID == iwo.employer_id"
        side_effects:
          - "a PaymentTransaction with source INCOME_WITHHOLDING is created and allocated by calculations.payment_allocation_waterfall"
          - "iwo.next_remittance_due_at advanced by one pay period"
          - "iwo.missed_remittance_count := 0"
      - from: CURRENT
        to: CURRENT
        trigger: "POST /child-support/withholding-orders/{iwo_id}/remittances (subsequent period)"
        actor: EmployerAgent
        preconditions:
          - "iwo.service_status in {SERVED, AMENDED}"
        side_effects:
          - "next_remittance_due_at advanced; missed_remittance_count reset to 0"
      - from: NOT_DUE
        to: DELINQUENT
        trigger: "POST /child-support/withholding-orders/{iwo_id}/lapse"
        actor: FinanceOfficer
        preconditions:
          - "current logical clock > iwo.next_remittance_due_at"
        side_effects:
          - "iwo.missed_remittance_count += 1"
      - from: CURRENT
        to: DELINQUENT
        trigger: "POST /child-support/withholding-orders/{iwo_id}/lapse"
        actor: FinanceOfficer
        preconditions:
          - "current logical clock > iwo.next_remittance_due_at"
        side_effects:
          - "iwo.missed_remittance_count += 1"
          - "the NCP's enforcement_risk_score gains the delinquency component on next recomputation"
      - from: DELINQUENT
        to: CURRENT
        trigger: "POST /child-support/withholding-orders/{iwo_id}/remittances (cure)"
        actor: EmployerAgent
        preconditions:
          - "iwo.service_status in {SERVED, AMENDED}"
        side_effects:
          - "iwo.missed_remittance_count := 0"
      - from: DELINQUENT
        to: DEFAULTED
        trigger: "POST /child-support/withholding-orders/{iwo_id}/lapse"
        actor: FinanceOfficer
        preconditions:
          - "current logical clock > iwo.next_remittance_due_at"
          - "iwo.missed_remittance_count + 1 >= EMPLOYER_DEFAULT_LAPSES (2)"
        side_effects:
          - "iwo.missed_remittance_count += 1"
          - "the case becomes eligible for a CONTEMPT_REFERRAL EnforcementAction against the employer's obligor"
        note: "terminal on this dimension: a DEFAULTED IWO may no longer accept remittances (ERR_IWO_DEFAULTED)"

  - entity: ObligationCharge
    dimension: status
    initial_state: OPEN
    terminal_states: [SATISFIED, VOID]
    transitions:
      - from: OPEN
        to: SATISFIED
        trigger: "system: a payment allocation drives unpaid_balance_cents to 0"
        actor: system
        preconditions:
          - "charge.paid_cents == charge.amount_cents"
        side_effects:
          - "charge.unpaid_balance_cents := 0"
          - "charge stops accruing interest from the satisfying payment's received_at onward"
          - "case.arrears_principal_cents recomputed"
      - from: OPEN
        to: VOID
        trigger: "POST /child-support/charges/{charge_id}/voidance"
        actor: FinanceOfficer
        preconditions:
          - "charge.paid_cents == 0 (a partly paid charge cannot be voided; ERR_CHARGE_PARTIALLY_PAID)"
        side_effects:
          - "case.total_charged_principal_cents -= charge.amount_cents"
          - "case.arrears_principal_cents recomputed"
      - from: OPEN
        to: VOID
        trigger: "system: cascade from SupportOrder VACATED or SupportCase CLOSED via paternity exclusion"
        actor: system
        preconditions: []
        side_effects:
          - "any paid_cents already applied to the charge is returned to case.unapplied_credit_cents"
          - "case.total_charged_principal_cents -= charge.amount_cents"
        note: "the cascade path ignores the paid_cents == 0 precondition that the manual path enforces"

  - entity: ModificationReview
    dimension: status
    initial_state: REQUESTED
    terminal_states: [THRESHOLD_NOT_MET, ORDER_PROPOSED]
    transitions:
      - from: REQUESTED
        to: INFO_PENDING
        trigger: "POST /child-support/modification-reviews/{modification_review_id}/screening (a party's income is unverified)"
        actor: CaseWorker
        preconditions:
          - "at least one party has income_verification_source != VERIFIED_WAGE_RECORD"
        side_effects:
          - "review.info_request_count += 1"
          - "review.info_requested_reason := NCP_INCOME_UNVERIFIED when the NCP is the unverified party, else CP_INCOME_UNVERIFIED"
          - "no guideline recomputation happens on this path"
        note: "the NCP is checked before the CP, so a doubly-unverified review reports NCP_INCOME_UNVERIFIED"
      - from: INFO_PENDING
        to: REQUESTED
        trigger: "POST /child-support/modification-reviews/{modification_review_id}/information"
        actor: CaseWorker
        preconditions:
          - "payload participant_id is one of the case's two parties"
          - "review.info_request_count <= INFO_REQUEST_LIMIT (2)"
        side_effects:
          - "Participant.monthly_gross_income_cents / income_verification_source updated"
          - "review.info_requested_reason := null"
        note: "the REQUESTED -> INFO_PENDING -> REQUESTED cycle; a third info request is refused with ERR_INFO_REQUEST_LIMIT"
      - from: REQUESTED
        to: THRESHOLD_MET
        trigger: "POST /child-support/modification-reviews/{modification_review_id}/screening"
        actor: CaseWorker
        preconditions:
          - "both parties have income_verification_source == VERIFIED_WAGE_RECORD"
          - "calculations.substantial_change_variance returns true"
        side_effects:
          - "review.recalculated_guideline_cents / variance_numerator_cents / substantial_change_met written"
          - "review.screened_at := current logical clock"
      - from: REQUESTED
        to: THRESHOLD_NOT_MET
        trigger: "POST /child-support/modification-reviews/{modification_review_id}/screening"
        actor: CaseWorker
        preconditions:
          - "both parties have income_verification_source == VERIFIED_WAGE_RECORD"
          - "calculations.substantial_change_variance returns false"
        side_effects:
          - "review.recalculated_guideline_cents / variance_numerator_cents written; substantial_change_met := false"
          - "review.screened_at := current logical clock"
        note: "terminal; a new review must be opened to try again"
      - from: THRESHOLD_MET
        to: ORDER_PROPOSED
        trigger: "POST /child-support/modification-reviews/{modification_review_id}/proposed-order"
        actor: SupervisingAttorney
        preconditions:
          - "case.interstate_role != RESPONDING, or the case's REGISTERED referral has controlling_order_state_code == HOME_STATE_CODE (MN) — continuing exclusive jurisdiction"
          - "payload effective_date > the reviewed order's effective_date"
        side_effects:
          - "cascade level 1: a successor SupportOrder is created in CALCULATED with guideline_monthly_cents == review.recalculated_guideline_cents"
          - "cascade level 2: review.proposed_order_id := the successor id"
          - "cascade level 3: on the successor's entry the reviewed order becomes SUPERSEDED with terminated_date == successor.effective_date - 1 day"
          - "cascade level 4: every SERVED IWO of the reviewed order is TERMINATED with terminated_reason ORDER_SUPERSEDED"

  - entity: EnforcementAction
    dimension: status
    initial_state: PROPOSED
    terminal_states: [DENIED, RELEASED]
    transitions:
      - from: PROPOSED
        to: NOTICE_SENT
        trigger: "POST /child-support/enforcement-actions/{enforcement_action_id}/notice"
        actor: CaseWorker
        preconditions:
          - "case.enforcement_posture != STAYED"
          - "case.good_cause_claim == false"
        side_effects:
          - "action.notice_sent_at := current logical clock"
          - "action.contest_deadline_at := notice_sent_at + CONTEST_WINDOW_DAYS (30)"
      - from: NOTICE_SENT
        to: CONTESTED
        trigger: "POST /child-support/enforcement-actions/{enforcement_action_id}/contest"
        actor: NoncustodialParty
        preconditions:
          - "current logical clock <= action.contest_deadline_at"
          - "X-User-ID == case.noncustodial_party_id"
        side_effects:
          - "action.contested_at := current logical clock; action.contest_grounds recorded"
        note: "fork branch A"
      - from: NOTICE_SENT
        to: ACTIVE
        trigger: "POST /child-support/enforcement-actions/{enforcement_action_id}/activation"
        actor: CaseWorker
        preconditions:
          - "current logical clock > action.contest_deadline_at (the uncontested window has fully elapsed)"
          - "case.enforcement_posture != STAYED"
        side_effects:
          - "action.activated_at := current logical clock; action.remedy_applied := true"
          - "Participant flag set per action_type (license_suspension_active / lien_recorded / credit_bureau_reported)"
          - "case.enforcement_posture := ESCALATED"
        note: "fork branch B — the uncontested path; joins branch A at ACTIVE"
      - from: CONTESTED
        to: ACTIVE
        trigger: "POST /child-support/enforcement-actions/{enforcement_action_id}/review-decision with review_decision == UPHOLD"
        actor: SupervisingAttorney
        preconditions:
          - "X-User-ID != action.proposed_by_user_id (segregation of duties)"
        side_effects:
          - "action.review_decided_by_user_id := X-User-ID"
          - "action.activated_at := current logical clock; action.remedy_applied := true"
          - "Participant flag set per action_type"
          - "case.enforcement_posture := ESCALATED"
        note: "join point: both branches land in ACTIVE with identical side effects"
      - from: CONTESTED
        to: DENIED
        trigger: "POST /child-support/enforcement-actions/{enforcement_action_id}/review-decision with review_decision == VACATE"
        actor: SupervisingAttorney
        preconditions:
          - "X-User-ID != action.proposed_by_user_id"
        side_effects:
          - "action.review_decided_by_user_id := X-User-ID"
          - "no Participant flag is ever set; remedy_applied stays false"
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /child-support/enforcement-actions/{enforcement_action_id}/release"
        actor: SupervisingAttorney
        preconditions:
          - "release_reason is derivable: arrears satisfied, plan compliant, or an administrative reversal"
        side_effects:
          - "action.released_at := current logical clock; action.remedy_applied := false"
          - "Participant flag cleared unless another ACTIVE action of the same action_type still names the participant"
          - "case.enforcement_posture := NORMAL when no ACTIVE action remains"
      - from: ACTIVE
        to: RELEASED
        trigger: "system: cascade from CompromiseOffer acceptance, SupportOrder vacatur or SupportCase closure"
        actor: system
        preconditions: []
        side_effects:
          - "action.release_reason := COMPROMISE_ACCEPTED / ORDER_VACATED as appropriate"
          - "action.remedy_applied := false and the Participant remedy flag is reversed (license_suspension_active := false with has_valid_drivers_license := true, lien_recorded := false, credit_bureau_reported := false)"
        note: "the cascade path bypasses the manual release_reason derivation"
      - from: NOTICE_SENT
        to: RELEASED
        trigger: "system: cascade from CompromiseOffer acceptance"
        actor: system
        preconditions: []
        side_effects:
          - "action.release_reason := COMPROMISE_ACCEPTED; no Participant flag was ever set so none is cleared"
        note: "conditional cascade: a pre-activation action is closed out without touching participant flags"

  - entity: InterstateReferral
    dimension: status
    initial_state: DRAFT
    terminal_states: [RETURNED]
    transitions:
      - from: DRAFT
        to: TRANSMITTED
        trigger: "POST /child-support/interstate-referrals/{interstate_referral_id}/transmittal"
        actor: InterstateLiaison
        preconditions:
          - "referral.direction == INITIATING"
          - "the case has at least one ENTERED SupportOrder"
        side_effects:
          - "referral.transmitted_at := current logical clock"
          - "referral.ack_due_at := transmitted_at + ACK_WINDOW_DAYS (10)"
          - "case.interstate_role := INITIATING"
      - from: DRAFT
        to: REGISTERED
        trigger: "POST /child-support/interstate-referrals/{interstate_referral_id}/registration"
        actor: InterstateLiaison
        preconditions:
          - "referral.direction == RESPONDING"
          - "the case has at least one ENTERED SupportOrder whose origin_state_code == referral.other_state_code"
        side_effects:
          - "referral.registered_at := current logical clock"
          - "referral.controlling_order_id / controlling_order_state_code := winner of calculations.controlling_order_determination"
          - "case.interstate_role := RESPONDING"
      - from: TRANSMITTED
        to: REGISTERED
        trigger: "POST /child-support/interstate-referrals/{interstate_referral_id}/registration"
        actor: InterstateLiaison
        preconditions:
          - "current logical clock <= referral.ack_due_at"
        side_effects:
          - "referral.registered_at := current logical clock"
          - "controlling order determined"
      - from: REGISTERED
        to: ENFORCING
        trigger: "system: an EnforcementAction on the same case reaches ACTIVE"
        actor: system
        preconditions:
          - "referral.transmittal_type == ENFORCEMENT"
        side_effects:
          - "referral.status := ENFORCING"
      - from: TRANSMITTED
        to: RETURNED
        trigger: "POST /child-support/interstate-referrals/{interstate_referral_id}/return"
        actor: InterstateLiaison
        preconditions:
          - "returned_reason == NO_ACK_RECEIVED requires current logical clock > referral.ack_due_at"
        side_effects:
          - "case.interstate_role := NONE when no other live referral exists"
      - from: REGISTERED
        to: RETURNED
        trigger: "POST /child-support/interstate-referrals/{interstate_referral_id}/return"
        actor: InterstateLiaison
        preconditions:
          - "returned_reason in {INSUFFICIENT_INFO, NO_JURISDICTION}"
        side_effects:
          - "referral.controlling_order_id / controlling_order_state_code cleared"
          - "case.interstate_role := NONE when no other live referral exists"
          - "the CEJ gate on ModificationReview proposed-order reopens"
      - from: ENFORCING
        to: RETURNED
        trigger: "POST /child-support/interstate-referrals/{interstate_referral_id}/return"
        actor: InterstateLiaison
        preconditions:
          - "no EnforcementAction on the case is in ACTIVE"
        side_effects:
          - "case.interstate_role := NONE when no other live referral exists"

  - entity: CompromiseOffer
    dimension: status
    initial_state: PROPOSED
    terminal_states: [COMPLETED, DEFAULTED, SUPERSEDED]
    transitions:
      - from: PROPOSED
        to: ACCEPTED
        trigger: "POST /child-support/compromise-offers/{compromise_offer_id}/acceptance"
        actor: NoncustodialParty
        preconditions:
          - "X-User-ID == case.noncustodial_party_id"
          - "no other CompromiseOffer on the case is in {ACCEPTED, ACTIVE}"
          - "case.arrears_principal_cents == offer.principal_due_snapshot_cents (the snapshot must still be accurate)"
        side_effects:
          - "offer.accepted_at := current logical clock"
          - "offer.next_installment_due_date := accepted_at date + 1 month"
          - "case.interest_written_off_cents += offer.interest_waiver_cents"
          - "case.enforcement_posture := STAYED with the enforcement release cascade"
      - from: PROPOSED
        to: SUPERSEDED
        trigger: "system: a newer CompromiseOffer is created on the same case"
        actor: system
        preconditions:
          - "the newer offer passed the OCC check on the case version"
        side_effects:
          - "the older offer can no longer be accepted (ERR_OFFER_SUPERSEDED)"
      - from: ACCEPTED
        to: ACTIVE
        trigger: "system: POST /child-support/cases/{case_id}/payments with source COMPROMISE_INSTALLMENT referencing this offer"
        actor: system
        preconditions:
          - "payment.amount_cents >= offer.monthly_installment_cents"
        side_effects:
          - "offer.compliance_payment_count := 1"
          - "offer.next_installment_due_date advanced by one month"
      - from: ACTIVE
        to: ACTIVE
        trigger: "system: a further COMPROMISE_INSTALLMENT payment referencing this offer"
        actor: system
        preconditions:
          - "offer.compliance_payment_count < offer.installment_count - 1"
        side_effects:
          - "offer.compliance_payment_count += 1; next_installment_due_date advanced by one month"
        note: "self-loop for installments 2..n-1"
      - from: ACTIVE
        to: COMPLETED
        trigger: "system: the final COMPROMISE_INSTALLMENT payment posts"
        actor: system
        preconditions:
          - "offer.compliance_payment_count + 1 == offer.installment_count"
          - "payment.amount_cents >= offer.final_installment_cents"
        side_effects:
          - "offer.completed_at := current logical clock"
          - "the interest waiver becomes permanent; case.enforcement_posture := NORMAL"
          - "remaining OPEN charges of the case are SATISFIED and case.arrears_principal_cents becomes 0"
      - from: ACCEPTED
        to: DEFAULTED
        trigger: "POST /child-support/compromise-offers/{compromise_offer_id}/default-declaration"
        actor: FinanceOfficer
        preconditions:
          - "current logical clock date > offer.next_installment_due_date"
        side_effects:
          - "offer.defaulted_at := current logical clock"
          - "case.interest_written_off_cents -= offer.interest_waiver_cents (waiver reinstated)"
          - "case.enforcement_posture := ESCALATED"
      - from: ACTIVE
        to: DEFAULTED
        trigger: "POST /child-support/compromise-offers/{compromise_offer_id}/default-declaration"
        actor: FinanceOfficer
        preconditions:
          - "current logical clock date > offer.next_installment_due_date"
        side_effects:
          - "offer.defaulted_at := current logical clock"
          - "case.interest_written_off_cents -= offer.interest_waiver_cents; the reinstated interest re-enters case.interest_receivable_cents"
          - "installments already paid stay applied (no clawback); only the waiver is reversed"
          - "case.enforcement_posture := ESCALATED"

# =============================================================================
# 1.2.1 CONCURRENCY RULES (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: iwo-issue-stale-order
    parent_entity: SupportOrder
    write_endpoint: "POST /child-support/orders/{order_id}/withholding-orders"
    occ_field: "expected_order_version"
    description: |
      Issuing an IncomeWithholdingOrder against a SupportOrder whose version has
      advanced since the client last read it is rejected. A second IWO on the
      same order is legitimate product behaviour (an obligor may be withheld at
      two employers), so the write cannot be rejected on state grounds; but the
      withholding amount is derived from the order's current
      monthly_obligation_cents and from the aggregate cap already consumed by
      the order's existing IWOs, both of which move when the order is written.
      A client holding a stale order version would therefore compute its
      withholding against a superseded obligation, so the stale version is
      refused.
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412

  - rule_id: compromise-create-stale-case
    parent_entity: SupportCase
    write_endpoint: "POST /child-support/cases/{case_id}/compromise-offers"
    occ_field: "expected_case_version"
    description: |
      Creating a CompromiseOffer against a SupportCase whose version has advanced
      since the client last read it is rejected. Creating a further offer is
      legitimate — the newer offer supersedes any PROPOSED predecessor under the
      PROPOSED -> SUPERSEDED transition — so no state precondition covers this
      write. The offer's principal_due_snapshot_cents, interest_due_snapshot_cents
      and waiver tier are all frozen from the case at creation time, so an offer
      built on a stale case view would waive interest that has already been
      collected or written off. The stale version is refused.
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412

# =============================================================================
# 1.3 CALCULATION RULES TABLE
# =============================================================================
calculations:

  - name: guideline_support_obligation
    trigger: "POST /child-support/orders/{order_id}/guideline-calculation, and again inside modification screening and proposed-order creation"
    algorithm: tiered_pricing
    formula: |
      # ---- step 1: each party's guideline income -------------------------------
      cp_income = custodial_party.monthly_gross_income_cents or 0
      if noncustodial_party.monthly_gross_income_cents is None
         or noncustodial_party.income_verification_source == NONE:
          ncp_income = IMPUTED_MONTHLY_INCOME_CENTS          # imputation branch
          imputation_applied = true
      else:
          ncp_income = noncustodial_party.monthly_gross_income_cents
          imputation_applied = false

      # ---- step 2: combined income selects ONE tier rate -----------------------
      combined = cp_income + ncp_income
      band = FIRST band of INCOME_TIER_BANDS whose ceiling >= combined
             # ceilings: 400000, 800000, and unbounded; the comparison is `<=`
             # so combined == 400000 is still band 1
      rate  = BASIC_OBLIGATION_RATES[band][min(child_count, 3)]
      basic_obligation = round_half_up(combined * rate)

      # ---- step 3: proportional share -----------------------------------------
      ncp_share_ratio = round_half_up_4dp(ncp_income / combined)
      ncp_share = round_half_up(basic_obligation * ncp_share_ratio)

      # ---- step 4: multi-family credit (applied BEFORE the reserve) ------------
      if noncustodial_party.supports_second_family:
          multi_family_credit = round_half_up(ncp_share * MULTI_FAMILY_CREDIT_PCT)
      else:
          multi_family_credit = 0
      after_credit = ncp_share - multi_family_credit

      # ---- step 5: self-support reserve (applied LAST) -------------------------
      available = ncp_income - SELF_SUPPORT_RESERVE_CENTS
      if available <= 0:
          guideline_monthly = MINIMUM_ORDER_CENTS
      else:
          guideline_monthly = min(after_credit, available)

      return guideline_monthly
    input_set: >
      the two Participant rows named by the case's custodial_party_id and
      noncustodial_party_id, read at calculation time (not at case creation
      time); child_count from the SupportCase
    constants:
      IMPUTED_MONTHLY_INCOME_CENTS: 182000
      SELF_SUPPORT_RESERVE_CENTS: 113200
      MULTI_FAMILY_CREDIT_PCT: 0.10
      MINIMUM_ORDER_CENTS: 5000
      INCOME_TIER_BANDS: [400000, 800000, null]
      BASIC_OBLIGATION_RATES:
        band_1: { one_child: 0.20, two_children: 0.28, three_or_more: 0.33 }
        band_2: { one_child: 0.17, two_children: 0.25, three_or_more: 0.30 }
        band_3: { one_child: 0.14, two_children: 0.21, three_or_more: 0.25 }
    precision: "integer cents; round_half_up at every money step; ncp_share_ratio kept to 4 decimal places, round_half_up"
    note: >
      the order of step 4 before step 5 is observable: crediting first and then
      flooring at the reserve yields a different result from flooring first

  - name: arrears_interest_accrual
    trigger: "POST /child-support/cases/{case_id}/accrual-runs, GET /child-support/cases/{case_id}/ledger, and any read of case.interest_receivable_cents"
    algorithm: chronological
    formula: |
      # BOTH variants walk the same input set and use the same monthly rate.
      # They differ in WHAT they multiply by the elapsed time.
      MONTHLY_RATE = STATUTORY_INTEREST_ANNUAL_PCT / 12       # 0.06 / 12 = 0.005

      # ---- variant statutory_per_charge ---------------------------------------
      # per charge, whole calendar months from that charge's own due_date
      total = 0
      for charge in input_set (ordered by due_date, then created_at):
          months = whole_calendar_months_between(charge.due_date, as_of_date)
          total += round_half_up(charge.unpaid_balance_cents * MONTHLY_RATE * months)
      # a charge that has been outstanding less than one whole calendar month
      # contributes exactly 0

      # ---- variant aggregate_month_end ----------------------------------------
      # one interest posting per month-end snapshot strictly before as_of_date,
      # charged on the balance outstanding at that snapshot
      total = 0
      for snapshot in month_end_dates_strictly_before(as_of_date):
          balance = sum(charge.unpaid_balance_cents
                        for charge in input_set
                        if charge.due_date <= snapshot)
          total += round_half_up(balance * MONTHLY_RATE)
      # a charge whose due_date falls before a month end is included in that
      # month's snapshot even though it has not been outstanding a whole month
    input_set: >
      ObligationCharge rows of the case with status == OPEN and
      due_date <= as_of_date. VOID and SATISFIED charges are excluded entirely
      and retroactively: once a charge is satisfied it contributes nothing to
      either variant, including for month-end snapshots that predate the payment
    constants:
      STATUTORY_INTEREST_ANNUAL_PCT: 0.06
      INTEREST_GRACE_DAYS: 0
    precision: "integer cents; round_half_up applied per charge in the statutory variant and per snapshot in the aggregate variant"
    variants:
      - name: statutory_per_charge
        when: >
          every certified figure: EnforcementAction.arrears_certified_snapshot_cents,
          Participant.total_arrears_certified_cents, and the enforcement
          eligibility screen
        difference: >
          rounds and accrues per charge over whole calendar months measured from
          each charge's own due_date, so a charge outstanding 20 days adds nothing
      - name: aggregate_month_end
        when: >
          every ledger and settlement figure: GET /cases/{case_id}/ledger,
          case.interest_receivable_cents, and
          CompromiseOffer.interest_due_snapshot_cents
        difference: >
          rounds once per month-end snapshot over the pooled balance, so a charge
          due on the 15th earns a full month at that month's end; the two totals
          diverge for identical data and the delta grows with the number of charges

  - name: withholding_amount
    trigger: "POST /child-support/orders/{order_id}/withholding-orders and POST /child-support/withholding-orders/{iwo_id}/amendment"
    algorithm: threshold
    formula: |
      # ---- disposable income ---------------------------------------------------
      # the employer may report disposable income directly; otherwise it is
      # derived from the obligor's gross by the mandatory-deduction percentage
      if payload reported_disposable_income_cents is present:
          disposable = payload reported_disposable_income_cents
      else:
          gross      = noncustodial_party.monthly_gross_income_cents
          disposable = gross - round_half_up(gross * MANDATORY_DEDUCTION_PCT)

      # ---- what the order asks for --------------------------------------------
      arrears_recovery_cents = round_half_up(order.monthly_obligation_cents
                                             * ARREARS_RECOVERY_PCT)
      requested_amount_cents = order.monthly_obligation_cents
                             + order.medical_support_monthly_cents
                             + arrears_recovery_cents

      # ---- federal CCPA ceiling ------------------------------------------------
      federal_cap_pct = (FEDERAL_CAP_SECOND_FAMILY_PCT
                         if noncustodial_party.supports_second_family
                         else FEDERAL_CAP_BASE_PCT)
      if case.arrears_principal_cents
         >= order.monthly_obligation_cents * ARREARS_BUMP_MONTHS:
          federal_cap_pct += ARREARS_12_WEEK_BUMP_PCT

      # ---- multi-state override: the EMPLOYER's state law governs the cap ------
      # jurisdiction_state_code is always the employer's state, never the case's
      # or the order's origin state (UIFSA s.502: the law of the obligor's
      # principal place of employment governs withholding limits)
      jurisdiction_state_code = employer.state_code
      state_cap_pct = EMPLOYER_STATE_CAPS[jurisdiction_state_code]   # may be null
      ccpa_cap_pct = (min(federal_cap_pct, state_cap_pct)
                      if state_cap_pct is not null else federal_cap_pct)
      ccpa_cap_amount_cents = floor(disposable * ccpa_cap_pct)

      # ---- the employer fee shares the cap ------------------------------------
      cap_room = ccpa_cap_amount_cents - employer.remittance_fee_cents
      withholding_amount_cents = max(0, min(requested_amount_cents, cap_room))
      employer_fee_cents = (employer.remittance_fee_cents
                            if withholding_amount_cents > 0 else 0)
    input_set: >
      the parent SupportOrder (must be ENTERED), the Employer named in the
      payload, the case's noncustodial Participant, and the case's
      arrears_principal_cents at issuance time
    constants:
      MANDATORY_DEDUCTION_PCT: 0.22
      ARREARS_RECOVERY_PCT: 0.20
      FEDERAL_CAP_BASE_PCT: 0.60
      FEDERAL_CAP_SECOND_FAMILY_PCT: 0.50
      ARREARS_12_WEEK_BUMP_PCT: 0.05
      ARREARS_BUMP_MONTHS: 3
      EMPLOYER_STATE_CAPS:
        MN: null
        NY: null
        FL: null
        CA: null
        PA: null
        TX: 0.50
        WI: 0.50
    precision: "integer cents; round_half_up for the deduction and the arrears recovery, floor for the cap amount (a cap must never round upward)"
    note: >
      the cap is applied to (requested + employer fee) as a single ceiling, so an
      order that fits the cap exactly still loses the fee's worth of withholding
    aggregate_rule: |
      # checked across ALL of the obligor's non-TERMINATED IWOs, this one included
      total_disposable = sum(iwo.reported_disposable_income_cents)
      binding_pct      = min(iwo.ccpa_cap_pct)
      aggregate_cap    = floor(total_disposable * binding_pct)
      sum(iwo.withholding_amount_cents) <= aggregate_cap
      # each IWO can fit its own employer-state cap while the collection
      # collectively breaches the most restrictive percentage

  - name: payment_allocation_waterfall
    trigger: "POST /child-support/cases/{case_id}/payments and POST /child-support/withholding-orders/{iwo_id}/remittances"
    algorithm: waterfall_allocation
    formula: |
      remaining = payment.amount_cents

      # bucket 1 — current support for the period containing received_at
      for charge in OPEN charges of the case where charge_type == CURRENT_SUPPORT
          and period_start_date <= received_at date < period_end_date
          (ordered by due_date, then created_at):
          take = min(remaining, charge.unpaid_balance_cents)
          charge.paid_cents += take; remaining -= take
          applied_current_cents += take

      # bucket 2 — current medical support, same period window
      ... identical loop over charge_type == MEDICAL_SUPPORT
          applied_medical_cents += take

      # bucket 3 — arrears principal: every remaining OPEN charge of the case
      # that buckets 1 and 2 did not consume, OLDEST due_date first, then
      # created_at (never id)
      for charge in remaining OPEN charges of the case
          (ordered by due_date ASC, then created_at ASC):
          take = min(remaining, charge.unpaid_balance_cents)
          charge.paid_cents += take; remaining -= take
          applied_arrears_cents += take

      # bucket 4 — accrued interest. The receivable is SNAPSHOT at the start of
      # the request, before this payment's principal reductions, so the bucket is
      # independent of the order in which buckets 1-3 ran
      take = min(remaining, interest_receivable_cents_at_request_start)
      applied_interest_cents += take; remaining -= take
      case.interest_collected_cents += take

      # bucket 5 — genetic test cost, only when the NCP is the liable party
      if paternity_action.genetic_cost_liable_party == NCP:
          take = min(remaining, unreimbursed genetic_cost_cents)
          applied_genetic_cost_cents += take; remaining -= take

      # bucket 6 — nothing left to absorb the money
      unapplied_credit_cents = remaining
      case.unapplied_credit_cents += remaining
    input_set: >
      OPEN ObligationCharge rows of the case only; VOID and SATISFIED charges are
      skipped. A case with zero OPEN charges sends 100% of the payment to
      unapplied credit rather than rejecting it
    constants:
      ALLOCATION_ORDER: [CURRENT_SUPPORT, MEDICAL_SUPPORT, ARREARS_PRINCIPAL, INTEREST, GENETIC_COST, UNAPPLIED_CREDIT]
    precision: "integer cents, no rounding — every bucket takes min(remaining, balance) so the sum of applied buckets plus unapplied_credit always equals amount_cents exactly"
    note: >
      ordering is by due_date then created_at; the random id is never a
      tie-break. Interest sits BELOW arrears principal, so a payment large
      enough to clear all principal is what first touches interest

  - name: payment_distribution_split
    trigger: "immediately after payment_allocation_waterfall, on the same request"
    algorithm: waterfall_allocation
    formula: |
      distributable = applied_current_cents + applied_medical_cents
                    + applied_arrears_cents + applied_interest_cents
                    + applied_genetic_cost_cents

      if case.tanf_assistance == false:
          disbursed_to_cp_cents  = applied_current_cents + applied_medical_cents
                                 + applied_arrears_cents
          retained_by_state_cents = applied_interest_cents
                                  + applied_genetic_cost_cents
      else:
          # arrears are assigned to the state; only a capped pass-through of
          # CURRENT support reaches the family
          pass_through = min(applied_current_cents, TANF_PASS_THROUGH_CENTS)
          disbursed_to_cp_cents   = pass_through
          retained_by_state_cents = distributable - pass_through

      # invariant: disbursed + retained + unapplied_credit == amount_cents
    input_set: "the single PaymentTransaction just allocated, plus case.tanf_assistance"
    constants:
      TANF_PASS_THROUGH_CENTS: 10000
    precision: "integer cents, exact; no rounding step exists"

  - name: substantial_change_variance
    trigger: "POST /child-support/modification-reviews/{modification_review_id}/screening"
    algorithm: threshold
    formula: |
      recalculated = guideline_support_obligation(current Participant incomes,
                                                  case.child_count)
      current  = review.current_obligation_snapshot_cents
      abs_diff = abs(recalculated - current)

      if review.trigger_type == PERIODIC_36_MONTH:
          # the 36-month cycle waives the percentage gate entirely
          met = abs_diff >= MIN_ABSOLUTE_CHANGE_CENTS
      else:
          # PARTY_REQUEST and PA_MANDATORY must clear BOTH gates
          met = (abs_diff * 10000 >= VARIANCE_THRESHOLD_BP * current)
                and (abs_diff >= MIN_ABSOLUTE_CHANGE_CENTS)

      variance_numerator_cents = abs_diff
      substantial_change_met   = met
    input_set: >
      the two Participant rows as they stand at screening time (both must have
      income_verification_source == VERIFIED_WAGE_RECORD or the review bounces to
      INFO_PENDING before this calculation runs) and the ENTERED order under review
    constants:
      VARIANCE_THRESHOLD_BP: 1500
      MIN_ABSOLUTE_CHANGE_CENTS: 5000
      PERIODIC_REVIEW_MONTHS: 36
    precision: >
      the percentage gate is evaluated by integer cross-multiplication
      (abs_diff * 10000 >= 1500 * current) so no floating-point rounding can move
      the boundary; the comparison is >=, so a variance of exactly 15.00% qualifies
    note: >
      the AND of a relative and an absolute gate means a change can clear the
      dollar gate and still fail the review, which is the common wrong answer

  - name: ncp_compliance_risk_score
    trigger: "recomputed on every read of a Participant with role_type NONCUSTODIAL_PARTY"
    algorithm: weighted_scoring
    formula: |
      # ---- six component sub-scores, each normalised to 0..100 ----------------
      obligation = monthly_obligation_cents of the newest ENTERED CURRENT_SUPPORT
                   order across the participant's non-CLOSED cases (0 if none)

      arrears_component = min(100, floor(arrears_total * 100
                                         / max(1, obligation * 12)))
        # arrears_total = sum of arrears_principal_cents over non-CLOSED cases

      delinquency_component = { NOT_DUE: 0, CURRENT: 0,
                                DELINQUENT: 60, DEFAULTED: 100 }
        [worst remittance_status among the participant's IWOs whose
         service_status != TERMINATED; 0 when the participant has no IWO]

      payment_history_component = 100 - floor(collected * 100
                                              / max(1, charged))
        # charged = sum of total_charged_principal_cents over non-CLOSED cases
        # collected = sum of total_collected_principal_cents over the same cases
        # 0 when charged == 0

      locate_component = { NOT_NEEDED: 0, LOCATED: 0,
                           PENDING: 50, UNLOCATABLE: 100 }[locate_status]

      enforcement_history_component = min(100, 25 * count of EnforcementAction
                                          rows on those cases with status in
                                          {ACTIVE, RELEASED})

      interstate_component = 100 if any of those cases has
                             interstate_role != NONE else 0

      # ---- weighted sum, weights differ per variant ---------------------------
      score = round_half_up(sum(weight[c] * component[c] for c in components)
                            / 100)
      tier  = HIGH   if score >= RISK_TIER_HIGH_MIN
              MEDIUM if score >= RISK_TIER_MEDIUM_MIN
              LOW    otherwise
    input_set: >
      every SupportCase whose noncustodial_party_id is this participant and whose
      case_status != CLOSED, together with those cases' charges, payments, IWOs
      and enforcement actions. A CUSTODIAL_PARTY participant always scores 0/LOW
    constants:
      RISK_TIER_MEDIUM_MIN: 34
      RISK_TIER_HIGH_MIN: 67
      ENFORCEMENT_SCREEN_WEIGHTS:
        arrears_component: 40
        delinquency_component: 25
        payment_history_component: 20
        locate_component: 10
        interstate_component: 5
        enforcement_history_component: 0
      COMPROMISE_SCREEN_WEIGHTS:
        arrears_component: 25
        delinquency_component: 20
        payment_history_component: 40
        locate_component: 0
        interstate_component: 0
        enforcement_history_component: 15
    precision: "each component floored to an integer 0..100, then one round_half_up on the weighted average; weights in each variant sum to exactly 100"
    variants:
      - name: enforcement_screen
        when: "written to Participant.enforcement_risk_score / enforcement_risk_tier; gates the CONTEMPT_REFERRAL eligibility check"
        difference: >
          weights arrears and delinquency heaviest and counts locate and
          interstate exposure, but ignores enforcement history entirely (past
          remedies are not evidence for a new remedy)
      - name: compromise_screen
        when: "written to Participant.compromise_risk_score / compromise_risk_tier; a HIGH tier blocks CompromiseOffer creation"
        difference: >
          weights payment history heaviest and counts enforcement history, but
          ignores locate status and interstate exposure; on identical underlying
          data the two variants land in different tiers

  - name: compromise_settlement_amount
    trigger: "POST /child-support/cases/{case_id}/compromise-offers"
    algorithm: tiered_pricing
    formula: |
      principal_due_snapshot_cents = case.arrears_principal_cents
      interest_due_snapshot_cents  = arrears_interest_accrual,
                                     variant aggregate_month_end,
                                     as_of = current logical clock date
      pre_waiver_total_cents = principal_due_snapshot_cents
                             + interest_due_snapshot_cents

      # the tier is keyed on the PRE-waiver total; recomputing the tier after the
      # waiver (a self-referential loop) is wrong and is the trap here
      waiver_tier_pct = rate of the FIRST band of WAIVER_TIER_TABLE whose
                        ceiling >= pre_waiver_total_cents
      interest_waiver_cents  = round_half_up(interest_due_snapshot_cents
                                             * waiver_tier_pct)
      settlement_total_cents = pre_waiver_total_cents - interest_waiver_cents

      monthly_installment_cents = floor(settlement_total_cents
                                        / installment_count)
      final_installment_cents   = settlement_total_cents
                                - monthly_installment_cents
                                  * (installment_count - 1)
      # principal is never waived: settlement_total_cents is always
      # >= principal_due_snapshot_cents
    input_set: >
      the case's OPEN ObligationCharge rows (through the aggregate interest
      variant) and case.arrears_principal_cents; requires
      case.tanf_assistance == false because assigned arrears are not
      compromisable, and requires the NCP's compromise_risk_tier != HIGH
    constants:
      WAIVER_TIER_TABLE:
        - { ceiling_cents: 500000, rate: 0.25 }
        - { ceiling_cents: 2000000, rate: 0.50 }
        - { ceiling_cents: null, rate: 0.75 }
      MIN_COMPROMISE_ARREARS_CENTS: 100000
    precision: "integer cents; round_half_up on the waiver, floor on the monthly installment with the whole remainder pushed into the final installment"
    note: >
      the remainder lands entirely on the LAST installment, so
      monthly * (n-1) + final == settlement_total exactly

  - name: enforcement_eligibility_thresholds
    trigger: "POST /child-support/cases/{case_id}/enforcement-actions"
    algorithm: threshold
    formula: |
      # certification always uses the STATUTORY interest variant, never the
      # ledger's aggregate variant
      arrears_certified_snapshot_cents =
          case.arrears_principal_cents
        + arrears_interest_accrual(variant=statutory_per_charge,
                                   as_of=current logical clock date)

      eligibility_threshold_cents =
          ENFORCEMENT_THRESHOLDS[action_type]
          # TAX_REFUND_INTERCEPT is the one conditional row: the assigned
          # (TANF) threshold is far lower than the unassigned one
          if action_type == TAX_REFUND_INTERCEPT:
              eligibility_threshold_cents =
                  TAX_INTERCEPT_ASSIGNED_CENTS if case.tanf_assistance
                  else TAX_INTERCEPT_UNASSIGNED_CENTS

      eligible = (arrears_certified_snapshot_cents
                  >= eligibility_threshold_cents)
             and (arrears_certified_snapshot_cents
                  >= order.monthly_obligation_cents * MIN_DELINQUENT_MONTHS)

      # CONTEMPT_REFERRAL carries one extra gate
      if action_type == CONTEMPT_REFERRAL:
          eligible = eligible and (noncustodial_party.enforcement_risk_tier
                                   == HIGH)
    input_set: >
      the case's OPEN charges (through the statutory interest variant), the
      newest ENTERED CURRENT_SUPPORT order for the monthly obligation, and — for
      CONTEMPT_REFERRAL only — the NCP's enforcement_screen risk tier
    constants:
      ENFORCEMENT_THRESHOLDS:
        LICENSE_SUSPENSION: 300000
        PROPERTY_LIEN: 500000
        CONTEMPT_REFERRAL: 1000000
        CREDIT_BUREAU_REPORT: 100000
      TAX_INTERCEPT_ASSIGNED_CENTS: 15000
      TAX_INTERCEPT_UNASSIGNED_CENTS: 50000
      MIN_DELINQUENT_MONTHS: 2
    precision: "integer cents; both gates use >=, so a certified balance exactly equal to the threshold IS eligible"

  - name: controlling_order_determination
    trigger: "POST /child-support/interstate-referrals/{interstate_referral_id}/registration"
    algorithm: topological
    formula: |
      candidates = ENTERED SupportOrder rows of the case with
                   order_type == CURRENT_SUPPORT
                   (SUPERSEDED and VACATED orders never compete)

      home = referral.child_home_state_code
      home_orders = [o for o in candidates if o.origin_state_code == home]

      if home_orders is non-empty:
          # a home-state order always outranks a foreign one, and among
          # home-state orders the MOST RECENT prevails
          winner = the home_order with the GREATEST effective_date
          ties broken by the EARLIEST created_at
      else:
          # with no home-state order the FIRST order issued anywhere controls —
          # the ranking direction inverts
          winner = the candidate with the SMALLEST effective_date
          ties broken by the EARLIEST created_at

      controlling_order_id         = winner.id
      controlling_order_state_code = winner.origin_state_code
    input_set: >
      only ENTERED CURRENT_SUPPORT orders of the case; MEDICAL_SUPPORT orders and
      any order in DRAFT, CALCULATED, PENDING_DEVIATION_FINDINGS, SUPERSEDED or
      VACATED are excluded
    constants:
      HOME_STATE_CODE: MN
    precision: "no arithmetic; ranking only, and the tie-break is created_at (never id)"
    note: >
      the direction of the effective_date comparison flips depending on whether a
      home-state order exists, which is what makes this ranking non-monotone;
      the winner's origin_state_code then gates modification authority (CEJ)

# =============================================================================
# 1.4 VALIDATION RULES TABLE (ordered by priority; lowest number wins)
# Priority bands: 1-5 auth/identity, 6 path existence, 7 payload schema,
# 8 body-FK existence, 9 concurrency (OCC), 10 state preconditions,
# 11-13 safety/compliance, 14-17 referential, 18-24 temporal,
# 25-36 constraint, 37-46 fiscal.
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty"
    error_id: ERR_MISSING_AUTH_HEADERS
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role names one of the eight roles in §1.7"
    error_id: ERR_INVALID_ROLE
    http_status: 401
    applies_to: all

  - priority: 3
    category: auth
    check: "the role is listed in the endpoint's roles"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 4
    category: auth
    check: >
      for CustodialParty / NoncustodialParty callers, X-User-ID equals the case's
      custodial_party_id / noncustodial_party_id respectively (identity is
      entity_backed:Participant)
    error_id: ERR_NOT_CASE_PARTY
    http_status: 403
    applies_to: "POST /paternity-actions/{id}/rescission, POST /enforcement-actions/{id}/contest, POST /compromise-offers/{id}/acceptance, all party-facing GETs"

  - priority: 5
    category: auth
    check: "for EmployerAgent callers, X-User-ID equals the IWO's employer_id (identity is entity_backed:Employer)"
    error_id: ERR_NOT_IWO_EMPLOYER
    http_status: 403
    applies_to: "POST /withholding-orders/{iwo_id}/remittances, GET /withholding-orders"

  - priority: 6
    category: existence
    check: "the {case_id} path segment resolves to a SupportCase"
    error_id: ERR_CASE_NOT_FOUND
    http_status: 404
    applies_to: "every /cases/{case_id}/... path"

  - priority: 6
    category: existence
    check: "the {participant_id} path segment resolves to a Participant"
    error_id: ERR_PARTICIPANT_NOT_FOUND
    http_status: 404
    applies_to: "every /participants/{participant_id}/... path"

  - priority: 6
    category: existence
    check: "the {order_id} path segment resolves to a SupportOrder"
    error_id: ERR_ORDER_NOT_FOUND
    http_status: 404
    applies_to: "every /orders/{order_id}/... path"

  - priority: 6
    category: existence
    check: "the {paternity_action_id} path segment resolves to a PaternityAction"
    error_id: ERR_PATERNITY_ACTION_NOT_FOUND
    http_status: 404
    applies_to: "every /paternity-actions/{paternity_action_id}/... path"

  - priority: 6
    category: existence
    check: "the {employer_id} path segment resolves to an Employer"
    error_id: ERR_EMPLOYER_NOT_FOUND
    http_status: 404
    applies_to: "GET /employers/{employer_id}"

  - priority: 6
    category: existence
    check: "the {iwo_id} path segment resolves to an IncomeWithholdingOrder"
    error_id: ERR_IWO_NOT_FOUND
    http_status: 404
    applies_to: "every /withholding-orders/{iwo_id}/... path"

  - priority: 6
    category: existence
    check: "the {charge_id} path segment resolves to an ObligationCharge"
    error_id: ERR_CHARGE_NOT_FOUND
    http_status: 404
    applies_to: "GET /charges/{charge_id}, POST /charges/{charge_id}/voidance"

  - priority: 6
    category: existence
    check: "the {payment_id} path segment resolves to a PaymentTransaction"
    error_id: ERR_PAYMENT_NOT_FOUND
    http_status: 404
    applies_to: "GET /payments/{payment_id}"

  - priority: 6
    category: existence
    check: "the {modification_review_id} path segment resolves to a ModificationReview"
    error_id: ERR_REVIEW_NOT_FOUND
    http_status: 404
    applies_to: "every /modification-reviews/{modification_review_id}/... path"

  - priority: 6
    category: existence
    check: "the {enforcement_action_id} path segment resolves to an EnforcementAction"
    error_id: ERR_ENFORCEMENT_ACTION_NOT_FOUND
    http_status: 404
    applies_to: "every /enforcement-actions/{enforcement_action_id}/... path"

  - priority: 6
    category: existence
    check: "the {interstate_referral_id} path segment resolves to an InterstateReferral"
    error_id: ERR_REFERRAL_NOT_FOUND
    http_status: 404
    applies_to: "every /interstate-referrals/{interstate_referral_id}/... path"

  - priority: 6
    category: existence
    check: "the {compromise_offer_id} path segment resolves to a CompromiseOffer"
    error_id: ERR_OFFER_NOT_FOUND
    http_status: 404
    applies_to: "every /compromise-offers/{compromise_offer_id}/... path"

  - priority: 7
    category: business_constraint
    check: >
      required payload fields present, enums within their declared sets, integers
      non-negative, child_count in 1..6, installment_count in 3..36,
      genetic_probability_pct in 0..100, ISO dates well formed
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all write endpoints"

  - priority: 8
    category: existence
    check: "body foreign keys resolve: custodial_party_id, noncustodial_party_id, employer_id, iwo_id, compromise_offer_id, signed_by_participant_id, participant_id"
    error_id: ERR_REFERENCED_ENTITY_NOT_FOUND
    http_status: 404
    applies_to: "POST /cases, POST /orders/{order_id}/withholding-orders, POST /cases/{case_id}/payments, POST /paternity-actions/{id}/acknowledgment, POST /modification-reviews/{id}/information"

  - priority: 9
    category: state
    check: "expected_order_version equals the parent SupportOrder's current version"
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412
    applies_to: "POST /orders/{order_id}/withholding-orders"

  - priority: 9
    category: state
    check: "expected_case_version equals the parent SupportCase's current version"
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412
    applies_to: "POST /cases/{case_id}/compromise-offers"

  - priority: 10
    category: state
    check: >
      case_status permits the operation per the SupportCase case_status machine
      (a CLOSED case rejects every write). On POST /cases/{case_id}/orders this
      rule only rejects a CLOSED case: the ORDER_ESTABLISHMENT eligibility gate
      is owned by ERR_PATERNITY_NOT_ESTABLISHED at priority 12, so an
      ORDER_ESTABLISHMENT-not-yet-reached case answers with the priority-12
      error and never with this one.
    error_id: ERR_INVALID_CASE_STATUS
    http_status: 409
    applies_to: "every /cases/{case_id}/... write and every write on a child of the case"

  - priority: 10
    category: state
    check: "SupportOrder.status permits the transition per the SupportOrder machine"
    error_id: ERR_INVALID_ORDER_STATUS
    http_status: 409
    applies_to: "POST /orders/{order_id}/guideline-calculation | deviation-request | deviation-findings | entry | vacatur | withholding-orders | charges | modification-reviews"

  - priority: 10
    category: state
    check: >
      PaternityAction.status permits the transition per the PaternityAction machine.
      One carve-out: on POST /paternity-actions/{paternity_action_id}/rescission an
      ESTABLISHED action whose established_method is VOLUNTARY_ACKNOWLEDGMENT is
      answered by ERR_RESCISSION_WINDOW_CLOSED at priority 18 instead, because the
      elapsed 60-day rescission deadline is the specific reason the request fails;
      every other disallowed from-state on that endpoint (PENDING, SPECIMEN_COLLECTED,
      AOP_RESCINDED, EXCLUDED, NOT_REQUIRED, or an ESTABLISHED action whose
      established_method is GENETIC_TEST) still answers with this error.
    error_id: ERR_INVALID_PATERNITY_STATUS
    http_status: 409
    applies_to: "every /paternity-actions/{id}/... write"

  - priority: 10
    category: state
    check: "service_status / remittance_status permit the transition per the two IWO machines"
    error_id: ERR_INVALID_IWO_STATUS
    http_status: 409
    applies_to: "every /withholding-orders/{iwo_id}/... write"

  - priority: 10
    category: state
    check: "ModificationReview.status permits the transition per the ModificationReview machine"
    error_id: ERR_INVALID_REVIEW_STATUS
    http_status: 409
    applies_to: "POST /modification-reviews/{id}/screening | information | proposed-order"

  - priority: 10
    category: state
    check: "EnforcementAction.status permits the transition per the EnforcementAction machine"
    error_id: ERR_INVALID_ACTION_STATUS
    http_status: 409
    applies_to: "POST /enforcement-actions/{id}/notice | contest | review-decision | activation | release"

  - priority: 10
    category: state
    check: "InterstateReferral.status permits the transition per the InterstateReferral machine"
    error_id: ERR_INVALID_REFERRAL_STATUS
    http_status: 409
    applies_to: "POST /interstate-referrals/{id}/transmittal | registration | return"

  - priority: 10
    category: state
    check: >
      CompromiseOffer.status permits the transition per the CompromiseOffer machine.
      One carve-out: on POST /compromise-offers/{compromise_offer_id}/acceptance a
      SUPERSEDED offer is answered by ERR_OFFER_SUPERSEDED at priority 36 instead,
      because being displaced by a newer offer is the specific reason the acceptance
      fails; COMPLETED, DEFAULTED, ACCEPTED and ACTIVE from-states on that endpoint,
      and every disallowed from-state on default-declaration, still answer with this
      error.
    error_id: ERR_INVALID_OFFER_STATUS
    http_status: 409
    applies_to: "POST /compromise-offers/{id}/acceptance | default-declaration"

  - priority: 11
    category: business_safety
    check: "case.good_cause_claim is false before any locate referral, interstate transmittal or enforcement notice can disclose party information"
    error_id: ERR_GOOD_CAUSE_BARS_DISCLOSURE
    http_status: 409
    applies_to: "POST /cases/{case_id}/locate-referrals, POST /enforcement-actions/{id}/notice, POST /interstate-referrals/{id}/transmittal"

  - priority: 12
    category: business_safety
    check: "the case's PaternityAction is in ESTABLISHED or NOT_REQUIRED before any SupportOrder may be created or calculated"
    error_id: ERR_PATERNITY_NOT_ESTABLISHED
    http_status: 409
    applies_to: "POST /cases/{case_id}/orders, POST /orders/{order_id}/guideline-calculation"

  - priority: 13
    category: business_safety
    check: >
      X-User-ID differs from the recorded originator: deviation findings may not
      be decided by order.drafted_by_user_id, and a contest review may not be
      decided by action.proposed_by_user_id
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /orders/{order_id}/deviation-findings, POST /enforcement-actions/{id}/review-decision"

  - priority: 14
    category: business_referential
    check: "custodial_party_id names a Participant with role_type CUSTODIAL_PARTY and noncustodial_party_id one with role_type NONCUSTODIAL_PARTY; the two ids differ"
    error_id: ERR_PARTY_ROLE_MISMATCH
    http_status: 422
    applies_to: "POST /cases"

  - priority: 15
    category: business_referential
    check: "tanf_assistance is true exactly when case_type == PA_REFERRAL and false exactly when case_type == DIRECT_APPLICATION"
    error_id: ERR_TANF_FLAG_MISMATCH
    http_status: 422
    applies_to: "POST /cases"

  - priority: 16
    category: business_referential
    check: "the noncustodial Participant's locate_status is LOCATED before a paternity action may open on a non-good-cause case, and is not UNLOCATABLE for any establishment step"
    error_id: ERR_NCP_NOT_LOCATED
    http_status: 409
    applies_to: "POST /cases/{case_id}/paternity-actions, POST /cases/{case_id}/orders"

  - priority: 17
    category: business_referential
    check: >
      when the case's interstate_role is RESPONDING, the REGISTERED referral's
      controlling_order_state_code must equal HOME_STATE_CODE (MN) before this
      state may enter a new order or propose a modification (continuing
      exclusive jurisdiction)
    error_id: ERR_NO_CONTROLLING_ORDER_JURISDICTION
    http_status: 409
    applies_to: "POST /orders/{order_id}/entry, POST /modification-reviews/{id}/proposed-order"

  - priority: 18
    category: business_temporal
    check: "the rescission request arrives at or before action.rescission_deadline_at (inclusive)"
    error_id: ERR_RESCISSION_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /paternity-actions/{id}/rescission"

  - priority: 19
    category: business_temporal
    check: "the specimen collection happens at or after action.collection_appointment_at, and the appointment itself is set strictly in the future"
    error_id: ERR_COLLECTION_APPOINTMENT_NOT_REACHED
    http_status: 409
    applies_to: "POST /paternity-actions/{id}/genetic-test-order, POST /paternity-actions/{id}/specimen-collection"

  - priority: 20
    category: business_temporal
    check: "activation happens strictly after action.contest_deadline_at when the action was never contested"
    error_id: ERR_CONTEST_WINDOW_OPEN
    http_status: 409
    applies_to: "POST /enforcement-actions/{id}/activation"

  - priority: 21
    category: business_temporal
    check: "a contest arrives at or before action.contest_deadline_at (inclusive)"
    error_id: ERR_CONTEST_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /enforcement-actions/{id}/contest"

  - priority: 22
    category: business_temporal
    check: >
      the new order's closed effective interval [effective_date, terminated_date]
      does not overlap any ENTERED order of the same order_type on the case;
      abutment is legal only when terminated_date == new effective_date - 1 day
    error_id: ERR_ORDER_INTERVAL_OVERLAP
    http_status: 409
    applies_to: "POST /orders/{order_id}/entry"

  - priority: 23
    category: business_temporal
    check: >
      a new charge's half-open period [period_start_date, period_end_date) does
      not overlap an existing non-VOID charge of the same charge_type on the same
      order; touching periods (previous end == new start) are legal
    error_id: ERR_CHARGE_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /orders/{order_id}/charges"

  - priority: 24
    category: business_temporal
    check: >
      a PERIODIC_36_MONTH review may not be created before the reviewed order's
      review_eligible_date (effective_date + 36 months); PARTY_REQUEST and
      PA_MANDATORY reviews are exempt
    error_id: ERR_REVIEW_NOT_YET_ELIGIBLE
    http_status: 409
    applies_to: "POST /orders/{order_id}/modification-reviews"

  - priority: 25
    category: business_temporal
    check: "the proposed successor order's effective_date is strictly later than the reviewed order's effective_date"
    error_id: ERR_MODIFICATION_EFFECTIVE_DATE_NOT_LATER
    http_status: 422
    applies_to: "POST /modification-reviews/{id}/proposed-order"

  - priority: 26
    category: business_temporal
    check: "a lapse may only be declared once the current logical clock is strictly past iwo.next_remittance_due_at"
    error_id: ERR_REMITTANCE_NOT_YET_DUE
    http_status: 409
    applies_to: "POST /withholding-orders/{iwo_id}/lapse"

  - priority: 27
    category: business_temporal
    check: "a default may only be declared once the current logical clock date is strictly past offer.next_installment_due_date"
    error_id: ERR_INSTALLMENT_NOT_YET_LATE
    http_status: 409
    applies_to: "POST /compromise-offers/{id}/default-declaration"

  - priority: 28
    category: business_constraint
    check: "locate_attempt_count on the noncustodial Participant is below MAX_LOCATE_ATTEMPTS (3)"
    error_id: ERR_LOCATE_ATTEMPTS_EXHAUSTED
    http_status: 409
    applies_to: "POST /cases/{case_id}/locate-referrals"

  - priority: 29
    category: business_constraint
    check: "action.rescission_count is below RESCISSION_LIMIT (1)"
    error_id: ERR_RESCISSION_LIMIT
    http_status: 409
    applies_to: "POST /paternity-actions/{id}/rescission"

  - priority: 30
    category: business_constraint
    check: "action.specimen_rejection_count is below SPECIMEN_REJECTION_LIMIT (2) before another rejected specimen is recorded"
    error_id: ERR_SPECIMEN_REJECTION_LIMIT
    http_status: 409
    applies_to: "POST /paternity-actions/{id}/specimen-collection"

  - priority: 31
    category: business_constraint
    check: "order.deviation_rejection_count is below DEVIATION_REJECTION_LIMIT (2) before another rejection is recorded"
    error_id: ERR_DEVIATION_REJECTION_LIMIT
    http_status: 409
    applies_to: "POST /orders/{order_id}/deviation-findings"

  - priority: 32
    category: business_constraint
    check: "review.info_request_count is at or below INFO_REQUEST_LIMIT (2)"
    error_id: ERR_INFO_REQUEST_LIMIT
    http_status: 409
    applies_to: "POST /modification-reviews/{id}/information"

  - priority: 33
    category: business_constraint
    check: "at most one PaternityAction exists per case"
    error_id: ERR_DUPLICATE_PATERNITY_ACTION
    http_status: 409
    applies_to: "POST /cases/{case_id}/paternity-actions"

  - priority: 34
    category: business_constraint
    check: "the requested deviation differs from guideline_monthly_cents by at least MIN_DEVIATION_PCT (10%), evaluated as abs(diff) * 100 >= guideline * 10"
    error_id: ERR_DEVIATION_BELOW_MIN_PCT
    http_status: 422
    applies_to: "POST /orders/{order_id}/deviation-request"

  - priority: 35
    category: business_constraint
    check: "no other CompromiseOffer on the case is already in ACCEPTED or ACTIVE"
    error_id: ERR_ACTIVE_OFFER_EXISTS
    http_status: 409
    applies_to: "POST /cases/{case_id}/compromise-offers, POST /compromise-offers/{id}/acceptance"

  - priority: 36
    category: business_constraint
    check: "the offer being accepted has not been superseded by a newer offer on the same case"
    error_id: ERR_OFFER_SUPERSEDED
    http_status: 409
    applies_to: "POST /compromise-offers/{id}/acceptance"

  - priority: 37
    category: business_constraint
    check: "case.enforcement_posture is not STAYED when a new enforcement action is proposed, noticed or activated"
    error_id: ERR_ENFORCEMENT_STAYED
    http_status: 409
    applies_to: "POST /cases/{case_id}/enforcement-actions, POST /enforcement-actions/{id}/notice, POST /enforcement-actions/{id}/activation"

  - priority: 38
    category: business_constraint
    check: "case.tanf_assistance is false — arrears assigned to the state are not compromisable"
    error_id: ERR_ASSIGNED_ARREARS_NOT_COMPROMISABLE
    http_status: 409
    applies_to: "POST /cases/{case_id}/compromise-offers"

  - priority: 39
    category: business_constraint
    check: "the noncustodial Participant's compromise_risk_tier (compromise_screen variant) is not HIGH"
    error_id: ERR_COMPROMISE_RISK_TOO_HIGH
    http_status: 409
    applies_to: "POST /cases/{case_id}/compromise-offers"

  - priority: 40
    category: business_fiscal
    check: >
      the sum of withholding_amount_cents over the obligor's non-TERMINATED IWOs
      (this one included) does not exceed
      floor(sum(reported_disposable_income_cents) * min(ccpa_cap_pct)) — the most
      restrictive employer-state percentage binds the whole collection, so each
      IWO can fit its own cap while the aggregate breaches
    error_id: ERR_AGGREGATE_WITHHOLDING_EXCEEDS_CAP
    http_status: 409
    applies_to: "POST /orders/{order_id}/withholding-orders, POST /withholding-orders/{iwo_id}/amendment"

  - priority: 41
    category: business_fiscal
    check: "the computed withholding_amount_cents is greater than 0 after the CCPA cap and the employer fee are applied"
    error_id: ERR_WITHHOLDING_CAP_EXHAUSTED
    http_status: 409
    applies_to: "POST /orders/{order_id}/withholding-orders"

  - priority: 42
    category: business_fiscal
    check: "arrears_certified_snapshot_cents clears both gates of enforcement_eligibility_thresholds for the requested action_type"
    error_id: ERR_ARREARS_BELOW_ENFORCEMENT_THRESHOLD
    http_status: 409
    applies_to: "POST /cases/{case_id}/enforcement-actions"

  - priority: 43
    category: business_fiscal
    check: "case.arrears_principal_cents is at least MIN_COMPROMISE_ARREARS_CENTS (100000)"
    error_id: ERR_ARREARS_BELOW_COMPROMISE_MINIMUM
    http_status: 409
    applies_to: "POST /cases/{case_id}/compromise-offers"

  - priority: 44
    category: business_fiscal
    check: "closed_reason ARREARS_SATISFIED requires case.arrears_principal_cents == 0 and interest_receivable_cents == 0"
    error_id: ERR_ARREARS_OUTSTANDING
    http_status: 409
    applies_to: "POST /cases/{case_id}/closure"

  - priority: 45
    category: business_fiscal
    check: "the charge has paid_cents == 0 on the manual voidance path"
    error_id: ERR_CHARGE_PARTIALLY_PAID
    http_status: 409
    applies_to: "POST /charges/{charge_id}/voidance"

  - priority: 46
    category: business_fiscal
    check: "the IWO's remittance_status is not DEFAULTED when a remittance is posted"
    error_id: ERR_IWO_DEFAULTED
    http_status: 409
    applies_to: "POST /withholding-orders/{iwo_id}/remittances"

  - priority: 47
    category: business_fiscal
    check: "a COMPROMISE_INSTALLMENT payment covers at least offer.monthly_installment_cents (or final_installment_cents on the last installment)"
    error_id: ERR_PAYMENT_BELOW_INSTALLMENT
    http_status: 422
    applies_to: "POST /cases/{case_id}/payments"

  - priority: 48
    category: business_fiscal
    check: "case.arrears_principal_cents still equals offer.principal_due_snapshot_cents at acceptance time"
    error_id: ERR_OFFER_SNAPSHOT_STALE
    http_status: 409
    applies_to: "POST /compromise-offers/{id}/acceptance"

# =============================================================================
# 1.5 API ENDPOINT TABLE — 72 endpoints, all under /child-support
# =============================================================================
endpoints:

  # ---- logical clock (test-driving endpoint) --------------------------------
  - method: POST
    path: "/child-support/_clock/set_current_utc"
    description: >
      Sets the server's logical clock. The server starts at the fixed default
      2026-08-01T00:00:00Z and MUST NOT fall back to real wall-clock time before
      the first call. Advancing the clock past a rescission_deadline_at
      system-establishes the affected AOP_SIGNED paternity actions.
    roles: [ProgramAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects:
      - "every PaternityAction in AOP_SIGNED whose rescission_deadline_at is strictly before the new clock value transitions to ESTABLISHED with established_method VOLUNTARY_ACKNOWLEDGMENT"
      - "each such action's SupportCase moves case_status to ORDER_ESTABLISHMENT"
      - "no other entity is mutated; deadlines are evaluated, never back-dated"

  # ---- Participant ----------------------------------------------------------
  - method: POST
    path: "/child-support/participants"
    description: "Registers a custodial or noncustodial party."
    roles: [CaseWorker]
    code: 201
    input: [role_type, full_name, ssn_last4, residence_state_code, "employer_name?", "monthly_gross_income_cents?", "income_verification_source?", "supports_second_family?", "has_valid_drivers_license?"]
    output: Participant
    side_effects:
      - "locate_status defaults to NOT_NEEDED; all remedy flags default false"
      - "enforcement_risk_score / compromise_risk_score computed (both 0 with no cases)"

  - method: GET
    path: "/child-support/participants/{participant_id}"
    description: "Reads one participant with both risk variants recomputed."
    roles: [CaseWorker, SupervisingAttorney, FinanceOfficer, InterstateLiaison, ProgramAdmin, CustodialParty, NoncustodialParty]
    code: 200
    output: Participant
    side_effects:
      - "recomputes enforcement_risk_score / tier and compromise_risk_score / tier from current case data"
      - "recomputes total_arrears_certified_cents (statutory interest variant) and open_case_count"

  - method: GET
    path: "/child-support/participants"
    description: "Lists participants with pagination and filters."
    roles: [CaseWorker, SupervisingAttorney, FinanceOfficer, InterstateLiaison, ProgramAdmin]
    code: 200
    input: ["role_type?", "residence_state_code?", "locate_status?", "enforcement_risk_tier?", "limit?", "offset?"]
    output: Participant[]
    side_effects: []

  - method: PATCH
    path: "/child-support/participants/{participant_id}/income"
    description: "Records a new income figure and its verification provenance."
    roles: [CaseWorker]
    code: 200
    input: [monthly_gross_income_cents, income_verification_source, "employer_name?"]
    output: Participant
    side_effects:
      - "increments Participant.version by 1"
      - "does NOT retroactively change any ENTERED order; only future guideline calculations see the new figure"
      - "both risk variants recomputed"

  - method: POST
    path: "/child-support/participants/{participant_id}/locate-results"
    description: >
      Records the outcome of locate services for a participant. locate_outcome is
      one of {LOCATED, UNLOCATABLE}.
    roles: [CaseWorker]
    code: 200
    input: [locate_outcome, "employer_name?"]
    output: Participant
    side_effects:
      - "locate_status := LOCATED or UNLOCATABLE per locate_outcome"
      - "increments Participant.version by 1"
      - "an UNLOCATABLE outcome makes every case of this participant eligible for closure with NO_JURISDICTION"

  # ---- SupportCase ----------------------------------------------------------
  - method: POST
    path: "/child-support/cases"
    description: "Opens a IV-D case from a public-assistance referral or a direct application."
    roles: [CaseWorker]
    code: 201
    input: [case_type, custodial_party_id, noncustodial_party_id, child_count, tanf_assistance, "good_cause_claim?"]
    output: SupportCase
    side_effects:
      - "case_status := OPENED, enforcement_posture := NORMAL, interstate_role := NONE"
      - "Participant.open_case_count recomputed for both parties"
      - "all money fields start at 0"

  - method: GET
    path: "/child-support/cases/{case_id}"
    description: "Reads one case with every derived money field recomputed."
    roles: [CaseWorker, SupervisingAttorney, FinanceOfficer, InterstateLiaison, ProgramAdmin, CustodialParty, NoncustodialParty]
    code: 200
    output: SupportCase
    side_effects:
      - "recomputes arrears_principal_cents, assigned_arrears_cents, unassigned_arrears_cents and interest_receivable_cents (aggregate interest variant)"

  - method: GET
    path: "/child-support/cases"
    description: "Lists cases; the FK filters make both party links reverse-reachable."
    roles: [CaseWorker, SupervisingAttorney, FinanceOfficer, InterstateLiaison, ProgramAdmin]
    code: 200
    input: ["custodial_party_id?", "noncustodial_party_id?", "case_status?", "enforcement_posture?", "interstate_role?", "tanf_assistance?", "limit?", "offset?"]
    output: SupportCase[]
    side_effects: []

  - method: POST
    path: "/child-support/cases/{case_id}/locate-referrals"
    description: >
      Refers the noncustodial party to locate services. locate_source is one of
      {FEDERAL_PLS, STATE_DIRECTORY_OF_NEW_HIRES, CREDIT_BUREAU, EMPLOYER_TIP}.
    roles: [CaseWorker]
    code: 200
    input: [locate_source]
    output: SupportCase
    side_effects:
      - "case_status OPENED -> LOCATE (or LOCATE -> LOCATE on a repeat referral)"
      - "case.locate_referral_count += 1; increments SupportCase.version by 1"
      - "noncustodial Participant.locate_status := PENDING and locate_attempt_count += 1"
      - "the referral that reaches MAX_LOCATE_ATTEMPTS sets locate_status := UNLOCATABLE"

  - method: POST
    path: "/child-support/cases/{case_id}/closure"
    description: "Closes the case, terminating withholding and recomputing party counters."
    roles: [SupervisingAttorney]
    code: 200
    input: [closed_reason]
    output: SupportCase
    side_effects:
      - "case_status := CLOSED; closed_at := current logical clock; increments SupportCase.version by 1"
      - "every SERVED or AMENDED IWO on the case is TERMINATED with terminated_reason CASE_CLOSED and Employer.active_iwo_count decremented"
      - "Participant.open_case_count recomputed for both parties"

  - method: GET
    path: "/child-support/cases/{case_id}/ledger"
    description: >
      Computed read returning the full arrears ledger: principal, both interest
      variants side by side, the waterfall buckets consumed to date, and the
      assigned / unassigned split.
    roles: [CaseWorker, SupervisingAttorney, FinanceOfficer, ProgramAdmin]
    code: 200
    input: ["as_of_date?"]
    output: null
    side_effects:
      - "no mutation; the response body carries statutory_interest_cents, aggregate_interest_cents, interest_written_off_cents, interest_collected_cents, interest_receivable_cents, arrears_principal_cents, assigned_arrears_cents, unassigned_arrears_cents, unapplied_credit_cents"

  - method: POST
    path: "/child-support/cases/{case_id}/accrual-runs"
    description: "Posts interest accrual up to the current logical clock date."
    roles: [FinanceOfficer]
    code: 200
    output: SupportCase
    side_effects:
      - "each OPEN charge's interest_accrued_cents set from the statutory_per_charge variant"
      - "case.interest_receivable_cents recomputed from the aggregate_month_end variant minus written-off minus collected"
      - "increments SupportCase.version by 1"
      - "idempotent for a fixed clock value: a second run at the same clock produces identical figures"

  # ---- PaternityAction ------------------------------------------------------
  - method: POST
    path: "/child-support/cases/{case_id}/paternity-actions"
    description: "Opens the single paternity action of a case on the AOP, genetic or marital-presumption track."
    roles: [CaseWorker]
    code: 201
    input: [method]
    output: PaternityAction
    side_effects:
      - "method PRESUMED_MARITAL creates the row directly in NOT_REQUIRED and moves case_status to ORDER_ESTABLISHMENT"
      - "the other two methods create the row in PENDING and move case_status to PATERNITY_PENDING"
      - "increments SupportCase.version by 1"

  - method: GET
    path: "/child-support/paternity-actions/{paternity_action_id}"
    description: "Reads one paternity action."
    roles: [CaseWorker, SupervisingAttorney, ProgramAdmin, CustodialParty, NoncustodialParty]
    code: 200
    output: PaternityAction
    side_effects: []

  - method: GET
    path: "/child-support/paternity-actions"
    description: "Lists paternity actions; case_id makes the action reverse-reachable from its case."
    roles: [CaseWorker, SupervisingAttorney, ProgramAdmin]
    code: 200
    input: ["case_id?", "status?", "method?", "limit?", "offset?"]
    output: PaternityAction[]
    side_effects: []

  - method: POST
    path: "/child-support/paternity-actions/{paternity_action_id}/acknowledgment"
    description: "Records a notarised voluntary acknowledgment of parentage and opens the 60-day rescission window."
    roles: [CaseWorker]
    code: 200
    input: [notary_verified, signed_by_participant_id]
    output: PaternityAction
    side_effects:
      - "status PENDING or AOP_RESCINDED -> AOP_SIGNED"
      - "aop_signed_at := current logical clock; rescission_deadline_at := aop_signed_at + 60 days"
      - "increments PaternityAction.version by 1"

  - method: POST
    path: "/child-support/paternity-actions/{paternity_action_id}/rescission"
    description: "Rescinds a signed acknowledgment inside the statutory window."
    roles: [NoncustodialParty]
    code: 200
    output: PaternityAction
    side_effects:
      - "status AOP_SIGNED -> AOP_RESCINDED; rescission_count += 1"
      - "aop_signed_at and rescission_deadline_at cleared"
      - "increments PaternityAction.version by 1"

  - method: POST
    path: "/child-support/paternity-actions/{paternity_action_id}/genetic-test-order"
    description: "Orders genetic testing and schedules specimen collection."
    roles: [SupervisingAttorney]
    code: 200
    input: [collection_appointment_at]
    output: PaternityAction
    side_effects:
      - "status PENDING or AOP_RESCINDED -> GENETIC_ORDERED; method := GENETIC_TEST"
      - "genetic_test_ordered_at := current logical clock; genetic_cost_cents := 48000"
      - "increments PaternityAction.version by 1"

  - method: POST
    path: "/child-support/paternity-actions/{paternity_action_id}/specimen-collection"
    description: "Records a specimen collection attempt and its chain-of-custody outcome."
    roles: [CaseWorker]
    code: 200
    input: [chain_of_custody_ok]
    output: PaternityAction
    side_effects:
      - "chain_of_custody_ok true -> GENETIC_COLLECTED with specimen_collected_at set"
      - "chain_of_custody_ok false -> stays GENETIC_ORDERED with specimen_rejection_count += 1"
      - "increments PaternityAction.version by 1"

  - method: POST
    path: "/child-support/paternity-actions/{paternity_action_id}/genetic-result"
    description: "Records the probability of parentage and closes the paternity question."
    roles: [SupervisingAttorney]
    code: 200
    input: [genetic_probability_pct]
    output: PaternityAction
    side_effects:
      - "pct >= 99.0 -> ESTABLISHED, genetic_cost_liable_party := NCP, case_status := ORDER_ESTABLISHMENT"
      - "pct < 99.0 -> EXCLUDED, genetic_cost_liable_party := STATE, and the four-level exclusion cascade runs (case CLOSED, orders VACATED, charges VOID, enforcement RELEASED, participant flags cleared)"
      - "increments PaternityAction.version and SupportCase.version by 1"

  # ---- SupportOrder ---------------------------------------------------------
  - method: POST
    path: "/child-support/cases/{case_id}/orders"
    description: "Drafts a support order for a case whose paternity question is settled."
    roles: [CaseWorker]
    code: 201
    input: [order_type, origin_state_code, effective_date, "medical_support_monthly_cents?", "requested_monthly_cents?"]
    output: SupportOrder
    side_effects:
      - "status := DRAFT; every guideline_* field stays null until guideline-calculation runs"
      - "review_eligible_date is derivable as effective_date + 36 months"

  - method: GET
    path: "/child-support/orders/{order_id}"
    description: "Reads one support order."
    roles: [CaseWorker, SupervisingAttorney, FinanceOfficer, InterstateLiaison, ProgramAdmin, CustodialParty, NoncustodialParty]
    code: 200
    output: SupportOrder
    side_effects: []

  - method: GET
    path: "/child-support/orders"
    description: "Lists support orders; case_id and superseded_by_order_id make both FKs reverse-reachable."
    roles: [CaseWorker, SupervisingAttorney, FinanceOfficer, InterstateLiaison, ProgramAdmin]
    code: 200
    input: ["case_id?", "status?", "order_type?", "origin_state_code?", "superseded_by_order_id?", "limit?", "offset?"]
    output: SupportOrder[]
    side_effects: []

  - method: POST
    path: "/child-support/orders/{order_id}/guideline-calculation"
    description: "Runs the state guideline worksheet against the parties' current incomes."
    roles: [CaseWorker]
    code: 200
    output: SupportOrder
    side_effects:
      - "status DRAFT -> CALCULATED, or CALCULATED -> CALCULATED on a re-run"
      - "guideline_cp_income_cents / guideline_ncp_income_cents / guideline_basic_obligation_cents / guideline_ncp_share_ratio / multi_family_credit_cents / guideline_monthly_cents / imputation_applied all written"
      - "drafted_by_user_id := X-User-ID"
      - "increments SupportOrder.version by 1"

  - method: POST
    path: "/child-support/orders/{order_id}/deviation-request"
    description: "Requests a deviation from the guideline amount with a statutory reason."
    roles: [CaseWorker]
    code: 200
    input: [deviation_requested_cents, deviation_reason]
    output: SupportOrder
    side_effects:
      - "status CALCULATED -> PENDING_DEVIATION_FINDINGS"
      - "increments SupportOrder.version by 1"

  - method: POST
    path: "/child-support/orders/{order_id}/deviation-findings"
    description: "Attorney decision on a requested deviation; the drafter may not decide."
    roles: [SupervisingAttorney]
    code: 200
    input: [decision]
    output: SupportOrder
    side_effects:
      - "APPROVE -> ENTERED with deviation_applied true, monthly_obligation_cents := deviation_requested_cents, findings_approved_by_user_id := X-User-ID, case_status := ENFORCEMENT"
      - "REJECT -> CALCULATED with deviation_rejection_count += 1 and the deviation fields cleared"
      - "increments SupportOrder.version by 1"

  - method: POST
    path: "/child-support/orders/{order_id}/entry"
    description: "Enters the order at the guideline amount."
    roles: [SupervisingAttorney]
    code: 200
    output: SupportOrder
    side_effects:
      - "status CALCULATED -> ENTERED; monthly_obligation_cents := guideline_monthly_cents"
      - "next_accrual_due_date := effective_date; case_status := ENFORCEMENT"
      - "when this order was produced by a modification review, the predecessor order becomes SUPERSEDED with terminated_date := this effective_date - 1 day, and every SERVED IWO of the predecessor is TERMINATED with terminated_reason ORDER_SUPERSEDED"
      - "increments SupportOrder.version by 1"

  - method: POST
    path: "/child-support/orders/{order_id}/vacatur"
    description: "Vacates an order and reverses everything it produced."
    roles: [SupervisingAttorney]
    code: 200
    input: [vacate_reason]
    output: SupportOrder
    side_effects:
      - "status -> VACATED; terminated_date := current logical clock date"
      - "every OPEN charge of the order -> VOID and its paid_cents returns to case.unapplied_credit_cents"
      - "every SERVED or AMENDED IWO of the order -> TERMINATED with terminated_reason ORDER_VACATED and Employer.active_iwo_count decremented"
      - "increments SupportOrder.version and SupportCase.version by 1"

  # ---- Employer -------------------------------------------------------------
  - method: POST
    path: "/child-support/employers"
    description: "Registers an employer with its state law cap and remittance fee."
    roles: [ProgramAdmin]
    code: 201
    input: [legal_name, fein, state_code, pay_frequency, "remittance_fee_cents?"]
    output: Employer
    side_effects:
      - "statutory_cap_pct := EMPLOYER_STATE_CAPS[state_code] (null where the state defers to the federal cap)"
      - "active_iwo_count := 0"

  - method: GET
    path: "/child-support/employers/{employer_id}"
    description: "Reads one employer."
    roles: [CaseWorker, SupervisingAttorney, FinanceOfficer, ProgramAdmin, EmployerAgent]
    code: 200
    output: Employer
    side_effects: []

  - method: GET
    path: "/child-support/employers"
    description: "Lists employers."
    roles: [CaseWorker, SupervisingAttorney, FinanceOfficer, ProgramAdmin]
    code: 200
    input: ["state_code?", "fein?", "limit?", "offset?"]
    output: Employer[]
    side_effects: []

  # ---- IncomeWithholdingOrder ----------------------------------------------
  - method: POST
    path: "/child-support/orders/{order_id}/withholding-orders"
    description: >
      Issues an income withholding order to an employer. The employer's state law
      governs the CCPA cap, and the aggregate of the obligor's existing IWOs is
      checked against the most restrictive cap among them. Guarded by OCC on the
      parent order.
    roles: [CaseWorker]
    code: 201
    input: [employer_id, expected_order_version, "reported_disposable_income_cents?"]
    output: IncomeWithholdingOrder
    side_effects:
      - "increments SupportOrder.version by 1"
      - "service_status := ISSUED, remittance_status := NOT_DUE"
      - "jurisdiction_state_code := employer.state_code; federal_cap_pct / ccpa_cap_pct / ccpa_cap_amount_cents / arrears_recovery_cents / requested_amount_cents / withholding_amount_cents / employer_fee_cents all computed by calculations.withholding_amount"

  - method: GET
    path: "/child-support/withholding-orders/{iwo_id}"
    description: "Reads one income withholding order."
    roles: [CaseWorker, SupervisingAttorney, FinanceOfficer, ProgramAdmin, EmployerAgent, NoncustodialParty]
    code: 200
    output: IncomeWithholdingOrder
    side_effects: []

  - method: GET
    path: "/child-support/withholding-orders"
    description: "Lists IWOs; order_id and employer_id make both FKs reverse-reachable."
    roles: [CaseWorker, SupervisingAttorney, FinanceOfficer, ProgramAdmin, EmployerAgent]
    code: 200
    input: ["order_id?", "employer_id?", "service_status?", "remittance_status?", "jurisdiction_state_code?", "limit?", "offset?"]
    output: IncomeWithholdingOrder[]
    side_effects:
      - "an EmployerAgent caller sees only rows whose employer_id equals X-User-ID"

  - method: POST
    path: "/child-support/withholding-orders/{iwo_id}/service"
    description: "Records service of the IWO on the employer and starts the implementation clock."
    roles: [CaseWorker]
    code: 200
    output: IncomeWithholdingOrder
    side_effects:
      - "service_status ISSUED -> SERVED; served_at := current logical clock"
      - "first_withholding_due_at := served_at + 14 days; next_remittance_due_at := first_withholding_due_at"
      - "Employer.active_iwo_count += 1"
      - "increments IncomeWithholdingOrder.version and Employer.version by 1"

  - method: POST
    path: "/child-support/withholding-orders/{iwo_id}/amendment"
    description: "Amends the reported disposable income and recomputes the cap."
    roles: [CaseWorker]
    code: 200
    input: [reported_disposable_income_cents]
    output: IncomeWithholdingOrder
    side_effects:
      - "service_status SERVED -> AMENDED (or AMENDED -> AMENDED)"
      - "ccpa_cap_pct / ccpa_cap_amount_cents / withholding_amount_cents / employer_fee_cents recomputed; remittance_status untouched"
      - "increments IncomeWithholdingOrder.version by 1"

  - method: POST
    path: "/child-support/withholding-orders/{iwo_id}/remittances"
    description: "Employer posts a withheld remittance, which is allocated through the waterfall."
    roles: [EmployerAgent]
    code: 201
    input: [amount_cents]
    output: PaymentTransaction
    side_effects:
      - "a PaymentTransaction with source INCOME_WITHHOLDING and iwo_id set is created and allocated by calculations.payment_allocation_waterfall, then split by calculations.payment_distribution_split"
      - "remittance_status NOT_DUE or DELINQUENT -> CURRENT; missed_remittance_count := 0; next_remittance_due_at advanced one pay period"
      - "charges driven to a zero balance become SATISFIED; case money fields updated"
      - "increments IncomeWithholdingOrder.version and SupportCase.version by 1"

  - method: POST
    path: "/child-support/withholding-orders/{iwo_id}/lapse"
    description: "Records a missed remittance period."
    roles: [FinanceOfficer]
    code: 200
    output: IncomeWithholdingOrder
    side_effects:
      - "missed_remittance_count += 1; remittance_status -> DELINQUENT, or -> DEFAULTED once the count reaches 2"
      - "increments IncomeWithholdingOrder.version by 1"
      - "the obligor's enforcement_risk_score gains the delinquency component on its next recomputation"

  - method: POST
    path: "/child-support/withholding-orders/{iwo_id}/termination"
    description: "Terminates the IWO."
    roles: [CaseWorker]
    code: 200
    input: [terminated_reason]
    output: IncomeWithholdingOrder
    side_effects:
      - "service_status -> TERMINATED; next_remittance_due_at := null"
      - "Employer.active_iwo_count decremented only when the IWO had reached SERVED or AMENDED"
      - "the obligor's aggregate withholding capacity frees up for a new IWO"
      - "increments IncomeWithholdingOrder.version and Employer.version by 1"

  # ---- ObligationCharge -----------------------------------------------------
  - method: POST
    path: "/child-support/orders/{order_id}/charges"
    description: "Posts a monthly obligation charge (current support, medical or arrears judgment) against an entered order."
    roles: [FinanceOfficer]
    code: 201
    input: [charge_type, period_start_date, period_end_date, due_date, "amount_cents?"]
    output: ObligationCharge
    side_effects:
      - "amount_cents defaults to order.monthly_obligation_cents for CURRENT_SUPPORT and to order.medical_support_monthly_cents for MEDICAL_SUPPORT"
      - "status := OPEN; unpaid_balance_cents := amount_cents; interest_accrued_cents := 0"
      - "case.total_charged_principal_cents += amount_cents; order.next_accrual_due_date advanced one month"
      - "increments SupportCase.version and SupportOrder.version by 1"
      - "the charge is immutable (ObligationCharge has no version field and no update endpoint)"

  - method: GET
    path: "/child-support/charges/{charge_id}"
    description: "Reads one obligation charge with its accrued interest."
    roles: [CaseWorker, SupervisingAttorney, FinanceOfficer, ProgramAdmin, CustodialParty, NoncustodialParty]
    code: 200
    output: ObligationCharge
    side_effects: []

  - method: GET
    path: "/child-support/charges"
    description: "Lists charges; case_id and order_id make both FKs reverse-reachable."
    roles: [CaseWorker, SupervisingAttorney, FinanceOfficer, ProgramAdmin]
    code: 200
    input: ["case_id?", "order_id?", "status?", "charge_type?", "limit?", "offset?"]
    output: ObligationCharge[]
    side_effects: []

  - method: POST
    path: "/child-support/charges/{charge_id}/voidance"
    description: "Voids an unpaid charge posted in error."
    roles: [FinanceOfficer]
    code: 200
    output: ObligationCharge
    side_effects:
      - "status OPEN -> VOID; the charge leaves every interest input set"
      - "case.total_charged_principal_cents -= amount_cents; case.arrears_principal_cents recomputed"
      - "increments SupportCase.version by 1 (the charge itself has no version)"

  # ---- PaymentTransaction ---------------------------------------------------
  - method: POST
    path: "/child-support/cases/{case_id}/payments"
    description: "Posts a non-withholding collection (direct pay, tax intercept, levy or compromise installment)."
    roles: [FinanceOfficer]
    code: 201
    input: [source, amount_cents, "compromise_offer_id?"]
    output: PaymentTransaction
    side_effects:
      - "allocated by calculations.payment_allocation_waterfall and split by calculations.payment_distribution_split"
      - "charges driven to a zero balance become SATISFIED"
      - "a COMPROMISE_INSTALLMENT payment advances the referenced offer: ACCEPTED -> ACTIVE, ACTIVE -> ACTIVE, or ACTIVE -> COMPLETED on the final installment"
      - "a TAX_REFUND_INTERCEPT payment that clears the arrears releases the matching ACTIVE TAX_REFUND_INTERCEPT enforcement action with release_reason ARREARS_SATISFIED"
      - "increments SupportCase.version by 1"

  - method: GET
    path: "/child-support/payments/{payment_id}"
    description: "Reads one payment with its full allocation breakdown."
    roles: [CaseWorker, SupervisingAttorney, FinanceOfficer, ProgramAdmin, CustodialParty, NoncustodialParty]
    code: 200
    output: PaymentTransaction
    side_effects: []

  - method: GET
    path: "/child-support/payments"
    description: "Lists payments; case_id, iwo_id and compromise_offer_id make all three FKs reverse-reachable."
    roles: [CaseWorker, SupervisingAttorney, FinanceOfficer, ProgramAdmin]
    code: 200
    input: ["case_id?", "iwo_id?", "compromise_offer_id?", "source?", "limit?", "offset?"]
    output: PaymentTransaction[]
    side_effects: []

  # ---- ModificationReview ---------------------------------------------------
  - method: POST
    path: "/child-support/orders/{order_id}/modification-reviews"
    description: "Opens a modification review on an entered order."
    roles: [CaseWorker]
    code: 201
    input: [trigger_type]
    output: ModificationReview
    side_effects:
      - "status := REQUESTED; current_obligation_snapshot_cents := order.monthly_obligation_cents"
      - "review_eligible_date := order.effective_date + 36 months"
      - "case_id copied from the order"

  - method: GET
    path: "/child-support/modification-reviews/{modification_review_id}"
    description: "Reads one modification review."
    roles: [CaseWorker, SupervisingAttorney, ProgramAdmin, CustodialParty, NoncustodialParty]
    code: 200
    output: ModificationReview
    side_effects: []

  - method: GET
    path: "/child-support/modification-reviews"
    description: "Lists reviews; case_id, order_id and proposed_order_id make all three FKs reverse-reachable."
    roles: [CaseWorker, SupervisingAttorney, ProgramAdmin]
    code: 200
    input: ["case_id?", "order_id?", "proposed_order_id?", "status?", "trigger_type?", "limit?", "offset?"]
    output: ModificationReview[]
    side_effects: []

  - method: POST
    path: "/child-support/modification-reviews/{modification_review_id}/screening"
    description: "Screens the review against the substantial-change test."
    roles: [CaseWorker]
    code: 200
    output: ModificationReview
    side_effects:
      - "an unverified party income bounces the review to INFO_PENDING with info_request_count += 1 and info_requested_reason set (NCP checked before CP)"
      - "otherwise recalculated_guideline_cents / variance_numerator_cents / substantial_change_met / screened_at written and the review lands in THRESHOLD_MET or THRESHOLD_NOT_MET"
      - "increments ModificationReview.version by 1"

  - method: POST
    path: "/child-support/modification-reviews/{modification_review_id}/information"
    description: "Supplies the income information the screening asked for and returns the review to REQUESTED."
    roles: [CaseWorker]
    code: 200
    input: [participant_id, monthly_gross_income_cents, income_verification_source]
    output: ModificationReview
    side_effects:
      - "status INFO_PENDING -> REQUESTED; info_requested_reason cleared"
      - "the named Participant's income fields are updated and its version incremented"
      - "increments ModificationReview.version by 1"

  - method: POST
    path: "/child-support/modification-reviews/{modification_review_id}/proposed-order"
    description: "Creates the successor order carrying the recalculated guideline amount."
    roles: [SupervisingAttorney]
    code: 200
    input: [effective_date]
    output: ModificationReview
    side_effects:
      - "status THRESHOLD_MET -> ORDER_PROPOSED"
      - "a successor SupportOrder is created in CALCULATED with guideline_monthly_cents := review.recalculated_guideline_cents; discoverable only via GET /child-support/orders?case_id=..."
      - "review.proposed_order_id := the successor id"
      - "increments ModificationReview.version by 1"

  # ---- EnforcementAction ----------------------------------------------------
  - method: POST
    path: "/child-support/cases/{case_id}/enforcement-actions"
    description: "Proposes an enforcement remedy once the certified arrears clear the remedy's threshold."
    roles: [CaseWorker]
    code: 201
    input: [action_type]
    output: EnforcementAction
    side_effects:
      - "arrears_certified_snapshot_cents computed with the statutory_per_charge interest variant; eligibility_threshold_cents recorded"
      - "status := PROPOSED; proposed_by_user_id := X-User-ID"

  - method: GET
    path: "/child-support/enforcement-actions/{enforcement_action_id}"
    description: "Reads one enforcement action."
    roles: [CaseWorker, SupervisingAttorney, InterstateLiaison, ProgramAdmin, NoncustodialParty]
    code: 200
    output: EnforcementAction
    side_effects: []

  - method: GET
    path: "/child-support/enforcement-actions"
    description: "Lists enforcement actions; case_id makes the FK reverse-reachable."
    roles: [CaseWorker, SupervisingAttorney, InterstateLiaison, ProgramAdmin]
    code: 200
    input: ["case_id?", "action_type?", "status?", "limit?", "offset?"]
    output: EnforcementAction[]
    side_effects: []

  - method: POST
    path: "/child-support/enforcement-actions/{enforcement_action_id}/notice"
    description: "Sends the pre-deprivation notice and opens the 30-day contest window."
    roles: [CaseWorker]
    code: 200
    output: EnforcementAction
    side_effects:
      - "status PROPOSED -> NOTICE_SENT; notice_sent_at := current logical clock"
      - "contest_deadline_at := notice_sent_at + 30 days"
      - "increments EnforcementAction.version by 1"

  - method: POST
    path: "/child-support/enforcement-actions/{enforcement_action_id}/contest"
    description: "Obligor contests the proposed remedy inside the notice window."
    roles: [NoncustodialParty]
    code: 200
    input: [contest_grounds]
    output: EnforcementAction
    side_effects:
      - "status NOTICE_SENT -> CONTESTED; contested_at := current logical clock"
      - "increments EnforcementAction.version by 1"

  - method: POST
    path: "/child-support/enforcement-actions/{enforcement_action_id}/review-decision"
    description: "Attorney decides a contested action; the proposer may not decide."
    roles: [SupervisingAttorney]
    code: 200
    input: [review_decision]
    output: EnforcementAction
    side_effects:
      - "UPHOLD -> ACTIVE with activated_at set, remedy_applied true, the matching Participant flag set and case.enforcement_posture := ESCALATED"
      - "VACATE -> DENIED with no participant flag ever set"
      - "review_decided_by_user_id := X-User-ID"
      - "increments EnforcementAction.version and SupportCase.version by 1"

  - method: POST
    path: "/child-support/enforcement-actions/{enforcement_action_id}/activation"
    description: "Activates an uncontested remedy after the contest window has fully elapsed."
    roles: [CaseWorker]
    code: 200
    output: EnforcementAction
    side_effects:
      - "status NOTICE_SENT -> ACTIVE; activated_at := current logical clock; remedy_applied := true"
      - "LICENSE_SUSPENSION sets Participant.license_suspension_active and clears has_valid_drivers_license; PROPERTY_LIEN sets lien_recorded; CREDIT_BUREAU_REPORT sets credit_bureau_reported"
      - "case.enforcement_posture := ESCALATED; a REGISTERED ENFORCEMENT referral on the case moves to ENFORCING"
      - "increments EnforcementAction.version, Participant.version and SupportCase.version by 1"

  - method: POST
    path: "/child-support/enforcement-actions/{enforcement_action_id}/release"
    description: "Releases an active remedy."
    roles: [SupervisingAttorney]
    code: 200
    input: [release_reason]
    output: EnforcementAction
    side_effects:
      - "status ACTIVE -> RELEASED; released_at := current logical clock; remedy_applied := false"
      - "the Participant remedy flag is reversed only when no other ACTIVE action of the same action_type names the participant: LICENSE_SUSPENSION sets license_suspension_active := false and restores has_valid_drivers_license := true, PROPERTY_LIEN sets lien_recorded := false, CREDIT_BUREAU_REPORT sets credit_bureau_reported := false"
      - "case.enforcement_posture := NORMAL once no ACTIVE action remains"
      - "increments EnforcementAction.version, Participant.version and SupportCase.version by 1"

  # ---- InterstateReferral ---------------------------------------------------
  - method: POST
    path: "/child-support/cases/{case_id}/interstate-referrals"
    description: "Drafts a UIFSA transmittal to or from a sister state."
    roles: [InterstateLiaison]
    code: 201
    input: [direction, other_state_code, child_home_state_code, transmittal_type]
    output: InterstateReferral
    side_effects:
      - "status := DRAFT; case.interstate_role is not touched until transmittal or registration"

  - method: GET
    path: "/child-support/interstate-referrals/{interstate_referral_id}"
    description: "Reads one interstate referral."
    roles: [CaseWorker, SupervisingAttorney, InterstateLiaison, ProgramAdmin]
    code: 200
    output: InterstateReferral
    side_effects: []

  - method: GET
    path: "/child-support/interstate-referrals"
    description: "Lists referrals; case_id and controlling_order_id make both FKs reverse-reachable."
    roles: [CaseWorker, SupervisingAttorney, InterstateLiaison, ProgramAdmin]
    code: 200
    input: ["case_id?", "controlling_order_id?", "status?", "direction?", "other_state_code?", "limit?", "offset?"]
    output: InterstateReferral[]
    side_effects: []

  - method: POST
    path: "/child-support/interstate-referrals/{interstate_referral_id}/transmittal"
    description: "Transmits an initiating-state request and starts the acknowledgment clock."
    roles: [InterstateLiaison]
    code: 200
    output: InterstateReferral
    side_effects:
      - "status DRAFT -> TRANSMITTED; transmitted_at := current logical clock; ack_due_at := transmitted_at + 10 days"
      - "case.interstate_role := INITIATING; increments SupportCase.version and InterstateReferral.version by 1"

  - method: POST
    path: "/child-support/interstate-referrals/{interstate_referral_id}/registration"
    description: "Registers the foreign order and determines the controlling order."
    roles: [InterstateLiaison]
    code: 200
    output: InterstateReferral
    side_effects:
      - "status DRAFT or TRANSMITTED -> REGISTERED; registered_at := current logical clock"
      - "controlling_order_id / controlling_order_state_code := winner of calculations.controlling_order_determination"
      - "case.interstate_role := RESPONDING for a RESPONDING referral"
      - "a foreign controlling order closes the CEJ gate on order entry and on modification proposed-order"
      - "increments SupportCase.version and InterstateReferral.version by 1"

  - method: POST
    path: "/child-support/interstate-referrals/{interstate_referral_id}/return"
    description: "Returns the transmittal unworked and drops the interstate posture."
    roles: [InterstateLiaison]
    code: 200
    input: [returned_reason]
    output: InterstateReferral
    side_effects:
      - "status -> RETURNED; controlling_order_id / controlling_order_state_code cleared"
      - "case.interstate_role := NONE when no other live referral remains, which reopens the CEJ gate"
      - "increments SupportCase.version and InterstateReferral.version by 1"

  # ---- CompromiseOffer ------------------------------------------------------
  - method: POST
    path: "/child-support/cases/{case_id}/compromise-offers"
    description: >
      Builds an arrears compromise offer. Waiver tier is keyed on the PRE-waiver
      total. Guarded by OCC on the parent case; a newer offer supersedes any
      PROPOSED predecessor.
    roles: [FinanceOfficer]
    code: 201
    input: [installment_count, expected_case_version]
    output: CompromiseOffer
    side_effects:
      - "increments SupportCase.version by 1"
      - "principal_due_snapshot_cents / interest_due_snapshot_cents (aggregate variant) / pre_waiver_total_cents / waiver_tier_pct / interest_waiver_cents / settlement_total_cents / monthly_installment_cents / final_installment_cents all computed"
      - "any PROPOSED offer already on the case becomes SUPERSEDED"

  - method: GET
    path: "/child-support/compromise-offers/{compromise_offer_id}"
    description: "Reads one compromise offer."
    roles: [CaseWorker, SupervisingAttorney, FinanceOfficer, ProgramAdmin, NoncustodialParty]
    code: 200
    output: CompromiseOffer
    side_effects: []

  - method: GET
    path: "/child-support/compromise-offers"
    description: "Lists compromise offers; case_id makes the FK reverse-reachable."
    roles: [CaseWorker, SupervisingAttorney, FinanceOfficer, ProgramAdmin]
    code: 200
    input: ["case_id?", "status?", "limit?", "offset?"]
    output: CompromiseOffer[]
    side_effects: []

  - method: POST
    path: "/child-support/compromise-offers/{compromise_offer_id}/acceptance"
    description: "Obligor accepts the offer, which stays enforcement and writes off the waived interest."
    roles: [NoncustodialParty]
    code: 200
    output: CompromiseOffer
    side_effects:
      - "status PROPOSED -> ACCEPTED; accepted_at := current logical clock; next_installment_due_date := accepted_at date + 1 month"
      - "case.interest_written_off_cents += interest_waiver_cents; case.enforcement_posture := STAYED"
      - "every ACTIVE and NOTICE_SENT EnforcementAction on the case is RELEASED with release_reason COMPROMISE_ACCEPTED and the participant remedy flags are reversed the same way the release endpoint reverses them (license_suspension_active := false with has_valid_drivers_license := true, lien_recorded := false, credit_bureau_reported := false)"
      - "increments CompromiseOffer.version, SupportCase.version and Participant.version by 1"

  - method: POST
    path: "/child-support/compromise-offers/{compromise_offer_id}/default-declaration"
    description: "Declares the plan in default, reinstating the waived interest."
    roles: [FinanceOfficer]
    code: 200
    output: CompromiseOffer
    side_effects:
      - "status ACCEPTED or ACTIVE -> DEFAULTED; defaulted_at := current logical clock"
      - "case.interest_written_off_cents -= interest_waiver_cents, so the reinstated amount reappears in interest_receivable_cents"
      - "installments already paid are NOT clawed back"
      - "case.enforcement_posture := ESCALATED, reopening enforcement eligibility"
      - "increments CompromiseOffer.version and SupportCase.version by 1"

# =============================================================================
# 1.6 ERROR CODE CATALOG — 67 codes
# =============================================================================
errors:

  # ---- auth / identity ------------------------------------------------------
  - id: ERR_MISSING_AUTH_HEADERS
    http: 401
    condition: "X-User-Role or X-User-ID absent or empty on any request"
  - id: ERR_INVALID_ROLE
    http: 401
    condition: "X-User-Role is not one of the eight declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the caller's role is not listed in the endpoint's roles"
  - id: ERR_NOT_CASE_PARTY
    http: 403
    condition: "a CustodialParty or NoncustodialParty caller's X-User-ID is not the corresponding party id on the target case"
  - id: ERR_NOT_IWO_EMPLOYER
    http: 403
    condition: "an EmployerAgent caller's X-User-ID is not the employer_id of the target IWO"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "deviation findings decided by order.drafted_by_user_id, or a contest review decided by action.proposed_by_user_id"

  # ---- existence ------------------------------------------------------------
  - id: ERR_CASE_NOT_FOUND
    http: 404
    condition: "{case_id} does not resolve to a SupportCase"
  - id: ERR_PARTICIPANT_NOT_FOUND
    http: 404
    condition: "{participant_id} does not resolve to a Participant"
  - id: ERR_ORDER_NOT_FOUND
    http: 404
    condition: "{order_id} does not resolve to a SupportOrder"
  - id: ERR_PATERNITY_ACTION_NOT_FOUND
    http: 404
    condition: "{paternity_action_id} does not resolve to a PaternityAction"
  - id: ERR_EMPLOYER_NOT_FOUND
    http: 404
    condition: "{employer_id} does not resolve to an Employer"
  - id: ERR_IWO_NOT_FOUND
    http: 404
    condition: "{iwo_id} does not resolve to an IncomeWithholdingOrder"
  - id: ERR_CHARGE_NOT_FOUND
    http: 404
    condition: "{charge_id} does not resolve to an ObligationCharge"
  - id: ERR_PAYMENT_NOT_FOUND
    http: 404
    condition: "{payment_id} does not resolve to a PaymentTransaction"
  - id: ERR_REVIEW_NOT_FOUND
    http: 404
    condition: "{modification_review_id} does not resolve to a ModificationReview"
  - id: ERR_ENFORCEMENT_ACTION_NOT_FOUND
    http: 404
    condition: "{enforcement_action_id} does not resolve to an EnforcementAction"
  - id: ERR_REFERRAL_NOT_FOUND
    http: 404
    condition: "{interstate_referral_id} does not resolve to an InterstateReferral"
  - id: ERR_OFFER_NOT_FOUND
    http: 404
    condition: "{compromise_offer_id} does not resolve to a CompromiseOffer"
  - id: ERR_REFERENCED_ENTITY_NOT_FOUND
    http: 404
    condition: "a foreign key supplied in the request body (party id, employer_id, iwo_id, compromise_offer_id, participant_id) does not resolve"

  # ---- payload schema -------------------------------------------------------
  - id: ERR_VALIDATION
    http: 422
    condition: "missing required field, unknown enum value, negative money amount, child_count outside 1..6, installment_count outside 3..36, genetic_probability_pct outside 0..100, malformed ISO date"

  # ---- concurrency (OCC) ----------------------------------------------------
  - id: ERR_STALE_ORDER_VERSION
    http: 412
    condition: "expected_order_version does not equal the parent SupportOrder's current version on IWO issuance"
  - id: ERR_STALE_CASE_VERSION
    http: 412
    condition: "expected_case_version does not equal the parent SupportCase's current version on compromise-offer creation"

  # ---- state preconditions --------------------------------------------------
  - id: ERR_INVALID_CASE_STATUS
    http: 409
    condition: "the case's case_status does not permit the requested operation (every write on a CLOSED case)"
  - id: ERR_INVALID_ORDER_STATUS
    http: 409
    condition: "the order's status does not permit the requested transition (calculating a SUPERSEDED order, entering a DRAFT, charging a VACATED order)"
  - id: ERR_INVALID_PATERNITY_STATUS
    http: 409
    condition: "the paternity action's status does not permit the requested transition (rescinding from PENDING, collecting a specimen from AOP_SIGNED, any write on a terminal action)"
  - id: ERR_INVALID_IWO_STATUS
    http: 409
    condition: "the IWO's service_status or remittance_status does not permit the requested transition (serving an already SERVED order, amending an ISSUED order, any write on a TERMINATED order)"
  - id: ERR_INVALID_REVIEW_STATUS
    http: 409
    condition: "the review's status does not permit the requested transition (supplying information while REQUESTED, proposing an order from THRESHOLD_NOT_MET)"
  - id: ERR_INVALID_ACTION_STATUS
    http: 409
    condition: "the enforcement action's status does not permit the requested transition (contesting a PROPOSED action, releasing a DENIED action)"
  - id: ERR_INVALID_REFERRAL_STATUS
    http: 409
    condition: "the referral's status does not permit the requested transition (transmitting a REGISTERED referral, any write on a RETURNED referral)"
  - id: ERR_INVALID_OFFER_STATUS
    http: 409
    condition: "the offer's status does not permit the requested transition (accepting a SUPERSEDED, DEFAULTED or COMPLETED offer)"

  # ---- business: safety / compliance ---------------------------------------
  - id: ERR_GOOD_CAUSE_BARS_DISCLOSURE
    http: 409
    condition: "a locate referral, enforcement notice or interstate transmittal is attempted on a case with good_cause_claim true"
  - id: ERR_PATERNITY_NOT_ESTABLISHED
    http: 409
    condition: "an order is drafted or calculated while the case's PaternityAction is not ESTABLISHED or NOT_REQUIRED"

  # ---- business: referential ------------------------------------------------
  - id: ERR_PARTY_ROLE_MISMATCH
    http: 422
    condition: "custodial_party_id / noncustodial_party_id point at participants with the wrong role_type, or the two ids are equal"
  - id: ERR_TANF_FLAG_MISMATCH
    http: 422
    condition: "tanf_assistance does not agree with case_type (PA_REFERRAL requires true, DIRECT_APPLICATION requires false)"
  - id: ERR_NCP_NOT_LOCATED
    http: 409
    condition: "the noncustodial party's locate_status is not LOCATED when an establishment step needs the party's whereabouts"
  - id: ERR_NO_CONTROLLING_ORDER_JURISDICTION
    http: 409
    condition: "the case is RESPONDING and the controlling order originates outside this state, so this state may not enter or modify an order"

  # ---- business: temporal ---------------------------------------------------
  - id: ERR_RESCISSION_WINDOW_CLOSED
    http: 409
    condition: "a rescission arrives strictly after action.rescission_deadline_at"
  - id: ERR_COLLECTION_APPOINTMENT_NOT_REACHED
    http: 409
    condition: "a specimen collection is recorded before collection_appointment_at, or an appointment is scheduled at or before the current clock"
  - id: ERR_CONTEST_WINDOW_OPEN
    http: 409
    condition: "an uncontested action is activated at or before contest_deadline_at"
  - id: ERR_CONTEST_WINDOW_CLOSED
    http: 409
    condition: "a contest arrives strictly after contest_deadline_at"
  - id: ERR_ORDER_INTERVAL_OVERLAP
    http: 409
    condition: "the entered order's closed effective interval overlaps another ENTERED order of the same order_type on the case"
  - id: ERR_CHARGE_PERIOD_OVERLAP
    http: 409
    condition: "the new charge's half-open period overlaps a non-VOID charge of the same charge_type on the same order"
  - id: ERR_REVIEW_NOT_YET_ELIGIBLE
    http: 409
    condition: "a PERIODIC_36_MONTH review is opened before the order's review_eligible_date"
  - id: ERR_MODIFICATION_EFFECTIVE_DATE_NOT_LATER
    http: 422
    condition: "the proposed successor order's effective_date is not strictly later than the reviewed order's effective_date"
  - id: ERR_REMITTANCE_NOT_YET_DUE
    http: 409
    condition: "a lapse is declared at or before iwo.next_remittance_due_at"
  - id: ERR_INSTALLMENT_NOT_YET_LATE
    http: 409
    condition: "a compromise default is declared at or before offer.next_installment_due_date"

  # ---- business: constraint -------------------------------------------------
  - id: ERR_LOCATE_ATTEMPTS_EXHAUSTED
    http: 409
    condition: "a locate referral is made after the noncustodial party's locate_attempt_count has reached 3"
  - id: ERR_RESCISSION_LIMIT
    http: 409
    condition: "a second rescission is attempted on the same paternity action"
  - id: ERR_SPECIMEN_REJECTION_LIMIT
    http: 409
    condition: "a third specimen is rejected on the same genetic test order"
  - id: ERR_DEVIATION_REJECTION_LIMIT
    http: 409
    condition: "a third deviation request on the same order is rejected"
  - id: ERR_INFO_REQUEST_LIMIT
    http: 409
    condition: "information is supplied after the review's info_request_count has passed 2"
  - id: ERR_DUPLICATE_PATERNITY_ACTION
    http: 409
    condition: "a second PaternityAction is created on a case that already has one"
  - id: ERR_DEVIATION_BELOW_MIN_PCT
    http: 422
    condition: "the requested deviation differs from the guideline amount by less than 10 percent"
  - id: ERR_ACTIVE_OFFER_EXISTS
    http: 409
    condition: "a compromise offer is created or accepted while another offer on the case is ACCEPTED or ACTIVE"
  - id: ERR_OFFER_SUPERSEDED
    http: 409
    condition: "an offer that a newer offer superseded is accepted"
  - id: ERR_ENFORCEMENT_STAYED
    http: 409
    condition: "an enforcement action is proposed, noticed or activated while case.enforcement_posture is STAYED"
  - id: ERR_ASSIGNED_ARREARS_NOT_COMPROMISABLE
    http: 409
    condition: "a compromise offer is created on a case with tanf_assistance true"
  - id: ERR_COMPROMISE_RISK_TOO_HIGH
    http: 409
    condition: "the obligor's compromise_risk_tier is HIGH when an offer is created"

  # ---- business: fiscal -----------------------------------------------------
  - id: ERR_AGGREGATE_WITHHOLDING_EXCEEDS_CAP
    http: 409
    condition: "the sum of withholding across the obligor's live IWOs would exceed floor(total reported disposable income * the most restrictive ccpa_cap_pct among them)"
  - id: ERR_WITHHOLDING_CAP_EXHAUSTED
    http: 409
    condition: "the CCPA cap minus the employer fee leaves no room, so withholding_amount_cents would be 0"
  - id: ERR_ARREARS_BELOW_ENFORCEMENT_THRESHOLD
    http: 409
    condition: "certified arrears do not clear the remedy's threshold, the two-month delinquency gate, or (for CONTEMPT_REFERRAL) the HIGH enforcement risk tier"
  - id: ERR_ARREARS_BELOW_COMPROMISE_MINIMUM
    http: 409
    condition: "arrears_principal_cents is below MIN_COMPROMISE_ARREARS_CENTS (100000)"
  - id: ERR_ARREARS_OUTSTANDING
    http: 409
    condition: "closure with reason ARREARS_SATISFIED while arrears principal or receivable interest remains"
  - id: ERR_CHARGE_PARTIALLY_PAID
    http: 409
    condition: "a charge with paid_cents > 0 is voided through the manual voidance endpoint"
  - id: ERR_IWO_DEFAULTED
    http: 409
    condition: "a remittance is posted against an IWO whose remittance_status is DEFAULTED"
  - id: ERR_PAYMENT_BELOW_INSTALLMENT
    http: 422
    condition: "a COMPROMISE_INSTALLMENT payment is smaller than the offer's monthly (or final) installment"
  - id: ERR_OFFER_SNAPSHOT_STALE
    http: 409
    condition: "arrears_principal_cents no longer equals the offer's principal_due_snapshot_cents at acceptance time"

# =============================================================================
# 1.7 RBAC MATRIX — segregation of duties over peer roles
# =============================================================================
roles:
  - name: CaseWorker
    description: "Front-line IV-D worker: intake, locate, paternity intake, order drafting, IWO administration, enforcement proposal."
    identity: opaque
    exclusive_operations:
      - "POST /child-support/participants"
      - "PATCH /child-support/participants/{participant_id}/income"
      - "POST /child-support/participants/{participant_id}/locate-results"
      - "POST /child-support/cases"
      - "POST /child-support/cases/{case_id}/locate-referrals"
      - "POST /child-support/cases/{case_id}/paternity-actions"
      - "POST /child-support/paternity-actions/{paternity_action_id}/acknowledgment"
      - "POST /child-support/paternity-actions/{paternity_action_id}/specimen-collection"
      - "POST /child-support/cases/{case_id}/orders"
      - "POST /child-support/orders/{order_id}/guideline-calculation"
      - "POST /child-support/orders/{order_id}/deviation-request"
      - "POST /child-support/orders/{order_id}/withholding-orders"
      - "POST /child-support/withholding-orders/{iwo_id}/service"
      - "POST /child-support/withholding-orders/{iwo_id}/amendment"
      - "POST /child-support/withholding-orders/{iwo_id}/termination"
      - "POST /child-support/orders/{order_id}/modification-reviews"
      - "POST /child-support/modification-reviews/{modification_review_id}/screening"
      - "POST /child-support/modification-reviews/{modification_review_id}/information"
      - "POST /child-support/cases/{case_id}/enforcement-actions"
      - "POST /child-support/enforcement-actions/{enforcement_action_id}/notice"
      - "POST /child-support/enforcement-actions/{enforcement_action_id}/activation"
    shared_operations:
      - "all GET endpoints except GET /child-support/employers/{employer_id} for EmployerAgent scoping"

  - name: SupervisingAttorney
    description: "Legal authority: genetic test orders and results, deviation findings, order entry and vacatur, contest review, closure, modification proposals."
    identity: opaque
    exclusive_operations:
      - "POST /child-support/paternity-actions/{paternity_action_id}/genetic-test-order"
      - "POST /child-support/paternity-actions/{paternity_action_id}/genetic-result"
      - "POST /child-support/orders/{order_id}/deviation-findings"
      - "POST /child-support/orders/{order_id}/entry"
      - "POST /child-support/orders/{order_id}/vacatur"
      - "POST /child-support/modification-reviews/{modification_review_id}/proposed-order"
      - "POST /child-support/enforcement-actions/{enforcement_action_id}/review-decision"
      - "POST /child-support/enforcement-actions/{enforcement_action_id}/release"
      - "POST /child-support/cases/{case_id}/closure"
    shared_operations:
      - "all GET endpoints"
    note: >
      may not decide findings on an order it drafted, nor review a contest on an
      action it proposed; the X-User-ID comparison is what enforces this, not the
      role, so a second SupervisingAttorney user is always required

  - name: FinanceOfficer
    description: "Ledger authority: charge posting and voidance, non-withholding collections, accrual runs, lapse declarations, compromise offers and defaults."
    identity: opaque
    exclusive_operations:
      - "POST /child-support/orders/{order_id}/charges"
      - "POST /child-support/charges/{charge_id}/voidance"
      - "POST /child-support/cases/{case_id}/payments"
      - "POST /child-support/cases/{case_id}/accrual-runs"
      - "POST /child-support/withholding-orders/{iwo_id}/lapse"
      - "POST /child-support/cases/{case_id}/compromise-offers"
      - "POST /child-support/compromise-offers/{compromise_offer_id}/default-declaration"
    shared_operations:
      - "all GET endpoints including GET /child-support/cases/{case_id}/ledger"

  - name: EmployerAgent
    description: "Payroll contact at an employer; may only see and remit on its own IWOs."
    identity: "entity_backed:Employer"
    exclusive_operations:
      - "POST /child-support/withholding-orders/{iwo_id}/remittances"
    shared_operations:
      - "GET /child-support/withholding-orders/{iwo_id} and GET /child-support/withholding-orders, both scoped to employer_id == X-User-ID"
      - "GET /child-support/employers/{employer_id} for its own row"

  - name: CustodialParty
    description: "Custodial parent; read-only visibility into the case, orders, charges and payments."
    identity: "entity_backed:Participant"
    exclusive_operations: []
    shared_operations:
      - "GET /child-support/cases/{case_id}, GET /child-support/orders/{order_id}, GET /child-support/charges/{charge_id}, GET /child-support/payments/{payment_id}, GET /child-support/paternity-actions/{paternity_action_id}, GET /child-support/modification-reviews/{modification_review_id}, GET /child-support/participants/{participant_id}"
    note: "every read is gated on X-User-ID == case.custodial_party_id"

  - name: NoncustodialParty
    description: "Obligor; consents and contests in person and reads its own case."
    identity: "entity_backed:Participant"
    exclusive_operations:
      - "POST /child-support/paternity-actions/{paternity_action_id}/rescission"
      - "POST /child-support/enforcement-actions/{enforcement_action_id}/contest"
      - "POST /child-support/compromise-offers/{compromise_offer_id}/acceptance"
    shared_operations:
      - "GET /child-support/cases/{case_id}, GET /child-support/orders/{order_id}, GET /child-support/withholding-orders/{iwo_id}, GET /child-support/charges/{charge_id}, GET /child-support/payments/{payment_id}, GET /child-support/enforcement-actions/{enforcement_action_id}, GET /child-support/compromise-offers/{compromise_offer_id}, GET /child-support/participants/{participant_id}"
    note: "every write and read is gated on X-User-ID == case.noncustodial_party_id"

  - name: InterstateLiaison
    description: "Central registry liaison owning every UIFSA transmittal on the case."
    identity: opaque
    exclusive_operations:
      - "POST /child-support/cases/{case_id}/interstate-referrals"
      - "POST /child-support/interstate-referrals/{interstate_referral_id}/transmittal"
      - "POST /child-support/interstate-referrals/{interstate_referral_id}/registration"
      - "POST /child-support/interstate-referrals/{interstate_referral_id}/return"
    shared_operations:
      - "GET /child-support/cases, GET /child-support/orders, GET /child-support/enforcement-actions, GET /child-support/interstate-referrals and their single-resource forms"

  - name: ProgramAdmin
    description: "System operator: employer registry and the logical clock."
    identity: opaque
    exclusive_operations:
      - "POST /child-support/employers"
      - "POST /child-support/_clock/set_current_utc"
    shared_operations:
      - "all GET endpoints"
    note: "no hierarchical override — ProgramAdmin cannot draft orders, post payments or decide findings"
