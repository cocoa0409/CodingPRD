# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for non-Difficulty-Rule claims
# Task 1919 Plastics Extrusion & Profile Plant.
# Sections and claim_type values follow references/claim-extraction-guide.md.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: customer_create_applies_defaults
        claim_type: creation_defaults
        grounds: ["entities.Customer.fields.status", "entities.Customer.fields.open_exposure_cents"]
        distinguishing_aspect: "A freshly created customer starts ACTIVE with zero exposure and version 1; system fields are server-minted."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /customers"
              payload: { name: "Acme", resin_index_basis: "MONTHLY_AVG", credit_limit_cents: 10000000 }
              as: PlantManager
              captures: { cust: $.data.id }
          assert:
            - "Customer.${cust}.status == ACTIVE"
            - "Customer.${cust}.open_exposure_cents == 0"
            - "Customer.${cust}.version == 1 and created_at is set"

      - name: profile_get_roundtrip
        claim_type: retrieval
        grounds: ["entities.Profile.fields.critical_dimensions"]
        distinguishing_aspect: "GET returns the stored control plan exactly as posted (nested critical_dimensions array preserved)."
        test_recipe:
          setup: ["Customer exists"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "Acme", resin_index_basis: "SHIPMENT_DATE", credit_limit_cents: 10000000 }
              as: PlantManager
              captures: { cust: $.data.id }
            - call: "POST /profiles"
              payload: { customer_id: "${cust}", profile_code: "P-RT", critical_dimensions: [{ name: "wall", nominal_mm: 2.0, tol_plus_mm: 0.1, tol_minus_mm: 0.1, ucl_mm: 2.05, lcl_mm: 1.95 }], spc_subgroup_size: 3, sample_every_m: 2000, resin_content_kg_per_m: 0.8, min_line_speed_mpm: 10, max_line_speed_mpm: 40 }
              as: ProcessEngineer
              captures: { prof: $.data.id }
          trigger:
            - { call: "GET /profiles/${prof}", payload: {}, as: ProcessEngineer }
          assert:
            - "Profile.${prof}.critical_dimensions[0].ucl_mm == 2.05 and spc_subgroup_size == 3"
            - "Profile.${prof}.customer_id == ${cust}"

      - name: die_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "GET with a well-formed but nonexistent id returns ERR_NOT_FOUND / 404."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /dies/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: PlantManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND with http 404"

      - name: virgin_lot_color_constraint_rejected
        claim_type: type_constraints
        grounds: ["validations[priority=15]", "entities.ResinLot.fields.color_family"]
        distinguishing_aspect: "A VIRGIN lot with color_family != NATURAL violates the entity constraint and returns ERR_BAD_REQUEST."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /resin-lots"
              payload: { lot_kind: "VIRGIN", resin_type: "PVC", color_family: "RED", received_kg: 100 }
              as: LineOperator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_BAD_REQUEST"

      - name: work_order_computed_input_ignored
        claim_type: computed_fields
        grounds: ["entities.WorkOrder.fields.pass_through_adj_cents_per_m", "entities.WorkOrder.fields.current_unit_price_cents_per_m"]
        distinguishing_aspect: "Client-supplied values for computed fields are accepted but ignored: the response carries server-computed 0 and base price, not the supplied 999."
        test_recipe:
          setup: ["Customer, profile, die, formulation exist; index point for the clock default month 2026-08 published"]
          setup_api_calls:
            - { call: "POST /resin-index-points", payload: { month: "2026-08", index_cents_per_kg: 140.0 }, as: PlantManager }
            - call: "POST /customers"
              payload: { name: "Acme", resin_index_basis: "MONTHLY_AVG", credit_limit_cents: 10000000 }
              as: PlantManager
              captures: { cust: $.data.id }
            - call: "POST /profiles"
              payload: { customer_id: "${cust}", profile_code: "P-100", critical_dimensions: [{ name: "wall", nominal_mm: 2.0, tol_plus_mm: 0.1, tol_minus_mm: 0.1, ucl_mm: 2.05, lcl_mm: 1.95 }], spc_subgroup_size: 3, sample_every_m: 2000, resin_content_kg_per_m: 0.8, min_line_speed_mpm: 10, max_line_speed_mpm: 40 }
              as: ProcessEngineer
              captures: { prof: $.data.id }
            - call: "POST /dies"
              payload: { profile_id: "${prof}", die_code: "D-A", tooling_cost_cents: 500000, committed_length_m: 10000, committed_weight_kg: 8000, amortization_mode: "PER_METER", buffer_hours: 4, min_screw_mm: 40, max_screw_mm: 90 }
              as: ProcessEngineer
              captures: { die: $.data.id }
            - call: "POST /formulations"
              payload: { profile_id: "${prof}", formula_code: "F-RED25", base_resin_type: "PVC", color_family: "RED", let_down_ratio: 25.0, max_regrind_pct: 20 }
              as: ProcessEngineer
              captures: { form: $.data.id }
          trigger:
            - call: "POST /work-orders"
              payload: { customer_id: "${cust}", profile_id: "${prof}", formulation_id: "${form}", die_id: "${die}", ordered_length_m: 5000, cut_length_mm: 2000, pieces_per_bundle: 25, base_unit_price_cents_per_m: 1000, pass_through_adj_cents_per_m: 999 }
              as: SalesEngineer
              captures: { wo: $.data.id }
          assert:
            - "WorkOrder.${wo}.pass_through_adj_cents_per_m == 0 (client-supplied 999 ignored)"
            - "WorkOrder.${wo}.current_unit_price_cents_per_m == 1000"
            - "WorkOrder.${wo}.quote_month == '2026-08' (default clock) and quote_index_cents_per_kg == 140.0"

      - name: work_orders_list_pagination
        claim_type: listing
        grounds: ["response_envelope", "endpoints"]
        distinguishing_aspect: "Filtered list honours limit/offset with total_count and has_more: 2 orders, limit=1 pages deterministically."
        test_recipe:
          setup: ["Customer with two work orders (index point 2026-08 published for the default clock)"]
          setup_api_calls:
            - { call: "POST /resin-index-points", payload: { month: "2026-08", index_cents_per_kg: 140.0 }, as: PlantManager }
            - call: "POST /customers"
              payload: { name: "Acme", resin_index_basis: "MONTHLY_AVG", credit_limit_cents: 10000000 }
              as: PlantManager
              captures: { cust: $.data.id }
            - call: "POST /profiles"
              payload: { customer_id: "${cust}", profile_code: "P-100", critical_dimensions: [{ name: "wall", nominal_mm: 2.0, tol_plus_mm: 0.1, tol_minus_mm: 0.1, ucl_mm: 2.05, lcl_mm: 1.95 }], spc_subgroup_size: 3, sample_every_m: 2000, resin_content_kg_per_m: 0.8, min_line_speed_mpm: 10, max_line_speed_mpm: 40 }
              as: ProcessEngineer
              captures: { prof: $.data.id }
            - call: "POST /dies"
              payload: { profile_id: "${prof}", die_code: "D-A", tooling_cost_cents: 500000, committed_length_m: 10000, committed_weight_kg: 8000, amortization_mode: "PER_METER", buffer_hours: 4, min_screw_mm: 40, max_screw_mm: 90 }
              as: ProcessEngineer
              captures: { die: $.data.id }
            - call: "POST /formulations"
              payload: { profile_id: "${prof}", formula_code: "F-RED25", base_resin_type: "PVC", color_family: "RED", let_down_ratio: 25.0, max_regrind_pct: 20 }
              as: ProcessEngineer
              captures: { form: $.data.id }
            - { call: "POST /work-orders", payload: { customer_id: "${cust}", profile_id: "${prof}", formulation_id: "${form}", die_id: "${die}", ordered_length_m: 5000, cut_length_mm: 2000, pieces_per_bundle: 25, base_unit_price_cents_per_m: 1000 }, as: SalesEngineer }
            - { call: "POST /work-orders", payload: { customer_id: "${cust}", profile_id: "${prof}", formulation_id: "${form}", die_id: "${die}", ordered_length_m: 3000, cut_length_mm: 2000, pieces_per_bundle: 25, base_unit_price_cents_per_m: 1000 }, as: SalesEngineer }
          trigger:
            - { call: "GET /work-orders", payload: { customer_id: "${cust}", limit: 1, offset: 0 }, as: SalesEngineer }
            - { call: "GET /work-orders", payload: { customer_id: "${cust}", limit: 1, offset: 1 }, as: SalesEngineer }
          assert:
            - "Page 1: total_count == 2, has_more == true, exactly 1 row"
            - "Page 2: has_more == false, exactly 1 row, and the two pages return different order ids"

  - section: state_machines
    instances:
      - name: die_retire_from_draft_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.Die", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "DRAFT is not a valid from-state for RETIRE (retirement requires IN_SERVICE or MAINTENANCE); rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Die in DRAFT (freshly created)"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "Acme", resin_index_basis: "MONTHLY_AVG", credit_limit_cents: 10000000 }
              as: PlantManager
              captures: { cust: $.data.id }
            - call: "POST /profiles"
              payload: { customer_id: "${cust}", profile_code: "P-100", critical_dimensions: [{ name: "wall", nominal_mm: 2.0, tol_plus_mm: 0.1, tol_minus_mm: 0.1, ucl_mm: 2.05, lcl_mm: 1.95 }], spc_subgroup_size: 3, sample_every_m: 2000, resin_content_kg_per_m: 0.8, min_line_speed_mpm: 10, max_line_speed_mpm: 40 }
              as: ProcessEngineer
              captures: { prof: $.data.id }
            - call: "POST /dies"
              payload: { profile_id: "${prof}", die_code: "D-A", tooling_cost_cents: 500000, committed_length_m: 10000, committed_weight_kg: 8000, amortization_mode: "PER_METER", buffer_hours: 4, min_screw_mm: 40, max_screw_mm: 90 }
              as: ProcessEngineer
              captures: { die: $.data.id }
          trigger:
            - call: "POST /dies/${die}/transition"
              payload: { to: "RETIRED" }
              as: ProcessEngineer
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"
            - "Die.${die}.status == DRAFT (unchanged)"

      - name: die_failed_trial_reverts
        claim_type: valid_transition
        grounds: ["state_machines.Die.TRIAL_to_DRAFT"]
        distinguishing_aspect: "The TRIAL -> DRAFT revert edge (revision loop) is accepted and leaves rates unpinned (null until QUALIFIED)."
        test_recipe:
          setup: ["Die in TRIAL"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "Acme", resin_index_basis: "MONTHLY_AVG", credit_limit_cents: 10000000 }
              as: PlantManager
              captures: { cust: $.data.id }
            - call: "POST /profiles"
              payload: { customer_id: "${cust}", profile_code: "P-100", critical_dimensions: [{ name: "wall", nominal_mm: 2.0, tol_plus_mm: 0.1, tol_minus_mm: 0.1, ucl_mm: 2.05, lcl_mm: 1.95 }], spc_subgroup_size: 3, sample_every_m: 2000, resin_content_kg_per_m: 0.8, min_line_speed_mpm: 10, max_line_speed_mpm: 40 }
              as: ProcessEngineer
              captures: { prof: $.data.id }
            - call: "POST /dies"
              payload: { profile_id: "${prof}", die_code: "D-A", tooling_cost_cents: 500000, committed_length_m: 10000, committed_weight_kg: 8000, amortization_mode: "PER_METER", buffer_hours: 4, min_screw_mm: 40, max_screw_mm: 90 }
              as: ProcessEngineer
              captures: { die: $.data.id }
            - { call: "POST /dies/${die}/transition", payload: { to: "TRIAL" }, as: ProcessEngineer }
          trigger:
            - { call: "POST /dies/${die}/transition", payload: { to: "DRAFT" }, as: ProcessEngineer }
          assert:
            - "Die.${die}.status == DRAFT after the failed trial"
            - "Die.${die}.amort_rate_cents_per_m is null (rates pinned only at QUALIFIED)"

      - name: resin_lot_terminal_qc_rejected
        claim_type: terminal_lockdown
        grounds: ["state_machines.ResinLot", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "QC_REJECTED is terminal: a later PASS attempt returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["Lot received then QC-failed"]
          setup_api_calls:
            - call: "POST /resin-lots"
              payload: { lot_kind: "VIRGIN", resin_type: "PVC", color_family: "NATURAL", received_kg: 100 }
              as: LineOperator
              captures: { lot: $.data.id }
            - { call: "POST /resin-lots/${lot}/qc", payload: { outcome: "FAIL" }, as: QualityInspector }
          trigger:
            - call: "POST /resin-lots/${lot}/qc"
              payload: { outcome: "PASS" }
              as: QualityInspector
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"
            - "ResinLot.${lot}.status == QC_REJECTED (unchanged)"

      - name: assignment_cancel_from_cancelled_rejected
        claim_type: idempotency
        grounds: ["state_machines.LineAssignment"]
        distinguishing_aspect: "Cancelling an already-CANCELLED assignment is a second identical trigger against a terminal state and returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["One SCHEDULED assignment already cancelled once"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PlantManager }
            - { call: "POST /resin-index-points", payload: { month: "2026-06", index_cents_per_kg: 100.0 }, as: PlantManager }
            - call: "POST /customers"
              payload: { name: "Acme", resin_index_basis: "MONTHLY_AVG", credit_limit_cents: 10000000 }
              as: PlantManager
              captures: { cust: $.data.id }
            - call: "POST /profiles"
              payload: { customer_id: "${cust}", profile_code: "P-100", critical_dimensions: [{ name: "wall", nominal_mm: 2.0, tol_plus_mm: 0.1, tol_minus_mm: 0.1, ucl_mm: 2.05, lcl_mm: 1.95 }], spc_subgroup_size: 3, sample_every_m: 2000, resin_content_kg_per_m: 0.8, min_line_speed_mpm: 10, max_line_speed_mpm: 40 }
              as: ProcessEngineer
              captures: { prof: $.data.id }
            - call: "POST /dies"
              payload: { profile_id: "${prof}", die_code: "D-A", tooling_cost_cents: 500000, committed_length_m: 10000, committed_weight_kg: 8000, amortization_mode: "PER_METER", buffer_hours: 4, min_screw_mm: 40, max_screw_mm: 90 }
              as: ProcessEngineer
              captures: { die: $.data.id }
            - call: "POST /lines"
              payload: { line_code: "L-1", screw_diameter_mm: 60 }
              as: ProcessEngineer
              captures: { line: $.data.id }
            - call: "POST /formulations"
              payload: { profile_id: "${prof}", formula_code: "F-RED25", base_resin_type: "PVC", color_family: "RED", let_down_ratio: 25.0, max_regrind_pct: 20 }
              as: ProcessEngineer
              captures: { form: $.data.id }
            - call: "POST /work-orders"
              payload: { customer_id: "${cust}", profile_id: "${prof}", formulation_id: "${form}", die_id: "${die}", ordered_length_m: 5000, cut_length_mm: 2000, pieces_per_bundle: 25, base_unit_price_cents_per_m: 1000 }
              as: SalesEngineer
              captures: { wo: $.data.id }
            - { call: "POST /work-orders/${wo}/confirm", payload: {}, as: SalesEngineer }
            - call: "POST /line-assignments"
              payload: { work_order_id: "${wo}", die_id: "${die}", line_id: "${line}", planned_start: "2026-08-10T10:00:00Z", planned_end: "2026-08-10T12:00:00Z" }
              as: ProcessEngineer
              captures: { asg: $.data.id }
            - { call: "POST /line-assignments/${asg}/cancel", payload: {}, as: ProcessEngineer }
          trigger:
            - call: "POST /line-assignments/${asg}/cancel"
              payload: {}
              as: ProcessEngineer
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"
            - "WorkOrder.${wo}.status == CONFIRMED (reverted after the first cancel; unchanged by the second)"

      - name: run_hold_release_cycle_valid
        claim_type: valid_transition
        grounds:
          - state_machines.ProductionRun.RUNNING_to_HOLD
          - state_machines.ProductionRun.HOLD_to_RUNNING
          - state_machines.ExtrusionLine.DOWN_to_RUNNING
        distinguishing_aspect: "The cyclic RUNNING -> HOLD -> RUNNING pair works end to end: manual hold downs the line, release by a DIFFERENT inspector (SoD satisfied) returns both to RUNNING."
        test_recipe:
          setup:
            - "Run RUNNING on an activated assignment"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PlantManager }
            - { call: "POST /resin-index-points", payload: { month: "2026-06", index_cents_per_kg: 100.0 }, as: PlantManager }
            - call: "POST /customers"
              payload: { name: "Acme", resin_index_basis: "MONTHLY_AVG", credit_limit_cents: 10000000 }
              as: PlantManager
              captures: { cust: $.data.id }
            - call: "POST /profiles"
              payload: { customer_id: "${cust}", profile_code: "P-100", critical_dimensions: [{ name: "wall", nominal_mm: 2.0, tol_plus_mm: 0.1, tol_minus_mm: 0.1, ucl_mm: 2.05, lcl_mm: 1.95 }], spc_subgroup_size: 3, sample_every_m: 2000, resin_content_kg_per_m: 0.8, min_line_speed_mpm: 10, max_line_speed_mpm: 40 }
              as: ProcessEngineer
              captures: { prof: $.data.id }
            - call: "POST /dies"
              payload: { profile_id: "${prof}", die_code: "D-A", tooling_cost_cents: 500000, committed_length_m: 10000, committed_weight_kg: 8000, amortization_mode: "PER_METER", buffer_hours: 4, min_screw_mm: 40, max_screw_mm: 90 }
              as: ProcessEngineer
              captures: { die: $.data.id }
            - { call: "POST /dies/${die}/transition", payload: { to: "TRIAL" }, as: ProcessEngineer }
            - { call: "POST /dies/${die}/transition", payload: { to: "QUALIFIED" }, as: ProcessEngineer }
            - call: "POST /lines"
              payload: { line_code: "L-1", screw_diameter_mm: 60 }
              as: ProcessEngineer
              captures: { line: $.data.id }
            - call: "POST /resin-lots"
              payload: { lot_kind: "VIRGIN", resin_type: "PVC", color_family: "NATURAL", received_kg: 3000, supplier_lot_ref: "SUP-V1" }
              as: LineOperator
              captures: { lot_v: $.data.id }
            - { call: "POST /resin-lots/${lot_v}/qc", payload: { outcome: "PASS" }, as: QualityInspector }
            - call: "POST /resin-lots"
              payload: { lot_kind: "COLORANT", resin_type: "PVC", color_family: "RED", received_kg: 100, supplier_lot_ref: "SUP-C1" }
              as: LineOperator
              captures: { lot_c: $.data.id }
            - { call: "POST /resin-lots/${lot_c}/qc", payload: { outcome: "PASS" }, as: QualityInspector }
            - call: "POST /formulations"
              payload: { profile_id: "${prof}", formula_code: "F-RED25", base_resin_type: "PVC", color_family: "RED", let_down_ratio: 25.0, max_regrind_pct: 20 }
              as: ProcessEngineer
              captures: { form: $.data.id }
            - call: "POST /blend-batches"
              payload: { formulation_id: "${form}", virgin_lot_id: "${lot_v}", colorant_lot_id: "${lot_c}", target_batch_kg: 1000 }
              as: LineOperator
              captures: { batch: $.data.id }
            - { call: "POST /blend-batches/${batch}/qc", payload: { action: "RELEASE" }, as: QualityInspector }
            - call: "POST /work-orders"
              payload: { customer_id: "${cust}", profile_id: "${prof}", formulation_id: "${form}", die_id: "${die}", ordered_length_m: 5000, cut_length_mm: 2000, pieces_per_bundle: 25, base_unit_price_cents_per_m: 1000 }
              as: SalesEngineer
              captures: { wo: $.data.id }
            - { call: "POST /work-orders/${wo}/confirm", payload: {}, as: SalesEngineer }
            - call: "POST /line-assignments"
              payload: { work_order_id: "${wo}", die_id: "${die}", line_id: "${line}", planned_start: "2026-08-10T10:00:00Z", planned_end: "2026-08-10T12:00:00Z" }
              as: ProcessEngineer
              captures: { asg: $.data.id }
            - { call: "POST /line-assignments/${asg}/activate", payload: {}, as: ProcessEngineer }
            - call: "POST /runs"
              payload: { assignment_id: "${asg}", batch_id: "${batch}", line_speed_mpm: 25 }
              as: LineOperator
              captures: { run: $.data.id }
          trigger:
            - { call: "POST /runs/${run}/hold-status", payload: { action: "HOLD" }, as: QualityInspector, as_user_id: "insp-1" }
            - { call: "POST /runs/${run}/hold-status", payload: { action: "RELEASE" }, as: QualityInspector, as_user_id: "insp-2" }
          assert:
            - "After HOLD: ProductionRun.${run}.status == HOLD, hold_origin == MANUAL, held_by_user_id == 'insp-1'"
            - "After HOLD: ExtrusionLine.${line}.status == DOWN"
            - "After RELEASE by insp-2: ProductionRun.${run}.status == RUNNING and hold_origin is null"
            - "After RELEASE: ExtrusionLine.${line}.status == RUNNING"

      - name: work_order_cancel_with_running_run_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.WorkOrder.IN_PRODUCTION_to_CANCELLED
          - "validations[priority=11]"
          - "errors[ERR_RUN_IN_PROGRESS]"
        distinguishing_aspect: "Cancelling an IN_PRODUCTION order whose run is RUNNING returns ERR_RUN_IN_PROGRESS (not generic ERR_INVALID_STATE) and leaves everything unchanged."
        test_recipe:
          setup:
            - "Order IN_PRODUCTION with run RUNNING"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PlantManager }
            - { call: "POST /resin-index-points", payload: { month: "2026-06", index_cents_per_kg: 100.0 }, as: PlantManager }
            - call: "POST /customers"
              payload: { name: "Acme", resin_index_basis: "MONTHLY_AVG", credit_limit_cents: 10000000 }
              as: PlantManager
              captures: { cust: $.data.id }
            - call: "POST /profiles"
              payload: { customer_id: "${cust}", profile_code: "P-100", critical_dimensions: [{ name: "wall", nominal_mm: 2.0, tol_plus_mm: 0.1, tol_minus_mm: 0.1, ucl_mm: 2.05, lcl_mm: 1.95 }], spc_subgroup_size: 3, sample_every_m: 2000, resin_content_kg_per_m: 0.8, min_line_speed_mpm: 10, max_line_speed_mpm: 40 }
              as: ProcessEngineer
              captures: { prof: $.data.id }
            - call: "POST /dies"
              payload: { profile_id: "${prof}", die_code: "D-A", tooling_cost_cents: 500000, committed_length_m: 10000, committed_weight_kg: 8000, amortization_mode: "PER_METER", buffer_hours: 4, min_screw_mm: 40, max_screw_mm: 90 }
              as: ProcessEngineer
              captures: { die: $.data.id }
            - { call: "POST /dies/${die}/transition", payload: { to: "TRIAL" }, as: ProcessEngineer }
            - { call: "POST /dies/${die}/transition", payload: { to: "QUALIFIED" }, as: ProcessEngineer }
            - call: "POST /lines"
              payload: { line_code: "L-1", screw_diameter_mm: 60 }
              as: ProcessEngineer
              captures: { line: $.data.id }
            - call: "POST /resin-lots"
