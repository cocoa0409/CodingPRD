            - call: "GET /loyalty/elite-benefit-deliveries"
              payload: { stay_id: "${sC_id}" }
              as: HotelOwner
              as_user_id: "${h_id}"
              captures: { dC_id: "$.data[0].id" }
          trigger:
            - call: "POST /loyalty/elite-benefit-deliveries/${dB_id}/deliver"
              payload: {}
              as: HotelOwner
              as_user_id: "${h_id}"
              captures: { dB_status: $.data.status, dB_recovery: $.data.cost_recovery_cents }
            - call: "POST /loyalty/elite-benefit-deliveries/${dB_id}/deliver"
              payload: {}
              as: HotelOwner
              as_user_id: "${h_id}"
              captures: { e_twice: $.data.error_id }
            - call: "POST /loyalty/elite-benefit-deliveries/${dB_id}/deny"
              payload: { denial_reason: "Changed our minds after the fact." }
              as: HotelOwner
              as_user_id: "${h_id}"
              captures: { e_deny: $.data.error_id }
            - call: "POST /loyalty/stays/${sC_id}/void"
              payload: { void_reason: "Charge reversed by the acquirer." }
              as: ProgramAdministrator
              captures: { sC_status: $.data.status }
            - call: "POST /loyalty/elite-benefit-deliveries/${dC_id}/deliver"
              payload: {}
              as: HotelOwner
              as_user_id: "${h_id}"
              captures: { e_masked: $.data.error_id }
          assert:
            - "${dB_status} == DELIVERED and ${dB_recovery} == 4500 - min(round_half_up(30000 * 0.15), 9000)"
            - "${e_twice} == ERR_DELIVERY_INVALID_STATE with http 409 - DELIVERED is terminal, and a repeat is refused rather than treated as idempotent"
            - "${e_deny} == ERR_DELIVERY_INVALID_STATE with http 409 - only OBLIGATED admits either verb"
            - "${sC_status} == VOID and EliteBenefitDelivery.${dC_id}.status == WAIVED"
            - "${e_masked} == ERR_STAY_INVALID_STATE with http 409 - priority 41 outranks 42, so the voided stay answers before the waived delivery does"
            - "EliteBenefitDelivery.${dB_id} is still DELIVERED with cost_recovery_cents 4500 and denial_reason null, and Hotel.${h_id}.benefit_denial_count == 0"

      - name: paying_a_batch_the_fund_cannot_cover_is_refused_until_cash_exactly_matches
        claim_type: triggerable
        grounds:
          - errors.ERR_FUND_INSUFFICIENT_CASH
          - validations.priority_82_ERR_FUND_INSUFFICIENT_CASH
          - calculations.batch_net_payable
          - calculations.fund_cash_conservation
        distinguishing_aspect: |
          The program fund is a real cash constraint, not bookkeeping: a compression-market property
          earns a 160000-cent reimbursement while the only cash ever collected is the 47500 cents the
          member paid for the points, so the disbursement is refused at 402 with the batch left
          APPROVED. Two further settlements bring cash to exactly 160000 and the same payment then
          succeeds, because the rule compares with >= and drains the fund to precisely zero.
        test_recipe:
          setup:
            - "Logical clock at its 2026-08-01T00:00:00Z default."
            - "One ACTIVE compression-market property: trailing_12m_occupancy_pct 0.96, trailing_12m_adr_cents 80000, no posted revenue stays, so its fee ledger is 0."
            - "One member funds 40000 points, books a 2-night June award, and the stay is completed so the reimbursement is ACCRUED."
          setup_api_calls:
            - call: "POST /loyalty/hotels"
              payload: { name: "Cashfloor Resort", brand_code: "CFR", market_tier: "RESORT", program_fee_pct: 0.05, rooms_count: 120, trailing_12m_occupancy_pct: 0.96, trailing_12m_adr_cents: 80000 }
              as: ProgramAdministrator
              captures: { h_id: $.data.id }
            - call: "POST /loyalty/hotels/${h_id}/rate-plans"
              payload: { rate_code: "BAR", rate_category: "TRANSIENT" }
              as: ProgramAdministrator
              captures: { rp_id: $.data.id }
            - call: "POST /loyalty/hotels/${h_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /loyalty/hotels/${h_id}/redemption-pricing"
              payload: { season: "STANDARD", window_start_date: "2026-06-01", window_end_date: "2026-06-30", points_per_night: 20000, cash_copay_cents: 0, min_tier_required: "BASE", award_allotment_per_night: 2 }
              as: ProgramAdministrator
              captures: { pr_id: $.data.id }
            - call: "POST /loyalty/members"
              payload: { email: "cf1@example.com", full_name: "Selma Vidal", enrollment_date: "2026-01-25" }
              as: ProgramAdministrator
              captures: { m_id: $.data.id }
            - call: "POST /loyalty/point-purchases"
              payload: { member_id: "${m_id}", channel: "DIRECT_PURCHASE", points_quantity: 40000 }
              as: ProgramAdministrator
              captures: { pp1_id: $.data.id, pp1_cash: $.data.cash_due_cents }
            - call: "POST /loyalty/point-purchases/${pp1_id}/settle"
              payload: {}
              as: ProgramAdministrator
            - call: "GET /loyalty/hotels/${h_id}"
              payload: {}
              as: ProgramAdministrator
              captures: { h_v: $.data.version }
            - call: "POST /loyalty/redemptions"
              payload: { member_id: "${m_id}", hotel_id: "${h_id}", checkin_date: "2026-06-05", checkout_date: "2026-06-07", expected_hotel_version: "${h_v}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { r_id: $.data.id, r_charged: $.data.points_charged }
            - call: "POST /loyalty/redemptions/${r_id}/confirm"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /loyalty/redemptions/${r_id}/complete-stay"
              payload: {}
              as: ProgramAdministrator
              captures: { r_fulfil: $.data.fulfillment_status, r_reimb: $.data.reimbursement_status, r_estimated: $.data.estimated_reimbursement_cents }
          trigger:
            - call: "POST /loyalty/reimbursement-batches"
              payload: { hotel_id: "${h_id}", period_month: "2026-06" }
              as: ProgramAdministrator
              captures: { b_id: $.data.id, b_status0: $.data.status }
            - call: "POST /loyalty/reimbursement-batches/${b_id}/release"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "op-release-cf"
              captures: { b_gross: $.data.gross_reimbursement_cents, b_offset: $.data.fee_offset_base_cents, b_sur: $.data.delinquency_surcharge_cents, b_net: $.data.net_payable_cents, b_items: $.data.item_count }
            - call: "POST /loyalty/reimbursement-batches/${b_id}/approve"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "op-approve-cf"
              captures: { b_status1: $.data.status }
            - call: "POST /loyalty/reimbursement-batches/${b_id}/pay"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "op-pay-cf"
              captures: { e_cash: $.data.error_id }
            - call: "POST /loyalty/point-purchases"
              payload: { member_id: "${m_id}", channel: "DIRECT_PURCHASE", points_quantity: 100000 }
              as: ProgramAdministrator
              captures: { pp2_id: $.data.id, pp2_cash: $.data.cash_due_cents }
            - call: "POST /loyalty/point-purchases/${pp2_id}/settle"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /loyalty/point-purchases"
              payload: { member_id: "${m_id}", channel: "DIRECT_PURCHASE", points_quantity: 2000 }
              as: ProgramAdministrator
              captures: { pp3_id: $.data.id, pp3_cash: $.data.cash_due_cents }
            - call: "POST /loyalty/point-purchases/${pp3_id}/settle"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /loyalty/reimbursement-batches/${b_id}/pay"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "op-pay-cf"
              captures: { b_status2: $.data.status, b_paid_net: $.data.net_payable_cents }
          assert:
            - "${pp1_cash} == 47500 - round_half_up(40 lots * 1250 * 0.95) at the 25000-point volume tier - and ${r_charged} == 40000"
            - "${r_fulfil} == STAYED, ${r_reimb} == ACCRUED and ${r_estimated} == 160000 - occupancy 0.96 is at or above the 0.95 compression threshold, so the rate per night is the full 80000 ADR"
            - "${b_status0} == OPEN, ${b_items} == 1, ${b_gross} == 160000, ${b_offset} == 0, ${b_sur} == 0 and ${b_net} == 160000 - an empty fee ledger yields a zero surcharge whichever tier is picked"
            - "${b_status1} == APPROVED and ${e_cash} == ERR_FUND_INSUFFICIENT_CASH with http 402 - the fund held only 47500 cents"
            - "the batch is still APPROVED after the refusal and GET /loyalty/program-fund still reports cash_balance_cents 47500 - a refused disbursement moves no money"
            - "${pp2_cash} == 110000 - round_half_up(100 lots * 1250 * 0.88) at the 100000-point volume tier - and ${pp3_cash} == 2500, bringing fund cash to exactly 160000"
            - "${b_status2} == PAID and ${b_paid_net} == 160000 - the comparison is >=, so cash equal to the disbursement is enough"
            - "GET /loyalty/program-fund reports cash_balance_cents == 0 afterwards, and Redemption.${r_id}.reimbursement_status == PAID"

      - name: every_refusal_class_returns_the_same_two_field_error_envelope
        claim_type: triggerable
        grounds:
          - response_envelope.error
          - errors.ERR_INVALID_REQUEST
          - errors.ERR_MEMBER_NOT_FOUND
          - errors.ERR_HOTEL_NOT_ACTIVE
          - errors.ERR_INVALID_DATE_RANGE
          - errors.ERR_FUND_IMPAIRED
        distinguishing_aspect: |
          Five different status classes - 400, 402, 404, 409 and 422 - all answer with the identical
          envelope: response_type "error" and a data object holding exactly error_id and message,
          with the same meta block a success carries. No refusal leaks a field list, a stack trace or
          a partial entity, and none of them writes anything.
        test_recipe:
          setup:
            - "One ACTIVE property with a TRANSIENT rate plan; one member whose 10-night posted stay leaves 10000 points outstanding against zero program cash, so the fund is IMPAIRED."
          setup_api_calls:
            - call: "POST /loyalty/hotels"
              payload: { name: "Envelope Arms", brand_code: "EVA", market_tier: "SELECT", program_fee_pct: 0.05, rooms_count: 60, trailing_12m_occupancy_pct: 0.70, trailing_12m_adr_cents: 12000 }
              as: ProgramAdministrator
              captures: { h_id: $.data.id }
            - call: "POST /loyalty/hotels/${h_id}/rate-plans"
              payload: { rate_code: "BAR", rate_category: "TRANSIENT" }
              as: ProgramAdministrator
              captures: { rp_id: $.data.id }
            - call: "POST /loyalty/hotels/${h_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /loyalty/members"
              payload: { email: "ev1@example.com", full_name: "Odile Bertrand", enrollment_date: "2026-01-27" }
              as: ProgramAdministrator
              captures: { m_id: $.data.id }
            - call: "POST /loyalty/stays"
              payload: { member_id: "${m_id}", hotel_id: "${h_id}", rate_plan_id: "${rp_id}", checkin_date: "2026-04-01", checkout_date: "2026-04-11", room_revenue_cents: 100000 }
              as: ProgramAdministrator
              captures: { s_id: $.data.id }
            - call: "POST /loyalty/stays/${s_id}/post"
              payload: {}
              as: ProgramAdministrator
            - call: "GET /loyalty/program-fund"
              payload: {}
              as: ProgramAuditor
              as_user_id: "aud-ev-01"
              captures: { f_status: $.data.status, f_liab: $.data.point_liability_cents, f_ratio: $.data.solvency_ratio }
            - call: "GET /loyalty/members/${m_id}"
              payload: {}
              as: ProgramAdministrator
              captures: { m_v: $.data.version }
          trigger:
            - call: "POST /loyalty/hotels"
              payload: { name: "No Tier Hotel", brand_code: "NTH", program_fee_pct: 0.05, rooms_count: 10, trailing_12m_occupancy_pct: 0.5, trailing_12m_adr_cents: 9000 }
              as: ProgramAdministrator
              captures: { e_400: $.data.error_id, m_400: $.data.message }
            - call: "GET /loyalty/members/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProgramAdministrator
              captures: { e_404: $.data.error_id, m_404: $.data.message }
            - call: "POST /loyalty/hotels/${h_id}/activate"
              payload: {}
              as: ProgramAdministrator
              captures: { e_409: $.data.error_id, m_409: $.data.message }
            - call: "POST /loyalty/stays"
              payload: { member_id: "${m_id}", hotel_id: "${h_id}", rate_plan_id: "${rp_id}", checkin_date: "2026-05-10", checkout_date: "2026-05-04", room_revenue_cents: 40000 }
              as: ProgramAdministrator
              captures: { e_422: $.data.error_id, m_422: $.data.message }
            - call: "POST /loyalty/point-adjustments"
              payload: { member_id: "${m_id}", points: 500, adjustment_reason: "Gesture of goodwill.", expected_member_version: "${m_v}" }
              as: ProgramAdministrator
              captures: { e_402: $.data.error_id, m_402: $.data.message }
          assert:
            - "${f_liab} == 4800 - round_half_up(10000 * 0.8 * 0.6) - with ${f_ratio} == 0.0 and ${f_status} == IMPAIRED, since cash is still zero"
            - "${e_400} == ERR_INVALID_REQUEST (400), ${e_404} == ERR_MEMBER_NOT_FOUND (404), ${e_409} == ERR_HOTEL_NOT_ACTIVE (409), ${e_422} == ERR_INVALID_DATE_RANGE (422) and ${e_402} == ERR_FUND_IMPAIRED (402)"
            - "each of the five responses has response_type == error and a data object whose keys are exactly error_id and message"
            - "${m_400}, ${m_404}, ${m_409}, ${m_422} and ${m_402} are all non-empty human-readable strings and none of them contains a stack trace, a SQL fragment or an internal field path"
            - "no data envelope in the five refusals carries an id, a version or any entity field"
            - "afterwards GET /loyalty/hotels returns total_count == 1, GET /loyalty/stays returns total_count == 1 and Member.${m_id}.point_balance == 10000 - nothing was written"

      - name: blackout_and_tier_minimum_award_refusals
        excluded_because:
          difficulty_instance: blackout_date_masks_tier_below_inventory_minimum_at_equal_http_status
          rationale: |
            ERR_BLACKOUT_DATE_UNAVAILABLE and ERR_TIER_BELOW_INVENTORY_MINIMUM are both triggered in
            §1.8, which additionally proves the priority-60-over-71 masking at an identical http
            status and then unmasks the tier rule by revoking the window. A corner instance could
            only re-issue the same two calls, so their triggerability is claimed there.
      - name: empty_batch_period_refusal
        excluded_because:
          difficulty_instance: checkout_on_the_first_of_the_next_month_leaves_the_september_batch_empty
          rationale: |
            ERR_BATCH_NO_ELIGIBLE_ITEMS is triggered in §1.8 by the calendar-boundary case, where a
            checkout at midnight on the first of the next month drops the only candidate out of the
            September selection. That is strictly stronger than a batch released against a property
            with no redemptions at all, so no separate corner recipe is added.
      - name: peak_award_refusals_from_delinquency_and_impairment
        excluded_because:
          difficulty_instance: peak_award_inventory_withheld_from_a_delinquent_property_while_standard_still_books
          rationale: |
            ERR_PEAK_INVENTORY_WITHHELD, ERR_FUND_IMPAIRED and ERR_FUND_IMPAIRED_PEAK_BLOCKED are all
            triggered in that §1.8 instance, which also shows the two peak blocks are independent -
            one is a property posture, the other a program-wide solvency posture - while a STANDARD
            booking at the same property still succeeds. Repeating any single leg here would add no
            distinguishing coverage.
      - name: blackout_window_buffer_refusal
        excluded_because:
          difficulty_instance: blackout_windows_need_seven_clear_days_so_a_six_day_gap_is_refused
          rationale: |
            ERR_BLACKOUT_WINDOW_BUFFER_CONFLICT is triggered in §1.8 at exactly the interesting
            boundary - six clear days refused, seven accepted - which is where every off-by-one lives.
            A corner instance would have to pick one of those two gaps and would be a strict subset.
      - name: member_overlap_and_award_inventory_refusals
        excluded_because:
          difficulty_instance: member_award_stays_may_touch_at_the_checkout_date_but_not_share_a_night
          rationale: |
            ERR_MEMBER_REDEMPTION_OVERLAP and ERR_AWARD_INVENTORY_UNAVAILABLE are both triggered in
            §1.8: the half-open night interval is probed at the touching checkout date and one night
            deeper, and the allotment is exhausted on the shared night. ERR_AWARD_INVENTORY_UNAVAILABLE
            is triggered a second time in award_cancellation_restores_member_points_and_releases_the_last_award_room,
            so its release path is covered too.

  # ===========================================================================
  - section: rbac
    instances:
      - name: program_administrator_exclusives_are_refused_to_every_other_role
        claim_type: exclusive_operations
        grounds:
          - roles.ProgramAdministrator.exclusive_operations
          - roles.ProgramAuditor.note
          - validations.priority_2_ERR_UNAUTHORIZED
        distinguishing_aspect: |
          The four other roles are each turned away from a different administrator exclusive - the
          property owner from creating properties, activating its own and pricing awards, the care
          agent from settling a purchase, the auditor from creating a partner and enrolling a member -
          and the same calls then succeed for the administrator. The owner's refusal on its own
          property is the sharp one: the role check at priority 2 fires before the ownership check at
          priority 3, so being the rightful owner does not help.
        test_recipe:
          setup:
            - "One ONBOARDING property with one rate plan, and one member holding a PENDING purchase."
          setup_api_calls:
            - call: "POST /loyalty/hotels"
              payload: { name: "Exclusive Arms", brand_code: "EXA", market_tier: "URBAN", program_fee_pct: 0.05, rooms_count: 90, trailing_12m_occupancy_pct: 0.80, trailing_12m_adr_cents: 25000 }
              as: ProgramAdministrator
              captures: { h_id: $.data.id, h_status0: $.data.status }
            - call: "POST /loyalty/hotels/${h_id}/rate-plans"
              payload: { rate_code: "BAR", rate_category: "TRANSIENT" }
              as: ProgramAdministrator
              captures: { rp_id: $.data.id }
            - call: "POST /loyalty/members"
              payload: { email: "ex1@example.com", full_name: "Dario Conti", enrollment_date: "2026-02-03" }
              as: ProgramAdministrator
              captures: { m_id: $.data.id }
            - call: "POST /loyalty/point-purchases"
              payload: { member_id: "${m_id}", channel: "DIRECT_PURCHASE", points_quantity: 20000 }
              as: ProgramAdministrator
              captures: { pp_id: $.data.id, pp_status0: $.data.status }
          trigger:
            - call: "POST /loyalty/hotels"
              payload: { name: "Owner's Own Brand", brand_code: "OOB", market_tier: "SELECT", program_fee_pct: 0.05, rooms_count: 20, trailing_12m_occupancy_pct: 0.5, trailing_12m_adr_cents: 9000 }
              as: HotelOwner
              as_user_id: "${h_id}"
              captures: { e_create: $.data.error_id }
            - call: "POST /loyalty/hotels/${h_id}/activate"
              payload: {}
              as: HotelOwner
              as_user_id: "${h_id}"
              captures: { e_activate: $.data.error_id }
            - call: "POST /loyalty/hotels/${h_id}/redemption-pricing"
              payload: { season: "STANDARD", window_start_date: "2026-09-01", window_end_date: "2026-09-30", points_per_night: 15000, cash_copay_cents: 0, min_tier_required: "BASE", award_allotment_per_night: 5 }
              as: HotelOwner
              as_user_id: "${h_id}"
              captures: { e_pricing: $.data.error_id }
            - call: "POST /loyalty/point-purchases/${pp_id}/settle"
              payload: {}
              as: MemberCareAgent
              as_user_id: "care-ex-01"
              captures: { e_settle: $.data.error_id }
            - call: "POST /loyalty/partners"
              payload: { name: "Auditor's Airline", partner_type: "AIRLINE", points_cost_per_1000_cents: 900, monthly_cap_points: 100000 }
              as: ProgramAuditor
              as_user_id: "aud-ex-01"
              captures: { e_partner: $.data.error_id }
            - call: "POST /loyalty/members"
              payload: { email: "ex2@example.com", full_name: "Auditor Enrollee" }
              as: ProgramAuditor
              as_user_id: "aud-ex-01"
              captures: { e_enroll: $.data.error_id }
            - call: "POST /loyalty/hotels/${h_id}/activate"
              payload: {}
              as: ProgramAdministrator
              captures: { h_status1: $.data.status }
            - call: "POST /loyalty/point-purchases/${pp_id}/settle"
              payload: {}
              as: ProgramAdministrator
              captures: { pp_status1: $.data.status }
          assert:
            - "${e_create} == ${e_activate} == ${e_pricing} == ${e_settle} == ${e_partner} == ${e_enroll} == ERR_UNAUTHORIZED with http 403"
            - "${e_activate} is ERR_UNAUTHORIZED and not ERR_FORBIDDEN_RESOURCE_OWNER - priority 2 precedes priority 3, and the owner was acting on its own property"
            - "${h_status0} == ONBOARDING before the refusals and ${h_status1} == ACTIVE only once the administrator asked"
            - "${pp_status0} == PENDING and ${pp_status1} == SETTLED - settlement is the administrator's alone even though the care agent may create the purchase"
            - "GET /loyalty/hotels returns total_count == 1 and GET /loyalty/partners returns total_count == 0 - no refused write left a row behind"
            - "a HotelOwner calling GET /loyalty/hotels (the unscoped list) also receives ERR_UNAUTHORIZED, since that endpoint lists only ProgramAdministrator and ProgramAuditor"

      - name: care_agents_request_info_is_refused_even_to_the_administrator
        claim_type: exclusive_operations
        grounds:
          - roles.MemberCareAgent.exclusive_operations
          - roles.ProgramAdministrator.exclusive_operations
          - validations.priority_2_ERR_UNAUTHORIZED
        distinguishing_aspect: |
          The care queue and the adjudication bench are mutually exclusive: the administrator shares
          review and resolve but may not ask the member for more information, and the care agent runs
          the whole complaint up to escalation but may not adjudicate. Both refusals are 403 while
          the complaint sits in a state where the action would otherwise be legal, and the care
          agent's refusal comes from a state the role check never even reaches.
        test_recipe:
          setup:
            - "One member with one UNDER_REVIEW POINT_SHORTFALL complaint."
          setup_api_calls:
            - call: "POST /loyalty/members"
              payload: { email: "rq1@example.com", full_name: "Yusuf Demir", enrollment_date: "2026-02-05" }
              as: ProgramAdministrator
              captures: { m_id: $.data.id }
            - call: "POST /loyalty/member-complaints"
              payload: { member_id: "${m_id}", subject_type: "POINT_SHORTFALL", description: "My March stay never credited." }
              as: Member
              as_user_id: "${m_id}"
              captures: { c_id: $.data.id }
            - call: "POST /loyalty/member-complaints/${c_id}/review"
              payload: {}
              as: ProgramAdministrator
              captures: { c_status0: $.data.status }
          trigger:
            - call: "POST /loyalty/member-complaints/${c_id}/request-info"
              payload: {}
              as: ProgramAdministrator
              captures: { e_admin: $.data.error_id }
            - call: "POST /loyalty/member-complaints/${c_id}/request-info"
              payload: {}
              as: MemberCareAgent
              as_user_id: "care-rq-01"
              captures: { c_status1: $.data.status, c_count: $.data.info_request_count }
            - call: "POST /loyalty/member-complaints/${c_id}/adjudicate"
              payload: { adjudication_outcome: "DENIAL_UPHELD" }
              as: MemberCareAgent
              as_user_id: "care-rq-01"
              captures: { e_care: $.data.error_id }
            - call: "POST /loyalty/member-complaints/${c_id}/provide-info"
              payload: { description: "Here is the folio number." }
              as: Member
              as_user_id: "${m_id}"
              captures: { c_status2: $.data.status }
          assert:
            - "${c_status0} == UNDER_REVIEW - the administrator legitimately shares the review action"
            - "${e_admin} == ERR_UNAUTHORIZED with http 403 - request-info is the care agent's only exclusive"
            - "${c_status1} == INFO_REQUESTED and ${c_count} == 1 - the same call from the care agent works"
            - "${e_care} == ERR_UNAUTHORIZED with http 403, not ERR_COMPLAINT_INVALID_STATE - the role check at priority 2 runs long before the state check at priority 46, even though INFO_REQUESTED could never be adjudicated anyway"
            - "${c_status2} == UNDER_REVIEW - provide-info is shared between the member and the care agent, so the loop closes"
            - "MemberComplaint.${c_id}.adjudication_outcome is still null"

      - name: entity_backed_roles_cannot_reach_across_to_a_peers_rows
        claim_type: peer_roles
        grounds:
          - roles.HotelOwner.identity
          - roles.Member.identity
          - validations.priority_3_ERR_FORBIDDEN_RESOURCE_OWNER
        distinguishing_aspect: |
          Both entity-backed roles are scoped by their X-User-ID, and the scope is enforced on reads
          as well as writes: owner A cannot file a rate plan at property B nor read property B, and
          member one cannot buy points for member two nor read that record - while each identical
          call against their own row succeeds. Only endpoints that list the role at all get this far;
          the ownership rule at priority 3 is reached only after the role rule at priority 2 passes.
        test_recipe:
          setup:
            - "Two ACTIVE properties and two members."
          setup_api_calls:
            - call: "POST /loyalty/hotels"
              payload: { name: "Peer Alpha", brand_code: "PEA", market_tier: "URBAN", program_fee_pct: 0.05, rooms_count: 100, trailing_12m_occupancy_pct: 0.82, trailing_12m_adr_cents: 30000 }
