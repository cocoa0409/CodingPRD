  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: remediation_order_freeze_cascade_depth_four
        grounds:
          - state_machines.StorageProject.operational_posture=OPEN_to_operational_posture=FROZEN
          - state_machines.InjectionWellPermit.ACTIVE_to_SUSPENDED
          - state_machines.TaxCreditClaim.SUBMITTED_to_DRAFT
          - entities.StorageProject.fields.pending_credit_usd
          - entities.StorageProject.fields.open_remediation_count
          - calculations.emergency_reserve_draw
        distinguishing_aspect: |
          Depth-4 chain triggered by POST /ccs/remediation-orders with severity MAJOR, where each link is
          caused by the previous link and not by the trigger: (1) operational_posture OPEN -> FROZEN,
          (2) because posture became FROZEN the ACTIVE permit goes ACTIVE -> SUSPENDED with
          authorized_injection_rate_tpy 0, (3) because that permit left ACTIVE the SUBMITTED claim reverts
          SUBMITTED -> DRAFT, (4) because the claim left SUBMITTED the project's pending_credit_usd falls
          from 38500000.00 to 0.00.
        test_recipe:
          setup:
            - "logical clock advanced to 2028-02-01T00:00:00Z"
            - "project 'Alpha Storage Hub' in status INJECTION_ACTIVE, operational_posture OPEN, open_remediation_count 0, assurance_coverage_status FUNDED"
            - "one InjectionWellPermit 'ALPHA-1' in permit_status ACTIVE with authorized_injection_rate_tpy 1000000 and construction_status COMPLETED"
            - "two ACCEPTED InjectionPeriodRecord rows totalling 550000 tonnes injected and 500 tonnes leakage"
            - "one TaxCreditClaim for tax_year 2027 in status SUBMITTED with credit_amount_usd 38500000.00, so project.pending_credit_usd is 38500000.00"
            - "one ALLOCATED FinancialInstrument with face_amount_usd 26000000"
