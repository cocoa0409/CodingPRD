            - "11:00-13:00 (gap exactly 60 min) is accepted — the rest-gap boundary is inclusive at 60"
            - "The rejected attempt leaves no residue: GET /assignments?pilot_id=${p1} afterwards returns exactly 2 assignments (A1 and the 11:00 one)"

  - rule_id: compensating_invariant
    instances:
      - name: invoice_submit_void_conserve_season_billed
        grounds:
          - calculations.season_billed_invariant
          - state_machines.Invoice.DRAFT_to_SUBMITTED
          - state_machines.Invoice.SUBMITTED_to_VOID
          - entities.Contract.fields.season_billed_cents
        distinguishing_aspect: |
          Conserved quantity = money (contract.season_billed_cents): the forward action
          submit (+net_cents 500000) paired with its compensating action void (-net_cents)
          MUST return the contract's season_billed_cents to its exact pre-submit value 0,
          per the pinned formula sum of net_cents over {SUBMITTED, DISPUTED, RECONCILED, PAID}.
        test_recipe:
          setup:
            - "EU contract ACTIVE; one CONFIRMED availability day 2026-08-03 (570 min => 500000 cents, 1/1 compliant => no penalty)"
            - "DRAFT invoice for 2026-08-03..2026-08-03 with net_cents == 500000; clock advanced to 2026-08-09"
          setup_api_calls:
            - { call: "POST /contracts", payload: { contract_number: "EU-2026-001", agency: "USFS", contract_type: "EXCLUSIVE_USE", daily_availability_rate_cents: 500000, flight_hour_rate_cents: 300000, season_start_date: "2026-06-01", season_end_date: "2026-09-30", min_daily_available_minutes: 570, season_flight_hour_cap_tenths: 20000, acceptance_window_minutes: 30 }, as: CarrierOps, captures: { c_id: $.data.id } }
            - { call: "POST /contracts/${c_id}/activate", payload: {}, as: CarrierOps }
            - { call: "POST /aircraft", payload: { tail_number: "N100AF", model: "AT-802F", tank_capacity_gallons: 800, contract_id: "${c_id}" }, as: CarrierOps, captures: { ac_id: $.data.id } }
            - { call: "POST /contracts/${c_id}/availability-periods", payload: { aircraft_id: "${ac_id}", service_date: "2026-08-03", available_start: "2026-08-03T07:00:00Z", available_end: "2026-08-03T16:30:00Z" }, as: CarrierOps }
            - { call: "GET /contracts/${c_id}", as: CarrierFinance, captures: { c_v: $.data.version, billed0: $.data.season_billed_cents } }
            - { call: "POST /contracts/${c_id}/invoices", payload: { period_start: "2026-08-03", period_end: "2026-08-03", expected_contract_version: "${c_v}" }, as: CarrierFinance, captures: { inv_id: $.data.id, inv_net: $.data.net_cents } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-09T00:00:00Z" }, as: SystemAdmin }
          trigger:
            - { call: "POST /invoices/${inv_id}/submit", payload: {}, as: CarrierFinance, as_user_id: "cf_1" }
            - { call: "GET /contracts/${c_id}", as: CarrierFinance, captures: { billed_mid: $.data.season_billed_cents } }
            - { call: "POST /invoices/${inv_id}/void", payload: {}, as: CarrierFinance, as_user_id: "cf_1", captures: { inv_st: $.data.status } }
            - { call: "GET /contracts/${c_id}", as: CarrierFinance, captures: { billed_after: $.data.season_billed_cents } }
          assert:
            - "season_billed_cents == 0 before submit"
            - "season_billed_cents == 500000 after submit (invoice joined the invariant set)"
            - "season_billed_cents == 0 after void — the forward+compensating pair conserves the quantity exactly"
            - "Invoice.status == VOID and the invoice is excluded from the invariant set thereafter"

      - name: assignment_create_release_conserve_filled_count
        grounds:
          - calculations.filled_count_invariant
          - state_machines.DispatchOrder.ACCEPTED_to_PARTIALLY_FILLED
          - state_machines.DispatchOrder.PARTIALLY_FILLED_to_ACCEPTED
          - entities.DispatchOrder.fields.filled_count
        distinguishing_aspect: |
          Conserved quantity = headcount (order.filled_count and its derived status) —
          different quantity type than money: creating two assignments then releasing
          both MUST return filled_count to 0 and the derived status to ACCEPTED, matching
          the pinned formula count of assignments in {ASSIGNED, EN_ROUTE, ON_INCIDENT}.
        test_recipe:
          setup:
            - "EU contract ACTIVE; aircraft X carded; pilots P1, P2 carded"
            - "order (qty 2) ACCEPTED, filled_count == 0"
          setup_api_calls:
            - { call: "POST /contracts", payload: { contract_number: "EU-2026-001", agency: "USFS", contract_type: "EXCLUSIVE_USE", daily_availability_rate_cents: 500000, flight_hour_rate_cents: 300000, season_start_date: "2026-06-01", season_end_date: "2026-09-30", min_daily_available_minutes: 570, season_flight_hour_cap_tenths: 20000, acceptance_window_minutes: 30 }, as: CarrierOps, captures: { c_id: $.data.id } }
            - { call: "POST /contracts/${c_id}/activate", payload: {}, as: CarrierOps }
            - { call: "POST /aircraft", payload: { tail_number: "N100AF", model: "AT-802F", tank_capacity_gallons: 800, contract_id: "${c_id}" }, as: CarrierOps, captures: { ac_id: $.data.id } }
            - { call: "POST /crew-members", payload: { full_name: "Pat Reed", crew_role: "PIC", contract_id: "${c_id}", qualified_aircraft_models: ["AT-802F"] }, as: CarrierOps, captures: { p1: $.data.id } }
            - { call: "POST /crew-members", payload: { full_name: "Sam Ortiz", crew_role: "PIC", contract_id: "${c_id}", qualified_aircraft_models: ["AT-802F"] }, as: CarrierOps, captures: { p2: $.data.id } }
            - { call: "POST /carding-inspections", payload: { subject_aircraft_id: "${ac_id}", scheduled_for: "2026-07-15T08:00:00Z", valid_days: 365 }, as: CardingInspector, captures: { i_ac: $.data.id } }
            - { call: "POST /carding-inspections/${i_ac}/complete", payload: { result: "PASSED", completed_at: "2026-07-15T09:00:00Z" }, as: CardingInspector }
            - { call: "POST /carding-inspections", payload: { subject_crew_member_id: "${p1}", scheduled_for: "2026-07-15T08:00:00Z", valid_days: 365 }, as: CardingInspector, captures: { i_p1: $.data.id } }
            - { call: "POST /carding-inspections/${i_p1}/complete", payload: { result: "PASSED", completed_at: "2026-07-15T09:00:00Z" }, as: CardingInspector }
            - { call: "POST /carding-inspections", payload: { subject_crew_member_id: "${p2}", scheduled_for: "2026-07-15T08:00:00Z", valid_days: 365 }, as: CardingInspector, captures: { i_p2: $.data.id } }
            - { call: "POST /carding-inspections/${i_p2}/complete", payload: { result: "PASSED", completed_at: "2026-07-15T09:00:00Z" }, as: CardingInspector }
            - { call: "POST /incidents", payload: { incident_number: "USFS-2026-0801", name: "Ridge Fire", location: "39.5,-121.5", agency: "USFS", priority: "EXTENDED_ATTACK" }, as: AgencyDispatcher, captures: { inc_id: $.data.id } }
            - { call: "POST /dispatch-orders", payload: { order_number: "O-1001", contract_id: "${c_id}", incident_id: "${inc_id}", aircraft_quantity: 2 }, as: AgencyDispatcher, captures: { do_id: $.data.id } }
            - { call: "POST /dispatch-orders/${do_id}/accept", payload: {}, as: CarrierOps }
          trigger:
            - { call: "GET /dispatch-orders/${do_id}", as: CarrierOps, captures: { v0: $.data.version, fc0: $.data.filled_count, st0: $.data.status } }
            - { call: "POST /dispatch-orders/${do_id}/assignments", payload: { aircraft_id: "${ac_id}", pilot_id: "${p1}", planned_start: "2026-08-04T08:00:00Z", planned_end: "2026-08-04T10:00:00Z", expected_dispatch_order_version: "${v0}" }, as: CarrierOps, captures: { a1: $.data.id } }
            - { call: "GET /dispatch-orders/${do_id}", as: CarrierOps, captures: { v1: $.data.version, fc1: $.data.filled_count, st1: $.data.status } }
            - { call: "POST /dispatch-orders/${do_id}/assignments", payload: { aircraft_id: "${ac_id}", pilot_id: "${p2}", planned_start: "2026-08-04T10:00:00Z", planned_end: "2026-08-04T12:00:00Z", expected_dispatch_order_version: "${v1}" }, as: CarrierOps, captures: { a2: $.data.id } }
            - { call: "GET /dispatch-orders/${do_id}", as: CarrierOps, captures: { fc2: $.data.filled_count, st2: $.data.status } }
            - { call: "POST /assignments/${a1}/release", payload: { release_reason: "AGENCY" }, as: AgencyDispatcher }
            - { call: "GET /dispatch-orders/${do_id}", as: CarrierOps, captures: { fc3: $.data.filled_count, st3: $.data.status } }
            - { call: "POST /assignments/${a2}/release", payload: { release_reason: "AGENCY" }, as: AgencyDispatcher }
            - { call: "GET /dispatch-orders/${do_id}", as: CarrierOps, captures: { fc4: $.data.filled_count, st4: $.data.status } }
          assert:
            - "filled_count sequence 0 -> 1 -> 2 -> 1 -> 0 with status ACCEPTED -> PARTIALLY_FILLED -> FILLED -> PARTIALLY_FILLED -> ACCEPTED"
            - "At every step filled_count equals the count of that order's assignments in {ASSIGNED, EN_ROUTE, ON_INCIDENT} (the pinned invariant)"
            - "After the create+release pairs the order is byte-identical in the conserved dimensions: filled_count == 0 and status == ACCEPTED"
