        distinguishing_aspect: "The uniqueness is on (engineer, ACTIVE) rather than on the engineer alone: a second licence for an engineer who already holds an ACTIVE one returns 409 ERR_DUPLICATE_ACTIVE_LICENSE and no second row is created."
