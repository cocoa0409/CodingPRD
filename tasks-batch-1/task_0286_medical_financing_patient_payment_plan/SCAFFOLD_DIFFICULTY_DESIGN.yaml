            - call: "POST /financed-purchases"
              payload: { provider_id: "${provk_id}", patient_account_id: "${acctk_id}", provider_promotion_id: "${ppk_id}", principal_cents: 200000, expected_patient_account_version: "${acctk_v0}" }
              as: Provider
              as_user_id: "${provk_id}"
              captures: { fpk_id: $.data.id, fpk_v: $.data.version }
            - call: "POST /financed-purchases/${fpk_id}/settle"
