            - call: "POST /isolation-events/${iso}/execute"
              as: Dispatcher
            - call: "POST /work-orders"
              payload: { break_report_id: "${br}", est_pipe_length_ft: 4 }
              as: Dispatcher
              captures: { wo: $.data.id }
            - call: "POST /work-orders/${wo}/dispatch"
              payload: { crew_id: "${crOak}" }
              as: Dispatcher
          trigger:
            - call: "POST /work-orders/${wo}/arrive"
              as: CrewLead
              as_user_id: "${crBirch}"
              captures: { err: $.data.error_id }
          assert:
            - "Arrive by CrewLead of Crew Birch returns error_id ERR_FORBIDDEN_ROLE (http 403)"
            - "WorkOrder.${wo}.work_status remains DISPATCHED"

      - name: segregation_of_duties_advisory_lift
        claim_type: segregation_of_duties
        grounds: [state_machines.BoilWaterAdvisory.ISSUED_to_LIFTED, "errors[ERR_SEGREGATION_OF_DUTIES]", roles]
        distinguishing_aspect: "With two PASSes recorded, the issuing officer's lift attempt is rejected ERR_SEGREGATION_OF_DUTIES; a different officer's identical lift succeeds."
        test_recipe:
          setup: ["Confirmed break; advisory issued by wq_officer_1; two PASS tests 24h apart"]
          setup_api_calls:
            - call: "POST /pipe-segments"
              payload: { segment_ref: "MAIN-8-WILLOW", material: PVC, diameter_inches: 8, install_year: 1990 }
              as: PublicWorksEngineer
              captures: { seg: $.data.id }
            - call: "POST /break-reports"
              payload: { location_description: "15 Willow Way", source: CUSTOMER_CALL }
              as: Dispatcher
              captures: { br: $.data.id }
            - call: "POST /break-reports/${br}/confirm"
              payload: { pipe_segment_id: "${seg}", break_type: CIRCUMFERENTIAL, severity: LOW }
              as: Dispatcher
            - call: "POST /boil-water-advisories"
              payload: { break_report_id: "${br}" }
              as: WaterQualityOfficer
              as_user_id: "wq_officer_1"
              captures: { adv: $.data.id }
            - call: "POST /water-quality-tests"
              payload: { advisory_id: "${adv}", sampled_at: "2026-08-02T00:00:00Z", chlorine_residual_mg_l: 0.30, coliform_result: PASS }
              as: WaterQualityOfficer
              as_user_id: "wq_officer_1"
            - call: "POST /water-quality-tests"
              payload: { advisory_id: "${adv}", sampled_at: "2026-08-03T00:00:00Z", chlorine_residual_mg_l: 0.25, coliform_result: PASS }
              as: WaterQualityOfficer
              as_user_id: "wq_officer_1"
          trigger:
            - call: "POST /boil-water-advisories/${adv}/lift"
              as: WaterQualityOfficer
              as_user_id: "wq_officer_1"
              captures: { err: $.data.error_id }
            - call: "POST /boil-water-advisories/${adv}/lift"
              as: WaterQualityOfficer
              as_user_id: "wq_officer_2"
              captures: { st: $.data.advisory_status, lifter: $.data.lifted_by_user_id }
          assert:
            - "Lift by issuer wq_officer_1 returns error_id ERR_SEGREGATION_OF_DUTIES (http 409)"
            - "Lift by wq_officer_2 succeeds: advisory_status == LIFTED, lifted_by_user_id == \"wq_officer_2\""

      - name: dispatcher_cannot_approve_claim_forbidden
        claim_type: rbac_denial
        grounds: [roles, "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "Dispatcher (intake role) attempting a ClaimsAdjuster-exclusive operation is rejected ERR_FORBIDDEN_ROLE (403)."
        test_recipe:
          setup: ["Confirmed break; claim SUBMITTED"]
          setup_api_calls:
            - call: "POST /pipe-segments"
              payload: { segment_ref: "MAIN-8-OAK", material: PVC, diameter_inches: 8, install_year: 1999 }
              as: PublicWorksEngineer
              captures: { seg: $.data.id }
            - call: "POST /break-reports"
              payload: { location_description: "12 Oak St", source: CUSTOMER_CALL }
              as: Dispatcher
              captures: { br: $.data.id }
            - call: "POST /break-reports/${br}/confirm"
              payload: { pipe_segment_id: "${seg}", break_type: SPLIT, severity: LOW }
              as: Dispatcher
            - call: "POST /damage-claims"
              payload: { break_report_id: "${br}", claimant_name: "J. Homeowner", claimed_amount_cents: 100000 }
              as: Dispatcher
              captures: { cl: $.data.id }
          trigger:
            - call: "POST /damage-claims/${cl}/approve"
              payload: { approved_amount_cents: 50000 }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_FORBIDDEN_ROLE (http 403); claim stays SUBMITTED"

  - section: complexity_layers
    instances:
      - name: occ_stale_isolation_plan_rejected
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[isolation-plan-stale-break]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "optimistic_concurrency layer: after plan A creation bumps BreakReport.version 2 -> 3, a second create carrying expected_break_report_version 2 is rejected 412 ERR_STALE_VERSION; the same create with the fresh version succeeds."
        test_recipe:
          setup: ["Confirmed break (version 2 after confirm) with one valve; plan A already created (version now 3)"]
          setup_api_calls:
            - call: "POST /pipe-segments"
              payload: { segment_ref: "MAIN-8-OAK", material: DUCTILE_IRON, diameter_inches: 8, install_year: 1978 }
              as: PublicWorksEngineer
              captures: { seg: $.data.id }
            - call: "POST /valves"
              payload: { valve_code: "V-OAK-1", pipe_segment_id: "${seg}", coverage_zone: "Z1", customers_served: 100 }
              as: PublicWorksEngineer
              captures: { v1: $.data.id }
            - call: "POST /break-reports"
              payload: { location_description: "400 Oak St", source: CUSTOMER_CALL }
              as: Dispatcher
              captures: { br: $.data.id }
            - call: "POST /break-reports/${br}/confirm"
              payload: { pipe_segment_id: "${seg}", break_type: CIRCUMFERENTIAL, severity: MEDIUM }
              as: Dispatcher
              captures: { br_v: $.data.version }
            - call: "POST /isolation-events"
              payload: { break_report_id: "${br}", valve_ids: ["${v1}"], expected_break_report_version: "${br_v}" }
              as: Dispatcher
              captures: { isoA: $.data.id }
          trigger:
            - call: "POST /isolation-events"
              payload: { break_report_id: "${br}", valve_ids: ["${v1}"], expected_break_report_version: "${br_v}" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "Second create with the stale expected_break_report_version (2 while current is 3) returns http 412 with error_id ERR_STALE_VERSION"
            - "Plan A remains PLANNED (the rejected create caused no supersede)"

      - name: isolation_execute_cascade_covered
        claim_type: cascade_side_effects
        grounds: [state_machines.IsolationEvent.PLANNED_to_EXECUTED]
        excluded_because:
          difficulty_instance: isolation_execute_cascade_depth3
          rationale: "cascading_side_effects layer exercised end-to-end there (valves -> break -> advisory)."

      - name: repair_complete_cascade_covered
        claim_type: cascade_side_effects
        grounds: [state_machines.WorkOrder.ON_SITE_to_REPAIR_COMPLETE]
        excluded_because:
          difficulty_instance: repair_complete_cascade_depth3
          rationale: "cascading_side_effects layer exercised there (work order -> break -> isolation -> restoration job)."

  - section: consistency_model
    instances:
      - name: dispatch_response_immediately_consistent
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model, calculations.estimated_cost_cents]
        distinguishing_aspect: "immediate consistency: the dispatch response itself carries work_status DISPATCHED, crew_id, and estimated_cost_cents == 112000 (SMALL tier CIRC: 48000 + 40000 kit + 4h x 6000) with no follow-up GET."
        test_recipe:
          setup: ["Segment MAIN-6-PINE diameter 6; valve Z1/100; break confirmed CIRCUMFERENTIAL and isolated; LIGHT crew rate 6000; work order est length 4"]
          setup_api_calls:
            - call: "POST /pipe-segments"
              payload: { segment_ref: "MAIN-6-PINE", material: PVC, diameter_inches: 6, install_year: 2001 }
              as: PublicWorksEngineer
              captures: { seg: $.data.id }
            - call: "POST /valves"
              payload: { valve_code: "V-PINE-1", pipe_segment_id: "${seg}", coverage_zone: "Z1", customers_served: 100 }
              as: PublicWorksEngineer
              captures: { v1: $.data.id }
            - call: "POST /crews"
              payload: { crew_name: "Crew Pine", crew_size: 2, equipment_class: LIGHT, hourly_rate_cents: 6000 }
              as: Dispatcher
              captures: { cr: $.data.id }
            - call: "POST /break-reports"
              payload: { location_description: "9 Pine Ct", source: CUSTOMER_CALL }
              as: Dispatcher
              captures: { br: $.data.id }
            - call: "POST /break-reports/${br}/confirm"
              payload: { pipe_segment_id: "${seg}", break_type: CIRCUMFERENTIAL, severity: LOW }
              as: Dispatcher
              captures: { br_v: $.data.version }
            - call: "POST /isolation-events"
              payload: { break_report_id: "${br}", valve_ids: ["${v1}"], expected_break_report_version: "${br_v}" }
              as: Dispatcher
              captures: { iso: $.data.id }
            - call: "POST /isolation-events/${iso}/execute"
              as: Dispatcher
            - call: "POST /work-orders"
              payload: { break_report_id: "${br}", est_pipe_length_ft: 4 }
              as: Dispatcher
              captures: { wo: $.data.id }
          trigger:
            - call: "POST /work-orders/${wo}/dispatch"
              payload: { crew_id: "${cr}" }
              as: Dispatcher
              captures: { st: $.data.work_status, cid: $.data.crew_id, est: $.data.estimated_cost_cents }
          assert:
