  - rule_id: transitive_cascade
    instances:
      - name: refresh_apply_cascade_depth3
        grounds:
          - state_machines.RefreshCycle.transitions
          - state_machines.PayBand.transitions
          - calculations.refresh_budget_impact_rollup
          - entities.ExceptionRequest.fields.created_by_user_id
        distinguishing_aspect: |
          Depth-3 chain from the refresh-apply trigger: apply supersedes and
          re-publishes bands (link 1); each band publication recomputes
          employee compa/range and applies bring-to-minimum raises (link 2);
          the employee landing ABOVE_MAX auto-creates a system-owned
          ExceptionRequest (link 3) — each hop caused by the previous one,
          not by the original call.
        test_recipe:
          setup:
            - "ENG family, levels P1/P2; zone US-NAT; profile SWE1 APPROVED (weekly 200000, duties true)"
            - "program FY2027 as_of 2026-08-01 refresh_budget 2000000 cadence 12, advanced to PUBLISHED"
            - "band P1 PUBLISHED mid 12000000 spread 0.30 -> [10200000, 13800000] (cut K1 p50 12000000 eff 2026-08-01 sample 25, survey S1 ACCEPTED)"
            - "department DA pool 5000000; employees: E1 10200000 hire 2020-01-15; E2 10500000 hire 2019-06-01; E3 13000000 hire 2021-03-01 (IN_RANGE pre-refresh); E4 9000000 hire 2018-01-01"
            - "survey S2 ACCEPTED with cut K2 p50 11000000 eff 2027-01-01 sample 25; K1 excluded via set-exclusion"
            - "refresh cycle window [2027-01-01, 2027-03-01) effective 2027-01-01; impact computed and approved; logical clock set to 2027-01-01T00:00:00Z; program version re-read via GET after employee-driven payroll rollups advanced it"
