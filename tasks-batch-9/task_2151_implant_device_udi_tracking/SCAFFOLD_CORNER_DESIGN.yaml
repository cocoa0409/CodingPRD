  # ==========================================================================
  - section: calculations
    instances:

      - name: fefo_selector_picks_earliest_expiring_lot_then_oldest_unit
        claim_type: chronological
        grounds:
          - calculations.fefo_unit_selection
          - endpoints[POST /udi/surgical-cases/{case_id}/reservations]
          - entities.Lot.fields.expiration_date
        distinguishing_aspect: "Given a later-expiring lot L-LATE (2027-06-30) and an earlier-expiring lot L-EARLY (2027-01-31) holding SN-E1 then SN-E2, the first catalog_item_id reservation returns SN-E1 (earliest expiration wins over receipt order) and the second returns SN-E2 (DeviceUnit.created_at ASC tie-break inside the same lot), never SN-L and never an id-ordered pick."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z."
            - "One catalog item with two released lots: L-LATE (expiration 2027-06-30, received first, unit SN-L) and L-EARLY (expiration 2027-01-31, received second, units SN-E1 then SN-E2)."
            - "Two SCHEDULED cases for two different patients in two different rooms, both ending well before 2027-01-31."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: InventoryLead
              as_user_id: "il-01"
            - call: "POST /udi/vendors"
              payload: { name: "Ortholux Medical", vendor_code: "ORTHO-1" }
              as: InventoryLead
              as_user_id: "il-01"
              captures: { vendor_id: "$.data.id" }
            - call: "POST /udi/catalog-items"
              payload: { vendor_id: "${vendor_id}", device_identifier: "00812345678905", description: "Ti Femoral Stem", category: "STANDARD_IMPLANT", list_charge_cents: 600000, charge_code: "CDM-77140", shelf_life_days: 1095 }
              as: InventoryLead
              as_user_id: "il-01"
              captures: { cat_id: "$.data.id" }
            - call: "POST /udi/lots"
              payload: { catalog_item_id: "${cat_id}", lot_number: "L-LATE", expiration_date: "2027-06-30" }
              as: ReceivingTech
              as_user_id: "rt-01"
              captures: { lotL_id: "$.data.id", lotL_v: "$.data.version" }
            - call: "POST /udi/lots/${lotL_id}/device-units"
              payload: { udi_serial: "SN-L", acquisition_cost_cents: 400000, expected_lot_version: "${lotL_v}" }
              as: ReceivingTech
              as_user_id: "rt-01"
              captures: { uL_id: "$.data.id" }
            - call: "POST /udi/lots/${lotL_id}/release"
              payload: {}
              as: InventoryLead
              as_user_id: "il-01"
            - call: "POST /udi/lots"
              payload: { catalog_item_id: "${cat_id}", lot_number: "L-EARLY", expiration_date: "2027-01-31" }
              as: ReceivingTech
              as_user_id: "rt-01"
              captures: { lotE_id: "$.data.id", lotE_v1: "$.data.version" }
            - call: "POST /udi/lots/${lotE_id}/device-units"
              payload: { udi_serial: "SN-E1", acquisition_cost_cents: 400000, expected_lot_version: "${lotE_v1}" }
              as: ReceivingTech
              as_user_id: "rt-01"
              captures: { uE1_id: "$.data.id" }
            - call: "GET /udi/lots/${lotE_id}"
              payload: {}
              as: ReceivingTech
              as_user_id: "rt-01"
              captures: { lotE_v2: "$.data.version" }
            - call: "POST /udi/lots/${lotE_id}/device-units"
              payload: { udi_serial: "SN-E2", acquisition_cost_cents: 400000, expected_lot_version: "${lotE_v2}" }
              as: ReceivingTech
              as_user_id: "rt-01"
              captures: { uE2_id: "$.data.id" }
            - call: "POST /udi/lots/${lotE_id}/release"
              payload: {}
              as: InventoryLead
              as_user_id: "il-01"
            - call: "POST /udi/patients"
              payload: { mrn: "MRN-1001", display_name: "Pat One", registry_consent: "GRANTED" }
              as: CircClinician
              as_user_id: "cc-01"
              captures: { pat1_id: "$.data.id" }
            - call: "POST /udi/patients"
              payload: { mrn: "MRN-1002", display_name: "Pat Two", registry_consent: "GRANTED" }
              as: CircClinician
              as_user_id: "cc-01"
              captures: { pat2_id: "$.data.id" }
            - call: "POST /udi/surgical-cases"
              payload: { patient_id: "${pat1_id}", case_number: "CASE-1", or_room_code: "OR-3", scheduled_start_utc: "2026-09-10T08:00:00Z", scheduled_end_utc: "2026-09-10T10:00:00Z", surgeon_code: "SURG-9" }
              as: CircClinician
              as_user_id: "cc-01"
              captures: { case1_id: "$.data.id" }
            - call: "POST /udi/surgical-cases"
              payload: { patient_id: "${pat2_id}", case_number: "CASE-2", or_room_code: "OR-4", scheduled_start_utc: "2026-09-11T08:00:00Z", scheduled_end_utc: "2026-09-11T10:00:00Z", surgeon_code: "SURG-9" }
              as: CircClinician
