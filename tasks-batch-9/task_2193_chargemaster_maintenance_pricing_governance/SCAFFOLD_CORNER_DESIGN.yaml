          assert:
            - "${inflator} == 10300 and ${unmapped0} == PENDING"
            - "${cycle_mapping} == MAPPING and ${unmapped} == 3"
            - "${e_unmapped} == ERR_UNMAPPED_CODE_ENTRIES with HTTP 409"
            - "${e1_status} == MAPPED and ${e1_target} == ${it1} and ${e1_carry} == 240000 (no revenue code change, so the price is carried unchanged and the inflator is not applied)"
            - "${e2_status} == MAPPED and ${e2_carry} == 240000"
