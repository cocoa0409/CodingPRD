  - rule_id: cross_entity_state_dependency
    instances:
      - name: setter_start_requires_sanitized_free_unit
        grounds:
          - state_machines.SetterLoad.PLANNED_to_INCUBATING
          - validations.priority_22.ERR_UNIT_NOT_SANITIZED
          - entities.IncubationUnit.fields.sanitation_status
          - entities.IncubationUnit.fields.occupancy_status
        distinguishing_aspect: |
          The SetterLoad transition is gated on the state of a different aggregate (IncubationUnit):
          a load fully stocked with eggs cannot start in a DIRTY unit, and starting it consumes the
          sanitation, flipping the unit to OCCUPIED + DIRTY. Nothing about the load itself changed
          between the rejected and the accepted call.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T12:00:00Z; flock F1 IN_LAY; lot L1 graded to 6200 settable and stored at 15.0 C."
            - "Unit U1 is created and NOT sanitized, so its sanitation_status is DIRTY."
            - "Setter load S1 is planned for 2026-08-01T18:00:00Z and stocked with 6000 eggs; the clock then reaches 2026-08-01T18:00:00Z."
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T12:00:00Z"}, as: HatcheryManager}
            - {call: "POST /flock-programs", payload: {code: "P1", breed: "ROSS_308", stimulation_week: 21, lighting_steps: [{age_weeks: 21, photoperiod_hours: 12.0}, {age_weeks: 24, photoperiod_hours: 14.0}, {age_weeks: 30, photoperiod_hours: 16.0}], feed_steps: [{age_weeks: 21, feed_grams_per_hen_day: 150.0}, {age_weeks: 26, feed_grams_per_hen_day: 168.0}]}, as: HatcheryManager, captures: {p1: "$.data.id"}}
            - {call: "POST /breeder-flocks", payload: {code: "F1", program_id: "${p1}", breed: "ROSS_308", house_code: "H1", hatch_date: "2026-01-05T00:00:00Z", placed_at: "2026-05-01T00:00:00Z", hen_count: 9000}, as: FlockManager, captures: {f1: "$.data.id"}}
            - {call: "POST /lab-tests", payload: {subject_type: "BREEDER_FLOCK", subject_id: "${f1}", test_code: "SALMONELLA_PULLORUM", collected_at: "2026-07-20T00:00:00Z"}, as: Veterinarian, captures: {t1: "$.data.id"}}
            - {call: "POST /lab-tests/${t1}/release", payload: {result: "NEGATIVE"}, as: Veterinarian}
            - {call: "POST /breeder-flocks/${f1}/start-lay", payload: {}, as: FlockManager}
            - {call: "POST /egg-lots", payload: {flock_id: "${f1}", collected_at: "2026-07-30T00:00:00Z", collected_count: 6500}, as: FlockManager, captures: {l1: "$.data.id"}}
            - {call: "POST /egg-lots/${l1}/grade", payload: {grade_a_count: 6200, cracked_count: 150, dirty_count: 100, small_count: 50}, as: FlockManager}
            - {call: "POST /egg-lots/${l1}/store", payload: {storage_temp_c: 15.0}, as: IncubationOperator, captures: {l1v: "$.data.version"}}
            - {call: "POST /incubation-units", payload: {code: "U1", unit_type: "SETTER", capacity_eggs: 20000}, as: HatcheryManager, captures: {u1: "$.data.id"}}
            - {call: "POST /incubation-profiles", payload: {code: "PR1", breed: "ROSS_308", transfer_hours: 456, total_hours: 504, stages: [{from_hour: 0, to_hour: 240, temp_c: 37.8, humidity_pct: 55.0}, {from_hour: 240, to_hour: 456, temp_c: 37.5, humidity_pct: 52.0}, {from_hour: 456, to_hour: 504, temp_c: 36.9, humidity_pct: 65.0}]}, as: HatcheryManager, captures: {pr1: "$.data.id"}}
            - {call: "POST /setter-loads", payload: {unit_id: "${u1}", profile_id: "${pr1}", planned_set_at: "2026-08-01T18:00:00Z"}, as: IncubationOperator, captures: {s1: "$.data.id"}}
            - {call: "POST /setter-loads/${s1}/items", payload: {egg_lot_id: "${l1}", eggs_taken: 6000, expected_egg_lot_version: "${l1v}"}, as: IncubationOperator}
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T18:00:00Z"}, as: HatcheryManager}
          trigger:
            - {call: "POST /setter-loads/${s1}/start", payload: {}, as: IncubationOperator}
            - {call: "POST /incubation-units/${u1}/sanitize", payload: {}, as: IncubationOperator}
            - {call: "POST /setter-loads/${s1}/start", payload: {}, as: IncubationOperator}
          assert:
            - "First start: HTTP 422 with error.code == ERR_UNIT_NOT_SANITIZED; SetterLoad.${s1}.status stays PLANNED and set_at stays null"
            - "EggLot.${l1}.status stays ALLOCATED (not SET) after the rejected start"
            - "After sanitize: IncubationUnit.${u1}.sanitation_status == SANITIZED, occupancy_status == FREE"
            - "Second start: HTTP 200, SetterLoad.${s1}.status == INCUBATING, set_at == 2026-08-01T18:00:00Z, weighted_age_days == 2.0000, storage_delay_hours == 0"
            - "IncubationUnit.${u1}.occupancy_status == OCCUPIED and sanitation_status == DIRTY (starting consumed the sanitation)"
            - "EggLot.${l1}.status == SET"

      - name: egg_operations_gated_on_flock_egg_hold
        grounds:
          - validations.priority_33.ERR_FLOCK_EGG_HOLD
          - state_machines.BreederFlock.IN_LAY_to_EGG_HOLD
          - validations.priority_9.ERR_SEGREGATION_OF_DUTIES
          - state_machines.BreederFlock.EGG_HOLD_to_IN_LAY
        distinguishing_aspect: |
          The gate lives on the EggLot endpoints but reads the owning BreederFlock's state, and the
          cascade deliberately spares GRADED lots: lot L2 is still GRADED after the hold opens, yet
          neither storing it nor collecting a fresh lot is allowed. The escape hatch is itself
          cross-entity and cross-user: release-hold by the same veterinarian who opened the hold is
          rejected at priority 9 before the clearance rule at priority 21 is even consulted.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T12:00:00Z; flock F1 IN_LAY with a NEGATIVE clearance test."
            - "Lot L1 is graded and stored (IN_STORAGE); lot L2 is graded only and never stored (GRADED)."
            - "A second SALMONELLA_PULLORUM sample collected 2026-08-01T06:00:00Z is released POSITIVE by user u_vet_1, putting F1 into EGG_HOLD."
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T12:00:00Z"}, as: HatcheryManager}
            - {call: "POST /flock-programs", payload: {code: "P1", breed: "ROSS_308", stimulation_week: 21, lighting_steps: [{age_weeks: 21, photoperiod_hours: 12.0}, {age_weeks: 24, photoperiod_hours: 14.0}, {age_weeks: 30, photoperiod_hours: 16.0}], feed_steps: [{age_weeks: 21, feed_grams_per_hen_day: 150.0}, {age_weeks: 26, feed_grams_per_hen_day: 168.0}]}, as: HatcheryManager, captures: {p1: "$.data.id"}}
            - {call: "POST /breeder-flocks", payload: {code: "F1", program_id: "${p1}", breed: "ROSS_308", house_code: "H1", hatch_date: "2026-01-05T00:00:00Z", placed_at: "2026-05-01T00:00:00Z", hen_count: 9000}, as: FlockManager, captures: {f1: "$.data.id"}}
            - {call: "POST /lab-tests", payload: {subject_type: "BREEDER_FLOCK", subject_id: "${f1}", test_code: "SALMONELLA_PULLORUM", collected_at: "2026-07-20T00:00:00Z"}, as: Veterinarian, captures: {t1: "$.data.id"}}
            - {call: "POST /lab-tests/${t1}/release", payload: {result: "NEGATIVE"}, as: Veterinarian}
            - {call: "POST /breeder-flocks/${f1}/start-lay", payload: {}, as: FlockManager}
            - {call: "POST /egg-lots", payload: {flock_id: "${f1}", collected_at: "2026-07-30T00:00:00Z", collected_count: 6500}, as: FlockManager, captures: {l1: "$.data.id"}}
            - {call: "POST /egg-lots/${l1}/grade", payload: {grade_a_count: 6200, cracked_count: 150, dirty_count: 100, small_count: 50}, as: FlockManager}
            - {call: "POST /egg-lots/${l1}/store", payload: {storage_temp_c: 15.0}, as: IncubationOperator}
            - {call: "POST /egg-lots", payload: {flock_id: "${f1}", collected_at: "2026-07-31T00:00:00Z", collected_count: 6500}, as: FlockManager, captures: {l2: "$.data.id"}}
            - {call: "POST /egg-lots/${l2}/grade", payload: {grade_a_count: 6200, cracked_count: 150, dirty_count: 100, small_count: 50}, as: FlockManager}
            - {call: "POST /lab-tests", payload: {subject_type: "BREEDER_FLOCK", subject_id: "${f1}", test_code: "SALMONELLA_PULLORUM", collected_at: "2026-08-01T06:00:00Z"}, as: Veterinarian, captures: {t2: "$.data.id"}}
            - {call: "POST /lab-tests/${t2}/release", payload: {result: "POSITIVE"}, as: Veterinarian, as_user_id: "u_vet_1"}
          trigger:
            - {call: "POST /egg-lots/${l2}/store", payload: {storage_temp_c: 15.0}, as: IncubationOperator}
            - {call: "POST /egg-lots", payload: {flock_id: "${f1}", collected_at: "2026-08-01T08:00:00Z", collected_count: 4000}, as: FlockManager}
            - {call: "POST /breeder-flocks/${f1}/release-hold", payload: {}, as: Veterinarian, as_user_id: "u_vet_1"}
          assert:
            - "BreederFlock.${f1}.status == EGG_HOLD with egg_hold_opened_by_user_id == u_vet_1"
            - "EggLot.${l1}.status == CONDEMNED (it was IN_STORAGE when the hold opened) with condemned_reason == FLOCK_EGG_HOLD"
            - "EggLot.${l2}.status is STILL GRADED: the cascade only touches IN_STORAGE and ALLOCATED lots"
            - "First call: HTTP 422 with error.code == ERR_FLOCK_EGG_HOLD; EggLot.${l2}.status stays GRADED and stored_at stays null"
            - "Second call: HTTP 422 with error.code == ERR_FLOCK_EGG_HOLD; no new EggLot is created (GET /egg-lots?flock_id=${f1} still returns total_count 2)"
            - "Third call: HTTP 403 with error.code == ERR_SEGREGATION_OF_DUTIES, chosen at priority 9 even though the latest test is POSITIVE and ERR_LAB_CLEARANCE_MISSING at priority 21 also applies"
            - "BreederFlock.${f1}.status is still EGG_HOLD after all three rejections"

      - name: transfer_blocked_by_open_environment_deviation
        grounds:
          - state_machines.SetterLoad.CANDLED_to_TRANSFERRED
          - state_machines.SetterLoad.environment_status.NOMINAL_to_DEVIATION_OPEN
          - errors.ERR_ENVIRONMENT_DEVIATION_OPEN
          - validations.priority_13.ERR_INCUBATION_INVALID_STATE
          - state_machines.SetterLoad.CANDLED_to_ABORTED
        distinguishing_aspect: |
          The transfer precondition reads the load's OTHER state dimension, not its own status: a
          CANDLED load whose environment_status is DEVIATION_OPEN cannot transfer. Because readings
          are only accepted while INCUBATING, the deviation can no longer be resolved after candling,
          so the load is permanently non-transferable and abort is the only exit - a dependency that
          a single-dimension implementation cannot reproduce.
        test_recipe:
          setup:
            - "Standard fixture: 10000 eggs set in unit U1 with profile PR1, load started at 2026-08-01T18:00:00Z."
            - "Two readings at 38.6 C four hours apart charge a 2.000 degree-hour segment, opening the deviation while the load is still INCUBATING."
            - "Clock moves to 2026-08-02T02:00:00Z and the load is candled at fertile_count 9600; a sanitized HATCHER unit U2 is standing by."
