              payload: { case_id: "${case1_id}", item_description: "Misplaced camera", category: "GENERAL", packaging_type: "RIGID_BOX", appraised_value_cents: 300000, seized_at: "2026-07-31T12:00:00Z" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
              captures: { item_id: $.data.id, item_barcode: $.data.barcode }
            - call: "POST /evidence-items/${item_id}/storage-assignment"
              payload: { storage_location_id: "${loc_g2s_id}" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
            - call: "POST /audit-sessions"
              payload: { storage_location_id: "${loc_g9_id}", auditor_id: "${aud_id}", scheduled_start_at: "2026-08-10T09:00:00Z", scheduled_end_at: "2026-08-10T17:00:00Z", expected_storage_location_version: "${loc_g9_v}" }
              as: InternalAuditor
              as_user_id: "${aud_id}"
              captures: { sess_id: $.data.id }
            - call: "POST /audit-sessions/${sess_id}/start"
              payload: {}
              as: InternalAuditor
              as_user_id: "${aud_id}"
            - call: "POST /audit-sessions/${sess_id}/scan"
              payload: { barcode: "${item_barcode}" }
              as: InternalAuditor
              as_user_id: "${aud_id}"
            - call: "POST /audit-sessions/${sess_id}/reconcile"
              payload: {}
              as: InternalAuditor
              as_user_id: "${aud_id}"
            - call: "GET /discrepancies?audit_session_id=${sess_id}"
              payload: {}
              as: PropertyRoomManager
              captures: { disc_id: "$.data[0].id", disc_kind: "$.data[0].kind" }
          trigger:
            - call: "POST /discrepancies/${disc_id}/resolve"
              payload: { resolution: "WRITTEN_OFF", resolution_note: "Accepting the loss" }
              as: PropertyRoomManager
              captures: { err: $.data.error_id }
            - call: "POST /discrepancies/${disc_id}/resolve"
              payload: { resolution: "FOUND", resolution_note: "Camera relocated into G-09" }
              as: PropertyRoomManager
              captures: { status_after: $.data.status }
          assert:
            - "${disc_kind} == 'MISPLACED' (the item's storage_location_id was G-02, not the audited G-09)"
            - "Responds 422 with ${err} == 'ERR_DISCREPANCY_RESOLUTION_NOT_PERMITTED': WRITTEN_OFF is reserved for MISSING discrepancies, because writing off a located item would purge evidence that is demonstrably present"
            - "${status_after} == 'RESOLVED_FOUND' on the FOUND attempt, so only the resolution kind was at fault"
            - "GET /evidence-items/${item_id} shows custody_state == 'STORED' throughout — the refused WRITTEN_OFF never reached the MISSING -> PURGED transition"

      - name: storage_assignment_to_full_location_rejected
        claim_type: Aggregate validation
        grounds:
          - "validations[priority=33]"
          - "entities.StorageLocation.fields.capacity_slots"
          - "calculations.location_occupied_slots"
          - "errors[ERR_STORAGE_LOCATION_FULL]"
        test_recipe:
