# =============================================================================
# SCAFFOLD.yaml — §1.0–§1.7 seed tables
# Task 2993 — Coal Combustion Residual Closure & Groundwater Monitoring
# =============================================================================
scenario: |
  2993. Coal Combustion Residual Closure & Groundwater Monitoring (electric
  utility ash management program): impoundment and landfill inventory with
  structural stability assessments and location restrictions, groundwater
  monitoring network design with background wells, sampling frequency and
  statistical evaluation methods, statistically significant increase
  determination triggering assessment monitoring and corrective action, closure
  method selection between closure-in-place and removal with engineering and
  cost analysis, closure timeline compliance with extensions and demonstration
  requirements, beneficial reuse of ash in concrete and other products with
  quality and market development, post-closure care with cap maintenance and
  continued monitoring, public posting requirements and community engagement

domain_name: coal-combustion-residual-closure
api_prefix: "/ccr"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: posture_driven_gating
  difficulty_level: expert_plus
  complexity_layers:
    - rate_threshold_triggers
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency

  entity_topology: flat
  # Every entity is a peer addressed at `/ccr/<collection>/{id}`; parentage is
  # expressed purely through FK body fields, never through nested URL paths.
  # Action endpoints hang off the owning resource (`/ccr/units/{id}/begin-closure`)
  # but no entity is addressed through another entity's path.

  state_machine_shape: cyclic
  # MonitoringProgram.phase cycles DETECTION -> ASSESSMENT -> DETECTION and
  # DETECTION -> ASSESSMENT -> CORRECTIVE_ACTION -> DETECTION; ClosurePlan.status
  # is a fork-join diamond with a return-to-draft edge; DisposalUnit carries two
  # independent state dimensions (closure_state x cap_integrity_state) and
  # cap_integrity_state itself cycles ADEQUATE -> DEFICIENT -> ADEQUATE.

  relationship_patterns:
    - one_to_many          # DisposalUnit -> MonitoringWell / PublicPosting / ...
    - cross_aggregate      # AnalyticalResult references both SamplingEvent and MonitoringWell
    - polymorphic_obligation  # PublicPosting.posting_type selects which unit obligation it satisfies

  role_model: segregation_of_duties
  # A ClosurePlan's engineering certification and cost certification must be
  # signed by two different QualifiedProfessional identities; discipline gates
  # decide which professional may sign which artifact.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: DisposalUnit
    parent: null
    common_fields: true
    fields:
      - name: unit_code
        type: string
        source: input
        description: "Operator-assigned identifier for the CCR unit"
        constraints: "6-12 characters, uppercase A-Z 0-9 and hyphen only; globally unique across DisposalUnit"
      - name: unit_name
        type: string
        source: input
        description: "Human-readable unit name"
        constraints: "1-120 characters"
      - name: unit_type
        type: enum
        source: input
        description: "Regulatory unit category; drives base closure timeline and extension cap"
        constraints: "SURFACE_IMPOUNDMENT | LANDFILL"
      - name: plant_code
        type: string
        source: input
        description: "Electric generating station that owns the unit"
        constraints: "4-8 characters, uppercase A-Z 0-9"
      - name: liner_class
        type: enum
        source: input
        description: "Engineered liner category; input to location restriction and method recommendation"
        constraints: "UNLINED | CLAY_LINED | COMPOSITE_LINED"
      - name: hazard_potential_class
        type: enum
        source: input
        description: "Dam-failure hazard classification of the impoundment or landfill embankment"
        constraints: "LOW | SIGNIFICANT | HIGH"
      - name: original_ash_in_place_tons
        type: integer
        source: input
        description: "Ash tonnage in the unit at registration; the conserved total for the ash mass-balance invariant"
        constraints: ">= 1"
      - name: ash_in_place_tons
        type: integer
        source: computed
        description: "Current ash tonnage remaining in the unit; equals original_ash_in_place_tons minus the sum of tons over ReuseShipment rows with status == SHIPPED"
        constraints: ">= 0"
      - name: cessation_date
        type: string
        source: input
        description: "Calendar date the unit stopped receiving CCR; anchors the closure deadline"
        constraints: "ISO 8601 calendar date YYYY-MM-DD; must be <= current logical clock date"
      - name: uppermost_aquifer_separation_ft
        type: number
        source: input
        description: "Vertical separation between the unit base and the uppermost aquifer, in feet"
        constraints: ">= 0, at most 2 decimal places"
      - name: wetland_distance_ft
        type: number
        source: input
        description: "Horizontal distance from the unit boundary to the nearest wetland, in feet"
        constraints: ">= 0, at most 2 decimal places"
      - name: seismic_pga_g
        type: number
        source: input
        description: "Peak ground acceleration of the design earthquake, in units of g"
        constraints: ">= 0, at most 3 decimal places"
      - name: fault_distance_ft
        type: number
        source: input
        description: "Horizontal distance to the nearest Holocene fault, in feet"
        constraints: ">= 0, at most 2 decimal places"
      - name: unstable_area_flag
        type: boolean
        source: input
        description: "True when the unit sits in an area with documented karst, mine subsidence, or slope instability"
      - name: location_restriction_verdict
        type: enum
        source: computed
        description: "Output of calculations.location_restriction_verdict, recomputed only at unit creation"
        constraints: "UNRESTRICTED | RESTRICTED_DEMONSTRATION_REQUIRED | DISQUALIFIED"
      - name: demonstration_required
        type: boolean
        source: computed
        description: "True exactly when location_restriction_verdict == RESTRICTED_DEMONSTRATION_REQUIRED"
      - name: closure_state
        type: enum
        source: system
        description: "Closure lifecycle dimension; independent of cap_integrity_state"
        default: ACTIVE
        constraints: "ACTIVE | CLOSURE_PLANNED | CLOSING | POST_CLOSURE_CARE | CARE_COMPLETE"
      - name: cap_integrity_state
        type: enum
        source: system
        description: "Final-cover condition dimension; independent of closure_state"
        default: NOT_APPLICABLE
        constraints: "NOT_APPLICABLE | ADEQUATE | DEFICIENT"
      - name: compliance_posture
        type: enum
        source: computed
        description: "Derived gate over child operations; output of calculations.compliance_posture, evaluated on every read and every write of the unit or any of its children. Recomputation never bumps version or updated_at"
        constraints: "COMPLIANT | WATCH | RESTRICTED | FROZEN"
      - name: governing_stability_verdict
        type: enum
        source: computed
        description: "Verdict of the governing StabilityAssessment for this unit (highest assessed_on, tie-break latest created_at); UNASSESSED when the unit has no assessment"
        constraints: "UNASSESSED | ADEQUATE | DEFICIENT"
      - name: monitoring_program_id
        type: string
        source: computed
        description: "FK -> MonitoringProgram.id; the single monitoring program cascade-created by POST /ccr/units"
      - name: granted_extension_months
        type: integer
        source: computed
        description: "Sum of granted_months over ClosureExtensionRequest rows for this unit with status == GRANTED; the conserved total for the regulatory-relief invariant"
        default: 0
        constraints: ">= 0"
      - name: closure_deadline_date
        type: string
        source: computed
        description: "Output of calculations.closure_deadline_date"
        constraints: "ISO 8601 calendar date YYYY-MM-DD"
      - name: closure_initiated_on
        type: string
        source: system
        description: "Logical clock date on which POST /ccr/units/{id}/begin-closure succeeded; null before that"
        default: null
      - name: closure_completed_on
        type: string
        source: system
        description: "completed_on supplied to POST /ccr/units/{id}/complete-closure; null before that"
        default: null
      - name: closure_timeliness
        type: enum
        source: computed
        description: "PENDING until closure is initiated; ON_TIME once closure_initiated_on is set and either closure_completed_on is set or the current logical clock date is still on or before closure_deadline_date; LATE when closure has been initiated, closure_completed_on is still null and the current logical clock date is past closure_deadline_date. Re-derived on every read of the unit and after every clock move, so a closure that began on time but runs past the deadline flips ON_TIME -> LATE"
        default: PENDING
        constraints: "PENDING | ON_TIME | LATE"
      - name: post_closure_care_start_on
        type: string
        source: system
        description: "Equals closure_completed_on; null before closure completion"
        default: null
      - name: deficiency_extension_months
        type: integer
        source: computed
        description: "Output of calculations.post_closure_care_end_date step 2; 12 months per DEFICIENT CapInspection, capped at 60"
        default: 0
        constraints: "0 <= value <= 60"
      - name: post_closure_care_end_date
        type: string
        source: computed
        description: "Output of calculations.post_closure_care_end_date; null before closure completion"
        default: null
      - name: cap_repair_due_date
        type: string
        source: computed
        description: "inspected_on of the CapInspection that drove cap_integrity_state to DEFICIENT plus 60 days; null while cap_integrity_state != DEFICIENT"
        default: null
      - name: ssi_notice_due_date
        type: string
        source: system
        description: "Public-posting obligation date for SSI_NOTIFICATION; set to determined_on + 30 days by the SSI cascade"
        default: null
      - name: stability_posting_due_date
        type: string
        source: system
        description: "Public-posting obligation date for STABILITY_ASSESSMENT; set to assessed_on + 30 days on EVERY stability assessment, ADEQUATE or DEFICIENT, and always re-derived from the governing assessment"
        default: null
      - name: closure_plan_posting_due_date
        type: string
        source: system
        description: "Public-posting obligation date for CLOSURE_PLAN; set to approved_on + 60 days on plan approval"
        default: null
      - name: extension_demonstration_due_date
        type: string
        source: system
        description: "Public-posting obligation date for EXTENSION_DEMONSTRATION; set to the request's creation date + 14 days when a ClosureExtensionRequest is created"
        default: null
      - name: overdue_posting_types
        type: array
        source: computed
        description: "Sorted-ascending list of posting_type values whose obligation date is strictly before the current logical clock date and that no POSTED PublicPosting of that type satisfies"
      - name: late_posting_count
        type: integer
        source: computed
        description: "Count of POSTED PublicPosting rows for this unit whose posted_on is strictly after their obligation date"
        default: 0
      - name: ash_mass_balance_ok
        type: boolean
        source: computed
        description: "True exactly when ash_in_place_tons plus the sum of tons over SHIPPED ReuseShipment rows equals original_ash_in_place_tons"

  - name: QualifiedProfessional
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Licensed professional name as it appears on the certification"
        constraints: "1-120 characters"
      - name: license_number
        type: string
        source: input
        description: "State-issued professional license number"
        constraints: "4-20 characters, uppercase A-Z 0-9 and hyphen; unique per license_state"
      - name: license_state
        type: string
        source: input
        description: "Two-letter USPS code of the licensing state"
        constraints: "exactly 2 uppercase letters"
      - name: discipline
        type: enum
        source: input
        description: "Practice discipline; gates which artifacts this professional may certify"
        constraints: "GEOTECHNICAL | CIVIL | HYDROGEOLOGY | STATISTICS"
      - name: license_status
        type: enum
        source: input
        description: "Current standing of the license; ACTIVE is required to certify anything"
        default: ACTIVE
        constraints: "ACTIVE | SUSPENDED | LAPSED"
      - name: license_status_effective_on
        type: string
        source: system
        description: "effective_on supplied by the most recent POST /ccr/professionals/{id}/license-status; equals created_at date when never changed"
        constraints: "ISO 8601 calendar date YYYY-MM-DD"

  - name: StabilityAssessment
    parent: null
    common_fields: false
    description_note: "Append-only certification record; never mutated after creation"
    fields:
      - name: unit_id
        type: string
        source: input
        description: "FK -> DisposalUnit.id; the assessed unit"
      - name: certifying_professional_id
        type: string
        source: system
        description: "FK -> QualifiedProfessional.id; taken from the X-User-ID header of the acting ProfessionalEngineer, never from the body"
      - name: assessed_on
        type: string
        source: input
        description: "Calendar date the field assessment was performed"
        constraints: "ISO 8601 calendar date YYYY-MM-DD; must be <= current logical clock date"
      - name: factor_of_safety_static
        type: number
        source: input
        description: "Computed static factor of safety of the critical slope section"
        constraints: "> 0, at most 2 decimal places"
      - name: factor_of_safety_seismic
        type: number
        source: input
        description: "Computed seismic factor of safety of the critical slope section"
        constraints: "> 0, at most 2 decimal places"
      - name: factor_of_safety_liquefaction
        type: number
        source: input
        description: "Computed liquefaction factor of safety of the critical slope section"
        constraints: "> 0, at most 2 decimal places"
      - name: verdict
        type: enum
        source: computed
        description: "Output of calculations.stability_assessment_verdict"
        constraints: "ADEQUATE | DEFICIENT"
      - name: deficient_criteria
        type: array
        source: computed
        description: "Sorted-ascending list of the criterion names that failed: any of STATIC, SEISMIC, LIQUEFACTION; empty when verdict == ADEQUATE"
      - name: superseded
        type: boolean
        source: computed
        description: "True when another StabilityAssessment for the same unit_id ranks higher by (assessed_on DESC, created_at DESC)"

  - name: MonitoringWell
    parent: null
    common_fields: true
    fields:
      - name: unit_id
        type: string
        source: input
        description: "FK -> DisposalUnit.id; the unit whose network this well belongs to"
      - name: well_code
        type: string
        source: input
        description: "Well identifier stencilled on the casing"
        constraints: "3-16 characters, uppercase A-Z 0-9 and hyphen; unique per unit_id"
      - name: well_role
        type: enum
        source: input
        description: "Network position; BACKGROUND wells establish the interwell background data set"
        constraints: "BACKGROUND | DOWNGRADIENT"
      - name: aquifer_zone
        type: string
        source: input
        description: "Screened hydrostratigraphic zone label"
        constraints: "1-40 characters"
      - name: screen_top_ft
        type: number
        source: input
        description: "Depth below ground surface to the top of the screened interval, in feet"
        constraints: ">= 0, at most 2 decimal places"
      - name: screen_bottom_ft
        type: number
        source: input
        description: "Depth below ground surface to the bottom of the screened interval, in feet"
        constraints: "> screen_top_ft, at most 2 decimal places"
      - name: installed_on
        type: string
        source: input
        description: "Calendar date the well was completed"
        constraints: "ISO 8601 calendar date YYYY-MM-DD; must be <= current logical clock date"
      - name: well_status
        type: enum
        source: system
        description: "Wells are created CERTIFIED by a licensed Hydrogeologist and may only leave that state by decommissioning"
        default: CERTIFIED
        constraints: "CERTIFIED | DECOMMISSIONED"
      - name: decommissioned_on
        type: string
        source: system
        description: "decommissioned_on supplied to POST /ccr/wells/{id}/decommission; null while CERTIFIED"
        default: null
      - name: decommission_reason
        type: string
        source: system
        description: "reason supplied to POST /ccr/wells/{id}/decommission; null while CERTIFIED"
        default: null

  - name: MonitoringProgram
    parent: null
    common_fields: true
    fields:
      - name: unit_id
        type: string
        source: input
        description: "FK -> DisposalUnit.id; exactly one program per unit, cascade-created with the unit"
      - name: phase
        type: enum
        source: system
        description: "Monitoring phase; cycles between detection, assessment and corrective action"
        default: DETECTION
        constraints: "DETECTION | ASSESSMENT | CORRECTIVE_ACTION"
      - name: network_certified
        type: boolean
        source: system
        description: "True after a Hydrogeologist certifies the network design meets the minimum well counts"
        default: false
      - name: network_certified_on
        type: string
        source: system
        description: "certified_on supplied to POST /ccr/monitoring-programs/{id}/certify-network"
        default: null
      - name: network_certified_by
        type: string
        source: system
        description: "FK -> QualifiedProfessional.id; X-User-ID of the certifying Hydrogeologist"
        default: null
      - name: statistical_method
        type: enum
        source: input
        description: "Statistical test applied by calculations.background_statistical_limit"
        default: PARAMETRIC_PREDICTION_INTERVAL
        constraints: "PARAMETRIC_PREDICTION_INTERVAL | NONPARAMETRIC_PREDICTION_INTERVAL"
      - name: comparison_basis
        type: enum
        source: input
        description: "Selects which background data set the statistical limit is built from"
        default: INTERWELL
        constraints: "INTERWELL | INTRAWELL"
      - name: sampling_frequency
        type: enum
        source: system
        description: "Required sampling cadence; escalates to QUARTERLY on assessment entry or cap deficiency"
        default: SEMIANNUAL
        constraints: "SEMIANNUAL | QUARTERLY"
      - name: background_window_start_on
        type: string
        source: input
        description: "Inclusive lower bound on sampled_on for results eligible as background data"
        default: null
        constraints: "ISO 8601 calendar date YYYY-MM-DD; <= background_window_end_on"
      - name: background_window_end_on
        type: string
        source: input
        description: "Inclusive upper bound on sampled_on for results eligible as background data"
        default: null
        constraints: "ISO 8601 calendar date YYYY-MM-DD; >= background_window_start_on"
      - name: background_well_count
        type: integer
        source: computed
        description: "Count of MonitoringWell rows for this unit with well_role == BACKGROUND and well_status == CERTIFIED"
        default: 0
      - name: downgradient_well_count
        type: integer
        source: computed
        description: "Count of MonitoringWell rows for this unit with well_role == DOWNGRADIENT and well_status == CERTIFIED"
        default: 0
      - name: last_validated_event_id
        type: string
        source: computed
        description: "FK -> SamplingEvent.id; the VALIDATED event of this program ranking highest by (sampled_on DESC, created_at DESC); null when none"
        default: null
      - name: next_sampling_due_date
        type: string
        source: computed
        description: "Output of calculations.next_sampling_due_date; null until a first VALIDATED event exists"
        default: null
      - name: assessment_entered_on
        type: string
        source: system
        description: "Logical clock date on which phase last became ASSESSMENT"
        default: null
      - name: corrective_action_entered_on
        type: string
        source: system
        description: "Logical clock date on which phase last became CORRECTIVE_ACTION"
        default: null
      - name: remedy_base_cost_usd_cents
        type: integer
        source: input
        description: "Engineer's estimate of the selected remedy excluding contingency and oversight, in USD cents"
        default: null
        constraints: ">= 1"
      - name: remedy_duration_years
        type: integer
        source: input
        description: "Expected years of remedy operation"
        default: null
        constraints: "1 <= value <= 60"
      - name: remedy_description
        type: string
        source: input
        description: "Narrative of the selected corrective measure"
        default: null
        constraints: "1-500 characters"
      - name: assurance_amount_usd_cents
        type: integer
        source: computed
        description: "Output of calculations.corrective_action_assurance_amount; null until the assurance endpoint is called"
        default: null

  - name: SamplingEvent
    parent: null
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: "FK -> MonitoringProgram.id; the program this sampling round belongs to"
      - name: submitted_by_professional_id
        type: string
        source: system
        description: "FK -> QualifiedProfessional.id; X-User-ID of the acting Hydrogeologist"
      - name: event_code
        type: string
        source: input
        description: "Field round identifier"
        constraints: "3-20 characters, uppercase A-Z 0-9 and hyphen; unique per program_id"
      - name: event_type
        type: enum
        source: input
        description: "BACKGROUND rounds build the background data set; DETECTION and ASSESSMENT rounds supply comparison values"
        constraints: "BACKGROUND | DETECTION | ASSESSMENT"
      - name: sampled_on
        type: string
        source: input
        description: "Calendar date the round was collected in the field"
        constraints: "ISO 8601 calendar date YYYY-MM-DD; must be <= current logical clock date"
      - name: status
        type: enum
        source: system
        description: "Only VALIDATED rounds feed statistical evaluation"
        default: DRAFT
        constraints: "DRAFT | VALIDATED | REJECTED"
      - name: result_count
        type: integer
        source: computed
        description: "Count of AnalyticalResult rows whose sampling_event_id is this event"
        default: 0
      - name: validated_on
        type: string
        source: system
        description: "validated_on supplied to POST /ccr/sampling-events/{id}/validate"
        default: null
      - name: rejection_reason
        type: enum
        source: system
        description: "Set when validation lands in REJECTED; NO_RESULTS when result_count == 0, WELL_DECOMMISSIONED when any result's well is DECOMMISSIONED"
        default: null
        constraints: "NO_RESULTS | WELL_DECOMMISSIONED"

  - name: AnalyticalResult
    parent: null
    common_fields: false
    description_note: "Append-only laboratory record; never mutated after creation"
    fields:
      - name: sampling_event_id
        type: string
        source: input
        description: "FK -> SamplingEvent.id; the round this result belongs to"
      - name: well_id
        type: string
        source: input
        description: "FK -> MonitoringWell.id; the well the aliquot came from"
      - name: parameter_code
        type: enum
        source: input
        description: "Monitored constituent; BORON, SULFATE and CHLORIDE are detection-monitoring parameters, the rest carry groundwater protection standards"
        constraints: "BORON | SULFATE | CHLORIDE | ARSENIC | LITHIUM | MOLYBDENUM | RADIUM_226_228"
      - name: concentration
        type: number
        source: input
        description: "Reported concentration; ignored for background statistics when detection_flag == NON_DETECT"
        constraints: ">= 0, at most 4 decimal places"
      - name: unit_of_measure
        type: enum
        source: input
        description: "MG_PER_L for every parameter except RADIUM_226_228, which uses PCI_PER_L"
        constraints: "MG_PER_L | PCI_PER_L"
      - name: detection_flag
        type: enum
        source: input
        description: "NON_DETECT results enter statistics at half the reporting limit"
        constraints: "DETECTED | NON_DETECT"
      - name: reporting_limit
        type: number
        source: input
        description: "Laboratory reporting limit; required when detection_flag == NON_DETECT"
        default: null
        constraints: "> 0, at most 4 decimal places"
      - name: effective_value
        type: number
        source: computed
        description: "concentration when detection_flag == DETECTED; round_half_up(reporting_limit / 2, 4) when NON_DETECT"

  - name: StatisticalEvaluation
    parent: null
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: "FK -> MonitoringProgram.id; the program whose data set is evaluated"
      - name: compliance_well_id
        type: string
        source: input
        description: "FK -> MonitoringWell.id; the downgradient well whose measurement is compared against the limit"
      - name: reviewing_professional_id
        type: string
        source: system
        description: "FK -> QualifiedProfessional.id; X-User-ID of the acting StatisticalReviewer"
      - name: asd_certifying_professional_id
        type: string
        source: system
        description: "FK -> QualifiedProfessional.id; certifying_professional_id supplied with the alternate source demonstration"
        default: null
      - name: comparison_source_event_id
        type: string
        source: computed
        description: "FK -> SamplingEvent.id; the VALIDATED DETECTION or ASSESSMENT round that supplied comparison_value"
      - name: evaluation_code
        type: string
        source: input
        description: "Reviewer-assigned evaluation identifier"
        constraints: "3-20 characters, uppercase A-Z 0-9 and hyphen; unique per program_id"
      - name: parameter_code
        type: enum
        source: input
        description: "Constituent under evaluation"
        constraints: "BORON | SULFATE | CHLORIDE | ARSENIC | LITHIUM | MOLYBDENUM | RADIUM_226_228"
      - name: method_used
        type: enum
        source: computed
        description: "Snapshot of the program's statistical_method at evaluation time"
        constraints: "PARAMETRIC_PREDICTION_INTERVAL | NONPARAMETRIC_PREDICTION_INTERVAL"
      - name: comparison_basis_used
        type: enum
        source: computed
        description: "Snapshot of the program's comparison_basis at evaluation time"
        constraints: "INTERWELL | INTRAWELL"
      - name: background_n
        type: integer
        source: computed
        description: "Number of background effective_value observations that entered the limit"
        constraints: ">= 4"
      - name: background_mean
        type: number
        source: computed
        description: "Arithmetic mean of the background effective_value set, rounded half-up to 4 decimals for reporting only"
      - name: background_stdev
        type: number
        source: computed
        description: "Sample standard deviation (n-1 denominator) of the background effective_value set, rounded half-up to 6 decimals for reporting only"
      - name: background_upper_limit
        type: number
        source: computed
        description: "Output of calculations.background_statistical_limit, rounded half-up to 4 decimals"
      - name: comparison_value
        type: number
        source: computed
        description: "effective_value of the compliance well measurement selected by calculations.background_statistical_limit step 5"
      - name: verdict
        type: enum
        source: computed
        description: "Output of calculations.statistical_verdict; NO_SSI_ALTERNATE_SOURCE only via an accepted alternate source demonstration"
        constraints: "NO_SSI | SSI | SSL_EXCEEDANCE | NO_SSI_ALTERNATE_SOURCE"
      - name: retest_confirmed
        type: boolean
        source: input
        description: "True when the reviewer certifies a verification resample reproduced the exceedance; a first exceedance without a retest still yields SSI but never SSL_EXCEEDANCE"
        default: false
      - name: determined_on
        type: string
        source: computed
        description: "Logical clock date on which the evaluation was issued"
        constraints: "ISO 8601 calendar date YYYY-MM-DD"
      - name: status
        type: enum
        source: system
        description: "Alternate source demonstration lifecycle over an issued evaluation"
        default: ISSUED
        constraints: "ISSUED | ASD_UNDER_REVIEW | ASD_ACCEPTED | ASD_REJECTED"
      - name: asd_deadline_date
        type: string
        source: computed
        description: "determined_on + 90 days when verdict is SSI or SSL_EXCEEDANCE; null otherwise"
        default: null
      - name: asd_submitted_on
        type: string
        source: system
        description: "submitted_on of the most recent alternate source demonstration submission"
        default: null
      - name: asd_decided_on
        type: string
        source: system
        description: "decided_on of the most recent regulator decision on the demonstration"
        default: null
      - name: asd_narrative
        type: string
        source: system
        description: "alternate_source_narrative of the most recent submission"
        default: null

