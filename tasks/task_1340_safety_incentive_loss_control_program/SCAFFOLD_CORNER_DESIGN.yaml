            - { call: "POST /safety/programs/${p_id}/activate", payload: {}, as: EHSAdmin }
            - { call: "POST /safety/job-roles", payload: { title: "Laborer", hazard_class: "LOW" }, as: EHSAdmin, captures: { jr_id: $.data.id } }
            - { call: "POST /safety/employees", payload: { full_name: "Ann A", job_role_id: "${jr_id}", hired_on: "2026-01-05" }, as: EHSAdmin, captures: { a_id: $.data.id } }
            - { call: "POST /safety/employees", payload: { full_name: "Marta M", job_role_id: "${jr_id}", hired_on: "2026-01-05" }, as: EHSAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /safety/hazards", payload: { program_id: "${p_id}", location: "L1", description: "Noise", identified_by: "${a_id}" }, as: SafetyManager, as_user_id: "${m_id}", captures: { h_id: $.data.id, v1: $.data.version } }
          trigger:
            - { call: "POST /safety/hazards/${h_id}/assess", payload: { severity: 3, probability: 2 }, as: SafetyManager, as_user_id: "${m_id}", captures: { v2: $.data.version } }
            - { call: "POST /safety/hazards/${h_id}/controls", payload: { description: "Enclosure", implementer_id: "${a_id}", due_date: "2026-06-20T00:00:00Z" }, as: SafetyManager, as_user_id: "${m_id}" }
            - { call: "GET /safety/hazards/${h_id}", payload: {}, as: SafetyManager, as_user_id: "${m_id}", captures: { v3: $.data.version } }
