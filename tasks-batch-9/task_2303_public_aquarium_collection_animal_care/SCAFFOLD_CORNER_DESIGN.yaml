  - name: layer_occ_exhibit_patch_rejects_a_version_stale_by_one_placement
    claim_type: optimistic_concurrency
    grounds:
    - §1.2.1 concurrency_rules exhibit-config-stale-version
    - §1.6 ERR_STALE_EXHIBIT_VERSION (412)
    - §1.4 priority 9
    - §1.5 PATCH /aquarium/exhibits/{id}
    - §1.1 Exhibit.version
    distinguishing_aspect: The director reads the exhibit, a technician's placement bumps the version, and the director's otherwise-valid re-capacitation is refused with 412 — then succeeds verbatim once re-read. The rejected PATCH must not apply partially and must not itself bump the version.
    test_recipe:
