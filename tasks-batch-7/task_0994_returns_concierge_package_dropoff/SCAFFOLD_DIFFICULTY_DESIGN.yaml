            - { call: "POST /v1/dropoff-locations", payload: { name: "L-Time", kind: LOCKER, postal_code: "20006" }, as: PlatformAdmin, captures: { loc_id: $.data.id } }
            - { call: "POST /v1/dropoff-locations/${loc_id}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/dropoff-locations/${loc_id}/locker-slots", payload: { size_class: XL }, as: PlatformAdmin, captures: { slot1: $.data.id } }
            - { call: "POST /v1/dropoff-locations/${loc_id}/locker-slots", payload: { size_class: XL }, as: PlatformAdmin, captures: { slot2: $.data.id } }
            - { call: "POST /v1/return-orders", payload: { shopper_id: "${sh_id}", merchant_id: "${m_id}", method: LOCKER_QR, items: [ { sku: "TI1", quantity: 1, unit_price_cents: 100, declared_condition: NEW, longest_side_cm: 20, weight_grams: 100 } ] }, as: Shopper, as_user_id: "${sh_id}", captures: { ro1: $.data.id } }
            - { call: "POST /v1/slot-reservations", payload: { return_order_id: "${ro1}", slot_id: "${slot1}" }, as: Shopper, as_user_id: "${sh_id}", captures: { res1: $.data.id } }
            - { call: "POST /v1/return-orders", payload: { shopper_id: "${sh_id}", merchant_id: "${m_id}", method: LOCKER_QR, items: [ { sku: "TI2", quantity: 1, unit_price_cents: 100, declared_condition: NEW, longest_side_cm: 20, weight_grams: 100 } ] }, as: Shopper, as_user_id: "${sh_id}", captures: { ro2: $.data.id } }
            - { call: "POST /v1/slot-reservations", payload: { return_order_id: "${ro2}", slot_id: "${slot2}" }, as: Shopper, as_user_id: "${sh_id}", captures: { res2: $.data.id } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-02T23:59:59Z" }, as: PlatformAdmin }
