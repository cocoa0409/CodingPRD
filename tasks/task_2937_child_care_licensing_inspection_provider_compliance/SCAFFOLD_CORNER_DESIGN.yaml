              as: BackgroundCheckUnit
            - call: "POST /licensing/age-group-rosters"
              payload: { provider_id: "${prov}", age_group: "PRESCHOOL", requested_group_size: 10, lead_staff_member_id: "${dir}" }
              as: Applicant
              as_user_id: "${prov}"
            - call: "POST /licensing/providers/${prov}/submit-application"
              as: Applicant
              as_user_id: "${prov}"
            - call: "POST /licensing/providers/${prov}/clear-checks"
              as: LicensingSupervisor
            - call: "POST /licensing/inspectors"
              payload: { full_name: "Ivy Cole", county_code: "CTY-01", certified_age_groups: ["PRESCHOOL"] }
              as: AgencyAdmin
              captures: { insp: $.data.id }
            - call: "POST /licensing/inspections"
              payload: { provider_id: "${prov}", inspector_id: "${insp}", inspection_type: "INITIAL", scheduled_for: "2026-08-05T09:00:00Z", target_age_groups: ["PRESCHOOL"] }
              as: LicensingSupervisor
              captures: { ins_init: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: AgencyAdmin
            - call: "POST /licensing/inspections/${ins_init}/start"
              as: LicensingInspector
              as_user_id: "${insp}"
            - call: "POST /licensing/inspections/${ins_init}/submit-for-review"
              payload: { outcome: "PASS", age_groups_observed: ["PRESCHOOL"] }
              as: LicensingInspector
              as_user_id: "${insp}"
            - call: "POST /licensing/inspections/${ins_init}/finalize"
              as: LicensingSupervisor
            - call: "POST /licensing/providers/${prov}/license-decision"
              payload: { decision: "ISSUE" }
              as: LicensingSupervisor
              captures: { lic_st: $.data.license_status }
          trigger:
            - call: "POST /licensing/providers/${prov}/promote-to-full"
              as: LicensingSupervisor
              captures: { e_early: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-02-05T09:00:00Z" }
              as: AgencyAdmin
            - call: "POST /licensing/inspections"
              payload: { provider_id: "${prov}", inspector_id: "${insp}", inspection_type: "ANNUAL", scheduled_for: "2027-02-10T09:00:00Z", target_age_groups: ["PRESCHOOL"] }
              as: LicensingSupervisor
              captures: { ins_ann: $.data.id }
            - call: "POST /_clock/set_current_utc"
