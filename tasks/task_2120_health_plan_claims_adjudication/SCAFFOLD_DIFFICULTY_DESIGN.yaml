            - call: "POST /adjudication/edit-rules"
              payload: { rule_code: "MP-73721-AUTH-E", edit_type: "AUTH_REQUIRED", primary_code: "73721", severity: "PEND", precedence_rank: 30, reason_code: "PEND_AUTH_MISSING" }
              as: PlanAdmin
            - call: "POST /adjudication/members"
