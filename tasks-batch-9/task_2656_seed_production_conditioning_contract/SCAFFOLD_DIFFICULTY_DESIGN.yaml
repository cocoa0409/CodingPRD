  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: bagging_reversal_preserves_lot_mass
        grounds:
          - calculations.lot_mass_reconciliation
          - state_machines.ConditioningRun.COMPLETED_to_REVERSED
          - state_machines.SeedLot.conditioning_reversal_compensation
        distinguishing_aspect: |
          CONSERVED QUANTITY: physical mass, expressed as gross_kg == current_kg + cumulative_shrink_kg. The
          reversal of the BAGGING run must subtract exactly the shrink that run added and restore the derived
          bag and unit fields to their pre-run nulls, leaving the identity satisfied with zero drift at
          two-decimal precision - the tell-tale bug is a lot that reports 41000.0 gross against
          36000.0 + 6498.75.
        test_recipe:
          setup:
            - "Golden lot harvested at 41000.0 kg, cleaned to 37800.0 kg, sized to 36000.0 kg and bagged to 34501.25 kg"
            - "After bagging: cumulative_shrink_kg 6498.75, bag_count 1380, final_clean_units 1380.05"
            - "The lot has not been tagged, so the reversal precondition certification_status != TAGGED holds"
            - "Logical clock at 2026-09-14T00:00:00Z"
          setup_api_calls:
            - call: "POST /seed-ops/varieties"
              payload: { crop_kind: "WHEAT", variety_name: "HRW-Sable", max_seed_class: "CERTIFIED", isolation_min_m: 200.0, restricted_prior_crop_kinds: ["WHEAT", "TRITICALE"], restricted_prior_crop_years: 3, germination_min_pct: 85.0, purity_min_pct: 97.0, max_off_type_per_10000: 10.0, max_restricted_weed_per_10000: 5.0, max_disease_incidence_pct: 2.0, max_rogueing_rounds: 2, estimated_conditioning_shrink_pct: 8.0, germ_validity_days: 270, max_carryover_generations: 2, treatment_required: false }
