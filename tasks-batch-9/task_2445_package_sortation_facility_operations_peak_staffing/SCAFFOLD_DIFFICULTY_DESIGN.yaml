              payload: { sort_center_id: "${center_id}", door_id: "${door_in_id}", trailer_code: "T-C", window_start: "2026-08-03T07:15:00Z", window_end: "2026-08-03T08:15:00Z", priority_class: "STANDARD", manifest_package_count: 1000 }
