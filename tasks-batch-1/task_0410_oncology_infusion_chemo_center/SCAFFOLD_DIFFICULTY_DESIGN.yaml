              as: Pharmacist
              captures: { cyc_id: $.data.id }
            - call: "POST /infusion-center/treatment-cycles/${cyc_id}/activate"
              payload: {}
              as: Pharmacist
              captures: { cyc_v1: $.data.version }
            - call: "POST /infusion-center/infusion-appointments"
              payload: { treatment_cycle_id: "${cyc_id}", chair_id: "${chair_p}", nurse_id: "${nurse_id}", start_at: "2026-07-01T09:00:00Z", end_at: "2026-07-01T10:30:00Z", acuity: 4, expected_treatment_cycle_version: "${cyc_v1}" }
              as: Pharmacist
              captures: { appt1: $.data.id }
          trigger:
            - call: "POST /infusion-center/infusion-appointments"
              payload: { treatment_cycle_id: "${cyc_id}", chair_id: "${chair_q}", nurse_id: "${nurse_id}", start_at: "2026-07-01T09:30:00Z", end_at: "2026-07-01T10:00:00Z", acuity: 4, expected_treatment_cycle_version: "${cyc_v1}" }
              as: Pharmacist
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NURSE_ACUITY_EXCEEDED"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: invariant_pa_units_conserved_on_administer
        grounds:
          - calculations.prior_auth_consumed_units
          - state_machines.DrugOrder.VERIFIED_to_ADMINISTERED
          - entities.PriorAuthorization.fields.authorized_units_mg
          - entities.PriorAuthorization.fields.consumed_units_mg
        distinguishing_aspect: |
          Conserved quantity #1 = authorized PA units: across an administer,
          (remaining = authorized_units_mg - consumed_units_mg) must move by exactly
          the order's administered_dose_mg. Authorized 600, administer 525 =>
          consumed 525, remaining 75; the invariant authorized == remaining +
          consumed (600 == 75 + 525) holds with zero drift.
        test_recipe:
          setup:
            - "Approved PA authorized 600; ACTIVE cycle; one AUC CHEMO order (525 mg) VERIFIED, linked to PA"
          setup_api_calls:
            - call: "POST /infusion-center/patients"
              payload: { mrn: "M17", full_name: "P Seventeen", height_cm: 170, weight_kg: 70, gfr_ml_min: 80 }
              as: Pharmacist
              captures: { pat_id: $.data.id }
            - call: "POST /infusion-center/nurses"
              payload: { full_name: "Np1", is_chemo_certified: true }
              as: Pharmacist
              captures: { np1: $.data.id }
            - call: "POST /infusion-center/nurses"
              payload: { full_name: "Np2", is_chemo_certified: true }
              as: Pharmacist
              captures: { np2: $.data.id }
            - call: "POST /infusion-center/prior-authorizations"
              payload: { patient_id: "${pat_id}", drug_name: "SpecialtyX", payer: "Acme" }
              as: PriorAuthCoordinator
              captures: { pa_id: $.data.id }
            - call: "POST /infusion-center/prior-authorizations/${pa_id}/decide"
              payload: { decision: "APPROVE", authorized_units_mg: 600 }
              as: PriorAuthCoordinator
            - call: "POST /infusion-center/regimen-protocols"
              payload: { code: "INV1", name: "Inv", cycle_length_days: 21, total_cycles: 1 }
              as: Pharmacist
              captures: { proto_id: $.data.id }
            - call: "POST /infusion-center/order-set-items"
              payload: { regimen_protocol_id: "${proto_id}", drug_name: "SpecialtyX", role: "CHEMO", dosing_method: "AUC", target_auc: 5, vial_size_mg: 150, day_offset: 1, sequence_index: 1 }
              as: Pharmacist
              captures: { osi: $.data.id }
            - call: "POST /infusion-center/regimen-protocols/${proto_id}/publish"
              payload: {}
              as: Pharmacist
            - call: "POST /infusion-center/treatment-cycles"
              payload: { patient_id: "${pat_id}", regimen_protocol_id: "${proto_id}", treatment_start_date: "2026-07-01" }
              as: Pharmacist
              captures: { cyc_id: $.data.id }
            - call: "POST /infusion-center/treatment-cycles/${cyc_id}/activate"
              payload: {}
              as: Pharmacist
            - call: "POST /infusion-center/drug-orders"
              payload: { treatment_cycle_id: "${cyc_id}", order_set_item_id: "${osi}", prior_authorization_id: "${pa_id}" }
              as: Pharmacist
              captures: { do_id: $.data.id }
            - call: "POST /infusion-center/drug-orders/${do_id}/prepare"
              payload: {}
              as: Nurse
              as_user_id: "${np1}"
            - call: "POST /infusion-center/drug-orders/${do_id}/verify"
              payload: { recomputed_dose_mg: 525 }
              as: Nurse
              as_user_id: "${np2}"
          trigger:
            - call: "POST /infusion-center/drug-orders/${do_id}/administer"
              payload: {}
              as: Nurse
              as_user_id: "${np2}"
          assert:
            - "PriorAuthorization.${pa_id}.consumed_units_mg == 525"
            - "PriorAuthorization.${pa_id}.authorized_units_mg == 600"
            - "PriorAuthorization.${pa_id}.status == APPROVED"
            - "(authorized_units_mg - consumed_units_mg) == 75 (remaining units conserved: 600 == 75 + 525)"

      - name: invariant_chair_minutes_released_on_hold_cancel
        grounds:
          - state_machines.TreatmentCycle.ACTIVE_to_ON_HOLD
          - state_machines.InfusionAppointment.SCHEDULED_to_CANCELLED
          - entities.InfusionAppointment.fields.start_at
        distinguishing_aspect: |
          Conserved quantity #2 = chair-occupancy availability (a different conserved
          quantity than PA units): the 09:00-10:30 chair interval booked by a forward
          action is fully released by the compensating cancel triggered by the cycle
          hold, so the identical interval can be re-booked afterward and succeeds
          (occupied-minutes return to zero, no leaked reservation).
        test_recipe:
          setup:
            - "ACTIVE cycle with one SCHEDULED 09:00-10:30 appointment on chair C-Z; then cycle held (cancels appt); then cycle resumed back to ACTIVE"
          setup_api_calls:
            - call: "POST /infusion-center/patients"
              payload: { mrn: "M18", full_name: "P Eighteen", height_cm: 170, weight_kg: 70, gfr_ml_min: 80 }
              as: Pharmacist
              captures: { pat_id: $.data.id }
            - call: "POST /infusion-center/chairs"
              payload: { label: "C-Z" }
              as: Pharmacist
              captures: { chair_id: $.data.id }
            - call: "POST /infusion-center/nurses"
              payload: { full_name: "Nz", is_chemo_certified: true, max_acuity_load: 6 }
              as: Pharmacist
              captures: { nurse_id: $.data.id }
            - call: "POST /infusion-center/regimen-protocols"
              payload: { code: "INV2", name: "Inv2", cycle_length_days: 21, total_cycles: 1 }
              as: Pharmacist
              captures: { proto_id: $.data.id }
            - call: "POST /infusion-center/order-set-items"
              payload: { regimen_protocol_id: "${proto_id}", drug_name: "DrugC", role: "CHEMO", dosing_method: "FLAT", flat_dose_mg: 600, vial_size_mg: 150, day_offset: 1, sequence_index: 1 }
              as: Pharmacist
              captures: { osi: $.data.id }
            - call: "POST /infusion-center/regimen-protocols/${proto_id}/publish"
              payload: {}
              as: Pharmacist
            - call: "POST /infusion-center/treatment-cycles"
              payload: { patient_id: "${pat_id}", regimen_protocol_id: "${proto_id}", treatment_start_date: "2026-07-01" }
              as: Pharmacist
              captures: { cyc_id: $.data.id }
            - call: "POST /infusion-center/treatment-cycles/${cyc_id}/activate"
              payload: {}
              as: Pharmacist
              captures: { cyc_v1: $.data.version }
            - call: "POST /infusion-center/infusion-appointments"
              payload: { treatment_cycle_id: "${cyc_id}", chair_id: "${chair_id}", nurse_id: "${nurse_id}", start_at: "2026-07-01T09:00:00Z", end_at: "2026-07-01T10:30:00Z", acuity: 2, expected_treatment_cycle_version: "${cyc_v1}" }
              as: Pharmacist
              captures: { appt1: $.data.id }
            - call: "POST /infusion-center/treatment-cycles/${cyc_id}/hold"
              payload: {}
              as: Pharmacist
              captures: { cyc_v2: $.data.version }
            - call: "POST /infusion-center/treatment-cycles/${cyc_id}/resume"
              payload: {}
              as: Pharmacist
              captures: { cyc_v3: $.data.version }
          trigger:
            - call: "POST /infusion-center/infusion-appointments"
              payload: { treatment_cycle_id: "${cyc_id}", chair_id: "${chair_id}", nurse_id: "${nurse_id}", start_at: "2026-07-01T09:00:00Z", end_at: "2026-07-01T10:30:00Z", acuity: 2, expected_treatment_cycle_version: "${cyc_v3}" }
              as: Pharmacist
              captures: { appt2: $.data.id, st: $.data.status }
          assert:
            - "InfusionAppointment.${appt1}.status == CANCELLED"
            - "InfusionAppointment.${appt2}.status == SCHEDULED"
            - "InfusionAppointment.${appt2}.start_at == 2026-07-01T09:00:00Z (identical interval re-booked, chair fully released)"
