# =============================================================================
# Ticket Resale Marketplace (StubHub style) — Scaffold Seed Tables
# Difficulty band: EXPERT (§0.4)
# =============================================================================

scenario: |
  Ticket Resale Marketplace (StubHub style): listing & dynamic pricing, seat/section
  mapping, transfer (barcode/mobile) & delivery, buyer guarantee/replacement, seller
  payout & fee, event cancellation/credit, fraud/duplicate detection, last-minute
  delivery。输出文件夹：tasks/task_0362_ticket_resale_marketplace（此目录已为本任务预先分配，请直接使用，不要重新扫描
  ./tasks/ 自动分配编号，以避免与其它并行任务发生 task ID 抢占）。以 Expert
  难度进行设计——该 Expert 难度要求仅传递给 prd-bench-scaffold-generator（Step 2
  scaffold 生成），其余步骤按 skill 默认流程执行。

domain_name: ticket-resale-marketplace
api_prefix: /            # flat topology — peer resources at the root, joined by FK refs (no common URL parent)

# =============================================================================
# Complexity Profile (§0.1–§0.3)
# =============================================================================
complexity_profile:
  primary_archetype: "Quota / allocation"        # seat inventory reserved → committed → released
  secondary_archetype: "Pricing engine"          # dynamic listing price + fee/payout layered math
  complexity_layers:
    - optimistic_concurrency                      # OCC on Listing.version for sale-create supersede (§1.2.1)
    - cascading_side_effects                      # event-cancel → orders → payouts → seat release → credits
    - dual_variant_calculation                    # buyer-charge estimate vs final; payout provisional escrow vs final net
    - derived_field_reconciliation                # Listing.available_seat_count ↔ Seat statuses; Seller.escrow_balance_cents
    - idempotency                                 # idempotency-keyed sale creation

  entity_topology: flat                           # peer entities joined by FK refs; no deep URL nesting
  state_machine_shape: parallel                   # Order: payment_status × delivery_status independent axes; plus cyclic GuaranteeClaim
  relationship_patterns:
    - one_to_many                                 # Listing → Seats, Event → Listings
    - cross_aggregate                             # Order references Listing+Buyer+Seats across aggregates
    - polymorphic                                 # FraudFlag.subject_type/subject_id targets Listing|Order|Seat
  role_model: peer_roles                          # Seller owns listings/seats/payouts; Buyer owns orders/claims/credits; ops roles opaque
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  # ---------------------------------------------------------------------------
  - name: Venue
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: name, type: string, source: input, description: "Venue name" }
      - { name: timezone, type: string, source: input, description: "IANA tz name, used only for display" }
      - { name: total_section_count, type: integer, source: computed, description: "Count of Sections under this venue" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation incl cascades" }
      - { name: version, type: integer, source: system, description: "Starts at 1, +1 per mutation", default: 1 }

  # ---------------------------------------------------------------------------
  - name: Section
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: venue_id, type: string, source: input, description: "FK -> Venue.id" }
      - { name: name, type: string, source: input, description: "Section label e.g. 'FLOOR-A'" }
      - { name: price_zone, type: enum, source: input, description: "Pricing zone: PREMIUM | STANDARD | VALUE", constraints: "one of {PREMIUM, STANDARD, VALUE}" }
      - { name: face_value_cents, type: integer, source: input, description: "Original box-office face value per seat, > 0; ceiling for price-cap checks" }
      - { name: row_count, type: integer, source: input, description: "Number of rows, >= 1" }
      - { name: seats_per_row, type: integer, source: input, description: "Seats per row, >= 1" }
      - { name: capacity, type: integer, source: computed, description: "row_count * seats_per_row" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on mutation" }
      - { name: version, type: integer, source: system, description: "Starts at 1", default: 1 }

  # ---------------------------------------------------------------------------
  - name: Event
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: venue_id, type: string, source: input, description: "FK -> Venue.id" }
      - { name: title, type: string, source: input, description: "Event title" }
      - { name: doors_open_at, type: datetime, source: input, description: "ISO 8601 UTC start of admission window" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | ON_SALE | LAST_MINUTE | COMPLETED | CANCELLED | POSTPONED", constraints: "one of {SCHEDULED, ON_SALE, LAST_MINUTE, COMPLETED, CANCELLED, POSTPONED}" }
      - { name: price_cap_multiplier, type: number, source: input, description: "Max listing price as multiple of Section.face_value_cents; >= 1.0", default: 3.0 }
      - { name: active_listing_count, type: integer, source: computed, description: "Count of Listings on this event whose status IN {ACTIVE, SOLD_OUT}" }
      - { name: last_minute_cutoff_minutes, type: integer, source: input, description: "Minutes before doors_open_at at which LAST_MINUTE delivery rules engage; >= 0", default: 180 }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on mutation incl cascades" }
      - { name: version, type: integer, source: system, description: "Starts at 1", default: 1 }

  # ---------------------------------------------------------------------------
  - name: Seller
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; equals X-User-ID when X-User-Role=Seller" }
      - { name: display_name, type: string, source: input, description: "Public seller name" }
      - { name: payout_account_ref, type: string, source: input, description: "Opaque external payout destination token" }
      - { name: trust_tier, type: enum, source: system, description: "NEW | VERIFIED | TRUSTED | RESTRICTED; gates fee rate and fraud-hold rules", constraints: "one of {NEW, VERIFIED, TRUSTED, RESTRICTED}" }
      - { name: escrow_balance_cents, type: integer, source: computed, description: "Sum of net_payout_cents over this seller's Payouts in status ESCROWED; never negative" }
      - { name: paid_out_balance_cents, type: integer, source: computed, description: "Sum of net_payout_cents over this seller's Payouts in status PAID" }
      - { name: open_fraud_flag_count, type: integer, source: computed, description: "Count of FraudFlags on this seller's listings/seats with status IN {OPEN, UNDER_REVIEW}" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on mutation incl cascades" }
      - { name: version, type: integer, source: system, description: "Starts at 1", default: 1 }

  # ---------------------------------------------------------------------------
  - name: Buyer
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; equals X-User-ID when X-User-Role=Buyer" }
      - { name: display_name, type: string, source: input, description: "Public buyer name" }
      - { name: wallet_credit_cents, type: integer, source: computed, description: "Sum of EventCredit.amount_cents for this buyer in status ISSUED; never negative" }
      - { name: lifetime_orders_count, type: integer, source: computed, description: "Count of this buyer's Orders whose payment_status reached CHARGED at least once" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on mutation incl cascades" }
      - { name: version, type: integer, source: system, description: "Starts at 1", default: 1 }

  # ---------------------------------------------------------------------------
  - name: Listing
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: event_id, type: string, source: input, description: "FK -> Event.id" }
      - { name: seller_id, type: string, source: input, description: "FK -> Seller.id" }
      - { name: section_id, type: string, source: input, description: "FK -> Section.id; the seats must belong to this section" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | SOLD_OUT | DELISTED | FROZEN; ACTIVE while available_seat_count>0, SOLD_OUT when it reaches 0", constraints: "one of {DRAFT, ACTIVE, SOLD_OUT, DELISTED, FROZEN}" }
      - { name: delivery_method, type: enum, source: input, description: "MOBILE_TRANSFER | BARCODE_PDF; determines Transfer mechanics", constraints: "one of {MOBILE_TRANSFER, BARCODE_PDF}" }
      - { name: ask_price_cents, type: integer, source: input, description: "Seller per-seat ask, > 0" }
      - { name: pricing_mode, type: enum, source: input, description: "FIXED | DYNAMIC; DYNAMIC recomputes effective price on demand floor", constraints: "one of {FIXED, DYNAMIC}" }
      - { name: dynamic_floor_cents, type: integer, source: input, required: false, description: "For DYNAMIC: per-seat floor the dynamic price may not drop below; <= ask_price_cents" }
      - { name: effective_price_cents, type: integer, source: computed, description: "Per-seat price a buyer pays now; see calc effective_listing_price" }
      - { name: total_seat_count, type: integer, source: computed, description: "Count of Seats linked to this listing" }
      - { name: available_seat_count, type: integer, source: computed, description: "Count of this listing's Seats whose status == AVAILABLE; must reconcile with status" }
      - { name: split_rule, type: enum, source: input, description: "ANY | PAIRS | WHOLE; constrains buyable quantity", default: "ANY", constraints: "one of {ANY, PAIRS, WHOLE}" }
      - { name: held_seat_count, type: integer, source: computed, description: "Count of this listing's Seats whose status == HELD (reserved but not yet charged)" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on mutation incl cascades" }
      - { name: version, type: integer, source: system, description: "Starts at 1; OCC anchor for sale create — bumped on every reservation/charge/release", default: 1 }

  # ---------------------------------------------------------------------------
  - name: Seat
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: listing_id, type: string, source: input, description: "FK -> Listing.id" }
      - { name: section_id, type: string, source: system, description: "FK -> Section.id; copied from parent listing at creation" }
      - { name: row_label, type: string, source: input, description: "Row identifier within section" }
      - { name: seat_number, type: integer, source: input, description: "Seat number within row, >= 1" }
      - { name: barcode_token, type: string, source: input, description: "Unique barcode/credential token; must be unique across all live (non-VOID) seats" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | HELD | SOLD | TRANSFERRED | VOID; VOID = duplicate/fraud invalidated", constraints: "one of {AVAILABLE, HELD, SOLD, TRANSFERRED, VOID}" }
      - { name: order_id, type: string, source: computed, required: false, description: "FK -> Order.id; set when HELD or SOLD to an order" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC; also the FIFO allocation key within a listing" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on mutation incl cascades" }
      - { name: version, type: integer, source: system, description: "Starts at 1", default: 1 }

  # ---------------------------------------------------------------------------
  - name: Order
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: listing_id, type: string, source: input, description: "FK -> Listing.id" }
      - { name: buyer_id, type: string, source: input, description: "FK -> Buyer.id" }
      - { name: quantity, type: integer, source: input, description: "Number of seats requested, >= 1" }
      - { name: payment_status, type: enum, source: system, description: "Payment axis: PENDING | CHARGED | REFUNDED | CREDITED; independent of delivery_status", constraints: "one of {PENDING, CHARGED, REFUNDED, CREDITED}" }
      - { name: delivery_status, type: enum, source: system, description: "Delivery axis: AWAITING | IN_TRANSFER | DELIVERED | DELIVERY_FAILED | REPLACED; independent of payment_status", constraints: "one of {AWAITING, IN_TRANSFER, DELIVERED, DELIVERY_FAILED, REPLACED}" }
      - { name: lifecycle_state, type: enum, source: computed, description: "Derived rollup of the two axes: OPEN | SETTLED | UNWOUND; see calc order_lifecycle_rollup", constraints: "one of {OPEN, SETTLED, UNWOUND}" }
      - { name: locked_unit_price_cents, type: integer, source: system, description: "Per-seat price locked at reservation from Listing.effective_price_cents" }
      - { name: estimated_total_cents, type: integer, source: computed, description: "Provisional buyer charge computed at reservation; see calc buyer_charge variant=estimate" }
      - { name: final_total_cents, type: integer, source: computed, required: false, description: "Final buyer charge computed at charge time; see calc buyer_charge variant=final" }
      - { name: buyer_fee_cents, type: integer, source: computed, description: "Buyer service fee component of the charge" }
      - { name: applied_credit_cents, type: integer, source: input, required: false, description: "Wallet credit the buyer elects to apply at reservation, >= 0; <= wallet_credit_cents", default: 0 }
      - { name: reservation_expires_at, type: datetime, source: system, description: "ISO 8601 UTC; reservation auto-expires at this clock time if not charged" }
      - { name: replacement_of_order_id, type: string, source: input, required: false, description: "FK -> Order.id; set when this order is a guarantee replacement for another" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on mutation incl cascades" }
      - { name: version, type: integer, source: system, description: "Starts at 1; OCC anchor for charge", default: 1 }

  # ---------------------------------------------------------------------------
  - name: Transfer
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: order_id, type: string, source: input, description: "FK -> Order.id" }
      - { name: method, type: enum, source: system, description: "MOBILE_TRANSFER | BARCODE_PDF; copied from listing.delivery_method at creation", constraints: "one of {MOBILE_TRANSFER, BARCODE_PDF}" }
      - { name: status, type: enum, source: system, description: "INITIATED | SENT | ACCEPTED | EXPIRED | FAILED | RECALLED", constraints: "one of {INITIATED, SENT, ACCEPTED, EXPIRED, FAILED, RECALLED}" }
      - { name: is_last_minute, type: boolean, source: computed, description: "True if Transfer initiated within Event.last_minute_cutoff_minutes of doors_open_at" }
      - { name: deadline_at, type: datetime, source: system, description: "ISO 8601 UTC; SENT transfer must be ACCEPTED before this or it EXPIRES" }
      - { name: attempt_number, type: integer, source: system, description: "1-based; increments when a prior transfer FAILED/EXPIRED and a new one is initiated for the same order" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on mutation incl cascades" }
      - { name: version, type: integer, source: system, description: "Starts at 1", default: 1 }

  # ---------------------------------------------------------------------------
  - name: Payout
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: order_id, type: string, source: input, description: "FK -> Order.id" }
      - { name: seller_id, type: string, source: system, description: "FK -> Seller.id; copied from listing.seller_id" }
      - { name: status, type: enum, source: system, description: "PENDING | ESCROWED | RELEASABLE | PAID | CLAWED_BACK | CANCELLED", constraints: "one of {PENDING, ESCROWED, RELEASABLE, PAID, CLAWED_BACK, CANCELLED}" }
      - { name: gross_sale_cents, type: integer, source: computed, description: "quantity * order.locked_unit_price_cents (seller-side gross, excludes buyer fee)" }
      - { name: seller_fee_rate, type: number, source: computed, description: "Commission rate selected by trust_tier; see calc seller_fee" }
      - { name: seller_fee_cents, type: integer, source: computed, description: "Commission withheld; see calc seller_fee" }
      - { name: net_payout_cents, type: integer, source: computed, description: "gross_sale_cents - seller_fee_cents - clawback_cents; never negative" }
      - { name: clawback_cents, type: integer, source: computed, description: "Amount reversed by guarantee/cancellation; see calc payout_clawback", default: 0 }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on mutation incl cascades" }
      - { name: version, type: integer, source: system, description: "Starts at 1", default: 1 }

  # ---------------------------------------------------------------------------
  - name: GuaranteeClaim
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: order_id, type: string, source: input, description: "FK -> Order.id" }
      - { name: reason, type: enum, source: input, description: "NOT_DELIVERED | INVALID_BARCODE | DUPLICATE_SEAT | EVENT_ISSUE", constraints: "one of {NOT_DELIVERED, INVALID_BARCODE, DUPLICATE_SEAT, EVENT_ISSUE}" }
      - { name: status, type: enum, source: system, description: "FILED | INVESTIGATING | REPLACEMENT_OFFERED | RESOLVED_REPLACED | RESOLVED_REFUNDED | DENIED", constraints: "one of {FILED, INVESTIGATING, REPLACEMENT_OFFERED, RESOLVED_REPLACED, RESOLVED_REFUNDED, DENIED}" }
      - { name: offered_listing_id, type: string, source: input, required: false, description: "FK -> Listing.id; replacement listing proposed during REPLACEMENT_OFFERED" }
      - { name: replacement_order_id, type: string, source: computed, required: false, description: "FK -> Order.id; the new order minted on RESOLVED_REPLACED" }
      - { name: round_number, type: integer, source: system, description: "Negotiation round; +1 each time a REPLACEMENT_OFFERED is rejected back to INVESTIGATING (cyclic)" }
      - { name: refund_amount_cents, type: integer, source: computed, required: false, description: "Refund applied on RESOLVED_REFUNDED; see calc guarantee_settlement" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on mutation incl cascades" }
      - { name: version, type: integer, source: system, description: "Starts at 1", default: 1 }

  # ---------------------------------------------------------------------------
  - name: EventCredit
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: buyer_id, type: string, source: input, description: "FK -> Buyer.id" }
      - { name: event_id, type: string, source: input, description: "FK -> Event.id; the cancelled/postponed event that generated this credit" }
      - { name: source_order_id, type: string, source: input, description: "FK -> Order.id; the order being unwound into credit" }
      - { name: amount_cents, type: integer, source: computed, description: "Credit value; see calc event_credit_amount" }
      - { name: status, type: enum, source: system, description: "ISSUED | REDEEMED | EXPIRED | REVOKED", constraints: "one of {ISSUED, REDEEMED, EXPIRED, REVOKED}" }
      - { name: bonus_applied, type: boolean, source: computed, description: "True when 110% goodwill bonus tier applied (see calc event_credit_amount)" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on mutation incl cascades" }
      - { name: version, type: integer, source: system, description: "Starts at 1", default: 1 }

  # ---------------------------------------------------------------------------
  - name: FraudFlag
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: subject_type, type: enum, source: input, description: "LISTING | ORDER | SEAT (polymorphic subject)", constraints: "one of {LISTING, ORDER, SEAT}" }
      - { name: listing_id, type: string, source: input, required: false, description: "FK -> Listing.id; set when subject_type==LISTING" }
      - { name: order_id, type: string, source: input, required: false, description: "FK -> Order.id; set when subject_type==ORDER" }
      - { name: seat_id, type: string, source: input, required: false, description: "FK -> Seat.id; set when subject_type==SEAT" }
      - { name: signal, type: enum, source: input, description: "DUPLICATE_BARCODE | PRICE_GOUGE | VELOCITY | CHARGEBACK; the detected pattern", constraints: "one of {DUPLICATE_BARCODE, PRICE_GOUGE, VELOCITY, CHARGEBACK}" }
      - { name: severity, type: enum, source: computed, description: "LOW | HIGH; HIGH freezes the subject listing immediately; see calc fraud_severity", constraints: "one of {LOW, HIGH}" }
      - { name: status, type: enum, source: system, description: "OPEN | UNDER_REVIEW | CONFIRMED | DISMISSED", constraints: "one of {OPEN, UNDER_REVIEW, CONFIRMED, DISMISSED}" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on mutation incl cascades" }
      - { name: version, type: integer, source: system, description: "Starts at 1", default: 1 }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---------------------------------------------------------------------------
  - entity: Event
    field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: ON_SALE
        trigger: "POST /events/{eventId}/open-sales"
        actor: PlatformAdmin
        preconditions: ["Event.status == SCHEDULED"]
        side_effects: ["Listings on this event may transition DRAFT→ACTIVE"]

      - from: ON_SALE
        to: LAST_MINUTE
        trigger: "POST /_clock/advance then POST /events/{eventId}/enter-last-minute (or system on clock crossing cutoff)"
        actor: "PlatformAdmin or system"
        preconditions:
          - "Event.status == ON_SALE"
          - "current clock >= doors_open_at - last_minute_cutoff_minutes"
        side_effects:
          - "New Transfers on this event's orders compute is_last_minute=true and use the LAST_MINUTE deadline rule"

      - from: [ON_SALE, LAST_MINUTE]
        to: COMPLETED
        trigger: "POST /events/{eventId}/complete"
        actor: PlatformAdmin
        preconditions:
          - "Event.status IN {ON_SALE, LAST_MINUTE}"
          - "current clock >= doors_open_at"
        side_effects:
          - "All Listings on event with status IN {ACTIVE, SOLD_OUT, DRAFT} → DELISTED"
          - "All Payouts on this event's orders in status ESCROWED → RELEASABLE (cascade hop 1→2)"

      - from: [SCHEDULED, ON_SALE, LAST_MINUTE]
        to: CANCELLED
        trigger: "POST /events/{eventId}/cancel"
        actor: PlatformAdmin
        preconditions: ["Event.status IN {SCHEDULED, ON_SALE, LAST_MINUTE}"]
        side_effects:
          - "CASCADE hop1: every Listing on event with status IN {ACTIVE, SOLD_OUT, DRAFT, FROZEN} → DELISTED"
          - "CASCADE hop2: each Order on the event with payment_status==CHARGED → an EventCredit is ISSUED (calc event_credit_amount) and Order.payment_status → CREDITED"
          - "CASCADE hop3: each such Order's ESCROWED Payout → CLAWED_BACK with clawback_cents = net_payout_cents (calc payout_clawback)"
          - "CASCADE hop4: every Seat on the credited orders → VOID; available counts reconcile"

      - from: [SCHEDULED, ON_SALE]
        to: POSTPONED
        trigger: "POST /events/{eventId}/postpone"
        actor: PlatformAdmin
        preconditions: ["Event.status IN {SCHEDULED, ON_SALE}"]
        side_effects:
          - "Listings remain; buyers of CHARGED orders may file EVENT_ISSUE GuaranteeClaims"

      - from: POSTPONED
        to: ON_SALE
        trigger: "POST /events/{eventId}/open-sales"
        actor: PlatformAdmin
        preconditions: ["Event.status == POSTPONED"]
        side_effects: []

  # ---------------------------------------------------------------------------
  # Listing is a seat-POOL: ACTIVE while available_seat_count>0, SOLD_OUT at 0.
  # Reservations/charges hold/sell individual seats; the listing status reflects pool occupancy.
  - entity: Listing
    field: status
    initial_state: DRAFT
    terminal_states: [DELISTED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /listings/{listingId}/activate"
        actor: Seller
        preconditions:
          - "Listing.status == DRAFT"
          - "Event.status IN {ON_SALE, LAST_MINUTE} (cross-entity: Event must be selling)"
          - "Listing.total_seat_count >= 1"
          - "seller.trust_tier != RESTRICTED"
        side_effects: ["effective_price_cents recomputed (calc effective_listing_price)"]

      - from: ACTIVE
        to: SOLD_OUT
        trigger: "system (a reservation or charge brings available_seat_count to 0)"
        actor: system
        preconditions: ["Listing.status == ACTIVE", "available_seat_count == 0 after the seat hold/sale"]
        side_effects: ["Listing rejects further sale-create until a release reopens a seat"]

      - from: SOLD_OUT
        to: ACTIVE
        trigger: "system (a reservation is cancelled/expired and a seat returns to AVAILABLE)"
        actor: system
        preconditions: ["Listing.status == SOLD_OUT", "available_seat_count >= 1 after the release"]
        side_effects: []

      - from: [DRAFT, ACTIVE]
        to: FROZEN
        trigger: "system (a HIGH-severity FraudFlag created or CONFIRMED on this listing)"
        actor: system
        preconditions: []
        side_effects: ["Listing rejects activate and sale-create while FROZEN"]

      - from: FROZEN
        to: ACTIVE
        trigger: "POST /fraud-flags/{flagId}/dismiss when no other open HIGH flag remains on the listing"
        actor: TrustSafety
        preconditions: ["Listing.status == FROZEN", "no other FraudFlag on listing with severity==HIGH and status IN {OPEN, UNDER_REVIEW, CONFIRMED}"]
        side_effects: []

      - from: [DRAFT, ACTIVE, SOLD_OUT, FROZEN]
        to: DELISTED
        trigger: "POST /listings/{listingId}/delist (DRAFT/ACTIVE only) OR system (event cancel cascade hop1)"
        actor: "Seller or system"
        preconditions: ["manual delist requires Listing.status IN {DRAFT, ACTIVE}; system cascade may delist from any non-terminal state"]
        side_effects: ["AVAILABLE Seats → VOID"]

  # ---------------------------------------------------------------------------
  # Order carries TWO independent state axes (parallel dimensions): payment_status × delivery_status.
  - entity: Order
    field: payment_status
    initial_state: PENDING
    terminal_states: [REFUNDED, CREDITED]
    transitions:
      - from: PENDING
        to: CHARGED
        trigger: "POST /orders/{orderId}/charge"
        actor: Buyer
        preconditions:
          - "Order.payment_status == PENDING"
          - "the order's HELD Seats still belong to it; Listing.status IN {ACTIVE, SOLD_OUT} (not DELISTED/FROZEN)"
          - "current clock < reservation_expires_at"
          - "applied_credit_cents <= buyer.wallet_credit_cents"
        side_effects:
          - "final_total_cents, buyer_fee_cents computed (calc buyer_charge variant=final)"
          - "applied EventCredits move ISSUED→REDEEMED (FIFO created_at ASC); buyer.wallet_credit_cents recomputed"
          - "the order's HELD Seats → SOLD"
          - "Payout created ESCROWED (calc seller_fee); seller.escrow_balance_cents recomputed"
          - "buyer.lifetime_orders_count recomputed; Listing.version += 1"
          - "Order.version += 1"

      - from: PENDING
        to: REFUNDED
        trigger: "POST /orders/{orderId}/cancel-reservation OR system (reservation expiry on clock advance)"
        actor: "Buyer or system"
        preconditions: ["Order.payment_status == PENDING"]
        side_effects:
          - "the order's HELD Seats → AVAILABLE; available_seat_count restored; Listing.version += 1"
          - "if Listing was SOLD_OUT it returns to ACTIVE"
          - "any applied (not yet redeemed) credit hold released"

      - from: CHARGED
        to: REFUNDED
        trigger: "system (GuaranteeClaim RESOLVED_REFUNDED)"
        actor: system
        preconditions: ["Order.payment_status == CHARGED"]
        side_effects:
          - "refund_amount_cents returned (calc guarantee_settlement)"
          - "ESCROWED Payout → CLAWED_BACK (calc payout_clawback); seller.escrow_balance_cents recomputed"
          - "SOLD Seats → VOID"

      - from: CHARGED
        to: CREDITED
        trigger: "system (event cancel cascade hop2)"
        actor: system
        preconditions: ["Order.payment_status == CHARGED"]
        side_effects:
          - "EventCredit ISSUED (calc event_credit_amount); buyer.wallet_credit_cents recomputed"
          - "ESCROWED Payout → CLAWED_BACK; SOLD Seats → VOID"

  - entity: Order
    field: delivery_status
    initial_state: AWAITING
    terminal_states: [DELIVERED, REPLACED]
    transitions:
      - from: AWAITING
        to: IN_TRANSFER
        trigger: "POST /orders/{orderId}/transfers (initiate) then transfer SENT"
        actor: Seller
        preconditions:
          - "Order.delivery_status == AWAITING"
          - "Order.payment_status == CHARGED (cross-entity within same row: cannot deliver before payment)"
        side_effects: ["a Transfer is created INITIATED then advances"]

      - from: IN_TRANSFER
        to: DELIVERED
        trigger: "POST /transfers/{transferId}/accept"
        actor: Buyer
        preconditions: ["Order.delivery_status == IN_TRANSFER", "Transfer.status == SENT", "current clock < Transfer.deadline_at"]
        side_effects:
          - "Seats SOLD→TRANSFERRED"
          - "lifecycle_state recomputed (calc order_lifecycle_rollup)"

      - from: IN_TRANSFER
        to: DELIVERY_FAILED
        trigger: "POST /transfers/{transferId}/fail OR system (Transfer EXPIRED on clock advance)"
        actor: "Seller or system"
        preconditions: ["Order.delivery_status == IN_TRANSFER"]
        side_effects: ["Transfer → FAILED/EXPIRED; Seats remain SOLD; buyer may file NOT_DELIVERED GuaranteeClaim"]

      - from: DELIVERY_FAILED
        to: IN_TRANSFER
        trigger: "POST /orders/{orderId}/transfers (re-initiate; attempt_number increments)"
        actor: Seller
        preconditions: ["Order.delivery_status == DELIVERY_FAILED", "Order.payment_status == CHARGED"]
        side_effects: ["new Transfer with attempt_number = prior + 1"]

      - from: [AWAITING, IN_TRANSFER, DELIVERY_FAILED]
        to: REPLACED
        trigger: "system (GuaranteeClaim RESOLVED_REPLACED)"
        actor: system
        preconditions: []
        side_effects: ["original Seats VOID; replacement Order minted carries delivery anew"]

  # ---------------------------------------------------------------------------
  - entity: Transfer
    field: status
    initial_state: INITIATED
    terminal_states: [ACCEPTED, EXPIRED, FAILED, RECALLED]
    transitions:
      - from: INITIATED
        to: SENT
        trigger: "POST /transfers/{transferId}/send"
        actor: Seller
        preconditions:
          - "Transfer.status == INITIATED"
          - "Order.payment_status == CHARGED"
        side_effects:
          - "deadline_at set (calc transfer_deadline): standard rule if not last-minute, compressed rule if is_last_minute"
          - "Order.delivery_status AWAITING/DELIVERY_FAILED → IN_TRANSFER"

      - from: SENT
        to: ACCEPTED
        trigger: "POST /transfers/{transferId}/accept"
        actor: Buyer
        preconditions: ["Transfer.status == SENT", "current clock < deadline_at"]
        side_effects: ["Order.delivery_status → DELIVERED; Seats SOLD→TRANSFERRED"]

      - from: SENT
        to: EXPIRED
        trigger: "system (current clock >= deadline_at on clock advance)"
        actor: system
        preconditions: ["Transfer.status == SENT", "current clock >= deadline_at"]
        side_effects: ["Order.delivery_status → DELIVERY_FAILED"]

      - from: [INITIATED, SENT]
        to: FAILED
        trigger: "POST /transfers/{transferId}/fail"
        actor: Seller
        preconditions: ["Transfer.status IN {INITIATED, SENT}"]
        side_effects: ["Order.delivery_status → DELIVERY_FAILED"]

      - from: SENT
        to: RECALLED
        trigger: "POST /transfers/{transferId}/recall"
        actor: Seller
        preconditions: ["Transfer.status == SENT", "current clock < deadline_at"]
        side_effects: ["Order.delivery_status → AWAITING (seller withdrew the credential before acceptance)"]

  # ---------------------------------------------------------------------------
  - entity: Payout
    field: status
    initial_state: PENDING
    terminal_states: [PAID, CLAWED_BACK, CANCELLED]
    transitions:
      - from: PENDING
        to: ESCROWED
        trigger: "system (order charge succeeds — payout is born ESCROWED, this is its creation row)"
        actor: system
        preconditions: []
        side_effects: ["seller.escrow_balance_cents recomputed"]

      - from: ESCROWED
        to: RELEASABLE
        trigger: "POST /orders/{orderId}/confirm-delivery-window OR system (event complete cascade hop2)"
        actor: "PlatformAdmin or system"
        preconditions:
          - "Payout.status == ESCROWED"
          - "Order.delivery_status == DELIVERED (cross-entity: payout cannot release until buyer received seats)"
        side_effects: []

      - from: RELEASABLE
        to: PAID
        trigger: "POST /payouts/{payoutId}/pay"
        actor: PlatformAdmin
        preconditions:
          - "Payout.status == RELEASABLE"
          - "expected_payout_version matches Payout.version"
        side_effects:
          - "seller.escrow_balance_cents decremented, paid_out_balance_cents incremented"
          - "Payout.version += 1"

      - from: [ESCROWED, RELEASABLE]
        to: CLAWED_BACK
        trigger: "system (GuaranteeClaim RESOLVED_REFUNDED OR event cancel cascade hop3)"
        actor: system
        preconditions: []
        side_effects:
          - "clawback_cents = net_payout_cents (calc payout_clawback); net_payout_cents → 0"
          - "seller.escrow_balance_cents recomputed"

      - from: ESCROWED
        to: CANCELLED
        trigger: "system (GuaranteeClaim RESOLVED_REPLACED — original payout voided, replacement order mints its own)"
        actor: system
        preconditions: []
        side_effects: ["net_payout_cents → 0; seller.escrow_balance_cents recomputed"]

  # ---------------------------------------------------------------------------
  # GuaranteeClaim: cyclic negotiation (REPLACEMENT_OFFERED→INVESTIGATING loop) + branching resolution.
  - entity: GuaranteeClaim
    field: status
    initial_state: FILED
    terminal_states: [RESOLVED_REPLACED, RESOLVED_REFUNDED, DENIED]
    transitions:
      - from: FILED
        to: INVESTIGATING
        trigger: "POST /guarantee-claims/{claimId}/investigate"
        actor: TrustSafety
        preconditions: ["GuaranteeClaim.status == FILED"]
        side_effects: []

      - from: INVESTIGATING
        to: REPLACEMENT_OFFERED
        trigger: "POST /guarantee-claims/{claimId}/offer-replacement"
        actor: TrustSafety
        preconditions:
          - "GuaranteeClaim.status == INVESTIGATING"
          - "offered_listing_id references a Listing with status==ACTIVE on the same Event (cross-entity)"
          - "offered listing available_seat_count >= original order.quantity"
        side_effects: []

      - from: REPLACEMENT_OFFERED
        to: INVESTIGATING
        trigger: "POST /guarantee-claims/{claimId}/reject-offer"
        actor: Buyer
        preconditions: ["GuaranteeClaim.status == REPLACEMENT_OFFERED"]
        side_effects: ["round_number += 1 (cyclic negotiation back-edge)"]

      - from: REPLACEMENT_OFFERED
        to: RESOLVED_REPLACED
        trigger: "POST /guarantee-claims/{claimId}/accept-offer"
        actor: Buyer
        preconditions: ["GuaranteeClaim.status == REPLACEMENT_OFFERED", "offered listing still ACTIVE with enough seats"]
        side_effects:
          - "replacement Order minted on offered_listing_id at locked_unit_price_cents == 0 (covered by guarantee), payment_status CHARGED, seats HELD→SOLD"
          - "original Order.delivery_status → REPLACED; original SOLD/HELD Seats → VOID"
          - "original ESCROWED Payout → CANCELLED"
          - "replacement_order_id recorded"

      - from: [INVESTIGATING, REPLACEMENT_OFFERED]
        to: RESOLVED_REFUNDED
        trigger: "POST /guarantee-claims/{claimId}/refund"
        actor: TrustSafety
        preconditions: ["GuaranteeClaim.status IN {INVESTIGATING, REPLACEMENT_OFFERED}"]
        side_effects:
          - "refund_amount_cents computed (calc guarantee_settlement)"
          - "Order.payment_status CHARGED → REFUNDED"
          - "ESCROWED/RELEASABLE Payout → CLAWED_BACK (calc payout_clawback)"
          - "SOLD Seats → VOID"

      - from: [FILED, INVESTIGATING]
        to: DENIED
        trigger: "POST /guarantee-claims/{claimId}/deny"
        actor: TrustSafety
        preconditions: ["GuaranteeClaim.status IN {FILED, INVESTIGATING}"]
        side_effects: ["no financial change; order unaffected"]

  # ---------------------------------------------------------------------------
  - entity: EventCredit
    field: status
    initial_state: ISSUED
    terminal_states: [REDEEMED, EXPIRED, REVOKED]
    transitions:
      - from: ISSUED
        to: REDEEMED
        trigger: "system (Order charge consumes applied_credit_cents, FIFO by created_at ASC)"
        actor: system
        preconditions: ["EventCredit.status == ISSUED"]
        side_effects: ["buyer.wallet_credit_cents recomputed"]

      - from: ISSUED
        to: EXPIRED
        trigger: "system (clock advance past credit validity — see calc; admin-triggered sweep)"
        actor: system
        preconditions: ["EventCredit.status == ISSUED"]
        side_effects: ["buyer.wallet_credit_cents recomputed"]

      - from: ISSUED
        to: REVOKED
        trigger: "POST /event-credits/{creditId}/revoke"
        actor: TrustSafety
        preconditions: ["EventCredit.status == ISSUED"]
        side_effects: ["buyer.wallet_credit_cents recomputed"]

  # ---------------------------------------------------------------------------
  - entity: FraudFlag
    field: status
    initial_state: OPEN
    terminal_states: [CONFIRMED, DISMISSED]
    transitions:
      - from: OPEN
        to: UNDER_REVIEW
        trigger: "POST /fraud-flags/{flagId}/review"
        actor: TrustSafety
        preconditions: ["FraudFlag.status == OPEN"]
        side_effects: []

      - from: [OPEN, UNDER_REVIEW]
        to: CONFIRMED
        trigger: "POST /fraud-flags/{flagId}/confirm"
        actor: TrustSafety
        preconditions: ["FraudFlag.status IN {OPEN, UNDER_REVIEW}"]
        side_effects:
          - "if signal==DUPLICATE_BARCODE: the flagged Seat → VOID; available_seat_count reconciles"
          - "if subject listing not already FROZEN and severity==HIGH: listing → FROZEN"
          - "seller.open_fraud_flag_count recomputed"

      - from: [OPEN, UNDER_REVIEW]
        to: DISMISSED
        trigger: "POST /fraud-flags/{flagId}/dismiss"
        actor: TrustSafety
        preconditions: ["FraudFlag.status IN {OPEN, UNDER_REVIEW}"]
        side_effects:
          - "if this was the last HIGH open flag and listing is FROZEN: listing → ACTIVE"
          - "seller.open_fraud_flag_count recomputed"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: sale-create-stale-listing
    parent_entity: Listing
    write_endpoint: "POST /orders"
    occ_field: "expected_listing_version"
    description: |
      Creating an Order (reservation) against a Listing whose version has advanced
      since the client last observed it is rejected with a stale-version error. A
      reservation legitimately supersedes the listing's available inventory under
      §1.2 (each reservation holds seats from the pool and bumps Listing.version);
      a second reservation request still carrying the prior version observed the
      listing before that hold and its view is therefore stale.
    error_id: ERR_STALE_LISTING_VERSION
    http_status: 412

  - rule_id: payout-pay-stale-payout
    parent_entity: Payout
    write_endpoint: "POST /payouts/{payoutId}/pay"
    occ_field: "expected_payout_version"
    description: |
      Paying a Payout whose version has advanced since the client last observed it
      is rejected with a stale-version error. A clawback or release transition (from
      guarantee/cancellation cascades) legitimately advances Payout.version; a pay
      request still carrying the prior version observed the payout before that
      transition and its view is therefore stale.
    error_id: ERR_STALE_PAYOUT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  # --- Dynamic listing price (DYNAMIC mode, demand-floor pricing engine) ---
  - name: effective_listing_price
    trigger: "listing activate; recomputed on GET /listings/{id} read for DYNAMIC mode; locked into Order at reservation"
    algorithm: tiered_pricing
    formula: |
      Let face = Section.face_value_cents, cap = floor(face * Event.price_cap_multiplier).
      If pricing_mode == FIXED:
        raw = ask_price_cents
      If pricing_mode == DYNAMIC:
        # Demand multiplier from remaining inventory scarcity (NON-LINEAR, 3 inputs):
        sold_ratio = (total_seat_count - available_seat_count) / total_seat_count   # in [0,1]
        demand_mult = 1.0 + 0.50 * sold_ratio                                       # 1.00 .. 1.50
        raw = max(dynamic_floor_cents, floor(ask_price_cents * demand_mult))
      # Price cap is the LAST clamp (evaluation order pinned: scarcity → floor → cap):
      effective_price_cents = min(raw, cap)
    input_set: "Section.face_value_cents, Event.price_cap_multiplier, Listing.ask_price_cents, dynamic_floor_cents, total/available seat counts (status==AVAILABLE)"
    constants:
      DEMAND_SLOPE: 0.50
    precision: "floor truncation to integer cents at each floor() call; cap applied last"

  # --- Buyer charge: DUAL VARIANT (estimate at reservation vs final at charge) ---
  - name: buyer_charge
    trigger: "estimate at reservation (Order create); final at POST /orders/{id}/charge"
    algorithm: forward_looking
    formula: |
      base = quantity * locked_unit_price_cents
      buyer_fee_cents = floor(base * BUYER_FEE_RATE)        # service fee
      gross = base + buyer_fee_cents
      total_before_credit = gross
      applied = min(applied_credit_cents, total_before_credit, buyer.wallet_credit_cents at evaluation time)
      total = total_before_credit - applied
    input_set: "Order.quantity, Order.locked_unit_price_cents, applied_credit_cents, buyer wallet at evaluation time"
    constants:
      BUYER_FEE_RATE: 0.12
    precision: "floor truncation; round per-line: fee floored before summing into gross"
    variants:
      - name: estimate
        when: "computed at reservation create; writes estimated_total_cents"
        difference: |
          applied is computed against buyer.wallet_credit_cents AS OF reservation time
          (credits are only HELD, not yet REDEEMED). estimated_total_cents may differ from
          final if the buyer's wallet changed between reservation and charge.
      - name: final
        when: "computed at charge; writes final_total_cents and the actual buyer_fee_cents"
        difference: |
          applied is recomputed against buyer.wallet_credit_cents AS OF charge time, then
          those credits move ISSUED→REDEEMED. If wallet shrank since reservation, final >
          estimate; the charged amount is final_total_cents, NOT estimated_total_cents.

  # --- Seller fee/commission: tiered by trust_tier ---
  - name: seller_fee
    trigger: "Payout creation at order charge"
    algorithm: tiered_pricing
    formula: |
      gross_sale_cents = quantity * order.locked_unit_price_cents
      seller_fee_rate = by trust_tier:
        NEW       -> 0.15
        VERIFIED  -> 0.12
        TRUSTED   -> 0.10
        RESTRICTED-> 0.20
      seller_fee_cents = floor(gross_sale_cents * seller_fee_rate)
      net_payout_cents = gross_sale_cents - seller_fee_cents - clawback_cents
    input_set: "Order.quantity, Order.locked_unit_price_cents, Seller.trust_tier at charge time"
    constants:
      FEE_NEW: 0.15
      FEE_VERIFIED: 0.12
      FEE_TRUSTED: 0.10
      FEE_RESTRICTED: 0.20
    precision: "floor truncation; net_payout_cents never below 0"

  # --- Payout clawback (compensation invariant on escrow ledger) ---
  - name: payout_clawback
    trigger: "GuaranteeClaim RESOLVED_REFUNDED, event cancel cascade hop3"
    algorithm: aggregation
    formula: |
      clawback_cents = net_payout_cents (the full net at time of clawback)
      after: net_payout_cents := 0
      INVARIANT: seller.escrow_balance_cents == sum(net_payout_cents for that seller's Payouts
                 with status==ESCROWED). A forward charge that added N to escrow paired with a
                 clawback that removes exactly net_payout_cents leaves escrow_balance_cents at
                 its pre-charge value (no drift).
    input_set: "the single Payout being reversed"
    precision: "integer cents"

  # --- Guarantee settlement refund (dual-variant per reason on Order domain) ---
  - name: guarantee_settlement
    trigger: "GuaranteeClaim RESOLVED_REFUNDED"
    algorithm: forward_looking
    formula: |
      paid = order.final_total_cents   # what the buyer actually paid (after credit)
      If reason == EVENT_ISSUE:
        refund_amount_cents = paid                      # full money-back, no goodwill
      Else (NOT_DELIVERED | INVALID_BARCODE | DUPLICATE_SEAT):
        # buyer-protection refund returns paid AND re-credits the applied credit to wallet
        refund_amount_cents = paid
        # additionally: any credit applied to this order is RE-ISSUED to the wallet (not lost)
    input_set: "Order.final_total_cents, Order.applied_credit_cents, GuaranteeClaim.reason"
    precision: "integer cents"
    variants:
      - name: protection_refund
        when: "reason IN {NOT_DELIVERED, INVALID_BARCODE, DUPLICATE_SEAT}"
        difference: "re-issues a fresh ISSUED EventCredit for applied_credit_cents back to the buyer wallet in addition to the cash refund"
      - name: event_issue_refund
        when: "reason == EVENT_ISSUE"
        difference: "cash refund only; previously applied credit is NOT re-issued (it was consumed against an event that is the buyer's own postponement choice)"

  # --- Event credit amount: tiered goodwill bonus (combinatorial, 3 inputs, branching) ---
  - name: event_credit_amount
    trigger: "event cancel cascade hop2 (Order CHARGED→CREDITED)"
    algorithm: threshold
    formula: |
      paid = order.final_total_cents
      # Goodwill bonus tier depends on seller fault AND buyer loyalty (NON-LINEAR branch):
      base = paid
      If event.status == CANCELLED (seller/event fault):
        If buyer.lifetime_orders_count >= LOYALTY_THRESHOLD:
          amount_cents = floor(base * 1.10)   # 110% loyalty goodwill bonus; bonus_applied=true
        Else:
          amount_cents = base                 # 100% face credit; bonus_applied=false
      Else:
        amount_cents = base
    input_set: "Order.final_total_cents, Event.status, Buyer.lifetime_orders_count at cancel time"
    constants:
      LOYALTY_THRESHOLD: 3
      BONUS_MULTIPLIER: 1.10
    precision: "floor truncation"

  # --- Transfer deadline: interval arithmetic, last-minute compression ---
  - name: transfer_deadline
    trigger: "Transfer SENT"
    algorithm: interval_merge
    formula: |
      now = current clock at SEND.
      If NOT is_last_minute:
        deadline_at = now + STANDARD_WINDOW_MINUTES minutes   # generous window
      If is_last_minute:
        # compressed: must accept before doors OR within the short last-minute window, whichever EARLIER
        candidate = now + LAST_MINUTE_WINDOW_MINUTES minutes
        deadline_at = min(candidate, event.doors_open_at)
      is_last_minute = (now >= event.doors_open_at - event.last_minute_cutoff_minutes)
    input_set: "current clock, Event.doors_open_at, Event.last_minute_cutoff_minutes"
    constants:
      STANDARD_WINDOW_MINUTES: 1440
      LAST_MINUTE_WINDOW_MINUTES: 30
    precision: "minute-resolution datetime arithmetic; half-open: acceptance valid iff now_at_accept < deadline_at (strict <)"

  # --- Order lifecycle rollup: derived from two parallel axes (circular-looking ordering) ---
  - name: order_lifecycle_rollup
    trigger: "any change to payment_status or delivery_status"
    algorithm: projection
    formula: |
      # Evaluation order pinned: payment axis first, then delivery axis.
      If payment_status IN {REFUNDED, CREDITED}:
        lifecycle_state = UNWOUND
      Elif payment_status == CHARGED AND delivery_status IN {DELIVERED, REPLACED}:
        lifecycle_state = SETTLED
      Else:
        lifecycle_state = OPEN
    input_set: "Order.payment_status, Order.delivery_status"
    precision: "n/a (enum projection)"

  # --- Fraud severity: combinatorial threshold over signal + price gouge ---
  - name: fraud_severity
    trigger: "FraudFlag creation"
    algorithm: threshold
    formula: |
      If signal == DUPLICATE_BARCODE: severity = HIGH
      Elif signal == CHARGEBACK: severity = HIGH
      Elif signal == PRICE_GOUGE:
        # gouge is HIGH only when listing effective price exceeds the cap-adjacent band
        face = Section.face_value_cents
        severity = HIGH if listing.effective_price_cents > floor(face * GOUGE_RATIO) else LOW
      Else (VELOCITY): severity = LOW
    input_set: "FraudFlag.signal, subject Listing.effective_price_cents, Section.face_value_cents"
    constants:
      GOUGE_RATIO: 2.5
    precision: "floor truncation on the gouge band"

  # --- Available seat reconciliation (derived-field consistency) ---
  - name: available_seat_reconciliation
    trigger: "any Seat status change; any Listing reservation/charge/release"
    algorithm: aggregation
    formula: |
      Listing.available_seat_count = count(Seat WHERE listing_id==L.id AND status==AVAILABLE)
      Listing.total_seat_count    = count(Seat WHERE listing_id==L.id AND status != VOID)
      INVARIANT: available_seat_count + count(status==HELD) + count(status==SOLD)
                 + count(status==TRANSFERRED) == total_seat_count
    input_set: "all Seats under the listing"
    precision: "integer counts"

# =============================================================================
# §1.4 Validation Rules Table (Ordered by priority)
# =============================================================================
validations:
  - priority: 0
    category: existence
    check: "Request body well-formed: required fields present, types/enums valid, numbers in range (e.g. quantity>=1, face_value_cents>0). Malformed → reject before auth-independent body parse"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all POST/PUT/PATCH endpoints
    note: "Body-shape validation; runs first so a malformed body never reaches auth/business logic"

  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for the operation per §1.7; entity_backed role's X-User-ID must own the targeted resource"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path/body FK ids resolve to existing resources, validated left-to-right (event → listing → seat/order)"
    error_id: "ERR_EVENT_NOT_FOUND / ERR_LISTING_NOT_FOUND / ERR_ORDER_NOT_FOUND / ERR_SEAT_NOT_FOUND / ERR_TRANSFER_NOT_FOUND / ERR_PAYOUT_NOT_FOUND / ERR_CLAIM_NOT_FOUND / ERR_CREDIT_NOT_FOUND / ERR_FLAG_NOT_FOUND / ERR_BUYER_NOT_FOUND / ERR_SELLER_NOT_FOUND / ERR_SECTION_NOT_FOUND / ERR_VENUE_NOT_FOUND"
    http_status: 404
    applies_to: all endpoints referencing a resource

  - priority: 4
    category: business_referential
    check: "Cross-entity reference integrity: listing.section_id and seat.section must match; offered_listing_id must be on same event; order.listing must match path"
    error_id: ERR_REFERENTIAL_MISMATCH
    http_status: 422
    applies_to: "listing create, seat create, offer-replacement, order create"

  - priority: 5
    category: state
    check: "Target resource (and cross-entity dependency e.g. Event/Listing/Payout) in a state that permits the transition"
    error_id: "ERR_INVALID_STATE / ERR_LISTING_FROZEN / ERR_EVENT_NOT_SELLING / ERR_ALREADY_TERMINAL / ERR_PAYOUT_NOT_RELEASABLE / ERR_DELIVERY_BEFORE_PAYMENT"
    http_status: 409
    applies_to: all state-changing endpoints

  - priority: 6
    category: business_safety
    check: "Fraud guard: a HIGH open/confirmed fraud flag on the listing blocks activate and sale-create; RESTRICTED seller cannot activate"
    error_id: "ERR_LISTING_FROZEN / ERR_SELLER_RESTRICTED"
    http_status: 409
    applies_to: "listing activate, order create"

  - priority: 7
    category: business_temporal
    check: "Temporal: reservation must be charged before reservation_expires_at; transfer must be accepted before deadline_at; last-minute compresses deadline"
    error_id: "ERR_RESERVATION_EXPIRED / ERR_TRANSFER_DEADLINE_PASSED"
    http_status: 409
    applies_to: "order charge, transfer accept"

  - priority: 8
    category: business_constraint
    check: "Inventory/uniqueness: seats addable only while listing DRAFT; split_rule satisfied; barcode_token unique across non-VOID seats; quantity <= available_seat_count; one open guarantee claim per order; idempotency_key reuse with different params rejected"
    error_id: "ERR_SEAT_NOT_ADDABLE / ERR_SPLIT_RULE_VIOLATION / ERR_DUPLICATE_BARCODE / ERR_INSUFFICIENT_SEATS / ERR_OPEN_CLAIM_EXISTS / ERR_IDEMPOTENCY_CONFLICT"
    http_status: 409
    applies_to: "order create, seat create, guarantee-claim create"

  - priority: 9
    category: business_fiscal
    check: "Fiscal: applied_credit_cents <= buyer.wallet_credit_cents; ask/dynamic_floor within price cap; payout pay only when escrow covers"
    error_id: "ERR_INSUFFICIENT_WALLET_CREDIT / ERR_PRICE_CAP_EXCEEDED / ERR_DYNAMIC_FLOOR_INVALID"
    http_status: 402
    applies_to: "order create, order charge, listing create"

  - priority: 10
    category: business_constraint
    check: "OCC: expected_listing_version / expected_payout_version must equal current parent version"
    error_id: "ERR_STALE_LISTING_VERSION / ERR_STALE_PAYOUT_VERSION"
    http_status: 412
    applies_to: "order create, payout pay"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Test-driving clock (last resort per §1.5 ladder; time-gated setups) ----
  - method: POST
    path: "/_clock/set"
    description: "Set the simulated current UTC clock to an absolute instant (test-driving)"
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects: ["Triggers system sweeps: reservation expiry, transfer EXPIRED, last-minute crossing"]

  - method: POST
    path: "/_clock/advance"
    description: "Advance the simulated clock by N minutes; fires due system sweeps deterministically"
    roles: [PlatformAdmin]
    code: 200
    input: [by_minutes]
    output: "{ current_utc: datetime }"
    side_effects: ["Reservations past expiry auto-refund; SENT transfers past deadline EXPIRE; ISSUED credits past validity EXPIRE"]

  # ---- Venue ----
  - method: POST
    path: "/venues"
    description: "Create venue"
    roles: [PlatformAdmin]
    code: 201
    input: [name, timezone]
    output: Venue
    side_effects: ["status seeds; total_section_count=0"]

  - method: GET
    path: "/venues/{venueId}"
    description: "Get venue"
    roles: [PlatformAdmin, Seller, Buyer, TrustSafety]
    code: 200
    input: []
    output: Venue
    side_effects: []

  # ---- Section (FK -> Venue) ----
  - method: POST
    path: "/sections"
    description: "Create section under a venue"
    roles: [PlatformAdmin]
    code: 201
    input: [venue_id, name, price_zone, face_value_cents, row_count, seats_per_row]
    output: Section
    side_effects: ["capacity computed; venue.total_section_count recomputed"]

  - method: GET
    path: "/sections/{sectionId}"
    description: "Get section"
    roles: [PlatformAdmin, Seller, Buyer, TrustSafety]
    code: 200
    input: []
    output: Section
    side_effects: []

  - method: GET
    path: "/sections"
    description: "List sections; filter by venue_id"
    roles: [PlatformAdmin, Seller, Buyer, TrustSafety]
    code: 200
    input: ["venue_id?"]
    output: "Section[]"
    side_effects: []

  # ---- Event (FK -> Venue) ----
  - method: POST
    path: "/events"
    description: "Create event"
    roles: [PlatformAdmin]
    code: 201
    input: [venue_id, title, doors_open_at, "price_cap_multiplier?", "last_minute_cutoff_minutes?"]
    output: Event
    side_effects: ["status=SCHEDULED"]

  - method: GET
    path: "/events/{eventId}"
    description: "Get event"
    roles: [PlatformAdmin, Seller, Buyer, TrustSafety]
    code: 200
    input: []
    output: Event
    side_effects: []

  - method: GET
    path: "/events"
    description: "List events; filter by venue_id"
    roles: [PlatformAdmin, Seller, Buyer, TrustSafety]
    code: 200
    input: ["venue_id?"]
    output: "Event[]"
    side_effects: []

  - method: POST
    path: "/events/{eventId}/open-sales"
    description: "Open event for sales (SCHEDULED/POSTPONED → ON_SALE)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Event
    side_effects: ["status → ON_SALE"]

  - method: POST
    path: "/events/{eventId}/enter-last-minute"
    description: "Mark event as last-minute window (ON_SALE → LAST_MINUTE)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Event
    side_effects: ["status → LAST_MINUTE"]

  - method: POST
    path: "/events/{eventId}/complete"
    description: "Complete event after doors; releases escrowed payouts"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Event
    side_effects: ["status → COMPLETED; ESCROWED payouts on event orders → RELEASABLE; open listings → DELISTED"]

  - method: POST
    path: "/events/{eventId}/cancel"
    description: "Cancel event; cascades credits/clawbacks/voids"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Event
    side_effects: ["status → CANCELLED; 4-hop cascade: listings DELISTED → orders CREDITED → payouts CLAWED_BACK → seats VOID"]

  - method: POST
    path: "/events/{eventId}/postpone"
    description: "Postpone event"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Event
    side_effects: ["status → POSTPONED"]

  # ---- Seller ----
  - method: POST
    path: "/sellers"
    description: "Register seller"
    roles: [PlatformAdmin, Seller]
    code: 201
    input: [display_name, payout_account_ref]
    output: Seller
    side_effects: ["trust_tier=NEW; balances 0"]

  - method: GET
    path: "/sellers/{sellerId}"
    description: "Get seller"
    roles: [PlatformAdmin, Seller, TrustSafety]
    code: 200
    input: []
    output: Seller
    side_effects: []

  - method: PATCH
    path: "/sellers/{sellerId}/trust-tier"
    description: "Set seller trust tier (admin/trust ops)"
    roles: [PlatformAdmin, TrustSafety]
    code: 200
    input: [trust_tier]
    output: Seller
    side_effects: ["trust_tier updated; affects future seller_fee_rate"]

  # ---- Buyer ----
  - method: POST
    path: "/buyers"
    description: "Register buyer"
    roles: [PlatformAdmin, Buyer]
    code: 201
    input: [display_name]
    output: Buyer
    side_effects: ["wallet_credit_cents=0; lifetime_orders_count=0"]

  - method: GET
    path: "/buyers/{buyerId}"
    description: "Get buyer"
    roles: [PlatformAdmin, Buyer, TrustSafety]
    code: 200
    input: []
    output: Buyer
    side_effects: []

  # ---- Listing (FK -> Event, Seller, Section) ----
  - method: POST
    path: "/listings"
    description: "Create listing (DRAFT)"
    roles: [Seller]
    code: 201
    input: [event_id, seller_id, section_id, delivery_method, ask_price_cents, pricing_mode, split_rule, "dynamic_floor_cents?"]
    output: Listing
    side_effects: ["status=DRAFT; price-cap and dynamic_floor validated"]

  - method: GET
    path: "/listings/{listingId}"
    description: "Get listing; DYNAMIC mode recomputes effective_price_cents on read"
    roles: [PlatformAdmin, Seller, Buyer, TrustSafety]
    code: 200
    input: []
    output: Listing
    side_effects: ["effective_price_cents refreshed for DYNAMIC mode"]

  - method: GET
    path: "/listings"
    description: "List listings; filter by event_id, seller_id, or section_id"
    roles: [PlatformAdmin, Seller, Buyer, TrustSafety]
    code: 200
    input: ["event_id?", "seller_id?", "section_id?"]
    output: "Listing[]"
    side_effects: []

  - method: POST
    path: "/listings/{listingId}/activate"
    description: "Activate listing (DRAFT → ACTIVE)"
    roles: [Seller]
    code: 200
    input: []
    output: Listing
    side_effects: ["status → ACTIVE; effective_price_cents computed"]

  - method: POST
    path: "/listings/{listingId}/delist"
    description: "Delist listing (DRAFT/ACTIVE → DELISTED)"
    roles: [Seller]
    code: 200
    input: []
    output: Listing
    side_effects: ["status → DELISTED; AVAILABLE seats → VOID"]

  # ---- Seat (FK -> Listing) ----
  - method: POST
    path: "/seats"
    description: "Add a seat to a listing (only while DRAFT)"
    roles: [Seller]
    code: 201
    input: [listing_id, row_label, seat_number, barcode_token]
    output: Seat
    side_effects: ["status=AVAILABLE; section_id copied from listing; uniqueness of barcode_token enforced; counts reconcile"]

  - method: GET
    path: "/seats/{seatId}"
    description: "Get seat"
    roles: [PlatformAdmin, Seller, Buyer, TrustSafety]
    code: 200
    input: []
    output: Seat
    side_effects: []

  - method: GET
    path: "/seats"
    description: "List seats; filter by listing_id, order_id, or section_id"
    roles: [PlatformAdmin, Seller, Buyer, TrustSafety]
    code: 200
    input: ["listing_id?", "order_id?", "section_id?"]
    output: "Seat[]"
    side_effects: []

  # ---- Order (FK -> Listing, Buyer) ----
  - method: POST
    path: "/orders"
    description: "Create order = reserve seats (sale create); OCC on listing version"
    roles: [Buyer]
    code: 201
    input: [listing_id, buyer_id, quantity, expected_listing_version, "applied_credit_cents?", "idempotency_key?", "replacement_of_order_id?"]
    output: Order
    side_effects:
      - "quantity Seats (FIFO created_at ASC) → HELD; available_seat_count decremented; listing.version += 1"
      - "if available_seat_count reaches 0 the Listing → SOLD_OUT"
      - "estimated_total_cents, buyer_fee_cents computed (calc buyer_charge variant=estimate)"
      - "locked_unit_price_cents := listing.effective_price_cents; reservation_expires_at set"

  - method: GET
    path: "/orders/{orderId}"
    description: "Get order"
    roles: [PlatformAdmin, Seller, Buyer, TrustSafety]
    code: 200
    input: []
    output: Order
    side_effects: []

  - method: GET
    path: "/orders"
    description: "List orders; filter by listing_id, buyer_id, or replacement_of_order_id"
    roles: [PlatformAdmin, Seller, Buyer, TrustSafety]
    code: 200
    input: ["listing_id?", "buyer_id?", "replacement_of_order_id?"]
    output: "Order[]"
    side_effects: []

  - method: POST
    path: "/orders/{orderId}/charge"
    description: "Charge the reservation (payment PENDING → CHARGED; the order's HELD seats become SOLD)"
    roles: [Buyer]
    code: 200
    input: []
    output: Order
    side_effects:
      - "payment_status → CHARGED; final_total_cents computed (calc buyer_charge variant=final)"
      - "applied credits REDEEMED; the order's HELD seats → SOLD; Payout created ESCROWED"
      - "order.version += 1; listing.version += 1; buyer.lifetime_orders_count recomputed"

  - method: POST
    path: "/orders/{orderId}/cancel-reservation"
    description: "Cancel an unpaid reservation (PENDING → REFUNDED; held seats return to the pool)"
    roles: [Buyer]
    code: 200
    input: []
    output: Order
    side_effects: ["the order's HELD seats → AVAILABLE; SOLD_OUT listing → ACTIVE; listing.version += 1; credit hold released"]

  - method: POST
    path: "/orders/{orderId}/confirm-delivery-window"
    description: "Mark delivered order's payout RELEASABLE (admin gate before event complete)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Order
    side_effects: ["ESCROWED Payout (delivery_status==DELIVERED) → RELEASABLE"]

  # ---- Transfer (FK -> Order) ----
  - method: POST
    path: "/orders/{orderId}/transfers"
    description: "Initiate a transfer for a charged order (barcode/mobile delivery)"
    roles: [Seller]
    code: 201
    input: []
    output: Transfer
    side_effects: ["Transfer INITIATED; method copied; is_last_minute computed; attempt_number set"]

  - method: GET
    path: "/transfers/{transferId}"
    description: "Get transfer"
    roles: [PlatformAdmin, Seller, Buyer, TrustSafety]
    code: 200
    input: []
    output: Transfer
    side_effects: []

  - method: GET
    path: "/transfers"
    description: "List transfers; filter by order_id"
    roles: [PlatformAdmin, Seller, Buyer, TrustSafety]
    code: 200
    input: ["order_id?"]
    output: "Transfer[]"
    side_effects: []

  - method: POST
    path: "/transfers/{transferId}/send"
    description: "Send the transfer credential (INITIATED → SENT); sets deadline"
    roles: [Seller]
    code: 200
    input: []
    output: Transfer
    side_effects: ["status → SENT; deadline_at computed (calc transfer_deadline); order delivery → IN_TRANSFER"]

  - method: POST
    path: "/transfers/{transferId}/accept"
    description: "Buyer accepts credential (SENT → ACCEPTED); order delivered"
    roles: [Buyer]
    code: 200
    input: []
    output: Transfer
    side_effects: ["status → ACCEPTED; order delivery → DELIVERED; seats → TRANSFERRED"]

  - method: POST
    path: "/transfers/{transferId}/fail"
    description: "Seller marks transfer failed"
    roles: [Seller]
    code: 200
    input: []
    output: Transfer
    side_effects: ["status → FAILED; order delivery → DELIVERY_FAILED"]

  - method: POST
    path: "/transfers/{transferId}/recall"
    description: "Seller recalls a sent credential before acceptance"
    roles: [Seller]
    code: 200
    input: []
    output: Transfer
    side_effects: ["status → RECALLED; order delivery → AWAITING"]

  # ---- Payout (FK -> Order, Seller) ----
  - method: GET
    path: "/payouts/{payoutId}"
    description: "Get payout"
    roles: [PlatformAdmin, Seller, TrustSafety]
    code: 200
    input: []
    output: Payout
    side_effects: []

  - method: GET
    path: "/payouts"
    description: "List payouts; filter by order_id or seller_id"
    roles: [PlatformAdmin, Seller, TrustSafety]
    code: 200
    input: ["order_id?", "seller_id?"]
    output: "Payout[]"
    side_effects: []

  - method: POST
    path: "/payouts/{payoutId}/pay"
    description: "Release payout to seller (RELEASABLE → PAID); OCC on payout version"
    roles: [PlatformAdmin]
    code: 200
    input: [expected_payout_version]
    output: Payout
    side_effects: ["status → PAID; seller balances recomputed; payout.version += 1"]

  # ---- GuaranteeClaim (FK -> Order) ----
  - method: POST
    path: "/guarantee-claims"
    description: "File a buyer guarantee claim against a charged order"
    roles: [Buyer]
    code: 201
    input: [order_id, reason]
    output: GuaranteeClaim
    side_effects: ["status=FILED; round_number=0; one open claim per order enforced"]

  - method: GET
    path: "/guarantee-claims/{claimId}"
    description: "Get guarantee claim"
    roles: [PlatformAdmin, Buyer, Seller, TrustSafety]
    code: 200
    input: []
    output: GuaranteeClaim
    side_effects: []

  - method: GET
    path: "/guarantee-claims"
    description: "List guarantee claims; filter by order_id, offered_listing_id, or replacement_order_id"
    roles: [PlatformAdmin, Buyer, Seller, TrustSafety]
    code: 200
    input: ["order_id?", "offered_listing_id?", "replacement_order_id?"]
    output: "GuaranteeClaim[]"
    side_effects: []

  - method: POST
    path: "/guarantee-claims/{claimId}/investigate"
    description: "Begin investigation (FILED → INVESTIGATING)"
    roles: [TrustSafety]
    code: 200
    input: []
    output: GuaranteeClaim
    side_effects: ["status → INVESTIGATING"]

  - method: POST
    path: "/guarantee-claims/{claimId}/offer-replacement"
    description: "Offer a replacement listing (INVESTIGATING → REPLACEMENT_OFFERED)"
    roles: [TrustSafety]
    code: 200
    input: [offered_listing_id]
    output: GuaranteeClaim
    side_effects: ["status → REPLACEMENT_OFFERED; offered_listing_id validated (same event, ACTIVE, enough seats)"]

  - method: POST
    path: "/guarantee-claims/{claimId}/reject-offer"
    description: "Buyer rejects the offered replacement (REPLACEMENT_OFFERED → INVESTIGATING; cyclic)"
    roles: [Buyer]
    code: 200
    input: []
    output: GuaranteeClaim
    side_effects: ["status → INVESTIGATING; round_number += 1"]

  - method: POST
    path: "/guarantee-claims/{claimId}/accept-offer"
    description: "Buyer accepts replacement (REPLACEMENT_OFFERED → RESOLVED_REPLACED)"
    roles: [Buyer]
    code: 200
    input: [expected_listing_version]
    output: GuaranteeClaim
    side_effects: ["replacement Order minted; original order REPLACED; original seats VOID; original payout CANCELLED"]

  - method: POST
    path: "/guarantee-claims/{claimId}/refund"
    description: "Resolve claim by refund (→ RESOLVED_REFUNDED)"
    roles: [TrustSafety]
    code: 200
    input: []
    output: GuaranteeClaim
    side_effects: ["refund_amount_cents computed; order REFUNDED; payout CLAWED_BACK; seats VOID"]

  - method: POST
    path: "/guarantee-claims/{claimId}/deny"
    description: "Deny claim (→ DENIED)"
    roles: [TrustSafety]
    code: 200
    input: []
    output: GuaranteeClaim
    side_effects: ["status → DENIED; no financial change"]

  # ---- EventCredit (FK -> Buyer, Event, Order) ----
  - method: GET
    path: "/event-credits/{creditId}"
    description: "Get event credit"
    roles: [PlatformAdmin, Buyer, TrustSafety]
    code: 200
    input: []
    output: EventCredit
    side_effects: []

  - method: GET
    path: "/event-credits"
    description: "List event credits; filter by buyer_id, event_id, or source_order_id"
    roles: [PlatformAdmin, Buyer, TrustSafety]
    code: 200
    input: ["buyer_id?", "event_id?", "source_order_id?"]
    output: "EventCredit[]"
    side_effects: []

  - method: POST
    path: "/event-credits/{creditId}/revoke"
    description: "Revoke an issued credit (ISSUED → REVOKED)"
    roles: [TrustSafety]
    code: 200
    input: []
    output: EventCredit
    side_effects: ["status → REVOKED; buyer.wallet_credit_cents recomputed"]

  # ---- FraudFlag (polymorphic FK -> Listing | Order | Seat) ----
  - method: POST
    path: "/fraud-flags"
    description: "Raise a fraud/duplicate flag on a listing, order, or seat"
    roles: [TrustSafety, PlatformAdmin]
    code: 201
    input: [subject_type, signal, "listing_id?", "order_id?", "seat_id?"]
    output: FraudFlag
    side_effects: ["severity computed (calc fraud_severity); status=OPEN; HIGH on listing → listing FROZEN"]

  - method: GET
    path: "/fraud-flags/{flagId}"
    description: "Get fraud flag"
    roles: [PlatformAdmin, TrustSafety, Seller]
    code: 200
    input: []
    output: FraudFlag
    side_effects: []

  - method: GET
    path: "/fraud-flags"
    description: "List fraud flags; filter by listing_id, order_id, or seat_id"
    roles: [PlatformAdmin, TrustSafety, Seller]
    code: 200
    input: ["listing_id?", "order_id?", "seat_id?"]
    output: "FraudFlag[]"
    side_effects: []

  - method: POST
    path: "/fraud-flags/{flagId}/review"
    description: "Begin review (OPEN → UNDER_REVIEW)"
    roles: [TrustSafety]
    code: 200
    input: []
    output: FraudFlag
    side_effects: ["status → UNDER_REVIEW"]

  - method: POST
    path: "/fraud-flags/{flagId}/confirm"
    description: "Confirm fraud (→ CONFIRMED); duplicate seat VOID; HIGH listing FROZEN"
    roles: [TrustSafety]
    code: 200
    input: []
    output: FraudFlag
    side_effects: ["status → CONFIRMED; DUPLICATE_BARCODE seat → VOID; listing FROZEN if HIGH"]

  - method: POST
    path: "/fraud-flags/{flagId}/dismiss"
    description: "Dismiss flag (→ DISMISSED); unfreezes listing if last HIGH flag"
    roles: [TrustSafety]
    code: 200
    input: []
    output: FraudFlag
    side_effects: ["status → DISMISSED; listing FROZEN → ACTIVE if no other HIGH open flag"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- Request / auth ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, wrong types, or missing required field" }
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 401, condition: "X-User-ID / X-User-Role header missing or malformed" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted, or entity-backed user does not own the targeted resource" }

  # --- Not found ---
  - { id: ERR_VENUE_NOT_FOUND, http: 404, condition: "Venue does not exist" }
  - { id: ERR_SECTION_NOT_FOUND, http: 404, condition: "Section does not exist" }
  - { id: ERR_EVENT_NOT_FOUND, http: 404, condition: "Event does not exist" }
  - { id: ERR_SELLER_NOT_FOUND, http: 404, condition: "Seller does not exist" }
  - { id: ERR_BUYER_NOT_FOUND, http: 404, condition: "Buyer does not exist" }
  - { id: ERR_LISTING_NOT_FOUND, http: 404, condition: "Listing does not exist" }
  - { id: ERR_SEAT_NOT_FOUND, http: 404, condition: "Seat does not exist" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "Order does not exist" }
  - { id: ERR_TRANSFER_NOT_FOUND, http: 404, condition: "Transfer does not exist" }
  - { id: ERR_PAYOUT_NOT_FOUND, http: 404, condition: "Payout does not exist" }
  - { id: ERR_CLAIM_NOT_FOUND, http: 404, condition: "GuaranteeClaim does not exist" }
  - { id: ERR_CREDIT_NOT_FOUND, http: 404, condition: "EventCredit does not exist" }
  - { id: ERR_FLAG_NOT_FOUND, http: 404, condition: "FraudFlag does not exist" }

  # --- Referential ---
  - { id: ERR_REFERENTIAL_MISMATCH, http: 422, condition: "Cross-entity references inconsistent (section/event mismatch, polymorphic subject id wrong for subject_type, order/listing mismatch)" }

  # --- State ---
  - { id: ERR_INVALID_STATE, http: 409, condition: "Transition not permitted from current state" }
  - { id: ERR_ALREADY_TERMINAL, http: 409, condition: "Resource already in a terminal state" }
  - { id: ERR_EVENT_NOT_SELLING, http: 409, condition: "Event not in ON_SALE/LAST_MINUTE for the operation" }
  - { id: ERR_LISTING_FROZEN, http: 409, condition: "Listing FROZEN by a HIGH fraud flag; activate/sale blocked" }
  - { id: ERR_DELIVERY_BEFORE_PAYMENT, http: 409, condition: "Transfer/delivery attempted before order payment_status==CHARGED" }
  - { id: ERR_PAYOUT_NOT_RELEASABLE, http: 409, condition: "Payout pay attempted when status != RELEASABLE" }

  # --- Safety ---
  - { id: ERR_SELLER_RESTRICTED, http: 409, condition: "RESTRICTED seller cannot activate listings" }

  # --- Temporal ---
  - { id: ERR_RESERVATION_EXPIRED, http: 409, condition: "Charge attempted after reservation_expires_at" }
  - { id: ERR_TRANSFER_DEADLINE_PASSED, http: 409, condition: "Transfer accept attempted at/after deadline_at" }

  # --- Constraint / inventory ---
  - { id: ERR_SPLIT_RULE_VIOLATION, http: 409, condition: "Requested quantity violates listing split_rule (PAIRS/WHOLE)" }
  - { id: ERR_DUPLICATE_BARCODE, http: 409, condition: "barcode_token already used by a non-VOID seat" }
  - { id: ERR_INSUFFICIENT_SEATS, http: 409, condition: "quantity exceeds listing available_seat_count" }
  - { id: ERR_OPEN_CLAIM_EXISTS, http: 409, condition: "An open GuaranteeClaim already exists for the order" }
  - { id: ERR_SEAT_NOT_ADDABLE, http: 409, condition: "Seats can only be added while listing is DRAFT" }

  # --- Fiscal ---
  - { id: ERR_INSUFFICIENT_WALLET_CREDIT, http: 402, condition: "applied_credit_cents exceeds buyer.wallet_credit_cents" }
  - { id: ERR_PRICE_CAP_EXCEEDED, http: 402, condition: "ask_price_cents (or dynamic floor) exceeds face_value * price_cap_multiplier" }
  - { id: ERR_DYNAMIC_FLOOR_INVALID, http: 402, condition: "dynamic_floor_cents > ask_price_cents or missing for DYNAMIC mode" }

  # --- Concurrency (OCC) ---
  - { id: ERR_STALE_LISTING_VERSION, http: 412, condition: "expected_listing_version != current Listing.version" }
  - { id: ERR_STALE_PAYOUT_VERSION, http: 412, condition: "expected_payout_version != current Payout.version" }

  # --- Idempotency ---
  - { id: ERR_IDEMPOTENCY_CONFLICT, http: 409, condition: "idempotency_key reused with different request parameters" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Platform/marketplace operator; manages venues, sections, events, payouts release, delivery-window confirmation"
    identity: opaque
    exclusive_operations:
      - "POST /venues, POST /sections, POST /events — catalog setup"
      - "POST /events/{id}/open-sales|enter-last-minute|complete|cancel|postpone — event lifecycle"
      - "POST /orders/{id}/confirm-delivery-window — gate payout release"
      - "POST /payouts/{id}/pay — release seller payout"
      - "POST /_clock/set, POST /_clock/advance — simulated clock control"
    shared_operations:
      - "GET reads across venues, sections, events, sellers, buyers, listings, seats, orders, transfers, payouts, claims, credits, flags"
      - "POST /sellers, POST /buyers — may register on behalf"
      - "PATCH /sellers/{id}/trust-tier — shared with TrustSafety"
      - "POST /fraud-flags — shared with TrustSafety"

  - name: Seller
    description: "Ticket seller; owns listings, seats, transfers; views own payouts"
    identity: "entity_backed:Seller"
    exclusive_operations:
      - "POST /listings, POST /listings/{id}/activate|delist — own listings only"
      - "POST /seats — add seats to own DRAFT listings"
      - "POST /orders/{id}/transfers, POST /transfers/{id}/send|fail|recall — deliver own sales"
    shared_operations:
      - "POST /sellers — self-register"
      - "GET reads on own listings, seats, transfers, payouts; public event/section/venue reads"

  - name: Buyer
    description: "Ticket buyer; owns orders, guarantee claims, event credits"
    identity: "entity_backed:Buyer"
    exclusive_operations:
      - "POST /orders, POST /orders/{id}/charge|cancel-reservation — own orders only"
      - "POST /transfers/{id}/accept — accept delivery on own order"
      - "POST /guarantee-claims, POST /guarantee-claims/{id}/reject-offer|accept-offer — own claims"
    shared_operations:
      - "POST /buyers — self-register"
      - "GET reads on own orders, claims, credits; public listing/event reads"

  - name: TrustSafety
    description: "Trust & safety operator; manages fraud flags, guarantee adjudication, credit revocation"
    identity: opaque
    exclusive_operations:
      - "POST /fraud-flags/{id}/review|confirm|dismiss — fraud workflow"
      - "POST /guarantee-claims/{id}/investigate|offer-replacement|refund|deny — adjudication"
      - "POST /event-credits/{id}/revoke — revoke credit"
    shared_operations:
      - "POST /fraud-flags — shared with PlatformAdmin"
      - "PATCH /sellers/{id}/trust-tier — shared with PlatformAdmin"
      - "GET reads across all resources"
