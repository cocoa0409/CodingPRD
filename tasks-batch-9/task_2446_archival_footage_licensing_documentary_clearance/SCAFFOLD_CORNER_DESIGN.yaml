            - "call 1 returns 403 ERR_SEGREGATION_OF_DUTIES; FairUseAnalysis.${fua_id}.status is still SUBMITTED and Asset.${asset_id}.licensing_status is still UNCLEARED"
            - "call 2 returns 200 with status ACCEPTED, Asset.${asset_id}.licensing_status == CLEARED and rights_basis == FAIR_USE"
            - "priority 23 fires after the role check passes — both callers are LegalCounsel, so this is an identity rule, not a role rule"

      - name: entity_backed_rep_cannot_quote_on_another_archives_license
        claim_type: peer_roles
        grounds:
          - roles.RightsHolderRep
          - validations[priority=4]
          - validations[priority=33]
