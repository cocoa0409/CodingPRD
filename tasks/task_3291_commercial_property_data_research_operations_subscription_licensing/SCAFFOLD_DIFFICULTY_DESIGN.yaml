    - validations.priority_5_state
    - errors.ERR_PROPERTY_FROZEN
    - errors.ERR_THIRD_PARTY_UNLICENSED
    distinguishing_aspect: 'The (state, business_safety) pair: on a FROZEN property a third-party attribute proposal returns 409 ERR_THIRD_PARTY_UNLICENSED, not 409 ERR_PROPERTY_FROZEN.'
    test_recipe:
