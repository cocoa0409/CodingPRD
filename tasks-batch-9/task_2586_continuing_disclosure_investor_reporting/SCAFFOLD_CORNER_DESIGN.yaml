      - name: bond_issue_creation_rejects_unknown_enum_and_inverted_dates
        claim_type: type_constraints
        grounds:
          - validations.priority_5_ERR_INVALID_REQUEST
          - entities.BondIssue.fields.security_type
          - entities.BondIssue.fields.final_maturity_date
          - entities.BondIssue.fields.original_par_amount_cents
        distinguishing_aspect: >-
          Three different shape failures on the same endpoint all collapse to priority 5's
          ERR_INVALID_REQUEST (422): an enum value outside the declared set, a
          final_maturity_date that is not strictly after dated_date, and a non-positive par
          amount. The equal-dates probe pins "strictly after" rather than ">=".
        test_recipe:
          setup:
            - "Empty database; no prior BondIssue, so no uniqueness rule can interfere."
          setup_api_calls: []
          trigger:
            - call: "POST /disclosure/bond-issues"
              payload: { issuer_program_code: "CIVICCENTER", series_designation: "2026A", security_type: "MORAL_OBLIGATION", dated_date: "2026-04-01", final_maturity_date: "2056-04-01", original_par_amount_cents: 75000000 }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { e_enum: "$.data.error_id" }
            - call: "POST /disclosure/bond-issues"
              payload: { issuer_program_code: "CIVICCENTER", series_designation: "2026A", security_type: "REVENUE", dated_date: "2026-04-01", final_maturity_date: "2026-04-01", original_par_amount_cents: 75000000 }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { e_dates: "$.data.error_id" }
            - call: "POST /disclosure/bond-issues"
              payload: { issuer_program_code: "CIVICCENTER", series_designation: "2026A", security_type: "REVENUE", dated_date: "2026-04-01", final_maturity_date: "2056-04-01", original_par_amount_cents: 0 }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { e_par: "$.data.error_id" }
            - call: "GET /disclosure/bond-issues"
              payload: {}
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { issue_total: "$.total_count" }
          assert:
            - "${e_enum} == ERR_INVALID_REQUEST with HTTP 422"
            - "${e_dates} == ERR_INVALID_REQUEST with HTTP 422 — equal dates fail the strictly-after constraint"
            - "${e_par} == ERR_INVALID_REQUEST with HTTP 422 — the declared constraint is >= 1"
            - "${issue_total} == 0 — no row was created by any of the three refused requests"

      - name: content_requirement_is_immutable_with_no_version_and_no_update_endpoint
        claim_type: immutability
        grounds:
          - entities.ContentRequirement
          - endpoints.GET_/disclosure/content-requirements/{id}
          - endpoints.GET_/disclosure/content-requirements
        distinguishing_aspect: >-
          ContentRequirement is the scaffold's only common_fields:false entity, so its response
          carries id and created_at but NO updated_at and NO version, and §1.5 declares no PATCH
          or action endpoint against it — configuration is replaced by adding a new (undertaking,
          kind) row, never edited. Existing cycles keep their weight_bp_snapshot regardless.
        test_recipe:
          setup:
            - "One OUTSTANDING BondIssue with one ACTIVE Undertaking and one 10000-bp OPERATING_DATA_TABLE ContentRequirement."
          setup_api_calls:
            - call: "POST /disclosure/bond-issues"
              payload: { issuer_program_code: "CIVICCENTER", series_designation: "2026A", security_type: "REVENUE", dated_date: "2026-04-01", final_maturity_date: "2056-04-01", original_par_amount_cents: 75000000 }
              as: FinanceDirector
              as_user_id: "fd-1"
