  - limit?
  - offset?
  output: PaymentOrder[]
  side_effects: []
- method: POST
  path: /counterparties/{id}/restrict
  description: Move a counterparty from ACTIVE to RESTRICTED
  roles:
  - PaymentApprover
  code: 200
  input: []
  output: Counterparty
  side_effects:
  - Counterparty.status = RESTRICTED
  - 'AuditEvent appended: action=counterparty.restricted'
- method: POST
  path: /counterparties/{id}/block
  description: Move a counterparty to BLOCKED from ACTIVE or RESTRICTED
  roles:
  - PaymentApprover
  code: 200
  input: []
  output: Counterparty
  side_effects:
  - Counterparty.status = BLOCKED
  - 'AuditEvent appended: action=counterparty.blocked'
- method: POST
  path: /counterparties/{id}/unblock
  description: Move a BLOCKED counterparty back to RESTRICTED
  roles:
  - PaymentApprover
  code: 200
  input: []
  output: Counterparty
  side_effects:
  - Counterparty.status = RESTRICTED
  - 'AuditEvent appended: action=counterparty.unblocked'
- method: POST
  path: /counterparties/{id}/restore
  description: Move a RESTRICTED counterparty back to ACTIVE
  roles:
  - PaymentApprover
  code: 200
  input: []
  output: Counterparty
  side_effects:
  - Counterparty.status = ACTIVE
  - 'AuditEvent appended: action=counterparty.restored'
- method: POST
  path: /counterparties/{id}/close
  description: Close a counterparty once no live payment order references it
  roles:
