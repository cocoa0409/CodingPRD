          rationale: "The dual-failure temporal-vs-constraint priority conflict is asserted as the failure path of the named §1.8 instance."

  - section: endpoints
    instances:
      - name: lead_list_pagination_and_source_filter
        claim_type: listing
        grounds: [endpoints."GET /crm/leads", response_envelope]
        distinguishing_aspect: "Filter + paginate interaction: three leads across two sources; team filter totals 3, source filter narrows to 2, limit=2 reports has_more true, and offset=2 returns the final item with has_more false."
        test_recipe:
          setup: ["Team; PORTAL source P and SPHERE source S (both auto_route false); leads L1, L2 from P and L3 from S"]
          setup_api_calls:
            - { call: "POST /crm/teams", payload: { name: "Alpha", market: "Austin", timezone: "America/Chicago" }, as: TeamAdmin, captures: { t: $.data.id } }
            - { call: "POST /crm/lead-sources", payload: { team_id: "${t}", name: "Zillow", type: "PORTAL", cost_per_lead_cents: 0, monthly_budget_cents: 1000000, auto_route: false }, as: TeamAdmin, captures: { p: $.data.id } }
            - { call: "POST /crm/lead-sources", payload: { team_id: "${t}", name: "Sphere", type: "SPHERE", cost_per_lead_cents: 0, monthly_budget_cents: 1000000, auto_route: false }, as: TeamAdmin, captures: { s: $.data.id } }
            - { call: "POST /crm/leads", payload: { team_id: "${t}", source_id: "${p}", contact_name: "L1", contact_phone: "+15125550130", contact_email: "1@x.com", expected_close_price_cents: 30000000 }, as: TeamAdmin }
            - { call: "POST /crm/leads", payload: { team_id: "${t}", source_id: "${p}", contact_name: "L2", contact_phone: "+15125550131", contact_email: "2@x.com", expected_close_price_cents: 30000000 }, as: TeamAdmin }
            - { call: "POST /crm/leads", payload: { team_id: "${t}", source_id: "${s}", contact_name: "L3", contact_phone: "+15125550132", contact_email: "3@x.com", expected_close_price_cents: 30000000 }, as: TeamAdmin }
          trigger:
            - { call: "GET /crm/leads?team_id=${t}", as: TeamAdmin }
            - { call: "GET /crm/leads?team_id=${t}&source_id=${p}", as: TeamAdmin }
            - { call: "GET /crm/leads?team_id=${t}&limit=2", as: TeamAdmin }
            - { call: "GET /crm/leads?team_id=${t}&limit=2&offset=2", as: TeamAdmin }
          assert:
            - "Unfiltered: total_count == 3, has_more == false, default limit 10 applied"
            - "source_id filter: total_count == 2 and every item's source_id == ${p}"
            - "limit=2: 2 items with has_more == true; limit=2&offset=2: exactly 1 item with has_more == false"

      - name: route_without_active_policy_rejected_and_intake_pools
        claim_type: conditional_action
        grounds: ["errors[ERR_NO_ACTIVE_POLICY]", state_machines.Lead.NEW_to_OFFERED]
        distinguishing_aspect: "Routing requires an ACTIVE policy: manual route of a pooled lead fails with ERR_NO_ACTIVE_POLICY while the policy is DRAFT, and intake auto-route silently pools instead; after activation both work."
        test_recipe:
          setup: ["Team; auto_route true source; ACTIVE agent A; policy P created but left DRAFT; lead L taken in (stays NEW because no ACTIVE policy)"]
          setup_api_calls:
            - { call: "POST /crm/teams", payload: { name: "Alpha", market: "Austin", timezone: "America/Chicago" }, as: TeamAdmin, captures: { t: $.data.id, t_v: $.data.version } }
            - { call: "POST /crm/routing-policies", payload: { team_id: "${t}", mode: "ROUND_ROBIN" }, as: TeamAdmin, captures: { pol: $.data.id } }
            - { call: "POST /crm/lead-sources", payload: { team_id: "${t}", name: "Zillow", type: "PORTAL", cost_per_lead_cents: 0, monthly_budget_cents: 1000000 }, as: TeamAdmin, captures: { src: $.data.id } }
            - { call: "POST /crm/agents", payload: { team_id: "${t}", display_name: "Agent A", license_number: "LIC-A", max_active_leads: 5 }, as: TeamAdmin, captures: { a: $.data.id } }
            - { call: "POST /crm/agents/${a}/activate", payload: {}, as: TeamAdmin }
            - { call: "POST /crm/leads", payload: { team_id: "${t}", source_id: "${src}", contact_name: "Pooled", contact_phone: "+15125550133", contact_email: "p@x.com", expected_close_price_cents: 30000000 }, as: TeamAdmin, captures: { lead: $.data.id, st: $.data.status } }
          trigger:
            - { call: "POST /crm/leads/${lead}/route", payload: {}, as: TeamAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /crm/routing-policies/${pol}/activate", payload: { expected_team_version: "${t_v}" }, as: TeamAdmin }
            - { call: "POST /crm/leads/${lead}/route", payload: {}, as: TeamAdmin, captures: { asg_agent: $.data.agent_id } }
          assert:
            - "st == NEW at intake despite auto_route true (no ACTIVE policy -> silent pool, not an error)"
            - "err == ERR_NO_ACTIVE_POLICY for the manual route while the policy is DRAFT"
            - "After activation the same route succeeds: asg_agent == ${a}"

      - name: response_envelope_success_and_error_shapes
        claim_type: response_envelope
        grounds: [response_envelope]
        distinguishing_aspect: "Both envelope shapes are pinned: success carries meta.api_request_id + response_type object; errors carry response_type error with data.error_id."
        test_recipe:
          setup: ["Team exists"]
          setup_api_calls:
            - { call: "POST /crm/teams", payload: { name: "Alpha", market: "Austin", timezone: "America/Chicago" }, as: TeamAdmin, captures: { t: $.data.id } }
          trigger:
            - { call: "GET /crm/teams/${t}", as: TeamAdmin }
            - { call: "GET /crm/leads/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: TeamAdmin, captures: { err: $.data.error_id } }
          assert:
            - "Success response: meta.api_request_id present and response_type == object"
            - "Error response: response_type == error and err == ERR_NOT_FOUND"

  - section: errors
    instances:
      - name: double_exit_enrollment_returns_enrollment_not_active
        claim_type: violation_to_error
        grounds: ["errors[ERR_ENROLLMENT_NOT_ACTIVE]", state_machines.NurtureEnrollment]
        distinguishing_aspect: "Terminal lockdown on enrollment: exiting an already-EXITED enrollment fails with ERR_ENROLLMENT_NOT_ACTIVE."
        test_recipe:
          setup: ["Team with ACTIVE policy; auto_route source; ACTIVE agent C; LEADER L; ACTIVE COLD campaign; lead claimed and enrolled, then exited once"]
          setup_api_calls:
            - { call: "POST /crm/teams", payload: { name: "Alpha", market: "Austin", timezone: "America/Chicago" }, as: TeamAdmin, captures: { t: $.data.id, t_v: $.data.version } }
            - { call: "POST /crm/routing-policies", payload: { team_id: "${t}", mode: "ROUND_ROBIN" }, as: TeamAdmin, captures: { pol: $.data.id } }
            - { call: "POST /crm/routing-policies/${pol}/activate", payload: { expected_team_version: "${t_v}" }, as: TeamAdmin }
            - { call: "POST /crm/lead-sources", payload: { team_id: "${t}", name: "Zillow", type: "PORTAL", cost_per_lead_cents: 0, monthly_budget_cents: 1000000 }, as: TeamAdmin, captures: { src: $.data.id } }
            - { call: "POST /crm/agents", payload: { team_id: "${t}", display_name: "Agent C", license_number: "LIC-C", max_active_leads: 5 }, as: TeamAdmin, captures: { c: $.data.id } }
