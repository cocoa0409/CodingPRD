      - name: the_project_read_is_a_pure_computed_projection_of_its_children
        claim_type: computed_read
        grounds:
          - endpoints.GET_/exhibit-projects/{id}
          - calculations.project_readiness_posture
          - entities.ExhibitProject.fields.uncommitted_cents
        distinguishing_aspect: |
          The project row carries five counters, one classified posture and five money
          buckets, none of which is client-writable and all of which must be
          reproducible from the children at read time. The probe reads the same
          project three times around a single child mutation and pins two things at
          once: reads never bump the version, and the ONE mutation that changes a
          counter changes the posture and the version together. The five-bucket
          identity is checked on both sides, so a read path that recomputes one
          bucket but not uncommitted_cents is caught immediately.
        test_recipe:
          setup:
            - "project in DESIGN_DEV with both stage packages APPROVED, one zone, one artifact and case C-01 APPROVED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
