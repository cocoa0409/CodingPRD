# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or malformed X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource id does not exist" }
  - { id: ERR_CROSS_FAMILY_ACCESS, http: 403, condition: "Parent attempts to access a resource outside their family" }
  - { id: ERR_CROSS_DISTRICT_ACCESS, http: 403, condition: "SchoolAdmin attempts to access a child without an ACTIVE DistrictLink to their district" }
  - { id: ERR_SEVERITY_VISIBILITY_DENIED, http: 403, condition: "SchoolAdmin attempts to view an alert with severity LOW or MODERATE" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum value, out-of-range value, or future-dated occurred_at/detected_at" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match current version on an OCC-guarded write" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Transition not permitted from the resource's current state" }
  - { id: ERR_ALREADY_TERMINAL, http: 409, condition: "Resource is in a terminal state; no further transitions" }
  - { id: ERR_FAMILY_SUSPENDED, http: 409, condition: "Family account is SUSPENDED; pairing, consent, and ingest blocked" }
  - { id: ERR_CHILD_ARCHIVED, http: 409, condition: "Child profile is ARCHIVED; child-scoped writes blocked" }
  - { id: ERR_DEVICE_NOT_PAIRED, http: 409, condition: "Device is UNPAIRED; windows, grants, and bypass reporting blocked" }
  - { id: ERR_DEVICE_LIMIT_EXCEEDED, http: 409, condition: "Pairing would meet or exceed the tier device limit, or downgrade would leave device_count above the new limit" }
  - { id: ERR_DEVICE_LOCKED_DOWN, http: 409, condition: "Device posture is LOCKDOWN; new access grants blocked" }
  - { id: ERR_CONNECTION_NOT_ACTIVE, http: 409, condition: "ServiceConnection is not ACTIVE; content ingest blocked" }
  - { id: ERR_DUPLICATE_CONNECTION, http: 409, condition: "A non-REVOKED connection already exists for (child, service_type, external_handle)" }
  - { id: ERR_WINDOW_OVERLAP, http: 409, condition: "BLOCKED window overlaps another ACTIVE BLOCKED window on the same device and weekday (half-open intervals; adjacency allowed)" }
  - { id: ERR_GRANT_CONFLICT, http: 409, condition: "Grant window conflicts with an existing SCHEDULED/ACTIVE grant under padded closed-interval semantics (5-minute buffer each side)" }
  - { id: ERR_ESCALATION_OPEN, http: 409, condition: "SEVERE alert resolution or child archival blocked while the linked EscalationCase is not CLOSED" }
  - { id: ERR_INVALID_ESCALATION_STEP, http: 409, condition: "Escalation transition not permitted from current case state, or role not permitted for that step, or pending mandated report must be filed first" }
  - { id: ERR_LEGAL_REPORT_NOT_REQUIRED, http: 409, condition: "LEGAL_REPORTED attempted without an ACTIVE MANDATED_REPORTING DistrictLink with pending_legal_report" }
  - { id: ERR_LINK_WITHDRAW_BLOCKED, http: 409, condition: "DistrictLink withdrawal blocked while pending_legal_report is true" }
  - { id: ERR_DISTRICT_SUSPENDED, http: 409, condition: "District is SUSPENDED; link creation or consent blocked" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Bark platform operator; manages families, districts, and the raw monitoring surface"
    identity: opaque
    exclusive_operations:
      - "POST /api/_clock/set_current_utc"
      - "POST /api/families"
      - "POST /api/families/{id}/state"
      - "POST /api/districts"
      - "GET /api/connections/{id}/content-items"
      - "GET /api/content-items/{id}"
    shared_operations:
      - "GET reads on families, children, devices, connections, alerts, escalation cases, districts, district links"
      - "POST /api/families/{id}/subscription/changes"
      - "POST /api/escalation-cases/{id}/state (LEGAL_REPORTED, CLOSED steps)"
  - name: Parent
    description: "Parent/guardian managing their own family's children, devices, connections, alerts, and escalations"
    identity: "entity_backed:ParentMember"
    exclusive_operations:
      - "POST /api/children"
      - "PATCH /api/children/{id}"
      - "POST /api/children/{id}/devices/pair"
      - "POST /api/children/{id}/connections and filter-rules"
      - "POST /api/connections/{id}/state"
      - "POST /api/alerts/{id}/state"
      - "POST /api/devices/{id}/unpair, screen-time-windows, access-grants"
      - "POST /api/screen-time-windows/{id}/state"
      - "POST /api/district-links/{id}/state"
    shared_operations:
      - "GET reads scoped to own family (alerts, escalation cases, children, devices, links)"
      - "POST /api/escalation-cases/{id}/state (RESOURCE_REFERRED, CRISIS_ESCALATED, CLOSED steps)"
  - name: SchoolAdmin
    description: "School district administrator; visibility into district-linked children and legal reporting duties"
    identity: "entity_backed:District"
    exclusive_operations:
      - "POST /api/districts/{id}/links"
    shared_operations:
      - "GET reads on district-linked children, HIGH/SEVERE alerts, escalation cases, districts, links"
      - "POST /api/escalation-cases/{id}/state (LEGAL_REPORTED, CLOSED steps)"
  - name: DeviceAgent
    description: "On-device monitoring client; reports content items and bypass events for its own device"
    identity: "entity_backed:Device"
    exclusive_operations:
      - "POST /api/content-items"
      - "POST /api/devices/{id}/bypass-events"
    shared_operations: []
