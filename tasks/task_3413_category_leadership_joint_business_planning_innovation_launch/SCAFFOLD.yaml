scenario: |
  Category Leadership, Joint Business Planning & Innovation Launch (Procter & Gamble): retailer joint business planning with shared growth targets, promotional calendars and supply commitments, category advisory roles where the manufacturer analyzes total category performance including competitors with data governance boundaries, shelf assortment and space recommendations submitted to the retailer with implementation tracking, innovation launch planning with capacity, distribution build and trade spending phased across a launch year, trade promotion funding split between everyday price support and event-based features with deduction handling, supply chain collaboration on order forecasting, truckload efficiency and inventory targets, price pack architecture decisions across channels with channel conflict management, post-launch performance review and delisting risk

domain_name: "category-leadership-jbp"
api_prefix: "/jbp"

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# Constants — the single source of truth for every numeric threshold, cap,
# ratio, window length, and tolerance referenced anywhere in this scaffold.
# =============================================================================
constants:
  DEFAULT_CLOCK_START_ISO: "2026-09-01T00:00:00Z"   # logical clock default before any set_current_utc call
  MAX_NEGOTIATION_ROUNDS: 6                          # negotiate rejected (and plan auto-EXPIRED) when negotiation_round == this
  GROWTH_TARGET_MIN_PCT: -20                         # growth_target_pct lower bound (inclusive)
  GROWTH_TARGET_MAX_PCT: 50                          # growth_target_pct upper bound (inclusive)
  FISCAL_YEAR_MIN: 2026
  FISCAL_YEAR_MAX: 2030
  FUND_ACCRUAL_RATE_MAX_PCT: 5                       # accrual_rate_pct must be in (0, 5]
  EVENT_SPLIT_MIN_PCT: 20                            # event bucket share must be >= 20% at activation
  CASH_COLLECTION_FACTOR: 0.92                       # cash-basis variant haircut vs accrual-basis share
  PROMO_DISCOUNT_DEPTH_MAX_PCT: 40                   # discount_depth_pct must be in (0, 40]
  SHELF_SPACE_CHANGE_MAX_PCT: 30                     # |space_change_pct| <= 30
  SHELF_TARGET_STORE_COUNT_MAX: 10000                # target_store_count in [1, 10000]
  IMPLEMENTATION_SLA_DAYS: 90                        # shelf-rec verify deadline counted from accepted_at
  CHANNEL_PRICE_GAP_MAX_PCT: 15                      # approve rejected when pairwise ppu gap_pct > 15 (exactly 15 passes)
  ECOMMERCE_UNDERCUT_MAX_PCT: 10                     # ECOMMERCE ppu must be >= ceil(min_other_ppu * 0.9)
  CLUB_PACK_MIN_UNITS: 12                            # CLUB channel packs need unit_count >= 12
  LAUNCH_MIN_GAP_DAYS: 84                            # min separation between launch_date of PLANNING/LAUNCHED launches of one plan (>= 84 passes)
  REVIEW_MIN_DAYS_AFTER_LAUNCH: 84                   # review create allowed when clock >= launch_date + 84 days (exactly 84 passes)
  PHASE_COUNT: 4                                     # launch auto-creates exactly 4 phases
  DISTRIBUTION_SUM_MAX_PCT: 100                      # sum of phase distribution_target_pct <= 100
  RISK_WEIGHT_SALES: 0.40
  RISK_WEIGHT_DISTRIBUTION: 0.30
  RISK_WEIGHT_FORECAST: 0.20
  RISK_WEIGHT_FRICTION: 0.10
  FORECAST_BIAS_CAP_PCT: 25                          # bias input to risk is min(bias_pct, 25)
  FORECAST_BIAS_NORMALIZER: 4                        # bias component = min(bias,25) * 4  (scales 0..25 -> 0..100)
  FRICTION_COUNT_CAP: 5                              # friction input is min(friction_count, 5)
  FRICTION_UNIT_SCORE: 20                            # friction component = min(count,5) * 20 (scales 0..5 -> 0..100)
  RISK_WATCH_MIN_SCORE: 25                           # score >= 25 -> WATCH
  RISK_AT_RISK_MIN_SCORE: 50                         # score >= 50 -> AT_RISK
  RISK_DELIST_MIN_SCORE: 75                          # score >= 75 -> DELIST_RECOMMENDED
  PHASE_WEIGHT_GATE_PASSED: 1.0
  PHASE_WEIGHT_PENDING: 0.25
  PHASE_WEIGHT_GATE_FAILED: 0.0

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Retailer
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Retailer display name"
      - name: country_code
        type: string
        source: input
        description: "ISO 3166-1 alpha-2 country code"
      - name: channels
        type: array
        source: input
        description: "Non-empty duplicate-free array of channel enum members {MASS, GROCERY, CLUB, ECOMMERCE, CONVENIENCE} the retailer operates"
      - name: status
        type: enum
        source: input
        description: "Retailer lifecycle status; enum {ACTIVE, SUSPENDED}; settable only at creation"
        default: ACTIVE
        constraints: "enum {ACTIVE, SUSPENDED}"

  - name: Category
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Category display name, e.g. 'Laundry Care'"
      - name: advisory_scope
        type: enum
        source: input
        description: "Data-governance scope for category advisory work; enum {FULL_CATEGORY, MANUFACTURER_ONLY}; FULL_CATEGORY permits competitor data in analyses"
        default: FULL_CATEGORY
        constraints: "enum {FULL_CATEGORY, MANUFACTURER_ONLY}"

  - name: JointBusinessPlan
    parent: null
    common_fields: true
    fields:
      - name: retailer_id
        type: string
        source: input
        description: "FK -> Retailer.id; the retailer party of this plan"
      - name: category_id
        type: string
        source: input
        description: "FK -> Category.id; the category this plan covers"
      - name: fiscal_year
        type: integer
        source: input
        description: "Plan fiscal year"
        constraints: "integer in [FISCAL_YEAR_MIN, FISCAL_YEAR_MAX]"
      - name: growth_target_pct
        type: number
        source: input
        description: "Currently proposed joint growth target in percent; mutated only by negotiate"
        constraints: "in [GROWTH_TARGET_MIN_PCT, GROWTH_TARGET_MAX_PCT]"
      - name: weekly_baseline_cases
        type: integer
        source: input
        description: "Manufacturer statistical weekly baseline in cases; fallback baseline for event cost estimates"
        constraints: "> 0"
      - name: avg_unit_net_price_cents
        type: integer
        source: input
        description: "Average net price per case in cents used by event cost estimates"
        constraints: "> 0"
      - name: status
        type: enum
        source: system
        description: "Negotiation lifecycle; enum {PROPOSED, COUNTERED, ACCEPTED, ACTIVATED, REJECTED, EXPIRED}"
        default: PROPOSED
        constraints: "enum {PROPOSED, COUNTERED, ACCEPTED, ACTIVATED, REJECTED, EXPIRED}"
      - name: negotiation_round
        type: integer
        source: system
        description: "Current negotiation round; starts at 1 on create, increments by 1 on every successful negotiate"
        default: 1
      - name: committed_growth_pct
        type: number
        source: system
        description: "Growth target snapshot locked at activation; null until ACTIVATED"
        default: null
      - name: activated_at
        type: datetime
        source: system
        description: "Logical-clock timestamp of activation; null until ACTIVATED"
        default: null

  - name: PromotionalEvent
    parent: null
    common_fields: true
    fields:
      - name: plan_id
        type: string
        source: input
        description: "FK -> JointBusinessPlan.id; owning plan (supplied via path)"
      - name: name
        type: string
        source: input
        description: "Event display name"
      - name: event_type
        type: enum
        source: input
        description: "Promotion mechanic; enum {FEATURE, DISPLAY, PRICE_REDUCTION, IN_STORE_DEMO}"
        constraints: "enum {FEATURE, DISPLAY, PRICE_REDUCTION, IN_STORE_DEMO}"
      - name: start_date
        type: datetime
        source: input
        description: "Event start date at 00:00:00Z; occupies the half-open interval [start_date, end_date)"
      - name: end_date
        type: datetime
        source: input
        description: "Event end date at 00:00:00Z, exclusive; must be strictly after start_date"
      - name: discount_depth_pct
        type: number
        source: input
        description: "Event discount depth in percent"
        constraints: "in (0, PROMO_DISCOUNT_DEPTH_MAX_PCT]"
      - name: status
        type: enum
        source: system
        description: "Event lifecycle; enum {PENCILED, LOCKED, CANCELLED}"
        default: PENCILED
        constraints: "enum {PENCILED, LOCKED, CANCELLED}"
      - name: estimated_cost_cents
        type: integer
        source: computed
        description: "Funding estimate computed at lock time by calculation event_cost_estimate; null while PENCILED"
        default: null

  - name: CategoryAnalysis
    parent: null
    common_fields: true
    fields:
      - name: plan_id
        type: string
        source: input
        description: "FK -> JointBusinessPlan.id; plan this advisory analysis supports (supplied via path)"
      - name: title
        type: string
        source: input
        description: "Analysis title"
      - name: period_label
        type: string
        source: input
        description: "Free-form analysis period label, e.g. '2027-H1'"
      - name: includes_competitor_data
        type: boolean
        source: input
        description: "Whether the analysis incorporates competitor (non-manufacturer) category data; gated by Category.advisory_scope"
        default: false
      - name: total_category_growth_pct
        type: number
        source: input
        description: "Analyst-reported total category growth in percent, including competitors when permitted"
      - name: manufacturer_share_pct
        type: number
        source: input
        description: "Manufacturer share of category sales in percent"
        constraints: "in [0, 100]"
      - name: competitor_share_pct
        type: number
        source: computed
        description: "Competitor share of category sales = 100 - manufacturer_share_pct"
      - name: status
        type: enum
        source: system
        description: "Advisory workflow state; enum {SUBMITTED, ACCEPTED, RETURNED}"
        default: SUBMITTED
        constraints: "enum {SUBMITTED, ACCEPTED, RETURNED}"

  - name: ShelfRecommendation
    parent: null
    common_fields: true
    fields:
      - name: plan_id
        type: string
        source: input
        description: "FK -> JointBusinessPlan.id; owning plan (supplied via path)"
      - name: title
        type: string
        source: input
        description: "Recommendation title"
      - name: space_change_pct
        type: number
        source: input
        description: "Recommended total shelf-space change for the manufacturer portfolio in percent"
        constraints: "absolute value <= SHELF_SPACE_CHANGE_MAX_PCT"
      - name: target_store_count
        type: integer
        source: input
        description: "Number of stores the recommendation must be implemented in to verify"
        constraints: "integer in [1, SHELF_TARGET_STORE_COUNT_MAX]"
      - name: sku_adds
        type: array
        source: input
        description: "Array of SKU code strings to add to the assortment; may be empty; must not intersect sku_drops"
        default: []
      - name: sku_drops
        type: array
        source: input
        description: "Array of SKU code strings to drop from the assortment; may be empty; must not intersect sku_adds"
        default: []
      - name: status
        type: enum
        source: system
        description: "Implementation tracking lifecycle; enum {PROPOSED, IMPLEMENTING, REJECTED, VERIFIED, STALLED, WITHDRAWN}"
        default: PROPOSED
        constraints: "enum {PROPOSED, IMPLEMENTING, REJECTED, VERIFIED, STALLED, WITHDRAWN}"
      - name: accepted_at
        type: datetime
        source: system
        description: "Logical-clock timestamp when the retailer accepted (entry to IMPLEMENTING); null until accepted"
        default: null
      - name: verified_store_count
        type: integer
        source: system
        description: "Store count recorded at successful verification; null until VERIFIED"
        default: null

  - name: InnovationLaunch
    parent: null
    common_fields: true
    fields:
      - name: plan_id
        type: string
        source: input
        description: "FK -> JointBusinessPlan.id; owning plan (supplied via path)"
      - name: product_name
        type: string
        source: input
        description: "Launch product name"
      - name: pack_family
        type: string
        source: input
        description: "Pack-family key linking this launch to PricePackDecision.pack_family for delist cascade"
      - name: launch_date
        type: datetime
        source: input
        description: "Planned launch date at 00:00:00Z; its UTC calendar year must equal plan.fiscal_year"
      - name: total_trade_budget_cents
        type: integer
        source: input
        description: "Total launch-year trade spending budget in cents, allocated across phases"
        constraints: "> 0"
      - name: status
        type: enum
        source: system
        description: "Launch lifecycle; enum {PLANNING, LAUNCHED, REVIEWED, DELISTED}"
        default: PLANNING
        constraints: "enum {PLANNING, LAUNCHED, REVIEWED, DELISTED}"
      - name: budget_remaining_cents
        type: integer
        source: computed
        description: "total_trade_budget_cents minus the sum of trade_spend_cents over all its LaunchPhase children; recomputed on every phase patch"
      - name: projected_distribution_weighted_pct
        type: number
        source: computed
        description: "WEIGHTED_PIPELINE variant of calculation distribution_projection, refreshed on every phase mutation"
      - name: projected_distribution_committed_pct
        type: number
        source: computed
        description: "COMMITTED_ONLY variant of calculation distribution_projection, refreshed on every phase mutation"
      - name: launched_at
        type: datetime
        source: system
        description: "Logical-clock timestamp of the PLANNING -> LAUNCHED transition; null until LAUNCHED"
        default: null

  - name: LaunchPhase
    parent: null
    common_fields: true
    fields:
      - name: launch_id
        type: string
        source: input
        description: "FK -> InnovationLaunch.id; owning launch (supplied via path)"
      - name: phase_index
        type: integer
        source: system
        description: "Quarter index 1..PHASE_COUNT assigned at auto-creation"
      - name: phase_type
        type: enum
        source: system
        description: "Phase role by index: 1=CAPACITY_BUILD, 2=DISTRIBUTION_BUILD, 3=TRADE_SPEND, 4=SUSTAIN"
        constraints: "enum {CAPACITY_BUILD, DISTRIBUTION_BUILD, TRADE_SPEND, SUSTAIN}"
      - name: distribution_target_pct
        type: number
        source: input
        description: "Incremental ACV distribution this phase builds, in percent"
        default: 0
        constraints: "in [0, 100]; sum over all phases of the launch <= DISTRIBUTION_SUM_MAX_PCT"
      - name: capacity_cases
        type: integer
        source: input
        description: "Reserved production capacity in cases for this phase"
        default: 0
        constraints: ">= 0"
      - name: trade_spend_cents
        type: integer
        source: input
        description: "Trade spending allocated to this phase in cents"
        default: 0
        constraints: ">= 0; must fit within launch.budget_remaining_cents at write time"
      - name: status
        type: enum
        source: system
        description: "Gate lifecycle; enum {PENDING, GATE_PASSED, GATE_FAILED}"
        default: PENDING
        constraints: "enum {PENDING, GATE_PASSED, GATE_FAILED}"

  - name: TradeFund
    parent: null
    common_fields: true
    fields:
      - name: plan_id
        type: string
        source: system
        description: "FK -> JointBusinessPlan.id; owning plan; exactly one fund per plan, created at activation"
      - name: accrual_rate_pct
        type: number
        source: system
        description: "Percent of invoiced sales accruing to the fund, locked from the activation payload"
      - name: edlp_split_pct
        type: integer
        source: system
        description: "Percent of each period credit routed to the EDLP bucket; event bucket receives the remainder, locked from the activation payload"
      - name: edlp_accrued_cents
        type: integer
        source: computed
        description: "Accrual-basis EDLP credits summed over posted periods (calculation fund_period_accrual)"
        default: 0
      - name: event_accrued_cents
        type: integer
        source: computed
        description: "Accrual-basis EVENT credits summed over posted periods"
        default: 0
      - name: edlp_cash_cents
        type: integer
        source: computed
        description: "Cash-basis EDLP credits summed over posted periods (CASH_BASIS variant)"
        default: 0
      - name: event_cash_cents
        type: integer
        source: computed
        description: "Cash-basis EVENT credits summed over posted periods (CASH_BASIS variant)"
        default: 0
      - name: event_reserved_cents
        type: integer
        source: computed
        description: "Sum of estimated_cost_cents over LOCKED promotional events of the plan; incremented at lock, released at cancel"
        default: 0
      - name: edlp_settled_cents
        type: integer
        source: computed
        description: "Sum of settled_amount_cents over SETTLED EDLP deductions plus absorbed amounts of WRITTEN_OFF EDLP deductions"
        default: 0
      - name: event_settled_cents
        type: integer
        source: computed
        description: "Sum of settled_amount_cents over SETTLED EVENT deductions plus absorbed amounts of WRITTEN_OFF EVENT deductions"
        default: 0
      - name: total_invoiced_cents
        type: integer
        source: computed
        description: "Sum of invoiced_sales_cents over all posted accrual periods"
        default: 0
      - name: edlp_available_cents
        type: integer
        source: computed
        description: "edlp_accrued_cents - edlp_settled_cents"
      - name: event_available_cents
        type: integer
        source: computed
        description: "event_accrued_cents - event_reserved_cents - event_settled_cents"

  - name: Deduction
    parent: null
    common_fields: true
    fields:
      - name: fund_id
        type: string
        source: input
        description: "FK -> TradeFund.id; fund this claim is filed against (supplied via path)"
      - name: claim_reference
        type: string
        source: input
        description: "Retailer-side claim number; unique within the fund"
      - name: bucket
        type: enum
        source: input
        description: "Fund bucket the claim draws from; enum {EDLP, EVENT}"
        constraints: "enum {EDLP, EVENT}"
      - name: amount_cents
        type: integer
        source: input
        description: "Claimed amount in cents"
        constraints: "> 0"
      - name: status
        type: enum
        source: system
        description: "Deduction lifecycle; enum {RECEIVED, DISPUTED, SETTLED, REJECTED, WRITTEN_OFF}"
        default: RECEIVED
        constraints: "enum {RECEIVED, DISPUTED, SETTLED, REJECTED, WRITTEN_OFF}"
      - name: settled_amount_cents
        type: integer
        source: system
        description: "Amount actually paid or absorbed at SETTLED / WRITTEN_OFF = min(amount_cents, bucket available at resolution); null before"
        default: null
      - name: short_paid
        type: boolean
        source: system
        description: "True when settled_amount_cents < amount_cents at SETTLED or WRITTEN_OFF"
        default: false
      - name: absorbed_by_manufacturer
        type: boolean
        source: system
        description: "True only on WRITTEN_OFF (manufacturer absorbs the cost without matching activity)"
        default: false

  - name: Forecast
    parent: null
    common_fields: true
    fields:
      - name: plan_id
        type: string
        source: input
        description: "FK -> JointBusinessPlan.id; owning plan (supplied via path)"
      - name: week_start
        type: datetime
        source: input
        description: "Week bucket start; must be a Monday at 00:00:00Z; occupies [week_start, week_start + 7 days)"
      - name: baseline_cases
        type: integer
        source: input
        description: "Manufacturer statistical baseline demand for the week in cases"
        constraints: "> 0"
      - name: pub_status
        type: enum
        source: system
        description: "Publication dimension (parallel state axis 1); enum {PUBLISHED, SUPERSEDED}"
        default: PUBLISHED
        constraints: "enum {PUBLISHED, SUPERSEDED}"
      - name: commit_status
        type: enum
        source: system
        description: "Commitment dimension (parallel state axis 2); enum {UNCOMMITTED, COMMITTED}"
        default: UNCOMMITTED
        constraints: "enum {UNCOMMITTED, COMMITTED}"
      - name: committed_cases
        type: integer
        source: system
        description: "Retailer-committed volume in cases; set by commit; null while UNCOMMITTED"
        default: null
      - name: committed_at
        type: datetime
        source: system
        description: "Logical-clock timestamp of commit; null while UNCOMMITTED"
        default: null

  - name: PricePackDecision
    parent: null
    common_fields: true
    fields:
      - name: plan_id
        type: string
        source: input
        description: "FK -> JointBusinessPlan.id; owning plan (supplied via path)"
      - name: channel
        type: enum
        source: input
        description: "Target channel; enum {MASS, GROCERY, CLUB, ECOMMERCE, CONVENIENCE}; must be a member of the plan retailer's channels"
        constraints: "enum {MASS, GROCERY, CLUB, ECOMMERCE, CONVENIENCE}"
      - name: pack_family
        type: string
        source: input
        description: "Pack-family key shared with InnovationLaunch.pack_family"
      - name: pack_code
        type: string
        source: input
        description: "Unique pack code within the plan"
      - name: unit_count
        type: integer
        source: input
        description: "Selling units per pack"
        constraints: ">= 1; if channel == CLUB then >= CLUB_PACK_MIN_UNITS"
      - name: list_price_cents
        type: integer
        source: input
        description: "Pack list price in cents"
        constraints: "> 0"
      - name: price_per_unit_cents
        type: integer
        source: computed
        description: "ceil(list_price_cents / unit_count) — round UP to the next integer cent"
      - name: status
        type: enum
        source: system
        description: "Decision lifecycle; enum {PROPOSED, APPROVED, REJECTED, RETIRED}"
        default: PROPOSED
        constraints: "enum {PROPOSED, APPROVED, REJECTED, RETIRED}"

  - name: PerformanceReview
    parent: null
    common_fields: true
    fields:
      - name: launch_id
        type: string
        source: input
        description: "FK -> InnovationLaunch.id; the launch under post-launch review (supplied via path); at most one review per launch"
      - name: period_start
        type: datetime
        source: input
        description: "Review window start, inclusive"
      - name: period_end
        type: datetime
        source: input
        description: "Review window end, inclusive; must be strictly after period_start"
      - name: actual_sales_cents
        type: integer
        source: input
        description: "Retailer-reported actual launch sales in the window"
        constraints: ">= 0"
      - name: sales_target_cents
        type: integer
        source: input
        description: "Joint sales target for the launch in the window"
        constraints: "> 0"
      - name: target_distribution_pct
        type: number
        source: input
        description: "Joint ACV distribution target in percent"
        constraints: "in [0, 100]"
      - name: distribution_achieved_pct
        type: number
        source: input
        description: "Achieved ACV distribution in percent"
        constraints: "in [0, 100]"
      - name: sales_attainment_pct
        type: number
        source: computed
        description: "round_half_up(actual_sales_cents / sales_target_cents * 100, 2)"
      - name: forecast_bias_pct
        type: number
        source: computed
        description: "Calculation forecast_bias over the review window; 0 when no qualifying forecasts"
      - name: friction_count
        type: integer
        source: computed
        description: "Count of the plan fund's Deductions created within [period_start, period_end] whose status is in {DISPUTED, WRITTEN_OFF} or that are SETTLED with short_paid == true"
      - name: risk_score
        type: integer
        source: computed
        description: "Calculation delisting_risk_score; integer 0..100"
      - name: risk_posture
        type: enum
        source: computed
        description: "Derived from risk_score: >= RISK_DELIST_MIN_SCORE -> DELIST_RECOMMENDED; >= RISK_AT_RISK_MIN_SCORE -> AT_RISK; >= RISK_WATCH_MIN_SCORE -> WATCH; else HEALTHY"
        constraints: "enum {HEALTHY, WATCH, AT_RISK, DELIST_RECOMMENDED}"
      - name: status
        type: enum
        source: system
        description: "Review lifecycle; enum {OPEN, FINALIZED}"
        default: OPEN
        constraints: "enum {OPEN, FINALIZED}"
      - name: decision
        type: enum
        source: system
        description: "Retailer post-review decision; enum {CONTINUE, DELIST}; null until FINALIZED"
        default: null
        constraints: "enum {CONTINUE, DELIST}"

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: JointBusinessPlan
    initial_state: PROPOSED
    terminal_states: [REJECTED, EXPIRED]
    transitions:
      - from: PROPOSED
        to: COUNTERED
        trigger: "POST /jbp/plans/{id}/negotiate"
        actor: RetailerBuyer
        preconditions:
          - "acting RetailerBuyer's X-User-ID == plan.retailer_id"
          - "plan.negotiation_round < MAX_NEGOTIATION_ROUNDS"
          - "payload growth_target_pct within [GROWTH_TARGET_MIN_PCT, GROWTH_TARGET_MAX_PCT]"
        side_effects:
          - "growth_target_pct := payload value"
          - "negotiation_round += 1"
          - "increments JointBusinessPlan.version by 1"
        note: "Retailer counters the manufacturer's proposal. When negotiation_round == MAX_NEGOTIATION_ROUNDS the call is rejected with ERR_NEGOTIATION_ROUNDS_EXHAUSTED AND the plan still transitions to EXPIRED."
      - from: COUNTERED
        to: PROPOSED
        trigger: "POST /jbp/plans/{id}/negotiate"
        actor: ManufacturerPlanner
        preconditions:
          - "plan.negotiation_round < MAX_NEGOTIATION_ROUNDS"
          - "payload growth_target_pct within [GROWTH_TARGET_MIN_PCT, GROWTH_TARGET_MAX_PCT]"
        side_effects:
          - "growth_target_pct := payload value"
          - "negotiation_round += 1"
          - "increments JointBusinessPlan.version by 1"
        note: "Manufacturer re-proposes after a counter. Same round-exhaustion rejection + auto-EXPIRE rule as the counter leg."
      - from: PROPOSED
        to: ACCEPTED
        trigger: "POST /jbp/plans/{id}/decide {decision: ACCEPT}"
        actor: RetailerBuyer
        preconditions:
          - "acting RetailerBuyer's X-User-ID == plan.retailer_id"
        side_effects:
          - "increments JointBusinessPlan.version by 1"
        note: "Only the retailer may accept a live manufacturer proposal; a ManufacturerPlanner decide from PROPOSED fails ERR_NOT_YOUR_MOVE."
      - from: COUNTERED
        to: ACCEPTED
        trigger: "POST /jbp/plans/{id}/decide {decision: ACCEPT}"
        actor: ManufacturerPlanner
        preconditions: []
        side_effects:
          - "increments JointBusinessPlan.version by 1"
        note: "Only the manufacturer may accept a live retailer counter; a RetailerBuyer decide from COUNTERED fails ERR_NOT_YOUR_MOVE."
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /jbp/plans/{id}/decide {decision: REJECT}"
        actor: RetailerBuyer
        preconditions:
          - "acting RetailerBuyer's X-User-ID == plan.retailer_id"
        side_effects:
          - "increments JointBusinessPlan.version by 1"
      - from: COUNTERED
        to: REJECTED
        trigger: "POST /jbp/plans/{id}/decide {decision: REJECT}"
        actor: ManufacturerPlanner
        preconditions: []
        side_effects:
          - "increments JointBusinessPlan.version by 1"
      - from: ACCEPTED
        to: ACTIVATED
        trigger: "POST /jbp/plans/{id}/activate"
        actor: ManufacturerPlanner
        preconditions:
          - "plan.retailer_id's Retailer.status == ACTIVE"
          - "accrual_rate_pct in (0, FUND_ACCRUAL_RATE_MAX_PCT]"
          - "edlp_split_pct in [0, 100 - EVENT_SPLIT_MIN_PCT] (event share must be >= EVENT_SPLIT_MIN_PCT)"
        side_effects:
          - "create TradeFund with plan_id := plan.id, accrual_rate_pct and edlp_split_pct from payload, all computed balances 0"
          - "committed_growth_pct := growth_target_pct"
          - "activated_at := current logical clock"
          - "increments JointBusinessPlan.version by 1"
      - from: PROPOSED
        to: EXPIRED
        trigger: "system auto-transition when negotiate is attempted at negotiation_round == MAX_NEGOTIATION_ROUNDS"
        actor: system
        preconditions:
          - "negotiate attempt rejected with ERR_NEGOTIATION_ROUNDS_EXHAUSTED"
        side_effects:
          - "increments JointBusinessPlan.version by 1"
        note: "The exhaustion error and the EXPIRED transition happen in the same failed request."
      - from: COUNTERED
        to: EXPIRED
        trigger: "system auto-transition when negotiate is attempted at negotiation_round == MAX_NEGOTIATION_ROUNDS"
        actor: system
        preconditions:
          - "negotiate attempt rejected with ERR_NEGOTIATION_ROUNDS_EXHAUSTED"
        side_effects:
          - "increments JointBusinessPlan.version by 1"

  - entity: PromotionalEvent
    initial_state: PENCILED
    terminal_states: [CANCELLED]
    transitions:
      - from: PENCILED
        to: LOCKED
        trigger: "POST /jbp/events/{id}/lock"
        actor: ManufacturerPlanner
        preconditions:
          - "event's plan status == ACTIVATED"
          - "event_cost_estimate for this event <= plan's TradeFund.event_available_cents"
        side_effects:
          - "event.estimated_cost_cents := event_cost_estimate(event)"
          - "TradeFund.event_reserved_cents += event.estimated_cost_cents (hop 1 of reservation cascade; recomputes event_available_cents)"
          - "increments PromotionalEvent.version by 1"
      - from: PENCILED
        to: CANCELLED
        trigger: "POST /jbp/events/{id}/cancel"
        actor: ManufacturerPlanner
        preconditions: []
        side_effects:
          - "increments PromotionalEvent.version by 1"
      - from: LOCKED
        to: CANCELLED
        trigger: "POST /jbp/events/{id}/cancel"
        actor: ManufacturerPlanner
        preconditions: []
        side_effects:
          - "TradeFund.event_reserved_cents -= event.estimated_cost_cents (compensating release; recomputes event_available_cents)"
          - "increments PromotionalEvent.version by 1"
        note: "Lock followed by cancel is the compensating pair of the fund-reservation invariant."

  - entity: CategoryAnalysis
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED, RETURNED]
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /jbp/category-analyses/{id}/decide {decision: ACCEPT}"
        actor: RetailerBuyer
        preconditions:
          - "acting RetailerBuyer's X-User-ID == analysis.plan_id's retailer_id"
        side_effects:
          - "increments CategoryAnalysis.version by 1"
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /jbp/category-analyses/{id}/decide {decision: RETURN}"
        actor: RetailerBuyer
        preconditions:
          - "acting RetailerBuyer's X-User-ID == analysis.plan_id's retailer_id"
        side_effects:
          - "increments CategoryAnalysis.version by 1"
        note: "RETURNED is terminal for the record; a reworked analysis is created as a new CategoryAnalysis."

  - entity: ShelfRecommendation
    initial_state: PROPOSED
    terminal_states: [REJECTED, VERIFIED, STALLED, WITHDRAWN]
    transitions:
      - from: PROPOSED
        to: IMPLEMENTING
        trigger: "POST /jbp/shelf-recommendations/{id}/decide {decision: ACCEPT}"
        actor: RetailerBuyer
        preconditions:
          - "acting RetailerBuyer's X-User-ID == rec.plan_id's retailer_id"
        side_effects:
          - "accepted_at := current logical clock"
          - "increments ShelfRecommendation.version by 1"
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /jbp/shelf-recommendations/{id}/decide {decision: REJECT}"
        actor: RetailerBuyer
        preconditions:
          - "acting RetailerBuyer's X-User-ID == rec.plan_id's retailer_id"
        side_effects:
          - "increments ShelfRecommendation.version by 1"
      - from: PROPOSED
        to: WITHDRAWN
        trigger: "system auto-supersede when a new ShelfRecommendation is created for the same plan"
        actor: system
        preconditions:
          - "the new create passed its OCC check (concurrency_rules[shelf-rec-create-stale-plan])"
        side_effects:
          - "increments ShelfRecommendation.version by 1"
      - from: IMPLEMENTING
        to: VERIFIED
        trigger: "POST /jbp/shelf-recommendations/{id}/verify"
        actor: CategoryAdvisor
        preconditions:
          - "current logical clock - accepted_at <= IMPLEMENTATION_SLA_DAYS days"
          - "payload implemented_store_count >= rec.target_store_count"
        side_effects:
          - "verified_store_count := payload implemented_store_count"
          - "increments ShelfRecommendation.version by 1"
      - from: IMPLEMENTING
        to: STALLED
        trigger: "system auto-transition when verify is attempted after the SLA"
        actor: system
        preconditions:
          - "verify attempt with current logical clock - accepted_at > IMPLEMENTATION_SLA_DAYS days"
        side_effects:
          - "increments ShelfRecommendation.version by 1"
        note: "The ERR_IMPLEMENTATION_STALLED rejection and the STALLED transition happen in the same failed request; a verify that is within SLA but under target fails ERR_IMPLEMENTATION_INCOMPLETE with NO state change."

  - entity: InnovationLaunch
    initial_state: PLANNING
    terminal_states: [REVIEWED, DELISTED]
    transitions:
      - from: PLANNING
        to: LAUNCHED
        trigger: "POST /jbp/launches/{id}/launch"
        actor: ManufacturerPlanner
        preconditions:
          - "every LaunchPhase of this launch has status == GATE_PASSED (checked BEFORE the date check)"
          - "current logical clock >= launch_date"
        side_effects:
          - "launched_at := current logical clock"
          - "increments InnovationLaunch.version by 1"
      - from: LAUNCHED
        to: REVIEWED
        trigger: "POST /jbp/performance-reviews/{id}/finalize {decision: CONTINUE} on this launch's review"
        actor: RetailerBuyer
        preconditions:
          - "the review exists, is OPEN, and belongs to this launch"
        side_effects:
          - "increments InnovationLaunch.version by 1"
      - from: LAUNCHED
        to: DELISTED
        trigger: "POST /jbp/performance-reviews/{id}/finalize {decision: DELIST} on this launch's review"
        actor: RetailerBuyer
        preconditions:
          - "the review exists, is OPEN, and belongs to this launch"
        side_effects:
          - "hop 1 of delist cascade: every PricePackDecision of the same plan whose pack_family == launch.pack_family and status == APPROVED transitions to RETIRED"
          - "increments InnovationLaunch.version by 1"

  - entity: LaunchPhase
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: GATE_PASSED
        trigger: "POST /jbp/launches/{id}/phases/{phase_id}/evaluate"
        actor: ManufacturerPlanner
        preconditions:
          - "launch.status == PLANNING"
          - "every LaunchPhase of this launch with phase_index < this.phase_index has status == GATE_PASSED (vacuous for phase_index 1)"
          - "distribution_target_pct > 0"
          - "capacity_cases > 0"
        side_effects:
          - "recompute launch.projected_distribution_weighted_pct and launch.projected_distribution_committed_pct (calculation distribution_projection)"
          - "increments LaunchPhase.version by 1"
      - from: PENDING
        to: GATE_FAILED
        trigger: "POST /jbp/launches/{id}/phases/{phase_id}/evaluate"
        actor: ManufacturerPlanner
        preconditions:
          - "launch.status == PLANNING"
          - "any gate condition fails (prior phase not GATE_PASSED, or distribution_target_pct == 0, or capacity_cases == 0)"
        side_effects:
          - "recompute launch.projected_distribution_weighted_pct and launch.projected_distribution_committed_pct"
          - "increments LaunchPhase.version by 1"
      - from: GATE_FAILED
        to: PENDING
        trigger: "PATCH /jbp/launches/{id}/phases/{phase_id}"
        actor: ManufacturerPlanner
        preconditions:
          - "launch.status == PLANNING"
        side_effects:
          - "apply field updates; recompute launch.budget_remaining_cents and both distribution projections"
          - "increments LaunchPhase.version by 1"
        note: "The gate loop: GATE_FAILED phases are revised back to PENDING by PATCH. PENDING phases may also be PATCHed (stay PENDING)."

  - entity: Deduction
    initial_state: RECEIVED
    terminal_states: [SETTLED, REJECTED, WRITTEN_OFF]
    transitions:
      - from: RECEIVED
        to: DISPUTED
        trigger: "POST /jbp/deductions/{id}/resolve {action: DISPUTE}"
        actor: FinanceAnalyst
        preconditions: []
        side_effects:
          - "hop 1 of review-friction cascade: recompute friction_count, risk_score, risk_posture of every OPEN PerformanceReview whose launch belongs to this fund's plan (hop 2: friction_count may change; hop 3: risk_score/risk_posture recompute may flip risk_posture)"
          - "increments Deduction.version by 1"
      - from: RECEIVED
        to: SETTLED
        trigger: "POST /jbp/deductions/{id}/resolve {action: SETTLE}"
        actor: FinanceAnalyst
        preconditions: []
        side_effects:
          - "settled_amount_cents := min(amount_cents, bucket availability) where EVENT availability = fund.event_available_cents and EDLP availability = fund.edlp_available_cents"
          - "short_paid := settled_amount_cents < amount_cents"
          - "fund.<bucket>_settled_cents += settled_amount_cents (hop 1: fund balances mutate; recomputes bucket available)"
          - "hop 2: recompute friction_count of every OPEN PerformanceReview whose launch belongs to this fund's plan (short-paid settlements count)"
          - "hop 3: recompute those reviews' risk_score and risk_posture (posture may flip across RISK_* thresholds)"
          - "increments Deduction.version by 1"
      - from: DISPUTED
        to: SETTLED
        trigger: "POST /jbp/deductions/{id}/resolve {action: SETTLE}"
        actor: FinanceAnalyst
        preconditions: []
        side_effects:
          - "same settlement computation as RECEIVED -> SETTLED, including the three-hop review cascade"
          - "increments Deduction.version by 1"
      - from: DISPUTED
        to: REJECTED
        trigger: "POST /jbp/deductions/{id}/resolve {action: REJECT}"
        actor: FinanceAnalyst
        preconditions: []
        side_effects:
          - "no fund movement; hop 2-3 review cascade still runs (friction_count drops when a DISPUTED deduction leaves {DISPUTED})"
          - "increments Deduction.version by 1"
      - from: DISPUTED
        to: WRITTEN_OFF
        trigger: "POST /jbp/deductions/{id}/resolve {action: WRITE_OFF}"
        actor: FinanceAnalyst
        preconditions: []
        side_effects:
          - "settled_amount_cents := min(amount_cents, bucket availability); absorbed_by_manufacturer := true; short_paid := settled_amount_cents < amount_cents"
          - "fund.<bucket>_settled_cents += settled_amount_cents (absorbed amounts are booked into the settled ledger)"
          - "hop 2-3 review cascade runs (WRITTEN_OFF counts toward friction_count)"
          - "increments Deduction.version by 1"

  - entity: Forecast
    initial_state: PUBLISHED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "system auto-supersede when POST /jbp/plans/{id}/forecasts creates a new Forecast for the same (plan_id, week_start)"
        actor: system
        preconditions:
          - "the new Forecast's create succeeded"
        side_effects:
          - "commit_status of the superseded forecast is preserved unchanged (COMMITTED stays COMMITTED)"
          - "increments Forecast.version by 1"
        note: "Parallel state dimensions: pub_status (PUBLISHED -> SUPERSEDED) evolves independently from commit_status (UNCOMMITTED -> COMMITTED); supersession never clears a commitment."
      - from: UNCOMMITTED
        to: COMMITTED
        trigger: "POST /jbp/forecasts/{id}/commit"
        actor: RetailerBuyer
        preconditions:
          - "forecast.pub_status == PUBLISHED"
          - "forecast.commit_status == UNCOMMITTED"
          - "acting RetailerBuyer's X-User-ID == forecast.plan_id's retailer_id"
        side_effects:
          - "committed_cases := payload committed_cases (must be > 0)"
          - "committed_at := current logical clock"
          - "increments Forecast.version by 1"

  - entity: PricePackDecision
    initial_state: PROPOSED
    terminal_states: [REJECTED, RETIRED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /jbp/price-pack-decisions/{id}/decide {decision: APPROVE}"
        actor: RetailerBuyer
        preconditions:
          - "acting RetailerBuyer's X-User-ID == ppd.plan_id's retailer_id"
          - "channel-conflict checks pass (validations: pairwise gap rule, ECOMMERCE undercut rule)"
        side_effects:
          - "increments PricePackDecision.version by 1"
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /jbp/price-pack-decisions/{id}/decide {decision: REJECT}"
        actor: RetailerBuyer
        preconditions:
          - "acting RetailerBuyer's X-User-ID == ppd.plan_id's retailer_id"
        side_effects:
          - "increments PricePackDecision.version by 1"
      - from: APPROVED
        to: RETIRED
        trigger: "system cascade when a PerformanceReview of a launch with the same pack_family finalizes DELIST"
        actor: system
        preconditions:
          - "ppd.pack_family == finalized launch's pack_family and ppd belongs to the same plan"
        side_effects:
          - "increments PricePackDecision.version by 1"

  - entity: PerformanceReview
    initial_state: OPEN
    terminal_states: [FINALIZED]
    transitions:
      - from: OPEN
        to: FINALIZED
        trigger: "POST /jbp/performance-reviews/{id}/finalize"
        actor: RetailerBuyer
        preconditions:
          - "acting RetailerBuyer's X-User-ID == the review launch's plan retailer_id"
          - "payload decision in {CONTINUE, DELIST}"
        side_effects:
          - "decision := payload decision"
          - "if decision == CONTINUE: launch transitions LAUNCHED -> REVIEWED"
          - "if decision == DELIST: launch transitions LAUNCHED -> DELISTED, then hop 2 retires matching APPROVED PricePackDecisions (see InnovationLaunch LAUNCHED -> DELISTED)"
          - "increments PerformanceReview.version by 1"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: shelf-rec-create-stale-plan
    parent_entity: JointBusinessPlan
    write_endpoint: "POST /jbp/plans/{id}/shelf-recommendations"
    occ_field: "expected_plan_version"
    description: |
      Creating a ShelfRecommendation against a JointBusinessPlan whose
      version has advanced since the client last observed it is rejected
      with 412. Creating a new recommendation legitimately supersedes the
      plan's currently PROPOSED recommendation (auto-WITHDRAWN), so the
      client must create against the plan version it actually reviewed;
      a stale expected_plan_version proves the client's view is out of date.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table (constants resolve to the top-level constants: map)
# =============================================================================
calculations:
  - name: fund_period_accrual
    trigger: "POST /jbp/funds/{id}/accruals (one invocation per period)"
    algorithm: waterfall_allocation
    formula: |
      period_credit_cents = round_half_up(invoiced_sales_cents * accrual_rate_pct / 100)
      edlp_share_cents    = round_half_up(period_credit_cents * edlp_split_pct / 100)
      event_share_cents   = period_credit_cents - edlp_share_cents   # rounding remainder always routes to the EVENT bucket
      # CASH_BASIS variant (computed in the same pass, stored on separate fields):
      edlp_cash_cents     = round_half_up(edlp_share_cents * CASH_COLLECTION_FACTOR)
      event_cash_cents    = round_half_up(event_share_cents * CASH_COLLECTION_FACTOR)
      # Accumulation: add each period's shares to the running totals.
      # PINNED ROUNDING ORDER: round EACH PERIOD's credit and bucket shares to
      # integer cents BEFORE summing into the fund totals. Summing unrounded
      # period values and rounding once at the end is FORBIDDEN and produces
      # different cents.
    input_set: "the single posted period (period, invoiced_sales_cents); periods are unique per fund (ERR_DUPLICATE_ACCRUAL_PERIOD)"
    precision: "integer cents; round_half_up applied per period per bucket share before accumulation"
    variants:
      - name: ACCRUAL_BASIS
        when: "always computed; feeds edlp_accrued_cents / event_accrued_cents and both *_available_cents fields used by lock/settle funding checks"
        difference: "full computed share is credited"
      - name: CASH_BASIS
        when: "always computed alongside the accrual variant on every accrual posting; feeds edlp_cash_cents / event_cash_cents"
        difference: "each bucket share is multiplied by CASH_COLLECTION_FACTOR (0.92) and rounded, so identical inputs yield strictly smaller cash balances whenever a share is positive"

  - name: event_cost_estimate
    trigger: "POST /jbp/events/{id}/lock (result persisted on event.estimated_cost_cents)"
    algorithm: forward_looking
    formula: |
      # Selector (pinned): among the event plan's Forecasts with
      # pub_status == PUBLISHED and week_start <= event.start_date <= week_start + 6 days,
      # take the one with the LATEST week_start. No tie is possible because at
      # most one PUBLISHED forecast exists per (plan, week_start).
      # Fallback when the candidate set is empty: use plan.weekly_baseline_cases.
      baseline = selected_forecast.baseline_cases OR plan.weekly_baseline_cases
      estimated_cost_cents = round_half_up(baseline * plan.avg_unit_net_price_cents * discount_depth_pct / 100)
    input_set: "the event being locked; the plan's PUBLISHED forecasts; the plan's weekly_baseline_cases fallback"
    precision: "integer cents; single round_half_up at the end"
    variants: []

  - name: delisting_risk_score
    trigger: "PerformanceReview creation; and re-run for every OPEN review of the fund's plan whenever a Deduction of that fund changes status (dispute / settle / reject / write-off cascade)"
    algorithm: weighted_scoring
    formula: |
      sales_component    = clamp(0, 100, 100 - sales_attainment_pct)
      dist_component     = clamp(0, 100, target_distribution_pct - distribution_achieved_pct)   # negative gaps clamp to 0
      forecast_component = min(forecast_bias_pct, FORECAST_BIAS_CAP_PCT) * FORECAST_BIAS_NORMALIZER
      friction_component = min(friction_count, FRICTION_COUNT_CAP) * FRICTION_UNIT_SCORE
      raw = RISK_WEIGHT_SALES * sales_component
          + RISK_WEIGHT_DISTRIBUTION * dist_component
          + RISK_WEIGHT_FORECAST * forecast_component
          + RISK_WEIGHT_FRICTION * friction_component
      risk_score = clamp(0, 100, round_half_up(raw))      # integer 0..100
      risk_posture = DELIST_RECOMMENDED if risk_score >= RISK_DELIST_MIN_SCORE
                     else AT_RISK if risk_score >= RISK_AT_RISK_MIN_SCORE
                     else WATCH if risk_score >= RISK_WATCH_MIN_SCORE
                     else HEALTHY
    input_set: "review's own actual/target/distribution inputs; forecast_bias_pct from calculation forecast_bias; friction_count from the fund's Deductions created within [period_start, period_end] (closed) with status in {DISPUTED, WRITTEN_OFF} or (SETTLED AND short_paid == true)"
    precision: "components keep full precision; risk_score rounds once with round_half_up to integer"
    variants: []

  - name: forecast_bias
    trigger: "evaluated inside delisting_risk_score at review creation"
    algorithm: aggregation
    formula: |
      # Qualifying set: the plan's Forecasts with pub_status == PUBLISHED AND
      # commit_status == COMMITTED AND week_start within [review.period_start, review.period_end] (closed).
      # SUPERSEDED forecasts never contribute, even if COMMITTED.
      per_forecast_bias_i = abs(committed_cases - baseline_cases) / baseline_cases * 100
      forecast_bias_pct = round_half_up(mean(per_forecast_bias_i), 2)
      # Empty qualifying set -> forecast_bias_pct = 0
    input_set: "plan Forecasts filtered by pub_status == PUBLISHED, commit_status == COMMITTED, week_start in review window"
    precision: "2 decimal places, round_half_up on the mean"
    variants: []

  - name: distribution_projection
    trigger: "recomputed on InnovationLaunch whenever any child LaunchPhase is patched, evaluated, or auto-created"
    algorithm: weighted_scoring
    formula: |
      # COMMITTED_ONLY variant:
      committed_pct = sum over phases of distribution_target_pct * (1.0 if status == GATE_PASSED else 0.0)
      # WEIGHTED_PIPELINE variant:
      weighted_pct  = sum over phases of distribution_target_pct * weight(status)
      where weight(GATE_PASSED) = PHASE_WEIGHT_GATE_PASSED (1.0)
            weight(PENDING)     = PHASE_WEIGHT_PENDING     (0.25)
            weight(GATE_FAILED) = PHASE_WEIGHT_GATE_FAILED (0.0)
      # Both results are stored to 2 decimals round_half_up on the launch fields
      # projected_distribution_committed_pct / projected_distribution_weighted_pct.
      # No clamp is needed: the phase-write sum cap (DISTRIBUTION_SUM_MAX_PCT)
      # already bounds every weighting of the same targets to <= 100.
    input_set: "all LaunchPhase children of the launch regardless of status"
    precision: "2 decimal places, round_half_up"
    variants:
      - name: COMMITTED_ONLY
        when: "conservative read: only phases that actually passed their gate count"
        difference: "PENDING and GATE_FAILED phases contribute 0"
      - name: WEIGHTED_PIPELINE
        when: "planning read: pipeline phases count fractionally"
        difference: "PENDING phases contribute PHASE_WEIGHT_PENDING (0.25) of their target, so for identical phase data weighted_pct >= committed_pct with strict inequality whenever any PENDING phase has distribution_target_pct > 0"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority — lower number wins when a
# request violates several rules)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; role name is one of the six declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "acting role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "RetailerBuyer requests are scope-checked: X-User-ID must equal the retailer_id of the JointBusinessPlan that owns the target resource (via path plan_id, or via the target entity's plan/launch/fund chain)"
    error_id: ERR_RETAILER_SCOPE_MISMATCH
    http_status: 403
    applies_to: "all endpoints invoked as RetailerBuyer"
  - priority: 4
    category: business_constraint
    check: "request body shape: required fields present, no undeclared fields, types valid, enum members valid, numeric ranges and string/array constraints per §1.1 (includes pagination limit in [1,100], discount_depth_pct <= PROMO_DISCOUNT_DEPTH_MAX_PCT, |space_change_pct| <= SHELF_SPACE_CHANGE_MAX_PCT, target_store_count in [1, SHELF_TARGET_STORE_COUNT_MAX], sku_adds intersect sku_drops == empty, committed_cases > 0, sales_target_cents > 0, period_end > period_start, end_date > start_date, accrual period format YYYY-MM, channel in retailer.channels for PricePackDecision create)"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all"
  - priority: 5
    category: business_constraint
    check: "growth_target_pct within [GROWTH_TARGET_MIN_PCT, GROWTH_TARGET_MAX_PCT]"
    error_id: ERR_GROWTH_TARGET_OUT_OF_RANGE
    http_status: 400
    applies_to: "POST /jbp/plans, POST /jbp/plans/{id}/negotiate"
  - priority: 6
    category: existence
    check: "path identifiers resolve left-to-right: retailer, category, plan, then child entity (event, analysis, shelf recommendation, launch, phase, fund, deduction, forecast, price-pack decision, review); a child id not belonging to the named parent is a NOT_FOUND, not a leak"
    error_id: ERR_PLAN_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids (ERR_RETAILER_NOT_FOUND / ERR_CATEGORY_NOT_FOUND for those bodies, ERR_PLAN_NOT_FOUND for plan paths, ERR_RESOURCE_NOT_FOUND for deeper child paths)"
  - priority: 7
    category: state
    check: "target entity is in a from-state listed for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints (negotiate, decide, activate, lock, cancel, launch, evaluate, phase PATCH, resolve, commit, verify, finalize)"
  - priority: 8
    category: state
    check: "terminal entities reject every further transition (plan REJECTED/EXPIRED; event CANCELLED; analysis ACCEPTED/RETURNED; shelf rec REJECTED/VERIFIED/STALLED/WITHDRAWN; launch REVIEWED/DELISTED; deduction SETTLED/REJECTED/WRITTEN_OFF; review FINALIZED)"
    error_id: ERR_ALREADY_TERMINAL
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 9
    category: state
    check: "negotiate/decide mover mapping: from PROPOSED only RetailerBuyer may move; from COUNTERED only ManufacturerPlanner may move"
    error_id: ERR_NOT_YOUR_MOVE
    http_status: 403
    applies_to: "POST /jbp/plans/{id}/negotiate, POST /jbp/plans/{id}/decide"
  - priority: 10
    category: state
    check: "negotiate requires negotiation_round < MAX_NEGOTIATION_ROUNDS; on violation the request fails AND the plan auto-transitions to EXPIRED"
    error_id: ERR_NEGOTIATION_ROUNDS_EXHAUSTED
    http_status: 409
    applies_to: "POST /jbp/plans/{id}/negotiate"
  - priority: 11
    category: state
    check: "OCC: expected_plan_version must equal the plan's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /jbp/plans/{id}/shelf-recommendations"
  - priority: 12
    category: state
    check: "plan must be ACTIVATED for: event lock, forecast create, launch create; shelf-recommendation create requires plan status in {ACCEPTED, ACTIVATED}"
    error_id: ERR_PLAN_NOT_ACTIVATED
    http_status: 409
    applies_to: "POST /jbp/events/{id}/lock, POST /jbp/plans/{id}/forecasts, POST /jbp/plans/{id}/launches, POST /jbp/plans/{id}/shelf-recommendations"
  - priority: 13
    category: state
    check: "shelf-recommendation create requires at least one CategoryAnalysis of the plan with status == ACCEPTED"
    error_id: ERR_ANALYSIS_NOT_ACCEPTED
    http_status: 409
    applies_to: "POST /jbp/plans/{id}/shelf-recommendations"
  - priority: 14
    category: state
    check: "launch requires every child LaunchPhase status == GATE_PASSED"
    error_id: ERR_PHASE_GATES_INCOMPLETE
    http_status: 409
    applies_to: "POST /jbp/launches/{id}/launch"
  - priority: 15
    category: state
    check: "phase PATCH requires phase status in {PENDING, GATE_FAILED} and launch status == PLANNING"
    error_id: ERR_PHASE_LOCKED
    http_status: 409
    applies_to: "PATCH /jbp/launches/{id}/phases/{phase_id}"
  - priority: 16
    category: state
    check: "forecast commit requires pub_status == PUBLISHED and commit_status == UNCOMMITTED"
    error_id: ERR_FORECAST_NOT_PUBLISHED
    http_status: 409
    applies_to: "POST /jbp/forecasts/{id}/commit"
  - priority: 17
    category: state
    check: "shelf-rec verify checks in order: (1) status == IMPLEMENTING else ERR_INVALID_STATE; (2) clock - accepted_at <= IMPLEMENTATION_SLA_DAYS else ERR_IMPLEMENTATION_STALLED and auto-transition to STALLED; (3) implemented_store_count >= target_store_count else ERR_IMPLEMENTATION_INCOMPLETE (no state change)"
    error_id: ERR_IMPLEMENTATION_STALLED
    http_status: 409
    applies_to: "POST /jbp/shelf-recommendations/{id}/verify"
  - priority: 18
    category: business_safety
    check: "data governance: CategoryAnalysis with includes_competitor_data == true requires the plan's Category.advisory_scope == FULL_CATEGORY"
    error_id: ERR_GOVERNANCE_BOUNDARY
    http_status: 422
    applies_to: "POST /jbp/plans/{id}/category-analyses"
  - priority: 19
    category: business_constraint
    check: "plan uniqueness: at most one JointBusinessPlan per (retailer_id, category_id, fiscal_year) with status not in {REJECTED, EXPIRED}"
    error_id: ERR_PLAN_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /jbp/plans"
  - priority: 20
    category: business_constraint
    check: "at most one PerformanceReview per launch"
    error_id: ERR_REVIEW_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /jbp/launches/{id}/performance-reviews"
  - priority: 21
    category: business_constraint
    check: "Deduction.claim_reference unique within its fund"
    error_id: ERR_DUPLICATE_CLAIM
    http_status: 409
    applies_to: "POST /jbp/funds/{id}/deductions"
  - priority: 22
    category: business_constraint
    check: "accrual period unique per fund"
    error_id: ERR_DUPLICATE_ACCRUAL_PERIOD
    http_status: 409
    applies_to: "POST /jbp/funds/{id}/accruals"
  - priority: 23
    category: business_constraint
    check: "sum of distribution_target_pct over the launch's phases after the write must be <= DISTRIBUTION_SUM_MAX_PCT"
    error_id: ERR_DISTRIBUTION_SUM_EXCEEDED
    http_status: 422
    applies_to: "PATCH /jbp/launches/{id}/phases/{phase_id}"
  - priority: 24
    category: business_constraint
    check: "phase trade_spend_cents after the write must fit: sum over all phases <= launch.total_trade_budget_cents (equivalently new spend <= budget_remaining_cents + current phase spend)"
    error_id: ERR_PHASE_BUDGET_EXCEEDED
    http_status: 422
    applies_to: "PATCH /jbp/launches/{id}/phases/{phase_id}"
  - priority: 25
    category: business_constraint
    check: "CLUB channel packs require unit_count >= CLUB_PACK_MIN_UNITS"
    error_id: ERR_CLUB_PACK_TOO_SMALL
    http_status: 422
    applies_to: "POST /jbp/plans/{id}/price-pack-decisions"
  - priority: 26
    category: business_constraint
    check: "channel conflict on APPROVE: for every other APPROVED PricePackDecision of the plan, gap_pct = |ppu_new - ppu_other| / min(ppu_new, ppu_other) * 100 must be <= CHANNEL_PRICE_GAP_MAX_PCT (exactly 15 passes); additionally an ECOMMERCE candidate requires ppu_new >= ceil(min(ppu over APPROVED non-ECOMMERCE of the plan) * (100 - ECOMMERCE_UNDERCUT_MAX_PCT) / 100); the pairwise gap rule is checked before the ECOMMERCE undercut rule"
    error_id: ERR_CHANNEL_CONFLICT
    http_status: 422
    applies_to: "POST /jbp/price-pack-decisions/{id}/decide {decision: APPROVE} (ERR_CHANNEL_CONFLICT on gap breach, ERR_ECOMMERCE_UNDERCUT on undercut breach)"
  - priority: 27
    category: business_temporal
    check: "promotional calendar overlap: within one plan and one event_type, events with status in {PENCILED, LOCKED} occupy half-open [start_date, end_date); a create whose interval intersects an existing one is rejected; adjacency (end == start) is allowed"
    error_id: ERR_PROMO_OVERLAP
    http_status: 409
    applies_to: "POST /jbp/plans/{id}/events"
  - priority: 28
    category: business_temporal
    check: "Forecast.week_start must be a Monday at 00:00:00Z"
    error_id: ERR_WEEK_NOT_ALIGNED
    http_status: 422
    applies_to: "POST /jbp/plans/{id}/forecasts"
  - priority: 29
    category: business_temporal
    check: "InnovationLaunch.launch_date's UTC calendar year must equal the plan's fiscal_year"
    error_id: ERR_LAUNCH_OUTSIDE_FISCAL_YEAR
    http_status: 422
    applies_to: "POST /jbp/plans/{id}/launches"
  - priority: 30
    category: business_temporal
    check: "launch separation: the new launch_date must be at least LAUNCH_MIN_GAP_DAYS days away from the launch_date of every other launch of the same plan with status in {PLANNING, LAUNCHED}; exactly LAUNCH_MIN_GAP_DAYS passes"
    error_id: ERR_LAUNCH_TOO_CLOSE
    http_status: 422
    applies_to: "POST /jbp/plans/{id}/launches"
  - priority: 31
    category: business_temporal
    check: "launch requires current logical clock >= launch_date (checked only after the phase-gate state check passes)"
    error_id: ERR_LAUNCH_DATE_NOT_REACHED
    http_status: 422
    applies_to: "POST /jbp/launches/{id}/launch"
  - priority: 32
    category: business_temporal
    check: "review create requires current logical clock >= launch.launch_date + REVIEW_MIN_DAYS_AFTER_LAUNCH days (exactly at the boundary passes)"
    error_id: ERR_REVIEW_TOO_EARLY
    http_status: 422
    applies_to: "POST /jbp/launches/{id}/performance-reviews"
  - priority: 33
    category: business_fiscal
    check: "event lock requires event_cost_estimate <= TradeFund.event_available_cents at lock time"
    error_id: ERR_INSUFFICIENT_FUNDS
    http_status: 422
    applies_to: "POST /jbp/events/{id}/lock"
  - priority: 34
    category: business_fiscal
    check: "activation split: edlp_split_pct <= 100 - EVENT_SPLIT_MIN_PCT (event share >= EVENT_SPLIT_MIN_PCT)"
    error_id: ERR_EVENT_SPLIT_TOO_LOW
    http_status: 422
    applies_to: "POST /jbp/plans/{id}/activate"

# =============================================================================
# 1.5 API Endpoint Table
# Roles shorthand note: read endpoints list all six roles explicitly.
# =============================================================================
endpoints:
  - method: POST
    path: "/jbp/_clock/set_current_utc"
    description: "Test-driving endpoint: sets the server's logical clock. Before any call, the clock reads exactly 2026-09-01T00:00:00Z (DEFAULT_CLOCK_START_ISO) and never falls back to wall-clock. The clock is monotonic non-decreasing: setting an earlier instant than the current one fails ERR_VALIDATION."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["all subsequent time-gated preconditions evaluate against this instant"]

  - method: POST
    path: "/jbp/retailers"
    description: "Create a retailer account"
    roles: [PlatformAdmin]
    code: 201
    input: [name, country_code, channels, "status?"]
    output: Retailer
    side_effects: []

  - method: POST
    path: "/jbp/categories"
    description: "Create a category with its advisory data-governance scope"
    roles: [PlatformAdmin]
    code: 201
    input: [name, "advisory_scope?"]
    output: Category
    side_effects: []

  - method: POST
    path: "/jbp/plans"
    description: "Create a JointBusinessPlan; lands directly in PROPOSED with negotiation_round 1"
    roles: [ManufacturerPlanner]
    code: 201
    input: [retailer_id, category_id, fiscal_year, growth_target_pct, weekly_baseline_cases, avg_unit_net_price_cents]
    output: JointBusinessPlan
    side_effects: []

  - method: GET
    path: "/jbp/plans/{id}"
    description: "Read one plan (includes version for OCC capture)"
    roles: [PlatformAdmin, ManufacturerPlanner, RetailerBuyer, CategoryAdvisor, SupplyChainPlanner, FinanceAnalyst]
    code: 200
    input: []
    output: JointBusinessPlan
    side_effects: []

  - method: GET
    path: "/jbp/plans"
    description: "List plans; filterable; paginated envelope"
    roles: [PlatformAdmin, ManufacturerPlanner, RetailerBuyer, CategoryAdvisor, SupplyChainPlanner, FinanceAnalyst]
    code: 200
    input: ["retailer_id?", "category_id?", "status?", "fiscal_year?", "limit?", "offset?"]
    output: JointBusinessPlan[]
    side_effects: []

  - method: POST
    path: "/jbp/plans/{id}/negotiate"
    description: "Counter (RetailerBuyer from PROPOSED) or re-propose (ManufacturerPlanner from COUNTERED); increments negotiation_round and version; round exhaustion rejects and auto-EXPIRES the plan"
    roles: [ManufacturerPlanner, RetailerBuyer]
    code: 200
    input: [growth_target_pct]
    output: JointBusinessPlan
    side_effects: ["negotiation_round += 1", "growth_target_pct := payload", "increments JointBusinessPlan.version by 1", "on round exhaustion: ERR_NEGOTIATION_ROUNDS_EXHAUSTED and status := EXPIRED in the same failed request"]

  - method: POST
    path: "/jbp/plans/{id}/decide"
    description: "Accept or reject the live offer; the allowed mover depends on state (PROPOSED -> RetailerBuyer, COUNTERED -> ManufacturerPlanner)"
    roles: [ManufacturerPlanner, RetailerBuyer]
    code: 200
    input: [decision]
    output: JointBusinessPlan
    side_effects: ["status := ACCEPTED or REJECTED", "increments JointBusinessPlan.version by 1"]

  - method: POST
    path: "/jbp/plans/{id}/activate"
    description: "Activate an ACCEPTED plan; creates its TradeFund (accrual_rate_pct, edlp_split_pct locked)"
    roles: [ManufacturerPlanner]
    code: 200
    input: [accrual_rate_pct, edlp_split_pct]
    output: JointBusinessPlan
    side_effects: ["create TradeFund with zeroed balances", "committed_growth_pct := growth_target_pct", "activated_at := clock", "increments JointBusinessPlan.version by 1"]

  - method: POST
    path: "/jbp/plans/{id}/events"
    description: "Pencil a promotional event onto the plan calendar (allowed while plan status in {PROPOSED, COUNTERED, ACCEPTED, ACTIVATED}); half-open overlap rule applies per event_type"
    roles: [ManufacturerPlanner]
    code: 201
    input: [name, event_type, start_date, end_date, discount_depth_pct]
    output: PromotionalEvent
    side_effects: []

  - method: GET
    path: "/jbp/plans/{id}/events"
    description: "List events of a plan; filterable by status and event_type"
    roles: [PlatformAdmin, ManufacturerPlanner, RetailerBuyer, CategoryAdvisor, SupplyChainPlanner, FinanceAnalyst]
    code: 200
    input: ["status?", "event_type?", "limit?", "offset?"]
    output: PromotionalEvent[]
    side_effects: []

  - method: POST
    path: "/jbp/events/{id}/lock"
    description: "Lock a PENCILED event: computes and persists estimated_cost_cents and reserves that amount in the fund's event bucket"
    roles: [ManufacturerPlanner]
    code: 200
    input: []
    output: PromotionalEvent
    side_effects: ["event.estimated_cost_cents := event_cost_estimate", "TradeFund.event_reserved_cents += estimated_cost_cents", "increments PromotionalEvent.version by 1"]

  - method: POST
    path: "/jbp/events/{id}/cancel"
    description: "Cancel a PENCILED or LOCKED event; cancelling a LOCKED event releases its reservation"
    roles: [ManufacturerPlanner]
    code: 200
    input: []
    output: PromotionalEvent
    side_effects: ["if was LOCKED: TradeFund.event_reserved_cents -= estimated_cost_cents", "increments PromotionalEvent.version by 1"]

  - method: POST
    path: "/jbp/plans/{id}/category-analyses"
    description: "Submit a category advisory analysis (lands SUBMITTED); competitor data gated by category advisory_scope"
    roles: [CategoryAdvisor]
    code: 201
    input: [title, period_label, total_category_growth_pct, manufacturer_share_pct, "includes_competitor_data?"]
    output: CategoryAnalysis
    side_effects: []

  - method: GET
    path: "/jbp/plans/{id}/category-analyses"
    description: "List analyses of a plan; filterable by status"
    roles: [PlatformAdmin, ManufacturerPlanner, RetailerBuyer, CategoryAdvisor, SupplyChainPlanner, FinanceAnalyst]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: CategoryAnalysis[]
    side_effects: []

  - method: POST
    path: "/jbp/category-analyses/{id}/decide"
    description: "Retailer accepts or returns a SUBMITTED analysis"
    roles: [RetailerBuyer]
    code: 200
    input: [decision]
    output: CategoryAnalysis
    side_effects: ["status := ACCEPTED or RETURNED", "increments CategoryAnalysis.version by 1"]

  - method: POST
    path: "/jbp/plans/{id}/shelf-recommendations"
    description: "Submit a shelf assortment/space recommendation (OCC-guarded, see concurrency_rules[shelf-rec-create-stale-plan]); supersedes the plan's currently PROPOSED recommendation to WITHDRAWN"
    roles: [CategoryAdvisor]
    code: 201
    input: [expected_plan_version, title, space_change_pct, target_store_count, "sku_adds?", "sku_drops?"]
    output: ShelfRecommendation
    side_effects: ["existing PROPOSED ShelfRecommendation of the plan -> WITHDRAWN", "increments JointBusinessPlan.version by 1"]

  - method: GET
    path: "/jbp/plans/{id}/shelf-recommendations"
    description: "List shelf recommendations of a plan; filterable by status"
    roles: [PlatformAdmin, ManufacturerPlanner, RetailerBuyer, CategoryAdvisor, SupplyChainPlanner, FinanceAnalyst]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ShelfRecommendation[]
    side_effects: []

  - method: POST
    path: "/jbp/shelf-recommendations/{id}/decide"
    description: "Retailer accepts (-> IMPLEMENTING, accepted_at stamped) or rejects (-> REJECTED) a PROPOSED recommendation"
    roles: [RetailerBuyer]
    code: 200
    input: [decision]
    output: ShelfRecommendation
    side_effects: ["on ACCEPT: accepted_at := clock", "increments ShelfRecommendation.version by 1"]

  - method: POST
    path: "/jbp/shelf-recommendations/{id}/verify"
    description: "Manufacturer audit of implementation; ordered checks: IMPLEMENTING -> SLA window -> store count"
    roles: [CategoryAdvisor]
    code: 200
    input: [implemented_store_count]
    output: ShelfRecommendation
    side_effects: ["on success: status := VERIFIED, verified_store_count := payload", "on SLA breach: ERR_IMPLEMENTATION_STALLED and status := STALLED in the same failed request"]

  - method: POST
    path: "/jbp/plans/{id}/launches"
    description: "Create an innovation launch on an ACTIVATED plan; auto-creates PHASE_COUNT LaunchPhase children (phase_index 1..4, types CAPACITY_BUILD, DISTRIBUTION_BUILD, TRADE_SPEND, SUSTAIN, all PENDING, all numeric fields 0)"
    roles: [ManufacturerPlanner]
    code: 201
    input: [product_name, pack_family, launch_date, total_trade_budget_cents]
    output: InnovationLaunch
    side_effects: ["create 4 LaunchPhase children", "budget_remaining_cents := total_trade_budget_cents", "both projected distribution fields := 0"]

  - method: GET
    path: "/jbp/plans/{id}/launches"
    description: "List launches of a plan; filterable by status"
    roles: [PlatformAdmin, ManufacturerPlanner, RetailerBuyer, CategoryAdvisor, SupplyChainPlanner, FinanceAnalyst]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: InnovationLaunch[]
    side_effects: []

  - method: GET
    path: "/jbp/launches/{id}"
    description: "Read one launch (includes computed budget_remaining_cents and both distribution projections)"
    roles: [PlatformAdmin, ManufacturerPlanner, RetailerBuyer, CategoryAdvisor, SupplyChainPlanner, FinanceAnalyst]
    code: 200
    input: []
    output: InnovationLaunch
    side_effects: []

  - method: POST
    path: "/jbp/launches/{id}/launch"
    description: "Execute the launch: requires all phases GATE_PASSED (state check first) and clock >= launch_date (temporal check second)"
    roles: [ManufacturerPlanner]
    code: 200
    input: []
    output: InnovationLaunch
    side_effects: ["status := LAUNCHED", "launched_at := clock", "increments InnovationLaunch.version by 1"]

  - method: GET
    path: "/jbp/launches/{id}/phases"
    description: "List the launch's phases ordered by phase_index ascending"
    roles: [PlatformAdmin, ManufacturerPlanner, RetailerBuyer, CategoryAdvisor, SupplyChainPlanner, FinanceAnalyst]
    code: 200
    input: ["limit?", "offset?"]
    output: LaunchPhase[]
    side_effects: []

  - method: PATCH
    path: "/jbp/launches/{id}/phases/{phase_id}"
    description: "Revise a phase's inputs; allowed from PENDING (stays PENDING) or GATE_FAILED (returns to PENDING); budget and distribution-sum caps enforced"
    roles: [ManufacturerPlanner]
    code: 200
    input: ["distribution_target_pct?", "capacity_cases?", "trade_spend_cents?"]
    output: LaunchPhase
    side_effects: ["GATE_FAILED -> PENDING", "recompute launch.budget_remaining_cents", "recompute both launch distribution projections", "increments LaunchPhase.version by 1"]

  - method: POST
    path: "/jbp/launches/{id}/phases/{phase_id}/evaluate"
    description: "Evaluate the phase gate from PENDING: GATE_PASSED iff all lower-index phases are GATE_PASSED and distribution_target_pct > 0 and capacity_cases > 0; otherwise GATE_FAILED"
    roles: [ManufacturerPlanner]
    code: 200
    input: []
    output: LaunchPhase
    side_effects: ["status := GATE_PASSED or GATE_FAILED", "recompute both launch distribution projections", "increments LaunchPhase.version by 1"]

  - method: GET
    path: "/jbp/funds/{id}"
    description: "Read one trade fund (all accrual/cash/reserved/settled/available fields)"
    roles: [PlatformAdmin, ManufacturerPlanner, RetailerBuyer, CategoryAdvisor, SupplyChainPlanner, FinanceAnalyst]
    code: 200
    input: []
    output: TradeFund
    side_effects: []

  - method: GET
    path: "/jbp/funds"
    description: "List trade funds; plan_id filter locates a plan's single fund"
    roles: [PlatformAdmin, ManufacturerPlanner, RetailerBuyer, CategoryAdvisor, SupplyChainPlanner, FinanceAnalyst]
    code: 200
    input: ["plan_id?", "limit?", "offset?"]
    output: TradeFund[]
    side_effects: []

  - method: POST
    path: "/jbp/funds/{id}/accruals"
    description: "Post one period's invoiced sales; computes fund_period_accrual (both ACCRUAL_BASIS and CASH_BASIS) and accumulates; period unique per fund"
    roles: [FinanceAnalyst]
    code: 201
    input: [period, invoiced_sales_cents]
    output: TradeFund
    side_effects: ["accumulate edlp/event accrued and cash balances per calculation fund_period_accrual", "total_invoiced_cents += invoiced_sales_cents", "increments TradeFund.version by 1"]

  - method: POST
    path: "/jbp/funds/{id}/deductions"
    description: "Retailer files a deduction claim against a fund bucket"
    roles: [RetailerBuyer]
    code: 201
    input: [claim_reference, bucket, amount_cents]
    output: Deduction
    side_effects: []

  - method: GET
    path: "/jbp/funds/{id}/deductions"
    description: "List deductions of a fund; filterable by status and bucket"
    roles: [PlatformAdmin, ManufacturerPlanner, RetailerBuyer, CategoryAdvisor, SupplyChainPlanner, FinanceAnalyst]
    code: 200
    input: ["status?", "bucket?", "limit?", "offset?"]
    output: Deduction[]
    side_effects: []

  - method: POST
    path: "/jbp/deductions/{id}/resolve"
    description: "Finance resolution: DISPUTE (from RECEIVED), SETTLE (from RECEIVED or DISPUTED, pays min(amount, bucket available), short_paid flagged), REJECT (from DISPUTED, no fund movement), WRITE_OFF (from DISPUTED, absorbed into settled ledger)"
    roles: [FinanceAnalyst]
    code: 200
    input: [action]
    output: Deduction
    side_effects: ["fund bucket settled ledger updated on SETTLE / WRITE_OFF", "OPEN PerformanceReviews of the fund's plan recompute friction_count, risk_score, risk_posture (three-hop cascade)"]

  - method: POST
    path: "/jbp/plans/{id}/forecasts"
    description: "Publish a weekly baseline forecast (lands PUBLISHED); supersedes the currently PUBLISHED forecast of the same (plan, week_start) to SUPERSEDED preserving its commit_status"
    roles: [SupplyChainPlanner]
    code: 201
    input: [week_start, baseline_cases]
    output: Forecast
    side_effects: ["existing PUBLISHED forecast of same (plan, week_start) -> SUPERSEDED (commit_status preserved)"]

  - method: GET
    path: "/jbp/plans/{id}/forecasts"
    description: "List forecasts of a plan; filterable by pub_status, commit_status, week_start"
    roles: [PlatformAdmin, ManufacturerPlanner, RetailerBuyer, CategoryAdvisor, SupplyChainPlanner, FinanceAnalyst]
    code: 200
    input: ["pub_status?", "commit_status?", "week_start?", "limit?", "offset?"]
    output: Forecast[]
    side_effects: []

  - method: POST
    path: "/jbp/forecasts/{id}/commit"
    description: "Retailer commits volume against a PUBLISHED, UNCOMMITTED forecast"
    roles: [RetailerBuyer]
    code: 200
    input: [committed_cases]
    output: Forecast
    side_effects: ["commit_status := COMMITTED", "committed_cases, committed_at set", "increments Forecast.version by 1"]

  - method: POST
    path: "/jbp/plans/{id}/price-pack-decisions"
    description: "Propose a channel price-pack decision; channel must belong to the plan retailer's channels; CLUB packs need >= CLUB_PACK_MIN_UNITS units"
    roles: [ManufacturerPlanner]
    code: 201
    input: [channel, pack_family, pack_code, unit_count, list_price_cents]
    output: PricePackDecision
    side_effects: ["price_per_unit_cents := ceil(list_price_cents / unit_count)"]

  - method: GET
    path: "/jbp/plans/{id}/price-pack-decisions"
    description: "List price-pack decisions of a plan; filterable by channel, status, pack_family"
    roles: [PlatformAdmin, ManufacturerPlanner, RetailerBuyer, CategoryAdvisor, SupplyChainPlanner, FinanceAnalyst]
    code: 200
    input: ["channel?", "status?", "pack_family?", "limit?", "offset?"]
    output: PricePackDecision[]
    side_effects: []

  - method: POST
    path: "/jbp/price-pack-decisions/{id}/decide"
    description: "Retailer approves (channel-conflict rules evaluated against the plan's other APPROVED decisions) or rejects a PROPOSED decision"
    roles: [RetailerBuyer]
    code: 200
    input: [decision]
    output: PricePackDecision
    side_effects: ["status := APPROVED or REJECTED", "increments PricePackDecision.version by 1"]

  - method: POST
    path: "/jbp/launches/{id}/performance-reviews"
    description: "Open the post-launch performance review (one per launch); requires clock >= launch_date + REVIEW_MIN_DAYS_AFTER_LAUNCH days; computes attainment, forecast bias, friction, risk_score, risk_posture at creation"
    roles: [ManufacturerPlanner]
    code: 201
    input: [period_start, period_end, actual_sales_cents, sales_target_cents, target_distribution_pct, distribution_achieved_pct]
    output: PerformanceReview
    side_effects: ["compute sales_attainment_pct, forecast_bias_pct, friction_count, risk_score, risk_posture"]

  - method: GET
    path: "/jbp/launches/{id}/performance-reviews"
    description: "List reviews of a launch (at most one)"
    roles: [PlatformAdmin, ManufacturerPlanner, RetailerBuyer, CategoryAdvisor, SupplyChainPlanner, FinanceAnalyst]
    code: 200
    input: ["limit?", "offset?"]
    output: PerformanceReview[]
    side_effects: []

  - method: POST
    path: "/jbp/performance-reviews/{id}/finalize"
    description: "Retailer finalizes an OPEN review with decision CONTINUE (launch -> REVIEWED) or DELIST (launch -> DELISTED and matching APPROVED price-pack decisions -> RETIRED)"
    roles: [RetailerBuyer]
    code: 200
    input: [decision]
    output: PerformanceReview
    side_effects: ["status := FINALIZED, decision set", "launch -> REVIEWED or DELISTED", "on DELIST: APPROVED PricePackDecisions of the plan with matching pack_family -> RETIRED"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or role name not one of the six declared roles"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "authenticated role is not in the endpoint's roles list"
  - id: ERR_RETAILER_SCOPE_MISMATCH
    http: 403
    condition: "RetailerBuyer's X-User-ID does not equal the retailer_id of the plan owning the target resource"
  - id: ERR_VALIDATION
    http: 400
    condition: "body shape violation: missing/undeclared field, bad type, bad enum member, numeric range breach, overlapping sku_adds/sku_drops, pagination limit outside [1,100], channel outside the retailer's channels, clock regression"
  - id: ERR_GROWTH_TARGET_OUT_OF_RANGE
    http: 400
    condition: "growth_target_pct outside [GROWTH_TARGET_MIN_PCT, GROWTH_TARGET_MAX_PCT] on plan create or negotiate"
  - id: ERR_RETAILER_NOT_FOUND
    http: 404
    condition: "retailer_id in a plan-create body does not resolve"
  - id: ERR_CATEGORY_NOT_FOUND
    http: 404
    condition: "category_id in a plan-create body does not resolve"
  - id: ERR_PLAN_NOT_FOUND
    http: 404
    condition: "plan id in path does not resolve"
  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "deeper child path id (event, analysis, shelf rec, launch, phase, fund, deduction, forecast, price-pack decision, review) does not resolve under its named parent"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "target entity not in a from-state permitted for the requested transition (includes event lock or forecast/launch create on a non-ACTIVATED plan when a more specific error does not apply; includes shelf-rec verify on a non-IMPLEMENTING rec; includes retailer SUSPENDED at plan activation)"
  - id: ERR_ALREADY_TERMINAL
    http: 409
    condition: "target entity is in a terminal state and rejects every further transition"
  - id: ERR_NOT_YOUR_MOVE
    http: 403
    condition: "negotiate/decide attempted by the wrong party for the plan's current state (PROPOSED belongs to RetailerBuyer, COUNTERED to ManufacturerPlanner)"
  - id: ERR_NEGOTIATION_ROUNDS_EXHAUSTED
    http: 409
    condition: "negotiate attempted at negotiation_round == MAX_NEGOTIATION_ROUNDS; the plan auto-transitions to EXPIRED in the same failed request"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_plan_version does not equal the plan's current version on shelf-recommendation create (OCC)"
  - id: ERR_PLAN_NOT_ACTIVATED
    http: 409
    condition: "event lock, forecast create, or launch create while plan status != ACTIVATED; shelf-rec create while plan status not in {ACCEPTED, ACTIVATED}"
  - id: ERR_ANALYSIS_NOT_ACCEPTED
    http: 409
    condition: "shelf-recommendation create while the plan has no ACCEPTED CategoryAnalysis"
  - id: ERR_PHASE_GATES_INCOMPLETE
    http: 409
    condition: "launch attempted while any child phase is not GATE_PASSED (checked before the launch-date temporal check)"
  - id: ERR_PHASE_LOCKED
    http: 409
    condition: "phase PATCH attempted while phase is GATE_PASSED or launch is not PLANNING"
  - id: ERR_FORECAST_NOT_PUBLISHED
    http: 409
    condition: "forecast commit attempted when pub_status != PUBLISHED or commit_status != UNCOMMITTED"
  - id: ERR_IMPLEMENTATION_STALLED
    http: 409
    condition: "shelf-rec verify attempted after IMPLEMENTATION_SLA_DAYS from accepted_at; the rec auto-transitions to STALLED in the same failed request"
  - id: ERR_IMPLEMENTATION_INCOMPLETE
    http: 422
    condition: "shelf-rec verify within SLA but implemented_store_count < target_store_count; no state change"
  - id: ERR_GOVERNANCE_BOUNDARY
    http: 422
    condition: "CategoryAnalysis with includes_competitor_data == true on a plan whose Category.advisory_scope == MANUFACTURER_ONLY"
  - id: ERR_PLAN_ALREADY_EXISTS
    http: 409
    condition: "a JointBusinessPlan for the same (retailer_id, category_id, fiscal_year) already exists in a non-terminal status"
  - id: ERR_REVIEW_ALREADY_EXISTS
    http: 409
    condition: "a PerformanceReview already exists for the launch"
  - id: ERR_DUPLICATE_CLAIM
    http: 409
    condition: "claim_reference already used within the fund"
  - id: ERR_DUPLICATE_ACCRUAL_PERIOD
    http: 409
    condition: "an accrual for the same period was already posted to the fund"
  - id: ERR_DISTRIBUTION_SUM_EXCEEDED
    http: 422
    condition: "phase write would push the launch's distribution_target_pct sum over DISTRIBUTION_SUM_MAX_PCT"
  - id: ERR_PHASE_BUDGET_EXCEEDED
    http: 422
    condition: "phase write would push the launch's trade_spend_cents sum over total_trade_budget_cents"
  - id: ERR_CLUB_PACK_TOO_SMALL
    http: 422
    condition: "CLUB channel price-pack with unit_count < CLUB_PACK_MIN_UNITS"
  - id: ERR_CHANNEL_CONFLICT
    http: 422
    condition: "approving a price-pack decision would make its price_per_unit_cents diverge from an APPROVED sibling by more than CHANNEL_PRICE_GAP_MAX_PCT (gap checked before the ECOMMERCE undercut rule)"
  - id: ERR_ECOMMERCE_UNDERCUT
    http: 422
    condition: "approving an ECOMMERCE price-pack decision would put its ppu below ceil(min APPROVED non-ECOMMERCE ppu * (100 - ECOMMERCE_UNDERCUT_MAX_PCT) / 100)"
  - id: ERR_PROMO_OVERLAP
    http: 409
    condition: "new event's half-open [start_date, end_date) intersects a same-plan, same-event_type event with status in {PENCILED, LOCKED}; adjacency is allowed"
  - id: ERR_WEEK_NOT_ALIGNED
    http: 422
    condition: "Forecast.week_start is not a Monday 00:00:00Z"
  - id: ERR_LAUNCH_OUTSIDE_FISCAL_YEAR
    http: 422
    condition: "launch_date's UTC calendar year != plan.fiscal_year"
  - id: ERR_LAUNCH_TOO_CLOSE
    http: 422
    condition: "launch_date within fewer than LAUNCH_MIN_GAP_DAYS days of another PLANNING/LAUNCHED launch of the same plan"
  - id: ERR_LAUNCH_DATE_NOT_REACHED
    http: 422
    condition: "launch attempted before the logical clock reaches launch_date (only after phase gates pass)"
  - id: ERR_REVIEW_TOO_EARLY
    http: 422
    condition: "review create before launch_date + REVIEW_MIN_DAYS_AFTER_LAUNCH days"
  - id: ERR_INSUFFICIENT_FUNDS
    http: 422
    condition: "event lock whose event_cost_estimate exceeds the fund's event_available_cents"
  - id: ERR_EVENT_SPLIT_TOO_LOW
    http: 422
    condition: "activation edlp_split_pct > 100 - EVENT_SPLIT_MIN_PCT"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Manufacturer-side platform operator; seeds reference data and drives the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /jbp/_clock/set_current_utc"
      - "POST /jbp/retailers"
      - "POST /jbp/categories"
    shared_operations:
      - "all GET / list endpoints"
  - name: ManufacturerPlanner
    description: "Manufacturer (P&G) joint-business planner; owns plans, promotional calendar, launches, phases, price-pack proposals, review creation"
    identity: opaque
    exclusive_operations:
      - "POST /jbp/plans"
      - "POST /jbp/plans/{id}/activate"
      - "POST /jbp/plans/{id}/events, POST /jbp/events/{id}/lock, POST /jbp/events/{id}/cancel"
      - "POST /jbp/plans/{id}/launches, POST /jbp/launches/{id}/launch"
      - "PATCH /jbp/launches/{id}/phases/{phase_id}, POST /jbp/launches/{id}/phases/{phase_id}/evaluate"
      - "POST /jbp/plans/{id}/price-pack-decisions"
      - "POST /jbp/launches/{id}/performance-reviews"
    shared_operations:
      - "POST /jbp/plans/{id}/negotiate (as re-proposer from COUNTERED)"
      - "POST /jbp/plans/{id}/decide (as acceptor/rejecter from COUNTERED)"
      - "all GET / list endpoints"
  - name: RetailerBuyer
    description: "Retail-side buyer; counters/accepts plans, decides analyses, shelf recs and price-pack decisions, files deductions, commits forecasts, finalizes reviews"
    identity: "entity_backed:Retailer"
    exclusive_operations:
      - "POST /jbp/funds/{id}/deductions"
      - "POST /jbp/forecasts/{id}/commit"
      - "POST /jbp/performance-reviews/{id}/finalize"
      - "POST /jbp/category-analyses/{id}/decide"
      - "POST /jbp/shelf-recommendations/{id}/decide"
      - "POST /jbp/price-pack-decisions/{id}/decide"
    shared_operations:
      - "POST /jbp/plans/{id}/negotiate (as counterparty from PROPOSED)"
      - "POST /jbp/plans/{id}/decide (as acceptor/rejecter from PROPOSED)"
      - "all GET / list endpoints (scope-limited to own retailer's data)"
  - name: CategoryAdvisor
    description: "Manufacturer category-captain analyst; produces category analyses and shelf recommendations and audits their implementation"
    identity: opaque
    exclusive_operations:
      - "POST /jbp/plans/{id}/category-analyses"
      - "POST /jbp/plans/{id}/shelf-recommendations"
      - "POST /jbp/shelf-recommendations/{id}/verify"
    shared_operations:
      - "all GET / list endpoints"
  - name: SupplyChainPlanner
    description: "Manufacturer supply-chain collaborator; publishes weekly baseline forecasts"
    identity: opaque
    exclusive_operations:
      - "POST /jbp/plans/{id}/forecasts"
    shared_operations:
      - "all GET / list endpoints"
  - name: FinanceAnalyst
    description: "Manufacturer trade-finance analyst; posts fund accruals and resolves deduction claims"
    identity: opaque
    exclusive_operations:
      - "POST /jbp/funds/{id}/accruals"
      - "POST /jbp/deductions/{id}/resolve"
    shared_operations:
      - "all GET / list endpoints"
