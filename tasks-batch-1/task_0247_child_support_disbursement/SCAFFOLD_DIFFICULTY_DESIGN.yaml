              payload: { support_order_id: "${o_id}", employer_id: "${emp_id}", ordered_amount_cents: 30000, effective_start_at: "2026-01-01T00:00:00Z", effective_end_at: "2026-04-01T00:00:00Z" }
              as: CaseWorker
              captures: { iwo1_id: "$.data.id"}
          trigger:
            - call: "POST /sdu/income-withholding-orders"
              payload: { support_order_id: "${o_id}", employer_id: "${emp_id}", ordered_amount_cents: 30000, effective_start_at: "2026-03-01T00:00:00Z", effective_end_at: "2026-06-01T00:00:00Z" }
              as: CaseWorker
              captures: { err: "$.data.error_id"}
          assert:
            - "response.data.error_id == ERR_IWO_PERIOD_OVERLAP"

      - name: modification_closed_interval_boundary_touch_overlaps
        grounds:
          - validations[priority=19]
          - entities.Modification.fields.coverage_start_at
          - entities.Modification.fields.coverage_end_at
        distinguishing_aspect: |
          Modification uses CLOSED [start, end] intervals on a different resource: a second modification whose coverage_start_at == the existing modification's coverage_end_at (2026-06-30) collides at the shared boundary instant and is rejected with ERR_MODIFICATION_PERIOD_OVERLAP — opposite adjacency treatment from the IWO half-open rule.
