          rationale: "That instance already violates the loan-file state rule (priority 11) and the DTI ceiling (priority 36) in one call and asserts that ERR_LOAN_FILE_STATE_INVALID is returned, which is exactly the priority-conflict claim for this scaffold."

      - name: corner_cross_entity_validation_appraisal_review_gate
