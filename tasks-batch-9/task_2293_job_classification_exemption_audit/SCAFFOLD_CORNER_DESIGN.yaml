        grounds: ["state_machines.Interview", "state_machines.ExemptionAnalysis", "state_machines.ReclassificationCase", "state_machines.ContractorReview"]
        distinguishing_aspect: "Every state-bearing entity must be born in its declared initial state in one pass: Interview SCHEDULED, ExemptionAnalysis DRAFT, and the ReclassificationCase's two parallel dimensions PENDING and NOT_STARTED with case_status OPEN. A single wrong default here silently invalidates every downstream transition test."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; StateRule CA registered; AuditProject in FIELDWORK with one JobFamily and one Position; both interviews attested so an analysis can be created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "pa-1"
            - call: "POST /state-rules"
              payload: { state_code: "CA", min_weekly_salary_cents: 132000, duties_test_variant: "QUANTITATIVE_50PCT", ic_test: "ABC", hce_shortcut_recognized: false, reclass_notice_days: 7 }
