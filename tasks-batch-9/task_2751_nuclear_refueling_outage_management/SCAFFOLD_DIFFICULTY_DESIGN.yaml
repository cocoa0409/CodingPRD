            - "After the rejected call RadiologicalWorkPermit.${rwp_id}.status == DRAFT, Outage.${o_id}.dose_committed_mrem == 0.00 and GET /rwps/${rwp_id}/dose-transactions returns 0 rows"
            - "Outage.${o_id}.status == SCOPE_LOCKED throughout, so the outage-level priority-7 guard was never the blocker"
