              captures: { r1_id: $.data.id }
            - call: "POST /dog-park/incident-reports/${r1_id}/advance"
              payload: { to: "UNDER_REVIEW" }
              as: ParkAdmin
            - call: "POST /dog-park/incident-reports/${r1_id}/advance"
              payload: { to: "CONFIRMED" }
              as: ParkAdmin
            - call: "GET /dog-park/members/${m_id}"
              payload: {}
              as: ParkAdmin
              captures: { sp_mid: $.data.strike_points, st_mid: $.data.status }
            - call: "POST /dog-park/incident-reports"
              payload: { subject_member_id: "${m_id}", severity: "MINOR", occurred_at: "2026-08-03T10:00:00Z", description: "lunging" }
              as: ParkAdmin
              captures: { r2_id: $.data.id }
            - call: "POST /dog-park/incident-reports/${r2_id}/advance"
