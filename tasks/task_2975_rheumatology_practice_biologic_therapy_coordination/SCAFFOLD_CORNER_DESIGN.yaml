        distinguishing_aspect: "POST /visits/{id}/check-in moves SCHEDULED to CHECKED_IN and bumps only Visit.version; the check-in is performed by the InfusionNurse role, not by the visit's own rheumatologist."
        test_recipe:
          setup:
            - "One rheumatologist, one nurse, one patient, one SCHEDULED FOLLOW_UP visit."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /clinicians"
              payload: { npi: "1234567893", full_name: "Ada Rheum", role_type: "RHEUMATOLOGIST", can_attest_formulary_exception: true }
