scenario: |
  desgin task harder than expert level.!!!! 2118. Brand Inspection & Livestock Ownership Verification (state brand inspection board): brand registration & renewal by state, inspection at sale/movement/slaughter, ownership documentation & bill of sale matching, estray & unidentified animal disposition, inspection fee assessment & remittance, theft investigation & law-enforcement referral, brand conflict & recording priority, inspector scheduling & territory

domain_name: brand-inspection-board
api_prefix: /brand-inspection

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - ops_run_checkpoint

  entity_topology: graph
  # Peer entities linked by explicit foreign keys, including a self-referential
  # BrandRegistration.superseded_by_registration_id chain and a many-to-many
  # AnimalLot <-> (BrandRegistration, BillOfSale) association. Only AnimalLot is
  # URL-nested under its parent for creation; every other resource is addressed flat.

  state_machine_shape: cyclic
  # BrandApplication cycles UNDER_EXAMINATION -> RETURNED_FOR_CORRECTION -> SUBMITTED;
  # TheftInvestigation cycles CLOSED -> OPENED; FeeRemittance cycles SHORT_PAID -> SUBMITTED;
  # EstrayCase cycles CLAIM_FILED -> IMPOUNDED. InspectionOrder carries two independent
  # state dimensions (schedule_status x fee_status) on the same row.

  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate

  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Owner
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Legal name of the livestock owner of record.
      - name: mailing_state
        type: string
        source: input
        description: Two-letter USPS state code of the owner's mailing address.
        constraints: "exactly 2 uppercase letters"
      - name: contact_email
        type: string
        source: input
        description: Contact email used for delinquency notices.
      - name: standing
        type: enum
        source: computed
        description: "Fiscal standing gate recomputed by calculations.owner_arrears_and_standing; SUSPENDED blocks new inspection scheduling."
        default: GOOD
        constraints: "one of {GOOD, SUSPENDED}"
      - name: posted_arrears_cents
        type: integer
        source: computed
        description: "POSTED variant of calculations.owner_arrears_and_standing: sum of assessed_fee_cents over this owner's InspectionOrders whose fee_status == DELINQUENT."
        default: 0
      - name: projected_arrears_cents
        type: integer
        source: computed
        description: "PROJECTED variant of calculations.owner_arrears_and_standing: sum of assessed_fee_cents over this owner's InspectionOrders whose fee_status IN {ASSESSED, DELINQUENT}."
        default: 0
      - name: suspended_since
        type: datetime
        source: system
        description: Logical-clock instant at which standing last flipped GOOD -> SUSPENDED; null while standing == GOOD.
        default: null

  - name: Territory
    parent: null
    common_fields: true
    fields:
      - name: territory_code
        type: string
        source: input
        description: Board-assigned inspection district code.
        constraints: "unique across all Territory rows"
      - name: state_code
        type: string
        source: input
        description: Two-letter USPS state code the district belongs to.
      - name: travel_surcharge_cents
        type: integer
        source: input
        description: Flat per-order travel surcharge added by calculations.inspection_fee_assessment.
        constraints: ">= 0"
      - name: impound_capacity_head
        type: integer
        source: input
        description: Maximum head of livestock the district impound facility may hold at any single instant.
        constraints: ">= 1"
      - name: impound_current_head
        type: integer
        source: computed
        description: "Sum of EstrayCase.head_count over EstrayCases with this territory_id whose status IN {IMPOUNDED, CLAIM_FILED, AUCTION_SCHEDULED, SOLD}."
        default: 0
      - name: intake_status
        type: enum
        source: computed
        description: "RESTRICTED when impound_current_head * 100 >= impound_capacity_head * 90, otherwise OPEN."
        default: OPEN
        constraints: "one of {OPEN, RESTRICTED}"

  - name: Inspector
    parent: null
    common_fields: true
    fields:
      - name: badge_number
        type: string
        source: input
        description: Board-issued inspector badge number.
        constraints: "unique across all Inspector rows"
      - name: home_territory_id
        type: string
        source: input
        description: "FK -> Territory.id; the district this inspector is commissioned in."
      - name: certification_expires_on
        type: datetime
        source: input
        description: Instant after which the inspector's commission is no longer valid for scheduling.
      - name: max_daily_assignments
        type: integer
        source: input
        description: Maximum InspectionOrders this inspector may hold on a single UTC calendar date.
        default: 3
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: Commission status controlled by POST /inspectors/{id}/status.
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED, RETIRED}"
      - name: active_assignment_count
        type: integer
        source: computed
        description: "Count of InspectionOrders with inspector_id == this Inspector.id and schedule_status IN {SCHEDULED, IN_FIELD}."
        default: 0

  - name: BrandApplication
    parent: null
    common_fields: true
    fields:
      - name: owner_id
        type: string
        source: input
        description: "FK -> Owner.id; the applicant."
      - name: application_type
        type: enum
        source: input
        description: Kind of filing.
        constraints: "one of {NEW, TRANSFER, RENEWAL}"
      - name: prior_registration_id
        type: string
        source: input
        description: "FK -> BrandRegistration.id; the record being renewed or transferred; null for application_type == NEW."
        default: null
      - name: brand_symbol
        type: string
        source: input
        description: Textual rendering of the brand design (for example "7X" or "BAR-L").
      - name: position_code
        type: enum
        source: input
        description: Body location the brand is applied to.
        constraints: "one of {LEFT_RIB, RIGHT_RIB, LEFT_HIP, RIGHT_HIP, LEFT_SHOULDER, RIGHT_SHOULDER}"
      - name: species_class
        type: enum
        source: input
        description: Species class the brand is recorded for.
        constraints: "one of {CATTLE, HORSE, SHEEP}"
      - name: state_code
        type: string
        source: input
        description: Two-letter USPS state code the brand is being recorded in; brand exclusivity is scoped per state.
      - name: documented_prior_use_years
        type: integer
        source: input
        description: Years of documented unrecorded prior use claimed by the applicant.
        default: 0
        constraints: ">= 0"
      - name: prior_use_affidavit_on_file
        type: boolean
        source: input
        description: Whether a notarised prior-use affidavit accompanies the filing; when false, documented_prior_use_years is ignored by calculations.brand_priority_ranking.
        default: false
      - name: original_filed_at
        type: datetime
        source: system
        description: Logical-clock instant at which the application row was first created; unchanged by resubmission.
      - name: effective_priority_at
        type: datetime
        source: computed
        description: Backdated priority instant produced by calculations.brand_priority_ranking.
      - name: correction_rounds
        type: integer
        source: system
        description: Number of times the application has been returned for correction.
        default: 0
      - name: status
        type: enum
        source: system
        description: Lifecycle state; see state_machines.BrandApplication.
        default: SUBMITTED
        constraints: "one of {SUBMITTED, UNDER_EXAMINATION, RETURNED_FOR_CORRECTION, CONFLICT_HOLD, RECORDED, REJECTED}"
      - name: examined_by_user_id
        type: string
        source: system
        description: X-User-ID of the BrandRecorder who most recently began examination of this application.
        default: null
      - name: recorded_by_user_id
        type: string
        source: system
        description: X-User-ID of the BrandRecorder who recorded this application; segregation of duties requires it to differ from examined_by_user_id.
        default: null
      - name: assessed_filing_fee_cents
        type: integer
        source: computed
        description: Filing fee stamped at creation; flat NEW_FILING_FEE_CENTS for NEW/TRANSFER, calculations.renewal_filing_fee for RENEWAL.
        default: 0
      - name: rejection_reason
        type: string
        source: input
        description: Free-text reason captured when a recorder rejects the application.
        default: null

  - name: BrandRegistration
    parent: null
    common_fields: true
    fields:
      - name: owner_id
        type: string
        source: input
        description: "FK -> Owner.id; the recorded brand holder."
      - name: source_application_id
        type: string
        source: input
        description: "FK -> BrandApplication.id; the filing that produced this record."
      - name: brand_symbol
        type: string
        source: computed
        description: Copied from the source application at recording.
      - name: position_code
        type: enum
        source: computed
        description: Copied from the source application at recording.
        constraints: "one of {LEFT_RIB, RIGHT_RIB, LEFT_HIP, RIGHT_HIP, LEFT_SHOULDER, RIGHT_SHOULDER}"
      - name: species_class
        type: enum
        source: computed
        description: Copied from the source application at recording.
        constraints: "one of {CATTLE, HORSE, SHEEP}"
      - name: state_code
        type: string
        source: computed
        description: Copied from the source application at recording; conflict groups are keyed on (state_code, brand_symbol, position_code, species_class).
      - name: recorded_at
        type: datetime
        source: system
        description: Logical-clock instant at which the record was created.
      - name: expires_on
        type: datetime
        source: computed
        description: recorded_at plus REGISTRATION_TERM_DAYS.
      - name: effective_priority_at
        type: datetime
        source: computed
        description: Copied from the source application's effective_priority_at at recording.
      - name: priority_rank
        type: integer
        source: computed
        description: 1-based recording priority within the conflict group, produced by calculations.brand_priority_ranking.
        default: 1
      - name: status
        type: enum
        source: system
        description: Lifecycle state; see state_machines.BrandRegistration.
        default: ACTIVE
        constraints: "one of {ACTIVE, GRACE, ENCUMBERED, LAPSED, SUPERSEDED, REVOKED}"
      - name: superseded_by_registration_id
        type: string
        source: system
        description: "FK -> BrandRegistration.id; set on the old record when a renewal is recorded over it."
        default: null
      - name: encumbrance_count
        type: integer
        source: computed
        description: Number of TheftInvestigations with this brand_registration_id whose status IN {OPENED, REFERRED}.
        default: 0

  - name: BrandConflictClaim
    parent: null
    common_fields: true
    fields:
      - name: claimant_owner_id
        type: string
        source: input
        description: "FK -> Owner.id; the owner contesting the respondent record."
      - name: respondent_registration_id
        type: string
        source: input
        description: "FK -> BrandRegistration.id; the recorded brand being contested."
      - name: contested_application_id
        type: string
        source: input
        description: "FK -> BrandApplication.id; the claimant's own filing that the respondent record blocks; null when the claimant has no pending filing."
        default: null
      - name: grounds
        type: enum
        source: input
        description: Statutory ground for the conflict claim.
        constraints: "one of {PRIOR_USE, DECEPTIVE_SIMILARITY, RECORDING_ERROR}"
      - name: status
        type: enum
        source: system
        description: Lifecycle state; see state_machines.BrandConflictClaim.
        default: FILED
        constraints: "one of {FILED, UNDER_ADJUDICATION, SUSTAINED, DISMISSED}"
      - name: decision_note
        type: string
        source: input
        description: Recorder's written decision rationale, captured at decide time.
        default: null

  - name: InspectionOrder
    parent: null
    common_fields: true
    fields:
      - name: owner_id
        type: string
        source: input
        description: "FK -> Owner.id; the party presenting livestock for inspection and liable for the fee."
      - name: territory_id
        type: string
        source: input
        description: "FK -> Territory.id; the district the inspection takes place in."
      - name: inspector_id
        type: string
        source: system
        description: "FK -> Inspector.id; assigned at scheduling, cleared when the order is returned to REQUESTED."
        default: null
      - name: remittance_id
        type: string
        source: system
        description: "FK -> FeeRemittance.id; stamped when a remittance fully settles this order's fee."
        default: null
      - name: inspection_purpose
        type: enum
        source: input
        description: Statutory occasion for the inspection.
        constraints: "one of {SALE, MOVEMENT, SLAUGHTER}"
      - name: requested_window_start_at
        type: datetime
        source: input
        description: Earliest instant the owner will present livestock.
      - name: requested_window_end_at
        type: datetime
        source: input
        description: Latest instant the owner will present livestock; must be strictly after requested_window_start_at.
      - name: scheduled_start_at
        type: datetime
        source: system
        description: Assigned window start, half-open interval start; null while unscheduled.
        default: null
      - name: scheduled_end_at
        type: datetime
        source: system
        description: Assigned window end, half-open interval end; null while unscheduled.
        default: null
      - name: schedule_status
        type: enum
        source: system
        description: Scheduling dimension of the order; evolves independently of fee_status.
        default: REQUESTED
        constraints: "one of {REQUESTED, SCHEDULED, IN_FIELD, COMPLETED, CANCELLED}"
      - name: fee_status
        type: enum
        source: system
        description: Fee dimension of the order; evolves independently of schedule_status.
        default: UNASSESSED
        constraints: "one of {UNASSESSED, ASSESSED, DELINQUENT, REMITTED, WAIVED}"
      - name: assessed_fee_cents
        type: integer
        source: computed
        description: Output of calculations.inspection_fee_assessment, stamped at completion and zeroed by void-assessment.
        default: 0
      - name: fee_due_on
        type: datetime
        source: computed
        description: Completion instant plus FEE_DUE_DAYS; null while fee_status == UNASSESSED.
        default: null
      - name: hold_flag
        type: boolean
        source: system
        description: True while an open TheftInvestigation exists on any of this order's lots; blocks waive, void and remittance coverage.
        default: false
      - name: head_count_presented
        type: integer
        source: computed
        description: "Sum of AnimalLot.head_count over this order's lots whose lot_status IN {PRESENTED, VERIFIED, HELD}."
        default: 0

  - name: AnimalLot
    parent: InspectionOrder
    common_fields: true
    fields:
      - name: inspection_order_id
        type: string
        source: input
        description: "FK -> InspectionOrder.id; the order this lot was presented under."
      - name: brand_registration_id
        type: string
        source: input
        description: "FK -> BrandRegistration.id; the recorded brand the inspector read on the lot; null when no legible recorded brand is present."
        default: null
      - name: bill_of_sale_id
        type: string
        source: input
        description: "FK -> BillOfSale.id; the ownership document tendered for this lot; null when none was tendered."
        default: null
      - name: species_class
        type: enum
        source: input
        description: Species class of the head in this lot.
        constraints: "one of {CATTLE, HORSE, SHEEP}"
      - name: head_count
        type: integer
        source: input
        description: Number of head in this lot.
        constraints: ">= 1"
      - name: earmark_code
        type: string
        source: input
        description: Secondary earmark or tag notation read in the field.
        default: null
      - name: lot_status
        type: enum
        source: system
        description: Physical disposition of the lot within the order.
        default: PRESENTED
        constraints: "one of {PRESENTED, VERIFIED, HELD, VOIDED}"
      - name: match_status
        type: enum
        source: system
        description: Ownership-verification outcome for the lot.
        default: UNCHECKED
        constraints: "one of {UNCHECKED, MATCHED, MISMATCHED, UNMATCHED, UNVERIFIABLE}"
      - name: disposition
        type: enum
        source: system
        description: Statutory follow-up triggered by the finding.
        default: NONE
        constraints: "one of {NONE, CLEARED, ESTRAY_HOLD, THEFT_REFERRAL}"

  - name: BillOfSale
    parent: null
    common_fields: false
    fields:
      - name: seller_owner_id
        type: string
        source: input
        description: "FK -> Owner.id; the seller named on the instrument."
      - name: buyer_owner_id
        type: string
        source: input
        description: "FK -> Owner.id; the buyer named on the instrument."
      - name: document_number
        type: string
        source: input
        description: Instrument number printed on the bill of sale.
        constraints: "unique across all BillOfSale rows"
      - name: sale_date
        type: datetime
        source: input
        description: Date of sale printed on the instrument.
      - name: head_count
        type: integer
        source: input
        description: Head count declared on the instrument.
        constraints: ">= 1"
      - name: species_class
        type: enum
        source: input
        description: Species class declared on the instrument.
        constraints: "one of {CATTLE, HORSE, SHEEP}"
      - name: brand_symbol_declared
        type: string
        source: input
        description: Brand symbol transcribed onto the instrument by the seller.
        default: null

  - name: EstrayCase
    parent: null
    common_fields: true
    fields:
      - name: animal_lot_id
        type: string
        source: system
        description: "FK -> AnimalLot.id; the unidentified lot that was impounded."
      - name: territory_id
        type: string
        source: system
        description: "FK -> Territory.id; the district impound facility holding the head."
      - name: claimant_owner_id
        type: string
        source: system
        description: "FK -> Owner.id; the owner whose claim is on file; null until a claim is filed and cleared again when a claim is denied."
        default: null
      - name: head_count
        type: integer
        source: system
        description: Head count copied from the impounded AnimalLot.
      - name: impounded_at
        type: datetime
        source: system
        description: Logical-clock instant of impound; start of the half-open occupancy interval.
      - name: statutory_release_on
        type: datetime
        source: computed
        description: impounded_at plus STATUTORY_HOLD_DAYS; end of the projected occupancy interval and the earliest instant an auction may be scheduled.
      - name: status
        type: enum
        source: system
        description: Lifecycle state; see state_machines.EstrayCase.
        default: IMPOUNDED
        constraints: "one of {IMPOUNDED, CLAIM_FILED, AUCTION_SCHEDULED, SOLD, RELEASED_TO_CLAIMANT, PROCEEDS_DISBURSED, FORFEITED_TO_BOARD}"
      - name: estimated_gross_cents
        type: integer
        source: input
        description: Auctioneer's estimate supplied when the auction is scheduled; drives the PROVISIONAL distribution variant.
        default: null
      - name: gross_proceeds_cents
        type: integer
        source: input
        description: Hammer price recorded at sale; drives the FINAL distribution variant.
        default: null
      - name: sale_at
        type: datetime
        source: system
        description: Logical-clock instant the sale was recorded; null before sale.
        default: null
      - name: care_cost_cents
        type: integer
        source: computed
        description: First bucket of calculations.estray_proceeds_distribution.
        default: 0
      - name: handling_fee_cents
        type: integer
        source: computed
        description: Second bucket of calculations.estray_proceeds_distribution.
        default: 0
      - name: claimant_residual_cents
        type: integer
        source: computed
        description: Third bucket of calculations.estray_proceeds_distribution.
        default: 0
      - name: board_forfeiture_cents
        type: integer
        source: computed
        description: Residual retained by the board when the case terminates without a claimant; 0 otherwise.
        default: 0
      - name: distribution_variant
        type: enum
        source: computed
        description: Which variant of calculations.estray_proceeds_distribution last wrote the bucket fields.
        default: NONE
        constraints: "one of {NONE, PROVISIONAL, FINAL}"
      - name: claim_denied_count
        type: integer
        source: system
        description: Number of times a filed claim has been denied on this case.
        default: 0

  - name: TheftInvestigation
    parent: null
    common_fields: true
    fields:
      - name: animal_lot_id
        type: string
        source: system
        description: "FK -> AnimalLot.id; the lot whose brand read did not match its papers."
      - name: brand_registration_id
        type: string
        source: system
        description: "FK -> BrandRegistration.id; the recorded brand read on the lot, encumbered while the investigation is open."
      - name: opened_at
        type: datetime
        source: system
        description: Logical-clock instant the investigation was opened by cascade.
      - name: status
        type: enum
        source: system
        description: Lifecycle state; see state_machines.TheftInvestigation.
        default: OPENED
        constraints: "one of {OPENED, REFERRED, CLOSED}"
      - name: outcome
        type: enum
        source: system
        description: Adjudicated finding recorded at close.
        default: PENDING
        constraints: "one of {PENDING, SUBSTANTIATED, UNFOUNDED}"
      - name: referral_agency
        type: string
        source: input
        description: Law-enforcement agency the case was referred to.
        default: null
      - name: reopen_count
        type: integer
        source: system
        description: Number of times this investigation has been reopened after close.
        default: 0
      - name: opened_by_user_id
        type: string
        source: system
        description: X-User-ID of the FieldInspector whose finding opened the investigation.
        default: null
      - name: closed_by_user_id
        type: string
        source: system
        description: X-User-ID of the TheftInvestigator who closed the investigation.
        default: null

  - name: FeeRemittance
    parent: null
    common_fields: true
    fields:
      - name: owner_id
        type: string
        source: input
        description: "FK -> Owner.id; the remitting owner."
      - name: amount_cents
        type: integer
        source: input
        description: Cumulative tendered amount; increased by top-up.
        constraints: "> 0"
      - name: covered_order_ids
        type: array
        source: input
        description: Ordered list of InspectionOrder.id values this remittance is offered against; the waterfall re-sorts them by fee_due_on ASC then created_at ASC.
      - name: status
        type: enum
        source: system
        description: Lifecycle state; see state_machines.FeeRemittance.
        default: SUBMITTED
        constraints: "one of {SUBMITTED, RECONCILED, SHORT_PAID}"
      - name: applied_cents
        type: integer
        source: computed
        description: Cumulative amount consumed by fully settled orders across all reconcile passes.
        default: 0
      - name: shortfall_cents
        type: integer
        source: computed
        description: Amount still owed on the covered orders after the most recent reconcile pass.
        default: 0

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: BrandApplication
    dimension: status
    initial_state: SUBMITTED
    terminal_states: [RECORDED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: UNDER_EXAMINATION
        trigger: "POST /brand-inspection/brand-applications/{id}/begin-examination"
        actor: BrandRecorder
        preconditions:
          - "application.status == SUBMITTED"
        side_effects:
          - "application.examined_by_user_id = X-User-ID of the calling BrandRecorder"
          - "application.version += 1"
      - from: UNDER_EXAMINATION
        to: RETURNED_FOR_CORRECTION
        trigger: "POST /brand-inspection/brand-applications/{id}/return"
        actor: BrandRecorder
        preconditions:
          - "application.status == UNDER_EXAMINATION"
          - "application.correction_rounds < MAX_CORRECTION_ROUNDS (2)"
        side_effects:
          - "application.correction_rounds += 1"
        note: "Rounds 1 and 2 return the filing to the applicant."
      - from: UNDER_EXAMINATION
        to: REJECTED
        trigger: "POST /brand-inspection/brand-applications/{id}/return"
        actor: BrandRecorder
        preconditions:
          - "application.status == UNDER_EXAMINATION"
          - "application.correction_rounds >= MAX_CORRECTION_ROUNDS (2)"
        side_effects:
          - "application.correction_rounds += 1 (reaching 3)"
          - "application.rejection_reason = 'MAX_CORRECTION_ROUNDS_EXHAUSTED'"
        note: "Boundary: the third return terminates the filing instead of returning it. correction_rounds == 2 is the exact breakpoint."
      - from: RETURNED_FOR_CORRECTION
        to: SUBMITTED
        trigger: "POST /brand-inspection/brand-applications/{id}/resubmit"
        actor: LivestockOwner
        preconditions:
          - "application.status == RETURNED_FOR_CORRECTION"
          - "X-User-ID == application.owner_id"
        side_effects:
          - "brand_symbol, position_code, species_class, documented_prior_use_years and prior_use_affidavit_on_file are overwritten from the payload when supplied"
          - "application.effective_priority_at recomputed by calculations.brand_priority_ranking"
          - "application.original_filed_at is NOT changed"
        note: "Cycle: examination may return the filing again, up to MAX_CORRECTION_ROUNDS."
      - from: UNDER_EXAMINATION
        to: RECORDED
        trigger: "POST /brand-inspection/brand-applications/{id}/record"
        actor: BrandRecorder
        preconditions:
          - "application.status == UNDER_EXAMINATION"
          - "X-User-ID != application.examined_by_user_id (segregation of duties)"
          - "no BrandRegistration with status IN {ACTIVE, GRACE} in the conflict group (state_code, brand_symbol, position_code, species_class), owned by an Owner other than application.owner_id, outranks the filing under calculations.brand_priority_ranking"
          - "when application.application_type == RENEWAL: prior_registration.status IN {ACTIVE, GRACE}"
        side_effects:
          - "application.recorded_by_user_id = X-User-ID"
          - "a BrandRegistration row is created with status ACTIVE, recorded_at = logical clock, expires_on = recorded_at + REGISTRATION_TERM_DAYS, effective_priority_at copied from the application"
          - "priority_rank recomputed by calculations.brand_priority_ranking for every BrandRegistration in the conflict group with status IN {ACTIVE, GRACE}, processed effective_priority_at ASC then correction_rounds ASC then created_at ASC"
          - "when application_type == RENEWAL: prior_registration.status -> SUPERSEDED and prior_registration.superseded_by_registration_id = new registration id"
      - from: UNDER_EXAMINATION
        to: REJECTED
        trigger: "POST /brand-inspection/brand-applications/{id}/reject"
        actor: BrandRecorder
        preconditions:
          - "application.status == UNDER_EXAMINATION"
        side_effects:
          - "application.rejection_reason = payload.rejection_reason"
      - from: CONFLICT_HOLD
        to: REJECTED
        trigger: "POST /brand-inspection/brand-applications/{id}/reject"
        actor: BrandRecorder
        preconditions:
          - "application.status == CONFLICT_HOLD"
        side_effects:
          - "application.rejection_reason = payload.rejection_reason"
      - from: SUBMITTED
        to: CONFLICT_HOLD
        trigger: "system cascade, hop 4 of the theft cascade: prior_registration became ENCUMBERED"
        actor: system
        preconditions:
          - "application.prior_registration_id == the registration that just became ENCUMBERED"
          - "application.status IN {SUBMITTED, UNDER_EXAMINATION}"
        side_effects:
          - "application.version += 1"
      - from: UNDER_EXAMINATION
        to: CONFLICT_HOLD
        trigger: "system cascade, hop 4 of the theft cascade: prior_registration became ENCUMBERED"
        actor: system
        preconditions:
          - "application.prior_registration_id == the registration that just became ENCUMBERED"
          - "application.status IN {SUBMITTED, UNDER_EXAMINATION}"
        side_effects:
          - "application.version += 1"
      - from: CONFLICT_HOLD
        to: UNDER_EXAMINATION
        trigger: "system cascade from POST /brand-inspection/theft-investigations/{id}/close with outcome UNFOUNDED"
        actor: system
        preconditions:
          - "prior_registration.encumbrance_count reaches 0 and prior_registration.status returns to ACTIVE"
        side_effects:
          - "application.version += 1"
        note: "All released filings land in UNDER_EXAMINATION regardless of which state they were held from."
      - from: SUBMITTED
        to: REJECTED
        trigger: "system cascade from POST /brand-inspection/brand-registrations/{id}/renewal-applications: a later renewal filing supersedes this one"
        actor: system
        preconditions:
          - "application.application_type == RENEWAL"
          - "application.prior_registration_id == the registration the new filing was lodged against"
          - "application.status IN {SUBMITTED, UNDER_EXAMINATION, RETURNED_FOR_CORRECTION, CONFLICT_HOLD}"
        side_effects:
          - "application.rejection_reason = 'SUPERSEDED_BY_LATER_RENEWAL'"
        note: "This is the legitimate supersede that concurrency_rules.renewal-application-stale-registration guards with OCC."
      - from: UNDER_EXAMINATION
        to: REJECTED
        trigger: "system cascade from POST /brand-inspection/brand-registrations/{id}/renewal-applications: a later renewal filing supersedes this one"
        actor: system
        preconditions:
          - "application.application_type == RENEWAL"
          - "application.prior_registration_id == the registration the new filing was lodged against"
          - "application.status IN {SUBMITTED, UNDER_EXAMINATION, RETURNED_FOR_CORRECTION, CONFLICT_HOLD}"
        side_effects:
          - "application.rejection_reason = 'SUPERSEDED_BY_LATER_RENEWAL'"
      - from: RETURNED_FOR_CORRECTION
        to: REJECTED
        trigger: "system cascade from POST /brand-inspection/brand-registrations/{id}/renewal-applications or from the LAPSED sweep"
        actor: system
        preconditions:
          - "application.application_type == RENEWAL"
          - "application.status == RETURNED_FOR_CORRECTION"
        side_effects:
          - "application.rejection_reason = 'SUPERSEDED_BY_LATER_RENEWAL' or 'PRIOR_REGISTRATION_LAPSED'"
      - from: SUBMITTED
        to: REJECTED
        trigger: "system cascade from POST /brand-inspection/_ops/delinquency-sweep when prior_registration reaches LAPSED"
        actor: system
        preconditions:
          - "application.application_type == RENEWAL"
          - "application.prior_registration_id == the registration that just reached LAPSED"
          - "application.status IN {SUBMITTED, UNDER_EXAMINATION, RETURNED_FOR_CORRECTION, CONFLICT_HOLD}"
        side_effects:
          - "application.rejection_reason = 'PRIOR_REGISTRATION_LAPSED'"

  - entity: BrandRegistration
    dimension: status
    initial_state: ACTIVE
    terminal_states: [LAPSED, SUPERSEDED, REVOKED]
    transitions:
      - from: ACTIVE
        to: GRACE
        trigger: "POST /brand-inspection/_ops/delinquency-sweep"
        actor: FeeAdministrator
        preconditions:
          - "registration.status == ACTIVE"
          - "logical_clock >= registration.expires_on"
        side_effects:
          - "registration.version += 1"
      - from: GRACE
        to: LAPSED
        trigger: "POST /brand-inspection/_ops/delinquency-sweep"
        actor: FeeAdministrator
        preconditions:
          - "registration.status == GRACE"
          - "logical_clock > registration.expires_on + LAPSE_RECOVERY_DAYS (90 days)"
        side_effects:
          - "every BrandApplication with prior_registration_id == registration.id and status IN {SUBMITTED, UNDER_EXAMINATION, RETURNED_FOR_CORRECTION, CONFLICT_HOLD} -> REJECTED with rejection_reason 'PRIOR_REGISTRATION_LAPSED'"
      - from: ACTIVE
        to: ENCUMBERED
        trigger: "system cascade, hop 3 of the theft cascade: a TheftInvestigation was opened against this registration"
        actor: system
        preconditions:
          - "registration.status IN {ACTIVE, GRACE}"
        side_effects:
          - "registration.encumbrance_count += 1"
          - "hop 4: every BrandApplication with prior_registration_id == registration.id and status IN {SUBMITTED, UNDER_EXAMINATION} -> CONFLICT_HOLD, processed created_at ASC"
      - from: GRACE
        to: ENCUMBERED
        trigger: "system cascade, hop 3 of the theft cascade: a TheftInvestigation was opened against this registration"
        actor: system
        preconditions:
          - "registration.status IN {ACTIVE, GRACE}"
        side_effects:
          - "registration.encumbrance_count += 1"
          - "hop 4: every BrandApplication with prior_registration_id == registration.id and status IN {SUBMITTED, UNDER_EXAMINATION} -> CONFLICT_HOLD, processed created_at ASC"
      - from: ENCUMBERED
        to: ACTIVE
        trigger: "system cascade from POST /brand-inspection/theft-investigations/{id}/close with outcome UNFOUNDED"
        actor: system
        preconditions:
          - "registration.encumbrance_count reaches 0 after the decrement"
        side_effects:
          - "every BrandApplication with prior_registration_id == registration.id and status == CONFLICT_HOLD -> UNDER_EXAMINATION, processed created_at ASC"
      - from: ENCUMBERED
        to: REVOKED
        trigger: "system cascade from POST /brand-inspection/theft-investigations/{id}/close with outcome SUBSTANTIATED"
        actor: system
        preconditions:
          - "investigation.brand_registration_id == registration.id"
        side_effects:
          - "every AnimalLot with brand_registration_id == registration.id and lot_status == PRESENTED -> match_status UNVERIFIABLE, processed created_at ASC"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system cascade from POST /brand-inspection/brand-applications/{id}/record on a RENEWAL filing"
        actor: system
        preconditions:
          - "registration.status IN {ACTIVE, GRACE}"
          - "registration.id == application.prior_registration_id"
        side_effects:
          - "registration.superseded_by_registration_id = the newly recorded registration id"
      - from: GRACE
        to: SUPERSEDED
        trigger: "system cascade from POST /brand-inspection/brand-applications/{id}/record on a RENEWAL filing"
        actor: system
        preconditions:
          - "registration.status IN {ACTIVE, GRACE}"
          - "registration.id == application.prior_registration_id"
        side_effects:
          - "registration.superseded_by_registration_id = the newly recorded registration id"
      - from: ACTIVE
        to: REVOKED
        trigger: "system cascade, hop 1 of the conflict cascade: POST /brand-inspection/brand-conflict-claims/{id}/decide with decision SUSTAIN"
        actor: system
        preconditions:
          - "registration.status IN {ACTIVE, GRACE, ENCUMBERED}"
          - "registration.id == claim.respondent_registration_id"
        side_effects:
          - "hop 2: every AnimalLot with brand_registration_id == registration.id and lot_status == PRESENTED -> match_status UNVERIFIABLE, processed created_at ASC"
          - "hop 3: every InspectionOrder that parents one of those lots and has schedule_status IN {SCHEDULED, IN_FIELD} -> schedule_status REQUESTED, inspector_id = null, scheduled_start_at = null, scheduled_end_at = null, and that Inspector.version += 1 (window released), processed created_at ASC"
      - from: ENCUMBERED
        to: REVOKED
        trigger: "system cascade, hop 1 of the conflict cascade: POST /brand-inspection/brand-conflict-claims/{id}/decide with decision SUSTAIN"
        actor: system
        preconditions:
          - "registration.status IN {ACTIVE, GRACE, ENCUMBERED}"
          - "registration.id == claim.respondent_registration_id"
        side_effects:
          - "hop 2: every AnimalLot with brand_registration_id == registration.id and lot_status == PRESENTED -> match_status UNVERIFIABLE, processed created_at ASC"
          - "hop 3: every InspectionOrder that parents one of those lots and has schedule_status IN {SCHEDULED, IN_FIELD} -> schedule_status REQUESTED, inspector_id = null, scheduled_start_at = null, scheduled_end_at = null, and that Inspector.version += 1 (window released), processed created_at ASC"

  - entity: InspectionOrder
    dimension: schedule_status
    initial_state: REQUESTED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: SCHEDULED
        trigger: "POST /brand-inspection/inspection-orders/{id}/schedule"
        actor: BoardAdmin
        preconditions:
          - "order.schedule_status == REQUESTED"
          - "order.owner.standing == GOOD"
          - "inspector.status == ACTIVE and inspector.certification_expires_on > scheduled_end_at"
          - "inspector's home district and the order's district share the same state_code"
          - "payload.expected_inspector_version == inspector.version"
          - "requested window contains the scheduled window: scheduled_start_at >= requested_window_start_at and scheduled_end_at <= requested_window_end_at"
          - "no InspectionOrder overlap on this inspector per validations[priority=66]"
          - "inspector's assignment count on the UTC calendar date of scheduled_start_at < inspector.max_daily_assignments"
        side_effects:
          - "order.inspector_id, scheduled_start_at, scheduled_end_at set from payload"
          - "inspector.version += 1"
          - "inspector.active_assignment_count recomputed"
      - from: SCHEDULED
        to: REQUESTED
        trigger: "system cascade, hop 3 of the conflict cascade (respondent registration REVOKED -> lots UNVERIFIABLE -> orders unscheduled)"
        actor: system
        preconditions:
          - "order.schedule_status == SCHEDULED"
          - "order parents at least one AnimalLot whose match_status just became UNVERIFIABLE"
        side_effects:
          - "order.inspector_id = null, scheduled_start_at = null, scheduled_end_at = null"
          - "that Inspector.version += 1 and active_assignment_count recomputed"
      - from: IN_FIELD
        to: REQUESTED
        trigger: "system cascade, hop 3 of the conflict cascade (respondent registration REVOKED -> lots UNVERIFIABLE -> orders unscheduled)"
        actor: system
        preconditions:
          - "order.schedule_status == IN_FIELD"
          - "order parents at least one AnimalLot whose match_status just became UNVERIFIABLE"
        side_effects:
          - "order.inspector_id = null, scheduled_start_at = null, scheduled_end_at = null"
          - "that Inspector.version += 1 and active_assignment_count recomputed"
        note: "Field work on a revoked brand record is aborted and the order returns to the request queue."
      - from: SCHEDULED
        to: IN_FIELD
        trigger: "POST /brand-inspection/inspection-orders/{id}/begin"
        actor: FieldInspector
        preconditions:
          - "order.schedule_status == SCHEDULED"
          - "X-User-ID == order.inspector_id"
          - "inspector.status == ACTIVE"
        side_effects:
          - "order.version += 1"
      - from: IN_FIELD
        to: COMPLETED
        trigger: "POST /brand-inspection/inspection-orders/{id}/complete"
        actor: FieldInspector
        preconditions:
          - "order.schedule_status == IN_FIELD"
          - "X-User-ID == order.inspector_id"
          - "every AnimalLot of this order with lot_status != VOIDED has match_status != UNCHECKED"
        side_effects:
          - "order.head_count_presented recomputed"
          - "fee dimension advances UNASSESSED -> ASSESSED with assessed_fee_cents from calculations.inspection_fee_assessment and fee_due_on = logical_clock + FEE_DUE_DAYS"
          - "owner.projected_arrears_cents recomputed by calculations.owner_arrears_and_standing"
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /brand-inspection/inspection-orders/{id}/cancel"
        actor: LivestockOwner
        preconditions:
          - "order.schedule_status IN {REQUESTED, SCHEDULED}"
          - "X-User-ID == order.owner_id"
        side_effects:
          - "every AnimalLot of this order -> lot_status VOIDED"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /brand-inspection/inspection-orders/{id}/cancel"
        actor: LivestockOwner
        preconditions:
          - "order.schedule_status IN {REQUESTED, SCHEDULED}"
          - "X-User-ID == order.owner_id"
        side_effects:
          - "every AnimalLot of this order -> lot_status VOIDED"
          - "order.inspector_id = null, scheduled_start_at = null, scheduled_end_at = null, that Inspector.version += 1"

  - entity: InspectionOrder
    dimension: fee_status
    initial_state: UNASSESSED
    terminal_states: [REMITTED, WAIVED]
    transitions:
      - from: UNASSESSED
        to: ASSESSED
        trigger: "POST /brand-inspection/inspection-orders/{id}/complete"
        actor: FieldInspector
        preconditions:
          - "order.fee_status == UNASSESSED"
          - "order.schedule_status transitions IN_FIELD -> COMPLETED in the same request"
        side_effects:
          - "order.assessed_fee_cents = calculations.inspection_fee_assessment"
          - "order.fee_due_on = logical_clock + FEE_DUE_DAYS"
          - "owner.projected_arrears_cents recomputed"
      - from: ASSESSED
        to: DELINQUENT
        trigger: "POST /brand-inspection/_ops/delinquency-sweep"
        actor: FeeAdministrator
        preconditions:
          - "order.fee_status == ASSESSED"
          - "order.fee_due_on <= logical_clock"
        side_effects:
          - "owner.posted_arrears_cents and owner.standing recomputed by calculations.owner_arrears_and_standing"
      - from: ASSESSED
        to: REMITTED
        trigger: "POST /brand-inspection/fee-remittances/{id}/reconcile"
        actor: FeeAdministrator
        preconditions:
          - "order.fee_status IN {ASSESSED, DELINQUENT}"
          - "order.hold_flag == false"
          - "the waterfall in calculations.remittance_waterfall_application fully covers this order"
        side_effects:
          - "order.remittance_id = remittance.id"
          - "owner.posted_arrears_cents, projected_arrears_cents and standing recomputed"
      - from: DELINQUENT
        to: REMITTED
        trigger: "POST /brand-inspection/fee-remittances/{id}/reconcile"
        actor: FeeAdministrator
        preconditions:
          - "order.fee_status IN {ASSESSED, DELINQUENT}"
          - "order.hold_flag == false"
          - "the waterfall in calculations.remittance_waterfall_application fully covers this order"
        side_effects:
          - "order.remittance_id = remittance.id"
          - "owner.posted_arrears_cents, projected_arrears_cents and standing recomputed"
      - from: ASSESSED
        to: WAIVED
        trigger: "POST /brand-inspection/inspection-orders/{id}/waive-fee"
        actor: FeeAdministrator
        preconditions:
          - "order.fee_status IN {ASSESSED, DELINQUENT}"
          - "order.hold_flag == false"
        side_effects:
          - "owner.posted_arrears_cents, projected_arrears_cents and standing recomputed"
      - from: DELINQUENT
        to: WAIVED
        trigger: "POST /brand-inspection/inspection-orders/{id}/waive-fee"
        actor: FeeAdministrator
        preconditions:
          - "order.fee_status IN {ASSESSED, DELINQUENT}"
          - "order.hold_flag == false"
        side_effects:
          - "owner.posted_arrears_cents, projected_arrears_cents and standing recomputed"
      - from: ASSESSED
        to: UNASSESSED
        trigger: "POST /brand-inspection/inspection-orders/{id}/void-assessment"
        actor: FeeAdministrator
        preconditions:
          - "order.fee_status IN {ASSESSED, DELINQUENT}"
          - "order.hold_flag == false"
        side_effects:
          - "order.assessed_fee_cents = 0 and order.fee_due_on = null"
          - "owner.posted_arrears_cents, projected_arrears_cents and standing recomputed"
        note: "Compensating action for the ASSESSED stamp; the fee-ledger invariant must return to its pre-assessment value."
      - from: DELINQUENT
        to: UNASSESSED
        trigger: "POST /brand-inspection/inspection-orders/{id}/void-assessment"
        actor: FeeAdministrator
        preconditions:
          - "order.fee_status IN {ASSESSED, DELINQUENT}"
          - "order.hold_flag == false"
        side_effects:
          - "order.assessed_fee_cents = 0 and order.fee_due_on = null"
          - "owner.posted_arrears_cents, projected_arrears_cents and standing recomputed"

  - entity: EstrayCase
    dimension: status
    initial_state: IMPOUNDED
    terminal_states: [RELEASED_TO_CLAIMANT, PROCEEDS_DISBURSED, FORFEITED_TO_BOARD]
    transitions:
      - from: IMPOUNDED
        to: CLAIM_FILED
        trigger: "POST /brand-inspection/estray-cases/{id}/claim"
        actor: LivestockOwner
        preconditions:
          - "case.status == IMPOUNDED"
          - "logical_clock < case.statutory_release_on"
        side_effects:
          - "case.claimant_owner_id = X-User-ID"
      - from: CLAIM_FILED
        to: IMPOUNDED
        trigger: "POST /brand-inspection/estray-cases/{id}/claim-decision with decision DENIED"
        actor: BoardAdmin
        preconditions:
          - "case.status == CLAIM_FILED"
        side_effects:
          - "case.claim_denied_count += 1"
          - "case.claimant_owner_id = null"
        note: "Cycle: the owner (or another owner) may file again while the statutory window is still open."
      - from: CLAIM_FILED
        to: RELEASED_TO_CLAIMANT
        trigger: "POST /brand-inspection/estray-cases/{id}/claim-decision with decision APPROVED"
        actor: BoardAdmin
        preconditions:
          - "case.status == CLAIM_FILED"
        side_effects:
          - "territory.impound_current_head -= case.head_count and territory.intake_status recomputed"
          - "the impounded AnimalLot -> lot_status VERIFIED, match_status MATCHED, disposition CLEARED"
      - from: IMPOUNDED
        to: AUCTION_SCHEDULED
        trigger: "POST /brand-inspection/estray-cases/{id}/schedule-auction"
        actor: BoardAdmin
        preconditions:
          - "case.status IN {IMPOUNDED, CLAIM_FILED}"
          - "logical_clock >= case.statutory_release_on"
        side_effects:
          - "case.estimated_gross_cents = payload.estimated_gross_cents"
          - "PROVISIONAL variant of calculations.estray_proceeds_distribution writes care_cost_cents, handling_fee_cents, claimant_residual_cents and sets distribution_variant = PROVISIONAL"
      - from: CLAIM_FILED
        to: AUCTION_SCHEDULED
        trigger: "POST /brand-inspection/estray-cases/{id}/schedule-auction"
        actor: BoardAdmin
        preconditions:
          - "case.status IN {IMPOUNDED, CLAIM_FILED}"
          - "logical_clock >= case.statutory_release_on"
        side_effects:
          - "case.estimated_gross_cents = payload.estimated_gross_cents"
          - "PROVISIONAL variant of calculations.estray_proceeds_distribution writes care_cost_cents, handling_fee_cents, claimant_residual_cents and sets distribution_variant = PROVISIONAL"
        note: "A pending claim does not stay the statutory auction; claimant_owner_id is carried forward."
      - from: AUCTION_SCHEDULED
        to: SOLD
        trigger: "POST /brand-inspection/estray-cases/{id}/record-sale"
        actor: BoardAdmin
        preconditions:
          - "case.status == AUCTION_SCHEDULED"
        side_effects:
          - "case.gross_proceeds_cents = payload.gross_proceeds_cents and case.sale_at = logical_clock"
          - "FINAL variant of calculations.estray_proceeds_distribution overwrites care_cost_cents, handling_fee_cents, claimant_residual_cents and sets distribution_variant = FINAL"
      - from: SOLD
        to: PROCEEDS_DISBURSED
        trigger: "POST /brand-inspection/estray-cases/{id}/disburse"
        actor: FeeAdministrator
        preconditions:
          - "case.status == SOLD"
          - "case.claimant_owner_id != null"
        side_effects:
          - "case.board_forfeiture_cents = 0"
          - "territory.impound_current_head -= case.head_count and territory.intake_status recomputed"
          - "the impounded AnimalLot -> lot_status VERIFIED, disposition CLEARED"
      - from: SOLD
        to: FORFEITED_TO_BOARD
        trigger: "POST /brand-inspection/estray-cases/{id}/disburse"
        actor: FeeAdministrator
        preconditions:
          - "case.status == SOLD"
          - "case.claimant_owner_id == null"
        side_effects:
          - "case.board_forfeiture_cents = case.gross_proceeds_cents - case.care_cost_cents - case.handling_fee_cents and case.claimant_residual_cents = 0"
          - "territory.impound_current_head -= case.head_count and territory.intake_status recomputed"
          - "the impounded AnimalLot -> lot_status VERIFIED, disposition CLEARED"

  - entity: TheftInvestigation
    dimension: status
    initial_state: OPENED
    terminal_states: []
    transitions:
      - from: OPENED
        to: REFERRED
        trigger: "POST /brand-inspection/theft-investigations/{id}/refer"
        actor: TheftInvestigator
        preconditions:
          - "investigation.status == OPENED"
        side_effects:
          - "investigation.referral_agency = payload.referral_agency"
      - from: OPENED
        to: CLOSED
        trigger: "POST /brand-inspection/theft-investigations/{id}/close"
        actor: TheftInvestigator
        preconditions:
          - "investigation.status IN {OPENED, REFERRED}"
        side_effects:
          - "investigation.outcome = payload.outcome and investigation.closed_by_user_id = X-User-ID"
          - "registration.encumbrance_count -= 1"
          - "when outcome == UNFOUNDED and encumbrance_count reaches 0: registration ENCUMBERED -> ACTIVE and every CONFLICT_HOLD application on it -> UNDER_EXAMINATION"
          - "when outcome == SUBSTANTIATED: registration -> REVOKED and every AnimalLot with that brand_registration_id and lot_status == PRESENTED -> match_status UNVERIFIABLE"
          - "the lot's parent InspectionOrder.hold_flag = false when no OPENED or REFERRED investigation remains on any of its lots"
      - from: REFERRED
        to: CLOSED
        trigger: "POST /brand-inspection/theft-investigations/{id}/close"
        actor: TheftInvestigator
        preconditions:
          - "investigation.status IN {OPENED, REFERRED}"
        side_effects:
          - "investigation.outcome = payload.outcome and investigation.closed_by_user_id = X-User-ID"
          - "registration.encumbrance_count -= 1"
          - "when outcome == UNFOUNDED and encumbrance_count reaches 0: registration ENCUMBERED -> ACTIVE and every CONFLICT_HOLD application on it -> UNDER_EXAMINATION"
          - "when outcome == SUBSTANTIATED: registration -> REVOKED and every AnimalLot with that brand_registration_id and lot_status == PRESENTED -> match_status UNVERIFIABLE"
          - "the lot's parent InspectionOrder.hold_flag = false when no OPENED or REFERRED investigation remains on any of its lots"
      - from: CLOSED
        to: OPENED
        trigger: "POST /brand-inspection/theft-investigations/{id}/reopen"
        actor: TheftInvestigator
        preconditions:
          - "investigation.status == CLOSED"
          - "investigation.reopen_count < MAX_REOPENS (1)"
          - "registration.status IN {ACTIVE, GRACE, ENCUMBERED}"
        side_effects:
          - "investigation.reopen_count += 1 and investigation.outcome = PENDING"
          - "registration.encumbrance_count += 1 and registration ACTIVE|GRACE -> ENCUMBERED"
          - "the lot's parent InspectionOrder.hold_flag = true"
        note: "Bounded cycle: after one reopen, CLOSED is effectively terminal."

  - entity: BrandConflictClaim
    dimension: status
    initial_state: FILED
    terminal_states: [SUSTAINED, DISMISSED]
    transitions:
      - from: FILED
        to: UNDER_ADJUDICATION
        trigger: "POST /brand-inspection/brand-conflict-claims/{id}/adjudicate"
        actor: BrandRecorder
        preconditions:
          - "claim.status == FILED"
        side_effects:
          - "claim.version += 1"
      - from: UNDER_ADJUDICATION
        to: SUSTAINED
        trigger: "POST /brand-inspection/brand-conflict-claims/{id}/decide with decision SUSTAIN"
        actor: BrandRecorder
        preconditions:
          - "claim.status == UNDER_ADJUDICATION"
          - "respondent_registration.status IN {ACTIVE, GRACE, ENCUMBERED}"
        side_effects:
          - "claim.decision_note = payload.decision_note"
          - "hop 1: respondent_registration.status -> REVOKED"
          - "hop 2 (caused by hop 1): every AnimalLot with brand_registration_id == respondent_registration.id and lot_status == PRESENTED -> match_status UNVERIFIABLE, processed created_at ASC"
          - "hop 3 (caused by hop 2): every InspectionOrder parenting one of those lots with schedule_status IN {SCHEDULED, IN_FIELD} -> REQUESTED, inspector_id cleared, scheduled window cleared, Inspector.version += 1, processed created_at ASC"
      - from: UNDER_ADJUDICATION
        to: DISMISSED
        trigger: "POST /brand-inspection/brand-conflict-claims/{id}/decide with decision DISMISS"
        actor: BrandRecorder
        preconditions:
          - "claim.status == UNDER_ADJUDICATION"
        side_effects:
          - "claim.decision_note = payload.decision_note"
          - "respondent_registration is left untouched"

  - entity: FeeRemittance
    dimension: status
    initial_state: SUBMITTED
    terminal_states: [RECONCILED]
    transitions:
      - from: SUBMITTED
        to: RECONCILED
        trigger: "POST /brand-inspection/fee-remittances/{id}/reconcile"
        actor: FeeAdministrator
        preconditions:
          - "remittance.status == SUBMITTED"
          - "remittance.amount_cents <= remittance.applied_cents + covered_total_cents"
        side_effects:
          - "calculations.remittance_waterfall_application runs; shortfall_cents == 0"
          - "each fully covered InspectionOrder -> fee_status REMITTED with remittance_id stamped"
      - from: SUBMITTED
        to: SHORT_PAID
        trigger: "POST /brand-inspection/fee-remittances/{id}/reconcile"
        actor: FeeAdministrator
        preconditions:
          - "remittance.status == SUBMITTED"
          - "remittance.amount_cents <= remittance.applied_cents + covered_total_cents"
        side_effects:
          - "calculations.remittance_waterfall_application runs; shortfall_cents > 0"
          - "each fully covered InspectionOrder -> fee_status REMITTED with remittance_id stamped; the first uncoverable order and every order after it are left untouched"
      - from: SHORT_PAID
        to: SUBMITTED
        trigger: "POST /brand-inspection/fee-remittances/{id}/top-up"
        actor: LivestockOwner
        preconditions:
          - "remittance.status == SHORT_PAID"
          - "X-User-ID == remittance.owner_id"
        side_effects:
          - "remittance.amount_cents += payload.additional_cents"
        note: "Cycle: the topped-up remittance is reconciled again by the FeeAdministrator."
  - entity: AnimalLot
    dimension: match_status
    initial_state: UNCHECKED
    terminal_states: []
    transitions:
      - from: UNCHECKED
        to: MATCHED
        trigger: "POST /brand-inspection/animal-lots/{id}/finding with finding MATCH_CONFIRMED"
        actor: FieldInspector
        preconditions:
          - "parent order.schedule_status == IN_FIELD"
          - "X-User-ID == parent order.inspector_id"
          - "lot.match_status == UNCHECKED and lot.lot_status == PRESENTED"
          - "lot.brand_registration_id != null and that registration.status IN {ACTIVE, GRACE}"
          - "when payload.bill_of_sale_id is supplied it must satisfy validations[priority=75]"
        side_effects:
          - "lot.lot_status -> VERIFIED and lot.disposition -> CLEARED"
          - "lot.bill_of_sale_id = payload.bill_of_sale_id when supplied"
      - from: UNCHECKED
        to: MISMATCHED
        trigger: "POST /brand-inspection/animal-lots/{id}/finding with finding BRAND_MISMATCH"
        actor: FieldInspector
        preconditions:
          - "parent order.schedule_status == IN_FIELD"
          - "X-User-ID == parent order.inspector_id"
          - "lot.match_status == UNCHECKED and lot.lot_status == PRESENTED"
          - "lot.brand_registration_id != null"
        side_effects:
          - "hop 1: lot.lot_status -> HELD and lot.disposition -> THEFT_REFERRAL"
          - "hop 2 (caused by hop 1): a TheftInvestigation row is created with status OPENED, animal_lot_id = lot.id, brand_registration_id = lot.brand_registration_id, opened_at = logical clock, opened_by_user_id = X-User-ID; parent order.hold_flag = true"
          - "hop 3 (caused by hop 2): that BrandRegistration ACTIVE|GRACE -> ENCUMBERED and encumbrance_count += 1"
          - "hop 4 (caused by hop 3): every BrandApplication with prior_registration_id == that registration and status IN {SUBMITTED, UNDER_EXAMINATION} -> CONFLICT_HOLD, processed created_at ASC"
        note: "Depth-4 transitive cascade: lot finding -> investigation -> registration encumbrance -> pending renewal filings held."
      - from: UNCHECKED
        to: UNMATCHED
        trigger: "POST /brand-inspection/animal-lots/{id}/finding with finding NO_LEGIBLE_BRAND"
        actor: FieldInspector
        preconditions:
          - "parent order.schedule_status == IN_FIELD"
          - "X-User-ID == parent order.inspector_id"
          - "lot.match_status == UNCHECKED and lot.lot_status == PRESENTED"
          - "lot.brand_registration_id == null"
          - "order territory.intake_status == OPEN"
          - "the projected occupancy window passes calculations.facility_occupancy_projection"
        side_effects:
          - "hop 1: lot.lot_status -> HELD and lot.disposition -> ESTRAY_HOLD"
          - "hop 2 (caused by hop 1): an EstrayCase row is created with status IMPOUNDED, animal_lot_id = lot.id, territory_id = order.territory_id, head_count = lot.head_count, impounded_at = logical clock, statutory_release_on = impounded_at + STATUTORY_HOLD_DAYS"
          - "hop 3 (caused by hop 2): territory.impound_current_head += lot.head_count and territory.intake_status recomputed against the 90 percent breakpoint"
        note: "Depth-3 transitive cascade: lot finding -> estray case -> facility occupancy and intake posture."
      - from: UNCHECKED
        to: UNVERIFIABLE
        trigger: "system cascade, hop 2 of the conflict cascade (respondent registration REVOKED)"
        actor: system
        preconditions:
          - "lot.brand_registration_id == the registration that just became REVOKED"
          - "lot.lot_status == PRESENTED"
        side_effects:
          - "hop 3 (caused by hop 2): the parent InspectionOrder, when schedule_status IN {SCHEDULED, IN_FIELD}, is returned to REQUESTED and its inspector window is released"
      - from: UNMATCHED
        to: MATCHED
        trigger: "system cascade from POST /brand-inspection/estray-cases/{id}/claim-decision with decision APPROVED"
        actor: system
        preconditions:
          - "the EstrayCase on this lot transitions CLAIM_FILED -> RELEASED_TO_CLAIMANT"
        side_effects:
          - "lot.lot_status -> VERIFIED and lot.disposition -> CLEARED"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on the parent entity's version)
# =============================================================================
concurrency_rules:
  - rule_id: renewal-application-stale-registration
    parent_entity: BrandRegistration
    write_endpoint: "POST /brand-inspection/brand-registrations/{id}/renewal-applications"
    occ_field: "expected_registration_version"
    description: |
      Filing a renewal application against a BrandRegistration whose version has
      advanced since the client last read it is rejected. A newly filed renewal
      legitimately supersedes any earlier pending renewal on the same record, so
      the second filing would otherwise succeed on its own merits; the stale
      version is the only signal that the filer's view of the record (its status,
      its encumbrance count, its expiry) is out of date.
    error_id: ERR_STALE_REGISTRATION_VERSION
    http_status: 412
  - rule_id: schedule-order-stale-inspector
    parent_entity: Inspector
    write_endpoint: "POST /brand-inspection/inspection-orders/{id}/schedule"
    occ_field: "expected_inspector_version"
    description: |
      Assigning an InspectionOrder to an Inspector whose version has advanced
      since the client last read the inspector's calendar is rejected. Another
      assignment, a commission status change, or a cascade that released a window
      all bump the inspector's version, and a non-overlapping window would
      otherwise be accepted on its own merits.
    error_id: ERR_STALE_INSPECTOR_VERSION
    http_status: 412


# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: inspection_fee_assessment
    trigger: "state_machines.InspectionOrder.fee_status UNASSESSED -> ASSESSED, fired by POST /brand-inspection/inspection-orders/{id}/complete"
    algorithm: tiered_pricing
    formula: |
      # Marginal per-head bands are consumed cumulatively across the order's lots.
      rate(position) =
          BAND_1_RATE_CENTS_PER_HEAD  if position <= BAND_1_MAX_HEAD
          BAND_2_RATE_CENTS_PER_HEAD  if BAND_1_MAX_HEAD < position <= BAND_2_MAX_HEAD
          BAND_3_RATE_CENTS_PER_HEAD  otherwise

      ordered_lots = [ L in order.lots where L.lot_status IN {PRESENTED, VERIFIED, HELD} ]
                     sorted by L.created_at ASC          # tie-break: none needed, created_at is unique per row
      running_head  = 0
      subtotal_cents = 0
      for L in ordered_lots:
          lot_base_cents  = sum( rate(p) for p in [running_head + 1 .. running_head + L.head_count] )
          # ROUNDING ORDER IS PINNED: the administrative surcharge is rounded PER LOT and
          # only then summed. Summing the bases first and rounding once is WRONG and
          # differs by whole cents whenever a lot base lands on a half cent.
          lot_admin_cents = round_half_up( lot_base_cents * ADMIN_SURCHARGE_RATE )
          subtotal_cents += lot_base_cents + lot_admin_cents
          running_head   += L.head_count

      after_hours = (order.scheduled_start_at.hour_utc < AFTER_HOURS_END_HOUR_UTC)
                    or (order.scheduled_start_at.hour_utc >= AFTER_HOURS_START_HOUR_UTC)

      assessed_fee_cents = subtotal_cents
                         + territory.travel_surcharge_cents
                         + (AFTER_HOURS_FLAT_CENTS if after_hours else 0)
      fee_due_on = logical_clock + FEE_DUE_DAYS
    input_set: "AnimalLot rows of the completing InspectionOrder whose lot_status IN {PRESENTED, VERIFIED, HELD}; lots with lot_status == VOIDED are excluded entirely. An order with zero qualifying lots yields subtotal_cents = 0 and is still assessed the territory travel surcharge."
    constants:
      BAND_1_MAX_HEAD: 50
      BAND_1_RATE_CENTS_PER_HEAD: 110
      BAND_2_MAX_HEAD: 200
      BAND_2_RATE_CENTS_PER_HEAD: 85
      BAND_3_RATE_CENTS_PER_HEAD: 60
      ADMIN_SURCHARGE_RATE: 0.125
      AFTER_HOURS_FLAT_CENTS: 4500
      AFTER_HOURS_START_HOUR_UTC: 18
      AFTER_HOURS_END_HOUR_UTC: 7
      FEE_DUE_DAYS: 30
    precision: "integer cents; round_half_up applied once per lot to the administrative surcharge only"

  - name: estray_proceeds_distribution
    trigger: "state_machines.EstrayCase IMPOUNDED|CLAIM_FILED -> AUCTION_SCHEDULED (PROVISIONAL) and AUCTION_SCHEDULED -> SOLD (FINAL)"
    algorithm: waterfall_allocation
    formula: |
      # EVALUATION ORDER IS PINNED. The handling fee looks circular because its cap is
      # keyed on the amount left after the care bucket, which itself depends on the
      # day count the variant selects. Evaluate strictly in the order below.
      # step 1
      care_cost_cents = CARE_RATE_CENTS_PER_HEAD_PER_DAY * case.head_count * care_days
      # step 2
      net_available_cents = gross_cents - care_cost_cents
      # step 3
      handling_uncapped_cents = round_half_up( gross_cents * HANDLING_RATE_OF_GROSS )
      # step 4
      handling_cap_cents = round_half_up( max(net_available_cents, 0) * HANDLING_CAP_RATE_OF_NET )
      # step 5
      handling_fee_cents = 0 if net_available_cents <= 0
                           else min(handling_uncapped_cents, handling_cap_cents)
      # step 6
      claimant_residual_cents = max(net_available_cents - handling_fee_cents, 0)
      # step 7 (only on the SOLD -> FORFEITED_TO_BOARD transition)
      board_forfeiture_cents = gross_cents - care_cost_cents - handling_fee_cents
    input_set: "One EstrayCase. `gross_cents` and `care_days` are supplied by the selected variant. The conserved-quantity invariant gross_cents == care_cost_cents + handling_fee_cents + (claimant_residual_cents or board_forfeiture_cents) holds after every write."
    constants:
      STATUTORY_HOLD_DAYS: 20
      CARE_RATE_CENTS_PER_HEAD_PER_DAY: 275
      HANDLING_RATE_OF_GROSS: 0.15
      HANDLING_CAP_RATE_OF_NET: 0.20
    precision: "integer cents; round_half_up on steps 3 and 4 only"
    variants:
      - name: PROVISIONAL
        when: "computed on the IMPOUNDED|CLAIM_FILED -> AUCTION_SCHEDULED transition"
        difference: "gross_cents = case.estimated_gross_cents and care_days = STATUTORY_HOLD_DAYS (the statutory floor), regardless of where the logical clock actually stands. Writes distribution_variant = PROVISIONAL."
      - name: FINAL
        when: "computed on the AUCTION_SCHEDULED -> SOLD transition"
        difference: "gross_cents = case.gross_proceeds_cents and care_days = (calendar date of case.sale_at - calendar date of case.impounded_at) + 1, counting both the intake day and the sale day. Writes distribution_variant = FINAL and overwrites every bucket field."

  - name: owner_arrears_and_standing
    trigger: "recomputed on InspectionOrder fee_status transitions UNASSESSED->ASSESSED, ASSESSED->DELINQUENT, {ASSESSED,DELINQUENT}->REMITTED, {ASSESSED,DELINQUENT}->WAIVED and {ASSESSED,DELINQUENT}->UNASSESSED, and on POST /brand-inspection/_ops/delinquency-sweep"
    algorithm: aggregation
    formula: |
      posted_arrears_cents    = sum( O.assessed_fee_cents
                                     for O in InspectionOrder
                                     where O.owner_id == owner.id and O.fee_status == DELINQUENT )
      projected_arrears_cents = sum( O.assessed_fee_cents
                                     for O in InspectionOrder
                                     where O.owner_id == owner.id
                                       and O.fee_status IN {ASSESSED, DELINQUENT} )
      standing = SUSPENDED if posted_arrears_cents >= ARREARS_SUSPENSION_THRESHOLD_CENTS
                 else GOOD
      suspended_since = logical_clock on the recompute that flips GOOD -> SUSPENDED;
                        null on the recompute that flips SUSPENDED -> GOOD
    input_set: "All InspectionOrder rows of the owner regardless of schedule_status; CANCELLED orders never carry a non-zero assessed_fee_cents because the fee dimension only leaves UNASSESSED on completion."
    constants:
      ARREARS_SUSPENSION_THRESHOLD_CENTS: 25000
    precision: "integer cents; the standing breakpoint is inclusive (>=), so exactly 25000 suspends"
    variants:
      - name: POSTED
        when: "gates scheduling (validations[priority=80]) and is the number shown as owner.posted_arrears_cents"
        difference: "counts only orders whose fee_status == DELINQUENT, i.e. fees that have already passed fee_due_on during a delinquency sweep. An assessed-but-not-yet-due fee contributes 0."
      - name: PROJECTED
        when: "returned by GET /brand-inspection/owners/{id}/statement and stored as owner.projected_arrears_cents"
        difference: "counts orders whose fee_status IN {ASSESSED, DELINQUENT}, so a fee assessed today already contributes its full amount even though it is not yet due. For an owner with one freshly assessed order the two variants differ by that order's full assessed_fee_cents."

  - name: brand_priority_ranking
    trigger: "computed on BrandApplication creation and on state_machines.BrandApplication RETURNED_FOR_CORRECTION -> SUBMITTED; ranks are re-derived for the whole conflict group on UNDER_EXAMINATION -> RECORDED"
    algorithm: chronological
    formula: |
      # Three inputs interact non-linearly: the affidavit flag gates the prior-use
      # credit entirely, the cap clips it, and only then does the backdating apply.
      capped_years = min(application.documented_prior_use_years, PRIOR_USE_CAP_YEARS)
                     if application.prior_use_affidavit_on_file else 0
      effective_priority_at = application.original_filed_at
                              - (capped_years * DAYS_PER_PRIOR_USE_YEAR) days

      # Ranking inside the conflict group keyed on
      # (state_code, brand_symbol, position_code, species_class):
      group = [ R in BrandRegistration
                where R.state_code == state_code and R.brand_symbol == brand_symbol
                  and R.position_code == position_code and R.species_class == species_class
                  and R.status IN {ACTIVE, GRACE} ]
      sort group by ( R.effective_priority_at ASC,
                      R.source_application.correction_rounds ASC,
                      R.created_at ASC )
      priority_rank = 1-based index in that sorted list
    input_set: "BrandRegistration rows in the same conflict group with status IN {ACTIVE, GRACE}. Rows with status IN {ENCUMBERED, LAPSED, SUPERSEDED, REVOKED} are excluded from the group and therefore neither occupy a rank nor block exclusivity. The same sort key drives validations[priority=60]: a filing that sorts ahead of every incumbent is recorded at priority_rank 1 and pushes each incumbent down one rank; a filing that any incumbent outranks is refused outright."
    constants:
      PRIOR_USE_CAP_YEARS: 10
      DAYS_PER_PRIOR_USE_YEAR: 365
    precision: "whole days; effective_priority_at keeps the time-of-day of original_filed_at"

  - name: renewal_filing_fee
    trigger: "computed when a BrandApplication row is created, stamped into assessed_filing_fee_cents"
    algorithm: threshold
    formula: |
      if application_type IN {NEW, TRANSFER}:
          assessed_filing_fee_cents = NEW_FILING_FEE_CENTS
      else:  # RENEWAL
          days_past_expiry = floor( (logical_clock - prior_registration.expires_on) / 1 day )
          if days_past_expiry <= 0:
              penalty_rate = 0
          elif days_past_expiry <= GRACE_DAYS:            # 1..30 inclusive
              penalty_rate = GRACE_PENALTY_RATE
          elif days_past_expiry <= LAPSE_RECOVERY_DAYS:   # 31..90 inclusive
              penalty_rate = LAPSE_PENALTY_RATE
          else:                                          # 91 and beyond
              reject with ERR_REGISTRATION_UNRENEWABLE
          assessed_filing_fee_cents = BASE_RENEWAL_FEE_CENTS
                                    + round_half_up( BASE_RENEWAL_FEE_CENTS * penalty_rate )
    input_set: "The single prior BrandRegistration named by prior_registration_id and the logical clock at filing time."
    constants:
      NEW_FILING_FEE_CENTS: 9000
      BASE_RENEWAL_FEE_CENTS: 12000
      REGISTRATION_TERM_DAYS: 1825
      GRACE_DAYS: 30
      LAPSE_RECOVERY_DAYS: 90
      GRACE_PENALTY_RATE: 0.25
      LAPSE_PENALTY_RATE: 0.75
    precision: "integer cents; both day breakpoints are inclusive upper bounds (30 is still grace, 31 is not; 90 is still recoverable, 91 is not)"

  - name: remittance_waterfall_application
    trigger: "state_machines.FeeRemittance SUBMITTED -> RECONCILED and SUBMITTED -> SHORT_PAID, fired by POST /brand-inspection/fee-remittances/{id}/reconcile"
    algorithm: waterfall_allocation
    formula: |
      open_orders = [ O for O.id in remittance.covered_order_ids
                      where O.fee_status IN {ASSESSED, DELINQUENT} ]
                    sorted by ( O.fee_due_on ASC, O.created_at ASC )
      covered_total_cents = sum( O.assessed_fee_cents for O in open_orders )

      if remittance.amount_cents > remittance.applied_cents + covered_total_cents:
          reject with ERR_REMITTANCE_AMOUNT_INVALID     # boundary: equality is accepted

      available_cents = remittance.amount_cents - remittance.applied_cents
      for O in open_orders:                    # STRICTLY ORDERED, NO SKIP-AHEAD
          if available_cents >= O.assessed_fee_cents:
              O.fee_status = REMITTED
              O.remittance_id = remittance.id
              available_cents          -= O.assessed_fee_cents
              remittance.applied_cents += O.assessed_fee_cents
          else:
              break        # the first order that cannot be fully covered stops the walk;
                           # cheaper orders behind it are NOT settled out of turn
      remaining_open_cents = sum( O.assessed_fee_cents for O in open_orders
                                  where O.fee_status IN {ASSESSED, DELINQUENT} )
      shortfall_cents = max(remaining_open_cents - available_cents, 0)
      remittance.status = RECONCILED if shortfall_cents == 0 else SHORT_PAID
    input_set: "Only the InspectionOrders named in covered_order_ids whose fee_status is still ASSESSED or DELINQUENT; orders already REMITTED or WAIVED by an earlier pass are skipped and do not contribute to covered_total_cents."
    constants: {}
    precision: "integer cents; partial settlement of a single order is never written"

  - name: inspector_window_occupancy
    trigger: "evaluated on POST /brand-inspection/inspection-orders/{id}/schedule before the REQUESTED -> SCHEDULED transition"
    algorithm: interval_merge
    formula: |
      occupied = [ O for O in InspectionOrder
                   where O.inspector_id == candidate_inspector.id
                     and O.schedule_status IN {SCHEDULED, IN_FIELD}
                     and O.id != this_order.id ]

      # Buffer geometry: same-district back-to-back work needs no travel time,
      # cross-district work needs TRAVEL_BUFFER_MINUTES between the two windows.
      for O in occupied:
          buffer = 0 if O.territory_id == this_order.territory_id
                   else TRAVEL_BUFFER_MINUTES
          conflict if ( new_start < O.scheduled_end_at   + buffer
                    and O.scheduled_start_at < new_end   + buffer )
      # Windows are half-open [scheduled_start_at, scheduled_end_at): touching
      # endpoints inside one district are NOT a conflict, touching endpoints across
      # districts ARE a conflict.

      same_day_count = count( O in occupied
                              where O.scheduled_start_at.utc_date == new_start.utc_date )
      daily_limit_breach = ( same_day_count >= candidate_inspector.max_daily_assignments )
    input_set: "InspectionOrders already holding the candidate inspector with schedule_status IN {SCHEDULED, IN_FIELD}; REQUESTED, COMPLETED and CANCELLED orders never occupy a window."
    constants:
      TRAVEL_BUFFER_MINUTES: 45
    precision: "whole minutes; comparisons are strict (<) on both sides"

  - name: facility_occupancy_projection
    trigger: "evaluated on POST /brand-inspection/animal-lots/{id}/finding with finding NO_LEGIBLE_BRAND, before the EstrayCase row is created"
    algorithm: interval_merge
    formula: |
      # Aggregate-capacity geometry: unlike the inspector rule this is not a pairwise
      # test. Every instant covered by the proposed occupancy must leave the district
      # facility's summed head count at or under capacity.
      new_window = [ logical_clock, logical_clock + STATUTORY_HOLD_DAYS )
      occupancy(E) = [ E.impounded_at,
                       E.sale_at if E.status == SOLD
                       else E.statutory_release_on )
      live = [ E for E in EstrayCase
               where E.territory_id == territory.id
                 and E.status IN {IMPOUNDED, CLAIM_FILED, AUCTION_SCHEDULED, SOLD} ]

      breakpoints = sorted set of all interval endpoints of (live occupancies + new_window)
      for each half-open segment [b_i, b_i+1) inside new_window:
          load = new_lot.head_count
               + sum( E.head_count for E in live where occupancy(E) covers [b_i, b_i+1) )
          conflict if load > territory.impound_capacity_head
      # Touching intervals never overlap: a case whose occupancy ends exactly at the
      # new intake instant contributes 0 to the load.
    input_set: "EstrayCase rows at the same territory whose status IN {IMPOUNDED, CLAIM_FILED, AUCTION_SCHEDULED, SOLD}; cases in RELEASED_TO_CLAIMANT, PROCEEDS_DISBURSED or FORFEITED_TO_BOARD have vacated the facility and contribute 0."
    constants:
      STATUTORY_HOLD_DAYS: 20
      INTAKE_RESTRICTION_PERCENT: 90
    precision: "whole head; intervals are half-open [start, end)"

# =============================================================================
# 1.4 Validation Rules Table (evaluated in ascending priority; first failure wins)
# =============================================================================
validations:
  - priority: 10
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role names a role declared in the RBAC matrix."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 20
    category: auth
    check: "The acting role appears in the called endpoint's roles list."
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 30
    category: business_constraint
    check: "Request body conforms to the endpoint input schema: every required field present, enum values are declared members, mailing_state and state_code are exactly two uppercase letters, head_count >= 1, amount_cents > 0, additional_cents > 0, impound_capacity_head >= 1, max_daily_assignments >= 1, travel_surcharge_cents >= 0, documented_prior_use_years >= 0, requested_window_end_at > requested_window_start_at, scheduled_end_at > scheduled_start_at, and scheduled_start_at >= requested_window_start_at and scheduled_end_at <= requested_window_end_at."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"
  - priority: 40
    category: existence
    check: "Every id embedded in the path resolves to a live row, validated left to right."
    error_id: "ERR_OWNER_NOT_FOUND | ERR_TERRITORY_NOT_FOUND | ERR_INSPECTOR_NOT_FOUND | ERR_APPLICATION_NOT_FOUND | ERR_REGISTRATION_NOT_FOUND | ERR_CLAIM_NOT_FOUND | ERR_ORDER_NOT_FOUND | ERR_LOT_NOT_FOUND | ERR_BILL_OF_SALE_NOT_FOUND | ERR_ESTRAY_CASE_NOT_FOUND | ERR_INVESTIGATION_NOT_FOUND | ERR_REMITTANCE_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints carrying a path id"
  - priority: 45
    category: existence
    check: "Every foreign key supplied in the request body resolves: owner_id, territory_id, inspector_id, prior_registration_id, respondent_registration_id, contested_application_id, brand_registration_id, bill_of_sale_id, seller_owner_id, buyer_owner_id and each element of covered_order_ids."
    error_id: "ERR_OWNER_NOT_FOUND | ERR_TERRITORY_NOT_FOUND | ERR_INSPECTOR_NOT_FOUND | ERR_REGISTRATION_NOT_FOUND | ERR_APPLICATION_NOT_FOUND | ERR_BILL_OF_SALE_NOT_FOUND | ERR_ORDER_NOT_FOUND"
    http_status: 404
    applies_to: "all write endpoints carrying foreign keys in the body"
  - priority: 50
    category: auth
    check: "Entity-backed ownership: a LivestockOwner's X-User-ID equals the owner_id of the application, order, remittance or bill-of-sale being acted on (and equals buyer_owner_id or seller_owner_id when creating a bill of sale); a FieldInspector's X-User-ID equals the target order's inspector_id."
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /brand-inspection/brand-applications, POST /brand-inspection/brand-registrations/{id}/renewal-applications, POST /brand-inspection/brand-applications/{id}/resubmit, POST /brand-inspection/inspection-orders, POST /brand-inspection/inspection-orders/{id}/begin, POST /brand-inspection/inspection-orders/{id}/lots, POST /brand-inspection/inspection-orders/{id}/complete, POST /brand-inspection/inspection-orders/{id}/cancel, POST /brand-inspection/animal-lots/{id}/finding, POST /brand-inspection/bills-of-sale, POST /brand-inspection/fee-remittances, POST /brand-inspection/fee-remittances/{id}/top-up, POST /brand-inspection/brand-conflict-claims"
  - priority: 52
    category: auth
    check: "Segregation of duties: the X-User-ID recording a brand application differs from that application's examined_by_user_id."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /brand-inspection/brand-applications/{id}/record"
  - priority: 55
    category: state
    check: "The target row is in a state from which the requested transition is declared in 1.2 (including the fee dimension of an InspectionOrder and the schedule dimension independently)."
    error_id: "ERR_APPLICATION_INVALID_STATE | ERR_REGISTRATION_INVALID_STATE | ERR_CLAIM_INVALID_STATE | ERR_ORDER_NOT_SCHEDULABLE | ERR_ORDER_INVALID_STATE | ERR_FEE_INVALID_STATE | ERR_ESTRAY_INVALID_STATE | ERR_INVESTIGATION_INVALID_STATE | ERR_REMITTANCE_INVALID_STATE"
    http_status: 409
    applies_to: "all transition endpoints"
  - priority: 58
    category: state
    check: "Optimistic concurrency: the supplied expected_<parent>_version equals the parent row's current version."
    error_id: "ERR_STALE_REGISTRATION_VERSION | ERR_STALE_INSPECTOR_VERSION"
    http_status: 412
    applies_to: "POST /brand-inspection/brand-registrations/{id}/renewal-applications, POST /brand-inspection/inspection-orders/{id}/schedule"
  - priority: 60
    category: business_safety
    check: "Brand exclusivity by recording priority: recording is refused when the conflict group (state_code, brand_symbol, position_code, species_class) already holds a BrandRegistration with status IN {ACTIVE, GRACE} owned by a different Owner that OUTRANKS the filing under calculations.brand_priority_ranking, i.e. whose sort key (effective_priority_at ASC, correction_rounds ASC, created_at ASC) sorts strictly ahead of the filing's. A filing that outranks every incumbent IS recorded, takes priority_rank 1 and demotes the incumbents. Registrations in ENCUMBERED, LAPSED, SUPERSEDED or REVOKED are outside the group and never block."
    error_id: ERR_BRAND_CONFLICT_EXISTS
    http_status: 409
    applies_to: "POST /brand-inspection/brand-applications/{id}/record"
  - priority: 62
    category: business_safety
    check: "The InspectionOrder's hold_flag is false; an order under an open theft hold cannot have its fee waived, voided, or covered by a remittance."
    error_id: ERR_ORDER_HOLD_ACTIVE
    http_status: 409
    applies_to: "POST /brand-inspection/inspection-orders/{id}/waive-fee, POST /brand-inspection/inspection-orders/{id}/void-assessment, POST /brand-inspection/fee-remittances"
  - priority: 64
    category: business_safety
    check: "The order territory's intake_status == OPEN before an estray impound is created."
    error_id: ERR_FACILITY_INTAKE_RESTRICTED
    http_status: 409
    applies_to: "POST /brand-inspection/animal-lots/{id}/finding with finding NO_LEGIBLE_BRAND"
  - priority: 65
    category: business_referential
    check: "The named inspector has status == ACTIVE and certification_expires_on > scheduled_end_at."
    error_id: ERR_INSPECTOR_UNAVAILABLE
    http_status: 409
    applies_to: "POST /brand-inspection/inspection-orders/{id}/schedule"
  - priority: 66
    category: business_temporal
    check: "calculations.inspector_window_occupancy reports no buffered overlap against the inspector's SCHEDULED or IN_FIELD orders."
    error_id: ERR_INSPECTOR_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /brand-inspection/inspection-orders/{id}/schedule"
  - priority: 67
    category: business_temporal
    check: "The logical clock is at or after the case's statutory_release_on before an auction may be scheduled."
    error_id: ERR_HOLD_PERIOD_NOT_ELAPSED
    http_status: 409
    applies_to: "POST /brand-inspection/estray-cases/{id}/schedule-auction"
  - priority: 68
    category: business_temporal
    check: "The logical clock is strictly before the case's statutory_release_on when an ownership claim is filed."
    error_id: ERR_CLAIM_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /brand-inspection/estray-cases/{id}/claim"
  - priority: 70
    category: business_constraint
    check: "calculations.inspector_window_occupancy reports same_day_count < inspector.max_daily_assignments for the UTC calendar date of scheduled_start_at."
    error_id: ERR_INSPECTOR_DAILY_LIMIT
    http_status: 409
    applies_to: "POST /brand-inspection/inspection-orders/{id}/schedule"
  - priority: 71
    category: business_constraint
    check: "calculations.facility_occupancy_projection reports no instant inside the proposed occupancy window where the district facility's summed head count would exceed impound_capacity_head."
    error_id: ERR_FACILITY_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /brand-inspection/animal-lots/{id}/finding with finding NO_LEGIBLE_BRAND"
  - priority: 72
    category: business_constraint
    check: "Uniqueness: BillOfSale.document_number, Inspector.badge_number and Territory.territory_code are each unique across all rows."
    error_id: "ERR_DUPLICATE_DOCUMENT_NUMBER | ERR_DUPLICATE_BADGE_NUMBER | ERR_DUPLICATE_TERRITORY_CODE"
    http_status: 409
    applies_to: "POST /brand-inspection/bills-of-sale, POST /brand-inspection/inspectors, POST /brand-inspection/territories"
  - priority: 74
    category: business_referential
    check: "For a RENEWAL application, the prior registration named by prior_registration_id has status IN {ACTIVE, GRACE} at recording time."
    error_id: ERR_PRIOR_REGISTRATION_NOT_RENEWABLE
    http_status: 422
    applies_to: "POST /brand-inspection/brand-applications/{id}/record"
  - priority: 75
    category: business_referential
    check: "When a bill of sale is tendered with a MATCH_CONFIRMED finding it must satisfy all three of: bill.head_count == lot.head_count, bill.species_class == lot.species_class, and bill.buyer_owner_id == the parent order's owner_id."
    error_id: ERR_BILL_OF_SALE_MISMATCH
    http_status: 422
    applies_to: "POST /brand-inspection/animal-lots/{id}/finding"
  - priority: 76
    category: business_referential
    check: "The named inspector's home district and the order's district carry the same state_code. Working a neighbouring district inside the same state is permitted and is what makes the cross-district travel buffer apply; crossing a state line is refused."
    error_id: ERR_TERRITORY_MISMATCH
    http_status: 422
    applies_to: "POST /brand-inspection/inspection-orders/{id}/schedule"
  - priority: 80
    category: business_fiscal
    check: "The order owner's standing == GOOD (POSTED variant of calculations.owner_arrears_and_standing)."
    error_id: ERR_OWNER_STANDING_SUSPENDED
    http_status: 402
    applies_to: "POST /brand-inspection/inspection-orders/{id}/schedule"
  - priority: 82
    category: business_fiscal
    check: "A renewal filing is refused when days_past_expiry > LAPSE_RECOVERY_DAYS (90) per calculations.renewal_filing_fee."
    error_id: ERR_REGISTRATION_UNRENEWABLE
    http_status: 422
    applies_to: "POST /brand-inspection/brand-registrations/{id}/renewal-applications"
  - priority: 84
    category: business_fiscal
    check: "remittance.amount_cents <= remittance.applied_cents + covered_total_cents at reconcile time; equality is accepted, a greater amount is an overpayment and is refused."
    error_id: ERR_REMITTANCE_AMOUNT_INVALID
    http_status: 422
    applies_to: "POST /brand-inspection/fee-remittances/{id}/reconcile"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Owners -----------------------------------------------------------------
  - method: POST
    path: "/brand-inspection/owners"
    description: "Enrol a livestock owner of record with the board."
    roles: [BoardAdmin]
    code: 201
    input: [legal_name, mailing_state, contact_email]
    output: Owner
    side_effects: ["standing initialised to GOOD; posted_arrears_cents and projected_arrears_cents initialised to 0"]
  - method: GET
    path: "/brand-inspection/owners/{id}"
    description: "Read one owner including the two arrears aggregates and the standing gate."
    roles: [BoardAdmin, LivestockOwner, FeeAdministrator, BrandRecorder]
    code: 200
    input: []
    output: Owner
    side_effects: []
  - method: GET
    path: "/brand-inspection/owners/{id}/statement"
    description: "Computed read returning both variants of calculations.owner_arrears_and_standing side by side."
    roles: [BoardAdmin, LivestockOwner, FeeAdministrator]
    code: 200
    input: []
    output: { owner_id: string, standing: string, posted_arrears_cents: integer, projected_arrears_cents: integer, open_order_count: integer, delinquent_order_count: integer }
    side_effects: []

  # --- Territories ------------------------------------------------------------
  - method: POST
    path: "/brand-inspection/territories"
    description: "Create an inspection district with its travel surcharge and impound capacity."
    roles: [BoardAdmin]
    code: 201
    input: [territory_code, state_code, travel_surcharge_cents, impound_capacity_head]
    output: Territory
    side_effects: ["impound_current_head initialised to 0 and intake_status to OPEN"]
  - method: GET
    path: "/brand-inspection/territories/{id}"
    description: "Read one district including live impound occupancy and intake posture."
    roles: [BoardAdmin, FieldInspector, BrandRecorder, FeeAdministrator]
    code: 200
    input: []
    output: Territory
    side_effects: []

  # --- Inspectors -------------------------------------------------------------
  - method: POST
    path: "/brand-inspection/inspectors"
    description: "Commission a field inspector into a home district."
    roles: [BoardAdmin]
    code: 201
    input: [badge_number, home_territory_id, certification_expires_on, "max_daily_assignments?"]
    output: Inspector
    side_effects: ["status initialised to ACTIVE; version starts at 1"]
  - method: GET
    path: "/brand-inspection/inspectors/{id}"
    description: "Read one inspector; the version field is the OCC token used when scheduling."
    roles: [BoardAdmin, FieldInspector, LivestockOwner]
    code: 200
    input: []
    output: Inspector
    side_effects: []
  - method: GET
    path: "/brand-inspection/inspectors"
    description: "List inspectors, optionally filtered by home district or commission status."
    roles: [BoardAdmin, FieldInspector]
    code: 200
    input: ["home_territory_id?", "status?", "limit?", "offset?"]
    output: Inspector[]
    side_effects: []
  - method: POST
    path: "/brand-inspection/inspectors/{id}/status"
    description: "Change an inspector's commission status between ACTIVE, SUSPENDED and RETIRED."
    roles: [BoardAdmin]
    code: 200
    input: [status]
    output: Inspector
    side_effects: ["increments Inspector.version by 1"]

  # --- Brand applications -----------------------------------------------------
  - method: POST
    path: "/brand-inspection/brand-applications"
    description: "File a NEW or TRANSFER brand application. RENEWAL filings use the nested renewal endpoint so the OCC token can be supplied."
    roles: [LivestockOwner]
    code: 201
    input: [owner_id, application_type, brand_symbol, position_code, species_class, state_code, "prior_registration_id?", "documented_prior_use_years?", "prior_use_affidavit_on_file?"]
    output: BrandApplication
    side_effects:
      - "original_filed_at stamped from the logical clock"
      - "effective_priority_at computed by calculations.brand_priority_ranking"
      - "assessed_filing_fee_cents = NEW_FILING_FEE_CENTS per calculations.renewal_filing_fee"
  - method: POST
    path: "/brand-inspection/brand-registrations/{id}/renewal-applications"
    description: "File a RENEWAL application against an existing record. Requires the caller's last-observed registration version as an OCC token."
    roles: [LivestockOwner]
    code: 201
    input: [owner_id, expected_registration_version, "brand_symbol?", "position_code?", "species_class?", "documented_prior_use_years?", "prior_use_affidavit_on_file?"]
    output: BrandApplication
    side_effects:
      - "increments BrandRegistration.version by 1"
      - "application_type set to RENEWAL and prior_registration_id set to the path registration"
      - "brand_symbol, position_code, species_class and state_code default to the prior registration's values when not supplied"
      - "any earlier BrandApplication on the same prior_registration_id with status IN {SUBMITTED, UNDER_EXAMINATION, RETURNED_FOR_CORRECTION, CONFLICT_HOLD} -> REJECTED with rejection_reason 'SUPERSEDED_BY_LATER_RENEWAL', processed created_at ASC"
      - "assessed_filing_fee_cents computed by calculations.renewal_filing_fee"
  - method: GET
    path: "/brand-inspection/brand-applications/{id}"
    description: "Read one brand application."
    roles: [LivestockOwner, BrandRecorder, BoardAdmin]
    code: 200
    input: []
    output: BrandApplication
    side_effects: []
  - method: GET
    path: "/brand-inspection/brand-applications"
    description: "List brand applications filtered by applicant, prior record or status."
    roles: [LivestockOwner, BrandRecorder, BoardAdmin]
    code: 200
    input: ["owner_id?", "prior_registration_id?", "status?", "application_type?", "limit?", "offset?"]
    output: BrandApplication[]
    side_effects: []
  - method: POST
    path: "/brand-inspection/brand-applications/{id}/begin-examination"
    description: "A recorder takes the filing up for examination; the acting operator id is stamped for later segregation-of-duties enforcement."
    roles: [BrandRecorder]
    code: 200
    input: []
    output: BrandApplication
    side_effects: ["examined_by_user_id = X-User-ID"]
  - method: POST
    path: "/brand-inspection/brand-applications/{id}/return"
    description: "Return the filing to the applicant for correction; the third return terminates the filing instead."
    roles: [BrandRecorder]
    code: 200
    input: []
    output: BrandApplication
    side_effects: ["correction_rounds += 1", "status -> RETURNED_FOR_CORRECTION, or REJECTED once correction_rounds was already at MAX_CORRECTION_ROUNDS"]
  - method: POST
    path: "/brand-inspection/brand-applications/{id}/resubmit"
    description: "Applicant resubmits a corrected filing; original_filed_at is preserved so priority is not lost."
    roles: [LivestockOwner]
    code: 200
    input: ["brand_symbol?", "position_code?", "species_class?", "documented_prior_use_years?", "prior_use_affidavit_on_file?"]
    output: BrandApplication
    side_effects: ["effective_priority_at recomputed by calculations.brand_priority_ranking"]
  - method: POST
    path: "/brand-inspection/brand-applications/{id}/record"
    description: "Record the brand, creating the BrandRegistration. The recording operator must differ from the examining operator."
    roles: [BrandRecorder]
    code: 201
    input: []
    output: BrandRegistration
    side_effects:
      - "creates a BrandRegistration with status ACTIVE, recorded_at from the logical clock and expires_on = recorded_at + REGISTRATION_TERM_DAYS"
      - "priority_rank recomputed across the whole conflict group by calculations.brand_priority_ranking"
      - "on a RENEWAL: prior registration -> SUPERSEDED with superseded_by_registration_id set"
      - "application.recorded_by_user_id = X-User-ID and application.status -> RECORDED"
  - method: POST
    path: "/brand-inspection/brand-applications/{id}/reject"
    description: "Reject a filing that is UNDER_EXAMINATION or held in CONFLICT_HOLD."
    roles: [BrandRecorder]
    code: 200
    input: [rejection_reason]
    output: BrandApplication
    side_effects: []

  # --- Brand registrations ----------------------------------------------------
  - method: GET
    path: "/brand-inspection/brand-registrations/{id}"
    description: "Read one recorded brand including priority_rank, encumbrance_count and the OCC version token."
    roles: [BoardAdmin, BrandRecorder, LivestockOwner, FieldInspector, TheftInvestigator]
    code: 200
    input: []
    output: BrandRegistration
    side_effects: []
  - method: GET
    path: "/brand-inspection/brand-registrations"
    description: "List recorded brands; the conflict-group filters expose recording priority ordering."
    roles: [BoardAdmin, BrandRecorder, LivestockOwner, FieldInspector, TheftInvestigator]
    code: 200
    input: ["owner_id?", "source_application_id?", "superseded_by_registration_id?", "state_code?", "brand_symbol?", "position_code?", "species_class?", "status?", "limit?", "offset?"]
    output: BrandRegistration[]
    side_effects: []

  # --- Brand conflict claims --------------------------------------------------
  - method: POST
    path: "/brand-inspection/brand-conflict-claims"
    description: "An owner contests a recorded brand on statutory grounds."
    roles: [LivestockOwner]
    code: 201
    input: [claimant_owner_id, respondent_registration_id, grounds, "contested_application_id?"]
    output: BrandConflictClaim
    side_effects: ["status initialised to FILED"]
  - method: GET
    path: "/brand-inspection/brand-conflict-claims/{id}"
    description: "Read one conflict claim."
    roles: [LivestockOwner, BrandRecorder, BoardAdmin]
    code: 200
    input: []
    output: BrandConflictClaim
    side_effects: []
  - method: GET
    path: "/brand-inspection/brand-conflict-claims"
    description: "List conflict claims by claimant, respondent record or contested filing."
    roles: [LivestockOwner, BrandRecorder, BoardAdmin]
    code: 200
    input: ["claimant_owner_id?", "respondent_registration_id?", "contested_application_id?", "status?", "limit?", "offset?"]
    output: BrandConflictClaim[]
    side_effects: []
  - method: POST
    path: "/brand-inspection/brand-conflict-claims/{id}/adjudicate"
    description: "A recorder takes the claim up for adjudication."
    roles: [BrandRecorder]
    code: 200
    input: []
    output: BrandConflictClaim
    side_effects: []
  - method: POST
    path: "/brand-inspection/brand-conflict-claims/{id}/decide"
    description: "Sustain or dismiss the claim. Sustaining revokes the respondent record and cascades through lots to scheduled orders."
    roles: [BrandRecorder]
    code: 200
    input: [decision, "decision_note?"]
    output: BrandConflictClaim
    side_effects:
      - "on SUSTAIN hop 1: respondent BrandRegistration -> REVOKED"
      - "on SUSTAIN hop 2: every AnimalLot on that registration with lot_status == PRESENTED -> match_status UNVERIFIABLE"
      - "on SUSTAIN hop 3: every InspectionOrder parenting such a lot with schedule_status IN {SCHEDULED, IN_FIELD} -> REQUESTED with its inspector window released and that Inspector.version += 1"

  # --- Bills of sale ----------------------------------------------------------
  - method: POST
    path: "/brand-inspection/bills-of-sale"
    description: "Record an ownership instrument tendered by a buyer or seller. Immutable once written."
    roles: [LivestockOwner]
    code: 201
    input: [seller_owner_id, buyer_owner_id, document_number, sale_date, head_count, species_class, "brand_symbol_declared?"]
    output: BillOfSale
    side_effects: []
  - method: GET
    path: "/brand-inspection/bills-of-sale/{id}"
    description: "Read one ownership instrument."
    roles: [LivestockOwner, FieldInspector, BoardAdmin]
    code: 200
    input: []
    output: BillOfSale
    side_effects: []
  - method: GET
    path: "/brand-inspection/bills-of-sale"
    description: "List ownership instruments by seller or buyer."
    roles: [LivestockOwner, FieldInspector, BoardAdmin]
    code: 200
    input: ["seller_owner_id?", "buyer_owner_id?", "limit?", "offset?"]
    output: BillOfSale[]
    side_effects: []

  # --- Inspection orders ------------------------------------------------------
  - method: POST
    path: "/brand-inspection/inspection-orders"
    description: "Request an inspection at sale, movement or slaughter inside a district."
    roles: [LivestockOwner]
    code: 201
    input: [owner_id, territory_id, inspection_purpose, requested_window_start_at, requested_window_end_at]
    output: InspectionOrder
    side_effects: ["schedule_status initialised to REQUESTED and fee_status to UNASSESSED"]
  - method: GET
    path: "/brand-inspection/inspection-orders/{id}"
    description: "Read one inspection order across both of its state dimensions."
    roles: [LivestockOwner, FieldInspector, BoardAdmin, FeeAdministrator]
    code: 200
    input: []
    output: InspectionOrder
    side_effects: []
  - method: GET
    path: "/brand-inspection/inspection-orders"
    description: "List inspection orders by owner, district, inspector, settling remittance or either state dimension."
    roles: [LivestockOwner, FieldInspector, BoardAdmin, FeeAdministrator]
    code: 200
    input: ["owner_id?", "territory_id?", "inspector_id?", "remittance_id?", "schedule_status?", "fee_status?", "limit?", "offset?"]
    output: InspectionOrder[]
    side_effects: []
  - method: POST
    path: "/brand-inspection/inspection-orders/{id}/schedule"
    description: "Assign an inspector and a concrete window. Requires the caller's last-observed inspector version as an OCC token."
    roles: [BoardAdmin]
    code: 200
    input: [inspector_id, scheduled_start_at, scheduled_end_at, expected_inspector_version]
    output: InspectionOrder
    side_effects:
      - "increments Inspector.version by 1"
      - "schedule_status -> SCHEDULED; inspector_id and the scheduled window are stamped"
      - "inspector.active_assignment_count recomputed"
  - method: POST
    path: "/brand-inspection/inspection-orders/{id}/begin"
    description: "The assigned inspector opens the order in the field."
    roles: [FieldInspector]
    code: 200
    input: []
    output: InspectionOrder
    side_effects: ["schedule_status -> IN_FIELD"]
  - method: POST
    path: "/brand-inspection/inspection-orders/{id}/lots"
    description: "Record a lot of head presented under this order."
    roles: [FieldInspector]
    code: 201
    input: [species_class, head_count, "brand_registration_id?", "bill_of_sale_id?", "earmark_code?"]
    output: AnimalLot
    side_effects: ["order.head_count_presented recomputed"]
  - method: POST
    path: "/brand-inspection/inspection-orders/{id}/complete"
    description: "Close the field work and stamp the fee. Every non-voided lot must already carry a finding."
    roles: [FieldInspector]
    code: 200
    input: []
    output: InspectionOrder
    side_effects:
      - "schedule_status -> COMPLETED"
      - "fee_status UNASSESSED -> ASSESSED with assessed_fee_cents from calculations.inspection_fee_assessment"
      - "fee_due_on = logical_clock + FEE_DUE_DAYS"
      - "owner.projected_arrears_cents recomputed"
  - method: POST
    path: "/brand-inspection/inspection-orders/{id}/cancel"
    description: "Withdraw an order that has not yet gone to the field; every lot is voided and any held inspector window is released."
    roles: [LivestockOwner, BoardAdmin]
    code: 200
    input: []
    output: InspectionOrder
    side_effects: ["every AnimalLot -> lot_status VOIDED", "when the order was SCHEDULED the inspector window is released and that Inspector.version += 1"]
  - method: POST
    path: "/brand-inspection/inspection-orders/{id}/waive-fee"
    description: "Waive an assessed or delinquent fee. Refused while a theft hold is active on the order."
    roles: [FeeAdministrator]
    code: 200
    input: []
    output: InspectionOrder
    side_effects: ["fee_status -> WAIVED", "owner arrears aggregates and standing recomputed"]
  - method: POST
    path: "/brand-inspection/inspection-orders/{id}/void-assessment"
    description: "Compensating action that unwinds a fee assessment, returning the fee dimension to UNASSESSED and zeroing assessed_fee_cents."
    roles: [FeeAdministrator]
    code: 200
    input: []
    output: InspectionOrder
    side_effects: ["assessed_fee_cents = 0 and fee_due_on = null", "owner arrears aggregates and standing recomputed to their pre-assessment values"]

  # --- Animal lots ------------------------------------------------------------
  - method: GET
    path: "/brand-inspection/animal-lots/{id}"
    description: "Read one presented lot."
    roles: [FieldInspector, BoardAdmin, LivestockOwner, TheftInvestigator]
    code: 200
    input: []
    output: AnimalLot
    side_effects: []
  - method: GET
    path: "/brand-inspection/animal-lots"
    description: "List lots by parent order, brand read, tendered instrument or verification outcome."
    roles: [FieldInspector, BoardAdmin, LivestockOwner, TheftInvestigator]
    code: 200
    input: ["inspection_order_id?", "brand_registration_id?", "bill_of_sale_id?", "match_status?", "lot_status?", "limit?", "offset?"]
    output: AnimalLot[]
    side_effects: []
  - method: POST
    path: "/brand-inspection/animal-lots/{id}/finding"
    description: "Record the inspector's ownership finding for a lot; drives the theft cascade and the estray cascade."
    roles: [FieldInspector]
    code: 200
    input: [finding, "bill_of_sale_id?"]
    output: AnimalLot
    side_effects:
      - "MATCH_CONFIRMED: lot_status VERIFIED, match_status MATCHED, disposition CLEARED"
      - "BRAND_MISMATCH: opens a TheftInvestigation, sets order.hold_flag, encumbers the brand record and holds its pending filings"
      - "NO_LEGIBLE_BRAND: opens an EstrayCase, raises territory.impound_current_head and recomputes territory.intake_status"

  # --- Estray cases -----------------------------------------------------------
  - method: GET
    path: "/brand-inspection/estray-cases/{id}"
    description: "Read one estray case including the current distribution buckets and which variant wrote them."
    roles: [BoardAdmin, LivestockOwner, FeeAdministrator]
    code: 200
    input: []
    output: EstrayCase
    side_effects: []
  - method: GET
    path: "/brand-inspection/estray-cases"
    description: "List estray cases by impounded lot, district or claimant."
    roles: [BoardAdmin, LivestockOwner, FeeAdministrator]
    code: 200
    input: ["animal_lot_id?", "territory_id?", "claimant_owner_id?", "status?", "limit?", "offset?"]
    output: EstrayCase[]
    side_effects: []
  - method: POST
    path: "/brand-inspection/estray-cases/{id}/claim"
    description: "An owner files an ownership claim before the statutory window closes."
    roles: [LivestockOwner]
    code: 200
    input: []
    output: EstrayCase
    side_effects: ["claimant_owner_id = X-User-ID"]
  - method: POST
    path: "/brand-inspection/estray-cases/{id}/claim-decision"
    description: "Approve a claim (releasing the head) or deny it (returning the case to impound)."
    roles: [BoardAdmin]
    code: 200
    input: [decision]
    output: EstrayCase
    side_effects:
      - "APPROVED: territory.impound_current_head -= head_count, intake_status recomputed, lot -> VERIFIED/MATCHED/CLEARED"
      - "DENIED: claim_denied_count += 1 and claimant_owner_id cleared"
  - method: POST
    path: "/brand-inspection/estray-cases/{id}/schedule-auction"
    description: "Schedule the statutory auction once the hold has elapsed; writes the PROVISIONAL distribution."
    roles: [BoardAdmin]
    code: 200
    input: [estimated_gross_cents]
    output: EstrayCase
    side_effects: ["PROVISIONAL variant of calculations.estray_proceeds_distribution writes the bucket fields and distribution_variant"]
  - method: POST
    path: "/brand-inspection/estray-cases/{id}/record-sale"
    description: "Record the hammer price; writes the FINAL distribution over the provisional numbers."
    roles: [BoardAdmin]
    code: 200
    input: [gross_proceeds_cents]
    output: EstrayCase
    side_effects: ["sale_at = logical_clock", "FINAL variant of calculations.estray_proceeds_distribution overwrites the bucket fields and distribution_variant"]
  - method: POST
    path: "/brand-inspection/estray-cases/{id}/disburse"
    description: "Close out the sold case, paying the claimant residual or forfeiting the balance to the board, and vacating the facility."
    roles: [FeeAdministrator]
    code: 200
    input: []
    output: EstrayCase
    side_effects: ["territory.impound_current_head -= head_count and intake_status recomputed", "lot -> VERIFIED with disposition CLEARED"]

  # --- Theft investigations ---------------------------------------------------
  - method: GET
    path: "/brand-inspection/theft-investigations/{id}"
    description: "Read one theft investigation."
    roles: [TheftInvestigator, BoardAdmin, FieldInspector]
    code: 200
    input: []
    output: TheftInvestigation
    side_effects: []
  - method: GET
    path: "/brand-inspection/theft-investigations"
    description: "List theft investigations by lot or encumbered brand record."
    roles: [TheftInvestigator, BoardAdmin, FieldInspector]
    code: 200
    input: ["animal_lot_id?", "brand_registration_id?", "status?", "limit?", "offset?"]
    output: TheftInvestigation[]
    side_effects: []
  - method: POST
    path: "/brand-inspection/theft-investigations/{id}/refer"
    description: "Refer the open investigation to a law-enforcement agency."
    roles: [TheftInvestigator]
    code: 200
    input: [referral_agency]
    output: TheftInvestigation
    side_effects: ["status -> REFERRED"]
  - method: POST
    path: "/brand-inspection/theft-investigations/{id}/close"
    description: "Close the investigation with a finding; UNFOUNDED releases the encumbrance, SUBSTANTIATED revokes the brand record."
    roles: [TheftInvestigator]
    code: 200
    input: [outcome]
    output: TheftInvestigation
    side_effects:
      - "registration.encumbrance_count -= 1"
      - "UNFOUNDED at count 0: registration ENCUMBERED -> ACTIVE and its CONFLICT_HOLD filings -> UNDER_EXAMINATION"
      - "SUBSTANTIATED: registration -> REVOKED and its PRESENTED lots -> match_status UNVERIFIABLE"
      - "order.hold_flag cleared when no OPENED or REFERRED investigation remains on the order's lots"
  - method: POST
    path: "/brand-inspection/theft-investigations/{id}/reopen"
    description: "Reopen a closed investigation once; re-encumbers the brand record and re-applies the order hold."
    roles: [TheftInvestigator]
    code: 200
    input: []
    output: TheftInvestigation
    side_effects: ["reopen_count += 1, outcome -> PENDING", "registration re-encumbered and order.hold_flag = true"]

  # --- Fee remittances --------------------------------------------------------
  - method: POST
    path: "/brand-inspection/fee-remittances"
    description: "Tender a payment against a list of the owner's open inspection fees."
    roles: [LivestockOwner]
    code: 201
    input: [owner_id, amount_cents, covered_order_ids]
    output: FeeRemittance
    side_effects: ["status initialised to SUBMITTED, applied_cents and shortfall_cents to 0"]
  - method: GET
    path: "/brand-inspection/fee-remittances/{id}"
    description: "Read one remittance including how much of it has been applied."
    roles: [LivestockOwner, FeeAdministrator, BoardAdmin]
    code: 200
    input: []
    output: FeeRemittance
    side_effects: []
  - method: GET
    path: "/brand-inspection/fee-remittances"
    description: "List remittances by remitting owner or status."
    roles: [LivestockOwner, FeeAdministrator, BoardAdmin]
    code: 200
    input: ["owner_id?", "status?", "limit?", "offset?"]
    output: FeeRemittance[]
    side_effects: []
  - method: POST
    path: "/brand-inspection/fee-remittances/{id}/reconcile"
    description: "Run calculations.remittance_waterfall_application over the covered orders in due-date order."
    roles: [FeeAdministrator]
    code: 200
    input: []
    output: FeeRemittance
    side_effects:
      - "fully covered orders -> fee_status REMITTED with remittance_id stamped"
      - "applied_cents and shortfall_cents rewritten; status -> RECONCILED or SHORT_PAID"
      - "owner arrears aggregates and standing recomputed"
  - method: POST
    path: "/brand-inspection/fee-remittances/{id}/top-up"
    description: "Add funds to a short-paid remittance and return it to SUBMITTED for another reconcile pass."
    roles: [LivestockOwner]
    code: 200
    input: [additional_cents]
    output: FeeRemittance
    side_effects: ["amount_cents += additional_cents", "status -> SUBMITTED"]

  # --- Ops and test-driving ---------------------------------------------------
  - method: POST
    path: "/brand-inspection/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to real wall-clock time."
    roles: [BoardAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["no rows are recomputed; the delinquency sweep is the only thing that acts on the new instant"]
  - method: POST
    path: "/brand-inspection/_ops/delinquency-sweep"
    description: "Advance the board's epoch: flip past-due assessments to DELINQUENT, expire and lapse registrations, then recompute owner arrears and standing."
    roles: [FeeAdministrator]
    code: 200
    input: []
    output: { delinquent_order_count: integer, graced_registration_count: integer, lapsed_registration_count: integer, suspended_owner_count: integer, swept_at: string }
    side_effects:
      - "InspectionOrders with fee_status ASSESSED and fee_due_on <= logical_clock -> DELINQUENT, processed fee_due_on ASC then created_at ASC"
      - "BrandRegistrations ACTIVE with expires_on <= logical_clock -> GRACE, and GRACE with expires_on + LAPSE_RECOVERY_DAYS < logical_clock -> LAPSED, processed expires_on ASC then created_at ASC"
      - "every LAPSED record rejects its pending renewal filings with rejection_reason 'PRIOR_REGISTRATION_LAPSED'"
      - "owner.posted_arrears_cents, owner.projected_arrears_cents, owner.standing and owner.suspended_since recomputed for every affected owner, processed created_at ASC"

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  # auth / authorization
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not a declared role."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "The acting role is not listed in the called endpoint's roles."
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "An entity-backed role acts on a resource that belongs to a different Owner or Inspector."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The BrandRecorder recording a filing is the same operator id that examined it."
  # existence
  - id: ERR_OWNER_NOT_FOUND
    http: 404
    condition: "An owner_id, seller_owner_id, buyer_owner_id or claimant_owner_id does not resolve."
  - id: ERR_TERRITORY_NOT_FOUND
    http: 404
    condition: "A territory_id or home_territory_id does not resolve."
  - id: ERR_INSPECTOR_NOT_FOUND
    http: 404
    condition: "An inspector id in the path or in a schedule payload does not resolve."
  - id: ERR_APPLICATION_NOT_FOUND
    http: 404
    condition: "A brand application id in the path or a contested_application_id does not resolve."
  - id: ERR_REGISTRATION_NOT_FOUND
    http: 404
    condition: "A brand registration id in the path, a prior_registration_id, a respondent_registration_id or a brand_registration_id does not resolve."
  - id: ERR_CLAIM_NOT_FOUND
    http: 404
    condition: "A brand conflict claim id in the path does not resolve."
  - id: ERR_ORDER_NOT_FOUND
    http: 404
    condition: "An inspection order id in the path or in covered_order_ids does not resolve."
  - id: ERR_LOT_NOT_FOUND
    http: 404
    condition: "An animal lot id in the path does not resolve."
  - id: ERR_BILL_OF_SALE_NOT_FOUND
    http: 404
    condition: "A bill of sale id in the path or in a finding payload does not resolve."
  - id: ERR_ESTRAY_CASE_NOT_FOUND
    http: 404
    condition: "An estray case id in the path does not resolve."
  - id: ERR_INVESTIGATION_NOT_FOUND
    http: 404
    condition: "A theft investigation id in the path does not resolve."
  - id: ERR_REMITTANCE_NOT_FOUND
    http: 404
    condition: "A fee remittance id in the path does not resolve."
  # request shape
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "A required body field is missing, an enum value is not a declared member, a numeric field is out of its declared range, or a window is inverted or falls outside the requested window."
  # state
  - id: ERR_APPLICATION_INVALID_STATE
    http: 409
    condition: "The brand application is not in a state from which the requested transition is declared."
  - id: ERR_REGISTRATION_INVALID_STATE
    http: 409
    condition: "The brand registration is not in a state that permits the requested operation, for example filing a renewal against a SUPERSEDED, LAPSED or REVOKED record, or reopening an investigation whose record is already REVOKED."
  - id: ERR_CLAIM_INVALID_STATE
    http: 409
    condition: "The conflict claim is not FILED when adjudicated, or not UNDER_ADJUDICATION when decided."
  - id: ERR_ORDER_NOT_SCHEDULABLE
    http: 409
    condition: "The inspection order's schedule_status is not REQUESTED when a schedule assignment is attempted."
  - id: ERR_ORDER_INVALID_STATE
    http: 409
    condition: "The inspection order's schedule_status forbids the requested operation, including recording a lot or a finding outside IN_FIELD, completing an order with a lot still UNCHECKED, and cancelling an order that already went to the field."
  - id: ERR_FEE_INVALID_STATE
    http: 409
    condition: "The inspection order's fee_status forbids the requested fee operation, for example waiving or voiding a fee that is UNASSESSED, REMITTED or WAIVED, or covering such an order with a remittance."
  - id: ERR_ESTRAY_INVALID_STATE
    http: 409
    condition: "The estray case is not in a state from which the requested transition is declared."
  - id: ERR_INVESTIGATION_INVALID_STATE
    http: 409
    condition: "The theft investigation is not in a state from which the requested transition is declared, or a reopen is attempted after reopen_count already reached MAX_REOPENS."
  - id: ERR_REMITTANCE_INVALID_STATE
    http: 409
    condition: "The remittance is not SUBMITTED when reconciled, or not SHORT_PAID when topped up."
  # optimistic concurrency
  - id: ERR_STALE_REGISTRATION_VERSION
    http: 412
    condition: "expected_registration_version does not equal the BrandRegistration's current version."
  - id: ERR_STALE_INSPECTOR_VERSION
    http: 412
    condition: "expected_inspector_version does not equal the Inspector's current version."
  # business
  - id: ERR_BRAND_CONFLICT_EXISTS
    http: 409
    condition: "Recording was attempted while a different owner already holds an ACTIVE or GRACE record in the same conflict group that outranks the filing under calculations.brand_priority_ranking."
  - id: ERR_ORDER_HOLD_ACTIVE
    http: 409
    condition: "A fee operation or remittance coverage was attempted on an order whose hold_flag is true."
  - id: ERR_FACILITY_INTAKE_RESTRICTED
    http: 409
    condition: "An estray impound was attempted at a district whose intake_status is RESTRICTED."
  - id: ERR_FACILITY_CAPACITY_EXCEEDED
    http: 409
    condition: "The proposed impound would push the district facility's summed head count above impound_capacity_head at some instant of the occupancy window."
  - id: ERR_INSPECTOR_UNAVAILABLE
    http: 409
    condition: "The named inspector's status is not ACTIVE, or the commission expires at or before the proposed window end."
  - id: ERR_INSPECTOR_WINDOW_CONFLICT
    http: 409
    condition: "The proposed window collides with an existing SCHEDULED or IN_FIELD window on the same inspector after applying the cross-district travel buffer."
  - id: ERR_INSPECTOR_DAILY_LIMIT
    http: 409
    condition: "The inspector already holds max_daily_assignments orders on the UTC calendar date of the proposed window."
  - id: ERR_TERRITORY_MISMATCH
    http: 422
    condition: "The named inspector's home district and the order's district have different state_code values."
  - id: ERR_HOLD_PERIOD_NOT_ELAPSED
    http: 409
    condition: "An auction was scheduled before the case's statutory_release_on."
  - id: ERR_CLAIM_WINDOW_CLOSED
    http: 409
    condition: "An ownership claim was filed at or after the case's statutory_release_on."
  - id: ERR_PRIOR_REGISTRATION_NOT_RENEWABLE
    http: 422
    condition: "A RENEWAL filing is recorded while its prior registration's status is not ACTIVE or GRACE."
  - id: ERR_REGISTRATION_UNRENEWABLE
    http: 422
    condition: "A renewal filing is attempted more than LAPSE_RECOVERY_DAYS (90) days past the record's expiry."
  - id: ERR_BILL_OF_SALE_MISMATCH
    http: 422
    condition: "The tendered instrument's head_count, species_class or buyer_owner_id does not agree with the lot and its parent order."
  - id: ERR_OWNER_STANDING_SUSPENDED
    http: 402
    condition: "Scheduling was attempted for an owner whose standing is SUSPENDED."
  - id: ERR_REMITTANCE_AMOUNT_INVALID
    http: 422
    condition: "The remittance tenders more than the still-open covered total at reconcile time."
  - id: ERR_DUPLICATE_DOCUMENT_NUMBER
    http: 409
    condition: "A bill of sale reuses an existing document_number."
  - id: ERR_DUPLICATE_BADGE_NUMBER
    http: 409
    condition: "An inspector reuses an existing badge_number."
  - id: ERR_DUPLICATE_TERRITORY_CODE
    http: 409
    condition: "A territory reuses an existing territory_code."

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: LivestockOwner
    description: "A producer of record. Files brand applications and renewals, requests inspections, tenders ownership instruments, claims estrays and remits fees."
    identity: "entity_backed:Owner"
    exclusive_operations:
      - "POST /brand-inspection/brand-applications"
      - "POST /brand-inspection/brand-registrations/{id}/renewal-applications"
      - "POST /brand-inspection/brand-applications/{id}/resubmit"
      - "POST /brand-inspection/brand-conflict-claims"
      - "POST /brand-inspection/bills-of-sale"
      - "POST /brand-inspection/inspection-orders"
      - "POST /brand-inspection/estray-cases/{id}/claim"
      - "POST /brand-inspection/fee-remittances"
      - "POST /brand-inspection/fee-remittances/{id}/top-up"
    shared_operations:
      - "POST /brand-inspection/inspection-orders/{id}/cancel (with BoardAdmin)"
      - "GET reads on owners, inspectors, brand applications, brand registrations, conflict claims, bills of sale, inspection orders, animal lots, estray cases and fee remittances"
  - name: FieldInspector
    description: "A commissioned inspector who works assigned orders in the field, records presented lots and enters ownership findings."
    identity: "entity_backed:Inspector"
    exclusive_operations:
      - "POST /brand-inspection/inspection-orders/{id}/begin"
      - "POST /brand-inspection/inspection-orders/{id}/lots"
      - "POST /brand-inspection/inspection-orders/{id}/complete"
      - "POST /brand-inspection/animal-lots/{id}/finding"
    shared_operations:
      - "GET reads on territories, inspectors, brand registrations, bills of sale, inspection orders, animal lots and theft investigations"
  - name: BrandRecorder
    description: "Board recording officer. Examines, returns, records and rejects brand filings and adjudicates conflict claims. Recording is segregated from examining by operator id."
    identity: opaque
    exclusive_operations:
      - "POST /brand-inspection/brand-applications/{id}/begin-examination"
      - "POST /brand-inspection/brand-applications/{id}/return"
      - "POST /brand-inspection/brand-applications/{id}/record"
      - "POST /brand-inspection/brand-applications/{id}/reject"
      - "POST /brand-inspection/brand-conflict-claims/{id}/adjudicate"
      - "POST /brand-inspection/brand-conflict-claims/{id}/decide"
    shared_operations:
      - "GET reads on owners, territories, brand applications, brand registrations and conflict claims"
  - name: FeeAdministrator
    description: "Board fee officer. Waives and voids assessments, reconciles remittances, disburses estray proceeds and runs the delinquency sweep."
    identity: opaque
    exclusive_operations:
      - "POST /brand-inspection/inspection-orders/{id}/waive-fee"
      - "POST /brand-inspection/inspection-orders/{id}/void-assessment"
      - "POST /brand-inspection/fee-remittances/{id}/reconcile"
      - "POST /brand-inspection/estray-cases/{id}/disburse"
      - "POST /brand-inspection/_ops/delinquency-sweep"
    shared_operations:
      - "GET reads on owners, owner statements, territories, inspection orders, estray cases and fee remittances"
  - name: TheftInvestigator
    description: "Board investigator handling brand-mismatch referrals to law enforcement."
    identity: opaque
    exclusive_operations:
      - "POST /brand-inspection/theft-investigations/{id}/refer"
      - "POST /brand-inspection/theft-investigations/{id}/close"
      - "POST /brand-inspection/theft-investigations/{id}/reopen"
    shared_operations:
      - "GET reads on brand registrations, animal lots and theft investigations"
  - name: BoardAdmin
    description: "Board operations administrator. Maintains owners, districts and commissions, assigns inspectors to orders, decides estray claims and drives the statutory auction. Operates the logical clock."
    identity: opaque
    exclusive_operations:
      - "POST /brand-inspection/owners"
      - "POST /brand-inspection/territories"
      - "POST /brand-inspection/inspectors"
      - "POST /brand-inspection/inspectors/{id}/status"
      - "POST /brand-inspection/inspection-orders/{id}/schedule"
      - "POST /brand-inspection/estray-cases/{id}/claim-decision"
      - "POST /brand-inspection/estray-cases/{id}/schedule-auction"
      - "POST /brand-inspection/estray-cases/{id}/record-sale"
      - "POST /brand-inspection/_clock/set_current_utc"
    shared_operations:
      - "POST /brand-inspection/inspection-orders/{id}/cancel (with LivestockOwner)"
      - "GET reads on every collection in the API"
