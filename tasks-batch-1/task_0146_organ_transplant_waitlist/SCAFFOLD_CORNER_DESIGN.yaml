  # ===========================================================================
  - section: rbac
    instances:
      - name: corner_unauthenticated_missing_headers
        claim_type: unauthenticated
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A request to a protected endpoint with no X-User-Role header returns 401 ERR_UNAUTHENTICATED."
        test_recipe:
          setup:
            - "A registered center exists."
          setup_api_calls:
            - call: "POST /transplant-centers"
              payload: { name: "C", unos_center_code: "C001", region_code: 5, latitude: 41.8, longitude: -87.6 }
              as: UNOSAdmin
              captures: { c_id: "$.data.id" }
          trigger:
            - call: "POST /candidates"
              payload: { center_id: "${c_id}", mrn: "NA1", organ_type: "LIVER", blood_type: "O", date_of_birth: "1980-01-01T00:00:00Z", height_cm: 175, weight_kg: 75, hla_a: ["A1","A2"], hla_b: ["B7","B8"], hla_dr: ["DR1","DR2"] }
              as: Anonymous
              captures: { err: "$.data.error_id" }
          assert:
            - "Request without auth headers returns HTTP 401 ERR_UNAUTHENTICATED"

      - name: corner_opo_cannot_create_candidate_unauthorized
        claim_type: cross_role_denied
        grounds:
          - roles
          - validations[priority=2]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "An OrganProcurementOrg calling POST /candidates (a TransplantCenter-exclusive op) returns 403 ERR_UNAUTHORIZED."
        test_recipe:
          setup:
            - "A registered center and a registered OPO."
          setup_api_calls:
            - call: "POST /transplant-centers"
              payload: { name: "C", unos_center_code: "C001", region_code: 5, latitude: 41.8, longitude: -87.6 }
              as: UNOSAdmin
              captures: { c_id: "$.data.id" }
            - call: "POST /organ-procurement-orgs"
              payload: { name: "OPO5", opo_code: "OPO5", region_code: 5, latitude: 41.8, longitude: -87.6 }
              as: UNOSAdmin
              captures: { opo_id: "$.data.id" }
          trigger:
            - call: "POST /candidates"
              payload: { center_id: "${c_id}", mrn: "UZ1", organ_type: "LIVER", blood_type: "O", date_of_birth: "1980-01-01T00:00:00Z", height_cm: 175, weight_kg: 75, hla_a: ["A1","A2"], hla_b: ["B7","B8"], hla_dr: ["DR1","DR2"] }
              as: OrganProcurementOrg
              as_user_id: "${opo_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "POST /candidates by OPO returns HTTP 403 ERR_UNAUTHORIZED"

      - name: corner_center_cannot_run_match_unauthorized
        claim_type: cross_role_denied
        grounds:
          - roles
          - validations[priority=2]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "A TransplantCenter calling POST /match-runs (an OPO-exclusive op) returns 403 ERR_UNAUTHORIZED."
        test_recipe:
          setup:
            - "An AVAILABLE organ exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: UNOSAdmin
            - call: "POST /transplant-centers"
              payload: { name: "C5", unos_center_code: "C005", region_code: 5, latitude: 41.8, longitude: -87.6 }
              as: UNOSAdmin
              captures: { c5_id: "$.data.id" }
            - call: "POST /organ-procurement-orgs"
              payload: { name: "OPO5", opo_code: "OPO5", region_code: 5, latitude: 41.8, longitude: -87.6 }
              as: UNOSAdmin
              captures: { opo_id: "$.data.id" }
            - call: "POST /donor-organs"
              payload: { opo_id: "${opo_id}", organ_type: "LIVER", blood_type: "O", donor_height_cm: 180, donor_weight_kg: 85, hla_a: ["A1","A2"], hla_b: ["B7","B8"], hla_dr: ["DR1","DR2"], recovered_at: "2026-06-01T00:00:00Z", max_cold_ischemia_hours: 10 }
              as: OrganProcurementOrg
              as_user_id: "${opo_id}"
              captures: { organ_id: "$.data.id", organ_v0: "$.data.version" }
          trigger:
            - call: "POST /match-runs"
              payload: { donor_organ_id: "${organ_id}", expected_donor_organ_version: "${organ_v0}", policy_code: "STANDARD" }
              as: TransplantCenter
              as_user_id: "${c5_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "POST /match-runs by a TransplantCenter returns HTTP 403 ERR_UNAUTHORIZED"

      - name: corner_non_owner_center_cannot_deactivate
        claim_type: peer_role_isolation
        grounds:
          - validations[priority=4]
          - errors[ERR_NOT_RESOURCE_OWNER]
        distinguishing_aspect: "A center that does not own a candidate calling POST /candidates/{id}/deactivate returns 403 ERR_NOT_RESOURCE_OWNER."
        test_recipe:
          setup:
            - "Candidate owned by center C5; second center C9 attempts to deactivate."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: UNOSAdmin
            - call: "POST /transplant-centers"
              payload: { name: "C5", unos_center_code: "C005", region_code: 5, latitude: 41.8, longitude: -87.6 }
              as: UNOSAdmin
              captures: { c5_id: "$.data.id" }
            - call: "POST /transplant-centers"
              payload: { name: "C9", unos_center_code: "C009", region_code: 5, latitude: 41.0, longitude: -87.0 }
              as: UNOSAdmin
              captures: { c9_id: "$.data.id" }
            - call: "POST /candidates"
              payload: { center_id: "${c5_id}", mrn: "OW1", organ_type: "LIVER", blood_type: "O", date_of_birth: "1980-01-01T00:00:00Z", height_cm: 175, weight_kg: 75, hla_a: ["A1","A2"], hla_b: ["B7","B8"], hla_dr: ["DR1","DR2"] }
              as: TransplantCenter
              as_user_id: "${c5_id}"
              captures: { cand_id: "$.data.id" }
          trigger:
            - call: "POST /candidates/${cand_id}/deactivate"
              payload: {}
              as: TransplantCenter
              as_user_id: "${c9_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "Deactivate by non-owner C9 returns HTTP 403 ERR_NOT_RESOURCE_OWNER"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: corner_occ_match_run_stale_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[match-run-stale-organ]
          - validations[priority=8]
          - errors[ERR_STALE_ORGAN_VERSION]
        distinguishing_aspect: "A second match-run carrying the pre-first-run organ version (expected_donor_organ_version = ${organ_v0}, now stale) returns 412 ERR_STALE_ORGAN_VERSION."
