    raised_by: "POST /pharmacy/fill-cycles/{id}/adjudicate"
  - error_id: ERR_VACATION_LIMIT_EXCEEDED
    http_status: 422
    message: "Patient {id} has used all {vacation_overrides_per_year} travel exceptions this year."
    raised_by: "POST /pharmacy/vacation-exceptions"
  - error_id: ERR_PAYER_OVERRIDE_NOT_ALLOWED
    http_status: 422
    message: "Plan {id} does not fund payer-level vacation overrides."
    raised_by: "POST /pharmacy/vacation-exceptions/{id}/decide with APPROVE_PAYER_OVERRIDE"
  - error_id: ERR_INVALID_APPROVED_DAYS
    http_status: 422
    message: "The approval payload is inconsistent with the request: {detail}."
    raised_by: "decide or respond with a missing, zero or over-large approved amount, or a DENY without a reason"
  - error_id: ERR_DUPLICATE_AUTH_REQUEST
    http_status: 409
    message: "Prescription {id} already has an open refill authorization request."
