  - name: error_endorsement_retry_exhausted_on_second_return_returns_409
    claim_type: Violation → Error
    grounds:
    - errors[ERR_ENDORSEMENT_RETRY_EXHAUSTED]
    - state_machines.SubstitutionEndorsement.REJECTED_to_PENDING
    - entities.SubstitutionEndorsement.fields.status
    - PATCH /api/v1/substitution-endorsements/{id}
    distinguishing_aspect: The PATCH ladder reject, return-to-pending, reject all succeed with HTTP 200,
      but the second return to PENDING is rejected 409 ERR_ENDORSEMENT_RETRY_EXHAUSTED and the endorsement
      stays REJECTED — the retry budget is one round trip, not unlimited.
    test_recipe:
      setup:
      - Empty DB; logical clock pinned to 2026-09-01T00:00:00Z.
      - Car type CT-P (BOXCAR, build_hours 1, regulatory_life_years 25, line_count_family LINE-P) with
        WHEELSET WS-P at qty_per_car 2 and substitute WHEELSET WS-P2 available.
      - One DRAFT order of 1 car stands at version 1 and carries a single PENDING endorsement raised by
        X-User-ID user-planner-p.
      setup_api_calls:
      - call: POST /api/v1/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /api/v1/car-types
        payload:
          model_code: CT-P
          car_class: BOXCAR
          build_hours: 1
          regulatory_life_years: 25
          line_count_family: LINE-P
        as: ProductionPlanner
        captures:
          ct_id: $.data.id
      - call: POST /api/v1/components
        payload:
          part_number: WS-P
          component_class: WHEELSET
          unit_cost_cents: 1000
          lead_time_days: 5
        as: SupplyChainCoordinator
        captures:
          ws_id: $.data.id
      - call: POST /api/v1/components
        payload:
          part_number: WS-P2
          component_class: WHEELSET
          unit_cost_cents: 1100
          lead_time_days: 4
        as: SupplyChainCoordinator
        captures:
          ws2_id: $.data.id
      - call: POST /api/v1/car-type-component-requirements
        payload:
          car_type_id: ${ct_id}
          component_id: ${ws_id}
          qty_per_car: 2
        as: ProductionPlanner
      - call: POST /api/v1/production-orders
        payload:
          car_type_id: ${ct_id}
          quantity: 1
          planned_shop_days: 1
          disposition: SOLD
          priority_rank: 1
          order_date: '2026-09-01'
          required_delivery_date: '2026-12-01'
        as: ProductionPlanner
        captures:
          po_id: $.data.id
          po_v: $.data.version
      - call: POST /api/v1/substitution-endorsements
        payload:
          production_order_id: ${po_id}
          original_component_id: ${ws_id}
          substitute_component_id: ${ws2_id}
          substitute_qty_per_car: 2
          decides_material: false
          expected_production_order_version: ${po_v}
        as: ProductionPlanner
        as_user_id: user-planner-p
        captures:
          se_id: $.data.id
          se_status: $.data.status
      trigger:
      - call: PATCH /api/v1/substitution-endorsements/${se_id}
        payload:
          status: REJECTED
        as: LeaseAdministrator
        as_user_id: user-lease-p
        captures:
          r1_status: $.data.status
      - call: PATCH /api/v1/substitution-endorsements/${se_id}
        payload:
          status: PENDING
        as: ProductionPlanner
        as_user_id: user-planner-p
        captures:
          r2_status: $.data.status
      - call: PATCH /api/v1/substitution-endorsements/${se_id}
        payload:
          status: REJECTED
        as: LeaseAdministrator
        as_user_id: user-lease-p
        captures:
          r3_status: $.data.status
      - call: PATCH /api/v1/substitution-endorsements/${se_id}
        payload:
          status: PENDING
        as: ProductionPlanner
        as_user_id: user-planner-p
        captures:
          err_retry: $.data.error_id
      - call: GET /api/v1/substitution-endorsements/${se_id}
        payload: {}
        as: PlatformAdmin
        captures:
          se_after: $.data.status
          se_version: $.data.version
      assert:
      - 'The endorsement started PENDING: status == ${se_status} == "PENDING"'
      - 'The first three PATCH calls all succeed: REJECTED -> ${r1_status} == "REJECTED", back to PENDING
        -> ${r2_status} == "PENDING", and rejected again -> ${r3_status} == "REJECTED"'
      - 'The second return to PENDING is refused: HTTP 409 with data.error_id == ${err_retry} == "ERR_ENDORSEMENT_RETRY_EXHAUSTED"'
      - 'The failed retry changed nothing: SubstitutionEndorsement.${se_id}.status == ${se_after} == "REJECTED"'
      - 'The precondition is counted in rejections, not in calls: the row has now been rejected twice,
        which is the terminal condition on the REJECTED_to_PENDING edge'
      - The row is still readable and still carries its version == ${se_version}, so the exhausted endorsement
        remains auditable rather than being deleted
  - name: error_prerequisite_not_met_program_start_without_coverage_returns_409
    claim_type: Violation → Error
    grounds:
    - errors[ERR_PREREQUISITE_NOT_MET]
    - state_machines.RetrofitProgram.PLANNED_to_IN_PROGRESS
    - entities.RetrofitProgramCarType.fields.car_type_id
    - POST /api/v1/retrofit-programs/{id}/start
    distinguishing_aspect: POST /retrofit-programs/{id}/start on a PLANNED program that covers no car
      type is rejected 409 ERR_PREREQUISITE_NOT_MET and the program stays PLANNED, while the identical
      call succeeds 200 with IN_PROGRESS once a RetrofitProgramCarType row is attached.
    test_recipe:
      setup:
      - Empty DB; logical clock pinned to 2026-09-01T00:00:00Z.
      - Car type CT-Q2 (BOXCAR, build_hours 1, regulatory_life_years 25, line_count_family LINE-Q2) exists
        but is NOT yet attached to the program.
      - Program MAND-Q2 is PLANNED with compliance_deadline_date 2026-12-31 and 3 shop days per car, and
        carries zero RetrofitProgramCarType rows.
      setup_api_calls:
      - call: POST /api/v1/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /api/v1/car-types
        payload:
          model_code: CT-Q2
          car_class: BOXCAR
          build_hours: 1
          regulatory_life_years: 25
          line_count_family: LINE-Q2
        as: ProductionPlanner
        captures:
          ct_id: $.data.id
      - call: POST /api/v1/retrofit-programs
        payload:
          mandate_code: MAND-Q2
          description: Uncovered mandate
          compliance_deadline_date: '2026-12-31'
          required_shop_days_per_car: 3
        as: RegulatoryRetrofitist
        captures:
          prog_id: $.data.id
          prog_status0: $.data.status
      - call: GET /api/v1/retrofit-program-car-types?retrofit_program_id=${prog_id}
        payload: {}
        as: PlatformAdmin
      trigger:
      - call: POST /api/v1/retrofit-programs/${prog_id}/start
        payload: {}
        as: RegulatoryRetrofitist
        captures:
          err_prereq: $.data.error_id
      - call: GET /api/v1/retrofit-programs/${prog_id}
        payload: {}
        as: PlatformAdmin
        captures:
          prog_after: $.data.status
      - call: POST /api/v1/retrofit-program-car-types
        payload:
          retrofit_program_id: ${prog_id}
          car_type_id: ${ct_id}
        as: RegulatoryRetrofitist
        captures:
          cover_id: $.data.id
      - call: POST /api/v1/retrofit-programs/${prog_id}/start
        payload: {}
        as: RegulatoryRetrofitist
        captures:
          prog_started: $.data.status
          prog_version: $.data.version
      assert:
      - 'The program was PLANNED with zero coverage: status == ${prog_status0} == "PLANNED" and GET /retrofit-program-car-types?retrofit_program_id=${prog_id}
        returns an empty data array'
      - The uncovered start returns HTTP 409 with data.error_id == ${err_prereq} == "ERR_PREREQUISITE_NOT_MET"
      - 'The rejection is atomic: GET /retrofit-programs/${prog_id} still reports status == ${prog_after}
        == "PLANNED"'
      - 'The missing prerequisite is the upstream aggregate, not a payload field: the body is empty and
        the program''s own fields are all legal'
      - 'Attaching coverage is accepted: POST /retrofit-program-car-types returns 201 with id ${cover_id}'
      - 'The identical start now succeeds: HTTP 200 with data.status == ${prog_started} == "IN_PROGRESS"
        at version ${prog_version} == 2'
  - name: error_duplicate_row_lessee_name_and_mandate_code_return_409
    claim_type: Violation → Error
    grounds:
    - validations[priority=16]
    - errors[ERR_DUPLICATE_ROW]
    - entities.Lessee.fields.legal_name
    - entities.RetrofitProgram.fields.mandate_code
    distinguishing_aspect: Both declared uniqueness constraints reject the second write with 409 ERR_DUPLICATE_ROW
      — a repeated Lessee.legal_name and a repeated RetrofitProgram.mandate_code — while the same endpoints
      accept a differing value with 201.
    test_recipe:
      setup:
      - Empty DB; logical clock pinned to 2026-09-01T00:00:00Z.
      - Lessee "Dup Rail Co" (credit_tier B, utilization_threshold_pct 0, credit_ceiling_cents 1000000)
        and retrofit program MAND-DUP already exist.
      setup_api_calls:
      - call: POST /api/v1/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /api/v1/lessees
        payload:
          legal_name: Dup Rail Co
          credit_tier: B
          utilization_threshold_pct: 0
          credit_ceiling_cents: 1000000
        as: LeaseAdministrator
        captures:
          l1_id: $.data.id
      - call: POST /api/v1/retrofit-programs
        payload:
          mandate_code: MAND-DUP
          description: Original mandate
          compliance_deadline_date: '2026-12-31'
          required_shop_days_per_car: 3
        as: RegulatoryRetrofitist
        captures:
          p1_id: $.data.id
      trigger:
      - call: POST /api/v1/lessees
        payload:
          legal_name: Dup Rail Co
          credit_tier: A
          utilization_threshold_pct: 10
          credit_ceiling_cents: 2000000
        as: LeaseAdministrator
        captures:
          err_lessee: $.data.error_id
      - call: POST /api/v1/retrofit-programs
        payload:
          mandate_code: MAND-DUP
          description: Duplicate mandate
          compliance_deadline_date: '2027-06-30'
          required_shop_days_per_car: 9
        as: RegulatoryRetrofitist
        captures:
          err_mandate: $.data.error_id
      - call: POST /api/v1/lessees
        payload:
          legal_name: Dup Rail Co Two
          credit_tier: A
          utilization_threshold_pct: 10
          credit_ceiling_cents: 2000000
        as: LeaseAdministrator
        captures:
          ok_lessee: $.data.id
          ok_lessee_name: $.data.legal_name
      - call: POST /api/v1/retrofit-programs
        payload:
          mandate_code: MAND-DUP-2
          description: Distinct mandate
          compliance_deadline_date: '2027-06-30'
          required_shop_days_per_car: 9
        as: RegulatoryRetrofitist
        captures:
          ok_prog: $.data.id
      assert:
      - The repeated lessee name returns HTTP 409 with data.error_id == ${err_lessee} == "ERR_DUPLICATE_ROW"
      - The repeated mandate code returns HTTP 409 with data.error_id == ${err_mandate} == "ERR_DUPLICATE_ROW"
      - 'Uniqueness is checked on the declared field alone: the rejected lessee body differed in credit_tier,
        utilization_threshold_pct and credit_ceiling_cents yet still collided on legal_name'
      - 'The controls on the same endpoints succeed: the distinct lessee returns 201 with id ${ok_lessee}
        and legal_name == ${ok_lessee_name} == "Dup Rail Co Two", and the distinct mandate returns 201
        with id ${ok_prog}'
      - 'Neither rejection overwrote the incumbent row: Lessee.${l1_id} and RetrofitProgram.${p1_id} keep
        the values they were created with'
      - Priority 16 is a business_constraint rule and fires after the auth, existence and state ladders,
        so the 409 is a uniqueness collision rather than a shape or FK failure
  - name: error_invalid_request_term_end_not_after_start_returns_400
    claim_type: Violation → Error
    grounds:
    - validations[priority=17]
    - errors[ERR_INVALID_REQUEST]
    - entities.LeaseContract.fields.term_end_date
    - POST /api/v1/lease-contracts
    distinguishing_aspect: POST /lease-contracts with term_end_date equal to term_start_date violates
      the declared term_end_date > term_start_date range and returns 400 ERR_INVALID_REQUEST, while the
      same body with an end date one day later returns 201 — so the ordering rule is enforced on the pair,
      not on either date alone.
    test_recipe:
      setup:
      - Empty DB; logical clock pinned to 2026-09-01T00:00:00Z.
      - Lessee "Term Rail Co" exists so the lessee_id foreign key resolves and priority 4 cannot pre-empt
        priority 17.
      setup_api_calls:
      - call: POST /api/v1/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /api/v1/lessees
        payload:
          legal_name: Term Rail Co
          credit_tier: B
          utilization_threshold_pct: 0
          credit_ceiling_cents: 1000000
        as: LeaseAdministrator
        captures:
          lessee_id: $.data.id
      trigger:
      - call: POST /api/v1/lease-contracts
        payload:
          lessee_id: ${lessee_id}
          lease_type: FULL_SERVICE
          per_diem_rate_cents: 1000
          liability_bearer: LESSOR
          term_start_date: '2026-09-01'
          term_end_date: '2026-09-01'
          fleet_car_cap: 5
        as: LeaseAdministrator
        captures:
          err_range: $.data.error_id
      - call: POST /api/v1/lease-contracts
        payload:
          lessee_id: ${lessee_id}
          lease_type: FULL_SERVICE
          per_diem_rate_cents: 1000
          liability_bearer: LESSOR
          term_start_date: '2026-09-01'
          term_end_date: '2026-09-02'
          fleet_car_cap: 5
        as: LeaseAdministrator
        captures:
          ok_id: $.data.id
          ok_status: $.data.status
          ok_end: $.data.term_end_date
      - call: GET /api/v1/lease-contracts
        payload: {}
        as: PlatformAdmin
        captures:
          only_row: $.data[0].id
      assert:
      - The zero-length term returns HTTP 400 with data.error_id == ${err_range} == "ERR_INVALID_REQUEST"
      - 'The violated rule is the declared range term_end_date > term_start_date, evaluated on the pair:
        both dates are individually well-formed ISO 8601 values'
      - 'The one-day term is accepted: HTTP 201 with data.id == ${ok_id}, data.status == ${ok_status}
        == "DRAFT" and data.term_end_date == ${ok_end} == "2026-09-02"'
      - 'Nothing was written by the rejected call: GET /api/v1/lease-contracts lists exactly one row,
        ${only_row} == ${ok_id}'
      - The rule fires at priority 17, after the auth, existence and state ladders, so the 400 is a range
