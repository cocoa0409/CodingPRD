# =============================================================================
# Task 1255: Banking Access & Safe Account Enrollment Program (Bank On coalition)
# Scaffold seed tables (§1.0–§1.7)
# =============================================================================

scenario: |
  1255. Banking Access & Safe Account Enrollment Program (Bank On coalition): partner
  financial institution certification against account standards, participant referral
  from social services & documentation assistance, account opening event & alternative
  ID acceptance, previous banking record (ChexSystems) barrier resolution, financial
  education pairing & follow-up, account retention tracking at 6/12 months, program
  funding & partner reporting, unbanked outreach campaign

domain_name: banking-access-safe-account-enrollment
api_prefix: /api

complexity_profile:
  primary_archetype: compliance_audit        # certification lifecycle, SoD, alternative-ID compliance, ChexSystems second-look
  secondary_archetype: workflow_orchestration # referral → docs → booking → application → barrier → pairing → retention pipeline
  complexity_layers:
    - optimistic_concurrency       # OCC on PartnerInstitution.version (review supersede) and FundingGrant.version (report create)
    - cascading_side_effects       # decertification cascade (4 hops), grant-suspend cascade (3 hops), barrier-accept cascade
    - dual_variant_calculation     # retention PROVISIONAL vs FINAL; certification STANDARD_RUBRIC vs REMEDIATION_RUBRIC
    - scheduled_actions            # logical clock + ops/evaluate-due epoch: checkpoints, certification lapse, follow-up due
  entity_topology: flat            # peer entities with FK references; no nested creation URLs
  state_machine_shape: cyclic      # recertification loops, negotiation rounds, rework loops, book/unbook cycles
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties # review scorer != review finalizer; peer role ownership per resource family
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (13 entities, flat topology)
# =============================================================================
entities:
  - name: AccountStandard
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Unique standard code, e.g. BO-2026" }
      - { name: name, type: string, source: input, description: "Human-readable standard name" }
      - { name: effective_from, type: string, source: input, description: "ISO date the standard takes effect" }
      - { name: monthly_fee_cap_cents, type: integer, source: input, description: "Maximum allowable monthly maintenance fee" }
      - { name: overdraft_fee_allowed, type: boolean, source: input, description: "Whether overdraft/NSF fees are permitted under the standard" }
      - { name: min_opening_deposit_cap_cents, type: integer, source: input, description: "Maximum opening deposit the standard allows an institution to require" }
      - { name: accepted_alt_id_types, type: array, source: input, description: "Alternative ID doc types accepted: subset of MATRICULA_CONSULAR | MUNICIPAL_ID | FOREIGN_PASSPORT" }
      - { name: chex_second_look_required, type: boolean, source: input, description: "Whether the standard mandates a second-look barrier process for ChexSystems-flagged applicants" }
      - { name: requires_financial_education, type: boolean, source: input, description: "Whether account approval requires a COMPLETED EducationPairing for the participant" }
      - { name: rubric_mode, type: enum, source: input, description: "STANDARD_RUBRIC | REMEDIATION_RUBRIC — selects certification scoring thresholds" }
      - { name: status, type: enum, source: system, description: "DRAFT | EFFECTIVE | SUPERSEDED" }

  - name: PartnerInstitution
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Institution legal name" }
      - { name: charter_type, type: enum, source: input, description: "BANK | CREDIT_UNION" }
      - { name: certification_status, type: enum, source: system, description: "APPLIED | UNDER_REVIEW | CERTIFIED | SUSPENDED | LAPSED | DECERTIFIED" }
      - { name: certified_standard_id, type: string, source: system, description: "FK -> AccountStandard.id; standard under which currently certified (null until first certification)" }
      - { name: certified_at, type: datetime, source: system, description: "Logical-clock timestamp of latest certification (null until certified)" }
      - { name: certification_expires_at, type: datetime, source: computed, description: "certified_at + 24 months; null until certified" }
      - { name: accounts_opened_total, type: integer, source: computed, description: "Count of AccountApplication rows ever transitioned to OPENED for this institution" }
      - { name: current_review_id, type: string, source: system, description: "FK -> CertificationReview.id; the live (DRAFT/SCORED) review, null when none" }

  - name: CertificationReview
    parent: null
    common_fields: true
    fields:
      - { name: institution_id, type: string, source: input, description: "FK -> PartnerInstitution.id" }
      - { name: standard_id, type: string, source: input, description: "FK -> AccountStandard.id; pinned for the life of the review" }
      - { name: period_start, type: string, source: input, description: "ISO date review window opens" }
      - { name: period_end, type: string, source: input, description: "ISO date review window closes" }
      - { name: criteria_ratings, type: array, source: input, description: "Set via /score: [{criterion, rating}] rating 0..4 for FEE_COMPLIANCE, ACCESS, ALT_ID, CHEX_POLICY, EDUCATION_SUPPORT" }
      - { name: mandatory_floor_failed, type: boolean, source: computed, description: "true when FEE_COMPLIANCE or CHEX_POLICY rating <= 1" }
      - { name: weighted_score, type: number, source: computed, description: "0..100, 2dp; null until scored — see certification_score calculation" }
      - { name: outcome, type: enum, source: computed, description: "PASS | CONDITIONAL | FAIL; null until finalized" }
      - { name: scored_by_user_id, type: string, source: system, description: "Opaque X-User-ID of the CoalitionAdmin who scored" }
      - { name: finalized_by_user_id, type: string, source: system, description: "Opaque X-User-ID of the CoalitionAdmin who finalized" }
      - { name: status, type: enum, source: system, description: "DRAFT | SCORED | FINALIZED_PASS | FINALIZED_CONDITIONAL | FINALIZED_FAIL | SUPERSEDED" }

  - name: Participant
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Participant full name" }
      - { name: date_of_birth, type: string, source: input, description: "ISO date of birth" }
      - { name: contact_zip, type: string, source: input, description: "ZIP code of residence" }
      - { name: prior_banking_record, type: enum, source: input, description: "NONE | CLEAN | FLAGGED — self-reported/intake ChexSystems posture" }
      - { name: id_documents, type: array, source: input, description: "[{doc_type, status}] doc_type in STATE_ID | SSN_CARD | ITIN_LETTER | MATRICULA_CONSULAR | MUNICIPAL_ID | FOREIGN_PASSPORT | PROOF_OF_ADDRESS; status SUBMITTED | VERIFIED" }
      - { name: docs_complete, type: boolean, source: computed, description: "true iff at least one identity doc (STATE_ID | MATRICULA_CONSULAR | MUNICIPAL_ID | FOREIGN_PASSPORT) VERIFIED and PROOF_OF_ADDRESS VERIFIED" }
      - { name: pipeline_stage, type: enum, source: computed, description: "REGISTERED | REFERRED | DOCS_READY | EVENT_BOOKED | APPLIED | ACCOUNT_OPENED — derived per participant_pipeline calculation" }
      - { name: registered_by_user_id, type: string, source: system, description: "Opaque X-User-ID of creating navigator/admin" }

  - name: Referral
    parent: null
    common_fields: true
    fields:
      - { name: participant_id, type: string, source: input, description: "FK -> Participant.id" }
      - { name: campaign_id, type: string, source: input, description: "FK -> OutreachCampaign.id; required when created_via=CAMPAIGN, must be null when created_via=NAVIGATOR" }
      - { name: created_via, type: enum, source: input, description: "NAVIGATOR | CAMPAIGN" }
      - { name: agency_user_id, type: string, source: system, description: "Opaque X-User-ID of the creating AgencyNavigator (null for campaign intake)" }
      - { name: status, type: enum, source: system, description: "DOCS_PENDING | DOCS_COMPLETE | BOOKED | APPLIED | CLOSED_CONVERTED | CLOSED_LOST" }
      - { name: booked_event_id, type: string, source: system, description: "FK -> AccountOpeningEvent.id; set by /book, cleared by /unbook; null otherwise" }

  - name: AccountOpeningEvent
    parent: null
    common_fields: true
    fields:
      - { name: institution_id, type: string, source: input, description: "FK -> PartnerInstitution.id" }
      - { name: venue_code, type: string, source: input, description: "Venue/branch identifier; overlap scope key" }
      - { name: starts_at, type: datetime, source: input, description: "Event window open (inclusive)" }
      - { name: ends_at, type: datetime, source: input, description: "Event window close (exclusive) — half-open [starts_at, ends_at)" }
      - { name: capacity, type: integer, source: input, description: "Maximum concurrent bookings" }
      - { name: booked_count, type: integer, source: computed, description: "Count of Referral rows with booked_event_id = this event and status = BOOKED" }
      - { name: alt_id_accepted, type: boolean, source: input, description: "Whether alternative ID is accepted at this event; requires the institution's certified standard to accept at least one alt ID type" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED | CANCELLED" }

  - name: AccountApplication
    parent: null
    common_fields: true
    fields:
      - { name: participant_id, type: string, source: input, description: "FK -> Participant.id" }
      - { name: institution_id, type: string, source: input, description: "FK -> PartnerInstitution.id; must equal acting InstitutionOfficer identity" }
      - { name: referral_id, type: string, source: input, description: "FK -> Referral.id; optional when event_id present (walk-in), required otherwise" }
      - { name: event_id, type: string, source: input, description: "FK -> AccountOpeningEvent.id; optional; when both present must equal referral.booked_event_id" }
      - { name: id_type_presented, type: enum, source: input, description: "STATE_ID | MATRICULA_CONSULAR | MUNICIPAL_ID | FOREIGN_PASSPORT — must be a VERIFIED doc on the participant and permitted by the certified standard" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | OPENED | DECLINED_CHEX | DECLINED_ID | DECLINED_FINAL | REINSTATED | CLOSED_EARLY" }
      - { name: decline_reason, type: enum, source: system, description: "CHEX | INSUFFICIENT_ID | OTHER; null unless declined" }
      - { name: account_number, type: string, source: system, description: "Minted on OPENED; null before" }
      - { name: opened_at, type: datetime, source: system, description: "Logical-clock timestamp of OPENED transition; null before" }
      - { name: closed_at, type: datetime, source: system, description: "Logical-clock timestamp of CLOSED_EARLY transition; null unless closed" }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID of deciding InstitutionOfficer (institution id)" }

  - name: BarrierCase
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> AccountApplication.id; created by DECLINE/CHEX cascade" }
      - { name: participant_id, type: string, source: system, description: "FK -> Participant.id; copied from application at creation" }
      - { name: institution_id, type: string, source: system, description: "FK -> PartnerInstitution.id; copied from application at creation" }
      - { name: status, type: enum, source: system, description: "OPEN | PLAN_PROPOSED | COUNTERED | RESOLVED | DENIED_FINAL" }
      - { name: negotiation_rounds, type: integer, source: system, description: "Starts 0; +1 on each counter" }
      - { name: proposed_settlement_cents, type: integer, source: system, description: "Latest officer proposal; null until first propose" }
      - { name: final_settlement_cents, type: integer, source: system, description: "Pinned on RESOLVED; equals proposed_settlement_cents at accept time" }
      - { name: resolution_note, type: string, source: input, description: "Free-text note on propose/accept/escalate" }

  - name: EducationPairing
    parent: null
    common_fields: true
    fields:
      - { name: participant_id, type: string, source: input, description: "FK -> Participant.id" }
      - { name: coach_id, type: string, source: input, description: "Opaque FinancialCoach X-User-ID; when actor is FinancialCoach must equal X-User-ID" }
      - { name: course_code, type: enum, source: input, description: "FOUNDATIONS | CREDIT_BASICS | SAVINGS" }
      - { name: status, type: enum, source: system, description: "ACTIVE | COMPLETED | FOLLOW_UP_DUE | FOLLOW_UP_DONE" }
      - { name: completed_at, type: datetime, source: system, description: "Set on COMPLETED; null before" }
      - { name: follow_up_due_at, type: datetime, source: computed, description: "completed_at + 30 days; null until COMPLETED" }
      - { name: follow_up_logged_at, type: datetime, source: system, description: "Set on log-follow-up; null before" }

  - name: RetentionCheckpoint
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> AccountApplication.id; pair (M6, M12) created on OPENED" }
      - { name: kind, type: enum, source: system, description: "M6 | M12" }
      - { name: due_date, type: string, source: computed, description: "ISO date: opened_at + 183d (M6) or + 365d (M12)" }
      - { name: window_end, type: string, source: computed, description: "due_date + 30 days (evaluation window, inclusive due_date, exclusive window_end)" }
      - { name: status, type: enum, source: system, description: "PENDING | EVALUATED_RETAINED | EVALUATED_NOT_RETAINED | EXPIRED_UNCONFIRMED" }
      - { name: evaluated_at, type: datetime, source: system, description: "Set by ops/evaluate-due when resolved; null while PENDING" }

  - name: FundingGrant
    parent: null
    common_fields: true
    fields:
      - { name: funder_name, type: string, source: input, description: "Funding source name" }
      - { name: program_year, type: integer, source: input, description: "Program year, e.g. 2026" }
      - { name: total_cents, type: integer, source: input, description: "Total grant funds" }
      - { name: per_report_cap_cents, type: integer, source: input, description: "Maximum claim_total_cents any single PartnerReport may reserve" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | SUSPENDED | CLOSED" }
      - { name: reserved_cents, type: integer, source: computed, description: "Sum of claim_total_cents over SUBMITTED reports against this grant" }
      - { name: disbursed_cents, type: integer, source: computed, description: "Sum of claim_total_cents over APPROVED reports against this grant" }
      - { name: available_cents, type: integer, source: computed, description: "total_cents - reserved_cents - disbursed_cents" }

  - name: PartnerReport
    parent: null
    common_fields: true
    fields:
      - { name: institution_id, type: string, source: input, description: "FK -> PartnerInstitution.id; must equal acting InstitutionOfficer identity" }
      - { name: grant_id, type: string, source: input, description: "FK -> FundingGrant.id" }
      - { name: period_start, type: string, source: input, description: "ISO date reporting period open (inclusive)" }
      - { name: period_end, type: string, source: input, description: "ISO date reporting period close (inclusive)" }
      - { name: evaluation_mode, type: enum, source: input, description: "PROVISIONAL | FINAL — selects retention_rate variant" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | REJECTED" }
      - { name: opened_count, type: integer, source: computed, description: "Applications OPENED with opened_at date in [period_start, period_end] for this institution" }
      - { name: opening_claim_cents, type: integer, source: computed, description: "Per-account tiered incentive net of withholding — see claim_computation" }
      - { name: retention_rate_m6, type: number, source: computed, description: "null when no eligible M6 checkpoints; else per retention_rate variant" }
      - { name: retention_rate_m12, type: number, source: computed, description: "null when no eligible M12 checkpoints; else per retention_rate variant" }
      - { name: retention_bonus_cents, type: integer, source: computed, description: "Tiered bonus on retained counts — see claim_computation" }
      - { name: education_stipend_cents, type: integer, source: computed, description: "10% stipend when education condition met — pinned evaluation order in claim_computation" }
      - { name: claim_total_cents, type: integer, source: computed, description: "opening_claim_cents + retention_bonus_cents + education_stipend_cents" }

  - name: OutreachCampaign
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Campaign name" }
      - { name: zip_cluster, type: string, source: input, description: "ZIP cluster scope key for overlap and budget-cap rules" }
      - { name: window_start, type: string, source: input, description: "ISO date window open (inclusive)" }
      - { name: window_end, type: string, source: input, description: "ISO date window close (exclusive) — half-open [window_start, window_end)" }
      - { name: budget_cents, type: integer, source: input, description: "Campaign budget" }
      - { name: per_conversion_cents, type: integer, source: input, description: "Spend credited per referral that reaches CLOSED_CONVERTED" }
      - { name: spent_cents, type: integer, source: computed, description: "per_conversion_cents × count of CLOSED_CONVERTED referrals with this campaign_id" }
      - { name: status, type: enum, source: system, description: "ACTIVE | CLOSED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: AccountStandard
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: EFFECTIVE
        trigger: "POST /api/account-standards/{id}/activate"
        actor: CoalitionAdmin
        preconditions:
          - "Standard must be DRAFT (ERR_INVALID_STATE)"
        side_effects:
          - "Any other AccountStandard in EFFECTIVE auto-transitions to SUPERSEDED (at most one EFFECTIVE standard at a time)"
      - from: EFFECTIVE
        to: SUPERSEDED
        trigger: "system (automatic when another standard is activated)"
        actor: system
        preconditions: []
        side_effects:
          - "Existing CertificationReview rows keep their pinned standard_id (version pinning)"

  - entity: PartnerInstitution
    field: certification_status
    initial_state: APPLIED
    terminal_states: [DECERTIFIED]
    transitions:
      - from: APPLIED
        to: UNDER_REVIEW
        trigger: "system (on first CertificationReview creation)"
        actor: system
        preconditions: []
        side_effects:
          - "institution.current_review_id set to the new review"
      - from: LAPSED
        to: UNDER_REVIEW
        trigger: "system (on CertificationReview creation)"
        actor: system
        preconditions: []
        side_effects:
          - "institution.current_review_id set to the new review"
      - from: CERTIFIED
        to: UNDER_REVIEW
        trigger: "system (on CertificationReview creation — recertification review)"
        actor: system
        preconditions: []
        side_effects:
          - "institution.current_review_id set to the new review"
          - "certified_at / certification_expires_at retained until the new review finalizes"
      - from: UNDER_REVIEW
        to: CERTIFIED
        trigger: "system (on review finalize with outcome PASS or CONDITIONAL)"
        actor: system
        preconditions: []
        side_effects:
          - "certified_at = logical clock now; certification_expires_at = certified_at + 24 months"
          - "certified_standard_id = review.standard_id"
      - from: CERTIFIED
        to: SUSPENDED
        trigger: "POST /api/partner-institutions/{id}/suspend"
        actor: CoalitionAdmin
        preconditions:
          - "Institution must be CERTIFIED (ERR_INVALID_STATE)"
        side_effects:
          - "New AccountApplication creation blocked while SUSPENDED (ERR_INSTITUTION_NOT_CERTIFIED)"
      - from: SUSPENDED
        to: CERTIFIED
        trigger: "POST /api/partner-institutions/{id}/reinstate"
        actor: CoalitionAdmin
        preconditions:
          - "Institution must be SUSPENDED (ERR_INVALID_STATE)"
          - "Logical clock now must be < certification_expires_at (ERR_CERTIFICATION_LAPSED)"
        side_effects: []
      - from: CERTIFIED
        to: LAPSED
        trigger: "system (ops/evaluate-due when logical clock now >= certification_expires_at)"
        actor: system
        preconditions: []
        side_effects:
          - "New AccountApplication creation blocked while LAPSED (ERR_INSTITUTION_NOT_CERTIFIED)"
      - from: UNDER_REVIEW
        to: DECERTIFIED
        trigger: "system (on review finalize with outcome FAIL)"
        actor: system
        preconditions: []
        side_effects:
          - "Every AccountOpeningEvent of this institution in SCHEDULED transitions to CANCELLED (link 2 of decert cascade)"
          - "Each cancelled event's Referral rows in BOOKED transition to DOCS_COMPLETE and booked_event_id is cleared (link 3)"
          - "Each such Referral's Participant.pipeline_stage is recomputed per participant_pipeline (link 4)"
          - "institution.current_review_id cleared"

  - entity: CertificationReview
    initial_state: DRAFT
    terminal_states: [FINALIZED_PASS, FINALIZED_CONDITIONAL, FINALIZED_FAIL, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SCORED
        trigger: "POST /api/certification-reviews/{id}/score"
        actor: CoalitionAdmin
        preconditions:
          - "Review must be DRAFT (ERR_INVALID_STATE)"
          - "criteria_ratings must cover all 5 criteria with ratings 0..4 (ERR_VALIDATION)"
        side_effects:
          - "weighted_score and mandatory_floor_failed computed per certification_score"
          - "scored_by_user_id = X-User-ID"
      - from: SCORED
        to: FINALIZED_PASS
        trigger: "POST /api/certification-reviews/{id}/finalize"
        actor: CoalitionAdmin
        preconditions:
          - "Review must be SCORED (ERR_INVALID_STATE)"
          - "finalizer X-User-ID must differ from scored_by_user_id (ERR_SOD_VIOLATION)"
          - "Computed outcome must be PASS"
        side_effects:
          - "finalized_by_user_id = X-User-ID"
          - "PartnerInstitution UNDER_REVIEW -> CERTIFIED (or stays CERTIFIED on recertification; certified_at/expires refreshed, certified_standard_id = review.standard_id)"
      - from: SCORED
        to: FINALIZED_CONDITIONAL
        trigger: "POST /api/certification-reviews/{id}/finalize"
        actor: CoalitionAdmin
        preconditions:
          - "Review must be SCORED (ERR_INVALID_STATE)"
          - "finalizer X-User-ID must differ from scored_by_user_id (ERR_SOD_VIOLATION)"
          - "Computed outcome must be CONDITIONAL"
        side_effects:
          - "finalized_by_user_id = X-User-ID"
          - "PartnerInstitution UNDER_REVIEW -> CERTIFIED (certified_at/expires refreshed)"
      - from: SCORED
        to: FINALIZED_FAIL
        trigger: "POST /api/certification-reviews/{id}/finalize"
        actor: CoalitionAdmin
        preconditions:
          - "Review must be SCORED (ERR_INVALID_STATE)"
          - "finalizer X-User-ID must differ from scored_by_user_id (ERR_SOD_VIOLATION)"
          - "Computed outcome must be FAIL"
        side_effects:
          - "finalized_by_user_id = X-User-ID"
          - "PartnerInstitution UNDER_REVIEW -> DECERTIFIED with full decert cascade (see PartnerInstitution machine)"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system (a newer CertificationReview is created for the same institution)"
        actor: system
        preconditions: []
        side_effects:
          - "Superseded review can no longer be scored or finalized (ERR_INVALID_STATE)"
      - from: SCORED
        to: SUPERSEDED
        trigger: "system (a newer CertificationReview is created for the same institution)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Participant
    field: pipeline_stage
    initial_state: REGISTERED
    terminal_states: []
    transitions:
      - from: "*"
        to: RECOMPUTED
        trigger: "system (any Referral or AccountApplication status change for this participant)"
        actor: system
        preconditions: []
        side_effects:
          - "pipeline_stage = first matching of precedence: ACCOUNT_OPENED if any application OPENED; else APPLIED if any application in {SUBMITTED, REINSTATED}; else EVENT_BOOKED if any referral BOOKED; else DOCS_READY if docs_complete; else REFERRED if any referral in {DOCS_PENDING, DOCS_COMPLETE}; else REGISTERED"
        note: "Derived machine — no direct writes; recomputed on every cascade touching the participant's referrals/applications and on documents PATCH"

  - entity: Referral
    initial_state: DOCS_PENDING
    terminal_states: [CLOSED_CONVERTED, CLOSED_LOST]
    transitions:
      - from: DOCS_PENDING
        to: DOCS_COMPLETE
        trigger: "POST /api/referrals/{id}/docs-complete"
        actor: AgencyNavigator
        preconditions:
          - "Referral must be DOCS_PENDING (ERR_INVALID_STATE)"
          - "Participant.docs_complete must be true (ERR_DOCS_INCOMPLETE)"
        side_effects:
          - "participant.pipeline_stage recomputed (becomes DOCS_READY)"
      - from: DOCS_COMPLETE
        to: BOOKED
        trigger: "POST /api/referrals/{id}/book"
        actor: AgencyNavigator
        preconditions:
          - "Referral must be DOCS_COMPLETE (ERR_INVALID_STATE)"
          - "Target AccountOpeningEvent.status must be SCHEDULED (ERR_EVENT_NOT_BOOKABLE)"
          - "Event.institution_id must be CERTIFIED (ERR_INSTITUTION_NOT_CERTIFIED)"
          - "event.booked_count must be < event.capacity (ERR_EVENT_FULL)"
        side_effects:
          - "booked_event_id = event_id; event.booked_count += 1"
          - "participant.pipeline_stage recomputed (becomes EVENT_BOOKED)"
      - from: BOOKED
        to: DOCS_COMPLETE
        trigger: "POST /api/referrals/{id}/unbook OR system (event CANCELLED cascade)"
        actor: AgencyNavigator | system
        preconditions:
          - "Referral must be BOOKED (ERR_INVALID_STATE)"
        side_effects:
          - "booked_event_id cleared; event.booked_count -= 1 (seat restored)"
          - "participant.pipeline_stage recomputed (returns to DOCS_READY)"
      - from: BOOKED
        to: APPLIED
        trigger: "system (AccountApplication created referencing this referral)"
        actor: system
        preconditions: []
        side_effects:
          - "Event seat is released on application: event.booked_count -= 1 (booking consumed by the application)"
          - "participant.pipeline_stage recomputed (becomes APPLIED)"
      - from: DOCS_COMPLETE
        to: APPLIED
        trigger: "system (AccountApplication created referencing this referral without event booking)"
        actor: system
        preconditions: []
        side_effects:
          - "participant.pipeline_stage recomputed (becomes APPLIED)"
      - from: APPLIED
        to: CLOSED_CONVERTED
        trigger: "system (linked AccountApplication transitions to OPENED)"
        actor: system
        preconditions: []
        side_effects:
          - "If referral.campaign_id set: campaign.spent_cents += campaign.per_conversion_cents"
      - from: APPLIED
        to: CLOSED_LOST
        trigger: "system (linked AccountApplication transitions to DECLINED_ID or DECLINED_FINAL)"
        actor: system
        preconditions: []
        side_effects:
          - "participant.pipeline_stage recomputed"

  - entity: AccountOpeningEvent
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /api/account-opening-events/{id}/cancel OR system (institution DECERTIFIED cascade)"
        actor: InstitutionOfficer | system
        preconditions:
          - "Event must be SCHEDULED (ERR_INVALID_STATE)"
          - "Officer-initiated: acting institution must equal event.institution_id (ERR_UNAUTHORIZED_ROLE)"
        side_effects:
          - "Each Referral in BOOKED with booked_event_id = this event transitions to DOCS_COMPLETE, booked_event_id cleared, booked_count decremented"
          - "Each affected Participant.pipeline_stage recomputed"
      - from: SCHEDULED
        to: COMPLETED
        trigger: "system (ops/evaluate-due when logical clock now > ends_at)"
        actor: system
        preconditions: []
        side_effects:
          - "Remaining BOOKED referrals are released to DOCS_COMPLETE with seats freed (same per-referral side effects as cancel)"

  - entity: AccountApplication
    initial_state: SUBMITTED
    terminal_states: [DECLINED_ID, DECLINED_FINAL, CLOSED_EARLY]
    transitions:
      - from: SUBMITTED
        to: OPENED
        trigger: "POST /api/account-applications/{id}/decision with outcome=APPROVE"
        actor: InstitutionOfficer
        preconditions:
          - "Application must be SUBMITTED or REINSTATED (ERR_INVALID_STATE)"
          - "Institution must be CERTIFIED (ERR_INSTITUTION_NOT_CERTIFIED)"
          - "If participant.prior_banking_record = FLAGGED or decision chex_flagged=true: a RESOLVED BarrierCase for this application must exist (ERR_BARRIER_UNRESOLVED)"
          - "If institution's certified standard requires_financial_education: participant must hold a COMPLETED or FOLLOW_UP_* EducationPairing (ERR_EDUCATION_REQUIRED)"
        side_effects:
          - "account_number minted; opened_at = logical clock now; decided_by_user_id recorded"
          - "Two RetentionCheckpoint rows created: M6 due opened_at+183d, M12 due opened_at+365d, status PENDING"
          - "Linked referral (if any) -> CLOSED_CONVERTED (with campaign spend side effect)"
          - "participant.pipeline_stage recomputed (becomes ACCOUNT_OPENED)"
          - "institution.accounts_opened_total += 1"
      - from: REINSTATED
        to: OPENED
        trigger: "POST /api/account-applications/{id}/decision with outcome=APPROVE"
        actor: InstitutionOfficer
        preconditions:
          - "Same as SUBMITTED -> OPENED"
        side_effects:
          - "Same as SUBMITTED -> OPENED"
      - from: SUBMITTED
        to: DECLINED_CHEX
        trigger: "POST /api/account-applications/{id}/decision with outcome=DECLINE, decline_reason=CHEX"
        actor: InstitutionOfficer
        preconditions:
          - "Application must be SUBMITTED or REINSTATED (ERR_INVALID_STATE)"
        side_effects:
          - "BarrierCase created (status OPEN, negotiation_rounds=0) linked to this application — ChexSystems second-look"
      - from: REINSTATED
        to: DECLINED_CHEX
        trigger: "POST /api/account-applications/{id}/decision with outcome=DECLINE, decline_reason=CHEX"
        actor: InstitutionOfficer
        preconditions:
          - "Application must be SUBMITTED or REINSTATED (ERR_INVALID_STATE)"
        side_effects:
          - "A new BarrierCase is created (a declined-again application may open a fresh case)"
      - from: SUBMITTED
        to: DECLINED_ID
        trigger: "POST /api/account-applications/{id}/decision with outcome=DECLINE, decline_reason=INSUFFICIENT_ID"
        actor: InstitutionOfficer
        preconditions:
          - "Application must be SUBMITTED or REINSTATED (ERR_INVALID_STATE)"
        side_effects:
          - "Linked referral -> CLOSED_LOST; participant.pipeline_stage recomputed"
      - from: SUBMITTED
        to: DECLINED_FINAL
        trigger: "POST /api/account-applications/{id}/decision with outcome=DECLINE, decline_reason=OTHER OR system (BarrierCase DENIED_FINAL cascade)"
        actor: InstitutionOfficer | system
        preconditions:
          - "Application must be SUBMITTED or REINSTATED (ERR_INVALID_STATE) for officer path"
        side_effects:
          - "Linked referral -> CLOSED_LOST; participant.pipeline_stage recomputed"
      - from: DECLINED_CHEX
        to: REINSTATED
        trigger: "system (linked BarrierCase transitions to RESOLVED)"
        actor: system
        preconditions: []
        side_effects:
          - "Application may be re-decided; decided_by_user_id unchanged until next decision"
      - from: DECLINED_CHEX
        to: DECLINED_FINAL
        trigger: "system (linked BarrierCase transitions to DENIED_FINAL)"
        actor: system
        preconditions: []
        side_effects:
          - "Linked referral -> CLOSED_LOST; participant.pipeline_stage recomputed"
      - from: OPENED
        to: CLOSED_EARLY
        trigger: "POST /api/account-applications/{id}/report-closure"
        actor: InstitutionOfficer
        preconditions:
          - "Application must be OPENED (ERR_INVALID_STATE)"
          - "Acting institution must equal application.institution_id (ERR_UNAUTHORIZED_ROLE)"
        side_effects:
          - "closed_at = payload closed_at (must be >= opened_at, ERR_VALIDATION)"
          - "Pending RetentionCheckpoints remain PENDING until ops/evaluate-due resolves them as EVALUATED_NOT_RETAINED"

  - entity: BarrierCase
    initial_state: OPEN
    terminal_states: [RESOLVED, DENIED_FINAL]
    transitions:
      - from: OPEN
        to: PLAN_PROPOSED
        trigger: "POST /api/barrier-cases/{id}/propose"
        actor: InstitutionOfficer
        preconditions:
          - "Case must be OPEN or COUNTERED (ERR_INVALID_STATE)"
          - "Acting institution must equal case.institution_id (ERR_UNAUTHORIZED_ROLE)"
        side_effects:
          - "proposed_settlement_cents = payload amount"
      - from: COUNTERED
        to: PLAN_PROPOSED
        trigger: "POST /api/barrier-cases/{id}/propose"
        actor: InstitutionOfficer
        preconditions:
          - "Case must be OPEN or COUNTERED (ERR_INVALID_STATE)"
          - "Acting institution must equal case.institution_id"
        side_effects:
          - "proposed_settlement_cents overwritten by new proposal"
      - from: PLAN_PROPOSED
        to: COUNTERED
        trigger: "POST /api/barrier-cases/{id}/counter"
        actor: AgencyNavigator
        preconditions:
          - "Case must be PLAN_PROPOSED (ERR_INVALID_STATE)"
        side_effects:
          - "negotiation_rounds += 1"
      - from: PLAN_PROPOSED
        to: RESOLVED
        trigger: "POST /api/barrier-cases/{id}/accept"
        actor: Participant
        preconditions:
          - "Case must be PLAN_PROPOSED (ERR_INVALID_STATE)"
          - "Acting Participant X-User-ID must equal case.participant_id (ERR_UNAUTHORIZED_ROLE)"
        side_effects:
          - "final_settlement_cents = proposed_settlement_cents (pinned)"
          - "Linked AccountApplication DECLINED_CHEX -> REINSTATED (cascade link 2)"
          - "Participant.pipeline_stage recomputed (cascade link 3)"
      - from: COUNTERED
        to: DENIED_FINAL
        trigger: "POST /api/barrier-cases/{id}/escalate"
        actor: InstitutionOfficer
        preconditions:
          - "Case must be COUNTERED (ERR_INVALID_STATE)"
          - "negotiation_rounds must be >= 3 (MAX_NEGOTIATION_ROUNDS) (ERR_NEGOTIATION_ROUNDS_REMAINING)"
        side_effects:
          - "Linked AccountApplication DECLINED_CHEX -> DECLINED_FINAL (cascade)"
          - "Linked referral -> CLOSED_LOST; participant.pipeline_stage recomputed"

  - entity: EducationPairing
    initial_state: ACTIVE
    terminal_states: [FOLLOW_UP_DONE]
    transitions:
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /api/education-pairings/{id}/complete"
        actor: FinancialCoach
        preconditions:
          - "Pairing must be ACTIVE (ERR_INVALID_STATE)"
          - "Acting coach X-User-ID must equal pairing.coach_id (ERR_UNAUTHORIZED_ROLE)"
        side_effects:
          - "completed_at = logical clock now; follow_up_due_at = completed_at + 30d"
      - from: COMPLETED
        to: FOLLOW_UP_DUE
        trigger: "system (ops/evaluate-due when logical clock now >= follow_up_due_at)"
        actor: system
        preconditions: []
        side_effects: []
      - from: FOLLOW_UP_DUE
        to: FOLLOW_UP_DONE
        trigger: "POST /api/education-pairings/{id}/log-follow-up"
        actor: FinancialCoach
        preconditions:
          - "Pairing must be FOLLOW_UP_DUE (ERR_FOLLOW_UP_NOT_DUE when COMPLETED but not yet due; ERR_INVALID_STATE otherwise)"
          - "Acting coach X-User-ID must equal pairing.coach_id"
        side_effects:
          - "follow_up_logged_at = logical clock now"

  - entity: RetentionCheckpoint
    initial_state: PENDING
    terminal_states: [EVALUATED_RETAINED, EVALUATED_NOT_RETAINED, EXPIRED_UNCONFIRMED]
    transitions:
      - from: PENDING
        to: EVALUATED_RETAINED
        trigger: "system (ops/evaluate-due when logical clock date >= due_date and application status = OPENED)"
        actor: system
        preconditions: []
        side_effects:
          - "evaluated_at = logical clock now"
      - from: PENDING
        to: EVALUATED_NOT_RETAINED
        trigger: "system (ops/evaluate-due when logical clock date >= due_date and application status = CLOSED_EARLY with closed_at date <= due_date)"
        actor: system
        preconditions: []
        side_effects:
          - "evaluated_at = logical clock now"
      - from: PENDING
        to: EXPIRED_UNCONFIRMED
        trigger: "system (ops/evaluate-due when logical clock date >= window_end and application still OPENED but institution not CERTIFIED so status cannot be confirmed)"
        actor: system
        preconditions: []
        side_effects:
          - "evaluated_at = logical clock now"
        note: "Evaluation ordering inside a batch: checkpoints processed by (due_date ASC, created_at ASC) tie-break; never by id"

  - entity: FundingGrant
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /api/funding-grants/{id}/activate"
        actor: CoalitionAdmin
        preconditions:
          - "Grant must be DRAFT (ERR_INVALID_STATE)"
        side_effects: []
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /api/funding-grants/{id}/suspend"
        actor: CoalitionAdmin
        preconditions:
          - "Grant must be ACTIVE (ERR_INVALID_STATE)"
        side_effects:
          - "Every PartnerReport of this grant in SUBMITTED transitions to DRAFT (cascade link 2)"
          - "Each such report's claim_total_cents reservation is released: grant.reserved_cents -= claim, grant.available_cents += claim (cascade link 3)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /api/funding-grants/{id}/activate"
        actor: CoalitionAdmin
        preconditions:
          - "Grant must be DRAFT or SUSPENDED (ERR_INVALID_STATE)"
        side_effects: []
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /api/funding-grants/{id}/close"
        actor: CoalitionAdmin
        preconditions:
          - "Grant must be ACTIVE (ERR_INVALID_STATE)"
          - "No PartnerReport of this grant in SUBMITTED and reserved_cents = 0 (ERR_GRANT_HAS_PENDING_CLAIMS)"
        side_effects: []

  - entity: PartnerReport
    initial_state: DRAFT
    terminal_states: [APPROVED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /api/partner-reports/{id}/submit"
        actor: InstitutionOfficer
        preconditions:
          - "Report must be DRAFT or REJECTED (ERR_INVALID_STATE)"
          - "Grant must be ACTIVE (ERR_GRANT_NOT_ACTIVE)"
          - "claim_total_cents <= grant.per_report_cap_cents (ERR_CLAIM_EXCEEDS_CAP)"
          - "claim_total_cents <= grant.available_cents (ERR_INSUFFICIENT_GRANT_FUNDS)"
        side_effects:
          - "grant.reserved_cents += claim_total_cents; grant.available_cents -= claim_total_cents"
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /api/partner-reports/{id}/submit"
        actor: InstitutionOfficer
        preconditions:
          - "Same as DRAFT -> SUBMITTED; claim recomputed at resubmit against current data"
        side_effects:
          - "Same reservation side effects; claim fields recomputed"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /api/partner-reports/{id}/review with outcome=APPROVE"
        actor: CoalitionAdmin
        preconditions:
          - "Report must be SUBMITTED (ERR_INVALID_STATE)"
        side_effects:
          - "grant.reserved_cents -= claim_total_cents; grant.disbursed_cents += claim_total_cents (net available unchanged)"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /api/partner-reports/{id}/review with outcome=REJECT"
        actor: CoalitionAdmin
        preconditions:
          - "Report must be SUBMITTED (ERR_INVALID_STATE)"
        side_effects:
          - "grant.reserved_cents -= claim_total_cents; grant.available_cents += claim_total_cents (reservation released — compensation)"
      - from: SUBMITTED
        to: DRAFT
        trigger: "system (grant SUSPENDED cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "Reservation released (grant.reserved_cents -= claim_total_cents)"

  - entity: OutreachCampaign
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /api/outreach-campaigns/{id}/close"
        actor: CoalitionAdmin
        preconditions:
          - "Campaign must be ACTIVE (ERR_INVALID_STATE)"
        side_effects:
          - "No new referrals may reference a CLOSED campaign (ERR_INVALID_STATE on create)"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: review-create-stale-institution
    parent_entity: PartnerInstitution
    write_endpoint: "POST /api/certification-reviews"
    occ_field: "expected_institution_version"
    description: |
      Creating a CertificationReview against a PartnerInstitution whose version
      has advanced since the client last observed it is rejected. A successful
      review creation supersedes the institution's live DRAFT/SCORED review and
      advances institution.version, so a second create carrying the previously
      observed version is acting on a stale view of the institution.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: report-create-stale-grant
    parent_entity: FundingGrant
    write_endpoint: "POST /api/partner-reports"
    occ_field: "expected_grant_version"
    description: |
      Creating a PartnerReport against a FundingGrant whose version has advanced
      since the client last observed it is rejected. Report creation advances
      grant.version (ledger anchor touch), so a create carrying the previously
      observed version is acting on a stale view of the grant's ledger state.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: certification_score
    trigger: "POST /api/certification-reviews/{id}/score"
    algorithm: weighted_scoring
    formula: |
      Weights (constants below): FEE_COMPLIANCE 0.25, ACCESS 0.20, ALT_ID 0.15, CHEX_POLICY 0.20, EDUCATION_SUPPORT 0.20.
      weighted_score = round_half_up(100 * SUM(weight_i * rating_i) / 4, 2)   # ratings 0..4
      mandatory_floor_failed = (rating[FEE_COMPLIANCE] <= 1) OR (rating[CHEX_POLICY] <= 1)
      Outcome at finalize (rubric pinned by review.standard_id -> AccountStandard.rubric_mode):
        STANDARD_RUBRIC:    FAIL if mandatory_floor_failed; else PASS if weighted_score >= 90.00;
                            else CONDITIONAL if weighted_score >= 75.00; else FAIL
        REMEDIATION_RUBRIC: FAIL if mandatory_floor_failed; else PASS if weighted_score >= 85.00;
                            else CONDITIONAL if weighted_score >= 70.00; else FAIL
    input_set: "certification_review.criteria_ratings — exactly one rating per criterion; all 5 required"
    constants:
      W_FEE_COMPLIANCE: 0.25
      W_ACCESS: 0.20
      W_ALT_ID: 0.15
      W_CHEX_POLICY: 0.20
      W_EDUCATION_SUPPORT: 0.20
      STANDARD_PASS: 90.00
      STANDARD_CONDITIONAL: 75.00
      REMEDIATION_PASS: 85.00
      REMEDIATION_CONDITIONAL: 70.00
      MANDATORY_FLOOR_RATING: 1
    precision: "2 decimal places, round_half_up"
    variants:
      - name: standard_rubric
        when: "pinned standard.rubric_mode = STANDARD_RUBRIC"
        difference: "PASS threshold 90.00, CONDITIONAL floor 75.00"
      - name: remediation_rubric
        when: "pinned standard.rubric_mode = REMEDIATION_RUBRIC"
        difference: "PASS threshold 85.00, CONDITIONAL floor 70.00 — identical ratings yield a different outcome band"

  - name: claim_computation
    trigger: "POST /api/partner-reports (create) and again on resubmit of a REJECTED report"
    algorithm: tiered_pricing
    formula: |
      Evaluation order is PINNED (circular-looking dependency resolved):
        (1) eligible_opened = AccountApplications of institution with status OPENED or CLOSED_EARLY
            whose opened_at date falls in [period_start, period_end] (inclusive both ends),
            ordered by opened_at ASC, then created_at ASC for tier assignment (never by id).
        (2) opening tier per account by its 1-based rank n in eligible_opened:
            n <= TIER1_MAX(25): gross 5000; 26..TIER2_MAX(100): gross 7500; n > 100: gross 10000.
        (3) ROUNDING ORDER PINNED: net_per_account = round_half_up_to_integer_cents(gross * (1 - ADMIN_WITHHOLDING_BPS/10000));
            opening_claim_cents = SUM(net_per_account). Summing first and rounding once is FORBIDDEN
            (yields different cents: e.g. 3 x round(5000*0.9925)=3x4963=14889 vs round(15000*0.9925)=14888).
        (4) retention_rate_m6 / retention_rate_m12 per retention_rate calculation using report.evaluation_mode variant.
        (5) retained_count = size of the retained numerator set over M6 UNION M12 eligible checkpoints;
            bonus tier: retention_rate_m6 (primary rate) >= 0.80 -> 2500 per retained; >= 0.60 -> 1500; else 0.
            retention_bonus_cents = tier_rate * retained_count.
        (6) education_stipend_cents: if the institution's certified standard.requires_financial_education AND
            (# of eligible_opened whose participant holds COMPLETED|FOLLOW_UP_* pairing) / opened_count >= 0.5,
            stipend = round_half_up_to_integer_cents(0.10 * (opening_claim_cents + retention_bonus_cents));
            the stipend is computed on the PRE-STIPEND subtotal — it MUST NOT feed back into its own base.
            Otherwise stipend = 0. Division by zero: opened_count = 0 -> stipend = 0.
        (7) claim_total_cents = opening_claim_cents + retention_bonus_cents + education_stipend_cents.
    input_set: "Applications of report.institution_id by opened_at date in period; RetentionCheckpoints of those applications with due_date <= period_end"
    constants:
      TIER1_MAX: 25
      TIER2_MAX: 100
      TIER1_GROSS_CENTS: 5000
      TIER2_GROSS_CENTS: 7500
      TIER3_GROSS_CENTS: 10000
      ADMIN_WITHHOLDING_BPS: 75
      BONUS_TIER_HIGH: 0.80
      BONUS_TIER_MID: 0.60
      BONUS_HIGH_CENTS: 2500
      BONUS_MID_CENTS: 1500
      EDUCATION_STIPEND_RATE: 0.10
      EDUCATION_COMPLETION_FLOOR: 0.50
    precision: "integer cents, round_half_up per account before summing"
    variants:
      - name: provisional_claim
        when: "report.evaluation_mode = PROVISIONAL"
        difference: "retention numerator counts EVALUATED_RETAINED + PENDING + EXPIRED_UNCONFIRMED checkpoints"
      - name: final_claim
        when: "report.evaluation_mode = FINAL"
        difference: "retention numerator counts EVALUATED_RETAINED only — same data yields lower rate and lower bonus"

  - name: retention_rate
    trigger: "claim_computation step (4); also surfaced on PartnerReport computed fields"
    algorithm: aggregation
    formula: |
      eligible(kind) = RetentionCheckpoints whose application belongs to report.institution_id,
        checkpoint.kind = kind, and due_date <= period_end.
      rate(kind) = |retained(kind)| / |eligible(kind)|; 4 decimal places, round_half_up.
      Empty eligible set -> rate is null (NOT 0.0) and contributes 0 to bonus; tier lookup treats null as no-tier.
    input_set: "RetentionCheckpoints filtered by kind and due_date <= period_end"
    constants:
      M6_OFFSET_DAYS: 183
      M12_OFFSET_DAYS: 365
      EVAL_WINDOW_DAYS: 30
    precision: "4 decimal places, round_half_up"
    variants:
      - name: provisional
        when: "report.evaluation_mode = PROVISIONAL"
        difference: "retained(kind) = checkpoints in {EVALUATED_RETAINED, PENDING, EXPIRED_UNCONFIRMED} — optimistic"
      - name: final
        when: "report.evaluation_mode = FINAL"
        difference: "retained(kind) = checkpoints in {EVALUATED_RETAINED} only — strict positive confirmation"

  - name: grant_ledger
    trigger: "report submit / review approve / review reject / grant suspend cascade"
    algorithm: aggregation
    formula: |
      reserved_cents  = SUM(claim_total_cents) over PartnerReports of grant with status = SUBMITTED
      disbursed_cents = SUM(claim_total_cents) over PartnerReports of grant with status = APPROVED
      available_cents = total_cents - reserved_cents - disbursed_cents
      INVARIANT (conserved quantity: cents): available_cents + reserved_cents + disbursed_cents == total_cents
      at every observable instant, including across submit->review-REJECT compensation.
    input_set: "PartnerReports filtered by grant_id and status"
    precision: "integer cents"

  - name: event_capacity
    trigger: "POST /api/referrals/{id}/book and /unbook, event cancel/complete cascades"
    algorithm: aggregation
    formula: |
      booked_count = COUNT(Referral where booked_event_id = event.id AND status = BOOKED)
      Booking admitted iff booked_count < capacity (boundary: booked_count == capacity -> ERR_EVENT_FULL).
      INVARIANT (conserved quantity: seats): booked then unbook restores booked_count exactly;
      booked_count + remaining_seats == capacity at every observable instant.
    input_set: "Referrals with booked_event_id = event.id in status BOOKED"
    precision: "integer count"

  - name: review_gap_check
    trigger: "POST /api/certification-reviews"
    algorithm: interval_merge
    formula: |
      For the same institution_id, let prior = the non-SUPERSEDED, non-DRAFT-superseded review with the
      latest period_end (terminal or live). New period_start must satisfy:
        period_start >= prior.period_end + 30 days   (closed intervals with a 30-day buffer; equality allowed)
      Otherwise ERR_REVIEW_GAP_VIOLATION. First review for an institution: no gap constraint.
    input_set: "CertificationReviews of the institution excluding SUPERSEDED"
    constants:
      MIN_REVIEW_GAP_DAYS: 30
    precision: "whole days, date arithmetic"

  - name: campaign_overlap_check
    trigger: "POST /api/outreach-campaigns"
    algorithm: interval_merge
    formula: |
      New ACTIVE campaign c conflicts iff exists another ACTIVE campaign c2 with
      c2.zip_cluster = c.zip_cluster AND c.window_start < c2.window_end AND c2.window_start < c.window_end
      (half-open [start, end) semantics: adjacency — c.window_start == c2.window_end — does NOT conflict).
      Budget rule (aggregate): SUM(budget_cents) over ACTIVE campaigns of the zip_cluster + new budget
      must be <= REGIONAL_CAP_CENTS, else ERR_CAMPAIGN_BUDGET_EXCEEDED (equality allowed).
    input_set: "OutreachCampaigns with status = ACTIVE and matching zip_cluster"
    constants:
      REGIONAL_CAP_CENTS: 500000
    precision: "whole days; integer cents"

  - name: coach_caseload
    trigger: "POST /api/education-pairings"
    algorithm: aggregation
    formula: |
      active_load = COUNT(EducationPairing where coach_id = X AND status = ACTIVE)
      Create admitted iff active_load < MAX_ACTIVE_PAIRINGS_PER_COACH (== limit -> ERR_COACH_CASELOAD_FULL).
    input_set: "EducationPairings by coach_id with status ACTIVE"
    constants:
      MAX_ACTIVE_PAIRINGS_PER_COACH: 3
    precision: "integer count"

  - name: participant_pipeline
    trigger: "any Referral/AccountApplication status change; Participant documents PATCH"
    algorithm: constraint_propagation
    formula: |
      pipeline_stage = first matching rule, precedence top-down:
        ACCOUNT_OPENED : any application OPENED
        APPLIED        : any application in {SUBMITTED, REINSTATED}
        EVENT_BOOKED   : any referral BOOKED
        DOCS_READY     : docs_complete = true
        REFERRED       : any referral in {DOCS_PENDING, DOCS_COMPLETE}
        REGISTERED     : otherwise
    input_set: "All Referrals and AccountApplications of the participant, all statuses"
    precision: "enum"

  - name: checkpoint_schedule
    trigger: "AccountApplication -> OPENED"
    algorithm: projection
    formula: |
      On OPENED: create RetentionCheckpoint(kind=M6,  due_date = date(opened_at) + 183 days)
                 and RetentionCheckpoint(kind=M12, due_date = date(opened_at) + 365 days);
      window_end = due_date + 30 days for each.
    input_set: "The newly OPENED application"
    constants:
      M6_OFFSET_DAYS: 183
      M12_OFFSET_DAYS: 365
      EVAL_WINDOW_DAYS: 30
    precision: "whole days"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "Role is listed in the endpoint's roles; entity_backed ownership: InstitutionOfficer X-User-ID must equal the target resource's institution_id; Participant X-User-ID must equal barrier-case participant_id; FinancialCoach X-User-ID must equal pairing.coach_id on complete/log-follow-up"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: existence
    check: "Request body well-formed; every required field present with correct type; enum values in declared sets"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all endpoints"
  - priority: 4
    category: existence
    check: "Path and body-referenced resources exist, validated left-to-right (path ids first, then body FKs in input order)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"
  - priority: 5
    category: state
    check: "Target resource is in a state from which the requested transition exists (incl. OCC version match: expected_*_version == current parent version)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action/transition endpoints"
  - priority: 6
    category: state
    check: "OCC stale version: expected_institution_version / expected_grant_version mismatch on the two concurrency-rule write endpoints"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /api/certification-reviews, POST /api/partner-reports"
  - priority: 7
    category: business_safety
    check: "Compliance gates: SoD (review scorer != finalizer -> ERR_SOD_VIOLATION); participant docs_complete for referral docs-complete and application create (ERR_DOCS_INCOMPLETE); id_type_presented must be a VERIFIED participant doc AND permitted by the certified standard's accepted_alt_id_types when not STATE_ID (ERR_ALT_ID_NOT_ACCEPTED); ChexSystems second-look: APPROVE with flagged record requires RESOLVED barrier case (ERR_BARRIER_UNRESOLVED); education-required standards need COMPLETED pairing (ERR_EDUCATION_REQUIRED); follow-up logging only when FOLLOW_UP_DUE (ERR_FOLLOW_UP_NOT_DUE)"
    error_id: ERR_SOD_VIOLATION
    http_status: 409
    applies_to: "finalize, docs-complete, application create/decision, log-follow-up"
  - priority: 8
    category: business_temporal
    check: "Temporal conflicts: event venue window overlap [starts_at, ends_at) same institution+venue (ERR_EVENT_WINDOW_CONFLICT); certification review 30-day min gap (ERR_REVIEW_GAP_VIOLATION); outreach campaign zip-cluster half-open overlap (ERR_CAMPAIGN_OVERLAP); event starts_at < ends_at, period_start <= period_end (ERR_VALIDATION)"
    error_id: ERR_EVENT_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST events, POST certification-reviews, POST outreach-campaigns"
  - priority: 9
    category: business_referential
    check: "Cross-entity state: institution CERTIFIED for event creation, booking, application create/decision (ERR_INSTITUTION_NOT_CERTIFIED); standard EFFECTIVE for review creation (ERR_STANDARD_NOT_EFFECTIVE); grant ACTIVE for report submit (ERR_GRANT_NOT_ACTIVE); referral belongs to same participant and booked event matches (ERR_REFERRAL_MISMATCH); event SCHEDULED for booking (ERR_EVENT_NOT_BOOKABLE); campaign ACTIVE for campaign referrals (ERR_INVALID_STATE)"
    error_id: ERR_INSTITUTION_NOT_CERTIFIED
    http_status: 409
    applies_to: "event/booking/application/report endpoints"
  - priority: 10
    category: business_fiscal
    check: "Capacity/quota/fiscal: event booked_count < capacity (ERR_EVENT_FULL); coach active_load < 3 (ERR_COACH_CASELOAD_FULL); claim <= per_report_cap (ERR_CLAIM_EXCEEDS_CAP); claim <= grant.available_cents (ERR_INSUFFICIENT_GRANT_FUNDS); campaign cluster budget <= 500000 (ERR_CAMPAIGN_BUDGET_EXCEEDED); grant close requires no pending claims (ERR_GRANT_HAS_PENDING_CLAIMS); barrier escalate requires negotiation_rounds >= 3 (ERR_NEGOTIATION_ROUNDS_REMAINING); reinstate before expiry (ERR_CERTIFICATION_LAPSED)"
    error_id: ERR_EVENT_FULL
    http_status: 409
    applies_to: "booking, pairing create, report submit, grant close, barrier escalate, reinstate"

