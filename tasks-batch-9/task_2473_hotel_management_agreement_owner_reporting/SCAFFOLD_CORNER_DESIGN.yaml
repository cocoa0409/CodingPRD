            - "the clock-set response reports terminated_agreement_count == 1 and ManagementAgreement.${tl_agr}.status == TERMINATED"
            - "ManagementAgreement.${tl_agr}.termination_effective_utc == 2026-08-02T00:00:00Z and distribution_hold == true"
