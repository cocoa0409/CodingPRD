            - { call: "POST /api/title-searches/${ts}/complete", payload: { findings: [] }, as: EscrowOfficer }
            - { call: "POST /api/escrow-files/${f}/documents", payload: { doc_type: "WIRE_AUTHORIZATION", required_signer_party_ids: ["${b}"] }, as: EscrowOfficer, captures: { doc: $.data.id } }
            - { call: "POST /api/documents/${doc}/send", payload: {}, as: EscrowOfficer }
