# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index) — task 0715
# Cross-references SCAFFOLD.yaml §1.1–§1.7 against the nine §0.5 Difficulty
# Rules. EXPERT band. Every grounds[] ref resolves into this task's own
# SCAFFOLD.yaml. Setup chains drive empty-DB -> precondition using only §1.5
# endpoints. Default logical clock = 2026-03-01T00:00:00Z (per §1.5 clock ep).
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: dual_variant_sla_deadline_vs_live_breach
        grounds:
          - calculations.remediation_sla_deadline
          - entities.Finding.fields.sla_due_at
          - entities.Finding.fields.sla_breached
        distinguishing_aspect: |
          On the Finding domain: variant projected_at_creation freezes sla_due_at
          against created_at, while variant live_breach_evaluation re-evaluates
          sla_breached against the logical clock on every read; the same Finding
          row yields sla_breached=false before the deadline and true after the
          clock passes it, with sla_due_at itself unchanged.
        test_recipe:
          setup:
            - "ELITE Client with retainer 100h, period 0; one ACTIVE Asset (HIGH criticality)."
            - "Engagement VULN_SCAN authorized+started, one COMPLETED scan; a Finding cvss_base=7.5 (base HIGH, HIGH crit escalates to CRITICAL) -> SLA = created_at + 24*0.5 = +12h."
            - "Clock starts at default 2026-03-01T00:00:00Z. Read once pre-deadline, advance clock past it, read again."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Elite Co", tier: "ELITE", retainer_hours_per_period: 100 }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /assets"
              payload: { client_id: "${client_id}", hostname: "web-01", ip_address: "10.0.0.1", criticality: "HIGH", exposure: "EXTERNAL" }
              as: PlatformAdmin
              captures: { asset_id: $.data.id }
            - call: "POST /engagements"
              payload: { client_id: "${client_id}", kind: "VULN_SCAN", authorized_window_start: "2026-03-01T00:00:00Z", authorized_window_end: "2026-04-01T00:00:00Z", estimated_hours: 10, scope_asset_ids: ["${asset_id}"] }
              as: EngagementLead
              captures: { eng_id: $.data.id }
            - call: "POST /engagements/${eng_id}/authorize"
              payload: {}
              as: ClientContact
            - call: "POST /engagements/${eng_id}/start"
              payload: {}
              as: EngagementLead
              captures: { eng_v2: $.data.version }
            - call: "POST /scans"
              payload: { engagement_id: "${eng_id}", expected_engagement_version: "${eng_v2}" }
              as: EngagementLead
              captures: { scan_id: $.data.id }
            - call: "POST /scans/${scan_id}/start"
              payload: {}
              as: EngagementLead
            - call: "POST /scans/${scan_id}/complete"
              payload: { actual_hours: 5, raw_finding_count: 1 }
              as: EngagementLead
            - call: "POST /findings"
              payload: { scan_id: "${scan_id}", asset_id: "${asset_id}", title: "RCE", cvss_base: 7.5 }
              as: SocAnalyst
              captures: { finding_id: $.data.id, due_at: $.data.sla_due_at }
            - call: "GET /findings/${finding_id}"
              payload: {}
              as: EngagementLead
              captures: { breach_pre: $.data.sla_breached }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-05T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /findings/${finding_id}"
              payload: {}
              as: EngagementLead
              captures: { breach_post: $.data.sla_breached, due_post: $.data.sla_due_at }
          assert:
            - "Finding.${finding_id}.severity == CRITICAL"
            - "Pre-advance read: Finding.${finding_id}.sla_breached == false"
            - "Post-advance read: Finding.${finding_id}.sla_breached == true"
            - "Finding.${finding_id}.sla_due_at is identical across both reads (projected_at_creation frozen against created_at)"

      - name: dual_variant_retainer_optimistic_vs_actual
        grounds:
          - calculations.retainer_hours_available
          - entities.RetainerLedger.fields.hours_reserved
          - entities.RetainerLedger.fields.hours_consumed
          - entities.RetainerLedger.fields.hours_available
        distinguishing_aspect: |
          On the RetainerLedger domain: variant optimistic_reservation reserves the
          full estimated_hours (40) at authorize so hours_available drops to 60 before
          any work; variant actual_consumption replaces reservation with measured
          actual_hours (30) at scan complete, leaving hours_reserved=10, hours_consumed=30,
          hours_available=60 — a different reserved/consumed split for the same end value.
        test_recipe:
          setup:
            - "ACTIVE Client retainer 100h period 0; one ACTIVE Asset; Engagement estimated_hours=40 authorized (reserves 40)."
            - "Engagement started; one scan completed with actual_hours=30."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Ess Co", tier: "ESSENTIAL", retainer_hours_per_period: 100 }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /assets"
              payload: { client_id: "${client_id}", hostname: "db-01", ip_address: "10.0.0.2", criticality: "MEDIUM" }
              as: PlatformAdmin
              captures: { asset_id: $.data.id }
            - call: "POST /engagements"
              payload: { client_id: "${client_id}", kind: "VULN_SCAN", authorized_window_start: "2026-03-01T00:00:00Z", authorized_window_end: "2026-04-01T00:00:00Z", estimated_hours: 40, scope_asset_ids: ["${asset_id}"] }
              as: EngagementLead
              captures: { eng_id: $.data.id }
            - call: "POST /engagements/${eng_id}/authorize"
              payload: {}
              as: ClientContact
            - call: "GET /retainer-ledgers?client_id=${client_id}&period_index=0"
              payload: {}
              as: PlatformAdmin
              captures: { ledger_id: "$.data[0].id" }
            - call: "POST /engagements/${eng_id}/start"
              payload: {}
              as: EngagementLead
              captures: { eng_v2: $.data.version }
            - call: "POST /scans"
              payload: { engagement_id: "${eng_id}", expected_engagement_version: "${eng_v2}" }
              as: EngagementLead
              captures: { scan_id: $.data.id }
            - call: "POST /scans/${scan_id}/start"
              payload: {}
              as: EngagementLead
          trigger:
            - call: "POST /scans/${scan_id}/complete"
              payload: { actual_hours: 30, raw_finding_count: 0 }
              as: EngagementLead
          assert:
            - "After authorize (optimistic): RetainerLedger.${ledger_id}.hours_reserved == 40 and hours_available == 60"
            - "After scan complete (actual): RetainerLedger.${ledger_id}.hours_reserved == 10"
            - "After scan complete (actual): RetainerLedger.${ledger_id}.hours_consumed == 30"
            - "After scan complete (actual): RetainerLedger.${ledger_id}.hours_available == 60"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: combinatorial_alert_triage_three_factor_nonlinear
        grounds:
          - calculations.alert_triage_priority
          - entities.Alert.fields.triage_priority
          - entities.Asset.fields.criticality
          - entities.Asset.fields.exposure
        distinguishing_aspect: |
          Mode (a): triage_priority is a 3-input non-linear formula —
          raw_score*0.6 + criticality-keyed weight + exposure bonus — then banded
          into P1..P4 by >= thresholds; raw_score=70 on a HIGH/INTERNAL asset gives
          score 62.00 -> P2, whereas the same raw_score on a LOW/INTERNAL asset gives
          42.00 -> P3, so the band flips on the criticality/exposure terms, not raw_score.
        test_recipe:
          setup:
            - "ACTIVE Client; one ACTIVE Asset criticality=HIGH exposure=INTERNAL."
            - "Ingest an EDR alert raw_score=70 on that asset."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Triage Co", tier: "ADVANCED", retainer_hours_per_period: 50 }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /assets"
              payload: { client_id: "${client_id}", hostname: "edr-01", ip_address: "10.0.0.3", criticality: "HIGH", exposure: "INTERNAL" }
              as: PlatformAdmin
              captures: { asset_id: $.data.id }
          trigger:
            - call: "POST /alerts"
              payload: { client_id: "${client_id}", asset_id: "${asset_id}", source: "EDR", raw_score: 70 }
              as: SocAnalyst
              captures: { alert_id: $.data.id, prio: $.data.triage_priority }
          assert:
            - "Alert.${alert_id}.triage_priority == P2 (score = 70*0.6 + 20 + 0 = 62.00, P2_FLOOR 55)"

      - name: combinatorial_finding_severity_band_then_escalate_order
        grounds:
          - calculations.finding_severity
          - entities.Finding.fields.severity
          - entities.Finding.fields.cvss_base
          - entities.Asset.fields.criticality
        distinguishing_aspect: |
          Mode (c): finding_severity pins a two-step evaluation order — derive the
          base band from cvss_base FIRST, THEN apply criticality escalation — so a
          cvss_base=7.5 (base HIGH) on a HIGH-criticality asset escalates exactly one
          band to CRITICAL, whereas the same cvss_base on a LOW-criticality asset stays
          HIGH; reversing the order would mis-band the result.
        test_recipe:
          setup:
            - "Client; COMPLETED scan; one Asset HIGH criticality, one Asset LOW criticality."
            - "Two findings cvss_base=7.5: one on the HIGH asset, one on the LOW asset."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Sev Co", tier: "ESSENTIAL", retainer_hours_per_period: 100 }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /assets"
              payload: { client_id: "${client_id}", hostname: "high-01", ip_address: "10.0.0.4", criticality: "HIGH" }
              as: PlatformAdmin
              captures: { asset_high: $.data.id }
            - call: "POST /assets"
              payload: { client_id: "${client_id}", hostname: "low-01", ip_address: "10.0.0.5", criticality: "LOW" }
              as: PlatformAdmin
              captures: { asset_low: $.data.id }
            - call: "POST /engagements"
              payload: { client_id: "${client_id}", kind: "PENTEST", authorized_window_start: "2026-03-01T00:00:00Z", authorized_window_end: "2026-04-01T00:00:00Z", estimated_hours: 10, scope_asset_ids: ["${asset_high}", "${asset_low}"] }
              as: EngagementLead
              captures: { eng_id: $.data.id }
            - call: "POST /engagements/${eng_id}/authorize"
              payload: {}
              as: ClientContact
            - call: "POST /engagements/${eng_id}/start"
              payload: {}
              as: EngagementLead
              captures: { eng_v2: $.data.version }
            - call: "POST /scans"
              payload: { engagement_id: "${eng_id}", expected_engagement_version: "${eng_v2}" }
              as: EngagementLead
              captures: { scan_id: $.data.id }
            - call: "POST /scans/${scan_id}/start"
              payload: {}
              as: EngagementLead
            - call: "POST /scans/${scan_id}/complete"
              payload: { actual_hours: 5, raw_finding_count: 2 }
              as: EngagementLead
          trigger:
            - call: "POST /findings"
              payload: { scan_id: "${scan_id}", asset_id: "${asset_high}", title: "HighSev", cvss_base: 7.5 }
              as: SocAnalyst
              captures: { f_high: $.data.id, sev_high: $.data.severity }
            - call: "POST /findings"
              payload: { scan_id: "${scan_id}", asset_id: "${asset_low}", title: "LowSev", cvss_base: 7.5 }
              as: SocAnalyst
              captures: { f_low: $.data.id, sev_low: $.data.severity }
          assert:
            - "Finding.${f_high}.severity == CRITICAL (base HIGH, HIGH crit escalates +1 band)"
            - "Finding.${f_low}.severity == HIGH (base HIGH, LOW crit never escalates)"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: nonlinear_finding_retest_revision_cycle
        grounds:
          - state_machines.Finding.REMEDIATION_SUBMITTED_to_RETEST_FAILED
          - state_machines.Finding.RETEST_FAILED_to_REMEDIATION_IN_PROGRESS
          - state_machines.Finding.REMEDIATION_SUBMITTED_to_REMEDIATED
        distinguishing_aspect: |
          The Finding machine is cyclic: REMEDIATION_SUBMITTED -> RETEST_FAILED ->
          REMEDIATION_IN_PROGRESS is a revision loop that re-enters
          REMEDIATION_IN_PROGRESS a second time before a passing retest could reach
          REMEDIATED — distinct from any linear forward-only pipeline.
        test_recipe:
          setup:
            - "Client; COMPLETED scan; Finding cvss_base=5.0 (severity MEDIUM) submitted by SocAnalyst 'analyst-1'."
            - "Finding driven OPEN -> REMEDIATION_IN_PROGRESS -> REMEDIATION_SUBMITTED, then a failing retest by a DIFFERENT EngagementLead 'lead-1'."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Cyc Co", tier: "ESSENTIAL", retainer_hours_per_period: 100 }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /assets"
              payload: { client_id: "${client_id}", hostname: "cyc-01", ip_address: "10.0.0.6", criticality: "MEDIUM" }
              as: PlatformAdmin
              captures: { asset_id: $.data.id }
            - call: "POST /engagements"
              payload: { client_id: "${client_id}", kind: "VULN_SCAN", authorized_window_start: "2026-03-01T00:00:00Z", authorized_window_end: "2026-04-01T00:00:00Z", estimated_hours: 10, scope_asset_ids: ["${asset_id}"] }
              as: EngagementLead
              captures: { eng_id: $.data.id }
            - call: "POST /engagements/${eng_id}/authorize"
              payload: {}
              as: ClientContact
            - call: "POST /engagements/${eng_id}/start"
              payload: {}
              as: EngagementLead
              captures: { eng_v2: $.data.version }
            - call: "POST /scans"
              payload: { engagement_id: "${eng_id}", expected_engagement_version: "${eng_v2}" }
              as: EngagementLead
              captures: { scan_id: $.data.id }
            - call: "POST /scans/${scan_id}/start"
              payload: {}
              as: EngagementLead
            - call: "POST /scans/${scan_id}/complete"
              payload: { actual_hours: 5, raw_finding_count: 1 }
              as: EngagementLead
            - call: "POST /findings"
              payload: { scan_id: "${scan_id}", asset_id: "${asset_id}", title: "Loop", cvss_base: 5.0 }
              as: SocAnalyst
              as_user_id: "analyst-1"
              captures: { finding_id: $.data.id }
            - call: "POST /findings/${finding_id}/start-remediation"
              payload: {}
              as: ClientContact
            - call: "POST /findings/${finding_id}/submit-remediation"
              payload: {}
              as: ClientContact
            - call: "POST /findings/${finding_id}/retest"
              payload: { retest_passed: false }
              as: EngagementLead
              as_user_id: "lead-1"
          trigger:
            - call: "POST /findings/${finding_id}/start-remediation"
              payload: {}
              as: ClientContact
              captures: { status_after_loop: $.data.status }
          assert:
            - "Finding.${finding_id}.status == RETEST_FAILED after the failing retest"
            - "Finding.${finding_id}.status == REMEDIATION_IN_PROGRESS again after the loop start-remediation (cycle re-entry)"

      - name: nonlinear_incident_resolved_reopen_contain_cycle
        grounds:
          - state_machines.Incident.RESOLVED_to_REOPENED
          - state_machines.Incident.REOPENED_to_CONTAINED
          - entities.Incident.fields.contained_count
        distinguishing_aspect: |
          The Incident machine (different entity from Finding) is cyclic via
          RESOLVED -> REOPENED -> CONTAINED, which re-increments contained_count;
          a single incident reaches CONTAINED twice (contained_count == 2) proving a
          back-edge out of a non-terminal RESOLVED, unlike a linear close.
        test_recipe:
          setup:
            - "Client; CROWN_JEWEL/EXTERNAL Asset; Alert raw_score 90 triaged and promoted -> Incident DETECTED severity CRITICAL."
            - "Incident acknowledged, contained (count 1), resolved in period 0, then reopened in the same period."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Inc Co", tier: "ESSENTIAL", retainer_hours_per_period: 100 }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /assets"
              payload: { client_id: "${client_id}", hostname: "inc-01", ip_address: "10.0.0.7", criticality: "CROWN_JEWEL", exposure: "EXTERNAL" }
              as: PlatformAdmin
              captures: { asset_id: $.data.id }
            - call: "POST /alerts"
              payload: { client_id: "${client_id}", asset_id: "${asset_id}", source: "SIEM", raw_score: 90 }
              as: SocAnalyst
              captures: { alert_id: $.data.id }
            - call: "POST /alerts/${alert_id}/triage"
              payload: {}
              as: SocAnalyst
            - call: "POST /alerts/${alert_id}/promote"
              payload: {}
              as: SocAnalyst
              captures: { incident_id: $.data.promoted_incident_id }
            - call: "POST /incidents/${incident_id}/acknowledge"
              payload: {}
              as: SocAnalyst
            - call: "POST /incidents/${incident_id}/contain"
              payload: { quarantine_asset: false }
              as: SocAnalyst
            - call: "POST /incidents/${incident_id}/resolve"
              payload: { response_hours: 4 }
              as: EngagementLead
            - call: "POST /incidents/${incident_id}/reopen"
              payload: {}
              as: SocAnalyst
              captures: { status_reopened: $.data.status }
          trigger:
            - call: "POST /incidents/${incident_id}/contain"
              payload: {}
              as: SocAnalyst
              captures: { contained_count_final: $.data.contained_count }
          assert:
            - "Incident.${incident_id}.status == REOPENED after reopen, then CONTAINED after the trigger"
            - "Incident.${incident_id}.contained_count == 2 (re-incremented on the cycle's second containment)"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: cascade_alert_promote_incident_escalate_lockdown_depth3
        grounds:
          - state_machines.Alert.TRIAGED_to_PROMOTED
          - state_machines.Incident.DETECTED_to_ESCALATED
          - entities.Client.fields.posture
          - entities.Incident.fields.severity
        distinguishing_aspect: |
          Depth-3 chain originating at alert promote: promoting the Alert (A) creates an
          Incident (B); escalating that Incident (B) recomputes Client.posture (C) ->
          LOCKDOWN, which then blocks a subsequent engagement authorize (D) with
          ERR_POSTURE_LOCKDOWN — each link caused by the prior link, not the first action.
        test_recipe:
          setup:
            - "Client; CROWN_JEWEL/EXTERNAL Asset; Alert promoted -> Incident CRITICAL; a separate DRAFT engagement awaiting authorize."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Casc Co", tier: "ESSENTIAL", retainer_hours_per_period: 100 }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /assets"
              payload: { client_id: "${client_id}", hostname: "casc-01", ip_address: "10.0.0.8", criticality: "CROWN_JEWEL", exposure: "EXTERNAL" }
              as: PlatformAdmin
              captures: { asset_id: $.data.id }
            - call: "POST /alerts"
              payload: { client_id: "${client_id}", asset_id: "${asset_id}", source: "SIEM", raw_score: 90 }
              as: SocAnalyst
              captures: { alert_id: $.data.id }
            - call: "POST /alerts/${alert_id}/triage"
              payload: {}
              as: SocAnalyst
            - call: "POST /alerts/${alert_id}/promote"
              payload: {}
              as: SocAnalyst
              captures: { incident_id: $.data.promoted_incident_id }
            - call: "POST /engagements"
              payload: { client_id: "${client_id}", kind: "VULN_SCAN", authorized_window_start: "2026-03-01T00:00:00Z", authorized_window_end: "2026-04-01T00:00:00Z", estimated_hours: 10, scope_asset_ids: ["${asset_id}"] }
              as: EngagementLead
              captures: { eng_id: $.data.id }
          trigger:
            - call: "POST /incidents/${incident_id}/escalate"
              payload: {}
              as: EngagementLead
              captures: { inc_status: $.data.status }
            - call: "POST /engagements/${eng_id}/authorize"
              payload: {}
              as: ClientContact
              captures: { err: $.data.error_id }
          assert:
            - "Incident.${incident_id}.status == ESCALATED"
            - "GET /clients/${client_id}: Client.posture == LOCKDOWN after escalate"
            - "POST authorize returns ERR_POSTURE_LOCKDOWN (409) — posture cascade blocks the new authorization"

      - name: cascade_incident_contain_quarantine_asset_depth2
        grounds:
          - state_machines.Incident.ACKNOWLEDGED_to_CONTAINED
          - entities.Asset.fields.status
          - entities.Incident.fields.quarantined_asset_id
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (incident contain, not alert promote):
          containing the Incident with quarantine_asset=true mutates the triggering
          Alert's Asset.status -> QUARANTINED and stamps Incident.quarantined_asset_id;
          the asset mutation is caused by the contain transition, a distinct propagation
          pattern from the promote->escalate chain.
        test_recipe:
          setup:
            - "Client; Asset (HIGH/EXTERNAL, ACTIVE); Alert promoted to Incident; incident acknowledged."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Quar Co", tier: "ESSENTIAL", retainer_hours_per_period: 100 }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /assets"
              payload: { client_id: "${client_id}", hostname: "quar-01", ip_address: "10.0.0.9", criticality: "HIGH", exposure: "EXTERNAL" }
              as: PlatformAdmin
              captures: { asset_id: $.data.id }
            - call: "POST /alerts"
              payload: { client_id: "${client_id}", asset_id: "${asset_id}", source: "EDR", raw_score: 80 }
              as: SocAnalyst
              captures: { alert_id: $.data.id }
            - call: "POST /alerts/${alert_id}/triage"
              payload: {}
              as: SocAnalyst
            - call: "POST /alerts/${alert_id}/promote"
              payload: {}
              as: SocAnalyst
              captures: { incident_id: $.data.promoted_incident_id }
            - call: "POST /incidents/${incident_id}/acknowledge"
              payload: {}
              as: SocAnalyst
          trigger:
            - call: "POST /incidents/${incident_id}/contain"
              payload: { quarantine_asset: true }
              as: SocAnalyst
              captures: { quarantined_id: $.data.quarantined_asset_id }
          assert:
            - "GET /assets/${asset_id}: Asset.status == QUARANTINED"
            - "Incident.${incident_id}.quarantined_asset_id == ${asset_id}"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: priority_conflict_lockdown_safety_beats_retainer_fiscal
        grounds:
          - validations[priority=8]
          - validations[priority=18]
          - errors[ERR_POSTURE_LOCKDOWN]
          - errors[ERR_RETAINER_EXHAUSTED]
        distinguishing_aspect: |
          Pair business_safety (priority 8, ERR_POSTURE_LOCKDOWN) vs business_fiscal
          (priority 18, ERR_RETAINER_EXHAUSTED): an authorize that is BOTH blocked by
          LOCKDOWN and over-budget returns ERR_POSTURE_LOCKDOWN, because the lower
          priority number (safety) wins over the fiscal check.
        test_recipe:
          setup:
            - "Client retainer 10h; CROWN_JEWEL asset; an escalated incident forcing posture LOCKDOWN."
            - "A DRAFT engagement estimated_hours=50 (exceeds 10h available) targeting that asset."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Dual Co", tier: "ESSENTIAL", retainer_hours_per_period: 10 }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /assets"
              payload: { client_id: "${client_id}", hostname: "dual-01", ip_address: "10.0.1.1", criticality: "CROWN_JEWEL", exposure: "EXTERNAL" }
              as: PlatformAdmin
              captures: { asset_id: $.data.id }
            - call: "POST /alerts"
              payload: { client_id: "${client_id}", asset_id: "${asset_id}", source: "SIEM", raw_score: 90 }
