  - rule_id: priority_pair_validation_conflict
    instances:
      - name: proposal_state_error_outranks_funding_not_reserved
        grounds:
          - validations[priority=9]
          - validations[priority=41]
          - errors[ERR_PROPOSAL_INVALID_STATE]
          - errors[ERR_FUNDING_NOT_RESERVED]
        distinguishing_aspect: |
          Category pair state (priority 9) versus business_fiscal (priority 41) on
          POST /public-art/treatment-proposals/{id}/approve: the proposal is still DRAFT and has no
          RESERVED allocation at all, so both checks fail, yet only ERR_PROPOSAL_INVALID_STATE may be
          returned. A naive implementation that resolves funding first returns ERR_FUNDING_NOT_RESERVED.
        test_recipe:
          setup:
            - "logical clock at its default 2026-08-01T00:00:00Z"
            - "an eligible conservator and a FINALIZED assessment on a BRONZE artwork"
            - "a DRAFT TreatmentProposal with two line items (estimate 683269) that was never submitted"
            - "no FundingPool and no FundingAllocation exist at all"
          setup_api_calls:
            - call: "POST /public-art/artists"
              payload: { full_name: "Ada Vance", is_living: true, contact_email: "ada@example.gov" }
              as: CollectionsRegistrar
              as_user_id: "reg-1"
