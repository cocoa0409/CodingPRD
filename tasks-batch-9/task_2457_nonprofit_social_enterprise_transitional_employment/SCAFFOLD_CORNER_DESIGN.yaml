              as: ProgramDirector
              captures: { missed_again: $.data.missed_checkpoint_count }
            - call: "GET /placements/${pl_id}/retention-checkpoints"
              payload: { status: "MISSED" }
              as: FunderAnalyst
          assert:
            - "the sweep run ON the last day of grace reports missed_checkpoint_count == 0: the rule is strictly now > due_date + CHECKPOINT_GRACE_DAYS"
            - "the sweep on 2026-11-15 reports missed_checkpoint_count == 1, exited_participant_count == 0 and released_assignment_count == 0, with swept_at == \"2026-11-15T00:00:00Z\""
            - "the immediate re-run reports missed_checkpoint_count == 0 -- the sweep is idempotent and never double-counts an already-MISSED checkpoint"
            - "the filtered checkpoint list returns total_count == 1 with data[0].due_date == \"2026-10-31T00:00:00Z\""
            - "GET /placements/${pl_id} reports at_risk_flag == true and missed_checkpoint_count == 1 while employment_status stays ACTIVE: a missed confirmation is a reporting signal, not a separation"
            - "the 90/180/365-day checkpoints are untouched (still PENDING) because their due dates are in the future"

      - name: cascading_side_effect_chain_covered_by_difficulty
        claim_type: cascading_side_effects_chain
        grounds:
          - complexity_layers.cascading_side_effects
        distinguishing_aspect: |
          The deepest cascade in the domain is the one the difficulty instance drives end to end.
        excluded_because:
          difficulty_instance: "transitive_cascade / period_close_suspends_line_cancels_shift_releases_seat"
          rationale: |
            That instance already walks the full four-level chain (period close -> subsidy cap breach
            -> line SUSPENDED -> future shift CANCELLED -> ASSIGNED seat RELEASED with
            released_reason SHIFT_CANCELLED) and asserts both the ordering sensitivity and the
            untouched past shift. A corner-level cascade test would be a strict subset.

      - name: hours_vs_revenue_variant_delta_covered_by_difficulty
        claim_type: dual_variant_calculation_delta
        grounds:
          - complexity_layers.dual_variant_calculation
          - calculations.subsidy_cost_allocation
        distinguishing_aspect: |
          Both allocation variants over one identical ledger, plus the delta on switching, are the
          entire point of the difficulty instance.
        excluded_because:
          difficulty_instance: "dual_variant_calc / subsidy_allocation_hours_vs_revenue_split_same_ledger"
          rationale: |
            That instance reads the same period under PROVISIONAL_HOURS and FINAL_REVENUE, asserts the
            divergent mission_share (0.2308 vs 0.3276) and mission_cost_cents (85810 vs 116766), and
            then closes on REVENUE to prove the persisted figures match the final variant. The corner
            equivalent would re-derive one of those two numbers with no additional discrimination.

  - section: consistency_model
    instances:

      - name: completion_response_shows_ledger_and_metrics_immediately
        claim_type: immediate_visibility
        grounds:
          - complexity_profile.consistency_model
          - calculations.shift_labor_cost
          - calculations.subsidy_cost_allocation
          - calculations.participant_progress_metrics
        distinguishing_aspect: |
          The declared model is immediate, so a single completion must publish every derived
          consequence within its own response and to every reader that follows it: the assignment's
          wage cost, the auto-posted TRAINEE_WAGES cost entry, the period's mission/business split,
          the participant's hour and metric counters and the shift's billable total -- with no
          re-read, retry or sweep needed anywhere.
        test_recipe:
          setup:
            - "Launched line with an OPEN September period (supervisor_hours 40.0), participant p1 at wage 1650, one shift on 2026-09-07T08:00-20:00Z with p1 ASSIGNED, clock at the shift end."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-07T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /business-lines"
              payload: { name: "Cafe & Catering", market_viability_score: 90, training_relevance_score: 80, mission_alignment_score: 75, training_slots_total: 3, supervisor_capacity: 2, target_gross_margin_pct: 0.2000, subsidy_cap_cents: 5000000 }
              as: ProgramDirector
              captures: { bl_id: $.data.id }
            - call: "POST /business-lines/${bl_id}/review"
              payload: { decision: "APPROVED" }
              as: ProgramDirector
            - call: "POST /business-lines/${bl_id}/launch"
              payload: {}
              as: ProgramDirector
              captures: { bl_v: $.data.version }
            - call: "POST /referral-partners"
              payload: { organization_name: "Eastside Works", mou_tier: "TIER_1", referral_quota_per_period: 5 }
              as: ProgramDirector
              captures: { rp_id: $.data.id }
            - call: "POST /referrals"
              payload: { referral_partner_id: "${rp_id}", candidate_reference: "CAND-001", declared_barrier_codes: ["JUSTICE_INVOLVED", "HOUSING_INSTABILITY", "LONG_TERM_UNEMPLOYED"], household_income_cents: 100000, household_size: 2, hours_available_per_week: 40 }
              as: ReferralPartner
              as_user_id: "${rp_id}"
              captures: { ref1_id: $.data.id }
            - call: "POST /referrals/${ref1_id}/screen"
              payload: { decision: "ELIGIBLE", verified_barrier_codes: ["JUSTICE_INVOLVED", "HOUSING_INSTABILITY", "LONG_TERM_UNEMPLOYED"], verified_household_income_cents: 100000, verified_household_size: 2, verified_hours_available_per_week: 40 }
              as: IntakeSpecialist
            - call: "POST /subsidy-periods"
              payload: { business_line_id: "${bl_id}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-30T00:00:00Z", supervisor_hours: 40.0 }
              as: ProgramDirector
              captures: { sp_id: $.data.id }
            - call: "POST /participants"
              payload: { referral_id: "${ref1_id}", business_line_id: "${bl_id}", wage_cents_per_hour: 1650, expected_business_line_version: "${bl_v}" }
              as: IntakeSpecialist
              captures: { p1_id: $.data.id }
            - call: "POST /work-shifts"
              payload: { business_line_id: "${bl_id}", starts_at: "2026-09-07T08:00:00Z", ends_at: "2026-09-07T20:00:00Z", trainee_capacity: 2, supervisor_user_id: "sup-1" }
              as: ProgramDirector
              captures: { ws1_id: $.data.id }
            - call: "POST /shift-assignments"
              payload: { work_shift_id: "${ws1_id}", participant_id: "${p1_id}" }
              as: CaseManager
              captures: { sa1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-07T20:00:00Z" }
              as: ProgramDirector
          trigger:
            - call: "POST /shift-assignments/${sa1_id}/complete"
              payload: { actual_hours: 12.000, quality_defect_count: 1, customer_complaint_count: 0 }
              as: CaseManager
              captures: { cost: $.data.wage_cost_cents }
            - call: "GET /cost-entries"
              payload: { subsidy_period_id: "${sp_id}" }
              as: FunderAnalyst
              captures: { ce_id: "$.data[0].id" }
            - call: "GET /cost-entries/${ce_id}"
              payload: {}
              as: FunderAnalyst
            - call: "GET /subsidy-periods/${sp_id}"
              payload: {}
              as: FunderAnalyst
            - call: "GET /participants/${p1_id}"
              payload: {}
              as: CaseManager
            - call: "GET /work-shifts/${ws1_id}"
              payload: {}
              as: ProgramDirector
          assert:
            - "the completion response itself already carries status COMPLETED and wage_cost_cents == 19800 -- no second call is needed to learn the cost"
            - "the very next ledger read returns exactly one entry, and it is the auto-posted one: category \"TRAINEE_WAGES\", classification \"SHARED\", amount_cents 19800, source_activity_id == null (that FK is reserved for SupportActivity deliveries) and status \"POSTED\""
            - "the period read immediately after reports gross_cost_cents == 19800, trainee_hours 12.000, mission_share 0.2308, mission_cost_cents 4570 and business_operating_cost_cents 15230 -- allocation is recomputed in the same transaction, not on close"
            - "the participant read reports transitional_hours_total == 12.000 and quality_defect_count == 1 with status still TRANSITIONAL_EMPLOYED"
            - "the shift read reports billable_labor_cost_cents == 19800 and status CLOSED, since its only assignment is now terminal"
            - "every one of these reads reflects the write with zero retries: no field lags by a request, which is what consistency_model immediate forbids"
