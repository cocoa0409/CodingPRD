# =============================================================================
# Task 983 — Beehive Hosting & Backyard-Hive Service
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth walk over the claim-extraction-guide taxonomy. §1.8-covered corners
# are emitted as excluded_because stubs. Logical clock default 2026-05-01T00:00:00Z.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: host_missing_required_email_invalid_request
        claim_type: required_fields
        grounds: [entities.Host.fields.email, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "email is a required input with no default; omitting it is a p5 shape violation before any state is written."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/hosts", payload: { full_name: "No Email" }, as: Anonymous, captures: { err: $.data.error_id } }
          assert:
            - "captured ${err} == ERR_INVALID_REQUEST and no Host row is created"

      - name: host_creation_defaults_and_system_fields
        claim_type: defaults
        grounds: [entities.Host.fields.status, entities.Host.fields.reputation_score, entities.Host.fields.honey_credit_kg, entities.Host.fields.balance_due_cents]
        distinguishing_aspect: "System/computed defaults materialize at creation: status APPLICANT, reputation 100, honey credit 0, balance 0, version 1, server-minted id, waiver fields null."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/hosts", payload: { full_name: "New Host", email: "new@x.com" }, as: Anonymous, captures: { st: $.data.status, rep: $.data.reputation_score, credit: $.data.honey_credit_kg, bal: $.data.balance_due_cents, v: $.data.version, w: $.data.waiver_signed_at } }
          assert:
            - "captured ${st} == APPLICANT (initial state) and ${v} == 1"
            - "captured ${rep} == 100 and ${credit} == 0 and ${bal} == 0 (computed defaults)"
            - "captured ${w} == null (no waiver yet); response id is a server-minted UUID and any client-supplied id is ignored"

      - name: host_duplicate_email_rejected
        claim_type: type_constraints
        grounds: [entities.Host.fields.email, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "email uniqueness is global; the second registration with the same email fails while the first is intact."
        test_recipe:
          setup: ["one host with email dup@x.com exists"]
          setup_api_calls:
            - { call: "POST /api/hosts", payload: { full_name: "First", email: "dup@x.com" }, as: Anonymous, captures: { h1: $.data.id } }
          trigger:
            - { call: "POST /api/hosts", payload: { full_name: "Second", email: "dup@x.com" }, as: Anonymous, captures: { err: $.data.error_id } }
          assert:
            - "captured ${err} == ERR_INVALID_REQUEST"
            - "GET of Host.${h1} still returns full_name == First (first record untouched)"

      - name: site_creation_default_capacity_applied
        claim_type: defaults
        grounds: [entities.Site.fields.base_capacity_hives, entities.Site.fields.effective_capacity_hives]
        distinguishing_aspect: "Omitting base_capacity_hives applies the declared default 2 and the derived effective capacity equals it (no bonuses)."
        test_recipe:
          setup: ["host ACTIVE with current waiver"]
          setup_api_calls:
            - { call: "POST /api/hosts", payload: { full_name: "Cap Host", email: "cap@x.com" }, as: Anonymous, captures: { h: $.data.id } }
            - { call: "POST /api/hosts/${h}/sign-waiver", payload: { waiver_version: "W-2026" }, as: Host, as_user_id: "${h}" }
          trigger:
            - { call: "POST /api/sites", payload: { host_id: "${h}", address: "1 Default Way", water_source: true, setback_feet: 5 }, as: Host, as_user_id: "${h}", captures: { base_cap: $.data.base_capacity_hives, eff_cap: $.data.effective_capacity_hives, st: $.data.status } }
          assert:
            - "captured ${base_cap} == 2 (default applied)"
            - "captured ${eff_cap} == 2 (no PREMIUM plan and no ADV-201 completion)"
            - "captured ${st} == CLEAR (site initial state)"

      - name: hive_get_not_found_returns_404
        claim_type: not_found
        grounds: ["validations[priority=4]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "A well-formed but unknown UUID on a single-resource GET yields the error envelope with ERR_NOT_FOUND and response_type error."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/hives/00000000-0000-4000-8000-000000000000", payload: {}, as: PlatformOps, captures: { err: $.data.error_id } }
          assert:
            - "captured ${err} == ERR_NOT_FOUND with http 404"
            - "error envelope carries data.error_id and data.message; response_type == error"

      - name: hives_list_filter_and_pagination_envelope
        claim_type: listing
        grounds: [response_envelope, "endpoints.\"GET /api/hives\""]
        distinguishing_aspect: "The site_id filter restricts results to that site only, and the envelope exposes the pinned pagination defaults (limit 10, offset 0, total_count, has_more)."
        test_recipe:
          setup:
            - "host ACTIVE with waiver; site1 with two hives; site2 with one hive (each site under its own agreement)"
          setup_api_calls:
            - { call: "POST /api/hosts", payload: { full_name: "List Host", email: "list@x.com" }, as: Anonymous, captures: { h: $.data.id } }
            - { call: "POST /api/hosts/${h}/sign-waiver", payload: { waiver_version: "W-2026" }, as: Host, as_user_id: "${h}" }
            - { call: "POST /api/sites", payload: { host_id: "${h}", address: "10 List Ln", base_capacity_hives: 2, water_source: true, setback_feet: 5 }, as: Host, as_user_id: "${h}", captures: { site1: $.data.id } }
            - { call: "POST /api/sites", payload: { host_id: "${h}", address: "20 List Ln", base_capacity_hives: 2, water_source: false, setback_feet: 5 }, as: Host, as_user_id: "${h}", captures: { site2: $.data.id } }
            - { call: "POST /api/agreements", payload: { host_id: "${h}", site_id: "${site1}", term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2026-12-31T00:00:00Z", host_share_base_bps: 2500 }, as: PlatformOps, captures: { ag1: $.data.id } }
            - { call: "POST /api/agreements/${ag1}/sign", payload: {}, as: Host, as_user_id: "${h}" }
            - { call: "POST /api/agreements", payload: { host_id: "${h}", site_id: "${site2}", term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2026-12-31T00:00:00Z", host_share_base_bps: 2500 }, as: PlatformOps, captures: { ag2: $.data.id } }
            - { call: "POST /api/agreements/${ag2}/sign", payload: {}, as: Host, as_user_id: "${h}" }
            - { call: "POST /api/hives", payload: { site_id: "${site1}", agreement_id: "${ag1}" }, as: ApiaryManager, as_user_id: "mgr-1", captures: { hv1: $.data.id } }
            - { call: "POST /api/hives", payload: { site_id: "${site1}", agreement_id: "${ag1}" }, as: ApiaryManager, as_user_id: "mgr-1" }
            - { call: "POST /api/hives", payload: { site_id: "${site2}", agreement_id: "${ag2}" }, as: ApiaryManager, as_user_id: "mgr-1" }
          trigger:
            - { call: "GET /api/hives", payload: { site_id: "${site1}" }, as: PlatformOps }
          assert:
            - "response meta carries api_request_id and api_request_timestamp; response_type == array"
            - "pagination fields present: limit == 10 (default), offset == 0, total_count == 2, has_more == false"
            - "every returned hive has site_id == ${site1}; the site2 hive is excluded"

      - name: harvest_net_kg_computed_at_creation
        claim_type: computed_fields
        grounds: [calculations.net_harvest_kg, entities.Harvest.fields.net_kg]
        distinguishing_aspect: "net_kg is server-computed at POST time (gross 10.000 @ 19.6% -> 9.800) and is not an accepted input field."
        test_recipe:
          setup: ["host/site/agreement/hive in place with a verified inspection at 2026-06-01"]
          setup_api_calls:
            - { call: "POST /api/hosts", payload: { full_name: "Net Host", email: "net@x.com" }, as: Anonymous, captures: { h: $.data.id } }
            - { call: "POST /api/hosts/${h}/sign-waiver", payload: { waiver_version: "W-2026" }, as: Host, as_user_id: "${h}" }
            - { call: "POST /api/sites", payload: { host_id: "${h}", address: "3 Net St", base_capacity_hives: 2, water_source: true, setback_feet: 5 }, as: Host, as_user_id: "${h}", captures: { site: $.data.id } }
            - { call: "POST /api/agreements", payload: { host_id: "${h}", site_id: "${site}", term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2026-12-31T00:00:00Z", host_share_base_bps: 2500 }, as: PlatformOps, captures: { ag: $.data.id } }
            - { call: "POST /api/agreements/${ag}/sign", payload: {}, as: Host, as_user_id: "${h}" }
            - { call: "POST /api/hives", payload: { site_id: "${site}", agreement_id: "${ag}" }, as: ApiaryManager, as_user_id: "mgr-1", captures: { hv: $.data.id } }
            - { call: "POST /api/inspections", payload: { hive_id: "${hv}", inspected_at: "2026-06-01T00:00:00Z", mites_counted: 0, bees_sampled: 300, disease_flag: false, brood_score: 9, queen_seen: true, stores_kg: 12.0 }, as: Beekeeper, as_user_id: "bk-1", captures: { i1: $.data.id } }
            - { call: "POST /api/inspections/${i1}/submit", payload: {}, as: Beekeeper, as_user_id: "bk-1" }
            - { call: "POST /api/inspections/${i1}/verify", payload: {}, as: ApiaryManager, as_user_id: "mgr-1" }
          trigger:
            - { call: "POST /api/harvests", payload: { hive_id: "${hv}", collected_on: "2026-06-15T00:00:00Z", gross_kg: 10.000, moisture_pct: 19.6 }, as: Beekeeper, as_user_id: "bk-1", captures: { net: $.data.net_kg, st: $.data.status } }
          assert:
            - "captured ${net} == 9.800 (10.000 - 10.000 * (1.0/100) * 2.0)"
            - "captured ${st} == RECORDED (harvest initial state)"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: agreement_initial_state_and_unsigned_install_block
        claim_type: initial_state
        grounds: [state_machines.Agreement, "errors[ERR_AGREEMENT_NOT_ACTIVE]"]
        distinguishing_aspect: "A new agreement is PENDING_SIGNATURE, and hive installation against it fails until the host signs — creation alone never activates."
        test_recipe:
          setup: ["host ACTIVE with waiver; site CLEAR; agreement created but NOT signed"]
          setup_api_calls:
            - { call: "POST /api/hosts", payload: { full_name: "Init Host", email: "init@x.com" }, as: Anonymous, captures: { h: $.data.id } }
            - { call: "POST /api/hosts/${h}/sign-waiver", payload: { waiver_version: "W-2026" }, as: Host, as_user_id: "${h}" }
            - { call: "POST /api/sites", payload: { host_id: "${h}", address: "4 Init Ave", base_capacity_hives: 2, water_source: true, setback_feet: 5 }, as: Host, as_user_id: "${h}", captures: { site: $.data.id } }
            - { call: "POST /api/agreements", payload: { host_id: "${h}", site_id: "${site}", term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2026-12-31T00:00:00Z", host_share_base_bps: 2500 }, as: PlatformOps, captures: { ag: $.data.id, st: $.data.status } }
          trigger:
            - { call: "POST /api/hives", payload: { site_id: "${site}", agreement_id: "${ag}" }, as: ApiaryManager, as_user_id: "mgr-1", captures: { err: $.data.error_id } }
          assert:
            - "captured ${st} == PENDING_SIGNATURE (initial state at creation)"
            - "captured ${err} == ERR_AGREEMENT_NOT_ACTIVE (unsigned agreement blocks hive install)"

      - name: verify_draft_inspection_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Inspection.SUBMITTED_to_VERIFIED, "errors[ERR_INSPECTION_NOT_SUBMITTED]"]
        distinguishing_aspect: "Verify is only legal from SUBMITTED; a DRAFT inspection rejects with ERR_INSPECTION_NOT_SUBMITTED and stays DRAFT."
        test_recipe:
          setup: ["host/site/agreement/hive in place; inspection recorded (DRAFT) but never submitted"]
          setup_api_calls:
            - { call: "POST /api/hosts", payload: { full_name: "Draft Host", email: "draft@x.com" }, as: Anonymous, captures: { h: $.data.id } }
            - { call: "POST /api/hosts/${h}/sign-waiver", payload: { waiver_version: "W-2026" }, as: Host, as_user_id: "${h}" }
            - { call: "POST /api/sites", payload: { host_id: "${h}", address: "5 Draft Dr", base_capacity_hives: 2, water_source: true, setback_feet: 5 }, as: Host, as_user_id: "${h}", captures: { site: $.data.id } }
            - { call: "POST /api/agreements", payload: { host_id: "${h}", site_id: "${site}", term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2026-12-31T00:00:00Z", host_share_base_bps: 2500 }, as: PlatformOps, captures: { ag: $.data.id } }
            - { call: "POST /api/agreements/${ag}/sign", payload: {}, as: Host, as_user_id: "${h}" }
            - { call: "POST /api/hives", payload: { site_id: "${site}", agreement_id: "${ag}" }, as: ApiaryManager, as_user_id: "mgr-1", captures: { hv: $.data.id } }
            - { call: "POST /api/inspections", payload: { hive_id: "${hv}", inspected_at: "2026-05-10T00:00:00Z", mites_counted: 1, bees_sampled: 300, disease_flag: false, brood_score: 8, queen_seen: true, stores_kg: 10.0 }, as: Beekeeper, as_user_id: "bk-1", captures: { insp: $.data.id } }
          trigger:
            - { call: "POST /api/inspections/${insp}/verify", payload: {}, as: ApiaryManager, as_user_id: "mgr-1", captures: { err: $.data.error_id } }
          assert:
            - "captured ${err} == ERR_INSPECTION_NOT_SUBMITTED"
            - "Inspection.${insp}.status remains DRAFT and verified_by_id remains null"

      - name: treatment_complete_before_start_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Treatment.IN_PROGRESS_to_COMPLETED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Complete is only legal from IN_PROGRESS; a SCHEDULED treatment rejects with ERR_INVALID_STATE."
        test_recipe:
          setup: ["host/site/agreement/hive in place; treatment SCHEDULED, never started"]
          setup_api_calls:
            - { call: "POST /api/hosts", payload: { full_name: "Treat Host", email: "treat@x.com" }, as: Anonymous, captures: { h: $.data.id } }
            - { call: "POST /api/hosts/${h}/sign-waiver", payload: { waiver_version: "W-2026" }, as: Host, as_user_id: "${h}" }
            - { call: "POST /api/sites", payload: { host_id: "${h}", address: "6 Treat Blvd", base_capacity_hives: 2, water_source: true, setback_feet: 5 }, as: Host, as_user_id: "${h}", captures: { site: $.data.id } }
            - { call: "POST /api/agreements", payload: { host_id: "${h}", site_id: "${site}", term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2026-12-31T00:00:00Z", host_share_base_bps: 2500 }, as: PlatformOps, captures: { ag: $.data.id } }
            - { call: "POST /api/agreements/${ag}/sign", payload: {}, as: Host, as_user_id: "${h}" }
            - { call: "POST /api/hives", payload: { site_id: "${site}", agreement_id: "${ag}" }, as: ApiaryManager, as_user_id: "mgr-1", captures: { hv: $.data.id } }
            - { call: "POST /api/treatments", payload: { hive_id: "${hv}", product: "OXALIC_ACID", start_date: "2026-05-05T00:00:00Z", end_date: "2026-05-08T00:00:00Z" }, as: ApiaryManager, as_user_id: "mgr-1", captures: { tr: $.data.id } }
          trigger:
            - { call: "POST /api/treatments/${tr}/complete", payload: {}, as: Beekeeper, as_user_id: "bk-1", captures: { err: $.data.error_id } }
          assert:
            - "captured ${err} == ERR_INVALID_STATE"
            - "Treatment.${tr}.status remains SCHEDULED and completed_at remains null"

      - name: invoice_double_pay_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Invoice.OPEN_to_PAID, "errors[ERR_INVOICE_NOT_PAYABLE]"]
        distinguishing_aspect: "PAID is terminal for payment; a second pay on the same invoice fails with ERR_INVOICE_NOT_PAYABLE — the repeat is never silently idempotent."
        test_recipe:
          setup: ["host ACTIVE; BASIC subscription; invoice1 exists"]
          setup_api_calls:
            - { call: "POST /api/hosts", payload: { full_name: "Pay Host", email: "pay@x.com" }, as: Anonymous, captures: { h: $.data.id } }
            - { call: "POST /api/hosts/${h}/sign-waiver", payload: { waiver_version: "W-2026" }, as: Host, as_user_id: "${h}" }
            - { call: "POST /api/subscriptions", payload: { host_id: "${h}", plan: "BASIC" }, as: PlatformOps, captures: { sub: $.data.id } }
            - { call: "GET /api/invoices", payload: { subscription_id: "${sub}" }, as: PlatformOps, captures: { inv1: "$.data[0].id" } }
          trigger:
            - { call: "POST /api/invoices/${inv1}/pay", payload: {}, as: Host, as_user_id: "${h}", captures: { st1: $.data.status } }
            - { call: "POST /api/invoices/${inv1}/pay", payload: {}, as: Host, as_user_id: "${h}", captures: { err: $.data.error_id } }
          assert:
            - "captured ${st1} == PAID after the first pay"
            - "captured ${err} == ERR_INVOICE_NOT_PAYABLE on the repeat; invoice remains PAID with a single paid_at"

      - name: swarm_dispatch_after_capture_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.SwarmEvent.DISPATCHED_to_CAPTURED, "errors[ERR_SWARM_NOT_ACTIONABLE]"]
        distinguishing_aspect: "CAPTURED is terminal; dispatching a captured swarm fails with ERR_SWARM_NOT_ACTIONABLE."
        test_recipe:
          setup: ["host/site/agreement ACTIVE; swarm reported, dispatched to bk-1, and captured (hive created)"]
          setup_api_calls:
            - { call: "POST /api/hosts", payload: { full_name: "Swarm Host", email: "swarm@x.com" }, as: Anonymous, captures: { h: $.data.id } }
            - { call: "POST /api/hosts/${h}/sign-waiver", payload: { waiver_version: "W-2026" }, as: Host, as_user_id: "${h}" }
            - { call: "POST /api/sites", payload: { host_id: "${h}", address: "7 Swarm Ct", base_capacity_hives: 2, water_source: true, setback_feet: 5 }, as: Host, as_user_id: "${h}", captures: { site: $.data.id } }
            - { call: "POST /api/agreements", payload: { host_id: "${h}", site_id: "${site}", term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2026-12-31T00:00:00Z", host_share_base_bps: 2500 }, as: PlatformOps, captures: { ag: $.data.id } }
            - { call: "POST /api/agreements/${ag}/sign", payload: {}, as: Host, as_user_id: "${h}" }
            - { call: "POST /api/swarm-events", payload: { site_id: "${site}" }, as: Host, as_user_id: "${h}", captures: { sw: $.data.id } }
            - { call: "POST /api/swarm-events/${sw}/dispatch", payload: {}, as: Beekeeper, as_user_id: "bk-1" }
            - { call: "POST /api/swarm-events/${sw}/capture", payload: {}, as: Beekeeper, as_user_id: "bk-1", captures: { cap_hive: $.data.captured_hive_id, st: $.data.status } }
          trigger:
            - { call: "POST /api/swarm-events/${sw}/dispatch", payload: {}, as: Beekeeper, as_user_id: "bk-2", captures: { err: $.data.error_id } }
          assert:
            - "captured ${st} == CAPTURED and ${cap_hive} references a real Hive on ${site}"
            - "captured ${err} == ERR_SWARM_NOT_ACTIONABLE (terminal lockdown)"

      - name: removal_completion_removes_hive_and_frees_capacity
        claim_type: side_effect_execution
        grounds: [state_machines.RemovalJob.SCHEDULED_to_COMPLETED, state_machines.Hive.ACTIVE_to_REMOVED, calculations.site_effective_capacity]
        distinguishing_aspect: "Completing a scheduled removal flips the hive to REMOVED and frees one occupancy unit, provable by installing a fresh hive on the same capacity-2 site."
        test_recipe:
          setup:
            - "host ACTIVE with waiver; site capacity 2 with hives hv1 and hv2 (occupancy full); agreement ACTIVE"
            - "removal for hv1 APPROVED and SCHEDULED at 2026-06-10T09:00:00Z for crew-9"
          setup_api_calls:
            - { call: "POST /api/hosts", payload: { full_name: "Gone Host", email: "gone@x.com" }, as: Anonymous, captures: { h: $.data.id } }
            - { call: "POST /api/hosts/${h}/sign-waiver", payload: { waiver_version: "W-2026" }, as: Host, as_user_id: "${h}" }
            - { call: "POST /api/sites", payload: { host_id: "${h}", address: "8 Gone Pl", base_capacity_hives: 2, water_source: true, setback_feet: 5 }, as: Host, as_user_id: "${h}", captures: { site: $.data.id } }
            - { call: "POST /api/agreements", payload: { host_id: "${h}", site_id: "${site}", term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2026-12-31T00:00:00Z", host_share_base_bps: 2500 }, as: PlatformOps, captures: { ag: $.data.id } }
            - { call: "POST /api/agreements/${ag}/sign", payload: {}, as: Host, as_user_id: "${h}" }
            - { call: "POST /api/hives", payload: { site_id: "${site}", agreement_id: "${ag}" }, as: ApiaryManager, as_user_id: "mgr-1", captures: { hv1: $.data.id } }
            - { call: "POST /api/hives", payload: { site_id: "${site}", agreement_id: "${ag}" }, as: ApiaryManager, as_user_id: "mgr-1", captures: { hv2: $.data.id } }
            - { call: "POST /api/removal-jobs", payload: { hive_id: "${hv1}", reason: "EXIT" }, as: Host, as_user_id: "${h}", captures: { rj: $.data.id } }
            - { call: "POST /api/removal-jobs/${rj}/approve", payload: { decision: "APPROVE" }, as: ApiaryManager, as_user_id: "mgr-1" }
            - { call: "POST /api/removal-jobs/${rj}/schedule", payload: { scheduled_start: "2026-06-10T09:00:00Z", crew_id: "crew-9" }, as: ApiaryManager, as_user_id: "mgr-1" }
          trigger:
            - { call: "POST /api/removal-jobs/${rj}/complete", payload: {}, as: Beekeeper, as_user_id: "bk-1", captures: { st: $.data.status } }
            - { call: "GET /api/hives/${hv1}", payload: {}, as: PlatformOps, captures: { hive_st: $.data.lifecycle_status } }
            - { call: "POST /api/hives", payload: { site_id: "${site}", agreement_id: "${ag}" }, as: ApiaryManager, as_user_id: "mgr-1", captures: { hv3: $.data.id } }
          assert:
            - "captured ${st} == COMPLETED and ${hive_st} == REMOVED"
            - "third install succeeds after completion: Hive.${hv3} created (occupancy 2 -> 1 -> 2; REMOVED frees the unit)"

      - name: amendment_supersede_with_current_version_allowed
        claim_type: valid_transition
        grounds: [state_machines.Agreement.AMENDMENT_PENDING_to_AMENDMENT_PENDING, "concurrency_rules[agreement-amendment-occ]"]
        distinguishing_aspect: "Proposing while AMENDMENT_PENDING with the CURRENT version legitimately supersedes the pending proposal — the self-loop is legal; only the OCC version guards staleness."
        test_recipe:
          setup: ["host ACTIVE with waiver; site CLEAR; agreement signed (ACTIVE, version captured)"]
          setup_api_calls:
            - { call: "POST /api/hosts", payload: { full_name: "Super Host", email: "super@x.com" }, as: Anonymous, captures: { h: $.data.id } }
            - { call: "POST /api/hosts/${h}/sign-waiver", payload: { waiver_version: "W-2026" }, as: Host, as_user_id: "${h}" }
