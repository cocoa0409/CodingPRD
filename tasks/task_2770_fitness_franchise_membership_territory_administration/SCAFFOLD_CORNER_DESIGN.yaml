              payload: {}
              as: BrandAdministrator
          trigger:
            - call: "POST /franchise/plan-templates/${pt_id}/publish"
              payload: {}
              as: BrandAdministrator
          assert:
            - "response status == 409"
            - "response data.error_id == ERR_INVALID_PLAN_STATE"
            - "MembershipPlanTemplate.${pt_id}.status == PUBLISHED"
            - "MembershipPlanTemplate.${pt_id}.version == 2"

      - name: corner_withdrawing_a_submitted_relocation_request_is_rejected
        claim_type: invalid_transitions
        grounds:
          - state_machines.RelocationRequest.DRAFT_to_WITHDRAWN
