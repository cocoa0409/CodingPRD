  - section: calculations
    instances:
      - name: segment_hazard_index_forced_to_one_hundred_at_two_escalations
        claim_type: constants_applied
        grounds:
          - calculations.segment_hazard_index
          - calculations.segment_hazard_index.constants.ESCALATION_OVERRIDE_COUNT
          - entities.TrailSegment.fields.hazard_index
          - state_machines.TrailSegment.ANY_to_HAZARD_RESTRICTED
        distinguishing_aspect: |
          The ESCALATION_OVERRIDE_COUNT boundary: one ESCALATED report of score 72 yields a
          computed hazard_index of 36 and leaves the segment OPEN, while the SECOND escalation forces
          hazard_index to exactly 100 (overriding the computed 72) and flips posture to
          HAZARD_RESTRICTED.
        test_recipe:
          setup:
            - "A HEAVY-traffic segment under one land manager, with one volunteer reporter."
            - "Two condition reports filed with severity MODERATE; only the first is triaged (exposure HIGH), giving a score of 72. The second stays SUBMITTED so it is outside the hazard input set until the trigger triages it."
          setup_api_calls:
            - call: "POST /stewardship/land-managers"
              payload: { agency_name: "Cascade National Forest", jurisdiction_code: "USFS-R6-ALDER", permit_required: true, permit_lead_days: 14, max_party_size: 20, wet_threshold_index: 0.65, requires_engineering_review: true, requires_certified_sawyer: true }
              as: StewardshipCoordinator
              as_user_id: "coord-1"
              captures: { lm_id: $.data.id }
            - call: "POST /stewardship/volunteers"
              payload: { full_name: "Petra Novak", email: "petra@example.org", waiver_signed_on: "2026-07-01", certifications: [] }
              as: StewardshipCoordinator
              as_user_id: "coord-1"
              captures: { gen_id: $.data.id }
            - call: "POST /stewardship/trail-segments"
              payload: { land_manager_id: "${lm_id}", name: "Alder Creek", length_miles: 4.2, surface_class: "NATIVE_SOIL", traffic_class: "HEAVY" }
              as: StewardshipCoordinator
              as_user_id: "coord-1"
              captures: { seg_id: $.data.id }
            - call: "POST /stewardship/condition-reports"
              payload: { trail_segment_id: "${seg_id}", reported_by_volunteer_id: "${gen_id}", hazard_type: "BRIDGE_DAMAGE", severity_class: "MODERATE", description: "Stringer checked through." }
              as: Volunteer
              as_user_id: "${gen_id}"
              captures: { cr1_id: $.data.id }
            - call: "POST /stewardship/condition-reports/${cr1_id}/triage"
              payload: { exposure_class: "HIGH" }
              as: StewardshipCoordinator
              as_user_id: "coord-1"
              captures: { s1: $.data.priority_score }
            - call: "POST /stewardship/condition-reports"
              payload: { trail_segment_id: "${seg_id}", reported_by_volunteer_id: "${gen_id}", hazard_type: "TREAD_EROSION", severity_class: "MODERATE", description: "Undercut tread above the drop." }
              as: Volunteer
              as_user_id: "${gen_id}"
              captures: { cr2_id: $.data.id }
          trigger:
            - call: "POST /stewardship/condition-reports/${cr1_id}/disposition"
              payload: { disposition: "ESCALATE" }
              as: StewardshipCoordinator
              as_user_id: "coord-1"
              captures: { e1: $.data.status }
            - call: "GET /stewardship/trail-segments/${seg_id}"
              payload: {}
              as: StewardshipCoordinator
              as_user_id: "coord-1"
              captures: { h1: $.data.hazard_index, p1: $.data.posture, n1: $.data.escalated_hazard_count }
            - call: "POST /stewardship/condition-reports/${cr2_id}/triage"
              payload: { exposure_class: "HIGH" }
              as: StewardshipCoordinator
              as_user_id: "coord-1"
              captures: { s2: $.data.priority_score }
            - call: "GET /stewardship/trail-segments/${seg_id}"
              payload: {}
              as: StewardshipCoordinator
              as_user_id: "coord-1"
              captures: { hm: $.data.hazard_index, pm: $.data.posture }
            - call: "POST /stewardship/condition-reports/${cr2_id}/disposition"
              payload: { disposition: "ESCALATE" }
              as: StewardshipCoordinator
              as_user_id: "coord-1"
              captures: { e2: $.data.status }
            - call: "GET /stewardship/trail-segments/${seg_id}"
              payload: {}
              as: StewardshipCoordinator
              as_user_id: "coord-1"
              captures: { h2: $.data.hazard_index, p2: $.data.posture, n2: $.data.escalated_hazard_count }
          assert:
            - "${s1} == 72 and ${s2} == 72"
            - "${e1} == ESCALATED and ${e2} == ESCALATED"
            - "${h1} == 36 and ${n1} == 1 and ${p1} == OPEN"
            - "${hm} == 60 and ${pm} == HAZARD_RESTRICTED  (the 60 threshold is inclusive)"
            - "${h2} == 100 and ${n2} == 2 and ${p2} == HAZARD_RESTRICTED"
            - "${h2} != 72"
      - name: shift_credited_hours_break_deduction_boundary_at_240_minutes
        claim_type: precision
        grounds:
          - calculations.shift_credited_hours
          - calculations.shift_credited_hours.constants.BREAK_THRESHOLD_MIN
          - entities.VolunteerShift.fields.billable_minutes
