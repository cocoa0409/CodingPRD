  - rule_id: non_linear_state_machine
    instances:
      - name: rov_request_cycles_back_to_intake_until_round_limit
        grounds:
          - state_machines.ROVRequest.RESPONDED_to_INTAKE
          - state_machines.ROVRequest.INTAKE_to_AWAITING_APPRAISER
          - state_machines.ROVRequest.AWAITING_APPRAISER_to_RESPONDED
          - validations[priority=38]
          - errors[ERR_ROV_ROUND_LIMIT]
          - entities.ROVRequest.fields.round_number
          - calculations.rov_evidence_admissibility
        distinguishing_aspect: |
          The cycle lives on ROVRequest: RESPONDED -> INTAKE re-enters a state the request already
          left, and the loop is bounded by round_number rather than by a terminal state, so the
          second next-round attempt is rejected with ERR_ROV_ROUND_LIMIT while round_number stays 2.
        test_recipe:
          setup:
            - "Clock at its default 2026-08-01T00:00:00Z."
            - "AMC, appraiser A with an ACTIVE CA membership, a STANDARD REFINANCE loan file, and a fully clean appraisal (completeness 10000, bias CLEAR) whose desk review is ACCEPTED, making it value of record at 40000000."
            - "An ROV request is filed, two admissible CLOSED_SALE items are supplied for round 1, the request is submitted and A answers VALUE_AFFIRMED, leaving it RESPONDED at round 1."
            - "next-round is invoked once, cycling the request back to INTAKE at round 2; two fresh admissible items are filed, it is submitted again, and A answers VALUE_AFFIRMED, leaving it RESPONDED at round 2."
