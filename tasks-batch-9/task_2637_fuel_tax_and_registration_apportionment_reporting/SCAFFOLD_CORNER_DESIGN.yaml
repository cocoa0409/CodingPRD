          trigger:
            - call: "POST /apportionment/fuel-tax-returns/${ret1_id}/prepare"
              payload: { expected_carrier_version: "${c1_v}" }
              as: MileageAnalyst
              as_user_id: "analyst-1"
              captures: { err_id: "$.data.error_id" }
            - call: "POST /apportionment/fuel-tax-returns/${ret1_id}/prepare"
              payload: { expected_carrier_version: "${c1_v}" }
              as: TaxPreparer
              as_user_id: "preparer-1"
          assert:
            - "First prepare: HTTP 403 and body.data.error_id == 'ERR_FORBIDDEN_ROLE'; FuelTaxReturn.${ret1_id}.return_status == DRAFT"
            - "Carrier.${c1_id}.version == ${c1_v} after the denial — the forbidden call consumed nothing"
            - "Second prepare: HTTP 200 with return_status PREPARED, fleet_mpg 6.50 and prepared_by_user_id 'preparer-1'"
            - "GET /apportionment/fuel-tax-returns/${ret1_id} is readable by the analyst — reads are shared across all four roles"

      - name: role_exclusive_actions_cannot_be_crossed_between_the_desks
        claim_type: exclusive_operation_denied
        grounds:
          - roles.ComplianceOfficer.exclusive_operations
          - roles.TaxPreparer.exclusive_operations
          - roles.MileageAnalyst.exclusive_operations
          - validations[2].ERR_FORBIDDEN_ROLE
        distinguishing_aspect: "Three crossings all fail with ERR_FORBIDDEN_ROLE 403 in the same fixture: the preparer cannot review a trip, the officer cannot open a return, and the officer cannot reconstruct a trip — the role model is peer segregation, not a hierarchy in which the officer inherits the lower desks."
        test_recipe:
          setup:
            - "One CAPTURED trip of 400.0 miles and one GAP_FLAGGED trip (predecessor ends at 1000.0, flagged trip 1100.0 -> 1400.0)."
          setup_api_calls:
            - call: "POST /apportionment/jurisdictions"
              payload: { jurisdiction_code: "IL", name: "Illinois", fuel_tax_rate_per_gallon: 0.6270 }
              as: ComplianceOfficer
