            - { call: "POST /busops/drivers/${dr_id}/events", payload: { event_type: "SCHEDULE_TEST" }, as: HRRecruiter }
            - { call: "POST /busops/credentials", payload: { driver_id: "${dr_id}", kind: "CDL_B", issued_on: "2026-04-10", expires_on: "2027-01-01" }, as: HRRecruiter }
            - { call: "POST /busops/drivers/${dr_id}/events", payload: { event_type: "TEST_PASS" }, as: HRRecruiter }
            - { call: "POST /busops/credentials", payload: { driver_id: "${dr_id}", kind: "S_ENDORSEMENT", issued_on: "2026-04-15", expires_on: "2026-06-10" }, as: HRRecruiter }
            - { call: "POST /busops/drivers/${dr_id}/events", payload: { event_type: "ACTIVATE" }, as: HRRecruiter }
            - { call: "POST /busops/drivers/${dr_id}/discipline", payload: { action: "SUSPEND", reason: "Discipline" }, as: ContractorOps }
            - { call: "POST /busops/_clock/set_current_utc", payload: { to_iso8601: "2026-06-11T00:00:00Z" }, as: SystemAdmin }
          trigger:
            - { call: "POST /busops/drivers/${dr_id}/discipline", payload: { action: "REINSTATE" }, as: ContractorOps, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_ENDORSEMENT_MISSING (S_ENDORSEMENT EXPIRED blocks reinstatement)"
            - "Driver.${dr_id}.status == SUSPENDED (unchanged)"
            - "Driver.${dr_id}.suspension_reason == DISCIPLINE (unchanged; clock cascade only touches ACTIVE drivers)"

  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (different interval semantics/entities)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: driver_overlap_half_open_adjacency
        grounds:
          - validations[priority=11]
          - errors[ERR_DRIVER_OVERLAP_CONFLICT]
          - entities.Assignment.fields.planned_start_minute
        distinguishing_aspect: |
          Resource Driver, HALF-OPEN interval semantics [start,end): back-to-back
          runs touching at 480 are allowed (that is what makes doubling legal),
          while a run starting at 470 overlaps the 420-480 run and is rejected.
        test_recipe:
          setup:
            - "Contract ACTIVE with routes R1 420-480 (40 stu), R2 480-540 (30 stu), R3 470-540 (30 stu); one ACTIVE driver; three buses; service day 2026-06-01 DISPATCH_OPEN with three PLANNED assignments"
          setup_api_calls:
            - { call: "POST /busops/districts", payload: { name: "D-OV1", region_fuel_index_code: "WEST", credit_limit_cents: 100000000, billing_dispute_window_days: 30 }, as: SystemAdmin, captures: { d_id: $.data.id } }
            - { call: "POST /busops/contracts", payload: { district_id: "${d_id}", bid_reference: "BID-O1", daily_rate_per_bus_cents: 50000, school_days_per_year: 180, fuel_base_price_cents: 400, penalty_mode: "FLAT_PER_ROUTE", shortage_penalty_flat_cents: 15000, shortage_penalty_per_student_minute_cents: 25, assumed_minutes_per_missed_route: 45, monthly_cap_cents: 10000000, charter_hourly_rate_cents: 12000, charter_per_mile_cents: 250, start_date: "2026-01-01", end_date: "2026-12-31" }, as: ContractorOps, captures: { c_id: $.data.id } }
            - { call: "POST /busops/contracts/${c_id}/submit", payload: {}, as: ContractorOps }
            - { call: "POST /busops/contracts/${c_id}/award", payload: {}, as: DistrictAdmin, as_user_id: "${d_id}" }
            - { call: "POST /busops/contracts/${c_id}/activate", payload: {}, as: ContractorOps }
            - { call: "POST /busops/routes", payload: { contract_id: "${c_id}", route_code: "R1", school_site: "Lincoln", am_start_minute: 420, am_end_minute: 480, student_count: 40 }, as: ContractorOps }
            - { call: "POST /busops/routes", payload: { contract_id: "${c_id}", route_code: "R2", school_site: "Lincoln", am_start_minute: 480, am_end_minute: 540, student_count: 30 }, as: ContractorOps }
            - { call: "POST /busops/routes", payload: { contract_id: "${c_id}", route_code: "R3", school_site: "Lincoln", am_start_minute: 470, am_end_minute: 540, student_count: 30 }, as: ContractorOps }
            - { call: "POST /busops/drivers", payload: { primary_district_id: "${d_id}", full_name: "D Ov1", license_number: "L140", license_class: "B", hourly_wage_cents: 3000 }, as: HRRecruiter, captures: { dr_id: $.data.id } }
            - { call: "POST /busops/drivers/${dr_id}/events", payload: { event_type: "SCREEN" }, as: HRRecruiter }
            - { call: "POST /busops/drivers/${dr_id}/events", payload: { event_type: "ENROLL" }, as: HRRecruiter }
            - { call: "POST /busops/training-events", payload: { driver_id: "${dr_id}", category: "BEHIND_WHEEL", minutes: 2400, occurred_on: "2026-04-01" }, as: HRRecruiter }
            - { call: "POST /busops/training-events", payload: { driver_id: "${dr_id}", category: "CLASSROOM", minutes: 1200, occurred_on: "2026-04-02" }, as: HRRecruiter }
            - { call: "POST /busops/drivers/${dr_id}/events", payload: { event_type: "SCHEDULE_TEST" }, as: HRRecruiter }
            - { call: "POST /busops/credentials", payload: { driver_id: "${dr_id}", kind: "CDL_B", issued_on: "2026-04-10", expires_on: "2027-01-01" }, as: HRRecruiter }
            - { call: "POST /busops/drivers/${dr_id}/events", payload: { event_type: "TEST_PASS" }, as: HRRecruiter }
            - { call: "POST /busops/credentials", payload: { driver_id: "${dr_id}", kind: "S_ENDORSEMENT", issued_on: "2026-04-15", expires_on: "2027-01-01" }, as: HRRecruiter }
            - { call: "POST /busops/drivers/${dr_id}/events", payload: { event_type: "ACTIVATE" }, as: HRRecruiter }
            - { call: "POST /busops/buses", payload: { district_id: "${d_id}", fleet_number: "BO1", capacity: 48, fuel_type: "DIESEL", mpg_x10: 80, next_inspection_due: "2026-12-31" }, as: FleetManager, captures: { b1: $.data.id } }
            - { call: "POST /busops/buses", payload: { district_id: "${d_id}", fleet_number: "BO2", capacity: 48, fuel_type: "DIESEL", mpg_x10: 80, next_inspection_due: "2026-12-31" }, as: FleetManager, captures: { b2: $.data.id } }
            - { call: "POST /busops/buses", payload: { district_id: "${d_id}", fleet_number: "BO3", capacity: 48, fuel_type: "DIESEL", mpg_x10: 80, next_inspection_due: "2026-12-31" }, as: FleetManager, captures: { b3: $.data.id } }
