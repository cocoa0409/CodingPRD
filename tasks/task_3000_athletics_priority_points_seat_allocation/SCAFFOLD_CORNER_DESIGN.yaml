      - name: donor_status_change_out_of_deceased_returns_invalid_state
        claim_type: invalid_transitions
        grounds:
          - state_machines.Donor.donor_status.states
          - validations[priority=9]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          DECEASED is not terminal (it may only be reached, never left by any
          declared edge, and DISSOLVED_ENTITY is the sole terminal state), so the
          correct rejection for DECEASED -> ACTIVE is priority-9
          ERR_INVALID_STATE at HTTP 409 — not a 400 body error and not a silent
          no-op. The donor's version must not advance on the rejected call.
        test_recipe:
          setup:
            - "One Donor whose donor_status is DECEASED at version 2."
          setup_api_calls:
            - call: "POST /athletics/donors"
              payload: { full_name: "Desmond Departed", email: "desmond.departed@example.com", alumni_status: "ALUMNUS", entity_type: "INDIVIDUAL" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
              captures: { dd_id: "$.data.id", dd_v: "$.data.version" }
            - call: "POST /athletics/donors/${dd_id}/status-change"
              payload: { new_status: "DECEASED", effective_date: "2026-07-15T00:00:00.000Z", reason: "Estate notification received", expected_donor_version: "${dd_v}" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
              captures: { dd_v2: "$.data.version" }
          trigger:
            - call: "POST /athletics/donors/${dd_id}/status-change"
              payload: { new_status: "ACTIVE", effective_date: "2026-07-20T00:00:00.000Z", reason: "Clerical reversal attempt", expected_donor_version: "${dd_v2}" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
          assert:
            - "HTTP 409 with error envelope error.code == \"ERR_INVALID_STATE\""
            - "Donor.${dd_id}.donor_status == \"DECEASED\" (unchanged)"
            - "Donor.${dd_id}.status_effective_date == \"2026-07-15T00:00:00.000Z\" (unchanged)"
            - "Donor.${dd_id}.version == 2 (the rejected call did not increment version)"

      - name: donor_dissolved_entity_locks_down_every_further_status_change
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Donor.donor_status.terminal_states
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          DISSOLVED_ENTITY is the single declared terminal state of
          Donor.donor_status. Every trigger from it — including the otherwise
          always-available SUSPENDED edge — must be refused with 409
          ERR_INVALID_STATE, and two successive refusals must both leave version
          pinned at 2. An implementation that only guards the reverse-to-ACTIVE
          edge passes the previous claim but fails this one.
        test_recipe:
          setup:
            - "One CORPORATION Donor whose donor_status is DISSOLVED_ENTITY at version 2."
          setup_api_calls:
            - call: "POST /athletics/donors"
              payload: { full_name: "Harborline Holdings", email: "records@harborline.example.com", alumni_status: "NON_ALUMNUS", entity_type: "CORPORATION" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
              captures: { hh_id: "$.data.id", hh_v: "$.data.version" }
            - call: "POST /athletics/donors/${hh_id}/status-change"
              payload: { new_status: "DISSOLVED_ENTITY", effective_date: "2026-06-30T00:00:00.000Z", reason: "Certificate of dissolution filed", expected_donor_version: "${hh_v}" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
              captures: { hh_v2: "$.data.version" }
          trigger:
            - call: "POST /athletics/donors/${hh_id}/status-change"
              payload: { new_status: "ACTIVE", effective_date: "2026-07-01T00:00:00.000Z", reason: "Reinstatement attempt", expected_donor_version: "${hh_v2}" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
            - call: "POST /athletics/donors/${hh_id}/status-change"
              payload: { new_status: "SUSPENDED", effective_date: "2026-07-02T00:00:00.000Z", reason: "Compliance hold attempt", expected_donor_version: "${hh_v2}" }
              as: PlatformAdmin
              as_user_id: "admin-1"
          assert:
            - "Both triggers return HTTP 409 with error.code == \"ERR_INVALID_STATE\""
            - "Donor.${hh_id}.donor_status == \"DISSOLVED_ENTITY\""
            - "Donor.${hh_id}.version == 2 (neither refusal incremented version)"
            - "Donor.${hh_id}.status_effective_date == \"2026-06-30T00:00:00.000Z\""

      - name: gift_settlement_then_refund_reconciles_cumulative_giving_to_zero
        claim_type: ledger_sync
        grounds:
          - state_machines.Gift.gift_status.transitions.PLEDGED_to_RECEIVED
          - state_machines.Gift.gift_status.transitions.RECEIVED_to_REFUNDED
          - entities.Donor.fields.cumulative_giving_cents
        distinguishing_aspect: |
          The Gift state machine keeps the ancestor Donor's cumulative_giving_cents
          in sync in both directions: PLEDGED -> RECEIVED adds amount_cents and
          stamps settled_at from the logical clock, and RECEIVED -> REFUNDED
          subtracts the same amount and flips counts_toward_points to false. The
          before/after pair must reconcile exactly to 0 with no drift, and each
          settle call must bump BOTH the Gift version and the Donor version.
        test_recipe:
          setup:
            - "Logical clock at 2026-04-01T00:00:00.000Z."
            - "One Donor at version 2 holding exactly one PLEDGED gift of 1000000 cents; Donor.cumulative_giving_cents is 0 because a PLEDGED gift does not count."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00.000Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /athletics/donors"
              payload: { full_name: "Rhea Refunded", email: "rhea.refunded@example.com", alumni_status: "NON_ALUMNUS", entity_type: "INDIVIDUAL" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
              captures: { rr_id: "$.data.id" }
            - call: "POST /athletics/donors/${rr_id}/gifts"
              payload: { gift_date: "2026-03-01T00:00:00.000Z", amount_cents: 1000000, designation: "ATHLETICS_ANNUAL", gift_status: "PLEDGED" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
              captures: { g_id: "$.data.id" }
          trigger:
            - call: "POST /athletics/gifts/${g_id}/settle"
              payload: { new_status: "RECEIVED" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
            - call: "POST /athletics/gifts/${g_id}/settle"
              payload: { new_status: "REFUNDED" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
          assert:
            - "Immediately after the RECEIVED settle: Gift.${g_id}.gift_status == \"RECEIVED\", Gift.${g_id}.settled_at == \"2026-04-01T00:00:00.000Z\", Gift.${g_id}.counts_toward_points == true, Gift.${g_id}.version == 2"
            - "Immediately after the RECEIVED settle: Donor.${rr_id}.cumulative_giving_cents == 1000000 and Donor.${rr_id}.version == 3"
            - "After the REFUNDED settle: Gift.${g_id}.gift_status == \"REFUNDED\", Gift.${g_id}.counts_toward_points == false, Gift.${g_id}.version == 3"
            - "After the REFUNDED settle: Donor.${rr_id}.cumulative_giving_cents == 0 (exactly reconciled, not 1000000 and not -1000000)"
            - "Donor.${rr_id}.version == 4"
            - "Donor.${rr_id}.certified_base_points == 0.00 (no recalculation run has occurred, so the points fields never moved)"

      - name: gift_refunded_is_terminal_and_refuses_re_settlement
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Gift.gift_status.terminal_states
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          REFUNDED is the terminal state of Gift.gift_status and it is reachable
          directly from PLEDGED as well as from RECEIVED. Once there, a settle to
          RECEIVED must be a 409 ERR_INVALID_STATE, and — critically — the
          PLEDGED -> REFUNDED path must NOT have subtracted anything from
          cumulative_giving_cents, which was never credited in the first place.
        test_recipe:
          setup:
            - "One Donor at version 2 with exactly one PLEDGED gift of 750000 cents; cumulative_giving_cents is 0."
          setup_api_calls:
            - call: "POST /athletics/donors"
