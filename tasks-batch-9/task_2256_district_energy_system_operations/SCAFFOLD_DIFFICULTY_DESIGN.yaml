      - name: agreement_contract_and_billing_dimensions_advance_independently
        grounds:
          - state_machines.ConnectionAgreement.ACTIVE_to_SUSPENDED
          - state_machines.ConnectionAgreement.CURRENT_to_IN_ARREARS
          - state_machines.ConnectionAgreement.IN_ARREARS_to_CURRENT
          - state_machines.ConnectionAgreement.SUSPENDED_to_ACTIVE
          - entities.ConnectionAgreement.fields.contract_state
          - entities.ConnectionAgreement.fields.billing_state
        distinguishing_aspect: |
          Non-linearity on the ConnectionAgreement entity is parallel state dimensions rather than a
          cycle: contract_state moves ACTIVE to SUSPENDED to ACTIVE through the status endpoint
          while billing_state moves CURRENT to IN_ARREARS to CURRENT through invoice issue and
          payment cascades, and each dimension holds its value across the other's transitions
          (billing_state stays CURRENT across the suspend, contract_state stays SUSPENDED across
          both billing moves).
