# =============================================================================
# §1.8 Difficulty Design Index — task 2198 Water Rights Transfer &
# Adjudication Support
#
# One entry per §0.5 Difficulty Rule, each carrying >= 2 concrete, independently
# reachable instances. Every `grounds:` reference resolves into SCAFFOLD.yaml
# (calculations.<name>, state_machines.<Entity>.<FROM>_to_<TO>,
# validations[priority=N], entities.<Entity>.fields.<name>,
# concurrency_rules[<rule-id>]). Every numeric value in an `assert:` block was
# computed with decimal.Decimal + ROUND_HALF_UP against the pinned formulas in
# §1.3 — no value is approximate and none is left for the implementer to guess.
#
# Shared conventions used by the recipes below:
#   * The logical clock is set explicitly as the first call of every recipe via
#     POST /_clock/set_current_utc; nothing relies on the startup default.
#   * Every `expected_water_right_version` / `expected_water_bank_account_version`
#     is a ${var} captured from an immediately preceding GET — never a literal.
#   * "BASE RIGHT" below means: a WaterRight with authorized_diversion_af
#     400.00, place_of_use_acres 120.00, authorized_rate_cfs 5.000,
#     priority_date 1901-05-01T00:00:00Z, purpose_of_use IRRIGATION, carrying
#     METER BeneficialUseRecords for 2023 / 2024 / 2025 at 300.000 af and
#     100.00 irrigated acres, activated, then quantified by a DIVERSION_BASED
#     2023-2025 study: average_annual_cu_af 195.000, face cap 260.000,
#     transferable_cu_af 195.00, certified into WaterRight.certified_hcu_af.
# =============================================================================

scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  # RULE 1 — dual_variant_calc
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:

      - name: hcu_method_variant_divergence
        grounds: calculations.hcu_transferable_volume
        distinguishing_aspect: >-
          Two HcuStudy rows built from the SAME BeneficialUseRecord set on the
          SAME right return different transferable_cu_af — 132.98 af for
          DIVERSION_BASED (which reads reported_diversion_af * 0.65 and ignores
          irrigated_acres) versus 210.00 af for CIR_BASED (which reads
          irrigated_acres * 2.10 and ignores reported_diversion_af) — so an
          implementation that hardcodes either branch, or that lets one field
          leak into the other's formula, produces a demonstrably wrong number
          on one of the two studies.
        test_recipe:
          setup: >-
            Pin the clock at 2026-03-01. Create claimant A and one water right
            with authorized_diversion_af 400.00 and place_of_use_acres 120.00.
            Post three METER beneficial-use records whose reported diversions
            (210.500 / 198.250 / 205.000 af) are deliberately NOT proportional
            to the constant 100.00 irrigated acres, so the two variants cannot
            coincide. Activate the right.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: {current_utc: "2026-03-01T00:00:00Z"}
              as: WaterRightsAnalyst
            - call: POST /claimants
              payload: {legal_name: "Alder Creek Ranch", contact_email: "a@example.test", entity_type: INDIVIDUAL}
              as: WaterRightsAnalyst
              captures: {claimant_a_id: id}
            - call: POST /water-rights
              payload: {claimant_id: "${claimant_a_id}", right_number: "S4-00101", priority_date: "1901-05-01T00:00:00Z", source_stream_code: "ALDER", purpose_of_use: IRRIGATION, place_of_use_acres: 120.00, authorized_diversion_af: 400.00, authorized_rate_cfs: 5.000}
              as: WaterRightsAnalyst
              captures: {right_id: id}
            - call: POST /water-rights/${right_id}/beneficial-use-records
              payload: {use_year: 2023, reported_diversion_af: 210.500, irrigated_acres: 100.00, verification_source: METER}
              as: WaterRightsAnalyst
            - call: POST /water-rights/${right_id}/beneficial-use-records
              payload: {use_year: 2024, reported_diversion_af: 198.250, irrigated_acres: 100.00, verification_source: METER}
              as: WaterRightsAnalyst
            - call: POST /water-rights/${right_id}/beneficial-use-records
              payload: {use_year: 2025, reported_diversion_af: 205.000, irrigated_acres: 100.00, verification_source: METER}
              as: WaterRightsAnalyst
            - call: POST /water-rights/${right_id}/activate
              payload: {}
              as: WaterRightsAnalyst
          trigger: >-
            POST /water-rights/${right_id}/hcu-studies with
            {method: DIVERSION_BASED, study_period_start_year: 2023,
            study_period_end_year: 2025}, then POST the same body again with
            {method: CIR_BASED, study_period_start_year: 2023,
            study_period_end_year: 2025}.
          assert: |
            DIVERSION_BASED study (201):
              qualifying_year_count == 3
              per-year cu (3 dp, rounded BEFORE summation) == 136.825, 128.863, 133.250
              average_annual_cu_af == 132.979      # 398.938 / 3
              short_history_haircut_applied == false
              transferable_cu_af == 132.98
            CIR_BASED study (201):
              qualifying_year_count == 3
              per-year cu == 210.000, 210.000, 210.000
              average_annual_cu_af == 210.000
              short_history_haircut_applied == false
              transferable_cu_af == 210.00
            Neither study is capped: face_cap == 260.000 exceeds both means.
            The two rows differ by 77.02 af of permanently transferable volume
            on identical inputs.

      - name: lease_settlement_valuation_variant
        grounds: calculations.lease_settlement_credit
        distinguishing_aspect: >-
          Two leases with identical requested_af 60.00, identical
          [2026-04-01, 2026-07-30) 120-day windows and an identical
          cancellation instant (2026-05-11, 40 elapsed days) settle
          differently: PRO_RATA_DAILY charges 40 days -> used_af 20.00 /
          settlement_credit_af 40.00, while SEASON_BLOCK rounds 40 days up to
          two whole 30-day blocks -> 60 charged days -> used_af 30.00 /
          settlement_credit_af 30.00. The 10.00 af divergence propagates into
          WaterBankAccount.deposited_credit_af and
          WaterRight.transferred_away_af, so the variant is observable on three
          entities, not just on the lease.
        test_recipe:
          setup: >-
            Pin the clock at 2026-03-01. Build TWO bank-enrolled BASE RIGHTs
            (R1, R2) for claimant A, each with its own authorized point of
            diversion (max_rate_cfs 5.000) created before activation so both
            headgates are AUTHORIZED. Open one WaterBankAccount and deposit
            90.00 af from each right (deposited_credit_af 180.00). Create two
            leases — L1 on R1/POD1 with valuation_method PRO_RATA_DAILY and L2
            on R2/POD2 with valuation_method SEASON_BLOCK — each requested_af
            60.00, diversion_rate_cfs 1.000, window
            [2026-04-01T00:00:00Z, 2026-07-30T00:00:00Z). Move the clock to
            2026-04-05 and activate both (available_credit_af 60.00 at that
            point, so posture stays OPEN and priority 22 does not fire). Then
            move the clock to 2026-05-11.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: {current_utc: "2026-03-01T00:00:00Z"}
              as: WaterRightsAnalyst
            - call: POST /claimants
              payload: {legal_name: "Alder Creek Ranch", contact_email: "a@example.test", entity_type: INDIVIDUAL}
              as: WaterRightsAnalyst
              captures: {claimant_a_id: id}
            - call: POST /water-rights
              payload: {claimant_id: "${claimant_a_id}", right_number: "S4-00101", priority_date: "1901-05-01T00:00:00Z", source_stream_code: "ALDER", purpose_of_use: IRRIGATION, place_of_use_acres: 120.00, authorized_diversion_af: 400.00, authorized_rate_cfs: 5.000, bank_enrolled: true}
              as: WaterRightsAnalyst
              captures: {r1_id: id}
            - call: POST /water-rights/${r1_id}/points-of-diversion
              payload: {legal_description: "NE1/4 S12 T4N R2E", stream_reach_code: "ALDER-01", max_rate_cfs: 5.000, stream_miles_from_headwater: 12.00}
              as: WaterRightsAnalyst
              captures: {pod1_id: id}
            - call: POST /water-rights/${r1_id}/beneficial-use-records
              payload: {use_year: 2023, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}
              as: WaterRightsAnalyst
            - call: POST /water-rights/${r1_id}/beneficial-use-records
              payload: {use_year: 2024, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}
              as: WaterRightsAnalyst
            - call: POST /water-rights/${r1_id}/beneficial-use-records
              payload: {use_year: 2025, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}
              as: WaterRightsAnalyst
            - call: POST /water-rights/${r1_id}/activate
              payload: {}
              as: WaterRightsAnalyst
            - call: POST /water-rights/${r1_id}/hcu-studies
              payload: {method: DIVERSION_BASED, study_period_start_year: 2023, study_period_end_year: 2025}
              as: WaterRightsAnalyst
              captures: {s1_id: id}
            - call: GET /water-rights/${r1_id}
              payload: {}
              as: WaterRightsAnalyst
              captures: {r1_v: version}
            - call: POST /hcu-studies/${s1_id}/certify
              payload: {expected_water_right_version: "${r1_v}"}
              as: WaterRightsAnalyst
            - call: POST /water-rights
              payload: {claimant_id: "${claimant_a_id}", right_number: "S4-00102", priority_date: "1903-06-01T00:00:00Z", source_stream_code: "ALDER", purpose_of_use: IRRIGATION, place_of_use_acres: 120.00, authorized_diversion_af: 400.00, authorized_rate_cfs: 5.000, bank_enrolled: true}
              as: WaterRightsAnalyst
              captures: {r2_id: id}
            - call: POST /water-rights/${r2_id}/points-of-diversion
              payload: {legal_description: "SE1/4 S12 T4N R2E", stream_reach_code: "ALDER-02", max_rate_cfs: 5.000, stream_miles_from_headwater: 14.00}
              as: WaterRightsAnalyst
              captures: {pod2_id: id}
            - call: POST /water-rights/${r2_id}/beneficial-use-records
              payload: {use_year: 2023, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}
              as: WaterRightsAnalyst
            - call: POST /water-rights/${r2_id}/beneficial-use-records
              payload: {use_year: 2024, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}
              as: WaterRightsAnalyst
            - call: POST /water-rights/${r2_id}/beneficial-use-records
              payload: {use_year: 2025, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}
              as: WaterRightsAnalyst
            - call: POST /water-rights/${r2_id}/activate
              payload: {}
              as: WaterRightsAnalyst
            - call: POST /water-rights/${r2_id}/hcu-studies
              payload: {method: DIVERSION_BASED, study_period_start_year: 2023, study_period_end_year: 2025}
              as: WaterRightsAnalyst
              captures: {s2_id: id}
            - call: GET /water-rights/${r2_id}
              payload: {}
              as: WaterRightsAnalyst
              captures: {r2_v: version}
            - call: POST /hcu-studies/${s2_id}/certify
              payload: {expected_water_right_version: "${r2_v}"}
              as: WaterRightsAnalyst
            - call: POST /water-bank-accounts
              payload: {claimant_id: "${claimant_a_id}", basin_code: "ALDER-BASIN"}
              as: WaterRightsAnalyst
              captures: {acct_id: id}
            - call: GET /water-bank-accounts/${acct_id}
              payload: {}
              as: WaterRightsAnalyst
              captures: {acct_v1: version}
            - call: POST /water-bank-accounts/${acct_id}/deposits
              payload: {water_right_id: "${r1_id}", deposit_af: 90.00, expected_water_bank_account_version: "${acct_v1}"}
              as: WaterRightsAnalyst
              captures: {acct_v2: version}
            - call: POST /water-bank-accounts/${acct_id}/deposits
              payload: {water_right_id: "${r2_id}", deposit_af: 90.00, expected_water_bank_account_version: "${acct_v2}"}
              as: WaterRightsAnalyst
            - call: POST /lease-assignments
              payload: {water_bank_account_id: "${acct_id}", water_right_id: "${r1_id}", point_of_diversion_id: "${pod1_id}", lessee_name: "Bench Ditch Co", lease_start_date: "2026-04-01T00:00:00Z", lease_end_date: "2026-07-30T00:00:00Z", requested_af: 60.00, diversion_rate_cfs: 1.000, rental_rate_usd_per_af: 45.00, valuation_method: PRO_RATA_DAILY}
              as: WaterRightsAnalyst
              captures: {l1_id: id}
            - call: POST /lease-assignments
              payload: {water_bank_account_id: "${acct_id}", water_right_id: "${r2_id}", point_of_diversion_id: "${pod2_id}", lessee_name: "Bench Ditch Co", lease_start_date: "2026-04-01T00:00:00Z", lease_end_date: "2026-07-30T00:00:00Z", requested_af: 60.00, diversion_rate_cfs: 1.000, rental_rate_usd_per_af: 45.00, valuation_method: SEASON_BLOCK}
              as: WaterRightsAnalyst
              captures: {l2_id: id}
            - call: POST /_clock/set_current_utc
              payload: {current_utc: "2026-04-05T00:00:00Z"}
              as: WaterRightsAnalyst
            - call: POST /lease-assignments/${l1_id}/activate
              payload: {}
              as: WaterRightsAnalyst
            - call: POST /lease-assignments/${l2_id}/activate
              payload: {}
              as: WaterRightsAnalyst
            - call: POST /_clock/set_current_utc
              payload: {current_utc: "2026-05-11T00:00:00Z"}
              as: WaterRightsAnalyst
          trigger: >-
            POST /lease-assignments/${l1_id}/cancel and
            POST /lease-assignments/${l2_id}/cancel, both with
            {cancellation_reason: "lessee released"}.
          assert: |
            term_days == 120 and elapsed_days == 40 for BOTH leases.
            L1 (PRO_RATA_DAILY): charged_days == 40, used_af == 20.00,
                                 settlement_credit_af == 40.00
            L2 (SEASON_BLOCK):   blocks_charged == 2 -> charged_days == 60,
                                 used_af == 30.00, settlement_credit_af == 30.00
            Account after both cancellations:
              deposited_credit_af == 130.00      # 180.00 - 20.00 - 30.00
              committed_credit_af == 0.00
              leased_out_af == 0.00
              available_credit_af == 130.00
              posture == OPEN
            R1: encumbered_af == 70.00, transferred_away_af == 20.00,
                transferable_af == 105.00, status == PARTIALLY_TRANSFERRED
            R2: encumbered_af == 60.00, transferred_away_af == 30.00,
                transferable_af == 105.00, status == PARTIALLY_TRANSFERRED
            Both ledgers still satisfy
            certified_hcu_af == transferable_af + encumbered_af + transferred_away_af
            (195.00 on each right).
  # ---------------------------------------------------------------------------
  # RULE 2 — combinatorial_formula  (instance 1 = mode (c), instance 2 = mode (b))
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:

      - name: mitigation_fee_tier_on_presurcharge_subtotal
        grounds: calculations.mitigation_fee
        distinguishing_aspect: >-
          MODE (c) — circular-looking dependency with a pinned evaluation
          direction. total_fee_usd = base_fee_usd + admin_surcharge_usd while
          admin_surcharge_usd is a tier percentage OF a fee, so the tier must be
          selected from the PRE-surcharge subtotal: required_af 39.90 gives
          base_fee_usd 4987.50 which is below the 5000.00 TIER1 ceiling, hence
          surcharge_pct 0.040 and total_fee_usd 5187.00. Selecting the tier from
          the post-surcharge total instead pushes 5187.00 over the ceiling and
          yields 0.070 / 5336.63 — a 149.63 USD divergence that no other test
          input can produce by accident.
        test_recipe:
          setup: >-
            Pin the clock at 2026-03-01 and build the BASE RIGHT for claimant A
            (certified_hcu_af 195.00). File a CHANGE_OF_USE application for
            50.00 af, run a SEASONAL_AVERAGE injury analysis with
            pod_move_miles 0.00 (gross_depletion_af 39.00, offset_af 0.00,
            net_injury_af 39.00), submit it under the OCC version captured after
            the analysis bumped the right, publish it, roll the clock to the
            30-day protest deadline and close the protest period unprotested so
            the application sits in READY_FOR_DECISION. Certification is signed
            by u-analyst-1 and the decision by u-decider-1 so priority 23
            (segregation of duties) is satisfied.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: {current_utc: "2026-03-01T00:00:00Z"}
              as: WaterRightsAnalyst
            - call: POST /claimants
              payload: {legal_name: "Alder Creek Ranch", contact_email: "a@example.test", entity_type: INDIVIDUAL}
              as: WaterRightsAnalyst
              captures: {claimant_a_id: id}
            - call: POST /water-rights
              payload: {claimant_id: "${claimant_a_id}", right_number: "S4-00101", priority_date: "1901-05-01T00:00:00Z", source_stream_code: "ALDER", purpose_of_use: IRRIGATION, place_of_use_acres: 120.00, authorized_diversion_af: 400.00, authorized_rate_cfs: 5.000}
              as: WaterRightsAnalyst
              captures: {right_id: id}
            - call: POST /water-rights/${right_id}/beneficial-use-records
              payload: {use_year: 2023, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}
              as: WaterRightsAnalyst
            - call: POST /water-rights/${right_id}/beneficial-use-records
              payload: {use_year: 2024, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}
              as: WaterRightsAnalyst
            - call: POST /water-rights/${right_id}/beneficial-use-records
              payload: {use_year: 2025, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}
              as: WaterRightsAnalyst
            - call: POST /water-rights/${right_id}/activate
              payload: {}
              as: WaterRightsAnalyst
            - call: POST /water-rights/${right_id}/hcu-studies
              payload: {method: DIVERSION_BASED, study_period_start_year: 2023, study_period_end_year: 2025}
              as: WaterRightsAnalyst
              captures: {study_id: id}
            - call: GET /water-rights/${right_id}
              payload: {}
              as: WaterRightsAnalyst
              captures: {right_v1: version}
            - call: POST /hcu-studies/${study_id}/certify
              payload: {expected_water_right_version: "${right_v1}"}
              as: WaterRightsAnalyst
              as_user_id: u-analyst-1
            - call: POST /transfer-applications
              payload: {water_right_id: "${right_id}", hcu_study_id: "${study_id}", application_type: CHANGE_OF_USE, requested_af: 50.00, proposed_purpose_of_use: MUNICIPAL}
              as: WaterRightsAnalyst
              captures: {app_id: id}
            - call: POST /transfer-applications/${app_id}/injury-analyses
              payload: {method: SEASONAL_AVERAGE, pod_move_miles: 0.00}
              as: WaterRightsAnalyst
              captures: {analysis_id: id}
            - call: GET /water-rights/${right_id}
              payload: {}
              as: WaterRightsAnalyst
              captures: {right_v2: version}
            - call: POST /transfer-applications/${app_id}/submit
              payload: {expected_water_right_version: "${right_v2}"}
              as: WaterRightsAnalyst
            - call: POST /transfer-applications/${app_id}/publish
              payload: {}
              as: WaterRightsAnalyst
            - call: POST /_clock/set_current_utc
              payload: {current_utc: "2026-03-31T00:00:00Z"}
              as: WaterRightsAnalyst
            - call: POST /transfer-applications/${app_id}/close-protest-period
              payload: {}
              as: WaterRightsAnalyst
          trigger: >-
            POST /transfer-applications/${app_id}/decide as DecisionAuthority
            with X-User-ID u-decider-1 and payload {disposition:
            APPROVE_WITH_CONDITIONS, decision_note: "mitigation required",
            conditions: [{condition_type: MITIGATION_PAYMENT, required_af:
            39.90, compliance_due_date: "2026-09-01T00:00:00Z"}]}.
          assert: |
            The FINALIZED analysis reads gross_depletion_af 39.00, offset_af
            0.00, net_injury_af 39.00; the single condition's required_af 39.90
            clears priority 27 (39.90 >= 39.00).
            ApprovalCondition:
              base_fee_usd == 4987.50           # 39.90 * 125.00
              surcharge_pct == 0.040            # tier read from 4987.50, NOT from 5187.00
              admin_surcharge_usd == 199.50
              total_fee_usd == 5187.00
              status == IMPOSED, payment_status == OUTSTANDING,
              source == DECISION
            TransferApplication: status == APPROVED_WITH_CONDITIONS,
              mitigation_fee_total_usd == 5187.00
            Claimant: outstanding_fee_balance_usd == 5187.00,
              standing_status == DELINQUENT
            WaterRight: transferred_away_af == 50.00, encumbered_af == 0.00,
              transferable_af == 145.00, status == PARTIALLY_TRANSFERRED
            The wrong evaluation direction (tier chosen from the running total)
            would report surcharge_pct 0.070, admin_surcharge_usd 349.13 and
            total_fee_usd 5336.63.

      - name: hcu_round_per_year_then_average_order
        grounds: calculations.hcu_transferable_volume
        distinguishing_aspect: >-
          MODE (b) — nested rounding whose order changes the answer at BOTH
          pinned precisions. Records of 103.825 / 121.425 / 121.525 af produce
          per-year consumptive uses that must each be rounded to 3 dp BEFORE
          summation (67.486 + 78.926 + 78.991 = 225.403 -> mean 75.134 ->
          transferable_cu_af 75.13); summing the unrounded products first gives
          mean 75.135 and transferable_cu_af 75.14. One acre-foot-hundredth and
          one thousandth separate the correct order from the plausible wrong
          one, and both fields are stored, so the divergence is visible twice on
          the same response.
        test_recipe:
          setup: >-
            Pin the clock at 2026-03-01, create claimant A and one water right
            with authorized_diversion_af 400.00 (face cap 260.000, so the cap
            never binds), then post three METER beneficial-use records chosen so
            that the per-year 0.65 products each land exactly on a 4th-decimal
            5 — the only arrangement in which round-then-sum and sum-then-round
            disagree. Activate the right.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: {current_utc: "2026-03-01T00:00:00Z"}
              as: WaterRightsAnalyst
            - call: POST /claimants
              payload: {legal_name: "Boulder Flats LLC", contact_email: "b@example.test", entity_type: IRRIGATION_DISTRICT}
              as: WaterRightsAnalyst
              captures: {claimant_b_id: id}
            - call: POST /water-rights
              payload: {claimant_id: "${claimant_b_id}", right_number: "S4-00220", priority_date: "1912-04-15T00:00:00Z", source_stream_code: "BOULDER", purpose_of_use: IRRIGATION, place_of_use_acres: 120.00, authorized_diversion_af: 400.00, authorized_rate_cfs: 5.000}
              as: WaterRightsAnalyst
              captures: {right_id: id}
            - call: POST /water-rights/${right_id}/beneficial-use-records
              payload: {use_year: 2023, reported_diversion_af: 103.825, irrigated_acres: 90.00, verification_source: METER}
              as: WaterRightsAnalyst
            - call: POST /water-rights/${right_id}/beneficial-use-records
              payload: {use_year: 2024, reported_diversion_af: 121.425, irrigated_acres: 90.00, verification_source: METER}
              as: WaterRightsAnalyst
            - call: POST /water-rights/${right_id}/beneficial-use-records
              payload: {use_year: 2025, reported_diversion_af: 121.525, irrigated_acres: 90.00, verification_source: AERIAL_IMAGERY}
              as: WaterRightsAnalyst
            - call: POST /water-rights/${right_id}/activate
              payload: {}
              as: WaterRightsAnalyst
          trigger: >-
            POST /water-rights/${right_id}/hcu-studies with {method:
            DIVERSION_BASED, study_period_start_year: 2023,
            study_period_end_year: 2025}.
          assert: |
            201 with:
              qualifying_year_count == 3          # METER and AERIAL_IMAGERY both admissible
              per-year cu (3 dp) == 67.486, 78.926, 78.991
              average_annual_cu_af == 75.134      # 225.403 / 3 = 75.134333...
              short_history_haircut_applied == false
              transferable_cu_af == 75.13
            Sum-then-round would give average_annual_cu_af 75.135 and
            transferable_cu_af 75.14; both fields are asserted so either error
            is caught.
            The face cap is inert here (260.000 >> 75.134), which isolates the
            rounding-order effect from the min() branch.
  # ---------------------------------------------------------------------------
  # RULE 3 — non_linear_state_machine  (TransferApplication cycle, Protest fork)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:

      - name: transfer_application_revision_cycle
        grounds: state_machines.TransferApplication.REVISION_REQUESTED_to_SUBMITTED
        distinguishing_aspect: >-
          The application re-enters SUBMITTED — a state it already occupied —
          closing the cycle SUBMITTED -> PROTEST_PERIOD -> UNDER_PROTEST ->
          REVISION_REQUESTED -> SUBMITTED, and the second pass through the loop
          behaves differently from the first: revision_round becomes 1, the
          escrow is SWAPPED rather than released-then-taken (so the budget gate
          is 100.00 <= 135.00 + 60.00 rather than 100.00 <= 135.00), and
          republication stamps a 15-day protest_deadline instead of the original
          30-day one. An implementation that models the pipeline as a linear
          DAG, resets revision_round, or reuses the 30-day window on
          republication fails on at least one asserted field.
        test_recipe:
          setup: >-
            Pin the clock at 2026-03-01, build the BASE RIGHT for claimant A
            (certified_hcu_af 195.00) and create a second claimant B who will
            protest. File a CHANGE_OF_USE application for 60.00 af with a
            SEASONAL_AVERAGE analysis, submit it (encumbered_af 60.00,
            transferable_af 135.00), publish it (protest_deadline
            2026-03-31T00:00:00Z, 30-day window because revision_round == 0),
            then at 2026-03-05 have claimant B file a protest, which drives the
            application PROTEST_PERIOD -> UNDER_PROTEST. Finally the hearing
            officer sends it back with request-revision (escrow untouched,
            protest_deadline cleared, protest held FILED).
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: {current_utc: "2026-03-01T00:00:00Z"}
              as: WaterRightsAnalyst
            - call: POST /claimants
              payload: {legal_name: "Alder Creek Ranch", contact_email: "a@example.test", entity_type: INDIVIDUAL}
              as: WaterRightsAnalyst
              captures: {claimant_a_id: id}
            - call: POST /claimants
              payload: {legal_name: "Downstream Irrigation District", contact_email: "d@example.test", entity_type: IRRIGATION_DISTRICT}
              as: WaterRightsAnalyst
              captures: {claimant_b_id: id}
            - call: POST /water-rights
              payload: {claimant_id: "${claimant_a_id}", right_number: "S4-00101", priority_date: "1901-05-01T00:00:00Z", source_stream_code: "ALDER", purpose_of_use: IRRIGATION, place_of_use_acres: 120.00, authorized_diversion_af: 400.00, authorized_rate_cfs: 5.000}
              as: WaterRightsAnalyst
              captures: {right_id: id}
            - call: POST /water-rights/${right_id}/beneficial-use-records
              payload: {use_year: 2023, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}
              as: WaterRightsAnalyst
            - call: POST /water-rights/${right_id}/beneficial-use-records
              payload: {use_year: 2024, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}
              as: WaterRightsAnalyst
            - call: POST /water-rights/${right_id}/beneficial-use-records
              payload: {use_year: 2025, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}
              as: WaterRightsAnalyst
            - call: POST /water-rights/${right_id}/activate
              payload: {}
              as: WaterRightsAnalyst
            - call: POST /water-rights/${right_id}/hcu-studies
              payload: {method: DIVERSION_BASED, study_period_start_year: 2023, study_period_end_year: 2025}
              as: WaterRightsAnalyst
              captures: {study_id: id}
            - call: GET /water-rights/${right_id}
              payload: {}
              as: WaterRightsAnalyst
              captures: {right_v1: version}
            - call: POST /hcu-studies/${study_id}/certify
              payload: {expected_water_right_version: "${right_v1}"}
              as: WaterRightsAnalyst
              as_user_id: u-analyst-1
            - call: POST /transfer-applications
              payload: {water_right_id: "${right_id}", hcu_study_id: "${study_id}", application_type: CHANGE_OF_USE, requested_af: 60.00, proposed_purpose_of_use: MUNICIPAL}
              as: WaterRightsAnalyst
              captures: {app_id: id}
            - call: POST /transfer-applications/${app_id}/injury-analyses
              payload: {method: SEASONAL_AVERAGE, pod_move_miles: 0.00}
              as: WaterRightsAnalyst
              captures: {analysis_id: id}
            - call: GET /water-rights/${right_id}
              payload: {}
              as: WaterRightsAnalyst
              captures: {right_v2: version}
            - call: POST /transfer-applications/${app_id}/submit
              payload: {expected_water_right_version: "${right_v2}"}
              as: WaterRightsAnalyst
            - call: POST /transfer-applications/${app_id}/publish
              payload: {}
              as: WaterRightsAnalyst
            - call: POST /_clock/set_current_utc
              payload: {current_utc: "2026-03-05T00:00:00Z"}
              as: WaterRightsAnalyst
            - call: POST /protests
              payload: {transfer_application_id: "${app_id}", protestant_claimant_id: "${claimant_b_id}", claimed_injury_af: 12.00, basis: INJURY_TO_SENIOR_RIGHT}
              as: Claimant
              as_user_id: "${claimant_b_id}"
              captures: {protest_id: id}
            - call: POST /transfer-applications/${app_id}/request-revision
              payload: {revision_note: "re-scope the volume downward or document return flows"}
              as: HearingOfficer
            - call: POST /_clock/set_current_utc
              payload: {current_utc: "2026-03-10T00:00:00Z"}
              as: WaterRightsAnalyst
            - call: GET /water-rights/${right_id}
              payload: {}
              as: WaterRightsAnalyst
              captures: {right_v3: version}
          trigger: >-
            POST /transfer-applications/${app_id}/resubmit with {requested_af:
            100.00, expected_water_right_version: "${right_v3}"}, then
            POST /transfer-applications/${app_id}/publish again.
          assert: |
            After request-revision (pre-trigger state, asserted as the loop's
            entry condition): status == REVISION_REQUESTED,
            protest_deadline == null, escrowed_af == 60.00,
            unresolved_protest_count == 1, WaterRight.encumbered_af == 60.00.
            After resubmit (200):
              status == SUBMITTED            # the cycle closed onto a visited state
              revision_round == 1
              requested_af == 100.00 and escrowed_af == 100.00
              budget gate applied was 100.00 <= 135.00 + 60.00 == 195.00 (passes);
                the linear reading 100.00 <= 135.00 would have failed with
                ERR_TRANSFERABLE_VOLUME_EXCEEDED
              WaterRight: encumbered_af == 100.00, transferred_away_af == 0.00,
                transferable_af == 95.00, status == ENCUMBERED
              the DRAFT InjuryAnalysis was recomputed: gross_depletion_af == 78.00,
                offset_af == 0.00, net_injury_af == 78.00
            After the second publish (200):
              status == PROTEST_PERIOD
              protest_deadline == "2026-03-25T00:00:00Z"   # 2026-03-10 + 15 days,
                                                           # NOT + 30 days
              unresolved_protest_count == 1 and the original protest is still FILED
            Ledger conservation holds throughout: 195.00 == 95.00 + 100.00 + 0.00.

      - name: protest_track_fork_divergence
        grounds: state_machines.Protest.FILED_to_IN_HEARING
        distinguishing_aspect: >-
          FILED forks into IN_NEGOTIATION or IN_HEARING and the two branches
          rejoin at RESOLVED_STIPULATED with DISJOINT side-effect sets: the
          negotiation branch grants a volumetric offset (offset_af 10.00 ->
          net_injury_af 29.10) and creates NO ApprovalCondition, while the
          hearing branch grants no offset at all (offset_af stays 0.00,
          net_injury_af 39.10) and instead creates exactly one ApprovalCondition
          with source HEARING_RESOLUTION and required_af equal to the
          protestant's claimed_injury_af. Same terminal state, different
          arithmetic and different child rows — an implementation that treats
          "resolved" as one path gets one of the two applications wrong.
        test_recipe:
          setup: >-
            Pin the clock at 2026-03-01 and build the BASE RIGHT for claimant A
            plus protestant claimant B. Add a SECOND point of diversion AFTER
            activation so it stays PROPOSED and can be the proposed headgate of
            a POINT_OF_DIVERSION_CHANGE application. File TWO applications on
            that right, each requested_af 50.00 and each with an
            INSTANTANEOUS_DEPLETION analysis at pod_move_miles 10.00
            (distance_factor 0.8500, gross_depletion_af 39.10). Submit and
            publish both, then at 2026-03-05 have claimant B protest each one
            with claimed_injury_af 12.00 (both applications reach
            UNDER_PROTEST). Route protest 1 to NEGOTIATION and protest 2 to
            HEARING.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: {current_utc: "2026-03-01T00:00:00Z"}
              as: WaterRightsAnalyst
            - call: POST /claimants
              payload: {legal_name: "Alder Creek Ranch", contact_email: "a@example.test", entity_type: INDIVIDUAL}
