  - rule_id: cross_entity_state_dependency
    instances:
      - name: broadcast_go_live_requires_owning_event_to_be_live
        grounds:
          - state_machines.Broadcast.PREVIEW_to_LIVE
          - entities.Event.fields.state
          - entities.Broadcast.fields.state
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: |
          Entity pair BROADCAST -> EVENT: the Broadcast's PREVIEW -> LIVE transition is legal on the
          Broadcast's own axis and its Session is SCHEDULED, yet it is rejected purely because the
          owning Event is still PUBLISHED rather than LIVE.
        test_recipe:
