# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests) —
# task 0715. Breadth probe over SCAFFOLD.yaml §1.1–§1.7 surface, walking
# references/claim-extraction-guide.md section by section. Setup chains use
# only §1.5 endpoints; default clock = 2026-03-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_client_returns_201_with_open_ledger
        claim_type: Creation
        grounds:
          - entities.Client
          - endpoints["POST /clients"]
        distinguishing_aspect: "POST /clients with name/tier/retainer_hours_per_period returns 201; the create side-effect opens a RetainerLedger for period 0 with hours_granted == retainer_hours_per_period."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Acme", tier: "ADVANCED", retainer_hours_per_period: 80 }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
          trigger:
            - call: "GET /retainer-ledgers?client_id=${client_id}&period_index=0"
              payload: {}
              as: PlatformAdmin
              captures: { lg_granted: "$.data[0].hours_granted", lg_status: "$.data[0].status" }
          assert:
            - "POST /clients returns 201 with Client.tier == ADVANCED, current_period_index == 0, status == ACTIVE"
            - "RetainerLedger for period 0 exists with hours_granted == 80 and status == OPEN"

      - name: get_client_nonexistent_returns_not_found
        claim_type: Not Found
        grounds:
          - entities.Client
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /clients/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "GET /clients/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "GET returns ERR_NOT_FOUND (404)"

      - name: create_asset_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Asset.fields.hostname
          - errors[ERR_INVALID_REQUEST]
          - endpoints["POST /assets"]
        distinguishing_aspect: "POST /assets omitting the required hostname field returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup:
            - "One client exists."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Acme", tier: "ESSENTIAL", retainer_hours_per_period: 50 }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
          trigger:
            - call: "POST /assets"
              payload: { client_id: "${client_id}", ip_address: "10.0.9.1", criticality: "LOW" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "POST /assets returns ERR_INVALID_REQUEST (400) — hostname missing"

      - name: create_asset_invalid_enum_criticality_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.Asset.fields.criticality
          - errors[ERR_INVALID_REQUEST]
          - endpoints["POST /assets"]
        distinguishing_aspect: "POST /assets with criticality not in {LOW,MEDIUM,HIGH,CROWN_JEWEL} returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup:
            - "One client exists."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Acme", tier: "ESSENTIAL", retainer_hours_per_period: 50 }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
          trigger:
            - call: "POST /assets"
              payload: { client_id: "${client_id}", hostname: "h1", ip_address: "10.0.9.2", criticality: "SUPREME" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "POST /assets returns ERR_INVALID_REQUEST (400) — invalid enum value"

      - name: asset_default_exposure_internal_applied
        claim_type: Defaults
        grounds:
          - entities.Asset.fields.exposure
          - endpoints["POST /assets"]
        distinguishing_aspect: "POST /assets omitting exposure applies the default INTERNAL."
        test_recipe:
          setup:
            - "One client exists."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Acme", tier: "ESSENTIAL", retainer_hours_per_period: 50 }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
          trigger:
            - call: "POST /assets"
              payload: { client_id: "${client_id}", hostname: "h-def", ip_address: "10.0.9.3", criticality: "LOW" }
              as: PlatformAdmin
              captures: { exp: $.data.exposure }
          assert:
            - "Asset.exposure == INTERNAL (default applied)"

      - name: create_finding_fk_not_found_wrong_client_scan
        claim_type: Not Found
        grounds:
          - entities.Finding.fields.scan_id
          - validations[priority=4]
          - errors[ERR_FK_NOT_FOUND]
          - endpoints["POST /findings"]
        distinguishing_aspect: "POST /findings with a non-existent scan_id returns ERR_FK_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "One client and one ACTIVE asset exist."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Acme", tier: "ESSENTIAL", retainer_hours_per_period: 50 }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /assets"
              payload: { client_id: "${client_id}", hostname: "fk-01", ip_address: "10.0.9.4", criticality: "LOW" }
              as: PlatformAdmin
              captures: { asset_id: $.data.id }
          trigger:
            - call: "POST /findings"
              payload: { scan_id: "00000000-0000-4000-8000-000000000001", asset_id: "${asset_id}", title: "x", cvss_base: 5.0 }
              as: SocAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "POST /findings returns ERR_FK_NOT_FOUND (404)"

      - name: list_clients_pagination_envelope_fields
        claim_type: Listing
        grounds:
          - entities.Client
          - endpoints["GET /clients"]
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /clients returns a paginated array envelope carrying total_count and has_more in meta/data per §1.0."
        test_recipe:
          setup:
            - "Two clients exist."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "C1", tier: "ESSENTIAL", retainer_hours_per_period: 10 }
              as: PlatformAdmin
            - call: "POST /clients"
              payload: { name: "C2", tier: "ESSENTIAL", retainer_hours_per_period: 10 }
              as: PlatformAdmin
          trigger:
            - call: "GET /clients?limit=1&offset=0"
              payload: {}
              as: PlatformAdmin
          assert:
            - "response_type == array; total_count == 2; has_more == true; exactly 1 item returned"

      - name: list_clients_invalid_pagination_returns_error
        claim_type: Listing
        grounds:
          - validations[priority=27]
          - errors[ERR_INVALID_PAGINATION]
          - endpoints["GET /clients"]
        distinguishing_aspect: "GET /clients with limit > 100 returns ERR_INVALID_PAGINATION (400)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "GET /clients?limit=500&offset=0"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "GET /clients returns ERR_INVALID_PAGINATION (400)"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: acknowledge_incident_from_resolved_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Incident.DETECTED_to_ACKNOWLEDGED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Calling acknowledge on a RESOLVED incident (acknowledge only valid from DETECTED) returns ERR_INVALID_STATE (409); no side effects fire."
        test_recipe:
          setup:
            - "Incident promoted from a CROWN_JEWEL/EXTERNAL alert, acknowledged, contained, then resolved."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "SM1", tier: "ESSENTIAL", retainer_hours_per_period: 100 }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /assets"
              payload: { client_id: "${client_id}", hostname: "sm1-01", ip_address: "10.0.3.1", criticality: "CROWN_JEWEL", exposure: "EXTERNAL" }
              as: PlatformAdmin
              captures: { asset_id: $.data.id }
            - call: "POST /alerts"
              payload: { client_id: "${client_id}", asset_id: "${asset_id}", source: "SIEM", raw_score: 90 }
              as: SocAnalyst
              captures: { alert_id: $.data.id }
            - call: "POST /alerts/${alert_id}/triage"
              payload: {}
              as: SocAnalyst
            - call: "POST /alerts/${alert_id}/promote"
              payload: {}
              as: SocAnalyst
              captures: { incident_id: $.data.promoted_incident_id }
            - call: "POST /incidents/${incident_id}/acknowledge"
              payload: {}
              as: SocAnalyst
            - call: "POST /incidents/${incident_id}/contain"
              payload: { quarantine_asset: false }
              as: SocAnalyst
            - call: "POST /incidents/${incident_id}/resolve"
              payload: { response_hours: 1 }
              as: EngagementLead
          trigger:
            - call: "POST /incidents/${incident_id}/acknowledge"
              payload: {}
              as: SocAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "acknowledge returns ERR_INVALID_STATE (409); Incident stays RESOLVED"

      - name: dismiss_high_priority_alert_returns_cannot_dismiss
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Alert.TRIAGED_to_DISMISSED
          - validations[priority=11]
          - errors[ERR_CANNOT_DISMISS_HIGH_PRIORITY]
        distinguishing_aspect: "Dismissing a TRIAGED P1 alert (CROWN_JEWEL/EXTERNAL high raw_score) violates the P3/P4-only precondition and returns ERR_CANNOT_DISMISS_HIGH_PRIORITY (409)."
        test_recipe:
          setup:
            - "Alert raw_score 90 on a CROWN_JEWEL/EXTERNAL asset, triaged (triage_priority P1)."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "SM2", tier: "ESSENTIAL", retainer_hours_per_period: 50 }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /assets"
              payload: { client_id: "${client_id}", hostname: "sm2-01", ip_address: "10.0.3.2", criticality: "CROWN_JEWEL", exposure: "EXTERNAL" }
              as: PlatformAdmin
              captures: { asset_id: $.data.id }
            - call: "POST /alerts"
              payload: { client_id: "${client_id}", asset_id: "${asset_id}", source: "SIEM", raw_score: 90 }
              as: SocAnalyst
              captures: { alert_id: $.data.id }
            - call: "POST /alerts/${alert_id}/triage"
              payload: {}
              as: SocAnalyst
          trigger:
            - call: "POST /alerts/${alert_id}/dismiss"
              payload: {}
              as: SocAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "dismiss returns ERR_CANNOT_DISMISS_HIGH_PRIORITY (409)"

      - name: escalate_low_severity_incident_returns_cannot_escalate
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Incident.DETECTED_to_ESCALATED
          - validations[priority=12]
          - errors[ERR_CANNOT_ESCALATE_LOW]
        distinguishing_aspect: "Escalating a DETECTED incident whose severity is LOW (alert P4 on a LOW/INTERNAL asset) returns ERR_CANNOT_ESCALATE_LOW (409)."
        test_recipe:
          setup:
            - "Alert raw_score 40 on a LOW/INTERNAL asset, triaged (P4), promoted -> Incident severity LOW."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "SM3", tier: "ESSENTIAL", retainer_hours_per_period: 50 }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /assets"
              payload: { client_id: "${client_id}", hostname: "sm3-01", ip_address: "10.0.3.3", criticality: "LOW", exposure: "INTERNAL" }
              as: PlatformAdmin
              captures: { asset_id: $.data.id }
            - call: "POST /alerts"
              payload: { client_id: "${client_id}", asset_id: "${asset_id}", source: "EDR", raw_score: 40 }
              as: SocAnalyst
              captures: { alert_id: $.data.id }
            - call: "POST /alerts/${alert_id}/triage"
              payload: {}
              as: SocAnalyst
            - call: "POST /alerts/${alert_id}/promote"
              payload: {}
              as: SocAnalyst
              captures: { incident_id: $.data.promoted_incident_id }
          trigger:
            - call: "POST /incidents/${incident_id}/escalate"
              payload: {}
              as: EngagementLead
              captures: { err: $.data.error_id }
          assert:
            - "escalate returns ERR_CANNOT_ESCALATE_LOW (409) — incident severity is LOW"

      - name: accept_risk_critical_finding_returns_cannot_accept_critical
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Finding.OPEN_to_RISK_ACCEPTED
          - validations[priority=10]
          - errors[ERR_CANNOT_ACCEPT_CRITICAL]
        distinguishing_aspect: "Risk-accepting an OPEN CRITICAL finding (cvss 9.5) returns ERR_CANNOT_ACCEPT_CRITICAL (409)."
        test_recipe:
          setup:
            - "Client; COMPLETED scan; one CRITICAL finding (cvss 9.5) OPEN."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "SM4", tier: "ESSENTIAL", retainer_hours_per_period: 100 }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /assets"
              payload: { client_id: "${client_id}", hostname: "sm4-01", ip_address: "10.0.3.4", criticality: "MEDIUM" }
              as: PlatformAdmin
              captures: { asset_id: $.data.id }
            - call: "POST /engagements"
              payload: { client_id: "${client_id}", kind: "VULN_SCAN", authorized_window_start: "2026-03-01T00:00:00Z", authorized_window_end: "2026-04-01T00:00:00Z", estimated_hours: 10, scope_asset_ids: ["${asset_id}"] }
              as: EngagementLead
              captures: { eng_id: $.data.id }
            - call: "POST /engagements/${eng_id}/authorize"
              payload: {}
              as: ClientContact
            - call: "POST /engagements/${eng_id}/start"
              payload: {}
              as: EngagementLead
              captures: { eng_v2: $.data.version }
            - call: "POST /scans"
              payload: { engagement_id: "${eng_id}", expected_engagement_version: "${eng_v2}" }
              as: EngagementLead
              captures: { scan_id: $.data.id }
            - call: "POST /scans/${scan_id}/start"
              payload: {}
              as: EngagementLead
            - call: "POST /scans/${scan_id}/complete"
              payload: { actual_hours: 5, raw_finding_count: 1 }
              as: EngagementLead
            - call: "POST /findings"
              payload: { scan_id: "${scan_id}", asset_id: "${asset_id}", title: "crit", cvss_base: 9.5 }
              as: SocAnalyst
              captures: { finding_id: $.data.id }
          trigger:
            - call: "POST /findings/${finding_id}/accept-risk"
              payload: {}
              as: ClientContact
              captures: { err: $.data.error_id }
          assert:
            - "accept-risk returns ERR_CANNOT_ACCEPT_CRITICAL (409)"

      - name: start_remediation_before_scan_completed_returns_scan_not_completed
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Finding.OPEN_to_REMEDIATION_IN_PROGRESS
          - validations[priority=24]
          - errors[ERR_SCAN_NOT_COMPLETED]
        distinguishing_aspect: "Findings are only creatable from a COMPLETED scan, so to exercise ERR_SCAN_NOT_COMPLETED the scan is re-checked at start-remediation; with a finding whose scan is no longer COMPLETED the guard fires. (Reachable only when scan was COMPLETED at finding-create; covered by §1.8 cross dependency instead.)"
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / cross_scan_start_requires_engagement_active
          rationale: "The COMPLETED-scan precondition for remediation is structurally identical to the engagement-ACTIVE cross-entity gate already asserted in §1.8; a finding cannot exist with a non-COMPLETED scan, so this corner is subsumed."

      - name: scan_complete_with_scans_in_flight_blocks_engagement_complete
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Engagement.ACTIVE_to_COMPLETED
          - validations[priority=23]
          - errors[ERR_SCANS_IN_FLIGHT]
        distinguishing_aspect: "Completing an ACTIVE engagement that still has a QUEUED scan returns ERR_SCANS_IN_FLIGHT (409)."
        test_recipe:
          setup:
            - "Engagement ACTIVE with one QUEUED (never started) scan."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "SM5", tier: "ESSENTIAL", retainer_hours_per_period: 100 }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /assets"
              payload: { client_id: "${client_id}", hostname: "sm5-01", ip_address: "10.0.3.5", criticality: "MEDIUM" }
              as: PlatformAdmin
              captures: { asset_id: $.data.id }
            - call: "POST /engagements"
              payload: { client_id: "${client_id}", kind: "VULN_SCAN", authorized_window_start: "2026-03-01T00:00:00Z", authorized_window_end: "2026-04-01T00:00:00Z", estimated_hours: 10, scope_asset_ids: ["${asset_id}"] }
              as: EngagementLead
              captures: { eng_id: $.data.id }
            - call: "POST /engagements/${eng_id}/authorize"
              payload: {}
              as: ClientContact
            - call: "POST /engagements/${eng_id}/start"
              payload: {}
              as: EngagementLead
              captures: { eng_v2: $.data.version }
            - call: "POST /scans"
              payload: { engagement_id: "${eng_id}", expected_engagement_version: "${eng_v2}" }
              as: EngagementLead
              captures: { scan_id: $.data.id }
          trigger:
            - call: "POST /engagements/${eng_id}/complete"
              payload: {}
              as: EngagementLead
              captures: { err: $.data.error_id }
          assert:
            - "complete returns ERR_SCANS_IN_FLIGHT (409) — a QUEUED scan exists"

      - name: triage_alert_on_decommissioned_asset_returns_asset_decommissioned
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Alert.NEW_to_TRIAGED
          - validations[priority=22]
          - errors[ERR_ASSET_DECOMMISSIONED]
        distinguishing_aspect: "Triaging a NEW alert whose asset has been DECOMMISSIONED returns ERR_ASSET_DECOMMISSIONED (409)."
        test_recipe:
          setup:
            - "Asset created, an alert ingested on it, then the asset decommissioned."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "SM6", tier: "ESSENTIAL", retainer_hours_per_period: 50 }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /assets"
              payload: { client_id: "${client_id}", hostname: "sm6-01", ip_address: "10.0.3.6", criticality: "MEDIUM" }
              as: PlatformAdmin
              captures: { asset_id: $.data.id }
            - call: "POST /alerts"
              payload: { client_id: "${client_id}", asset_id: "${asset_id}", source: "EDR", raw_score: 50 }
              as: SocAnalyst
              captures: { alert_id: $.data.id }
            - call: "POST /assets/${asset_id}/decommission"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /alerts/${alert_id}/triage"
              payload: {}
              as: SocAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "triage returns ERR_ASSET_DECOMMISSIONED (409)"

      - name: reopen_incident_in_later_period_returns_reopen_window_closed
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Incident.RESOLVED_to_REOPENED
          - validations[priority=21]
          - errors[ERR_REOPEN_WINDOW_CLOSED]
        distinguishing_aspect: "Reopening an incident resolved in period 0 after advance-period (now period 1) returns ERR_REOPEN_WINDOW_CLOSED (409)."
        test_recipe:
          setup:
            - "Incident resolved in period 0, then POST /clients/{id}/advance-period moves the client to period 1."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "SM7", tier: "ESSENTIAL", retainer_hours_per_period: 100 }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /assets"
              payload: { client_id: "${client_id}", hostname: "sm7-01", ip_address: "10.0.3.7", criticality: "CROWN_JEWEL", exposure: "EXTERNAL" }
              as: PlatformAdmin
              captures: { asset_id: $.data.id }
            - call: "POST /alerts"
              payload: { client_id: "${client_id}", asset_id: "${asset_id}", source: "SIEM", raw_score: 90 }
              as: SocAnalyst
              captures: { alert_id: $.data.id }
            - call: "POST /alerts/${alert_id}/triage"
              payload: {}
              as: SocAnalyst
            - call: "POST /alerts/${alert_id}/promote"
              payload: {}
              as: SocAnalyst
              captures: { incident_id: $.data.promoted_incident_id }
            - call: "POST /incidents/${incident_id}/acknowledge"
              payload: {}
              as: SocAnalyst
            - call: "POST /incidents/${incident_id}/contain"
              payload: { quarantine_asset: false }
              as: SocAnalyst
            - call: "POST /incidents/${incident_id}/resolve"
              payload: { response_hours: 2 }
              as: EngagementLead
            - call: "POST /clients/${client_id}/advance-period"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /incidents/${incident_id}/reopen"
              payload: {}
              as: SocAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "reopen returns ERR_REOPEN_WINDOW_CLOSED (409) — resolved in period 0, now period 1"

      - name: start_engagement_outside_window_returns_outside_window
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Engagement.AUTHORIZED_to_ACTIVE
          - validations[priority=15]
          - errors[ERR_OUTSIDE_WINDOW]
        distinguishing_aspect: "Starting an AUTHORIZED engagement when the clock is before authorized_window_start returns ERR_OUTSIDE_WINDOW (409)."
        test_recipe:
          setup:
            - "Engagement authorized with window starting 2026-03-15; clock left at default 2026-03-01."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "SM8", tier: "ESSENTIAL", retainer_hours_per_period: 100 }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /assets"
              payload: { client_id: "${client_id}", hostname: "sm8-01", ip_address: "10.0.3.8", criticality: "MEDIUM" }
              as: PlatformAdmin
              captures: { asset_id: $.data.id }
            - call: "POST /engagements"
              payload: { client_id: "${client_id}", kind: "VULN_SCAN", authorized_window_start: "2026-03-15T00:00:00Z", authorized_window_end: "2026-04-01T00:00:00Z", estimated_hours: 10, scope_asset_ids: ["${asset_id}"] }
              as: EngagementLead
              captures: { eng_id: $.data.id }
            - call: "POST /engagements/${eng_id}/authorize"
              payload: {}
              as: ClientContact
          trigger:
            - call: "POST /engagements/${eng_id}/start"
              payload: {}
              as: EngagementLead
              captures: { err: $.data.error_id }
          assert:
            - "start returns ERR_OUTSIDE_WINDOW (409) — clock 2026-03-01 is before window start 2026-03-15"

      - name: terminal_finding_remediated_no_further_transition
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Finding.REMEDIATION_SUBMITTED_to_REMEDIATED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "A REMEDIATED finding (terminal) rejects a further start-remediation with ERR_INVALID_STATE (409)."
        test_recipe:
          setup:
            - "Finding driven to REMEDIATED via a passing retest by a lead different from the submitter."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "SM9", tier: "ESSENTIAL", retainer_hours_per_period: 100 }
