  - rule_id: transitive_cascade
    instances:
      - name: qa_fail_regression_four_hop_cascade
        grounds:
          - state_machines.QAReview.IN_PROGRESS_to_COMPLETED
          - state_machines.Engagement.REPORTING_to_FIELDWORK
          - state_machines.Workpaper.SIGNED_OFF_to_RETURNED
          - state_machines.AuditReport.PENDING_APPROVAL_to_DRAFT
          - entities.CommitteePack.fields.is_stale_snapshot
        distinguishing_aspect: |
          Depth-3 chain originating from QA completion (distinct trigger from the
          extension cascade): QAReview COMPLETED(FAIL) -> Engagement REPORTING ->
          FIELDWORK -> both SIGNED_OFF Workpapers -> RETURNED (count 2 -> 0) ->
          PENDING_APPROVAL AuditReport -> DRAFT; each link is caused by the
          previous link's mutation, plus a DRAFT CommitteePack staleness flag.
