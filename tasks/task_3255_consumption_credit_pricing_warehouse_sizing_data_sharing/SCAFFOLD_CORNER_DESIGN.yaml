      - name: error_monitor_missing_on_include_consumers_scope
        claim_type: violation_to_error
        grounds:
          - errors[ERR_MONITOR_MISSING]
          - validations[priority=15]
        distinguishing_aspect: "An INCLUDE_CONSUMERS account with no published share cannot drive a consumer-scoped sweep, so an existing monitor's reset is refused with the monitor-scope error rather than succeeding as a no-op."
        test_recipe:
          setup: ["one account in monitor scope INCLUDE_CONSUMERS with a monitor but no published share"]
          setup_api_calls:
