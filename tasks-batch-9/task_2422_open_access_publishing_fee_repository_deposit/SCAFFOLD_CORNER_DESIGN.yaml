            - "${k2_score_b} == 0"
            - "${k2_score_b} != -10"
            - "${k2_status_b} == CLEARED"
            - "${k2_guidance_b} == Venue cleared: institutional APC funds and agreement coverage may be used."

      - name: corner_screening_uses_only_the_current_run_signals
        claim_type: input_set_filtering
        grounds:
          - calculations.predatory_screening_score.input_set
          - endpoints[POST /publishers/{id}/screening-runs]
        distinguishing_aspect: |
          The same publisher is screened twice: an all-bad run scoring 90 (BLOCKED) is followed
          by an all-clean run, and the second verdict is 0 / CLEARED — the earlier run is
          discarded, not averaged (an averaging implementation would report 45 and WATCHLIST).
