  - rule_id: priority_pair_validation_conflict
    instances:
      - name: waive_settled_state_error_beats_fiscal_error
        grounds:
          - validations[priority=5]
          - validations[priority=10]
          - errors[ERR_PENALTY_INVALID_STATE]
          - errors[ERR_WAIVER_EXCEEDS_OUTSTANDING]
        distinguishing_aspect: |
          Category pair state vs business_fiscal: waiving 1 cent on a SETTLED penalty violates
          both the state guard (not ASSESSED) and the fiscal guard (1 > outstanding 0); priority 5
          beats priority 10, so the error is ERR_PENALTY_INVALID_STATE.
        test_recipe:
          setup:
