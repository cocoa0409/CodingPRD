  - section: errors
    instances:
      - name: request_missing_x_user_role_header_is_unauthenticated
        claim_type: triggerability
        grounds:
          - errors.ERR_UNAUTHENTICATED
          - validations[priority=1]
        distinguishing_aspect: "An empty-string X-User-Role on an otherwise perfect read is ERR_UNAUTHENTICATED (401), not the 403 of priority 2 - the header must be present and name a declared role before role membership is even consulted."
        test_recipe:
          setup:
            - "clock at 2026-08-01T00:00:00Z; one account to address"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /voip/accounts"
              payload: { account_number: "ACCT1037", billing_name: "LARKSPUR SA", service_state_code: "CA", status: "ACTIVE" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
          trigger:
            - call: "GET /voip/accounts/${acct_id}"
              payload: {}
              as: ""
              as_user_id: "platform-1"
          assert:
            - "the trigger returns HTTP 401 with error_id ERR_UNAUTHENTICATED"
            - "the same GET as PlatformAdmin returns HTTP 200, proving the id and route were fine"

      - name: list_with_limit_zero_returns_invalid_pagination
        claim_type: triggerability
        grounds:
          - errors.ERR_INVALID_PAGINATION
          - validations[priority=5]
        distinguishing_aspect: "limit 0 is outside 1..100 so the list is refused with ERR_INVALID_PAGINATION (400); limit 100 is accepted, so the ceiling is inclusive and only the floor was violated."
        test_recipe:
          setup:
            - "clock at 2026-08-01T00:00:00Z; one number block so the list is non-empty"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /voip/jurisdictions"
              payload: { state_code: "CA", county_fips: "06001", fee_type: "PER_LINE", monthly_fee_cents: 175, remit_day_of_month: 5 }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /voip/number-blocks"
              payload: { jurisdiction_id: "${jur_id}", npa_nxx: "415624", total_capacity: 4, max_concurrent_reservations: 2 }
              as: NumberingAdmin
              captures: { blk_id: $.data.id }
          trigger:
            - call: "GET /voip/number-blocks?limit=0&offset=0"
              payload: { limit: 0, offset: 0 }
              as: NumberingAdmin
            - call: "GET /voip/number-blocks?limit=100&offset=0"
              payload: { limit: 100, offset: 0 }
              as: NumberingAdmin
          assert:
            - "the first trigger returns HTTP 400 with error_id ERR_INVALID_PAGINATION"
            - "the second trigger returns HTTP 200 with total_count 1, limit 100, offset 0, has_more false"

      - name: suspended_account_cannot_open_a_port_request
        claim_type: triggerability
        grounds:
          - errors.ERR_ACCOUNT_NOT_ACTIVE
          - validations[priority=10]
        distinguishing_aspect: "The account exists and every body field is valid, so the refusal is ERR_ACCOUNT_NOT_ACTIVE (409) from priority 10 rather than a 404 or a 400, and no PortRequest row is created."
        test_recipe:
          setup:
            - "clock at 2026-08-01T00:00:00Z; a SUSPENDED account and a carrier"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /voip/accounts"
              payload: { account_number: "ACCT1038", billing_name: "MALLOW BV", service_state_code: "CA", status: "SUSPENDED" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /voip/carriers"
              payload: { name: "Mallow Legacy", ocn: "ML19", csr_match_policy: "STRICT", porting_buffer_minutes: 30, foc_business_days: 2 }
              as: PlatformAdmin
              captures: { car_id: $.data.id }
          trigger:
            - call: "POST /voip/port-requests"
              payload: { account_id: "${acct_id}", losing_carrier_id: "${car_id}", requested_numbers: ["+14155551806"], claimed_account_number: "CSR-1038", claimed_pin: "1038", claimed_billing_name: "MALLOW BV", claimed_address_line1: "38 MALLOW MEWS", claimed_zip: "94577" }
              as: PortingSpecialist
              as_user_id: "porting-1"
          assert:
            - "the trigger returns HTTP 409 with error_id ERR_ACCOUNT_NOT_ACTIVE"
            - "GET /voip/port-requests?account_id=${acct_id} returns total_count 0"

      - name: the_user_who_filed_the_port_cannot_also_snapshot_its_csr
        claim_type: triggerability
        grounds:
          - errors.ERR_SEGREGATION_OF_DUTIES_VIOLATION
          - validations[priority=29]
          - complexity_profile.role_model
        distinguishing_aspect: "The snapshot body is valid and the acting role is the required CarrierLiaison, so the only defect is that X-User-ID equals the port request's created_by_user_id: ERR_SEGREGATION_OF_DUTIES_VIOLATION (403), and a different liaison user then succeeds."
        test_recipe:
          setup:
            - "clock at 2026-08-03T09:00:00Z; a SUBMITTED port request filed by user porting-1"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /voip/accounts"
              payload: { account_number: "ACCT1039", billing_name: "NETTLE KK", service_state_code: "CA", status: "ACTIVE" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /voip/carriers"
              payload: { name: "Nettle Legacy", ocn: "NL20", csr_match_policy: "STRICT", porting_buffer_minutes: 30, foc_business_days: 2 }
              as: PlatformAdmin
              captures: { car_id: $.data.id }
            - call: "POST /voip/port-requests"
              payload: { account_id: "${acct_id}", losing_carrier_id: "${car_id}", requested_numbers: ["+14155551807"], claimed_account_number: "CSR-1039", claimed_pin: "1039", claimed_billing_name: "NETTLE KK", claimed_address_line1: "39 NETTLE NOOK", claimed_zip: "94577" }
              as: PortingSpecialist
              as_user_id: "porting-1"
              captures: { pr_id: $.data.id, pr_v1: $.data.version }
          trigger:
            - call: "POST /voip/port-requests/${pr_id}/csr-snapshots"
              payload: { account_number_on_file: "CSR-1039", pin_on_file: "1039", billing_name_on_file: "NETTLE KK", address_line1_on_file: "39 NETTLE NOOK", zip_on_file: "94577", expected_port_request_version: "${pr_v1}" }
              as: CarrierLiaison
              as_user_id: "porting-1"
            - call: "POST /voip/port-requests/${pr_id}/csr-snapshots"
              payload: { account_number_on_file: "CSR-1039", pin_on_file: "1039", billing_name_on_file: "NETTLE KK", address_line1_on_file: "39 NETTLE NOOK", zip_on_file: "94577", expected_port_request_version: "${pr_v1}" }
              as: CarrierLiaison
              as_user_id: "liaison-1"
              captures: { snap_id: $.data.id }
          assert:
            - "the first trigger returns HTTP 403 with error_id ERR_SEGREGATION_OF_DUTIES_VIOLATION"
            - "after the first trigger PortRequest.${pr_id}.status is still SUBMITTED with version ${pr_v1}"
            - "the second trigger returns HTTP 201 with CarrierAccountSnapshot.${snap_id}.match_status == MATCHED and match_points == 100"
            - "PortRequest.${pr_id}.status == VALIDATED after the second trigger"

      - name: minting_past_total_capacity_is_rejected
        claim_type: triggerability
        grounds:
          - errors.ERR_BLOCK_CAPACITY_EXHAUSTED
          - validations[priority=46]
        distinguishing_aspect: "With total_capacity 1 the first mint succeeds and the second is refused with ERR_BLOCK_CAPACITY_EXHAUSTED (409); minted_count stays 1, so the ceiling compares minted_count < total_capacity before insertion."
        test_recipe:
          setup:
            - "clock at 2026-08-01T00:00:00Z; block 415625 with total_capacity 1"
          setup_api_calls:
