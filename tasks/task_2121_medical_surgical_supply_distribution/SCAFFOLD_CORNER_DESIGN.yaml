# =============================================================================
# 1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth walk of references/claim-extraction-guide.md against SCAFFOLD.yaml
# 1.1-1.7. Instances already exercised by SCAFFOLD_DIFFICULTY_DESIGN.yaml are
# emitted as excluded_because stubs.
# Logical clock starts at 2026-08-01T00:00:00Z on every fresh server.
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:

      - name: create_supply_room_returns_201_with_defaults_and_system_fields
        claim_type: creation
        grounds:
          - entities.SupplyRoom
          - endpoints[POST /supply-rooms]
        distinguishing_aspect: "A supply room created with only the four required fields comes back 201 with refrigerated false, controlled_secured false, controlled_license_status NONE, window 360..1080, credit_limit_cents 100000000, open_commitment_cents 0, version 1 and a bare UUID id with no type prefix."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ContractAdmin
          trigger:
            - call: "POST /supply-rooms"
              payload: { facility_code: "FAC-100", room_code: "GEN-100", gpo_member_class: "NON_ACUTE", room_type: "GENERAL_STORE" }
              as: ContractAdmin
              captures: { room_id: $.data.id, room_v: $.data.version }
          assert:
            - "HTTP 201 and response_type == object"
            - "SupplyRoom.${room_id}.refrigerated == false and controlled_secured == false and controlled_license_status == NONE"
            - "SupplyRoom.${room_id}.window_open_min == 360 and window_close_min == 1080"
            - "SupplyRoom.${room_id}.credit_limit_cents == 100000000 and open_commitment_cents == 0"
            - "${room_v} == 1"
            - "${room_id} matches the bare UUID form 8-4-4-4-12 with no prefix such as sr_"
            - "created_at and updated_at are ISO 8601 UTC with exactly three fractional digits"

      - name: get_supply_room_returns_stored_entity
        claim_type: retrieval
        grounds:
          - entities.SupplyRoom
          - endpoints[GET /supply-rooms/{supply_room_id}]
        distinguishing_aspect: "GET /supply-rooms/{id} returns exactly the row written by the create, field for field."
        test_recipe:
          setup:
            - "One supply room created with explicit non-default attributes."
          setup_api_calls:
            - call: "POST /supply-rooms"
              payload: { facility_code: "FAC-101", room_code: "PHARM-101", gpo_member_class: "SURGERY_CENTER", room_type: "PHARMACY_VAULT", refrigerated: true, controlled_secured: true, controlled_license_status: "ACTIVE", window_open_min: 420, window_close_min: 900, credit_limit_cents: 250000 }
              as: ContractAdmin
              captures: { room_id: $.data.id }
          trigger:
            - call: "GET /supply-rooms/${room_id}"
              payload: {}
              as: MaterialsManager
              as_user_id: "${room_id}"
              captures: { got_code: $.data.room_code, got_window: $.data.window_close_min }
          assert:
            - "HTTP 200 and ${got_code} == PHARM-101 and ${got_window} == 900"
            - "SupplyRoom.${room_id}.gpo_member_class == SURGERY_CENTER and controlled_license_status == ACTIVE"

      - name: list_items_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - entities.Item
          - endpoints[GET /items]
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /items?limit=2&offset=0 over three items returns two rows with total_count 3 and has_more true; offset 2 returns one row with has_more false."
        test_recipe:
          setup:
            - "Three AMBIENT case items in the item master."
          setup_api_calls:
            - call: "POST /items"
              payload: { sku: "SKU-L1-CS", description: "List probe 1", manufacturer_code: "MFR-ACME", uom: "CS", wac_cents: 1000, handling_class: "AMBIENT", units_per_parent: 10 }
              as: ContractAdmin
            - call: "POST /items"
              payload: { sku: "SKU-L2-CS", description: "List probe 2", manufacturer_code: "MFR-ACME", uom: "CS", wac_cents: 1000, handling_class: "AMBIENT", units_per_parent: 10 }
              as: ContractAdmin
            - call: "POST /items"
              payload: { sku: "SKU-L3-CS", description: "List probe 3", manufacturer_code: "MFR-ACME", uom: "CS", wac_cents: 1000, handling_class: "AMBIENT", units_per_parent: 10 }
              as: ContractAdmin
          trigger:
            - call: "GET /items"
              payload: { limit: 2, offset: 0 }
              as: ContractAdmin
              captures: { first_id: "$.data[0].id" }
            - call: "GET /items"
              payload: { limit: 2, offset: 2 }
              as: ContractAdmin
              captures: { third_id: "$.data[0].id" }
          assert:
            - "first call: response_type == array, exactly 2 rows, meta pagination total_count == 3, has_more == true, limit == 2, offset == 0"
            - "second call: exactly 1 row, total_count == 3, has_more == false"
            - "${first_id} != ${third_id}"

      - name: get_item_with_unknown_uuid_returns_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_ITEM_NOT_FOUND]
          - validations[priority=4]
        distinguishing_aspect: "A syntactically valid but unallocated UUID on GET /items/{id} yields ERR_ITEM_NOT_FOUND with HTTP 404, not 400."
        test_recipe:
          setup:
            - "Empty item master."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ContractAdmin
          trigger:
            - call: "GET /items/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ContractAdmin
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_ITEM_NOT_FOUND with HTTP 404"
            - "response_type == error and the body carries meta.api_request_id and meta.api_request_timestamp"

      - name: create_item_missing_required_wac_returns_validation_error
        claim_type: required_fields
        grounds:
          - validations[priority=3]
          - errors[ERR_VALIDATION]
          - entities.Item.fields.wac_cents
        distinguishing_aspect: "Omitting wac_cents, an input field with no default, fails with ERR_VALIDATION 400 before any row is written."
        test_recipe:
          setup:
            - "Empty item master."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ContractAdmin
          trigger:
            - call: "POST /items"
              payload: { sku: "SKU-BAD-CS", description: "Missing wac", manufacturer_code: "MFR-ACME", uom: "CS", handling_class: "AMBIENT" }
              as: ContractAdmin
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_VALIDATION with HTTP 400"
            - "GET /items returns total_count == 0"

      - name: create_item_defaults_applied_when_optional_fields_omitted
        claim_type: defaults
        grounds:
          - entities.Item.fields.units_per_parent
          - entities.Item.fields.is_lot_tracked
          - entities.Item.fields.status
          - entities.Item.fields.lum_parent_item_id
        distinguishing_aspect: "Omitting units_per_parent, is_lot_tracked, status and lum_parent_item_id yields 1, true, ACTIVE and null respectively."
        test_recipe:
          setup:
            - "Empty item master."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ContractAdmin
          trigger:
            - call: "POST /items"
              payload: { sku: "SKU-DEF-EA", description: "Defaults probe", manufacturer_code: "MFR-ACME", uom: "EA", wac_cents: 300, handling_class: "AMBIENT" }
              as: ContractAdmin
              captures: { item_id: $.data.id }
          assert:
            - "Item.${item_id}.units_per_parent == 1"
            - "Item.${item_id}.is_lot_tracked == true"
            - "Item.${item_id}.status == ACTIVE"
            - "Item.${item_id}.lum_parent_item_id == null"

      - name: lot_quantity_on_hand_is_computed_and_client_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Lot.fields.quantity_on_hand
          - entities.Lot.fields.status
          - endpoints[POST /lots]
        distinguishing_aspect: "quantity_on_hand and status are server-derived: a create carrying quantity_on_hand 5 and status QUARANTINED still yields quantity_on_hand == received_quantity == 40 and status AVAILABLE."
        test_recipe:
          setup:
            - "One AMBIENT case item."
          setup_api_calls:
            - call: "POST /items"
              payload: { sku: "SKU-LOTSYS-CS", description: "Lot system-field probe", manufacturer_code: "MFR-ACME", uom: "CS", wac_cents: 2000, handling_class: "AMBIENT", units_per_parent: 10 }
              as: ContractAdmin
              captures: { item_id: $.data.id }
          trigger:
            - call: "POST /lots"
              payload: { item_id: "${item_id}", lot_code: "LOT-SYS", expiry_date: "2027-12-31T00:00:00Z", received_quantity: 40, quantity_on_hand: 5, status: "QUARANTINED" }
              as: DistributionOperator
              as_user_id: "dc-op-1"
              captures: { lot_id: $.data.id }
          assert:
            - "either the request is refused with ERR_VALIDATION 400 for the undeclared keys, or it succeeds and the server-owned values win"
            - "if it succeeds: Lot.${lot_id}.quantity_on_hand == 40 and status == AVAILABLE and received_quantity == 40"

      - name: create_item_with_invalid_handling_class_enum_returns_validation_error
        claim_type: type_constraints
        grounds:
          - validations[priority=3]
          - entities.Item.fields.handling_class
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "handling_class FROZEN is outside the declared enum {AMBIENT, COLD_CHAIN, CONTROLLED, CONTROLLED_COLD} and fails with ERR_VALIDATION 400."
        test_recipe:
          setup:
            - "Empty item master."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ContractAdmin
          trigger:
            - call: "POST /items"
              payload: { sku: "SKU-ENUM-CS", description: "Enum probe", manufacturer_code: "MFR-ACME", uom: "CS", wac_cents: 1000, handling_class: "FROZEN", units_per_parent: 10 }
              as: ContractAdmin
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_VALIDATION with HTTP 400"

      - name: formulary_item_rejects_reorder_point_not_below_par_qty
        claim_type: type_constraints
        grounds:
          - validations[priority=3]
          - entities.FormularyItem.fields.reorder_point
          - entities.FormularyItem.fields.par_qty
        distinguishing_aspect: "reorder_point 100 with par_qty 100 violates the declared 0 <= reorder_point < par_qty bound and fails with ERR_VALIDATION 400."
        test_recipe:
          setup:
            - "One supply room and one AMBIENT case item."
          setup_api_calls:
            - call: "POST /supply-rooms"
              payload: { facility_code: "FAC-102", room_code: "GEN-102", gpo_member_class: "ACUTE", room_type: "GENERAL_STORE" }
              as: ContractAdmin
              captures: { room_id: $.data.id }
            - call: "POST /items"
              payload: { sku: "SKU-PAR-CS", description: "Par bound probe", manufacturer_code: "MFR-ACME", uom: "CS", wac_cents: 1000, handling_class: "AMBIENT", units_per_parent: 10 }
              as: ContractAdmin
              captures: { item_id: $.data.id }
          trigger:
            - call: "POST /supply-rooms/${room_id}/formulary-items"
              payload: { item_id: "${item_id}", facility_item_code: "FAC-PAR", par_qty: 100, reorder_point: 100 }
              as: MaterialsManager
              as_user_id: "${room_id}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_VALIDATION with HTTP 400"
            - "GET /formulary-items?supply_room_id=${room_id} returns total_count == 0"

      - name: item_self_reference_lum_parent_resolves_through_filtered_list
        claim_type: parent_relationships
        grounds:
          - entities.Item.fields.lum_parent_item_id
          - endpoints[GET /items]
        distinguishing_aspect: "The self-referential Item edge works both ways: the EA child stores the CS parent's id, and GET /items?lum_parent_item_id=<parent> returns exactly that child."
        test_recipe:
          setup:
            - "One case-level item and one each-level item declaring it as its LUM parent."
          setup_api_calls:
            - call: "POST /items"
              payload: { sku: "SKU-PARENT-CS", description: "Suture, case of 36", manufacturer_code: "MFR-ACME", uom: "CS", wac_cents: 9000, handling_class: "AMBIENT", units_per_parent: 36 }
              as: ContractAdmin
              captures: { parent_id: $.data.id }
            - call: "POST /items"
              payload: { sku: "SKU-CHILD-EA", description: "Suture, each", manufacturer_code: "MFR-ACME", uom: "EA", wac_cents: 250, handling_class: "AMBIENT", units_per_parent: 1, lum_parent_item_id: "${parent_id}" }
              as: ContractAdmin
              captures: { child_id: $.data.id }
          trigger:
            - call: "GET /items"
              payload: { lum_parent_item_id: "${parent_id}", limit: 10, offset: 0 }
              as: ContractAdmin
              captures: { found_id: "$.data[0].id" }
          assert:
            - "exactly 1 row returned with total_count == 1"
            - "${found_id} == ${child_id}"
            - "Item.${child_id}.lum_parent_item_id == ${parent_id} and Item.${parent_id}.lum_parent_item_id == null"

      - name: contract_line_junction_row_reachable_from_both_contract_and_item
        claim_type: many_to_many_junction
        grounds:
          - entities.ContractLine.fields.contract_id
          - entities.ContractLine.fields.item_id
          - endpoints[GET /contract-lines]
        distinguishing_aspect: "The ContractLine junction is reachable from either side of the graph: filtering by contract_id and filtering by item_id both return the same single row."
        test_recipe:
          setup:
            - "One DRAFT contract with one line for one item."
          setup_api_calls:
            - call: "POST /items"
              payload: { sku: "SKU-JXN-CS", description: "Junction probe", manufacturer_code: "MFR-ACME", uom: "CS", wac_cents: 3000, handling_class: "AMBIENT", units_per_parent: 12 }
              as: ContractAdmin
              captures: { item_id: $.data.id }
            - call: "POST /contracts"
              payload: { manufacturer_code: "MFR-ACME", contract_code: "CTR-JXN", tier: "TIER_2", member_class_scope: "ACUTE", effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T23:59:59Z" }
              as: ContractAdmin
              captures: { ctr_id: $.data.id }
            - call: "POST /contracts/${ctr_id}/lines"
              payload: { item_id: "${item_id}", tier_price_cents: 2500, floor_price_cents: 2000 }
              as: ContractAdmin
              captures: { cl_id: $.data.id }
          trigger:
            - call: "GET /contract-lines"
              payload: { contract_id: "${ctr_id}", limit: 10, offset: 0 }
              as: ContractAdmin
              captures: { by_contract_id: "$.data[0].id" }
            - call: "GET /contract-lines"
              payload: { item_id: "${item_id}", limit: 10, offset: 0 }
              as: ContractAdmin
              captures: { by_item_id: "$.data[0].id" }
          assert:
            - "both calls return total_count == 1"
            - "${by_contract_id} == ${cl_id} and ${by_item_id} == ${cl_id}"
            - "ContractLine.${cl_id}.activation_state == PENDING and contract_id == ${ctr_id}"

      - name: duplicate_room_code_rejected_with_uniqueness_error
        claim_type: type_constraints
        grounds:
          - validations[priority=9]
          - errors[ERR_DUPLICATE_ROOM_CODE]
        distinguishing_aspect: "room_code is globally unique; a second create with the same code fails with ERR_DUPLICATE_ROOM_CODE 409 even though facility_code differs."
        test_recipe:
          setup:
            - "One supply room with room_code OR-DUP."
          setup_api_calls:
            - call: "POST /supply-rooms"
              payload: { facility_code: "FAC-103", room_code: "OR-DUP", gpo_member_class: "ACUTE", room_type: "OR_CORE" }
              as: ContractAdmin
              captures: { room_id: $.data.id }
          trigger:
            - call: "POST /supply-rooms"
              payload: { facility_code: "FAC-104", room_code: "OR-DUP", gpo_member_class: "NON_ACUTE", room_type: "ICU" }
              as: ContractAdmin
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_DUPLICATE_ROOM_CODE with HTTP 409"

      - name: order_computed_totals_reflect_lines_not_client_input
        claim_type: computed_fields
        grounds: [calculations.order_total, entities.ReplenishmentOrder.fields.order_total_cents]
        excluded_because:
          difficulty_instance: combinatorial_formula / order_total_rounds_distribution_fee_per_line_before_summing
          rationale: "The per-line rounding instance already asserts extended_price_cents, line_fee_cents and order_total_cents as pure server-side derivations."

  - section: state_machines
    instances:

      - name: new_order_starts_in_draft_and_unbilled
        claim_type: initial_state
        grounds:
          - state_machines.ReplenishmentOrder.fulfillment_status
          - state_machines.ReplenishmentOrder.settlement_status
        distinguishing_aspect: "A freshly created ReplenishmentOrder reports fulfillment_status DRAFT and settlement_status UNBILLED with order_total_cents 0 and route_id null."
        test_recipe:
          setup:
            - "One ACUTE supply room."
          setup_api_calls:
            - call: "POST /supply-rooms"
              payload: { facility_code: "FAC-200", room_code: "GEN-200", gpo_member_class: "ACUTE", room_type: "GENERAL_STORE" }
              as: ContractAdmin
              captures: { room_id: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { supply_room_id: "${room_id}" }
              as: MaterialsManager
              as_user_id: "${room_id}"
              captures: { order_id: $.data.id }
          assert:
            - "ReplenishmentOrder.${order_id}.fulfillment_status == DRAFT and settlement_status == UNBILLED"
            - "ReplenishmentOrder.${order_id}.order_total_cents == 0 and route_id == null and submitted_at == null and delivered_at == null"

      - name: contract_activate_directly_from_draft_is_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.GpoContract.DRAFT_to_PENDING_ACTIVATION
          - errors[ERR_CONTRACT_TRANSITION_INVALID]
          - validations[priority=8]
        distinguishing_aspect: "DRAFT -> ACTIVE is not an edge in the contract machine; the only DRAFT exit is PENDING_ACTIVATION, so a direct activate fails with ERR_CONTRACT_TRANSITION_INVALID 409 and the contract stays DRAFT."
        test_recipe:
          setup:
            - "One DRAFT contract carrying one contract line."
          setup_api_calls:
            - call: "POST /items"
              payload: { sku: "SKU-SM1-CS", description: "State probe 1", manufacturer_code: "MFR-ACME", uom: "CS", wac_cents: 4000, handling_class: "AMBIENT", units_per_parent: 10 }
              as: ContractAdmin
              captures: { item_id: $.data.id }
            - call: "POST /contracts"
              payload: { manufacturer_code: "MFR-ACME", contract_code: "CTR-SM1", tier: "TIER_1", member_class_scope: "ACUTE", effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T23:59:59Z" }
              as: ContractAdmin
              captures: { ctr_id: $.data.id }
            - call: "POST /contracts/${ctr_id}/lines"
              payload: { item_id: "${item_id}", tier_price_cents: 3000, floor_price_cents: 2000 }
              as: ContractAdmin
              captures: { cl_id: $.data.id }
          trigger:
            - call: "POST /contracts/${ctr_id}/transition"
              payload: { to_status: "ACTIVE" }
              as: ContractAdmin
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_CONTRACT_TRANSITION_INVALID with HTTP 409"
            - "GpoContract.${ctr_id}.status == DRAFT and activated_at == null"
            - "ContractLine.${cl_id}.activation_state == PENDING"

      - name: contract_pending_activation_requires_at_least_one_line
        claim_type: precondition_enforcement
        grounds:
          - state_machines.GpoContract.DRAFT_to_PENDING_ACTIVATION
          - errors[ERR_CONTRACT_TRANSITION_INVALID]
        distinguishing_aspect: "A contract with no ContractLine cannot leave DRAFT: the PENDING_ACTIVATION request fails with ERR_CONTRACT_TRANSITION_INVALID 409."
        test_recipe:
          setup:
            - "One DRAFT contract with no lines."
          setup_api_calls:
            - call: "POST /contracts"
              payload: { manufacturer_code: "MFR-ACME", contract_code: "CTR-SM2", tier: "TIER_1", member_class_scope: "ACUTE", effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T23:59:59Z" }
              as: ContractAdmin
              captures: { ctr_id: $.data.id }
          trigger:
            - call: "POST /contracts/${ctr_id}/transition"
              payload: { to_status: "PENDING_ACTIVATION" }
              as: ContractAdmin
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_CONTRACT_TRANSITION_INVALID with HTTP 409"
            - "GpoContract.${ctr_id}.status == DRAFT"

      - name: contract_expire_before_effective_to_is_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.GpoContract.ACTIVE_to_EXPIRED
          - errors[ERR_CONTRACT_TRANSITION_INVALID]
          - endpoints[POST /_clock/set_current_utc]
        distinguishing_aspect: "ACTIVE -> EXPIRED demands clock_now > effective_to; at 2026-08-01 against an effective_to of 2026-12-31T23:59:59Z the request fails, and after the clock moves to 2027-01-01 the same request succeeds and BLOCKS the lines."
        test_recipe:
          setup:
            - "One ACTIVE contract effective through 2026-12-31T23:59:59Z with one line, clock at 2026-08-01."
          setup_api_calls:
            - call: "POST /items"
              payload: { sku: "SKU-SM3-CS", description: "Expiry probe", manufacturer_code: "MFR-ACME", uom: "CS", wac_cents: 4000, handling_class: "AMBIENT", units_per_parent: 10 }
              as: ContractAdmin
              captures: { item_id: $.data.id }
            - call: "POST /contracts"
              payload: { manufacturer_code: "MFR-ACME", contract_code: "CTR-SM3", tier: "TIER_1", member_class_scope: "ACUTE", effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T23:59:59Z" }
              as: ContractAdmin
              captures: { ctr_id: $.data.id }
            - call: "POST /contracts/${ctr_id}/lines"
              payload: { item_id: "${item_id}", tier_price_cents: 3000, floor_price_cents: 2000 }
              as: ContractAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /contracts/${ctr_id}/transition"
              payload: { to_status: "PENDING_ACTIVATION" }
              as: ContractAdmin
            - call: "POST /contracts/${ctr_id}/transition"
              payload: { to_status: "ACTIVE" }
              as: ContractAdmin
          trigger:
            - call: "POST /contracts/${ctr_id}/transition"
              payload: { to_status: "EXPIRED" }
              as: ContractAdmin
              captures: { err: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-01T00:00:00Z" }
              as: ContractAdmin
            - call: "POST /contracts/${ctr_id}/transition"
              payload: { to_status: "EXPIRED" }
              as: ContractAdmin
          assert:
            - "${err} == ERR_CONTRACT_TRANSITION_INVALID with HTTP 409 and GpoContract.${ctr_id}.status == ACTIVE at that point"
            - "after the clock move: GpoContract.${ctr_id}.status == EXPIRED"
            - "ContractLine.${cl_id}.activation_state == BLOCKED"

      - name: contract_suspend_blocks_lines_and_resume_reactivates_them
        claim_type: cyclic_transition
        grounds:
          - state_machines.GpoContract.ACTIVE_to_SUSPENDED
          - state_machines.GpoContract.SUSPENDED_to_ACTIVE
          - state_machines.ContractLine.ACTIVE_to_BLOCKED
          - state_machines.ContractLine.BLOCKED_to_ACTIVE
          - errors[ERR_NO_ACTIVE_CONTRACT_PRICE]
        distinguishing_aspect: "The ACTIVE <-> SUSPENDED cycle drives the line cascade both ways: while SUSPENDED a line write fails with ERR_NO_ACTIVE_CONTRACT_PRICE, and after RESUME the identical write succeeds at 3000 cents."
        test_recipe:
          setup:
            - "One ACUTE supply room, one AMBIENT case item APPROVED on its formulary."
            - "Contract CTR-SM4 (TIER_1, ACUTE) ACTIVE with a line at tier_price 3000 / floor 2000."
            - "An empty DRAFT order for the room."
          setup_api_calls:
            - call: "POST /supply-rooms"
              payload: { facility_code: "FAC-204", room_code: "GEN-204", gpo_member_class: "ACUTE", room_type: "GENERAL_STORE" }
              as: ContractAdmin
              captures: { room_id: $.data.id }
            - call: "POST /items"
              payload: { sku: "SKU-SM4-CS", description: "Suspend probe", manufacturer_code: "MFR-ACME", uom: "CS", wac_cents: 8000, handling_class: "AMBIENT", units_per_parent: 10 }
              as: ContractAdmin
              captures: { item_id: $.data.id }
            - call: "POST /contracts"
              payload: { manufacturer_code: "MFR-ACME", contract_code: "CTR-SM4", tier: "TIER_1", member_class_scope: "ACUTE", effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T23:59:59Z" }
              as: ContractAdmin
              captures: { ctr_id: $.data.id }
            - call: "POST /contracts/${ctr_id}/lines"
              payload: { item_id: "${item_id}", tier_price_cents: 3000, floor_price_cents: 2000 }
              as: ContractAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /contracts/${ctr_id}/transition"
              payload: { to_status: "PENDING_ACTIVATION" }
              as: ContractAdmin
            - call: "POST /contracts/${ctr_id}/transition"
              payload: { to_status: "ACTIVE" }
              as: ContractAdmin
            - call: "POST /supply-rooms/${room_id}/formulary-items"
              payload: { item_id: "${item_id}", facility_item_code: "FAC-SM4", par_qty: 50, reorder_point: 10 }
              as: MaterialsManager
              as_user_id: "${room_id}"
              captures: { fi_id: $.data.id }
            - call: "POST /formulary-items/${fi_id}/decision"
              payload: { decision: "APPROVED" }
              as: Clinician
              as_user_id: "clin-1"
            - call: "POST /orders"
              payload: { supply_room_id: "${room_id}" }
              as: MaterialsManager
              as_user_id: "${room_id}"
              captures: { order_id: $.data.id, order_v1: $.data.version }
          trigger:
            - call: "POST /contracts/${ctr_id}/transition"
              payload: { to_status: "SUSPENDED" }
              as: ContractAdmin
            - call: "POST /orders/${order_id}/lines"
              payload: { item_id: "${item_id}", requested_qty: 1, expected_order_version: "${order_v1}" }
              as: MaterialsManager
              as_user_id: "${room_id}"
              captures: { err: $.data.error_id }
            - call: "POST /contracts/${ctr_id}/transition"
              payload: { to_status: "ACTIVE" }
              as: ContractAdmin
            - call: "POST /orders/${order_id}/lines"
              payload: { item_id: "${item_id}", requested_qty: 1, expected_order_version: "${order_v1}" }
              as: MaterialsManager
              as_user_id: "${room_id}"
              captures: { line_id: $.data.id }
          assert:
            - "after SUSPENDED: GpoContract.${ctr_id}.status == SUSPENDED and ContractLine.${cl_id}.activation_state == BLOCKED"
            - "${err} == ERR_NO_ACTIVE_CONTRACT_PRICE with HTTP 422"
            - "after the resume: GpoContract.${ctr_id}.status == ACTIVE and ContractLine.${cl_id}.activation_state == ACTIVE"
            - "OrderLine.${line_id}.pinned_unit_price_cents == 3000 and pinned_contract_line_id == ${cl_id}"
            - "ReplenishmentOrder.${order_id}.order_total_cents == 3083"

      - name: formulary_decision_on_delisted_mapping_is_rejected
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.FormularyItem.APPROVED_to_DELISTED
          - errors[ERR_FORMULARY_STATE_INVALID]
        distinguishing_aspect: "DELISTED is terminal on the FormularyItem machine: a follow-up APPROVED decision fails with ERR_FORMULARY_STATE_INVALID 409 and formulary_status stays DELISTED."
        test_recipe:
          setup:
            - "One supply room with an item mapped, APPROVED, then DELISTED."
          setup_api_calls:
            - call: "POST /supply-rooms"
              payload: { facility_code: "FAC-205", room_code: "GEN-205", gpo_member_class: "ACUTE", room_type: "GENERAL_STORE" }
              as: ContractAdmin
              captures: { room_id: $.data.id }
            - call: "POST /items"
              payload: { sku: "SKU-SM5-CS", description: "Delist probe", manufacturer_code: "MFR-ACME", uom: "CS", wac_cents: 2000, handling_class: "AMBIENT", units_per_parent: 10 }
              as: ContractAdmin
              captures: { item_id: $.data.id }
            - call: "POST /supply-rooms/${room_id}/formulary-items"
              payload: { item_id: "${item_id}", facility_item_code: "FAC-SM5", par_qty: 50, reorder_point: 10 }
              as: MaterialsManager
              as_user_id: "${room_id}"
              captures: { fi_id: $.data.id }
            - call: "POST /formulary-items/${fi_id}/decision"
              payload: { decision: "APPROVED" }
              as: Clinician
              as_user_id: "clin-1"
            - call: "POST /formulary-items/${fi_id}/decision"
              payload: { decision: "DELISTED" }
              as: Clinician
              as_user_id: "clin-1"
          trigger:
            - call: "POST /formulary-items/${fi_id}/decision"
              payload: { decision: "APPROVED" }
              as: Clinician
              as_user_id: "clin-2"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_FORMULARY_STATE_INVALID with HTTP 409"
            - "FormularyItem.${fi_id}.formulary_status == DELISTED and decided_by_user_id == clin-1"

      - name: lot_release_from_available_state_is_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.Lot.EXCURSION_HOLD_to_AVAILABLE
          - errors[ERR_LOT_STATE_INVALID]
        distinguishing_aspect: "RELEASE is only defined out of EXCURSION_HOLD; issued against an AVAILABLE lot it fails with ERR_LOT_STATE_INVALID 409 and leaves excursion_flagged_by_user_id null."
        test_recipe:
          setup:
            - "One AMBIENT case item with one AVAILABLE lot of 50 units."
          setup_api_calls:
            - call: "POST /items"
              payload: { sku: "SKU-SM6-CS", description: "Lot state probe", manufacturer_code: "MFR-ACME", uom: "CS", wac_cents: 2000, handling_class: "AMBIENT", units_per_parent: 10 }
              as: ContractAdmin
              captures: { item_id: $.data.id }
            - call: "POST /lots"
              payload: { item_id: "${item_id}", lot_code: "LOT-SM6", expiry_date: "2027-12-31T00:00:00Z", received_quantity: 50 }
              as: DistributionOperator
              as_user_id: "dc-op-1"
              captures: { lot_id: $.data.id }
          trigger:
            - call: "POST /lots/${lot_id}/excursion"
              payload: { action: "RELEASE" }
              as: DistributionOperator
              as_user_id: "dc-op-2"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_LOT_STATE_INVALID with HTTP 409"
            - "Lot.${lot_id}.status == AVAILABLE and excursion_flagged_by_user_id == null and quantity_on_hand == 50"

      - name: recall_close_before_cascade_is_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.RecallNotice.CASCADED_to_CLOSED
          - errors[ERR_RECALL_STATE_INVALID]
        distinguishing_aspect: "CLOSE is only defined out of CASCADED; issued against an ISSUED notice it fails with ERR_RECALL_STATE_INVALID 409 and no lot is touched."
        test_recipe:
          setup:
            - "One AMBIENT case item with an AVAILABLE lot and a RecallNotice in ISSUED naming that lot."
          setup_api_calls:
            - call: "POST /items"
              payload: { sku: "SKU-SM7-CS", description: "Recall state probe", manufacturer_code: "MFR-ACME", uom: "CS", wac_cents: 2000, handling_class: "AMBIENT", units_per_parent: 10 }
              as: ContractAdmin
              captures: { item_id: $.data.id }
            - call: "POST /lots"
              payload: { item_id: "${item_id}", lot_code: "LOT-SM7", expiry_date: "2027-12-31T00:00:00Z", received_quantity: 50 }
              as: DistributionOperator
              as_user_id: "dc-op-1"
              captures: { lot_id: $.data.id }
            - call: "POST /recall-notices"
              payload: { item_id: "${item_id}", lot_id: "${lot_id}", recall_class: "CLASS_III", reason: "Labelling defect" }
              as: ContractAdmin
              as_user_id: "ca-1"
              captures: { notice_id: $.data.id }
          trigger:
            - call: "POST /recall-notices/${notice_id}/cascade"
              payload: { action: "CLOSE" }
              as: DistributionOperator
              as_user_id: "dc-op-1"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_RECALL_STATE_INVALID with HTTP 409"
            - "RecallNotice.${notice_id}.status == ISSUED and quarantined_lot_count == 0 and cascaded_at == null"
            - "Lot.${lot_id}.status == AVAILABLE"

      - name: route_dispatch_with_no_assigned_orders_is_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.DeliveryRoute.PLANNED_to_DISPATCHED
          - errors[ERR_ROUTE_STATE_INVALID]
          - entities.DeliveryRoute.fields.planned_order_count
        distinguishing_aspect: "Dispatch demands planned_order_count >= 1; an empty PLANNED route fails with ERR_ROUTE_STATE_INVALID 409 and dispatched_at stays null."
        test_recipe:
          setup:
            - "One PLANNED route with no stops."
          setup_api_calls:
            - call: "POST /delivery-routes"
              payload: { route_code: "RT-SM8", service_date: "2026-08-05", vehicle_class: "AMBIENT_VAN" }
              as: DistributionOperator
              as_user_id: "dc-op-1"
              captures: { route_id: $.data.id }
          trigger:
            - call: "POST /delivery-routes/${route_id}/dispatch"
              payload: {}
              as: DistributionOperator
              as_user_id: "dc-op-1"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_ROUTE_STATE_INVALID with HTTP 409"
            - "DeliveryRoute.${route_id}.status == PLANNED and dispatched_at == null and planned_order_count == 0"

      - name: substitution_withdraw_cancels_the_still_open_target_line
        claim_type: conditional_cascade
        grounds:
          - state_machines.SubstitutionRequest.PENDING_to_WITHDRAWN
          - state_machines.OrderLine.OPEN_to_CANCELLED
          - calculations.order_total
        distinguishing_aspect: "The withdrawal cascade is conditional on the target line's state: a line still in OPEN is cancelled and drops out of order_total_cents, which returns to 0."
        test_recipe:
          setup:
            - "One ACUTE supply room with an APPROVED formulary item priced at 3000 cents by an ACTIVE TIER_1 contract."
            - "A DRAFT order with one OPEN line for quantity 1, so order_total_cents is 3083."
            - "A PENDING SubstitutionRequest raised against that still-OPEN line."
          setup_api_calls:
            - call: "POST /supply-rooms"
              payload: { facility_code: "FAC-209", room_code: "GEN-209", gpo_member_class: "ACUTE", room_type: "GENERAL_STORE" }
              as: ContractAdmin
              captures: { room_id: $.data.id }
            - call: "POST /items"
              payload: { sku: "SKU-SM9-CS", description: "Withdraw probe", manufacturer_code: "MFR-ACME", uom: "CS", wac_cents: 8000, handling_class: "AMBIENT", units_per_parent: 10 }
              as: ContractAdmin
              captures: { item_id: $.data.id }
            - call: "POST /items"
              payload: { sku: "SKU-SM9-ALT-CS", description: "Withdraw probe alternate", manufacturer_code: "MFR-ACME", uom: "CS", wac_cents: 8000, handling_class: "AMBIENT", units_per_parent: 10 }
              as: ContractAdmin
              captures: { alt_item_id: $.data.id }
            - call: "POST /contracts"
              payload: { manufacturer_code: "MFR-ACME", contract_code: "CTR-SM9", tier: "TIER_1", member_class_scope: "ACUTE", effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T23:59:59Z" }
              as: ContractAdmin
              captures: { ctr_id: $.data.id }
            - call: "POST /contracts/${ctr_id}/lines"
              payload: { item_id: "${item_id}", tier_price_cents: 3000, floor_price_cents: 2000 }
              as: ContractAdmin
            - call: "POST /contracts/${ctr_id}/transition"
              payload: { to_status: "PENDING_ACTIVATION" }
              as: ContractAdmin
            - call: "POST /contracts/${ctr_id}/transition"
              payload: { to_status: "ACTIVE" }
              as: ContractAdmin
            - call: "POST /supply-rooms/${room_id}/formulary-items"
              payload: { item_id: "${item_id}", facility_item_code: "FAC-SM9", par_qty: 50, reorder_point: 10 }
              as: MaterialsManager
              as_user_id: "${room_id}"
              captures: { fi_id: $.data.id }
            - call: "POST /formulary-items/${fi_id}/decision"
              payload: { decision: "APPROVED" }
              as: Clinician
              as_user_id: "clin-1"
            - call: "POST /orders"
              payload: { supply_room_id: "${room_id}" }
              as: MaterialsManager
              as_user_id: "${room_id}"
              captures: { order_id: $.data.id, order_v1: $.data.version }
            - call: "POST /orders/${order_id}/lines"
              payload: { item_id: "${item_id}", requested_qty: 1, expected_order_version: "${order_v1}" }
              as: MaterialsManager
              as_user_id: "${room_id}"
              captures: { line_id: $.data.id }
            - call: "POST /order-lines/${line_id}/substitution-requests"
              payload: { proposed_item_id: "${alt_item_id}", justification: "Checking whether the alternate is stocked" }
              as: MaterialsManager
              as_user_id: "${room_id}"
              captures: { sub_id: $.data.id }
          trigger:
            - call: "POST /substitution-requests/${sub_id}/respond"
              payload: { action: "WITHDRAW", response_note: "No longer needed" }
              as: MaterialsManager
              as_user_id: "${room_id}"
          assert:
            - "SubstitutionRequest.${sub_id}.status == WITHDRAWN and rounds_used == 0"
            - "OrderLine.${line_id}.line_status == CANCELLED and extended_price_cents == 0 and line_fee_cents == 0"
            - "ReplenishmentOrder.${order_id}.order_total_cents == 0"
            - "ReplenishmentOrder.${order_id}.fulfillment_status == CANCELLED because every line of the DRAFT order is now CANCELLED"

      - name: order_line_substitution_request_on_open_line_creates_pending_request
        claim_type: valid_transition
        grounds: [state_machines.OrderLine.BACKORDERED_to_SUBSTITUTED]
        excluded_because:
          difficulty_instance: transitive_cascade / substitution_approval_line_to_order_to_claim_three_hops
          rationale: "The APPROVE path from BACKORDERED to SUBSTITUTED with re-pinning is asserted in full there."
      - name: recall_cascade_side_effects_execute_end_to_end
        claim_type: side_effect_execution
        grounds: [state_machines.RecallNotice.ISSUED_to_CASCADED]
        excluded_because:
          difficulty_instance: transitive_cascade / recall_cascade_lot_to_line_to_order_to_route_four_hops
          rationale: "Every hop of the cascade, including the counters, is asserted there."
      - name: route_bubbles_up_to_completed_when_last_order_delivered
        claim_type: bubble_up
        grounds: [state_machines.DeliveryRoute.DISPATCHED_to_COMPLETED]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / order_delivery_gated_on_owning_delivery_route_state
          rationale: "That instance asserts DeliveryRoute status COMPLETED after the single assigned order is delivered."

  - section: calculations
