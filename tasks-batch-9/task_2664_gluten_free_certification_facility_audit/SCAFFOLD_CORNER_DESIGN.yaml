      - name: reinstatement_state_gate_outranks_the_open_critical_finding_gate
        claim_type: priority_ordering
        excluded_because:
          difficulty_instance: reinstatement_not_suspended_409_beats_open_critical_nonconformance_422
          rationale: |
            That difficulty instance already builds the exact double-violation state - a
            certificate that is ISSUED rather than SUSPENDED while an OPEN CRITICAL
            nonconformance stands against it - and asserts that
            POST /gfco/certificates/{certificateId}/reinstatement answers 409
            ERR_CERTIFICATE_NOT_SUSPENDED (priority 13) rather than 422
            ERR_OPEN_CRITICAL_NONCONFORMANCE (priority 21), with the certificate untouched.
            A corner instance would have to re-create the same two violations and make the
            same single assertion, so it is subsumed.

      - name: corrective_action_certificate_gate_outranks_the_overdue_gate
        claim_type: priority_ordering
        excluded_because:
          difficulty_instance: ca_plan_terminal_certificate_422_beats_overdue_422
          rationale: |
            The overdue window and the terminal-certificate condition are both violated there -
            the plan is filed after ca_due_on against a nonconformance whose certificate has
            been REVOKED - and the instance asserts ERR_CERTIFICATE_TERMINAL_NO_CA (priority 30)
            in preference to ERR_CORRECTIVE_ACTION_OVERDUE (priority 39), both 422, which is the
            hardest form of the ordering claim because the status code alone cannot distinguish
            them. Duplicating it here would add no discriminating power.

