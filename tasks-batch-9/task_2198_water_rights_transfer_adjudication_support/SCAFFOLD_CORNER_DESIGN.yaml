          clamps beyond it: 29.00 miles gives 0.5650, 30.00 gives 0.5500 by
          arithmetic, and 31.00 gives 0.5500 by the max() floor — so 30 and 31
          miles yield the SAME gross depletion.
        test_recipe:
          setup:
            - "CERTIFIED right for claimant A with a DRAFT CHANGE_OF_USE application for 100.00 AF; three successive INSTANTANEOUS_DEPLETION analyses straddle the floor."
