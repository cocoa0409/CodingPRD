              payload: {}
              as: RunnerAgent
            - call: "POST /repositories/${repo_id}/workflow-runs"
              payload: { runner_kind: "SELF_HOSTED", os_type: "LINUX", requested_minutes: 10, runner_id: "${runner_id}", expected_repository_version: "${repo_v}" }
              as: OrgAdmin
              captures: { run_id: $.data.id }
            - call: "POST /workflow-runs/${run_id}/transition"
              payload: { action: "START" }
              as: RunnerAgent
          trigger:
            - call: "DELETE /runners/${runner_id}"
              as: OrgAdmin
              captures: { err: $.data.error_id }
            - call: "POST /workflow-runs/${run_id}/transition"
              payload: { action: "COMPLETE" }
