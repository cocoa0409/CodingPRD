    output: Reservation
    side_effects: ["OCC guard on expected_member_version; increments Member.version by 1", "old reservation -> SUPERSEDED and its unit RESERVED -> IN_STOCK", "new reservation created with is_swap true and superseded_reservation_id set to the old reservation", "member.swaps_used_current_month incremented inside the swap_allowance_window month", "revenue_attributed_cents on the new reservation uses the halved swap rate"]
  - method: POST
    path: "/reservations/{reservation_id}/return-initiation"
