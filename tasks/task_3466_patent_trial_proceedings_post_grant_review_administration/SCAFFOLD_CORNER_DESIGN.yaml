      - name: request_without_auth_headers_rejected_400
        claim_type: Invalid Transition
        grounds:
          - validations[priority=1]
          - errors[ERR_MISSING_AUTH_HEADERS]
        distinguishing_aspect: "A well-formed petition filing with NO X-User-ID/X-User-Role headers fails at priority 1 with 400 — before role, existence, or any business check — and writes nothing."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Parties PBF/OBF and a patent exist (only to make the payload otherwise valid)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ptab/parties"
              payload: { name: "PBF Corp", party_type: "PETITIONER" }
              as: PlatformAdmin
              captures: { pbf_id: $.data.id }
            - call: "POST /ptab/parties"
              payload: { name: "OBF Corp", party_type: "PATENT_OWNER" }
              as: PlatformAdmin
              captures: { obf_id: $.data.id }
            - call: "POST /ptab/patents"
              payload: { patent_number: "US10001066", title: "Radius Rod", issue_date: "2020-01-01T00:00:00Z", owner_id: "${obf_id}", total_claims: 2 }
              as: PlatformAdmin
              captures: { pbf_pat: $.data.id, pbf_pat_v: $.data.version }
          trigger:
            - call: "POST /ptab/petitions"
              payload: { patent_id: "${pbf_pat}", petitioner_id: "${pbf_id}", review_type: "IPR", challenged_claims: [1], grounds: [{ claim_number: 1, basis: "ANTICIPATION_102" }], prior_art: [{ reference_type: "PATENT", citation: "US3000066" }], real_party_in_interest: "PBF Corp", fee_paid_cents: 1900000, expected_patent_version: "${pbf_pat_v}" }
              captures: { err: $.data.error_id }
          assert:
            - "the request is sent with neither X-User-ID nor X-User-Role header"
            - "the response status is 400 and error_id == ERR_MISSING_AUTH_HEADERS"
            - "no petition record is created (GET /ptab/petitions returns total_count == 0)"
