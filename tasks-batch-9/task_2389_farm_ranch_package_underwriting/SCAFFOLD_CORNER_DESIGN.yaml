          assert:
            - "the unknown policy_id returns HTTP 404 ERR_FARM_POLICY_NOT_FOUND and the unknown inspector_id returns HTTP 404 ERR_INSPECTOR_NOT_FOUND"
            - "the accepted call creates the Inspection in status SCHEDULED with hazard_score null and completed_at null"
            - "both filtered lists return exactly the one inspection ${ins_link} with total_count 1"
            - "the policy's compliance_status is still NOT_INSPECTED — scheduling alone changes nothing"

      - name: corner_action_endpoint_side_effects_covered_by_difficulty
        claim_type: action_endpoint
        grounds: ["endpoints.POST_/inspections/{id}/complete", "state_machines.Inspection[SCHEDULED->COMPLETED]"]
        excluded_because:
          difficulty_instance: inspection_completion_suspends_endorsement_and_ledger
          rationale: "The §1.8 cascade_ordering_dependency instance already walks the full side-effect list of the completion action — hazard score, recommendation creation, the compliance hop, the endorsement suspension and the compensating ledger row — in one ordered chain."

  - section: errors
    instances:

      - name: corner_rating_fiscal_guards_fire_in_priority_order
        claim_type: triggerability
        grounds: ["errors.ERR_CAT_POOL_NOT_CONFIGURED", "errors.ERR_NO_RATEABLE_EXPOSURE", "errors.ERR_POOL_FROZEN", "validations[priority=15]"]
        distinguishing_aspect: "One policy walks the three priority-15 rating guards in declared order: a zone missing its WILDFIRE pool reports ERR_CAT_POOL_NOT_CONFIGURED even though the policy has no exposures at all, then ERR_NO_RATEABLE_EXPOSURE, then ERR_POOL_FROZEN — and FarmPolicy.version is still 1 when the rating finally succeeds."
        test_recipe:
          setup:
            - "clock 2026-08-15T00:00:00Z, zone ZN-7 with only a HAIL and a WIND pool, one DRAFT policy on a ZN-7 account with no exposures of any kind"
          setup_api_calls:
            - *k_clock
            - *k_agent
            - call: "POST /cat-capacity-pools"
              payload: { zone_code: "ZN-7", peril: "HAIL", participation_pct: 0.50, total_capacity_cents: 200000000 }
              as: PlatformAdmin
              captures: { p7_hail: $.data.id }
            - call: "POST /cat-capacity-pools"
              payload: { zone_code: "ZN-7", peril: "WIND", participation_pct: 0.30, total_capacity_cents: 200000000 }
              as: PlatformAdmin
              captures: { p7_wind: $.data.id }
            - call: "POST /farm-accounts"
              payload: { legal_name: "Sandhill Ridge Ranch", state_code: "KS", county_name: "Barber", cat_zone_code: "ZN-7", acreage: 1200, operation_type: "MIXED" }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { acct7: $.data.id }
            - call: "POST /farm-policies"
              payload: { account_id: "${acct7}", term_start_date: "2026-09-01", term_end_date: "2027-08-31", deductible_cents: 500000 }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { pol7: $.data.id, pol7_v: $.data.version }
          trigger:
            - call: "POST /farm-policies/${pol7}/rate"
              payload: { expected_policy_version: "${pol7_v}" }
              as: Underwriter
              captures: { e_nopool: $.data.error_id }
            - call: "POST /cat-capacity-pools"
              payload: { zone_code: "ZN-7", peril: "WILDFIRE", participation_pct: 0.20, total_capacity_cents: 200000000 }
              as: PlatformAdmin
              captures: { p7_fire: $.data.id, p7_fire_v: $.data.version }
            - call: "POST /farm-policies/${pol7}/rate"
              payload: { expected_policy_version: "${pol7_v}" }
              as: Underwriter
              captures: { e_noexp: $.data.error_id }
            - call: "POST /farm-policies/${pol7}/scheduled-items"
              payload: { item_class: "DWELLING", description: "Ranch house", valuation_basis: "RC", stated_value_cents: 40000000, age_years: 22, condition_grade: "B" }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { it7: $.data.id }
            - call: "PATCH /cat-capacity-pools/${p7_hail}"
              payload: { expected_pool_version: "${p7_fire_v}", status: "FROZEN" }
              as: PlatformAdmin
              captures: { hail7_status: $.data.status }
            - call: "POST /farm-policies/${pol7}/rate"
              payload: { expected_policy_version: "${pol7_v}" }
              as: Underwriter
              captures: { e_frozen: $.data.error_id }
            - call: "GET /cat-capacity-pools/${p7_hail}"
              as: PlatformAdmin
              captures: { hail7_v: $.data.version }
            - call: "PATCH /cat-capacity-pools/${p7_hail}"
              payload: { expected_pool_version: "${hail7_v}", status: "OPEN" }
              as: PlatformAdmin
              captures: { hail7_reopened: $.data.status }
            - call: "POST /farm-policies/${pol7}/rate"
              payload: { expected_policy_version: "${pol7_v}" }
              as: Underwriter
              captures: { pol7_total: $.data.total_premium_cents }
          assert:
            - "attempt 1 returns HTTP 422 ERR_CAT_POOL_NOT_CONFIGURED naming the missing WILDFIRE pool, even though ERR_NO_RATEABLE_EXPOSURE is also true — the pool check is declared first at priority 15"
            - "attempt 2 returns HTTP 422 ERR_NO_RATEABLE_EXPOSURE once all three perils exist but the policy has no items, groups or exposures"
            - "the freeze PATCH is accepted at version 1 of the HAIL pool (a freshly created pool is version 1, like the WILDFIRE pool it is aligned with here) and attempt 3 returns HTTP 409 ERR_POOL_FROZEN"
            - "attempt 4, after the pool is reopened, succeeds with property 144000, cat_load 125200 and total_premium_cents 269200"
            - "FarmPolicy.${pol7}.version was still 1 immediately before attempt 4 — none of the three failures bumped it — and becomes 2 only on success"
            - "no CatReservation row exists for ${pol7} until attempt 4 succeeds, and then exactly three exist"

      - name: corner_cat_capacity_exceeded_writes_no_partial_reservation
        claim_type: triggerability
        grounds: ["errors.ERR_CAT_CAPACITY_EXCEEDED", "calculations.cat_load.constants.SCARCITY_TIERS", "entities.CatReservation"]
        distinguishing_aspect: "A second policy in a deliberately thin HAIL pool drives the prospective utilization to 1.333333 and is refused with ERR_CAT_CAPACITY_EXCEEDED (409) — and because the whole rating is atomic, the WIND and WILDFIRE pools still show only the first policy's reservations."
