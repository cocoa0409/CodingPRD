      - name: close_out_guards_reject_an_unpaid_fee_and_an_open_finding
        claim_type: violation_to_error
        grounds:
          - validations.priority_59
          - validations.priority_60
          - errors[ERR_FEE_OUTSTANDING]
          - errors[ERR_OPEN_FINDING_BLOCKS_CLOSEOUT]
        distinguishing_aspect: |
          The last two rungs of the close-out ladder are reachable only once the earlier ones pass,
          which forces two carefully balanced projects. PZ satisfies its obligation on paper —
          one two-bedroom unit for 10000 bps plus a FULL assessment covering the remaining 10000
          bps, so the posture is COMPLIANT_BY_FEE — yet the assessment is unpaid, so priority 59
          refuses the close-out. PW is fully compliant onsite and has no fee at all, but carries a
          review whose only finding is unverified occupancy: because the rent and income are both
          within limits the unit goes to FINDING_OPEN rather than OUT_OF_COMPLIANCE, the posture
          stays COMPLIANT_ONSITE, and only priority 60 can stop the close-out.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; ordinance IZ-2024-01 and AmiSchedule 2026 published."
            - "Project PZ (R-2, 20 units, dev-1) screened SUBJECT (20000 bps), ONSITE, agreement recorded, one RENTAL 2br unit FO-101, household HZ certified, then a FULL in-lieu assessment for the remaining 10000 bps: base 24000000, surcharge 840000, 150 bps tier, assessed 24467400, due 2026-09-15, left ASSESSED."
            - "Project PW (R-2, 10 units, dev-2) screened SUBJECT (1 unit, 10000 bps), ONSITE, agreement recorded, one RENTAL 2br unit FO-201, household HW certified at rent 140000 so the ceiling is 143872."
            - "Clock advanced to 2027-03-01T00:00:00Z and a 2027 review on FO-201 reports rent 143872 and income 6000000 — both inside their limits — with occupancy_verified false."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: ProgramAdministrator }
            - { call: "POST /iz-compliance/ordinances", payload: { code: "IZ-2024-01", effective_date: "2024-01-01", min_project_units_threshold: 10, set_aside_bps_by_district: { "R-2": 1000, "R-4": 1500, "C-2": 2000 }, gap_basis_cents_by_level: { "5000": 24000000, "8000": 18000000, "12000": 12000000 }, fee_gap_level_bps: 5000, surcharge_bps: 350, surcharge_cap_cents: 5000000, discount_tiers: [ { min_pre_discount_cents: 0, discount_bps: 0 }, { min_pre_discount_cents: 20000000, discount_bps: 150 }, { min_pre_discount_cents: 100000000, discount_bps: 400 } ], fee_due_days: 45, alternative_paths_allowed: ["IN_LIEU_FEE", "OFFSITE"] }, as: ProgramAdministrator, captures: { ord_id: $.data.id } }
            - { call: "POST /iz-compliance/ami-schedules", payload: { effective_year: 2026, median_income_cents_by_size: { "1": 9868000, "2": 11278000, "3": 12669800, "4": 14082000, "5": 15214000 }, utility_allowance_cents_by_bedrooms: { "0": 8500, "1": 11000, "2": 14500, "3": 18000 } }, as: ProgramAdministrator, captures: { ami26_id: $.data.id } }
            - { call: "POST /iz-compliance/projects", payload: { name: "Fee Outstanding", zoning_district: "R-2", total_units: 20, approval_date: "2026-01-15" }, as: Developer, as_user_id: "dev-1", captures: { pz_id: $.data.id } }
            - { call: "POST /iz-compliance/projects/${pz_id}/screen", payload: {}, as: HousingComplianceOfficer, as_user_id: "hco-1" }
            - { call: "POST /iz-compliance/projects/${pz_id}/elect-path", payload: { compliance_path: "ONSITE" }, as: Developer, as_user_id: "dev-1" }
            - { call: "POST /iz-compliance/regulatory-agreements", payload: { project_id: "${pz_id}", term_years: 45, resale_formula: "AMI_INDEXED", owner_appreciation_share_bps: 2500, max_refinance_ltv_bps: 9000 }, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { az_id: $.data.id } }
            - { call: "POST /iz-compliance/regulatory-agreements/${az_id}/record", payload: { doc_number: "DOC-FO-0001", recorded_at: "2026-08-01" }, as: HousingComplianceOfficer, as_user_id: "hco-1" }
            - { call: "POST /iz-compliance/affordable-units", payload: { project_id: "${pz_id}", agreement_id: "${az_id}", unit_number: "FO-101", bedrooms: 2, sqft: 900, market_comparable_sqft: 1000, tenure: "RENTAL", affordability_level_bps: 5000 }, as: Developer, as_user_id: "dev-1", captures: { uz_id: $.data.id } }
            - { call: "POST /iz-compliance/households", payload: { applicant_name: "Zoya Marek", household_size: 3, gross_annual_income_cents: 6000000 }, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { hz_id: $.data.id } }
            - { call: "POST /iz-compliance/income-certifications", payload: { household_id: "${hz_id}", unit_id: "${uz_id}", certified_income_cents: 6000000, contract_rent_cents: 140000, effective_date: "2026-08-01" }, as: HousingComplianceOfficer, as_user_id: "hco-1" }
            - { call: "GET /iz-compliance/projects/${pz_id}", payload: {}, as: ProgramAdministrator, captures: { pz_v: $.data.version } }
            - { call: "POST /iz-compliance/in-lieu-fees", payload: { project_id: "${pz_id}", basis: "FULL", expected_project_version: "${pz_v}" }, as: ProgramAdministrator, captures: { fz_id: $.data.id } }
            - { call: "POST /iz-compliance/projects", payload: { name: "Open Finding", zoning_district: "R-2", total_units: 10, approval_date: "2026-01-15" }, as: Developer, as_user_id: "dev-2", captures: { pw_id: $.data.id } }
            - { call: "POST /iz-compliance/projects/${pw_id}/screen", payload: {}, as: HousingComplianceOfficer, as_user_id: "hco-1" }
            - { call: "POST /iz-compliance/projects/${pw_id}/elect-path", payload: { compliance_path: "ONSITE" }, as: Developer, as_user_id: "dev-2" }
            - { call: "POST /iz-compliance/regulatory-agreements", payload: { project_id: "${pw_id}", term_years: 45, resale_formula: "AMI_INDEXED", owner_appreciation_share_bps: 2500, max_refinance_ltv_bps: 9000 }, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { aw_id: $.data.id } }
            - { call: "POST /iz-compliance/regulatory-agreements/${aw_id}/record", payload: { doc_number: "DOC-FO-0002", recorded_at: "2026-08-01" }, as: HousingComplianceOfficer, as_user_id: "hco-1" }
            - { call: "POST /iz-compliance/affordable-units", payload: { project_id: "${pw_id}", agreement_id: "${aw_id}", unit_number: "FO-201", bedrooms: 2, sqft: 900, market_comparable_sqft: 1000, tenure: "RENTAL", affordability_level_bps: 5000 }, as: Developer, as_user_id: "dev-2", captures: { uw_id: $.data.id } }
            - { call: "POST /iz-compliance/households", payload: { applicant_name: "Wanda Oyelaran", household_size: 3, gross_annual_income_cents: 6000000 }, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { hw_id: $.data.id } }
            - { call: "POST /iz-compliance/income-certifications", payload: { household_id: "${hw_id}", unit_id: "${uw_id}", certified_income_cents: 6000000, contract_rent_cents: 140000, effective_date: "2026-08-01" }, as: HousingComplianceOfficer, as_user_id: "hco-1" }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2027-03-01T00:00:00Z" }, as: ProgramAdministrator }
            - { call: "POST /iz-compliance/monitoring-reviews", payload: { unit_id: "${uw_id}", review_year: 2027, reported_rent_cents: 143872, reported_income_cents: 6000000, occupancy_verified: false }, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { mvw_id: $.data.id } }
          trigger:
            - { call: "POST /iz-compliance/projects/${pz_id}/close-out", payload: {}, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { err_fee: $.data.error_id } }
            - { call: "POST /iz-compliance/projects/${pw_id}/close-out", payload: {}, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { err_find: $.data.error_id } }
          assert:
            - "InLieuFee.${fz_id}.unit_equivalent_bps == 10000 with assessed_amount_cents 24467400 and state ASSESSED, and Project.${pz_id}.compliance_posture == COMPLIANT_BY_FEE"
            - "PZ's close-out returns 409 ERR_FEE_OUTSTANDING — the posture audit at priority 58 passes precisely because the assessment counts toward fee_covered_equivalents_bps the moment it is assessed, which is what makes rung 59 reachable"
            - "MonitoringReview.${mvw_id}.finding_types contains only the unverified-occupancy finding, with overcharge_monthly_cents 0 and penalty_at_base_cents 25000"
            - "AffordableUnit.${uw_id}.compliance_status == FINDING_OPEN, NOT OUT_OF_COMPLIANCE, so Project.${pw_id}.compliance_posture is still COMPLIANT_ONSITE"
            - "PW's close-out returns 409 ERR_OPEN_FINDING_BLOCKS_CLOSEOUT: rungs 25, 58 and 59 all pass (perfect mix, obligation met onsite, no fee at all), so nothing but the open review can explain the refusal"
            - "both projects remain in MONITORING and both retain their units, certifications and reviews unchanged"

      - name: resale_guards_over_the_price_ceiling_the_fund_and_the_rofr_clock
        claim_type: violation_to_error
        grounds:
          - validations.priority_37
          - validations.priority_40
          - validations.priority_44
          - validations.priority_49
          - errors[ERR_RESALE_PRICE_EXCEEDS_MAX]
          - errors[ERR_BUYER_CERTIFICATION_MISMATCH]
          - errors[ERR_INSUFFICIENT_FUND_BALANCE]
          - errors[ERR_ROFR_WINDOW_EXPIRED]
        distinguishing_aspect: |
          A resale is accepted at submission and audited at approval, so an over-ceiling price is
          recorded first and refused later: the transaction sits in SUBMITTED carrying both
          proposed_price_cents 33000000 and max_resale_price_cents 32500000, and approve-price is
          what returns ERR_RESALE_PRICE_EXCEEDS_MAX. Exercising the city's right of first refusal
          is a fund commitment, so it fails with ERR_INSUFFICIENT_FUND_BALANCE against an empty
          trust fund while a waiver on the very same transaction succeeds. The buyer-certification
          audit checks three things at once and is probed with the seller's own certification for
          the right unit — the household is what mismatches. The ROFR clock is instant-precise on
          the decision path even though the auto-waiver sweep is calendar-date granular: a
          decision at 2026-08-31T12:00:00Z is past a 2026-08-31T00:00:00Z deadline and is refused,
          yet the sweep has not yet auto-waived the transaction.
