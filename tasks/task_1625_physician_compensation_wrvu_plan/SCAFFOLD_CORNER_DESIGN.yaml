            - { call: "POST /comp/comp-plans/${p2}/submit-review", payload: {}, as: CompAnalyst, as_user_id: an_1 }
            - { call: "POST /comp/comp-plans/${p2}/review-decision", payload: { decision: APPROVED }, as: ComplianceOfficer, as_user_id: co_1 }
            - { call: "GET /comp/comp-plans/${p1}", payload: {}, as: CompAnalyst, as_user_id: an_1, captures: { p1_v: $.data.version } }
            - { call: "POST /comp/plan-change-requests", payload: { plan_id: "${p1}", successor_plan_id: "${p2}", effective_date: "2026-03-01", summary: "repin test", expected_comp_plan_version: "${p1_v}" }, as: CompAnalyst, as_user_id: an_1, captures: { pcr: $.data.id } }
            - { call: "POST /comp/plan-change-requests/${pcr}/model", payload: {}, as: CompAnalyst, as_user_id: an_1 }
            - { call: "POST /comp/plan-change-requests/${pcr}/communicate", payload: {}, as: CompAnalyst, as_user_id: an_1 }
