# =============================================================================
# §1.8 Scaffold Difficulty Design — task_1488_public_refrigerated_warehousing
# 9 rules x 3 instances = 27 instances. Every recipe replays from empty-DB
# using only endpoints declared in SCAFFOLD.yaml §1.5.
# Shared fixture constants (pinned):
#   Card "A": DAILY_PRORATED, frozen 3000, chilled 2000, handling_in 1000,
#             handling_out 500, blast 2000+300/pallet, LIMITED_LIABILITY 2000/pallet.
#   Logical clock default 2026-08-01T00:00:00Z.
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: storage_daily_prorated_vs_full_month_diverge
        grounds:
          - calculations.storage_charge
          - entities.RateCard.fields.storage_method
          - entities.Invoice.fields.storage_cents
        distinguishing_aspect: |
          Two storage_method variants on the SAME pallet-presence data produce
          different storage_cents: DAILY_PRORATED charges 27/30 of the month
          (2700 cents) while FULL_MONTH charges the whole month (3000 cents).
          Entity domain: Invoice/billing (contrasts with claim_settlement).
        test_recipe:
          setup:
            - "Customer A (DAILY_PRORATED card) and Customer B (FULL_MONTH card) each have exactly 1 pallet in the same FROZEN zone, both received 2026-08-05"
            - "Clock advanced to 2026-09-01T00:00:00Z and billing run executed; August invoices FINALIZED"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: BillingAdmin }
            - { call: "POST /api/customers", payload: { name: "A Daily", credit_limit_cents: 10000000 }, as: BillingAdmin, captures: { custA: $.data.id, custA_v: $.data.version } }
            - { call: "POST /api/rate-cards", payload: { customer_id: "${custA}", storage_method: DAILY_PRORATED, frozen_storage_cents_per_pallet_month: 3000, chilled_storage_cents_per_pallet_month: 2000, handling_in_cents_per_pallet: 1000, handling_out_cents_per_pallet: 500, blast_base_cents: 2000, blast_per_pallet_cents: 300, liability_model: LIMITED_LIABILITY, liability_per_pallet_cents: 2000, dwell_exempt: false, expected_customer_version: "${custA_v}" }, as: BillingAdmin }
            - { call: "POST /api/customers", payload: { name: "B FullMonth", credit_limit_cents: 10000000 }, as: BillingAdmin, captures: { custB: $.data.id, custB_v: $.data.version } }
            - { call: "POST /api/rate-cards", payload: { customer_id: "${custB}", storage_method: FULL_MONTH, frozen_storage_cents_per_pallet_month: 3000, chilled_storage_cents_per_pallet_month: 2000, handling_in_cents_per_pallet: 1000, handling_out_cents_per_pallet: 500, blast_base_cents: 2000, blast_per_pallet_cents: 300, liability_model: LIMITED_LIABILITY, liability_per_pallet_cents: 2000, dwell_exempt: false, expected_customer_version: "${custB_v}" }, as: BillingAdmin }
            - { call: "POST /api/zones", payload: { zone_code: "FZ-1", temp_class: FROZEN, capacity_pallets: 10, dock_doors: 2 }, as: WarehouseOperator, captures: { zoneF: $.data.id } }
            - { call: "POST /api/inbound-receipts", payload: { customer_id: "${custA}", zone_id: "${zoneF}", product_code: "PEAS", lot_code: "L1", production_date: "2026-01-15", temp_class: FROZEN, expected_pallets: 1, window_start: "2026-08-05T08:00:00Z", window_end: "2026-08-05T10:00:00Z" }, as: CustomerAdmin, as_user_id: "${custA}", captures: { rA: $.data.id } }
            - { call: "POST /api/inbound-receipts", payload: { customer_id: "${custB}", zone_id: "${zoneF}", product_code: "PEAS", lot_code: "L1", production_date: "2026-01-15", temp_class: FROZEN, expected_pallets: 1, window_start: "2026-08-05T08:00:00Z", window_end: "2026-08-05T10:00:00Z" }, as: CustomerAdmin, as_user_id: "${custB}", captures: { rB: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T09:00:00Z" }, as: WarehouseOperator }
            - { call: "POST /api/inbound-receipts/${rA}/arrive", payload: {}, as: WarehouseOperator }
            - { call: "POST /api/inbound-receipts/${rA}/complete", payload: { actual_pallets: 1 }, as: WarehouseOperator }
            - { call: "POST /api/inbound-receipts/${rB}/arrive", payload: {}, as: WarehouseOperator }
            - { call: "POST /api/inbound-receipts/${rB}/complete", payload: { actual_pallets: 1 }, as: WarehouseOperator }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: BillingAdmin }
            - { call: "POST /api/billing/run", payload: {}, as: BillingAdmin }
            - { call: "GET /api/invoices?customer_id=${custA}&status=FINALIZED", as: BillingAdmin, captures: { invA: "$.data[0].id" } }
            - { call: "GET /api/invoices?customer_id=${custB}&status=FINALIZED", as: BillingAdmin, captures: { invB: "$.data[0].id" } }
          trigger:
            - { call: "GET /api/invoices/${invA}", as: BillingAdmin, captures: { storA: $.data.storage_cents } }
            - { call: "GET /api/invoices/${invB}", as: BillingAdmin, captures: { storB: $.data.storage_cents } }
          assert:
            - "Invoice.${invA}.storage_cents == 2700  # round_half_up(27 days * 3000 / 30)"
            - "Invoice.${invB}.storage_cents == 3000  # FULL_MONTH: present >= 1 day"
            - "Invoice.${invA}.storage_cents != Invoice.${invB}.storage_cents"
            - "Invoice.${invA}.total_cents == 3700  # 2700 storage + 1000 handling_in"
            - "Invoice.${invB}.total_cents == 4000  # 3000 storage + 1000 handling_in"

      - name: claim_settlement_declared_value_vs_limited_liability
        grounds:
          - calculations.claim_settlement
          - entities.RateCard.fields.liability_model
          - entities.Claim.fields.settlement_cents
        distinguishing_aspect: |
          Two liability_model variants on identical loss data (4 pallets,
          declared 50000) produce different settlements: LIMITED_LIABILITY caps
          at 4*2000=8000 while DECLARED_VALUE pays 50000 in full. Entity domain:
          Claim (bailment liability) — different domain from storage billing.
        test_recipe:
          setup:
            - "Customer L (LIMITED_LIABILITY card, 2000/pallet) and Customer D (DECLARED_VALUE card) each have 4 pallets of FROZEN product in the same zone, received 2026-08-02"
            - "A temperature excursion on the zone (window 2026-08-03..2026-08-04) is CONFIRMED_BREACH; all 8 pallets quarantined"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: BillingAdmin }
            - { call: "POST /api/customers", payload: { name: "L Ltd", credit_limit_cents: 10000000 }, as: BillingAdmin, captures: { custL: $.data.id, custL_v: $.data.version } }
            - { call: "POST /api/rate-cards", payload: { customer_id: "${custL}", storage_method: DAILY_PRORATED, frozen_storage_cents_per_pallet_month: 3000, chilled_storage_cents_per_pallet_month: 2000, handling_in_cents_per_pallet: 1000, handling_out_cents_per_pallet: 500, blast_base_cents: 2000, blast_per_pallet_cents: 300, liability_model: LIMITED_LIABILITY, liability_per_pallet_cents: 2000, dwell_exempt: false, expected_customer_version: "${custL_v}" }, as: BillingAdmin }
            - { call: "POST /api/customers", payload: { name: "D Decl", credit_limit_cents: 10000000 }, as: BillingAdmin, captures: { custD: $.data.id, custD_v: $.data.version } }
            - { call: "POST /api/rate-cards", payload: { customer_id: "${custD}", storage_method: DAILY_PRORATED, frozen_storage_cents_per_pallet_month: 3000, chilled_storage_cents_per_pallet_month: 2000, handling_in_cents_per_pallet: 1000, handling_out_cents_per_pallet: 500, blast_base_cents: 2000, blast_per_pallet_cents: 300, liability_model: DECLARED_VALUE, liability_per_pallet_cents: 2000, dwell_exempt: false, expected_customer_version: "${custD_v}" }, as: BillingAdmin }
            - { call: "POST /api/zones", payload: { zone_code: "FZ-2", temp_class: FROZEN, capacity_pallets: 20, dock_doors: 2 }, as: WarehouseOperator, captures: { zone2: $.data.id } }
            - { call: "POST /api/inbound-receipts", payload: { customer_id: "${custL}", zone_id: "${zone2}", product_code: "SHRIMP", lot_code: "SL1", production_date: "2026-01-10", temp_class: FROZEN, expected_pallets: 4, window_start: "2026-08-02T08:00:00Z", window_end: "2026-08-02T10:00:00Z" }, as: CustomerAdmin, as_user_id: "${custL}", captures: { rL: $.data.id } }
            - { call: "POST /api/inbound-receipts", payload: { customer_id: "${custD}", zone_id: "${zone2}", product_code: "SHRIMP", lot_code: "SL1", production_date: "2026-01-10", temp_class: FROZEN, expected_pallets: 4, window_start: "2026-08-02T11:00:00Z", window_end: "2026-08-02T13:00:00Z" }, as: CustomerAdmin, as_user_id: "${custD}", captures: { rD: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T09:00:00Z" }, as: WarehouseOperator }
            - { call: "POST /api/inbound-receipts/${rL}/arrive", payload: {}, as: WarehouseOperator }
            - { call: "POST /api/inbound-receipts/${rL}/complete", payload: { actual_pallets: 4 }, as: WarehouseOperator }
            - { call: "POST /api/inbound-receipts/${rD}/arrive", payload: {}, as: WarehouseOperator }
            - { call: "POST /api/inbound-receipts/${rD}/complete", payload: { actual_pallets: 4 }, as: WarehouseOperator }
            - { call: "POST /api/temperature-excursions", payload: { zone_id: "${zone2}", observed_temp_c: -5.5, window_start: "2026-08-03T00:00:00Z", window_end: "2026-08-04T00:00:00Z" }, as: WarehouseOperator, as_user_id: "op-1", captures: { ex2: $.data.id } }
            - { call: "POST /api/temperature-excursions/${ex2}/confirm", payload: {}, as: QualityManager, as_user_id: "qm-1" }
          trigger:
            - { call: "POST /api/claims", payload: { customer_id: "${custL}", excursion_id: "${ex2}", affected_pallet_count: 4, declared_value_cents: 50000 }, as: CustomerAdmin, as_user_id: "${custL}", captures: { clL: $.data.id } }
            - { call: "POST /api/claims", payload: { customer_id: "${custD}", excursion_id: "${ex2}", affected_pallet_count: 4, declared_value_cents: 50000 }, as: CustomerAdmin, as_user_id: "${custD}", captures: { clD: $.data.id } }
            - { call: "POST /api/claims/${clL}/review", payload: {}, as: ClaimsAdjuster }
            - { call: "POST /api/claims/${clL}/decide", payload: { decision: APPROVED }, as: ClaimsAdjuster }
            - { call: "POST /api/claims/${clD}/review", payload: {}, as: ClaimsAdjuster }
            - { call: "POST /api/claims/${clD}/decide", payload: { decision: APPROVED }, as: ClaimsAdjuster }
            - { call: "GET /api/claims/${clL}", as: BillingAdmin, captures: { setL: $.data.settlement_cents } }
            - { call: "GET /api/claims/${clD}", as: BillingAdmin, captures: { setD: $.data.settlement_cents } }
          assert:
            - "Claim.${clL}.settlement_cents == 8000   # min(50000, 4*2000)"
            - "Claim.${clD}.settlement_cents == 50000  # DECLARED_VALUE pays declared in full"
            - "Claim.${clL}.settlement_cents != Claim.${clD}.settlement_cents"
            - "TemperatureExcursion.${ex2}.quarantined_pallet_count == 8"

      - name: handling_out_estimate_vs_final_diverge_on_tier_crossing
        grounds:
          - calculations.handling_out_estimate
          - entities.OutboundOrder.fields.estimated_handling_out_cents
          - entities.OutboundOrder.fields.final_handling_out_cents
        distinguishing_aspect: |
          Provisional (submit-time) vs final (ship-time) variants of the same
          handling-out fee diverge: order1 estimated at 45000 (volume tier 10%
          at submit) but finalizes at 40000 because a 400-pallet shipment by the
          same customer in between pushes ship-month volume to 500 (tier 20%).
          Entity domain: OutboundOrder — third distinct domain.
        test_recipe:
          setup:
            - "Customer with card A (handling_out 500/pallet), FROZEN zone with 500 pallets received 2026-08-02"
            - "order1 (100 pallets) submitted first; order2 (400 pallets) submitted/allocated/shipped before order1 ships"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: BillingAdmin }
            - { call: "POST /api/customers", payload: { name: "Vol Co", credit_limit_cents: 100000000 }, as: BillingAdmin, captures: { custV: $.data.id, custV_v: $.data.version } }
            - { call: "POST /api/rate-cards", payload: { customer_id: "${custV}", storage_method: DAILY_PRORATED, frozen_storage_cents_per_pallet_month: 3000, chilled_storage_cents_per_pallet_month: 2000, handling_in_cents_per_pallet: 1000, handling_out_cents_per_pallet: 500, blast_base_cents: 2000, blast_per_pallet_cents: 300, liability_model: LIMITED_LIABILITY, liability_per_pallet_cents: 2000, dwell_exempt: false, expected_customer_version: "${custV_v}" }, as: BillingAdmin }
            - { call: "POST /api/zones", payload: { zone_code: "FZ-3", temp_class: FROZEN, capacity_pallets: 600, dock_doors: 2 }, as: WarehouseOperator, captures: { zone3: $.data.id } }
            - { call: "POST /api/inbound-receipts", payload: { customer_id: "${custV}", zone_id: "${zone3}", product_code: "FRIES", lot_code: "FL1", production_date: "2026-01-05", temp_class: FROZEN, expected_pallets: 500, window_start: "2026-08-02T08:00:00Z", window_end: "2026-08-02T10:00:00Z" }, as: CustomerAdmin, as_user_id: "${custV}", captures: { rV: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T09:00:00Z" }, as: WarehouseOperator }
            - { call: "POST /api/inbound-receipts/${rV}/arrive", payload: {}, as: WarehouseOperator }
            - { call: "POST /api/inbound-receipts/${rV}/complete", payload: { actual_pallets: 500 }, as: WarehouseOperator }
            - { call: "POST /api/outbound-orders", payload: { customer_id: "${custV}", product_code: "FRIES", requested_pallets: 100 }, as: CustomerAdmin, as_user_id: "${custV}", captures: { o1: $.data.id } }
            - { call: "POST /api/outbound-orders/${o1}/submit", payload: {}, as: CustomerAdmin, as_user_id: "${custV}" }
            - { call: "POST /api/outbound-orders", payload: { customer_id: "${custV}", product_code: "FRIES", requested_pallets: 400 }, as: CustomerAdmin, as_user_id: "${custV}", captures: { o2: $.data.id } }
            - { call: "POST /api/outbound-orders/${o2}/submit", payload: {}, as: CustomerAdmin, as_user_id: "${custV}" }
            - { call: "POST /api/outbound-orders/${o2}/allocate", payload: {}, as: WarehouseOperator }
            - { call: "POST /api/outbound-orders/${o2}/ship", payload: {}, as: WarehouseOperator }
          trigger:
            - { call: "POST /api/outbound-orders/${o1}/allocate", payload: {}, as: WarehouseOperator }
            - { call: "POST /api/outbound-orders/${o1}/ship", payload: {}, as: WarehouseOperator }
            - { call: "GET /api/outbound-orders/${o1}", as: BillingAdmin, captures: { est1: $.data.estimated_handling_out_cents, fin1: $.data.final_handling_out_cents } }
          assert:
            - "OutboundOrder.${o1}.estimated_handling_out_cents == 45000  # submit: volume 0+100 -> 10% tier"
            - "OutboundOrder.${o1}.final_handling_out_cents == 40000      # ship: volume 400+100=500 -> 20% tier"
            - "OutboundOrder.${o1}.estimated_handling_out_cents != OutboundOrder.${o1}.final_handling_out_cents"
            - "OutboundOrder.${o2}.final_handling_out_cents == 180000     # volume 400 -> 10% tier"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: dwell_surcharge_tiered_multi_input_with_blast_reset
        grounds:
          - calculations.dwell_surcharge
          - entities.Pallet.fields.last_blast_frozen_at
          - entities.Invoice.fields.dwell_surcharge_cents
        distinguishing_aspect: |
          Mode (a): >= 3 inputs with non-linear interaction — dwell tier
          (0/25/50/100% at 60/90/120 days), zone-class multiplier (CHILLED 1.5),
          and the blast-freeze dwell-clock reset. The un-blasted pallet (83
          days, 25% tier) contributes 750; the blasted pallet (12 days post-
          reset) contributes 0.
        test_recipe:
          setup:
            - "Customer with CHILLED zone; 2 pallets of lot BL received 2026-06-10; card chilled rate 2000, dwell_exempt false"
            - "A blast booking (pallet_count 1) completed 2026-08-20 resets one pallet's dwell clock"
            - "Billing runs executed at 2026-07-01, 2026-08-01, 2026-09-01"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: BillingAdmin }
            - { call: "POST /api/customers", payload: { name: "Dwell Co", credit_limit_cents: 100000000 }, as: BillingAdmin, captures: { custW: $.data.id, custW_v: $.data.version } }
            - { call: "POST /api/rate-cards", payload: { customer_id: "${custW}", storage_method: DAILY_PRORATED, frozen_storage_cents_per_pallet_month: 3000, chilled_storage_cents_per_pallet_month: 2000, handling_in_cents_per_pallet: 1000, handling_out_cents_per_pallet: 500, blast_base_cents: 2000, blast_per_pallet_cents: 300, liability_model: LIMITED_LIABILITY, liability_per_pallet_cents: 2000, dwell_exempt: false, expected_customer_version: "${custW_v}" }, as: BillingAdmin }
            - { call: "POST /api/zones", payload: { zone_code: "CH-1", temp_class: CHILLED, capacity_pallets: 10, dock_doors: 2 }, as: WarehouseOperator, captures: { zoneC: $.data.id } }
            - { call: "POST /api/inbound-receipts", payload: { customer_id: "${custW}", zone_id: "${zoneC}", product_code: "MILK", lot_code: "BL", production_date: "2026-05-01", temp_class: CHILLED, expected_pallets: 2, window_start: "2026-06-10T08:00:00Z", window_end: "2026-06-10T10:00:00Z" }, as: CustomerAdmin, as_user_id: "${custW}", captures: { rW: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-10T09:00:00Z" }, as: WarehouseOperator }
            - { call: "POST /api/inbound-receipts/${rW}/arrive", payload: {}, as: WarehouseOperator }
            - { call: "POST /api/inbound-receipts/${rW}/complete", payload: { actual_pallets: 2 }, as: WarehouseOperator, captures: { lotW: $.data.lot_id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: BillingAdmin }
            - { call: "POST /api/billing/run", payload: {}, as: BillingAdmin }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: BillingAdmin }
            - { call: "POST /api/billing/run", payload: {}, as: BillingAdmin }
            - { call: "POST /api/blast-freeze-cells", payload: { cell_code: "BC-1", capacity_pallets: 5, turnaround_minutes: 30 }, as: WarehouseOperator, captures: { cell1: $.data.id } }
            - { call: "POST /api/blast-freeze-bookings", payload: { cell_id: "${cell1}", lot_id: "${lotW}", pallet_count: 1, window_start: "2026-08-20T10:00:00Z", window_end: "2026-08-20T12:00:00Z" }, as: WarehouseOperator, captures: { bk1: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T10:30:00Z" }, as: WarehouseOperator }
            - { call: "POST /api/blast-freeze-bookings/${bk1}/start", payload: {}, as: WarehouseOperator }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T12:30:00Z" }, as: WarehouseOperator }
            - { call: "POST /api/blast-freeze-bookings/${bk1}/complete", payload: {}, as: WarehouseOperator }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: BillingAdmin }
            - { call: "POST /api/billing/run", payload: {}, as: BillingAdmin }
            - { call: "GET /api/invoices?customer_id=${custW}&status=FINALIZED", as: BillingAdmin, captures: { invAug: "$.data[2].id" } }
          trigger:
            - { call: "GET /api/invoices/${invAug}", as: BillingAdmin }
          assert:
            - "Invoice.${invAug}.period_start == 2026-08-01T00:00:00Z  # FINALIZED list sorted created_at ASC: [June, July, August]; index 2 is August"
            - "Invoice.${invAug}.dwell_surcharge_cents == 750   # round_half_up(2000 * 0.25 * 1.5) for the 83-day pallet; blasted pallet dwell=12 -> 0"
            - "Invoice.${invAug}.blast_freeze_cents == 2300     # 2000 base + 1*300"
            - "Invoice.${invAug}.storage_cents == 4134          # 2 pallets * round_half_up(31*2000/30)=2067"
            - "Invoice.${invAug}.total_cents == 7184            # 4134 + 750 + 2300"

      - name: storage_per_pallet_round_then_sum_order
        grounds:
          - calculations.storage_charge
          - entities.Invoice.fields.storage_cents
        distinguishing_aspect: |
          Mode (b): nested rounding order — the scaffold pins round-per-pallet-
          THEN-sum. With a 1000-cent monthly rate, 3 pallets present exactly 1
          day each yield 3 x round_half_up(33.333) = 99 cents; the rejected
          sum-then-round reading yields round_half_up(100.0) = 100.
        test_recipe:
          setup:
            - "Customer with DAILY_PRORATED card, frozen rate 1000/month; 3 pallets received 2026-08-30 and shipped 2026-08-31 (exactly 1 chargeable day each)"
            - "Billing run at 2026-09-01 finalizes the August invoice"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: BillingAdmin }
            - { call: "POST /api/customers", payload: { name: "Round Co", credit_limit_cents: 100000000 }, as: BillingAdmin, captures: { custR: $.data.id, custR_v: $.data.version } }
            - { call: "POST /api/rate-cards", payload: { customer_id: "${custR}", storage_method: DAILY_PRORATED, frozen_storage_cents_per_pallet_month: 1000, chilled_storage_cents_per_pallet_month: 2000, handling_in_cents_per_pallet: 1000, handling_out_cents_per_pallet: 500, blast_base_cents: 2000, blast_per_pallet_cents: 300, liability_model: LIMITED_LIABILITY, liability_per_pallet_cents: 2000, dwell_exempt: false, expected_customer_version: "${custR_v}" }, as: BillingAdmin }
            - { call: "POST /api/zones", payload: { zone_code: "FZ-4", temp_class: FROZEN, capacity_pallets: 10, dock_doors: 2 }, as: WarehouseOperator, captures: { zoneR: $.data.id } }
            - { call: "POST /api/inbound-receipts", payload: { customer_id: "${custR}", zone_id: "${zoneR}", product_code: "PEAS", lot_code: "RL1", production_date: "2026-08-20", temp_class: FROZEN, expected_pallets: 3, window_start: "2026-08-30T08:00:00Z", window_end: "2026-08-30T10:00:00Z" }, as: CustomerAdmin, as_user_id: "${custR}", captures: { rR: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-30T09:00:00Z" }, as: WarehouseOperator }
            - { call: "POST /api/inbound-receipts/${rR}/arrive", payload: {}, as: WarehouseOperator }
            - { call: "POST /api/inbound-receipts/${rR}/complete", payload: { actual_pallets: 3 }, as: WarehouseOperator }
            - { call: "POST /api/outbound-orders", payload: { customer_id: "${custR}", product_code: "PEAS", requested_pallets: 3 }, as: CustomerAdmin, as_user_id: "${custR}", captures: { oR: $.data.id } }
            - { call: "POST /api/outbound-orders/${oR}/submit", payload: {}, as: CustomerAdmin, as_user_id: "${custR}" }
            - { call: "POST /api/outbound-orders/${oR}/allocate", payload: {}, as: WarehouseOperator }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-31T09:00:00Z" }, as: WarehouseOperator }
            - { call: "POST /api/outbound-orders/${oR}/ship", payload: {}, as: WarehouseOperator }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: BillingAdmin }
            - { call: "POST /api/billing/run", payload: {}, as: BillingAdmin }
            - { call: "GET /api/invoices?customer_id=${custR}&status=FINALIZED", as: BillingAdmin, captures: { invR: "$.data[0].id" } }
          trigger:
            - { call: "GET /api/invoices/${invR}", as: BillingAdmin }
          assert:
            - "Invoice.${invR}.storage_cents == 99    # 3 * round_half_up(1 * 1000 / 30) = 3 * 33"
            - "Invoice.${invR}.storage_cents != 100   # the rejected sum-then-round reading"
            - "Invoice.${invR}.handling_in_cents == 3000"
            - "Invoice.${invR}.handling_out_cents == 1500  # volume 3 -> no discount: 3*500"
            - "Invoice.${invR}.total_cents == 4599"

      - name: credit_check_forward_tier_evaluation_order
        grounds:
          - calculations.handling_out_estimate
          - calculations.outstanding_balance
          - validations[priority=11]
        distinguishing_aspect: |
          Mode (c): circular-looking dependency with pinned evaluation order —
          the order being priced counts toward its own volume tier BEFORE the
          fee feeds the credit check. Order1 (100 pallets) lands exactly at the
          credit limit (55000+45000 == 100000, equality passes); order2 (101)
          exceeds it (100450 > 100000) and is rejected.
        test_recipe:
          setup:
            - "Customer with card A, credit_limit_cents 100000; 55 pallets received (handling_in accrues 55000 onto the OPEN invoice, so outstanding_balance_cents == 55000)"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: BillingAdmin }
            - { call: "POST /api/customers", payload: { name: "Credit Co", credit_limit_cents: 100000 }, as: BillingAdmin, captures: { custK: $.data.id, custK_v: $.data.version } }
            - { call: "POST /api/rate-cards", payload: { customer_id: "${custK}", storage_method: DAILY_PRORATED, frozen_storage_cents_per_pallet_month: 3000, chilled_storage_cents_per_pallet_month: 2000, handling_in_cents_per_pallet: 1000, handling_out_cents_per_pallet: 500, blast_base_cents: 2000, blast_per_pallet_cents: 300, liability_model: LIMITED_LIABILITY, liability_per_pallet_cents: 2000, dwell_exempt: false, expected_customer_version: "${custK_v}" }, as: BillingAdmin }
            - { call: "POST /api/zones", payload: { zone_code: "FZ-5", temp_class: FROZEN, capacity_pallets: 100, dock_doors: 2 }, as: WarehouseOperator, captures: { zoneK: $.data.id } }
            - { call: "POST /api/inbound-receipts", payload: { customer_id: "${custK}", zone_id: "${zoneK}", product_code: "PEAS", lot_code: "KL1", production_date: "2026-01-15", temp_class: FROZEN, expected_pallets: 55, window_start: "2026-08-02T08:00:00Z", window_end: "2026-08-02T10:00:00Z" }, as: CustomerAdmin, as_user_id: "${custK}", captures: { rK: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T09:00:00Z" }, as: WarehouseOperator }
            - { call: "POST /api/inbound-receipts/${rK}/arrive", payload: {}, as: WarehouseOperator }
            - { call: "POST /api/inbound-receipts/${rK}/complete", payload: { actual_pallets: 55 }, as: WarehouseOperator }
            - { call: "POST /api/outbound-orders", payload: { customer_id: "${custK}", product_code: "PEAS", requested_pallets: 100 }, as: CustomerAdmin, as_user_id: "${custK}", captures: { oK1: $.data.id } }
            - { call: "POST /api/outbound-orders", payload: { customer_id: "${custK}", product_code: "PEAS", requested_pallets: 101 }, as: CustomerAdmin, as_user_id: "${custK}", captures: { oK2: $.data.id } }
          trigger:
            - { call: "POST /api/outbound-orders/${oK1}/submit", payload: {}, as: CustomerAdmin, as_user_id: "${custK}" }
            - { call: "POST /api/outbound-orders/${oK2}/submit", payload: {}, as: CustomerAdmin, as_user_id: "${custK}", captures: { errK2: $.data.error_id } }
          assert:
            - "OutboundOrder.${oK1}.status == SUBMITTED   # 55000 + 45000 == 100000 == credit_limit: equality passes"
            - "OutboundOrder.${oK1}.estimated_handling_out_cents == 45000  # tier: volume 0+100 >= 100 -> 10%"
            - "OutboundOrder.${oK2}.status == DRAFT"
            - "error for ${oK2} == ERR_CREDIT_LIMIT_EXCEEDED  # 55000 + round_half_up(101*500*0.9)=45450 -> 100450 > 100000"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: pallet_parallel_dimensions_quarantine_blocks_allocate_not_blast
        grounds:
          - state_machines.Pallet
          - entities.Pallet.fields.status
          - entities.Pallet.fields.quality
        distinguishing_aspect: |
          Pallet carries two independent state dimensions (status x quality):
          quarantine moves quality OK->QUARANTINED while status stays STORED;
          that blocks FIFO allocation (quality==OK guard) but not the later
          blast-freeze status cycle STORED->IN_BLAST_FREEZE->STORED once quality
          is released. Entity: Pallet (contrasts with OutboundOrder/Claim).
        test_recipe:
          setup:
            - "Customer with card A; FROZEN zone with 2 pallets of lot PL received 2026-08-02; blast cell BC-P exists"
            - "Excursion on the zone (window 2026-08-03..2026-08-04) CONFIRMED_BREACH -> both pallets quality QUARANTINED, status still STORED"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: BillingAdmin }
            - { call: "POST /api/customers", payload: { name: "Par Co", credit_limit_cents: 100000000 }, as: BillingAdmin, captures: { custP: $.data.id, custP_v: $.data.version } }
            - { call: "POST /api/rate-cards", payload: { customer_id: "${custP}", storage_method: DAILY_PRORATED, frozen_storage_cents_per_pallet_month: 3000, chilled_storage_cents_per_pallet_month: 2000, handling_in_cents_per_pallet: 1000, handling_out_cents_per_pallet: 500, blast_base_cents: 2000, blast_per_pallet_cents: 300, liability_model: LIMITED_LIABILITY, liability_per_pallet_cents: 2000, dwell_exempt: false, expected_customer_version: "${custP_v}" }, as: BillingAdmin }
            - { call: "POST /api/zones", payload: { zone_code: "FZ-6", temp_class: FROZEN, capacity_pallets: 10, dock_doors: 2 }, as: WarehouseOperator, captures: { zoneP: $.data.id } }
            - { call: "POST /api/inbound-receipts", payload: { customer_id: "${custP}", zone_id: "${zoneP}", product_code: "PEAS", lot_code: "PL", production_date: "2026-01-15", temp_class: FROZEN, expected_pallets: 2, window_start: "2026-08-02T08:00:00Z", window_end: "2026-08-02T10:00:00Z" }, as: CustomerAdmin, as_user_id: "${custP}", captures: { rP: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T09:00:00Z" }, as: WarehouseOperator }
            - { call: "POST /api/inbound-receipts/${rP}/arrive", payload: {}, as: WarehouseOperator }
            - { call: "POST /api/inbound-receipts/${rP}/complete", payload: { actual_pallets: 2 }, as: WarehouseOperator, captures: { lotP: $.data.lot_id } }
            - { call: "POST /api/temperature-excursions", payload: { zone_id: "${zoneP}", observed_temp_c: -2.0, window_start: "2026-08-03T00:00:00Z", window_end: "2026-08-04T00:00:00Z" }, as: WarehouseOperator, as_user_id: "op-1", captures: { exP: $.data.id } }
            - { call: "POST /api/temperature-excursions/${exP}/confirm", payload: {}, as: QualityManager, as_user_id: "qm-1" }
            - { call: "POST /api/blast-freeze-cells", payload: { cell_code: "BC-P", capacity_pallets: 5, turnaround_minutes: 30 }, as: WarehouseOperator, captures: { cellP: $.data.id } }
            - { call: "POST /api/outbound-orders", payload: { customer_id: "${custP}", product_code: "PEAS", requested_pallets: 1 }, as: CustomerAdmin, as_user_id: "${custP}", captures: { oP: $.data.id } }
            - { call: "POST /api/outbound-orders/${oP}/submit", payload: {}, as: CustomerAdmin, as_user_id: "${custP}" }
          trigger:
            - { call: "POST /api/outbound-orders/${oP}/allocate", payload: {}, as: WarehouseOperator }
            - { call: "GET /api/pallets?lot_id=${lotP}", as: WarehouseOperator, captures: { palP1: "$.data[0].id", palP2: "$.data[1].id" } }
            - { call: "POST /api/pallets/${palP1}/release-quarantine", payload: {}, as: QualityManager }
            - { call: "POST /api/pallets/${palP2}/release-quarantine", payload: {}, as: QualityManager }
            - { call: "POST /api/blast-freeze-bookings", payload: { cell_id: "${cellP}", lot_id: "${lotP}", pallet_count: 1, window_start: "2026-08-05T10:00:00Z", window_end: "2026-08-05T12:00:00Z" }, as: WarehouseOperator, captures: { bkP: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T10:30:00Z" }, as: WarehouseOperator }
            - { call: "POST /api/blast-freeze-bookings/${bkP}/start", payload: {}, as: WarehouseOperator }
            - { call: "POST /api/blast-freeze-bookings/${bkP}/complete", payload: {}, as: WarehouseOperator }
            - { call: "GET /api/pallets/${palP1}", as: WarehouseOperator, captures: { stP1: $.data.status, qP1: $.data.quality, bfP1: $.data.last_blast_frozen_at } }
          assert:
            - "After allocate on quarantined stock: OutboundOrder.${oP}.status == SHORTED and allocated_pallets == 0 (quality==OK guard excludes both pallets)"
            - "During quarantine: Pallet.${palP1}.status == STORED and quality == QUARANTINED (dimensions independent)"
            - "After release + blast cycle: Pallet.${palP1}.quality == OK"
            - "Pallet.${palP1}.status == STORED (IN_BLAST_FREEZE -> STORED cycle completed)"
            - "Pallet.${palP1}.last_blast_frozen_at == 2026-08-05T10:30:00Z"

      - name: order_submit_shorted_draft_allocate_cycle
        grounds:
          - state_machines.OutboundOrder
          - concurrency_rules[order-amend-stale-version]
        distinguishing_aspect: |
          OutboundOrder is cyclic: SUBMITTED -> SHORTED -(amend)-> DRAFT ->
          SUBMITTED -> ALLOCATED, plus the system demotion ALLOCATED ->
          SUBMITTED. Entity: OutboundOrder (contrasts with Pallet/Claim).
        test_recipe:
          setup:
            - "Customer with card A; FROZEN zone with exactly 2 pallets of lot CY received 2026-08-02"
            - "Order for 3 pallets: submit -> allocate -> SHORTED with 2 allocated"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: BillingAdmin }
            - { call: "POST /api/customers", payload: { name: "Cycle Co", credit_limit_cents: 100000000 }, as: BillingAdmin, captures: { custC: $.data.id, custC_v: $.data.version } }
            - { call: "POST /api/rate-cards", payload: { customer_id: "${custC}", storage_method: DAILY_PRORATED, frozen_storage_cents_per_pallet_month: 3000, chilled_storage_cents_per_pallet_month: 2000, handling_in_cents_per_pallet: 1000, handling_out_cents_per_pallet: 500, blast_base_cents: 2000, blast_per_pallet_cents: 300, liability_model: LIMITED_LIABILITY, liability_per_pallet_cents: 2000, dwell_exempt: false, expected_customer_version: "${custC_v}" }, as: BillingAdmin }
            - { call: "POST /api/zones", payload: { zone_code: "FZ-7", temp_class: FROZEN, capacity_pallets: 10, dock_doors: 2 }, as: WarehouseOperator, captures: { zoneC2: $.data.id } }
            - { call: "POST /api/inbound-receipts", payload: { customer_id: "${custC}", zone_id: "${zoneC2}", product_code: "PEAS", lot_code: "CY", production_date: "2026-01-15", temp_class: FROZEN, expected_pallets: 2, window_start: "2026-08-02T08:00:00Z", window_end: "2026-08-02T10:00:00Z" }, as: CustomerAdmin, as_user_id: "${custC}", captures: { rC: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T09:00:00Z" }, as: WarehouseOperator }
            - { call: "POST /api/inbound-receipts/${rC}/arrive", payload: {}, as: WarehouseOperator }
            - { call: "POST /api/inbound-receipts/${rC}/complete", payload: { actual_pallets: 2 }, as: WarehouseOperator }
            - { call: "POST /api/outbound-orders", payload: { customer_id: "${custC}", product_code: "PEAS", requested_pallets: 3 }, as: CustomerAdmin, as_user_id: "${custC}", captures: { oC: $.data.id } }
            - { call: "POST /api/outbound-orders/${oC}/submit", payload: {}, as: CustomerAdmin, as_user_id: "${custC}" }
            - { call: "POST /api/outbound-orders/${oC}/allocate", payload: {}, as: WarehouseOperator }
            - { call: "GET /api/outbound-orders/${oC}", as: CustomerAdmin, as_user_id: "${custC}", captures: { oC_v: $.data.version } }
          trigger:
            - { call: "POST /api/outbound-orders/${oC}/amend", payload: { requested_pallets: 2, expected_order_version: "${oC_v}" }, as: CustomerAdmin, as_user_id: "${custC}" }
            - { call: "POST /api/outbound-orders/${oC}/submit", payload: {}, as: CustomerAdmin, as_user_id: "${custC}" }
            - { call: "POST /api/outbound-orders/${oC}/allocate", payload: {}, as: WarehouseOperator }
            - { call: "GET /api/outbound-orders/${oC}", as: CustomerAdmin, as_user_id: "${custC}", captures: { oC_st: $.data.status, oC_al: $.data.allocated_pallets } }
          assert:
            - "Before amend: status == SHORTED, allocated_pallets == 2 (partial fill of 3)"
            - "After amend: status == DRAFT and allocated_pallets == 0 (all allocations released)"
            - "After re-submit + re-allocate: OutboundOrder.${oC}.status == ALLOCATED"
            - "OutboundOrder.${oC}.allocated_pallets == 2"

      - name: claim_denied_reopened_approved_cycle
        grounds:
          - state_machines.Claim
          - entities.Claim.fields.settlement_cents
        distinguishing_aspect: |
          Claim is cyclic through the appeal loop: FILED -> UNDER_REVIEW ->
          DENIED -> REOPENED -> UNDER_REVIEW -> APPROVED -> SETTLED; settlement
          is computed only on the final APPROVED pass (4000, LIMITED model).
          Entity: Claim (third distinct non-linear machine).
        test_recipe:
          setup:
            - "Customer with LIMITED_LIABILITY card; 2 pallets quarantined by a CONFIRMED_BREACH excursion"
            - "Claim (affected 2, declared 10000) filed against the excursion"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: BillingAdmin }
            - { call: "POST /api/customers", payload: { name: "Claim Co", credit_limit_cents: 100000000 }, as: BillingAdmin, captures: { custQ: $.data.id, custQ_v: $.data.version } }
            - { call: "POST /api/rate-cards", payload: { customer_id: "${custQ}", storage_method: DAILY_PRORATED, frozen_storage_cents_per_pallet_month: 3000, chilled_storage_cents_per_pallet_month: 2000, handling_in_cents_per_pallet: 1000, handling_out_cents_per_pallet: 500, blast_base_cents: 2000, blast_per_pallet_cents: 300, liability_model: LIMITED_LIABILITY, liability_per_pallet_cents: 2000, dwell_exempt: false, expected_customer_version: "${custQ_v}" }, as: BillingAdmin }
            - { call: "POST /api/zones", payload: { zone_code: "FZ-8", temp_class: FROZEN, capacity_pallets: 10, dock_doors: 2 }, as: WarehouseOperator, captures: { zoneQ: $.data.id } }
            - { call: "POST /api/inbound-receipts", payload: { customer_id: "${custQ}", zone_id: "${zoneQ}", product_code: "PEAS", lot_code: "QL", production_date: "2026-01-15", temp_class: FROZEN, expected_pallets: 2, window_start: "2026-08-02T08:00:00Z", window_end: "2026-08-02T10:00:00Z" }, as: CustomerAdmin, as_user_id: "${custQ}", captures: { rQ: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T09:00:00Z" }, as: WarehouseOperator }
            - { call: "POST /api/inbound-receipts/${rQ}/arrive", payload: {}, as: WarehouseOperator }
            - { call: "POST /api/inbound-receipts/${rQ}/complete", payload: { actual_pallets: 2 }, as: WarehouseOperator }
            - { call: "POST /api/temperature-excursions", payload: { zone_id: "${zoneQ}", observed_temp_c: -1.0, window_start: "2026-08-03T00:00:00Z", window_end: "2026-08-04T00:00:00Z" }, as: WarehouseOperator, as_user_id: "op-1", captures: { exQ: $.data.id } }
            - { call: "POST /api/temperature-excursions/${exQ}/confirm", payload: {}, as: QualityManager, as_user_id: "qm-1" }
            - { call: "POST /api/claims", payload: { customer_id: "${custQ}", excursion_id: "${exQ}", affected_pallet_count: 2, declared_value_cents: 10000 }, as: CustomerAdmin, as_user_id: "${custQ}", captures: { clQ: $.data.id } }
            - { call: "POST /api/claims/${clQ}/review", payload: {}, as: ClaimsAdjuster }
            - { call: "POST /api/claims/${clQ}/decide", payload: { decision: DENIED }, as: ClaimsAdjuster }
          trigger:
            - { call: "POST /api/claims/${clQ}/reopen", payload: {}, as: CustomerAdmin, as_user_id: "${custQ}" }
            - { call: "POST /api/claims/${clQ}/review", payload: {}, as: ClaimsAdjuster }
            - { call: "POST /api/claims/${clQ}/decide", payload: { decision: APPROVED }, as: ClaimsAdjuster }
            - { call: "POST /api/claims/${clQ}/settle", payload: {}, as: BillingAdmin }
            - { call: "GET /api/claims/${clQ}", as: BillingAdmin, captures: { clQ_st: $.data.status, clQ_set: $.data.settlement_cents } }
            - { call: "GET /api/invoices?customer_id=${custQ}&status=OPEN", as: BillingAdmin, captures: { invQ: "$.data[0].id" } }
          assert:
            - "Claim.${clQ}.status == SETTLED after the DENIED -> REOPENED -> UNDER_REVIEW -> APPROVED loop"
            - "Claim.${clQ}.settlement_cents == 4000  # min(10000, 2*2000)"
            - "Invoice.${invQ}.claim_credit_cents == 4000"
            - "Invoice.${invQ}.total_cents == -2000  # handling_in 2000 - credit 4000; negative totals allowed (credit balance), no clamping"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: excursion_confirm_four_hop_cascade
        grounds:
          - state_machines.TemperatureExcursion.REPORTED_to_CONFIRMED_BREACH
          - state_machines.Pallet
          - state_machines.OutboundOrder.ALLOCATED_to_SUBMITTED
        distinguishing_aspect: |
          Depth-4 chain from excursion confirm: (1) pallets OK->QUARANTINED
          (allocated ones first release), (2) lot recomputes to FULL_HOLD,
          (3) allocations on quarantined pallets -> RELEASED, (4) owning order
          demotes ALLOCATED -> SUBMITTED. Trigger: excursion confirm.
        test_recipe:
          setup:
            - "Customer with card A; FROZEN zone with 4 pallets of lot EL received 2026-08-02"
            - "Order for 2 pallets: submit -> allocate -> ALLOCATED (2 pallets ALLOCATED, 2 STORED)"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: BillingAdmin }
            - { call: "POST /api/customers", payload: { name: "Exc Co", credit_limit_cents: 100000000 }, as: BillingAdmin, captures: { custE: $.data.id, custE_v: $.data.version } }
            - { call: "POST /api/rate-cards", payload: { customer_id: "${custE}", storage_method: DAILY_PRORATED, frozen_storage_cents_per_pallet_month: 3000, chilled_storage_cents_per_pallet_month: 2000, handling_in_cents_per_pallet: 1000, handling_out_cents_per_pallet: 500, blast_base_cents: 2000, blast_per_pallet_cents: 300, liability_model: LIMITED_LIABILITY, liability_per_pallet_cents: 2000, dwell_exempt: false, expected_customer_version: "${custE_v}" }, as: BillingAdmin }
            - { call: "POST /api/zones", payload: { zone_code: "FZ-9", temp_class: FROZEN, capacity_pallets: 10, dock_doors: 2 }, as: WarehouseOperator, captures: { zoneE: $.data.id } }
            - { call: "POST /api/inbound-receipts", payload: { customer_id: "${custE}", zone_id: "${zoneE}", product_code: "PEAS", lot_code: "EL", production_date: "2026-01-15", temp_class: FROZEN, expected_pallets: 4, window_start: "2026-08-02T08:00:00Z", window_end: "2026-08-02T10:00:00Z" }, as: CustomerAdmin, as_user_id: "${custE}", captures: { rE: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T09:00:00Z" }, as: WarehouseOperator }
            - { call: "POST /api/inbound-receipts/${rE}/arrive", payload: {}, as: WarehouseOperator }
            - { call: "POST /api/inbound-receipts/${rE}/complete", payload: { actual_pallets: 4 }, as: WarehouseOperator, captures: { lotE: $.data.lot_id } }
            - { call: "POST /api/outbound-orders", payload: { customer_id: "${custE}", product_code: "PEAS", requested_pallets: 2 }, as: CustomerAdmin, as_user_id: "${custE}", captures: { oE: $.data.id } }
            - { call: "POST /api/outbound-orders/${oE}/submit", payload: {}, as: CustomerAdmin, as_user_id: "${custE}" }
            - { call: "POST /api/outbound-orders/${oE}/allocate", payload: {}, as: WarehouseOperator }
            - { call: "POST /api/temperature-excursions", payload: { zone_id: "${zoneE}", observed_temp_c: -4.0, window_start: "2026-08-03T00:00:00Z", window_end: "2026-08-04T00:00:00Z" }, as: WarehouseOperator, as_user_id: "op-1", captures: { exE: $.data.id } }
          trigger:
            - { call: "POST /api/temperature-excursions/${exE}/confirm", payload: {}, as: QualityManager, as_user_id: "qm-1" }
            - { call: "GET /api/temperature-excursions/${exE}", as: QualityManager, captures: { exE_n: $.data.quarantined_pallet_count } }
            - { call: "GET /api/lots/${lotE}", as: QualityManager, captures: { lotE_st: $.data.status } }
            - { call: "GET /api/outbound-orders/${oE}", as: QualityManager, captures: { oE_st: $.data.status, oE_al: $.data.allocated_pallets } }
            - { call: "GET /api/allocations?order_id=${oE}", as: QualityManager, captures: { alE1: "$.data[0].status", alE2: "$.data[1].status" } }
          assert:
            - "Hop 1: TemperatureExcursion.${exE}.quarantined_pallet_count == 4 (all present pallets, both STORED and formerly ALLOCATED)"
            - "Hop 2: InventoryLot.${lotE}.status == FULL_HOLD (all 4 present pallets QUARANTINED)"
            - "Hop 3: both allocations on order ${oE} have status == RELEASED"
            - "Hop 4: OutboundOrder.${oE}.status == SUBMITTED and allocated_pallets == 0"
            - "Order was ALLOCATED before confirm (verified pre-trigger)"

      - name: recall_activate_three_hop_cascade
        grounds:
          - state_machines.RecallEvent.DECLARED_to_ACTIVE
          - state_machines.Pallet
          - state_machines.InventoryLot
        distinguishing_aspect: |
          Depth-3 chain from a DIFFERENT trigger (recall activate): (1) lot
          pallets (STORED and ALLOCATED alike) -> quality RECALLED, (2)
          allocations on formerly-allocated pallets -> RELEASED, (3) owning
          order demotes ALLOCATED -> SUBMITTED and lot -> RECALLED.
        test_recipe:
          setup:
            - "Customer with card A; FROZEN zone with 3 pallets of lot RL received 2026-08-02"
            - "Order for 2 pallets ALLOCATED; recall declared on (customer, PEAS, RL)"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: BillingAdmin }
            - { call: "POST /api/customers", payload: { name: "Rec Co", credit_limit_cents: 100000000 }, as: BillingAdmin, captures: { custRe: $.data.id, custRe_v: $.data.version } }
            - { call: "POST /api/rate-cards", payload: { customer_id: "${custRe}", storage_method: DAILY_PRORATED, frozen_storage_cents_per_pallet_month: 3000, chilled_storage_cents_per_pallet_month: 2000, handling_in_cents_per_pallet: 1000, handling_out_cents_per_pallet: 500, blast_base_cents: 2000, blast_per_pallet_cents: 300, liability_model: LIMITED_LIABILITY, liability_per_pallet_cents: 2000, dwell_exempt: false, expected_customer_version: "${custRe_v}" }, as: BillingAdmin }
            - { call: "POST /api/zones", payload: { zone_code: "FZ-10", temp_class: FROZEN, capacity_pallets: 10, dock_doors: 2 }, as: WarehouseOperator, captures: { zoneRe: $.data.id } }
            - { call: "POST /api/inbound-receipts", payload: { customer_id: "${custRe}", zone_id: "${zoneRe}", product_code: "PEAS", lot_code: "RL", production_date: "2026-01-15", temp_class: FROZEN, expected_pallets: 3, window_start: "2026-08-02T08:00:00Z", window_end: "2026-08-02T10:00:00Z" }, as: CustomerAdmin, as_user_id: "${custRe}", captures: { rRe: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T09:00:00Z" }, as: WarehouseOperator }
            - { call: "POST /api/inbound-receipts/${rRe}/arrive", payload: {}, as: WarehouseOperator }
            - { call: "POST /api/inbound-receipts/${rRe}/complete", payload: { actual_pallets: 3 }, as: WarehouseOperator, captures: { lotRe: $.data.lot_id } }
            - { call: "POST /api/outbound-orders", payload: { customer_id: "${custRe}", product_code: "PEAS", requested_pallets: 2 }, as: CustomerAdmin, as_user_id: "${custRe}", captures: { oRe: $.data.id } }
            - { call: "POST /api/outbound-orders/${oRe}/submit", payload: {}, as: CustomerAdmin, as_user_id: "${custRe}" }
            - { call: "POST /api/outbound-orders/${oRe}/allocate", payload: {}, as: WarehouseOperator }
            - { call: "POST /api/recalls", payload: { customer_id: "${custRe}", product_code: "PEAS", lot_code: "RL", reason: "listeria swab positive" }, as: QualityManager, captures: { rcRe: $.data.id } }
          trigger:
            - { call: "POST /api/recalls/${rcRe}/activate", payload: {}, as: QualityManager }
            - { call: "GET /api/lots/${lotRe}", as: QualityManager, captures: { lotRe_st: $.data.status } }
            - { call: "GET /api/outbound-orders/${oRe}", as: QualityManager, captures: { oRe_st: $.data.status, oRe_al: $.data.allocated_pallets } }
            - { call: "GET /api/pallets?lot_id=${lotRe}", as: QualityManager, captures: { pRe1: "$.data[0].quality", pRe2: "$.data[1].quality", pRe3: "$.data[2].quality" } }
          assert:
            - "Hop 1: all 3 pallets of lot ${lotRe} have quality == RECALLED (including the 2 that were ALLOCATED)"
            - "Hop 2: OutboundOrder.${oRe}.allocated_pallets == 0 (both allocations RELEASED)"
            - "Hop 3: OutboundOrder.${oRe}.status == SUBMITTED (demoted from ALLOCATED)"
            - "InventoryLot.${lotRe}.status == RECALLED"

      - name: manual_allocation_release_bubble_up
        grounds:
          - state_machines.Allocation.ACTIVE_to_RELEASED
          - state_machines.OutboundOrder.ALLOCATED_to_SUBMITTED
        distinguishing_aspect: |
          Depth-2 cascade from a THIRD trigger (manual allocation release):
          release -> pallet ALLOCATED->STORED -> order demoted ALLOCATED ->
          SUBMITTED and allocated_pallets recomputed; a subsequent allocate
          re-fills to ALLOCATED (recovery path).
        test_recipe:
          setup:
            - "Customer with card A; FROZEN zone with 2 pallets of lot ML received 2026-08-02; order for 2 ALLOCATED"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: BillingAdmin }
            - { call: "POST /api/customers", payload: { name: "Rel Co", credit_limit_cents: 100000000 }, as: BillingAdmin, captures: { custM: $.data.id, custM_v: $.data.version } }
            - { call: "POST /api/rate-cards", payload: { customer_id: "${custM}", storage_method: DAILY_PRORATED, frozen_storage_cents_per_pallet_month: 3000, chilled_storage_cents_per_pallet_month: 2000, handling_in_cents_per_pallet: 1000, handling_out_cents_per_pallet: 500, blast_base_cents: 2000, blast_per_pallet_cents: 300, liability_model: LIMITED_LIABILITY, liability_per_pallet_cents: 2000, dwell_exempt: false, expected_customer_version: "${custM_v}" }, as: BillingAdmin }
            - { call: "POST /api/zones", payload: { zone_code: "FZ-11", temp_class: FROZEN, capacity_pallets: 10, dock_doors: 2 }, as: WarehouseOperator, captures: { zoneM: $.data.id } }
            - { call: "POST /api/inbound-receipts", payload: { customer_id: "${custM}", zone_id: "${zoneM}", product_code: "PEAS", lot_code: "ML", production_date: "2026-01-15", temp_class: FROZEN, expected_pallets: 2, window_start: "2026-08-02T08:00:00Z", window_end: "2026-08-02T10:00:00Z" }, as: CustomerAdmin, as_user_id: "${custM}", captures: { rM: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T09:00:00Z" }, as: WarehouseOperator }
            - { call: "POST /api/inbound-receipts/${rM}/arrive", payload: {}, as: WarehouseOperator }
            - { call: "POST /api/inbound-receipts/${rM}/complete", payload: { actual_pallets: 2 }, as: WarehouseOperator, captures: { lotM: $.data.lot_id } }
            - { call: "POST /api/outbound-orders", payload: { customer_id: "${custM}", product_code: "PEAS", requested_pallets: 2 }, as: CustomerAdmin, as_user_id: "${custM}", captures: { oM: $.data.id } }
            - { call: "POST /api/outbound-orders/${oM}/submit", payload: {}, as: CustomerAdmin, as_user_id: "${custM}" }
            - { call: "POST /api/outbound-orders/${oM}/allocate", payload: {}, as: WarehouseOperator }
            - { call: "GET /api/allocations?order_id=${oM}", as: WarehouseOperator, captures: { alM: "$.data[0].id", alM_pal: "$.data[0].pallet_id" } }
          trigger:
            - { call: "POST /api/allocations/${alM}/release", payload: {}, as: WarehouseOperator }
            - { call: "GET /api/outbound-orders/${oM}", as: WarehouseOperator, captures: { oM_st: $.data.status, oM_al: $.data.allocated_pallets } }
            - { call: "GET /api/pallets/${alM_pal}", as: WarehouseOperator, captures: { palM_st: $.data.status } }
            - { call: "POST /api/outbound-orders/${oM}/allocate", payload: {}, as: WarehouseOperator }
            - { call: "GET /api/outbound-orders/${oM}", as: WarehouseOperator, captures: { oM_st2: $.data.status, oM_al2: $.data.allocated_pallets } }
          assert:
            - "After release: Pallet.${alM_pal}.status == STORED (hop 1)"
            - "After release: OutboundOrder.${oM}.status == SUBMITTED and allocated_pallets == 1 (hop 2 demotion)"
            - "After re-allocate: OutboundOrder.${oM}.status == ALLOCATED and allocated_pallets == 2 (recovery)"
            - "InventoryLot.${lotM}.status == AVAILABLE throughout (quality untouched)"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: safety_recall_beats_fiscal_credit_on_submit
        grounds:
          - validations[priority=7]
          - validations[priority=11]
          - errors[ERR_LOT_RECALLED]
          - errors[ERR_CREDIT_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          Pair business_safety (p7) vs business_fiscal (p11): the order submit
          violates BOTH (lot override is RECALLED; credit limit 1 is exceeded by
          accrued handling-in). The p7 safety error ERR_LOT_RECALLED must win.
        test_recipe:
          setup:
            - "Customer with card A, credit_limit_cents == 1; 1 pallet of lot SX received (handling_in 1000 already exceeds the limit)"
            - "Recall on (customer, PEAS, SX) ACTIVATED -> lot RECALLED"
            - "Order with lot_code=SX override, requested_pallets 1, in DRAFT"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: BillingAdmin }
            - { call: "POST /api/customers", payload: { name: "Safety Co", credit_limit_cents: 1 }, as: BillingAdmin, captures: { custS: $.data.id, custS_v: $.data.version } }
            - { call: "POST /api/rate-cards", payload: { customer_id: "${custS}", storage_method: DAILY_PRORATED, frozen_storage_cents_per_pallet_month: 3000, chilled_storage_cents_per_pallet_month: 2000, handling_in_cents_per_pallet: 1000, handling_out_cents_per_pallet: 500, blast_base_cents: 2000, blast_per_pallet_cents: 300, liability_model: LIMITED_LIABILITY, liability_per_pallet_cents: 2000, dwell_exempt: false, expected_customer_version: "${custS_v}" }, as: BillingAdmin }
            - { call: "POST /api/zones", payload: { zone_code: "FZ-12", temp_class: FROZEN, capacity_pallets: 10, dock_doors: 2 }, as: WarehouseOperator, captures: { zoneS: $.data.id } }
            - { call: "POST /api/inbound-receipts", payload: { customer_id: "${custS}", zone_id: "${zoneS}", product_code: "PEAS", lot_code: "SX", production_date: "2026-01-15", temp_class: FROZEN, expected_pallets: 1, window_start: "2026-08-02T08:00:00Z", window_end: "2026-08-02T10:00:00Z" }, as: CustomerAdmin, as_user_id: "${custS}", captures: { rS: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T09:00:00Z" }, as: WarehouseOperator }
            - { call: "POST /api/inbound-receipts/${rS}/arrive", payload: {}, as: WarehouseOperator }
            - { call: "POST /api/inbound-receipts/${rS}/complete", payload: { actual_pallets: 1 }, as: WarehouseOperator }
            - { call: "POST /api/recalls", payload: { customer_id: "${custS}", product_code: "PEAS", lot_code: "SX", reason: "allergen" }, as: QualityManager, captures: { rcS: $.data.id } }
            - { call: "POST /api/recalls/${rcS}/activate", payload: {}, as: QualityManager }
            - { call: "POST /api/outbound-orders", payload: { customer_id: "${custS}", product_code: "PEAS", requested_pallets: 1, lot_code: "SX" }, as: CustomerAdmin, as_user_id: "${custS}", captures: { oS: $.data.id } }
          trigger:
            - { call: "POST /api/outbound-orders/${oS}/submit", payload: {}, as: CustomerAdmin, as_user_id: "${custS}", captures: { errS: $.data.error_id } }
          assert:
            - "error_id == ERR_LOT_RECALLED  # p7 business_safety beats p11 business_fiscal"
            - "error_id != ERR_CREDIT_LIMIT_EXCEEDED (both conditions hold: outstanding 1000 > limit 1)"
            - "OutboundOrder.${oS}.status == DRAFT (unchanged)"

      - name: state_beats_capacity_constraint_on_receipt_complete
        grounds:
          - validations[priority=6]
          - validations[priority=9]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_ZONE_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Pair state (p6) vs business_constraint (p9): a second complete on an
          already-COMPLETED receipt into a zone that is now FULL violates both
          ERR_INVALID_STATE and ERR_ZONE_CAPACITY_EXCEEDED; the p6 state error
          must win. Different category pair than the safety/fiscal instance.
        test_recipe:
          setup:
            - "Customer with card A; zone cap 2; receipt T2 (expected 2) COMPLETED with actual 2 -> zone FULL (free 0)"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: BillingAdmin }
            - { call: "POST /api/customers", payload: { name: "State Co", credit_limit_cents: 100000000 }, as: BillingAdmin, captures: { custT: $.data.id, custT_v: $.data.version } }
            - { call: "POST /api/rate-cards", payload: { customer_id: "${custT}", storage_method: DAILY_PRORATED, frozen_storage_cents_per_pallet_month: 3000, chilled_storage_cents_per_pallet_month: 2000, handling_in_cents_per_pallet: 1000, handling_out_cents_per_pallet: 500, blast_base_cents: 2000, blast_per_pallet_cents: 300, liability_model: LIMITED_LIABILITY, liability_per_pallet_cents: 2000, dwell_exempt: false, expected_customer_version: "${custT_v}" }, as: BillingAdmin }
            - { call: "POST /api/zones", payload: { zone_code: "FZ-13", temp_class: FROZEN, capacity_pallets: 2, dock_doors: 2 }, as: WarehouseOperator, captures: { zoneT: $.data.id } }
            - { call: "POST /api/inbound-receipts", payload: { customer_id: "${custT}", zone_id: "${zoneT}", product_code: "PEAS", lot_code: "T2", production_date: "2026-01-15", temp_class: FROZEN, expected_pallets: 2, window_start: "2026-08-02T08:00:00Z", window_end: "2026-08-02T10:00:00Z" }, as: CustomerAdmin, as_user_id: "${custT}", captures: { rT: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T09:00:00Z" }, as: WarehouseOperator }
            - { call: "POST /api/inbound-receipts/${rT}/arrive", payload: {}, as: WarehouseOperator }
            - { call: "POST /api/inbound-receipts/${rT}/complete", payload: { actual_pallets: 2 }, as: WarehouseOperator }
          trigger:
            - { call: "POST /api/inbound-receipts/${rT}/complete", payload: { actual_pallets: 1 }, as: WarehouseOperator, captures: { errT: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE  # receipt already COMPLETED; p6 state beats p9 capacity"
            - "error_id != ERR_ZONE_CAPACITY_EXCEEDED (free_pallets == 0 would also fail the capacity check)"
            - "InboundReceipt.${rT}.status == COMPLETED (unchanged); no new pallets created"

      - name: authorization_beats_state_on_allocate
        grounds:
          - validations[priority=3]
          - validations[priority=6]
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: |
          Pair authorization (p3) vs state (p6): a CustomerAdmin (owner) calls
          the WarehouseOperator-only allocate endpoint on a DRAFT order; both
          ERR_FORBIDDEN and ERR_INVALID_STATE hold, and the p3 authorization
          error must win. Third distinct category pair.
        test_recipe:
          setup:
            - "Customer with card A; zone with 1 pallet; order for 1 pallet in DRAFT (never submitted)"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: BillingAdmin }
            - { call: "POST /api/customers", payload: { name: "Authz Co", credit_limit_cents: 100000000 }, as: BillingAdmin, captures: { custAu: $.data.id, custAu_v: $.data.version } }
            - { call: "POST /api/rate-cards", payload: { customer_id: "${custAu}", storage_method: DAILY_PRORATED, frozen_storage_cents_per_pallet_month: 3000, chilled_storage_cents_per_pallet_month: 2000, handling_in_cents_per_pallet: 1000, handling_out_cents_per_pallet: 500, blast_base_cents: 2000, blast_per_pallet_cents: 300, liability_model: LIMITED_LIABILITY, liability_per_pallet_cents: 2000, dwell_exempt: false, expected_customer_version: "${custAu_v}" }, as: BillingAdmin }
            - { call: "POST /api/zones", payload: { zone_code: "FZ-14", temp_class: FROZEN, capacity_pallets: 5, dock_doors: 2 }, as: WarehouseOperator, captures: { zoneAu: $.data.id } }
            - { call: "POST /api/inbound-receipts", payload: { customer_id: "${custAu}", zone_id: "${zoneAu}", product_code: "PEAS", lot_code: "AU", production_date: "2026-01-15", temp_class: FROZEN, expected_pallets: 1, window_start: "2026-08-02T08:00:00Z", window_end: "2026-08-02T10:00:00Z" }, as: CustomerAdmin, as_user_id: "${custAu}", captures: { rAu: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T09:00:00Z" }, as: WarehouseOperator }
            - { call: "POST /api/inbound-receipts/${rAu}/arrive", payload: {}, as: WarehouseOperator }
            - { call: "POST /api/inbound-receipts/${rAu}/complete", payload: { actual_pallets: 1 }, as: WarehouseOperator }
            - { call: "POST /api/outbound-orders", payload: { customer_id: "${custAu}", product_code: "PEAS", requested_pallets: 1 }, as: CustomerAdmin, as_user_id: "${custAu}", captures: { oAu: $.data.id } }
          trigger:
            - { call: "POST /api/outbound-orders/${oAu}/allocate", payload: {}, as: CustomerAdmin, as_user_id: "${custAu}", captures: { errAu: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN  # p3 authorization beats p6 state (DRAFT is not allocatable)"
            - "OutboundOrder.${oAu}.status == DRAFT (unchanged)"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: zone_capacity_exact_fill_then_overflow
        grounds:
          - calculations.zone_free_pallets
          - calculations.zone_posture
          - errors[ERR_ZONE_FULL]
        distinguishing_aspect: |
          Metric: pallet count. Filling a capacity-3 zone with exactly 3
          pallets succeeds (free == 0 boundary is legal for putaway) and flips
          posture to FULL; the NEXT arrival is rejected with ERR_ZONE_FULL.
          Endpoint: receipt complete/arrive.
        test_recipe:
          setup:
            - "Customer with card A; zone cap 3, dock_doors 2; receipt1 (expected 3) and receipt2 (expected 1) scheduled in disjoint windows"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: BillingAdmin }
            - { call: "POST /api/customers", payload: { name: "Cap Co", credit_limit_cents: 100000000 }, as: BillingAdmin, captures: { custCap: $.data.id, custCap_v: $.data.version } }
            - { call: "POST /api/rate-cards", payload: { customer_id: "${custCap}", storage_method: DAILY_PRORATED, frozen_storage_cents_per_pallet_month: 3000, chilled_storage_cents_per_pallet_month: 2000, handling_in_cents_per_pallet: 1000, handling_out_cents_per_pallet: 500, blast_base_cents: 2000, blast_per_pallet_cents: 300, liability_model: LIMITED_LIABILITY, liability_per_pallet_cents: 2000, dwell_exempt: false, expected_customer_version: "${custCap_v}" }, as: BillingAdmin }
            - { call: "POST /api/zones", payload: { zone_code: "FZ-15", temp_class: FROZEN, capacity_pallets: 3, dock_doors: 2 }, as: WarehouseOperator, captures: { zoneCap: $.data.id } }
            - { call: "POST /api/inbound-receipts", payload: { customer_id: "${custCap}", zone_id: "${zoneCap}", product_code: "PEAS", lot_code: "C1", production_date: "2026-01-15", temp_class: FROZEN, expected_pallets: 3, window_start: "2026-08-02T08:00:00Z", window_end: "2026-08-02T10:00:00Z" }, as: CustomerAdmin, as_user_id: "${custCap}", captures: { rC1: $.data.id } }
            - { call: "POST /api/inbound-receipts", payload: { customer_id: "${custCap}", zone_id: "${zoneCap}", product_code: "PEAS", lot_code: "C2", production_date: "2026-01-16", temp_class: FROZEN, expected_pallets: 1, window_start: "2026-08-02T11:00:00Z", window_end: "2026-08-02T13:00:00Z" }, as: CustomerAdmin, as_user_id: "${custCap}", captures: { rC2: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T09:00:00Z" }, as: WarehouseOperator }
            - { call: "POST /api/inbound-receipts/${rC1}/arrive", payload: {}, as: WarehouseOperator }
            - { call: "POST /api/inbound-receipts/${rC1}/complete", payload: { actual_pallets: 3 }, as: WarehouseOperator }
          trigger:
            - { call: "GET /api/zones/${zoneCap}", as: WarehouseOperator, captures: { capFree: $.data.free_pallets, capPosture: $.data.posture } }
            - { call: "POST /api/inbound-receipts/${rC2}/arrive", payload: {}, as: WarehouseOperator, captures: { errCap: $.data.error_id } }
          assert:
            - "Receipt1 complete with actual_pallets == 3 succeeded: exact fill is allowed (free == 0 after)"
            - "TemperatureZone.${zoneCap}.free_pallets == 0 and posture == FULL"
            - "Receipt2 arrive: error_id == ERR_ZONE_FULL (FULL posture gates arrival)"
            - "InboundReceipt.${rC2}.status == SCHEDULED (unchanged)"

      - name: dwell_tier_at_exactly_60_days
        grounds:
          - calculations.dwell_surcharge
          - entities.Invoice.fields.dwell_surcharge_cents
        distinguishing_aspect: |
          Metric: whole dwell days. A pallet at exactly 60 days on period end
          triggers the >= 60 tier (25%); its sibling at 59 days does not.
          Endpoint: billing run. Different metric and endpoint from the
          pallet-count boundary.
        test_recipe:
          setup:
            - "Customer (created 2026-07-01, DAILY card, chilled rate 2000, dwell_exempt false); CHILLED zone"
            - "Pallet A (lot D60) received 2026-07-03T00:00; pallet B (lot D59) received 2026-07-04T00:00"
            - "Billing runs at 2026-08-01 (July invoice) and 2026-09-01 (August invoice)"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: BillingAdmin }
            - { call: "POST /api/customers", payload: { name: "Dwell B", credit_limit_cents: 100000000 }, as: BillingAdmin, captures: { custD6: $.data.id, custD6_v: $.data.version } }
            - { call: "POST /api/rate-cards", payload: { customer_id: "${custD6}", storage_method: DAILY_PRORATED, frozen_storage_cents_per_pallet_month: 3000, chilled_storage_cents_per_pallet_month: 2000, handling_in_cents_per_pallet: 1000, handling_out_cents_per_pallet: 500, blast_base_cents: 2000, blast_per_pallet_cents: 300, liability_model: LIMITED_LIABILITY, liability_per_pallet_cents: 2000, dwell_exempt: false, expected_customer_version: "${custD6_v}" }, as: BillingAdmin }
            - { call: "POST /api/zones", payload: { zone_code: "CH-2", temp_class: CHILLED, capacity_pallets: 10, dock_doors: 2 }, as: WarehouseOperator, captures: { zoneD6: $.data.id } }
            - { call: "POST /api/inbound-receipts", payload: { customer_id: "${custD6}", zone_id: "${zoneD6}", product_code: "MILK", lot_code: "D60", production_date: "2026-06-01", temp_class: CHILLED, expected_pallets: 1, window_start: "2026-07-03T00:00:00Z", window_end: "2026-07-03T02:00:00Z" }, as: CustomerAdmin, as_user_id: "${custD6}", captures: { rD60: $.data.id } }
            - { call: "POST /api/inbound-receipts", payload: { customer_id: "${custD6}", zone_id: "${zoneD6}", product_code: "MILK", lot_code: "D59", production_date: "2026-06-01", temp_class: CHILLED, expected_pallets: 1, window_start: "2026-07-04T00:00:00Z", window_end: "2026-07-04T02:00:00Z" }, as: CustomerAdmin, as_user_id: "${custD6}", captures: { rD59: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-07-03T00:00:00Z" }, as: WarehouseOperator }
