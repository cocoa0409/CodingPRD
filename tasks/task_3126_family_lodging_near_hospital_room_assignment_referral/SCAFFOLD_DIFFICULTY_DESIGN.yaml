        grounds:
          - state_machines.Referral.VERIFIED_to_REVOKED
          - calculations.waitlist_ranking
          - calculations.room_selector
        distinguishing_aspect: |
          Depth-3 cascade from POST /api/referrals/{id}/revoke: revocation flips
          the request's verification_status (hop 1), which rescinds its OFFERED
          assignment and frees the room (hop 2), which immediately re-offers the
          freed room to the next ranked waitlisted family (hop 3) — each hop
          caused by the previous one, not by the revoke call directly.
