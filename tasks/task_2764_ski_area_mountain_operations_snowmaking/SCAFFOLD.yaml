  # -- snowmaking -----------------------------------------------------------
  - method: POST
    path: "/mountain-ops/snowmaking-sessions"
    description: >-
      Schedule a snowmaking session against one terrain area and pump house. Reserves water on the
      season ledger, sweeps pump-house and plant capacity over the requested window, and supersedes
      any overlapping SCHEDULED session on the same area. Requires the TerrainArea version the
      caller observed.
    roles: [SnowmakingSupervisor]
    code: 201
    input: [terrain_area_id, pump_house_id, window_start, window_end, gun_count, gpm, expected_terrain_area_version]
    output: SnowmakingSession
    side_effects:
      - "state = SCHEDULED; planned_minutes = whole minutes between window_start and window_end; accumulated_run_minutes = 0"
      - "water_af_reserved = calculations.snowmaking_water_volume variant PLANNED_RESERVATION; SeasonConfig.water_reserved_af increased by that amount; increments SeasonConfig.version by 1"
      - "calculations.pump_capacity_sweep runs for the pump house then plant-wide; PumpHouse.peak_committed_gpm updated; increments PumpHouse.version by 1"
      - "any overlapping SCHEDULED session on the same terrain area moves to ABORTED with abort_reason=SUPERSEDED and releases its reservation"
      - "TerrainArea CLOSED -> PREP when the area is in CLOSED"
      - "rejects a stale expected_terrain_area_version with ERR_STALE_TERRAIN_AREA_VERSION (412); increments TerrainArea.version by 1 on success"

  - method: GET
    path: "/mountain-ops/snowmaking-sessions/{id}"
    description: "Read a snowmaking session with its metered water, snow and energy figures"
    roles: [MountainOpsDirector, SnowmakingSupervisor, GroomingLead, LiftOpsManager, Patroller, GuestServicesAgent]
    code: 200
    input: []
    output: SnowmakingSession
    side_effects: []

  - method: GET
    path: "/mountain-ops/snowmaking-sessions"
    description: "List snowmaking sessions, filterable by terrain area, pump house and state"
    roles: [MountainOpsDirector, SnowmakingSupervisor, GroomingLead, LiftOpsManager, Patroller, GuestServicesAgent]
    code: 200
    input: ["terrain_area_id?", "pump_house_id?", "state?", "abort_reason?", "limit?", "offset?"]
    output: SnowmakingSession[]
    side_effects: []

  - method: POST
    path: "/mountain-ops/snowmaking-sessions/{id}/status"
    description: "Drive a session through RUNNING, PAUSED and COMPLETED; RUNNING <-> PAUSED may cycle any number of times"
    roles: [SnowmakingSupervisor]
    code: 200
    input: [target_state]
    output: SnowmakingSession
    side_effects:
      - "target_state=RUNNING: reads the active DayPlan wet_bulb_f, rejects above 27.0 (ERR_WET_BULB_TOO_WARM), sets snow_yield_factor per calculations.snowmaking_wet_bulb_yield, stamps last_running_since, increments PumpHouse.active_session_count on the first start"
      - "target_state=PAUSED: accumulated_run_minutes increased by the whole minutes since last_running_since; last_running_since cleared"
      - "target_state=COMPLETED: closes the open run segment, then computes water_af_actual (METERED_ACTUAL), snow_swe_af, energy_kwh and energy_cost_usd per calculations.snowmaking_energy_cost, sets demand_surcharge_applied"
      - "on completion the season ledger moves: water_reserved_af -= water_af_reserved, water_used_af += water_af_actual, snow_produced_swe_af += snow_swe_af; TerrainArea.machine_swe_af += snow_swe_af"
      - "increments SnowmakingSession.version by 1, and SeasonConfig, TerrainArea and PumpHouse versions by 1 on completion"

  # -- grooming -------------------------------------------------------------
  - method: POST
    path: "/mountain-ops/grooming-tasks"
    description: "Plan an overnight grooming task on a cat route, optionally winched"
    roles: [GroomingLead]
    code: 201
    input: ["terrain_area_id", "cat_route_code", "sequence_index", "snowcat_unit_code", "window_start", "window_end", "winch_required?", "winch_anchor_code?"]
    output: GroomingTask
    side_effects:
      - "state = PLANNED; passes_completed = 0; coverage_pct = 0.0"
      - "rejects winch_required=true without winch_anchor_code (ERR_WINCH_ANCHOR_REQUIRED) and a duplicate sequence_index on the same cat_route_code (ERR_DUPLICATE_CODE)"

  - method: GET
    path: "/mountain-ops/grooming-tasks/{id}"
    description: "Read a grooming task with its coverage result"
    roles: [MountainOpsDirector, SnowmakingSupervisor, GroomingLead, LiftOpsManager, Patroller, GuestServicesAgent]
    code: 200
    input: []
    output: GroomingTask
    side_effects: []

  - method: GET
    path: "/mountain-ops/grooming-tasks"
    description: "List grooming tasks, filterable by terrain area, cat route and state"
    roles: [MountainOpsDirector, SnowmakingSupervisor, GroomingLead, LiftOpsManager, Patroller, GuestServicesAgent]
    code: 200
    input: ["terrain_area_id?", "cat_route_code?", "snowcat_unit_code?", "state?", "limit?", "offset?"]
    output: GroomingTask[]
    side_effects: []

  - method: POST
    path: "/mountain-ops/grooming-tasks/{id}/dispatch"
    description: "Send a snowcat out on a planned or deferred task; enforces cat-route sequencing and snowcat exclusivity"
    roles: [GroomingLead]
    code: 200
    input: []
    output: GroomingTask
    side_effects:
      - "state = DISPATCHED; dispatched_at = logical_clock"
      - "rejects an unfinished lower sequence_index on the same cat_route_code (ERR_GROOM_SEQUENCE_VIOLATION) before checking the snowcat window overlap (ERR_SNOWCAT_CONFLICT)"
      - "TerrainArea CLOSED -> PREP when the area is in CLOSED; increments TerrainArea.version by 1 in that case"
      - "increments GroomingTask.version by 1"

  - method: POST
    path: "/mountain-ops/grooming-tasks/{id}/complete"
    description: "Close out a grooming task with the number of passes actually cut; scores coverage and refreshes the area's groom currency"
    roles: [GroomingLead]
    code: 200
    input: [passes_completed]
    output: GroomingTask
    side_effects:
      - "state = COMPLETED; completed_at = logical_clock; coverage_pct = calculations.groom_coverage_pct"
      - "TerrainArea.last_groomed_at = logical_clock; groom_coverage_pct copied; groom_ready = coverage_pct >= 70.0"
      - "readiness re-evaluation may move the area PREP -> READY or READY -> PREP"
      - "increments GroomingTask.version by 1 and TerrainArea.version by 1"

  # -- ski patrol -----------------------------------------------------------
  - method: POST
    path: "/mountain-ops/patrollers"
    description: "Roster a patroller, optionally assigned to a terrain area"
    roles: [MountainOpsDirector]
    code: 201
    input: ["season_id", "patroller_code", "cert_level", "full_name?", "assigned_terrain_area_id?", "blaster_certified?", "on_duty?"]
    output: Patroller
    side_effects:
      - "status = AVAILABLE when on_duty is true, otherwise OFF_DUTY"
      - "TerrainArea.assigned_patroller_count recomputed for the assigned area; readiness re-evaluation may move it PREP -> READY; increments TerrainArea.version by 1"

  - method: GET
    path: "/mountain-ops/patrollers/{id}"
    description: "Read a patroller with duty and availability state"
    roles: [MountainOpsDirector, SnowmakingSupervisor, GroomingLead, LiftOpsManager, Patroller, GuestServicesAgent]
    code: 200
    input: []
    output: Patroller
    side_effects: []

  - method: GET
    path: "/mountain-ops/patrollers"
    description: "List patrollers, filterable by season, assigned area, duty flag and availability"
    roles: [MountainOpsDirector, SnowmakingSupervisor, GroomingLead, LiftOpsManager, Patroller, GuestServicesAgent]
    code: 200
    input: ["season_id?", "assigned_terrain_area_id?", "status?", "on_duty?", "cert_level?", "limit?", "offset?"]
    output: Patroller[]
    side_effects: []

  - method: POST
    path: "/mountain-ops/patrollers/{id}/duty"
    description: "Put a patroller on or off duty for the day"
    roles: [MountainOpsDirector]
    code: 200
    input: [on_duty]
    output: Patroller
    side_effects:
      - "status = AVAILABLE when on_duty becomes true and the patroller is not ON_INCIDENT; status = OFF_DUTY when on_duty becomes false"
      - "TerrainArea.assigned_patroller_count recomputed; an OPEN area that falls below SeasonConfig.min_patrollers_per_open_area drops to PATROL_HOLD, defers its grooming tasks, aborts its sessions and shrinks the active DayPlan capacity"
      - "increments Patroller.version by 1"

  # -- avalanche mitigation -------------------------------------------------
  - method: POST
    path: "/mountain-ops/mitigation-missions"
    description: "Plan an avalanche mitigation mission on avalanche terrain"
    roles: [Patroller, MountainOpsDirector]
    code: 201
    input: ["terrain_area_id", "route_code", "method", "hazard_rating_pre", "planned_charges?"]
    output: AvalancheMitigationMission
    side_effects: ["state = PLANNED; charges_used = 0; road_closure_minutes = 0; clearance_valid_hours = 24 for EXPLOSIVE and GAS_EXPLODER, 8 for SKI_CUT"]

  - method: GET
    path: "/mountain-ops/mitigation-missions/{id}"
    description: "Read a mitigation mission with its clearance and closure figures"
    roles: [MountainOpsDirector, SnowmakingSupervisor, GroomingLead, LiftOpsManager, Patroller, GuestServicesAgent]
    code: 200
    input: []
    output: AvalancheMitigationMission
    side_effects: []

  - method: GET
    path: "/mountain-ops/mitigation-missions"
    description: "List mitigation missions, filterable by terrain area, executing patroller, clearing patroller and state"
    roles: [MountainOpsDirector, SnowmakingSupervisor, GroomingLead, LiftOpsManager, Patroller, GuestServicesAgent]
    code: 200
    input: ["terrain_area_id?", "executed_by_patroller_id?", "cleared_by_patroller_id?", "method?", "state?", "limit?", "offset?"]
    output: AvalancheMitigationMission[]
    side_effects: []

  - method: POST
    path: "/mountain-ops/mitigation-missions/{id}/execute"
    description: "Execute a planned mission; the acting Patroller is taken from X-User-ID and must hold the certification the method demands"
    roles: [Patroller]
    code: 200
    input: [charges_used]
    output: AvalancheMitigationMission
    side_effects:
      - "state = EXECUTED; executed_at = logical_clock; executed_by_patroller_id = X-User-ID"
      - "road_closure_minutes = 20 * charges_used"
      - "rejects EXPLOSIVE or GAS_EXPLODER without blaster_certified (ERR_BLASTER_CERT_REQUIRED) and SKI_CUT without a second AVAILABLE on-duty patroller (ERR_SKI_CUT_PARTNER_REQUIRED)"
      - "increments AvalancheMitigationMission.version by 1"

  - method: POST
    path: "/mountain-ops/mitigation-missions/{id}/clear"
    description: "Sign off an executed mission; a post-hazard rating of 3 or more extends the hold instead of clearing it"
    roles: [Patroller]
    code: 200
    input: [hazard_rating_post]
    output: AvalancheMitigationMission
    side_effects:
      - "hazard_rating_post in {LOW, MODERATE}: state = CLEARED; TerrainArea.mitigation_clearance_expires_at = logical_clock + clearance_valid_hours (24h for EXPLOSIVE and GAS_EXPLODER, 8h for SKI_CUT); readiness re-evaluation may move the area PREP -> READY"
      - "hazard_rating_post in {CONSIDERABLE, HIGH, EXTREME}: state = HOLD_EXTENDED; TerrainArea.mitigation_clearance_expires_at = null; an OPEN area drops to PATROL_HOLD"
      - "rejects X-User-ID equal to executed_by_patroller_id (ERR_SOD_VIOLATION) and a clearing patroller below EMT (ERR_PATROLLER_CERT_INSUFFICIENT)"
      - "increments AvalancheMitigationMission.version by 1 and TerrainArea.version by 1"

  # -- patrol incidents -----------------------------------------------------
  - method: POST
    path: "/mountain-ops/incidents"
    description: "Report a patrol incident on a terrain area"
    roles: [Patroller, GuestServicesAgent, MountainOpsDirector, LiftOpsManager]
    code: 201
    input: ["terrain_area_id", "reporter_code", "severity", "location_note?"]
    output: PatrolIncident
    side_effects: ["state = REPORTED; reported_at = logical_clock; response_minutes = 0"]

  - method: GET
    path: "/mountain-ops/incidents/{id}"
    description: "Read a patrol incident with its response and transport record"
    roles: [MountainOpsDirector, SnowmakingSupervisor, GroomingLead, LiftOpsManager, Patroller, GuestServicesAgent]
    code: 200
    input: []
    output: PatrolIncident
    side_effects: []

  - method: GET
    path: "/mountain-ops/incidents"
    description: "List patrol incidents, filterable by terrain area, responder, severity and state"
    roles: [MountainOpsDirector, SnowmakingSupervisor, GroomingLead, LiftOpsManager, Patroller, GuestServicesAgent]
    code: 200
    input: ["terrain_area_id?", "responder_patroller_id?", "severity?", "state?", "limit?", "offset?"]
    output: PatrolIncident[]
    side_effects: []

  - method: POST
    path: "/mountain-ops/incidents/{id}/dispatch"
    description: "Dispatch a patroller to a reported incident; pulls the patroller off the staffing pool"
    roles: [MountainOpsDirector]
    code: 200
    input: [patroller_id]
    output: PatrolIncident
    side_effects:
      - "state = DISPATCHED; dispatched_at = logical_clock; responder_patroller_id set; response_minutes = calculations.incident_response_minutes"
      - "Patroller AVAILABLE -> ON_INCIDENT; increments Patroller.version by 1"
      - "the responder's assigned TerrainArea has assigned_patroller_count recomputed; an OPEN area below SeasonConfig.min_patrollers_per_open_area drops to PATROL_HOLD, which defers that area's PLANNED and DISPATCHED grooming tasks and aborts its SCHEDULED/RUNNING/PAUSED sessions with their water released"
      - "active DayPlan open_terrain_count, terrain_open_acres, guest_capacity and posture recomputed; increments DayPlan.version by 1"
      - "increments PatrolIncident.version by 1"

  - method: POST
    path: "/mountain-ops/incidents/{id}/transport"
    description: "Order medical transport for a dispatched incident; the mode is gated by severity"
    roles: [Patroller]
    code: 200
    input: [transport_mode]
    output: PatrolIncident
    side_effects:
      - "state = TRANSPORT_ORDERED; transport_ordered_at = logical_clock; transport_mode recorded"
      - "rejects HELICOPTER below CRITICAL severity and AMBULANCE below SERIOUS severity (ERR_TRANSPORT_MODE_NOT_ALLOWED)"
      - "increments PatrolIncident.version by 1"

  - method: POST
    path: "/mountain-ops/incidents/{id}/close"
    description: "Close an incident with a disposition; returns the responder to the staffing pool"
    roles: [Patroller]
    code: 200
    input: [disposition]
    output: PatrolIncident
    side_effects:
      - "state = CLOSED; closed_at = logical_clock; disposition recorded (RELEASED_ON_HILL is only valid straight from DISPATCHED)"
      - "responder Patroller ON_INCIDENT -> AVAILABLE; assigned TerrainArea.assigned_patroller_count recomputed; an area already in PATROL_HOLD is not auto-reopened"
      - "increments PatrolIncident.version by 1 and Patroller.version by 1"

  # -- day plans, capacity and access --------------------------------------
  - method: POST
    path: "/mountain-ops/day-plans"
    description: "Create the operating plan for one date"
    roles: [MountainOpsDirector]
    code: 201
    input: [season_id, operating_date, parking_stalls_total]
    output: DayPlan
    side_effects:
      - "posture = DRAFT; wind_speed_mph = 0.0; wet_bulb_f = 32.0; new_snow_in = 0.0; every counter 0"
      - "rejects a second plan for the same operating_date in the season (ERR_DUPLICATE_CODE)"

  - method: GET
    path: "/mountain-ops/day-plans/{id}"
    description: "Read a day plan with its weather, capacity and admission counters"
    roles: [MountainOpsDirector, SnowmakingSupervisor, GroomingLead, LiftOpsManager, Patroller, GuestServicesAgent]
    code: 200
    input: []
    output: DayPlan
    side_effects: []

  - method: GET
    path: "/mountain-ops/day-plans"
    description: "List day plans of a season"
    roles: [MountainOpsDirector, SnowmakingSupervisor, GroomingLead, LiftOpsManager, Patroller, GuestServicesAgent]
    code: 200
    input: ["season_id?", "operating_date?", "posture?", "limit?", "offset?"]
    output: DayPlan[]
    side_effects: []

  - method: POST
    path: "/mountain-ops/day-plans/{id}/weather"
    description: >-
      Post the mountain weather observation for the day. Above a lift's wind hold threshold this is
      the head of the deepest cascade in the system: lift -> terrain -> grooming and snowmaking ->
      season water ledger.
    roles: [MountainOpsDirector, LiftOpsManager]
    code: 200
    input: ["wind_speed_mph", "wet_bulb_f", "new_snow_in?"]
    output: DayPlan
    side_effects:
      - "wind_speed_mph, wet_bulb_f and new_snow_in stored; weather_updated_at = logical_clock"
      - "every OPEN lift of the season whose wind_hold_threshold_mph is strictly below the reported wind moves to WIND_HOLD, in lift_code ASC order"
      - "each lift entering WIND_HOLD cascades its OPEN terrain areas to PATROL_HOLD in trail_code ASC order; each such area defers its PLANNED and DISPATCHED grooming tasks in sequence_index ASC order and aborts its SCHEDULED, RUNNING and PAUSED sessions in created_at ASC order with abort_reason=TERRAIN_HOLD; each aborted session releases water_af_reserved from SeasonConfig.water_reserved_af"
      - "new_snow_in >= 12.0 additionally nulls mitigation_clearance_expires_at on every avalanche_terrain area of the season and drops those that are OPEN to PATROL_HOLD"
      - "wind_speed_mph >= 60.0 moves posture to WEATHER_HOLD and puts every OPEN or STANDBY lift on WIND_HOLD; a later reading below 60.0 returns posture to PUBLISHED_PARTIAL without releasing any lift"
      - "open_lift_capacity_pph, open_terrain_count, terrain_open_acres, raw_ccc, guest_capacity and non_season_pool recomputed by calculations.day_guest_capacity"
      - "increments DayPlan.version by 1, and the version of every lift, terrain area, grooming task, session and season row it touched"

  - method: POST
    path: "/mountain-ops/day-plans/{id}/publish"
    description: "Publish the day plan; opens the mountain for admission and flips the season to OPERATING on first publish"
    roles: [MountainOpsDirector]
    code: 200
    input: []
    output: DayPlan
    side_effects:
      - "posture = PUBLISHED_PARTIAL; published_at = logical_clock"
      - "capacity fields computed by calculations.day_guest_capacity"
      - "SeasonConfig PRESEASON -> OPERATING on the season's first publish; increments SeasonConfig.version by 1"
      - "increments DayPlan.version by 1"

  - method: POST
    path: "/mountain-ops/day-plans/{id}/close-day"
    description: "Close the operating day, and optionally close the season"
    roles: [MountainOpsDirector]
    code: 200
    input: ["season_final?"]
    output: DayPlan
    side_effects:
      - "posture = DAY_CLOSED; closed_at = logical_clock"
      - "every CONFIRMED, CHECKED_IN and WAITLISTED reservation of the day moves to RELEASED with allocated_stalls zeroed; all admission counters recomputed"
      - "every OPEN or PATROL_HOLD terrain area of the season moves to CLOSED in trail_code ASC order, deferring its PLANNED and DISPATCHED grooming tasks; every OPEN, STANDBY or WIND_HOLD lift moves to CLOSED"
      - "season_final=true additionally moves SeasonConfig to CLOSED, every terrain area to SEASON_CLOSED, every non-terminal grooming task to CANCELLED, every non-terminal session to ABORTED with abort_reason=SEASON_CLOSE and its water released, and every PLANNED or EXECUTED mission to ABORTED"
      - "increments DayPlan.version by 1 and SeasonConfig.version by 1"

  - method: GET
    path: "/mountain-ops/day-plans/{id}/opening-report"
    description: "Terrain opening report for one operating day: what is open, what is openable, and why the rest is not"
    roles: [MountainOpsDirector, SnowmakingSupervisor, GroomingLead, LiftOpsManager, Patroller, GuestServicesAgent]
    code: 200
    input: []
    output: "{ day_plan_id: string, operating_date: string, posture: string, wind_speed_mph: number, wet_bulb_f: number, open_terrain_count: integer, terrain_open_acres: number, openable_acres: number, terrain_open_pct: number, open_lift_capacity_pph: integer, raw_ccc: integer, guest_capacity: integer, non_season_pool: integer, admitted_guest_count: integer, non_season_admitted_count: integer, waitlisted_guest_count: integer, parking_stalls_total: integer, parking_stalls_used: integer, held_area_count: integer, wind_held_lift_count: integer, mech_held_lift_count: integer }"
    side_effects: []

  - method: POST
    path: "/mountain-ops/access-reservations"
    description: >-
      Admit a party for the day through the waterfall allocation. Requires the DayPlan version the
      caller observed, because guest capacity and parking move on every terrain, lift and admission
      change.
    roles: [GuestServicesAgent]
    code: 201
    input: [day_plan_id, party_code, pass_type, party_size, vehicle_count, expected_day_plan_version]
    output: AccessReservation
    side_effects:
      - "state, waitlist_reason and allocated_stalls set by calculations.admission_allocation (CONFIRMED, WAITLISTED with reason PARKING or CAPACITY, or DENIED)"
      - "DayPlan admitted_guest_count, non_season_admitted_count, waitlisted_guest_count and parking_stalls_used recomputed"
      - "rejects a stale expected_day_plan_version with ERR_STALE_DAY_PLAN_VERSION (412); increments DayPlan.version by 1 on success"

  - method: GET
    path: "/mountain-ops/access-reservations/{id}"
    description: "Read one access reservation"
    roles: [MountainOpsDirector, GuestServicesAgent, LiftOpsManager, Patroller, GroomingLead, SnowmakingSupervisor]
    code: 200
    input: []
    output: AccessReservation
    side_effects: []

  - method: GET
    path: "/mountain-ops/day-plans/{id}/access-reservations"
    description: "List the reservations of one day plan, in created_at ASC order — the order the promotion sweep uses"
    roles: [MountainOpsDirector, GuestServicesAgent, LiftOpsManager, Patroller, GroomingLead, SnowmakingSupervisor]
    code: 200
    input: ["state?", "pass_type?", "waitlist_reason?", "limit?", "offset?"]
    output: AccessReservation[]
    side_effects: []

  - method: POST
    path: "/mountain-ops/access-reservations/{id}/check-in"
    description: "Check a confirmed party in at the gate"
    roles: [GuestServicesAgent]
    code: 200
    input: []
    output: AccessReservation
    side_effects:
      - "state = CHECKED_IN; checked_in_at = logical_clock"
      - "increments AccessReservation.version by 1"

  - method: POST
    path: "/mountain-ops/access-reservations/{id}/release"
    description: "Release a reservation and run the waitlist promotion sweep in created_at ASC order"
    roles: [GuestServicesAgent]
    code: 200
    input: []
    output: AccessReservation
    side_effects:
      - "state = RELEASED; released_at = logical_clock; allocated_stalls = 0"
      - "DayPlan counters recomputed, then calculations.waitlist_promotion sweeps the day's WAITLISTED reservations in created_at ASC order, promoting each one that now fits and recomputing the counters after each promotion"
      - "increments AccessReservation.version by 1 and DayPlan.version by 1"

  # -- test-driving surface -------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: >-
      Set the server's logical clock, which every timestamp, expiry and window rule in this scaffold
      reads. Before any call the logical clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall
      back to real wall-clock time.
    roles: [MountainOpsDirector, SnowmakingSupervisor, GroomingLead, LiftOpsManager, Patroller, GuestServicesAgent]
    code: 200
    input: [current_utc]
    output: "{ current_utc: string }"
    side_effects:
      - "the logical clock advances or rewinds to current_utc; no entity row is mutated and no cascade fires"

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, empty, or carrying a role outside the six declared in §1.7"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "The acting role is not permitted for the endpoint, or a Patroller-owned action carries an X-User-ID that is not an existing Patroller id"
  - id: ERR_RECORD_NOT_FOUND
    http: 404
    condition: "Generic fallback for a templated path segment that resolves to no row and has no entity-specific code"
  - id: ERR_SEASON_NOT_FOUND
    http: 404
    condition: "season id in the path or request body does not exist"
  - id: ERR_LIFT_NOT_FOUND
    http: 404
    condition: "lift id in the path or serving_lift_id in the body does not exist"
  - id: ERR_STAFF_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "lift staff assignment id in the path does not exist"
  - id: ERR_TERRAIN_AREA_NOT_FOUND
    http: 404
    condition: "terrain area id in the path or terrain_area_id in the body does not exist"
  - id: ERR_PUMP_HOUSE_NOT_FOUND
    http: 404
    condition: "pump house id in the path or pump_house_id in the body does not exist"
  - id: ERR_SESSION_NOT_FOUND
    http: 404
    condition: "snowmaking session id in the path does not exist"
  - id: ERR_GROOMING_TASK_NOT_FOUND
    http: 404
    condition: "grooming task id in the path does not exist"
  - id: ERR_PATROLLER_NOT_FOUND
    http: 404
    condition: "patroller id in the path, or patroller_id / assigned_terrain_area_id in the body, does not exist"
  - id: ERR_MISSION_NOT_FOUND
    http: 404
    condition: "avalanche mitigation mission id in the path does not exist"
  - id: ERR_INCIDENT_NOT_FOUND
    http: 404
    condition: "patrol incident id in the path does not exist"
  - id: ERR_DAY_PLAN_NOT_FOUND
    http: 404
    condition: "day plan id in the path or day_plan_id in the body does not exist"
  - id: ERR_RESERVATION_NOT_FOUND
    http: 404
    condition: "access reservation id in the path does not exist"
  - id: ERR_CROSS_SEASON_REFERENCE
    http: 422
    condition: "Two foreign keys in one request resolve to rows belonging to different seasons (e.g. a terrain area served by a lift of another season)"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, wrong type, enum value outside its domain, number outside its declared range, or array outside its declared cardinality"
  - id: ERR_WINDOW_INVALID
    http: 422
    condition: "window_start >= window_end, or shift_start >= shift_end"
  - id: ERR_ENERGY_WINDOW_COVERAGE_GAP
    http: 422
    condition: "SeasonConfig.energy_windows do not tile [0,24) exactly — a gap, an overlap, or a set that does not start at 0 and end at 24"
  - id: ERR_WINCH_ANCHOR_REQUIRED
    http: 422
    condition: "GroomingTask declares winch_required=true without a winch_anchor_code"
  - id: ERR_READING_TIMESTAMP_FUTURE
    http: 422
    condition: "SnowDepthReading.measured_at is after the logical clock"
  - id: ERR_DUPLICATE_CODE
    http: 409
    condition: "A scoped-unique code collides: season_label, lift_code, trail_code, pump_house_code, patroller_code, operating_date, party_code, or sequence_index within a cat route"
  - id: ERR_SEASON_NOT_OPERATING
    http: 409
    condition: "SeasonConfig.season_state forbids the operation — CLOSED forbids every write, and opening decisions, publish and admission require OPERATING"
  - id: ERR_TERRAIN_STATE_INVALID
    http: 409
    condition: "TerrainArea.opening_state does not admit the operation (session or grooming work against a PATROL_HOLD or SEASON_CLOSED area, an OPEN decision from a state other than READY or PATROL_HOLD, a park build on a non-PARK class area, mitigation over OPEN terrain)"
  - id: ERR_SESSION_STATE_INVALID
    http: 409
    condition: "The requested target_state is not reachable from the session's current state (e.g. PAUSED from SCHEDULED, or anything from COMPLETED or ABORTED)"
  - id: ERR_LIFT_STATE_INVALID
    http: 409
    condition: "The requested target_status is not reachable from the lift's current service_status (e.g. OPEN from CLOSED, or leaving MECH_HOLD without a passing inspection)"
  - id: ERR_WORKFLOW_STATE_INVALID
    http: 409
    condition: "A grooming task, mitigation mission, patrol incident, staff assignment or access reservation is not in a state that accepts the requested action"
  - id: ERR_DAY_PLAN_NOT_PUBLISHED
    http: 409
    condition: "The season has no active DayPlan, or the active plan's posture blocks the operation (WEATHER_HOLD blocks admission and check-in)"
  - id: ERR_STALE_TERRAIN_AREA_VERSION
    http: 412
    condition: "expected_terrain_area_version does not equal the current TerrainArea.version on a snowmaking session create"
  - id: ERR_STALE_DAY_PLAN_VERSION
    http: 412
    condition: "expected_day_plan_version does not equal the current DayPlan.version on an access reservation create"
  - id: ERR_SOD_VIOLATION
    http: 409
    condition: "Segregation of duties breached: the same X-User-ID both executed and cleared a mitigation mission, or both built and inspected a terrain park"
  - id: ERR_PATROLLER_NOT_ON_DUTY
    http: 422
    condition: "The acting or nominated Patroller has on_duty=false"
  - id: ERR_BLASTER_CERT_REQUIRED
    http: 422
    condition: "A mission with method EXPLOSIVE or GAS_EXPLODER is executed by a patroller without blaster_certified"
  - id: ERR_SKI_CUT_PARTNER_REQUIRED
    http: 422
    condition: "A SKI_CUT mission is executed with no second on-duty AVAILABLE patroller in the season"
  - id: ERR_PATROLLER_CERT_INSUFFICIENT
    http: 422
    condition: "cert_level is below EMT for clearing a mitigation mission or for responding to a SERIOUS or CRITICAL incident"
  - id: ERR_PATROLLER_BUSY
    http: 409
    condition: "The nominated responder is already ON_INCIDENT"
  - id: ERR_BASE_DEPTH_INSUFFICIENT
    http: 422
    condition: "TerrainArea.base_depth_in is below min_open_base_depth_in under the season's base_depth_policy at the moment of the opening decision"
  - id: ERR_GROOM_NOT_CURRENT
    http: 422
    condition: "groom_ready is false, or last_groomed_at is older than SeasonConfig.groom_freshness_hours"
  - id: ERR_MITIGATION_NOT_CURRENT
    http: 422
    condition: "An avalanche_terrain area has no unexpired mitigation clearance"
  - id: ERR_PATROL_STAFFING_INSUFFICIENT
    http: 422
    condition: "assigned_patroller_count is below SeasonConfig.min_patrollers_per_open_area"
  - id: ERR_PARK_NOT_INSPECTED
    http: 422
    condition: "A PARK class area is opened while park_state is not PARK_INSPECTED"
  - id: ERR_PARK_RISK_TOO_HIGH
    http: 422
    condition: "park_risk_score exceeds PARK_RISK_MAX_OPEN (60.0)"
  - id: ERR_SERVING_LIFT_NOT_OPEN
    http: 422
    condition: "The area's serving lift is not in service_status OPEN"
  - id: ERR_LIFT_INSPECTION_EXPIRED
    http: 422
    condition: "The lift's mechanical_status is not INSPECTION_PASSED, or inspection_valid_until is at or before the logical clock"
  - id: ERR_WIND_ABOVE_RELEASE_THRESHOLD
    http: 422
    condition: "A wind hold release is attempted while the reported wind is above wind_hold_threshold_mph - 5.0"
  - id: ERR_WET_BULB_TOO_WARM
    http: 422
    condition: "The active DayPlan wet_bulb_f exceeds 27.0 when starting or resuming a snowmaking session"
  - id: ERR_PUMP_HOUSE_OFFLINE
    http: 422
    condition: "The pump house status is MAINTENANCE"
  - id: ERR_TRANSPORT_MODE_NOT_ALLOWED
    http: 422
    condition: "HELICOPTER ordered below CRITICAL severity, or AMBULANCE ordered below SERIOUS severity"
  - id: ERR_LIFT_OPERATORS_INSUFFICIENT
    http: 422
    condition: "staffed_operator_count is below required_operator_count when opening a lift"
  - id: ERR_LIFT_ROLE_SLOT_CONFLICT
    http: 409
    condition: "A second ASSIGNED staff assignment is created for the same non-LIFTIE_FLOAT role_on_lift on one lift"
  - id: ERR_OPERATOR_DOUBLE_BOOKED
    http: 409
    condition: "The same operator_code holds another ASSIGNED shift within 30 minutes of the requested shift"
  - id: ERR_GROOM_SEQUENCE_VIOLATION
    http: 409
    condition: "A grooming task is dispatched while a lower sequence_index on the same cat_route_code is still PLANNED, DISPATCHED or DEFERRED"
  - id: ERR_SNOWCAT_CONFLICT
    http: 409
    condition: "Another DISPATCHED grooming task with the same snowcat_unit_code overlaps the requested half-open window"
  - id: ERR_PUMP_CAPACITY_EXCEEDED
    http: 422
    condition: "The concurrent gpm sweep on the pump house exceeds PumpHouse.max_gpm on at least one boundary interval"
  - id: ERR_PLANT_CAPACITY_EXCEEDED
    http: 422
    condition: "The plant-wide concurrent gpm sweep exceeds SeasonConfig.plant_max_gpm on at least one boundary interval"
  - id: ERR_WATER_RIGHT_EXCEEDED
    http: 422
    condition: "water_used_af + water_reserved_af + the new reservation exceeds SeasonConfig.water_right_seasonal_af"

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: MountainOpsDirector
    description: "Owns the season configuration, terrain inventory, the daily open/close decision, patrol rostering and the operating day itself"
    identity: opaque
    exclusive_operations:
      - "POST /mountain-ops/seasons"
      - "POST /mountain-ops/terrain-areas"
      - "POST /mountain-ops/terrain-areas/{id}/opening-decision"
      - "POST /mountain-ops/patrollers"
      - "POST /mountain-ops/patrollers/{id}/duty"
      - "POST /mountain-ops/day-plans"
      - "POST /mountain-ops/day-plans/{id}/publish"
      - "POST /mountain-ops/day-plans/{id}/close-day"
      - "POST /mountain-ops/incidents/{id}/dispatch"
    shared_operations:
      - "POST /mountain-ops/lifts (with LiftOpsManager)"
      - "POST /mountain-ops/pump-houses (with SnowmakingSupervisor)"
      - "POST /mountain-ops/terrain-areas/{id}/snow-depth-readings (with GroomingLead, SnowmakingSupervisor, Patroller)"
      - "POST /mountain-ops/mitigation-missions (with Patroller)"
      - "POST /mountain-ops/incidents (with Patroller, GuestServicesAgent, LiftOpsManager)"
      - "POST /mountain-ops/day-plans/{id}/weather (with LiftOpsManager)"
      - "POST /_clock/set_current_utc (with every role)"
      - "every GET endpoint (with every role)"

  - name: SnowmakingSupervisor
    description: "Runs the snowmaking plant: pump houses, session scheduling against water rights, and the wet-bulb-gated run cycle"
    identity: opaque
    exclusive_operations:
      - "POST /mountain-ops/pump-houses/{id}/status"
      - "POST /mountain-ops/snowmaking-sessions"
      - "POST /mountain-ops/snowmaking-sessions/{id}/status"
    shared_operations:
      - "POST /mountain-ops/pump-houses (with MountainOpsDirector)"
      - "POST /mountain-ops/terrain-areas/{id}/snow-depth-readings (with GroomingLead, Patroller, MountainOpsDirector)"
      - "POST /_clock/set_current_utc (with every role)"
      - "every GET endpoint (with every role)"

  - name: GroomingLead
    description: "Plans and dispatches cat routes, closes out grooming coverage, and builds terrain park features"
    identity: opaque
    exclusive_operations:
      - "POST /mountain-ops/grooming-tasks"
      - "POST /mountain-ops/grooming-tasks/{id}/dispatch"
      - "POST /mountain-ops/grooming-tasks/{id}/complete"
    shared_operations:
      - "POST /mountain-ops/terrain-areas/{id}/park-build (with Patroller)"
      - "POST /mountain-ops/terrain-areas/{id}/snow-depth-readings (with SnowmakingSupervisor, Patroller, MountainOpsDirector)"
      - "POST /_clock/set_current_utc (with every role)"
      - "every GET endpoint (with every role)"

  - name: LiftOpsManager
    description: "Owns lift mechanical inspections, service status including wind hold release, and the operator roster"
    identity: opaque
    exclusive_operations:
      - "POST /mountain-ops/lifts/{id}/inspections"
      - "POST /mountain-ops/lifts/{id}/service-status"
      - "POST /mountain-ops/lift-staff-assignments"
      - "POST /mountain-ops/lift-staff-assignments/{id}/release"
    shared_operations:
      - "POST /mountain-ops/lifts (with MountainOpsDirector)"
      - "POST /mountain-ops/day-plans/{id}/weather (with MountainOpsDirector)"
      - "POST /mountain-ops/incidents (with Patroller, GuestServicesAgent, MountainOpsDirector)"
      - "POST /_clock/set_current_utc (with every role)"
      - "every GET endpoint (with every role)"

  - name: Patroller
    description: >-
      Ski patrol. X-User-ID is the acting Patroller row, which is what makes the mitigation
      execute/clear and park build/inspect segregation-of-duties checks decidable.
    identity: "entity_backed:Patroller"
    exclusive_operations:
      - "POST /mountain-ops/mitigation-missions/{id}/execute"
      - "POST /mountain-ops/mitigation-missions/{id}/clear"
      - "POST /mountain-ops/terrain-areas/{id}/park-inspection"
      - "POST /mountain-ops/incidents/{id}/transport"
      - "POST /mountain-ops/incidents/{id}/close"
    shared_operations:
      - "POST /mountain-ops/mitigation-missions (with MountainOpsDirector)"
      - "POST /mountain-ops/terrain-areas/{id}/park-build (with GroomingLead)"
      - "POST /mountain-ops/terrain-areas/{id}/snow-depth-readings (with GroomingLead, SnowmakingSupervisor, MountainOpsDirector)"
      - "POST /mountain-ops/incidents (with GuestServicesAgent, MountainOpsDirector, LiftOpsManager)"
      - "POST /_clock/set_current_utc (with every role)"
      - "every GET endpoint (with every role)"

  - name: GuestServicesAgent
    description: "Sells and manages day access: admission through the waterfall allocation, gate check-in, releases and waitlist promotion"
    identity: opaque
    exclusive_operations:
      - "POST /mountain-ops/access-reservations"
      - "POST /mountain-ops/access-reservations/{id}/check-in"
      - "POST /mountain-ops/access-reservations/{id}/release"
    shared_operations:
      - "POST /mountain-ops/incidents (with Patroller, MountainOpsDirector, LiftOpsManager)"
      - "POST /_clock/set_current_utc (with every role)"
      - "every GET endpoint (with every role)"
