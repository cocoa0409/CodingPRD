            - "Prescription.${rx2}.status == PARTIALLY_FILLED and Prescription.${rx2}.cumulative_dispensed_ml == 400 and Prescription.${rx2}.remaining_ml == 100 and Prescription.${rx2}.waitlist_position == 1"
            - "${avail_after_cycle_1} == 3000 and MilkLot.${l1}.dispensed_ml == 1600 and MilkLot.${l1}.release_status == RELEASED"
            - "${lv2} == ${lv1} + 2 (one version increment per created fill)"
            - "third response: http_status == 200 and the second cycle creates no Dispense"
            - "GET /milk-bank/milk-lots/${l1}/dispenses still returns total_count == 2"
            - "${avail_after_cycle_2} == 3000 and ${lv3} == ${lv2}"
            - "Prescription.${rx2}.remaining_ml == 100 and Prescription.${rx2}.status == PARTIALLY_FILLED after the second cycle"

      - name: milk_lot_available_ml_is_a_computed_read_that_flips_exhausted_and_back
        claim_type: computed_read
        grounds:
          - endpoints[GET /milk-bank/milk-lots/{id}]
          - entities.MilkLot.fields.available_ml
          - state_machines.MilkLot.transitions[RELEASED->EXHAUSTED]
          - state_machines.MilkLot.transitions[EXHAUSTED->RELEASED]
          - endpoints[POST /milk-bank/dispenses/{id}/void]
        distinguishing_aspect: "available_ml is never stored input: it is total_volume_ml minus dispensed_ml on every read, so a 1200 ml fill drives the same lot to available_ml 0 and release_status EXHAUSTED in the response of the fill itself, and voiding that fill puts the lot back to available_ml 1200 / RELEASED while total_volume_ml stays 1200 and the voided Dispense keeps its 5760-cent audit figures."
