            - call: "POST /ptab/petitions/${pat2_pet}/accord-filing-date"
              payload: {}
              as: BoardPanel
            - call: "POST /ptab/petitions/${pat2_pet}/decide-institution"
              payload: { per_ground_scores: [{ claim_number: 1, basis: "ANTICIPATION_102", score: 80 }, { claim_number: 2, basis: "OBVIOUSNESS_103", score: 70 }], lead_judge_user_id: "judge-vlad" }
              as: BoardPanel
