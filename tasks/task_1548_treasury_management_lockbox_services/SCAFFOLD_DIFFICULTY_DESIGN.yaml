            - call: "GET /banks/${b_id}/customers/${c_id}/analysis_cycles"
              payload: {}
              as: BillingSpecialist
              captures: { gross: "$.data[0].gross_service_charges_cents" }
          assert:
            # maintenance=33333, captures=3*7=21, exceptions=2*13=26, images=1*17=17
            # Per-line rounding is identity here (all integers); sum = 33333+21+26+17 = 33397
            - "gross_service_charges_cents == 33397"
            - "${gross} == 33397"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (different entities)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: remittance_batch_capture_out_of_balance_cycle
        grounds:
          - state_machines.RemittanceBatch
          - entities.RemittanceBatch.fields.capture_status
        distinguishing_aspect: |
          RemittanceBatch.capture_status forms a CYCLE: CAPTURING → OUT_OF_BALANCE
          → CAPTURING (operator retries). This is not a linear pipeline — the
          operator can iterate the loop multiple times before balancing. Different
          entity from the TransmissionFormat SUPERSEDED cycle below.
        test_recipe:
          setup:
            - "Bank, customer, agreement, site LIVE, format ACTIVE"
            - "One batch with declared_item_count=1, declared_total_cents=1000"
            - "Batch in CAPTURING, no items yet (declared != captured → balance would fail)"
          setup_api_calls:
            - call: "POST /banks"
              payload: { legal_name: "B", routing_number: "021000089", default_earnings_credit_rate_bp: 100 }
              as: BankOperationsAdmin
              captures: { b_id: $.data.id }
            - call: "POST /banks/${b_id}/customers"
              payload: { legal_name: "C", tax_id: "12-1", deposit_account_number: "DDA" }
              as: TreasuryImplementer
              captures: { c_id: $.data.id }
            - call: "POST /banks/${b_id}/customers/${c_id}/begin_onboarding"
              payload: {}
              as: TreasuryImplementer
            - call: "POST /banks/${b_id}/customers/${c_id}/agreements"
              payload: { agreement_number: "A", monthly_maintenance_fee_cents: 0, per_item_capture_fee_cents: 0, per_exception_decision_fee_cents: 0, per_image_retrieval_fee_cents: 0 }
              as: TreasuryImplementer
              captures: { ag_id: $.data.id, ag_v: $.data.version }
            - call: "POST /banks/${b_id}/customers/${c_id}/agreements/${ag_id}/implement"
              payload: {}
              as: TreasuryImplementer
              as_user_id: "impl-1"
            - call: "POST /banks/${b_id}/customers/${c_id}/agreements/${ag_id}/activate"
              payload: { expected_agreement_version: "${ag_v} + 1" }
              as: TreasuryActivator
              as_user_id: "act-1"
            - call: "POST /banks/${b_id}/customers/${c_id}/agreements/${ag_id}/transmission_formats"
              payload: { format_kind: "BAI2", version_label: "v1" }
              as: TreasuryImplementer
              captures: { fmt_id: $.data.id }
            - call: "POST /banks/${b_id}/customers/${c_id}/agreements/${ag_id}/transmission_formats/${fmt_id}/activate"
              payload: { expected_agreement_version: "${ag_v} + 2" }
              as: TreasuryActivator
              as_user_id: "act-1"
            - call: "POST /banks/${b_id}/customers/${c_id}/agreements/${ag_id}/sites"
              payload: { site_code: "S", postal_box_address: "PO", daily_cutoff_time_local: "14:00", timezone: "America/Chicago" }
              as: TreasuryImplementer
              captures: { s_id: $.data.id }
            - call: "POST /banks/${b_id}/customers/${c_id}/agreements/${ag_id}/sites/${s_id}/availability_schedules"
              payload: { routing_number_pattern: "0710", tier: "SAME_DAY", effective_from: "2026-08-01", priority: 1 }
              as: TreasuryImplementer
            - call: "POST /banks/${b_id}/customers/${c_id}/agreements/${ag_id}/sites/${s_id}/go_live"
              payload: {}
              as: TreasuryActivator
              as_user_id: "act-1"
            - call: "POST /banks/${b_id}/customers/${c_id}/agreements/${ag_id}/sites/${s_id}/batches"
              payload: { batch_reference: "B1", received_at: "2026-08-01T13:00:00Z", declared_item_count: 1, declared_total_cents: 1000 }
              as: LockboxOperator
              captures: { ba_id: $.data.id }
            - call: "POST /banks/${b_id}/customers/${c_id}/agreements/${ag_id}/sites/${s_id}/batches/${ba_id}/begin_capture"
              payload: {}
              as: LockboxOperator
              as_user_id: "lock-1"
          trigger:
            # Loop 1: force OUT_OF_BALANCE, then resume, then add item, then balance OK
            - call: "POST /banks/${b_id}/customers/${c_id}/agreements/${ag_id}/sites/${s_id}/batches/${ba_id}/force_out_of_balance"
              payload: {}
              as: LockboxOperator
              captures: { st1: $.data.capture_status }
            - call: "POST /banks/${b_id}/customers/${c_id}/agreements/${ag_id}/sites/${s_id}/batches/${ba_id}/resume_capture"
              payload: {}
              as: LockboxOperator
              captures: { st2: $.data.capture_status }
            - call: "POST /banks/${b_id}/customers/${c_id}/agreements/${ag_id}/sites/${s_id}/batches/${ba_id}/items"
              payload: { check_number: "1", payer_routing_number: "0710002880", amount_cents: 1000, payee_name: "C" }
              as: LockboxOperator
              captures: { it: $.data.id }
            - call: "POST /banks/${b_id}/customers/${c_id}/agreements/${ag_id}/sites/${s_id}/batches/${ba_id}/items/${it}/accept"
              payload: {}
              as: LockboxOperator
            - call: "POST /banks/${b_id}/customers/${c_id}/agreements/${ag_id}/sites/${s_id}/batches/${ba_id}/balance"
              payload: {}
              as: LockboxOperator
              captures: { st3: $.data.capture_status }
          assert:
            - "${st1} == 'OUT_OF_BALANCE'"
            - "${st2} == 'CAPTURING'  # cycle OUT_OF_BALANCE → CAPTURING completed"
            - "${st3} == 'BALANCED'  # after adding matching item, balance succeeds"

      - name: transmission_format_supersede_chain
        grounds:
          - state_machines.TransmissionFormat
          - entities.TransmissionFormat.fields.supersedes_format_id
        distinguishing_aspect: |
          TransmissionFormat.status has a non-linear shape on a DIFFERENT entity
          (TransmissionFormat vs RemittanceBatch): F1 ACTIVE → SUPERSEDED (via
          cascade when F2 with supersedes_format_id=F1 is activated) and then
          SUPERSEDED → RETIRED. The supersede cascade is triggered by a separate
          activation, not by F1's own action.
        test_recipe:
          setup:
            - "Bank, customer, ACTIVE agreement; transmission format F1 ACTIVE"
            - "A second format F2 in DRAFT with supersedes_format_id=F1"
          setup_api_calls:
            - call: "POST /banks"
              payload: { legal_name: "B", routing_number: "021000089", default_earnings_credit_rate_bp: 100 }
              as: BankOperationsAdmin
              captures: { b_id: $.data.id }
            - call: "POST /banks/${b_id}/customers"
              payload: { legal_name: "C", tax_id: "12-1", deposit_account_number: "DDA" }
              as: TreasuryImplementer
              captures: { c_id: $.data.id }
            - call: "POST /banks/${b_id}/customers/${c_id}/begin_onboarding"
              payload: {}
              as: TreasuryImplementer
            - call: "POST /banks/${b_id}/customers/${c_id}/agreements"
              payload: { agreement_number: "A", monthly_maintenance_fee_cents: 0, per_item_capture_fee_cents: 0, per_exception_decision_fee_cents: 0, per_image_retrieval_fee_cents: 0 }
              as: TreasuryImplementer
              captures: { ag_id: $.data.id, ag_v: $.data.version }
            - call: "POST /banks/${b_id}/customers/${c_id}/agreements/${ag_id}/implement"
              payload: {}
              as: TreasuryImplementer
              as_user_id: "impl-1"
            - call: "POST /banks/${b_id}/customers/${c_id}/agreements/${ag_id}/activate"
              payload: { expected_agreement_version: "${ag_v} + 1" }
              as: TreasuryActivator
              as_user_id: "act-1"
            - call: "POST /banks/${b_id}/customers/${c_id}/agreements/${ag_id}/transmission_formats"
              payload: { format_kind: "BAI2", version_label: "v1" }
              as: TreasuryImplementer
              captures: { f1_id: $.data.id }
            - call: "POST /banks/${b_id}/customers/${c_id}/agreements/${ag_id}/transmission_formats/${f1_id}/activate"
              payload: { expected_agreement_version: "${ag_v} + 2" }
              as: TreasuryActivator
              as_user_id: "act-1"
            - call: "POST /banks/${b_id}/customers/${c_id}/agreements/${ag_id}/transmission_formats"
              payload: { format_kind: "EDI820", version_label: "v2", supersedes_format_id: "${f1_id}" }
              as: TreasuryImplementer
              captures: { f2_id: $.data.id }
          trigger:
            - call: "POST /banks/${b_id}/customers/${c_id}/agreements/${ag_id}/transmission_formats/${f2_id}/activate"
              payload: { expected_agreement_version: "${ag_v} + 3" }
              as: TreasuryActivator
              as_user_id: "act-1"
            - call: "GET /banks/${b_id}/customers/${c_id}/agreements/${ag_id}/transmission_formats/${f1_id}"
              payload: {}
              as: TreasuryActivator
              captures: { f1_status: $.data.status }
            - call: "GET /banks/${b_id}/customers/${c_id}/agreements/${ag_id}/transmission_formats/${f2_id}"
              payload: {}
              as: TreasuryActivator
              captures: { f2_status: $.data.status }
          assert:
            - "${f1_status} == 'SUPERSEDED'  # cascade from F2 activation"
            - "${f2_status} == 'ACTIVE'"

  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade (different triggers; one depth>=3, one depth>=2)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: bank_suspend_cascades_to_batch_held_depth3
        grounds:
          - state_machines.Bank.OPERATING_to_SUSPENDED
          - state_machines.LockboxSite.LIVE_to_SUSPENDED
          - state_machines.RemittanceBatch
        distinguishing_aspect: |
          Depth-3 cascade: POST /banks/{id}/suspend mutates Bank.posture (link 1);
          that mutation itself triggers LockboxSite LIVE→SUSPENDED on every LIVE
          site (link 2); that site mutation in turn triggers RemittanceBatch
          batch_status OPEN→HELD on every non-terminal batch under the site
          (link 3). Distinct trigger from the customer-suspend cascade below.
        test_recipe:
          setup:
            - "Bank B OPERATING; Customer C ACTIVE; Agreement A ACTIVE; Site S LIVE"
            - "Batch BA capture_status=CAPTURING, batch_status=OPEN"
          setup_api_calls:
            - call: "POST /banks"
              payload: { legal_name: "B", routing_number: "021000089", default_earnings_credit_rate_bp: 100 }
              as: BankOperationsAdmin
              captures: { b_id: $.data.id }
            - call: "POST /banks/${b_id}/customers"
              payload: { legal_name: "C", tax_id: "12-1", deposit_account_number: "DDA" }
