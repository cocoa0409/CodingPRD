            - "${cancel_err}, ${checkout_err} and ${return_err} are all ERR_INVALID_STATE_TRANSITION with HTTP 409"
            - "Reservation.${r_id}.status is still SETTLED with deposit_forfeited_cents 0, deposit_refunded_cents 12962 and cancellation_reason null"
            - "No DamageAssessment row exists for reservation ${r_id} — the post-settlement return created nothing"
            - "Producer.${p_id}.deposit_held_cents == 0 and suspension_points == 0"

      - name: corner_funding_period_starts_in_draft
        claim_type: initial_state
        grounds:
          - state_machines.FundingPeriod.initial_state
          - entities.FundingPeriod.fields.report_status
          - entities.FundingPeriod.fields.revision_round
        distinguishing_aspect: "A newly created FundingPeriod is in report_status DRAFT with revision_round 0 and no allocation figures decided yet — submitted_by_user_id, decided_by_user_id and decision_reason are all null."
        test_recipe:
          setup:
            - "Empty database; no funding period exists for fiscal_year 2026."
          setup_api_calls: []
          trigger:
            - call: "POST /funding-periods"
              payload: {fiscal_year: 2026, quarter: 1, basis: "ACCRUAL", gross_franchise_fee_cents: 2000000, service_period_earned_cents: 1900000, remittance_received_cents: 1850000, capital_grant_cents: 0}
              as: FinanceOfficer
              as_user_id: "fin-1"
              captures: {fp_id: $.data.id, fp_status: $.data.report_status, fp_round: $.data.revision_round}
          assert:
            - "${fp_status} == DRAFT (the declared initial_state) and ${fp_round} == 0"
            - "FundingPeriod.${fp_id}.submitted_by_user_id == null, decided_by_user_id == null and decision_reason == null"
            - "FundingPeriod.${fp_id}.basis == ACCRUAL, fiscal_year == 2026 and quarter == 1"
            - "FundingPeriod.${fp_id}.version == 1"

      - name: corner_grade_before_attendance_returns_invalid_state
