      - name: retention_sweep_on_empty_portal_returns_zero_counts
        claim_type: bulk_action
        grounds:
          - endpoints[POST /neighborhood-safety/retention-sweeps]
          - endpoints[POST /_clock/set_current_utc]
        distinguishing_aspect: "The sweep is a legal no-op: run against a portal with no solicitations or clips at all it returns 200 with every one of its four counters at 0 and run_at_utc echoing the logical clock, and a second run at the same instant returns the same zeroes rather than an error."
        test_recipe:
          setup:
            - "Empty portal; the clock is pinned at 2026-08-12T00:00:00Z. Two residents exist so the request touches a non-empty database without any sweepable rows."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { clock_now: "$.data.current_utc", reset_count: "$.data.residents_daily_counter_reset_count" }
            - call: "POST /neighborhood-safety/residents"
              payload: { display_name: "R1", email: "r1@example.test", home_x_m: 0, home_y_m: 10, alert_radius_m: 0 }
              as: Anonymous
              captures: { r1_id: "$.data.id" }
            - call: "POST /neighborhood-safety/residents"
              payload: { display_name: "R2", email: "r2@example.test", home_x_m: 0, home_y_m: 20, alert_radius_m: 0 }
              as: Anonymous
              captures: { r2_id: "$.data.id" }
          trigger:
            - call: "POST /neighborhood-safety/retention-sweeps"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { s1_at: "$.data.run_at_utc", s1_exp: "$.data.solicitations_expired_count", s1_purged: "$.data.clips_purged_count", s1_held: "$.data.clips_held_count", s1_closed: "$.data.requests_auto_closed_count" }
            - call: "POST /neighborhood-safety/retention-sweeps"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { s2_at: "$.data.run_at_utc", s2_exp: "$.data.solicitations_expired_count", s2_purged: "$.data.clips_purged_count", s2_held: "$.data.clips_held_count", s2_closed: "$.data.requests_auto_closed_count" }
          assert:
            - "${clock_now} == 2026-08-12T00:00:00Z and ${reset_count} == 0"
