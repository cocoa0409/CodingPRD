            - call: "POST /credit-attempts"
              payload: { project_id: "${p_id}", credit_library_entry_id: "${e_d}", phase: "DESIGN", documentation_owner_id: "${m_spec}" }
              as: ProjectAdministrator
              as_user_id: "${m_admin}"
