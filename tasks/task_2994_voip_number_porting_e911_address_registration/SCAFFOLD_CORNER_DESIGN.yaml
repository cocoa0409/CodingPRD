            - "GET /voip/temporary-bridges?port_request_id=${pr_id} returns total_count 1 with id '${br_id}'"

      - name: block_census_read_counts_parked_numbers_apart_from_available
        claim_type: computed_read
        grounds:
          - calculations.number_inventory_census
          - endpoints[GET /voip/number-blocks/{id}]
          - endpoints[POST /voip/phone-numbers/{id}/release]
        distinguishing_aspect: "After a release the number is PARKED, not AVAILABLE: the census read reports minted_count 2, available_count 1, assigned_count 0 and parked_count 1, so a parked number is excluded from the pool it will only rejoin after reclamation."
        test_recipe:
