        distinguishing_aspect: "The cascade is conditioned on the child's status: only the ACTIVE assignment becomes SUSPENDED_BY_CUSTOMER while the already-REVOKED one is left in its terminal state, so the inventory count goes 1 -> 0 rather than resurrecting the revoked row."
        test_recipe:
          setup:
            - "Provider with a VERIFIED, ENABLED customer holding one ACTIVE and one REVOKED assignment"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-07T00:00:00Z" }
              as: Regulator
            - call: "POST /rmd/providers"
              payload: { legal_name: "Conditional Cascade Voice", provider_type: "FACILITIES_BASED" }
              as: Regulator
