  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_table_version_on_assign
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[assign-table-stale-table]", "errors[ERR_STALE_VERSION]", "state_machines.SeatTable.AVAILABLE_to_HELD"]
        distinguishing_aspect: "assign-table with a stale expected_table_version (one below the table's current version after the server-assign bumped it) returns ERR_STALE_VERSION 412."
        test_recipe:
          setup: ["TABLE show ON_SALE; table T1 with a server assigned (table version advanced past 1); a BOOKED reservation."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "OCC Venue", settlement_currency: "USD" }
              as: Booker
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/shows"
              payload: { title: "OCC Night", starts_at: "2026-05-28T03:00:00Z", ends_at: "2026-05-28T05:00:00Z" }
              as: Booker
              captures: { show_id: $.data.id }
            - call: "POST /venues/${venue_id}/shows/${show_id}/sections"
              payload: { kind: "TABLE", label: "Floor" }
              as: Booker
              captures: { section_id: $.data.id }
            - call: "POST /venues/${venue_id}/shows/${show_id}/sections/${section_id}/tables"
              payload: { table_number: "T1", seats: 4 }
              as: FloorManager
              captures: { table_id: $.data.id }
            - call: "POST /venues/${venue_id}/shows/${show_id}/tiers"
              payload: { section_id: "${section_id}", name: "Table", price_cents: 4500 }
              as: Booker
              captures: { tier_id: $.data.id }
            - call: "POST /servers"
              payload: { name: "Mae", max_tables: 4 }
              as: FloorManager
              captures: { server_id: $.data.id }
            - call: "POST /tables/${table_id}/assign-server"
              payload: { server_id: "${server_id}" }
              as: FloorManager
              captures: { tbl_v: $.data.version }
            - call: "POST /venues/${venue_id}/shows/${show_id}/publish"
              payload: {}
              as: Booker
            - call: "POST /reservations"
              payload: { show_id: "${show_id}", section_id: "${section_id}", tier_id: "${tier_id}", patron_id: "patron-oc", party_size: 2 }
              as: BoxOffice
              captures: { res_id: $.data.id }
          trigger:
            - call: "POST /reservations/${res_id}/assign-table"
              payload: { table_id: "${table_id}", expected_table_version: "${tbl_v} - 1" }
              as: FloorManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_VERSION"
            - "http status == 412"

      - name: occ_stale_slot_version_on_sign
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[signoff-stale-slot]", "errors[ERR_STALE_VERSION]", "state_machines.LineupSlot.OFFERED_to_SIGNED"]
        distinguishing_aspect: "Signing a LineupSlot with a stale expected_lineup_slot_version (one below the version after a counter bumped it) returns ERR_STALE_VERSION 412."
        test_recipe:
          setup: ["An OFFERED slot read at version V; a performer counter bumps it to V+1; sign carries V (stale)."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "OCCslot Venue", settlement_currency: "USD" }
              as: Booker
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/shows"
              payload: { title: "OCCslot Night", starts_at: "2026-05-29T03:00:00Z", ends_at: "2026-05-29T05:00:00Z" }
              as: Booker
              captures: { show_id: $.data.id }
            - call: "POST /performers"
              payload: { stage_name: "Sign Me", email: "sign@x.com", standard_fee_cents: 25000 }
              as: Booker
              captures: { perf_id: $.data.id }
            - call: "POST /lineup-slots"
              payload: { show_id: "${show_id}", performer_id: "${perf_id}", slot_order: 1, role: "OPENER", offered_fee_cents: 25000 }
              as: Booker
              captures: { slot_id: $.data.id, slot_v: $.data.version }
            - call: "POST /lineup-slots/${slot_id}/counter"
              payload: { counter_fee_cents: 27000 }
              as: Performer
              as_user_id: "${perf_id}"
          trigger:
            - call: "POST /lineup-slots/${slot_id}/sign"
              payload: { expected_lineup_slot_version: "${slot_v}" }
              as: Booker
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_VERSION (slot_v is now stale after the counter)"
            - "http status == 412"

      - name: occ_version_increments_on_sign
        claim_type: optimistic_concurrency
        grounds: ["endpoints", "entities.LineupSlot.fields.version", "state_machines.LineupSlot.OFFERED_to_SIGNED"]
        distinguishing_aspect: "Signing with the correct expected_lineup_slot_version succeeds, freezes agreed_fee_cents to offered_fee_cents (25000), and increments LineupSlot.version by 1."
        test_recipe:
          setup: ["An OFFERED slot offered_fee_cents 25000 read at its current version."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "SignOK Venue", settlement_currency: "USD" }
              as: Booker
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/shows"
              payload: { title: "SignOK Night", starts_at: "2026-05-30T03:00:00Z", ends_at: "2026-05-30T05:00:00Z" }
              as: Booker
              captures: { show_id: $.data.id }
            - call: "POST /performers"
              payload: { stage_name: "Will Sign", email: "will@x.com", standard_fee_cents: 25000 }
              as: Booker
              captures: { perf_id: $.data.id }
            - call: "POST /lineup-slots"
              payload: { show_id: "${show_id}", performer_id: "${perf_id}", slot_order: 1, role: "OPENER", offered_fee_cents: 25000 }
              as: Booker
              captures: { slot_id: $.data.id, slot_v: $.data.version }
          trigger:
            - call: "POST /lineup-slots/${slot_id}/sign"
              payload: { expected_lineup_slot_version: "${slot_v}" }
              as: Booker
              captures: { cs: $.data.contract_status, agreed: $.data.agreed_fee_cents, nv: $.data.version }
          assert:
            - "LineupSlot.${slot_id}.contract_status == SIGNED"
            - "LineupSlot.${slot_id}.agreed_fee_cents == 25000"
            - "LineupSlot.${slot_id}.version == 2"

      - name: show_cancel_cascade_already_in_18
        claim_type: cascading_side_effects
        grounds: ["state_machines.Show.ON_SALE_to_CANCELLED"]
        excluded_because:
          difficulty_instance: transitive_cascade / show_cancel_cascade_depth3_to_server
          rationale: "The multi-level show-cancel cascade is the named §1.8 transitive-cascade instance."

