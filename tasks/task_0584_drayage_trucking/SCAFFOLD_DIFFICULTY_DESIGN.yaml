        distinguishing_aspect: "Strict '>' boundary on demurrage day count: pickup exactly on LFD (2026-05-10) accrues 0 cents; pickup one day after (2026-05-11) accrues 13438; metric = demurrage days via POST /legs/{id}/dispatch."
