    description: "List CurbRules, optionally filtered by territory or status"
    roles: [FleetOperations, DepotTechnician, RemoteAssistanceOperator, TerritoryPlanner, SafetyReviewer, MappingEngineer]
    code: 200
    input: ["territory_id?", "status?", "limit?", "offset?"]
    output: CurbRule[]
    side_effects: []
  - method: GET
    path: "/fleet/roadside-cases"
    description: "List RoadsideCases, optionally filtered by territory, vehicle, originating session or assigned team"
    roles: [FleetOperations, DepotTechnician, RemoteAssistanceOperator, TerritoryPlanner, SafetyReviewer, MappingEngineer]
    code: 200
    input: ["territory_id?", "vehicle_id?", "assistance_session_id?", "team_id?", "status?", "limit?", "offset?"]
    output: RoadsideCase[]
    side_effects: []
  - method: GET
    path: "/fleet/roadside-teams"
    description: "List RoadsideTeams, optionally filtered by territory, status or road class"
    roles: [FleetOperations, DepotTechnician, RemoteAssistanceOperator, TerritoryPlanner, SafetyReviewer, MappingEngineer]
    code: 200
    input: ["territory_id?", "status?", "road_class?", "limit?", "offset?"]
    output: RoadsideTeam[]
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or malformed X-User-Role / X-User-ID headers"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Calling role is not permitted for this operation"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path resource does not exist (validated left-to-right)"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body, missing required field, or wrong field type"
  - id: ERR_DUPLICATE_RESOURCE
    http: 409
    condition: "Unique key collision on (territory_id, vin) or (territory_id, idempotency_key)"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_*_version does not match the parent entity's current version"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Requested transition is not valid from the resource's current state"
  - id: ERR_ROUTE_NOT_ALLOWED
    http: 422
    condition: "Route class is outside the approved operational design domain"
  - id: ERR_EXCLUSION_ZONE_ACTIVE
    http: 422
    condition: "An ACTIVE ExclusionZone covers the requested route class at the reference time"
  - id: ERR_WEATHER_SUSPENDED
    http: 422
    condition: "Weather tier is 3 or higher for a peak wave window"
  - id: ERR_CURB_ACCESS_DENIED
    http: 422
    condition: "Curb access class is not permitted for the ride's sub_service_type"
  - id: ERR_LOCATION_INVALID
    http: 422
    condition: "Pickup or dropoff location is no longer valid (is_valid == false)"
  - id: ERR_VEHICLE_IN_CYCLE
    http: 409
    condition: "Vehicle already has a DepotCycle in STAGED or IN_PROGRESS"
  - id: ERR_VEHICLE_NOT_SERVICE_READY
    http: 409
    condition: "Vehicle fails one or more readiness predicates (battery, cleanliness, calibration, software)"
  - id: ERR_VEHICLE_ROADSIDE_BLOCKED
    http: 409
    condition: "Vehicle is blocked by a RoadsideCase in RESPONSE_DISPATCHED"
  - id: ERR_VEHICLE_HAS_ACTIVE_CYCLE
    http: 409
    condition: "Vehicle has a DepotCycle IN_PROGRESS; it cannot be suspended"
  - id: ERR_BAY_SLOT_CONFLICT
    http: 409
    condition: "Requested bay window intersects a RESERVED or ACTIVE slot on the same bay"
  - id: ERR_CAPACITY_EXCEEDED
    http: 409
    condition: "Depot bay pool or wave budget would be exceeded"
  - id: ERR_POSTURE_LOCKDOWN
    http: 409
    condition: "Depot is in LOCKDOWN; cycle start is blocked"
  - id: ERR_TERRITORY_NOT_ACTIVE
    http: 409
    condition: "Territory is not ACTIVE; wave activation or ride matching is blocked"
  - id: ERR_ZONE_BLOCKED_WAVE
    http: 409
    condition: "Territory has one or more ACTIVE exclusion zones; wave activation is blocked"
  - id: ERR_NO_VEHICLE_AVAILABLE
    http: 409
    condition: "The §1.3 vehicle selector found no candidate in the territory"
  - id: ERR_NO_TEAM_AVAILABLE
    http: 409
    condition: "The §1.3 roadside selector found no AVAILABLE team for the case's road class"
  - id: ERR_TEAM_CAPACITY_EXCEEDED
    http: 409
    condition: "The selected RoadsideTeam already has 2 cases in RESPONSE_DISPATCHED"
  - id: ERR_RESPONSE_SLA_BREACHED
    http: 409
    condition: "RoadsideCase has been OPEN for 4 or more territory ops runs without dispatch"
  - id: ERR_CALIBRATION_SIGNOFF_REQUIRED
    http: 400
    condition: "CALIBRATION cycle completion without signed_off == true"
  - id: ERR_MAX_ATTEMPTS_NOT_REACHED
    http: 409
    condition: "escalate-unresolved attempted with attempt_count < 3"
  - id: ERR_SESSION_TERMINAL
    http: 409
    condition: "Incident filing attempted when no AssistanceSession for the ride is ESCALATED or ACKNOWLEDGED"
  - id: ERR_CROSS_TERRITORY
    http: 409
    condition: "Referenced resource belongs to a different territory than the one in the path"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: FleetOperations
    description: "Fleet and ride operations desk: registers vehicles, stages them, matches and advances rides, clears roadside cases and manages response teams."
    identity: opaque
    exclusive_operations:
      - "POST /fleet/territories/{territoryId}/vehicles"
      - "POST /fleet/vehicles/{vehicleId}/return-to-service"
      - "POST /fleet/territories/{territoryId}/ride-requests"
      - "POST /fleet/territories/{territoryId}/ride-requests/{rideId}/match"
      - "POST /fleet/territories/{territoryId}/ride-requests/{rideId}/pickup"
      - "POST /fleet/territories/{territoryId}/ride-requests/{rideId}/complete"
      - "POST /fleet/territories/{territoryId}/ride-requests/{rideId}/cancel"
      - "POST /fleet/territories/{territoryId}/ride-requests/{rideId}/cancel-no-show"
      - "POST /fleet/territories/{territoryId}/roadside-teams"
      - "POST /fleet/territories/{territoryId}/roadside-teams/{teamId}/mark-off-shift"
      - "POST /fleet/roadside-cases/{caseId}/dispatch"
      - "POST /fleet/roadside-cases/{caseId}/clear"
      - "POST /fleet/roadside-cases/{caseId}/cancel"
    shared_operations:
      - "GET reads across /fleet/*"
      - "POST /fleet/vehicles/{vehicleId}/stage"
      - "POST /fleet/vehicles/{vehicleId}/roadside-cases"
      - "POST /fleet/territories/{territoryId}/ride-requests/{rideId}/assistance-sessions"

  - name: DepotTechnician
    description: "Depot bay operator: reserves bays, runs vehicle service cycles, and executes the depot operations checkpoint."
    identity: opaque
    exclusive_operations:
      - "POST /fleet/depots/{depotId}/bay-slots"
      - "POST /fleet/depots/{depotId}/bay-slots/{baySlotId}/release"
      - "POST /fleet/depots/{depotId}/cycles"
      - "POST /fleet/depots/{depotId}/cycles/{cycleId}/schedule"
      - "POST /fleet/depots/{depotId}/cycles/{cycleId}/start"
      - "POST /fleet/depots/{depotId}/cycles/{cycleId}/complete"
      - "POST /fleet/depots/{depotId}/cycles/{cycleId}/abort"
      - "POST /fleet/depots/{depotId}/run-depot-ops"
    shared_operations:
      - "GET reads across /fleet/*"
      - "POST /fleet/vehicles/{vehicleId}/stage"

  - name: RemoteAssistanceOperator
    description: "Remote assistance desk: acknowledges, resolves and escalates vehicle assistance sessions, opens roadside cases and files incident reports."
    identity: opaque
    exclusive_operations:
      - "POST /fleet/assistance-sessions/{sessionId}/acknowledge"
      - "POST /fleet/assistance-sessions/{sessionId}/resolve"
      - "POST /fleet/assistance-sessions/{sessionId}/escalate-unresolved"
    shared_operations:
      - "GET reads across /fleet/*"
      - "POST /fleet/territories/{territoryId}/ride-requests/{rideId}/assistance-sessions"
      - "POST /fleet/vehicles/{vehicleId}/roadside-cases"
      - "POST /fleet/ride-requests/{rideId}/film-incident"

  - name: TerritoryPlanner
    description: "Territory operations planner: creates territories and depots, plans and dispatches deployment waves, and submits service-area expansion requests."
    identity: opaque
    exclusive_operations:
      - "POST /fleet/territories"
      - "POST /fleet/territories/{territoryId}/depots"
      - "POST /fleet/territories/{territoryId}/demand-signals"
      - "POST /fleet/territories/{territoryId}/deployment-waves"
      - "POST /fleet/territories/{territoryId}/deployment-waves/{waveId}/activate"
      - "POST /fleet/territories/{territoryId}/deployment-waves/{waveId}/dispatch"
      - "POST /fleet/territories/{territoryId}/deployment-waves/{waveId}/abort"
      - "POST /fleet/territories/{territoryId}/expansion-requests"
    shared_operations:
      - "GET reads across /fleet/*"

  - name: SafetyReviewer
    description: "Safety and compliance reviewer: approves ODD rules, activates exclusion zones, adjudicates incident reports, approves expansions and suspends vehicles."
    identity: opaque
    exclusive_operations:
      - "POST /fleet/territories/{territoryId}/area-rules/{ruleId}/approve"
      - "POST /fleet/territories/{territoryId}/exclusion-zones/{zoneId}/activate"
      - "POST /fleet/expansion-requests/{expansionId}/approve"
      - "POST /fleet/expansion-requests/{expansionId}/reject"
      - "POST /fleet/incident-reports/{incidentId}/begin-review"
      - "POST /fleet/incident-reports/{incidentId}/close"
      - "POST /fleet/incident-reports/{incidentId}/void"
      - "POST /fleet/vehicles/{vehicleId}/suspend"
      - "POST /fleet/vehicles/{vehicleId}/clear-suspension"
      - "POST /fleet/territories/{territoryId}/curb-rules"
    shared_operations:
      - "GET reads across /fleet/*"
      - "POST /fleet/territories/{territoryId}/exclusion-zones"
      - "POST /fleet/territories/{territoryId}/validation-runs"
      - "POST /fleet/ride-requests/{rideId}/film-incident"

  - name: MappingEngineer
    description: "HD-mapping and ODD engineer: logs mapping ticks and validation runs, drafts area rules, maintains curb data, and completes expansion mapping gates."
    identity: opaque
    exclusive_operations:
      - "POST /fleet/territories/{territoryId}/mapping-ticks"
      - "POST /fleet/territories/{territoryId}/area-rules"
      - "POST /fleet/territories/{territoryId}/pickup-locations"
      - "POST /fleet/expansion-requests/{expansionId}/mapping-complete"
    shared_operations:
      - "GET reads across /fleet/*"
      - "POST /fleet/territories/{territoryId}/validation-runs"
      - "POST /fleet/territories/{territoryId}/exclusion-zones"