# =============================================================================
# §1.9 SCAFFOLD CORNER DESIGN — task_2540 Precision Optics Manufacturing
# -----------------------------------------------------------------------------
# Behavioural-claim coverage over the nine required sections. Every instance is
# reproducible from an empty database using only §1.5 endpoints and the logical
# clock; no instance waits on wall-clock time. Instances whose corner is already
# proved by a §1.8 difficulty instance carry `excluded_because` instead of a
# `test_recipe` and cite that instance by name.
#
# Conventions used throughout:
#   * The logical clock starts at 2026-08-01T00:00:00Z and only moves via
#     POST /_clock/set_current_utc (conventions.logical_clock).
#   * 00000000-0000-0000-0000-000000000000 is used as the never-stored UUID.
#   * Every formula-derived expected value below is pre-computed to the
#     rounding declared in the owning §1.3 calculation.
# =============================================================================
scaffold_corner_design:

  # =======================================================================
  - section: entities
    instances:

      - name: optical_design_create_echoes_every_supplied_field_and_mints_the_system_fields
        claim_type: creation
        grounds:
          - entities.OpticalDesign
          - endpoints.POST_/optics/optical-designs
          - endpoints.GET_/optics/optical-designs/{id}
          - state_machines.OpticalDesign.initial_state
          - response_envelope.success
        distinguishing_aspect: |
          A create that supplies all sixteen §1.5 input fields must store every one of them verbatim and
          must additionally mint design_status DRAFT, tolerance_verdict PENDING, design_revision 1,
          supersedes_design_id null, the four null stack outputs and the four common fields; the
          immediately following GET returns the same row, so nothing is computed lazily at read time.
        test_recipe:
          setup:
            - "Empty database."
            - "Logical clock at its start value 2026-08-01T00:00:00Z (conventions.logical_clock)."
            - "The payload deliberately overrides every one of the nine defaulted fields so that a server that silently applies a default instead of the supplied value is caught."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
          trigger:
            - call: "POST /optics/optical-designs"
              payload: { design_code: "OD-2540-FULL", aperture_mm: 120.0, wavelength_min_nm: 450, wavelength_max_nm: 700, required_rms_wavefront_waves: 0.0400, tolerance_budget_waves: 0.0800, transmitted_wavefront_budget_waves: 0.1050, surface_figure_budget_waves: 0.0300, surface_roughness_budget_nm: 0.9000, min_center_thickness_um: 6000.0, min_index_homogeneity_grade: "H2", max_striae_grade: "A", scratch_dig_scratch_limit: 20, scratch_dig_dig_limit: 10, cleanliness_limit_per_cm2: 30, tolerance_method: "WORST_CASE" }
              as: OpticsEngineer
              captures: { d1: $.data.id }
            - call: "GET /optics/optical-designs/${d1}"
              payload: {}
              as: OpticsEngineer
          assert:
            - "the create returns HTTP 201"
            - "OpticalDesign.${d1}.design_code == OD-2540-FULL"
            - "OpticalDesign.${d1}.surface_figure_budget_waves == 0.0300 (the supplied value, not the 0.025 default)"
            - "OpticalDesign.${d1}.surface_roughness_budget_nm == 0.9000"
            - "OpticalDesign.${d1}.min_center_thickness_um == 6000.0"
            - "OpticalDesign.${d1}.min_index_homogeneity_grade == H2"
            - "OpticalDesign.${d1}.max_striae_grade == A"
            - "OpticalDesign.${d1}.scratch_dig_scratch_limit == 20"
            - "OpticalDesign.${d1}.scratch_dig_dig_limit == 10"
            - "OpticalDesign.${d1}.cleanliness_limit_per_cm2 == 30"
            - "OpticalDesign.${d1}.tolerance_method == WORST_CASE"
            - "OpticalDesign.${d1}.design_status == DRAFT"
            - "OpticalDesign.${d1}.tolerance_verdict == PENDING"
            - "OpticalDesign.${d1}.design_revision == 1"
            - "OpticalDesign.${d1}.supersedes_design_id == null"
            - "OpticalDesign.${d1}.rss_stack_waves == null and worst_case_stack_waves == null and governing_stack_waves == null and allocated_tolerance_waves == null"
            - "OpticalDesign.${d1}.version == 1 and id, created_at and updated_at are present"
            - "the GET returns HTTP 200 and a data object equal to the create response data"

      - name: omitted_optional_fields_fall_back_to_their_declared_defaults
        claim_type: defaults
        grounds:
          - entities.OpticalDesign
          - entities.GlassLot
          - entities.MetrologyInstrument
          - calculations.metrology_capability_index
          - conventions.logical_clock
        distinguishing_aspect: |
          Three creates that carry only their required inputs must materialise every declared default: the
          design's nine, the lot's blank_center_thickness_um 6200.0 plus its zeroed ledger, and the
          instrument's lateral_resolution_um 250.0 and calibration_interval_days 90 — and the instrument's
          computed trio must be derived from those defaults (0 days since calibration,
          effective_uncertainty_waves 0.001000, instrument_status CALIBRATED).
        test_recipe:
          setup:
            - "Empty database."
            - "Logical clock at its start value 2026-08-01T00:00:00Z (conventions.logical_clock)."
            - "Only required fields are supplied on each of the three creates."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
          trigger:
            - call: "POST /optics/optical-designs"
              payload: { design_code: "OD-2540-MIN", aperture_mm: 120.0, wavelength_min_nm: 450, wavelength_max_nm: 700, required_rms_wavefront_waves: 0.0400, tolerance_budget_waves: 0.0800, transmitted_wavefront_budget_waves: 0.1050 }
              as: OpticsEngineer
              captures: { d1: $.data.id }
            - call: "POST /optics/glass-lots"
              payload: { lot_code: "GL-2540-MIN", glass_type: "N-BK7", melt_index_nd: 1.516800, total_blank_count: 20, declared_index_homogeneity_grade: "H2", declared_striae_grade: "A" }
              as: ProcurementOfficer
              captures: { g1: $.data.id }
            - call: "POST /optics/metrology-instruments"
              payload: { instrument_code: "IF-2540-MIN", instrument_type: "PHASE_SHIFTING_INTERFEROMETER", base_uncertainty_waves: 0.0010, last_calibrated_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
              captures: { i1: $.data.id }
          assert:
            - "OpticalDesign.${d1}.surface_figure_budget_waves == 0.025"
            - "OpticalDesign.${d1}.surface_roughness_budget_nm == 1.2"
            - "OpticalDesign.${d1}.min_center_thickness_um == 5800.0"
            - "OpticalDesign.${d1}.min_index_homogeneity_grade == H3 and max_striae_grade == B"
            - "OpticalDesign.${d1}.scratch_dig_scratch_limit == 40 and scratch_dig_dig_limit == 20"
            - "OpticalDesign.${d1}.cleanliness_limit_per_cm2 == 50"
            - "OpticalDesign.${d1}.tolerance_method == STATISTICAL"
            - "GlassLot.${g1}.blank_center_thickness_um == 6200.0"
            - "GlassLot.${g1}.reserved_blank_count == 0 and consumed_blank_count == 0 and scrapped_blank_count == 0"
            - "GlassLot.${g1}.available_blank_count == 20"
            - "GlassLot.${g1}.lot_status == QUARANTINED"
            - "GlassLot.${g1}.measured_index_homogeneity_grade == null and measured_striae_grade == null"
            - "GlassLot.${g1}.effective_index_homogeneity_grade == H2 and effective_striae_grade == A (the declared grades govern until certification)"
            - "MetrologyInstrument.${i1}.lateral_resolution_um == 250.0"
            - "MetrologyInstrument.${i1}.calibration_interval_days == 90"
            - "MetrologyInstrument.${i1}.days_since_calibration == 0"
            - "MetrologyInstrument.${i1}.effective_uncertainty_waves == 0.001000"
            - "MetrologyInstrument.${i1}.instrument_status == CALIBRATED and booked_minutes_total == 0"

      - name: work_order_read_returns_the_row_including_the_fields_frozen_at_create
        claim_type: retrieval
        grounds:
          - entities.WorkOrder
          - endpoints.GET_/optics/work-orders/{id}
          - calculations.blank_conservation_ledger
          - state_machines.WorkOrder.process_status
          - state_machines.WorkOrder.compliance_status
        distinguishing_aspect: |
          The read of a freshly opened work order must return the two independent state dimensions at
          their initial values and the four values frozen out of its parents at create time
          (pinned_design_revision 1, blank_center_thickness_um 6200.0, spare_blank_count 1,
          reserved_blank_count 3), with remaining_center_thickness_um still equal to the blank.
        test_recipe:
          setup:
            - "A RELEASED design (one 0.0375-wave allocation, STATISTICAL, verdict PASS) and a RELEASED lot GL-2540-1 with total_blank_count 20."
            - "One work order WO-2540-1 with element_count 2."
            - "Logical clock at its start value 2026-08-01T00:00:00Z (conventions.logical_clock)."
          setup_api_calls:
            - call: "POST /optics/optical-designs"
              payload: { design_code: "OD-2540-A", aperture_mm: 120.0, wavelength_min_nm: 450, wavelength_max_nm: 700, required_rms_wavefront_waves: 0.0400, tolerance_budget_waves: 0.0800, transmitted_wavefront_budget_waves: 0.1050 }
              as: OpticsEngineer
              captures: { d1: $.data.id }
            - call: "POST /optics/optical-designs/${d1}/tolerance-allocations"
              payload: { contributor_type: "SURFACE_IRREGULARITY", sensitivity_waves_per_unit: 1.5, manufacturing_tolerance_units: 0.0250 }
              as: OpticsEngineer
            - call: "POST /optics/optical-designs/${d1}/tolerance-analysis"
              payload: {}
              as: OpticsEngineer
            - call: "POST /optics/optical-designs/${d1}/release"
              payload: {}
              as: OpticsEngineer
            - call: "POST /optics/glass-lots"
              payload: { lot_code: "GL-2540-1", glass_type: "N-BK7", melt_index_nd: 1.516800, total_blank_count: 20, declared_index_homogeneity_grade: "H2", declared_striae_grade: "A" }
              as: ProcurementOfficer
              captures: { g1: $.data.id }
            - call: "POST /optics/glass-lots/${g1}/certification"
              payload: { measured_index_homogeneity_grade: "H3", measured_striae_grade: "B", certificate_reference: "CERT-2540-1" }
              as: ProcurementOfficer
              captures: { g1v: $.data.version }
            - call: "POST /optics/work-orders"
              payload: { wo_code: "WO-2540-1", design_id: "${d1}", glass_lot_id: "${g1}", element_count: 2, expected_glass_lot_version: "${g1v}" }
              as: ProcessTechnician
              captures: { w1: $.data.id }
          trigger:
            - call: "GET /optics/work-orders/${w1}"
              payload: {}
              as: ProcessTechnician
          assert:
            - "the read returns HTTP 200 and data.id == ${w1}"
            - "WorkOrder.${w1}.design_id == ${d1} and glass_lot_id == ${g1}"
            - "WorkOrder.${w1}.element_count == 2"
            - "WorkOrder.${w1}.spare_blank_count == 1 and reserved_blank_count == 3"
            - "WorkOrder.${w1}.pinned_design_revision == 1"
            - "WorkOrder.${w1}.blank_center_thickness_um == 6200.0"
            - "WorkOrder.${w1}.remaining_center_thickness_um == 6200.0"
            - "WorkOrder.${w1}.cumulative_removal_nm == 0 and figuring_iteration_count == 0"
            - "WorkOrder.${w1}.process_status == BLANKS_RESERVED"
            - "WorkOrder.${w1}.compliance_status == UNCLASSIFIED"
            - "WorkOrder.${w1}.hold_reason == null and scrap_reason == null and cancel_reason == null"
            - "WorkOrder.${w1}.version == 1"

      - name: glass_lot_listing_pages_and_filters_over_the_same_two_rows
        claim_type: listing
        grounds:
          - endpoints.GET_/optics/glass-lots
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
          - entities.GlassLot.fields.lot_status
        distinguishing_aspect: |
          With exactly two lots stored, limit 1 must return one row per page with total_count 2 on both
          pages and has_more true then false, the two pages must not repeat a row, and the
          lot_status=RELEASED filter must narrow total_count to 1 — proving total_count counts the
          filtered set, not the table.
        test_recipe:
          setup:
            - "Two lots: GL-2540-1 (total_blank_count 20, certified so RELEASED) and GL-2540-2 (total_blank_count 8, still QUARANTINED)."
            - "Logical clock at its start value 2026-08-01T00:00:00Z (conventions.logical_clock)."
          setup_api_calls:
            - call: "POST /optics/glass-lots"
              payload: { lot_code: "GL-2540-1", glass_type: "N-BK7", melt_index_nd: 1.516800, total_blank_count: 20, declared_index_homogeneity_grade: "H2", declared_striae_grade: "A" }
              as: ProcurementOfficer
              captures: { g1: $.data.id }
            - call: "POST /optics/glass-lots/${g1}/certification"
              payload: { measured_index_homogeneity_grade: "H3", measured_striae_grade: "B", certificate_reference: "CERT-2540-1" }
              as: ProcurementOfficer
              captures: { g1v: $.data.version }
            - call: "POST /optics/glass-lots"
              payload: { lot_code: "GL-2540-2", glass_type: "N-BK7", melt_index_nd: 1.516800, total_blank_count: 8, declared_index_homogeneity_grade: "H2", declared_striae_grade: "A" }
              as: ProcurementOfficer
              captures: { g2: $.data.id }
          trigger:
            - call: "GET /optics/glass-lots"
              payload: { limit: 1, offset: 0 }
              as: ProcurementOfficer
            - call: "GET /optics/glass-lots"
              payload: { limit: 1, offset: 1 }
              as: ProcurementOfficer
            - call: "GET /optics/glass-lots"
              payload: { lot_status: "RELEASED", limit: 10, offset: 0 }
              as: ProcurementOfficer
            - call: "GET /optics/glass-lots"
              payload: { glass_type: "N-SF6", limit: 10, offset: 0 }
              as: ProcurementOfficer
          assert:
            - "all four reads return HTTP 200 with response_type array"
            - "the first page returns exactly 1 element with total_count == 2 and has_more == true"
            - "the second page returns exactly 1 element with total_count == 2 and has_more == false"
            - "the ids returned by the two pages are ${g1} and ${g2} with no repetition between pages"
            - "the lot_status=RELEASED read returns total_count == 1 with data[0].id == ${g1} and data[0].lot_status == RELEASED"
            - "the glass_type=N-SF6 read returns total_count == 0, has_more == false and an empty data array"

      - name: assembly_read_on_an_unknown_uuid_returns_assembly_not_found
        claim_type: not_found
        grounds:
          - errors.ERR_ASSEMBLY_NOT_FOUND
          - validations.priority_3
          - endpoints.GET_/optics/assemblies/{id}
          - response_envelope.error
        distinguishing_aspect: |
          A syntactically valid but unstored UUID in the path must come back as a 404 carrying the
          collection's own code ERR_ASSEMBLY_NOT_FOUND in the error envelope, while the stored assembly
          created in the same database still reads 200 — so the 404 is about the id, not about an empty
          table.
        test_recipe:
          setup:
            - "One stored Assembly AS-2540-1 on a DRAFT design (assembly create has no design-state gate)."
            - "Logical clock at its start value 2026-08-01T00:00:00Z (conventions.logical_clock)."
          setup_api_calls:
            - call: "POST /optics/optical-designs"
              payload: { design_code: "OD-2540-A", aperture_mm: 120.0, wavelength_min_nm: 450, wavelength_max_nm: 700, required_rms_wavefront_waves: 0.0400, tolerance_budget_waves: 0.0800, transmitted_wavefront_budget_waves: 0.1050 }
              as: OpticsEngineer
              captures: { d1: $.data.id }
            - call: "POST /optics/assemblies"
              payload: { design_id: "${d1}", assembly_code: "AS-2540-1" }
              as: ProcessTechnician
              captures: { a1: $.data.id, a1v: $.data.version }
          trigger:
            - call: "GET /optics/assemblies/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: QualityManager
              as_user_id: "qm-001"
            - call: "GET /optics/assemblies/${a1}"
              payload: {}
              as: ProcessTechnician
          assert:
            - "the first read returns HTTP 404 with data.error_id == ERR_ASSEMBLY_NOT_FOUND"
            - "the error response carries response_type error and a data.message string"
            - "the second read returns HTTP 200 with data.id == ${a1} and assembly_status == KITTED"

      - name: work_order_create_missing_required_element_count_is_rejected
        claim_type: required_fields
        grounds:
          - validations.priority_5
          - errors.ERR_INVALID_REQUEST
          - endpoints.POST_/optics/work-orders
          - calculations.blank_conservation_ledger
        distinguishing_aspect: |
          element_count carries no default, so omitting it must fail with ERR_INVALID_REQUEST (400) and
          leave the lot ledger completely untouched — no reservation may be taken by a rejected create —
          while the same call with element_count 2 succeeds and moves the ledger to reserved 3.
        test_recipe:
          setup:
            - "A RELEASED design and a RELEASED lot GL-2540-1 with total_blank_count 20 and available_blank_count 20."
            - "Logical clock at its start value 2026-08-01T00:00:00Z (conventions.logical_clock)."
          setup_api_calls:
            - call: "POST /optics/optical-designs"
              payload: { design_code: "OD-2540-A", aperture_mm: 120.0, wavelength_min_nm: 450, wavelength_max_nm: 700, required_rms_wavefront_waves: 0.0400, tolerance_budget_waves: 0.0800, transmitted_wavefront_budget_waves: 0.1050 }
              as: OpticsEngineer
              captures: { d1: $.data.id }
            - call: "POST /optics/optical-designs/${d1}/tolerance-allocations"
              payload: { contributor_type: "SURFACE_IRREGULARITY", sensitivity_waves_per_unit: 1.5, manufacturing_tolerance_units: 0.0250 }
              as: OpticsEngineer
            - call: "POST /optics/optical-designs/${d1}/tolerance-analysis"
              payload: {}
              as: OpticsEngineer
            - call: "POST /optics/optical-designs/${d1}/release"
              payload: {}
              as: OpticsEngineer
            - call: "POST /optics/glass-lots"
              payload: { lot_code: "GL-2540-1", glass_type: "N-BK7", melt_index_nd: 1.516800, total_blank_count: 20, declared_index_homogeneity_grade: "H2", declared_striae_grade: "A" }
              as: ProcurementOfficer
              captures: { g1: $.data.id }
            - call: "POST /optics/glass-lots/${g1}/certification"
              payload: { measured_index_homogeneity_grade: "H3", measured_striae_grade: "B", certificate_reference: "CERT-2540-1" }
              as: ProcurementOfficer
              captures: { g1v: $.data.version }
          trigger:
            - call: "POST /optics/work-orders"
              payload: { wo_code: "WO-2540-1", design_id: "${d1}", glass_lot_id: "${g1}", expected_glass_lot_version: "${g1v}" }
              as: ProcessTechnician
            - call: "GET /optics/glass-lots/${g1}"
              payload: {}
              as: ProcurementOfficer
            - call: "POST /optics/work-orders"
              payload: { wo_code: "WO-2540-1", design_id: "${d1}", glass_lot_id: "${g1}", element_count: 2, expected_glass_lot_version: "${g1v}" }
              as: ProcessTechnician
              captures: { w1: $.data.id }
          assert:
            - "the first trigger returns HTTP 400 with error_id ERR_INVALID_REQUEST"
            - "after the refusal: GlassLot.${g1}.reserved_blank_count == 0 and available_blank_count == 20"
            - "after the refusal: GlassLot.${g1}.version == 2 (unchanged by the rejected create)"
            - "the last trigger returns HTTP 201 with WorkOrder.${w1}.element_count == 2"
            - "WorkOrder.${w1}.reserved_blank_count == 3"
            - "GlassLot.${g1}.reserved_blank_count == 3 and available_blank_count == 17"

      - name: certification_recomputes_the_effective_grades_from_the_measured_pair
        claim_type: computed_fields
        grounds:
          - entities.GlassLot.fields.effective_index_homogeneity_grade
          - entities.GlassLot.fields.effective_striae_grade
          - conventions.grade_ranks
          - endpoints.POST_/optics/glass-lots/{id}/certification
          - state_machines.GlassLot.QUARANTINED_to_RELEASED
        distinguishing_aspect: |
          The two effective grades are computed, not stored input: a lot declared H2/A whose melt
          certificate measures H4/C must expose effective H4/C (the measurement overrides the declaration
          even when it is worse) while both declared_* fields keep their original values, which by
          conventions.grade_ranks makes the lot unusable for any design limited to H3/B.
        test_recipe:
          setup:
            - "A QUARANTINED lot GL-2540-1 declared H2/A with total_blank_count 20."
            - "Logical clock at its start value 2026-08-01T00:00:00Z (conventions.logical_clock)."
          setup_api_calls:
            - call: "POST /optics/glass-lots"
              payload: { lot_code: "GL-2540-1", glass_type: "N-BK7", melt_index_nd: 1.516800, total_blank_count: 20, declared_index_homogeneity_grade: "H2", declared_striae_grade: "A" }
              as: ProcurementOfficer
              captures: { g1: $.data.id }
          trigger:
            - call: "POST /optics/glass-lots/${g1}/certification"
              payload: { measured_index_homogeneity_grade: "H4", measured_striae_grade: "C", certificate_reference: "CERT-2540-9" }
              as: ProcurementOfficer
            - call: "GET /optics/glass-lots/${g1}"
              payload: {}
              as: ProcurementOfficer
          assert:
            - "the certification returns HTTP 200"
            - "GlassLot.${g1}.measured_index_homogeneity_grade == H4 and measured_striae_grade == C"
            - "GlassLot.${g1}.effective_index_homogeneity_grade == H4"
            - "GlassLot.${g1}.effective_striae_grade == C"
            - "GlassLot.${g1}.declared_index_homogeneity_grade == H2 and declared_striae_grade == A (unchanged)"
            - "GlassLot.${g1}.certificate_reference == CERT-2540-9"
            - "GlassLot.${g1}.lot_status == RELEASED and version == 2"
            - "RANK(H4) == 4 exceeds RANK(H3) == 3, so a work order against a design whose min_index_homogeneity_grade is H3 would now be refused with ERR_GLASS_GRADE_UNSUITABLE"

      - name: metrology_report_system_fields_come_from_the_header_and_the_logical_clock
        claim_type: system_fields
        grounds:
          - entities.MetrologyReport.fields.recorded_by_user_id
          - entities.MetrologyReport.fields.signed_by_user_id
          - entities.MetrologyReport.fields.signed_at_utc
          - conventions.logical_clock
          - state_machines.MetrologyReport.DRAFT_to_SIGNED
        distinguishing_aspect: |
          recorded_by_user_id, signed_by_user_id and signed_at_utc are system-sourced: the first is minted
          from the recording X-User-ID (mt-001), the second from the signing X-User-ID (mt-002) and the
          third from the logical clock, which was advanced to 2026-08-01T09:30:00Z after the report was
          drafted — so the stamp proves the clock is read at signature time, not at create time, and never
          falls back to wall-clock.
        test_recipe:
          setup:
            - "A work order in POLISHING whose 08:00-10:00 POLISHING run is AWAITING_METROLOGY with material_removed_nm 800.0."
            - "A DRAFT report recorded by mt-001 with surface_rms_waves 0.0200 and surface_roughness_nm_rms 0.8000 (POLISHING budget 0.0750, roughness budget 1.2000, so the verdict will be ACCEPTED)."
            - "The clock starts at 2026-08-01T00:00:00Z and is moved forward to 09:30 between drafting and signing."
          setup_api_calls:
            - call: "POST /optics/optical-designs"
              payload: { design_code: "OD-2540-A", aperture_mm: 120.0, wavelength_min_nm: 450, wavelength_max_nm: 700, required_rms_wavefront_waves: 0.0400, tolerance_budget_waves: 0.0800, transmitted_wavefront_budget_waves: 0.1050 }
              as: OpticsEngineer
              captures: { d1: $.data.id }
            - call: "POST /optics/optical-designs/${d1}/tolerance-allocations"
              payload: { contributor_type: "SURFACE_IRREGULARITY", sensitivity_waves_per_unit: 1.5, manufacturing_tolerance_units: 0.0250 }
              as: OpticsEngineer
            - call: "POST /optics/optical-designs/${d1}/tolerance-analysis"
              payload: {}
              as: OpticsEngineer
            - call: "POST /optics/optical-designs/${d1}/release"
