      - name: jurisdiction_day_quota_counts_across_projects_and_a_passed_inspection_frees_the_slot
        grounds:
          - calculations.inspection_slot_availability
          - validations[priority=23]
          - errors.ERR_INSPECTION_SLOT_FULL
          - state_machines.Inspection.SCHEDULED_to_PASSED
          - entities.Jurisdiction.fields.inspection_slots_per_day
        distinguishing_aspect: |
          Resource: the Jurisdiction's per-date inspection quota, a shared counted resource rather
          than a per-party calendar, and its interval semantics are the opposite of the crew rule -
          two bookings whose windows touch at 12:00:00Z are both legal while capacity remains, and a
          third booking that overlaps nothing at all is still refused because the count is exhausted.
          The quota is pooled across projects, and PASSING one inspection releases its slot so the
          previously refused booking then succeeds.
