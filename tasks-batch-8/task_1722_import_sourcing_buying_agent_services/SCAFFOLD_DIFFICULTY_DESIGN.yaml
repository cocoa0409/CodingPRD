        distinguishing_aspect: |
          Metric buyer-YTD-GMV-cents at the exact 10,000,000 tier edge: a PO
          of 200,000 lifting YTD from 9,800,000 to exactly 10,000,000 prices
          at 4% (8,000), while an identical PO starting from 9,799,999 (YTD
          9,999,999) prices at 5% (10,000) — the >= lower-inclusive boundary,
          exercised through the quotation-accept endpoint.
