# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Utility Energy-Efficiency Rebate Program Administration
# =============================================================================
# Nine difficulty rules × 2 instances each = 18 instances total.

scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — dual_variant_calc
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: savings_claim_deemed_vs_measured_on_line_item
        grounds:
          - calculations.savings_claim_kwh
          - entities.ApplicationLineItem.fields.final_kwh
          - entities.SavingsClaim.fields.claim_method
        distinguishing_aspect: |
          Same line item produces different final_kwh depending on
          SavingsClaim.claim_method: DEEMED uses catalog-deemed per-unit kwh
          (400 * 5 = 2000), while MEASURED uses metered pre-minus-post delta
          (12500 - 9800 = 2700). The variant switch happens on the
          ApplicationLineItem domain.
        test_recipe:
          setup:
            - "ProgramYear in OPEN status with budget_cap_cents=20000000, savings_goal_kwh=500000"
            - "Measure with deemed_kwh_per_unit=400, base_rate_cents=10000, is_active=true"
            - "TradeAlly ACTIVE"
            - "RebateApplication SUBMITTED with one line item quantity=5 (deemed claimed_kwh=2000)"
            - "SavingsClaim on the line item with claim_method=MEASURED, pre_annual_kwh=12500, post_annual_kwh=9800"
            - "Logical clock at 2026-08-13T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-13T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /program-years"
              payload: { program_code: "RES-HVAC-2026", program_year_label: "PY2026", budget_cap_cents: 20000000, savings_goal_kwh: 500000 }
              as: ProgramAdministrator
              captures: { py_id: $.data.id }
            - call: "POST /measures"
              payload: { program_year_id: "${py_id}", measure_code: "HVAC-18SEER", measure_name: "18 SEER HVAC", base_rate_cents: 10000, deemed_kwh_per_unit: 400 }
              as: ProgramAdministrator
              captures: { measure_id: $.data.id }
            - call: "POST /program-years/${py_id}/open"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /trade-allies"
              payload: { ally_name: "Acme HVAC", license_number: "LIC-001" }
              as: ProgramAdministrator
              captures: { ally_id: $.data.id }
            - call: "POST /trade-allies/${ally_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /applications"
              payload: { program_year_id: "${py_id}", trade_ally_id: "${ally_id}", customer_account_number: "CUST-001", service_address: "1 Main St", invoice_number: "INV-001", invoice_date: "2026-08-01" }
              as: TradeAlly
              as_user_id: "${ally_id}"
              captures: { app_id: $.data.id }
            - call: "POST /line-items"
              payload: { application_id: "${app_id}", measure_id: "${measure_id}", quantity: 5 }
              as: TradeAlly
              as_user_id: "${ally_id}"
              captures: { line_id: $.data.id }
            - call: "POST /savings-claims"
              payload: { line_item_id: "${line_id}", claim_method: "MEASURED", pre_annual_kwh: 12500, post_annual_kwh: 9800 }
              as: TradeAlly
              as_user_id: "${ally_id}"
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: TradeAlly
              as_user_id: "${ally_id}"
          trigger:
            - call: "POST /applications/${app_id}/verify"
              payload: {}
              as: VerificationInspector
          assert:
            - "RebateApplication.${app_id}.claimed_kwh == 2000 (deemed at submit: 400 * 5)"
            - "RebateApplication.${app_id}.final_kwh == 2700 (measured: 12500 - 9800)"
            - "RebateApplication.${app_id}.claimed_kwh != RebateApplication.${app_id}.final_kwh"

      - name: evaluation_adjusted_vs_unadjusted_on_program_year
        grounds:
          - calculations.evaluation_adjusted_kwh
          - entities.ProgramYear.fields.adjusted_kwh
          - entities.ProgramYear.fields.reported_kwh
        distinguishing_aspect: |
          ProgramYear.reported_kwh and ProgramYear.adjusted_kwh diverge once an
          EvaluationAdjustment exists: without adjustment adjusted_kwh == reported_kwh
          (raw savings), with adjustment adjusted_kwh = floor(reported_kwh *
          realization_rate_pct / 100). Different entity domain (ProgramYear
          aggregate) from instance 1's line-item domain.
        test_recipe:
          setup:
            - "ProgramYear CLOSED with reported_kwh=2000 (one VERIFIED-then-PAID-via-close application, deemed 400*5)"
            - "Logical clock at 2026-08-13T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-13T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /program-years"
              payload: { program_code: "RES-HVAC-2026", program_year_label: "PY2026", budget_cap_cents: 20000000, savings_goal_kwh: 500000 }
              as: ProgramAdministrator
              captures: { py_id: $.data.id }
            - call: "POST /measures"
              payload: { program_year_id: "${py_id}", measure_code: "HVAC-18SEER", measure_name: "18 SEER HVAC", base_rate_cents: 10000, deemed_kwh_per_unit: 400 }
              as: ProgramAdministrator
              captures: { measure_id: $.data.id }
            - call: "POST /program-years/${py_id}/open"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /trade-allies"
              payload: { ally_name: "Acme HVAC", license_number: "LIC-001" }
              as: ProgramAdministrator
              captures: { ally_id: $.data.id }
            - call: "POST /trade-allies/${ally_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /applications"
              payload: { program_year_id: "${py_id}", trade_ally_id: "${ally_id}", customer_account_number: "CUST-001", service_address: "1 Main St", invoice_number: "INV-001", invoice_date: "2026-08-01" }
              as: TradeAlly
              as_user_id: "${ally_id}"
              captures: { app_id: $.data.id }
            - call: "POST /line-items"
              payload: { application_id: "${app_id}", measure_id: "${measure_id}", quantity: 5 }
              as: TradeAlly
              as_user_id: "${ally_id}"
              captures: { line_id: $.data.id }
            - call: "POST /savings-claims"
              payload: { line_item_id: "${line_id}", claim_method: "DEEMED" }
              as: TradeAlly
              as_user_id: "${ally_id}"
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: TradeAlly
              as_user_id: "${ally_id}"
            - call: "POST /applications/${app_id}/verify"
              payload: {}
              as: VerificationInspector
            - call: "POST /applications/${app_id}/approve"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /program-years/${py_id}/close"
              payload: {}
              as: ProgramAdministrator
          trigger:
            - call: "POST /evaluation-adjustments"
              payload: { program_year_id: "${py_id}", realization_rate_pct: 80, effective_on: "2026-08-13" }
              as: RegulatorAnalyst
          assert:
            - "ProgramYear.${py_id}.reported_kwh == 2000"
            - "ProgramYear.${py_id}.adjusted_kwh == 1600 (floor(2000 * 80 / 100))"
            - "ProgramYear.${py_id}.adjusted_kwh != ProgramYear.${py_id}.reported_kwh"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (different modes)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: pacing_tier_conditional_branch_selection
        grounds:
          - calculations.pacing_tier_selection
          - entities.ApplicationLineItem.fields.pacing_tier_at_submit
        distinguishing_aspect: |
          Mode (a): tiered-rate selection with conditional branches on entity
          state. incentive_cents = base_rate * qty * tier_factor where
          tier_factor depends on committed_pct thresholds (>=50 vs >=80) at
          submit time. A committed_pct of 55 yields MID_TIER with factor 0.80,
          so a base_rate=100000, qty=5 line yields 400000 — not 500000
          (standard) nor 250000 (high).
        test_recipe:
          setup:
            - "ProgramYear OPEN with budget_cap_cents=20000000"
            - "Measure M-BIG base_rate_cents=11000000 for preload"
            - "Measure M-TARGET base_rate_cents=100000, deemed_kwh_per_unit=100"
            - "TradeAlly ACTIVE"
            - "Preload application submitted with one M-BIG line (incentive=11000000, committed becomes 11000000 = 55%)"
            - "Target application in DRAFT with one M-TARGET line qty=5"
            - "Logical clock 2026-08-13"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-13T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /program-years"
              payload: { program_code: "RES-HVAC-2026", program_year_label: "PY2026", budget_cap_cents: 20000000, savings_goal_kwh: 500000 }
              as: ProgramAdministrator
              captures: { py_id: $.data.id }
            - call: "POST /measures"
              payload: { program_year_id: "${py_id}", measure_code: "M-BIG", measure_name: "Big Measure", base_rate_cents: 11000000, deemed_kwh_per_unit: 100 }
              as: ProgramAdministrator
              captures: { m_big: $.data.id }
            - call: "POST /measures"
              payload: { program_year_id: "${py_id}", measure_code: "M-TARGET", measure_name: "Target Measure", base_rate_cents: 100000, deemed_kwh_per_unit: 100 }
              as: ProgramAdministrator
              captures: { m_tgt: $.data.id }
            - call: "POST /program-years/${py_id}/open"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /trade-allies"
              payload: { ally_name: "Acme", license_number: "LIC-001" }
              as: ProgramAdministrator
              captures: { ally_id: $.data.id }
            - call: "POST /trade-allies/${ally_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /applications"
              payload: { program_year_id: "${py_id}", trade_ally_id: "${ally_id}", customer_account_number: "CUST-PRE", service_address: "9 Pre Ave", invoice_number: "I-PRE", invoice_date: "2026-08-01" }
              as: TradeAlly
              as_user_id: "${ally_id}"
              captures: { app_pre: $.data.id }
            - call: "POST /line-items"
              payload: { application_id: "${app_pre}", measure_id: "${m_big}", quantity: 1 }
              as: TradeAlly
              as_user_id: "${ally_id}"
            - call: "POST /applications/${app_pre}/submit"
              payload: {}
              as: TradeAlly
              as_user_id: "${ally_id}"
            - call: "POST /applications"
              payload: { program_year_id: "${py_id}", trade_ally_id: "${ally_id}", customer_account_number: "CUST-TGT", service_address: "10 Target Ave", invoice_number: "I-TGT", invoice_date: "2026-08-02" }
              as: TradeAlly
              as_user_id: "${ally_id}"
              captures: { app_tgt: $.data.id }
            - call: "POST /line-items"
              payload: { application_id: "${app_tgt}", measure_id: "${m_tgt}", quantity: 5 }
              as: TradeAlly
              as_user_id: "${ally_id}"
              captures: { line_tgt: $.data.id }
          trigger:
            - call: "POST /applications/${app_tgt}/submit"
              payload: {}
              as: TradeAlly
              as_user_id: "${ally_id}"
          assert:
            - "ApplicationLineItem.${line_tgt}.pacing_tier_at_submit == 'MID_TIER'"
            - "ApplicationLineItem.${line_tgt}.incentive_cents == 400000"
            - "RebateApplication.${app_tgt}.incentive_total_cents == 400000"

      - name: application_incentive_per_line_round_then_sum
        grounds:
          - calculations.application_incentive_total
          - entities.RebateApplication.fields.incentive_total_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters. Two identical line
          items each with base_rate_cents=333, quantity=1, in HIGH_TIER (factor
          0.50) yield 333 * 1 * 0.50 = 166.5 per line, rounded to 167 each.
          Per-line-round-then-sum produces 167+167=334; the alternative
          sum-then-round would produce round(333)=333. The scaffold pins
          per-line-then-sum, so 334 is correct.
        test_recipe:
          setup:
            - "ProgramYear OPEN with budget_cap_cents=20000000, committed preloaded to 16000000 (80%) → HIGH_TIER"
            - "Measure M-ODD base_rate_cents=333, deemed_kwh_per_unit=100"
            - "Target application has two identical M-ODD line items (quantity=1 each)"
            - "Logical clock 2026-08-13"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-13T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /program-years"
              payload: { program_code: "RES-HVAC-2026", program_year_label: "PY2026", budget_cap_cents: 20000000, savings_goal_kwh: 500000 }
              as: ProgramAdministrator
              captures: { py_id: $.data.id }
            - call: "POST /measures"
              payload: { program_year_id: "${py_id}", measure_code: "M-PRELOAD", measure_name: "Preload", base_rate_cents: 16000000, deemed_kwh_per_unit: 10 }
              as: ProgramAdministrator
              captures: { m_pre: $.data.id }
            - call: "POST /measures"
              payload: { program_year_id: "${py_id}", measure_code: "M-ODD", measure_name: "Odd Cents", base_rate_cents: 333, deemed_kwh_per_unit: 100 }
              as: ProgramAdministrator
              captures: { m_odd: $.data.id }
            - call: "POST /program-years/${py_id}/open"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /trade-allies"
              payload: { ally_name: "Acme", license_number: "LIC-001" }
              as: ProgramAdministrator
              captures: { ally_id: $.data.id }
            - call: "POST /trade-allies/${ally_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /applications"
              payload: { program_year_id: "${py_id}", trade_ally_id: "${ally_id}", customer_account_number: "CUST-PRE", service_address: "1 Pre Ave", invoice_number: "I-PRE", invoice_date: "2026-08-01" }
              as: TradeAlly
              as_user_id: "${ally_id}"
              captures: { app_pre: $.data.id }
            - call: "POST /line-items"
              payload: { application_id: "${app_pre}", measure_id: "${m_pre}", quantity: 1 }
              as: TradeAlly
              as_user_id: "${ally_id}"
            - call: "POST /applications/${app_pre}/submit"
              payload: {}
              as: TradeAlly
              as_user_id: "${ally_id}"
            - call: "POST /applications"
              payload: { program_year_id: "${py_id}", trade_ally_id: "${ally_id}", customer_account_number: "CUST-TGT", service_address: "2 Target Ave", invoice_number: "I-TGT", invoice_date: "2026-08-02" }
              as: TradeAlly
              as_user_id: "${ally_id}"
              captures: { app_tgt: $.data.id }
            - call: "POST /line-items"
              payload: { application_id: "${app_tgt}", measure_id: "${m_odd}", quantity: 1 }
              as: TradeAlly
              as_user_id: "${ally_id}"
            - call: "POST /line-items"
              payload: { application_id: "${app_tgt}", measure_id: "${m_odd}", quantity: 1 }
              as: TradeAlly
              as_user_id: "${ally_id}"
          trigger:
            - call: "POST /applications/${app_tgt}/submit"
              payload: {}
              as: TradeAlly
              as_user_id: "${ally_id}"
          assert:
            - "RebateApplication.${app_tgt}.incentive_total_cents == 334"
            - "RebateApplication.${app_tgt}.incentive_total_cents != 333"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: trade_ally_suspend_reinstate_cycle
        grounds:
          - state_machines.TradeAlly.ACTIVE_to_SUSPENDED
          - state_machines.TradeAlly.SUSPENDED_to_ACTIVE
        distinguishing_aspect: |
          TradeAlly exhibits a cyclic state shape: ACTIVE → SUSPENDED → ACTIVE
          is a loop (not a linear pipeline). Two successive suspend/reinstate
          pairs bring the ally back to ACTIVE, distinguishing this from a
          one-way escalation.
        test_recipe:
          setup:
            - "TradeAlly enrolled and ACTIVE"
          setup_api_calls:
            - call: "POST /trade-allies"
              payload: { ally_name: "Acme", license_number: "LIC-001" }
              as: ProgramAdministrator
              captures: { ally_id: $.data.id }
            - call: "POST /trade-allies/${ally_id}/activate"
              payload: {}
              as: ProgramAdministrator
          trigger:
            - call: "POST /trade-allies/${ally_id}/suspend"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /trade-allies/${ally_id}/reinstate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /trade-allies/${ally_id}/suspend"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /trade-allies/${ally_id}/reinstate"
              payload: {}
              as: ProgramAdministrator
          assert:
            - "TradeAlly.${ally_id}.enroll_status == 'ACTIVE' after two complete ACTIVE→SUSPENDED→ACTIVE loops"

      - name: rebate_application_branching_withdraw_vs_verify_vs_reject
        grounds:
          - state_machines.RebateApplication.SUBMITTED_to_VERIFIED
          - state_machines.RebateApplication.SUBMITTED_to_WITHDRAWN
          - state_machines.RebateApplication.SUBMITTED_to_REJECTED
        distinguishing_aspect: |
          RebateApplication exhibits branching (fork) shape from SUBMITTED:
          the same source state can transition to VERIFIED (happy path),
          WITHDRAWN (ally-initiated), or REJECTED (admin-initiated), each with
          distinct side-effect sets. Different entity from instance 1
          (TradeAlly).
        test_recipe:
          setup:
            - "OPEN ProgramYear, ACTIVE TradeAlly, three SUBMITTED applications A, B, C (each incentive 10000)"
            - "Logical clock 2026-08-13"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-13T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /program-years"
              payload: { program_code: "RES-HVAC-2026", program_year_label: "PY2026", budget_cap_cents: 20000000, savings_goal_kwh: 500000 }
              as: ProgramAdministrator
              captures: { py_id: $.data.id }
            - call: "POST /measures"
              payload: { program_year_id: "${py_id}", measure_code: "M1", measure_name: "M1", base_rate_cents: 10000, deemed_kwh_per_unit: 100 }
              as: ProgramAdministrator
              captures: { m1: $.data.id }
            - call: "POST /program-years/${py_id}/open"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /trade-allies"
              payload: { ally_name: "Acme", license_number: "LIC-001" }
              as: ProgramAdministrator
              captures: { ally_id: $.data.id }
            - call: "POST /trade-allies/${ally_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /applications"
              payload: { program_year_id: "${py_id}", trade_ally_id: "${ally_id}", customer_account_number: "C1", service_address: "1 A St", invoice_number: "I-1", invoice_date: "2026-08-01" }
              as: TradeAlly
              as_user_id: "${ally_id}"
              captures: { app_a: $.data.id }
            - call: "POST /line-items"
              payload: { application_id: "${app_a}", measure_id: "${m1}", quantity: 1 }
              as: TradeAlly
              as_user_id: "${ally_id}"
            - call: "POST /applications/${app_a}/submit"
              payload: {}
              as: TradeAlly
              as_user_id: "${ally_id}"
            - call: "POST /applications"
              payload: { program_year_id: "${py_id}", trade_ally_id: "${ally_id}", customer_account_number: "C2", service_address: "2 B St", invoice_number: "I-2", invoice_date: "2026-08-01" }
              as: TradeAlly
              as_user_id: "${ally_id}"
              captures: { app_b: $.data.id }
            - call: "POST /line-items"
              payload: { application_id: "${app_b}", measure_id: "${m1}", quantity: 1 }
              as: TradeAlly
              as_user_id: "${ally_id}"
            - call: "POST /applications/${app_b}/submit"
              payload: {}
              as: TradeAlly
              as_user_id: "${ally_id}"
            - call: "POST /applications"
              payload: { program_year_id: "${py_id}", trade_ally_id: "${ally_id}", customer_account_number: "C3", service_address: "3 C St", invoice_number: "I-3", invoice_date: "2026-08-01" }
              as: TradeAlly
              as_user_id: "${ally_id}"
              captures: { app_c: $.data.id }
            - call: "POST /line-items"
              payload: { application_id: "${app_c}", measure_id: "${m1}", quantity: 1 }
              as: TradeAlly
              as_user_id: "${ally_id}"
            - call: "POST /applications/${app_c}/submit"
              payload: {}
              as: TradeAlly
              as_user_id: "${ally_id}"
          trigger:
            - call: "POST /applications/${app_a}/verify"
              payload: {}
              as: VerificationInspector
            - call: "POST /applications/${app_b}/withdraw"
              payload: {}
              as: TradeAlly
              as_user_id: "${ally_id}"
            - call: "POST /applications/${app_c}/reject"
              payload: {}
              as: ProgramAdministrator
          assert:
            - "RebateApplication.${app_a}.status == 'VERIFIED'"
            - "RebateApplication.${app_b}.status == 'WITHDRAWN'"
            - "RebateApplication.${app_c}.status == 'REJECTED'"

  # ===========================================================================
  # Rule 4 — transitive_cascade (different triggers, depth >= 3 and >= 2)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: inspection_failed_cascade_depth3
        grounds:
          - state_machines.Inspection.PENDING_to_FAILED
          - state_machines.RebateApplication.PRE_INSPECTION_to_REJECTED
        distinguishing_aspect: |
          Cascade of depth 3 triggered by POST /inspections/{id}/complete with
          outcome=FAILED: (1) Inspection.outcome PENDING→FAILED, (2) which
          itself causes parent RebateApplication.status PRE_INSPECTION→REJECTED,
          (3) which causes ProgramYear.committed_cents to be decremented AND
          ProgramYear.version incremented AND TradeAlly.performance_score
          recomputed. Each hop caused by the previous, not by the original
          trigger directly.
        test_recipe:
          setup:
            - "OPEN ProgramYear with application #5 SUBMITTED (inspection_required=true via SAMPLE_EVERY_N)"
            - "Application #5 has had a PRE inspection scheduled; application is in PRE_INSPECTION"
            - "TradeAlly ACTIVE with starting performance_score=100"
            - "Logical clock 2026-08-13"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-13T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /program-years"
              payload: { program_code: "RES-HVAC-2026", program_year_label: "PY2026", budget_cap_cents: 20000000, savings_goal_kwh: 500000 }
              as: ProgramAdministrator
              captures: { py_id: $.data.id }
            - call: "POST /measures"
              payload: { program_year_id: "${py_id}", measure_code: "M1", measure_name: "M1", base_rate_cents: 10000, deemed_kwh_per_unit: 100 }
              as: ProgramAdministrator
              captures: { m1: $.data.id }
            - call: "POST /program-years/${py_id}/open"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /trade-allies"
              payload: { ally_name: "Acme", license_number: "LIC-001" }
              as: ProgramAdministrator
              captures: { ally_id: $.data.id }
            - call: "POST /trade-allies/${ally_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /applications"
              payload: { program_year_id: "${py_id}", trade_ally_id: "${ally_id}", customer_account_number: "C1", service_address: "1 A St", invoice_number: "I-1", invoice_date: "2026-08-01" }
              as: TradeAlly
              as_user_id: "${ally_id}"
              captures: { app1: $.data.id }
