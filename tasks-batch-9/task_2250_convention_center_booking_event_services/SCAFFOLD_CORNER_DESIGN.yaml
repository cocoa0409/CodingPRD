              as: SalesManager
            - call: "POST /convention-center/bookings/${bk_bc_id}/holds"
              payload: { expected_booking_version: "${bk_bc_v1}" }
              as: SalesManager
              captures: { hold_bc_id: $.data.id }
            - call: "POST /convention-center/holds/${hold_bc_id}/confirm-first-option"
