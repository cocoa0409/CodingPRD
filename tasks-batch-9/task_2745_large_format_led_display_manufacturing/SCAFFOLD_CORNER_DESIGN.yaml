            - call: "POST /burn-in-runs"
              payload: { cabinet_id: "${cab}", burn_in_chamber_id: "${ch_lo}", window_start: "2026-08-02T00:00:00.000Z", window_end: "2026-08-03T00:00:00.000Z", slots_required: 1, drive_pct: 85, ambient_c: 45.0 }
              as: QAEngineer
              as_user_id: "qa-1"
              captures: { err_chamber: $.data.error_id }
            - call: "POST /burn-in-runs"
              payload: { cabinet_id: "${cab}", burn_in_chamber_id: "${ch_hi}", window_start: "2026-08-02T00:00:00.000Z", window_end: "2026-08-03T00:00:00.000Z", slots_required: 1, drive_pct: 90, ambient_c: 45.0 }
              as: QAEngineer
              as_user_id: "qa-1"
              captures: { run: $.data.id }
          assert:
            - "trigger call 1 -> 422 with ${err_model} == 'ERR_DRIVE_LEVEL_UNSAFE'   # chamber allows 95, the model does not"
            - "trigger call 2 -> 422 with ${err_chamber} == 'ERR_DRIVE_LEVEL_UNSAFE'   # the model allows 90, the chamber does not"
            - "trigger call 3 -> 201: BurnInRun.${run}.drive_pct == 90 and run_state == 'SCHEDULED'   # exactly at min(90, 95)"
            - "after the two rejections Cabinet.${cab}.cabinet_state was still POPULATED, which is why trigger call 3 was allowed to schedule at all"
            - "after trigger call 3: Cabinet.${cab}.cabinet_state == BURN_IN and BurnInChamber.${ch_hi}.reserved_slot_total == 1"
            - "BurnInChamber.${ch_lo}.reserved_slot_total == 0   # the rejected run reserved nothing"

      - name: project_data_load_at_and_above_the_capacity_line
        claim_type: violation_to_error
        grounds:
          - validations[priority=53]
          - errors.ERR_DATA_LOAD_EXCEEDS_CAPACITY
          - calculations.project_data_load_pct
        distinguishing_aspect: |
          The gate is on the DERIVED percentage rather than on any submitted field,
          and the boundary is inclusive: a 1 mbps port yields 200.00% and is
          refused, while a 2 mbps port yields exactly 100.00% and is accepted. So
          the comparison must be `> 100.00` on a value that itself came out of a
          ceil over the pixel budget and a floor over the derated port capacity.
        test_recipe:
          setup:
            - "One FP10-IN DisplayModel; a 1x1 project needs ceil(1024 x 10 x 3 x 60 / 1e6) = 2 mbps."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: PlantAdmin
              as_user_id: "adm-1"
