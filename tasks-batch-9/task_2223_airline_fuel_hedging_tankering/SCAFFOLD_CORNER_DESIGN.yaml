            - "Trigger call 2: data.mtm_value_usd == 250000.00 and data.margin_requirement_usd == 0.00 (released by settlement)."
            - "Trigger call 3: data.utilized_credit_usd == 0.00, data.utilization_pct == 0.00, data.credit_posture == \"NORMAL\", data.open_margin_call_count == 1, data.posted_collateral_usd == 0.00."
