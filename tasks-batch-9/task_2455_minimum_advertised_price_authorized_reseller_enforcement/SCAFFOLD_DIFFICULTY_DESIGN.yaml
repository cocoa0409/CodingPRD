  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: agreement_activation_blocked_by_withdrawn_policy_state
        grounds:
          - state_machines.ResellerAgreement.COUNTERSIGNED_to_ACTIVE
          - state_machines.PricingPolicy.PUBLISHED_to_WITHDRAWN
          - validations[priority=10]
          - entities.ResellerAgreement.fields.policy_id
          - entities.ResellerAgreement.fields.activated_at
          - entities.Reseller.fields.authorization_status
        distinguishing_aspect: |
          Entity pair ResellerAgreement -> PricingPolicy: the COUNTERSIGNED -> ACTIVE
          transition is legal on the agreement's own axis and the acting role is
          correct, yet it is refused solely because the referenced policy left
          PUBLISHED for WITHDRAWN after countersignature. The reseller stays stranded
          in PENDING_AGREEMENT / HOLD(PENDING_AUTHORIZATION).
        test_recipe:
          setup:
            - "PricingPolicy MAP-2026-M published effective_from 2026-08-01T00:00:00Z."
            - "Reseller created (APPLIED / HOLD / PENDING_AUTHORIZATION), agreement drafted against that policy, sent (reseller -> PENDING_AGREEMENT) and countersigned by the reseller with non_negotiation_acknowledged true."
            - "Counsel then withdraws the policy, so at activation time the referenced PricingPolicy.status == WITHDRAWN while the agreement itself is a perfectly valid COUNTERSIGNED row."
            - "Clock held at 2026-08-01T00:00:00Z throughout."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pricing-policies"
              payload: { policy_code: "MAP-2026-M", non_negotiation_ack_required: true }
              as: BrandChannelManager
              captures: { pol_id: $.data.id }
            - call: "POST /pricing-policies/${pol_id}/submit-review"
              payload: {}
              as: BrandChannelManager
            - call: "POST /pricing-policies/${pol_id}/review-decision"
              payload: { decision: "APPROVE", legal_review_notes: "Cleared." }
              as: BrandLegalCounsel
              as_user_id: "counsel-1"
            - call: "POST /pricing-policies/${pol_id}/publish"
              payload: { effective_from: "2026-08-01T00:00:00Z" }
              as: BrandLegalCounsel
              as_user_id: "counsel-1"
              captures: { pol_published: $.data.status }
            - call: "POST /resellers"
              payload: { legal_name: "Hotel Retail LLC", contact_email: "notices@hotelretail.example", primary_channel: "PHYSICAL_RETAIL" }
              as: BrandChannelManager
              captures: { rs_id: $.data.id }
            - call: "POST /reseller-agreements"
              payload: { reseller_id: "${rs_id}", policy_id: "${pol_id}", permitted_channels: ["PHYSICAL_RETAIL"], quality_obligations: ["AUTHORIZED_SERVICE_ONLY"], term_ends_at: "2027-08-01T00:00:00Z", price_terms_included: false }
              as: BrandChannelManager
              captures: { ag_id: $.data.id }
            - call: "POST /reseller-agreements/${ag_id}/send"
              payload: {}
              as: BrandChannelManager
            - call: "POST /reseller-agreements/${ag_id}/respond"
              payload: { decision: "COUNTERSIGN", non_negotiation_acknowledged: true }
              as: Reseller
              as_user_id: "${rs_id}"
              captures: { ag_countersigned: $.data.status, ag_v: $.data.version }
            - call: "POST /pricing-policies/${pol_id}/withdraw"
              payload: { withdrawn_reason: "Superseded framework under antitrust re-review." }
              as: BrandLegalCounsel
              as_user_id: "counsel-1"
              captures: { pol_withdrawn: $.data.status }
          trigger:
            - call: "POST /reseller-agreements/${ag_id}/activate"
              payload: {}
              as: BrandChannelManager
              captures: { err_id: $.data.error_id }
          assert:
            - "${pol_published} == PUBLISHED and ${ag_countersigned} == COUNTERSIGNED and ${pol_withdrawn} == WITHDRAWN"
            - "${err_id} == ERR_POLICY_NOT_PUBLISHED (priority 10 business_referential, HTTP 409 or 422)"
            - "ResellerAgreement.${ag_id}.status == COUNTERSIGNED and ResellerAgreement.${ag_id}.activated_at == null"
            - "ResellerAgreement.${ag_id}.version == ${ag_v} (the refused transition mutates nothing)"
            - "Reseller.${rs_id}.authorization_status == PENDING_AGREEMENT and supply_status == HOLD and hold_reason == PENDING_AUTHORIZATION"
            - "PricingPolicy.${pol_id}.status == WITHDRAWN and PricingPolicy.${pol_id}.withdrawn_reason == 'Superseded framework under antitrust re-review.'"
            - "the agreement's own preconditions were all satisfiable, so the refusal is attributable only to the other entity's state"

      - name: serial_ship_downstream_gated_by_reseller_supply_axis
        grounds:
          - state_machines.SerialUnit.SHIPPED_TO_DISTRIBUTOR_to_SHIPPED_TO_RESELLER
          - state_machines.Reseller.OPEN_to_HOLD_QUALITY_OBLIGATION
          - state_machines.Reseller.HOLD_to_OPEN
          - validations[priority=7]
          - entities.SerialUnit.fields.downstream_reseller_id
          - entities.SerialUnit.fields.shipped_downstream_at
        distinguishing_aspect: |
          A different entity pair (SerialUnit -> Reseller) and a different axis: the
          unit is in the only state from which the downstream shipment is declared and
          the acting Distributor owns it, but the shipment is refused while the target
          reseller's supply_status is HOLD(QUALITY_OBLIGATION); releasing the hold with
          no change to the SerialUnit makes the identical request succeed.
        test_recipe:
          setup:
            - "PricingPolicy MAP-2026-N published; Product SKU-SER-5 serialization_enabled true."
            - "Distributor West Distribution; Reseller AUTHORIZED sourcing from it under an ACTIVE agreement."
            - "SerialUnit SN-50 created in SHIPPED_TO_DISTRIBUTOR for that distributor (downstream_reseller_id null, version 1)."
            - "The reseller is then placed on supply HOLD with hold_reason QUALITY_OBLIGATION; its authorization_status remains AUTHORIZED."
            - "Clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pricing-policies"
              payload: { policy_code: "MAP-2026-N" }
              as: BrandChannelManager
              captures: { pol_id: $.data.id }
            - call: "POST /pricing-policies/${pol_id}/submit-review"
              payload: {}
              as: BrandChannelManager
            - call: "POST /pricing-policies/${pol_id}/review-decision"
              payload: { decision: "APPROVE", legal_review_notes: "Cleared." }
              as: BrandLegalCounsel
              as_user_id: "counsel-1"
            - call: "POST /pricing-policies/${pol_id}/publish"
              payload: { effective_from: "2026-08-01T00:00:00Z" }
              as: BrandLegalCounsel
              as_user_id: "counsel-1"
            - call: "POST /products"
              payload: { sku: "SKU-SER-5", name: "Aurora Turntable Mk2", msrp_cents: 18000, standard_map_floor_cents: 13000, governing_policy_id: "${pol_id}", serialization_enabled: true }
              as: BrandChannelManager
              captures: { prod_id: $.data.id }
            - call: "POST /distributors"
              payload: { legal_name: "West Distribution", annual_chargeback_cap_cents: 5000000 }
              as: BrandChannelManager
              captures: { d_id: $.data.id }
            - call: "POST /resellers"
              payload: { legal_name: "India Retail LLC", contact_email: "notices@indiaretail.example", primary_channel: "OWN_WEBSITE", sourcing_distributor_id: "${d_id}" }
              as: BrandChannelManager
              captures: { rs_id: $.data.id }
            - call: "POST /reseller-agreements"
              payload: { reseller_id: "${rs_id}", policy_id: "${pol_id}", permitted_channels: ["OWN_WEBSITE"], quality_obligations: ["PACKAGING_INTACT"], term_ends_at: "2027-08-01T00:00:00Z", price_terms_included: false }
              as: BrandChannelManager
              captures: { ag_id: $.data.id }
            - call: "POST /reseller-agreements/${ag_id}/send"
              payload: {}
              as: BrandChannelManager
            - call: "POST /reseller-agreements/${ag_id}/respond"
              payload: { decision: "COUNTERSIGN", non_negotiation_acknowledged: true }
              as: Reseller
              as_user_id: "${rs_id}"
            - call: "POST /reseller-agreements/${ag_id}/activate"
              payload: {}
              as: BrandChannelManager
            - call: "POST /serial-units"
              payload: { serial_number: "SN-50", product_id: "${prod_id}", lot_code: "LOT-F", shipped_distributor_id: "${d_id}" }
              as: BrandChannelManager
              captures: { su_id: $.data.id, su_status0: $.data.status, su_v0: $.data.version }
            - call: "POST /resellers/${rs_id}/supply-status"
              payload: { supply_status: "HOLD", hold_reason: "QUALITY_OBLIGATION", note: "Packaging obligation audit finding." }
              as: BrandChannelManager
              captures: { supply_hold: $.data.supply_status, auth_hold: $.data.authorization_status }
          trigger:
            - call: "POST /serial-units/${su_id}/ship-downstream"
              payload: { downstream_reseller_id: "${rs_id}" }
              as: Distributor
              as_user_id: "${d_id}"
              captures: { err_id: $.data.error_id }
            - call: "POST /resellers/${rs_id}/supply-status"
              payload: { supply_status: "OPEN" }
              as: BrandChannelManager
              captures: { supply_reopen: $.data.supply_status }
            - call: "POST /serial-units/${su_id}/ship-downstream"
              payload: { downstream_reseller_id: "${rs_id}" }
              as: Distributor
              as_user_id: "${d_id}"
              captures: { su_status2: $.data.status, su_v2: $.data.version }
          assert:
            - "${su_status0} == SHIPPED_TO_DISTRIBUTOR and ${su_v0} == 1 and ${supply_hold} == HOLD and ${auth_hold} == AUTHORIZED"
            - "${err_id} == ERR_INVALID_STATE (priority 7 state; the gate is the other entity's supply axis, not the SerialUnit's own status)"
            - "${supply_reopen} == OPEN and Reseller.${rs_id}.hold_reason == NONE"
            - "${su_status2} == SHIPPED_TO_RESELLER and SerialUnit.${su_id}.status == SHIPPED_TO_RESELLER"
            - "SerialUnit.${su_id}.downstream_reseller_id == ${rs_id} and shipped_downstream_at == 2026-08-01T00:00:00Z"
            - "${su_v2} == ${su_v0} + 1 == 2 (the refused first attempt did not consume a version, so exactly one mutation landed)"
            - "Reseller.${rs_id}.authorization_status == AUTHORIZED throughout — only the supply axis ever changed"

