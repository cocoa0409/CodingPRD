          setup:
            - "CHAIN C on a 100 MW OPERATIONAL solar project, deal 25.000 MW at a flat 22.00 with basis BUYER settled at its own NODE, EFFECTIVE with an empty CP template; hourly expectation 7.0000 MWh."
