            - { call: "POST /mtm/outcome-assessments", payload: { member_id: "${m_id}", assessed_at: "2026-03-01", weight_kg: 80.0, hba1c_pct: 7.1 }, as: Dietitian }
            - { call: "POST /mtm/reauthorizations", payload: { member_id: "${m_id}", authorized_units: 4, max_amount_cents: 500000, start_date: "2026-01-01", end_date: "2026-04-30" }, as: CareCoordinator, captures: { a_id: $.data.id } }
            - { call: "POST /mtm/reauthorizations/${a_id}/approve", payload: { authorization_number: "AUTH-410" }, as: PayerReviewer }
            - { call: "POST /mtm/delivery-routes", payload: { driver_id: "drv-10", route_date: "2026-04-15", start_time: "08:00", end_time: "12:00", capacity_stops: 20 }, as: LogisticsCoordinator, captures: { rt_id: $.data.id } }
            - { call: "POST /mtm/delivery-routes/${rt_id}/dispatch", payload: {}, as: LogisticsCoordinator }
            - { call: "POST /mtm/deliveries", payload: { member_id: "${m_id}", menu_cycle_id: "${mc_id}", route_id: "${rt_id}", service_date: "2026-04-15" }, as: LogisticsCoordinator, captures: { d_id: $.data.id } }
            - { call: "POST /mtm/deliveries/${d_id}/out-for-delivery", payload: {}, as: Driver }
            - { call: "POST /mtm/deliveries/${d_id}/mark-delivered", payload: {}, as: Driver }
            - { call: "GET /mtm/reauthorizations/${a_id}", payload: {}, as: BillingSpecialist, captures: { a_v: $.data.version } }
            - { call: "POST /mtm/claims", payload: { member_id: "${m_id}", menu_cycle_id: "${mc_id}", authorization_id: "${a_id}", expected_reauthorization_version: "${a_v}" }, as: BillingSpecialist, captures: { c_id: $.data.id } }
            - { call: "POST /mtm/_clock/set_current_utc", payload: { to_iso8601: "2026-05-02T00:00:00Z" }, as: ProgramAdmin }
          trigger:
