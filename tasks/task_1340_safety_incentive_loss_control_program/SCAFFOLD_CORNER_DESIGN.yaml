      - name: non_assignee_cannot_complete_action_item_returns_unauthorized
        claim_type: ownership_denied
        grounds: [state_machines.ActionItem.ASSIGNED_to_COMPLETED, "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "Complete requires X-User-ID == assignee_id OR the CommitteeChair role; a Supervisor who is neither gets 403."
        test_recipe:
          setup: ["ACTIVE program (quorum_min 1); held meeting with one ASSIGNED action item owned by A; M is chair; B is a plain supervisor"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: EHSAdmin }
            - { call: "POST /safety/programs", payload: { program_year: 2026, scoring_variant: "LEADING_ONLY", incentive_budget_cents: 500000, observation_target_rate: 5.0, exposure_hours: 100000, payroll_by_class: [{ hazard_class: "LOW", payroll_cents: 10000000 }, { hazard_class: "MODERATE", payroll_cents: 10000000 }, { hazard_class: "HIGH", payroll_cents: 10000000 }], elr_by_class: [{ hazard_class: "LOW", elr: 1.0 }, { hazard_class: "MODERATE", elr: 1.0 }, { hazard_class: "HIGH", elr: 1.0 }], quorum_min: 1 }, as: EHSAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /safety/programs/${p_id}/activate", payload: {}, as: EHSAdmin }
            - { call: "POST /safety/job-roles", payload: { title: "Laborer", hazard_class: "LOW" }, as: EHSAdmin, captures: { jr_id: $.data.id } }
            - { call: "POST /safety/employees", payload: { full_name: "Ann A", job_role_id: "${jr_id}", hired_on: "2026-01-05", committee_member: true }, as: EHSAdmin, captures: { a_id: $.data.id } }
            - { call: "POST /safety/employees", payload: { full_name: "Marta M", job_role_id: "${jr_id}", hired_on: "2026-01-05" }, as: EHSAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /safety/employees", payload: { full_name: "Bob B", job_role_id: "${jr_id}", hired_on: "2026-01-05" }, as: EHSAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /safety/committee-meetings", payload: { program_id: "${p_id}", scheduled_start: "2026-06-10T09:00:00Z", scheduled_end: "2026-06-10T10:00:00Z", location: "Room 1" }, as: CommitteeChair, as_user_id: "${m_id}", captures: { mt_id: $.data.id } }
            - { call: "POST /safety/committee-meetings/${mt_id}/hold", payload: { attendee_ids: ["${a_id}"] }, as: CommitteeChair, as_user_id: "${m_id}" }
            - { call: "POST /safety/committee-meetings/${mt_id}/action-items", payload: { assignee_id: "${a_id}", description: "Inspect eyewash", due_date: "2026-06-20T00:00:00Z" }, as: CommitteeChair, as_user_id: "${m_id}", captures: { ai_id: $.data.id } }
          trigger:
            - { call: "POST /safety/action-items/${ai_id}/complete", payload: {}, as: Supervisor, as_user_id: "${b_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_UNAUTHORIZED and http status 403 (B is neither assignee nor CommitteeChair); item stays ASSIGNED"

  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_config_patch_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[program-config-stale-update]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "PATCH incentive-config with the version observed at creation (1) succeeds and bumps to 2; replaying the same patch with the now-stale expected_program_version 1 is rejected 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["DRAFT program; version 1 captured at creation"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: EHSAdmin }
            - { call: "POST /safety/programs", payload: { program_year: 2026, scoring_variant: "LEADING_ONLY", incentive_budget_cents: 500000, observation_target_rate: 5.0, exposure_hours: 100000, payroll_by_class: [{ hazard_class: "LOW", payroll_cents: 10000000 }, { hazard_class: "MODERATE", payroll_cents: 10000000 }, { hazard_class: "HIGH", payroll_cents: 10000000 }], elr_by_class: [{ hazard_class: "LOW", elr: 1.0 }, { hazard_class: "MODERATE", elr: 1.0 }, { hazard_class: "HIGH", elr: 1.0 }] }, as: EHSAdmin, captures: { p_id: $.data.id, v1: $.data.version } }
          trigger:
            - { call: "PATCH /safety/programs/${p_id}/incentive-config", payload: { expected_program_version: "${v1}", observation_target_rate: 6.0 }, as: EHSAdmin, captures: { v2: $.data.version, rate: $.data.observation_target_rate } }
            - { call: "PATCH /safety/programs/${p_id}/incentive-config", payload: { expected_program_version: "${v1}", observation_target_rate: 7.0 }, as: EHSAdmin, captures: { err: $.data.error_id } }
          assert:
            - "first patch: 200, observation_target_rate == 6.0, version == 2"
            - "second patch with stale version: error_id == ERR_STALE_VERSION, http 412; rate remains 6.0"

      - name: occ_stale_emr_forecast_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[emr-forecast-stale-program]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "EMR forecast creation consumes the observed program version: a create at version 2 succeeds (program version advances to 3); a second create still carrying expected_program_version 2 is rejected 412."
        test_recipe:
          setup: ["ACTIVE program at version 2 (create + activate)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-01-15T00:00:00Z" }, as: EHSAdmin }
            - { call: "POST /safety/programs", payload: { program_year: 2026, scoring_variant: "LEADING_ONLY", incentive_budget_cents: 500000, observation_target_rate: 5.0, exposure_hours: 100000, payroll_by_class: [{ hazard_class: "LOW", payroll_cents: 10000000 }, { hazard_class: "MODERATE", payroll_cents: 10000000 }, { hazard_class: "HIGH", payroll_cents: 10000000 }], elr_by_class: [{ hazard_class: "LOW", elr: 1.0 }, { hazard_class: "MODERATE", elr: 1.0 }, { hazard_class: "HIGH", elr: 1.0 }] }, as: EHSAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /safety/programs/${p_id}/activate", payload: {}, as: EHSAdmin, captures: { v2: $.data.version } }
          trigger:
            - { call: "POST /safety/emr-forecasts", payload: { program_id: "${p_id}", expected_program_version: "${v2}" }, as: EHSAdmin, captures: { f_id: $.data.id } }
            - { call: "POST /safety/emr-forecasts", payload: { program_id: "${p_id}", expected_program_version: "${v2}" }, as: EHSAdmin, captures: { err: $.data.error_id } }
          assert:
            - "first create: 201 (program version advances to 3 as a declared side effect)"
            - "second create with the same expected_program_version: error_id == ERR_STALE_VERSION, http 412; only one forecast exists"

      - name: sweep_second_run_is_idempotent
        claim_type: ops_run_checkpoint
        grounds: [calculations.program_posture, "state_machines.ControlItem.PLANNED_to_OVERDUE"]
        distinguishing_aspect: "A second sweep without clock movement flips nothing: overdue_controls == 0 on run two, sweep_index advances to 2, posture stays WATCH from the single overdue control."
        test_recipe:
          setup: ["ACTIVE program; one hazard assessed MEDIUM (SLA due 2026-07-01) with one PLANNED control due 2026-06-10; clock advanced to 2026-06-15"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: EHSAdmin }
            - { call: "POST /safety/programs", payload: { program_year: 2026, scoring_variant: "LEADING_ONLY", incentive_budget_cents: 500000, observation_target_rate: 5.0, exposure_hours: 100000, payroll_by_class: [{ hazard_class: "LOW", payroll_cents: 10000000 }, { hazard_class: "MODERATE", payroll_cents: 10000000 }, { hazard_class: "HIGH", payroll_cents: 10000000 }], elr_by_class: [{ hazard_class: "LOW", elr: 1.0 }, { hazard_class: "MODERATE", elr: 1.0 }, { hazard_class: "HIGH", elr: 1.0 }] }, as: EHSAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /safety/programs/${p_id}/activate", payload: {}, as: EHSAdmin }
            - { call: "POST /safety/job-roles", payload: { title: "Laborer", hazard_class: "LOW" }, as: EHSAdmin, captures: { jr_id: $.data.id } }
            - { call: "POST /safety/employees", payload: { full_name: "Ann A", job_role_id: "${jr_id}", hired_on: "2026-01-05" }, as: EHSAdmin, captures: { a_id: $.data.id } }
            - { call: "POST /safety/employees", payload: { full_name: "Marta M", job_role_id: "${jr_id}", hired_on: "2026-01-05" }, as: EHSAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /safety/hazards", payload: { program_id: "${p_id}", location: "L1", description: "Noise", identified_by: "${a_id}" }, as: SafetyManager, as_user_id: "${m_id}", captures: { h_id: $.data.id } }
            - { call: "POST /safety/hazards/${h_id}/assess", payload: { severity: 3, probability: 2 }, as: SafetyManager, as_user_id: "${m_id}" }
            - { call: "POST /safety/hazards/${h_id}/controls", payload: { description: "Enclosure", implementer_id: "${a_id}", due_date: "2026-06-10T00:00:00Z" }, as: SafetyManager, as_user_id: "${m_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-15T00:00:00Z" }, as: EHSAdmin }
          trigger:
            - { call: "POST /safety/programs/${p_id}/sweep", payload: {}, as: EHSAdmin, captures: { od1: $.data.overdue_controls, post1: $.data.posture, idx1: $.data.sweep_index } }
            - { call: "POST /safety/programs/${p_id}/sweep", payload: {}, as: EHSAdmin, captures: { od2: $.data.overdue_controls, post2: $.data.posture, idx2: $.data.sweep_index } }
          assert:
            - "first sweep: overdue_controls == 1, posture == WATCH (1 overdue < 3, no SLA breach), sweep_index == 1"
            - "second sweep: overdue_controls == 0 (already OVERDUE rows are not re-flipped), posture == WATCH, sweep_index == 2"

      - name: derived_pending_training_count_reconciles
        claim_type: derived_field_reconciliation
        grounds: [entities.Employee.fields.pending_required_training_count]
        distinguishing_aspect: "pending_required_training_count tracks live required assignments: 2 after auto-creation from a two-course role, 1 after completing one — recomputed on every mutation, not cached stale."
        test_recipe:
          setup: ["HIGH role requiring LOTO + PPE courses; employee E auto-assigned both"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: EHSAdmin }
            - { call: "POST /safety/training-courses", payload: { title: "LOTO", hazard_class: "HIGH", validity_months: 12 }, as: EHSAdmin, captures: { c1: $.data.id } }
            - { call: "POST /safety/training-courses", payload: { title: "PPE", hazard_class: "HIGH", validity_months: 6 }, as: EHSAdmin, captures: { c2: $.data.id } }
            - { call: "POST /safety/job-roles", payload: { title: "Electrician", hazard_class: "HIGH", required_course_ids: ["${c1}", "${c2}"] }, as: EHSAdmin, captures: { jr_id: $.data.id } }
            - { call: "POST /safety/employees", payload: { full_name: "Eli E", job_role_id: "${jr_id}", hired_on: "2026-01-05" }, as: EHSAdmin, captures: { e_id: $.data.id, p0: $.data.pending_required_training_count } }
            - { call: "GET /safety/training-assignments", payload: { employee_id: "${e_id}", course_id: "${c1}" }, as: EHSAdmin, captures: { ta1: "$.data[0].id" } }
          trigger:
            - { call: "POST /safety/training-assignments/${ta1}/complete", payload: {}, as: Supervisor, as_user_id: "${e_id}" }
            - { call: "GET /safety/employees/${e_id}", payload: {}, as: EHSAdmin, captures: { p1: $.data.pending_required_training_count } }
          assert:
            - "at creation: pending_required_training_count == 2"
            - "after completing the LOTO assignment: pending_required_training_count == 1"

      - name: hazard_version_increments_on_every_mutation
        claim_type: optimistic_concurrency
        grounds: [entities.Hazard]
        distinguishing_aspect: "common_fields version ticks on every mutation including cascaded auto-transitions: 1 at create, 2 after assess, 3 after the first control's auto-transition to CONTROLS_PLANNED."
        test_recipe:
          setup: ["ACTIVE program; employees A/M"]
          setup_api_calls:
