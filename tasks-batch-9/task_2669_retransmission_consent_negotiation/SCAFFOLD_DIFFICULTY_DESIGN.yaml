      - name: impasse_good_faith_meeting_count_exactly_three_satisfies
        grounds:
          - validations[priority=23]
          - state_machines.Negotiation.AWAITING_STATION_OFFER_to_IMPASSE
          - entities.Negotiation.fields.good_faith_meeting_count
          - endpoints[POST /retrans/negotiations/{id}/declare-impasse]
          - errors.ERR_GOOD_FAITH_NOT_SATISFIED
        distinguishing_aspect: |
          A different metric (the count of MEETING_HELD good-faith entries against
          MIN_GOOD_FAITH_MEETINGS) on a different endpoint (declare-impasse rather than settlement
          issuance). Two MEETING_HELD entries plus one PROPOSAL_EXCHANGED entry give a log of three
          rows but a meeting count of two and must be refused, proving the counter filters on
          event_type; the third MEETING_HELD lands exactly on the threshold and must be accepted,
          proving the comparison is >= and not >.
        test_recipe:
          setup:
            - "One CBS station, one CABLE distributor, a filed election with an OPEN negotiation"
            - "One station offer and one distributor counter-offer, so the both-sides requirement is already met"
            - "Two MEETING_HELD entries and one PROPOSAL_EXCHANGED entry on the good-faith log"
