            - call: "GET /crew-bookings"
              payload: { limit: 10, offset: 0 }
              as: CrewMember
              as_user_id: "${crew_a}"
            - call: "GET /crew-bookings/${bk_b}"
              payload: {}
              as: CrewMember
              as_user_id: "${crew_a}"
            - call: "GET /crew-bookings"
              payload: { crew_member_id: "${crew_a}", limit: 10, offset: 0 }
