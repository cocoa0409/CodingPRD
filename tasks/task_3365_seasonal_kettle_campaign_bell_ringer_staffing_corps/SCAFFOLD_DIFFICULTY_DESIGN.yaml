          assert:
            - "Campaign.${campaign_id}.total_raised_cents before the second attribution == 25000"
            - "Campaign.${campaign_id}.total_raised_cents after the second attribution == 35000"
            - "DigitalGiving.${g2}.attributed_cents == 0 after the reverse"
            - "Campaign.${campaign_id}.total_raised_cents after the reverse == 25000"
