            - { call: "POST /benefit-schedules/${sche}/publish", payload: { expected_series_version: "${se2_v}" }, as: CarrierAdmin }
            - { call: "POST /policy-series/${se2}/activate", payload: {}, as: CarrierAdmin }
            - { call: "POST /enrollment-campaigns", payload: { employer_group_id: "${ge2}", counselor_id: "${ce2}", window_start: "2026-09-01T00:00:00Z", window_end: "2026-10-01T00:00:00Z", guaranteed_issue: true }, as: BenefitCounselor, captures: { ce2_cam: $.data.id } }
