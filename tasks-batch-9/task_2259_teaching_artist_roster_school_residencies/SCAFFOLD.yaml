    input: [to_roster_status, "reason?"]
    output: TeachingArtist
    side_effects: ["Per the TeachingArtist roster-axis state machine", "SUSPENDED fires CASCADE A links 2-4 (sessions VACATED, residency staffing_status, school partnership_health)", "increments TeachingArtist.version by 1"]

  - method: POST
