  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: variance_window_overlap_half_open
        grounds:
          - state_machines.VariancePermit.UNDER_REVIEW_to_ISSUED
          - errors[ERR_VARIANCE_WINDOW_OVERLAP]
          - entities.VariancePermit.fields.approved_start
          - entities.VariancePermit.fields.approved_end
        distinguishing_aspect: "Resource = Property; half-open [approved_start, approved_end) semantics: an overlapping second window is rejected, but a window starting exactly at the first's end (adjacent) is allowed."
        test_recipe:
          setup:
            - "COMMERCIAL property with an ISSUED CONSTRUCTION variance for [2026-06-01, 2026-06-10)."
          setup_api_calls:
            - { call: "POST /properties", payload: { address: "15 Site Rd", zoning_type: "COMMERCIAL" }, as: CodeOfficer, captures: { prop_id: "$.data.id" } }
            - { call: "POST /variance-permits", payload: { property_id: "${prop_id}", permit_type: "CONSTRUCTION", requested_start: "2026-06-01T00:00:00Z", requested_end: "2026-06-10T00:00:00Z", permitted_max_db: 90 }, as: PermitClerk, captures: { v1: "$.data.id" } }
            - { call: "POST /variance-permits/${v1}/issue", payload: {}, as: PermitClerk }
            - { call: "POST /variance-permits", payload: { property_id: "${prop_id}", permit_type: "CONSTRUCTION", requested_start: "2026-06-05T00:00:00Z", requested_end: "2026-06-15T00:00:00Z", permitted_max_db: 90 }, as: PermitClerk, captures: { v2: "$.data.id" } }
            - { call: "POST /variance-permits", payload: { property_id: "${prop_id}", permit_type: "CONSTRUCTION", requested_start: "2026-06-10T00:00:00Z", requested_end: "2026-06-20T00:00:00Z", permitted_max_db: 90 }, as: PermitClerk, captures: { v3: "$.data.id" } }
          trigger:
            - { call: "POST /variance-permits/${v2}/issue", payload: {}, as: PermitClerk, captures: { err: "$.data.error_id" } }
            - { call: "POST /variance-permits/${v3}/issue", payload: {}, as: PermitClerk, captures: { v3_status: "$.data.status" } }
          assert:
            - "v2 issue -> HTTP 409, data.error_id == ERR_VARIANCE_WINDOW_OVERLAP"
            - "v3 issue -> HTTP 200, VariancePermit.${v3}.status == ISSUED (adjacent window at 2026-06-10 allowed under half-open semantics)"

      - name: hearing_slot_officer_buffer_overlap
        grounds:
          - state_machines.Enforcement.CONTESTED_to_HEARING_SCHEDULED
          - errors[ERR_HEARING_SLOT_CONFLICT]
          - entities.Hearing.fields.hearing_officer_id
          - entities.Hearing.fields.scheduled_at
        distinguishing_aspect: "Resource = HearingOfficer; closed-slot + HEARING_BUFFER_MINUTES(60) semantics: a second hearing 15 min after the first slot's end is rejected, while one 90 min after end is allowed — buffer arithmetic differs from the variance half-open rule."
        test_recipe:
          setup:
            - "Two separate COMMERCIAL properties each carrying a contested level-1 CITATION; officer hof-9 has a hearing at 10:00 (30 min) for the first."
          setup_api_calls:
            - { call: "POST /noise-policies", payload: { zoning_type: "COMMERCIAL", day_limit_db: 65, night_limit_db: 55, day_start_hour: 7, night_start_hour: 22 }, as: SystemAdmin }
