# ============================================================================
# SCAFFOLD — Urology Practice & In-Office Procedure Suite
# §1.0 Response Envelope, §1.1 Entities, §1.2 State Machines,
# §1.2.1 Concurrency Rules, §1.3 Calculations, §1.4 Validations,
# §1.5 Endpoints, §1.6 Errors, §1.7 RBAC
# ============================================================================

scenario: |
  Generate task harder than expert level!

  2739. Urology Practice & In-Office Procedure Suite (urology group): procedure suite
  scheduling for cystoscopy, urodynamics and prostate biopsy with room turnover,
  pre-procedure preparation instructions and antibiotic protocols, pathology specimen
  handling, tracking and result notification loops, in-office imaging and ultrasound
  accreditation requirements, surveillance protocol recall for stones, bladder cancer
  and prostate monitoring, sterile processing of scopes with reprocessing logs,
  incontinence and pelvic health program integration with therapy referrals, supply
  consignment and single-use device inventory

domain_name: urology-procedure-suite
api_prefix: /urology

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: compliance_audit
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
    - optimistic_concurrency

  entity_topology: flat
  # Twelve peer entities linked by explicit foreign keys. No entity is nested in a
  # URL path: every collection lives directly under /urology/<collection>, and the
  # parent-child relation is carried only by the FK field plus a filtered-list GET.

  state_machine_shape: parallel
  # ProcedureCase carries two independent state dimensions (schedule_status and
  # clearance_status) that advance on different endpoints; Specimen likewise carries
  # chain_status x notification_status. ScopeAsset.status is a true cycle
  # (AVAILABLE -> IN_USE -> SOILED -> REPROCESSING -> AVAILABLE). ConsignmentLot's
  # billing_status is compound (derived from its own unit counters).

  relationship_patterns:
    - one_to_many          # Patient -> ProcedureCase, ScopeAsset -> ReprocessingLog
    - self_referential     # SurveillanceRecall.predecessor_recall_id -> SurveillanceRecall.id
    - cross_aggregate      # ProcedureCase.device_lot_id -> ConsignmentLot.id (supply aggregate)
    # no polymorphic associations: every FK names exactly one parent entity

  role_model: segregation_of_duties
  # Six entity-backed clinical roles own disjoint verb sets, plus one opaque
  # operator role. The sterile-processing attestation rule forbids the same
  # Provider from both performing and attesting a reprocessing stage.

  consistency_model: immediate

  difficulty_level: expert_plus
  # 12 entities / 56 endpoints / 59 error codes / 6 calculations (2 dual-variant)
  # / 9 state machines (2 cyclic, 2 with independent dimensions, 3 branching,
  # 1 compound) / 4 OCC parents.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ============================================================================
# §1.1 Entity-Relationship Table
# `common_fields: true` expands to id (server-minted UUID, no type prefix),
# created_at, updated_at (ISO 8601 UTC, three fractional digits) and version
# (integer, starts at 1, +1 on every mutation including cascaded side effects).
# `id` is identity only and never participates in any business decision.
# ============================================================================

entities:

  - name: Provider
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: clinician or staff display name
      - name: npi
        type: string
        source: input
        description: national provider identifier, unique across Provider rows
        constraints: unique; 10 characters
      - name: role_type
        type: enum
        source: input
        description: which RBAC role this Provider may authenticate as
        constraints: "one of UROLOGIST, RN, TECH, SCHEDULER, PATHOLOGY_LIAISON, PELVIC_COORDINATOR"
      - name: credential_status
        type: enum
        source: input
        description: whether the Provider may act at all
        default: ACTIVE
        constraints: "one of ACTIVE, SUSPENDED"
      - name: hld_certified
        type: boolean
        source: input
        description: certified to perform the HIGH_LEVEL_DISINFECT reprocessing stage
        default: false
      - name: ultrasound_accreditation_expires_on
        type: string
        source: input
        description: "ISO date (YYYY-MM-DD) on which this Provider's ultrasound accreditation lapses; null means never accredited"
        default: null

  - name: Patient
    parent: null
    common_fields: true
    fields:
      - name: mrn
        type: string
        source: input
        description: medical record number, unique across Patient rows
        constraints: unique
      - name: full_name
        type: string
        source: input
        description: patient display name
      - name: date_of_birth
        type: string
        source: input
        description: "ISO date (YYYY-MM-DD)"
      - name: primary_urologist_id
        type: string
        source: input
        description: "FK -> Provider.id; the Provider must have role_type UROLOGIST"
      - name: egfr
        type: number
        source: input
        description: estimated glomerular filtration rate, drives renal dose and duration adjustments
        constraints: ">= 0"
      - name: anticoagulant_flag
        type: boolean
        source: input
        description: patient is on anticoagulation, lengthens prostate biopsy room time
        default: false
      - name: antibiotic_allergy_class
        type: enum
        source: input
        description: drug class the patient must not receive
        default: NONE
        constraints: "one of NONE, FLUOROQUINOLONE, CEPHALOSPORIN, SULFA, AMINOGLYCOSIDE"
      - name: outstanding_recall_count
        type: integer
        source: computed
        description: count of SurveillanceRecall rows for this patient with status IN {SCHEDULED_DUE, OVERDUE}
      - name: open_notification_count
        type: integer
        source: computed
        description: count of Specimen rows whose case_id belongs to this patient and whose notification_status IN {PENDING, ATTEMPTED, ESCALATED}

  - name: ProcedureRoom
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: room label, unique across ProcedureRoom rows
        constraints: unique
      - name: room_type
        type: enum
        source: input
        description: which procedure classes this room may host
        constraints: "one of CYSTO_SUITE, URODYNAMICS_LAB, IMAGING_BAY"
      - name: turnover_minutes
        type: integer
        source: input
        description: baseline turnover cleaning time for this room before the floor and cleanup-class multipliers of calculations.case_occupancy_window are applied
        default: 10
        constraints: ">= 0"
      - name: room_status
        type: enum
        source: input
        description: whether the room accepts new occupancy blocks
        default: OPEN
        constraints: "one of OPEN, CLOSED"
      - name: accreditation_body
        type: string
        source: input
        description: accrediting organization for in-office imaging/ultrasound in this room
        default: null
      - name: accreditation_expires_on
        type: string
        source: input
        description: "ISO date (YYYY-MM-DD) on which the room's imaging accreditation lapses; null means never accredited"
        default: null
      - name: occupied_block_count
        type: integer
        source: computed
        description: count of ProcedureCase rows with room_id == this room and schedule_status IN {SCHEDULED, IN_ROOM, COMPLETED}

  - name: ProcedureType
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: procedure catalogue code, unique across ProcedureType rows
        constraints: "unique; one of CYSTOSCOPY, URODYNAMICS, PROSTATE_BIOPSY, OFFICE_ULTRASOUND"
      - name: base_minutes
        type: integer
        source: input
        description: baseline in-room procedure minutes before patient-specific adjustments
        constraints: ">= 1"
      - name: cleanup_class
        type: enum
        source: input
        description: HIGH doubles the room's baseline turnover minutes
        constraints: "one of LOW, HIGH"
      - name: allowed_room_type
        type: enum
        source: input
        description: the only ProcedureRoom.room_type this procedure may be booked into
        constraints: "one of CYSTO_SUITE, URODYNAMICS_LAB, IMAGING_BAY"
      - name: requires_scope
        type: boolean
        source: input
        description: case needs a ScopeAsset assignment before check-in
      - name: requires_specimen
        type: boolean
        source: input
        description: specimens may be collected only for types with this flag true
      - name: requires_antibiotic
        type: boolean
        source: input
        description: case needs an ADMINISTERED AntibioticOrder before check-in
      - name: consignment_required
        type: boolean
        source: input
        description: case needs a single-use device reservation against a ConsignmentLot before check-in
      - name: single_use_device_sku
        type: string
        source: input
        description: the only ConsignmentLot.sku accepted for this type's device reservation
        default: null
      - name: required_prep_codes
        type: array
        source: input
        description: "prep instruction codes that must all be acknowledged before clearance; members drawn from NPO_MIDNIGHT, BOWEL_PREP, HOLD_ANTICOAGULANT, BLADDER_FILL, ARRIVE_WITH_ESCORT; may be the empty array"
        default: []

  - name: ProcedureCase
    parent: null
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id"
      - name: procedure_type_id
        type: string
        source: input
        description: "FK -> ProcedureType.id"
      - name: room_id
        type: string
        source: input
        description: "FK -> ProcedureRoom.id; room_type must equal the type's allowed_room_type"
      - name: primary_provider_id
        type: string
        source: input
        description: "FK -> Provider.id; the operating urologist, subject to the buffered provider-overlap rule"
      - name: scheduled_start_at
        type: datetime
        source: input
        description: start of the in-room window (ISO 8601 UTC, three fractional digits)
      - name: procedure_minutes
        type: integer
        source: computed
        description: in-room minutes from calculations.case_occupancy_window
      - name: turnover_minutes
        type: integer
        source: computed
        description: post-procedure room turnover minutes from calculations.case_occupancy_window
      - name: scheduled_end_at
        type: datetime
        source: computed
        description: scheduled_start_at + procedure_minutes
      - name: block_end_at
        type: datetime
        source: computed
        description: scheduled_end_at + turnover_minutes; the exclusive upper bound of the room occupancy interval
      - name: schedule_status
        type: enum
        source: system
        description: lifecycle dimension driven by the schedule/check-in/complete/cancel/no-show endpoints
        default: DRAFT
        constraints: "one of DRAFT, SCHEDULED, IN_ROOM, COMPLETED, CANCELLED, NO_SHOW"
      - name: clearance_status
        type: enum
        source: system
        description: preparation dimension driven by the prep-acknowledgement and clearance-review endpoints, independent of schedule_status
        default: PENDING_PREP
        constraints: "one of PENDING_PREP, PREP_ACKNOWLEDGED, PREP_WAIVED, CLEARED, BLOCKED"
      - name: acknowledged_prep_codes
        type: array
        source: system
        description: distinct prep instruction codes acknowledged so far, appended in acknowledgement order
        default: []
      - name: clearance_block_reason
        type: string
        source: system
        description: reason code recorded by the most recent BLOCK clearance decision; cleared to null on a later CLEAR or WAIVE
        default: null
      - name: scope_asset_id
        type: string
        source: system
        description: "FK -> ScopeAsset.id; set by the scope-assignment endpoint, reset to null when the case is cancelled or marked NO_SHOW"
        default: null
      - name: device_lot_id
        type: string
        source: system
        description: "FK -> ConsignmentLot.id; set by the device-reservation endpoint and retained after consumption for billing traceability"
        default: null
      - name: device_quantity
        type: integer
        source: system
        description: units of the single-use device held against device_lot_id
        default: 0
      - name: device_state
        type: enum
        source: system
        description: disposition of this case's single-use device units
        default: NONE
        constraints: "one of NONE, RESERVED, CONSUMED, RELEASED, WASTED"
      - name: checked_in_at
        type: datetime
        source: system
        description: logical-clock instant of the check-in transition
        default: null
      - name: completed_at
        type: datetime
        source: system
        description: logical-clock instant of the complete transition
        default: null
      - name: cancel_reason_code
        type: string
        source: system
        description: reason recorded by cancel, or the constant NO_SHOW_GRACE_ELAPSED when the case was marked NO_SHOW
        default: null
      - name: blocking_reason_codes
        type: array
        source: computed
        description: ordered unmet check-in gates from calculations.check_in_readiness_gates, sorted by validation priority
      - name: indication_note
        type: string
        source: input
        description: free-text clinical indication
        default: null

  - name: AntibioticOrder
    parent: null
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> ProcedureCase.id"
      - name: ordered_by_provider_id
        type: string
        source: input
        description: "FK -> Provider.id; must equal the acting X-User-ID and have role_type UROLOGIST"
      - name: requested_agent
        type: enum
        source: input
        description: AUTO delegates the choice to calculations.antibiotic_agent_selection; any other value pins the agent explicitly
        constraints: "one of AUTO, CIPROFLOXACIN, CEFAZOLIN, TMP_SMX, GENTAMICIN"
      - name: agent
        type: enum
        source: computed
        description: the resolved agent
        constraints: "one of CIPROFLOXACIN, CEFAZOLIN, TMP_SMX, GENTAMICIN"
      - name: dose_mg
        type: integer
        source: computed
        description: renal-adjusted dose from calculations.antibiotic_agent_selection
      - name: route
        type: enum
        source: computed
        description: fixed per agent by the AGENT_TABLE constant
        constraints: "one of ORAL, IV"
      - name: prophylaxis_window_start_at
        type: datetime
        source: computed
        description: case.scheduled_start_at minus PROPHYLAXIS_WINDOW_MIN; administration is accepted only inside the closed interval [prophylaxis_window_start_at, case.scheduled_start_at]
      - name: administered_at
        type: datetime
        source: input
        description: instant the dose was given, supplied by the administer endpoint
        default: null
      - name: status
        type: enum
        source: system
        description: order lifecycle
        default: ORDERED
        constraints: "one of ORDERED, ADMINISTERED, CANCELLED"

  - name: ScopeAsset
    parent: null
    common_fields: true
    fields:
      - name: serial_number
        type: string
        source: input
        description: manufacturer serial, unique across ScopeAsset rows
        constraints: unique
      - name: scope_model
        type: string
        source: input
        description: model designation
      - name: channel_count
        type: integer
        source: input
        description: number of working channels requiring manual cleaning
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: sterile-processing lifecycle position
        default: AVAILABLE
        constraints: "one of AVAILABLE, IN_USE, SOILED, REPROCESSING, QUARANTINED"
      - name: cycles_since_leak_test
        type: integer
        source: system
        description: completed patient cycles since the last PASSing LEAK_TEST stage
        default: 0
      - name: leak_test_required
        type: boolean
        source: system
        description: set true when cycles_since_leak_test >= LEAK_TEST_CYCLE_LIMIT; blocks assignment until a LEAK_TEST stage passes
        default: false
      - name: hld_pass_at
        type: datetime
        source: system
        description: instant the most recent HIGH_LEVEL_DISINFECT stage completed with outcome PASS
        default: null
      - name: reprocess_due_at
        type: datetime
        source: system
        description: instant by which reprocessing must complete after soiling; also the expiry of a completed reprocessing cycle
        default: null

  - name: ReprocessingLog
    parent: null
    common_fields: true
    fields:
      - name: scope_asset_id
        type: string
        source: input
        description: "FK -> ScopeAsset.id"
      - name: case_id
        type: string
        source: input
        description: "FK -> ProcedureCase.id; the case that soiled the scope, null for maintenance cycles"
        default: null
      - name: stage
        type: enum
        source: input
        description: reprocessing stage this log records
        constraints: "one of PRECLEAN, LEAK_TEST, MANUAL_CLEAN, HIGH_LEVEL_DISINFECT, DRY_STORE"
      - name: performed_by_provider_id
        type: string
        source: input
        description: "FK -> Provider.id; must have role_type TECH and credential_status ACTIVE"
      - name: attested_by_provider_id
        type: string
        source: input
        description: "FK -> Provider.id; second TECH who attests completion, must differ from performed_by_provider_id"
        default: null
      - name: started_at
        type: datetime
        source: computed
        description: logical-clock instant at log creation
      - name: completed_at
        type: datetime
        source: computed
        description: logical-clock instant at log completion
        default: null
      - name: outcome
        type: enum
        source: input
        description: stage result recorded by the complete endpoint
        default: null
        constraints: "one of PASS, FAIL"
      - name: log_status
        type: enum
        source: system
        description: whether the stage is still open
        default: OPEN
        constraints: "one of OPEN, CLOSED"

  - name: Specimen
    parent: null
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> ProcedureCase.id; the case must be IN_ROOM at collection"
      - name: collected_by_provider_id
        type: string
        source: input
        description: "FK -> Provider.id; must equal the acting X-User-ID and have role_type RN"
      - name: container_label
        type: string
        source: input
        description: label on the container, unique among Specimen rows sharing the same case_id
        constraints: unique per case_id
      - name: specimen_type
        type: enum
        source: input
        description: specimen class, determines the surveillance protocol of any recall the result creates
        constraints: "one of PROSTATE_CORE, BLADDER_WASHING, BIOPSY_FRAGMENT"
      - name: site_code
        type: string
        source: input
        description: anatomic site identifier
      - name: collected_at
        type: datetime
        source: computed
        description: logical-clock instant at collection
      - name: accession_number
        type: string
        source: input
        description: laboratory accession number recorded by the accession endpoint
        default: null
      - name: received_at
        type: datetime
        source: input
        description: instant the laboratory received the container, supplied by the accession endpoint
        default: null
      - name: condition_on_receipt
        type: enum
        source: input
        description: container condition recorded by the accession endpoint; COMPROMISED sends the specimen to REJECTED
        default: null
        constraints: "one of INTACT, COMPROMISED"
      - name: chain_status
        type: enum
        source: system
        description: chain-of-custody dimension
        default: COLLECTED
        constraints: "one of COLLECTED, ACCESSIONED, RESULTED, REJECTED"
      - name: pathology_result
        type: enum
        source: input
        description: diagnostic grade recorded by the result endpoint
        default: null
        constraints: "one of BENIGN, ATYPICAL, MALIGNANT, INSUFFICIENT"
      - name: result_at
        type: datetime
        source: computed
        description: logical-clock instant the result was filed; anchor of the notification escalation clock
        default: null
      - name: notification_status
        type: enum
        source: system
        description: result-notification dimension, advances independently of chain_status
        default: NOT_REQUIRED
        constraints: "one of NOT_REQUIRED, PENDING, ATTEMPTED, ACKNOWLEDGED, ESCALATED, FAILED"
      - name: notification_attempt_count
        type: integer
        source: system
        description: number of notification attempts recorded so far
        default: 0
      - name: escalation_due_at
        type: datetime
        source: computed
        description: instant from calculations.notification_escalation_clock after which the recall sweep escalates an unacknowledged result
        default: null

  - name: SurveillanceRecall
    parent: null
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id"
      - name: protocol
        type: enum
        source: input
        description: surveillance programme this recall belongs to
        constraints: "one of STONE, BLADDER_CANCER, PROSTATE"
      - name: risk_tier
        type: enum
        source: input
        description: risk stratification that selects the recall interval
        constraints: "one of LOW, INTERMEDIATE, HIGH"
      - name: anchor_date
        type: string
        source: input
        description: "ISO date (YYYY-MM-DD) the protocol interval is measured from under the PROTOCOL_ANCHORED variant"
      - name: interval_months
        type: integer
        source: computed
        description: months between surveillance events, from the RECALL_INTERVAL_MONTHS constant keyed on (protocol, risk_tier)
      - name: due_on
        type: string
        source: computed
        description: "ISO date the next surveillance event is due, from calculations.recall_due_date under the variant named by due_basis"
      - name: due_basis
        type: enum
        source: computed
        description: which variant of calculations.recall_due_date produced due_on
        default: PROTOCOL_ANCHORED
        constraints: "one of PROTOCOL_ANCHORED, EVENT_ANCHORED"
      - name: status
        type: enum
        source: system
        description: recall lifecycle
        default: SCHEDULED_DUE
        constraints: "one of SCHEDULED_DUE, OVERDUE, SATISFIED, SUPERSEDED, CLOSED"
      - name: lapse_days
        type: integer
        source: computed
        description: max(0, whole days from due_on to the logical clock date), recomputed by the recall sweep
        default: 0
      - name: predecessor_recall_id
        type: string
        source: system
        description: "FK -> SurveillanceRecall.id; the same-protocol recall this row superseded"
        default: null
      - name: source_specimen_id
        type: string
        source: input
        description: "FK -> Specimen.id; the pathology result that created this recall, null for manually entered recalls"
        default: null
      - name: satisfying_case_id
        type: string
        source: system
        description: "FK -> ProcedureCase.id; the completed surveillance case that satisfied this recall"
        default: null
      - name: closed_reason
        type: string
        source: input
        description: reason recorded by the close endpoint
        default: null

  - name: PelvicHealthReferral
    parent: null
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id"
      - name: source_case_id
        type: string
        source: input
        description: "FK -> ProcedureCase.id; the case that generated the referral, null for direct referrals"
        default: null
      - name: program
        type: enum
        source: input
        description: pelvic health programme requested
        constraints: "one of PELVIC_FLOOR_PT, BEHAVIORAL_TRAINING, BIOFEEDBACK"
      - name: requested_visits
        type: integer
        source: input
        description: visits the referring clinician asked for, capped at acceptance by PROGRAM_VISIT_CAP
        constraints: ">= 1"
      - name: visits_authorized
        type: integer
        source: computed
        description: units granted at acceptance, min(requested_visits, authorized_visits, PROGRAM_VISIT_CAP[program])
        default: 0
      - name: visits_used
        type: integer
        source: system
        description: units consumed by logged visits
        default: 0
      - name: visits_remaining
        type: integer
        source: system
        description: units still available to log
        default: 0
      - name: visits_forfeited
        type: integer
        source: system
        description: units surrendered when the referral was withdrawn
        default: 0
      - name: status
        type: enum
        source: system
        description: referral lifecycle
        default: REQUESTED
        constraints: "one of REQUESTED, ACCEPTED, DECLINED, WAITLISTED, COMPLETED, WITHDRAWN"
      - name: waitlist_position
        type: integer
        source: computed
        description: 1 + count of PelvicHealthReferral rows with the same program and status WAITLISTED at the moment of the WAITLIST decision
        default: null
      - name: therapy_start_by
        type: string
        source: computed
        description: "ISO date = acceptance clock date + THERAPY_START_WINDOW_DAYS; the first logged visit must fall on or before it"
        default: null
      - name: first_visit_date
        type: string
        source: system
        description: "ISO date of the earliest LOG visit action still standing"
        default: null
      - name: decline_reason
        type: string
        source: input
        description: reason recorded by a DECLINE decision
        default: null

  - name: ConsignmentLot
    parent: null
    common_fields: true
    fields:
      - name: supplier_name
        type: string
        source: input
        description: consignment vendor
      - name: sku
        type: string
        source: input
        description: catalogue number of the single-use device, matched against ProcedureType.single_use_device_sku
      - name: device_class
        type: enum
        source: input
        description: device family
        constraints: "one of SINGLE_USE_SCOPE_SHEATH, BIOPSY_NEEDLE, URODYNAMICS_CATHETER_KIT, ULTRASOUND_PROBE_COVER"
      - name: quantity_received
        type: integer
        source: input
        description: units delivered on consignment; the conserved total of the lot
        constraints: ">= 1"
      - name: quantity_available
        type: integer
        source: system
        description: units neither held nor spent; initialized to quantity_received
      - name: quantity_reserved
        type: integer
        source: system
        description: units held by cases whose device_state is RESERVED
        default: 0
      - name: quantity_consumed
        type: integer
        source: system
        description: units spent by cases whose device_state is CONSUMED
        default: 0
      - name: quantity_returned
        type: integer
        source: system
        description: units sent back to the supplier
        default: 0
      - name: quantity_wasted
        type: integer
        source: system
        description: units opened but unusable because the case was marked NO_SHOW
        default: 0
      - name: unit_price_cents
        type: integer
        source: input
        description: consignment list price per unit in cents
        constraints: ">= 0"
      - name: lot_expires_on
        type: string
        source: input
        description: "ISO date (YYYY-MM-DD) after which the lot may not be reserved"
      - name: billed_amount_cents
        type: integer
        source: computed
        description: chargeable value from calculations.consignment_billing under the variant named by billing_basis
        default: 0
      - name: billing_basis
        type: enum
        source: computed
        description: which variant of calculations.consignment_billing produced billed_amount_cents
        default: PROVISIONAL
        constraints: "one of PROVISIONAL, FINAL"
      - name: billing_status
        type: enum
        source: computed
        description: compound status derived from the unit counters by calculations.consignment_billing
        default: CONSIGNED
        constraints: "one of CONSIGNED, PARTIALLY_INVOICED, INVOICED, RETURNED"

# ============================================================================
# §1.2 State Machine Table
# ProcedureCase and Specimen each carry two independent dimensions; ScopeAsset
# and SurveillanceRecall each contain a true cycle; Specimen's notification
# dimension self-loops; PelvicHealthReferral branches with divergent side-effect
# sets; ConsignmentLot.billing_status is derived from its own unit counters.
# ============================================================================

state_machines:

  - entity: ProcedureCase
    dimension: schedule_status
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:

      - from: DRAFT
        to: SCHEDULED
        trigger: "POST /urology/procedure-cases/{id}/schedule"
        actor: Scheduler
        preconditions:
          - "room.room_status == OPEN"
          - "room.room_type == procedure_type.allowed_room_type"
          - "expected_room_version == room.version"
          - "no ProcedureCase other than this one with the same room_id and schedule_status IN {SCHEDULED, IN_ROOM, COMPLETED} has a half-open occupancy interval [scheduled_start_at, block_end_at) intersecting this case's interval"
          - "no ProcedureCase other than this one with the same primary_provider_id and schedule_status IN {SCHEDULED, IN_ROOM, COMPLETED} has a closed buffered interval [scheduled_start_at - PROVIDER_GAP_MIN, scheduled_end_at + PROVIDER_GAP_MIN] intersecting this case's buffered interval"
        side_effects:
          - "recompute procedure_minutes, turnover_minutes, scheduled_end_at and block_end_at per calculations.case_occupancy_window"
          - "increments ProcedureRoom.version by 1 (the room's occupancy ledger changed)"
          - "recompute ProcedureRoom.occupied_block_count"
          - "recompute ProcedureCase.blocking_reason_codes per calculations.check_in_readiness_gates"

      - from: SCHEDULED
        to: SCHEDULED
        trigger: "POST /urology/procedure-cases/{id}/reschedule"
        actor: Scheduler
        preconditions:
          - "target room (room_id from the body when present, otherwise the current room_id) has room_status == OPEN and room_type == procedure_type.allowed_room_type"
          - "the recomputed half-open interval [new scheduled_start_at, new block_end_at) does not intersect any other ProcedureCase in the target room with schedule_status IN {SCHEDULED, IN_ROOM, COMPLETED}"
          - "the recomputed closed buffered provider interval does not intersect any other ProcedureCase of the same primary_provider_id with schedule_status IN {SCHEDULED, IN_ROOM, COMPLETED}"
        side_effects:
          - "recompute the whole window per calculations.case_occupancy_window"
          - "increments ProcedureRoom.version by 1 for the room being vacated and by 1 for the room being taken (a single increment when both are the same room)"
          - "recompute ProcedureRoom.occupied_block_count for every room whose version changed"
        note: "Self-loop: the case remains SCHEDULED. This is the cycle in the schedule dimension."

      - from: SCHEDULED
        to: IN_ROOM
        trigger: "POST /urology/procedure-cases/{id}/check-in"
        actor: ProcedureNurse
        preconditions:
          - "clearance_status IN {CLEARED, PREP_WAIVED}"
          - "if room.room_type IN {IMAGING_BAY, URODYNAMICS_LAB}: room.accreditation_expires_on is not null and room.accreditation_expires_on >= logical clock date"
          - "if room.room_type IN {IMAGING_BAY, URODYNAMICS_LAB}: primary_provider.ultrasound_accreditation_expires_on is not null and >= logical clock date"
          - "if procedure_type.requires_antibiotic: at least one AntibioticOrder with case_id == this case has status ADMINISTERED"
          - "if procedure_type.requires_scope: scope_asset_id is not null and that ScopeAsset has status IN_USE, hld_pass_at is not null, and reprocess_due_at is null"
          - "logical clock instant >= scheduled_start_at - EARLY_CHECKIN_WINDOW_MIN"
          - "if procedure_type.consignment_required: device_state == RESERVED"
        side_effects:
          - "checked_in_at = logical clock instant"
          - "blocking_reason_codes recomputed to the empty array"

      - from: IN_ROOM
        to: COMPLETED
        trigger: "POST /urology/procedure-cases/{id}/complete"
        actor: [ProcedureNurse, Urologist]
        preconditions:
          - "schedule_status == IN_ROOM"
          - "every Specimen with case_id == this case has chain_status != COLLECTED (all collected containers have left the room)"
        side_effects:
          - "completed_at = logical clock instant"
          - "CASCADE A hop 2 (caused by the case reaching COMPLETED): the single highest-ranked SurveillanceRecall of this case's patient whose status IN {SCHEDULED_DUE, OVERDUE} and whose protocol satisfies procedure_type.code IN PROTOCOL_SURVEILLANCE_TYPES[protocol], ranked due_on ASC then created_at ASC, transitions to SATISFIED with satisfying_case_id = this case; when the candidate set is empty no recall is touched"
          - "CASCADE A hop 3 (caused by hop 2's recall reaching SATISFIED): Patient.outstanding_recall_count is recomputed and Patient.version increments by 1"
          - "if scope_asset_id is not null: ScopeAsset.status IN_USE -> SOILED, reprocess_due_at = logical clock instant + SCOPE_REPROCESS_SLA_HOURS, cycles_since_leak_test += 1, ScopeAsset.version increments by 1"
          - "caused by that scope reaching SOILED with the incremented counter: when cycles_since_leak_test >= LEAK_TEST_CYCLE_LIMIT, ScopeAsset.leak_test_required = true"
          - "if device_state == RESERVED: device_state -> CONSUMED, lot.quantity_reserved -= device_quantity, lot.quantity_consumed += device_quantity, ConsignmentLot.version increments by 1"
          - "caused by the lot's consumed counter changing: lot.billed_amount_cents and lot.billing_basis are recomputed under the FINAL variant of calculations.consignment_billing, then lot.billing_status is re-derived from the counters"
          - "if procedure_type.code == URODYNAMICS and no PelvicHealthReferral exists with source_case_id == this case: no referral is auto-created (referrals are always explicit)"

      - from: DRAFT
        to: CANCELLED
        trigger: "POST /urology/procedure-cases/{id}/cancel"
        actor: Scheduler
        preconditions:
          - "schedule_status IN {DRAFT, SCHEDULED}"
        side_effects:
          - "cancel_reason_code = body cancel_reason_code"
          - "if scope_asset_id is not null and that ScopeAsset.status == IN_USE: scope.status -> AVAILABLE, ScopeAsset.version increments by 1, case.scope_asset_id -> null"
          - "if device_state == RESERVED: device_state -> RELEASED, lot.quantity_reserved -= device_quantity, lot.quantity_available += device_quantity, ConsignmentLot.version increments by 1, lot.billed_amount_cents recomputed under the PROVISIONAL variant, lot.billing_status re-derived"
          - "every AntibioticOrder with case_id == this case and status == ORDERED transitions to CANCELLED (orders already ADMINISTERED are left untouched)"
          - "blocking_reason_codes recomputed to the empty array"
        note: "Compensating action for scope assignment and device reservation; the conserved-quantity invariants of §1.3 must hold before and after."

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /urology/procedure-cases/{id}/cancel"
        actor: Scheduler
        preconditions:
          - "schedule_status == SCHEDULED"
        side_effects:
          - "all side effects of the DRAFT -> CANCELLED transition"
          - "increments ProcedureRoom.version by 1 and recomputes ProcedureRoom.occupied_block_count (the occupancy block is released)"

      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /urology/procedure-cases/{id}/no-show"
        actor: Scheduler
        preconditions:
          - "schedule_status == SCHEDULED"
          - "logical clock instant > scheduled_start_at + NO_SHOW_GRACE_MIN"
        side_effects:
          - "cancel_reason_code = the constant string NO_SHOW_GRACE_ELAPSED"
          - "if scope_asset_id is not null and that ScopeAsset.status == IN_USE: scope.status -> AVAILABLE, ScopeAsset.version increments by 1, case.scope_asset_id -> null"
          - "if device_state == RESERVED: device_state -> WASTED, lot.quantity_reserved -= device_quantity, lot.quantity_wasted += device_quantity, ConsignmentLot.version increments by 1, lot.billed_amount_cents recomputed under the PROVISIONAL variant, lot.billing_status re-derived"
          - "every AntibioticOrder with case_id == this case and status == ORDERED transitions to CANCELLED"
          - "increments ProcedureRoom.version by 1 and recomputes ProcedureRoom.occupied_block_count"
        note: "Divergent branch: cancel RELEASES the device units back to quantity_available, no-show WASTES them. Both leave quantity_received unchanged."

  - entity: ProcedureCase
    dimension: clearance_status
    initial_state: PENDING_PREP
    terminal_states: []
    transitions:

      - from: PENDING_PREP
        to: PREP_ACKNOWLEDGED
        trigger: "POST /urology/procedure-cases/{id}/prep-acknowledgements"
        actor: [ProcedureNurse, Scheduler]
        preconditions:
          - "schedule_status IN {DRAFT, SCHEDULED}"
          - "instruction_code IN procedure_type.required_prep_codes"
        side_effects:
          - "instruction_code appended to acknowledged_prep_codes when not already present (a repeat acknowledgement of the same code leaves the array unchanged and is not an error)"
          - "recompute blocking_reason_codes"

      - from: PREP_ACKNOWLEDGED
        to: PREP_ACKNOWLEDGED
        trigger: "POST /urology/procedure-cases/{id}/prep-acknowledgements"
        actor: [ProcedureNurse, Scheduler]
        preconditions:
          - "schedule_status IN {DRAFT, SCHEDULED}"
          - "instruction_code IN procedure_type.required_prep_codes"
        side_effects:
          - "instruction_code appended to acknowledged_prep_codes when not already present"
          - "recompute blocking_reason_codes"

      - from: PENDING_PREP
        to: CLEARED
        trigger: "POST /urology/procedure-cases/{id}/clearance-review with decision CLEAR"
        actor: [ProcedureNurse, Urologist]
        preconditions:
          - "schedule_status IN {DRAFT, SCHEDULED}"
          - "every code in procedure_type.required_prep_codes is present in acknowledged_prep_codes (vacuously true when required_prep_codes is the empty array)"
        side_effects:
          - "clearance_block_reason -> null"
          - "recompute blocking_reason_codes"
        note: "Reachable directly from PENDING_PREP only for types whose required_prep_codes is the empty array."

      - from: PREP_ACKNOWLEDGED
        to: CLEARED
        trigger: "POST /urology/procedure-cases/{id}/clearance-review with decision CLEAR"
        actor: [ProcedureNurse, Urologist]
        preconditions:
          - "schedule_status IN {DRAFT, SCHEDULED}"
          - "every code in procedure_type.required_prep_codes is present in acknowledged_prep_codes"
        side_effects:
          - "clearance_block_reason -> null"
          - "recompute blocking_reason_codes"

      - from: BLOCKED
        to: CLEARED
        trigger: "POST /urology/procedure-cases/{id}/clearance-review with decision CLEAR"
        actor: [ProcedureNurse, Urologist]
        preconditions:
          - "schedule_status IN {DRAFT, SCHEDULED}"
          - "every code in procedure_type.required_prep_codes is present in acknowledged_prep_codes"
        side_effects:
          - "clearance_block_reason -> null"
          - "recompute blocking_reason_codes"
        note: "Cycle in the clearance dimension: a blocked case can be re-cleared without leaving the schedule dimension."

      - from: PENDING_PREP
        to: BLOCKED
        trigger: "POST /urology/procedure-cases/{id}/clearance-review with decision BLOCK"
        actor: [ProcedureNurse, Urologist]
        preconditions:
          - "schedule_status IN {DRAFT, SCHEDULED}"
          - "block_reason_code is present in the body"
        side_effects:
          - "clearance_block_reason = block_reason_code"
          - "recompute blocking_reason_codes"

      - from: PREP_ACKNOWLEDGED
        to: BLOCKED
        trigger: "POST /urology/procedure-cases/{id}/clearance-review with decision BLOCK"
        actor: [ProcedureNurse, Urologist]
        preconditions:
          - "schedule_status IN {DRAFT, SCHEDULED}"
          - "block_reason_code is present in the body"
        side_effects:
          - "clearance_block_reason = block_reason_code"
          - "recompute blocking_reason_codes"

      - from: CLEARED
        to: BLOCKED
        trigger: "POST /urology/procedure-cases/{id}/clearance-review with decision BLOCK"
        actor: [ProcedureNurse, Urologist]
        preconditions:
          - "schedule_status IN {DRAFT, SCHEDULED}"
          - "block_reason_code is present in the body"
        side_effects:
          - "clearance_block_reason = block_reason_code"
          - "recompute blocking_reason_codes"

      - from: PENDING_PREP
        to: PREP_WAIVED
        trigger: "POST /urology/procedure-cases/{id}/clearance-review with decision WAIVE"
        actor: Urologist
        preconditions:
          - "schedule_status IN {DRAFT, SCHEDULED}"
          - "the acting role is Urologist (a ProcedureNurse attempting WAIVE is rejected)"
        side_effects:
          - "clearance_block_reason -> null"
          - "recompute blocking_reason_codes"

      - from: BLOCKED
        to: PREP_WAIVED
        trigger: "POST /urology/procedure-cases/{id}/clearance-review with decision WAIVE"
        actor: Urologist
        preconditions:
          - "schedule_status IN {DRAFT, SCHEDULED}"
          - "the acting role is Urologist"
        side_effects:
          - "clearance_block_reason -> null"
          - "recompute blocking_reason_codes"
        note: "The clearance dimension keeps moving while schedule_status stays SCHEDULED; neither dimension gates the other's transitions except at check-in."

  - entity: ScopeAsset
    dimension: status
    initial_state: AVAILABLE
    terminal_states: [QUARANTINED]
    transitions:

      - from: AVAILABLE
        to: IN_USE
        trigger: "POST /urology/procedure-cases/{id}/scope-assignment"
        actor: ProcedureNurse
        preconditions:
          - "case.schedule_status IN {DRAFT, SCHEDULED}"
          - "case.procedure_type.requires_scope == true"
          - "expected_scope_asset_version == scope.version"
          - "scope.leak_test_required == false"
        side_effects:
          - "case.scope_asset_id = scope.id"
          - "increments ScopeAsset.version by 1"
          - "recompute case.blocking_reason_codes"

      - from: IN_USE
        to: AVAILABLE
        trigger: "POST /urology/procedure-cases/{id}/cancel or POST /urology/procedure-cases/{id}/no-show on the holding case"
        actor: Scheduler
        preconditions:
          - "the cancelled or no-showed case's scope_asset_id == scope.id"
        side_effects:
          - "case.scope_asset_id -> null"
          - "increments ScopeAsset.version by 1"
        note: "Compensation: cycles_since_leak_test is NOT incremented because no patient cycle occurred."

      - from: IN_USE
        to: SOILED
        trigger: "POST /urology/procedure-cases/{id}/complete (CASCADE A hop 1)"
        actor: system
        preconditions:
          - "the completing case's scope_asset_id == scope.id"
        side_effects:
          - "cycles_since_leak_test += 1"
          - "reprocess_due_at = logical clock instant + SCOPE_REPROCESS_SLA_HOURS"
          - "increments ScopeAsset.version by 1"
          - "when the incremented cycles_since_leak_test >= LEAK_TEST_CYCLE_LIMIT: leak_test_required = true"

      - from: SOILED
        to: REPROCESSING
        trigger: "POST /urology/reprocessing-logs/{id}/complete with stage PRECLEAN and outcome PASS"
        actor: system
        preconditions:
          - "the log's scope_asset_id == scope.id and log.stage == PRECLEAN and outcome == PASS"
        side_effects:
          - "increments ScopeAsset.version by 1"

      - from: REPROCESSING
        to: AVAILABLE
        trigger: "POST /urology/reprocessing-logs/{id}/complete with stage DRY_STORE and outcome PASS"
        actor: system
        preconditions:
          - "the log's scope_asset_id == scope.id and log.stage == DRY_STORE and outcome == PASS"
          - "a CLOSED PASSing HIGH_LEVEL_DISINFECT log exists for this scope with completed_at >= the scope's most recent SOILED entry"
        side_effects:
          - "reprocess_due_at -> null"
          - "increments ScopeAsset.version by 1"

      - from: SOILED
        to: QUARANTINED
        trigger: "POST /urology/reprocessing-logs/{id}/complete with outcome FAIL"
        actor: system
        preconditions:
          - "the log's scope_asset_id == scope.id and outcome == FAIL"
        side_effects:
          - "CASCADE C hop 2 (caused by the log closing with outcome FAIL): status -> QUARANTINED"
          - "CASCADE C hop 3 (caused by the scope reaching QUARANTINED): leak_test_required = true and reprocess_due_at -> null"
          - "increments ScopeAsset.version by 1"

      - from: REPROCESSING
        to: QUARANTINED
        trigger: "POST /urology/reprocessing-logs/{id}/complete with outcome FAIL"
        actor: system
        preconditions:
          - "the log's scope_asset_id == scope.id and outcome == FAIL"
        side_effects:
          - "CASCADE C hop 2: status -> QUARANTINED"
          - "CASCADE C hop 3: leak_test_required = true and reprocess_due_at -> null"
          - "increments ScopeAsset.version by 1"
        note: "QUARANTINED is terminal: no reprocessing log may be opened against a quarantined scope and it can never be assigned again."

      - from: AVAILABLE
        to: AVAILABLE
        trigger: "POST /urology/reprocessing-logs/{id}/complete with stage LEAK_TEST and outcome PASS on an AVAILABLE scope"
        actor: system
        preconditions:
          - "the log's scope_asset_id == scope.id and log.stage == LEAK_TEST and outcome == PASS"
        side_effects:
          - "cycles_since_leak_test -> 0"
          - "leak_test_required -> false"
          - "increments ScopeAsset.version by 1"
        note: "Self-loop that clears the leak-test debt; this is the only path from leak_test_required true back to false."

  - entity: ReprocessingLog
    dimension: log_status
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:

      - from: OPEN
        to: CLOSED
        trigger: "POST /urology/reprocessing-logs/{id}/complete"
        actor: SterileProcessingTech
        preconditions:
          - "log_status == OPEN"
          - "attested_by_provider_id != performed_by_provider_id"
          - "attested_by_provider_id == the acting X-User-ID"
          - "the attesting Provider has role_type TECH and credential_status ACTIVE"
          - "if stage == HIGH_LEVEL_DISINFECT: the performing Provider has hld_certified == true"
        side_effects:
          - "completed_at = logical clock instant, outcome = body outcome"
          - "the owning ScopeAsset advances per the ScopeAsset machine for this (stage, outcome) pair"
          - "when stage == LEAK_TEST and outcome == PASS on a SOILED or REPROCESSING scope: scope.cycles_since_leak_test -> 0 and scope.leak_test_required -> false"
          - "when stage == HIGH_LEVEL_DISINFECT and outcome == PASS: scope.hld_pass_at = completed_at and ScopeAsset.version increments by 1 (status stays REPROCESSING)"

  - entity: Specimen
    dimension: chain_status
    initial_state: COLLECTED
    terminal_states: [RESULTED, REJECTED]
    transitions:

      - from: COLLECTED
        to: ACCESSIONED
        trigger: "POST /urology/specimens/{id}/accession with condition INTACT"
        actor: PathologyLiaison
        preconditions:
          - "chain_status == COLLECTED"
          - "received_at >= collected_at"
          - "received_at - collected_at <= MAX_TRANSIT_HOURS"
        side_effects:
          - "accession_number and received_at recorded, condition_on_receipt = INTACT"

      - from: COLLECTED
        to: REJECTED
        trigger: "POST /urology/specimens/{id}/accession with condition COMPROMISED"
        actor: PathologyLiaison
        preconditions:
          - "chain_status == COLLECTED"
          - "received_at >= collected_at"
          - "received_at - collected_at <= MAX_TRANSIT_HOURS"
        side_effects:
          - "accession_number and received_at recorded, condition_on_receipt = COMPROMISED"
          - "notification_status NOT_REQUIRED -> PENDING with pathology_result left null and escalation_due_at computed from the INSUFFICIENT grade window of calculations.notification_escalation_clock"
          - "when the source case's procedure_type.code == PROSTATE_BIOPSY: a SurveillanceRecall is created for the patient with protocol PROSTATE, risk_tier INTERMEDIATE, anchor_date = the logical clock date, due_basis PROTOCOL_ANCHORED and source_specimen_id = this specimen; any pre-existing PROSTATE recall of that patient with status IN {SCHEDULED_DUE, OVERDUE} becomes SUPERSEDED and is recorded as the new row's predecessor_recall_id"
        note: "Branch point: the same endpoint forks to ACCESSIONED or REJECTED with disjoint side-effect sets."

      - from: ACCESSIONED
        to: RESULTED
        trigger: "POST /urology/specimens/{id}/result"
        actor: PathologyLiaison
        preconditions:
          - "chain_status == ACCESSIONED"
        side_effects:
          - "CASCADE B hop 1: pathology_result = body pathology_result, result_at = logical clock instant, notification_status NOT_REQUIRED -> PENDING, notification_attempt_count stays 0, escalation_due_at computed per calculations.notification_escalation_clock"
          - "CASCADE B hop 2 (caused by hop 1 filing a graded result): when pathology_result IN {BENIGN, ATYPICAL, MALIGNANT} a SurveillanceRecall is created for the case's patient with protocol = SPECIMEN_PROTOCOL_MAP[specimen_type], risk_tier = RESULT_RISK_TIER[pathology_result], anchor_date = the logical clock date, due_basis PROTOCOL_ANCHORED, source_specimen_id = this specimen; pathology_result INSUFFICIENT creates no recall"
          - "CASCADE B hop 3 (caused by hop 2 inserting the new recall): every other SurveillanceRecall of that patient with the same protocol and status IN {SCHEDULED_DUE, OVERDUE}, processed created_at ASC, transitions to SUPERSEDED, and the newest such row is recorded as the new recall's predecessor_recall_id"
          - "CASCADE B hop 4 (caused by hop 3 changing recall statuses): Patient.outstanding_recall_count recomputed and Patient.version increments by 1"

  - entity: Specimen
    dimension: notification_status
    initial_state: NOT_REQUIRED
    terminal_states: [ACKNOWLEDGED, FAILED]
    transitions:

      - from: NOT_REQUIRED
        to: PENDING
        trigger: "POST /urology/specimens/{id}/result, or POST /urology/specimens/{id}/accession with condition COMPROMISED"
        actor: PathologyLiaison
        preconditions:
          - "notification_status == NOT_REQUIRED"
        side_effects:
          - "escalation_due_at computed per calculations.notification_escalation_clock with notification_attempt_count 0"
          - "recompute Patient.open_notification_count"

      - from: PENDING
        to: ATTEMPTED
        trigger: "POST /urology/specimens/{id}/notification-attempt with outcome UNREACHABLE"
        actor: [PathologyLiaison, ProcedureNurse]
        preconditions:
          - "notification_status IN {PENDING, ATTEMPTED, ESCALATED}"
          - "notification_attempt_count + 1 < MAX_NOTIFY_ATTEMPTS"
        side_effects:
          - "notification_attempt_count += 1"
          - "escalation_due_at recomputed with the new attempt count"

      - from: ATTEMPTED
        to: ATTEMPTED
        trigger: "POST /urology/specimens/{id}/notification-attempt with outcome UNREACHABLE"
        actor: [PathologyLiaison, ProcedureNurse]
        preconditions:
          - "notification_attempt_count + 1 < MAX_NOTIFY_ATTEMPTS"
        side_effects:
          - "notification_attempt_count += 1"
          - "escalation_due_at recomputed with the new attempt count"
        note: "Self-loop: the notification loop cycles while attempts remain."

      - from: ATTEMPTED
        to: FAILED
        trigger: "POST /urology/specimens/{id}/notification-attempt with outcome UNREACHABLE"
        actor: [PathologyLiaison, ProcedureNurse]
        preconditions:
          - "notification_attempt_count + 1 == MAX_NOTIFY_ATTEMPTS"
        side_effects:
          - "notification_attempt_count += 1"
          - "escalation_due_at recomputed with the new attempt count"
          - "recompute Patient.open_notification_count (a FAILED result leaves the open set)"

      - from: PENDING
        to: ACKNOWLEDGED
        trigger: "POST /urology/specimens/{id}/notification-attempt with outcome REACHED"
        actor: [PathologyLiaison, ProcedureNurse]
        preconditions:
          - "notification_status IN {PENDING, ATTEMPTED, ESCALATED}"
        side_effects:
          - "notification_attempt_count += 1"
          - "recompute Patient.open_notification_count"

      - from: ATTEMPTED
        to: ACKNOWLEDGED
        trigger: "POST /urology/specimens/{id}/notification-attempt with outcome REACHED"
        actor: [PathologyLiaison, ProcedureNurse]
        preconditions:
          - "notification_status IN {PENDING, ATTEMPTED, ESCALATED}"
        side_effects:
          - "notification_attempt_count += 1"
          - "recompute Patient.open_notification_count"

      - from: ESCALATED
        to: ACKNOWLEDGED
        trigger: "POST /urology/specimens/{id}/notification-attempt with outcome REACHED"
        actor: [PathologyLiaison, ProcedureNurse]
        preconditions:
          - "notification_status == ESCALATED"
        side_effects:
          - "notification_attempt_count += 1"
          - "recompute Patient.open_notification_count"

      - from: PENDING
        to: ESCALATED
        trigger: "POST /urology/recall-sweeps (system checkpoint step 3)"
        actor: system
        preconditions:
          - "notification_status IN {PENDING, ATTEMPTED}"
          - "escalation_due_at < logical clock instant"
        side_effects:
          - "no attempt counter change"

      - from: ATTEMPTED
        to: ESCALATED
        trigger: "POST /urology/recall-sweeps (system checkpoint step 3)"
        actor: system
        preconditions:
          - "notification_status IN {PENDING, ATTEMPTED}"
          - "escalation_due_at < logical clock instant"
        side_effects:
          - "no attempt counter change"

  - entity: SurveillanceRecall
    dimension: status
    initial_state: SCHEDULED_DUE
    terminal_states: [SATISFIED, SUPERSEDED, CLOSED]
    transitions:

      - from: SCHEDULED_DUE
        to: OVERDUE
        trigger: "POST /urology/recall-sweeps (system checkpoint step 2)"
        actor: system
        preconditions:
          - "status == SCHEDULED_DUE"
          - "due_on < logical clock date (a recall due exactly on the clock date stays SCHEDULED_DUE)"
        side_effects:
          - "lapse_days = whole days from due_on to the logical clock date"

      - from: OVERDUE
        to: SCHEDULED_DUE
        trigger: "POST /urology/recall-sweeps (system checkpoint step 2, after step 1 recomputed due_on)"
        actor: system
        preconditions:
          - "status == OVERDUE"
          - "the due_on recomputed by step 1 under the EVENT_ANCHORED variant is >= logical clock date"
        side_effects:
          - "lapse_days -> 0"
        note: "Cycle: step 1's EVENT_ANCHORED recompute can pull a recall back out of OVERDUE. Because step 1 runs before step 2 within one sweep, a recall whose event-anchored due date moved into the future never lands in OVERDUE at all."

      - from: SCHEDULED_DUE
        to: SATISFIED
        trigger: "POST /urology/procedure-cases/{id}/complete (CASCADE A hop 2)"
        actor: system
        preconditions:
          - "the completing case's patient_id == patient_id"
          - "the completing case's procedure_type.code IN PROTOCOL_SURVEILLANCE_TYPES[protocol]"
          - "this row is the single highest-ranked candidate under due_on ASC then created_at ASC"
        side_effects:
          - "satisfying_case_id = the completing case"
          - "lapse_days -> 0"
          - "CASCADE A hop 3: Patient.outstanding_recall_count recomputed, Patient.version increments by 1"

      - from: OVERDUE
        to: SATISFIED
        trigger: "POST /urology/procedure-cases/{id}/complete (CASCADE A hop 2)"
        actor: system
        preconditions:
          - "the completing case's patient_id == patient_id"
          - "the completing case's procedure_type.code IN PROTOCOL_SURVEILLANCE_TYPES[protocol]"
          - "this row is the single highest-ranked candidate under due_on ASC then created_at ASC"
        side_effects:
          - "satisfying_case_id = the completing case"
          - "lapse_days -> 0"
          - "CASCADE A hop 3: Patient.outstanding_recall_count recomputed, Patient.version increments by 1"

      - from: SCHEDULED_DUE
        to: SUPERSEDED
        trigger: "POST /urology/surveillance-recalls, or a recall auto-created by CASCADE B hop 2, for the same (patient_id, protocol)"
        actor: [Urologist, system]
        preconditions:
          - "a newer SurveillanceRecall row for the same patient_id and protocol has just been inserted"
        side_effects:
          - "the new row's predecessor_recall_id = this row"
          - "Patient.outstanding_recall_count recomputed"

      - from: OVERDUE
        to: SUPERSEDED
        trigger: "POST /urology/surveillance-recalls, or a recall auto-created by CASCADE B hop 2, for the same (patient_id, protocol)"
        actor: [Urologist, system]
        preconditions:
          - "a newer SurveillanceRecall row for the same patient_id and protocol has just been inserted"
        side_effects:
          - "the new row's predecessor_recall_id = this row"
          - "Patient.outstanding_recall_count recomputed"

      - from: SCHEDULED_DUE
        to: CLOSED
        trigger: "POST /urology/surveillance-recalls/{id}/close"
        actor: Urologist
        preconditions:
          - "status IN {SCHEDULED_DUE, OVERDUE}"
        side_effects:
          - "closed_reason = body closed_reason"
          - "Patient.outstanding_recall_count recomputed, Patient.version increments by 1"

      - from: OVERDUE
        to: CLOSED
        trigger: "POST /urology/surveillance-recalls/{id}/close"
        actor: Urologist
        preconditions:
          - "status IN {SCHEDULED_DUE, OVERDUE}"
        side_effects:
          - "closed_reason = body closed_reason"
          - "Patient.outstanding_recall_count recomputed, Patient.version increments by 1"

  - entity: PelvicHealthReferral
    dimension: status
    initial_state: REQUESTED
    terminal_states: [DECLINED, WITHDRAWN]
    transitions:

      - from: REQUESTED
        to: ACCEPTED
        trigger: "POST /urology/pelvic-health-referrals/{id}/decision with decision ACCEPT"
        actor: PelvicHealthCoordinator
        preconditions:
          - "status IN {REQUESTED, WAITLISTED}"
          - "authorized_visits is present in the body and >= 1"
          - "if source_case_id is not null: that ProcedureCase has schedule_status == COMPLETED"
        side_effects:
          - "visits_authorized = min(requested_visits, body authorized_visits, PROGRAM_VISIT_CAP[program])"
          - "visits_remaining = visits_authorized, visits_used = 0, visits_forfeited = 0"
          - "therapy_start_by = the source case's completed_at date + THERAPY_START_WINDOW_DAYS days (logical clock date + THERAPY_START_WINDOW_DAYS when source_case_id is null)"
          - "waitlist_position -> null"
        note: "Branch A of the fork: the only branch that opens the visit ledger."

      - from: REQUESTED
        to: DECLINED
        trigger: "POST /urology/pelvic-health-referrals/{id}/decision with decision DECLINE"
        actor: PelvicHealthCoordinator
        preconditions:
          - "status IN {REQUESTED, WAITLISTED}"
          - "decline_reason is present in the body"
        side_effects:
          - "decline_reason recorded"
          - "the visit ledger stays at zero on every counter"
        note: "Branch B of the fork: terminal, no ledger."

      - from: REQUESTED
        to: WAITLISTED
        trigger: "POST /urology/pelvic-health-referrals/{id}/decision with decision WAITLIST"
        actor: PelvicHealthCoordinator
        preconditions:
          - "status == REQUESTED"
        side_effects:
          - "waitlist_position = 1 + count of PelvicHealthReferral rows with the same program and status WAITLISTED evaluated before this mutation"
        note: "Branch C of the fork: no ledger, but a queue position."

      - from: WAITLISTED
        to: ACCEPTED
        trigger: "POST /urology/pelvic-health-referrals/{id}/decision with decision ACCEPT"
        actor: PelvicHealthCoordinator
        preconditions:
          - "status == WAITLISTED"
          - "authorized_visits is present in the body and >= 1"
          - "if source_case_id is not null: that ProcedureCase has schedule_status == COMPLETED"
        side_effects:
          - "all side effects of REQUESTED -> ACCEPTED"
        note: "Join: the waitlist branch rejoins the accepted branch."

      - from: WAITLISTED
        to: DECLINED
        trigger: "POST /urology/pelvic-health-referrals/{id}/decision with decision DECLINE"
        actor: PelvicHealthCoordinator
        preconditions:
          - "status == WAITLISTED"
          - "decline_reason is present in the body"
        side_effects:
          - "decline_reason recorded"

      - from: ACCEPTED
        to: ACCEPTED
        trigger: "POST /urology/pelvic-health-referrals/{id}/visits with action LOG"
        actor: PelvicHealthCoordinator
        preconditions:
          - "visits_remaining >= 1 and stays >= 1 after the logged visit"
        side_effects:
          - "visits_used += 1, visits_remaining -= 1"
          - "first_visit_date = the earliest logged visit date"

      - from: ACCEPTED
        to: COMPLETED
        trigger: "POST /urology/pelvic-health-referrals/{id}/visits with action LOG (auto-transition)"
        actor: system
        preconditions:
          - "visits_remaining reaches 0 as a result of the logged visit"
        side_effects:
          - "no ledger change beyond the logged visit itself"

      - from: ACCEPTED
        to: ACCEPTED
        trigger: "POST /urology/pelvic-health-referrals/{id}/visits with action VOID_LAST"
        actor: PelvicHealthCoordinator
        preconditions:
          - "visits_used >= 1"
        side_effects:
          - "visits_used -= 1, visits_remaining += 1"
          - "first_visit_date recomputed as the earliest remaining logged visit date, or null when none remain"
        note: "VOID_LAST is a declared trigger on every ACCEPTED referral, so a void with an empty ledger reaches validation priority 76 (ERR_VISIT_ALLOCATION_EXHAUSTED) rather than the transition guard at priority 22."

      - from: COMPLETED
        to: ACCEPTED
        trigger: "POST /urology/pelvic-health-referrals/{id}/visits with action VOID_LAST"
        actor: PelvicHealthCoordinator
        preconditions:
          - "visits_used >= 1"
        side_effects:
          - "visits_used -= 1, visits_remaining += 1"
          - "first_visit_date recomputed as the earliest remaining logged visit date, or null when none remain"
        note: "Cycle: voiding the visit that completed the referral returns it to ACCEPTED with the unit restored."

      - from: ACCEPTED
        to: WITHDRAWN
        trigger: "POST /urology/pelvic-health-referrals/{id}/decision with decision WITHDRAW"
        actor: PelvicHealthCoordinator
        preconditions:
          - "status IN {ACCEPTED, WAITLISTED, COMPLETED}"
        side_effects:
          - "visits_forfeited += visits_remaining, then visits_remaining -> 0"
        note: "Compensating action for the visit ledger: units leave visits_remaining into visits_forfeited so visits_authorized stays conserved."

      - from: WAITLISTED
        to: WITHDRAWN
        trigger: "POST /urology/pelvic-health-referrals/{id}/decision with decision WITHDRAW"
        actor: PelvicHealthCoordinator
        preconditions:
          - "status IN {ACCEPTED, WAITLISTED, COMPLETED}"
        side_effects:
          - "visits_forfeited += visits_remaining (zero for a waitlisted referral), then visits_remaining -> 0"
          - "waitlist_position -> null"

      - from: COMPLETED
        to: WITHDRAWN
        trigger: "POST /urology/pelvic-health-referrals/{id}/decision with decision WITHDRAW"
        actor: PelvicHealthCoordinator
        preconditions:
          - "status IN {ACCEPTED, WAITLISTED, COMPLETED}"
        side_effects:
          - "visits_forfeited += visits_remaining (zero for a completed referral), then visits_remaining -> 0"

  - entity: ConsignmentLot
    dimension: billing_status
    initial_state: CONSIGNED
    terminal_states: [INVOICED, RETURNED]
    transitions:

      - from: CONSIGNED
        to: PARTIALLY_INVOICED
        trigger: "any mutation that changes the lot's unit counters (case complete, case no-show, lot return)"
        actor: system
        preconditions:
          - "quantity_consumed + quantity_wasted >= 1"
          - "quantity_available + quantity_reserved >= 1"
        side_effects:
          - "billed_amount_cents and billing_basis recomputed per calculations.consignment_billing"

      - from: CONSIGNED
        to: INVOICED
        trigger: "any mutation that changes the lot's unit counters"
        actor: system
        preconditions:
          - "quantity_available == 0 and quantity_reserved == 0"
          - "quantity_consumed + quantity_wasted >= 1"
        side_effects:
          - "billed_amount_cents and billing_basis recomputed per calculations.consignment_billing"

      - from: PARTIALLY_INVOICED
        to: INVOICED
        trigger: "any mutation that changes the lot's unit counters"
        actor: system
        preconditions:
          - "quantity_available == 0 and quantity_reserved == 0"
          - "quantity_consumed + quantity_wasted >= 1"
        side_effects:
          - "billed_amount_cents and billing_basis recomputed per calculations.consignment_billing"

      - from: CONSIGNED
        to: RETURNED
        trigger: "POST /urology/consignment-lots/{id}/return"
        actor: PracticeAdmin
        preconditions:
          - "quantity_returned == quantity_received"
          - "quantity_consumed == 0 and quantity_wasted == 0"
        side_effects:
          - "billed_amount_cents -> 0, billing_basis -> FINAL"
        note: "Compound status: every arm of this machine is a re-derivation from the lot's own counters, never a direct client-supplied state."

# ============================================================================
# §1.2.1 Concurrency Rules — OCC on the parent entity's `version` only.
# Each rule is observable with two strictly sequential requests: the first
# advances the parent's version, the second still carries the version the
# client read before that advance and is rejected with 412.
# ============================================================================

concurrency_rules:

  - rule_id: case-schedule-stale-room
    parent_entity: ProcedureRoom
    write_endpoint: "POST /urology/procedure-cases/{id}/schedule"
    occ_field: "expected_room_version"
    description: |
      Booking a case into a room whose version has advanced since the client last
      read it is rejected. Scheduling, rescheduling, cancelling and no-showing a
      case all increment the room's version because each one rewrites the room's
      occupancy ledger, so a client holding a stale room version can no longer
      have evaluated the overlap rule against the ledger the server now holds.
    error_id: ERR_STALE_ROOM_VERSION
    http_status: 412

  - rule_id: scope-assignment-stale-scope
    parent_entity: ScopeAsset
    write_endpoint: "POST /urology/procedure-cases/{id}/scope-assignment"
    occ_field: "expected_scope_asset_version"
    description: |
      Assigning a scope whose version has advanced since the client last read it
      is rejected. A reprocessing stage closing, a leak-test debt being cleared or
      another case releasing the scope each bump the version, and the assigning
      client's view of leak_test_required and hld_pass_at is therefore stale.
    error_id: ERR_STALE_SCOPE_VERSION
    http_status: 412

  - rule_id: device-reservation-stale-lot
    parent_entity: ConsignmentLot
    write_endpoint: "POST /urology/procedure-cases/{id}/device-reservation"
    occ_field: "expected_lot_version"
    description: |
      Reserving single-use device units from a lot whose version has advanced
      since the client last read it is rejected, because the quantity_available
      the client based its request on has since been re-derived by another
      reservation, consumption, waste or return.
    error_id: ERR_STALE_LOT_VERSION
    http_status: 412

  - rule_id: recall-create-stale-patient
    parent_entity: Patient
    write_endpoint: "POST /urology/surveillance-recalls"
    occ_field: "expected_patient_version"
    description: |
      Creating a SurveillanceRecall legitimately supersedes any open recall of the
      same patient and protocol, so a second create against the same patient would
      itself succeed under the product semantics rather than being blocked by a
      state precondition. The write is therefore guarded by the patient's version:
      a create carrying a patient version older than the one the server holds is
      rejected, which is exactly the case where a recall the client never saw has
      already superseded the row it intended to supersede.
    error_id: ERR_STALE_PATIENT_VERSION
    http_status: 412

# ============================================================================
# §1.3 Calculation Rules Table
# All money is integer cents. All rounding is round_half_up. No calculation,
# selector, ranking, tie-break or ordering rule anywhere in this scaffold reads
# an `id`: where a precise fallback over common fields is needed it uses
# created_at ASC.
# ============================================================================

calculations:

  - name: case_occupancy_window
    trigger: "on POST /urology/procedure-cases (creation), on POST /urology/procedure-cases/{id}/schedule, and on POST /urology/procedure-cases/{id}/reschedule"
    algorithm: threshold
    formula: |
      # inputs: procedure_type.base_minutes, procedure_type.cleanup_class,
      #         procedure_type.requires_scope, room.turnover_minutes,
      #         patient.anticoagulant_flag, patient.egfr
      anticoag_extra = ANTICOAG_EXTRA_MIN if (patient.anticoagulant_flag
                        and procedure_type.code == "PROSTATE_BIOPSY") else 0
      renal_extra    = RENAL_EXTRA_MIN if (patient.egfr < RENAL_ADJUST_EGFR
                        and procedure_type.requires_antibiotic) else 0
      procedure_minutes = procedure_type.base_minutes + anticoag_extra + renal_extra

      cleanup_multiplier = HIGH_CLEANUP_MULTIPLIER if procedure_type.cleanup_class == "HIGH" else 1
      scope_add = SCOPE_TURNOVER_ADD_MIN if procedure_type.requires_scope else 0
      turnover_minutes = max(room.turnover_minutes * cleanup_multiplier,
                             MIN_TURNOVER_FLOOR_MIN) + scope_add

      scheduled_end_at = scheduled_start_at + procedure_minutes minutes
      block_end_at     = scheduled_end_at   + turnover_minutes  minutes
    input_set: |
      Exactly one ProcedureType row, one ProcedureRoom row and one Patient row, all
      resolved from the case's own foreign keys at the moment of the mutation. The
      window is NOT retro-recomputed when the room's turnover_minutes or the
      patient's egfr later change; only the three triggering endpoints rewrite it.
    constants:
      ANTICOAG_EXTRA_MIN: 15
      RENAL_EXTRA_MIN: 10
      RENAL_ADJUST_EGFR: 45
      HIGH_CLEANUP_MULTIPLIER: 2
      MIN_TURNOVER_FLOOR_MIN: 15
      SCOPE_TURNOVER_ADD_MIN: 20
      PROVIDER_GAP_MIN: 10
      EARLY_CHECKIN_WINDOW_MIN: 30
      NO_SHOW_GRACE_MIN: 15
    precision: "whole minutes; all datetimes ISO 8601 UTC with three fractional digits"
    interval_semantics: |
      ROOM occupancy is the HALF-OPEN interval [scheduled_start_at, block_end_at):
      a new case whose scheduled_start_at equals an existing case's block_end_at is
      accepted, and one minute earlier is rejected with ERR_ROOM_WINDOW_CONFLICT.
      PROVIDER occupancy is a different geometry: the CLOSED buffered interval
      [scheduled_start_at - PROVIDER_GAP_MIN, scheduled_end_at + PROVIDER_GAP_MIN],
      which ignores turnover entirely (the urologist leaves during turnover) and
      treats mere touching as a collision, rejected with ERR_PROVIDER_DOUBLE_BOOKED.
      Only cases with schedule_status IN {SCHEDULED, IN_ROOM, COMPLETED} occupy
      either resource; DRAFT, CANCELLED and NO_SHOW cases occupy nothing.

  - name: antibiotic_agent_selection
    trigger: "on POST /urology/antibiotic-orders; also fixes prophylaxis_window_start_at on the created order"
    algorithm: weighted_scoring
    formula: |
      # ---- eligibility filter (explicit predicate over entity fields) ----
      eligible = [ a for a in AGENT_TABLE.keys()
                   if AGENT_TABLE[a].drug_class != patient.antibiotic_allergy_class
                   and patient.egfr >= AGENT_TABLE[a].min_egfr
                   and a in PROTOCOL_RANK[procedure_type.code] ]

      # ---- branch on requested_agent ----
      if requested_agent != "AUTO":
          if requested_agent not in eligible: raise ERR_ANTIBIOTIC_CONTRAINDICATED
          agent = requested_agent
      else:
          if eligible == []: raise ERR_NO_ELIGIBLE_ANTIBIOTIC
          # ranking expression: protocol rank ASC; tie-break: agent name ASC
          agent = sorted(eligible,
                         key=lambda a: (PROTOCOL_RANK[procedure_type.code][a], a))[0]

      # ---- renal-adjusted dose, rounded to the nearest DOSE_STEP_MG ----
      raw_dose = AGENT_TABLE[agent].base_dose_mg * (
                   1.0 if patient.egfr >= RENAL_ADJUST_EGFR else RENAL_DOSE_FACTOR)
      dose_mg  = round_half_up(raw_dose / DOSE_STEP_MG) * DOSE_STEP_MG
      route    = AGENT_TABLE[agent].route
      prophylaxis_window_start_at = case.scheduled_start_at - PROPHYLAXIS_WINDOW_MIN minutes
    input_set: |
      One Patient row (allergy class and egfr) and one ProcedureType row (which
      PROTOCOL_RANK map applies). Only ProcedureType rows with requires_antibiotic
      true have a PROTOCOL_RANK entry; ordering an antibiotic for any other type is
      rejected by validations[priority=45] with ERR_NO_ELIGIBLE_ANTIBIOTIC because
      the eligible set is empty by construction.
    constants:
      AGENT_TABLE:
        CIPROFLOXACIN: { drug_class: FLUOROQUINOLONE, min_egfr: 30, base_dose_mg: 500, route: ORAL }
        CEFAZOLIN:     { drug_class: CEPHALOSPORIN,   min_egfr: 15, base_dose_mg: 1000, route: IV }
        TMP_SMX:       { drug_class: SULFA,           min_egfr: 30, base_dose_mg: 160, route: ORAL }
        GENTAMICIN:    { drug_class: AMINOGLYCOSIDE,  min_egfr: 60, base_dose_mg: 240, route: IV }
      PROTOCOL_RANK:
        CYSTOSCOPY:      { CIPROFLOXACIN: 1, TMP_SMX: 2, CEFAZOLIN: 3, GENTAMICIN: 4 }
        PROSTATE_BIOPSY: { CEFAZOLIN: 1, CIPROFLOXACIN: 1, GENTAMICIN: 3, TMP_SMX: 4 }
      RENAL_ADJUST_EGFR: 45
      RENAL_DOSE_FACTOR: 0.5
      DOSE_STEP_MG: 25
      PROPHYLAXIS_WINDOW_MIN: 60
    precision: "dose_mg is a whole number of milligrams; the division by DOSE_STEP_MG is rounded round_half_up BEFORE multiplying back"
    tie_break: |
      PROSTATE_BIOPSY deliberately ranks CEFAZOLIN and CIPROFLOXACIN both at 1. The
      tie is broken by agent name ascending, so CEFAZOLIN wins for a patient with no
      relevant allergy, and CIPROFLOXACIN wins once CEPHALOSPORIN is the patient's
      allergy class. Empty candidate set -> ERR_NO_ELIGIBLE_ANTIBIOTIC (422).

  - name: notification_escalation_clock
    trigger: "on POST /urology/specimens/{id}/result, on POST /urology/specimens/{id}/accession with condition COMPROMISED, and on every POST /urology/specimens/{id}/notification-attempt"
    algorithm: chronological
    formula: |
      # Evaluation order is PINNED. The weekend extension looks like a circular
      # dependency (the extension depends on the instant the extension shifts), so
      # the order below is normative: the weekend test is evaluated ONCE, on
      # provisional_due, and is NEVER re-evaluated after the extension or the
      # attempt backoff has been added.
      grade = pathology_result if pathology_result is not null else "INSUFFICIENT"
      base_window_hours = GRADE_WINDOW_HOURS[grade]

      step 1: provisional_due = result_at + base_window_hours hours
      step 2: weekend_extension_hours = WEEKEND_EXTENSION_HOURS
                if provisional_due falls on Saturday or Sunday (UTC) else 0
      step 3: backoff_hours = BACKOFF_HOURS * max(0, notification_attempt_count - 1)
      step 4: escalation_due_at = provisional_due
                                  + weekend_extension_hours hours
                                  + backoff_hours hours
    input_set: |
      One Specimen row. result_at is the logical-clock instant of the result (or of
      the COMPROMISED accession, in which case pathology_result stays null and the
      INSUFFICIENT window applies). notification_attempt_count is the value AFTER
      the current attempt has been counted, so the first attempt adds no backoff.
    constants:
      GRADE_WINDOW_HOURS: { MALIGNANT: 24, ATYPICAL: 72, INSUFFICIENT: 72, BENIGN: 168 }
      WEEKEND_EXTENSION_HOURS: 48
      BACKOFF_HOURS: 12
      MAX_NOTIFY_ATTEMPTS: 3
      MAX_TRANSIT_HOURS: 24
    precision: "whole hours added to an ISO 8601 UTC instant with three fractional digits"

  - name: consignment_billing
    trigger: "on POST /urology/procedure-cases/{id}/device-reservation, on POST /urology/procedure-cases/{id}/cancel, on POST /urology/procedure-cases/{id}/no-show, on POST /urology/procedure-cases/{id}/complete, and on POST /urology/consignment-lots/{id}/return"
    algorithm: aggregation
    formula: |
      # A "line" is one ProcedureCase holding units of this lot. Lines are the
      # cases with device_lot_id == lot.id in the state the variant selects,
      # enumerated created_at ASC (order is irrelevant to the sum but pinned so the
      # per-line rounding sequence is reproducible).
      #
      # ROUNDING ORDER IS PINNED: round EACH line to whole cents FIRST, then sum.
      # Summing the raw products and rounding once at the end is NOT the rule and
      # produces a different total (see the worked divergence below).
      line_cents(case, factor) = round_half_up(lot.unit_price_cents * factor
                                               * case.device_quantity)
      billed_amount_cents = sum over selected lines of line_cents(line, factor)

      # counter invariant, re-asserted after every trigger above:
      quantity_received == quantity_available + quantity_reserved
                           + quantity_consumed + quantity_returned + quantity_wasted

      # derived compound status
      if quantity_returned == quantity_received and quantity_consumed == 0
         and quantity_wasted == 0:                                billing_status = RETURNED
      elif quantity_available == 0 and quantity_reserved == 0
           and quantity_consumed + quantity_wasted >= 1:          billing_status = INVOICED
      elif quantity_consumed + quantity_wasted >= 1:              billing_status = PARTIALLY_INVOICED
      else:                                                       billing_status = CONSIGNED
    input_set: |
      PROVISIONAL selects lines whose device_state IN {RESERVED}; FINAL selects
      lines whose device_state IN {CONSUMED, WASTED}. Lines in RELEASED are
      selected by neither variant. billing_basis records which variant last ran.
    constants:
      MARKUP_PCT: 0.185
      VOLUME_REBATE_PCT: 0.05
      VOLUME_REBATE_MIN_CONSUMED: 3
    precision: "integer cents, round_half_up, applied per line before summation"
    variants:
      - name: PROVISIONAL
        when: "runs on device-reservation, cancel and no-show, i.e. while units are still only held"
        difference: "factor = 1 + MARKUP_PCT (0.185) and only RESERVED lines are summed; the volume rebate never applies"
      - name: FINAL
        when: "runs on case complete and on lot return, i.e. once units are spent"
        difference: |
          factor = 1 + MARKUP_PCT - (VOLUME_REBATE_PCT if
          quantity_consumed >= VOLUME_REBATE_MIN_CONSUMED else 0), and only
          CONSUMED and WASTED lines are summed. Identical unit counts therefore
          yield a different total from PROVISIONAL: with unit_price_cents 1999 and
          three lines of one unit each, PROVISIONAL gives
          round_half_up(1999*1.185)=2369 per line -> 7107, while FINAL with the
          rebate active gives round_half_up(1999*1.135)=2269 per line -> 6807.
    rounding_order_divergence: |
      With unit_price_cents 1999, MARKUP_PCT 0.185 and three RESERVED lines of one
      unit each, the pinned per-line-then-sum order yields 2369*3 = 7107 cents. The
      rejected sum-then-round order yields round_half_up(1999*3*1.185) =
      round_half_up(7106.445) = 7106 cents. The one-cent gap is the observable
      signature of the pinned order.

  - name: recall_due_date
    trigger: "on POST /urology/surveillance-recalls, on the recall auto-created by CASCADE B hop 2 or by a COMPROMISED accession, and on POST /urology/recall-sweeps step 1"
    algorithm: forward_looking
    formula: |
      interval_months = RECALL_INTERVAL_MONTHS[protocol][risk_tier]

      add_months(d, n):
          y = d.year + (d.month - 1 + n) // 12
          m = (d.month - 1 + n) % 12 + 1
          day = min(d.day, last_day_of_month(y, m))     # clamp, never roll over
          return date(y, m, day)

      # variant PROTOCOL_ANCHORED
      due_on = add_months(anchor_date, interval_months)

      # variant EVENT_ANCHORED
      surveillance_cases = [ c for c in ProcedureCase
                             if c.patient_id == patient_id
                             and c.schedule_status == "COMPLETED"
                             and c.procedure_type.code in PROTOCOL_SURVEILLANCE_TYPES[protocol] ]
      if surveillance_cases == []:
          due_on = add_months(anchor_date, interval_months)   # falls back to the anchor
          due_basis = "PROTOCOL_ANCHORED"
      else:
          # ranking: latest event wins; tie-break created_at ASC on the case
          anchor_case = sorted(surveillance_cases,
                               key=lambda c: (c.scheduled_start_at, c.created_at))[-1]
          due_on = add_months(date_of(anchor_case.scheduled_start_at), interval_months)
          due_basis = "EVENT_ANCHORED"

      lapse_days = max(0, whole_days_between(due_on, logical_clock_date))
    input_set: |
      PROTOCOL_ANCHORED reads only the recall's own anchor_date, protocol and
      risk_tier. EVENT_ANCHORED additionally reads every COMPLETED ProcedureCase of
      the same patient whose ProcedureType.code is in the protocol's surveillance
      set; DRAFT, SCHEDULED, IN_ROOM, CANCELLED and NO_SHOW cases are excluded.
    constants:
      RECALL_INTERVAL_MONTHS:
        STONE:          { LOW: 24, INTERMEDIATE: 12, HIGH: 6 }
        BLADDER_CANCER: { LOW: 12, INTERMEDIATE: 6,  HIGH: 3 }
        PROSTATE:       { LOW: 12, INTERMEDIATE: 6,  HIGH: 3 }
      PROTOCOL_SURVEILLANCE_TYPES:
        STONE:          [OFFICE_ULTRASOUND]
        BLADDER_CANCER: [CYSTOSCOPY]
        PROSTATE:       [PROSTATE_BIOPSY]
      SPECIMEN_PROTOCOL_MAP:
        PROSTATE_CORE:    PROSTATE
        BLADDER_WASHING:  BLADDER_CANCER
        BIOPSY_FRAGMENT:  PROSTATE
      RESULT_RISK_TIER: { MALIGNANT: HIGH, ATYPICAL: INTERMEDIATE, BENIGN: LOW }
      THERAPY_START_WINDOW_DAYS: 30
      PROGRAM_VISIT_CAP: { PELVIC_FLOOR_PT: 8, BEHAVIORAL_TRAINING: 4, BIOFEEDBACK: 6 }
    precision: "calendar dates, day clamped to the last day of the target month; no time component"
    variants:
      - name: PROTOCOL_ANCHORED
        when: "at recall creation, whether by POST /urology/surveillance-recalls or by a cascade"
        difference: "measures the interval from the recall's own anchor_date, ignoring the patient's completed procedure history"
      - name: EVENT_ANCHORED
        when: "at every POST /urology/recall-sweeps, step 1, for recalls with status IN {SCHEDULED_DUE, OVERDUE}"
        difference: |
          measures the interval from the latest COMPLETED surveillance case of the
          patient. Identical rows diverge: a BLADDER_CANCER / INTERMEDIATE recall
          anchored 2026-03-31 is due 2026-09-30 under PROTOCOL_ANCHORED, but once
          the patient has a COMPLETED CYSTOSCOPY starting 2026-09-14 the same row
          is due 2027-03-14 under EVENT_ANCHORED.

  - name: check_in_readiness_gates
    trigger: "recomputed on every ProcedureCase mutation (create, schedule, reschedule, prep-acknowledgement, clearance-review, scope-assignment, device-reservation, check-in, complete, cancel, no-show) and read by GET /urology/procedure-cases/{id}/readiness"
    algorithm: aggregation
    formula: |
      # The result is the ORDERED subsequence of unmet gates. The order is the
      # validation priority order of §1.4 and nothing else, so the first element is
      # exactly the error_id the check-in endpoint would return.
      codes = []
      if clearance_status not in {CLEARED, PREP_WAIVED}:            codes += ["CLEARANCE_NOT_GRANTED"]        # p40
      if room.room_type in {IMAGING_BAY, URODYNAMICS_LAB} and
         (room.accreditation_expires_on is null or
          room.accreditation_expires_on < clock_date):              codes += ["ROOM_ACCREDITATION_LAPSED"]    # p42
      if room.room_type in {IMAGING_BAY, URODYNAMICS_LAB} and
         (provider.ultrasound_accreditation_expires_on is null or
          provider.ultrasound_accreditation_expires_on < clock_date): codes += ["PROVIDER_ACCREDITATION_LAPSED"] # p43
      if procedure_type.requires_antibiotic and no AntibioticOrder
         with case_id == case.id has status ADMINISTERED:            codes += ["ANTIBIOTIC_NOT_ADMINISTERED"]  # p48
      if procedure_type.requires_scope and the assigned scope is not
         ready (scope_asset_id null, status != IN_USE, hld_pass_at null,
         or reprocess_due_at is not null):                           codes += ["SCOPE_NOT_READY"]              # p52
      if clock_instant < scheduled_start_at - EARLY_CHECKIN_WINDOW_MIN: codes += ["CHECKIN_TOO_EARLY"]         # p60
      if procedure_type.consignment_required and device_state != RESERVED: codes += ["DEVICE_NOT_RESERVED"]    # p68
      blocking_reason_codes = codes
      first_blocking_reason_code = codes[0] if codes else null
      check_in_allowed = (schedule_status == "SCHEDULED" and codes == [])
    input_set: |
      One ProcedureCase with its ProcedureType, ProcedureRoom, primary Provider,
      assigned ScopeAsset (when any) and every AntibioticOrder sharing its case_id.
      Cases whose schedule_status is IN_ROOM, COMPLETED, CANCELLED or NO_SHOW carry
      the empty array: the gates only describe a pending check-in.
    constants:
      GATE_PRIORITY_ORDER:
        - CLEARANCE_NOT_GRANTED
        - ROOM_ACCREDITATION_LAPSED
        - PROVIDER_ACCREDITATION_LAPSED
        - ANTIBIOTIC_NOT_ADMINISTERED
        - SCOPE_NOT_READY
        - CHECKIN_TOO_EARLY
        - DEVICE_NOT_RESERVED
      SCOPE_REPROCESS_SLA_HOURS: 12
      LEAK_TEST_CYCLE_LIMIT: 10
    precision: "array of string codes, deduplicated, emitted strictly in GATE_PRIORITY_ORDER"

# ============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# The ladder is total: for any request that violates several rules the server
# returns the error of the LOWEST priority number. Three priority pairs are
# deliberately reachable by a single request and are the ones §1.8 rule
# priority_pair_validation_conflict targets:
#   P1  priority 40 (state, ERR_CASE_NOT_CLEARED)
#       vs priority 48 (business_safety, ERR_ANTIBIOTIC_NOT_ADMINISTERED)
#       on POST /urology/procedure-cases/{id}/check-in
#   P2  priority 64 (business_temporal, ERR_LOT_EXPIRED)
#       vs priority 70 (business_fiscal, ERR_CONSIGNMENT_INSUFFICIENT)
#       on POST /urology/procedure-cases/{id}/device-reservation
#   P3  priority 54 (business_constraint, ERR_ROOM_CLOSED)
#       vs priority 58 (business_temporal, ERR_ROOM_WINDOW_CONFLICT)
#       on POST /urology/procedure-cases/{id}/schedule
# ============================================================================

validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-blank"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "for every entity_backed role, X-User-ID resolves to an existing Provider whose role_type matches the declared binding of X-User-Role and whose credential_status is ACTIVE; a SUSPENDED provider is refused even for reads"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all except POST /urology/providers and POST /urology/_clock/set_current_utc, which PracticeAdmin performs with an opaque id"
    note: "runs before the endpoint role allowlist so an impostor id is refused even on an endpoint their claimed role may use"

  - priority: 3
    category: auth
    check: "X-User-Role appears in the endpoint's declared roles list in §1.5"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 4
    category: auth
    check: "on POST /urology/procedure-cases/{id}/clearance-review, decision WAIVE requires role Urologist; ProcedureNurse may submit CLEAR and BLOCK but never WAIVE"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "POST /urology/procedure-cases/{id}/clearance-review"

  - priority: 6
    category: existence
    check: "request body parses, every required input field of the §1.5 entry is present, every enum value is a declared member, every integer field is a non-negative integer, every date/datetime field is ISO 8601, and limit/offset are integers with 1 <= limit <= 100 and offset >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

  - priority: 8
    category: existence
    check: "path parameters resolve, evaluated strictly left to right, to their declared entity"
    error_id: "ERR_PATIENT_NOT_FOUND | ERR_PROVIDER_NOT_FOUND | ERR_ROOM_NOT_FOUND | ERR_PROCEDURE_TYPE_NOT_FOUND | ERR_CASE_NOT_FOUND | ERR_SCOPE_NOT_FOUND | ERR_REPROCESSING_LOG_NOT_FOUND | ERR_SPECIMEN_NOT_FOUND | ERR_RECALL_NOT_FOUND | ERR_REFERRAL_NOT_FOUND | ERR_LOT_NOT_FOUND | ERR_ANTIBIOTIC_ORDER_NOT_FOUND"
    http_status: 404
    applies_to: "every endpoint with a path parameter"

  - priority: 10
    category: existence
    check: "body foreign keys resolve, evaluated in the order the fields are declared in the §1.5 `input:` list; on POST /urology/procedure-cases the order is patient_id, then procedure_type_id, then room_id, then primary_provider_id"
    error_id: "the matching ERR_*_NOT_FOUND for the first unresolvable field"
    http_status: 404
    applies_to: "every endpoint carrying a foreign key in its body"

  - priority: 14
    category: auth
    check: "the acting provider is the provider named in the body: ordered_by_provider_id on POST /urology/antibiotic-orders, performed_by_provider_id on POST /urology/reprocessing-logs, and collected_by_provider_id on POST /urology/specimens must each equal X-User-ID"
    error_id: ERR_ACTOR_IDENTITY_MISMATCH
    http_status: 403
    applies_to: "POST /urology/antibiotic-orders, POST /urology/reprocessing-logs, POST /urology/specimens"

  - priority: 16
    category: auth
    check: "segregation of duties on high-level disinfection attestation: attested_by_provider_id differs from the log's performed_by_provider_id and equals X-User-ID"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /urology/reprocessing-logs/{id}/complete"

  - priority: 18
    category: business_constraint
    check: "uniqueness of natural keys: Patient.mrn, ProcedureType.code, ProcedureRoom.name, ScopeAsset.serial_number globally, and Specimen.container_label within one case_id"
    error_id: "ERR_DUPLICATE_MRN | ERR_DUPLICATE_PROCEDURE_TYPE_CODE | ERR_DUPLICATE_ROOM_NAME | ERR_DUPLICATE_SCOPE_SERIAL | ERR_DUPLICATE_CONTAINER_LABEL"
    http_status: 409
    applies_to: "POST /urology/patients, POST /urology/procedure-types, POST /urology/procedure-rooms, POST /urology/scope-assets, POST /urology/specimens"

  - priority: 22
    category: state
    check: "the target row is in a state from which the requested trigger is declared in §1.2; a case in COMPLETED cannot be rescheduled, a specimen in REJECTED cannot be resulted, a CLOSED reprocessing log cannot be completed twice, a SUPERSEDED recall cannot be closed, a WITHDRAWN referral cannot log visits"
    error_id: "ERR_INVALID_CASE_TRANSITION | ERR_INVALID_SPECIMEN_TRANSITION | ERR_INVALID_NOTIFICATION_TRANSITION | ERR_INVALID_REPROCESSING_TRANSITION | ERR_INVALID_RECALL_TRANSITION | ERR_INVALID_REFERRAL_TRANSITION"
    http_status: 409
    applies_to: "every action endpoint"

  - priority: 26
    category: business_referential
    check: "cross-entity state guard: POST /urology/pelvic-health-referrals requires source_case_id to name a case whose schedule_status is COMPLETED; POST /urology/surveillance-recalls with source_specimen_id requires that specimen's chain_status to be RESULTED"
    error_id: ERR_SOURCE_CASE_NOT_COMPLETED
    http_status: 422
    applies_to: "POST /urology/pelvic-health-referrals, POST /urology/surveillance-recalls"

  - priority: 30
    category: state
    check: "optimistic concurrency: the request's expected_<parent>_version equals the parent row's current version, per the four rules in §1.2.1"
    error_id: "ERR_STALE_ROOM_VERSION | ERR_STALE_SCOPE_VERSION | ERR_STALE_LOT_VERSION | ERR_STALE_PATIENT_VERSION"
    http_status: 412
    applies_to: "POST /urology/procedure-cases/{id}/schedule, POST /urology/procedure-cases/{id}/scope-assignment, POST /urology/procedure-cases/{id}/device-reservation, POST /urology/surveillance-recalls"

  - priority: 34
    category: business_safety
    check: "on clearance-review with decision CLEAR, every code in the case's procedure_type.required_prep_codes appears in the case's acknowledged_prep_codes; when required_prep_codes is the empty array the check passes vacuously and CLEAR is granted with no acknowledgements at all"
    error_id: ERR_PREP_INCOMPLETE
    http_status: 422
    applies_to: "POST /urology/procedure-cases/{id}/clearance-review"

  - priority: 36
    category: business_constraint
    check: "the acknowledged instruction_code is a member of the case's procedure_type.required_prep_codes"
    error_id: ERR_PREP_CODE_NOT_REQUIRED
    http_status: 422
    applies_to: "POST /urology/procedure-cases/{id}/prep-acknowledgements"

  - priority: 40
    category: state
    check: "the case's clearance_status is CLEARED or PREP_WAIVED at check-in; PENDING_PREP, PREP_ACKNOWLEDGED and BLOCKED all fail"
    error_id: ERR_CASE_NOT_CLEARED
    http_status: 409
    applies_to: "POST /urology/procedure-cases/{id}/check-in"
    priority_pair: "P1 low side — beats ERR_ANTIBIOTIC_NOT_ADMINISTERED at priority 48"

  - priority: 42
    category: business_safety
    check: "when the case's room_type is IMAGING_BAY or URODYNAMICS_LAB, room.accreditation_expires_on is non-null and on or after the logical clock's date"
    error_id: ERR_ROOM_ACCREDITATION_LAPSED
    http_status: 422
    applies_to: "POST /urology/procedure-cases/{id}/check-in, POST /urology/procedure-cases/{id}/schedule"

  - priority: 43
    category: business_safety
    check: "when the case's room_type is IMAGING_BAY or URODYNAMICS_LAB, the primary provider's ultrasound_accreditation_expires_on is non-null and on or after the logical clock's date"
    error_id: ERR_PROVIDER_ACCREDITATION_LAPSED
    http_status: 422
    applies_to: "POST /urology/procedure-cases/{id}/check-in, POST /urology/procedure-cases/{id}/schedule"

  - priority: 45
    category: business_safety
    check: "an explicitly requested agent is not contraindicated: its drug_class differs from the patient's antibiotic_allergy_class and the patient's egfr meets the agent's min_egfr"
    error_id: ERR_ANTIBIOTIC_CONTRAINDICATED
    http_status: 422
    applies_to: "POST /urology/antibiotic-orders"

  - priority: 46
    category: business_safety
    check: "with requested_agent AUTO the eligible agent pool computed by calculations.antibiotic_agent_selection is non-empty; also fails when the case's procedure_type.requires_antibiotic is false, because such a type has no PROTOCOL_RANK entry"
    error_id: ERR_NO_ELIGIBLE_ANTIBIOTIC
    http_status: 422
    applies_to: "POST /urology/antibiotic-orders"

  - priority: 47
    category: business_temporal
    check: "administered_at lies in the closed interval [prophylaxis_window_start_at, case.scheduled_start_at]"
    error_id: ERR_PROPHYLAXIS_WINDOW_MISSED
    http_status: 422
    applies_to: "POST /urology/antibiotic-orders/{id}/administer"

  - priority: 48
    category: business_safety
    check: "when the case's procedure_type.requires_antibiotic is true, at least one AntibioticOrder on the case has status ADMINISTERED"
    error_id: ERR_ANTIBIOTIC_NOT_ADMINISTERED
    http_status: 422
    applies_to: "POST /urology/procedure-cases/{id}/check-in"
    priority_pair: "P1 high side — loses to ERR_CASE_NOT_CLEARED at priority 40"

  - priority: 50
    category: business_safety
    check: "the scope being assigned does not have leak_test_required true; a scope reaches that flag once cycles_since_leak_test has hit LEAK_TEST_CYCLE_LIMIT (10) or after a FAIL reprocessing outcome"
    error_id: ERR_SCOPE_LEAK_TEST_DUE
    http_status: 422
    applies_to: "POST /urology/procedure-cases/{id}/scope-assignment"

  - priority: 51
    category: business_constraint
    check: "the scope being assigned has status AVAILABLE; SOILED, REPROCESSING, IN_USE and QUARANTINED are all refused"
    error_id: ERR_SCOPE_NOT_AVAILABLE
    http_status: 409
    applies_to: "POST /urology/procedure-cases/{id}/scope-assignment"

  - priority: 52
    category: business_safety
    check: "at check-in, when procedure_type.requires_scope is true the case has a scope_asset_id whose scope has status IN_USE, a non-null hld_pass_at (a high-level disinfection has been attested at least once, whether by commissioning or by a reprocessing cycle) and a null reprocess_due_at (no outstanding reprocessing obligation)"
    error_id: ERR_SCOPE_NOT_READY
    http_status: 422
    applies_to: "POST /urology/procedure-cases/{id}/check-in"

  - priority: 53
    category: business_safety
    check: "a HIGH_LEVEL_DISINFECT reprocessing stage may only be performed by a Provider whose hld_certified is true, and only attested by another hld_certified Provider"
    error_id: ERR_HLD_CERTIFICATION_REQUIRED
    http_status: 422
    applies_to: "POST /urology/reprocessing-logs, POST /urology/reprocessing-logs/{id}/complete"

  - priority: 54
    category: business_constraint
    check: "the target room's room_status is OPEN"
    error_id: ERR_ROOM_CLOSED
    http_status: 422
    applies_to: "POST /urology/procedure-cases/{id}/schedule, POST /urology/procedure-cases/{id}/reschedule"
    priority_pair: "P3 low side — beats ERR_ROOM_WINDOW_CONFLICT at priority 58"

  - priority: 55
    category: business_constraint
    check: "the room's room_type equals the case's procedure_type.allowed_room_type"
    error_id: ERR_ROOM_TYPE_MISMATCH
    http_status: 422
    applies_to: "POST /urology/procedure-cases/{id}/schedule, POST /urology/procedure-cases/{id}/reschedule"

  - priority: 56
    category: business_constraint
    check: "reprocessing stages are opened in the order PRECLEAN, LEAK_TEST, MANUAL_CLEAN, HIGH_LEVEL_DISINFECT, DRY_STORE; a new log's stage must be the successor of the scope's last CLOSED PASS stage, except that LEAK_TEST may always be opened when leak_test_required is true and PRECLEAN may always be opened on a SOILED scope"
    error_id: ERR_REPROCESSING_STAGE_OUT_OF_ORDER
    http_status: 422
    applies_to: "POST /urology/reprocessing-logs"

  - priority: 57
    category: business_constraint
    check: "the scope has no ReprocessingLog with log_status OPEN"
    error_id: ERR_REPROCESSING_LOG_ALREADY_OPEN
    http_status: 409
    applies_to: "POST /urology/reprocessing-logs"

  - priority: 58
    category: business_temporal
    check: "the case's half-open occupancy interval [scheduled_start_at, block_end_at) does not intersect that of any other case in the same room with schedule_status IN {SCHEDULED, IN_ROOM, COMPLETED}; a start exactly equal to another case's block_end_at is accepted"
    error_id: ERR_ROOM_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /urology/procedure-cases/{id}/schedule, POST /urology/procedure-cases/{id}/reschedule"
    priority_pair: "P3 high side — loses to ERR_ROOM_CLOSED at priority 54"

  - priority: 59
    category: business_temporal
    check: "the case's closed buffered provider interval [scheduled_start_at - 10min, scheduled_end_at + 10min] does not intersect that of any other case with the same primary_provider_id and schedule_status IN {SCHEDULED, IN_ROOM, COMPLETED}; turnover is excluded and mere touching collides"
    error_id: ERR_PROVIDER_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /urology/procedure-cases/{id}/schedule, POST /urology/procedure-cases/{id}/reschedule"

  - priority: 60
    category: business_temporal
    check: "the logical clock is at or after scheduled_start_at minus EARLY_CHECKIN_WINDOW_MIN (30 minutes)"
    error_id: ERR_CHECKIN_TOO_EARLY
    http_status: 422
    applies_to: "POST /urology/procedure-cases/{id}/check-in"

  - priority: 61
    category: business_temporal
    check: "the logical clock is strictly after scheduled_start_at plus NO_SHOW_GRACE_MIN (15 minutes)"
    error_id: ERR_NO_SHOW_GRACE_NOT_ELAPSED
    http_status: 422
    applies_to: "POST /urology/procedure-cases/{id}/no-show"

  - priority: 62
    category: business_temporal
    check: "accession happens no later than MAX_TRANSIT_HOURS (24) after the specimen's collected_at"
    error_id: ERR_SPECIMEN_TRANSIT_EXPIRED
    http_status: 422
    applies_to: "POST /urology/specimens/{id}/accession"

  - priority: 63
    category: business_constraint
    check: "a specimen may only be collected on a case whose procedure_type.requires_specimen is true and whose schedule_status is IN_ROOM or COMPLETED"
    error_id: ERR_SPECIMEN_NOT_EXPECTED
    http_status: 422
    applies_to: "POST /urology/specimens"

  - priority: 64
    category: business_temporal
    check: "the consignment lot's lot_expires_on is on or after the logical clock's date"
    error_id: ERR_LOT_EXPIRED
    http_status: 422
    applies_to: "POST /urology/procedure-cases/{id}/device-reservation"
    priority_pair: "P2 low side — beats ERR_CONSIGNMENT_INSUFFICIENT at priority 70"

  - priority: 66
    category: business_constraint
    check: "the lot's sku equals the case's procedure_type.single_use_device_sku"
    error_id: ERR_DEVICE_SKU_MISMATCH
    http_status: 422
    applies_to: "POST /urology/procedure-cases/{id}/device-reservation"

  - priority: 67
    category: business_constraint
    check: "the case's device_state is NONE or RELEASED; a case already holding RESERVED or CONSUMED units cannot reserve again"
    error_id: ERR_DEVICE_ALREADY_RESERVED
    http_status: 409
    applies_to: "POST /urology/procedure-cases/{id}/device-reservation"

  - priority: 68
    category: business_constraint
    check: "at check-in, when procedure_type.consignment_required is true the case's device_state is RESERVED"
    error_id: ERR_DEVICE_NOT_RESERVED
    http_status: 422
    applies_to: "POST /urology/procedure-cases/{id}/check-in"

  - priority: 70
    category: business_fiscal
    check: "the requested quantity is at most the lot's quantity_available"
    error_id: ERR_CONSIGNMENT_INSUFFICIENT
    http_status: 422
    applies_to: "POST /urology/procedure-cases/{id}/device-reservation"
    priority_pair: "P2 high side — loses to ERR_LOT_EXPIRED at priority 64"

  - priority: 72
    category: business_fiscal
    check: "the returned quantity is at most the lot's quantity_available; reserved and consumed units cannot be returned"
    error_id: ERR_CONSIGNMENT_RETURN_EXCEEDS_AVAILABLE
    http_status: 422
    applies_to: "POST /urology/consignment-lots/{id}/return"

  - priority: 74
    category: business_temporal
    check: "on a decision of ACCEPT, the logical clock's date is on or before the source case's completed_at date plus THERAPY_START_WINDOW_DAYS (30); a referral accepted more than 30 days after its source procedure completed is refused"
    error_id: ERR_THERAPY_START_WINDOW_MISSED
    http_status: 422
    applies_to: "POST /urology/pelvic-health-referrals/{id}/decision"

  - priority: 76
    category: business_fiscal
    check: "on POST /urology/pelvic-health-referrals/{id}/visits with action LOG, visits_remaining is at least 1; with action VOID_LAST, visits_used is at least 1"
    error_id: ERR_VISIT_ALLOCATION_EXHAUSTED
    http_status: 422
    applies_to: "POST /urology/pelvic-health-referrals/{id}/visits"

# ============================================================================
# §1.5 API Endpoint Table
# Every path is under api_prefix /urology. Every entity has a single-resource
# GET at /urology/<collection>/{id} and a filtered list GET at
# /urology/<collection> carrying each of its FK fields as an optional filter,
# so every FK declared in §1.1 is reverse-reachable.
# Reads are open to all seven roles; writes are role-restricted.
# ============================================================================

endpoints:

  # ---- Provider -----------------------------------------------------------
  - method: POST
    path: "/urology/providers"
    description: "Register a clinician, nurse, technician or scheduler on the practice roster."
    roles: [PracticeAdmin]
    code: 201
    input: [full_name, npi, role_type, "hld_certified?", "ultrasound_accreditation_expires_on?"]
    output: Provider
    side_effects:
      - "credential_status defaults to ACTIVE and hld_certified defaults to false"

  - method: PATCH
    path: "/urology/providers/{id}"
    description: "Update a provider's credential standing, HLD certification or ultrasound accreditation expiry."
    roles: [PracticeAdmin]
    code: 200
    input: ["credential_status?", "hld_certified?", "ultrasound_accreditation_expires_on?"]
    output: Provider
    side_effects:
      - "increments Provider.version by 1"
      - "a provider moved to SUSPENDED is refused by validations[priority=2] on their next request"

  - method: GET
    path: "/urology/providers/{id}"
    description: "Read one provider."
    roles: [PracticeAdmin, Scheduler, Urologist, ProcedureNurse, SterileProcessingTech, PathologyLiaison, PelvicHealthCoordinator]
    code: 200
    input: []
    output: Provider
    side_effects: []

  - method: GET
    path: "/urology/providers"
    description: "List providers, filterable by role and credential standing."
    roles: [PracticeAdmin, Scheduler, Urologist, ProcedureNurse, SterileProcessingTech, PathologyLiaison, PelvicHealthCoordinator]
    code: 200
    input: ["role_type?", "credential_status?", "hld_certified?", "limit?", "offset?"]
    output: Provider[]
    side_effects: []

  # ---- Patient ------------------------------------------------------------
  - method: POST
    path: "/urology/patients"
    description: "Register a patient and bind them to a primary urologist."
    roles: [PracticeAdmin, Scheduler]
    code: 201
    input: [mrn, full_name, date_of_birth, primary_urologist_id, egfr, "anticoagulant_flag?", "antibiotic_allergy_class?"]
    output: Patient
    side_effects:
      - "outstanding_recall_count and open_notification_count initialise to 0"
      - "anticoagulant_flag defaults to false and antibiotic_allergy_class defaults to NONE"

  - method: PATCH
    path: "/urology/patients/{id}"
    description: "Update a patient's renal function, anticoagulation status or antibiotic allergy class."
    roles: [PracticeAdmin, Urologist]
    code: 200
    input: ["egfr?", "anticoagulant_flag?", "antibiotic_allergy_class?"]
    output: Patient
    side_effects:
      - "increments Patient.version by 1, which is what makes a previously captured expected_patient_version stale for §1.2.1 rule recall-create-stale-patient"
      - "does NOT retro-recompute any already-scheduled case's occupancy window"

  - method: GET
    path: "/urology/patients/{id}"
    description: "Read one patient with the derived outstanding_recall_count and open_notification_count."
    roles: [PracticeAdmin, Scheduler, Urologist, ProcedureNurse, SterileProcessingTech, PathologyLiaison, PelvicHealthCoordinator]
    code: 200
    input: []
    output: Patient
    side_effects: []

  - method: GET
    path: "/urology/patients"
    description: "List patients, filterable by primary urologist or MRN."
    roles: [PracticeAdmin, Scheduler, Urologist, ProcedureNurse, SterileProcessingTech, PathologyLiaison, PelvicHealthCoordinator]
    code: 200
    input: ["primary_urologist_id?", "mrn?", "limit?", "offset?"]
    output: Patient[]
    side_effects: []

  # ---- ProcedureRoom ------------------------------------------------------
  - method: POST
    path: "/urology/procedure-rooms"
    description: "Commission a procedure room and record its imaging accreditation."
    roles: [PracticeAdmin]
    code: 201
    input: [name, room_type, "turnover_minutes?", "accreditation_body?", "accreditation_expires_on?"]
    output: ProcedureRoom
    side_effects:
      - "turnover_minutes defaults to 10, room_status defaults to OPEN, occupied_block_count initialises to 0"

  - method: PATCH
    path: "/urology/procedure-rooms/{id}"
    description: "Close or reopen a room, retune its turnover allowance, or renew its accreditation."
    roles: [PracticeAdmin]
    code: 200
    input: ["room_status?", "turnover_minutes?", "accreditation_body?", "accreditation_expires_on?"]
    output: ProcedureRoom
    side_effects:
      - "increments ProcedureRoom.version by 1, which is what makes a previously captured expected_room_version stale for §1.2.1 rule case-schedule-stale-room"
      - "does NOT retro-recompute the turnover of cases already scheduled in this room"

  - method: GET
    path: "/urology/procedure-rooms/{id}"
    description: "Read one room with its derived occupied_block_count."
    roles: [PracticeAdmin, Scheduler, Urologist, ProcedureNurse, SterileProcessingTech, PathologyLiaison, PelvicHealthCoordinator]
    code: 200
    input: []
    output: ProcedureRoom
    side_effects: []

  - method: GET
    path: "/urology/procedure-rooms"
    description: "List rooms, filterable by type and open/closed status."
    roles: [PracticeAdmin, Scheduler, Urologist, ProcedureNurse, SterileProcessingTech, PathologyLiaison, PelvicHealthCoordinator]
    code: 200
    input: ["room_type?", "room_status?", "limit?", "offset?"]
    output: ProcedureRoom[]
    side_effects: []

  # ---- ProcedureType ------------------------------------------------------
  - method: POST
    path: "/urology/procedure-types"
    description: "Define a procedure type: its base duration, cleanup class, room requirement, scope/specimen/antibiotic/consignment obligations and required preparation codes."
    roles: [PracticeAdmin]
    code: 201
    input: [code, base_minutes, cleanup_class, allowed_room_type, "requires_scope?", "requires_specimen?", "requires_antibiotic?", "consignment_required?", "single_use_device_sku?", "required_prep_codes?"]
    output: ProcedureType
    side_effects:
      - "all four boolean obligations default to false and required_prep_codes defaults to the empty array, which makes validations[priority=34] pass vacuously for that type"

  - method: GET
    path: "/urology/procedure-types/{id}"
    description: "Read one procedure type."
    roles: [PracticeAdmin, Scheduler, Urologist, ProcedureNurse, SterileProcessingTech, PathologyLiaison, PelvicHealthCoordinator]
    code: 200
    input: []
    output: ProcedureType
    side_effects: []

  - method: GET
    path: "/urology/procedure-types"
    description: "List procedure types."
    roles: [PracticeAdmin, Scheduler, Urologist, ProcedureNurse, SterileProcessingTech, PathologyLiaison, PelvicHealthCoordinator]
    code: 200
    input: ["code?", "allowed_room_type?", "requires_scope?", "limit?", "offset?"]
    output: ProcedureType[]
    side_effects: []

  # ---- ScopeAsset ---------------------------------------------------------
  - method: POST
    path: "/urology/scope-assets"
    description: "Add a flexible cystoscope to the sterile-processing inventory."
    roles: [PracticeAdmin, SterileProcessingTech]
    code: 201
    input: [serial_number, scope_model, channel_count]
    output: ScopeAsset
    side_effects:
      - "status defaults to AVAILABLE, cycles_since_leak_test to 0, leak_test_required to false, hld_pass_at and reprocess_due_at to null"
      - "a scope in this state fails validations[priority=52] at check-in because hld_pass_at is null: it must be commissioned or reprocessed before first patient use"

  - method: POST
    path: "/urology/scope-assets/{id}/commissioning"
    description: "Record the manufacturer's factory high-level disinfection attestation for a never-used scope, making it ready for its first case without a full reprocessing cycle."
    roles: [SterileProcessingTech]
    code: 200
    input: [attesting_provider_id]
    output: ScopeAsset
    side_effects:
      - "hld_pass_at = logical clock instant; status stays AVAILABLE and reprocess_due_at stays null"
      - "increments ScopeAsset.version by 1"
      - "rejected with ERR_INVALID_REPROCESSING_TRANSITION when status is not AVAILABLE or hld_pass_at is already non-null"

  - method: GET
    path: "/urology/scope-assets/{id}"
    description: "Read one scope with its sterile-processing state."
    roles: [PracticeAdmin, Scheduler, Urologist, ProcedureNurse, SterileProcessingTech, PathologyLiaison, PelvicHealthCoordinator]
    code: 200
    input: []
    output: ScopeAsset
    side_effects: []

  - method: GET
    path: "/urology/scope-assets"
    description: "List scopes, filterable by sterile-processing status and leak-test debt."
    roles: [PracticeAdmin, Scheduler, Urologist, ProcedureNurse, SterileProcessingTech, PathologyLiaison, PelvicHealthCoordinator]
    code: 200
    input: ["status?", "leak_test_required?", "serial_number?", "limit?", "offset?"]
    output: ScopeAsset[]
    side_effects: []

  # ---- ConsignmentLot -----------------------------------------------------
  - method: POST
    path: "/urology/consignment-lots"
    description: "Receive a consignment lot of single-use devices from a supplier."
    roles: [PracticeAdmin]
    code: 201
    input: [supplier_name, sku, device_class, quantity_received, unit_price_cents, lot_expires_on]
    output: ConsignmentLot
    side_effects:
      - "quantity_available = quantity_received; reserved, consumed, returned and wasted initialise to 0"
      - "billed_amount_cents = 0, billing_basis = PROVISIONAL, billing_status = CONSIGNED"

  - method: POST
    path: "/urology/consignment-lots/{id}/return"
    description: "Return unspent consigned units to the supplier."
    roles: [PracticeAdmin]
    code: 200
    input: [quantity]
    output: ConsignmentLot
    side_effects:
      - "quantity_available -= quantity and quantity_returned += quantity"
      - "recomputes billed_amount_cents under the FINAL variant of calculations.consignment_billing and sets billing_basis = FINAL"
      - "re-derives billing_status from the counters"
      - "increments ConsignmentLot.version by 1"

  - method: GET
    path: "/urology/consignment-lots/{id}"
    description: "Read one lot with its unit counters and billing state."
    roles: [PracticeAdmin, Scheduler, Urologist, ProcedureNurse, SterileProcessingTech, PathologyLiaison, PelvicHealthCoordinator]
    code: 200
    input: []
    output: ConsignmentLot
    side_effects: []

  - method: GET
    path: "/urology/consignment-lots"
    description: "List consignment lots, filterable by sku, device class and billing status."
    roles: [PracticeAdmin, Scheduler, Urologist, ProcedureNurse, SterileProcessingTech, PathologyLiaison, PelvicHealthCoordinator]
    code: 200
    input: ["sku?", "device_class?", "billing_status?", "limit?", "offset?"]
    output: ConsignmentLot[]
    side_effects: []

  # ---- ProcedureCase ------------------------------------------------------
  - method: POST
    path: "/urology/procedure-cases"
    description: "Draft a procedure case for a patient in a room with a primary urologist. Body FKs are resolved in the order patient_id, procedure_type_id, room_id, primary_provider_id."
    roles: [Scheduler, Urologist]
    code: 201
    input: [patient_id, procedure_type_id, room_id, primary_provider_id, scheduled_start_at, "indication_note?"]
    output: ProcedureCase
    side_effects:
      - "schedule_status = DRAFT, clearance_status = PENDING_PREP, device_state = NONE, acknowledged_prep_codes = []"
      - "computes procedure_minutes, turnover_minutes, scheduled_end_at and block_end_at per calculations.case_occupancy_window"
      - "computes blocking_reason_codes per calculations.check_in_readiness_gates"
      - "a DRAFT case occupies neither the room nor the provider, so no overlap check runs here"

  - method: POST
    path: "/urology/procedure-cases/{id}/schedule"
    description: "Commit a drafted case to the room calendar. Recomputes the occupancy window, then enforces the room's half-open interval and the provider's closed buffered interval."
    roles: [Scheduler]
    code: 200
    input: [expected_room_version]
    output: ProcedureCase
    side_effects:
      - "schedule_status DRAFT -> SCHEDULED"
      - "recomputes procedure_minutes, turnover_minutes, scheduled_end_at, block_end_at per calculations.case_occupancy_window"
      - "increments ProcedureRoom.version by 1"
      - "recomputes ProcedureRoom.occupied_block_count"
      - "recomputes blocking_reason_codes"

  - method: POST
    path: "/urology/procedure-cases/{id}/reschedule"
    description: "Move a scheduled case to a new start time and optionally a new room; the case stays SCHEDULED."
    roles: [Scheduler]
    code: 200
    input: [scheduled_start_at, "room_id?"]
    output: ProcedureCase
    side_effects:
      - "schedule_status SCHEDULED -> SCHEDULED (self-loop)"
      - "recomputes the whole occupancy window per calculations.case_occupancy_window against the target room's current turnover_minutes"
      - "increments ProcedureRoom.version by 1 for the vacated room and by 1 for the taken room (a single increment when they are the same room)"
      - "recomputes ProcedureRoom.occupied_block_count for every room whose version changed"
      - "recomputes blocking_reason_codes"

  - method: POST
    path: "/urology/procedure-cases/{id}/prep-acknowledgements"
    description: "Record that the patient acknowledged one pre-procedure preparation instruction on a given channel."
    roles: [Scheduler, ProcedureNurse]
    code: 200
    input: [instruction_code, channel]
    output: ProcedureCase
    side_effects:
      - "clearance_status PENDING_PREP -> PREP_ACKNOWLEDGED (or PREP_ACKNOWLEDGED self-loop)"
      - "instruction_code appended to acknowledged_prep_codes when not already present; a repeat is idempotent and not an error"
      - "recomputes blocking_reason_codes"

  - method: POST
    path: "/urology/procedure-cases/{id}/clearance-review"
    description: "Clear, block or waive a case's pre-procedure preparation. decision WAIVE is restricted to Urologist by validations[priority=4]."
    roles: [ProcedureNurse, Urologist]
    code: 200
    input: [decision, "block_reason_code?"]
    output: ProcedureCase
    side_effects:
      - "clearance_status moves to CLEARED, BLOCKED or PREP_WAIVED per the clearance dimension of §1.2"
      - "clearance_block_reason set on BLOCK and cleared to null on CLEAR and WAIVE"
      - "recomputes blocking_reason_codes"

  - method: POST
    path: "/urology/procedure-cases/{id}/scope-assignment"
    description: "Reserve a specific reprocessed scope for this case under optimistic concurrency on the scope."
    roles: [ProcedureNurse]
    code: 200
    input: [scope_asset_id, expected_scope_asset_version]
    output: ProcedureCase
    side_effects:
      - "case.scope_asset_id = scope_asset_id"
      - "ScopeAsset.status AVAILABLE -> IN_USE"
      - "increments ScopeAsset.version by 1"
      - "recomputes blocking_reason_codes"

  - method: POST
    path: "/urology/procedure-cases/{id}/device-reservation"
    description: "Hold single-use device units from a consignment lot for this case under optimistic concurrency on the lot."
    roles: [ProcedureNurse, PracticeAdmin]
    code: 200
    input: [consignment_lot_id, quantity, expected_lot_version]
    output: ProcedureCase
    side_effects:
      - "case.device_lot_id = consignment_lot_id, case.device_quantity = quantity, case.device_state = RESERVED"
      - "lot.quantity_available -= quantity and lot.quantity_reserved += quantity"
      - "recomputes lot.billed_amount_cents under the PROVISIONAL variant of calculations.consignment_billing and sets lot.billing_basis = PROVISIONAL"
      - "re-derives lot.billing_status from the counters"
      - "increments ConsignmentLot.version by 1"
      - "recomputes blocking_reason_codes"

  - method: POST
    path: "/urology/procedure-cases/{id}/check-in"
    description: "Bring the patient into the room. Every readiness gate of calculations.check_in_readiness_gates is enforced here in validation-priority order."
    roles: [ProcedureNurse]
    code: 200
    input: []
    output: ProcedureCase
    side_effects:
      - "schedule_status SCHEDULED -> IN_ROOM"
      - "checked_in_at = logical clock instant"
      - "blocking_reason_codes recomputed to the empty array"

  - method: POST
    path: "/urology/procedure-cases/{id}/complete"
    description: "Close out the procedure. Trigger of CASCADE A: case -> surveillance recall -> patient counter, plus the scope-soiling and device-consumption fan-out."
    roles: [ProcedureNurse, Urologist]
    code: 200
    input: ["outcome_note?"]
    output: ProcedureCase
    side_effects:
      - "schedule_status IN_ROOM -> COMPLETED and completed_at = logical clock instant"
      - "CASCADE A hop 2: the single highest-ranked matching SurveillanceRecall of this patient transitions to SATISFIED with satisfying_case_id = this case; the empty candidate set is a no-op"
      - "CASCADE A hop 3: Patient.outstanding_recall_count recomputed and Patient.version incremented by 1"
      - "assigned ScopeAsset IN_USE -> SOILED with cycles_since_leak_test += 1, reprocess_due_at = clock + SCOPE_REPROCESS_SLA_HOURS, leak_test_required flipped at LEAK_TEST_CYCLE_LIMIT, ScopeAsset.version += 1"
      - "RESERVED device units -> CONSUMED, lot counters shifted, lot.billed_amount_cents recomputed under the FINAL variant, lot.billing_status re-derived, ConsignmentLot.version += 1"
      - "recomputes ProcedureRoom.occupied_block_count (a COMPLETED case still occupies its historical block)"

  - method: POST
    path: "/urology/procedure-cases/{id}/cancel"
    description: "Cancel a drafted or scheduled case. Compensating action: releases the scope, RELEASES device units back to available, and cancels un-administered antibiotic orders."
    roles: [Scheduler, Urologist]
    code: 200
    input: [cancel_reason_code]
    output: ProcedureCase
    side_effects:
      - "schedule_status -> CANCELLED and cancel_reason_code recorded"
      - "assigned ScopeAsset IN_USE -> AVAILABLE with case.scope_asset_id -> null and ScopeAsset.version += 1; cycles_since_leak_test is NOT incremented"
      - "RESERVED device units -> RELEASED, lot.quantity_reserved -= device_quantity, lot.quantity_available += device_quantity, PROVISIONAL rebill, billing_status re-derived, ConsignmentLot.version += 1"
      - "every AntibioticOrder on the case with status ORDERED -> CANCELLED"
      - "when the case was SCHEDULED: ProcedureRoom.version += 1 and occupied_block_count recomputed"
      - "blocking_reason_codes recomputed to the empty array"

  - method: POST
    path: "/urology/procedure-cases/{id}/no-show"
    description: "Mark a scheduled case as a no-show once the grace period has elapsed. Divergent compensation: device units are WASTED, not released."
    roles: [Scheduler]
    code: 200
    input: []
    output: ProcedureCase
    side_effects:
      - "schedule_status SCHEDULED -> NO_SHOW and cancel_reason_code = NO_SHOW_GRACE_ELAPSED"
      - "assigned ScopeAsset IN_USE -> AVAILABLE with case.scope_asset_id -> null and ScopeAsset.version += 1"
      - "RESERVED device units -> WASTED, lot.quantity_reserved -= device_quantity, lot.quantity_wasted += device_quantity, PROVISIONAL rebill, billing_status re-derived, ConsignmentLot.version += 1"
      - "every AntibioticOrder on the case with status ORDERED -> CANCELLED"
      - "ProcedureRoom.version += 1 and occupied_block_count recomputed"

  - method: GET
    path: "/urology/procedure-cases/{id}"
    description: "Read one case with both state dimensions and the derived occupancy window."
    roles: [PracticeAdmin, Scheduler, Urologist, ProcedureNurse, SterileProcessingTech, PathologyLiaison, PelvicHealthCoordinator]
    code: 200
    input: []
    output: ProcedureCase
    side_effects: []

  - method: GET
    path: "/urology/procedure-cases/{id}/readiness"
    description: "Computed read: the ordered list of unmet check-in gates for this case, first element first, exactly as calculations.check_in_readiness_gates orders them."
    roles: [PracticeAdmin, Scheduler, Urologist, ProcedureNurse, SterileProcessingTech, PathologyLiaison, PelvicHealthCoordinator]
    code: 200
    input: []
    output: { case_id: string, schedule_status: string, clearance_status: string, blocking_reason_codes: string_array, first_blocking_reason_code: string, check_in_allowed: boolean }
    side_effects: []

  - method: GET
    path: "/urology/procedure-cases"
    description: "List cases, filterable by every foreign key and by either state dimension."
    roles: [PracticeAdmin, Scheduler, Urologist, ProcedureNurse, SterileProcessingTech, PathologyLiaison, PelvicHealthCoordinator]
    code: 200
    input: ["patient_id?", "procedure_type_id?", "room_id?", "primary_provider_id?", "scope_asset_id?", "device_lot_id?", "schedule_status?", "clearance_status?", "limit?", "offset?"]
    output: ProcedureCase[]
    side_effects: []

  # ---- AntibioticOrder ----------------------------------------------------
  - method: POST
    path: "/urology/antibiotic-orders"
    description: "Order pre-procedure antibiotic prophylaxis. With requested_agent AUTO the agent is selected by calculations.antibiotic_agent_selection; the acting urologist must be ordered_by_provider_id."
    roles: [Urologist]
    code: 201
    input: [case_id, ordered_by_provider_id, requested_agent]
    output: AntibioticOrder
    side_effects:
      - "agent, dose_mg and route computed per calculations.antibiotic_agent_selection"
      - "prophylaxis_window_start_at = case.scheduled_start_at - PROPHYLAXIS_WINDOW_MIN"
      - "status = ORDERED and administered_at = null"
      - "recomputes the case's blocking_reason_codes"

  - method: POST
    path: "/urology/antibiotic-orders/{id}/administer"
    description: "Record administration of an ordered antibiotic inside the prophylaxis window."
    roles: [ProcedureNurse, Urologist]
    code: 200
    input: [administered_at]
    output: AntibioticOrder
    side_effects:
      - "status ORDERED -> ADMINISTERED and administered_at recorded"
      - "clears the ANTIBIOTIC_NOT_ADMINISTERED gate from the case's blocking_reason_codes"

  - method: GET
    path: "/urology/antibiotic-orders/{id}"
    description: "Read one antibiotic order with its selected agent, dose and route."
    roles: [PracticeAdmin, Scheduler, Urologist, ProcedureNurse, SterileProcessingTech, PathologyLiaison, PelvicHealthCoordinator]
    code: 200
    input: []
    output: AntibioticOrder
    side_effects: []

  - method: GET
    path: "/urology/antibiotic-orders"
    description: "List antibiotic orders, filterable by case, ordering provider and status."
    roles: [PracticeAdmin, Scheduler, Urologist, ProcedureNurse, SterileProcessingTech, PathologyLiaison, PelvicHealthCoordinator]
    code: 200
    input: ["case_id?", "ordered_by_provider_id?", "status?", "agent?", "limit?", "offset?"]
    output: AntibioticOrder[]
    side_effects: []

  # ---- ReprocessingLog ----------------------------------------------------
  - method: POST
    path: "/urology/reprocessing-logs"
    description: "Open a sterile-processing stage log against a scope. Stage order is enforced by validations[priority=56] and only one log may be OPEN per scope."
    roles: [SterileProcessingTech]
    code: 201
    input: [scope_asset_id, stage, performed_by_provider_id, "case_id?"]
    output: ReprocessingLog
    side_effects:
      - "log_status = OPEN, started_at = logical clock instant, outcome = null, attested_by_provider_id = null"
      - "the scope's status is unchanged by opening a log; it moves only when the log closes"

  - method: POST
    path: "/urology/reprocessing-logs/{id}/complete"
    description: "Close a stage log with an outcome and a second-person attestation. The attester must not be the performer (segregation of duties)."
    roles: [SterileProcessingTech]
    code: 200
    input: [outcome, attested_by_provider_id]
    output: ReprocessingLog
    side_effects:
      - "log_status OPEN -> CLOSED, completed_at = logical clock instant, outcome recorded"
      - "the owning ScopeAsset advances per the ScopeAsset machine for this (stage, outcome) pair, incrementing ScopeAsset.version"
      - "stage HIGH_LEVEL_DISINFECT with outcome PASS sets scope.hld_pass_at = completed_at"
      - "stage DRY_STORE with outcome PASS returns the scope to AVAILABLE and clears reprocess_due_at to null"
      - "stage LEAK_TEST with outcome PASS zeroes cycles_since_leak_test and clears leak_test_required"
      - "any outcome FAIL is CASCADE C: the log closes, the scope becomes QUARANTINED, and leak_test_required is set true with reprocess_due_at cleared"

  - method: GET
    path: "/urology/reprocessing-logs/{id}"
    description: "Read one reprocessing log."
    roles: [PracticeAdmin, Scheduler, Urologist, ProcedureNurse, SterileProcessingTech, PathologyLiaison, PelvicHealthCoordinator]
    code: 200
    input: []
    output: ReprocessingLog
    side_effects: []

  - method: GET
    path: "/urology/reprocessing-logs"
    description: "List reprocessing logs, filterable by scope, case, performer and attester — the reprocessing audit trail."
    roles: [PracticeAdmin, Scheduler, Urologist, ProcedureNurse, SterileProcessingTech, PathologyLiaison, PelvicHealthCoordinator]
    code: 200
    input: ["scope_asset_id?", "case_id?", "performed_by_provider_id?", "attested_by_provider_id?", "stage?", "log_status?", "outcome?", "limit?", "offset?"]
    output: ReprocessingLog[]
    side_effects: []

  # ---- Specimen -----------------------------------------------------------
  - method: POST
    path: "/urology/specimens"
    description: "Label and collect a specimen container in the room. The collecting provider must be the acting user and the case must expect specimens."
    roles: [Urologist, ProcedureNurse]
    code: 201
    input: [case_id, collected_by_provider_id, container_label, specimen_type, site_code]
    output: Specimen
    side_effects:
      - "collected_at = logical clock instant, chain_status = COLLECTED, notification_status = NOT_REQUIRED, notification_attempt_count = 0"
      - "a case cannot be completed while any of its specimens is still COLLECTED"

  - method: POST
    path: "/urology/specimens/{id}/accession"
    description: "Receive the container in pathology. condition INTACT accessions it; condition COMPROMISED rejects it and opens a notification loop plus, for prostate biopsies, a fresh surveillance recall."
    roles: [PathologyLiaison]
    code: 200
    input: [accession_number, received_at, condition_on_receipt]
    output: Specimen
    side_effects:
      - "chain_status COLLECTED -> ACCESSIONED (INTACT) or COLLECTED -> REJECTED (COMPROMISED)"
      - "on COMPROMISED: notification_status -> PENDING with pathology_result left null and escalation_due_at computed from the INSUFFICIENT grade window"
      - "on COMPROMISED of a PROSTATE_BIOPSY case: a PROSTATE SurveillanceRecall at risk_tier INTERMEDIATE is created, any open PROSTATE recall of that patient becomes SUPERSEDED, and Patient.outstanding_recall_count and Patient.version are updated"

  - method: POST
    path: "/urology/specimens/{id}/result"
    description: "File the pathology result. Trigger of CASCADE B: specimen -> new surveillance recall -> superseded predecessor -> patient counter."
    roles: [PathologyLiaison]
    code: 200
    input: [pathology_result]
    output: Specimen
    side_effects:
      - "chain_status ACCESSIONED -> RESULTED, result_at = logical clock instant"
      - "notification_status NOT_REQUIRED -> PENDING and escalation_due_at computed per calculations.notification_escalation_clock at attempt count 0"
      - "CASCADE B hop 2: a SurveillanceRecall is created for the patient under SPECIMEN_PROTOCOL_MAP and RESULT_RISK_TIER unless the result is INSUFFICIENT"
      - "CASCADE B hop 3: every other open recall of the same (patient, protocol) becomes SUPERSEDED and the newest becomes predecessor_recall_id"
      - "CASCADE B hop 4: Patient.outstanding_recall_count recomputed and Patient.version incremented by 1"

  - method: POST
    path: "/urology/specimens/{id}/notification-attempt"
    description: "Record one attempt to notify the patient of a result. outcome REACHED acknowledges; outcome UNREACHABLE re-arms the loop with backoff until MAX_NOTIFY_ATTEMPTS."
    roles: [PathologyLiaison, ProcedureNurse]
    code: 200
    input: [outcome, channel]
    output: Specimen
    side_effects:
      - "notification_attempt_count += 1"
      - "outcome REACHED -> notification_status ACKNOWLEDGED; outcome UNREACHABLE -> ATTEMPTED, or FAILED once the incremented count reaches MAX_NOTIFY_ATTEMPTS"
      - "escalation_due_at recomputed per calculations.notification_escalation_clock with the new attempt count; the weekend extension is NOT re-evaluated"
      - "recomputes Patient.open_notification_count"

  - method: GET
    path: "/urology/specimens/{id}"
    description: "Read one specimen with both chain and notification dimensions."
    roles: [PracticeAdmin, Scheduler, Urologist, ProcedureNurse, SterileProcessingTech, PathologyLiaison, PelvicHealthCoordinator]
    code: 200
    input: []
    output: Specimen
    side_effects: []

  - method: GET
    path: "/urology/specimens"
    description: "List specimens, filterable by case, collecting provider and either state dimension."
    roles: [PracticeAdmin, Scheduler, Urologist, ProcedureNurse, SterileProcessingTech, PathologyLiaison, PelvicHealthCoordinator]
    code: 200
    input: ["case_id?", "collected_by_provider_id?", "chain_status?", "notification_status?", "specimen_type?", "limit?", "offset?"]
    output: Specimen[]
    side_effects: []

  # ---- SurveillanceRecall -------------------------------------------------
  - method: POST
    path: "/urology/surveillance-recalls"
    description: "Open a surveillance recall for a patient under optimistic concurrency on the patient. Creating one supersedes any open recall of the same patient and protocol."
    roles: [Urologist]
    code: 201
    input: [patient_id, protocol, risk_tier, anchor_date, expected_patient_version, "source_specimen_id?"]
    output: SurveillanceRecall
    side_effects:
      - "status = SCHEDULED_DUE, due_basis = PROTOCOL_ANCHORED, lapse_days = 0, predecessor_recall_id = null unless a predecessor is superseded"
      - "interval_months and due_on computed per the PROTOCOL_ANCHORED variant of calculations.recall_due_date"
      - "every other recall of the same (patient_id, protocol) with status IN {SCHEDULED_DUE, OVERDUE} transitions to SUPERSEDED, newest becoming this row's predecessor_recall_id"
      - "Patient.outstanding_recall_count recomputed and Patient.version incremented by 1"

  - method: POST
    path: "/urology/surveillance-recalls/{id}/close"
    description: "Close a recall administratively (patient deceased, transferred, protocol retired)."
    roles: [Urologist]
    code: 200
    input: [closed_reason]
    output: SurveillanceRecall
    side_effects:
      - "status SCHEDULED_DUE or OVERDUE -> CLOSED with closed_reason recorded"
      - "Patient.outstanding_recall_count recomputed and Patient.version incremented by 1"

  - method: POST
    path: "/urology/recall-sweeps"
    description: "System checkpoint over the recall book and the notification queue, executed in three pinned steps: step 1 recomputes due_on for every recall with status IN {SCHEDULED_DUE, OVERDUE} under the EVENT_ANCHORED variant; step 2 moves lapsed recalls to OVERDUE and pulls recovered ones back to SCHEDULED_DUE; step 3 escalates every PENDING or ATTEMPTED specimen notification whose escalation_due_at is before the clock. Step 1 always precedes step 2, so an event-anchored recall whose due date moved into the future never appears as OVERDUE."
    roles: [PracticeAdmin, Urologist]
    code: 200
    input: []
    output: { swept_at: string, recomputed_recall_count: integer, overdue_recall_count: integer, restored_recall_count: integer, escalated_specimen_count: integer }
    side_effects:
      - "step 1 rewrites due_on and due_basis on every open recall; a recall with no COMPLETED surveillance case keeps PROTOCOL_ANCHORED"
      - "step 2 sets lapse_days on the recalls it moves to OVERDUE and zeroes lapse_days on the ones it restores"
      - "step 3 moves specimen notification_status PENDING or ATTEMPTED -> ESCALATED without touching notification_attempt_count"
      - "Patient.outstanding_recall_count and Patient.open_notification_count recomputed for every affected patient"

  - method: GET
    path: "/urology/surveillance-recalls/{id}"
    description: "Read one surveillance recall."
    roles: [PracticeAdmin, Scheduler, Urologist, ProcedureNurse, SterileProcessingTech, PathologyLiaison, PelvicHealthCoordinator]
    code: 200
    input: []
    output: SurveillanceRecall
    side_effects: []

  - method: GET
    path: "/urology/surveillance-recalls"
    description: "List surveillance recalls, filterable by patient, predecessor, source specimen and satisfying case."
    roles: [PracticeAdmin, Scheduler, Urologist, ProcedureNurse, SterileProcessingTech, PathologyLiaison, PelvicHealthCoordinator]
    code: 200
    input: ["patient_id?", "predecessor_recall_id?", "source_specimen_id?", "satisfying_case_id?", "protocol?", "status?", "due_basis?", "limit?", "offset?"]
    output: SurveillanceRecall[]
    side_effects: []

  # ---- PelvicHealthReferral -----------------------------------------------
  - method: POST
    path: "/urology/pelvic-health-referrals"
    description: "Refer a patient into a pelvic health program off a completed procedure."
    roles: [Urologist, PelvicHealthCoordinator]
    code: 201
    input: [patient_id, source_case_id, program, requested_visits]
    output: PelvicHealthReferral
    side_effects:
      - "status = REQUESTED with every visit counter at 0 and waitlist_position null"
      - "rejected with ERR_SOURCE_CASE_NOT_COMPLETED when the source case is not COMPLETED"

  - method: POST
    path: "/urology/pelvic-health-referrals/{id}/decision"
    description: "Accept, decline, waitlist or withdraw a referral. ACCEPT opens the visit ledger; WITHDRAW forfeits whatever remains."
    roles: [PelvicHealthCoordinator]
    code: 200
    input: [decision, "authorized_visits?", "decline_reason?"]
    output: PelvicHealthReferral
    side_effects:
      - "ACCEPT: visits_authorized = min(requested_visits, authorized_visits, PROGRAM_VISIT_CAP[program]); visits_remaining = visits_authorized; therapy_start_by = source case completion date + THERAPY_START_WINDOW_DAYS"
      - "WAITLIST: waitlist_position = 1 + the count of WAITLISTED referrals in the same program"
      - "DECLINE: decline_reason recorded and the ledger stays at zero"
      - "WITHDRAW: visits_forfeited += visits_remaining, then visits_remaining -> 0, so visits_authorized stays conserved"

  - method: POST
    path: "/urology/pelvic-health-referrals/{id}/visits"
    description: "Log a therapy visit or void the most recent one. Logging the last authorised visit auto-completes the referral; voiding it returns the referral to ACCEPTED."
    roles: [PelvicHealthCoordinator]
    code: 200
    input: [action, "visit_date?"]
    output: PelvicHealthReferral
    side_effects:
      - "LOG: visits_used += 1, visits_remaining -= 1, first_visit_date set on the first logged visit; status auto-advances ACCEPTED -> COMPLETED when visits_remaining reaches 0"
      - "VOID_LAST: visits_used -= 1, visits_remaining += 1, first_visit_date recomputed; status returns COMPLETED -> ACCEPTED when it had completed"
      - "the invariant visits_authorized == visits_remaining + visits_used + visits_forfeited holds after every call"

  - method: GET
    path: "/urology/pelvic-health-referrals/{id}"
    description: "Read one referral with its visit ledger."
    roles: [PracticeAdmin, Scheduler, Urologist, ProcedureNurse, SterileProcessingTech, PathologyLiaison, PelvicHealthCoordinator]
    code: 200
    input: []
    output: PelvicHealthReferral
    side_effects: []

  - method: GET
    path: "/urology/pelvic-health-referrals"
    description: "List referrals, filterable by patient, source case, program and status."
    roles: [PracticeAdmin, Scheduler, Urologist, ProcedureNurse, SterileProcessingTech, PathologyLiaison, PelvicHealthCoordinator]
    code: 200
    input: ["patient_id?", "source_case_id?", "program?", "status?", "limit?", "offset?"]
    output: PelvicHealthReferral[]
    side_effects: []

  # ---- test-driving endpoint ----------------------------------------------
  - method: POST
    path: "/urology/_clock/set_current_utc"
    description: "Set the server's logical UTC clock, which every window, deadline, expiry, sweep and readiness gate in this scaffold reads. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to real wall-clock time."
    roles: [PracticeAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects:
      - "sets the logical clock; no entity is mutated and no sweep is implied"
      - "recall lapse, notification escalation and accreditation expiry are all evaluated against this clock at the moment of the next request"

# ============================================================================
# §1.6 Error Code Catalog
# Every code below is triggerable by at least one endpoint declared in §1.5.
# ============================================================================

errors:

  # ---- authentication and authorization -----------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing or blank"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "X-User-ID does not resolve to a Provider of the claimed role, the provider's credential_status is SUSPENDED, the role is not in the endpoint's allowlist, or a ProcedureNurse submits clearance decision WAIVE"
  - id: ERR_ACTOR_IDENTITY_MISMATCH
    http: 403
    condition: "the provider named in the body (ordered_by_provider_id, performed_by_provider_id, collected_by_provider_id) is not the acting X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "attested_by_provider_id equals the reprocessing log's performed_by_provider_id, or the attester is not the acting user"

  # ---- request shape ------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "malformed body, missing required field, undeclared enum member, negative integer where non-negative is required, unparseable date/datetime, or limit outside 1..100 / offset below 0"

  # ---- existence ----------------------------------------------------------
  - id: ERR_PROVIDER_NOT_FOUND
    http: 404
    condition: "a provider id in the path or body names no Provider"
  - id: ERR_PATIENT_NOT_FOUND
    http: 404
    condition: "a patient id in the path or body names no Patient"
  - id: ERR_ROOM_NOT_FOUND
    http: 404
    condition: "a room id in the path or body names no ProcedureRoom"
  - id: ERR_PROCEDURE_TYPE_NOT_FOUND
    http: 404
    condition: "procedure_type_id names no ProcedureType"
  - id: ERR_CASE_NOT_FOUND
    http: 404
    condition: "a case id in the path or body names no ProcedureCase"
  - id: ERR_SCOPE_NOT_FOUND
    http: 404
    condition: "scope_asset_id names no ScopeAsset"
  - id: ERR_REPROCESSING_LOG_NOT_FOUND
    http: 404
    condition: "the reprocessing log id in the path names no ReprocessingLog"
  - id: ERR_ANTIBIOTIC_ORDER_NOT_FOUND
    http: 404
    condition: "the antibiotic order id in the path names no AntibioticOrder"
  - id: ERR_SPECIMEN_NOT_FOUND
    http: 404
    condition: "a specimen id in the path or body names no Specimen"
  - id: ERR_RECALL_NOT_FOUND
    http: 404
    condition: "the recall id in the path names no SurveillanceRecall"
  - id: ERR_REFERRAL_NOT_FOUND
    http: 404
    condition: "the referral id in the path names no PelvicHealthReferral"
  - id: ERR_LOT_NOT_FOUND
    http: 404
    condition: "a consignment lot id in the path or body names no ConsignmentLot"

  # ---- uniqueness ---------------------------------------------------------
  - id: ERR_DUPLICATE_MRN
    http: 409
    condition: "a second Patient is created with an existing mrn"
  - id: ERR_DUPLICATE_PROCEDURE_TYPE_CODE
    http: 409
    condition: "a second ProcedureType is created with an existing code"
  - id: ERR_DUPLICATE_ROOM_NAME
    http: 409
    condition: "a second ProcedureRoom is created with an existing name"
  - id: ERR_DUPLICATE_SCOPE_SERIAL
    http: 409
    condition: "a second ScopeAsset is created with an existing serial_number"
  - id: ERR_DUPLICATE_CONTAINER_LABEL
    http: 409
    condition: "a second Specimen is created with a container_label already used on the same case_id"

  # ---- state transitions --------------------------------------------------
  - id: ERR_INVALID_CASE_TRANSITION
    http: 409
    condition: "the requested case action is not declared from the case's current schedule_status or clearance_status — completing a SCHEDULED case, rescheduling a COMPLETED case, cancelling an IN_ROOM case, checking in twice"
  - id: ERR_INVALID_SPECIMEN_TRANSITION
    http: 409
    condition: "accessioning a specimen that is not COLLECTED, or filing a result on a specimen that is not ACCESSIONED"
  - id: ERR_INVALID_NOTIFICATION_TRANSITION
    http: 409
    condition: "a notification attempt on a specimen whose notification_status is NOT_REQUIRED, ACKNOWLEDGED or FAILED"
  - id: ERR_INVALID_REPROCESSING_TRANSITION
    http: 409
    condition: "completing an already CLOSED reprocessing log, opening any log against a QUARANTINED scope, or commissioning a scope that is not AVAILABLE or already carries an hld_pass_at"
  - id: ERR_INVALID_RECALL_TRANSITION
    http: 409
    condition: "closing a recall whose status is SATISFIED, SUPERSEDED or already CLOSED"
  - id: ERR_INVALID_REFERRAL_TRANSITION
    http: 409
    condition: "a decision that is not declared from the referral's current status, or logging a visit on a REQUESTED, DECLINED, WAITLISTED or WITHDRAWN referral"

  # ---- cross-entity referential state -------------------------------------
  - id: ERR_SOURCE_CASE_NOT_COMPLETED
    http: 422
    condition: "a pelvic health referral names a source case that is not COMPLETED, or a surveillance recall names a source specimen that is not RESULTED"

  # ---- optimistic concurrency (§1.2.1) ------------------------------------
  - id: ERR_STALE_ROOM_VERSION
    http: 412
    condition: "expected_room_version does not equal the room's current version on case scheduling"
  - id: ERR_STALE_SCOPE_VERSION
    http: 412
    condition: "expected_scope_asset_version does not equal the scope's current version on scope assignment"
  - id: ERR_STALE_LOT_VERSION
    http: 412
    condition: "expected_lot_version does not equal the lot's current version on device reservation"
  - id: ERR_STALE_PATIENT_VERSION
    http: 412
    condition: "expected_patient_version does not equal the patient's current version on surveillance recall creation"

  # ---- preparation and clearance ------------------------------------------
  - id: ERR_PREP_INCOMPLETE
    http: 422
    condition: "clearance decision CLEAR while some code in the procedure type's required_prep_codes is missing from acknowledged_prep_codes"
  - id: ERR_PREP_CODE_NOT_REQUIRED
    http: 422
    condition: "an acknowledged instruction_code is not a member of the procedure type's required_prep_codes"
  - id: ERR_CASE_NOT_CLEARED
    http: 409
    condition: "check-in while clearance_status is PENDING_PREP, PREP_ACKNOWLEDGED or BLOCKED"

  # ---- accreditation ------------------------------------------------------
  - id: ERR_ROOM_ACCREDITATION_LAPSED
    http: 422
    condition: "an IMAGING_BAY or URODYNAMICS_LAB room whose accreditation_expires_on is null or before the logical clock date is scheduled into or checked into"
  - id: ERR_PROVIDER_ACCREDITATION_LAPSED
    http: 422
    condition: "the primary provider's ultrasound_accreditation_expires_on is null or before the logical clock date for an imaging or urodynamics case"

  # ---- antibiotic prophylaxis ---------------------------------------------
  - id: ERR_ANTIBIOTIC_CONTRAINDICATED
    http: 422
    condition: "an explicitly requested agent matches the patient's antibiotic_allergy_class or the patient's egfr is below that agent's min_egfr"
  - id: ERR_NO_ELIGIBLE_ANTIBIOTIC
    http: 422
    condition: "requested_agent AUTO with an empty eligible pool, including every case whose procedure type does not require antibiotics"
  - id: ERR_PROPHYLAXIS_WINDOW_MISSED
    http: 422
    condition: "administered_at falls outside the closed interval [prophylaxis_window_start_at, case.scheduled_start_at]"
  - id: ERR_ANTIBIOTIC_NOT_ADMINISTERED
    http: 422
    condition: "check-in of an antibiotic-requiring case with no ADMINISTERED order"

  # ---- sterile processing -------------------------------------------------
  - id: ERR_SCOPE_NOT_AVAILABLE
    http: 409
    condition: "assigning a scope whose status is IN_USE, SOILED, REPROCESSING or QUARANTINED"
  - id: ERR_SCOPE_LEAK_TEST_DUE
    http: 422
    condition: "assigning a scope whose leak_test_required is true"
  - id: ERR_SCOPE_NOT_READY
    http: 422
    condition: "check-in of a scope-requiring case whose assigned scope is missing, not IN_USE, has never had a high-level disinfection attested, or still carries an outstanding reprocess_due_at"
  - id: ERR_REPROCESSING_STAGE_OUT_OF_ORDER
    http: 422
    condition: "a reprocessing stage is opened that is not the successor of the scope's last CLOSED PASSing stage"
  - id: ERR_REPROCESSING_LOG_ALREADY_OPEN
    http: 409
    condition: "a second reprocessing log is opened while the scope already has one with log_status OPEN"
  - id: ERR_HLD_CERTIFICATION_REQUIRED
    http: 422
    condition: "a HIGH_LEVEL_DISINFECT stage is performed or attested by a provider whose hld_certified is false"

  # ---- scheduling and temporal --------------------------------------------
  - id: ERR_ROOM_CLOSED
    http: 422
    condition: "scheduling or rescheduling into a room whose room_status is CLOSED"
  - id: ERR_ROOM_TYPE_MISMATCH
    http: 422
    condition: "the target room's room_type differs from the procedure type's allowed_room_type"
  - id: ERR_ROOM_WINDOW_CONFLICT
    http: 409
    condition: "the case's half-open occupancy interval [scheduled_start_at, block_end_at) intersects another occupying case in the same room; a start exactly at another case's block_end_at does NOT conflict"
  - id: ERR_PROVIDER_DOUBLE_BOOKED
    http: 409
    condition: "the case's closed buffered provider interval touches or overlaps another occupying case of the same primary provider"
  - id: ERR_CHECKIN_TOO_EARLY
    http: 422
    condition: "check-in more than EARLY_CHECKIN_WINDOW_MIN (30) minutes before scheduled_start_at"
  - id: ERR_NO_SHOW_GRACE_NOT_ELAPSED
    http: 422
    condition: "no-show marked at or before scheduled_start_at plus NO_SHOW_GRACE_MIN (15) minutes"
  - id: ERR_SPECIMEN_TRANSIT_EXPIRED
    http: 422
    condition: "accession more than MAX_TRANSIT_HOURS (24) after collected_at, or with received_at before collected_at"
  - id: ERR_SPECIMEN_NOT_EXPECTED
    http: 422
    condition: "a specimen is collected on a case whose procedure type does not require specimens, or whose schedule_status is not IN_ROOM or COMPLETED"
  - id: ERR_THERAPY_START_WINDOW_MISSED
    http: 422
    condition: "a referral is accepted more than THERAPY_START_WINDOW_DAYS (30) days after its source case completed"

  # ---- consignment and devices --------------------------------------------
  - id: ERR_LOT_EXPIRED
    http: 422
    condition: "reserving from a lot whose lot_expires_on is before the logical clock date"
  - id: ERR_DEVICE_SKU_MISMATCH
    http: 422
    condition: "the lot's sku differs from the procedure type's single_use_device_sku"
  - id: ERR_DEVICE_ALREADY_RESERVED
    http: 409
    condition: "reserving devices for a case whose device_state is already RESERVED, CONSUMED or WASTED"
  - id: ERR_DEVICE_NOT_RESERVED
    http: 422
    condition: "check-in of a consignment-requiring case whose device_state is not RESERVED"
  - id: ERR_CONSIGNMENT_INSUFFICIENT
    http: 422
    condition: "the requested quantity exceeds the lot's quantity_available"
  - id: ERR_CONSIGNMENT_RETURN_EXCEEDS_AVAILABLE
    http: 422
    condition: "the returned quantity exceeds the lot's quantity_available"

  # ---- pelvic health ledger -----------------------------------------------
  - id: ERR_VISIT_ALLOCATION_EXHAUSTED
    http: 422
    condition: "action LOG with visits_remaining at 0, or action VOID_LAST with visits_used at 0"

# ============================================================================
# §1.7 RBAC Matrix — role model: segregation_of_duties (peer clinical roles
# with a single opaque administrator). Six of the seven roles are backed by a
# Provider row whose role_type must match, which is what makes
# validations[priority=2] and the attestation rules enforceable.
# ============================================================================

roles:

  - name: PracticeAdmin
    description: "Practice operations administrator: configures the roster, rooms, procedure types and consignment inventory, and runs the recall sweep."
    identity: "opaque"
    exclusive_operations:
      - "POST /urology/providers"
      - "PATCH /urology/providers/{id}"
      - "POST /urology/procedure-rooms"
      - "PATCH /urology/procedure-rooms/{id}"
      - "POST /urology/procedure-types"
      - "POST /urology/consignment-lots"
      - "POST /urology/consignment-lots/{id}/return"
      - "POST /urology/_clock/set_current_utc"
    shared_operations:
      - "POST /urology/patients (with Scheduler)"
      - "PATCH /urology/patients/{id} (with Urologist)"
      - "POST /urology/scope-assets (with SterileProcessingTech)"
      - "POST /urology/procedure-cases/{id}/device-reservation (with ProcedureNurse)"
      - "POST /urology/recall-sweeps (with Urologist)"
      - "every GET"

  - name: Scheduler
    description: "Procedure suite scheduler: drafts cases, commits them to the room calendar, reschedules, cancels and marks no-shows."
    identity: "entity_backed:Provider"
    identity_binding: "X-User-ID is the id of a Provider whose role_type is SCHEDULER and whose credential_status is ACTIVE"
    exclusive_operations:
      - "POST /urology/procedure-cases/{id}/schedule"
      - "POST /urology/procedure-cases/{id}/reschedule"
      - "POST /urology/procedure-cases/{id}/no-show"
    shared_operations:
      - "POST /urology/patients (with PracticeAdmin)"
      - "POST /urology/procedure-cases (with Urologist)"
      - "POST /urology/procedure-cases/{id}/prep-acknowledgements (with ProcedureNurse)"
      - "POST /urology/procedure-cases/{id}/cancel (with Urologist)"
      - "every GET"

  - name: Urologist
    description: "Treating urologist: orders antibiotic prophylaxis, waives preparation, opens and closes surveillance recalls, refers into pelvic health, and completes procedures."
    identity: "entity_backed:Provider"
    identity_binding: "X-User-ID is the id of a Provider whose role_type is UROLOGIST and whose credential_status is ACTIVE"
    exclusive_operations:
      - "POST /urology/antibiotic-orders"
      - "POST /urology/procedure-cases/{id}/clearance-review with decision WAIVE"
      - "POST /urology/surveillance-recalls"
      - "POST /urology/surveillance-recalls/{id}/close"
    shared_operations:
      - "PATCH /urology/patients/{id} (with PracticeAdmin)"
      - "POST /urology/procedure-cases (with Scheduler)"
      - "POST /urology/procedure-cases/{id}/clearance-review with decision CLEAR or BLOCK (with ProcedureNurse)"
      - "POST /urology/procedure-cases/{id}/complete (with ProcedureNurse)"
      - "POST /urology/procedure-cases/{id}/cancel (with Scheduler)"
      - "POST /urology/specimens (with ProcedureNurse)"
      - "POST /urology/antibiotic-orders/{id}/administer (with ProcedureNurse)"
      - "POST /urology/pelvic-health-referrals (with PelvicHealthCoordinator)"
      - "POST /urology/recall-sweeps (with PracticeAdmin)"
      - "every GET"

  - name: ProcedureNurse
    description: "Procedure suite nurse: records preparation acknowledgements, reviews clearance, assigns scopes, reserves devices, checks patients in and administers prophylaxis."
    identity: "entity_backed:Provider"
    identity_binding: "X-User-ID is the id of a Provider whose role_type is RN and whose credential_status is ACTIVE"
    exclusive_operations:
      - "POST /urology/procedure-cases/{id}/scope-assignment"
      - "POST /urology/procedure-cases/{id}/check-in"
    shared_operations:
      - "POST /urology/procedure-cases/{id}/prep-acknowledgements (with Scheduler)"
      - "POST /urology/procedure-cases/{id}/clearance-review with decision CLEAR or BLOCK (with Urologist)"
      - "POST /urology/procedure-cases/{id}/device-reservation (with PracticeAdmin)"
      - "POST /urology/procedure-cases/{id}/complete (with Urologist)"
      - "POST /urology/antibiotic-orders/{id}/administer (with Urologist)"
      - "POST /urology/specimens (with Urologist)"
      - "POST /urology/specimens/{id}/notification-attempt (with PathologyLiaison)"
      - "every GET"

  - name: SterileProcessingTech
    description: "Sterile processing technician: opens and closes scope reprocessing stage logs and records factory commissioning attestations. Every close needs a second, different technician as attester."
    identity: "entity_backed:Provider"
    identity_binding: "X-User-ID is the id of a Provider whose role_type is TECH and whose credential_status is ACTIVE"
    exclusive_operations:
