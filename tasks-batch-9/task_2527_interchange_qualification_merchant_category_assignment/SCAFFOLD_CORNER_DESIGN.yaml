              as_user_id: "${acq_id}"
              captures: { batch_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "response data.status == OPEN"
            - "response data.record_count == 0"
            - "response data.total_assessed_cents == 0"
            - "response data.finalized_at == null"
            - "SettlementBatch.${batch_id}.version == 1"

