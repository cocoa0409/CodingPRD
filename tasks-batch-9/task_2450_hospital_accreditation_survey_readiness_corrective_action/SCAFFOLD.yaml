scenario: |
  Generate task harder than expert level!

  2450. Hospital Accreditation Survey Readiness & Corrective Action (Joint Commission accredited hospital):
  standard-to-owner mapping with evidence repositories per chapter, mock tracer program and unit-level
  readiness scoring, life safety and environment-of-care rounding with deficiency ticketing, survey window
  prediction and command center activation, finding classification by risk level and required response
  timeline, evidence of standards compliance submission and clarification requests, condition-level finding
  escalation with follow-up survey, ongoing periodic performance review self-assessment
domain_name: hospital-accreditation-survey-readiness
api_prefix: "/accreditation"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - optimistic_concurrency
    - scheduled_actions
  entity_topology: graph
  # Chapter -> Standard is hierarchical, but OwnerAssignment (Standard x opaque owner id),
  # TracerObservation (MockTracer x Standard) and SurveyFinding (SurveyWindow x Standard x HospitalUnit)
  # are junction rows that make the reference structure a graph rather than a tree.
  state_machine_shape: parallel
  # SurveyWindow carries two independent dimensions (window_state x command_center_state);
  # SurveyFinding, DeficiencyTicket, Standard and PprSelfAssessment are cyclic.
  relationship_patterns:
    - one_to_many          # Chapter -> Standard, RoundingSession -> DeficiencyTicket
    - many_to_many         # TracerObservation joins MockTracer x Standard; SurveyFinding joins SurveyWindow x Standard x HospitalUnit
    - cross_aggregate      # DeficiencyTicket (rounding aggregate) mutates HospitalUnit (readiness aggregate)
    - polymorphic: false
  role_model: segregation_of_duties
  # EvidenceValidator may not validate a Standard it owns; ESC submitter must be the PRIMARY owner;
  # UnitManager is scoped to its own HospitalUnit; ExternalSurveyor alone writes findings and ESC decisions.
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Chapter
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: "Accreditation chapter code (EC, LS, IC, MM, NPSG, EM, PC)"
        constraints: "2-4 uppercase letters; unique across Chapter"
      - name: name
        type: string
        source: input
        description: "Human-readable chapter name"
      - name: weight_pct
        type: number
        source: input
        description: "Weight of this chapter inside unit readiness scoring"
        constraints: "0 < weight_pct <= 100; 2 decimal places"
      - name: evidence_min_count
        type: integer
        source: input
        description: "VALIDATED EvidenceItem rows a Standard in this chapter needs to reach EVIDENCE_COMPLETE"
        default: 2
        constraints: ">= 1"
      - name: standard_count
        type: integer
        source: computed
        description: "Count of Standard rows whose chapter_id == this.id (all compliance_state values)"
        default: 0
      - name: mapped_standard_count
        type: integer
        source: computed
        description: "Count of Standard rows in this chapter with active_owner_count >= 1; conserved by invariant chapter_mapped_standard_ledger"
        default: 0
      - name: evidence_complete_standard_count
        type: integer
        source: computed
        description: "Count of Standard rows in this chapter with compliance_state == EVIDENCE_COMPLETE"
        default: 0
      - name: deficient_standard_count
        type: integer
        source: computed
        description: "Count of Standard rows in this chapter with compliance_state == DEFICIENT"
        default: 0
      - name: ppr_escalation_count
        type: integer
        source: computed
        description: "Number of PprSelfAssessment rows for this chapter created with flagged_overstatement == true"
        default: 0
      - name: readiness_flag
        type: enum
        source: computed
        description: "Chapter-level readiness posture derived from deficient_standard_count and ppr_escalation_count"
        default: ON_TRACK
        constraints: "ON_TRACK | AT_RISK"

  - name: Standard
    parent: Chapter
    common_fields: true
    fields:
      - name: chapter_id
        type: string
        source: input
        description: "FK -> Chapter.id; owning accreditation chapter (taken from the path, not the body)"
      - name: standard_code
        type: string
        source: input
        description: "Standard identifier such as EC.02.06.01"
        constraints: "unique within (chapter_id, standard_code)"
      - name: title
        type: string
        source: input
        description: "Standard text summary"
      - name: risk_tier
        type: enum
        source: input
        description: "Joint-Commission style scoring tier used by finding_risk_classification"
        constraints: "DIRECT_IMPACT | INDIRECT_IMPACT | SITUATIONAL_DECISION_RULE"
      - name: compliance_state
        type: enum
        source: computed
        description: "Derived readiness of this standard; see state_machines[entity=Standard]"
        default: UNMAPPED
        constraints: "UNMAPPED | MAPPED | EVIDENCE_COMPLETE | DEFICIENT"
      - name: active_owner_count
        type: integer
        source: computed
        description: "Count of OwnerAssignment rows for this standard with status == ACTIVE"
        default: 0
      - name: validated_evidence_count
        type: integer
        source: computed
        description: "Count of EvidenceItem rows for this standard with validation_state == VALIDATED"
        default: 0
      - name: last_noncompliant_observed_at
        type: datetime
        source: computed
        description: "Logical-clock instant of the most recent NON_COMPLIANT TracerObservation or condition-level escalation; null when never observed"
        default: null

  - name: OwnerAssignment
    parent: Standard
    common_fields: true
    fields:
      - name: standard_id
        type: string
        source: input
        description: "FK -> Standard.id; standard this accountability row maps (taken from the path)"
      - name: owner_user_id
        type: string
        source: input
        description: "Opaque X-User-ID of the StandardOwner accountable for the standard"
      - name: designation
        type: enum
        source: input
        description: "PRIMARY owner signs ESC submissions; SECONDARY owners may only maintain evidence"
        constraints: "PRIMARY | SECONDARY"
      - name: status
        type: enum
        source: computed
        description: "ACTIVE on create; REVOKED after POST /accreditation/owner-assignments/{id}/revoke"
        default: ACTIVE
        constraints: "ACTIVE | REVOKED"
      - name: revoked_at
        type: datetime
        source: computed
        description: "Logical-clock instant of revocation; null while status == ACTIVE"
        default: null

  - name: EvidenceItem
    parent: Standard
    common_fields: true
    fields:
      - name: standard_id
        type: string
        source: input
        description: "FK -> Standard.id; standard whose evidence repository holds this document (taken from the path)"
      - name: title
        type: string
        source: input
        description: "Document title"
      - name: doc_type
        type: enum
        source: input
        description: "Kind of compliance artifact"
        constraints: "POLICY | LOG | TRAINING_RECORD | INSPECTION_REPORT | CONTRACT"
      - name: effective_date
        type: datetime
        source: input
        description: "Instant the artifact became effective"
      - name: expires_at
        type: datetime
        source: input
        description: "Instant the artifact stops counting toward validated_evidence_count; null means never expires"
        default: null
      - name: validation_state
        type: enum
        source: computed
        description: "Evidence lifecycle; see state_machines[entity=EvidenceItem]"
        default: DRAFT
        constraints: "DRAFT | SUBMITTED | VALIDATED | REJECTED | EXPIRED"
      - name: submitted_by_user_id
        type: string
        source: computed
        description: "X-User-ID of the StandardOwner that ran action SUBMIT; null while DRAFT"
        default: null
      - name: reviewed_by_user_id
        type: string
        source: computed
        description: "X-User-ID of the EvidenceValidator that ran action VALIDATE or REJECT; null before first review"
        default: null
      - name: review_note
        type: string
        source: computed
        description: "Free-text note captured from the reviewing call; null before first review"
        default: null
      - name: rejection_count
        type: integer
        source: computed
        description: "Number of times this item has been REJECTED"
        default: 0

  - name: HospitalUnit
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Unit name, e.g. ICU-3"
        constraints: "unique across HospitalUnit"
      - name: unit_type
        type: enum
        source: input
        description: "Care setting of the unit"
        constraints: "MED_SURG | ICU | ED | OR | BEHAVIORAL_HEALTH | AMBULATORY"
      - name: bed_count
        type: integer
        source: input
        description: "Licensed bed count"
        constraints: ">= 0"
      - name: posture
        type: enum
        source: computed
        description: "Gate over child operations; see state_machines[entity=HospitalUnit]"
        default: OPEN
        constraints: "OPEN | RESTRICTED | LOCKED_FOR_SURVEY"
      - name: open_deficiency_penalty_points
        type: integer
        source: computed
        description: "Conserved ledger; invariant unit_penalty_ledger pins it to the severity-point sum of non-VERIFIED DeficiencyTicket rows of this unit"
        default: 0
      - name: readiness_score
        type: number
        source: computed
        description: "ATTESTED variant of unit_readiness_score, recomputed by every cascade that touches this unit"
        default: 0.00
      - name: readiness_band
        type: enum
        source: computed
        description: "Band derived from readiness_score by unit_readiness_score step 5"
        default: NOT_ASSESSED
        constraints: "NOT_ASSESSED | NOT_READY | AT_RISK | CONDITIONAL | READY"
      - name: scheduled_tracer_count
        type: integer
        source: computed
        description: "Count of MockTracer rows for this unit with state == SCHEDULED"
        default: 0

  - name: MockTracer
    parent: null
    common_fields: true
    fields:
      - name: unit_id
        type: string
        source: input
        description: "FK -> HospitalUnit.id; unit being traced"
      - name: chapter_id
        type: string
        source: input
        description: "FK -> Chapter.id; chapter whose standards this tracer samples"
      - name: tracer_type
        type: enum
        source: input
        description: "Tracer methodology"
        constraints: "PATIENT | SYSTEM | INDIVIDUAL"
      - name: window_start
        type: datetime
        source: input
        description: "Half-open occupation start on the unit"
      - name: window_end
        type: datetime
        source: input
        description: "Half-open occupation end on the unit; must be > window_start"
      - name: state
        type: enum
        source: computed
        description: "Tracer lifecycle; see state_machines[entity=MockTracer]"
        default: SCHEDULED
        constraints: "SCHEDULED | IN_PROGRESS | COMPLETED | ABORTED"
      - name: scored_weight
        type: number
        source: computed
        description: "Sum of TracerObservation.weight where result != NOT_APPLICABLE, frozen at COMPLETE"
        default: 0
      - name: earned_weight
        type: number
        source: computed
        description: "Sum of weight * result_credit over the same observations, frozen at COMPLETE"
        default: 0
      - name: tracer_score
        type: number
        source: computed
        description: "mock_tracer_score output; 0.00 when scored_weight == 0"
        default: 0.00
      - name: contributes_to_readiness
        type: boolean
        source: computed
        description: "True only when state == COMPLETED and scored_weight > 0; gates chapter participation in unit_readiness_score"
        default: false
      - name: started_at
        type: datetime
        source: computed
        description: "Logical-clock instant of action START; null while SCHEDULED"
        default: null
      - name: completed_at
        type: datetime
        source: computed
        description: "Logical-clock instant of action COMPLETE; null otherwise"
        default: null
      - name: abort_reason
        type: string
        source: computed
        description: "Reason string set by action ABORT or by a posture cascade; null otherwise"
        default: null

  - name: TracerObservation
    parent: MockTracer
    common_fields: false
    fields:
      - name: mock_tracer_id
        type: string
        source: input
        description: "FK -> MockTracer.id; tracer this observation belongs to (taken from the path)"
      - name: standard_id
        type: string
        source: input
        description: "FK -> Standard.id; standard observed"
      - name: result
        type: enum
        source: input
        description: "Observation outcome; NOT_APPLICABLE rows never enter scored_weight"
        constraints: "COMPLIANT | PARTIAL | NON_COMPLIANT | NOT_APPLICABLE"
      - name: weight
        type: number
        source: input
        description: "Sampling weight of this observation"
        default: 1
        constraints: "> 0"
      - name: note
        type: string
        source: input
        description: "Optional surveyor note"
        default: null
      - name: recorded_by_user_id
        type: string
        source: computed
        description: "X-User-ID of the TracerSurveyor that recorded the observation"

  - name: RoundingSession
    parent: null
    common_fields: true
    fields:
      - name: unit_id
        type: string
        source: input
        description: "FK -> HospitalUnit.id; unit being rounded"
      - name: round_type
        type: enum
        source: input
        description: "Rounding program; LIFE_SAFETY escalations raise severity to IMMEDIATE_THREAT"
        constraints: "LIFE_SAFETY | ENVIRONMENT_OF_CARE"
      - name: window_start
        type: datetime
        source: input
        description: "Closed-interval occupation start on the unit"
      - name: window_end
        type: datetime
        source: input
        description: "Closed-interval occupation end on the unit; must be > window_start"
      - name: state
        type: enum
        source: computed
        description: "OPEN on create, CLOSED after POST .../close"
        default: OPEN
        constraints: "OPEN | CLOSED"
      - name: deficiency_count
        type: integer
        source: computed
        description: "Count of DeficiencyTicket rows created under this session"
        default: 0
      - name: closed_at
        type: datetime
        source: computed
        description: "Logical-clock instant of close; null while OPEN"
        default: null

  - name: DeficiencyTicket
    parent: RoundingSession
    common_fields: true
    fields:
      - name: rounding_session_id
        type: string
        source: input
        description: "FK -> RoundingSession.id; session that raised the ticket (taken from the path); the ticket's unit is RoundingSession.unit_id"
      - name: standard_id
        type: string
        source: input
        description: "FK -> Standard.id; standard the deficiency maps to"
      - name: description
        type: string
        source: input
        description: "Observed deficiency text"
      - name: severity
        type: enum
        source: input
        description: "Severity at creation; action ESCALATE on a LIFE_SAFETY session raises it to IMMEDIATE_THREAT"
        constraints: "LOW | MODERATE | HIGH | IMMEDIATE_THREAT"
      - name: state
        type: enum
        source: computed
        description: "Ticket lifecycle; see state_machines[entity=DeficiencyTicket]"
        default: OPEN
        constraints: "OPEN | IN_PROGRESS | REMEDIATED | VERIFIED | ESCALATED"
      - name: penalty_points
        type: integer
        source: computed
        description: "SEVERITY_POINTS[severity]; recomputed when ESCALATE raises severity"
      - name: due_at
        type: datetime
        source: computed
        description: "deficiency_due_at output, fixed at creation from the pre-insert readiness band"
      - name: accelerated
        type: boolean
        source: computed
        description: "True when deficiency_due_at halved base_days because the pre-insert band was AT_RISK or NOT_READY"
        default: false
      - name: verified_by_user_id
        type: string
        source: computed
        description: "X-User-ID of the actor that ran action VERIFY; null otherwise"
        default: null
      - name: failed_verification_count
        type: integer
        source: computed
        description: "Number of FAIL_VERIFICATION transitions this ticket has taken"
        default: 0

  - name: SurveyWindow
    parent: null
    common_fields: true
    fields:
      - name: cycle_label
        type: string
        source: input
        description: "Label of the accreditation cycle, e.g. CYCLE-2026"
        constraints: "unique across SurveyWindow"
      - name: prior_survey_end_date
        type: datetime
        source: input
        description: "Last day of the previous full survey; anchor of survey_window_prediction"
      - name: predicted_open_date
        type: datetime
        source: computed
        description: "prior_survey_end_date + MIN_INTERVAL_MONTHS with end-of-month clamping"
      - name: predicted_close_date
        type: datetime
        source: computed
        description: "prior_survey_end_date + MAX_INTERVAL_MONTHS with end-of-month clamping"
      - name: command_center_activation_allowed_from
        type: datetime
        source: computed
        description: "predicted_open_date - COMMAND_CENTER_LEAD_DAYS days"
      - name: window_state
        type: enum
        source: computed
        description: "Survey dimension; evolves independently of command_center_state"
        default: PROJECTED
        constraints: "PROJECTED | ELIGIBLE | ACTIVE_SURVEY | CLOSED"
      - name: command_center_state
        type: enum
        source: computed
        description: "Command-center dimension; evolves independently of window_state"
        default: STANDBY
        constraints: "STANDBY | ACTIVATED | DEMOBILIZED"
      - name: survey_opened_at
        type: datetime
        source: computed
        description: "Logical-clock instant of the most recent OPEN_SURVEY; null before the first one"
        default: null
      - name: survey_closed_at
        type: datetime
        source: computed
        description: "Logical-clock instant of the most recent CLOSE_SURVEY; anchor of esc_response_due_at variant initial"
        default: null
      - name: condition_level_finding_count
        type: integer
        source: computed
        description: "Count of SurveyFinding rows of this window with condition_level == true"
        default: 0
      - name: follow_up_required
        type: boolean
        source: computed
        description: "Set true by CLOSE_SURVEY when condition_level_finding_count >= 1"
        default: false
      - name: follow_up_due_at
        type: datetime
        source: computed
        description: "survey_closed_at + FOLLOW_UP_LEAD_DAYS days when follow_up_required; null otherwise"
        default: null

  - name: SurveyFinding
    parent: SurveyWindow
    common_fields: true
    fields:
      - name: survey_window_id
        type: string
        source: input
        description: "FK -> SurveyWindow.id; survey that produced the finding (taken from the path)"
      - name: standard_id
        type: string
        source: input
        description: "FK -> Standard.id; standard found non-compliant"
      - name: unit_id
        type: string
        source: input
        description: "FK -> HospitalUnit.id; unit where the non-compliance was observed"
      - name: observed_noncompliance_count
        type: integer
        source: input
        description: "Non-compliant elements observed"
        constraints: ">= 1 and <= sampled_count"
      - name: sampled_count
        type: integer
        source: input
        description: "Elements sampled"
        constraints: ">= 1"
      - name: patient_harm_observed
        type: boolean
        source: input
        description: "Whether actual patient harm was observed; adds HARM_BONUS to the risk index"
        default: false
      - name: noncompliance_rate
        type: number
        source: computed
        description: "round(observed_noncompliance_count / sampled_count, 4)"
      - name: classification
        type: enum
        source: computed
        description: "finding_risk_classification step 2 output"
        constraints: "LIMITED | PATTERN | WIDESPREAD"
      - name: risk_level
        type: enum
        source: computed
        description: "finding_risk_classification step 4 output"
        constraints: "LOW | MODERATE | HIGH | IMMEDIATE_THREAT"
      - name: condition_level
        type: boolean
        source: computed
        description: "True when risk_level == IMMEDIATE_THREAT or (classification == WIDESPREAD and standard.risk_tier == DIRECT_IMPACT)"
        default: false
      - name: response_deadline_days
        type: integer
        source: computed
        description: "45 when risk_level in {HIGH, IMMEDIATE_THREAT}, else 60"
      - name: initial_response_due_at
        type: datetime
        source: computed
        description: "esc_response_due_at variant initial, frozen at CLOSE_SURVEY; null while DRAFT"
        default: null
      - name: response_due_at
        type: datetime
        source: computed
        description: "Effective ESC deadline; equals initial_response_due_at until a clarification recomputes it via variant clarification"
        default: null
      - name: state
        type: enum
        source: computed
        description: "Finding lifecycle; see state_machines[entity=SurveyFinding]"
        default: DRAFT
        constraints: "DRAFT | RESPONSE_PENDING | RESPONSE_SUBMITTED | CLARIFICATION_REQUESTED | CONDITION_LEVEL_ESCALATED | FOLLOW_UP_PENDING | ACCEPTED"
      - name: clarification_round_count
        type: integer
        source: computed
        description: "Number of CLARIFICATION_REQUESTED decisions issued on this finding; capped by MAX_CLARIFICATION_ROUNDS"
        default: 0
      - name: submission_count
        type: integer
        source: computed
        description: "Number of EscSubmission rows created for this finding"
        default: 0
      - name: accepted_at
        type: datetime
        source: computed
        description: "Logical-clock instant the finding reached ACCEPTED; null otherwise"
        default: null

  - name: EscSubmission
    parent: SurveyFinding
    common_fields: false
    fields:
      - name: survey_finding_id
        type: string
        source: input
        description: "FK -> SurveyFinding.id; finding this evidence-of-standards-compliance answers (taken from the path)"
      - name: corrective_action_summary
        type: string
        source: input
        description: "Corrective action narrative"
      - name: measure_of_success
        type: string
        source: input
        description: "Measure of success statement"
      - name: leadership_signoff
        type: boolean
        source: input
        description: "Whether hospital leadership signed the submission; must be true"
        constraints: "must equal true"
      - name: submission_round
        type: integer
        source: computed
        description: "1 for the first submission, incremented per resubmission after a clarification"
      - name: submitted_by_user_id
        type: string
        source: computed
        description: "X-User-ID of the PRIMARY StandardOwner that submitted"
      - name: decision
        type: enum
        source: computed
        description: "Accrediting-body decision recorded by POST .../esc-review on the newest round"
        default: PENDING
        constraints: "PENDING | CLARIFICATION_REQUESTED | ACCEPTED | REJECTED"
      - name: decision_note
        type: string
        source: computed
        description: "Note captured from the reviewing call; null while PENDING"
        default: null

  - name: PprSelfAssessment
    parent: Chapter
    common_fields: true
    fields:
      - name: chapter_id
        type: string
        source: input
        description: "FK -> Chapter.id; chapter under periodic performance review (taken from the path)"
      - name: period_label
        type: string
        source: input
        description: "PPR period label, e.g. 2026-H2"
        constraints: "unique within (chapter_id, period_label)"
      - name: self_ratings
        type: array
        source: input
        description: "Array of { standard_id, rating } objects; rating in {COMPLIANT, PARTIAL, NON_COMPLIANT}; every standard_id must belong to chapter_id"
      - name: self_score
        type: number
        source: computed
        description: "ppr_chapter_assessment variant self_reported"
      - name: verified_score
        type: number
        source: computed
        description: "ppr_chapter_assessment variant evidence_verified"
      - name: gap
        type: number
        source: computed
        description: "round(self_score - verified_score, 2)"
      - name: flagged_overstatement
        type: boolean
        source: computed
        description: "True when gap >= OVERSTATEMENT_THRESHOLD"
        default: false
      - name: requires_reassessment
        type: boolean
        source: computed
        description: "Set true by the chapter-readiness cascade when the chapter flips to AT_RISK"
        default: false
      - name: state
        type: enum
        source: computed
        description: "PPR lifecycle; see state_machines[entity=PprSelfAssessment]"
        default: SUBMITTED
        constraints: "SUBMITTED | RETURNED_FOR_REASSESSMENT | ATTESTED"
      - name: attested_by_user_id
        type: string
        source: computed
        description: "X-User-ID of the AccreditationDirector that attested; null otherwise"
        default: null

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: Standard
    initial_state: UNMAPPED
    terminal_states: []
    shape: cyclic
    transitions:
      - from: UNMAPPED
        to: MAPPED
        trigger: "POST /accreditation/standards/{id}/owner-assignments"
        actor: AccreditationDirector
        preconditions: ["no OwnerAssignment with status == ACTIVE and the same owner_user_id exists for this standard"]
        side_effects:
          - "active_owner_count += 1"
          - "Chapter.mapped_standard_count += 1 (only on the 0 -> 1 transition of active_owner_count)"
          - "increments Standard.version by 1"
      - from: MAPPED
        to: UNMAPPED
        trigger: "POST /accreditation/owner-assignments/{id}/revoke"
        actor: AccreditationDirector
        preconditions: ["OwnerAssignment.status == ACTIVE", "active_owner_count == 1 (last active owner)"]
        side_effects:
          - "active_owner_count -= 1"
          - "Chapter.mapped_standard_count -= 1 (only on the 1 -> 0 transition of active_owner_count)"
        note: "Cycle back to UNMAPPED; compensating half of invariant chapter_mapped_standard_ledger."
      - from: EVIDENCE_COMPLETE
        to: UNMAPPED
        trigger: "POST /accreditation/owner-assignments/{id}/revoke"
        actor: AccreditationDirector
        preconditions: ["OwnerAssignment.status == ACTIVE", "active_owner_count == 1"]
        side_effects:
          - "active_owner_count -= 1"
          - "Chapter.mapped_standard_count -= 1"
          - "Chapter.evidence_complete_standard_count -= 1"
        note: "Revoking the last owner drops the standard out of the evidence-complete population without touching validated_evidence_count."
      - from: MAPPED
        to: EVIDENCE_COMPLETE
        trigger: "POST /accreditation/evidence-items/{id}/transition action=VALIDATE"
        actor: EvidenceValidator
        preconditions: ["EvidenceItem.validation_state == SUBMITTED", "validated_evidence_count + 1 >= Chapter.evidence_min_count"]
        side_effects:
          - "validated_evidence_count += 1"
          - "Chapter.evidence_complete_standard_count += 1"
      - from: EVIDENCE_COMPLETE
        to: MAPPED
        trigger: "POST /_clock/set_current_utc (system expiry sweep) or POST /accreditation/evidence-items/{id}/transition action=REJECT"
        actor: system
        preconditions: ["validated_evidence_count - 1 < Chapter.evidence_min_count"]
        side_effects:
          - "validated_evidence_count -= 1"
          - "Chapter.evidence_complete_standard_count -= 1"
        note: "Cycle EVIDENCE_COMPLETE -> MAPPED -> EVIDENCE_COMPLETE is legal and unbounded."
      - from: MAPPED
        to: DEFICIENT
        trigger: "POST /accreditation/mock-tracers/{id}/transition action=COMPLETE (per NON_COMPLIANT observation) or POST /accreditation/survey-findings/{id}/escalate"
        actor: system
        preconditions: ["at least one TracerObservation of the completing tracer has result == NON_COMPLIANT and standard_id == this.id"]
        side_effects:
          - "last_noncompliant_observed_at = current logical clock"
          - "Chapter.deficient_standard_count += 1"
          - "when Chapter.deficient_standard_count >= CHAPTER_AT_RISK_DEFICIENT_COUNT the chapter flips readiness_flag ON_TRACK -> AT_RISK, which in turn moves every PprSelfAssessment of that chapter in state SUBMITTED to RETURNED_FOR_REASSESSMENT with requires_reassessment = true"
      - from: EVIDENCE_COMPLETE
        to: DEFICIENT
        trigger: "POST /accreditation/mock-tracers/{id}/transition action=COMPLETE (per NON_COMPLIANT observation) or POST /accreditation/survey-findings/{id}/escalate"
        actor: system
        preconditions: ["at least one TracerObservation of the completing tracer has result == NON_COMPLIANT and standard_id == this.id"]
        side_effects:
          - "last_noncompliant_observed_at = current logical clock"
          - "Chapter.evidence_complete_standard_count -= 1"
          - "Chapter.deficient_standard_count += 1"
          - "same chapter AT_RISK / PPR return cascade as above"
      - from: DEFICIENT
        to: EVIDENCE_COMPLETE
        trigger: "POST /accreditation/deficiency-tickets/{id}/transition action=VERIFY"
        actor: SafetyOfficer
        preconditions: ["ticket.standard_id == this.id", "no other DeficiencyTicket for this standard in state {OPEN, IN_PROGRESS, REMEDIATED, ESCALATED}", "validated_evidence_count >= Chapter.evidence_min_count"]
        side_effects:
          - "Chapter.deficient_standard_count -= 1"
          - "Chapter.evidence_complete_standard_count += 1"
          - "Chapter.readiness_flag reverts to ON_TRACK when deficient_standard_count < CHAPTER_AT_RISK_DEFICIENT_COUNT and ppr_escalation_count < CHAPTER_AT_RISK_PPR_COUNT"
      - from: DEFICIENT
        to: MAPPED
        trigger: "POST /accreditation/deficiency-tickets/{id}/transition action=VERIFY"
        actor: SafetyOfficer
        preconditions: ["ticket.standard_id == this.id", "no other DeficiencyTicket for this standard in state {OPEN, IN_PROGRESS, REMEDIATED, ESCALATED}", "validated_evidence_count < Chapter.evidence_min_count"]
        side_effects:
          - "Chapter.deficient_standard_count -= 1"
          - "Chapter.readiness_flag reverts to ON_TRACK when deficient_standard_count < CHAPTER_AT_RISK_DEFICIENT_COUNT and ppr_escalation_count < CHAPTER_AT_RISK_PPR_COUNT"

  - entity: EvidenceItem
    initial_state: DRAFT
    terminal_states: [EXPIRED]
    shape: branching_with_revert
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /accreditation/evidence-items/{id}/transition action=SUBMIT"
        actor: StandardOwner
        preconditions: ["Standard.compliance_state != UNMAPPED", "X-User-ID owns an OwnerAssignment with status == ACTIVE on Standard"]
        side_effects: ["submitted_by_user_id = X-User-ID", "increments EvidenceItem.version by 1"]
      - from: SUBMITTED
        to: VALIDATED
        trigger: "POST /accreditation/evidence-items/{id}/transition action=VALIDATE"
        actor: EvidenceValidator
        preconditions: ["X-User-ID is NOT an owner_user_id of any OwnerAssignment with status == ACTIVE on Standard", "expires_at is null or expires_at > current logical clock"]
        side_effects:
          - "reviewed_by_user_id = X-User-ID, review_note = payload.review_note"
          - "Standard.validated_evidence_count += 1, which may move Standard MAPPED -> EVIDENCE_COMPLETE and increment Chapter.evidence_complete_standard_count"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /accreditation/evidence-items/{id}/transition action=REJECT"
        actor: EvidenceValidator
        preconditions: ["X-User-ID is NOT an owner_user_id of any OwnerAssignment with status == ACTIVE on Standard"]
        side_effects: ["rejection_count += 1", "reviewed_by_user_id = X-User-ID"]
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /accreditation/evidence-items/{id}/transition action=SUBMIT"
        actor: StandardOwner
        preconditions: ["Standard.compliance_state != UNMAPPED", "X-User-ID owns an ACTIVE OwnerAssignment on Standard"]
        side_effects: ["submitted_by_user_id = X-User-ID"]
        note: "Rejection loop; unbounded resubmission."
      - from: VALIDATED
        to: REJECTED
        trigger: "POST /accreditation/evidence-items/{id}/transition action=REJECT"
        actor: EvidenceValidator
        preconditions: ["X-User-ID is NOT an ACTIVE owner of Standard"]
        side_effects:
          - "rejection_count += 1"
          - "Standard.validated_evidence_count -= 1, which may move Standard EVIDENCE_COMPLETE -> MAPPED and decrement Chapter.evidence_complete_standard_count"
      - from: VALIDATED
        to: EXPIRED
        trigger: "POST /_clock/set_current_utc (expiry sweep)"
        actor: system
        preconditions: ["expires_at is not null", "expires_at <= new logical clock"]
        side_effects:
          - "Standard.validated_evidence_count -= 1"
          - "that decrement may move Standard EVIDENCE_COMPLETE -> MAPPED, which itself decrements Chapter.evidence_complete_standard_count"
        note: "Boundary is inclusive: expires_at == clock expires."

  - entity: HospitalUnit
    initial_state: OPEN
    terminal_states: []
    shape: posture_driven
    transitions:
      - from: OPEN
        to: RESTRICTED
        trigger: "system, on any change of open_deficiency_penalty_points (ticket create / ESCALATE / FAIL_VERIFICATION)"
        actor: system
        preconditions: ["open_deficiency_penalty_points >= POSTURE_RESTRICT_POINTS"]
        side_effects:
          - "every MockTracer of this unit in state SCHEDULED moves to ABORTED with abort_reason = 'UNIT_POSTURE_RESTRICTED'"
          - "that abort cascade sets scheduled_tracer_count = 0 and recomputes readiness_score / readiness_band"
      - from: RESTRICTED
        to: OPEN
        trigger: "system, on POST /accreditation/deficiency-tickets/{id}/transition action=VERIFY"
        actor: system
        preconditions: ["open_deficiency_penalty_points < POSTURE_RESTRICT_POINTS"]
        side_effects: ["recomputes readiness_score / readiness_band"]
        note: "Compensating half of invariant unit_penalty_ledger; cycle OPEN -> RESTRICTED -> OPEN is unbounded."
      - from: OPEN
        to: LOCKED_FOR_SURVEY
        trigger: "POST /accreditation/survey-windows/{id}/transition action=OPEN_SURVEY"
        actor: AccreditationDirector
        preconditions: ["SurveyWindow.window_state == ELIGIBLE or CLOSED-with-follow_up_required", "SurveyWindow.command_center_state == ACTIVATED"]
        side_effects:
          - "every MockTracer of this unit in state SCHEDULED moves to ABORTED with abort_reason = 'SURVEY_ACTIVE'"
          - "that abort cascade sets scheduled_tracer_count = 0 and recomputes readiness_score / readiness_band"
      - from: RESTRICTED
        to: LOCKED_FOR_SURVEY
        trigger: "POST /accreditation/survey-windows/{id}/transition action=OPEN_SURVEY"
        actor: AccreditationDirector
        preconditions: ["same as OPEN -> LOCKED_FOR_SURVEY"]
        side_effects: ["same abort cascade"]
      - from: LOCKED_FOR_SURVEY
        to: OPEN
        trigger: "POST /accreditation/survey-windows/{id}/transition action=CLOSE_SURVEY"
        actor: AccreditationDirector
        preconditions: ["open_deficiency_penalty_points < POSTURE_RESTRICT_POINTS"]
        side_effects: ["recomputes readiness_score / readiness_band"]
      - from: LOCKED_FOR_SURVEY
        to: RESTRICTED
        trigger: "POST /accreditation/survey-windows/{id}/transition action=CLOSE_SURVEY"
        actor: AccreditationDirector
        preconditions: ["open_deficiency_penalty_points >= POSTURE_RESTRICT_POINTS"]
        side_effects: ["recomputes readiness_score / readiness_band"]

  - entity: MockTracer
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, ABORTED]
    shape: branching
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /accreditation/mock-tracers/{id}/transition action=START"
        actor: TracerSurveyor
        preconditions: ["HospitalUnit.posture == OPEN", "current logical clock >= window_start"]
        side_effects: ["started_at = current logical clock", "HospitalUnit.scheduled_tracer_count -= 1", "increments MockTracer.version by 1"]
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /accreditation/mock-tracers/{id}/transition action=COMPLETE"
        actor: TracerSurveyor
        preconditions: ["at least one TracerObservation exists for this tracer"]
        side_effects:
          - "freezes scored_weight / earned_weight and computes tracer_score via mock_tracer_score"
          - "contributes_to_readiness = (scored_weight > 0)"
          - "each Standard with a NON_COMPLIANT observation on this tracer moves to DEFICIENT (Standard machine)"
          - "each such Standard transition increments Chapter.deficient_standard_count, and at CHAPTER_AT_RISK_DEFICIENT_COUNT the Chapter flips readiness_flag to AT_RISK"
          - "the Chapter flip returns every SUBMITTED PprSelfAssessment of that chapter to RETURNED_FOR_REASSESSMENT"
          - "recomputes HospitalUnit.readiness_score / readiness_band via unit_readiness_score variant attested"
      - from: SCHEDULED
        to: ABORTED
        trigger: "POST /accreditation/mock-tracers/{id}/transition action=ABORT, or system posture cascade"
        actor: TracerSurveyor | system
        preconditions: []
        side_effects: ["abort_reason set", "HospitalUnit.scheduled_tracer_count -= 1", "recomputes HospitalUnit.readiness_score / readiness_band"]
      - from: IN_PROGRESS
        to: ABORTED
        trigger: "POST /accreditation/mock-tracers/{id}/transition action=ABORT"
        actor: TracerSurveyor
        preconditions: []
        side_effects: ["abort_reason set", "contributes_to_readiness stays false", "recomputes HospitalUnit.readiness_score / readiness_band"]

  - entity: RoundingSession
    initial_state: OPEN
    terminal_states: [CLOSED]
    shape: linear
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /accreditation/rounding-sessions/{id}/close"
        actor: SafetyOfficer
        preconditions: ["no DeficiencyTicket of this session is in state ESCALATED"]
        side_effects: ["closed_at = current logical clock", "increments RoundingSession.version by 1"]

  - entity: DeficiencyTicket
    initial_state: OPEN
    terminal_states: [VERIFIED]
    shape: cyclic
    transitions:
      - from: OPEN
        to: IN_PROGRESS
        trigger: "POST /accreditation/deficiency-tickets/{id}/transition action=START_WORK"
        actor: SafetyOfficer | UnitManager
        preconditions: []
        side_effects: ["increments DeficiencyTicket.version by 1"]
      - from: IN_PROGRESS
        to: REMEDIATED
        trigger: "POST /accreditation/deficiency-tickets/{id}/transition action=MARK_REMEDIATED"
        actor: SafetyOfficer | UnitManager
        preconditions: []
        side_effects: []
      - from: ESCALATED
        to: REMEDIATED
        trigger: "POST /accreditation/deficiency-tickets/{id}/transition action=MARK_REMEDIATED"
        actor: SafetyOfficer | UnitManager
        preconditions: []
        side_effects: []
      - from: REMEDIATED
        to: VERIFIED
        trigger: "POST /accreditation/deficiency-tickets/{id}/transition action=VERIFY"
        actor: SafetyOfficer
        preconditions: ["RoundingSession.state == CLOSED", "actor is SafetyOfficer (UnitManager may not verify its own unit's remediation)"]
        side_effects:
          - "verified_by_user_id = X-User-ID"
          - "HospitalUnit.open_deficiency_penalty_points -= penalty_points (compensating half of invariant unit_penalty_ledger)"
          - "that decrement may move HospitalUnit RESTRICTED -> OPEN, which recomputes readiness_score / readiness_band"
          - "when no other non-VERIFIED ticket references the standard, Standard leaves DEFICIENT (to EVIDENCE_COMPLETE or MAPPED) and Chapter.deficient_standard_count decrements"
      - from: REMEDIATED
        to: OPEN
        trigger: "POST /accreditation/deficiency-tickets/{id}/transition action=FAIL_VERIFICATION"
        actor: SafetyOfficer
        preconditions: ["RoundingSession.state == CLOSED"]
        side_effects: ["failed_verification_count += 1", "HospitalUnit.open_deficiency_penalty_points unchanged (the ticket never left the non-VERIFIED population)"]
        note: "Revision cycle REMEDIATED -> OPEN -> IN_PROGRESS -> REMEDIATED is unbounded."
      - from: OPEN
        to: ESCALATED
        trigger: "POST /accreditation/deficiency-tickets/{id}/transition action=ESCALATE"
        actor: SafetyOfficer
        preconditions: []
        side_effects:
          - "when RoundingSession.round_type == LIFE_SAFETY the severity is raised to IMMEDIATE_THREAT and penalty_points recomputed to SEVERITY_POINTS[IMMEDIATE_THREAT]"
          - "HospitalUnit.open_deficiency_penalty_points recomputed with the new penalty_points"
          - "that recompute may move HospitalUnit OPEN -> RESTRICTED (>= POSTURE_RESTRICT_POINTS), which itself aborts every SCHEDULED MockTracer of the unit, which itself zeroes scheduled_tracer_count and recomputes readiness_score / readiness_band"
      - from: IN_PROGRESS
        to: ESCALATED
        trigger: "POST /accreditation/deficiency-tickets/{id}/transition action=ESCALATE"
        actor: SafetyOfficer
        preconditions: []
        side_effects: ["same escalation cascade as OPEN -> ESCALATED"]

  - entity: SurveyWindow
    initial_state: "window_state=PROJECTED x command_center_state=STANDBY"
    terminal_states: []
    shape: parallel
    transitions:
      - from: "window_state=PROJECTED"
        to: "window_state=ELIGIBLE"
        trigger: "POST /_clock/set_current_utc"
        actor: system
        preconditions: ["new logical clock >= predicted_open_date", "new logical clock <= predicted_close_date"]
        side_effects: ["no change to command_center_state"]
        note: "Dimension 1 advances on the clock alone."
      - from: "command_center_state=STANDBY"
        to: "command_center_state=ACTIVATED"
        trigger: "POST /accreditation/survey-windows/{id}/transition action=ACTIVATE_COMMAND_CENTER"
        actor: AccreditationDirector
        preconditions: ["current logical clock >= command_center_activation_allowed_from"]
        side_effects: ["no change to window_state (may still be PROJECTED)", "increments SurveyWindow.version by 1"]
        note: "Dimension 2 advances independently of window_state."
      - from: "command_center_state=ACTIVATED"
        to: "command_center_state=DEMOBILIZED"
        trigger: "POST /accreditation/survey-windows/{id}/transition action=DEMOBILIZE_COMMAND_CENTER, or CLOSE_SURVEY when follow_up_required == false"
        actor: AccreditationDirector | system
        preconditions: ["window_state != ACTIVE_SURVEY"]
        side_effects: []
      - from: "command_center_state=DEMOBILIZED"
        to: "command_center_state=ACTIVATED"
        trigger: "POST /accreditation/survey-windows/{id}/transition action=ACTIVATE_COMMAND_CENTER"
        actor: AccreditationDirector
        preconditions: ["current logical clock >= command_center_activation_allowed_from"]
        side_effects: []
        note: "Command-center dimension is cyclic for follow-up surveys."
      - from: "window_state=ELIGIBLE"
        to: "window_state=ACTIVE_SURVEY"
        trigger: "POST /accreditation/survey-windows/{id}/transition action=OPEN_SURVEY"
        actor: AccreditationDirector
        preconditions:
          - "command_center_state == ACTIVATED"
          - "no DeficiencyTicket in state ESCALATED with severity == IMMEDIATE_THREAT exists hospital-wide"
        side_effects:
          - "survey_opened_at = current logical clock"
          - "every HospitalUnit moves to LOCKED_FOR_SURVEY, which itself aborts every SCHEDULED MockTracer, which itself zeroes scheduled_tracer_count and recomputes that unit's readiness_score / readiness_band"
      - from: "window_state=ACTIVE_SURVEY"
        to: "window_state=CLOSED"
        trigger: "POST /accreditation/survey-windows/{id}/transition action=CLOSE_SURVEY"
        actor: AccreditationDirector
        preconditions: []
        side_effects:
          - "survey_closed_at = current logical clock"
          - "every SurveyFinding of this window in state DRAFT moves to RESPONSE_PENDING with initial_response_due_at = response_due_at = esc_response_due_at variant initial"
          - "follow_up_required = (condition_level_finding_count >= 1); when true follow_up_due_at = survey_closed_at + FOLLOW_UP_LEAD_DAYS days and command_center_state stays ACTIVATED, when false command_center_state moves ACTIVATED -> DEMOBILIZED"
          - "every HospitalUnit leaves LOCKED_FOR_SURVEY (to OPEN or RESTRICTED per its penalty points) and recomputes readiness"
          - "every SurveyFinding of this window in state FOLLOW_UP_PENDING moves to ACCEPTED with accepted_at = survey_closed_at"
      - from: "window_state=CLOSED"
        to: "window_state=ACTIVE_SURVEY"
        trigger: "POST /accreditation/survey-windows/{id}/transition action=OPEN_SURVEY (follow-up survey)"
        actor: AccreditationDirector
        preconditions:
          - "follow_up_required == true"
          - "command_center_state == ACTIVATED"
          - "current logical clock <= follow_up_due_at"
          - "no DeficiencyTicket in state ESCALATED with severity == IMMEDIATE_THREAT exists hospital-wide"
        side_effects: ["survey_opened_at = current logical clock", "same unit LOCKED_FOR_SURVEY cascade as the initial open"]
        note: "window_state is cyclic across the follow-up survey."

  - entity: SurveyFinding
    initial_state: DRAFT
    terminal_states: [ACCEPTED]
    shape: cyclic
    transitions:
      - from: DRAFT
        to: RESPONSE_PENDING
        trigger: "POST /accreditation/survey-windows/{id}/transition action=CLOSE_SURVEY"
        actor: system
        preconditions: ["SurveyWindow.window_state == ACTIVE_SURVEY"]
        side_effects: ["initial_response_due_at and response_due_at set from esc_response_due_at variant initial"]
      - from: RESPONSE_PENDING
        to: CONDITION_LEVEL_ESCALATED
        trigger: "POST /accreditation/survey-findings/{id}/escalate"
        actor: ExternalSurveyor
        preconditions: ["condition_level == true"]
        side_effects:
          - "Standard moves to DEFICIENT and last_noncompliant_observed_at = current logical clock"
          - "SurveyWindow.follow_up_required = true and follow_up_due_at = survey_closed_at + FOLLOW_UP_LEAD_DAYS days"
      - from: RESPONSE_PENDING
        to: RESPONSE_SUBMITTED
        trigger: "POST /accreditation/survey-findings/{id}/esc-submissions"
        actor: StandardOwner
        preconditions:
          - "condition_level == false"
          - "current logical clock <= response_due_at"
          - "X-User-ID owns an ACTIVE OwnerAssignment with designation == PRIMARY on Standard"
        side_effects: ["submission_count += 1", "EscSubmission created with submission_round = submission_count", "increments SurveyFinding.version by 1"]
      - from: CONDITION_LEVEL_ESCALATED
        to: RESPONSE_SUBMITTED
        trigger: "POST /accreditation/survey-findings/{id}/esc-submissions"
        actor: StandardOwner
        preconditions: ["current logical clock <= response_due_at", "X-User-ID owns an ACTIVE PRIMARY OwnerAssignment on Standard"]
        side_effects: ["submission_count += 1", "EscSubmission created", "increments SurveyFinding.version by 1"]
      - from: RESPONSE_SUBMITTED
        to: CLARIFICATION_REQUESTED
        trigger: "POST /accreditation/survey-findings/{id}/esc-review decision=CLARIFICATION_REQUESTED"
        actor: ExternalSurveyor
        preconditions: ["clarification_round_count < MAX_CLARIFICATION_ROUNDS"]
        side_effects:
          - "clarification_round_count += 1"
          - "newest EscSubmission.decision = CLARIFICATION_REQUESTED"
          - "response_due_at recomputed by esc_response_due_at variant clarification"
      - from: CLARIFICATION_REQUESTED
        to: RESPONSE_SUBMITTED
        trigger: "POST /accreditation/survey-findings/{id}/esc-submissions"
        actor: StandardOwner
        preconditions: ["current logical clock <= response_due_at", "X-User-ID owns an ACTIVE PRIMARY OwnerAssignment on Standard"]
        side_effects: ["submission_count += 1", "EscSubmission created with submission_round = submission_count", "increments SurveyFinding.version by 1"]
        note: "Clarification cycle RESPONSE_SUBMITTED -> CLARIFICATION_REQUESTED -> RESPONSE_SUBMITTED, bounded by MAX_CLARIFICATION_ROUNDS."
      - from: RESPONSE_SUBMITTED
        to: ACCEPTED
        trigger: "POST /accreditation/survey-findings/{id}/esc-review decision=ACCEPTED"
        actor: ExternalSurveyor
        preconditions: ["condition_level == false"]
        side_effects: ["accepted_at = current logical clock", "newest EscSubmission.decision = ACCEPTED"]
      - from: RESPONSE_SUBMITTED
        to: FOLLOW_UP_PENDING
        trigger: "POST /accreditation/survey-findings/{id}/esc-review decision=ACCEPTED"
        actor: ExternalSurveyor
        preconditions: ["condition_level == true"]
        side_effects: ["newest EscSubmission.decision = ACCEPTED", "SurveyWindow.follow_up_required stays true"]
        note: "Condition-level findings cannot close on paper; they wait for the follow-up survey."
      - from: RESPONSE_SUBMITTED
        to: RESPONSE_PENDING
        trigger: "POST /accreditation/survey-findings/{id}/esc-review decision=REJECTED"
        actor: ExternalSurveyor
        preconditions: []
        side_effects: ["newest EscSubmission.decision = REJECTED", "response_due_at unchanged"]
      - from: FOLLOW_UP_PENDING
        to: ACCEPTED
        trigger: "POST /accreditation/survey-windows/{id}/transition action=CLOSE_SURVEY (follow-up survey close)"
        actor: system
        preconditions: ["SurveyWindow.window_state == ACTIVE_SURVEY reached from CLOSED"]
        side_effects: ["accepted_at = survey_closed_at"]

  - entity: PprSelfAssessment
    initial_state: SUBMITTED
    terminal_states: [ATTESTED]
    shape: cyclic
    transitions:
      - from: SUBMITTED
        to: RETURNED_FOR_REASSESSMENT
        trigger: "system, when the owning Chapter.readiness_flag flips ON_TRACK -> AT_RISK"
        actor: system
        preconditions: ["Chapter.readiness_flag == AT_RISK"]
        side_effects: ["requires_reassessment = true", "increments PprSelfAssessment.version by 1"]
      - from: RETURNED_FOR_REASSESSMENT
        to: SUBMITTED
        trigger: "POST /accreditation/ppr-self-assessments/{id}/revise"
        actor: AccreditationDirector
        preconditions: []
        side_effects:
          - "self_ratings replaced; self_score, verified_score and gap recomputed by ppr_chapter_assessment"
          - "requires_reassessment = false"
          - "Chapter.ppr_escalation_count += 1 when the recomputed gap >= OVERSTATEMENT_THRESHOLD and flagged_overstatement was false"
        note: "Reassessment cycle SUBMITTED -> RETURNED_FOR_REASSESSMENT -> SUBMITTED is unbounded."
      - from: SUBMITTED
        to: ATTESTED
        trigger: "POST /accreditation/ppr-self-assessments/{id}/attest"
        actor: AccreditationDirector
        preconditions: ["requires_reassessment == false"]
        side_effects: ["attested_by_user_id = X-User-ID"]

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC on the parent's version only)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: tracer-schedule-stale-unit
    parent_entity: HospitalUnit
    write_endpoint: "POST /accreditation/mock-tracers"
    occ_field: "expected_unit_version"
    description: |
      Scheduling a MockTracer against a HospitalUnit whose version has advanced since the
      TracerSurveyor last read it is rejected with a stale-version conflict. Scheduling a second
      tracer on the same unit is legitimate product behaviour (different windows are allowed), so
      the rejection cannot be expressed as a state precondition: it exists because the surveyor's
      view of the unit (posture, penalty points, already-scheduled tracers) is out of date.
    error_id: ERR_STALE_UNIT_VERSION
    http_status: 412
  - rule_id: esc-submission-stale-finding
    parent_entity: SurveyFinding
    write_endpoint: "POST /accreditation/survey-findings/{id}/esc-submissions"
    occ_field: "expected_finding_version"
    description: |
      An evidence-of-standards-compliance submission carrying a SurveyFinding version older than
      the stored one is rejected with a stale-version conflict. Resubmission legitimately supersedes
      the prior round under the clarification cycle, so a second submission would otherwise succeed;
      the OCC check exists so an owner who has not seen the newest clarification decision (and its
      recomputed response_due_at) cannot overwrite the round counter.
    error_id: ERR_STALE_FINDING_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: mock_tracer_score
    trigger: "POST /accreditation/mock-tracers/{id}/transition action=COMPLETE (IN_PROGRESS -> COMPLETED side effect)"
    algorithm: aggregation
    formula: |
      credit(result) = { COMPLIANT: 1.0, PARTIAL: 0.5, NON_COMPLIANT: 0.0 }
      obs = every TracerObservation with mock_tracer_id == tracer.id and result != NOT_APPLICABLE
            (no time window; every row created before the COMPLETE call is included)
      scored_weight = sum(o.weight for o in obs)
      earned_weight = sum(o.weight * credit(o.result) for o in obs)
      if scored_weight == 0:            # every observation was NOT_APPLICABLE
          tracer_score = 0.00
          contributes_to_readiness = false
      else:
          tracer_score = round(earned_weight / scored_weight * 100, 2)
          contributes_to_readiness = true
    input_set: "TracerObservation rows of this tracer only; result == NOT_APPLICABLE rows are excluded from both sums; observation creation order is irrelevant because both terms are sums"
    constants:
      CREDIT_COMPLIANT: 1.0
      CREDIT_PARTIAL: 0.5
      CREDIT_NON_COMPLIANT: 0.0
    precision: "tracer_score 2 decimal places, round_half_up; scored_weight / earned_weight kept exact"

  - name: unit_readiness_score
    trigger: "GET /accreditation/units/{id}/readiness, and as a side effect of every transition that lists 'recomputes readiness_score / readiness_band' (tracer COMPLETE / ABORT, ticket create / ESCALATE / VERIFY, posture change, survey open / close)"
    algorithm: weighted_scoring
    formula: |
      # step 1 - participating chapters
      participating = every Chapter c such that at least one MockTracer m exists with
                      m.unit_id == unit.id AND m.chapter_id == c.id AND m.state == COMPLETED
                      AND m.contributes_to_readiness == true
      if participating is empty:
          readiness_score = 0.00 ; readiness_band = NOT_ASSESSED ; STOP (penalty is not applied)
      # step 2 - per-chapter rate over the completed contributing tracers of that chapter
      for c in participating:
          obs_c = TracerObservation rows whose mock_tracer_id is one of those tracers
                  and whose result != NOT_APPLICABLE
          rate_c = round(sum(o.weight * credit(o.result) for o in obs_c)
                         / sum(o.weight for o in obs_c), 4)      # round_half_up, 4 dp
      # step 3 - weighted base, ROUND-THEN-SUM (pinned order)
      participating_weight = sum(c.weight_pct for c in participating)
      contribution_c = round((c.weight_pct / participating_weight) * rate_c * 100, 2)  # per chapter, 2 dp
      base = round(sum(contribution_c for c in participating), 2)
      # step 4 - penalty (variant-dependent input set, see variants below)
      penalty = min(sum(t.penalty_points for t in penalised_tickets), PENALTY_CAP)
      # step 5 - score and band
      readiness_score = round(max(0.00, base - penalty), 2)
      readiness_band = READY       if readiness_score >= 90.00
                       CONDITIONAL if readiness_score >= 75.00
                       AT_RISK     if readiness_score >= 60.00
                       NOT_READY   otherwise
    input_set: |
      Chapters: only those with >= 1 MockTracer for this unit in state COMPLETED with
      contributes_to_readiness == true (a COMPLETED tracer whose observations were all NOT_APPLICABLE
      does NOT make its chapter participate). Observations: result != NOT_APPLICABLE.
      Tickets: DeficiencyTicket rows whose RoundingSession.unit_id == unit.id, filtered by variant.
      Rounding order is pinned: rate_c to 4 dp first, then each chapter contribution to 2 dp,
      then the sum to 2 dp (round-then-sum). Sum-then-round is explicitly NOT the rule.
    constants:
      PENALTY_CAP: 40
      SEVERITY_POINTS: { LOW: 1, MODERATE: 3, HIGH: 7, IMMEDIATE_THREAT: 15 }
      BAND_READY_MIN: 90.00
      BAND_CONDITIONAL_MIN: 75.00
      BAND_AT_RISK_MIN: 60.00
    precision: "2 decimal places, round_half_up, at each pinned rounding step"
    variants:
      - name: attested
        when: "GET /accreditation/units/{id}/readiness with mode omitted or mode=ATTESTED, and every persisted HospitalUnit.readiness_score / readiness_band recompute"
        difference: "penalised_tickets = every DeficiencyTicket of the unit whose state is in {OPEN, IN_PROGRESS, REMEDIATED, ESCALATED}; remediation that is not yet VERIFIED still costs points"
      - name: projected
        when: "GET /accreditation/units/{id}/readiness with mode=PROJECTED (survey-readiness forecast); never persisted"
        difference: "penalised_tickets excludes tickets whose state is in {IN_PROGRESS, REMEDIATED} and whose due_at >= current logical clock (in-flight work assumed closed by its due date); tickets in {OPEN, ESCALATED} and overdue in-flight tickets are still counted, so the two variants return different scores for identical data"

  - name: deficiency_due_at
    trigger: "POST /accreditation/rounding-sessions/{id}/deficiencies (DeficiencyTicket creation)"
    algorithm: threshold
    formula: |
      # PINNED EVALUATION ORDER - the band snapshot is taken BEFORE this ticket exists.
      # 1. band_snapshot = HospitalUnit.readiness_band as persisted at request start
      #    (this ticket's penalty_points are NOT yet part of open_deficiency_penalty_points)
      # 2. base_days = SEVERITY_DAYS[severity]
      # 3. if band_snapshot in {AT_RISK, NOT_READY}:
      #        base_days = max(1, floor(base_days / 2)) ; accelerated = true
      #    else:                                  # READY, CONDITIONAL, NOT_ASSESSED
      #        accelerated = false
      # 4. due_at = current logical clock + base_days days (exact 24h multiples)
      # 5. penalty_points = SEVERITY_POINTS[severity]
      # 6. insert the ticket, then HospitalUnit.open_deficiency_penalty_points += penalty_points
      # 7. recompute HospitalUnit.readiness_score / readiness_band (attested variant) and posture
      # Steps 1-4 never observe the value written in steps 6-7, even though step 7 can move the
      # band into the accelerating set. The dependency looks circular; the order above resolves it.
    input_set: "The single ticket being created; the unit is RoundingSession.unit_id of the path session"
    constants:
      SEVERITY_DAYS: { LOW: 45, MODERATE: 30, HIGH: 14, IMMEDIATE_THREAT: 1 }
      SEVERITY_POINTS: { LOW: 1, MODERATE: 3, HIGH: 7, IMMEDIATE_THREAT: 15 }
      POSTURE_RESTRICT_POINTS: 15
    precision: "due_at is an ISO 8601 UTC instant with three fractional digits; day arithmetic is exact 24h multiples, no calendar or business-day adjustment"

  - name: finding_risk_classification
    trigger: "POST /accreditation/survey-windows/{id}/findings (SurveyFinding creation)"
    algorithm: weighted_scoring
    formula: |
      # 4 inputs interacting non-linearly: rate tier, standard risk tier, harm flag, capped index.
      noncompliance_rate = round(observed_noncompliance_count / sampled_count, 4)
      classification = LIMITED    if noncompliance_rate <  RATE_PATTERN_MIN
                       PATTERN    if noncompliance_rate <  RATE_WIDESPREAD_MIN
                       WIDESPREAD otherwise                     # >= 0.8000 is WIDESPREAD
      class_index = { LIMITED: 0, PATTERN: 1, WIDESPREAD: 2 }[classification]
      tier_index  = { SITUATIONAL_DECISION_RULE: 0, INDIRECT_IMPACT: 1, DIRECT_IMPACT: 2 }[Standard.risk_tier]
      raw_index   = min(class_index + tier_index + (HARM_BONUS if patient_harm_observed else 0), INDEX_CAP)
      risk_level  = LOW              if raw_index <= 1
                    MODERATE         if raw_index == 2
                    HIGH             if raw_index in {3, 4}
                    IMMEDIATE_THREAT if raw_index >= 5
      condition_level = (risk_level == IMMEDIATE_THREAT)
                        or (classification == WIDESPREAD and Standard.risk_tier == DIRECT_IMPACT)
      response_deadline_days = DEADLINE_DAYS_HIGH if risk_level in {HIGH, IMMEDIATE_THREAT}
                               else DEADLINE_DAYS_STANDARD
    input_set: "The creating request body plus the referenced Standard.risk_tier; no other finding on the window participates"
    constants:
      RATE_PATTERN_MIN: 0.3400
      RATE_WIDESPREAD_MIN: 0.8000
      HARM_BONUS: 2
      INDEX_CAP: 6
      DEADLINE_DAYS_HIGH: 45
      DEADLINE_DAYS_STANDARD: 60
    precision: "noncompliance_rate 4 decimal places, round_half_up; comparisons use the rounded value"

  - name: esc_response_due_at
    trigger: "POST /accreditation/survey-windows/{id}/transition action=CLOSE_SURVEY (variant initial) and POST /accreditation/survey-findings/{id}/esc-review decision=CLARIFICATION_REQUESTED (variant clarification)"
    algorithm: interval_merge
    formula: |
      variant initial:       response_due_at = SurveyWindow.survey_closed_at
                                              + response_deadline_days days
                             initial_response_due_at = response_due_at
      variant clarification: response_due_at = min(current logical clock + CLARIFICATION_DAYS days,
                                                  initial_response_due_at + CLARIFICATION_CAP_DAYS days)
      # The cap is measured from initial_response_due_at, never from the previous response_due_at,
      # so repeated clarifications cannot walk the deadline forward indefinitely.
    input_set: "The single finding; SurveyWindow.survey_closed_at for variant initial, the logical clock at the clarification for variant clarification"
    constants:
      CLARIFICATION_DAYS: 21
      CLARIFICATION_CAP_DAYS: 10
      MAX_CLARIFICATION_ROUNDS: 2
    precision: "ISO 8601 UTC with three fractional digits; day arithmetic is exact 24h multiples"
    variants:
      - name: initial
        when: "the finding leaves DRAFT at CLOSE_SURVEY"
        difference: "anchored on survey_closed_at and the risk-derived response_deadline_days"
      - name: clarification
        when: "an ExternalSurveyor issues decision=CLARIFICATION_REQUESTED"
        difference: "anchored on the clarification instant with a 21-day allowance, hard-capped 10 days past initial_response_due_at; for the same finding the two variants yield different instants"

  - name: ppr_chapter_assessment
    trigger: "POST /accreditation/chapters/{id}/ppr-self-assessments and POST /accreditation/ppr-self-assessments/{id}/revise"
    algorithm: aggregation
    formula: |
      denominator = Chapter.standard_count            # EVERY standard of the chapter, not the rated ones
      # variant self_reported
      rating_points = { COMPLIANT: 100, PARTIAL: 50, NON_COMPLIANT: 0 }
      self_score = round(sum(rating_points[r.rating] for r in self_ratings) / denominator, 2)
      # variant evidence_verified
      state_points = { EVIDENCE_COMPLETE: 100, MAPPED: 50, UNMAPPED: 0, DEFICIENT: 0 }
      verified_score = round(sum(state_points[s.compliance_state]
                                 for s in Standard where s.chapter_id == chapter.id) / denominator, 2)
      gap = round(self_score - verified_score, 2)
      flagged_overstatement = (gap >= OVERSTATEMENT_THRESHOLD)
      if flagged_overstatement: Chapter.ppr_escalation_count += 1
      if Chapter.ppr_escalation_count >= CHAPTER_AT_RISK_PPR_COUNT: Chapter.readiness_flag = AT_RISK
    input_set: |
      Standards: every Standard row with chapter_id == the path chapter, ordered irrelevant (both terms are sums).
      Ratings: exactly the entries supplied in self_ratings; a chapter standard with no rating contributes 0
      to the numerator but still counts in the denominator; duplicate standard_id entries are rejected by
      ERR_INVALID_REQUEST; a standard_id outside the chapter is rejected by ERR_STANDARD_CHAPTER_MISMATCH.
    constants:
      RATING_POINTS: { COMPLIANT: 100, PARTIAL: 50, NON_COMPLIANT: 0 }
      STATE_POINTS: { EVIDENCE_COMPLETE: 100, MAPPED: 50, UNMAPPED: 0, DEFICIENT: 0 }
      OVERSTATEMENT_THRESHOLD: 10.00
      CHAPTER_AT_RISK_PPR_COUNT: 2
      CHAPTER_AT_RISK_DEFICIENT_COUNT: 2
    precision: "2 decimal places, round_half_up"
    variants:
      - name: self_reported
        when: "always computed into self_score at create and at revise"
        difference: "reads the unit-submitted ratings only; evidence and tracer history are ignored"
      - name: evidence_verified
        when: "always computed into verified_score at create and at revise"
        difference: "ignores the ratings and reads each Standard.compliance_state instead; for identical data the two variants disagree whenever a rated standard lacks validated evidence or is DEFICIENT"

  - name: survey_window_prediction
    trigger: "POST /accreditation/survey-windows (creation) and POST /_clock/set_current_utc (eligibility re-evaluation)"
    algorithm: interval_merge
    formula: |
      add_months(d, n): same day-of-month n months later; when that day does not exist in the
                        target month, clamp to the last day of the target month
                        (2025-08-31 + 18 months -> 2027-02-28). Time-of-day is preserved.
      predicted_open_date  = add_months(prior_survey_end_date, MIN_INTERVAL_MONTHS)
      predicted_close_date = add_months(prior_survey_end_date, MAX_INTERVAL_MONTHS)
      command_center_activation_allowed_from = predicted_open_date - COMMAND_CENTER_LEAD_DAYS days
      # occupancy: the CLOSED interval [predicted_open_date, predicted_close_date] on the hospital.
      # A new SurveyWindow is rejected when its interval intersects the interval of any existing
      # SurveyWindow with window_state != CLOSED; touching endpoints count as an intersection
      # (new.open <= other.close AND new.close >= other.open), capacity 1 hospital-wide.
      # eligibility (evaluated inside POST /_clock/set_current_utc):
      #   window_state PROJECTED -> ELIGIBLE when predicted_open_date <= clock <= predicted_close_date
    input_set: "The window being created plus every SurveyWindow with window_state in {PROJECTED, ELIGIBLE, ACTIVE_SURVEY} for the overlap check"
    constants:
      MIN_INTERVAL_MONTHS: 18
      MAX_INTERVAL_MONTHS: 36
      COMMAND_CENTER_LEAD_DAYS: 30
      FOLLOW_UP_LEAD_DAYS: 60
    precision: "ISO 8601 UTC with three fractional digits; month arithmetic clamps to end-of-month, day arithmetic is exact 24h multiples"

  - name: tracer_window_occupancy
    trigger: "POST /accreditation/mock-tracers (scheduling)"
    algorithm: interval_merge
    formula: |
      # HALF-OPEN [window_start, window_end) occupation of one HospitalUnit, capacity 1,
      # with a mandatory trailing turnaround buffer after each existing tracer.
      conflict(existing, new) = new.window_start <  existing.window_end + TURNAROUND_BUFFER_MINUTES
                                AND new.window_end   >  existing.window_start
      # A new tracer starting exactly at existing.window_end + 60 minutes is accepted.
    input_set: "MockTracer rows with the same unit_id whose state is in {SCHEDULED, IN_PROGRESS}; COMPLETED and ABORTED tracers release the unit"
    constants:
      TURNAROUND_BUFFER_MINUTES: 60
    precision: "minute-exact comparison on ISO 8601 UTC instants"

  - name: rounding_session_capacity
    trigger: "POST /accreditation/rounding-sessions"
    algorithm: aggregation
    formula: |
      # CLOSED [window_start, window_end] occupation of one HospitalUnit with AGGREGATE capacity 2
      # per round_type; touching endpoints count as an intersection and no buffer applies.
      intersecting = count(RoundingSession s where s.unit_id == new.unit_id
                           AND s.round_type == new.round_type
                           AND s.state == OPEN
                           AND s.window_start <= new.window_end
                           AND s.window_end   >= new.window_start)
      reject when intersecting >= ROUNDING_CONCURRENCY_LIMIT
    input_set: "RoundingSession rows of the same unit and same round_type with state == OPEN; CLOSED sessions release capacity"
    constants:
      ROUNDING_CONCURRENCY_LIMIT: 2
    precision: "second-exact comparison on ISO 8601 UTC instants"

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (ordered by priority; lower number wins)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "the acting role may perform this operation; on multi-action endpoints the role must be permitted for the requested action (SUBMIT is StandardOwner-only, VALIDATE/REJECT are EvidenceValidator-only, VERIFY and ESCALATE are SafetyOfficer-only)"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: business_constraint
    check: "request body has every required field, enum values are members of the declared set, numbers are in range, self_ratings has no duplicate standard_id"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST endpoints"
  - priority: 4
    category: business_constraint
    check: "limit in [1,100] and offset >= 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "all list GET endpoints"
  - priority: 5
    category: existence
    check: "every path resource exists, validated left-to-right"
    error_id: "ERR_CHAPTER_NOT_FOUND | ERR_STANDARD_NOT_FOUND | ERR_OWNER_ASSIGNMENT_NOT_FOUND | ERR_EVIDENCE_NOT_FOUND | ERR_UNIT_NOT_FOUND | ERR_TRACER_NOT_FOUND | ERR_ROUNDING_SESSION_NOT_FOUND | ERR_TICKET_NOT_FOUND | ERR_SURVEY_WINDOW_NOT_FOUND | ERR_FINDING_NOT_FOUND | ERR_PPR_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path ids"
  - priority: 6
    category: existence
    check: "every foreign key in the body exists (unit_id, chapter_id, standard_id)"
    error_id: "ERR_UNIT_NOT_FOUND | ERR_CHAPTER_NOT_FOUND | ERR_STANDARD_NOT_FOUND"
    http_status: 404
    applies_to: "POST /accreditation/mock-tracers, POST /accreditation/rounding-sessions, POST /accreditation/mock-tracers/{id}/observations, POST /accreditation/rounding-sessions/{id}/deficiencies, POST /accreditation/survey-windows/{id}/findings"
  - priority: 7
    category: auth
    check: "when X-User-Role == UnitManager, X-User-ID equals the HospitalUnit.id reached through the ticket's RoundingSession.unit_id"
    error_id: ERR_UNIT_SCOPE_VIOLATION
    http_status: 403
    applies_to: "POST /accreditation/deficiency-tickets/{id}/transition"
  - priority: 8
    category: state
    check: "expected_unit_version equals HospitalUnit.version / expected_finding_version equals SurveyFinding.version"
    error_id: "ERR_STALE_UNIT_VERSION | ERR_STALE_FINDING_VERSION"
    http_status: 412
    applies_to: "POST /accreditation/mock-tracers, POST /accreditation/survey-findings/{id}/esc-submissions"
  - priority: 9
    category: business_constraint
    check: "window_end > window_start"
    error_id: ERR_INVALID_INTERVAL
    http_status: 422
    applies_to: "POST /accreditation/mock-tracers, POST /accreditation/rounding-sessions"
  - priority: 10
    category: business_constraint
    check: "sampled_count >= 1 and 1 <= observed_noncompliance_count <= sampled_count"
    error_id: ERR_SAMPLE_COUNT_INVALID
    http_status: 422
    applies_to: "POST /accreditation/survey-windows/{id}/findings"
  - priority: 11
    category: business_constraint
    check: "uniqueness of Chapter.code, HospitalUnit.name, SurveyWindow.cycle_label, (chapter_id, standard_code), (chapter_id, period_label)"
    error_id: ERR_DUPLICATE_RESOURCE
    http_status: 409
    applies_to: "POST /accreditation/chapters, POST /accreditation/units, POST /accreditation/survey-windows, POST /accreditation/chapters/{id}/standards, POST /accreditation/chapters/{id}/ppr-self-assessments"
  - priority: 12
    category: state
    check: "action=VALIDATE requires validation_state == SUBMITTED"
    error_id: ERR_EVIDENCE_NOT_SUBMITTED
    http_status: 409
    applies_to: "POST /accreditation/evidence-items/{id}/transition"
  - priority: 13
    category: state
    check: "the requested action is a declared transition from the resource's current state (evidence SUBMIT from {DRAFT, REJECTED}, REJECT from {SUBMITTED, VALIDATED}; tracer START from SCHEDULED, ABORT from {SCHEDULED, IN_PROGRESS}; ticket actions per §1.2; window actions per §1.2; ppr revise from RETURNED_FOR_REASSESSMENT)"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "all POST .../transition, .../revoke, .../close, .../revise endpoints"
  - priority: 14
    category: state
    check: "action=COMPLETE requires state == IN_PROGRESS; recording an observation requires the tracer state == IN_PROGRESS"
    error_id: ERR_TRACER_NOT_IN_PROGRESS
    http_status: 409
    applies_to: "POST /accreditation/mock-tracers/{id}/transition, POST /accreditation/mock-tracers/{id}/observations"
  - priority: 15
    category: state
    check: "RoundingSession.state == OPEN when raising a deficiency"
    error_id: ERR_SESSION_ALREADY_CLOSED
    http_status: 409
    applies_to: "POST /accreditation/rounding-sessions/{id}/deficiencies"
  - priority: 16
    category: state
    check: "actions VERIFY and FAIL_VERIFICATION require the ticket's RoundingSession.state == CLOSED"
    error_id: ERR_SESSION_NOT_CLOSED
    http_status: 409
    applies_to: "POST /accreditation/deficiency-tickets/{id}/transition"
  - priority: 17
    category: state
    check: "action=OPEN_SURVEY requires window_state == ELIGIBLE or window_state == CLOSED (follow-up re-entry); PROJECTED and ACTIVE_SURVEY are rejected here. The follow_up_required flag and the follow-up deadline are checked later, at priority 32, so a CLOSED window reaches this rule regardless of that flag"
    error_id: ERR_SURVEY_WINDOW_NOT_ELIGIBLE
    http_status: 409
    applies_to: "POST /accreditation/survey-windows/{id}/transition"
  - priority: 18
    category: state
    check: "action=OPEN_SURVEY requires command_center_state == ACTIVATED"
    error_id: ERR_COMMAND_CENTER_NOT_ACTIVATED
    http_status: 409
    applies_to: "POST /accreditation/survey-windows/{id}/transition"
  - priority: 19
    category: state
    check: "creating a finding requires SurveyWindow.window_state == ACTIVE_SURVEY"
    error_id: ERR_SURVEY_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /accreditation/survey-windows/{id}/findings"
  - priority: 20
    category: state
    check: "the finding's state permits the operation: esc-submissions from {RESPONSE_PENDING, CONDITION_LEVEL_ESCALATED, CLARIFICATION_REQUESTED}; esc-review from RESPONSE_SUBMITTED; escalate from RESPONSE_PENDING"
    error_id: ERR_FINDING_NOT_AWAITING_RESPONSE
    http_status: 409
    applies_to: "POST /accreditation/survey-findings/{id}/esc-submissions, POST /accreditation/survey-findings/{id}/esc-review, POST /accreditation/survey-findings/{id}/escalate"
  - priority: 21
    category: state
    check: "attest requires state == SUBMITTED (ERR_PPR_ALREADY_ATTESTED when already ATTESTED) and requires_reassessment == false (ERR_PPR_REASSESSMENT_REQUIRED)"
    error_id: "ERR_PPR_ALREADY_ATTESTED | ERR_PPR_REASSESSMENT_REQUIRED"
    http_status: 409
    applies_to: "POST /accreditation/ppr-self-assessments/{id}/attest"
  - priority: 22
    category: state
    check: "revoke requires OwnerAssignment.status == ACTIVE"
    error_id: ERR_OWNER_ASSIGNMENT_ALREADY_REVOKED
    http_status: 409
    applies_to: "POST /accreditation/owner-assignments/{id}/revoke"
  - priority: 23
    category: state
    check: "scheduling a tracer and action=START both require HospitalUnit.posture == OPEN"
    error_id: ERR_UNIT_POSTURE_RESTRICTED
    http_status: 409
    applies_to: "POST /accreditation/mock-tracers, POST /accreditation/mock-tracers/{id}/transition"
  - priority: 24
    category: business_safety
    check: "no DeficiencyTicket anywhere in the hospital is in state ESCALATED with severity == IMMEDIATE_THREAT"
    error_id: ERR_IMMEDIATE_THREAT_ACTIVE
    http_status: 409
    applies_to: "POST /accreditation/mock-tracers, POST /accreditation/survey-windows/{id}/transition (action=OPEN_SURVEY)"
  - priority: 25
    category: business_safety
    check: "closing a rounding session requires that no DeficiencyTicket of that session is in state ESCALATED"
    error_id: ERR_ESCALATED_TICKET_BLOCKS_CLOSE
    http_status: 409
    applies_to: "POST /accreditation/rounding-sessions/{id}/close"
  - priority: 26
    category: business_safety
    check: "a finding with condition_level == true must reach CONDITION_LEVEL_ESCALATED before any ESC submission is accepted"
    error_id: ERR_CONDITION_LEVEL_ESCALATION_REQUIRED
    http_status: 409
    applies_to: "POST /accreditation/survey-findings/{id}/esc-submissions"
  - priority: 27
    category: business_safety
    check: "escalate requires condition_level == true"
    error_id: ERR_NOT_CONDITION_LEVEL
    http_status: 422
    applies_to: "POST /accreditation/survey-findings/{id}/escalate"
  - priority: 28
    category: business_temporal
    check: "tracer_window_occupancy finds no conflicting MockTracer in {SCHEDULED, IN_PROGRESS} on the same unit (half-open interval plus 60-minute trailing buffer)"
    error_id: ERR_TRACER_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /accreditation/mock-tracers"
  - priority: 29
    category: business_temporal
    check: "the predicted [open, close] interval does not intersect that of any SurveyWindow with window_state != CLOSED (closed intervals, touching endpoints intersect)"
    error_id: ERR_SURVEY_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /accreditation/survey-windows"
  - priority: 30
    category: business_temporal
    check: "action=START requires current logical clock >= window_start"
    error_id: ERR_TRACER_WINDOW_NOT_STARTED
    http_status: 409
    applies_to: "POST /accreditation/mock-tracers/{id}/transition"
  - priority: 31
    category: business_temporal
    check: "action=ACTIVATE_COMMAND_CENTER requires current logical clock >= command_center_activation_allowed_from"
    error_id: ERR_COMMAND_CENTER_WINDOW_NOT_OPEN
    http_status: 409
    applies_to: "POST /accreditation/survey-windows/{id}/transition"
  - priority: 32
    category: business_temporal
    check: "a follow-up OPEN_SURVEY requires follow_up_required == true (ERR_FOLLOW_UP_NOT_REQUIRED) and current logical clock <= follow_up_due_at (ERR_FOLLOW_UP_WINDOW_EXPIRED)"
    error_id: "ERR_FOLLOW_UP_NOT_REQUIRED | ERR_FOLLOW_UP_WINDOW_EXPIRED"
    http_status: 409
    applies_to: "POST /accreditation/survey-windows/{id}/transition"
  - priority: 33
    category: business_temporal
    check: "current logical clock <= SurveyFinding.response_due_at (equality is still inside the window)"
    error_id: ERR_ESC_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /accreditation/survey-findings/{id}/esc-submissions"
  - priority: 34
    category: business_temporal
    check: "action=VALIDATE requires expires_at is null or expires_at > current logical clock"
    error_id: ERR_EVIDENCE_EXPIRED
    http_status: 409
    applies_to: "POST /accreditation/evidence-items/{id}/transition"
  - priority: 35
    category: business_constraint
    check: "rounding_session_capacity: fewer than 2 intersecting OPEN sessions of the same round_type on the unit"
    error_id: ERR_ROUNDING_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /accreditation/rounding-sessions"
  - priority: 36
    category: business_constraint
    check: "clarification_round_count < MAX_CLARIFICATION_ROUNDS before issuing decision=CLARIFICATION_REQUESTED"
    error_id: ERR_CLARIFICATION_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /accreditation/survey-findings/{id}/esc-review"
  - priority: 37
    category: business_constraint
    check: "leadership_signoff == true"
    error_id: ERR_LEADERSHIP_SIGNOFF_REQUIRED
    http_status: 422
    applies_to: "POST /accreditation/survey-findings/{id}/esc-submissions"
  - priority: 38
    category: business_constraint
    check: "action=COMPLETE requires at least one TracerObservation on the tracer"
    error_id: ERR_NO_OBSERVATIONS_RECORDED
    http_status: 422
    applies_to: "POST /accreditation/mock-tracers/{id}/transition"
  - priority: 39
    category: business_referential
    check: "no OwnerAssignment with the same owner_user_id and status == ACTIVE already exists on this standard"
    error_id: ERR_DUPLICATE_OWNER_ASSIGNMENT
    http_status: 409
    applies_to: "POST /accreditation/standards/{id}/owner-assignments"
  - priority: 40
    category: business_referential
    check: "segregation of duties: the reviewing X-User-ID is not the owner_user_id of any OwnerAssignment with status == ACTIVE on the standard"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /accreditation/evidence-items/{id}/transition (actions VALIDATE, REJECT)"
  - priority: 41
    category: business_referential
    check: "the submitting X-User-ID owns an OwnerAssignment on the finding's standard with status == ACTIVE and designation == PRIMARY"
    error_id: ERR_SUBMITTER_NOT_STANDARD_OWNER
    http_status: 422
    applies_to: "POST /accreditation/survey-findings/{id}/esc-submissions"
  - priority: 42
    category: business_referential
    check: "action=SUBMIT requires Standard.compliance_state != UNMAPPED and the submitting X-User-ID to own an ACTIVE OwnerAssignment on that standard"
    error_id: ERR_STANDARD_UNMAPPED
    http_status: 422
    applies_to: "POST /accreditation/evidence-items/{id}/transition"
  - priority: 43
    category: business_referential
    check: "every self_ratings[].standard_id belongs to the path chapter; every observation's standard_id belongs to the tracer's chapter_id"
    error_id: ERR_STANDARD_CHAPTER_MISMATCH
    http_status: 422
    applies_to: "POST /accreditation/chapters/{id}/ppr-self-assessments, POST /accreditation/ppr-self-assessments/{id}/revise, POST /accreditation/mock-tracers/{id}/observations"
  - priority: 44
    category: business_referential
    check: "Chapter.mapped_standard_count >= 1 for the tracer's chapter"
    error_id: ERR_CHAPTER_NOT_MAPPED
    http_status: 422
    applies_to: "POST /accreditation/mock-tracers"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:
  # ---- Chapters & standards -------------------------------------------------
  - method: POST
    path: "/accreditation/chapters"
    description: "Register an accreditation chapter with its readiness weight and evidence minimum"
    roles: [AccreditationDirector]
    code: 201
    input: [code, name, weight_pct, "evidence_min_count?"]
    output: Chapter
    side_effects: ["standard_count / mapped_standard_count / evidence_complete_standard_count / deficient_standard_count / ppr_escalation_count initialised to 0", "readiness_flag = ON_TRACK"]
  - method: GET
    path: "/accreditation/chapters/{id}"
    description: "Read one chapter with its derived counters"
    roles: &read_roles [AccreditationDirector, StandardOwner, EvidenceValidator, TracerSurveyor, SafetyOfficer, ExternalSurveyor, UnitManager]
    code: 200
    input: []
    output: Chapter
    side_effects: []
  - method: POST
    path: "/accreditation/chapters/{id}/standards"
    description: "Add a standard to a chapter"
    roles: [AccreditationDirector]
    code: 201
    input: [standard_code, title, risk_tier]
    output: Standard
    side_effects: ["compliance_state = UNMAPPED", "Chapter.standard_count += 1", "increments Chapter.version by 1"]
  - method: GET
    path: "/accreditation/chapters/{id}/standards"
    description: "List the standards of a chapter (reverse reachability for Standard.chapter_id)"
    roles: *read_roles
    code: 200
    input: ["compliance_state?", "limit?", "offset?"]
    output: Standard[]
    side_effects: []
  - method: GET
    path: "/accreditation/standards/{id}"
    description: "Read one standard with its derived compliance_state and counters"
    roles: *read_roles
    code: 200
    input: []
    output: Standard
    side_effects: []
  - method: POST
    path: "/accreditation/standards/{id}/owner-assignments"
    description: "Map a standard to an accountable owner"
    roles: [AccreditationDirector]
    code: 201
    input: [owner_user_id, designation]
    output: OwnerAssignment
    side_effects: ["Standard.active_owner_count += 1", "Standard UNMAPPED -> MAPPED on the 0 -> 1 edge", "Chapter.mapped_standard_count += 1 on that same edge", "increments Standard.version by 1"]
  - method: GET
    path: "/accreditation/standards/{id}/owner-assignments"
    description: "List owner assignments of a standard (reverse reachability for OwnerAssignment.standard_id)"
    roles: *read_roles
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: OwnerAssignment[]
    side_effects: []
  - method: POST
    path: "/accreditation/owner-assignments/{id}/revoke"
    description: "Revoke an owner assignment; compensating half of the chapter_mapped_standard_ledger invariant"
    roles: [AccreditationDirector]
    code: 200
    input: ["reason?"]
    output: OwnerAssignment
    side_effects: ["status = REVOKED, revoked_at = logical clock", "Standard.active_owner_count -= 1", "Standard -> UNMAPPED on the 1 -> 0 edge", "Chapter.mapped_standard_count -= 1 on that edge", "Chapter.evidence_complete_standard_count -= 1 when the standard left EVIDENCE_COMPLETE"]
  # ---- Evidence repository --------------------------------------------------
  - method: POST
    path: "/accreditation/standards/{id}/evidence-items"
    description: "File a document into the standard's evidence repository (starts DRAFT)"
    roles: [StandardOwner]
    code: 201
    input: [title, doc_type, effective_date, "expires_at?"]
    output: EvidenceItem
    side_effects: ["validation_state = DRAFT"]
  - method: GET
    path: "/accreditation/standards/{id}/evidence-items"
    description: "List the evidence repository of a standard (reverse reachability for EvidenceItem.standard_id)"
    roles: *read_roles
    code: 200
    input: ["validation_state?", "limit?", "offset?"]
    output: EvidenceItem[]
    side_effects: []
  - method: GET
    path: "/accreditation/evidence-items/{id}"
    description: "Read one evidence item"
    roles: *read_roles
    code: 200
    input: []
    output: EvidenceItem
    side_effects: []
  - method: POST
    path: "/accreditation/evidence-items/{id}/transition"
    description: "Advance an evidence item: SUBMIT (StandardOwner), VALIDATE or REJECT (EvidenceValidator)"
    roles: [StandardOwner, EvidenceValidator]
    code: 200
    input: [action, "review_note?"]
    output: EvidenceItem
    side_effects: ["validation_state per §1.2", "Standard.validated_evidence_count +/- 1 and the MAPPED <-> EVIDENCE_COMPLETE derivation", "Chapter.evidence_complete_standard_count follows the standard"]
  # ---- Units & readiness ----------------------------------------------------
  - method: POST
    path: "/accreditation/units"
    description: "Register a hospital unit"
    roles: [AccreditationDirector]
    code: 201
    input: [name, unit_type, bed_count]
    output: HospitalUnit
    side_effects: ["posture = OPEN", "readiness_band = NOT_ASSESSED", "open_deficiency_penalty_points = 0"]
  - method: GET
    path: "/accreditation/units/{id}"
    description: "Read one unit including posture, penalty ledger and persisted ATTESTED readiness"
    roles: *read_roles
    code: 200
    input: []
    output: HospitalUnit
    side_effects: []
  - method: GET
    path: "/accreditation/units/{id}/readiness"
    description: "Computed read of unit_readiness_score; mode selects the ATTESTED (default) or PROJECTED variant"
    roles: *read_roles
    code: 200
    input: ["mode?"]
    output: "{ unit_id: string, mode: string, base_score: number, penalty_points_applied: integer, participating_weight_pct: number, readiness_score: number, readiness_band: string, chapter_breakdown: array }"
    side_effects: []
  # ---- Mock tracer program --------------------------------------------------
  - method: POST
    path: "/accreditation/mock-tracers"
    description: "Schedule a mock tracer on a unit for one chapter; OCC-guarded on the unit"
    roles: [TracerSurveyor, AccreditationDirector]
    code: 201
    input: [unit_id, chapter_id, tracer_type, window_start, window_end, expected_unit_version]
    output: MockTracer
    side_effects: ["state = SCHEDULED", "HospitalUnit.scheduled_tracer_count += 1", "increments HospitalUnit.version by 1"]
  - method: GET
    path: "/accreditation/mock-tracers/{id}"
    description: "Read one mock tracer with its frozen scoring fields"
    roles: *read_roles
    code: 200
    input: []
    output: MockTracer
    side_effects: []
  - method: GET
    path: "/accreditation/mock-tracers"
    description: "List mock tracers (reverse reachability for MockTracer.unit_id and MockTracer.chapter_id)"
    roles: *read_roles
    code: 200
    input: ["unit_id?", "chapter_id?", "state?", "limit?", "offset?"]
    output: MockTracer[]
    side_effects: []
  - method: POST
    path: "/accreditation/mock-tracers/{id}/transition"
    description: "Advance a tracer: START, COMPLETE or ABORT"
    roles: [TracerSurveyor]
    code: 200
    input: [action, "abort_reason?"]
    output: MockTracer
    side_effects: ["state per §1.2", "on COMPLETE: mock_tracer_score freezes scored_weight / earned_weight / tracer_score / contributes_to_readiness, NON_COMPLIANT standards move to DEFICIENT, Chapter counters and readiness_flag follow, SUBMITTED PPRs of that chapter are returned for reassessment, HospitalUnit readiness recomputed", "on ABORT / START: HospitalUnit.scheduled_tracer_count -= 1 and readiness recomputed"]
  - method: POST
    path: "/accreditation/mock-tracers/{id}/observations"
    description: "Record one standard-level tracer observation"
    roles: [TracerSurveyor]
    code: 201
    input: [standard_id, result, "weight?", "note?"]
    output: TracerObservation
    side_effects: ["recorded_by_user_id = X-User-ID", "no scoring happens until action=COMPLETE"]
  - method: GET
    path: "/accreditation/mock-tracers/{id}/observations"
    description: "List observations of a tracer (reverse reachability for TracerObservation.mock_tracer_id)"
    roles: *read_roles
    code: 200
    input: ["result?", "limit?", "offset?"]
    output: TracerObservation[]
    side_effects: []
  - method: GET
    path: "/accreditation/standards/{id}/tracer-observations"
    description: "List observations recorded against a standard (reverse reachability for TracerObservation.standard_id)"
    roles: *read_roles
    code: 200
    input: ["result?", "limit?", "offset?"]
    output: TracerObservation[]
    side_effects: []
  # ---- Life safety / environment-of-care rounding ---------------------------
  - method: POST
    path: "/accreditation/rounding-sessions"
    description: "Open a life-safety or environment-of-care rounding session on a unit"
    roles: [SafetyOfficer]
    code: 201
    input: [unit_id, round_type, window_start, window_end]
    output: RoundingSession
    side_effects: ["state = OPEN", "rounding_session_capacity enforced"]
  - method: GET
    path: "/accreditation/rounding-sessions/{id}"
    description: "Read one rounding session"
    roles: *read_roles
    code: 200
    input: []
    output: RoundingSession
    side_effects: []
  - method: GET
    path: "/accreditation/rounding-sessions"
    description: "List rounding sessions (reverse reachability for RoundingSession.unit_id)"
    roles: *read_roles
    code: 200
    input: ["unit_id?", "round_type?", "state?", "limit?", "offset?"]
    output: RoundingSession[]
    side_effects: []
  - method: POST
    path: "/accreditation/rounding-sessions/{id}/deficiencies"
    description: "Ticket a deficiency observed during rounding"
    roles: [SafetyOfficer]
    code: 201
    input: [standard_id, description, severity]
    output: DeficiencyTicket
    side_effects: ["due_at / accelerated from deficiency_due_at using the pre-insert readiness band", "penalty_points = SEVERITY_POINTS[severity]", "RoundingSession.deficiency_count += 1", "HospitalUnit.open_deficiency_penalty_points += penalty_points then posture and readiness recomputed", "increments HospitalUnit.version by 1"]
  - method: POST
    path: "/accreditation/rounding-sessions/{id}/close"
    description: "Close a rounding session so its tickets become verifiable"
    roles: [SafetyOfficer]
    code: 200
    input: []
    output: RoundingSession
    side_effects: ["state = CLOSED, closed_at = logical clock"]
  - method: GET
    path: "/accreditation/deficiency-tickets/{id}"
    description: "Read one deficiency ticket"
    roles: *read_roles
    code: 200
    input: []
    output: DeficiencyTicket
    side_effects: []
  - method: GET
    path: "/accreditation/deficiency-tickets"
    description: "List deficiency tickets (reverse reachability for DeficiencyTicket.rounding_session_id and .standard_id)"
    roles: *read_roles
    code: 200
    input: ["rounding_session_id?", "standard_id?", "state?", "severity?", "limit?", "offset?"]
    output: DeficiencyTicket[]
    side_effects: []
  - method: POST
    path: "/accreditation/deficiency-tickets/{id}/transition"
    description: "Advance a ticket: START_WORK, MARK_REMEDIATED, VERIFY, FAIL_VERIFICATION or ESCALATE"
    roles: [SafetyOfficer, UnitManager]
    code: 200
    input: [action, "note?"]
    output: DeficiencyTicket
    side_effects: ["state per §1.2", "on ESCALATE: LIFE_SAFETY tickets are raised to IMMEDIATE_THREAT, the unit penalty ledger is recomputed, posture may move OPEN -> RESTRICTED, which aborts every SCHEDULED tracer of the unit and recomputes readiness", "on VERIFY: penalty points released, posture may revert, the standard may leave DEFICIENT and chapter counters follow"]
  # ---- Survey window & command center --------------------------------------
  - method: POST
    path: "/accreditation/survey-windows"
    description: "Create the predicted survey window for an accreditation cycle"
    roles: [AccreditationDirector]
    code: 201
    input: [cycle_label, prior_survey_end_date]
    output: SurveyWindow
    side_effects: ["survey_window_prediction computes predicted_open_date / predicted_close_date / command_center_activation_allowed_from", "window_state = PROJECTED, command_center_state = STANDBY", "closed-interval overlap against non-CLOSED windows enforced"]
  - method: GET
    path: "/accreditation/survey-windows/{id}"
    description: "Read one survey window with both state dimensions"
    roles: *read_roles
    code: 200
    input: []
    output: SurveyWindow
    side_effects: []
  - method: POST
    path: "/accreditation/survey-windows/{id}/transition"
    description: "Drive the window: ACTIVATE_COMMAND_CENTER, DEMOBILIZE_COMMAND_CENTER, OPEN_SURVEY, CLOSE_SURVEY"
    roles: [AccreditationDirector]
    code: 200
    input: [action, "note?"]
    output: SurveyWindow
    side_effects: ["window_state and command_center_state per §1.2 (independent dimensions)", "OPEN_SURVEY locks every unit and aborts their SCHEDULED tracers", "CLOSE_SURVEY moves DRAFT findings to RESPONSE_PENDING with esc_response_due_at variant initial, sets follow_up_required / follow_up_due_at, releases unit postures and accepts FOLLOW_UP_PENDING findings"]
  - method: POST
    path: "/accreditation/survey-windows/{id}/findings"
    description: "Record a surveyor finding during an active survey"
    roles: [ExternalSurveyor]
    code: 201
    input: [standard_id, unit_id, observed_noncompliance_count, sampled_count, "patient_harm_observed?"]
    output: SurveyFinding
    side_effects: ["finding_risk_classification computes noncompliance_rate / classification / risk_level / condition_level / response_deadline_days", "state = DRAFT", "SurveyWindow.condition_level_finding_count += 1 when condition_level"]
  - method: GET
    path: "/accreditation/survey-findings/{id}"
    description: "Read one finding with its classification and deadlines"
    roles: *read_roles
    code: 200
    input: []
    output: SurveyFinding
    side_effects: []
  - method: GET
    path: "/accreditation/survey-findings"
    description: "List findings (reverse reachability for SurveyFinding.survey_window_id, .standard_id and .unit_id)"
    roles: *read_roles
    code: 200
    input: ["survey_window_id?", "standard_id?", "unit_id?", "state?", "limit?", "offset?"]
    output: SurveyFinding[]
    side_effects: []
  - method: POST
    path: "/accreditation/survey-findings/{id}/escalate"
    description: "Escalate a condition-level finding, forcing a follow-up survey"
    roles: [ExternalSurveyor]
    code: 200
    input: [rationale]
    output: SurveyFinding
    side_effects: ["state = CONDITION_LEVEL_ESCALATED", "Standard -> DEFICIENT with last_noncompliant_observed_at set", "SurveyWindow.follow_up_required = true and follow_up_due_at set"]
  - method: POST
    path: "/accreditation/survey-findings/{id}/esc-submissions"
    description: "Submit evidence of standards compliance for a finding; OCC-guarded on the finding"
    roles: [StandardOwner]
    code: 201
    input: [corrective_action_summary, measure_of_success, leadership_signoff, expected_finding_version]
    output: EscSubmission
    side_effects: ["submission_round = SurveyFinding.submission_count + 1", "SurveyFinding.state -> RESPONSE_SUBMITTED", "increments SurveyFinding.version by 1"]
  - method: GET
    path: "/accreditation/survey-findings/{id}/esc-submissions"
    description: "List the ESC submission rounds of a finding (reverse reachability for EscSubmission.survey_finding_id)"
    roles: *read_roles
    code: 200
    input: ["limit?", "offset?"]
    output: EscSubmission[]
    side_effects: []
  - method: POST
    path: "/accreditation/survey-findings/{id}/esc-review"
    description: "Accrediting-body decision on the newest ESC round: CLARIFICATION_REQUESTED, ACCEPTED or REJECTED"
    roles: [ExternalSurveyor]
    code: 200
    input: [decision, "decision_note?"]
    output: SurveyFinding
    side_effects: ["newest EscSubmission.decision / decision_note updated", "CLARIFICATION_REQUESTED increments clarification_round_count and recomputes response_due_at via esc_response_due_at variant clarification", "ACCEPTED moves the finding to ACCEPTED, or to FOLLOW_UP_PENDING when condition_level", "REJECTED returns the finding to RESPONSE_PENDING"]
  # ---- Periodic performance review -----------------------------------------
  - method: POST
    path: "/accreditation/chapters/{id}/ppr-self-assessments"
    description: "File a periodic performance review self-assessment for a chapter"
    roles: [AccreditationDirector]
    code: 201
    input: [period_label, self_ratings]
    output: PprSelfAssessment
    side_effects: ["ppr_chapter_assessment computes self_score / verified_score / gap / flagged_overstatement", "Chapter.ppr_escalation_count += 1 when flagged_overstatement", "Chapter.readiness_flag = AT_RISK at CHAPTER_AT_RISK_PPR_COUNT", "state = SUBMITTED"]
  - method: GET
    path: "/accreditation/chapters/{id}/ppr-self-assessments"
    description: "List PPR self-assessments of a chapter (reverse reachability for PprSelfAssessment.chapter_id)"
    roles: *read_roles
    code: 200
    input: ["state?", "limit?", "offset?"]
    output: PprSelfAssessment[]
    side_effects: []
  - method: POST
    path: "/accreditation/ppr-self-assessments/{id}/revise"
    description: "Re-rate a returned PPR self-assessment and recompute both score variants"
    roles: [AccreditationDirector]
    code: 200
    input: [self_ratings]
    output: PprSelfAssessment
    side_effects: ["state RETURNED_FOR_REASSESSMENT -> SUBMITTED", "requires_reassessment = false", "self_score / verified_score / gap / flagged_overstatement recomputed"]
  - method: POST
    path: "/accreditation/ppr-self-assessments/{id}/attest"
    description: "Leadership attestation of a PPR self-assessment"
    roles: [AccreditationDirector]
    code: 200
    input: ["attestation_note?"]
    output: PprSelfAssessment
    side_effects: ["state = ATTESTED", "attested_by_user_id = X-User-ID"]
  # ---- Test-driving surface (logical clock) ---------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. The clock starts at the fixed default 2026-08-01T00:00:00Z and never falls back to wall-clock time. Setting it runs the evidence expiry sweep and re-evaluates survey-window eligibility."
    roles: [AccreditationDirector]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string, expired_evidence_count: integer, eligible_window_count: integer }"
    side_effects: ["every VALIDATED EvidenceItem with expires_at <= new clock moves to EXPIRED, decrementing Standard.validated_evidence_count, which may move the standard EVIDENCE_COMPLETE -> MAPPED and decrement Chapter.evidence_complete_standard_count", "every SurveyWindow with window_state == PROJECTED and predicted_open_date <= clock <= predicted_close_date moves to ELIGIBLE"]

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  # ---- auth / request shape ----
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the seven declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not permitted for this endpoint, or not permitted for the requested action on a multi-action endpoint"
  - id: ERR_UNIT_SCOPE_VIOLATION
    http: 403
    condition: "X-User-Role == UnitManager and X-User-ID differs from the HospitalUnit.id owning the ticket's rounding session"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the EvidenceValidator issuing VALIDATE or REJECT is an ACTIVE owner of the evidence item's standard"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "a required body field is missing, an enum value is outside the declared set, a number is out of range, or self_ratings repeats a standard_id"
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit outside [1,100] or offset < 0"
  # ---- existence ----
  - id: ERR_CHAPTER_NOT_FOUND
    http: 404
    condition: "no Chapter with the given path or body id"
  - id: ERR_STANDARD_NOT_FOUND
    http: 404
    condition: "no Standard with the given path or body id"
  - id: ERR_OWNER_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "no OwnerAssignment with the given path id"
  - id: ERR_EVIDENCE_NOT_FOUND
    http: 404
    condition: "no EvidenceItem with the given path id"
  - id: ERR_UNIT_NOT_FOUND
    http: 404
    condition: "no HospitalUnit with the given path or body id"
  - id: ERR_TRACER_NOT_FOUND
    http: 404
    condition: "no MockTracer with the given path id"
  - id: ERR_ROUNDING_SESSION_NOT_FOUND
    http: 404
    condition: "no RoundingSession with the given path id"
  - id: ERR_TICKET_NOT_FOUND
    http: 404
    condition: "no DeficiencyTicket with the given path id"
  - id: ERR_SURVEY_WINDOW_NOT_FOUND
    http: 404
    condition: "no SurveyWindow with the given path id"
  - id: ERR_FINDING_NOT_FOUND
    http: 404
    condition: "no SurveyFinding with the given path id"
  - id: ERR_PPR_NOT_FOUND
    http: 404
    condition: "no PprSelfAssessment with the given path id"
  # ---- optimistic concurrency ----
  - id: ERR_STALE_UNIT_VERSION
    http: 412
    condition: "expected_unit_version does not equal the target HospitalUnit.version at write time"
  - id: ERR_STALE_FINDING_VERSION
    http: 412
    condition: "expected_finding_version does not equal the target SurveyFinding.version at write time"
  # ---- state errors ----
  - id: ERR_INVALID_STATE_TRANSITION
    http: 409
    condition: "the requested action is not a declared transition out of the resource's current state"
  - id: ERR_EVIDENCE_NOT_SUBMITTED
    http: 409
    condition: "action=VALIDATE on an evidence item whose validation_state is not SUBMITTED"
  - id: ERR_EVIDENCE_EXPIRED
    http: 409
    condition: "action=VALIDATE on an evidence item whose expires_at is at or before the logical clock"
  - id: ERR_TRACER_NOT_IN_PROGRESS
    http: 409
    condition: "action=COMPLETE or an observation write on a tracer whose state is not IN_PROGRESS"
  - id: ERR_SESSION_ALREADY_CLOSED
    http: 409
    condition: "raising a deficiency on a RoundingSession whose state is CLOSED"
  - id: ERR_SESSION_NOT_CLOSED
    http: 409
    condition: "VERIFY or FAIL_VERIFICATION on a ticket whose rounding session is still OPEN"
  - id: ERR_SURVEY_WINDOW_NOT_ELIGIBLE
    http: 409
    condition: "OPEN_SURVEY on a window that is neither ELIGIBLE nor a CLOSED window with follow_up_required == true"
  - id: ERR_COMMAND_CENTER_NOT_ACTIVATED
    http: 409
    condition: "OPEN_SURVEY while command_center_state is STANDBY or DEMOBILIZED"
  - id: ERR_SURVEY_NOT_ACTIVE
    http: 409
    condition: "recording a finding on a window whose window_state is not ACTIVE_SURVEY"
  - id: ERR_FINDING_NOT_AWAITING_RESPONSE
    http: 409
    condition: "an ESC submission, ESC review or escalation issued from a finding state that does not permit it"
  - id: ERR_PPR_ALREADY_ATTESTED
    http: 409
    condition: "attest on a PprSelfAssessment already in state ATTESTED"
  - id: ERR_PPR_REASSESSMENT_REQUIRED
    http: 409
    condition: "attest on a PprSelfAssessment whose requires_reassessment is true"
  - id: ERR_OWNER_ASSIGNMENT_ALREADY_REVOKED
    http: 409
    condition: "revoke on an OwnerAssignment whose status is already REVOKED"
  - id: ERR_UNIT_POSTURE_RESTRICTED
    http: 409
    condition: "scheduling or starting a tracer on a unit whose posture is RESTRICTED or LOCKED_FOR_SURVEY"
  # ---- business safety ----
  - id: ERR_IMMEDIATE_THREAT_ACTIVE
    http: 409
    condition: "any DeficiencyTicket hospital-wide is ESCALATED with severity IMMEDIATE_THREAT when scheduling a tracer or opening a survey"
  - id: ERR_ESCALATED_TICKET_BLOCKS_CLOSE
    http: 409
    condition: "closing a rounding session that still holds an ESCALATED ticket"
  - id: ERR_CONDITION_LEVEL_ESCALATION_REQUIRED
    http: 409
    condition: "an ESC submission on a condition_level finding that has not yet reached CONDITION_LEVEL_ESCALATED"
  - id: ERR_NOT_CONDITION_LEVEL
    http: 422
    condition: "escalate invoked on a finding whose condition_level is false"
  # ---- temporal ----
  - id: ERR_TRACER_WINDOW_CONFLICT
    http: 409
    condition: "the requested tracer window intersects an existing SCHEDULED or IN_PROGRESS window on the unit once the 60-minute trailing buffer is applied"
  - id: ERR_SURVEY_WINDOW_OVERLAP
    http: 409
    condition: "the predicted survey interval intersects a non-CLOSED SurveyWindow, endpoints inclusive"
  - id: ERR_TRACER_WINDOW_NOT_STARTED
    http: 409
    condition: "action=START before the tracer's window_start"
  - id: ERR_COMMAND_CENTER_WINDOW_NOT_OPEN
    http: 409
    condition: "ACTIVATE_COMMAND_CENTER before command_center_activation_allowed_from"
  - id: ERR_FOLLOW_UP_NOT_REQUIRED
    http: 409
    condition: "reopening a CLOSED window whose follow_up_required is false"
  - id: ERR_FOLLOW_UP_WINDOW_EXPIRED
    http: 409
    condition: "reopening a CLOSED window after follow_up_due_at has passed"
  - id: ERR_ESC_WINDOW_CLOSED
    http: 422
    condition: "an ESC submission after SurveyFinding.response_due_at has passed"
  # ---- business constraints / referential ----
  - id: ERR_INVALID_INTERVAL
    http: 422
    condition: "window_end is not strictly after window_start"
  - id: ERR_SAMPLE_COUNT_INVALID
    http: 422
    condition: "sampled_count < 1, observed_noncompliance_count < 1, or observed_noncompliance_count > sampled_count"
  - id: ERR_DUPLICATE_RESOURCE
    http: 409
    condition: "a uniqueness key collides: Chapter.code, HospitalUnit.name, SurveyWindow.cycle_label, (chapter_id, standard_code) or (chapter_id, period_label)"
  - id: ERR_ROUNDING_CAPACITY_EXCEEDED
    http: 409
    condition: "a third OPEN rounding session of the same round_type would intersect on the same unit"
  - id: ERR_CLARIFICATION_LIMIT_EXCEEDED
    http: 409
    condition: "decision=CLARIFICATION_REQUESTED when clarification_round_count already equals MAX_CLARIFICATION_ROUNDS"
  - id: ERR_LEADERSHIP_SIGNOFF_REQUIRED
    http: 422
    condition: "an ESC submission with leadership_signoff false"
  - id: ERR_NO_OBSERVATIONS_RECORDED
    http: 422
    condition: "action=COMPLETE on a tracer with zero observations"
  - id: ERR_DUPLICATE_OWNER_ASSIGNMENT
    http: 409
    condition: "the owner_user_id already has an ACTIVE OwnerAssignment on that standard"
  - id: ERR_SUBMITTER_NOT_STANDARD_OWNER
    http: 422
    condition: "the ESC submitter is not an ACTIVE PRIMARY owner of the finding's standard"
  - id: ERR_STANDARD_UNMAPPED
    http: 422
    condition: "action=SUBMIT while the standard is UNMAPPED, or the submitter holds no ACTIVE OwnerAssignment on it"
  - id: ERR_STANDARD_CHAPTER_MISMATCH
    http: 422
    condition: "a referenced standard_id does not belong to the chapter in scope (PPR path chapter, or the tracer's chapter_id)"
  - id: ERR_CHAPTER_NOT_MAPPED
    http: 422
    condition: "scheduling a tracer for a chapter whose mapped_standard_count is 0"

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: AccreditationDirector
    description: "Owns the standards-to-owner map, the accreditation calendar, the survey command center and the periodic performance review cycle"
    identity: "opaque"
    exclusive_operations:
      - "POST /accreditation/chapters"
      - "POST /accreditation/chapters/{id}/standards"
      - "POST /accreditation/standards/{id}/owner-assignments"
      - "POST /accreditation/owner-assignments/{id}/revoke"
      - "POST /accreditation/units"
      - "POST /accreditation/survey-windows"
      - "POST /accreditation/survey-windows/{id}/transition"
      - "POST /accreditation/chapters/{id}/ppr-self-assessments"
      - "POST /accreditation/ppr-self-assessments/{id}/revise"
      - "POST /accreditation/ppr-self-assessments/{id}/attest"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /accreditation/mock-tracers (shared with TracerSurveyor)"
      - "all GET endpoints"
  - name: StandardOwner
    description: "Accountable owner of one or more standards; files evidence and authors evidence-of-standards-compliance submissions"
    identity: "opaque"
    exclusive_operations:
      - "POST /accreditation/standards/{id}/evidence-items"
      - "POST /accreditation/evidence-items/{id}/transition (action=SUBMIT)"
      - "POST /accreditation/survey-findings/{id}/esc-submissions"
    shared_operations:
      - "POST /accreditation/evidence-items/{id}/transition (endpoint shared with EvidenceValidator)"
      - "all GET endpoints"
  - name: EvidenceValidator
    description: "Independent reviewer who validates or rejects filed evidence; may never review a standard they own"
    identity: "opaque"
    exclusive_operations:
      - "POST /accreditation/evidence-items/{id}/transition (actions VALIDATE, REJECT)"
    shared_operations:
      - "POST /accreditation/evidence-items/{id}/transition (endpoint shared with StandardOwner)"
      - "all GET endpoints"
  - name: TracerSurveyor
    description: "Runs the mock tracer program: schedules tracers, records standard-level observations and closes them out for scoring"
    identity: "opaque"
    exclusive_operations:
      - "POST /accreditation/mock-tracers/{id}/transition"
      - "POST /accreditation/mock-tracers/{id}/observations"
    shared_operations:
      - "POST /accreditation/mock-tracers (shared with AccreditationDirector)"
      - "all GET endpoints"
  - name: SafetyOfficer
    description: "Performs life safety and environment-of-care rounding, tickets deficiencies and verifies remediation"
    identity: "opaque"
    exclusive_operations:
      - "POST /accreditation/rounding-sessions"
      - "POST /accreditation/rounding-sessions/{id}/deficiencies"
      - "POST /accreditation/rounding-sessions/{id}/close"
      - "POST /accreditation/deficiency-tickets/{id}/transition (actions VERIFY, FAIL_VERIFICATION, ESCALATE)"
    shared_operations:
      - "POST /accreditation/deficiency-tickets/{id}/transition (endpoint shared with UnitManager)"
      - "all GET endpoints"
  - name: UnitManager
    description: "Unit-scoped remediation role; may only progress remediation work on its own unit's tickets"
    identity: "entity_backed:HospitalUnit"
    exclusive_operations: []
    shared_operations:
      - "POST /accreditation/deficiency-tickets/{id}/transition (actions START_WORK, MARK_REMEDIATED only, and only for tickets whose rounding session belongs to the unit named by X-User-ID)"
      - "all GET endpoints"
  - name: ExternalSurveyor
    description: "Accrediting-body surveyor: records findings during an active survey, escalates condition-level findings and rules on ESC submissions"
    identity: "opaque"
    exclusive_operations:
      - "POST /accreditation/survey-windows/{id}/findings"
      - "POST /accreditation/survey-findings/{id}/escalate"
      - "POST /accreditation/survey-findings/{id}/esc-review"
    shared_operations:
      - "all GET endpoints"
