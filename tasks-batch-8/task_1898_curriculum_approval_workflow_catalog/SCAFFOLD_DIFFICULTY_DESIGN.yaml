            - { call: "POST /curriculum/courses", payload: { subject_code: "MATH", course_number: "210", title: "M", credit_hours: 3, contact_hours_per_week: 3, out_of_class_hours_per_week: 6, learning_outcomes: ["x"], owning_department_id: "${dept_math}", introduced_in_term_id: "${t1}" }, as: Registrar, as_user_id: "reg-1", captures: { course_m: $.data.id } }
            - { call: "POST /curriculum/courses", payload: { subject_code: "CS", course_number: "302", title: "D", credit_hours: 4, contact_hours_per_week: 4, out_of_class_hours_per_week: 5, learning_outcomes: ["x"], owning_department_id: "${dept_cs}", introduced_in_term_id: "${t1}" }, as: Registrar, as_user_id: "reg-1", captures: { course_d: $.data.id } }
            - { call: "POST /curriculum/cross-listings", payload: { home_course_id: "${course_c}", partner_course_id: "${course_m}" }, as: DepartmentChair, as_user_id: "${dept_cs}" }
            - { call: "POST /curriculum/proposals", payload: { proposal_type: "COURSE_CHANGE", proposer_department_id: "${dept_cs}", requested_effective_term_id: "${t1}", target_course_id: "${course_c}", proposed_subject_code: "CS", proposed_course_number: "301", proposed_title: "C v2", proposed_credit_hours: 3, contact_hours_per_week: 3, out_of_class_hours_per_week: 6, learning_outcomes: ["x2"], justification: "rebalance" }, as: FacultyProposer, as_user_id: "fac-001", captures: { pa: $.data.id } }
            - { call: "POST /curriculum/proposals", payload: { proposal_type: "COURSE_CHANGE", proposer_department_id: "${dept_cs}", requested_effective_term_id: "${t1}", target_course_id: "${course_d}", proposed_subject_code: "CS", proposed_course_number: "302", proposed_title: "D v2", proposed_credit_hours: 3, contact_hours_per_week: 3, out_of_class_hours_per_week: 6, learning_outcomes: ["x2"], justification: "rebalance" }, as: FacultyProposer, as_user_id: "fac-001", captures: { pb: $.data.id } }
            - { call: "POST /curriculum/proposals/${pa}/submit", payload: {}, as: FacultyProposer, as_user_id: "fac-001", captures: { pa_prov_score: $.data.substantive_change_score, pa_prov_flag: $.data.accreditor_notification_required } }
            - { call: "POST /curriculum/proposals/${pb}/submit", payload: {}, as: FacultyProposer, as_user_id: "fac-001" }
            - { call: "POST /curriculum/proposals/${pa}/decisions", payload: { action: "APPROVE" }, as: DepartmentChair, as_user_id: "${dept_cs}" }
            - { call: "POST /curriculum/proposals/${pa}/decisions", payload: { action: "APPROVE" }, as: CurriculumCommittee, as_user_id: "cc-1" }
            - { call: "POST /curriculum/proposals/${pa}/decisions", payload: { action: "APPROVE" }, as: FacultySenate, as_user_id: "sen-1", captures: { pa_final_score: $.data.substantive_change_score, pa_final_flag: $.data.accreditor_notification_required } }
          trigger:
