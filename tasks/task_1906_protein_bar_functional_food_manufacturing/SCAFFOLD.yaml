  roles:
  - QualityManager
  code: 200
  input: []
  output: IngredientLot
  side_effects:
  - -> REJECTED; CASCADE-REJECT chain (see IngredientLot state machine)
- method: POST
  path: /mfg/customers
  description: Register a brand customer
  roles:
  - PlantAdmin
  code: 201
  input:
  - name
  - contact_email
  - status?
  output: BrandCustomer
  side_effects: []
- method: GET
  path: /mfg/customers
  description: List brand customers
  roles:
  - PlantAdmin
  - FormulationScientist
  - QualityManager
  - ProductionPlanner
  - LabTechnician
  code: 200
  input:
  - status?
  - limit?
  - offset?
  output: BrandCustomer[]
  side_effects: []
- method: GET
  path: /mfg/customers/{id}
  description: Read one brand customer
  roles:
  - PlantAdmin
