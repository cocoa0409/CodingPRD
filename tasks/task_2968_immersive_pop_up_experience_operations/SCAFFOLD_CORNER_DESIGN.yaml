  # ===========================================================================
  - section: errors
    source_table: "SCAFFOLD.yaml table 6 (errors), 82 ids"
    instances:

      - name: run_creation_eligibility_errors_are_each_reachable
        claim_type: error_triggerability
        grounds:
          - errors[ERR_CITY_NOT_IN_TERRITORY]
          - errors[ERR_KIT_CONDITION_BELOW_THRESHOLD]
          - errors[ERR_AGREEMENT_NOT_ACTIVE]
          - validations[priority 140]
        distinguishing_aspect: |
          POST /experience-runs is the busiest gate in the API: it carries three body FKs and is the
          only reachable trigger for two P140 ids that nothing else can produce - the territory check
          and the kit condition check. Both are invisible in the request itself, since the city lives
          on the venue and the condition on the kit, and both sit BELOW the P80 agreement-state check,
          so a run that is wrong in every way must still report the agreement state first. An
          implementation that validates the kit before the agreement, or that compares the agreement's
          territory against the run name or the licensor rather than the venue's city_code, produces
          the wrong id for a request that is genuinely refusable three ways.
        test_recipe:
          setup:
            - "One venue in NYC with an ISSUED permit."
            - "Three agreements: agr_nyc (ACTIVE, territory_city_codes ['NYC']), agr_lax (ACTIVE, territory_city_codes ['LAX']) and agr_draft (never activated, territory_city_codes ['LAX'])."
            - "Two kits: kit_good with condition_score 100.00 and kit_weak created with initial_condition_score 55.00, which is below the REFURB_THRESHOLD of 60.00. Both are READY and LOCALIZED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueOpsManager
              as_user_id: "vom-1"
            - call: "POST /venues"
              payload: { city_code: "NYC", site_name: "Pier 9 Shed", lease_start_date: "2026-08-01", lease_end_date: "2027-01-31", base_monthly_rent_cents: 4500000, buildout_allowance_cents: 1500000, buildout_cap_cents: 3000000, requested_occupancy_load: 180, egress_width_cm: 400, sprinklered: true }
              as: VenueOpsManager
              as_user_id: "vom-1"
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/permit-submissions"
              payload: { package_note: "assembly occupancy package" }
              as: VenueOpsManager
              as_user_id: "vom-1"
            - call: "POST /venues/${venue_id}/permit-decisions"
              payload: { decision: "ISSUED", note: "occupancy 180 granted" }
              as: SafetyOfficer
              as_user_id: "officer-1"
            - call: "POST /build-kits"
              payload: { kit_code: "KIT-P9B-001", module_count: 20, initial_condition_score: 100.00, localization_language: "en-US" }
              as: VenueOpsManager
              as_user_id: "vom-1"
              captures: { kit_good: $.data.id }
            - call: "POST /build-kits"
              payload: { kit_code: "KIT-P9B-002", module_count: 20, initial_condition_score: 55.00, localization_language: "en-US" }
              as: VenueOpsManager
              as_user_id: "vom-1"
              captures: { kit_weak: $.data.id }
            - call: "POST /license-agreements"
              payload: { licensor_name: "Halcyon Studios", ip_title: "Neon Atrium", licensor_rep_user_id: "rep-1", royalty_rate_bps: 1250, merch_royalty_rate_bps: 750, minimum_guarantee_cents: 192790, approval_scopes: ["CREATIVE_EXECUTION"], territory_city_codes: ["NYC"], term_start_date: "2026-08-01", term_end_date: "2026-12-31" }
              as: LicensingManager
              as_user_id: "lm-1"
              captures: { agr_nyc: $.data.id }
            - call: "POST /license-agreements/${agr_nyc}/activate"
              payload: {}
              as: LicensingManager
              as_user_id: "lm-1"
            - call: "POST /license-agreements"
              payload: { licensor_name: "Halcyon Studios", ip_title: "Neon Atrium West", licensor_rep_user_id: "rep-1", royalty_rate_bps: 1250, merch_royalty_rate_bps: 750, minimum_guarantee_cents: 192790, approval_scopes: ["CREATIVE_EXECUTION"], territory_city_codes: ["LAX"], term_start_date: "2026-08-01", term_end_date: "2026-12-31" }
              as: LicensingManager
              as_user_id: "lm-1"
              captures: { agr_lax: $.data.id }
            - call: "POST /license-agreements/${agr_lax}/activate"
              payload: {}
              as: LicensingManager
              as_user_id: "lm-1"
            - call: "POST /license-agreements"
              payload: { licensor_name: "Halcyon Studios", ip_title: "Neon Atrium Draft", licensor_rep_user_id: "rep-1", royalty_rate_bps: 1250, merch_royalty_rate_bps: 750, minimum_guarantee_cents: 192790, approval_scopes: ["CREATIVE_EXECUTION"], territory_city_codes: ["LAX"], term_start_date: "2026-08-01", term_end_date: "2026-12-31" }
              as: LicensingManager
              as_user_id: "lm-1"
              captures: { agr_draft: $.data.id }
          trigger:
            - call: "POST /experience-runs"
              payload: { venue_id: "${venue_id}", license_agreement_id: "${agr_lax}", build_kit_id: "${kit_good}", run_name: "Neon Atrium NYC on a West Coast licence", scheduled_open_date: "2026-08-10", scheduled_close_date: "2026-10-31", base_ticket_price_cents: 35833, timed_slot_minutes: 45, max_group_size: 12 }
              as: ExperienceProducer
              as_user_id: "producer-1"
            - call: "POST /experience-runs"
              payload: { venue_id: "${venue_id}", license_agreement_id: "${agr_nyc}", build_kit_id: "${kit_weak}", run_name: "Neon Atrium NYC on a worn kit", scheduled_open_date: "2026-08-10", scheduled_close_date: "2026-10-31", base_ticket_price_cents: 35833, timed_slot_minutes: 45, max_group_size: 12 }
              as: ExperienceProducer
              as_user_id: "producer-1"
            - call: "POST /experience-runs"
              payload: { venue_id: "${venue_id}", license_agreement_id: "${agr_draft}", build_kit_id: "${kit_weak}", run_name: "Neon Atrium NYC wrong three ways", scheduled_open_date: "2026-08-10", scheduled_close_date: "2026-10-31", base_ticket_price_cents: 35833, timed_slot_minutes: 45, max_group_size: 12 }
              as: ExperienceProducer
              as_user_id: "producer-1"
            - call: "POST /experience-runs"
              payload: { venue_id: "${venue_id}", license_agreement_id: "${agr_nyc}", build_kit_id: "eeeeeeee-1111-4111-8111-eeeeeeeeeeee", run_name: "Neon Atrium NYC on a phantom kit", scheduled_open_date: "2026-08-10", scheduled_close_date: "2026-10-31", base_ticket_price_cents: 35833, timed_slot_minutes: 45, max_group_size: 12 }
              as: ExperienceProducer
              as_user_id: "producer-1"
            - call: "POST /experience-runs"
              payload: { venue_id: "${venue_id}", license_agreement_id: "${agr_nyc}", build_kit_id: "${kit_good}", run_name: "Neon Atrium NYC", scheduled_open_date: "2026-08-10", scheduled_close_date: "2026-10-31", base_ticket_price_cents: 35833, timed_slot_minutes: 45, max_group_size: 12 }
              as: ExperienceProducer
              as_user_id: "producer-1"
              captures: { run_id: $.data.id }
            - call: "GET /experience-runs"
              payload: { venue_id: "${venue_id}" }
              as: ExperienceProducer
              as_user_id: "producer-1"
            - call: "GET /build-kits"
              payload: { status: "READY" }
              as: VenueOpsManager
              as_user_id: "vom-1"
          assert:
            - "trigger 1 responds 409 with data.error_id == ERR_CITY_NOT_IN_TERRITORY: the venue's city_code NYC is absent from agr_lax.territory_city_codes ['LAX'], and nothing in the request body says so"
            - "trigger 2 responds 409 with data.error_id == ERR_KIT_CONDITION_BELOW_THRESHOLD: condition_score 55.00 is below REFURB_THRESHOLD 60.00 even though the kit is READY, so this is not the P80 ERR_KIT_NOT_READY refusal"
            - "trigger 3 responds 409 with data.error_id == ERR_AGREEMENT_NOT_ACTIVE: the request is both outside the territory and on a worn kit, but the P80 state check outranks both P140 checks"
            - "trigger 4 responds 404 with data.error_id == ERR_KIT_NOT_FOUND: the P50 body-FK check outranks every P80 and P140 check on this endpoint"
            - "trigger 5 responds 201, proving the four refusals above were caused only by the field each assertion names"
            - "trigger 6 responds 200 with total_count == 1: none of the refused creates left a row behind"
            - "trigger 7 responds 200 with total_count == 1 - only kit_weak is still READY - because the accepted run moved kit_good to DEPLOYED while the refused creates changed no kit at all"

      - name: staff_and_inspection_input_errors_are_each_reachable
        claim_type: error_triggerability
        grounds:
          - errors[ERR_STAFF_INCIDENTS_ABOVE_MAX]
          - errors[ERR_SEVERITY_FINDINGS_MISMATCH]
          - validations[priority 120]
          - validations[priority 140]
        distinguishing_aspect: |
          Two ids that only exist because a second field contradicts the first. The incident cap is
          the one clearance criterion that is NOT folded into the readiness score even though the
          score already penalises incidents: at incident_count 3 the audit score is 81.00, comfortably
          past the 78.00 floor, so an implementation that gates on readiness alone clears a member the
          spec forbids and never emits this id. ERR_SEVERITY_FINDINGS_MISMATCH is its mirror on the
          inspection side - severity NONE with a positive findings_count is refused before any outcome
          is derived, so the FAIL/CONDITIONAL/PASS branch never runs and the row stays SCHEDULED.
        test_recipe:
          setup:
            - "The LIGHT CHAIN through run creation."
            - "One PERFORMER staff member created with incident_count 3 and both required certifications, then given a training record of training_score 90 with 4 completed rehearsals, which moves it CANDIDATE -> TRAINING and leaves readiness_score_audit at 81.00 (36.00 + 35.00 + 25.00 - 3 * 5.00)."
            - "One SCHEDULED EGRESS inspection on the run."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueOpsManager
              as_user_id: "vom-1"
            - call: "POST /venues"
              payload: { city_code: "NYC", site_name: "Pier 9 Shed", lease_start_date: "2026-08-01", lease_end_date: "2027-01-31", base_monthly_rent_cents: 4500000, buildout_allowance_cents: 1500000, buildout_cap_cents: 3000000, requested_occupancy_load: 180, egress_width_cm: 400, sprinklered: true }
              as: VenueOpsManager
              as_user_id: "vom-1"
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/permit-submissions"
              payload: { package_note: "assembly occupancy package" }
              as: VenueOpsManager
              as_user_id: "vom-1"
            - call: "POST /venues/${venue_id}/permit-decisions"
              payload: { decision: "ISSUED", note: "occupancy 180 granted" }
              as: SafetyOfficer
              as_user_id: "officer-1"
            - call: "POST /build-kits"
              payload: { kit_code: "KIT-P9B-001", module_count: 20, initial_condition_score: 100.00, localization_language: "en-US" }
              as: VenueOpsManager
              as_user_id: "vom-1"
              captures: { kit_id: $.data.id }
            - call: "POST /license-agreements"
              payload: { licensor_name: "Halcyon Studios", ip_title: "Neon Atrium", licensor_rep_user_id: "rep-1", royalty_rate_bps: 1250, merch_royalty_rate_bps: 750, minimum_guarantee_cents: 192790, approval_scopes: ["CREATIVE_EXECUTION"], territory_city_codes: ["NYC"], term_start_date: "2026-08-01", term_end_date: "2026-12-31" }
              as: LicensingManager
              as_user_id: "lm-1"
              captures: { agreement_id: $.data.id }
            - call: "POST /license-agreements/${agreement_id}/activate"
              payload: {}
              as: LicensingManager
              as_user_id: "lm-1"
            - call: "POST /experience-runs"
              payload: { venue_id: "${venue_id}", license_agreement_id: "${agreement_id}", build_kit_id: "${kit_id}", run_name: "Neon Atrium NYC", scheduled_open_date: "2026-08-10", scheduled_close_date: "2026-10-31", base_ticket_price_cents: 35833, timed_slot_minutes: 45, max_group_size: 12 }
              as: ExperienceProducer
              as_user_id: "producer-1"
              captures: { run_id: $.data.id }
            - call: "POST /staff-members"
              payload: { run_id: "${run_id}", full_name: "Rafe Villanueva", staff_role: "PERFORMER", certifications: ["SCRIPTED_INTERACTION", "SENSORY_DEESCALATION"], incident_count: 3 }
              as: ExperienceProducer
              as_user_id: "producer-1"
              captures: { staff_id: $.data.id }
            - call: "POST /staff-members/${staff_id}/training-records"
              payload: { training_score: 90, completed_rehearsal_count: 4 }
              as: ExperienceProducer
              as_user_id: "producer-1"
            - call: "POST /safety-inspections"
              payload: { run_id: "${run_id}", inspection_type: "EGRESS", scheduled_for_utc: "2026-08-05T09:00:00Z" }
              as: SafetyOfficer
              as_user_id: "officer-1"
              captures: { insp_id: $.data.id }
          trigger:
            - call: "GET /staff-members/${staff_id}"
              payload: {}
              as: ExperienceProducer
              as_user_id: "producer-1"
            - call: "POST /staff-members/${staff_id}/status-decisions"
              payload: { decision: "CLEAR", note: "rehearsals complete" }
              as: ExperienceProducer
              as_user_id: "producer-1"
            - call: "POST /safety-inspections/${insp_id}/finalize"
              payload: { measured_egress_width_cm: 400, findings_count: 2, severity: "NONE" }
              as: SafetyOfficer
              as_user_id: "officer-1"
            - call: "POST /safety-inspections/${insp_id}/finalize"
              payload: { measured_egress_width_cm: 400, findings_count: 0, severity: "NONE" }
              as: SafetyOfficer
              as_user_id: "officer-1"
            - call: "GET /safety-inspections/${insp_id}"
              payload: {}
              as: SafetyOfficer
              as_user_id: "officer-1"
          assert:
            - "trigger 1 responds 200 with status TRAINING, incident_count 3, cert_coverage_pct 100.00, readiness_score_audit 81.00 and readiness_score_preflight 81.00: the member is ABOVE the 78.00 readiness floor"
            - "trigger 2 responds 409 with data.error_id == ERR_STAFF_INCIDENTS_ABOVE_MAX and NOT ERR_STAFF_READINESS_BELOW_MIN, because 3 exceeds INCIDENT_CLEAR_MAX 2 while the score itself is passing"
            - "trigger 2 is inert: the member is still TRAINING with version unchanged, so the run's approval-plus-staffing gate is untouched"
            - "trigger 3 responds 409 with data.error_id == ERR_SEVERITY_FINDINGS_MISMATCH: severity NONE with findings_count 2 contradicts itself, and the refusal precedes outcome derivation"
            - "trigger 3 is inert: the inspection is still SCHEDULED with outcome null, measured_egress_width_cm 0 and severity NONE, and the run's clearance_status is unchanged"
            - "trigger 4 responds 200 with outcome PASS: the same call with findings_count 0 is accepted, proving findings_count was the only defect"
            - "trigger 5 responds 200 with status FINALIZED, findings_count 0, severity NONE, outcome PASS and allowed_occupancy_cap 197"

      - name: revision_round_cap_error_is_reachable_only_on_the_fourth_resubmit
        claim_type: error_triggerability
        grounds:
          - errors[ERR_REVISION_ROUND_CAP]
          - state_machines.CreativeSubmission
          - validations[priority 140]
        distinguishing_aspect: |
          ERR_REVISION_ROUND_CAP is reachable only after three full negotiation laps, so it is the id
          most likely to be declared and never implemented. The cap is an off-by-one trap in both
          directions: revision_round starts at 0 and the precondition is revision_round <
          REVISION_ROUND_CAP, so the THIRD resubmit must still be accepted (leaving revision_round 3)
          and only the fourth is refused. The refusal must also leave the submission in
          CHANGES_REQUESTED rather than dead, because superseding it with a fresh row is the only
          legitimate escape and that new row starts its own count at 0.
        test_recipe:
          setup:
            - "The LIGHT CHAIN through run creation, plus one CreativeSubmission on the run with scope CREATIVE_EXECUTION and asset_code ATRIUM-SCRIPT-01, status SUBMITTED and revision_round 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueOpsManager
              as_user_id: "vom-1"
            - call: "POST /venues"
              payload: { city_code: "NYC", site_name: "Pier 9 Shed", lease_start_date: "2026-08-01", lease_end_date: "2027-01-31", base_monthly_rent_cents: 4500000, buildout_allowance_cents: 1500000, buildout_cap_cents: 3000000, requested_occupancy_load: 180, egress_width_cm: 400, sprinklered: true }
              as: VenueOpsManager
              as_user_id: "vom-1"
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/permit-submissions"
              payload: { package_note: "assembly occupancy package" }
              as: VenueOpsManager
              as_user_id: "vom-1"
            - call: "POST /venues/${venue_id}/permit-decisions"
              payload: { decision: "ISSUED", note: "occupancy 180 granted" }
              as: SafetyOfficer
              as_user_id: "officer-1"
            - call: "POST /build-kits"
              payload: { kit_code: "KIT-P9B-001", module_count: 20, initial_condition_score: 100.00, localization_language: "en-US" }
              as: VenueOpsManager
              as_user_id: "vom-1"
              captures: { kit_id: $.data.id }
            - call: "POST /license-agreements"
              payload: { licensor_name: "Halcyon Studios", ip_title: "Neon Atrium", licensor_rep_user_id: "rep-1", royalty_rate_bps: 1250, merch_royalty_rate_bps: 750, minimum_guarantee_cents: 192790, approval_scopes: ["CREATIVE_EXECUTION"], territory_city_codes: ["NYC"], term_start_date: "2026-08-01", term_end_date: "2026-12-31" }
              as: LicensingManager
              as_user_id: "lm-1"
              captures: { agreement_id: $.data.id }
            - call: "POST /license-agreements/${agreement_id}/activate"
              payload: {}
              as: LicensingManager
              as_user_id: "lm-1"
              captures: { agr_v: $.data.version }
            - call: "POST /experience-runs"
              payload: { venue_id: "${venue_id}", license_agreement_id: "${agreement_id}", build_kit_id: "${kit_id}", run_name: "Neon Atrium NYC", scheduled_open_date: "2026-08-10", scheduled_close_date: "2026-10-31", base_ticket_price_cents: 35833, timed_slot_minutes: 45, max_group_size: 12 }
              as: ExperienceProducer
              as_user_id: "producer-1"
              captures: { run_id: $.data.id }
            - call: "POST /creative-submissions"
              payload: { license_agreement_id: "${agreement_id}", run_id: "${run_id}", scope: "CREATIVE_EXECUTION", asset_code: "ATRIUM-SCRIPT-01", title: "Atrium scripted beat sheet", expected_agreement_version: "${agr_v}" }
              as: ExperienceProducer
              as_user_id: "producer-1"
              captures: { submission_id: $.data.id }
          trigger:
            - call: "POST /creative-submissions/${submission_id}/start-review"
              payload: {}
              as: LicensorRep
