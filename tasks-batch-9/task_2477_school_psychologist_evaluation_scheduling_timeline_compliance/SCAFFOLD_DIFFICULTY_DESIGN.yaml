          Entity pair is TimelineExclusion (the entity being written) depending on Referral.status (a
          grandparent reached through Evaluation.referral_id). The write is legal in every respect that
          concerns its own row and its direct parent's ownership — the psychologist_id is deliberately
          RETAINED by the withdrawal cascade so the priority-6 ownership check passes — and fails purely
          because a third entity moved state.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; one building; one ACTIVE SSP psychologist."
            - "One INITIAL 1-domain referral consented at 2026-08-01T09:00:00Z and ASSIGNED to that psychologist."
