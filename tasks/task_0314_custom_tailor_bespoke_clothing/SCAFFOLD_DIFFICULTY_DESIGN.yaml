            - "GarmentOrder.${o5_id}.status == REMAKE"
            - "GarmentOrder.${o5_id}.remake_round == 1"
            # C: customer credited remake_compensation round1 = 5000; risk recomputed
            - "Customer.${c5_id}.store_credit_cents == 5000"
            - "Customer.${c5_id}.remake_count == 1"
            # C: fabric re-reserved a fresh 7m cut -> 100 - 7 (confirm) - 7 (remake) = 86
            - "Fabric.${f5_id}.bolt_meters_remaining == 86"

