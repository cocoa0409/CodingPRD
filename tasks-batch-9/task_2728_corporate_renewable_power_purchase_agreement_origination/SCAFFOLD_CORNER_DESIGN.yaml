      - name: allocation_confirm_twice_second_attempt_rejected
        claim_type: idempotency
        grounds:
          - state_machines.DealAllocation.PROPOSED_to_CONFIRMED
          - validations.priority_8_ERR_INVALID_STATE_TRANSITION
          - endpoints.POST_/ppa/allocations/{id}/decision
        distinguishing_aspect: |
          There is no CONFIRMED -> CONFIRMED edge, so replaying a confirmation is a 409
          and not an idempotent 200. This matters because CONFIRM is what moves
          Deal.confirmed_allocated_mw: a "harmless" repeat that re-ran the recompute
          could double-count the megawatts and let a 25 MW deal believe it is 50 MW
          subscribed. WITHDRAW, by contrast, IS declared from CONFIRMED and must work.
