          - endpoints.GET_/library/children/{id}
        distinguishing_aspect: "Immediate consistency: a GET issued right after the 201 returns every stored and computed field with no lag or partial visibility."
        test_recipe:
          setup: ["Bootstrap core; affiliate A operative."]
          setup_api_calls:
            - *c_sep
            - *prog
