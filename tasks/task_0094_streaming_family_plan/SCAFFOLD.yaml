scenario: "Streaming Family Plan: account Profile, parental controls (by rating/time), concurrent stream cap, ad/ad-free tier, offline download, family member invite, cross-device sync"
domain_name: streaming-family-plan
api_prefix: /

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: access_control_matrix
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - rate_threshold_triggers
    - derived_field_reconciliation
    - scheduled_actions

  entity_topology: flat
  # Peer entities linked by foreign keys. Account is a hub; Profile / Device /
  # StreamSession / Download / Invite / WatchProgress / ParentalControl / PlanChange
  # reference Account or each other by FK rather than nesting in URL paths.
  # SubscriptionPlan and Title are shared catalog/config referenced cross-aggregate.

  state_machine_shape: branching
  # Invite forks ACCEPTED vs DECLINED vs EXPIRED vs REVOKED with divergent
  # compensating side effects; Account billing has a SUSPENDED<->ACTIVE revert loop;
  # StreamSession and Download carry independent quota-bearing lifecycles.

  relationship_patterns:
    - one_to_many        # Account -> Profile / Device / Invite / PlanChange
    - cross_aggregate    # StreamSession references Title (catalog) + Profile + Device
    - polymorphic        # WatchProgress.last_device_id may reference any Device on the account

  role_model: peer_roles
  # AccountOwner owns the Account, billing, and family management; ProfileUser acts
  # within one Profile's parental-control envelope (streams/downloads/sync);
  # PlatformAdmin manages the shared catalog and the clock/test seam; Anonymous is
  # a token-bearing invitee with no persisted identity.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: SubscriptionPlan
    parent: null
    common_fields: false
    fields:
      - name: id
        type: string
        source: system
        description: server-minted UUID, identity only
      - name: created_at
        type: datetime
        source: system
        description: ISO 8601 UTC, three fractional digits
      - name: tier
        type: enum
        source: input
        description: plan tier identifier
        constraints: one of {AD_SUPPORTED, AD_FREE, PREMIUM}
      - name: monthly_fee_cents
        type: integer
        source: input
        description: full-period subscription fee in integer cents
        constraints: ">= 0"
      - name: max_profiles
        type: integer
        source: input
        description: maximum number of non-ARCHIVED Profiles allowed on an Account on this plan
        constraints: ">= 1"
      - name: concurrent_stream_cap
        type: integer
        source: input
        description: maximum number of ACTIVE StreamSessions allowed across the whole Account at once
        constraints: ">= 1"
      - name: max_registered_devices
        type: integer
        source: input
        description: maximum number of REGISTERED Devices on the Account
        constraints: ">= 1"
      - name: download_quota_per_profile
        type: integer
        source: input
        description: maximum number of {DOWNLOADING, READY} Downloads a single Profile may hold at once
        constraints: ">= 0"
      - name: ad_free
        type: boolean
        source: input
        description: true when playback on this plan never serves ads (AD_FREE, PREMIUM); false for AD_SUPPORTED
      - name: hd_offline_allowed
        type: boolean
        source: input
        description: true when Downloads may be requested at HD quality (PREMIUM only)

  - name: Title
    parent: null
    common_fields: false
    fields:
      - name: id
        type: string
        source: system
        description: server-minted UUID, identity only
      - name: created_at
        type: datetime
        source: system
        description: ISO 8601 UTC, three fractional digits
      - name: name
        type: string
        source: input
        description: catalog display name
      - name: maturity_rating
        type: enum
        source: input
        description: content maturity rating; ordered G < PG < PG13 < R < NC17
        constraints: one of {G, PG, PG13, R, NC17}
      - name: runtime_minutes
        type: integer
        source: input
        description: total runtime of the title in whole minutes
        constraints: ">= 1"
      - name: downloadable
        type: boolean
        source: input
        description: whether this title may be downloaded for offline viewing
        default: true
      - name: license_size_mb
        type: integer
        source: input
        description: storage footprint of an SD offline download in whole megabytes
        constraints: ">= 1"

  - name: Account
    parent: null
    common_fields: true
    fields:
      - name: plan_id
        type: string
        source: input
        description: "FK -> SubscriptionPlan.id; the plan whose caps this Account is currently bound to"
      - name: owner_email
        type: string
        source: input
        description: email of the AccountOwner; unique among non-CLOSED Accounts
      - name: status
        type: enum
        source: system
        description: account lifecycle state
        default: ACTIVE
        constraints: one of {ACTIVE, SUSPENDED, CLOSED}
      - name: billing_anchor_day
        type: integer
        source: input
        description: day-of-month (1..28) on which each billing period opens
        constraints: 1..28
      - name: wallet_credit_cents
        type: integer
        source: computed
        description: account-level prepaid credit balance in cents; debited/credited by invoice, reactivation, and invite holds
        default: 0
      - name: billing_status
        type: enum
        source: system
        description: state of the Account's current billing period
        default: OPEN
        constraints: one of {OPEN, INVOICED}
      - name: period_charge_cents
        type: integer
        source: computed
        description: plan fee accrued for the current period, prorated by mid-period PlanChanges via cycle_charge (recomputed on each PlanChange; finalized on invoice)
        default: 0
      - name: proration_adjustment_cents
        type: integer
        source: computed
        description: signed adjustment vs one flat period of the current plan (positive upgrade catch-up, negative downgrade refund)
        default: 0
      - name: active_stream_count
        type: integer
        source: computed
        description: denormalized count of this Account's StreamSessions currently in ACTIVE state
        default: 0
      - name: registered_device_count
        type: integer
        source: computed
        description: denormalized count of this Account's Devices currently in REGISTERED state
        default: 0

  - name: Profile
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> Account.id; owning Account"
      - name: display_name
        type: string
        source: input
        description: profile display name; unique among non-ARCHIVED Profiles on the same Account
      - name: kind
        type: enum
        source: input
        description: profile classification; the kind sets the default rating ceiling
        constraints: one of {ADULT, TEEN, KID}
      - name: status
        type: enum
        source: system
        description: profile lifecycle
        default: ACTIVE
        constraints: one of {ACTIVE, ARCHIVED}
      - name: max_rating_allowed
        type: enum
        source: computed
        description: highest maturity_rating this profile may stream; derived from kind, tightened by any ParentalControl via rating_ceiling
        constraints: one of {G, PG, PG13, R, NC17}
      - name: daily_watch_minutes_used
        type: integer
        source: computed
        description: minutes of streaming consumed by this profile within the current clock-day; reset to 0 at UTC midnight rollover
        default: 0

  - name: ParentalControl
    parent: null
    common_fields: true
    fields:
      - name: profile_id
        type: string
        source: input
        description: "FK -> Profile.id; the profile this control envelope governs (at most one control row per profile)"
      - name: max_rating
        type: enum
        source: input
        description: explicit maximum maturity_rating allowed for the profile, combined with the kind default by rating_ceiling
        constraints: one of {G, PG, PG13, R, NC17}
      - name: daily_watch_limit_minutes
        type: integer
        source: input
        description: maximum streaming minutes per clock-day; 0 means unlimited
        constraints: ">= 0"
      - name: curfew_start_min
        type: integer
        source: input
        description: minutes-after-UTC-midnight when the nightly curfew window opens (inclusive)
        constraints: 0..1439
      - name: curfew_end_min
        type: integer
        source: input
        description: minutes-after-UTC-midnight when the nightly curfew window closes (exclusive); when end < start the window wraps past midnight
        constraints: 0..1439

  - name: Invite
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> Account.id; Account extending the invite"
      - name: invitee_email
        type: string
        source: input
        description: email address the invite was sent to
      - name: token
        type: string
        source: system
        description: single-use acceptance token minted on send
      - name: status
        type: enum
        source: system
        description: invite lifecycle
        default: PENDING
        constraints: one of {PENDING, ACCEPTED, DECLINED, EXPIRED, REVOKED}
      - name: expires_at
        type: datetime
        source: system
        description: instant after which the invite auto-expires; set to send-time + INVITE_TTL_HOURS
      - name: created_profile_id
        type: string
        source: system
        description: id of the Profile minted on acceptance (null until ACCEPTED); read from the accept response, not reverse-indexed
      - name: hold_amount_cents
        type: integer
        source: system
        description: per-seat fee debited as a hold against Account.wallet_credit_cents while PENDING; committed on ACCEPT, released on DECLINE/EXPIRE/REVOKE

  - name: Device
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> Account.id; Account the device is registered to"
      - name: device_label
        type: string
        source: input
        description: human label for the device
      - name: platform
        type: enum
        source: input
        description: device platform class
        constraints: one of {TV, MOBILE, WEB, TABLET}
      - name: status
        type: enum
        source: system
        description: device lifecycle
        default: REGISTERED
        constraints: one of {REGISTERED, DEREGISTERED}
      - name: supports_hd
        type: boolean
        source: input
        description: whether the device can play HD content
        default: true

  - name: StreamSession
    parent: null
    common_fields: true
    fields:
      - name: profile_id
        type: string
        source: input
        description: "FK -> Profile.id; profile under whose parental-control envelope the stream plays; the Account is this profile's account_id"
      - name: device_id
        type: string
        source: input
        description: "FK -> Device.id; device the stream plays on"
      - name: title_id
        type: string
        source: input
        description: "FK -> Title.id; title being streamed"
      - name: status
        type: enum
        source: system
        description: session lifecycle
        default: ACTIVE
        constraints: one of {ACTIVE, ENDED}
      - name: started_at_min
        type: integer
        source: system
        description: minutes-after-UTC-midnight at which the session started, captured from the system clock
      - name: minutes_watched
        type: integer
        source: computed
        description: minutes attributed to this session on stop/cascade; folded into Profile.daily_watch_minutes_used
        default: 0
      - name: ad_breaks_served
        type: integer
        source: computed
        description: number of ad breaks scheduled into this session at start; 0 on ad-free plans
        default: 0

  - name: Download
    parent: null
    common_fields: true
    fields:
      - name: profile_id
        type: string
        source: input
        description: "FK -> Profile.id; profile whose per-profile download quota this consumes; the Account is this profile's account_id"
      - name: device_id
        type: string
        source: input
        description: "FK -> Device.id; device the offline copy is licensed to"
      - name: title_id
        type: string
        source: input
        description: "FK -> Title.id; downloaded title"
      - name: status
        type: enum
        source: system
        description: download lifecycle
        default: DOWNLOADING
        constraints: one of {DOWNLOADING, READY, EXPIRED, DELETED}
      - name: quality
        type: enum
        source: input
        description: requested download quality
        default: SD
        constraints: one of {SD, HD}
      - name: license_expires_at
        type: datetime
        source: system
        description: instant after which the offline license auto-expires; stamped on completion to READY-time + DOWNLOAD_LICENSE_HOURS
      - name: size_mb
        type: integer
        source: computed
        description: realized storage footprint via download_size; Title.license_size_mb at SD, doubled at HD

  - name: WatchProgress
    parent: null
    common_fields: true
    fields:
      - name: profile_id
        type: string
        source: input
        description: "FK -> Profile.id; profile whose cross-device position this row tracks (at most one row per profile+title)"
      - name: title_id
        type: string
        source: input
        description: "FK -> Title.id; title the position is for"
      - name: position_min
        type: integer
        source: input
        description: last synced playback position in whole minutes
        constraints: ">= 0"
      - name: last_device_id
        type: string
        source: input
        description: id of the Device that last reported this position (provenance ref, validated to belong to the same Account; not reverse-indexed)
      - name: completed
        type: boolean
        source: computed
        description: true once position_min reaches Title.runtime_minutes
        default: false

  - name: PlanChange
    parent: null
    common_fields: false
    fields:
      - name: id
        type: string
        source: system
        description: server-minted UUID, identity only
      - name: created_at
        type: datetime
        source: system
        description: ISO 8601 UTC, three fractional digits; the change's effective instant within the billing period
      - name: account_id
        type: string
        source: input
        description: "FK -> Account.id; Account whose plan changed"
      - name: to_plan_id
        type: string
        source: input
        description: "FK -> SubscriptionPlan.id; plan in force after the change"
      - name: from_plan_id
        type: string
        source: system
        description: id of the plan in force before the change (snapshot of Account.plan_id at change time; not reverse-indexed)
      - name: direction
        type: enum
        source: computed
        description: change direction by monthly_fee_cents comparison of from-plan vs to-plan
        constraints: one of {UPGRADE, DOWNGRADE, LATERAL}

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: Account
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /accounts/{id}/suspend"
        actor: AccountOwner
        preconditions:
          - "account.status == ACTIVE"
          - "expected_account_version matches account.version"
        side_effects:
          - "every ACTIVE StreamSession on the Account is force-transitioned to ENDED (cascade down); each ended session folds its minutes_watched into its Profile.daily_watch_minutes_used"
          - "Account.active_stream_count recomputed to 0"
          - "increments Account.version by 1"
        note: "Suspension halts live playback but leaves Profiles, Devices, Downloads intact."
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /accounts/{id}/reactivate"
        actor: AccountOwner
        preconditions:
          - "account.status == SUSPENDED"
          - "Account.wallet_credit_cents >= currentPlan.monthly_fee_cents (reactivation requires one period of credit on hand)"
          - "expected_account_version matches account.version"
        side_effects:
          - "Account.wallet_credit_cents debited by currentPlan.monthly_fee_cents"
          - "increments Account.version by 1"
        note: "Branching revert loop: ACTIVE <-> SUSPENDED."
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /accounts/{id}/close"
        actor: AccountOwner
        preconditions:
          - "account.status == ACTIVE"
          - "expected_account_version matches account.version"
        side_effects:
          - "every ACTIVE StreamSession -> ENDED (cascade; folds minutes; active_stream_count -> 0)"
          - "every PENDING Invite -> REVOKED, each releasing its hold_amount_cents back to Account.wallet_credit_cents (cascade, compensating)"
          - "every {DOWNLOADING, READY} Download owned by any of the Account's Profiles -> DELETED (cascade)"
          - "if billing_status == OPEN, the current period is INVOICED (period_charge finalized via cycle_charge, wallet debited by net charge)"
          - "increments Account.version by 1"
      - from: SUSPENDED
        to: CLOSED
        trigger: "POST /accounts/{id}/close"
        actor: AccountOwner
        preconditions:
          - "account.status == SUSPENDED"
          - "expected_account_version matches account.version"
        side_effects:
          - "every PENDING Invite -> REVOKED, releasing hold_amount_cents (cascade, compensating)"
          - "every {DOWNLOADING, READY} Download owned by the Account's Profiles -> DELETED (cascade)"
          - "if billing_status == OPEN, the current period is INVOICED"
          - "increments Account.version by 1"

  - entity: Invite
    initial_state: PENDING
    terminal_states: [ACCEPTED, DECLINED, EXPIRED, REVOKED]
    transitions:
      - from: PENDING
        to: ACCEPTED
        trigger: "POST /invites/{id}/accept"
        actor: Anonymous
        preconditions:
          - "invite.status == PENDING"
          - "token in request body matches invite.token"
          - "current clock < invite.expires_at"
          - "Account.status == ACTIVE"
          - "non-ARCHIVED Profile count on the Account < currentPlan.max_profiles"
        side_effects:
          - "a new Profile (kind=ADULT, status=ACTIVE) is created on the Account; invite.created_profile_id set to it (cross-entity create)"
          - "invite.hold_amount_cents is committed (NOT released): it stays debited from Account.wallet_credit_cents as the seat fee"
        note: "Fork: ACCEPTED commits the hold; DECLINED/EXPIRED/REVOKED branches release it (divergent side-effect sets)."
      - from: PENDING
        to: DECLINED
        trigger: "POST /invites/{id}/decline"
        actor: Anonymous
        preconditions:
          - "invite.status == PENDING"
          - "token in request body matches invite.token"
        side_effects:
          - "invite.hold_amount_cents released back to Account.wallet_credit_cents (compensating)"
        note: "No Profile is created on this branch."
      - from: PENDING
        to: EXPIRED
        trigger: "POST /_clock/advance with run_sweeps=true crossing invite.expires_at (system sweep)"
        actor: system
        preconditions:
          - "invite.status == PENDING"
          - "current clock >= invite.expires_at"
        side_effects:
          - "invite.hold_amount_cents released back to Account.wallet_credit_cents (compensating)"
      - from: PENDING
        to: REVOKED
        trigger: "POST /invites/{id}/revoke (or Account close cascade)"
        actor: AccountOwner
        preconditions:
          - "invite.status == PENDING"
        side_effects:
          - "invite.hold_amount_cents released back to Account.wallet_credit_cents (compensating)"

  - entity: StreamSession
    initial_state: ACTIVE
    terminal_states: [ENDED]
    transitions:
      - from: (none)
        to: ACTIVE
        trigger: "POST /stream-sessions"
        actor: ProfileUser
        preconditions:
          - "Account (= Profile.account_id) status == ACTIVE"
          - "Profile.status == ACTIVE"
          - "Device.status == REGISTERED and Device.account_id == Profile.account_id"
          - "Title.maturity_rating <= Profile.max_rating_allowed (parental rating gate)"
          - "current clock minute is NOT inside the profile's curfew window, when a ParentalControl exists (parental time gate)"
          - "Profile.daily_watch_minutes_used + Title.runtime_minutes <= ParentalControl.daily_watch_limit_minutes, when a limit > 0 is set (parental daily-limit gate)"
          - "the target Device has NO other ACTIVE StreamSession whose projected interval [started_at_min, started_at_min + that session's Title.runtime_minutes) covers the new start minute (device single-occupancy overlap gate)"
          - "Account.active_stream_count < currentPlan.concurrent_stream_cap (concurrent cap gate)"
        side_effects:
          - "Account.active_stream_count incremented by 1 (derived-field reconciliation)"
          - "ad_breaks_served computed via ad_break_count calc (0 on ad-free plans)"
          - "started_at_min stamped from the system clock"
      - from: ACTIVE
        to: ENDED
        trigger: "POST /stream-sessions/{id}/stop"
        actor: ProfileUser
        preconditions:
          - "session.status == ACTIVE"
        side_effects:
          - "minutes_watched computed via watch_minutes_attributed and folded into Profile.daily_watch_minutes_used (cross-entity ledger sync)"
          - "Account.active_stream_count decremented by 1 (derived-field reconciliation)"
      - from: ACTIVE
        to: ENDED
        trigger: "system cascade from account suspend/close"
        actor: system
        preconditions:
          - "session.status == ACTIVE"
        side_effects:
          - "minutes_watched folded into Profile.daily_watch_minutes_used"
          - "Account.active_stream_count decremented by 1"

  - entity: Download
    initial_state: DOWNLOADING
    terminal_states: [EXPIRED, DELETED]
    transitions:
      - from: (none)
        to: DOWNLOADING
        trigger: "POST /downloads"
        actor: ProfileUser
        preconditions:
          - "Account (= Profile.account_id) status == ACTIVE"
          - "Profile.status == ACTIVE"
          - "Title.downloadable == true"
          - "Device.status == REGISTERED and Device.account_id == Profile.account_id"
          - "quality == HD requires currentPlan.hd_offline_allowed == true AND Device.supports_hd == true"
          - "Profile's count of {DOWNLOADING, READY} Downloads < currentPlan.download_quota_per_profile"
        side_effects:
          - "size_mb computed via download_size calc"
      - from: DOWNLOADING
        to: READY
        trigger: "POST /downloads/{id}/complete"
        actor: ProfileUser
        preconditions:
          - "download.status == DOWNLOADING"
        side_effects:
          - "license_expires_at stamped to current clock + DOWNLOAD_LICENSE_HOURS"
      - from: READY
        to: EXPIRED
        trigger: "POST /_clock/advance with run_sweeps=true crossing download.license_expires_at (system sweep)"
        actor: system
        preconditions:
          - "download.status == READY"
          - "current clock >= download.license_expires_at"
        side_effects:
          - "frees one slot of the Profile's download quota"
      - from: DOWNLOADING
        to: DELETED
        trigger: "DELETE /downloads/{id}"
        actor: ProfileUser
        preconditions:
          - "download.status in {DOWNLOADING, READY}"
        side_effects:
          - "frees one slot of the Profile's download quota"
      - from: READY
        to: DELETED
        trigger: "DELETE /downloads/{id}"
        actor: ProfileUser
        preconditions:
          - "download.status in {DOWNLOADING, READY}"
        side_effects:
          - "frees one slot of the Profile's download quota"

  - entity: Device
    initial_state: REGISTERED
    terminal_states: [DEREGISTERED]
    transitions:
      - from: (none)
        to: REGISTERED
        trigger: "POST /devices"
        actor: AccountOwner
        preconditions:
          - "Account.status == ACTIVE"
          - "Account.registered_device_count < currentPlan.max_registered_devices"
        side_effects:
          - "Account.registered_device_count incremented by 1 (derived-field reconciliation)"
      - from: REGISTERED
        to: DEREGISTERED
        trigger: "POST /devices/{id}/deregister"
        actor: AccountOwner
        preconditions:
          - "device.status == REGISTERED"
          - "no ACTIVE StreamSession references this Device (cross-entity precondition)"
        side_effects:
          - "Account.registered_device_count decremented by 1 (derived-field reconciliation)"
          - "every {DOWNLOADING, READY} Download licensed to this Device -> DELETED (cascade), each freeing a profile download slot"

  - entity: Profile
    initial_state: ACTIVE
    terminal_states: [ARCHIVED]
    transitions:
      - from: (none)
        to: ACTIVE
        trigger: "POST /profiles"
        actor: AccountOwner
        preconditions:
          - "Account.status == ACTIVE"
          - "non-ARCHIVED Profile count on the Account < currentPlan.max_profiles"
          - "display_name unique among non-ARCHIVED Profiles on the Account"
        side_effects:
          - "max_rating_allowed computed via rating_ceiling calc (from kind, no override yet)"
      - from: ACTIVE
        to: ARCHIVED
        trigger: "POST /profiles/{id}/archive"
        actor: AccountOwner
        preconditions:
          - "profile.status == ACTIVE"
          - "no ACTIVE StreamSession references this Profile (cross-entity precondition)"
        side_effects:
          - "every {DOWNLOADING, READY} Download owned by this Profile -> DELETED (cascade)"

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: plan-change-stale-account
    parent_entity: Account
    write_endpoint: "POST /accounts/{id}/plan-changes"
    occ_field: "expected_account_version"
    description: |
      Submitting a PlanChange against an Account whose version has advanced
      since the client last observed it is rejected. A PlanChange legitimately
      supersedes the Account's current plan binding and recomputes the period's
      proration; if another writer has already applied a plan change (advancing
      the Account version and rewriting period_charge_cents), the current
      writer's view of the Account — and of the plan it is moving away from — is
      stale and the new change must not silently stack on a superseded basis.
    error_id: ERR_STALE_ACCOUNT_VERSION
    http_status: 412

  - rule_id: invoice-stale-account
    parent_entity: Account
    write_endpoint: "POST /accounts/{id}/invoice"
    occ_field: "expected_account_version"
    description: |
      Invoicing the current OPEN billing period against an Account whose version
      has advanced since the client last observed it is rejected. Invoicing
      debits Account.wallet_credit_cents by the finalized net charge; if another
      writer has mutated the Account (e.g. applied a plan change that altered
      the proration, or reactivated and consumed credit) the invoice would
      settle against a stale charge basis, so the stale-version invoice is refused.
    error_id: ERR_STALE_ACCOUNT_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: cycle_charge
    trigger: "PlanChange creation (recompute) and Account billing INVOICE (POST /accounts/{id}/invoice; also fired by account close)"
    algorithm: chronological
    formula: |
      # The forward-looking-vs-chronological choice is intentionally pinned to CHRONOLOGICAL.
      # The current period spans PERIOD_DAYS whole days from period day 0.
      # Build segments by walking the period's PlanChanges in created_at ASC order
      # (tie-break: created_at, then PlanChange.id ASC only to stabilize equal-ms timestamps).
      # The Account's plan at period open is the first segment's plan; each PlanChange opens a
      # new segment from its effective day. A day belongs to the segment whose plan is in force
      # at that day's 00:00:00Z (half-open day boundaries).
      # daily_rate(plan) = plan.monthly_fee_cents / PERIOD_DAYS   (kept as an exact real, NOT rounded per day)
      # For each segment: segment_real = daily_rate(plan) * days_in_segment
      # period_charge_cents = round_half_up( SUM over segments of segment_real )   # SUM-THEN-ROUND (pinned)
      # proration_adjustment_cents = period_charge_cents - currentPlan.monthly_fee_cents
      #   (signed: positive when mid-period upgrades pushed the prorated total above one flat
      #    period of the final plan; negative on net downgrade)
      # net_charge_cents = period_charge_cents   (the adjustment is descriptive, already folded in)
    input_set: "PlanChanges with account_id == this Account and created_at within the current OPEN period; the Account's plan at period open"
    constants:
      PERIOD_DAYS: 30
    precision: "0 decimal places (integer cents), round_half_up; SUM the exact daily contributions THEN round ONCE at the end"
    variants:
      - name: single_plan_period
        when: "no PlanChange landed in the period"
        difference: "exactly one segment spanning the full period; period_charge_cents == round_half_up(monthly_fee_cents) == monthly_fee_cents; proration_adjustment_cents == 0"
      - name: mid_period_change
        when: "one or more PlanChanges landed in the period"
        difference: "multiple segments; total differs from a flat period fee; adjustment is the signed delta"

  - name: watch_minutes_attributed
    trigger: "StreamSession ACTIVE -> ENDED (POST /stream-sessions/{id}/stop, or suspend/close cascade)"
    algorithm: threshold
    formula: |
      # SAME-DAY (current_clock_minute_of_day >= session.started_at_min):
      #   elapsed = current_clock_minute_of_day - session.started_at_min
      # MIDNIGHT-CROSS (current_clock_minute_of_day < session.started_at_min):
      #   elapsed = (MINUTES_PER_DAY - session.started_at_min) + current_clock_minute_of_day
      # minutes_watched = min( max(elapsed, 0), Title.runtime_minutes )   # clamped to the title runtime
      # Fold into the profile (UNCAPPED — the daily limit is enforced ONLY at the start gate, never by truncating an attribution):
      #   Profile.daily_watch_minutes_used = old_used + minutes_watched
      # Rationale: a session can only start when the start gate already proved old_used + runtime <= limit (for limited profiles),
      # so the fold can never exceed the limit; truncation here is therefore neither needed nor applied.
    input_set: "the single ending StreamSession (its started_at_min, its Title.runtime_minutes) and the current clock minute-of-day"
    constants:
      MINUTES_PER_DAY: 1440
    precision: "integer minutes, no fractional accumulation"
    variants:
      - name: same_day_elapsed
        when: "the stop occurs on the same UTC clock-day as the start (current minute-of-day >= started_at_min)"
        difference: "elapsed = current_minute - started_at_min"
      - name: midnight_cross_elapsed
        when: "the stop occurs after a UTC-midnight rollover (current minute-of-day < started_at_min)"
        difference: "elapsed = (1440 - started_at_min) + current_minute; e.g. start 23:50 (1430), stop 00:10 (10) -> elapsed 20, not a negative number"

  - name: ad_break_count
    trigger: "StreamSession (none) -> ACTIVE (POST /stream-sessions)"
    algorithm: tiered_pricing
    formula: |
      # Ads are inserted at fixed cadence on ad-supported plans only.
      # if currentPlan.ad_free == true: ad_breaks_served = 0
      # else:
      #   pre_roll  = 1                                            # one ad break before playback
      #   mid_rolls = floor( Title.runtime_minutes / AD_CADENCE_MIN )   # STRICT floor
      #   ad_breaks_served = pre_roll + mid_rolls
      # Boundary: a runtime of exactly N*AD_CADENCE_MIN yields N mid-rolls; (N*AD_CADENCE_MIN - 1) yields N-1.
    input_set: "the starting StreamSession's Title.runtime_minutes and the Account's current plan ad_free flag"
    constants:
      AD_CADENCE_MIN: 30
    precision: "integer count"
    variants:
      - name: ad_free_zero
        when: "currentPlan.ad_free == true"
        difference: "ad_breaks_served == 0 regardless of runtime"
      - name: ad_supported_tiered
        when: "currentPlan.ad_free == false"
        difference: "1 + floor(runtime / AD_CADENCE_MIN)"

  - name: download_size
    trigger: "Download (none) -> DOWNLOADING (POST /downloads)"
    algorithm: aggregation
    formula: |
      # base = Title.license_size_mb
      # size_mb = base                 when quality == SD
      # size_mb = base * HD_MULTIPLIER when quality == HD
    input_set: "the single Download's Title.license_size_mb and requested quality"
    constants:
      HD_MULTIPLIER: 2
    precision: "integer megabytes"
    variants:
      - name: sd_passthrough
        when: "quality == SD"
        difference: "size_mb == license_size_mb"
      - name: hd_doubled
        when: "quality == HD"
        difference: "size_mb == license_size_mb * 2"

  - name: rating_ceiling
    trigger: "Profile creation; ParentalControl create/replace; read of Profile.max_rating_allowed"
    algorithm: threshold
    formula: |
      # Ordered rating scale: G(0) < PG(1) < PG13(2) < R(3) < NC17(4).
      # kind_default:  KID -> G,  TEEN -> PG13,  ADULT -> NC17
      # If a ParentalControl row exists for the profile:
      #   max_rating_allowed = MIN( kind_default, ParentalControl.max_rating )   # the stricter of the two wins
      # else:
      #   max_rating_allowed = kind_default
    input_set: "the Profile's kind and its ParentalControl.max_rating if present"
    constants:
      RATING_ORDER: "G<PG<PG13<R<NC17"
    precision: "ordinal comparison on the rating scale"
    variants:
      - name: kind_only
        when: "no ParentalControl row for the profile"
        difference: "ceiling is purely the kind default"
      - name: control_tightened
        when: "ParentalControl exists with a max_rating stricter than the kind default"
        difference: "ceiling drops to the stricter ParentalControl.max_rating (MIN wins); a more permissive control cannot raise a KID above G"

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (ordered by priority)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /invites/{id}/accept and POST /invites/{id}/decline (token-bearer, anonymous)"

  - priority: 2
    category: auth
    check: "acting role is permitted for the operation per §1.7"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: "for entity_backed roles, X-User-ID owns the targeted resource (AccountOwner owns the Account; ProfileUser owns the Profile referenced by the request)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "ownership-scoped endpoints"

  - priority: 4
    category: existence
    check: "every path/body resource id resolves to a stored entity, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 5
    category: state
    check: "target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 6
    category: state
    check: "OCC: expected_account_version equals Account.version on plan-change and invoice"
    error_id: ERR_STALE_ACCOUNT_VERSION
    http_status: 412
    applies_to: "POST /accounts/{id}/plan-changes, POST /accounts/{id}/invoice"

  - priority: 7
    category: business_referential
    check: "cross-account coherence: the Device referenced by a StreamSession/Download belongs to the same Account as the Profile; for watch-progress, last_device_id belongs to the Profile's Account (Title is global)"
    error_id: ERR_CROSS_ACCOUNT_REFERENCE
    http_status: 409
    applies_to: "POST /stream-sessions, POST /downloads, PUT /watch-progress"

  - priority: 8
    category: business_safety
    check: "parental rating gate: Title.maturity_rating <= Profile.max_rating_allowed"
    error_id: ERR_RATING_BLOCKED
    http_status: 403
    applies_to: "POST /stream-sessions"

  - priority: 9
    category: business_temporal
    check: "parental curfew gate: current clock-minute is not inside the profile's curfew window"
    error_id: ERR_CURFEW_BLOCKED
    http_status: 409
    applies_to: "POST /stream-sessions"

  - priority: 10
    category: business_temporal
    check: "parental daily-limit gate: daily_watch_minutes_used + Title.runtime_minutes <= daily_watch_limit_minutes (when limit > 0)"
    error_id: ERR_DAILY_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /stream-sessions"

  - priority: 11
    category: business_temporal
    check: "device single-occupancy overlap: the target Device has no other ACTIVE StreamSession whose projected interval [started_at_min, started_at_min + its Title.runtime_minutes) covers the new session's start minute (point-in-half-open-interval; a session starting exactly when another's interval ends does NOT collide)"
    error_id: ERR_DEVICE_BUSY
    http_status: 409
    applies_to: "POST /stream-sessions"

  - priority: 12
    category: business_constraint
    check: "HD download requires plan.hd_offline_allowed AND device.supports_hd"
    error_id: ERR_HD_NOT_ALLOWED
    http_status: 409
    applies_to: "POST /downloads"

  - priority: 13
    category: business_constraint
    check: "title.downloadable == true"
    error_id: ERR_TITLE_NOT_DOWNLOADABLE
    http_status: 409
    applies_to: "POST /downloads"

  - priority: 14
    category: business_constraint
    check: "uniqueness: display_name unique among non-ARCHIVED Profiles on the Account; owner_email unique among non-CLOSED Accounts; at most one ParentalControl per Profile; at most one WatchProgress per (profile,title)"
    error_id: ERR_DUPLICATE
    http_status: 409
    applies_to: "POST /profiles, POST /accounts, POST /profiles/{id}/parental-control, PUT /watch-progress"

  - priority: 15
    category: business_constraint
    check: "concurrent stream cap: Account.active_stream_count < plan.concurrent_stream_cap"
    error_id: ERR_CONCURRENT_CAP_REACHED
    http_status: 409
    applies_to: "POST /stream-sessions"

  - priority: 16
    category: business_constraint
    check: "profile download quota: count of {DOWNLOADING,READY} Downloads for the Profile < plan.download_quota_per_profile"
    error_id: ERR_DOWNLOAD_QUOTA_REACHED
    http_status: 409
    applies_to: "POST /downloads"

  - priority: 17
    category: business_constraint
    check: "profile cap: non-ARCHIVED Profile count < plan.max_profiles"
    error_id: ERR_PROFILE_CAP_REACHED
    http_status: 409
    applies_to: "POST /profiles, POST /invites/{id}/accept"

  - priority: 18
    category: business_constraint
    check: "device cap: Account.registered_device_count < plan.max_registered_devices"
    error_id: ERR_DEVICE_CAP_REACHED
    http_status: 409
    applies_to: "POST /devices"

  - priority: 19
    category: business_temporal
    check: "invite token valid and not expired at accept/decline time"
    error_id: ERR_INVITE_EXPIRED
    http_status: 409
    applies_to: "POST /invites/{id}/accept"

  - priority: 20
    category: business_fiscal
    check: "sufficient wallet credit: reactivation requires wallet_credit_cents >= one period fee; invite-send requires wallet_credit_cents >= the per-seat hold"
    error_id: ERR_INSUFFICIENT_CREDIT
    http_status: 402
    applies_to: "POST /accounts/{id}/reactivate, POST /invites"

  - priority: 21
    category: business_constraint
    check: "request body satisfies field-level schema (enums, ranges, required fields)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:
  # --- Catalog / configuration ---
  - method: POST
    path: "/subscription-plans"
    description: "create a subscription plan tier"
    roles: [PlatformAdmin]
    code: 201
    input: [tier, monthly_fee_cents, max_profiles, concurrent_stream_cap, max_registered_devices, download_quota_per_profile, ad_free, hd_offline_allowed]
    output: SubscriptionPlan
    side_effects: []
  - method: GET
    path: "/subscription-plans/{id}"
    description: "fetch a plan (single-resource read; collection-segment source)"
    roles: [PlatformAdmin, AccountOwner, ProfileUser]
    code: 200
    input: []
    output: SubscriptionPlan
    side_effects: []
  - method: GET
    path: "/subscription-plans/{id}/accounts"
    description: "list Accounts bound to this plan (reverse-reach for Account.plan_id)"
    roles: [PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: Account[]
    side_effects: []
  - method: GET
    path: "/subscription-plans/{id}/plan-changes"
    description: "list PlanChanges that moved an Account TO this plan (reverse-reach for PlanChange.to_plan_id)"
    roles: [PlatformAdmin, AccountOwner]
    code: 200
    input: ["limit?", "offset?"]
    output: PlanChange[]
    side_effects: []
  - method: POST
    path: "/titles"
    description: "create a catalog title"
    roles: [PlatformAdmin]
    code: 201
    input: [name, maturity_rating, runtime_minutes, "downloadable?", license_size_mb]
    output: Title
    side_effects: []
  - method: GET
    path: "/titles/{id}"
    description: "fetch a title (single-resource read; collection-segment source)"
    roles: [PlatformAdmin, AccountOwner, ProfileUser]
    code: 200
    input: []
    output: Title
    side_effects: []

  # --- Accounts (billing folded onto the Account) ---
  - method: POST
    path: "/accounts"
    description: "create a family-plan account on a plan; opens the first billing period"
    roles: [AccountOwner]
    code: 201
    input: [plan_id, owner_email, billing_anchor_day, "initial_credit_cents?"]
    output: Account
    side_effects: ["status ACTIVE", "billing_status OPEN", "wallet_credit_cents seeded to initial_credit_cents (default 0)", "period_charge_cents seeded to plan fee"]
  - method: GET
    path: "/accounts/{id}"
    description: "fetch an account with denormalized counters and billing fields (collection-segment source)"
    roles: [AccountOwner, PlatformAdmin]
    code: 200
    input: []
    output: Account
    side_effects: []
  - method: POST
    path: "/accounts/{id}/suspend"
    description: "suspend account; ends live streams"
    roles: [AccountOwner]
    code: 200
    input: [expected_account_version]
    output: Account
    side_effects: ["ACTIVE StreamSessions -> ENDED (cascade, folds minutes)", "active_stream_count -> 0", "increments Account.version by 1"]
  - method: POST
    path: "/accounts/{id}/reactivate"
    description: "reactivate a suspended account; debits one period of credit"
    roles: [AccountOwner]
    code: 200
    input: [expected_account_version]
    output: Account
    side_effects: ["wallet_credit_cents -= currentPlan.monthly_fee_cents", "increments Account.version by 1"]
  - method: POST
    path: "/accounts/{id}/close"
    description: "close account; cascades stream-end, invite-revoke, download-delete, and final invoice"
    roles: [AccountOwner]
    code: 200
    input: [expected_account_version]
    output: Account
    side_effects: ["cascade ENDED streams, REVOKED invites (release holds), DELETED downloads, INVOICE open period (debit wallet)", "increments Account.version by 1"]
  - method: POST
    path: "/accounts/{id}/invoice"
    description: "invoice the current OPEN billing period (OCC-guarded); finalizes proration and debits wallet"
    roles: [AccountOwner]
    code: 200
    input: [expected_account_version]
    output: Account
    side_effects: ["period_charge finalized via cycle_charge", "wallet_credit_cents -= net_charge", "billing_status -> INVOICED", "increments Account.version by 1"]

  # --- Plan changes (OCC-guarded) ---
  - method: POST
    path: "/accounts/{id}/plan-changes"
    description: "change the account's plan mid-period (OCC-guarded; reprorates the open period)"
    roles: [AccountOwner]
    code: 201
    input: [to_plan_id, expected_account_version]
    output: PlanChange
    side_effects: ["from_plan_id snapshot taken", "Account.plan_id = to_plan_id", "direction computed UPGRADE/DOWNGRADE/LATERAL", "Account.period_charge_cents + proration_adjustment_cents recomputed via cycle_charge", "increments Account.version by 1"]
  - method: GET
    path: "/accounts/{id}/plan-changes"
    description: "list PlanChanges for an account in created_at ASC order (reverse-reach for PlanChange.account_id)"
    roles: [AccountOwner, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: PlanChange[]
    side_effects: []

  # --- Profiles ---
  - method: POST
    path: "/profiles"
    description: "create a profile on an account"
    roles: [AccountOwner]
    code: 201
    input: [account_id, display_name, kind]
    output: Profile
    side_effects: ["max_rating_allowed computed via rating_ceiling"]
  - method: GET
    path: "/profiles/{id}"
    description: "fetch a profile with computed ceiling and usage (collection-segment source)"
    roles: [AccountOwner, ProfileUser, PlatformAdmin]
    code: 200
    input: []
    output: Profile
    side_effects: []
  - method: POST
    path: "/profiles/{id}/archive"
    description: "archive a profile; cascades download deletion"
    roles: [AccountOwner]
    code: 200
    input: []
    output: Profile
    side_effects: ["profile -> ARCHIVED", "owned {DOWNLOADING,READY} Downloads -> DELETED (cascade)"]
  - method: POST
    path: "/profiles/{id}/parental-control"
    description: "set or replace the parental control envelope for a profile"
    roles: [AccountOwner]
    code: 201
    input: [max_rating, daily_watch_limit_minutes, curfew_start_min, curfew_end_min]
    output: ParentalControl
    side_effects: ["Profile.max_rating_allowed recomputed via rating_ceiling (MIN with kind default)"]
  - method: GET
    path: "/profiles/{id}/parental-control"
    description: "fetch the parental control for a profile (sub-resource reverse-reach; array length 0 or 1)"
    roles: [AccountOwner, ProfileUser, PlatformAdmin]
    code: 200
    input: []
    output: ParentalControl[]
    side_effects: []
  - method: GET
    path: "/accounts/{id}/profiles"
    description: "list profiles on an account (reverse-reach for Profile.account_id)"
    roles: [AccountOwner, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Profile[]
    side_effects: []

  # --- Invites ---
  - method: POST
    path: "/invites"
    description: "send a family-member invite; places a per-seat hold on the wallet"
    roles: [AccountOwner]
    code: 201
    input: [account_id, invitee_email]
    output: Invite
    side_effects: ["token + expires_at minted", "hold_amount_cents debited as a hold on Account.wallet_credit_cents"]
  - method: GET
    path: "/accounts/{id}/invites"
    description: "list invites for an account (reverse-reach for Invite.account_id)"
    roles: [AccountOwner, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Invite[]
    side_effects: []
  - method: POST
    path: "/invites/{id}/accept"
    description: "accept an invite via token; mints an ADULT profile and commits the hold"
    roles: [Anonymous]
    code: 200
    input: [token]
    output: Invite
    side_effects: ["new Profile created; created_profile_id set", "hold committed (not released)"]
  - method: POST
    path: "/invites/{id}/decline"
    description: "decline an invite via token; releases the hold"
    roles: [Anonymous]
    code: 200
    input: [token]
    output: Invite
    side_effects: ["hold_amount_cents released to wallet (compensating)"]
  - method: POST
    path: "/invites/{id}/revoke"
    description: "owner revokes a pending invite; releases the hold"
    roles: [AccountOwner]
    code: 200
    input: []
    output: Invite
    side_effects: ["hold_amount_cents released to wallet (compensating)"]

  # --- Devices ---
  - method: POST
    path: "/devices"
    description: "register a device on the account"
    roles: [AccountOwner]
    code: 201
    input: [account_id, device_label, platform, "supports_hd?"]
    output: Device
    side_effects: ["Account.registered_device_count += 1"]
  - method: GET
    path: "/accounts/{id}/devices"
    description: "list devices on an account (reverse-reach for Device.account_id)"
    roles: [AccountOwner, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Device[]
    side_effects: []
  - method: POST
    path: "/devices/{id}/deregister"
    description: "deregister a device; cascades download deletion on that device"
    roles: [AccountOwner]
    code: 200
    input: []
    output: Device
    side_effects: ["device -> DEREGISTERED", "registered_device_count -= 1", "Downloads on device -> DELETED (cascade)"]

  # --- Stream sessions ---
  - method: POST
    path: "/stream-sessions"
    description: "start a streaming session; runs rating/curfew/limit/device-busy/cap gates"
    roles: [ProfileUser]
    code: 201
    input: [profile_id, device_id, title_id]
    output: StreamSession
    side_effects: ["active_stream_count += 1", "ad_breaks_served computed via ad_break_count", "started_at_min stamped"]
  - method: POST
    path: "/stream-sessions/{id}/stop"
    description: "stop a streaming session; attributes watch minutes to the profile"
    roles: [ProfileUser]
    code: 200
    input: []
    output: StreamSession
    side_effects: ["minutes_watched computed via watch_minutes_attributed", "Profile.daily_watch_minutes_used folded", "active_stream_count -= 1"]
  - method: GET
    path: "/stream-sessions/{id}"
    description: "fetch a stream session (collection-segment source)"
    roles: [AccountOwner, ProfileUser, PlatformAdmin]
    code: 200
    input: []
    output: StreamSession
    side_effects: []
  - method: GET
    path: "/stream-sessions"
    description: "list stream sessions, filterable by profile/device/title (reverse-reach for StreamSession.profile_id, .device_id, .title_id)"
    roles: [AccountOwner, ProfileUser, PlatformAdmin]
    code: 200
    input: ["profile_id?", "device_id?", "title_id?", "status?", "limit?", "offset?"]
    output: StreamSession[]
    side_effects: []

  # --- Downloads ---
  - method: POST
    path: "/downloads"
    description: "request an offline download; runs quota/HD/downloadable gates"
    roles: [ProfileUser]
    code: 201
    input: [profile_id, device_id, title_id, "quality?"]
    output: Download
    side_effects: ["size_mb computed via download_size"]
  - method: POST
    path: "/downloads/{id}/complete"
    description: "mark a download READY; stamps license expiry"
    roles: [ProfileUser]
    code: 200
    input: []
    output: Download
    side_effects: ["license_expires_at stamped to clock + DOWNLOAD_LICENSE_HOURS"]
  - method: DELETE
    path: "/downloads/{id}"
    description: "delete a download; frees a quota slot"
    roles: [ProfileUser]
    code: 200
    input: []
    output: Download
    side_effects: ["download -> DELETED", "frees a profile download slot"]
  - method: GET
    path: "/downloads/{id}"
    description: "fetch a download (collection-segment source)"
    roles: [AccountOwner, ProfileUser, PlatformAdmin]
    code: 200
    input: []
    output: Download
    side_effects: []
  - method: GET
    path: "/downloads"
    description: "list downloads, filterable by profile/device/title (reverse-reach for Download.profile_id, .device_id, .title_id)"
    roles: [AccountOwner, ProfileUser, PlatformAdmin]
    code: 200
    input: ["profile_id?", "device_id?", "title_id?", "status?", "limit?", "offset?"]
    output: Download[]
    side_effects: []

  # --- Watch progress (cross-device sync) ---
  - method: PUT
    path: "/watch-progress"
    description: "upsert cross-device playback position for a (profile,title)"
    roles: [ProfileUser]
    code: 200
    input: [profile_id, title_id, position_min, last_device_id]
    output: WatchProgress
    side_effects: ["completed recomputed (position_min >= Title.runtime_minutes)"]
  - method: GET
    path: "/watch-progress/{id}"
    description: "fetch a watch-progress row (collection-segment source)"
    roles: [AccountOwner, ProfileUser, PlatformAdmin]
    code: 200
    input: []
    output: WatchProgress
    side_effects: []
  - method: GET
    path: "/watch-progress"
    description: "list watch-progress rows, filterable by profile/title (reverse-reach for WatchProgress.profile_id, .title_id)"
    roles: [AccountOwner, ProfileUser, PlatformAdmin]
    code: 200
    input: ["profile_id?", "title_id?", "limit?", "offset?"]
    output: WatchProgress[]
    side_effects: []

  # --- Test-driving / clock seam ---
  - method: POST
    path: "/_clock/advance"
    description: "set/advance the system clock; when run_sweeps is true, fire invite/download expiry sweeps and daily-usage rollover"
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601, "run_sweeps?"]
    output: null
    side_effects: ["system clock set to to_iso8601", "if run_sweeps true: PENDING Invites past expires_at -> EXPIRED (release holds); READY Downloads past license_expires_at -> EXPIRED (free quota); profiles crossing UTC midnight reset daily_watch_minutes_used to 0"]

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing or malformed auth headers on a non-token endpoint"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "acting role not permitted for the operation"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "entity_backed role does not own the targeted resource"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "referenced resource id does not resolve"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "requested transition not defined from the resource's current state"
  - id: ERR_STALE_ACCOUNT_VERSION
    http: 412
    condition: "expected_account_version does not match Account.version (OCC)"
  - id: ERR_CROSS_ACCOUNT_REFERENCE
    http: 409
    condition: "Device referenced by a session/download/progress belongs to a different Account than the Profile"
  - id: ERR_RATING_BLOCKED
    http: 403
    condition: "Title.maturity_rating exceeds Profile.max_rating_allowed"
  - id: ERR_CURFEW_BLOCKED
    http: 409
    condition: "stream start falls inside the profile's curfew window"
  - id: ERR_DAILY_LIMIT_EXCEEDED
    http: 409
    condition: "daily_watch_minutes_used + Title.runtime_minutes would exceed the profile's daily limit"
  - id: ERR_DEVICE_BUSY
    http: 409
    condition: "the target device already hosts an ACTIVE stream whose projected interval covers the new start minute"
  - id: ERR_HD_NOT_ALLOWED
    http: 409
    condition: "HD download requested but plan or device does not allow HD"
  - id: ERR_TITLE_NOT_DOWNLOADABLE
    http: 409
    condition: "download requested for a title with downloadable == false"
  - id: ERR_DUPLICATE
    http: 409
    condition: "uniqueness violated (profile display_name, owner_email, parental control, watch-progress)"
  - id: ERR_CONCURRENT_CAP_REACHED
    http: 409
    condition: "active_stream_count already at plan.concurrent_stream_cap"
  - id: ERR_DOWNLOAD_QUOTA_REACHED
    http: 409
    condition: "profile already at plan.download_quota_per_profile"
  - id: ERR_PROFILE_CAP_REACHED
    http: 409
    condition: "non-ARCHIVED profile count already at plan.max_profiles"
  - id: ERR_DEVICE_CAP_REACHED
    http: 409
    condition: "registered_device_count already at plan.max_registered_devices"
  - id: ERR_INSUFFICIENT_CREDIT
    http: 402
    condition: "wallet credit below the required hold or charge"
  - id: ERR_INVITE_EXPIRED
    http: 409
    condition: "invite accepted/declined after expires_at or with a mismatched token"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "body fails field-level schema (missing required, bad enum, out-of-range)"

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: PlatformAdmin
    description: "manages the shared catalog (plans, titles) and operates the clock/test seam"
    identity: opaque
    exclusive_operations:
      - "POST /subscription-plans"
      - "POST /titles"
      - "POST /_clock/advance"
    shared_operations:
      - "GET reads across all collections"

  - name: AccountOwner
    description: "owns one Account; manages its profiles, devices, invites, billing, and plan changes"
    identity: "entity_backed:Account"
    exclusive_operations:
      - "POST /accounts"
      - "POST /accounts/{id}/suspend"
      - "POST /accounts/{id}/reactivate"
      - "POST /accounts/{id}/close"
      - "POST /accounts/{id}/invoice"
      - "POST /accounts/{id}/plan-changes"
      - "POST /profiles"
      - "POST /profiles/{id}/archive"
      - "POST /profiles/{id}/parental-control"
      - "POST /invites"
      - "POST /invites/{id}/revoke"
      - "POST /devices"
      - "POST /devices/{id}/deregister"
    shared_operations:
      - "GET reads scoped to the owned Account and its children"

  - name: ProfileUser
    description: "acts within a single Profile; starts/stops streams, manages downloads, syncs watch progress"
    identity: "entity_backed:Profile"
    exclusive_operations:
      - "POST /stream-sessions"
      - "POST /stream-sessions/{id}/stop"
      - "POST /downloads"
      - "POST /downloads/{id}/complete"
      - "DELETE /downloads/{id}"
      - "PUT /watch-progress"
    shared_operations:
      - "GET reads scoped to the Profile and its account context"

  - name: Anonymous
    description: "token-bearing invitee with no persisted identity; only accepts or declines an invite"
    identity: opaque
    exclusive_operations:
      - "POST /invites/{id}/accept"
      - "POST /invites/{id}/decline"
    shared_operations: []
