  # ===========================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: application_sample_revision_cycle
        grounds:
          - state_machines.TeacherApplication.SAMPLE_REJECTED_to_SAMPLE_PENDING
          - state_machines.TeacherApplication.SAMPLE_PENDING_to_SAMPLE_REJECTED
          - entities.TeacherApplication.fields.revision_count
        distinguishing_aspect: |
          The TeacherApplication machine is cyclic rather than a linear pipeline: a reviewer
          rejection moves the application back to SAMPLE_PENDING on resubmission while
          incrementing revision_count, so the same application traverses SAMPLE_PENDING twice
          and the asserted revision_count of 1 proves the loop closed rather than terminated.
        test_recipe:
          setup:
            - "Application app_ada is in SAMPLE_PENDING with revision_count 0"
            - "The applicant has passed screening"
            - "The logical clock reads 2026-09-01T00:00:00Z, the server default"
          setup_api_calls:
            - call: "POST /outschool/teacher-applications"
              payload: { applicant_user_id: "u_ada", applicant_email: "ada@example.com", display_name: "Ada Lovelace", teaching_sample_url: "https://samples.example.com/ada.mp4", teaching_sample_minutes: 10 }
              as: TeacherApplicant
              as_user_id: "u_ada"
              captures: { app_ada: $.data.id }
            - call: "POST /outschool/teacher-applications/${app_ada}/submit"
              payload: { teaching_sample_url: "https://samples.example.com/ada.mp4", teaching_sample_minutes: 10 }
              as: TeacherApplicant
              as_user_id: "u_ada"
              captures: { app_ada_s1: $.data.status }
            - call: "POST /outschool/teacher-applications/${app_ada}/submit-sample"
              payload: { teaching_sample_url: "https://samples.example.com/ada.mp4", teaching_sample_minutes: 10 }
              as: TeacherApplicant
              as_user_id: "u_ada"
              captures: { app_ada_s2: $.data.status }
          trigger:
            - call: "POST /outschool/teacher-applications/${app_ada}/review"
              payload: { stage: "SAMPLE", verdict: "FAIL", reason_code: "SAMPLE_QUALITY" }
              as: TeacherReviewer
              as_user_id: "rev_1"
              captures: { app_ada_rejected: $.data.status, app_ada_rev: $.data.revision_count }
            - call: "POST /outschool/teacher-applications/${app_ada}/submit-sample"
              payload: { teaching_sample_url: "https://samples.example.com/ada-v2.mp4", teaching_sample_minutes: 12 }
              as: TeacherApplicant
              as_user_id: "u_ada"
              captures: { app_ada_reopened: $.data.status }
          assert:
            - "TeacherApplication.${app_ada}.revision_count == 1"
            - "TeacherApplication.${app_ada}.status == SAMPLE_PENDING"
            - "TeacherApplication.${app_ada}.reviewed_by_user_id == null"
            - "The application re-entered SAMPLE_PENDING after having left it, so the machine traversed a cycle rather than a linear pipeline"

      - name: report_reopen_cycle
        grounds:
          - state_machines.ParentReport.RESOLVED_to_UNDER_REVIEW
          - state_machines.ParentReport.UNDER_REVIEW_to_RESOLVED
          - entities.ParentReport.fields.disposition
        distinguishing_aspect: |
          The ParentReport machine is cyclic rather than a linear pipeline: a resolved report
          can be re-opened for a second review round, and the disposition written in the second
          round replaces the first, so the asserted disposition of MORE_SEVERE after two rounds
          proves the loop closed rather than terminated at the first resolution.
        test_recipe:
          setup:
            - "Teacher ada is ACTIVE; one PUBLISHED ONE_TIME listing exists"
            - "Report r_1 against that teacher and listing is RESOLVED with disposition DISMISSED"
            - "The logical clock reads 2026-09-01T00:00:00Z, the server default"
