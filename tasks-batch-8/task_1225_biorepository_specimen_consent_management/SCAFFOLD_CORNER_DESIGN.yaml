        distinguishing_aspect: "Selector determinism: with two eligible aliquots of equal volume, fulfillment reserves the aliquot of the specimen with the earlier collected_at (ranking key), never a random/id-based pick."
        test_recipe:
          setup:
            - "Donor/consent, two kits; SP-OLD (collected 2026-05-01T00:00:00Z) with aliquot AL-OLD 30ml; SP-NEW (collected 2026-05-03T00:00:00Z) with aliquot AL-NEW 30ml; both IN_STORAGE"
