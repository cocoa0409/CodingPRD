          - errors[ERR_ASSESSMENT_NOT_CERTIFIED]
        distinguishing_aspect: "Dispute->Assessment pair (different from Budget->BID): filing a dispute against an ESTIMATED (not yet CERTIFIED) assessment returns ERR_ASSESSMENT_NOT_CERTIFIED."
        test_recipe:
          setup:
