          trigger:
            - call: "POST /records-retention/purge"
              payload: {}
              as: DistrictAdministrator
              captures: { purged_count: $.data.purged_count, purged_ids: $.data.purged_case_ids }
            - call: "GET /threat-cases/${case_a}"
              as: TeamLead
              captures: { a_status: $.data.status, a_alias: $.data.subject_alias }
            - call: "GET /threat-cases/${case_a}/documents"
              as: TeamLead
