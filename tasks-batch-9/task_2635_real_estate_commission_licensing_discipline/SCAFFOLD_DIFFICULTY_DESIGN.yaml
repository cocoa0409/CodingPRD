          A third resource (an auditor's fieldwork capacity) with aggregate semantics rather than
          exclusion: overlapping is allowed up to MAX_CONCURRENT_AUDIT_WINDOWS (2) and only the THIRD
          intersecting window is refused, so a rule written as pairwise exclusion would wrongly reject
          the second audit. Adjacency does not intersect at all, and the capacity is scoped per
