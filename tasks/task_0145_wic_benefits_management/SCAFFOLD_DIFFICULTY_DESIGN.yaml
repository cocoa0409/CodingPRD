              as: CompetentProfessionalAuthority
              as_user_id: cpa1
              captures: { sess1_id: $.data.id }
          trigger:
            - call: "POST /peer-sessions"
              payload: { participant_id: "${p2_id}", peer_counselor_id: "pc-1", start_utc: "2026-03-10T10:40:00.000Z", end_utc: "2026-03-10T11:00:00.000Z" }
              as: CompetentProfessionalAuthority
              as_user_id: cpa1
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_APPOINTMENT_OVERLAP"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: ebt_value_units_conserved_on_void
        grounds:
          - calculations.ebt_reconciliation
          - state_machines.FoodPrescription.REDEEMED_PARTIAL_to_VOIDED
          - entities.EbtAccount.fields.remaining_value_cents
        distinguishing_aspect: "Conserved quantity = EBT value: forward issuance (2500) paired with redemption (1400) + the void compensation (1100) keeps issued == redeemed + remaining + voided, i.e. 2500 == 1400 + 0 + 1100 after terminate."
        test_recipe:
          setup:
            - "Certified PREGNANT participant, FULL prescription 2500, MILK 4 redeemed (1400), then terminate voids the rest."
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Agency Q", state_code: "CA", caseload_cap: 50 }
              as: EligibilityClerk
              as_user_id: clerk1
              captures: { agency_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { agency_id: "${agency_id}", to_iso8601: "2026-03-02T00:00:00.000Z" }
              as: EligibilityClerk
              as_user_id: clerk1
            - call: "POST /vendors"
              payload: { agency_id: "${agency_id}", legal_name: "Grocer Six", peer_group: "MEDIUM" }
              as: EligibilityClerk
              as_user_id: clerk1
              captures: { vendor_id: $.data.id }
            - call: "POST /vendors/${vendor_id}/authorize"
              payload: {}
              as: EligibilityClerk
              as_user_id: clerk1
            - call: "POST /households"
              payload: { agency_id: "${agency_id}", household_size: 2, pregnancy_count: 1, adjunctive_program: "MEDICAID" }
              as: EligibilityClerk
              as_user_id: clerk1
              captures: { hh_id: $.data.id }
            - call: "POST /participants"
              payload: { household_id: "${hh_id}", full_name: "Preg Ten", ssn_last4: "2010", category: "PREGNANT" }
