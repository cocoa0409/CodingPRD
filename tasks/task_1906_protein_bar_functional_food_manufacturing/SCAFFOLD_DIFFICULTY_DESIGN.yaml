            - { call: "GET /mfg/lines/${lp}", payload: {}, as: ProductionPlanner, captures: { lp_v2: "$.data.version" } }
          trigger:
            - { call: "POST /mfg/production-runs/${run0}/schedule", payload: { start_utc: "2026-08-05T10:30:00Z", end_utc: "2026-08-05T12:00:00Z", expected_line_version: "${lp_v2}" }, as: ProductionPlanner, captures: { err_buf: "$.data.error_id" } }
