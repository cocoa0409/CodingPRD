      - name: corner_sm_covenant_waiver_compensates_the_breach_cascade
        claim_type: side_effect_execution
        grounds:
          - state_machines.CovenantTest.status.BREACH_to_WAIVED
          - state_machines.MarginCall.status.ISSUED_to_WAIVED
          - state_machines.WarehouseFacility.status.RESTRICTED_to_ACTIVE
          - endpoints["POST /covenant-tests/{id}/waive"]
        distinguishing_aspect: |
          Compensation, not deletion: waiving the BREACH must undo every one of its three
          downstream effects — the facility-level MarginCall, the RESTRICTED posture and
          consecutive_breach_count — while leaving outstanding_principal_cents untouched,
          because the MARGIN_CALL_WAIVED ledger entry is excluded from both ledger sums.
        test_recipe:
          setup:
            - "Canonical ACTIVE facility with one DRY CONFORMING advance funded to 1,960,000,000."
            - "One covenant test for period_end 2026-06-30 with tangible_net_worth_cents 1,400,000,000 (below the 1,500,000,000 minimum), liquidity_cents 600,000,000 and net_income_cents 30,000,000."
          setup_api_calls:
            - *c_clock_aug1
            - *c_facility
            - *c_par_conforming
            - *c_approve_facility
            - *c_custodian
            - *c_investor_a
            - *c_investor_a_approve
            - *c_commitment_a
            - *c_get_fac_v1
            - *c_advance_dry_2b
            - *c_receipt_clear_a1
            - *c_wire_a1
            - *c_verify_w1
            - *c_fund_a1
            - call: "POST /facilities/${fac_id}/covenant-tests"
              payload: { period_end: "2026-06-30", tangible_net_worth_cents: 1400000000, liquidity_cents: 600000000, net_income_cents: 30000000 }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { ctb_id: "$.data.id", ctb_codes: "$.data.breach_codes", ctb_variant: "$.data.profitability_variant" }
            - call: "GET /facilities/${fac_id}/margin-calls"
              payload: { trigger_reason: "COVENANT_BREACH" }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { mcc_id: "$.data[0].id", mcc_amount: "$.data[0].call_amount_cents" }
          trigger:
            - call: "POST /covenant-tests/${ctb_id}/waive"
              payload: { reason: "Sponsor equity injection closed 2026-08-01" }
              as: CreditOfficer
              as_user_id: "co_1"
            - call: "GET /facilities/${fac_id}/ledger-entries"
              payload: {}
              as: CreditOfficer
              as_user_id: "co_1"
          assert:
            - "pre-waive: ctb_variant == ANNUALIZED_QUARTER and ctb_codes == [NET_WORTH] — 30000000 * 4 = 120000000 clears the 100000000 profitability floor and 600000000 clears the liquidity floor"
            - "pre-waive: CovenantTest.${ctb_id}.status == BREACH and profitability_metric_cents == 120000000"
            - "pre-waive: mcc_amount == 196000000 = floor(1960000000 * 0.10) and the call's advance_id is null (facility-level)"
            - "pre-waive: WarehouseFacility.${fac_id}.status == RESTRICTED, consecutive_breach_count == 1, last_covenant_status == BREACH, open_margin_call_count == 1"
            - "post-waive: CovenantTest.${ctb_id}.status == WAIVED and waived_by_user_id == co_1"
            - "post-waive: MarginCall.${mcc_id}.status == WAIVED"
            - "post-waive: WarehouseFacility.${fac_id}.status == ACTIVE, consecutive_breach_count == 0, last_covenant_status == WAIVED, open_margin_call_count == 0"
            - "post-waive: outstanding_principal_cents is still 1960000000 — the MARGIN_CALL_WAIVED entry enters neither ledger sum"
            - "post-waive: the ledger holds exactly 2 entries — ADVANCE_FUNDED DEBIT 1960000000 and MARGIN_CALL_WAIVED CREDIT 196000000"
            - "post-waive: GET /facilities/${fac_id}/covenant-tests still returns total_count == 1 — a waiver never deletes the prior"

      - name: corner_sm_bailee_expiry_raises_repurchase_demand
        claim_type: side_effect_execution
        grounds:
