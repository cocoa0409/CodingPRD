              payload: {}
              as: SourcingManager
              captures: { cv_revoked: "$.data.partner_committed_volume", un_revoked: "$.data.unserved_volume" }
          assert:
            - "base_alloc == 82 and a1_status == \"PROPOSED\""
            - "cv_proposed == 0 and un_proposed == 82 -- two PROPOSED rows totalling 80 move nothing"
            - "a2_status == \"COMMITTED\", cv_committed == 50 and un_committed == 32 (the PROPOSED 30 is excluded)"
            - "a2_settled == \"SETTLED\", cv_settled == 50 and un_settled == 32 -- settling does not release the interval"
            - "pen == 16 (10 undelivered * 12500 millicents * 0.25 / 1000 = 31.25 rounds half up to 31)"
            - "amt == 469 (DELIVERED_ONLY: 40 * 12500 / 1000 = 500 minus the 31-cent penalty)"
            - "OutsourcePartner.${p1_id}.committed_volume_outstanding == 0 and invoice_total_cents == 469"
            - "a1_revoked == \"REVOKED\", cv_revoked == 50 and un_revoked == 32"

      - name: partner_rolling_performance_uses_trailing_window_of_three
        claim_type: constants_applied
        grounds:
          - calculations.partner_rolling_performance
          - state_machines.OutsourcePartner
        distinguishing_aspect: |
          PARTNER_PERFORMANCE_WINDOW is 3, so the fourth report averages only the last three
          entries: [0.90, 0.70, 0.70] -> 0.7667, whereas an all-history mean would give 0.7750 and
          a window of 2 would give 0.7000. The window also drives the status walk
          ACTIVE -> PROBATION -> ACTIVE -> PROBATION -> SUSPENDED, and the exactly-equal report
          (rolling 0.8500 against threshold 0.8500) is compliant because the breach test is a
          strict `<`.
        test_recipe:
          setup:
            - "One ACTIVE partner P1 with performance_threshold_pct 0.8500 and no reports yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SourcingManager
            - call: "POST /outsource-partners"
              payload: { legal_name: "Partner Window", skill_codes: ["CHAT_EN"], rate_per_contact_millicents: 12500, interval_max_volume: 50, commitment_floor_volume: 10, performance_threshold_pct: 0.8500, billing_basis: "DELIVERED_ONLY" }
              as: SourcingManager
              captures: { p1_id: "$.data.id", init_rolling: "$.data.rolling_sl_attainment_pct" }
          trigger:
            - call: "POST /outsource-partners/${p1_id}/performance-reports"
              payload: { period_end_date: "2026-08-09", sl_attainment_pct: 0.8000 }
              as: SourcingManager
              captures: { r1_rolling: "$.data.rolling_sl_attainment_pct", r1_status: "$.data.status", r1_breach: "$.data.consecutive_breach_count" }
            - call: "POST /outsource-partners/${p1_id}/performance-reports"
              payload: { period_end_date: "2026-08-16", sl_attainment_pct: 0.9000 }
              as: SourcingManager
              captures: { r2_rolling: "$.data.rolling_sl_attainment_pct", r2_status: "$.data.status", r2_breach: "$.data.consecutive_breach_count" }
            - call: "POST /outsource-partners/${p1_id}/performance-reports"
              payload: { period_end_date: "2026-08-23", sl_attainment_pct: 0.7000 }
              as: SourcingManager
              captures: { r3_rolling: "$.data.rolling_sl_attainment_pct", r3_status: "$.data.status", r3_breach: "$.data.consecutive_breach_count" }
            - call: "POST /outsource-partners/${p1_id}/performance-reports"
              payload: { period_end_date: "2026-08-30", sl_attainment_pct: 0.7000 }
              as: SourcingManager
              captures: { r4_rolling: "$.data.rolling_sl_attainment_pct", r4_status: "$.data.status", r4_breach: "$.data.consecutive_breach_count" }
          assert:
            - "init_rolling is null and OutsourcePartner.${p1_id}.latest_sl_attainment_pcts == [] before any report"
            - "r1_rolling == 0.8000, r1_status == \"PROBATION\", r1_breach == 1"
            - "r2_rolling == 0.8500 (window [0.8000, 0.9000]) and r2_status == \"ACTIVE\" with r2_breach == 0 -- exactly equal to the threshold is compliant"
            - "r3_rolling == 0.8000 (window [0.8000, 0.9000, 0.7000] = 2.40/3) and r3_status == \"PROBATION\" with r3_breach == 1"
            - "r4_rolling == 0.7667 (window [0.9000, 0.7000, 0.7000] = 2.30/3 = 0.766666... rounded half up), NOT 0.7750"
            - "r4_status == \"SUSPENDED\" and r4_breach == 2"
            - "OutsourcePartner.${p1_id}.performance_report_count == 4 and latest_sl_attainment_pcts == [0.8000, 0.9000, 0.7000, 0.7000] (the raw list is append-only; only the average is windowed)"

      - name: shift_adherence_pct_rounds_half_up_at_four_decimals
        claim_type: precision
        grounds:
          - calculations.shift_adherence_score
          - entities.ScheduleShift.fields.adherence_pct
        distinguishing_aspect: |
          A 27000-second shift with 3000 out-of-adherence seconds gives 24000/27000 =
          0.8888888..., which must be stored as 0.8889 (round_half_up at 4 decimals) rather than
          the 0.8888 a truncating implementation produces. The value is above
          COACHING_ADHERENCE_THRESHOLD, so the shift lands ON_TRACK and no coaching flag is raised.
        test_recipe:
          setup:
            - "The canonical FG-A cycle locked to REQUIREMENTS_LOCKED with one PUBLISHED 480-minute shift (30-minute unpaid break -> 27000 scheduled seconds) for agent E-001 on 2026-09-07."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
