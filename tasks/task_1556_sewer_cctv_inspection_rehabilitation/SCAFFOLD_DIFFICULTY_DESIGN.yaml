  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: bypass_window_overlap_buffered_half_open
        grounds:
          - state_machines.BypassPlan.PROPOSED_to_APPROVED
          - validations[priority=8]
        distinguishing_aspect: |
          Resource: segment bypass capacity (one active bypass per segment).
          Semantics: half-open [start,end) PLUS a 30-minute buffer on both
          sides — overlap iff A.buf_start < B.buf_end AND B.buf_start <
          A.buf_end. A plan whose buffered window intersects an APPROVED
          plan's buffered window is rejected ERR_BYPASS_WINDOW_CONFLICT.
        test_recipe:
          setup:
            - "District D, segment S 300mm with certified grade-4 baseline; FULL_REPLACE plan approved; work orders W1, W2 ISSUED"
            - "BP1 APPROVED window 2026-08-12T08:00..12:00 (buffered 07:30..12:30)"
            - "BP2 PROPOSED window 2026-08-12T12:00..16:00 (buffered 11:30..16:30) -> buffered overlap [11:30,12:30) non-empty"
