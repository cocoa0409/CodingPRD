  # ===================================================================
  # Cross-Cutting Complexity Layers
  # ===================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_correct_bay_version_succeeds_and_increments
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[appointment-create-stale-bay]
          - entities.ServiceBay.fields.status
        distinguishing_aspect: "Booking SHOP with the CURRENT bay version (just captured) succeeds 201 and the bay version increments to 2."
        test_recipe:
          setup:
            - "Bay OK1 (ceramic) freshly created at version 1."
          setup_api_calls:
            - call: "POST /detailing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T08:00:00Z" }
              as: Scheduler
            - call: "POST /detailing/packages"
              payload: { tier: "CERAMIC", base_price_cents: 50000, prep_minutes: 45, service_minutes: 240, cure_minutes: 1440, guarantee_days: 90 }
              as: Scheduler
            - call: "POST /detailing/vehicle-size-rates"
              payload: { vehicle_size: "SEDAN", size_multiplier_bps: 10000 }
              as: Scheduler
            - call: "POST /detailing/customers"
              payload: { email: "ok1@x.com", full_name: "Ok One" }
              as: Scheduler
              captures: { cust_id: $.data.id }
            - call: "POST /detailing/service-bays"
              payload: { bay_code: "OK1", supports_ceramic: true }
              as: Scheduler
              captures: { bay_id: $.data.id, bay_v: $.data.version }
          trigger:
            - call: "POST /detailing/appointments"
              payload: { customer_id: "${cust_id}", tier: "CERAMIC", vehicle_size: "SEDAN", location_mode: "SHOP", scheduled_start_utc: "2026-06-15T09:00:00Z", service_bay_id: "${bay_id}", expected_service_bay_version: "${bay_v}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { appt_id: $.data.id }
            - call: "GET /detailing/service-bays/${bay_id}"
              payload: {}
              as: Scheduler
              captures: { bay_v_after: $.data.version }
          assert:
            - "response.http_status == 201"
            - "ServiceBay.${bay_id}.version == 2"

      - name: derived_outstanding_reconciles_after_final_price_drop
        claim_type: derived_field_reconciliation
        grounds:
          - calculations.payment_ledger
          - calculations.appointment_total
          - entities.Appointment.fields.outstanding_balance_cents
        distinguishing_aspect: "When finish-service recomputes final_total below provisional (skipped add-on), outstanding_balance_cents reconciles to the new final minus prior charges."
        excluded_because:
          difficulty_instance: dual_variant_calc / appointment_provisional_vs_final_total_diverges_on_lapse_and_skip
          rationale: "The provisional-vs-final divergence instance recomputes final_total at READY and the payment ledger follows."

      - name: cascade_refund_updates_chronological_spend_after_release
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Appointment.PAID_to_REFUNDED
          - calculations.customer_loyalty_tier
          - entities.Customer.fields.chronological_lifetime_spend_cents
        distinguishing_aspect: "Refunding a released PAID appointment drops chronological_lifetime_spend_cents back to 0 and loyalty_tier to BRONZE (the appointment leaves the PAID set)."
        test_recipe:
          setup:
            - "FULL/SEDAN MOBILE appointment PAID and RELEASED (chronological 12000); then refunded."
