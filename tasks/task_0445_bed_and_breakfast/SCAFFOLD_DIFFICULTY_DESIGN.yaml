# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Bed & Breakfast / Boutique Inn (Expert band)
# 9 rule_ids x 2 instances = 18 instances.
# Every grounds[] resolves into SCAFFOLD.yaml §1.1-§1.7.
# All formula-derived asserts are literals pre-computed from §1.3 formulas.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: deposit_due_direct_vs_ota_diverge
        grounds:
          - calculations.deposit_due
          - entities.Booking.fields.deposit_due_cents
          - entities.Booking.fields.channel
        distinguishing_aspect: |
          Same room/dates/total, channel DIRECT yields a 30%-of-total deposit floored at
          one night while channel OTA yields the full total — a divergence on the Booking
          money domain.
        test_recipe:
          setup:
            - "Inn (tax 1000 bps), one Room base_rate 10000, max_occupancy 2."
            - "Two PENDING bookings, same dates 2026-03-10..2026-03-12 (2 nights, no peak), no package."
            - "Booking X channel DIRECT; Booking Y channel OTA."
          setup_api_calls:
            - call: "POST /inns"
              payload: { name: "Maple Inn", lodging_tax_rate_bps: 1000 }
              as: Innkeeper
              captures: { inn_id: $.data.id }
            - call: "POST /inns/${inn_id}/rooms"
              payload: { inn_id: "${inn_id}", name: "Rose", base_rate_cents: 10000, max_occupancy: 2 }
              as: Innkeeper
              captures: { room_id: $.data.id }
            - call: "POST /inns/${inn_id}/guests"
              payload: { inn_id: "${inn_id}", full_name: "Ada G", email: "ada@x.com" }
              as: Innkeeper
              captures: { guest_id: $.data.id }
            - call: "POST /inns/${inn_id}/bookings"
              payload: { inn_id: "${inn_id}", room_id: "${room_id}", guest_id: "${guest_id}", channel: "DIRECT", checkin_date: "2026-03-10", checkout_date: "2026-03-12", guest_count: 2 }
              as: Guest
              as_user_id: "${guest_id}"
              captures: { bk_direct_id: $.data.id, dep_direct: $.data.deposit_due_cents }
            - call: "POST /inns/${inn_id}/bookings"
              payload: { inn_id: "${inn_id}", room_id: "${room_id}", guest_id: "${guest_id}", channel: "OTA", checkin_date: "2026-03-10", checkout_date: "2026-03-12", guest_count: 2 }
              as: Guest
              as_user_id: "${guest_id}"
              captures: { bk_ota_id: $.data.id, dep_ota: $.data.deposit_due_cents }
          trigger:
            - call: "GET /inns/${inn_id}/bookings/${bk_direct_id}"
              as: Guest
              as_user_id: "${guest_id}"
            - call: "GET /inns/${inn_id}/bookings/${bk_ota_id}"
              as: Guest
              as_user_id: "${guest_id}"
          assert:
            - "Booking.${bk_direct_id}.total_cents == 22000"
            - "Booking.${bk_direct_id}.deposit_due_cents == 10000"   # max(round(22000*0.3)=6600, first_night 10000)
            - "Booking.${bk_ota_id}.deposit_due_cents == 22000"      # OTA full prepay
            - "Booking.${bk_direct_id}.deposit_due_cents != Booking.${bk_ota_id}.deposit_due_cents"

      - name: tax_remittance_estimated_vs_final_diverge
        grounds:
          - calculations.tax_remittance_total
          - entities.TaxRemittance.fields.variant
          - entities.TaxRemittance.fields.tax_total_cents
          - entities.TaxRemittance.fields.swept_booking_count
        distinguishing_aspect: |
          For the same inn/window, an ESTIMATED remittance sweeps CONFIRMED+CHECKED_IN+
          CHECKED_OUT bookings while FINAL sweeps only CHECKED_OUT — divergent totals on the
          TaxRemittance domain (different entity than deposit's Booking domain).
        test_recipe:
          setup:
            - "Inn tax 1450 bps; Room base 30000; two DIRECT bookings checkout 2026-05-12."
            - "Booking P1: stayed full path to CHECKED_OUT (lodging_tax 13050)."
            - "Booking P2: only CONFIRMED, never checked in (lodging_tax 13050)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: Innkeeper
            - call: "POST /inns"
              payload: { name: "Cedar Inn", lodging_tax_rate_bps: 1450 }
              as: Innkeeper
              captures: { inn_id: $.data.id }
            - call: "POST /inns/${inn_id}/rooms"
              payload: { inn_id: "${inn_id}", name: "Oak", base_rate_cents: 30000, max_occupancy: 2 }
              as: Innkeeper
              captures: { room_a: $.data.id }
            - call: "POST /inns/${inn_id}/rooms"
              payload: { inn_id: "${inn_id}", name: "Elm", base_rate_cents: 30000, max_occupancy: 2 }
              as: Innkeeper
              captures: { room_b: $.data.id }
            - call: "POST /inns/${inn_id}/guests"
              payload: { inn_id: "${inn_id}", full_name: "Bo G", email: "bo@x.com" }
              as: Innkeeper
              captures: { guest_id: $.data.id }
            # P1 -> checked out (room_a), 3 nights 05-09..05-12
            - call: "POST /inns/${inn_id}/bookings"
              payload: { inn_id: "${inn_id}", room_id: "${room_a}", guest_id: "${guest_id}", channel: "DIRECT", checkin_date: "2026-05-09", checkout_date: "2026-05-12", guest_count: 1 }
              as: Innkeeper
              captures: { bk_p1: $.data.id, dep_p1: $.data.deposit_due_cents, rv_a: $.data.room_id }
            - call: "GET /inns/${inn_id}/rooms/${room_a}"
              as: Innkeeper
              captures: { room_a_v: $.data.version }
            - call: "POST /inns/${inn_id}/gift-certificates"
              payload: { inn_id: "${inn_id}", face_value_cents: 90000 }
              as: FinanceManager
              captures: { gc_p1: $.data.id, gc_p1_v: $.data.version }
            - call: "POST /inns/${inn_id}/bookings/${bk_p1}/redeem-gift"
              payload: { gift_certificate_id: "${gc_p1}", amount_cents: 34215, expected_gift_certificate_version: "${gc_p1_v}" }
              as: Innkeeper
            - call: "POST /inns/${inn_id}/bookings/${bk_p1}/confirm"
              payload: { expected_room_version: "${room_a_v}" }
              as: Innkeeper
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-09T16:00:00Z" }
              as: Innkeeper
            - call: "POST /inns/${inn_id}/bookings/${bk_p1}/check-in"
              payload: {}
              as: Innkeeper
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-12T11:00:00Z" }
              as: Innkeeper
            - call: "POST /inns/${inn_id}/bookings/${bk_p1}/check-out"
              payload: {}
              as: Innkeeper
            # P2 -> only confirmed (room_b), 3 nights 05-09..05-12
            - call: "POST /inns/${inn_id}/bookings"
              payload: { inn_id: "${inn_id}", room_id: "${room_b}", guest_id: "${guest_id}", channel: "DIRECT", checkin_date: "2026-05-09", checkout_date: "2026-05-12", guest_count: 1 }
              as: Innkeeper
              captures: { bk_p2: $.data.id }
            - call: "GET /inns/${inn_id}/rooms/${room_b}"
              as: Innkeeper
              captures: { room_b_v: $.data.version }
            - call: "POST /inns/${inn_id}/gift-certificates"
              payload: { inn_id: "${inn_id}", face_value_cents: 90000 }
              as: FinanceManager
              captures: { gc_p2: $.data.id, gc_p2_v: $.data.version }
            - call: "POST /inns/${inn_id}/bookings/${bk_p2}/redeem-gift"
              payload: { gift_certificate_id: "${gc_p2}", amount_cents: 34215, expected_gift_certificate_version: "${gc_p2_v}" }
              as: Innkeeper
            - call: "POST /inns/${inn_id}/bookings/${bk_p2}/confirm"
              payload: { expected_room_version: "${room_b_v}" }
              as: Innkeeper
          trigger:
            - call: "POST /inns/${inn_id}/tax-remittances"
              payload: { inn_id: "${inn_id}", period_start: "2026-05-01", period_end: "2026-05-31", variant: "ESTIMATED" }
              as: FinanceManager
              captures: { rem_est: $.data.id, est_total: $.data.tax_total_cents, est_count: $.data.swept_booking_count }
            - call: "POST /inns/${inn_id}/tax-remittances"
              payload: { inn_id: "${inn_id}", period_start: "2026-05-01", period_end: "2026-05-31", variant: "FINAL" }
              as: FinanceManager
              captures: { rem_fin: $.data.id, fin_total: $.data.tax_total_cents, fin_count: $.data.swept_booking_count }
          assert:
            - "TaxRemittance.${rem_est}.swept_booking_count == 2"
            - "TaxRemittance.${rem_est}.tax_total_cents == 26100"   # 13050 + 13050
            - "TaxRemittance.${rem_fin}.swept_booking_count == 1"
            - "TaxRemittance.${rem_fin}.tax_total_cents == 13050"   # only checked-out P1
            - "TaxRemittance.${rem_fin}.tax_total_cents < TaxRemittance.${rem_est}.tax_total_cents"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: room_charge_round_per_night_then_sum
        grounds:
          - calculations.room_charge
          - entities.RatePeriod.fields.rate_multiplier_bps
          - entities.Booking.fields.room_charge_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: each night is floored to cents against its RatePeriod
          multiplier BEFORE summing; round-then-sum is pinned, so an odd multiplier produces
          a total different from sum-then-round.
        test_recipe:
          setup:
            - "Inn tax 0 bps; Room base_rate 10001; RatePeriod multiplier 13333 bps over the stay."
            - "DIRECT booking 3 nights 2026-08-10..2026-08-13."
          setup_api_calls:
            - call: "POST /inns"
              payload: { name: "Birch Inn", lodging_tax_rate_bps: 0 }
              as: Innkeeper
              captures: { inn_id: $.data.id }
            - call: "POST /inns/${inn_id}/rooms"
              payload: { inn_id: "${inn_id}", name: "Fern", base_rate_cents: 10001, max_occupancy: 2 }
              as: Innkeeper
              captures: { room_id: $.data.id }
            - call: "POST /inns/${inn_id}/rate-periods"
              payload: { inn_id: "${inn_id}", label: "Aug Peak", start_date: "2026-08-01", end_date: "2026-08-31", rate_multiplier_bps: 13333, min_nights: 1 }
              as: Innkeeper
              captures: { rp_id: $.data.id }
            - call: "POST /inns/${inn_id}/guests"
              payload: { inn_id: "${inn_id}", full_name: "Cy G", email: "cy@x.com" }
              as: Innkeeper
              captures: { guest_id: $.data.id }
          trigger:
            - call: "POST /inns/${inn_id}/bookings"
              payload: { inn_id: "${inn_id}", room_id: "${room_id}", guest_id: "${guest_id}", channel: "DIRECT", checkin_date: "2026-08-10", checkout_date: "2026-08-13", guest_count: 1 }
              as: Guest
              as_user_id: "${guest_id}"
              captures: { bk_id: $.data.id, rc: $.data.room_charge_cents }
          assert:
            # nightly = floor(10001*13333/10000) = floor(13334.3...) = 13334; *3 = 40002
            # sum-then-round of 13334.3333*3 = 40003 -> round-then-sum yields 40002 (pinned)
            - "Booking.${bk_id}.room_charge_cents == 40002"
            - "Booking.${bk_id}.total_cents == 40002"

      - name: deposit_due_nested_max_and_branch
        grounds:
          - calculations.deposit_due
          - entities.Booking.fields.deposit_due_cents
          - entities.Booking.fields.channel
        distinguishing_aspect: |
          Mode (a) >=3 inputs with non-linear interaction: deposit branches on channel, then
          applies max(percentage_of_total, first_night_charge); the first-night floor overrides
          the 30% branch, a non-linear interaction distinct from mode (b).
        test_recipe:
          setup:
            - "Inn tax 1000 bps; Room base 10000; DIRECT booking 2 nights, total 22000."
            - "30% of 22000 = 6600 < first-night 10000, so floor wins."
          setup_api_calls:
            - call: "POST /inns"
              payload: { name: "Pine Inn", lodging_tax_rate_bps: 1000 }
              as: Innkeeper
              captures: { inn_id: $.data.id }
            - call: "POST /inns/${inn_id}/rooms"
              payload: { inn_id: "${inn_id}", name: "Holly", base_rate_cents: 10000, max_occupancy: 2 }
              as: Innkeeper
              captures: { room_id: $.data.id }
            - call: "POST /inns/${inn_id}/guests"
              payload: { inn_id: "${inn_id}", full_name: "Di G", email: "di@x.com" }
              as: Innkeeper
              captures: { guest_id: $.data.id }
          trigger:
            - call: "POST /inns/${inn_id}/bookings"
              payload: { inn_id: "${inn_id}", room_id: "${room_id}", guest_id: "${guest_id}", channel: "DIRECT", checkin_date: "2026-04-10", checkout_date: "2026-04-12", guest_count: 1 }
              as: Guest
              as_user_id: "${guest_id}"
              captures: { bk_id: $.data.id, dep: $.data.deposit_due_cents }
          assert:
            - "Booking.${bk_id}.total_cents == 22000"
            - "Booking.${bk_id}.deposit_due_cents == 10000"   # max(6600, 10000) -> floor wins

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: booking_parallel_reservation_and_payment_axes
        grounds:
          - state_machines.Booking.field.reservation_status
          - state_machines.Booking.field.payment_status
          - state_machines.Booking.PENDING_to_CONFIRMED
          - state_machines.Booking.CHECKED_IN_to_CHECKED_OUT
        distinguishing_aspect: |
          Booking carries two independent state axes on the same row: reservation_status moves
          PENDING->CONFIRMED->CHECKED_IN->CHECKED_OUT while payment_status moves UNPAID->
          DEPOSIT_HELD->SETTLED, driven by the first axis — a parallel-dimension machine.
        test_recipe:
          setup:
            - "Inn tax 1000; Room base 10000; DIRECT booking, deposit covered, taken full lifecycle."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Innkeeper
            - call: "POST /inns"
              payload: { name: "Aspen Inn", lodging_tax_rate_bps: 1000 }
              as: Innkeeper
              captures: { inn_id: $.data.id }
            - call: "POST /inns/${inn_id}/rooms"
              payload: { inn_id: "${inn_id}", name: "Iris", base_rate_cents: 10000, max_occupancy: 2 }
              as: Innkeeper
              captures: { room_id: $.data.id }
            - call: "POST /inns/${inn_id}/guests"
              payload: { inn_id: "${inn_id}", full_name: "Ed G", email: "ed@x.com" }
              as: Innkeeper
              captures: { guest_id: $.data.id }
            - call: "POST /inns/${inn_id}/bookings"
              payload: { inn_id: "${inn_id}", room_id: "${room_id}", guest_id: "${guest_id}", channel: "DIRECT", checkin_date: "2026-06-10", checkout_date: "2026-06-12", guest_count: 1 }
              as: Innkeeper
              captures: { bk_id: $.data.id }
            - call: "POST /inns/${inn_id}/gift-certificates"
              payload: { inn_id: "${inn_id}", face_value_cents: 20000 }
              as: FinanceManager
              captures: { gc_id: $.data.id, gc_v: $.data.version }
            - call: "POST /inns/${inn_id}/bookings/${bk_id}/redeem-gift"
              payload: { gift_certificate_id: "${gc_id}", amount_cents: 10000, expected_gift_certificate_version: "${gc_v}" }
              as: Innkeeper
            - call: "GET /inns/${inn_id}/rooms/${room_id}"
              as: Innkeeper
              captures: { room_v: $.data.version }
            - call: "POST /inns/${inn_id}/bookings/${bk_id}/confirm"
              payload: { expected_room_version: "${room_v}" }
              as: Innkeeper
              captures: { res_after_confirm: $.data.reservation_status, pay_after_confirm: $.data.payment_status }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T16:00:00Z" }
              as: Innkeeper
            - call: "POST /inns/${inn_id}/bookings/${bk_id}/check-in"
              payload: {}
              as: Innkeeper
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-12T11:00:00Z" }
              as: Innkeeper
            - call: "POST /inns/${inn_id}/bookings/${bk_id}/check-out"
              payload: {}
              as: Innkeeper
              captures: { res_final: $.data.reservation_status, pay_final: $.data.payment_status }
          assert:
            - "Booking.${bk_id}.reservation_status == CHECKED_OUT"
            - "Booking.${bk_id}.payment_status == SETTLED"
            - "after confirm, reservation_status == CONFIRMED AND payment_status == DEPOSIT_HELD"

      - name: gift_certificate_deplete_then_restore_cycle
        grounds:
          - state_machines.GiftCertificate.ACTIVE_to_DEPLETED
          - state_machines.GiftCertificate.DEPLETED_to_ACTIVE
          - entities.GiftCertificate.fields.status
          - entities.GiftCertificate.fields.remaining_cents
        distinguishing_aspect: |
          GiftCertificate loops ACTIVE->DEPLETED (redemption to 0) and back DEPLETED->ACTIVE
          (cancellation restores balance) — a cycle on a different entity than Booking.
        test_recipe:
          setup:
            - "Inn tax 0; Room base 10000; gift of face 10000 fully redeemed against a DIRECT booking deposit (deposit_due 10000)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: Innkeeper
            - call: "POST /inns"
              payload: { name: "Willow Inn", lodging_tax_rate_bps: 0 }
              as: Innkeeper
              captures: { inn_id: $.data.id }
            - call: "POST /inns/${inn_id}/rooms"
              payload: { inn_id: "${inn_id}", name: "Lily", base_rate_cents: 10000, max_occupancy: 2 }
              as: Innkeeper
              captures: { room_id: $.data.id }
            - call: "POST /inns/${inn_id}/guests"
              payload: { inn_id: "${inn_id}", full_name: "Fi G", email: "fi@x.com" }
              as: Innkeeper
              captures: { guest_id: $.data.id }
            # 2 nights, base 10000, tax 0 -> total 20000, deposit 30% = 6000 floored to first night 10000
            - call: "POST /inns/${inn_id}/bookings"
              payload: { inn_id: "${inn_id}", room_id: "${room_id}", guest_id: "${guest_id}", channel: "DIRECT", checkin_date: "2026-03-20", checkout_date: "2026-03-22", guest_count: 1 }
              as: Innkeeper
              captures: { bk_id: $.data.id }
            - call: "POST /inns/${inn_id}/gift-certificates"
              payload: { inn_id: "${inn_id}", face_value_cents: 10000 }
              as: FinanceManager
              captures: { gc_id: $.data.id, gc_v: $.data.version }
            - call: "POST /inns/${inn_id}/bookings/${bk_id}/redeem-gift"
              payload: { gift_certificate_id: "${gc_id}", amount_cents: 10000, expected_gift_certificate_version: "${gc_v}" }
              as: Innkeeper
            - call: "GET /inns/${inn_id}/gift-certificates/${gc_id}"
              as: FinanceManager
              captures: { gc_status_after_redeem: $.data.status, gc_remaining_after_redeem: $.data.remaining_cents }
            - call: "GET /inns/${inn_id}/rooms/${room_id}"
              as: Innkeeper
              captures: { room_v: $.data.version }
            - call: "POST /inns/${inn_id}/bookings/${bk_id}/confirm"
              payload: { expected_room_version: "${room_v}" }
              as: Innkeeper
          trigger:
            # cancel 14+ days before checkin -> full refund -> restores gift to remaining 10000 -> ACTIVE again
            - call: "POST /inns/${inn_id}/bookings/${bk_id}/cancel"
              payload: {}
              as: Innkeeper
            - call: "GET /inns/${inn_id}/gift-certificates/${gc_id}"
              as: FinanceManager
              captures: { gc_final_status: $.data.status, gc_final_remaining: $.data.remaining_cents }
          assert:
            - "after redeem: GiftCertificate.${gc_id}.status == DEPLETED AND remaining_cents == 0"
            - "GiftCertificate.${gc_id}.status == ACTIVE"
            - "GiftCertificate.${gc_id}.remaining_cents == 10000"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: cancel_refund_restores_gift_flips_cert_status_depth3
        grounds:
          - state_machines.Booking.CONFIRMED_to_CANCELLED
          - calculations.cancellation_refund
          - calculations.gift_restore_on_cancel
          - state_machines.GiftCertificate.DEPLETED_to_ACTIVE
        distinguishing_aspect: |
          Depth-3 chain from one cancel: (A) Booking->CANCELLED computes refund -> (B) that refund
          restores GiftCertificate.remaining_cents -> (C) the restored balance flips the cert
          DEPLETED->ACTIVE. Each hop is caused by the prior hop, not by the cancel directly.
        test_recipe:
          setup:
            - "Inn tax 0; Room base 10000; gift face 10000 fully redeemed (DEPLETED) against a confirmed DIRECT booking; clock 20+ days before checkin."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: Innkeeper
            - call: "POST /inns"
              payload: { name: "Sage Inn", lodging_tax_rate_bps: 0 }
              as: Innkeeper
              captures: { inn_id: $.data.id }
            - call: "POST /inns/${inn_id}/rooms"
              payload: { inn_id: "${inn_id}", name: "Dahlia", base_rate_cents: 10000, max_occupancy: 2 }
              as: Innkeeper
              captures: { room_id: $.data.id }
            - call: "POST /inns/${inn_id}/guests"
              payload: { inn_id: "${inn_id}", full_name: "Gi G", email: "gi@x.com" }
              as: Innkeeper
              captures: { guest_id: $.data.id }
            - call: "POST /inns/${inn_id}/bookings"
              payload: { inn_id: "${inn_id}", room_id: "${room_id}", guest_id: "${guest_id}", channel: "DIRECT", checkin_date: "2026-03-15", checkout_date: "2026-03-17", guest_count: 1 }
              as: Innkeeper
              captures: { bk_id: $.data.id }
            - call: "POST /inns/${inn_id}/gift-certificates"
              payload: { inn_id: "${inn_id}", face_value_cents: 10000 }
              as: FinanceManager
              captures: { gc_id: $.data.id, gc_v: $.data.version }
            - call: "POST /inns/${inn_id}/bookings/${bk_id}/redeem-gift"
              payload: { gift_certificate_id: "${gc_id}", amount_cents: 10000, expected_gift_certificate_version: "${gc_v}" }
              as: Innkeeper
            - call: "GET /inns/${inn_id}/rooms/${room_id}"
              as: Innkeeper
              captures: { room_v: $.data.version }
            - call: "POST /inns/${inn_id}/bookings/${bk_id}/confirm"
              payload: { expected_room_version: "${room_v}" }
              as: Innkeeper
          trigger:
            - call: "POST /inns/${inn_id}/bookings/${bk_id}/cancel"
              payload: {}
              as: Innkeeper
              captures: { refund: $.data.refund_cents, pay: $.data.payment_status }
            - call: "GET /inns/${inn_id}/gift-certificates/${gc_id}"
              as: FinanceManager
              captures: { gc_status: $.data.status, gc_remaining: $.data.remaining_cents }
          assert:
            - "Booking.${bk_id}.refund_cents == 10000"           # 20+ days before -> full tier
            - "Booking.${bk_id}.payment_status == REFUNDED"
            - "GiftCertificate.${gc_id}.remaining_cents == 10000" # hop B restored
            - "GiftCertificate.${gc_id}.status == ACTIVE"         # hop C cert flipped back

      - name: checkout_spawns_turnover_and_bumps_room_depth2
        grounds:
          - state_machines.Booking.CHECKED_IN_to_CHECKED_OUT
          - entities.HousekeepingTask.fields.status
          - entities.HousekeepingTask.fields.ready_after
          - entities.Room.fields.version
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (check-out): (A) Booking->CHECKED_OUT -> (B) a
          PENDING HousekeepingTask is created for the room with ready_after = checkout + turnover,
          and Room.version is bumped — distinct propagation from the cancel/gift chain.
        test_recipe:
          setup:
            - "Inn turnover_minutes 180; Room base 10000; DIRECT booking taken to CHECKED_IN."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: Innkeeper
            - call: "POST /inns"
              payload: { name: "Cove Inn", lodging_tax_rate_bps: 0, turnover_minutes: 180 }
