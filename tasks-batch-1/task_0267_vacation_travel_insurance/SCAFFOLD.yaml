# =============================================================================
# Scaffold seed tables: vacation-travel-insurance (Expert)
# =============================================================================
# Domain: trip-cost coverage tiers, covered perils (cancellation / medical /
# delay / baggage), pre-existing-condition waiver window, named-storm cutoff,
# claim filing & documentation, reimbursement calculation, Cancel-For-Any-Reason
# (CFAR), free-look refund.
# =============================================================================

scenario: |
  Vacation/Travel Insurance: trip-cost coverage tiers, covered perils
  (cancellation/medical/delay/baggage), pre-existing waiver window, named-storm
  cutoff, claim filing & documentation, reimbursement calculation,
  Cancel-For-Any-Reason, free-look/refund.

domain_name: vacation-travel-insurance

# Flat topology: top-level peer collections (/plans, /travelers, /policies,
# /claims, /payouts, /refunds, /named-storms, /insured-travelers) linked by
# foreign keys. api_prefix is empty so every collection sits at the root and
# the FK reverse-reachability check resolves each collection segment.
api_prefix: ""

complexity_profile:
  primary_archetype: "Ledger reconciliation"
  secondary_archetype: "Compliance / audit"
  complexity_layers:
    - "Dual-variant calculation"
    - "Cascading side effects"
    - "Rate / threshold triggers"
    - "Optimistic concurrency"
    - "Temporal windowing"

  entity_topology: flat
  # Peer entities linked by FK; URLs are /collection/{id} with FK fields in body
  # and as filtered-list query params. No deep nesting except append-only child
  # logs (ClaimDocument, ClaimExpense) and the per-policy InsuredTraveler roster.

  state_machine_shape: parallel
  # Policy carries two independent state axes (payment_status x coverage_status);
  # Claim is cyclic (UNDER_REVIEW <-> INFO_REQUESTED). Both non-linear.

  relationship_patterns:
    - one_to_many        # Policy -> InsuredTraveler / Claim; Claim -> ClaimExpense / ClaimDocument
    - cross_aggregate    # Claim references NamedStorm; Payout references Claim and Policy
    - polymorphic        # ClaimExpense.category spans cancellation / medical / baggage line kinds

  role_model: peer_roles
  # Traveler owns policies and claims; Underwriter issues/prices policies;
  # ClaimsAdjuster adjudicates claims and disburses payouts; CarrierAdmin owns
  # configuration (plans, named-storm declarations, clock); System runs auto
  # transitions.

  consistency_model: immediate
  # All ledger fields (remaining_aggregate_cents, amount_reimbursed_cents,
  # net_premium_collected_cents) are recomputed synchronously inside the
  # mutating request.

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Plan
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Plan code, unique among Plans", constraints: "non-empty; unique" }
      - { name: tier, type: enum, source: input, description: "Coverage tier", constraints: "one of BASIC | STANDARD | PREMIER" }
      - { name: base_rate_bps, type: integer, source: input, description: "Premium base rate in basis points of insured trip cost", constraints: ">= 1" }
      - { name: cancellation_limit_pct, type: integer, source: input, description: "Trip-cancellation peril limit as percent of insured trip cost", constraints: "1..100" }
      - { name: medical_limit_cents, type: integer, source: input, description: "Per-policy emergency-medical peril aggregate limit", constraints: ">= 0" }
      - { name: delay_block_cap_cents, type: integer, source: input, description: "Reimbursement granted per completed 12-hour delay block", constraints: ">= 0" }
      - { name: delay_limit_cents, type: integer, source: input, description: "Per-policy travel-delay peril limit", constraints: ">= 0" }
      - { name: baggage_item_sublimit_cents, type: integer, source: input, description: "Per-item baggage sublimit", constraints: ">= 0" }
      - { name: baggage_limit_cents, type: integer, source: input, description: "Per-policy baggage peril limit", constraints: ">= 0" }
      - { name: baggage_depreciation_bps, type: integer, source: input, description: "Baggage depreciation in basis points applied per item before sublimit", constraints: "0..10000" }
      - { name: waiver_window_days, type: integer, source: input, description: "Days after initial trip deposit within which issuance grants the pre-existing-condition waiver", constraints: ">= 0" }
      - { name: free_look_days, type: integer, source: input, description: "Free-look window in days from issuance for a full-premium refund", constraints: ">= 0" }
      - { name: claim_filing_window_days, type: integer, source: input, description: "Days after the loss/incident date within which a claim must be filed", constraints: ">= 1" }
      - { name: cfar_loading_bps, type: integer, source: input, description: "Cancel-For-Any-Reason premium loading in basis points of base premium", constraints: ">= 0" }
      - { name: cfar_reimbursement_pct, type: integer, source: input, description: "CFAR payout percentage of insured non-refundable trip cost", constraints: "1..100" }
      - { name: senior_age_threshold, type: integer, source: input, default: 70, description: "Insured age at/above which the senior premium loading applies" }
      - { name: senior_loading_bps, type: integer, source: input, description: "Senior premium loading in basis points of base premium", constraints: ">= 0" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "Plan availability", constraints: "ACTIVE | RETIRED" }

  - name: Traveler
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Traveler login/contact email, unique among Travelers", constraints: "non-empty; unique" }
      - { name: full_name, type: string, source: input, description: "Traveler legal name" }
      - { name: date_of_birth, type: string, source: input, description: "ISO 8601 date (YYYY-MM-DD); used for age-at-departure derivation" }

  - name: Policy
    parent: null
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: input, description: "FK -> Plan.id; pins coverage tier, limits, windows and loadings at issuance" }
      - { name: owner_traveler_id, type: string, source: input, description: "FK -> Traveler.id; the Traveler who purchased and owns the policy" }
      - { name: trip_cost_cents, type: integer, source: input, description: "Total insured prepaid trip cost", constraints: ">= 1" }
      - { name: initial_deposit_at, type: datetime, source: input, description: "Timestamp of the traveler's first trip deposit; waiver window is measured from here" }
      - { name: trip_start_at, type: datetime, source: input, description: "Scheduled trip departure timestamp (UTC)" }
      - { name: trip_end_at, type: datetime, source: input, description: "Scheduled trip return timestamp (UTC); coverage period end", constraints: "> trip_start_at" }
      - { name: cfar_opted, type: boolean, source: input, default: false, description: "Whether Cancel-For-Any-Reason rider was purchased" }
      - { name: base_premium_cents, type: integer, source: computed, description: "tier base premium before loadings (see premium_quote)" }
      - { name: premium_cents, type: integer, source: computed, description: "Total premium = base + senior loading + CFAR loading (see premium_quote)" }
      - { name: aggregate_limit_cents, type: integer, source: computed, description: "Total payout capacity = cancellation_limit + medical_limit + delay_limit + baggage_limit pinned at issuance" }
      - { name: amount_reimbursed_cents, type: integer, source: computed, default: 0, description: "Sum of DISBURSED Payout.amount_cents against this policy" }
      - { name: remaining_aggregate_cents, type: integer, source: computed, description: "= aggregate_limit_cents - amount_reimbursed_cents (conserved quantity)" }
      - { name: net_premium_collected_cents, type: integer, source: computed, default: 0, description: "= premium_cents (when PAID) - sum(COMPLETED Refund.amount_cents); 0 while payment_status=PENDING (conserved quantity)" }
      - { name: preexisting_waiver_granted, type: boolean, source: computed, description: "True iff issued within Plan.waiver_window_days of initial_deposit_at AND full trip cost insured" }
      - { name: issued_at, type: datetime, source: system, description: "Server clock at issuance; null while QUOTED" }
      - { name: free_look_ends_at, type: datetime, source: computed, description: "= issued_at + Plan.free_look_days; null while QUOTED" }
      - { name: payment_status, type: enum, source: system, default: "PENDING", description: "Premium payment axis", constraints: "PENDING | PAID | REFUNDED" }
      - { name: coverage_status, type: enum, source: system, default: "QUOTED", description: "Coverage lifecycle axis", constraints: "QUOTED | ACTIVE | EXPIRED | CANCELLED | EXHAUSTED" }
      - { name: version, type: integer, source: system, default: 1, description: "OCC version; increments on every mutation including cascades" }

  - name: InsuredTraveler
    parent: Policy
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: system, description: "FK -> Policy.id; the policy this person is insured under" }
      - { name: traveler_id, type: string, source: input, description: "FK -> Traveler.id; the underlying Traveler record" }
      - { name: age_at_departure, type: integer, source: input, description: "Insured age as of trip_start_at; drives senior loading", constraints: ">= 0" }
      - { name: has_preexisting_condition, type: boolean, source: input, default: false, description: "Whether the insured declared a pre-existing medical condition" }
      - { name: covered_trip_cost_cents, type: integer, source: input, description: "Portion of trip_cost attributed to this insured", constraints: ">= 0" }
      - { name: status, type: enum, source: system, default: "COVERED", description: "Per-insured coverage state", constraints: "COVERED | REMOVED" }

  - name: NamedStorm
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Storm name, unique among NamedStorms", constraints: "non-empty; unique" }
      - { name: basin, type: enum, source: input, description: "Ocean basin", constraints: "ATLANTIC | EAST_PACIFIC | WEST_PACIFIC | INDIAN" }
      - { name: named_at, type: datetime, source: input, description: "Timestamp the storm was officially named; the cutoff boundary for cancellation coverage" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "Storm record state", constraints: "ACTIVE | DISSIPATED" }

  - name: Claim
    parent: null
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: input, description: "FK -> Policy.id; the policy the claim is filed against" }
      - { name: insured_traveler_id, type: string, source: input, description: "FK -> InsuredTraveler.id; the insured the claim concerns" }
      - { name: named_storm_id, type: string, source: input, description: "FK -> NamedStorm.id; cited storm for a storm-driven cancellation (omit otherwise)" }
      - { name: peril, type: enum, source: input, description: "Covered peril", constraints: "CANCELLATION | MEDICAL | DELAY | BAGGAGE" }
      - { name: cancellation_reason, type: enum, source: input, description: "Why the trip was cancelled (CANCELLATION peril only)", constraints: "COVERED_REASON | CFAR | NAMED_STORM" }
      - { name: incident_at, type: datetime, source: input, description: "Loss/incident timestamp; claim_filing_window measured from here" }
      - { name: delay_hours, type: integer, source: input, default: 0, description: "Reported delay duration in whole hours (DELAY peril only)", constraints: ">= 0" }
      - { name: involves_preexisting, type: boolean, source: input, default: false, description: "Whether the medical loss stems from a pre-existing condition (MEDICAL peril only)" }
      - { name: provisional_amount_cents, type: integer, source: computed, description: "Reimbursement estimate computed at submission (documented-loss basis)" }
      - { name: approved_amount_cents, type: integer, source: computed, default: 0, description: "Final reimbursement computed at approval (net-of-supplier-refund basis), capped by remaining aggregate" }
      - { name: denial_reason, type: string, source: system, description: "Set when a claim is DENIED" }
      - { name: status, type: enum, source: system, default: "SUBMITTED", description: "Claim lifecycle", constraints: "SUBMITTED | UNDER_REVIEW | INFO_REQUESTED | APPROVED | DENIED | PAID" }
      - { name: version, type: integer, source: system, default: 1, description: "OCC version; increments on every mutation" }

  - name: ClaimExpense
    parent: Claim
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: system, description: "FK -> Claim.id; the claim this line belongs to" }
      - { name: category, type: enum, source: input, description: "Expense kind", constraints: "PREPAID_TRIP | MEDICAL_BILL | BAGGAGE_ITEM | DELAY_EXPENSE" }
      - { name: description, type: string, source: input, description: "Free-text line description" }
      - { name: documented_amount_cents, type: integer, source: input, description: "Documented loss for this line", constraints: ">= 0" }
      - { name: prepaid_nonrefundable_cents, type: integer, source: input, default: 0, description: "Non-refundable prepaid portion (CANCELLATION basis)", constraints: ">= 0" }
      - { name: supplier_refund_received_cents, type: integer, source: input, default: 0, description: "Refund already received from the supplier for this line (subtracted at approval)", constraints: ">= 0" }
      - { name: item_value_cents, type: integer, source: input, default: 0, description: "Original item value before depreciation (BAGGAGE_ITEM basis)", constraints: ">= 0" }

  - name: ClaimDocument
    parent: Claim
    common_fields: false
    fields:
      - { name: claim_id, type: string, source: system, description: "FK -> Claim.id; the claim this document supports" }
      - { name: doc_type, type: enum, source: input, description: "Documentation kind", constraints: "RECEIPT | MEDICAL_REPORT | CARRIER_DELAY_LETTER | POLICE_REPORT | OTHER" }
      - { name: file_ref, type: string, source: input, description: "Opaque storage reference for the uploaded file" }
      - { name: uploaded_by_traveler_id, type: string, source: system, description: "X-User-ID of the Traveler who uploaded it" }

  - name: Payout
    parent: null
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: input, description: "FK -> Claim.id; the approved claim being paid" }
      - { name: policy_id, type: string, source: system, description: "FK -> Policy.id; copied from the claim for ledger reconciliation" }
      - { name: amount_cents, type: integer, source: system, description: "= Claim.approved_amount_cents at payout creation", constraints: ">= 0" }
      - { name: status, type: enum, source: system, default: "PENDING", description: "Payout lifecycle", constraints: "PENDING | DISBURSED | REVERSED" }

  - name: Refund
    parent: null
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: input, description: "FK -> Policy.id; the policy whose premium is being returned" }
      - { name: refund_type, type: enum, source: system, description: "Basis of the refund", constraints: "FREE_LOOK | SHORT_RATE" }
      - { name: amount_cents, type: integer, source: computed, description: "Premium returned (see premium_refund)" }
      - { name: status, type: enum, source: system, default: "PENDING", description: "Refund lifecycle", constraints: "PENDING | COMPLETED | VOIDED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  # --- Policy: PARALLEL state dimensions (payment_status x coverage_status) ---
  - entity: Policy
    initial_state: "QUOTED/PENDING"
    terminal_states: ["CANCELLED", "EXPIRED", "EXHAUSTED"]
    note: |
      Two independent axes. coverage_status ∈ {QUOTED, ACTIVE, EXPIRED, CANCELLED,
      EXHAUSTED}; payment_status ∈ {PENDING, PAID, REFUNDED}. The transitions below
      are grouped by axis; a single mutation may advance one axis without touching
      the other (e.g. record_payment moves payment PENDING->PAID while coverage
      stays QUOTED).
    transitions:
      # coverage axis
      - from: "coverage:QUOTED"
        to: "coverage:ACTIVE"
        trigger: "POST /policies/{policyId}/issue"
        actor: Underwriter
        preconditions:
          - "coverage_status == QUOTED (else ERR_INVALID_STATE)"
          - "payment_status == PAID (else ERR_PREMIUM_NOT_PAID)"
          - "At least one InsuredTraveler with status COVERED (else ERR_NO_INSURED_TRAVELER)"
          - "sum(InsuredTraveler.covered_trip_cost_cents where COVERED) == trip_cost_cents (else ERR_TRIP_COST_MISMATCH)"
        side_effects:
          - "Set issued_at = current server clock"
          - "Compute free_look_ends_at = issued_at + Plan.free_look_days"
          - "Pin aggregate_limit_cents from Plan limits; remaining_aggregate_cents = aggregate_limit_cents; amount_reimbursed_cents = 0"
          - "Compute preexisting_waiver_granted (waiver_window + full-cost test)"
          - "increments Policy.version by 1"
      - from: "coverage:ACTIVE"
        to: "coverage:CANCELLED"
        trigger: "POST /policies/{policyId}/free-look-cancel"
        actor: "Traveler | System"
        preconditions:
          - "coverage_status == ACTIVE (else ERR_INVALID_STATE)"
          - "current clock <= free_look_ends_at (else ERR_FREE_LOOK_EXPIRED)"
          - "No Claim against this policy in {SUBMITTED, UNDER_REVIEW, INFO_REQUESTED, APPROVED, PAID} (else ERR_POLICY_HAS_CLAIMS)"
        side_effects:
          - "coverage_status -> CANCELLED"
          - "CASCADE L1->L2: auto-create Refund(refund_type=FREE_LOOK, status=COMPLETED) for full premium_cents (premium_refund free_look variant); free-look refunds are auto-completed, not left for underwriter review"
          - "CASCADE L2->L3: that COMPLETED Refund sets payment_status -> REFUNDED and recomputes net_premium_collected_cents = premium_cents - sum(COMPLETED Refund.amount_cents)"
          - "Set all InsuredTraveler.status -> REMOVED"
          - "increments Policy.version by 1"
      - from: "coverage:ACTIVE"
        to: "coverage:CANCELLED"
        trigger: "POST /policies/{policyId}/cancel"
        actor: "Traveler"
        preconditions:
          - "coverage_status == ACTIVE (else ERR_INVALID_STATE)"
          - "current clock > free_look_ends_at (else ERR_INVALID_STATE — use free-look-cancel inside the window)"
          - "current clock < trip_start_at (else ERR_COVERAGE_PERIOD_STARTED)"
          - "No Claim against this policy in {SUBMITTED, UNDER_REVIEW, INFO_REQUESTED, APPROVED, PAID} (else ERR_POLICY_HAS_CLAIMS)"
        side_effects:
          - "coverage_status -> CANCELLED"
          - "Auto-create Refund(refund_type=SHORT_RATE, status=PENDING) for premium_refund short_rate variant"
          - "increments Policy.version by 1"
      - from: "coverage:ACTIVE"
        to: "coverage:EXPIRED"
        trigger: "system (advance_clock past trip_end_at with coverage_status ACTIVE)"
        actor: system
        preconditions:
          - "coverage_status == ACTIVE"
          - "current clock >= trip_end_at"
        side_effects:
          - "coverage_status -> EXPIRED"
          - "increments Policy.version by 1"
      - from: "coverage:ACTIVE"
        to: "coverage:EXHAUSTED"
        trigger: "system (cascade from Payout disbursement when remaining_aggregate_cents reaches 0)"
        actor: system
        preconditions:
          - "remaining_aggregate_cents == 0 after a Payout disbursement"
        side_effects:
          - "coverage_status -> EXHAUSTED"
          - "CASCADE L3->L4: auto-DENY every sibling Claim still in {SUBMITTED, UNDER_REVIEW, INFO_REQUESTED} with denial_reason='AGGREGATE_EXHAUSTED'"
          - "increments Policy.version by 1"
      # payment axis
      - from: "payment:PENDING"
        to: "payment:PAID"
        trigger: "POST /policies/{policyId}/record-payment"
        actor: "Underwriter | Traveler"
        preconditions:
          - "payment_status == PENDING (else ERR_INVALID_STATE)"
          - "expected_policy_version matches Policy.version (else ERR_STALE_VERSION)"
        side_effects:
          - "payment_status -> PAID"
          - "net_premium_collected_cents = premium_cents"
          - "increments Policy.version by 1"
      - from: "payment:PAID"
        to: "payment:REFUNDED"
        trigger: "system (cascade from Refund completion)"
        actor: system
        preconditions:
          - "A COMPLETED Refund exists for this policy"
        side_effects:
          - "payment_status -> REFUNDED"
          - "net_premium_collected_cents = premium_cents - sum(COMPLETED Refund.amount_cents)"
          - "increments Policy.version by 1"

  # --- Claim: CYCLIC (UNDER_REVIEW <-> INFO_REQUESTED) ---
  - entity: Claim
    initial_state: SUBMITTED
    terminal_states: [DENIED, PAID]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /claims/{claimId}/start-review"
        actor: ClaimsAdjuster
        preconditions:
          - "status == SUBMITTED (else ERR_INVALID_STATE)"
        side_effects:
          - "increments Claim.version by 1"
      - from: UNDER_REVIEW
        to: INFO_REQUESTED
        trigger: "POST /claims/{claimId}/request-info"
        actor: ClaimsAdjuster
        preconditions:
          - "status == UNDER_REVIEW (else ERR_INVALID_STATE)"
        side_effects:
          - "increments Claim.version by 1"
      - from: INFO_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /claims/{claimId}/resubmit"
        actor: Traveler
        preconditions:
          - "status == INFO_REQUESTED (else ERR_INVALID_STATE)"
          - "At least one ClaimDocument exists for this claim (else ERR_DOCUMENTATION_MISSING)"
        side_effects:
          - "Recompute provisional_amount_cents from current ClaimExpense lines"
          - "increments Claim.version by 1"
        note: "Revision loop: a claim may cycle UNDER_REVIEW -> INFO_REQUESTED -> UNDER_REVIEW any number of times."
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /claims/{claimId}/approve"
        actor: ClaimsAdjuster
        preconditions:
          - "status == UNDER_REVIEW (else ERR_INVALID_STATE)"
          - "Policy.coverage_status == ACTIVE (else ERR_POLICY_NOT_ACTIVE)"
          - "Filing deadline (one-sided): current_clock <= incident_at + Plan.claim_filing_window_days (else ERR_FILING_WINDOW_CLOSED)"
          - "For MEDICAL + involves_preexisting: Policy.preexisting_waiver_granted == true (else ERR_PREEXISTING_NOT_WAIVED)"
          - "For CANCELLATION + cancellation_reason==NAMED_STORM: Policy.issued_at < NamedStorm.named_at (else ERR_NAMED_STORM_CUTOFF)"
          - "For DELAY: delay_hours >= Plan-derived MIN_DELAY_HOURS=12 (else ERR_DELAY_BELOW_THRESHOLD)"
          - "At least one ClaimDocument exists (else ERR_DOCUMENTATION_MISSING)"
        side_effects:
          - "Compute approved_amount_cents (final basis), capped at min(peril limit, Policy.remaining_aggregate_cents)"
          - "status -> APPROVED"
          - "increments Claim.version by 1"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /claims/{claimId}/deny"
        actor: ClaimsAdjuster
        preconditions:
          - "status == UNDER_REVIEW (else ERR_INVALID_STATE)"
        side_effects:
          - "Set denial_reason from request"
          - "status -> DENIED"
          - "increments Claim.version by 1"
      - from: SUBMITTED
        to: DENIED
        trigger: "system (cascade L3->L4 from Policy EXHAUSTED) OR POST /claims/{claimId}/deny after start-review"
        actor: system
        preconditions:
          - "Policy.coverage_status transitioned to EXHAUSTED"
        side_effects:
          - "denial_reason = 'AGGREGATE_EXHAUSTED'"
          - "status -> DENIED"
          - "increments Claim.version by 1"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "system (cascade L3->L4 from Policy EXHAUSTED)"
        actor: system
        preconditions:
          - "Policy.coverage_status transitioned to EXHAUSTED"
        side_effects:
          - "denial_reason = 'AGGREGATE_EXHAUSTED'"
          - "status -> DENIED"
          - "increments Claim.version by 1"
      - from: INFO_REQUESTED
        to: DENIED
        trigger: "system (cascade L3->L4 from Policy EXHAUSTED)"
        actor: system
        preconditions:
          - "Policy.coverage_status transitioned to EXHAUSTED"
        side_effects:
          - "denial_reason = 'AGGREGATE_EXHAUSTED'"
          - "status -> DENIED"
          - "increments Claim.version by 1"
      - from: APPROVED
        to: PAID
        trigger: "system (cascade from Payout disbursement)"
        actor: system
        preconditions:
          - "A DISBURSED Payout references this claim"
        side_effects:
          - "status -> PAID"
          - "increments Claim.version by 1"

  # --- Payout: linear with compensating reversal ---
  - entity: Payout
    initial_state: PENDING
    terminal_states: [REVERSED]
    transitions:
      - from: PENDING
        to: DISBURSED
        trigger: "POST /payouts/{payoutId}/disburse"
        actor: ClaimsAdjuster
        preconditions:
          - "status == PENDING (else ERR_INVALID_STATE)"
          - "Claim.status == APPROVED (else ERR_CLAIM_NOT_APPROVED)"
          - "amount_cents <= Policy.remaining_aggregate_cents (else ERR_AGGREGATE_LIMIT_EXCEEDED)"
        side_effects:
          - "status -> DISBURSED"
          - "CASCADE L1->L2: Policy.amount_reimbursed_cents += amount_cents; remaining_aggregate_cents = aggregate_limit_cents - amount_reimbursed_cents"
          - "CASCADE L2->L3: if remaining_aggregate_cents == 0 then Policy.coverage_status -> EXHAUSTED (which itself fires L3->L4 on sibling claims)"
          - "Linked Claim.status -> PAID"
          - "increments Policy.version by 1"
      - from: PENDING
        to: REVERSED
        trigger: "POST /payouts/{payoutId}/reverse"
        actor: ClaimsAdjuster
        preconditions:
          - "status == PENDING (else ERR_INVALID_STATE)"
        side_effects:
          - "status -> REVERSED"
      - from: DISBURSED
        to: REVERSED
        trigger: "POST /payouts/{payoutId}/reverse"
        actor: ClaimsAdjuster
        preconditions:
          - "status == DISBURSED (else ERR_INVALID_STATE)"
        side_effects:
          - "status -> REVERSED"
          - "COMPENSATION: Policy.amount_reimbursed_cents -= amount_cents; remaining_aggregate_cents = aggregate_limit_cents - amount_reimbursed_cents (restores conserved aggregate)"
          - "If Policy.coverage_status == EXHAUSTED and remaining_aggregate_cents > 0: coverage_status -> ACTIVE"
          - "Linked Claim.status -> APPROVED (reverses the PAID transition)"
          - "increments Policy.version by 1"

  # --- Refund: linear with compensating void ---
  - entity: Refund
    initial_state: PENDING
    terminal_states: [COMPLETED, VOIDED]
    transitions:
      - from: PENDING
        to: COMPLETED
        trigger: "POST /refunds/{refundId}/complete"
        actor: "Underwriter | System"
        preconditions:
          - "status == PENDING (else ERR_INVALID_STATE)"
          - "Policy.payment_status != REFUNDED already by a prior COMPLETED refund (else ERR_INVALID_STATE)"
        side_effects:
          - "status -> COMPLETED"
          - "CASCADE: Policy.payment_status -> REFUNDED; net_premium_collected_cents = premium_cents - sum(COMPLETED Refund.amount_cents)"
          - "increments Policy.version by 1"
      - from: PENDING
        to: VOIDED
        trigger: "POST /refunds/{refundId}/void"
        actor: Underwriter
        preconditions:
          - "status == PENDING (else ERR_INVALID_STATE)"
        side_effects:
          - "status -> VOIDED"

  # --- NamedStorm: linear ---
  - entity: NamedStorm
    initial_state: ACTIVE
    terminal_states: [DISSIPATED]
    transitions:
      - from: ACTIVE
        to: DISSIPATED
        trigger: "POST /named-storms/{stormId}/dissipate"
        actor: CarrierAdmin
        preconditions:
          - "status == ACTIVE (else ERR_INVALID_STATE)"
        side_effects:
          - "status -> DISSIPATED"

# -----------------------------------------------------------------------------
# 1.2.1 Concurrency Rules
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: record-payment-stale-policy
    parent_entity: Policy
    write_endpoint: "POST /policies/{policyId}/record-payment"
    occ_field: "expected_policy_version"
    description: |
      Recording premium payment against a Policy whose version has advanced
      since the client last observed it is rejected. Premium settlement legitimately
      succeeds against a PENDING policy, so two strictly sequential record-payment
      requests carrying the same observed version are not separable by state alone;
      OCC on Policy.version reduces this to a stale-version check — the second
      request's expected_policy_version no longer matches and is rejected.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: premium_quote
    trigger: "POST /policies (quote) and recomputed on add/remove InsuredTraveler while QUOTED"
    algorithm: tiered_pricing
    formula: |
      # combinatorial, mode (a): >=3 inputs with tiered selection + conditional loadings
      base_premium_cents = ceil(trip_cost_cents * Plan.base_rate_bps / 10000)
      senior_present = any InsuredTraveler(status=COVERED).age_at_departure >= Plan.senior_age_threshold
      senior_loading_cents = ceil(base_premium_cents * Plan.senior_loading_bps / 10000) if senior_present else 0
      cfar_loading_cents   = ceil(base_premium_cents * Plan.cfar_loading_bps   / 10000) if cfar_opted else 0
      premium_cents = base_premium_cents + senior_loading_cents + cfar_loading_cents
    input_set: "InsuredTraveler rows with status=COVERED on the QUOTED policy"
    constants:
      ROUNDING: "ceil to whole cents on each loading term independently"
    precision: "whole cents; ceil per term"
    variants: []

  - name: cancellation_reimbursement
    trigger: "claim submission (provisional) and claim approval (final) for peril=CANCELLATION"
    algorithm: forward_looking
    formula: |
      # Per-line over ClaimExpense rows with category=PREPAID_TRIP on the claim.
      provisional (at submission, documented-loss basis):
        provisional_amount_cents = min( SUM_line min(documented_amount_cents, prepaid_nonrefundable_cents),
                                         peril_cap, Policy.remaining_aggregate_cents )
      final (at approval, net-of-supplier-refund basis):
        final_raw = SUM_line max(0, prepaid_nonrefundable_cents - supplier_refund_received_cents)
        if cancellation_reason == CFAR: final_raw = floor(final_raw * Plan.cfar_reimbursement_pct / 100)
        approved_amount_cents = min(final_raw, peril_cap, Policy.remaining_aggregate_cents)
      where peril_cap = floor(trip_cost_cents * Plan.cancellation_limit_pct / 100)
    input_set: "ClaimExpense(category=PREPAID_TRIP) for the claim; supplier_refund subtracted only in the final variant"
    constants:
      ROUNDING: "floor on CFAR percentage and cap multiplications"
    precision: "whole cents"
    variants:
      - name: provisional
        when: "computed at submission and on resubmit"
        difference: "uses documented_amount/prepaid; ignores supplier_refund_received_cents and CFAR percentage"
      - name: final
        when: "computed at approval"
        difference: "subtracts supplier_refund_received_cents per line and applies cfar_reimbursement_pct for CFAR; this is the figure paid"

  - name: premium_refund
    trigger: "Refund auto-creation on free-look-cancel (FREE_LOOK) or cancel (SHORT_RATE)"
    algorithm: chronological
    formula: |
      free_look variant (cancellation at/within free_look_ends_at):
        amount_cents = Policy.premium_cents               # full premium returned
      short_rate variant (cancellation after free-look, before trip_start_at):
        coverage_period_days = ceil((trip_end_at - issued_at) / 1 day)
        elapsed_days = floor((current_clock - issued_at) / 1 day)
        unearned_cents = floor(Policy.premium_cents * (coverage_period_days - elapsed_days) / coverage_period_days)
        amount_cents = max(0, unearned_cents - SHORT_RATE_ADMIN_FEE_CENTS)
    input_set: "single Policy; no aggregation across policies"
    constants:
      SHORT_RATE_ADMIN_FEE_CENTS: 2500
    precision: "whole cents; floor on proration, then subtract flat admin fee"
    variants:
      - name: free_look
        when: "cancellation timestamp <= free_look_ends_at"
        difference: "full premium, no admin fee, no proration"
      - name: short_rate
        when: "cancellation after free-look window but before trip start"
        difference: "pro-rates unearned premium by remaining coverage days, then deducts a flat admin fee"

  - name: delay_reimbursement
    trigger: "claim approval for peril=DELAY"
    algorithm: threshold
    formula: |
      # combinatorial threshold; boundary at delay_hours >= 12
      if delay_hours < MIN_DELAY_HOURS: not covered (ERR_DELAY_BELOW_THRESHOLD at approval)
      blocks = floor(delay_hours / MIN_DELAY_HOURS)
      raw = blocks * Plan.delay_block_cap_cents
      approved_amount_cents = min(raw, Plan.delay_limit_cents, Policy.remaining_aggregate_cents)
    input_set: "single Claim; uses Claim.delay_hours and Plan delay constants"
    constants:
      MIN_DELAY_HOURS: 12
    precision: "whole cents"
    variants: []

  - name: baggage_reimbursement
    trigger: "claim approval for peril=BAGGAGE"
    algorithm: aggregation
    formula: |
      # combinatorial, mode (b): rounding order PINNED — round depreciation PER ITEM,
      # THEN apply sublimit PER ITEM, THEN sum, THEN cap. (Sum-then-round is wrong.)
      for each ClaimExpense(category=BAGGAGE_ITEM):
        depreciated_cents = round_half_up(item_value_cents * (10000 - Plan.baggage_depreciation_bps) / 10000)
        covered_item_cents = min(depreciated_cents, Plan.baggage_item_sublimit_cents)
      total = SUM_item covered_item_cents
      approved_amount_cents = min(total, Plan.baggage_limit_cents, Policy.remaining_aggregate_cents)
    input_set: "ClaimExpense(category=BAGGAGE_ITEM) for the claim"
    constants:
      ROUNDING: "round_half_up per item BEFORE summation"
    precision: "whole cents; per-item rounding pinned before sum"
    variants: []

  - name: medical_reimbursement
    trigger: "claim approval for peril=MEDICAL"
    algorithm: aggregation
    formula: |
      raw = SUM over ClaimExpense(category=MEDICAL_BILL) of max(0, documented_amount_cents - supplier_refund_received_cents)
      approved_amount_cents = min(raw, Plan.medical_limit_cents, Policy.remaining_aggregate_cents)
    input_set: "ClaimExpense(category=MEDICAL_BILL) for the claim"
    constants: {}
    precision: "whole cents"
    variants: []

  - name: preexisting_waiver_eligibility
    trigger: "policy issuance"
    algorithm: threshold
    formula: |
      days_to_issue = floor((issued_at - initial_deposit_at) / 1 day)
      full_cost_insured = (sum(InsuredTraveler.covered_trip_cost_cents where COVERED) == trip_cost_cents)
      preexisting_waiver_granted = (days_to_issue <= Plan.waiver_window_days) AND full_cost_insured
    input_set: "Policy + its COVERED InsuredTraveler rows at issuance"
    constants: {}
    precision: "whole days; floor"
    variants: []

  - name: aggregate_limit_pin
    trigger: "policy issuance"
    algorithm: aggregation
    formula: |
      cancellation_limit_cents = floor(trip_cost_cents * Plan.cancellation_limit_pct / 100)
      aggregate_limit_cents = cancellation_limit_cents + Plan.medical_limit_cents + Plan.delay_limit_cents + Plan.baggage_limit_cents
      remaining_aggregate_cents = aggregate_limit_cents
    input_set: "single Policy + its Plan at issuance"
    constants: {}
    precision: "whole cents"
    variants: []

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_AUTH
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per §1.7"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path and FK resources exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all resource endpoints

  - priority: 4
    category: business_referential
    check: "Acting Traveler must own the policy/claim they mutate (X-User-ID == Policy.owner_traveler_id / Claim's policy owner)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "Traveler-initiated policy and claim mutations"

  - priority: 5
    category: business_constraint
    check: "Request body well-formed: required fields present, enums valid, integers non-negative where constrained"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all write endpoints

  - priority: 6
    category: state
    check: "Target resource in a state that permits the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all transition endpoints

  - priority: 7
    category: state
    check: "OCC: expected_policy_version equals Policy.version on record-payment"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /policies/{policyId}/record-payment"

  # ---- Claim-approval business gates, ordered. Safety/eligibility gates run
  #      BEFORE fiscal capacity gates. ----
  - priority: 8
    category: business_referential
    check: "Claim approval requires Policy.coverage_status == ACTIVE"
    error_id: ERR_POLICY_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /claims/{claimId}/approve; POST /claims"

  - priority: 9
    category: business_temporal
    check: "Filing deadline only (one-sided): reject when current_clock > incident_at + Plan.claim_filing_window_days. A claim filed at or before incident_at is always within the window (the window is a lateness deadline, not an earliest-filing gate)."
    error_id: ERR_FILING_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /claims (submission) and POST /claims/{claimId}/approve"

  - priority: 10
    category: business_safety
    check: "MEDICAL claim with involves_preexisting requires Policy.preexisting_waiver_granted == true"
    error_id: ERR_PREEXISTING_NOT_WAIVED
    http_status: 409
    applies_to: "POST /claims/{claimId}/approve (MEDICAL)"

  - priority: 11
    category: business_constraint
    check: "CANCELLATION claim with cancellation_reason==NAMED_STORM requires Policy.issued_at < NamedStorm.named_at"
    error_id: ERR_NAMED_STORM_CUTOFF
    http_status: 409
    applies_to: "POST /claims/{claimId}/approve (CANCELLATION/NAMED_STORM)"

  - priority: 12
    category: business_constraint
    check: "DELAY claim requires delay_hours >= 12"
    error_id: ERR_DELAY_BELOW_THRESHOLD
    http_status: 409
    applies_to: "POST /claims/{claimId}/approve (DELAY)"

  - priority: 13
    category: business_constraint
    check: "Claim approval / resubmit requires at least one ClaimDocument"
    error_id: ERR_DOCUMENTATION_MISSING
    http_status: 409
    applies_to: "POST /claims/{claimId}/approve; POST /claims/{claimId}/resubmit"

  - priority: 14
    category: business_temporal
    check: "Per-insured trip-coverage intervals on the same Traveler must not overlap (half-open [trip_start_at, trip_end_at); adjacency allowed)"
    error_id: ERR_COVERAGE_OVERLAP
    http_status: 409
    applies_to: "POST /policies/{policyId}/insured-travelers; POST /policies/{policyId}/issue"

  - priority: 15
    category: business_temporal
    check: "Two DELAY claims on the same policy whose covered delay windows fall within DELAY_MERGE_BUFFER_HOURS=6 are the same event; the second is rejected (closed interval + buffer)"
    error_id: ERR_DELAY_EVENT_OVERLAP
    http_status: 409
    applies_to: "POST /claims (DELAY peril)"

  - priority: 16
    category: business_fiscal
    check: "Payout disbursement amount must not exceed Policy.remaining_aggregate_cents"
    error_id: ERR_AGGREGATE_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /payouts/{payoutId}/disburse"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Test-driving: clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's current UTC clock (test-driving; advances trigger EXPIRED transitions)"
    roles: [CarrierAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects:
      - "current_clock = to_iso8601"
      - "Policy with coverage_status ACTIVE and current_clock >= trip_end_at -> EXPIRED"

  # ---- Plan ----
  - method: POST
    path: "/plans"
    description: "Create a coverage plan (tier config)"
    roles: [CarrierAdmin]
    code: 201
    input: [code, tier, base_rate_bps, cancellation_limit_pct, medical_limit_cents, delay_block_cap_cents, delay_limit_cents, baggage_item_sublimit_cents, baggage_limit_cents, baggage_depreciation_bps, waiver_window_days, free_look_days, claim_filing_window_days, cfar_loading_bps, cfar_reimbursement_pct, "senior_age_threshold?", senior_loading_bps]
    output: Plan
    side_effects: ["status=ACTIVE; ERR_DUPLICATE_CODE if code in use"]
  - method: GET
    path: "/plans/{planId}"
    description: "Get a plan"
    roles: [Any]
    code: 200
    input: []
    output: Plan
    side_effects: []
  - method: GET
    path: "/plans"
    description: "List plans"
    roles: [Any]
    code: 200
    input: ["tier?", "status?"]
    output: "Plan[]"
    side_effects: []
  - method: POST
    path: "/plans/{planId}/retire"
    description: "Retire a plan (no new policies)"
    roles: [CarrierAdmin]
    code: 200
    input: []
    output: Plan
    side_effects: ["status -> RETIRED"]

  # ---- Traveler ----
  - method: POST
    path: "/travelers"
    description: "Register a traveler account"
    roles: [CarrierAdmin, Traveler]
    code: 201
    input: [email, full_name, date_of_birth]
    output: Traveler
    side_effects: ["ERR_DUPLICATE_EMAIL if email in use"]
  - method: GET
    path: "/travelers/{travelerId}"
    description: "Get a traveler"
    roles: [Any]
    code: 200
    input: []
    output: Traveler
    side_effects: []

  # ---- Named Storm ----
  - method: POST
    path: "/named-storms"
    description: "Declare a named storm (cutoff reference)"
    roles: [CarrierAdmin]
    code: 201
    input: [name, basin, named_at]
    output: NamedStorm
    side_effects: ["status=ACTIVE; ERR_DUPLICATE_NAME if name in use"]
  - method: GET
    path: "/named-storms/{stormId}"
    description: "Get a named storm"
    roles: [Any]
    code: 200
    input: []
    output: NamedStorm
    side_effects: []
  - method: GET
    path: "/named-storms"
    description: "List named storms"
    roles: [Any]
    code: 200
    input: ["basin?", "status?"]
    output: "NamedStorm[]"
    side_effects: []
  - method: POST
    path: "/named-storms/{stormId}/dissipate"
    description: "Mark a named storm dissipated"
    roles: [CarrierAdmin]
    code: 200
    input: []
    output: NamedStorm
    side_effects: ["status -> DISSIPATED"]

  # ---- Policy ----
  - method: POST
    path: "/policies"
    description: "Create a QUOTED policy; computes base_premium_cents and premium_cents"
    roles: [Underwriter, Traveler]
    code: 201
    input: [plan_id, owner_traveler_id, trip_cost_cents, initial_deposit_at, trip_start_at, trip_end_at, "cfar_opted?"]
    output: Policy
    side_effects:
      - "coverage_status=QUOTED, payment_status=PENDING"
      - "Compute base_premium_cents, premium_cents via premium_quote (no insured travelers yet -> senior loading 0 until added)"
  - method: GET
    path: "/policies/{policyId}"
    description: "Get a policy"
    roles: [Any]
    code: 200
    input: []
    output: Policy
    side_effects: []
  - method: GET
    path: "/policies"
    description: "List policies (filtered)"
    roles: [Any]
    code: 200
    input: ["plan_id?", "owner_traveler_id?", "coverage_status?", "payment_status?"]
    output: "Policy[]"
    side_effects: []
  - method: POST
    path: "/policies/{policyId}/insured-travelers"
    description: "Add an insured traveler to a QUOTED policy"
    roles: [Underwriter, Traveler]
    code: 201
    input: [traveler_id, age_at_departure, covered_trip_cost_cents, "has_preexisting_condition?"]
    output: InsuredTraveler
    side_effects:
      - "status=COVERED"
      - "Recompute Policy.premium_cents via premium_quote (senior loading if age >= threshold)"
      - "Enforce ERR_COVERAGE_OVERLAP against the traveler's other policies"
      - "increments Policy.version by 1"
  - method: GET
    path: "/policies/{policyId}/insured-travelers"
    description: "List insured travelers on a policy"
    roles: [Any]
    code: 200
    input: []
    output: "InsuredTraveler[]"
    side_effects: []
  - method: GET
    path: "/insured-travelers/{insuredTravelerId}"
    description: "Get an insured-traveler record"
    roles: [Any]
    code: 200
    input: []
    output: InsuredTraveler
    side_effects: []
  - method: GET
    path: "/insured-travelers"
    description: "List insured-traveler records (filtered)"
    roles: [Any]
    code: 200
    input: ["policy_id?", "traveler_id?", "status?"]
    output: "InsuredTraveler[]"
    side_effects: []
  - method: POST
    path: "/policies/{policyId}/record-payment"
    description: "Record premium payment (OCC-guarded); payment_status PENDING -> PAID"
    roles: [Underwriter, Traveler]
    code: 200
    input: [expected_policy_version]
    output: Policy
    side_effects:
      - "payment_status -> PAID"
      - "net_premium_collected_cents = premium_cents"
      - "increments Policy.version by 1"
  - method: POST
    path: "/policies/{policyId}/issue"
    description: "Issue (activate) a paid policy; pins limits, waiver, free-look window"
    roles: [Underwriter]
    code: 200
    input: []
    output: Policy
    side_effects:
      - "coverage_status QUOTED -> ACTIVE"
      - "Set issued_at, free_look_ends_at; pin aggregate_limit_cents; remaining_aggregate_cents = aggregate_limit_cents"
      - "Compute preexisting_waiver_granted"
      - "increments Policy.version by 1"
  - method: POST
    path: "/policies/{policyId}/free-look-cancel"
    description: "Free-look cancellation within the window; full-premium refund cascade"
    roles: [Traveler]
    code: 200
    input: []
    output: Policy
    side_effects:
      - "coverage_status -> CANCELLED"
      - "Auto-create FREE_LOOK Refund (full premium) in COMPLETED status; cascade payment_status -> REFUNDED and recompute net_premium_collected_cents"
      - "All InsuredTraveler.status -> REMOVED"
      - "increments Policy.version by 1"
  - method: POST
    path: "/policies/{policyId}/cancel"
    description: "Post-free-look cancellation before trip start; short-rate refund"
    roles: [Traveler]
    code: 200
    input: []
    output: Policy
    side_effects:
      - "coverage_status -> CANCELLED"
      - "Auto-create SHORT_RATE Refund (pro-rated minus admin fee)"
      - "increments Policy.version by 1"

  # ---- Claim ----
  - method: POST
    path: "/claims"
    description: "File a claim against an ACTIVE policy; computes provisional_amount_cents"
    roles: [Traveler]
    code: 201
    input: [policy_id, insured_traveler_id, peril, incident_at, "named_storm_id?", "cancellation_reason?", "delay_hours?", "involves_preexisting?"]
    output: Claim
    side_effects:
      - "status=SUBMITTED"
      - "Validate ERR_POLICY_NOT_ACTIVE, ERR_FILING_WINDOW_CLOSED, ERR_DELAY_EVENT_OVERLAP"
      - "Compute provisional_amount_cents (peril-specific)"
  - method: GET
    path: "/claims/{claimId}"
    description: "Get a claim"
    roles: [Any]
    code: 200
    input: []
    output: Claim
    side_effects: []
  - method: GET
    path: "/claims"
    description: "List claims (filtered)"
    roles: [Any]
    code: 200
    input: ["policy_id?", "insured_traveler_id?", "named_storm_id?", "peril?", "status?"]
    output: "Claim[]"
    side_effects: []
  - method: POST
    path: "/claims/{claimId}/expenses"
    description: "Add an expense line to a claim (SUBMITTED or INFO_REQUESTED)"
    roles: [Traveler]
    code: 201
    input: [category, description, documented_amount_cents, "prepaid_nonrefundable_cents?", "supplier_refund_received_cents?", "item_value_cents?"]
    output: ClaimExpense
    side_effects: ["Recompute provisional_amount_cents"]
  - method: GET
    path: "/claims/{id}/expenses"
    description: "List expense lines on a claim"
    roles: [Any]
    code: 200
    input: []
    output: "ClaimExpense[]"
    side_effects: []
  - method: POST
    path: "/claims/{claimId}/documents"
    description: "Upload a supporting document to a claim"
    roles: [Traveler]
    code: 201
    input: [doc_type, file_ref]
    output: ClaimDocument
    side_effects: ["uploaded_by_traveler_id = X-User-ID"]
  - method: GET
    path: "/claims/{id}/documents"
    description: "List documents on a claim"
    roles: [Any]
    code: 200
    input: []
    output: "ClaimDocument[]"
    side_effects: []
  - method: POST
    path: "/claims/{claimId}/start-review"
    description: "Adjuster opens review; SUBMITTED -> UNDER_REVIEW"
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: Claim
    side_effects: ["status -> UNDER_REVIEW"]
  - method: POST
    path: "/claims/{claimId}/request-info"
    description: "Adjuster requests more info; UNDER_REVIEW -> INFO_REQUESTED"
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: Claim
    side_effects: ["status -> INFO_REQUESTED"]
  - method: POST
    path: "/claims/{claimId}/resubmit"
    description: "Traveler resubmits after info request; INFO_REQUESTED -> UNDER_REVIEW (cycle)"
    roles: [Traveler]
    code: 200
    input: []
    output: Claim
    side_effects: ["status -> UNDER_REVIEW", "Recompute provisional_amount_cents"]
  - method: POST
    path: "/claims/{claimId}/approve"
    description: "Adjuster approves; computes approved_amount_cents (final basis, capped)"
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: Claim
    side_effects: ["status -> APPROVED", "Compute approved_amount_cents"]
  - method: POST
    path: "/claims/{claimId}/deny"
    description: "Adjuster denies a claim under review"
    roles: [ClaimsAdjuster]
    code: 200
    input: [denial_reason]
    output: Claim
    side_effects: ["status -> DENIED", "Set denial_reason"]

  # ---- Payout ----
  - method: POST
    path: "/payouts"
    description: "Create a PENDING payout for an APPROVED claim (amount = claim.approved_amount_cents)"
    roles: [ClaimsAdjuster]
    code: 201
    input: [claim_id]
    output: Payout
    side_effects:
      - "status=PENDING"
      - "policy_id copied from claim; amount_cents = Claim.approved_amount_cents"
      - "ERR_CLAIM_NOT_APPROVED if claim not APPROVED"
  - method: GET
    path: "/payouts/{payoutId}"
    description: "Get a payout"
    roles: [Any]
    code: 200
    input: []
    output: Payout
    side_effects: []
  - method: GET
    path: "/payouts"
    description: "List payouts (filtered)"
    roles: [Any]
    code: 200
    input: ["claim_id?", "policy_id?", "status?"]
    output: "Payout[]"
    side_effects: []
  - method: POST
    path: "/payouts/{payoutId}/disburse"
    description: "Disburse a pending payout; debits policy aggregate; cascades to claim and policy"
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: Payout
    side_effects:
      - "status -> DISBURSED"
      - "Policy.amount_reimbursed_cents += amount_cents; remaining_aggregate_cents recomputed"
      - "If remaining reaches 0: Policy.coverage_status -> EXHAUSTED (auto-deny sibling open claims)"
      - "Linked Claim.status -> PAID"
      - "increments Policy.version by 1"
  - method: POST
    path: "/payouts/{payoutId}/reverse"
    description: "Reverse a payout; restores policy aggregate (compensating)"
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: Payout
    side_effects:
      - "status -> REVERSED"
      - "If was DISBURSED: Policy.amount_reimbursed_cents -= amount_cents; remaining_aggregate_cents restored; EXHAUSTED->ACTIVE if applicable; Claim PAID->APPROVED"
      - "increments Policy.version by 1"

  # ---- Refund ----
  - method: GET
    path: "/refunds/{refundId}"
    description: "Get a refund"
    roles: [Any]
    code: 200
    input: []
    output: Refund
    side_effects: []
  - method: GET
    path: "/refunds"
    description: "List refunds (filtered)"
    roles: [Any]
    code: 200
    input: ["policy_id?", "refund_type?", "status?"]
    output: "Refund[]"
    side_effects: []
  - method: POST
    path: "/refunds/{refundId}/complete"
    description: "Complete a pending refund; cascade Policy payment_status -> REFUNDED"
    roles: [Underwriter]
    code: 200
    input: []
    output: Refund
    side_effects:
      - "status -> COMPLETED"
      - "Policy.payment_status -> REFUNDED; net_premium_collected_cents recomputed"
      - "increments Policy.version by 1"
  - method: POST
    path: "/refunds/{refundId}/void"
    description: "Void a pending refund (no premium returned)"
    roles: [Underwriter]
    code: 200
    input: []
    output: Refund
    side_effects: ["status -> VOIDED"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  # auth / existence / request
  - { id: ERR_MISSING_AUTH, http: 401, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Acting Traveler is not the owner of the policy/claim being mutated" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or FK resource does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Malformed body: missing required field, bad enum, negative/zero where disallowed" }
  - { id: ERR_DUPLICATE_CODE, http: 409, condition: "Plan.code already in use" }
  - { id: ERR_DUPLICATE_EMAIL, http: 409, condition: "Traveler.email already in use" }
  - { id: ERR_DUPLICATE_NAME, http: 409, condition: "NamedStorm.name already in use" }
  # state / concurrency
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a state permitting the requested transition" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_policy_version does not match Policy.version (OCC)" }
  # policy lifecycle
  - { id: ERR_PREMIUM_NOT_PAID, http: 409, condition: "Issue attempted while payment_status != PAID" }
  - { id: ERR_NO_INSURED_TRAVELER, http: 409, condition: "Issue attempted with no COVERED InsuredTraveler" }
  - { id: ERR_TRIP_COST_MISMATCH, http: 409, condition: "Sum of covered_trip_cost_cents != trip_cost_cents at issuance" }
  - { id: ERR_FREE_LOOK_EXPIRED, http: 409, condition: "Free-look cancel attempted after free_look_ends_at" }
  - { id: ERR_COVERAGE_PERIOD_STARTED, http: 409, condition: "Post-free-look cancel attempted at/after trip_start_at" }
  - { id: ERR_POLICY_HAS_CLAIMS, http: 409, condition: "Cancellation blocked: policy has non-terminal/paid claims" }
  - { id: ERR_COVERAGE_OVERLAP, http: 409, condition: "Insured traveler's trip-coverage interval overlaps another policy's interval for the same Traveler" }
  # claim gates
  - { id: ERR_POLICY_NOT_ACTIVE, http: 409, condition: "Claim filing/approval requires Policy.coverage_status == ACTIVE" }
  - { id: ERR_FILING_WINDOW_CLOSED, http: 409, condition: "Claim filed/approved outside Plan.claim_filing_window_days of incident_at" }
  - { id: ERR_PREEXISTING_NOT_WAIVED, http: 409, condition: "Pre-existing-condition medical claim without granted waiver" }
  - { id: ERR_NAMED_STORM_CUTOFF, http: 409, condition: "Storm-cancellation claim where Policy.issued_at >= NamedStorm.named_at" }
  - { id: ERR_DELAY_BELOW_THRESHOLD, http: 409, condition: "DELAY claim with delay_hours < 12" }
  - { id: ERR_DELAY_EVENT_OVERLAP, http: 409, condition: "DELAY claim within DELAY_MERGE_BUFFER_HOURS of an existing DELAY claim on the same policy" }
  - { id: ERR_DOCUMENTATION_MISSING, http: 409, condition: "Approve/resubmit attempted with no ClaimDocument on the claim" }
  - { id: ERR_CLAIM_NOT_APPROVED, http: 409, condition: "Payout creation/disbursement against a claim not in APPROVED status" }
  - { id: ERR_AGGREGATE_LIMIT_EXCEEDED, http: 409, condition: "Payout disbursement amount exceeds Policy.remaining_aggregate_cents" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: CarrierAdmin
    description: "Carrier operator: configures plans, declares named storms, drives the test clock"
    identity: opaque
    exclusive_operations:
      - "POST /plans — Create plan"
      - "POST /plans/{id}/retire — Retire plan"
      - "POST /named-storms — Declare named storm"
      - "POST /named-storms/{id}/dissipate — Dissipate storm"
      - "POST /_clock/set_current_utc — Set clock"
    shared_operations:
      - "POST /travelers — Register traveler (shared with Traveler)"

  - name: Underwriter
    description: "Prices and issues policies, records payment, completes/voids refunds"
    identity: opaque
    exclusive_operations:
      - "POST /policies/{id}/issue — Issue policy"
      - "POST /refunds/{id}/complete — Complete refund"
      - "POST /refunds/{id}/void — Void refund"
    shared_operations:
      - "POST /policies — Quote policy (shared with Traveler)"
      - "POST /policies/{id}/insured-travelers — Add insured (shared with Traveler)"
      - "POST /policies/{id}/record-payment — Record payment (shared with Traveler)"

  - name: ClaimsAdjuster
    description: "Adjudicates claims and manages payouts"
    identity: opaque
    exclusive_operations:
      - "POST /claims/{id}/start-review — Open review"
      - "POST /claims/{id}/request-info — Request info"
      - "POST /claims/{id}/approve — Approve claim"
      - "POST /claims/{id}/deny — Deny claim"
      - "POST /payouts — Create payout"
      - "POST /payouts/{id}/disburse — Disburse payout"
      - "POST /payouts/{id}/reverse — Reverse payout"

  - name: Traveler
    description: "Buys policies, manages insured roster, files and resubmits claims, cancels within windows"
    identity: "entity_backed:Traveler"
    exclusive_operations:
      - "POST /policies/{id}/free-look-cancel — Free-look cancel (own policy)"
      - "POST /policies/{id}/cancel — Cancel (own policy)"
      - "POST /claims — File claim (own policy)"
      - "POST /claims/{id}/resubmit — Resubmit claim (own claim)"
      - "POST /claims/{id}/expenses — Add expense (own claim)"
      - "POST /claims/{id}/documents — Upload document (own claim)"
    shared_operations:
      - "POST /travelers — Register traveler (shared with CarrierAdmin)"
      - "POST /policies — Quote policy (shared with Underwriter)"
      - "POST /policies/{id}/insured-travelers — Add insured (shared with Underwriter)"
      - "POST /policies/{id}/record-payment — Record payment (shared with Underwriter)"

  - name: System
    description: "Automation for clock-driven EXPIRED transitions and cascade-driven auto-denials/refund completions"
    identity: opaque
    exclusive_operations: []

  - name: Any
    description: "Any authenticated role may read"
    identity: opaque
    shared_operations:
      - "GET — all read/list endpoints across collections"
