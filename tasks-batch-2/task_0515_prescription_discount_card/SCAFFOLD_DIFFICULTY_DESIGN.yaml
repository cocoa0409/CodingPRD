  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across DIFFERENT interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: price_quote_half_open_window_overlap_rejected
        grounds:
          - validations[priority=11.5]
          - errors[ERR_QUOTE_PERIOD_OVERLAP]
          - entities.PriceQuote.fields.effective_at
          - entities.PriceQuote.fields.expires_at
        distinguishing_aspect: |
          HALF-OPEN [effective_at, expires_at) semantics on PriceQuote: a new quote
          [2026-05-15,2026-07-01) for the same (pharmacy,drug) intersects the
          existing [2026-05-01,2026-06-01) -> ERR_QUOTE_PERIOD_OVERLAP; abutment
          would be allowed. Geometry differs from the membership buffer rule.
        test_recipe:
          setup:
            - "ACTIVE pharmacy PH with one PUBLISHED quote [2026-05-01,2026-06-01) for ATORVA."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /drugs"
