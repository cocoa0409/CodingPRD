# =============================================================================
# Task 1476 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 24 non-stub instances across the nine Difficulty Rules of SKILL.md §0.5.
# All times are logical-clock times (server default 2026-08-01T00:00:00Z).
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: water_projected_vs_reconciled_divergence
        grounds:
          - calculations.water_budget_projection
          - entities.Season.fields.water_committed_gallons
          - entities.Season.fields.water_actual_gallons
          - entities.Season.fields.water_remaining_gallons
          - state_machines.Season.HARVESTING_to_RECONCILIATION
          - state_machines.IrrigationSchedule.SCHEDULED_to_CANCELLED
        distinguishing_aspect: |
          Entity domain = Season water ledger. For identical ledger data the forward-looking
          projected_variant (committed + actual = 960) and the reconciled_final_variant
          (actual only = 260, after RECONCILIATION cascade-cancels the open schedule) differ;
          the variant switch is driven by the season transition, not by new inputs.
        test_recipe:
          setup:
            - "Season budget 1000, status PLANTING via approved 60sqft plan on bed B-01"
            - "Irrigation A: Z1 2026-08-20 10:00-11:00 planned 700 (SCHEDULED)"
            - "Irrigation B: Z2 2026-08-21 10:00-11:00 planned 200, meter logged actual 260 (LOGGED)"
          setup_api_calls:
            - { call: "POST /api/volunteers", payload: { full_name: "V One", email: "v1@x.com", date_of_birth: "1990-05-20" }, as: GardenAdmin, captures: { v1_id: $.data.id } }
            - { call: "POST /api/seasons", payload: { name: "2026 Summer", signup_opens_at: "2026-07-01T00:00:00Z", signup_closes_at: "2026-08-10T00:00:00Z", season_starts_at: "2026-08-01T00:00:00Z", season_ends_at: "2026-11-30T00:00:00Z", water_budget_gallons: 1000 }, as: GardenAdmin, captures: { season_id: $.data.id } }
            - { call: "POST /api/beds", payload: { bed_code: "B-01", size_sq_ft: 100, sun_exposure: "FULL", irrigation_zone: "Z1" }, as: GardenAdmin, captures: { bed_id: $.data.id } }
            - { call: "POST /api/seasons/${season_id}/transition", payload: { to_state: "OPEN_ENROLLMENT" }, as: GardenAdmin }
            - { call: "POST /api/crop-plans", payload: { season_id: "${season_id}", bed_id: "${bed_id}", proposer_volunteer_id: "${v1_id}", crop_type: "Tomato", plant_family: "Solanaceae", requested_sq_ft: 60, planned_start_date: "2026-08-01", planned_end_date: "2026-09-01" }, as: GardenAdmin, captures: { plan_id: $.data.id } }
            - { call: "POST /api/crop-plans/${plan_id}/transition", payload: { to_state: "APPROVED" }, as: GardenAdmin }
            - { call: "POST /api/seasons/${season_id}/transition", payload: { to_state: "PLANTING" }, as: GardenAdmin }
            - { call: "GET /api/seasons/${season_id}", as: GardenAdmin, captures: { season_v1: $.data.version } }
            - { call: "POST /api/irrigation-schedules", payload: { season_id: "${season_id}", zone: "Z1", planned_start_at: "2026-08-20T10:00:00Z", planned_end_at: "2026-08-20T11:00:00Z", planned_gallons: 700, expected_season_version: "${season_v1}" }, as: GardenAdmin, captures: { irr_a: $.data.id } }
            - { call: "GET /api/seasons/${season_id}", as: GardenAdmin, captures: { season_v2: $.data.version } }
            - { call: "POST /api/irrigation-schedules", payload: { season_id: "${season_id}", zone: "Z2", planned_start_at: "2026-08-21T10:00:00Z", planned_end_at: "2026-08-21T11:00:00Z", planned_gallons: 200, expected_season_version: "${season_v2}" }, as: GardenAdmin, captures: { irr_b: $.data.id } }
            - { call: "POST /api/irrigation-schedules/${irr_b}/log-meter", payload: { gallons_actual: 260 }, as: GardenAdmin }
            - { call: "POST /api/beds/${bed_id}/transition", payload: { to_state: "RESERVED" }, as: GardenAdmin }
            - { call: "POST /api/crop-plans/${plan_id}/transition", payload: { to_state: "PLANTED" }, as: GardenAdmin }
            - { call: "POST /api/beds/${bed_id}/transition", payload: { to_state: "PLANTED" }, as: GardenAdmin }
            - { call: "POST /api/seasons/${season_id}/transition", payload: { to_state: "GROWING" }, as: GardenAdmin }
            - { call: "POST /api/seasons/${season_id}/transition", payload: { to_state: "HARVESTING" }, as: GardenAdmin }
          trigger:
            - { call: "GET /api/seasons/${season_id}", as: GardenAdmin, captures: { mid_committed: $.data.water_committed_gallons, mid_actual: $.data.water_actual_gallons, mid_remaining: $.data.water_remaining_gallons } }
            - { call: "POST /api/seasons/${season_id}/transition", payload: { to_state: "RECONCILIATION" }, as: GardenAdmin }
            - { call: "GET /api/seasons/${season_id}", as: GardenAdmin, captures: { fin_committed: $.data.water_committed_gallons, fin_actual: $.data.water_actual_gallons, fin_remaining: $.data.water_remaining_gallons } }
            - { call: "GET /api/irrigation-schedules/${irr_a}", as: GardenAdmin, captures: { irr_a_status: $.data.status } }
          assert:
            - "mid_committed == 700 (projected_variant committed set counts SCHEDULED A only; B left the set when LOGGED)"
            - "mid_actual == 260"
            - "mid_remaining == 40 (1000 - 700 - 260)"
            - "fin_committed == 0 (RECONCILIATION cascade-cancelled SCHEDULED A)"
            - "fin_actual == 260"
            - "fin_remaining == 740"
            - "projected_variant total (960) != reconciled_final_variant total (260) for identical ledger data"
            - "irr_a_status == CANCELLED"

      - name: service_credit_scheduled_vs_actual_divergence
        grounds:
          - calculations.volunteer_service_credit
          - entities.ShiftSignup.fields.credited_minutes
          - entities.Volunteer.fields.total_service_minutes
          - state_machines.ShiftSignup.CONFIRMED_to_CHECKED_IN
          - state_machines.ShiftSignup.CHECKED_IN_to_COMPLETED
        distinguishing_aspect: |
          Entity domain = Volunteer service ledger (different from the Season water ledger of
          water_projected_vs_reconciled_divergence). At CHECKED_IN the scheduled_credit variant
          reports 180; after check-out the actual_credit variant reports min(110, 180+30) = 110
          on the same signup row — two valid readings, different numbers.
        test_recipe:
          setup:
            - "Volunteer V1 oriented + waiver SIGNED; season OPEN_ENROLLMENT; slot 2026-08-15 09:00-12:00 (180 scheduled min), capacity 3, OPEN"
            - "Signup S1 CONFIRMED"
          setup_api_calls:
            - { call: "POST /api/volunteers", payload: { full_name: "V One", email: "v1@x.com", date_of_birth: "1990-05-20" }, as: GardenAdmin, captures: { v1_id: $.data.id } }
            - { call: "POST /api/volunteers/${v1_id}/orientation/complete", as: GardenAdmin }
            - { call: "POST /api/volunteers/${v1_id}/waiver/sign", as: GardenAdmin }
            - { call: "POST /api/seasons", payload: { name: "2026 Summer", signup_opens_at: "2026-07-01T00:00:00Z", signup_closes_at: "2026-08-10T00:00:00Z", season_starts_at: "2026-08-01T00:00:00Z", season_ends_at: "2026-11-30T00:00:00Z", water_budget_gallons: 1000 }, as: GardenAdmin, captures: { season_id: $.data.id } }
            - { call: "POST /api/beds", payload: { bed_code: "B-01", size_sq_ft: 100, sun_exposure: "FULL", irrigation_zone: "Z1" }, as: GardenAdmin }
            - { call: "POST /api/shift-slots", payload: { season_id: "${season_id}", task_type: "WEEDING", starts_at: "2026-08-15T09:00:00Z", ends_at: "2026-08-15T12:00:00Z", capacity_total: 3, capacity_youth: 1 }, as: GardenAdmin, captures: { slot_id: $.data.id } }
            - { call: "POST /api/seasons/${season_id}/transition", payload: { to_state: "OPEN_ENROLLMENT" }, as: GardenAdmin }
            - { call: "POST /api/shift-slots/${slot_id}/transition", payload: { to_state: "OPEN" }, as: GardenAdmin }
            - { call: "POST /api/shift-signups", payload: { slot_id: "${slot_id}", volunteer_id: "${v1_id}" }, as: Volunteer, as_user_id: "${v1_id}", captures: { s1_id: $.data.id } }
            - { call: "POST /api/shift-signups/${s1_id}/confirm", as: GardenAdmin }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T09:10:00Z" }, as: GardenAdmin }
          trigger:
            - { call: "POST /api/shift-signups/${s1_id}/check-in", as: Volunteer, as_user_id: "${v1_id}", captures: { prov_credit: $.data.credited_minutes, prov_status: $.data.status } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T11:00:00Z" }, as: GardenAdmin }
            - { call: "POST /api/shift-signups/${s1_id}/check-out", as: Volunteer, as_user_id: "${v1_id}", captures: { final_credit: $.data.credited_minutes, final_status: $.data.status } }
            - { call: "GET /api/volunteers/${v1_id}", as: GardenAdmin, captures: { v1_total: $.data.total_service_minutes } }
          assert:
            - "prov_credit == 180 (scheduled_credit variant at CHECKED_IN)"
            - "final_credit == 110 (actual_credit: min(110 elapsed, 180+30))"
            - "v1_total == 110"
            - "provisional 180 != final 110 for the same signup (variant divergence)"
            - "final_status == COMPLETED"

  - rule_id: combinatorial_formula
    instances:
      - name: supervision_ratio_ceil_with_cert_branch
        grounds:
          - calculations.supervision_ratio_check
          - entities.GroupBooking.fields.required_chaperones
          - errors[ERR_SUPERVISION_RATIO_VIOLATION]
        distinguishing_aspect: |
          Mode (a): >= 3 inputs (minor_count, chaperone_count, per-chaperone SUPERVISION cert
          status) with non-linear interaction (ceil boundary at multiples of 8; conditional
          branch per chaperone on cert validity). minor_count 17 needs 3; 16 needs exactly 2;
          a declared-but-uncertified chaperone does not count.
        test_recipe:
          setup:
            - "Officer O; chaperones C1-C3 with ACTIVE SUPERVISION certs; C4 without any cert"
            - "Leader L oriented + waiver SIGNED; slot capacity_total 40 / capacity_youth 40, OPEN"
          setup_api_calls:
            - { call: "POST /api/volunteers", payload: { full_name: "Officer", email: "o@x.com", date_of_birth: "1985-01-01" }, as: GardenAdmin, captures: { o_id: $.data.id } }
            - { call: "POST /api/volunteers", payload: { full_name: "C One", email: "c1@x.com", date_of_birth: "1980-01-01" }, as: GardenAdmin, captures: { c1_id: $.data.id } }
            - { call: "POST /api/volunteers", payload: { full_name: "C Two", email: "c2@x.com", date_of_birth: "1980-01-02" }, as: GardenAdmin, captures: { c2_id: $.data.id } }
            - { call: "POST /api/volunteers", payload: { full_name: "C Three", email: "c3@x.com", date_of_birth: "1980-01-03" }, as: GardenAdmin, captures: { c3_id: $.data.id } }
            - { call: "POST /api/volunteers", payload: { full_name: "C Four", email: "c4@x.com", date_of_birth: "1980-01-04" }, as: GardenAdmin, captures: { c4_id: $.data.id } }
            - { call: "POST /api/volunteers", payload: { full_name: "Leader", email: "l@x.com", date_of_birth: "1979-06-06" }, as: GardenAdmin, captures: { l_id: $.data.id } }
            - { call: "POST /api/volunteers/${l_id}/orientation/complete", as: GardenAdmin }
            - { call: "POST /api/volunteers/${l_id}/waiver/sign", as: GardenAdmin }
            - { call: "POST /api/certifications", payload: { volunteer_id: "${c1_id}", cert_type: "SUPERVISION", expires_at: "2027-08-01T00:00:00Z" }, as: FoodSafetyOfficer, as_user_id: "${o_id}" }
            - { call: "POST /api/certifications", payload: { volunteer_id: "${c2_id}", cert_type: "SUPERVISION", expires_at: "2027-08-01T00:00:00Z" }, as: FoodSafetyOfficer, as_user_id: "${o_id}" }
            - { call: "POST /api/certifications", payload: { volunteer_id: "${c3_id}", cert_type: "SUPERVISION", expires_at: "2027-08-01T00:00:00Z" }, as: FoodSafetyOfficer, as_user_id: "${o_id}" }
            - { call: "POST /api/seasons", payload: { name: "2026 Summer", signup_opens_at: "2026-07-01T00:00:00Z", signup_closes_at: "2026-08-10T00:00:00Z", season_starts_at: "2026-08-01T00:00:00Z", season_ends_at: "2026-11-30T00:00:00Z", water_budget_gallons: 1000 }, as: GardenAdmin, captures: { season_id: $.data.id } }
            - { call: "POST /api/beds", payload: { bed_code: "B-01", size_sq_ft: 100, sun_exposure: "FULL", irrigation_zone: "Z1" }, as: GardenAdmin }
            - { call: "POST /api/seasons/${season_id}/transition", payload: { to_state: "OPEN_ENROLLMENT" }, as: GardenAdmin }
            - { call: "POST /api/shift-slots", payload: { season_id: "${season_id}", task_type: "WEEDING", starts_at: "2026-08-15T09:00:00Z", ends_at: "2026-08-15T12:00:00Z", capacity_total: 40, capacity_youth: 40 }, as: GardenAdmin, captures: { slot_id: $.data.id } }
            - { call: "POST /api/shift-slots/${slot_id}/transition", payload: { to_state: "OPEN" }, as: GardenAdmin }
          trigger:
            - { call: "POST /api/group-bookings", payload: { slot_id: "${slot_id}", leader_volunteer_id: "${l_id}", organization_name: "School A", member_count: 20, minor_count: 17, chaperone_count: 3, chaperone_volunteer_ids: ["${c1_id}", "${c2_id}", "${c3_id}"] }, as: GroupLeader, as_user_id: "${l_id}", captures: { bk_ok: $.data.id, bk_ok_req: $.data.required_chaperones } }
            - { call: "POST /api/group-bookings", payload: { slot_id: "${slot_id}", leader_volunteer_id: "${l_id}", organization_name: "School B", member_count: 19, minor_count: 17, chaperone_count: 2, chaperone_volunteer_ids: ["${c1_id}", "${c2_id}"] }, as: GroupLeader, as_user_id: "${l_id}", captures: { err_b: $.data.error_id } }
            - { call: "POST /api/group-bookings", payload: { slot_id: "${slot_id}", leader_volunteer_id: "${l_id}", organization_name: "School C", member_count: 18, minor_count: 16, chaperone_count: 2, chaperone_volunteer_ids: ["${c1_id}", "${c4_id}"] }, as: GroupLeader, as_user_id: "${l_id}", captures: { err_c: $.data.error_id } }
          assert:
            - "booking A created: bk_ok_req == 3 (ceil(17/8)); status == REQUESTED"
            - "err_b == ERR_SUPERVISION_RATIO_VIOLATION (17 minors, only 2 chaperones)"
            - "err_c == ERR_SUPERVISION_RATIO_VIOLATION (16 minors need 2 certified; C4 uncertified leaves 1)"

      - name: donation_split_floor_then_remainder_order
        grounds:
          - calculations.donation_split
          - entities.DonationAllocation.fields.volunteer_share_grams
          - entities.DonationAllocation.fields.donatable_grams
          - errors[ERR_SPLIT_MISMATCH]
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — the volunteer share is floored to
          whole grams FIRST (floor(9999 * 0.20) = 1999), and donatable_grams = 9999 - 1999 = 8000
          absorbs the remainder; sum-then-round or round-half-up would yield 2000/7999 and is
          pinned as wrong. Line grams must then sum exactly to 8000.
        test_recipe:
          setup:
            - "Full pipeline: season HARVESTING, bed B-01 HARVEST_OPEN, plan HARVESTING"
            - "Logger V1 oriented+signed with ACTIVE PRODUCE_SAFETY cert; officer O distinct"
            - "Harvest log weight_grams 9999, grade A, VERIFIED; recipients R1 (cap 100000, tier 1), R2 (cap 100000, tier 2)"
          setup_api_calls:
            - { call: "POST /api/volunteers", payload: { full_name: "Officer", email: "o@x.com", date_of_birth: "1985-01-01" }, as: GardenAdmin, captures: { o_id: $.data.id } }
            - { call: "POST /api/volunteers", payload: { full_name: "V One", email: "v1@x.com", date_of_birth: "1990-05-20" }, as: GardenAdmin, captures: { v1_id: $.data.id } }
            - { call: "POST /api/volunteers/${v1_id}/orientation/complete", as: GardenAdmin }
            - { call: "POST /api/volunteers/${v1_id}/waiver/sign", as: GardenAdmin }
            - { call: "POST /api/certifications", payload: { volunteer_id: "${v1_id}", cert_type: "PRODUCE_SAFETY", expires_at: "2027-08-01T00:00:00Z" }, as: FoodSafetyOfficer, as_user_id: "${o_id}" }
            - { call: "POST /api/seasons", payload: { name: "2026 Summer", signup_opens_at: "2026-07-01T00:00:00Z", signup_closes_at: "2026-08-10T00:00:00Z", season_starts_at: "2026-08-01T00:00:00Z", season_ends_at: "2026-11-30T00:00:00Z", water_budget_gallons: 1000 }, as: GardenAdmin, captures: { season_id: $.data.id } }
            - { call: "POST /api/beds", payload: { bed_code: "B-01", size_sq_ft: 100, sun_exposure: "FULL", irrigation_zone: "Z1" }, as: GardenAdmin, captures: { bed_id: $.data.id } }
            - { call: "POST /api/seasons/${season_id}/transition", payload: { to_state: "OPEN_ENROLLMENT" }, as: GardenAdmin }
            - { call: "POST /api/crop-plans", payload: { season_id: "${season_id}", bed_id: "${bed_id}", proposer_volunteer_id: "${v1_id}", crop_type: "Tomato", plant_family: "Solanaceae", requested_sq_ft: 60, planned_start_date: "2026-08-01", planned_end_date: "2026-09-01" }, as: GardenAdmin, captures: { plan_id: $.data.id } }
            - { call: "POST /api/crop-plans/${plan_id}/transition", payload: { to_state: "APPROVED" }, as: GardenAdmin }
            - { call: "POST /api/seasons/${season_id}/transition", payload: { to_state: "PLANTING" }, as: GardenAdmin }
            - { call: "POST /api/beds/${bed_id}/transition", payload: { to_state: "RESERVED" }, as: GardenAdmin }
            - { call: "POST /api/crop-plans/${plan_id}/transition", payload: { to_state: "PLANTED" }, as: GardenAdmin }
            - { call: "POST /api/beds/${bed_id}/transition", payload: { to_state: "PLANTED" }, as: GardenAdmin }
            - { call: "POST /api/seasons/${season_id}/transition", payload: { to_state: "GROWING" }, as: GardenAdmin }
            - { call: "POST /api/seasons/${season_id}/transition", payload: { to_state: "HARVESTING" }, as: GardenAdmin }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-15T12:00:00Z" }, as: GardenAdmin }
            - { call: "POST /api/harvest-logs", payload: { season_id: "${season_id}", bed_id: "${bed_id}", logged_by_volunteer_id: "${v1_id}", crop_type: "Tomato", weight_grams: 9999, quality_grade: "A", harvested_at: "2026-09-15T10:00:00Z", safety_attestation: true, crop_plan_id: "${plan_id}" }, as: Volunteer, as_user_id: "${v1_id}", captures: { log_id: $.data.id } }
            - { call: "POST /api/harvest-logs/${log_id}/transition", payload: { to_state: "SUBMITTED" }, as: Volunteer, as_user_id: "${v1_id}" }
            - { call: "POST /api/harvest-logs/${log_id}/transition", payload: { to_state: "VERIFIED" }, as: FoodSafetyOfficer, as_user_id: "${o_id}" }
            - { call: "POST /api/donation-recipients", payload: { org_name: "Food Bank", contact_email: "fb@x.com", weekly_capacity_grams: 100000, priority_tier: 1 }, as: GardenAdmin, captures: { r1_id: $.data.id } }
            - { call: "POST /api/donation-recipients", payload: { org_name: "Shelter", contact_email: "sh@x.com", weekly_capacity_grams: 100000, priority_tier: 2 }, as: GardenAdmin, captures: { r2_id: $.data.id } }
          trigger:
            - { call: "POST /api/donation-allocations", payload: { harvest_log_id: "${log_id}", lines: [ { recipient_id: "${r1_id}", grams: 5000 }, { recipient_id: "${r2_id}", grams: 2999 } ] }, as: GardenAdmin, captures: { err_bad: $.data.error_id } }
            - { call: "POST /api/donation-allocations", payload: { harvest_log_id: "${log_id}", lines: [ { recipient_id: "${r1_id}", grams: 5000 }, { recipient_id: "${r2_id}", grams: 3000 } ] }, as: GardenAdmin, captures: { alloc_id: $.data.id, share: $.data.volunteer_share_grams, donatable: $.data.donatable_grams, alloc_status: $.data.status } }
          assert:
            - "err_bad == ERR_SPLIT_MISMATCH (5000 + 2999 = 7999 != 8000)"
            - "share == 1999 (floor(9999 * 0.20) computed FIRST)"
            - "donatable == 8000 (9999 - 1999; remainder absorbs the rounding)"
            - "alloc_status == PENDING"

      - name: water_gate_evaluation_order_excludes_candidate
        grounds:
          - calculations.water_budget_projection
          - errors[ERR_WATER_BUDGET_EXCEEDED]
          - concurrency_rules[irrigation-create-stale-season]
        distinguishing_aspect: |
          Mode (c): circular-looking dependency pinned by evaluation order — the gate computes
          committed over EXISTING schedules (candidate excluded), then adds actual, then adds
          candidate.planned_gallons. Double-counting the candidate would reject the exact-fit
          second schedule (700 + 300 + 300 > 1000); its acceptance proves the pinned order.
        test_recipe:
          setup:
            - "Season budget 1000, PLANTING; irrigation A Z1 planned 700 committed"
          setup_api_calls:
            - { call: "POST /api/volunteers", payload: { full_name: "V One", email: "v1@x.com", date_of_birth: "1990-05-20" }, as: GardenAdmin, captures: { v1_id: $.data.id } }
            - { call: "POST /api/seasons", payload: { name: "2026 Summer", signup_opens_at: "2026-07-01T00:00:00Z", signup_closes_at: "2026-08-10T00:00:00Z", season_starts_at: "2026-08-01T00:00:00Z", season_ends_at: "2026-11-30T00:00:00Z", water_budget_gallons: 1000 }, as: GardenAdmin, captures: { season_id: $.data.id } }
            - { call: "POST /api/beds", payload: { bed_code: "B-01", size_sq_ft: 100, sun_exposure: "FULL", irrigation_zone: "Z1" }, as: GardenAdmin, captures: { bed_id: $.data.id } }
            - { call: "POST /api/seasons/${season_id}/transition", payload: { to_state: "OPEN_ENROLLMENT" }, as: GardenAdmin }
            - { call: "POST /api/crop-plans", payload: { season_id: "${season_id}", bed_id: "${bed_id}", proposer_volunteer_id: "${v1_id}", crop_type: "Tomato", plant_family: "Solanaceae", requested_sq_ft: 60, planned_start_date: "2026-08-01", planned_end_date: "2026-09-01" }, as: GardenAdmin, captures: { plan_id: $.data.id } }
            - { call: "POST /api/crop-plans/${plan_id}/transition", payload: { to_state: "APPROVED" }, as: GardenAdmin }
            - { call: "POST /api/seasons/${season_id}/transition", payload: { to_state: "PLANTING" }, as: GardenAdmin }
            - { call: "GET /api/seasons/${season_id}", as: GardenAdmin, captures: { season_v1: $.data.version } }
            - { call: "POST /api/irrigation-schedules", payload: { season_id: "${season_id}", zone: "Z1", planned_start_at: "2026-08-20T10:00:00Z", planned_end_at: "2026-08-20T11:00:00Z", planned_gallons: 700, expected_season_version: "${season_v1}" }, as: GardenAdmin, captures: { irr_a: $.data.id } }
          trigger:
            - { call: "GET /api/seasons/${season_id}", as: GardenAdmin, captures: { season_v2: $.data.version } }
            - { call: "POST /api/irrigation-schedules", payload: { season_id: "${season_id}", zone: "Z2", planned_start_at: "2026-08-21T10:00:00Z", planned_end_at: "2026-08-21T11:00:00Z", planned_gallons: 300, expected_season_version: "${season_v2}" }, as: GardenAdmin, captures: { irr_b: $.data.id } }
            - { call: "GET /api/seasons/${season_id}", as: GardenAdmin, captures: { committed: $.data.water_committed_gallons, remaining: $.data.water_remaining_gallons, season_v3: $.data.version } }
            - { call: "POST /api/irrigation-schedules", payload: { season_id: "${season_id}", zone: "Z3", planned_start_at: "2026-08-22T10:00:00Z", planned_end_at: "2026-08-22T11:00:00Z", planned_gallons: 1, expected_season_version: "${season_v3}" }, as: GardenAdmin, captures: { err_c: $.data.error_id } }
          assert:
            - "irrigation B (300) created successfully: 700 + 0 + 300 == 1000 <= 1000 (exact-fit boundary allowed)"
            - "committed == 1000 and remaining == 0 after B"
            - "err_c == ERR_WATER_BUDGET_EXCEEDED (1000 + 1 = 1001 > 1000)"
            - "B's success rules out candidate double-counting (700 + 300 + 300 = 1300 would have failed)"

  - rule_id: non_linear_state_machine
    instances:
      - name: volunteer_three_parallel_dimensions
        grounds:
          - state_machines.Volunteer
          - entities.Volunteer.fields.orientation_status
          - entities.Volunteer.fields.waiver_status
          - entities.Volunteer.fields.standing
          - entities.Volunteer.fields.is_minor
        distinguishing_aspect: |
          Parallel state dimensions on ONE entity: orientation (PENDING->ORIENTED), waiver
          (UNSIGNED->SIGNED->EXPIRED->SIGNED) and standing (GOOD->PROBATION->GOOD->SUSPENDED)
          evolve independently — mutating one never disturbs the others, and each rejects
          re-entry into its own current state.
        test_recipe:
          setup:
            - "Volunteer V created with DOB 2012-03-01 (minor at default clock 2026-08-01)"
          setup_api_calls:
            - { call: "POST /api/volunteers", payload: { full_name: "Teen", email: "teen@x.com", date_of_birth: "2012-03-01" }, as: GardenAdmin, captures: { v_id: $.data.id, v_minor: $.data.is_minor, v_orient0: $.data.orientation_status, v_waiver0: $.data.waiver_status, v_stand0: $.data.standing } }
          trigger:
            - { call: "POST /api/volunteers/${v_id}/orientation/complete", as: GardenAdmin }
            - { call: "GET /api/volunteers/${v_id}", as: GardenAdmin, captures: { o1: $.data.orientation_status, w1: $.data.waiver_status, s1: $.data.standing } }
            - { call: "POST /api/volunteers/${v_id}/waiver/sign", as: GardenAdmin }
            - { call: "POST /api/volunteers/${v_id}/orientation/complete", as: GardenAdmin, captures: { err_reorient: $.data.error_id } }
            - { call: "POST /api/volunteers/${v_id}/standing", payload: { to_state: "PROBATION" }, as: GardenAdmin }
            - { call: "GET /api/volunteers/${v_id}", as: GardenAdmin, captures: { o2: $.data.orientation_status, w2: $.data.waiver_status, s2: $.data.standing } }
          assert:
            - "v_minor == true (age 14 at 2026-08-01)"
            - "initial: v_orient0 == PENDING, v_waiver0 == UNSIGNED, v_stand0 == GOOD"
            - "after orientation: o1 == ORIENTED while w1 == UNSIGNED and s1 == GOOD (independent)"
            - "err_reorient == ERR_INVALID_VOLUNTEER_STATE (re-entering ORIENTED rejected)"
            - "after waiver + standing: o2 == ORIENTED, w2 == SIGNED, s2 == PROBATION"

      - name: crop_plan_reject_resubmit_cycle
        grounds:
          - state_machines.CropPlan.PROPOSED_to_REJECTED
          - state_machines.CropPlan.REJECTED_to_PROPOSED
          - state_machines.CropPlan.PROPOSED_to_APPROVED
          - calculations.bed_allocation_capacity
        distinguishing_aspect: |
          Cyclic machine on CropPlan (different entity than Volunteer): PROPOSED -> REJECTED ->
          PROPOSED -> APPROVED with branch-asymmetric side effects — rejection stores
          rejection_reason and does NOT touch bed allocation; resubmit clears the reason and
          applies updated fields; only approval debits bed.allocated_sq_ft (to 50, the updated value).
        test_recipe:
          setup:
            - "Season OPEN_ENROLLMENT; bed B-01 FALLOW, size 100; proposer V1"
          setup_api_calls:
            - { call: "POST /api/volunteers", payload: { full_name: "V One", email: "v1@x.com", date_of_birth: "1990-05-20" }, as: GardenAdmin, captures: { v1_id: $.data.id } }
            - { call: "POST /api/seasons", payload: { name: "2026 Summer", signup_opens_at: "2026-07-01T00:00:00Z", signup_closes_at: "2026-08-10T00:00:00Z", season_starts_at: "2026-08-01T00:00:00Z", season_ends_at: "2026-11-30T00:00:00Z", water_budget_gallons: 1000 }, as: GardenAdmin, captures: { season_id: $.data.id } }
            - { call: "POST /api/beds", payload: { bed_code: "B-01", size_sq_ft: 100, sun_exposure: "FULL", irrigation_zone: "Z1" }, as: GardenAdmin, captures: { bed_id: $.data.id } }
            - { call: "POST /api/seasons/${season_id}/transition", payload: { to_state: "OPEN_ENROLLMENT" }, as: GardenAdmin }
            - { call: "POST /api/crop-plans", payload: { season_id: "${season_id}", bed_id: "${bed_id}", proposer_volunteer_id: "${v1_id}", crop_type: "Tomato", plant_family: "Solanaceae", requested_sq_ft: 60, planned_start_date: "2026-08-01", planned_end_date: "2026-09-01" }, as: Volunteer, as_user_id: "${v1_id}", captures: { plan_id: $.data.id } }
          trigger:
            - { call: "POST /api/crop-plans/${plan_id}/transition", payload: { to_state: "REJECTED", rejection_reason: "bed too sunny for this crop" }, as: Coordinator, captures: { st1: $.data.status, reason1: $.data.rejection_reason } }
            - { call: "GET /api/beds/${bed_id}", as: GardenAdmin, captures: { alloc_after_reject: $.data.allocated_sq_ft } }
            - { call: "POST /api/crop-plans/${plan_id}/transition", payload: { to_state: "PROPOSED", requested_sq_ft: 50 }, as: Volunteer, as_user_id: "${v1_id}", captures: { st2: $.data.status, reason2: $.data.rejection_reason, sqft2: $.data.requested_sq_ft } }
            - { call: "POST /api/crop-plans/${plan_id}/transition", payload: { to_state: "APPROVED" }, as: Coordinator, captures: { st3: $.data.status } }
            - { call: "GET /api/beds/${bed_id}", as: GardenAdmin, captures: { alloc_after_approve: $.data.allocated_sq_ft } }
          assert:
            - "st1 == REJECTED and reason1 == 'bed too sunny for this crop'"
            - "alloc_after_reject == 0 (rejection has no allocation side effect)"
            - "st2 == PROPOSED, reason2 == null, sqft2 == 50 (resubmit clears reason, applies updates)"
            - "st3 == APPROVED"
            - "alloc_after_approve == 50 (only the resubmitted size is debited)"

      - name: slot_full_open_full_cycle
        grounds:
          - state_machines.ShiftSlot.OPEN_to_FULL
          - state_machines.ShiftSlot.FULL_to_OPEN
          - state_machines.ShiftSignup.REQUESTED_to_WAITLISTED
          - calculations.slot_occupancy
          - calculations.waitlist_promotion_select
        distinguishing_aspect: |
          Cyclic machine on ShiftSlot (third distinct entity): OPEN -> FULL on the 2nd confirm;
          a waitlisted signup exists so a cancel promotes it and the slot returns to FULL without
          ever reading OPEN; a second cancel with an empty waitlist drops FULL -> OPEN.
        test_recipe:
          setup:
            - "Season OPEN_ENROLLMENT; slot capacity_total 2 / capacity_youth 1, OPEN; V1-V3 oriented+signed adults"
          setup_api_calls:
            - { call: "POST /api/volunteers", payload: { full_name: "V One", email: "v1@x.com", date_of_birth: "1990-05-20" }, as: GardenAdmin, captures: { v1_id: $.data.id } }
            - { call: "POST /api/volunteers", payload: { full_name: "V Two", email: "v2@x.com", date_of_birth: "1990-05-21" }, as: GardenAdmin, captures: { v2_id: $.data.id } }
            - { call: "POST /api/volunteers", payload: { full_name: "V Three", email: "v3@x.com", date_of_birth: "1990-05-22" }, as: GardenAdmin, captures: { v3_id: $.data.id } }
            - { call: "POST /api/volunteers/${v1_id}/orientation/complete", as: GardenAdmin }
            - { call: "POST /api/volunteers/${v1_id}/waiver/sign", as: GardenAdmin }
            - { call: "POST /api/volunteers/${v2_id}/orientation/complete", as: GardenAdmin }
            - { call: "POST /api/volunteers/${v2_id}/waiver/sign", as: GardenAdmin }
            - { call: "POST /api/volunteers/${v3_id}/orientation/complete", as: GardenAdmin }
            - { call: "POST /api/volunteers/${v3_id}/waiver/sign", as: GardenAdmin }
            - { call: "POST /api/seasons", payload: { name: "2026 Summer", signup_opens_at: "2026-07-01T00:00:00Z", signup_closes_at: "2026-08-10T00:00:00Z", season_starts_at: "2026-08-01T00:00:00Z", season_ends_at: "2026-11-30T00:00:00Z", water_budget_gallons: 1000 }, as: GardenAdmin, captures: { season_id: $.data.id } }
            - { call: "POST /api/beds", payload: { bed_code: "B-01", size_sq_ft: 100, sun_exposure: "FULL", irrigation_zone: "Z1" }, as: GardenAdmin }
            - { call: "POST /api/seasons/${season_id}/transition", payload: { to_state: "OPEN_ENROLLMENT" }, as: GardenAdmin }
            - { call: "POST /api/shift-slots", payload: { season_id: "${season_id}", task_type: "WEEDING", starts_at: "2026-08-15T09:00:00Z", ends_at: "2026-08-15T12:00:00Z", capacity_total: 2, capacity_youth: 1 }, as: GardenAdmin, captures: { slot_id: $.data.id } }
            - { call: "POST /api/shift-slots/${slot_id}/transition", payload: { to_state: "OPEN" }, as: GardenAdmin }
            - { call: "POST /api/shift-signups", payload: { slot_id: "${slot_id}", volunteer_id: "${v1_id}" }, as: Volunteer, as_user_id: "${v1_id}", captures: { s1_id: $.data.id } }
            - { call: "POST /api/shift-signups", payload: { slot_id: "${slot_id}", volunteer_id: "${v2_id}" }, as: Volunteer, as_user_id: "${v2_id}", captures: { s2_id: $.data.id } }
            - { call: "POST /api/shift-signups", payload: { slot_id: "${slot_id}", volunteer_id: "${v3_id}" }, as: Volunteer, as_user_id: "${v3_id}", captures: { s3_id: $.data.id } }
            - { call: "POST /api/shift-signups/${s1_id}/confirm", as: GardenAdmin }
          trigger:
            - { call: "POST /api/shift-signups/${s2_id}/confirm", as: GardenAdmin, captures: { s2_st: $.data.status } }
            - { call: "GET /api/shift-slots/${slot_id}", as: GardenAdmin, captures: { slot_full1: $.data.status, cnt1: $.data.confirmed_count } }
            - { call: "POST /api/shift-signups/${s3_id}/confirm", as: GardenAdmin, captures: { s3_st: $.data.status, s3_pos: $.data.waitlist_position } }
            - { call: "POST /api/shift-signups/${s1_id}/cancel", as: GardenAdmin }
            - { call: "GET /api/shift-signups/${s3_id}", as: GardenAdmin, captures: { s3_st2: $.data.status, s3_pos2: $.data.waitlist_position } }
            - { call: "GET /api/shift-slots/${slot_id}", as: GardenAdmin, captures: { slot_full2: $.data.status, cnt2: $.data.confirmed_count } }
            - { call: "POST /api/shift-signups/${s2_id}/cancel", as: GardenAdmin }
            - { call: "GET /api/shift-slots/${slot_id}", as: GardenAdmin, captures: { slot_open2: $.data.status, cnt3: $.data.confirmed_count } }
          assert:
            - "s2_st == CONFIRMED and slot_full1 == FULL and cnt1 == 2"
            - "s3_st == WAITLISTED and s3_pos == 1 (branch B: confirm on a full slot waitlists, not an error)"
            - "after cancel s1: s3_st2 == CONFIRMED, s3_pos2 == null (promoted), slot_full2 == FULL, cnt2 == 2 (OPEN never observable while a candidate fits)"
            - "after cancel s2: slot_open2 == OPEN and cnt3 == 1 (empty waitlist => FULL -> OPEN)"

  - rule_id: transitive_cascade
    instances:
      - name: slot_cancel_cascades_signup_checkout_tool
        grounds:
          - state_machines.ShiftSlot.OPEN_to_CANCELLED
          - state_machines.ShiftSignup.CONFIRMED_to_CANCELLED
          - state_machines.ToolCheckout.OPEN_to_AUTO_CLOSED
          - entities.ToolItem.fields.available_count
        distinguishing_aspect: |
          Depth-3 cascade from trigger 'slot -> CANCELLED': link 1 signup CONFIRMED -> CANCELLED;
          link 2 the cancelled signup's linked ToolCheckout OPEN -> AUTO_CLOSED (caused by link 1,
          not by the slot action directly); link 3 ToolItem counts recomputed (checked_out 2 -> 0,
          available 3 -> 5) as a consequence of link 2. Branch asymmetry: cancellation carries no
          no-show penalty, unlike slot completion.
        test_recipe:
          setup:
            - "V1 oriented+signed; season OPEN_ENROLLMENT; slot capacity 5 OPEN; signup S1 CONFIRMED"
            - "Tool M total 5; checkout T1 qty 2 linked to S1 (tool: checked_out 2, available 3)"
          setup_api_calls:
            - { call: "POST /api/volunteers", payload: { full_name: "V One", email: "v1@x.com", date_of_birth: "1990-05-20" }, as: GardenAdmin, captures: { v1_id: $.data.id } }
            - { call: "POST /api/volunteers/${v1_id}/orientation/complete", as: GardenAdmin }
            - { call: "POST /api/volunteers/${v1_id}/waiver/sign", as: GardenAdmin }
            - { call: "POST /api/seasons", payload: { name: "2026 Summer", signup_opens_at: "2026-07-01T00:00:00Z", signup_closes_at: "2026-08-10T00:00:00Z", season_starts_at: "2026-08-01T00:00:00Z", season_ends_at: "2026-11-30T00:00:00Z", water_budget_gallons: 1000 }, as: GardenAdmin, captures: { season_id: $.data.id } }
            - { call: "POST /api/beds", payload: { bed_code: "B-01", size_sq_ft: 100, sun_exposure: "FULL", irrigation_zone: "Z1" }, as: GardenAdmin }
            - { call: "POST /api/seasons/${season_id}/transition", payload: { to_state: "OPEN_ENROLLMENT" }, as: GardenAdmin }
            - { call: "POST /api/shift-slots", payload: { season_id: "${season_id}", task_type: "REPAIR", starts_at: "2026-08-15T09:00:00Z", ends_at: "2026-08-15T12:00:00Z", capacity_total: 5, capacity_youth: 2 }, as: GardenAdmin, captures: { slot_id: $.data.id } }
            - { call: "POST /api/shift-slots/${slot_id}/transition", payload: { to_state: "OPEN" }, as: GardenAdmin }
            - { call: "POST /api/shift-signups", payload: { slot_id: "${slot_id}", volunteer_id: "${v1_id}" }, as: Volunteer, as_user_id: "${v1_id}", captures: { s1_id: $.data.id } }
            - { call: "POST /api/shift-signups/${s1_id}/confirm", as: GardenAdmin }
            - { call: "POST /api/tools", payload: { tool_name: "Hoe set", category: "HAND", total_count: 5 }, as: GardenAdmin, captures: { tool_id: $.data.id } }
            - { call: "POST /api/tool-checkouts", payload: { tool_id: "${tool_id}", volunteer_id: "${v1_id}", qty: 2, signup_id: "${s1_id}" }, as: Volunteer, as_user_id: "${v1_id}", captures: { t1_id: $.data.id } }
          trigger:
            - { call: "POST /api/shift-slots/${slot_id}/transition", payload: { to_state: "CANCELLED" }, as: GardenAdmin }
          assert:
            - "GET /api/shift-signups/${s1_id}: status == CANCELLED (cascade link 1)"
            - "GET /api/tool-checkouts/${t1_id}: status == AUTO_CLOSED (cascade link 2, caused by link 1)"
            - "GET /api/tools/${tool_id}: checked_out_count == 0 and available_count == 5 (cascade link 3)"
            - "GET /api/volunteers/${v1_id}: no_show_count == 0 (cancel cascade carries no penalty, unlike slot completion)"
            - "GET /api/shift-slots/${slot_id}: status == CANCELLED"

      - name: volunteer_suspend_cancels_signup_promotes_waitlist
        grounds:
          - state_machines.Volunteer.GOOD_to_SUSPENDED
          - state_machines.ShiftSignup.CONFIRMED_to_CANCELLED
          - state_machines.ShiftSignup.WAITLISTED_to_CONFIRMED
          - calculations.waitlist_promotion_select
        distinguishing_aspect: |
          Depth-2 cascade from a DIFFERENT trigger ('volunteer standing -> SUSPENDED'): link 1 the
          suspended volunteer's CONFIRMED signup -> CANCELLED; link 2 the freed spot itself triggers
          waitlist_promotion_select, moving the lowest-position eligible WAITLISTED signup ->
          CONFIRMED. The promotion is caused by the link-1 cancellation, not by the suspend action.
        test_recipe:
          setup:
            - "Season OPEN_ENROLLMENT; slot capacity_total 2 / capacity_youth 1, OPEN"
            - "V1, V2 oriented+signed with CONFIRMED signups (slot FULL); V3's signup WAITLISTED at position 1"
          setup_api_calls:
            - { call: "POST /api/volunteers", payload: { full_name: "V One", email: "v1@x.com", date_of_birth: "1990-05-20" }, as: GardenAdmin, captures: { v1_id: $.data.id } }
