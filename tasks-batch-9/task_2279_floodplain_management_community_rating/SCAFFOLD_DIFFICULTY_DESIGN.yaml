          - calculations.higher_standard_credit
          - entities.Community.fields.sanction_risk_points
          - entities.Community.fields.compliance_posture
        distinguishing_aspect: |
          Mode (c) — circular dependency resolved by a pinned single pass: raw 12 puts the
          provisional tier at ON_PROBATION, which is the only condition under which the
          VERIFIED A510 credit of 4 is granted, so the net is 8 and the final posture is
          GOOD_STANDING; the credit is not withdrawn after the tier improves and the tier is
          not recomputed a second time.
