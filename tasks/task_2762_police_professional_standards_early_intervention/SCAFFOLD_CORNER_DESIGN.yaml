            - "call 1: HTTP 422 with ${e_window} == ERR_INVALID_SESSION_WINDOW; notice_hours would have been 106 so the priority-9 notice rule is satisfied and cannot be the reported cause, and the investigation is still ASSIGNED"
            - "call 2: HTTP 201 with InterviewSession.${s1_id}.status == SCHEDULED, notice_hours == 105, duration_minutes == 60, postpone_count == 0, and Investigation.${i1_id}.status == IN_PROGRESS with interview_held_count == 0"
            - "call 3: HTTP 422 with ${e_no_interview} == ERR_NO_INTERVIEW_HELD - the coverage half of priority 10 is satisfied, and the priority-8 state gate passes because scheduling already advanced the investigation"
            - "call 4: HTTP 409 with ${e_rep} == ERR_REPRESENTATION_NOT_PRESENT, not ERR_INTERVIEW_NOT_STARTED; representation at priority 9 outranks the start-time rule at priority 11 even though both are violated"
            - "call 5: HTTP 409 with ${e_not_started} == ERR_INTERVIEW_NOT_STARTED once the payload supplies REP_PRESENT; the session is still SCHEDULED and its representation_status is unchanged by the refused call"
            - "call 6: HTTP 200 with postpone_count == 1, scheduled_start == 2026-08-07T09:00:00Z and status back to SCHEDULED"
            - "call 7: HTTP 200 with postpone_count == 2 and scheduled_start == 2026-08-09T09:00:00Z"
            - "call 8: HTTP 409 with ${e_postpone} == ERR_MAX_POSTPONEMENTS_REACHED; postpone_count stays 2 and scheduled_start stays 2026-08-09T09:00:00Z"
            - "call 10: HTTP 200 with status == HELD, held_at == 2026-08-09T09:00:00Z and Investigation.${i1_id}.interview_held_count == 1"
            - "call 11: HTTP 409 with ${e_session_state} == ERR_SESSION_STATE_INVALID and interview_held_count still 1, so the refused hold did not double count"
            - "call 12: HTTP 422 with ${e_incomplete} == ERR_FINDINGS_INCOMPLETE and Allegation.${a1_id}.evidence_weight_for still 0, so a partially applied write did not leak"
            - "call 13: HTTP 200 with Investigation.${i1_id}.status == PENDING_REVIEW, Allegation.${a1_id}.preponderance_met == true (60.00 percent) and Allegation.${a2_id}.preponderance_met == true (55.00 percent)"

      - name: disposition_and_discipline_guards_each_report_their_own_code
        claim_type: Error triggerable
        grounds:
          - errors.ERR_DISPOSITION_NOT_SUPPORTED
          - errors.ERR_ALLEGATION_ALREADY_DISPOSED
          - errors.ERR_SUSTAINED_NOT_WITHDRAWABLE
          - errors.ERR_DISCIPLINE_STATE_INVALID
          - errors.ERR_APPEAL_WINDOW_CLOSED
        distinguishing_aspect: |
          The adjudication stage refuses four different things for four different reasons and one of
          them is only reachable through the late withdrawal path: once an allegation is SUSTAINED
          the complaint sits in ADJUDICATION, which is a legal from-state for withdrawal, so the
          priority-8 state gate passes and the priority-12 sustained-finding rule is what refuses
          the request. ERR_DISPOSITION_NOT_SUPPORTED must fire for two distinct reasons - UNFOUNDED
          against non-zero supporting weight, and EXONERATED against a non-compliant finding - and
          the appeal window is measured from imposed_at, not from the effective date.
        test_recipe:
          setup:
            - "The world state is the one left by every_path_id_family fixture pattern: Internal Affairs (Commander Reyes, Investigator Ahn), Patrol North (Sergeant Doyle, Officer Vance), room HQ / Interview 1."
            - "A supervisor-channel complaint CMP-000001 carries two allegations against Officer Vance: A1 NEGLECT_OF_DUTY class B and A2 DISCOURTESY class C."
            - "The interview has been held and complete findings recorded 60 for / 40 against on A1 and 55 / 45 on A2, so both allegations show preponderance_met true and the complaint is in ADJUDICATION."
            - "The logical clock stands at 2026-08-09T09:00:00Z; APPEAL_WINDOW_DAYS is 15."
