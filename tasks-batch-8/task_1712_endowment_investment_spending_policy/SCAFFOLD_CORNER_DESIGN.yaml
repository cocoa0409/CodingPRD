            - { call: "POST /endowment/reports", payload: { pool_id: "${dg_pool}", report_type: BOARD_INVESTMENT, fiscal_year: 2026 }, as: InvestmentOfficer, as_user_id: "io-1", captures: { dg_rep: $.data.id } }
            - { call: "POST /endowment/reports/${dg_rep}/submit_review", payload: {}, as: InvestmentOfficer, as_user_id: "io-1" }
            - { call: "GET /endowment/allocations?pool_id=${dg_pool}&asset_class=US_EQUITY", as: InvestmentOfficer, captures: { dg_us_al: "$.data[0].id", dg_us_st: "$.data[0].drift_status" } }
            - { call: "GET /endowment/allocations?pool_id=${dg_pool}&asset_class=CASH", as: InvestmentOfficer, captures: { dg_ca_al: "$.data[0].id" } }
          trigger:
            - { call: "POST /endowment/reports/${dg_rep}/publish", payload: {}, as: BoardMember, as_user_id: "bm-1", captures: { dg_err: $.data.error_id } }
            - { call: "POST /endowment/allocations/${dg_us_al}/acknowledge_drift", payload: {}, as: BoardMember, as_user_id: "bm-1" }
            - { call: "POST /endowment/reports/${dg_rep}/publish", payload: {}, as: BoardMember, as_user_id: "bm-1", captures: { dg_err2: $.data.error_id } }
            - { call: "POST /endowment/allocations/${dg_ca_al}/acknowledge_drift", payload: {}, as: BoardMember, as_user_id: "bm-1" }
            - { call: "POST /endowment/reports/${dg_rep}/publish", payload: {}, as: BoardMember, as_user_id: "bm-1", captures: { dg_ok: $.data.report_status } }
          assert:
            - "after Q4: US_EQUITY drift_status == BREACHED (actual 6000 vs target 5000, band 500)"
            - "first publish: http 422 ERR_DRIFT_NOT_ACKNOWLEDGED"
            - "after acknowledging ONLY US_EQUITY: publish still fails ERR_DRIFT_NOT_ACKNOWLEDGED (CASH still breached-unacknowledged)"
            - "after acknowledging both: publish succeeds, report_status == PUBLISHED"

  # ===================== Section: cross_cutting_complexity_layers =====================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_finalize_rejected_with_stale_pool_version_then_recovers
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[valuation-finalize-stale-pool]", "errors[ERR_STALE_POOL_VERSION]"]
        distinguishing_aspect: "A finalize carrying the pool version from before an intervening suspend/resume pair fails 412 even though every state precondition passes; re-reading the version and resubmitting the identical finalize succeeds — the rejection is pure OCC staleness."
        test_recipe:
          setup: ["zero-manager pool (version captured at creation), allocation set, Q1 PRELIMINARY valuation; the pool is then suspended and resumed, advancing its version twice"]
          setup_api_calls:
            - { call: "POST /endowment/pools", payload: { pool_name: "Pool OC", inception_fiscal_year: 2026 }, as: EndowmentAdmin, captures: { oc_pool: $.data.id, oc_pv1: $.data.version } }
            - { call: "POST /endowment/allocations/bulk_upsert", payload: { pool_id: "${oc_pool}", items: [ { asset_class: CASH, target_pct_bps: 10000, rebalance_band_bps: 500 } ] }, as: EndowmentAdmin }
            - { call: "POST /endowment/valuations", payload: { pool_id: "${oc_pool}", estimated_pool_market_value_cents: 0 }, as: InvestmentOfficer, captures: { oc_v1: $.data.id } }
            - { call: "POST /endowment/pools/${oc_pool}/suspend", payload: {}, as: EndowmentAdmin }
            - { call: "POST /endowment/pools/${oc_pool}/resume", payload: {}, as: EndowmentAdmin }
          trigger:
            - { call: "POST /endowment/valuations/${oc_v1}/finalize", payload: { final_pool_market_value_cents: 0, expected_pool_version: "${oc_pv1}" }, as: InvestmentOfficer, captures: { oc_err: $.data.error_id } }
            - { call: "GET /endowment/pools/${oc_pool}", as: InvestmentOfficer, captures: { oc_pv3: $.data.version } }
            - { call: "POST /endowment/valuations/${oc_v1}/finalize", payload: { final_pool_market_value_cents: 0, expected_pool_version: "${oc_pv3}" }, as: InvestmentOfficer, captures: { oc_ok: $.data.valuation_status } }
          assert:
            - "stale finalize: http 412 ERR_STALE_POOL_VERSION (pool.version moved 1 -> 3 across suspend/resume)"
            - "fresh finalize with the re-read version: valuation_status == FINAL"
            - "EndowmentPool.version == 4 after the successful finalize (finalize itself increments)"

      - name: occ_policy_adopt_rejected_with_stale_pool_version
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[policy-adopt-stale-pool]", "errors[ERR_STALE_POOL_VERSION]"]
        distinguishing_aspect: "Adopting policy B with the pool version captured BEFORE policy A's adoption fails 412 — A's adoption legitimately superseded the policy landscape the client based its request on; a re-read version lets B adopt and supersedes A."
        test_recipe:
          setup: ["pool (version captured) with two DRAFT policies: A (effective 2026) and B (effective 2027)"]
          setup_api_calls:
            - { call: "POST /endowment/pools", payload: { pool_name: "Pool OA", inception_fiscal_year: 2026 }, as: EndowmentAdmin, captures: { oa_pool: $.data.id, oa_pv1: $.data.version } }
            - { call: "POST /endowment/policies", payload: { pool_id: "${oa_pool}", spending_rate_bps: 500, smoothing_window_quarters: 4, band_floor_bps: 0, band_cap_bps: 10000, effective_from_fiscal_year: 2026 }, as: InvestmentOfficer, as_user_id: "io-1", captures: { oa_pa: $.data.id } }
            - { call: "POST /endowment/policies", payload: { pool_id: "${oa_pool}", spending_rate_bps: 550, smoothing_window_quarters: 4, band_floor_bps: 0, band_cap_bps: 10000, effective_from_fiscal_year: 2027 }, as: InvestmentOfficer, as_user_id: "io-1", captures: { oa_pb: $.data.id } }
          trigger:
            - { call: "POST /endowment/policies/${oa_pa}/adopt", payload: { expected_pool_version: "${oa_pv1}" }, as: BoardMember, as_user_id: "bm-1", captures: { oa_a_st: $.data.policy_status } }
            - { call: "POST /endowment/policies/${oa_pb}/adopt", payload: { expected_pool_version: "${oa_pv1}" }, as: BoardMember, as_user_id: "bm-1", captures: { oa_err: $.data.error_id } }
            - { call: "GET /endowment/pools/${oa_pool}", as: InvestmentOfficer, captures: { oa_pv2: $.data.version } }
            - { call: "POST /endowment/policies/${oa_pb}/adopt", payload: { expected_pool_version: "${oa_pv2}" }, as: BoardMember, as_user_id: "bm-1", captures: { oa_b_st: $.data.policy_status } }
            - { call: "GET /endowment/policies/${oa_pa}", as: InvestmentOfficer, captures: { oa_a_st2: $.data.policy_status } }
          assert:
            - "A adopts cleanly with the creation-time version (no pool mutation happened before it)"
            - "B's adopt with the now-stale version: http 412 ERR_STALE_POOL_VERSION"
            - "B's adopt with the re-read version: ADOPTED, and A is now SUPERSEDED (B's later effective year closes A's window)"

      - name: supersede_rolls_back_unconsumed_quarter_and_refinalizes
        claim_type: ops_run_checkpoint
        grounds: [state_machines.UnitValuation.FINAL_to_SUPERSEDED, "endpoints[POST /endowment/valuations/{valuation_id}/supersede]"]
        distinguishing_aspect: "Superseding an unconsumed FINAL quarter rolls the pool back (current_quarter_index 1 -> 0, price restored to 100000 inception), marks the old valuation SUPERSEDED, and spawns a corrective PRELIMINARY for the same quarter which can then finalize cleanly."
        test_recipe:
          setup: ["zero-manager pool with allocation; Q1 valuation FINAL (MV 0, price inception); pool version captured after the finalize"]
          setup_api_calls:
            - { call: "POST /endowment/pools", payload: { pool_name: "Pool SS", inception_fiscal_year: 2026 }, as: EndowmentAdmin, captures: { ss_pool: $.data.id, ss_pv1: $.data.version } }
            - { call: "POST /endowment/allocations/bulk_upsert", payload: { pool_id: "${ss_pool}", items: [ { asset_class: CASH, target_pct_bps: 10000, rebalance_band_bps: 500 } ] }, as: EndowmentAdmin }
            - { call: "POST /endowment/valuations", payload: { pool_id: "${ss_pool}", estimated_pool_market_value_cents: 0 }, as: InvestmentOfficer, captures: { ss_v1: $.data.id } }
            - { call: "POST /endowment/valuations/${ss_v1}/finalize", payload: { final_pool_market_value_cents: 0, expected_pool_version: "${ss_pv1}" }, as: InvestmentOfficer }
            - { call: "GET /endowment/pools/${ss_pool}", as: InvestmentOfficer, captures: { ss_pv2: $.data.version } }
          trigger:
            - { call: "POST /endowment/valuations/${ss_v1}/supersede", payload: { revised_pool_market_value_cents: 0, expected_pool_version: "${ss_pv2}" }, as: InvestmentOfficer, captures: { ss_v2: $.data.id, ss_v2_q: $.data.quarter_index, ss_v2_st: $.data.valuation_status, ss_v2_sup: $.data.supersedes_valuation_id } }
            - { call: "GET /endowment/valuations/${ss_v1}", as: InvestmentOfficer, captures: { ss_v1_st: $.data.valuation_status } }
            - { call: "GET /endowment/pools/${ss_pool}", as: InvestmentOfficer, captures: { ss_q: $.data.current_quarter_index, ss_price: $.data.current_unit_price_millicents, ss_pv3: $.data.version } }
            - { call: "POST /endowment/valuations/${ss_v2}/finalize", payload: { final_pool_market_value_cents: 0, expected_pool_version: "${ss_pv3}" }, as: InvestmentOfficer, captures: { ss_v2_final: $.data.valuation_status } }
            - { call: "GET /endowment/pools/${ss_pool}", as: InvestmentOfficer, captures: { ss_q2: $.data.current_quarter_index } }
          assert:
            - "supersede returns 201 with the corrective valuation: quarter_index == 1, valuation_status == PRELIMINARY, supersedes_valuation_id == ${ss_v1}"
            - "old valuation: SUPERSEDED; pool rolled back: current_quarter_index == 0 and current_unit_price_millicents == 100000"
            - "corrective finalize succeeds (quarter 1 re-runs): valuation_status == FINAL and pool.current_quarter_index back to 1 (${ss_q2} == 1)"

      - name: term_endowment_maturity_lifts_underwater_suspension_at_exact_quarter
        claim_type: rate_threshold_triggers
        grounds: ["calculations.underwater_flag", "state_machines.Fund.SPENDING_SUSPENDED_to_NORMAL", "entities.Fund.fields.term_end_quarter_index"]
        distinguishing_aspect: "A TERM fund with term_end_quarter_index 3 is suspended by the Q2 crash (quarter 2 < 3); the Q3 finalize (quarter 3 >= 3, boundary inclusive) lifts the posture to NORMAL even though is_underwater remains true — the maturity exemption, not a price recovery, ends the suspension."
        test_recipe:
          setup:
            - "pool with allocation and engaged manager; ACTIVE TERM fund FTM (term_end_quarter_index 3) holding 50000000000 micro-units (CORPUS 5000000, HGV 5000000)"
            - "Q1 finalized flat at MV 5000000 (price inception 100000, MV == HGV, posture NORMAL); Q2 crashes ending MV to 2500000 (price 50000) and is finalized while quarter 2 < term_end 3; the Q3 report holds MV flat at 2500000"
          setup_api_calls:
            - { call: "POST /endowment/pools", payload: { pool_name: "Pool TM2", inception_fiscal_year: 2026 }, as: EndowmentAdmin, captures: { te_pool: $.data.id, te_pv: $.data.version } }
            - { call: "POST /endowment/allocations/bulk_upsert", payload: { pool_id: "${te_pool}", items: [ { asset_class: US_EQUITY, target_pct_bps: 10000, rebalance_band_bps: 500 } ] }, as: EndowmentAdmin }
            - { call: "POST /endowment/managers", payload: { pool_id: "${te_pool}", manager_name: "M TE", asset_class: US_EQUITY, benchmark_code: "SPX", coverage_start_quarter: 1 }, as: InvestmentOfficer, captures: { te_mgr: $.data.id } }
            - { call: "POST /endowment/managers/${te_mgr}/engage", payload: {}, as: InvestmentOfficer }
            - { call: "POST /endowment/funds", payload: { pool_id: "${te_pool}", fund_code: "FTM", fund_name: "Fund TM", endowment_class: TERM_ENDOWMENT, term_end_quarter_index: 3, purpose_restriction: UNRESTRICTED }, as: DevelopmentOfficer, captures: { te_fund: $.data.id } }
            - { call: "POST /endowment/donors", payload: { donor_name: "D TE", donor_type: INDIVIDUAL }, as: DevelopmentOfficer, captures: { te_donor: $.data.id } }
            - { call: "POST /endowment/gifts", payload: { fund_id: "${te_fund}", donor_id: "${te_donor}", external_ref: "TE1", gift_type: CORPUS, amount_cents: 5000000 }, as: DevelopmentOfficer, captures: { te_g: $.data.id } }
            - { call: "POST /endowment/funds/${te_fund}/activate", payload: {}, as: DevelopmentOfficer }
            - { call: "POST /endowment/gifts/${te_g}/receive", payload: {}, as: DevelopmentOfficer }
            - { call: "POST /endowment/manager-quarter-reports", payload: { manager_id: "${te_mgr}", quarter_index: 1, beginning_mv_cents: 0, ending_mv_cents: 5000000, flows: [ { day_offset: 0, amount_cents: 5000000 } ], benchmark_return_bps: 0 }, as: InvestmentOfficer }
            - { call: "POST /endowment/valuations", payload: { pool_id: "${te_pool}", estimated_pool_market_value_cents: 5000000 }, as: InvestmentOfficer, captures: { te_v1: $.data.id } }
            - { call: "POST /endowment/valuations/${te_v1}/finalize", payload: { final_pool_market_value_cents: 5000000, expected_pool_version: "${te_pv}" }, as: InvestmentOfficer }
            - { call: "POST /endowment/manager-quarter-reports", payload: { manager_id: "${te_mgr}", quarter_index: 2, beginning_mv_cents: 5000000, ending_mv_cents: 2500000, flows: [], benchmark_return_bps: 0 }, as: InvestmentOfficer }
            - { call: "POST /endowment/valuations", payload: { pool_id: "${te_pool}", estimated_pool_market_value_cents: 2500000 }, as: InvestmentOfficer, captures: { te_v2: $.data.id } }
            - { call: "GET /endowment/pools/${te_pool}", as: InvestmentOfficer, captures: { te_pv2: $.data.version } }
            - { call: "POST /endowment/valuations/${te_v2}/finalize", payload: { final_pool_market_value_cents: 2500000, expected_pool_version: "${te_pv2}" }, as: InvestmentOfficer }
            - { call: "GET /endowment/funds/${te_fund}", as: InvestmentOfficer, captures: { te_post2: $.data.spending_posture, te_under2: $.data.is_underwater } }
            - { call: "POST /endowment/manager-quarter-reports", payload: { manager_id: "${te_mgr}", quarter_index: 3, beginning_mv_cents: 2500000, ending_mv_cents: 2500000, flows: [], benchmark_return_bps: 0 }, as: InvestmentOfficer }
            - { call: "POST /endowment/valuations", payload: { pool_id: "${te_pool}", estimated_pool_market_value_cents: 2500000 }, as: InvestmentOfficer, captures: { te_v3: $.data.id } }
            - { call: "GET /endowment/pools/${te_pool}", as: InvestmentOfficer, captures: { te_pv3: $.data.version } }
          trigger:
            - { call: "POST /endowment/valuations/${te_v3}/finalize", payload: { final_pool_market_value_cents: 2500000, expected_pool_version: "${te_pv3}" }, as: InvestmentOfficer }
            - { call: "GET /endowment/funds/${te_fund}", as: InvestmentOfficer, captures: { te_post3: $.data.spending_posture, te_under3: $.data.is_underwater, te_mv3: $.data.market_value_cents } }
          assert:
            - "after Q2 (quarter 2 < term_end 3): is_underwater == true (MV 2500000 < HGV 5000000) and spending_posture == SPENDING_SUSPENDED"
            - "after Q3 (quarter 3 >= term_end 3): is_underwater STILL == true (price flat at 50000, market_value_cents == 2500000) but spending_posture == NORMAL — maturity exempts the fund at exactly the boundary quarter"

      - name: dual_variant_calculation_layer_coverage
        claim_type: dual_variant_calculation
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: gift_unitization_provisional_estimate_diverges_from_final_price_units
          rationale: "Both dual-variant pairs (gift price estimate, Dietz vs simple) are asserted with literal divergent values in §1.8 rule 1."

      - name: transitive_cascade_layer_coverage
        claim_type: cascading_side_effects
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: finalize_exception_expiry_cascades_distribution_revert_and_posture_depth3
          rationale: "The depth-3 expiry cascade and the depth-2 rescind cascade are asserted link-by-link in §1.8 rule 4."

  # ===================== Section: consistency_model =====================
  - section: consistency_model
    instances:
      - name: mutations_visible_in_the_same_response_immediate_consistency
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model, state_machines.EndowmentPool.ACTIVE_to_SUSPENDED]
        distinguishing_aspect: "Writes return post-mutation state with no re-read: the activate response itself carries fund_status ACTIVE and activated_quarter_index 1; the suspend response carries SUSPENDED with version incremented by exactly 1 over creation."
        test_recipe:
          setup: ["pool and DRAFT fund with a sufficient pledge"]
          setup_api_calls:
            - { call: "POST /endowment/pools", payload: { pool_name: "Pool IC", inception_fiscal_year: 2026 }, as: EndowmentAdmin, captures: { ic_pool: $.data.id, ic_pv: $.data.version } }
            - { call: "POST /endowment/funds", payload: { pool_id: "${ic_pool}", fund_code: "FIC", fund_name: "Fund IC", endowment_class: TRUE_ENDOWMENT, purpose_restriction: UNRESTRICTED }, as: DevelopmentOfficer, captures: { ic_fund: $.data.id } }
            - { call: "POST /endowment/donors", payload: { donor_name: "D IC", donor_type: INDIVIDUAL }, as: DevelopmentOfficer, captures: { ic_donor: $.data.id } }
            - { call: "POST /endowment/gifts", payload: { fund_id: "${ic_fund}", donor_id: "${ic_donor}", external_ref: "IC1", gift_type: CORPUS, amount_cents: 5000000 }, as: DevelopmentOfficer }
          trigger:
            - { call: "POST /endowment/funds/${ic_fund}/activate", payload: {}, as: DevelopmentOfficer, captures: { ic_st: $.data.fund_status, ic_aq: $.data.activated_quarter_index } }
            - { call: "POST /endowment/pools/${ic_pool}/suspend", payload: {}, as: EndowmentAdmin, captures: { ic_pool_st: $.data.pool_status, ic_pv2: $.data.version } }
          assert:
            - "activate response body: fund_status == ACTIVE and activated_quarter_index == 1 (no GET needed)"
            - "suspend response body: pool_status == SUSPENDED and version == ${ic_pv} + 1"
