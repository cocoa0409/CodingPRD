  - section: validations
    instances:
      - name: opening_a_return_at_trial_ends_at_returns_trial_window_expired
        claim_type: Violation → Error
        grounds:
          - validations[priority=18]
          - errors.ERR_TRIAL_WINDOW_EXPIRED
          - state_machines.TrialOrder.trial_status.TRIAL_ACTIVE_to_TRIAL_EXPIRED
        distinguishing_aspect: "The trial-window check is exclusive at the upper end: at exactly trial_ends_at (2026-11-09T00:00:00Z for a 2026-08-01 delivery with trial_nights 100) the clock is no longer < trial_ends_at, so the request is refused with 422 ERR_TRIAL_WINDOW_EXPIRED and priority 7 lets the lazily expired order through to priority 18."
        test_recipe:
          setup:
            - "One QUEEN MattressModel with the default trial_nights 100."
            - "One Customer with a DTC order delivered 2026-08-01, so break_in_ends_at is 2026-08-22 and trial_ends_at is 2026-11-09."
            - "Clock set to exactly 2026-11-09T00:00:00Z."
          setup_api_calls:
            - call: "POST /mattress-models"
              payload: { sku: "MDL-Q-V1", name: "Comfort Q", firmness: "MEDIUM", size: "QUEEN", list_price_cents: 120000 }
              as: PlatformAdmin
              captures: { model_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "v1@example.com", full_name: "Vic One", household_hash: "HH-V1" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /trial-orders"
              payload: { customer_id: "${cust_id}", model_id: "${model_id}", channel: "DTC", gross_price_cents: 120000 }
              as: TrialSupportAgent
              captures: { order_id: $.data.id }
            - call: "POST /trial-orders/${order_id}/dispatch"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /trial-orders/${order_id}/deliver"
              payload: {}
              as: LogisticsCoordinator
              captures: { order_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-09T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /return-cases"
              payload: { order_id: "${order_id}", reason_code: "COMFORT" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /return-cases?order_id=${order_id}"
              payload: {}
              as: TrialSupportAgent
          assert:
            - "response code == 422 with data.error_id == ERR_TRIAL_WINDOW_EXPIRED"
            - "GET /return-cases?order_id=${order_id} returns total_count == 0"
            - "TrialOrder.${order_id}.trial_status == TRIAL_EXPIRED and version == ${order_v} (a lazy re-derivation never bumps version)"
            - "TrialOrder.${order_id}.trial_ends_at == 2026-11-09T00:00:00Z"

      - name: compression_complaint_before_the_recovery_wait_returns_recovery_window_not_elapsed
        claim_type: Violation → Error
        grounds:
          - validations[priority=19]
          - errors.ERR_RECOVERY_WINDOW_NOT_ELAPSED
          - calculations.quality_claim_credit.constants.COMPRESSION_RECOVERY_WAIT_NIGHTS
        distinguishing_aspect: "A compressed mattress must be given COMPRESSION_RECOVERY_WAIT_NIGHTS (3) to expand: at clock 2026-08-03 only 2 whole nights have passed since the 2026-08-01 delivery, so the complaint is refused with 422 and the order stays DELIVERED rather than moving to DAMAGED_REPORTED."
        test_recipe:
          setup:
            - "One QUEEN MattressModel, one Customer with a DTC order delivered 2026-08-01."
            - "Clock at 2026-08-03 (2 nights)."
          setup_api_calls:
            - call: "POST /mattress-models"
              payload: { sku: "MDL-Q-V2", name: "Comfort Q", firmness: "MEDIUM", size: "QUEEN", list_price_cents: 120000 }
              as: PlatformAdmin
              captures: { model_id: $.data.id }
