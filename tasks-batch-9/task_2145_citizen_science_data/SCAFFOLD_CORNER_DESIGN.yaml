            - call: "GET /citizen-science/observations/${o1}"
              payload: {}
              as: ProgramAdmin
              captures: { o1_v2: $.data.version }
            - call: "POST /citizen-science/observations/${o1}/votes"
              payload: { decision: "CONFIRM", confidence: 5, expected_observation_version: "${o1_v2}" }
