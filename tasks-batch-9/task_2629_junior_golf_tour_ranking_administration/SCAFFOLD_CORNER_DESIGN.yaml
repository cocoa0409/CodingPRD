            - { call: "POST /members", payload: { season_id: "${season_id}", full_name: "Ava Stone", birth_date: "2010-05-04", state_code: "NC", guardian_email: "ava.guardian@example.com", handicap_index: 3.2, handicap_effective_date: "2026-07-15", handicap_source: "WHS_CLUB", publication_opt_in: true }, as: Anonymous, captures: { m1_id: $.data.id } }
            - { call: "POST /members", payload: { season_id: "${season_id}", full_name: "Ben Cole", birth_date: "2010-06-15", state_code: "SC", guardian_email: "ben.guardian@example.com", handicap_index: 5.1, handicap_effective_date: "2026-07-20", handicap_source: "WHS_CLUB", publication_opt_in: false }, as: Anonymous, captures: { m2_id: $.data.id } }
            - { call: "POST /members", payload: { season_id: "${season_id}", full_name: "Cara Diaz", birth_date: "2010-03-02", state_code: "GA", guardian_email: "cara.guardian@example.com", handicap_index: 6.4, handicap_effective_date: "2026-07-22", handicap_source: "WHS_CLUB", publication_opt_in: false }, as: Anonymous, captures: { m3_id: $.data.id } }
            - { call: "POST /members/${m1_id}/verify-eligibility", payload: { decision: "VERIFIED" }, as: TourAdmin }
            - { call: "POST /members/${m2_id}/verify-eligibility", payload: { decision: "VERIFIED" }, as: TourAdmin }
            - { call: "POST /members/${m3_id}/verify-eligibility", payload: { decision: "VERIFIED" }, as: TourAdmin }
            - { call: "POST /tournaments", payload: { season_id: "${season_id}", name: "Carolina Regional", division: "U17", tier: "REGIONAL", start_date: "2026-09-10", end_date: "2026-09-11", entry_open_at: "2026-08-05T00:00:00Z", entry_close_at: "2026-09-01T00:00:00Z", withdrawal_deadline_at: "2026-09-05T00:00:00Z", field_size_limit: 1, max_handicap_index: 8.4, entry_fee_cents: 25000, round_count: 2, course_rating: 71.4, slope_rating: 128 }, as: TourAdmin, captures: { t1_id: $.data.id } }
            - { call: "POST /tournaments/${t1_id}/open-entries", payload: {}, as: TourAdmin }
            - { call: "POST /entries", payload: { member_id: "${m1_id}", tournament_id: "${t1_id}" }, as: Member, as_user_id: "${m1_id}", captures: { e1_id: $.data.id } }
            - { call: "POST /entries", payload: { member_id: "${m2_id}", tournament_id: "${t1_id}" }, as: Member, as_user_id: "${m2_id}", captures: { e2_id: $.data.id } }
            - { call: "POST /entries", payload: { member_id: "${m3_id}", tournament_id: "${t1_id}" }, as: Member, as_user_id: "${m3_id}", captures: { e3_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-09-01T00:00:00Z" }, as: Anonymous }
            - { call: "POST /tournaments/${t1_id}/close-entries", payload: {}, as: TourAdmin }
            - { call: "POST /tournaments/${t1_id}/set-field", payload: {}, as: TourAdmin, captures: { acc0: $.data.accepted_count, wl0: $.data.waitlist_count } }
            - { call: "GET /entries/${e3_id}", payload: {}, as: TourAdmin, captures: { wp3a: $.data.waitlist_position } }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-09-02T00:00:00Z" }, as: Anonymous }
          trigger:
            - { call: "POST /entries/${e2_id}/withdraw", payload: { reason: "junior prom" }, as: Member, as_user_id: "${m2_id}", captures: { st2: $.data.entry_status, wp2: $.data.waitlist_position } }
          assert:
            - "${acc0} == 1"
            - "${wl0} == 2"
            - "${wp3a} == 2"
            - "http_status == 200"
            - "${st2} == WITHDRAWN"
            - "${wp2} == null"
            - "Entry.${e1_id}.entry_status == ACCEPTED"
            - "Entry.${e3_id}.entry_status == WAITLISTED"
            - "Entry.${e3_id}.waitlist_position == 1"
            - "Tournament.${t1_id}.accepted_count == 1"
            - "Tournament.${t1_id}.waitlist_count == 1"
            - "Tournament.${t1_id}.closed_count == 1"
            - "Tournament.${t1_id}.open_slot_count == 0"
            - "Tournament.${t1_id}.entry_count == 3"
            - "Member.${m2_id}.late_withdrawal_count == 0"

      - name: ranking_two_variants_diverge_on_the_same_results
        claim_type: variant_divergence
        grounds:
          - calculations.member_ranking_points.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / ranking_provisional_live_diverges_from_certified_run
          rationale: "That §1.8 instance runs both variants over one result set and pins the delta between provisional_live and certified_run."

      - name: assistance_two_variants_diverge_on_the_same_application
        claim_type: variant_divergence
        grounds:
          - calculations.assistance_award_amount.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / assistance_estimate_diverges_from_event_settlement
          rationale: "That §1.8 instance contrasts the sliding_scale_estimate against the event_settlement figure for the same approved application."

      - name: fee_settlement_propagates_through_its_four_steps
        claim_type: constraint_propagation
        grounds:
          - calculations.entry_fee_settlement
        excluded_because:
          difficulty_instance: combinatorial_formula / entry_fee_settlement_step_order_is_pinned
          rationale: "That §1.8 instance pins the surcharge-before-aid step order and the forbidden alternative ordering."

      - name: ranking_input_set_excludes_disqualified_entries
        claim_type: input_set_filtering
        grounds:
          - calculations.member_ranking_points
          - calculations.entry_event_points
        excluded_because:
          difficulty_instance: transitive_cascade / rules_disqualification_retroactive_ranking_cascade
          rationale: "That §1.8 instance zeroes event_points on disqualification and asserts the member's recomputed ranking excludes the entry."

      - name: event_points_correct_result_from_four_factors
        claim_type: correct_result
        grounds:
          - calculations.entry_event_points
        excluded_because:
          difficulty_instance: combinatorial_formula / event_points_four_factor_non_linear_interaction
          rationale: "That §1.8 instance computes event_points from tier base, field quality, finish decay and differential bonus with pre-computed literals."

  # =========================================================================
  # 4. From Table 4 (Validations)
  # =========================================================================
  - section: validations
    instances:

      - name: entry_into_the_wrong_age_division_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_50
          - errors.ERR_DIVISION_MISMATCH
          - calculations.member_age_division
        distinguishing_aspect: "m1's computed age_division is U17 and the tournament's division is U15, so POST /entries returns ERR_DIVISION_MISMATCH (422) and creates no Entry — the comparison is on the derived division, not on a raw age or a substring match of the labels."
        test_recipe:
          setup:
            - "One season with age_cutoff_date 2026-08-31 and one VERIFIED member m1 born 2010-05-04, so age_division is U17."
            - "One ENTRY_OPEN REGIONAL tournament whose division is U15."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-10T00:00:00Z" }, as: Anonymous }
            - { call: "POST /seasons", payload: { name: "2026 Junior Tour", start_date: "2026-01-01", end_date: "2026-12-31", age_cutoff_date: "2026-08-31", ranking_window_start_date: "2026-01-01", assistance_budget_cents: 500000 }, as: TourAdmin, captures: { season_id: $.data.id } }
            - { call: "POST /members", payload: { season_id: "${season_id}", full_name: "Ava Stone", birth_date: "2010-05-04", state_code: "NC", guardian_email: "ava.guardian@example.com", handicap_index: 3.2, handicap_effective_date: "2026-07-15", handicap_source: "WHS_CLUB", publication_opt_in: true }, as: Anonymous, captures: { m1_id: $.data.id, div: $.data.age_division } }
            - { call: "POST /members/${m1_id}/verify-eligibility", payload: { decision: "VERIFIED" }, as: TourAdmin }
            - { call: "POST /tournaments", payload: { season_id: "${season_id}", name: "Piedmont U15 Classic", division: "U15", tier: "REGIONAL", start_date: "2026-09-10", end_date: "2026-09-11", entry_open_at: "2026-08-05T00:00:00Z", entry_close_at: "2026-09-01T00:00:00Z", withdrawal_deadline_at: "2026-09-05T00:00:00Z", field_size_limit: 2, max_handicap_index: 8.4, entry_fee_cents: 25000, round_count: 2, course_rating: 71.4, slope_rating: 128 }, as: TourAdmin, captures: { t1_id: $.data.id } }
            - { call: "POST /tournaments/${t1_id}/open-entries", payload: {}, as: TourAdmin }
          trigger:
            - { call: "POST /entries", payload: { member_id: "${m1_id}", tournament_id: "${t1_id}" }, as: Member, as_user_id: "${m1_id}", captures: { err: $.data.error_id } }
          assert:
            - "${div} == U17"
            - "http_status == 409"
            - "${err} == ERR_DIVISION_MISMATCH"
            - "Tournament.${t1_id}.entry_count == 0"
            - "Tournament.${t1_id}.applied_count == 0"

      - name: handicap_above_the_ceiling_is_rejected_but_equal_is_accepted
        claim_type: satisfaction_to_pass
        grounds:
          - validations.priority_51
          - errors.ERR_HANDICAP_ABOVE_LIMIT
        distinguishing_aspect: "max_handicap_index 8.4 is inclusive: m4 at 12.5 is refused with ERR_HANDICAP_ABOVE_LIMIT while m3 at exactly 8.4 is accepted with a 201 — a strict `<` implementation would wrongly refuse m3."
        test_recipe:
          setup:
            - "One season, one ENTRY_OPEN REGIONAL U17 tournament with max_handicap_index 8.4."
            - "VERIFIED member m4 Dana Reid with handicap_index 12.5 and VERIFIED member m3 Cara Diaz with handicap_index 8.4, both U17 and both with fresh handicap dates."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-10T00:00:00Z" }, as: Anonymous }
            - { call: "POST /seasons", payload: { name: "2026 Junior Tour", start_date: "2026-01-01", end_date: "2026-12-31", age_cutoff_date: "2026-08-31", ranking_window_start_date: "2026-01-01", assistance_budget_cents: 500000 }, as: TourAdmin, captures: { season_id: $.data.id } }
            - { call: "POST /members", payload: { season_id: "${season_id}", full_name: "Dana Reid", birth_date: "2010-04-11", state_code: "VA", guardian_email: "dana.guardian@example.com", handicap_index: 12.5, handicap_effective_date: "2026-07-15", handicap_source: "WHS_CLUB", publication_opt_in: false }, as: Anonymous, captures: { m4_id: $.data.id } }
            - { call: "POST /members", payload: { season_id: "${season_id}", full_name: "Cara Diaz", birth_date: "2010-03-02", state_code: "GA", guardian_email: "cara.guardian@example.com", handicap_index: 8.4, handicap_effective_date: "2026-07-22", handicap_source: "WHS_CLUB", publication_opt_in: false }, as: Anonymous, captures: { m3_id: $.data.id } }
            - { call: "POST /members/${m4_id}/verify-eligibility", payload: { decision: "VERIFIED" }, as: TourAdmin }
            - { call: "POST /members/${m3_id}/verify-eligibility", payload: { decision: "VERIFIED" }, as: TourAdmin }
            - { call: "POST /tournaments", payload: { season_id: "${season_id}", name: "Carolina Regional", division: "U17", tier: "REGIONAL", start_date: "2026-09-10", end_date: "2026-09-11", entry_open_at: "2026-08-05T00:00:00Z", entry_close_at: "2026-09-01T00:00:00Z", withdrawal_deadline_at: "2026-09-05T00:00:00Z", field_size_limit: 4, max_handicap_index: 8.4, entry_fee_cents: 25000, round_count: 2, course_rating: 71.4, slope_rating: 128 }, as: TourAdmin, captures: { t1_id: $.data.id } }
            - { call: "POST /tournaments/${t1_id}/open-entries", payload: {}, as: TourAdmin }
          trigger:
            - { call: "POST /entries", payload: { member_id: "${m4_id}", tournament_id: "${t1_id}" }, as: Member, as_user_id: "${m4_id}", captures: { err: $.data.error_id } }
            - { call: "POST /entries", payload: { member_id: "${m3_id}", tournament_id: "${t1_id}" }, as: Member, as_user_id: "${m3_id}", captures: { e3_id: $.data.id, st3: $.data.entry_status } }
          assert:
            - "trigger 1: http_status == 409"
            - "${err} == ERR_HANDICAP_ABOVE_LIMIT"
            - "trigger 2: http_status == 201"
            - "${st3} == APPLIED"
            - "Entry.${e3_id}.gross_fee_cents == 25000"
            - "Tournament.${t1_id}.entry_count == 1"
            - "Tournament.${t1_id}.applied_count == 1"

      - name: handicap_older_than_the_validity_window_is_rejected_at_the_day_boundary
        claim_type: temporal_validation
        grounds:
          - validations.priority_52
          - errors.ERR_HANDICAP_STALE
        distinguishing_aspect: "At clock 2026-08-10 the 180-day window reaches back to exactly 2026-02-11: m3's handicap dated 2026-02-11 enters successfully while m1's dated 2026-02-10 is refused with ERR_HANDICAP_STALE. An off-by-one window (179 or 181 days) flips one of the two results."
        test_recipe:
          setup:
            - "One season and one ENTRY_OPEN REGIONAL U17 tournament with field_size_limit 4."
            - "VERIFIED member m1 with handicap_effective_date 2026-02-10 (181 days before the clock)."
            - "VERIFIED member m3 with handicap_effective_date 2026-02-11 (exactly 180 days before the clock)."
            - "The clock is 2026-08-10T00:00:00Z."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-10T00:00:00Z" }, as: Anonymous }
            - { call: "POST /seasons", payload: { name: "2026 Junior Tour", start_date: "2026-01-01", end_date: "2026-12-31", age_cutoff_date: "2026-08-31", ranking_window_start_date: "2026-01-01", assistance_budget_cents: 500000 }, as: TourAdmin, captures: { season_id: $.data.id } }
            - { call: "POST /members", payload: { season_id: "${season_id}", full_name: "Ava Stone", birth_date: "2010-05-04", state_code: "NC", guardian_email: "ava.guardian@example.com", handicap_index: 3.2, handicap_effective_date: "2026-02-10", handicap_source: "WHS_CLUB", publication_opt_in: true }, as: Anonymous, captures: { m1_id: $.data.id } }
            - { call: "POST /members", payload: { season_id: "${season_id}", full_name: "Cara Diaz", birth_date: "2010-03-02", state_code: "GA", guardian_email: "cara.guardian@example.com", handicap_index: 6.4, handicap_effective_date: "2026-02-11", handicap_source: "WHS_CLUB", publication_opt_in: false }, as: Anonymous, captures: { m3_id: $.data.id } }
            - { call: "POST /members/${m1_id}/verify-eligibility", payload: { decision: "VERIFIED" }, as: TourAdmin }
            - { call: "POST /members/${m3_id}/verify-eligibility", payload: { decision: "VERIFIED" }, as: TourAdmin }
            - { call: "POST /tournaments", payload: { season_id: "${season_id}", name: "Carolina Regional", division: "U17", tier: "REGIONAL", start_date: "2026-09-10", end_date: "2026-09-11", entry_open_at: "2026-08-05T00:00:00Z", entry_close_at: "2026-09-01T00:00:00Z", withdrawal_deadline_at: "2026-09-05T00:00:00Z", field_size_limit: 4, max_handicap_index: 8.4, entry_fee_cents: 25000, round_count: 2, course_rating: 71.4, slope_rating: 128 }, as: TourAdmin, captures: { t1_id: $.data.id } }
            - { call: "POST /tournaments/${t1_id}/open-entries", payload: {}, as: TourAdmin }
          trigger:
            - { call: "POST /entries", payload: { member_id: "${m1_id}", tournament_id: "${t1_id}" }, as: Member, as_user_id: "${m1_id}", captures: { err: $.data.error_id } }
            - { call: "POST /entries", payload: { member_id: "${m3_id}", tournament_id: "${t1_id}" }, as: Member, as_user_id: "${m3_id}", captures: { e3_id: $.data.id, st3: $.data.entry_status } }
          assert:
            - "trigger 1: http_status == 409"
            - "${err} == ERR_HANDICAP_STALE"
            - "trigger 2: http_status == 201"
            - "${st3} == APPLIED"
            - "Tournament.${t1_id}.entry_count == 1"

      - name: self_attested_handicap_is_refused_only_at_the_top_tiers
        claim_type: conditional_validation
        grounds:
          - validations.priority_52
          - errors.ERR_HANDICAP_STALE
          - entities.Member.fields.handicap_source
        distinguishing_aspect: "The same fresh SELF_ATTESTED handicap is refused for the NATIONAL tournament and accepted for the REGIONAL one, so the rule is conditioned on Tournament.tier, not on the date: only NATIONAL and INVITATIONAL reject SELF_ATTESTED."
        test_recipe:
          setup:
            - "One season and one VERIFIED U17 member m1 whose handicap_source is SELF_ATTESTED and whose handicap_effective_date is 2026-07-15 (fresh)."
            - "Two ENTRY_OPEN U17 tournaments with non-overlapping travel windows: tN of tier NATIONAL on 2026-09-10/11 and tR of tier REGIONAL on 2026-10-15/16."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-10T00:00:00Z" }, as: Anonymous }
            - { call: "POST /seasons", payload: { name: "2026 Junior Tour", start_date: "2026-01-01", end_date: "2026-12-31", age_cutoff_date: "2026-08-31", ranking_window_start_date: "2026-01-01", assistance_budget_cents: 500000 }, as: TourAdmin, captures: { season_id: $.data.id } }
            - { call: "POST /members", payload: { season_id: "${season_id}", full_name: "Ava Stone", birth_date: "2010-05-04", state_code: "NC", guardian_email: "ava.guardian@example.com", handicap_index: 3.2, handicap_effective_date: "2026-07-15", handicap_source: "SELF_ATTESTED", publication_opt_in: true }, as: Anonymous, captures: { m1_id: $.data.id, src: $.data.handicap_source } }
            - { call: "POST /members/${m1_id}/verify-eligibility", payload: { decision: "VERIFIED" }, as: TourAdmin }
            - { call: "POST /tournaments", payload: { season_id: "${season_id}", name: "US Junior National", division: "U17", tier: "NATIONAL", start_date: "2026-09-10", end_date: "2026-09-11", entry_open_at: "2026-08-05T00:00:00Z", entry_close_at: "2026-09-01T00:00:00Z", withdrawal_deadline_at: "2026-09-05T00:00:00Z", field_size_limit: 4, max_handicap_index: 8.4, entry_fee_cents: 25000, round_count: 2, course_rating: 72.0, slope_rating: 130 }, as: TourAdmin, captures: { tn_id: $.data.id } }
            - { call: "POST /tournaments", payload: { season_id: "${season_id}", name: "Piedmont Regional", division: "U17", tier: "REGIONAL", start_date: "2026-10-15", end_date: "2026-10-16", entry_open_at: "2026-08-05T00:00:00Z", entry_close_at: "2026-10-01T00:00:00Z", withdrawal_deadline_at: "2026-10-10T00:00:00Z", field_size_limit: 4, max_handicap_index: 8.4, entry_fee_cents: 20000, round_count: 2, course_rating: 70.0, slope_rating: 120 }, as: TourAdmin, captures: { tr_id: $.data.id } }
            - { call: "POST /tournaments/${tn_id}/open-entries", payload: {}, as: TourAdmin }
            - { call: "POST /tournaments/${tr_id}/open-entries", payload: {}, as: TourAdmin }
          trigger:
            - { call: "POST /entries", payload: { member_id: "${m1_id}", tournament_id: "${tn_id}" }, as: Member, as_user_id: "${m1_id}", captures: { err: $.data.error_id } }
            - { call: "POST /entries", payload: { member_id: "${m1_id}", tournament_id: "${tr_id}" }, as: Member, as_user_id: "${m1_id}", captures: { er_id: $.data.id, str: $.data.entry_status } }
          assert:
            - "${src} == SELF_ATTESTED"
            - "trigger 1: http_status == 409"
            - "${err} == ERR_HANDICAP_STALE"
            - "trigger 2: http_status == 201"
            - "${str} == APPLIED"
            - "Entry.${er_id}.gross_fee_cents == 20000"
            - "Tournament.${tn_id}.entry_count == 0"
            - "Tournament.${tr_id}.entry_count == 1"

      - name: second_entry_into_the_same_tournament_is_a_duplicate
        claim_type: violation_to_error
        grounds:
          - validations.priority_55
          - errors.ERR_DUPLICATE_ENTRY
        distinguishing_aspect: "The member's first entry is APPLIED — a live status — so the second POST /entries for the same (member, tournament) returns ERR_DUPLICATE_ENTRY and the tournament census stays at entry_count 1; the duplicate is refused before any fee is settled a second time."
        test_recipe:
          setup:
            - "One season, one VERIFIED U17 member m1, one ENTRY_OPEN REGIONAL tournament with field_size_limit 4."
            - "m1 already holds one APPLIED entry."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-10T00:00:00Z" }, as: Anonymous }
            - { call: "POST /seasons", payload: { name: "2026 Junior Tour", start_date: "2026-01-01", end_date: "2026-12-31", age_cutoff_date: "2026-08-31", ranking_window_start_date: "2026-01-01", assistance_budget_cents: 500000 }, as: TourAdmin, captures: { season_id: $.data.id } }
            - { call: "POST /members", payload: { season_id: "${season_id}", full_name: "Ava Stone", birth_date: "2010-05-04", state_code: "NC", guardian_email: "ava.guardian@example.com", handicap_index: 3.2, handicap_effective_date: "2026-07-15", handicap_source: "WHS_CLUB", publication_opt_in: true }, as: Anonymous, captures: { m1_id: $.data.id } }
            - { call: "POST /members/${m1_id}/verify-eligibility", payload: { decision: "VERIFIED" }, as: TourAdmin }
            - { call: "POST /tournaments", payload: { season_id: "${season_id}", name: "Carolina Regional", division: "U17", tier: "REGIONAL", start_date: "2026-09-10", end_date: "2026-09-11", entry_open_at: "2026-08-05T00:00:00Z", entry_close_at: "2026-09-01T00:00:00Z", withdrawal_deadline_at: "2026-09-05T00:00:00Z", field_size_limit: 4, max_handicap_index: 8.4, entry_fee_cents: 25000, round_count: 2, course_rating: 71.4, slope_rating: 128 }, as: TourAdmin, captures: { t1_id: $.data.id } }
            - { call: "POST /tournaments/${t1_id}/open-entries", payload: {}, as: TourAdmin }
            - { call: "POST /entries", payload: { member_id: "${m1_id}", tournament_id: "${t1_id}" }, as: Member, as_user_id: "${m1_id}", captures: { e1_id: $.data.id } }
          trigger:
            - { call: "POST /entries", payload: { member_id: "${m1_id}", tournament_id: "${t1_id}" }, as: Member, as_user_id: "${m1_id}", captures: { err: $.data.error_id } }
          assert:
            - "http_status == 409"
            - "${err} == ERR_DUPLICATE_ENTRY"
            - "${err} != ERR_SCHEDULE_CONFLICT"
            - "Tournament.${t1_id}.entry_count == 1"
            - "Tournament.${t1_id}.applied_count == 1"
            - "Entry.${e1_id}.entry_status == APPLIED"

      - name: entry_before_the_window_opens_is_rejected
        claim_type: temporal_validation
        grounds:
