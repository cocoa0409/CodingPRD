              as: OperationsCoordinator
              captures: { seg_id: $.data.id }
            - call: "POST /dmc/staff-members"
              payload: { full_name: "Xenia Petrov", role_type: "GREETER", badge_expires_on: "2026-09-15", first_aid_expires_on: "2027-12-31", pay_rate_cents_per_hour: 3000, min_rest_minutes: 600, max_daily_minutes: 720, status: "ACTIVE" }
              as: ProgramDirector
              captures: { staff_x: $.data.id }
            - call: "POST /dmc/staff-members"
              payload: { full_name: "Yusuf Demir", role_type: "GREETER", badge_expires_on: "2026-08-31", first_aid_expires_on: "2027-12-31", pay_rate_cents_per_hour: 3000, min_rest_minutes: 600, max_daily_minutes: 720, status: "ACTIVE" }
              as: ProgramDirector
              captures: { staff_y: $.data.id }
            - call: "POST /dmc/staff-members"
              payload: { full_name: "Zola Mbeki", role_type: "GREETER", badge_expires_on: "2026-09-16", first_aid_expires_on: "2027-12-31", pay_rate_cents_per_hour: 3000, min_rest_minutes: 600, max_daily_minutes: 720, status: "ACTIVE" }
              as: ProgramDirector
              captures: { staff_z: $.data.id }
            - call: "POST /dmc/staff-assignments"
              payload: { staff_id: "${staff_x}", program_id: "${prog_id}", target_type: "SEGMENT", segment_id: "${seg_id}", role_type: "GREETER", starts_at: "2026-09-11T09:00:00Z", ends_at: "2026-09-11T13:00:00Z" }
              as: ProgramDirector
              captures: { asg_x: $.data.id }
            - call: "POST /dmc/staff-assignments"
              payload: { staff_id: "${staff_y}", program_id: "${prog_id}", target_type: "SEGMENT", segment_id: "${seg_id}", role_type: "GREETER", starts_at: "2026-09-11T09:00:00Z", ends_at: "2026-09-11T13:00:00Z" }
              as: ProgramDirector
              captures: { asg_y: $.data.id }
            - call: "POST /dmc/staff-assignments"
              payload: { staff_id: "${staff_z}", program_id: "${prog_id}", target_type: "SEGMENT", segment_id: "${seg_id}", role_type: "GREETER", starts_at: "2026-09-11T09:00:00Z", ends_at: "2026-09-11T13:00:00Z" }
              as: ProgramDirector
              captures: { asg_z: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramDirector
          trigger:
            - call: "POST /dmc/staff-assignments/${asg_x}/confirm"
              payload: {}
              as: ProgramDirector
            - call: "POST /dmc/staff-assignments/${asg_y}/confirm"
              payload: {}
              as: ProgramDirector
            - call: "POST /dmc/staff-assignments/${asg_z}/confirm"
              payload: {}
              as: ProgramDirector
          assert:
            - "StaffMember.${staff_x}.credential_status == EXPIRING"
            - "StaffMember.${staff_y}.credential_status == EXPIRED"
            - "StaffMember.${staff_z}.credential_status == VALID"
            - "the first trigger call returns HTTP 200 and StaffAssignment.${asg_x}.status == CONFIRMED"
            - "StaffAssignment.${asg_x}.planned_labor_cost_cents == 12000"
            - "the second trigger call returns HTTP 422 with data.error_id == ERR_CREDENTIAL_EXPIRED and StaffAssignment.${asg_y}.status == PROPOSED"
            - "the third trigger call returns HTTP 200 and StaffAssignment.${asg_z}.status == CONFIRMED"
            - "StaffMember.${staff_y}.confirmed_minutes_total == 0"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: mark_ready_requires_active_supplier_contract
        grounds:
          - state_machines.ProgramElement.PLANNED_to_READY
          - state_machines.SupplierContract.SENT_to_ACTIVE
          - validations[priority=37]
          - errors[ERR_NO_ACTIVE_SUPPLIER_CONTRACT]
          - entities.SupplierContract.fields.deposit_due_cents
        distinguishing_aspect: |
          The dependent/gating pair is (ProgramElement, SupplierContract): the identical mark-ready call is
          rejected with ERR_NO_ACTIVE_SUPPLIER_CONTRACT while the contract sits in SENT and succeeds
          unchanged once the contract reaches ACTIVE — nothing about the element itself changes between the
          two attempts.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; Venue capacity_reception 400; APPROVED Supplier with liability limit 500000000."
            - "Program 2026-09-10..2026-09-14; one ACTIVITY element 2026-09-12T09:00Z..12:00Z, planned/guaranteed 35, per_person_cost_cents 6000."
            - "One SupplierContract for that (program, supplier) with contract_value_cents 800000 and deposit_pct 0.3, left in status SENT (sent by user sm-sender-1, not yet countersigned)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /dmc/venues"
              payload: { name: "Botanical Conservatory", capacity_seated: 200, capacity_reception: 400, turnover_buffer_minutes: 90, requires_special_venue_permit: false, status: "ACTIVE" }
              as: ProgramDirector
              captures: { venue_id: $.data.id }
            - call: "POST /dmc/suppliers"
              payload: { legal_name: "Conservatory Events Co", supplier_type: "ACTIVITY", insurance_expires_on: "2027-01-31", insurance_liability_limit_cents: 500000000, coi_verified: true, status: "APPROVED" }
              as: SupplierManager
              captures: { sup_id: $.data.id }
            - call: "POST /dmc/programs"
              payload: { client_name: "Wexford Energy", group_name: "Board Retreat", arrival_date: "2026-09-10", departure_date: "2026-09-14", guaranteed_count: 35, markup_pct: 0.18 }
              as: ProgramDirector
              captures: { prog_id: $.data.id, prog_v1: $.data.version }
            - call: "POST /dmc/program-elements"
              payload: { program_id: "${prog_id}", supplier_id: "${sup_id}", venue_id: "${venue_id}", element_type: "ACTIVITY", title: "Conservatory Brunch", starts_at: "2026-09-12T09:00:00Z", ends_at: "2026-09-12T12:00:00Z", planned_headcount: 35, guaranteed_headcount: 35, per_person_cost_cents: 6000, is_weather_dependent: false, expected_program_version: "${prog_v1}" }
              as: ProgramDirector
              captures: { el_id: $.data.id }
            - call: "POST /dmc/supplier-contracts"
              payload: { program_id: "${prog_id}", supplier_id: "${sup_id}", contract_value_cents: 800000, required_liability_limit_cents: 100000000, deposit_pct: 0.3, cancellation_tier: "STANDARD" }
              as: SupplierManager
              captures: { ctr_id: $.data.id }
            - call: "POST /dmc/supplier-contracts/${ctr_id}/send"
              payload: {}
              as: SupplierManager
