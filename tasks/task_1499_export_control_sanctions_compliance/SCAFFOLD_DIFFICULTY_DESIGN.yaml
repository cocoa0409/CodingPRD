              payload: {}
              as: TradeOpsSpecialist
            - call: "POST /compliance/orders/${o_id}/attach-license"
              payload: { license_id: "${l_id}" }
              as: TradeOpsSpecialist
            - call: "POST /compliance/orders/${o_id}/release"
              payload: {}
              as: TradeOpsSpecialist
            - call: "POST /compliance/shipments"
              payload: { order_id: "${o_id}", quantity: 10, planned_ship_date: "2026-08-15" }
