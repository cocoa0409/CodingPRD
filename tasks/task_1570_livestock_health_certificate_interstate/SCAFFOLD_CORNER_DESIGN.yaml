# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Livestock Health Certificate & Interstate Movement
#
# Enumerative walk of claim-extraction-guide.md against SCAFFOLD.yaml §1.1–§1.7.
# Corners already exercised by SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as
# `excluded_because:` stubs citing the exact §1.8 instance name.
# All chains replay clean against §1.2 / §1.4 / §1.6 from empty-DB; every ${var}
# is bound by an earlier captures: in the same instance.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  # Section: entities (guide table 1)
  # ===========================================================================
  - section: entities
    instances:

      - name: premises_creation_defaults_applied
        claim_type: defaults
        grounds:
          - entities.Premises.fields.disease_status
          - entities.Premises.fields.current_head_count
        distinguishing_aspect: |
          Omitting the optional disease_status input applies the declared default
          MONITORED, and the computed current_head_count is initialized to
          initial_head_count at creation time (no movements yet).
        test_recipe:
          setup:
            - "Empty DB; default clock 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /api/premises"
              payload: { name: "Ranch D1", county: "Yolo", state_code: "CA", species_code: "CATTLE", initial_head_count: 20 }
              as: ProgramAdmin
              captures: { prem_id: $.data.id }
          trigger:
            - call: "GET /api/premises/${prem_id}"
              as: StateAuditor
              captures: { dstat: $.data.disease_status, cur: $.data.current_head_count, ver: $.data.version }
          assert:
            - "Premises.${prem_id}.disease_status == 'MONITORED' (default applied; input omitted)"
            - "Premises.${prem_id}.current_head_count == 20 (initialized from initial_head_count)"
            - "Premises.${prem_id}.version == 1"

      - name: entry_requirement_defaults_applied
        claim_type: defaults
        grounds:
          - entities.EntryRequirement.fields.vaccination_min_days_before_inspection
          - entities.EntryRequirement.fields.status
          - entities.EntryRequirement.fields.effective_until
        distinguishing_aspect: |
          Omitting vaccination_min_days_before_inspection and effective_until
          yields 0 and null respectively, and the row starts ACTIVE.
        test_recipe:
          setup:
            - "Empty DB"
          setup_api_calls:
            - call: "POST /api/entry-requirements"
              payload: { destination_state_code: "KS", species_code: "CATTLE", test_type: "BRUCELLOSIS", test_validity_days: 30, vaccination_required: false, permit_required: true, effective_from: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { req_id: $.data.id, vmin: $.data.vaccination_min_days_before_inspection, rstatus: $.data.status, euntil: $.data.effective_until }
          trigger:
            - call: "GET /api/entry-requirements"
              payload: { destination_state_code: "KS", species_code: "CATTLE" }
              as: StateAuditor
          assert:
            - "EntryRequirement.${req_id}.vaccination_min_days_before_inspection == 0 (default)"
            - "EntryRequirement.${req_id}.status == 'ACTIVE' (default)"
            - "EntryRequirement.${req_id}.effective_until == null (open-ended half-open window)"

      - name: test_record_default_result_pending
        claim_type: defaults
        grounds:
          - entities.TestRecord.fields.result
        distinguishing_aspect: |
          A newly registered TestRecord starts in RESULT_PENDING; no result
          transition has fired at creation.
        test_recipe:
          setup:
            - "Premises P (Yolo/CA, CATTLE, 20 head)"
          setup_api_calls:
            - call: "POST /api/premises"
              payload: { name: "Ranch D3", county: "Yolo", state_code: "CA", species_code: "CATTLE", initial_head_count: 20 }
              as: ProgramAdmin
              captures: { prem_id: $.data.id }
          trigger:
            - call: "POST /api/test-records"
              payload: { premises_id: "${prem_id}", species_code: "CATTLE", test_type: "BRUCELLOSIS", test_date: "2026-07-12T00:00:00Z", lab_reference: "LAB-D3" }
              as: LabTechnician
              captures: { test_id: $.data.id, res: $.data.result }
          assert:
            - "TestRecord.${test_id}.result == 'RESULT_PENDING' (initial state)"

      - name: veterinarian_is_credential_current_computed
        claim_type: computed_fields
        grounds:
          - entities.Veterinarian.fields.is_credential_current
        distinguishing_aspect: |
          is_credential_current is derived from status and
          accreditation_expires_at against the logical clock: a vet expiring
          2027-01-01 reads true at the default clock 2026-08-01, while a vet
          already expired at 2026-07-01 reads false despite status ACTIVE.
        test_recipe:
          setup:
            - "Empty DB; default clock 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /api/veterinarians"
              payload: { full_name: "Dr. Current", accreditation_number: "ACCRED-C", accreditation_expires_at: "2027-01-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { vet_ok: $.data.id, ok_flag: $.data.is_credential_current }
            - call: "POST /api/veterinarians"
              payload: { full_name: "Dr. Expired", accreditation_number: "ACCRED-X", accreditation_expires_at: "2026-07-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { vet_bad: $.data.id, bad_flag: $.data.is_credential_current, bad_status: $.data.status }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-15T00:00:00Z" }
              as: ProgramAdmin
              captures: { clock_now: $.data.current_utc }
          assert:
            - "Veterinarian.${vet_ok}.is_credential_current == true at the default clock 2026-08-01 (expiry 2027-01-01 >= clock)"
            - "Veterinarian.${vet_bad}.is_credential_current == false even though status == 'ACTIVE' (expiry 2026-07-01 < clock; computed from accreditation_expires_at, never client input)"
            - "Both flags were read from the POST /api/veterinarians responses themselves (no separate read endpoint exists)"

      - name: certificate_system_fields_stamped_on_create
        claim_type: system_fields
        grounds:
          - entities.Certificate.fields.vet_id
          - entities.Certificate.fields.cvi_number
          - entities.Certificate.fields.status
          - entities.Certificate.fields.provisional_fee_cents
        distinguishing_aspect: |
          At creation the server stamps vet_id from X-User-ID and leaves every
          lifecycle field null: cvi_number, issued_at, valid_until, fees,
          reject_reason, void_reason, pre_block_status.
        test_recipe:
          setup:
            - "Premises P (Yolo/CA, CATTLE, 20 head); vet V; clock at default 2026-08-01"
          setup_api_calls:
            - call: "POST /api/premises"
              payload: { name: "Ranch D5", county: "Yolo", state_code: "CA", species_code: "CATTLE", initial_head_count: 20 }
              as: ProgramAdmin
              captures: { prem_id: $.data.id }
            - call: "POST /api/veterinarians"
              payload: { full_name: "Dr. Ada", accreditation_number: "ACCRED-1", accreditation_expires_at: "2027-01-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { vet_id: $.data.id }
          trigger:
            - call: "POST /api/certificates"
              payload: { origin_premises_id: "${prem_id}", destination_state_code: "KS", species_code: "CATTLE", head_count: 5, inspection_date: "2026-08-01T00:00:00Z", consignment_description: "Feeder cattle" }
              as: AccreditedVet
              as_user_id: "${vet_id}"
              captures: { cert_id: $.data.id, cvet: $.data.vet_id, cstatus: $.data.status }
          assert:
            - "Certificate.${cert_id}.vet_id == ${vet_id} (stamped from X-User-ID)"
            - "Certificate.${cert_id}.status == 'DRAFT' (initial state)"
            - "Certificate.${cert_id}.cvi_number == null and issued_at == null and valid_until == null until issued"
            - "Certificate.${cert_id}.provisional_fee_cents == null and final_fee_cents == null before submit/issue"
            - "Certificate.${cert_id}.pre_block_status == null and reject_reason == null and void_reason == null"

      - name: permit_computed_headrooms_at_creation
        claim_type: computed_fields
        grounds:
          - entities.MovementPermit.fields.committed_headroom
          - entities.MovementPermit.fields.projected_headroom
          - entities.MovementPermit.fields.total_movement_fees_cents
          - entities.MovementPermit.fields.status
        distinguishing_aspect: |
          A freshly requested permit has zero consumed capacity: both headroom
          variants equal allocated_head_count and total_movement_fees_cents is 0,
          with status REQUESTED and permit_number still null.
        test_recipe:
          setup:
            - "Issued certificate (10 head CATTLE, NONE matrix) at clock 2026-08-10"
          setup_api_calls:
            - call: "POST /api/premises"
              payload: { name: "Ranch D6", county: "Yolo", state_code: "CA", species_code: "CATTLE", initial_head_count: 30 }
              as: ProgramAdmin
              captures: { prem_id: $.data.id }
            - call: "POST /api/veterinarians"
              payload: { full_name: "Dr. Ada", accreditation_number: "ACCRED-1", accreditation_expires_at: "2027-01-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { vet_id: $.data.id }
            - call: "POST /api/entry-requirements"
              payload: { destination_state_code: "KS", species_code: "CATTLE", test_type: "NONE", test_validity_days: 30, vaccination_required: false, permit_required: true, effective_from: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /api/certificates"
              payload: { origin_premises_id: "${prem_id}", destination_state_code: "KS", species_code: "CATTLE", head_count: 10, inspection_date: "2026-08-10T00:00:00Z" }
              as: AccreditedVet
              as_user_id: "${vet_id}"
              captures: { cert_id: $.data.id }
            - call: "POST /api/certificates/${cert_id}/submit"
              as: AccreditedVet
              as_user_id: "${vet_id}"
            - call: "POST /api/certificates/${cert_id}/issue"
              as: StateVetOfficer
          trigger:
            - call: "POST /api/movement-permits"
              payload: { certificate_id: "${cert_id}", allocated_head_count: 10, valid_from: "2026-08-11T00:00:00Z", valid_until: "2026-09-08T00:00:00Z" }
              as: AccreditedVet
              as_user_id: "${vet_id}"
              captures: { perm_id: $.data.id, pstatus: $.data.status, comm: $.data.committed_headroom, proj: $.data.projected_headroom, fees: $.data.total_movement_fees_cents }
          assert:
            - "MovementPermit.${perm_id}.status == 'REQUESTED' (initial state); permit_number == null until issue"
            - "MovementPermit.${perm_id}.committed_headroom == 10 (nothing consumed)"
            - "MovementPermit.${perm_id}.projected_headroom == 10"
            - "MovementPermit.${perm_id}.total_movement_fees_cents == 0"

      - name: premises_invalid_species_enum_rejected
        claim_type: type_constraints
        grounds:
          - entities.Premises.fields.species_code
          - validations[priority=3]
          - errors[ERR_VALIDATION]
        distinguishing_aspect: |
          species_code outside the declared enum (CATTLE | SWINE | POULTRY |
          SHEEP_GOAT | EQUINE) is rejected with ERR_VALIDATION before any
          persistence.
        test_recipe:
          setup:
            - "Empty DB"
          setup_api_calls: []
          trigger:
            - call: "POST /api/premises"
              payload: { name: "Ranch Bad", county: "Yolo", state_code: "CA", species_code: "LLAMA", initial_head_count: 5 }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == 'ERR_VALIDATION' with HTTP 400"
            - "No Premises row is persisted"

      - name: premises_missing_required_county_rejected
        claim_type: required_fields
        grounds:
          - entities.Premises.fields.county
          - validations[priority=3]
          - errors[ERR_VALIDATION]
        distinguishing_aspect: |
          county is a required input with no default; omitting it fails schema
          validation with ERR_VALIDATION.
        test_recipe:
          setup:
            - "Empty DB"
          setup_api_calls: []
          trigger:
            - call: "POST /api/premises"
              payload: { name: "Ranch NoCounty", state_code: "CA", species_code: "CATTLE", initial_head_count: 5 }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == 'ERR_VALIDATION' with HTTP 400 (missing required county)"

      - name: certificate_head_count_zero_rejected
        claim_type: type_constraints
        grounds:
          - entities.Certificate.fields.head_count
          - validations[priority=3]
          - errors[ERR_VALIDATION]
        distinguishing_aspect: |
          Certificate head_count carries constraint '> 0'; zero is rejected at
          schema validation (ERR_VALIDATION), before any inventory check.
        test_recipe:
          setup:
            - "Premises P; vet V; clock default 2026-08-01"
          setup_api_calls:
            - call: "POST /api/premises"
              payload: { name: "Ranch D9", county: "Yolo", state_code: "CA", species_code: "CATTLE", initial_head_count: 20 }
              as: ProgramAdmin
              captures: { prem_id: $.data.id }
            - call: "POST /api/veterinarians"
              payload: { full_name: "Dr. Ada", accreditation_number: "ACCRED-1", accreditation_expires_at: "2027-01-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { vet_id: $.data.id }
          trigger:
            - call: "POST /api/certificates"
              payload: { origin_premises_id: "${prem_id}", destination_state_code: "KS", species_code: "CATTLE", head_count: 0, inspection_date: "2026-08-01T00:00:00Z" }
              as: AccreditedVet
              as_user_id: "${vet_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == 'ERR_VALIDATION' with HTTP 400 (head_count must be > 0)"

      - name: certificate_future_inspection_date_rejected
        claim_type: type_constraints
        grounds:
          - entities.Certificate.fields.inspection_date
          - validations[priority=3]
          - errors[ERR_VALIDATION]
        distinguishing_aspect: |
          inspection_date later than the logical clock is a schema-level
          violation; with the clock at its startup default 2026-08-01, an
          inspection dated 2026-08-10 is rejected with ERR_VALIDATION.
        test_recipe:
          setup:
            - "Premises P; vet V; logical clock left at default 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /api/premises"
              payload: { name: "Ranch D10", county: "Yolo", state_code: "CA", species_code: "CATTLE", initial_head_count: 20 }
              as: ProgramAdmin
              captures: { prem_id: $.data.id }
            - call: "POST /api/veterinarians"
              payload: { full_name: "Dr. Ada", accreditation_number: "ACCRED-1", accreditation_expires_at: "2027-01-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { vet_id: $.data.id }
          trigger:
            - call: "POST /api/certificates"
              payload: { origin_premises_id: "${prem_id}", destination_state_code: "KS", species_code: "CATTLE", head_count: 5, inspection_date: "2026-08-10T00:00:00Z" }
              as: AccreditedVet
              as_user_id: "${vet_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == 'ERR_VALIDATION' with HTTP 400 (inspection_date after logical clock)"

      - name: inverted_window_fields_rejected
        claim_type: type_constraints
        grounds:
          - entities.QuarantineOrder.fields.end_at
          - entities.EntryRequirement.fields.effective_until
          - entities.MovementPermit.fields.valid_until
          - validations[priority=3]
          - errors[ERR_VALIDATION]
        distinguishing_aspect: |
          Three window constraints — quarantine end_at > start_at, requirement
          effective_until > effective_from, permit valid_until >= valid_from —
          are all schema-level; each inverted window returns ERR_VALIDATION
          before existence checks (bogus FK ids never get evaluated).
        test_recipe:
          setup:
            - "Vet V exists (for the permit call's role identity); no other rows needed"
          setup_api_calls:
            - call: "POST /api/veterinarians"
              payload: { full_name: "Dr. Ada", accreditation_number: "ACCRED-1", accreditation_expires_at: "2027-01-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { vet_id: $.data.id }
          trigger:
            - call: "POST /api/quarantine-orders"
              payload: { premises_id: "00000000-0000-0000-0000-0000000000aa", species_code: "CATTLE", disease_code: "BRUCELLOSIS", start_at: "2026-08-10T00:00:00Z", end_at: "2026-08-10T00:00:00Z", reason: "EQUAL_END" }
              as: StateVetOfficer
              as_user_id: "officer-a"
              captures: { err_q: $.data.error_id }
            - call: "POST /api/entry-requirements"
              payload: { destination_state_code: "KS", species_code: "CATTLE", test_type: "NONE", test_validity_days: 30, vaccination_required: false, permit_required: false, effective_from: "2026-08-01T00:00:00Z", effective_until: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { err_r: $.data.error_id }
            - call: "POST /api/movement-permits"
              payload: { certificate_id: "00000000-0000-0000-0000-0000000000bb", allocated_head_count: 5, valid_from: "2026-08-11T00:00:00Z", valid_until: "2026-08-10T00:00:00Z" }
              as: AccreditedVet
              as_user_id: "${vet_id}"
              captures: { err_p: $.data.error_id }
          assert:
            - "Quarantine create with end_at == start_at returns error_id == 'ERR_VALIDATION' (strictly-greater constraint)"
            - "EntryRequirement create with effective_until == effective_from returns error_id == 'ERR_VALIDATION'"
            - "MovementPermit create with valid_until < valid_from returns error_id == 'ERR_VALIDATION' (schema beats 404 on bogus certificate_id)"

      - name: body_fk_existence_enforced
        claim_type: parent_relationships
        grounds:
          - validations[priority=4]
          - entities.TestRecord.fields.premises_id
          - entities.Certificate.fields.origin_premises_id
          - entities.MovementPermit.fields.certificate_id
          - entities.MovementRecord.fields.permit_id
          - entities.QuarantineOrder.fields.premises_id
        distinguishing_aspect: |
          Flat topology: every body-supplied FK is existence-checked (priority
          4); each dangling reference returns the parent resource's domain 404.
        test_recipe:
          setup:
            - "Vet V exists (identity for AccreditedVet calls)"
          setup_api_calls:
            - call: "POST /api/veterinarians"
              payload: { full_name: "Dr. Ada", accreditation_number: "ACCRED-1", accreditation_expires_at: "2027-01-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { vet_id: $.data.id }
          trigger:
            - call: "POST /api/test-records"
              payload: { premises_id: "00000000-0000-0000-0000-0000000000aa", species_code: "CATTLE", test_type: "BRUCELLOSIS", test_date: "2026-07-12T00:00:00Z", lab_reference: "LAB-X" }
              as: LabTechnician
              captures: { err_t: $.data.error_id }
            - call: "POST /api/certificates"
              payload: { origin_premises_id: "00000000-0000-0000-0000-0000000000aa", destination_state_code: "KS", species_code: "CATTLE", head_count: 5, inspection_date: "2026-08-01T00:00:00Z" }
              as: AccreditedVet
              as_user_id: "${vet_id}"
              captures: { err_c: $.data.error_id }
            - call: "POST /api/movement-permits"
              payload: { certificate_id: "00000000-0000-0000-0000-0000000000bb", allocated_head_count: 5, valid_from: "2026-08-11T00:00:00Z", valid_until: "2026-09-08T00:00:00Z" }
              as: AccreditedVet
              as_user_id: "${vet_id}"
              captures: { err_p: $.data.error_id }
            - call: "POST /api/movement-records"
              payload: { permit_id: "00000000-0000-0000-0000-0000000000cc", head_count: 2, destination_name: "Nowhere", planned_ship_date: "2026-08-21T00:00:00Z" }
              as: AccreditedVet
              as_user_id: "${vet_id}"
              captures: { err_m: $.data.error_id }
            - call: "POST /api/quarantine-orders"
              payload: { premises_id: "00000000-0000-0000-0000-0000000000aa", species_code: "CATTLE", disease_code: "BRUCELLOSIS", start_at: "2026-08-01T00:00:00Z", end_at: "2026-08-15T00:00:00Z", reason: "DANGLING" }
              as: StateVetOfficer
              as_user_id: "officer-a"
              captures: { err_q: $.data.error_id }
          assert:
            - "TestRecord create with unknown premises_id returns error_id == 'ERR_PREMISES_NOT_FOUND' (404)"
            - "Certificate create with unknown origin_premises_id returns error_id == 'ERR_PREMISES_NOT_FOUND' (404)"
            - "MovementPermit create with unknown certificate_id returns error_id == 'ERR_CERTIFICATE_NOT_FOUND' (404)"
            - "MovementRecord create with unknown permit_id returns error_id == 'ERR_PERMIT_NOT_FOUND' (404)"
            - "QuarantineOrder create with unknown premises_id returns error_id == 'ERR_PREMISES_NOT_FOUND' (404)"

      - name: certificate_create_unknown_vet_identity_404
        claim_type: parent_relationships
        grounds:
          - validations[priority=4]
          - roles.AccreditedVet
          - errors[ERR_VETERINARIAN_NOT_FOUND]
        distinguishing_aspect: |
          The AccreditedVet role is entity_backed:Veterinarian; an X-User-ID
          matching no Veterinarian row fails certificate creation with
          ERR_VETERINARIAN_NOT_FOUND even when the premises exists.
        test_recipe:
          setup:
            - "Premises P exists"
          setup_api_calls:
            - call: "POST /api/premises"
              payload: { name: "Ranch D13", county: "Yolo", state_code: "CA", species_code: "CATTLE", initial_head_count: 20 }
              as: ProgramAdmin
              captures: { prem_id: $.data.id }
          trigger:
            - call: "POST /api/certificates"
              payload: { origin_premises_id: "${prem_id}", destination_state_code: "KS", species_code: "CATTLE", head_count: 5, inspection_date: "2026-08-01T00:00:00Z" }
              as: AccreditedVet
              as_user_id: "00000000-0000-0000-0000-0000000000dd"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == 'ERR_VETERINARIAN_NOT_FOUND' with HTTP 404 (acting vet identity does not resolve)"

      - name: not_found_direct_get_endpoints
        claim_type: not_found
        grounds:
          - errors[ERR_PREMISES_NOT_FOUND]
          - errors[ERR_CERTIFICATE_NOT_FOUND]
          - errors[ERR_PERMIT_NOT_FOUND]
        distinguishing_aspect: |
          The three direct GET-by-id endpoints each return their domain-specific
          404 error_id for a well-formed but unknown UUID.
        test_recipe:
          setup:
            - "Empty DB"
          setup_api_calls: []
          trigger:
            - call: "GET /api/premises/00000000-0000-0000-0000-000000000001"
              as: StateAuditor
              captures: { err_p: $.data.error_id }
            - call: "GET /api/certificates/00000000-0000-0000-0000-000000000002"
              as: StateAuditor
              captures: { err_c: $.data.error_id }
            - call: "GET /api/movement-permits/00000000-0000-0000-0000-000000000003"
              as: StateAuditor
              captures: { err_m: $.data.error_id }
          assert:
            - "GET unknown premises returns error_id == 'ERR_PREMISES_NOT_FOUND' (404)"
            - "GET unknown certificate returns error_id == 'ERR_CERTIFICATE_NOT_FOUND' (404)"
            - "GET unknown permit returns error_id == 'ERR_PERMIT_NOT_FOUND' (404)"

      - name: not_found_action_endpoints
        claim_type: not_found
        grounds:
          - validations[priority=4]
          - errors[ERR_VETERINARIAN_NOT_FOUND]
          - errors[ERR_TEST_RECORD_NOT_FOUND]
          - errors[ERR_MOVEMENT_RECORD_NOT_FOUND]
          - errors[ERR_OUTBREAK_ZONE_NOT_FOUND]
          - errors[ERR_QUARANTINE_ORDER_NOT_FOUND]
          - errors[ERR_TRANSMISSION_AUDIT_NOT_FOUND]
          - errors[ERR_ENTRY_REQUIREMENT_NOT_FOUND]
        distinguishing_aspect: |
          Action endpoints validate path ids left-to-right at priority 4 before
          any state or OCC check, so every action on an unknown id returns its
          domain 404 (including PATCH entry-requirements, which never reaches
          the version check).
        test_recipe:
          setup:
            - "Vet V and one real EntryRequirement row exist (to supply a bound OCC version)"
          setup_api_calls:
            - call: "POST /api/veterinarians"
              payload: { full_name: "Dr. Ada", accreditation_number: "ACCRED-1", accreditation_expires_at: "2027-01-01T00:00:00Z" }
