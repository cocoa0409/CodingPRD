            - call: "POST /forms-1099q"
              payload: { account_id: "${a_id}", tax_year: 2026 }
              as: SystemTaxAuthority
              captures: { form_id: $.data.id }
            - call: "POST /withdrawals"
              payload: { account_id: "${a_id}", amount_cents: 300000, expense_class: "K_12_TUITION" }
              as: AccountOwner
              as_user_id: "${d_id}"
              captures: { w_id: $.data.id }
            - call: "POST /withdrawals/${w_id}/submit"
