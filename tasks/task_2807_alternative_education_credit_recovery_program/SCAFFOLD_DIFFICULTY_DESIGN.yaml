  - rule_id: resource_temporal_overlap
    instances:
      - name: proctor_station_buffer_half_open_conflict
        resource_entity: ProctorStation
        interval_semantics: "half-open [start, end) comparison, with every occupied interval extended by turnaround_buffer_minutes (15) on the end side; capacity one session at a time"
        grounds:
          - validations[priority=14]
          - errors[ERR_STATION_CONFLICT]
          - entities.ProctorStation.fields.turnaround_buffer_minutes
          - entities.ProctorStation.fields.scheduled_session_count
          - endpoints[POST /proctor-sessions]
        distinguishing_aspect: |
          The station's 09:00-10:00 booking occupies [09:00, 10:15) once the 15-minute turnaround
          buffer is applied, so 10:10-11:00 is rejected while 10:15-11:00 is accepted on the exact
          buffer boundary. An implementation that ignores the buffer accepts 10:10, and one that uses
          closed-interval comparison rejects 10:15.
        test_recipe:
          setup:
            - "one home school and one center with seat_capacity 10, certified_teacher_fte 4.00, max_students_per_teacher 12"
            - "one ONLINE course BIO1 with proctoring_required true, proctored_exam_weight 0.40, total_modules 10"
            - "one COMPUTER proctor station LAB-1 at that center with turnaround_buffer_minutes 15"
            - "one grade-11 student on a COMPETENCY placement with one NEW_CREDIT BIO1 enrollment"
            - "one SCHEDULED ProctorSession on LAB-1 for 2026-08-05 09:00-10:00Z"
          setup_api_calls:
            - call: "POST /home-schools"
              payload: { name: "North High", district_code: "NHS-01", accountability_cohort_year: 2026 }
              as: DistrictAdmin
              captures: { hs_id: $.data.id }
