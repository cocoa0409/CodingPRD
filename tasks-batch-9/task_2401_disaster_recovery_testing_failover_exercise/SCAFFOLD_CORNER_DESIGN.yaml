          setup_api_calls:
            - *p01
            - *p02
            - *p03
            - *p04
            - *p05
            - *p06
            - *p07
            - *p08
            - *p09
            - *p10
            - *p11
            - *p12
            - *p13
            - call: "GET /recovery-groups/${g1_id}"
              payload: {}
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
              captures: { gv1: $.data.version }
          trigger:
            - call: "POST /runbooks"
              payload: { recovery_group_id: "${g1_id}", title: "OCC revision one", author_id: "${c1_id}", expected_recovery_group_version: "${gv1}" }
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
              captures: { rbOcc1_id: $.data.id }
            - call: "GET /recovery-groups/${g1_id}"
              payload: {}
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
              captures: { gv2: $.data.version }
            - call: "POST /runbooks"
              payload: { recovery_group_id: "${g1_id}", title: "OCC revision two, stale writer", author_id: "${c1_id}", expected_recovery_group_version: "${gv1}" }
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
              captures: { occ_error: $.data.error_id }
            - call: "POST /runbooks"
              payload: { recovery_group_id: "${g1_id}", title: "OCC revision two, fresh writer", author_id: "${c1_id}", expected_recovery_group_version: "${gv2}" }
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
              captures: { rbOcc2_id: $.data.id }
          assert:
            - "gv1 == 1 and gv2 == 2 — every accepted publish increments RecoveryGroup.version by 1"
            - "Runbook.${rbOcc1_id}.revision == 1 with status DRAFT, readiness_score 0.00, stale_reason NONE and validity_days 180 by default"
            - "the third call returns 412 with occ_error == ERR_STALE_RECOVERY_GROUP_VERSION"
            - "Runbook.${rbOcc2_id}.revision == 2 — the rejected attempt did not consume a revision number"
            - "RecoveryGroup.${g1_id}.version == 3 after the last publish and current_runbook_id is still null — a DRAFT revision does not become current"

      - name: scope_item_occ_rejects_a_stale_exercise_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.scope-item-add-stale-exercise
          - errors.ERR_STALE_EXERCISE_VERSION
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / stale_exercise_version_rejects_before_stale_runbook_readiness
          rationale: "That §1.8 instance sends ${ex_v} - 1 on the second scope item and asserts the 412 at priority 7 ahead of the readiness gate, plus the control call that proves the readiness rule is genuinely violated."

      - name: retier_chain_is_verified_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
          - state_machines.Application.AGREED_to_TIER_PROPOSED
        excluded_because:
          difficulty_instance: transitive_cascade / cascade_a_retier_invalidates_step_stales_runbook_restricts_group_reverts_schedule_releases_capacity
          rationale: "That §1.8 instance asserts all six hops of the chain in one response, including the ordering-sensitive capacity release at the end."

      - name: both_rto_variants_are_exercised
        claim_type: dual_variant_calculation
        grounds:
          - calculations.achieved_rto_minutes.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / rto_variant_wall_clock_vs_net_execution
          rationale: "That §1.8 instance runs both variants on identical timings and asserts the 46-minute delta between them."

      - name: projection_is_recomputed_from_scratch_on_every_membership_change
        claim_type: derived_field_reconciliation
        grounds:
          - calculations.projected_recovery_minutes_critical_path
          - entities.RecoveryGroup.fields.projected_recovery_minutes
          - endpoints.POST./recovery-groups/{id}/posture-refresh
        distinguishing_aspect: "The projection is a full recompute, not an incremental delta: adding an isolated 45-minute application leaves it at 80, wiring that application ahead of APP-CORE raises it to 125, and a posture-refresh that changes nothing leaves 125 exactly where it was."
        test_recipe:
          setup:
            - "The bootstrap through the dependency edge exists: RG-1 holds APP-CORE (60) and AST-DB1 (20) with a HARD APP-CORE -> AST-DB1 edge and projects 80."
            - "APP-EDGE is agreed at TIER_2 with rto 45 / rpo 60."
          setup_api_calls:
            - *p01
            - *p02
            - *p03
            - *p04
            - *p05
            - *p06
            - *p07
            - *p08
            - *p09
            - *p10
            - *p11
            - *p12
            - *p13
            - *p14
            - *p15
            - *p16
            - call: "POST /applications"
              payload: { name: "Edge portal", app_code: "APP-EDGE", business_owner_id: "${bo1_id}", primary_site_id: "${sp_id}", criticality_weight: 8 }
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
              captures: { aRe_id: $.data.id }
            - call: "POST /applications/${aRe_id}/tier-proposals"
              payload: { proposed_tier: "TIER_2", proposed_rto_minutes: 45, proposed_rpo_minutes: 60 }
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
            - call: "POST /applications/${aRe_id}/tier-decisions"
              payload: { action: "AGREE" }
              as: BusinessOwner
              as_user_id: "${bo1_id}"
          trigger:
            - call: "POST /applications/${aRe_id}/group-assignments"
              payload: { recovery_group_id: "${g1_id}" }
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
            - call: "POST /dependency-edges"
              payload: { from_node_kind: "APPLICATION", from_node_id: "${aRe_id}", to_node_kind: "APPLICATION", to_node_id: "${a1_id}", edge_kind: "HARD" }
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
              captures: { eRe_id: $.data.id }
            - call: "POST /recovery-groups/${g1_id}/posture-refresh"
              payload: {}
              as: AuditLiaison
              as_user_id: "${al1_id}"
              captures: { refreshed_projection: $.data.projected_recovery_minutes }
          assert:
            - "after the group assignment, RecoveryGroup.${g1_id}.projected_recovery_minutes == 80 with recovery_sequence == [${a1_id}, ${d1_id}] — the new node is isolated and its 45 loses to the 80 chain"
            - "after the HARD edge, RecoveryGroup.${g1_id}.projected_recovery_minutes == 125 — 45 + 60 + 20 — with recovery_sequence == [${aRe_id}, ${a1_id}, ${d1_id}]"
            - "refreshed_projection == 125 and recovery_sequence is unchanged — the refresh recomputes the same value rather than accumulating a second delta"
            - "RecoveryGroup.${g1_id}.posture == RESTRICTED with posture_reason == NO_VALIDATED_RUNBOOK throughout — the projection is independent of the posture"

  - section: consistency_model
    instances:
      - name: runbook_validation_makes_the_group_ready_in_the_same_request
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - state_machines.Runbook.IN_REVIEW_to_VALIDATED
          - calculations.recovery_group_posture_derivation
        distinguishing_aspect: "Consistency is immediate: the VALIDATE transition itself re-derives the group, so a read taken straight after it — with no posture-refresh call in between — already shows current_runbook_id, readiness 100.00, posture READY and the recomputed projection."
        test_recipe:
          setup:
            - "The bootstrap through the step validation exists: rb1 is IN_REVIEW with one VALIDATED weight-10 step, and RG-1 is RESTRICTED with current_runbook_id null."
          setup_api_calls:
            - *p01
            - *p02
            - *p03
            - *p04
            - *p05
            - *p06
            - *p07
            - *p08
            - *p09
            - *p10
            - *p11
            - *p12
            - *p13
            - *p14
            - *p15
            - *p16
            - *p17
            - *p18
            - *p19
            - *p20
            - *p21
          trigger:
            - call: "POST /runbooks/${rb1_id}/transitions"
              payload: { action: "VALIDATE" }
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
              captures: { validated_readiness: $.data.readiness_score }
            - call: "GET /recovery-groups/${g1_id}"
              payload: {}
              as: AuditLiaison
              as_user_id: "${al1_id}"
              captures: { immediate_posture: $.data.posture, immediate_runbook: $.data.current_runbook_id }
          assert:
            - "validated_readiness == 100.00 in the transition's own response body — no second read is needed to see it"
            - "immediate_posture == READY and immediate_runbook == ${rb1_id} on the very next read, with no posture-refresh call in between"
            - "RecoveryGroup.${g1_id}.posture_reason == READY_ALL_CHECKS_PASSED and projected_recovery_minutes == 80"
            - "Runbook.${rb1_id}.status == VALIDATED with validated_at == 2026-08-01T00:00:00Z and stale_reason == NONE"
