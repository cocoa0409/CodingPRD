  # =======================================================================
  # CALCULATIONS
  # =======================================================================
  - section: calculations
    instances:

      - name: tuning_cycle_interval_clamps_at_the_thirty_day_floor
        claim_type: Constants Applied
        grounds:
          - calculations.tuning_cycle_interval
          - entities.TuningRecall.fields.interval_days
          - entities.Instrument.fields.tuning_cycle_interval_days
        distinguishing_aspect: "A PERFORMANCE CONCERT_GRAND at an uncontrolled location computes floor(45 * 0.75) - 21 = 12, which the MIN_CYCLE_INTERVAL_DAYS floor raises to 30."
        test_recipe:
          setup: ["One client with an uncontrolled ZONE_A location and one PERFORMANCE-tier CONCERT_GRAND."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { display_name: "Concert Trust", email: "concert@example.com", phone: "555-0320", home_zone_code: "ZONE_A" }
              as: ShopManager
              captures: { cl_id: "$.data.id" }
            - call: "POST /locations"
              payload: { client_id: "${cl_id}", label: "Stage", zone_code: "ZONE_A", address_key: "stage-a", distance_miles_from_shop: 3.0, climate_controlled: false }
              as: ShopManager
              captures: { loc_id: "$.data.id" }
            - call: "POST /instruments"
              payload: { client_id: "${cl_id}", current_location_id: "${loc_id}", make: "Steinway", model: "D", serial_number: "SN-C20-0001", instrument_class: "CONCERT_GRAND", usage_tier: "PERFORMANCE" }
              as: ShopManager
              captures: { inst_id: "$.data.id" }
          trigger:
            - call: "POST /tuning-recalls"
              payload: { instrument_id: "${inst_id}", cycle_start_date: "2026-01-15" }
              as: ShopManager
              captures: { tr_id: "$.data.id" }
          assert:
            - "TuningRecall.${tr_id}.interval_days == 30"
            - "TuningRecall.${tr_id}.due_date == 2026-02-14"
            - "Instrument.${inst_id}.tuning_cycle_interval_days == 30"
            - "TuningRecall.${tr_id}.status == PENDING and overdue_tier == ON_TIME"

      - name: pitch_tier_overdue_bump_raises_the_effective_tier
        claim_type: Variant Selection
        grounds:
          - calculations.pitch_tier_classification
          - calculations.recall_overdue_tier
          - entities.Instrument.fields.raw_pitch_tier
          - entities.Instrument.fields.pitch_raise_tier
          - endpoints[POST /_ops/daily-sweep]
        distinguishing_aspect: "With a governing recall at OVERDUE_T2 the OVERDUE_BUMPED variant applies: a measured 10.0 cents lands raw_pitch_tier TIER_1 but pitch_raise_tier TIER_2, changing the service composition from the same measurement."
        test_recipe:
          setup:
            - "One HOME UPRIGHT at an uncontrolled ZONE_A location with a recall whose cycle_start_date is 2026-01-15 and interval 136 days, so due_date is 2026-05-31."
            - "The clock has been advanced to 2026-07-05 and the daily sweep has run, putting the recall 35 days overdue at OVERDUE_T2."
          setup_api_calls:
            - call: "POST /clients"
              payload: { display_name: "Overdue Client", email: "od@example.com", phone: "555-0321", home_zone_code: "ZONE_A" }
