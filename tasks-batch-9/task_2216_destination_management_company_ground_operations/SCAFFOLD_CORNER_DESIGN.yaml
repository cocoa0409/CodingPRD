              payload: { program_id: "${prog_id}", supplier_id: "${sup_id}", contract_value_cents: 300000, required_liability_limit_cents: 100000000, deposit_pct: 0, cancellation_tier: "STANDARD" }
              as: SupplierManager
              captures: { ctr_id: $.data.id }
            - call: "POST /dmc/supplier-contracts/${ctr_id}/send"
              payload: {}
              as: SupplierManager
              as_user_id: "sm-sender-1"
              captures: { ctr_v_sent: $.data.version }
          trigger:
            - call: "POST /dmc/settlement-payments"
              payload: { program_id: "${prog_id}", supplier_id: "${sup_id}", contract_id: "${ctr_id}", expected_contract_version: "${ctr_v_sent}" }
              as: Controller
              captures: { e_sent: $.data.error_id }
            - call: "POST /dmc/supplier-contracts/${ctr_id}/countersign"
              payload: {}
              as: SupplierManager
              as_user_id: "sm-signer-2"
              captures: { ctr_v_active: $.data.version }
            - call: "POST /dmc/settlement-payments"
              payload: { program_id: "${prog_id}", supplier_id: "${sup_id}", contract_id: "${ctr_id}", expected_contract_version: "${ctr_v_active}" }
              as: Controller
              captures: { pay1: $.data.id }
            - call: "POST /dmc/settlement-payments/${pay1}/void"
              payload: { void_reason: "Opened against the wrong cost centre." }
              as: Controller
            - call: "POST /dmc/settlement-payments/${pay1}/void"
              payload: { void_reason: "Duplicate void attempt." }
              as: Controller
              captures: { e_void: $.data.error_id }
            - call: "GET /dmc/supplier-contracts/${ctr_id}"
              payload: {}
              as: Controller
              captures: { ctr_v_now: $.data.version }
            - call: "POST /dmc/settlement-payments"
              payload: { program_id: "${prog_id}", supplier_id: "${sup_id}", contract_id: "${ctr_id}", expected_contract_version: "${ctr_v_now}" }
              as: Controller
              captures: { pay2: $.data.id }
            - call: "POST /dmc/supplier-contracts/${ctr_id}/terminate"
              payload: { termination_note: "Coach company lost its operating licence." }
              as: SupplierManager
            - call: "POST /dmc/settlement-payments/${pay2}/approve"
              payload: {}
              as: Controller
              captures: { e_terminated: $.data.error_id }
          assert:
            - "the first trigger call returns HTTP 409 and ${e_sent} == ERR_CONTRACT_NOT_ACTIVE"
            - "${e_sent} != ERR_VERSION_CONFLICT"
            - "GET /dmc/settlement-payments?program_id=${prog_id}&limit=10&offset=0 returns total_count == 0 immediately after the first trigger call"
            - "the third trigger call returns HTTP 201 and SettlementPayment.${pay1}.status == PENDING"
            - "SettlementPayment.${pay1}.gross_cents == 0 and SettlementPayment.${pay1}.deposit_applied_cents == 0 and SettlementPayment.${pay1}.net_payable_cents == 0"
            - "the fourth trigger call returns HTTP 200 and SettlementPayment.${pay1}.status == VOID"
            - "the fifth trigger call returns HTTP 409 and ${e_void} == ERR_SETTLEMENT_ALREADY_PAID"
            - "the ninth trigger call returns HTTP 409 and ${e_terminated} == ERR_CONTRACT_NOT_ACTIVE"
            - "SupplierContract.${ctr_id}.status == TERMINATED"
            - "SettlementPayment.${pay2}.status == PENDING"
            - "Program.${prog_id}.supplier_settled_cents == 0"

  # ===========================================================================
  - section: rbac
    instances:

      - name: operations_coordinator_cannot_create_a_program
        claim_type: cannot_perform
        grounds: [roles.OperationsCoordinator, roles.ProgramDirector, "errors[ERR_ROLE_NOT_PERMITTED]"]
        distinguishing_aspect: "Program creation is exclusive to ProgramDirector: the same payload returns HTTP 403 ERR_ROLE_NOT_PERMITTED for OperationsCoordinator and HTTP 201 for ProgramDirector, and no Program is stored by the rejected attempt."
        test_recipe:
          setup: ["Empty database; logical clock 2026-08-01T00:00:00Z."]
          setup_api_calls: []
          trigger:
            - call: "POST /dmc/programs"
              payload: { client_name: "Role Test Client", group_name: "Role Test Group", arrival_date: "2026-09-10", departure_date: "2026-09-14", guaranteed_count: 20, markup_pct: 0.18 }
              as: OperationsCoordinator
              captures: { err: $.data.error_id }
            - call: "POST /dmc/programs"
              payload: { client_name: "Role Test Client", group_name: "Role Test Group", arrival_date: "2026-09-10", departure_date: "2026-09-14", guaranteed_count: 20, markup_pct: 0.18 }
              as: ProgramDirector
              captures: { prog_id: $.data.id }
          assert:
            - "the first trigger call returns HTTP 403 and ${err} == ERR_ROLE_NOT_PERMITTED"
            - "the second trigger call returns HTTP 201"
            - "GET /dmc/programs?limit=10&offset=0 returns total_count == 1 with the single program ${prog_id}"

      - name: permit_officer_cannot_approve_a_settlement
        claim_type: cannot_perform
        grounds: [roles.PermitOfficer, roles.Controller, "errors[ERR_ROLE_NOT_PERMITTED]"]
        distinguishing_aspect: "Money movement is exclusive to Controller: PermitOfficer, who may drive permits end to end, is refused HTTP 403 ERR_ROLE_NOT_PERMITTED on settlement creation even though the role check fires before any 404 on the referenced ids."
        test_recipe:
          setup: ["Logical clock 2026-08-01T00:00:00Z; one DRAFT Program and one APPROVED Supplier and one DRAFT SupplierContract exist."]
          setup_api_calls:
            - call: "POST /dmc/suppliers"
              payload: { legal_name: "Role Boundary Supplier", supplier_type: "ACTIVITY", insurance_expires_on: "2027-01-31", insurance_liability_limit_cents: 500000000, coi_verified: true, status: "APPROVED" }
              as: SupplierManager
              captures: { sup_id: $.data.id }
            - call: "POST /dmc/programs"
              payload: { client_name: "Role Boundary Client", group_name: "Role Boundary Group", arrival_date: "2026-09-10", departure_date: "2026-09-14", guaranteed_count: 20, markup_pct: 0.18 }
              as: ProgramDirector
              captures: { prog_id: $.data.id }
            - call: "POST /dmc/supplier-contracts"
              payload: { program_id: "${prog_id}", supplier_id: "${sup_id}", contract_value_cents: 100000, required_liability_limit_cents: 100000000, deposit_pct: 0.3, cancellation_tier: "STANDARD" }
              as: SupplierManager
              captures: { ctr_id: $.data.id, ctr_v: $.data.version }
          trigger:
            - call: "POST /dmc/settlement-payments"
              payload: { program_id: "${prog_id}", supplier_id: "${sup_id}", contract_id: "${ctr_id}", expected_contract_version: "${ctr_v}" }
              as: PermitOfficer
              captures: { err: $.data.error_id }
          assert:
            - "trigger returns HTTP 403"
            - "${err} == ERR_ROLE_NOT_PERMITTED"
            - "GET /dmc/settlement-payments?program_id=${prog_id}&limit=10&offset=0 returns total_count == 0"

      - name: supplier_cannot_counter_another_suppliers_contract
        claim_type: cannot_perform
        grounds: [roles.Supplier, "errors[ERR_NOT_RESOURCE_OWNER]"]
        distinguishing_aspect: "The Supplier role is entity-backed, so authorization is per-record: supplier two acting on supplier one's SENT contract is refused HTTP 403 ERR_NOT_RESOURCE_OWNER (not 403 ERR_ROLE_NOT_PERMITTED), and supplier one's own counter then succeeds."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; two APPROVED Suppliers; one DRAFT Program."
            - "One SupplierContract for supplier one (contract_value_cents 300000), already SENT by sm-sender-1."
          setup_api_calls:
            - call: "POST /dmc/suppliers"
              payload: { legal_name: "Owner Supplier", supplier_type: "ACTIVITY", insurance_expires_on: "2027-01-31", insurance_liability_limit_cents: 500000000, coi_verified: true, status: "APPROVED" }
              as: SupplierManager
              captures: { s1: $.data.id }
            - call: "POST /dmc/suppliers"
              payload: { legal_name: "Intruder Supplier", supplier_type: "ACTIVITY", insurance_expires_on: "2027-01-31", insurance_liability_limit_cents: 500000000, coi_verified: true, status: "APPROVED" }
              as: SupplierManager
              captures: { s2: $.data.id }
            - call: "POST /dmc/programs"
              payload: { client_name: "Ownership Client", group_name: "Ownership Group", arrival_date: "2026-09-10", departure_date: "2026-09-14", guaranteed_count: 20, markup_pct: 0.18 }
              as: ProgramDirector
              captures: { prog_id: $.data.id }
            - call: "POST /dmc/supplier-contracts"
              payload: { program_id: "${prog_id}", supplier_id: "${s1}", contract_value_cents: 300000, required_liability_limit_cents: 100000000, deposit_pct: 0.3, cancellation_tier: "STANDARD" }
              as: SupplierManager
              captures: { ctr_id: $.data.id }
            - call: "POST /dmc/supplier-contracts/${ctr_id}/send"
              payload: {}
              as: SupplierManager
              as_user_id: "sm-sender-1"
          trigger:
            - call: "POST /dmc/supplier-contracts/${ctr_id}/counter"
              payload: { countered_value_cents: 260000 }
              as: Supplier
              as_user_id: "${s2}"
              captures: { err: $.data.error_id }
            - call: "POST /dmc/supplier-contracts/${ctr_id}/counter"
              payload: { countered_value_cents: 330000 }
              as: Supplier
              as_user_id: "${s1}"
          assert:
            - "the first trigger call returns HTTP 403 and ${err} == ERR_NOT_RESOURCE_OWNER"
            - "${err} != ERR_ROLE_NOT_PERMITTED"
            - "SupplierContract.${ctr_id}.status == SENT after the first trigger call"
            - "the second trigger call returns HTTP 200 with SupplierContract.${ctr_id}.status == COUNTERED"
            - "SupplierContract.${ctr_id}.contract_value_cents == 330000"
            - "SupplierContract.${ctr_id}.round_count == 1"

      - name: request_missing_x_user_role_header_is_unauthenticated
        claim_type: cannot_perform
        grounds: ["errors[ERR_UNAUTHENTICATED]", roles.ProgramDirector]
        distinguishing_aspect: "Authentication precedes authorization: a program create with no X-User-Role header at all returns HTTP 401 ERR_UNAUTHENTICATED rather than 403 ERR_ROLE_NOT_PERMITTED, and stores nothing."
        test_recipe:
          setup: ["Empty database; logical clock 2026-08-01T00:00:00Z."]
          setup_api_calls: []
          trigger:
            - call: "POST /dmc/programs"
              payload: { client_name: "Anonymous Client", group_name: "Anonymous Group", arrival_date: "2026-09-10", departure_date: "2026-09-14", guaranteed_count: 20, markup_pct: 0.18 }
              as: none
              captures: { err: $.data.error_id }
          assert:
            - "the request is sent with neither X-User-ID nor X-User-Role"
            - "trigger returns HTTP 401"
            - "${err} == ERR_UNAUTHENTICATED"
            - "${err} != ERR_ROLE_NOT_PERMITTED"
            - "GET /dmc/programs?limit=10&offset=0 (sent as ProgramDirector) returns total_count == 0"

      - name: controller_and_program_director_share_the_cost_summary_read
        claim_type: can_perform
        grounds: [roles.Controller, roles.ProgramDirector, "endpoints[GET /dmc/programs/{program_id}/cost-summary]"]
        distinguishing_aspect: "cost-summary is a shared read for exactly ProgramDirector and Controller: both receive HTTP 200 with byte-identical money fields, while OperationsCoordinator is refused HTTP 403 ERR_ROLE_NOT_PERMITTED on the same URL."
        test_recipe:
          setup: ["Logical clock 2026-08-01T00:00:00Z; one DRAFT Program with all money fields still at 0."]
          setup_api_calls:
            - call: "POST /dmc/programs"
              payload: { client_name: "Shared Read Client", group_name: "Shared Read Group", arrival_date: "2026-09-10", departure_date: "2026-09-14", guaranteed_count: 20, markup_pct: 0.18 }
              as: ProgramDirector
              captures: { prog_id: $.data.id }
          trigger:
            - call: "GET /dmc/programs/${prog_id}/cost-summary"
              payload: {}
              as: ProgramDirector
            - call: "GET /dmc/programs/${prog_id}/cost-summary"
              payload: {}
              as: Controller
              as_user_id: "ctrl-1"
            - call: "GET /dmc/programs/${prog_id}/cost-summary"
              payload: {}
              as: OperationsCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "the first and second trigger calls both return HTTP 200 with data.program_id == ${prog_id}"
            - "both successful responses report final_subtotal_cents == 0, disclosed_markup_cents == 0, management_fee_cents == 0 and final_client_total_cents == 0"
            - "the third trigger call returns HTTP 403 and ${err} == ERR_ROLE_NOT_PERMITTED"

      - name: countersign_by_the_sending_user_is_segregation_of_duties
        claim_type: segregation_of_duties
        grounds: ["errors[ERR_SEGREGATION_OF_DUTIES]", entities.SupplierContract.fields.sent_by_user_id]
        distinguishing_aspect: "Both users hold SupplierManager, so the block is identity-based: sm-sender-1 countersigning its own SENT contract returns HTTP 403 ERR_SEGREGATION_OF_DUTIES, and sm-signer-2 then activates it, stamping deposit_paid_cents 90000."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; one APPROVED Supplier with insurance_liability_limit_cents 500000000."
            - "One DRAFT Program; one SupplierContract (contract_value_cents 300000, deposit_pct 0.3) sent by user sm-sender-1."
          setup_api_calls:
            - call: "POST /dmc/suppliers"
              payload: { legal_name: "SoD Contract Supplier", supplier_type: "ACTIVITY", insurance_expires_on: "2027-01-31", insurance_liability_limit_cents: 500000000, coi_verified: true, status: "APPROVED" }
              as: SupplierManager
              captures: { sup_id: $.data.id }
            - call: "POST /dmc/programs"
              payload: { client_name: "SoD Contract Client", group_name: "SoD Contract Group", arrival_date: "2026-09-10", departure_date: "2026-09-14", guaranteed_count: 20, markup_pct: 0.18 }
              as: ProgramDirector
              captures: { prog_id: $.data.id }
            - call: "POST /dmc/supplier-contracts"
              payload: { program_id: "${prog_id}", supplier_id: "${sup_id}", contract_value_cents: 300000, required_liability_limit_cents: 100000000, deposit_pct: 0.3, cancellation_tier: "STANDARD" }
              as: SupplierManager
              captures: { ctr_id: $.data.id }
            - call: "POST /dmc/supplier-contracts/${ctr_id}/send"
              payload: {}
              as: SupplierManager
              as_user_id: "sm-sender-1"
          trigger:
            - call: "POST /dmc/supplier-contracts/${ctr_id}/countersign"
              payload: {}
              as: SupplierManager
              as_user_id: "sm-sender-1"
              captures: { err: $.data.error_id }
            - call: "POST /dmc/supplier-contracts/${ctr_id}/countersign"
              payload: {}
              as: SupplierManager
              as_user_id: "sm-signer-2"
          assert:
            - "the first trigger call returns HTTP 403 and ${err} == ERR_SEGREGATION_OF_DUTIES"
            - "SupplierContract.${ctr_id}.status == SENT after the first trigger call"
            - "the second trigger call returns HTTP 200 with SupplierContract.${ctr_id}.status == ACTIVE"
            - "SupplierContract.${ctr_id}.deposit_due_cents == 90000 and SupplierContract.${ctr_id}.deposit_paid_cents == 90000"

  # ===========================================================================
  - section: complexity_layers
    instances:

      - name: element_create_with_stale_program_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[element-create-stale-program]", "errors[ERR_STALE_PROGRAM_VERSION]"]
        distinguishing_aspect: "The version captured at program creation goes stale the moment the first element is added: reusing it returns HTTP 412 ERR_STALE_PROGRAM_VERSION, the rejected create leaves element_count at 1, and the same request retried with the re-read version returns 201."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; one Venue (turnover_buffer_minutes 90); one APPROVED Supplier."
            - "Program 2026-09-10..2026-09-14 whose version is captured at creation as prog_v1."
            - "One element E1 2026-09-11T09:00Z..11:00Z created with expected_program_version prog_v1, which bumps the program version."
          setup_api_calls:
            - call: "POST /dmc/venues"
              payload: { name: "OCC Venue", capacity_seated: 100, capacity_reception: 200, turnover_buffer_minutes: 90, requires_special_venue_permit: false, status: "ACTIVE" }
              as: ProgramDirector
              captures: { venue_id: $.data.id }
            - call: "POST /dmc/suppliers"
              payload: { legal_name: "OCC Supplier", supplier_type: "ACTIVITY", insurance_expires_on: "2027-01-31", insurance_liability_limit_cents: 500000000, coi_verified: true, status: "APPROVED" }
              as: SupplierManager
              captures: { sup_id: $.data.id }
            - call: "POST /dmc/programs"
              payload: { client_name: "OCC Client", group_name: "OCC Group", arrival_date: "2026-09-10", departure_date: "2026-09-14", guaranteed_count: 40, markup_pct: 0.18 }
              as: ProgramDirector
              captures: { prog_id: $.data.id, prog_v1: $.data.version }
            - call: "POST /dmc/program-elements"
              payload: { program_id: "${prog_id}", supplier_id: "${sup_id}", venue_id: "${venue_id}", element_type: "ACTIVITY", title: "OCC E1", starts_at: "2026-09-11T09:00:00Z", ends_at: "2026-09-11T11:00:00Z", planned_headcount: 20, guaranteed_headcount: 20, per_person_cost_cents: 4000, expected_program_version: "${prog_v1}" }
              as: ProgramDirector
              captures: { el1: $.data.id }
          trigger:
            - call: "POST /dmc/program-elements"
              payload: { program_id: "${prog_id}", supplier_id: "${sup_id}", venue_id: "${venue_id}", element_type: "ACTIVITY", title: "OCC E2 stale", starts_at: "2026-09-11T12:30:00Z", ends_at: "2026-09-11T14:30:00Z", planned_headcount: 20, guaranteed_headcount: 20, per_person_cost_cents: 4000, expected_program_version: "${prog_v1}" }
              as: ProgramDirector
              captures: { err: $.data.error_id }
            - call: "GET /dmc/programs/${prog_id}"
              payload: {}
              as: ProgramDirector
              captures: { prog_v2: $.data.version }
            - call: "POST /dmc/program-elements"
              payload: { program_id: "${prog_id}", supplier_id: "${sup_id}", venue_id: "${venue_id}", element_type: "ACTIVITY", title: "OCC E2 retried", starts_at: "2026-09-11T12:30:00Z", ends_at: "2026-09-11T14:30:00Z", planned_headcount: 20, guaranteed_headcount: 20, per_person_cost_cents: 4000, expected_program_version: "${prog_v2}" }
              as: ProgramDirector
              captures: { el2: $.data.id }
          assert:
            - "the first trigger call returns HTTP 412 and ${err} == ERR_STALE_PROGRAM_VERSION"
            - "Program.${prog_id}.element_count == 1 after the first trigger call"
            - "the rejected call does not change Program.${prog_id}.version, so ${prog_v2} == ${prog_v1} + 1"
            - "the third trigger call returns HTTP 201"
            - "Program.${prog_id}.element_count == 2 and Program.${prog_id}.open_element_count == 2"
            - "Program.${prog_id}.version == ${prog_v1} + 2"

      - name: settlement_create_with_stale_contract_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[settlement-create-stale-contract]", "errors[ERR_STALE_CONTRACT_VERSION]"]
        distinguishing_aspect: "The second §1.2.1 rule guards a different parent: the contract version read at send is stale after countersignature, so settlement creation returns HTTP 412 ERR_STALE_CONTRACT_VERSION and only the retry with the post-countersign version creates the payment."
