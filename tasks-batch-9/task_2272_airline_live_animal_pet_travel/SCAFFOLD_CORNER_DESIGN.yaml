      - name: international_itinerary_halves_the_disclosure_deadline_hours
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.regulator_disclosure_deadline
          - calculations.incident_severity_score
          - calculations.connection_welfare_window
        distinguishing_aspect: "Two thresholds fire in the same request: the welfare gap of 4 missed checks is clipped by WELFARE_GAP_CAP to 12, pushing the INJURY score to 62 and past DISCLOSURE_SCORE_THRESHOLD 60, and because the itinerary crosses from HK to US the INJURY window is halved from 168 to 84 hours."
        test_recipe:
          setup:
            - "The logical clock is at 2026-08-02T00:00:00Z"
            - "AN101 HKG (HK) -> LAX (US) arriving 2026-09-10T15:00Z and AN205 LAX -> JFK departing 2026-09-11T03:00Z, exactly 720 minutes later"
