  - rule_id: cross_entity_state_dependency
    instances:
      - name: preclearance_blocked_by_lapsed_attestation
        grounds:
          - state_machines.PersonalTrade.PRECLEARANCE_REQUESTED_to_APPROVED
          - state_machines.Employee
          - validations[priority=12]
        distinguishing_aspect: |
          Entity pair PersonalTrade -> Employee: the trade's APPROVED transition is
          gated by the EMPLOYEE's attestation dimension (LAPSED blocks), a
          cross-entity state dependency distinct from the sibling's Snapshot -> Order
          pair.
        test_recipe:
          setup:
            - "Employee EMP-901 LAPSED (attestation_due_at 2026-07-01 vs default clock 2026-08-01); fresh trade PRECLEARANCE_REQUESTED"
          setup_api_calls:
            - { call: "POST /surveillance/employees", payload: { full_name: "Uma Gate", employee_ref: "EMP-901", department: "TRADING", attestation_due_at: "2026-07-01T00:00:00Z" }, as: ComplianceAdmin, captures: { e_id: "$.data.id" } }
            - { call: "POST /surveillance/personal-trades", payload: { symbol: "ACME", side: "BUY", quantity: 10 }, as: CoveredEmployee, as_user_id: "${e_id}", captures: { t_id: "$.data.id" } }
          trigger:
            - { call: "POST /surveillance/personal-trades/${t_id}/transition", payload: { to_status: "APPROVED" }, as: ComplianceAdmin, captures: { err: "$.data.error_id" } }
            - { call: "POST /surveillance/employees/${e_id}/attest", payload: {}, as: CoveredEmployee, as_user_id: "${e_id}" }
            - { call: "POST /surveillance/personal-trades/${t_id}/transition", payload: { to_status: "APPROVED" }, as: ComplianceAdmin, captures: { t_status: "$.data.status", t_exp: "$.data.expires_at" } }
          assert:
            - "While employee LAPSED: ${err} == ERR_ATTESTATION_LAPSED and trade stays PRECLEARANCE_REQUESTED"
            - "After self-attestation (LAPSED->CURRENT): ${t_status} == APPROVED and expires_at == decided_at + 48h (attestation_due_at refreshed to ~2027-08-01)"

      - name: snapshot_lock_blocked_by_unresolved_orders
        grounds:
          - state_machines.ExecutionQualitySnapshot.PROVISIONAL_to_LOCKED
          - validations[priority=30]
          - calculations.calc_execution_quality
        distinguishing_aspect: |
          Entity pair ExecutionQualitySnapshot -> Order: the snapshot's LOCK
          transition depends on the states of OTHER entities (no in-scope
          RECEIVED/ROUTED orders may exist); different pair than the sibling
          (PersonalTrade -> Employee).
        test_recipe:
          setup:
            - "Venue NYSE + ACTIVE arrangement; order O1 ROUTED (unresolved); PROVISIONAL snapshot for (NYSE, MARKET, 2026-08)"
          setup_api_calls:
