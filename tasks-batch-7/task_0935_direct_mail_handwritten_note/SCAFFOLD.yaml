    side_effects:
      - "moves the ReprintRequest to FULFILLED"
      - "moves the ListRecord RETURNED -> QUEUED and increments its reprint_count by 1"
      - "increments ReprintRequest.version by 1"

  - method: POST
    path: "/mail/reprint-requests/{reprint_request_id}/deny"
    description: "Deny a reprint; the record stays RETURNED and its allowance is untouched."
    roles: [PlatformAdmin, ProductionOperator]
    code: 200
    input: ["deny_reason"]
    output: ReprintRequest
    side_effects: ["moves the ReprintRequest to DENIED", "increments ReprintRequest.version by 1"]

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog (43 codes; every code is produced by at least one
# §1.4 rung — the rung number is named in each condition)
# ---------------------------------------------------------------------------
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "rungs 1-2: X-User-Role absent or not one of the six declared roles, or X-User-ID absent while acting as AccountOwner"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "rung 3: the acting role is not listed in the endpoint's §1.5 roles"
  - id: ERR_ACCOUNT_SCOPE_VIOLATION
    http: 403
    condition: "rung 5: an AccountOwner acts on a resource owned by a different Account"
  - id: ERR_ACCOUNT_NOT_FOUND
    http: 404
    condition: "rung 4: an account_id in the path or body names no Account"
  - id: ERR_CAMPAIGN_NOT_FOUND
    http: 404
    condition: "rung 4: a campaign_id in the path or body names no Campaign"
  - id: ERR_MAIL_JOB_NOT_FOUND
    http: 404
    condition: "rung 4: a mail_job_id in the path or body names no MailJob"
  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "rung 4: any other referenced resource is absent — MailingList, ListRecord, Template, HandwritingStyle, Proof, ProductionRun, WritingMachine, InkLot, EddmRouteSelection, DripSchedule, DripStep, ReturnEvent, ReprintRequest, PostageLedgerEntry, BlackoutDate"
  - id: ERR_VALIDATION
    http: 400
    condition: "rung 6: a required body field is missing, of the wrong JSON type, or a date/datetime string does not parse as ISO 8601"
  - id: ERR_INVALID_ENUM
    http: 422
    condition: "rung 7: an enum-valued field named in rung 7's closed list carries a value outside its declared set"
  - id: ERR_VALUE_OUT_OF_RANGE
    http: 422
    condition: "rung 8: a numeric field falls outside its declared range"
  - id: ERR_CAMPAIGN_COMPLIANCE_HOLD
    http: 409
    condition: "rung 9: the campaign this request resolves to has compliance_status == HOLD; the only exempt endpoint is POST /mail/campaigns/{campaign_id}/compliance-releases"
  - id: ERR_CAMPAIGN_BILLING_CLOSED
    http: 409
    condition: "rung 10: the campaign this request resolves to has billing_status == CLOSED; no write endpoint is exempt"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "rung 11: an expected_*_version input does not match the parent entity's current version (all four §1.2.1 rules)"
  - id: ERR_LIST_LOCKED
    http: 409
    condition: "rung 12: the target MailingList is LOCKED"
  - id: ERR_EDDM_NOT_APPLICABLE
    http: 422
    condition: "rung 13: a recipient-level operation (return, NCOA move, reprint) is attempted through a job whose job_kind == EDDM"
  - id: ERR_JOB_KIND_MISMATCH
    http: 422
    condition: "rung 14: job_kind disagrees with mailing_list_id, mail_class or eddm_rate_variant, or an EDDM route is added to an ADDRESSED job"
  - id: ERR_CAMPAIGN_INVALID_STATE
    http: 409
    condition: "rung 15: the campaign's lifecycle or compliance axis forbids this operation"
  - id: ERR_LIST_INVALID_STATE
    http: 409
    condition: "rung 16: the mailing list's import_status forbids this operation"
  - id: ERR_MAIL_JOB_INVALID_STATE
    http: 409
    condition: "rung 17: the mail job's status forbids this operation"
  - id: ERR_PROOF_INVALID_STATE
    http: 409
    condition: "rung 18: the proof's status forbids this operation"
  - id: ERR_RUN_INVALID_STATE
    http: 409
    condition: "rung 19: the production run's status forbids this operation"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "rung 20: a DripStep, DripSchedule or ReprintRequest is in a status that forbids this operation"
  - id: ERR_INK_LOT_UNAVAILABLE
    http: 409
    condition: "rung 21: the ink lot is QUARANTINED or DEPLETED at reservation, or not OPEN at start"
  - id: ERR_MACHINE_OFFLINE
    http: 409
    condition: "rung 22: the writing machine's status is OFFLINE"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "rung 23: the approver's X-User-ID equals Proof.submitted_by_user_id"
  - id: ERR_PROOF_NOT_APPROVED
    http: 409
    condition: "rung 24: the mail job has no Proof that ever reached APPROVED"
  - id: ERR_PROOF_APPROVAL_STALE
    http: 409
    condition: "rung 25: an approval exists but is SUPERSEDED, EXPIRED, or pinned to a template version that no longer matches Template.version_no"
  - id: ERR_DUPLICATE_KEY
    http: 409
    condition: "rung 26: a scoped-unique value collides — permit_number, machine_code, lot_code, blackout_date, route_code per job, or sequence_no per schedule"
  - id: ERR_IN_HOME_DATE_PAST
    http: 422
    condition: "rung 27: the supplied anchor / target in-home date is strictly before the logical clock's current date"
  - id: ERR_BLACKOUT_UNRESOLVABLE
    http: 422
    condition: "rung 28: the backwards blackout walk would exceed BLACKOUT_SHIFT_MAX_DAYS (5) calendar days"
  - id: ERR_MAIL_DATE_UNREACHABLE
    http: 422
    condition: "rung 29: the DERIVED mail date is earlier than current_date + PRODUCTION_LEAD_DAYS (3) even though the requested date itself was not in the past"
  - id: ERR_DRIP_GAP_TOO_SMALL
    http: 422
    condition: "rung 30: the new step's mail date is within DRIP_MIN_GAP_DAYS (2) of a sibling step's mail date"
  - id: ERR_DRIP_STEP_LIMIT
    http: 409
    condition: "rung 31: the schedule already holds DRIP_MAX_STEPS (8) non-CANCELLED steps"
  - id: ERR_INK_TYPE_MISMATCH
    http: 422
    condition: "rung 32: the ink lot's ink_type differs from the template's handwriting style's ink_type"
  - id: ERR_EDDM_VARIANT_INELIGIBLE
    http: 422
    condition: "rung 33: the job's eddm_rate_variant is not eligible for every selected route"
  - id: ERR_EDDM_PIECE_BOUNDS
    http: 422
    condition: "rung 34: the EDDM job's total selected pieces fall outside [5, 50] inclusive"
  - id: ERR_NO_MAILABLE_PIECES
    http: 422
    condition: "rung 35: the job has zero billable pieces"
  - id: ERR_RUN_PIECES_EXCEED_JOB
    http: 422
    condition: "rung 36: the run's piece_count exceeds the job's unreserved billable pieces"
  - id: ERR_REPRINT_NOT_ENTITLED
    http: 409
    condition: "rung 37: the cited ReturnEvent.entitlement is REFUND, not REPRINT"
  - id: ERR_REPRINT_CAP_EXCEEDED
    http: 409
    condition: "rung 38: the record has already used its single reprint allowance for the campaign"
  - id: ERR_MACHINE_CAPACITY_EXCEEDED
    http: 409
    condition: "rung 39: committed slot-minutes on the (machine, run_date) bucket plus this run's planned_slot_minutes exceed the machine's daily capacity"
  - id: ERR_INK_INSUFFICIENT
    http: 409
    condition: "rung 40: the draw would push InkLot.remaining_ul below INK_SAFETY_RESERVE_UL (500)"
  - id: ERR_INSUFFICIENT_PERMIT_BALANCE
    http: 402
    condition: "rung 41: Account.permit_balance_cents is below the job's total_due_cents at commit"

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix — segregation of duties
# ---------------------------------------------------------------------------
roles:
  - name: PlatformAdmin
    description: "Operator superset; may invoke every endpoint including the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /mail/accounts"
    shared_operations:
      - "every other endpoint in §1.5"

  - name: AccountOwner
    description: "The customer acting as their own Account. Approves and rejects proofs, tops up the permit escrow, reads their own campaigns, lists, jobs and reports. Never approves a proof they submitted (rung 23)."
    identity: "entity_backed:Account"
    exclusive_operations:
      - "POST /mail/proofs/{proof_id}/approve"
      - "POST /mail/proofs/{proof_id}/reject"
    shared_operations:
      - "POST /mail/accounts/{account_id}/postage-topups"
      - "POST /mail/campaigns"
      - "POST /mail/templates"
      - "PATCH /mail/templates/{template_id}"
      - "POST /mail/mailing-lists"
      - "POST /mail/mail-jobs"
      - "POST /mail/mail-jobs/{mail_job_id}/estimate"
      - "POST /mail/proofs"
      - "all GET reads scoped to the owning account"

  - name: CampaignManager
    description: "Agency operator who builds campaigns, templates, jobs, proofs and drip schedules and drives the job pipeline up to the mail drop."
    identity: "opaque"
    exclusive_operations:
      - "POST /mail/mail-jobs/{mail_job_id}/schedule"
      - "POST /mail/mail-jobs/{mail_job_id}/commit"
      - "POST /mail/mail-jobs/{mail_job_id}/void"
      - "POST /mail/mail-jobs/{mail_job_id}/eddm-routes"
      - "POST /mail/proofs/{proof_id}/submit"
      - "POST /mail/drip-schedules"
      - "POST /mail/drip-schedules/{drip_schedule_id}/steps"
      - "POST /mail/drip-steps/{drip_step_id}/release"
      - "POST /mail/campaigns/{campaign_id}/activate"
      - "POST /mail/campaigns/{campaign_id}/pause"
      - "POST /mail/blackout-dates"
    shared_operations:
      - "POST /mail/campaigns"
      - "POST /mail/templates"
      - "PATCH /mail/templates/{template_id}"
      - "POST /mail/mail-jobs"
      - "POST /mail/mail-jobs/{mail_job_id}/estimate"
      - "POST /mail/proofs"
      - "POST /mail/reprint-requests"
      - "all GET reads"

  - name: ListOperator
    description: "Data operator who imports lists, runs CASS and dedupe, applies NCOA moves and records returns."
    identity: "opaque"
    exclusive_operations:
      - "POST /mail/mailing-lists/{mailing_list_id}/records"
      - "POST /mail/mailing-lists/{mailing_list_id}/cass-runs"
      - "POST /mail/mailing-lists/{mailing_list_id}/dedupe-runs"
      - "POST /mail/mailing-lists/{mailing_list_id}/lock"
      - "POST /mail/list-records/{list_record_id}/ncoa-moves"
      - "POST /mail/list-records/{list_record_id}/returns"
    shared_operations:
      - "POST /mail/mailing-lists"
      - "POST /mail/reprint-requests"
      - "GET reads on lists, records, returns and reprints"

  - name: ProductionOperator
    description: "Plant operator who owns machines, ink lots, robot-pen runs, the mail drop and reprint fulfilment."
    identity: "opaque"
    exclusive_operations:
      - "POST /mail/machines"
      - "POST /mail/ink-lots"
      - "POST /mail/ink-lots/{ink_lot_id}/quarantine"
      - "POST /mail/ink-lots/{ink_lot_id}/release"
      - "POST /mail/handwriting-styles"
      - "POST /mail/mail-jobs/{mail_job_id}/production-runs"
      - "POST /mail/production-runs/{production_run_id}/start"
      - "POST /mail/production-runs/{production_run_id}/complete"
      - "POST /mail/production-runs/{production_run_id}/fail"
      - "POST /mail/production-runs/{production_run_id}/void"
      - "POST /mail/mail-jobs/{mail_job_id}/mail"
      - "POST /mail/reprint-requests/{reprint_request_id}/fulfill"
      - "POST /mail/reprint-requests/{reprint_request_id}/deny"
    shared_operations:
      - "GET reads on machines, ink lots, runs, jobs and templates"

  - name: ComplianceOfficer
    description: "Holds and releases campaigns and closes billing. Owns the two global write-gate axes; cannot build or price anything."
    identity: "opaque"
    exclusive_operations:
      - "POST /mail/campaigns/{campaign_id}/compliance-holds"
      - "POST /mail/campaigns/{campaign_id}/compliance-releases"
      - "POST /mail/campaigns/{campaign_id}/billing-close"
    shared_operations:
      - "GET reads on campaigns, jobs, proofs, ledger entries and reports"
