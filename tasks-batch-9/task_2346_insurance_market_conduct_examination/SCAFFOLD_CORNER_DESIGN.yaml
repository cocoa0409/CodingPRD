      - name: role_authorisation_outranks_resource_existence
        claim_type: priority_conflict
        grounds:
          - validations[priority 11 ERR_ROLE_NOT_PERMITTED]
          - validations[priority 20 ERR_EXAMINATION_NOT_FOUND]
        distinguishing_aspect: |
          A MarketAnalyst aiming lock-scope at an identifier that does not exist must be told 403 and
          not 404: the role gate at priority 11 runs before any lookup, so an unauthorised caller learns
          nothing about which identifiers exist. The same request from a SupervisingExaminer then
          returns 404, which is the only way to show that the identifier really was absent.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /market-conduct/examinations/aaaaaaaa-0000-0000-0000-0000000000ff/lock-scope"
              as: MarketAnalyst
              as_user_id: "44444444-4444-4444-4444-444444444444"
              captures: { err_role: "$.data.error_id" }
            - call: "POST /market-conduct/examinations/aaaaaaaa-0000-0000-0000-0000000000ff/lock-scope"
              as: SupervisingExaminer
              as_user_id: "11111111-1111-1111-1111-111111111111"
              captures: { err_missing: "$.data.error_id" }
            - call: "POST /market-conduct/scope-areas/aaaaaaaa-0000-0000-0000-0000000000ff/data-calls"
              payload: { records_requested: 100, response_due_date: "2026-09-15" }
              as: ExaminerInCharge
              as_user_id: "33333333-3333-3333-3333-333333333333"
              captures: { err_child: "$.data.error_id" }
            - call: "GET /market-conduct/insurers/aaaaaaaa-0000-0000-0000-0000000000ff"
              as: MarketAnalyst
              as_user_id: "44444444-4444-4444-4444-444444444444"
              captures: { err_insurer: "$.data.error_id" }
            - call: "GET /market-conduct/analysis-cycles/aaaaaaaa-0000-0000-0000-0000000000ff"
              as: MarketAnalyst
              as_user_id: "44444444-4444-4444-4444-444444444444"
              captures: { err_cycle: "$.data.error_id" }
          assert:
            - "MarketAnalyst on lock-scope returns 403 ERR_ROLE_NOT_PERMITTED, not 404"
            - "SupervisingExaminer on the same absent identifier returns 404 ERR_EXAMINATION_NOT_FOUND"
            - "An absent scope area returns 404 ERR_EXAM_RECORD_NOT_FOUND"
            - "An absent insurer returns 404 ERR_INSURER_NOT_FOUND"
            - "An absent cycle returns 404 ERR_CYCLE_NOT_FOUND - the four not-found codes are distinguished by resource family"

      - name: authentication_outranks_every_other_gate_including_the_role_gate
        claim_type: priority_ordering
        grounds:
          - validations[priority 10 ERR_UNAUTHENTICATED]
          - validations[priority 11 ERR_ROLE_NOT_PERMITTED]
          - endpoints[POST /market-conduct/_clock/set_current_utc]
        distinguishing_aspect: |
          Priority 10 is checked before the role gate, before existence and before shape, so a request
          that is simultaneously unauthenticated, wrongly roled, aimed at a missing resource and
          malformed still answers 401. A non-UUID identity value counts as unauthenticated rather than
          as a shape error, and the clock endpoint is the single declared exemption from the header
          requirement.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /market-conduct/examinations/aaaaaaaa-0000-0000-0000-0000000000ff/lock-scope"
              as: MarketAnalyst
              captures: { err_absent: "$.data.error_id" }
            - call: "POST /market-conduct/insurers"
              payload: { name: "Aurora Mutual Insurance Company", naic_code: "1", annual_premium_written_cents: -5 }
              as: MarketAnalyst
              as_user_id: "not-a-uuid"
              captures: { err_malformed: "$.data.error_id" }
            - call: "GET /market-conduct/examinations"
              as: SupervisingExaminer
              captures: { err_get: "$.data.error_id" }
            - call: "POST /market-conduct/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-20T00:00:00Z" }
              as: SupervisingExaminer
              captures: { clock_now: "$.data.current_utc" }
            - call: "POST /market-conduct/_clock/set_current_utc"
              payload: { to_iso8601: "20 September 2026" }
              as: SupervisingExaminer
              as_user_id: "11111111-1111-1111-1111-111111111111"
              captures: { err_clock: "$.data.error_id" }
          assert:
            - "A missing X-User-ID header returns 401 ERR_UNAUTHENTICATED even though the caller's role is also wrong and the target does not exist"
            - "A malformed non-UUID X-User-ID returns 401 ERR_UNAUTHENTICATED, outranking the shape errors in the same body"
            - "A read endpoint with no header returns 401 as well - the gate is not write-only"
            - "The clock endpoint succeeds with no X-User-ID header and reports current_utc == 2026-09-20T00:00:00Z"
            - "A non-RFC3339 to_iso8601 returns 422 ERR_INVALID_REQUEST - the clock endpoint is exempt from authentication only"

      - name: respondent_scope_is_enforced_on_reads_as_well_as_writes
        claim_type: cross_entity_validation
        grounds:
          - validations[priority 12 ERR_NOT_EXAM_SUBJECT]
          - roles.InsurerRespondent
        distinguishing_aspect: |
          The InsurerRespondent identity is entity-backed, so its X-User-ID is literally an Insurer
          identifier and every reachable record is filtered through the owning examination's insurer_id.
          A second carrier holds a perfectly valid role for the endpoint yet is refused on all of it -
          the data call it did not receive, the criticism it was not issued and even the read-only
          detail views - while its own examination remains fully reachable.
