            - "ClosureOrder.${co_id}.status == OPEN"

      - name: permit_application_referencing_another_facilitys_plan_review_rejected
        claim_type: Cross-entity validation
        grounds: ["validations[priority=7]", "errors[ERR_PLAN_REVIEW_FACILITY_MISMATCH]"]
        distinguishing_aspect: "plan_review_id resolves but was filed for pool A while the application is for pool B, producing ERR_PLAN_REVIEW_FACILITY_MISMATCH (409)."
        test_recipe:
          setup: ["One operator owns two pools; a plan review exists for pool A only."]
          setup_api_calls:
            - call: "POST /operators"
              payload: { legal_name: "Twin Pools Trust", contact_email: "ops@twinpools.example" }
              as: Anonymous
              captures: { op_id: $.data.id }
