            - "${cmn_thin} stays DRAFT as well, so both rejected submissions are side-effect free"

      - name: patient_lifecycle_and_transfer_rules_reject
        claim_type: violation_to_error
        grounds:
          - validations[priority=33]
          - validations[priority=77]
          - validations[priority=65]
          - validations[priority=41]
        distinguishing_aspect: |
          A DISCHARGED chart is closed to every clinical write, a transfer cannot be backdated or
          pointed at the branch that already serves the patient, and a transfer that is not yet due
          cannot be effected — then the same completion succeeds once the clock reaches the
          effective date, which shows the rule is a date comparison and not a state guard.
        test_recipe:
          setup:
            - "Two branches, B1 and B2. Patient P1 at B1 with one recorded study and no contracts, so discharge is unobstructed. Patient P2 at B1 for the transfer probes."
          setup_api_calls:
