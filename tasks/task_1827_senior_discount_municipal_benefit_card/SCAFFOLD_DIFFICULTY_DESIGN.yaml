            - { call: "POST /senior-benefits/applications/${app_id}/documents/${doc3}/review", payload: { decision: VERIFIED }, as: EligibilitySpecialist, as_user_id: "spec-1" }
            - { call: "POST /senior-benefits/applications/${app_id}/approve", payload: {}, as: ProgramAdministrator, as_user_id: "admin-1", captures: { ch_id: $.data.cardholder_id } }
            - { call: "GET /senior-benefits/cardholders/${ch_id}/cards", as: ProgramAdministrator, captures: { card_id: "$.data[0].id" } }
            - { call: "POST /senior-benefits/merchants", payload: { name: "Gate Grocers", reimbursement_rate_pct: 10, monthly_reimbursement_cap_cents: 100000 }, as: ProgramAdministrator, captures: { m_id: $.data.id } }
            - { call: "POST /senior-benefits/merchants/${m_id}/offers", payload: { category: GROCERY, discount_pct: 10, max_discount_cents: 100, valid_from: "2026-01-01", valid_until: "2027-01-01" }, as: MerchantOperator, as_user_id: "${m_id}" }
            - { call: "POST /senior-benefits/usage-transactions", payload: { card_id: "${card_id}", merchant_id: "${m_id}", category: GROCERY, purchase_amount_cents: 100 }, as: MerchantOperator, as_user_id: "${m_id}", captures: { t1: $.data.id } }
            - { call: "POST /senior-benefits/usage-transactions", payload: { card_id: "${card_id}", merchant_id: "${m_id}", category: GROCERY, purchase_amount_cents: 100 }, as: MerchantOperator, as_user_id: "${m_id}", captures: { t2: $.data.id } }
            - { call: "POST /senior-benefits/usage-transactions", payload: { card_id: "${card_id}", merchant_id: "${m_id}", category: GROCERY, purchase_amount_cents: 100 }, as: MerchantOperator, as_user_id: "${m_id}", captures: { t3: $.data.id } }
            - { call: "POST /senior-benefits/usage-transactions/${t1}/flag", payload: { reason: "fraud pattern" }, as: FraudAnalyst, as_user_id: "fraud-1" }
            - { call: "POST /senior-benefits/usage-transactions/${t2}/flag", payload: { reason: "fraud pattern" }, as: FraudAnalyst, as_user_id: "fraud-1" }
            - { call: "POST /senior-benefits/usage-transactions/${t3}/flag", payload: { reason: "fraud pattern" }, as: FraudAnalyst, as_user_id: "fraud-1" }
          trigger:
            - { call: "POST /senior-benefits/usage-transactions", payload: { card_id: "${card_id}", merchant_id: "${m_id}", category: GROCERY, purchase_amount_cents: 100 }, as: MerchantOperator, as_user_id: "${m_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_CARD_NOT_ACTIVE (http 409): the card (SUSPENDED) gates usage"
            - "the pinned order card -> cardholder -> merchant is observable: the cardholder is also SUSPENDED yet ERR_CARDHOLDER_NOT_ACTIVE is NOT returned"

      - name: fee_waiver_requires_cardholder_standing
        grounds:
          - state_machines.Cardholder.ACTIVE_to_REVOKED
          - "errors[ERR_CARDHOLDER_NOT_ACTIVE]"
          - entities.FeeWaiverGrant.fields.cardholder_id
        distinguishing_aspect: |
          Entity pair FeeWaiverGrant -> Cardholder (different pair from
          UsageTransaction -> BenefitCard): granting a fee waiver for a REVOKED
          cardholder is rejected ERR_CARDHOLDER_NOT_ACTIVE even though the waiver
          window itself is well-formed.
        test_recipe:
          setup:
            - "Cardholder onboarded (ACTIVE with card), then REVOKED by fraud-1"
          setup_api_calls:
            - { call: "POST /senior-benefits/applications", payload: { kind: INITIAL, applicant_full_name: "Waiver Gate", date_of_birth: "1960-01-01", annual_income_cents: 600000, residency_address: "15 Grant Ave" }, as: Applicant, captures: { app_id: $.data.id } }
            - { call: "POST /senior-benefits/applications/${app_id}/start-review", payload: {}, as: EligibilitySpecialist, as_user_id: "spec-1" }
            - { call: "POST /senior-benefits/applications/${app_id}/documents", payload: { document_type: PROOF_OF_AGE, document_reference: "WG-AGE" }, as: Applicant, captures: { doc1: $.data.id } }
            - { call: "POST /senior-benefits/applications/${app_id}/documents/${doc1}/review", payload: { decision: VERIFIED }, as: EligibilitySpecialist, as_user_id: "spec-1" }
            - { call: "POST /senior-benefits/applications/${app_id}/documents", payload: { document_type: PROOF_OF_INCOME, document_reference: "WG-INC" }, as: Applicant, captures: { doc2: $.data.id } }
            - { call: "POST /senior-benefits/applications/${app_id}/documents/${doc2}/review", payload: { decision: VERIFIED }, as: EligibilitySpecialist, as_user_id: "spec-1" }
            - { call: "POST /senior-benefits/applications/${app_id}/documents", payload: { document_type: PROOF_OF_RESIDENCY, document_reference: "WG-RES" }, as: Applicant, captures: { doc3: $.data.id } }
            - { call: "POST /senior-benefits/applications/${app_id}/documents/${doc3}/review", payload: { decision: VERIFIED }, as: EligibilitySpecialist, as_user_id: "spec-1" }
            - { call: "POST /senior-benefits/applications/${app_id}/approve", payload: {}, as: ProgramAdministrator, as_user_id: "admin-1", captures: { ch_id: $.data.cardholder_id } }
            - { call: "POST /senior-benefits/cardholders/${ch_id}/revoke", payload: { reason: "confirmed duplicate identity" }, as: FraudAnalyst, as_user_id: "fraud-1", captures: { st_revoked: $.data.status } }
          trigger:
            - { call: "POST /senior-benefits/cardholders/${ch_id}/fee-waivers", payload: { waiver_type: TRANSIT_FARE, start_date: "2026-09-01", end_date: "2026-09-30" }, as: ProgramAdministrator, as_user_id: "admin-1", captures: { err: $.data.error_id } }
          assert:
            - "revoke returned status REVOKED"
            - "fee-waiver grant on the REVOKED cardholder -> error_id == ERR_CARDHOLDER_NOT_ACTIVE (http 409)"
            - "no FeeWaiverGrant was created (GET /cardholders/{id}/fee-waivers would be empty)"

  - rule_id: resource_temporal_overlap
    instances:
      - name: offer_half_open_window_adjacency_allowed
        grounds:
          - entities.DiscountOffer.fields.valid_until
          - "errors[ERR_OFFER_WINDOW_OVERLAP]"
          - calculations.offer_selector
        distinguishing_aspect: |
          Half-open interval semantics on the MERCHANT offer resource: offer A
          [2026-01-01, 2026-03-01) and offer B [2026-03-01, 2026-05-01) touch but
          do NOT overlap (adjacency allowed), while offer C [2026-02-15, 2026-04-01)
          genuinely overlaps A and is rejected ERR_OFFER_WINDOW_OVERLAP; a PHARMACY
          offer overlapping A's window is allowed (overlap is per category).
        test_recipe:
          setup:
            - "Merchant enrolled (ACTIVE) by admin-1"
          setup_api_calls:
            - { call: "POST /senior-benefits/merchants", payload: { name: "Overlap Outfit", reimbursement_rate_pct: 25, monthly_reimbursement_cap_cents: 50000 }, as: ProgramAdministrator, captures: { m_id: $.data.id } }
          trigger:
            - { call: "POST /senior-benefits/merchants/${m_id}/offers", payload: { category: GROCERY, discount_pct: 10, max_discount_cents: 500, valid_from: "2026-01-01", valid_until: "2026-03-01" }, as: MerchantOperator, as_user_id: "${m_id}", captures: { offer_a: $.data.id } }
            - { call: "POST /senior-benefits/merchants/${m_id}/offers", payload: { category: GROCERY, discount_pct: 15, max_discount_cents: 500, valid_from: "2026-03-01", valid_until: "2026-05-01" }, as: MerchantOperator, as_user_id: "${m_id}", captures: { offer_b: $.data.id } }
            - { call: "POST /senior-benefits/merchants/${m_id}/offers", payload: { category: GROCERY, discount_pct: 20, max_discount_cents: 500, valid_from: "2026-02-15", valid_until: "2026-04-01" }, as: MerchantOperator, as_user_id: "${m_id}", captures: { err_c: $.data.error_id } }
            - { call: "POST /senior-benefits/merchants/${m_id}/offers", payload: { category: PHARMACY, discount_pct: 20, max_discount_cents: 500, valid_from: "2026-02-01", valid_until: "2026-02-20" }, as: MerchantOperator, as_user_id: "${m_id}", captures: { offer_d: $.data.id } }
          assert:
            - "offer A created (201): [2026-01-01, 2026-03-01)"
            - "offer B created (201): valid_from == A.valid_until is adjacency, allowed under half-open [from, until) semantics"
            - "offer C rejected: error_id == ERR_OFFER_WINDOW_OVERLAP (http 409) — [2026-02-15, 2026-04-01) intersects A"
            - "offer D created (201): PHARMACY windows are a separate overlap scope"

      - name: waiver_closed_interval_touching_conflicts
        grounds:
          - entities.FeeWaiverGrant.fields.end_date
          - "errors[ERR_WAIVER_WINDOW_OVERLAP]"
        distinguishing_aspect: |
          CLOSED interval semantics on the CARDHOLDER waiver resource (different
          resource and different interval geometry from the offer half-open rule):
          waiver A [2026-01-01, 2026-01-31] and waiver B starting 2026-01-31 TOUCH,
          and touching dates count as overlap -> ERR_WAIVER_WINDOW_OVERLAP; a
          FACILITY_FEE waiver inside A's window is a separate scope and succeeds.
        test_recipe:
          setup:
            - "Cardholder onboarded (ACTIVE)"
          setup_api_calls:
            - { call: "POST /senior-benefits/applications", payload: { kind: INITIAL, applicant_full_name: "Wendy Waiver", date_of_birth: "1960-01-01", annual_income_cents: 600000, residency_address: "16 Transit Way" }, as: Applicant, captures: { app_id: $.data.id } }
            - { call: "POST /senior-benefits/applications/${app_id}/start-review", payload: {}, as: EligibilitySpecialist, as_user_id: "spec-1" }
            - { call: "POST /senior-benefits/applications/${app_id}/documents", payload: { document_type: PROOF_OF_AGE, document_reference: "WW-AGE" }, as: Applicant, captures: { doc1: $.data.id } }
            - { call: "POST /senior-benefits/applications/${app_id}/documents/${doc1}/review", payload: { decision: VERIFIED }, as: EligibilitySpecialist, as_user_id: "spec-1" }
            - { call: "POST /senior-benefits/applications/${app_id}/documents", payload: { document_type: PROOF_OF_INCOME, document_reference: "WW-INC" }, as: Applicant, captures: { doc2: $.data.id } }
            - { call: "POST /senior-benefits/applications/${app_id}/documents/${doc2}/review", payload: { decision: VERIFIED }, as: EligibilitySpecialist, as_user_id: "spec-1" }
            - { call: "POST /senior-benefits/applications/${app_id}/documents", payload: { document_type: PROOF_OF_RESIDENCY, document_reference: "WW-RES" }, as: Applicant, captures: { doc3: $.data.id } }
            - { call: "POST /senior-benefits/applications/${app_id}/documents/${doc3}/review", payload: { decision: VERIFIED }, as: EligibilitySpecialist, as_user_id: "spec-1" }
            - { call: "POST /senior-benefits/applications/${app_id}/approve", payload: {}, as: ProgramAdministrator, as_user_id: "admin-1", captures: { ch_id: $.data.cardholder_id } }
          trigger:
            - { call: "POST /senior-benefits/cardholders/${ch_id}/fee-waivers", payload: { waiver_type: TRANSIT_FARE, start_date: "2026-01-01", end_date: "2026-01-31" }, as: ProgramAdministrator, as_user_id: "admin-1", captures: { wa: $.data.id } }
            - { call: "POST /senior-benefits/cardholders/${ch_id}/fee-waivers", payload: { waiver_type: TRANSIT_FARE, start_date: "2026-01-31", end_date: "2026-02-28" }, as: ProgramAdministrator, as_user_id: "admin-1", captures: { err_b: $.data.error_id } }
            - { call: "POST /senior-benefits/cardholders/${ch_id}/fee-waivers", payload: { waiver_type: FACILITY_FEE, start_date: "2026-01-15", end_date: "2026-02-15" }, as: ProgramAdministrator, as_user_id: "admin-1", captures: { wc: $.data.id } }
          assert:
            - "waiver A (TRANSIT [2026-01-01, 2026-01-31]) created (201)"
            - "waiver B (TRANSIT from 2026-01-31) rejected: error_id == ERR_WAIVER_WINDOW_OVERLAP (http 409) — under closed-interval semantics the shared date 2026-01-31 is a conflict (unlike offer adjacency)"
            - "waiver C (FACILITY_FEE [2026-01-15, 2026-02-15]) created (201): overlap scope is per waiver_type"

  - rule_id: compensating_invariant
    instances:
      - name: replacement_conserves_active_card_count
        grounds:
          - state_machines.BenefitCard.ACTIVE_to_REPLACED
          - "concurrency_rules[card-issue-stale-cardholder]"
          - entities.BenefitCard.fields.replaces_card_id
        distinguishing_aspect: |
          Conserved CARDINALITY quantity: issuing a REPLACEMENT card (forward
          action: new card becomes ACTIVE) paired with superseding the old card
          (compensating action: old card -> REPLACED) leaves the invariant
          count(BenefitCard where cardholder_id == X AND status == ACTIVE) == 1
          unchanged — 1 before, 1 after.
        test_recipe:
          setup:
            - "Cardholder onboarded: exactly one ACTIVE card C1 (invariant value 1)"
            - "Cardholder version captured after onboarding"
          setup_api_calls:
            - { call: "POST /senior-benefits/applications", payload: { kind: INITIAL, applicant_full_name: "Riley Replace", date_of_birth: "1960-01-01", annual_income_cents: 600000, residency_address: "17 Swap St" }, as: Applicant, captures: { app_id: $.data.id } }
            - { call: "POST /senior-benefits/applications/${app_id}/start-review", payload: {}, as: EligibilitySpecialist, as_user_id: "spec-1" }
            - { call: "POST /senior-benefits/applications/${app_id}/documents", payload: { document_type: PROOF_OF_AGE, document_reference: "RR-AGE" }, as: Applicant, captures: { doc1: $.data.id } }
            - { call: "POST /senior-benefits/applications/${app_id}/documents/${doc1}/review", payload: { decision: VERIFIED }, as: EligibilitySpecialist, as_user_id: "spec-1" }
            - { call: "POST /senior-benefits/applications/${app_id}/documents", payload: { document_type: PROOF_OF_INCOME, document_reference: "RR-INC" }, as: Applicant, captures: { doc2: $.data.id } }
            - { call: "POST /senior-benefits/applications/${app_id}/documents/${doc2}/review", payload: { decision: VERIFIED }, as: EligibilitySpecialist, as_user_id: "spec-1" }
            - { call: "POST /senior-benefits/applications/${app_id}/documents", payload: { document_type: PROOF_OF_RESIDENCY, document_reference: "RR-RES" }, as: Applicant, captures: { doc3: $.data.id } }
            - { call: "POST /senior-benefits/applications/${app_id}/documents/${doc3}/review", payload: { decision: VERIFIED }, as: EligibilitySpecialist, as_user_id: "spec-1" }
            - { call: "POST /senior-benefits/applications/${app_id}/approve", payload: {}, as: ProgramAdministrator, as_user_id: "admin-1", captures: { ch_id: $.data.cardholder_id } }
            - { call: "GET /senior-benefits/cardholders/${ch_id}/cards", as: ProgramAdministrator, captures: { c1_id: "$.data[0].id", c1_status: "$.data[0].status" } }
            - { call: "GET /senior-benefits/cardholders/${ch_id}", as: ProgramAdministrator, captures: { ch_v: $.data.version } }
          trigger:
            - { call: "POST /senior-benefits/cardholders/${ch_id}/cards", payload: { reason: REPLACEMENT, expected_cardholder_version: "${ch_v}" }, as: ProgramAdministrator, as_user_id: "admin-1", captures: { c2_id: $.data.id, c2_status: $.data.status, c2_replaces: $.data.replaces_card_id, c2_reason: $.data.issue_reason } }
            - { call: "GET /senior-benefits/cardholders/${ch_id}/cards", as: ProgramAdministrator }
          assert:
            - "new card C2: status == ACTIVE, issue_reason == REPLACEMENT, replaces_card_id == C1's id"
            - "C1 (the old card) now has status REPLACED"
            - "invariant holds: count(cards of ${ch_id} with status == ACTIVE) == 1 after the pair, exactly as before (1)"
            - "Cardholder.version incremented by 1 as a side effect of issuance (OCC advance)"

      - name: void_conserves_cardholder_ytd_totals
        grounds:
          - state_machines.UsageTransaction.POSTED_to_VOIDED
          - calculations.cardholder_ytd_totals
          - entities.Cardholder.fields.ytd_discount_cents
        distinguishing_aspect: |
          Conserved MONETARY-COUNTER quantity (different type from the card-count
          cardinality invariant): posting a transaction with discount 500 then
          voiding it leaves cardholder.ytd_discount_cents and
          ytd_transaction_count bit-identical to their pre-pair values
          (1000 / 2 before, 1500 / 3 after posting, 1000 / 2 after voiding).
        test_recipe:
          setup:
            - "Cardholder onboarded with ACTIVE card; merchant (rate 10) with GROCERY offer 10% max 1000"
            - "Clock 2026-08-05T10:00:00Z; two POSTED transactions purchase 5000 -> discount 500 each; ytd_discount_cents == 1000, ytd_transaction_count == 2"
          setup_api_calls:
            - { call: "POST /senior-benefits/applications", payload: { kind: INITIAL, applicant_full_name: "Vera Void", date_of_birth: "1960-01-01", annual_income_cents: 600000, residency_address: "18 Refund Rd" }, as: Applicant, captures: { app_id: $.data.id } }
            - { call: "POST /senior-benefits/applications/${app_id}/start-review", payload: {}, as: EligibilitySpecialist, as_user_id: "spec-1" }
            - { call: "POST /senior-benefits/applications/${app_id}/documents", payload: { document_type: PROOF_OF_AGE, document_reference: "VV-AGE" }, as: Applicant, captures: { doc1: $.data.id } }
            - { call: "POST /senior-benefits/applications/${app_id}/documents/${doc1}/review", payload: { decision: VERIFIED }, as: EligibilitySpecialist, as_user_id: "spec-1" }
            - { call: "POST /senior-benefits/applications/${app_id}/documents", payload: { document_type: PROOF_OF_INCOME, document_reference: "VV-INC" }, as: Applicant, captures: { doc2: $.data.id } }
            - { call: "POST /senior-benefits/applications/${app_id}/documents/${doc2}/review", payload: { decision: VERIFIED }, as: EligibilitySpecialist, as_user_id: "spec-1" }
            - { call: "POST /senior-benefits/applications/${app_id}/documents", payload: { document_type: PROOF_OF_RESIDENCY, document_reference: "VV-RES" }, as: Applicant, captures: { doc3: $.data.id } }
            - { call: "POST /senior-benefits/applications/${app_id}/documents/${doc3}/review", payload: { decision: VERIFIED }, as: EligibilitySpecialist, as_user_id: "spec-1" }
            - { call: "POST /senior-benefits/applications/${app_id}/approve", payload: {}, as: ProgramAdministrator, as_user_id: "admin-1", captures: { ch_id: $.data.cardholder_id } }
            - { call: "GET /senior-benefits/cardholders/${ch_id}/cards", as: ProgramAdministrator, captures: { card_id: "$.data[0].id" } }
            - { call: "POST /senior-benefits/merchants", payload: { name: "Void Variety", reimbursement_rate_pct: 10, monthly_reimbursement_cap_cents: 100000 }, as: ProgramAdministrator, captures: { m_id: $.data.id } }
            - { call: "POST /senior-benefits/merchants/${m_id}/offers", payload: { category: GROCERY, discount_pct: 10, max_discount_cents: 1000, valid_from: "2026-01-01", valid_until: "2027-01-01" }, as: MerchantOperator, as_user_id: "${m_id}" }
            - { call: "POST /senior-benefits/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T10:00:00Z" }, as: ProgramAdministrator }
            - { call: "POST /senior-benefits/usage-transactions", payload: { card_id: "${card_id}", merchant_id: "${m_id}", category: GROCERY, purchase_amount_cents: 5000 }, as: MerchantOperator, as_user_id: "${m_id}" }
            - { call: "POST /senior-benefits/usage-transactions", payload: { card_id: "${card_id}", merchant_id: "${m_id}", category: GROCERY, purchase_amount_cents: 5000 }, as: MerchantOperator, as_user_id: "${m_id}" }
            - { call: "GET /senior-benefits/cardholders/${ch_id}", as: ProgramAdministrator, captures: { ytd0: $.data.ytd_discount_cents, cnt0: $.data.ytd_transaction_count } }
          trigger:
            - { call: "POST /senior-benefits/usage-transactions", payload: { card_id: "${card_id}", merchant_id: "${m_id}", category: GROCERY, purchase_amount_cents: 5000 }, as: MerchantOperator, as_user_id: "${m_id}", captures: { t3: $.data.id, t3_disc: $.data.discount_cents } }
            - { call: "GET /senior-benefits/cardholders/${ch_id}", as: ProgramAdministrator, captures: { ytd1: $.data.ytd_discount_cents, cnt1: $.data.ytd_transaction_count } }
            - { call: "POST /senior-benefits/usage-transactions/${t3}/void", payload: {}, as: MerchantOperator, as_user_id: "${m_id}", captures: { t3_status: $.data.status } }
            - { call: "GET /senior-benefits/cardholders/${ch_id}", as: ProgramAdministrator, captures: { ytd2: $.data.ytd_discount_cents, cnt2: $.data.ytd_transaction_count } }
          assert:
            - "baseline: ytd_discount_cents == 1000, ytd_transaction_count == 2"
            - "after posting t3 (discount_cents == 500): ytd_discount_cents == 1500, ytd_transaction_count == 3"
            - "t3 void returns status VOIDED"
            - "after void: ytd_discount_cents == 1000 and ytd_transaction_count == 2 — the post/void pair conserves the ytd totals exactly"
