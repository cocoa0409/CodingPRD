            - "the 2026-09-05 job creation returns HTTP 409 with error_id ERR_CREW_WINDOW_CONFLICT"
            - "after the rejected call Well.${w2_id}.status == ORPHAN_CONFIRMED and UnitCostContract.${contract_id}.obligated_cents == 6070196"
            - "the 2026-09-06 job creation returns HTTP 201 (adjacency at the exclusive end is allowed)"
            - "PluggingJob.${job2_id}.scheduled_start == 2026-09-06T00:00:00Z and crew_window_end_at == 2026-09-11T00:00:00Z"
            - "PluggingJob.${job2_id}.plugging_cost_estimate_cents == 6070196 and UnitCostContract.${contract_id}.obligated_cents == 12140392"
