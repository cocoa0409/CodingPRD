      - name: seed_bags_ceiled_per_allocation_then_summed
        grounds:
          - calculations.seed_increase_volume_plan
          - entities.SeedIncreaseLot.fields.planned_units_bags
          - entities.SeedIncreaseLot.fields.allocated_seed_g
          - endpoints["POST /seed-increase-lots"]
        distinguishing_aspect: |
          Combinatorial mode (b): the rounding ORDER decides the answer, and the
          scaffold pins ceil-per-allocation-then-sum. Demands 4000 / 9000 / 1300
          kg give per-market bag counts 173 + 389 + 57 = 619 bags, while summing
          the demand first and ceiling once gives 618 - a one-bag gap that is
          invisible unless the order is honoured. A second pinned ceiling then
          converts 619 bags into exactly 386875 g of parent seed.
        test_recipe:
          setup:
            - "One program, one objective, line SX-3001 with seed_inventory_g 500000."
