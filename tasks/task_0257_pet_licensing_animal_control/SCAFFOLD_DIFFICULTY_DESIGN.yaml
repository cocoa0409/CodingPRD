          recomputes Owner.outstanding_penalty_cents (hop1), which being > 0 flips Owner.status to
          DELINQUENT (hop2); the second hop is caused by the first, and the trigger (clock advance)
          differs from the mark-deceased trigger above.
        test_recipe:
          setup:
            - "Owner OF with one ACTIVE INDIVIDUAL license LF (unaltered pet, final_fee 4000) issued 2026-01-01, term 1yr"
            - "Clock advanced past grace-window end so LF lands EXPIRED with days_late=10 → late_penalty 2000"
