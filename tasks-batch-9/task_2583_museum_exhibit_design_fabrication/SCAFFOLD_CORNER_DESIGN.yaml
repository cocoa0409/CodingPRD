      - name: the_punch_verifier_may_never_be_the_person_who_raised_the_defect
        claim_type: segregation_of_duties
        grounds:
          - errors.ERR_SEGREGATION_OF_DUTIES
          - endpoints.POST_/punch-items/{id}/verify
          - endpoints.POST_/punch-items/{id}/waive
        distinguishing_aspect: |
          The punch list is the one place where the segregation rule guards TWO
          different closing actions against the SAME stored id: verify and waive both
          compare against item.raised_by_user_id, so an implementation that wires the
          check into verify only lets a manager raise a defect and immediately waive
          it away, which is exactly the abuse the rule exists to stop. The instance
          also shows that a role which cannot raise an item at all is not what the
          rule is about: the refusals here all come from callers holding a legal role
          for the action, and the successful verification is performed by a role that
          could equally have raised the item.
