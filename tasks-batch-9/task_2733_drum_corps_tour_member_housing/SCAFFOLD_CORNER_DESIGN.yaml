  - section: cross_cutting_complexity_layers
    instances:
      - name: stale_member_version_rejects_the_superseding_payment_plan
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[plan-create-stale-member]
          - errors[ERR_STALE_MEMBER_VERSION]
          - state_machines.PaymentPlan.ACTIVE_to_SUPERSEDED
        distinguishing_aspect: "This is the OCC rule the state machine cannot replace: a second plan creation is legitimate (it supersedes the first), so only the Member.version check can reject a writer working from a stale read. The stale attempt must be 412 ERR_STALE_MEMBER_VERSION, and the retry with the refreshed version must succeed and move the first plan to SUPERSEDED."
        test_recipe:
          setup: ["One member holds an EXECUTED 399900 STANDARD_3 contract; the member version is read once and reused deliberately."]
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "2027 Tour", year: 2027, tuition_base_cents: 399900, spring_training_start_date: "2027-05-10", spring_training_end_date: "2027-06-05", tour_departure_date: "2027-06-12" }
              as: CorpsDirector
              captures: { season_id: "$.data.id" }
            - call: "POST /members"
              payload: { season_id: "${season_id}", full_name: "Avery Nakamura", email: "avery@corps.test", date_of_birth: "2005-03-04", section: "BRASS", dietary_flag: "NONE" }
              as: MembershipCoordinator
              captures: { member_id: "$.data.id" }
            - call: "POST /members/${member_id}/audition-decision"
              payload: { decision: "OFFER", audition_score: 90 }
              as: MembershipCoordinator
            - call: "POST /member-contracts"
              payload: { member_id: "${member_id}", tuition_amount_cents: 399900, payment_plan_type: "STANDARD_3" }
              as: MembershipCoordinator
              captures: { contract_id: "$.data.id" }
            - call: "POST /member-contracts/${contract_id}/sign"
              payload: { signature_name: "Avery Nakamura" }
              as: Member
              as_user_id: "${member_id}"
            - call: "POST /member-contracts/${contract_id}/execute"
              payload: {}
              as: CorpsDirector
            - call: "GET /members/${member_id}"
              as: BusinessManager
              captures: { member_v1: "$.data.version" }
          trigger:
            - call: "POST /payment-plans"
              payload: { member_id: "${member_id}", member_contract_id: "${contract_id}", first_due_date: "2027-01-15", expected_member_version: "${member_v1}" }
              as: BusinessManager
              captures: { plan_one_id: "$.data.id" }
            - call: "POST /payment-plans"
              payload: { member_id: "${member_id}", member_contract_id: "${contract_id}", first_due_date: "2027-02-15", expected_member_version: "${member_v1}" }
              as: BusinessManager
              captures: { stale_err: "$.data.error_id" }
            - call: "GET /members/${member_id}"
              as: BusinessManager
              captures: { member_v2: "$.data.version" }
            - call: "POST /payment-plans"
              payload: { member_id: "${member_id}", member_contract_id: "${contract_id}", first_due_date: "2027-02-15", expected_member_version: "${member_v2}" }
              as: BusinessManager
              captures: { plan_two_id: "$.data.id" }
          assert:
            - "the first creation returns 201 and advances the member: ${member_v2} == ${member_v1} + 1"
            - "${stale_err} == ERR_STALE_MEMBER_VERSION with HTTP 412 — the second write carried the pre-write version"
            - "after the rejection PaymentPlan.${plan_one_id}.status is still ACTIVE and only one plan exists"
            - "the retry with the refreshed version returns 201: PaymentPlan.${plan_two_id}.status == ACTIVE with first_due_date 2027-02-15, and PaymentPlan.${plan_one_id}.status == SUPERSEDED"
            - "Member.${member_id}.version advanced once more on the successful retry, so version increments on every accepted write and never on a rejected one"

      - name: stale_agreement_version_rejects_the_second_housing_assignment
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[housing-assign-stale-agreement]
          - errors[ERR_STALE_AGREEMENT_VERSION]
          - calculations.housing_bed_night_capacity
        distinguishing_aspect: "Adding an occupant leaves the agreement SIGNED, so no state precondition can catch a stale bed-availability view — only the FacilityAgreement.version check can. Two coordinators reading the same version must have the second write rejected with 412, and the retry after re-reading must land the second occupant."
        test_recipe:
          setup:
            - "A SIGNED spring-training agreement at a 30-space school (capacity 12) exists with two adult members and no occupants yet."
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "2027 Tour", year: 2027, tuition_base_cents: 399900, spring_training_start_date: "2027-05-10", spring_training_end_date: "2027-06-05", tour_departure_date: "2027-06-12" }
