          rationale: "The Saturday premium and the seven-step ordering (premium on subtotal, not on base) are that instance's subject; this file deliberately uses Wednesday programs so its own fee arithmetic stays premium-free."

      - name: weather_kill_fee_halves_the_total_inside_the_forty_eight_hour_window
        claim_type: threshold
        grounds:
          - calculations.contract_cancellation_fee.constants.WEATHER_KILL_FEE_WINDOW_HOURS
        excluded_because:
          difficulty_instance: weather_close_cascade_four_links_from_contract_kill_fee_to_branch_counter
          rationale: "The WEATHER variant's 48-hour threshold and its 50% rate are exercised there as the first link of CASCADE-A; the LIBRARY variant's own thresholds are covered in this file's validations section."

  # ============================================================== §1.4 VALIDATIONS
  # Every §1.6 error id is either triggered by an instance in this file or noted as
  # covered by a §1.8 instance in the errors section's coverage comment.
  - section: validations
    instances:

      - name: reservation_on_an_out_of_service_room_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=18]
          - errors[ERR_ROOM_OUT_OF_SERVICE]
        distinguishing_aspect: "A room created with status OUT_OF_SERVICE cannot be booked at all: the reservation create returns ERR_ROOM_OUT_OF_SERVICE (409) before any occupancy arithmetic and no reservation row appears."
        test_recipe:
          setup:
            - "Branch CEN with one OUT_OF_SERVICE room and one DRAFT program."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: ProgramManager
            - call: "POST /library/branches"
              payload: { name: "Central Library", branch_code: "CEN", overlapping_program_capacity: 2, per_program_fee_cap_cents: 150000 }
              as: ProgramManager
              captures: { br: $.data.id }
            - call: "POST /library/branches/${br}/rooms"
              payload: { room_name: "Story Room", capacity_seats: 60, min_setup_minutes: 15, min_teardown_minutes: 15, status: "OUT_OF_SERVICE" }
              as: ProgramManager
              captures: { room: $.data.id }
