          client_id: "${client_id}"
          external_subject_ref: subj-sw1
          requested_assurance_tier: BASIC
          subject_jurisdiction_code: US
          biometric_consent: true
        as: ClientIntegrator
        as_user_id: "${client_id}"
        captures: {s1: $.data.id}
      - call: "POST /idv/verification-sessions/${s1}/method-attempts"
        payload:
          method_profile_id: "${p_bio_id}"
        as: ClientIntegrator
        as_user_id: "${client_id}"
        captures: {a1: $.data.id}
      - call: "POST /idv/method-attempts/${a1}/liveness-checks"
        payload: {capture_modality: ACTIVE, pad_score_bps: 9000, match_score_bps: 9200}
        as: ClientIntegrator
        as_user_id: "${client_id}"
      - call: "POST /idv/method-attempts/${a1}/finalize"
        payload: {}
        as: ClientIntegrator
        as_user_id: "${client_id}"
      - call: "POST /idv/verification-sessions/${s1}/complete"
        payload: {}
        as: ClientIntegrator
        as_user_id: "${client_id}"
      - call: POST /idv/verification-sessions
        payload:
          client_id: "${client_id}"
          external_subject_ref: subj-sw2
          requested_assurance_tier: BASIC
          subject_jurisdiction_code: US
        as: ClientIntegrator
        as_user_id: "${client_id}"
        captures: {s2: $.data.id}
      - call: "POST /idv/verification-sessions/${s2}/method-attempts"
        payload:
