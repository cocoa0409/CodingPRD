            - "the identical request with depth_in 3.000 -> 201 with Opening.${o1}.measure_status == MEASURED"
            - "the refused attempt left no trace: Consultation.${c1}.measured_opening_count == 1 and its version advanced exactly once"

      - name: ledger_entries_are_immutable_rows_with_no_version_and_no_write_endpoint
        claim_type: Immutability
        grounds:
