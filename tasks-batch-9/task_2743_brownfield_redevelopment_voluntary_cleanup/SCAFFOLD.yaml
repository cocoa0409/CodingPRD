# =============================================================================
# SCAFFOLD.yaml — §1.0–§1.7 seed tables
# Task: task_2743_brownfield_redevelopment_voluntary_cleanup
#
# Domain: a state Voluntary Cleanup Program (VCP) back-office for brownfield
# redevelopers: phased site assessment with contaminant delineation, risk-based
# cleanup-goal setting, bona fide prospective purchaser (BFPP) liability
# protection with continuing obligations, remedial action plan approval,
# remediation cost estimation with contingency and cost-cap insurance,
# engineering/institutional controls, grant + tax-credit funding assembly,
# no-further-action (NFA) letter issuance with lender acceptance, and
# long-term monitoring / control-maintenance reporting.
# =============================================================================

scenario: |
  Generate task harder than expert level!

  2743. Brownfield Redevelopment & Voluntary Cleanup (brownfield redeveloper): site assessment phasing with contaminant delineation and risk-based cleanup goal setting, liability protection strategy through bona fide prospective purchaser status and continuing obligations, voluntary cleanup program enrollment and remedial action plan approval, remediation cost estimation with contingency and cost-cap insurance placement, engineering and institutional controls including vapor mitigation and deed restrictions, grant and tax credit funding assembly with eligibility documentation, no-further-action letter issuance and lender/investor acceptance, long-term monitoring and control maintenance reporting

domain_name: brownfield-voluntary-cleanup

# Empty prefix: this is a multi-root flat/graph API (sites, assessment-phases,
# liability-protections, remedial-action-plans, cost-cap-policies, site-controls,
# nfa-letters, monitoring-events, funding-awards, parties, laboratories,
# compliance-sweeps) rather than a single nested resource tree.
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency
    - ops_run_checkpoint

  entity_topology: graph
  # Site is a hub, but the interesting edges are cross-aggregate and
  # self-referential: AssessmentPhase.supersedes_phase_id points at another
  # AssessmentPhase; a single MonitoringEvent references Site, Laboratory,
  # SiteControl and CleanupGoal; SiteControl references both Site and
  # RemedialActionPlan; RemedialActionPlan carries a junction array pinning
  # CleanupGoal versions. Traversals are DAG-shaped, not tree-shaped.

  state_machine_shape: parallel
  # LiabilityProtection carries two independent state dimensions
  # (inquiry_state x obligation_state) plus a derived bfpp_status.
  # AssessmentPhase and RemedialActionPlan are cyclic (revision loops);
  # Site.cleanup_posture is compound (derived from children).

  relationship_patterns:
    - one_to_many          # Site -> AssessmentPhase / CleanupGoal / FundingAward
    - self_referential     # AssessmentPhase.supersedes_phase_id -> AssessmentPhase.id
    - cross_aggregate      # MonitoringEvent -> SiteControl / CleanupGoal / Laboratory
    - many_to_many         # RemedialActionPlan.pinned_cleanup_goal_versions junction array

  role_model: segregation_of_duties
  # The agency reviewer who approved a RemedialActionPlan may not issue that
  # site's NFA letter; the reviewer who imposed a ContinuingObligation may not
  # void its certification.

  consistency_model: immediate

  difficulty_level: expert_plus
  # 15 entities / 70 endpoints / 70 errors / 7 calculations (3 with variants) /
  # 11 state machines (2 cyclic, 1 parallel, 1 compound) / 2 OCC rules.

# -----------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — verbatim)
# -----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# -----------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# -----------------------------------------------------------------------------
entities:

  # ---------------------------------------------------------------- Party ----
  - name: Party
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Registered legal name of the organisation.
        constraints: 1..160 chars, required
      - name: party_type
        type: enum
        source: input
        description: Which side of the transaction this organisation plays.
        constraints: "one of REDEVELOPER, CONSULTANT, INSURER"
      - name: state_code
        type: string
        source: input
        description: Two-letter US state of registration.
        constraints: exactly 2 uppercase letters
      - name: licence_number
        type: string
        source: input
        description: Professional/insurance licence identifier; required for CONSULTANT and INSURER, optional for REDEVELOPER.
        default: null

  # ----------------------------------------------------------------- Site ----
  - name: Site
    parent: null
    common_fields: true
    fields:
      - name: owner_party_id
        type: string
        source: input
        description: "FK -> Party.id; must be a Party with party_type == REDEVELOPER; equals X-User-ID for the Redeveloper role."
      - name: site_name
        type: string
        source: input
        description: Common name of the brownfield property.
        constraints: 1..160 chars, required
      - name: county_code
        type: string
        source: input
        description: Regulator county/district code for the parcel.
        constraints: 1..16 chars, required
      - name: acreage
        type: number
        source: input
        description: Parcel size in acres.
        constraints: "> 0, at most 2 decimal places"
      - name: intended_reuse
        type: enum
        source: input
        description: Post-redevelopment land use; drives the RESTRICTED cleanup-goal exposure multiplier.
        constraints: "one of RESIDENTIAL, RECREATIONAL, COMMERCIAL, INDUSTRIAL"
      - name: institutional_control_committed
        type: boolean
        source: input
        description: Redeveloper has committed in writing to record deed restrictions; required true before any RESTRICTED cleanup goal may be derived.
        default: false
      - name: planned_acquisition_date
        type: string
        source: input
        description: Scheduled closing date (ISO 8601 date, YYYY-MM-DD); the AAI reference date while acquisition_status == UNDER_CONTRACT.
        constraints: ISO 8601 date, required
      - name: acquisition_status
        type: enum
        source: system
        description: Whether the parcel has actually closed.
        default: UNDER_CONTRACT
        constraints: "one of UNDER_CONTRACT, ACQUIRED"
      - name: acquisition_date
        type: string
        source: system
        description: Actual closing date recorded by POST /sites/{id}/acquisition; null while UNDER_CONTRACT.
        default: null
      - name: delineation_status
        type: enum
        source: computed
        description: NONE until a PHASE_I phase is APPROVED (then SCREENED); DELINEATED once a PHASE_II or SUPPLEMENTAL phase with delineation_complete == true is APPROVED.
        default: NONE
        constraints: "one of NONE, SCREENED, DELINEATED"
      - name: cleanup_posture
        type: enum
        source: computed
        description: Derived gate over all child mutations; recomputed by §1.3 site_cleanup_posture on every child side effect.
        default: OPEN
        constraints: "one of OPEN, RESTRICTED, FROZEN"
      - name: impaired_control_count
        type: integer
        source: computed
        description: Count of SiteControl rows on this site whose status == IMPAIRED.
        default: 0

  # ------------------------------------------------------ AssessmentPhase ----
  - name: AssessmentPhase
    parent: Site
    common_fields: true
    fields:
      - name: site_id
        type: string
        source: input
        description: "FK -> Site.id; the parcel being assessed."
      - name: consultant_party_id
        type: string
        source: input
        description: "FK -> Party.id; must be a Party with party_type == CONSULTANT and equal X-User-ID for the EnvironmentalConsultant role."
      - name: supersedes_phase_id
        type: string
        source: input
        description: "FK -> AssessmentPhase.id; self-reference to the phase this one replaces (SUPPLEMENTAL work re-delineating a rejected phase). Null for an original phase."
        default: null
      - name: phase_type
        type: enum
        source: input
        description: Assessment tier.
        constraints: "one of PHASE_I, PHASE_II, SUPPLEMENTAL"
      - name: field_start_date
        type: string
        source: input
        description: First day of field work (ISO 8601 date).
      - name: field_end_date
        type: string
        source: input
        description: Last day of field work (ISO 8601 date); must be >= field_start_date.
      - name: aai_report_date
        type: string
        source: input
        description: All-Appropriate-Inquiries report date; required for phase_type == PHASE_I, must be null otherwise.
        default: null
      - name: delineation_confidence
        type: enum
        source: input
        description: Consultant's confidence that the plume boundary is closed; feeds the DESIGN contingency tier.
        constraints: "one of SCREENING, PARTIAL, FULL"
      - name: delineation_complete
        type: boolean
        source: input
        description: Consultant asserts every impacted media boundary is closed; only meaningful for PHASE_II and SUPPLEMENTAL.
        default: false
      - name: status
        type: enum
        source: system
        description: Review lifecycle state (§1.2 AssessmentPhase).
        default: DRAFT
        constraints: "one of DRAFT, SUBMITTED, UNDER_REVIEW, REVISION_REQUESTED, APPROVED, REJECTED"
      - name: review_round
        type: integer
        source: computed
        description: Number of times this phase has been submitted; incremented on every DRAFT/REVISION_REQUESTED -> SUBMITTED transition. Third revision request rejects the phase.
        default: 0
      - name: findings_count
        type: integer
        source: computed
        description: Count of ContaminantFinding rows attached to this phase.
        default: 0
      - name: max_exceedance_factor
        type: number
        source: computed
        description: Maximum exceedance_factor across this phase's ContaminantFinding rows; 0 when there are none. Feeds the cost-estimate contingency adder.
        default: 0
      - name: submitted_at
        type: datetime
        source: system
        description: Logical-clock timestamp of the most recent submit; null while DRAFT.
        default: null
      - name: reviewed_by_user_id
        type: string
        source: system
        description: X-User-ID of the StateAgencyReviewer who issued the most recent review decision (opaque operator id, not a Party id).
        default: null

  # --------------------------------------------------- ContaminantFinding ----
  - name: ContaminantFinding
    parent: AssessmentPhase
    common_fields: false
    fields:
      - name: assessment_phase_id
        type: string
        source: input
        description: "FK -> AssessmentPhase.id; the phase whose field work produced this record."
      - name: contaminant_code
        type: string
        source: input
        description: Analyte code (e.g. TCE, PCE, LEAD).
        constraints: 1..24 chars, uppercase
      - name: media
        type: enum
        source: input
        description: Environmental media sampled.
        constraints: "one of SOIL, GROUNDWATER, SOIL_VAPOR"
      - name: sample_location_code
        type: string
        source: input
        description: Boring/well identifier (e.g. MW-3).
      - name: max_concentration_ugl
        type: number
        source: input
        description: Highest detected concentration in ug/L (or ug/kg for SOIL, same numeric scale).
        constraints: ">= 0"
      - name: screening_level_ugl
        type: number
        source: input
        description: Regulatory screening level for this analyte/media pair.
        constraints: "> 0"
      - name: delineated
        type: boolean
        source: input
        description: True when the lateral and vertical extent of this analyte is closed at this location.
        default: false
      - name: exceedance_factor
        type: number
        source: computed
        description: round_half_up(max_concentration_ugl / screening_level_ugl, 2). Immutable once written.

  # ----------------------------------------------------------- CleanupGoal ----
  - name: CleanupGoal
    parent: Site
    common_fields: true
    fields:
      - name: site_id
        type: string
        source: input
        description: "FK -> Site.id; the parcel this goal applies to."
      - name: contaminant_code
        type: string
        source: input
        description: Analyte the goal governs; the pair (site_id, contaminant_code, media) is unique — re-deriving upserts the existing row and bumps its version.
      - name: media
        type: enum
        source: input
        description: Media the goal governs.
        constraints: "one of SOIL, GROUNDWATER, SOIL_VAPOR"
      - name: screening_level_ugl
        type: number
        source: input
        description: Regulatory screening level used as the risk basis.
        constraints: "> 0"
      - name: basis
        type: enum
        source: input
        description: UNRESTRICTED forces the RESIDENTIAL exposure multiplier and credits no controls; RESTRICTED uses Site.intended_reuse and credits control_credit_type.
        constraints: "one of UNRESTRICTED, RESTRICTED"
      - name: control_credit_type
        type: enum
        source: input
        description: Control whose exposure interruption is credited; required when basis == RESTRICTED, must be null when basis == UNRESTRICTED.
        default: null
        constraints: "one of VAPOR_MITIGATION, ENGINEERED_CAP, GW_USE_RESTRICTION, DEED_RESTRICTION"
      - name: contaminant_count_in_media
        type: integer
        source: computed
        description: Distinct contaminant_code values with exceedance_factor > 1.0 in this media across the site's APPROVED phases; divides the cumulative risk budget.
      - name: goal_ugl
        type: number
        source: computed
        description: Risk-based cleanup goal in ug/L from §1.3 risk_based_cleanup_goal, 2 decimal places.
      - name: cumulative_cap_applied
        type: boolean
        source: computed
        description: True when the cumulative risk budget (not the scenario/control math) determined goal_ugl.
        default: false
      - name: attainment_status
        type: enum
        source: computed
        description: NOT_ATTAINED until four consecutive compliant SAMPLING events (§1.3 goal_attainment_streak).
        default: NOT_ATTAINED
        constraints: "one of NOT_ATTAINED, ATTAINED"
      - name: compliant_streak
        type: integer
        source: computed
        description: Consecutive compliant sampling results in chronological sample_date order; reset to 0 by any exceedance.
        default: 0

  # ---------------------------------------------------- LiabilityProtection ----
  - name: LiabilityProtection
    parent: Site
    common_fields: true
    fields:
      - name: site_id
        type: string
        source: input
        description: "FK -> Site.id; at most one LiabilityProtection row per site."
      - name: inquiry_state
        type: enum
        source: system
        description: All-Appropriate-Inquiries dimension of the parallel state machine.
        default: AAI_PENDING
        constraints: "one of AAI_PENDING, AAI_COMPLETE, AAI_STALE, AAI_DEFICIENT"
      - name: obligation_state
        type: enum
        source: computed
        description: Continuing-obligations dimension of the parallel state machine, derived by §1.3 bfpp_compliance.
        default: OBLIGATIONS_NONE
        constraints: "one of OBLIGATIONS_NONE, CURRENT, AT_RISK, LAPSED"
      - name: bfpp_status
        type: enum
        source: computed
        description: Bona fide prospective purchaser defence, derived from both dimensions plus Site.acquisition_status.
        default: NOT_ESTABLISHED
        constraints: "one of NOT_ESTABLISHED, ESTABLISHED, FORFEITED"
      - name: aai_phase_id
        type: string
        source: system
        description: Id of the APPROVED PHASE_I AssessmentPhase accepted as the AAI record; stored as a plain reference, set by POST /liability-protections/{id}/inquiry-completion.
        default: null
      - name: aai_report_date
        type: string
        source: system
        description: AAI report date accepted for this protection (ISO 8601 date).
        default: null
      - name: aai_expires_on
        type: string
        source: computed
        description: aai_report_date + 365 days; the compliance sweep stales the inquiry dimension after this date while the site is still UNDER_CONTRACT.
        default: null
      - name: obligations_total_weight
        type: integer
        source: computed
        description: "Conserved quantity: sum of §1.3 OBLIGATION_WEIGHTS over every ContinuingObligation on this protection."
        default: 0
      - name: current_weight
        type: integer
        source: computed
        description: Weight of obligations with status == CURRENT.
        default: 0
      - name: satisfied_weight
        type: integer
        source: computed
        description: Weight of obligations with status == SATISFIED.
        default: 0
      - name: at_risk_weight
        type: integer
        source: computed
        description: Weight of obligations with status == AT_RISK.
        default: 0
      - name: lapsed_weight
        type: integer
        source: computed
        description: Weight of obligations with status == LAPSED.
        default: 0
      - name: compliance_pct
        type: number
        source: computed
        description: Weighted compliance fraction from §1.3 bfpp_compliance, 4 decimal places.
        default: 1.0

  # --------------------------------------------------- ContinuingObligation ----
  - name: ContinuingObligation
    parent: LiabilityProtection
    common_fields: true
    fields:
      - name: liability_protection_id
        type: string
        source: input
        description: "FK -> LiabilityProtection.id; the BFPP defence this duty hangs off."
      - name: obligation_category
        type: enum
        source: input
        description: Statutory continuing-obligation family; REASONABLE_STEPS and LAND_USE_RESTRICTION_COMPLIANCE are defence-critical (a lapse forfeits BFPP).
        constraints: "one of REASONABLE_STEPS, LAND_USE_RESTRICTION_COMPLIANCE, ACCESS_AND_COOPERATION, INSTITUTIONAL_CONTROL_MAINTENANCE, NOTIFICATION"
      - name: description
        type: string
        source: input
        description: Free-text duty description recorded in the enrollment file.
        constraints: 1..400 chars
      - name: due_date
        type: string
        source: input
        description: Date the current certification period closes (ISO 8601 date).
      - name: recurrence_days
        type: integer
        source: input
        description: Days added to due_date when a certification is accepted, opening the next period.
        constraints: ">= 30"
      - name: imposed_by_user_id
        type: string
        source: system
        description: X-User-ID of the StateAgencyReviewer who imposed the duty; may not equal the reviewer who voids a certification (segregation of duties).
      - name: status
        type: enum
        source: system
        description: Certification lifecycle (§1.2 ContinuingObligation).
        default: CURRENT
        constraints: "one of CURRENT, AT_RISK, SATISFIED, LAPSED"
      - name: certified_at
        type: datetime
        source: system
        description: Logical-clock timestamp of the accepted certification for the open period; null when not SATISFIED.
        default: null
      - name: certification_count
        type: integer
        source: computed
        description: Number of accepted certifications not since voided.
        default: 0
      - name: prior_due_date
        type: string
        source: system
        description: due_date as it stood before the most recent accepted certification; restored verbatim when that certification is voided.
        default: null

  # --------------------------------------------------------- VcpEnrollment ----
  - name: VcpEnrollment
    parent: Site
    common_fields: true
    fields:
      - name: site_id
        type: string
        source: input
        description: "FK -> Site.id; the parcel enrolled in the voluntary cleanup program."
      - name: program_track
        type: enum
        source: input
        description: RESTRICTED_CLOSURE permits engineering/institutional controls in the remedy; UNRESTRICTED_CLOSURE forbids credited controls.
        constraints: "one of UNRESTRICTED_CLOSURE, RESTRICTED_CLOSURE"
      - name: applicant_statement
        type: string
        source: input
        description: Redeveloper's narrative of the intended reuse and remedy concept.
        constraints: 1..600 chars
      - name: status
        type: enum
        source: system
        description: Enrollment lifecycle (§1.2 VcpEnrollment).
        default: APPLIED
        constraints: "one of APPLIED, ELIGIBILITY_REVIEW, ENROLLED, REMEDY_APPROVED, IMPLEMENTATION, COMPLETION_REVIEW, CLOSED, REJECTED, WITHDRAWN"
      - name: enrolled_on
        type: string
        source: system
        description: Logical-clock date the enrollment was accepted; null before ENROLLED.
        default: null
      - name: eligibility_decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the StateAgencyReviewer who decided eligibility.
        default: null
      - name: completion_requested_at
        type: datetime
        source: system
        description: Logical-clock timestamp of the most recent completion request; null when never requested.
        default: null
      - name: reverted_completion_count
        type: integer
        source: computed
        description: Number of times a COMPLETION_REVIEW was pushed back to IMPLEMENTATION by a control impairment cascade.
        default: 0

  # --------------------------------------------------- RemedialActionPlan ----
  - name: RemedialActionPlan
    parent: VcpEnrollment
    common_fields: true
    fields:
      - name: vcp_enrollment_id
        type: string
        source: input
        description: "FK -> VcpEnrollment.id; the enrollment this plan is filed under."
      - name: site_id
        type: string
        source: input
        description: "FK -> Site.id; denormalised parcel reference, must equal the enrollment's site_id."
      - name: remedy_narrative
        type: string
        source: input
        description: Selected remedy description.
        constraints: 1..600 chars
      - name: basis_assessment_phase_id
        type: string
        source: input
        description: Id of the APPROVED PHASE_II or SUPPLEMENTAL AssessmentPhase whose delineation supports the remedy; stored as a plain reference and validated at submit.
      - name: years_to_construction_start
        type: integer
        source: input
        description: Whole years between approval and construction mobilisation; drives DESIGN-basis escalation.
        constraints: ">= 0 and <= 10"
      - name: cost_lines
        type: array
        source: input
        description: "Ordered array of cost line objects: { cost_category (one of EXCAVATION_DISPOSAL, GW_TREATMENT, VAPOR_MITIGATION, MONITORING, OVERSIGHT), media (SOIL|GROUNDWATER|SOIL_VAPOR), quantity (number > 0), unit_cost_cents (integer > 0) }. Evaluated in array order; each line is rounded to whole cents before summing."
        constraints: 1..12 elements
      - name: direct_cost_cents
        type: integer
        source: computed
        description: Sum of per-line rounded costs (§1.3 remediation_cost_estimate).
      - name: escalation_cents
        type: integer
        source: computed
        description: Escalation component under the DESIGN basis.
      - name: contingency_pct
        type: number
        source: computed
        description: DESIGN-basis contingency rate actually applied, 2 decimal places.
      - name: contingency_cents
        type: integer
        source: computed
        description: Contingency component under the DESIGN basis.
      - name: oversight_cents
        type: integer
        source: computed
        description: Agency oversight component, capped by OVERSIGHT_CAP_CENTS.
      - name: total_estimate_cents
        type: integer
        source: computed
        description: DESIGN-basis total remediation cost estimate.
      - name: total_funding_need_cents
        type: integer
        source: computed
        description: total_estimate_cents plus the premium_cents of every CostCapPolicy on this plan whose status == BOUND. Never feeds back into the premium calculation (§1.3 cost_cap_premium pins the order).
      - name: status
        type: enum
        source: system
        description: Plan lifecycle (§1.2 RemedialActionPlan).
        default: DRAFT
        constraints: "one of DRAFT, SUBMITTED, UNDER_TECHNICAL_REVIEW, PUBLIC_COMMENT, REVISION_REQUESTED, APPROVED, WITHDRAWN"
      - name: technical_review_state
        type: enum
        source: system
        description: Technical branch of the fork; PASSED is required before the public-comment branch may close.
        default: NOT_STARTED
        constraints: "one of NOT_STARTED, PASSED"
      - name: public_comment_state
        type: enum
        source: system
        description: Public-participation branch of the fork.
        default: NOT_STARTED
        constraints: "one of NOT_STARTED, OPEN, CLOSED"
      - name: public_comment_count
        type: integer
        source: system
        description: Comments logged when the comment period closed.
        default: 0
      - name: revision_round
        type: integer
        source: computed
        description: Number of REVISION_REQUESTED decisions issued on this plan; the third one is refused.
        default: 0
      - name: pinned_cleanup_goal_versions
        type: array
        source: computed
        description: "Junction array captured at submit: one { cleanup_goal_id, pinned_version } object per CleanupGoal on the site, ordered by the goal's created_at ASC. Approval re-validates every pin."
        default: []
      - name: approved_by_user_id
        type: string
        source: system
        description: X-User-ID of the StateAgencyReviewer who approved the plan; may not issue the site's NFA letter.
        default: null
      - name: approved_at
        type: datetime
        source: system
        description: Logical-clock timestamp of approval; null before APPROVED.
        default: null

  # -------------------------------------------------------- CostCapPolicy ----
  - name: CostCapPolicy
    parent: RemedialActionPlan
    common_fields: true
    fields:
      - name: remedial_action_plan_id
        type: string
        source: input
        description: "FK -> RemedialActionPlan.id; the plan whose cost overrun is insured."
      - name: insurer_party_id
        type: string
        source: input
        description: "FK -> Party.id; must be a Party with party_type == INSURER and equal X-User-ID for the Insurer role."
      - name: policy_reference
        type: string
        source: input
        description: Carrier's policy reference string.
        constraints: 1..64 chars
      - name: term_years
        type: integer
        source: input
        description: Policy term in years.
        constraints: ">= 1 and <= 10"
      - name: underwriting_estimate_cents
        type: integer
        source: computed
        description: UNDERWRITING-variant remediation estimate (§1.3 remediation_cost_estimate variant underwriting_basis) recomputed from the plan's cost_lines at quote time.
      - name: attachment_point_cents
        type: integer
        source: computed
        description: round_half_up(underwriting_estimate_cents * ATTACHMENT_FACTOR).
      - name: buffer_layer_cents
        type: integer
        source: computed
        description: attachment_point_cents - underwriting_estimate_cents; the self-funded buffer between the estimate and the cap attachment.
      - name: limit_cents
        type: integer
        source: computed
        description: Cap limit derived from the pre-premium underwriting estimate and rounded up to LIMIT_ROUNDING_STEP_CENTS.
      - name: rate_applied
        type: number
        source: computed
        description: Rate tier selected from limit_cents / underwriting_estimate_cents, 3 decimal places.
      - name: premium_cents
        type: integer
        source: computed
        description: Premium including broker fee, floored at MIN_PREMIUM_CENTS (§1.3 cost_cap_premium).
      - name: status
        type: enum
        source: system
        description: Placement lifecycle (§1.2 CostCapPolicy).
        default: QUOTED
        constraints: "one of QUOTED, BOUND, SUPERSEDED, CANCELLED"
      - name: bound_at
        type: datetime
        source: system
        description: Logical-clock timestamp the policy was bound; null while QUOTED.
        default: null

  # ----------------------------------------------------------- SiteControl ----
  - name: SiteControl
    parent: Site
    common_fields: true
    fields:
      - name: site_id
        type: string
        source: input
        description: "FK -> Site.id; the parcel the control protects."
      - name: remedial_action_plan_id
        type: string
        source: input
        description: "FK -> RemedialActionPlan.id; the plan that specifies this control."
      - name: control_type
        type: enum
        source: input
        description: Engineering or institutional control mechanism.
        constraints: "one of VAPOR_MITIGATION, ENGINEERED_CAP, GW_USE_RESTRICTION, DEED_RESTRICTION"
      - name: control_class
        type: enum
        source: computed
        description: ENGINEERING for VAPOR_MITIGATION and ENGINEERED_CAP; INSTITUTIONAL for GW_USE_RESTRICTION and DEED_RESTRICTION. Only ENGINEERING controls are subject to the sub-area coverage-overlap rule.
        constraints: "one of ENGINEERING, INSTITUTIONAL"
      - name: sub_area_code
        type: string
        source: input
        description: Parcel sub-area the control covers (e.g. BLDG-A-SLAB).
        constraints: 1..32 chars
      - name: coverage_from
        type: string
        source: input
        description: First day of coverage (ISO 8601 date), inclusive.
      - name: coverage_to
        type: string
        source: input
        description: Last day of coverage (ISO 8601 date), inclusive; must be >= coverage_from.
      - name: inspection_interval_days
        type: integer
        source: input
        description: Maximum days between operation certifications.
        constraints: ">= 30 and <= 730"
      - name: status
        type: enum
        source: system
        description: Control lifecycle (§1.2 SiteControl).
        default: PROPOSED
        constraints: "one of PROPOSED, APPROVED, OPERATING, IMPAIRED, DECOMMISSIONED"
      - name: last_certified_on
        type: string
        source: system
        description: Date of the most recent PASS operation certification; null when never certified.
        default: null
      - name: next_certification_due_on
        type: string
        source: computed
        description: last_certified_on + inspection_interval_days, or coverage_from + inspection_interval_days when never certified.
      - name: impaired_since
        type: string
        source: system
        description: Date the control entered IMPAIRED; null otherwise.
        default: null
      - name: impairment_count
        type: integer
        source: computed
        description: Number of times this control has entered IMPAIRED.
        default: 0

  # ---------------------------------------------------------- FundingAward ----
  - name: FundingAward
    parent: Site
    common_fields: true
    fields:
      - name: site_id
        type: string
        source: input
        description: "FK -> Site.id; the parcel the funding is assembled for."
      - name: program_code
        type: string
        source: input
        description: Funding program identifier (e.g. EPA-CLEANUP-GRANT, STATE-BROWNFIELD-CREDIT).
        constraints: 1..48 chars
      - name: funding_kind
        type: enum
        source: input
        description: Grants disburse cash; tax credits offset liability but obey the same waterfall.
        constraints: "one of GRANT, TAX_CREDIT"
      - name: program_priority
        type: integer
        source: input
        description: Waterfall order key; lower fills first, with created_at ASC as the tie-break.
        constraints: ">= 1 and <= 99"
      - name: max_award_cents
        type: integer
        source: input
        description: Program ceiling for this award.
        constraints: "> 0"
      - name: max_share_pct
        type: number
        source: input
        description: Maximum fraction of the eligible cost base this program will cover.
        constraints: "> 0 and <= 1"
      - name: match_requirement_pct
        type: number
        source: input
        description: Local match the redeveloper must contribute against the allocated amount.
        constraints: ">= 0 and <= 1"
      - name: eligible_cost_categories
        type: array
        source: input
        description: Cost categories of the plan's cost_lines this program will pay for; each element is one of EXCAVATION_DISPOSAL, GW_TREATMENT, VAPOR_MITIGATION, MONITORING, OVERSIGHT.
        constraints: 1..5 unique elements
      - name: eligibility_documents
        type: array
        source: input
        description: Document codes filed with the application; each element is one of SITE_CONTROL_EVIDENCE, BFPP_CERTIFICATION, PHASE_II_REPORT, COST_ESTIMATE, MATCH_COMMITMENT.
        default: []
      - name: status
        type: enum
        source: system
        description: Award lifecycle (§1.2 FundingAward).
        default: APPLIED
        constraints: "one of APPLIED, AWARDED, DENIED, RESCINDED"
      - name: decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the StateAgencyReviewer who decided the application.
        default: null
      - name: allocated_cents
        type: integer
        source: computed
        description: Amount this award contributes under §1.3 funding_assembly_waterfall as of the last assembly evaluation; 0 unless status == AWARDED.
        default: 0

  # ---------------------------------------------------- NoFurtherActionLetter ----
  - name: NoFurtherActionLetter
    parent: VcpEnrollment
    common_fields: true
    fields:
      - name: site_id
        type: string
        source: input
        description: "FK -> Site.id; the parcel receiving closure."
      - name: vcp_enrollment_id
        type: string
        source: input
        description: "FK -> VcpEnrollment.id; the enrollment being closed out."
      - name: requested_scope
        type: enum
        source: input
        description: Closure scope requested by the redeveloper.
        constraints: "one of UNRESTRICTED, RESTRICTED_WITH_CONTROLS"
      - name: status
        type: enum
        source: system
        description: Letter lifecycle (§1.2 NoFurtherActionLetter).
        default: DRAFT
        constraints: "one of DRAFT, ISSUED, ACCEPTED_BY_LENDER, REVOKED"
      - name: issued_on
        type: string
        source: system
        description: Logical-clock date of issuance; null while DRAFT.
        default: null
      - name: issued_by_user_id
        type: string
        source: system
        description: X-User-ID of the issuing StateAgencyReviewer; must differ from the plan's approved_by_user_id.
        default: null
      - name: controls_certified_count
        type: integer
        source: system
        description: Number of SiteControl rows in status OPERATING on the site at issuance.
        default: 0
      - name: accepted_by_lender_user_id
        type: string
        source: system
        description: Opaque X-User-ID of the Lender that accepted the letter; null until accepted.
        default: null
      - name: lender_reference
        type: string
        source: system
        description: Loan/investment file reference supplied at acceptance.
        default: null
      - name: revocation_reason
        type: enum
        source: system
        description: Why closure was withdrawn.
        default: null
        constraints: "one of BFPP_FORFEITED, CONTROL_FAILURE"
      - name: reissue_count
        type: integer
        source: computed
        description: Number of times this letter has been re-issued after a revocation.
        default: 0

  # ------------------------------------------------------------ Laboratory ----
  - name: Laboratory
    parent: null
    common_fields: true
    fields:
      - name: lab_name
        type: string
        source: input
        description: Accredited analytical laboratory name.
        constraints: 1..120 chars
      - name: certification_code
        type: string
        source: input
        description: State accreditation code.
        constraints: 1..32 chars
      - name: concurrent_capacity
        type: integer
        source: input
        description: Maximum number of monitoring events whose half-open analysis windows may overlap at any instant.
        constraints: ">= 1 and <= 10"

  # -------------------------------------------------------- MonitoringEvent ----
  - name: MonitoringEvent
    parent: Site
    common_fields: true
    fields:
      - name: site_id
        type: string
        source: input
        description: "FK -> Site.id; the parcel monitored."
      - name: laboratory_id
        type: string
        source: input
        description: "FK -> Laboratory.id; the lab whose analysis window is reserved."
      - name: cleanup_goal_id
        type: string
        source: input
        description: "FK -> CleanupGoal.id; the goal this result is compared against."
      - name: site_control_id
        type: string
        source: input
        description: "FK -> SiteControl.id; the control whose performance this event verifies. Null only for event_type == SAMPLING events not tied to a control."
        default: null
      - name: event_type
        type: enum
        source: input
        description: SAMPLING produces a concentration result; CONTROL_INSPECTION verifies control operation only.
        constraints: "one of SAMPLING, CONTROL_INSPECTION"
      - name: monitoring_period_code
        type: string
        source: input
        description: Reporting period label (e.g. 2027-Q1).
        constraints: 1..16 chars
      - name: sample_date
        type: string
        source: input
        description: Date the sample was collected (ISO 8601 date); the chronological replay key for §1.3 goal_attainment_streak.
      - name: window_start
        type: datetime
        source: input
        description: Start of the reserved laboratory analysis window (ISO 8601 UTC), inclusive.
      - name: window_end
        type: datetime
        source: input
        description: End of the reserved laboratory analysis window (ISO 8601 UTC), exclusive; must be > window_start.
      - name: status
        type: enum
        source: system
        description: Event lifecycle (§1.2 MonitoringEvent).
        default: SCHEDULED
        constraints: "one of SCHEDULED, REPORTED"
      - name: result_value_ugl
        type: number
        source: system
        description: Reported concentration in ug/L; null while SCHEDULED.
        default: null
      - name: result_status
        type: enum
        source: computed
        description: PENDING while SCHEDULED; COMPLIANT when result_value_ugl <= the goal's goal_ugl; EXCEEDANCE otherwise.
        default: PENDING
        constraints: "one of PENDING, COMPLIANT, EXCEEDANCE"
      - name: control_condition
        type: enum
        source: system
        description: Inspector's verdict recorded with the results; null for SAMPLING events.
        default: null
        constraints: "one of PASS, FAIL"

# -----------------------------------------------------------------------------
# §1.2 State Machine Table
# -----------------------------------------------------------------------------
state_machines:

  # --------------------------------------------- AssessmentPhase (cyclic) ----
  - entity: AssessmentPhase
    shape: branching_with_revision_cycle
    initial_state: DRAFT
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /assessment-phases/{id}/submit"
        actor: EnvironmentalConsultant
        preconditions:
          - "Site.cleanup_posture != FROZEN"
          - "findings_count >= 1"
          - "phase_type == PHASE_I implies aai_report_date is not null"
          - "acting X-User-ID == AssessmentPhase.consultant_party_id"
        side_effects:
          - "sets submitted_at to the logical clock"
          - "increments review_round by 1"
          - "recomputes max_exceedance_factor as the maximum ContaminantFinding.exceedance_factor on this phase"
          - "increments AssessmentPhase.version by 1"
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "system event: automatic, in the same request that produced SUBMITTED"
        actor: system
        preconditions: ["findings_count >= 1"]
        side_effects:
          - "no field changes other than status and updated_at; the phase is immediately queued for agency review"
        note: "Automatic follow-on transition — a submitted phase is never observable in SUBMITTED after the request completes."
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /assessment-phases/{id}/review with decision == APPROVE"
        actor: StateAgencyReviewer
        preconditions:
          - "Site.cleanup_posture != FROZEN"
          - "every ContaminantFinding on this phase with exceedance_factor > 1.0 has delineated == true when phase_type IN {PHASE_II, SUPPLEMENTAL} and delineation_complete == true"
        side_effects:
          - "records reviewed_by_user_id"
          - "cascade L1: when phase_type == PHASE_I, Site.delineation_status becomes SCREENED unless it is already DELINEATED"
          - "cascade L1: when phase_type IN {PHASE_II, SUPPLEMENTAL} and delineation_complete == true, Site.delineation_status becomes DELINEATED"
          - "when supersedes_phase_id is not null, the superseded phase keeps its own terminal status unchanged (history is preserved)"
          - "increments AssessmentPhase.version by 1 and Site.version by 1 when Site.delineation_status changed"
      - from: UNDER_REVIEW
        to: REVISION_REQUESTED
        trigger: "POST /assessment-phases/{id}/review with decision == REQUEST_REVISION"
        actor: StateAgencyReviewer
        preconditions:
          - "review_round <= 2 — a third revision request is refused with ERR_ASSESSMENT_REVISION_LIMIT"
        side_effects:
          - "records reviewed_by_user_id and review_comment"
          - "cascade L1: when phase_type == PHASE_I and this protection exists, LiabilityProtection.inquiry_state becomes AAI_DEFICIENT and the protection's bfpp_status is recomputed"
          - "increments AssessmentPhase.version by 1"
      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "POST /assessment-phases/{id}/submit"
        actor: EnvironmentalConsultant
        preconditions:
          - "Site.cleanup_posture != FROZEN"
          - "findings_count >= 1"
          - "review_round <= 2"
        side_effects:
          - "increments review_round by 1"
          - "recomputes max_exceedance_factor"
          - "increments AssessmentPhase.version by 1"
        note: "The revision cycle REVISION_REQUESTED -> SUBMITTED -> UNDER_REVIEW -> REVISION_REQUESTED is the non-linear loop on this entity."
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /assessment-phases/{id}/review with decision == REQUEST_REVISION when review_round == 3"
        actor: StateAgencyReviewer
        preconditions:
          - "review_round == 3"
        side_effects:
          - "records reviewed_by_user_id"
          - "cascade L1: when phase_type == PHASE_I and a LiabilityProtection exists on the site, its inquiry_state becomes AAI_DEFICIENT and bfpp_status is recomputed"
          - "increments AssessmentPhase.version by 1"
        note: "Terminal rejection: a rejected phase can only be replaced by a new SUPPLEMENTAL phase whose supersedes_phase_id points at it."

  # -------------------------- LiabilityProtection (parallel dimensions) ----
  - entity: LiabilityProtection
    shape: parallel_dimensions
    state_dimensions:
      inquiry_state: [AAI_PENDING, AAI_COMPLETE, AAI_STALE, AAI_DEFICIENT]
      obligation_state: [OBLIGATIONS_NONE, CURRENT, AT_RISK, LAPSED]
    derived_field: bfpp_status
    initial_state: AAI_PENDING
    terminal_states: [AAI_DEFICIENT]
    transitions:
      - from: AAI_PENDING
        to: AAI_COMPLETE
        dimension: inquiry_state
        trigger: "POST /liability-protections/{id}/inquiry-completion"
        actor: EnvironmentalConsultant
        preconditions:
          - "aai_phase_id references an AssessmentPhase on this site with phase_type == PHASE_I and status == APPROVED"
          - "aai_report_date <= (Site.acquisition_date when Site.acquisition_status == ACQUIRED else Site.planned_acquisition_date)"
          - "(reference_date - aai_report_date) <= 180 days, inclusive"
        side_effects:
          - "stores aai_phase_id, aai_report_date and aai_expires_on = aai_report_date + 365 days"
          - "recomputes bfpp_status per §1.3 bfpp_compliance"
          - "increments LiabilityProtection.version by 1"
      - from: AAI_STALE
        to: AAI_COMPLETE
        dimension: inquiry_state
        trigger: "POST /liability-protections/{id}/inquiry-completion with a fresher report"
        actor: EnvironmentalConsultant
        preconditions:
          - "same three preconditions as AAI_PENDING -> AAI_COMPLETE"
        side_effects:
          - "overwrites aai_phase_id, aai_report_date and aai_expires_on"
          - "recomputes bfpp_status"
          - "increments LiabilityProtection.version by 1"
        note: "Cycle inside the inquiry dimension: staleness is curable by refreshing the inquiry."
      - from: AAI_COMPLETE
        to: AAI_STALE
        dimension: inquiry_state
        trigger: "POST /compliance-sweeps (ops-run checkpoint)"
        actor: StateAgencyReviewer
        preconditions:
          - "Site.acquisition_status == UNDER_CONTRACT"
          - "sweep as_of_date > aai_expires_on"
        side_effects:
          - "recomputes bfpp_status, which becomes NOT_ESTABLISHED"
          - "increments LiabilityProtection.version by 1"
      - from: AAI_PENDING
        to: AAI_DEFICIENT
        dimension: inquiry_state
        trigger: "system event: cascade from an AssessmentPhase PHASE_I review decision REQUEST_REVISION or REJECT"
        actor: system
        preconditions: ["the reviewed phase has phase_type == PHASE_I and site_id == this protection's site_id"]
        side_effects:
          - "recomputes bfpp_status, which becomes NOT_ESTABLISHED"
          - "increments LiabilityProtection.version by 1"
        note: "AAI_DEFICIENT is terminal in the inquiry dimension: a deficient Phase I can only be cured by a superseding phase and a new protection record is not created, so the site cannot reach ESTABLISHED on this protection."
      - from: OBLIGATIONS_NONE
        to: CURRENT
        dimension: obligation_state
        trigger: "POST /liability-protections/{id}/continuing-obligations"
        actor: StateAgencyReviewer
        preconditions: ["Site.cleanup_posture != FROZEN"]
        side_effects:
          - "recomputes obligations_total_weight, current_weight and compliance_pct per §1.3 bfpp_compliance"
          - "recomputes bfpp_status"
          - "increments LiabilityProtection.version by 1"
      - from: CURRENT
        to: AT_RISK
        dimension: obligation_state
        trigger: "system event: cascade from a ContinuingObligation entering AT_RISK or LAPSED that drives compliance_pct below 0.85"
        actor: system
        preconditions: ["compliance_pct < 0.85", "no defence-critical obligation has status == LAPSED"]
        side_effects:
          - "recomputes the four weight buckets and compliance_pct"
          - "bfpp_status stays ESTABLISHED — AT_RISK is a warning, not a forfeiture"
          - "increments LiabilityProtection.version by 1"
      - from: AT_RISK
        to: CURRENT
        dimension: obligation_state
        trigger: "system event: cascade from POST /continuing-obligations/{id}/certify restoring compliance_pct to >= 0.85"
        actor: system
        preconditions: ["compliance_pct >= 0.85", "no defence-critical obligation has status == LAPSED"]
        side_effects:
          - "recomputes the four weight buckets and compliance_pct"
          - "increments LiabilityProtection.version by 1"
      - from: CURRENT
        to: LAPSED
        dimension: obligation_state
        trigger: "system event: cascade from a ContinuingObligation in category REASONABLE_STEPS or LAND_USE_RESTRICTION_COMPLIANCE entering LAPSED"
        actor: system
        preconditions: ["at least one obligation with obligation_category IN {REASONABLE_STEPS, LAND_USE_RESTRICTION_COMPLIANCE} has status == LAPSED"]
        side_effects:
          - "cascade L2: bfpp_status becomes FORFEITED"
          - "cascade L3: Site.cleanup_posture becomes FROZEN"
          - "increments LiabilityProtection.version by 1 and Site.version by 1"
      - from: AT_RISK
        to: LAPSED
        dimension: obligation_state
        trigger: "system event: same cascade as CURRENT -> LAPSED, from an AT_RISK protection"
        actor: system
        preconditions: ["at least one defence-critical obligation has status == LAPSED"]
        side_effects:
          - "cascade L2: bfpp_status becomes FORFEITED"
          - "cascade L3: Site.cleanup_posture becomes FROZEN"
          - "increments LiabilityProtection.version by 1 and Site.version by 1"
        note: "bfpp_status == FORFEITED is absorbing: no transition restores it, so the obligation dimension never leaves LAPSED."

  # --------------------------------------------------- ContinuingObligation ----
  - entity: ContinuingObligation
    shape: branching_with_compensation
    initial_state: CURRENT
    terminal_states: [LAPSED]
    transitions:
      - from: CURRENT
        to: SATISFIED
        trigger: "POST /continuing-obligations/{id}/certify"
        actor: Redeveloper
        preconditions:
          - "acting X-User-ID == Site.owner_party_id"
          - "Site.cleanup_posture != FROZEN"
          - "logical clock date <= due_date"
        side_effects:
          - "stores prior_due_date = due_date, then advances due_date by recurrence_days"
          - "sets certified_at and increments certification_count by 1"
          - "cascade L1: LiabilityProtection weight buckets and compliance_pct recomputed"
          - "increments ContinuingObligation.version by 1 and LiabilityProtection.version by 1"
      - from: AT_RISK
        to: SATISFIED
        trigger: "POST /continuing-obligations/{id}/certify"
        actor: Redeveloper
        preconditions:
          - "acting X-User-ID == Site.owner_party_id"
          - "Site.cleanup_posture != FROZEN"
          - "logical clock date <= due_date"
        side_effects:
          - "same as CURRENT -> SATISFIED"
          - "cascade L1: when compliance_pct returns to >= 0.85 the protection's obligation_state returns to CURRENT"
      - from: SATISFIED
        to: CURRENT
        trigger: "POST /continuing-obligations/{id}/void-certification (compensating action)"
        actor: StateAgencyReviewer
        preconditions:
          - "certification_count >= 1"
          - "acting X-User-ID != imposed_by_user_id (segregation of duties)"
          - "(prior_due_date - logical clock date) > 30 days"
        side_effects:
          - "restores due_date = prior_due_date, clears certified_at, sets prior_due_date to null"
          - "decrements certification_count by 1"
          - "cascade L1: LiabilityProtection weight buckets and compliance_pct recomputed to exactly their pre-certification values"
          - "increments ContinuingObligation.version by 1 and LiabilityProtection.version by 1"
      - from: SATISFIED
        to: AT_RISK
        trigger: "POST /continuing-obligations/{id}/void-certification when the restored period is within grace"
        actor: StateAgencyReviewer
        preconditions:
          - "certification_count >= 1"
          - "acting X-User-ID != imposed_by_user_id"
          - "0 <= (prior_due_date - logical clock date) <= 30 days"
        side_effects:
          - "same restoration as SATISFIED -> CURRENT"
          - "cascade L1: LiabilityProtection weight buckets and compliance_pct recomputed"
      - from: CURRENT
        to: AT_RISK
        trigger: "POST /compliance-sweeps (ops-run checkpoint)"
        actor: StateAgencyReviewer
        preconditions: ["0 <= (due_date - sweep as_of_date) <= 30 days"]
        side_effects:
          - "cascade L1: LiabilityProtection at_risk_weight/current_weight and compliance_pct recomputed"
          - "increments ContinuingObligation.version by 1"
      - from: CURRENT
        to: LAPSED
        trigger: "POST /compliance-sweeps (ops-run checkpoint)"
        actor: StateAgencyReviewer
        preconditions: ["sweep as_of_date > due_date"]
        side_effects:
          - "cascade L1: LiabilityProtection lapsed_weight and compliance_pct recomputed"
          - "cascade L2 when obligation_category is defence-critical: obligation_state becomes LAPSED and bfpp_status becomes FORFEITED"
          - "increments ContinuingObligation.version by 1"
      - from: AT_RISK
        to: LAPSED
        trigger: "POST /compliance-sweeps (ops-run checkpoint)"
        actor: StateAgencyReviewer
        preconditions: ["sweep as_of_date > due_date"]
        side_effects:
          - "same as CURRENT -> LAPSED"
      - from: SATISFIED
        to: AT_RISK
        trigger: "POST /compliance-sweeps (ops-run checkpoint)"
        actor: StateAgencyReviewer
        preconditions: ["0 <= (due_date - sweep as_of_date) <= 30 days"]
        side_effects:
          - "cascade L1: LiabilityProtection weight buckets and compliance_pct recomputed"
          - "increments ContinuingObligation.version by 1"
        note: "The next certification period has opened and is approaching its own due date."

  # ---------------------------------------------------------- VcpEnrollment ----
  - entity: VcpEnrollment
    shape: branching_with_revert
    initial_state: APPLIED
    terminal_states: [CLOSED, REJECTED, WITHDRAWN]
    transitions:
      - from: APPLIED
        to: ELIGIBILITY_REVIEW
        trigger: "system event: automatic, in the same request that created the enrollment"
        actor: system
        preconditions: ["Site.delineation_status != NONE"]
        side_effects: ["no field changes other than status and updated_at"]
        note: "Automatic follow-on transition on POST /vcp-enrollments."
      - from: ELIGIBILITY_REVIEW
        to: ENROLLED
        trigger: "POST /vcp-enrollments/{id}/eligibility-decision with decision == ENROLL"
        actor: StateAgencyReviewer
        preconditions:
          - "the site's LiabilityProtection exists and its inquiry_state == AAI_COMPLETE (cross-entity guard)"
          - "Site.cleanup_posture != FROZEN"
          - "program_track == RESTRICTED_CLOSURE implies Site.institutional_control_committed == true"
        side_effects:
          - "sets enrolled_on to the logical clock date and eligibility_decided_by_user_id"
          - "increments VcpEnrollment.version by 1"
      - from: ELIGIBILITY_REVIEW
        to: REJECTED
        trigger: "POST /vcp-enrollments/{id}/eligibility-decision with decision == REJECT"
        actor: StateAgencyReviewer
        preconditions: []
        side_effects:
          - "sets eligibility_decided_by_user_id"
          - "increments VcpEnrollment.version by 1"
      - from: ENROLLED
        to: REMEDY_APPROVED
        trigger: "system event: cascade from POST /remedial-action-plans/{id}/approve"
        actor: system
        preconditions: ["the approved plan's vcp_enrollment_id == this enrollment id"]
        side_effects:
          - "increments VcpEnrollment.version by 1"
      - from: REMEDY_APPROVED
        to: IMPLEMENTATION
        trigger: "system event: cascade from the first POST /site-controls/{id}/operation-certification with condition == PASS on this site"
        actor: system
        preconditions: ["the certified control's remedial_action_plan_id belongs to this enrollment"]
        side_effects:
          - "increments VcpEnrollment.version by 1"
      - from: IMPLEMENTATION
        to: COMPLETION_REVIEW
        trigger: "POST /vcp-enrollments/{id}/completion-request"
        actor: Redeveloper
        preconditions:
          - "acting X-User-ID == Site.owner_party_id"
          - "Site.cleanup_posture == OPEN"
          - "every CleanupGoal on the site has attainment_status == ATTAINED"
          - "every SiteControl on this enrollment's approved plan has status == OPERATING"
        side_effects:
          - "sets completion_requested_at"
          - "increments VcpEnrollment.version by 1"
      - from: COMPLETION_REVIEW
        to: IMPLEMENTATION
        trigger: "system event: cascade from a SiteControl entering IMPAIRED"
        actor: system
        preconditions: ["the impaired control's remedial_action_plan_id belongs to this enrollment"]
        side_effects:
          - "increments reverted_completion_count by 1"
          - "increments VcpEnrollment.version by 1"
        note: "Revert edge — completion review is not a terminal commitment while controls can fail."
      - from: COMPLETION_REVIEW
        to: CLOSED
        trigger: "system event: cascade from POST /nfa-letters/{id}/issue"
        actor: system
        preconditions: ["the issued letter's vcp_enrollment_id == this enrollment id"]
        side_effects:
          - "increments VcpEnrollment.version by 1"
      - from: ENROLLED
        to: WITHDRAWN
        trigger: "POST /vcp-enrollments/{id}/withdraw"
        actor: Redeveloper
        preconditions:
          - "acting X-User-ID == Site.owner_party_id"
          - "no RemedialActionPlan on this enrollment has status == APPROVED"
        side_effects:
          - "cascade L1: every RemedialActionPlan on this enrollment with status IN {DRAFT, SUBMITTED, UNDER_TECHNICAL_REVIEW, PUBLIC_COMMENT, REVISION_REQUESTED} becomes WITHDRAWN"
          - "cascade L2: every CostCapPolicy on those plans with status == QUOTED becomes CANCELLED"
          - "increments VcpEnrollment.version by 1"

  # ------------------------- RemedialActionPlan (fork-join + revision cycle) ----
  - entity: RemedialActionPlan
    shape: fork_join_with_revision_cycle
    initial_state: DRAFT
    terminal_states: [APPROVED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /remedial-action-plans/{id}/submit"
        actor: EnvironmentalConsultant
        preconditions:
          - "Site.cleanup_posture != FROZEN"
          - "VcpEnrollment.status == ENROLLED"
          - "basis_assessment_phase_id references an AssessmentPhase on the same site with phase_type IN {PHASE_II, SUPPLEMENTAL}, status == APPROVED and delineation_complete == true"
          - "at least one CleanupGoal exists on the site"
        side_effects:
          - "fork: technical_review_state becomes NOT_STARTED and public_comment_state becomes OPEN in the same request"
          - "pins pinned_cleanup_goal_versions = one { cleanup_goal_id, pinned_version } object per CleanupGoal on the site, ordered by the goal's created_at ASC"
          - "recomputes direct_cost_cents, escalation_cents, contingency_pct, contingency_cents, oversight_cents, total_estimate_cents and total_funding_need_cents per §1.3 remediation_cost_estimate (DESIGN variant)"
          - "increments RemedialActionPlan.version by 1"
      - from: SUBMITTED
        to: UNDER_TECHNICAL_REVIEW
        trigger: "system event: automatic, in the same request that produced SUBMITTED"
        actor: system
        preconditions: ["public_comment_state == OPEN"]
        side_effects: ["no field changes other than status and updated_at"]
        note: "Automatic follow-on transition; the two branches now advance independently."
      - from: UNDER_TECHNICAL_REVIEW
        to: PUBLIC_COMMENT
        trigger: "POST /remedial-action-plans/{id}/technical-review with decision == PASS"
        actor: StateAgencyReviewer
        preconditions:
          - "Site.cleanup_posture != FROZEN"
          - "every CleanupGoal on the site with basis == RESTRICTED has goal_ugl >= the site's applicable screening_level_ugl for that analyte/media pair"
        side_effects:
          - "technical_review_state becomes PASSED"
          - "branch-specific effect: no cost figures are touched"
          - "increments RemedialActionPlan.version by 1"
        note: "Technical branch of the fork. Divergent side-effect set from the public-comment branch."
      - from: PUBLIC_COMMENT
        to: PUBLIC_COMMENT
        trigger: "POST /remedial-action-plans/{id}/public-comment-close"
        actor: StateAgencyReviewer
        preconditions:
          - "public_comment_state == OPEN"
          - "technical_review_state == PASSED"
        side_effects:
          - "public_comment_state becomes CLOSED and public_comment_count is stored from the request"
          - "branch-specific effect: no technical fields are touched"
          - "increments RemedialActionPlan.version by 1"
        note: "Public-participation branch of the fork; status stays PUBLIC_COMMENT while the branch dimension advances OPEN -> CLOSED."
      - from: PUBLIC_COMMENT
        to: APPROVED
        trigger: "POST /remedial-action-plans/{id}/approve"
        actor: StateAgencyReviewer
        preconditions:
          - "Site.cleanup_posture != FROZEN"
          - "join: technical_review_state == PASSED and public_comment_state == CLOSED"
          - "for every CleanupGoal with basis == RESTRICTED, a SiteControl with the same control_type as the goal's control_credit_type exists on this plan with status IN {PROPOSED, APPROVED, OPERATING}"
          - "every entry of pinned_cleanup_goal_versions matches the referenced CleanupGoal's current version"
        side_effects:
          - "sets approved_by_user_id and approved_at"
          - "cascade L1: every SiteControl on this plan with status == PROPOSED becomes APPROVED"
          - "cascade L1: VcpEnrollment ENROLLED -> REMEDY_APPROVED"
          - "cascade L1: every other RemedialActionPlan on the same enrollment with status IN {DRAFT, REVISION_REQUESTED} becomes WITHDRAWN"
          - "increments RemedialActionPlan.version by 1, VcpEnrollment.version by 1 and each affected SiteControl.version by 1"
      - from: UNDER_TECHNICAL_REVIEW
        to: REVISION_REQUESTED
        trigger: "POST /remedial-action-plans/{id}/technical-review with decision == REQUEST_REVISION"
        actor: StateAgencyReviewer
        preconditions:
          - "revision_round <= 1 — a third revision request is refused with ERR_PLAN_REVISION_LIMIT"
        side_effects:
          - "increments revision_round by 1"
          - "public_comment_state resets to NOT_STARTED and public_comment_count resets to 0 (the comment period is void)"
          - "clears pinned_cleanup_goal_versions to an empty array"
          - "cascade L1: every CostCapPolicy on this plan with status == QUOTED becomes CANCELLED"
          - "increments RemedialActionPlan.version by 1 and each affected CostCapPolicy.version by 1"
      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "POST /remedial-action-plans/{id}/submit"
        actor: EnvironmentalConsultant
        preconditions:
          - "Site.cleanup_posture != FROZEN"
          - "VcpEnrollment.status == ENROLLED"
          - "revision_round <= 2"
        side_effects:
          - "re-forks: technical_review_state NOT_STARTED, public_comment_state OPEN"
          - "re-pins pinned_cleanup_goal_versions from the goals' current versions"
          - "recomputes every cost field per §1.3 remediation_cost_estimate (DESIGN variant)"
          - "increments RemedialActionPlan.version by 1"
        note: "Revision cycle closes the loop: REVISION_REQUESTED -> SUBMITTED -> UNDER_TECHNICAL_REVIEW."

  # --------------------------------------------------------- CostCapPolicy ----
  - entity: CostCapPolicy
    shape: linear_with_supersede
    initial_state: QUOTED
    terminal_states: [SUPERSEDED, CANCELLED]
    transitions:
      - from: QUOTED
        to: BOUND
        trigger: "POST /cost-cap-policies/{id}/bind"
        actor: Insurer
        preconditions:
          - "acting X-User-ID == insurer_party_id"
          - "RemedialActionPlan.status == APPROVED"
          - "attachment_point_cents >= round_half_up(RemedialActionPlan.total_estimate_cents * 1.05)"
          - "limit_cents >= MIN_LIMIT_CENTS (25000000)"
        side_effects:
          - "sets bound_at to the logical clock"
          - "cascade L1: RemedialActionPlan.total_funding_need_cents becomes total_estimate_cents + premium_cents"
          - "cascade L2: every FundingAward on the site with status == AWARDED has allocated_cents re-derived by §1.3 funding_assembly_waterfall against the new need"
          - "increments CostCapPolicy.version by 1 and RemedialActionPlan.version by 1"
      - from: QUOTED
        to: SUPERSEDED
        trigger: "system event: cascade from POST /cost-cap-policies creating a newer quote on the same plan"
        actor: system
        preconditions: ["the prior policy on this plan has status == QUOTED"]
        side_effects: ["increments CostCapPolicy.version by 1"]
      - from: QUOTED
        to: CANCELLED
        trigger: "system event: cascade from a RemedialActionPlan REVISION_REQUESTED decision or a VcpEnrollment withdrawal"
        actor: system
        preconditions: ["status == QUOTED"]
        side_effects: ["increments CostCapPolicy.version by 1"]

  # ------------------------------------------------- SiteControl (cyclic) ----
  - entity: SiteControl
    shape: cyclic_impairment_loop
    initial_state: PROPOSED
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "system event: cascade from POST /remedial-action-plans/{id}/approve"
        actor: system
        preconditions: ["remedial_action_plan_id == the approved plan's id"]
        side_effects:
          - "recomputes next_certification_due_on = coverage_from + inspection_interval_days"
          - "increments SiteControl.version by 1"
      - from: APPROVED
        to: OPERATING
        trigger: "POST /site-controls/{id}/operation-certification with condition == PASS"
        actor: Redeveloper
        preconditions:
          - "acting X-User-ID == Site.owner_party_id"
          - "Site.cleanup_posture != FROZEN"
          - "certification date is within [coverage_from, coverage_to] inclusive"
        side_effects:
          - "sets last_certified_on and recomputes next_certification_due_on = last_certified_on + inspection_interval_days"
          - "cascade L1: VcpEnrollment REMEDY_APPROVED -> IMPLEMENTATION on the first PASS for the plan"
          - "increments SiteControl.version by 1"
      - from: OPERATING
        to: OPERATING
        trigger: "POST /site-controls/{id}/operation-certification with condition == PASS"
        actor: Redeveloper
        preconditions:
          - "acting X-User-ID == Site.owner_party_id"
          - "Site.cleanup_posture != FROZEN"
          - "certification date is within [coverage_from, coverage_to] inclusive"
        side_effects:
          - "advances last_certified_on and next_certification_due_on"
          - "increments SiteControl.version by 1"
      - from: OPERATING
        to: IMPAIRED
        trigger: "POST /site-controls/{id}/operation-certification with condition == FAIL"
        actor: Redeveloper
        preconditions: ["acting X-User-ID == Site.owner_party_id"]
        side_effects:
          - "sets impaired_since to the logical clock date and increments impairment_count by 1"
          - "cascade L2: Site.impaired_control_count is incremented and Site.cleanup_posture becomes RESTRICTED unless it is already FROZEN"
          - "cascade L3: VcpEnrollment COMPLETION_REVIEW -> IMPLEMENTATION when this control belongs to that enrollment's approved plan"
          - "increments SiteControl.version by 1 and Site.version by 1"
      - from: OPERATING
        to: IMPAIRED
        trigger: "system event: cascade from POST /monitoring-events/{id}/results whose result_status == EXCEEDANCE"
        actor: system
        preconditions: ["the reporting MonitoringEvent's site_control_id == this control id"]
        side_effects:
          - "sets impaired_since and increments impairment_count by 1"
          - "cascade L3: Site.impaired_control_count incremented and Site.cleanup_posture becomes RESTRICTED unless already FROZEN"
          - "cascade L4: VcpEnrollment COMPLETION_REVIEW -> IMPLEMENTATION"
          - "cascade L4: every NoFurtherActionLetter on the site with status IN {ISSUED, ACCEPTED_BY_LENDER} becomes REVOKED with revocation_reason CONTROL_FAILURE"
          - "increments SiteControl.version by 1 and Site.version by 1"
      - from: IMPAIRED
        to: OPERATING
        trigger: "POST /site-controls/{id}/operation-certification with condition == PASS"
        actor: Redeveloper
        preconditions:
          - "acting X-User-ID == Site.owner_party_id"
          - "Site.cleanup_posture != FROZEN"
          - "certification date is within [coverage_from, coverage_to] inclusive"
        side_effects:
          - "clears impaired_since, sets last_certified_on, recomputes next_certification_due_on"
          - "cascade L1: Site.impaired_control_count decremented; Site.cleanup_posture returns to OPEN when impaired_control_count reaches 0 and the site's LiabilityProtection.bfpp_status != FORFEITED"
          - "increments SiteControl.version by 1 and Site.version by 1"
        note: "Cycle OPERATING -> IMPAIRED -> OPERATING: impairment is curable by a passing re-certification."
      - from: OPERATING
        to: DECOMMISSIONED
        trigger: "POST /site-controls/{id}/decommission"
        actor: StateAgencyReviewer
        preconditions:
          - "the site's CleanupGoal rows whose control_credit_type == this control_type all have attainment_status == ATTAINED"
          - "no NoFurtherActionLetter on the site has status == ACCEPTED_BY_LENDER with requested_scope == RESTRICTED_WITH_CONTROLS"
        side_effects:
          - "increments SiteControl.version by 1"

  # ----------------------------------------------------------- FundingAward ----
  - entity: FundingAward
    shape: branching_with_rescission
    initial_state: APPLIED
    terminal_states: [DENIED, RESCINDED]
    transitions:
      - from: APPLIED
        to: AWARDED
        trigger: "POST /funding-awards/{id}/decision with decision == AWARD"
        actor: StateAgencyReviewer
        preconditions:
          - "Site.cleanup_posture == OPEN"
          - "eligibility_documents contains every code required by §1.4 priority 40 for this funding_kind"
          - "a RemedialActionPlan with status == APPROVED exists on the site"
        side_effects:
          - "sets decided_by_user_id"
          - "cascade L1: allocated_cents for every AWARDED award on the site is re-derived by §1.3 funding_assembly_waterfall"
          - "increments FundingAward.version by 1"
      - from: APPLIED
        to: DENIED
        trigger: "POST /funding-awards/{id}/decision with decision == DENY"
        actor: StateAgencyReviewer
        preconditions: []
        side_effects:
          - "sets decided_by_user_id; allocated_cents stays 0"
          - "increments FundingAward.version by 1"
      - from: AWARDED
        to: RESCINDED
        trigger: "POST /funding-awards/{id}/decision with decision == RESCIND (compensating action)"
        actor: StateAgencyReviewer
        preconditions: ["status == AWARDED"]
        side_effects:
          - "sets allocated_cents to 0"
          - "cascade L1: allocated_cents for every remaining AWARDED award on the site is re-derived by §1.3 funding_assembly_waterfall, so sum(allocated) + unfunded_gap still equals total_funding_need_cents"
          - "increments FundingAward.version by 1"
      - from: AWARDED
        to: RESCINDED
        trigger: "system event: cascade from a NoFurtherActionLetter entering REVOKED"
        actor: system
        preconditions: ["the revoked letter's site_id == this award's site_id"]
        side_effects:
          - "sets allocated_cents to 0"
          - "cascade: the site's funding assembly is re-derived, raising unfunded_gap_cents"
          - "increments FundingAward.version by 1"

  # ------------------------------------------- NoFurtherActionLetter (cyclic) ----
  - entity: NoFurtherActionLetter
    shape: cyclic_revoke_reissue
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /nfa-letters/{id}/issue"
        actor: StateAgencyReviewer
        preconditions:
          - "Site.cleanup_posture == OPEN"
          - "VcpEnrollment.status == COMPLETION_REVIEW"
          - "the enrollment's APPROVED RemedialActionPlan exists and every SiteControl on it has status == OPERATING (cross-entity guard)"
          - "acting X-User-ID != that plan's approved_by_user_id (segregation of duties)"
          - "requested_scope == UNRESTRICTED implies every CleanupGoal on the site has basis == UNRESTRICTED"
        side_effects:
          - "sets issued_on, issued_by_user_id and controls_certified_count"
          - "cascade L1: VcpEnrollment COMPLETION_REVIEW -> CLOSED"
          - "increments NoFurtherActionLetter.version by 1 and VcpEnrollment.version by 1"
      - from: ISSUED
        to: ACCEPTED_BY_LENDER
        trigger: "POST /nfa-letters/{id}/lender-acceptance"
        actor: Lender
        preconditions:
          - "Site.cleanup_posture == OPEN"
          - "the site's LiabilityProtection.bfpp_status == ESTABLISHED"
        side_effects:
          - "stores accepted_by_lender_user_id and lender_reference"
          - "increments NoFurtherActionLetter.version by 1"
      - from: ISSUED
        to: REVOKED
        trigger: "system event: cascade from LiabilityProtection.bfpp_status becoming FORFEITED or a SiteControl entering IMPAIRED"
        actor: system
        preconditions: ["status IN {ISSUED, ACCEPTED_BY_LENDER}"]
        side_effects:
          - "sets revocation_reason to BFPP_FORFEITED or CONTROL_FAILURE"
          - "cascade L4/L5: every FundingAward on the site with status == AWARDED becomes RESCINDED"
          - "increments NoFurtherActionLetter.version by 1"
      - from: ACCEPTED_BY_LENDER
        to: REVOKED
        trigger: "system event: same cascade as ISSUED -> REVOKED"
        actor: system
        preconditions: ["status == ACCEPTED_BY_LENDER"]
        side_effects:
          - "sets revocation_reason; accepted_by_lender_user_id and lender_reference are preserved as history"
          - "cascade: every AWARDED FundingAward on the site becomes RESCINDED"
          - "increments NoFurtherActionLetter.version by 1"
      - from: REVOKED
        to: ISSUED
        trigger: "POST /nfa-letters/{id}/issue (re-issuance after cure)"
        actor: StateAgencyReviewer
        preconditions:
          - "Site.cleanup_posture == OPEN"
          - "revocation_reason == CONTROL_FAILURE — a BFPP_FORFEITED revocation is not curable"
          - "every SiteControl on the enrollment's APPROVED plan has status == OPERATING"
          - "acting X-User-ID != that plan's approved_by_user_id"
        side_effects:
          - "increments reissue_count by 1, refreshes issued_on and issued_by_user_id, clears revocation_reason"
          - "increments NoFurtherActionLetter.version by 1"
        note: "Cycle ISSUED -> REVOKED -> ISSUED; the lender acceptance is not restored automatically and must be re-obtained."

  # -------------------------------------------------------- MonitoringEvent ----
  - entity: MonitoringEvent
    shape: linear
    initial_state: SCHEDULED
    terminal_states: [REPORTED]
    transitions:
      - from: SCHEDULED
        to: REPORTED
        trigger: "POST /monitoring-events/{id}/results"
        actor: EnvironmentalConsultant
        preconditions:
          - "acting X-User-ID is a Party with party_type == CONSULTANT"
          - "logical clock >= window_start"
          - "event_type == SAMPLING implies result_value_ugl is supplied; event_type == CONTROL_INSPECTION implies control_condition is supplied"
        side_effects:
          - "stores result_value_ugl and/or control_condition"
          - "cascade L1: result_status becomes COMPLIANT when result_value_ugl <= CleanupGoal.goal_ugl, EXCEEDANCE otherwise"
          - "cascade L2: the referenced CleanupGoal's compliant_streak and attainment_status are recomputed per §1.3 goal_attainment_streak"
          - "cascade L2: when result_status == EXCEEDANCE and site_control_id is not null, that SiteControl OPERATING -> IMPAIRED"
          - "increments MonitoringEvent.version by 1 and CleanupGoal.version by 1"

  # ------------------------------------------------- Site (compound posture) ----
  - entity: Site
    shape: compound_posture
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: RESTRICTED
        trigger: "system event: cascade whenever impaired_control_count transitions from 0 to a positive value"
        actor: system
        preconditions: ["LiabilityProtection.bfpp_status != FORFEITED"]
        side_effects:
          - "gates POST /nfa-letters/{id}/issue, POST /nfa-letters/{id}/lender-acceptance, POST /vcp-enrollments/{id}/completion-request and POST /funding-awards/{id}/decision with decision == AWARD"
          - "increments Site.version by 1"
      - from: RESTRICTED
        to: OPEN
        trigger: "system event: cascade whenever impaired_control_count returns to 0"
        actor: system
        preconditions: ["LiabilityProtection.bfpp_status != FORFEITED"]
        side_effects: ["increments Site.version by 1"]
      - from: OPEN
        to: FROZEN
        trigger: "system event: cascade whenever LiabilityProtection.bfpp_status becomes FORFEITED"
        actor: system
        preconditions: ["bfpp_status == FORFEITED"]
        side_effects:
          - "gates every mutating child endpoint on the site except POST /compliance-sweeps, POST /continuing-obligations/{id}/void-certification and POST /_clock/set_current_utc"
          - "increments Site.version by 1"
      - from: RESTRICTED
        to: FROZEN
        trigger: "system event: same cascade as OPEN -> FROZEN"
        actor: system
        preconditions: ["bfpp_status == FORFEITED"]
        side_effects: ["increments Site.version by 1"]
        note: "FROZEN is absorbing because bfpp_status == FORFEITED is absorbing."

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC only)
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: plan-create-stale-enrollment
    parent_entity: VcpEnrollment
    write_endpoint: "POST /remedial-action-plans"
    occ_field: "expected_vcp_enrollment_version"
    description: |
      Creating a RemedialActionPlan against a VcpEnrollment whose version has
      advanced since the client last observed it is rejected. A new plan
      legitimately supersedes any prior DRAFT or REVISION_REQUESTED plan on the
      same enrollment (see §1.2 RemedialActionPlan APPROVED cascade), so the
      second create is not blocked by any state precondition; the stale
      enrollment version is the only signal that the client's view of the
      enrollment (including which plan is current) is out of date.
    error_id: ERR_STALE_ENROLLMENT_VERSION
    http_status: 412
  - rule_id: policy-quote-stale-plan
    parent_entity: RemedialActionPlan
    write_endpoint: "POST /cost-cap-policies"
    occ_field: "expected_remedial_action_plan_version"
    description: |
      Quoting a CostCapPolicy against a RemedialActionPlan whose version has
      advanced since the client last observed it is rejected. A fresh quote
      legitimately supersedes the prior QUOTED policy on the same plan, so the
      second quote would otherwise succeed; the stale plan version is what tells
      the server the underwriter priced against cost figures that have since
      been recomputed by a re-submit.
    error_id: ERR_STALE_PLAN_VERSION
    http_status: 412

# -----------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# -----------------------------------------------------------------------------
calculations:

  - name: risk_based_cleanup_goal
    trigger: "POST /sites/{id}/cleanup-goals (create or upsert of a CleanupGoal row)"
    algorithm: threshold
    formula: |
      # Evaluation order is pinned; rounding happens ONCE, at the end.
      scenario      = (basis == UNRESTRICTED) ? RESIDENTIAL : Site.intended_reuse
      scenario_goal = screening_level_ugl * SCENARIO_MULTIPLIER[scenario]
      credited      = scenario_goal * ((basis == RESTRICTED) ? CONTROL_CREDIT[control_credit_type] : 1.0)
      attenuated    = credited / MEDIA_ATTENUATION_DIVISOR[media]
      contaminant_count_in_media = count of DISTINCT ContaminantFinding.contaminant_code
            where finding.media == this media
              AND finding.exceedance_factor > 1.0
              AND finding.assessment_phase_id IN (AssessmentPhase rows with site_id == this site AND status == APPROVED)
      cumulative_cap = CUMULATIVE_RISK_BUDGET_UGL / max(1, contaminant_count_in_media)
      goal_ugl      = round_half_up(max(PRACTICAL_QUANT_FLOOR_UGL, min(attenuated, cumulative_cap)), 2)
      cumulative_cap_applied = (cumulative_cap < attenuated AND cumulative_cap > PRACTICAL_QUANT_FLOOR_UGL)
    input_set: |
      Findings are counted only from AssessmentPhase rows with status == APPROVED on this
      site (DRAFT / SUBMITTED / UNDER_REVIEW / REVISION_REQUESTED / REJECTED phases are
      excluded), and only findings whose exceedance_factor is strictly greater than 1.0
      participate in the distinct-analyte count. The count is over distinct
      contaminant_code values, so two wells with the same analyte count once.
    constants:
      SCENARIO_MULTIPLIER: { RESIDENTIAL: 1.0, RECREATIONAL: 2.5, COMMERCIAL: 3.5, INDUSTRIAL: 8.0 }
      MEDIA_ATTENUATION_DIVISOR: { SOIL: 1.0, GROUNDWATER: 1.0, SOIL_VAPOR: 0.03 }
      CONTROL_CREDIT: { VAPOR_MITIGATION: 10.0, ENGINEERED_CAP: 4.0, GW_USE_RESTRICTION: 6.0, DEED_RESTRICTION: 1.0 }
      CUMULATIVE_RISK_BUDGET_UGL: 500.0
      PRACTICAL_QUANT_FLOOR_UGL: 0.50
    precision: "goal_ugl: 2 decimal places, round_half_up, applied only to the final max/min result"
    variants:
      - name: unrestricted_basis
        when: "basis == UNRESTRICTED (closure with no reliance on controls)"
        difference: "Forces SCENARIO_MULTIPLIER[RESIDENTIAL] = 1.0 regardless of Site.intended_reuse and applies no CONTROL_CREDIT, so the goal is the strictest of the two."
      - name: restricted_basis
        when: "basis == RESTRICTED (closure relying on engineering/institutional controls)"
        difference: "Uses SCENARIO_MULTIPLIER[Site.intended_reuse] and multiplies by CONTROL_CREDIT[control_credit_type], which frequently pushes the value into the cumulative_cap so the cap — not the control credit — sets the goal."

  - name: remediation_cost_estimate
    trigger: "POST /remedial-action-plans/{id}/submit (DESIGN variant) and POST /cost-cap-policies (UNDERWRITING variant)"
    algorithm: tiered_pricing
    formula: |
      # PINNED ROUNDING ORDER: each cost line is rounded to whole cents FIRST,
      # then the rounded line values are summed. Summing the raw products and
      # rounding once at the end is WRONG and differs by whole cents.
      for each line in RemedialActionPlan.cost_lines, in array order:
          line_cents[i] = round_half_up(line.quantity * line.unit_cost_cents * MEDIA_FACTOR[line.media])
      direct_cost_cents = sum(line_cents)

      escalation_years  = (variant == DESIGN) ? RemedialActionPlan.years_to_construction_start
                                              : UNDERWRITING_ESCALATION_YEARS
      escalation_cents  = round_half_up(direct_cost_cents * ESCALATION_RATE_PER_YEAR * escalation_years)

      base_pct    = CONTINGENCY_TIER[AssessmentPhase(basis_assessment_phase_id).delineation_confidence]
      adder_pct   = (AssessmentPhase(basis_assessment_phase_id).max_exceedance_factor >= 10.0) ? 0.05 : 0.00
      contingency_pct = (variant == DESIGN) ? (base_pct + adder_pct)
                                            : max(base_pct + adder_pct, CONTINGENCY_UNDERWRITING_FLOOR)
      contingency_cents = round_half_up((direct_cost_cents + escalation_cents) * contingency_pct)

      subtotal_cents  = direct_cost_cents + escalation_cents + contingency_cents
      oversight_cents = min(round_half_up(subtotal_cents * OVERSIGHT_RATE), OVERSIGHT_CAP_CENTS)

      total = direct_cost_cents + escalation_cents + contingency_cents + oversight_cents
      # DESIGN variant writes RemedialActionPlan.total_estimate_cents;
      # UNDERWRITING variant writes CostCapPolicy.underwriting_estimate_cents.
    input_set: |
      Every element of RemedialActionPlan.cost_lines participates; there is no status
      filter because cost lines are immutable inputs supplied at plan creation. The
      contingency tier reads delineation_confidence and max_exceedance_factor from the
      single AssessmentPhase named by basis_assessment_phase_id (never from any other
      phase on the site).
    constants:
      MEDIA_FACTOR: { SOIL: 1.00, GROUNDWATER: 1.35, SOIL_VAPOR: 1.15 }
      ESCALATION_RATE_PER_YEAR: 0.042
      CONTINGENCY_TIER: { SCREENING: 0.35, PARTIAL: 0.20, FULL: 0.10 }
      CONTINGENCY_EXCEEDANCE_ADDER: 0.05
      CONTINGENCY_EXCEEDANCE_THRESHOLD: 10.0
      CONTINGENCY_UNDERWRITING_FLOOR: 0.25
      UNDERWRITING_ESCALATION_YEARS: 5
      OVERSIGHT_RATE: 0.065
      OVERSIGHT_CAP_CENTS: 4000000
    precision: "all money is integer cents; round_half_up at each pinned step (per line, escalation, contingency, oversight)"
    variants:
      - name: design_basis
        when: "computed on plan submit; stored on RemedialActionPlan"
        difference: "Escalates over years_to_construction_start and uses the delineation-confidence contingency tier as-is (no floor)."
      - name: underwriting_basis
        when: "computed on cost-cap quote; stored on CostCapPolicy.underwriting_estimate_cents"
        difference: "Escalates over a fixed 5 years and floors contingency at 25%, producing a strictly larger figure than the design basis for the same cost_lines whenever years_to_construction_start < 5 or the tier is below 25%."

  - name: cost_cap_premium
    trigger: "POST /cost-cap-policies (quote creation)"
    algorithm: tiered_pricing
    formula: |
      # CIRCULAR-LOOKING DEPENDENCY, ORDER PINNED:
      #   RemedialActionPlan.total_funding_need_cents = total_estimate_cents + premium_cents,
      #   and the limit looks like a function of the funding need. It is NOT.
      #   Step 1-4 below derive limit and premium from the PRE-PREMIUM
      #   underwriting_estimate_cents only. total_funding_need_cents is written
      #   afterwards (on bind) and never re-enters this calculation.
      1. underwriting_estimate_cents = remediation_cost_estimate(variant = UNDERWRITING)
      2. attachment_point_cents = round_half_up(underwriting_estimate_cents * ATTACHMENT_FACTOR)
         buffer_layer_cents     = attachment_point_cents - underwriting_estimate_cents
      3. limit_cents = ceil_to_step(round_half_up(underwriting_estimate_cents * LIMIT_SHARE_OF_ESTIMATE),
                                    LIMIT_ROUNDING_STEP_CENTS)
      4. limit_ratio  = limit_cents / underwriting_estimate_cents        # exact rational, not rounded
         rate_applied = (limit_ratio <= 0.35) ? 0.070
                      : (limit_ratio <= 0.60) ? 0.055
                      :                         0.045
         base_premium_cents = round_half_up(limit_cents * rate_applied)
         premium_cents      = max(MIN_PREMIUM_CENTS,
                                  round_half_up(base_premium_cents * (1 + BROKER_FEE_RATE)))
      5. on bind only: RemedialActionPlan.total_funding_need_cents
                       = RemedialActionPlan.total_estimate_cents + premium_cents
    input_set: |
      Reads the plan's cost_lines and its basis AssessmentPhase for the underwriting
      estimate. Only the CostCapPolicy row being created is written; prior QUOTED
      policies on the same plan are marked SUPERSEDED and their premium never enters
      total_funding_need_cents (only status == BOUND premiums do).
    constants:
      ATTACHMENT_FACTOR: 1.10
      LIMIT_SHARE_OF_ESTIMATE: 0.30
      LIMIT_ROUNDING_STEP_CENTS: 10000000
      RATE_TIER_LOW_RATIO: 0.35
      RATE_TIER_MID_RATIO: 0.60
      RATE_LOW: 0.070
      RATE_MID: 0.055
      RATE_HIGH: 0.045
      BROKER_FEE_RATE: 0.03
      MIN_PREMIUM_CENTS: 2500000
      MIN_LIMIT_CENTS: 25000000
    precision: "integer cents; rate_applied stored to 3 decimal places; limit_ratio compared unrounded"

  - name: funding_assembly_waterfall
    trigger: "GET /sites/{id}/funding-assembly, and as a side effect of POST /funding-awards/{id}/decision and POST /cost-cap-policies/{id}/bind"
    algorithm: waterfall_allocation
    formula: |
      need_cents = total_funding_need_cents of the site's RemedialActionPlan with
                   status == APPROVED; when the site has no APPROVED plan, need_cents = 0
      remaining  = need_cents
      allocations = []
      for award in FundingAward rows with site_id == this site AND status == AWARDED,
              ordered by program_priority ASC, then created_at ASC:      # never by id
          eligible_base_cents = sum(line_cents[i] for lines of the APPROVED plan whose
                                    cost_category IN award.eligible_cost_categories)
                                # line_cents are the PER-LINE ROUNDED values from
                                # remediation_cost_estimate (DESIGN variant)
          share_cap_cents = round_half_up(eligible_base_cents * award.max_share_pct)
          allocated_cents = min(award.max_award_cents, share_cap_cents, remaining)
          remaining      -= allocated_cents
          allocations.append({ funding_award_id, allocated_cents })
      unfunded_gap_cents        = remaining
      local_match_required_cents = sum(round_half_up(a.allocated_cents * award.match_requirement_pct)
                                       for a in allocations)
      # CONSERVED QUANTITY (invariant):
      #   sum(a.allocated_cents for a in allocations) + unfunded_gap_cents == need_cents
    input_set: |
      Only FundingAward rows with status == AWARDED enter the waterfall; APPLIED, DENIED
      and RESCINDED awards are excluded and carry allocated_cents == 0. Order is
      program_priority ASC with created_at ASC as the sole tie-break; the UUID id is
      never a decision input. An empty AWARDED set yields allocations == [],
      unfunded_gap_cents == need_cents and local_match_required_cents == 0.
    constants:
      TIE_BREAK: "created_at ASC"
    precision: "integer cents; round_half_up on share_cap_cents and on each match figure"

  - name: bfpp_compliance
    trigger: "any ContinuingObligation status change (certify, void-certification, compliance sweep) and every continuing-obligation creation"
    algorithm: weighted_scoring
    formula: |
      obligations_total_weight = sum(OBLIGATION_WEIGHTS[o.obligation_category]
                                     for o in ContinuingObligation rows on this protection)
      current_weight   = sum(weight for o where o.status == CURRENT)
      satisfied_weight = sum(weight for o where o.status == SATISFIED)
      at_risk_weight   = sum(weight for o where o.status == AT_RISK)
      lapsed_weight    = sum(weight for o where o.status == LAPSED)
      # CONSERVED QUANTITY (invariant):
      #   obligations_total_weight == current_weight + satisfied_weight
      #                             + at_risk_weight + lapsed_weight
      numerator   = current_weight + satisfied_weight + 0.5 * at_risk_weight
      compliance_pct = (obligations_total_weight == 0)
                       ? 1.0
                       : round_half_up(numerator / obligations_total_weight, 4)

      defence_critical_lapsed = EXISTS o where o.status == LAPSED
                                AND o.obligation_category IN {REASONABLE_STEPS,
                                                              LAND_USE_RESTRICTION_COMPLIANCE}
      obligation_state = (obligations_total_weight == 0)  ? OBLIGATIONS_NONE
                       : defence_critical_lapsed          ? LAPSED
                       : (compliance_pct >= COMPLIANCE_THRESHOLD) ? CURRENT
                       :                                     AT_RISK
      # >= is inclusive: a compliance_pct of exactly 0.8500 stays CURRENT.

      bfpp_status = (obligation_state == LAPSED)                          ? FORFEITED
                  : (inquiry_state == AAI_COMPLETE
                     AND Site.acquisition_status == ACQUIRED)             ? ESTABLISHED
                  :                                                        NOT_ESTABLISHED
      # FORFEITED is absorbing: once written it is never recomputed away.
    input_set: |
      Every ContinuingObligation row on the protection participates in the denominator
      regardless of status; there is no soft-delete. AT_RISK carries half weight in the
      numerator, LAPSED carries zero.
    constants:
      OBLIGATION_WEIGHTS:
        REASONABLE_STEPS: 5
        LAND_USE_RESTRICTION_COMPLIANCE: 5
        INSTITUTIONAL_CONTROL_MAINTENANCE: 4
        ACCESS_AND_COOPERATION: 3
        NOTIFICATION: 3
      COMPLIANCE_THRESHOLD: 0.85
      AT_RISK_GRACE_DAYS: 30
      AAI_LOOKBACK_DAYS: 180
      AAI_VALIDITY_DAYS: 365
    precision: "compliance_pct: 4 decimal places, round_half_up; weights are integers"

  - name: goal_attainment_streak
    trigger: "POST /monitoring-events/{id}/results"
    algorithm: chronological
    formula: |
      events = MonitoringEvent rows where cleanup_goal_id == this goal
               AND event_type == SAMPLING
               AND status == REPORTED,
               ordered by sample_date ASC, then created_at ASC   # never by id
      streak = 0
      for e in events:                       # full chronological replay, not incremental
          streak = (e.result_value_ugl <= CleanupGoal.goal_ugl) ? (streak + 1) : 0
      compliant_streak  = streak
      attainment_status = (compliant_streak >= ATTAINMENT_EVENTS_REQUIRED) ? ATTAINED : NOT_ATTAINED
      # <= is inclusive: a result exactly equal to goal_ugl is COMPLIANT and extends the streak.
      # A single exceedance resets the streak to 0 even if later events are compliant.
    input_set: |
      CONTROL_INSPECTION events and SCHEDULED events are excluded. The replay is over the
      whole history in sample_date order, so an event reported later but sampled earlier
      (a late-arriving result) is inserted into the middle of the sequence and can destroy
      a streak that had already reached ATTAINED — attainment_status is therefore
      recomputed from scratch on every result submission, never incremented in place.
    constants:
      ATTAINMENT_EVENTS_REQUIRED: 4
    precision: "compliant_streak is an integer count; result comparison uses the goal's 2-decimal goal_ugl"

  - name: site_cleanup_posture
    trigger: "every side effect that changes LiabilityProtection.bfpp_status or Site.impaired_control_count"
    algorithm: constraint_propagation
    formula: |
      impaired_control_count = count(SiteControl where site_id == this site AND status == IMPAIRED)
      cleanup_posture = (LiabilityProtection on this site exists
                         AND its bfpp_status == FORFEITED)      ? FROZEN
                      : (impaired_control_count > 0)            ? RESTRICTED
                      :                                           OPEN
      # Evaluated top-down: FORFEITED dominates impairment; a site with both a
      # forfeited defence and an impaired control is FROZEN, never RESTRICTED.
    input_set: |
      Only SiteControl rows with status == IMPAIRED are counted (PROPOSED, APPROVED,
      OPERATING and DECOMMISSIONED are excluded). A site with no LiabilityProtection row
      can never be FROZEN.
    constants: {}
    precision: "enumerated posture value; recomputed synchronously inside the triggering request"

# -----------------------------------------------------------------------------
# §1.4 Validation Rules Table (evaluated in ascending priority order; the first
# violated rule determines the response, and no later rule is evaluated)
# -----------------------------------------------------------------------------
validations:

  # --- 1-2: authentication and role authorization ---------------------------
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-blank."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "The value of X-User-Role appears in the target endpoint's roles list in §1.5."
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  # --- 3: request shape (structural validation, outside the business families) -
  - priority: 3
    category: validation
    check: |
      Request body and query shape: every required input field present; types correct;
      enum values members of the declared set; numeric ranges honoured (acreage > 0,
      screening_level_ugl > 0, term_years 1..10, years_to_construction_start 0..10,
      recurrence_days >= 30, inspection_interval_days 30..730, concurrent_capacity 1..10,
      program_priority 1..99, max_share_pct in (0,1], match_requirement_pct in [0,1],
      cost_lines 1..12 elements with quantity > 0 and unit_cost_cents > 0,
      eligible_cost_categories 1..5 unique members); ISO 8601 dates/datetimes parseable;
      field_end_date >= field_start_date; coverage_to >= coverage_from;
      window_end > window_start; aai_report_date required for phase_type == PHASE_I and
      must be absent otherwise; control_credit_type required when basis == RESTRICTED and
      must be absent when basis == UNRESTRICTED; licence_number required when party_type
      IN {CONSULTANT, INSURER}; results payload supplies result_value_ugl for a SAMPLING
      event and control_condition for a CONTROL_INSPECTION event.
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all

  # --- 4-5: existence, path ids left-to-right, then body FKs ----------------
  - priority: 4
    category: existence
    check: "Every id in the request path exists, validated left to right; the specific error names the missing resource kind (ERR_SITE_NOT_FOUND, ERR_PHASE_NOT_FOUND, ERR_PROTECTION_NOT_FOUND, ERR_OBLIGATION_NOT_FOUND, ERR_ENROLLMENT_NOT_FOUND, ERR_PLAN_NOT_FOUND, ERR_POLICY_NOT_FOUND, ERR_CONTROL_NOT_FOUND, ERR_AWARD_NOT_FOUND, ERR_LETTER_NOT_FOUND, ERR_EVENT_NOT_FOUND, ERR_GOAL_NOT_FOUND, ERR_FINDING_NOT_FOUND, ERR_PARTY_NOT_FOUND, ERR_LAB_NOT_FOUND)."
    error_id: ERR_SITE_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a path parameter"

  - priority: 5
    category: existence
    check: "Every foreign key supplied in the request body resolves to an existing row, validated in the order the fields are listed in the endpoint's input (site_id, then vcp_enrollment_id, then remedial_action_plan_id, then party ids, then laboratory_id, then cleanup_goal_id, then site_control_id, then aai_phase_id / basis_assessment_phase_id)."
    error_id: ERR_PARTY_NOT_FOUND
    http_status: 404
    applies_to: "POST /sites, POST /assessment-phases, POST /liability-protections, POST /vcp-enrollments, POST /remedial-action-plans, POST /cost-cap-policies, POST /site-controls, POST /funding-awards, POST /nfa-letters, POST /monitoring-events, POST /liability-protections/{id}/inquiry-completion"

  # --- 6-8: identity, ownership and separation of duties -------------------
  - priority: 6
    category: auth
    check: "For a Redeveloper the acting X-User-ID must equal Site.owner_party_id of the site the target resource belongs to; for an EnvironmentalConsultant creating or advancing an AssessmentPhase it must equal AssessmentPhase.consultant_party_id; for an Insurer it must equal CostCapPolicy.insurer_party_id."
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /sites/{id}/acquisition, POST /sites/{id}/cleanup-goals, POST /liability-protections, POST /continuing-obligations/{id}/certify, POST /vcp-enrollments, POST /vcp-enrollments/{id}/completion-request, POST /vcp-enrollments/{id}/withdraw, POST /assessment-phases/{id}/submit, POST /site-controls/{id}/operation-certification, POST /funding-awards, POST /nfa-letters, POST /cost-cap-policies/{id}/bind"

  - priority: 7
    category: auth
    check: "Separation of duties on opaque reviewer identities: the X-User-ID voiding a certification must differ from ContinuingObligation.imposed_by_user_id, and the X-User-ID issuing or re-issuing a no-further-action letter must differ from the approving plan's approved_by_user_id."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /continuing-obligations/{id}/void-certification, POST /nfa-letters/{id}/issue"

  - priority: 8
    category: business_referential
    check: "A Party referenced in a typed slot has the matching party_type: Site.owner_party_id and FundingAward applications require REDEVELOPER, AssessmentPhase.consultant_party_id and monitoring-result reporting require CONSULTANT, CostCapPolicy.insurer_party_id requires INSURER."
    error_id: ERR_PARTY_TYPE_MISMATCH
    http_status: 422
    applies_to: "POST /sites, POST /assessment-phases, POST /cost-cap-policies, POST /monitoring-events/{id}/results"

  # --- 9: uniqueness --------------------------------------------------------
  - priority: 9
    category: business_constraint
    check: "At most one LiabilityProtection row exists per site; a second create is refused."
    error_id: ERR_DUPLICATE_LIABILITY_PROTECTION
    http_status: 409
    applies_to: "POST /liability-protections"

  # --- 10-11: site posture gates -------------------------------------------
  - priority: 10
    category: state
    check: "Site.cleanup_posture != FROZEN. A frozen site (bfpp_status == FORFEITED) refuses every mutating child endpoint except POST /compliance-sweeps, POST /continuing-obligations/{id}/void-certification and POST /_clock/set_current_utc."
    error_id: ERR_SITE_FROZEN
    http_status: 409
    applies_to: "all mutating endpoints scoped to a site except POST /compliance-sweeps, POST /continuing-obligations/{id}/void-certification and POST /_clock/set_current_utc"

  - priority: 11
    category: state
    check: "Site.cleanup_posture == OPEN is required by the closure-critical operations: an impaired engineering or institutional control (posture RESTRICTED) blocks them even though the BFPP defence still stands."
    error_id: ERR_SITE_POSTURE_RESTRICTED
    http_status: 409
    applies_to: "POST /vcp-enrollments/{id}/completion-request, POST /nfa-letters/{id}/issue, POST /nfa-letters/{id}/lender-acceptance, POST /funding-awards/{id}/decision with decision == AWARD"

  # --- 12-13: state-machine preconditions ----------------------------------
  - priority: 12
    category: state
    check: "The target entity's current state permits the requested trigger per §1.2; otherwise the entity-specific state error is returned (ERR_INVALID_PHASE_STATE, ERR_INVALID_OBLIGATION_STATE, ERR_INVALID_ENROLLMENT_STATE, ERR_INVALID_PLAN_STATE, ERR_INVALID_POLICY_STATE, ERR_INVALID_CONTROL_STATE, ERR_INVALID_AWARD_STATE, ERR_INVALID_LETTER_STATE, ERR_EVENT_ALREADY_REPORTED, ERR_SITE_ALREADY_ACQUIRED, ERR_INQUIRY_DEFICIENT)."
    error_id: ERR_INVALID_PLAN_STATE
    http_status: 409
    applies_to: "every state-transition endpoint in §1.5"

  - priority: 13
    category: state
    check: "Fork-join gate on plan approval: technical_review_state == PASSED and public_comment_state == CLOSED. Also gates POST /remedial-action-plans/{id}/public-comment-close, which requires technical_review_state == PASSED."
    error_id: ERR_JOIN_NOT_SATISFIED
    http_status: 409
    applies_to: "POST /remedial-action-plans/{id}/approve, POST /remedial-action-plans/{id}/public-comment-close"

  # --- 14: optimistic concurrency ------------------------------------------
  - priority: 14
    category: state
    check: "The expected_<parent>_version supplied on an OCC-guarded create equals the parent's current version (§1.2.1)."
    error_id: ERR_STALE_ENROLLMENT_VERSION
    http_status: 412
    applies_to: "POST /remedial-action-plans (ERR_STALE_ENROLLMENT_VERSION), POST /cost-cap-policies (ERR_STALE_PLAN_VERSION)"

  # --- 20-24: safety / regulatory (before referential and fiscal) ----------
  - priority: 20
    category: business_safety
    check: "A PHASE_II or SUPPLEMENTAL phase asserting delineation_complete == true may be approved only when every ContaminantFinding on it with exceedance_factor > 1.0 has delineated == true."
    error_id: ERR_MEDIA_NOT_DELINEATED
    http_status: 422
    applies_to: "POST /assessment-phases/{id}/review with decision == APPROVE"

  - priority: 21
    category: business_safety
    check: "For every CleanupGoal on the site with basis == RESTRICTED, the plan being approved must carry a SiteControl whose control_type equals the goal's control_credit_type and whose status is PROPOSED, APPROVED or OPERATING. A risk-based goal that credits a control the remedy does not build is refused."
    error_id: ERR_CREDITED_CONTROL_MISSING
    http_status: 422
    applies_to: "POST /remedial-action-plans/{id}/approve"

  - priority: 22
    category: business_safety
    check: "Every SiteControl on the enrollment's APPROVED plan has status == OPERATING at letter issuance or re-issuance."
    error_id: ERR_CONTROLS_NOT_OPERATING
    http_status: 422
    applies_to: "POST /nfa-letters/{id}/issue"

  - priority: 23
    category: business_safety
    check: "requested_scope == UNRESTRICTED requires every CleanupGoal on the site to have basis == UNRESTRICTED; and a REVOKED letter whose revocation_reason == BFPP_FORFEITED can never be re-issued (ERR_LETTER_NOT_CURABLE)."
    error_id: ERR_UNRESTRICTED_SCOPE_NOT_SUPPORTED
    http_status: 422
    applies_to: "POST /nfa-letters/{id}/issue"

  - priority: 24
    category: business_safety
    check: "A control may be decommissioned only when every CleanupGoal crediting its control_type has attainment_status == ATTAINED and no NoFurtherActionLetter on the site is ACCEPTED_BY_LENDER with requested_scope == RESTRICTED_WITH_CONTROLS."
    error_id: ERR_CONTROL_STILL_REQUIRED
    http_status: 422
    applies_to: "POST /site-controls/{id}/decommission"

  # --- 25-29: temporal and resource-overlap constraints --------------------
  - priority: 25
    category: business_temporal
    check: "aai_report_date must be on or before the acquisition reference date (Site.acquisition_date when ACQUIRED, otherwise Site.planned_acquisition_date). An inquiry completed after taking title cannot support the defence."
    error_id: ERR_AAI_AFTER_ACQUISITION
    http_status: 422
    applies_to: "POST /liability-protections/{id}/inquiry-completion"

  - priority: 26
    category: business_temporal
    check: "(reference_date - aai_report_date) <= 180 days inclusive; a 181-day-old inquiry report is refused."
    error_id: ERR_AAI_REPORT_STALE
    http_status: 422
    applies_to: "POST /liability-protections/{id}/inquiry-completion"

  - priority: 27
    category: business_temporal
    check: |
      ENGINEERING control coverage exclusivity on (site_id, sub_area_code): the requested
      closed inclusive interval [coverage_from, coverage_to] must not overlap, and must not
      come within a symmetric 30-day changeover buffer of, the interval of any existing
      SiteControl on the same site and sub_area_code with control_class == ENGINEERING and
      status IN {PROPOSED, APPROVED, OPERATING, IMPAIRED}. Two intervals conflict when
      new.coverage_from <= existing.coverage_to + 30 days AND
      existing.coverage_from <= new.coverage_to + 30 days — so back-to-back (adjacent)
      coverage is rejected, and a 31-day gap is the first accepted separation.
      INSTITUTIONAL controls are exempt from this rule.
    error_id: ERR_CONTROL_COVERAGE_CONFLICT
    http_status: 409
    applies_to: "POST /site-controls"

  - priority: 28
    category: business_temporal
    check: |
      Laboratory analysis capacity on half-open windows: counting existing MonitoringEvent
      rows on the same laboratory_id with status IN {SCHEDULED, REPORTED} whose
      [window_start, window_end) intersects the requested [window_start, window_end)
      (intersection requires new.window_start < existing.window_end AND
      existing.window_start < new.window_end, so touching windows do NOT conflict), the
      request is refused when that count is already >= Laboratory.concurrent_capacity.
      This is an aggregate check: each existing reservation is individually legal.
    error_id: ERR_LAB_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /monitoring-events"

  - priority: 29
    category: business_temporal
    check: "Certification timing: a continuing obligation may be certified only while the logical clock date is on or before due_date (ERR_CERTIFICATION_WINDOW_CLOSED); a control operation certification's certification_date must fall inside [coverage_from, coverage_to] inclusive (ERR_CERTIFICATION_OUTSIDE_COVERAGE); and monitoring results may not be filed before window_start (ERR_RESULTS_BEFORE_WINDOW)."
    error_id: ERR_CERTIFICATION_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /continuing-obligations/{id}/certify, POST /site-controls/{id}/operation-certification, POST /monitoring-events/{id}/results"

  # --- 30-35: cross-entity referential preconditions -----------------------
  - priority: 30
    category: business_referential
    check: "aai_phase_id must reference an AssessmentPhase on this protection's site with phase_type == PHASE_I and status == APPROVED."
    error_id: ERR_PHASE_I_NOT_APPROVED
    http_status: 422
    applies_to: "POST /liability-protections/{id}/inquiry-completion"

  - priority: 31
    category: business_referential
    check: "basis_assessment_phase_id must reference an AssessmentPhase on the plan's site with phase_type IN {PHASE_II, SUPPLEMENTAL}, status == APPROVED and delineation_complete == true."
    error_id: ERR_BASIS_PHASE_INELIGIBLE
    http_status: 422
    applies_to: "POST /remedial-action-plans/{id}/submit"

  - priority: 32
    category: business_referential
    check: "Every entry of pinned_cleanup_goal_versions must still match the referenced CleanupGoal's current version; a goal re-derived after the plan was submitted invalidates the approval."
    error_id: ERR_PINNED_GOAL_VERSION_STALE
    http_status: 409
    applies_to: "POST /remedial-action-plans/{id}/approve"

  - priority: 33
    category: business_referential
    check: "Enrollment eligibility: the site's LiabilityProtection must exist with inquiry_state == AAI_COMPLETE (ERR_ENROLLMENT_NOT_ELIGIBLE), and program_track == RESTRICTED_CLOSURE additionally requires Site.institutional_control_committed == true (ERR_CONTROL_COMMITMENT_MISSING)."
    error_id: ERR_ENROLLMENT_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /vcp-enrollments/{id}/eligibility-decision with decision == ENROLL"

  - priority: 34
    category: business_referential
    check: "Completion request requires every CleanupGoal on the site to have attainment_status == ATTAINED and every SiteControl on the enrollment's approved plan to have status == OPERATING."
    error_id: ERR_GOALS_NOT_ATTAINED
    http_status: 422
    applies_to: "POST /vcp-enrollments/{id}/completion-request"

  - priority: 35
    category: business_referential
    check: "Cross-aggregate coherence: RemedialActionPlan.site_id must equal the enrollment's site_id; a SiteControl's remedial_action_plan_id must belong to a plan on the same site_id; a MonitoringEvent's cleanup_goal_id and site_control_id must both belong to its site_id; a NoFurtherActionLetter's vcp_enrollment_id must belong to its site_id."
    error_id: ERR_PLAN_SITE_MISMATCH
    http_status: 422
    applies_to: "POST /remedial-action-plans, POST /site-controls, POST /monitoring-events, POST /nfa-letters"

  # --- 36-42: constraint satisfaction --------------------------------------
  - priority: 36
    category: business_constraint
    check: "A VCP enrollment may only be created once Site.delineation_status != NONE (an APPROVED PHASE_I exists)."
    error_id: ERR_DELINEATION_REQUIRED
    http_status: 422
    applies_to: "POST /vcp-enrollments"

  - priority: 37
    category: business_constraint
    check: "An AssessmentPhase must carry findings_count >= 1 to be submitted; a RemedialActionPlan requires at least one CleanupGoal on its site to be submitted (ERR_NO_CLEANUP_GOALS)."
    error_id: ERR_NO_FINDINGS
    http_status: 422
    applies_to: "POST /assessment-phases/{id}/submit, POST /remedial-action-plans/{id}/submit"

  - priority: 38
    category: business_constraint
    check: "Assessment revision ceiling: a REQUEST_REVISION decision is only issuable while review_round <= 2; at review_round == 3 the phase is instead REJECTED, and a fourth submit of the same phase is refused."
    error_id: ERR_ASSESSMENT_REVISION_LIMIT
    http_status: 409
    applies_to: "POST /assessment-phases/{id}/submit"

  - priority: 39
    category: business_constraint
    check: "Plan revision ceiling: a REQUEST_REVISION decision is only issuable while revision_round <= 1; a third revision request is refused."
    error_id: ERR_PLAN_REVISION_LIMIT
    http_status: 409
    applies_to: "POST /remedial-action-plans/{id}/technical-review with decision == REQUEST_REVISION"

  - priority: 40
    category: business_constraint
    check: |
      Funding eligibility documentation, evaluated only for decision == AWARD:
      a GRANT requires eligibility_documents to contain SITE_CONTROL_EVIDENCE,
      PHASE_II_REPORT, COST_ESTIMATE and MATCH_COMMITMENT; a TAX_CREDIT requires
      BFPP_CERTIFICATION, PHASE_II_REPORT and COST_ESTIMATE. A missing code is refused.
    error_id: ERR_MISSING_ELIGIBILITY_DOCUMENT
    http_status: 422
    applies_to: "POST /funding-awards/{id}/decision"

  - priority: 41
    category: business_constraint
    check: "An enrollment may be withdrawn only while no RemedialActionPlan on it has status == APPROVED."
    error_id: ERR_APPROVED_PLAN_EXISTS
    http_status: 409
    applies_to: "POST /vcp-enrollments/{id}/withdraw"

  - priority: 42
    category: business_constraint
    check: "A plan may only be edited while its status is DRAFT or REVISION_REQUESTED; the edit recomputes every DESIGN cost figure and bumps the plan version."
    error_id: ERR_PLAN_NOT_EDITABLE
    http_status: 409
    applies_to: "PATCH /remedial-action-plans/{id}"

  # --- 50-52: fiscal checks last -------------------------------------------
  - priority: 50
    category: business_fiscal
    check: "Binding a cost-cap policy requires attachment_point_cents >= round_half_up(RemedialActionPlan.total_estimate_cents * 1.05): the self-funded buffer must still sit above the plan's current design estimate, which a post-quote plan edit can invalidate."
    error_id: ERR_ATTACHMENT_POINT_TOO_LOW
    http_status: 422
    applies_to: "POST /cost-cap-policies/{id}/bind"

  - priority: 51
    category: business_fiscal
    check: "Binding a cost-cap policy requires limit_cents >= MIN_LIMIT_CENTS (25000000); carriers do not bind a cap below a 250,000.00 limit."
    error_id: ERR_LIMIT_BELOW_MINIMUM
    http_status: 422
    applies_to: "POST /cost-cap-policies/{id}/bind"

  - priority: 52
    category: business_fiscal
    check: "Awarding funding requires an APPROVED RemedialActionPlan on the site (ERR_FUNDING_NEED_UNDETERMINED) and a non-zero eligible cost base — the plan must contain at least one cost line whose cost_category is in the award's eligible_cost_categories (ERR_NO_ELIGIBLE_COST_BASE)."
    error_id: ERR_NO_ELIGIBLE_COST_BASE
    http_status: 422
    applies_to: "POST /funding-awards/{id}/decision with decision == AWARD"

# -----------------------------------------------------------------------------
# §1.5 API Endpoint Table
# -----------------------------------------------------------------------------
endpoints:

  # ------------------------------------------------ test-driving / ops runs ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock. The startup default is exactly 2026-08-01T00:00:00Z; before any call to this endpoint the logical clock reads that default and never falls back to wall-clock time. Every deadline, expiry, coverage-window and staleness rule in this scaffold reads the logical clock."
    roles: [ProgramAdmin, StateAgencyReviewer, Redeveloper, EnvironmentalConsultant, Insurer, Lender]
    code: 200
    input: ["current_utc"]
    output: "{ current_utc: datetime }"
    side_effects:
      - "sets the logical clock to current_utc; no entity rows are modified"

  - method: POST
    path: "/compliance-sweeps"
    description: "Ops-run checkpoint over continuing obligations and inquiry freshness as of a supplied date. Advances CURRENT -> AT_RISK (within 30 days of due_date), CURRENT/AT_RISK/SATISFIED -> AT_RISK or LAPSED per §1.2 ContinuingObligation, and AAI_COMPLETE -> AAI_STALE for protections whose aai_expires_on has passed while the site is still UNDER_CONTRACT. Runs even on FROZEN sites."
    roles: [StateAgencyReviewer]
    code: 200
    input: ["as_of_date", "site_id?"]
    output: "{ as_of_date: string, swept_obligation_count: integer, at_risk_count: integer, lapsed_count: integer, stale_inquiry_count: integer, forfeited_protection_count: integer, frozen_site_count: integer }"
    side_effects:
      - "advances every matching ContinuingObligation per §1.2 and increments each affected ContinuingObligation.version by 1"
      - "recomputes §1.3 bfpp_compliance for every touched LiabilityProtection and increments its version by 1"
      - "cascade: a defence-critical LAPSED obligation sets bfpp_status FORFEITED, Site.cleanup_posture FROZEN and revokes the site's ISSUED / ACCEPTED_BY_LENDER letters with revocation_reason BFPP_FORFEITED, which rescinds every AWARDED FundingAward on the site"
      - "increments Site.version by 1 for every site whose cleanup_posture changed"

  # ------------------------------------------------------------------ Party ----
  - method: POST
    path: "/parties"
    description: "Registers a redeveloper, environmental consultant or insurer. The returned id is the X-User-ID the corresponding role acts under."
    roles: [ProgramAdmin]
    code: 201
    input: ["legal_name", "party_type", "state_code", "licence_number?"]
    output: Party
    side_effects: []

  - method: GET
    path: "/parties"
    description: "Lists parties, optionally filtered by type."
    roles: [ProgramAdmin, StateAgencyReviewer, Redeveloper, EnvironmentalConsultant, Insurer, Lender]
    code: 200
    input: ["party_type?", "limit?", "offset?"]
    output: Party[]
    side_effects: []

  - method: GET
    path: "/parties/{id}"
    description: "Retrieves one party."
    roles: [ProgramAdmin, StateAgencyReviewer, Redeveloper, EnvironmentalConsultant, Insurer, Lender]
    code: 200
    input: []
    output: Party
    side_effects: []

  # ------------------------------------------------------------- Laboratory ----
  - method: POST
    path: "/laboratories"
    description: "Registers an accredited analytical laboratory and its concurrent analysis capacity."
    roles: [ProgramAdmin]
    code: 201
    input: ["lab_name", "certification_code", "concurrent_capacity"]
    output: Laboratory
    side_effects: []

  - method: GET
    path: "/laboratories"
    description: "Lists laboratories."
    roles: [ProgramAdmin, StateAgencyReviewer, EnvironmentalConsultant, Redeveloper]
    code: 200
    input: ["certification_code?", "limit?", "offset?"]
    output: Laboratory[]
    side_effects: []

  - method: GET
    path: "/laboratories/{id}"
    description: "Retrieves one laboratory."
    roles: [ProgramAdmin, StateAgencyReviewer, EnvironmentalConsultant, Redeveloper]
    code: 200
    input: []
    output: Laboratory
    side_effects: []

  # ------------------------------------------------------------------- Site ----
  - method: POST
    path: "/sites"
    description: "Registers a brownfield parcel under contract. acquisition_status starts UNDER_CONTRACT, delineation_status NONE, cleanup_posture OPEN."
    roles: [Redeveloper]
    code: 201
    input: ["owner_party_id", "site_name", "county_code", "acreage", "intended_reuse", "planned_acquisition_date", "institutional_control_committed?"]
    output: Site
    side_effects:
      - "sets acquisition_status UNDER_CONTRACT, delineation_status NONE, cleanup_posture OPEN, impaired_control_count 0"

  - method: GET
    path: "/sites"
    description: "Lists sites, filterable by owner and posture."
    roles: [Redeveloper, EnvironmentalConsultant, StateAgencyReviewer, Insurer, Lender, ProgramAdmin]
    code: 200
    input: ["owner_party_id?", "cleanup_posture?", "limit?", "offset?"]
    output: Site[]
    side_effects: []

  - method: GET
    path: "/sites/{id}"
    description: "Retrieves one site including its derived delineation_status, cleanup_posture and impaired_control_count."
    roles: [Redeveloper, EnvironmentalConsultant, StateAgencyReviewer, Insurer, Lender, ProgramAdmin]
    code: 200
    input: []
    output: Site
    side_effects: []

  - method: POST
    path: "/sites/{id}/acquisition"
    description: "Records the actual closing of the parcel; flips acquisition_status to ACQUIRED. Only the owning redeveloper may record it, and only once."
    roles: [Redeveloper]
    code: 200
    input: ["acquisition_date"]
    output: Site
    side_effects:
      - "sets acquisition_status ACQUIRED and acquisition_date"
      - "recomputes the site's LiabilityProtection bfpp_status per §1.3 bfpp_compliance (an AAI_COMPLETE inquiry now yields ESTABLISHED) and increments LiabilityProtection.version by 1"
      - "increments Site.version by 1"

  - method: GET
    path: "/sites/{id}/funding-assembly"
    description: "Computed read of the §1.3 funding_assembly_waterfall for the site: the ordered allocations across AWARDED funding, the residual unfunded gap and the local match owed. Returns need 0 and an empty allocation list when the site has no APPROVED plan."
    roles: [Redeveloper, StateAgencyReviewer, Lender, Insurer]
    code: 200
    input: []
    output: "{ site_id: string, remedial_action_plan_id: string, total_funding_need_cents: integer, allocations: array, unfunded_gap_cents: integer, local_match_required_cents: integer }"
    side_effects: []

  - method: POST
    path: "/sites/{id}/cleanup-goals"
    description: "Derives (or re-derives) a risk-based cleanup goal for one analyte/media pair via §1.3 risk_based_cleanup_goal. The triple (site_id, contaminant_code, media) is unique: a repeat call upserts the existing row, recomputes goal_ugl and bumps its version."
    roles: [EnvironmentalConsultant, Redeveloper]
    code: 201
    input: ["contaminant_code", "media", "screening_level_ugl", "basis", "control_credit_type?"]
    output: CleanupGoal
    side_effects:
      - "computes contaminant_count_in_media, goal_ugl and cumulative_cap_applied per §1.3 risk_based_cleanup_goal"
      - "on upsert of an existing goal, increments CleanupGoal.version by 1 and recomputes compliant_streak and attainment_status against the new goal_ugl"

  - method: GET
    path: "/sites/{id}/cleanup-goals"
    description: "Lists the site's cleanup goals with their attainment state."
    roles: [Redeveloper, EnvironmentalConsultant, StateAgencyReviewer, Insurer, Lender]
    code: 200
    input: ["media?", "basis?"]
    output: CleanupGoal[]
    side_effects: []

  - method: GET
    path: "/cleanup-goals/{id}"
    description: "Retrieves one cleanup goal."
    roles: [Redeveloper, EnvironmentalConsultant, StateAgencyReviewer, Insurer, Lender]
    code: 200
    input: []
    output: CleanupGoal
    side_effects: []

  - method: GET
    path: "/sites/{id}/liability-protections"
    description: "Lists the site's liability protection record (0 or 1 element) with both parallel state dimensions, the four weight buckets and compliance_pct."
    roles: [Redeveloper, EnvironmentalConsultant, StateAgencyReviewer, Insurer, Lender]
    code: 200
    input: []
    output: LiabilityProtection[]
    side_effects: []

  - method: GET
    path: "/sites/{id}/vcp-enrollments"
    description: "Lists the site's voluntary-cleanup-program enrollments."
    roles: [Redeveloper, EnvironmentalConsultant, StateAgencyReviewer, Insurer, Lender]
    code: 200
    input: ["status?"]
    output: VcpEnrollment[]
    side_effects: []

  - method: GET
    path: "/sites/{id}/funding-awards"
    description: "Lists the site's funding applications and awards with their current allocated_cents."
    roles: [Redeveloper, StateAgencyReviewer, Lender]
    code: 200
    input: ["status?"]
    output: FundingAward[]
    side_effects: []

  # -------------------------------------------------------- AssessmentPhase ----
  - method: POST
    path: "/assessment-phases"
    description: "Opens an assessment phase (PHASE_I inquiry, PHASE_II delineation, or SUPPLEMENTAL re-delineation superseding a rejected phase) in DRAFT."
    roles: [EnvironmentalConsultant]
    code: 201
    input: ["site_id", "consultant_party_id", "phase_type", "field_start_date", "field_end_date", "delineation_confidence", "aai_report_date?", "delineation_complete?", "supersedes_phase_id?"]
    output: AssessmentPhase
    side_effects:
      - "sets status DRAFT, review_round 0, findings_count 0, max_exceedance_factor 0"

  - method: GET
    path: "/assessment-phases"
    description: "Lists assessment phases filterable by site, consultant, superseded phase and status."
    roles: [EnvironmentalConsultant, StateAgencyReviewer, Redeveloper, Insurer, Lender]
    code: 200
    input: ["site_id?", "consultant_party_id?", "supersedes_phase_id?", "phase_type?", "status?", "limit?", "offset?"]
    output: AssessmentPhase[]
    side_effects: []

  - method: GET
    path: "/assessment-phases/{id}"
    description: "Retrieves one assessment phase with its computed findings_count and max_exceedance_factor."
    roles: [EnvironmentalConsultant, StateAgencyReviewer, Redeveloper, Insurer, Lender]
    code: 200
    input: []
    output: AssessmentPhase
    side_effects: []

  - method: POST
    path: "/assessment-phases/{id}/contaminant-findings"
    description: "Records one immutable analytical finding on a DRAFT or REVISION_REQUESTED phase and computes its exceedance_factor."
    roles: [EnvironmentalConsultant]
    code: 201
    input: ["contaminant_code", "media", "sample_location_code", "max_concentration_ugl", "screening_level_ugl", "delineated?"]
    output: ContaminantFinding
    side_effects:
      - "computes exceedance_factor = round_half_up(max_concentration_ugl / screening_level_ugl, 2)"
      - "increments AssessmentPhase.findings_count by 1, recomputes AssessmentPhase.max_exceedance_factor and increments AssessmentPhase.version by 1"

  - method: GET
    path: "/assessment-phases/{id}/contaminant-findings"
    description: "Lists the immutable findings recorded on a phase."
    roles: [EnvironmentalConsultant, StateAgencyReviewer, Redeveloper, Insurer]
    code: 200
    input: ["media?"]
    output: ContaminantFinding[]
    side_effects: []

  - method: GET
    path: "/contaminant-findings/{id}"
    description: "Retrieves one finding. The entity is immutable: it carries no version field and has no update endpoint."
    roles: [EnvironmentalConsultant, StateAgencyReviewer, Redeveloper, Insurer]
    code: 200
    input: []
    output: ContaminantFinding
    side_effects: []

  - method: POST
    path: "/assessment-phases/{id}/submit"
    description: "Submits a DRAFT or REVISION_REQUESTED phase for agency review; the phase leaves the request already in UNDER_REVIEW via the automatic follow-on transition."
    roles: [EnvironmentalConsultant]
    code: 200
    input: []
    output: AssessmentPhase
    side_effects:
      - "increments review_round by 1, sets submitted_at from the logical clock, recomputes max_exceedance_factor"
      - "status advances DRAFT|REVISION_REQUESTED -> SUBMITTED -> UNDER_REVIEW in the same request"
      - "increments AssessmentPhase.version by 1"

  - method: POST
    path: "/assessment-phases/{id}/review"
    description: "Agency decision on an UNDER_REVIEW phase. decision APPROVE terminalises it and advances Site.delineation_status; REQUEST_REVISION returns it for rework, or REJECTS it when review_round has reached 3."
    roles: [StateAgencyReviewer]
    code: 200
    input: ["decision", "review_comment?"]
    output: AssessmentPhase
    side_effects:
      - "records reviewed_by_user_id"
      - "on APPROVE of a PHASE_I: Site.delineation_status becomes SCREENED unless already DELINEATED"
      - "on APPROVE of a PHASE_II or SUPPLEMENTAL with delineation_complete == true: Site.delineation_status becomes DELINEATED"
      - "on REQUEST_REVISION or REJECT of a PHASE_I: the site's LiabilityProtection.inquiry_state becomes AAI_DEFICIENT, bfpp_status is recomputed and LiabilityProtection.version increments by 1"
      - "increments AssessmentPhase.version by 1 and Site.version by 1 when delineation_status changed"

  # ---------------------------------------------------- LiabilityProtection ----
  - method: POST
    path: "/liability-protections"
    description: "Opens the bona-fide-prospective-purchaser file for a site. inquiry_state starts AAI_PENDING, obligation_state OBLIGATIONS_NONE, bfpp_status NOT_ESTABLISHED, compliance_pct 1.0. At most one per site."
    roles: [Redeveloper]
    code: 201
    input: ["site_id"]
    output: LiabilityProtection
    side_effects:
      - "sets inquiry_state AAI_PENDING, obligation_state OBLIGATIONS_NONE, bfpp_status NOT_ESTABLISHED, all four weight buckets 0 and compliance_pct 1.0"

  - method: GET
    path: "/liability-protections/{id}"
    description: "Retrieves one protection with both parallel dimensions, the conserved weight buckets and the derived bfpp_status."
    roles: [Redeveloper, EnvironmentalConsultant, StateAgencyReviewer, Insurer, Lender]
    code: 200
    input: []
    output: LiabilityProtection
    side_effects: []

  - method: POST
    path: "/liability-protections/{id}/inquiry-completion"
    description: "Accepts an APPROVED PHASE_I assessment as the all-appropriate-inquiries record, moving the inquiry dimension AAI_PENDING or AAI_STALE -> AAI_COMPLETE. Refused once the dimension is AAI_DEFICIENT."
    roles: [EnvironmentalConsultant]
    code: 200
    input: ["aai_phase_id"]
    output: LiabilityProtection
    side_effects:
      - "stores aai_phase_id, aai_report_date and aai_expires_on = aai_report_date + 365 days"
      - "recomputes bfpp_status per §1.3 bfpp_compliance (ESTABLISHED only when the site is already ACQUIRED)"
      - "increments LiabilityProtection.version by 1"

  - method: POST
    path: "/liability-protections/{id}/continuing-obligations"
    description: "Imposes a statutory continuing obligation on the protection and re-derives the weighted compliance figure. Records the imposing reviewer for the separation-of-duties check on void-certification."
    roles: [StateAgencyReviewer]
    code: 201
    input: ["obligation_category", "description", "due_date", "recurrence_days"]
    output: ContinuingObligation
    side_effects:
      - "sets status CURRENT, certification_count 0, prior_due_date null, imposed_by_user_id from X-User-ID"
      - "recomputes obligations_total_weight, current_weight and compliance_pct per §1.3 bfpp_compliance and moves obligation_state OBLIGATIONS_NONE -> CURRENT"
      - "recomputes bfpp_status and increments LiabilityProtection.version by 1"

  - method: GET
    path: "/liability-protections/{id}/continuing-obligations"
    description: "Lists the continuing obligations hanging off a protection."
    roles: [Redeveloper, EnvironmentalConsultant, StateAgencyReviewer, Lender]
    code: 200
    input: ["status?", "obligation_category?"]
    output: ContinuingObligation[]
    side_effects: []

  # -------------------------------------------------- ContinuingObligation ----
  - method: GET
    path: "/continuing-obligations/{id}"
    description: "Retrieves one continuing obligation with its certification history counters."
    roles: [Redeveloper, EnvironmentalConsultant, StateAgencyReviewer, Lender]
    code: 200
    input: []
    output: ContinuingObligation
    side_effects: []

  - method: POST
    path: "/continuing-obligations/{id}/certify"
    description: "Owner certifies performance for the open period, advancing the obligation to SATISFIED and rolling due_date forward by recurrence_days."
    roles: [Redeveloper]
    code: 200
    input: []
    output: ContinuingObligation
    side_effects:
      - "stores prior_due_date = due_date then advances due_date by recurrence_days; sets certified_at from the logical clock; increments certification_count by 1"
      - "recomputes the protection's four weight buckets and compliance_pct per §1.3 bfpp_compliance, returning obligation_state to CURRENT when compliance_pct >= 0.85"
      - "increments ContinuingObligation.version by 1 and LiabilityProtection.version by 1"

  - method: POST
    path: "/continuing-obligations/{id}/void-certification"
    description: "Compensating action: a reviewer other than the one who imposed the duty voids the last accepted certification, restoring due_date verbatim from prior_due_date and returning the obligation to CURRENT or AT_RISK depending on the restored 30-day grace. Permitted even on a FROZEN site."
    roles: [StateAgencyReviewer]
    code: 200
    input: ["void_reason"]
    output: ContinuingObligation
    side_effects:
      - "restores due_date = prior_due_date, clears certified_at, sets prior_due_date null, decrements certification_count by 1"
      - "recomputes the protection's weight buckets and compliance_pct to exactly their pre-certification values"
      - "increments ContinuingObligation.version by 1 and LiabilityProtection.version by 1"

  # ------------------------------------------------------------ VcpEnrollment ----
  - method: POST
    path: "/vcp-enrollments"
    description: "Applies to the voluntary cleanup program. The enrollment leaves the request already in ELIGIBILITY_REVIEW via the automatic follow-on transition; requires Site.delineation_status != NONE."
    roles: [Redeveloper]
    code: 201
    input: ["site_id", "program_track", "applicant_statement"]
    output: VcpEnrollment
    side_effects:
      - "status advances APPLIED -> ELIGIBILITY_REVIEW in the same request; reverted_completion_count starts 0"

  - method: GET
    path: "/vcp-enrollments/{id}"
    description: "Retrieves one enrollment."
    roles: [Redeveloper, EnvironmentalConsultant, StateAgencyReviewer, Insurer, Lender]
    code: 200
    input: []
    output: VcpEnrollment
    side_effects: []

  - method: POST
    path: "/vcp-enrollments/{id}/eligibility-decision"
    description: "Agency decision on an ELIGIBILITY_REVIEW enrollment: ENROLL requires the site's protection to be AAI_COMPLETE (and, for the RESTRICTED_CLOSURE track, a committed institutional control); REJECT is terminal."
    roles: [StateAgencyReviewer]
    code: 200
    input: ["decision", "decision_note?"]
    output: VcpEnrollment
    side_effects:
      - "on ENROLL: sets enrolled_on from the logical clock date and eligibility_decided_by_user_id"
      - "on REJECT: sets eligibility_decided_by_user_id and terminalises the enrollment"
      - "increments VcpEnrollment.version by 1"

  - method: POST
    path: "/vcp-enrollments/{id}/completion-request"
    description: "Owner asks the agency to review completion. Requires cleanup_posture OPEN, every cleanup goal ATTAINED and every control on the approved plan OPERATING."
    roles: [Redeveloper]
    code: 200
    input: []
    output: VcpEnrollment
    side_effects:
      - "sets completion_requested_at from the logical clock and moves IMPLEMENTATION -> COMPLETION_REVIEW"
      - "increments VcpEnrollment.version by 1"

  - method: POST
    path: "/vcp-enrollments/{id}/withdraw"
    description: "Owner withdraws an ENROLLED enrollment; refused once any plan on it is APPROVED. Cascades to non-terminal plans and their outstanding quotes."
    roles: [Redeveloper]
    code: 200
    input: ["withdrawal_reason"]
    output: VcpEnrollment
    side_effects:
      - "cascade L1: every RemedialActionPlan on this enrollment in DRAFT, SUBMITTED, UNDER_TECHNICAL_REVIEW, PUBLIC_COMMENT or REVISION_REQUESTED becomes WITHDRAWN and its version increments by 1"
      - "cascade L2: every CostCapPolicy on those plans with status QUOTED becomes CANCELLED and its version increments by 1"
      - "increments VcpEnrollment.version by 1"

  # ------------------------------------------------------ RemedialActionPlan ----
  - method: POST
    path: "/remedial-action-plans"
    description: "Files a remedial action plan against an enrollment in DRAFT. OCC-guarded on the enrollment (§1.2.1 plan-create-stale-enrollment): expected_vcp_enrollment_version must equal the enrollment's current version, because a new plan legitimately supersedes any prior DRAFT plan on the same enrollment."
    roles: [EnvironmentalConsultant]
    code: 201
    input: ["vcp_enrollment_id", "site_id", "remedy_narrative", "basis_assessment_phase_id", "years_to_construction_start", "cost_lines", "expected_vcp_enrollment_version"]
    output: RemedialActionPlan
    side_effects:
      - "sets status DRAFT, technical_review_state NOT_STARTED, public_comment_state NOT_STARTED, revision_round 0, pinned_cleanup_goal_versions []"
      - "computes the DESIGN-variant cost figures (direct_cost_cents, escalation_cents, contingency_pct, contingency_cents, oversight_cents, total_estimate_cents) per §1.3 remediation_cost_estimate and sets total_funding_need_cents = total_estimate_cents"
      - "increments VcpEnrollment.version by 1"

  - method: GET
    path: "/remedial-action-plans"
    description: "Lists plans filterable by enrollment, site and status."
    roles: [EnvironmentalConsultant, StateAgencyReviewer, Redeveloper, Insurer, Lender]
    code: 200
    input: ["vcp_enrollment_id?", "site_id?", "status?", "limit?", "offset?"]
    output: RemedialActionPlan[]
    side_effects: []

  - method: GET
    path: "/remedial-action-plans/{id}"
    description: "Retrieves one plan with every computed cost figure, both fork branch dimensions and the pinned cleanup-goal versions."
    roles: [EnvironmentalConsultant, StateAgencyReviewer, Redeveloper, Insurer, Lender]
    code: 200
    input: []
    output: RemedialActionPlan
    side_effects: []

  - method: PATCH
    path: "/remedial-action-plans/{id}"
    description: "Edits a DRAFT or REVISION_REQUESTED plan and immediately re-runs the DESIGN-variant cost estimate. Outstanding QUOTED cost-cap policies are deliberately NOT re-priced — the underwriter's attachment point was set against the figures it quoted, which is what the bind-time attachment check re-tests."
    roles: [EnvironmentalConsultant]
    code: 200
    input: ["remedy_narrative?", "basis_assessment_phase_id?", "years_to_construction_start?", "cost_lines?"]
    output: RemedialActionPlan
    side_effects:
      - "recomputes direct_cost_cents, escalation_cents, contingency_pct, contingency_cents, oversight_cents, total_estimate_cents and total_funding_need_cents per §1.3 remediation_cost_estimate (DESIGN variant)"
      - "increments RemedialActionPlan.version by 1"

  - method: POST
    path: "/remedial-action-plans/{id}/submit"
    description: "Submits a DRAFT or REVISION_REQUESTED plan; forks the technical and public-participation branches and pins the current cleanup-goal versions. The plan leaves the request already in UNDER_TECHNICAL_REVIEW."
    roles: [EnvironmentalConsultant]
    code: 200
    input: []
    output: RemedialActionPlan
    side_effects:
      - "fork: technical_review_state NOT_STARTED and public_comment_state OPEN"
      - "pins pinned_cleanup_goal_versions from every CleanupGoal on the site, ordered by the goal's created_at ASC"
      - "recomputes every DESIGN-variant cost figure per §1.3 remediation_cost_estimate"
      - "status advances DRAFT|REVISION_REQUESTED -> SUBMITTED -> UNDER_TECHNICAL_REVIEW in the same request"
      - "increments RemedialActionPlan.version by 1"

  - method: POST
    path: "/remedial-action-plans/{id}/technical-review"
    description: "Technical branch decision. PASS sets technical_review_state PASSED and moves the plan to PUBLIC_COMMENT; REQUEST_REVISION voids the comment period, clears the goal pins and cancels outstanding quotes."
    roles: [StateAgencyReviewer]
    code: 200
    input: ["decision", "review_comment?"]
    output: RemedialActionPlan
    side_effects:
      - "on PASS: technical_review_state becomes PASSED; no cost figure is touched"
      - "on REQUEST_REVISION: increments revision_round by 1, resets public_comment_state to NOT_STARTED and public_comment_count to 0, clears pinned_cleanup_goal_versions, and every CostCapPolicy on this plan with status QUOTED becomes CANCELLED with its version incremented by 1"
      - "increments RemedialActionPlan.version by 1"

  - method: POST
    path: "/remedial-action-plans/{id}/public-comment-close"
    description: "Public-participation branch decision: closes the comment period and records the comment count. Requires the technical branch to have PASSED first (cascading validation)."
    roles: [StateAgencyReviewer]
    code: 200
    input: ["public_comment_count"]
    output: RemedialActionPlan
    side_effects:
      - "public_comment_state becomes CLOSED and public_comment_count is stored; no technical field is touched"
      - "increments RemedialActionPlan.version by 1"

  - method: POST
    path: "/remedial-action-plans/{id}/approve"
    description: "Join point: approves the plan once both branches are complete, the credited controls exist and every pinned cleanup-goal version still matches. Cascades to controls, the enrollment and competing plans."
    roles: [StateAgencyReviewer]
    code: 200
    input: []
    output: RemedialActionPlan
    side_effects:
      - "sets approved_by_user_id and approved_at"
      - "cascade L1: every SiteControl on this plan with status PROPOSED becomes APPROVED, its next_certification_due_on is recomputed and its version increments by 1"
      - "cascade L1: VcpEnrollment ENROLLED -> REMEDY_APPROVED with its version incremented by 1"
      - "cascade L1: every other RemedialActionPlan on the same enrollment in DRAFT or REVISION_REQUESTED becomes WITHDRAWN with its version incremented by 1"
      - "increments RemedialActionPlan.version by 1"

  # ---------------------------------------------------------- CostCapPolicy ----
  - method: POST
    path: "/cost-cap-policies"
    description: "Quotes a cost-cap policy against a plan, running the UNDERWRITING-variant estimate and the §1.3 cost_cap_premium tier ladder. OCC-guarded on the plan (§1.2.1 policy-quote-stale-plan): expected_remedial_action_plan_version must equal the plan's current version, because a fresh quote legitimately supersedes the prior QUOTED policy."
    roles: [Insurer]
    code: 201
    input: ["remedial_action_plan_id", "insurer_party_id", "policy_reference", "term_years", "expected_remedial_action_plan_version"]
    output: CostCapPolicy
    side_effects:
      - "computes underwriting_estimate_cents (UNDERWRITING variant), attachment_point_cents, buffer_layer_cents, limit_cents, rate_applied and premium_cents per §1.3 cost_cap_premium"
      - "sets status QUOTED and bound_at null"
      - "cascade: any prior CostCapPolicy on the same plan with status QUOTED becomes SUPERSEDED with its version incremented by 1"
      - "increments RemedialActionPlan.version by 1"

  - method: GET
    path: "/cost-cap-policies"
    description: "Lists cost-cap policies filterable by plan, insurer and status."
    roles: [Insurer, StateAgencyReviewer, Redeveloper, Lender, EnvironmentalConsultant]
    code: 200
    input: ["remedial_action_plan_id?", "insurer_party_id?", "status?", "limit?", "offset?"]
    output: CostCapPolicy[]
    side_effects: []

  - method: GET
    path: "/cost-cap-policies/{id}"
    description: "Retrieves one policy with the full underwriting derivation."
    roles: [Insurer, StateAgencyReviewer, Redeveloper, Lender, EnvironmentalConsultant]
    code: 200
    input: []
    output: CostCapPolicy
    side_effects: []

  - method: POST
    path: "/cost-cap-policies/{id}/bind"
    description: "Binds a QUOTED policy on an APPROVED plan. Re-tests the attachment point against the plan's current design estimate and the carrier's minimum limit, then folds the premium into the plan's funding need and re-derives the funding waterfall."
    roles: [Insurer]
    code: 200
    input: []
    output: CostCapPolicy
    side_effects:
      - "sets bound_at from the logical clock and status BOUND"
      - "cascade L1: RemedialActionPlan.total_funding_need_cents becomes total_estimate_cents + premium_cents and its version increments by 1"
      - "cascade L2: every FundingAward on the site with status AWARDED has allocated_cents re-derived by §1.3 funding_assembly_waterfall, with each changed award's version incremented by 1"
      - "increments CostCapPolicy.version by 1"

  # -------------------------------------------------------------- SiteControl ----
  - method: POST
    path: "/site-controls"
    description: "Proposes an engineering or institutional control on a plan, reserving a closed inclusive coverage interval for the named sub-area. ENGINEERING controls must clear a symmetric 30-day changeover buffer against every other ENGINEERING control on the same site and sub_area_code."
    roles: [EnvironmentalConsultant]
    code: 201
    input: ["site_id", "remedial_action_plan_id", "control_type", "sub_area_code", "coverage_from", "coverage_to", "inspection_interval_days"]
    output: SiteControl
    side_effects:
      - "derives control_class (ENGINEERING for VAPOR_MITIGATION and ENGINEERED_CAP, INSTITUTIONAL otherwise)"
      - "sets status PROPOSED, impairment_count 0, last_certified_on null and next_certification_due_on = coverage_from + inspection_interval_days"

  - method: GET
    path: "/site-controls"
    description: "Lists controls filterable by site, plan, sub-area and status."
    roles: [EnvironmentalConsultant, StateAgencyReviewer, Redeveloper, Insurer, Lender]
    code: 200
    input: ["site_id?", "remedial_action_plan_id?", "sub_area_code?", "status?", "control_class?", "limit?", "offset?"]
    output: SiteControl[]
    side_effects: []

  - method: GET
    path: "/site-controls/{id}"
    description: "Retrieves one control with its coverage interval and impairment counters."
    roles: [EnvironmentalConsultant, StateAgencyReviewer, Redeveloper, Insurer, Lender]
    code: 200
    input: []
    output: SiteControl
    side_effects: []

  - method: POST
    path: "/site-controls/{id}/operation-certification"
    description: "Owner files an operation-and-maintenance certification. condition PASS moves APPROVED/IMPAIRED -> OPERATING (or re-certifies an OPERATING control); condition FAIL moves OPERATING -> IMPAIRED and restricts the site."
    roles: [Redeveloper]
    code: 200
    input: ["condition", "certification_date"]
    output: SiteControl
    side_effects:
      - "on PASS: sets last_certified_on = certification_date, recomputes next_certification_due_on, clears impaired_since, and on the first PASS for the plan moves VcpEnrollment REMEDY_APPROVED -> IMPLEMENTATION"
      - "on PASS from IMPAIRED: decrements Site.impaired_control_count and returns Site.cleanup_posture to OPEN when the count reaches 0 and bfpp_status != FORFEITED"
      - "on FAIL: sets impaired_since, increments impairment_count by 1, increments Site.impaired_control_count, sets Site.cleanup_posture RESTRICTED unless already FROZEN, and moves VcpEnrollment COMPLETION_REVIEW -> IMPLEMENTATION incrementing reverted_completion_count by 1"
      - "increments SiteControl.version by 1, Site.version by 1 and VcpEnrollment.version by 1 when the enrollment moved"

  - method: POST
    path: "/site-controls/{id}/decommission"
    description: "Retires an OPERATING control once every cleanup goal crediting it is ATTAINED and no lender-accepted restricted closure still relies on it."
    roles: [StateAgencyReviewer]
    code: 200
    input: ["decommission_note?"]
    output: SiteControl
    side_effects:
      - "sets status DECOMMISSIONED (terminal) and increments SiteControl.version by 1"

  # -------------------------------------------------------------- FundingAward ----
  - method: POST
    path: "/funding-awards"
    description: "Files a grant or tax-credit application against a site with its programme ceiling, share cap, match requirement, eligible cost categories and filed eligibility documents."
    roles: [Redeveloper]
    code: 201
    input: ["site_id", "program_code", "funding_kind", "program_priority", "max_award_cents", "max_share_pct", "match_requirement_pct", "eligible_cost_categories", "eligibility_documents?"]
    output: FundingAward
    side_effects:
      - "sets status APPLIED and allocated_cents 0"

  - method: GET
    path: "/funding-awards"
    description: "Lists funding applications filterable by site, kind and status."
    roles: [Redeveloper, StateAgencyReviewer, Lender, Insurer]
    code: 200
    input: ["site_id?", "funding_kind?", "status?", "limit?", "offset?"]
    output: FundingAward[]
    side_effects: []

  - method: GET
    path: "/funding-awards/{id}"
    description: "Retrieves one funding application with its current allocated_cents."
    roles: [Redeveloper, StateAgencyReviewer, Lender, Insurer]
    code: 200
    input: []
    output: FundingAward
    side_effects: []

  - method: POST
    path: "/funding-awards/{id}/decision"
    description: "Agency decision on a funding application: AWARD (documentation-gated, requires an APPROVED plan and cleanup_posture OPEN), DENY, or RESCIND as a compensating action on an already AWARDED application."
    roles: [StateAgencyReviewer]
    code: 200
    input: ["decision", "decision_note?"]
    output: FundingAward
    side_effects:
      - "sets decided_by_user_id"
      - "on AWARD: re-derives allocated_cents for every AWARDED award on the site per §1.3 funding_assembly_waterfall, ordered by program_priority ASC then created_at ASC"
      - "on RESCIND: sets this award's allocated_cents to 0 and re-derives the remaining AWARDED awards so that sum(allocated_cents) + unfunded_gap_cents still equals total_funding_need_cents"
      - "increments FundingAward.version by 1 for every award whose allocated_cents changed"

  # ------------------------------------------------------ NoFurtherActionLetter ----
  - method: POST
    path: "/nfa-letters"
    description: "Drafts a no-further-action letter request for an enrollment at the requested closure scope."
    roles: [Redeveloper]
    code: 201
    input: ["site_id", "vcp_enrollment_id", "requested_scope"]
    output: NoFurtherActionLetter
    side_effects:
      - "sets status DRAFT, reissue_count 0, controls_certified_count 0"

  - method: GET
    path: "/nfa-letters"
    description: "Lists no-further-action letters filterable by site, enrollment and status."
    roles: [Redeveloper, StateAgencyReviewer, Lender, Insurer, EnvironmentalConsultant]
    code: 200
    input: ["site_id?", "vcp_enrollment_id?", "status?", "limit?", "offset?"]
    output: NoFurtherActionLetter[]
    side_effects: []

  - method: GET
    path: "/nfa-letters/{id}"
    description: "Retrieves one letter with its issuance, acceptance and revocation history."
    roles: [Redeveloper, StateAgencyReviewer, Lender, Insurer, EnvironmentalConsultant]
    code: 200
    input: []
    output: NoFurtherActionLetter
    side_effects: []

  - method: POST
    path: "/nfa-letters/{id}/issue"
    description: "Issues (or re-issues after a curable control failure) the letter. The issuing reviewer may not be the reviewer who approved the plan, every control must be OPERATING, and an UNRESTRICTED scope requires every cleanup goal to be UNRESTRICTED."
    roles: [StateAgencyReviewer]
    code: 200
    input: []
    output: NoFurtherActionLetter
    side_effects:
      - "sets issued_on from the logical clock date, issued_by_user_id and controls_certified_count from the OPERATING controls on the site"
      - "on the first issuance: cascade L1 VcpEnrollment COMPLETION_REVIEW -> CLOSED with its version incremented by 1"
      - "on re-issuance from REVOKED: increments reissue_count by 1 and clears revocation_reason"
      - "increments NoFurtherActionLetter.version by 1"

  - method: POST
    path: "/nfa-letters/{id}/lender-acceptance"
    description: "Lender or investor records reliance on an ISSUED letter. Requires cleanup_posture OPEN and bfpp_status ESTABLISHED."
    roles: [Lender]
    code: 200
    input: ["lender_reference"]
    output: NoFurtherActionLetter
    side_effects:
      - "stores accepted_by_lender_user_id from X-User-ID and lender_reference, and sets status ACCEPTED_BY_LENDER"
      - "increments NoFurtherActionLetter.version by 1"

  # ---------------------------------------------------------- MonitoringEvent ----
  - method: POST
    path: "/monitoring-events"
    description: "Schedules a long-term monitoring event against a cleanup goal and (optionally) the control whose performance it verifies, reserving a half-open laboratory analysis window. Refused when the lab already has concurrent_capacity overlapping reservations."
    roles: [EnvironmentalConsultant]
    code: 201
    input: ["site_id", "laboratory_id", "cleanup_goal_id", "event_type", "monitoring_period_code", "sample_date", "window_start", "window_end", "site_control_id?"]
    output: MonitoringEvent
    side_effects:
      - "sets status SCHEDULED, result_status PENDING, result_value_ugl null and control_condition null"

  - method: GET
    path: "/monitoring-events"
    description: "Lists monitoring events filterable by site, laboratory, goal, control and status."
    roles: [EnvironmentalConsultant, StateAgencyReviewer, Redeveloper, Lender, Insurer]
    code: 200
    input: ["site_id?", "laboratory_id?", "cleanup_goal_id?", "site_control_id?", "event_type?", "status?", "limit?", "offset?"]
    output: MonitoringEvent[]
    side_effects: []

  - method: GET
    path: "/monitoring-events/{id}"
    description: "Retrieves one monitoring event with its reported result and derived result_status."
    roles: [EnvironmentalConsultant, StateAgencyReviewer, Redeveloper, Lender, Insurer]
    code: 200
    input: []
    output: MonitoringEvent
    side_effects: []

  - method: POST
    path: "/monitoring-events/{id}/results"
    description: "Files the laboratory result (or inspection verdict) for a SCHEDULED event, re-running the chronological attainment replay on the referenced cleanup goal and impairing the verified control on an exceedance."
    roles: [EnvironmentalConsultant]
    code: 200
    input: ["result_value_ugl?", "control_condition?"]
    output: MonitoringEvent
    side_effects:
      - "stores result_value_ugl and/or control_condition, sets status REPORTED and derives result_status (COMPLIANT when result_value_ugl <= CleanupGoal.goal_ugl, EXCEEDANCE otherwise)"
      - "recomputes the referenced CleanupGoal's compliant_streak and attainment_status by full chronological replay per §1.3 goal_attainment_streak and increments CleanupGoal.version by 1"
      - "on EXCEEDANCE with a non-null site_control_id: that SiteControl OPERATING -> IMPAIRED, Site.impaired_control_count increments, Site.cleanup_posture becomes RESTRICTED unless already FROZEN, VcpEnrollment COMPLETION_REVIEW -> IMPLEMENTATION, and every NoFurtherActionLetter on the site in ISSUED or ACCEPTED_BY_LENDER becomes REVOKED with revocation_reason CONTROL_FAILURE, which rescinds every AWARDED FundingAward on the site"
      - "increments MonitoringEvent.version by 1 and the version of every entity touched by the cascade"

# -----------------------------------------------------------------------------
# §1.6 Error Code Catalog
# -----------------------------------------------------------------------------
errors:

  # --- authentication, authorization, request shape -------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing or blank."
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "The acting X-User-Role is not listed in the endpoint's roles."
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "Malformed request: missing required field, wrong type, unknown enum member, out-of-range number, unparseable or inverted date interval, or a conditionally-required field supplied in the wrong combination (priority 3)."
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "An entity-backed role acts on a resource it does not own: Redeveloper X-User-ID != Site.owner_party_id, EnvironmentalConsultant X-User-ID != AssessmentPhase.consultant_party_id, or Insurer X-User-ID != CostCapPolicy.insurer_party_id."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The acting reviewer is the same opaque user id that imposed the obligation being void-certified, or that approved the plan whose no-further-action letter is being issued."

  # --- existence -----------------------------------------------------------
  - id: ERR_PARTY_NOT_FOUND
    http: 404
    condition: "A referenced Party id does not exist."
  - id: ERR_LAB_NOT_FOUND
    http: 404
    condition: "A referenced Laboratory id does not exist."
  - id: ERR_SITE_NOT_FOUND
    http: 404
    condition: "A referenced Site id does not exist."
  - id: ERR_PHASE_NOT_FOUND
    http: 404
    condition: "A referenced AssessmentPhase id (path id, supersedes_phase_id, aai_phase_id or basis_assessment_phase_id) does not exist."
  - id: ERR_FINDING_NOT_FOUND
    http: 404
    condition: "A referenced ContaminantFinding id does not exist."
  - id: ERR_GOAL_NOT_FOUND
    http: 404
    condition: "A referenced CleanupGoal id does not exist."
  - id: ERR_PROTECTION_NOT_FOUND
    http: 404
    condition: "A referenced LiabilityProtection id does not exist."
  - id: ERR_OBLIGATION_NOT_FOUND
    http: 404
    condition: "A referenced ContinuingObligation id does not exist."
  - id: ERR_ENROLLMENT_NOT_FOUND
    http: 404
    condition: "A referenced VcpEnrollment id does not exist."
  - id: ERR_PLAN_NOT_FOUND
    http: 404
    condition: "A referenced RemedialActionPlan id does not exist."
  - id: ERR_POLICY_NOT_FOUND
    http: 404
    condition: "A referenced CostCapPolicy id does not exist."
  - id: ERR_CONTROL_NOT_FOUND
    http: 404
    condition: "A referenced SiteControl id does not exist."
  - id: ERR_AWARD_NOT_FOUND
    http: 404
    condition: "A referenced FundingAward id does not exist."
  - id: ERR_LETTER_NOT_FOUND
    http: 404
    condition: "A referenced NoFurtherActionLetter id does not exist."
  - id: ERR_EVENT_NOT_FOUND
    http: 404
    condition: "A referenced MonitoringEvent id does not exist."

  # --- referential typing and uniqueness -----------------------------------
  - id: ERR_PARTY_TYPE_MISMATCH
    http: 422
    condition: "A Party is referenced in a slot that requires a different party_type (REDEVELOPER for site ownership and funding applications, CONSULTANT for assessment and monitoring work, INSURER for cost-cap placement)."
  - id: ERR_DUPLICATE_LIABILITY_PROTECTION
    http: 409
    condition: "A second LiabilityProtection is created for a site that already has one."

  # --- site posture gates --------------------------------------------------
  - id: ERR_SITE_FROZEN
    http: 409
    condition: "Site.cleanup_posture == FROZEN (the BFPP defence is forfeited); every mutating child endpoint is refused except the compliance sweep, void-certification and the clock endpoint."
  - id: ERR_SITE_POSTURE_RESTRICTED
    http: 409
    condition: "Site.cleanup_posture == RESTRICTED (an impaired control) blocks a closure-critical operation that requires OPEN."

  # --- state-machine preconditions ----------------------------------------
  - id: ERR_INVALID_PHASE_STATE
    http: 409
    condition: "The AssessmentPhase's current status does not permit the requested trigger (e.g. reviewing a DRAFT phase, submitting an APPROVED or REJECTED phase, adding a finding to a phase that is no longer DRAFT or REVISION_REQUESTED)."
  - id: ERR_INVALID_OBLIGATION_STATE
    http: 409
    condition: "The ContinuingObligation's status does not permit the trigger (certifying an already SATISFIED or LAPSED duty, voiding a certification on a duty with certification_count 0)."
  - id: ERR_INVALID_ENROLLMENT_STATE
    http: 409
    condition: "The VcpEnrollment's status does not permit the trigger (deciding eligibility twice, requesting completion outside IMPLEMENTATION, withdrawing a CLOSED, REJECTED or WITHDRAWN enrollment, filing a plan against a terminal enrollment)."
  - id: ERR_INVALID_PLAN_STATE
    http: 409
    condition: "The RemedialActionPlan's status does not permit the trigger (reviewing a DRAFT plan, approving from a state other than PUBLIC_COMMENT, submitting an APPROVED or WITHDRAWN plan)."
  - id: ERR_INVALID_POLICY_STATE
    http: 409
    condition: "The CostCapPolicy is not QUOTED when a bind is attempted (already BOUND, SUPERSEDED by a newer quote, or CANCELLED by a revision request or enrollment withdrawal)."
  - id: ERR_INVALID_CONTROL_STATE
    http: 409
    condition: "The SiteControl's status does not permit the trigger (certifying a PROPOSED or DECOMMISSIONED control, decommissioning a control that is not OPERATING)."
  - id: ERR_INVALID_AWARD_STATE
    http: 409
    condition: "The FundingAward's status does not permit the decision (awarding or denying an already decided application, rescinding an application that is not AWARDED)."
  - id: ERR_INVALID_LETTER_STATE
    http: 409
    condition: "The NoFurtherActionLetter's status does not permit the trigger (issuing an already ISSUED letter, lender acceptance of a DRAFT or REVOKED letter)."
  - id: ERR_EVENT_ALREADY_REPORTED
    http: 409
    condition: "Results are filed against a MonitoringEvent that is already REPORTED."
  - id: ERR_SITE_ALREADY_ACQUIRED
    http: 409
    condition: "A second acquisition is recorded on a site whose acquisition_status is already ACQUIRED."
  - id: ERR_INQUIRY_DEFICIENT
    http: 409
    condition: "An inquiry completion is filed on a protection whose inquiry_state is AAI_DEFICIENT, which is terminal in that dimension."
  - id: ERR_JOIN_NOT_SATISFIED
    http: 409
    condition: "Fork-join violation: the plan is approved before technical_review_state == PASSED and public_comment_state == CLOSED, or the comment period is closed before the technical branch has PASSED."

  # --- optimistic concurrency ---------------------------------------------
  - id: ERR_STALE_ENROLLMENT_VERSION
    http: 412
    condition: "expected_vcp_enrollment_version does not match the enrollment's current version on POST /remedial-action-plans (§1.2.1 plan-create-stale-enrollment)."
  - id: ERR_STALE_PLAN_VERSION
    http: 412
    condition: "expected_remedial_action_plan_version does not match the plan's current version on POST /cost-cap-policies (§1.2.1 policy-quote-stale-plan)."

  # --- safety / regulatory -------------------------------------------------
  - id: ERR_MEDIA_NOT_DELINEATED
    http: 422
    condition: "A PHASE_II or SUPPLEMENTAL phase claiming delineation_complete == true is approved while some finding with exceedance_factor > 1.0 still has delineated == false."
  - id: ERR_CREDITED_CONTROL_MISSING
    http: 422
    condition: "A plan is approved while a RESTRICTED cleanup goal credits a control_credit_type for which the plan has no SiteControl in PROPOSED, APPROVED or OPERATING."
  - id: ERR_CONTROLS_NOT_OPERATING
    http: 422
    condition: "A letter is issued, re-issued, or a completion is requested while some SiteControl on the enrollment's approved plan is not OPERATING."
  - id: ERR_UNRESTRICTED_SCOPE_NOT_SUPPORTED
    http: 422
    condition: "requested_scope == UNRESTRICTED while at least one CleanupGoal on the site has basis == RESTRICTED."
  - id: ERR_LETTER_NOT_CURABLE
    http: 422
    condition: "Re-issuance is attempted on a REVOKED letter whose revocation_reason is BFPP_FORFEITED."
  - id: ERR_CONTROL_STILL_REQUIRED
    http: 422
    condition: "Decommissioning is attempted while a cleanup goal crediting the control is not ATTAINED, or while a lender-accepted RESTRICTED_WITH_CONTROLS letter still relies on it."

  # --- temporal and resource-overlap --------------------------------------
  - id: ERR_AAI_AFTER_ACQUISITION
    http: 422
    condition: "aai_report_date is later than the acquisition reference date (acquisition_date when ACQUIRED, otherwise planned_acquisition_date)."
  - id: ERR_AAI_REPORT_STALE
    http: 422
    condition: "The inquiry report is more than 180 days older than the reference date (181 days is the first rejected age)."
  - id: ERR_CONTROL_COVERAGE_CONFLICT
    http: 409
    condition: "A proposed ENGINEERING control's closed inclusive coverage interval overlaps, or falls within the symmetric 30-day changeover buffer of, an existing non-decommissioned ENGINEERING control on the same site and sub_area_code."
  - id: ERR_LAB_CAPACITY_EXCEEDED
    http: 409
    condition: "The count of existing SCHEDULED or REPORTED monitoring events on the laboratory whose half-open [window_start, window_end) intersects the requested window already equals Laboratory.concurrent_capacity."
  - id: ERR_CERTIFICATION_WINDOW_CLOSED
    http: 422
    condition: "A continuing obligation is certified after its due_date has passed on the logical clock."
  - id: ERR_CERTIFICATION_OUTSIDE_COVERAGE
    http: 422
    condition: "An operation certification's certification_date falls outside the control's inclusive [coverage_from, coverage_to] interval."
  - id: ERR_RESULTS_BEFORE_WINDOW
    http: 422
    condition: "Monitoring results are filed before the reserved analysis window has opened on the logical clock."

  # --- cross-entity referential -------------------------------------------
  - id: ERR_PHASE_I_NOT_APPROVED
    http: 422
    condition: "aai_phase_id does not reference an APPROVED PHASE_I assessment phase on this protection's site."
  - id: ERR_BASIS_PHASE_INELIGIBLE
    http: 422
    condition: "basis_assessment_phase_id does not reference an APPROVED PHASE_II or SUPPLEMENTAL phase with delineation_complete == true on the plan's site."
  - id: ERR_PINNED_GOAL_VERSION_STALE
    http: 409
    condition: "At approval, an entry of pinned_cleanup_goal_versions no longer matches the referenced CleanupGoal's current version because the goal was re-derived after submission."
  - id: ERR_ENROLLMENT_NOT_ELIGIBLE
    http: 422
    condition: "An enrollment decision of ENROLL is issued while the site has no LiabilityProtection or its inquiry_state is not AAI_COMPLETE."
  - id: ERR_CONTROL_COMMITMENT_MISSING
    http: 422
    condition: "A RESTRICTED_CLOSURE enrollment is accepted while Site.institutional_control_committed is false."
  - id: ERR_GOALS_NOT_ATTAINED
    http: 422
    condition: "A completion request is filed while at least one CleanupGoal on the site has attainment_status == NOT_ATTAINED."
  - id: ERR_PLAN_SITE_MISMATCH
    http: 422
    condition: "Cross-aggregate incoherence: plan site_id != enrollment site_id, control plan on a different site, monitoring event goal or control on a different site, or letter enrollment on a different site."

  # --- constraint satisfaction --------------------------------------------
  - id: ERR_DELINEATION_REQUIRED
    http: 422
    condition: "A VCP enrollment is created while Site.delineation_status == NONE (no APPROVED PHASE_I)."
  - id: ERR_NO_FINDINGS
    http: 422
    condition: "An assessment phase with findings_count == 0 is submitted."
  - id: ERR_NO_CLEANUP_GOALS
    http: 422
    condition: "A plan is submitted while its site has no CleanupGoal to pin."
  - id: ERR_ASSESSMENT_REVISION_LIMIT
    http: 409
    condition: "A phase already at review_round 3 is submitted again after rejection."
  - id: ERR_PLAN_REVISION_LIMIT
    http: 409
    condition: "A third REQUEST_REVISION decision is issued on a plan whose revision_round is already 2."
  - id: ERR_MISSING_ELIGIBILITY_DOCUMENT
    http: 422
    condition: "An AWARD decision is issued while eligibility_documents lacks a code required for the award's funding_kind."
  - id: ERR_APPROVED_PLAN_EXISTS
    http: 409
    condition: "An enrollment withdrawal is attempted while one of its plans is APPROVED."
  - id: ERR_PLAN_NOT_EDITABLE
    http: 409
    condition: "A plan is edited while its status is not DRAFT or REVISION_REQUESTED."

  # --- fiscal --------------------------------------------------------------
  - id: ERR_ATTACHMENT_POINT_TOO_LOW
    http: 422
    condition: "At bind, attachment_point_cents < round_half_up(RemedialActionPlan.total_estimate_cents * 1.05) — the quoted buffer no longer sits above the plan's current design estimate."
  - id: ERR_LIMIT_BELOW_MINIMUM
    http: 422
    condition: "At bind, limit_cents < 25000000 (the carrier's minimum 250,000.00 cap limit)."
  - id: ERR_FUNDING_NEED_UNDETERMINED
    http: 422
    condition: "An AWARD decision is issued while the site has no APPROVED RemedialActionPlan, so the funding need is undefined."
  - id: ERR_NO_ELIGIBLE_COST_BASE
    http: 422
    condition: "An AWARD decision is issued while no cost line of the approved plan falls in the award's eligible_cost_categories, making the eligible base zero."

# -----------------------------------------------------------------------------
# §1.7 RBAC Matrix
# -----------------------------------------------------------------------------
roles:

  - name: Redeveloper
    description: "The brownfield redeveloper acquiring and cleaning the parcel. Owns the site, opens the liability-protection file, enrols in the voluntary cleanup program, certifies continuing obligations and control operation, and assembles funding."
    identity: "entity_backed:Party"
    exclusive_operations:
      - "POST /sites"
      - "POST /sites/{id}/acquisition"
      - "POST /liability-protections"
      - "POST /vcp-enrollments"
      - "POST /vcp-enrollments/{id}/completion-request"
      - "POST /vcp-enrollments/{id}/withdraw"
      - "POST /continuing-obligations/{id}/certify"
      - "POST /site-controls/{id}/operation-certification"
      - "POST /funding-awards"
      - "POST /nfa-letters"
    shared_operations:
      - "POST /sites/{id}/cleanup-goals (shared with EnvironmentalConsultant)"
      - "POST /_clock/set_current_utc"
      - "every GET in §1.5 except GET /parties/{id} restrictions (read access is open to all six roles)"
    note: "X-User-ID is the id of a Party with party_type == REDEVELOPER and must equal Site.owner_party_id of the site the target resource belongs to (§1.4 priority 6)."

  - name: EnvironmentalConsultant
    description: "The licensed environmental professional who performs assessment phases, records findings, derives risk-based goals, files remedial action plans, proposes controls and reports monitoring results."
    identity: "entity_backed:Party"
    exclusive_operations:
      - "POST /assessment-phases"
      - "POST /assessment-phases/{id}/contaminant-findings"
      - "POST /assessment-phases/{id}/submit"
      - "POST /liability-protections/{id}/inquiry-completion"
      - "POST /remedial-action-plans"
      - "PATCH /remedial-action-plans/{id}"
      - "POST /remedial-action-plans/{id}/submit"
      - "POST /site-controls"
      - "POST /monitoring-events"
      - "POST /monitoring-events/{id}/results"
    shared_operations:
      - "POST /sites/{id}/cleanup-goals (shared with Redeveloper)"
      - "POST /_clock/set_current_utc"
      - "every GET in §1.5"
    note: "X-User-ID is the id of a Party with party_type == CONSULTANT and must equal AssessmentPhase.consultant_party_id when advancing a phase."

  - name: Insurer
    description: "The environmental carrier that underwrites and binds the cost-cap (stop-loss) policy over the remediation estimate."
    identity: "entity_backed:Party"
    exclusive_operations:
      - "POST /cost-cap-policies"
      - "POST /cost-cap-policies/{id}/bind"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "GET /sites, GET /sites/{id}, GET /sites/{id}/funding-assembly, GET /remedial-action-plans, GET /remedial-action-plans/{id}, GET /cost-cap-policies, GET /cost-cap-policies/{id}, and the other read endpoints listing this role"
    note: "X-User-ID is the id of a Party with party_type == INSURER and must equal CostCapPolicy.insurer_party_id at bind."

  - name: StateAgencyReviewer
    description: "The voluntary-cleanup-program case reviewer. Decides assessment reviews, enrollment eligibility, technical review, public comment closure, plan approval, funding decisions, control decommissioning and letter issuance, and runs the compliance sweep."
    identity: "opaque"
    exclusive_operations:
      - "POST /compliance-sweeps"
      - "POST /assessment-phases/{id}/review"
      - "POST /liability-protections/{id}/continuing-obligations"
      - "POST /continuing-obligations/{id}/void-certification"
      - "POST /vcp-enrollments/{id}/eligibility-decision"
      - "POST /remedial-action-plans/{id}/technical-review"
      - "POST /remedial-action-plans/{id}/public-comment-close"
      - "POST /remedial-action-plans/{id}/approve"
      - "POST /site-controls/{id}/decommission"
      - "POST /funding-awards/{id}/decision"
      - "POST /nfa-letters/{id}/issue"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "every GET in §1.5"
    note: "X-User-ID is an opaque agency operator identifier, never a Party id. It is persisted on reviewed_by_user_id, imposed_by_user_id, eligibility_decided_by_user_id, approved_by_user_id, decided_by_user_id and issued_by_user_id, and drives the two separation-of-duties rules (§1.4 priority 7)."

  - name: Lender
    description: "The lender or equity investor relying on the closure letter. Records acceptance of an issued no-further-action letter and reads the funding assembly."
    identity: "opaque"
    exclusive_operations:
      - "POST /nfa-letters/{id}/lender-acceptance"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "GET /sites, GET /sites/{id}, GET /sites/{id}/funding-assembly, GET /sites/{id}/funding-awards, GET /nfa-letters, GET /nfa-letters/{id}, GET /remedial-action-plans, GET /site-controls, GET /monitoring-events and the other read endpoints listing this role"
    note: "X-User-ID is an opaque lender operator identifier persisted as NoFurtherActionLetter.accepted_by_lender_user_id; it is never compared to any Party id."

  - name: ProgramAdmin
    description: "Platform operator that maintains the party registry and the accredited laboratory list."
    identity: "opaque"
    exclusive_operations:
      - "POST /parties"
      - "POST /laboratories"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "GET /parties, GET /parties/{id}, GET /laboratories, GET /laboratories/{id}, GET /sites, GET /sites/{id}"
    note: "X-User-ID is an opaque platform operator identifier tied to no persisted entity."
