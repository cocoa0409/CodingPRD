              as: LabAnalyst
              captures: {r2: $.data.break_result}
          assert:
            - "s2.break_result == CONFORMING (window of 2 sets: (4500+4300)/2 = 4400 >= 4400, floor 3900 ok)"

      - name: soil_boundary_already_covered
        claim_type: correct_result
        grounds: [calculations.soil_compaction_evaluation]
        excluded_because:
          difficulty_instance: boundary_precision_check / soil_compaction_exactly_95_percent_passes
          rationale: "Threshold >= semantics at exactly 95.0 asserted in the named difficulty instance."

      - name: break_tolerance_already_covered
        claim_type: correct_result
        grounds: [calculations.break_window_tolerance]
        excluded_because:
          difficulty_instance: boundary_precision_check / break_window_tolerance_inclusive_edge
