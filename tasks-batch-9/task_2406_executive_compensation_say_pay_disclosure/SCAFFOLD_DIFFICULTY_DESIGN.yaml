  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: revenue_ratio_rounds_to_band_edge_accepted_then_next_tick_rejected
        grounds:
          - calculations.peer_size_band_fit
          - validations.priority_42_ERR_PEER_OUTSIDE_SIZE_BAND
          - entities.PeerGroupMember.fields.revenue_ratio
          - entities.PeerGroupMember.fields.in_size_band
        distinguishing_aspect: |
          Three peers straddle REVENUE_BAND_HIGH 2.00 at the FOURTH decimal place, which is exactly where
          peer_size_band_fit rounds. DLTA is exactly 2.0000; GAMM's true ratio 2.00004 rounds DOWN to 2.0000 and
          must be admitted; HOTL's true ratio 2.00005 round_half_up to 2.0001 and must be rejected. Rounding
          before comparing versus comparing before rounding gives opposite verdicts for GAMM, and treating the
          band as half-open gives the wrong verdict for DLTA. The separation between accept and reject is 100,000
          on a revenue of 20 billion.
        test_recipe:
          setup:
            - "Issuer ACME with revenue_usd 10,000,000,000 and market_cap_usd 20,000,000,000."
            - "Peer DLTA revenue_usd 20,000,000,000, market_cap_usd 40,000,000,000 -> revenue_ratio exactly 2.0000."
            - "Peer GAMM revenue_usd 20,000,400,000, market_cap_usd 40,000,000,000 -> true ratio 2.00004, rounds to 2.0000."
            - "Peer HOTL revenue_usd 20,000,500,000, market_cap_usd 40,000,000,000 -> true ratio 2.00005, rounds to 2.0001."
            - "A DRAFT peer group PG on ACME; all three peers are offered with inclusion_reason SIZE_MATCH so the band is enforced (BUSINESS_MODEL_ANALOG would waive it)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CompConsultant
            - call: "POST /exec-comp/companies"
              payload: { legal_name: "Acme Industries Inc", ticker: "ACME", is_issuer: true, gics_sector: "TECH", revenue_usd: 10000000000, market_cap_usd: 20000000000, share_price_usd: 50.00, ceo_tdc_usd: 15000000 }
              as: CompConsultant
              captures: { acme_id: $.data.id }
            - call: "POST /exec-comp/companies"
              payload: { legal_name: "Delta Systems", ticker: "DLTA", is_issuer: false, gics_sector: "TECH", revenue_usd: 20000000000, market_cap_usd: 40000000000, share_price_usd: 80.00, ceo_tdc_usd: 24000000 }
              as: CompConsultant
              captures: { dlta_id: $.data.id }
            - call: "POST /exec-comp/companies"
              payload: { legal_name: "Gamma Networks", ticker: "GAMM", is_issuer: false, gics_sector: "TECH", revenue_usd: 20000400000, market_cap_usd: 40000000000, share_price_usd: 80.00, ceo_tdc_usd: 24000000 }
              as: CompConsultant
              captures: { gamm_id: $.data.id }
            - call: "POST /exec-comp/companies"
              payload: { legal_name: "Hotel Data Corp", ticker: "HOTL", is_issuer: false, gics_sector: "TECH", revenue_usd: 20000500000, market_cap_usd: 40000000000, share_price_usd: 80.00, ceo_tdc_usd: 24000000 }
              as: CompConsultant
              captures: { hotl_id: $.data.id }
            - call: "POST /exec-comp/peer-groups"
              payload: { issuer_company_id: "${acme_id}", fiscal_year: 2026, benchmark_basis: "RAW_MEDIAN" }
              as: CompConsultant
              captures: { pg_id: $.data.id, pg_v0: $.data.version }
            - call: "POST /exec-comp/peer-groups/${pg_id}/members"
              payload: { peer_company_id: "${dlta_id}", inclusion_reason: "SIZE_MATCH", expected_peer_group_version: "${pg_v0}" }
              as: CompConsultant
              captures: { mem_dlta_id: $.data.id }
            - call: "GET /exec-comp/peer-groups/${pg_id}"
              as: CompConsultant
              captures: { pg_v1: $.data.version }
            - call: "POST /exec-comp/peer-groups/${pg_id}/members"
              payload: { peer_company_id: "${gamm_id}", inclusion_reason: "SIZE_MATCH", expected_peer_group_version: "${pg_v1}" }
              as: CompConsultant
              captures: { mem_gamm_id: $.data.id }
            - call: "GET /exec-comp/peer-groups/${pg_id}"
              as: CompConsultant
              captures: { pg_v2: $.data.version }
          trigger:
            - call: "POST /exec-comp/peer-groups/${pg_id}/members"
              payload: { peer_company_id: "${hotl_id}", inclusion_reason: "SIZE_MATCH", expected_peer_group_version: "${pg_v2}" }
              as: CompConsultant
          assert:
            - "the DLTA add returned 201 with PeerGroupMember.${mem_dlta_id}.revenue_ratio == 2.0000, market_cap_ratio == 2.0000, in_size_band == true, status == ACCEPTED"
            - "the GAMM add returned 201 with PeerGroupMember.${mem_gamm_id}.revenue_ratio == 2.0000 (NOT 2.00004) and in_size_band == true"
            - "the HOTL trigger returns HTTP 422 with error_id == ERR_PEER_OUTSIDE_SIZE_BAND"
            - "no PeerGroupMember row exists for HOTL and PeerGroup.${pg_id}.version equals the value captured as pg_v2"
            - "GET /exec-comp/peer-groups/${pg_id}/members returns exactly 2 rows"
            - "re-offering HOTL with inclusion_reason BUSINESS_MODEL_ANALOG succeeds with in_size_band == false and revenue_ratio == 2.0001, confirming the rejection came from the band check and not from the ratio computation"

      - name: goal_adjustment_at_rounded_policy_limit_allowed_then_next_tick_rejected
        grounds:
          - calculations.goal_adjustment_magnitude
          - validations.priority_45_ERR_ADJUSTMENT_EXCEEDS_POLICY_LIMIT
          - entities.IncentiveMetric.fields.locked_target_value
          - state_machines.IncentiveMetric.LOCKED_to_ADJUSTED
        distinguishing_aspect: |
          The limit is tested at the 2-decimal rounding edge of a DERIVED percentage rather than at a stored
          field's edge: target 5.00 -> 5.7502 is a true 15.004% move that rounds to 15.00 and is therefore
          PERMITTED (the comparison is `>` against 15.00), while 5.00 -> 5.7526 is 15.052% which rounds to 15.05
          and is rejected. The same fixture also pins the anchor: the second adjustment is measured against
          locked_target_value 5.00, not against the 5.7502 left behind by the first adjustment.
        test_recipe:
          setup:
            - "MINI fixture with an APPROVED one-peer group and PayProgram P1."
            - "Two ANNUAL_INCENTIVE metrics with identical goal curves (threshold 4.00 / target 5.00 / maximum 6.00, HIGHER_IS_BETTER, LINEAR): ADJ_EPS weight_pct 60.00 and FCF_EPS weight_pct 40.00, so the vehicle weights total 100.00."
            - "The program is committee-approved, which cascades both metrics DRAFT -> LOCKED and snapshots locked_target_value = 5.00 on each."
            - "Both metrics' post-approval versions are read back so the OCC tokens are current. Only LOCKED -> ADJUSTED exists, so each metric can be adjusted at most once — hence two metrics for the two sides of the boundary."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CompConsultant
