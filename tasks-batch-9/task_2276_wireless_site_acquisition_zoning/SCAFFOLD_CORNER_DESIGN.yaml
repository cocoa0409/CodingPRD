# §1.9 Scaffold Corner Design (breadth probe)
# Task 2276 — Wireless Site Acquisition & Zoning
# Sections and claim_type values are taken from references/claim-extraction-guide.md.
# Corners already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as
# excluded_because: stubs that name the covering §1.8 instance.
scaffold_corner_design:

  # =========================================================================
  - section: entities
    instances:
      - name: corner_candidate_create_missing_required_field_rejected
        claim_type: required_fields
        grounds:
          - entities.Candidate.fields.agl_m
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /candidates without agl_m returns 400 ERR_INVALID_REQUEST and creates no Candidate row, leaving SearchRing.candidate_count at 0."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "one OPEN ring and one ACTIVE landlord in MKT-NE-01"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /jurisdictions"
              payload: { name: "Northeast Township", market_code: "MKT-NE-01", by_right_review_days: 60, conditional_use_review_days: 90, variance_review_days: 150, hearing_cadence_days: 14, requires_visual_simulation: true, min_visual_simulations: 2, max_continuances: 2, historic_district_flag: false, tribal_consultation_required: false, historical_delay_factor: 1.20, appeal_window_days: 30 }
              as: ZoningPlanner
              captures: { jur_id: $.data.id }
            - call: "POST /search-rings"
              payload: { name: "Ring 2276-A", market_code: "MKT-NE-01", center_lat: 42.3500, center_lon: -71.0600, radius_m: 800, required_agl_m: 45, objective_type: "COVERAGE_AND_CAPACITY", target_rsrp_dbm: -95, target_capacity_gbps: 10, market_benchmark_monthly_rent_usd: 2400.00, capex_budget_usd: 250000.00, priority_rank: 1 }
              as: RfEngineer
              captures: { ring_id: $.data.id }
            - call: "POST /search-rings/${ring_id}/open"
              as: RfEngineer
            - call: "POST /landlords"
              payload: { legal_name: "Beacon Holdings LLC", entity_type: "LLC", contact_email: "asset@beacon.example", market_code: "MKT-NE-01", outreach_optout: false }
              as: SiteAcquisitionAgent
              as_user_id: "agent-001"
              captures: { ll_id: $.data.id }
          trigger:
            - call: "POST /candidates"
              payload: { search_ring_id: "${ring_id}", landlord_id: "${ll_id}", jurisdiction_id: "${jur_id}", owning_agent_user_id: "agent-001", site_type: "TOWER", lat: 42.3510, lon: -71.0620, distance_from_center_m: 200, months_to_availability: 3, measured_rsrp_dbm: -88, offered_capacity_gbps: 10 }
              as: SiteAcquisitionAgent
              as_user_id: "agent-001"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 400"
            - "error_id == ERR_INVALID_REQUEST"
            - "SearchRing.${ring_id}.candidate_count == 0"
            - "GET /candidates with search_ring_id filter returns total_count == 0"

      - name: corner_search_ring_create_applies_declared_defaults
        claim_type: defaults
        grounds:
          - entities.SearchRing.fields.status
          - entities.SearchRing.fields.candidate_count
          - entities.SearchRing.fields.committed_capex_usd
          - entities.SearchRing.fields.reopen_count
        distinguishing_aspect: "A freshly created SearchRing carries status DRAFT, candidate_count 0, committed_capex_usd 0, reopen_count 0, selected_candidate_id null and version 1 without the client supplying any of them."
        test_recipe:
          setup:
            - "empty database, logical clock at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramDirector
          trigger:
            - call: "POST /search-rings"
              payload: { name: "Ring 2276-A", market_code: "MKT-NE-01", center_lat: 42.3500, center_lon: -71.0600, radius_m: 800, required_agl_m: 45, objective_type: "COVERAGE_AND_CAPACITY", target_rsrp_dbm: -95, target_capacity_gbps: 10, market_benchmark_monthly_rent_usd: 2400.00, capex_budget_usd: 250000.00, priority_rank: 1 }
              as: RfEngineer
              captures: { ring_id: $.data.id }
          assert:
            - "response status == 201"
            - "SearchRing.${ring_id}.status == DRAFT"
            - "SearchRing.${ring_id}.candidate_count == 0"
            - "SearchRing.${ring_id}.committed_capex_usd == 0"
            - "SearchRing.${ring_id}.reopen_count == 0"
            - "SearchRing.${ring_id}.selected_candidate_id == null"
            - "SearchRing.${ring_id}.version == 1"

      - name: corner_landlord_create_generates_system_fields
        claim_type: system_fields
        grounds:
          - entities.Landlord.fields.standing
          - entities.Landlord.fields.executed_lease_count
        distinguishing_aspect: "POST /landlords returns a server-minted id, created_at, updated_at and version 1, with standing ACTIVE and executed_lease_count 0 derived by the system rather than supplied."
        test_recipe:
          setup:
            - "empty database, logical clock at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramDirector
          trigger:
            - call: "POST /landlords"
              payload: { legal_name: "Beacon Holdings LLC", entity_type: "LLC", contact_email: "asset@beacon.example", market_code: "MKT-NE-01" }
              as: SiteAcquisitionAgent
              as_user_id: "agent-001"
              captures: { ll_id: $.data.id, ll_v: $.data.version }
          assert:
            - "response status == 201"
            - "Landlord.${ll_id}.standing == ACTIVE"
            - "Landlord.${ll_id}.executed_lease_count == 0"
            - "Landlord.${ll_id}.outreach_optout == false"
            - "Landlord.${ll_id}.version == 1"
            - "Landlord.${ll_id}.created_at == 2026-08-01T00:00:00Z"

      - name: corner_candidate_create_rejects_invalid_site_type_enum
        claim_type: type_constraints
        grounds:
          - entities.Candidate.fields.site_type
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "site_type BALLOON is outside the declared TOWER | ROOFTOP | RAW_LAND enum, so POST /candidates returns 400 ERR_INVALID_REQUEST and no row is stored."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z, one OPEN ring, one landlord, one jurisdiction in MKT-NE-01"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /jurisdictions"
              payload: { name: "Northeast Township", market_code: "MKT-NE-01", by_right_review_days: 60, conditional_use_review_days: 90, variance_review_days: 150, hearing_cadence_days: 14, requires_visual_simulation: true, min_visual_simulations: 2, max_continuances: 2, historic_district_flag: false, tribal_consultation_required: false, historical_delay_factor: 1.20, appeal_window_days: 30 }
              as: ZoningPlanner
              captures: { jur_id: $.data.id }
            - call: "POST /search-rings"
              payload: { name: "Ring 2276-A", market_code: "MKT-NE-01", center_lat: 42.3500, center_lon: -71.0600, radius_m: 800, required_agl_m: 45, objective_type: "COVERAGE_AND_CAPACITY", target_rsrp_dbm: -95, target_capacity_gbps: 10, market_benchmark_monthly_rent_usd: 2400.00, capex_budget_usd: 250000.00, priority_rank: 1 }
              as: RfEngineer
              captures: { ring_id: $.data.id }
            - call: "POST /search-rings/${ring_id}/open"
              as: RfEngineer
            - call: "POST /landlords"
              payload: { legal_name: "Beacon Holdings LLC", entity_type: "LLC", contact_email: "asset@beacon.example", market_code: "MKT-NE-01", outreach_optout: false }
              as: SiteAcquisitionAgent
              as_user_id: "agent-001"
              captures: { ll_id: $.data.id }
          trigger:
            - call: "POST /candidates"
              payload: { search_ring_id: "${ring_id}", landlord_id: "${ll_id}", jurisdiction_id: "${jur_id}", owning_agent_user_id: "agent-001", site_type: "BALLOON", lat: 42.3510, lon: -71.0620, distance_from_center_m: 200, agl_m: 60, months_to_availability: 3, measured_rsrp_dbm: -88, offered_capacity_gbps: 10 }
              as: SiteAcquisitionAgent
              as_user_id: "agent-001"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 400"
            - "error_id == ERR_INVALID_REQUEST"
            - "SearchRing.${ring_id}.candidate_count == 0"

      - name: corner_candidate_list_returns_paginated_envelope
        claim_type: listing
        grounds:
          - endpoints.GET_/candidates
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three candidates on one ring, GET /candidates?limit=2&offset=0 returns 2 rows with total_count 3 and has_more true, and offset 2 returns the remaining 1 row with has_more false."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "one OPEN ring with three PROSPECTING candidates on the same landlord"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /jurisdictions"
              payload: { name: "Northeast Township", market_code: "MKT-NE-01", by_right_review_days: 60, conditional_use_review_days: 90, variance_review_days: 150, hearing_cadence_days: 14, requires_visual_simulation: true, min_visual_simulations: 2, max_continuances: 2, historic_district_flag: false, tribal_consultation_required: false, historical_delay_factor: 1.20, appeal_window_days: 30 }
              as: ZoningPlanner
              captures: { jur_id: $.data.id }
            - call: "POST /search-rings"
              payload: { name: "Ring 2276-A", market_code: "MKT-NE-01", center_lat: 42.3500, center_lon: -71.0600, radius_m: 800, required_agl_m: 45, objective_type: "COVERAGE_AND_CAPACITY", target_rsrp_dbm: -95, target_capacity_gbps: 10, market_benchmark_monthly_rent_usd: 2400.00, capex_budget_usd: 250000.00, priority_rank: 1 }
              as: RfEngineer
              captures: { ring_id: $.data.id }
            - call: "POST /search-rings/${ring_id}/open"
              as: RfEngineer
            - call: "POST /landlords"
              payload: { legal_name: "Beacon Holdings LLC", entity_type: "LLC", contact_email: "asset@beacon.example", market_code: "MKT-NE-01", outreach_optout: false }
              as: SiteAcquisitionAgent
              as_user_id: "agent-001"
              captures: { ll_id: $.data.id }
            - call: "POST /candidates"
              payload: { search_ring_id: "${ring_id}", landlord_id: "${ll_id}", jurisdiction_id: "${jur_id}", owning_agent_user_id: "agent-001", site_type: "TOWER", lat: 42.3510, lon: -71.0620, distance_from_center_m: 200, agl_m: 60, months_to_availability: 3, measured_rsrp_dbm: -88, offered_capacity_gbps: 10 }
              as: SiteAcquisitionAgent
              as_user_id: "agent-001"
              captures: { c1_id: $.data.id }
            - call: "POST /candidates"
              payload: { search_ring_id: "${ring_id}", landlord_id: "${ll_id}", jurisdiction_id: "${jur_id}", owning_agent_user_id: "agent-001", site_type: "ROOFTOP", lat: 42.3520, lon: -71.0630, distance_from_center_m: 240, agl_m: 50, months_to_availability: 3, measured_rsrp_dbm: -90, offered_capacity_gbps: 9 }
              as: SiteAcquisitionAgent
              as_user_id: "agent-001"
              captures: { c2_id: $.data.id }
            - call: "POST /candidates"
              payload: { search_ring_id: "${ring_id}", landlord_id: "${ll_id}", jurisdiction_id: "${jur_id}", owning_agent_user_id: "agent-001", site_type: "RAW_LAND", lat: 42.3530, lon: -71.0640, distance_from_center_m: 300, agl_m: 45, months_to_availability: 4, measured_rsrp_dbm: -92, offered_capacity_gbps: 8 }
              as: SiteAcquisitionAgent
              as_user_id: "agent-001"
              captures: { c3_id: $.data.id }
          trigger:
            - call: "GET /candidates"
              payload: { search_ring_id: "${ring_id}", limit: 2, offset: 0 }
              as: RfEngineer
            - call: "GET /candidates"
              payload: { search_ring_id: "${ring_id}", limit: 2, offset: 2 }
              as: RfEngineer
          assert:
            - "the first read returns 200 with 2 data rows, total_count == 3, limit == 2, offset == 0, has_more == true"
            - "the second read returns 1 data row, total_count == 3, offset == 2, has_more == false"
            - "SearchRing.${ring_id}.candidate_count == 3"

      - name: corner_search_ring_get_returns_stored_values
        claim_type: retrieval
        grounds:
          - endpoints.GET_/search-rings/{id}
          - entities.SearchRing.fields.objective_type
        distinguishing_aspect: "GET /search-rings/{id} echoes exactly the stored radio-design inputs (radius_m 800, required_agl_m 45, target_rsrp_dbm -95, target_capacity_gbps 10, capex_budget_usd 250000.00) with no recomputation."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z, one DRAFT ring"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /search-rings"
              payload: { name: "Ring 2276-A", market_code: "MKT-NE-01", center_lat: 42.3500, center_lon: -71.0600, radius_m: 800, required_agl_m: 45, objective_type: "COVERAGE_AND_CAPACITY", target_rsrp_dbm: -95, target_capacity_gbps: 10, market_benchmark_monthly_rent_usd: 2400.00, capex_budget_usd: 250000.00, priority_rank: 1 }
              as: RfEngineer
              captures: { ring_id: $.data.id }
          trigger:
            - call: "GET /search-rings/${ring_id}"
              as: ZoningPlanner
          assert:
            - "response status == 200"
            - "SearchRing.${ring_id}.radius_m == 800"
            - "SearchRing.${ring_id}.required_agl_m == 45"
            - "SearchRing.${ring_id}.objective_type == COVERAGE_AND_CAPACITY"
            - "SearchRing.${ring_id}.target_rsrp_dbm == -95"
            - "SearchRing.${ring_id}.target_capacity_gbps == 10"
            - "SearchRing.${ring_id}.capex_budget_usd == 250000.00"

      - name: corner_candidate_create_with_unknown_landlord_rejected
        claim_type: parent_relationships
        grounds:
          - validations[priority=6]
          - errors[ERR_LANDLORD_NOT_FOUND]
          - entities.Candidate.fields.landlord_id
        distinguishing_aspect: "Flat-topology FK integrity: POST /candidates with a syntactically valid but unknown landlord_id returns 404 ERR_LANDLORD_NOT_FOUND, and the body FK order means the ring and jurisdiction are validated before it."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z, one OPEN ring and one jurisdiction in MKT-NE-01, and no landlord with the referenced id"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /jurisdictions"
              payload: { name: "Northeast Township", market_code: "MKT-NE-01", by_right_review_days: 60, conditional_use_review_days: 90, variance_review_days: 150, hearing_cadence_days: 14, requires_visual_simulation: true, min_visual_simulations: 2, max_continuances: 2, historic_district_flag: false, tribal_consultation_required: false, historical_delay_factor: 1.20, appeal_window_days: 30 }
              as: ZoningPlanner
              captures: { jur_id: $.data.id }
            - call: "POST /search-rings"
              payload: { name: "Ring 2276-A", market_code: "MKT-NE-01", center_lat: 42.3500, center_lon: -71.0600, radius_m: 800, required_agl_m: 45, objective_type: "COVERAGE_AND_CAPACITY", target_rsrp_dbm: -95, target_capacity_gbps: 10, market_benchmark_monthly_rent_usd: 2400.00, capex_budget_usd: 250000.00, priority_rank: 1 }
              as: RfEngineer
              captures: { ring_id: $.data.id }
            - call: "POST /search-rings/${ring_id}/open"
              as: RfEngineer
          trigger:
            - call: "POST /candidates"
              payload: { search_ring_id: "${ring_id}", landlord_id: "00000000-0000-0000-0000-000000000009", jurisdiction_id: "${jur_id}", owning_agent_user_id: "agent-001", site_type: "TOWER", lat: 42.3510, lon: -71.0620, distance_from_center_m: 200, agl_m: 60, months_to_availability: 3, measured_rsrp_dbm: -88, offered_capacity_gbps: 10 }
              as: SiteAcquisitionAgent
              as_user_id: "agent-001"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 404"
            - "error_id == ERR_LANDLORD_NOT_FOUND"
            - "SearchRing.${ring_id}.candidate_count == 0"
            - "SearchRing.${ring_id}.version == 2"

      - name: corner_candidate_rf_score_is_computed_not_supplied
        claim_type: computed_fields
        grounds:
          - entities.Candidate.fields.rf_qualification_score
          - calculations.rf_qualification_score
        excluded_because:
          difficulty_instance: boundary_precision_check / rf_score_exactly_at_qualify_minimum_versus_one_step_below
          rationale: "That instance pins the computed score literals 55.00 and 54.80 from ring and candidate inputs only, and PATCH /candidates does not accept rf_qualification_score at all."

  # =========================================================================
  - section: state_machines
    instances:
      - name: corner_ring_open_twice_rejected
        claim_type: idempotency
        grounds:
          - state_machines.SearchRing.DRAFT_to_OPEN
          - validations[priority=26]
          - errors[ERR_INVALID_RING_STATE]
        distinguishing_aspect: "The second POST /search-rings/{id}/open on an already OPEN ring returns 409 ERR_INVALID_RING_STATE and leaves SearchRing.version at 2 (only the first open bumped it)."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z, one ring already moved DRAFT -> OPEN"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /search-rings"
              payload: { name: "Ring 2276-A", market_code: "MKT-NE-01", center_lat: 42.3500, center_lon: -71.0600, radius_m: 800, required_agl_m: 45, objective_type: "COVERAGE_AND_CAPACITY", target_rsrp_dbm: -95, target_capacity_gbps: 10, market_benchmark_monthly_rent_usd: 2400.00, capex_budget_usd: 250000.00, priority_rank: 1 }
              as: RfEngineer
              captures: { ring_id: $.data.id }
            - call: "POST /search-rings/${ring_id}/open"
              as: RfEngineer
          trigger:
            - call: "POST /search-rings/${ring_id}/open"
              as: RfEngineer
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "error_id == ERR_INVALID_RING_STATE"
            - "SearchRing.${ring_id}.status == OPEN"
            - "SearchRing.${ring_id}.version == 2"

      - name: corner_landlord_reply_before_outreach_rejected
        claim_type: invalid_transitions
        grounds:
          - state_machines.Candidate.OUTREACH_SENT_to_LANDLORD_ENGAGED
          - validations[priority=27]
          - errors[ERR_INVALID_CANDIDATE_STATE]
        distinguishing_aspect: "A LANDLORD_REPLY outreach event on a PROSPECTING candidate is not a declared transition, so it returns 409 ERR_INVALID_CANDIDATE_STATE and outreach_event_count stays 0."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z, one OPEN ring with one PROSPECTING candidate owned by agent-001"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /jurisdictions"
              payload: { name: "Northeast Township", market_code: "MKT-NE-01", by_right_review_days: 60, conditional_use_review_days: 90, variance_review_days: 150, hearing_cadence_days: 14, requires_visual_simulation: true, min_visual_simulations: 2, max_continuances: 2, historic_district_flag: false, tribal_consultation_required: false, historical_delay_factor: 1.20, appeal_window_days: 30 }
              as: ZoningPlanner
              captures: { jur_id: $.data.id }
            - call: "POST /search-rings"
              payload: { name: "Ring 2276-A", market_code: "MKT-NE-01", center_lat: 42.3500, center_lon: -71.0600, radius_m: 800, required_agl_m: 45, objective_type: "COVERAGE_AND_CAPACITY", target_rsrp_dbm: -95, target_capacity_gbps: 10, market_benchmark_monthly_rent_usd: 2400.00, capex_budget_usd: 250000.00, priority_rank: 1 }
              as: RfEngineer
              captures: { ring_id: $.data.id }
            - call: "POST /search-rings/${ring_id}/open"
              as: RfEngineer
            - call: "POST /landlords"
              payload: { legal_name: "Beacon Holdings LLC", entity_type: "LLC", contact_email: "asset@beacon.example", market_code: "MKT-NE-01", outreach_optout: false }
              as: SiteAcquisitionAgent
              as_user_id: "agent-001"
              captures: { ll_id: $.data.id }
            - call: "POST /candidates"
              payload: { search_ring_id: "${ring_id}", landlord_id: "${ll_id}", jurisdiction_id: "${jur_id}", owning_agent_user_id: "agent-001", site_type: "TOWER", lat: 42.3510, lon: -71.0620, distance_from_center_m: 200, agl_m: 60, months_to_availability: 3, measured_rsrp_dbm: -88, offered_capacity_gbps: 10 }
              as: SiteAcquisitionAgent
              as_user_id: "agent-001"
              captures: { cand_id: $.data.id }
          trigger:
            - call: "POST /candidates/${cand_id}/outreach-events"
              payload: { event_type: "LANDLORD_REPLY" }
              as: SiteAcquisitionAgent
              as_user_id: "agent-001"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "error_id == ERR_INVALID_CANDIDATE_STATE"
            - "Candidate.${cand_id}.acquisition_status == PROSPECTING"
            - "Candidate.${cand_id}.outreach_event_count == 0"

      - name: corner_terminated_lease_rejects_further_execution
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.LeaseAgreement.EXECUTED_to_TERMINATED
          - validations[priority=28]
          - errors[ERR_INVALID_LEASE_STATE]
        distinguishing_aspect: "TERMINATED is a declared terminal state: a second POST /leases/{id}/execute on a terminated lease returns 409 ERR_INVALID_LEASE_STATE and does not restore Landlord.executed_lease_count to 1."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "a lease that was executed and then terminated, landlord executed_lease_count back to 0"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /jurisdictions"
              payload: { name: "Northeast Township", market_code: "MKT-NE-01", by_right_review_days: 60, conditional_use_review_days: 90, variance_review_days: 150, hearing_cadence_days: 14, requires_visual_simulation: true, min_visual_simulations: 2, max_continuances: 2, historic_district_flag: false, tribal_consultation_required: false, historical_delay_factor: 1.20, appeal_window_days: 30 }
              as: ZoningPlanner
              captures: { jur_id: $.data.id }
