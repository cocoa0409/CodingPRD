  - rule_id: boundary_precision_check
    instances:

      - name: cell_full_at_exactly_98_00_percent_and_not_at_97_94
        grounds:
          - state_machines.Cell.ACTIVE_to_FULL
          - calculations.daily_airspace_consumption
          - entities.Cell.fields.fill_pct
          - entities.Cell.fields.consumed_airspace_cy
          - validations[priority=23]
        distinguishing_aspect: |
          CELL_FULL_FRACTION is inclusive at two decimal places, and the two sides of the
          boundary are separated by one tenth of a ton of feedstock. 166.60 certified tons at
          density 0.8500 consume exactly 196.00 cy of a 200 cy cell, which is exactly 98.00
          percent and MUST trip ACTIVE -> FULL; 166.50 tons consume 195.88 cy, which is 97.94
          percent and must NOT. Both cells belong to the same landfill so the comparison
          cannot be explained by any per-site difference.
        test_recipe:
          setup:
            - "Landfill LF with TWO cells, C-2A and C-2B, each design_airspace_cy 200 and design_area_sf 45001, both driven to ACTIVE behind one FUNDED assurance position and one EXECUTED HostCommunityAgreement."
            - "OperatingDay D1 on 2026-08-05 against C-2A with one CLEARED load certified at 166.60 tons."
            - "OperatingDay D2 on 2026-08-06 against C-2B with one CLEARED load certified at 166.50 tons."
            - "Both days use ALTERNATIVE_TARP with working_face_area_sf 5000, so both compute effective density exactly 0.8500."
            - "Both loads are cleared and certified BEFORE either day is closed, so no cascade can interfere with screening."
