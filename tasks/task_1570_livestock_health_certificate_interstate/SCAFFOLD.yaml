# =============================================================================
# PRD Benchmark Scaffold — Livestock Health Certificate & Interstate Movement
# (state veterinarian office)
# =============================================================================

scenario: |
  Livestock Health Certificate & Interstate Movement (state veterinarian office):
  veterinary inspection & CVI issuance, destination-state entry requirement matrix,
  test/vaccination validity window, permit number issuance & tracking,
  species-specific quarantine & disease-status rules, electronic certificate
  transmission & audit, movement during disease outbreak restriction,
  recordkeeping & traceback support

domain_name: livestock-health-certificate-interstate
api_prefix: /api

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - cascading_side_effects
    - optimistic_concurrency
    - derived_field_reconciliation
    - rate_threshold_triggers
  entity_topology: flat            # peer entities joined by foreign keys; no nested create paths
  state_machine_shape: cyclic      # Certificate revision loop; OutbreakZone re-escalation loop; MovementPermit suspend/reinstate loop
  relationship_patterns:
    - one_to_many                  # Premises -> Certificates, Certificate -> MovementPermits, etc.
    - cross_aggregate              # MovementRecord -> MovementPermit -> Certificate -> Premises chains
  role_model: segregation_of_duties  # inspecting vet may not issue; quarantine issuer may not lift
  consistency_model: immediate     # every mutation + cascade is atomic within the request

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Premises
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Operation / farm name" }
      - { name: county, type: string, source: input, description: "County where the premises sits (drives outbreak-zone coverage)" }
      - { name: state_code, type: string, source: input, description: "Two-letter state code of the premises" }
      - { name: species_code, type: enum, source: input, description: "Primary species on this premises", constraints: "one of CATTLE | SWINE | POULTRY | SHEEP_GOAT | EQUINE" }
      - { name: initial_head_count, type: integer, source: input, description: "Animal census at registration; immutable after creation", constraints: ">= 0" }
      - { name: current_head_count, type: integer, source: computed, description: "= initial_head_count - SUM(head_count of MovementRecords reaching this premises via permit->certificate origin with status IN {IN_TRANSIT, DELIVERED})" }
      - { name: disease_status, type: enum, source: input, default: MONITORED, description: "Herd/flock disease standing", constraints: "one of ACCREDITED_FREE | MONITORED | QUARANTINE_HOLD | INFECTED; system transitions may overwrite per state machine" }

  - name: Veterinarian
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Accredited veterinarian's legal name" }
      - { name: accreditation_number, type: string, source: input, description: "State accreditation number; unique across veterinarians" }
      - { name: accreditation_expires_at, type: datetime, source: input, description: "Accreditation expiry instant (ISO 8601 UTC)" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED" }
      - { name: is_credential_current, type: boolean, source: computed, description: "true iff status == ACTIVE and accreditation_expires_at >= logical clock" }

  - name: EntryRequirement
    parent: null
    common_fields: true
    fields:
      - { name: destination_state_code, type: string, source: input, description: "Two-letter destination state this matrix row governs" }
      - { name: species_code, type: enum, source: input, description: "Species this row governs", constraints: "one of CATTLE | SWINE | POULTRY | SHEEP_GOAT | EQUINE" }
      - { name: test_type, type: enum, source: input, description: "Required test", constraints: "one of BRUCELLOSIS | TUBERCULOSIS | EIA | PULLORUM | NONE" }
      - { name: test_validity_days, type: integer, source: input, description: "Test qualifies when whole-day age at inspection is <= this value (inclusive)", constraints: "> 0" }
      - { name: vaccination_required, type: boolean, source: input, description: "Whether a vaccination record is mandatory" }
      - { name: vaccination_min_days_before_inspection, type: integer, source: input, default: 0, description: "Vaccination must be at least this many whole days before inspection_date (inclusive)", constraints: ">= 0" }
      - { name: permit_required, type: boolean, source: input, description: "Whether destination state requires an entry permit for this species" }
      - { name: effective_from, type: datetime, source: input, description: "Half-open window start (inclusive)" }
      - { name: effective_until, type: datetime, source: input, description: "Half-open window end (exclusive); null = open-ended", constraints: "must be > effective_from when provided" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | RETIRED" }

  - name: TestRecord
    parent: null
    common_fields: true
    fields:
      - { name: premises_id, type: string, source: input, description: "FK -> Premises.id; premises whose animals were sampled" }
      - { name: species_code, type: enum, source: input, description: "Species tested", constraints: "one of CATTLE | SWINE | POULTRY | SHEEP_GOAT | EQUINE" }
      - { name: test_type, type: enum, source: input, description: "Test performed", constraints: "one of BRUCELLOSIS | TUBERCULOSIS | EIA | PULLORUM" }
      - { name: test_date, type: datetime, source: input, description: "Date the sample was drawn (validity anchor)" }
      - { name: lab_reference, type: string, source: input, description: "Lab accession reference" }
      - { name: result, type: enum, source: system, default: RESULT_PENDING, description: "RESULT_PENDING | NEGATIVE | POSITIVE" }

  - name: Certificate
    parent: null
    common_fields: true
    fields:
      - { name: origin_premises_id, type: string, source: input, description: "FK -> Premises.id; origin of the consignment" }
      - { name: vet_id, type: string, source: system, description: "FK -> Veterinarian.id; set to X-User-ID of the creating AccreditedVet (client input ignored)" }
      - { name: destination_state_code, type: string, source: input, description: "Two-letter destination state" }
      - { name: species_code, type: enum, source: input, description: "Species certified; must equal premises.species_code and test_record.species_code", constraints: "one of CATTLE | SWINE | POULTRY | SHEEP_GOAT | EQUINE" }
      - { name: head_count, type: integer, source: input, description: "Animals covered; editable only while DRAFT", constraints: "> 0" }
      - { name: inspection_date, type: datetime, source: input, description: "Date of veterinary inspection; must not be later than the logical clock" }
      - { name: test_record_id, type: string, source: input, description: "FK -> TestRecord.id; qualifying test relied upon (required unless matrix row test_type == NONE)" }
      - { name: vaccination_date, type: datetime, source: input, description: "Vaccination date (required when matrix row vaccination_required == true)" }
      - { name: consignment_description, type: string, source: input, description: "Free-text consignment note" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | PENDING_REVIEW | REJECTED | ISSUED | TRANSMITTED | ENTRY_BLOCKED | LAPSED | VOID" }
      - { name: pre_block_status, type: enum, source: system, description: "Status remembered when ENTRY_BLOCKED (ISSUED or TRANSMITTED); null otherwise", constraints: "one of ISSUED | TRANSMITTED | null" }
      - { name: reject_reason, type: string, source: system, description: "Reason recorded at rejection; cleared on revise" }
      - { name: void_reason, type: string, source: system, description: "Reason recorded at void" }
      - { name: cvi_number, type: string, source: system, description: "Minted at issue as CVI-<origin_state_code>-<6-digit global issuance sequence>, e.g. CVI-TX-000001; null until issued" }
      - { name: issued_at, type: datetime, source: system, description: "Logical-clock instant of issuance; null until issued" }
      - { name: valid_until, type: datetime, source: system, description: "= issued_at + CVI_VALIDITY_DAYS days; null until issued" }
      - { name: provisional_fee_cents, type: integer, source: computed, description: "Fee quoted at submit per cvi_issuance_fee (provisional variant); null until submitted" }
      - { name: final_fee_cents, type: integer, source: computed, description: "Fee assessed at issue per cvi_issuance_fee (final variant); null until issued" }

  - name: MovementPermit
    parent: null
    common_fields: true
    fields:
      - { name: certificate_id, type: string, source: input, description: "FK -> Certificate.id; certificate this permit authorizes movement for" }
      - { name: allocated_head_count, type: integer, source: input, description: "Maximum animals allowed to move under this permit", constraints: "> 0" }
      - { name: valid_from, type: datetime, source: input, description: "Movement window start (inclusive)" }
      - { name: valid_until, type: datetime, source: input, description: "Movement window end (inclusive)", constraints: "must be >= valid_from" }
      - { name: status, type: enum, source: system, default: REQUESTED, description: "REQUESTED | ISSUED | SUSPENDED | VOIDED" }
      - { name: permit_number, type: string, source: system, description: "Minted at issue as EP-<destination_state_code>-<6-digit global issuance sequence>, e.g. EP-KS-000001; null until issued" }
      - { name: committed_headroom, type: integer, source: computed, description: "= allocated_head_count - SUM(head_count of MovementRecords with this permit_id and status IN {SCHEDULED, IN_TRANSIT, DELIVERED})" }
      - { name: projected_headroom, type: integer, source: computed, description: "= allocated_head_count - SUM(head_count of MovementRecords with this permit_id and status IN {IN_TRANSIT, DELIVERED})" }
      - { name: total_movement_fees_cents, type: integer, source: computed, description: "SUM of movement_fee_cents over MovementRecords with this permit_id and status IN {SCHEDULED, IN_TRANSIT, DELIVERED} (per movement_fee_reconciliation)" }

  - name: MovementRecord
    parent: null
    common_fields: true
    fields:
      - { name: permit_id, type: string, source: input, description: "FK -> MovementPermit.id; permit authorizing this movement" }
      - { name: head_count, type: integer, source: input, description: "Animals in this shipment", constraints: "> 0" }
      - { name: destination_name, type: string, source: input, description: "Destination operation name (out-of-state; free text)" }
      - { name: destination_county, type: string, source: input, description: "Destination county (free text)" }
      - { name: planned_ship_date, type: datetime, source: input, description: "Planned ship instant; must lie within permit window and not after certificate.valid_until" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | IN_TRANSIT | DELIVERED | CANCELLED" }
      - { name: departed_at, type: datetime, source: system, description: "Logical-clock instant of departure; null until departed" }
      - { name: arrived_at, type: datetime, source: system, description: "Logical-clock instant of arrival; null until delivered" }
      - { name: movement_fee_cents, type: integer, source: computed, description: "= round_half_up(head_count * PER_HEAD_MOVEMENT_RATE_CENTS[species]) computed once at creation; species resolved via permit -> certificate" }

  - name: OutbreakZone
    parent: null
    common_fields: true
    fields:
      - { name: county, type: string, source: input, description: "County covered by this disease zone" }
      - { name: state_code, type: string, source: input, description: "Two-letter state code" }
      - { name: disease_code, type: enum, source: input, description: "Disease under watch", constraints: "one of AVIAN_INFLUENZA | BRUCELLOSIS | TUBERCULOSIS | EIA | PULLORUM | VESICULAR_STOMATITIS | PSEUDORABIES" }
      - { name: species_code, type: enum, source: input, description: "Species covered", constraints: "one of CATTLE | SWINE | POULTRY | SHEEP_GOAT | EQUINE" }
      - { name: severity, type: enum, source: input, description: "Declared severity", constraints: "one of LOW | MODERATE | HIGH" }
      - { name: effective_from, type: datetime, source: input, description: "Half-open window start (inclusive)" }
      - { name: effective_until, type: datetime, source: input, description: "Half-open window end (exclusive); null = open-ended", constraints: "must be > effective_from when provided" }
      - { name: status, type: enum, source: system, default: MONITORING, description: "MONITORING | ACTIVE | CONTAINED | RESOLVED" }

  - name: QuarantineOrder
    parent: null
    common_fields: true
    fields:
      - { name: premises_id, type: string, source: input, description: "FK -> Premises.id; quarantined premises (system-set on auto-created orders)" }
      - { name: species_code, type: enum, source: input, description: "Species under quarantine; must equal premises.species_code", constraints: "one of CATTLE | SWINE | POULTRY | SHEEP_GOAT | EQUINE" }
      - { name: disease_code, type: enum, source: input, description: "Disease driving the order", constraints: "one of AVIAN_INFLUENZA | BRUCELLOSIS | TUBERCULOSIS | EIA | PULLORUM | VESICULAR_STOMATITIS | PSEUDORABIES" }
      - { name: start_at, type: datetime, source: input, description: "Closed-interval start (inclusive)" }
      - { name: end_at, type: datetime, source: input, description: "Closed-interval end (inclusive)", constraints: "must be > start_at" }
      - { name: reason, type: string, source: input, description: "Order justification (AUTO_POSITIVE_TEST:<test_record_id> when system-created)" }
      - { name: issued_by_user_id, type: string, source: system, description: "X-User-ID of the issuing StateVetOfficer; the literal string 'system' for auto-created orders" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | LIFTED | EXPIRED" }

  - name: TransmissionAudit
    parent: null
    common_fields: true
    fields:
      - { name: certificate_id, type: string, source: system, description: "FK -> Certificate.id; certificate transmitted (taken from the transmit path)" }
      - { name: destination_state_code, type: string, source: system, description: "Copied from the certificate at transmission time" }
      - { name: channel, type: enum, source: input, description: "Transmission channel", constraints: "one of XML_GATEWAY | EMAIL | PORTAL" }
      - { name: payload_digest, type: string, source: system, description: "Lowercase hex SHA-256 of the canonical transmitted payload (64 hex chars)" }
      - { name: status, type: enum, source: system, default: QUEUED, description: "QUEUED | ACKNOWLEDGED | FAILED" }
      - { name: failure_reason, type: string, source: system, description: "Recorded when transmission fails; null otherwise" }
      - { name: acknowledged_at, type: datetime, source: system, description: "Logical-clock instant of destination acknowledgement; null until acknowledged" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Certificate
    initial_state: DRAFT
    terminal_states: [VOID, LAPSED]
    transitions:
      - from: DRAFT
        to: PENDING_REVIEW
        trigger: "POST /api/certificates/{id}/submit"
        actor: AccreditedVet
        preconditions:
          - "status == DRAFT (ERR_CERTIFICATE_NOT_SUBMITTABLE)"
          - "acting veterinarian is_credential_current (ERR_VET_NOT_CURRENT)"
          - "origin premises disease_status NOT IN {QUARANTINE_HOLD, INFECTED} (ERR_PREMISES_DISEASE_HOLD)"
          - "an ACTIVE EntryRequirement whose window covers inspection_date exists for (destination_state_code, species_code) (ERR_NO_ACTIVE_ENTRY_REQUIREMENT)"
          - "species_code == origin premises.species_code (ERR_PREMISES_SPECIES_MISMATCH)"
          - "if matrix row test_type != NONE: test_record_id present, test matches premises + species + test_type (ERR_TEST_RECORD_MISMATCH), result == NEGATIVE (ERR_TEST_NOT_QUALIFYING), whole-day age at inspection <= test_validity_days (ERR_TEST_VALIDITY_EXPIRED)"
          - "if matrix row vaccination_required: vaccination_date present and whole-day age at inspection >= vaccination_min_days_before_inspection (ERR_VACCINATION_WINDOW_VIOLATION)"
          - "head_count <= origin premises.current_head_count (ERR_HEAD_COUNT_EXCEEDS_INVENTORY)"
        side_effects:
          - "provisional_fee_cents := cvi_issuance_fee (provisional variant)"

      - from: PENDING_REVIEW
        to: ISSUED
        trigger: "POST /api/certificates/{id}/issue"
        actor: StateVetOfficer
        preconditions:
          - "status == PENDING_REVIEW (ERR_CERTIFICATE_NOT_PENDING_REVIEW)"
          - "acting veterinarian is_credential_current (ERR_VET_NOT_CURRENT)"
          - "origin premises disease_status NOT IN {QUARANTINE_HOLD, INFECTED} (ERR_PREMISES_DISEASE_HOLD)"
        side_effects:
          - "cvi_number := CVI-<origin_state>-<seq>; issued_at := logical clock; valid_until := issued_at + 30 days (certificate_validity_window)"
          - "final_fee_cents := cvi_issuance_fee (final variant)"

      - from: PENDING_REVIEW
        to: REJECTED
        trigger: "POST /api/certificates/{id}/reject"
        actor: StateVetOfficer
        preconditions:
          - "status == PENDING_REVIEW (ERR_CERTIFICATE_NOT_PENDING_REVIEW)"
        side_effects:
          - "reject_reason := request reason_code"

      - from: DRAFT
        to: REJECTED
        trigger: "system cascade: origin premises disease_status becomes INFECTED"
        actor: system
        preconditions:
          - "origin premises disease_status transitioned to INFECTED"
        side_effects:
          - "reject_reason := AUTO_POSITIVE_TEST"

      - from: PENDING_REVIEW
        to: REJECTED
        trigger: "system cascade: origin premises disease_status becomes INFECTED"
        actor: system
        preconditions:
          - "origin premises disease_status transitioned to INFECTED"
        side_effects:
          - "reject_reason := AUTO_POSITIVE_TEST"

      - from: REJECTED
        to: DRAFT
        trigger: "POST /api/certificates/{id}/revise"
        actor: AccreditedVet
        preconditions:
          - "status == REJECTED (ERR_CERTIFICATE_NOT_REVISABLE)"
        side_effects:
          - "reject_reason := null"
        note: "Revision loop: a rejected certificate returns to DRAFT for correction and resubmission."

      - from: ISSUED
        to: VOID
        trigger: "POST /api/certificates/{id}/void"
        actor: StateVetOfficer
        preconditions:
          - "status IN {ISSUED, TRANSMITTED, ENTRY_BLOCKED} (ERR_CERTIFICATE_NOT_VOIDABLE)"
        side_effects:
          - "void_reason := request reason"
          - "cascade: every MovementPermit with certificate_id == this and status IN {REQUESTED, ISSUED, SUSPENDED} -> VOIDED"
          - "cascade (depth 2): each MovementRecord on such a permit with status IN {SCHEDULED, IN_TRANSIT} -> CANCELLED; for IN_TRANSIT cancels, origin premises.current_head_count += record.head_count"
          - "cascade recomputes: permit.committed_headroom / projected_headroom / total_movement_fees_cents on remaining permits"

      - from: TRANSMITTED
        to: VOID
        trigger: "POST /api/certificates/{id}/void"
        actor: StateVetOfficer
        preconditions:
          - "status IN {ISSUED, TRANSMITTED, ENTRY_BLOCKED} (ERR_CERTIFICATE_NOT_VOIDABLE)"
        side_effects:
          - "same cascade as ISSUED -> VOID"

      - from: ENTRY_BLOCKED
        to: VOID
        trigger: "POST /api/certificates/{id}/void"
        actor: StateVetOfficer
        preconditions:
          - "status IN {ISSUED, TRANSMITTED, ENTRY_BLOCKED} (ERR_CERTIFICATE_NOT_VOIDABLE)"
        side_effects:
          - "same cascade as ISSUED -> VOID"

      - from: ISSUED
        to: TRANSMITTED
        trigger: "system: a TransmissionAudit for this certificate reaches ACKNOWLEDGED (bubble-up)"
        actor: system
        preconditions:
          - "acknowledged audit.certificate_id == this certificate"
        side_effects: []
        note: "POST /api/certificates/{id}/transmit is NOT a transition: it requires status IN {ISSUED, TRANSMITTED} (ERR_CERTIFICATE_NOT_TRANSMITTABLE) and appends a QUEUED TransmissionAudit."

      - from: ISSUED
        to: ENTRY_BLOCKED
        trigger: "system cascade: an OutbreakZone covering the origin premises' (county, species_code) transitions to ACTIVE while the zone window covers the logical clock"
        actor: system
        preconditions:
          - "origin premises.county == zone.county and origin premises.species_code == zone.species_code"
        side_effects:
          - "pre_block_status := ISSUED"
          - "cascade (next link): every MovementPermit with certificate_id == this and status == ISSUED -> SUSPENDED"

      - from: TRANSMITTED
        to: ENTRY_BLOCKED
        trigger: "system cascade: an OutbreakZone covering the origin premises' (county, species_code) transitions to ACTIVE while the zone window covers the logical clock"
        actor: system
        preconditions:
          - "origin premises.county == zone.county and origin premises.species_code == zone.species_code"
        side_effects:
          - "pre_block_status := TRANSMITTED"
          - "cascade (next link): every MovementPermit with certificate_id == this and status == ISSUED -> SUSPENDED"

      - from: ENTRY_BLOCKED
        to: ISSUED
        trigger: "system cascade: the blocking OutbreakZone transitions to RESOLVED and pre_block_status == ISSUED"
        actor: system
        preconditions:
          - "origin premises no longer held by any ACTIVE zone or ACTIVE QuarantineOrder (premises restore evaluated first)"
        side_effects:
          - "pre_block_status := null"

      - from: ENTRY_BLOCKED
        to: TRANSMITTED
        trigger: "system cascade: the blocking OutbreakZone transitions to RESOLVED and pre_block_status == TRANSMITTED"
        actor: system
        preconditions:
          - "origin premises no longer held by any ACTIVE zone or ACTIVE QuarantineOrder (premises restore evaluated first)"
        side_effects:
          - "pre_block_status := null"

      - from: ISSUED
        to: LAPSED
        trigger: "system: logical clock advances past valid_until (lazily materialized on the first read or write after expiry)"
        actor: system
        preconditions:
          - "logical clock > valid_until"
        side_effects: []

      - from: TRANSMITTED
        to: LAPSED
        trigger: "system: logical clock advances past valid_until (lazily materialized on the first read or write after expiry)"
        actor: system
        preconditions:
          - "logical clock > valid_until"
        side_effects: []

      - from: ENTRY_BLOCKED
        to: LAPSED
        trigger: "system: logical clock advances past valid_until (lazily materialized on the first read or write after expiry)"
        actor: system
        preconditions:
          - "logical clock > valid_until"
        side_effects:
          - "pre_block_status := null"

  - entity: MovementPermit
    initial_state: REQUESTED
    terminal_states: [VOIDED]
    transitions:
      - from: REQUESTED
        to: ISSUED
        trigger: "POST /api/movement-permits/{id}/issue"
        actor: StateVetOfficer
        preconditions:
          - "status == REQUESTED (ERR_PERMIT_NOT_ISSUABLE)"
          - "certificate.status IN {ISSUED, TRANSMITTED} (ERR_PERMIT_NOT_ISSUABLE)"
          - "allocated_head_count >= certificate.head_count (ERR_ALLOCATION_BELOW_CERTIFICATE_HEADCOUNT)"
          - "valid_from >= certificate.issued_at AND valid_until <= certificate.valid_until (ERR_PERMIT_WINDOW_OUTSIDE_CVI_VALIDITY)"
        side_effects:
          - "permit_number := EP-<destination_state>-<seq>"

      - from: ISSUED
        to: SUSPENDED
        trigger: "system cascade: certificate transitions to ENTRY_BLOCKED"
        actor: system
        preconditions:
          - "permit.certificate_id references a certificate entering ENTRY_BLOCKED"
        side_effects: []
        note: "Suspension does NOT cancel SCHEDULED records; it blocks new scheduling and departures via ERR_PERMIT_NOT_ISSUED until reinstatement."

      - from: SUSPENDED
        to: ISSUED
        trigger: "system cascade: the OutbreakZone whose escalation suspended this permit transitions to RESOLVED"
        actor: system
        preconditions:
          - "permit.status == SUSPENDED and permit.certificate's origin premises is covered (county + species_code) by the resolving zone"
        side_effects: []
        note: "Reinstatement selector: SUSPENDED permits whose certificate's origin premises matches the resolved zone's (county, species_code)."

      - from: REQUESTED
        to: VOIDED
        trigger: "system cascade: certificate voided"
        actor: system
        preconditions:
          - "permit.certificate_id references the voided certificate"
        side_effects: []

      - from: ISSUED
        to: VOIDED
        trigger: "system cascade: certificate voided"
        actor: system
        preconditions:
          - "permit.certificate_id references the voided certificate"
        side_effects:
          - "cascade: this permit's MovementRecords with status IN {SCHEDULED, IN_TRANSIT} -> CANCELLED; IN_TRANSIT cancels restore origin premises.current_head_count"

      - from: SUSPENDED
        to: VOIDED
        trigger: "system cascade: certificate voided"
        actor: system
        preconditions:
          - "permit.certificate_id references the voided certificate"
        side_effects:
          - "cascade: this permit's MovementRecords with status IN {SCHEDULED, IN_TRANSIT} -> CANCELLED; IN_TRANSIT cancels restore origin premises.current_head_count"

  - entity: MovementRecord
    initial_state: SCHEDULED
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_TRANSIT
        trigger: "POST /api/movement-records/{id}/depart"
        actor: AccreditedVet
        preconditions:
          - "status == SCHEDULED (ERR_MOVEMENT_NOT_ADVANCEABLE)"
          - "permit.status == ISSUED (ERR_PERMIT_NOT_ISSUED)"
          - "logical clock within [permit.valid_from, permit.valid_until] and <= certificate.valid_until (ERR_MOVEMENT_OUTSIDE_PERMIT_WINDOW)"
          - "origin premises disease_status NOT IN {QUARANTINE_HOLD, INFECTED} (ERR_PREMISES_DISEASE_HOLD)"
          - "no ACTIVE OutbreakZone covering origin (county, species) at the logical clock (ERR_OUTBREAK_MOVEMENT_RESTRICTION)"
          - "head_count <= origin premises.current_head_count (ERR_HEAD_COUNT_EXCEEDS_INVENTORY)"
        side_effects:
          - "departed_at := logical clock"
          - "origin premises.current_head_count -= head_count (premises_inventory reconciliation)"

      - from: IN_TRANSIT
        to: DELIVERED
        trigger: "POST /api/movement-records/{id}/arrive"
        actor: AccreditedVet
        preconditions:
          - "status == IN_TRANSIT (ERR_MOVEMENT_NOT_ADVANCEABLE)"
        side_effects:
          - "arrived_at := logical clock (traceback timestamp)"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /api/movement-records/{id}/cancel"
        actor: AccreditedVet
        preconditions:
          - "status IN {SCHEDULED, IN_TRANSIT} (ERR_MOVEMENT_NOT_ADVANCEABLE)"
        side_effects:
          - "permit headroom released (committed/projected recompute)"

      - from: IN_TRANSIT
        to: CANCELLED
        trigger: "POST /api/movement-records/{id}/cancel"
        actor: AccreditedVet
        preconditions:
          - "status IN {SCHEDULED, IN_TRANSIT} (ERR_MOVEMENT_NOT_ADVANCEABLE)"
        side_effects:
          - "origin premises.current_head_count += head_count (compensating restore)"
          - "permit headroom released (committed/projected recompute)"

  - entity: OutbreakZone
    initial_state: MONITORING
    terminal_states: [RESOLVED]
    transitions:
      - from: MONITORING
        to: ACTIVE
        trigger: "POST /api/outbreak-zones/{id}/escalate"
        actor: StateVetOfficer
        preconditions:
          - "status IN {MONITORING, CONTAINED} (ERR_ZONE_INVALID_TRANSITION)"
        side_effects:
          - "cascade link 1: every Premises with county == zone.county and species_code == zone.species_code and disease_status NOT IN {INFECTED} -> disease_status := QUARANTINE_HOLD"
          - "cascade link 2: every Certificate whose origin premises was just held and whose status IN {ISSUED, TRANSMITTED} -> ENTRY_BLOCKED (pre_block_status saved)"
          - "cascade link 3: every MovementPermit with status == ISSUED whose certificate was just blocked -> SUSPENDED"

      - from: CONTAINED
        to: ACTIVE
        trigger: "POST /api/outbreak-zones/{id}/escalate"
        actor: StateVetOfficer
        preconditions:
          - "status IN {MONITORING, CONTAINED} (ERR_ZONE_INVALID_TRANSITION)"
        side_effects:
          - "same three-link cascade as MONITORING -> ACTIVE (re-escalation loop)"
        note: "Cyclic re-escalation: a contained outbreak can flare back to ACTIVE."

      - from: ACTIVE
        to: CONTAINED
        trigger: "POST /api/outbreak-zones/{id}/contain"
        actor: StateVetOfficer
        preconditions:
          - "status == ACTIVE (ERR_ZONE_INVALID_TRANSITION)"
        side_effects: []
        note: "Containment keeps all holds in place; only RESOLVED releases them."

      - from: MONITORING
        to: RESOLVED
        trigger: "POST /api/outbreak-zones/{id}/resolve"
        actor: StateVetOfficer
        preconditions:
          - "status IN {MONITORING, CONTAINED} (ERR_ZONE_INVALID_TRANSITION)"
        side_effects: []

      - from: CONTAINED
        to: RESOLVED
        trigger: "POST /api/outbreak-zones/{id}/resolve"
        actor: StateVetOfficer
        preconditions:
          - "status IN {MONITORING, CONTAINED} (ERR_ZONE_INVALID_TRANSITION)"
        side_effects:
          - "restore link 1: every Premises held by this zone (county + species match, disease_status == QUARANTINE_HOLD) with no other ACTIVE zone covering it and no ACTIVE QuarantineOrder on it -> disease_status := MONITORED"
          - "restore link 2: every Certificate in ENTRY_BLOCKED whose origin premises was just restored -> pre_block_status (pre_block_status := null)"
          - "restore link 3: every MovementPermit in SUSPENDED whose certificate was just restored -> ISSUED"

  - entity: QuarantineOrder
    initial_state: ACTIVE
    terminal_states: [LIFTED, EXPIRED]
    transitions:
      - from: ACTIVE
        to: LIFTED
        trigger: "POST /api/quarantine-orders/{id}/lift"
        actor: StateVetOfficer
        preconditions:
          - "status == ACTIVE (ERR_QUARANTINE_NOT_ACTIVE)"
          - "X-User-ID != issued_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "premises.disease_status := MONITORED when premises.disease_status == QUARANTINE_HOLD and no other ACTIVE QuarantineOrder covers (premises, species) and no ACTIVE OutbreakZone covers (county, species); INFECTED premises stay INFECTED"

      - from: ACTIVE
        to: EXPIRED
        trigger: "system: logical clock advances past end_at (lazily materialized on the first read or write after expiry)"
        actor: system
        preconditions:
          - "logical clock > end_at"
        side_effects:
          - "same premises re-evaluation as LIFTED"

  - entity: TestRecord
    initial_state: RESULT_PENDING
    terminal_states: [NEGATIVE, POSITIVE]
    transitions:
      - from: RESULT_PENDING
        to: NEGATIVE
        trigger: "POST /api/test-records/{id}/result"
        actor: LabTechnician
        preconditions:
          - "result == RESULT_PENDING (ERR_TEST_RECORD_NOT_PENDING)"
        side_effects: []

      - from: RESULT_PENDING
        to: POSITIVE
        trigger: "POST /api/test-records/{id}/result"
        actor: LabTechnician
        preconditions:
          - "result == RESULT_PENDING (ERR_TEST_RECORD_NOT_PENDING)"
        side_effects:
          - "cascade link 1: premises.disease_status := INFECTED"
          - "cascade link 2a: premises becoming INFECTED auto-creates a QuarantineOrder (start_at := clock, end_at := clock + 30 days, disease_code derived from test_type, reason := AUTO_POSITIVE_TEST:<test_record_id>, issued_by_user_id := 'system') unless an ACTIVE QuarantineOrder already covers (premises, species)"
          - "cascade link 2b: premises becoming INFECTED rejects every Certificate with origin_premises_id == this premises and status IN {DRAFT, PENDING_REVIEW} -> REJECTED with reject_reason := AUTO_POSITIVE_TEST"

  - entity: Veterinarian
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /api/veterinarians/{id}/suspend"
        actor: StateVetOfficer
        preconditions:
          - "status == ACTIVE (ERR_VET_NOT_SUSPENDABLE)"
        side_effects: []
        note: "is_credential_current recomputes on read; suspension blocks submit/issue via ERR_VET_NOT_CURRENT."

  - entity: TransmissionAudit
    initial_state: QUEUED
    terminal_states: [ACKNOWLEDGED, FAILED]
    transitions:
      - from: QUEUED
        to: ACKNOWLEDGED
        trigger: "POST /api/transmission-audits/{id}/acknowledge"
        actor: StateVetOfficer
        preconditions:
          - "status == QUEUED (ERR_TRANSMISSION_NOT_ADVANCEABLE)"
        side_effects:
          - "acknowledged_at := logical clock"
          - "bubble-up: certificate with id == audit.certificate_id transitions ISSUED -> TRANSMITTED (no-op if already TRANSMITTED)"

      - from: QUEUED
        to: FAILED
        trigger: "POST /api/transmission-audits/{id}/fail"
        actor: StateVetOfficer
        preconditions:
          - "status == QUEUED (ERR_TRANSMISSION_NOT_ADVANCEABLE)"
        side_effects:
          - "failure_reason := request failure_reason"
        note: "Certificate remains ISSUED; a later POST /transmit appends a fresh QUEUED audit row (audit trail is append-only)."

  - entity: Premises
    initial_state: MONITORED
    terminal_states: []
    transitions:
      - from: MONITORED
        to: ACCREDITED_FREE
        trigger: "POST /api/premises/{id}/accredit"
        actor: StateVetOfficer
        preconditions:
          - "disease_status == MONITORED (ERR_PREMISES_NOT_ACCREDITABLE)"
          - "no ACTIVE QuarantineOrder covers (premises, species) (ERR_PREMISES_NOT_ACCREDITABLE)"
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: permit-adjust-stale-version
    parent_entity: MovementPermit
    write_endpoint: "PATCH /api/movement-permits/{id}"
    occ_field: expected_permit_version
    description: |
      Adjusting an ISSUED permit's allocated_head_count or valid_until against a
      version the client no longer holds is rejected. A second sequential adjust
      observes status still ISSUED and would legitimately succeed under product
      semantics, so the stale write is detected only via the version check.
    error_id: ERR_STALE_PERMIT_VERSION
    http_status: 412

  - rule_id: requirement-amend-stale-version
    parent_entity: EntryRequirement
    write_endpoint: "PATCH /api/entry-requirements/{id}"
    occ_field: expected_requirement_version
    description: |
      Amending an ACTIVE entry-requirement matrix row against a version the
      client no longer holds is rejected. The row remains ACTIVE after any
      amend, so a second sequential amend would legitimately succeed; only the
      version check detects the stale write.
    error_id: ERR_STALE_REQUIREMENT_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: cvi_issuance_fee
    trigger: "Certificate submit (provisional variant) and Certificate issue (final variant)"
    algorithm: threshold
    formula: |
      rate = PER_HEAD_RATE_CENTS[certificate.species_code]
      surcharge = MONITORED_SURCHARGE_CENTS if origin_premises.disease_status == MONITORED at evaluation time
                  else 0   (ACCREDITED_FREE -> 0; QUARANTINE_HOLD / INFECTED cannot reach issue)
      raw = FEE_BASE_CENTS + rate * certificate.head_count + surcharge
      fee_cents = min(FEE_CAP_CENTS, raw)
    input_set: "The single Certificate being submitted/issued; its origin Premises' disease_status evaluated at the moment of the triggering transition."
    constants:
      FEE_BASE_CENTS: 2500
      FEE_CAP_CENTS: 20000
      MONITORED_SURCHARGE_CENTS: 1000
      PER_HEAD_RATE_CENTS: { CATTLE: 150, SWINE: 90, POULTRY: 25, SHEEP_GOAT: 60, EQUINE: 200 }
    precision: "whole cents (integer arithmetic; no rounding step)"
    variants:
      - name: provisional
        when: "computed at DRAFT -> PENDING_REVIEW (submit)"
        difference: "evaluates origin premises.disease_status and head_count as of submit; stored on provisional_fee_cents"
      - name: final
        when: "computed at PENDING_REVIEW -> ISSUED (issue)"
        difference: "re-evaluates origin premises.disease_status at issue; a MONITORED -> ACCREDITED_FREE change between submit and issue makes final_fee_cents exactly MONITORED_SURCHARGE_CENTS less than provisional_fee_cents"

  - name: movement_fee_reconciliation
    trigger: "MovementRecord creation, depart, and cancel (recomputes MovementPermit.total_movement_fees_cents)"
    algorithm: aggregation
    formula: |
      For each MovementRecord r (computed once, at creation):
        r.movement_fee_cents = round_half_up(r.head_count * PER_HEAD_MOVEMENT_RATE_CENTS[species])
        where species = r.permit.certificate.species_code
      permit.total_movement_fees_cents =
        SUM(r.movement_fee_cents) over r with r.permit_id == permit.id
        AND r.status IN {SCHEDULED, IN_TRANSIT, DELIVERED}
      PINNED ROUNDING ORDER: each line item is rounded to whole cents (round_half_up)
      BEFORE summation. Sum-then-round is a rejected interpretation.
    input_set: "MovementRecords of the permit with status IN {SCHEDULED, IN_TRANSIT, DELIVERED}; CANCELLED records contribute nothing."
    constants:
      PER_HEAD_MOVEMENT_RATE_CENTS: { CATTLE: 137.5, SWINE: 62.5, POULTRY: 10.25, SHEEP_GOAT: 45.5, EQUINE: 210.75 }
    precision: "whole cents, round_half_up per line item"

  - name: permit_headroom
    trigger: "read of MovementPermit; gate at MovementRecord creation (committed variant) and at PATCH allocation checks"
    algorithm: aggregation
    formula: |
      committed_headroom = allocated_head_count
        - SUM(head_count of MovementRecords with permit_id == permit.id AND status IN {SCHEDULED, IN_TRANSIT, DELIVERED})
      projected_headroom = allocated_head_count
        - SUM(head_count of MovementRecords with permit_id == permit.id AND status IN {IN_TRANSIT, DELIVERED})
      Scheduling gate: new record allowed iff record.head_count <= committed_headroom (ERR_PERMIT_HEADROOM_EXCEEDED otherwise).
      PATCH gate: new allocated_head_count >= (allocated_head_count - committed_headroom) i.e. >= consumed (ERR_ALLOCATION_BELOW_CONSUMED otherwise).
    input_set: "MovementRecords of the permit, partitioned by status as above."
    constants: {}
    precision: "integer animals"
    variants:
      - name: committed
        when: "gates MovementRecord scheduling"
        difference: "counts SCHEDULED records as consumed capacity"
      - name: projected
        when: "reported on permit reads for planning"
        difference: "counts only IN_TRANSIT and DELIVERED records; a permit with a SCHEDULED record of 6 and allocation 20 reports committed_headroom 14 but projected_headroom 20"

  - name: certificate_validity_window
    trigger: "Certificate issue (computes valid_until); Certificate reads/writes after clock advance (LAPSED check); permit issue and movement scheduling/departure (window membership)"
    algorithm: threshold
    formula: |
      valid_until = issued_at + CVI_VALIDITY_DAYS days
      LAPSED applies when logical_clock > valid_until (equality does NOT lapse).
      Permit window containment (at permit issue):
        valid_from >= certificate.issued_at AND valid_until <= certificate.valid_until   (both inclusive)
      Movement window membership (at scheduling and departure, using planned_ship_date / logical clock T):
        permit.valid_from <= T AND T <= permit.valid_until AND T <= certificate.valid_until   (all inclusive)
    input_set: "The certificate under evaluation plus (for membership) the permit being issued or the movement being scheduled/departed."
    constants:
      CVI_VALIDITY_DAYS: 30
    precision: "datetime comparisons at second precision"

  - name: test_and_vaccination_window
    trigger: "Certificate submit"
    algorithm: threshold
    formula: |
      test_age_days = floor((inspection_date - test_record.test_date) / 86400 seconds)
      test qualifies iff 0 <= test_age_days <= entry_requirement.test_validity_days   (INCLUSIVE upper bound)
      test_age_days < 0 (test drawn after inspection) -> ERR_VALIDATION
      vaccination_age_days = floor((inspection_date - vaccination_date) / 86400 seconds)
      vaccination qualifies iff vaccination_age_days >= entry_requirement.vaccination_min_days_before_inspection   (INCLUSIVE bound)
    input_set: "The certificate's test_record and vaccination_date against the matched EntryRequirement row."
    constants: {}
    precision: "whole days (floor of elapsed seconds / 86400)"

  - name: premises_inventory
    trigger: "MovementRecord depart (decrement), MovementRecord cancel from IN_TRANSIT (restore), Premises read"
    algorithm: aggregation
    formula: |
      premises.current_head_count = premises.initial_head_count
        - SUM(mr.head_count) over MovementRecord mr
          where mr.permit.certificate.origin_premises_id == premises.id
          AND mr.status IN {IN_TRANSIT, DELIVERED}
      (SCHEDULED records do not move inventory; CANCELLED records are excluded,
       so depart followed by cancel-from-IN_TRANSIT conserves current_head_count.)
    input_set: "MovementRecords joined via permit_id -> MovementPermit.certificate_id -> Certificate.origin_premises_id."
    constants: {}
    precision: "integer animals"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and non-empty"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "The role in X-User-Role must be listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: business_constraint
    check: "Request body schema: required fields present, types valid, enum values in range, head_count > 0, end_at > start_at, effective_until > effective_from, valid_until >= valid_from, test_date not after inspection_date, inspection_date not after logical clock"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all endpoints with a request body"

  - priority: 4
    category: existence
    check: "Path ids must exist, validated left-to-right; body-supplied FK ids (origin_premises_id, test_record_id, premises_id, certificate_id, permit_id) must exist; creating AccreditedVet must resolve to an existing Veterinarian row"
    error_id: "ERR_PREMISES_NOT_FOUND | ERR_VETERINARIAN_NOT_FOUND | ERR_ENTRY_REQUIREMENT_NOT_FOUND | ERR_TEST_RECORD_NOT_FOUND | ERR_CERTIFICATE_NOT_FOUND | ERR_PERMIT_NOT_FOUND | ERR_MOVEMENT_RECORD_NOT_FOUND | ERR_OUTBREAK_ZONE_NOT_FOUND | ERR_QUARANTINE_ORDER_NOT_FOUND | ERR_TRANSMISSION_AUDIT_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path ids or body FKs"

  - priority: 5
    category: auth
    check: "Ownership: certificate submit/revise require X-User-ID == certificate.vet_id; movement-record create/depart/arrive/cancel require X-User-ID == vet_id of the certificate backing the record's permit"
    error_id: ERR_NOT_CERTIFICATE_OWNER
    http_status: 403
    applies_to: "POST /api/certificates/{id}/submit, POST /api/certificates/{id}/revise, POST /api/movement-records, POST /api/movement-records/{id}/depart, POST /api/movement-records/{id}/arrive, POST /api/movement-records/{id}/cancel"

  - priority: 6
    category: state
    check: "Target resource must be in the state required by the transition (per 1.2): certificate submit/issue/reject/revise/void/transmit, permit issue/adjust, movement depart/arrive/cancel, zone escalate/contain/resolve, quarantine lift, test result, transmission acknowledge/fail, premises accredit, veterinarian suspend"
    error_id: "ERR_CERTIFICATE_NOT_SUBMITTABLE | ERR_CERTIFICATE_NOT_PENDING_REVIEW | ERR_CERTIFICATE_NOT_REVISABLE | ERR_CERTIFICATE_NOT_VOIDABLE | ERR_CERTIFICATE_NOT_TRANSMITTABLE | ERR_PERMIT_NOT_ISSUABLE | ERR_PERMIT_NOT_ADJUSTABLE | ERR_PERMIT_NOT_ISSUED | ERR_MOVEMENT_NOT_ADVANCEABLE | ERR_ZONE_INVALID_TRANSITION | ERR_QUARANTINE_NOT_ACTIVE | ERR_TRANSMISSION_NOT_ADVANCEABLE | ERR_TEST_RECORD_NOT_PENDING | ERR_PREMISES_NOT_ACCREDITABLE | ERR_VET_NOT_SUSPENDABLE"
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 7
    category: business_safety
    check: "Safety gates in order: (a) acting veterinarian is_credential_current (ERR_VET_NOT_CURRENT); (b) origin premises disease_status NOT IN {QUARANTINE_HOLD, INFECTED} (ERR_PREMISES_DISEASE_HOLD); (c) relied-upon test result == NEGATIVE (ERR_TEST_NOT_QUALIFYING); (d) no ACTIVE OutbreakZone covers origin (county, species) at the logical clock (ERR_OUTBREAK_MOVEMENT_RESTRICTION)"
    error_id: "ERR_VET_NOT_CURRENT | ERR_PREMISES_DISEASE_HOLD | ERR_TEST_NOT_QUALIFYING | ERR_OUTBREAK_MOVEMENT_RESTRICTION"
    http_status: 422
    applies_to: "POST /api/certificates/{id}/submit (a,b,c), POST /api/certificates/{id}/issue (a,b), POST /api/movement-records (b,d), POST /api/movement-records/{id}/depart (b,d)"

  - priority: 8
    category: business_referential
    check: "Matrix and linkage integrity in order: (a) an ACTIVE EntryRequirement whose half-open window covers inspection_date exists for (destination_state_code, species_code) (ERR_NO_ACTIVE_ENTRY_REQUIREMENT); (b) certificate.species_code == origin premises.species_code (ERR_PREMISES_SPECIES_MISMATCH, also quarantine species vs premises); (c) test_record matches origin premises, species, and matrix test_type (ERR_TEST_RECORD_MISMATCH)"
    error_id: "ERR_NO_ACTIVE_ENTRY_REQUIREMENT | ERR_PREMISES_SPECIES_MISMATCH | ERR_TEST_RECORD_MISMATCH"
    http_status: 422
    applies_to: "POST /api/certificates/{id}/submit (a,b,c), POST /api/quarantine-orders (b)"

  - priority: 9
    category: business_temporal
    check: "Window rules in order: (a) test whole-day age <= test_validity_days (ERR_TEST_VALIDITY_EXPIRED); (b) vaccination whole-day age >= vaccination_min_days_before_inspection (ERR_VACCINATION_WINDOW_VIOLATION); (c) permit window inside certificate validity (ERR_PERMIT_WINDOW_OUTSIDE_CVI_VALIDITY); (d) movement instant inside permit window and <= certificate.valid_until (ERR_MOVEMENT_OUTSIDE_PERMIT_WINDOW)"
    error_id: "ERR_TEST_VALIDITY_EXPIRED | ERR_VACCINATION_WINDOW_VIOLATION | ERR_PERMIT_WINDOW_OUTSIDE_CVI_VALIDITY | ERR_MOVEMENT_OUTSIDE_PERMIT_WINDOW"
    http_status: 422
    applies_to: "POST /api/certificates/{id}/submit (a,b), POST /api/movement-permits/{id}/issue (c), POST /api/movement-records (d), POST /api/movement-records/{id}/depart (d)"

  - priority: 10
    category: business_constraint
    check: "Constraint rules: head_count <= premises.current_head_count (ERR_HEAD_COUNT_EXCEEDS_INVENTORY); record head_count <= permit.committed_headroom (ERR_PERMIT_HEADROOM_EXCEEDED); issue allocation >= certificate.head_count (ERR_ALLOCATION_BELOW_CERTIFICATE_HEADCOUNT); adjusted allocation >= consumed (ERR_ALLOCATION_BELOW_CONSUMED); zone window overlap among non-terminal zones (ERR_ZONE_WINDOW_OVERLAP); ACTIVE requirement window overlap per (destination_state_code, species_code, test_type) (ERR_REQUIREMENT_WINDOW_OVERLAP); quarantine closed-interval overlap (ERR_QUARANTINE_WINDOW_CONFLICT); 14-day minimum gap after prior quarantine (ERR_QUARANTINE_MIN_GAP_VIOLATION); quarantine lift segregation of duties (ERR_SEGREGATION_OF_DUTIES)"
    error_id: "ERR_HEAD_COUNT_EXCEEDS_INVENTORY | ERR_PERMIT_HEADROOM_EXCEEDED | ERR_ALLOCATION_BELOW_CERTIFICATE_HEADCOUNT | ERR_ALLOCATION_BELOW_CONSUMED | ERR_ZONE_WINDOW_OVERLAP | ERR_REQUIREMENT_WINDOW_OVERLAP | ERR_QUARANTINE_WINDOW_CONFLICT | ERR_QUARANTINE_MIN_GAP_VIOLATION | ERR_SEGREGATION_OF_DUTIES"
    http_status: 422
    applies_to: "POST /api/certificates/{id}/submit, POST /api/movement-records, POST /api/movement-records/{id}/depart, POST /api/movement-permits/{id}/issue, PATCH /api/movement-permits/{id}, POST /api/outbreak-zones, POST /api/entry-requirements, PATCH /api/entry-requirements/{id}, POST /api/quarantine-orders, POST /api/quarantine-orders/{id}/lift"

  - priority: 11
    category: business_constraint
    check: "OCC: expected_permit_version must equal the permit's current version (ERR_STALE_PERMIT_VERSION); expected_requirement_version must equal the requirement's current version (ERR_STALE_REQUIREMENT_VERSION)"
    error_id: "ERR_STALE_PERMIT_VERSION | ERR_STALE_REQUIREMENT_VERSION"
    http_status: 412
    applies_to: "PATCH /api/movement-permits/{id}, PATCH /api/entry-requirements/{id}"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- logical clock (test-driving; outside the /api business surface) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Advance the server logical clock. Startup default (before any call) is exactly 2026-08-01T00:00:00Z; the server NEVER falls back to wall-clock time."
    roles: [ProgramAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects:
      - "lazy auto-transitions materialize on the next read/write (Certificate -> LAPSED, QuarantineOrder -> EXPIRED)"

  # --- Premises ---
  - method: POST
    path: "/api/premises"
    description: "Register a livestock premises"
    roles: [ProgramAdmin]
    code: 201
    input: [name, county, state_code, species_code, initial_head_count, "disease_status?"]
    output: Premises
    side_effects:
      - "disease_status defaults to MONITORED; current_head_count initialized to initial_head_count"

  - method: GET
    path: "/api/premises/{id}"
    description: "Read a premises (materializes lazy EXPIRED evaluation of its quarantine orders first)"
    roles: [ProgramAdmin, StateVetOfficer, AccreditedVet, LabTechnician, StateAuditor]
    code: 200
    input: []
    output: Premises
    side_effects: []

  - method: POST
    path: "/api/premises/{id}/accredit"
    description: "Grant accredited-free standing to a MONITORED premises"
    roles: [StateVetOfficer]
    code: 200
    input: []
    output: Premises
    side_effects:
      - "disease_status := ACCREDITED_FREE"

  # --- Veterinarians ---
  - method: POST
    path: "/api/veterinarians"
    description: "Register an accredited veterinarian"
    roles: [ProgramAdmin]
    code: 201
    input: [full_name, accreditation_number, accreditation_expires_at]
    output: Veterinarian
    side_effects:
      - "status := ACTIVE"

  - method: POST
    path: "/api/veterinarians/{id}/suspend"
    description: "Suspend a veterinarian's accreditation"
    roles: [StateVetOfficer]
    code: 200
    input: []
    output: Veterinarian
    side_effects:
      - "status := SUSPENDED"

  # --- Entry requirements (destination-state matrix) ---
  - method: POST
    path: "/api/entry-requirements"
    description: "Create a destination-state entry requirement matrix row"
    roles: [ProgramAdmin]
    code: 201
    input: [destination_state_code, species_code, test_type, test_validity_days, vaccination_required, "vaccination_min_days_before_inspection?", permit_required, effective_from, "effective_until?"]
    output: EntryRequirement
    side_effects:
      - "rejects when its half-open window overlaps another ACTIVE row for the same (destination_state_code, species_code, test_type) (ERR_REQUIREMENT_WINDOW_OVERLAP)"

  - method: PATCH
    path: "/api/entry-requirements/{id}"
    description: "Amend a matrix row (OCC-guarded)"
    roles: [ProgramAdmin]
    code: 200
    input: [expected_requirement_version, "test_validity_days?", "vaccination_required?", "vaccination_min_days_before_inspection?", "permit_required?", "effective_until?"]
    output: EntryRequirement
    side_effects:
      - "increments EntryRequirement.version by 1"
      - "window-overlap rule re-evaluated when effective_until changes"

  - method: GET
    path: "/api/entry-requirements"
    description: "Query the destination-state entry requirement matrix"
    roles: [ProgramAdmin, StateVetOfficer, AccreditedVet, LabTechnician, StateAuditor]
    code: 200
    input: ["destination_state_code?", "species_code?", "status?", "limit?", "offset?"]
    output: EntryRequirement[]
    side_effects: []

  # --- Test records ---
  - method: POST
    path: "/api/test-records"
    description: "Register a laboratory test drawn on a premises"
    roles: [LabTechnician]
    code: 201
    input: [premises_id, species_code, test_type, test_date, lab_reference]
    output: TestRecord
    side_effects:
      - "result := RESULT_PENDING"

  - method: POST
    path: "/api/test-records/{id}/result"
    description: "Report a test result; POSITIVE triggers the infection cascade"
    roles: [LabTechnician]
    code: 200
    input: [result]
    output: TestRecord
    side_effects:
      - "on POSITIVE: premises.disease_status := INFECTED; auto QuarantineOrder created unless an ACTIVE one already covers (premises, species); DRAFT/PENDING_REVIEW certificates from the premises -> REJECTED (AUTO_POSITIVE_TEST)"

  - method: GET
    path: "/api/premises/{id}/test-records"
    description: "List test records drawn on a premises"
    roles: [ProgramAdmin, StateVetOfficer, AccreditedVet, LabTechnician, StateAuditor]
    code: 200
    input: ["limit?", "offset?"]
    output: TestRecord[]
    side_effects: []

  # --- Certificates (CVI) ---
  - method: POST
    path: "/api/certificates"
    description: "Create a DRAFT certificate of veterinary inspection; vet_id is set from X-User-ID"
    roles: [AccreditedVet]
    code: 201
    input: [origin_premises_id, destination_state_code, species_code, head_count, inspection_date, "test_record_id?", "vaccination_date?", "consignment_description?"]
    output: Certificate
    side_effects:
      - "status := DRAFT; vet_id := X-User-ID"

  - method: GET
    path: "/api/certificates/{id}"
    description: "Read a certificate (materializes lazy LAPSED evaluation first)"
    roles: [ProgramAdmin, StateVetOfficer, AccreditedVet, LabTechnician, StateAuditor]
    code: 200
    input: []
    output: Certificate
    side_effects: []

  - method: GET
    path: "/api/certificates"
    description: "List certificates with filters (traceback support)"
    roles: [ProgramAdmin, StateVetOfficer, AccreditedVet, LabTechnician, StateAuditor]
    code: 200
    input: ["vet_id?", "origin_premises_id?", "test_record_id?", "status?", "destination_state_code?", "limit?", "offset?"]
    output: Certificate[]
    side_effects: []

  - method: POST
    path: "/api/certificates/{id}/submit"
    description: "Submit a DRAFT certificate for state-office review; runs matrix, window, and safety validation; computes provisional fee"
    roles: [AccreditedVet]
    code: 200
    input: []
    output: Certificate
    side_effects:
      - "status DRAFT -> PENDING_REVIEW"
      - "provisional_fee_cents := cvi_issuance_fee (provisional variant)"

  - method: POST
    path: "/api/certificates/{id}/issue"
    description: "Issue the certificate: mints CVI number, stamps issued_at/valid_until, computes final fee"
    roles: [StateVetOfficer]
    code: 200
    input: []
    output: Certificate
    side_effects:
      - "status PENDING_REVIEW -> ISSUED"
      - "cvi_number, issued_at, valid_until assigned (certificate_validity_window)"
      - "final_fee_cents := cvi_issuance_fee (final variant)"

  - method: POST
    path: "/api/certificates/{id}/reject"
    description: "Reject a certificate under review"
    roles: [StateVetOfficer]
    code: 200
    input: [reason_code]
    output: Certificate
    side_effects:
      - "status PENDING_REVIEW -> REJECTED; reject_reason := reason_code"

  - method: POST
    path: "/api/certificates/{id}/revise"
    description: "Return a REJECTED certificate to DRAFT for correction (owner vet only)"
    roles: [AccreditedVet]
    code: 200
    input: []
    output: Certificate
    side_effects:
      - "status REJECTED -> DRAFT; reject_reason := null"

  - method: POST
    path: "/api/certificates/{id}/void"
    description: "Void an issued certificate; cascades to permits and movement records"
    roles: [StateVetOfficer]
    code: 200
    input: [reason]
    output: Certificate
    side_effects:
      - "status -> VOID; void_reason := reason"
      - "cascade: MovementPermits {REQUESTED, ISSUED, SUSPENDED} -> VOIDED; their {SCHEDULED, IN_TRANSIT} MovementRecords -> CANCELLED with inventory restore"

  - method: POST
    path: "/api/certificates/{id}/transmit"
    description: "Electronically transmit the certificate to the destination state; appends a QUEUED TransmissionAudit (no status change)"
    roles: [StateVetOfficer]
    code: 201
    input: [channel]
    output: TransmissionAudit
    side_effects:
      - "TransmissionAudit created (QUEUED) with payload_digest; certificate status unchanged until acknowledgement"

  # --- Movement permits ---
  - method: POST
    path: "/api/movement-permits"
    description: "Request a destination-state entry permit against an ISSUED/TRANSMITTED certificate"
    roles: [AccreditedVet]
    code: 201
    input: [certificate_id, allocated_head_count, valid_from, valid_until]
    output: MovementPermit
    side_effects:
      - "status := REQUESTED"

  - method: GET
    path: "/api/movement-permits/{id}"
    description: "Read a movement permit (headrooms and movement-fee totals are computed fields)"
    roles: [ProgramAdmin, StateVetOfficer, AccreditedVet, LabTechnician, StateAuditor]
    code: 200
    input: []
    output: MovementPermit
    side_effects: []

  - method: GET
    path: "/api/certificates/{id}/movement-permits"
    description: "List permits attached to a certificate"
    roles: [ProgramAdmin, StateVetOfficer, AccreditedVet, LabTechnician, StateAuditor]
    code: 200
    input: ["limit?", "offset?"]
    output: MovementPermit[]
    side_effects: []

  - method: POST
    path: "/api/movement-permits/{id}/issue"
    description: "Issue the permit; mints the permit number"
    roles: [StateVetOfficer]
    code: 200
    input: []
    output: MovementPermit
    side_effects:
      - "status REQUESTED -> ISSUED; permit_number := EP-<destination_state>-<seq>"

  - method: PATCH
    path: "/api/movement-permits/{id}"
    description: "Adjust allocation or window of an ISSUED permit (OCC-guarded)"
    roles: [StateVetOfficer]
    code: 200
    input: [expected_permit_version, "allocated_head_count?", "valid_until?"]
    output: MovementPermit
    side_effects:
      - "increments MovementPermit.version by 1"
      - "headrooms and total_movement_fees_cents recomputed"

  # --- Movement records ---
  - method: POST
    path: "/api/movement-records"
    description: "Schedule a shipment under an ISSUED permit; consumes committed headroom"
    roles: [AccreditedVet]
    code: 201
    input: [permit_id, head_count, destination_name, "destination_county?", planned_ship_date]
    output: MovementRecord
    side_effects:
      - "status := SCHEDULED"
      - "movement_fee_cents computed (per-line rounding); permit headrooms and total_movement_fees_cents recomputed"

  - method: POST
    path: "/api/movement-records/{id}/depart"
    description: "Record departure; decrements origin premises inventory"
    roles: [AccreditedVet]
    code: 200
    input: []
    output: MovementRecord
    side_effects:
      - "status SCHEDULED -> IN_TRANSIT; departed_at := clock; origin premises.current_head_count -= head_count"

  - method: POST
    path: "/api/movement-records/{id}/arrive"
    description: "Record arrival at destination (traceback)"
    roles: [AccreditedVet]
    code: 200
    input: []
    output: MovementRecord
    side_effects:
      - "status IN_TRANSIT -> DELIVERED; arrived_at := clock"

  - method: POST
    path: "/api/movement-records/{id}/cancel"
    description: "Cancel a scheduled or in-transit movement; restores inventory when cancelling from IN_TRANSIT"
    roles: [AccreditedVet]
    code: 200
    input: []
    output: MovementRecord
    side_effects:
      - "status -> CANCELLED; if was IN_TRANSIT: origin premises.current_head_count += head_count; permit headrooms recomputed"

  - method: GET
    path: "/api/movement-permits/{id}/movement-records"
    description: "List movement records under a permit (traceback)"
    roles: [ProgramAdmin, StateVetOfficer, AccreditedVet, LabTechnician, StateAuditor]
    code: 200
    input: ["limit?", "offset?"]
    output: MovementRecord[]
    side_effects: []

  # --- Outbreak zones ---
  - method: POST
    path: "/api/outbreak-zones"
    description: "Declare a disease outbreak zone (starts MONITORING)"
    roles: [StateVetOfficer]
    code: 201
    input: [county, state_code, disease_code, species_code, severity, effective_from, "effective_until?"]
    output: OutbreakZone
    side_effects:
      - "rejects overlapping half-open windows for the same (county, disease_code, species_code) among MONITORING/ACTIVE/CONTAINED zones (ERR_ZONE_WINDOW_OVERLAP)"

  - method: POST
    path: "/api/outbreak-zones/{id}/escalate"
    description: "Escalate MONITORING or CONTAINED zone to ACTIVE; fires the three-link hold cascade"
    roles: [StateVetOfficer]
    code: 200
    input: []
    output: OutbreakZone
    side_effects:
      - "cascade: premises (county+species) -> QUARANTINE_HOLD; their ISSUED/TRANSMITTED certificates -> ENTRY_BLOCKED; those certificates' ISSUED permits -> SUSPENDED"

  - method: POST
    path: "/api/outbreak-zones/{id}/contain"
    description: "Mark an ACTIVE zone contained (holds stay in place)"
    roles: [StateVetOfficer]
    code: 200
    input: []
    output: OutbreakZone
    side_effects: []

  - method: POST
    path: "/api/outbreak-zones/{id}/resolve"
    description: "Resolve a MONITORING or CONTAINED zone; releases holds via the restore cascade"
    roles: [StateVetOfficer]
    code: 200
    input: []
    output: OutbreakZone
    side_effects:
      - "restore cascade: held premises (no other hold) -> MONITORED; ENTRY_BLOCKED certificates -> pre_block_status; SUSPENDED permits -> ISSUED"

  # --- Quarantine orders ---
  - method: POST
    path: "/api/quarantine-orders"
    description: "Issue a quarantine order on a premises"
    roles: [StateVetOfficer]
    code: 201
    input: [premises_id, species_code, disease_code, start_at, end_at, reason]
    output: QuarantineOrder
    side_effects:
      - "issued_by_user_id := X-User-ID"
      - "premises.disease_status := QUARANTINE_HOLD unless INFECTED"
      - "closed-interval overlap (ERR_QUARANTINE_WINDOW_CONFLICT) and 14-day minimum gap (ERR_QUARANTINE_MIN_GAP_VIOLATION) enforced"

  - method: POST
    path: "/api/quarantine-orders/{id}/lift"
    description: "Lift an ACTIVE quarantine order; the issuing officer may not lift their own order"
    roles: [StateVetOfficer]
    code: 200
    input: []
    output: QuarantineOrder
    side_effects:
      - "status ACTIVE -> LIFTED; premises re-evaluated to MONITORED when no other hold remains and not INFECTED"

  - method: GET
    path: "/api/premises/{id}/quarantine-orders"
    description: "List quarantine orders for a premises"
    roles: [ProgramAdmin, StateVetOfficer, AccreditedVet, LabTechnician, StateAuditor]
    code: 200
    input: ["limit?", "offset?"]
    output: QuarantineOrder[]
    side_effects: []

  # --- Transmission audits ---
  - method: GET
    path: "/api/certificates/{id}/transmissions"
    description: "List the append-only transmission audit trail for a certificate"
    roles: [ProgramAdmin, StateVetOfficer, AccreditedVet, LabTechnician, StateAuditor]
    code: 200
    input: ["limit?", "offset?"]
    output: TransmissionAudit[]
    side_effects: []

  - method: POST
    path: "/api/transmission-audits/{id}/acknowledge"
    description: "Record destination-state acknowledgement; bubbles the certificate to TRANSMITTED"
    roles: [StateVetOfficer]
    code: 200
    input: []
    output: TransmissionAudit
    side_effects:
      - "status QUEUED -> ACKNOWLEDGED; acknowledged_at := clock"
      - "bubble-up: certificate ISSUED -> TRANSMITTED"

  - method: POST
    path: "/api/transmission-audits/{id}/fail"
    description: "Record a transmission failure; certificate stays ISSUED and may be re-transmitted"
    roles: [StateVetOfficer]
    code: 200
    input: [failure_reason]
    output: TransmissionAudit
    side_effects:
      - "status QUEUED -> FAILED; failure_reason recorded"

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or empty" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_NOT_CERTIFICATE_OWNER, http: 403, condition: "Acting vet is not the certificate's vet of record (directly, or via the permit->certificate chain for movement records)" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed body: missing required field, bad type, unknown enum, head_count <= 0, inverted windows, test_date after inspection_date, inspection_date after the logical clock" }
  - { id: ERR_PREMISES_NOT_FOUND, http: 404, condition: "Premises id in path or body does not exist" }
  - { id: ERR_VETERINARIAN_NOT_FOUND, http: 404, condition: "Veterinarian id in path does not exist, or creating AccreditedVet's X-User-ID matches no Veterinarian row" }
  - { id: ERR_ENTRY_REQUIREMENT_NOT_FOUND, http: 404, condition: "EntryRequirement id in path does not exist" }
  - { id: ERR_TEST_RECORD_NOT_FOUND, http: 404, condition: "TestRecord id in path or body does not exist" }
  - { id: ERR_CERTIFICATE_NOT_FOUND, http: 404, condition: "Certificate id in path or body does not exist" }
  - { id: ERR_PERMIT_NOT_FOUND, http: 404, condition: "MovementPermit id in path or body does not exist" }
  - { id: ERR_MOVEMENT_RECORD_NOT_FOUND, http: 404, condition: "MovementRecord id in path does not exist" }
  - { id: ERR_OUTBREAK_ZONE_NOT_FOUND, http: 404, condition: "OutbreakZone id in path does not exist" }
  - { id: ERR_QUARANTINE_ORDER_NOT_FOUND, http: 404, condition: "QuarantineOrder id in path does not exist" }
  - { id: ERR_TRANSMISSION_AUDIT_NOT_FOUND, http: 404, condition: "TransmissionAudit id in path does not exist" }
  - { id: ERR_CERTIFICATE_NOT_SUBMITTABLE, http: 409, condition: "Submit attempted from a state other than DRAFT" }
  - { id: ERR_CERTIFICATE_NOT_PENDING_REVIEW, http: 409, condition: "Issue or reject attempted from a state other than PENDING_REVIEW" }
  - { id: ERR_CERTIFICATE_NOT_REVISABLE, http: 409, condition: "Revise attempted from a state other than REJECTED" }
  - { id: ERR_CERTIFICATE_NOT_VOIDABLE, http: 409, condition: "Void attempted from a state other than ISSUED, TRANSMITTED, or ENTRY_BLOCKED" }
  - { id: ERR_CERTIFICATE_NOT_TRANSMITTABLE, http: 409, condition: "Transmit attempted from a state other than ISSUED or TRANSMITTED" }
  - { id: ERR_PERMIT_NOT_ISSUABLE, http: 409, condition: "Permit issue attempted when permit not REQUESTED or backing certificate not in {ISSUED, TRANSMITTED}" }
  - { id: ERR_PERMIT_NOT_ADJUSTABLE, http: 409, condition: "PATCH attempted when permit is not ISSUED" }
  - { id: ERR_PERMIT_NOT_ISSUED, http: 409, condition: "Movement scheduling or departure attempted while permit is not ISSUED (e.g., SUSPENDED)" }
  - { id: ERR_MOVEMENT_NOT_ADVANCEABLE, http: 409, condition: "Depart/arrive/cancel attempted from an incompatible MovementRecord state" }
  - { id: ERR_ZONE_INVALID_TRANSITION, http: 409, condition: "Escalate/contain/resolve attempted from an incompatible OutbreakZone state" }
  - { id: ERR_QUARANTINE_NOT_ACTIVE, http: 409, condition: "Lift attempted on a non-ACTIVE QuarantineOrder" }
  - { id: ERR_TRANSMISSION_NOT_ADVANCEABLE, http: 409, condition: "Acknowledge/fail attempted on a non-QUEUED TransmissionAudit" }
  - { id: ERR_TEST_RECORD_NOT_PENDING, http: 409, condition: "Result reported for an already-resolved TestRecord" }
  - { id: ERR_PREMISES_NOT_ACCREDITABLE, http: 409, condition: "Accredit attempted when disease_status != MONITORED or an ACTIVE quarantine covers the premises" }
  - { id: ERR_VET_NOT_SUSPENDABLE, http: 409, condition: "Suspend attempted on an already-SUSPENDED veterinarian" }
  - { id: ERR_VET_NOT_CURRENT, http: 422, condition: "Acting veterinarian is SUSPENDED or accreditation_expires_at is before the logical clock" }
  - { id: ERR_PREMISES_DISEASE_HOLD, http: 422, condition: "Origin premises disease_status is QUARANTINE_HOLD or INFECTED" }
  - { id: ERR_TEST_NOT_QUALIFYING, http: 422, condition: "Relied-upon test result is RESULT_PENDING or POSITIVE" }
  - { id: ERR_OUTBREAK_MOVEMENT_RESTRICTION, http: 422, condition: "An ACTIVE OutbreakZone covers the origin (county, species) at the logical clock" }
  - { id: ERR_NO_ACTIVE_ENTRY_REQUIREMENT, http: 422, condition: "No ACTIVE EntryRequirement row matches (destination_state_code, species_code) with a window covering inspection_date" }
  - { id: ERR_PREMISES_SPECIES_MISMATCH, http: 422, condition: "Certificate or quarantine species_code differs from the premises' species_code" }
  - { id: ERR_TEST_RECORD_MISMATCH, http: 422, condition: "test_record's premises, species, or test_type does not match the certificate / matrix row" }
  - { id: ERR_TEST_VALIDITY_EXPIRED, http: 422, condition: "Test whole-day age at inspection exceeds the matrix row's test_validity_days" }
  - { id: ERR_VACCINATION_WINDOW_VIOLATION, http: 422, condition: "Vaccination missing, or whole-day age at inspection is less than vaccination_min_days_before_inspection" }
  - { id: ERR_PERMIT_WINDOW_OUTSIDE_CVI_VALIDITY, http: 422, condition: "Permit [valid_from, valid_until] not contained in [certificate.issued_at, certificate.valid_until]" }
  - { id: ERR_MOVEMENT_OUTSIDE_PERMIT_WINDOW, http: 422, condition: "Movement instant (planned_ship_date at scheduling, clock at departure) outside [permit.valid_from, permit.valid_until] or after certificate.valid_until" }
  - { id: ERR_HEAD_COUNT_EXCEEDS_INVENTORY, http: 422, condition: "Certificate or movement head_count exceeds origin premises.current_head_count" }
  - { id: ERR_PERMIT_HEADROOM_EXCEEDED, http: 422, condition: "Movement head_count exceeds permit.committed_headroom" }
  - { id: ERR_ALLOCATION_BELOW_CERTIFICATE_HEADCOUNT, http: 422, condition: "Permit issue with allocated_head_count < certificate.head_count" }
  - { id: ERR_ALLOCATION_BELOW_CONSUMED, http: 422, condition: "PATCH allocation below already-consumed head count" }
  - { id: ERR_ZONE_WINDOW_OVERLAP, http: 409, condition: "New zone's half-open window overlaps a MONITORING/ACTIVE/CONTAINED zone for the same (county, disease_code, species_code)" }
  - { id: ERR_REQUIREMENT_WINDOW_OVERLAP, http: 409, condition: "New or amended requirement's half-open window overlaps another ACTIVE row for the same (destination_state_code, species_code, test_type)" }
  - { id: ERR_QUARANTINE_WINDOW_CONFLICT, http: 409, condition: "New order's closed interval overlaps an ACTIVE order for the same (premises, species)" }
  - { id: ERR_QUARANTINE_MIN_GAP_VIOLATION, http: 422, condition: "New order starts less than 14 days after the most recent LIFTED/EXPIRED order's end_at for the same (premises, species)" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Quarantine lift attempted by the same user id recorded as issued_by_user_id" }
  - { id: ERR_STALE_PERMIT_VERSION, http: 412, condition: "expected_permit_version does not equal the permit's current version" }
  - { id: ERR_STALE_REQUIREMENT_VERSION, http: 412, condition: "expected_requirement_version does not equal the requirement's current version" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ProgramAdmin
    description: "Office administrator maintaining reference data (premises registry, veterinarian registry, entry-requirement matrix) and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /api/premises"
      - "POST /api/veterinarians"
      - "POST /api/entry-requirements"
      - "PATCH /api/entry-requirements/{id}"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "all GET endpoints"

  - name: StateVetOfficer
    description: "State veterinarian office official: reviews and issues certificates, issues and adjusts permits, declares and manages outbreak zones, issues and lifts quarantines, transmits certificates"
    identity: opaque
    exclusive_operations:
      - "POST /api/certificates/{id}/issue, /reject, /void, /transmit"
      - "POST /api/movement-permits/{id}/issue; PATCH /api/movement-permits/{id}"
      - "POST /api/outbreak-zones and /escalate, /contain, /resolve"
      - "POST /api/quarantine-orders and /lift (lift requires a different user id than the issuer)"
      - "POST /api/veterinarians/{id}/suspend; POST /api/premises/{id}/accredit"
      - "POST /api/transmission-audits/{id}/acknowledge and /fail"
    shared_operations:
      - "all GET endpoints"

  - name: AccreditedVet
    description: "Accredited veterinarian performing inspections: drafts and submits certificates, requests permits, schedules and advances movements; identity is the Veterinarian entity"
    identity: "entity_backed:Veterinarian"
    exclusive_operations:
      - "POST /api/certificates; POST /api/certificates/{id}/submit and /revise (owner only)"
      - "POST /api/movement-permits"
      - "POST /api/movement-records and /depart, /arrive, /cancel (vet of record via permit->certificate)"
    shared_operations:
      - "all GET endpoints"

  - name: LabTechnician
    description: "Diagnostic laboratory operator registering tests and reporting results"
    identity: opaque
    exclusive_operations:
      - "POST /api/test-records"
      - "POST /api/test-records/{id}/result"
    shared_operations:
      - "all GET endpoints"

  - name: StateAuditor
    description: "Read-only auditor for traceback and compliance review"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "all GET endpoints"
