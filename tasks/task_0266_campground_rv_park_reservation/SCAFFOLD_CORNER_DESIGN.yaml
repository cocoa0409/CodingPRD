          Two strictly sequential creates: first create succeeds (Site.version
          advances), the second still carrying the pre-create site version
          (${site_v0}, an expression over the captured version) -> ERR_STALE_SITE_VERSION (412).
        test_recipe:
          setup: ["RV Site S (version captured); first reservation created so Site.version advances."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-07-01T12:00:00Z" }
              as: Operator
            - call: "POST /parks"
              payload: { name: "Pinewood", deposit_pct: 0.30, tax_rate: 0.08 }
              as: Operator
              captures: { park_id: $.data.id }
            - call: "POST /parks/${park_id}/rate-plans"
              payload: { site_type: "RV", nightly_rate_cents: 5000, weekly_rate_cents: 30000, monthly_rate_cents: 100000 }
              as: Operator
              captures: { rp_id: $.data.id }
            - call: "POST /parks/${park_id}/sites"
              payload: { rate_plan_id: "${rp_id}", label: "A-1", site_type: "RV", hookup_level: "FULL", max_length_of_stay_nights: 30 }
              as: Operator
              captures: { site_id: $.data.id, site_v0: $.data.version }
            - call: "POST /guests"
              payload: { email: "g1@x.com", full_name: "Guest One" }
              as: Operator
              captures: { g_id: $.data.id }
            - call: "POST /sites/${site_id}/reservations"
              payload: { guest_id: "${g_id}", check_in_date: "2026-08-01", check_out_date: "2026-08-05", expected_site_version: "${site_v0}" }
              as: Guest
              as_user_id: "${g_id}"
              captures: { r1_id: $.data.id }
          trigger:
            - call: "POST /sites/${site_id}/reservations"
              payload: { guest_id: "${g_id}", check_in_date: "2026-09-01", check_out_date: "2026-09-05", expected_site_version: "${site_v0}" }
              as: Guest
              as_user_id: "${g_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 412"
            - "data.error_id == ERR_STALE_SITE_VERSION"

      - name: occ_fresh_site_version_succeeds_and_bumps
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[reservation-create-stale-site]
          - entities.Site.fields.version
        distinguishing_aspect: "A create carrying the current Site.version (re-read after the first create) succeeds (201) and bumps Site.version again."
        test_recipe:
          setup: ["RV Site S; first reservation created; client re-reads the site to get the fresh version."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-07-01T12:00:00Z" }
              as: Operator
            - call: "POST /parks"
              payload: { name: "Pinewood", deposit_pct: 0.30, tax_rate: 0.08 }
              as: Operator
              captures: { park_id: $.data.id }
            - call: "POST /parks/${park_id}/rate-plans"
              payload: { site_type: "RV", nightly_rate_cents: 5000, weekly_rate_cents: 30000, monthly_rate_cents: 100000 }
              as: Operator
              captures: { rp_id: $.data.id }
            - call: "POST /parks/${park_id}/sites"
              payload: { rate_plan_id: "${rp_id}", label: "A-1", site_type: "RV", hookup_level: "FULL", max_length_of_stay_nights: 30 }
              as: Operator
              captures: { site_id: $.data.id, site_v0: $.data.version }
            - call: "POST /guests"
              payload: { email: "g1@x.com", full_name: "Guest One" }
              as: Operator
              captures: { g_id: $.data.id }
            - call: "POST /sites/${site_id}/reservations"
              payload: { guest_id: "${g_id}", check_in_date: "2026-08-01", check_out_date: "2026-08-05", expected_site_version: "${site_v0}" }
              as: Guest
              as_user_id: "${g_id}"
              captures: { r1_id: $.data.id }
            - call: "GET /sites/${site_id}"
              payload: {}
              as: Operator
              captures: { site_v1: $.data.version }
          trigger:
            - call: "POST /sites/${site_id}/reservations"
              payload: { guest_id: "${g_id}", check_in_date: "2026-09-01", check_out_date: "2026-09-05", expected_site_version: "${site_v1}" }
              as: Guest
              as_user_id: "${g_id}"
              captures: { r2_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Reservation.${r2_id}.reservation_status == REQUESTED"
            - "Site.${site_id}.version after this create is greater than ${site_v1}"

      - name: derived_booked_night_count_after_create
        claim_type: derived_field_reconciliation
        grounds:
          - calculations.site_booked_nights
          - entities.Site.fields.booked_night_count
        distinguishing_aspect: "After creating a 10-night reservation, Site.booked_night_count == 10 (REQUESTED counts toward booked nights)."
        test_recipe:
          setup: ["RV Site S booked_night_count=0."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-07-01T12:00:00Z" }
              as: Operator
            - call: "POST /parks"
              payload: { name: "Pinewood", deposit_pct: 0.30, tax_rate: 0.08 }
              as: Operator
              captures: { park_id: $.data.id }
            - call: "POST /parks/${park_id}/rate-plans"
              payload: { site_type: "RV", nightly_rate_cents: 5000, weekly_rate_cents: 30000, monthly_rate_cents: 100000 }
              as: Operator
              captures: { rp_id: $.data.id }
            - call: "POST /parks/${park_id}/sites"
              payload: { rate_plan_id: "${rp_id}", label: "A-1", site_type: "RV", hookup_level: "FULL", max_length_of_stay_nights: 30 }
              as: Operator
              captures: { site_id: $.data.id, site_v0: $.data.version }
            - call: "POST /guests"
              payload: { email: "g1@x.com", full_name: "Guest One" }
              as: Operator
              captures: { g_id: $.data.id }
            - call: "POST /sites/${site_id}/reservations"
              payload: { guest_id: "${g_id}", check_in_date: "2026-08-01", check_out_date: "2026-08-11", expected_site_version: "${site_v0}" }
              as: Guest
              as_user_id: "${g_id}"
              captures: { res_id: $.data.id }
          trigger:
            - call: "GET /sites/${site_id}"
              payload: {}
              as: Operator
              captures: { bnc: $.data.booked_night_count }
          assert:
            - "Site.${site_id}.booked_night_count == 10"

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: confirm_recompute_visible_same_response
        claim_type: immediate
        grounds:
          - state_machines.Reservation.reservation_status.REQUESTED_to_CONFIRMED
          - entities.Reservation.fields.deposit_due_cents
        distinguishing_aspect: "Confirm returns the recomputed reservation in the same response (immediate consistency): reservation_status=CONFIRMED and deposit_due_cents present in the confirm response body."
        test_recipe:
          setup: ["RV Reservation R REQUESTED with deposit paid."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-07-01T12:00:00Z" }
              as: Operator
            - call: "POST /parks"
              payload: { name: "Pinewood", deposit_pct: 0.30, tax_rate: 0.08 }
              as: Operator
              captures: { park_id: $.data.id }
            - call: "POST /parks/${park_id}/rate-plans"
              payload: { site_type: "RV", nightly_rate_cents: 5000, weekly_rate_cents: 30000, monthly_rate_cents: 100000 }
              as: Operator
              captures: { rp_id: $.data.id }
            - call: "POST /parks/${park_id}/cancellation-policies"
              payload: { full_refund_min_days: 14, half_refund_min_days: 7 }
              as: Operator
            - call: "POST /parks/${park_id}/sites"
              payload: { rate_plan_id: "${rp_id}", label: "A-1", site_type: "RV", hookup_level: "FULL", max_length_of_stay_nights: 30 }
              as: Operator
              captures: { site_id: $.data.id, site_v0: $.data.version }
            - call: "POST /guests"
              payload: { email: "g1@x.com", full_name: "Guest One" }
              as: Operator
              captures: { g_id: $.data.id }
            - call: "POST /sites/${site_id}/reservations"
              payload: { guest_id: "${g_id}", check_in_date: "2026-08-01", check_out_date: "2026-08-11", expected_site_version: "${site_v0}" }
              as: Guest
              as_user_id: "${g_id}"
              captures: { res_id: $.data.id, dep_due: $.data.deposit_due_cents }
            - call: "POST /reservations/${res_id}/payments"
              payload: { type: "DEPOSIT", amount_cents: "${dep_due}" }
              as: Guest
              as_user_id: "${g_id}"
          trigger:
            - call: "POST /reservations/${res_id}/confirm"
              payload: {}
              as: Guest
              as_user_id: "${g_id}"
              captures: { st: $.data.reservation_status, dep: $.data.deposit_due_cents }
          assert:
            - "HTTP status == 200"
            - "Reservation.${res_id}.reservation_status == CONFIRMED"
            - "deposit_due_cents == 14580 in the same confirm response"
