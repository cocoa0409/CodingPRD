            - "MedicareRepaymentObligation.${mo_mb2_id}.penalty_cents == 240"

      - name: empty_batch_lock_rejected_at_zero_item_count_boundary
        grounds:
          - validations[priority=43]
          - errors[ERR_BATCH_EMPTY]
          - state_machines.RefundBatch.OPEN_to_LOCKED
          - entities.RefundBatch.fields.item_count
        distinguishing_aspect: |
          Boundary metric 2 — an empty-collection / zero-count edge, reached through
          a different endpoint (POST /refund-batches/{batchId}/lock): a batch whose
          item_count is exactly 0 must be rejected with ERR_BATCH_EMPTY even though
          its state is OPEN and its OCC version matches, and its state must stay OPEN.
        test_recipe:
          setup:
            - "One OPEN RefundBatch B-EMPTY on the TRUST channel with window [2026-08-18T00:00:00Z, 2026-08-20T00:00:00Z), item_count 0 and all three totals at 0."
          setup_api_calls:
