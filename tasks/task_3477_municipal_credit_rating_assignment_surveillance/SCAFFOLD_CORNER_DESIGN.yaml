        distinguishing_aspect: "Posture gates are action-specific: in GRACE (obligation merely OVERDUE), UPGRADE is rejected 409 ERR_UPGRADE_BLOCKED_BY_POSTURE while AFFIRM from the same state succeeds — GRACE permits affirmations but not upgrades."
