              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /rewards/accounts"
              payload: { cardholder_name: "Kai Osterman", email: "kai@example.com", card_product_code: "CORE", enrolled_at: "2025-11-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { a_id: $.data.id }
            - call: "POST /rewards/transactions"
              payload: { account_id: "${a_id}", mcc_code: "5411", amount_cents: 4000000, posted_at: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /rewards/agency-partners"
              payload: { name: "Bare Fare Consolidators", contracted_markup_bps: 0, parity_tolerance_bps: 0, invoice_terms_days: 30 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { ag_id: $.data.id }
            - call: "POST /rewards/inventory-offers"
              payload: { agency_partner_id: "${ag_id}", itinerary_code: "DEN-YYZ-02", depart_at: "2026-09-08T14:00:00Z", return_at: "2026-09-15T11:00:00Z", net_rate_cents: 10000, agency_public_price_cents: 10000, agency_public_seats: 4, portal_seats: 4, tax_cents: 0 }
              as: AgencySupplier
              as_user_id: "${ag_id}"
              captures: { o_id: $.data.id, o_v1: $.data.version }
            - call: "POST /rewards/inventory-offers/${o_id}/book"
              payload: { account_id: "${a_id}", traveler_name: "Kai Osterman", expected_offer_version: "${o_v1}" }
              as: Cardholder
              as_user_id: "${a_id}"
              captures: { ro_first_id: $.data.id }
            - call: "GET /rewards/inventory-offers/${o_id}"
              as: AgencySupplier
              as_user_id: "${ag_id}"
              captures: { o_v2: $.data.version }
            - call: "POST /rewards/inventory-offers/${o_id}/book"
              payload: { account_id: "${a_id}", traveler_name: "Kai Osterman", expected_offer_version: "${o_v2}" }
