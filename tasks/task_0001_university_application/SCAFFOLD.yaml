scenario: |
  University Application Platform (Common App style): applicant profile,
  multi-school joint application, essay customization, recommendation letter
  chain, Early/Regular/Rolling admission, financial aid (FAFSA/CSS Profile),
  waitlist, yield management.

domain_name: "university-application"
api_prefix: ""

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: branching
  relationship_patterns:
    - many_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# Response Envelope (FIXED — verbatim from §1.0)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Applicant
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: "Unique applicant email"
        constraints: "unique across Applicants; lowercase; RFC-5322 minimal pattern"
      - name: full_name
        type: string
        source: input
        description: "Legal full name"
      - name: gpa_unweighted
        type: number
        source: input
        description: "Unweighted GPA on 4.00 scale"
        constraints: "0.00 <= gpa_unweighted <= 4.00, two decimals"
      - name: sat_total
        type: integer
        source: input
        description: "SAT total score (optional; null when test-optional)"
        constraints: "400 <= sat_total <= 1600 when present; nullable"
      - name: residency
        type: enum
        source: input
        description: "Residency category used for school-level cost calculations"
        constraints: "one of {IN_STATE, OUT_OF_STATE, INTERNATIONAL}"
      - name: profile_status
        type: enum
        source: system
        description: "Applicant profile lifecycle state — see §1.2 Applicant SM"
        default: DRAFT
        constraints: "one of {DRAFT, LOCKED}"
      - name: submitted_application_count
        type: integer
        source: computed
        description: "Count of Applications belonging to this applicant whose status is SUBMITTED, UNDER_REVIEW, ADMITTED, WAITLISTED, DENIED, ENROLLED, or DECLINED (i.e., not DRAFT or WITHDRAWN). Recomputed on every Application status change that crosses the in-set / out-of-set boundary: incremented at DRAFT→SUBMITTED; decremented at SUBMITTED→WITHDRAWN. Internal moves (e.g., SUBMITTED→UNDER_REVIEW→ADMITTED→DECLINED) leave the count unchanged."
        default: 0

  - name: School
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "School display name"
        constraints: "unique"
      - name: state_code
        type: string
        source: input
        description: "Two-letter US state code or 'INTL' for foreign campuses"
      - name: admission_track
        type: enum
        source: input
        description: "Pricing/decision regime for this school"
        constraints: "one of {EARLY_DECISION, EARLY_ACTION, REGULAR, ROLLING}"
      - name: deadline_iso
        type: datetime
        source: input
        description: "Application submission deadline (UTC)"
      - name: decision_release_iso
        type: datetime
        source: input
        description: "Date when AdmissionsOfficer must have released decisions by"
        constraints: "decision_release_iso > deadline_iso"
      - name: target_class_size
        type: integer
        source: input
        description: "Target enrolled headcount for the cohort (used by yield management — §1.3)"
        constraints: "1 <= target_class_size <= 10000"
      - name: assumed_yield_rate
        type: number
        source: input
        description: "Expected fraction of ADMITTED applicants who will ENROLL"
        constraints: "0.05 <= assumed_yield_rate <= 1.00"
      - name: in_state_tuition_cents
        type: integer
        source: input
        description: "Annual in-state cost of attendance in USD cents"
        constraints: "in_state_tuition_cents >= 0"
      - name: out_of_state_tuition_cents
        type: integer
        source: input
        description: "Annual out-of-state cost of attendance in USD cents"
        constraints: "out_of_state_tuition_cents >= in_state_tuition_cents"
      - name: international_tuition_cents
        type: integer
        source: input
        description: "Annual international cost of attendance in USD cents"
        constraints: "international_tuition_cents >= out_of_state_tuition_cents"
      - name: admitted_count
        type: integer
        source: computed
        description: "Count of Applications for this school in status ADMITTED (excludes ENROLLED, DECLINED). Recomputed on every Application status transition into/out of ADMITTED. Decrements when an ADMITTED Application transitions to ENROLLED (own action) or to DECLINED (own or cascaded action)."
        default: 0
      - name: enrolled_count
        type: integer
        source: computed
        description: "Count of Applications for this school in status ENROLLED. Recomputed on every transition into/out of ENROLLED."
        default: 0
      - name: declined_count
        type: integer
        source: computed
        description: "Count of Applications for this school whose status == DECLINED. Recomputed on every entry into DECLINED."
        default: 0
      - name: denied_count
        type: integer
        source: computed
        description: "Count of Applications for this school whose status == DENIED. Recomputed on every entry into DENIED."
        default: 0
      - name: yield_posture
        type: enum
        source: computed
        description: "Derived posture from §1.3 yield_posture_calc. Gates waitlist promotion and ED binding enforcement."
        default: OPEN
        constraints: "one of {OPEN, ON_TARGET, OVER_TARGET}"

  - name: Application
    parent: null
    common_fields: true
    fields:
      - name: applicant_id
        type: string
        source: input
        description: "FK -> Applicant.id; the applicant who owns this application"
      - name: school_id
        type: string
        source: input
        description: "FK -> School.id; the school being applied to"
      - name: status
        type: enum
        source: system
        description: "Application lifecycle state — see §1.2 Application SM"
        default: DRAFT
        constraints: "one of {DRAFT, SUBMITTED, UNDER_REVIEW, ADMITTED, WAITLISTED, DENIED, ENROLLED, DECLINED, WITHDRAWN}"
      - name: admission_track_snapshot
        type: enum
        source: system
        description: "Copy of School.admission_track at SUBMIT time; immutable after submit"
        constraints: "one of {EARLY_DECISION, EARLY_ACTION, REGULAR, ROLLING}"
      - name: submitted_at
        type: datetime
        source: system
        description: "Server-stamped at SUBMIT (UTC, three fractional digits)"
        default: null
      - name: decision_at
        type: datetime
        source: system
        description: "Server-stamped when AdmissionsOfficer transitions to ADMITTED, WAITLISTED, or DENIED"
        default: null
      - name: enrollment_decision_at
        type: datetime
        source: system
        description: "Server-stamped when applicant ENROLLs or DECLINEs"
        default: null
      - name: composite_score
        type: number
        source: computed
        description: "Output of §1.3 composite_score_calc; recomputed when essays change, recommendations are received, or aid is finalized while status is SUBMITTED or UNDER_REVIEW"
        default: null

  - name: Essay
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> Application.id; the application this essay belongs to"
      - name: prompt_code
        type: string
        source: input
        description: "Short identifier for the prompt this essay answers (e.g., 'PERSONAL', 'WHY_X', 'DIVERSITY')"
        constraints: "unique within a single application_id"
      - name: word_count
        type: integer
        source: input
        description: "Author-declared word count; server independently re-counts text and rejects on mismatch > 5 words"
        constraints: "1 <= word_count <= 650"
      - name: text
        type: string
        source: input
        description: "Essay body"
      - name: completed
        type: boolean
        source: input
        description: "Applicant marks essay finalized; required before Application SUBMIT"
        default: false

  - name: RecommendationRequest
    parent: null
    common_fields: true
    fields:
      - name: applicant_id
        type: string
        source: input
        description: "FK -> Applicant.id; the applicant seeking the recommendation"
      - name: school_id
        type: string
        source: input
        description: "FK -> School.id; the school the recommendation is being submitted to. (applicant_id, school_id, recommender_email) is unique."
      - name: recommender_email
        type: string
        source: input
        description: "Email of the recommender (opaque external party)"
      - name: status
        type: enum
        source: system
        description: "Recommendation lifecycle state — see §1.2 RecommendationRequest SM"
        default: INVITED
        constraints: "one of {INVITED, SUBMITTED, WAIVED}"
      - name: submitted_at
        type: datetime
        source: system
        description: "Server-stamped when recommender submits letter"
        default: null
      - name: rating
        type: integer
        source: input
        description: "Recommender's overall rating (1=poor, 5=outstanding); set on SUBMIT transition"
        constraints: "1 <= rating <= 5 when status == SUBMITTED; null otherwise"
        default: null

  - name: FinancialAidProfile
    parent: null
    common_fields: true
    fields:
      - name: applicant_id
        type: string
        source: input
        description: "FK -> Applicant.id; one financial aid profile per applicant. (applicant_id) is unique."
      - name: profile_type
        type: enum
        source: input
        description: "FAFSA-only or CSS Profile (richer asset disclosure)"
        constraints: "one of {FAFSA, CSS_PROFILE}"
      - name: household_income_cents
        type: integer
        source: input
        description: "Reported annual household income, USD cents"
        constraints: "household_income_cents >= 0"
      - name: household_size
        type: integer
        source: input
        description: "Number of people in the household"
        constraints: "1 <= household_size <= 20"
      - name: declared_assets_cents
        type: integer
        source: input
        description: "Total disclosed non-retirement assets, USD cents (CSS_PROFILE-only; must be 0 when profile_type == FAFSA)"
        default: 0
      - name: expected_family_contribution_cents
        type: integer
        source: computed
        description: "Output of §1.3 efc_calc; differs between FAFSA and CSS_PROFILE variants for identical income/household inputs."

  - name: AidPackage
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> Application.id; one aid package per Application. (application_id) is unique."
      - name: status
        type: enum
        source: system
        description: "Aid package lifecycle — see §1.2 AidPackage SM"
        default: DRAFT
        constraints: "one of {DRAFT, FINALIZED, REVOKED}"
      - name: grant_cents
        type: integer
        source: input
        description: "Need-based grant offered, USD cents"
        constraints: "grant_cents >= 0"
      - name: loan_cents
        type: integer
        source: input
        description: "Subsidized/unsubsidized loan offered, USD cents"
        constraints: "loan_cents >= 0"
      - name: work_study_cents
        type: integer
        source: input
        description: "Work-study award, USD cents"
        constraints: "work_study_cents >= 0"
      - name: net_cost_cents
        type: integer
        source: computed
        description: "Output of §1.3 net_cost_calc; computed at FINALIZE."
        default: null

  - name: WaitlistEntry
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> Application.id; (application_id) is unique while active"
      - name: rank
        type: integer
        source: system
        description: "1-based promotion rank assigned at waitlist creation, ordered by (Application.composite_score DESC, Application.submitted_at ASC). Stable; never renumbered after promotion."
        constraints: "rank >= 1; unique per school_id among active (status == PENDING) entries"
      - name: status
        type: enum
        source: system
        description: "Waitlist entry state — see §1.2 WaitlistEntry SM"
        default: PENDING
        constraints: "one of {PENDING, PROMOTED, RELEASED}"
      - name: promoted_at
        type: datetime
        source: system
        description: "Server-stamped when entry is promoted"
        default: null

  - name: SystemClock
    parent: null
    common_fields: false
    fields:
      - name: current_utc
        type: datetime
        source: system
        description: "Logical current time used for deadline checks; settable only via /_clock/set_current_utc. Singleton: only one row, with id 'clock-singleton'."

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Applicant
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: LOCKED
        trigger: "automatic on first Application.SUBMIT for this applicant"
        actor: system
        preconditions:
          - "Applicant exists"
        side_effects:
          - "Applicant.profile_status := LOCKED (gpa, sat_total, residency become immutable)"
          - "Applicant.updated_at refreshed"
          - "Applicant.version += 1"
        note: "Auto-transition; not directly triggerable by any endpoint"

  - entity: Application
    initial_state: DRAFT
    terminal_states: [DENIED, ENROLLED, DECLINED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /applications/{id}/submit"
        actor: Applicant
        preconditions:
          - "Application.applicant_id matches X-User-ID"
          - "SystemClock.current_utc <= School.deadline_iso (for the application's school_id)"
          - "Every Essay where essay.application_id == this.id has completed == true"
          - "At least 2 RecommendationRequest rows where (applicant_id == this.applicant_id AND school_id == this.school_id AND status == SUBMITTED)"
          - "FinancialAidProfile exists with applicant_id == this.applicant_id (any profile_type)"
          - "If School.admission_track == EARLY_DECISION: no other Application of this applicant has status SUBMITTED, UNDER_REVIEW, ADMITTED, WAITLISTED, or ENROLLED with admission_track_snapshot == EARLY_DECISION"
        side_effects:
          - "Application.status := SUBMITTED"
          - "Application.admission_track_snapshot := School.admission_track (current value)"
          - "Application.submitted_at := SystemClock.current_utc"
          - "Application.composite_score := output of §1.3 composite_score_calc"
          - "Applicant.submitted_application_count += 1"
          - "If Applicant.profile_status == DRAFT: cascade Applicant DRAFT→LOCKED (transitive: see Applicant SM)"
          - "Application.updated_at refreshed, Application.version += 1"

      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /applications/{id}/begin-review"
        actor: AdmissionsOfficer
        preconditions:
          - "Application.school_id matches X-User-ID's school assignment"
          - "SystemClock.current_utc > School.deadline_iso (for ROLLING this gate is waived: review may begin any time after SUBMIT)"
        side_effects:
          - "Application.status := UNDER_REVIEW"
          - "Application.updated_at refreshed, Application.version += 1"

      - from: UNDER_REVIEW
        to: ADMITTED
        trigger: "POST /applications/{id}/admit"
        actor: AdmissionsOfficer
        preconditions:
          - "Application.school_id matches X-User-ID's school assignment"
          - "Request body must include expected_application_version equal to current Application.version (OCC §1.2.1 plan-create-stale-application)"
        side_effects:
          - "Application.status := ADMITTED"
          - "Application.decision_at := SystemClock.current_utc"
          - "School.admitted_count += 1 (recompute per §1.3 yield_posture_calc inputs)"
          - "School.yield_posture recomputed per §1.3 yield_posture_calc"
          - "Application.updated_at refreshed, Application.version += 1"

      - from: UNDER_REVIEW
        to: WAITLISTED
        trigger: "POST /applications/{id}/waitlist"
        actor: AdmissionsOfficer
        preconditions:
          - "Application.school_id matches X-User-ID's school assignment"
          - "Application.admission_track_snapshot != EARLY_DECISION (ED applications cannot be waitlisted)"
        side_effects:
          - "Application.status := WAITLISTED"
          - "Application.decision_at := SystemClock.current_utc"
          - "Create WaitlistEntry with application_id == this.id, status := PENDING, rank := next unused rank for the school ordered by (composite_score DESC, submitted_at ASC) among already PENDING entries"
          - "Application.updated_at refreshed, Application.version += 1"

      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /applications/{id}/deny"
        actor: AdmissionsOfficer
        preconditions:
          - "Application.school_id matches X-User-ID's school assignment"
        side_effects:
          - "Application.status := DENIED"
          - "Application.decision_at := SystemClock.current_utc"
          - "School.denied_count += 1"
          - "If AidPackage exists with application_id == this.id AND status == FINALIZED: cascade AidPackage FINALIZED→REVOKED"
          - "Application.updated_at refreshed, Application.version += 1"

      - from: ADMITTED
        to: ENROLLED
        trigger: "POST /applications/{id}/enroll"
        actor: Applicant
        preconditions:
          - "Application.applicant_id matches X-User-ID"
          - "AidPackage exists with application_id == this.id AND status == FINALIZED"
          - "No other Application of this applicant has status ENROLLED"
        side_effects:
          - "Application.status := ENROLLED"
          - "Application.enrollment_decision_at := SystemClock.current_utc"
          - "School.admitted_count -= 1 (this application leaves ADMITTED) ; School.enrolled_count += 1"
          - "School.yield_posture recomputed per §1.3 yield_posture_calc"
          - "For every other Application of this applicant whose status ∈ {ADMITTED, WAITLISTED}: cascade that Application to DECLINED (transitive — each cascaded transition fires its own DECLINED side_effects, including the linked school's admitted_count -= 1 (only when cascading from ADMITTED), declined_count += 1, FINALIZED AidPackage → REVOKED, and PENDING WaitlistEntry → RELEASED)"
          - "Application.updated_at refreshed, Application.version += 1"

      - from: ADMITTED
        to: DECLINED
        trigger: "POST /applications/{id}/decline"
        actor: Applicant
        preconditions:
          - "Application.applicant_id matches X-User-ID"
          - "Application.admission_track_snapshot != EARLY_DECISION (ED admit is binding — see Difficulty Rule 7 dependency)"
        side_effects:
          - "Application.status := DECLINED"
          - "Application.enrollment_decision_at := SystemClock.current_utc"
          - "School.admitted_count -= 1 ; School.declined_count += 1"
          - "School.yield_posture recomputed per §1.3 yield_posture_calc"
          - "If AidPackage exists with application_id == this.id AND status == FINALIZED: cascade AidPackage FINALIZED→REVOKED"
          - "Application.updated_at refreshed, Application.version += 1"

      - from: WAITLISTED
        to: ADMITTED
        trigger: "POST /schools/{id}/waitlist/promote"
        actor: AdmissionsOfficer
        preconditions:
          - "Application.school_id matches X-User-ID's school assignment"
          - "School.yield_posture == OPEN (yield management gate — promotion blocked when ON_TARGET or OVER_TARGET)"
          - "WaitlistEntry with application_id == this.id has status == PENDING"
          - "Among all PENDING WaitlistEntry rows of the same school_id, this entry has the minimum rank"
        side_effects:
          - "Application.status := ADMITTED"
          - "Application.decision_at := SystemClock.current_utc (overwritten)"
          - "WaitlistEntry.status := PROMOTED, WaitlistEntry.promoted_at := SystemClock.current_utc"
          - "School.admitted_count += 1"
          - "School.yield_posture recomputed per §1.3 yield_posture_calc"
          - "Application.updated_at refreshed, Application.version += 1"

      - from: WAITLISTED
        to: DECLINED
        trigger: "POST /applications/{id}/decline"
        actor: Applicant
        preconditions:
          - "Application.applicant_id matches X-User-ID"
        side_effects:
          - "Application.status := DECLINED"
          - "Application.enrollment_decision_at := SystemClock.current_utc"
          - "School.declined_count += 1"
          - "WaitlistEntry with application_id == this.id transitions PENDING→RELEASED (cascade)"
          - "Application.updated_at refreshed, Application.version += 1"

      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /applications/{id}/withdraw"
        actor: Applicant
        preconditions:
          - "Application.applicant_id matches X-User-ID"
        side_effects:
          - "Application.status := WITHDRAWN"
          - "Application.updated_at refreshed, Application.version += 1"

      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /applications/{id}/withdraw"
        actor: Applicant
        preconditions:
          - "Application.applicant_id matches X-User-ID"
        side_effects:
          - "Application.status := WITHDRAWN"
          - "Applicant.submitted_application_count -= 1"
          - "Application.updated_at refreshed, Application.version += 1"

  - entity: RecommendationRequest
    initial_state: INVITED
    terminal_states: [SUBMITTED, WAIVED]
    transitions:
      - from: INVITED
        to: SUBMITTED
        trigger: "POST /recommendation-requests/{id}/submit"
        actor: PlatformAdmin
        preconditions:
          - "RecommendationRequest exists in status INVITED"
          - "Request body includes rating in [1,5]"
        side_effects:
          - "RecommendationRequest.status := SUBMITTED"
          - "RecommendationRequest.submitted_at := SystemClock.current_utc"
          - "RecommendationRequest.rating := request.rating"
          - "For the matching Application (applicant_id, school_id) if status ∈ {SUBMITTED, UNDER_REVIEW}: recompute Application.composite_score per §1.3"
          - "RecommendationRequest.updated_at refreshed, RecommendationRequest.version += 1"

      - from: INVITED
        to: WAIVED
        trigger: "POST /recommendation-requests/{id}/waive"
        actor: Applicant
        preconditions:
          - "RecommendationRequest.applicant_id matches X-User-ID"
          - "No Application with this applicant_id and school_id is in status SUBMITTED, UNDER_REVIEW, ADMITTED, WAITLISTED, or ENROLLED (cannot waive after associated app submitted)"
        side_effects:
          - "RecommendationRequest.status := WAIVED"
          - "RecommendationRequest.updated_at refreshed, RecommendationRequest.version += 1"

  - entity: AidPackage
    initial_state: DRAFT
    terminal_states: [REVOKED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /aid-packages/{id}/finalize"
        actor: FinancialAidOfficer
        preconditions:
          - "FinancialAidOfficer.school_id matches the Application.school_id linked from this AidPackage"
          - "Linked Application.status == ADMITTED"
          - "FinancialAidProfile exists for the linked Application.applicant_id"
          - "grant_cents + loan_cents + work_study_cents <= School.<residency-tuition>_cents (per applicant.residency)"
        side_effects:
          - "AidPackage.status := FINALIZED"
          - "AidPackage.net_cost_cents := output of §1.3 net_cost_calc"
          - "If linked Application.status ∈ {ADMITTED}: recompute Application.composite_score per §1.3"
          - "AidPackage.updated_at refreshed, AidPackage.version += 1"

      - from: FINALIZED
        to: REVOKED
        trigger: "automatic cascade when linked Application transitions to DENIED or DECLINED"
        actor: system
        preconditions:
          - "AidPackage.status == FINALIZED"
        side_effects:
          - "AidPackage.status := REVOKED"
          - "AidPackage.updated_at refreshed, AidPackage.version += 1"
        note: "Cascade only — no direct endpoint."

  - entity: WaitlistEntry
    initial_state: PENDING
    terminal_states: [PROMOTED, RELEASED]
    transitions:
      - from: PENDING
        to: PROMOTED
        trigger: "cascade when corresponding Application transitions WAITLISTED→ADMITTED via /schools/{id}/waitlist/promote"
        actor: system
        preconditions:
          - "WaitlistEntry.status == PENDING"
          - "Among PENDING WaitlistEntry rows of the same school_id, this entry has the minimum rank"
        side_effects:
          - "WaitlistEntry.status := PROMOTED"
          - "WaitlistEntry.promoted_at := SystemClock.current_utc"
          - "WaitlistEntry.updated_at refreshed, WaitlistEntry.version += 1"

      - from: PENDING
        to: RELEASED
        trigger: "cascade when corresponding Application transitions WAITLISTED→DECLINED"
        actor: system
        preconditions:
          - "WaitlistEntry.status == PENDING"
        side_effects:
          - "WaitlistEntry.status := RELEASED"
          - "WaitlistEntry.updated_at refreshed, WaitlistEntry.version += 1"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: admit-stale-application
    parent_entity: Application
    write_endpoint: "POST /applications/{id}/admit"
    occ_field: "expected_application_version"
    description: |
      Admitting an Application whose version has advanced since the
      AdmissionsOfficer last observed it is rejected. This captures the case
      where another writer has just transitioned the same Application
      UNDER_REVIEW→WAITLISTED (legitimate under §1.2 since either decision can
      supersede UNDER_REVIEW) and the current writer's view is therefore
      stale. Reported as a stale-version condition, not a parallel-arrival
      race.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: efc_calc
    trigger: "On FinancialAidProfile create/update; persisted into FinancialAidProfile.expected_family_contribution_cents"
    algorithm: weighted_scoring
    formula: |
      # FAFSA variant: simple income-based formula
      # CSS_PROFILE variant: adds asset assessment
      #
      # Step 1 — adjusted_income_cents := max(0, household_income_cents - SHELTER_PER_PERSON_CENTS * household_size)
      # Step 2 — base_efc_cents := round_half_up(adjusted_income_cents * INCOME_ASSESSMENT_RATE)
      #
      # If profile_type == FAFSA:
      #     expected_family_contribution_cents := base_efc_cents
      #
      # If profile_type == CSS_PROFILE:
      #     asset_contribution_cents := round_half_up(declared_assets_cents * ASSET_ASSESSMENT_RATE)
      #     expected_family_contribution_cents := base_efc_cents + asset_contribution_cents
      #
      # All intermediate rounds use ROUND_HALF_UP at the per-step boundary; the
      # ROUNDING ORDER IS PINNED: round the income component FIRST, round the
      # asset component SECOND, then SUM the rounded integers. Summing the
      # un-rounded floats first and rounding once produces a different cent in
      # some cases — implementations must follow per-component rounding.
    input_set: "FinancialAidProfile fields: profile_type, household_income_cents, household_size, declared_assets_cents"
    constants:
      SHELTER_PER_PERSON_CENTS: 800000
      INCOME_ASSESSMENT_RATE: 0.22
      ASSET_ASSESSMENT_RATE: 0.05
    precision: "USD cents (integer); round_half_up per component before summing"
    variants:
      - name: fafsa_variant
        when: "profile_type == FAFSA"
        difference: "Ignores declared_assets_cents entirely. Even when declared_assets_cents > 0 (which §1.4 should reject — sanity belt-and-braces), this variant adds zero asset contribution."
      - name: css_profile_variant
        when: "profile_type == CSS_PROFILE"
        difference: "Adds round_half_up(declared_assets_cents * ASSET_ASSESSMENT_RATE) to the income-based base. For identical income/household_size, CSS_PROFILE produces a STRICTLY GREATER EFC whenever declared_assets_cents > 0."

  - name: composite_score_calc
    trigger: "On Application SUBMIT, on RecommendationRequest SUBMIT for matching (applicant_id, school_id), on AidPackage FINALIZE for linked application, and on Essay update if Application.status ∈ {SUBMITTED, UNDER_REVIEW}"
    algorithm: weighted_scoring
    formula: |
      # Inputs (gathered live at compute time):
      #   gpa_normalized := round_half_up(Applicant.gpa_unweighted / 4.00 * 100, 2)        # 0.00–100.00
      #   sat_normalized := Applicant.sat_total is null ? 50.00 : round_half_up((Applicant.sat_total - 400) / 1200 * 100, 2)  # 0.00–100.00; null SAT defaults to neutral 50.00
      #   essay_count    := count of Essay where essay.application_id == app.id AND essay.completed == true
      #   essay_score    := min(100.00, essay_count * 20.00)                                 # 5 completed essays maxes the term
      #   rec_avg_rating := mean of RecommendationRequest.rating where (applicant_id, school_id) match and status == SUBMITTED; if zero matching, rec_avg_rating := 0
      #   rec_score      := round_half_up(rec_avg_rating / 5.00 * 100, 2)                    # 0.00–100.00
      #
      # Weighted sum (per-component rounding then sum — pinned):
      #   w_gpa := 0.40, w_sat := 0.20, w_essay := 0.15, w_rec := 0.25
      #   gpa_term   := round_half_up(gpa_normalized   * w_gpa,   2)
      #   sat_term   := round_half_up(sat_normalized   * w_sat,   2)
      #   essay_term := round_half_up(essay_score      * w_essay, 2)
      #   rec_term   := round_half_up(rec_score        * w_rec,   2)
      #   composite_score := round_half_up(gpa_term + sat_term + essay_term + rec_term, 2)
      #
      # Pinned ordering: per-component round FIRST, sum SECOND, final round on the sum.
      # Sum-then-round-once produces a different second decimal in some inputs.
    input_set: "Applicant.gpa_unweighted, Applicant.sat_total, Essay.completed (count), RecommendationRequest.rating (mean) — only rows where status == SUBMITTED contribute"
    constants:
      WEIGHT_GPA: 0.40
      WEIGHT_SAT: 0.20
      WEIGHT_ESSAY: 0.15
      WEIGHT_REC: 0.25
      NULL_SAT_NEUTRAL: 50.00
    precision: "2 decimal places, round_half_up; per-component rounding then sum (pinned)"
    variants:
      - name: with_sat_variant
        when: "Applicant.sat_total is not null at the moment of computation"
        difference: "Uses sat_normalized = round_half_up((sat_total-400)/1200*100, 2) with WEIGHT_SAT=0.20 in the weighted sum (formula as written above)."
      - name: test_optional_variant
        when: "Applicant.sat_total is null at the moment of computation"
        difference: "Substitutes the neutral 50.00 for sat_normalized while keeping WEIGHT_SAT=0.20. For identical gpa/essays/recs, the test_optional_variant produces a DIFFERENT composite_score than the with_sat_variant whenever the applicant's hypothetical SAT would not normalize to exactly 50.00. (E.g., a 1400 SAT yields sat_normalized=83.33, sat_term=16.67; a null SAT yields sat_term=10.00 — a 6.67-point drop on the same applicant data otherwise.)"

  - name: net_cost_calc
    trigger: "On AidPackage FINALIZE; persisted into AidPackage.net_cost_cents"
    algorithm: aggregation
    formula: |
      # 1. Pick tuition based on applicant.residency:
      #      residency == IN_STATE       => tuition_cents := School.in_state_tuition_cents
      #      residency == OUT_OF_STATE   => tuition_cents := School.out_of_state_tuition_cents
      #      residency == INTERNATIONAL  => tuition_cents := School.international_tuition_cents
      # 2. total_award_cents := grant_cents + loan_cents + work_study_cents
      # 3. net_cost_cents := tuition_cents - total_award_cents
      #
      # Integer cent arithmetic only; no rounding step required (all inputs are
      # integer cents). Sums in fixed order: grant + loan + work_study, in
      # exactly that order.
    input_set: "AidPackage.grant_cents, AidPackage.loan_cents, AidPackage.work_study_cents, School tuition (selected by Applicant.residency)"
    constants: {}
    precision: "Integer USD cents; no rounding"
    variants: []

  - name: yield_posture_calc
    trigger: "On every Application status transition into or out of ADMITTED/ENROLLED; recomputes School.yield_posture"
    algorithm: threshold
    formula: |
      # projected_yield_count := round_half_up(School.admitted_count * School.assumed_yield_rate + School.enrolled_count, 0)
      # ratio := projected_yield_count / School.target_class_size
      #
      # if ratio >= OVER_TARGET_THRESHOLD:   yield_posture := OVER_TARGET
      # elif ratio >= ON_TARGET_THRESHOLD:   yield_posture := ON_TARGET
      # else:                                 yield_posture := OPEN
      #
      # Threshold semantics are >=, NOT >. A ratio of EXACTLY 1.00 maps to
      # OVER_TARGET; a ratio of EXACTLY 0.85 maps to ON_TARGET. (Boundary
      # precision check — §0.5 Rule 6.)
    input_set: "School.admitted_count, School.enrolled_count, School.assumed_yield_rate, School.target_class_size"
    constants:
      ON_TARGET_THRESHOLD: 0.85
      OVER_TARGET_THRESHOLD: 1.00
    precision: "projected_yield_count rounded to integer (round_half_up); ratio compared as float with >="
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "Request must include X-User-Role and X-User-ID headers; role must be one of {Applicant, AdmissionsOfficer, FinancialAidOfficer, PlatformAdmin} (or Anonymous for explicitly anonymous endpoints)"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /applicants and POST /_clock/set_current_utc"

  - priority: 2
    category: auth
    check: "Role must be permitted for this endpoint per §1.7 RBAC matrix"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Every {id} path parameter and every FK body field references an existing resource (validated left-to-right in the path, then left-to-right through body)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 4
    category: business_referential
    check: "On endpoints scoped to an Applicant (writes against /applicants/{id}/... or /applications/{id} where Application.applicant_id is the owner), X-User-ID with role Applicant must equal that Applicant.id"
    error_id: ERR_FORBIDDEN_OWNER_MISMATCH
    http_status: 403
    applies_to: "/applicants/{id}/*, /applications/{id}/submit, /applications/{id}/withdraw, /applications/{id}/enroll, /applications/{id}/decline, /recommendation-requests/{id}/waive"

  - priority: 5
    category: state
    check: "Target resource is in a state from which the requested transition is valid (per §1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints (submit/admit/waitlist/deny/enroll/decline/withdraw/finalize/promote/...)"

  - priority: 6
    category: business_temporal
    check: "Application.submit: SystemClock.current_utc must be <= School.deadline_iso (school referenced by application.school_id)"
    error_id: ERR_DEADLINE_PASSED
    http_status: 409
    applies_to: "POST /applications/{id}/submit"

  - priority: 7
    category: business_safety
    check: "Application.submit with School.admission_track == EARLY_DECISION: no other Application of this applicant currently has admission_track_snapshot == EARLY_DECISION AND status ∈ {SUBMITTED, UNDER_REVIEW, ADMITTED, WAITLISTED, ENROLLED} (ED-exclusivity, binding rule)"
    error_id: ERR_ED_EXCLUSIVITY_VIOLATED
    http_status: 409
    applies_to: "POST /applications/{id}/submit"

  - priority: 8
    category: business_constraint
    check: "Application.submit: every Essay where essay.application_id == this.id has completed == true; AND at least 2 RecommendationRequest rows with matching (applicant_id, school_id) and status == SUBMITTED exist; AND a FinancialAidProfile exists for this applicant"
    error_id: ERR_APPLICATION_INCOMPLETE
    http_status: 422
    applies_to: "POST /applications/{id}/submit"

  - priority: 9
    category: business_referential
    check: "Application.decline: if admission_track_snapshot == EARLY_DECISION AND status == ADMITTED, decline is binding-violating and rejected. (ED admit is binding.)"
    error_id: ERR_ED_BINDING_VIOLATION
    http_status: 409
    applies_to: "POST /applications/{id}/decline"

  - priority: 9.5
    category: business_constraint
    check: "Application.enroll: no other Application of this applicant has status == ENROLLED (aggregate-capacity rule: an applicant can be ENROLLED in at most one school across the lifetime of their account; open-ended occupation interval [enroll_time, ∞))"
    error_id: ERR_ENROLLMENT_ALREADY_DECLARED
    http_status: 409
    applies_to: "POST /applications/{id}/enroll"

  - priority: 10
    category: business_constraint
    check: "AidPackage.finalize: grant_cents + loan_cents + work_study_cents <= the residency-appropriate tuition on the linked School (in_state for IN_STATE applicants, out_of_state for OUT_OF_STATE, international for INTERNATIONAL)"
    error_id: ERR_AID_EXCEEDS_TUITION
    http_status: 422
    applies_to: "POST /aid-packages/{id}/finalize"

  - priority: 11
    category: business_fiscal
    check: "Waitlist promote: School.yield_posture must equal OPEN (yield management — cannot over-admit when cohort already on or over target)"
    error_id: ERR_YIELD_TARGET_REACHED
    http_status: 409
    applies_to: "POST /schools/{id}/waitlist/promote"

  - priority: 12
    category: business_constraint
    check: "Essay create/update: declared word_count must match server-recomputed word count of essay.text within ±5 words"
    error_id: ERR_WORD_COUNT_MISMATCH
    http_status: 422
    applies_to: "POST /essays, PATCH /essays/{id}"

  - priority: 13
    category: business_referential
    check: "FinancialAidProfile create: profile_type == FAFSA requires declared_assets_cents == 0 (FAFSA does not collect non-retirement assets)"
    error_id: ERR_FAFSA_DISALLOWS_ASSETS
    http_status: 422
    applies_to: "POST /financial-aid-profiles, PATCH /financial-aid-profiles/{id}"

  - priority: 14
    category: business_constraint
    check: "Applicant.update (PATCH /applicants/{id}): if Applicant.profile_status == LOCKED, the fields gpa_unweighted, sat_total, residency cannot be modified"
    error_id: ERR_PROFILE_LOCKED
    http_status: 409
    applies_to: "PATCH /applicants/{id}"

  - priority: 15
    category: business_constraint
    check: "OCC: write endpoints declared in §1.2.1 must receive expected_<parent>_version equal to the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /applications/{id}/admit"

  - priority: 16
    category: business_constraint
    check: "Required input fields (per §1.5 endpoint.input) present and well-typed"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Applicants ---------------------------------------------------------
  - method: POST
    path: "/applicants"
    description: "Create an applicant (self-registration; anonymous)"
    roles: [Anonymous]
    code: 201
    input: [email, full_name, gpa_unweighted, "sat_total?", residency]
    output: Applicant
    side_effects:
      - "Applicant created with profile_status := DRAFT, version := 1, submitted_application_count := 0"

  - method: GET
    path: "/applicants/{id}"
    description: "Read applicant"
    roles: [Applicant, AdmissionsOfficer, FinancialAidOfficer, PlatformAdmin]
    code: 200
    input: []
    output: Applicant

  - method: PATCH
    path: "/applicants/{id}"
    description: "Update mutable applicant fields"
    roles: [Applicant]
    code: 200
    input: ["full_name?", "gpa_unweighted?", "sat_total?", "residency?"]
    output: Applicant
    side_effects:
      - "Applicant.updated_at refreshed, Applicant.version += 1"
      - "If gpa_unweighted or sat_total changes, recompute composite_score for every Application of this applicant whose status ∈ {SUBMITTED, UNDER_REVIEW}"

  - method: GET
    path: "/applicants"
    description: "List applicants (paginated)"
    roles: [AdmissionsOfficer, FinancialAidOfficer, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "residency?"]
    output: Applicant[]

  # ---- Schools ------------------------------------------------------------
  - method: POST
    path: "/schools"
    description: "Create a school (PlatformAdmin only)"
    roles: [PlatformAdmin]
    code: 201
    input: [name, state_code, admission_track, deadline_iso, decision_release_iso, target_class_size, assumed_yield_rate, in_state_tuition_cents, out_of_state_tuition_cents, international_tuition_cents]
    output: School
    side_effects:
      - "School created with admitted_count := 0, enrolled_count := 0, yield_posture := OPEN, version := 1"

  - method: GET
    path: "/schools/{id}"
    description: "Read school"
    roles: [Applicant, AdmissionsOfficer, FinancialAidOfficer, PlatformAdmin]
    code: 200
    input: []
    output: School

  - method: GET
    path: "/schools"
    description: "List schools"
    roles: [Applicant, AdmissionsOfficer, FinancialAidOfficer, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "admission_track?"]
    output: School[]

  # ---- Applications -------------------------------------------------------
  - method: POST
    path: "/applications"
    description: "Create a draft application (one applicant → one school)"
    roles: [Applicant]
    code: 201
    input: [applicant_id, school_id]
    output: Application
    side_effects:
      - "Application created with status := DRAFT, version := 1"

  - method: GET
    path: "/applications/{id}"
    description: "Read application"
    roles: [Applicant, AdmissionsOfficer, PlatformAdmin]
    code: 200
    input: []
    output: Application

  - method: GET
    path: "/applications"
    description: "List applications filtered by applicant_id or school_id"
    roles: [Applicant, AdmissionsOfficer, FinancialAidOfficer, PlatformAdmin]
    code: 200
    input: ["applicant_id?", "school_id?", "status?", "limit?", "offset?"]
    output: Application[]

  - method: POST
    path: "/applications/{id}/submit"
    description: "Applicant submits a DRAFT application"
    roles: [Applicant]
    code: 200
    input: []
    output: Application
    side_effects:
      - "Application DRAFT→SUBMITTED (per §1.2 Application SM)"
      - "Snapshots Application.admission_track_snapshot from School.admission_track"
      - "Computes Application.composite_score per §1.3 composite_score_calc"
      - "Cascade: Applicant DRAFT→LOCKED if first submit"

  - method: POST
    path: "/applications/{id}/withdraw"
    description: "Applicant withdraws an own application (DRAFT or SUBMITTED only)"
    roles: [Applicant]
    code: 200
    input: []
    output: Application
    side_effects:
      - "Application → WITHDRAWN (per §1.2 Application SM)"

  - method: POST
    path: "/applications/{id}/begin-review"
    description: "AdmissionsOfficer begins reviewing a SUBMITTED application"
    roles: [AdmissionsOfficer]
    code: 200
    input: []
    output: Application
    side_effects:
      - "Application SUBMITTED→UNDER_REVIEW (per §1.2)"

  - method: POST
    path: "/applications/{id}/admit"
    description: "AdmissionsOfficer admits an application (UNDER_REVIEW)"
    roles: [AdmissionsOfficer]
    code: 200
    input: [expected_application_version]
    output: Application
    side_effects:
      - "Application UNDER_REVIEW→ADMITTED (per §1.2)"
      - "School.admitted_count += 1; School.yield_posture recomputed per §1.3 yield_posture_calc"
      - "increments Application.version by 1 (OCC §1.2.1 admit-stale-application)"

  - method: POST
    path: "/applications/{id}/waitlist"
    description: "AdmissionsOfficer waitlists an application (UNDER_REVIEW; not ED)"
    roles: [AdmissionsOfficer]
    code: 200
    input: []
    output: Application
    side_effects:
      - "Application UNDER_REVIEW→WAITLISTED (per §1.2)"
      - "Creates WaitlistEntry PENDING with rank = next unused (composite_score DESC, submitted_at ASC)"

  - method: POST
    path: "/applications/{id}/deny"
    description: "AdmissionsOfficer denies an application (UNDER_REVIEW)"
    roles: [AdmissionsOfficer]
    code: 200
    input: []
    output: Application
    side_effects:
      - "Application UNDER_REVIEW→DENIED (per §1.2)"
      - "Cascade: linked FINALIZED AidPackage → REVOKED"

  - method: POST
    path: "/applications/{id}/enroll"
    description: "Applicant enrolls in an ADMITTED school"
    roles: [Applicant]
    code: 200
    input: []
    output: Application
    side_effects:
      - "Application ADMITTED→ENROLLED (per §1.2)"
      - "School.enrolled_count += 1; yield_posture recomputed"
      - "Cascade: every other ADMITTED/WAITLISTED Application of this applicant → DECLINED (transitive — each cascaded transition fires its own DECLINED side_effects, including AidPackage REVOKED and WaitlistEntry RELEASED)"

  - method: POST
    path: "/applications/{id}/decline"
    description: "Applicant declines an ADMITTED or WAITLISTED Application (ED-admitted forbidden)"
    roles: [Applicant]
    code: 200
    input: []
    output: Application
    side_effects:
      - "Application → DECLINED (per §1.2)"
      - "Cascade: linked FINALIZED AidPackage → REVOKED (if was ADMITTED)"
      - "Cascade: linked PENDING WaitlistEntry → RELEASED (if was WAITLISTED)"

  # ---- Essays -------------------------------------------------------------
  - method: POST
    path: "/essays"
    description: "Create an essay for an applicant's application"
    roles: [Applicant]
    code: 201
    input: [application_id, prompt_code, word_count, text, "completed?"]
    output: Essay
    side_effects:
      - "Essay created"
      - "If Application.status ∈ {SUBMITTED, UNDER_REVIEW}: recompute Application.composite_score"

  - method: PATCH
    path: "/essays/{id}"
    description: "Update an essay's text, word_count, or completed flag"
    roles: [Applicant]
    code: 200
    input: ["word_count?", "text?", "completed?"]
    output: Essay
    side_effects:
      - "Essay.updated_at refreshed, Essay.version += 1"
      - "If Application.status ∈ {SUBMITTED, UNDER_REVIEW}: recompute Application.composite_score"

  - method: GET
    path: "/essays/{id}"
    description: "Read an essay"
    roles: [Applicant, AdmissionsOfficer, PlatformAdmin]
    code: 200
    input: []
    output: Essay

  - method: GET
    path: "/essays"
    description: "List essays filtered by application_id"
    roles: [Applicant, AdmissionsOfficer, PlatformAdmin]
    code: 200
    input: ["application_id?", "limit?", "offset?"]
    output: Essay[]

  # ---- RecommendationRequests ---------------------------------------------
  - method: POST
    path: "/recommendation-requests"
    description: "Applicant invites a recommender"
    roles: [Applicant]
    code: 201
    input: [applicant_id, school_id, recommender_email]
    output: RecommendationRequest
    side_effects:
      - "RecommendationRequest created with status := INVITED"

  - method: POST
    path: "/recommendation-requests/{id}/submit"
    description: "Recommender submits the letter (operator records via PlatformAdmin)"
    roles: [PlatformAdmin]
    code: 200
    input: [rating]
    output: RecommendationRequest
    side_effects:
      - "RecommendationRequest INVITED→SUBMITTED (per §1.2)"
      - "If matching Application.status ∈ {SUBMITTED, UNDER_REVIEW}: recompute Application.composite_score"

  - method: POST
    path: "/recommendation-requests/{id}/waive"
    description: "Applicant waives a recommendation invite (only before associated app submitted)"
    roles: [Applicant]
    code: 200
    input: []
    output: RecommendationRequest
    side_effects:
      - "RecommendationRequest INVITED→WAIVED (per §1.2)"

  - method: GET
    path: "/recommendation-requests/{id}"
    description: "Read a recommendation request"
    roles: [Applicant, AdmissionsOfficer, PlatformAdmin]
    code: 200
    input: []
    output: RecommendationRequest

  - method: GET
    path: "/recommendation-requests"
    description: "List recommendation requests filtered by applicant_id or school_id"
    roles: [Applicant, AdmissionsOfficer, PlatformAdmin]
    code: 200
    input: ["applicant_id?", "school_id?", "status?", "limit?", "offset?"]
    output: RecommendationRequest[]

  # ---- FinancialAidProfile ------------------------------------------------
  - method: POST
    path: "/financial-aid-profiles"
    description: "Create a financial aid profile for an applicant"
    roles: [Applicant]
    code: 201
    input: [applicant_id, profile_type, household_income_cents, household_size, "declared_assets_cents?"]
    output: FinancialAidProfile
    side_effects:
      - "FinancialAidProfile created"
      - "expected_family_contribution_cents computed per §1.3 efc_calc (FAFSA or CSS_PROFILE variant)"

  - method: GET
    path: "/financial-aid-profiles/{id}"
    description: "Read a financial aid profile"
    roles: [Applicant, FinancialAidOfficer, PlatformAdmin]
    code: 200
    input: []
    output: FinancialAidProfile

  - method: GET
    path: "/financial-aid-profiles"
    description: "List financial-aid profiles filtered by applicant_id"
    roles: [Applicant, FinancialAidOfficer, PlatformAdmin]
    code: 200
    input: ["applicant_id?", "limit?", "offset?"]
    output: FinancialAidProfile[]

  - method: PATCH
    path: "/financial-aid-profiles/{id}"
    description: "Update a financial aid profile"
    roles: [Applicant]
    code: 200
    input: ["household_income_cents?", "household_size?", "declared_assets_cents?"]
    output: FinancialAidProfile
    side_effects:
      - "FinancialAidProfile.updated_at refreshed, version += 1"
      - "expected_family_contribution_cents recomputed per §1.3 efc_calc"

  # ---- AidPackage ---------------------------------------------------------
  - method: POST
    path: "/aid-packages"
    description: "FinancialAidOfficer drafts an aid package for an ADMITTED Application at their school"
    roles: [FinancialAidOfficer]
    code: 201
    input: [application_id, grant_cents, loan_cents, work_study_cents]
    output: AidPackage
    side_effects:
      - "AidPackage created with status := DRAFT"

  - method: POST
    path: "/aid-packages/{id}/finalize"
    description: "Finalize an aid package; computes net_cost"
    roles: [FinancialAidOfficer]
    code: 200
    input: []
    output: AidPackage
    side_effects:
      - "AidPackage DRAFT→FINALIZED (per §1.2)"
      - "AidPackage.net_cost_cents := output of §1.3 net_cost_calc"

  - method: GET
    path: "/aid-packages/{id}"
    description: "Read an aid package"
    roles: [Applicant, FinancialAidOfficer, PlatformAdmin]
    code: 200
    input: []
    output: AidPackage

  - method: GET
    path: "/aid-packages"
    description: "List aid packages filtered by application_id"
    roles: [Applicant, FinancialAidOfficer, PlatformAdmin]
    code: 200
    input: ["application_id?", "limit?", "offset?"]
    output: AidPackage[]

  # ---- Waitlist -----------------------------------------------------------
  - method: GET
    path: "/schools/{id}/waitlist"
    description: "List PENDING waitlist entries for a school, ordered by rank ASC"
    roles: [AdmissionsOfficer, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: WaitlistEntry[]

  - method: GET
    path: "/waitlist-entries/{id}"
    description: "Read a waitlist entry"
    roles: [Applicant, AdmissionsOfficer, PlatformAdmin]
    code: 200
    input: []
    output: WaitlistEntry

  - method: GET
    path: "/waitlist-entries"
    description: "List waitlist entries filtered by application_id"
    roles: [Applicant, AdmissionsOfficer, PlatformAdmin]
    code: 200
    input: ["application_id?", "limit?", "offset?"]
    output: WaitlistEntry[]

  - method: POST
    path: "/schools/{id}/waitlist/promote"
    description: "AdmissionsOfficer promotes the lowest-rank PENDING WaitlistEntry to ADMITTED (yield_posture must be OPEN)"
    roles: [AdmissionsOfficer]
    code: 200
    input: []
    output: Application
    side_effects:
      - "Application WAITLISTED→ADMITTED for the entry with minimum rank (per §1.2)"
      - "WaitlistEntry PENDING→PROMOTED (cascade)"
      - "School.admitted_count += 1; yield_posture recomputed"

  # ---- Test-driving / system ---------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving: set the logical system clock used for deadline checks. PlatformAdmin only."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: SystemClock
    side_effects:
      - "SystemClock.current_utc := to_iso8601"

  - method: GET
    path: "/_clock"
    description: "Read the current logical system clock"
    roles: [PlatformAdmin, Applicant, AdmissionsOfficer, FinancialAidOfficer]
    code: 200
    input: []
    output: SystemClock

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or invalid X-User-Role / X-User-ID headers on an endpoint that requires authentication"

  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Caller's role is not in the endpoint's authorized roles per §1.7"

  - id: ERR_FORBIDDEN_OWNER_MISMATCH
    http: 403
    condition: "Applicant attempts to operate on an Application, Essay, RecommendationRequest, or FinancialAidProfile they do not own"

  - id: ERR_NOT_FOUND
    http: 404
    condition: "A path-param id or body FK refers to a non-existent resource"

  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Required input field missing, type mismatch, enum-out-of-range, or numeric out-of-bounds (e.g., gpa_unweighted > 4.00, sat_total out of [400,1600], word_count > 650)"

  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource is not in a state from which the requested transition is valid per §1.2"

  - id: ERR_DEADLINE_PASSED
    http: 409
    condition: "Application submit attempted when SystemClock.current_utc > School.deadline_iso"

  - id: ERR_ED_EXCLUSIVITY_VIOLATED
    http: 409
    condition: "Applicant attempts to submit a second EARLY_DECISION application while another ED application is in a non-final state"

  - id: ERR_APPLICATION_INCOMPLETE
    http: 422
    condition: "Application submit attempted before all essays are completed, or before 2 SUBMITTED recommendations exist, or before a FinancialAidProfile exists"

  - id: ERR_ED_BINDING_VIOLATION
    http: 409
    condition: "Applicant attempts to decline an ADMITTED Early-Decision application (binding rule)"

  - id: ERR_AID_EXCEEDS_TUITION
    http: 422
    condition: "AidPackage finalize where grant + loan + work_study > residency-appropriate tuition"

  - id: ERR_YIELD_TARGET_REACHED
    http: 409
    condition: "Waitlist promote attempted when School.yield_posture is ON_TARGET or OVER_TARGET"

  - id: ERR_WORD_COUNT_MISMATCH
    http: 422
    condition: "Essay create/update: declared word_count differs from server-recomputed word count by more than 5 words"

  - id: ERR_FAFSA_DISALLOWS_ASSETS
    http: 422
    condition: "FAFSA financial-aid profile created/updated with declared_assets_cents > 0"

  - id: ERR_PROFILE_LOCKED
    http: 409
    condition: "PATCH /applicants/{id} attempts to modify gpa_unweighted, sat_total, or residency while Applicant.profile_status == LOCKED"

  - id: ERR_ENROLLMENT_ALREADY_DECLARED
    http: 409
    condition: "Application.enroll attempted while the applicant already has another Application in status ENROLLED"

  - id: ERR_STALE_VERSION
    http: 412
    condition: "OCC: request's expected_application_version does not equal Application.version (§1.2.1 admit-stale-application)"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Applicant
    description: "Self-registered applicant; owns their profile, applications, essays, recommendations, and financial-aid profile."
    identity: "entity_backed:Applicant"
    exclusive_operations:
      - "POST /applications, POST /applications/{id}/submit, POST /applications/{id}/withdraw, POST /applications/{id}/enroll, POST /applications/{id}/decline"
      - "POST /essays, PATCH /essays/{id}"
      - "POST /recommendation-requests, POST /recommendation-requests/{id}/waive"
      - "POST /financial-aid-profiles, PATCH /financial-aid-profiles/{id}, PATCH /applicants/{id}"
    shared_operations:
      - "GET /applicants/{id}, GET /schools, GET /schools/{id}, GET /applications, GET /applications/{id}"
      - "GET /essays, GET /recommendation-requests, GET /financial-aid-profiles, GET /aid-packages, GET /waitlist-entries, GET /_clock"

  - name: AdmissionsOfficer
    description: "Officer at a specific school; decides applications and manages waitlist for their school."
    identity: "opaque"
    exclusive_operations:
      - "POST /applications/{id}/begin-review, POST /applications/{id}/admit, POST /applications/{id}/waitlist, POST /applications/{id}/deny"
      - "POST /schools/{id}/waitlist/promote"
      - "GET /schools/{id}/waitlist"
      - "GET /applicants (full list)"
    shared_operations:
      - "GET /applicants/{id}, GET /schools, GET /schools/{id}, GET /applications, GET /applications/{id}"
      - "GET /essays, GET /recommendation-requests, GET /waitlist-entries, GET /_clock"

  - name: FinancialAidOfficer
    description: "Officer at a school's financial-aid office; drafts and finalizes aid packages."
    identity: "opaque"
    exclusive_operations:
      - "POST /aid-packages, POST /aid-packages/{id}/finalize"
    shared_operations:
      - "GET /applicants, GET /applicants/{id}, GET /schools, GET /schools/{id}, GET /applications, GET /financial-aid-profiles, GET /aid-packages, GET /_clock"

  - name: PlatformAdmin
    description: "Platform operator: creates schools, records recommendation submissions, drives the test clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /schools"
      - "POST /recommendation-requests/{id}/submit"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET /applicants, GET /applicants/{id}, GET /schools, GET /schools/{id}, GET /applications, GET /applications/{id}"
      - "GET /essays, GET /recommendation-requests, GET /financial-aid-profiles, GET /aid-packages, GET /schools/{id}/waitlist, GET /waitlist-entries, GET /_clock"

  - name: Anonymous
    description: "Unauthenticated caller; only allowed to create a new applicant."
    identity: "opaque"
    exclusive_operations:
      - "POST /applicants"
    shared_operations: []
