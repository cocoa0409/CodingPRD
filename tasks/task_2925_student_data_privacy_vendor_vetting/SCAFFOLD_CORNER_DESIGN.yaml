      - name: reviewing_a_removed_subprocessor_is_a_terminal_state_error
        claim_type: Error Triggerability
        grounds:
          - errors[ERR_SUBPROCESSOR_STATE_INVALID]
          - validations[priority=19]
          - state_machines.Subprocessor.terminal_states
        distinguishing_aspect: |
          REMOVED is terminal for a subprocessor, and the error is state-flavoured rather
          than disposition-flavoured: a second review call on a REMOVED row must be 409
          ERR_SUBPROCESSOR_STATE_INVALID (priority 19), NOT the 422
          ERR_DISPOSITION_NOT_APPLICABLE that a still-DISCLOSED row would earn.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; Vendor V (breach_notification_hours 48) with one US subprocessor S, plus analyst AN1 to act as reviewer."
            - "S is verified and then removed, so it sits in the terminal state."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PrivacyOfficeAdmin
            - call: "POST /vendors"
              payload: { legal_name: "Brightpath Reading Co", hq_country_code: "US", breach_notification_hours: 48, data_deletion_days: 30, signed_state_addendum: true, subprocessor_disclosure_complete: true }
              as: PrivacyOfficeAdmin
              captures: { v_id: $.data.id }
            - call: "POST /privacy-analysts"
              payload: { full_name: "Ana Lopez", credential_level: "SENIOR", review_capacity_minutes: 2400 }
              as: PrivacyOfficeAdmin
              captures: { an1_id: $.data.id }
            - call: "POST /subprocessors"
              payload: { vendor_id: "${v_id}", name: "Cloudhost US East", country_code: "US", data_categories: ["HOSTING"], purpose: "Primary application hosting and nightly encrypted backup storage.", sub_breach_notification_hours: 24 }
              as: VendorLiaison
              as_user_id: "${v_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /subprocessors/${sub_id}/review"
              payload: { disposition: "VERIFY", reviewed_note: "Terms are at least as strict as the vendor's." }
              as: PrivacyAnalyst
              as_user_id: "${an1_id}"
            - call: "POST /subprocessors/${sub_id}/review"
              payload: { disposition: "REMOVE", reviewed_note: "Contract terminated." }
              as: PrivacyAnalyst
              as_user_id: "${an1_id}"
          trigger:
            - call: "POST /subprocessors/${sub_id}/review"
              payload: { disposition: "VERIFY", reviewed_note: "Attempt to resurrect a removed subprocessor." }
              as: PrivacyAnalyst
              as_user_id: "${an1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "status == 409 and ${err} == ERR_SUBPROCESSOR_STATE_INVALID (not ERR_DISPOSITION_NOT_APPLICABLE)"
            - "Subprocessor.${sub_id}.status == REMOVED (unchanged)"
            - "Vendor.${v_id}.flagged_subprocessor_count == 0 and risk_score == 0.00 (a REMOVED row is outside every scoring scope)"
            - "Vendor.${v_id}.privacy_posture == CLEAR"

