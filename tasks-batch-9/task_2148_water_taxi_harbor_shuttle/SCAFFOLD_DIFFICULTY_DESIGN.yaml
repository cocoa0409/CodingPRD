scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 - dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: dock_landing_fee_provisional_versus_final_diverges_on_pax_and_minutes
        grounds:
          - calculations.dock_slot_fee_posting
          - state_machines.Trip.BOARDING_to_DEPARTED
          - state_machines.Trip.DEPARTED_to_COMPLETED
          - entities.DockSlot.fields.projected_fee_cents
          - entities.DockSlot.fields.landing_fee_cents
          - entities.Trip.fields.booked_pax
          - entities.Trip.fields.boarded_pax
        distinguishing_aspect: |
          This dual variant lives in the dock/berth fee-accounting domain: the PROVISIONAL posting
          bills Trip.booked_pax over the RESERVED window while the FINAL posting bills
          Trip.boarded_pax over start_utc-to-actual_departure_utc, so identical inputs yield
          1400 cents provisionally and 1760 cents finally on the same DockSlot row.
        test_recipe:
          setup:
            - "Dock 'Pier One' with berth_count 2, min_turnaround_minutes 15, 120 cents/pax, 40 cents/berth-minute, cap 1000000."
            - "Stop 'Ferry Landing' (zone 1) on Pier One and Stop 'Quay Two' (zone 2) on Pier Two."
            - "Vessel 'Osprey' 40 seats, draft 1.20 m, OFFSHORE, requires MASTER_25T, with a passing ANNUAL inspection performed 2026-08-01."
            - "CrewMember 'K. Rowe' MASTER_100T with certificates valid to 2027-12-31."
            - "ServiceDay 2026-09-12 reading NORMAL with a 18000-attendance event, so the trip's effective_capacity is 52."
            - "One SCHEDULED trip 14:00-14:25 with a single LANDING slot on Pier One reserved for 14:00-14:20."
            - "Two confirmed bookings of 3 and 2 seats; only the 3-seat booking is on the boarding manifest, so booked_pax is 5 and boarded_pax is 3."
            - "The trip has departed at 14:35 (35 minutes after the slot opened) and the logical clock now reads 14:50."
          setup_api_calls:
            - call: "POST /harbor/docks"
              payload: { name: "Pier One", berth_count: 2, min_turnaround_minutes: 15, landing_fee_per_pax_cents: 120, berth_minute_rate_cents: 40, monthly_fee_cap_cents: 1000000, shared_operator_count: 2 }
              as: HarborAdmin
              as_user_id: "admin-1"
              captures: { dock_a_id: $.data.id, dock_a_v: $.data.version }
            - call: "POST /harbor/docks/${dock_a_id}/stops"
              payload: { name: "Ferry Landing", zone_index: 1, charted_depth_m: 3.50 }
              as: HarborAdmin
              as_user_id: "admin-1"
              captures: { stop1_id: $.data.id }
            - call: "POST /harbor/docks"
              payload: { name: "Pier Two", berth_count: 1, min_turnaround_minutes: 0, landing_fee_per_pax_cents: 200, berth_minute_rate_cents: 60, monthly_fee_cap_cents: 1000000 }
              as: HarborAdmin
              as_user_id: "admin-1"
              captures: { dock_b_id: $.data.id }
            - call: "POST /harbor/docks/${dock_b_id}/stops"
              payload: { name: "Quay Two", zone_index: 2, charted_depth_m: 4.00 }
              as: HarborAdmin
              as_user_id: "admin-1"
              captures: { stop2_id: $.data.id }
            - call: "POST /harbor/vessels"
              payload: { name: "Osprey", seat_capacity: 40, draft_m: 1.20, hull_class: "OFFSHORE", required_endorsement: "MASTER_25T" }
              as: HarborAdmin
              as_user_id: "admin-1"
              captures: { vessel_id: $.data.id }
            - call: "POST /harbor/crew-members"
              payload: { name: "K. Rowe", endorsement_class: "MASTER_100T", cert_expires_on: "2027-12-31", medical_expires_on: "2027-12-31" }
              as: HarborAdmin
              as_user_id: "admin-1"
              captures: { crew_id: $.data.id }
            - call: "POST /harbor/vessels/${vessel_id}/inspections"
              payload: { inspection_type: "ANNUAL", result: "PASS", deficiency_count: 0, performed_on: "2026-08-01" }
              as: MarineInspector
              as_user_id: "insp-1"
            - call: "POST /harbor/service-days"
              payload: { service_date: "2026-09-12", wind_knots: 10.0, wave_height_m: 0.30, low_water_m: 2.10, event_name: "Harbor Bowl", expected_attendance: 18000 }
              as: HarborAdmin
              as_user_id: "admin-1"
              captures: { day_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-12T13:00:00Z" }
              as: HarborAdmin
              as_user_id: "admin-1"
            - call: "POST /harbor/trips"
              payload: { service_day_id: "${day_id}", vessel_id: "${vessel_id}", master_crew_id: "${crew_id}", origin_stop_id: "${stop1_id}", destination_stop_id: "${stop2_id}", service_mode: "SCHEDULED", scheduled_departure_utc: "2026-09-12T14:00:00Z", scheduled_arrival_utc: "2026-09-12T14:25:00Z" }
              as: Dispatcher
              as_user_id: "disp-1"
              captures: { trip_id: $.data.id, trip_v: $.data.version }
            - call: "POST /harbor/trips/${trip_id}/dock-slots"
              payload: { dock_id: "${dock_a_id}", purpose: "LANDING", start_utc: "2026-09-12T14:00:00Z", end_utc: "2026-09-12T14:20:00Z", expected_dock_version: "${dock_a_v}" }
              as: Dispatcher
              as_user_id: "disp-1"
              captures: { slot_id: $.data.id }
            - call: "POST /harbor/bookings"
              payload: { origin_stop_id: "${stop1_id}", destination_stop_id: "${stop2_id}", requested_date: "2026-09-12", service_mode: "SCHEDULED", party_size: 3 }
              as: Rider
              as_user_id: "rider-ann"
              captures: { bk1_id: $.data.id }
            - call: "POST /harbor/bookings/${bk1_id}/dispatch"
              payload: {}
              as: Dispatcher
              as_user_id: "disp-1"
            - call: "POST /harbor/bookings/${bk1_id}/confirm"
              payload: { expected_trip_version: "${trip_v}" }
              as: Rider
              as_user_id: "rider-ann"
            - call: "POST /harbor/bookings"
              payload: { origin_stop_id: "${stop1_id}", destination_stop_id: "${stop2_id}", requested_date: "2026-09-12", service_mode: "SCHEDULED", party_size: 2 }
              as: Rider
              as_user_id: "rider-bob"
              captures: { bk2_id: $.data.id }
            - call: "POST /harbor/bookings/${bk2_id}/dispatch"
              payload: {}
              as: Dispatcher
              as_user_id: "disp-1"
            - call: "GET /harbor/trips/${trip_id}"
              payload: {}
              as: Dispatcher
              as_user_id: "disp-1"
              captures: { trip_v2: $.data.version }
            - call: "POST /harbor/bookings/${bk2_id}/confirm"
              payload: { expected_trip_version: "${trip_v2}" }
              as: Rider
              as_user_id: "rider-bob"
            - call: "POST /harbor/trips/${trip_id}/board"
              payload: { boarded_booking_ids: ["${bk1_id}"] }
              as: VesselMaster
              as_user_id: "${crew_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-12T14:35:00Z" }
              as: HarborAdmin
              as_user_id: "admin-1"
            - call: "POST /harbor/trips/${trip_id}/depart"
              payload: {}
              as: VesselMaster
              as_user_id: "${crew_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-12T14:50:00Z" }
              as: HarborAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /harbor/trips/${trip_id}/complete"
              payload: {}
              as: VesselMaster
              as_user_id: "${crew_id}"
          assert:
            - "Trip.${trip_id}.booked_pax == 5"
            - "Trip.${trip_id}.boarded_pax == 3"
            - "Trip.${trip_id}.provisional_fee_cents == 1400"
            - "Trip.${trip_id}.final_fee_cents == 1760"
            - "DockSlot.${slot_id}.berth_minutes == 35"
            - "DockSlot.${slot_id}.pax_basis == 3"
            - "DockSlot.${slot_id}.projected_fee_cents == 0"
            - "DockSlot.${slot_id}.landing_fee_cents == 1760"
            - "DockSlot.${slot_id}.status == CONSUMED"
            - "Trip.${trip_id}.settlement_status == FINAL"
            - "Dock.${dock_a_id}.accrued_fee_cents == 1760"

      - name: ride_pass_residual_pro_rata_versus_differential_on_identical_passes
        grounds:
          - calculations.ride_pass_residual_value
          - state_machines.RidePass.ACTIVE_to_REFUNDED
          - entities.RidePass.fields.refund_amount_cents
          - entities.RidePass.fields.refund_basis
          - entities.RidePass.fields.rides_consumed
        distinguishing_aspect: |
          This dual variant lives in the rider ticketing domain, not the dock fee domain: two
          byte-identical INNER passes (9000 cents / 10 rides, 4 rides consumed) settle at 5400
          cents under PRO_RATA and 4600 cents under DIFFERENTIAL, because only DIFFERENTIAL
          charges the 1100-cent retail value of the rides already taken.
        test_recipe:
          setup:
            - "The 2026-09-12 harbour world with one SCHEDULED trip Ferry Landing -> Quay Two (zone_span 1, effective_capacity 52)."
            - "Two identical INNER ride passes, one owned by rider-ann and one by rider-bob: 10 rides, 9000 cents, valid to 2026-12-31."
            - "Each rider has confirmed one 4-seat booking against that trip using the pass, leaving each pass with rides_remaining 6 and rides_consumed 4."
          setup_api_calls:
            - call: "POST /harbor/docks"
              payload: { name: "Pier One", berth_count: 2, min_turnaround_minutes: 15, landing_fee_per_pax_cents: 120, berth_minute_rate_cents: 40, monthly_fee_cap_cents: 1000000 }
              as: HarborAdmin
              as_user_id: "admin-1"
              captures: { dock_a_id: $.data.id }
            - call: "POST /harbor/docks/${dock_a_id}/stops"
              payload: { name: "Ferry Landing", zone_index: 1, charted_depth_m: 3.50 }
              as: HarborAdmin
              as_user_id: "admin-1"
              captures: { stop1_id: $.data.id }
            - call: "POST /harbor/docks"
              payload: { name: "Pier Two", berth_count: 1, min_turnaround_minutes: 0, landing_fee_per_pax_cents: 200, berth_minute_rate_cents: 60, monthly_fee_cap_cents: 1000000 }
              as: HarborAdmin
              as_user_id: "admin-1"
              captures: { dock_b_id: $.data.id }
            - call: "POST /harbor/docks/${dock_b_id}/stops"
              payload: { name: "Quay Two", zone_index: 2, charted_depth_m: 4.00 }
              as: HarborAdmin
              as_user_id: "admin-1"
              captures: { stop2_id: $.data.id }
            - call: "POST /harbor/vessels"
              payload: { name: "Osprey", seat_capacity: 40, draft_m: 1.20, hull_class: "OFFSHORE", required_endorsement: "MASTER_25T" }
              as: HarborAdmin
              as_user_id: "admin-1"
              captures: { vessel_id: $.data.id }
            - call: "POST /harbor/crew-members"
              payload: { name: "K. Rowe", endorsement_class: "MASTER_100T", cert_expires_on: "2027-12-31", medical_expires_on: "2027-12-31" }
              as: HarborAdmin
              as_user_id: "admin-1"
              captures: { crew_id: $.data.id }
            - call: "POST /harbor/service-days"
              payload: { service_date: "2026-09-12", wind_knots: 10.0, wave_height_m: 0.30, low_water_m: 2.10, event_name: "Harbor Bowl", expected_attendance: 18000 }
              as: HarborAdmin
              as_user_id: "admin-1"
              captures: { day_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-12T13:00:00Z" }
              as: HarborAdmin
              as_user_id: "admin-1"
            - call: "POST /harbor/trips"
              payload: { service_day_id: "${day_id}", vessel_id: "${vessel_id}", master_crew_id: "${crew_id}", origin_stop_id: "${stop1_id}", destination_stop_id: "${stop2_id}", service_mode: "SCHEDULED", scheduled_departure_utc: "2026-09-12T14:00:00Z", scheduled_arrival_utc: "2026-09-12T14:25:00Z" }
              as: Dispatcher
              as_user_id: "disp-1"
              captures: { trip_id: $.data.id, trip_v: $.data.version }
            - call: "POST /harbor/ride-passes"
              payload: { zone_tier: "INNER", rides_purchased: 10, purchase_price_cents: 9000, valid_until: "2026-12-31" }
              as: Rider
              as_user_id: "rider-ann"
              captures: { pass_ann_id: $.data.id }
            - call: "POST /harbor/ride-passes"
              payload: { zone_tier: "INNER", rides_purchased: 10, purchase_price_cents: 9000, valid_until: "2026-12-31" }
              as: Rider
              as_user_id: "rider-bob"
              captures: { pass_bob_id: $.data.id }
            - call: "POST /harbor/bookings"
              payload: { origin_stop_id: "${stop1_id}", destination_stop_id: "${stop2_id}", requested_date: "2026-09-12", service_mode: "SCHEDULED", party_size: 4, ride_pass_id: "${pass_ann_id}" }
              as: Rider
              as_user_id: "rider-ann"
              captures: { bk_ann_id: $.data.id }
            - call: "POST /harbor/bookings/${bk_ann_id}/dispatch"
              payload: {}
              as: Dispatcher
              as_user_id: "disp-1"
            - call: "POST /harbor/bookings/${bk_ann_id}/confirm"
              payload: { expected_trip_version: "${trip_v}" }
              as: Rider
              as_user_id: "rider-ann"
            - call: "POST /harbor/bookings"
              payload: { origin_stop_id: "${stop1_id}", destination_stop_id: "${stop2_id}", requested_date: "2026-09-12", service_mode: "SCHEDULED", party_size: 4, ride_pass_id: "${pass_bob_id}" }
              as: Rider
              as_user_id: "rider-bob"
              captures: { bk_bob_id: $.data.id }
            - call: "POST /harbor/bookings/${bk_bob_id}/dispatch"
              payload: {}
              as: Dispatcher
              as_user_id: "disp-1"
            - call: "GET /harbor/trips/${trip_id}"
              payload: {}
              as: Dispatcher
              as_user_id: "disp-1"
              captures: { trip_v2: $.data.version }
            - call: "POST /harbor/bookings/${bk_bob_id}/confirm"
              payload: { expected_trip_version: "${trip_v2}" }
              as: Rider
              as_user_id: "rider-bob"
          trigger:
            - call: "POST /harbor/ride-passes/${pass_ann_id}/refund"
              payload: { settlement_basis: "PRO_RATA" }
              as: Rider
              as_user_id: "rider-ann"
            - call: "POST /harbor/ride-passes/${pass_bob_id}/refund"
              payload: { settlement_basis: "DIFFERENTIAL" }
              as: Rider
              as_user_id: "rider-bob"
          assert:
            - "RidePass.${pass_ann_id}.refund_amount_cents == 5400"
            - "RidePass.${pass_ann_id}.refund_basis == PRO_RATA"
            - "RidePass.${pass_bob_id}.refund_amount_cents == 4600"
            - "RidePass.${pass_bob_id}.refund_basis == DIFFERENTIAL"
            - "RidePass.${pass_ann_id}.refund_amount_cents != RidePass.${pass_bob_id}.refund_amount_cents"
            - "RidePass.${pass_ann_id}.status == REFUNDED"
            - "RidePass.${pass_bob_id}.rides_remaining == 0"

  # ===========================================================================
  # Rule 2 - combinatorial formulas across different modes
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: fare_quote_rounds_per_seat_after_each_multiplier_then_multiplies_by_party
        grounds:
          - calculations.booking_fare_quote
          - calculations.surge_tier_selection
          - entities.Booking.fields.fare_quoted_cents
          - entities.ServiceDay.fields.surge_multiplier_bp
        distinguishing_aspect: |
          Mode (b) - nested rounding whose order changes the cents. Rounding after the mode
          multiplier and again after the surge multiplier, per seat, then multiplying by
          party_size 3, gives 3807; rounding only once at the end of
          725 * 1.40 * 1.25 * 3 gives 3806. The scaffold pins round-per-seat-then-multiply.
        test_recipe:
          setup:
            - "Stop 'Ferry Landing' at zone 1 and Stop 'Quay Two' at zone 2, so zone_span is 1 and base_cents is 725."
            - "ServiceDay 2026-09-12 with event 'Harbor Bowl' and expected_attendance 18000, so surge_tier is ELEVATED and surge_multiplier_bp is 12500."
            - "The logical clock sits at 2026-09-12T13:00:00Z."
          setup_api_calls:
            - call: "POST /harbor/docks"
              payload: { name: "Pier One", berth_count: 2, min_turnaround_minutes: 15, landing_fee_per_pax_cents: 120, berth_minute_rate_cents: 40, monthly_fee_cap_cents: 1000000 }
              as: HarborAdmin
              as_user_id: "admin-1"
              captures: { dock_a_id: $.data.id }
            - call: "POST /harbor/docks/${dock_a_id}/stops"
              payload: { name: "Ferry Landing", zone_index: 1, charted_depth_m: 3.50 }
              as: HarborAdmin
              as_user_id: "admin-1"
              captures: { stop1_id: $.data.id }
            - call: "POST /harbor/docks"
              payload: { name: "Pier Two", berth_count: 1, min_turnaround_minutes: 0, landing_fee_per_pax_cents: 200, berth_minute_rate_cents: 60, monthly_fee_cap_cents: 1000000 }
              as: HarborAdmin
              as_user_id: "admin-1"
              captures: { dock_b_id: $.data.id }
            - call: "POST /harbor/docks/${dock_b_id}/stops"
              payload: { name: "Quay Two", zone_index: 2, charted_depth_m: 4.00 }
              as: HarborAdmin
              as_user_id: "admin-1"
              captures: { stop2_id: $.data.id }
            - call: "POST /harbor/service-days"
              payload: { service_date: "2026-09-12", wind_knots: 10.0, wave_height_m: 0.30, low_water_m: 2.10, event_name: "Harbor Bowl", expected_attendance: 18000 }
              as: HarborAdmin
              as_user_id: "admin-1"
              captures: { day_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-12T13:00:00Z" }
              as: HarborAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /harbor/bookings"
              payload: { origin_stop_id: "${stop1_id}", destination_stop_id: "${stop2_id}", requested_date: "2026-09-12", service_mode: "ON_DEMAND", party_size: 3 }
              as: Rider
              as_user_id: "rider-ann"
              captures: { bk_id: $.data.id }
          assert:
            - "ServiceDay.${day_id}.surge_tier == ELEVATED"
            - "ServiceDay.${day_id}.surge_multiplier_bp == 12500"
            - "Booking.${bk_id}.fare_quoted_cents == 3807"
            - "Booking.${bk_id}.fare_quoted_cents != 3806"
            - "Booking.${bk_id}.status == REQUESTED"
            - "Booking.${bk_id}.fare_charged_cents == 0"

      - name: dock_rebate_tier_keyed_on_pre_posting_accrual_not_post_posting
        grounds:
          - calculations.dock_slot_fee_posting
          - entities.Dock.fields.accrued_fee_cents
          - entities.DockSlot.fields.rebate_bp
          - state_machines.Trip.BOARDING_to_DEPARTED
        distinguishing_aspect: |
          Mode (c) - a circular-looking dependency with a pinned evaluation order. The rebate tier
          is read from Dock.accrued_fee_cents BEFORE the posting is added, so the second slot's
          100000-cent gross is rebated at 800 bp (pre-accrual 300000) and posts 92000, whereas
          keying the tier on the post-posting accrual of 400000 would still give 800 bp but keying
          it on the first slot's own pre-accrual of 0 would give 100000.
        test_recipe:
          setup:
            - "Deepwater Berth dock: berth_count 2, min_turnaround_minutes 0, 0 cents/pax, 5000 cents/berth-minute, cap 100000000."
            - "Two SCHEDULED trips Ferry Landing -> Deepwater Stop on 2026-09-12, each boarded with an empty manifest so pax_basis is 0."
            - "Trip one holds a 60-minute berth window 14:00-15:00 and has departed, driving Deepwater Berth's accrual to 300000 cents."
            - "Trip two holds a 20-minute berth window 16:00-16:20 and is BOARDING; the clock reads 16:05."
          setup_api_calls:
            - call: "POST /harbor/docks"
              payload: { name: "Pier One", berth_count: 2, min_turnaround_minutes: 15, landing_fee_per_pax_cents: 120, berth_minute_rate_cents: 40, monthly_fee_cap_cents: 1000000 }
              as: HarborAdmin
              as_user_id: "admin-1"
              captures: { dock_a_id: $.data.id }
            - call: "POST /harbor/docks/${dock_a_id}/stops"
              payload: { name: "Ferry Landing", zone_index: 1, charted_depth_m: 3.50 }
              as: HarborAdmin
              as_user_id: "admin-1"
              captures: { stop1_id: $.data.id }
            - call: "POST /harbor/docks"
              payload: { name: "Deepwater Berth", berth_count: 2, min_turnaround_minutes: 0, landing_fee_per_pax_cents: 0, berth_minute_rate_cents: 5000, monthly_fee_cap_cents: 100000000 }
              as: HarborAdmin
              as_user_id: "admin-1"
              captures: { dock_d_id: $.data.id, dock_d_v: $.data.version }
            - call: "POST /harbor/docks/${dock_d_id}/stops"
              payload: { name: "Deepwater Stop", zone_index: 3, charted_depth_m: 6.00 }
              as: HarborAdmin
              as_user_id: "admin-1"
              captures: { stop3_id: $.data.id }
            - call: "POST /harbor/vessels"
              payload: { name: "Osprey", seat_capacity: 40, draft_m: 1.20, hull_class: "OFFSHORE", required_endorsement: "MASTER_25T" }
              as: HarborAdmin
              as_user_id: "admin-1"
              captures: { vessel_id: $.data.id }
            - call: "POST /harbor/crew-members"
              payload: { name: "K. Rowe", endorsement_class: "MASTER_100T", cert_expires_on: "2027-12-31", medical_expires_on: "2027-12-31" }
              as: HarborAdmin
              as_user_id: "admin-1"
              captures: { crew_id: $.data.id }
            - call: "POST /harbor/vessels/${vessel_id}/inspections"
              payload: { inspection_type: "ANNUAL", result: "PASS", deficiency_count: 0, performed_on: "2026-08-01" }
              as: MarineInspector
              as_user_id: "insp-1"
            - call: "POST /harbor/service-days"
              payload: { service_date: "2026-09-12", wind_knots: 10.0, wave_height_m: 0.30, low_water_m: 2.10 }
              as: HarborAdmin
              as_user_id: "admin-1"
              captures: { day_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-12T13:00:00Z" }
              as: HarborAdmin
              as_user_id: "admin-1"
            - call: "POST /harbor/trips"
              payload: { service_day_id: "${day_id}", vessel_id: "${vessel_id}", master_crew_id: "${crew_id}", origin_stop_id: "${stop1_id}", destination_stop_id: "${stop3_id}", service_mode: "SCHEDULED", scheduled_departure_utc: "2026-09-12T14:00:00Z", scheduled_arrival_utc: "2026-09-12T15:10:00Z" }
              as: Dispatcher
              as_user_id: "disp-1"
              captures: { trip1_id: $.data.id }
