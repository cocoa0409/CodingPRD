scaffold_corner_design:

  # =========================================================================
  # Entities
  # =========================================================================
  - section: entities
    instances:
      - name: create_modality_returns_201_with_fields
        claim_type: Creation
        grounds: [entities.Modality, endpoints]
        distinguishing_aspect: "POST /practice/modalities with name, code, base_price_cents returns 201 and a body with id, code, base_price_cents, archived==false."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /practice/modalities"
              payload: { name: "Swedish", code: "SWEDISH", base_price_cents: 12000, contraindication_tags: ["PREGNANCY"] }
              as: PracticeAdmin
              captures: { mod: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Modality.${mod}.code == SWEDISH"
            - "Modality.${mod}.base_price_cents == 12000"
            - "Modality.${mod}.archived == false"

      - name: get_modality_not_found
        claim_type: Not Found
        grounds: ["entities.Modality", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /practice/modalities/{id} with a random non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /practice/modalities/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PracticeAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"
            - "HTTP status == 404"

      - name: create_modality_missing_required_field
        claim_type: Required Fields
        grounds: ["entities.Modality.fields.base_price_cents", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /practice/modalities omitting base_price_cents returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /practice/modalities"
              payload: { name: "NoPrice", code: "NOPRICE" }
              as: PracticeAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "HTTP status == 422"

      - name: modality_requires_certification_default_false
        claim_type: Defaults
        grounds: [entities.Modality.fields.requires_certification]
        distinguishing_aspect: "Omitting requires_certification on modality create applies default false."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /practice/modalities"
              payload: { name: "Lymphatic", code: "LYMPH", base_price_cents: 11000 }
              as: PracticeAdmin
              captures: { mod: $.data.id }
          assert:
            - "Modality.${mod}.requires_certification == false"

      - name: therapist_license_status_computed_active
        claim_type: Computed Fields
        grounds: [entities.Therapist.fields.license_status]
        distinguishing_aspect: "Therapist.license_status is computed ACTIVE when license_expiry > clock.now (2026-01-01 default), regardless of any input license_status."
        test_recipe:
          setup: ["Clock at startup default 2026-01-01T00:00:00Z."]
          setup_api_calls: []
          trigger:
            - call: "POST /practice/therapists"
              payload: { full_name: "Lic Test", license_number: "LMT-900100", license_expiry: "2027-06-01T00:00:00Z" }
              as: PracticeAdmin
              captures: { t: $.data.id }
          assert:
            - "Therapist.${t}.license_status == ACTIVE"

      - name: client_system_fields_generated
        claim_type: System Fields
        grounds: [entities.Client.fields.wallet_credit_cents, entities.Client.fields.no_show_strikes]
        distinguishing_aspect: "Client create stamps id, version==1, wallet_credit_cents==0, no_show_strikes==0 regardless of input."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /practice/clients"
              payload: { full_name: "Sys Fields", email: "sys@x.com" }
              as: FrontDesk
              captures: { c: $.data.id }
          assert:
            - "Client.${c}.version == 1"
            - "Client.${c}.wallet_credit_cents == 0"
            - "Client.${c}.no_show_strikes == 0"

      - name: appointment_invalid_duration_enum
        claim_type: Type Constraints
        grounds: ["entities.Appointment.fields.duration_minutes", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Booking with duration_minutes==45 (not in {30,60,90,120}) returns ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["A bookable client/therapist/table/modality/consent/intake set."]
          setup_api_calls:
            - call: "POST /practice/modalities"
              payload: { name: "Swedish", code: "SWEDISH", base_price_cents: 12000 }
              as: PracticeAdmin
              captures: { mod: $.data.id }
            - call: "POST /practice/therapists"
              payload: { full_name: "TD", license_number: "LMT-900200", license_expiry: "2027-01-01T00:00:00Z" }
              as: PracticeAdmin
              captures: { t: $.data.id }
            - call: "POST /practice/tables"
              payload: { label: "RD-A", room: "RD" }
              as: PracticeAdmin
              captures: { tbl: $.data.id, tbl_v: $.data.version }
            - call: "POST /practice/clients"
              payload: { full_name: "CD", email: "cd@x.com" }
              as: FrontDesk
              captures: { cli: $.data.id }
            - call: "POST /practice/intakes"
              payload: { client_id: "${cli}", expires_at: "2026-12-31T00:00:00Z" }
              as: FrontDesk
              captures: { itk: $.data.id }
            - call: "POST /practice/intakes/${itk}/sign"
              payload: {}
              as: FrontDesk
            - call: "POST /practice/consent-records"
              payload: { client_id: "${cli}", draping_policy: "FULL_DRAPE" }
              as: FrontDesk
              captures: { con: $.data.id }
          trigger:
            - call: "POST /practice/appointments"
              payload: { client_id: "${cli}", therapist_id: "${t}", table_id: "${tbl}", modality_id: "${mod}", consent_id: "${con}", start_at: "2026-01-02T09:00:00Z", duration_minutes: 45, payer: "CASH", expected_table_version: "${tbl_v}" }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "HTTP status == 422"

      - name: credit_ledger_entry_immutable_no_version
        claim_type: Immutability
        grounds: [entities.CreditLedgerEntry]
        distinguishing_aspect: "CreditLedgerEntry has common_fields:false (no version, no update endpoint); only id and created_at plus its content fields appear; entries are append-only via package operations."
        test_recipe:
          setup: ["A package whose initial GRANT wrote a ledger entry."]
          setup_api_calls:
            - call: "POST /practice/plans"
              payload: { name: "LP", monthly_fee_cents: 9000, included_sessions: 2 }
              as: PracticeAdmin
              captures: { plan: $.data.id }
            - call: "POST /practice/clients"
              payload: { full_name: "CL", email: "cl@x.com" }
              as: FrontDesk
              captures: { cli: $.data.id }
            - call: "POST /practice/packages"
              payload: { client_id: "${cli}", plan_id: "${plan}" }
              as: FrontDesk
              captures: { pkg: $.data.id }
          trigger:
            - call: "GET /practice/packages/${pkg}/ledger"
              payload: {}
              as: PracticeAdmin
          assert:
            - "ledger array length == 1"
            - "ledger[0].reason == GRANT and ledger[0].balance_after == 2"

      - name: package_requires_existing_plan
        claim_type: Parent Relationships
        grounds: ["entities.Package.fields.plan_id", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Enrolling a package with a non-existent plan_id returns ERR_NOT_FOUND."
        test_recipe:
          setup: ["A client but no plan with the referenced id."]
          setup_api_calls:
            - call: "POST /practice/clients"
              payload: { full_name: "CP", email: "cp@x.com" }
              as: FrontDesk
              captures: { cli: $.data.id }
          trigger:
            - call: "POST /practice/packages"
              payload: { client_id: "${cli}", plan_id: "00000000-0000-4000-8000-000000000001" }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"
            - "HTTP status == 404"

      - name: list_appointments_pagination_envelope
        claim_type: Listing
        grounds: [entities.Appointment, endpoints]
        distinguishing_aspect: "GET /practice/appointments returns response_type array with total_count and has_more pagination fields."
        test_recipe:
          setup: ["Empty DB (zero appointments)."]
          setup_api_calls: []
          trigger:
            - call: "GET /practice/appointments"
              payload: {}
              as: FrontDesk
          assert:
            - "response_type == array"
            - "meta pagination total_count == 0 and has_more == false"

      - name: modality_archived_excluded_from_default_list
        claim_type: Type Constraints
        grounds: [entities.Modality.fields.archived, endpoints]
        distinguishing_aspect: "include_archived filter on GET /practice/modalities controls whether archived modalities appear; default list omits them."
        test_recipe:
          setup: ["One non-archived modality exists; no archived modalities exist."]
          setup_api_calls:
            - call: "POST /practice/modalities"
              payload: { name: "Swedish", code: "SWEDISH", base_price_cents: 12000 }
              as: PracticeAdmin
          trigger:
            - call: "GET /practice/modalities"
              payload: {}
              as: FrontDesk
          assert:
            - "response_type == array"
            - "every returned Modality has archived == false"

  # =========================================================================
  # State Machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: pay_from_unsettled_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.Appointment.PRICED_to_PAID", "errors[ERR_INVALID_STATE]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / state_beats_fiscal_invalid_state_vs_insufficient_hsa
          rationale: "Paying an UNSETTLED appointment is exactly the state-precondition rejection asserted by the §1.8 priority conflict instance."

      - name: cancel_already_cancelled_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.Appointment.SCHEDULED_to_CANCELLED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A second cancel on a CANCELLED appointment returns ERR_INVALID_STATE; no side effects fire."
        test_recipe:
          setup: ["A booked appointment already CANCELLED."]
          setup_api_calls:
            - call: "POST /practice/modalities"
              payload: { name: "Swedish", code: "SWEDISH", base_price_cents: 12000 }
              as: PracticeAdmin
              captures: { mod: $.data.id }
            - call: "POST /practice/therapists"
              payload: { full_name: "TC", license_number: "LMT-910001", license_expiry: "2027-01-01T00:00:00Z" }
              as: PracticeAdmin
              captures: { t: $.data.id }
            - call: "POST /practice/tables"
              payload: { label: "RC-A", room: "RC" }
              as: PracticeAdmin
              captures: { tbl: $.data.id, tbl_v: $.data.version }
            - call: "POST /practice/clients"
              payload: { full_name: "CC", email: "cc@x.com" }
              as: FrontDesk
              captures: { cli: $.data.id }
            - call: "POST /practice/intakes"
              payload: { client_id: "${cli}", expires_at: "2026-12-31T00:00:00Z" }
              as: FrontDesk
              captures: { itk: $.data.id }
            - call: "POST /practice/intakes/${itk}/sign"
              payload: {}
              as: FrontDesk
            - call: "POST /practice/consent-records"
              payload: { client_id: "${cli}", draping_policy: "FULL_DRAPE" }
              as: FrontDesk
              captures: { con: $.data.id }
            - call: "POST /practice/appointments"
              payload: { client_id: "${cli}", therapist_id: "${t}", table_id: "${tbl}", modality_id: "${mod}", consent_id: "${con}", start_at: "2026-01-05T09:00:00Z", duration_minutes: 60, payer: "CASH", expected_table_version: "${tbl_v}" }
              as: FrontDesk
              captures: { ap: $.data.id }
            - call: "POST /practice/appointments/${ap}/cancel"
              payload: { cancel_reason: "CLIENT_REQUEST" }
              as: FrontDesk
          trigger:
            - call: "POST /practice/appointments/${ap}/cancel"
              payload: { cancel_reason: "CLIENT_REQUEST" }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "Appointment.${ap}.scheduling_status == CANCELLED"

      - name: appointment_initial_states
        claim_type: initial_state
        grounds: [entities.Appointment.fields.scheduling_status, entities.Appointment.fields.settlement_status]
        distinguishing_aspect: "A freshly booked appointment starts scheduling_status==SCHEDULED and settlement_status==UNSETTLED."
        test_recipe:
          setup: ["A bookable set."]
          setup_api_calls:
            - call: "POST /practice/modalities"
              payload: { name: "Swedish", code: "SWEDISH", base_price_cents: 12000 }
              as: PracticeAdmin
              captures: { mod: $.data.id }
            - call: "POST /practice/therapists"
              payload: { full_name: "TI", license_number: "LMT-920001", license_expiry: "2027-01-01T00:00:00Z" }
              as: PracticeAdmin
              captures: { t: $.data.id }
            - call: "POST /practice/tables"
              payload: { label: "RI-A", room: "RI" }
              as: PracticeAdmin
              captures: { tbl: $.data.id, tbl_v: $.data.version }
            - call: "POST /practice/clients"
              payload: { full_name: "CI", email: "ci@x.com" }
              as: FrontDesk
              captures: { cli: $.data.id }
            - call: "POST /practice/intakes"
              payload: { client_id: "${cli}", expires_at: "2026-12-31T00:00:00Z" }
              as: FrontDesk
              captures: { itk: $.data.id }
            - call: "POST /practice/intakes/${itk}/sign"
              payload: {}
              as: FrontDesk
            - call: "POST /practice/consent-records"
              payload: { client_id: "${cli}", draping_policy: "FULL_DRAPE" }
              as: FrontDesk
              captures: { con: $.data.id }
          trigger:
            - call: "POST /practice/appointments"
              payload: { client_id: "${cli}", therapist_id: "${t}", table_id: "${tbl}", modality_id: "${mod}", consent_id: "${con}", start_at: "2026-01-05T09:00:00Z", duration_minutes: 60, payer: "CASH", expected_table_version: "${tbl_v}" }
              as: FrontDesk
              captures: { ap: $.data.id }
          assert:
            - "Appointment.${ap}.scheduling_status == SCHEDULED"
            - "Appointment.${ap}.settlement_status == UNSETTLED"

      - name: terminal_completed_cannot_cancel
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.Appointment.SCHEDULED_to_CANCELLED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A COMPLETED appointment (terminal on scheduling axis) cannot be cancelled; cancel returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["An appointment driven to COMPLETED via check-in + finalized note + complete."]
          setup_api_calls:
            - call: "POST /practice/modalities"
              payload: { name: "Swedish", code: "SWEDISH", base_price_cents: 12000 }
              as: PracticeAdmin
              captures: { mod: $.data.id }
            - call: "POST /practice/therapists"
              payload: { full_name: "TT", license_number: "LMT-930001", license_expiry: "2027-01-01T00:00:00Z" }
              as: PracticeAdmin
              captures: { t: $.data.id }
            - call: "POST /practice/tables"
              payload: { label: "RT-A", room: "RT" }
              as: PracticeAdmin
              captures: { tbl: $.data.id, tbl_v: $.data.version }
            - call: "POST /practice/clients"
              payload: { full_name: "CT", email: "ct@x.com" }
              as: FrontDesk
              captures: { cli: $.data.id }
            - call: "POST /practice/intakes"
              payload: { client_id: "${cli}", expires_at: "2026-12-31T00:00:00Z" }
              as: FrontDesk
              captures: { itk: $.data.id }
            - call: "POST /practice/intakes/${itk}/sign"
              payload: {}
              as: FrontDesk
            - call: "POST /practice/consent-records"
              payload: { client_id: "${cli}", draping_policy: "FULL_DRAPE" }
              as: FrontDesk
              captures: { con: $.data.id }
            - call: "POST /practice/appointments"
              payload: { client_id: "${cli}", therapist_id: "${t}", table_id: "${tbl}", modality_id: "${mod}", consent_id: "${con}", start_at: "2026-01-05T09:00:00Z", duration_minutes: 60, payer: "CASH", expected_table_version: "${tbl_v}" }
              as: FrontDesk
              captures: { ap: $.data.id }
            - call: "POST /practice/soap-notes"
              payload: { appointment_id: "${ap}", subjective: "s", objective: "o", assessment: "a", plan: "p" }
              as: Therapist
              as_user_id: "${t}"
              captures: { sn: $.data.id }
            - call: "POST /practice/appointments/${ap}/check-in"
              payload: {}
              as: FrontDesk
            - call: "POST /practice/soap-notes/${sn}/finalize"
              payload: {}
              as: Therapist
              as_user_id: "${t}"
            - call: "POST /practice/appointments/${ap}/complete"
              payload: {}
              as: Therapist
              as_user_id: "${t}"
          trigger:
            - call: "POST /practice/appointments/${ap}/cancel"
              payload: { cancel_reason: "CLIENT_REQUEST" }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "Appointment.${ap}.scheduling_status == COMPLETED"

      - name: package_resume_from_active_invalid
        claim_type: invalid_transition
        grounds: ["state_machines.Package.SUSPENDED_to_ACTIVE", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Resume on an ACTIVE (not SUSPENDED) package returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["An ACTIVE package."]
          setup_api_calls:
            - call: "POST /practice/plans"
              payload: { name: "RP", monthly_fee_cents: 9000, included_sessions: 1 }
              as: PracticeAdmin
              captures: { plan: $.data.id }
            - call: "POST /practice/clients"
              payload: { full_name: "CR", email: "cr@x.com" }
              as: FrontDesk
              captures: { cli: $.data.id }
            - call: "POST /practice/packages"
              payload: { client_id: "${cli}", plan_id: "${plan}" }
              as: FrontDesk
              captures: { pkg: $.data.id }
          trigger:
            - call: "POST /practice/packages/${pkg}/resume"
              payload: {}
              as: PracticeAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "Package.${pkg}.package_status == ACTIVE"

      - name: package_suspend_resume_cycle
        claim_type: valid_transition
        grounds: [state_machines.Package.ACTIVE_to_SUSPENDED, state_machines.Package.SUSPENDED_to_ACTIVE]
        distinguishing_aspect: "Suspend then resume returns a package to ACTIVE with credit_balance_sessions unchanged (cyclic loop, credits frozen not forfeited)."
        test_recipe:
          setup: ["An ACTIVE package with initial 1 credit."]
          setup_api_calls:
            - call: "POST /practice/plans"
              payload: { name: "RP2", monthly_fee_cents: 9000, included_sessions: 1 }
              as: PracticeAdmin
              captures: { plan: $.data.id }
            - call: "POST /practice/clients"
              payload: { full_name: "CR2", email: "cr2@x.com" }
              as: FrontDesk
              captures: { cli: $.data.id }
            - call: "POST /practice/packages"
              payload: { client_id: "${cli}", plan_id: "${plan}" }
              as: FrontDesk
              captures: { pkg: $.data.id }
            - call: "POST /practice/packages/${pkg}/suspend"
              payload: {}
              as: PracticeAdmin
          trigger:
            - call: "POST /practice/packages/${pkg}/resume"
              payload: {}
              as: PracticeAdmin
          assert:
            - "Package.${pkg}.package_status == ACTIVE"
            - "Package.${pkg}.credit_balance_sessions == 1"

      - name: intake_sign_supersedes_prior
        claim_type: side_effect_execution
        grounds: [state_machines.Intake.DRAFT_to_ACTIVE, entities.Intake.fields.intake_status]
        distinguishing_aspect: "Signing a second intake for the same client moves the prior ACTIVE intake to SUPERSEDED (cascade: sign new -> supersede old)."
        test_recipe:
          setup: ["A client with one signed (ACTIVE) intake; a second DRAFT intake created."]
          setup_api_calls:
            - call: "POST /practice/clients"
              payload: { full_name: "CS", email: "cs@x.com" }
              as: FrontDesk
              captures: { cli: $.data.id }
            - call: "POST /practice/intakes"
              payload: { client_id: "${cli}", expires_at: "2026-12-31T00:00:00Z" }
              as: FrontDesk
              captures: { itk1: $.data.id }
            - call: "POST /practice/intakes/${itk1}/sign"
              payload: {}
              as: FrontDesk
            - call: "POST /practice/intakes"
              payload: { client_id: "${cli}", expires_at: "2027-12-31T00:00:00Z" }
              as: FrontDesk
              captures: { itk2: $.data.id }
          trigger:
            - call: "POST /practice/intakes/${itk2}/sign"
              payload: {}
              as: FrontDesk
          assert:
            - "Intake.${itk1}.intake_status == SUPERSEDED"
            - "Intake.${itk2}.intake_status == ACTIVE"

      - name: complete_requires_finalized_note_stub
        claim_type: guarded_transition
        grounds: [state_machines.Appointment.CHECKED_IN_to_COMPLETED]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / complete_requires_finalized_soapnote
          rationale: "The DRAFT-note-blocks-completion guard is the exact §1.8 cross-entity instance."

      - name: void_priced_appointment_settlement_void
        claim_type: cross_entity
        grounds: [state_machines.Appointment.PRICED_to_VOID, entities.Appointment.fields.settlement_status]
        excluded_because:
          difficulty_instance: transitive_cascade / void_priced_membership_cascade_depth3
          rationale: "The void-from-PRICED transition (settlement -> VOID) and its credit-refund cascade are exercised end-to-end by the §1.8 void cascade instance."

      - name: superbill_void_transition
        claim_type: valid_transition
        grounds: [state_machines.Superbill.ISSUED_to_VOID, entities.Superbill.fields.superbill_status]
        distinguishing_aspect: "POST /practice/superbills/{id}/void moves an ISSUED superbill to VOID (the only producer of the VOID enum value)."
        test_recipe:
          setup: ["A superbill ISSUED on a PAID CASH appointment."]
          setup_api_calls:
            - call: "POST /practice/modalities"
              payload: { name: "Swedish", code: "SWEDISH", base_price_cents: 12000 }
              as: PracticeAdmin
              captures: { mod: $.data.id }
            - call: "POST /practice/therapists"
              payload: { full_name: "TSV", license_number: "LMT-995001", license_expiry: "2027-01-01T00:00:00Z" }
              as: PracticeAdmin
              captures: { t: $.data.id }
            - call: "POST /practice/tables"
              payload: { label: "RSV-A", room: "RSV" }
              as: PracticeAdmin
              captures: { tbl: $.data.id, tbl_v: $.data.version }
            - call: "POST /practice/clients"
              payload: { full_name: "CSV", email: "csv@x.com", hsa_balance_cents: 0 }
              as: FrontDesk
              captures: { cli: $.data.id }
            - call: "POST /practice/intakes"
              payload: { client_id: "${cli}", expires_at: "2026-12-31T00:00:00Z" }
              as: FrontDesk
              captures: { itk: $.data.id }
            - call: "POST /practice/intakes/${itk}/sign"
              payload: {}
              as: FrontDesk
            - call: "POST /practice/consent-records"
              payload: { client_id: "${cli}", draping_policy: "FULL_DRAPE" }
              as: FrontDesk
              captures: { con: $.data.id }
            - call: "POST /practice/appointments"
