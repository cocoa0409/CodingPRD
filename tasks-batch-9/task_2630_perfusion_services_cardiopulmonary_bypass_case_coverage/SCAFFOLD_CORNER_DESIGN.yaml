        claim_type: precondition_enforcement
        grounds:
          - state_machines.PumpChecklist.DRAFT_to_VERIFIED
          - validations[priority=28]
          - validations[priority=29]
          - errors.ERR_CHECKLIST_NOT_DRAFT
          - errors.ERR_CASE_NOT_PACK_CONFIGURED
