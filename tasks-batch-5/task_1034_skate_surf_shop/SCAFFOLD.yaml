  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_special_order_version does not match live SpecialOrder.version" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ShopManager
    description: "Operations manager: catalog, inventory, coaches, rental assets, events, appraisals, order quoting/fulfillment, build completion."
    identity: opaque
    exclusive_operations:
      - "POST /products, POST /products/{id}/inventory-adjustments, POST /products/{id}/discontinue"
      - "POST /coaches, POST /rental-assets"
      - "POST /events, POST /events/{id}/publish, POST /events/{id}/cancel"
      - "POST /trade-ins/{id}/appraise, POST /trade-ins/{id}/sell"
      - "POST /special-orders/{id}/quote, POST /special-orders/{id}/fulfill"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /customers, POST /customers/{id}/loyalty-adjustments (with SalesAssociate)"
      - "Lesson, Rental, BoardBuild, ServiceTicket, TradeIn, SpecialOrder, EventEntry actions (superset over peer roles)"
      - "all GET endpoints"

  - name: BenchTech
    description: "Bench technician: board builds and grip/wheel/wax service tickets."
    identity: opaque
    exclusive_operations:
      - "POST /board-builds, POST /board-builds/{id}/reserve, POST /board-builds/{id}/complete, POST /board-builds/{id}/cancel"
      - "POST /service-tickets, POST /service-tickets/{id}/ready, POST /service-tickets/{id}/pickup, POST /service-tickets/{id}/cancel"
    shared_operations:
      - "all GET endpoints"

  - name: SalesAssociate
    description: "Front-of-house sales: customers, lessons, rentals, special-order intake/negotiation, trade-in intake, event registration."
    identity: opaque
    exclusive_operations:
      - "POST /lessons, POST /lessons/{id}/complete, POST /lessons/{id}/cancel"
      - "POST /rentals, POST /rentals/{id}/checkout, POST /rentals/{id}/return, POST /rentals/{id}/release"
      - "POST /special-orders/{id}/revise"
    shared_operations:
      - "POST /customers, POST /customers/{id}/loyalty-adjustments (with ShopManager)"
      - "POST /trade-ins, POST /trade-ins/{id}/accept, POST /trade-ins/{id}/reject (with Customer/ShopManager)"
      - "POST /special-orders, POST /special-orders/{id}/approve, POST /special-orders/{id}/cancel (with Customer/ShopManager)"
      - "POST /event-entries, POST /event-entries/{id}/cancel (with Customer/ShopManager)"
      - "all GET endpoints"

  - name: Customer
    description: "Loyalty member acting on their own account: opens trade-ins/special orders, accepts/rejects offers, approves quotes, registers for events."
    identity: "entity_backed:Customer"
    exclusive_operations: []
    shared_operations:
      - "POST /trade-ins, POST /trade-ins/{id}/accept, POST /trade-ins/{id}/reject"
      - "POST /special-orders, POST /special-orders/{id}/approve, POST /special-orders/{id}/cancel"
      - "POST /event-entries, POST /event-entries/{id}/cancel"
      - "all GET endpoints"
