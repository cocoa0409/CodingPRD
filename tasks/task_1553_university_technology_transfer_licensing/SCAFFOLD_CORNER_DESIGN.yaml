    distinguishing_aspect: The clock sweep is the only driver of EXECUTED->ACTIVE (clock >= effective_date) and EXECUTED/ACTIVE->EXPIRED
      (clock >= expiration_date); a license whose window never opens before expiring goes EXECUTED->EXPIRED directly.
    test_recipe:
      setup:
      - license L1 EXECUTED effective 2026-01-01 expiration 2026-12-31; license L2 EXECUTED effective 2027-01-01 expiration
        2027-06-30; clock at 2026-08-01 (before any sweep)
