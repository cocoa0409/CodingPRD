# =============================================================================
# Task 1508: Insurance Rate Filing & State Approval — scaffold seed tables
# =============================================================================

scenario: |
  Insurance Rate Filing & State Approval (insurer product filing team): rate
  indication development & rate change proposal, filing package (rate/rule/form)
  preparation by state, prior-approval vs file-and-use handling & effective dates,
  objection/interrogatory response cycle, countrywide vs state-specific deviation
  management, implementation & policy renewal timing, disruption analysis &
  capping rules, filing tracking & compliance calendar

domain_name: insurance-rate-filing
api_prefix: "/"

# =============================================================================
# Complexity Profile (§0.3)
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - scheduled_deferred_actions
    - cascading_side_effects
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Product
    parent: null
    common_fields: true
    fields:
      - { name: product_code, type: string, source: input, description: "Unique product code (e.g., PPA for personal auto)", constraints: "unique across all products" }
      - { name: name, type: string, source: input, description: "Product display name" }
      - { name: current_locked_indication_id, type: string, source: system, default: null, description: "Most recently LOCKED countrywide-scope RateIndication id; null until one locks" }

  - name: StateRegulatoryProfile
    parent: null
    common_fields: true
    fields:
      - { name: product_id, type: string, source: input, description: "FK -> Product.id" }
      - { name: state_code, type: string, source: input, description: "Two-letter state code", constraints: "uppercase A-Z pair" }
      - { name: filing_method, type: enum, source: input, description: "PRIOR_APPROVAL | FILE_AND_USE | USE_AND_FILE" }
      - { name: min_effective_lead_days, type: integer, source: input, description: "Minimum days between approval and effective date (PRIOR_APPROVAL)" }
      - { name: objection_response_sla_days, type: integer, source: input, description: "Days the insurer has to answer an objection" }
      - { name: deemer_days, type: integer, source: input, description: "Days after submission a PRIOR_APPROVAL filing is deemed approved if regulator has not acted; 0 disables" }
      - { name: max_single_change_pct, type: number, source: input, description: "Regulatory ceiling on proposed_change_pct per filing and on wave cap_pct" }
      - { name: renewal_notice_days, type: integer, source: input, description: "Days before renewal effective date a policyholder notice must be sent" }
      - { name: disapproval_window_days, type: integer, source: input, description: "Days after effectiveness during which a FILE_AND_USE / USE_AND_FILE filing may still be disapproved" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED" , default: "ACTIVE" }

  - name: RateIndication
    parent: null
    common_fields: true
    fields:
      - { name: product_id, type: string, source: input, description: "FK -> Product.id" }
      - { name: scope_state_code, type: string, source: input, default: null, description: "State scope of this indication; null means countrywide" }
      - { name: variant, type: enum, source: input, description: "INCURRED_CREDIBILITY | PAID_PURE — selects which variant populates indicated_change_pct" }
      - { name: earned_premium_cents, type: integer, source: input, description: "On-level earned premium for the experience period" }
      - { name: incurred_loss_cents, type: integer, source: input, description: "Reported incurred losses for the experience period" }
      - { name: paid_loss_cents, type: integer, source: input, description: "Paid losses for the experience period" }
      - { name: exposure_units, type: integer, source: input, description: "Earned exposures used for credibility" }
      - { name: trend_factor, type: number, source: input, description: "Annual loss/premium trend as decimal (0.04 = 4%)" }
      - { name: countrywide_change_pct, type: number, source: input, description: "Countrywide indicated change used as complement of credibility" }
      - { name: credibility_z, type: number, source: computed, description: "min(1, sqrt(exposure_units / FULL_CREDIBILITY_EXPOSURE))" }
      - { name: indicated_change_pct, type: number, source: computed, description: "Indicated rate change under the chosen variant, 4 decimal places round_half_up" }
      - { name: alternate_change_pct, type: number, source: computed, description: "Indicated rate change under the other variant, 4 decimal places round_half_up" }
      - { name: status, type: enum, source: system, description: "DRAFT | IN_ACTUARIAL_REVIEW | APPROVED | LOCKED | SUPERSEDED" }
      - { name: prepared_by_user_id, type: string, source: system, description: "X-User-ID of the creating ProductActuary" }
      - { name: approved_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the approving ProductActuary; must differ from prepared_by_user_id" }
      - { name: review_round, type: integer, source: system, default: 1, description: "Increments each time the indication is returned to DRAFT" }

  - name: RateFiling
    parent: null
    common_fields: true
    fields:
      - { name: product_id, type: string, source: input, description: "FK -> Product.id" }
      - { name: profile_id, type: string, source: system, description: "FK -> StateRegulatoryProfile.id; resolved from (product_id, state_code) at creation" }
      - { name: indication_id, type: string, source: input, description: "FK -> RateIndication.id; the locked actuarial basis" }
      - { name: state_code, type: string, source: input, description: "Destination state; must equal the resolved profile's state_code" }
      - { name: filing_type, type: enum, source: input, description: "RATE_CHANGE | RATE_RULE_FORM | RULE_ONLY | FORM_ONLY" }
      - { name: proposed_change_pct, type: number, source: input, description: "Proposed overall rate change as decimal" }
      - { name: proposed_effective_date, type: string, source: input, description: "Requested effective date, YYYY-MM-DD" }
      - { name: filing_number, type: string, source: system, default: null, description: "Assigned at submit: FIL-<state_code>-<6-digit zero-padded per-state sequence starting at 000001>" }
      - { name: status, type: enum, source: system, description: "DRAFT | READY | SUBMITTED | UNDER_OBJECTION | APPROVED | DEEMED_APPROVED | EFFECTIVE | SUPERSEDED | DISAPPROVED | WITHDRAWN" }
      - { name: submitted_at, type: datetime, source: system, default: null, description: "Logical clock timestamp at submission" }
      - { name: approved_at, type: datetime, source: system, default: null, description: "Logical clock timestamp of approval or deemed approval" }
      - { name: actual_effective_date, type: string, source: computed, default: null, description: "Resolved per effective_date_resolution; null until approved" }
      - { name: deemer_date, type: string, source: computed, default: null, description: "submitted_at date + deemer_days for PRIOR_APPROVAL with deemer_days > 0; else null" }
      - { name: superseded_at_date, type: string, source: system, default: null, description: "Date a newer filing's effectiveness superseded this one" }
      - { name: open_objection_count, type: integer, source: computed, description: "Count of objections in RAISED | RESPONSE_DRAFTED | RESPONSE_SUBMITTED | OVERDUE | REOPENED" }

  - name: FilingComponent
    parent: null
    common_fields: true
    fields:
      - { name: filing_id, type: string, source: system, description: "FK -> RateFiling.id" }
      - { name: component_type, type: enum, source: input, description: "RATE | RULE | FORM" }
      - { name: name, type: string, source: input, description: "Component name (e.g., Base Rate Pages)" }
      - { name: content_ref, type: string, source: input, description: "Opaque reference to the authored content artifact" }
      - { name: status, type: enum, source: system, description: "DRAFT | FINAL | SUPERSEDED | WITHDRAWN" }

  - name: Deviation
    parent: null
    common_fields: true
    fields:
      - { name: filing_id, type: string, source: input, description: "FK -> RateFiling.id" }
      - { name: deviation_type, type: enum, source: input, description: "RATE_FACTOR | RULE_TEXT | FORM_TEXT" }
      - { name: base_reference, type: string, source: input, description: "Countrywide standard this deviates from" }
      - { name: deviation_factor, type: number, source: input, description: "Multiplicative factor vs countrywide (1.00 = none)" }
      - { name: justification, type: string, source: input, description: "Actuarial/regulatory justification text" }
      - { name: status, type: enum, source: system, description: "PROPOSED | APPROVED | REJECTED | WITHDRAWN | SUPERSEDED" }

  - name: Objection
    parent: null
    common_fields: true
    fields:
      - { name: filing_id, type: string, source: input, description: "FK -> RateFiling.id" }
      - { name: question_text, type: string, source: input, description: "Regulator interrogatory text" }
      - { name: raised_at, type: datetime, source: system, description: "Logical clock timestamp when raised" }
      - { name: due_at, type: datetime, source: computed, description: "raised_at + profile.objection_response_sla_days" }
      - { name: status, type: enum, source: system, description: "RAISED | RESPONSE_DRAFTED | RESPONSE_SUBMITTED | OVERDUE | RESOLVED | REOPENED | WITHDRAWN" }
      - { name: reopen_count, type: integer, source: system, default: 0, description: "Number of times the regulator reopened this objection" }
      - { name: late_breach, type: boolean, source: system, default: false, description: "True once any response was submitted after due_at or the objection ever entered OVERDUE" }
      - { name: resolved_at, type: datetime, source: system, default: null, description: "When the objection reached RESOLVED or WITHDRAWN" }

  - name: ObjectionResponse
    parent: null
    common_fields: true
    fields:
      - { name: objection_id, type: string, source: system, description: "FK -> Objection.id" }
      - { name: response_text, type: string, source: input, description: "Insurer response body" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | SUPERSEDED" }
      - { name: drafted_by_user_id, type: string, source: system, description: "X-User-ID of the drafting FilingAnalyst" }
      - { name: submitted_at, type: datetime, source: system, default: null, description: "Logical clock timestamp at submission" }

  - name: ImplementationWave
    parent: null
    common_fields: true
    fields:
      - { name: filing_id, type: string, source: input, description: "FK -> RateFiling.id" }
      - { name: product_id, type: string, source: system, description: "FK -> Product.id; denormalized from the filing" }
      - { name: state_code, type: string, source: system, description: "Denormalized from the filing" }
      - { name: wave_start_date, type: string, source: input, description: "First renewal date in scope, YYYY-MM-DD (inclusive)" }
      - { name: wave_end_date, type: string, source: input, description: "Last renewal date in scope, YYYY-MM-DD (inclusive)" }
      - { name: cap_pct, type: number, source: input, description: "Per-policy disruption cap as decimal; must be <= profile.max_single_change_pct" }
      - { name: approved_change_pct, type: number, source: system, description: "Snapshot of filing.proposed_change_pct at wave creation" }
      - { name: balance_factor, type: number, source: computed, default: null, description: "Book-level rebalancing factor, 8 decimal places round_half_up; null until release" }
      - { name: target_book_delta_cents, type: integer, source: computed, default: null, description: "round_half_up(approved_change_pct * sum of baselines) at release" }
      - { name: final_book_delta_cents, type: integer, source: computed, default: null, description: "sum(final_premium_cents - baseline_premium_cents) after remainder allocation" }
      - { name: rated_policy_count, type: integer, source: computed, default: 0, description: "Policies currently RATED | NOTICE_SENT | COMPLETED in this wave" }
      - { name: excluded_late_notice_count, type: integer, source: computed, default: 0, description: "Policies left out at release because timely notice was already impossible" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | RELEASED | REVERSED | CANCELLED | COMPLETED" }

  - name: RenewalPolicy
    parent: null
    common_fields: true
    fields:
      - { name: product_id, type: string, source: input, description: "FK -> Product.id" }
      - { name: wave_id, type: string, source: system, default: null, description: "FK -> ImplementationWave.id; null until a wave release assigns the policy" }
      - { name: state_code, type: string, source: input, description: "Policy situs state" }
      - { name: policy_number, type: string, source: input, description: "Unique per (product_id, state_code)", constraints: "unique within product+state" }
      - { name: current_premium_cents, type: integer, source: input, description: "In-force annual premium; advances to final_premium_cents at renewal completion and is restored from baseline on rescission" }
      - { name: class_rel_factor, type: number, source: input, description: "Policy class relativity vs the book average (1.0 = average)" }
      - { name: renewal_effective_date, type: string, source: input, description: "Upcoming renewal date, YYYY-MM-DD" }
      - { name: baseline_premium_cents, type: integer, source: system, default: null, description: "Snapshot of current_premium_cents taken at wave release; used for reversal restore" }
      - { name: raw_change_pct, type: number, source: computed, default: null, description: "approved_change_pct * class_rel_factor, 4 decimal places round_half_up" }
      - { name: raw_new_premium_cents, type: integer, source: computed, default: null, description: "Uncapped re-rated premium" }
      - { name: was_capped, type: boolean, source: computed, default: null, description: "True iff |raw_change_pct| > cap_pct (strictly greater)" }
      - { name: final_premium_cents, type: integer, source: computed, default: null, description: "Capped, balanced, remainder-adjusted premium" }
      - { name: notice_due_date, type: string, source: computed, default: null, description: "renewal_effective_date - profile.renewal_notice_days; notice on or before this date is timely" }
      - { name: notice_sent_at, type: datetime, source: system, default: null, description: "When the renewal notice was sent" }
      - { name: status, type: enum, source: system, description: "PENDING | RATED | NOTICE_SENT | COMPLETED | RESCINDED" }
      - { name: exclusion_reason, type: enum, source: system, default: null, description: "LATE_NOTICE_BY_CONSTRUCTION | LATE_NOTICE_SWEEP; set when a wave leaves the policy out" }

  - name: ComplianceCalendarEntry
    parent: null
    common_fields: true
    fields:
      - { name: filing_id, type: string, source: system, default: null, description: "FK -> RateFiling.id; null for wave-only entries" }
      - { name: wave_id, type: string, source: system, default: null, description: "FK -> ImplementationWave.id; null when not wave-related" }
      - { name: objection_id, type: string, source: system, default: null, description: "FK -> Objection.id; null when not objection-related" }
      - { name: entry_type, type: enum, source: system, description: "OBJECTION_RESPONSE_DUE | DEEMER_DATE | WAVE_WINDOW | RENEWAL_NOTICE_DUE | EFFECTIVE_DATE" }
      - { name: due_date, type: datetime, source: system, description: "Deadline instant tracked by this entry; date-only deadlines are stored at 23:59:59Z of the due day (objection due_at keeps its exact time)" }
      - { name: status, type: enum, source: system, description: "PENDING | MET | MISSED | WAIVED" }
      - { name: resolved_at, type: datetime, source: system, default: null, description: "When the entry left PENDING" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: StateRegulatoryProfile
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /state-profiles/{profileId}/suspend"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "New RateFiling creation for this (product_id, state_code) is rejected with ERR_PROFILE_INACTIVE while SUSPENDED"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /state-profiles/{profileId}/reactivate"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: []

  - entity: RateIndication
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: IN_ACTUARIAL_REVIEW
        trigger: "POST /rate-indications/{indicationId}/submit-review"
        actor: ProductActuary
        preconditions: []
        side_effects: []
      - from: IN_ACTUARIAL_REVIEW
        to: APPROVED
        trigger: "POST /rate-indications/{indicationId}/approve"
        actor: ProductActuary
        preconditions:
          - "approver X-User-ID != prepared_by_user_id (segregation of duties; ERR_SOD_VIOLATION)"
        side_effects:
          - "approved_by_user_id = caller X-User-ID"
      - from: IN_ACTUARIAL_REVIEW
        to: DRAFT
        trigger: "POST /rate-indications/{indicationId}/return"
        actor: ProductActuary
        preconditions: []
        side_effects:
          - "review_round += 1"
        note: "Revision loop DRAFT -> IN_ACTUARIAL_REVIEW -> DRAFT is the cyclic shape."
      - from: APPROVED
        to: LOCKED
        trigger: "POST /rate-indications/{indicationId}/lock"
        actor: ProductActuary
        preconditions: []
        side_effects:
          - "Any other LOCKED indication with the same (product_id, scope_state_code) -> SUPERSEDED"
          - "If scope_state_code is null: Product.current_locked_indication_id = this id (increments Product.version by 1)"
      - from: LOCKED
        to: SUPERSEDED
        trigger: "system (a newer indication for the same (product_id, scope_state_code) locks)"
        actor: system
        preconditions: []
        side_effects:
          - "Filings still referencing this indication fail future submit with ERR_INDICATION_NOT_LOCKED"

  - entity: RateFiling
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, DISAPPROVED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: READY
        trigger: "POST /filings/{filingId}/mark-ready"
        actor: FilingAnalyst
        preconditions:
          - "At least one FilingComponent with component_type = RATE and status = FINAL when filing_type in {RATE_CHANGE, RATE_RULE_FORM}; otherwise at least one FINAL component of the matching type (ERR_COMPONENT_INCOMPLETE)"
        side_effects: []
      - from: READY
        to: SUBMITTED
        trigger: "POST /filings/{filingId}/submit"
        actor: ComplianceOfficer
        preconditions:
          - "Profile status = ACTIVE (ERR_PROFILE_INACTIVE)"
          - "Referenced indication status = LOCKED (ERR_INDICATION_NOT_LOCKED)"
          - "Every Deviation with filing_id = this filing has status in {PROPOSED, APPROVED} (ERR_DEVIATION_NOT_USABLE)"
          - "PRIOR_APPROVAL: proposed_effective_date >= submit date + min_effective_lead_days; FILE_AND_USE / USE_AND_FILE: proposed_effective_date >= submit date (ERR_EFFECTIVE_LEAD_VIOLATION)"
          - "proposed_change_pct <= profile.max_single_change_pct (ERR_CHANGE_EXCEEDS_MAX)"
        side_effects:
          - "submitted_at = now; filing_number assigned"
          - "deemer_date computed per deemer_date calculation"
          - "ComplianceCalendarEntry(DEEMER_DATE) created PENDING when deemer_date is not null"
          - "ComplianceCalendarEntry(EFFECTIVE_DATE, due_date = proposed_effective_date) created PENDING"
      - from: SUBMITTED
        to: UNDER_OBJECTION
        trigger: "system (first Objection created against this filing)"
        actor: system
        preconditions: []
        side_effects:
          - "open_objection_count recomputed"
      - from: UNDER_OBJECTION
        to: SUBMITTED
        trigger: "system (bubble-up: last objection leaves {RAISED, RESPONSE_DRAFTED, OVERDUE, REOPENED})"
        actor: system
        preconditions:
          - "No objection of this filing in RAISED | RESPONSE_DRAFTED | OVERDUE | REOPENED"
        side_effects:
          - "open_objection_count recomputed"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /filings/{filingId}/approve"
        actor: StateRegulator
        preconditions:
          - "open_objection_count = 0 — every objection is RESOLVED or WITHDRAWN (ERR_OPEN_OBJECTIONS)"
        side_effects:
          - "approved_at = now"
          - "actual_effective_date computed per effective_date_resolution"
          - "DEEMER_DATE calendar entry -> MET"
          - "EFFECTIVE_DATE calendar entry due_date := actual_effective_date (re-anchored from the proposal)"
      - from: SUBMITTED
        to: DEEMED_APPROVED
        trigger: "system (clock sweep: now >= deemer_date and open_objection_count = 0)"
        actor: system
        preconditions:
          - "deemer_date not null; now >= deemer_date"
          - "No objection in RAISED | RESPONSE_DRAFTED | RESPONSE_SUBMITTED | OVERDUE | REOPENED (deemer tolls while any objection is non-terminal)"
        side_effects:
          - "approved_at = deemer_date at 00:00:00Z"
          - "actual_effective_date computed per effective_date_resolution"
          - "DEEMER_DATE calendar entry -> MET"
          - "EFFECTIVE_DATE calendar entry due_date := actual_effective_date (re-anchored from the proposal)"
      - from: APPROVED
        to: EFFECTIVE
        trigger: "POST /filings/{filingId}/mark-effective"
        actor: ComplianceOfficer
        preconditions:
          - "now date >= actual_effective_date (ERR_EFFECTIVE_DATE_NOT_REACHED)"
          - "Ratebook: any other EFFECTIVE filing for the same (product_id, state_code) must have actual_effective_date strictly earlier than this filing's (ERR_RATEBOOK_OVERLAP)"
        side_effects:
          - "Incumbent EFFECTIVE filing (if any) -> SUPERSEDED with superseded_at_date = this actual_effective_date"
          - "EFFECTIVE_DATE calendar entry -> MET"
      - from: DEEMED_APPROVED
        to: EFFECTIVE
        trigger: "POST /filings/{filingId}/mark-effective"
        actor: ComplianceOfficer
        preconditions:
          - "now date >= actual_effective_date (ERR_EFFECTIVE_DATE_NOT_REACHED)"
          - "Ratebook overlap check identical to APPROVED -> EFFECTIVE (ERR_RATEBOOK_OVERLAP)"
        side_effects:
          - "Incumbent EFFECTIVE filing (if any) -> SUPERSEDED with superseded_at_date = this actual_effective_date"
          - "EFFECTIVE_DATE calendar entry -> MET"
      - from: SUBMITTED
        to: EFFECTIVE
        trigger: "POST /filings/{filingId}/mark-effective (USE_AND_FILE method only)"
        actor: ComplianceOfficer
        preconditions:
          - "profile.filing_method = USE_AND_FILE (otherwise ERR_INVALID_STATE)"
          - "now date >= proposed_effective_date (ERR_EFFECTIVE_DATE_NOT_REACHED)"
          - "Ratebook overlap check (ERR_RATEBOOK_OVERLAP)"
        side_effects:
          - "actual_effective_date = proposed_effective_date"
          - "Incumbent EFFECTIVE filing (if any) -> SUPERSEDED"
          - "EFFECTIVE_DATE calendar entry -> MET"
        note: "Use-and-file: rates may be used before regulator action."
      - from: EFFECTIVE
        to: SUPERSEDED
        trigger: "system (a newer filing for the same (product_id, state_code) marks effective with a strictly later actual_effective_date)"
        actor: system
        preconditions: []
        side_effects:
          - "superseded_at_date = successor's actual_effective_date"
          - "APPROVED deviations of this filing -> SUPERSEDED"
          - "FINAL components of this filing -> SUPERSEDED"
      - from: SUBMITTED
        to: DISAPPROVED
        trigger: "POST /filings/{filingId}/disapprove"
        actor: StateRegulator
        preconditions: []
        side_effects:
          - "DEEMER_DATE / EFFECTIVE_DATE calendar entries -> WAIVED"
      - from: UNDER_OBJECTION
        to: DISAPPROVED
        trigger: "POST /filings/{filingId}/disapprove"
        actor: StateRegulator
        preconditions: []
        side_effects:
          - "All non-terminal objections -> WITHDRAWN with resolved_at = now"
          - "Their OBJECTION_RESPONSE_DUE calendar entries -> WAIVED"
          - "DEEMER_DATE / EFFECTIVE_DATE calendar entries -> WAIVED"
      - from: EFFECTIVE
        to: DISAPPROVED
        trigger: "POST /filings/{filingId}/disapprove (post-effective disapproval)"
        actor: StateRegulator
        preconditions:
          - "profile.filing_method in {FILE_AND_USE, USE_AND_FILE} (PRIOR_APPROVAL -> ERR_INVALID_STATE)"
          - "now date <= actual_effective_date + disapproval_window_days (ERR_DISAPPROVAL_WINDOW_CLOSED)"
          - "No ImplementationWave of this filing in COMPLETED (ERR_WAVE_NOT_REVERSIBLE)"
        side_effects:
          - "Cascade hop 1: every ImplementationWave of this filing in RELEASED -> REVERSED; SCHEDULED -> CANCELLED"
          - "Cascade hop 2: each reversed wave restores its policies: RATED -> PENDING (premium computation fields nulled, wave_id nulled); NOTICE_SENT / COMPLETED -> RESCINDED with current_premium_cents restored to baseline_premium_cents"
          - "Cascade hop 3: each restored policy's PENDING RENEWAL_NOTICE_DUE calendar entries -> WAIVED; each reversed wave's WAVE_WINDOW entry -> WAIVED; wave.rated_policy_count recomputed to 0"
          - "APPROVED deviations of this filing -> SUPERSEDED"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /filings/{filingId}/withdraw"
        actor: FilingAnalyst | ComplianceOfficer
        preconditions: []
        side_effects:
          - "DRAFT/FINAL components -> WITHDRAWN; PROPOSED deviations -> WITHDRAWN"
      - from: READY
        to: WITHDRAWN
        trigger: "POST /filings/{filingId}/withdraw"
        actor: FilingAnalyst | ComplianceOfficer
        preconditions: []
        side_effects:
          - "DRAFT/FINAL components -> WITHDRAWN; PROPOSED deviations -> WITHDRAWN"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /filings/{filingId}/withdraw"
        actor: FilingAnalyst | ComplianceOfficer
        preconditions: []
        side_effects:
          - "Components -> WITHDRAWN; PROPOSED deviations -> WITHDRAWN; APPROVED deviations -> SUPERSEDED"
          - "DEEMER_DATE / EFFECTIVE_DATE calendar entries -> WAIVED"
      - from: APPROVED
        to: WITHDRAWN
        trigger: "POST /filings/{filingId}/withdraw (insurer elects not to implement)"
        actor: FilingAnalyst | ComplianceOfficer
        preconditions: []
        side_effects:
          - "Components -> WITHDRAWN; APPROVED deviations -> SUPERSEDED; PROPOSED deviations -> WITHDRAWN"
          - "EFFECTIVE_DATE calendar entry -> WAIVED"
      - from: DEEMED_APPROVED
        to: WITHDRAWN
        trigger: "POST /filings/{filingId}/withdraw"
        actor: FilingAnalyst | ComplianceOfficer
        preconditions: []
        side_effects:
          - "Components -> WITHDRAWN; APPROVED deviations -> SUPERSEDED; PROPOSED deviations -> WITHDRAWN"
          - "EFFECTIVE_DATE calendar entry -> WAIVED"
      - from: UNDER_OBJECTION
        to: WITHDRAWN
        trigger: "POST /filings/{filingId}/withdraw"
        actor: FilingAnalyst | ComplianceOfficer
        preconditions: []
        side_effects:
          - "Components -> WITHDRAWN; PROPOSED deviations -> WITHDRAWN; APPROVED deviations -> SUPERSEDED"
          - "Non-terminal objections -> WITHDRAWN; their calendar entries -> WAIVED"
          - "DEEMER_DATE / EFFECTIVE_DATE calendar entries -> WAIVED"

  - entity: FilingComponent
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: FINAL
        trigger: "POST /components/{componentId}/finalize"
        actor: FilingAnalyst
        preconditions:
          - "Parent filing status = DRAFT (ERR_INVALID_STATE)"
        side_effects: []
      - from: FINAL
        to: WITHDRAWN
        trigger: "system (parent filing withdrawn)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DRAFT
        to: WITHDRAWN
        trigger: "system (parent filing withdrawn)"
        actor: system
        preconditions: []
        side_effects: []
      - from: FINAL
        to: SUPERSEDED
        trigger: "system (parent filing superseded)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Deviation
    initial_state: PROPOSED
    terminal_states: [REJECTED, WITHDRAWN, SUPERSEDED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /deviations/{deviationId}/approve"
        actor: StateRegulator
        preconditions:
          - "Parent filing status in {SUBMITTED, UNDER_OBJECTION} (ERR_INVALID_STATE)"
        side_effects: []
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /deviations/{deviationId}/reject"
        actor: StateRegulator
        preconditions:
          - "Parent filing status in {SUBMITTED, UNDER_OBJECTION} (ERR_INVALID_STATE)"
        side_effects: []
      - from: PROPOSED
        to: WITHDRAWN
        trigger: "POST /deviations/{deviationId}/withdraw or system (parent filing withdrawn)"
        actor: FilingAnalyst | system
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system (parent filing superseded, withdrawn, or disapproved)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Objection
    initial_state: RAISED
    terminal_states: [RESOLVED, WITHDRAWN]
    transitions:
      - from: RAISED
        to: RESPONSE_DRAFTED
        trigger: "POST /objections/{objectionId}/responses"
        actor: FilingAnalyst
        preconditions:
          - "OCC: expected_objection_version == current Objection.version (ERR_STALE_VERSION)"
        side_effects:
          - "ObjectionResponse created in DRAFT; increments Objection.version by 1"
      - from: REOPENED
        to: RESPONSE_DRAFTED
        trigger: "POST /objections/{objectionId}/responses"
        actor: FilingAnalyst
        preconditions:
          - "OCC: expected_objection_version == current Objection.version (ERR_STALE_VERSION)"
        side_effects:
          - "ObjectionResponse created in DRAFT; increments Objection.version by 1"
      - from: OVERDUE
        to: RESPONSE_DRAFTED
        trigger: "POST /objections/{objectionId}/responses"
        actor: FilingAnalyst
        preconditions:
          - "OCC: expected_objection_version == current Objection.version (ERR_STALE_VERSION)"
        side_effects:
          - "ObjectionResponse created in DRAFT; late_breach remains true; increments Objection.version by 1"
      - from: RESPONSE_DRAFTED
        to: RESPONSE_DRAFTED
        trigger: "POST /objections/{objectionId}/responses (re-draft while a draft is pending)"
        actor: FilingAnalyst
        preconditions:
          - "OCC: expected_objection_version == current Objection.version (ERR_STALE_VERSION)"
        side_effects:
          - "New ObjectionResponse created in DRAFT; the prior DRAFT response -> SUPERSEDED; increments Objection.version by 1"
      - from: RAISED
        to: OVERDUE
        trigger: "system (clock sweep: now > due_at)"
        actor: system
        preconditions: []
        side_effects:
          - "late_breach = true; OBJECTION_RESPONSE_DUE calendar entry -> MISSED"
      - from: RESPONSE_DRAFTED
        to: OVERDUE
        trigger: "system (clock sweep: now > due_at)"
        actor: system
        preconditions: []
        side_effects:
          - "late_breach = true; OBJECTION_RESPONSE_DUE calendar entry -> MISSED"
      - from: RESPONSE_DRAFTED
        to: RESPONSE_SUBMITTED
        trigger: "POST /responses/{responseId}/submit (submits the DRAFT response of this objection)"
        actor: ComplianceOfficer
        preconditions:
          - "The response being submitted is the current DRAFT response of this objection"
        side_effects:
          - "response.status -> SUBMITTED, submitted_at = now"
          - "If now > due_at: late_breach = true; else the OBJECTION_RESPONSE_DUE calendar entry -> MET"
      - from: RESPONSE_SUBMITTED
        to: RESOLVED
        trigger: "POST /objections/{objectionId}/resolve"
        actor: StateRegulator
        preconditions: []
        side_effects:
          - "resolved_at = now; filing open_objection_count recomputed (bubble-up may return filing to SUBMITTED)"
      - from: RESPONSE_SUBMITTED
        to: REOPENED
        trigger: "POST /objections/{objectionId}/reopen"
        actor: StateRegulator
        preconditions: []
        side_effects:
          - "reopen_count += 1; due_at = now + objection_response_sla_days; new OBJECTION_RESPONSE_DUE calendar entry created PENDING"
          - "Filing -> UNDER_OBJECTION; open_objection_count recomputed"
        note: "Regulator may reopen repeatedly; the objection lifecycle is cyclic."
      - from: RAISED
        to: WITHDRAWN
        trigger: "POST /objections/{objectionId}/withdraw or system (filing withdrawn/disapproved)"
        actor: StateRegulator | system
        preconditions: []
        side_effects:
          - "resolved_at = now; OBJECTION_RESPONSE_DUE entry -> WAIVED; filing open_objection_count recomputed"
      - from: RESPONSE_DRAFTED
        to: WITHDRAWN
        trigger: "POST /objections/{objectionId}/withdraw or system (filing withdrawn/disapproved)"
        actor: StateRegulator | system
        preconditions: []
        side_effects:
          - "resolved_at = now; DRAFT response -> SUPERSEDED; OBJECTION_RESPONSE_DUE entry -> WAIVED; filing open_objection_count recomputed"
      - from: RESPONSE_SUBMITTED
        to: WITHDRAWN
        trigger: "POST /objections/{objectionId}/withdraw or system (filing withdrawn/disapproved)"
        actor: StateRegulator | system
        preconditions: []
        side_effects:
          - "resolved_at = now; OBJECTION_RESPONSE_DUE entry -> WAIVED; filing open_objection_count recomputed"
      - from: OVERDUE
        to: WITHDRAWN
        trigger: "POST /objections/{objectionId}/withdraw or system (filing withdrawn/disapproved)"
        actor: StateRegulator | system
        preconditions: []
        side_effects:
          - "resolved_at = now; filing open_objection_count recomputed"
      - from: REOPENED
        to: WITHDRAWN
        trigger: "POST /objections/{objectionId}/withdraw or system (filing withdrawn/disapproved)"
        actor: StateRegulator | system
        preconditions: []
        side_effects:
          - "resolved_at = now; OBJECTION_RESPONSE_DUE entry -> WAIVED; filing open_objection_count recomputed"

  - entity: ObjectionResponse
    initial_state: DRAFT
    terminal_states: [SUBMITTED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /responses/{responseId}/submit"
        actor: ComplianceOfficer
        preconditions:
          - "Parent objection status = RESPONSE_DRAFTED (ERR_INVALID_STATE)"
        side_effects:
          - "submitted_at = now; objection -> RESPONSE_SUBMITTED; on-time evaluation vs due_at"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system (a newer response drafted on the same objection, or objection withdrawn)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ImplementationWave
    initial_state: SCHEDULED
    terminal_states: [REVERSED, CANCELLED, COMPLETED]
    transitions:
      - from: SCHEDULED
        to: RELEASED
        trigger: "POST /waves/{waveId}/release"
        actor: ImplementationLead
        preconditions:
          - "Parent filing status = EFFECTIVE (ERR_INVALID_STATE)"
        side_effects:
          - "Policy assignment: RenewalPolicy with status PENDING, same product_id + state_code, renewal_effective_date in [wave_start_date, wave_end_date] inclusive becomes in-scope"
          - "In-scope policy with release date > notice_due_date: stays PENDING, exclusion_reason = LATE_NOTICE_BY_CONSTRUCTION, excluded_late_notice_count += 1"
          - "Each remaining in-scope policy -> RATED: baseline snapshot, renewal_re_rate computed, wave_id set, RENEWAL_NOTICE_DUE calendar entry created PENDING (due = notice_due_date at 23:59:59Z)"
          - "wave_balance_factor computed over the RATED set and applied; final_premium_cents set per policy"
          - "rated_policy_count, target_book_delta_cents, final_book_delta_cents recomputed"
      - from: RELEASED
        to: REVERSED
        trigger: "POST /waves/{waveId}/reverse or system (post-effective disapproval cascade)"
        actor: ImplementationLead | system
        preconditions:
          - "Manual reverse: no precondition beyond RELEASED (COMPLETED policies are rescinded, not blocking)"
        side_effects:
          - "RATED policies -> PENDING: wave_id, baseline, raw/final premium fields nulled"
          - "NOTICE_SENT | COMPLETED policies -> RESCINDED: current_premium_cents restored to baseline_premium_cents; computation fields nulled; wave_id retained for audit"
          - "PENDING RENEWAL_NOTICE_DUE entries of affected policies -> WAIVED; WAVE_WINDOW entry -> WAIVED"
          - "rated_policy_count = 0"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /waves/{waveId}/cancel"
        actor: ImplementationLead
        preconditions: []
        side_effects:
          - "WAVE_WINDOW calendar entry -> WAIVED"
      - from: RELEASED
        to: COMPLETED
        trigger: "system (clock sweep: now date > wave_end_date and every assigned policy is COMPLETED or RESCINDED)"
        actor: system
        preconditions:
          - "Zero policies of this wave in RATED | NOTICE_SENT"
        side_effects:
          - "WAVE_WINDOW calendar entry -> MET"

  - entity: RenewalPolicy
    initial_state: PENDING
    terminal_states: [RESCINDED]
    transitions:
      - from: PENDING
        to: RATED
        trigger: "system (wave release assigns and rates the policy atomically)"
        actor: system
        preconditions:
          - "Policy product_id + state_code match wave; renewal_effective_date within [wave_start_date, wave_end_date] inclusive"
          - "release date <= notice_due_date (else left PENDING with exclusion_reason = LATE_NOTICE_BY_CONSTRUCTION)"
        side_effects:
          - "baseline_premium_cents = current_premium_cents; renewal_re_rate computed; wave_id set"
      - from: RATED
        to: NOTICE_SENT
        trigger: "POST /policies/{policyId}/send-notice"
        actor: ImplementationLead
        preconditions:
          - "now date <= notice_due_date (ERR_NOTICE_DEADLINE_PASSED)"
        side_effects:
          - "notice_sent_at = now; RENEWAL_NOTICE_DUE calendar entry -> MET"
      - from: NOTICE_SENT
        to: COMPLETED
        trigger: "POST /policies/{policyId}/complete-renewal"
        actor: ImplementationLead
        preconditions:
          - "now date >= renewal_effective_date (ERR_EFFECTIVE_DATE_NOT_REACHED)"
        side_effects:
          - "current_premium_cents = final_premium_cents (new rate binds)"
      - from: RATED
        to: PENDING
        trigger: "system (clock sweep: now date > renewal_effective_date and notice never sent — the renewal passed unactionable)"
        actor: system
        preconditions: []
        side_effects:
          - "wave_id, baseline, raw/final premium fields nulled; exclusion_reason = LATE_NOTICE_SWEEP"
          - "RENEWAL_NOTICE_DUE entry -> MISSED; wave rated_policy_count recomputed"
      - from: RATED
        to: PENDING
        trigger: "system (wave reversal)"
        actor: system
        preconditions: []
        side_effects:
          - "wave_id, baseline, raw/final premium fields nulled"
      - from: NOTICE_SENT
        to: RESCINDED
        trigger: "system (wave reversal / post-effective disapproval)"
        actor: system
        preconditions: []
        side_effects:
          - "current_premium_cents restored to baseline_premium_cents; computation fields nulled; wave_id retained"
      - from: COMPLETED
        to: RESCINDED
        trigger: "system (wave reversal / post-effective disapproval)"
        actor: system
        preconditions: []
        side_effects:
          - "current_premium_cents restored to baseline_premium_cents; computation fields nulled; wave_id retained"
        note: "Rescission after binding — the compensating action that restores the baseline premium ledger."

  - entity: ComplianceCalendarEntry
    initial_state: PENDING
    terminal_states: [MET, MISSED, WAIVED]
    transitions:
      - from: PENDING
        to: MET
        trigger: "system (obligation satisfied on time: response submitted <= due_at, notice sent <= notice_due_date, filing approved/deemed, mark-effective done, wave completed)"
        actor: system
        preconditions: []
        side_effects:
          - "resolved_at = now"
      - from: PENDING
        to: MISSED
        trigger: "system (clock sweep: now > due_date and obligation unmet)"
        actor: system
        preconditions: []
        side_effects:
          - "resolved_at = now"
      - from: PENDING
        to: WAIVED
        trigger: "POST /calendar-entries/{entryId}/waive or system (parent filing withdrawn/disapproved, wave cancelled/reversed, objection withdrawn)"
        actor: ComplianceOfficer | system
        preconditions: []
        side_effects:
          - "resolved_at = now"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC)
# =============================================================================
concurrency_rules:
  - rule_id: indication-create-stale-product
    parent_entity: Product
    write_endpoint: "POST /rate-indications"
    occ_field: expected_product_version
    description: |
      Creating a RateIndication against a Product whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another writer has just created an indication or locked one
      (both legitimately advance the product's book-of-record) and the
      current writer's view of the product is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: response-draft-stale-objection
    parent_entity: Objection
    write_endpoint: "POST /objections/{objectionId}/responses"
    occ_field: expected_objection_version
    description: |
      Drafting a response against an Objection whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another analyst has just drafted a response (which supersedes
      the prior draft position) and the current writer's view of the
      objection is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: indicated_rate_change
    trigger: "POST /rate-indications (both variants computed at creation; indicated_change_pct stores the chosen variant, alternate_change_pct the other)"
    algorithm: weighted_scoring
    formula: |
      credibility_z = min(1, sqrt(exposure_units / FULL_CREDIBILITY_EXPOSURE))
      ultimate_loss_cents = incurred_loss_cents * LOSS_DEVELOPMENT_FACTOR
      experience_indication = ultimate_loss_cents / (earned_premium_cents * TARGET_LOSS_RATIO) - 1
      countrywide_trended = countrywide_change_pct * (1 + trend_factor)
      INCURRED_CREDIBILITY result = credibility_z * experience_indication + (1 - credibility_z) * countrywide_trended
      PAID_PURE result = (paid_loss_cents / earned_premium_cents) / TARGET_LOSS_RATIO - 1
        (no credibility blend, no trend, no loss development)
    input_set: "The creating request's experience fields; no cross-entity inputs"
    constants:
      FULL_CREDIBILITY_EXPOSURE: 1082
      TARGET_LOSS_RATIO: 0.68
      LOSS_DEVELOPMENT_FACTOR: 1.12
    precision: "results stored at 4 decimal places, round_half_up; intermediate values unrounded"
    variants:
      - name: INCURRED_CREDIBILITY
        when: "variant = INCURRED_CREDIBILITY"
        difference: "Developed incurred losses blended with trended countrywide indication by credibility"
      - name: PAID_PURE
        when: "variant = PAID_PURE"
        difference: "Raw paid-loss ratio against target loss ratio; ignores credibility, trend, and development"

  - name: effective_date_resolution
    trigger: "RateFiling APPROVED or DEEMED_APPROVED; USE_AND_FILE mark-effective"
    algorithm: threshold
    formula: |
      PRIOR_APPROVAL: actual_effective_date = max(proposed_effective_date, date(approved_at) + min_effective_lead_days)
      FILE_AND_USE:   actual_effective_date = proposed_effective_date
      USE_AND_FILE:   actual_effective_date = proposed_effective_date (effectiveness precedes approval)
      For DEEMED_APPROVED, approved_at is deemed to be deemer_date at 00:00:00Z.
    input_set: "The filing and its resolved profile"
    constants: {}
    precision: "date granularity; comparison is inclusive (>=)"
    variants:
      - name: PRIOR_APPROVAL
        when: "profile.filing_method = PRIOR_APPROVAL"
        difference: "Approval date + lead time can push the effective date past the proposal"
      - name: FILE_AND_USE
        when: "profile.filing_method in {FILE_AND_USE, USE_AND_FILE}"
        difference: "Effective date is exactly the proposed date regardless of approval timing"

  - name: objection_response_deadline
    trigger: "Objection creation, objection reopen, response submit, clock sweep"
    algorithm: threshold
    formula: |
      due_at = raised_at + objection_response_sla_days * 86400 seconds (on reopen: now + sla)
      A response is on time iff submitted_at <= due_at (equality is on time).
      Clock sweep: objection in {RAISED, RESPONSE_DRAFTED} with now > due_at -> OVERDUE.
    input_set: "The objection and its filing's profile"
    constants: {}
    precision: "second granularity; deadline inclusive"

  - name: deemer_date
    trigger: "RateFiling submit; evaluated on every clock sweep"
    algorithm: threshold
    formula: |
      deemer_date = date(submitted_at) + deemer_days, only for PRIOR_APPROVAL profiles with deemer_days > 0
      Deemed approval fires when now >= deemer_date (at 00:00:00Z of that date) AND
      no objection is in {RAISED, RESPONSE_DRAFTED, RESPONSE_SUBMITTED, OVERDUE, REOPENED}
      (the deemer tolls while any objection is non-terminal).
    input_set: "SUBMITTED filings and their objections"
    constants: {}
    precision: "date granularity; fires at equality (>=)"

  - name: renewal_re_rate
    trigger: "ImplementationWave release, per in-scope policy"
    algorithm: tiered_pricing
    formula: |
      raw_change_pct = round4_half_up(approved_change_pct * class_rel_factor)
      raw_new_premium_cents = round_half_up_to_int(current_premium_cents * (1 + raw_change_pct))
      if raw_change_pct > cap_pct:    capped_premium = round_half_up_to_int(current_premium_cents * (1 + cap_pct));   was_capped = true
      elif raw_change_pct < -cap_pct: capped_premium = round_half_up_to_int(current_premium_cents * (1 - cap_pct));   was_capped = true
      else: capped_premium = raw_new_premium_cents; was_capped = false
      Rounding order is pinned: every per-policy premium is rounded to whole cents
      BEFORE any book-level aggregation; never aggregate-then-round.
      Capping triggers only on strict inequality: raw_change_pct == cap_pct is NOT capped.
    input_set: "Policies assigned RATED by the releasing wave"
    constants: {}
    precision: "raw_change_pct at 4 decimal places round_half_up; premiums integer cents round_half_up"

  - name: wave_balance_factor
    trigger: "ImplementationWave release, after all per-policy caps are applied"
    algorithm: waterfall_allocation
    formula: |
      Pinned evaluation order (the circular-looking dependency is resolved sequentially):
      (1) per-policy capped premiums from renewal_re_rate
      (2) target_book_delta_cents = round_half_up_to_int(approved_change_pct * sum(baseline_premium_cents over RATED))
      (3) capped_book_total = sum(baseline) + sum(capped_premium - baseline)
      (4) balance_factor = (sum(baseline) + target_book_delta_cents) / capped_book_total, stored at 8 decimal places round_half_up
      (5) final_premium_cents(policy) = round_half_up_to_int(capped_premium * balance_factor)
      (6) residual = target_book_delta_cents - sum(final_premium_cents - baseline_premium_cents)
          allocate the whole signed residual to the single policy with the largest
          baseline_premium_cents (tie-break: created_at ASC): final_premium_cents += residual
      Invariant after (6): sum(final_premium_cents - baseline_premium_cents) == target_book_delta_cents exactly.
      Empty in-scope set (zero policies rated): balance_factor = null, target_book_delta_cents = 0,
      final_book_delta_cents = 0; the release still succeeds.
    input_set: "The wave's RATED policies at release time"
    constants: {}
    precision: "balance_factor 8 decimal places round_half_up; premiums integer cents round_half_up"

  - name: renewal_notice_deadline
    trigger: "Wave release (per policy), send-notice, clock sweep"
    algorithm: threshold
    formula: |
      notice_due_date = renewal_effective_date - renewal_notice_days
      send-notice is timely iff date(now) <= notice_due_date (equality is timely).
      At release: if release date > notice_due_date the policy is excluded (LATE_NOTICE_BY_CONSTRUCTION).
      Clock sweep: RATED policy with date(now) > notice_due_date -> bounced to PENDING (LATE_NOTICE_SWEEP).
    input_set: "Policy, wave, and profile"
    constants: {}
    precision: "date granularity; deadline inclusive"

  - name: wave_window_gap
    trigger: "POST /waves"
    algorithm: interval_merge
    formula: |
      For the same (product_id, state_code), considering existing waves with status
      in {SCHEDULED, RELEASED, COMPLETED} (CANCELLED and REVERSED are excluded):
      windows are [wave_start_date, wave_end_date] INCLUSIVE on both ends, and any
      pair of windows must satisfy a strict separation: for each existing wave,
      new_start > existing_end + MIN_WAVE_GAP_DAYS  OR  existing_start > new_end + MIN_WAVE_GAP_DAYS.
      A gap of exactly MIN_WAVE_GAP_DAYS days is a violation; MIN_WAVE_GAP_DAYS + 1 is allowed.
    input_set: "Waves of the same product+state"
    constants:
      MIN_WAVE_GAP_DAYS: 7
    precision: "date granularity"

  - name: ratebook_supersede
    trigger: "POST /filings/{filingId}/mark-effective"
    algorithm: interval_merge
    formula: |
      The rate book for (product_id, state_code) is a chain of half-open intervals
      [actual_effective_date, superseded_at_date). A new filing may mark effective
      only if no EFFECTIVE filing for the same (product_id, state_code) has
      actual_effective_date >= the new filing's actual_effective_date.
      Equality is an overlap (ERR_RATEBOOK_OVERLAP); a strictly later date succeeds
      and supersedes the incumbent (incumbent.superseded_at_date = new actual_effective_date).
      Same-day effectiveness is never allowed for two filings of one rate book.
    input_set: "Filings of the same product+state in EFFECTIVE"
    constants: {}
    precision: "date granularity; strictly-greater comparison"

  - name: disruption_summary
    trigger: "GET /waves/{waveId}/disruption-analysis"
    algorithm: aggregation
    formula: |
      Over the wave's policies with status in {RATED, NOTICE_SENT, COMPLETED}:
        total_policies = count
        capped_policy_count = count where was_capped = true
        max_raw_change_pct = max(raw_change_pct); min_raw_change_pct = min(raw_change_pct)
        book_avg_raw_change_pct = round4_half_up(sum(raw_new_premium_cents - baseline) / sum(baseline))
        book_avg_final_change_pct = round4_half_up(sum(final_premium_cents - baseline) / sum(baseline))
      Plus wave fields balance_factor, target_book_delta_cents, final_book_delta_cents.
      Empty wave (zero rated policies): all counts 0, averages and extrema null.
    input_set: "Wave's policies in {RATED, NOTICE_SENT, COMPLETED}"
    constants: {}
    precision: "percentages 4 decimal places round_half_up; deltas integer cents"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Caller role must be listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Request body must be well-formed: required fields present, no unknown fields, types correct, enum members valid, amounts positive, dates ISO"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all mutating endpoints"

  - priority: 5
    category: existence
    check: "Path ids and body FK ids (product_id, indication_id, filing_id, objection_id, etc.) must resolve, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 4
    category: state
    check: "OCC: expected_<parent>_version must equal the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /rate-indications; POST /objections/{objectionId}/responses"

  - priority: 6
    category: state
    check: "Target resource must be in a state from which the requested transition exists"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 7
    category: business_safety
    check: "Segregation of duties: indication approver X-User-ID must differ from prepared_by_user_id"
    error_id: ERR_SOD_VIOLATION
    http_status: 403
    applies_to: "POST /rate-indications/{indicationId}/approve"

  - priority: 8
    category: business_referential
    check: "Referenced configuration must be usable: profile ACTIVE (ERR_PROFILE_INACTIVE), indication LOCKED and not SUPERSEDED (ERR_INDICATION_NOT_LOCKED), attached deviations in {PROPOSED, APPROVED} (ERR_DEVIATION_NOT_USABLE)"
    error_id: "ERR_PROFILE_INACTIVE / ERR_INDICATION_NOT_LOCKED / ERR_DEVIATION_NOT_USABLE"
    http_status: 409
    applies_to: "POST /filings; POST /filings/{filingId}/submit; POST /waves"

  - priority: 9
    category: business_temporal
    check: "Date arithmetic must hold: proposed effective date lead time (ERR_EFFECTIVE_LEAD_VIOLATION), mark-effective reached (ERR_EFFECTIVE_DATE_NOT_REACHED), disapproval window open (ERR_DISAPPROVAL_WINDOW_CLOSED), notice deadline (ERR_NOTICE_DEADLINE_PASSED), wave window end >= start (ERR_WAVE_WINDOW_INVALID)"
    error_id: "ERR_EFFECTIVE_LEAD_VIOLATION / ERR_EFFECTIVE_DATE_NOT_REACHED / ERR_DISAPPROVAL_WINDOW_CLOSED / ERR_NOTICE_DEADLINE_PASSED / ERR_WAVE_WINDOW_INVALID"
    http_status: "422 for malformed windows/lead, 409 for clock-driven conflicts"
    applies_to: "POST /filings/{filingId}/submit; POST /filings/{filingId}/mark-effective; POST /filings/{filingId}/disapprove; POST /policies/{policyId}/send-notice; POST /policies/{policyId}/complete-renewal; POST /waves"

  - priority: 10
    category: business_constraint
    check: "Structural uniqueness and overlap: one profile per (product_id, state_code) (ERR_DUPLICATE_PROFILE), one filing in DRAFT | READY | SUBMITTED | UNDER_OBJECTION | APPROVED | DEEMED_APPROVED per (product_id, state_code) (ERR_DUPLICATE_OPEN_FILING), mark-ready component completeness (ERR_COMPONENT_INCOMPLETE), zero objections in RAISED | RESPONSE_DRAFTED | RESPONSE_SUBMITTED | OVERDUE | REOPENED at approve (ERR_OPEN_OBJECTIONS), ratebook half-open overlap (ERR_RATEBOOK_OVERLAP), wave window gap (ERR_WAVE_GAP_VIOLATION)"
    error_id: "ERR_DUPLICATE_PROFILE / ERR_DUPLICATE_OPEN_FILING / ERR_COMPONENT_INCOMPLETE / ERR_OPEN_OBJECTIONS / ERR_RATEBOOK_OVERLAP / ERR_WAVE_GAP_VIOLATION"
    http_status: 409
    applies_to: "POST /state-profiles; POST /filings; POST /filings/{filingId}/mark-ready; POST /filings/{filingId}/approve; POST /filings/{filingId}/mark-effective; POST /waves"

  - priority: 11
    category: business_fiscal
    check: "Monetary ceilings: proposed_change_pct <= profile.max_single_change_pct (ERR_CHANGE_EXCEEDS_MAX); wave cap_pct <= profile.max_single_change_pct (ERR_CAP_ABOVE_REGULATORY_MAX)"
    error_id: "ERR_CHANGE_EXCEEDS_MAX / ERR_CAP_ABOVE_REGULATORY_MAX"
    http_status: 422
    applies_to: "POST /filings; POST /filings/{filingId}/submit; POST /waves"

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- logical clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Startup default is exactly 2026-08-01T00:00:00Z; the clock never reads wall-clock time. Setting the clock triggers the system sweep: overdue objections, deemer approvals, calendar MISSED evaluation, late-notice policy bounce, wave completion."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects:
      - "Clock sweep per state machines: Objection OVERDUE transitions, RateFiling DEEMED_APPROVED, ComplianceCalendarEntry MISSED, RenewalPolicy LATE_NOTICE_SWEEP bounce, ImplementationWave COMPLETED"

  # --- Product ---
  - method: POST
    path: "/products"
    description: "Create a Product"
    roles: [ProductActuary]
    code: 201
    input: [product_code, name]
    output: Product
    side_effects: ["version starts at 1"]

  - method: GET
    path: "/products/{productId}"
    description: "Get a Product"
    roles: [ProductActuary, FilingAnalyst, ComplianceOfficer, StateRegulator, ImplementationLead, PlatformAdmin]
    code: 200
    input: []
    output: Product
    side_effects: []

  # --- StateRegulatoryProfile ---
