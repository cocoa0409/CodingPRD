        distinguishing_aspect: |
          Half-open [start,end) interval semantics on EquipmentAsset: an overlapping window is rejected with
          ERR_EQUIPMENT_WINDOW_CONFLICT, but an adjacent window touching at the endpoint is ALLOWED — distinct
          interval geometry (no buffer) from irrigation's closed+buffer rule on a different resource.
        test_recipe:
          setup:
            - "An EquipmentAsset with a RECORDED usage 08:00-10:00 on a GROWING plan; attempt an overlapping 09:00-11:00 usage."
          setup_api_calls:
            - call: "POST /parcels"
              payload: { name: "EQF", acreage: 100, soil_type: "LOAM" }
              as: FarmManager
              captures: { pid: $.data.id, pv: $.data.version }
            - call: "POST /input-products"
              payload: { name: "Seed E", category: "SEED", unit: "SEED_UNIT", unit_cost: 0.5 }
              as: FarmManager
              captures: { sp: $.data.id }
            - call: "POST /input-lots"
              payload: { input_product_id: "${sp}", lot_code: "L", quantity_received: 500 }
              as: FarmManager
              captures: { sl: $.data.id }
            - call: "POST /crop-plans"
              payload: { parcel_id: "${pid}", crop: "CORN", season_year: 2026, planned_acres: 100, budget_input_cost: 1, budget_labor_cost: 1, budget_equipment_cost: 1 }
              as: Agronomist
              captures: { pl: $.data.id }
            - call: "POST /crop-plans/${pl}/approve"
              payload: { expected_parcel_version: "${pv}" }
              as: FarmManager
            - call: "POST /planting-events"
              payload: { crop_plan_id: "${pl}", input_lot_id: "${sl}", acres_planted: 100, seed_rate_per_acre: 1 }
              as: Agronomist
            - call: "POST /crop-plans/${pl}/begin-growing"
              payload: {}
              as: Agronomist
            - call: "POST /equipment-assets"
              payload: { name: "Tractor A", kind: "TRACTOR", hourly_cost: 50 }
              as: FarmManager
              captures: { eq: $.data.id }
            - call: "POST /equipment-usages"
              payload: { equipment_asset_id: "${eq}", crop_plan_id: "${pl}", window_start: "2026-06-15T08:00:00Z", window_end: "2026-06-15T10:00:00Z" }
              as: Agronomist
            - call: "POST /equipment-usages"
              payload: { equipment_asset_id: "${eq}", crop_plan_id: "${pl}", window_start: "2026-06-15T10:00:00Z", window_end: "2026-06-15T12:00:00Z" }
              as: Agronomist
              captures: { adj: $.data.id }
          trigger:
            - call: "POST /equipment-usages"
              payload: { equipment_asset_id: "${eq}", crop_plan_id: "${pl}", window_start: "2026-06-15T09:00:00Z", window_end: "2026-06-15T11:00:00Z" }
              as: Agronomist
              captures: { err: $.data.error_id }
          assert:
            - "EquipmentUsage.${adj}.status == RECORDED"
            - "trigger response error_id == ERR_EQUIPMENT_WINDOW_CONFLICT (409)"

      - name: irrigation_closed_buffer_overlap_rejected_within_buffer
        grounds:
          - calculations.irrigation_overlap
          - entities.IrrigationEvent.fields.window_start
          - entities.IrrigationEvent.fields.window_end
          - validations[priority=8]
        distinguishing_aspect: |
          Closed [start,end] + 6h-buffer interval semantics on Parcel irrigation: a new event starting only
          3h after a prior event's end is rejected ERR_IRRIGATION_WINDOW_CONFLICT (within buffer), whereas the
          same gap on equipment would be allowed — a strictly different interval arithmetic on a different resource.
        test_recipe:
          setup:
            - "A SCHEDULED irrigation 08:00-10:00 on a parcel; a new event 13:00-15:00 (only 3h after prior end, inside 6h buffer)."
          setup_api_calls:
            - call: "POST /parcels"
              payload: { name: "IRF", acreage: 100, soil_type: "SAND" }
              as: FarmManager
              captures: { pid: $.data.id, pv: $.data.version }
            - call: "POST /irrigation-events"
              payload: { parcel_id: "${pid}", window_start: "2026-06-15T08:00:00Z", window_end: "2026-06-15T10:00:00Z", inches_applied: 1 }
              as: Agronomist
              captures: { ir1: $.data.id }
          trigger:
            - call: "POST /irrigation-events"
              payload: { parcel_id: "${pid}", window_start: "2026-06-15T13:00:00Z", window_end: "2026-06-15T15:00:00Z", inches_applied: 1 }
              as: Agronomist
              captures: { err: $.data.error_id }
          assert:
            - "IrrigationEvent.${ir1}.status == SCHEDULED"
            - "trigger response error_id == ERR_IRRIGATION_WINDOW_CONFLICT (409)"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: void_planting_restores_seed_inventory_conserved
        grounds:
          - state_machines.PlantingEvent.RECORDED_to_VOIDED
          - calculations.input_inventory_debit
          - entities.InputLot.fields.quantity_remaining
        distinguishing_aspect: |
          Conserved quantity = total seed units across lots of a product. PlantingEvent create debits then
          void restores: SUM(InputLot.quantity_remaining for the product) returns to its pre-planting value
          (500), leaving zero drift in the seed-inventory quantity.
        test_recipe:
          setup:
            - "Two seed lots (A=100, B=400 same product, total 500); planting needs 120 units -> A depleted, B at 380."
          setup_api_calls:
            - call: "POST /parcels"
              payload: { name: "INVF", acreage: 100, soil_type: "LOAM" }
              as: FarmManager
              captures: { pid: $.data.id, pv: $.data.version }
            - call: "POST /input-products"
              payload: { name: "Seed Inv", category: "SEED", unit: "SEED_UNIT", unit_cost: 0.5 }
              as: FarmManager
              captures: { sp: $.data.id }
            - call: "POST /input-lots"
              payload: { input_product_id: "${sp}", lot_code: "A", quantity_received: 100 }
              as: FarmManager
              captures: { lotA: $.data.id }
            - call: "POST /input-lots"
              payload: { input_product_id: "${sp}", lot_code: "B", quantity_received: 400 }
              as: FarmManager
              captures: { lotB: $.data.id }
            - call: "POST /crop-plans"
              payload: { parcel_id: "${pid}", crop: "CORN", season_year: 2026, planned_acres: 100, budget_input_cost: 1, budget_labor_cost: 1, budget_equipment_cost: 1 }
              as: Agronomist
              captures: { pl: $.data.id }
            - call: "POST /crop-plans/${pl}/approve"
              payload: { expected_parcel_version: "${pv}" }
              as: FarmManager
            - call: "POST /planting-events"
              payload: { crop_plan_id: "${pl}", input_lot_id: "${lotA}", acres_planted: 30, seed_rate_per_acre: 4 }
              as: Agronomist
              captures: { pe: $.data.id }
          trigger:
            - call: "POST /planting-events/${pe}/void"
              payload: {}
              as: Agronomist
              captures: { st: $.data.status }
          assert:
            - "PlantingEvent.${pe}.status == VOIDED"
            - "InputLot.${lotA}.quantity_remaining == 100"
            - "InputLot.${lotB}.quantity_remaining == 400"
            - "InputLot.${lotA}.status == OPEN"

      - name: void_confirmed_app_conserves_plan_input_cost
        grounds:
          - state_machines.ApplicationRecord.CONFIRMED_to_VOIDED
          - calculations.cost_per_acre
          - entities.CropPlan.fields.actual_input_cost
        distinguishing_aspect: |
          Conserved quantity = CropPlan.actual_input_cost (a money quantity, different type from seed units):
          confirming an application adds 1000 then voiding it removes exactly 1000, returning actual_input_cost
          to its pre-confirm value (0.00) with no drift.
        test_recipe:
          setup:
            - "GROWING plan; one CHEMICAL application (cost 1000) confirmed then voided."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-10T00:00:00Z" }
              as: FarmManager
            - call: "POST /parcels"
              payload: { name: "CostF", acreage: 100, soil_type: "LOAM" }
              as: FarmManager
              captures: { pid: $.data.id, pv: $.data.version }
            - call: "POST /input-products"
              payload: { name: "Seed CF", category: "SEED", unit: "SEED_UNIT", unit_cost: 0.5 }
              as: FarmManager
              captures: { sp: $.data.id }
            - call: "POST /input-lots"
              payload: { input_product_id: "${sp}", lot_code: "L", quantity_received: 500 }
              as: FarmManager
              captures: { sl: $.data.id }
            - call: "POST /input-products"
              payload: { name: "Fert CF", category: "FERTILIZER", unit: "GAL", unit_cost: 12.50 }
              as: FarmManager
              captures: { fp: $.data.id }
            - call: "POST /applicators"
              payload: { full_name: "A", license_no: "RU-50", certified: true }
              as: FarmManager
              captures: { aid: $.data.id }
            - call: "POST /crop-plans"
              payload: { parcel_id: "${pid}", crop: "CORN", season_year: 2026, planned_acres: 100, budget_input_cost: 1, budget_labor_cost: 1, budget_equipment_cost: 1 }
              as: Agronomist
              captures: { pl: $.data.id }
            - call: "POST /crop-plans/${pl}/approve"
              payload: { expected_parcel_version: "${pv}" }
              as: FarmManager
            - call: "POST /planting-events"
              payload: { crop_plan_id: "${pl}", input_lot_id: "${sl}", acres_planted: 100, seed_rate_per_acre: 1 }
              as: Agronomist
            - call: "POST /crop-plans/${pl}/begin-growing"
              payload: {}
              as: Agronomist
            - call: "POST /application-records"
              payload: { crop_plan_id: "${pl}", input_product_id: "${fp}", applicator_user_id: "${aid}", rate_per_acre: 2, acres_treated: 40 }
              as: Agronomist
              captures: { app: $.data.id }
            - call: "POST /application-records/${app}/confirm"
              payload: {}
              as: Applicator
              as_user_id: "${aid}"
          trigger:
            - call: "POST /application-records/${app}/void"
              payload: {}
              as: Agronomist
              captures: { st: $.data.status }
            - call: "GET /crop-plans/${pl}"
              payload: {}
              as: FarmManager
              captures: { aic: $.data.actual_input_cost }
          assert:
            - "ApplicationRecord.${app}.status == VOIDED"
            - "CropPlan.${pl}.actual_input_cost == 0.00"
