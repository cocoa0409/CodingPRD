            - call: "POST /ferry/fare-schedules/${fs_id}/submit"
              payload: { fuel_price_index_cents: 350 }
              as: SchedulerAdmin
            - call: "POST /ferry/fare-schedules/${fs_id}/approve"
              payload: {}
              as: SchedulerAdmin
            - call: "POST /ferry/crew-members"
              payload: { full_name: "Cap A", credential_class: "CAPTAIN" }
              as: CrewPlanner
              captures: { cap_id: $.data.id }
            - call: "POST /ferry/crew-members"
              payload: { full_name: "Deck A", credential_class: "DECK" }
              as: CrewPlanner
              captures: { deck1_id: $.data.id }
            - call: "POST /ferry/crew-members"
