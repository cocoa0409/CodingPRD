            - call: "POST /om/work-orders"
              payload: { outage_id: "${ot}", work_type: "ASSESSMENT", required_crew_type: "DAMAGE_ASSESSOR", requires_switching_order: false }
              as: Dispatcher
              captures: { wo_check: $.data.id }
          trigger:
            - { call: "POST /om/work-orders/${wo_fix}/ready", payload: {}, as: Dispatcher, captures: { err: $.data.error_id } }
            - { call: "POST /om/work-orders/${wo_check}/ready", payload: {}, as: Dispatcher, captures: { st: $.data.execution_status } }
          assert:
            - "${err} == ERR_ASSESSMENT_REQUIRED for the REPAIR work order"
