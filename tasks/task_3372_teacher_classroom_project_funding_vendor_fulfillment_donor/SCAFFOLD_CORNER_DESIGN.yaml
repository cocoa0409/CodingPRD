            - *k_submit
            - *k_screen
            - *k_vet
            - call: "POST /giving/equity-funds"
              payload: { name: "TX Spring Fund", state_code: "TX", min_poverty_pct: 75.0, budget_cents: 50000, window_start: "2027-01-01T00:00:00Z", window_end: "2027-06-30T00:00:00Z" }
              as: PlatformAdmin
              captures: { f1: $.data.id }
          trigger:
            - call: "POST /giving/equity-funds/${f1}/allocate"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_EQUITY_WINDOW_CLOSED (409) — now (2026-09-01) < window_start (2027-01-01)"
            - "EquityFund.${f1}.remaining_cents == 50000 unchanged"

      - name: match_campaign_target_mismatch_returns_target_mismatch
