  # ===========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: instrument_qc_buffer_half_open_overlap_with_5min_pad
        grounds:
          - validations[priority=7]
          - entities.Instrument.fields.qc_buffer_minutes
          - entities.InstrumentRun.fields.scheduled_start
          - entities.InstrumentRun.fields.scheduled_end
          - errors[ERR_INSTRUMENT_SLOT_CONFLICT]
        distinguishing_aspect: |
          Instrument booking uses half-open [start, end) interval semantics with a SYMMETRIC
          5-minute qc_buffer_minutes pad on each side. An existing run [09:00, 09:30) blocks any
          new run whose [start, end) is within 5 minutes of either endpoint — e.g., [09:30, 09:50)
          is rejected (zero gap, < 5 min), [09:35, 09:55) is rejected (5-min gap, NOT > 5-min as
          required), [09:36, 09:56) succeeds (6 minutes from the existing run's close). Resource:
          Instrument. Distinct from instance 2 (Phlebotomist with different interval semantics).
        test_recipe:
          setup:
            - "Clock pinned to 2026-05-28T08:00:00Z"
            - "One Instrument with qc_buffer_minutes=5"
            - "Two ACCESSIONED Specimens sp1, sp2 on separate orders"
            - "Existing InstrumentRun on sp1: [09:00, 09:30) status=SCHEDULED"
