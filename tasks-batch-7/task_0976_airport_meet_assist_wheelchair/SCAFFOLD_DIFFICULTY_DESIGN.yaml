            - call: "POST /maa/assist-requests/${req_id}/events"
              payload: { event_type: "SUBMIT", expected_assist_request_version: "${req_v}" }
              as: Requester
            - call: "POST /maa/airports/${ap_id}/agents"
              payload: { display_name: "BWI Ag", tsa_cleared_until: "2027-01-01T00:00:00Z", ummr_certified: false, senior_trained: false, wc_certified: true, shift_start_utc: "2026-06-16T08:00:00Z", shift_end_utc: "2026-06-16T20:00:00Z" }
              as: PlatformAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /maa/airports/${ap_id}/wheelchairs"
              payload: { asset_tag: "WC-BWI-1", chair_class: "MANUAL", is_wchc_rated: false }
              as: PlatformAdmin
              captures: { wc1_id: $.data.id }
