        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "One ACTIVE MatchRuleSet RS-BASE, activated, and no DownstreamSystem, so both merges complete inside their own request."
            - "One ACTIVE RegistrationSite SITE-CA with three PatientRecord rows CA-1000, CA-2000 and CA-3000 identical on all seven scored attributes, each with clinical_element_count 1 so no merge can move more than CONTAMINATION_REVIEW_ELEMENT_THRESHOLD 25 elements."
            - "Two merges are approved, both surviving CA-1000: first it subsumes CA-2000, then it subsumes CA-3000. Each pair is AUTO_LINK at 100.00 and lands directly in RECOMMENDED_MERGE, and CA-1000 stays ACTIVE throughout."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: MpiAdmin
            - call: "POST /mpi/match-rule-sets"
              payload: { name: "Baseline Match Rules", version_label: "V-BASE-1", attribute_weights: { last_name: 25.00, first_name: 15.00, dob: 25.00, ssn_last4: 15.00, sex: 5.00, postal_code: 10.00, phone: 5.00 }, auto_link_threshold: 85.00, review_threshold: 70.00, conflict_penalty_points: 12.00 }
