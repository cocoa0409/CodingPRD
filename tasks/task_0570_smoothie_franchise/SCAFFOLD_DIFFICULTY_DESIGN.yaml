          assert:
            - "response.error_id == ERR_ALLERGEN_CONFLICT"
            - "http_status == 422"

      - name: store_state_beats_points_fiscal
        grounds:
          - validations[priority=7]
          - validations[priority=17]
          - errors[ERR_STORE_NOT_OPEN]
          - errors[ERR_INSUFFICIENT_POINTS]
        distinguishing_aspect: "state (priority 7, ERR_STORE_NOT_OPEN) vs business_fiscal (priority 17, ERR_INSUFFICIENT_POINTS): placing at a SUSPENDED store while redeeming more points than owned returns ERR_STORE_NOT_OPEN — a different category pair from the safety/constraint conflict."
        test_recipe:
