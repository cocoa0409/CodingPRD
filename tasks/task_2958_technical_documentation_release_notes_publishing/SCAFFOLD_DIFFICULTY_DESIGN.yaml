  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: writer_load_points_conserved_across_assign_reassign_cancel
        grounds:
          - calculations.writer_committed_load_points
          - calculations.writer_capacity_load_points
          - state_machines.DocPlanItem.ASSIGNED_to_ASSIGNED
          - state_machines.DocPlanItem.DRAFTED_to_CANCELLED
        distinguishing_aspect: |
          Conservation of a HUMAN-CAPACITY quantity across a three-step round trip in which the
          quantity itself is re-valued mid-flight: the same deliverable is worth 26.00 points to
          a SENIOR writer and 32.50 to an ASSOCIATE, so the reassignment must debit the old
          writer by the OLD figure and credit the new writer with the NEWLY computed one, and
          the cancellation must return the new writer to exactly zero. A naive implementation
          that moves the same number twice leaves 26.00 stranded on one of the two writers.
        test_recipe:
          setup:
            - "One release train ATLAS 29.0."
            - "Two writers with capacity_points 100: w1 SENIOR (divisor 1.00) and w2 ASSOCIATE (divisor 0.80)."
            - "One STANDARD plan item, 6 pages, complexity 10, NEW_TOPIC — worth (12 + 10 + 4) * 1.0 / 1.00 = 26.00 to w1 and 26.00 / 0.80 = 32.50 to w2."
            - "Both writers start at committed_load_points 0.00 with assignment_count 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DocsLead
            - call: "POST /release-trains"
              payload: { product_key: "ATLAS", version_label: "29.0", doc_freeze_date: "2026-08-20", ga_date: "2026-09-01", support_end_date: "2027-09-01", localization_budget_cap_cents: 5000000 }
              as: DocsLead
              captures: { rt_id: $.data.id }
            - call: "POST /writers"
              payload: { person_key: "w-sam", full_name: "Sam Senior", seniority_tier: "SENIOR", capacity_points: 100 }
              as: DocsLead
              captures: { w1_id: $.data.id }
            - call: "POST /writers"
              payload: { person_key: "w-alex", full_name: "Alex Associate", seniority_tier: "ASSOCIATE", capacity_points: 100 }
              as: DocsLead
              captures: { w2_id: $.data.id }
            - call: "POST /plan-items"
              payload: { release_train_id: "${rt_id}", feature_key: "atlas-handoff", ia_placement: "NEW_TOPIC", audience_tier: "STANDARD", planned_page_count: 6, complexity_points: 10 }
              as: DocsLead
              captures: { pi_id: $.data.id }
          trigger:
            - call: "POST /plan-items/${pi_id}/assign"
              payload: { writer_id: "${w1_id}", window_start_date: "2026-08-03", window_end_date: "2026-08-14" }
              as: DocsLead
              captures: { load_w1: $.data.load_points }
            - call: "POST /plan-items/${pi_id}/assign"
              payload: { writer_id: "${w2_id}", window_start_date: "2026-08-03", window_end_date: "2026-08-14" }
              as: DocsLead
              captures: { load_w2: $.data.load_points }
            - call: "POST /plan-items/${pi_id}/cancel"
              payload: { cancel_reason: "feature cut from the release" }
              as: DocsLead
          assert:
            - "after step 1: ${load_w1} == 26.00, Writer.${w1_id}.committed_load_points == 26.00 with assignment_count 1, Writer.${w2_id}.committed_load_points == 0.00"
            - "after step 2: ${load_w2} == 32.50 (the SAME deliverable re-valued against the ASSOCIATE divisor 0.80)"
            - "after step 2: Writer.${w1_id}.committed_load_points == 0.00 with assignment_count 0 — debited by the OLD 26.00, not by the new 32.50"
            - "after step 2: Writer.${w2_id}.committed_load_points == 32.50 with assignment_count 1"
            - "after step 2: the reassignment did NOT collide with the item's own previous window (a plan item never overlaps itself)"
            - "after step 3: Writer.${w2_id}.committed_load_points == 0.00 with assignment_count 0 — exactly the pre-assignment value"
            - "after step 3: DocPlanItem.${pi_id}.status == CANCELLED with assigned_writer_id null and cancel_reason 'feature cut from the release'"
            - "after step 3: ReleaseTrain.${rt_id}.plan_item_count == 0 and approved_topic_ratio == 1.00 (the empty-set convention), doc_readiness_posture OPEN"

      - name: locale_committed_source_words_conserved_across_job_create_cancel
        grounds:
          - calculations.locale_committed_source_words
          - calculations.release_train_localization_commitment
          - state_machines.LocalizationJob.QUEUED_to_CANCELLED
          - entities.LocaleProfile.fields.committed_source_words
        distinguishing_aspect: |
          Conservation of a WORD-VOLUME reservation plus its monetary shadow on the release
          train, in a different subsystem from the writer ledger: one create charges both
          LocaleProfile.committed_source_words and ReleaseTrain.localization_committed_cents,
          and the compensating cancel must return BOTH to their exact pre-create values in the
          same call — a cancel that releases the words but leaves the cents behind is the
          characteristic drift this instance catches.
        test_recipe:
          setup:
            - "One release train ATLAS 30.0 with a published doc set 30.0-docs and one live 1200-word topic."
            - "One ACTIVE DELAYED locale de-DE (tm_coverage_pct 0, per_word_rate_cents 10, sla_days 10, parallel_job_limit 3) created AFTER the publication, so both ledgers start at zero: committed_source_words 0, open_job_count 0, localization_committed_cents 0."
