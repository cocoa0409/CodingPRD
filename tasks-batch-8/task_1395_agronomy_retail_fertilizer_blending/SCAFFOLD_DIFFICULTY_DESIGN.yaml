            - "s3_f == BOOKED and s3_p == CREDIT_APPROVED (cycle re-entered)"
            - "s4_f == BOOKED and s4_p == CREDIT_APPROVED (batch void reverts ONLY the fulfillment dim; payment dim untouched)"

      - name: recommendation_draft_review_cycle
        grounds:
          - state_machines.Recommendation
        distinguishing_aspect: |
          Recommendation is a CYCLIC machine (DRAFT -> PENDING_REVIEW -> DRAFT ->
          PENDING_REVIEW -> APPROVED): the review loop may repeat, and each pass
          persists return_reason and bumps version — distinct from BlendOrder's
          parallel-dimension non-linearity (different entity, different shape).
        test_recipe:
          setup:
            - "Grower, field, RESULTED soil test; one BUILD recommendation in DRAFT"
          setup_api_calls:
            - call: "POST /agronomy/growers"
              payload: { legal_name: "Cycle Farms", credit_limit_cents: 1000000 }
              as: CreditManager
              captures: { g_id: $.data.id }
            - call: "POST /agronomy/growers/${g_id}/fields"
