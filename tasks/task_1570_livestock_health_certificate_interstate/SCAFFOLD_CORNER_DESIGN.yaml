      - name: certificate_lapsed_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Certificate.ISSUED_to_LAPSED
          - state_machines.MovementPermit.REQUESTED_to_ISSUED
