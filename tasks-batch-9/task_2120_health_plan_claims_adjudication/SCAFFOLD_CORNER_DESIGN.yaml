# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task 2120 — Health Plan Claims Adjudication Engine
# Sections and claim_types come from references/claim-extraction-guide.md
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_benefit_plan_applies_every_declared_default
        claim_type: defaults
        grounds:
          - entities.BenefitPlan.fields.copay_office_visit_cents
          - entities.BenefitPlan.fields.out_of_network_penalty_pct
          - entities.BenefitPlan.fields.timely_filing_days
          - entities.BenefitPlan.fields.cob_method
          - entities.BenefitPlan.fields.plan_year_start_date
        distinguishing_aspect: "Creating a plan with only the five required fields returns copay 2500, out_of_network_penalty_pct 0.30, timely_filing_days 90, cob_method COME_OUT_WHOLE, plan_year_start_date 2026-01-01 and version 1."
        test_recipe:
          setup:
            - "Empty database; logical clock at 2026-03-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /adjudication/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlanAdmin
          trigger:
            - call: "POST /adjudication/benefit-plans"
              payload: { plan_code: "DEF-1", name: "Defaults Plan", deductible_individual_cents: 50000, oop_max_individual_cents: 300000, coinsurance_member_pct: 0.20 }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
          assert:
            - "HTTP status is 201"
            - "BenefitPlan.${plan_id}.copay_office_visit_cents == 2500"
            - "BenefitPlan.${plan_id}.out_of_network_penalty_pct == 0.30"
            - "BenefitPlan.${plan_id}.timely_filing_days == 90"
            - "BenefitPlan.${plan_id}.cob_method == COME_OUT_WHOLE"
            - "BenefitPlan.${plan_id}.plan_year_start_date == 2026-01-01"
            - "BenefitPlan.${plan_id}.version == 1"

      - name: create_member_auto_creates_plan_year_accumulator_at_zero
        claim_type: creation
        grounds:
          - entities.BenefitAccumulator.fields.plan_year
          - entities.BenefitAccumulator.fields.deductible_applied_cents
          - entities.Member.fields.status
        distinguishing_aspect: "Enrolling a member creates exactly one BenefitAccumulator for plan_year 2026 with deductible_applied_cents 0, oop_applied_cents 0 and remitted_claim_count 0, and the member starts ACTIVE."
        test_recipe:
          setup:
            - "Logical clock at 2026-03-01T00:00:00Z; BenefitPlan ACC-1 exists with plan_year_start_date 2026-01-01."
          setup_api_calls:
            - call: "POST /adjudication/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /adjudication/benefit-plans"
              payload: { plan_code: "ACC-1", name: "Accumulator Plan", deductible_individual_cents: 50000, oop_max_individual_cents: 300000, coinsurance_member_pct: 0.20 }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /adjudication/members"
              payload: { member_number: "M-ACC-1", plan_id: "${plan_id}" }
              as: PlanAdmin
              captures: { mem_id: $.data.id, mem_status: $.data.status }
          assert:
            - "${mem_status} == ACTIVE"
            - "GET /adjudication/members/${mem_id}/accumulators returns total_count == 1"
            - "The single accumulator has plan_year == 2026, deductible_applied_cents == 0, oop_applied_cents == 0 and remitted_claim_count == 0"

      - name: get_claim_with_unknown_uuid_returns_claim_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_CLAIM_NOT_FOUND]
          - validations[priority=10]
        distinguishing_aspect: "Reading a syntactically valid but unknown claim id returns ERR_CLAIM_NOT_FOUND with HTTP 404 and the standard error envelope."
        test_recipe:
          setup:
            - "Empty database; no claim has ever been created."
          setup_api_calls:
            - call: "POST /adjudication/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlanAdmin
          trigger:
            - call: "GET /adjudication/claims/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ClaimsExaminer
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_CLAIM_NOT_FOUND"
            - "HTTP status is 404"
            - "The response body carries meta.api_request_id, meta.api_request_timestamp and response_type == error"

      - name: create_member_missing_required_plan_id_returns_missing_required_field
        claim_type: required_fields
        grounds:
          - validations[priority=20]
          - errors[ERR_MISSING_REQUIRED_FIELD]
        distinguishing_aspect: "Omitting plan_id, a field §1.5 declares required on POST /adjudication/members, returns ERR_MISSING_REQUIRED_FIELD with HTTP 400 and creates no Member row."
        test_recipe:
          setup:
            - "Logical clock at 2026-03-01T00:00:00Z; no members exist."
          setup_api_calls:
            - call: "POST /adjudication/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlanAdmin
          trigger:
            - call: "POST /adjudication/members"
              payload: { member_number: "M-MISSING-1" }
              as: PlanAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_MISSING_REQUIRED_FIELD"
            - "HTTP status is 400"
            - "GET /adjudication/members returns total_count == 0"

      - name: claim_line_computed_money_fields_are_zero_before_first_adjudication
        claim_type: computed_fields
        grounds:
          - entities.ClaimLine.fields.allowed_amount_cents
          - entities.ClaimLine.fields.member_liability_cents
          - entities.ClaimLine.fields.line_status
          - entities.Claim.fields.total_billed_cents
        distinguishing_aspect: "Right after intake every ClaimLine has line_status PENDING with allowed_amount_cents, deductible_applied_cents, copay_cents, coinsurance_cents, member_liability_cents and plan_paid_cents all 0, while Claim.total_billed_cents already equals the submitted billed sum 90000."
        test_recipe:
          setup:
            - "Logical clock at 2026-03-01T00:00:00Z; plan CF-1, IN_NETWORK provider, fee schedule rate 73721 = 40000, member with an open-ended PRIMARY coverage from 2026-01-01."
          setup_api_calls:
            - call: "POST /adjudication/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /adjudication/benefit-plans"
              payload: { plan_code: "CF-1", name: "Computed Fields Plan", deductible_individual_cents: 0, oop_max_individual_cents: 1000000, coinsurance_member_pct: 0 }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /adjudication/providers"
              payload: { npi: "2000000001", name: "CF Clinic", network_status: "IN_NETWORK" }
              as: PlanAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /adjudication/benefit-plans/${plan_id}/fee-schedule-rates"
              payload: { procedure_code: "73721", allowed_amount_cents: 40000, effective_date: "2026-01-01" }
              as: NetworkManager
            - call: "POST /adjudication/members"
              payload: { member_number: "M-CF-1", plan_id: "${plan_id}" }
              as: PlanAdmin
              captures: { mem_id: $.data.id }
            - call: "POST /adjudication/members/${mem_id}/coverages"
              payload: { effective_date: "2026-01-01", cob_order: "PRIMARY" }
              as: PlanAdmin
          trigger:
            - call: "POST /adjudication/claims"
              payload: { claim_number: "CLM-CF-1", member_id: "${mem_id}", provider_id: "${prov_id}", lines: [{ line_number: 1, procedure_code: "73721", units: 1, billed_amount_cents: 40000, service_date: "2026-02-10" }, { line_number: 2, procedure_code: "73721", units: 1, billed_amount_cents: 50000, service_date: "2026-02-11" }] }
              as: ClaimsIntake
              captures: { c_id: $.data.id, billed: $.data.total_billed_cents, allowed: $.data.total_allowed_cents, variant: $.data.pricing_variant }
          assert:
            - "${billed} == 90000"
            - "${allowed} == 0 and ${variant} == UNPRICED"
            - "GET /adjudication/claim-lines?claim_id=${c_id} returns two lines, both line_status == PENDING with allowed_amount_cents == 0 and member_liability_cents == 0"

      - name: claim_system_fields_received_at_status_and_version_are_server_minted
        claim_type: system_fields
        grounds:
          - entities.Claim.fields.received_at
          - entities.Claim.fields.status
          - entities.Claim.fields.adjudication_pass
          - entities.Claim.fields.payment_status
        distinguishing_aspect: "A freshly intaken claim carries received_at equal to the logical clock 2026-03-01T00:00:00.000Z, status RECEIVED, payment_status NOT_REMITTED, adjudication_pass 0 and version 1, none of which the client can supply."
        test_recipe:
          setup:
            - "Logical clock at 2026-03-01T00:00:00Z; plan SF-1, IN_NETWORK provider, fee schedule rate 73721 = 40000, member with an open-ended PRIMARY coverage from 2026-01-01."
          setup_api_calls:
            - call: "POST /adjudication/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /adjudication/benefit-plans"
              payload: { plan_code: "SF-1", name: "System Fields Plan", deductible_individual_cents: 0, oop_max_individual_cents: 1000000, coinsurance_member_pct: 0 }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /adjudication/providers"
              payload: { npi: "2000000002", name: "SF Clinic", network_status: "IN_NETWORK" }
              as: PlanAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /adjudication/benefit-plans/${plan_id}/fee-schedule-rates"
              payload: { procedure_code: "73721", allowed_amount_cents: 40000, effective_date: "2026-01-01" }
              as: NetworkManager
            - call: "POST /adjudication/members"
              payload: { member_number: "M-SF-1", plan_id: "${plan_id}" }
              as: PlanAdmin
              captures: { mem_id: $.data.id }
            - call: "POST /adjudication/members/${mem_id}/coverages"
              payload: { effective_date: "2026-01-01", cob_order: "PRIMARY" }
              as: PlanAdmin
              captures: { cov_id: $.data.id }
          trigger:
            - call: "POST /adjudication/claims"
              payload: { claim_number: "CLM-SF-1", member_id: "${mem_id}", provider_id: "${prov_id}", lines: [{ line_number: 1, procedure_code: "73721", units: 1, billed_amount_cents: 60000, service_date: "2026-02-10" }] }
              as: ClaimsIntake
              captures: { c_id: $.data.id, rec: $.data.received_at, st: $.data.status, pay: $.data.payment_status, passes: $.data.adjudication_pass, ver: $.data.version, cov: $.data.coverage_id, from_d: $.data.statement_from_date, to_d: $.data.statement_to_date }
          assert:
            - "${rec} == 2026-03-01T00:00:00.000Z"
            - "${st} == RECEIVED and ${pay} == NOT_REMITTED"
            - "${passes} == 0 and ${ver} == 1"
            - "${cov} == ${cov_id} (coverage matched at intake)"
            - "${from_d} == 2026-02-10 and ${to_d} == 2026-02-10 (both defaulted from the single service date)"

      - name: coverage_with_invalid_cob_order_enum_returns_invalid_field_value
        claim_type: type_constraints
        grounds:
          - validations[priority=21]
          - errors[ERR_INVALID_FIELD_VALUE]
          - entities.MemberCoverage.fields.cob_order
        distinguishing_aspect: "cob_order QUATERNARY is outside the declared {PRIMARY, SECONDARY, TERTIARY} set, so the request returns ERR_INVALID_FIELD_VALUE with HTTP 400 and no coverage row is created."
        test_recipe:
          setup:
            - "Logical clock at 2026-03-01T00:00:00Z; plan TC-1 and member M-TC-1 exist with no coverage segments."
          setup_api_calls:
            - call: "POST /adjudication/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /adjudication/benefit-plans"
              payload: { plan_code: "TC-1", name: "Type Constraint Plan", deductible_individual_cents: 0, oop_max_individual_cents: 1000000, coinsurance_member_pct: 0 }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /adjudication/members"
              payload: { member_number: "M-TC-1", plan_id: "${plan_id}" }
              as: PlanAdmin
              captures: { mem_id: $.data.id }
          trigger:
            - call: "POST /adjudication/members/${mem_id}/coverages"
              payload: { effective_date: "2026-01-01", cob_order: "QUATERNARY" }
              as: PlanAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_INVALID_FIELD_VALUE"
            - "HTTP status is 400"
            - "GET /adjudication/members/${mem_id}/coverages returns total_count == 0"

      - name: adjudication_event_log_rows_are_immutable_and_carry_no_version_field
        claim_type: immutability
        grounds:
          - entities.AdjudicationEvent.fields.event_type
          - entities.AdjudicationEvent.fields.occurred_at
        distinguishing_aspect: "AdjudicationEvent is declared common_fields: false, so each event exposes id, created_at, claim_id, pass_number, event_type, from_status, to_status, actor_role and occurred_at, and exposes neither a version nor an updated_at field, and no endpoint mutates an existing event."
        test_recipe:
          setup:
            - "Logical clock at 2026-03-01T00:00:00Z; plan IMM-1, IN_NETWORK provider, fee schedule rate 73721 = 40000, member with an open-ended PRIMARY coverage from 2026-01-01, one claim already intaken."
          setup_api_calls:
            - call: "POST /adjudication/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /adjudication/benefit-plans"
              payload: { plan_code: "IMM-1", name: "Immutability Plan", deductible_individual_cents: 0, oop_max_individual_cents: 1000000, coinsurance_member_pct: 0 }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /adjudication/providers"
              payload: { npi: "2000000003", name: "IMM Clinic", network_status: "IN_NETWORK" }
              as: PlanAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /adjudication/benefit-plans/${plan_id}/fee-schedule-rates"
              payload: { procedure_code: "73721", allowed_amount_cents: 40000, effective_date: "2026-01-01" }
              as: NetworkManager
            - call: "POST /adjudication/members"
              payload: { member_number: "M-IMM-1", plan_id: "${plan_id}" }
              as: PlanAdmin
              captures: { mem_id: $.data.id }
            - call: "POST /adjudication/members/${mem_id}/coverages"
              payload: { effective_date: "2026-01-01", cob_order: "PRIMARY" }
              as: PlanAdmin
            - call: "POST /adjudication/claims"
              payload: { claim_number: "CLM-IMM-1", member_id: "${mem_id}", provider_id: "${prov_id}", lines: [{ line_number: 1, procedure_code: "73721", units: 1, billed_amount_cents: 60000, service_date: "2026-02-10" }] }
              as: ClaimsIntake
              captures: { c_id: $.data.id }
          trigger:
            - call: "GET /adjudication/claims/${c_id}/events"
              payload: {}
              as: ClaimsExaminer
          assert:
            - "The response contains exactly one event with event_type == INTAKE, from_status == null-equivalent and to_status == RECEIVED"
            - "That event has occurred_at == 2026-03-01T00:00:00.000Z and pass_number == 0"
            - "The event object exposes no version field and no updated_at field"

      - name: claim_intake_with_unknown_member_id_returns_member_not_found
        claim_type: parent_relationships
        grounds:
          - validations[priority=11]
          - errors[ERR_MEMBER_NOT_FOUND]
        distinguishing_aspect: "A body-supplied member_id that resolves to nothing returns ERR_MEMBER_NOT_FOUND with HTTP 404, and the provider_id in the same body being valid does not rescue the request."
        test_recipe:
          setup:
            - "Logical clock at 2026-03-01T00:00:00Z; plan FK-1 and IN_NETWORK provider exist; no member exists."
          setup_api_calls:
            - call: "POST /adjudication/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /adjudication/benefit-plans"
              payload: { plan_code: "FK-1", name: "FK Plan", deductible_individual_cents: 0, oop_max_individual_cents: 1000000, coinsurance_member_pct: 0 }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /adjudication/providers"
              payload: { npi: "2000000004", name: "FK Clinic", network_status: "IN_NETWORK" }
              as: PlanAdmin
              captures: { prov_id: $.data.id }
          trigger:
            - call: "POST /adjudication/claims"
              payload: { claim_number: "CLM-FK-1", member_id: "00000000-0000-4000-8000-000000000001", provider_id: "${prov_id}", lines: [{ line_number: 1, procedure_code: "73721", units: 1, billed_amount_cents: 60000, service_date: "2026-02-10" }] }
              as: ClaimsIntake
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_MEMBER_NOT_FOUND"
            - "HTTP status is 404"
            - "GET /adjudication/claims returns total_count == 0"

      - name: list_claims_pagination_returns_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /adjudication/claims]
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three claims on file, GET /adjudication/claims?limit=2&offset=0 returns 2 rows with total_count 3 and has_more true, and offset=2 returns 1 row with has_more false."
        test_recipe:
          setup:
            - "Logical clock at 2026-03-01T00:00:00Z; plan PG-1, IN_NETWORK provider, fee schedule rate 73721 = 40000, member with an open-ended PRIMARY coverage from 2026-01-01."
            - "Three claims exist with service dates 2026-02-10, 2026-02-11 and 2026-02-12, so none is a duplicate of another."
          setup_api_calls:
            - call: "POST /adjudication/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /adjudication/benefit-plans"
              payload: { plan_code: "PG-1", name: "Pagination Plan", deductible_individual_cents: 0, oop_max_individual_cents: 1000000, coinsurance_member_pct: 0 }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /adjudication/providers"
              payload: { npi: "2000000005", name: "PG Clinic", network_status: "IN_NETWORK" }
              as: PlanAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /adjudication/benefit-plans/${plan_id}/fee-schedule-rates"
              payload: { procedure_code: "73721", allowed_amount_cents: 40000, effective_date: "2026-01-01" }
              as: NetworkManager
            - call: "POST /adjudication/members"
              payload: { member_number: "M-PG-1", plan_id: "${plan_id}" }
              as: PlanAdmin
              captures: { mem_id: $.data.id }
            - call: "POST /adjudication/members/${mem_id}/coverages"
              payload: { effective_date: "2026-01-01", cob_order: "PRIMARY" }
              as: PlanAdmin
            - call: "POST /adjudication/claims"
              payload: { claim_number: "CLM-PG-1", member_id: "${mem_id}", provider_id: "${prov_id}", lines: [{ line_number: 1, procedure_code: "73721", units: 1, billed_amount_cents: 60000, service_date: "2026-02-10" }] }
              as: ClaimsIntake
            - call: "POST /adjudication/claims"
              payload: { claim_number: "CLM-PG-2", member_id: "${mem_id}", provider_id: "${prov_id}", lines: [{ line_number: 1, procedure_code: "73721", units: 1, billed_amount_cents: 60000, service_date: "2026-02-11" }] }
              as: ClaimsIntake
            - call: "POST /adjudication/claims"
              payload: { claim_number: "CLM-PG-3", member_id: "${mem_id}", provider_id: "${prov_id}", lines: [{ line_number: 1, procedure_code: "73721", units: 1, billed_amount_cents: 60000, service_date: "2026-02-12" }] }
              as: ClaimsIntake
          trigger:
            - call: "GET /adjudication/claims"
              payload: { member_id: "${mem_id}", limit: 2, offset: 0 }
              as: ClaimsExaminer
            - call: "GET /adjudication/claims"
              payload: { member_id: "${mem_id}", limit: 2, offset: 2 }
              as: ClaimsExaminer
          assert:
            - "First call returns 2 rows with total_count == 3 and has_more == true"
            - "Second call returns 1 row with total_count == 3 and has_more == false"
            - "response_type == array on both calls"

      - name: get_claims_filtered_by_duplicate_of_claim_id_returns_only_the_rejected_claim
        claim_type: retrieval
        grounds:
          - entities.Claim.fields.duplicate_of_claim_id
          - endpoints[GET /adjudication/claims]
        distinguishing_aspect: "The self-referential FK Claim.duplicate_of_claim_id is reverse-reachable: filtering the claim list by the baseline claim's id returns exactly the one DUPLICATE_REJECTED claim that points at it."
        test_recipe:
          setup:
            - "Logical clock at 2026-03-01T00:00:00Z; plan SR-1, IN_NETWORK provider, fee schedule rate 99213 = 10000, member with an open-ended PRIMARY coverage from 2026-01-01."
            - "Baseline claim CLM-SR-A is RECEIVED; claim CLM-SR-B repeats the same line within the 500-cent tolerance and is therefore DUPLICATE_REJECTED."
          setup_api_calls:
            - call: "POST /adjudication/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /adjudication/benefit-plans"
              payload: { plan_code: "SR-1", name: "Self Reference Plan", deductible_individual_cents: 0, oop_max_individual_cents: 1000000, coinsurance_member_pct: 0 }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /adjudication/providers"
              payload: { npi: "2000000006", name: "SR Clinic", network_status: "IN_NETWORK" }
              as: PlanAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /adjudication/benefit-plans/${plan_id}/fee-schedule-rates"
              payload: { procedure_code: "99213", allowed_amount_cents: 10000, effective_date: "2026-01-01" }
              as: NetworkManager
            - call: "POST /adjudication/members"
              payload: { member_number: "M-SR-1", plan_id: "${plan_id}" }
              as: PlanAdmin
              captures: { mem_id: $.data.id }
            - call: "POST /adjudication/members/${mem_id}/coverages"
              payload: { effective_date: "2026-01-01", cob_order: "PRIMARY" }
              as: PlanAdmin
            - call: "POST /adjudication/claims"
              payload: { claim_number: "CLM-SR-A", member_id: "${mem_id}", provider_id: "${prov_id}", lines: [{ line_number: 1, procedure_code: "99213", units: 1, billed_amount_cents: 10000, service_date: "2026-02-10" }] }
              as: ClaimsIntake
              captures: { ca_id: $.data.id }
            - call: "POST /adjudication/claims"
              payload: { claim_number: "CLM-SR-B", member_id: "${mem_id}", provider_id: "${prov_id}", lines: [{ line_number: 1, procedure_code: "99213", units: 1, billed_amount_cents: 10200, service_date: "2026-02-10" }] }
              as: ClaimsIntake
              captures: { cb_id: $.data.id }
          trigger:
            - call: "GET /adjudication/claims"
              payload: { duplicate_of_claim_id: "${ca_id}" }
              as: ClaimsExaminer
          assert:
            - "The response returns total_count == 1"
            - "The single row has id == ${cb_id} and status == DUPLICATE_REJECTED"
            - "GET /adjudication/claims?duplicate_of_claim_id=${cb_id} returns total_count == 0"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: adjudicate_a_finalized_claim_returns_invalid_claim_state
        claim_type: invalid_transitions
        grounds:
          - validations[priority=30]
          - errors[ERR_INVALID_CLAIM_STATE]
          - state_machines.Claim.status.ADJUDICATED_to_FINALIZED
        distinguishing_aspect: "FINALIZED is not a `from:` state of any adjudicate transition, so a second adjudication pass returns ERR_INVALID_CLAIM_STATE (409) and adjudication_pass stays at 1."
        test_recipe:
          setup:
            - "Logical clock at 2026-03-01T00:00:00Z; plan SM-1 (deductible 0, coinsurance 0), IN_NETWORK provider, fee schedule rate 73721 = 40000, member with an open-ended PRIMARY coverage from 2026-01-01."
            - "Claim CLM-SM-1 has been adjudicated and finalized, so it is FINALIZED / REMITTED with adjudication_pass 1."
          setup_api_calls:
            - call: "POST /adjudication/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /adjudication/benefit-plans"
              payload: { plan_code: "SM-1", name: "State Machine Plan", deductible_individual_cents: 0, oop_max_individual_cents: 1000000, coinsurance_member_pct: 0 }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /adjudication/providers"
              payload: { npi: "2000000007", name: "SM Clinic", network_status: "IN_NETWORK" }
              as: PlanAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /adjudication/benefit-plans/${plan_id}/fee-schedule-rates"
              payload: { procedure_code: "73721", allowed_amount_cents: 40000, effective_date: "2026-01-01" }
              as: NetworkManager
            - call: "POST /adjudication/members"
              payload: { member_number: "M-SM-1", plan_id: "${plan_id}" }
              as: PlanAdmin
              captures: { mem_id: $.data.id }
            - call: "POST /adjudication/members/${mem_id}/coverages"
              payload: { effective_date: "2026-01-01", cob_order: "PRIMARY" }
              as: PlanAdmin
            - call: "POST /adjudication/claims"
              payload: { claim_number: "CLM-SM-1", member_id: "${mem_id}", provider_id: "${prov_id}", lines: [{ line_number: 1, procedure_code: "73721", units: 1, billed_amount_cents: 60000, service_date: "2026-02-10" }] }
              as: ClaimsIntake
              captures: { c_id: $.data.id }
            - call: "POST /adjudication/claims/${c_id}/adjudicate"
              payload: {}
              as: ClaimsExaminer
            - call: "POST /adjudication/claims/${c_id}/finalize"
              payload: {}
              as: ClaimsExaminer
          trigger:
            - call: "POST /adjudication/claims/${c_id}/adjudicate"
              payload: {}
              as: ClaimsExaminer
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_INVALID_CLAIM_STATE"
            - "HTTP status is 409"
            - "Claim.${c_id}.status == FINALIZED and adjudication_pass == 1"

      - name: void_a_received_claim_returns_claim_not_finalized
        claim_type: invalid_transitions
        grounds:
          - validations[priority=30]
          - errors[ERR_CLAIM_NOT_FINALIZED]
          - state_machines.Claim.status.FINALIZED_to_VOIDED
        distinguishing_aspect: "The only `from:` state of the void transition is FINALIZED, so voiding a RECEIVED claim returns ERR_CLAIM_NOT_FINALIZED (409) and the claim stays RECEIVED with payment_status NOT_REMITTED."
        test_recipe:
          setup:
            - "Logical clock at 2026-03-01T00:00:00Z; plan SM-2, IN_NETWORK provider, fee schedule rate 73721 = 40000, member with an open-ended PRIMARY coverage from 2026-01-01."
            - "Claim CLM-SM-2 is in RECEIVED and has never been adjudicated."
          setup_api_calls:
            - call: "POST /adjudication/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /adjudication/benefit-plans"
              payload: { plan_code: "SM-2", name: "State Machine Plan Two", deductible_individual_cents: 0, oop_max_individual_cents: 1000000, coinsurance_member_pct: 0 }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /adjudication/providers"
              payload: { npi: "2000000008", name: "SM2 Clinic", network_status: "IN_NETWORK" }
              as: PlanAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /adjudication/benefit-plans/${plan_id}/fee-schedule-rates"
              payload: { procedure_code: "73721", allowed_amount_cents: 40000, effective_date: "2026-01-01" }
              as: NetworkManager
            - call: "POST /adjudication/members"
              payload: { member_number: "M-SM-2", plan_id: "${plan_id}" }
              as: PlanAdmin
              captures: { mem_id: $.data.id }
            - call: "POST /adjudication/members/${mem_id}/coverages"
              payload: { effective_date: "2026-01-01", cob_order: "PRIMARY" }
              as: PlanAdmin
            - call: "POST /adjudication/claims"
              payload: { claim_number: "CLM-SM-2", member_id: "${mem_id}", provider_id: "${prov_id}", lines: [{ line_number: 1, procedure_code: "73721", units: 1, billed_amount_cents: 60000, service_date: "2026-02-10" }] }
              as: ClaimsIntake
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /adjudication/claims/${c_id}/void"
              payload: { void_reason_code: "VOID_TEST" }
              as: ClaimsExaminer
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_CLAIM_NOT_FINALIZED"
            - "HTTP status is 409"
            - "Claim.${c_id}.status == RECEIVED and payment_status == NOT_REMITTED"
            - "GET /adjudication/claims/${c_id}/remittances returns total_count == 0"

      - name: activate_an_already_active_contract_returns_contract_not_draft
        claim_type: idempotency
        grounds:
          - state_machines.ProviderContract.status.DRAFT_to_ACTIVE
          - errors[ERR_CONTRACT_NOT_DRAFT]
        distinguishing_aspect: "Activation is not idempotent: the second activate on the same contract observes status ACTIVE and returns ERR_CONTRACT_NOT_DRAFT (409)."
        test_recipe:
          setup:
            - "Logical clock at 2026-03-01T00:00:00Z; plan SM-3, IN_NETWORK provider, one ACTIVE PCT_OF_FEE_SCHEDULE contract at 0.900 covering 2026-01-01..2026-12-31."
          setup_api_calls:
            - call: "POST /adjudication/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /adjudication/benefit-plans"
              payload: { plan_code: "SM-3", name: "State Machine Plan Three", deductible_individual_cents: 0, oop_max_individual_cents: 1000000, coinsurance_member_pct: 0 }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /adjudication/providers"
              payload: { npi: "2000000009", name: "SM3 Group", network_status: "IN_NETWORK" }
              as: PlanAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /adjudication/contracts"
              payload: { provider_id: "${prov_id}", plan_id: "${plan_id}", effective_date: "2026-01-01", term_date: "2026-12-31", pricing_method: "PCT_OF_FEE_SCHEDULE", contract_pct: 0.900 }
              as: NetworkManager
              captures: { ctr_id: $.data.id }
            - call: "POST /adjudication/contracts/${ctr_id}/activate"
              payload: {}
              as: NetworkManager
              captures: { st_first: $.data.status }
          trigger:
            - call: "POST /adjudication/contracts/${ctr_id}/activate"
              payload: {}
              as: NetworkManager
              captures: { err_id: $.data.error_id }
          assert:
            - "${st_first} == ACTIVE"
            - "${err_id} == ERR_CONTRACT_NOT_DRAFT"
            - "HTTP status is 409"
            - "ProviderContract.${ctr_id}.status == ACTIVE (unchanged)"

      - name: revoke_an_already_revoked_authorization_returns_authorization_not_revocable
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Authorization.status.ACTIVE_to_REVOKED
          - errors[ERR_AUTHORIZATION_NOT_REVOCABLE]
        distinguishing_aspect: "REVOKED is a terminal state of the Authorization machine, so a second revoke returns ERR_AUTHORIZATION_NOT_REVOCABLE (409)."
        test_recipe:
          setup:
            - "Logical clock at 2026-03-01T00:00:00Z; plan SM-4, IN_NETWORK provider, member with an open-ended PRIMARY coverage from 2026-01-01, one Authorization already REVOKED."
          setup_api_calls:
            - call: "POST /adjudication/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /adjudication/benefit-plans"
              payload: { plan_code: "SM-4", name: "State Machine Plan Four", deductible_individual_cents: 0, oop_max_individual_cents: 1000000, coinsurance_member_pct: 0 }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /adjudication/providers"
              payload: { npi: "2000000010", name: "SM4 Imaging", network_status: "IN_NETWORK" }
              as: PlanAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /adjudication/members"
              payload: { member_number: "M-SM-4", plan_id: "${plan_id}" }
              as: PlanAdmin
              captures: { mem_id: $.data.id }
            - call: "POST /adjudication/members/${mem_id}/coverages"
              payload: { effective_date: "2026-01-01", cob_order: "PRIMARY" }
              as: PlanAdmin
            - call: "POST /adjudication/authorizations"
              payload: { member_id: "${mem_id}", provider_id: "${prov_id}", procedure_code: "73721", authorized_units: 4, valid_from: "2026-01-01", valid_to: "2026-12-31" }
              as: UtilizationReviewer
              captures: { auth_id: $.data.id }
            - call: "POST /adjudication/authorizations/${auth_id}/revoke"
              payload: {}
              as: UtilizationReviewer
              captures: { st_first: $.data.status }
          trigger:
            - call: "POST /adjudication/authorizations/${auth_id}/revoke"
              payload: {}
              as: UtilizationReviewer
              captures: { err_id: $.data.error_id }
          assert:
            - "${st_first} == REVOKED"
            - "${err_id} == ERR_AUTHORIZATION_NOT_REVOCABLE"
            - "HTTP status is 409"
            - "Authorization.${auth_id}.units_consumed == 0"

      - name: terminate_an_already_terminated_coverage_returns_coverage_already_terminated
        claim_type: invalid_transitions
        grounds:
          - state_machines.MemberCoverage.status.ACTIVE_to_TERMINATED
          - errors[ERR_COVERAGE_ALREADY_TERMINATED]
        distinguishing_aspect: "The coverage terminate transition only accepts status ACTIVE, so terminating twice returns ERR_COVERAGE_ALREADY_TERMINATED (409) and the first term_date is not overwritten."
        test_recipe:
          setup:
            - "Logical clock at 2026-03-01T00:00:00Z; plan SM-5 and member M-SM-5 with one open-ended PRIMARY coverage from 2026-01-01, already terminated at 2026-02-15."
          setup_api_calls:
            - call: "POST /adjudication/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /adjudication/benefit-plans"
              payload: { plan_code: "SM-5", name: "State Machine Plan Five", deductible_individual_cents: 0, oop_max_individual_cents: 1000000, coinsurance_member_pct: 0 }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /adjudication/members"
              payload: { member_number: "M-SM-5", plan_id: "${plan_id}" }
              as: PlanAdmin
              captures: { mem_id: $.data.id }
            - call: "POST /adjudication/members/${mem_id}/coverages"
              payload: { effective_date: "2026-01-01", cob_order: "PRIMARY" }
              as: PlanAdmin
              captures: { cov_id: $.data.id }
            - call: "POST /adjudication/coverages/${cov_id}/terminate"
              payload: { term_date: "2026-02-15" }
              as: PlanAdmin
              captures: { st_first: $.data.status, term_first: $.data.term_date }
          trigger:
            - call: "POST /adjudication/coverages/${cov_id}/terminate"
              payload: { term_date: "2026-04-01" }
              as: PlanAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "${st_first} == TERMINATED and ${term_first} == 2026-02-15"
            - "${err_id} == ERR_COVERAGE_ALREADY_TERMINATED"
            - "HTTP status is 409"
            - "MemberCoverage.${cov_id}.term_date == 2026-02-15 (the second date was not applied)"
            - "Member.${mem_id}.status == TERMINATED (no interval contains the 2026-03-01 clock date)"

      - name: adjudicate_a_duplicate_rejected_claim_returns_invalid_claim_state
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Claim.status.RECEIVED_to_DUPLICATE_REJECTED
          - errors[ERR_INVALID_CLAIM_STATE]
        distinguishing_aspect: "DUPLICATE_REJECTED is a terminal Claim state, so adjudicating a duplicate-rejected claim returns ERR_INVALID_CLAIM_STATE (409) and the claim never prices."
        test_recipe:
          setup:
            - "Logical clock at 2026-03-01T00:00:00Z; plan SM-6, IN_NETWORK provider, fee schedule rate 99213 = 10000, member with an open-ended PRIMARY coverage from 2026-01-01."
            - "Claim CLM-SM-6A is RECEIVED and CLM-SM-6B repeats its line exactly, so CLM-SM-6B is DUPLICATE_REJECTED."
          setup_api_calls:
            - call: "POST /adjudication/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /adjudication/benefit-plans"
              payload: { plan_code: "SM-6", name: "State Machine Plan Six", deductible_individual_cents: 0, oop_max_individual_cents: 1000000, coinsurance_member_pct: 0 }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /adjudication/providers"
              payload: { npi: "2000000011", name: "SM6 Clinic", network_status: "IN_NETWORK" }
              as: PlanAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /adjudication/benefit-plans/${plan_id}/fee-schedule-rates"
              payload: { procedure_code: "99213", allowed_amount_cents: 10000, effective_date: "2026-01-01" }
              as: NetworkManager
            - call: "POST /adjudication/members"
              payload: { member_number: "M-SM-6", plan_id: "${plan_id}" }
              as: PlanAdmin
              captures: { mem_id: $.data.id }
            - call: "POST /adjudication/members/${mem_id}/coverages"
              payload: { effective_date: "2026-01-01", cob_order: "PRIMARY" }
              as: PlanAdmin
            - call: "POST /adjudication/claims"
              payload: { claim_number: "CLM-SM-6A", member_id: "${mem_id}", provider_id: "${prov_id}", lines: [{ line_number: 1, procedure_code: "99213", units: 1, billed_amount_cents: 10000, service_date: "2026-02-10" }] }
              as: ClaimsIntake
              captures: { ca_id: $.data.id }
            - call: "POST /adjudication/claims"
              payload: { claim_number: "CLM-SM-6B", member_id: "${mem_id}", provider_id: "${prov_id}", lines: [{ line_number: 1, procedure_code: "99213", units: 1, billed_amount_cents: 10000, service_date: "2026-02-10" }] }
              as: ClaimsIntake
              captures: { cb_id: $.data.id, cb_st: $.data.status }
          trigger:
            - call: "POST /adjudication/claims/${cb_id}/adjudicate"
              payload: {}
              as: ClaimsExaminer
              captures: { err_id: $.data.error_id }
          assert:
            - "${cb_st} == DUPLICATE_REJECTED"
            - "${err_id} == ERR_INVALID_CLAIM_STATE"
            - "HTTP status is 409"
            - "Claim.${cb_id}.total_allowed_cents == 0 and adjudication_pass == 0"

      - name: finalizing_a_denied_claim_issues_zero_pay_remittance_without_touching_accumulator
        claim_type: conditional_cascade
        grounds:
          - state_machines.Claim.status.DENIED_to_FINALIZED
          - state_machines.RemittanceAdvice.status.ISSUED_to_VOIDED
          - entities.RemittanceAdvice.fields.total_plan_paid_cents
          - entities.BenefitAccumulator.fields.remitted_claim_count
        distinguishing_aspect: "The finalize cascade is conditional on the claim's status: from DENIED it creates a RemittanceAdvice with total_plan_paid_cents 0 and leaves BenefitAccumulator.deductible_applied_cents, oop_applied_cents and remitted_claim_count all at 0."
        test_recipe:
          setup:
            - "Logical clock at 2026-03-01T00:00:00Z; plan SM-7 (deductible 50000, coinsurance 0.20), IN_NETWORK provider, fee schedule rate 73721 = 40000."
            - "Member M-SM-7 has exactly one coverage segment [2026-01-01, 2026-02-01), so a claim serviced 2026-02-10 adjudicates to DENIED with DENY_NO_COVERAGE."
          setup_api_calls:
            - call: "POST /adjudication/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /adjudication/benefit-plans"
              payload: { plan_code: "SM-7", name: "State Machine Plan Seven", deductible_individual_cents: 50000, oop_max_individual_cents: 300000, coinsurance_member_pct: 0.20 }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /adjudication/providers"
              payload: { npi: "2000000012", name: "SM7 Clinic", network_status: "IN_NETWORK" }
              as: PlanAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /adjudication/benefit-plans/${plan_id}/fee-schedule-rates"
              payload: { procedure_code: "73721", allowed_amount_cents: 40000, effective_date: "2026-01-01" }
              as: NetworkManager
            - call: "POST /adjudication/members"
              payload: { member_number: "M-SM-7", plan_id: "${plan_id}" }
              as: PlanAdmin
              captures: { mem_id: $.data.id }
            - call: "POST /adjudication/members/${mem_id}/coverages"
              payload: { effective_date: "2026-01-01", term_date: "2026-02-01", cob_order: "PRIMARY" }
              as: PlanAdmin
            - call: "POST /adjudication/claims"
              payload: { claim_number: "CLM-SM-7", member_id: "${mem_id}", provider_id: "${prov_id}", lines: [{ line_number: 1, procedure_code: "73721", units: 1, billed_amount_cents: 60000, service_date: "2026-02-10" }] }
              as: ClaimsIntake
              captures: { c_id: $.data.id }
            - call: "POST /adjudication/claims/${c_id}/adjudicate"
              payload: {}
              as: ClaimsExaminer
              captures: { st_denied: $.data.status, reason_denied: $.data.deny_reason_code }
          trigger:
            - call: "POST /adjudication/claims/${c_id}/finalize"
              payload: {}
              as: ClaimsExaminer
              captures: { st_final: $.data.status, pay_final: $.data.payment_status }
          assert:
            - "${st_denied} == DENIED and ${reason_denied} == DENY_NO_COVERAGE"
            - "${st_final} == FINALIZED and ${pay_final} == REMITTED"
            - "GET /adjudication/claims/${c_id}/remittances returns total_count == 1 with status == ISSUED and total_plan_paid_cents == 0"
            - "GET /adjudication/members/${mem_id}/accumulators shows deductible_applied_cents == 0, oop_applied_cents == 0 and remitted_claim_count == 0"

      - name: override_approve_consumes_authorization_units_beyond_the_granted_amount
        claim_type: side_effect_execution
        grounds:
          - state_machines.Claim.status.PENDED_to_ADJUDICATED
          - state_machines.ClaimLine.line_status.PENDED_to_PRICED
          - entities.Authorization.fields.units_consumed
        distinguishing_aspect: "A MedicalDirector APPROVE override drives Authorization.units_consumed from 0 to 3 against a grant of only 1 unit, and the authorization re-derives to EXHAUSTED rather than rejecting the override."
        test_recipe:
          setup:
            - "Logical clock at 2026-03-01T00:00:00Z; plan SM-8 (deductible 0, coinsurance 0), IN_NETWORK provider, fee schedule rate 73721 = 40000, one AUTH_REQUIRED EditRule on 73721 (severity PEND, precedence_rank 30)."
            - "Member M-SM-8 has one open-ended PRIMARY coverage segment from 2026-01-01 and one Authorization with authorized_units 1 covering 2026-01-01..2026-12-31."
            - "Claim CLM-SM-8 carries one 73721 line with 3 units billed 200000 and has been adjudicated by X-User-ID u-examiner-8, so it is PENDED with PEND_AUTH_UNITS_EXCEEDED."
          setup_api_calls:
            - call: "POST /adjudication/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /adjudication/benefit-plans"
              payload: { plan_code: "SM-8", name: "State Machine Plan Eight", deductible_individual_cents: 0, oop_max_individual_cents: 1000000, coinsurance_member_pct: 0 }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /adjudication/providers"
              payload: { npi: "2000000013", name: "SM8 Imaging", network_status: "IN_NETWORK" }
              as: PlanAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /adjudication/benefit-plans/${plan_id}/fee-schedule-rates"
              payload: { procedure_code: "73721", allowed_amount_cents: 40000, effective_date: "2026-01-01" }
              as: NetworkManager
            - call: "POST /adjudication/edit-rules"
              payload: { rule_code: "MP-73721-AUTH-H", edit_type: "AUTH_REQUIRED", primary_code: "73721", severity: "PEND", precedence_rank: 30, reason_code: "PEND_AUTH_MISSING" }
              as: PlanAdmin
            - call: "POST /adjudication/members"
              payload: { member_number: "M-SM-8", plan_id: "${plan_id}" }
              as: PlanAdmin
              captures: { mem_id: $.data.id }
            - call: "POST /adjudication/members/${mem_id}/coverages"
              payload: { effective_date: "2026-01-01", cob_order: "PRIMARY" }
              as: PlanAdmin
            - call: "POST /adjudication/authorizations"
              payload: { member_id: "${mem_id}", provider_id: "${prov_id}", procedure_code: "73721", authorized_units: 1, valid_from: "2026-01-01", valid_to: "2026-12-31" }
              as: UtilizationReviewer
              captures: { auth_id: $.data.id }
            - call: "POST /adjudication/claims"
              payload: { claim_number: "CLM-SM-8", member_id: "${mem_id}", provider_id: "${prov_id}", lines: [{ line_number: 1, procedure_code: "73721", units: 3, billed_amount_cents: 200000, service_date: "2026-02-10" }] }
              as: ClaimsIntake
              captures: { c_id: $.data.id }
            - call: "POST /adjudication/claims/${c_id}/adjudicate"
              payload: {}
              as: ClaimsExaminer
              as_user_id: "u-examiner-8"
              captures: { st_pend: $.data.status, reason_pend: $.data.pend_reason_code }
          trigger:
            - call: "POST /adjudication/claims/${c_id}/override"
              payload: { decision: "APPROVE" }
              as: MedicalDirector
              as_user_id: "u-md-8"
              captures: { st_after: $.data.status, allowed_after: $.data.total_allowed_cents, pend_after: $.data.pend_reason_code }
          assert:
            - "${st_pend} == PENDED and ${reason_pend} == PEND_AUTH_UNITS_EXCEEDED"
            - "${st_after} == ADJUDICATED and ${pend_after} == null"
            - "${allowed_after} == 120000"
            - "Authorization.${auth_id}.units_consumed == 3 and status == EXHAUSTED"
            - "GET /adjudication/claim-lines?claim_id=${c_id} returns one line with line_status == PRICED and authorization_id == ${auth_id}"

      - name: other_payer_payment_on_a_finalized_claim_returns_invalid_claim_state
        claim_type: invalid_transitions
        grounds:
          - state_machines.Claim.status.ADJUDICATED_to_RECEIVED
          - errors[ERR_INVALID_CLAIM_STATE]
          - validations[priority=30]
        distinguishing_aspect: "COB posting accepts exactly {RECEIVED, PENDED, ADJUDICATED}, so posting against a FINALIZED claim returns ERR_INVALID_CLAIM_STATE (409) even when the supplied expected_claim_version is current."
        test_recipe:
          setup:
            - "Logical clock at 2026-03-01T00:00:00Z; plan SM-9 (deductible 0, coinsurance 0), IN_NETWORK provider, fee schedule rate 73721 = 40000, member with an open-ended SECONDARY coverage from 2026-01-01."
            - "Claim CLM-SM-9 reported other_payer_paid_cents 0 at intake, was adjudicated and then finalized, so it is FINALIZED / REMITTED."
          setup_api_calls:
            - call: "POST /adjudication/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /adjudication/benefit-plans"
              payload: { plan_code: "SM-9", name: "State Machine Plan Nine", deductible_individual_cents: 0, oop_max_individual_cents: 1000000, coinsurance_member_pct: 0 }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /adjudication/providers"
              payload: { npi: "2000000014", name: "SM9 Clinic", network_status: "IN_NETWORK" }
              as: PlanAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /adjudication/benefit-plans/${plan_id}/fee-schedule-rates"
              payload: { procedure_code: "73721", allowed_amount_cents: 40000, effective_date: "2026-01-01" }
              as: NetworkManager
            - call: "POST /adjudication/members"
              payload: { member_number: "M-SM-9", plan_id: "${plan_id}" }
              as: PlanAdmin
              captures: { mem_id: $.data.id }
            - call: "POST /adjudication/members/${mem_id}/coverages"
              payload: { effective_date: "2026-01-01", cob_order: "SECONDARY", other_payer_name: "Other Health" }
              as: PlanAdmin
            - call: "POST /adjudication/claims"
              payload: { claim_number: "CLM-SM-9", member_id: "${mem_id}", provider_id: "${prov_id}", other_payer_paid_cents: 0, lines: [{ line_number: 1, procedure_code: "73721", units: 1, billed_amount_cents: 60000, service_date: "2026-02-10" }] }
              as: ClaimsIntake
              captures: { c_id: $.data.id }
            - call: "POST /adjudication/claims/${c_id}/adjudicate"
              payload: {}
              as: ClaimsExaminer
            - call: "POST /adjudication/claims/${c_id}/finalize"
              payload: {}
              as: ClaimsExaminer
              captures: { c_ver: $.data.version }
          trigger:
            - call: "POST /adjudication/claims/${c_id}/other-payer-payment"
              payload: { other_payer_paid_cents: 5000, expected_claim_version: "${c_ver}" }
              as: ClaimsIntake
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_INVALID_CLAIM_STATE"
            - "HTTP status is 409, not 412"
            - "Claim.${c_id}.status == FINALIZED and other_payer_paid_cents == 0"

      - name: error_claim_pends_and_repends_across_passes
        claim_type: cyclic
        grounds: [state_machines.Claim.status.PENDED_to_PENDED]
        excluded_because:
          difficulty_instance: non_linear_state_machine / claim_pended_self_loop_then_adjudicated_back_to_received_on_cob_post
          rationale: "The PENDED self-loop, the PENDED -> ADJUDICATED edge and the ADJUDICATED -> RECEIVED reprocessing edge are all asserted by the named §1.8 instance."

      - name: error_void_cascade_end_to_end
        claim_type: compensation
        grounds: [state_machines.Claim.status.FINALIZED_to_VOIDED]
        excluded_because:
          difficulty_instance: transitive_cascade / void_cascade_reverses_remittance_accumulator_lines_and_auth_units
          rationale: "The six-hop void compensation chain is asserted hop by hop in the named §1.8 instance."

  # ===========================================================================
  - section: calculations
    instances:
      - name: out_of_network_penalty_applies_only_when_no_active_contract_prices_the_line
        claim_type: variant_selection
        grounds:
          - calculations.line_allowed_amount
          - entities.Provider.fields.network_status
          - entities.BenefitPlan.fields.out_of_network_penalty_pct
        distinguishing_aspect: "The same OUT_OF_NETWORK provider yields allowed 28000 under FEE_SCHEDULE_PRICED (40000 x 0.70) and 30200 under CONTRACT_PRICED (40000 x 0.755), proving the penalty is skipped entirely once a contract prices the line."
        test_recipe:
          setup:
            - "Logical clock at 2026-03-01T00:00:00Z; plan OON-1 with deductible 0, oop_max 1000000, coinsurance 0 and the default out_of_network_penalty_pct 0.30."
            - "Provider Sigma Imaging is OUT_OF_NETWORK; fee schedule rate 73721 = 40000 effective 2026-01-01."
            - "Member M-OON-1 has one open-ended PRIMARY coverage segment from 2026-01-01."
            - "Claim CLM-OON-1 (billed 60000) is adjudicated while no contract exists; a PCT_OF_FEE_SCHEDULE contract at 0.755 is then created and activated before claim CLM-OON-2 (billed 61000) is adjudicated."
          setup_api_calls:
            - call: "POST /adjudication/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /adjudication/benefit-plans"
              payload: { plan_code: "OON-1", name: "Out Of Network Plan", deductible_individual_cents: 0, oop_max_individual_cents: 1000000, coinsurance_member_pct: 0 }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /adjudication/providers"
              payload: { npi: "2000000015", name: "Sigma Imaging", network_status: "OUT_OF_NETWORK" }
              as: PlanAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /adjudication/benefit-plans/${plan_id}/fee-schedule-rates"
              payload: { procedure_code: "73721", allowed_amount_cents: 40000, effective_date: "2026-01-01" }
              as: NetworkManager
            - call: "POST /adjudication/members"
              payload: { member_number: "M-OON-1", plan_id: "${plan_id}" }
              as: PlanAdmin
              captures: { mem_id: $.data.id }
            - call: "POST /adjudication/members/${mem_id}/coverages"
              payload: { effective_date: "2026-01-01", cob_order: "PRIMARY" }
              as: PlanAdmin
            - call: "POST /adjudication/claims"
              payload: { claim_number: "CLM-OON-1", member_id: "${mem_id}", provider_id: "${prov_id}", lines: [{ line_number: 1, procedure_code: "73721", units: 1, billed_amount_cents: 60000, service_date: "2026-02-10" }] }
              as: ClaimsIntake
              captures: { c1_id: $.data.id }
          trigger:
            - call: "POST /adjudication/claims/${c1_id}/adjudicate"
              payload: {}
              as: ClaimsExaminer
              captures: { allowed1: $.data.total_allowed_cents, variant1: $.data.pricing_variant }
            - call: "POST /adjudication/contracts"
              payload: { provider_id: "${prov_id}", plan_id: "${plan_id}", effective_date: "2026-01-01", term_date: "2026-12-31", pricing_method: "PCT_OF_FEE_SCHEDULE", contract_pct: 0.755 }
              as: NetworkManager
              captures: { ctr_id: $.data.id }
            - call: "POST /adjudication/contracts/${ctr_id}/activate"
              payload: {}
              as: NetworkManager
            - call: "POST /adjudication/claims"
              payload: { claim_number: "CLM-OON-2", member_id: "${mem_id}", provider_id: "${prov_id}", lines: [{ line_number: 1, procedure_code: "73721", units: 1, billed_amount_cents: 61000, service_date: "2026-02-10" }] }
              as: ClaimsIntake
              captures: { c2_id: $.data.id }
            - call: "POST /adjudication/claims/${c2_id}/adjudicate"
              payload: {}
              as: ClaimsExaminer
              captures: { allowed2: $.data.total_allowed_cents, variant2: $.data.pricing_variant }
          assert:
            - "${allowed1} == 28000 and ${variant1} == FEE_SCHEDULE_PRICED"
            - "${allowed2} == 30200 and ${variant2} == CONTRACT_PRICED"

      - name: case_rate_prorata_uses_largest_remainder_with_line_number_tie_break
        claim_type: waterfall_allocation
        grounds:
          - calculations.case_rate_prorata_allocation
          - entities.ProviderContract.fields.case_rate_cents
          - entities.Claim.fields.pricing_variant
        distinguishing_aspect: "A 50000-cent case rate split across lines billed 30000 / 20000 / 10000 floors to 25000 / 16666 / 8333 and the single leftover cent goes to line 2 (largest fractional part 0.666), so the per-line allowed amounts are 25000 / 16667 / 8333 and sum to exactly 50000."
        test_recipe:
          setup:
            - "Logical clock at 2026-03-01T00:00:00Z; plan CASE-1 with deductible 0, oop_max 1000000 and coinsurance 0."
            - "IN_NETWORK provider Tau Surgical with an ACTIVE CASE_RATE contract of 50000 cents covering 2026-01-01..2026-12-31."
            - "Fee schedule rates exist for all three billed codes so no line is denied: 73721 = 40000, 82947 = 3333, 80053 = 6000."
            - "Member M-CASE-1 has one open-ended PRIMARY coverage segment from 2026-01-01."
            - "Claim CLM-CASE-1 carries lines 1/2/3 billed 30000 / 20000 / 10000, all 1 unit, service date 2026-02-10, so total billed is 60000."
          setup_api_calls:
            - call: "POST /adjudication/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /adjudication/benefit-plans"
              payload: { plan_code: "CASE-1", name: "Case Rate Plan", deductible_individual_cents: 0, oop_max_individual_cents: 1000000, coinsurance_member_pct: 0 }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /adjudication/providers"
              payload: { npi: "2000000016", name: "Tau Surgical", network_status: "IN_NETWORK" }
              as: PlanAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /adjudication/benefit-plans/${plan_id}/fee-schedule-rates"
              payload: { procedure_code: "73721", allowed_amount_cents: 40000, effective_date: "2026-01-01" }
              as: NetworkManager
            - call: "POST /adjudication/benefit-plans/${plan_id}/fee-schedule-rates"
              payload: { procedure_code: "82947", allowed_amount_cents: 3333, effective_date: "2026-01-01" }
              as: NetworkManager
            - call: "POST /adjudication/benefit-plans/${plan_id}/fee-schedule-rates"
              payload: { procedure_code: "80053", allowed_amount_cents: 6000, effective_date: "2026-01-01" }
              as: NetworkManager
            - call: "POST /adjudication/contracts"
              payload: { provider_id: "${prov_id}", plan_id: "${plan_id}", effective_date: "2026-01-01", term_date: "2026-12-31", pricing_method: "CASE_RATE", case_rate_cents: 50000 }
              as: NetworkManager
              captures: { ctr_id: $.data.id }
            - call: "POST /adjudication/contracts/${ctr_id}/activate"
              payload: {}
              as: NetworkManager
            - call: "POST /adjudication/members"
              payload: { member_number: "M-CASE-1", plan_id: "${plan_id}" }
              as: PlanAdmin
              captures: { mem_id: $.data.id }
            - call: "POST /adjudication/members/${mem_id}/coverages"
              payload: { effective_date: "2026-01-01", cob_order: "PRIMARY" }
              as: PlanAdmin
            - call: "POST /adjudication/claims"
              payload: { claim_number: "CLM-CASE-1", member_id: "${mem_id}", provider_id: "${prov_id}", lines: [{ line_number: 1, procedure_code: "73721", units: 1, billed_amount_cents: 30000, service_date: "2026-02-10" }, { line_number: 2, procedure_code: "82947", units: 1, billed_amount_cents: 20000, service_date: "2026-02-10" }, { line_number: 3, procedure_code: "80053", units: 1, billed_amount_cents: 10000, service_date: "2026-02-10" }] }
              as: ClaimsIntake
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /adjudication/claims/${c_id}/adjudicate"
              payload: {}
              as: ClaimsExaminer
              captures: { allowed: $.data.total_allowed_cents, variant: $.data.pricing_variant }
          assert:
            - "${variant} == CASE_RATE_PRICED"
            - "${allowed} == 50000"
            - "GET /adjudication/claim-lines?claim_id=${c_id} line_number 1 has allowed_amount_cents == 25000"
            - "GET /adjudication/claim-lines?claim_id=${c_id} line_number 2 has allowed_amount_cents == 16667"
            - "GET /adjudication/claim-lines?claim_id=${c_id} line_number 3 has allowed_amount_cents == 8333"

      - name: copay_line_skips_deductible_and_leaves_remaining_deductible_untouched
