      - name: rejected_listing_is_terminal_and_admits_no_further_submission
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.CertificationListing.terminal_states
          - validations[priority=16]
        distinguishing_aspect: "REJECTED is terminal even though CONDITIONS_REQUESTED -- the other post-review outcome -- is re-submittable: a submission on a REJECTED listing must fail with ERR_LISTING_STATE_INVALID and must not increment revision."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; ELECTRIC model with an AGENCY_GAMMA listing driven to REJECTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /equipment-models"
              payload: { model_code: "FRY-900", name: "Fryer 900", category: "FRYER", energy_type: "ELECTRIC", base_price_cents: 1850020, supported_controls_packages: ["STANDARD_DIAL"], rated_throughput_units_per_hour: 120 }
