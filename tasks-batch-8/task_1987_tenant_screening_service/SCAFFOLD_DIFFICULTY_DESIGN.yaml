        grounds:
          - validations[priority=6]
          - validations[priority=8]
          - errors[ERR_APPLICATION_TERMINAL]
          - errors[ERR_CONSENT_REQUIRED]
        distinguishing_aspect: |
          Error-category pair state vs business_safety: record-searches on a WITHDRAWN application that
          also lacks consent violates priority 6 (state) and priority 8 (safety); the state error
          ERR_APPLICATION_TERMINAL (409) must win over ERR_CONSENT_REQUIRED.
