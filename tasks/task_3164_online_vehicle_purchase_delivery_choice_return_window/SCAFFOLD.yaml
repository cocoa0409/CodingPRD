    code: 201
    input: [area, severity, deduction_cents, image_count]
    output: ImperfectionAnnotation
    side_effects: ["recomputes vehicle.listed_price_cents and annotation_count when vehicle LISTED", "increments Vehicle.version by 1 when price recomputed"]

  - method: GET
    path: "/vehicle-hub/vehicles/{id}/annotations"
    description: "List annotations for a vehicle"
    roles: [PlatformAdmin, ReconOperator, Customer, CustomerAdvocate, WarrantyAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ImperfectionAnnotation[]
    side_effects: []

  - method: POST
    path: "/vehicle-hub/annotations/{id}/retract"
    description: "Retract an annotation; recomputes listed price"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: ImperfectionAnnotation
    side_effects: ["annotation ACTIVE -> RETRACTED", "recomputes vehicle.listed_price_cents and annotation_count", "increments Vehicle.version by 1"]

  - method: POST
    path: "/vehicle-hub/financing/prequalify"
    description: "Create a financing pre-qualification with real-time terms"
    roles: [Customer]
    code: 201
    input: [annual_income_cents, credit_band, "conservative_mode?"]
    output: FinancingPrequalification
    side_effects: ["runs calculation prequalification_terms", "sets expires_at = created_at + 14 days"]

  - method: GET
    path: "/vehicle-hub/financing/{id}"
    description: "Fetch a prequalification (sweeps expiry)"
    roles: [Customer, PlatformAdmin]
    code: 200
    input: []
    output: FinancingPrequalification
    side_effects: ["PREQUALIFIED -> EXPIRED when current_utc > expires_at"]

  - method: GET
    path: "/vehicle-hub/financing"
    description: "List prequalifications, filterable by customer"
    roles: [Customer, PlatformAdmin]
    code: 200
    input: ["customer_id?", "status?", "locked_order_id?", "limit?", "offset?"]
    output: FinancingPrequalification[]
    side_effects: []

  - method: POST
    path: "/vehicle-hub/trade-ins"
    description: "Submit a trade-in questionnaire and receive an initial offer"
    roles: [Customer]
    code: 201
    input: [vin, questionnaire]
    output: TradeInOffer
    side_effects: ["runs calculation trade_in_initial_offer", "sets expires_at = created_at + 7 days"]

  - method: GET
    path: "/vehicle-hub/trade-ins/{id}"
    description: "Fetch a trade-in offer (sweeps expiry)"
    roles: [Customer, CustomerAdvocate, PlatformAdmin]
    code: 200
    input: []
    output: TradeInOffer
    side_effects: ["OFFERED -> EXPIRED when current_utc > expires_at"]

  - method: GET
    path: "/vehicle-hub/trade-ins"
    description: "List trade-in offers, filterable by customer"
    roles: [Customer, CustomerAdvocate, PlatformAdmin]
    code: 200
    input: ["customer_id?", "status?", "limit?", "offset?"]
    output: TradeInOffer[]
    side_effects: []

  - method: POST
    path: "/vehicle-hub/trade-ins/{id}/inspect"
    description: "Advocate inspects the trade-in at pickup; computes adjusted offer"
    roles: [CustomerAdvocate]
    code: 200
    input: [accident_history_found, mechanical_issues_found, smoker_detected, tire_condition_observed]
    output: TradeInOffer
    side_effects: ["runs calculation trade_in_adjustment", "OFFERED -> INSPECTED", "increments TradeInOffer.version by 1"]

  - method: POST
    path: "/vehicle-hub/trade-ins/{id}/confirm"
    description: "Customer accepts the adjusted offer"
    roles: [Customer]
    code: 200
    input: []
    output: TradeInOffer
    side_effects: ["INSPECTED -> CONFIRMED", "recomputes total_due_cents on referencing DRAFT/RESERVED orders", "increments TradeInOffer.version by 1"]

  - method: POST
    path: "/vehicle-hub/trade-ins/{id}/decline"
    description: "Customer declines the adjusted offer"
    roles: [Customer]
    code: 200
    input: []
    output: TradeInOffer
    side_effects: ["INSPECTED -> DECLINED", "referencing DRAFT/RESERVED orders clear trade_in_offer_id and recompute total_due_cents", "increments TradeInOffer.version by 1"]

  - method: POST
    path: "/vehicle-hub/orders"
    description: "Create a purchase order in DRAFT"
    roles: [Customer]
    code: 201
    input: [vehicle_id, fulfillment_choice, "trade_in_offer_id?"]
    output: PurchaseOrder
    side_effects: ["copies state_code from customer", "initializes payment_status UNPAID, delivery_status NOT_SCHEDULED"]

  - method: GET
    path: "/vehicle-hub/orders/{id}"
    description: "Fetch an order"
    roles: [Customer, PlatformAdmin, CustomerAdvocate, WarrantyAdmin, RegistrationClerk]
    code: 200
    input: []
    output: PurchaseOrder
    side_effects: []

  - method: GET
    path: "/vehicle-hub/orders"
    description: "List orders with filters"
    roles: [Customer, PlatformAdmin, CustomerAdvocate, WarrantyAdmin, RegistrationClerk]
    code: 200
    input: ["customer_id?", "vehicle_id?", "trade_in_offer_id?", "financing_id?", "status?", "payment_status?", "delivery_status?", "limit?", "offset?"]
    output: PurchaseOrder[]
    side_effects: []

  - method: POST
    path: "/vehicle-hub/orders/{id}/fulfillment-choice"
    description: "Switch fulfillment choice while order is DRAFT or RESERVED"
    roles: [Customer]
    code: 200
    input: [fulfillment_choice]
    output: PurchaseOrder
    side_effects: ["increments PurchaseOrder.version by 1"]

  - method: POST
    path: "/vehicle-hub/orders/{id}/reserve"
    description: "Reserve the vehicle for the order (OCC on vehicle version)"
    roles: [Customer]
    code: 200
    input: [expected_vehicle_version]
    output: PurchaseOrder
    side_effects: ["Vehicle LISTED -> RESERVED", "order DRAFT -> RESERVED", "increments PurchaseOrder.version by 1", "increments Vehicle.version by 1"]

  - method: POST
    path: "/vehicle-hub/orders/{id}/structure"
    description: "Structure payment: cash or financed with a prequalification"
    roles: [Customer]
    code: 200
    input: ["financing_id?", "down_payment_cents?"]
    output: PurchaseOrder
    side_effects: ["runs calculation financed_terms", "locks prequalification when financed", "creates TitleRegistration PENDING", "order RESERVED -> STRUCTURED", "increments PurchaseOrder.version by 1"]

  - method: POST
    path: "/vehicle-hub/orders/{id}/appointments"
    description: "Book a delivery appointment (OCC on order version)"
    roles: [Customer]
    code: 201
    input: [expected_order_version, market_code, "address_region?", "vending_site_code?", start_at, end_at]
    output: DeliveryAppointment
    side_effects: ["order STRUCTURED -> APPOINTMENT_SET", "order.delivery_status -> SCHEDULED", "increments PurchaseOrder.version by 1"]

  - method: GET
    path: "/vehicle-hub/appointments/{id}"
    description: "Fetch an appointment"
    roles: [Customer, CustomerAdvocate, PlatformAdmin]
    code: 200
    input: []
    output: DeliveryAppointment
    side_effects: []

  - method: GET
    path: "/vehicle-hub/appointments"
    description: "List appointments"
    roles: [Customer, CustomerAdvocate, PlatformAdmin]
    code: 200
    input: ["order_id?", "market_code?", "status?", "limit?", "offset?"]
    output: DeliveryAppointment[]
    side_effects: []

  - method: POST
    path: "/vehicle-hub/appointments/{id}/cancel"
    description: "Cancel a scheduled appointment; order reverts APPOINTMENT_SET -> STRUCTURED"
    roles: [Customer]
    code: 200
    input: []
    output: DeliveryAppointment
    side_effects: ["appointment SCHEDULED -> CANCELLED", "order APPOINTMENT_SET -> STRUCTURED and delivery_status -> NOT_SCHEDULED", "increments PurchaseOrder.version by 1"]

  - method: POST
    path: "/vehicle-hub/appointments/{id}/no-show"
    description: "Mark a scheduled appointment as NO_SHOW after its end_at passes"
    roles: [CustomerAdvocate]
    code: 200
    input: []
    output: DeliveryAppointment
    side_effects: ["appointment SCHEDULED -> NO_SHOW", "order APPOINTMENT_SET -> STRUCTURED and delivery_status -> NOT_SCHEDULED", "increments PurchaseOrder.version by 1"]

  - method: POST
    path: "/vehicle-hub/orders/{id}/complete"
    description: "Complete the handoff at the appointment"
    roles: [PlatformAdmin]
    code: 200
    input: [odometer_at_delivery, "payment_confirmed?"]
    output: PurchaseOrder
    side_effects: ["Vehicle RESERVED -> SOLD", "order APPOINTMENT_SET -> COMPLETED; sets delivered_at, return_deadline", "payment_status -> PAID or FINANCED", "vending-machine orders set deposit_cents 25000", "appointment -> COMPLETED", "TitleRegistration PENDING -> TEMP_TAG_ISSUED", "increments PurchaseOrder.version by 1"]

  - method: POST
    path: "/vehicle-hub/orders/{id}/return"
    description: "Initiate the seven-day return"
    roles: [Customer]
    code: 200
    input: [return_mileage, reason_code]
    output: PurchaseOrder
    side_effects: ["order COMPLETED -> RETURN_INITIATED", "payment_status -> REFUND_PENDING", "Vehicle SOLD -> RETURN_INBOUND", "TitleRegistration TEMP_TAG_ISSUED -> BLOCKED when applicable", "increments PurchaseOrder.version by 1"]

  - method: POST
    path: "/vehicle-hub/orders/{id}/cancel"
    description: "Cancel an order before completion with full compensation"
    roles: [Customer, PlatformAdmin]
    code: 200
    input: []
    output: PurchaseOrder
    side_effects: ["Vehicle RESERVED -> LISTED", "prequalification LOCKED -> PREQUALIFIED when locked", "TitleRegistration PENDING deleted", "appointment SCHEDULED -> CANCELLED when set", "increments PurchaseOrder.version by 1"]

  - method: POST
    path: "/vehicle-hub/returns/{orderId}/schedule-pickup"
    description: "Schedule the return transit pickup with buffered crew interval"
    roles: [CustomerAdvocate]
    code: 201
    input: [start_at, end_at]
    output: ReturnTransit
    side_effects: ["creates ReturnTransit PICKUP_SCHEDULED; market copied from vehicle"]

  - method: GET
    path: "/vehicle-hub/orders/{id}/return-transit"
    description: "Fetch the return transit rows for an order (0 or 1); reverse reachability for ReturnTransit.order_id"
    roles: [CustomerAdvocate, PlatformAdmin, Customer]
    code: 200
    input: []
    output: ReturnTransit[]
    side_effects: []

  - method: POST
    path: "/vehicle-hub/returns/{orderId}/transit/pickup"
    description: "Mark the return picked up"
    roles: [CustomerAdvocate]
    code: 200
    input: []
    output: ReturnTransit
    side_effects: ["PICKUP_SCHEDULED -> PICKED_UP", "increments ReturnTransit.version by 1"]

  - method: POST
    path: "/vehicle-hub/returns/{orderId}/transit/arrive"
    description: "Mark the return arrived at the reconditioning center"
    roles: [CustomerAdvocate]
    code: 200
    input: []
    output: ReturnTransit
    side_effects: ["PICKED_UP -> ARRIVED_AT_CENTER", "increments ReturnTransit.version by 1"]

  - method: POST
    path: "/vehicle-hub/returns/{orderId}/intake"
    description: "Advocate intake decision on the returned vehicle; ACCEPT refunds and re-places the vehicle, REJECT restores the sale"
    roles: [CustomerAdvocate]
    code: 200
    input: [inspection_result, "excess_wear?"]
    output: PurchaseOrder
    side_effects: ["ACCEPT: runs refund_amount; vehicle RETURN_INBOUND -> INTAKE; creates ReconIntake PENDING_ARRIVAL; payment REFUND_PENDING -> REFUNDED; order RETURN_INITIATED -> RETURN_COMPLETED; open DefectClaims auto-DENIED; transit -> INTAKE_DONE; TitleRegistration BLOCKED deleted", "REJECT: vehicle RETURN_INBOUND -> REMOVED; payment REFUND_PENDING -> original PAID/FINANCED; order -> COMPLETED; TitleRegistration BLOCKED -> TEMP_TAG_ISSUED; transit -> INTAKE_DONE", "increments PurchaseOrder.version by 1"]

  - method: POST
    path: "/vehicle-hub/title-registrations/{id}/file"
    description: "File title paperwork with the state"
    roles: [RegistrationClerk]
    code: 200
    input: []
    output: TitleRegistration
    side_effects: ["TEMP_TAG_ISSUED -> FILED", "runs calculation registration_timeline; sets filed_at, registration_due_at, processing_mode", "increments TitleRegistration.version by 1"]

  - method: POST
    path: "/vehicle-hub/title-registrations/{id}/register"
    description: "Record completed registration; computes missed_commitment"
    roles: [RegistrationClerk]
    code: 200
    input: []
    output: TitleRegistration
    side_effects: ["FILED -> REGISTERED", "sets missed_commitment", "increments TitleRegistration.version by 1"]

  - method: GET
    path: "/vehicle-hub/title-registrations/{id}"
    description: "Fetch a title registration"
    roles: [RegistrationClerk, PlatformAdmin, CustomerAdvocate]
    code: 200
    input: []
    output: TitleRegistration
    side_effects: []

  - method: GET
    path: "/vehicle-hub/title-registrations"
    description: "List title registrations"
    roles: [RegistrationClerk, PlatformAdmin, CustomerAdvocate]
    code: 200
    input: ["order_id?", "vehicle_id?", "status?", "limit?", "offset?"]
    output: TitleRegistration[]
    side_effects: []

  - method: POST
    path: "/vehicle-hub/defect-claims"
    description: "File a post-sale defect claim against a completed order"
    roles: [Customer]
    code: 201
    input: [order_id, defect_description, defect_area, "current_mileage?"]
    output: DefectClaim
    side_effects: ["computes disclosure_flag from the vehicle's ACTIVE annotation area set"]

  - method: GET
    path: "/vehicle-hub/defect-claims/{id}"
    description: "Fetch a defect claim"
    roles: [Customer, WarrantyAdmin, PlatformAdmin]
    code: 200
    input: []
    output: DefectClaim
    side_effects: []

  - method: GET
    path: "/vehicle-hub/defect-claims"
    description: "List defect claims"
    roles: [Customer, WarrantyAdmin, PlatformAdmin]
    code: 200
    input: ["order_id?", "status?", "limit?", "offset?"]
    output: DefectClaim[]
    side_effects: []

  - method: POST
    path: "/vehicle-hub/defect-claims/{id}/review"
    description: "Move claim FILED -> UNDER_REVIEW"
    roles: [WarrantyAdmin]
    code: 200
    input: []
    output: DefectClaim
    side_effects: ["increments DefectClaim.version by 1"]

  - method: POST
    path: "/vehicle-hub/defect-claims/{id}/authorize"
    description: "Authorize warranty repair with estimate; creates RepairAuthorization"
    roles: [WarrantyAdmin]
    code: 200
    input: [estimate_cents, "review_note?"]
    output: RepairAuthorization
    side_effects: ["runs calculation warranty_coverage", "claim UNDER_REVIEW -> AUTHORIZED", "increments DefectClaim.version by 1"]

  - method: POST
    path: "/vehicle-hub/defect-claims/{id}/deny"
    description: "Deny a claim under review"
    roles: [WarrantyAdmin]
    code: 200
    input: [review_note]
    output: DefectClaim
    side_effects: ["UNDER_REVIEW -> DENIED", "increments DefectClaim.version by 1"]

  - method: POST
    path: "/vehicle-hub/defect-claims/{id}/complete-repair"
    description: "Mark the authorized repair complete"
    roles: [WarrantyAdmin]
    code: 200
    input: []
    output: DefectClaim
    side_effects: ["AUTHORIZED -> REPAIR_COMPLETE", "RepairAuthorization ISSUED -> COMPLETED", "increments DefectClaim.version by 1"]

  - method: GET
    path: "/vehicle-hub/repair-authorizations/{id}"
    description: "Fetch a repair authorization"
    roles: [WarrantyAdmin, PlatformAdmin]
    code: 200
    input: []
    output: RepairAuthorization
    side_effects: []

  - method: GET
    path: "/vehicle-hub/repair-authorizations"
    description: "List repair authorizations"
    roles: [WarrantyAdmin, PlatformAdmin]
    code: 200
    input: ["claim_id?", "status?", "limit?", "offset?"]
    output: RepairAuthorization[]
    side_effects: []

  - method: POST
    path: "/vehicle-hub/repair-authorizations/{id}/void"
    description: "Void an issued authorization; claim stays AUTHORIZED for re-authorization"
    roles: [WarrantyAdmin]
    code: 200
    input: [reason]
    output: RepairAuthorization
    side_effects: ["ISSUED -> VOIDED", "increments RepairAuthorization.version by 1"]

  - method: POST
    path: "/vehicle-hub/recon-intakes"
    description: "Create a reconditioning intake for a vehicle at a center"
    roles: [ReconOperator, PlatformAdmin]
    code: 201
    input: [vehicle_id, center_id]
    output: ReconIntake
    side_effects: []

  - method: GET
    path: "/vehicle-hub/recon-intakes/{id}"
    description: "Fetch an intake"
    roles: [ReconOperator, PlatformAdmin]
    code: 200
    input: []
    output: ReconIntake
    side_effects: []

  - method: GET
    path: "/vehicle-hub/recon-intakes"
    description: "List intakes"
    roles: [ReconOperator, PlatformAdmin]
    code: 200
    input: ["vehicle_id?", "center_id?", "status?", "limit?", "offset?"]
    output: ReconIntake[]
    side_effects: []

  - method: POST
    path: "/vehicle-hub/recon-intakes/{id}/arrive"
    description: "Record vehicle arrival at the center (slot-count check)"
    roles: [ReconOperator]
    code: 200
    input: []
    output: ReconIntake
    side_effects: ["PENDING_ARRIVAL -> RECEIVED; sets arrived_at", "RETURN_INBOUND vehicle -> INTAKE", "increments ReconIntake.version by 1"]

  - method: POST
    path: "/vehicle-hub/recon-intakes/{id}/start-work"
    description: "Begin reconditioning work (daily capacity check)"
    roles: [ReconOperator]
    code: 200
    input: []
    output: ReconIntake
    side_effects: ["RECEIVED -> IN_WORK", "vehicle INTAKE/RETURN_INBOUND -> IN_RECON", "increments ReconIntake.version by 1"]

  - method: POST
    path: "/vehicle-hub/recon-intakes/{id}/complete"
    description: "Finish reconditioning work"
    roles: [ReconOperator]
    code: 200
    input: []
    output: ReconIntake
    side_effects: ["IN_WORK -> COMPLETE", "increments ReconIntake.version by 1"]

  - method: POST
    path: "/vehicle-hub/recon-intakes/{id}/cancel"
    description: "Cancel a pending intake"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: ReconIntake
    side_effects: ["PENDING_ARRIVAL -> CANCELLED", "increments ReconIntake.version by 1"]

  - method: GET
    path: "/vehicle-hub/customers/{id}/orders"
    description: "List a customer's orders"
    roles: [Customer, PlatformAdmin, CustomerAdvocate]
    code: 200
    input: ["limit?", "offset?"]
    output: PurchaseOrder[]
    side_effects: []

  - method: GET
    path: "/vehicle-hub/orders/{id}/title-registration"
    description: "Fetch the title registration for an order (0 or 1)"
    roles: [RegistrationClerk, PlatformAdmin, CustomerAdvocate, Customer]
    code: 200
    input: []
    output: TitleRegistration[]
    side_effects: []

  - method: GET
    path: "/vehicle-hub/orders/{id}/defect-claims"
    description: "List defect claims for an order"
    roles: [Customer, WarrantyAdmin, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: DefectClaim[]
    side_effects: []

  - method: GET
    path: "/vehicle-hub/defect-claims/{id}/repair-authorizations"
    description: "List repair authorizations for a claim"
    roles: [WarrantyAdmin, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: RepairAuthorization[]
    side_effects: []

  - method: GET
    path: "/vehicle-hub/vehicles/{id}/recon-intakes"
    description: "List recon intakes for a vehicle"
    roles: [ReconOperator, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: ReconIntake[]
    side_effects: []

  - method: GET
    path: "/vehicle-hub/vehicles/{id}/return-transits"
    description: "List return transits for a vehicle (reverse reachability for ReturnTransit.vehicle_id)"
    roles: [CustomerAdvocate, PlatformAdmin]
    code: 200
    input: ["order_id?", "limit?", "offset?"]
    output: ReturnTransit[]
    side_effects: []

  - method: GET
    path: "/vehicle-hub/vehicles/{id}/defect-claims"
    description: "List defect claims filed against a vehicle (reverse reachability for DefectClaim.vehicle_id)"
    roles: [Customer, WarrantyAdmin, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: DefectClaim[]
    side_effects: []

  - method: GET
    path: "/vehicle-hub/reconditioning-centers/{id}/recon-intakes"
    description: "List intakes at a center"
    roles: [ReconOperator, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ReconIntake[]
    side_effects: []

  - method: GET
    path: "/vehicle-hub/customers/{id}/financing"
    description: "List a customer's prequalifications"
    roles: [Customer, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: FinancingPrequalification[]
    side_effects: []

  - method: GET
    path: "/vehicle-hub/customers/{id}/trade-ins"
    description: "List a customer's trade-in offers"
    roles: [Customer, CustomerAdvocate, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: TradeInOffer[]
    side_effects: []

  - method: GET
    path: "/vehicle-hub/reconditioning-centers/{id}/vehicles"
    description: "List vehicles currently at a center"
    roles: [ReconOperator, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Vehicle[]
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or unknown X-User-Role / X-User-ID headers"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Role not permitted to invoke this endpoint"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path id or referenced FK does not exist"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_<parent>_version does not match the parent's current version (OCC)"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Resource not in a valid from-state for the requested transition"
  - id: ERR_FORBIDDEN_OWNERSHIP
    http: 403
    condition: "Entity-backed actor does not own the target resource"
  - id: ERR_PREQUAL_EXPIRED
    http: 422
    condition: "Prequalification or trade-in offer used after its expires_at"
  - id: ERR_RETURN_WINDOW_CLOSED
    http: 422
    condition: "Return initiated after the 7-day return_deadline"
  - id: ERR_MILEAGE_LIMIT_EXCEEDED
    http: 422
    condition: "Return mileage exceeds odometer_at_delivery + 400"
  - id: ERR_DEFECT_DISCLOSED
    http: 422
    condition: "Authorization attempted on a claim whose defect area was disclosed at sale"
  - id: ERR_WARRANTY_WINDOW_EXPIRED
    http: 422
    condition: "Authorization attempted beyond 100 days or 4189 miles from delivery"
  - id: ERR_APPOINTMENT_CONFLICT
    http: 409
    condition: "Delivery appointment interval overlaps another scheduled interval for the same market or vending site"
  - id: ERR_TRANSIT_SLOT_CONFLICT
    http: 409
    condition: "Return transit buffered interval overlaps another active transit in the same market"
  - id: ERR_RECON_CAPACITY_FULL
    http: 409
    condition: "Center daily capacity or slot count exhausted"
  - id: ERR_REGION_NOT_SERVICED
    http: 422
    condition: "Home-delivery region outside the market serviceability list, or appointment market mismatch"
  - id: ERR_FINANCING_CAP_EXCEEDED
    http: 402
    condition: "amount_financed_cents exceeds prequalification max_amount_cents"
  - id: ERR_DOWN_PAYMENT_TOO_LOW
    http: 402
    condition: "Down payment below 10 percent of total_due_cents on a financed structure"
  - id: ERR_TEMP_TAG_EXPIRED
    http: 422
    condition: "Filing attempted after temp_tag_expires_at"
  - id: ERR_DEPENDENCY_NOT_READY
    http: 409
    condition: "Linked entity not in the required state (intake incomplete; trade-in not CONFIRMED)"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing/invalid required field, bad enum, end_at <= start_at, negative quantity"
  - id: ERR_UNSUPPORTED_STATE
    http: 422
    condition: "state_code not in the supported state table"
  - id: ERR_NO_CENTER_FOR_MARKET
    http: 422
    condition: "No reconditioning center exists for the returned vehicle's market at placement time"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Customer
    description: "Vehicle buyer; acts only on own resources"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /vehicle-hub/financing/prequalify"
      - "POST /vehicle-hub/trade-ins"
      - "POST /vehicle-hub/trade-ins/{id}/confirm"
      - "POST /vehicle-hub/trade-ins/{id}/decline"
      - "POST /vehicle-hub/orders"
      - "POST /vehicle-hub/orders/{id}/fulfillment-choice"
      - "POST /vehicle-hub/orders/{id}/reserve"
      - "POST /vehicle-hub/orders/{id}/structure"
      - "POST /vehicle-hub/orders/{id}/appointments"
      - "POST /vehicle-hub/orders/{id}/return"
      - "POST /vehicle-hub/defect-claims"
    shared_operations:
      - "GET read endpoints for own resources"
      - "POST /vehicle-hub/orders/{id}/cancel"
      - "POST /vehicle-hub/appointments/{id}/cancel"
  - name: PlatformAdmin
    description: "Operator with cross-resource administrative powers; completes deliveries and removes inventory"
    identity: "opaque"
    exclusive_operations:
      - "POST /vehicle-hub/_clock/set_current_utc"
      - "POST /vehicle-hub/customers"
      - "POST /vehicle-hub/reconditioning-centers"
      - "POST /vehicle-hub/vehicles/{id}/remove"
      - "POST /vehicle-hub/annotations/{id}/retract"
      - "POST /vehicle-hub/orders/{id}/complete"
      - "POST /vehicle-hub/recon-intakes/{id}/cancel"
    shared_operations:
      - "GET read endpoints"
      - "POST /vehicle-hub/orders/{id}/cancel"
      - "POST /vehicle-hub/vehicles"
      - "POST /vehicle-hub/vehicles/{id}/annotations"
      - "POST /vehicle-hub/recon-intakes"
  - name: CustomerAdvocate
    description: "Field advocate: inspects trade-ins, manages appointments, handles return transit and intake"
    identity: "opaque"
    exclusive_operations:
      - "POST /vehicle-hub/trade-ins/{id}/inspect"
      - "POST /vehicle-hub/appointments/{id}/no-show"
      - "POST /vehicle-hub/returns/{orderId}/schedule-pickup"
      - "POST /vehicle-hub/returns/{orderId}/transit/pickup"
      - "POST /vehicle-hub/returns/{orderId}/transit/arrive"
      - "POST /vehicle-hub/returns/{orderId}/intake"
    shared_operations:
      - "GET read endpoints"
  - name: ReconOperator
    description: "Reconditioning center operator; manages vehicle recon workflow"
    identity: "opaque"
    exclusive_operations:
      - "POST /vehicle-hub/vehicles/{id}/start-recon"
      - "POST /vehicle-hub/vehicles/{id}/list"
      - "POST /vehicle-hub/recon-intakes/{id}/arrive"
      - "POST /vehicle-hub/recon-intakes/{id}/start-work"
      - "POST /vehicle-hub/recon-intakes/{id}/complete"
    shared_operations:
      - "GET read endpoints"
      - "POST /vehicle-hub/vehicles"
      - "POST /vehicle-hub/vehicles/{id}/annotations"
      - "POST /vehicle-hub/recon-intakes"
  - name: RegistrationClerk
    description: "Title and registration specialist"
    identity: "opaque"
    exclusive_operations:
      - "POST /vehicle-hub/title-registrations/{id}/file"
      - "POST /vehicle-hub/title-registrations/{id}/register"
    shared_operations:
      - "GET read endpoints"
  - name: WarrantyAdmin
    description: "Limited-warranty claims administrator"
    identity: "opaque"
    exclusive_operations:
      - "POST /vehicle-hub/defect-claims/{id}/review"
      - "POST /vehicle-hub/defect-claims/{id}/authorize"
      - "POST /vehicle-hub/defect-claims/{id}/deny"
      - "POST /vehicle-hub/defect-claims/{id}/complete-repair"
      - "POST /vehicle-hub/repair-authorizations/{id}/void"
    shared_operations:
      - "GET read endpoints"
