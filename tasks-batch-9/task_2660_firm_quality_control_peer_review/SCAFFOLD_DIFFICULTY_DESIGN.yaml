              captures: { sel1_id: "$.data[0].id" }
            - call: "POST /inspection-selections/${sel1_id}/findings"
              payload: { title: "Impairment conclusion unsupported by evidence", sqm_component: "ENGAGEMENT_PERFORMANCE" }
