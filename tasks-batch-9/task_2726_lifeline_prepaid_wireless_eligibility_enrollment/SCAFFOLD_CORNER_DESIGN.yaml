          The certification is a hard gate, not a stored flag: an otherwise perfect
          enrollment request with one_per_household_attested false is refused with
          ERR_HOUSEHOLD_CERTIFICATION_MISSING (422), nothing is written (the address slot
          stays empty and the subscriber stays VERIFIED_ELIGIBLE), and the identical request
          with true then succeeds.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; one ACTIVE carrier licensed in TX with cap 50, one clean address, one VERIFIED_ELIGIBLE subscriber with an unexpired confirmed check."
