  - rule_id: transitive_cascade
    instances:
      - name: season_declaration_cascade_through_class_slot_and_ring_schedule
        grounds:
          - state_machines.Entry.CONFIRMED_to_WITHDRAWN
          - calculations.withdrawal_refund_settlement
          - calculations.ring_block_duration
          - calculations.handler_ring_conflict_resolution
          - entities.ShowClass.fields.entry_count
          - entities.RingBlock.fields.deferred_dog_count
          - entities.Entry.fields.conflict_deferred
        distinguishing_aspect: |
            Depth-4 cascade whose links are all SCHEDULE-shaped: withdrawing one bitch (link 1) drops the
            class's confirmed population (link 2), which shrinks that class's ring block from 8 minutes to 5
            (link 3), which makes the two published blocks merely adjacent instead of overlapping and therefore
            un-defers the handler's entries in the OTHER class, shrinking that block too (link 4). The final
