              as: Member
              as_user_id: "${m1_id}"
              captures: { dr_id: $.data.id }
            - call: "POST /drafting-requests/${dr_id}/assign"
              payload: { drafter_id: "${d1_id}", engagement_start_utc: "2026-09-02T00:00:00Z", engagement_end_utc: "2026-09-08T00:00:00Z" }
              as: ReviewCounsel
              as_user_id: "${rc_id}"
          trigger:
            - call: "POST /statutory-conflicts"
              payload: { drafting_request_id: "${dr_id}", code_citation: "28-9-101", conflict_type: "AMENDS_SAME_SECTION", severity: "BLOCKING" }
              as: Drafter
              as_user_id: "${d1_id}"
            - call: "GET /drafting-requests/${dr_id}"
