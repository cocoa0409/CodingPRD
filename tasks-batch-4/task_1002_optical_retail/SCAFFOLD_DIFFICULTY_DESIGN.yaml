            - "Order.${ord_b}.benefit_frame_cents == 15000"
            - "InsurancePolicy.${pol_id}.frame_allowance_remaining_cents == 0"

      - name: order_create_safety_lens_mismatch_beats_referential_owner_mismatch
        grounds:
          - validations[priority=50]
          - validations[priority=58]
          - errors[ERR_LENS_INCOMPATIBLE_WITH_RX]
          - errors[ERR_PRESCRIPTION_OWNER_MISMATCH]
        distinguishing_aspect: |
          A DIFFERENT category pair — `business_safety` (priority 50,
