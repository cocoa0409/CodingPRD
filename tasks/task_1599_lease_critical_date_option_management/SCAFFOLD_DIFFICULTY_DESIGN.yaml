            - "Ledger contains exactly one OPTION_FEE entry with source_option_id == ${oid} and amount_cents == 100000"
            - "All Reminders of option ${oid} have status == CANCELED"

  # ===========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_temporal_on_lapsed_option_notice
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_NOTICE_WINDOW_CLOSED]
        distinguishing_aspect: |
          Error-category pair state (priority 5) vs business_temporal (priority 6):
          an option already LAPSED and the clock outside the notice window violates
          both rules; the dual-failure request must surface ERR_INVALID_STATE
          because state precedes business_temporal in the priority order.
        test_recipe:
          setup:
            - "Portfolio P, AM contact; lease L ACTIVE; option O window [2026-08-10, 2026-09-10]"
            - "Clock advanced to 2026-09-15 → O is LAPSED and clock is outside the window"
          setup_api_calls:
            - call: "POST /portfolios"
              payload: { name: "P9", region: "WEST", laddering_max_pct_per_year: 40 }
