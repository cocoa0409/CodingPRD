# =============================================================================
# task_2215 — Marketplace Fulfillment Inventory & Storage Cost Management
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
#
# 9 rule_ids x >= 2 instances = 22 instances.
# Every numeric assert below was executed against the §1.3 formulas before
# being written; no assert contains an unevaluated expression.
# Logical clock starts at the mandated default 2026-08-01T00:00:00Z.
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: restock_allocation_provisional_pool_shrinks_below_final_pool
        grounds:
          - calculations.restock_allocation
          - entities.InboundShipmentPlan.fields.provisional_allocated_units
          - entities.InboundShipmentPlan.fields.final_allocated_units
          - entities.InboundShipmentPlan.fields.allocation_status
          - entities.ShipmentLineItem.fields.provisional_allocated_units
          - state_machines.InboundShipmentPlan.DRAFT_to_CONFIRMED
          - validations[priority=19]
        distinguishing_aspect: |
          Subject domain is the InboundShipmentPlan x RestockQuota allocation ledger: on identical data the
          PROVISIONAL variant subtracts the sibling DRAFT plan's 1200-unit provisional reservation and grants
          only 1800 of 2500 declared units (allocation_status OVER_LIMIT), while the FINAL variant ignores
          every DRAFT sibling and grants the full 2500 — the same plan therefore carries
          provisional_allocated_units 1800 and final_allocated_units 2500 on one row.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One seller with an ACTIVE RestockQuota whose iprs_score is 1000, capacity_tier TIER_ELEVATED and restock_limit_units 3000."
            - "One FulfillmentCenter with prep_profile LABEL_ONLY and receiving_capacity_units_per_window 100000, so no prep/label/capacity rule interferes."
            - "Plan A in DRAFT with one line item of 1200 units, provisional_allocated_units 1200."
            - "Plan B in DRAFT with two line items created in this order: 1000 units then 1500 units, declared_units 2500."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: MarketplaceAdmin
            - call: "POST /fulfillment/sellers"
              payload: { legal_name: "Northwind Goods", storage_cubic_feet_entitlement: 1000.0000, unit_cost_cap_cents: 200000 }
              as: MarketplaceAdmin
              captures: { s_id: "$.data.id" }
            - call: "POST /fulfillment/fulfillment-centers"
              payload: { fc_code: "FC-A1", region_code: "US-WEST", prep_profile: "LABEL_ONLY", case_pack_min_units: 1, receiving_capacity_units_per_window: 100000, monthly_storage_rate_cents_per_cubic_foot: 87, ltsf_rate_cents_per_cubic_foot: 620 }
              as: MarketplaceAdmin
              captures: { fc_id: "$.data.id" }
            - call: "POST /fulfillment/sku-listings"
              payload: { seller_account_id: "${s_id}", sku: "SKU-ALPHA", unit_cubic_feet: 1.0000, unit_cost_cents: 1250 }
              as: SellerOperator
              as_user_id: "${s_id}"
              captures: { l1_id: "$.data.id" }
            - call: "POST /fulfillment/sellers/${s_id}/restock-quotas"
              payload: { period_start: "2026-08-01T00:00:00Z", period_end: "2028-01-01T00:00:00Z", base_capacity_units: 1000, sell_through_rate: 2.5000, excess_units_ratio: 0.0000, stranded_ratio: 0.0000, in_stock_rate: 1.0000 }
              as: MarketplaceAdmin
              captures: { q_id: "$.data.id", q_limit: "$.data.restock_limit_units" }
            - call: "GET /fulfillment/sellers/${s_id}"
              as: SellerOperator
              as_user_id: "${s_id}"
              captures: { sv1: "$.data.version" }
            - call: "POST /fulfillment/inbound-shipment-plans"
              payload: { seller_account_id: "${s_id}", destination_fc_id: "${fc_id}", appointment_window_start: "2026-08-10T00:00:00Z", appointment_window_end: "2026-08-11T00:00:00Z", expected_seller_account_version: "${sv1}" }
              as: SellerOperator
              as_user_id: "${s_id}"
              captures: { pa_id: "$.data.id" }
            - call: "POST /fulfillment/inbound-shipment-plans/${pa_id}/line-items"
              payload: { sku_listing_id: "${l1_id}", units: 1200, case_pack_units: 10, polybagged: true, label_type: "FNSKU" }
              as: SellerOperator
              as_user_id: "${s_id}"
              captures: { la_id: "$.data.id" }
            - call: "GET /fulfillment/sellers/${s_id}"
              as: SellerOperator
              as_user_id: "${s_id}"
              captures: { sv2: "$.data.version" }
            - call: "POST /fulfillment/inbound-shipment-plans"
              payload: { seller_account_id: "${s_id}", destination_fc_id: "${fc_id}", appointment_window_start: "2026-08-20T00:00:00Z", appointment_window_end: "2026-08-21T00:00:00Z", expected_seller_account_version: "${sv2}" }
              as: SellerOperator
              as_user_id: "${s_id}"
              captures: { pb_id: "$.data.id" }
            - call: "POST /fulfillment/inbound-shipment-plans/${pb_id}/line-items"
              payload: { sku_listing_id: "${l1_id}", units: 1000, case_pack_units: 10, polybagged: true, label_type: "FNSKU" }
              as: SellerOperator
              as_user_id: "${s_id}"
              captures: { lb1_id: "$.data.id" }
            - call: "POST /fulfillment/inbound-shipment-plans/${pb_id}/line-items"
              payload: { sku_listing_id: "${l1_id}", units: 1500, case_pack_units: 10, polybagged: true, label_type: "FNSKU" }
              as: SellerOperator
              as_user_id: "${s_id}"
              captures: { lb2_id: "$.data.id" }
          trigger:
            - call: "POST /fulfillment/inbound-shipment-plans/${pb_id}/confirm"
              payload: { confirmation_note: "final allocation" }
              as: SellerOperator
              as_user_id: "${s_id}"
              captures: { pb_final: "$.data.final_allocated_units" }
            - call: "POST /fulfillment/inbound-shipment-plans/${pa_id}/confirm"
              payload: {}
              as: SellerOperator
              as_user_id: "${s_id}"
              captures: { err_a: "$.data.error_id" }
          assert:
            - "RestockQuota.${q_id}.restock_limit_units == 3000"
            - "InboundShipmentPlan.${pb_id}.provisional_allocated_units == 1800"
            - "ShipmentLineItem.${lb1_id}.provisional_allocated_units == 1000"
            - "ShipmentLineItem.${lb2_id}.provisional_allocated_units == 800"
            - "InboundShipmentPlan.${pb_id}.allocation_status == OVER_LIMIT"
            - "InboundShipmentPlan.${pb_id}.final_allocated_units == 2500"
            - "InboundShipmentPlan.${pb_id}.allocated_units == 2500"
            - "ShipmentLineItem.${lb2_id}.final_allocated_units == 1500"
            - "InboundShipmentPlan.${pb_id}.status == CONFIRMED"
            - "RestockQuota.${q_id}.utilized_units == 2500"
            - "SellerAccount.${s_id}.restock_reserved_units == 2500"
            - "FulfillmentCenter.${fc_id}.committed_receiving_units == 2500"
            - "InboundShipmentPlan.${pa_id}.provisional_allocated_units == 500"
            - "ShipmentLineItem.${la_id}.provisional_allocated_units == 500"
            - "InboundShipmentPlan.${pa_id}.allocation_status == OVER_LIMIT"
            - "second confirm returns HTTP 422 with ${err_a} == ERR_RESTOCK_LIMIT_EXCEEDED"
            - "InboundShipmentPlan.${pa_id}.status == DRAFT"
            - "InboundShipmentPlan.${pa_id}.final_allocated_units == 0"

      - name: velocity_forecast_seasonal_blend_diverges_from_trailing_window
        grounds:
          - calculations.velocity_forecast
          - entities.VelocityForecast.fields.daily_velocity
          - entities.VelocityForecast.fields.target_units
          - entities.VelocityForecast.fields.recommended_replenishment_units
          - entities.SkuListing.fields.recommended_replenishment_units
        distinguishing_aspect: |
          Subject domain is demand forecasting on a SkuListing (not the plan/quota allocation ledger of the
          other instance): with identical inputs TRAILING_30 ignores the prior-year term and yields
          daily_velocity 20.0000 / target_units 1200, while SEASONAL_WEIGHTED blends 0.60/0.40 with
          seasonal_index 1.40 and yields 28.8000 / 1728 — a 528-unit divergence in the recommendation.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Seller with an ACTIVE RestockQuota, restock_limit_units 3000 and utilized_units 0, so quota_headroom_units is 3000 and never binds."
            - "One SkuListing with no InventoryLot rows: fulfillable_units 0, unfulfillable_units 0, in_flight_units 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: MarketplaceAdmin
            - call: "POST /fulfillment/sellers"
              payload: { legal_name: "Northwind Goods", storage_cubic_feet_entitlement: 1000.0000, unit_cost_cap_cents: 200000 }
              as: MarketplaceAdmin
              captures: { s_id: "$.data.id" }
            - call: "POST /fulfillment/sku-listings"
              payload: { seller_account_id: "${s_id}", sku: "SKU-ALPHA", unit_cubic_feet: 1.0000, unit_cost_cents: 1250 }
              as: SellerOperator
              as_user_id: "${s_id}"
              captures: { l1_id: "$.data.id" }
            - call: "POST /fulfillment/sellers/${s_id}/restock-quotas"
              payload: { period_start: "2026-08-01T00:00:00Z", period_end: "2028-01-01T00:00:00Z", base_capacity_units: 1000, sell_through_rate: 2.5000, excess_units_ratio: 0.0000, stranded_ratio: 0.0000, in_stock_rate: 1.0000 }
              as: MarketplaceAdmin
              captures: { q_id: "$.data.id" }
          trigger:
            - call: "POST /fulfillment/sku-listings/${l1_id}/velocity-forecasts"
              payload: { forecast_variant: "TRAILING_30", trailing_30_units_sold: 600, prior_year_same_period_units_sold: 900, seasonal_index: 1.40, coverage_target_days: 45, lead_time_days: 15 }
              as: SellerOperator
              as_user_id: "${s_id}"
              captures: { t_dv: "$.data.daily_velocity", t_rec: "$.data.recommended_replenishment_units" }
            - call: "POST /fulfillment/sku-listings/${l1_id}/velocity-forecasts"
              payload: { forecast_variant: "SEASONAL_WEIGHTED", trailing_30_units_sold: 600, prior_year_same_period_units_sold: 900, seasonal_index: 1.40, coverage_target_days: 45, lead_time_days: 15 }
              as: SellerOperator
              as_user_id: "${s_id}"
              captures: { s_dv: "$.data.daily_velocity", s_rec: "$.data.recommended_replenishment_units" }
          assert:
            - "${t_dv} == 20.0000"
            - "first forecast response target_units == 1200"
            - "first forecast response in_flight_units == 0"
            - "first forecast response quota_headroom_units == 3000"
            - "${t_rec} == 1200"
            - "first forecast response stranded_risk_flag == false"
            - "${s_dv} == 28.8000"
            - "second forecast response target_units == 1728"
            - "${s_rec} == 1728"
            - "${s_rec} - ${t_rec} == 528"
            - "SkuListing.${l1_id}.recommended_replenishment_units == 1728"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: storage_fee_per_lot_rounding_beats_sum_then_round_by_one_cent
        grounds:
          - calculations.storage_fee_assessment
          - entities.StorageFeeAssessment.fields.monthly_storage_fee_cents
          - entities.StorageFeeAssessment.fields.billable_cubic_feet
          - entities.SellerAccount.fields.storage_fee_accrued_cents
          - endpoints[POST /fulfillment/storage-billing-runs]
        distinguishing_aspect: |
          Mode (b) nested-rounding-order: two lots of 0.5831 and 0.9163 billable cubic feet at 87 cents per
          cubic foot must be rounded per lot FIRST (51 + 80 = 131 cents); summing cubic feet first and
          rounding once gives round_half_up(1.4994 * 87) = 130 cents, so the run total discriminates the two
          readings by exactly one cent.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "FulfillmentCenter with monthly_storage_rate_cents_per_cubic_foot 87 and ltsf_rate_cents_per_cubic_foot 620."
            - "Two SkuListings of the same seller: unit_cubic_feet 0.5831 and 0.9163."
            - "One plan received in full with one unit of each listing, producing two ACTIVE InventoryLots of 1 fulfillable unit each, both first_received_at 2026-08-01T00:00:00Z (age_days 0, aged_bucket UNDER_181)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: MarketplaceAdmin
            - call: "POST /fulfillment/sellers"
              payload: { legal_name: "Northwind Goods", storage_cubic_feet_entitlement: 1000.0000, unit_cost_cap_cents: 200000 }
              as: MarketplaceAdmin
              captures: { s_id: "$.data.id" }
            - call: "POST /fulfillment/fulfillment-centers"
              payload: { fc_code: "FC-A1", region_code: "US-WEST", prep_profile: "LABEL_ONLY", case_pack_min_units: 1, receiving_capacity_units_per_window: 100000, monthly_storage_rate_cents_per_cubic_foot: 87, ltsf_rate_cents_per_cubic_foot: 620 }
              as: MarketplaceAdmin
              captures: { fc_id: "$.data.id" }
            - call: "POST /fulfillment/sku-listings"
              payload: { seller_account_id: "${s_id}", sku: "SKU-CF-A", unit_cubic_feet: 0.5831, unit_cost_cents: 1250 }
              as: SellerOperator
              as_user_id: "${s_id}"
              captures: { la_listing: "$.data.id" }
            - call: "POST /fulfillment/sku-listings"
              payload: { seller_account_id: "${s_id}", sku: "SKU-CF-B", unit_cubic_feet: 0.9163, unit_cost_cents: 1250 }
              as: SellerOperator
              as_user_id: "${s_id}"
              captures: { lb_listing: "$.data.id" }
            - call: "POST /fulfillment/sellers/${s_id}/restock-quotas"
              payload: { period_start: "2026-08-01T00:00:00Z", period_end: "2028-01-01T00:00:00Z", base_capacity_units: 1000, sell_through_rate: 2.5000, excess_units_ratio: 0.0000, stranded_ratio: 0.0000, in_stock_rate: 1.0000 }
              as: MarketplaceAdmin
              captures: { q_id: "$.data.id" }
            - call: "GET /fulfillment/sellers/${s_id}"
              as: SellerOperator
              as_user_id: "${s_id}"
              captures: { sv1: "$.data.version" }
            - call: "POST /fulfillment/inbound-shipment-plans"
              payload: { seller_account_id: "${s_id}", destination_fc_id: "${fc_id}", appointment_window_start: "2026-08-01T00:00:00Z", appointment_window_end: "2026-08-02T00:00:00Z", expected_seller_account_version: "${sv1}" }
              as: SellerOperator
              as_user_id: "${s_id}"
              captures: { p_id: "$.data.id" }
            - call: "POST /fulfillment/inbound-shipment-plans/${p_id}/line-items"
              payload: { sku_listing_id: "${la_listing}", units: 1, case_pack_units: 1, polybagged: true, label_type: "FNSKU" }
              as: SellerOperator
              as_user_id: "${s_id}"
              captures: { li_a: "$.data.id" }
            - call: "POST /fulfillment/inbound-shipment-plans/${p_id}/line-items"
              payload: { sku_listing_id: "${lb_listing}", units: 1, case_pack_units: 1, polybagged: true, label_type: "FNSKU" }
              as: SellerOperator
              as_user_id: "${s_id}"
              captures: { li_b: "$.data.id" }
            - call: "POST /fulfillment/inbound-shipment-plans/${p_id}/confirm"
              payload: {}
              as: SellerOperator
              as_user_id: "${s_id}"
            - call: "POST /fulfillment/inbound-shipment-plans/${p_id}/ship"
              payload: { carrier_reference: "CR-1" }
              as: SellerOperator
              as_user_id: "${s_id}"
            - call: "POST /fulfillment/inbound-shipment-plans/${p_id}/receive"
              payload: { received_lines: [ { shipment_line_item_id: "${li_a}", received_units: 1, unfulfillable_units: 0 }, { shipment_line_item_id: "${li_b}", received_units: 1, unfulfillable_units: 0 } ] }
              as: FcOperator
              as_user_id: "${fc_id}"
            - call: "GET /fulfillment/inventory-lots"
              payload: { sku_listing_id: "${la_listing}" }
              as: SellerOperator
              as_user_id: "${s_id}"
              captures: { lot_a: "$.data[0].id" }
            - call: "GET /fulfillment/inventory-lots"
              payload: { sku_listing_id: "${lb_listing}" }
              as: SellerOperator
              as_user_id: "${s_id}"
              captures: { lot_b: "$.data[0].id" }
          trigger:
            - call: "POST /fulfillment/storage-billing-runs"
              payload: { run_note: "epoch 1" }
              as: MarketplaceAdmin
              captures: { run_seq: "$.data.billing_run_sequence", n_assess: "$.data.assessment_count", total_cents: "$.data.total_assessed_cents" }
          assert:
            - "${run_seq} == 1"
            - "${n_assess} == 2"
            - "${total_cents} == 131"
            - "${total_cents} != 130"
            - "StorageFeeAssessment[inventory_lot_id=${lot_a}, billing_run_sequence=1].billable_cubic_feet == 0.5831"
            - "StorageFeeAssessment[inventory_lot_id=${lot_a}, billing_run_sequence=1].monthly_storage_fee_cents == 51"
            - "StorageFeeAssessment[inventory_lot_id=${lot_a}, billing_run_sequence=1].ltsf_surcharge_cents == 0"
            - "StorageFeeAssessment[inventory_lot_id=${lot_a}, billing_run_sequence=1].total_fee_cents == 51"
            - "StorageFeeAssessment[inventory_lot_id=${lot_b}, billing_run_sequence=1].billable_cubic_feet == 0.9163"
            - "StorageFeeAssessment[inventory_lot_id=${lot_b}, billing_run_sequence=1].monthly_storage_fee_cents == 80"
            - "StorageFeeAssessment[inventory_lot_id=${lot_b}, billing_run_sequence=1].total_fee_cents == 80"
            - "InventoryLot.${lot_a}.storage_fee_accrued_cents == 51"
            - "InventoryLot.${lot_b}.storage_fee_accrued_cents == 80"
            - "SellerAccount.${s_id}.storage_fee_accrued_cents == 131"
            - "SellerAccount.${s_id}.storage_utilization_ratio == 0.0015"
            - "billing run response downgraded_quota_count == 0"
            - "billing run response expired_quota_count == 0"
            - "billing run response closed_plan_count == 0"

      - name: mcf_volume_discount_tier_keyed_on_pre_discount_total
        grounds:
          - calculations.mcf_fee_quote
          - entities.MultiChannelOrder.fields.mcf_fee_cents
          - entities.MultiChannelOrder.fields.fee_advantage_cents
          - entities.MultiChannelOrder.fields.recommended_channel
          - endpoints[POST /fulfillment/multi-channel-orders]
        distinguishing_aspect: |
          Mode (c) circular-looking evaluation order: the volume-discount tier is keyed on
          pre_discount_total_cents, so a 40-unit order (pre-discount 20000, tier 3 percent, discount 600)
          costs 19400 cents while a 39-unit order (pre-discount 19500, no tier) costs 19500 — keying the tier
          on the post-discount figure would return 20000 for the 40-unit order and destroy the inversion.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z, so is_peak_period is false (month 8 is not in {10, 11, 12})."
            - "One SkuListing of a seller with an ACTIVE quota; no inventory is required because both orders use fulfillment_channel SELF_FULFILLED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: MarketplaceAdmin
            - call: "POST /fulfillment/sellers"
              payload: { legal_name: "Northwind Goods", storage_cubic_feet_entitlement: 1000.0000, unit_cost_cap_cents: 200000 }
              as: MarketplaceAdmin
              captures: { s_id: "$.data.id" }
            - call: "POST /fulfillment/sku-listings"
              payload: { seller_account_id: "${s_id}", sku: "SKU-ALPHA", unit_cubic_feet: 1.0000, unit_cost_cents: 1250 }
              as: SellerOperator
              as_user_id: "${s_id}"
              captures: { l1_id: "$.data.id" }
          trigger:
            - call: "POST /fulfillment/multi-channel-orders"
              payload: { sku_listing_id: "${l1_id}", units: 40, billable_weight_lb: 2.00, destination_zone: "ZONE_2", fulfillment_channel: "SELF_FULFILLED", self_fulfilled_cost_cents: 19400 }
              as: SellerOperator
              as_user_id: "${s_id}"
              captures: { o40_id: "$.data.id", o40_fee: "$.data.mcf_fee_cents" }
            - call: "POST /fulfillment/multi-channel-orders"
              payload: { sku_listing_id: "${l1_id}", units: 39, billable_weight_lb: 2.00, destination_zone: "ZONE_2", fulfillment_channel: "SELF_FULFILLED", self_fulfilled_cost_cents: 19400 }
              as: SellerOperator
              as_user_id: "${s_id}"
              captures: { o39_id: "$.data.id", o39_fee: "$.data.mcf_fee_cents" }
          assert:
            - "MultiChannelOrder.${o40_id}.is_peak_period == false"
            - "${o40_fee} == 19400"
            - "MultiChannelOrder.${o40_id}.fee_advantage_cents == 0"
            - "MultiChannelOrder.${o40_id}.recommended_channel == MCF"
            - "${o39_fee} == 19500"
            - "${o39_fee} > ${o40_fee}"
            - "MultiChannelOrder.${o39_id}.fee_advantage_cents == -100"
            - "MultiChannelOrder.${o39_id}.recommended_channel == SELF_FULFILLED"
            - "MultiChannelOrder.${o40_id}.order_status == SELF_SHIPPED"
            - "MultiChannelOrder.${o40_id}.consumed_lot_allocations == []"
            - "SellerAccount.${s_id}.mcf_fee_accrued_cents == 0"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: sku_listing_stays_suppressed_while_inventory_health_returns_to_healthy
        grounds:
          - state_machines.SkuListing.listing_status_ACTIVE_to_listing_status_SUPPRESSED
          - state_machines.SkuListing.listing_status_SUPPRESSED_to_listing_status_ACTIVE
          - state_machines.SkuListing.inventory_health_STRANDED_to_inventory_health_HEALTHY
          - calculations.listing_health_recompute
          - entities.SkuListing.fields.listing_status
          - entities.SkuListing.fields.inventory_health
          - entities.SkuListing.fields.suppression_reason
        distinguishing_aspect: |
          Non-linearity on SkuListing: two parallel dimensions on one row plus an ACTIVE -> SUPPRESSED ->
          ACTIVE cycle on the first — after a fresh receipt restores fulfillable_units to 50 the row reads
          listing_status SUPPRESSED and inventory_health HEALTHY at the same time, and only the explicit
          reinstate call closes the cycle.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One listing received in full for 100 units into a single ACTIVE lot."
            - "60 of those units reclassified unfulfillable (fulfillable 40, unfulfillable 60) — listing still ACTIVE / HEALTHY."
            - "An MCF order for 40 units draws the fulfillable pool to 0, so the listing is SUPPRESSED with suppression_reason STRANDED_INVENTORY and inventory_health STRANDED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: MarketplaceAdmin
            - call: "POST /fulfillment/sellers"
              payload: { legal_name: "Northwind Goods", storage_cubic_feet_entitlement: 1000.0000, unit_cost_cap_cents: 200000 }
              as: MarketplaceAdmin
              captures: { s_id: "$.data.id" }
            - call: "POST /fulfillment/fulfillment-centers"
