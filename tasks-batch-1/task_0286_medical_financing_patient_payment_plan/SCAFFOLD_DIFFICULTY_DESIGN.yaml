              as: Anonymous
              captures: { appk_id: $.data.id }
            - call: "POST /credit-applications/${appk_id}/approve"
              payload: {}
              as: PlatformAdmin
              captures: { acctk_id: $.data.patient_account_id }
            - call: "GET /accounts/${acctk_id}"
