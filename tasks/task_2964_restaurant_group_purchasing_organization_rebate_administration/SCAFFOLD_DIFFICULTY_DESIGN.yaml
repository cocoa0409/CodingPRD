            - "Member counters before the trigger: accrued_member_share_cents 7639, attributed_gpo_retention_cents 2546, attributed_admin_fee_cents 315, dispute_reversal_count 0, reconciliation_posture CLEAR, payout_hold false."
            - "The member has opened a dispute on the 4500-cent accrual for its full member share (3274), so that accrual is DISPUTED and the dispute is OPEN with opened_by_user_id == the member id."
            - "batch.accrued_by_user_id == analyst-01, so arbiter-01 satisfies the segregation-of-duties check on decide."
