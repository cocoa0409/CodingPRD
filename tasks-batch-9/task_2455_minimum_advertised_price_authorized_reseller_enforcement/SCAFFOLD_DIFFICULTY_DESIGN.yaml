            - "SerialUnit SN-40 shipped to that distributor (this create bumps Distributor.version to 2, so version 1 is genuinely stale)."
            - "Clock at 2026-08-10T00:00:00Z; one CONFIRMED_UNAUTHORIZED test purchase tracing SN-40, so the priority-10 referential checks pass and the request reaches priority 13."
