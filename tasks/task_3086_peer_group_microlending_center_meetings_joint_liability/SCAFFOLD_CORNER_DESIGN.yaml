        claim_type: role_exclusive_denial
        grounds:
          - validations[priority=1]
          - errors.ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
        distinguishing_aspect: "A call with neither X-User-ID nor X-User-Role fails 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER — auth-presence (priority 1) precedes role permission (priority 2), so the response is 400, not 403."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /branches"
              payload: { name: "No Auth" }
              as: ProgramAdmin
              omit_headers: true
              note: "test omits both X-User-ID and X-User-Role headers; the `as:` field records the intended persona only — no role header is actually sent"
          assert:
            - "the response status is 400 with error_id ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"

