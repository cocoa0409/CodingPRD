  - rule_id: compensating_invariant
    instances:
      - name: regrind_reversal_restores_pool_mass_invariant
        grounds:
          - calculations.pool_mass_balance
          - endpoints[POST /regrind-transactions/{id}/reverse]
          - entities.RegrindTransaction.fields.reverses_transaction_id
          - errors[ERR_TRANSACTION_ALREADY_REVERSED]
        distinguishing_aspect: |
          Reversal is a compensating append, not a mutation: the OUT row stays in the ledger and a
          REVERSAL row removes it from the input set, so available_kg returns to 100.000,
          cumulative_out_kg to 0.000, embedded_pcr_pct to its pre-draw value and
          reincorporation_count to 0 -- and because the compensation is recorded rather than
          applied, a second reverse of the same row is refused instead of double-crediting.
        test_recipe:
          setup:
            - "RUN-NF-1 COMPLETED with gross 500.0 / scrap 100.0, booking 100.000 kg of virgin-only scrap into POOL-NF"
            - "RUN-NF-2 RUNNING at logical clock 2026-08-05T15:00:00Z on the same APPROVED recipe R-NF-0"
            - "a 50.000 kg REINCORPORATION drawn from POOL-NF against RUN-NF-2, captured as txn_out"
          setup_api_calls:
            - *a_clock_d1_0600
            - *a_p_nf
            - *a_g_ll
            - *a_line_nf
            - *a_pool_nf
            - *a_r0_new
            - *a_r0_c1
            - *a_r0_sub
            - *a_r0_app
            - *a_run1_new
            - *a_run1_start
            - *a_g1_40
            - *a_g1_40
            - *a_g1_40
            - *a_g1_40
            - *a_g1_40
            - &a_roll1 { call: "POST /film-rolls", payload: { extrusion_run_id: "${run1}", roll_number: 1, net_kg: 100.0 }, as: ExtrusionOperator, captures: { roll1: "$.data.id" } }
            - &a_run1_comp { call: "POST /extrusion-runs/${run1}/complete", payload: { gross_output_kg: 500.0, scrap_kg: 100.0 }, as: ExtrusionOperator }
            - *a_clock_d1_1500
            - &a_run2b_new { call: "POST /extrusion-runs", payload: { run_code: "RUN-NF-2", line_id: "${line_nf}", blend_recipe_id: "${r0}", scheduled_start: "2026-08-05T15:00:00Z", scheduled_end: "2026-08-05T20:00:00Z", target_output_kg: 500.0 }, as: ExtrusionOperator, captures: { run2: "$.data.id" } }
            - &a_run2b_start { call: "POST /extrusion-runs/${run2}/start", payload: {}, as: ExtrusionOperator }
            - *a_get_pool_nf2
            - &a_reinc50 { call: "POST /extrusion-runs/${run2}/regrind-reincorporations", payload: { pool_id: "${pool_nf}", kg: 50.0, expected_regrind_pool_version: "${v_pool_nf}" }, as: ExtrusionOperator, captures: { txn_out: "$.data.id" } }
          trigger:
            - { call: "POST /regrind-transactions/${txn_out}/reverse", payload: { reversal_reason: "wrong pool drawn at the blender" }, as: QualityManager, as_user_id: "u-qm-1" }
            - { call: "POST /regrind-transactions/${txn_out}/reverse", payload: { reversal_reason: "duplicate correction attempt" }, as: QualityManager, as_user_id: "u-qm-1" }
          assert:
            - "before reversal: RegrindTransaction.${txn_out}.direction == OUT, origin_kind == REINCORPORATION, kg == 50.000, pcr_kg == 0.000, pool_available_kg_after == 50.000"
            - "the first POST /regrind-transactions/${txn_out}/reverse -> 200"
            - "after reversal: RegrindPool.${pool_nf}.available_kg == 100.000, cumulative_in_kg == 100.000, cumulative_out_kg == 0.000"
            - "after reversal: RegrindPool.${pool_nf}.cumulative_in_pcr_kg == 0.000, embedded_pcr_pct == 0.000, generation_count == 1, reincorporation_count == 0"
            - "invariant restored: available_kg + cumulative_out_kg == cumulative_in_kg (100.000 + 0.000 == 100.000)"
            - "GET /regrind-transactions filtered by reverses_transaction_id ${txn_out} returns total_count 1 with direction IN and origin_kind REVERSAL"
            - "the second POST /regrind-transactions/${txn_out}/reverse -> 409 ERR_TRANSACTION_ALREADY_REVERSED"
            - "after the refused second reverse: RegrindPool.${pool_nf}.available_kg == 100.000 (no double credit)"
            - "ExtrusionRun.${run2}.regrind_consumed_kg is back to 0.000 and status == RUNNING"
      - name: bag_count_conservation_holds_across_packout_and_revocation_unwind
        grounds:
