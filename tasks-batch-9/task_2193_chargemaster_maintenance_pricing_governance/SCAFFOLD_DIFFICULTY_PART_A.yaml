              payload: { facility_id: "${fac_id}", name: "Clinical Lab", cost_center_code: "CC-300", manager_user_id: "u_dm_lab" }
              as: SystemAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /chargemaster/revenue-codes"
              payload: { code: "0300", description: "Laboratory", requires_hcpcs: false, allowed_code_types: ["CDM_INTERNAL", "REV_ONLY"], pricing_class: "PROCEDURE", status: "ACTIVE" }
              as: SystemAdmin
              captures: { rc_id: $.data.id }
            - call: "POST /chargemaster/price-rules"
              payload: { facility_id: "${fac_id}", revenue_code_id: "${rc_id}", pricing_method: "COST_PLUS_MARKUP", effective_from: "2026-08-01T00:00:00Z", markup_tiers: [{ min_cost_basis_cents: 0, markup_bp: 32000 }, { min_cost_basis_cents: 50000, markup_bp: 24000 }, { min_cost_basis_cents: 250000, markup_bp: 18000 }], min_medicare_multiple_bp: 12000, market_cap_multiple_bp: 11000 }
              as: RevenueIntegrityAnalyst
              captures: { rule_id: $.data.id }
            - call: "POST /chargemaster/charge-items"
              payload: { facility_id: "${fac_id}", department_id: "${dept_id}", revenue_code_id: "${rc_id}", cdm_number: "CDM-3000", description: "BASIC METABOLIC PANEL", code_type: "CDM_INTERNAL", cost_basis_cents: 40000, medicare_rate_cents: 20000, market_p75_cents: 200000, effective_from: "2026-08-01T00:00:00Z" }
              as: RevenueIntegrityAnalyst
              captures: { item_id: $.data.id }
            - call: "POST /chargemaster/charge-items/${item_id}/reprice"
              payload: {}
              as: RevenueIntegrityAnalyst
            - call: "POST /chargemaster/charge-items/${item_id}/lifecycle"
