            - call: "POST /projects/${proj_a_id}/capital-calls"
              payload: { milestone: "CONSTRUCTION_START", scheduled_date: "2026-10-01T00:00:00Z", due_date: "2026-10-31T00:00:00Z", milestone_share: 0.2, expected_project_version: "${proj_a_committed}" }
