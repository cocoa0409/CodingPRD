scenario: |
  Public School District Choice and Magnet School Lottery: Registration windows,
  sibling priority, school district boundaries, poverty index weighting, weighted
  lottery algorithms, waitlist backfill, inter-district transfers.
domain_name: school-choice-lottery
api_prefix: /enrollment

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: temporal_windowing
  complexity_layers:
    - selector_policy           # deterministic weighted lottery selection
    - rate_threshold_triggers   # poverty-index weight bands + boundary cutoffs
    - cascading_side_effects    # offer accept frees sibling-anchor; offer decline backfills waitlist
    - ops_run_checkpoint        # POST /_lottery/draw runs deterministic batch
    - scheduled_deferred_actions # offer expiry, window auto-close
  entity_topology: flat
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
    - self_referential   # Family.head_household_application_id sibling anchor
  role_model: peer_roles
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: District
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID."
      - name: name
        type: string
        source: input
        description: "Human-readable district name."
        constraints: "unique, 1-120 chars"
      - name: state_code
        type: string
        source: input
        description: "Two-letter US state code, uppercase."
        constraints: "regex ^[A-Z]{2}$"
      - name: accepts_inter_district_transfers
        type: boolean
        source: input
        description: "If false, no Application may have residency_district != target_program's district."
        default: false
      - name: poverty_index_threshold
        type: number
        source: input
        description: "Decimal in [0, 1]. Applications with poverty_index_score >= this threshold get the disadvantaged-weight multiplier."
        default: 0.50
        constraints: "0.00 <= value <= 1.00, 2 decimal precision"

  - name: School
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
      - name: district_id
        type: string
        source: input
        description: "FK to District.id."
      - name: name
        type: string
        source: input
        constraints: "unique within district_id"
      - name: school_type
        type: enum
        source: input
        description: "Determines lottery eligibility rules."
        constraints: "values: NEIGHBORHOOD, MAGNET, CHARTER"
      - name: grade_levels_offered
        type: array
        source: input
        description: "Sorted ascending list of integers from 0 (K) to 12."
        constraints: "non-empty subset of [0..12]"

  - name: Program
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
      - name: school_id
        type: string
        source: input
        description: "FK to School.id."
      - name: grade_level
        type: integer
        source: input
        description: "Single grade level; MUST appear in school.grade_levels_offered."
        constraints: "0..12"
      - name: academic_year
        type: integer
        source: input
        description: "Four-digit year of fall term start."
        constraints: ">= 2025"
      - name: seats_total
        type: integer
        source: input
        description: "Total seats available before any reservations."
        constraints: ">= 1"
      - name: seats_offered
        type: integer
        source: computed
        description: "Count of Application rows in this program with status IN {OFFERED, ACCEPTED}. Recomputed on every offer issuance, decline, expiry."
        default: 0
      - name: seats_accepted
        type: integer
        source: computed
        description: "Count of Application rows in this program with status == ACCEPTED."
        default: 0
      - name: registration_open_at
        type: datetime
        source: input
        description: "ISO 8601 UTC; window opens at this instant (inclusive)."
      - name: registration_close_at
        type: datetime
        source: input
        description: "ISO 8601 UTC; window closes at this instant (exclusive)."
        constraints: "MUST be strictly greater than registration_open_at"
      - name: lottery_seed
        type: string
        source: input
        description: "Deterministic seed used by the weighted lottery PRNG. MUST be set before lottery draw."
        constraints: "1-64 chars; required when window_status transitions to LOTTERY_DRAWN"
      - name: window_status
        type: enum
        source: computed
        description: "Posture field derived from clock + lottery events."
        default: "SCHEDULED"
        constraints: "values: SCHEDULED, OPEN, CLOSED, LOTTERY_DRAWN, BACKFILL"

  - name: Family
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
      - name: residency_district_id
        type: string
        source: input
        description: "FK to District.id where the family legally resides."
      - name: poverty_index_score
        type: number
        source: input
        description: "Decimal in [0, 1]; higher means more disadvantaged."
        constraints: "0.00 <= value <= 1.00"
      - name: head_household_application_id
        type: string
        source: computed
        description: "FK to Application.id designating the sibling anchor. Set to the first Application in this Family that reaches status ACCEPTED. Null until then. When the anchor application is moved to WITHDRAWN or EXPIRED, this field is recomputed to the next ACCEPTED application by created_at ascending, or null."

  - name: Student
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
      - name: family_id
        type: string
        source: input
        description: "FK to Family.id."
      - name: grade_level_next_year
        type: integer
        source: input
        description: "Grade the student is applying for."
        constraints: "0..12"
      - name: has_iep
        type: boolean
        source: input
        description: "Individualized Education Plan flag; reserved for tie-break."
        default: false

  - name: Application
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
      - name: student_id
        type: string
        source: input
      - name: program_id
        type: string
        source: input
      - name: choice_rank
        type: integer
        source: input
        description: "1..5; 1 = top choice. Unique per student_id."
        constraints: "1 <= value <= 5"
      - name: status
        type: enum
        source: computed
        description: "Lifecycle state of this application."
        default: "DRAFT"
        constraints: "values: DRAFT, SUBMITTED, OFFERED, ACCEPTED, DECLINED, WAITLISTED, EXPIRED, WITHDRAWN"
      - name: priority_category
        type: enum
        source: computed
        description: "Set when status transitions DRAFT->SUBMITTED."
        constraints: "values: SIBLING_IN_DISTRICT, IN_DISTRICT_DISADVANTAGED, IN_DISTRICT_STANDARD, INTER_DISTRICT_DISADVANTAGED, INTER_DISTRICT_STANDARD"
      - name: lottery_weight
        type: number
        source: computed
        description: "Numeric weight used by lottery selection. Computed at SUBMITTED."
      - name: lottery_score
        type: number
        source: computed
        description: "Deterministic score = lottery_weight * uniform_random(0,1) where the uniform draw is seeded by (program.lottery_seed, application.id). Set once at lottery draw. Higher scores win."
      - name: waitlist_position
        type: integer
        source: computed
        description: "1-based; null unless status == WAITLISTED. Recomputed after every backfill."
      - name: offer_expires_at
        type: datetime
        source: computed
        description: "Set when status transitions to OFFERED; equals offered_at + OFFER_RESPONSE_HOURS."

  - name: TransferRequest
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
      - name: application_id
        type: string
        source: input
        description: "FK to Application.id. The application MUST cross district lines (program.school.district_id != family.residency_district_id)."
      - name: target_district_id
        type: string
        source: input
        description: "FK to District.id; MUST equal program.school.district_id."
      - name: status
        type: enum
        source: computed
        description: "Lifecycle of the transfer authorization."
        default: "PENDING"
        constraints: "values: PENDING, APPROVED, DENIED, REVOKED"
      - name: capacity_units_held
        type: integer
        source: computed
        description: "Number of inter-district capacity units this transfer reserves on the target district. Equals 1 when APPROVED, 0 otherwise."
        default: 0

  - name: LotteryRun
    parent: null
    common_fields: false
    fields:
      - name: id
        type: string
        source: system
      - name: program_id
        type: string
        source: input
      - name: seed_used
        type: string
        source: system
        description: "Snapshot of program.lottery_seed at draw time."
      - name: drawn_at
        type: datetime
        source: system
      - name: applications_ranked
        type: array
        source: system
        description: "Ordered list of {application_id, lottery_score, rank} dictionaries, rank 1 = highest score."
      - name: offers_issued_count
        type: integer
        source: system
        description: "Number of applications that received an OFFER at this draw (excludes those waitlisted)."

  - name: WaitlistEvent
    parent: null
    common_fields: false
    fields:
      - name: id
        type: string
        source: system
      - name: program_id
        type: string
        source: input
      - name: triggered_by_application_id
        type: string
        source: system
        description: "The application whose decline/expiry caused the backfill."
      - name: promoted_application_id
        type: string
        source: system
        description: "The next-eligible WAITLISTED application that received the freed offer; null if waitlist empty."
      - name: occurred_at
        type: datetime
        source: system

  - name: Clock
    parent: null
    common_fields: false
    fields:
      - name: id
        type: string
        source: system
        description: "Singleton record id = 'clock'."
      - name: now
        type: datetime
        source: system
        description: "Test-controlled wall clock. Advanced via POST /enrollment/_clock/advance."

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:

  - entity: Program
    initial_state: SCHEDULED
    terminal_states: []
    transitions:
      - from: SCHEDULED
        to: OPEN
        trigger: "system: Clock.now >= Program.registration_open_at, observed at next POST /enrollment/_clock/advance"
        actor: system
        preconditions:
          - "Program.registration_open_at <= Clock.now < Program.registration_close_at"
        side_effects:
          - "Application creation under this program becomes legal."
      - from: OPEN
        to: CLOSED
        trigger: "system: Clock.now >= Program.registration_close_at, observed at next POST /enrollment/_clock/advance"
        actor: system
        preconditions:
          - "Clock.now >= Program.registration_close_at"
        side_effects:
          - "Any Application still in status DRAFT is auto-transitioned to WITHDRAWN."
          - "Further Application creation under this program is rejected with ERR_REGISTRATION_WINDOW_CLOSED."
      - from: CLOSED
        to: LOTTERY_DRAWN
        trigger: "POST /enrollment/programs/{id}/lottery/draw"
        actor: DistrictAdmin
        preconditions:
          - "Program.lottery_seed is set and non-empty."
          - "There is at least one Application in this program in status SUBMITTED."
          - "Program.window_status == CLOSED."
        side_effects:
          - "Calculation lottery_score is computed for every SUBMITTED Application; rule_id=lottery_selection (§1.3)."
          - "Applications are sorted by (priority_category rank ASC, lottery_score DESC, created_at ASC tie-break)."
          - "Top seats_total applications transition SUBMITTED -> OFFERED; offer_expires_at = Clock.now + OFFER_RESPONSE_HOURS."
          - "Remaining applications transition SUBMITTED -> WAITLISTED with waitlist_position assigned 1..N by the same ordering."
          - "LotteryRun row is created snapshotting all scores; Program.seats_offered recomputed."
      - from: LOTTERY_DRAWN
        to: BACKFILL
        trigger: "system: first OFFERED->DECLINED or OFFERED->EXPIRED transition under this program"
        actor: system
        preconditions:
          - "Program.window_status == LOTTERY_DRAWN."
        side_effects:
          - "Program enters backfill regime: every subsequent freed offer triggers the waitlist-backfill calculation."

  - entity: Application
    initial_state: DRAFT
    terminal_states: [DECLINED, EXPIRED, WITHDRAWN, ACCEPTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /enrollment/applications/{id}/submit"
        actor: FamilyUser
        preconditions:
          - "Program.window_status == OPEN."
          - "Application's student.family_id resolves to a Family row."
          - "If application crosses district lines (program.school.district_id != family.residency_district_id), a TransferRequest for this application MUST exist with status APPROVED."
          - "No other Application by the same student exists with this choice_rank in DRAFT/SUBMITTED."
        side_effects:
          - "Calculation priority_category_classifier is run; priority_category is set."
          - "Calculation lottery_weight is computed and persisted."
      - from: SUBMITTED
        to: OFFERED
        trigger: "POST /enrollment/programs/{id}/lottery/draw (this application ranks within seats_total)"
        actor: system
        preconditions:
          - "Application is in the top seats_total of the program's ranking."
        side_effects:
          - "offer_expires_at = Clock.now + OFFER_RESPONSE_HOURS."
          - "Program.seats_offered += 1."
      - from: SUBMITTED
        to: WAITLISTED
        trigger: "POST /enrollment/programs/{id}/lottery/draw (this application ranks below seats_total)"
        actor: system
        preconditions:
          - "Application ranks below seats_total in the lottery ordering."
        side_effects:
          - "waitlist_position is assigned."
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /enrollment/applications/{id}/accept"
        actor: FamilyUser
        preconditions:
          - "Clock.now < Application.offer_expires_at."
          - "Application.status == OFFERED."
        side_effects:
          - "Program.seats_accepted += 1."
          - "If the application's family has no head_household_application_id, set head_household_application_id = this application.id (sibling anchor established)."
          - "Cascade: every OTHER OFFERED application by the same student in any program transitions OFFERED -> WITHDRAWN; for each such withdrawal, that program's freed offer triggers waitlist-backfill calculation (rule_id=waitlist_backfill, §1.3)."
          - "Cascade depth: accept (depth 1) -> sibling-program withdrawal (depth 2) -> sibling-program backfill promotion (depth 3)."
      - from: OFFERED
        to: DECLINED
        trigger: "POST /enrollment/applications/{id}/decline"
        actor: FamilyUser
        preconditions:
          - "Application.status == OFFERED."
        side_effects:
          - "Program.seats_offered -= 1."
          - "Waitlist-backfill calculation runs: highest-ranked WAITLISTED application is promoted to OFFERED."
          - "Backfill cascade depth: decline (depth 1) -> next student's OFFERED (depth 2); if that student already has another OFFERED in a different program, that triggers no further auto-action (each student may hold multiple offers until they ACCEPT one)."
      - from: OFFERED
        to: EXPIRED
        trigger: "system: Clock.now >= Application.offer_expires_at, observed at next POST /enrollment/_clock/advance"
        actor: system
        preconditions:
          - "Clock.now >= Application.offer_expires_at."
        side_effects:
          - "Program.seats_offered -= 1."
          - "Waitlist-backfill calculation runs (same as DECLINED)."
      - from: OFFERED
        to: WITHDRAWN
        trigger: "system cascade: another application by the same student transitioned to ACCEPTED"
        actor: system
        preconditions:
          - "Another Application with the same student_id is now in status ACCEPTED."
        side_effects:
          - "Program.seats_offered -= 1."
          - "Waitlist-backfill calculation runs on this program."
      - from: ACCEPTED
        to: WITHDRAWN
        trigger: "POST /enrollment/applications/{id}/withdraw"
        actor: FamilyUser
        preconditions:
          - "Application.status == ACCEPTED."
          - "Clock.now < (LotteryRun.drawn_at + WITHDRAW_GRACE_DAYS) of this program."
        side_effects:
          - "Program.seats_accepted -= 1; Program.seats_offered -= 1."
          - "If this application was the family.head_household_application_id, recompute the anchor (next ACCEPTED application of any sibling in this family by created_at ASC; else null)."
          - "Waitlist-backfill calculation runs on this program."

  - entity: TransferRequest
    initial_state: PENDING
    terminal_states: [DENIED, REVOKED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /enrollment/transfer-requests/{id}/approve"
        actor: DistrictAdmin
        preconditions:
          - "Acting DistrictAdmin.X-User-ID == target_district_id (admin must govern the receiving district)."
          - "Target District.accepts_inter_district_transfers == true."
          - "Count of TransferRequest rows where target_district_id == this.target_district_id AND status == APPROVED is strictly less than the district's seats-available aggregate: SUM over Program.seats_total - Program.seats_accepted for programs whose school.district_id == target_district_id."
        side_effects:
          - "capacity_units_held = 1."
      - from: PENDING
        to: DENIED
        trigger: "POST /enrollment/transfer-requests/{id}/deny"
        actor: DistrictAdmin
        preconditions:
          - "Acting DistrictAdmin.X-User-ID == target_district_id."
        side_effects:
          - "If the linked Application is still in DRAFT and crosses district lines, future submit attempts will fail with ERR_TRANSFER_NOT_APPROVED."
      - from: APPROVED
        to: REVOKED
        trigger: "POST /enrollment/transfer-requests/{id}/revoke"
        actor: DistrictAdmin
        preconditions:
          - "Linked Application.status IN {DRAFT, SUBMITTED, WAITLISTED}."
        side_effects:
          - "capacity_units_held = 0."
          - "If the linked Application is in SUBMITTED or WAITLISTED, that application transitions to WITHDRAWN; if it was OFFERED-eligible at next lottery draw, the lottery skips it; if WAITLISTED, the next slot below shifts up via waitlist-position recompute (rule_id=waitlist_recompute, §1.3)."

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# ---------------------------------------------------------------------------
concurrency_rules:
  - scenario: "Two POST /accept calls arrive on two different OFFERED applications by the same student simultaneously."
    guarantee: "Exactly one application reaches ACCEPTED; the loser is rejected because by the time its precondition check runs, the student already has another ACCEPTED application (the cascade from the winner withdraws all the student's other OFFERED applications)."
    error_id: ERR_STUDENT_ALREADY_ACCEPTED
    http_status: 409
    serialization: "First-writer-wins on Application.status transition keyed by student_id."

  - scenario: "Two POST /accept calls land on the last remaining OFFER and a WAITLISTED app racing through a backfill-induced OFFERED transition; both try to consume the same freed seat."
    guarantee: "At most Program.seats_total applications hold status IN {OFFERED, ACCEPTED} at any moment; the loser is rejected."
    error_id: ERR_SEAT_NOT_AVAILABLE
    http_status: 409
    serialization: "First-writer-wins on Program.seats_offered increment; the seat-availability check is re-evaluated inside the transaction."

  - scenario: "POST /lottery/draw is invoked twice on the same Program concurrently."
    guarantee: "The lottery draw runs exactly once per program lifecycle. The loser sees the program already in LOTTERY_DRAWN or BACKFILL and is rejected."
    error_id: ERR_LOTTERY_ALREADY_DRAWN
    http_status: 409
    serialization: "First-writer-wins on Program.window_status transition from CLOSED."

  - scenario: "Two TransferRequest approvals race against the same district's last available inter-district capacity unit."
    guarantee: "Total APPROVED TransferRequests for a target district MUST NOT exceed the district's inter-district capacity floor (sum of seats_total - seats_accepted across all programs in the district). The loser is rejected."
    error_id: ERR_DISTRICT_CAPACITY_EXCEEDED
    http_status: 409
    serialization: "First-writer-wins on count(TransferRequest where target_district_id=X AND status=APPROVED)."

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: priority_category_classifier
    trigger: "Application.status transition DRAFT -> SUBMITTED"
    algorithm: constraint_propagation
    formula: |
      let f = Family of student
      let p = Program
      let s = School of program
      let crosses_district = (s.district_id != f.residency_district_id)
      let is_disadvantaged = (f.poverty_index_score >= District(s.district_id).poverty_index_threshold)
      let has_sibling_anchor = (f.head_household_application_id IS NOT NULL
                                 AND School(Program(Application(f.head_household_application_id).program_id).school_id).district_id == s.district_id)
      if has_sibling_anchor and not crosses_district:
          return "SIBLING_IN_DISTRICT"
      elif not crosses_district and is_disadvantaged:
          return "IN_DISTRICT_DISADVANTAGED"
      elif not crosses_district:
          return "IN_DISTRICT_STANDARD"
      elif crosses_district and is_disadvantaged:
          return "INTER_DISTRICT_DISADVANTAGED"
      else:
          return "INTER_DISTRICT_STANDARD"
    input_set: "Single application at submit time. The sibling-anchor lookup reads the family's head_household_application_id snapshot at the precise moment SUBMITTED is set."
    constants: {}
    precision: "exact enum"

  - name: lottery_weight
    trigger: "Application.status transition DRAFT -> SUBMITTED, immediately after priority_category_classifier"
    algorithm: tiered_pricing
    formula: |
      # Tiered base weight by category. Sibling > In-district > Inter-district.
      base = {
        "SIBLING_IN_DISTRICT": 4.0,
        "IN_DISTRICT_DISADVANTAGED": 3.0,
        "IN_DISTRICT_STANDARD": 2.0,
        "INTER_DISTRICT_DISADVANTAGED": 1.5,
        "INTER_DISTRICT_STANDARD": 1.0
      }[priority_category]
      # Poverty multiplier — STRICT > on the district threshold, applied AFTER base lookup.
      # IMPORTANT: to avoid floating-point drift at decile boundaries, both values are
      # first scaled to integers by multiplying by 100 (since both are stored with at most
      # 2 decimal places) and rounded to the nearest integer.
      poverty_score = Family.poverty_index_score   # 0.00..1.00, 2 decimals
      threshold     = District.poverty_index_threshold
      pi_int  = round(poverty_score * 100)         # integer 0..100
      thr_int = round(threshold * 100)             # integer 0..100
      if pi_int > thr_int:
          deciles = (pi_int - thr_int) // 10        # integer floor-divide
          multiplier = 1.0 + POVERTY_BOOST_PER_DECILE * deciles
      else:
          multiplier = 1.0
      # Choice-rank decay — application's choice_rank (1..5).
      decay = CHOICE_RANK_DECAY ** (Application.choice_rank - 1)
      raw = base * multiplier * decay
      return round(raw, 4)   # 4 decimal places, ROUND_HALF_UP
    input_set: "Single application. The Family.poverty_index_score used is the snapshot at SUBMIT (subsequent edits do not retro-update lottery_weight)."
    constants:
      POVERTY_BOOST_PER_DECILE: 0.10
      CHOICE_RANK_DECAY: 0.85
    precision: "4 decimal places, ROUND_HALF_UP"
    variants:
      - name: with_sibling_anchor
        when: "Application qualifies for SIBLING_IN_DISTRICT priority_category."
        difference: "Base weight is 4.0 even if the family is non-disadvantaged; sibling priority dominates the poverty multiplier in the base lookup table."
      - name: inter_district_disadvantaged
        when: "Application crosses district lines and family.poverty_index_score >= residency district's threshold."
        difference: "Base weight is 1.5, not 3.0 — inter-district disadvantaged sits below in-district standard."

  - name: lottery_selection
    trigger: "POST /enrollment/programs/{id}/lottery/draw — runs once during transition CLOSED -> LOTTERY_DRAWN"
    algorithm: weighted_scoring
    formula: |
      # For every SUBMITTED Application a in this Program:
      #   rng_a = deterministic_uniform_0_1(seed=program.lottery_seed, salt=a.id)
      #   a.lottery_score = round(a.lottery_weight * -ln(rng_a), 6)
      # (Inverse-CDF exponential sampling weighted by lottery_weight; equivalent to
      #  weighted reservoir sampling. Higher score wins.)
      #
      # Then sort applications by:
      #   1) priority_category rank ascending where
      #        SIBLING_IN_DISTRICT       = 1
      #        IN_DISTRICT_DISADVANTAGED = 2
      #        IN_DISTRICT_STANDARD      = 3
      #        INTER_DISTRICT_DISADVANTAGED = 4
      #        INTER_DISTRICT_STANDARD   = 5
      #   2) lottery_score DESC
      #   3) Application.created_at ASC (tie-break)
      #   4) Application.id ASC (deterministic final tie-break)
      #
      # Top seats_total applications receive OFFERED.
      # Remainder receive WAITLISTED with waitlist_position = 1..N
      # in the same ordering (offset by seats_total).
    input_set: "All Application rows where program_id == this Program.id AND status == SUBMITTED."
    constants: {}
    precision: "lottery_score rounded to 6 decimal places ROUND_HALF_UP. rng_a fixed seed must be (program.lottery_seed + ':' + application.id) hashed via SHA-256, taking first 8 bytes as big-endian unsigned int, divided by 2**64. Use 0.0 < rng_a <= 1.0 (re-draw if exact 0)."
    variants:
      - name: priority_then_score
        when: "Default ordering."
        difference: "Priority dominates: a SIBLING_IN_DISTRICT application with low lottery_score still beats an IN_DISTRICT_STANDARD application with high lottery_score."
      - name: pure_score_within_category
        when: "Within the same priority_category bucket."
        difference: "Ordering is by lottery_score DESC only; lottery_weight matters only to the extent it shifts the expected score distribution."

  - name: waitlist_backfill
    trigger: "Application.status transition OFFERED -> {DECLINED, EXPIRED, WITHDRAWN} OR ACCEPTED -> WITHDRAWN"
    algorithm: waterfall_allocation
    formula: |
      # On a freed seat in Program P:
      candidates = Application rows where program_id == P.id AND status == WAITLISTED
                   AND linked_transfer_ok(a)   # APPROVED transfer if cross-district, else true
      if candidates is empty:
          return  # no-op, P.seats_offered already decremented
      # Choose the next promotee — STRICT preservation of original lottery ordering,
      # NOT re-running the lottery. Reuse the LotteryRun.applications_ranked snapshot:
      ranked = LotteryRun.applications_ranked filtered to candidates
      promotee = ranked[0]
      # Transition:
      promotee.status = OFFERED
      promotee.offer_expires_at = Clock.now + OFFER_RESPONSE_HOURS
      promotee.waitlist_position = null
      # Recompute the remaining waitlist positions:
      for i, a in enumerate(ranked[1:], start=1):
          a.waitlist_position = i
      P.seats_offered += 1
      # Emit a WaitlistEvent row.
    input_set: "All Application rows in Program P with status == WAITLISTED at the moment the freeing transition lands."
    constants:
      OFFER_RESPONSE_HOURS: 168    # 7 days
    precision: "exact, no rounding"
    variants:
      - name: with_eligible_transfer
        when: "Cross-district promotee has TransferRequest.status == APPROVED."
        difference: "Promotee receives OFFERED normally."
      - name: skip_revoked_transfer
        when: "Cross-district promotee has TransferRequest.status == REVOKED."
        difference: "Promotee is skipped; the freed offer cascades to the next candidate. Skipped applications stay in their CURRENT status (which is WITHDRAWN per the REVOKE side-effect)."

  - name: district_inter_district_capacity
    trigger: "TransferRequest.status transition PENDING -> APPROVED"
    algorithm: aggregation
    formula: |
      # Aggregate available inter-district capacity in target district D:
      capacity = SUM(p.seats_total - p.seats_accepted) for p in Programs of D
                 WHERE p.school.school_type IN {MAGNET, CHARTER}
                 AND p.window_status IN {SCHEDULED, OPEN, CLOSED, LOTTERY_DRAWN, BACKFILL}
      held = COUNT(TransferRequest where target_district_id == D.id AND status == APPROVED)
      if held + 1 > capacity:
          raise ERR_DISTRICT_CAPACITY_EXCEEDED
      else:
          allow approval.
    input_set: "All Program rows whose school.district_id == target_district_id AND school.school_type IN {MAGNET, CHARTER}. NEIGHBORHOOD schools are excluded from inter-district transfer capacity."
    constants: {}
    precision: "integer, no rounding"
    variants:
      - name: pre_draw
        when: "Target district has at least one Program in window_status IN {SCHEDULED, OPEN}."
        difference: "seats_accepted is the LIVE count at evaluation time."
      - name: post_draw
        when: "All target-district programs are in window_status IN {LOTTERY_DRAWN, BACKFILL}."
        difference: "seats_accepted reflects post-lottery commitments; available capacity is typically lower."

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (priority-ordered)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "Request carries valid X-User-ID and X-User-Role headers."
    error_id: ERR_AUTH_MISSING
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role is one of {FamilyUser, DistrictAdmin, SystemOperator}."
    error_id: ERR_AUTH_INVALID_ROLE
    http_status: 401
    applies_to: all

  - priority: 3
    category: auth
    check: "Role is permitted on this endpoint per §1.7 RBAC."
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 4
    category: existence
    check: "Every path parameter id resolves to a row; checked left-to-right."
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 5
    category: existence
    check: "Every foreign-key id in the request body resolves to a row."
    error_id: ERR_FK_NOT_FOUND
    http_status: 422
    applies_to: "POST/PATCH endpoints with FK fields"

  - priority: 6
    category: state
    check: "Application.submit requires Program.window_status == OPEN."
    error_id: ERR_REGISTRATION_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /applications/{id}/submit"

  - priority: 7
    category: state
    check: "Application.accept/decline requires Application.status == OFFERED."
    error_id: ERR_INVALID_STATE_FOR_TRANSITION
    http_status: 409
    applies_to: "POST /applications/{id}/accept, decline"

  - priority: 8
    category: state
    check: "Lottery draw requires Program.window_status == CLOSED."
    error_id: ERR_LOTTERY_NOT_READY
    http_status: 409
    applies_to: "POST /programs/{id}/lottery/draw"

  - priority: 9
    category: state
    check: "Lottery draw requires Program.lottery_seed to be non-empty."
    error_id: ERR_LOTTERY_SEED_MISSING
    http_status: 422
    applies_to: "POST /programs/{id}/lottery/draw"

  - priority: 10
    category: state
    check: "Lottery draw rejected if window_status != CLOSED (already drawn case → ERR_LOTTERY_ALREADY_DRAWN)."
    error_id: ERR_LOTTERY_ALREADY_DRAWN
    http_status: 409
    applies_to: "POST /programs/{id}/lottery/draw"
    note: |
      Priority conflict A — boundary precision between rules 8 and 10:
      window_status == LOTTERY_DRAWN or BACKFILL produces ERR_LOTTERY_ALREADY_DRAWN (priority 10),
      every other non-CLOSED status (SCHEDULED, OPEN) produces ERR_LOTTERY_NOT_READY (priority 8).
      A racing second draw on a CLOSED program goes through rule 8 first, fails OCC, and the
      loser sees ERR_LOTTERY_ALREADY_DRAWN via the concurrency rule.

  - priority: 11
    category: business_referential
    check: "If application crosses district lines, a TransferRequest with status APPROVED MUST link application_id."
    error_id: ERR_TRANSFER_NOT_APPROVED
    http_status: 422
    applies_to: "POST /applications/{id}/submit"

  - priority: 12
    category: business_safety
    check: "Student grade_level_next_year must equal Program.grade_level."
    error_id: ERR_GRADE_MISMATCH
    http_status: 422
    applies_to: "POST /applications, POST /applications/{id}/submit"

  - priority: 13
    category: business_constraint
    check: "Within a single student, choice_rank values are unique across DRAFT/SUBMITTED applications."
    error_id: ERR_DUPLICATE_CHOICE_RANK
    http_status: 422
    applies_to: "POST /applications, POST /applications/{id}/submit"

  - priority: 14
    category: business_temporal
    check: "Accept/decline of an OFFERED application requires Clock.now < Application.offer_expires_at."
    error_id: ERR_OFFER_EXPIRED
    http_status: 409
    applies_to: "POST /applications/{id}/accept, decline"
    note: |
      Priority conflict B — temporal vs state ordering:
      if an OFFERED application's offer_expires_at has passed but the system has not yet
      observed it (no clock advance), priority 7 (state) sees status==OFFERED and PASSES,
      then priority 14 (temporal) FAILS with ERR_OFFER_EXPIRED.
      However, AFTER POST /_clock/advance runs the sweep, status becomes EXPIRED and the
      same request fails at priority 7 with ERR_INVALID_STATE_FOR_TRANSITION instead.
      The two errors signal the same underlying condition, but the request's outcome
      depends on whether the sweep has run — pin the test ordering accordingly.

  - priority: 15
    category: business_constraint
    check: "TransferRequest approval requires target District.accepts_inter_district_transfers == true."
    error_id: ERR_DISTRICT_NO_TRANSFERS
    http_status: 422
    applies_to: "POST /transfer-requests/{id}/approve"

  - priority: 16
    category: business_fiscal
    check: "TransferRequest approval requires inter-district capacity headroom (see §1.3 district_inter_district_capacity)."
    error_id: ERR_DISTRICT_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /transfer-requests/{id}/approve"
    note: |
      Priority conflict C — business_constraint (priority 15) vs business_fiscal (priority 16):
      when a district has accepts_inter_district_transfers == false AND its capacity is also
      already at zero, rule 15 fires first (ERR_DISTRICT_NO_TRANSFERS).

  - priority: 17
    category: business_fiscal
    check: "Program seats_total must be a positive integer at creation; subsequent decreases are rejected if seats_accepted > new value."
    error_id: ERR_SEATS_BELOW_COMMITTED
    http_status: 422
    applies_to: "POST /programs, PATCH /programs/{id}"

  - priority: 18
    category: business_temporal
    check: "Application.withdraw after ACCEPT requires Clock.now < (LotteryRun.drawn_at + WITHDRAW_GRACE_DAYS)."
    error_id: ERR_WITHDRAW_GRACE_PASSED
    http_status: 409
    applies_to: "POST /applications/{id}/withdraw"

  - priority: 19
    category: business_constraint
    check: "Number of DRAFT/SUBMITTED applications per student MUST NOT exceed MAX_CHOICES_PER_STUDENT (=5)."
    error_id: ERR_TOO_MANY_CHOICES
    http_status: 422
    applies_to: "POST /applications, POST /applications/{id}/submit"

  - priority: 20
    category: business_referential
    check: "Program.grade_level MUST appear in Program.school.grade_levels_offered."
    error_id: ERR_GRADE_NOT_OFFERED
    http_status: 422
    applies_to: "POST /programs"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:
  - method: POST
    path: /enrollment/districts
    description: "Create a school district."
    roles: [SystemOperator]
    code: 201
    input: [name, state_code, "accepts_inter_district_transfers?", "poverty_index_threshold?"]
    output: District
    side_effects: []

  - method: GET
    path: /enrollment/districts
    description: "List districts."
    roles: [SystemOperator, DistrictAdmin, FamilyUser]
    code: 200
    input: ["limit?", "offset?"]
    output: District[]
    side_effects: []

  - method: GET
    path: /enrollment/districts/{id}
    description: "Read district."
    roles: [SystemOperator, DistrictAdmin, FamilyUser]
    code: 200
    input: []
    output: District
    side_effects: []

  - method: PATCH
    path: /enrollment/districts/{id}
    description: "Update accepts_inter_district_transfers and poverty_index_threshold."
    roles: [SystemOperator]
    code: 200
    input: ["accepts_inter_district_transfers?", "poverty_index_threshold?", "version?"]
    output: District
    side_effects: []

  - method: POST
    path: /enrollment/schools
    description: "Create a school under a district."
    roles: [DistrictAdmin]
    code: 201
    input: [district_id, name, school_type, grade_levels_offered]
    output: School
    side_effects: []

  - method: GET
    path: /enrollment/schools
    description: "List schools, optionally filtered by district_id and school_type."
    roles: [SystemOperator, DistrictAdmin, FamilyUser]
    code: 200
    input: ["district_id?", "school_type?", "limit?", "offset?"]
    output: School[]
    side_effects: []

  - method: POST
    path: /enrollment/programs
    description: "Create a program (grade-level seat pool) within a school."
    roles: [DistrictAdmin]
    code: 201
    input: [school_id, grade_level, academic_year, seats_total, registration_open_at, registration_close_at, "lottery_seed?"]
    output: Program
    side_effects: []

  - method: GET
    path: /enrollment/programs
    description: "List programs, with filters."
    roles: [SystemOperator, DistrictAdmin, FamilyUser]
    code: 200
    input: ["school_id?", "district_id?", "window_status?", "grade_level?", "limit?", "offset?"]
    output: Program[]
    side_effects: []

  - method: GET
    path: /enrollment/programs/{id}
    description: "Read a program; output includes seats_offered, seats_accepted, window_status."
    roles: [SystemOperator, DistrictAdmin, FamilyUser]
    code: 200
    input: []
    output: Program
    side_effects: []

  - method: PATCH
    path: /enrollment/programs/{id}
    description: "Update seats_total or lottery_seed (only legal while window_status IN {SCHEDULED, OPEN, CLOSED})."
    roles: [DistrictAdmin]
    code: 200
    input: ["seats_total?", "lottery_seed?", "registration_close_at?", "version?"]
    output: Program
    side_effects:
      - "If seats_total decreased below seats_accepted -> ERR_SEATS_BELOW_COMMITTED."

  - method: POST
    path: /enrollment/programs/{id}/lottery/draw
    description: "Run the weighted lottery and issue offers."
    roles: [DistrictAdmin]
    code: 200
    input: []
    output: LotteryRun
    side_effects:
      - "Runs calculation lottery_selection."
      - "Transitions Program CLOSED -> LOTTERY_DRAWN."
      - "Transitions every SUBMITTED Application to OFFERED or WAITLISTED."
      - "Creates one LotteryRun row."

  - method: POST
    path: /enrollment/families
    description: "Register a family."
    roles: [FamilyUser, SystemOperator]
    code: 201
    input: [residency_district_id, poverty_index_score]
    output: Family
    side_effects: []

  - method: GET
    path: /enrollment/families/{id}
    description: "Read family; includes head_household_application_id."
    roles: [FamilyUser, DistrictAdmin, SystemOperator]
    code: 200
    input: []
    output: Family
    side_effects: []

  - method: POST
    path: /enrollment/students
    description: "Add a student to a family."
    roles: [FamilyUser]
    code: 201
    input: [family_id, grade_level_next_year, "has_iep?"]
    output: Student
    side_effects: []

  - method: GET
    path: /enrollment/students/{id}
    description: "Read student."
    roles: [FamilyUser, DistrictAdmin]
    code: 200
    input: []
    output: Student
    side_effects: []

  - method: POST
    path: /enrollment/applications
    description: "Create a DRAFT application."
    roles: [FamilyUser]
    code: 201
    input: [student_id, program_id, choice_rank]
    output: Application
    side_effects: []

  - method: GET
    path: /enrollment/applications
    description: "List applications, filterable by student_id, program_id, status."
    roles: [FamilyUser, DistrictAdmin, SystemOperator]
    code: 200
    input: ["student_id?", "program_id?", "status?", "family_id?", "limit?", "offset?"]
    output: Application[]
    side_effects: []

  - method: GET
    path: /enrollment/applications/{id}
    description: "Read application."
    roles: [FamilyUser, DistrictAdmin, SystemOperator]
    code: 200
    input: []
    output: Application
    side_effects: []

  - method: POST
    path: /enrollment/applications/{id}/submit
    description: "Transition DRAFT -> SUBMITTED."
    roles: [FamilyUser]
    code: 200
    input: ["version?"]
    output: Application
    side_effects:
      - "Runs priority_category_classifier and lottery_weight calculations."

  - method: POST
    path: /enrollment/applications/{id}/accept
    description: "Transition OFFERED -> ACCEPTED. Cascades withdrawal of student's other OFFERED apps."
    roles: [FamilyUser]
    code: 200
    input: ["version?"]
    output: Application
    side_effects:
      - "Cascade: other OFFERED applications by same student -> WITHDRAWN; each triggers waitlist_backfill on its program."
      - "Sets Family.head_household_application_id if not already set."

  - method: POST
    path: /enrollment/applications/{id}/decline
    description: "Transition OFFERED -> DECLINED. Runs waitlist_backfill."
    roles: [FamilyUser]
    code: 200
    input: ["version?"]
    output: Application
    side_effects:
      - "Runs waitlist_backfill on this program."

  - method: POST
    path: /enrollment/applications/{id}/withdraw
    description: "Transition ACCEPTED -> WITHDRAWN. Subject to withdraw-grace temporal validation."
    roles: [FamilyUser]
    code: 200
    input: ["version?"]
    output: Application
    side_effects:
      - "Recomputes Family.head_household_application_id if this was the anchor."
      - "Runs waitlist_backfill on this program."

  - method: POST
    path: /enrollment/transfer-requests
    description: "Create a PENDING inter-district transfer request."
    roles: [FamilyUser]
    code: 201
    input: [application_id, target_district_id]
    output: TransferRequest
    side_effects: []

  - method: GET
    path: /enrollment/transfer-requests
    description: "List transfer requests."
    roles: [FamilyUser, DistrictAdmin, SystemOperator]
    code: 200
    input: ["target_district_id?", "status?", "application_id?", "limit?", "offset?"]
    output: TransferRequest[]
    side_effects: []

  - method: POST
    path: /enrollment/transfer-requests/{id}/approve
    description: "Transition PENDING -> APPROVED."
    roles: [DistrictAdmin]
    code: 200
    input: ["version?"]
    output: TransferRequest
    side_effects:
      - "Runs district_inter_district_capacity calculation."

  - method: POST
    path: /enrollment/transfer-requests/{id}/deny
    description: "Transition PENDING -> DENIED."
    roles: [DistrictAdmin]
    code: 200
    input: ["version?"]
    output: TransferRequest
    side_effects: []

  - method: POST
    path: /enrollment/transfer-requests/{id}/revoke
    description: "Transition APPROVED -> REVOKED. Cascades to linked Application."
    roles: [DistrictAdmin]
    code: 200
    input: ["version?"]
    output: TransferRequest
    side_effects:
      - "Linked application transitions to WITHDRAWN if in SUBMITTED/WAITLISTED."
      - "Waitlist positions recompute on the affected program."

  - method: GET
    path: /enrollment/lottery-runs/{id}
    description: "Read a lottery run audit record."
    roles: [DistrictAdmin, SystemOperator]
    code: 200
    input: []
    output: LotteryRun
    side_effects: []

  - method: GET
    path: /enrollment/programs/{id}/waitlist-events
    description: "List waitlist events for a program in chronological order."
    roles: [DistrictAdmin, SystemOperator]
    code: 200
    input: ["limit?", "offset?"]
    output: WaitlistEvent[]
    side_effects: []

  - method: POST
    path: /enrollment/_clock/advance
    description: "Test-only: advance the simulated clock to a target ISO8601 instant. Triggers all due window_status and offer_expires sweeps."
    roles: [SystemOperator]
    code: 200
    input: [target_now]
    output: Clock
    side_effects:
      - "Auto-transitions Programs SCHEDULED->OPEN, OPEN->CLOSED if their respective open/close instants are reached."
      - "Auto-transitions OFFERED Applications to EXPIRED if offer_expires_at has passed; each triggers waitlist_backfill."
      - "Auto-transitions DRAFT Applications to WITHDRAWN if their program's window_status becomes CLOSED."

  - method: GET
    path: /enrollment/_clock
    description: "Test-only: read current simulated clock."
    roles: [SystemOperator, DistrictAdmin, FamilyUser]
    code: 200
    input: []
    output: Clock
    side_effects: []

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  - id: ERR_AUTH_MISSING
    http: 401
    condition: "X-User-ID or X-User-Role header absent."
  - id: ERR_AUTH_INVALID_ROLE
    http: 401
    condition: "X-User-Role not in {FamilyUser, DistrictAdmin, SystemOperator}."
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not authorized for this endpoint."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path-parameter id does not resolve."
  - id: ERR_FK_NOT_FOUND
    http: 422
    condition: "Body foreign-key id does not resolve."
  - id: ERR_VERSION_MISMATCH
    http: 409
    condition: "PATCH version does not match current resource version."
  - id: ERR_REGISTRATION_WINDOW_CLOSED
    http: 409
    condition: "Attempt to submit/create an Application while program.window_status != OPEN."
  - id: ERR_INVALID_STATE_FOR_TRANSITION
    http: 409
    condition: "Resource is not in a legal source state for the requested transition."
  - id: ERR_LOTTERY_NOT_READY
    http: 409
    condition: "Program.window_status not in CLOSED when /lottery/draw invoked."
  - id: ERR_LOTTERY_ALREADY_DRAWN
    http: 409
    condition: "Program.window_status already in LOTTERY_DRAWN or BACKFILL."
  - id: ERR_LOTTERY_SEED_MISSING
    http: 422
    condition: "lottery_seed null/empty at draw time."
  - id: ERR_TRANSFER_NOT_APPROVED
    http: 422
    condition: "Cross-district application submitted without an APPROVED TransferRequest."
  - id: ERR_DISTRICT_NO_TRANSFERS
    http: 422
    condition: "Target District.accepts_inter_district_transfers is false."
  - id: ERR_DISTRICT_CAPACITY_EXCEEDED
    http: 409
    condition: "Inter-district capacity headroom would be exceeded by this approval."
  - id: ERR_GRADE_MISMATCH
    http: 422
    condition: "Student.grade_level_next_year != Program.grade_level."
  - id: ERR_GRADE_NOT_OFFERED
    http: 422
    condition: "Program.grade_level not in Program.school.grade_levels_offered."
  - id: ERR_DUPLICATE_CHOICE_RANK
    http: 422
    condition: "Same student already has another DRAFT/SUBMITTED application with this choice_rank."
  - id: ERR_OFFER_EXPIRED
    http: 409
    condition: "Clock.now >= Application.offer_expires_at on accept/decline."
  - id: ERR_TOO_MANY_CHOICES
    http: 422
    condition: "Student already has MAX_CHOICES_PER_STUDENT=5 active applications."
  - id: ERR_STUDENT_ALREADY_ACCEPTED
    http: 409
    condition: "Student already has an Application in status ACCEPTED."
  - id: ERR_SEAT_NOT_AVAILABLE
    http: 409
    condition: "Race: Program.seats_offered + seats_accepted would exceed seats_total."
  - id: ERR_SEATS_BELOW_COMMITTED
    http: 422
    condition: "Program.seats_total update would fall below current seats_accepted."
  - id: ERR_WITHDRAW_GRACE_PASSED
    http: 409
    condition: "ACCEPTED -> WITHDRAWN attempted after LotteryRun.drawn_at + WITHDRAW_GRACE_DAYS."
  - id: ERR_VALIDATION
    http: 422
    condition: "Body schema, range, or format violation not covered by a more specific error."

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: SystemOperator
    description: "Test-time platform operator. Manages districts, runs the clock, audits lottery runs."
    identity: "opaque"
    exclusive_operations:
      - "POST /enrollment/districts"
      - "PATCH /enrollment/districts/{id}"
      - "POST /enrollment/_clock/advance"
    shared_operations:
      - "GET on every resource."
      - "POST /enrollment/families (registration-by-operator path)."

  - name: DistrictAdmin
    description: "Administrator of a specific district; X-User-ID equals District.id."
    identity: "entity_backed:District"
    exclusive_operations:
      - "POST /enrollment/schools (district_id MUST equal X-User-ID)."
      - "POST /enrollment/programs (school must belong to admin's district)."
      - "PATCH /enrollment/programs/{id} (program's school's district_id == X-User-ID)."
      - "POST /enrollment/programs/{id}/lottery/draw"
      - "POST /enrollment/transfer-requests/{id}/approve (target_district_id == X-User-ID)."
      - "POST /enrollment/transfer-requests/{id}/deny (target_district_id == X-User-ID)."
      - "POST /enrollment/transfer-requests/{id}/revoke (target_district_id == X-User-ID)."
    shared_operations:
      - "GET on every resource."

  - name: FamilyUser
    description: "Acting member of a household; X-User-ID equals Family.id."
    identity: "entity_backed:Family"
    exclusive_operations:
      - "POST /enrollment/students (family_id == X-User-ID)."
      - "POST /enrollment/applications (student.family_id == X-User-ID)."
      - "POST /enrollment/applications/{id}/submit, accept, decline, withdraw (student.family_id == X-User-ID)."
      - "POST /enrollment/transfer-requests (application's student.family_id == X-User-ID)."
    shared_operations:
      - "GET /enrollment/applications filtered to own family."
      - "GET /enrollment/districts, /enrollment/schools, /enrollment/programs (read-only catalog)."
