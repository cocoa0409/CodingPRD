# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Task 1883: Energy Modeling & Green Building Certification
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: energy_model_provisional_vs_final_improvement
        grounds:
          - calculations.energy_cost_improvement
          - state_machines.EnergyModel.DRAFT_to_LOCKED
          - entities.EnergyModel.fields.improvement_pct_provisional
          - entities.EnergyModel.fields.improvement_pct_final
        distinguishing_aspect: |
          Entity domain = EnergyModel: identical locked inputs produce two stored
          variants — improvement_pct_provisional (modeled costs, includes
          unconfirmed measures) = 10.00 vs improvement_pct_final (confirmed-only
          costs) = 5.00 — different results for the same model pair.
        test_recipe:
          setup:
            - "PERFORMANCE-path project exists (sqft 120000)"
            - "LOCKED BASELINE model at 12000000/12000000 cents"
            - "DRAFT PROPOSED model: modeled 10800000, confirmed-only 11400000, includes_unconfirmed_measures=true"
          setup_api_calls:
            - call: "POST /team-members"
              payload: { full_name: "Molly Modeler", email: "molly@x.com", specialty: "MODELING" }
              as: ProgramAdmin
              captures: { m_model: $.data.id }
            - call: "POST /team-members"
              payload: { full_name: "Adam Admin", email: "adam@x.com", specialty: "MANAGEMENT" }
              as: ProgramAdmin
              captures: { m_admin: $.data.id }
            - call: "POST /certification-projects"
              payload: { project_name: "Tower A", rating_system: "LEED_BD_C", compliance_path: "PERFORMANCE", gross_floor_area_sqft: 120000, target_level: "SILVER", fee_budget_cents: 5000000 }
              as: ProjectAdministrator
              as_user_id: "${m_admin}"
              captures: { p_id: $.data.id, p_v: $.data.version }
            - call: "POST /energy-models"
              payload: { project_id: "${p_id}", model_type: "BASELINE", modeling_standard: "ASHRAE_90_1_2019", annual_energy_cost_modeled_cents: 12000000, annual_energy_cost_confirmed_only_cents: 12000000, includes_unconfirmed_measures: false, expected_project_version: "${p_v}" }
              as: EnergyModeler
              as_user_id: "${m_model}"
              captures: { bm_id: $.data.id }
            - call: "GET /certification-projects/${p_id}"
              as: Any
              captures: { p_v2: $.data.version }
            - call: "POST /energy-models"
              payload: { project_id: "${p_id}", model_type: "PROPOSED", modeling_standard: "ASHRAE_90_1_2019", annual_energy_cost_modeled_cents: 10800000, annual_energy_cost_confirmed_only_cents: 11400000, includes_unconfirmed_measures: true, expected_project_version: "${p_v2}" }
              as: EnergyModeler
              as_user_id: "${m_model}"
              captures: { pm_id: $.data.id }
            - call: "POST /energy-models/${bm_id}/lock"
              as: EnergyModeler
              as_user_id: "${m_model}"
          trigger:
            - call: "POST /energy-models/${pm_id}/lock"
              as: EnergyModeler
              as_user_id: "${m_model}"
          assert:
            - "EnergyModel.${pm_id}.status == LOCKED"
            - "EnergyModel.${pm_id}.improvement_pct_provisional == 10.00"
            - "EnergyModel.${pm_id}.improvement_pct_final == 5.00"
            - "improvement_pct_provisional != improvement_pct_final for identical locked inputs"

      - name: project_optimistic_vs_conservative_level
        grounds:
          - calculations.certification_level_of_points
          - entities.CertificationProject.fields.projected_level
          - entities.CertificationProject.fields.conservative_level
        distinguishing_aspect: |
          Entity domain = CertificationProject (different domain than the
          EnergyModel instance): with three 20-point attempts SUBMITTED and zero
          awarded, the optimistic input set yields projected_level GOLD (60 pts
          at face value) while the conservative input set yields
          conservative_level NONE (0 awarded) — same portfolio, two variants,
          different levels.
        test_recipe:
          setup:
            - "PRESCRIPTIVE project targeting GOLD, fee budget 5000000"
            - "Library: prerequisite P (20 pts, BOTH) and regulars D1, D2 (20 pts, DESIGN)"
            - "Attempts aP/aD1/aD2 owned by the DOCUMENTATION specialist, all SUBMITTED in the DESIGN phase package"
          setup_api_calls:
            - call: "POST /team-members"
              payload: { full_name: "Adam Admin", email: "adam@x.com", specialty: "MANAGEMENT" }
              as: ProgramAdmin
              captures: { m_admin: $.data.id }
            - call: "POST /team-members"
              payload: { full_name: "Dana Docs", email: "dana@x.com", specialty: "DOCUMENTATION" }
              as: ProgramAdmin
              captures: { m_spec: $.data.id }
            - call: "POST /credit-library-entries"
              payload: { credit_code: "EAp1", title: "Fundamental Commissioning", category: "ENERGY_ATMOSPHERE", points_possible: 20, is_prerequisite: true, phase_eligibility: "BOTH", requires_energy_model: false }
              as: ProgramAdmin
              captures: { e_p: $.data.id }
            - call: "POST /credit-library-entries"
              payload: { credit_code: "WEc1", title: "Water Efficiency", category: "WATER", points_possible: 20, is_prerequisite: false, phase_eligibility: "DESIGN", requires_energy_model: false }
              as: ProgramAdmin
              captures: { e_d1: $.data.id }
            - call: "POST /credit-library-entries"
              payload: { credit_code: "MRc1", title: "Materials Reuse", category: "MATERIALS", points_possible: 20, is_prerequisite: false, phase_eligibility: "DESIGN", requires_energy_model: false }
              as: ProgramAdmin
              captures: { e_d2: $.data.id }
            - call: "POST /certification-projects"
              payload: { project_name: "Tower B", rating_system: "LEED_BD_C", compliance_path: "PRESCRIPTIVE", gross_floor_area_sqft: 120000, target_level: "GOLD", fee_budget_cents: 5000000 }
              as: ProjectAdministrator
              as_user_id: "${m_admin}"
              captures: { p_id: $.data.id }
            - call: "POST /credit-attempts"
              payload: { project_id: "${p_id}", credit_library_entry_id: "${e_p}", phase: "DESIGN", documentation_owner_id: "${m_spec}" }
              as: ProjectAdministrator
              as_user_id: "${m_admin}"
              captures: { a_p: $.data.id }
            - call: "POST /credit-attempts"
              payload: { project_id: "${p_id}", credit_library_entry_id: "${e_d1}", phase: "DESIGN", documentation_owner_id: "${m_spec}" }
              as: ProjectAdministrator
              as_user_id: "${m_admin}"
              captures: { a_d1: $.data.id }
            - call: "POST /credit-attempts"
              payload: { project_id: "${p_id}", credit_library_entry_id: "${e_d2}", phase: "DESIGN", documentation_owner_id: "${m_spec}" }
              as: ProjectAdministrator
              as_user_id: "${m_admin}"
              captures: { a_d2: $.data.id }
            - call: "GET /certification-projects/${p_id}"
              as: Any
              captures: { p_v: $.data.version }
            - call: "POST /certification-projects/${p_id}/lock-strategy"
              payload: { expected_project_version: "${p_v}" }
              as: ProjectAdministrator
              as_user_id: "${m_admin}"
            - call: "POST /credit-attempts/${a_p}/assign-owner"
              payload: { documentation_owner_id: "${m_spec}" }
              as: ProjectAdministrator
              as_user_id: "${m_admin}"
            - call: "POST /credit-attempts/${a_d1}/assign-owner"
              payload: { documentation_owner_id: "${m_spec}" }
              as: ProjectAdministrator
              as_user_id: "${m_admin}"
            - call: "POST /credit-attempts/${a_d2}/assign-owner"
              payload: { documentation_owner_id: "${m_spec}" }
              as: ProjectAdministrator
              as_user_id: "${m_admin}"
            - call: "POST /credit-attempts/${a_p}/mark-ready"
              as: DocumentationSpecialist
              as_user_id: "${m_spec}"
            - call: "POST /credit-attempts/${a_d1}/mark-ready"
              as: DocumentationSpecialist
              as_user_id: "${m_spec}"
            - call: "POST /credit-attempts/${a_d2}/mark-ready"
              as: DocumentationSpecialist
              as_user_id: "${m_spec}"
            - call: "POST /certification-projects/${p_id}/submit-phase"
              payload: { phase: "DESIGN" }
              as: ProjectAdministrator
              as_user_id: "${m_admin}"
          trigger:
            - call: "GET /certification-projects/${p_id}"
              as: Any
          assert:
            - "CertificationProject.${p_id}.points_pursued_total == 60"
            - "CertificationProject.${p_id}.points_awarded_total == 0"
            - "CertificationProject.${p_id}.projected_level == GOLD (optimistic variant counts SUBMITTED attempts at points_possible: 60 >= 60)"
            - "CertificationProject.${p_id}.conservative_level == NONE (conservative variant counts AWARDED only: 0 < 40)"
            - "projected_level != conservative_level for identical portfolio data"

  - rule_id: combinatorial_formula
    instances:
      - name: incentive_stacking_cap_waterfall
        grounds:
          - calculations.incentive_stacking_waterfall
          - entities.CostPremiumAnalysis.fields.incentive_total_cents
        distinguishing_aspect: |
          Mode (a) combinatorial formula with >= 3 inputs and non-linear
          interaction: combinable sum (8,000,000 + 5,000,000) + per-type max of
          non-combinable TAX_CREDITs (max(15,000,000, 12,000,000)) = raw
          28,000,000, then nested min with cap floor(0.40 * 50,000,000) =
          20,000,000 — the cap binds and incentive_total_cents == 20,000,000.
        test_recipe:
          setup:
            - "PERFORMANCE-path project fully CERTIFIED at level CERTIFIED (40 awarded points: prereq 20 + design 10 + construction 10), models LOCKED (baseline 12000000, proposed confirmed 11400000), prerequisite-linked commissioning PASSED"
            - "Programs: G1 GRANT combinable 8000000; R1 UTILITY_REBATE combinable 5000000; T1 TAX_CREDIT non-combinable 15000000; T2 TAX_CREDIT non-combinable 12000000 — all minimum CERTIFIED, all APPROVED on the project"
          setup_api_calls:
            - call: "POST /team-members"
              payload: { full_name: "Adam Admin", email: "adam@x.com", specialty: "MANAGEMENT" }
              as: ProgramAdmin
              captures: { m_admin: $.data.id }
            - call: "POST /team-members"
              payload: { full_name: "Dana Docs", email: "dana@x.com", specialty: "DOCUMENTATION" }
              as: ProgramAdmin
              captures: { m_spec: $.data.id }
            - call: "POST /team-members"
              payload: { full_name: "Molly Modeler", email: "molly@x.com", specialty: "MODELING" }
              as: ProgramAdmin
              captures: { m_model: $.data.id }
            - call: "POST /team-members"
              payload: { full_name: "Carl Cx", email: "carl@x.com", specialty: "COMMISSIONING", is_independent: true }
              as: ProgramAdmin
              captures: { m_cx: $.data.id }
            - call: "POST /credit-library-entries"
              payload: { credit_code: "EAp1", title: "Fundamental Commissioning", category: "ENERGY_ATMOSPHERE", points_possible: 20, is_prerequisite: true, phase_eligibility: "BOTH", requires_energy_model: false }
              as: ProgramAdmin
              captures: { e_p: $.data.id }
            - call: "POST /credit-library-entries"
              payload: { credit_code: "WEc1", title: "Water Efficiency", category: "WATER", points_possible: 10, is_prerequisite: false, phase_eligibility: "DESIGN", requires_energy_model: false }
              as: ProgramAdmin
              captures: { e_d: $.data.id }
            - call: "POST /credit-library-entries"
              payload: { credit_code: "MRc1", title: "Materials Reuse", category: "MATERIALS", points_possible: 10, is_prerequisite: false, phase_eligibility: "CONSTRUCTION", requires_energy_model: false }
              as: ProgramAdmin
              captures: { e_c: $.data.id }
            - call: "POST /certification-projects"
              payload: { project_name: "Tower C", rating_system: "LEED_BD_C", compliance_path: "PERFORMANCE", gross_floor_area_sqft: 120000, target_level: "CERTIFIED", fee_budget_cents: 5000000 }
              as: ProjectAdministrator
              as_user_id: "${m_admin}"
              captures: { p_id: $.data.id, p_v: $.data.version }
            - call: "POST /energy-models"
              payload: { project_id: "${p_id}", model_type: "BASELINE", modeling_standard: "ASHRAE_90_1_2019", annual_energy_cost_modeled_cents: 12000000, annual_energy_cost_confirmed_only_cents: 12000000, includes_unconfirmed_measures: false, expected_project_version: "${p_v}" }
              as: EnergyModeler
              as_user_id: "${m_model}"
              captures: { bm_id: $.data.id }
            - call: "GET /certification-projects/${p_id}"
              as: Any
              captures: { p_v2: $.data.version }
            - call: "POST /energy-models"
              payload: { project_id: "${p_id}", model_type: "PROPOSED", modeling_standard: "ASHRAE_90_1_2019", annual_energy_cost_modeled_cents: 11400000, annual_energy_cost_confirmed_only_cents: 11400000, includes_unconfirmed_measures: false, expected_project_version: "${p_v2}" }
              as: EnergyModeler
              as_user_id: "${m_model}"
              captures: { pm_id: $.data.id }
            - call: "POST /energy-models/${bm_id}/lock"
              as: EnergyModeler
              as_user_id: "${m_model}"
            - call: "POST /energy-models/${pm_id}/lock"
              as: EnergyModeler
              as_user_id: "${m_model}"
            - call: "POST /credit-attempts"
              payload: { project_id: "${p_id}", credit_library_entry_id: "${e_p}", phase: "DESIGN", documentation_owner_id: "${m_spec}" }
              as: ProjectAdministrator
              as_user_id: "${m_admin}"
              captures: { a_p: $.data.id }
            - call: "POST /credit-attempts"
              payload: { project_id: "${p_id}", credit_library_entry_id: "${e_d}", phase: "DESIGN", documentation_owner_id: "${m_spec}" }
              as: ProjectAdministrator
              as_user_id: "${m_admin}"
              captures: { a_d: $.data.id }
            - call: "POST /credit-attempts"
              payload: { project_id: "${p_id}", credit_library_entry_id: "${e_c}", phase: "CONSTRUCTION", documentation_owner_id: "${m_spec}" }
              as: ProjectAdministrator
              as_user_id: "${m_admin}"
              captures: { a_c: $.data.id }
            - call: "GET /certification-projects/${p_id}"
              as: Any
              captures: { p_v3: $.data.version }
            - call: "POST /certification-projects/${p_id}/lock-strategy"
              payload: { expected_project_version: "${p_v3}" }
              as: ProjectAdministrator
              as_user_id: "${m_admin}"
            - call: "POST /credit-attempts/${a_p}/assign-owner"
              payload: { documentation_owner_id: "${m_spec}" }
              as: ProjectAdministrator
              as_user_id: "${m_admin}"
            - call: "POST /credit-attempts/${a_d}/assign-owner"
              payload: { documentation_owner_id: "${m_spec}" }
              as: ProjectAdministrator
              as_user_id: "${m_admin}"
            - call: "POST /credit-attempts/${a_c}/assign-owner"
              payload: { documentation_owner_id: "${m_spec}" }
              as: ProjectAdministrator
              as_user_id: "${m_admin}"
            - call: "POST /credit-attempts/${a_p}/mark-ready"
              as: DocumentationSpecialist
              as_user_id: "${m_spec}"
            - call: "POST /credit-attempts/${a_d}/mark-ready"
              as: DocumentationSpecialist
              as_user_id: "${m_spec}"
            - call: "POST /certification-projects/${p_id}/submit-phase"
              payload: { phase: "DESIGN" }
              as: ProjectAdministrator
              as_user_id: "${m_admin}"
            - call: "POST /credit-attempts/${a_p}/begin-review"
              as: CertificationReviewer
            - call: "POST /credit-attempts/${a_p}/award"
              payload: { raw_points_earned: 20 }
              as: CertificationReviewer
            - call: "POST /credit-attempts/${a_d}/begin-review"
              as: CertificationReviewer
            - call: "POST /credit-attempts/${a_d}/award"
              payload: { raw_points_earned: 10 }
              as: CertificationReviewer
            - call: "POST /commissioning-tasks"
              payload: { project_id: "${p_id}", task_type: "FUNCTIONAL_TESTING", agent_id: "${m_cx}", scheduled_start: "2026-09-01T09:00:00Z", scheduled_end: "2026-09-01T12:00:00Z", is_prerequisite_linked: true }
              as: ProjectAdministrator
              as_user_id: "${m_admin}"
              captures: { t_cx: $.data.id }
            - call: "POST /commissioning-tasks/${t_cx}/start"
              as: CommissioningAgent
              as_user_id: "${m_cx}"
            - call: "POST /commissioning-tasks/${t_cx}/complete"
              payload: { outcome: "PASSED", result_notes: "all systems verified" }
              as: CommissioningAgent
              as_user_id: "${m_cx}"
            - call: "POST /credit-attempts/${a_c}/mark-ready"
              as: DocumentationSpecialist
              as_user_id: "${m_spec}"
            - call: "POST /certification-projects/${p_id}/submit-phase"
              payload: { phase: "CONSTRUCTION" }
              as: ProjectAdministrator
              as_user_id: "${m_admin}"
            - call: "POST /credit-attempts/${a_c}/begin-review"
              as: CertificationReviewer
            - call: "POST /credit-attempts/${a_c}/award"
              payload: { raw_points_earned: 10 }
              as: CertificationReviewer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /certification-projects/${p_id}/issue-decision"
              payload: { decision: "CERTIFY" }
              as: CertificationReviewer
            - call: "POST /incentive-programs"
              payload: { program_name: "State Green Grant", incentive_type: "GRANT", benefit_amount_cents: 8000000, minimum_certification_level: "CERTIFIED", is_combinable: true }
              as: ProgramAdmin
              captures: { g1: $.data.id }
            - call: "POST /incentive-programs"
              payload: { program_name: "Utility Rebate", incentive_type: "UTILITY_REBATE", benefit_amount_cents: 5000000, minimum_certification_level: "CERTIFIED", is_combinable: true }
              as: ProgramAdmin
              captures: { r1: $.data.id }
            - call: "POST /incentive-programs"
              payload: { program_name: "Federal Tax Credit", incentive_type: "TAX_CREDIT", benefit_amount_cents: 15000000, minimum_certification_level: "CERTIFIED", is_combinable: false }
              as: ProgramAdmin
              captures: { t1: $.data.id }
            - call: "POST /incentive-programs"
              payload: { program_name: "State Tax Credit", incentive_type: "TAX_CREDIT", benefit_amount_cents: 12000000, minimum_certification_level: "CERTIFIED", is_combinable: false }
              as: ProgramAdmin
              captures: { t2: $.data.id }
            - call: "POST /project-incentives"
              payload: { project_id: "${p_id}", incentive_program_id: "${g1}" }
              as: ProjectAdministrator
              as_user_id: "${m_admin}"
              captures: { pi_g1: $.data.id }
            - call: "POST /project-incentives"
              payload: { project_id: "${p_id}", incentive_program_id: "${r1}" }
              as: ProjectAdministrator
              as_user_id: "${m_admin}"
              captures: { pi_r1: $.data.id }
            - call: "POST /project-incentives"
              payload: { project_id: "${p_id}", incentive_program_id: "${t1}" }
              as: ProjectAdministrator
              as_user_id: "${m_admin}"
              captures: { pi_t1: $.data.id }
            - call: "POST /project-incentives"
              payload: { project_id: "${p_id}", incentive_program_id: "${t2}" }
              as: ProjectAdministrator
              as_user_id: "${m_admin}"
              captures: { pi_t2: $.data.id }
            - call: "POST /project-incentives/${pi_g1}/approve"
              as: ProgramAdmin
            - call: "POST /project-incentives/${pi_r1}/approve"
              as: ProgramAdmin
            - call: "POST /project-incentives/${pi_t1}/approve"
              as: ProgramAdmin
            - call: "POST /project-incentives/${pi_t2}/approve"
              as: ProgramAdmin
          trigger:
            - call: "POST /cost-premium-analyses"
              payload: { project_id: "${p_id}", incremental_construction_cost_cents: 50000000 }
              as: ProjectAdministrator
              as_user_id: "${m_admin}"
              captures: { an_id: $.data.id }
          assert:
            - "CostPremiumAnalysis.${an_id}.incentive_total_cents == 20000000 (min(13000000 + max(15000000,12000000)=28000000, floor(0.40*50000000)=20000000) — cap binds)"
            - "CostPremiumAnalysis.${an_id}.annual_energy_savings_cents == 600000"
            - "CostPremiumAnalysis.${an_id}.net_cost_premium_cents == 30000000"
            - "CostPremiumAnalysis.${an_id}.simple_payback_years == 50.0"

      - name: cost_premium_pinned_evaluation_order
        grounds:
          - calculations.cost_premium_net_and_payback
          - entities.CostPremiumAnalysis.fields.simple_payback_years
        distinguishing_aspect: |
          Mode (c) pinned evaluation order over a circular-looking dependency:
          the incentive cap base is the PRE-incentive incremental cost (never
          net_cost_premium), and payback is computed from the stored integer-cent
          operands — with zero eligible incentives the chain yields savings
          600000, total 0, net 50000000, payback 83.3, confirming steps 1-4 in
          the pinned order (a net-based cap reading would be circular and
          ill-defined).
        test_recipe:
          setup:
            - "PRESCRIPTIVE project with LOCKED BASELINE (12000000 confirmed-only) and LOCKED PROPOSED (11400000 confirmed-only)"
            - "No ProjectIncentives exist"
          setup_api_calls:
            - call: "POST /team-members"
              payload: { full_name: "Adam Admin", email: "adam@x.com", specialty: "MANAGEMENT" }
              as: ProgramAdmin
              captures: { m_admin: $.data.id }
            - call: "POST /team-members"
              payload: { full_name: "Molly Modeler", email: "molly@x.com", specialty: "MODELING" }
              as: ProgramAdmin
              captures: { m_model: $.data.id }
            - call: "POST /certification-projects"
              payload: { project_name: "Tower D", rating_system: "LEED_ID_C", compliance_path: "PRESCRIPTIVE", gross_floor_area_sqft: 120000, target_level: "SILVER", fee_budget_cents: 5000000 }
              as: ProjectAdministrator
              as_user_id: "${m_admin}"
              captures: { p_id: $.data.id, p_v: $.data.version }
            - call: "POST /energy-models"
              payload: { project_id: "${p_id}", model_type: "BASELINE", modeling_standard: "ASHRAE_90_1_2016", annual_energy_cost_modeled_cents: 12000000, annual_energy_cost_confirmed_only_cents: 12000000, includes_unconfirmed_measures: false, expected_project_version: "${p_v}" }
              as: EnergyModeler
              as_user_id: "${m_model}"
              captures: { bm_id: $.data.id }
            - call: "GET /certification-projects/${p_id}"
              as: Any
              captures: { p_v2: $.data.version }
            - call: "POST /energy-models"
              payload: { project_id: "${p_id}", model_type: "PROPOSED", modeling_standard: "ASHRAE_90_1_2016", annual_energy_cost_modeled_cents: 11400000, annual_energy_cost_confirmed_only_cents: 11400000, includes_unconfirmed_measures: false, expected_project_version: "${p_v2}" }
              as: EnergyModeler
              as_user_id: "${m_model}"
              captures: { pm_id: $.data.id }
            - call: "POST /energy-models/${bm_id}/lock"
              as: EnergyModeler
              as_user_id: "${m_model}"
            - call: "POST /energy-models/${pm_id}/lock"
              as: EnergyModeler
              as_user_id: "${m_model}"
          trigger:
            - call: "POST /cost-premium-analyses"
              payload: { project_id: "${p_id}", incremental_construction_cost_cents: 50000000 }
              as: ProjectAdministrator
              as_user_id: "${m_admin}"
              captures: { an_id: $.data.id }
          assert:
            - "CostPremiumAnalysis.${an_id}.annual_energy_savings_cents == 600000 (step 1)"
            - "CostPremiumAnalysis.${an_id}.incentive_total_cents == 0 (step 2: min(0, floor(0.40*50000000))=0)"
            - "CostPremiumAnalysis.${an_id}.net_cost_premium_cents == 50000000 (step 3)"
            - "CostPremiumAnalysis.${an_id}.simple_payback_years == 83.3 (step 4: round_half_up(50000000/600000, 1dp))"
            - "CostPremiumAnalysis.${an_id}.analysis_version == 1"

  - rule_id: non_linear_state_machine
    instances:
      - name: credit_attempt_clarification_cycle
        grounds:
          - state_machines.CreditAttempt.UNDER_REVIEW_to_CLARIFICATION_REQUESTED
          - state_machines.CreditAttempt.CLARIFICATION_REQUESTED_to_RESUBMITTED
