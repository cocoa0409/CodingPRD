              captures: { insp_w: "$.data.id" }
            - call: POST /grain-inspection/inspectors
              as: ServiceAdmin
              payload: { service_area_id: "${area}", license_number: "L-1211", full_name: "P. Probationary", endorsements: ["WEIGHING", "SUPERVISION"], license_expires_at: "2027-06-01T00:00:00Z" }
              captures: { insp_s: "$.data.id" }
            - call: POST /grain-inspection/equipment
              as: ServiceAdmin
              payload: { service_area_id: "${area}", equipment_kind: "SCALE", asset_code: "SCALE-GUARD", model: "HopperMax 400", capacity_lbs: 400000, tolerance_lbs: 20.0 }
              captures: { scale: "$.data.id" }
            - call: POST /grain-inspection/equipment/${scale}/certify
              as: ServiceAdmin
              payload: { certified_until: "2027-01-01T00:00:00Z", test_error_lbs: 5.0 }
            - call: POST /grain-inspection/inspection-requests
              as: ServiceAdmin
              payload: { applicant_id: "${app}", service_area_id: "${area}", commodity: "CORN", point_of_service: "LOADING", lot_identifier: "LOT-GUARD", declared_quantity_bushels: 3500, requested_services: ["GRADING", "WEIGHING"] }
              captures: { req: "$.data.id" }
            - call: POST /grain-inspection/weighing-records
              as: LicensedInspector
              payload:
                inspection_request_id: "${req}"
                scale_id: "${scale}"
                weigher_inspector_id: "${insp_w}"
                dockage_pct: 1.5
                drafts:
                  - { gross_lbs: 55000, tare_lbs: 21300 }
                  - { gross_lbs: 55000, tare_lbs: 21100 }
                  - { gross_lbs: 55200, tare_lbs: 21100 }
                  - { gross_lbs: 55300, tare_lbs: 21000 }
                  - { gross_lbs: 55500, tare_lbs: 21000 }
                  - { gross_lbs: 55700, tare_lbs: 21000 }
