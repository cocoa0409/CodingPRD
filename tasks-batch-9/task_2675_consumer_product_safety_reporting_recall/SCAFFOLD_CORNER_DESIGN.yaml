          assert:
            - "${notif_after_sweep} == DEFICIENT and ${posture_after_sweep} == DELINQUENT and ${delinq_after_sweep} == 1"
            - "RetailerNotification.${rn_id}.status == DELINQUENT immediately after the sweep, then ACKNOWLEDGED after the late acknowledgement"
            - "RetailerNotification.${rn_id}.acknowledged_at == 2026-03-17T00:00:00Z and units_on_shelf_reported == 4"
            - "Retailer.${ret_id}.compliance_posture == STOP_SALE_ACTIVE after the acknowledgement, NOT CLEAR, because open_stop_sale_count is still 1"
            - "Retailer.${ret_id}.delinquent_count == 1 — the historical counter is not rolled back"
            - "Recall.${rc_id}.notification_status == IN_PROGRESS again, since no DELINQUENT notification remains"
            - "Recall.${rc_id}.plan_status == APPROVED throughout — the compensation touched only the outreach axis"

      - name: plan_approval_three_level_cascade
        claim_type: Side Effect Execution
        grounds:
          - state_machines[Recall].transitions[SUBMITTED -> APPROVED]
          - complexity_profile.complexity_layers.cascading_side_effects
        excluded_because:
          difficulty_instance: plan_approval_cascades_recall_to_notification_to_retailer_posture_depth3
          rationale: |
            The depth-3 recall -> notification -> retailer chain, including the
            created_at ASC processing order and the stop_sale_effective_at stamp
            shared by every issued notification, is already pinned end-to-end by
            that transitive_cascade instance. Restating it here would duplicate the
            same trigger and the same asserts.

      - name: claim_fulfilment_four_level_cascade
        claim_type: Side Effect Execution
        grounds:
          - state_machines[RemedyClaim].transitions[APPROVED -> FULFILLED]
          - complexity_profile.complexity_layers.cascading_side_effects
        excluded_because:
          difficulty_instance: claim_fulfilment_cascades_ledger_to_effectiveness_to_cooperation_credit_depth4
          rationale: |
            The depth-4 claim -> unit ledger -> effectiveness flag -> cooperation
            credit chain is pinned by that transitive_cascade instance, and its
            exact reversal is pinned by the compensating_invariant instance
            claim_void_restores_the_unit_partition_and_undoes_the_cooperation_credit.
            Both directions are therefore already covered.

  # ===========================================================================
  - section: Calculations
    instances:

      - name: severity_weight_spans_all_five_injury_classes_and_all_four_channels
        claim_type: Correct Result
        grounds:
          - calculations.incident_severity_weight
          - calculations.incident_severity_weight.constants
        distinguishing_aspect: |
          One probe per injury class, deliberately paired with a DIFFERENT report
          channel each time and with the unverified discount switched on for two of
          them, so the three factors of the weighted_scoring product are separable
          from the results alone: 1x1.00x0.5 = 0.50, 3x1.00 = 3.00, 8x1.20 = 9.60,
          20x1.50 = 30.00 and 50x1.50x0.5 = 37.50. A table hard-coded per injury
          class (ignoring the channel) collapses the second and fifth values.
        test_recipe:
          setup:
            - "logical clock at 2026-03-01T00:00:00Z"
            - "one ProductModel with five INTAKE incidents, one per report channel combination below"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /product-safety/product-models"
              payload: { model_code: "TOAST-X1", brand: "Hearthline", category: "KITCHEN_APPLIANCE", units_distributed: 100, units_registered: 60 }
              as: ProgramAdmin
              captures: { pm_id: $.data.id }
            - call: "POST /product-safety/incidents"
              payload: { product_model_id: "${pm_id}", report_channel: "WEB_FORM", incident_date: "2026-01-05T00:00:00Z", narrative: "Smell of burning, no injury, unverified web report." }
              as: IntakeSpecialist
              captures: { a_id: $.data.id }
            - call: "POST /product-safety/incidents"
              payload: { product_model_id: "${pm_id}", report_channel: "CONSUMER_HOTLINE", incident_date: "2026-01-06T00:00:00Z", narrative: "Thumb burn treated with a plaster." }
              as: IntakeSpecialist
              captures: { b_id: $.data.id }
            - call: "POST /product-safety/incidents"
              payload: { product_model_id: "${pm_id}", report_channel: "RETAILER", incident_date: "2026-01-07T00:00:00Z", narrative: "Customer treated at a walk-in clinic." }
              as: IntakeSpecialist
              captures: { c_id: $.data.id }
            - call: "POST /product-safety/incidents"
              payload: { product_model_id: "${pm_id}", report_channel: "MEDICAL_EXAMINER", incident_date: "2026-01-08T00:00:00Z", narrative: "Overnight admission for second-degree burns." }
              as: IntakeSpecialist
              captures: { d_id: $.data.id }
            - call: "POST /product-safety/incidents"
              payload: { product_model_id: "${pm_id}", report_channel: "MEDICAL_EXAMINER", incident_date: "2026-01-09T00:00:00Z", narrative: "Fatality reported second-hand; causation not yet verified." }
              as: IntakeSpecialist
              captures: { e_id: $.data.id }
          trigger:
            - call: "POST /product-safety/incidents/${a_id}/classify"
              payload: { injury_class: "NO_INJURY", hazard_code: "BURN", injury_verified: false }
              as: IntakeSpecialist
            - call: "POST /product-safety/incidents/${b_id}/classify"
              payload: { injury_class: "FIRST_AID", hazard_code: "BURN", injury_verified: true }
              as: IntakeSpecialist
            - call: "POST /product-safety/incidents/${c_id}/classify"
              payload: { injury_class: "MEDICAL_TREATMENT", hazard_code: "BURN", injury_verified: true }
              as: IntakeSpecialist
            - call: "POST /product-safety/incidents/${d_id}/classify"
              payload: { injury_class: "HOSPITALIZATION", hazard_code: "BURN", injury_verified: true }
              as: IntakeSpecialist
            - call: "POST /product-safety/incidents/${e_id}/classify"
              payload: { injury_class: "FATALITY", hazard_code: "BURN", injury_verified: false }
              as: IntakeSpecialist
          assert:
            - "Incident.${a_id}.severity_weight == 0.50"
            - "Incident.${b_id}.severity_weight == 3.00"
            - "Incident.${c_id}.severity_weight == 9.60"
            - "Incident.${d_id}.severity_weight == 30.00"
            - "Incident.${e_id}.severity_weight == 37.50"
            - "every value carries exactly 2 decimal places, so 0.50 is not serialised as 0.5"

      - name: risk_index_input_set_excludes_untriaged_disposed_and_out_of_window_rows
        claim_type: Input Set Filtering
        grounds:
          - calculations.hazard_pattern_risk_index.input_set
          - state_machines[Incident].terminal_states
        distinguishing_aspect: |
          Six incidents exist on the model and only THREE may enter the index. Each
          excluded row is excluded for a different reason: one is still INTAKE (not
          in the {CLASSIFIED, CLUSTERED, ESCALATED} set), one is CLOSED_NO_ACTION,
          one is MERGED_DUPLICATE with a non-null duplicate_of_incident_id, and one
          CLASSIFIED row simply falls outside the CLOSED incident_date window. An
          implementation that filters on window alone, or on status alone, produces
          a visibly different severity_sum.
        test_recipe:
          setup:
            - "logical clock at 2026-03-01T00:00:00Z"
            - "one ProductModel with units_distributed 100 (so exposure floors at 1.0000) and six incidents as listed"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /product-safety/product-models"
              payload: { model_code: "TOAST-X1", brand: "Hearthline", category: "KITCHEN_APPLIANCE", units_distributed: 100, units_registered: 60 }
              as: ProgramAdmin
              captures: { pm_id: $.data.id, pm_v1: $.data.version }
            - call: "POST /product-safety/incidents"
              payload: { product_model_id: "${pm_id}", report_channel: "MEDICAL_EXAMINER", incident_date: "2026-01-12T00:00:00Z", narrative: "Qualifying: hospitalisation." }
              as: IntakeSpecialist
              captures: { q1_id: $.data.id }
            - call: "POST /product-safety/incidents/${q1_id}/classify"
              payload: { injury_class: "HOSPITALIZATION", hazard_code: "BURN", injury_verified: true }
              as: IntakeSpecialist
            - call: "POST /product-safety/incidents"
              payload: { product_model_id: "${pm_id}", report_channel: "RETAILER", incident_date: "2026-01-20T00:00:00Z", narrative: "Qualifying: treated burn." }
              as: IntakeSpecialist
              captures: { q2_id: $.data.id }
            - call: "POST /product-safety/incidents/${q2_id}/classify"
              payload: { injury_class: "MEDICAL_TREATMENT", hazard_code: "BURN", injury_verified: true }
              as: IntakeSpecialist
            - call: "POST /product-safety/incidents"
              payload: { product_model_id: "${pm_id}", report_channel: "CONSUMER_HOTLINE", incident_date: "2026-02-02T00:00:00Z", narrative: "Qualifying: minor burn." }
              as: IntakeSpecialist
              captures: { q3_id: $.data.id }
            - call: "POST /product-safety/incidents/${q3_id}/classify"
              payload: { injury_class: "FIRST_AID", hazard_code: "BURN", injury_verified: true }
              as: IntakeSpecialist
            - call: "POST /product-safety/incidents"
              payload: { product_model_id: "${pm_id}", report_channel: "MEDICAL_EXAMINER", incident_date: "2026-02-05T00:00:00Z", narrative: "Excluded: still awaiting triage, would weigh 30.00 if counted." }
              as: IntakeSpecialist
              captures: { x_intake_id: $.data.id }
            - call: "POST /product-safety/incidents"
              payload: { product_model_id: "${pm_id}", report_channel: "MEDICAL_EXAMINER", incident_date: "2026-02-06T00:00:00Z", narrative: "Excluded: closed with no action after investigation." }
              as: IntakeSpecialist
              captures: { x_closed_id: $.data.id }
            - call: "POST /product-safety/incidents/${x_closed_id}/classify"
              payload: { injury_class: "HOSPITALIZATION", hazard_code: "BURN", injury_verified: true }
              as: IntakeSpecialist
            - call: "POST /product-safety/incidents/${x_closed_id}/dispose"
              payload: { disposition: "CLOSED_NO_ACTION" }
              as: IntakeSpecialist
            - call: "POST /product-safety/incidents"
              payload: { product_model_id: "${pm_id}", report_channel: "MEDICAL_EXAMINER", incident_date: "2026-02-07T00:00:00Z", narrative: "Excluded: duplicate retelling of the January hospitalisation." }
              as: IntakeSpecialist
              captures: { x_dup_id: $.data.id }
            - call: "POST /product-safety/incidents/${x_dup_id}/classify"
              payload: { injury_class: "HOSPITALIZATION", hazard_code: "BURN", injury_verified: true }
              as: IntakeSpecialist
            - call: "POST /product-safety/incidents/${x_dup_id}/dispose"
              payload: { disposition: "MERGED_DUPLICATE", duplicate_of_incident_id: "${q1_id}" }
              as: IntakeSpecialist
            - call: "POST /product-safety/incidents"
              payload: { product_model_id: "${pm_id}", report_channel: "MEDICAL_EXAMINER", incident_date: "2025-12-20T00:00:00Z", narrative: "Excluded: classified but dated before window_start." }
              as: IntakeSpecialist
              captures: { x_early_id: $.data.id }
            - call: "POST /product-safety/incidents/${x_early_id}/classify"
              payload: { injury_class: "HOSPITALIZATION", hazard_code: "BURN", injury_verified: true }
              as: IntakeSpecialist
          trigger:
            - call: "POST /product-safety/hazard-patterns"
              payload: { product_model_id: "${pm_id}", window_start: "2026-01-01T00:00:00Z", window_end: "2026-02-28T00:00:00Z", analysis_basis: "PRELIMINARY", expected_product_model_version: "${pm_v1}" }
              as: ComplianceOfficer
              captures: { hp_id: $.data.id }
          assert:
            - "HazardPattern.${hp_id}.incident_count == 3, not 6"
            - "HazardPattern.${hp_id}.severity_sum == 42.60 (30.00 + 9.60 + 3.00); counting all six would give 162.60"
            - "HazardPattern.${hp_id}.risk_index == 63.90"
            - "HazardPattern.${hp_id}.dominant_hazard_code == BURN and concentration_ratio == 1.0000"
            - "Incident.${x_intake_id}.hazard_pattern_id == null — an untriaged row is not clustered either"
            - "Incident.${x_closed_id}.hazard_pattern_id == null and Incident.${x_dup_id}.hazard_pattern_id == null"
            - "Incident.${x_early_id}.status remains CLASSIFIED and hazard_pattern_id == null — in-state but out of window"

      - name: risk_index_keeps_four_places_on_exposure_and_never_rounds_the_density
        claim_type: Precision
        grounds:
          - calculations.hazard_pattern_risk_index.precision
          - calculations.hazard_pattern_risk_index.formula
        distinguishing_aspect: |
          The rounding schedule has exactly two rounding points — exposure_per_10k
          to 4 places and risk_index to 2 — and NOTHING in between. With
          units_distributed 17777 the exact chain is exposure 1.7777, density
          23.96354840..., raw 35.94532260..., index 35.95; rounding the density to
          2 places first yields 23.96 * 1.5 = 35.94, one cent of index away. A
          second model at 33333 rounds the other direction (19.17019... -> 19.17),
          so the pair also proves the mode is round_half_up rather than truncation.
        test_recipe:
          setup:
            - "logical clock at 2026-03-01T00:00:00Z"
            - "two ProductModels with units_distributed 17777 and 33333, each carrying the SAME three classified verified BURN incidents (severity_sum 42.60, concentration 1.0000)"
