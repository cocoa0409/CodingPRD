      - name: reconcile_on_a_draft_estimate_is_rejected_before_submission
        claim_type: invalid_transitions
        grounds:
          - state_machines.ProgressiveEstimate.status
          - validations.priority_62
          - endpoints.POST_/estimates/{id}/reconcile
        distinguishing_aspect: |
          DRAFT -> RECONCILED is not an edge: reconcile is reachable only from SUBMITTED. The
          rejected call must leave the row untouched, and the very same reconcile payload must
          then succeed once the intervening submit has run.
        test_recipe:
          setup:
            - "empty database"
            - "logical clock at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "Harborview Clinic", owner_org: "Harborview Health", cm_fee_pct: 0.04, insurance_rate: 0.01 }
              as: ProgramAdmin
              captures: { proj: $.data.id, pv1: $.data.version }
            - call: "POST /estimates"
              payload: { project_id: "${proj}", milestone_code: "SD", submitted_cost_of_work: 1000000.00, expected_project_version: "${pv1}" }
              as: ConstructionManager
              captures: { est: $.data.id }
          trigger:
            - call: "POST /estimates/${est}/reconcile"
              payload: { decision: "ACCEPT", reconciliation_note: "premature" }
              as: OwnerRepresentative
            - call: "POST /estimates/${est}/submit"
              payload: {}
              as: ConstructionManager
            - call: "POST /estimates/${est}/reconcile"
              payload: { decision: "ACCEPT", reconciliation_note: "accepted" }
              as: OwnerRepresentative
          assert:
            - "trigger call 1 returns 409 with data.error_id == ERR_ESTIMATE_STATE_INVALID"
            - "after trigger call 1 ProgressiveEstimate.${est}.status is still DRAFT and reconciliation_note is null"
            - "trigger call 2 returns 200 with status == SUBMITTED"
            - "trigger call 3 returns 200 with status == RECONCILED and reconciliation_note == 'accepted'"

      - name: reconciled_estimate_refuses_both_a_further_submit_and_a_further_reconcile
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.ProgressiveEstimate.status
          - validations.priority_62
          - endpoints.POST_/estimates/{id}/reconcile
        distinguishing_aspect: |
          RECONCILED is terminal on both outgoing verbs: neither submit (which is legal from
          DRAFT and RETURNED) nor a second reconcile (legal from SUBMITTED) may reopen it. An
          implementation that guards only the reconcile verb still lets submit resurrect a
          reconciled milestone into SUBMITTED.
        test_recipe:
          setup:
            - "empty database"
            - "logical clock at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "Harborview Clinic", owner_org: "Harborview Health", cm_fee_pct: 0.04, insurance_rate: 0.01 }
              as: ProgramAdmin
              captures: { proj: $.data.id, pv1: $.data.version }
            - call: "POST /estimates"
              payload: { project_id: "${proj}", milestone_code: "SD", submitted_cost_of_work: 1000000.00, expected_project_version: "${pv1}" }
              as: ConstructionManager
              captures: { est: $.data.id }
            - call: "POST /estimates/${est}/submit"
              payload: {}
              as: ConstructionManager
            - call: "POST /estimates/${est}/reconcile"
              payload: { decision: "ACCEPT", reconciliation_note: "accepted at SD" }
              as: OwnerRepresentative
            - call: "GET /estimates/${est}"
              payload: {}
              as: ConstructionManager
              captures: { ev: $.data.version }
          trigger:
            - call: "POST /estimates/${est}/submit"
              payload: { justification_note: "reopening" }
              as: ConstructionManager
            - call: "POST /estimates/${est}/reconcile"
              payload: { decision: "RETURN", reconciliation_note: "changed my mind" }
              as: OwnerRepresentative
          assert:
            - "trigger call 1 returns 409 with data.error_id == ERR_ESTIMATE_STATE_INVALID"
            - "trigger call 2 returns 409 with data.error_id == ERR_ESTIMATE_STATE_INVALID"
            - "ProgressiveEstimate.${est}.status is still RECONCILED, reconciliation_note is still 'accepted at SD' and version == ${ev}: neither rejected call bumped the row"

      - name: second_submit_of_a_proposal_under_review_is_rejected_not_absorbed
        claim_type: idempotency
        grounds:
