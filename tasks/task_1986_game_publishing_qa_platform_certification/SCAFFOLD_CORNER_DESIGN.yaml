  - section: validations
    instances:
      - name: hotfix_create_requires_launched_title
        claim_type: violation_to_error
        grounds:
          - validations[priority=4]
          - "errors[ERR_TITLE_NOT_LAUNCHED]"
        distinguishing_aspect: "Hotfixes are a post-launch instrument: declaring one for an IN_DEVELOPMENT title fails 409 ERR_TITLE_NOT_LAUNCHED before any embargo or referential check can matter (the title is neither embargoed nor mismatched here)."
        test_recipe:
          setup: ["Title T IN_DEVELOPMENT (not launched, not embargoed); build B belongs to T, same platform"]
          setup_api_calls:
            - call: "POST /qa-cert/titles"
              payload: { title_code: "VAL-HNL", name: "Val Hnl", platform_codes: ["PS5"], target_launch_date: "2026-11-01", cert_budget_total_cents: 500000 }
              as: ReleaseManager
              captures: { tid: $.data.id }
            - { call: "POST /qa-cert/titles/${tid}/transition", payload: { to_status: "IN_DEVELOPMENT" }, as: ReleaseManager }
            - call: "POST /qa-cert/builds"
              payload: { title_id: "${tid}", platform_code: "PS5", version_string: "1.0.1", patch_class: "HOTFIX" }
              as: QALead
              captures: { bid: $.data.id }
          trigger:
            - call: "POST /qa-cert/hotfixes"
              payload: { title_id: "${tid}", platform_code: "PS5", build_id: "${bid}", severity: "S1", incident_summary: "premature hotfix" }
              as: ReleaseManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_TITLE_NOT_LAUNCHED, http 409; no Hotfix row created"

  - section: entities
    instances:
      - name: plan_duplicate_feature_area_rejected
        claim_type: type_constraints
        grounds:
          - entities.TestPlan.fields.entries
          - "errors[ERR_DUPLICATE_FEATURE_AREA]"
        distinguishing_aspect: "feature_area is unique within a plan's embedded matrix: the second COMBAT row fails 409 ERR_DUPLICATE_FEATURE_AREA while a distinct area is accepted."
        test_recipe:
          setup: ["Title T; DRAFT plan with entry COMBAT"]
          setup_api_calls:
            - call: "POST /qa-cert/titles"
              payload: { title_code: "ENT-DUP1", name: "Ent Dup1", platform_codes: ["PS5"], target_launch_date: "2026-11-01", cert_budget_total_cents: 1000 }
              as: ReleaseManager
              captures: { tid: $.data.id }
            - call: "POST /qa-cert/test-plans"
              payload: { title_id: "${tid}", platform_code: "PS5" }
              as: QALead
              captures: { pid: $.data.id }
            - { call: "POST /qa-cert/test-plans/${pid}/entries", payload: { feature_area: "COMBAT", platform_layer: "GAME", is_cert_blocker: true, required_coverage_hours: 4 }, as: QALead }
          trigger:
            - call: "POST /qa-cert/test-plans/${pid}/entries"
              payload: { feature_area: "COMBAT", platform_layer: "SERVICE", is_cert_blocker: false, required_coverage_hours: 2 }
              as: QALead
              captures: { err: $.data.error_id }
            - { call: "POST /qa-cert/test-plans/${pid}/entries", payload: { feature_area: "NETWORK", platform_layer: "SERVICE", is_cert_blocker: false, required_coverage_hours: 2 }, as: QALead }
          assert:
            - "duplicate COMBAT: error_id == ERR_DUPLICATE_FEATURE_AREA, http 409"
            - "distinct NETWORK row is accepted (entries length == 2)"

      - name: duplicate_active_age_rating_filing_rejected
        claim_type: type_constraints
        grounds:
          - entities.AgeRatingFiling
          - "errors[ERR_DUPLICATE_FILING]"
        distinguishing_aspect: "At most one active (DRAFT or FILED) filing per (title, territory): a second ESRB DRAFT fails 409, while a PEGI DRAFT on the same title succeeds."
        test_recipe:
          setup: ["Title T with an ESRB filing in DRAFT"]
          setup_api_calls:
            - call: "POST /qa-cert/titles"
              payload: { title_code: "ENT-DUP2", name: "Ent Dup2", platform_codes: ["PS5"], target_launch_date: "2026-11-01", cert_budget_total_cents: 1000 }
              as: ReleaseManager
              captures: { tid: $.data.id }
            - { call: "POST /qa-cert/age-rating-filings", payload: { title_id: "${tid}", territory: "ESRB", content_descriptors: ["MILD_VIOLENCE"] }, as: ReleaseManager }
          trigger:
            - call: "POST /qa-cert/age-rating-filings"
              payload: { title_id: "${tid}", territory: "ESRB", content_descriptors: ["VIOLENCE"] }
              as: ReleaseManager
              captures: { err: $.data.error_id }
            - call: "POST /qa-cert/age-rating-filings"
              payload: { title_id: "${tid}", territory: "PEGI", content_descriptors: ["VIOLENCE"] }
              as: ReleaseManager
              captures: { f2: $.data.id }
          assert:
            - "second active ESRB filing: error_id == ERR_DUPLICATE_FILING, http 409"
            - "same title, different territory (PEGI): created"

      - name: duplicate_locale_pack_rejected
        claim_type: type_constraints
        grounds:
          - entities.LocalizationPack
          - "errors[ERR_DUPLICATE_LOCALE]"
        distinguishing_aspect: "Locale is unique per title: a second fr-FR pack fails 409 ERR_DUPLICATE_LOCALE; the same locale on a DIFFERENT title is fine (uniqueness scope is the title)."
        test_recipe:
          setup: ["Titles T1 and T2; T1 already has a fr-FR pack"]
          setup_api_calls:
            - call: "POST /qa-cert/titles"
              payload: { title_code: "ENT-DUP3A", name: "Ent Dup3A", platform_codes: ["PS5"], target_launch_date: "2026-11-01", cert_budget_total_cents: 1000 }
              as: ReleaseManager
              captures: { t1: $.data.id }
            - call: "POST /qa-cert/titles"
              payload: { title_code: "ENT-DUP3B", name: "Ent Dup3B", platform_codes: ["PS5"], target_launch_date: "2026-11-01", cert_budget_total_cents: 1000 }
              as: ReleaseManager
              captures: { t2: $.data.id }
            - { call: "POST /qa-cert/localization-packs", payload: { title_id: "${t1}", locale: "fr-FR", is_required: true, text_asset_total: 100, audio_asset_total: 0 }, as: ReleaseManager }
          trigger:
            - call: "POST /qa-cert/localization-packs"
              payload: { title_id: "${t1}", locale: "fr-FR", is_required: false, text_asset_total: 50, audio_asset_total: 0 }
              as: ReleaseManager
              captures: { err: $.data.error_id }
            - call: "POST /qa-cert/localization-packs"
              payload: { title_id: "${t2}", locale: "fr-FR", is_required: true, text_asset_total: 80, audio_asset_total: 0 }
              as: ReleaseManager
              captures: { p2: $.data.id }
          assert:
            - "same title + same locale: error_id == ERR_DUPLICATE_LOCALE, http 409"
            - "same locale on another title: created"

      - name: duplicate_test_plan_per_platform_rejected
        claim_type: type_constraints
        grounds:
          - entities.TestPlan
          - "errors[ERR_DUPLICATE_TEST_PLAN]"
        distinguishing_aspect: "One live plan per (title, platform): a second non-ARCHIVED PS5 plan fails 409 ERR_DUPLICATE_TEST_PLAN; a PC plan on the same title succeeds (scope is the platform)."
        test_recipe:
          setup: ["Title T (platforms PS5, PC) with a DRAFT PS5 plan"]
          setup_api_calls:
            - call: "POST /qa-cert/titles"
              payload: { title_code: "ENT-DUP4", name: "Ent Dup4", platform_codes: ["PS5", "PC"], target_launch_date: "2026-11-01", cert_budget_total_cents: 1000 }
              as: ReleaseManager
              captures: { tid: $.data.id }
            - { call: "POST /qa-cert/test-plans", payload: { title_id: "${tid}", platform_code: "PS5" }, as: QALead }
          trigger:
            - call: "POST /qa-cert/test-plans"
              payload: { title_id: "${tid}", platform_code: "PS5" }
              as: QALead
              captures: { err: $.data.error_id }
            - call: "POST /qa-cert/test-plans"
              payload: { title_id: "${tid}", platform_code: "PC" }
              as: QALead
              captures: { p2: $.data.id }
          assert:
            - "second PS5 plan: error_id == ERR_DUPLICATE_TEST_PLAN, http 409"
            - "PC plan on the same title: created"

  - section: cross_cutting_layers
    instances:
      - name: ops_run_expires_stale_windows
        claim_type: scheduled_actions
        grounds:
          - state_machines.ReleaseWindow.RESERVED_to_EXPIRED
          - "endpoints:POST /qa-cert/ops/run"
        distinguishing_aspect: "Window expiry is deferred to the ops-run checkpoint, not wall-clock reads: after the clock passes end_utc the window is still RESERVED until the next ops run flips it to EXPIRED."
        test_recipe:
          setup: ["Title T; window W RESERVED [2026-08-05T09:00Z, 2026-08-05T17:00Z); clock advanced to 2026-08-06T00:00:01Z"]
          setup_api_calls:
            - call: "POST /qa-cert/titles"
              payload: { title_code: "LYR-EXP", name: "Lyr Exp", platform_codes: ["PC"], target_launch_date: "2026-11-01", cert_budget_total_cents: 1000 }
              as: ReleaseManager
              captures: { tid: $.data.id }
            - call: "POST /qa-cert/release-windows"
              payload: { title_id: "${tid}", platform_code: "PC", kind: "LAUNCH", start_utc: "2026-08-05T09:00:00Z", end_utc: "2026-08-05T17:00:00Z" }
              as: ReleaseManager
              captures: { win: $.data.id }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-06T00:00:01Z" }, as: PlatformAdmin }
          trigger:
            - call: "GET /qa-cert/release-windows/${win}"
              as: Any
              captures: { st1: $.data.status }
            - { call: "POST /qa-cert/ops/run", payload: {}, as: PlatformAdmin }
            - call: "GET /qa-cert/release-windows/${win}"
              as: Any
              captures: { st2: $.data.status }
          assert:
            - "before the ops run (clock already past end_utc): status == RESERVED (no lazy expiry on reads)"
            - "after the ops run: status == EXPIRED"

