  # ==========================================================================
  # Rule 8 — resource temporal-overlap conflicts, different interval semantics
  # ==========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: liquidation_lock_half_open_lifetime_on_account
        grounds:
          - validations[priority=8]
          - state_machines.LiquidationOrder.PENDING_to_CANCELLED
        distinguishing_aspect: |
          Half-open lifetime semantics on the MarginAccount resource: a second
          liquidation order create is rejected (ERR_LIQUIDATION_IN_PROGRESS)
          while the first occupies [created, terminal); after cancel, a new
          create at the SAME clock instant succeeds (terminal boundary excluded).
        test_recipe:
          setup:
            - "Account RESTRICTED with EXPIRED HOUSE call 300000; 200 ABC position; official 7000"
          setup_api_calls:
            - { call: "POST /margin/customers", payload: { legal_name: "Hal Fopen", email: "half@example.com" }, as: MarginAnalyst, captures: { c_id: $.data.id } }
            - { call: "POST /margin/security-profiles", payload: { symbol: "ABC", marginable: true, house_maint_long_bps: 3000, house_maint_short_bps: 3500, liquidity_tier: 1, concentration_threshold_bps: 6000 }, as: MarginSupervisor, captures: { sec_abc: $.data.id } }
            - { call: "POST /margin/market-marks", payload: { security_id: "${sec_abc}", mark_type: "REALTIME", price_cents: 10000 }, as: MarketDataOps }
            - { call: "POST /margin/market-marks", payload: { security_id: "${sec_abc}", mark_type: "OFFICIAL_CLOSE", price_cents: 10000 }, as: MarketDataOps }
            - { call: "POST /margin/account-applications", payload: { customer_id: "${c_id}", annual_income_cents: 15000000, liquid_net_worth_cents: 50000000, investment_experience_years: 5 }, as: Customer, as_user_id: "${c_id}", captures: { app_id: $.data.id } }
            - { call: "POST /margin/account-applications/${app_id}/review", payload: {}, as: MarginAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /margin/account-applications/${app_id}/approve", payload: {}, as: MarginSupervisor, as_user_id: "sup-1", captures: { acct_id: $.data.account_id } }
            - { call: "GET /margin/accounts/${acct_id}", payload: {}, as: MarginSupervisor, captures: { acct_v0: $.data.version } }
            - { call: "POST /margin/accounts/${acct_id}/cash-movements", payload: { movement_type: "DEPOSIT", amount_cents: 1000000, expected_account_version: "${acct_v0}" }, as: Customer, as_user_id: "${c_id}" }
            - { call: "POST /margin/accounts/${acct_id}/orders", payload: { security_id: "${sec_abc}", side: "BUY", quantity: 200 }, as: Customer, as_user_id: "${c_id}" }
            - { call: "POST /margin/market-marks", payload: { security_id: "${sec_abc}", mark_type: "OFFICIAL_CLOSE", price_cents: 7000 }, as: MarketDataOps }
            - { call: "GET /margin/accounts/${acct_id}/margin-calls", payload: {}, as: MarginSupervisor, captures: { call_id: "$.data[0].id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-03T00:00:01Z" }, as: MarketDataOps }
            - { call: "POST /_sweeps/daily", payload: {}, as: MarketDataOps }
            - { call: "GET /margin/accounts/${acct_id}", payload: {}, as: MarginSupervisor, captures: { acct_v1: $.data.version } }
            - { call: "POST /margin/accounts/${acct_id}/liquidation-orders", payload: { call_id: "${call_id}", expected_account_version: "${acct_v1}" }, as: LiquidationDesk, as_user_id: "desk-1", captures: { lo1: $.data.id } }
          trigger:
            - { call: "GET /margin/accounts/${acct_id}", payload: {}, as: MarginSupervisor, captures: { acct_v2: $.data.version } }
            - { call: "POST /margin/accounts/${acct_id}/liquidation-orders", payload: { call_id: "${call_id}", expected_account_version: "${acct_v2}" }, as: LiquidationDesk, as_user_id: "desk-1", captures: { err: $.data.error_id } }
            - { call: "POST /margin/liquidation-orders/${lo1}/cancel", payload: {}, as: LiquidationDesk, as_user_id: "desk-1" }
            - { call: "GET /margin/accounts/${acct_id}", payload: {}, as: MarginSupervisor, captures: { acct_v3: $.data.version } }
            - { call: "POST /margin/accounts/${acct_id}/liquidation-orders", payload: { call_id: "${call_id}", expected_account_version: "${acct_v3}" }, as: LiquidationDesk, as_user_id: "desk-1", captures: { lo2: $.data.id } }
          assert:
            - "second create while first PENDING: error_id == ERR_LIQUIDATION_IN_PROGRESS"
            - "after cancel at the same clock instant: create succeeds (half-open boundary)"
            - "LiquidationOrder.${lo2}.order_status == PENDING"

      - name: rate_tier_closed_window_overlap_forbidden_back_to_back_allowed
        grounds:
          - validations[priority=8]
          - entities.RateTier.fields.effective_from
        distinguishing_aspect: |
          Different interval semantics on a different resource: RateTier
          effective windows are CLOSED date intervals for the same tier_level —
          2026-06-01..2026-12-31 collides with 2026-01-01..2026-12-31
          (ERR_RATE_TIER_OVERLAP), while back-to-back 2027-01-01.. (sharing no
          date) is accepted.
        test_recipe:
          setup:
            - "Existing tier_level 1 window 2026-01-01..2026-12-31"
          setup_api_calls:
            - { call: "POST /margin/rate-tiers", payload: { tier_level: 1, min_balance_cents: 0, annual_rate_bps: 1200, effective_from: "2026-01-01", effective_to: "2026-12-31" }, as: MarginSupervisor }
          trigger:
            - { call: "POST /margin/rate-tiers", payload: { tier_level: 1, min_balance_cents: 0, annual_rate_bps: 1150, effective_from: "2026-06-01", effective_to: "2027-05-31" }, as: MarginSupervisor, captures: { err: $.data.error_id } }
            - { call: "POST /margin/rate-tiers", payload: { tier_level: 1, min_balance_cents: 0, annual_rate_bps: 1150, effective_from: "2027-01-01", effective_to: null }, as: MarginSupervisor, captures: { rt_id: $.data.id } }
          assert:
            - "overlapping window: error_id == ERR_RATE_TIER_OVERLAP"
            - "back-to-back window (2027-01-01 after 2026-12-31, no shared date): created successfully"

  # ==========================================================================
  # Rule 9 — compensating-action invariants, different conserved quantities
  # ==========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: deposit_then_withdraw_conserves_cash_and_equity
        grounds:
          - entities.MarginAccount.fields.cash_balance_cents
          - entities.CashMovement.fields.resulting_cash_balance_cents
        distinguishing_aspect: |
          Conserved quantity: cash_balance_cents (and equity fields). A DEPOSIT
          of 250000 followed by a WITHDRAWAL of 250000 returns cash to exactly
          1000000 and equity_realtime/equity_official to 1000000 — zero drift.
        test_recipe:
          setup:
            - "Approved account, no positions, cash 1000000 after first deposit"
          setup_api_calls:
            - { call: "POST /margin/customers", payload: { legal_name: "Con Serve", email: "conserve@example.com" }, as: MarginAnalyst, captures: { c_id: $.data.id } }
            - { call: "POST /margin/account-applications", payload: { customer_id: "${c_id}", annual_income_cents: 15000000, liquid_net_worth_cents: 50000000, investment_experience_years: 5 }, as: Customer, as_user_id: "${c_id}", captures: { app_id: $.data.id } }
            - { call: "POST /margin/account-applications/${app_id}/review", payload: {}, as: MarginAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /margin/account-applications/${app_id}/approve", payload: {}, as: MarginSupervisor, as_user_id: "sup-1", captures: { acct_id: $.data.account_id } }
            - { call: "GET /margin/accounts/${acct_id}", payload: {}, as: MarginSupervisor, captures: { acct_v0: $.data.version } }
            - { call: "POST /margin/accounts/${acct_id}/cash-movements", payload: { movement_type: "DEPOSIT", amount_cents: 1000000, expected_account_version: "${acct_v0}" }, as: Customer, as_user_id: "${c_id}" }
            - { call: "GET /margin/accounts/${acct_id}", payload: {}, as: MarginSupervisor, captures: { v1: $.data.version, cash0: $.data.cash_balance_cents, eqr0: $.data.equity_realtime_cents, eqo0: $.data.equity_official_cents } }
          trigger:
            - { call: "POST /margin/accounts/${acct_id}/cash-movements", payload: { movement_type: "DEPOSIT", amount_cents: 250000, expected_account_version: "${v1}" }, as: Customer, as_user_id: "${c_id}" }
            - { call: "GET /margin/accounts/${acct_id}", payload: {}, as: MarginSupervisor, captures: { v2: $.data.version } }
            - { call: "POST /margin/accounts/${acct_id}/cash-movements", payload: { movement_type: "WITHDRAWAL", amount_cents: 250000, expected_account_version: "${v2}" }, as: Customer, as_user_id: "${c_id}", captures: { res_cash: $.data.resulting_cash_balance_cents } }
            - { call: "GET /margin/accounts/${acct_id}", payload: {}, as: MarginSupervisor, captures: { cash1: $.data.cash_balance_cents, eqr1: $.data.equity_realtime_cents, eqo1: $.data.equity_official_cents } }
          assert:
            - "cash_balance_cents after the pair == 1000000 (identical to before the pair)"
            - "equity_realtime_cents == 1000000 and equity_official_cents == 1000000 (no drift)"
            - "CashMovement resulting_cash_balance_cents == 1000000"

      - name: liquidation_create_then_cancel_conserves_position_shares
        grounds:
          - state_machines.LiquidationOrder.PENDING_to_CANCELLED
          - entities.Position.fields.reserved_qty
        distinguishing_aspect: |
          Different conserved quantity: Position.quantity and reserved_qty.
          Creating a liquidation order reserves 200 shares (quantity 200,
          reserved 200); cancelling compensates the reservation exactly
          (quantity 200, reserved 0) — share conservation with zero drift.
        test_recipe:
          setup:
            - "Account RESTRICTED with EXPIRED HOUSE call; position 200 ABC"
          setup_api_calls:
            - { call: "POST /margin/customers", payload: { legal_name: "Res Erve", email: "reserve@example.com" }, as: MarginAnalyst, captures: { c_id: $.data.id } }
            - { call: "POST /margin/security-profiles", payload: { symbol: "ABC", marginable: true, house_maint_long_bps: 3000, house_maint_short_bps: 3500, liquidity_tier: 1, concentration_threshold_bps: 6000 }, as: MarginSupervisor, captures: { sec_abc: $.data.id } }
            - { call: "POST /margin/market-marks", payload: { security_id: "${sec_abc}", mark_type: "REALTIME", price_cents: 10000 }, as: MarketDataOps }
            - { call: "POST /margin/market-marks", payload: { security_id: "${sec_abc}", mark_type: "OFFICIAL_CLOSE", price_cents: 10000 }, as: MarketDataOps }
            - { call: "POST /margin/account-applications", payload: { customer_id: "${c_id}", annual_income_cents: 15000000, liquid_net_worth_cents: 50000000, investment_experience_years: 5 }, as: Customer, as_user_id: "${c_id}", captures: { app_id: $.data.id } }
            - { call: "POST /margin/account-applications/${app_id}/review", payload: {}, as: MarginAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /margin/account-applications/${app_id}/approve", payload: {}, as: MarginSupervisor, as_user_id: "sup-1", captures: { acct_id: $.data.account_id } }
            - { call: "GET /margin/accounts/${acct_id}", payload: {}, as: MarginSupervisor, captures: { acct_v0: $.data.version } }
            - { call: "POST /margin/accounts/${acct_id}/cash-movements", payload: { movement_type: "DEPOSIT", amount_cents: 1000000, expected_account_version: "${acct_v0}" }, as: Customer, as_user_id: "${c_id}" }
            - { call: "POST /margin/accounts/${acct_id}/orders", payload: { security_id: "${sec_abc}", side: "BUY", quantity: 200 }, as: Customer, as_user_id: "${c_id}", captures: { pos_id: $.data.id } }
            - { call: "POST /margin/market-marks", payload: { security_id: "${sec_abc}", mark_type: "OFFICIAL_CLOSE", price_cents: 7000 }, as: MarketDataOps }
            - { call: "GET /margin/accounts/${acct_id}/margin-calls", payload: {}, as: MarginSupervisor, captures: { call_id: "$.data[0].id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-03T00:00:01Z" }, as: MarketDataOps }
            - { call: "POST /_sweeps/daily", payload: {}, as: MarketDataOps }
            - { call: "GET /margin/accounts/${acct_id}", payload: {}, as: MarginSupervisor, captures: { acct_v1: $.data.version } }
          trigger:
            - { call: "POST /margin/accounts/${acct_id}/liquidation-orders", payload: { call_id: "${call_id}", expected_account_version: "${acct_v1}" }, as: LiquidationDesk, as_user_id: "desk-1", captures: { lo_id: $.data.id } }
            - { call: "GET /margin/positions/${pos_id}", payload: {}, as: MarginSupervisor, captures: { q_mid: $.data.quantity, r_mid: $.data.reserved_qty } }
            - { call: "POST /margin/liquidation-orders/${lo_id}/cancel", payload: {}, as: LiquidationDesk, as_user_id: "desk-1" }
            - { call: "GET /margin/positions/${pos_id}", payload: {}, as: MarginSupervisor, captures: { q_end: $.data.quantity, r_end: $.data.reserved_qty } }
          assert:
            - "after create: quantity == 200 and reserved_qty == 200"
            - "after cancel: quantity == 200 and reserved_qty == 0 (exact compensation)"
            - "LiquidationOrder.${lo_id}.order_status == CANCELLED"
