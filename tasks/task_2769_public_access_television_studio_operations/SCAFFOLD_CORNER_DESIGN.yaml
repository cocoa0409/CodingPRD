            - "${confirmed_status} == CONFIRMED, after which PlaybackSlot.${slot_id}.staffing_status == READY"
            - "${aired_status} == AIRED once the guard is satisfied, with measured_households 640"
            - "CrewAssignment.${ca_id}.status == COMPLETED and credited_hours_tenths == 6 (ceil(1920 / 360))"
            - "Producer.${v_id}.volunteer_hours_tenths == 6 and confirmed_crew_commitments == 0 after the slot airs"
            - "Channel.${ch_id}.aired_seconds == 1920 and scheduled_seconds == 0"

      - name: corner_cascade_down_producer_suspension_to_reservations
        claim_type: cascade_down
        grounds:
          - state_machines.Producer.ACTIVE_to_SUSPENDED
          - state_machines.Reservation.CONFIRMED_to_CANCELLED
        excluded_because:
          difficulty_instance: transitive_cascade / finalized_major_assessment_cascades_four_levels_to_slot_staffing
          rationale: "That instance asserts the suspension cascade onto the producer's other reservation, the crew assignment and the slot's staffing_status, including the counters on the resource."

      - name: corner_cross_entity_program_withdrawal_to_channel_ledger
        claim_type: cross_entity
        grounds:
          - state_machines.Program.APPROVED_to_WITHDRAWN
          - entities.Channel.fields.scheduled_seconds
        excluded_because:
          difficulty_instance: transitive_cascade / program_withdrawal_cascades_to_series_hold_and_volunteer_commitment
          rationale: "Asserted end-to-end there: the slot withdrawal debits Channel.scheduled_seconds and restores Series.remaining_hold_slots without a missed window."

      - name: corner_compensation_reservation_cancel_reverses_hold
        claim_type: compensation
        grounds:
          - state_machines.Reservation.CONFIRMED_to_CANCELLED
          - entities.Producer.fields.deposit_held_cents
        excluded_because:
          difficulty_instance: compensating_invariant / cancelling_confirmed_reservation_restores_deposit_ledger
          rationale: "That instance is exactly the undo-transition claim: every original side effect of the hold is reversed with no drift in the producer's ledger."

      - name: corner_cyclic_program_review_loop_terminates
        claim_type: cyclic
        grounds:
          - state_machines.Program.CHANGES_REQUESTED_to_SUBMITTED
          - constants.MAX_REVISION_ROUNDS
        excluded_because:
          difficulty_instance: non_linear_state_machine / program_review_cycle_loops_and_revision_limit_terminates_it
          rationale: "The loop is traversed three times there and the termination condition MAX_REVISION_ROUNDS is asserted on the fourth submit."

      - name: corner_branching_reservation_return_fork
        claim_type: branching
        grounds:
          - state_machines.Reservation.CHECKED_OUT_to_SETTLED
          - state_machines.Reservation.CHECKED_OUT_to_DAMAGE_REVIEW
        excluded_because:
          difficulty_instance: non_linear_state_machine / reservation_fork_join_clean_branch_diverges_from_damage_branch
          rationale: "Both forks and the shared SETTLED join point are asserted there with their divergent side-effect sets."

      - name: corner_ledger_sync_slot_airing_updates_channel_totals
        claim_type: ledger_sync
        grounds:
          - entities.Channel.fields.aired_seconds
          - state_machines.PlaybackSlot.SCHEDULED_to_AIRED
        excluded_because:
          difficulty_instance: boundary_precision_check / reach_component_clip_at_household_norm_boundary_on_air
          rationale: "Channel.scheduled_seconds falling to 0 while aired_seconds reconciles to 5760 across three airings is asserted there."

  # ===========================================================================
  - section: calculations
    instances:

      - name: corner_certification_pass_score_threshold_79_versus_80
        claim_type: threshold
        grounds:
          - calculations.producer_certification_level
          - constants.PASS_SCORE_MIN
          - state_machines.CourseEnrollment.ATTENDED_to_PASSED
          - state_machines.CourseEnrollment.ATTENDED_to_FAILED
        distinguishing_aspect: "PASS_SCORE_MIN is 80 and the comparison is >=: a practical_score of 79 lands in FAILED with certification_level NONE while 80 on the identical course yields PASSED and BASIC, so the boundary value itself passes."
        test_recipe:
          setup:
            - "Producers P1 and P2 are both ACTIVE with residency_verified true."
            - "TrainingCourse TV-101 is BASIC, seat_capacity 12, grants [STUDIO_FLOOR, EDIT_SUITE], session 2026-08-05T17:00:00Z-21:00:00Z."
            - "Both producers are ATTENDED on TV-101 at clock 2026-08-06T00:00:00Z, ungraded."
          setup_api_calls:
            - call: "POST /producers"
              payload: {legal_name: "Ada Lovelace", email: "ada@patv.example"}
              as: CenterAdmin
              as_user_id: "adm-1"
              captures: {p1_id: $.data.id}
            - call: "POST /producers"
              payload: {legal_name: "Grace Hopper", email: "grace@patv.example"}
              as: CenterAdmin
              as_user_id: "adm-1"
              captures: {p2_id: $.data.id}
            - call: "POST /producers/${p1_id}/residency-verification"
              payload: {document_reference: "UTIL-2026-0001"}
              as: CenterAdmin
              as_user_id: "adm-1"
            - call: "POST /producers/${p2_id}/residency-verification"
              payload: {document_reference: "UTIL-2026-0002"}
              as: CenterAdmin
              as_user_id: "adm-1"
            - call: "POST /training-courses"
              payload: {course_code: "TV-101", title: "Studio Basics", tier: "BASIC", grants_competency_codes: ["STUDIO_FLOOR", "EDIT_SUITE"], seat_capacity: 12, session_start_at: "2026-08-05T17:00:00Z", session_end_at: "2026-08-05T21:00:00Z"}
              as: TrainingCoordinator
              as_user_id: "trn-1"
              captures: {c_id: $.data.id}
            - call: "POST /course-enrollments"
              payload: {producer_id: "${p1_id}", course_id: "${c_id}"}
              as: Producer
              as_user_id: "${p1_id}"
              captures: {e1_id: $.data.id}
            - call: "POST /course-enrollments"
              payload: {producer_id: "${p2_id}", course_id: "${c_id}"}
              as: Producer
              as_user_id: "${p2_id}"
              captures: {e2_id: $.data.id}
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-08-06T00:00:00Z"}
              as: CenterAdmin
              as_user_id: "adm-1"
            - call: "POST /course-enrollments/${e1_id}/attendance"
              payload: {attended: true}
              as: TrainingCoordinator
              as_user_id: "trn-1"
            - call: "POST /course-enrollments/${e2_id}/attendance"
              payload: {attended: true}
              as: TrainingCoordinator
              as_user_id: "trn-1"
          trigger:
            - call: "POST /course-enrollments/${e1_id}/grade"
              payload: {practical_score: 79}
              as: TrainingCoordinator
              as_user_id: "trn-1"
              captures: {e1_status: $.data.status}
            - call: "POST /course-enrollments/${e2_id}/grade"
              payload: {practical_score: 80}
              as: TrainingCoordinator
              as_user_id: "trn-1"
              captures: {e2_status: $.data.status}
            - call: "GET /producers/${p1_id}"
              payload: {}
              as: CenterAdmin
              as_user_id: "adm-1"
              captures: {p1_level: $.data.certification_level, p1_codes: $.data.competency_codes}
            - call: "GET /producers/${p2_id}"
              payload: {}
              as: CenterAdmin
              as_user_id: "adm-1"
              captures: {p2_level: $.data.certification_level, p2_codes: $.data.competency_codes}
          assert:
            - "${e1_status} == FAILED at score 79 (threshold minus one)"
            - "${e2_status} == PASSED at score 80 (the threshold itself)"
            - "${p1_level} == NONE and ${p1_codes} == []"
            - "${p2_level} == BASIC and ${p2_codes} == [STUDIO_FLOOR, EDIT_SUITE]"
            - "TrainingCourse.${c_id}.passed_count == 1 and enrolled_count == 2 — a FAILED enrollment still counts as a consumed seat"

      - name: corner_certification_input_set_counts_only_passed_enrollments
        claim_type: input_set_filtering
        grounds:
          - calculations.producer_certification_level
          - entities.Producer.fields.competency_codes
          - entities.TrainingCourse.fields.grants_competency_codes
        distinguishing_aspect: "Only PASSED enrollments feed the derivation: while the ADVANCED enrollment sits at ATTENDED, and again after it turns FAILED, the producer keeps certification_level BASIC and the ADVANCED course's MASTER_CONTROL competency never appears."
        test_recipe:
          setup:
            - "Producer P has PASSED BASIC course TV-101 (grants [STUDIO_FLOOR, EDIT_SUITE]) and is therefore BASIC."
            - "TrainingCourse TV-201 is ADVANCED, grants [MASTER_CONTROL], session 2026-08-12T17:00:00Z-21:00:00Z."
            - "P is enrolled on TV-201 at clock 2026-08-06T00:00:00Z, before that session opens."
          setup_api_calls:
            - call: "POST /producers"
              payload: {legal_name: "Ada Lovelace", email: "ada@patv.example"}
              as: CenterAdmin
              as_user_id: "adm-1"
              captures: {p_id: $.data.id}
