              payload: { plan_item_id: "${pi_1}", slug: "atlas-feature-a", title: "Feature A guide" }
              as: Writer
              as_user_id: "${w_a}"
              captures: { t_id: "$.data.id" }
            - call: "POST /topics/${t_id}/revisions"
              payload: { body_word_count: 1200, used_terms: [], summary: "First draft" }
              as: Writer
              as_user_id: "${w_a}"
            - call: "POST /topics/${t_id}/submit-review"
              payload: {}
              as: Writer
              as_user_id: "${w_a}"
            - call: "POST /plan-items/${pi_1}/assign"
              payload: { writer_id: "${w_a}", window_start_date: "2026-08-04", window_end_date: "2026-08-18" }
              as: DocsLead
              captures: { e_notassignable: "$.data.error_id" }
            - call: "POST /plan-items/${pi_2}/cancel"
