              as: PlatformAdmin
              captures: { film_id: $.data.id }
            - call: "POST /film-sales/films/${film_id}/banking-facilities"
              payload: { lender_name: "Cine Lend Bank", discount_rate_pct: 0.08, advance_rate_pct: 0.80, facility_cap_usd: 1000000.00 }
              as: Lender
              captures: { fac_id: $.data.id }
          trigger:
            - call: "POST /film-sales/banking-facilities/${fac_id}/state"
              payload: { to_status: "APPROVED" }
              as: Lender
              as_user_id: "lender-approver-1"
              captures: { err_coll: $.data.error_id }
          assert:
            - "the facility creation itself returns HTTP 201 — proposing is always allowed"
            - "${err_coll} == ERR_NO_ELIGIBLE_COLLATERAL at HTTP 422"
            - "BankingFacility.${fac_id}.status == PROPOSED with eligible_collateral_usd == 0.00, advance_amount_usd == 0.00 and approved_by_user_id null"

