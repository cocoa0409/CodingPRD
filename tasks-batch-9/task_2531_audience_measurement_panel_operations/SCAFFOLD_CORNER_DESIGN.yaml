            - "Trigger call 2 (level 1): data.status == SUPERSEDED and data.superseded_at == 2026-08-30T00:00:00Z - the market's previous vintage retires"
            - "Trigger call 3 (level 2): data.state == PENDING_REPIN and data.repin_required_reason == UNIVERSE_SUPERSEDED"
            - "Trigger call 4 (level 2 is conditional): data.state == PUBLISHED and data.repin_required_reason == null - the PUBLISHED run is pinned to the SAME superseded vintage, and it is skipped only because PUBLISHED is terminal"
            - "Trigger call 5 (level 3): data.state == HELD, data.hold_reason == UPSTREAM_RUN_REPIN, data.held_from_state == SCHEDULED"
            - "Trigger call 6 (level 3 is conditional on level 2): data.state == REQUESTED - this deliverable is non-terminal too, but its run never changed state"
            - "Trigger call 7 (level 4): data.held_deliverable_count == 1 and data.delivery_sla_credit_cents == 3250 - round_half_up(65000 * 0.05, 0), credited once because the hold reason is UPSTREAM_RUN_REPIN"
