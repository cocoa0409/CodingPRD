              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /system-areas"
              payload: { code: "POWERTRAIN", name: "Powertrain", requires_calibration_doc: false, requires_security_credential: true }
              as: PlatformAdmin
              captures: { sa_pt_id: $.data.id }
          trigger:
            - call: "POST /manufacturers"
              payload: { name: "Acme Motors", oem_code: "ACME", region: "NA", independent_list_monthly_cents: 115004, independent_covered_system_count: 4, oem_dealer_monthly_cents: 100000, oem_dealer_covered_system_count: 4 }
