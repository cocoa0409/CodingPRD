              as: CreditAnalyst
              as_user_id: "ca-analyst-1"
            - call: "POST /patient-accounts/${acct_oa3_id}/transactions"
              payload: { txn_type: "PAYMENT", amount_cents: -15000, source: "PAYER", payer_id: "${payer_med_id}" }
              as: CreditAnalyst
              as_user_id: "ca-analyst-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
            - call: "POST /credit-balances/identify-sweep"
              payload: { account_ids: ["${acct_oa1_id}", "${acct_oa2_id}", "${acct_oa3_id}"] }
              as: CreditAnalyst
