              as: BrandAdmin
              as_user_id: "${brand_id}"
              captures: { s4_id: $.data.id }
          trigger:
            - call: "POST /labeling/lab-tests"
              payload: { style_id: "${s1_id}", test_type: "FIBER_CONTENT", lab_code: "LAB-ATL-1", method: "AATCC_20A", specimen_received_at: "2026-08-03T09:00:00Z", results_due_at: "2026-08-05T09:00:00Z" }
              as: AccreditedLab
              captures: { t1_id: $.data.id, t1_state: $.data.state }
            - call: "POST /labeling/lab-tests"
              payload: { style_id: "${s2_id}", test_type: "FIBER_CONTENT", lab_code: "LAB-ATL-1", method: "AATCC_20A", specimen_received_at: "2026-08-04T09:00:00Z", results_due_at: "2026-08-06T09:00:00Z" }
              as: AccreditedLab
              captures: { t2_id: $.data.id, t2_state: $.data.state }
            - call: "POST /labeling/lab-tests"
              payload: { style_id: "${s3_id}", test_type: "FIBER_CONTENT", lab_code: "LAB-ATL-1", method: "AATCC_20A", specimen_received_at: "2026-08-05T00:00:00Z", results_due_at: "2026-08-07T00:00:00Z" }
              as: AccreditedLab
              captures: { err_capacity: $.data.error_id }
            - call: "POST /labeling/lab-tests/${t1_id}/results"
              payload: { measured_fibers: [{ fiber_generic_name: "COTTON", measured_pct: 100.0 }] }
              as: AccreditedLab
            - call: "POST /labeling/lab-tests"
              payload: { style_id: "${s3_id}", test_type: "FIBER_CONTENT", lab_code: "LAB-ATL-1", method: "AATCC_20A", specimen_received_at: "2026-08-05T00:00:00Z", results_due_at: "2026-08-07T00:00:00Z" }
              as: AccreditedLab
