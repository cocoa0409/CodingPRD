      - name: settled_tranche_state_beats_transfer_shortfall_fiscal
        grounds:
          - validations.priority_40_ERR_TRANCHE_STATE_INVALID
          - validations.priority_72_ERR_TRANSFER_VALUE_SHORTFALL
          - calculations.transfer_credited_value
          - concurrency_rules.asset-transfer-create-stale-tranche
