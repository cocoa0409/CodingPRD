            - "Activating the neighbouring park's window: HTTP 403 ERR_NOT_PARK_MANAGER as well — the scope is resolved through the addressed window's park_id, not from the request path"
            - "Ridgeline is still OPEN and its window is still SCHEDULED with cancelled_reservation_count 0 after all six refusals"
            - "The same out-of-scope manager may still GET the neighbouring park and list its maintenance windows: HTTP 200 both times, because priority 4 lists only the write endpoints"
