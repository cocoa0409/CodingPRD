        grounds: [calculations.settlement_net_payment]
        excluded_because:
          difficulty_instance: combinatorial_formula / settlement_round_per_line_then_sum
          rationale: "Round-per-line-then-sum order is asserted by the named §1.8 instance."
      - name: floor_boundary_covered
