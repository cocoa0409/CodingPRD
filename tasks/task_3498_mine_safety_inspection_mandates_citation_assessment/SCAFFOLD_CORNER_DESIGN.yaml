              as: OperatorRep
              as_user_id: "${op_b}"
              captures: { err: $.data.error_id }
          assert:
            - "the response is 403 with error_id ERR_OPERATOR_MISMATCH"
            - "Citation.${cit1}.abatement_status remains OPEN"

      - name: sod_verifier_must_differ_from_issuer
        claim_type: segregation_of_duties
        grounds:
          - errors.ERR_SOD_VERIFY_SELF
          - state_machines.Citation
          - state_machines.ImminentDangerOrder
        distinguishing_aspect: "Segregation of duties binds on BOTH verification transitions: the issuing inspector verifying their own citation and their own imminent-danger order each answer 403 ERR_SOD_VERIFY_SELF, while a colleague succeeds."
        test_recipe:
          setup:
