# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Buy-Nothing & Neighborhood Gifting Network (task 0957)
# Breadth walk over §1.1–§1.7 per references/claim-extraction-guide.md.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: member_creation_missing_email_returns_invalid_request
        claim_type: required_fields
        grounds: ["entities.Member.fields.email", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /v1/members without the required email field is rejected with ERR_VALIDATION (400); no member is persisted."
        test_recipe:
          setup: ["empty DB; logical clock at default 2026-05-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - call: "POST /v1/members"
              payload: { display_name: "No Email" }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_VALIDATION, http 400"

      - name: member_created_with_system_defaults
        claim_type: defaults
        grounds: ["entities.Member", "calculations.calc_fairness_score"]
        distinguishing_aspect: "A freshly registered member starts ACTIVE with zeroed computed fields and base fairness_score 50."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /v1/members"
              payload: { email: "def@x.com", display_name: "Def" }
              as: Anonymous
              captures: { m_id: $.data.id }
          trigger:
            - call: "GET /v1/members/${m_id}"
              as: Member
              as_user_id: "${m_id}"
          assert:
            - "Member.${m_id}.status == ACTIVE"
            - "Member.${m_id}.active_strike_points == 0"
            - "Member.${m_id}.fairness_score == 50 (base, no seniority bonus at age 0)"
            - "Member.${m_id}.given_count_90d == 0 and received_count_90d == 0"
            - "Member.${m_id}.version == 1 and suspension_ends_at == null"

      - name: gift_post_created_in_draft_echoes_inputs
        claim_type: creation
        grounds: ["entities.GiftPost", "state_machines.GiftPost"]
        distinguishing_aspect: "Create returns the post in initial state DRAFT with giver_id bound to the acting member and version 1."
        test_recipe:
          setup: ["clock 2026-05-10T09:00:00Z; OPEN group with member G"]
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/members"
              payload: { email: "eg@x.com", display_name: "G" }
              as: Anonymous
              captures: { g_m_id: $.data.id }
            - call: "POST /v1/groups"
              payload: { name: "Echo Group", zip_code: "98201", join_policy: "OPEN", capacity: 150 }
              as: PlatformAdmin
              captures: { g_id: $.data.id }
            - call: "POST /v1/memberships"
              payload: { group_id: "${g_id}" }
              as: Member
              as_user_id: "${g_m_id}"
          trigger:
            - call: "POST /v1/gift-posts"
              payload: { group_id: "${g_id}", title: "Rain boots", category: "CLOTHING", claim_mode: "FIRST_COME", expires_at: "2026-06-10T00:00:00Z" }
              as: Member
              as_user_id: "${g_m_id}"
              captures: { p_id: $.data.id, p_status: $.data.status }
          assert:
            - "response status == DRAFT, title == 'Rain boots', category == CLOTHING, claim_mode == FIRST_COME"
            - "response giver_id == ${g_m_id} and version == 1"
            - "response current_claim_id == null and current_offer_expires_at == null"

      - name: gift_post_invalid_category_returns_invalid_request
        claim_type: type_constraints
        grounds: ["entities.GiftPost.fields.category", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "An out-of-enum category on post creation is rejected with ERR_VALIDATION (400)."
        test_recipe:
          setup: ["OPEN group with member G"]
          setup_api_calls:
            - call: "POST /v1/members"
              payload: { email: "tg@x.com", display_name: "G" }
              as: Anonymous
              captures: { g_m_id: $.data.id }
            - call: "POST /v1/groups"
              payload: { name: "Type Group", zip_code: "98202", join_policy: "OPEN", capacity: 150 }
              as: PlatformAdmin
              captures: { g_id: $.data.id }
            - call: "POST /v1/memberships"
              payload: { group_id: "${g_id}" }
              as: Member
              as_user_id: "${g_m_id}"
          trigger:
            - call: "POST /v1/gift-posts"
              payload: { group_id: "${g_id}", title: "Car", category: "VEHICLE", claim_mode: "FIRST_COME", expires_at: "2026-06-10T00:00:00Z" }
              as: Member
              as_user_id: "${g_m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_VALIDATION, http 400 (VEHICLE is not in the category enum)"

      - name: wishlist_default_expiry_thirty_days
        claim_type: defaults
        grounds: ["entities.Wishlist.fields.expires_at"]
        distinguishing_aspect: "Wishlist created under the DEFAULT logical clock (no set_current_utc call) gets expires_at = created_at + 30 days exactly."
        test_recipe:
          setup: ["logical clock never set -> default 2026-05-01T00:00:00Z; OPEN group with member W"]
          setup_api_calls:
            - call: "POST /v1/members"
              payload: { email: "wl@x.com", display_name: "W" }
              as: Anonymous
              captures: { w_id: $.data.id }
            - call: "POST /v1/groups"
              payload: { name: "Wish Group", zip_code: "98203", join_policy: "OPEN", capacity: 150 }
              as: PlatformAdmin
              captures: { g_id: $.data.id }
            - call: "POST /v1/memberships"
              payload: { group_id: "${g_id}" }
              as: Member
              as_user_id: "${w_id}"
          trigger:
            - call: "POST /v1/wishlists"
              payload: { group_id: "${g_id}", keyword: "stroller" }
              as: Member
              as_user_id: "${w_id}"
              captures: { wl_id: $.data.id, wl_exp: $.data.expires_at, wl_status: $.data.status }
          assert:
            - "Wishlist.${wl_id}.status == ACTIVE"
            - "Wishlist.${wl_id}.expires_at == '2026-05-31T00:00:00Z' (default clock 2026-05-01T00:00:00Z + 30 days)"

      - name: member_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_MEMBER_NOT_FOUND]"]
        distinguishing_aspect: "GET on a well-formed but nonexistent member id returns ERR_MEMBER_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /v1/members/00000000-0000-0000-0000-000000000000"
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_MEMBER_NOT_FOUND, http 404"

      - name: reputation_event_immutable_shape
        claim_type: immutability
        grounds: ["entities.ReputationEvent"]
        distinguishing_aspect: "ReputationEvent has common_fields: false — the read shape carries id and created_at but no version/updated_at, and no update endpoint exists."
        test_recipe:
          setup: ["registered member M (owns a WELCOME_BONUS event)"]
          setup_api_calls:
            - call: "POST /v1/members"
              payload: { email: "rev@x.com", display_name: "Rev" }
              as: Anonymous
              captures: { m_id: $.data.id }
          trigger:
            - call: "GET /v1/members/${m_id}/reputation-events"
              as: Member
              as_user_id: "${m_id}"
              captures: { ev_status: "$.data[0].status" }
          assert:
            - "exactly 1 event: event_type == WELCOME_BONUS, base_points == 5, status == PENDING"
            - "event object has id and created_at but no version and no updated_at keys"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: publish_twice_returns_post_not_draft
        claim_type: invalid_transition
        grounds: ["state_machines.GiftPost.DRAFT_to_OPEN", "errors[ERR_POST_NOT_DRAFT]"]
        distinguishing_aspect: "Publishing an already-OPEN post is rejected with ERR_POST_NOT_DRAFT; idempotent re-publish is not allowed."
        test_recipe:
          setup: ["clock set; OPEN group with giver G; post P published"]
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/members"
              payload: { email: "ppg@x.com", display_name: "G" }
              as: Anonymous
              captures: { g_m_id: $.data.id }
            - call: "POST /v1/groups"
              payload: { name: "Pub Group", zip_code: "98204", join_policy: "OPEN", capacity: 150 }
              as: PlatformAdmin
              captures: { g_id: $.data.id }
            - call: "POST /v1/memberships"
              payload: { group_id: "${g_id}" }
              as: Member
              as_user_id: "${g_m_id}"
            - call: "POST /v1/gift-posts"
              payload: { group_id: "${g_id}", title: "Plates", category: "HOUSEHOLD", claim_mode: "FIRST_COME", expires_at: "2026-06-10T00:00:00Z" }
              as: Member
              as_user_id: "${g_m_id}"
              captures: { p_id: $.data.id }
            - call: "POST /v1/gift-posts/${p_id}/publish"
              as: Member
              as_user_id: "${g_m_id}"
          trigger:
            - call: "POST /v1/gift-posts/${p_id}/publish"
              as: Member
              as_user_id: "${g_m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_POST_NOT_DRAFT, http 409"
            - "GiftPost.${p_id}.status remains OPEN"

      - name: withdraw_fulfilled_post_returns_not_withdrawable
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.GiftPost.RESERVED_to_FULFILLED", "errors[ERR_POST_NOT_WITHDRAWABLE]"]
        distinguishing_aspect: "A FULFILLED post is terminal: withdraw is rejected with ERR_POST_NOT_WITHDRAWABLE and no side effects fire."
        test_recipe:
          setup: ["clock 2026-05-10T09:00:00Z; group with G and M; full gift cycle completed -> post FULFILLED"]
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/members"
              payload: { email: "fg@x.com", display_name: "G" }
              as: Anonymous
              captures: { g_m_id: $.data.id }
            - call: "POST /v1/members"
              payload: { email: "fm@x.com", display_name: "M" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /v1/groups"
              payload: { name: "Fulfill Group", zip_code: "98205", join_policy: "OPEN", capacity: 150 }
              as: PlatformAdmin
              captures: { g_id: $.data.id }
            - call: "POST /v1/memberships"
              payload: { group_id: "${g_id}" }
              as: Member
              as_user_id: "${g_m_id}"
            - call: "POST /v1/memberships"
              payload: { group_id: "${g_id}" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /v1/gift-posts"
              payload: { group_id: "${g_id}", title: "High chair", category: "FURNITURE", claim_mode: "FIRST_COME", expires_at: "2026-06-10T00:00:00Z" }
              as: Member
              as_user_id: "${g_m_id}"
              captures: { p_id: $.data.id }
            - call: "POST /v1/gift-posts/${p_id}/publish"
              as: Member
              as_user_id: "${g_m_id}"
            - call: "POST /v1/claims"
              payload: { post_id: "${p_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { c_id: $.data.id }
            - call: "POST /v1/claims/${c_id}/accept"
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /v1/pickup-plans"
              payload: { claim_id: "${c_id}", window_start: "2026-05-10T12:00:00Z", window_end: "2026-05-10T13:00:00Z" }
              as: Member
              as_user_id: "${g_m_id}"
              captures: { pp: $.data.id }
            - call: "POST /v1/pickup-plans/${pp}/confirm"
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /v1/pickup-plans/${pp}/complete"
              as: Member
              as_user_id: "${g_m_id}"
          trigger:
            - call: "POST /v1/gift-posts/${p_id}/withdraw"
              as: Member
              as_user_id: "${g_m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_POST_NOT_WITHDRAWABLE, http 409"
            - "GiftPost.${p_id}.status remains FULFILLED; Claim.${c_id}.status remains FULFILLED"

      - name: membership_approve_after_reject_returns_not_requested
        claim_type: invalid_transition
        grounds: ["state_machines.GroupMembership.REQUESTED_to_REJECTED", "errors[ERR_MEMBERSHIP_NOT_REQUESTED]"]
        distinguishing_aspect: "Approving a REJECTED (terminal) membership is rejected with ERR_MEMBERSHIP_NOT_REQUESTED."
        test_recipe:
          setup: ["APPROVAL_REQUIRED group; M's membership REQUESTED then rejected by admin"]
          setup_api_calls:
            - call: "POST /v1/members"
              payload: { email: "rjm@x.com", display_name: "M" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /v1/groups"
              payload: { name: "Reject Group", zip_code: "98206", join_policy: "APPROVAL_REQUIRED", capacity: 150 }
              as: PlatformAdmin
              captures: { g_id: $.data.id }
            - call: "POST /v1/memberships"
              payload: { group_id: "${g_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { ms: $.data.id }
            - call: "POST /v1/memberships/${ms}/reject"
              as: PlatformAdmin
          trigger:
            - call: "POST /v1/memberships/${ms}/approve"
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_MEMBERSHIP_NOT_REQUESTED, http 409"
            - "GroupMembership.${ms}.status remains REJECTED"

      - name: claim_withdraw_after_accept_returns_not_withdrawable
        claim_type: invalid_transition
        grounds: ["state_machines.Claim.OFFERED_to_WITHDRAWN", "errors[ERR_CLAIM_NOT_WITHDRAWABLE]"]
        distinguishing_aspect: "Withdraw is only valid from QUEUED/OFFERED; an ACCEPTED claim rejects withdraw with ERR_CLAIM_NOT_WITHDRAWABLE."
        test_recipe:
          setup: ["clock set; group with G and M; M's claim ACCEPTED on G's post"]
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/members"
              payload: { email: "wag@x.com", display_name: "G" }
              as: Anonymous
              captures: { g_m_id: $.data.id }
            - call: "POST /v1/members"
              payload: { email: "wam@x.com", display_name: "M" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /v1/groups"
              payload: { name: "Withdraw Group", zip_code: "98207", join_policy: "OPEN", capacity: 150 }
              as: PlatformAdmin
              captures: { g_id: $.data.id }
            - call: "POST /v1/memberships"
              payload: { group_id: "${g_id}" }
              as: Member
              as_user_id: "${g_m_id}"
            - call: "POST /v1/memberships"
              payload: { group_id: "${g_id}" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /v1/gift-posts"
              payload: { group_id: "${g_id}", title: "Sled", category: "OTHER", claim_mode: "FIRST_COME", expires_at: "2026-06-10T00:00:00Z" }
              as: Member
              as_user_id: "${g_m_id}"
              captures: { p_id: $.data.id }
            - call: "POST /v1/gift-posts/${p_id}/publish"
              as: Member
              as_user_id: "${g_m_id}"
            - call: "POST /v1/claims"
              payload: { post_id: "${p_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { c_id: $.data.id }
            - call: "POST /v1/claims/${c_id}/accept"
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /v1/claims/${c_id}/withdraw"
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_CLAIM_NOT_WITHDRAWABLE, http 409"
            - "Claim.${c_id}.status remains ACCEPTED"

      - name: pickup_miss_before_window_end_returns_window_not_passed
        claim_type: precondition_enforcement
        grounds: ["state_machines.PickupPlan.CONFIRMED_to_MISSED", "errors[ERR_PICKUP_WINDOW_NOT_PASSED]"]
        distinguishing_aspect: "A no-show can only be reported after window_end; while the window is still open the miss is rejected with ERR_PICKUP_WINDOW_NOT_PASSED."
        test_recipe:
          setup: ["clock 2026-05-10T09:00:00Z; ACCEPTED claim; plan CONFIRMED with window 2026-05-11T10:00:00Z-11:00:00Z (in the future)"]
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/members"
              payload: { email: "msg@x.com", display_name: "G" }
              as: Anonymous
              captures: { g_m_id: $.data.id }
            - call: "POST /v1/members"
              payload: { email: "msm@x.com", display_name: "M" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /v1/groups"
              payload: { name: "Miss Group", zip_code: "98208", join_policy: "OPEN", capacity: 150 }
              as: PlatformAdmin
              captures: { g_id: $.data.id }
            - call: "POST /v1/memberships"
              payload: { group_id: "${g_id}" }
              as: Member
              as_user_id: "${g_m_id}"
            - call: "POST /v1/memberships"
              payload: { group_id: "${g_id}" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /v1/gift-posts"
              payload: { group_id: "${g_id}", title: "Rake", category: "OTHER", claim_mode: "FIRST_COME", expires_at: "2026-06-10T00:00:00Z" }
              as: Member
              as_user_id: "${g_m_id}"
              captures: { p_id: $.data.id }
            - call: "POST /v1/gift-posts/${p_id}/publish"
              as: Member
              as_user_id: "${g_m_id}"
            - call: "POST /v1/claims"
              payload: { post_id: "${p_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { c_id: $.data.id }
            - call: "POST /v1/claims/${c_id}/accept"
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /v1/pickup-plans"
              payload: { claim_id: "${c_id}", window_start: "2026-05-11T10:00:00Z", window_end: "2026-05-11T11:00:00Z" }
              as: Member
              as_user_id: "${g_m_id}"
              captures: { pp: $.data.id }
            - call: "POST /v1/pickup-plans/${pp}/confirm"
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /v1/pickup-plans/${pp}/miss"
              as: Member
              as_user_id: "${g_m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_PICKUP_WINDOW_NOT_PASSED, http 409 (now 2026-05-10T09:00:00Z < window_end 2026-05-11T11:00:00Z)"
            - "PickupPlan.${pp}.status remains CONFIRMED; Claim.${c_id}.status remains ACCEPTED"

      - name: wishlist_rematch_cycle_on_post_withdraw
        claim_type: side_effect_execution
        grounds: ["state_machines.Wishlist.ACTIVE_to_MATCHED", "state_machines.Wishlist.MATCHED_to_ACTIVE"]
        distinguishing_aspect: "Publish MATCHES a keyword-compatible wishlist; withdrawing the matched post flips the wishlist back to ACTIVE with matched_post_id cleared (cycle)."
        test_recipe:
          setup: ["clock set; group with W (wishlist keyword 'lamp', category HOUSEHOLD) and giver G"]
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/members"
              payload: { email: "wlm@x.com", display_name: "W" }
              as: Anonymous
              captures: { w_id: $.data.id }
            - call: "POST /v1/members"
              payload: { email: "wlg@x.com", display_name: "G" }
              as: Anonymous
              captures: { g_m_id: $.data.id }
            - call: "POST /v1/groups"
              payload: { name: "Rematch Group", zip_code: "98209", join_policy: "OPEN", capacity: 150 }
              as: PlatformAdmin
              captures: { g_id: $.data.id }
            - call: "POST /v1/memberships"
              payload: { group_id: "${g_id}" }
              as: Member
              as_user_id: "${w_id}"
            - call: "POST /v1/memberships"
              payload: { group_id: "${g_id}" }
              as: Member
              as_user_id: "${g_m_id}"
            - call: "POST /v1/wishlists"
              payload: { group_id: "${g_id}", keyword: "lamp", category: "HOUSEHOLD" }
              as: Member
              as_user_id: "${w_id}"
              captures: { wl: $.data.id }
            - call: "POST /v1/gift-posts"
              payload: { group_id: "${g_id}", title: "Desk Lamp", category: "HOUSEHOLD", claim_mode: "FIRST_COME", expires_at: "2026-06-10T00:00:00Z" }
              as: Member
              as_user_id: "${g_m_id}"
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /v1/gift-posts/${p_id}/publish"
              as: Member
              as_user_id: "${g_m_id}"
            - call: "GET /v1/wishlists/${wl}"
              as: Member
              as_user_id: "${w_id}"
            - call: "POST /v1/gift-posts/${p_id}/withdraw"
              as: Member
              as_user_id: "${g_m_id}"
            - call: "GET /v1/wishlists/${wl}"
              as: Member
              as_user_id: "${w_id}"
          assert:
            - "after publish: Wishlist.${wl}.status == MATCHED and matched_post_id == ${p_id} (case-insensitive keyword substring)"
            - "after withdraw: Wishlist.${wl}.status == ACTIVE and matched_post_id == null (cycle back)"

      - name: report_dismiss_creates_no_moderation_action
        claim_type: side_effect_execution
        grounds: ["state_machines.Report.UNDER_REVIEW_to_RESOLVED_DISMISSED"]
        distinguishing_aspect: "Resolving with DISMISS terminates the report without creating any ModerationAction; health recompute still runs."
        test_recipe:
          setup: ["clock set; group with R and target member T; report filed and UNDER_REVIEW"]
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/members"
              payload: { email: "drr@x.com", display_name: "R" }
              as: Anonymous
