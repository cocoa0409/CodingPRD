scenario: "332. Tool & Equipment Rental Yard: catalog (tools/heavy equipment) & availability, daily/weekly/4-week rate, deposit & damage waiver, reservation & pickup/delivery, fuel & cleaning charge, overdue/late fee, maintenance/out-of-service, contractor account"
domain_name: "tool-equipment-rental-yard"
api_prefix: "/rental-yard"

complexity_profile:
  primary_archetype: "Quota / allocation"
  secondary_archetype: "Pricing engine"
  complexity_layers:
    - tiered_pricing
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - derived_field_reconciliation

  entity_topology: flat
  # Flat peer entities linked by FK references. EquipmentUnit, RentalCatalogItem,
  # ContractorAccount, Reservation, RentalAgreement, ReturnInspection,
  # MaintenanceTicket, DamageCharge, AccountLedgerEntry, RateCard, YardClock —
  # no entity is nested under another in the URL path; all relate via foreign keys.

  state_machine_shape: branching
  # Reservation: branching with revert (CONFIRMED -> {DISPATCHED_DELIVERY, PICKED_UP} -> ON_RENT, plus CANCELLED revert).
  # RentalAgreement: branching (ON_RENT -> {RETURNED_PENDING_INSPECTION} -> {CLOSED, CLOSED_WITH_DAMAGE}).
  # EquipmentUnit: parallel-flavored (availability_state) with OUT_OF_SERVICE branch.
  # MaintenanceTicket: linear-with-revert.

  relationship_patterns:
    - one_to_many        # RentalCatalogItem -> EquipmentUnit; ContractorAccount -> Reservation; RentalAgreement -> DamageCharge
    - cross_aggregate    # Reservation references EquipmentUnit + ContractorAccount across aggregates; AccountLedgerEntry references RentalAgreement

  role_model: peer_roles
  # YardManager (catalog/equipment/maintenance authority), RentalAgent (reservations, dispatch, returns),
  # Contractor (entity-backed, acts on own account/reservations), Inspector (return inspections only).

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =====================================================================
# §1.1 Entity-Relationship Table
# =====================================================================
entities:
  - name: RateCard
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, no type prefix; identity only."
      - name: created_at
        type: datetime
        source: system
        description: "ISO 8601 UTC, three fractional digits."
      - name: updated_at
        type: datetime
        source: system
        description: "ISO 8601 UTC; refreshed on every mutation including cascades."
      - name: version
        type: integer
        source: system
        description: "Starts at 1, increments by one on every mutation."
      - name: name
        type: string
        source: input
        description: "Human label for the rate card (e.g., 'Standard 2026 Q2')."
        constraints: "1-80 chars, required"
      - name: daily_rate_cents
        type: integer
        source: input
        description: "Charge per rental-day for days NOT absorbed by a week or 4-week block."
        constraints: ">= 0, required"
      - name: weekly_rate_cents
        type: integer
        source: input
        description: "Flat charge for each whole 7-day block."
        constraints: ">= 0, required"
      - name: four_week_rate_cents
        type: integer
        source: input
        description: "Flat charge for each whole 28-day block."
        constraints: ">= 0, required"
      - name: deposit_cents
        type: integer
        source: input
        description: "Refundable security deposit held at agreement open."
        constraints: ">= 0, required"
      - name: damage_waiver_daily_cents
        type: integer
        source: input
        description: "Per-rental-day surcharge when the optional damage waiver is purchased."
        constraints: ">= 0, required"
      - name: fuel_refill_cents_per_liter
        type: integer
        source: input
        description: "Charge per liter of fuel needed to refill to the start level at return."
        constraints: ">= 0, required"
      - name: cleaning_fee_cents
        type: integer
        source: input
        description: "Flat cleaning fee applied when the unit is returned DIRTY at inspection."
        constraints: ">= 0, required"
      - name: late_fee_multiplier
        type: number
        source: input
        description: "Multiplier applied to daily_rate_cents for each whole overdue day."
        constraints: ">= 1.0, required; e.g. 1.5"
      - name: active
        type: boolean
        source: system
        description: "True while this card may be referenced by new catalog items; set false on retire."
        default: true

  - name: RentalCatalogItem
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, no type prefix; identity only."
      - name: created_at
        type: datetime
        source: system
        description: "ISO 8601 UTC, three fractional digits."
      - name: updated_at
        type: datetime
        source: system
        description: "ISO 8601 UTC; refreshed on every mutation including cascades."
      - name: version
        type: integer
        source: system
        description: "Starts at 1, increments by one on every mutation."
      - name: rate_card_id
        type: string
        source: input
        description: "FK -> RateCard.id; the pricing card applied to every unit of this item."
        constraints: "required; referenced card must be active at creation"
      - name: sku
        type: string
        source: input
        description: "Catalog SKU, unique across all catalog items."
        constraints: "required, unique, 1-40 chars"
      - name: name
        type: string
        source: input
        description: "Display name (e.g., 'Mini Excavator 1.5T')."
        constraints: "required, 1-120 chars"
      - name: category
        type: enum
        source: input
        description: "Coarse class used by availability and delivery rules."
        constraints: "one of {HAND_TOOL, POWER_TOOL, HEAVY_EQUIPMENT}; required"
      - name: requires_delivery
        type: boolean
        source: input
        description: "When true, units of this item cannot be picked up at the counter; reservation MUST use DELIVERY fulfillment."
