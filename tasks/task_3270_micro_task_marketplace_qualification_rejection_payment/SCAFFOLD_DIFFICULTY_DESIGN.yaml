# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 3270 — micro-task-marketplace
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7. Nine rules × 2 = 18.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:

      - name: requester_rate_window_variant_vs_lifetime_variant
        grounds:
          - calculations.requester_rejection_rate
          - entities.Requester.fields.lifetime_rejection_rate_pct
          - endpoints.POST_/mkt/requesters/{requester_id}/abuse-review
          - errors.ERR_REQUESTER_REVIEW_NOT_TRIGGERED
        distinguishing_aspect: "The same requester reads 50% under the lifetime variant (would suspend) but 0% under the 30-day window variant (stays ACTIVE), because the only rejection lies outside the window."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Requester Acme prepays 2000c, publishes a 2-slot HIT at 100c reward."
            - "Worker W1 accepts slot 1 at T0, submits at T0+40min, is rejected at T0+40min (rejection review timestamped T0+40min)."
            - "Clock advances to 2026-10-11T00:00:00Z (40 days later). Worker W2 accepts slot 2, submits at T0+40d+40min, is approved."
            - "Requester now has 1 approval (inside the window) and 1 rejection (outside the window): lifetime rate 50, window rate 0."
          setup_api_calls:
            - call: "POST /mkt/requesters"
              payload: { name: "Acme Surveys" }
              as: Anonymous
              captures: { rid: $.data.id }
            - call: "POST /mkt/requesters/${rid}/deposits"
              payload: { amount_cents: 2000 }
              as: Requester
              as_user_id: "${rid}"
              captures: { dep1: $.data.id }
            - call: "POST /mkt/requester-deposits/${dep1}/settle"
              payload: { outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "POST /mkt/hits"
              payload: { requester_id: "${rid}", title: "Rate Probe", reward_cents: 100, max_assignments: 2, assignment_duration_minutes: 60, time_limit_minutes: 120 }
              as: Requester
              as_user_id: "${rid}"
              captures: { hit1: $.data.id }
            - call: "POST /mkt/hits/${hit1}/publish"
              payload: {}
              as: Requester
              as_user_id: "${rid}"
            - call: "POST /mkt/workers"
              payload: { display_name: "W1 Old Rejection", country: "US" }
              as: Anonymous
              captures: { w1: $.data.id }
            - call: "POST /mkt/hits/${hit1}/assignments"
              payload: { worker_id: "${w1}" }
              as: Worker
              as_user_id: "${w1}"
              captures: { a1: $.data.id, a1_v: $.data.version }
            - call: "POST /mkt/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:40:00Z" }
              as: PlatformAdmin
            - call: "POST /mkt/assignments/${a1}/submit"
              payload: { expected_assignment_version: "${a1_v}" }
              as: Worker
              as_user_id: "${w1}"
            - call: "POST /mkt/assignments/${a1}/reject"
              payload: { reason: "answers copied verbatim" }
              as: Requester
              as_user_id: "${rid}"
            - call: "POST /mkt/_clock/set_current_utc"
              payload: { current_utc: "2026-10-11T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /mkt/workers"
              payload: { display_name: "W2 Recent Approval", country: "US" }
              as: Anonymous
              captures: { w2: $.data.id }
            - call: "POST /mkt/hits/${hit1}/assignments"
              payload: { worker_id: "${w2}" }
              as: Worker
              as_user_id: "${w2}"
              captures: { a2: $.data.id, a2_v: $.data.version }
            - call: "POST /mkt/_clock/set_current_utc"
              payload: { current_utc: "2026-10-11T00:40:00Z" }
              as: PlatformAdmin
            - call: "POST /mkt/assignments/${a2}/submit"
              payload: { expected_assignment_version: "${a2_v}" }
              as: Worker
              as_user_id: "${w2}"
            - call: "POST /mkt/assignments/${a2}/approve"
              payload: {}
              as: Requester
              as_user_id: "${rid}"
          trigger:
            - call: "POST /mkt/requesters/${rid}/abuse-review"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Requester.${rid}.lifetime_rejection_rate_pct == 50"
            - "Requester.${rid}.status == ACTIVE — the window variant rate is 0, below FRAUD_REVIEW_THRESHOLD_PCT 40"
            - "Requester.${rid}.approved_count == 1 and Requester.${rid}.rejected_count == 1"

      - name: worker_earning_per_assignment_rounding_vs_total_rounding
        grounds:
          - calculations.worker_net_earning
          - entities.Worker.fields.total_earned_cents
          - endpoints.POST_/mkt/assignments/{assignment_id}/approve
        distinguishing_aspect: "Two approved 5c rewards credit the worker 8c under the pinned per-assignment rounding, while rounding the summed gross once would credit 9c — the scaffold pins 8."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Requester Acme prepays 2000c."
            - "Two 1-slot HITs at 5c reward each; worker W1 accepts one slot from each and both are approved."
          setup_api_calls:
            - call: "POST /mkt/requesters"
              payload: { name: "Acme Cents" }
              as: Anonymous
              captures: { rid: $.data.id }
            - call: "POST /mkt/requesters/${rid}/deposits"
              payload: { amount_cents: 2000 }
              as: Requester
              as_user_id: "${rid}"
              captures: { dep1: $.data.id }
            - call: "POST /mkt/requester-deposits/${dep1}/settle"
              payload: { outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "POST /mkt/hits"
              payload: { requester_id: "${rid}", title: "Nickel A", reward_cents: 5, max_assignments: 1, assignment_duration_minutes: 60, time_limit_minutes: 120 }
              as: Requester
              as_user_id: "${rid}"
              captures: { hA: $.data.id }
            - call: "POST /mkt/hits"
              payload: { requester_id: "${rid}", title: "Nickel B", reward_cents: 5, max_assignments: 1, assignment_duration_minutes: 60, time_limit_minutes: 120 }
              as: Requester
              as_user_id: "${rid}"
              captures: { hB: $.data.id }
            - call: "POST /mkt/hits/${hA}/publish"
              payload: {}
              as: Requester
              as_user_id: "${rid}"
            - call: "POST /mkt/hits/${hB}/publish"
              payload: {}
              as: Requester
              as_user_id: "${rid}"
            - call: "POST /mkt/workers"
              payload: { display_name: "W1 Nickel", country: "US" }
              as: Anonymous
              captures: { w1: $.data.id }
            - call: "POST /mkt/hits/${hA}/assignments"
              payload: { worker_id: "${w1}" }
              as: Worker
              as_user_id: "${w1}"
              captures: { aA: $.data.id, aA_v: $.data.version }
            - call: "POST /mkt/hits/${hB}/assignments"
              payload: { worker_id: "${w1}" }
              as: Worker
              as_user_id: "${w1}"
              captures: { aB: $.data.id, aB_v: $.data.version }
            - call: "POST /mkt/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:40:00Z" }
              as: PlatformAdmin
            - call: "POST /mkt/assignments/${aA}/submit"
              payload: { expected_assignment_version: "${aA_v}" }
              as: Worker
              as_user_id: "${w1}"
            - call: "POST /mkt/assignments/${aB}/submit"
              payload: { expected_assignment_version: "${aB_v}" }
              as: Worker
              as_user_id: "${w1}"
            - call: "POST /mkt/assignments/${aA}/approve"
              payload: {}
              as: Requester
              as_user_id: "${rid}"
            - call: "POST /mkt/assignments/${aB}/approve"
              payload: {}
              as: Requester
              as_user_id: "${rid}"
          trigger:
            - call: "GET /mkt/workers/${w1}"
              payload: {}
              as: Worker
              as_user_id: "${w1}"
          assert:
            - "Worker.${w1}.total_earned_cents == 8"
            - "Worker.${w1}.approved_count == 2"
            - "the sum-then-round-once reading (gross 10, commission 1, net 9) is NOT the value returned"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:

      - name: worker_earning_nested_rounding_per_assignment_then_sum
        grounds:
          - calculations.worker_net_earning
          - entities.Worker.fields.withdrawable_cents
          - endpoints.GET_/mkt/workers/{id}
        distinguishing_aspect: "Three approved 5c rewards credit 12c because each item rounds to 4c before summing; summing the 15c gross first would round the commission to 2c and credit 13c."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Requester Acme prepays 2000c and publishes one 3-slot HIT at 5c reward."
            - "Worker W1 accepts all three slots and all three are approved."
          setup_api_calls:
            - call: "POST /mkt/requesters"
              payload: { name: "Acme Triple" }
              as: Anonymous
              captures: { rid: $.data.id }
            - call: "POST /mkt/requesters/${rid}/deposits"
              payload: { amount_cents: 2000 }
              as: Requester
              as_user_id: "${rid}"
              captures: { dep1: $.data.id }
            - call: "POST /mkt/requester-deposits/${dep1}/settle"
              payload: { outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "POST /mkt/hits"
              payload: { requester_id: "${rid}", title: "Triple Nickel", reward_cents: 5, max_assignments: 3, assignment_duration_minutes: 60, time_limit_minutes: 120 }
              as: Requester
              as_user_id: "${rid}"
              captures: { hit1: $.data.id }
            - call: "POST /mkt/hits/${hit1}/publish"
              payload: {}
              as: Requester
              as_user_id: "${rid}"
            - call: "POST /mkt/workers"
              payload: { display_name: "W1 Triple", country: "US" }
              as: Anonymous
              captures: { w1: $.data.id }
            - call: "POST /mkt/hits/${hit1}/assignments"
              payload: { worker_id: "${w1}" }
              as: Worker
              as_user_id: "${w1}"
              captures: { a1: $.data.id, a1_v: $.data.version }
            - call: "POST /mkt/hits/${hit1}/assignments"
              payload: { worker_id: "${w1}" }
              as: Worker
              as_user_id: "${w1}"
              captures: { a2: $.data.id, a2_v: $.data.version }
            - call: "POST /mkt/hits/${hit1}/assignments"
              payload: { worker_id: "${w1}" }
              as: Worker
              as_user_id: "${w1}"
              captures: { a3: $.data.id, a3_v: $.data.version }
            - call: "POST /mkt/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:40:00Z" }
              as: PlatformAdmin
            - call: "POST /mkt/assignments/${a1}/submit"
              payload: { expected_assignment_version: "${a1_v}" }
              as: Worker
              as_user_id: "${w1}"
            - call: "POST /mkt/assignments/${a2}/submit"
              payload: { expected_assignment_version: "${a2_v}" }
              as: Worker
              as_user_id: "${w1}"
            - call: "POST /mkt/assignments/${a3}/submit"
              payload: { expected_assignment_version: "${a3_v}" }
              as: Worker
              as_user_id: "${w1}"
            - call: "POST /mkt/assignments/${a1}/approve"
              payload: {}
              as: Requester
              as_user_id: "${rid}"
            - call: "POST /mkt/assignments/${a2}/approve"
              payload: {}
              as: Requester
              as_user_id: "${rid}"
            - call: "POST /mkt/assignments/${a3}/approve"
              payload: {}
              as: Requester
              as_user_id: "${rid}"
          trigger:
            - call: "GET /mkt/workers/${w1}"
              payload: {}
              as: Worker
              as_user_id: "${w1}"
          assert:
            - "Worker.${w1}.total_earned_cents == 12"
            - "Worker.${w1}.withdrawable_cents == 12"
            - "per-item commission is 1c each (round_half_up(0.5)), so the pinned order gives 3 * (5 - 1) == 12"

      - name: hit_funds_required_circular_tier_evaluation_order
        grounds:
          - calculations.hit_funds_required
          - entities.HIT.fields.funds_required_cents
          - endpoints.POST_/mkt/hits
        distinguishing_aspect: "A 1750c x 10 HIT must escrow 20155c: the per-assignment fee tier keys on the intermediate pre_fee_cents 20125 (>= 20000 -> 3c), not on the gross pool 17500 (which is below the threshold and would wrongly select 5c)."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Requester Acme prepares to create a 1750c x 10 HIT."
          setup_api_calls:
            - call: "POST /mkt/requesters"
              payload: { name: "Acme Tier" }
              as: Anonymous
              captures: { rid: $.data.id }
            - call: "POST /mkt/requesters/${rid}/deposits"
              payload: { amount_cents: 50000 }
              as: Requester
              as_user_id: "${rid}"
              captures: { dep1: $.data.id }
            - call: "POST /mkt/requester-deposits/${dep1}/settle"
              payload: { outcome: "SUCCEEDED" }
              as: PlatformAdmin
          trigger:
            - call: "POST /mkt/hits"
              payload: { requester_id: "${rid}", title: "Tier Probe", reward_cents: 1750, max_assignments: 10, assignment_duration_minutes: 60, time_limit_minutes: 120 }
              as: Requester
              as_user_id: "${rid}"
              captures: { hit1: $.data.id }
          assert:
            - "HIT.${hit1}.funds_required_cents == 20155"
            - "the commission step used rate 0.15 (gross_pool_cents 17500 falls in tier [10000, 50000)), giving round_half_up(2625.0) == 2625"
            - "the fee step used 3c/assignment because pre_fee_cents 20125 >= 20000, NOT 5c because gross_pool_cents 17500 < 20000"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:

      - name: assignment_reject_dispute_resolve_branch_and_rejoin
        grounds:
          - state_machines.Assignment.transitions.SUBMITTED_to_REJECTED
          - state_machines.Assignment.transitions.REJECTED_to_DISPUTED
          - state_machines.Assignment.transitions.DISPUTED_to_REJECTED
          - errors.ERR_DISPUTE_ALREADY_USED
        distinguishing_aspect: "The Assignment machine forks SUBMITTED->{APPROVED, REJECTED} and REJECTED->DISPUTED re-joins via an UPHOLD resolution back to REJECTED, so a single assignment visits the REJECTED state twice."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One 1-slot 100c HIT; worker W1 accepts, submits at T0+40min, and the requester rejects with a reason."
          setup_api_calls:
            - call: "POST /mkt/requesters"
              payload: { name: "Acme Dispute" }
              as: Anonymous
              captures: { rid: $.data.id }
            - call: "POST /mkt/requesters/${rid}/deposits"
              payload: { amount_cents: 1000 }
              as: Requester
              as_user_id: "${rid}"
              captures: { dep1: $.data.id }
            - call: "POST /mkt/requester-deposits/${dep1}/settle"
              payload: { outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "POST /mkt/hits"
              payload: { requester_id: "${rid}", title: "Dispute Probe", reward_cents: 100, max_assignments: 1, assignment_duration_minutes: 60, time_limit_minutes: 120 }
              as: Requester
              as_user_id: "${rid}"
              captures: { hit1: $.data.id }
            - call: "POST /mkt/hits/${hit1}/publish"
              payload: {}
              as: Requester
              as_user_id: "${rid}"
            - call: "POST /mkt/workers"
              payload: { display_name: "W1 Dispute", country: "US" }
              as: Anonymous
              captures: { w1: $.data.id }
            - call: "POST /mkt/hits/${hit1}/assignments"
              payload: { worker_id: "${w1}" }
              as: Worker
              as_user_id: "${w1}"
              captures: { a1: $.data.id, a1_v: $.data.version }
            - call: "POST /mkt/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:40:00Z" }
              as: PlatformAdmin
            - call: "POST /mkt/assignments/${a1}/submit"
              payload: { expected_assignment_version: "${a1_v}" }
              as: Worker
              as_user_id: "${w1}"
            - call: "POST /mkt/assignments/${a1}/reject"
              payload: { reason: "not per instructions" }
              as: Requester
              as_user_id: "${rid}"
          trigger:
            - call: "POST /mkt/assignments/${a1}/dispute"
              payload: { reason: "I followed the checklist" }
              as: Worker
              as_user_id: "${w1}"
            - call: "POST /mkt/assignments/${a1}/admin-resolve"
              payload: { decision: "UPHOLD", reason: "review confirmed" }
              as: PlatformAdmin
          assert:
            - "after the dispute: Assignment.${a1}.status == DISPUTED"
            - "after the UPHOLD: Assignment.${a1}.status == REJECTED (the machine re-enters its terminal fork)"
            - "Worker.${w1}.rejected_count == 1 throughout — disputing never refunds the approval-rate damage by itself"

      - name: requester_suspension_reinstate_cycle
        grounds:
          - state_machines.Requester.transitions.ACTIVE_to_SUSPENDED
          - state_machines.Requester.transitions.SUSPENDED_to_ACTIVE
          - calculations.requester_risk_score
        distinguishing_aspect: "The Requester machine is cyclic ACTIVE->SUSPENDED->ACTIVE, so the same requester row is observed in both non-terminal states rather than ending terminal."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One 3-slot 100c HIT; W1 and W2 each submit and are rejected, W3 submits and is approved (window rejection rate 67)."
          setup_api_calls:
            - call: "POST /mkt/requesters"
              payload: { name: "Acme Cycle" }
              as: Anonymous
              captures: { rid: $.data.id }
            - call: "POST /mkt/requesters/${rid}/deposits"
              payload: { amount_cents: 2000 }
              as: Requester
              as_user_id: "${rid}"
              captures: { dep1: $.data.id }
            - call: "POST /mkt/requester-deposits/${dep1}/settle"
              payload: { outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "POST /mkt/hits"
              payload: { requester_id: "${rid}", title: "Cycle Probe", reward_cents: 100, max_assignments: 3, assignment_duration_minutes: 60, time_limit_minutes: 120 }
              as: Requester
              as_user_id: "${rid}"
              captures: { hit1: $.data.id }
            - call: "POST /mkt/hits/${hit1}/publish"
              payload: {}
              as: Requester
              as_user_id: "${rid}"
            - call: "POST /mkt/workers"
              payload: { display_name: "W1 Cycle", country: "US" }
              as: Anonymous
              captures: { w1: $.data.id }
            - call: "POST /mkt/workers"
              payload: { display_name: "W2 Cycle", country: "US" }
              as: Anonymous
              captures: { w2: $.data.id }
            - call: "POST /mkt/workers"
              payload: { display_name: "W3 Cycle", country: "US" }
              as: Anonymous
              captures: { w3: $.data.id }
            - call: "POST /mkt/hits/${hit1}/assignments"
              payload: { worker_id: "${w1}" }
              as: Worker
              as_user_id: "${w1}"
              captures: { a1: $.data.id, a1_v: $.data.version }
            - call: "POST /mkt/hits/${hit1}/assignments"
              payload: { worker_id: "${w2}" }
              as: Worker
              as_user_id: "${w2}"
              captures: { a2: $.data.id, a2_v: $.data.version }
            - call: "POST /mkt/hits/${hit1}/assignments"
              payload: { worker_id: "${w3}" }
              as: Worker
              as_user_id: "${w3}"
              captures: { a3: $.data.id, a3_v: $.data.version }
            - call: "POST /mkt/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:40:00Z" }
              as: PlatformAdmin
            - call: "POST /mkt/assignments/${a1}/submit"
              payload: { expected_assignment_version: "${a1_v}" }
              as: Worker
              as_user_id: "${w1}"
            - call: "POST /mkt/assignments/${a2}/submit"
              payload: { expected_assignment_version: "${a2_v}" }
              as: Worker
              as_user_id: "${w2}"
            - call: "POST /mkt/assignments/${a3}/submit"
              payload: { expected_assignment_version: "${a3_v}" }
              as: Worker
              as_user_id: "${w3}"
            - call: "POST /mkt/assignments/${a1}/reject"
              payload: { reason: "spam" }
              as: Requester
              as_user_id: "${rid}"
            - call: "POST /mkt/assignments/${a2}/reject"
              payload: { reason: "spam" }
              as: Requester
              as_user_id: "${rid}"
            - call: "POST /mkt/assignments/${a3}/approve"
              payload: {}
              as: Requester
              as_user_id: "${rid}"
          trigger:
            - call: "POST /mkt/requesters/${rid}/abuse-review"
              payload: {}
              as: PlatformAdmin
            - call: "POST /mkt/requesters/${rid}/reinstate"
              payload: {}
              as: PlatformAdmin
          assert:
            - "after abuse-review: Requester.${rid}.status == SUSPENDED and suspension_reason == ABUSE_AUTO"
            - "after reinstate: Requester.${rid}.status == ACTIVE and task_abuse_flag == false"
            - "cancelled HITs are not revived — HIT.${hit1}.status stays COMPLETED/CANCELLED as of the suspension moment"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:

      - name: rejection_to_suspension_to_hit_cancel_to_assignment_expire
        grounds:
          - state_machines.Assignment.transitions.SUBMITTED_to_REJECTED
          - state_machines.Requester.transitions.ACTIVE_to_SUSPENDED
          - state_machines.HIT.transitions.PUBLISHED_to_CANCELLED
          - errors.ERR_REQUESTER_TASK_BLOCKED
        distinguishing_aspect: "A single rejection reaches four dependent entities — Requester rate, Requester suspension, each owned HIT's cancellation and refund, and a third worker's live Assignment expiry — each hop caused by the previous one."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Requester prepays 2000c and publishes one 3-slot 100c HIT with a 600-minute time limit."
            - "W1 submits and is rejected; W2 submits and is rejected (window rate 100). W3 accepts the third slot and leaves it ACCEPTED (clock stays within its 600-minute limit)."
          setup_api_calls:
            - call: "POST /mkt/requesters"
              payload: { name: "Acme Cascade" }
              as: Anonymous
              captures: { rid: $.data.id }
            - call: "POST /mkt/requesters/${rid}/deposits"
              payload: { amount_cents: 2000 }
              as: Requester
              as_user_id: "${rid}"
              captures: { dep1: $.data.id }
            - call: "POST /mkt/requester-deposits/${dep1}/settle"
              payload: { outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "POST /mkt/hits"
              payload: { requester_id: "${rid}", title: "Cascade Probe", reward_cents: 100, max_assignments: 3, assignment_duration_minutes: 60, time_limit_minutes: 600 }
              as: Requester
              as_user_id: "${rid}"
              captures: { hit1: $.data.id, hit1_v: $.data.version }
            - call: "POST /mkt/hits/${hit1}/publish"
              payload: {}
              as: Requester
              as_user_id: "${rid}"
            - call: "POST /mkt/workers"
              payload: { display_name: "W1 Cascade", country: "US" }
              as: Anonymous
              captures: { w1: $.data.id }
            - call: "POST /mkt/workers"
