  # ---------------------------------------------------------------------------
  - section: cross_cutting_layers
    instances:
      - name: meal_plan_supersede_cancels_existing_draft
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[meal-plan-create-stale-event]", "endpoints.POST /service-events/{eventId}/meal-plans", state_machines.MealPlan]
        distinguishing_aspect: "Create-with-supersede: with a correct expected_event_version, a new meal plan is created and the event's existing DRAFT plan auto-cancels; event.version advances by 1 per creation (1 -> 2 -> 3 observed across two creates)."
        test_recipe:
          setup: ["event in PLANNING (version 1)"]
          setup_api_calls:
            - { call: "POST /service-events", payload: { name: "Day 48", event_start_at: "2026-08-20T09:00:00Z", event_end_at: "2026-08-20T15:00:00Z", budget_cents: 500000 }, as: CommunityEngagementManager, captures: { ev1: $.data.id, v0: $.data.version } }
            - { call: "GET /service-events/${ev1}", payload: {}, as: Any, captures: { ev_v1: $.data.version } }
            - { call: "POST /service-events/${ev1}/meal-plans", payload: { vendor_name: "FreshCo", per_person_cost_cents: 1000, expected_event_version: "${ev_v1}" }, as: LogisticsCoordinator, captures: { mpA: $.data.id } }
            - { call: "GET /service-events/${ev1}", payload: {}, as: Any, captures: { ev_v2: $.data.version } }
          trigger:
            - { call: "POST /service-events/${ev1}/meal-plans", payload: { vendor_name: "OtherCo", per_person_cost_cents: 900, expected_event_version: "${ev_v2}" }, as: LogisticsCoordinator, captures: { mpB: $.data.id } }
            - { call: "GET /meal-plans/${mpA}", payload: {}, as: Any, captures: { mpA_status: $.data.status } }
            - { call: "GET /service-events/${ev1}", payload: {}, as: Any, captures: { ev_v3: $.data.version } }
          assert:
            - "versions: v0 == 1, after first create == 2, after second create == 3 (each creation bumps event version by exactly 1)"
            - "MealPlan.${mpA}.status == CANCELLED (superseded); MealPlan.${mpB}.status == DRAFT"

      - name: meal_plan_create_stale_event_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[meal-plan-create-stale-event]", "errors[ERR_STALE_EVENT_VERSION]"]
        distinguishing_aspect: "The OCC loser: a create carrying the version observed BEFORE an intervening superseding create (1 while the event is at 2) is rejected with ERR_STALE_EVENT_VERSION (412) and neither plan is disturbed."
        test_recipe:
          setup: ["event in PLANNING; meal plan A created with fresh version (event now at 2); stale client holds version 1"]
          setup_api_calls:
            - { call: "POST /service-events", payload: { name: "Day 49", event_start_at: "2026-08-20T09:00:00Z", event_end_at: "2026-08-20T15:00:00Z", budget_cents: 500000 }, as: CommunityEngagementManager, captures: { ev1: $.data.id } }
            - { call: "GET /service-events/${ev1}", payload: {}, as: Any, captures: { ev_v_stale: $.data.version } }
            - { call: "POST /service-events/${ev1}/meal-plans", payload: { vendor_name: "FreshCo", per_person_cost_cents: 1000, expected_event_version: "${ev_v_stale}" }, as: LogisticsCoordinator, captures: { mpA: $.data.id } }
          trigger:
            - { call: "POST /service-events/${ev1}/meal-plans", payload: { vendor_name: "StaleCo", per_person_cost_cents: 800, expected_event_version: "${ev_v_stale}" }, as: LogisticsCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_STALE_EVENT_VERSION; http 412"
            - "MealPlan.${mpA}.status remains DRAFT (no supersede happened)"

      - name: reschedule_stale_version_rejected_and_fresh_accepted
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[event-reschedule-stale-version]", "errors[ERR_STALE_EVENT_VERSION]", "endpoints.POST /service-events/{eventId}/reschedule"]
        distinguishing_aspect: "Reschedule is OCC-guarded on the same parent version: the first reschedule with the observed version succeeds and bumps version 1 -> 2; a second reschedule replaying the stale observed version fails with ERR_STALE_EVENT_VERSION."
        test_recipe:
          setup: ["event in PLANNING at version 1"]
          setup_api_calls:
            - { call: "POST /service-events", payload: { name: "Day 50", event_start_at: "2026-08-20T09:00:00Z", event_end_at: "2026-08-20T15:00:00Z", budget_cents: 500000 }, as: CommunityEngagementManager, captures: { ev1: $.data.id } }
            - { call: "GET /service-events/${ev1}", payload: {}, as: Any, captures: { ev_v: $.data.version } }
          trigger:
            - { call: "POST /service-events/${ev1}/reschedule", payload: { event_start_at: "2026-08-25T09:00:00Z", event_end_at: "2026-08-25T15:00:00Z", expected_event_version: "${ev_v}" }, as: CommunityEngagementManager, captures: { new_start: $.data.event_start_at, new_v: $.data.version } }
            - { call: "POST /service-events/${ev1}/reschedule", payload: { event_start_at: "2026-08-26T09:00:00Z", event_end_at: "2026-08-26T15:00:00Z", expected_event_version: "${ev_v}" }, as: CommunityEngagementManager, captures: { err: $.data.error_id } }
          assert:
            - "first reschedule: event_start_at == 2026-08-25T09:00:00Z and version == 2"
            - "replay with stale version: error_id == ERR_STALE_EVENT_VERSION (412); window unchanged"

      - name: event_cancel_full_compensation_cascade
        claim_type: cascading_side_effects
        grounds: [state_machines.ServiceEvent.PLANNING_to_CANCELLED, calculations.event_spend_position, state_machines.ServiceProject.MATCHED_to_VETTED]
        distinguishing_aspect: "Cancel from REGISTRATION_OPEN compensates every attached pipeline in one request: registration CANCELLED, APPROVED order CANCELLED (RECEIVED one kept as sunk cost), BOOKED manifest CANCELLED, ORDERED meal CANCELLED, COMMITTED sponsorship WITHDRAWN, LOCKED project back to VETTED with event_id null, supervision WITHDRAWN; projected_spend falls to the RECEIVED order's 1088."
        test_recipe:
          setup: ["minimal READY event (volunteer CONFIRMED, lead ACTIVE, project LOCKED) plus: ord1 RECEIVED (1088), ord2 APPROVED (109), manifest BOOKED (5000), meal ORDERED, sponsorship COMMITTED"]
          setup_api_calls:
            - { call: "POST /nonprofit-partners", payload: { name: "River Guild", contact_email: "ops@river.org" }, as: CommunityEngagementManager, captures: { np1: $.data.id } }
            - { call: "POST /service-projects", payload: { nonprofit_id: "${np1}", title: "Trail Repair", min_volunteers: 1, max_volunteers: 10 }, as: NonprofitCoordinator, as_user_id: "${np1}", captures: { proj1: $.data.id } }
            - { call: "POST /service-events", payload: { name: "Day 51", event_start_at: "2026-08-20T09:00:00Z", event_end_at: "2026-08-20T15:00:00Z", budget_cents: 500000 }, as: CommunityEngagementManager, captures: { ev1: $.data.id } }
            - { call: "POST /service-projects/${proj1}/vet", payload: {}, as: CommunityEngagementManager }
            - { call: "POST /service-projects/${proj1}/match", payload: { event_id: "${ev1}" }, as: CommunityEngagementManager }
            - { call: "POST /service-events/${ev1}/open-registration", payload: {}, as: CommunityEngagementManager }
            - { call: "POST /employee-volunteers", payload: { full_name: "Vol One", email: "v1@corp.com", department: "Eng", date_of_birth: "1990-01-01" }, as: CommunityEngagementManager, captures: { vol1: $.data.id } }
            - { call: "POST /employee-volunteers", payload: { full_name: "Lead One", email: "lead1@corp.com", department: "Ops", date_of_birth: "1985-03-03", is_staff_lead: true }, as: CommunityEngagementManager, captures: { lead1: $.data.id } }
            - { call: "POST /registrations", payload: { event_id: "${ev1}", project_id: "${proj1}" }, as: EmployeeVolunteer, as_user_id: "${vol1}", captures: { reg1: $.data.id } }
            - { call: "POST /registrations/${reg1}/sign-waiver", payload: { signer_name: "Vol One", signer_relation: "SELF", media_consent: false }, as: EmployeeVolunteer, as_user_id: "${vol1}" }
            - { call: "POST /registrations/${reg1}/confirm", payload: {}, as: CommunityEngagementManager }
            - { call: "POST /supervision-assignments", payload: { project_id: "${proj1}", lead_volunteer_id: "${lead1}" }, as: CommunityEngagementManager, captures: { sup1: $.data.id } }
            - { call: "POST /procurement-orders", payload: { event_id: "${ev1}", project_id: "${proj1}", lines: [ { item_name: "Gloves", quantity: 2, unit_cost_cents: 500 } ] }, as: CommunityEngagementManager, as_user_id: "cem-1", captures: { ord1: $.data.id } }
            - { call: "POST /procurement-orders/${ord1}/submit", payload: {}, as: CommunityEngagementManager }
            - { call: "POST /procurement-orders/${ord1}/approve", payload: {}, as: ProcurementOfficer, as_user_id: "po-1" }
            - { call: "POST /procurement-orders/${ord1}/receive", payload: {}, as: CommunityEngagementManager }
            - { call: "POST /service-projects/${proj1}/lock", payload: {}, as: CommunityEngagementManager }
            - { call: "POST /procurement-orders", payload: { event_id: "${ev1}", project_id: "${proj1}", lines: [ { item_name: "Cones", quantity: 1, unit_cost_cents: 100 } ] }, as: CommunityEngagementManager, as_user_id: "cem-1", captures: { ord2: $.data.id } }
            - { call: "POST /procurement-orders/${ord2}/submit", payload: {}, as: CommunityEngagementManager }
            - { call: "POST /procurement-orders/${ord2}/approve", payload: {}, as: ProcurementOfficer, as_user_id: "po-1" }
            - { call: "POST /vehicles", payload: { name: "Bus-7", seat_capacity: 40 }, as: LogisticsCoordinator, captures: { veh1: $.data.id } }
            - { call: "POST /transport-manifests", payload: { event_id: "${ev1}", vehicle_id: "${veh1}", depart_at: "2026-08-20T08:00:00Z", return_at: "2026-08-20T10:00:00Z", cost_cents: 5000 }, as: LogisticsCoordinator, captures: { man1: $.data.id } }
            - { call: "GET /service-events/${ev1}", payload: {}, as: Any, captures: { ev_v: $.data.version } }
            - { call: "POST /service-events/${ev1}/meal-plans", payload: { vendor_name: "FreshCo", per_person_cost_cents: 1000, expected_event_version: "${ev_v}" }, as: LogisticsCoordinator, captures: { mp1: $.data.id } }
            - { call: "POST /meal-plans/${mp1}/order", payload: {}, as: LogisticsCoordinator }
            - { call: "POST /sponsorships", payload: { event_id: "${ev1}", sponsor_name: "CorpCo", match_type: "FLAT", rate_cents: 5000, pledge_cap_cents: 9000 }, as: FinanceController, captures: { sp1: $.data.id } }
            - { call: "POST /sponsorships/${sp1}/commit", payload: {}, as: FinanceController }
          trigger:
            - { call: "POST /service-events/${ev1}/cancel", payload: {}, as: CommunityEngagementManager, captures: { ev_status: $.data.status } }
            - { call: "GET /registrations/${reg1}", payload: {}, as: Any, captures: { reg_status: $.data.rsvp_status } }
            - { call: "GET /procurement-orders/${ord2}", payload: {}, as: Any, captures: { ord2_status: $.data.status } }
            - { call: "GET /procurement-orders/${ord1}", payload: {}, as: Any, captures: { ord1_status: $.data.status } }
            - { call: "GET /transport-manifests/${man1}", payload: {}, as: Any, captures: { man_status: $.data.status } }
            - { call: "GET /meal-plans/${mp1}", payload: {}, as: Any, captures: { mp_status: $.data.status } }
            - { call: "GET /sponsorships/${sp1}", payload: {}, as: Any, captures: { sp_status: $.data.status } }
            - { call: "GET /service-projects/${proj1}", payload: {}, as: Any, captures: { proj_status: $.data.status, proj_event: $.data.event_id } }
            - { call: "GET /supervision-assignments/${sup1}", payload: {}, as: Any, captures: { sup_status: $.data.status } }
            - { call: "GET /service-events/${ev1}", payload: {}, as: Any, captures: { proj_spend: $.data.projected_spend_cents } }
          assert:
            - "event CANCELLED; registration CANCELLED; supervision WITHDRAWN"
            - "ord2 (APPROVED) -> CANCELLED; ord1 (RECEIVED) stays RECEIVED"
            - "manifest CANCELLED; meal plan CANCELLED; sponsorship WITHDRAWN"
            - "project back to VETTED with event_id == null"
            - "projected_spend_cents == 1088 (only the RECEIVED sunk-cost order remains)"

      - name: dual_variant_layer_covered
        claim_type: dual_variant_calculation
        grounds: [complexity_profile]
        excluded_because:
          difficulty_instance: volunteer_hours_scheduled_vs_verified_divergence
          rationale: "Both dual-variant pairs (sponsorship money, volunteer hours) are §1.8 rule-1 instances."

