            - { call: "POST /patients", payload: { state_policy_id: "${pol_ca}", email: "ovr@x.test", full_name: "Ovr One", age_years: 70 }, as: CareOpsAgent, captures: { pat_ov: "$.data.id" } }
            - { call: "POST /patients/${pat_ov}/screening-sessions", payload: {}, as: Patient, as_user_id: "${pat_ov}", captures: { scr_ov: "$.data.id" } }
