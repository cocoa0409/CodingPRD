              as: StateAuditor
              as_user_id: "auditor-find-01"
          assert:
            - "the second waiver of ${fid2} returns 409 with data.error_id == ERR_FINDING_NOT_OPEN"
            - "the unknown finding id returns 404 with data.error_id == ERR_FINDING_NOT_FOUND"
            - "ValidationFinding.${fid2}.status is still WAIVED and its detail carries only the first waiver_note"
            - "QuarterlySubmission.${sub}.open_fatal_finding_count == 0 and its version is unchanged by either refused call"

  - section: errors
