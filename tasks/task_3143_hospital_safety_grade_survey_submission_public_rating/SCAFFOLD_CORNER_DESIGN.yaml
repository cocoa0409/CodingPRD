# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests) — task_3143
#
# Breadth probe over §1.1–§1.7 that SCAFFOLD_DIFFICULTY_DESIGN.yaml does not
# already exercise. Shared chain anchors (document-scoped):
#   c_clock    logical clock -> 2026-06-01T00:00:00Z
#   c_meth_b0  three-measure baseline methodology (M_B0)
#   c_meth_mg  four-measure methodology (M_MG)
#   c_hp0      hospital P0                      -> p0_id, p0_v0
#   c_hp1      hospital P1                      -> p1_id, p1_v0
#   c_pin_b0   pin P0 to M_B0
#   c_rc_b0    release cycle bound to M_B0      -> rc_b0_id
#   c_survey_p0 P0 survey: create, one measure, submit, verify, refresh
#                                             -> sp0_id, p0_v1
#   c_score_p0 P0 score run on M_B0            -> run_p0_id, p0_v2
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: hospital_create_returns_every_declared_field_and_initial_defaults
        claim_type: Creation
        grounds:
          - entities.Hospital
          - endpoints.POST_/hospital-safety-rating/hospitals
        distinguishing_aspect: "A hospital created with only the seven declared inputs comes back 201 with status ACTIVE, disclosure_status NEVER_SUBMITTED, worst_grade_ever null, submitted_source_document_count 0, active_methodology_version_id null and version 1 — none of which the client supplied."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z. Empty database."
          setup_api_calls:
            - &c_clock
              call: "POST /hospital-safety-rating/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: RatingAdmin
          trigger:
            - call: "POST /hospital-safety-rating/hospitals"
              payload: { name: "C0 Community Hospital", ccn: "261000", state_code: "MO", bed_count: 40, teaching_status: "NON_TEACHING", annual_discharges: 500, survey_contact_email: "c0@example.org" }
              as: RatingAdmin
              captures: { h_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "Hospital.${h_id}.status == ACTIVE and Hospital.${h_id}.version == 1"
            - "Hospital.${h_id}.disclosure_status == NEVER_SUBMITTED and Hospital.${h_id}.submitted_source_document_count == 0"
            - "Hospital.${h_id}.worst_grade_ever is null and Hospital.${h_id}.active_methodology_version_id is null"
            - "the response carries non-null id, created_at and updated_at"
            - "meta.api_request_id and meta.api_request_timestamp are present on the response"

      - name: hospital_get_with_unknown_id_returns_hospital_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/hospital-safety-rating/hospitals/{id}
          - errors.ERR_HOSPITAL_NOT_FOUND
          - validations[priority=4]
        distinguishing_aspect: "A syntactically valid but unallocated id on a path segment produces the entity-specific 404 ERR_HOSPITAL_NOT_FOUND, not a generic ERR_NOT_FOUND and not a 400."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z. No hospital has been created."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "GET /hospital-safety-rating/hospitals/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: AnyAuthenticated
              as_user_id: "pa-lin"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_HOSPITAL_NOT_FOUND"
            - "response_type is error and data carries both error_id and message"

      - name: duplicate_ccn_returns_conflict
        claim_type: Type Constraints
        grounds:
          - entities.Hospital.fields.ccn
          - errors.ERR_DUPLICATE_CCN
          - endpoints.POST_/hospital-safety-rating/hospitals
        distinguishing_aspect: "ccn is unique across all hospitals, so a second registration reusing a live ccn is a 409 ERR_DUPLICATE_CCN rather than a silently created second row."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z. Hospital C0 already holds ccn 261000."
          setup_api_calls:
            - *c_clock
            - &c_hp0
              call: "POST /hospital-safety-rating/hospitals"
              payload: { name: "C0 Community Hospital", ccn: "261000", state_code: "MO", bed_count: 40, teaching_status: "NON_TEACHING", annual_discharges: 500, survey_contact_email: "c0@example.org" }
              as: RatingAdmin
              captures: { p0_id: $.data.id, p0_v0: $.data.version }
          trigger:
            - call: "POST /hospital-safety-rating/hospitals"
              payload: { name: "C0 Rival Hospital", ccn: "261000", state_code: "KS", bed_count: 60, teaching_status: "NON_TEACHING", annual_discharges: 700, survey_contact_email: "rival@example.org" }
              as: RatingAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_DUPLICATE_CCN"
            - "GET /hospital-safety-rating/hospitals?state_code=KS returns 0 rows"

      - name: survey_create_pins_methodology_and_starts_awaiting_submission
        claim_type: Creation
        grounds:
          - entities.Survey.fields.methodology_version_id
          - entities.Survey.fields.af_status
          - endpoints.POST_/hospital-safety-rating/hospitals/{id}/surveys
        distinguishing_aspect: "A survey captures the hospital's pinned methodology version at creation and starts in AWAITING_SUBMISSION/UNCERTIFIED, with verification_cycle 0 and verification_response null."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z. Hospital P0 is pinned to M_B0."
          setup_api_calls:
            - *c_clock
            - &c_meth_b0
              call: "POST /hospital-safety-rating/methodology-versions"
              payload:
                label: "Baseline Methodology"
                publication_date: "2026-05-01T00:00:00Z"
                measure_definitions:
                  - { measure_code: "o1", domain: "PATIENT_SAFETY", scale_factor: 1.0, weight: 1.00, multiplier: 1.00, peer_mean: 50.00, peer_sd: 10.00, higher_is_better: true, derivation_rule: "NONE" }
                  - { measure_code: "o2", domain: "CPOE", scale_factor: 1.0, weight: 1.00, multiplier: 1.00, peer_mean: 50.00, peer_sd: 10.00, higher_is_better: true, derivation_rule: "NONE" }
                  - { measure_code: "o3", domain: "STAFFING", scale_factor: 1.0, weight: 1.00, multiplier: 1.00, peer_mean: 50.00, peer_sd: 10.00, higher_is_better: true, derivation_rule: "NONE" }
              as: RatingAdmin
              captures: { meth_b0_id: $.data.id }
            - &c_meth_mg
              call: "POST /hospital-safety-rating/methodology-versions"
              payload:
                label: "Measure-Grade Methodology"
                publication_date: "2026-05-01T00:00:00Z"
                measure_definitions:
                  - { measure_code: "o1", domain: "PATIENT_SAFETY", scale_factor: 1.0, weight: 0.50, multiplier: 1.00, peer_mean: 50.00, peer_sd: 10.00, higher_is_better: true, derivation_rule: "NONE" }
                  - { measure_code: "o2", domain: "CPOE", scale_factor: 1.0, weight: 0.30, multiplier: 1.00, peer_mean: 50.00, peer_sd: 10.00, higher_is_better: true, derivation_rule: "NONE" }
                  - { measure_code: "o3", domain: "STAFFING", scale_factor: 1.0, weight: 0.20, multiplier: 1.00, peer_mean: 50.00, peer_sd: 10.00, higher_is_better: true, derivation_rule: "NONE" }
                  - { measure_code: "o4", domain: "SURGICAL_VOLUME", scale_factor: 1.0, weight: 0.10, multiplier: 1.00, peer_mean: 50.00, peer_sd: 10.00, higher_is_better: true, derivation_rule: "NONE" }
              as: RatingAdmin
              captures: { meth_mg_id: $.data.id }
            - *c_hp0
            - &c_pin_b0
              call: "POST /hospital-safety-rating/hospitals/${p0_id}/methodology-versions"
              payload: { methodology_version_id: "${meth_b0_id}" }
              as: RatingAdmin
            - &c_hp1
              call: "POST /hospital-safety-rating/hospitals"
              payload: { name: "C1 Community Hospital", ccn: "261001", state_code: "MO", bed_count: 40, teaching_status: "NON_TEACHING", annual_discharges: 500, survey_contact_email: "c1@example.org" }
              as: RatingAdmin
              captures: { p1_id: $.data.id, p1_v0: $.data.version }
            - &c_rc_b0
              call: "POST /hospital-safety-rating/release-cycles"
              payload: { label: "Baseline Grades", methodology_version_id: "${meth_b0_id}", preliminary_release_date: "2026-06-01T00:00:00Z", correction_window_ends_at: "2026-06-30T00:00:00Z", publication_date: "2026-07-15T00:00:00Z" }
              as: RatingAdmin
              captures: { rc_b0_id: $.data.id }
          trigger:
            - call: "POST /hospital-safety-rating/hospitals/${p0_id}/surveys"
              payload: { started_survey_count: 800, completed_survey_count: 600, entity_annual_discharges: 1000, validation_method: "SOURCE_DOCUMENT" }
              as: HospitalRespondent
              as_user_id: "${p0_id}"
              captures: { sp0_id: $.data.id }
          assert:
            - "the response status is 201"
            - "Survey.${sp0_id}.methodology_version_id == ${meth_b0_id}"
            - "Survey.${sp0_id}.af_status == AWAITING_SUBMISSION and Survey.${sp0_id}.af_certification_level == UNCERTIFIED"
            - "Survey.${sp0_id}.verification_cycle == 0 and Survey.${sp0_id}.verification_response is null"
            - "Survey.${sp0_id}.submitted_by_user_id == ${p0_id} and Survey.${sp0_id}.reliability_weight is null"

      - name: survey_measure_extra_field_measure_status_is_ignored_input
        claim_type: System Fields
        grounds:
          - entities.SurveyMeasure.fields.measure_status
          - endpoints.POST_/hospital-safety-rating/hospitals/{id}/survey-measures
        distinguishing_aspect: "measure_status is source: system with initial state REPORTED; a client that sends measure_status PUBLIC_SOURCE_SUBSTITUTED is ignored, and version stays 1 regardless of any supplied version."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z. Hospital P0 is pinned to M_B0 and holds a survey."
          setup_api_calls:
            - *c_clock
            - *c_meth_b0
            - *c_meth_mg
            - *c_hp0
            - *c_pin_b0
            - *c_hp1
            - *c_rc_b0
            - call: "POST /hospital-safety-rating/hospitals/${p0_id}/surveys"
              payload: { started_survey_count: 800, completed_survey_count: 600, entity_annual_discharges: 1000, validation_method: "SOURCE_DOCUMENT" }
              as: HospitalRespondent
              as_user_id: "${p0_id}"
              captures: { sp0_id: $.data.id }
          trigger:
            - call: "POST /hospital-safety-rating/hospitals/${p0_id}/survey-measures"
              payload: { survey_id: "${sp0_id}", measure_code: "o1", raw_value: 70.0, source_program_id: "CMS_HOSPITAL_COMPARE", measure_status: "PUBLIC_SOURCE_SUBSTITUTED", version: 99 }
              as: HospitalRespondent
              as_user_id: "${p0_id}"
              captures: { m0_id: $.data.id }
          assert:
            - "the response status is 201"
            - "SurveyMeasure.${m0_id}.measure_status == REPORTED"
            - "SurveyMeasure.${m0_id}.version == 1"
            - "SurveyMeasure.${m0_id}.derived_value == 70.0, the NONE derivation rule passing the raw value through"
            - "GET /hospital-safety-rating/hospitals/${p0_id}/survey-measures?measure_status=REPORTED returns exactly 1 row"

      - name: survey_measure_create_missing_raw_value_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.SurveyMeasure.fields.raw_value
          - validations[priority=18]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "raw_value is a required input with no default, so omitting it is a 400 ERR_INVALID_REQUEST from the required-field tier — it is not a 404 and not a 409."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z. Hospital P0 is pinned to M_B0 and holds a survey."
          setup_api_calls:
            - *c_clock
            - *c_meth_b0
            - *c_meth_mg
            - *c_hp0
            - *c_pin_b0
            - *c_hp1
            - *c_rc_b0
            - call: "POST /hospital-safety-rating/hospitals/${p0_id}/surveys"
              payload: { started_survey_count: 800, completed_survey_count: 600, entity_annual_discharges: 1000, validation_method: "SOURCE_DOCUMENT" }
              as: HospitalRespondent
              as_user_id: "${p0_id}"
              captures: { sp0_id: $.data.id }
          trigger:
            - call: "POST /hospital-safety-rating/hospitals/${p0_id}/survey-measures"
              payload: { survey_id: "${sp0_id}", measure_code: "o1" }
              as: HospitalRespondent
              as_user_id: "${p0_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "error_id != ERR_SURVEY_NOT_FOUND, even though the survey id is valid"
            - "GET /hospital-safety-rating/hospitals/${p0_id}/survey-measures returns 0 rows"

      - name: hospitals_list_paginates_and_reports_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/hospital-safety-rating/hospitals
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three hospitals on file, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true, and offset=2 returns the remaining row with has_more false — total_count counts the whole filtered set, not the page."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z. Three hospitals exist across two states."
          setup_api_calls:
            - *c_clock
            - *c_meth_b0
            - *c_meth_mg
            - *c_hp0
            - *c_pin_b0
            - *c_hp1
            - *c_rc_b0
            - call: "POST /hospital-safety-rating/hospitals"
              payload: { name: "C2 Community Hospital", ccn: "261002", state_code: "KS", bed_count: 40, teaching_status: "TEACHING", annual_discharges: 500, survey_contact_email: "c2@example.org" }
              as: RatingAdmin
              captures: { p2_id: $.data.id }
          trigger:
            - call: "GET /hospital-safety-rating/hospitals"
              payload: { limit: 2, offset: 0 }
              as: AnyAuthenticated
              as_user_id: "pa-lin"
              captures: { page1: "$.data[0].id" }
          assert:
            - "the response status is 200 and response_type is array"
            - "the first page returns exactly 2 rows with total_count == 3 and has_more == true"
            - "GET /hospital-safety-rating/hospitals?limit=2&offset=2 returns exactly 1 row with total_count == 3 and has_more == false"
            - "GET /hospital-safety-rating/hospitals?state_code=KS returns exactly 1 row, the C2 hospital"
            - "GET /hospital-safety-rating/hospitals with no query parameters returns 3 rows, limit defaulting to 10 and offset to 0"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: submit_already_submitted_survey_returns_survey_already_submitted
        claim_type: invalid_transition
        grounds:
          - state_machines.Survey.AWAITING_SUBMISSION_to_SUBMITTED
          - errors.ERR_SURVEY_ALREADY_SUBMITTED
        distinguishing_aspect: "A survey already in SUBMITTED rejects a second submit with 409 ERR_SURVEY_ALREADY_SUBMITTED and fires no side effects, so disclosure_status and version are unchanged by the refused call."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z. Hospital P0 holds a SUBMITTED survey."
          setup_api_calls:
            - *c_clock
            - *c_meth_b0
            - *c_meth_mg
            - *c_hp0
            - *c_pin_b0
            - *c_hp1
            - *c_rc_b0
            - call: "POST /hospital-safety-rating/hospitals/${p0_id}/surveys"
              payload: { started_survey_count: 800, completed_survey_count: 600, entity_annual_discharges: 1000, validation_method: "SOURCE_DOCUMENT" }
              as: HospitalRespondent
              as_user_id: "${p0_id}"
              captures: { sp0_id: $.data.id }
            - call: "POST /hospital-safety-rating/hospitals/${p0_id}/survey-measures"
              payload: { survey_id: "${sp0_id}", measure_code: "o1", raw_value: 70.0, source_program_id: "CMS_HOSPITAL_COMPARE" }
              as: HospitalRespondent
              as_user_id: "${p0_id}"
            - call: "POST /hospital-safety-rating/surveys/${sp0_id}/submit"
              payload: {}
              as: HospitalRespondent
              as_user_id: "${p0_id}"
              captures: { p0_v1: $.data.version }
          trigger:
            - call: "POST /hospital-safety-rating/surveys/${sp0_id}/submit"
              payload: {}
              as: HospitalRespondent
              as_user_id: "${p0_id}"
              captures: { error_id: $.data.error_id }
            - call: "GET /hospital-safety-rating/hospitals/${p0_id}"
              payload: {}
              as: AnyAuthenticated
              as_user_id: "pa-lin"
              captures: { h_version: $.data.version }
          assert:
            - "the response status is 409 and error_id == ERR_SURVEY_ALREADY_SUBMITTED"
            - "Hospital.${p0_id}.version == ${p0_v1}, so the refused submit fired no cascade"
            - "Survey.${sp0_id}.af_status is still SUBMITTED"
            - "Hospital.${p0_id}.disclosure_status is still SUBMITTED"

      - name: verify_own_survey_returns_self_verification_forbidden
        claim_type: precondition_violation
        grounds:
          - validations[priority=5]
          - errors.ERR_SELF_VERIFICATION_FORBIDDEN
          - state_machines.Survey.SUBMITTED_to_VERIFIED
        distinguishing_aspect: "The segregation-of-duties gate compares the verifying X-User-ID against survey.submitted_by_user_id, so the hospital that submitted its own survey is refused at priority 5 with 403 even though every state precondition holds."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z. Hospital P0 submitted its own survey and every measure carries a source program."
          setup_api_calls:
            - *c_clock
            - *c_meth_b0
            - *c_meth_mg
            - *c_hp0
            - *c_pin_b0
            - *c_hp1
            - *c_rc_b0
            - call: "POST /hospital-safety-rating/hospitals/${p0_id}/surveys"
              payload: { started_survey_count: 800, completed_survey_count: 600, entity_annual_discharges: 1000, validation_method: "SOURCE_DOCUMENT" }
              as: HospitalRespondent
              as_user_id: "${p0_id}"
              captures: { sp0_id: $.data.id }
            - call: "POST /hospital-safety-rating/hospitals/${p0_id}/survey-measures"
              payload: { survey_id: "${sp0_id}", measure_code: "o1", raw_value: 70.0, source_program_id: "CMS_HOSPITAL_COMPARE" }
              as: HospitalRespondent
              as_user_id: "${p0_id}"
            - call: "POST /hospital-safety-rating/surveys/${sp0_id}/submit"
              payload: {}
              as: HospitalRespondent
              as_user_id: "${p0_id}"
          trigger:
            - call: "POST /hospital-safety-rating/surveys/${sp0_id}/verify"
              payload: { verification_response: "ACCEPT" }
              as: VerificationAnalyst
              as_user_id: "${p0_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_SELF_VERIFICATION_FORBIDDEN"
            - "error_id != ERR_SURVEY_VERIFICATION_ALREADY_OPEN"
            - "Survey.${sp0_id}.af_status is still SUBMITTED and Survey.${sp0_id}.reliability_weight is null"
            - "a verify with a different X-User-ID succeeds and returns af_status VERIFIED"

      - name: publish_before_publication_date_returns_embargo_active
        claim_type: precondition_violation
        grounds:
          - validations[priority=10]
          - errors.ERR_EMBARGO_ACTIVE
          - state_machines.ReleaseCycle.EMBARGOED_to_PUBLISHED
        distinguishing_aspect: "The publish gate compares the logical clock against publication_date with >=, so a publish one second early is refused with 409 ERR_EMBARGO_ACTIVE while a publish at the exact instant succeeds."
        test_recipe:
          setup:
            - "Logical clock at 2026-07-14T23:59:59Z. Cycle C_B0 is EMBARGOED with one resolved grade; publication_date is 2026-07-15T00:00:00Z."
          setup_api_calls:
            - *c_clock
            - *c_meth_b0
            - *c_meth_mg
            - *c_hp0
            - *c_pin_b0
            - *c_hp1
            - *c_rc_b0
            - call: "POST /hospital-safety-rating/hospitals/${p0_id}/surveys"
              payload: { started_survey_count: 800, completed_survey_count: 600, entity_annual_discharges: 1000, validation_method: "SOURCE_DOCUMENT" }
              as: HospitalRespondent
              as_user_id: "${p0_id}"
              captures: { sp0_id: $.data.id }
            - call: "POST /hospital-safety-rating/hospitals/${p0_id}/survey-measures"
              payload: { survey_id: "${sp0_id}", measure_code: "o1", raw_value: 60.0, source_program_id: "CMS_HOSPITAL_COMPARE" }
              as: HospitalRespondent
              as_user_id: "${p0_id}"
            - call: "POST /hospital-safety-rating/surveys/${sp0_id}/submit"
              payload: {}
              as: HospitalRespondent
              as_user_id: "${p0_id}"
            - call: "POST /hospital-safety-rating/surveys/${sp0_id}/verify"
              payload: { verification_response: "ACCEPT" }
              as: VerificationAnalyst
              as_user_id: "va-owen"
            - call: "POST /hospital-safety-rating/hospitals/${p0_id}/refresh-measures"
              payload: { expected_hospital_version: "${p0_v0}" }
              as: RatingEngine
              captures: { p0_v1: $.data.version }
            - call: "POST /hospital-safety-rating/hospitals/${p0_id}/score-runs"
              payload: { methodology_version_id: "${meth_b0_id}", release_cycle_id: "${rc_b0_id}", expected_hospital_version: "${p0_v1}" }
              as: RatingEngine
              captures: { run_p0_id: $.data.id, p0_v2: $.data.version }
            - call: "POST /hospital-safety-rating/release-cycles/${rc_b0_id}/open-review"
              payload: {}
              as: RatingEngine
            - call: "GET /hospital-safety-rating/hospitals/${p0_id}/reviews"
              payload: { release_cycle_id: "${rc_b0_id}" }
              as: AnyAuthenticated
              as_user_id: "va-owen"
              captures: { rev0_id: "$.data[0].id" }
            - call: "POST /hospital-safety-rating/hospitals/${p0_id}/preliminary-results/${rev0_id}/accept"
              payload: { expected_hospital_version: "${p0_v2}" }
              as: HospitalRespondent
              as_user_id: "${p0_id}"
            - call: "POST /hospital-safety-rating/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-14T23:59:59Z" }
              as: RatingAdmin
          trigger:
            - call: "POST /hospital-safety-rating/release-cycles/${rc_b0_id}/publish"
              payload: {}
              as: RatingEngine
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_EMBARGO_ACTIVE"
            - "getting the cycle shows state EMBARGOED and embargo_lifted false"
            - "after POST /_clock/set_current_utc to 2026-07-15T00:00:00Z the same publish returns 200"
            - "the published cycle reports embargo_lifted == true and state PUBLISHED"

      - name: verify_without_source_program_returns_source_documentation_required
        claim_type: precondition_violation
        grounds:
          - errors.ERR_SOURCE_DOCUMENTATION_REQUIRED
          - state_machines.Survey.SUBMITTED_to_VERIFIED
          - entities.SurveyMeasure.fields.source_program_id
