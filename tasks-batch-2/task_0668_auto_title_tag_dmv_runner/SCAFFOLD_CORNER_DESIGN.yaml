              as: IntakeClerk
              captures: { own_txn: $.data.id }
          trigger:
            - call: "POST /dmv/transactions/${own_txn}/cancel"
              payload: {}
              as: AccountHolder
              as_user_id: "${own_b}"
              captures: { own_err: $.data.error_id }
          assert:
            - "response status == 403 and error_id == ERR_NOT_RESOURCE_OWNER (X-User-ID == B, txn owned by A)"

