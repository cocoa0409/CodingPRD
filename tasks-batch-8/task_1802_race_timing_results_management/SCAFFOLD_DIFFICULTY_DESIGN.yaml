          trigger:
            - { call: "POST /race-timing/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:29:59Z" }, as: RegistrationClerk }
            - call: "POST /race-timing/protests"
              payload: { race_id: "${race_id}", registration_id: "${reg1}", timing_read_id: "${read_f}", requested_action: EXCLUDE_READ, reason: "late by one second is still open" }
              as: RegistrationClerk
              as_user_id: "clerk-1"
              captures: { protest1: $.data.id }
            - { call: "POST /race-timing/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:30:00Z" }, as: RegistrationClerk }
            - call: "POST /race-timing/protests"
              payload: { race_id: "${race_id}", registration_id: "${reg1}", timing_read_id: "${read_f}", requested_action: EXCLUDE_READ, reason: "exactly at close" }
              as: RegistrationClerk
              as_user_id: "clerk-1"
              captures: { err: $.data.error_id }
            - { call: "POST /race-timing/protests/${protest1}/resolve", payload: { outcome: DISMISSED }, as: RaceOfficial, as_user_id: "official-1" }
            - { call: "POST /race-timing/races/${race_id}/finalize-results", as: RaceDirector }
          assert:
            - "Protest 1 created FILED at 09:29:59 (strictly before closes_at 09:30:00)"
            - "Protest 2 at exactly 09:30:00 rejected: error_id == ERR_PROTEST_WINDOW_CLOSED"
            - "Race.protest_window_closes_at == 2026-08-01T09:30:00Z (published 09:00:00 + 30min)"
            - "Finalize at exactly 09:30:00 succeeds (inclusive >=): Race.status == FINALIZED — complementary polarity to the filing boundary"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: assign_chip_gated_by_chip_status
        grounds:
          - state_machines.Registration.CONFIRMED_to_CHECKED_IN
          - validations[priority=18]
          - state_machines.Chip.AVAILABLE_to_ASSIGNED
        distinguishing_aspect: |
          Pair Registration -> Chip: CHECKED_IN transition is gated on the Chip
          aggregate's state — an ASSIGNED chip rejects with
          ERR_CHIP_NOT_AVAILABLE; and the registration's own lifecycle gates
          (REGISTERED without payment cannot check in even with an AVAILABLE
          chip -> ERR_INVALID_STATE).
        test_recipe:
          setup:
            - "Race TIMING_LOCKED; chip X ASSIGNED to G1 (CHECKED_IN); G2 CONFIRMED; G3 REGISTERED/UNPAID; chip Y AVAILABLE"
          setup_api_calls:
            - { call: "POST /race-timing/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T06:00:00Z" }, as: RaceDirector }
            - call: "POST /race-timing/races"
              payload: { name: "Gate 5K", race_date: "2026-08-01T00:00:00Z", distance_km: 5.0, course_type: UNCERTIFIED_COURSE, course_time_limit_minutes: 90 }
              as: RaceDirector
              captures: { race_id: $.data.id }
            - { call: "POST /race-timing/races/${race_id}/open-registration", as: RaceDirector }
            - call: "POST /race-timing/timing-points"
              payload: { race_id: "${race_id}", point_index: 1, kind: START, distance_km: 0.0, device_id: "MAT-901", deploy_at: "2026-08-01T05:00:00Z", expected_teardown_at: "2026-08-01T12:00:00Z" }
              as: TimingOperator
              captures: { tp_start: $.data.id }
            - call: "POST /race-timing/timing-points"
              payload: { race_id: "${race_id}", point_index: 2, kind: FINISH, distance_km: 5.0, device_id: "MAT-902", deploy_at: "2026-08-01T05:00:00Z", expected_teardown_at: "2026-08-01T12:00:00Z" }
              as: TimingOperator
              captures: { tp_fin: $.data.id }
            - { call: "POST /race-timing/timing-points/${tp_start}/deploy", as: TimingOperator }
            - { call: "POST /race-timing/timing-points/${tp_fin}/deploy", as: TimingOperator }
            - call: "POST /race-timing/waves"
              payload: { race_id: "${race_id}", wave_index: 1, scheduled_start_time: "2026-08-01T07:00:00Z", max_capacity: 10 }
              as: RaceDirector
              captures: { wave1: $.data.id }
            - call: "POST /race-timing/chips"
              payload: { chip_code: "CHIP-X" }
              as: RegistrationClerk
              captures: { chip_x: $.data.id }
            - call: "POST /race-timing/chips"
              payload: { chip_code: "CHIP-Y" }
              as: RegistrationClerk
              captures: { chip_y: $.data.id }
            - call: "POST /race-timing/registrations"
              payload: { race_id: "${race_id}", wave_id: "${wave1}", bib_number: "411", participant_name: "G One", birth_date: "1990-01-01", gender: M }
              as: RegistrationClerk
              captures: { reg_g1: $.data.id }
            - { call: "POST /race-timing/registrations/${reg_g1}/pay", as: RegistrationClerk }
            - { call: "POST /race-timing/registrations/${reg_g1}/confirm", as: RegistrationClerk }
            - call: "POST /race-timing/registrations"
              payload: { race_id: "${race_id}", wave_id: "${wave1}", bib_number: "412", participant_name: "G Two", birth_date: "1990-01-01", gender: M }
              as: RegistrationClerk
              captures: { reg_g2: $.data.id }
            - { call: "POST /race-timing/registrations/${reg_g2}/pay", as: RegistrationClerk }
            - { call: "POST /race-timing/registrations/${reg_g2}/confirm", as: RegistrationClerk }
            - call: "POST /race-timing/registrations"
              payload: { race_id: "${race_id}", wave_id: "${wave1}", bib_number: "413", participant_name: "G Three", birth_date: "1990-01-01", gender: M }
              as: RegistrationClerk
              captures: { reg_g3: $.data.id }
            - { call: "POST /race-timing/races/${race_id}/lock-timing", as: RaceDirector, as_user_id: "director-1" }
            - { call: "POST /race-timing/registrations/${reg_g1}/assign-chip", payload: { chip_id: "${chip_x}" }, as: RegistrationClerk }
          trigger:
            - { call: "POST /race-timing/registrations/${reg_g2}/assign-chip", payload: { chip_id: "${chip_x}" }, as: RegistrationClerk, captures: { err1: $.data.error_id } }
            - { call: "POST /race-timing/registrations/${reg_g3}/assign-chip", payload: { chip_id: "${chip_y}" }, as: RegistrationClerk, captures: { err2: $.data.error_id } }
            - { call: "POST /race-timing/registrations/${reg_g2}/assign-chip", payload: { chip_id: "${chip_y}" }, as: RegistrationClerk }
          assert:
            - "err1 == ERR_CHIP_NOT_AVAILABLE (Chip ASSIGNED blocks Registration transition)"
            - "err2 == ERR_INVALID_STATE (REGISTERED lifecycle blocks even with AVAILABLE chip)"
            - "Third call succeeds: Registration(reg_g2).lifecycle_status == CHECKED_IN; Chip(chip_y).status == ASSIGNED and current_registration_id == reg_g2"

      - name: lock_timing_gated_by_point_config
        grounds:
          - state_machines.Race.REGISTRATION_OPEN_to_TIMING_LOCKED
          - validations[priority=14]
          - entities.Race.fields.timing_config_fingerprint
        distinguishing_aspect: |
          Pair Race -> TimingPoint: TIMING_LOCKED transition is gated on the
          child collection's aggregate state — a PLANNED FINISH point rejects
          the lock with ERR_TIMING_CONFIG_INCOMPLETE; after deploying it, the
          lock succeeds and captures the config fingerprint.
        test_recipe:
          setup:
            - "Race REGISTRATION_OPEN with one wave; START DEPLOYED; FINISH still PLANNED"
          setup_api_calls:
            - { call: "POST /race-timing/_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: RaceDirector }
            - call: "POST /race-timing/races"
              payload: { name: "Lock Gate 5K", race_date: "2026-08-01T00:00:00Z", distance_km: 5.0, course_type: UNCERTIFIED_COURSE, course_time_limit_minutes: 90 }
              as: RaceDirector
              captures: { race_id: $.data.id }
            - { call: "POST /race-timing/races/${race_id}/open-registration", as: RaceDirector }
            - call: "POST /race-timing/timing-points"
              payload: { race_id: "${race_id}", point_index: 1, kind: START, distance_km: 0.0, device_id: "MAT-911", deploy_at: "2026-08-01T05:00:00Z", expected_teardown_at: "2026-08-01T12:00:00Z" }
              as: TimingOperator
              captures: { tp_start: $.data.id }
            - call: "POST /race-timing/timing-points"
              payload: { race_id: "${race_id}", point_index: 2, kind: FINISH, distance_km: 5.0, device_id: "MAT-912", deploy_at: "2026-08-01T05:00:00Z", expected_teardown_at: "2026-08-01T12:00:00Z" }
              as: TimingOperator
              captures: { tp_fin: $.data.id }
            - { call: "POST /race-timing/timing-points/${tp_start}/deploy", as: TimingOperator }
            - call: "POST /race-timing/waves"
              payload: { race_id: "${race_id}", wave_index: 1, scheduled_start_time: "2026-08-01T07:00:00Z", max_capacity: 10 }
              as: RaceDirector
              captures: { wave1: $.data.id }
          trigger:
            - { call: "POST /race-timing/races/${race_id}/lock-timing", as: RaceDirector, as_user_id: "director-1", captures: { err: $.data.error_id } }
            - { call: "POST /race-timing/timing-points/${tp_fin}/deploy", as: TimingOperator }
            - { call: "POST /race-timing/races/${race_id}/lock-timing", as: RaceDirector, as_user_id: "director-1", captures: { locked: $.data.status, fp: $.data.timing_config_fingerprint } }
          assert:
            - "First lock rejected: err == ERR_TIMING_CONFIG_INCOMPLETE (FINISH still PLANNED)"
            - "After deploy: lock succeeds, status == TIMING_LOCKED, timing_locked_at set, locked_by_user_id == 'director-1'"
            - "timing_config_fingerprint == '1:START:0.0,2:FINISH:5.0' (point_index:kind:distance_km, sorted by point_index)"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: wave_start_min_gap_buffer
        grounds:
          - validations[priority=10]
          - entities.Wave.fields.scheduled_start_time
        distinguishing_aspect: |
          Resource: race start timeline; semantics: point-with-minimum-gap
          buffer. A wave exactly 10 minutes after another is accepted (>=
          inclusive); 9 minutes is rejected ERR_WAVE_SPACING_VIOLATION.
        test_recipe:
          setup:
            - "Race with wave 1 at 07:00:00"
          setup_api_calls:
            - { call: "POST /race-timing/_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: RaceDirector }
            - call: "POST /race-timing/races"
              payload: { name: "Gap 5K", race_date: "2026-08-01T00:00:00Z", distance_km: 5.0, course_type: UNCERTIFIED_COURSE, course_time_limit_minutes: 90 }
              as: RaceDirector
              captures: { race_id: $.data.id }
            - call: "POST /race-timing/waves"
              payload: { race_id: "${race_id}", wave_index: 1, scheduled_start_time: "2026-08-01T07:00:00Z", max_capacity: 10 }
              as: RaceDirector
              captures: { wave1: $.data.id }
          trigger:
            - call: "POST /race-timing/waves"
              payload: { race_id: "${race_id}", wave_index: 2, scheduled_start_time: "2026-08-01T07:10:00Z", max_capacity: 10 }
              as: RaceDirector
              captures: { wave2: $.data.id }
            - call: "POST /race-timing/waves"
              payload: { race_id: "${race_id}", wave_index: 3, scheduled_start_time: "2026-08-01T07:19:00Z", max_capacity: 10 }
              as: RaceDirector
              captures: { err: $.data.error_id }
          assert:
            - "Wave 2 at exactly +10min created (equality satisfies the gap)"
            - "Wave 3 at +19min from wave 1 but only +9min from wave 2 rejected: err == ERR_WAVE_SPACING_VIOLATION"

      - name: device_window_half_open_adjacency
        grounds:
          - validations[priority=11]
          - entities.TimingPoint.fields.device_id
        distinguishing_aspect: |
          Resource: physical mat device; semantics: half-open interval overlap
          [deploy_at, teardown). Two TimingPoints sharing MAT-9 with windows
          [05:00, 08:00) and [08:00, 12:00) are adjacent and legal; a third at
          [07:59:59, 12:00) overlaps and is rejected ERR_DEVICE_WINDOW_OVERLAP.
          Different interval arithmetic than the wave min-gap buffer.
        test_recipe:
          setup:
            - "Race DRAFT; point P1 (START) on MAT-9 deployed [05:00,08:00)"
          setup_api_calls:
            - { call: "POST /race-timing/_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: RaceDirector }
            - call: "POST /race-timing/races"
              payload: { name: "Device 5K", race_date: "2026-08-01T00:00:00Z", distance_km: 5.0, course_type: UNCERTIFIED_COURSE, course_time_limit_minutes: 90 }
              as: RaceDirector
              captures: { race_id: $.data.id }
            - call: "POST /race-timing/timing-points"
              payload: { race_id: "${race_id}", point_index: 1, kind: START, distance_km: 0.0, device_id: "MAT-9", deploy_at: "2026-08-01T05:00:00Z", expected_teardown_at: "2026-08-01T08:00:00Z" }
              as: TimingOperator
              captures: { tp1: $.data.id }
          trigger:
            - call: "POST /race-timing/timing-points"
              payload: { race_id: "${race_id}", point_index: 2, kind: FINISH, distance_km: 5.0, device_id: "MAT-9", deploy_at: "2026-08-01T08:00:00Z", expected_teardown_at: "2026-08-01T12:00:00Z" }
              as: TimingOperator
              captures: { tp2: $.data.id }
            - call: "POST /race-timing/timing-points"
              payload: { race_id: "${race_id}", point_index: 3, kind: SPLIT, distance_km: 2.5, device_id: "MAT-9", deploy_at: "2026-08-01T07:59:59Z", expected_teardown_at: "2026-08-01T12:00:00Z" }
              as: TimingOperator
              captures: { err: $.data.error_id }
          assert:
            - "Adjacent window [08:00,12:00) after [05:00,08:00) accepted (teardown == deploy is not overlap)"
            - "Overlapping window [07:59:59,12:00) rejected: err == ERR_DEVICE_WINDOW_OVERLAP"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: chip_fleet_conservation
        grounds:
          - state_machines.Chip.AVAILABLE_to_ASSIGNED
          - state_machines.Chip.ASSIGNED_to_AVAILABLE
          - entities.Chip.fields.status
        distinguishing_aspect: |
          Conserved quantity: fleet-wide count of AVAILABLE chips. The pairing
          assign-chip (AVAILABLE -> ASSIGNED) then deassign RETURNED
          (ASSIGNED -> AVAILABLE) leaves |{chips: status == AVAILABLE}|
          unchanged (2 -> 1 -> 2), and the registration's chip_id round-trips
          to null while lifecycle stays CHECKED_IN.
        test_recipe:
          setup:
            - "Race TIMING_LOCKED; chips X and Y AVAILABLE (fleet count 2); G1 CONFIRMED"
          setup_api_calls:
            - { call: "POST /race-timing/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T06:00:00Z" }, as: RaceDirector }
            - call: "POST /race-timing/races"
              payload: { name: "Conserve 5K", race_date: "2026-08-01T00:00:00Z", distance_km: 5.0, course_type: UNCERTIFIED_COURSE, course_time_limit_minutes: 90 }
              as: RaceDirector
              captures: { race_id: $.data.id }
            - { call: "POST /race-timing/races/${race_id}/open-registration", as: RaceDirector }
            - call: "POST /race-timing/timing-points"
              payload: { race_id: "${race_id}", point_index: 1, kind: START, distance_km: 0.0, device_id: "MAT-A1", deploy_at: "2026-08-01T05:00:00Z", expected_teardown_at: "2026-08-01T12:00:00Z" }
              as: TimingOperator
              captures: { tp_start: $.data.id }
            - call: "POST /race-timing/timing-points"
              payload: { race_id: "${race_id}", point_index: 2, kind: FINISH, distance_km: 5.0, device_id: "MAT-A2", deploy_at: "2026-08-01T05:00:00Z", expected_teardown_at: "2026-08-01T12:00:00Z" }
              as: TimingOperator
              captures: { tp_fin: $.data.id }
            - { call: "POST /race-timing/timing-points/${tp_start}/deploy", as: TimingOperator }
            - { call: "POST /race-timing/timing-points/${tp_fin}/deploy", as: TimingOperator }
            - call: "POST /race-timing/waves"
              payload: { race_id: "${race_id}", wave_index: 1, scheduled_start_time: "2026-08-01T07:00:00Z", max_capacity: 10 }
              as: RaceDirector
              captures: { wave1: $.data.id }
            - call: "POST /race-timing/chips"
              payload: { chip_code: "CHIP-CX" }
              as: RegistrationClerk
              captures: { chip_x: $.data.id }
            - call: "POST /race-timing/chips"
              payload: { chip_code: "CHIP-CY" }
              as: RegistrationClerk
              captures: { chip_y: $.data.id }
            - call: "POST /race-timing/registrations"
              payload: { race_id: "${race_id}", wave_id: "${wave1}", bib_number: "511", participant_name: "Conserve One", birth_date: "1990-01-01", gender: M }
              as: RegistrationClerk
              captures: { reg1: $.data.id }
            - { call: "POST /race-timing/registrations/${reg1}/pay", as: RegistrationClerk }
            - { call: "POST /race-timing/registrations/${reg1}/confirm", as: RegistrationClerk }
            - { call: "POST /race-timing/races/${race_id}/lock-timing", as: RaceDirector, as_user_id: "director-1" }
          trigger:
            - { call: "POST /race-timing/registrations/${reg1}/assign-chip", payload: { chip_id: "${chip_x}" }, as: RegistrationClerk }
            - { call: "GET /race-timing/chips", payload: { status: AVAILABLE }, as: RegistrationClerk }
            - { call: "POST /race-timing/chips/${chip_x}/deassign", payload: { disposition: RETURNED }, as: RegistrationClerk }
            - { call: "GET /race-timing/chips", payload: { status: AVAILABLE }, as: RegistrationClerk }
            - { call: "GET /race-timing/registrations/${reg1}", as: RegistrationClerk }
          assert:
            - "After assign: GET /chips?status=AVAILABLE total_count == 1 (2 -> 1)"
            - "After deassign RETURNED: GET /chips?status=AVAILABLE total_count == 2 (restored; assign+deassign pairing conserves the fleet)"
            - "Registration(reg1).chip_id == null and lifecycle_status == CHECKED_IN (RETURNED does not revert check-in)"
            - "Chip(chip_x).current_registration_id == null and status == AVAILABLE"

      - name: award_singleton_per_category_place
        grounds:
          - calculations.award_computation
          - state_machines.Award.CONFIRMED_to_REVOKED
          - state_machines.Award.PROJECTED_to_CONFIRMED
        distinguishing_aspect: |
          Conserved quantity: award cardinality — at most one non-REVOKED Award
          per (race, category, place), and after a full amendment cycle
          (correction -> re-publish -> re-finalize) the CONFIRMED count per
          category is exactly min(3, eligible) again: AG_M_35_39 == 2,
          OVERALL_M == 2, with exactly 2 REVOKED historical rows.
        test_recipe:
          setup:
            - "Two-wave 10km race (A chip 1920000/gun 1925000; B chip 1910000/gun 1940000) published, finalized"
            - "Correction adjusts B's finish +120s; amendment cycle run to re-finalize"
          setup_api_calls:
            - { call: "POST /race-timing/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T06:00:00Z" }, as: RaceDirector }
            - call: "POST /race-timing/races"
              payload: { name: "Award Conserve 10K", race_date: "2026-08-01T00:00:00Z", distance_km: 10.0, course_type: CERTIFIED_COURSE, course_time_limit_minutes: 120, qualifying_standard_ms: 1800000 }
              as: RaceDirector
              captures: { race_id: $.data.id }
            - { call: "POST /race-timing/races/${race_id}/open-registration", as: RaceDirector }
            - call: "POST /race-timing/timing-points"
              payload: { race_id: "${race_id}", point_index: 1, kind: START, distance_km: 0.0, device_id: "MAT-B1", deploy_at: "2026-08-01T05:00:00Z", expected_teardown_at: "2026-08-01T12:00:00Z" }
              as: TimingOperator
              captures: { tp_start: $.data.id }
            - call: "POST /race-timing/timing-points"
              payload: { race_id: "${race_id}", point_index: 2, kind: SPLIT, distance_km: 5.0, device_id: "MAT-B2", deploy_at: "2026-08-01T05:00:00Z", expected_teardown_at: "2026-08-01T12:00:00Z" }
              as: TimingOperator
