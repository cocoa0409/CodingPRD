# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Piano Manufacturing Apprenticeship & Concert Instrument Bank
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: create_wood_batch_applies_system_defaults
        claim_type: creation_defaults
        grounds: [entities.WoodBatch, state_machines.WoodBatch]
        distinguishing_aspect: "201 creation at the default logical clock stamps status DRYING, version 1, drying_started_at == 2026-09-01T00:00:00Z, conditioned_at null."
        test_recipe:
          setup: ["empty database; logical clock never set"]
          setup_api_calls:
            - { call: "POST /piano-works/wood-batches", payload: { species: MAPLE, moisture_content_pct: 14.2 }, as: WorkshopManager, captures: { wb: $.data.id, st: $.data.status, v: $.data.version } }
          trigger: []
          assert:
            - "response code 201; envelope response_type == object; meta.api_request_id present"
            - "captured status ${st} == DRYING; captured version ${v} == 1"
            - "WoodBatch.${wb}.drying_started_at == 2026-09-01T00:00:00Z and conditioned_at == null"
            - "serial/system fields are server-minted: id present and not client-supplied"

      - name: create_build_order_missing_required_wood_batch_id_returns_400
        claim_type: required_fields
        grounds: [entities.BuildOrder.fields.wood_batch_id, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Omitting the required FK field yields ERR_VALIDATION 400 before any state check runs."
        test_recipe:
          setup: ["no entities needed"]
          setup_api_calls: []
          trigger:
            - { call: "POST /piano-works/build-orders", payload: { model: MODEL_B }, as: WorkshopManager, captures: { err: $.data.error_id } }
          assert:
            - "captured error_id == ERR_VALIDATION with http 400"

      - name: get_build_order_not_found_returns_error_envelope
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", response_envelope]
        distinguishing_aspect: "Unknown uuid yields 404 ERR_NOT_FOUND inside the fixed error envelope (response_type error, data.error_id, data.message)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /piano-works/build-orders/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: WorkshopManager, captures: { err: $.data.error_id } }
          assert:
            - "captured error_id == ERR_NOT_FOUND with http 404"
            - "envelope response_type == error and data.message is a non-empty string"

      - name: list_build_orders_paginates_with_limit_and_offset
        claim_type: listing_pagination
        grounds: [response_envelope, "endpoints[GET /piano-works/build-orders]"]
        distinguishing_aspect: "limit=1 returns exactly 1 row with total_count 2 and has_more true; offset=1 returns the second row with has_more false."
        test_recipe:
          setup: ["two CONDITIONED batches and two MODEL_O build orders"]
          setup_api_calls:
            - { call: "POST /piano-works/wood-batches", payload: { species: MAPLE, moisture_content_pct: 12.0 }, as: WorkshopManager, captures: { wb1: $.data.id } }
            - { call: "POST /piano-works/wood-batches", payload: { species: BIRCH, moisture_content_pct: 11.0 }, as: WorkshopManager, captures: { wb2: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-04-29T00:00:00Z" }, as: WorkshopManager }
            - { call: "POST /piano-works/wood-batches/${wb1}/moisture-readings", payload: { moisture_content_pct: 8.0 }, as: WorkshopManager }
            - { call: "POST /piano-works/wood-batches/${wb2}/moisture-readings", payload: { moisture_content_pct: 7.9 }, as: WorkshopManager }
            - { call: "POST /piano-works/build-orders", payload: { model: MODEL_O, wood_batch_id: "${wb1}" }, as: WorkshopManager }
            - { call: "POST /piano-works/build-orders", payload: { model: MODEL_O, wood_batch_id: "${wb2}" }, as: WorkshopManager }
          trigger:
            - { call: "GET /piano-works/build-orders", payload: { limit: 1, offset: 0 }, as: WorkshopManager }
            - { call: "GET /piano-works/build-orders", payload: { limit: 1, offset: 1 }, as: WorkshopManager }
          assert:
            - "page 1: exactly 1 data row, total_count == 2, has_more == true"
            - "page 2: exactly 1 data row, total_count == 2, has_more == false"
            - "the two pages carry disjoint build order ids"

      - name: create_endorsement_master_only_operation_rejected
        claim_type: type_constraints
        grounds: [entities.SkillEndorsement.fields.operation_type, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "operation_type ACTION_REGULATION is a valid enum member but outside the apprentice-trainable set; rejected with ERR_VALIDATION 400."
        test_recipe:
          setup: ["one apprentice"]
          setup_api_calls:
            - { call: "POST /piano-works/apprentices", payload: { name: "Apr X" }, as: WorkshopManager, captures: { apr: $.data.id } }
          trigger:
            - { call: "POST /piano-works/skill-endorsements", payload: { apprentice_id: "${apr}", operation_type: ACTION_REGULATION }, as: WorkshopManager, captures: { err: $.data.error_id } }
          assert:
            - "captured error_id == ERR_VALIDATION with http 400"
            - "GET /piano-works/skill-endorsements?apprentice_id=${apr} returns total_count == 0"

      - name: instrument_created_only_via_build_completion
        claim_type: creation_via_cascade
        grounds: [state_machines.BuildOrder.VOICING_to_COMPLETED, entities.Instrument]
        distinguishing_aspect: "The instruments collection stays empty for the build until the COMPLETED advance; the created instrument starts SHOWROOM, grade A, certified_authentic true, serial matching PIN-########."
        test_recipe:
          setup:
            - "MODEL_O build advanced to VOICING (not yet completed)"
          setup_api_calls:
            - { call: "POST /piano-works/wood-batches", payload: { species: SPRUCE, moisture_content_pct: 10.0 }, as: WorkshopManager, captures: { wb1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-04-29T00:00:00Z" }, as: WorkshopManager }
            - { call: "POST /piano-works/wood-batches/${wb1}/moisture-readings", payload: { moisture_content_pct: 8.0 }, as: WorkshopManager }
            - { call: "POST /piano-works/craftsmen", payload: { name: "Rim Master", specialty: RIM_BENDING }, as: WorkshopManager, captures: { cr_rim: $.data.id } }
            - { call: "POST /piano-works/craftsmen", payload: { name: "Sea Master", specialty: SEASONING_CHECK }, as: WorkshopManager, captures: { cr_sea: $.data.id } }
            - { call: "POST /piano-works/craftsmen", payload: { name: "Act Master", specialty: ACTION_REGULATION }, as: WorkshopManager, captures: { cr_act: $.data.id } }
            - { call: "POST /piano-works/craftsmen", payload: { name: "Voi Master", specialty: VOICING }, as: WorkshopManager, captures: { cr_voi: $.data.id } }
            - { call: "POST /piano-works/build-orders", payload: { model: MODEL_O, wood_batch_id: "${wb1}" }, as: WorkshopManager, captures: { b_id: $.data.id, bv: $.data.version } }
            - { call: "POST /piano-works/build-orders/${b_id}/advance", payload: { to_stage: RIM_BENT, hours_applied: 120, expected_build_order_version: "${bv}" }, as: MasterCraftsman, as_user_id: "${cr_rim}", captures: { bv: $.data.version } }
            - { call: "POST /piano-works/build-orders/${b_id}/advance", payload: { to_stage: SEASONING, hours_applied: 40, expected_build_order_version: "${bv}" }, as: MasterCraftsman, as_user_id: "${cr_sea}", captures: { bv: $.data.version } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2028-04-28T00:00:00Z" }, as: WorkshopManager }
            - { call: "POST /piano-works/build-orders/${b_id}/advance", payload: { to_stage: ACTION_REGULATION, hours_applied: 40, expected_build_order_version: "${bv}" }, as: MasterCraftsman, as_user_id: "${cr_sea}", captures: { bv: $.data.version } }
            - { call: "POST /piano-works/build-orders/${b_id}/advance", payload: { to_stage: VOICING, hours_applied: 200, expected_build_order_version: "${bv}" }, as: MasterCraftsman, as_user_id: "${cr_act}", captures: { bv: $.data.version } }
            - { call: "GET /piano-works/instruments", payload: { build_order_id: "${b_id}" }, as: WorkshopManager }
          trigger:
            - { call: "POST /piano-works/build-orders/${b_id}/advance", payload: { to_stage: COMPLETED, hours_applied: 160, expected_build_order_version: "${bv}" }, as: MasterCraftsman, as_user_id: "${cr_voi}" }
            - { call: "GET /piano-works/instruments", payload: { build_order_id: "${b_id}" }, as: WorkshopManager, captures: { i_id: "$.data[0].id", i_grade: "$.data[0].condition_grade" } }
          assert:
            - "before completion: instruments list for the build is empty (total_count == 0)"
            - "after completion: exactly one instrument; captured grade ${i_grade} == A"
            - "Instrument.${i_id}.status == SHOWROOM and certified_authentic == true and model == MODEL_O"
            - "serial_number matches the pattern PIN- followed by 8 digits"

      - name: create_wood_batch_extra_field_rejected
        claim_type: unknown_field_strictness
        grounds: ["validations[priority=3]", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Client-supplied system field (status) in a create body is an unknown input key; strict validation rejects with ERR_VALIDATION rather than silently ignoring it."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /piano-works/wood-batches", payload: { species: MAPLE, moisture_content_pct: 12.0, status: CONDITIONED }, as: WorkshopManager, captures: { err: $.data.error_id } }
          assert:
            - "captured error_id == ERR_VALIDATION with http 400"

  - section: state_machines
    instances:
      - name: rejected_batch_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.WoodBatch, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "From REJECTED both a further reject and any moisture reading are rejected with ERR_INVALID_STATE; no transition leaves a terminal batch state."
        test_recipe:
          setup: ["batch created at default clock, then rejected"]
          setup_api_calls:
            - { call: "POST /piano-works/wood-batches", payload: { species: BIRCH, moisture_content_pct: 13.0 }, as: WorkshopManager, captures: { wb: $.data.id } }
            - { call: "POST /piano-works/wood-batches/${wb}/reject", payload: {}, as: WorkshopManager, captures: { st: $.data.status } }
          trigger:
            - { call: "POST /piano-works/wood-batches/${wb}/moisture-readings", payload: { moisture_content_pct: 7.0 }, as: WorkshopManager, captures: { err1: $.data.error_id } }
            - { call: "POST /piano-works/wood-batches/${wb}/reject", payload: {}, as: WorkshopManager, captures: { err2: $.data.error_id } }
          assert:
            - "setup reject succeeded: captured ${st} == REJECTED"
            - "captured ${err1} == ERR_INVALID_STATE (readings on terminal batch)"
            - "captured ${err2} == ERR_INVALID_STATE (second reject)"

      - name: assess_before_threshold_returns_invalid_state
        claim_type: precondition_enforcement
        grounds: [state_machines.SkillEndorsement.PENDING_ASSESSMENT_to_ENDORSED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Assess on an IN_TRAINING endorsement (effective_hours 100 < 600) is rejected with ERR_INVALID_STATE; hours remain unchanged."
        test_recipe:
          setup: ["apprentice endorsement RIM_BENDING with a single matched 100h entry"]
          setup_api_calls:
            - { call: "POST /piano-works/craftsmen", payload: { name: "Rim Master", specialty: RIM_BENDING }, as: WorkshopManager, captures: { cr_rim: $.data.id } }
            - { call: "POST /piano-works/craftsmen", payload: { name: "Act Master", specialty: ACTION_REGULATION }, as: WorkshopManager, captures: { cr_act: $.data.id } }
            - { call: "POST /piano-works/apprentices", payload: { name: "Apr Y" }, as: WorkshopManager, captures: { apr: $.data.id } }
            - { call: "POST /piano-works/skill-endorsements", payload: { apprentice_id: "${apr}", operation_type: RIM_BENDING }, as: WorkshopManager, captures: { en: $.data.id } }
            - { call: "POST /piano-works/skill-endorsements/${en}/log-hours", payload: { hours: 100, supervising_craftsman_id: "${cr_rim}" }, as: Apprentice, as_user_id: "${apr}" }
          trigger:
            - { call: "POST /piano-works/skill-endorsements/${en}/assess", payload: { outcome: ENDORSE }, as: MasterCraftsman, as_user_id: "${cr_act}", captures: { err: $.data.error_id } }
          assert:
            - "captured error_id == ERR_INVALID_STATE (assess requires PENDING_ASSESSMENT)"
            - "SkillEndorsement.${en}.status == IN_TRAINING and effective_hours == 100"

      - name: advance_same_stage_rejected
        claim_type: invalid_transition
        grounds: [state_machines.BuildOrder, "errors[ERR_BUILD_STAGE_INVALID]"]
        distinguishing_aspect: "advance with to_stage equal to the current stage (RIM_BENT -> RIM_BENT) is not a self-loop; rejected ERR_BUILD_STAGE_INVALID with state and version unchanged."
        test_recipe:
          setup: ["build at RIM_BENT, version 2"]
          setup_api_calls:
            - { call: "POST /piano-works/wood-batches", payload: { species: MAPLE, moisture_content_pct: 12.5 }, as: WorkshopManager, captures: { wb1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-04-29T00:00:00Z" }, as: WorkshopManager }
            - { call: "POST /piano-works/wood-batches/${wb1}/moisture-readings", payload: { moisture_content_pct: 8.0 }, as: WorkshopManager }
            - { call: "POST /piano-works/craftsmen", payload: { name: "Rim Master", specialty: RIM_BENDING }, as: WorkshopManager, captures: { cr_rim: $.data.id } }
            - { call: "POST /piano-works/build-orders", payload: { model: MODEL_O, wood_batch_id: "${wb1}" }, as: WorkshopManager, captures: { b_id: $.data.id, bv: $.data.version } }
            - { call: "POST /piano-works/build-orders/${b_id}/advance", payload: { to_stage: RIM_BENT, hours_applied: 100, expected_build_order_version: "${bv}" }, as: MasterCraftsman, as_user_id: "${cr_rim}", captures: { bv2: $.data.version } }
          trigger:
            - { call: "POST /piano-works/build-orders/${b_id}/advance", payload: { to_stage: RIM_BENT, hours_applied: 10, expected_build_order_version: "${bv2}" }, as: MasterCraftsman, as_user_id: "${cr_rim}", captures: { err: $.data.error_id } }
          assert:
            - "captured error_id == ERR_BUILD_STAGE_INVALID"
            - "BuildOrder.${b_id}.status == RIM_BENT and version == ${bv2} (no mutation, no stage log appended)"

      - name: rework_path_not_drivable_via_advance
        claim_type: invalid_transition
        grounds: ["state_machines.BuildOrder.SEASONING_to_RIM_BENT", "errors[ERR_BUILD_STAGE_INVALID]"]
        distinguishing_aspect: "The SEASONING -> RIM_BENT rework edge is system-only; calling advance with to_stage RIM_BENT from SEASONING is rejected even by a qualified craftsman."
        test_recipe:
          setup: ["build at SEASONING, version 3"]
          setup_api_calls:
            - { call: "POST /piano-works/wood-batches", payload: { species: MAPLE, moisture_content_pct: 12.5 }, as: WorkshopManager, captures: { wb1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-04-29T00:00:00Z" }, as: WorkshopManager }
            - { call: "POST /piano-works/wood-batches/${wb1}/moisture-readings", payload: { moisture_content_pct: 8.0 }, as: WorkshopManager }
            - { call: "POST /piano-works/craftsmen", payload: { name: "Rim Master", specialty: RIM_BENDING }, as: WorkshopManager, captures: { cr_rim: $.data.id } }
            - { call: "POST /piano-works/craftsmen", payload: { name: "Sea Master", specialty: SEASONING_CHECK }, as: WorkshopManager, captures: { cr_sea: $.data.id } }
            - { call: "POST /piano-works/build-orders", payload: { model: MODEL_B, wood_batch_id: "${wb1}" }, as: WorkshopManager, captures: { b_id: $.data.id, bv: $.data.version } }
            - { call: "POST /piano-works/build-orders/${b_id}/advance", payload: { to_stage: RIM_BENT, hours_applied: 100, expected_build_order_version: "${bv}" }, as: MasterCraftsman, as_user_id: "${cr_rim}", captures: { bv: $.data.version } }
            - { call: "POST /piano-works/build-orders/${b_id}/advance", payload: { to_stage: SEASONING, hours_applied: 30, expected_build_order_version: "${bv}" }, as: MasterCraftsman, as_user_id: "${cr_sea}", captures: { bv3: $.data.version } }
          trigger:
            - { call: "POST /piano-works/build-orders/${b_id}/advance", payload: { to_stage: RIM_BENT, hours_applied: 10, expected_build_order_version: "${bv3}" }, as: MasterCraftsman, as_user_id: "${cr_rim}", captures: { err: $.data.error_id } }
          assert:
            - "captured error_id == ERR_BUILD_STAGE_INVALID (rework is cascade-driven only)"
            - "BuildOrder.${b_id}.status == SEASONING and wood_batch_id == ${wb1} unchanged"

      - name: build_completed_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.BuildOrder, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "COMPLETED is terminal for BuildOrder: any further advance returns ERR_INVALID_STATE (terminal lockdown precedes stage-legality), and the produced instrument is untouched."
        test_recipe:
          setup: ["MODEL_O build driven to COMPLETED; instrument created"]
          setup_api_calls:
            - { call: "POST /piano-works/wood-batches", payload: { species: SPRUCE, moisture_content_pct: 10.0 }, as: WorkshopManager, captures: { wb1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-04-29T00:00:00Z" }, as: WorkshopManager }
            - { call: "POST /piano-works/wood-batches/${wb1}/moisture-readings", payload: { moisture_content_pct: 8.0 }, as: WorkshopManager }
            - { call: "POST /piano-works/craftsmen", payload: { name: "Rim Master", specialty: RIM_BENDING }, as: WorkshopManager, captures: { cr_rim: $.data.id } }
            - { call: "POST /piano-works/craftsmen", payload: { name: "Sea Master", specialty: SEASONING_CHECK }, as: WorkshopManager, captures: { cr_sea: $.data.id } }
            - { call: "POST /piano-works/craftsmen", payload: { name: "Act Master", specialty: ACTION_REGULATION }, as: WorkshopManager, captures: { cr_act: $.data.id } }
            - { call: "POST /piano-works/craftsmen", payload: { name: "Voi Master", specialty: VOICING }, as: WorkshopManager, captures: { cr_voi: $.data.id } }
            - { call: "POST /piano-works/build-orders", payload: { model: MODEL_O, wood_batch_id: "${wb1}" }, as: WorkshopManager, captures: { b_id: $.data.id, bv: $.data.version } }
            - { call: "POST /piano-works/build-orders/${b_id}/advance", payload: { to_stage: RIM_BENT, hours_applied: 120, expected_build_order_version: "${bv}" }, as: MasterCraftsman, as_user_id: "${cr_rim}", captures: { bv: $.data.version } }
            - { call: "POST /piano-works/build-orders/${b_id}/advance", payload: { to_stage: SEASONING, hours_applied: 40, expected_build_order_version: "${bv}" }, as: MasterCraftsman, as_user_id: "${cr_sea}", captures: { bv: $.data.version } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2028-04-28T00:00:00Z" }, as: WorkshopManager }
            - { call: "POST /piano-works/build-orders/${b_id}/advance", payload: { to_stage: ACTION_REGULATION, hours_applied: 40, expected_build_order_version: "${bv}" }, as: MasterCraftsman, as_user_id: "${cr_sea}", captures: { bv: $.data.version } }
            - { call: "POST /piano-works/build-orders/${b_id}/advance", payload: { to_stage: VOICING, hours_applied: 200, expected_build_order_version: "${bv}" }, as: MasterCraftsman, as_user_id: "${cr_act}", captures: { bv: $.data.version } }
            - { call: "POST /piano-works/build-orders/${b_id}/advance", payload: { to_stage: COMPLETED, hours_applied: 160, expected_build_order_version: "${bv}" }, as: MasterCraftsman, as_user_id: "${cr_voi}", captures: { bv6: $.data.version } }
          trigger:
            - { call: "POST /piano-works/build-orders/${b_id}/advance", payload: { to_stage: VOICING, hours_applied: 5, expected_build_order_version: "${bv6}" }, as: MasterCraftsman, as_user_id: "${cr_voi}", captures: { err: $.data.error_id } }
          assert:
            - "captured error_id == ERR_INVALID_STATE"
            - "BuildOrder.${b_id}.status == COMPLETED and version == ${bv6}"
            - "GET /piano-works/build-orders/${b_id}/stage-logs still returns exactly 5 entries"

      - name: restoration_authenticity_hold_cycle
        claim_type: cyclic_transition
        grounds: ["state_machines.RestorationCase.QUOTED_to_AUTHENTICITY_HOLD", "state_machines.RestorationCase.AUTHENTICITY_HOLD_to_QUOTED"]
        distinguishing_aspect: "The authenticity hold loop is cyclic on RestorationCase: a 60.0% quote without waiver auto-diverts create into AUTHENTICITY_HOLD; resolving with an 80.0% quote returns the case to QUOTED."
        test_recipe:
          setup: ["SHOWROOM instrument from a completed MODEL_O build; restoration lead craftsman"]
          setup_api_calls:
            - { call: "POST /piano-works/wood-batches", payload: { species: SPRUCE, moisture_content_pct: 10.0 }, as: WorkshopManager, captures: { wb1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-04-29T00:00:00Z" }, as: WorkshopManager }
            - { call: "POST /piano-works/wood-batches/${wb1}/moisture-readings", payload: { moisture_content_pct: 8.0 }, as: WorkshopManager }
            - { call: "POST /piano-works/craftsmen", payload: { name: "Rim Master", specialty: RIM_BENDING }, as: WorkshopManager, captures: { cr_rim: $.data.id } }
            - { call: "POST /piano-works/craftsmen", payload: { name: "Sea Master", specialty: SEASONING_CHECK }, as: WorkshopManager, captures: { cr_sea: $.data.id } }
            - { call: "POST /piano-works/craftsmen", payload: { name: "Act Master", specialty: ACTION_REGULATION }, as: WorkshopManager, captures: { cr_act: $.data.id } }
            - { call: "POST /piano-works/craftsmen", payload: { name: "Voi Master", specialty: VOICING }, as: WorkshopManager, captures: { cr_voi: $.data.id } }
            - { call: "POST /piano-works/build-orders", payload: { model: MODEL_O, wood_batch_id: "${wb1}" }, as: WorkshopManager, captures: { b_id: $.data.id, bv: $.data.version } }
            - { call: "POST /piano-works/build-orders/${b_id}/advance", payload: { to_stage: RIM_BENT, hours_applied: 120, expected_build_order_version: "${bv}" }, as: MasterCraftsman, as_user_id: "${cr_rim}", captures: { bv: $.data.version } }
            - { call: "POST /piano-works/build-orders/${b_id}/advance", payload: { to_stage: SEASONING, hours_applied: 40, expected_build_order_version: "${bv}" }, as: MasterCraftsman, as_user_id: "${cr_sea}", captures: { bv: $.data.version } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2028-04-28T00:00:00Z" }, as: WorkshopManager }
            - { call: "POST /piano-works/build-orders/${b_id}/advance", payload: { to_stage: ACTION_REGULATION, hours_applied: 40, expected_build_order_version: "${bv}" }, as: MasterCraftsman, as_user_id: "${cr_sea}", captures: { bv: $.data.version } }
            - { call: "POST /piano-works/build-orders/${b_id}/advance", payload: { to_stage: VOICING, hours_applied: 200, expected_build_order_version: "${bv}" }, as: MasterCraftsman, as_user_id: "${cr_act}", captures: { bv: $.data.version } }
            - { call: "POST /piano-works/build-orders/${b_id}/advance", payload: { to_stage: COMPLETED, hours_applied: 160, expected_build_order_version: "${bv}" }, as: MasterCraftsman, as_user_id: "${cr_voi}" }
            - { call: "GET /piano-works/instruments", payload: { build_order_id: "${b_id}" }, as: WorkshopManager, captures: { i_id: "$.data[0].id" } }
          trigger:
