          trigger:
            - { call: "POST /tennis/strikes", payload: { player_id: "${ph2}", kind: "INELIGIBLE_LINEUP", reason: "Fielded on an unactivated spot" }, as: LeagueCoordinator, captures: { sh2: $.data.id } }
