              captures: { vendor_id: $.data.id }
            - call: "POST /franchise/territories"
              payload: { brand_id: "${brand_id}", code: "BQ", name: "BQ" }
              as: Franchisor
              captures: { terr_id: $.data.id }
            - call: "POST /franchise/franchisees"
              payload: { brand_id: "${brand_id}", legal_name: "F1", owner_user_id: "u_f1" }
              as: Franchisor
              captures: { f1_id: $.data.id }
            - call: "POST /franchise/franchisees/${f1_id}/approve"
              payload: {}
              as: Franchisor
            - call: "POST /franchise/territories/${terr_id}/assign"
              payload: { franchisee_id: "${f1_id}" }
              as: Franchisor
            - call: "POST /franchise/units"
              payload: { franchisee_id: "${f1_id}", territory_id: "${terr_id}", address: "U1" }
              as: Franchisor
              captures: { unit_id: $.data.id }
            - call: "POST /franchise/units/${unit_id}/open"
              payload: {}
              as: Franchisee
              as_user_id: "u_f1"
          trigger:
            - call: "POST /franchise/vendor-authorizations"
              payload: { unit_id: "${unit_id}", vendor_id: "${vendor_id}", qualifying_purchase_cents: 0 }
              as: Franchisee
              as_user_id: "u_intruder"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 403"
            - "response.data.error_id == ERR_NOT_RESOURCE_OWNER   # p4 wins over p12 ERR_VENDOR_NOT_APPROVED"

  # -------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: audit_overall_score_pass_floor_ge_90
        grounds:
          - calculations.audit_score
          - state_machines.BrandAudit.IN_PROGRESS_to_FINALIZED
          - entities.BrandAudit.fields.grade
        distinguishing_aspect: |
          overall_score exactly 90.0 grades PASS (>= 90.0), not CONDITIONAL — section scores all 90 give
          weighted 90.0; the boundary is inclusive (>=). Reached through the audits/finalize endpoint.
        test_recipe:
          setup:
            - "Brand; OPEN unit; an IN_PROGRESS audit on the unit."
          setup_api_calls:
            - call: "POST /franchise/brands"
              payload: { name: "Noodle" }
              as: Franchisor
              captures: { brand_id: $.data.id }
            - call: "POST /franchise/territories"
              payload: { brand_id: "${brand_id}", code: "N1", name: "N" }
              as: Franchisor
              captures: { terr_id: $.data.id }
            - call: "POST /franchise/franchisees"
              payload: { brand_id: "${brand_id}", legal_name: "FZ", owner_user_id: "u_fz" }
              as: Franchisor
              captures: { fz_id: $.data.id }
            - call: "POST /franchise/franchisees/${fz_id}/approve"
              payload: {}
              as: Franchisor
            - call: "POST /franchise/territories/${terr_id}/assign"
              payload: { franchisee_id: "${fz_id}" }
              as: Franchisor
            - call: "POST /franchise/units"
              payload: { franchisee_id: "${fz_id}", territory_id: "${terr_id}", address: "U1" }
              as: Franchisor
              captures: { unit_id: $.data.id }
            - call: "POST /franchise/units/${unit_id}/open"
              payload: {}
              as: Franchisee
              as_user_id: "u_fz"
            - call: "POST /franchise/audits"
              payload: { unit_id: "${unit_id}" }
              as: ComplianceAuditor
              captures: { audit_id: $.data.id }
            - call: "POST /franchise/audits/${audit_id}/start"
              payload: {}
              as: ComplianceAuditor
          trigger:
            - call: "POST /franchise/audits/${audit_id}/finalize"
              payload: { food_safety_score: 90, cleanliness_score: 90, service_score: 90, brand_compliance_score: 90 }
              as: ComplianceAuditor
          assert:
            - "BrandAudit.${audit_id}.overall_score == 90.0"
            - "BrandAudit.${audit_id}.grade == PASS   # >= 90.0 inclusive, not CONDITIONAL"
            - "Unit.${unit_id}.compliance_status == GOOD_STANDING   # PASS leaves GOOD_STANDING unchanged"

      - name: net_sales_zero_when_discounts_equal_gross
        grounds:
          - calculations.net_sales
          - entities.SalesReport.fields.net_sales_cents
          - validations[priority=17]
        distinguishing_aspect: |
          Different metric and endpoint from the audit boundary: when discounts_cents == gross_sales_cents
          (both 250000), net_sales_cents floors at exactly 0 via max(0, gross-discounts) — a zero-quantity
          edge on the sales-reports endpoint (discounts == gross is allowed; discounts > gross is rejected).
        test_recipe:
          setup:
            - "Brand; OPEN unit at current_period_index 0."
          setup_api_calls:
            - call: "POST /franchise/brands"
              payload: { name: "Bowl" }
              as: Franchisor
              captures: { brand_id: $.data.id }
            - call: "POST /franchise/territories"
              payload: { brand_id: "${brand_id}", code: "B1", name: "B" }
              as: Franchisor
              captures: { terr_id: $.data.id }
            - call: "POST /franchise/franchisees"
              payload: { brand_id: "${brand_id}", legal_name: "FZ", owner_user_id: "u_fz" }
              as: Franchisor
              captures: { fz_id: $.data.id }
            - call: "POST /franchise/franchisees/${fz_id}/approve"
              payload: {}
              as: Franchisor
            - call: "POST /franchise/territories/${terr_id}/assign"
              payload: { franchisee_id: "${fz_id}" }
              as: Franchisor
            - call: "POST /franchise/units"
              payload: { franchisee_id: "${fz_id}", territory_id: "${terr_id}", address: "U1" }
              as: Franchisor
              captures: { unit_id: $.data.id }
            - call: "POST /franchise/units/${unit_id}/open"
              payload: {}
              as: Franchisee
              as_user_id: "u_fz"
          trigger:
            - call: "POST /franchise/sales-reports"
              payload: { unit_id: "${unit_id}", period_index: 0, gross_sales_cents: 250000, discounts_cents: 250000 }
              as: Franchisor
              captures: { sr_id: $.data.id }
          assert:
            - "SalesReport.${sr_id}.net_sales_cents == 0   # max(0, 250000 - 250000)"
            - "SalesReport.${sr_id}.status == POLLED"

  # -------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: unit_open_requires_territory_assigned_to_franchisee
        grounds:
          - state_machines.Unit.PLANNED_to_OPEN
          - validations[priority=8]
          - entities.Territory.fields.status
          - entities.Territory.fields.assigned_franchisee_id
        distinguishing_aspect: |
          Unit PLANNED→OPEN is gated by a DIFFERENT entity's state: the unit's Territory must be ASSIGNED to
          that unit's franchisee. Opening a unit whose territory is still AVAILABLE (never assigned) fails
          with ERR_TERRITORY_NOT_HELD — entity pair Unit→Territory.
        test_recipe:
          setup:
            - "Brand; APPROVED franchisee; a Territory that is AVAILABLE (NOT assigned); a PLANNED unit referencing that territory."
          setup_api_calls:
            - call: "POST /franchise/brands"
              payload: { name: "Roll" }
              as: Franchisor
              captures: { brand_id: $.data.id }
            - call: "POST /franchise/territories"
              payload: { brand_id: "${brand_id}", code: "R1", name: "R" }
              as: Franchisor
              captures: { terr_id: $.data.id }
            - call: "POST /franchise/franchisees"
              payload: { brand_id: "${brand_id}", legal_name: "FZ", owner_user_id: "u_fz" }
              as: Franchisor
              captures: { fz_id: $.data.id }
            - call: "POST /franchise/franchisees/${fz_id}/approve"
              payload: {}
              as: Franchisor
            - call: "POST /franchise/units"
              payload: { franchisee_id: "${fz_id}", territory_id: "${terr_id}", address: "U1" }
              as: Franchisor
              captures: { unit_id: $.data.id }
          trigger:
            - call: "POST /franchise/units/${unit_id}/open"
              payload: {}
              as: Franchisor
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_TERRITORY_NOT_HELD   # territory AVAILABLE, not ASSIGNED to franchisee"
            - "Unit.${unit_id}.operational_status == PLANNED   # unchanged"

      - name: audit_start_requires_unit_operational_open
        grounds:
          - state_machines.BrandAudit.SCHEDULED_to_IN_PROGRESS
          - validations[priority=6]
          - entities.Unit.fields.operational_status
        distinguishing_aspect: |
          BrandAudit SCHEDULED→IN_PROGRESS is gated by a DIFFERENT entity pair (BrandAudit→Unit): starting
          an audit whose target unit is still PLANNED (operational_status != OPEN) fails with
          ERR_UNIT_NOT_OPEN — a distinct cross-entity dependency from Unit→Territory.
        test_recipe:
          setup:
            - "Brand; APPROVED franchisee holding an ASSIGNED territory; a PLANNED unit (never opened); a SCHEDULED audit on that unit."
          setup_api_calls:
            - call: "POST /franchise/brands"
              payload: { name: "Wrap" }
              as: Franchisor
              captures: { brand_id: $.data.id }
            - call: "POST /franchise/territories"
              payload: { brand_id: "${brand_id}", code: "WR", name: "WR" }
              as: Franchisor
              captures: { terr_id: $.data.id }
            - call: "POST /franchise/franchisees"
              payload: { brand_id: "${brand_id}", legal_name: "FZ", owner_user_id: "u_fz" }
              as: Franchisor
              captures: { fz_id: $.data.id }
            - call: "POST /franchise/franchisees/${fz_id}/approve"
              payload: {}
              as: Franchisor
            - call: "POST /franchise/territories/${terr_id}/assign"
              payload: { franchisee_id: "${fz_id}" }
              as: Franchisor
            - call: "POST /franchise/units"
              payload: { franchisee_id: "${fz_id}", territory_id: "${terr_id}", address: "U1" }
              as: Franchisor
              captures: { unit_id: $.data.id }
            - call: "POST /franchise/audits"
              payload: { unit_id: "${unit_id}" }
              as: ComplianceAuditor
              captures: { audit_id: $.data.id }
          trigger:
            - call: "POST /franchise/audits/${audit_id}/start"
              payload: {}
              as: ComplianceAuditor
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_UNIT_NOT_OPEN   # unit operational_status is PLANNED"
            - "BrandAudit.${audit_id}.status == SCHEDULED   # unchanged"

  # -------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: territory_exclusivity_single_holder
        grounds:
          - validations[priority=10]
          - state_machines.Franchisee.transitions
          - entities.Territory.fields.status
          - errors[ERR_TERRITORY_CONFLICT]
        distinguishing_aspect: |
          Interval semantics = point-exclusivity grant: a Territory in status ASSIGNED is an indivisible
          exclusive occupation by one franchisee; assigning the SAME territory to a second franchisee
          collides with the existing grant and is rejected with ERR_TERRITORY_CONFLICT (resource = Territory).
        test_recipe:
          setup:
            - "Brand; two APPROVED franchisees F1 and F2; a Territory already ASSIGNED to F1."
          setup_api_calls:
            - call: "POST /franchise/brands"
              payload: { name: "Shack" }
              as: Franchisor
              captures: { brand_id: $.data.id }
            - call: "POST /franchise/territories"
              payload: { brand_id: "${brand_id}", code: "SK", name: "SK" }
              as: Franchisor
              captures: { terr_id: $.data.id }
            - call: "POST /franchise/franchisees"
              payload: { brand_id: "${brand_id}", legal_name: "F1", owner_user_id: "u_f1" }
              as: Franchisor
              captures: { f1_id: $.data.id }
            - call: "POST /franchise/franchisees/${f1_id}/approve"
              payload: {}
              as: Franchisor
            - call: "POST /franchise/franchisees"
              payload: { brand_id: "${brand_id}", legal_name: "F2", owner_user_id: "u_f2" }
              as: Franchisor
              captures: { f2_id: $.data.id }
            - call: "POST /franchise/franchisees/${f2_id}/approve"
              payload: {}
              as: Franchisor
            - call: "POST /franchise/territories/${terr_id}/assign"
              payload: { franchisee_id: "${f1_id}" }
              as: Franchisor
          trigger:
            - call: "POST /franchise/territories/${terr_id}/assign"
              payload: { franchisee_id: "${f2_id}" }
              as: Franchisor
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_TERRITORY_CONFLICT"
            - "Territory.${terr_id}.assigned_franchisee_id == ${f1_id}   # original grant intact"

      - name: audit_active_lifetime_capacity_one_per_unit
        grounds:
          - validations[priority=16]
          - state_machines.BrandAudit.SCHEDULED_to_IN_PROGRESS
          - entities.BrandAudit.fields.status
          - errors[ERR_AUDIT_IN_PROGRESS]
        distinguishing_aspect: |
          Different interval semantics = aggregate-capacity-of-one over an audit's ACTIVE lifetime
          (status IN {SCHEDULED, IN_PROGRESS}): scheduling a second audit on a unit that already has an
          active audit collides with the open audit window and is rejected with ERR_AUDIT_IN_PROGRESS
          (resource = Unit) — distinct from the Territory point-exclusivity grant.
        test_recipe:
          setup:
            - "Brand; OPEN unit with one SCHEDULED audit already present (active window open)."
          setup_api_calls:
            - call: "POST /franchise/brands"
              payload: { name: "Hut" }
              as: Franchisor
              captures: { brand_id: $.data.id }
            - call: "POST /franchise/territories"
              payload: { brand_id: "${brand_id}", code: "HT", name: "HT" }
              as: Franchisor
              captures: { terr_id: $.data.id }
            - call: "POST /franchise/franchisees"
              payload: { brand_id: "${brand_id}", legal_name: "FZ", owner_user_id: "u_fz" }
              as: Franchisor
              captures: { fz_id: $.data.id }
            - call: "POST /franchise/franchisees/${fz_id}/approve"
              payload: {}
              as: Franchisor
            - call: "POST /franchise/territories/${terr_id}/assign"
              payload: { franchisee_id: "${fz_id}" }
              as: Franchisor
            - call: "POST /franchise/units"
              payload: { franchisee_id: "${fz_id}", territory_id: "${terr_id}", address: "U1" }
              as: Franchisor
              captures: { unit_id: $.data.id }
            - call: "POST /franchise/units/${unit_id}/open"
              payload: {}
              as: Franchisee
              as_user_id: "u_fz"
            - call: "POST /franchise/audits"
              payload: { unit_id: "${unit_id}" }
              as: ComplianceAuditor
              captures: { audit1: $.data.id }
          trigger:
            - call: "POST /franchise/audits"
              payload: { unit_id: "${unit_id}" }
              as: ComplianceAuditor
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_AUDIT_IN_PROGRESS   # unit already has a SCHEDULED audit"

  # -------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: compliance_strike_conservation_suspend_then_reinstate
        grounds:
          - state_machines.Unit.GOOD_STANDING_to_SUSPENDED
          - state_machines.Unit.SUSPENDED_to_PROBATION
          - entities.Franchisee.fields.open_compliance_strikes
        distinguishing_aspect: |
          Conserved quantity = Franchisee.open_compliance_strikes, pinned as
          open_compliance_strikes == count(this franchisee's units with compliance_status == SUSPENDED).
          A FAIL audit (forward: +1 strike, unit SUSPENDED) followed by reinstate (compensating: -1 strike,
          unit PROBATION) restores strikes to 0, equal to the count of SUSPENDED units (0).
        test_recipe:
          setup:
            - "Brand; ACTIVE franchisee with one OPEN unit; a FAIL audit finalized so the unit is SUSPENDED and open_compliance_strikes==1; a SECOND later audit finalized PASS so a non-FAIL remediation audit exists."
          setup_api_calls:
            - call: "POST /franchise/brands"
              payload: { name: "Stop" }
              as: Franchisor
              captures: { brand_id: $.data.id }
            - call: "POST /franchise/territories"
              payload: { brand_id: "${brand_id}", code: "ST", name: "ST" }
              as: Franchisor
              captures: { terr_id: $.data.id }
            - call: "POST /franchise/franchisees"
              payload: { brand_id: "${brand_id}", legal_name: "FZ", owner_user_id: "u_fz" }
              as: Franchisor
              captures: { fz_id: $.data.id }
            - call: "POST /franchise/franchisees/${fz_id}/approve"
              payload: {}
              as: Franchisor
            - call: "POST /franchise/territories/${terr_id}/assign"
              payload: { franchisee_id: "${fz_id}" }
              as: Franchisor
            - call: "POST /franchise/units"
              payload: { franchisee_id: "${fz_id}", territory_id: "${terr_id}", address: "U1" }
              as: Franchisor
              captures: { unit_id: $.data.id }
            - call: "POST /franchise/units/${unit_id}/open"
              payload: {}
              as: Franchisee
              as_user_id: "u_fz"
            - call: "POST /franchise/audits"
              payload: { unit_id: "${unit_id}" }
              as: ComplianceAuditor
              captures: { audit1: $.data.id }
            - call: "POST /franchise/audits/${audit1}/start"
              payload: {}
              as: ComplianceAuditor
            - call: "POST /franchise/audits/${audit1}/finalize"
              payload: { food_safety_score: 40, cleanliness_score: 40, service_score: 40, brand_compliance_score: 40 }
              as: ComplianceAuditor
            - call: "POST /franchise/audits"
              payload: { unit_id: "${unit_id}" }
              as: ComplianceAuditor
              captures: { audit2: $.data.id }
            - call: "POST /franchise/audits/${audit2}/start"
              payload: {}
              as: ComplianceAuditor
            - call: "POST /franchise/audits/${audit2}/finalize"
              payload: { food_safety_score: 95, cleanliness_score: 95, service_score: 95, brand_compliance_score: 95 }
              as: ComplianceAuditor
          trigger:
            - call: "POST /franchise/units/${unit_id}/reinstate"
              payload: {}
              as: Franchisor
          assert:
            - "Unit.${unit_id}.compliance_status == PROBATION   # reinstate moves SUSPENDED→PROBATION"
            - "Franchisee.${fz_id}.open_compliance_strikes == 0   # invariant: == count(SUSPENDED units) == 0 after compensation"

      - name: rebate_pool_conservation_sum_of_shares_equals_pool
        grounds:
          - calculations.rebate_distribution
          - state_machines.RoyaltyStatement.OVERDUE_to_WRITTEN_OFF
          - entities.NationalAccount.fields.rebate_pool_cents
          - concurrency_rules[rebate-distribute-stale-brand]
        distinguishing_aspect: |
          Conserved quantity = total cents distributed, pinned as
          sum(per-unit rebate share) == NationalAccount.rebate_pool_cents. The forward distribute action
          (floor each share + deterministic remainder allocation) leaves the pool exactly conserved — a
          different conserved quantity (money pool) than the compliance-strike count invariant.
        test_recipe:
          setup:
            - "Brand; APPROVED vendor; three OPEN units each with an ACTIVE VendorAuthorization (qpc 3000000, 2000000, 1500000); NationalAccount pool 5000000, min_qualifying 1000000, OPEN."
          setup_api_calls:
            - call: "POST /franchise/brands"
              payload: { name: "Joint" }
              as: Franchisor
              captures: { brand_id: $.data.id }
            - call: "POST /franchise/vendors"
              payload: { brand_id: "${brand_id}", name: "Acme", category: "FOOD" }
              as: ComplianceAuditor
              captures: { vendor_id: $.data.id }
            - call: "POST /franchise/vendors/${vendor_id}/approve"
              payload: {}
              as: ComplianceAuditor
            - call: "POST /franchise/territories"
              payload: { brand_id: "${brand_id}", code: "JT", name: "JT" }
              as: Franchisor
              captures: { terr_id: $.data.id }
            - call: "POST /franchise/franchisees"
              payload: { brand_id: "${brand_id}", legal_name: "FZ", owner_user_id: "u_fz" }
              as: Franchisor
              captures: { fz_id: $.data.id }
            - call: "POST /franchise/franchisees/${fz_id}/approve"
              payload: {}
              as: Franchisor
            - call: "POST /franchise/territories/${terr_id}/assign"
              payload: { franchisee_id: "${fz_id}" }
              as: Franchisor
            - call: "POST /franchise/units"
              payload: { franchisee_id: "${fz_id}", territory_id: "${terr_id}", address: "UA" }
              as: Franchisor
              captures: { unit_a: $.data.id }
            - call: "POST /franchise/units"
              payload: { franchisee_id: "${fz_id}", territory_id: "${terr_id}", address: "UB" }
              as: Franchisor
              captures: { unit_b: $.data.id }
            - call: "POST /franchise/units"
              payload: { franchisee_id: "${fz_id}", territory_id: "${terr_id}", address: "UC" }
              as: Franchisor
              captures: { unit_c: $.data.id }
            - call: "POST /franchise/vendor-authorizations"
              payload: { unit_id: "${unit_a}", vendor_id: "${vendor_id}", qualifying_purchase_cents: 3000000 }
              as: Franchisor
              captures: { auth_a: $.data.id }
            - call: "POST /franchise/vendor-authorizations"
              payload: { unit_id: "${unit_b}", vendor_id: "${vendor_id}", qualifying_purchase_cents: 2000000 }
              as: Franchisor
              captures: { auth_b: $.data.id }
            - call: "POST /franchise/vendor-authorizations"
              payload: { unit_id: "${unit_c}", vendor_id: "${vendor_id}", qualifying_purchase_cents: 1500000 }
              as: Franchisor
              captures: { auth_c: $.data.id }
            - call: "POST /franchise/national-accounts"
              payload: { brand_id: "${brand_id}", vendor_id: "${vendor_id}", name: "Q2", rebate_pool_cents: 5000000, min_qualifying_cents: 1000000 }
              as: FinanceClerk
              captures: { na_id: $.data.id }
            - call: "GET /franchise/brands/${brand_id}"
              payload: {}
              as: FinanceClerk
              captures: { brand_v: $.data.version }
          trigger:
            - call: "POST /franchise/national-accounts/${na_id}/distribute"
              payload: { expected_brand_version: "${brand_v}" }
              as: FinanceClerk
          assert:
            - "NationalAccount.${na_id}.status == DISTRIBUTED"
            - "share(${auth_a}) + share(${auth_b}) + share(${auth_c}) == 5000000   # pool exactly conserved, no drift"
