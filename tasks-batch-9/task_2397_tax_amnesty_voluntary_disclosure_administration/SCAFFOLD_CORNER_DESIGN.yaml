          - entities.PreClearanceRequest.fields.screening_result
          - endpoints[POST /amnesty/pre-clearances/{id}/begin-review]
        distinguishing_aspect: |
          The same trigger has two targets. When self_reported_under_audit is true the
          screening decides the branch inside the transition: status jumps to REJECTED
          with screening_result INELIGIBLE_SELF_REPORTED_AUDIT and rejection_reason set
          to that enum name, and the request never visits UNDER_REVIEW — so no offer can
          follow.
