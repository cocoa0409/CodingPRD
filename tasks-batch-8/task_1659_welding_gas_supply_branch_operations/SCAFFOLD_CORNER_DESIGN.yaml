              payload: {}
              as: CounterRep
            - call: "POST /orders/${oid}/stage"
              payload: {}
              as: CounterRep
            - call: "POST /orders/${oid}/fulfill"
              payload: {}
              as: CounterRep
              captures: { inv: $.data.invoice_id }
          trigger:
            - call: "POST /invoices/${inv}/void"
              payload: {}
              as: BranchManager
              captures: { inv_status: $.data.status }
            - call: "GET /orders/${oid}"
              as: CounterRep
              captures: { pay_status: $.data.payment_status }
