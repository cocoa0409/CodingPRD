  # ================================================================ errors ====
  - section: errors
    instances:
      - name: titles_create_missing_header_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"
        distinguishing_aspect: "A request without X-User-ID / X-User-Role headers fails priority-1 auth with 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER before role or body checks (the body here is otherwise valid)."
        test_recipe:
          setup: ["Empty DB; the trigger is sent WITHOUT the two identity headers"]
          setup_api_calls: []
          trigger:
            - call: "POST /qa-cert/titles"
              payload: { title_code: "ERR-AUTH", name: "Err Auth", platform_codes: ["PS5"], target_launch_date: "2026-11-01", cert_budget_total_cents: 1000 }
          assert:
            - "error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http 400"

      - name: err_open_blockers_trigger_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_OPEN_BLOCKERS_EXIST]"]
        excluded_because:
          difficulty_instance: boundary_precision_check / open_blocker_count_zero_vs_one
          rationale: "Asserted as the failure leg of the named §1.8 instance (and at the build promote gate in corner build_retest_loop_and_promote_gate)."

      - name: err_window_overlap_trigger_covered
