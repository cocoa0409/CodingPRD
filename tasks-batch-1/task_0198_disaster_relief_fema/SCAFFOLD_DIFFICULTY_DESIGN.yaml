        grounds:
          - state_machines.Disbursement.PAID_to_VOIDED
          - entities.IhpCase.fields.remaining_obligation_cents
          - entities.IhpCase.fields.total_approved_cents
        distinguishing_aspect: |
          CONSERVED QUANTITY = case obligation: invariant disbursed_total_cents +
          remaining_obligation_cents == total_approved_cents. Disbursing 600,000 then
          voiding that disbursement restores disbursed_total and remaining_obligation
          to their pre-disbursement values; total_approved (1,540,000) is unchanged.
        test_recipe:
          setup:
