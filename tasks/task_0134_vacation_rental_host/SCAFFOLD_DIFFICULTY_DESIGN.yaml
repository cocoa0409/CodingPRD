              payload: { host_id: "${h6}", title: "Villa", base_nightly_rate_cents: 20000, cleaning_fee_cents: 5000, security_deposit_cents: 10000, payout_delay_days: 1 }
              as: Host
              as_user_id: "${h6}"
              captures: { l6: $.data.id }
            - call: "POST /rate-plans"
              payload: { listing_id: "${l6}", label: "STD", window_start: "2026-07-01", window_end: "2026-07-31", seasonal_multiplier_bps: 10000 }
              as: Host
              as_user_id: "${h6}"
            - call: "POST /listings/${l6}/publish"
              payload: {}
              as: Host
              as_user_id: "${h6}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /listings/${l6}"
              payload: {}
              as: Guest
              as_user_id: "${g6}"
              captures: { l6_cv_359: $.data.calendar_version }
            - call: "POST /bookings"
              payload: { listing_id: "${l6}", guest_id: "${g6}", check_in: "2026-07-10", check_out: "2026-07-13", expected_listing_calendar_version: "${l6_cv_359}" }
              as: Guest
              as_user_id: "${g6}"
              captures: { b6: $.data.id }
            - call: "POST /bookings/${b6}/screen"
              payload: {}
              as: Host
              as_user_id: "${h6}"
            - call: "POST /bookings/${b6}/approve"
              payload: {}
              as: Host
              as_user_id: "${h6}"
            - call: "POST /bookings/${b6}/confirm"
              payload: {}
              as: Guest
              as_user_id: "${g6}"
            - call: "GET /bookings/${b6}/security-deposits"
              payload: {}
              as: Host
              as_user_id: "${h6}"
              captures: { sd6: $.data.0.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-11T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /security-deposits/${sd6}/claims"
              payload: { security_deposit_id: "${sd6}", amount_cents: 5000, reason: "Stain" }
              as: Host
              as_user_id: "${h6}"
              captures: { dc6: $.data.id }
            - call: "POST /damage-claims/${dc6}/review"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /damage-claims/${dc6}/dispute"
              payload: {}
              as: Guest
              as_user_id: "${g6}"
            - call: "POST /damage-claims/${dc6}/review"
              payload: {}
              as: PlatformAdmin
              captures: { dcs: $.data.status }
          assert:
            - "After dispute DamageClaim.${dc6}.status == DISPUTED"
            - "After re-review DamageClaim.${dc6}.status == UNDER_REVIEW (cycle traversed)"

  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: cancel_confirmed_four_hop_cascade
        grounds:
          - state_machines.Booking.CONFIRMED_to_CANCELLED
          - state_machines.Payout.SCHEDULED_to_RELEASED
          - state_machines.SecurityDeposit.AUTHORIZED_to_RELEASED
          - state_machines.DamageClaim.FILED_to_UNDER_REVIEW
        distinguishing_aspect: |
          Depth-4 chain originating from POST /bookings/{id}/cancel: cancel(A) -> CalendarBlock RELEASED &
          Payout REVERSED(B) -> SecurityDeposit RELEASED(C, caused by reversal) -> open DamageClaim VOID(D,
          caused by deposit closure). Each hop is caused by the prior, not directly by the cancel.
        test_recipe:
          setup:
            - "CONFIRMED booking with a SecurityDeposit holding one FILED DamageClaim and a SCHEDULED Payout."
          setup_api_calls:
            - call: "POST /hosts"
              payload: { email: "h7@x.com", display_name: "Host Seven" }
