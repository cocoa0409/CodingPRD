scaffold_difficulty_design:

  # ───────────────────────────── Rule 1 ─────────────────────────────
  - rule_id: dual_variant_calc
    instances:
      - name: session_charge_provisional_vs_final
        grounds:
          - calculations.session_charge
          - state_machines.Session.CONFIRMED_to_COMPLETED
          - entities.Session.fields.charge_variant
        distinguishing_aspect: "Same Session bills 18000 provisionally (scheduled 90 min = 6 blocks) but 21000 finally (actual 96 min = 7 blocks); dual-variant logic on the Session cost domain."
        test_recipe:
          setup:
            - "Stylist SENIOR commission 0.40; verified client with COMPLETED assessment; HOURLY engagement (block_rate 3000) ACTIVE; one CLOSET_AUDIT session scheduled 2026-04-01 10:00-11:30 (provisional charge 18000) then CONFIRMED."
          setup_api_calls:
            - call: "POST /styling/stylists"
              payload: { full_name: "Ada Vogue", email: "ada1@x.com", commission_pct: 0.40, tier: "SENIOR" }
              as: PlatformAdmin
              captures: { sty_id: $.data.id }
            - call: "POST /styling/clients/register"
              payload: { full_name: "Cara Lin", email: "cara1@x.com" }
              as: Anonymous
              captures: { cl_id: $.data.id }
            - call: "POST /styling/clients/${cl_id}/assessments"
              payload: { body_type: "hourglass", color_palette: "COOL", budget_band: "MID", lifestyle: "corporate" }
              as: Client
              as_user_id: "${cl_id}"
              captures: { as_id: $.data.id }
            - call: "POST /styling/assessments/${as_id}/complete"
              payload: {}
              as: Stylist
              as_user_id: "${sty_id}"
            - call: "POST /styling/engagements"
              payload: { client_id: "${cl_id}", stylist_id: "${sty_id}", mode: "HOURLY", block_rate_cents: 3000 }
              as: Client
              as_user_id: "${cl_id}"
              captures: { eng_id: $.data.id }
            - call: "POST /styling/engagements/${eng_id}/activate"
              payload: {}
              as: Client
              as_user_id: "${cl_id}"
              captures: { eng_v: $.data.version }
            - call: "POST /styling/engagements/${eng_id}/sessions"
              payload: { session_type: "CLOSET_AUDIT", modality: "IN_PERSON", scheduled_start: "2026-04-01T10:00:00Z", scheduled_end: "2026-04-01T11:30:00Z", expected_engagement_version: "${eng_v}" }
              as: Client
              as_user_id: "${cl_id}"
              captures: { sess_id: $.data.id, prov_charge: $.data.charge_cents }
            - call: "POST /styling/sessions/${sess_id}/confirm"
              payload: {}
              as: Stylist
              as_user_id: "${sty_id}"
          trigger:
            - call: "POST /styling/sessions/${sess_id}/complete"
              payload: { actual_minutes: 96 }
              as: Stylist
              as_user_id: "${sty_id}"
          assert:
            - "Session.${sess_id}.charge_cents == 21000"
            - "Session.${sess_id}.charge_variant == FINAL"
            - "prov_charge (provisional at scheduling) == 18000, so final != provisional"

      - name: referral_credit_estimated_vs_realized
        grounds:
          - calculations.referral_credit
          - state_machines.Referral.SIGNED_UP_to_CREDITED
          - entities.Referral.fields.realized_credit_cents
        distinguishing_aspect: "Referral estimated_credit_cents is the flat 5000 at creation but realized_credit_cents is 1980 (0.10 * paid invoice 19800) at qualification; dual-variant logic on the Referral reward domain, a different entity domain than session cost."
        test_recipe:
          setup:
            - "Referrer client and referee client both registered; referral created (estimated 5000) and SIGNED_UP; referee has a HOURLY engagement with one COMPLETED session (charge 18000) and an ISSUED invoice total 19800."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /styling/stylists"
              payload: { full_name: "Bo Chic", email: "bo2@x.com", commission_pct: 0.40, tier: "LEAD" }
              as: PlatformAdmin
              captures: { sty_id: $.data.id }
            - call: "POST /styling/clients/register"
              payload: { full_name: "Rae Ferrer", email: "rae2@x.com" }
              as: Anonymous
              captures: { rer_id: $.data.id }
            - call: "POST /styling/clients/register"
              payload: { full_name: "Fee Ree", email: "fee2@x.com" }
              as: Anonymous
              captures: { ree_id: $.data.id }
            - call: "POST /styling/referrals"
              payload: { referrer_client_id: "${rer_id}", referee_email: "fee2@x.com" }
              as: Client
              as_user_id: "${rer_id}"
              captures: { refl_id: $.data.id, est_credit: $.data.estimated_credit_cents }
            - call: "POST /styling/referrals/${refl_id}/signup"
              payload: { referee_client_id: "${ree_id}" }
              as: PlatformAdmin
            - call: "POST /styling/clients/${ree_id}/assessments"
              payload: { body_type: "athletic", color_palette: "WARM", budget_band: "PREMIUM", lifestyle: "events" }
              as: Client
              as_user_id: "${ree_id}"
              captures: { as_id: $.data.id }
            - call: "POST /styling/assessments/${as_id}/complete"
              payload: {}
              as: Stylist
              as_user_id: "${sty_id}"
            - call: "POST /styling/engagements"
              payload: { client_id: "${ree_id}", stylist_id: "${sty_id}", mode: "HOURLY", block_rate_cents: 3000 }
              as: Client
              as_user_id: "${ree_id}"
              captures: { eng_id: $.data.id }
            - call: "POST /styling/engagements/${eng_id}/activate"
              payload: {}
              as: Client
              as_user_id: "${ree_id}"
              captures: { eng_v: $.data.version }
            - call: "POST /styling/engagements/${eng_id}/sessions"
              payload: { session_type: "CLOSET_AUDIT", modality: "IN_PERSON", scheduled_start: "2026-04-01T10:00:00Z", scheduled_end: "2026-04-01T11:30:00Z", expected_engagement_version: "${eng_v}" }
              as: Client
              as_user_id: "${ree_id}"
              captures: { sess_id: $.data.id }
            - call: "POST /styling/sessions/${sess_id}/confirm"
              payload: {}
              as: Stylist
              as_user_id: "${sty_id}"
            - call: "POST /styling/sessions/${sess_id}/complete"
              payload: { actual_minutes: 90 }
              as: Stylist
              as_user_id: "${sty_id}"
            - call: "POST /styling/engagements/${eng_id}/invoices"
              payload: {}
              as: PlatformAdmin
              captures: { inv_id: $.data.id, inv_total: $.data.total_cents }
          trigger:
            - call: "POST /styling/invoices/${inv_id}/pay"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Referral.${refl_id}.status == CREDITED"
            - "Referral.${refl_id}.realized_credit_cents == 1980"
            - "Referral.${refl_id}.estimated_credit_cents == 5000"
            - "inv_total == 19800 and realized (1980) != estimated (5000)"

  # ───────────────────────────── Rule 2 ─────────────────────────────
  - rule_id: combinatorial_formula
    instances:
      - name: retail_markup_tiered_then_commission_on_margin
        grounds:
          - calculations.retail_markup_and_commission
          - state_machines.PurchaseItem.null_to_PURCHASED
          - entities.PurchaseItem.fields.commission_cents
        distinguishing_aspect: "Mode (a): three interacting inputs — retail_cost band selects markup_pct (0.20 for 8000), marked_up_price=9600, then commission = round((9600-8000)*0.40)=640 on the margin; tiered-rate selection + margin scaling."
        test_recipe:
          setup:
            - "Stylist commission 0.40; client with COMPLETED assessment; HOURLY engagement ACTIVE; a SHOPPING session CONFIRMED."
          setup_api_calls:
            - call: "POST /styling/stylists"
              payload: { full_name: "Coco Style", email: "coco3@x.com", commission_pct: 0.40, tier: "SENIOR" }
              as: PlatformAdmin
              captures: { sty_id: $.data.id }
            - call: "POST /styling/clients/register"
              payload: { full_name: "Dee Shopper", email: "dee3@x.com" }
              as: Anonymous
              captures: { cl_id: $.data.id }
            - call: "POST /styling/clients/${cl_id}/assessments"
              payload: { body_type: "pear", color_palette: "NEUTRAL", budget_band: "PREMIUM", lifestyle: "casual" }
              as: Client
              as_user_id: "${cl_id}"
              captures: { as_id: $.data.id }
            - call: "POST /styling/assessments/${as_id}/complete"
              payload: {}
              as: Stylist
              as_user_id: "${sty_id}"
            - call: "POST /styling/engagements"
              payload: { client_id: "${cl_id}", stylist_id: "${sty_id}", mode: "HOURLY", block_rate_cents: 3000 }
              as: Client
              as_user_id: "${cl_id}"
              captures: { eng_id: $.data.id }
            - call: "POST /styling/engagements/${eng_id}/activate"
              payload: {}
              as: Client
              as_user_id: "${cl_id}"
              captures: { eng_v: $.data.version }
            - call: "POST /styling/engagements/${eng_id}/sessions"
              payload: { session_type: "SHOPPING", modality: "IN_PERSON", scheduled_start: "2026-04-02T10:00:00Z", scheduled_end: "2026-04-02T11:30:00Z", expected_engagement_version: "${eng_v}" }
              as: Client
              as_user_id: "${cl_id}"
              captures: { sess_id: $.data.id }
            - call: "POST /styling/sessions/${sess_id}/confirm"
              payload: {}
              as: Stylist
              as_user_id: "${sty_id}"
          trigger:
            - call: "POST /styling/sessions/${sess_id}/items"
              payload: { description: "wool blazer", retail_cost_cents: 8000 }
              as: Stylist
              as_user_id: "${sty_id}"
              captures: { item_id: $.data.id }
          assert:
            - "PurchaseItem.${item_id}.markup_pct == 0.20"
            - "PurchaseItem.${item_id}.marked_up_price_cents == 9600"
            - "PurchaseItem.${item_id}.commission_cents == 640"

      - name: invoice_styling_fee_round_per_line_then_sum
        grounds:
          - calculations.engagement_invoice_total
          - state_machines.Invoice.null_to_ISSUED
          - entities.Invoice.fields.styling_fee_cents
        distinguishing_aspect: "Mode (b): styling fee is round(line*0.10) PER LINE then summed. Lines [18000,333,333,333] give 1800+33+33+33=1899, which differs from round(18999*0.10)=1900; rounding order is load-bearing, a different combinatorial axis than the tiered-rate instance."
        test_recipe:
          setup:
            - "HOURLY engagement ACTIVE (block_rate 3000); one SHOPPING session CONFIRMED with three items of retail 256 (marked_up 333 each), then COMPLETED at actual 90 min (charge 18000). No wallet credit."
          setup_api_calls:
            - call: "POST /styling/stylists"
              payload: { full_name: "Eve Trend", email: "eve4@x.com", commission_pct: 0.40, tier: "JUNIOR" }
              as: PlatformAdmin
              captures: { sty_id: $.data.id }
            - call: "POST /styling/clients/register"
              payload: { full_name: "Fay Buyer", email: "fay4@x.com" }
              as: Anonymous
              captures: { cl_id: $.data.id }
            - call: "POST /styling/clients/${cl_id}/assessments"
              payload: { body_type: "rectangle", color_palette: "COOL", budget_band: "ECONOMY", lifestyle: "student" }
              as: Client
              as_user_id: "${cl_id}"
              captures: { as_id: $.data.id }
            - call: "POST /styling/assessments/${as_id}/complete"
              payload: {}
              as: Stylist
              as_user_id: "${sty_id}"
            - call: "POST /styling/engagements"
              payload: { client_id: "${cl_id}", stylist_id: "${sty_id}", mode: "HOURLY", block_rate_cents: 3000 }
              as: Client
              as_user_id: "${cl_id}"
              captures: { eng_id: $.data.id }
            - call: "POST /styling/engagements/${eng_id}/activate"
              payload: {}
              as: Client
              as_user_id: "${cl_id}"
              captures: { eng_v: $.data.version }
            - call: "POST /styling/engagements/${eng_id}/sessions"
              payload: { session_type: "SHOPPING", modality: "IN_PERSON", scheduled_start: "2026-04-03T10:00:00Z", scheduled_end: "2026-04-03T11:30:00Z", expected_engagement_version: "${eng_v}" }
              as: Client
              as_user_id: "${cl_id}"
              captures: { sess_id: $.data.id }
            - call: "POST /styling/sessions/${sess_id}/confirm"
              payload: {}
              as: Stylist
              as_user_id: "${sty_id}"
            - call: "POST /styling/sessions/${sess_id}/items"
              payload: { description: "scarf A", retail_cost_cents: 256 }
              as: Stylist
              as_user_id: "${sty_id}"
            - call: "POST /styling/sessions/${sess_id}/items"
              payload: { description: "scarf B", retail_cost_cents: 256 }
              as: Stylist
              as_user_id: "${sty_id}"
            - call: "POST /styling/sessions/${sess_id}/items"
              payload: { description: "scarf C", retail_cost_cents: 256 }
              as: Stylist
              as_user_id: "${sty_id}"
            - call: "POST /styling/sessions/${sess_id}/complete"
              payload: { actual_minutes: 90 }
              as: Stylist
              as_user_id: "${sty_id}"
          trigger:
            - call: "POST /styling/engagements/${eng_id}/invoices"
              payload: {}
              as: PlatformAdmin
              captures: { inv_id: $.data.id }
          assert:
            - "Invoice.${inv_id}.subtotal_cents == 18999"
            - "Invoice.${inv_id}.styling_fee_cents == 1899"
            - "Invoice.${inv_id}.volume_discount_cents == 0"
            - "Invoice.${inv_id}.total_cents == 20898"

  # ───────────────────────────── Rule 3 ─────────────────────────────
  - rule_id: non_linear_state_machine
    instances:
      - name: session_reschedule_confirmed_back_to_scheduled
        grounds:
          - state_machines.Session.CONFIRMED_to_SCHEDULED
          - entities.Session.fields.status
        distinguishing_aspect: "Session returns from CONFIRMED to SCHEDULED via reschedule (a cycle re-entering an earlier state) on the Session entity."
        test_recipe:
          setup:
            - "HOURLY engagement ACTIVE; session scheduled 2026-04-04 10:00-11:30 and CONFIRMED (client assessment COMPLETED)."
          setup_api_calls:
            - call: "POST /styling/stylists"
              payload: { full_name: "Gia Mode", email: "gia5@x.com", commission_pct: 0.30, tier: "SENIOR" }
              as: PlatformAdmin
              captures: { sty_id: $.data.id }
            - call: "POST /styling/clients/register"
              payload: { full_name: "Hana Loop", email: "hana5@x.com" }
              as: Anonymous
              captures: { cl_id: $.data.id }
            - call: "POST /styling/clients/${cl_id}/assessments"
              payload: { body_type: "apple", color_palette: "WARM", budget_band: "MID", lifestyle: "travel" }
              as: Client
              as_user_id: "${cl_id}"
              captures: { as_id: $.data.id }
            - call: "POST /styling/assessments/${as_id}/complete"
              payload: {}
              as: Stylist
              as_user_id: "${sty_id}"
            - call: "POST /styling/engagements"
              payload: { client_id: "${cl_id}", stylist_id: "${sty_id}", mode: "HOURLY", block_rate_cents: 3000 }
              as: Client
              as_user_id: "${cl_id}"
              captures: { eng_id: $.data.id }
            - call: "POST /styling/engagements/${eng_id}/activate"
              payload: {}
              as: Client
              as_user_id: "${cl_id}"
              captures: { eng_v: $.data.version }
            - call: "POST /styling/engagements/${eng_id}/sessions"
              payload: { session_type: "CLOSET_AUDIT", modality: "IN_PERSON", scheduled_start: "2026-04-04T10:00:00Z", scheduled_end: "2026-04-04T11:30:00Z", expected_engagement_version: "${eng_v}" }
              as: Client
              as_user_id: "${cl_id}"
              captures: { sess_id: $.data.id }
            - call: "POST /styling/sessions/${sess_id}/confirm"
              payload: {}
              as: Stylist
              as_user_id: "${sty_id}"
          trigger:
            - call: "POST /styling/sessions/${sess_id}/reschedule"
              payload: { scheduled_start: "2026-04-05T14:00:00Z", scheduled_end: "2026-04-05T15:30:00Z" }
              as: Client
              as_user_id: "${cl_id}"
          assert:
            - "Session.${sess_id}.status == SCHEDULED"
            - "Session.${sess_id}.estimated_blocks == 6"

      - name: lookbook_request_revision_delivered_back_to_draft
        grounds:
          - state_machines.Lookbook.DELIVERED_to_DRAFT
          - entities.Lookbook.fields.revision_round
        distinguishing_aspect: "Lookbook loops DELIVERED -> DRAFT on request-revision, incrementing revision_round; a cycle on a different entity (Lookbook) than the Session reschedule cycle."
        test_recipe:
          setup:
            - "HOURLY engagement ACTIVE; a lookbook created with one outfit and DELIVERED."
          setup_api_calls:
            - call: "POST /styling/stylists"
              payload: { full_name: "Ivy Look", email: "ivy6@x.com", commission_pct: 0.30, tier: "LEAD" }
              as: PlatformAdmin
              captures: { sty_id: $.data.id }
            - call: "POST /styling/clients/register"
              payload: { full_name: "Jo Book", email: "jo6@x.com" }
              as: Anonymous
              captures: { cl_id: $.data.id }
            - call: "POST /styling/engagements"
              payload: { client_id: "${cl_id}", stylist_id: "${sty_id}", mode: "HOURLY", block_rate_cents: 3000 }
              as: Client
              as_user_id: "${cl_id}"
              captures: { eng_id: $.data.id }
            - call: "POST /styling/engagements/${eng_id}/activate"
              payload: {}
              as: Client
              as_user_id: "${cl_id}"
            - call: "POST /styling/engagements/${eng_id}/lookbooks"
              payload: { title: "Spring Capsule" }
              as: Stylist
              as_user_id: "${sty_id}"
              captures: { lb_id: $.data.id }
            - call: "POST /styling/lookbooks/${lb_id}/outfits"
              payload: { name: "Look 1" }
              as: Stylist
              as_user_id: "${sty_id}"
            - call: "POST /styling/lookbooks/${lb_id}/deliver"
              payload: {}
              as: Stylist
              as_user_id: "${sty_id}"
          trigger:
            - call: "POST /styling/lookbooks/${lb_id}/request-revision"
              payload: { notes: "swap the outerwear" }
              as: Client
              as_user_id: "${cl_id}"
          assert:
            - "Lookbook.${lb_id}.status == DRAFT"
            - "Lookbook.${lb_id}.revision_round == 1"

  # ───────────────────────────── Rule 4 ─────────────────────────────
  - rule_id: transitive_cascade
    instances:
      - name: complete_session_fulfills_package_then_autocreates_lookbook
        grounds:
          - state_machines.Session.CONFIRMED_to_COMPLETED
          - state_machines.Engagement.ACTIVE_to_FULFILLED
          - entities.Lookbook.fields.status
        distinguishing_aspect: "Depth-3 chain from session completion: complete (A) -> engagement hours_consumed reaches package cap and Engagement ACTIVE->FULFILLED (B) -> that fulfillment auto-creates a DRAFT Lookbook (C); each link caused by the previous."
        test_recipe:
          setup:
            - "PACKAGE engagement package_blocks 6 (block_rate 3000) ACTIVE; client assessment COMPLETED; one 90-min session (estimated 6 blocks) scheduled (available 0) and CONFIRMED; no other sessions."
          setup_api_calls:
            - call: "POST /styling/stylists"
              payload: { full_name: "Kim Wardrobe", email: "kim7@x.com", commission_pct: 0.30, tier: "SENIOR" }
              as: PlatformAdmin
              captures: { sty_id: $.data.id }
            - call: "POST /styling/clients/register"
              payload: { full_name: "Lea Pack", email: "lea7@x.com" }
              as: Anonymous
              captures: { cl_id: $.data.id }
            - call: "POST /styling/clients/${cl_id}/assessments"
              payload: { body_type: "hourglass", color_palette: "COOL", budget_band: "LUXURY", lifestyle: "executive" }
              as: Client
              as_user_id: "${cl_id}"
              captures: { as_id: $.data.id }
            - call: "POST /styling/assessments/${as_id}/complete"
              payload: {}
              as: Stylist
              as_user_id: "${sty_id}"
            - call: "POST /styling/engagements"
              payload: { client_id: "${cl_id}", stylist_id: "${sty_id}", mode: "PACKAGE", block_rate_cents: 3000, package_blocks: 6, package_price_cents: 18000 }
              as: Client
              as_user_id: "${cl_id}"
              captures: { eng_id: $.data.id }
            - call: "POST /styling/engagements/${eng_id}/activate"
              payload: {}
              as: Client
              as_user_id: "${cl_id}"
              captures: { eng_v: $.data.version }
            - call: "POST /styling/engagements/${eng_id}/sessions"
              payload: { session_type: "CLOSET_AUDIT", modality: "IN_PERSON", scheduled_start: "2026-04-06T10:00:00Z", scheduled_end: "2026-04-06T11:30:00Z", expected_engagement_version: "${eng_v}" }
              as: Client
              as_user_id: "${cl_id}"
              captures: { sess_id: $.data.id }
            - call: "POST /styling/sessions/${sess_id}/confirm"
              payload: {}
              as: Stylist
              as_user_id: "${sty_id}"
          trigger:
            - call: "POST /styling/sessions/${sess_id}/complete"
              payload: { actual_minutes: 90 }
              as: Stylist
              as_user_id: "${sty_id}"
          assert:
            - "Engagement.${eng_id}.status == FULFILLED"
            - "Engagement.${eng_id}.hours_consumed_blocks == 6"
            - "Engagement.${eng_id}.hours_available_blocks == 0"
            - "GET /styling/engagements/${eng_id}/lookbooks returns exactly 1 Lookbook in status DRAFT (auto-created)"

      - name: pay_first_invoice_credits_referral_then_referrer_wallet
        grounds:
          - state_machines.Invoice.ISSUED_to_PAID
          - state_machines.Referral.SIGNED_UP_to_CREDITED
          - entities.Client.fields.wallet_credit_cents
        distinguishing_aspect: "Depth-3 chain from invoice payment (a different trigger than session completion): pay (A) -> referee's first PAID invoice flips has_paid_invoice and drives Referral SIGNED_UP->CREDITED (B) -> referrer Client.wallet_credit_cents += realized 1980 (C)."
        test_recipe:
          setup:
            - "Referrer client (wallet 0) and referee client; referral SIGNED_UP; referee has a HOURLY engagement with one COMPLETED session (charge 18000) and an ISSUED invoice total 19800; referee has no prior PAID invoice."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-20T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /styling/stylists"
              payload: { full_name: "Max Drape", email: "max8@x.com", commission_pct: 0.40, tier: "SENIOR" }
              as: PlatformAdmin
              captures: { sty_id: $.data.id }
            - call: "POST /styling/clients/register"
              payload: { full_name: "Nia Refer", email: "nia8@x.com" }
              as: Anonymous
              captures: { rer_id: $.data.id }
            - call: "POST /styling/clients/register"
              payload: { full_name: "Ola New", email: "ola8@x.com" }
              as: Anonymous
