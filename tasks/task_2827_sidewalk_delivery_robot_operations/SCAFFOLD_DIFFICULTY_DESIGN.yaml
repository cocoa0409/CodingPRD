            - "SegmentClosure CL on S3, closure_kind HARD, cause CONSTRUCTION, interval 08:00..12:00, driven to ACTIVE, so S3.status == BLOCKED and S3.blocked_by_closure_id == CL"
            - "the plan is untouched by the cascade because cascade link 3 only supersedes ACTIVE plans"
