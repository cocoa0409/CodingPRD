            - "GET /records/foia-requests?researcher_id=${res_ada} returns 0 rows and GET /records/declass-reviews?collection_id=${col_c2} returns 0 rows"

      - name: schedule_not_approved_and_not_permanent
        claim_type: Violation → Error
        grounds:
          - errors.ERR_SCHEDULE_NOT_APPROVED
          - errors.ERR_NOT_PERMANENT_DISPOSITION
          - validations[priority=13]
        distinguishing_aspect: "Transfers require an APPROVED PERMANENT schedule: a SUBMITTED schedule fails with ERR_SCHEDULE_NOT_APPROVED and a fully APPROVED TEMPORARY schedule fails with ERR_NOT_PERMANENT_DISPOSITION."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Agency DOJ with schedule SCH-DOJ-040 SUBMITTED (never decided) and TEMPORARY schedule SCH-DOJ-041 fully APPROVED."
          setup_api_calls:
