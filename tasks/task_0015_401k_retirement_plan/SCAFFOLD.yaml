scenario: |
  401(k) Retirement Plan Management: participant enrollment, contribution rate,
  employer match (Safe Harbor/tiered), vesting schedule (Cliff/Graded), plan loan,
  Hardship withdrawal, age-based RMD.

domain_name: retirement-plan-401k
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: pricing_engine
  complexity_layers:
    - cascading_side_effects
    - rate_threshold_triggers
    - derived_field_reconciliation
    - dual_variant_calculation

  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Plan
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Plan display name."
      - name: plan_year
        type: integer
        source: input
        description: "Calendar year the plan operates in (e.g., 2026)."
        constraints: "1900 <= plan_year <= 2999"
      - name: match_formula
        type: enum
        source: input
        description: "Employer match formula style applied to participant deferrals."
        constraints: "Values IN {TIERED, SAFE_HARBOR_ENHANCED}"
      - name: vesting_schedule
        type: enum
        source: input
        description: "Vesting style applied to employer match balances."
        constraints: "Values IN {CLIFF_3, GRADED_6}"
      - name: annual_compensation_limit_cents
        type: integer
        source: input
        description: "IRC §401(a)(17) compensation cap (integer cents). Compensation above this is excluded from match calculations."
        default: 34500000
      - name: annual_deferral_limit_cents
        type: integer
        source: input
        description: "IRC §402(g) elective deferral cap for participants under age 50 (integer cents)."
        default: 2300000
      - name: status
        type: enum
        source: system
        description: "Plan lifecycle state."
        default: DRAFT
        constraints: "Values IN {DRAFT, ACTIVE, FROZEN, TERMINATED}"

  - name: Participant
    parent: null
    common_fields: true
    fields:
      - name: plan_id
        type: string
        source: input
        description: "FK -> Plan.id; the plan this participant is enrolled in."
      - name: full_name
        type: string
        source: input
        description: "Participant legal name."
      - name: date_of_birth
        type: datetime
        source: input
        description: "Date of birth (ISO 8601, used for age-gating: catch-up eligibility >= 50, RMD age >= 73, hardship penalty < 59.5)."
      - name: hire_date
        type: datetime
        source: input
        description: "Date of hire (ISO 8601). Years of service for vesting are computed from this date against the current clock."
      - name: annual_compensation_cents
        type: integer
        source: input
        description: "Reported annual gross compensation in integer cents."
        constraints: "> 0"
      - name: deferral_rate_bps
        type: integer
        source: input
        description: "Elective deferral rate in basis points (e.g., 600 = 6.00% of comp)."
        default: 0
        constraints: "0 <= deferral_rate_bps <= 10000"
      - name: enrollment_status
        type: enum
        source: system
        description: "Lifecycle state of this participant's enrollment."
        default: PENDING
        constraints: "Values IN {PENDING, ENROLLED, SUSPENDED, TERMINATED}"
      - name: employee_balance_cents
        type: integer
        source: computed
        description: "Cumulative employee elective deferrals less withdrawals (integer cents). Recomputed on every ContributionPeriod close, Loan disbursement (no change), HardshipWithdrawal, and RMDDistribution."
        default: 0
      - name: employer_balance_cents
        type: integer
        source: computed
        description: "Cumulative employer match credited less withdrawals (integer cents). Recomputed on every ContributionPeriod close, HardshipWithdrawal, and RMDDistribution."
        default: 0
      - name: years_of_service
        type: integer
        source: computed
        description: "floor((current_clock - hire_date).days / 365) at the moment of any read or vesting-relevant operation."
        default: 0
      - name: vested_employer_balance_cents
        type: integer
        source: computed
        description: "employer_balance_cents * vesting_pct(years_of_service, plan.vesting_schedule). Recomputed on every employer_balance_cents change AND on the system YEAR_TICK transition."
        default: 0
      - name: outstanding_loan_principal_cents
        type: integer
        source: computed
        description: "Sum of Loan.outstanding_principal_cents for loans where status IN {DISBURSED}. Maintained on every Loan state change."
        default: 0

  - name: ContributionPeriod
    parent: null
    common_fields: true
    fields:
      - name: participant_id
        type: string
        source: input
        description: "FK -> Participant.id; the participant whose pay-period contribution this records."
      - name: period_end_date
        type: datetime
        source: input
        description: "ISO 8601 pay-period end date."
      - name: gross_compensation_cents
        type: integer
        source: input
        description: "Gross compensation paid this period (integer cents)."
        constraints: "> 0"
      - name: employee_contribution_cents
        type: integer
        source: computed
        description: "Employee elective deferral for this period: floor(gross_compensation_cents * participant.deferral_rate_bps / 10000), capped to remaining §402(g) headroom."
        default: 0
      - name: employer_match_cents
        type: integer
        source: computed
        description: "Employer match credited for this period per plan.match_formula. Computed by `tiered_employer_match` calculation. Variant is selected from plan.match_formula."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Period lifecycle."
        default: OPEN
        constraints: "Values IN {OPEN, CLOSED, REVERSED}"

  - name: Loan
    parent: null
    common_fields: true
    fields:
      - name: participant_id
        type: string
        source: input
        description: "FK -> Participant.id; the participant who borrowed."
      - name: principal_cents
        type: integer
        source: input
        description: "Loan principal requested (integer cents)."
        constraints: "> 0; <= floor(min(vested_balance/2, 5000000))"
      - name: term_months
        type: integer
        source: input
        description: "Loan term in months."
        constraints: "1 <= term_months <= 60 for general; <= 180 for primary-residence loans"
      - name: annual_interest_rate_bps
        type: integer
        source: input
        description: "Interest rate in basis points (e.g., 700 = 7.00%)."
        constraints: "0 < annual_interest_rate_bps <= 2500"
      - name: monthly_payment_cents
        type: integer
        source: computed
        description: "Standard amortized payment per period; computed by `loan_amortization` calc."
        default: 0
      - name: outstanding_principal_cents
        type: integer
        source: computed
        description: "Remaining principal balance after applied payments."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Loan lifecycle."
        default: REQUESTED
        constraints: "Values IN {REQUESTED, DISBURSED, REPAID, DEFAULTED}"

  - name: HardshipWithdrawal
    parent: null
    common_fields: true
    fields:
      - name: participant_id
        type: string
        source: input
        description: "FK -> Participant.id; the participant requesting hardship distribution."
      - name: requested_amount_cents
        type: integer
        source: input
        description: "Requested withdrawal amount (integer cents)."
        constraints: "> 0"
      - name: hardship_category
        type: enum
        source: input
        description: "IRS safe-harbor hardship reason."
        constraints: "Values IN {MEDICAL_EXPENSES, PRIMARY_RESIDENCE_PURCHASE, TUITION_PAYMENT, EVICTION_PREVENTION, FUNERAL_EXPENSES}"
      - name: approved_amount_cents
        type: integer
        source: computed
        description: "Final approved amount = min(requested_amount_cents, max_hardship_amount). Computed by `max_hardship_amount` calc."
        default: 0
      - name: ten_percent_penalty_cents
        type: integer
        source: computed
        description: "10% IRS early-withdrawal penalty applied only when participant age < 59.5 at time of approval; otherwise 0."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Withdrawal lifecycle."
        default: REQUESTED
        constraints: "Values IN {REQUESTED, APPROVED, DENIED, PAID}"

  - name: RMDDistribution
    parent: null
    common_fields: true
    fields:
      - name: participant_id
        type: string
        source: input
        description: "FK -> Participant.id; the participant subject to RMD."
      - name: distribution_year
        type: integer
        source: input
        description: "Calendar year the RMD is required for."
      - name: prior_year_end_balance_cents
        type: integer
        source: input
        description: "Plan-account balance as of Dec 31 of the prior year (integer cents). Stored as input snapshot to make the calculation deterministic and auditable."
        constraints: "> 0"
      - name: rmd_variant
        type: enum
        source: input
        description: "Which life-expectancy table to apply."
        constraints: "Values IN {UNIFORM_LIFETIME, JOINT_LIFE}"
      - name: spouse_date_of_birth
        type: datetime
        source: input
        description: "Spouse DOB; required when rmd_variant == JOINT_LIFE and spouse is more than 10 years younger; otherwise null."
        default: null
      - name: required_amount_cents
        type: integer
        source: computed
        description: "Computed RMD = floor(prior_year_end_balance_cents / life_expectancy_factor). Variant determines which factor table."
        default: 0
      - name: distributed_amount_cents
        type: integer
        source: input
        description: "Amount actually paid (integer cents). 0 until distribution is made; must equal required_amount_cents on PAID transition."
        default: 0
      - name: status
        type: enum
        source: system
        description: "RMD lifecycle."
        default: PENDING
        constraints: "Values IN {PENDING, PAID, MISSED}"

  - name: VestingEvent
    parent: null
    common_fields: false
    fields:
      - name: participant_id
        type: string
        source: input
        description: "FK -> Participant.id; the participant whose service tick this records."
      - name: as_of_date
        type: datetime
        source: input
        description: "Service-anniversary date this event was minted for. Append-only audit row."
      - name: years_of_service_after
        type: integer
        source: input
        description: "Snapshot of participant.years_of_service immediately after this tick."
      - name: vested_pct_bps_after
        type: integer
        source: input
        description: "Snapshot of vested percentage in basis points (e.g., 6000 = 60.00%) after the tick."

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Plan
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /plans/{id}/activate"
        actor: PlanAdmin
        preconditions:
          - "Plan has match_formula set"
          - "Plan has vesting_schedule set"
        side_effects:
          - "Plan.status -> ACTIVE; updated_at refreshed; version += 1"
      - from: ACTIVE
        to: FROZEN
        trigger: "POST /plans/{id}/freeze"
        actor: PlanAdmin
        preconditions: []
        side_effects:
          - "Plan.status -> FROZEN; updated_at refreshed; version += 1"
          - "All ContributionPeriods opened against this plan after freeze will be rejected by validation (state precondition: plan.status == ACTIVE)"
      - from: FROZEN
        to: ACTIVE
        trigger: "POST /plans/{id}/unfreeze"
        actor: PlanAdmin
        preconditions: []
        side_effects:
          - "Plan.status -> ACTIVE; updated_at refreshed; version += 1"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /plans/{id}/terminate"
        actor: PlanAdmin
        preconditions:
          - "expected_plan_version matches Plan.version"
        side_effects:
          - "Plan.status -> TERMINATED; version += 1"
          - "Cascade: for every Participant with enrollment_status IN {ENROLLED, SUSPENDED}, set enrollment_status -> TERMINATED and bump Participant.version (depth 2)"
          - "Cascade: for every Loan with status == DISBURSED on a terminated participant, status -> DEFAULTED; cascade-set Participant.outstanding_loan_principal_cents = 0 (depth 3)"

  - entity: Participant
    initial_state: PENDING
    terminal_states: [TERMINATED]
    transitions:
      - from: PENDING
        to: ENROLLED
        trigger: "POST /participants/{id}/enroll"
        actor: PlanAdmin
        preconditions:
          - "Plan referenced by participant.plan_id has status == ACTIVE (cross-entity)"
          - "participant.deferral_rate_bps has been set (> 0)"
        side_effects:
          - "enrollment_status -> ENROLLED; version += 1"
      - from: ENROLLED
        to: SUSPENDED
        trigger: "POST /participants/{id}/suspend"
        actor: PlanAdmin
        preconditions: []
        side_effects:
          - "enrollment_status -> SUSPENDED; version += 1"
          - "Future ContributionPeriod creates will be rejected (precondition: enrollment_status == ENROLLED)"
      - from: SUSPENDED
        to: ENROLLED
        trigger: "POST /participants/{id}/resume"
        actor: PlanAdmin
        preconditions:
          - "Plan.status == ACTIVE (cross-entity)"
        side_effects:
          - "enrollment_status -> ENROLLED; version += 1"
      - from: ENROLLED
        to: TERMINATED
        trigger: "POST /participants/{id}/terminate"
        actor: PlanAdmin
        preconditions: []
        side_effects:
          - "enrollment_status -> TERMINATED; version += 1"
          - "Cascade: any DISBURSED Loan on this participant -> DEFAULTED; Loan.version += 1 (depth 2 propagation chain)"
          - "Recompute participant.outstanding_loan_principal_cents (depth 3 — derived-field reconciliation downstream of the loan default)"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /participants/{id}/terminate"
        actor: PlanAdmin
        preconditions: []
        side_effects:
          - "enrollment_status -> TERMINATED; version += 1"

  - entity: ContributionPeriod
    initial_state: OPEN
    terminal_states: [CLOSED, REVERSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /contribution-periods/{id}/close"
        actor: PlanAdmin
        preconditions:
          - "Plan.status == ACTIVE (cross-entity)"
          - "Participant.enrollment_status == ENROLLED (cross-entity)"
        side_effects:
          - "Run `tiered_employer_match` -> sets ContributionPeriod.employer_match_cents"
          - "Cascade: Participant.employee_balance_cents += employee_contribution_cents (depth 2)"
          - "Cascade: Participant.employer_balance_cents += employer_match_cents (depth 2)"
          - "Cascade: Participant.vested_employer_balance_cents recomputed via `vested_balance` calc (depth 3, derived-field reconciliation)"
          - "ContributionPeriod.status -> CLOSED; version += 1"
      - from: CLOSED
        to: REVERSED
        trigger: "POST /contribution-periods/{id}/reverse"
        actor: PlanAdmin
        preconditions:
          - "Plan.status == ACTIVE (cross-entity)"
        side_effects:
          - "Compensating action: Participant.employee_balance_cents -= employee_contribution_cents"
          - "Compensating action: Participant.employer_balance_cents -= employer_match_cents"
          - "Participant.vested_employer_balance_cents recomputed"
          - "ContributionPeriod.status -> REVERSED; version += 1"
          - "Conservation invariant: sum(ContributionPeriod.employee_contribution_cents for status IN {CLOSED}) == Participant.employee_balance_cents at all times (the close+reverse pair leaves this invariant unchanged)"

  - entity: Loan
    initial_state: REQUESTED
    terminal_states: [REPAID, DEFAULTED]
    transitions:
      - from: REQUESTED
        to: DISBURSED
        trigger: "POST /loans/{id}/disburse"
        actor: PlanAdmin
        preconditions:
          - "Plan.status == ACTIVE (cross-entity)"
          - "Participant.enrollment_status == ENROLLED (cross-entity)"
          - "participant has zero other Loans with status == DISBURSED (one-loan-at-a-time rule)"
          - "principal_cents <= floor(min(participant.vested_employer_balance_cents + participant.employee_balance_cents) * 0.5, 5000000)"
        side_effects:
          - "Run `loan_amortization` -> sets monthly_payment_cents and outstanding_principal_cents = principal_cents"
          - "Cascade: participant.outstanding_loan_principal_cents = principal_cents (derived-field reconciliation, depth 2)"
          - "Loan.status -> DISBURSED; version += 1"
      - from: DISBURSED
        to: REPAID
        trigger: "POST /loans/{id}/repay"
        actor: PlanAdmin
        preconditions:
          - "amount_cents >= outstanding_principal_cents"
        side_effects:
          - "outstanding_principal_cents -> 0"
          - "Cascade: participant.outstanding_loan_principal_cents -= prior outstanding (depth 2)"
          - "Loan.status -> REPAID; version += 1"
      - from: DISBURSED
        to: DEFAULTED
        trigger: "POST /loans/{id}/default OR cascaded by Participant TERMINATE"
        actor: PlanAdmin | system
        preconditions: []
        side_effects:
          - "Cascade: participant.employer_balance_cents -= outstanding_principal_cents (deemed distribution against vested employer match); employee_balance_cents unaffected (depth 2)"
          - "Cascade: participant.vested_employer_balance_cents recomputed (depth 3 — derived field reconciles from new employer_balance_cents)"
          - "Cascade: participant.outstanding_loan_principal_cents -= prior outstanding (depth 2)"
          - "Loan.status -> DEFAULTED; version += 1"

  - entity: HardshipWithdrawal
    initial_state: REQUESTED
    terminal_states: [DENIED, PAID]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /hardship-withdrawals/{id}/approve"
        actor: PlanAdmin
        preconditions:
          - "Plan.status == ACTIVE (cross-entity)"
          - "Participant.enrollment_status IN {ENROLLED, SUSPENDED} (cross-entity)"
          - "Calculation `max_hardship_amount` > 0"
        side_effects:
          - "Run `max_hardship_amount` -> sets approved_amount_cents and ten_percent_penalty_cents"
          - "HardshipWithdrawal.status -> APPROVED; version += 1"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /hardship-withdrawals/{id}/deny"
        actor: PlanAdmin
        preconditions: []
        side_effects:
          - "HardshipWithdrawal.status -> DENIED; version += 1"
      - from: APPROVED
        to: PAID
        trigger: "POST /hardship-withdrawals/{id}/pay"
        actor: PlanAdmin
        preconditions: []
        side_effects:
          - "Cascade: participant.employee_balance_cents -= approved_amount_cents (deducted from employee deferrals first); shortfall taken from employer_balance_cents (depth 2)"
          - "Cascade: participant.vested_employer_balance_cents recomputed (depth 3 — derived-field reconciliation)"
          - "HardshipWithdrawal.status -> PAID; version += 1"

  - entity: RMDDistribution
    initial_state: PENDING
    terminal_states: [PAID, MISSED]
    transitions:
      - from: PENDING
        to: PAID
        trigger: "POST /rmd-distributions/{id}/pay"
        actor: PlanAdmin
        preconditions:
          - "Participant age (current_clock - participant.date_of_birth) >= 73 years"
          - "distributed_amount_cents == required_amount_cents"
        side_effects:
          - "Cascade: participant.employee_balance_cents and participant.employer_balance_cents reduced pro-rata by distributed_amount_cents (depth 2)"
          - "Cascade: participant.vested_employer_balance_cents recomputed (depth 3)"
          - "RMDDistribution.status -> PAID; version += 1"
      - from: PENDING
        to: MISSED
        trigger: "POST /rmd-distributions/{id}/mark-missed (or system YEAR_TICK after Dec 31 of distribution_year)"
        actor: PlanAdmin | system
        preconditions: []
        side_effects:
          - "RMDDistribution.status -> MISSED; version += 1"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: plan-terminate-stale-version
    parent_entity: Plan
    write_endpoint: "POST /plans/{id}/terminate"
    occ_field: "expected_plan_version"
    description: |
      Terminating a Plan whose version has advanced since the client last
      observed it is rejected with ERR_STALE_VERSION. This captures the case
      where another administrator has frozen/unfrozen/edited the plan (which
      legitimately changes plan posture between observation and the termination
      request) and the terminator's view is therefore stale. Two strictly
      sequential requests reproduce the rejection: the first request must
      legitimately change the plan version (e.g. freeze), and the second
      termination request still carries the pre-freeze expected_plan_version.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: tiered_employer_match
    trigger: "ContributionPeriod OPEN -> CLOSED transition (POST /contribution-periods/{id}/close)"
    algorithm: tiered_pricing
    formula: |
      # All math in integer cents.
      capped_comp = min(period.gross_compensation_cents,
                       floor(plan.annual_compensation_limit_cents / 26))   # bi-weekly slice
      deferral_amt = floor(capped_comp * participant.deferral_rate_bps / 10000)

      if plan.match_formula == TIERED:
          # 100% on first 3%, 50% on next 2%
          tier1_pct_bps = min(participant.deferral_rate_bps, 300)
          tier2_pct_bps = min(max(0, participant.deferral_rate_bps - 300), 200)
          tier1_match  = floor(capped_comp * tier1_pct_bps / 10000)
          tier2_match  = floor(capped_comp * tier2_pct_bps / 10000) // 2
          employer_match_cents = tier1_match + tier2_match
      else:  # SAFE_HARBOR_ENHANCED
          # 100% on first 4%, nothing thereafter
          eff_pct_bps = min(participant.deferral_rate_bps, 400)
          employer_match_cents = floor(capped_comp * eff_pct_bps / 10000)

      employee_contribution_cents = deferral_amt
      return (employee_contribution_cents, employer_match_cents)
    input_set: "ContributionPeriod (this period only); participant.deferral_rate_bps as of period close; plan.annual_compensation_limit_cents; plan.match_formula"
    constants:
      BIWEEKLY_DIVISOR: 26
      TIER1_MAX_BPS: 300
      TIER1_RATE_BPS: 10000
      TIER2_MAX_BPS: 200
      TIER2_RATE_BPS: 5000
      SAFE_HARBOR_MAX_BPS: 400
    precision: "integer cents; floor() at each multiply; tiers summed AFTER each tier's individual floor (ordering pinned per §1.3 boundary-precision rule (b))"
    variants:
      - name: tiered_formula
        when: "plan.match_formula == TIERED"
        difference: "100% on first 3%, 50% on next 2%; max effective rate 4% of comp"
      - name: safe_harbor_enhanced
        when: "plan.match_formula == SAFE_HARBOR_ENHANCED"
        difference: "100% on first 4%, 0% thereafter; max effective rate 4% of comp; same upper bound but different curvature: TIERED at deferral 5% = 4%, SAFE_HARBOR at deferral 5% = 4%, but TIERED at deferral 4% = 3.5% while SAFE_HARBOR at deferral 4% = 4% — divergent for identical inputs"

  - name: rmd_required_distribution
    trigger: "POST /rmd-distributions (RMDDistribution creation)"
    algorithm: threshold
    formula: |
      age_at_year_end = (datetime(distribution_year, 12, 31) - participant.date_of_birth).days // 365
      if age_at_year_end < 73:
          raise ERR_RMD_NOT_REQUIRED

      if rmd_variant == UNIFORM_LIFETIME:
          factor = UNIFORM_LIFETIME_TABLE[age_at_year_end]
      else:  # JOINT_LIFE
          spouse_age = (datetime(distribution_year, 12, 31) - spouse_date_of_birth).days // 365
          if (age_at_year_end - spouse_age) <= 10:
              raise ERR_JOINT_LIFE_INELIGIBLE
          factor = JOINT_LIFE_TABLE[age_at_year_end][spouse_age]

      required_amount_cents = floor(prior_year_end_balance_cents * 1000000 / floor(factor * 1000000))
    input_set: "RMDDistribution (single row); UNIFORM_LIFETIME_TABLE or JOINT_LIFE_TABLE constants"
    constants:
      UNIFORM_LIFETIME_TABLE:
        73: 26.5
        74: 25.5
        75: 24.6
        80: 20.2
        85: 16.0
      JOINT_LIFE_TABLE:
        # representative entries; full table in PRD
        "73,60": 27.4
        "73,55": 30.7
        "80,65": 22.6
      AGE_RMD_TRIGGER: 73
      AGE_GAP_THRESHOLD_FOR_JOINT_LIFE: 10
    precision: "integer cents; floor() at the final divide. Intermediate factor stored as fixed-point 1e6 to keep arithmetic in integers."
    variants:
      - name: uniform_lifetime
        when: "rmd_variant == UNIFORM_LIFETIME"
        difference: "Uses IRS Uniform Lifetime Table indexed by participant age only."
      - name: joint_life
        when: "rmd_variant == JOINT_LIFE AND (participant_age - spouse_age) > 10"
        difference: "Uses Joint Life Table indexed by (participant_age, spouse_age) — produces a LARGER factor and therefore a SMALLER required_amount_cents for the same prior_year_end_balance_cents. Same inputs (balance) -> different result."

  - name: vested_balance
    trigger: "Any change to Participant.employer_balance_cents OR system YEAR_TICK transition"
    algorithm: constraint_propagation
    formula: |
      yos = participant.years_of_service

      if plan.vesting_schedule == CLIFF_3:
          # 0% before 3 years, 100% at or after 3 years
          vested_pct_bps = 0 if yos < 3 else 10000
      else:  # GRADED_6
          # 0/20/40/60/80/100 at 1/2/3/4/5/6 years
          GRADED_TABLE = {0:0, 1:2000, 2:4000, 3:6000, 4:8000, 5:10000}
          # at 6+ years all GRADED participants are fully vested
          vested_pct_bps = 10000 if yos >= 6 else GRADED_TABLE[yos]

      vested_employer_balance_cents = floor(employer_balance_cents * vested_pct_bps / 10000)

      # Evaluation order (circular-looking):
      # employer_balance_cents is updated FIRST by the triggering side-effect
      # (e.g. ContributionPeriod close, Loan default, HardshipWithdrawal pay);
      # vested_balance is recomputed STRICTLY AFTER (depth 3 in those cascades).
      return vested_employer_balance_cents
    input_set: "participant.employer_balance_cents (post-cascade), participant.years_of_service, plan.vesting_schedule"
    constants:
      CLIFF_YEARS: 3
      GRADED_PCT_AT_YOS:
        0: 0
        1: 2000
        2: 4000
        3: 6000
        4: 8000
        5: 10000
        6: 10000
    precision: "integer cents; floor() at the percentage multiply"

  - name: loan_amortization
    trigger: "Loan REQUESTED -> DISBURSED transition (POST /loans/{id}/disburse)"
    algorithm: tiered_pricing
    formula: |
      # Standard amortization with rounding-order pinned: per-payment floor THEN sum.
      r_monthly = loan.annual_interest_rate_bps / 10000 / 12   # decimal monthly rate
      n = loan.term_months
      P = loan.principal_cents

      # monthly payment formula, with rounding ORDER pinned:
      #   compute raw_payment = P * r * (1+r)^n / ((1+r)^n - 1)
      #   monthly_payment_cents = ceil(raw_payment)  # ceil so the loan repays fully
      raw_payment = (P * r_monthly * pow(1 + r_monthly, n)) / (pow(1 + r_monthly, n) - 1)
      monthly_payment_cents = ceil(raw_payment)

      outstanding_principal_cents = P
      return monthly_payment_cents
    input_set: "Loan.principal_cents, Loan.term_months, Loan.annual_interest_rate_bps"
    constants:
      MONTHS_PER_YEAR: 12
      MAX_GENERAL_TERM_MONTHS: 60
      MAX_PRIMARY_RESIDENCE_TERM_MONTHS: 180
    precision: "Integer cents. Rounding ORDER pinned (ceil at the per-payment scalar, NOT sum-then-ceil). Reversing the order yields a different total interest and is forbidden."

  - name: max_hardship_amount
    trigger: "HardshipWithdrawal REQUESTED -> APPROVED transition (POST /hardship-withdrawals/{id}/approve)"
    algorithm: threshold
    formula: |
      vested_total = participant.employee_balance_cents + participant.vested_employer_balance_cents
      cap_a = floor(vested_total * 0.5) - participant.outstanding_loan_principal_cents
      cap_b = HARDSHIP_HARD_CAP_CENTS
      cap_c = hardship.requested_amount_cents

      approved_amount_cents = max(0, min(cap_a, cap_b, cap_c))

      # Penalty
      age_today_years = floor((current_clock - participant.date_of_birth).days / 365)
      if age_today_years < AGE_PENALTY_THRESHOLD:
          ten_percent_penalty_cents = floor(approved_amount_cents * 0.10)
      else:
          ten_percent_penalty_cents = 0

      return (approved_amount_cents, ten_percent_penalty_cents)
    input_set: "participant.employee_balance_cents, participant.vested_employer_balance_cents (NOT raw employer_balance), participant.outstanding_loan_principal_cents, hardship.requested_amount_cents, participant age relative to AGE_PENALTY_THRESHOLD"
    constants:
      HARDSHIP_HARD_CAP_CENTS: 5000000
      AGE_PENALTY_THRESHOLD: 59
      VESTED_FRACTION_BPS: 5000
    precision: "integer cents; floor() at each multiply; max(0, ...) so a negative cap_a never produces a negative approval"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and X-User-ID header present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Acting role is permitted for this operation per §1.7"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path-templated parent resources exist (left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 4
    category: state
    check: "Target resource is in a state from which this transition is permitted by §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all"

  - priority: 5
    category: state
    check: "Optimistic-concurrency parent version: expected_plan_version (if required by §1.2.1) must equal current Plan.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: ["POST /plans/{id}/terminate"]

  - priority: 6
    category: business_safety
    check: "RMD trigger: participant age at distribution_year_end must be >= 73; otherwise reject."
    error_id: ERR_RMD_NOT_REQUIRED
    http_status: 422
    applies_to: ["POST /rmd-distributions"]

  - priority: 7
    category: business_safety
    check: "Joint Life RMD variant requires spouse > 10 years younger than participant; otherwise reject with ERR_JOINT_LIFE_INELIGIBLE"
    error_id: ERR_JOINT_LIFE_INELIGIBLE
    http_status: 422
    applies_to: ["POST /rmd-distributions"]

  - priority: 8
    category: business_safety
    check: "Hardship approval requires max_hardship_amount > 0 AND hardship_category IN the IRS safe-harbor enum"
    error_id: ERR_NO_HARDSHIP_HEADROOM
    http_status: 422
    applies_to: ["POST /hardship-withdrawals/{id}/approve"]

  - priority: 9
    category: business_constraint
    check: "Participant may not have more than ONE Loan with status == DISBURSED at any time"
    error_id: ERR_LOAN_ALREADY_OUTSTANDING
    http_status: 409
    applies_to: ["POST /loans/{id}/disburse"]

  - priority: 10
    category: business_fiscal
    check: "Loan principal_cents <= floor(min((participant.employee_balance_cents + participant.vested_employer_balance_cents) * 0.5, 5000000))"
    error_id: ERR_LOAN_EXCEEDS_LIMIT
    http_status: 422
    applies_to: ["POST /loans/{id}/disburse"]

  - priority: 11
    category: business_fiscal
    check: "Cumulative employee contributions in plan_year must not exceed plan.annual_deferral_limit_cents (catch-up not yet implemented at this layer)"
    error_id: ERR_DEFERRAL_LIMIT_EXCEEDED
    http_status: 422
    applies_to: ["POST /contribution-periods/{id}/close"]

  - priority: 12
    category: business_temporal
    check: "Loan disburse: participant has no other Loan whose active interval [disbursed_at, terminal_at) overlaps with this loan's disbursement; semantically equivalent here to 'no other DISBURSED loan exists'. Half-open interval: disbursement is inclusive, terminal (REPAID/DEFAULTED) is exclusive."
    error_id: ERR_LOAN_ALREADY_OUTSTANDING
    http_status: 409
    applies_to: ["POST /loans/{id}/disburse"]

  - priority: 13
    category: business_temporal
    check: "RMDDistribution per-year uniqueness: (participant_id, distribution_year) must be unique. Year is a closed discrete bucket (different interval semantics than loan's continuous half-open interval)."
    error_id: ERR_DUPLICATE_RMD_YEAR
    http_status: 409
    applies_to: ["POST /rmd-distributions"]

  - priority: 14
    category: business_referential
    check: "ContributionPeriod.participant_id, Loan.participant_id, HardshipWithdrawal.participant_id, RMDDistribution.participant_id, VestingEvent.participant_id, Participant.plan_id must reference existing entities"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: ["POST /contribution-periods", "POST /loans", "POST /hardship-withdrawals", "POST /rmd-distributions", "POST /vesting-events", "POST /participants"]

  - priority: 15
    category: business_constraint
    check: "Required input fields per §1.5 are present and pass type checks (enums in declared set, integers >= 0 unless otherwise specified)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ----- Plan -----
  - method: POST
    path: "/plans"
    description: "Create a Plan in DRAFT state."
    roles: [PlanAdmin]
    code: 201
    input: [name, plan_year, match_formula, vesting_schedule, "annual_compensation_limit_cents?", "annual_deferral_limit_cents?"]
    output: Plan
    side_effects: ["Plan created in DRAFT; version=1"]

  - method: GET
    path: "/plans/{id}"
    description: "Retrieve Plan by id."
    roles: [PlanAdmin, Custodian]
    code: 200
    input: []
    output: Plan
    side_effects: []

  - method: GET
    path: "/plans"
    description: "List plans with pagination."
    roles: [PlanAdmin, Custodian]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: Plan[]
    side_effects: []

  - method: POST
    path: "/plans/{id}/activate"
    description: "Transition Plan DRAFT -> ACTIVE."
    roles: [PlanAdmin]
    code: 200
    input: []
    output: Plan
    side_effects: ["Plan.status -> ACTIVE; Plan.version += 1"]

  - method: POST
    path: "/plans/{id}/freeze"
    description: "Transition Plan ACTIVE -> FROZEN."
    roles: [PlanAdmin]
    code: 200
    input: []
    output: Plan
    side_effects: ["Plan.status -> FROZEN; Plan.version += 1"]

  - method: POST
    path: "/plans/{id}/unfreeze"
    description: "Transition Plan FROZEN -> ACTIVE."
    roles: [PlanAdmin]
    code: 200
    input: []
    output: Plan
    side_effects: ["Plan.status -> ACTIVE; Plan.version += 1"]

  - method: POST
    path: "/plans/{id}/terminate"
    description: "Transition Plan ACTIVE -> TERMINATED; cascades Participant TERMINATE for non-terminal participants; cascades Loan DEFAULT for DISBURSED loans."
    roles: [PlanAdmin]
    code: 200
    input: [expected_plan_version]
    output: Plan
    side_effects:
      - "Plan.status -> TERMINATED"
      - "Plan.version += 1"
      - "Cascade depth 2: each non-terminal Participant -> TERMINATED, Participant.version += 1"
      - "Cascade depth 3: each DISBURSED Loan on terminated participants -> DEFAULTED, Loan.version += 1, Participant.outstanding_loan_principal_cents recomputed"

  # ----- Participant -----
  - method: POST
    path: "/participants"
    description: "Create a Participant (PENDING)."
    roles: [PlanAdmin]
    code: 201
    input: [plan_id, full_name, date_of_birth, hire_date, annual_compensation_cents, "deferral_rate_bps?"]
    output: Participant
    side_effects: ["Participant created in PENDING"]

  - method: GET
    path: "/participants/{id}"
    description: "Retrieve Participant by id."
    roles: [PlanAdmin, Custodian, Participant]
    code: 200
    input: []
    output: Participant
    side_effects: []

  - method: GET
    path: "/participants"
    description: "List participants (filtered by plan_id) with pagination."
    roles: [PlanAdmin, Custodian]
    code: 200
    input: ["limit?", "offset?", "plan_id?", "enrollment_status?"]
    output: Participant[]
    side_effects: []

  - method: PATCH
    path: "/participants/{id}/deferral-rate"
    description: "Adjust deferral_rate_bps."
    roles: [PlanAdmin, Participant]
    code: 200
    input: [deferral_rate_bps]
    output: Participant
    side_effects: ["Participant.deferral_rate_bps updated; Participant.version += 1"]

  - method: POST
    path: "/participants/{id}/enroll"
    description: "Transition Participant PENDING -> ENROLLED."
    roles: [PlanAdmin]
    code: 200
    input: []
    output: Participant
    side_effects: ["enrollment_status -> ENROLLED; version += 1"]

  - method: POST
    path: "/participants/{id}/suspend"
    description: "Transition Participant ENROLLED -> SUSPENDED."
    roles: [PlanAdmin]
    code: 200
    input: []
    output: Participant
    side_effects: ["enrollment_status -> SUSPENDED; version += 1"]

  - method: POST
    path: "/participants/{id}/resume"
    description: "Transition Participant SUSPENDED -> ENROLLED."
    roles: [PlanAdmin]
    code: 200
    input: []
    output: Participant
    side_effects: ["enrollment_status -> ENROLLED; version += 1"]

  - method: POST
    path: "/participants/{id}/terminate"
    description: "Transition Participant ENROLLED|SUSPENDED -> TERMINATED; cascades Loan DEFAULT."
    roles: [PlanAdmin]
    code: 200
    input: []
    output: Participant
    side_effects: ["enrollment_status -> TERMINATED; cascade: DISBURSED Loans -> DEFAULTED (depth 2); Participant.outstanding_loan_principal_cents recomputed (depth 3)"]

  # ----- ContributionPeriod -----
  - method: POST
    path: "/contribution-periods"
    description: "Create a ContributionPeriod (OPEN)."
    roles: [PlanAdmin]
    code: 201
    input: [participant_id, period_end_date, gross_compensation_cents]
    output: ContributionPeriod
    side_effects: ["ContributionPeriod created in OPEN"]

  - method: GET
    path: "/contribution-periods/{id}"
    description: "Retrieve a ContributionPeriod."
    roles: [PlanAdmin, Custodian, Participant]
    code: 200
    input: []
    output: ContributionPeriod
    side_effects: []

  - method: GET
    path: "/contribution-periods"
    description: "List contribution periods filtered by participant."
    roles: [PlanAdmin, Custodian, Participant]
    code: 200
    input: ["limit?", "offset?", "participant_id?", "status?"]
    output: ContributionPeriod[]
    side_effects: []

  - method: POST
    path: "/contribution-periods/{id}/close"
    description: "Transition OPEN -> CLOSED: run tiered_employer_match, update participant balances and vested_employer_balance."
    roles: [PlanAdmin]
    code: 200
    input: []
    output: ContributionPeriod
    side_effects:
      - "Compute employee_contribution_cents and employer_match_cents via `tiered_employer_match`"
      - "Cascade depth 2: Participant.employee_balance_cents += employee_contribution_cents; Participant.employer_balance_cents += employer_match_cents"
      - "Cascade depth 3: Participant.vested_employer_balance_cents recomputed (derived-field reconciliation)"
      - "ContributionPeriod.status -> CLOSED; version += 1"

  - method: POST
    path: "/contribution-periods/{id}/reverse"
    description: "Transition CLOSED -> REVERSED: compensating action that subtracts contributions and recomputes vested balance, preserving conservation invariant."
    roles: [PlanAdmin]
    code: 200
    input: []
    output: ContributionPeriod
    side_effects:
      - "Participant.employee_balance_cents -= employee_contribution_cents"
      - "Participant.employer_balance_cents -= employer_match_cents"
      - "Participant.vested_employer_balance_cents recomputed"
      - "ContributionPeriod.status -> REVERSED; version += 1"

  # ----- Loan -----
  - method: POST
    path: "/loans"
    description: "Create a Loan (REQUESTED)."
    roles: [PlanAdmin]
    code: 201
    input: [participant_id, principal_cents, term_months, annual_interest_rate_bps]
    output: Loan
    side_effects: ["Loan created in REQUESTED"]

  - method: GET
    path: "/loans/{id}"
    description: "Retrieve a Loan."
    roles: [PlanAdmin, Custodian, Participant]
    code: 200
    input: []
    output: Loan
    side_effects: []

  - method: GET
    path: "/loans"
    description: "List loans filtered by participant."
    roles: [PlanAdmin, Custodian, Participant]
    code: 200
    input: ["limit?", "offset?", "participant_id?", "status?"]
    output: Loan[]
    side_effects: []

  - method: POST
    path: "/loans/{id}/disburse"
    description: "Transition Loan REQUESTED -> DISBURSED; run loan_amortization; update participant outstanding."
    roles: [PlanAdmin]
    code: 200
    input: []
    output: Loan
    side_effects:
      - "Compute monthly_payment_cents via `loan_amortization`"
      - "outstanding_principal_cents = principal_cents"
      - "Cascade depth 2: Participant.outstanding_loan_principal_cents += principal_cents (derived-field reconciliation)"
      - "Loan.status -> DISBURSED; version += 1"

  - method: POST
    path: "/loans/{id}/repay"
    description: "Transition Loan DISBURSED -> REPAID (full payoff)."
    roles: [PlanAdmin, Participant]
    code: 200
    input: [amount_cents]
    output: Loan
    side_effects:
      - "outstanding_principal_cents -> 0"
      - "Cascade depth 2: Participant.outstanding_loan_principal_cents -= prior outstanding"
      - "Loan.status -> REPAID; version += 1"

  - method: POST
    path: "/loans/{id}/default"
    description: "Transition Loan DISBURSED -> DEFAULTED (operator-initiated)."
    roles: [PlanAdmin]
    code: 200
    input: []
    output: Loan
    side_effects:
      - "Cascade depth 2: Participant.employer_balance_cents -= outstanding_principal_cents (deemed distribution)"
      - "Cascade depth 3: Participant.vested_employer_balance_cents recomputed (derived-field reconciliation)"
      - "Cascade depth 2: Participant.outstanding_loan_principal_cents -= prior outstanding"
      - "Loan.status -> DEFAULTED; version += 1"

  # ----- HardshipWithdrawal -----
  - method: POST
    path: "/hardship-withdrawals"
    description: "Create a HardshipWithdrawal (REQUESTED)."
    roles: [PlanAdmin, Participant]
    code: 201
    input: [participant_id, requested_amount_cents, hardship_category]
    output: HardshipWithdrawal
    side_effects: ["HardshipWithdrawal created in REQUESTED"]

  - method: GET
    path: "/hardship-withdrawals/{id}"
    description: "Retrieve a hardship withdrawal."
    roles: [PlanAdmin, Custodian, Participant]
    code: 200
    input: []
    output: HardshipWithdrawal
    side_effects: []

  - method: GET
    path: "/hardship-withdrawals"
    description: "List hardship withdrawals filtered by participant."
    roles: [PlanAdmin, Custodian, Participant]
    code: 200
    input: ["limit?", "offset?", "participant_id?", "status?"]
    output: HardshipWithdrawal[]
    side_effects: []

  - method: POST
    path: "/hardship-withdrawals/{id}/approve"
    description: "Transition REQUESTED -> APPROVED; run max_hardship_amount."
    roles: [PlanAdmin]
    code: 200
    input: []
    output: HardshipWithdrawal
    side_effects:
      - "Compute approved_amount_cents and ten_percent_penalty_cents via `max_hardship_amount`"
      - "HardshipWithdrawal.status -> APPROVED; version += 1"

  - method: POST
    path: "/hardship-withdrawals/{id}/deny"
    description: "Transition REQUESTED -> DENIED."
    roles: [PlanAdmin]
    code: 200
    input: []
    output: HardshipWithdrawal
    side_effects: ["HardshipWithdrawal.status -> DENIED; version += 1"]

  - method: POST
    path: "/hardship-withdrawals/{id}/pay"
    description: "Transition APPROVED -> PAID; debit participant balances."
    roles: [PlanAdmin]
    code: 200
    input: []
    output: HardshipWithdrawal
    side_effects:
      - "Cascade depth 2: Participant.employee_balance_cents -= approved_amount_cents (employee deferrals first; shortfall from employer_balance_cents)"
      - "Cascade depth 3: Participant.vested_employer_balance_cents recomputed"
      - "HardshipWithdrawal.status -> PAID; version += 1"

  # ----- RMDDistribution -----
  - method: POST
    path: "/rmd-distributions"
    description: "Create RMDDistribution (PENDING); runs rmd_required_distribution to set required_amount_cents."
    roles: [PlanAdmin]
    code: 201
    input: [participant_id, distribution_year, prior_year_end_balance_cents, rmd_variant, "spouse_date_of_birth?"]
    output: RMDDistribution
    side_effects: ["Compute required_amount_cents via `rmd_required_distribution`; RMDDistribution created in PENDING"]

  - method: GET
    path: "/rmd-distributions/{id}"
    description: "Retrieve an RMDDistribution."
    roles: [PlanAdmin, Custodian, Participant]
    code: 200
    input: []
    output: RMDDistribution
    side_effects: []

  - method: GET
    path: "/rmd-distributions"
    description: "List RMD distributions filtered by participant."
    roles: [PlanAdmin, Custodian, Participant]
    code: 200
    input: ["limit?", "offset?", "participant_id?", "status?", "distribution_year?"]
    output: RMDDistribution[]
    side_effects: []

  - method: POST
    path: "/rmd-distributions/{id}/pay"
    description: "Transition PENDING -> PAID; debit participant balances pro-rata."
    roles: [PlanAdmin]
    code: 200
    input: [distributed_amount_cents]
    output: RMDDistribution
    side_effects:
      - "Cascade depth 2: Participant.employee_balance_cents and employer_balance_cents reduced pro-rata"
      - "Cascade depth 3: Participant.vested_employer_balance_cents recomputed"
      - "RMDDistribution.status -> PAID; version += 1"

  - method: POST
    path: "/rmd-distributions/{id}/mark-missed"
    description: "Transition PENDING -> MISSED (operator or year-tick)."
    roles: [PlanAdmin]
    code: 200
    input: []
    output: RMDDistribution
    side_effects: ["RMDDistribution.status -> MISSED; version += 1"]

  # ----- VestingEvent -----
  - method: POST
    path: "/vesting-events"
    description: "Append a VestingEvent (immutable; common_fields:false)."
    roles: [PlanAdmin]
    code: 201
    input: [participant_id, as_of_date, years_of_service_after, vested_pct_bps_after]
    output: VestingEvent
    side_effects: ["Event appended (immutable)"]

  - method: GET
    path: "/vesting-events/{id}"
    description: "Retrieve a VestingEvent by id (immutable append-only row)."
    roles: [PlanAdmin, Custodian, Participant]
    code: 200
    input: []
    output: VestingEvent
    side_effects: []

  - method: GET
    path: "/vesting-events"
    description: "List vesting events filtered by participant."
    roles: [PlanAdmin, Custodian, Participant]
    code: 200
    input: ["limit?", "offset?", "participant_id?"]
    output: VestingEvent[]
    side_effects: []

  # ----- Test-driving (system clock + system year-tick) -----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the system clock used for age calculations (RMD, hardship penalty, vesting) and for years_of_service."
    roles: [PlanAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["System clock advanced to the specified instant; years_of_service recomputed lazily on next read"]

  - method: POST
    path: "/_system/year-tick"
    description: "Test-driving endpoint: simulate the system YEAR_TICK that recomputes vested_employer_balance_cents and auto-marks overdue RMDs as MISSED."
    roles: [PlanAdmin]
    code: 200
    input: [as_of_year]
    output: null
    side_effects:
      - "For each ENROLLED|SUSPENDED Participant whose years_of_service crosses a vesting boundary, recompute vested_employer_balance_cents and append a VestingEvent"
      - "For each PENDING RMDDistribution where distribution_year < as_of_year, status -> MISSED"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or unparseable X-User-Role / X-User-ID header"

  - id: ERR_FORBIDDEN
    http: 403
    condition: "Acting role not permitted for this endpoint per §1.7"

  - id: ERR_NOT_FOUND
    http: 404
    condition: "Referenced resource (Plan, Participant, etc.) does not exist"

  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Required input field missing, type mismatch, or enum value outside declared set"

  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource is in a state from which the requested transition is not permitted by §1.2"

  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_plan_version supplied to POST /plans/{id}/terminate does not equal the current Plan.version"

  - id: ERR_LOAN_ALREADY_OUTSTANDING
    http: 409
    condition: "Disbursing a second Loan while the participant has any DISBURSED Loan"

  - id: ERR_LOAN_EXCEEDS_LIMIT
    http: 422
    condition: "Loan.principal_cents > floor(min((employee_balance + vested_employer_balance) * 0.5, 5_000_000_cents))"

  - id: ERR_DEFERRAL_LIMIT_EXCEEDED
    http: 422
    condition: "Closing a ContributionPeriod would push cumulative employee_contribution_cents in plan_year above plan.annual_deferral_limit_cents"

  - id: ERR_NO_HARDSHIP_HEADROOM
    http: 422
    condition: "Hardship approval requested but max_hardship_amount evaluates to 0"

  - id: ERR_RMD_NOT_REQUIRED
    http: 422
    condition: "RMDDistribution created for a participant whose age at distribution_year_end < 73"

  - id: ERR_JOINT_LIFE_INELIGIBLE
    http: 422
    condition: "rmd_variant == JOINT_LIFE but spouse is NOT more than 10 years younger than participant"

  - id: ERR_DUPLICATE_RMD_YEAR
    http: 409
    condition: "RMDDistribution already exists for (participant_id, distribution_year)"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlanAdmin
    description: "Operator who manages plan configuration, participants, contribution periods, loans, hardships, RMDs."
    identity: opaque
    exclusive_operations:
      - "POST /plans"
      - "POST /plans/{id}/activate"
      - "POST /plans/{id}/freeze"
      - "POST /plans/{id}/unfreeze"
      - "POST /plans/{id}/terminate"
      - "POST /participants"
      - "POST /participants/{id}/enroll"
      - "POST /participants/{id}/suspend"
      - "POST /participants/{id}/resume"
      - "POST /participants/{id}/terminate"
      - "POST /contribution-periods"
      - "POST /contribution-periods/{id}/close"
      - "POST /contribution-periods/{id}/reverse"
      - "POST /loans"
      - "POST /loans/{id}/disburse"
      - "POST /loans/{id}/default"
      - "POST /hardship-withdrawals/{id}/approve"
      - "POST /hardship-withdrawals/{id}/deny"
      - "POST /hardship-withdrawals/{id}/pay"
      - "POST /rmd-distributions"
      - "POST /rmd-distributions/{id}/pay"
      - "POST /rmd-distributions/{id}/mark-missed"
      - "POST /vesting-events"
      - "POST /_clock/set_current_utc"
      - "POST /_system/year-tick"
    shared_operations:
      - "GET /plans, /plans/{id}"
      - "GET /participants, /participants/{id}"
      - "GET /contribution-periods, /contribution-periods/{id}"
      - "GET /loans, /loans/{id}"
      - "GET /hardship-withdrawals, /hardship-withdrawals/{id}"
      - "GET /rmd-distributions, /rmd-distributions/{id}"
      - "GET /vesting-events"
      - "PATCH /participants/{id}/deferral-rate"
      - "POST /hardship-withdrawals"
      - "POST /loans/{id}/repay"

  - name: Participant
    description: "Plan participant; can self-service deferral rate, view own resources, request hardship, repay own loans."
    identity: "entity_backed:Participant"
    exclusive_operations: []
    shared_operations:
      - "GET /participants/{id} (own)"
      - "GET /contribution-periods, /contribution-periods/{id} (own)"
      - "GET /loans, /loans/{id} (own)"
      - "GET /hardship-withdrawals, /hardship-withdrawals/{id} (own)"
      - "GET /rmd-distributions, /rmd-distributions/{id} (own)"
      - "GET /vesting-events (own)"
      - "PATCH /participants/{id}/deferral-rate (own)"
      - "POST /hardship-withdrawals (own)"
      - "POST /loans/{id}/repay (own)"

  - name: Custodian
    description: "Third-party custodian / auditor with read access to plan financial state; no write authority."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "GET /plans, /plans/{id}"
      - "GET /participants, /participants/{id}"
      - "GET /contribution-periods, /contribution-periods/{id}"
      - "GET /loans, /loans/{id}"
      - "GET /hardship-withdrawals, /hardship-withdrawals/{id}"
      - "GET /rmd-distributions, /rmd-distributions/{id}"
      - "GET /vesting-events"
