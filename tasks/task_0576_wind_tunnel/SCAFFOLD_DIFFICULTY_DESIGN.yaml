            - call: "POST /sessions"
              payload: { tunnel_id: "${t_id}", start_utc: "2026-05-10T10:00:00Z", end_utc: "2026-05-10T10:30:00Z", capacity: 4 }
              as: FrontDesk
              captures: { s_id: $.data.id, s_v: $.data.version }
            - call: "POST /sessions/${s_id}/assign-instructor"
              payload: { instructor_id: "${i_id}", expected_session_version: "${s_v}" }
              as: FrontDesk
            - call: "POST /flights"
              payload: { booking_id: "${b_id}", session_id: "${s_id}", member_id: "${m_id}", scheduled_minutes: 2 }
              as: FrontDesk
              captures: { f_id: $.data.id }
          trigger:
            - call: "POST /flights/${f_id}/cancel"
              payload: {}
              as: FrontDesk
          assert:
            - "Session.${s_id}.seats_taken == 0"
            - "Session.${s_id}.seats_available == 4"
