  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across DIFFERENT interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: unit_single_commitment_no_overlap
        grounds:
          - validations[priority=11]
          - entities.Unit.fields.active_incident_id
          - entities.Unit.fields.status
          - errors[ERR_UNIT_NOT_AVAILABLE]
        distinguishing_aspect: |
          Unit-as-resource interval semantics: a Unit may hold at most ONE open commitment interval
          (from dispatch to clear) — exclusive occupancy with zero tolerance for any overlap; a second
          dispatch while the first interval is still open is rejected with ERR_UNIT_NOT_AVAILABLE.
        test_recipe:
          setup:
            - "POLICE agency, one PATROL unit DISPATCHED to incident A (commitment interval open). Second PENDING incident B."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-14T00:00:00Z" }
              as: SystemClock
            - call: "POST /agencies"
