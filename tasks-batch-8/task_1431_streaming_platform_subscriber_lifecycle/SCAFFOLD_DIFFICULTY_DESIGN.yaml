            - "err_id == ERR_INVALID_STATE (state check at priority 4 wins over business_constraint at priority 8)"

      - name: temporal_offer_expiry_beats_referential_consistency
        grounds:
          - validations[priority=6]
          - validations[priority=7]
        distinguishing_aspect: |
          business_temporal (priority 6) vs business_referential (priority 7)
          pairing. An accept call on an EXPIRED SaveOffer whose target_plan_id
