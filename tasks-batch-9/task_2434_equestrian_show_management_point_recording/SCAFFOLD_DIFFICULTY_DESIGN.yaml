            - "Class 101 booked into Ring A at 2026-09-10T14:00:00Z (29 estimated minutes), both officials assigned, an ACTIVE VETERINARIAN coverage shift spanning 12:00-20:00, logical clock at 2026-09-10T13:30:00Z."
