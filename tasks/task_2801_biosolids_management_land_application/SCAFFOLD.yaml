  # ------------------------------------------------- test-driving support endpoints
  - method: POST
    path: /_clock/set_current_utc
    description: "Set the server's logical clock, which is the single source of every timestamp comparison in this service (notice periods, reapplication buffers, agreement expiry, the 30-day complaint window). The clock starts at 2026-08-01T00:00:00Z on a fresh server and only ever moves when this endpoint is called. Setting the clock also runs the agreement expiry sweep, which is the only clock-driven transition in the system."
    roles: [FacilityOperator, ComplianceOfficer, Agronomist, LabAnalyst, Farmer, PublicLiaison]
    input: ["now"]
    output:
      now: string
      expired_agreement_count: integer
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST]
    side_effects:
      - "Sets the logical clock to `now`."
      - "Moves every ACTIVE FarmerAgreement whose term_end is at or before the new clock value to EXPIRED, incrementing each agreement version by 1, and reports how many were expired."
      - "Does not recompute the facility's 30-day substantiated complaint count; that count is refreshed only when a complaint is substantiated."

  - method: POST
    path: /_weather/observations
    description: "Post the current weather observation for a land application site, which is what makes weather-driven holds and clearances testable. weather_clearance_ok becomes true only when rainfall_in_24h < 0.50 AND forecast_rainfall_in_48h < 1.00 AND frozen_ground is false. observed_at defaults to the logical clock."
    roles: [FacilityOperator, Agronomist, ComplianceOfficer]
    input: ["site_id", "rainfall_in_24h", "forecast_rainfall_in_48h", "frozen_ground", "observed_at?"]
    output: LandApplicationSite
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_SITE_NOT_FOUND]
    side_effects:
      - "Writes latest_rainfall_in_24h, latest_forecast_rainfall_in_48h, latest_frozen_ground and latest_weather_observed_at on the site, re-derives weather_clearance_ok and increments the site version by 1."
      - "Does not by itself move any ApplicationEvent: a hold is placed or cleared explicitly through the weather-hold endpoint."

# =====================================================================
# §1.6 Error Catalog
# =====================================================================
errors:
  - error_id: ERR_UNAUTHENTICATED
    http_status: 401
    message: "Authentication headers are missing"
    trigger: "X-User-Role or X-User-ID absent or blank on any request"

  - error_id: ERR_UNAUTHORIZED
    http_status: 403
    message: "Role {role} may not perform this operation"
    trigger: "The caller's role is not listed in the endpoint's §1.5 roles"

  - error_id: ERR_ACTOR_NOT_PARTY
    http_status: 403
    message: "Caller is not the farmer named on agreement {agreement_id}"
    trigger: "A Farmer-actor call whose X-User-ID differs from FarmerAgreement.farmer_user_id"

  - error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    message: "Officer {user_id} certified batch {batch_id} and may not also close its application event"
    trigger: "POST /application-events/{eventId}/complete by the same X-User-ID recorded in SolidsBatch.certified_by_user_id"

  - error_id: ERR_INVALID_REQUEST
    http_status: 400
    message: "Request body is invalid: {detail}"
    trigger: "Missing required field, wrong type, unknown enum member, out-of-range number, non-ascending month list, window_end <= window_start, term_end <= term_start, return_at <= depart_at, or bad pagination"

  - error_id: ERR_FACILITY_NOT_FOUND
    http_status: 404
    message: "Treatment facility {facility_id} not found"
    trigger: "Unknown facilityId path segment or facility_id body field"

  - error_id: ERR_BATCH_NOT_FOUND
    http_status: 404
    message: "Solids batch {batch_id} not found"
    trigger: "Unknown batchId path segment or batch_id body field"

  - error_id: ERR_SITE_NOT_FOUND
    http_status: 404
    message: "Land application site {site_id} not found"
    trigger: "Unknown siteId path segment or site_id body field"

  - error_id: ERR_AGREEMENT_NOT_FOUND
    http_status: 404
    message: "Farmer agreement {agreement_id} not found"
    trigger: "Unknown agreementId path segment or agreement_id body field"

  - error_id: ERR_EVENT_NOT_FOUND
    http_status: 404
    message: "Application event {event_id} not found"
    trigger: "Unknown eventId path segment"

  - error_id: ERR_OUTLET_NOT_FOUND
    http_status: 404
    message: "Alternative outlet {outlet_id} not found"
    trigger: "Unknown outletId path segment or outlet_id body field"

  - error_id: ERR_ORDER_NOT_FOUND
    http_status: 404
    message: "Diversion order {order_id} not found"
    trigger: "Unknown orderId path segment"

  - error_id: ERR_COMPLAINT_NOT_FOUND
    http_status: 404
    message: "Odor complaint {complaint_id} not found"
    trigger: "Unknown complaintId path segment"

  - error_id: ERR_REPORT_NOT_FOUND
    http_status: 404
    message: "Annual report {report_id} not found"
    trigger: "Unknown reportId path segment"

  - error_id: ERR_LEDGER_ENTRY_NOT_FOUND
    http_status: 404
    message: "Loading ledger entry {entry_id} not found"
    trigger: "Unknown entryId path segment"

  - error_id: ERR_LAB_RESULT_NOT_FOUND
    http_status: 404
    message: "Lab result {result_id} not found"
    trigger: "Unknown resultId path segment"

  - error_id: ERR_HAUL_TICKET_NOT_FOUND
    http_status: 404
    message: "Haul ticket {ticket_id} not found"
    trigger: "Unknown ticketId path segment"

  - error_id: ERR_LIMIT_NOT_FOUND
    http_status: 404
    message: "No active pollutant limit is configured for analyte {analyte}"
    trigger: "POST /solids-batches/{batchId}/lab-results for an analyte with no ACTIVE PollutantLimit row"

  - error_id: ERR_STALE_SITE_VERSION
    http_status: 412
    message: "Site {site_id} is at version {actual_version}, not {expected_version}"
    trigger: "expected_site_version does not equal the site's current version on POST /farmer-agreements"

  - error_id: ERR_STALE_BATCH_VERSION
    http_status: 412
    message: "Batch {batch_id} is at version {actual_version}, not {expected_version}"
    trigger: "expected_batch_version does not equal the batch's current version on POST /diversion-orders"

  - error_id: ERR_INVALID_PROCESS_TRANSITION
    http_status: 409
    message: "Batch {batch_id} cannot move from process state {from} to {to}"
    trigger: "advance-process with a to_status that is not the next stage of the process train"

  - error_id: ERR_INVALID_QUALITY_TRANSITION
    http_status: 409
    message: "Batch {batch_id} cannot move from quality state {from} to {to}"
    trigger: "certify from a state other than PENDING_RESULTS, retest-request from a state other than REJECTED, or a lab result filed against a batch whose quality_status is neither PENDING_RESULTS nor QUALIFIED"

  - error_id: ERR_RETEST_LIMIT_REACHED
    http_status: 409
    message: "Batch {batch_id} has already used its two resampling rounds"
    trigger: "retest-request when retest_round is already 2"

  - error_id: ERR_SITE_INVALID_STATE
    http_status: 409
    message: "Site {site_id} is in state {status} and cannot accept this transition"
    trigger: "submit-permit, permit-decision, restrict, reinstate or close from a state the site machine does not allow"

  - error_id: ERR_AGREEMENT_INVALID_STATE
    http_status: 409
    message: "Agreement {agreement_id} is in state {status} and cannot accept this transition"
    trigger: "propose, counter, sign, activate, withdraw or terminate from a state the agreement machine does not allow"

  - error_id: ERR_AGREEMENT_ROUND_LIMIT
    http_status: 409
    message: "Agreement {agreement_id} has used all three negotiation rounds"
    trigger: "counter when round_index is already 3"

  - error_id: ERR_AGREEMENT_TERM_OVERLAP
    http_status: 409
    message: "Another active agreement already covers site {site_id} for that term"
    trigger: "activate when an ACTIVE agreement on the same site has a half-open term overlapping this one"

  - error_id: ERR_EVENT_NOT_SCHEDULED
    http_status: 409
    message: "Event {event_id} is in state {status}, not a pre-field state"
    trigger: "weather-hold, reschedule, start or cancel from a state outside {SCHEDULED, WEATHER_HOLD, DEFERRED}"

  - error_id: ERR_EVENT_NOT_IN_PROGRESS
    http_status: 409
    message: "Event {event_id} is in state {status}, not IN_PROGRESS"
    trigger: "complete or haul-ticket creation on an event that is not IN_PROGRESS"

  - error_id: ERR_EVENT_NOT_COMPLETED
    http_status: 409
    message: "Event {event_id} is in state {status}, not COMPLETED"
    trigger: "void on an event that was never completed"

  - error_id: ERR_ORDER_INVALID_STATE
    http_status: 409
    message: "Diversion order {order_id} is in state {status} and cannot accept this transition"
    trigger: "commit from a state other than DRAFT, settle from a state other than COMMITTED, or void from SETTLED or VOIDED"

  - error_id: ERR_COMPLAINT_INVALID_STATE
    http_status: 409
    message: "Odor complaint {complaint_id} is in state {status} and cannot accept this transition"
    trigger: "investigate from a state other than RECEIVED, resolve from a state other than INVESTIGATING, or close from RECEIVED, INVESTIGATING or CLOSED"

  - error_id: ERR_REPORT_INVALID_STATE
    http_status: 409
    message: "Annual report {report_id} is in state {status} and cannot accept this transition"
    trigger: "submit from a state other than DRAFT, or amend from DRAFT"

  - error_id: ERR_SITE_NOT_PERMITTED
    http_status: 409
    message: "Site {site_id} is {status}; a permitted site is required"
    trigger: "Scheduling, rescheduling, starting an event or proposing an agreement against a site that is not PERMITTED"

  - error_id: ERR_AGREEMENT_NOT_ACTIVE
    http_status: 409
    message: "Agreement {agreement_id} is {status}; an active agreement is required"
    trigger: "Scheduling, rescheduling or starting an event against an agreement that is not ACTIVE"

  - error_id: ERR_BATCH_NOT_QUALIFIED
    http_status: 409
    message: "Batch {batch_id} is {quality_status}; a qualified batch is required"
    trigger: "Scheduling or starting a land application with a batch that is not QUALIFIED"

  - error_id: ERR_OUTLET_NOT_ACCEPTING
    http_status: 409
    message: "Outlet {outlet_id} is {status} and is not accepting loads"
    trigger: "commit against an outlet that is SUSPENDED or CLOSED"

  - error_id: ERR_FACILITY_FROZEN
    http_status: 409
    message: "Facility {facility_id} posture is FROZEN; solids handling is suspended"
    trigger: "Batch creation, process advance, certification or event scheduling while the facility posture is FROZEN"

  - error_id: ERR_FACILITY_RESTRICTED
    http_status: 409
    message: "Facility {facility_id} posture is RESTRICTED; only windows within 7 days may be scheduled"
    trigger: "POST /application-events with window_start more than 7 days beyond the logical clock while posture is RESTRICTED"

  - error_id: ERR_SITE_RESTRICTED
    http_status: 409
    message: "Site {site_id} is restricted: {restriction_reason}"
    trigger: "Scheduling, starting or completing an application on a RESTRICTED site"

  - error_id: ERR_OPEN_EVENTS_EXIST
    http_status: 409
    message: "{open_count} application events are still open"
    trigger: "close on a site with unfinished events, or report submission with unfinished events in the report year"

  - error_id: ERR_REPORTING_PERIOD_LOCKED
    http_status: 409
    message: "Reporting year {report_year} for facility {facility_id} is already reported"
    trigger: "void on a COMPLETED event whose window_start year has a SUBMITTED or AMENDED annual report"

  - error_id: ERR_SITE_WINDOW_CONFLICT
    http_status: 409
    message: "Window overlaps event {conflicting_event_id} on site {site_id}"
    trigger: "A requested half-open window intersecting another open event's window on the same site"

  - error_id: ERR_REAPPLICATION_INTERVAL
    http_status: 409
    message: "Site {site_id} is inside its {reapplication_interval_days}-day reapplication interval until {available_at}"
    trigger: "window_start earlier than the last completed application's window_end plus the site's reapplication interval"

  - error_id: ERR_LOADOUT_BAY_CAPACITY
    http_status: 409
    message: "All {loadout_bay_count} loadout bays are occupied for that interval"
    trigger: "A haul ticket whose closed [depart_at, return_at] interval shares an instant with as many existing tickets as the facility has bays"

  - error_id: ERR_OUTSIDE_APPLICATION_WINDOW
    http_status: 409
    message: "Logical clock {now} is outside event window {window_start}..{window_end}"
    trigger: "start on an event whose half-open window does not contain the current clock value"

  - error_id: ERR_DUPLICATE_RESOURCE
    http_status: 409
    message: "{resource} already exists: {detail}"
    trigger: "Duplicate npdes_permit_number, batch_code within a facility, site_code within a facility, report_year within a facility, or (batch, analyte, sampling round) lab result"

  - error_id: ERR_VSR_BELOW_MINIMUM
    http_status: 422
    message: "Volatile solids reduction {vsr_pct}% is below the 38.00% minimum"
    trigger: "Certification of a batch whose chosen vector option is VAR_OPTION_1_VSR while vsr_pct_van_kleeck is below 38.00"

  - error_id: ERR_VECTOR_OPTION_EVIDENCE_MISSING
    http_status: 422
    message: "Vector attraction option {vector_option} has no valid supporting measurement"
    trigger: "Certification with VAR_OPTION_3_SOUR or VAR_OPTION_5_AEROBIC whose measurement is absent or fails its threshold"

  - error_id: ERR_VECTOR_OPTION_METHOD_MISMATCH
    http_status: 422
    message: "Vector attraction option {vector_option} requires a different field practice"
    trigger: "Completion where VAR_OPTION_9_INJECTION was not applied by injection, or VAR_OPTION_10_INCORPORATION was not incorporated within 6 hours"

  - error_id: ERR_PATHOGEN_CLASS_INSUFFICIENT
    http_status: 422
    message: "Batch {batch_id} demonstrates no pathogen class under option {pathogen_option}"
    trigger: "Certification of a batch whose derived pathogen_class is NONE"

  - error_id: ERR_ANALYTE_PANEL_INCOMPLETE
    http_status: 422
    message: "Sampling round {sampling_event_index} is missing results for {missing_analytes}"
    trigger: "Certification before every analyte with an ACTIVE PollutantLimit row has a result in the current sampling round"

  - error_id: ERR_CEILING_EXCEEDED
    http_status: 422
    message: "Analyte {analyte} at {concentration_mg_kg} mg/kg exceeds its ceiling of {ceiling_mg_kg} mg/kg"
    trigger: "Certification of a batch carrying a ceiling exceedance in the current sampling round"

  - error_id: ERR_MONTHLY_AVG_EXCEEDED
    http_status: 422
    message: "Analyte {analyte} at {concentration_mg_kg} mg/kg exceeds the monthly average limit of {monthly_avg_mg_kg} mg/kg"
    trigger: "Certification of a batch whose current round exceeds a monthly-average limit without breaching the ceiling"

  - error_id: ERR_SAMPLING_ROUND_MISMATCH
    http_status: 422
    message: "Batch {batch_id} is on sampling round {retest_round}, not {sampling_event_index}"
    trigger: "A lab result filed against a round other than the batch's current one"

  - error_id: ERR_SETBACK_VIOLATION
    http_status: 422
    message: "Setbacks fail for method {application_method}: {detail}"
    trigger: "Permit submission failing the baseline siting screen, or an application whose method demands a larger surface-water setback or gentler slope than the site provides"

  - error_id: ERR_PHOSPHORUS_INDEX_BLOCK
    http_status: 422
    message: "Site {site_id} soil phosphorus index {soil_p_index} blocks biosolids application"
    trigger: "Scheduling on a site whose soil_p_index is 100 or greater"

  - error_id: ERR_ODOR_RISK_BLOCK
    http_status: 422
    message: "Site {site_id} gating odor risk score {gating_risk_score} is at or above the 60.00 scheduling block"
    trigger: "Scheduling or rescheduling on a site whose gating_risk_score has reached 60.00"

  - error_id: ERR_WEATHER_RESTRICTION
    http_status: 422
    message: "Site {site_id} has no weather clearance: {detail}"
    trigger: "Starting an application, or clearing a weather hold, while the site's latest observation fails the rainfall or frozen-ground screen"

  - error_id: ERR_CROP_CYCLE_CONFLICT
    http_status: 422
    message: "Month {month} is outside the allowed application months for site {site_id}"
    trigger: "A window whose start month is not in allowed_application_months"

  - error_id: ERR_NOTICE_PERIOD_NOT_MET
    http_status: 422
    message: "Agreement {agreement_id} requires {notice_days} days notice; earliest window start is {earliest_start}"
    trigger: "A window starting sooner than the agreement's notice period allows"

  - error_id: ERR_AGREEMENT_SITE_MISMATCH
    http_status: 422
    message: "Agreement {agreement_id} covers site {agreement_site_id}, not {site_id}"
    trigger: "Scheduling an event whose agreement belongs to a different site"

  - error_id: ERR_AGREEMENT_TERM_COVERAGE
    http_status: 422
    message: "Window {window_start}..{window_end} falls outside agreement term {term_start}..{term_end}"
    trigger: "A window not fully inside the agreement term"

  - error_id: ERR_ACRES_EXCEED_SITE
    http_status: 422
    message: "acres_treated {acres_treated} exceeds site acreage {acres}"
    trigger: "An event treating more acres than the site has, or zero acres"

  - error_id: ERR_AGRONOMIC_RATE_UNDEFINED
    http_status: 422
    message: "Batch {batch_id} supplies no plant-available nitrogen; no agronomic rate can be derived"
    trigger: "Scheduling with a nutrient panel whose derived plant_available_n_lb_per_dry_ton is zero or negative"

  - error_id: ERR_AGRONOMIC_RATE_EXCEEDED
    http_status: 422
    message: "Requested {requested_rate} dry tons/acre exceeds the {binding_rate_constraint}-limited cap of {agronomic_rate_cap} dry tons/acre"
    trigger: "planned_dry_tons / acres_treated above the binding agronomic cap"

  - error_id: ERR_CPLR_HEADROOM_EXCEEDED
    http_status: 422
    message: "Analyte {analyte} would reach {projected_kg_per_hectare} kg/ha against a cumulative limit of {cplr_kg_per_hectare} kg/ha"
    trigger: "An application whose rounded loading increment would push cumulative loading past a CPLR, or a reinstatement while a CPLR-driven restriction still holds"

  - error_id: ERR_APLR_EXCEEDED
    http_status: 422
    message: "Analyte {analyte} would reach {projected_kg_per_hectare} kg/ha in {applied_year} against an annual limit of {aplr_kg_per_hectare_yr} kg/ha"
    trigger: "An application whose rounded loading increment would push that year's loading past an APLR"

  - error_id: ERR_INSUFFICIENT_UNALLOCATED_TONS
    http_status: 422
    message: "Batch {batch_id} has {unallocated_dry_tons} unallocated dry tons; {requested_dry_tons} were requested"
    trigger: "An event reservation, an event completion or a diversion commit demanding more dry tons than the batch still holds free"

  - error_id: ERR_NO_HAUL_TICKET
    http_status: 422
    message: "Event {event_id} has no haul tickets and cannot be closed out"
    trigger: "complete on an event with no HaulTicket rows"

  - error_id: ERR_APPLIED_TONS_INVALID
    http_status: 422
    message: "applied_dry_tons {applied_dry_tons} must be greater than 0 and no more than the planned {planned_dry_tons}"
    trigger: "complete with applied_dry_tons at or below zero, or above the event's planned_dry_tons"

  - error_id: ERR_STORAGE_CAPACITY_EXCEEDED
    http_status: 422
    message: "Facility {facility_id} has {available_wet_tons} wet tons of storage left; {wet_tons} were offered"
    trigger: "Batch creation that would push stored solids past the facility's storage capacity"

  - error_id: ERR_OUTLET_ACCEPTANCE_CRITERIA
    http_status: 422
    message: "Outlet {outlet_id} will not accept this load: {detail}"
    trigger: "A commit below the outlet's minimum load size or below its minimum percent solids"

  - error_id: ERR_OUTLET_ANNUAL_CAP_EXCEEDED
    http_status: 422
    message: "Outlet {outlet_id} has {remaining_wet_tons} wet tons of annual capacity left; {wet_tons} were offered"
    trigger: "A commit that would push the outlet's year-to-date acceptance past its annual cap"

# =====================================================================
# §1.7 Roles and Permissions
# =====================================================================
roles:
  - name: FacilityOperator
    identity: "entity_backed:TreatmentFacility"
    description: "Runs the solids train and the loadout yard. Creates facilities, batches and process advances, records haul tickets, drafts and commits diversions, and starts field applications. Deliberately cannot certify a batch, cannot decide a permit and cannot close out an application event: the plant does not sign off on its own product."
    permissions:
      - "Full write access to TreatmentFacility, SolidsBatch process advances, HaulTicket, AlternativeOutlet creation and DiversionOrder draft/commit/settle."
      - "Write access to ApplicationEvent start and weather-hold only."
      - "Read access to every entity except FarmerAgreement negotiation history beyond status."

  - name: LabAnalyst
    identity: "opaque"
    description: "Files analytical results for regulated metals and PFOS. The only role that may write LabResult rows, and the only role with no write access to any state machine: the analytical record is the input to compliance decisions, never a decision itself."
    permissions:
      - "Write access to LabResult."
      - "Read access to SolidsBatch, PollutantLimit, TreatmentFacility and LabResult."

  - name: ComplianceOfficer
    identity: "opaque"
    description: "Holds the regulatory pen. Configures pollutant limits, certifies batches, decides site permits, restricts and reinstates sites, resolves odor complaints, closes out application events, voids completed events and submits annual reports. Subject to segregation of duties: the officer who certified a batch may not close out that batch's application event."
    permissions:
      - "Write access to PollutantLimit, SolidsBatch certification and retest, LandApplicationSite permit decisions and restrictions, ApplicationEvent completion, cancellation and void, DiversionOrder void, OdorComplaint resolution and AnnualReport submission and amendment."
      - "Read access to every entity."

  - name: Agronomist
    identity: "opaque"
    description: "Owns the land side. Registers sites, submits them for permitting, negotiates farmer agreements from the utility's side, and schedules, reschedules and cancels application events. Cannot certify a batch, cannot decide the permit it applied for and cannot complete the event it scheduled."
    permissions:
      - "Write access to LandApplicationSite creation and permit submission, FarmerAgreement create/propose/activate/withdraw/terminate, and ApplicationEvent create/reschedule/weather-hold/cancel."
      - "Read access to SolidsBatch, LabResult, LoadingLedgerEntry, TreatmentFacility, AlternativeOutlet and OdorComplaint."

  - name: Farmer
    identity: "opaque"
    description: "The farming operator on the other side of an agreement. Identified by matching X-User-ID against FarmerAgreement.farmer_user_id, so a Farmer can only act on agreements naming them. Counters, signs and terminates agreements; reads the sites and events that concern their own fields."
    permissions:
      - "Write access to FarmerAgreement counter, sign and terminate, restricted to agreements whose farmer_user_id equals the caller."
      - "Read access to FarmerAgreement, LandApplicationSite and ApplicationEvent."

  - name: PublicLiaison
    identity: "opaque"
    description: "Handles the community side: logs odor complaints, opens and closes them, drafts the public narrative on the annual report. Has no authority over solids, sites, agreements or events, and cannot substantiate a complaint - only a ComplianceOfficer can convert a complaint into a regulatory consequence."
    permissions:
      - "Write access to OdorComplaint creation, investigation and closure, and AnnualReport creation."
      - "Read access to TreatmentFacility, LandApplicationSite, AlternativeOutlet, DiversionOrder, AnnualReport and OdorComplaint."
