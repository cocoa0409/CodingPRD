        claim_type: optimistic_concurrency
        grounds: [concurrency_rules.hold-amendment-stale-schedule, "errors[ERR_STALE_SCHEDULE_VERSION]", "validations[priority 7]"]
        distinguishing_aspect: "The OCC token is the PARENT SCHEDULE's version, not the item's, and the amendment write increments it as a side effect — so a second amendment replayed with the version captured before the first one must be refused 412 even though it is otherwise perfectly admissible, and the refreshed version then succeeds. Implementations that version the item, or that skip the increment because only a child row changed, accept the replay."
