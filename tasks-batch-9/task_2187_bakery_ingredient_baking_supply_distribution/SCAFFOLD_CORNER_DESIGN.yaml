# §1.9 Scaffold Corner Design — breadth probe over the declared §1.1-§1.7 surface
# of task_2187 (Bakery Ingredient & Baking Supply Distribution).
# Sections and claim_type values are taken verbatim from
# references/claim-extraction-guide.md. Every `call:` is an absolute §1.5 path
# including the api_prefix `/bakery-distribution`. Logical clock reads
# 2026-08-01T00:00:00Z before any POST /_clock/set_current_utc call.
scaffold_corner_design:
  - section: entities
    instances:
      - name: corner_create_customer_initialises_system_and_computed_fields
        claim_type: Creation
        grounds:
          - entities.Customer.fields.status
          - entities.Customer.fields.open_exposure_cents
          - entities.Customer.fields.allergen_risk_score
          - entities.Customer.fields.risk_tier
        distinguishing_aspect: "POST /customers with all four declared input fields returns 201 and initialises status=ACTIVE, open_exposure_cents=0, allergen_risk_score=0.00, risk_tier=GREEN inside the §1.0 success envelope."
        test_recipe:
          setup:
            - "Empty database; logical clock pinned at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /bakery-distribution/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "pa_1"
          trigger:
            - call: "POST /bakery-distribution/customers"
              payload: { legal_name: "Rye Lane Bakery", allergen_program: "STANDARD", credit_limit_cents: 5000000, min_drop_cents: 25000 }
              as: AccountManager
              as_user_id: "am_1"
              captures: { cust_id: $.data.id }
          assert:
            - "HTTP status is 201"
            - "response.response_type == \"object\" and meta.api_request_id and meta.api_request_timestamp are both present"
            - "Customer.${cust_id}.status == ACTIVE"
            - "Customer.${cust_id}.open_exposure_cents == 0"
            - "Customer.${cust_id}.allergen_risk_score == 0.00"
            - "Customer.${cust_id}.risk_tier == GREEN"
            - "Customer.${cust_id}.min_drop_cents == 25000"

      - name: corner_default_min_drop_cents_applied_when_field_omitted
        claim_type: Defaults
        grounds:
          - entities.Customer.fields.min_drop_cents
          - endpoints[POST /bakery-distribution/customers]
        distinguishing_aspect: "min_drop_cents is the only optional input on POST /customers; omitting it must persist the declared default 25000, not null or 0."
        test_recipe:
          setup:
            - "Empty database; logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /bakery-distribution/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "pa_1"
          trigger:
            - call: "POST /bakery-distribution/customers"
              payload: { legal_name: "Default Drop Bakery", allergen_program: "STANDARD", credit_limit_cents: 900000 }
              as: AccountManager
              as_user_id: "am_1"
              captures: { cust_id: $.data.id }
          assert:
            - "HTTP status is 201"
            - "Customer.${cust_id}.min_drop_cents == 25000"
            - "Customer.${cust_id}.allergen_program == STANDARD"

      - name: corner_computed_lot_expires_on_derived_from_shelf_life_days
        claim_type: Computed Fields
        grounds:
          - entities.Lot.fields.expires_on
          - entities.Product.fields.shelf_life_days
          - endpoints[POST /bakery-distribution/lots]
        distinguishing_aspect: "Lot.expires_on is source: computed — POST /lots ignores any client notion of expiry and returns manufactured_on + Product.shelf_life_days = 2026-07-01 + 180 days = 2026-12-28T00:00:00Z."
        test_recipe:
          setup:
            - "One GLUTEN product with shelf_life_days=180 and one GLUTEN zone exist; clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /bakery-distribution/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "pa_1"
            - call: "POST /bakery-distribution/products"
              payload: { sku: "FLR-BREAD-50", category: "FLOUR", allergen_class: "GLUTEN", bulk_capable: true, shelf_life_days: 180, index_code: "NONE", list_price_cents_per_lb: 30, min_rotation_days: 0 }
              as: PricingController
              as_user_id: "pc_1"
              captures: { prod_flour: $.data.id }
            - call: "POST /bakery-distribution/warehouse-zones"
              payload: { zone_code: "Z-GLU", allergen_class: "GLUTEN" }
              as: WarehouseOperator
              as_user_id: "wo_1"
              captures: { zone_glu: $.data.id }
          trigger:
            - call: "POST /bakery-distribution/lots"
              payload: { lot_code: "LOT-GLU-0001", product_id: "${prod_flour}", zone_id: "${zone_glu}", manufactured_on: "2026-07-01T00:00:00Z", quantity_received_lb: 40000 }
              as: WarehouseOperator
              as_user_id: "wo_1"
              captures: { lot_a: $.data.id }
          assert:
            - "HTTP status is 201"
            - "Lot.${lot_a}.expires_on == 2026-12-28T00:00:00Z"
            - "Lot.${lot_a}.quantity_on_hand_lb == 40000"
            - "Lot.${lot_a}.quantity_reserved_lb == 0"
            - "Lot.${lot_a}.quantity_consumed_lb == 0"
            - "Lot.${lot_a}.status == AVAILABLE"
            - "WarehouseZone.${zone_glu}.on_hand_lb == 40000"

      - name: corner_read_order_returns_both_status_dimensions_and_money_fields
        claim_type: Retrieval
        grounds:
          - entities.Order.fields.fulfillment_status
          - entities.Order.fields.pricing_status
          - endpoints[GET /bakery-distribution/orders/{id}]
        distinguishing_aspect: "GET /orders/{id} on a freshly opened order returns fulfillment_status=NEW and pricing_status=UNPRICED together with all five money fields at 0 and surge_window=false."
        test_recipe:
          setup:
            - "One customer, one GLUTEN product, one BAGGED order with no lines; clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /bakery-distribution/customers"
              payload: { legal_name: "Read Back Bakery", allergen_program: "STANDARD", credit_limit_cents: 5000000, min_drop_cents: 25000 }
              as: AccountManager
              as_user_id: "am_1"
              captures: { cust_id: $.data.id }
            - call: "POST /bakery-distribution/orders"
              payload: { customer_id: "${cust_id}", delivery_mode: "BAGGED", requested_delivery_on: "2026-09-10T00:00:00Z" }
              as: CustomerBuyer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
          trigger:
            - call: "GET /bakery-distribution/orders/${order_id}"
              payload: {}
              as: CustomerBuyer
              as_user_id: "${cust_id}"
          assert:
            - "HTTP status is 200"
            - "Order.${order_id}.fulfillment_status == NEW"
            - "Order.${order_id}.pricing_status == UNPRICED"
            - "Order.${order_id}.subtotal_cents == 0 and Order.${order_id}.fuel_surcharge_cents == 0 and Order.${order_id}.tech_attach_fee_cents == 0 and Order.${order_id}.volume_rebate_cents == 0 and Order.${order_id}.total_cents == 0"
            - "Order.${order_id}.surge_window == false"
            - "Order.${order_id}.order_placed_on == null and Order.${order_id}.delivered_on == null"

      - name: corner_list_lots_pagination_and_expiry_ordering
        claim_type: Listing
        grounds:
          - endpoints[GET /bakery-distribution/lots]
          - entities.Lot.fields.expires_on
        distinguishing_aspect: "GET /lots?limit=2&offset=0 over three lots returns total_count=3, has_more=true and the two earliest-expiring lots in expires_on ASC order (2026-11-28 before 2026-12-28)."
        test_recipe:
          setup:
            - "Three lots of the same GLUTEN product in one GLUTEN zone with expires_on 2026-11-28, 2026-12-28 and 2027-01-11."
          setup_api_calls:
            - call: "POST /bakery-distribution/products"
              payload: { sku: "FLR-BREAD-50", category: "FLOUR", allergen_class: "GLUTEN", bulk_capable: true, shelf_life_days: 180, index_code: "NONE", list_price_cents_per_lb: 30, min_rotation_days: 0 }
              as: PricingController
              as_user_id: "pc_1"
              captures: { prod_flour: $.data.id }
            - call: "POST /bakery-distribution/warehouse-zones"
              payload: { zone_code: "Z-GLU", allergen_class: "GLUTEN" }
              as: WarehouseOperator
              as_user_id: "wo_1"
              captures: { zone_glu: $.data.id }
            - call: "POST /bakery-distribution/lots"
              payload: { lot_code: "LOT-GLU-A", product_id: "${prod_flour}", zone_id: "${zone_glu}", manufactured_on: "2026-07-01T00:00:00Z", quantity_received_lb: 40000 }
              as: WarehouseOperator
              as_user_id: "wo_1"
              captures: { lot_a: $.data.id }
            - call: "POST /bakery-distribution/lots"
              payload: { lot_code: "LOT-GLU-B", product_id: "${prod_flour}", zone_id: "${zone_glu}", manufactured_on: "2026-06-01T00:00:00Z", quantity_received_lb: 10000 }
              as: WarehouseOperator
              as_user_id: "wo_1"
              captures: { lot_b: $.data.id }
            - call: "POST /bakery-distribution/lots"
              payload: { lot_code: "LOT-GLU-C", product_id: "${prod_flour}", zone_id: "${zone_glu}", manufactured_on: "2026-07-15T00:00:00Z", quantity_received_lb: 5000 }
              as: WarehouseOperator
              as_user_id: "wo_1"
              captures: { lot_c: $.data.id }
          trigger:
            - call: "GET /bakery-distribution/lots"
              payload: { product_id: "${prod_flour}", limit: 2, offset: 0 }
              as: WarehouseOperator
              as_user_id: "wo_1"
          assert:
            - "HTTP status is 200 and response.response_type == \"array\""
            - "total_count == 3 and has_more == true and limit == 2 and offset == 0"
            - "data has exactly 2 elements; data[0].id == ${lot_b} (expires_on 2026-11-28) and data[1].id == ${lot_a} (expires_on 2026-12-28)"
            - "${lot_c} is absent from this page"

      - name: corner_get_order_unknown_id_not_found
        claim_type: Not Found
        grounds:
          - validations[priority=5]
          - errors[ERR_RESOURCE_NOT_FOUND]
        distinguishing_aspect: "GET /orders/{id} for an id no Order row carries returns ERR_RESOURCE_NOT_FOUND with HTTP 404 inside the §1.0 error envelope."
        test_recipe:
          setup:
            - "One customer exists; no Order rows exist at all."
          setup_api_calls:
            - call: "POST /bakery-distribution/customers"
              payload: { legal_name: "No Orders Bakery", allergen_program: "STANDARD", credit_limit_cents: 100000 }
              as: AccountManager
              as_user_id: "am_1"
              captures: { cust_id: $.data.id }
          trigger:
            - call: "GET /bakery-distribution/orders/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: CustomerBuyer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 404"
            - "response.response_type == \"error\" and ${err} == ERR_RESOURCE_NOT_FOUND"

      - name: corner_order_line_missing_required_quantity_lb_rejected
        claim_type: Required Fields
        grounds:
          - entities.OrderLine.fields.quantity_lb
          - validations[priority=4]
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "quantity_lb is a required input on POST /orders/{id}/lines with no declared default; omitting it returns ERR_VALIDATION (400) and creates no OrderLine row."
        test_recipe:
          setup:
            - "One customer, one GLUTEN product, one UNPRICED BAGGED order with zero lines."
          setup_api_calls:
            - call: "POST /bakery-distribution/customers"
              payload: { legal_name: "Missing Field Bakery", allergen_program: "STANDARD", credit_limit_cents: 5000000 }
              as: AccountManager
              as_user_id: "am_1"
              captures: { cust_id: $.data.id }
            - call: "POST /bakery-distribution/products"
              payload: { sku: "FLR-BREAD-50", category: "FLOUR", allergen_class: "GLUTEN", shelf_life_days: 180, list_price_cents_per_lb: 30 }
              as: PricingController
              as_user_id: "pc_1"
              captures: { prod_flour: $.data.id }
            - call: "POST /bakery-distribution/orders"
              payload: { customer_id: "${cust_id}", delivery_mode: "BAGGED", requested_delivery_on: "2026-09-10T00:00:00Z" }
              as: CustomerBuyer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /bakery-distribution/orders/${order_id}/lines"
              payload: { product_id: "${prod_flour}" }
              as: CustomerBuyer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 400 and ${err} == ERR_VALIDATION"
            - "GET /bakery-distribution/orders/${order_id}/lines returns total_count == 0"
            - "Order.${order_id}.version is unchanged by the rejected call"

      - name: corner_product_invalid_enum_allergen_class_rejected
        claim_type: Type Constraints
        grounds:
          - entities.Product.fields.allergen_class
          - validations[priority=4]
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "allergen_class accepts only the seven declared members; the non-member \"SESAME\" returns ERR_VALIDATION (400) rather than being stored as free text."
        test_recipe:
          setup:
            - "Empty database; clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /bakery-distribution/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "pa_1"
          trigger:
            - call: "POST /bakery-distribution/products"
              payload: { sku: "SESAME-PASTE", category: "INCLUSION", allergen_class: "SESAME", shelf_life_days: 90, list_price_cents_per_lb: 210 }
              as: PricingController
              as_user_id: "pc_1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 400 and ${err} == ERR_VALIDATION"
            - "No Product row is persisted: the rejected call returns no data.id and re-posting the same body with allergen_class == \"TREE_NUT\" then succeeds with 201"

      - name: corner_system_field_order_placed_on_stamped_from_logical_clock
        claim_type: System Fields
        grounds:
          - entities.Order.fields.order_placed_on
          - state_machines.Order.pricing_status.UNPRICED_to_PROVISIONAL
        distinguishing_aspect: "order_placed_on is source: system — submission stamps it from the logical clock date (2026-08-20T00:00:00Z) and never from requested_delivery_on (2026-09-10)."
        test_recipe:
          setup:
            - "One customer with credit_limit 5000000, one GLUTEN product at 30 cents/lb, one BAGGED order with a single 1000 lb line; clock advanced to 2026-08-20T00:00:00Z before submission."
          setup_api_calls:
            - call: "POST /bakery-distribution/customers"
              payload: { legal_name: "Clock Stamp Bakery", allergen_program: "STANDARD", credit_limit_cents: 5000000, min_drop_cents: 25000 }
              as: AccountManager
              as_user_id: "am_1"
              captures: { cust_id: $.data.id }
            - call: "POST /bakery-distribution/products"
              payload: { sku: "FLR-BREAD-50", category: "FLOUR", allergen_class: "GLUTEN", shelf_life_days: 180, index_code: "NONE", list_price_cents_per_lb: 30 }
              as: PricingController
              as_user_id: "pc_1"
              captures: { prod_flour: $.data.id }
            - call: "POST /bakery-distribution/orders"
              payload: { customer_id: "${cust_id}", delivery_mode: "BAGGED", requested_delivery_on: "2026-09-10T00:00:00Z" }
              as: CustomerBuyer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /bakery-distribution/orders/${order_id}/lines"
              payload: { product_id: "${prod_flour}", quantity_lb: 1000 }
              as: CustomerBuyer
              as_user_id: "${cust_id}"
              captures: { line_id: $.data.id }
            - call: "POST /bakery-distribution/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "pa_1"
          trigger:
            - call: "POST /bakery-distribution/orders/${order_id}/submit"
              payload: {}
              as: CustomerBuyer
              as_user_id: "${cust_id}"
          assert:
            - "HTTP status is 200"
            - "Order.${order_id}.order_placed_on == 2026-08-20T00:00:00Z"
            - "Order.${order_id}.requested_delivery_on == 2026-09-10T00:00:00Z"
            - "Order.${order_id}.pricing_status == PROVISIONAL and Order.${order_id}.fulfillment_status == NEW"
            - "Order.${order_id}.total_cents == 30750"

      - name: corner_immutable_index_quote_exposes_no_version_and_no_mutator
        claim_type: Immutability
        grounds:
          - entities.CommodityIndexQuote
          - endpoints[POST /bakery-distribution/index-quotes]
          - endpoints[GET /bakery-distribution/index-quotes]
        distinguishing_aspect: "CommodityIndexQuote is declared common_fields: false, so its rows carry no version field and §1.5 declares no update endpoint; a superseding price is expressed as a second row with a later effective_on, not as a mutation."
        test_recipe:
          setup:
            - "Two HRW_WHEAT quotes published: 25 cents/lb effective 2026-07-15 and 40 cents/lb effective 2026-08-20."
          setup_api_calls:
            - call: "POST /bakery-distribution/index-quotes"
              payload: { index_code: "HRW_WHEAT", effective_on: "2026-07-15T00:00:00Z", price_cents_per_lb: 25 }
              as: PricingController
              as_user_id: "pc_1"
              captures: { q_jul: $.data.id }
            - call: "POST /bakery-distribution/index-quotes"
              payload: { index_code: "HRW_WHEAT", effective_on: "2026-08-20T00:00:00Z", price_cents_per_lb: 40 }
              as: PricingController
              as_user_id: "pc_1"
              captures: { q_aug: $.data.id }
          trigger:
            - call: "GET /bakery-distribution/index-quotes"
              payload: { index_code: "HRW_WHEAT", limit: 10, offset: 0 }
              as: PricingController
              as_user_id: "pc_1"
          assert:
            - "HTTP status is 200 and total_count == 2"
            - "data[0].effective_on == 2026-08-20T00:00:00Z (newest effective_on first) and data[1].effective_on == 2026-07-15T00:00:00Z"
            - "Neither element exposes a version field"
            - "CommodityIndexQuote.${q_jul}.price_cents_per_lb == 25 is unchanged by publishing ${q_aug}"

      - name: corner_contract_line_on_unknown_contract_path_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.ContractLine.fields.contract_id
          - validations[priority=5]
          - errors[ERR_RESOURCE_NOT_FOUND]
        distinguishing_aspect: "ContractLine declares parent ForwardPricingContract; POST /forward-contracts/{id}/lines against an id no contract carries fails the priority-5 path-existence check with ERR_RESOURCE_NOT_FOUND (404), never ERR_REFERENCED_ENTITY_NOT_FOUND."
        test_recipe:
          setup:
            - "One GLUTEN product exists; no ForwardPricingContract rows exist."
          setup_api_calls:
            - call: "POST /bakery-distribution/products"
              payload: { sku: "FLR-BREAD-50", category: "FLOUR", allergen_class: "GLUTEN", shelf_life_days: 180, list_price_cents_per_lb: 30 }
              as: PricingController
              as_user_id: "pc_1"
              captures: { prod_flour: $.data.id }
          trigger:
            - call: "POST /bakery-distribution/forward-contracts/00000000-0000-0000-0000-0000000000aa/lines"
              payload: { product_id: "${prod_flour}", volume_committed_lb: 10000, basis_cents_per_lb: 5 }
              as: AccountManager
              as_user_id: "am_1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 404 and ${err} == ERR_RESOURCE_NOT_FOUND"
            - "GET /bakery-distribution/contract-lines?product_id=${prod_flour} returns total_count == 0"

      - name: corner_self_referential_substituted_from_product_link_persisted
        claim_type: cross_cutting_association
        grounds:
          - entities.OrderLine.fields.substituted_from_product_id
          - entities.OrderLine.fields.product_id
          - endpoints[GET /bakery-distribution/order-lines]
        distinguishing_aspect: "OrderLine.substituted_from_product_id is a self-referential Product link: after approval the line holds product_id == the new SKU and substituted_from_product_id == the original SKU, and the filtered list GET /order-lines?substituted_from_product_id=<old SKU> finds exactly that one line."
        test_recipe:
          setup:
            - "One STANDARD customer (credit_limit 5000000, min_drop 25000); GLUTEN products A (30 c/lb) and B (40 c/lb); one PROVISIONAL, still-NEW BAGGED order with a single 1000 lb line on A; an APPROVED substitution to B."
          setup_api_calls:
            - call: "POST /bakery-distribution/customers"
              payload: { legal_name: "Swap Trace Bakery", allergen_program: "STANDARD", credit_limit_cents: 5000000, min_drop_cents: 25000 }
              as: AccountManager
              as_user_id: "am_1"
              captures: { cust_id: $.data.id }
            - call: "POST /bakery-distribution/products"
              payload: { sku: "FLR-BREAD-50", category: "FLOUR", allergen_class: "GLUTEN", shelf_life_days: 180, index_code: "NONE", list_price_cents_per_lb: 30 }
              as: PricingController
              as_user_id: "pc_1"
              captures: { prod_a: $.data.id }
            - call: "POST /bakery-distribution/products"
              payload: { sku: "FLR-CAKE-50", category: "FLOUR", allergen_class: "GLUTEN", shelf_life_days: 180, index_code: "NONE", list_price_cents_per_lb: 40 }
              as: PricingController
              as_user_id: "pc_1"
              captures: { prod_b: $.data.id }
            - call: "POST /bakery-distribution/orders"
              payload: { customer_id: "${cust_id}", delivery_mode: "BAGGED", requested_delivery_on: "2026-09-10T00:00:00Z" }
              as: CustomerBuyer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /bakery-distribution/orders/${order_id}/lines"
              payload: { product_id: "${prod_a}", quantity_lb: 1000 }
              as: CustomerBuyer
              as_user_id: "${cust_id}"
              captures: { line_id: $.data.id }
            - call: "POST /bakery-distribution/orders/${order_id}/submit"
              payload: {}
              as: CustomerBuyer
              as_user_id: "${cust_id}"
            - call: "GET /bakery-distribution/orders/${order_id}"
              payload: {}
              as: TechnicalSpecialist
              as_user_id: "ts_1"
              captures: { ov: $.data.version }
            - call: "POST /bakery-distribution/substitution-requests"
              payload: { order_line_id: "${line_id}", proposed_product_id: "${prod_b}", rationale: "Cake flour protein spec matches the revised sponge formula", expected_order_version: "${ov}" }
              as: TechnicalSpecialist
              as_user_id: "ts_1"
              captures: { sub_id: $.data.id }
            - call: "POST /bakery-distribution/substitution-requests/${sub_id}/claim"
              payload: {}
              as: QualityManager
              as_user_id: "qm_1"
          trigger:
            - call: "POST /bakery-distribution/substitution-requests/${sub_id}/approve"
              payload: {}
              as: QualityManager
              as_user_id: "qm_1"
          assert:
            - "HTTP status is 200 and SubstitutionRequest.${sub_id}.status == APPROVED"
            - "OrderLine.${line_id}.product_id == ${prod_b}"
            - "OrderLine.${line_id}.substituted_from_product_id == ${prod_a}"
