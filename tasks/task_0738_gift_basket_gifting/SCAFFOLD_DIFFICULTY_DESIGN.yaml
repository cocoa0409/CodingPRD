              as: AccountManager
              as_user_id: "${acct_id}"
              captures: { recipient_id: "$.data[0].id" }
            - call: "POST /orders/${order_id}/submit-for-approval"
              payload: { requested_by_user_id: "emp-req-10" }
              as: AccountManager
              as_user_id: "${acct_id}"
          trigger:
            - call: "POST /orders/${order_id}/budget-decision"
              payload: { decision: "APPROVE", approver_user_id: "fin-appr-10", station_id: "${station_id}", scheduled_date: "2026-03-20T00:00:00Z" }
