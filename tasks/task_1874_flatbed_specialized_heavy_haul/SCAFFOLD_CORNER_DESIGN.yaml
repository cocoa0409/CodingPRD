  # ===========================================================================
  - section: rbac
    instances:
      - name: dispatcher_cannot_create_customer
        claim_type: permission_denied
        grounds: [roles.PlatformAdmin.exclusive_operations, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Customer registration is PlatformAdmin-exclusive: a Dispatcher with a perfectly valid payload is refused with ERR_FORBIDDEN."
        test_recipe:
          setup: ["System initialized (one reference customer)"]
          setup_api_calls:
            - { call: "POST /heavy-haul/customers", payload: { company_name: "Seed Co", credit_limit_cents: 500000 }, as: PlatformAdmin }
          trigger:
            - { call: "POST /heavy-haul/customers", payload: { company_name: "Intruder Co", credit_limit_cents: 500000 }, as: Dispatcher, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_FORBIDDEN (403); no customer row created"

      - name: permit_clerk_cannot_grant
        claim_type: permission_denied
        grounds: [roles.StateAuthority.exclusive_operations, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Grant is StateAuthority-exclusive and role checks precede existence: a PermitClerk calling grant on a nonexistent permit id still gets ERR_FORBIDDEN, not ERR_NOT_FOUND."
        test_recipe:
          setup: ["System initialized (one reference customer)"]
          setup_api_calls:
            - { call: "POST /heavy-haul/customers", payload: { company_name: "Seed Co", credit_limit_cents: 500000 }, as: PlatformAdmin }
          trigger:
            - { call: "POST /heavy-haul/permits/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/grant", payload: { travel_window_start: "2026-08-10T00:00:00Z", travel_window_end: "2026-08-20T00:00:00Z" }, as: PermitClerk, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_FORBIDDEN (the approval-chain step is reserved for StateAuthority)"

      - name: shipper_cannot_plan
        claim_type: permission_denied
        grounds: [roles.Dispatcher.exclusive_operations, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Planning is Dispatcher-exclusive even for the load's owner: a Shipper calling plan on their own load receives ERR_FORBIDDEN (role check fires before ownership could help)."
        test_recipe:
          setup: ["Customer + their DRAFT load"]
          setup_api_calls:
            - { call: "POST /heavy-haul/customers", payload: { company_name: "Self Serve Co", credit_limit_cents: 500000 }, as: PlatformAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /heavy-haul/loads", payload: { cargo_description: "Crates", gross_weight_lbs: 40000, width_in: 100, height_in: 50, length_in: 400, origin: "X", destination: "Y" }, as: Shipper, as_user_id: "${cust_id}", captures: { load_id: "$.data.id" } }
          trigger:
            - { call: "POST /heavy-haul/loads/${load_id}/plan", payload: { trailer_type: "FLATBED", trailer_axle_count: 2, driver_name: "U. Be", driver_oversize_endorsed: false }, as: Shipper, as_user_id: "${cust_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_FORBIDDEN (ownership does not substitute for role)"

      - name: shipper_cannot_cancel_other_shippers_load
        claim_type: permission_denied
        grounds: ["validations[priority=4]", "errors[ERR_NOT_OWN_RESOURCE]", roles.Shipper]
        distinguishing_aspect: "Ownership is enforced for the entity-backed Shipper role: Shipper B holds a valid role for cancel but X-User-ID != load.customer_id, yielding ERR_NOT_OWN_RESOURCE (403) rather than ERR_FORBIDDEN."
        test_recipe:
          setup: ["Customers A and B; load owned by A in DRAFT"]
          setup_api_calls:
            - { call: "POST /heavy-haul/customers", payload: { company_name: "Owner A", credit_limit_cents: 500000 }, as: PlatformAdmin, captures: { cust_a: "$.data.id" } }
            - { call: "POST /heavy-haul/customers", payload: { company_name: "Owner B", credit_limit_cents: 500000 }, as: PlatformAdmin, captures: { cust_b: "$.data.id" } }
            - { call: "POST /heavy-haul/loads", payload: { cargo_description: "A's crates", gross_weight_lbs: 40000, width_in: 100, height_in: 50, length_in: 400, origin: "X", destination: "Y" }, as: Shipper, as_user_id: "${cust_a}", captures: { load_id: "$.data.id" } }
          trigger:
            - { call: "POST /heavy-haul/loads/${load_id}/cancel", payload: {}, as: Shipper, as_user_id: "${cust_b}", captures: { err: "$.data.error_id" } }
            - { call: "GET /heavy-haul/loads/${load_id}", as: Dispatcher, captures: { st: "$.data.status" } }
          assert:
            - "err == ERR_NOT_OWN_RESOURCE (distinct from role denial: role is allowed, ownership is not)"
            - "st == DRAFT (no mutation)"

      - name: shipper_cannot_dispute_other_shippers_fine
        claim_type: permission_denied
        grounds: ["validations[priority=4]", "errors[ERR_NOT_OWN_RESOURCE]", state_machines.Fine.PENDING_to_DISPUTED]
        distinguishing_aspect: "The dispute endpoint's ownership guard uses the fine's load.customer_id: Shipper B attempting to dispute a customer-liable PENDING fine on A's load gets ERR_NOT_OWN_RESOURCE while the fine stays PENDING."
        test_recipe:
          setup: ["Customers A and B; A's 96000-lb load went ON_HOLD via scale violation at 100000 lbs, producing a PENDING CUSTOMER-liable OVERWEIGHT fine of 150000"]
          setup_api_calls:
            - { call: "POST /heavy-haul/customers", payload: { company_name: "Fine Owner A", credit_limit_cents: 100000000 }, as: PlatformAdmin, captures: { cust_a: "$.data.id" } }
            - { call: "POST /heavy-haul/customers", payload: { company_name: "Fine Owner B", credit_limit_cents: 100000000 }, as: PlatformAdmin, captures: { cust_b: "$.data.id" } }
            - { call: "POST /heavy-haul/loads", payload: { cargo_description: "Press", gross_weight_lbs: 96000, width_in: 150, height_in: 100, length_in: 400, origin: "X", destination: "Y" }, as: Shipper, as_user_id: "${cust_a}", captures: { load_id: "$.data.id" } }
            - { call: "POST /heavy-haul/loads/${load_id}/plan", payload: { trailer_type: "EXTENDABLE_DOUBLE_DROP", trailer_axle_count: 6, driver_name: "V. Ax", driver_oversize_endorsed: true }, as: Dispatcher }
            - { call: "POST /heavy-haul/loads/${load_id}/survey", payload: { route_miles: 500, states_crossed: ["CA"], min_bridge_clearance_in: 200, max_bridge_weight_lbs: 120000 }, as: Dispatcher, captures: { lv3: "$.data.version" } }
            - { call: "POST /heavy-haul/loads/${load_id}/permits", payload: { state_code: "CA", permit_type: "OVERSIZE", expected_load_version: "${lv3}" }, as: PermitClerk, captures: { p_os: "$.data.id" } }
            - { call: "POST /heavy-haul/permits/${p_os}/file", payload: {}, as: PermitClerk }
            - { call: "POST /heavy-haul/permits/${p_os}/grant", payload: { travel_window_start: "2026-08-10T00:00:00Z", travel_window_end: "2026-08-20T00:00:00Z" }, as: StateAuthority }
            - { call: "GET /heavy-haul/loads/${load_id}", as: Dispatcher, captures: { lv4: "$.data.version" } }
            - { call: "POST /heavy-haul/loads/${load_id}/permits", payload: { state_code: "CA", permit_type: "OVERWEIGHT", expected_load_version: "${lv4}" }, as: PermitClerk, captures: { p_ow: "$.data.id" } }
            - { call: "POST /heavy-haul/permits/${p_ow}/file", payload: {}, as: PermitClerk }
            - { call: "POST /heavy-haul/permits/${p_ow}/grant", payload: { travel_window_start: "2026-08-10T00:00:00Z", travel_window_end: "2026-08-20T00:00:00Z" }, as: StateAuthority }
            - { call: "GET /heavy-haul/loads/${load_id}", as: Dispatcher, captures: { lv5: "$.data.version" } }
            - { call: "POST /heavy-haul/loads/${load_id}/escort-bookings", payload: { provider_name: "Fine Pilots", position: "REAR", scheduled_start: "2026-08-12T08:00:00Z", scheduled_end: "2026-08-12T12:00:00Z", rate_per_hour_cents: 12000, expected_load_version: "${lv5}" }, as: Dispatcher }
            - { call: "POST /heavy-haul/loads/${load_id}/crane-appointments", payload: { site: "ORIGIN", crane_id: "CRANE-A", window_start: "2026-08-12T06:00:00Z", window_end: "2026-08-12T08:00:00Z" }, as: Dispatcher }
            - { call: "POST /heavy-haul/loads/${load_id}/crane-appointments", payload: { site: "DESTINATION", crane_id: "CRANE-B", window_start: "2026-08-13T06:00:00Z", window_end: "2026-08-13T08:00:00Z" }, as: Dispatcher }
            - { call: "POST /heavy-haul/loads/${load_id}/securement-plans", payload: { method: "CHAINS", tiedown_count: 4, wll_per_tiedown_lbs: 15000 }, as: Dispatcher, captures: { sp_id: "$.data.id" } }
            - { call: "POST /heavy-haul/securement-plans/${sp_id}/approve", payload: {}, as: SafetyManager }
            - { call: "POST /heavy-haul/loads/${load_id}/scale-tickets", payload: { measured_gross_lbs: 100000, weighed_at: "2026-08-12T07:30:00Z" }, as: Driver }
            - { call: "GET /heavy-haul/loads/${load_id}/fines", as: SafetyManager, captures: { fine_id: "$.data[0].id", fine_st: "$.data[0].status" } }
          trigger:
            - { call: "POST /heavy-haul/fines/${fine_id}/dispute", payload: {}, as: Shipper, as_user_id: "${cust_b}", captures: { err: "$.data.error_id" } }
            - { call: "GET /heavy-haul/loads/${load_id}/fines", as: SafetyManager, captures: { fine_after: "$.data[0].status" } }
          assert:
            - "fine_st == PENDING (customer-liable OVERWEIGHT fine from the cascade)"
            - "err == ERR_NOT_OWN_RESOURCE (B's X-User-ID != load.customer_id A)"
            - "fine_after == PENDING (no state drift from the rejected dispute)"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_permit_create_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[permit-create-stale-load]", "errors[ERR_STALE_LOAD_VERSION]", "validations[priority=5]"]
        distinguishing_aspect: "OCC on Load.version guards permit creation: expected_load_version one behind the observed version is rejected with 412 ERR_STALE_LOAD_VERSION, while the current version succeeds and itself advances the version to 4."
        test_recipe:
          setup: ["Load 96000 lbs width 150, states [CA], SURVEYED at version 3"]
          setup_api_calls:
            - { call: "POST /heavy-haul/customers", payload: { company_name: "OCC Permit Co", credit_limit_cents: 50000000 }, as: PlatformAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /heavy-haul/loads", payload: { cargo_description: "Tank", gross_weight_lbs: 96000, width_in: 150, height_in: 100, length_in: 400, origin: "X", destination: "Y" }, as: Shipper, as_user_id: "${cust_id}", captures: { load_id: "$.data.id" } }
            - { call: "POST /heavy-haul/loads/${load_id}/plan", payload: { trailer_type: "EXTENDABLE_DOUBLE_DROP", trailer_axle_count: 6, driver_name: "W. Cy", driver_oversize_endorsed: true }, as: Dispatcher }
            - { call: "POST /heavy-haul/loads/${load_id}/survey", payload: { route_miles: 500, states_crossed: ["CA"], min_bridge_clearance_in: 200, max_bridge_weight_lbs: 120000 }, as: Dispatcher, captures: { lv3: "$.data.version" } }
          trigger:
            - { call: "POST /heavy-haul/loads/${load_id}/permits", payload: { state_code: "CA", permit_type: "OVERSIZE", expected_load_version: "${lv3} - 1" }, as: PermitClerk, captures: { err: "$.data.error_id" } }
            - { call: "POST /heavy-haul/loads/${load_id}/permits", payload: { state_code: "CA", permit_type: "OVERSIZE", expected_load_version: "${lv3}" }, as: PermitClerk, captures: { p_st: "$.data.status" } }
            - { call: "GET /heavy-haul/loads/${load_id}", as: Dispatcher, captures: { lv_after: "$.data.version" } }
          assert:
            - "err == ERR_STALE_LOAD_VERSION with http 412 (stale expected version ${lv3} - 1)"
            - "p_st == DRAFT (current version accepted)"
            - "lv_after == 4 (successful permit creation increments Load.version by 1)"

      - name: occ_escort_booking_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[escort-booking-stale-load]", "errors[ERR_STALE_LOAD_VERSION]", "validations[priority=5]"]
        distinguishing_aspect: "The second OCC rule guards escort booking on the same parent: a stale expected_load_version is refused with 412 even though the same payload with the current version books cleanly - serially observable, no wall-clock dependence."
        test_recipe:
          setup: ["Load 40000 lbs width 150, PLANNED at version 2"]
          setup_api_calls:
            - { call: "POST /heavy-haul/customers", payload: { company_name: "OCC Escort Co", credit_limit_cents: 50000000 }, as: PlatformAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /heavy-haul/loads", payload: { cargo_description: "Wide skid", gross_weight_lbs: 40000, width_in: 150, height_in: 100, length_in: 400, origin: "X", destination: "Y" }, as: Shipper, as_user_id: "${cust_id}", captures: { load_id: "$.data.id" } }
            - { call: "POST /heavy-haul/loads/${load_id}/plan", payload: { trailer_type: "FLATBED", trailer_axle_count: 2, driver_name: "X. Dy", driver_oversize_endorsed: true }, as: Dispatcher, captures: { lv2: "$.data.version" } }
          trigger:
            - { call: "POST /heavy-haul/loads/${load_id}/escort-bookings", payload: { provider_name: "Stale Pilots", position: "REAR", scheduled_start: "2026-08-12T08:00:00Z", scheduled_end: "2026-08-12T12:00:00Z", rate_per_hour_cents: 12000, expected_load_version: "${lv2} - 1" }, as: Dispatcher, captures: { err: "$.data.error_id" } }
            - { call: "POST /heavy-haul/loads/${load_id}/escort-bookings", payload: { provider_name: "Stale Pilots", position: "REAR", scheduled_start: "2026-08-12T08:00:00Z", scheduled_end: "2026-08-12T12:00:00Z", rate_per_hour_cents: 12000, expected_load_version: "${lv2}" }, as: Dispatcher, captures: { eb_st: "$.data.status" } }
          assert:
            - "err == ERR_STALE_LOAD_VERSION with http 412"
            - "eb_st == CONFIRMED (retry with the observed version succeeds)"

      - name: version_increments_each_mutation
        claim_type: optimistic_concurrency
        grounds: [entities.Load.fields, "concurrency_rules[permit-create-stale-load]"]
        distinguishing_aspect: "The common-fields contract: Load.version starts at 1 and increments by exactly one per mutation (create 1 -> plan 2 -> survey 3), and updated_at refreshes on each step."
        test_recipe:
          setup: ["Customer + new load"]
          setup_api_calls:
            - { call: "POST /heavy-haul/customers", payload: { company_name: "Version Co", credit_limit_cents: 500000 }, as: PlatformAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /heavy-haul/loads", payload: { cargo_description: "Crates", gross_weight_lbs: 40000, width_in: 100, height_in: 50, length_in: 400, origin: "X", destination: "Y" }, as: Shipper, as_user_id: "${cust_id}", captures: { load_id: "$.data.id", v1: "$.data.version" } }
          trigger:
            - { call: "POST /heavy-haul/loads/${load_id}/plan", payload: { trailer_type: "FLATBED", trailer_axle_count: 2, driver_name: "Y. Ez", driver_oversize_endorsed: false }, as: Dispatcher, captures: { v2: "$.data.version" } }
            - { call: "POST /heavy-haul/loads/${load_id}/survey", payload: { route_miles: 100, states_crossed: ["OR"], min_bridge_clearance_in: 200, max_bridge_weight_lbs: 80000 }, as: Dispatcher, captures: { v3: "$.data.version" } }
          assert:
            - "v1 == 1 and v2 == 2 and v3 == 3 (one increment per mutation, no skips)"

      - name: cascading_side_effects_coverage
        claim_type: cascading_side_effects
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: "transitive_cascade / scale_violation_cascade_depth4"
          rationale: "The 4-link scale-violation chain (fine -> revoke -> hold -> escort cancel) is asserted end-to-end by the named section 1.8 instance; the void compensation chain is covered by invoice_void_compensation_cascade."

      - name: dual_variant_calculation_coverage
        claim_type: dual_variant_calculation
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: "dual_variant_calc / invoice_provisional_vs_final_diverge"
          rationale: "Both variants and their deltas are asserted by the named section 1.8 instances (billing domain and permit-fee domain)."

      - name: rate_threshold_triggers_coverage
        claim_type: rate_threshold_triggers
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: "boundary_precision_check / standby_free_minutes_exactly_120"
          rationale: "Cumulative and instantaneous threshold boundaries (standby free minutes, escort width thresholds) are asserted by the named section 1.8 boundary instances."

  # ===========================================================================
  - section: endpoints
    instances:
      - name: cost_estimate_computed_read
        claim_type: computed_read
        grounds: [endpoints.GET_cost_estimate, calculations.cost_estimate]
        excluded_because:
          difficulty_instance: "dual_variant_calc / invoice_provisional_vs_final_diverge"
          rationale: "The computed read's line breakdown and total are asserted with literal values (475740) in the named section 1.8 instance; input-set filtering is asserted by calculations/estimate_input_set_excludes_denied."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_after_gate
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model, state_machines.Load.SURVEYED_to_CLEARED]
        distinguishing_aspect: "Immediate consistency: the securement approve that completes the readiness gate mutates the load in the same request scope, so the very next GET (no delay, no rebuild) reads status CLEARED."
        test_recipe:
          setup: ["Load 40000 lbs width 150, states [CA]; CA OVERSIZE permit GRANTED; REAR escort CONFIRMED; both cranes SCHEDULED; only the securement approval missing"]
          setup_api_calls:
            - { call: "POST /heavy-haul/customers", payload: { company_name: "Immediate Co", credit_limit_cents: 50000000 }, as: PlatformAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /heavy-haul/loads", payload: { cargo_description: "Wide crate", gross_weight_lbs: 40000, width_in: 150, height_in: 100, length_in: 400, origin: "X", destination: "Y" }, as: Shipper, as_user_id: "${cust_id}", captures: { load_id: "$.data.id" } }
            - { call: "POST /heavy-haul/loads/${load_id}/plan", payload: { trailer_type: "FLATBED", trailer_axle_count: 2, driver_name: "Z. Fe", driver_oversize_endorsed: true }, as: Dispatcher }
            - { call: "POST /heavy-haul/loads/${load_id}/survey", payload: { route_miles: 100, states_crossed: ["CA"], min_bridge_clearance_in: 200, max_bridge_weight_lbs: 80000 }, as: Dispatcher, captures: { lv3: "$.data.version" } }
            - { call: "POST /heavy-haul/loads/${load_id}/permits", payload: { state_code: "CA", permit_type: "OVERSIZE", expected_load_version: "${lv3}" }, as: PermitClerk, captures: { p_os: "$.data.id" } }
            - { call: "POST /heavy-haul/permits/${p_os}/file", payload: {}, as: PermitClerk }
            - { call: "POST /heavy-haul/permits/${p_os}/grant", payload: { travel_window_start: "2026-08-10T00:00:00Z", travel_window_end: "2026-08-20T00:00:00Z" }, as: StateAuthority }
            - { call: "GET /heavy-haul/loads/${load_id}", as: Dispatcher, captures: { lv4: "$.data.version" } }
            - { call: "POST /heavy-haul/loads/${load_id}/escort-bookings", payload: { provider_name: "Gate Pilots", position: "REAR", scheduled_start: "2026-08-12T08:00:00Z", scheduled_end: "2026-08-12T12:00:00Z", rate_per_hour_cents: 12000, expected_load_version: "${lv4}" }, as: Dispatcher }
            - { call: "POST /heavy-haul/loads/${load_id}/crane-appointments", payload: { site: "ORIGIN", crane_id: "CRANE-A", window_start: "2026-08-12T06:00:00Z", window_end: "2026-08-12T08:00:00Z" }, as: Dispatcher }
            - { call: "POST /heavy-haul/loads/${load_id}/crane-appointments", payload: { site: "DESTINATION", crane_id: "CRANE-B", window_start: "2026-08-13T06:00:00Z", window_end: "2026-08-13T08:00:00Z" }, as: Dispatcher }
            - { call: "POST /heavy-haul/loads/${load_id}/securement-plans", payload: { method: "CHAINS", tiedown_count: 2, wll_per_tiedown_lbs: 10000 }, as: Dispatcher, captures: { sp_id: "$.data.id" } }
            - { call: "GET /heavy-haul/loads/${load_id}", as: Dispatcher, captures: { st_pre: "$.data.status" } }
          trigger:
            - { call: "POST /heavy-haul/securement-plans/${sp_id}/approve", payload: {}, as: SafetyManager, captures: { sp_st: "$.data.status" } }
            - { call: "GET /heavy-haul/loads/${load_id}", as: Dispatcher, captures: { st_post: "$.data.status" } }
          assert:
            - "st_pre == SURVEYED (gate incomplete one call earlier)"
            - "sp_st == APPROVED"
            - "st_post == CLEARED on the immediate next read (no asynchronous lag)"
