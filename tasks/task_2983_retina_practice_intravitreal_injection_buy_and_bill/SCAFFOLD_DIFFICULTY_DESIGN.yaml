# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# task_2983_retina_practice_intravitreal_injection_buy_and_bill
#
# Nine Difficulty Rules x 2 instances = 18 instances.
# The reference-data prologue is defined once with YAML anchors in the first
# instance (`&c_*`) and re-used by alias (`*c_*`) in every later instance, so
# every chain below is literally the same empty-DB -> fixture walk.
#
# Pinned fixture arithmetic (all literals in asserts were computed from the
# §1.3 formulas):
#   Drug REF: vial_fill_ml 0.27, mg_per_ml 40, billing_unit_mg 1, asp 15000
#     dose 0.06 ml -> 2.4 mg -> 2 units; wasted 0.21 ml -> 8.4 mg -> 8 units
#     total 10 units (summing first would give 10.8 mg -> 11 units: rejected)
#   Policy COMM x REF: 16000/unit, admin 12000, wastage reimbursed
#     drug_allowed 32000, wastage_allowed 128000, admin_allowed 12000
#     total_allowed 172000, coinsurance 34400, standard cost 10*15000 = 150000
#     provisional_margin 172000 - 150000 = 22000
#   Enrollment: annual 500000, per_encounter_cap 40000
#     34400 < 50000 -> low tier -> cap 20000 -> foundation 20000
#     patient_responsibility 14400, practice_writeoff 0
#   Lot RX-2201 unit_acquisition_cost 132000
#     realized_margin (25600+102400+9600+14400+20000) - 132000 = 40000
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: claim_margin_provisional_vs_realized_diverge_on_one_claim
        grounds:
          - calculations.claim_margin
          - entities.Claim.fields.provisional_margin_cents
          - entities.Claim.fields.realized_margin_cents
          - entities.Claim.fields.standard_drug_cost_cents
          - entities.Claim.fields.actual_acquisition_cost_cents
          - entities.DrugLot.fields.unit_acquisition_cost_cents
        distinguishing_aspect: |
          Money domain (Claim): the provisional variant costs the injected product at
          published ASP times BILLED units (10 x 15000 = 150000) while the realized
          variant costs the whole vial actually dispensed (132000) and credits only
          posted cash, so the same claim carries provisional_margin_cents 22000 and
          realized_margin_cents 40000 — an 18000-cent divergence with every payer
          amount exactly equal to its expectation.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "Payer COMM (COMMERCIAL, coinsurance 0.20, biosimilar_preference NONE) with a PREFERRED policy on Drug REF at 16000 cents per billing unit, admin 12000, wastage reimbursed"
            - "Drug REF: SINGLE_DOSE, vial_fill_ml 0.27, mg_per_ml 40, billing_unit_mg 1, asp 15000, interval 28..112"
            - "one AVAILABLE DrugLot RX-2201 of REF, 5 vials, unit_acquisition_cost_cents 132000, expiring 2027-06-30"
            - "Patient P1 on Payer COMM with an ACTIVE INDEPENDENT_FOUNDATION enrollment (annual 500000, per-encounter cap 40000, benefit_used 0)"
            - "TreatmentPlan PLAN1 for P1/OD on REF, LOADING, with an APPROVED authorization for 3 injections effective 2026-08-01"
            - "InjectionEncounter ENC1 documented with 0.06 ml (2 administered units, 8 wasted units) and wastage-attested by a second clinician"
          setup_api_calls:
            - &c_clk
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PracticeAdmin
            - &c_pay_comm
              call: "POST /payers"
              payload: { name: "Meridian Commercial", payer_type: "COMMERCIAL", coinsurance_rate: 0.2, pa_required: true, biosimilar_preference: "NONE", appeal_window_days: 60 }
              as: PracticeAdmin
              captures: { payer_comm_id: $.data.id }
            - &c_pay_np
              call: "POST /payers"
              payload: { name: "Harbor Open Access", payer_type: "COMMERCIAL", coinsurance_rate: 0.1, pa_required: false, biosimilar_preference: "NONE", appeal_window_days: 45 }
              as: PracticeAdmin
              captures: { payer_np_id: $.data.id }
            - &c_pay_mcr
              call: "POST /payers"
              payload: { name: "National Part B", payer_type: "MEDICARE_PART_B", coinsurance_rate: 0.2, pa_required: true, biosimilar_preference: "MANDATORY", appeal_window_days: 30 }
              as: PracticeAdmin
              captures: { payer_mcr_id: $.data.id }
            - &c_drug_ref
              call: "POST /drugs"
              payload: { brand_name: "Ranovex", hcpcs_code: "J2778", vial_type: "SINGLE_DOSE", vial_fill_ml: 0.27, label_dose_ml: 0.06, mg_per_ml: 40, billing_unit_mg: 1, asp_cents_per_billing_unit: 15000, min_interval_days: 28, max_interval_days: 112, is_biosimilar: false }
              as: PracticeAdmin
              captures: { drug_ref_id: $.data.id }
            - &c_drug_bio
              call: "POST /drugs"
              payload: { brand_name: "Ranovex-BS", hcpcs_code: "Q5124", vial_type: "SINGLE_DOSE", vial_fill_ml: 0.27, label_dose_ml: 0.06, mg_per_ml: 40, billing_unit_mg: 1, asp_cents_per_billing_unit: 9000, min_interval_days: 28, max_interval_days: 112, is_biosimilar: true, reference_drug_id: "${drug_ref_id}" }
              as: PracticeAdmin
              captures: { drug_bio_id: $.data.id }
            - &c_drug_cmp
              call: "POST /drugs"
              payload: { brand_name: "Bevaflex Compounded", hcpcs_code: "J9035", vial_type: "MULTI_DOSE_COMPOUNDED", vial_fill_ml: 4.0, label_dose_ml: 0.05, mg_per_ml: 25, billing_unit_mg: 0.25, asp_cents_per_billing_unit: 1200, min_interval_days: 28, max_interval_days: 84, is_biosimilar: false }
              as: PracticeAdmin
              captures: { drug_cmp_id: $.data.id }
            - &c_pol_comm_ref
              call: "POST /payer-drug-policies"
              payload: { payer_id: "${payer_comm_id}", drug_id: "${drug_ref_id}", coverage_tier: "PREFERRED", drug_allowed_cents_per_billing_unit: 16000, admin_allowed_cents: 12000, wastage_reimbursed: true, pa_required: true, pa_validity_days: 180, pa_max_injections: 3, required_prior_failures: 0 }
              as: PracticeAdmin
              captures: { pol_comm_ref_id: $.data.id }
            - &c_pol_np_ref
              call: "POST /payer-drug-policies"
              payload: { payer_id: "${payer_np_id}", drug_id: "${drug_ref_id}", coverage_tier: "PREFERRED", drug_allowed_cents_per_billing_unit: 14000, admin_allowed_cents: 10000, wastage_reimbursed: false, pa_required: false, pa_validity_days: 180, pa_max_injections: 3, required_prior_failures: 0 }
              as: PracticeAdmin
              captures: { pol_np_ref_id: $.data.id }
            - &c_pol_mcr_ref
              call: "POST /payer-drug-policies"
              payload: { payer_id: "${payer_mcr_id}", drug_id: "${drug_ref_id}", coverage_tier: "NON_PREFERRED", drug_allowed_cents_per_billing_unit: 15500, admin_allowed_cents: 11000, wastage_reimbursed: true, pa_required: true, pa_validity_days: 180, pa_max_injections: 3, required_prior_failures: 0 }
              as: PracticeAdmin
              captures: { pol_mcr_ref_id: $.data.id }
            - &c_pol_mcr_bio
              call: "POST /payer-drug-policies"
              payload: { payer_id: "${payer_mcr_id}", drug_id: "${drug_bio_id}", coverage_tier: "PREFERRED", drug_allowed_cents_per_billing_unit: 9500, admin_allowed_cents: 11000, wastage_reimbursed: true, pa_required: true, pa_validity_days: 180, pa_max_injections: 3, required_prior_failures: 0 }
              as: PracticeAdmin
              captures: { pol_mcr_bio_id: $.data.id }
            - &c_pt1
              call: "POST /patients"
              payload: { mrn: "MRN-1001", full_name: "Alma Reyes", payer_id: "${payer_comm_id}", member_id: "C-1001", contact_point: "alma@example.com", notification_channel: "EMAIL" }
              as: PracticeAdmin
              captures: { pt1_id: $.data.id }
            - &c_pt2
              call: "POST /patients"
              payload: { mrn: "MRN-1002", full_name: "Bo Nakamura", payer_id: "${payer_mcr_id}", member_id: "M-1002", contact_point: "+15550001002", notification_channel: "SMS" }
              as: PracticeAdmin
              captures: { pt2_id: $.data.id }
            - &c_pt3
              call: "POST /patients"
              payload: { mrn: "MRN-1003", full_name: "Cleo Iverson", payer_id: "${payer_np_id}", member_id: "H-1003", contact_point: "+15550001003", notification_channel: "PHONE" }
              as: PracticeAdmin
              captures: { pt3_id: $.data.id }
            - &c_pt4
              call: "POST /patients"
              payload: { mrn: "MRN-1004", full_name: "Dara Okonjo", payer_id: "${payer_np_id}", member_id: "H-1004", contact_point: "+15550001004", notification_channel: "PHONE" }
              as: PracticeAdmin
              captures: { pt4_id: $.data.id }
            - &c_cl1
              call: "POST /clinicians"
              payload: { full_name: "Ivo Sandoval", npi: "1000000001", credential: "MD", injection_privilege: true, max_injections_per_day: 12 }
              as: PracticeAdmin
              captures: { cl1_id: $.data.id }
            - &c_cl2
              call: "POST /clinicians"
              payload: { full_name: "Petra Lund", npi: "1000000002", credential: "MD", injection_privilege: true, max_injections_per_day: 12 }
              as: PracticeAdmin
              captures: { cl2_id: $.data.id }
            - &c_cl3
              call: "POST /clinicians"
              payload: { full_name: "Rune Vasquez", npi: "1000000003", credential: "DO", injection_privilege: true, max_injections_per_day: 1 }
              as: PracticeAdmin
              captures: { cl3_id: $.data.id }
            - &c_lot_ref
              call: "POST /drug-lots"
              payload: { drug_id: "${drug_ref_id}", lot_number: "RX-2201", expiration_date: "2027-06-30T00:00:00Z", received_date: "2026-07-01T00:00:00Z", unit_acquisition_cost_cents: 132000, vials_received: 5 }
              as: PharmacyTech
              captures: { lot_ref_id: $.data.id }
            - &c_img1
              call: "POST /imaging-studies"
              payload: { patient_id: "${pt1_id}", eye: "OD", study_datetime: "2026-08-01T00:00:00Z", central_subfield_thickness_um: 420, intraretinal_fluid: true, subretinal_fluid: true, new_hemorrhage: false, va_letter_score: 62 }
              as: RetinaSpecialist
              as_user_id: "${cl1_id}"
              captures: { img1_id: $.data.id, img1_activity: $.data.disease_activity }
            - &c_plan1
              call: "POST /treatment-plans"
              payload: { patient_id: "${pt1_id}", drug_id: "${drug_ref_id}", eye: "OD", loading_doses_required: 3 }
              as: RetinaSpecialist
              as_user_id: "${cl1_id}"
              captures: { plan1_id: $.data.id }
            - &c_plan1_act
              call: "POST /treatment-plans/${plan1_id}/activate"
              payload: { baseline_imaging_study_id: "${img1_id}" }
              as: RetinaSpecialist
              as_user_id: "${cl1_id}"
              captures: { plan1_v_act: $.data.version }
            - &c_pa1
              call: "POST /prior-authorizations"
              payload: { treatment_plan_id: "${plan1_id}", expected_treatment_plan_version: "${plan1_v_act}" }
              as: BillingSpecialist
              captures: { pa1_id: $.data.id }
            - &c_pa1_sub
              call: "POST /prior-authorizations/${pa1_id}/submit"
              payload: { clinical_justification: "Treatment-naive nAMD with subretinal fluid on OCT" }
              as: BillingSpecialist
            - &c_pa1_dec
              call: "POST /prior-authorizations/${pa1_id}/decision"
              payload: { decision: "APPROVED", auth_number: "AUTH-778", approved_injections: 3, effective_date: "2026-08-01T00:00:00Z" }
              as: BillingSpecialist
            - &c_plan1_get
              call: "GET /treatment-plans/${plan1_id}"
              as: RetinaSpecialist
              as_user_id: "${cl1_id}"
              captures: { plan1_v_pa: $.data.version }
            - &c_enc1
              call: "POST /injection-encounters"
              payload: { treatment_plan_id: "${plan1_id}", imaging_study_id: "${img1_id}", encounter_datetime: "2026-08-01T09:00:00Z", expected_treatment_plan_version: "${plan1_v_pa}" }
              as: RetinaSpecialist
              as_user_id: "${cl1_id}"
              captures: { enc1_id: $.data.id, enc1_vial_id: $.data.vial_id }
            - &c_enc1_doc
              call: "POST /injection-encounters/${enc1_id}/document"
              payload: { administered_dose_ml: 0.06, injection_site_prep_confirmed: true, post_injection_iop_mmhg: 16 }
              as: RetinaSpecialist
              as_user_id: "${cl1_id}"
            - &c_enc1_att
              call: "POST /injection-encounters/${enc1_id}/attest-wastage"
              payload: { attested_wasted_ml: 0.21 }
              as: RetinaSpecialist
              as_user_id: "${cl2_id}"
            - &c_enr1
              call: "POST /assistance-enrollments"
              payload: { patient_id: "${pt1_id}", program_type: "INDEPENDENT_FOUNDATION", annual_benefit_cents: 500000, per_encounter_cap_cents: 40000, effective_date: "2026-07-01T00:00:00Z", expiration_date: "2026-12-31T00:00:00Z" }
              as: BillingSpecialist
              captures: { enr1_id: $.data.id }
            - &c_enr1_appr
              call: "POST /assistance-enrollments/${enr1_id}/approve"
              as: BillingSpecialist
          trigger:
            - call: "POST /claims"
              payload: { injection_encounter_id: "${enc1_id}" }
              as: BillingSpecialist
              captures: { claim1_id: $.data.id, claim1_prov: $.data.provisional_margin_cents }
            - call: "POST /claims/${claim1_id}/submit"
              as: BillingSpecialist
            - call: "POST /claims/${claim1_id}/remittance"
              payload: { drug_line_outcome: "PAID", drug_allowed_cents: 32000, drug_paid_cents: 25600, wastage_allowed_cents: 128000, wastage_paid_cents: 102400, admin_line_outcome: "PAID", admin_allowed_cents: 12000, admin_paid_cents: 9600 }
              as: BillingSpecialist
          assert:
            - "Claim.${claim1_id}.standard_drug_cost_cents == 150000"
            - "Claim.${claim1_id}.provisional_margin_cents == 22000"
            - "Claim.${claim1_id}.actual_acquisition_cost_cents == 132000"
            - "Claim.${claim1_id}.realized_margin_cents == 40000"
            - "Claim.${claim1_id}.realized_margin_cents - Claim.${claim1_id}.provisional_margin_cents == 18000"
            - "Claim.${claim1_id}.total_allowed_cents == 172000 and Claim.${claim1_id}.drug_paid_cents + Claim.${claim1_id}.wastage_paid_cents + Claim.${claim1_id}.admin_paid_cents == 137600"
            - "InjectionEncounter.${enc1_id}.status == CLOSED"

      - name: lot_exposure_carrying_vs_expiration_diverge_on_one_lot
        grounds:
          - calculations.lot_exposure
          - entities.DrugLot.fields.carrying_cost_accrued_cents
          - entities.DrugLot.fields.vials_on_hand
          - entities.Vial.fields.administered_at
        distinguishing_aspect: |
          Inventory domain (DrugLot): on the same lot at the same clock the CARRYING
          variant reports 9967 cents (61-day-independent time value of 3 shelved vials
          held 47 days) while the EXPIRATION variant reports 387000 cents (all 3 vials
          unconsumable before the 2026-09-15 expiry at a 1-in-30-days burn rate) —
          carrying ignores the expiration date, expiration ignores holding time.
        test_recipe:
          setup:
            - "the reference-data prologue, with ENC1 documented on 2026-08-01T09:00:00Z consuming one vial of lot RX-2201"
            - "a second lot RX-2199 of Drug REF received 2026-07-15, expiring 2026-09-15, 3 vials at 129000 cents each, created after ENC1 so FEFO never touched it"
            - "logical clock advanced to 2026-08-31T00:00:00Z: lot RX-2199 has been held 47 days and has 15 days of shelf life left"
            - "trailing 30-day burn window [2026-08-01T00:00:00Z, 2026-08-31T00:00:00Z) contains exactly one ADMINISTERED vial of Drug REF"
          setup_api_calls:
            - *c_clk
            - *c_pay_comm
            - *c_pay_np
            - *c_pay_mcr
            - *c_drug_ref
            - *c_drug_bio
            - *c_drug_cmp
            - *c_pol_comm_ref
            - *c_pol_np_ref
            - *c_pol_mcr_ref
            - *c_pol_mcr_bio
            - *c_pt1
            - *c_pt2
            - *c_pt3
            - *c_pt4
            - *c_cl1
            - *c_cl2
            - *c_cl3
            - *c_lot_ref
            - *c_img1
            - *c_plan1
            - *c_plan1_act
            - *c_pa1
            - *c_pa1_sub
            - *c_pa1_dec
            - *c_plan1_get
            - *c_enc1
            - *c_enc1_doc
            - &c_lot_early
              call: "POST /drug-lots"
              payload: { drug_id: "${drug_ref_id}", lot_number: "RX-2199", expiration_date: "2026-09-15T00:00:00Z", received_date: "2026-07-15T00:00:00Z", unit_acquisition_cost_cents: 129000, vials_received: 3 }
              as: PharmacyTech
              captures: { lot_early_id: $.data.id }
            - &c_clk_0831
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-31T00:00:00Z" }
              as: PracticeAdmin
          trigger:
            - call: "GET /drug-lots/${lot_early_id}/exposure"
              payload: { basis: "CARRYING" }
              as: PharmacyTech
              captures: { carry_cents: $.data.exposure_cents }
            - call: "GET /drug-lots/${lot_early_id}/exposure"
              payload: { basis: "EXPIRATION" }
              as: PharmacyTech
              captures: { expiry_cents: $.data.exposure_cents }
          assert:
            - "CARRYING response: days_held == 47, unconsumed_vials == 3, unconsumed_value_cents == 387000, exposure_cents == 9967"
            - "EXPIRATION response: projected_burn_vials == 0, at_risk_vials == 3, exposure_cents == 387000"
            - "${carry_cents} != ${expiry_cents}"
            - "DrugLot.${lot_early_id}.carrying_cost_accrued_cents == 0 (the computed read persists nothing)"

  - rule_id: combinatorial_formula
    instances:

      - name: billing_units_rounded_per_line_before_summation
        grounds:
          - calculations.billing_units_split
          - calculations.modifier_assembly
          - entities.InjectionEncounter.fields.administered_billing_units
          - entities.InjectionEncounter.fields.wasted_billing_units
          - entities.InjectionEncounter.fields.total_billed_billing_units
        distinguishing_aspect: |
          Mode (b) — pinned evaluation order: each billed line is rounded half-up to
          whole billing units BEFORE summation, so 2.4 mg -> 2 units and 8.4 mg ->
          8 units give total 10; the arithmetically tempting order (sum 10.8 mg, round
          once) yields 11 and is wrong. The two orders disagree on the same inputs.
        test_recipe:
          setup:
            - "the reference-data prologue with PLAN1 LOADING and an APPROVED authorization for 3 injections"
            - "ENC1 created DRAFT on 2026-08-01T09:00:00Z holding one reserved vial of Drug REF (vial_fill_ml 0.27, mg_per_ml 40, billing_unit_mg 1)"
          setup_api_calls:
            - *c_clk
            - *c_pay_comm
            - *c_pay_np
            - *c_pay_mcr
            - *c_drug_ref
            - *c_drug_bio
            - *c_drug_cmp
            - *c_pol_comm_ref
            - *c_pol_np_ref
            - *c_pol_mcr_ref
            - *c_pol_mcr_bio
            - *c_pt1
            - *c_pt2
            - *c_pt3
            - *c_pt4
            - *c_cl1
            - *c_cl2
            - *c_cl3
            - *c_lot_ref
            - *c_img1
            - *c_plan1
            - *c_plan1_act
            - *c_pa1
            - *c_pa1_sub
            - *c_pa1_dec
            - *c_plan1_get
            - *c_enc1
          trigger:
            - call: "POST /injection-encounters/${enc1_id}/document"
              payload: { administered_dose_ml: 0.06, injection_site_prep_confirmed: true, post_injection_iop_mmhg: 16 }
              as: RetinaSpecialist
              as_user_id: "${cl1_id}"
              captures: { enc1_total_units: $.data.total_billed_billing_units }
          assert:
            - "InjectionEncounter.${enc1_id}.wasted_ml == 0.21"
            - "InjectionEncounter.${enc1_id}.administered_billing_units == 2"
            - "InjectionEncounter.${enc1_id}.wasted_billing_units == 8"
            - "InjectionEncounter.${enc1_id}.total_billed_billing_units == 10"
            - "${enc1_total_units} != 11"
            - "InjectionEncounter.${enc1_id}.modifiers == [\"RT\", \"JW\"]"

      - name: responsibility_waterfall_tier_cap_keyed_on_coinsurance
        grounds:
          - calculations.patient_responsibility_waterfall
          - entities.Claim.fields.coinsurance_cents
          - entities.Claim.fields.foundation_applied_cents
          - entities.Claim.fields.patient_responsibility_cents
          - entities.AssistanceEnrollment.fields.benefit_used_cents
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency resolved by a pinned single-pass
          order: the foundation tier cap is keyed on the coinsurance (34400 < 50000 ->
          low tier -> 40000 * 0.5 = 20000), never on the allowed total (172000, which
          would select the high tier and pay 34400 leaving the patient 0). The claim
          therefore shows foundation 20000 and responsibility 14400, not 34400 and 0.
        test_recipe:
          setup:
            - "the reference-data prologue with ENC1 documented (0.06 ml) and wastage-attested"
            - "Patient P1 holds an ACTIVE INDEPENDENT_FOUNDATION enrollment: annual 500000, per_encounter_cap 40000, benefit_used 0"
            - "logical clock 2026-08-01T00:00:00Z sits inside the enrollment window 2026-07-01 .. 2026-12-31"
          setup_api_calls:
            - *c_clk
            - *c_pay_comm
            - *c_pay_np
            - *c_pay_mcr
            - *c_drug_ref
            - *c_drug_bio
            - *c_drug_cmp
            - *c_pol_comm_ref
            - *c_pol_np_ref
            - *c_pol_mcr_ref
            - *c_pol_mcr_bio
            - *c_pt1
            - *c_pt2
            - *c_pt3
            - *c_pt4
            - *c_cl1
            - *c_cl2
            - *c_cl3
            - *c_lot_ref
            - *c_img1
            - *c_plan1
            - *c_plan1_act
            - *c_pa1
            - *c_pa1_sub
            - *c_pa1_dec
            - *c_plan1_get
            - *c_enc1
            - *c_enc1_doc
            - *c_enc1_att
            - *c_enr1
            - *c_enr1_appr
          trigger:
            - call: "POST /claims"
              payload: { injection_encounter_id: "${enc1_id}" }
              as: BillingSpecialist
              captures: { claim2_id: $.data.id, claim2_foundation: $.data.foundation_applied_cents }
          assert:
            - "Claim.${claim2_id}.total_allowed_cents == 172000"
            - "Claim.${claim2_id}.coinsurance_cents == 34400"
            - "Claim.${claim2_id}.foundation_applied_cents == 20000"
            - "${claim2_foundation} != 34400"
            - "Claim.${claim2_id}.patient_responsibility_cents == 14400"
            - "Claim.${claim2_id}.practice_writeoff_cents == 0"
            - "Claim.${claim2_id}.assistance_enrollment_id == ${enr1_id}"
            - "AssistanceEnrollment.${enr1_id}.benefit_used_cents == 20000"
            - "AssistanceEnrollment.${enr1_id}.status == ACTIVE"

  - rule_id: non_linear_state_machine
    instances:

      - name: authorization_cycles_info_requested_denial_appeal_to_approved
        grounds:
          - state_machines.PriorAuthorization.SUBMITTED_to_INFO_REQUESTED
          - state_machines.PriorAuthorization.INFO_REQUESTED_to_SUBMITTED
          - state_machines.PriorAuthorization.SUBMITTED_to_DENIED
          - state_machines.PriorAuthorization.DENIED_to_APPEALED
          - state_machines.PriorAuthorization.APPEALED_to_APPROVED
          - entities.PriorAuthorization.fields.submission_count
        distinguishing_aspect: |
          Cyclic shape on PriorAuthorization: the row re-enters SUBMITTED after
          INFO_REQUESTED (submission_count reaches 2) and reaches APPROVED through the
          DENIED -> APPEALED back-edge rather than the direct SUBMITTED -> APPROVED
          edge, so the terminal-looking DENIED state is provably non-terminal.
        test_recipe:
          setup:
            - "the reference-data prologue through PLAN1 activation"
            - "authorization PA1 created DRAFT then submitted once (submission_count 1)"
            - "logical clock 2026-08-01T00:00:00Z, Payer COMM appeal_window_days 60"
          setup_api_calls:
            - *c_clk
            - *c_pay_comm
            - *c_pay_np
            - *c_pay_mcr
            - *c_drug_ref
            - *c_drug_bio
            - *c_drug_cmp
            - *c_pol_comm_ref
            - *c_pol_np_ref
            - *c_pol_mcr_ref
            - *c_pol_mcr_bio
            - *c_pt1
            - *c_pt2
            - *c_pt3
            - *c_pt4
            - *c_cl1
            - *c_cl2
            - *c_cl3
            - *c_lot_ref
            - *c_img1
            - *c_plan1
            - *c_plan1_act
            - *c_pa1
            - *c_pa1_sub
          trigger:
            - call: "POST /prior-authorizations/${pa1_id}/decision"
              payload: { decision: "INFO_REQUESTED", information_requested: "Send the OCT report and prior anti-VEGF history" }
              as: BillingSpecialist
            - call: "POST /prior-authorizations/${pa1_id}/submit"
              payload: { clinical_justification: "OCT report attached; two prior compounded failures documented" }
              as: BillingSpecialist
              captures: { pa1_subs: $.data.submission_count }
            - call: "POST /prior-authorizations/${pa1_id}/decision"
              payload: { decision: "DENIED", denial_reason: "NOT_MEDICALLY_NECESSARY" }
              as: BillingSpecialist
            - call: "POST /prior-authorizations/${pa1_id}/appeal"
              payload: { appeal_basis: "Persistent subretinal fluid on serial OCT" }
              as: BillingSpecialist
            - call: "POST /prior-authorizations/${pa1_id}/decision"
              payload: { decision: "APPROVED", auth_number: "AUTH-902", approved_injections: 3, effective_date: "2026-08-01T00:00:00Z" }
              as: BillingSpecialist
          assert:
            - "${pa1_subs} == 2"
            - "PriorAuthorization.${pa1_id}.submission_count == 2"
            - "PriorAuthorization.${pa1_id}.status == APPROVED"
            - "PriorAuthorization.${pa1_id}.auth_number == \"AUTH-902\""
            - "PriorAuthorization.${pa1_id}.approved_injections == 3"
            - "PriorAuthorization.${pa1_id}.expiration_date == \"2027-01-28T00:00:00Z\""
            - "PriorAuthorization.${pa1_id}.injections_used == 0"

      - name: claim_drug_and_admin_line_dimensions_advance_independently
        grounds:
          - state_machines.Claim.SUBMITTED_to_DENIED
          - state_machines.Claim.SUBMITTED_to_PAID
          - entities.Claim.fields.drug_line_status
          - entities.Claim.fields.admin_line_status
          - calculations.claim_margin
        distinguishing_aspect: |
          Parallel shape on Claim: one remittance denies the administration line while
          the drug line stays SUBMITTED, and realized_margin_cents stays null until the
          second remittance makes both dimensions terminal — the two axes move
          independently on the same row and the realized margin lands at 28000 (not the
          40000 of a fully paid claim) because the denied admin line contributes 0.
        test_recipe:
          setup:
            - "the reference-data prologue with ENC1 documented, attested, an ACTIVE foundation enrollment and a submitted Claim"
            - "both line dimensions of the claim are SUBMITTED"
          setup_api_calls:
            - *c_clk
            - *c_pay_comm
            - *c_pay_np
            - *c_pay_mcr
            - *c_drug_ref
            - *c_drug_bio
            - *c_drug_cmp
            - *c_pol_comm_ref
            - *c_pol_np_ref
            - *c_pol_mcr_ref
            - *c_pol_mcr_bio
            - *c_pt1
            - *c_pt2
            - *c_pt3
            - *c_pt4
            - *c_cl1
            - *c_cl2
            - *c_cl3
            - *c_lot_ref
            - *c_img1
            - *c_plan1
            - *c_plan1_act
            - *c_pa1
            - *c_pa1_sub
            - *c_pa1_dec
            - *c_plan1_get
            - *c_enc1
            - *c_enc1_doc
            - *c_enc1_att
            - *c_enr1
            - *c_enr1_appr
            - &c_claim3
              call: "POST /claims"
              payload: { injection_encounter_id: "${enc1_id}" }
              as: BillingSpecialist
              captures: { claim3_id: $.data.id }
            - &c_claim3_sub
              call: "POST /claims/${claim3_id}/submit"
              as: BillingSpecialist
          trigger:
            - call: "POST /claims/${claim3_id}/remittance"
              payload: { admin_line_outcome: "DENIED", admin_allowed_cents: 0, admin_paid_cents: 0, denial_code: "NOT_COVERED" }
              as: BillingSpecialist
              captures: { c3_drug_after_admin: $.data.drug_line_status, c3_realized_mid: $.data.realized_margin_cents }
            - call: "POST /claims/${claim3_id}/remittance"
              payload: { drug_line_outcome: "PAID", drug_allowed_cents: 32000, drug_paid_cents: 25600, wastage_allowed_cents: 128000, wastage_paid_cents: 102400 }
              as: BillingSpecialist
          assert:
            - "${c3_drug_after_admin} == SUBMITTED"
            - "${c3_realized_mid} == null"
            - "Claim.${claim3_id}.admin_line_status == DENIED"
            - "Claim.${claim3_id}.drug_line_status == PAID"
            - "Claim.${claim3_id}.total_allowed_cents == 160000"
            - "Claim.${claim3_id}.coinsurance_cents == 32000"
            - "Claim.${claim3_id}.foundation_applied_cents == 20000"
            - "Claim.${claim3_id}.patient_responsibility_cents == 12000"
            - "Claim.${claim3_id}.practice_writeoff_cents == 0"
            - "Claim.${claim3_id}.realized_margin_cents == 28000"
            - "InjectionEncounter.${enc1_id}.status == CLOSED"

  - rule_id: transitive_cascade
    instances:

      - name: related_adverse_event_suspends_plan_voids_draft_and_revives_authorization
        grounds:
          - state_machines.AdverseEvent.UNDER_INVESTIGATION_to_ADJUDICATED_RELATED
          - state_machines.TreatmentPlan.LOADING_to_SUSPENDED
          - state_machines.InjectionEncounter.DRAFT_to_VOIDED
          - state_machines.Vial.RESERVED_to_IN_STOCK
          - state_machines.PriorAuthorization.EXHAUSTED_to_APPROVED
          - calculations.adverse_event_reportability
        distinguishing_aspect: |
          Four-hop chain seeded by one adjudication: AdverseEvent -> TreatmentPlan
          SUSPENDED -> DRAFT encounter VOIDED and its Vial released to IN_STOCK ->
          PriorAuthorization.injections_used recomputed to 1, flipping EXHAUSTED back
          to APPROVED. The UNRELATED branch of the same edge fires none of these hops.
        test_recipe:
          setup:
            - "the reference-data prologue through PLAN1 activation, with an APPROVED authorization for only 2 injections"
            - "ENC1 documented on 2026-08-01T09:00:00Z (one vial ADMINISTERED, injections_used 1)"
            - "logical clock advanced to 2026-08-29T00:00:00Z with a fresh ACTIVE study for P1/OD"
            - "ENC2 created DRAFT on 2026-08-29T09:00:00Z, exactly 28 days after ENC1, holding a RESERVED vial; injections_used reaches 2 so PA1 is EXHAUSTED"
            - "an ENDOPHTHALMITIS AdverseEvent on ENC1 (onset 2026-08-05, SEVERE, culture POSITIVE) is UNDER_INVESTIGATION"
          setup_api_calls:
            - *c_clk
            - *c_pay_comm
            - *c_pay_np
            - *c_pay_mcr
            - *c_drug_ref
            - *c_drug_bio
            - *c_drug_cmp
            - *c_pol_comm_ref
            - *c_pol_np_ref
            - *c_pol_mcr_ref
            - *c_pol_mcr_bio
            - *c_pt1
            - *c_pt2
            - *c_pt3
            - *c_pt4
            - *c_cl1
            - *c_cl2
            - *c_cl3
            - *c_lot_ref
            - *c_img1
            - *c_plan1
            - *c_plan1_act
            - *c_pa1
            - *c_pa1_sub
            - call: "POST /prior-authorizations/${pa1_id}/decision"
              payload: { decision: "APPROVED", auth_number: "AUTH-611", approved_injections: 2, effective_date: "2026-08-01T00:00:00Z" }
              as: BillingSpecialist
            - *c_plan1_get
            - *c_enc1
            - *c_enc1_doc
            - &c_clk_0829
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-29T00:00:00Z" }
              as: PracticeAdmin
            - &c_img2
              call: "POST /imaging-studies"
              payload: { patient_id: "${pt1_id}", eye: "OD", study_datetime: "2026-08-29T00:00:00Z", central_subfield_thickness_um: 388, intraretinal_fluid: true, subretinal_fluid: false, new_hemorrhage: false, va_letter_score: 65 }
              as: RetinaSpecialist
              as_user_id: "${cl1_id}"
              captures: { img2_id: $.data.id }
            - &c_plan1_get2
              call: "GET /treatment-plans/${plan1_id}"
              as: RetinaSpecialist
              as_user_id: "${cl1_id}"
              captures: { plan1_v_doc: $.data.version }
            - &c_enc2
              call: "POST /injection-encounters"
              payload: { treatment_plan_id: "${plan1_id}", imaging_study_id: "${img2_id}", encounter_datetime: "2026-08-29T09:00:00Z", expected_treatment_plan_version: "${plan1_v_doc}" }
              as: RetinaSpecialist
              as_user_id: "${cl1_id}"
              captures: { enc2_id: $.data.id, enc2_vial_id: $.data.vial_id }
            - &c_ae1
              call: "POST /adverse-events"
              payload: { injection_encounter_id: "${enc1_id}", event_type: "ENDOPHTHALMITIS", onset_datetime: "2026-08-05T00:00:00Z", severity: "SEVERE", culture_result: "POSITIVE" }
              as: RetinaSpecialist
              as_user_id: "${cl1_id}"
              captures: { ae1_id: $.data.id }
            - &c_ae1_inv
              call: "POST /adverse-events/${ae1_id}/start-investigation"
              as: ComplianceOfficer
          trigger:
            - call: "POST /adverse-events/${ae1_id}/adjudicate"
              payload: { outcome: "RELATED", adjudication_note: "Culture-positive endophthalmitis attributable to the injection" }
              as: RetinaSpecialist
              as_user_id: "${cl2_id}"
          assert:
            - "AdverseEvent.${ae1_id}.status == ADJUDICATED_RELATED"
            - "AdverseEvent.${ae1_id}.adjudicated_by_clinician_id == ${cl2_id}"
            - "AdverseEvent.${ae1_id}.days_post_injection == 3"
            - "AdverseEvent.${ae1_id}.reportable == true"
            - "AdverseEvent.${ae1_id}.fda_report_due_date == \"2026-08-20T00:00:00Z\""
            - "hop 2: TreatmentPlan.${plan1_id}.status == SUSPENDED with suspension_reason == ADVERSE_EVENT and next_due_date == null"
            - "hop 3: InjectionEncounter.${enc2_id}.status == VOIDED"
            - "hop 3: Vial.${enc2_vial_id}.status == IN_STOCK with reserved_for_encounter_id == null and reserved_at == null"
            - "hop 4: PriorAuthorization.${pa1_id}.injections_used == 1 and PriorAuthorization.${pa1_id}.status == APPROVED"
            - "DrugLot.${lot_ref_id}.related_endophthalmitis_count == 1 and DrugLot.${lot_ref_id}.status == AVAILABLE"
            - "DrugLot.${lot_ref_id}.vials_on_hand == 4, vials_reserved == 0, vials_administered == 1"
            - "InjectionEncounter.${enc1_id}.status == DOCUMENTED (the source encounter itself is untouched)"

      - name: lot_recall_quarantines_vials_voids_drafts_and_generates_notifications
        grounds:
          - state_machines.DrugLot.AVAILABLE_to_RECALLED
          - state_machines.Vial.RESERVED_to_QUARANTINED
          - state_machines.InjectionEncounter.DRAFT_to_VOIDED
          - state_machines.RecallNotification.initial_state
          - calculations.recall_notification_plan
        distinguishing_aspect: |
          Three-hop chain seeded by one recall on a different aggregate root (DrugLot,
          not AdverseEvent): DrugLot -> every IN_STOCK and RESERVED Vial QUARANTINED ->
          the DRAFT encounter holding a reservation VOIDED with void_reason LOT_RECALLED
          plus one RecallNotification per exposed DOCUMENTED encounter (1, not 2 — the
          voided DRAFT encounter generates none).
        test_recipe:
          setup:
            - "the reference-data prologue with an APPROVED authorization for 3 injections"
            - "ENC1 documented on 2026-08-01T09:00:00Z consuming vial 1 of lot RX-2201"
            - "logical clock 2026-08-29T00:00:00Z, fresh ACTIVE study, ENC2 created DRAFT holding a RESERVED vial of the same lot"
            - "lot RX-2201: 3 IN_STOCK, 1 RESERVED, 1 ADMINISTERED, status AVAILABLE, no open recall"
          setup_api_calls:
            - *c_clk
            - *c_pay_comm
            - *c_pay_np
            - *c_pay_mcr
            - *c_drug_ref
            - *c_drug_bio
            - *c_drug_cmp
            - *c_pol_comm_ref
            - *c_pol_np_ref
            - *c_pol_mcr_ref
            - *c_pol_mcr_bio
            - *c_pt1
            - *c_pt2
            - *c_pt3
            - *c_pt4
            - *c_cl1
            - *c_cl2
            - *c_cl3
            - *c_lot_ref
            - *c_img1
            - *c_plan1
            - *c_plan1_act
            - *c_pa1
            - *c_pa1_sub
            - *c_pa1_dec
            - *c_plan1_get
            - *c_enc1
            - *c_enc1_doc
            - *c_clk_0829
            - *c_img2
            - *c_plan1_get2
            - *c_enc2
          trigger:
            - call: "POST /lot-recalls"
              payload: { drug_lot_id: "${lot_ref_id}", recall_class: "CLASS_II", reason: "Manufacturer particulate-matter recall" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { recall1_id: $.data.id, recall1_required: $.data.notifications_required }
          assert:
            - "LotRecall.${recall1_id}.status == INITIATED"
            - "LotRecall.${recall1_id}.initiated_by_user_id == \"co-1\""
            - "LotRecall.${recall1_id}.notification_deadline_date == \"2026-09-08T00:00:00Z\""
            - "${recall1_required} == 1"
            - "hop 1: DrugLot.${lot_ref_id}.status == RECALLED"
            - "hop 2: DrugLot.${lot_ref_id}.vials_quarantined == 4, vials_on_hand == 0, vials_reserved == 0, vials_administered == 1"
            - "hop 2: Vial.${enc2_vial_id}.status == QUARANTINED with reserved_for_encounter_id == null"
            - "hop 3: InjectionEncounter.${enc2_id}.status == VOIDED with void_reason == \"LOT_RECALLED\""
            - "hop 3: exactly one RecallNotification exists for lot_recall_id ${recall1_id}, with patient_id ${pt1_id}, injection_encounter_id ${enc1_id}, channel EMAIL and status PENDING"
            - "PriorAuthorization.${pa1_id}.injections_used == 1"

  - rule_id: priority_pair_validation_conflict
    instances:

      - name: stale_plan_version_outranks_clinician_ineligibility_and_rejects_with_412
        grounds:
          - validations.priority_12
          - validations.priority_14
          - concurrency_rules.encounter-create-stale-plan
        distinguishing_aspect: |
          Priority 12 (ERR_STALE_PLAN_VERSION, 412) and priority 14
          (ERR_CLINICIAN_NOT_ELIGIBLE, 409) are violated by the same request. Only the
          412 may be returned; the control call fixes the version alone and proves the
          409 was genuinely armed the whole time.
        test_recipe:
          setup:
            - "the reference-data prologue through PLAN1 activation and an APPROVED authorization"
            - "the plan version observed at activation (plan1_v_act) is already superseded because creating the authorization incremented TreatmentPlan.version"
            - "clinician CL1 is then SUSPENDED, so CL1 is no longer injection-eligible"
          setup_api_calls:
            - *c_clk
            - *c_pay_comm
            - *c_pay_np
            - *c_pay_mcr
            - *c_drug_ref
            - *c_drug_bio
            - *c_drug_cmp
            - *c_pol_comm_ref
            - *c_pol_np_ref
            - *c_pol_mcr_ref
            - *c_pol_mcr_bio
            - *c_pt1
            - *c_pt2
            - *c_pt3
            - *c_pt4
            - *c_cl1
            - *c_cl2
            - *c_cl3
            - *c_lot_ref
            - *c_img1
            - *c_plan1
            - *c_plan1_act
            - *c_pa1
            - *c_pa1_sub
            - *c_pa1_dec
            - *c_plan1_get
            - call: "POST /clinicians/${cl1_id}/suspend"
              payload: { suspension_reason: "State board licence review" }
              as: PracticeAdmin
          trigger:
            - call: "POST /injection-encounters"
              payload: { treatment_plan_id: "${plan1_id}", imaging_study_id: "${img1_id}", encounter_datetime: "2026-08-01T09:00:00Z", expected_treatment_plan_version: "${plan1_v_act}" }
              as: RetinaSpecialist
              as_user_id: "${cl1_id}"
              captures: { pair1_error: $.data.error_id }
            - call: "POST /injection-encounters"
              payload: { treatment_plan_id: "${plan1_id}", imaging_study_id: "${img1_id}", encounter_datetime: "2026-08-01T09:00:00Z", expected_treatment_plan_version: "${plan1_v_pa}" }
              as: RetinaSpecialist
              as_user_id: "${cl1_id}"
              captures: { pair1_control_error: $.data.error_id }
          assert:
            - "${pair1_error} == \"ERR_STALE_PLAN_VERSION\" with HTTP 412"
            - "${pair1_error} != \"ERR_CLINICIAN_NOT_ELIGIBLE\""
            - "${pair1_control_error} == \"ERR_CLINICIAN_NOT_ELIGIBLE\" with HTTP 409"
            - "TreatmentPlan.${plan1_id}.injections_administered == 0 (neither rejected call reserved a vial)"
            - "DrugLot.${lot_ref_id}.vials_on_hand == 5 and DrugLot.${lot_ref_id}.vials_reserved == 0"
            - "PriorAuthorization.${pa1_id}.injections_used == 0"

      - name: interval_violation_outranks_day_capacity_and_is_rejected
        grounds:
          - validations.priority_17
          - validations.priority_18
