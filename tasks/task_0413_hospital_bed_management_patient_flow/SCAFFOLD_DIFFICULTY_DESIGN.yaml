  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: bed_occupancy_conservation_place_then_discharge
        grounds:
          - state_machines.Bed.CLEAN_to_OCCUPIED
          - state_machines.Bed.OCCUPIED_to_DIRTY
          - state_machines.Encounter.DISCHARGE_ORDERED_to_DISCHARGED
          - entities.Unit.fields.occupied_bed_count
        distinguishing_aspect: |
          Conserved quantity #1 — global occupied-bed count: invariant
          count(Bed where status==OCCUPIED) == count(Encounter where status IN {PLACED, DISCHARGE_ORDERED}
          with current_bed_id != null). Place (forward) bumps both sides by 1; discharge (compensating)
          drops both by 1; net delta on the invariant is zero. Pinned as a formula over Bed.status and
          Encounter.status.
        test_recipe:
          setup:
            - "Empty unit U1 with one CLEAN bed B1; ED encounter E1 placed then fully discharged."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-05T08:00:00Z" }
              as: FlowAdmin
            - call: "POST /units"
              payload: { name: "MS11", unit_type: "MEDSURG", gmlos_days: 3 }
              as: FlowAdmin
              captures: { u1: $.data.id }
            - call: "POST /units/${u1}/beds"
              payload: { unit_id: "${u1}", label: "K1" }
              as: ChargeNurse
              captures: { b1: $.data.id }
            - call: "POST /units/${u1}/beds/${b1}/mark-clean"
              payload: {}
              as: ChargeNurse
              captures: { b1_v: $.data.version }
            - call: "POST /encounters"
              payload: { mrn: "M555", sex: "MALE", origin: "ED" }
              as: BedControlCoordinator
              captures: { e1: $.data.id }
            - call: "POST /encounters/${e1}/admit-order"
              payload: {}
              as: BedControlCoordinator
            - call: "POST /bed-requests"
              payload: { encounter_id: "${e1}", preferred_unit_id: "${u1}" }
              as: TransferCenterAgent
              captures: { r1: $.data.id }
            - call: "POST /bed-requests/${r1}/assign"
              payload: { bed_id: "${b1}" }
              as: BedControlCoordinator
            - call: "POST /bed-requests/${r1}/confirm"
              payload: { expected_bed_version: "${b1_v}" }
              as: BedControlCoordinator
            - call: "POST /encounters/${e1}/discharge-order"
              payload: {}
              as: CaseManager
          trigger:
            - call: "POST /encounters/${e1}/discharge"
              payload: {}
              as: CaseManager
            - call: "GET /units/${u1}"
              payload: {}
              as: BedControlCoordinator
          assert:
            - "Unit.${u1}.occupied_bed_count == 0"
            - "Bed.${b1}.status == DIRTY"
            - "Encounter.${e1}.current_bed_id == null"
            - "Encounter.${e1}.status == DISCHARGED"

      - name: unit_staffed_bed_conservation_block_then_unblock
        grounds:
          - state_machines.Bed.CLEAN_to_BLOCKED
          - state_machines.Bed.BLOCKED_to_DIRTY
          - entities.Unit.fields.staffed_bed_count
          - calculations.unit_posture
        distinguishing_aspect: |
          Conserved quantity #2 — per-unit staffed-bed count (DIFFERENT conserved quantity than global
          occupancy): invariant Unit.staffed_bed_count == count(Bed in unit where status IN
          {CLEAN, DIRTY, OCCUPIED}). Block (forward) drops staffed_bed_count by 1; unblock (compensating)
          restores it; the named quantity returns to its pre-block value with zero drift.
        test_recipe:
          setup:
            - "Unit U1 with two CLEAN beds (staffed_bed_count == 2); block one bed then unblock it."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-04T08:00:00Z" }
              as: FlowAdmin
            - call: "POST /units"
              payload: { name: "MS12", unit_type: "MEDSURG", gmlos_days: 3 }
              as: FlowAdmin
              captures: { u1: $.data.id }
            - call: "POST /units/${u1}/beds"
              payload: { unit_id: "${u1}", label: "G1" }
              as: ChargeNurse
              captures: { ba: $.data.id }
            - call: "POST /units/${u1}/beds/${ba}/mark-clean"
              payload: {}
              as: ChargeNurse
            - call: "POST /units/${u1}/beds"
              payload: { unit_id: "${u1}", label: "G2" }
              as: ChargeNurse
              captures: { bb: $.data.id }
            - call: "POST /units/${u1}/beds/${bb}/mark-clean"
              payload: {}
              as: ChargeNurse
            - call: "POST /units/${u1}/beds/${ba}/block"
              payload: { blocked_reason: "STAFFING" }
              as: ChargeNurse
          trigger:
            - call: "POST /units/${u1}/beds/${ba}/unblock"
              payload: {}
              as: ChargeNurse
            - call: "GET /units/${u1}"
              payload: {}
              as: BedControlCoordinator
          assert:
            - "Unit.${u1}.staffed_bed_count == 2"
            - "Bed.${ba}.status == DIRTY"
