scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — dual_variant_calc (2 instances, different entity domains)
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: service_cost_provisional_vs_final_diverges_on_referral_and_outcome
        grounds:
          - calculations.service_cost_estimate
          - entities.Referral.fields.provisional_cost_cents
          - entities.OutcomeReport.fields.service_cost_final_cents
        distinguishing_aspect: |
          service_cost_estimate has PROVISIONAL_AT_REFERRAL variant on the Referral
          entity domain (writes Referral.provisional_cost_cents = program.unit_cost_cents)
          and FINAL_AT_OUTCOME variant on the OutcomeReport entity domain (writes
          OutcomeReport.service_cost_final_cents from outcome + service_hours), producing
          different integer-cent totals for the identical program.
        test_recipe:
          setup:
            - "logical clock at 2026-06-01T00:00:00Z"
            - "Funder F1 (grant_cents_total=100000000, fiscal_year_start_month=7, currency=USD)"
            - "Provider P1 (languages=[EN,ES], accessibility_features=[WHEELCHAIR])"
            - "Program PROG1 (unit_cost_cents=10000, capacity_slots_total=5, category=FOOD, age 18-65, income_max=500000, provider=P1, funder=F1)"
            - "Client C1 (age 30, income 400000, home_lat=40.10, home_lng=-74.05, preferred_language=EN, accessibility_needs=[])"
            - "Intake I1 for C1 (presenting_needs=[FOOD], urgency=ROUTINE), SCREENED"
            - "ConsentGrant CG1 (client C1, provider P1, scope=BASIC_CONTACT, GRANTED)"
            - "Referral R1 (intake I1, program PROG1, consent CG1, transport_mode=CAR): status=PROPOSED, provisional_cost_cents=10000"
            - "R1 accepted (ACCEPTED) then start-service (SERVICE_IN_PROGRESS)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /funders"
              payload: { name: "United Way", fiscal_year_start_month: 7, grant_cents_total: 100000000, reporting_currency: "USD" }
              as: PlatformAdmin
              captures: { f1_id: $.data.id }
            - call: "POST /providers"
              payload: { legal_name: "Downtown CC", location_lat: 40.00, location_lng: -74.00, accessibility_features: ["WHEELCHAIR"], languages_supported: ["EN", "ES"] }
              as: PlatformAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /programs"
              payload: { provider_id: "${p1_id}", funder_id: "${f1_id}", category: "FOOD", eligibility_income_max_cents: 500000, eligibility_age_min: 18, eligibility_age_max: 65, unit_cost_cents: 10000, capacity_slots_total: 5 }
              as: PlatformAdmin
              captures: { prog1_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Alice Test", date_of_birth: "1996-01-15", monthly_income_cents: 400000, home_lat: 40.10, home_lng: -74.05, preferred_language: "EN", accessibility_needs: [] }
              as: Caseworker
              captures: { c1_id: $.data.id }
            - call: "POST /clients/${c1_id}/intakes"
              payload: { presenting_needs: ["FOOD"], urgency: "ROUTINE", household_size: 1, disability_flag: false }
              as: Caseworker
              captures: { i1_id: $.data.id }
            - call: "POST /intakes/${i1_id}/screen"
              payload: {}
              as: Caseworker
            - call: "POST /clients/${c1_id}/consent-grants"
              payload: { provider_id: "${p1_id}", scope: "BASIC_CONTACT" }
              as: Client
              as_user_id: "${c1_id}"
              captures: { cg1_id: $.data.id }
            - call: "POST /intakes/${i1_id}/referrals"
              payload: { program_id: "${prog1_id}", consent_grant_id: "${cg1_id}", transport_mode: "CAR" }
              as: Caseworker
              captures: { r1_id: $.data.id, r1_provisional: $.data.provisional_cost_cents }
            - call: "POST /referrals/${r1_id}/accept"
              payload: {}
              as: ProviderStaff
              as_user_id: "${p1_id}"
            - call: "POST /referrals/${r1_id}/start-service"
              payload: {}
              as: ProviderStaff
              as_user_id: "${p1_id}"
          trigger:
            - call: "POST /referrals/${r1_id}/outcome-reports"
              payload: { outcome: "PARTIALLY_MET", service_hours: 2.5, follow_up_needed: false }
              as: ProviderStaff
              as_user_id: "${p1_id}"
              captures: { or1_id: $.data.id, or1_final: $.data.service_cost_final_cents }
          assert:
            - "Referral.${r1_id}.provisional_cost_cents == 10000"
            - "OutcomeReport.${or1_id}.service_cost_final_cents == 7500"
            - "OutcomeReport.${or1_id}.service_cost_final_cents != Referral.${r1_id}.provisional_cost_cents (dual-variant divergence confirmed: 7500 != 10000)"

      - name: funder_report_allocation_per_referral_round_vs_sum_then_round_differ
        grounds:
          - calculations.funder_report_allocation
          - entities.FunderReport.fields.total_disbursement_cents
          - entities.FunderReport.fields.rounding_variant
        distinguishing_aspect: |
          funder_report_allocation on the FunderReport entity domain has PER_REFERRAL_ROUND_THEN_SUM
          and SUM_THEN_ROUND variants that yield different integer-cent totals for identical
          inputs (three UNMET outcomes on a program with unit_cost=1001 cents give 1503 vs 1502).
        test_recipe:
          setup:
            - "logical clock at 2026-06-01T00:00:00Z"
            - "Funder F2 (grant=100000000, fy_start=7, USD)"
            - "Provider P2, Program PROG2 (unit_cost_cents=1001, capacity=5, FOOD, age 18-65, income_max=500000)"
            - "Client C2 (age 30, income 400000), Intake I2 SCREENED, Consent CG2 GRANTED"
            - "Three referrals R2a, R2b, R2c from I2 to PROG2 under CG2, each ACCEPTED then SERVICE_IN_PROGRESS"
            - "Three ACTIVE OutcomeReports OR2a, OR2b, OR2c, each outcome=UNMET, service_hours=0.0 → each service_cost_final_cents = round_half_up(1001*0.50, 0) = round_half_up(500.5,0) = 501"
            - "Funder F2 grant_cents_remaining = 100000000 - 3*501 = 99998497"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /funders"
              payload: { name: "United Way 2", fiscal_year_start_month: 7, grant_cents_total: 100000000, reporting_currency: "USD" }
              as: PlatformAdmin
              captures: { f2_id: $.data.id }
            - call: "POST /providers"
              payload: { legal_name: "Second Provider", location_lat: 40.00, location_lng: -74.00, accessibility_features: ["WHEELCHAIR"], languages_supported: ["EN"] }
              as: PlatformAdmin
              captures: { p2_id: $.data.id }
            - call: "POST /programs"
              payload: { provider_id: "${p2_id}", funder_id: "${f2_id}", category: "FOOD", eligibility_income_max_cents: 500000, eligibility_age_min: 18, eligibility_age_max: 65, unit_cost_cents: 1001, capacity_slots_total: 5 }
              as: PlatformAdmin
              captures: { prog2_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Bob Client", date_of_birth: "1996-01-15", monthly_income_cents: 400000, home_lat: 40.00, home_lng: -74.00, preferred_language: "EN", accessibility_needs: [] }
              as: Caseworker
              captures: { c2_id: $.data.id }
            - call: "POST /clients/${c2_id}/intakes"
              payload: { presenting_needs: ["FOOD"], urgency: "ROUTINE", household_size: 1, disability_flag: false }
              as: Caseworker
              captures: { i2_id: $.data.id }
            - call: "POST /intakes/${i2_id}/screen"
              payload: {}
              as: Caseworker
            - call: "POST /clients/${c2_id}/consent-grants"
              payload: { provider_id: "${p2_id}", scope: "BASIC_CONTACT" }
              as: Client
              as_user_id: "${c2_id}"
              captures: { cg2_id: $.data.id }
            - call: "POST /intakes/${i2_id}/referrals"
              payload: { program_id: "${prog2_id}", consent_grant_id: "${cg2_id}", transport_mode: "CAR" }
              as: Caseworker
              captures: { r2a_id: $.data.id }
            - call: "POST /referrals/${r2a_id}/accept"
              payload: {}
              as: ProviderStaff
              as_user_id: "${p2_id}"
            - call: "POST /referrals/${r2a_id}/start-service"
              payload: {}
              as: ProviderStaff
              as_user_id: "${p2_id}"
            - call: "POST /referrals/${r2a_id}/outcome-reports"
              payload: { outcome: "UNMET", service_hours: 0.0, follow_up_needed: false }
              as: ProviderStaff
              as_user_id: "${p2_id}"
            - call: "POST /intakes/${i2_id}/referrals"
              payload: { program_id: "${prog2_id}", consent_grant_id: "${cg2_id}", transport_mode: "CAR" }
              as: Caseworker
              captures: { r2b_id: $.data.id }
            - call: "POST /referrals/${r2b_id}/accept"
              payload: {}
              as: ProviderStaff
              as_user_id: "${p2_id}"
            - call: "POST /referrals/${r2b_id}/start-service"
              payload: {}
              as: ProviderStaff
              as_user_id: "${p2_id}"
            - call: "POST /referrals/${r2b_id}/outcome-reports"
              payload: { outcome: "UNMET", service_hours: 0.0, follow_up_needed: false }
              as: ProviderStaff
              as_user_id: "${p2_id}"
            - call: "POST /intakes/${i2_id}/referrals"
              payload: { program_id: "${prog2_id}", consent_grant_id: "${cg2_id}", transport_mode: "CAR" }
              as: Caseworker
              captures: { r2c_id: $.data.id }
            - call: "POST /referrals/${r2c_id}/accept"
              payload: {}
              as: ProviderStaff
              as_user_id: "${p2_id}"
            - call: "POST /referrals/${r2c_id}/start-service"
              payload: {}
              as: ProviderStaff
              as_user_id: "${p2_id}"
            - call: "POST /referrals/${r2c_id}/outcome-reports"
              payload: { outcome: "UNMET", service_hours: 0.0, follow_up_needed: false }
              as: ProviderStaff
              as_user_id: "${p2_id}"
          trigger:
            - call: "POST /funders/${f2_id}/reports"
              payload: { reporting_period_start: "2026-05-01T00:00:00Z", reporting_period_end: "2026-07-01T00:00:00Z", rounding_variant: "PER_REFERRAL_ROUND_THEN_SUM" }
              as: PlatformAdmin
              captures: { rpt_a_total: $.data.total_disbursement_cents }
            - call: "POST /funders/${f2_id}/reports"
              payload: { reporting_period_start: "2026-05-01T00:00:00Z", reporting_period_end: "2026-07-01T00:00:00Z", rounding_variant: "SUM_THEN_ROUND" }
              as: PlatformAdmin
              captures: { rpt_b_total: $.data.total_disbursement_cents }
          assert:
            - "First FunderReport (rounding_variant=PER_REFERRAL_ROUND_THEN_SUM).total_disbursement_cents == 1503"
            - "Second FunderReport (rounding_variant=SUM_THEN_ROUND).total_disbursement_cents == 1502"
            - "The two totals differ by exactly 1 cent (1503 - 1502) even though the input set is identical — nested-rounding order is observable"

  # =========================================================================
  # Rule 2 — combinatorial_formula (2 instances, different modes a/b)
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: eligibility_score_six_input_nested_branch_formula_mode_a
        grounds:
          - calculations.eligibility_score
          - validations[priority=22]
          - entities.Referral.fields.eligibility_score
        distinguishing_aspect: |
          Mode (a): eligibility_score formula takes 6 inputs (income_ratio tier, age range,
          category membership, language match, accessibility subset, urgency enum) with nested
          conditional branches AND a final urgency multiplier — combinatorial mode (a) with
          >= 3 inputs and non-linear interaction.
        test_recipe:
          setup:
            - "logical clock at 2026-06-01T00:00:00Z"
            - "Funder F3, Provider P3 (accessibility=[WHEELCHAIR], languages=[EN,ES])"
            - "Program PROG3 (category=FOOD, unit_cost=10000, capacity=5, age 18-65, income_max=500000)"
            - "Client C3 (age 30 at clock: dob 1996-01-15, monthly_income_cents=450000 → income_ratio=0.90 → income_score=50, preferred_language=EN, accessibility_needs=[LARGE_PRINT] which is NOT subset of provider [WHEELCHAIR] → accessibility_match=0)"
            - "Intake I3 (presenting_needs=[FOOD], urgency=ROUTINE), SCREENED"
            - "Consent CG3 GRANTED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /funders"
              payload: { name: "United Way 3", fiscal_year_start_month: 7, grant_cents_total: 100000000, reporting_currency: "USD" }
              as: PlatformAdmin
              captures: { f3_id: $.data.id }
            - call: "POST /providers"
              payload: { legal_name: "P3", location_lat: 40.00, location_lng: -74.00, accessibility_features: ["WHEELCHAIR"], languages_supported: ["EN", "ES"] }
              as: PlatformAdmin
              captures: { p3_id: $.data.id }
            - call: "POST /programs"
              payload: { provider_id: "${p3_id}", funder_id: "${f3_id}", category: "FOOD", eligibility_income_max_cents: 500000, eligibility_age_min: 18, eligibility_age_max: 65, unit_cost_cents: 10000, capacity_slots_total: 5 }
              as: PlatformAdmin
              captures: { prog3_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Carol", date_of_birth: "1996-01-15", monthly_income_cents: 450000, home_lat: 40.00, home_lng: -74.00, preferred_language: "EN", accessibility_needs: ["LARGE_PRINT"] }
              as: Caseworker
              captures: { c3_id: $.data.id }
            - call: "POST /clients/${c3_id}/intakes"
              payload: { presenting_needs: ["FOOD"], urgency: "ROUTINE", household_size: 1, disability_flag: false }
              as: Caseworker
              captures: { i3_id: $.data.id }
            - call: "POST /intakes/${i3_id}/screen"
              payload: {}
              as: Caseworker
            - call: "POST /clients/${c3_id}/consent-grants"
              payload: { provider_id: "${p3_id}", scope: "BASIC_CONTACT" }
              as: Client
              as_user_id: "${c3_id}"
              captures: { cg3_id: $.data.id }
          trigger:
            - call: "POST /intakes/${i3_id}/referrals"
              payload: { program_id: "${prog3_id}", consent_grant_id: "${cg3_id}", transport_mode: "CAR" }
              as: Caseworker
              captures: { r3_id: $.data.id, r3_score: $.data.eligibility_score }
          assert:
            - "Referral.${r3_id}.eligibility_score == 75.00 (computation: (50*0.30 + 100*0.20 + 100*0.25 + 100*0.15 + 0*0.10) * 1.00 = 75.00)"
            - "Referral.${r3_id}.status == PROPOSED (score exactly meets threshold 75.0, so referral is created)"

      - name: funder_report_nested_rounding_order_mode_b
        grounds:
          - calculations.funder_report_allocation
          - entities.FunderReport.fields.rounding_variant
          - entities.FunderReport.fields.total_disbursement_cents
        distinguishing_aspect: |
          Mode (b): funder_report_allocation exposes nested-rounding-order-matters — "round
          per outcome then sum" produces 1503 while "sum then round" produces 1502 for the
          same input set. Scaffold pins BOTH orders via FunderReport.rounding_variant enum
          rather than defaulting.
        test_recipe:
          setup:
            - "Same as rule 1 instance 2 setup: 3 UNMET OutcomeReports on PROG4 with unit_cost=1001"
            - "clock 2026-06-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /funders"
              payload: { name: "F4", fiscal_year_start_month: 7, grant_cents_total: 100000000, reporting_currency: "USD" }
              as: PlatformAdmin
              captures: { f4_id: $.data.id }
            - call: "POST /providers"
              payload: { legal_name: "P4", location_lat: 40.00, location_lng: -74.00, accessibility_features: ["WHEELCHAIR"], languages_supported: ["EN"] }
              as: PlatformAdmin
              captures: { p4_id: $.data.id }
            - call: "POST /programs"
              payload: { provider_id: "${p4_id}", funder_id: "${f4_id}", category: "FOOD", eligibility_income_max_cents: 500000, eligibility_age_min: 18, eligibility_age_max: 65, unit_cost_cents: 1001, capacity_slots_total: 5 }
              as: PlatformAdmin
              captures: { prog4_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "D", date_of_birth: "1996-01-15", monthly_income_cents: 400000, home_lat: 40.00, home_lng: -74.00, preferred_language: "EN", accessibility_needs: [] }
              as: Caseworker
              captures: { c4_id: $.data.id }
            - call: "POST /clients/${c4_id}/intakes"
              payload: { presenting_needs: ["FOOD"], urgency: "ROUTINE", household_size: 1, disability_flag: false }
              as: Caseworker
              captures: { i4_id: $.data.id }
            - call: "POST /intakes/${i4_id}/screen"
              payload: {}
              as: Caseworker
            - call: "POST /clients/${c4_id}/consent-grants"
              payload: { provider_id: "${p4_id}", scope: "BASIC_CONTACT" }
              as: Client
              as_user_id: "${c4_id}"
              captures: { cg4_id: $.data.id }
            - call: "POST /intakes/${i4_id}/referrals"
              payload: { program_id: "${prog4_id}", consent_grant_id: "${cg4_id}", transport_mode: "CAR" }
              as: Caseworker
              captures: { r4a_id: $.data.id }
            - call: "POST /referrals/${r4a_id}/accept"
              payload: {}
              as: ProviderStaff
              as_user_id: "${p4_id}"
            - call: "POST /referrals/${r4a_id}/start-service"
              payload: {}
              as: ProviderStaff
              as_user_id: "${p4_id}"
            - call: "POST /referrals/${r4a_id}/outcome-reports"
              payload: { outcome: "UNMET", service_hours: 0.0, follow_up_needed: false }
              as: ProviderStaff
              as_user_id: "${p4_id}"
            - call: "POST /intakes/${i4_id}/referrals"
              payload: { program_id: "${prog4_id}", consent_grant_id: "${cg4_id}", transport_mode: "CAR" }
              as: Caseworker
              captures: { r4b_id: $.data.id }
            - call: "POST /referrals/${r4b_id}/accept"
              payload: {}
              as: ProviderStaff
              as_user_id: "${p4_id}"
            - call: "POST /referrals/${r4b_id}/start-service"
              payload: {}
              as: ProviderStaff
              as_user_id: "${p4_id}"
            - call: "POST /referrals/${r4b_id}/outcome-reports"
              payload: { outcome: "UNMET", service_hours: 0.0, follow_up_needed: false }
              as: ProviderStaff
              as_user_id: "${p4_id}"
            - call: "POST /intakes/${i4_id}/referrals"
              payload: { program_id: "${prog4_id}", consent_grant_id: "${cg4_id}", transport_mode: "CAR" }
              as: Caseworker
              captures: { r4c_id: $.data.id }
            - call: "POST /referrals/${r4c_id}/accept"
              payload: {}
              as: ProviderStaff
              as_user_id: "${p4_id}"
            - call: "POST /referrals/${r4c_id}/start-service"
              payload: {}
              as: ProviderStaff
              as_user_id: "${p4_id}"
            - call: "POST /referrals/${r4c_id}/outcome-reports"
              payload: { outcome: "UNMET", service_hours: 0.0, follow_up_needed: false }
              as: ProviderStaff
              as_user_id: "${p4_id}"
          trigger:
            - call: "POST /funders/${f4_id}/reports"
              payload: { reporting_period_start: "2026-05-01T00:00:00Z", reporting_period_end: "2026-07-01T00:00:00Z", rounding_variant: "PER_REFERRAL_ROUND_THEN_SUM" }
              as: PlatformAdmin
              captures: { rpt_ptr_total: $.data.total_disbursement_cents }
          assert:
            - "FunderReport.total_disbursement_cents == 1503 (per-outcome rounded 501+501+501)"
            - "Under SUM_THEN_ROUND the same inputs would yield 1502; the scaffold's rounding_variant enum on FunderReport pins the order rather than leaving it implicit"

  # =========================================================================
  # Rule 3 — non_linear_state_machine (2 instances, different entities)
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: intake_draft_screened_draft_revision_cycle
        grounds:
          - state_machines.Intake.DRAFT_to_SCREENED
          - state_machines.Intake.SCREENED_to_DRAFT
        distinguishing_aspect: |
          Intake state machine on the Intake entity is CYCLIC: DRAFT → SCREENED → DRAFT is
          reachable and legal via POST /intakes/{id}/reopen, so the entity's state graph
          contains a non-linear back-edge (not a strictly forward pipeline).
        test_recipe:
          setup:
            - "clock 2026-06-01T00:00:00Z"
            - "Client C5, Intake I5 in DRAFT (no referrals yet — reopen precondition met)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clients"
              payload: { full_name: "E", date_of_birth: "1996-01-15", monthly_income_cents: 400000, home_lat: 40.00, home_lng: -74.00, preferred_language: "EN", accessibility_needs: [] }
              as: Caseworker
              captures: { c5_id: $.data.id }
            - call: "POST /clients/${c5_id}/intakes"
              payload: { presenting_needs: ["FOOD"], urgency: "ROUTINE", household_size: 1, disability_flag: false }
              as: Caseworker
              captures: { i5_id: $.data.id }
            - call: "POST /intakes/${i5_id}/screen"
              payload: {}
              as: Caseworker
              captures: { i5_v_after_screen: $.data.version }
          trigger:
            - call: "POST /intakes/${i5_id}/reopen"
              payload: {}
              as: Caseworker
              captures: { i5_status_after: $.data.status, i5_v_after_reopen: $.data.version }
          assert:
            - "After screen: Intake.${i5_id}.status == SCREENED, Intake.${i5_id}.version == 2"
            - "After reopen: Intake.${i5_id}.status == DRAFT (cycled back), Intake.${i5_id}.version == 3"
            - "A subsequent POST /intakes/${i5_id}/screen would succeed again — the entity's graph is genuinely cyclic, not merely a fork"

      - name: program_parallel_intake_and_funder_reporting_dimensions_evolve_independently
        grounds:
          - state_machines.Program
          - entities.Program.fields.intake_posture
          - entities.Program.fields.funder_reporting_posture
        distinguishing_aspect: |
          The Program entity carries TWO parallel state dimensions — intake_posture
          (OPEN/RESTRICTED/CLOSED, driven by capacity_slots_taken via calc program_utilization)
          and funder_reporting_posture (OPEN/LOCKED/ARCHIVED, driven by funder-report
          generation and fiscal-year rollover). The two dimensions evolve INDEPENDENTLY on
          the same entity: creating referrals changes intake_posture but leaves
          funder_reporting_posture unchanged, while generating a funder-report changes
          funder_reporting_posture but leaves intake_posture unchanged.
        test_recipe:
          setup:
            - "clock 2026-06-01T00:00:00Z"
            - "Funder F6, Provider P6, Program PROG6 (capacity=5, unit_cost=10000): both postures OPEN at creation"
            - "Client C6, Intake I6 SCREENED, Consent CG6 GRANTED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /funders"
