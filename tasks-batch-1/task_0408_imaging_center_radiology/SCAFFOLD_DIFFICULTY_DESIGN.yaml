  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_benefit_check
        grounds:
          - validations[priority=7]
          - validations[priority=19]
          - state_machines.ImagingOrder.REQUESTED_to_BENEFIT_CHECKED
        distinguishing_aspect: |
          Pair (state vs business_fiscal): benefit-check on a CANCELLED order whose modality
          requires prior-auth with NO AUTHORIZED PriorAuthorization — both the state precondition
          (priority 7, ERR_INVALID_STATE: order not REQUESTED) and the fiscal gate (priority 19,
          ERR_PRIOR_AUTH_REQUIRED) would fire; the lower-priority state check wins, returning
          ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "An MRI order (modality requires_prior_auth true) with no PriorAuthorization, cancelled from REQUESTED (now CANCELLED)."
          setup_api_calls:
            - call: "POST /imaging-centers"
              payload: { name: "C" }
              as: CenterAdmin
              captures: { c_id: $.data.id }
            - call: "POST /imaging-centers/${c_id}/modalities"
              payload: { modality_type: "MRI", name: "MRI", base_rvu: 2.0, requires_prior_auth: true }
              as: CenterAdmin
              captures: { mri_id: $.data.id }
            - call: "POST /imaging-centers/${c_id}/imaging-orders"
              payload: { modality_id: "${mri_id}", patient_mrn: "M1", ordering_provider_npi: "N1", requires_contrast: false }
              as: SchedulingClerk
              captures: { ord_id: $.data.id }
            - call: "POST /imaging-orders/${ord_id}/cancel"
              payload: {}
              as: SchedulingClerk
          trigger:
            - call: "POST /imaging-orders/${ord_id}/benefit-check"
              payload: {}
              as: SchedulingClerk
              captures: { err: $.data.error_id }
          assert:
            - "benefit-check on a CANCELLED order (no AUTHORIZED prior-auth) -> HTTP 409 with error_id ERR_INVALID_STATE (state priority 7 beats fiscal priority 19)"

      - name: safety_screening_beats_temporal_interval
        grounds:
          - validations[priority=9]
          - validations[priority=16]
          - state_machines.ImagingOrder.BENEFIT_CHECKED_to_SCREEN_CLEARED
        distinguishing_aspect: |
          Pair (business_safety vs business_temporal): clear-screening on an order whose required
          screening is not CLEARED, where the next scheduling step would also fail an interval check —
          but clear-screening rejects with ERR_SCREENING_NOT_CLEARED (priority 9) before any temporal
          check (priority 16) is ever reached, because the order cannot leave BENEFIT_CHECKED.
        test_recipe:
          setup:
            - "An MRI order at BENEFIT_CHECKED with a ContrastScreening still PENDING (not evaluated)."
          setup_api_calls:
            - call: "POST /imaging-centers"
              payload: { name: "C" }
              as: CenterAdmin
              captures: { c_id: $.data.id }
            - call: "POST /imaging-centers/${c_id}/modalities"
              payload: { modality_type: "MRI", name: "MRI", base_rvu: 2.0, requires_prior_auth: false }
              as: CenterAdmin
              captures: { mri_id: $.data.id }
            - call: "POST /imaging-centers/${c_id}/staff"
              payload: { staff_role: "NURSE", full_name: "N", credentialed_modalities: ["MRI"] }
              as: CenterAdmin
              captures: { nurse_id: $.data.id }
            - call: "POST /imaging-centers/${c_id}/imaging-orders"
              payload: { modality_id: "${mri_id}", patient_mrn: "M1", ordering_provider_npi: "N1", requires_contrast: true }
              as: SchedulingClerk
              captures: { ord_id: $.data.id }
            - call: "POST /imaging-orders/${ord_id}/benefit-check"
              payload: {}
              as: SchedulingClerk
            - call: "POST /imaging-orders/${ord_id}/contrast-screenings"
              payload: { egfr_value: 90, has_contrast_allergy: false, is_pregnant: false, metal_implant_unsafe: false }
              as: Nurse
              as_user_id: "${nurse_id}"
              captures: { scr_id: $.data.id }
          trigger:
            - call: "POST /imaging-orders/${ord_id}/clear-screening"
              payload: {}
              as: Nurse
              as_user_id: "${nurse_id}"
              captures: { err: $.data.error_id }
          assert:
            - "clear-screening -> HTTP 409 with error_id ERR_SCREENING_NOT_CLEARED (safety priority 9 reached before temporal priority 16)"

