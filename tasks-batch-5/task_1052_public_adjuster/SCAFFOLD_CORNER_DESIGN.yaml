            - { call: "POST /v1/clients", payload: { full_name: "Cy Client", email: "cy@x.com", mailing_state: "TX" }, as: FirmPrincipal, captures: { cli: $.data.id } }
            - { call: "POST /v1/policies", payload: { client_id: "${cli}", carrier_name: "Acme", policy_number: "P1", policy_type: "HO3", coverage_limit_cents: 100000000, deductible_cents: 100000, effective_date: "2026-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z" }, as: FirmPrincipal, captures: { pol: $.data.id } }
            - { call: "POST /v1/contracts", payload: { client_id: "${cli}", adjuster_id: "${adj}", loss_state_code: "TX", fee_pct: 0.10, statutory_cap_pct: 0.10 }, as: FirmPrincipal, captures: { con: $.data.id } }
