  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: examiner_not_found_beats_enrollment_not_test_ready
        grounds:
          - validations[priority=3]
          - validations[priority=14]
          - errors[ERR_NOT_FOUND]
          - errors[ERR_ENROLLMENT_NOT_TEST_READY]
        distinguishing_aspect: |
          Error-category pair {existence, business_constraint}: scheduling a skills test against an examiner_id
          that does not exist (priority 3 existence, ERR_NOT_FOUND) while the enrollment is also not TEST_READY
          (priority 14 business_constraint, ERR_ENROLLMENT_NOT_TEST_READY) returns ERR_NOT_FOUND, because the
          lower-numbered existence check is evaluated first.
        test_recipe:
          setup:
            - "Enrollment E still in PREREQ_PENDING (not TEST_READY); no examiner with the supplied id exists."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", cdl_class: "CLASS_B", classroom_required_hours: 1, range_required_hours: 1, road_required_hours: 1, tuition_cents: 700000, skills_pass_threshold: 80 }
              as: SchoolAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /enrollments"
              payload: { program_id: "${prog_id}", student_name: "Sam" }
              as: Registrar
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/prereq-documents"
              payload: { kind: "DOT_MEDICAL", reference_code: "MED-1", expires_on: "2027-01-01T00:00:00Z" }
              as: Registrar
              captures: { med_id: $.data.id }
          trigger:
            - call: "POST /enrollments/${enr_id}/skills-tests"
              payload: { examiner_id: "00000000-0000-4000-8000-000000000000" }
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"
            - "http status == 404"

      - name: prereq_not_met_beats_truck_class_mismatch
        grounds:
          - validations[priority=8]
          - validations[priority=11]
          - errors[ERR_PREREQ_NOT_MET]
          - errors[ERR_TRUCK_CLASS_MISMATCH]
        distinguishing_aspect: |
          A different error-category pair than instance 1: priority 8 business_safety (ERR_PREREQ_NOT_MET,
          enrollment not TRAINING) outranks priority 11 business_referential (ERR_TRUCK_CLASS_MISMATCH); booking
          a CLASS_A truck onto a CLASS_B program while the enrollment is still PREREQ_PENDING returns
          ERR_PREREQ_NOT_MET, not the class mismatch.
        test_recipe:
          setup:
            - "Enrollment E still in PREREQ_PENDING (only DOT-medical approved; permit not approved)."
            - "A CLASS_A truck exists (mismatched against the CLASS_B program)."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", cdl_class: "CLASS_B", classroom_required_hours: 1, range_required_hours: 1, road_required_hours: 1, tuition_cents: 700000 }
              as: SchoolAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /trucks"
              payload: { unit_number: "TA", cdl_class: "CLASS_A" }
              as: SchoolAdmin
              captures: { truck_a_id: $.data.id }
            - call: "POST /instructors"
              payload: { full_name: "Ivy", cdl_class: "CLASS_A" }
              as: SchoolAdmin
              captures: { instr_id: $.data.id }
            - call: "POST /enrollments"
              payload: { program_id: "${prog_id}", student_name: "Sam" }
              as: Registrar
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/prereq-documents"
              payload: { kind: "DOT_MEDICAL", reference_code: "MED-1", expires_on: "2027-01-01T00:00:00Z" }
              as: Registrar
              captures: { med_id: $.data.id }
            - call: "POST /prereq-documents/${med_id}/approve"
              payload: {}
              as: Registrar
          trigger:
            - call: "POST /enrollments/${enr_id}/clock-sessions"
              payload: { phase: "ROAD", instructor_id: "${instr_id}", truck_id: "${truck_a_id}", starts_at: "2026-03-20T09:00:00Z", duration_minutes: 60 }
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_PREREQ_NOT_MET"
            - "http status == 409"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: road_hours_exactly_meets_requirement_ge_boundary
        grounds:
          - state_machines.ClockSession.BOOKED_to_COMPLETED
          - state_machines.Enrollment.TRAINING_to_TEST_READY
          - entities.Enrollment.fields.logged_road_hours
        distinguishing_aspect: |
          Numeric >= boundary on the ROAD requirement: with road_required_hours 0.5, a single COMPLETED 30-min
          road session makes logged_road_hours exactly 0.5, which satisfies >= and flips Enrollment to
          TEST_READY; 29 minutes (0.4833h) would not.
        test_recipe:
          setup:
            - "Program P (CLASS_B, classroom 0, range 0, road 0.5)."
            - "Enrollment E in TRAINING; one BOOKED ROAD session of exactly 30 minutes (already elapsed)."
          setup_api_calls:
            - call: "POST /programs"
