# =============================================================================
# PRD Benchmark Seed Tables — task_0699_haunted_house_attraction
# Haunted House & Seasonal Attraction operations API
# Difficulty: Expert
# =============================================================================

scenario: |
  699. Haunted House & Seasonal Attraction: timed-entry & capacity/throughput, ticket tier (GA/fast-pass/VIP) & dynamic pricing, group/season pass, actor/staff scheduling & scare-zone, waiver & age/scare-level, combo (multiple attractions) & upsell, weather/closure, queue management

domain_name: haunted-house-attraction
api_prefix: ""

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: pricing_engine
  complexity_layers:
    - rate_threshold_triggers      # demand-tiered dynamic pricing breakpoints
    - cascading_side_effects       # closure cascades across slots/reservations/shifts
    - derived_field_reconciliation # slot occupancy counters reconciled with reservations
    - scheduled_actions            # logical clock gates entry windows and waiver expiry
    - optimistic_concurrency       # OCC on TimeSlot.version for capacity races

  entity_topology: flat
  # peer entities linked by foreign keys; no deep nested-tree ownership in URL paths

  state_machine_shape: parallel
  # Reservation carries two independent dimensions (entry_status × payment_status);
  # Closure machine is cyclic; ActorShift branches; Reservation also has cross-entity guards

  relationship_patterns:
    - one_to_many        # Attraction -> TimeSlot, Reservation -> Ticket
    - many_to_many       # Reservation <-> Attraction via Ticket (combo across attractions)
    - cross_aggregate    # Reservation references Guest, Waiver, Pass across boundaries

  role_model: peer_roles
  # Guest owns own reservations/waivers; BoxOffice sells/refunds; OpsManager runs
  # closures/pricing/scheduling; Actor checks in to shifts; each owns distinct verbs.

  consistency_model: immediate

# =============================================================================
# Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Venue
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Unique venue identifier (server-minted UUID, identity only)" }
      - { name: name, type: string, source: input, description: "Venue display name" }
      - { name: timezone, type: string, source: input, description: "IANA timezone label, informational only" }
      - { name: weather_status, type: enum, source: computed, description: "CLEAR | ADVISORY | SEVERE — set by POST /venues/{id}/weather; SEVERE forces closures" , constraints: "one of CLEAR, ADVISORY, SEVERE; default CLEAR" }
      - { name: operational_state, type: enum, source: computed, description: "OPEN | RESTRICTED | SHUTDOWN — derived posture gating sales; OPEN sells freely, RESTRICTED blocks new VIP/season upsell, SHUTDOWN blocks all sales", constraints: "one of OPEN, RESTRICTED, SHUTDOWN; default OPEN" }
      - { name: open_attraction_count, type: integer, source: computed, description: "Count of Attractions in status OPEN under this venue" }
      - { name: created_at, type: datetime, source: system, description: "Creation timestamp" }
      - { name: updated_at, type: datetime, source: system, description: "Last-mutation timestamp" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1" }

  - name: Attraction
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Unique attraction identifier" }
      - { name: venue_id, type: string, source: input, description: "FK -> Venue.id" }
      - { name: name, type: string, source: input, description: "Attraction name" }
      - { name: min_age, type: integer, source: input, description: "Minimum guest age allowed", constraints: ">= 0" }
      - { name: scare_level, type: integer, source: input, description: "Intensity 1..5; guest waiver max_scare_level must be >= this", constraints: "1..5" }
      - { name: throughput_per_slot, type: integer, source: input, description: "Maximum guests admitted per TimeSlot for this attraction", constraints: ">= 1" }
      - { name: status, type: enum, source: computed, description: "OPEN | PAUSED | CLOSED — lifecycle; CLOSED is terminal for the season", constraints: "one of OPEN, PAUSED, CLOSED; initial OPEN" }
      - { name: requires_waiver, type: boolean, source: input, description: "If true, every ticketed guest needs a SIGNED non-expired Waiver", default: true }
      - { name: created_at, type: datetime, source: system, description: "Creation timestamp" }
      - { name: updated_at, type: datetime, source: system, description: "Last-mutation timestamp" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1" }

  - name: TimeSlot
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Unique time-slot identifier" }
      - { name: attraction_id, type: string, source: input, description: "FK -> Attraction.id" }
      - { name: window_start, type: datetime, source: input, description: "Inclusive start of the timed-entry window (ISO 8601 UTC)" }
      - { name: window_end, type: datetime, source: input, description: "Exclusive end of the timed-entry window (ISO 8601 UTC)" }
      - { name: capacity, type: integer, source: input, description: "Hard guest cap for this slot; <= attraction.throughput_per_slot at creation", constraints: ">= 1" }
      - { name: reserved_count, type: integer, source: computed, description: "Guests held by RESERVED reservations referencing this slot" }
      - { name: admitted_count, type: integer, source: computed, description: "Guests admitted (ADMITTED entry_status) for this slot" }
      - { name: demand_ratio, type: number, source: computed, description: "(reserved_count + admitted_count) / capacity, used to select the active PricingRule tier" }
      - { name: status, type: enum, source: computed, description: "SCHEDULED | CLOSED — CLOSED when attraction closes or weather severe", constraints: "one of SCHEDULED, CLOSED; initial SCHEDULED" }
      - { name: created_at, type: datetime, source: system, description: "Creation timestamp" }
      - { name: updated_at, type: datetime, source: system, description: "Last-mutation timestamp" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1" }

  - name: PricingRule
    parent: null
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Unique pricing-rule identifier" }
      - { name: attraction_id, type: string, source: input, description: "FK -> Attraction.id; pricing rules scoped per attraction" }
      - { name: tier, type: enum, source: input, description: "GA | FAST_PASS | VIP — the ticket tier this rule prices", constraints: "one of GA, FAST_PASS, VIP" }
      - { name: base_price_cents, type: integer, source: input, description: "Base price before demand surge, in cents", constraints: ">= 0" }
      - { name: low_demand_max_ratio, type: number, source: input, description: "Inclusive upper demand_ratio bound for the LOW band (no surge)", default: 0.5 }
      - { name: high_demand_min_ratio, type: number, source: input, description: "Demand_ratio at or above which the HIGH band surge applies", default: 0.8 }
      - { name: mid_surge_pct, type: integer, source: input, description: "Surge percent added in the MID band (low_max < ratio < high_min)", default: 20 }
      - { name: high_surge_pct, type: integer, source: input, description: "Surge percent added in the HIGH band (ratio >= high_demand_min_ratio)", default: 50 }
      - { name: created_at, type: datetime, source: system, description: "Creation timestamp" }

  - name: Guest
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Unique guest identifier; equals X-User-ID when acting as Guest" }
      - { name: full_name, type: string, source: input, description: "Guest full name" }
      - { name: age, type: integer, source: input, description: "Guest age in years", constraints: ">= 0" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: wallet_credit_cents, type: integer, source: computed, description: "Refund credits available to apply to future reservations; starts at 0" }
      - { name: created_at, type: datetime, source: system, description: "Creation timestamp" }
      - { name: updated_at, type: datetime, source: system, description: "Last-mutation timestamp" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1" }

  - name: Waiver
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Unique waiver identifier" }
      - { name: guest_id, type: string, source: input, description: "FK -> Guest.id" }
      - { name: max_scare_level, type: integer, source: input, description: "Highest attraction scare_level this guest is cleared for", constraints: "1..5" }
      - { name: signed_at, type: datetime, source: system, description: "Logical-clock time the waiver was signed" }
      - { name: expires_at, type: datetime, source: computed, description: "signed_at + WAIVER_VALID_DAYS days; waiver invalid once clock passes this" }
      - { name: status, type: enum, source: computed, description: "SIGNED | EXPIRED | REVOKED — EXPIRED is derived from clock, REVOKED is terminal", constraints: "one of SIGNED, EXPIRED, REVOKED; initial SIGNED" }
      - { name: created_at, type: datetime, source: system, description: "Creation timestamp" }
      - { name: updated_at, type: datetime, source: system, description: "Last-mutation timestamp" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1" }

  - name: Reservation
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Unique reservation identifier" }
      - { name: venue_id, type: string, source: input, description: "FK -> Venue.id" }
      - { name: guest_id, type: string, source: input, description: "FK -> Guest.id; the owning guest" }
      - { name: pass_id, type: string, source: input, description: "FK -> Pass.id; optional season/group pass applied for discount", constraints: "nullable" }
      - { name: party_size, type: integer, source: computed, description: "Number of Tickets (guests) on this reservation", constraints: ">= 1" }
      - { name: entry_status, type: enum, source: computed, description: "HELD | RESERVED | ADMITTED | NO_SHOW | CANCELLED — entry dimension", constraints: "one of HELD, RESERVED, ADMITTED, NO_SHOW, CANCELLED; initial HELD" }
      - { name: payment_status, type: enum, source: computed, description: "UNPAID | PAID | REFUNDED — payment dimension, evolves independently of entry_status", constraints: "one of UNPAID, PAID, REFUNDED; initial UNPAID" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Sum of per-ticket dynamic prices before pass discount" }
      - { name: discount_cents, type: integer, source: computed, description: "Pass discount applied at confirmation" }
      - { name: total_cents, type: integer, source: computed, description: "subtotal_cents - discount_cents, floored at 0" }
      - { name: created_at, type: datetime, source: system, description: "Creation timestamp" }
      - { name: updated_at, type: datetime, source: system, description: "Last-mutation timestamp" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1" }

  - name: Ticket
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Unique ticket identifier" }
      - { name: reservation_id, type: string, source: input, description: "FK -> Reservation.id" }
      - { name: time_slot_id, type: string, source: input, description: "FK -> TimeSlot.id; the timed-entry slot this ticket admits into" }
      - { name: guest_age, type: integer, source: input, description: "Age of the person on this ticket (party member), validated against attraction.min_age", constraints: ">= 0" }
      - { name: max_scare_level, type: integer, source: input, description: "Scare clearance of the person on this ticket, validated against attraction.scare_level", constraints: "1..5" }
      - { name: tier, type: enum, source: input, description: "GA | FAST_PASS | VIP — pricing/queue tier", constraints: "one of GA, FAST_PASS, VIP" }
      - { name: price_cents, type: integer, source: computed, description: "Dynamic price snapshot frozen at confirmation from the active PricingRule" }
      - { name: queue_priority, type: integer, source: computed, description: "Lower admits first: VIP=0, FAST_PASS=1, GA=2" }
      - { name: created_at, type: datetime, source: system, description: "Creation timestamp" }
      - { name: updated_at, type: datetime, source: system, description: "Last-mutation timestamp" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1" }

  - name: PassProduct
    parent: null
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Unique pass-product identifier" }
      - { name: venue_id, type: string, source: input, description: "FK -> Venue.id" }
      - { name: kind, type: enum, source: input, description: "SEASON | GROUP — SEASON is per-guest multi-visit, GROUP bundles min_party guests", constraints: "one of SEASON, GROUP" }
      - { name: price_cents, type: integer, source: input, description: "Flat purchase price of the pass product, in cents", constraints: ">= 0" }
      - { name: discount_pct, type: integer, source: input, description: "Percent discount applied to reservation subtotals while the pass is ACTIVE", constraints: "0..100" }
      - { name: min_party, type: integer, source: input, description: "For GROUP kind, minimum party_size required to apply discount; 1 for SEASON", default: 1 }
      - { name: max_redemptions, type: integer, source: input, description: "Maximum number of reservations the issued Pass may discount", constraints: ">= 1" }
      - { name: created_at, type: datetime, source: system, description: "Creation timestamp" }

  - name: Pass
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Unique issued-pass identifier" }
      - { name: pass_product_id, type: string, source: input, description: "FK -> PassProduct.id" }
      - { name: guest_id, type: string, source: input, description: "FK -> Guest.id; the holder" }
      - { name: redemptions_used, type: integer, source: computed, description: "Reservations confirmed against this pass; starts at 0" }
      - { name: status, type: enum, source: computed, description: "ACTIVE | EXHAUSTED | CANCELLED — EXHAUSTED when redemptions_used == product.max_redemptions", constraints: "one of ACTIVE, EXHAUSTED, CANCELLED; initial ACTIVE" }
      - { name: created_at, type: datetime, source: system, description: "Creation timestamp" }
      - { name: updated_at, type: datetime, source: system, description: "Last-mutation timestamp" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1" }

  - name: ScareZone
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Unique scare-zone identifier" }
      - { name: attraction_id, type: string, source: input, description: "FK -> Attraction.id" }
      - { name: name, type: string, source: input, description: "Zone label (e.g., Crypt, Maze)" }
      - { name: min_actors, type: integer, source: input, description: "Minimum CHECKED_IN actor shifts required for the zone to be STAFFED", constraints: ">= 1" }
      - { name: checked_in_count, type: integer, source: computed, description: "Count of ActorShifts assigned to this zone in status CHECKED_IN" }
      - { name: staffing_status, type: enum, source: computed, description: "UNDERSTAFFED | STAFFED — STAFFED iff checked_in_count >= min_actors", constraints: "one of UNDERSTAFFED, STAFFED; initial UNDERSTAFFED" }
      - { name: created_at, type: datetime, source: system, description: "Creation timestamp" }
      - { name: updated_at, type: datetime, source: system, description: "Last-mutation timestamp" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1" }

  - name: ActorShift
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Unique actor-shift identifier" }
      - { name: scare_zone_id, type: string, source: input, description: "FK -> ScareZone.id" }
      - { name: actor_user_id, type: string, source: input, description: "Opaque operator id of the assigned actor (not an entity FK)" }
      - { name: shift_start, type: datetime, source: input, description: "Inclusive shift window start (ISO 8601 UTC)" }
      - { name: shift_end, type: datetime, source: input, description: "Exclusive shift window end (ISO 8601 UTC)" }
      - { name: status, type: enum, source: computed, description: "SCHEDULED | CHECKED_IN | CHECKED_OUT | CANCELLED — CHECKED_OUT and CANCELLED terminal", constraints: "one of SCHEDULED, CHECKED_IN, CHECKED_OUT, CANCELLED; initial SCHEDULED" }
      - { name: created_at, type: datetime, source: system, description: "Creation timestamp" }
      - { name: updated_at, type: datetime, source: system, description: "Last-mutation timestamp" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1" }

  - name: Closure
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Unique closure identifier" }
      - { name: attraction_id, type: string, source: input, description: "FK -> Attraction.id; the attraction taken offline" }
      - { name: reason, type: enum, source: input, description: "WEATHER | SAFETY | UNDERSTAFFED — driver of the closure", constraints: "one of WEATHER, SAFETY, UNDERSTAFFED" }
      - { name: opened_reservation_refunds, type: integer, source: computed, description: "Count of reservations auto-refunded by this closure" }
      - { name: status, type: enum, source: computed, description: "ACTIVE | LIFTED — ACTIVE pauses the attraction, LIFTED is terminal", constraints: "one of ACTIVE, LIFTED; initial ACTIVE" }
      - { name: created_at, type: datetime, source: system, description: "Creation timestamp" }
      - { name: updated_at, type: datetime, source: system, description: "Last-mutation timestamp" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Attraction
    field: status
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: PAUSED
        trigger: "POST /attractions/{attraction_id}/closures (Closure created)"
        actor: OpsManager
        preconditions:
          - "Attraction.status == OPEN"
        side_effects:
          - "Cascade L1: all TimeSlots of this attraction with status SCHEDULED -> CLOSED"
          - "Cascade L2 (caused by each slot CLOSED): every Reservation that has a Ticket on a now-CLOSED slot and entry_status IN {HELD, RESERVED} -> entry_status CANCELLED"
          - "Cascade L3 (caused by each Reservation cancel where payment_status == PAID): payment_status -> REFUNDED and Guest.wallet_credit_cents += that reservation.total_cents"
          - "increments Attraction.version by 1"
      - from: PAUSED
        to: OPEN
        trigger: "POST /closures/{closure_id}/lift"
        actor: OpsManager
        preconditions:
          - "Attraction.status == PAUSED"
          - "No other ACTIVE Closure references this attraction"
          - "Venue.weather_status != SEVERE"
        side_effects:
          - "Closure.status -> LIFTED"
          - "TimeSlots whose window_start is at or after the logical clock and status CLOSED -> SCHEDULED"
          - "increments Attraction.version by 1"
      - from: [OPEN, PAUSED]
        to: CLOSED
        trigger: "POST /attractions/{attraction_id}/close_for_season"
        actor: OpsManager
        preconditions:
          - "Attraction.status IN {OPEN, PAUSED}"
        side_effects:
          - "All TimeSlots of this attraction -> CLOSED"
          - "Decrement Venue.open_attraction_count if this attraction was OPEN; recompute Venue.operational_state"
          - "increments Attraction.version by 1"
    note: "Closure create only pauses; weather-severe closures use the same PAUSED path via cascade from Venue weather."

  - entity: Reservation
    field: entry_status
    initial_state: HELD
    terminal_states: [NO_SHOW, CANCELLED]
    transitions:
      - from: HELD
        to: RESERVED
        trigger: "POST /reservations/{reservation_id}/confirm"
        actor: BoxOffice
        preconditions:
          - "Reservation.entry_status == HELD"
          - "Reservation has >= 1 Ticket"
          - "Each Ticket's TimeSlot.status == SCHEDULED and (reserved_count + admitted_count + party members on that slot) <= TimeSlot.capacity"
          - "Venue.operational_state != SHUTDOWN"
          - "expected_time_slot_version matches each referenced TimeSlot.version"
        side_effects:
          - "Freeze each Ticket.price_cents from the active PricingRule (calc dynamic_ticket_price)"
          - "Compute subtotal_cents, discount_cents (calc pass_discount), total_cents"
          - "Increment each referenced TimeSlot.reserved_count by that slot's party members; increment TimeSlot.version by 1; recompute TimeSlot.demand_ratio"
          - "If pass_id present: Pass.redemptions_used += 1; if it reaches product.max_redemptions, Pass.status -> EXHAUSTED"
      - from: RESERVED
        to: ADMITTED
        trigger: "POST /reservations/{reservation_id}/admit"
        actor: BoxOffice
        preconditions:
          - "Reservation.entry_status == RESERVED"
          - "Reservation.payment_status == PAID"
          - "Logical clock is within [earliest Ticket slot.window_start, latest Ticket slot.window_end)"
          - "Every ScareZone of each ticketed attraction has staffing_status STAFFED"
          - "Each ticketed guest has a SIGNED non-expired Waiver with max_scare_level >= attraction.scare_level when attraction.requires_waiver"
        side_effects:
          - "For each Ticket: slot.reserved_count -= 1, slot.admitted_count += 1; increment TimeSlot.version by 1"
          - "increments Reservation.version by 1"
      - from: RESERVED
        to: NO_SHOW
        trigger: "POST /reservations/{reservation_id}/mark_no_show"
        actor: BoxOffice
        preconditions:
          - "Reservation.entry_status == RESERVED"
          - "Logical clock is at or after the latest Ticket slot.window_end"
        side_effects:
          - "For each Ticket: slot.reserved_count -= 1; increment TimeSlot.version by 1; recompute demand_ratio"
          - "increments Reservation.version by 1"
      - from: [HELD, RESERVED]
        to: CANCELLED
        trigger: "POST /reservations/{reservation_id}/cancel"
        actor: [Guest, BoxOffice]
        preconditions:
          - "Reservation.entry_status IN {HELD, RESERVED}"
        side_effects:
          - "If entry_status was RESERVED: for each Ticket slot.reserved_count -= 1; increment TimeSlot.version by 1; recompute demand_ratio"
          - "If payment_status == PAID: payment_status -> REFUNDED and Guest.wallet_credit_cents += total_cents (calc refund_credit)"
          - "If pass_id present and entry_status was RESERVED: Pass.redemptions_used -= 1; if Pass.status was EXHAUSTED it returns to ACTIVE"
          - "increments Reservation.version by 1"

  - entity: Reservation
    field: payment_status
    initial_state: UNPAID
    terminal_states: [REFUNDED]
    transitions:
      - from: UNPAID
        to: PAID
        trigger: "POST /reservations/{reservation_id}/pay"
        actor: [Guest, BoxOffice]
        preconditions:
          - "Reservation.entry_status == RESERVED"
          - "Reservation.payment_status == UNPAID"
        side_effects:
          - "Apply Guest.wallet_credit_cents toward total_cents first (calc wallet_apply); reduce wallet by the applied amount"
          - "increments Reservation.version by 1"
      - from: PAID
        to: REFUNDED
        trigger: "POST /reservations/{reservation_id}/cancel OR closure cascade"
        actor: [Guest, BoxOffice, system]
        preconditions:
          - "Reservation.payment_status == PAID"
        side_effects:
          - "Guest.wallet_credit_cents += total_cents (calc refund_credit)"
    note: "payment_status evolves independently of entry_status (parallel dimensions on the same Reservation row)."

  - entity: ActorShift
    field: status
    initial_state: SCHEDULED
    terminal_states: [CHECKED_OUT, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: CHECKED_IN
        trigger: "POST /actor-shifts/{shift_id}/check_in"
        actor: Actor
        preconditions:
          - "ActorShift.status == SCHEDULED"
          - "Logical clock is within [shift_start, shift_end)"
        side_effects:
          - "ScareZone.checked_in_count += 1"
          - "If checked_in_count >= ScareZone.min_actors: ScareZone.staffing_status -> STAFFED (bubble-up)"
          - "increments ActorShift.version by 1"
      - from: CHECKED_IN
        to: CHECKED_OUT
        trigger: "POST /actor-shifts/{shift_id}/check_out"
        actor: Actor
        preconditions:
          - "ActorShift.status == CHECKED_IN"
        side_effects:
          - "ScareZone.checked_in_count -= 1"
          - "If checked_in_count < ScareZone.min_actors: ScareZone.staffing_status -> UNDERSTAFFED (bubble-up)"
          - "Cascade: if staffing_status drops to UNDERSTAFFED, create an ACTIVE Closure(reason=UNDERSTAFFED) on the attraction and run the Attraction OPEN->PAUSED cascade"
          - "increments ActorShift.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /actor-shifts/{shift_id}/cancel"
        actor: OpsManager
        preconditions:
          - "ActorShift.status == SCHEDULED"
        side_effects:
          - "increments ActorShift.version by 1"

  - entity: Closure
    field: status
    initial_state: ACTIVE
    terminal_states: [LIFTED]
    transitions:
      - from: ACTIVE
        to: LIFTED
        trigger: "POST /closures/{closure_id}/lift"
        actor: OpsManager
        preconditions:
          - "Closure.status == ACTIVE"
          - "Venue.weather_status != SEVERE"
        side_effects:
          - "Run the Attraction PAUSED->OPEN transition for the referenced attraction if no other ACTIVE Closure remains"
          - "increments Closure.version by 1"
    note: "Cyclic at the attraction level: OPEN->PAUSED (closure create) then PAUSED->OPEN (closure lift) may repeat across the season."

  - entity: Waiver
    field: status
    initial_state: SIGNED
    terminal_states: [REVOKED]
    transitions:
      - from: SIGNED
        to: EXPIRED
        trigger: "system (logical clock passes expires_at; evaluated on read and at admit)"
        actor: system
        preconditions:
          - "Logical clock >= Waiver.expires_at"
        side_effects: []
      - from: SIGNED
        to: REVOKED
        trigger: "POST /waivers/{waiver_id}/revoke"
        actor: [Guest, OpsManager]
        preconditions:
          - "Waiver.status == SIGNED"
        side_effects:
          - "increments Waiver.version by 1"

  - entity: Venue
    field: operational_state
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: [OPEN, RESTRICTED]
        to: SHUTDOWN
        trigger: "POST /venues/{venue_id}/weather (weather_status -> SEVERE)"
        actor: OpsManager
        preconditions:
          - "weather_status set to SEVERE"
        side_effects:
          - "Cascade L1: every OPEN Attraction of this venue gets an ACTIVE Closure(reason=WEATHER) and runs OPEN->PAUSED cascade"
          - "operational_state -> SHUTDOWN; all sales blocked"
          - "increments Venue.version by 1"
      - from: SHUTDOWN
        to: OPEN
        trigger: "POST /venues/{venue_id}/weather (weather_status -> CLEAR)"
        actor: OpsManager
        preconditions:
          - "weather_status set to CLEAR"
          - "open_attraction_count > 0 after operators lift attraction closures"
        side_effects:
          - "operational_state -> OPEN"
          - "increments Venue.version by 1"
      - from: OPEN
        to: RESTRICTED
        trigger: "POST /venues/{venue_id}/weather (weather_status -> ADVISORY)"
        actor: OpsManager
        preconditions:
          - "weather_status set to ADVISORY"
        side_effects:
          - "operational_state -> RESTRICTED; new VIP tickets and season/group pass purchases blocked, GA/FAST_PASS still sold"
          - "increments Venue.version by 1"
      - from: RESTRICTED
        to: OPEN
        trigger: "POST /venues/{venue_id}/weather (weather_status -> CLEAR)"
        actor: OpsManager
        preconditions:
          - "weather_status set to CLEAR"
        side_effects:
          - "operational_state -> OPEN"
          - "increments Venue.version by 1"

# =============================================================================
# Concurrency Rules (§1.2.1) — OCC on TimeSlot.version
# =============================================================================
concurrency_rules:
  - rule_id: confirm-stale-time-slot
    parent_entity: TimeSlot
    write_endpoint: "POST /reservations/{reservation_id}/confirm"
    occ_field: "expected_time_slot_version"
    description: |
      Confirming a Reservation against a TimeSlot whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another confirmation has just incremented the slot's reserved_count
      (legitimately consuming capacity that the prior reader believed free), so
      the current writer's view of remaining capacity is stale.
    error_id: ERR_STALE_TIME_SLOT_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: dynamic_ticket_price
    trigger: "Reservation HELD->RESERVED (confirm); freezes each Ticket.price_cents"
    algorithm: tiered_pricing
    formula: |
      # Per ticket. Select PricingRule by (attraction_id of ticket.time_slot, ticket.tier).
      ratio = slot.demand_ratio   # (reserved_count + admitted_count) / capacity, evaluated BEFORE this confirm's increment
      if ratio <= rule.low_demand_max_ratio:
          surge_pct = 0
      elif ratio >= rule.high_demand_min_ratio:
          surge_pct = rule.high_surge_pct
      else:
          surge_pct = rule.mid_surge_pct
      price_cents = round_half_up(rule.base_price_cents * (100 + surge_pct) / 100)
    input_set: "The single active PricingRule matching (attraction_id, tier); demand_ratio snapshot before the confirm increment"
    constants: {}
    precision: "integer cents, round_half_up"
    variants:
      - name: low_band
        when: "demand_ratio <= low_demand_max_ratio"
        difference: "no surge; price == base_price_cents"
      - name: high_band
        when: "demand_ratio >= high_demand_min_ratio"
        difference: "high_surge_pct applied; boundary is inclusive >= at high_demand_min_ratio"
    note: "Boundary precision: ratio exactly == low_demand_max_ratio stays LOW (<=); ratio exactly == high_demand_min_ratio is HIGH (>=)."

  - name: pass_discount
    trigger: "Reservation HELD->RESERVED (confirm); computes Reservation.discount_cents"
    algorithm: aggregation
    formula: |
      subtotal_cents = sum(ticket.price_cents for each Ticket on the reservation)
      if reservation.pass_id is null: discount_cents = 0
      elif Pass.status != ACTIVE: discount_cents = 0
      elif PassProduct.kind == GROUP and reservation.party_size < PassProduct.min_party: discount_cents = 0
      else:
          # round per-line-item then sum (pinned order): discount each ticket, then total
          discount_cents = sum(round_half_up(ticket.price_cents * product.discount_pct / 100) for each Ticket)
      total_cents = max(0, subtotal_cents - discount_cents)
    input_set: "All Tickets on the reservation; the applied Pass and its PassProduct"
    constants: {}
    precision: "integer cents, round_half_up; round PER TICKET then sum (NOT sum-then-round)"
    note: "Combinatorial mode (b): rounding order is pinned to per-line-item; sum-then-round would yield different cents."

  - name: refund_credit
    trigger: "Reservation PAID->REFUNDED (cancel or closure cascade); Guest.wallet_credit_cents += amount"
    algorithm: aggregation
    formula: |
      refund_amount_cents = reservation.total_cents   # full credit of what was charged
      Guest.wallet_credit_cents = Guest.wallet_credit_cents + refund_amount_cents
    input_set: "The single reservation being refunded"
    constants: {}
    precision: "integer cents, exact"
    variants:
      - name: guest_self_cancel
        when: "Guest cancels their own RESERVED+PAID reservation"
        difference: "wallet credited with full total_cents"
      - name: closure_auto_refund
        when: "Closure cascade refunds a PAID reservation"
        difference: "same full total_cents credited; reason recorded on Closure.opened_reservation_refunds count"
    note: "Conserved-quantity invariant: cash_charged (sum of PAID total_cents) + wallet_credit issued == constant across cancel; see compensating_invariant."

  - name: wallet_apply
    trigger: "Reservation UNPAID->PAID (pay); applies guest wallet credit"
    algorithm: waterfall_allocation
    formula: |
      applied = min(Guest.wallet_credit_cents, reservation.total_cents)
      Guest.wallet_credit_cents = Guest.wallet_credit_cents - applied
      cash_charged_cents = reservation.total_cents - applied
    input_set: "Guest.wallet_credit_cents and reservation.total_cents at pay time"
    constants: {}
    precision: "integer cents, exact"
    note: "Wallet drains before cash; min() guards over-application."

  - name: venue_operational_state
    trigger: "weather change, attraction open/close, closure create/lift"
    algorithm: aggregation
    formula: |
      if venue.weather_status == SEVERE: operational_state = SHUTDOWN
      elif venue.weather_status == ADVISORY: operational_state = RESTRICTED
      else: operational_state = OPEN
      open_attraction_count = count(Attraction where venue_id == venue.id and status == OPEN)
    input_set: "venue.weather_status and all Attractions under the venue with status filter == OPEN"
    constants: {}
    precision: "exact integer count"
    note: "Aggregate selection: counts only status==OPEN attractions; PAUSED and CLOSED excluded."

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present", error_id: ERR_MISSING_AUTH, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Role authorized for this operation per RBAC matrix", error_id: ERR_ROLE_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 3, category: auth, check: "Acting Guest owns the targeted Guest/Reservation/Waiver/Pass resource (X-User-ID == owner guest_id)", error_id: ERR_NOT_OWNER, http_status: 403, applies_to: "guest-owned resource mutations" }
  - { priority: 4, category: existence, check: "Referenced resources exist, validated left-to-right in path then body FKs", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 5, category: state, check: "Target resource in a valid state for the requested transition", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all transition endpoints" }
  - { priority: 6, category: business_safety, check: "Ticket guest_age >= attraction.min_age", error_id: ERR_AGE_BELOW_MINIMUM, http_status: 422, applies_to: "POST /reservations/{id}/tickets, confirm, admit" }
  - { priority: 7, category: business_safety, check: "On admit, each ticketed guest holds a SIGNED non-expired Waiver with max_scare_level >= attraction.scare_level when attraction.requires_waiver", error_id: ERR_WAIVER_REQUIRED, http_status: 422, applies_to: "POST /reservations/{id}/admit" }
  - { priority: 8, category: business_safety, check: "Ticket.max_scare_level >= attraction.scare_level", error_id: ERR_SCARE_LEVEL_TOO_LOW, http_status: 422, applies_to: "POST /reservations/{id}/tickets, confirm" }
  - { priority: 9, category: business_safety, check: "On admit, every ScareZone of each ticketed attraction has staffing_status STAFFED", error_id: ERR_ZONE_UNDERSTAFFED, http_status: 409, applies_to: "POST /reservations/{id}/admit" }
  - { priority: 10, category: business_temporal, check: "On admit, logical clock within [earliest slot.window_start, latest slot.window_end)", error_id: ERR_OUTSIDE_ENTRY_WINDOW, http_status: 409, applies_to: "POST /reservations/{id}/admit" }
  - { priority: 11, category: business_temporal, check: "On check_in, logical clock within [shift_start, shift_end)", error_id: ERR_OUTSIDE_SHIFT_WINDOW, http_status: 409, applies_to: "POST /actor-shifts/{id}/check_in" }
  - { priority: 12, category: business_temporal, check: "A new ActorShift for the same actor_user_id must keep a mandatory SHIFT_REST_MINUTES (=30) rest buffer from every existing non-terminal (SCHEDULED or CHECKED_IN) shift; two shifts conflict when new.shift_start < existing.shift_end + 30min AND existing.shift_start < new.shift_end + 30min (buffered-interval semantics, NOT pure adjacency)", error_id: ERR_SHIFT_OVERLAP, http_status: 409, applies_to: "POST /scare-zones/{id}/actor-shifts" }
  - { priority: 13, category: business_temporal, check: "A new TimeSlot must not overlap an existing SCHEDULED slot on the same attraction using half-open [window_start, window_end) intersection; touching windows (existing.window_end == new.window_start) are allowed with zero buffer (pure-adjacency semantics)", error_id: ERR_SLOT_OVERLAP, http_status: 409, applies_to: "POST /attractions/{id}/time-slots" }
  - { priority: 14, category: business_constraint, check: "TimeSlot.capacity <= attraction.throughput_per_slot at creation", error_id: ERR_CAPACITY_OVER_THROUGHPUT, http_status: 422, applies_to: "POST /attractions/{id}/time-slots" }
  - { priority: 15, category: business_constraint, check: "Venue.operational_state != SHUTDOWN for any sale/confirm; != RESTRICTED for VIP ticket or pass purchase", error_id: ERR_SALES_BLOCKED, http_status: 409, applies_to: "confirm, POST /passes, VIP ticket add" }
  - { priority: 16, category: business_constraint, check: "Pass.status == ACTIVE and redemptions_used < product.max_redemptions when applying a pass at confirm", error_id: ERR_PASS_EXHAUSTED, http_status: 409, applies_to: "POST /reservations/{id}/confirm" }
  - { priority: 17, category: business_referential, check: "All Tickets on a reservation reference TimeSlots whose attraction.venue_id == reservation.venue_id", error_id: ERR_TICKET_VENUE_MISMATCH, http_status: 422, applies_to: "POST /reservations/{id}/tickets, confirm" }
  - { priority: 18, category: business_referential, check: "Pass.guest_id == reservation.guest_id when a pass is applied", error_id: ERR_PASS_NOT_OWNED, http_status: 422, applies_to: "POST /reservations/{id}/confirm" }
  - { priority: 19, category: concurrency, check: "expected_time_slot_version matches each referenced TimeSlot.version on confirm", error_id: ERR_STALE_TIME_SLOT_VERSION, http_status: 412, applies_to: "POST /reservations/{id}/confirm" }
  - { priority: 20, category: business_fiscal, check: "On confirm, for each referenced TimeSlot, reserved_count + admitted_count + new party members on that slot <= TimeSlot.capacity", error_id: ERR_SLOT_CAPACITY_EXCEEDED, http_status: 409, applies_to: "POST /reservations/{id}/confirm" }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock to an exact ISO 8601 UTC instant. Server startup default is 2026-03-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [OpsManager]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects: ["logical clock set; waiver expiry and window checks re-evaluate against it"]

  # --- Venue ---
  - method: POST
    path: "/venues"
    description: "Create a venue"
    roles: [OpsManager]
    code: 201
    input: [name, timezone]
    output: Venue
    side_effects: ["operational_state=OPEN, weather_status=CLEAR, version=1"]
  - method: GET
    path: "/venues/{venue_id}"
    description: "Read a venue including derived operational_state and open_attraction_count"
    roles: [OpsManager, BoxOffice, Guest, Actor]
    code: 200
    input: []
    output: Venue
    side_effects: []
  - method: POST
    path: "/venues/{venue_id}/weather"
    description: "Set venue weather_status; drives operational_state and weather-closure cascades"
    roles: [OpsManager]
    code: 200
    input: [weather_status, expected_venue_version]
    output: Venue
    side_effects: ["operational_state recomputed (calc venue_operational_state); SEVERE cascades closures; increments Venue.version by 1"]

  # --- Attraction ---
  - method: POST
    path: "/attractions"
    description: "Create an attraction under a venue"
    roles: [OpsManager]
    code: 201
    input: [venue_id, name, min_age, scare_level, throughput_per_slot, "requires_waiver?"]
    output: Attraction
    side_effects: ["status=OPEN; Venue.open_attraction_count += 1; recompute Venue.operational_state"]
  - method: GET
    path: "/attractions/{attraction_id}"
    description: "Read an attraction"
    roles: [OpsManager, BoxOffice, Guest, Actor]
    code: 200
    input: []
    output: Attraction
    side_effects: []
  - method: GET
    path: "/attractions"
    description: "List attractions, optionally filtered by venue_id (reverse-reachability for Attraction.venue_id)"
    roles: [OpsManager, BoxOffice, Guest, Actor]
    code: 200
    input: ["venue_id?", "limit?", "offset?"]
    output: Attraction[]
    side_effects: []
  - method: POST
    path: "/attractions/{attraction_id}/close_for_season"
    description: "Close an attraction for the season (terminal)"
    roles: [OpsManager]
    code: 200
    input: [expected_attraction_version]
    output: Attraction
    side_effects: ["status->CLOSED; all TimeSlots->CLOSED; Venue.open_attraction_count -= 1; recompute operational_state; increments Attraction.version by 1"]

  # --- PricingRule ---
  - method: POST
    path: "/attractions/{attraction_id}/pricing-rules"
    description: "Create a pricing rule (one per tier) for an attraction"
    roles: [OpsManager]
    code: 201
    input: [tier, base_price_cents, "low_demand_max_ratio?", "high_demand_min_ratio?", "mid_surge_pct?", "high_surge_pct?"]
    output: PricingRule
    side_effects: []
  - method: GET
    path: "/pricing-rules/{pricing_rule_id}"
    description: "Read a single pricing rule"
    roles: [OpsManager, BoxOffice, Guest, Actor]
    code: 200
    input: []
    output: PricingRule
    side_effects: []
  - method: GET
    path: "/pricing-rules"
    description: "List pricing rules filtered by attraction_id (reverse-reachability for PricingRule.attraction_id)"
    roles: [OpsManager, BoxOffice, Guest, Actor]
    code: 200
    input: ["attraction_id?", "limit?", "offset?"]
    output: PricingRule[]
    side_effects: []

  # --- TimeSlot ---
  - method: POST
    path: "/attractions/{attraction_id}/time-slots"
    description: "Create a timed-entry slot for an attraction"
    roles: [OpsManager]
    code: 201
    input: [window_start, window_end, capacity]
    output: TimeSlot
    side_effects: ["status=SCHEDULED; reserved_count=0; admitted_count=0; demand_ratio=0"]
  - method: GET
    path: "/time-slots/{time_slot_id}"
    description: "Read a slot including reserved_count, admitted_count, demand_ratio"
    roles: [OpsManager, BoxOffice, Guest, Actor]
    code: 200
    input: []
    output: TimeSlot
    side_effects: []
  - method: GET
    path: "/time-slots"
    description: "List slots filtered by attraction_id (reverse-reachability for TimeSlot.attraction_id)"
    roles: [OpsManager, BoxOffice, Guest, Actor]
    code: 200
    input: ["attraction_id?", "limit?", "offset?"]
    output: TimeSlot[]
    side_effects: []

  # --- Guest ---
  - method: POST
    path: "/guests"
    description: "Register a guest"
    roles: [BoxOffice, Guest]
    code: 201
    input: [full_name, age, email]
    output: Guest
    side_effects: ["wallet_credit_cents=0; version=1"]
  - method: GET
    path: "/guests/{guest_id}"
    description: "Read a guest including wallet_credit_cents"
    roles: [OpsManager, BoxOffice, Guest]
    code: 200
    input: []
    output: Guest
    side_effects: []

  # --- Waiver ---
  - method: POST
    path: "/guests/{guest_id}/waivers"
    description: "Sign a waiver for a guest; signed_at stamped from the logical clock"
    roles: [BoxOffice, Guest]
    code: 201
    input: [max_scare_level]
    output: Waiver
    side_effects: ["status=SIGNED; signed_at=clock; expires_at=clock + WAIVER_VALID_DAYS"]
  - method: GET
    path: "/waivers/{waiver_id}"
    description: "Read a single waiver; status reflects clock-derived EXPIRED"
    roles: [OpsManager, BoxOffice, Guest]
    code: 200
    input: []
    output: Waiver
    side_effects: []
  - method: GET
    path: "/waivers"
    description: "List waivers filtered by guest_id (reverse-reachability for Waiver.guest_id); status reflects clock-derived EXPIRED"
    roles: [OpsManager, BoxOffice, Guest]
    code: 200
    input: ["guest_id?", "limit?", "offset?"]
    output: Waiver[]
    side_effects: []
  - method: POST
    path: "/waivers/{waiver_id}/revoke"
    description: "Revoke a SIGNED waiver"
    roles: [Guest, OpsManager]
    code: 200
    input: [expected_waiver_version]
    output: Waiver
    side_effects: ["status->REVOKED; increments Waiver.version by 1"]

  # --- PassProduct & Pass ---
  - method: POST
    path: "/venues/{venue_id}/pass-products"
    description: "Create a season/group pass product"
    roles: [OpsManager]
    code: 201
    input: [kind, price_cents, discount_pct, max_redemptions, "min_party?"]
    output: PassProduct
    side_effects: []
  - method: GET
    path: "/pass-products/{pass_product_id}"
    description: "Read a single pass product"
    roles: [OpsManager, BoxOffice, Guest]
    code: 200
    input: []
    output: PassProduct
    side_effects: []
  - method: GET
    path: "/pass-products"
    description: "List pass products filtered by venue_id (reverse-reachability for PassProduct.venue_id)"
    roles: [OpsManager, BoxOffice, Guest]
    code: 200
    input: ["venue_id?", "limit?", "offset?"]
    output: PassProduct[]
    side_effects: []
  - method: POST
    path: "/passes"
    description: "Purchase (issue) a pass for a guest from a pass product"
    roles: [BoxOffice, Guest]
    code: 201
    input: [pass_product_id, guest_id]
    output: Pass
    side_effects: ["status=ACTIVE; redemptions_used=0; blocked when Venue.operational_state IN {RESTRICTED, SHUTDOWN}"]
  - method: GET
    path: "/passes/{pass_id}"
    description: "Read an issued pass"
    roles: [OpsManager, BoxOffice, Guest]
    code: 200
    input: []
    output: Pass
    side_effects: []
  - method: GET
    path: "/passes"
    description: "List passes filtered by guest_id or pass_product_id (reverse-reachability for Pass.guest_id and Pass.pass_product_id)"
    roles: [OpsManager, BoxOffice, Guest]
    code: 200
    input: ["guest_id?", "pass_product_id?", "limit?", "offset?"]
    output: Pass[]
    side_effects: []

  # --- Reservation & Ticket ---
  - method: POST
    path: "/reservations"
    description: "Create a HELD reservation for a guest at a venue (combo across attractions allowed via tickets)"
    roles: [BoxOffice, Guest]
    code: 201
    input: [venue_id, guest_id, "pass_id?"]
    output: Reservation
    side_effects: ["entry_status=HELD; payment_status=UNPAID; party_size=0; version=1"]
  - method: GET
    path: "/reservations/{reservation_id}"
    description: "Read a reservation with both status dimensions and money fields"
    roles: [OpsManager, BoxOffice, Guest]
    code: 200
    input: []
    output: Reservation
    side_effects: []
  - method: GET
    path: "/reservations"
    description: "List reservations filtered by guest_id or venue_id (reverse-reachability for Reservation.guest_id, Reservation.venue_id, Reservation.pass_id)"
    roles: [OpsManager, BoxOffice, Guest]
    code: 200
    input: ["guest_id?", "venue_id?", "pass_id?", "limit?", "offset?"]
    output: Reservation[]
    side_effects: []
  - method: POST
    path: "/reservations/{reservation_id}/tickets"
    description: "Add a ticket (one party member) to a HELD reservation, bound to a slot and tier"
    roles: [BoxOffice, Guest]
    code: 201
    input: [time_slot_id, guest_age, max_scare_level, tier]
    output: Ticket
    side_effects: ["queue_priority set by tier (VIP=0, FAST_PASS=1, GA=2); reservation.party_size += 1; VIP add blocked when operational_state RESTRICTED/SHUTDOWN"]
  - method: GET
    path: "/tickets/{ticket_id}"
    description: "Read a single ticket including frozen price_cents and queue_priority"
    roles: [OpsManager, BoxOffice, Guest]
    code: 200
    input: []
    output: Ticket
    side_effects: []
  - method: GET
    path: "/tickets"
    description: "List tickets filtered by reservation_id or time_slot_id (reverse-reachability for Ticket.reservation_id and Ticket.time_slot_id)"
    roles: [OpsManager, BoxOffice, Guest]
    code: 200
    input: ["reservation_id?", "time_slot_id?", "limit?", "offset?"]
    output: Ticket[]
    side_effects: []
  - method: POST
    path: "/reservations/{reservation_id}/confirm"
    description: "Confirm a HELD reservation: freeze prices, apply pass discount, consume slot capacity under OCC"
    roles: [BoxOffice, Guest]
    code: 200
    input: [expected_time_slot_version]
    output: Reservation
    side_effects: ["entry_status->RESERVED; freeze Ticket.price_cents (calc dynamic_ticket_price); compute discount (calc pass_discount); slot.reserved_count += party; increments TimeSlot.version by 1; Pass.redemptions_used += 1"]
  - method: POST
    path: "/reservations/{reservation_id}/pay"
    description: "Pay a RESERVED+UNPAID reservation, draining wallet credit first"
    roles: [BoxOffice, Guest]
    code: 200
    input: []
    output: Reservation
    side_effects: ["payment_status->PAID; apply wallet (calc wallet_apply); increments Reservation.version by 1"]
  - method: POST
    path: "/reservations/{reservation_id}/admit"
    description: "Admit a RESERVED+PAID reservation within its entry window with staffing/waiver checks"
    roles: [BoxOffice]
    code: 200
    input: []
    output: Reservation
    side_effects: ["entry_status->ADMITTED; per slot reserved_count -=, admitted_count +=; increments TimeSlot.version and Reservation.version by 1"]
  - method: POST
    path: "/reservations/{reservation_id}/mark_no_show"
    description: "Mark a RESERVED reservation NO_SHOW after its window ends"
    roles: [BoxOffice]
    code: 200
    input: []
    output: Reservation
    side_effects: ["entry_status->NO_SHOW; per slot reserved_count -= ; recompute demand_ratio; increments versions"]
  - method: POST
    path: "/reservations/{reservation_id}/cancel"
    description: "Cancel a HELD/RESERVED reservation; refunds to wallet if PAID, returns slot and pass capacity"
    roles: [Guest, BoxOffice]
    code: 200
    input: []
    output: Reservation
    side_effects: ["entry_status->CANCELLED; if PAID payment_status->REFUNDED and wallet credited (calc refund_credit); slot.reserved_count returned; Pass.redemptions_used returned"]

  # --- ScareZone & ActorShift ---
  - method: POST
    path: "/attractions/{attraction_id}/scare-zones"
    description: "Create a scare zone under an attraction"
    roles: [OpsManager]
    code: 201
    input: [name, min_actors]
    output: ScareZone
    side_effects: ["staffing_status=UNDERSTAFFED; checked_in_count=0"]
  - method: GET
    path: "/scare-zones/{scare_zone_id}"
    description: "Read a scare zone including staffing_status"
    roles: [OpsManager, BoxOffice, Actor]
    code: 200
    input: []
    output: ScareZone
    side_effects: []
  - method: GET
    path: "/scare-zones"
    description: "List scare zones filtered by attraction_id (reverse-reachability for ScareZone.attraction_id)"
    roles: [OpsManager, BoxOffice, Actor]
    code: 200
    input: ["attraction_id?", "limit?", "offset?"]
    output: ScareZone[]
    side_effects: []
  - method: POST
    path: "/scare-zones/{scare_zone_id}/actor-shifts"
    description: "Schedule an actor shift in a scare zone"
    roles: [OpsManager]
    code: 201
    input: [actor_user_id, shift_start, shift_end]
    output: ActorShift
    side_effects: ["status=SCHEDULED; overlap-checked against same actor_user_id"]
  - method: GET
    path: "/actor-shifts/{shift_id}"
    description: "Read an actor shift"
    roles: [OpsManager, Actor]
    code: 200
    input: []
    output: ActorShift
    side_effects: []
  - method: GET
    path: "/actor-shifts"
    description: "List actor shifts filtered by scare_zone_id (reverse-reachability for ActorShift.scare_zone_id)"
    roles: [OpsManager, Actor]
    code: 200
    input: ["scare_zone_id?", "limit?", "offset?"]
    output: ActorShift[]
    side_effects: []
  - method: POST
    path: "/actor-shifts/{shift_id}/check_in"
    description: "Actor checks in to a scheduled shift within its window"
    roles: [Actor]
    code: 200
    input: []
    output: ActorShift
    side_effects: ["status->CHECKED_IN; ScareZone.checked_in_count += 1; may bubble zone to STAFFED; increments ActorShift.version by 1"]
  - method: POST
    path: "/actor-shifts/{shift_id}/check_out"
    description: "Actor checks out; may drop zone to UNDERSTAFFED and trigger an UNDERSTAFFED closure cascade"
    roles: [Actor]
    code: 200
    input: []
    output: ActorShift
    side_effects: ["status->CHECKED_OUT; ScareZone.checked_in_count -= 1; may bubble to UNDERSTAFFED and cascade a Closure; increments ActorShift.version by 1"]
  - method: POST
    path: "/actor-shifts/{shift_id}/cancel"
    description: "Cancel a SCHEDULED actor shift"
    roles: [OpsManager]
    code: 200
    input: []
    output: ActorShift
    side_effects: ["status->CANCELLED; increments ActorShift.version by 1"]

  # --- Closure ---
  - method: POST
    path: "/attractions/{attraction_id}/closures"
    description: "Open a closure on an attraction (pauses it, cascades slot/reservation refunds)"
    roles: [OpsManager]
    code: 201
    input: [reason, expected_attraction_version]
    output: Closure
    side_effects: ["status=ACTIVE; Attraction OPEN->PAUSED cascade (calc refund_credit on PAID reservations); increments Attraction.version by 1"]
  - method: GET
    path: "/closures/{closure_id}"
    description: "Read a closure including opened_reservation_refunds"
    roles: [OpsManager, BoxOffice]
    code: 200
    input: []
    output: Closure
    side_effects: []
  - method: GET
    path: "/closures"
    description: "List closures filtered by attraction_id (reverse-reachability for Closure.attraction_id)"
    roles: [OpsManager, BoxOffice]
    code: 200
    input: ["attraction_id?", "limit?", "offset?"]
    output: Closure[]
    side_effects: []
  - method: POST
    path: "/closures/{closure_id}/lift"
    description: "Lift an ACTIVE closure; restores the attraction to OPEN if no other ACTIVE closure remains"
    roles: [OpsManager]
    code: 200
    input: [expected_attraction_version]
    output: Closure
    side_effects: ["status->LIFTED; Attraction PAUSED->OPEN when last closure; reopens future SCHEDULED slots; increments versions"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_AUTH, http: 401, condition: "X-User-Role or X-User-ID header missing" }
  - { id: ERR_ROLE_FORBIDDEN, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_NOT_OWNER, http: 403, condition: "Acting Guest is not the owner of the targeted guest-owned resource" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing required field, or invalid enum value" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid state for the requested transition" }
  - { id: ERR_AGE_BELOW_MINIMUM, http: 422, condition: "Ticket guest_age below attraction.min_age" }
  - { id: ERR_WAIVER_REQUIRED, http: 422, condition: "Admit attempted without a SIGNED non-expired sufficient-scare-level waiver for a waiver-required attraction" }
  - { id: ERR_SCARE_LEVEL_TOO_LOW, http: 422, condition: "Ticket.max_scare_level below attraction.scare_level" }
  - { id: ERR_ZONE_UNDERSTAFFED, http: 409, condition: "Admit attempted while a required ScareZone is UNDERSTAFFED" }
  - { id: ERR_OUTSIDE_ENTRY_WINDOW, http: 409, condition: "Admit attempted outside the reservation's timed-entry window" }
  - { id: ERR_OUTSIDE_SHIFT_WINDOW, http: 409, condition: "Actor check_in attempted outside the shift window" }
  - { id: ERR_SHIFT_OVERLAP, http: 409, condition: "New actor shift overlaps an existing non-terminal shift for the same actor_user_id" }
  - { id: ERR_SLOT_OVERLAP, http: 409, condition: "New time slot overlaps an existing SCHEDULED slot on the same attraction" }
  - { id: ERR_CAPACITY_OVER_THROUGHPUT, http: 422, condition: "TimeSlot.capacity exceeds attraction.throughput_per_slot" }
  - { id: ERR_SALES_BLOCKED, http: 409, condition: "Venue operational_state blocks the sale (SHUTDOWN blocks all; RESTRICTED blocks VIP/pass)" }
  - { id: ERR_PASS_EXHAUSTED, http: 409, condition: "Applied pass is not ACTIVE or has no remaining redemptions" }
  - { id: ERR_PASS_NOT_OWNED, http: 422, condition: "Applied pass's guest_id differs from the reservation's guest_id" }
  - { id: ERR_TICKET_VENUE_MISMATCH, http: 422, condition: "A ticket's slot belongs to an attraction in a different venue than the reservation" }
  - { id: ERR_STALE_TIME_SLOT_VERSION, http: 412, condition: "expected_time_slot_version does not match a referenced TimeSlot.version at confirm" }
  - { id: ERR_SLOT_CAPACITY_EXCEEDED, http: 409, condition: "Confirm would push a slot's reserved_count + admitted_count + new party above capacity" }
  - { id: ERR_STALE_VENUE_VERSION, http: 412, condition: "expected_venue_version does not match Venue.version on weather change" }
  - { id: ERR_STALE_ATTRACTION_VERSION, http: 412, condition: "expected_attraction_version does not match Attraction.version on close/closure/lift" }
  - { id: ERR_STALE_WAIVER_VERSION, http: 412, condition: "expected_waiver_version does not match Waiver.version on revoke" }
  - { id: ERR_EMPTY_RESERVATION, http: 422, condition: "Confirm attempted on a reservation with zero tickets" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: OpsManager
    description: "Operations manager; owns venues, attractions, slots, pricing, scheduling, closures, weather"
    identity: opaque
    exclusive_operations:
      - "POST /venues — create venue"
      - "POST /venues/{id}/weather — set weather/operational state"
      - "POST /attractions — create attraction"
      - "POST /attractions/{id}/close_for_season — close attraction"
      - "POST /attractions/{id}/pricing-rules — create pricing rule"
      - "POST /attractions/{id}/time-slots — create time slot"
      - "POST /venues/{id}/pass-products — create pass product"
      - "POST /attractions/{id}/scare-zones — create scare zone"
      - "POST /scare-zones/{id}/actor-shifts — schedule actor shift"
      - "POST /actor-shifts/{id}/cancel — cancel shift"
      - "POST /attractions/{id}/closures — open closure"
      - "POST /closures/{id}/lift — lift closure"
      - "POST /_clock/set_current_utc — set logical clock"
    shared_operations:
      - "POST /waivers/{id}/revoke — revoke waiver (with Guest)"
      - "GET reads"

  - name: BoxOffice
    description: "Box office staff; sells/confirms/pays/admits reservations, issues passes/waivers, registers guests"
    identity: opaque
    exclusive_operations:
      - "POST /reservations/{id}/admit — admit guests at the gate"
      - "POST /reservations/{id}/mark_no_show — mark no-show"
    shared_operations:
      - "POST /guests — register guest (with Guest)"
      - "POST /guests/{id}/waivers — sign waiver (with Guest)"
      - "POST /passes — issue pass (with Guest)"
      - "POST /reservations — create reservation (with Guest)"
      - "POST /reservations/{id}/tickets — add ticket (with Guest)"
      - "POST /reservations/{id}/confirm — confirm (with Guest)"
      - "POST /reservations/{id}/pay — pay (with Guest)"
      - "POST /reservations/{id}/cancel — cancel (with Guest)"
      - "GET reads"

  - name: Guest
    description: "Patron acting on own guest record, waivers, passes, and reservations"
    identity: "entity_backed:Guest"
    exclusive_operations: []
    shared_operations:
      - "POST /guests — register self (with BoxOffice)"
      - "POST /guests/{id}/waivers — sign own waiver (with BoxOffice)"
      - "POST /waivers/{id}/revoke — revoke own waiver (with OpsManager)"
      - "POST /passes — buy own pass (with BoxOffice)"
      - "POST /reservations — create own reservation (with BoxOffice)"
      - "POST /reservations/{id}/tickets — add ticket to own reservation (with BoxOffice)"
      - "POST /reservations/{id}/confirm — confirm own reservation (with BoxOffice)"
      - "POST /reservations/{id}/pay — pay own reservation (with BoxOffice)"
      - "POST /reservations/{id}/cancel — cancel own reservation (with BoxOffice)"
      - "GET reads on own resources"

  - name: Actor
    description: "Scare actor; checks in/out of own shifts"
    identity: opaque
    exclusive_operations:
      - "POST /actor-shifts/{id}/check_in — check in to shift"
      - "POST /actor-shifts/{id}/check_out — check out of shift"
    shared_operations:
      - "GET reads on attractions/zones/shifts"
