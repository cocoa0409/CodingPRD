              as: SafetyOfficer
            - call: "POST /inventory-lots"
              payload: { cut_type_id: "${dr_id}", received_weight_g: 5000, aging_target_days: 7 }
              as: Butcher
              captures: { lot_id: "$.data.id" }
          trigger:
            - call: "POST /inventory-lots/${lot_id}/start-aging"
              payload: { locker_id: "${locker_id}" }
              as: Butcher
              captures: { err: "$.data.error_id" }
          assert:
            - "start-aging response error_id == ERR_LOCKER_QUARANTINED"

  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: locker_capacity_aggregate_buffer_overlap
        grounds:
          - state_machines.InventoryLot.AVAILABLE_to_AGING
          - validations[priority=13]
          - entities.DryAgeLocker.fields.occupied_g
          - entities.DryAgeLocker.fields.capacity_g
        distinguishing_aspect: |
          DryAgeLocker uses AGGREGATE-CAPACITY interval semantics: occupancy is the SUM of received_weight_g
          over all AGING lots, and a new aging start is rejected when occupied_g + received_weight_g > capacity_g.
          Equality (10000 == 10000) is allowed; this is a many-lots-share-one-resource overlap, not a pairwise one.
        test_recipe:
          setup:
            - "A locker capacity 10000g already holding one AGING lot of 6000g (occupied_g 6000); a second AVAILABLE lot of 5000g."
          setup_api_calls:
            - call: "POST /cut-types"
              payload: { code: "DRY_RIBEYE", species: "BEEF", base_price_cents_per_kg: 6000, requires_dry_age: true }
              as: ShiftManager
              captures: { dr_id: "$.data.id" }
            - call: "POST /dry-age-lockers"
              payload: { name: "LOCKER-F", capacity_g: 10000, min_temp_c: 0, max_temp_c: 4 }
              as: ShiftManager
              captures: { locker_id: "$.data.id" }
            - call: "POST /inventory-lots"
              payload: { cut_type_id: "${dr_id}", received_weight_g: 6000, aging_target_days: 7 }
              as: Butcher
              captures: { lot_a: "$.data.id" }
            - call: "POST /inventory-lots/${lot_a}/start-aging"
              payload: { locker_id: "${locker_id}" }
              as: Butcher
            - call: "POST /inventory-lots"
              payload: { cut_type_id: "${dr_id}", received_weight_g: 5000, aging_target_days: 7 }
              as: Butcher
              captures: { lot_b: "$.data.id" }
          trigger:
            - call: "POST /inventory-lots/${lot_b}/start-aging"
              payload: { locker_id: "${locker_id}" }
              as: Butcher
              captures: { err: "$.data.error_id" }
          assert:
            - "start-aging response error_id == ERR_LOCKER_OVER_CAPACITY"

      - name: animal_share_fraction_capacity_overlap
        grounds:
          - calculations.share_remaining_carcass
          - validations[priority=12]
          - entities.AnimalShare.fields.claimed_fraction_x4
          - state_machines.ShareClaim.ACTIVE_to_CANCELLED
        distinguishing_aspect: |
          AnimalShare uses FRACTIONAL-QUARTER-UNIT interval semantics (a different resource and different
          interval arithmetic from the locker's gram-sum): the conserved capacity is 4 quarter-units, and a
          new ShareClaim is rejected when claimed_fraction_x4 + requested_units > 4. With x4 at 3, a HALF (2)
          overflows to 5 and is rejected; a QUARTER (1) fitting exactly to 4 is allowed.
        test_recipe:
          setup:
            - "An OPEN AnimalShare with claimed_fraction_x4 == 3 (one ACTIVE QUARTER + one ACTIVE HALF)."
          setup_api_calls:
            - call: "POST /animal-shares"
              payload: { species: "PORK", carcass_weight_g: 80000, deposit_cents: 6000 }
              as: ShiftManager
              captures: { share_id: "$.data.id" }
            - call: "POST /customers"
              payload: { full_name: "Ona Quarter", phone: "555-0012" }
              as: CounterClerk
              captures: { c1_id: "$.data.id" }
            - call: "POST /customers"
              payload: { full_name: "Hank Half", phone: "555-0013" }
              as: CounterClerk
              captures: { c2_id: "$.data.id" }
            - call: "POST /customers"
              payload: { full_name: "Hugo Overflow", phone: "555-0014" }
              as: CounterClerk
              captures: { c3_id: "$.data.id" }
            - call: "POST /share-claims"
              payload: { animal_share_id: "${share_id}", customer_id: "${c1_id}", fraction: "QUARTER" }
              as: CounterClerk
              as_user_id: "${c1_id}"
            - call: "POST /share-claims"
              payload: { animal_share_id: "${share_id}", customer_id: "${c2_id}", fraction: "HALF" }
              as: CounterClerk
              as_user_id: "${c2_id}"
          trigger:
            - call: "POST /share-claims"
              payload: { animal_share_id: "${share_id}", customer_id: "${c3_id}", fraction: "HALF" }
              as: CounterClerk
              as_user_id: "${c3_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "share-claims response error_id == ERR_SHARE_OVERCOMMITTED"

  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: share_claim_cancel_conserves_carcass_grams_and_deposit
        grounds:
          - state_machines.ShareClaim.ACTIVE_to_CANCELLED
          - calculations.share_remaining_carcass
          - entities.AnimalShare.fields.remaining_carcass_g
          - entities.Customer.fields.store_credit_cents
        distinguishing_aspect: |
          Conserved quantity: carcass grams. The forward HALF claim lowers remaining_carcass_g by 50000 and
          charges 16000c deposit; the compensating cancel restores remaining_carcass_g to the pre-claim 100000
          and refunds 16000c to store credit, leaving remaining_carcass_g == carcass_weight_g (invariant held).
        test_recipe:
          setup:
            - "An OPEN AnimalShare carcass 100000g, deposit_cents 8000, no claims (remaining_carcass_g 100000)."
          setup_api_calls:
            - call: "POST /animal-shares"
              payload: { species: "BEEF", carcass_weight_g: 100000, deposit_cents: 8000 }
              as: ShiftManager
              captures: { share_id: "$.data.id" }
            - call: "POST /customers"
              payload: { full_name: "Cara Conserve", phone: "555-0015" }
              as: CounterClerk
              captures: { cc_id: "$.data.id" }
            - call: "POST /share-claims"
              payload: { animal_share_id: "${share_id}", customer_id: "${cc_id}", fraction: "HALF" }
              as: CounterClerk
              as_user_id: "${cc_id}"
              captures: { claim_id: "$.data.id" }
          trigger:
            - call: "POST /share-claims/${claim_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${cc_id}"
            - call: "GET /animal-shares/${share_id}"
              payload: {}
              as: ShiftManager
              captures: { rem: "$.data.remaining_carcass_g" }
            - call: "GET /customers/${cc_id}"
              payload: {}
              as: ShiftManager
              captures: { credit: "$.data.store_credit_cents" }
          assert:
            - "AnimalShare.${share_id}.remaining_carcass_g == 100000"
            - "AnimalShare.${share_id}.claimed_fraction_x4 == 0"
            - "Customer.${cc_id}.store_credit_cents == 16000"

      - name: batch_reserve_cancel_conserves_lot_remaining_weight
        grounds:
          - state_machines.SausageBatch.DRAFT_to_RESERVED
          - state_machines.SausageBatch.RESERVED_to_CANCELLED
          - entities.InventoryLot.fields.remaining_weight_g
          - entities.LotDraw.fields.draw_status
        distinguishing_aspect: |
          Conserved quantity: InventoryLot remaining grams (a different conserved quantity than carcass grams).
          Reserve commits a 1500g draw (remaining 4000 -> 2500); cancel reverts the draw, restoring
          remaining_weight_g to the original 4000 — total committed-minus-reverted grams nets to zero.
        test_recipe:
          setup:
            - "A grind input lot of 4000g (remaining 4000); a RESERVED batch consuming 1500g of it (remaining 2500)."
          setup_api_calls:
            - call: "POST /pricing-policies"
              payload: { shrink_pct_whole_cut: 0.04, shrink_pct_grind: 0.10, preferred_discount_pct: 0.10, wholesale_discount_pct: 0.20, bulk_threshold_g: 5000, bulk_extra_discount_pct: 0.05 }
              as: ShiftManager
            - call: "POST /cut-types"
              payload: { code: "PORK_TRIM", species: "PORK", base_price_cents_per_kg: 800 }
              as: ShiftManager
              captures: { trim_id: "$.data.id" }
            - call: "POST /cut-types"
              payload: { code: "GROUND_BLEND", species: "PORK", base_price_cents_per_kg: 1200, is_grind: true }
              as: ShiftManager
              captures: { blend_id: "$.data.id" }
            - call: "POST /inventory-lots"
              payload: { cut_type_id: "${trim_id}", received_weight_g: 4000 }
              as: Butcher
              captures: { lot_id: "$.data.id" }
            - call: "POST /sausage-batches"
              payload: { recipe_name: "Bratwurst", output_cut_type_id: "${blend_id}", planned_output_g: 1350 }
              as: Butcher
              captures: { batch_id: "$.data.id" }
            - call: "POST /sausage-batches/${batch_id}/inputs"
              payload: { inventory_lot_id: "${lot_id}", weight_g: 1500 }
              as: Butcher
            - call: "POST /sausage-batches/${batch_id}/reserve"
              payload: {}
              as: Butcher
          trigger:
            - call: "POST /sausage-batches/${batch_id}/cancel"
              payload: {}
              as: Butcher
            - call: "GET /inventory-lots/${lot_id}"
              payload: {}
              as: Butcher
              captures: { rem: "$.data.remaining_weight_g" }
          assert:
            - "InventoryLot.${lot_id}.remaining_weight_g == 4000"
            - "InventoryLot.${lot_id}.lot_status == AVAILABLE"
