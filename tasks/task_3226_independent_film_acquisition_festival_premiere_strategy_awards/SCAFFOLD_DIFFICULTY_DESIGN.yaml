  # ===========================================================================
  # Rule 8 — Resource temporal-overlap conflicts with different interval semantics
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: premiere_slot_festival_venue_overlap_half_open
        grounds:
          - state_machines.PremiereSlot.HELD_to_BOOKED
          - errors.ERR_VENUE_OVERLAP
        distinguishing_aspect: |
          Festival-venue overlap uses half-open interval arithmetic: two slots at
          the same festival whose screening intervals merely touch (one ends
          exactly when the next begins) do NOT conflict; slots that share any
          interior time DO conflict. Different resource (PremiereSlot at same
          Festival) and different semantics than instance 2.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Festival SUNDANCE. Two films F1, F2 acquired."
            - "Slot S1: screening 2027-01-22T18:00:00Z–2027-01-22T20:00:00Z, embargo 2027-01-23T08:00:00Z. Slot S2: screening 2027-01-22T20:00:00Z–2027-01-22T22:00:00Z (touching S1's end), embargo 2027-01-23T08:00:00Z. Slot S3: screening 2027-01-22T19:30:00Z–2027-01-22T21:30:00Z (overlaps S1's tail), embargo 2027-01-23T08:00:00Z."
            - "All three slots HELD: S1 for F1, S2 for F2, S3 for F2."
          setup_api_calls:
            - call: "POST /territories"
              payload: { code: "US", name: "United States", is_home_ent_eligible: true }
              as: PlatformAdmin
            - call: "POST /festivals"
              payload: { code: "SUNDANCE", name: "Sundance", start_date: "2027-01-21T00:00:00Z", end_date: "2027-01-31T00:00:00Z", prestige_tier: "A_LIST", default_review_embargo_hours: 24 }
              as: PlatformAdmin
              captures: { fest_id: $.data.id }
            - call: "POST /films"
              payload: { title: "F1", director_name: "D1", principal_cast: ["X"], genre: "DRAMA", runtime_minutes: 90, production_budget_cents: 100 }
              as: PlatformAdmin
              captures: { f1_id: $.data.id }
            - call: "POST /films/${f1_id}/offers"
              payload: { buyer_code: "A24", upfront_price_cents: 1000000, backend_participation_pct: 0.10, prints_advertising_commit_cents: 1000000, requested_territory_codes: ["US"], requested_windows: ["THEATRICAL"], expiry_at: "2026-12-31T00:00:00Z" }
              as: AcquisitionExec
              captures: { f1_offer: $.data.id }
            - call: "GET /films/${f1_id}"
              payload: {}
              as: AcquisitionExec
              captures: { f1_v: $.data.version }
            - call: "POST /films/${f1_id}/offers/${f1_offer}/accept"
              payload: { expected_film_version: "${f1_v}" }
              as: AcquisitionExec
            - call: "POST /films"
              payload: { title: "F2", director_name: "D2", principal_cast: ["Y"], genre: "COMEDY", runtime_minutes: 95, production_budget_cents: 100 }
              as: PlatformAdmin
              captures: { f2_id: $.data.id }
            - call: "POST /films/${f2_id}/offers"
              payload: { buyer_code: "NEON", upfront_price_cents: 1000000, backend_participation_pct: 0.10, prints_advertising_commit_cents: 1000000, requested_territory_codes: ["US"], requested_windows: ["THEATRICAL"], expiry_at: "2026-12-31T00:00:00Z" }
              as: AcquisitionExec
              captures: { f2_offer: $.data.id }
            - call: "GET /films/${f2_id}"
              payload: {}
              as: AcquisitionExec
              captures: { f2_v: $.data.version }
            - call: "POST /films/${f2_id}/offers/${f2_offer}/accept"
              payload: { expected_film_version: "${f2_v}" }
              as: AcquisitionExec
            - call: "POST /festivals/${fest_id}/premiere-slots"
              payload: { section: "COMPETITION", screening_starts_at: "2027-01-22T18:00:00Z", screening_ends_at: "2027-01-22T20:00:00Z", review_embargo_lifts_at: "2027-01-23T08:00:00Z" }
              as: FestivalProgrammer
              captures: { s1: $.data.id }
            - call: "POST /festivals/${fest_id}/premiere-slots"
              payload: { section: "PREMIERES", screening_starts_at: "2027-01-22T20:00:00Z", screening_ends_at: "2027-01-22T22:00:00Z", review_embargo_lifts_at: "2027-01-23T08:00:00Z" }
              as: FestivalProgrammer
              captures: { s2: $.data.id }
            - call: "POST /festivals/${fest_id}/premiere-slots"
              payload: { section: "MIDNIGHT", screening_starts_at: "2027-01-22T19:30:00Z", screening_ends_at: "2027-01-22T21:30:00Z", review_embargo_lifts_at: "2027-01-23T08:00:00Z" }
              as: FestivalProgrammer
              captures: { s3: $.data.id }
            - call: "POST /festivals/${fest_id}/premiere-slots/${s1}/hold"
              payload: { film_id: "${f1_id}" }
              as: FestivalProgrammer
            - call: "POST /festivals/${fest_id}/premiere-slots/${s2}/hold"
              payload: { film_id: "${f2_id}" }
              as: FestivalProgrammer
            - call: "POST /festivals/${fest_id}/premiere-slots/${s3}/hold"
              payload: { film_id: "${f2_id}" }
              as: FestivalProgrammer
            - call: "GET /films/${f1_id}"
              payload: {}
              as: FestivalProgrammer
              captures: { f1_v2: $.data.version }
            - call: "POST /festivals/${fest_id}/premiere-slots/${s1}/book"
              payload: { expected_film_version: "${f1_v2}" }
