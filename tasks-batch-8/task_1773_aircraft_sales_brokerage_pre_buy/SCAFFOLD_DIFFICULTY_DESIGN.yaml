      - name: valuation_minimum_three_verified_comps_boundary
        grounds:
          - calculations.market_comparables_valuation
          - errors[ERR_INSUFFICIENT_COMPARABLES]
        distinguishing_aspect: |
          Collection-count boundary on POST /api/listings/{id}/valuation: with
          exactly 2 VERIFIED comps (a third comp is UNVERIFIED and excluded
          from the input set) valuation fails with ERR_INSUFFICIENT_COMPARABLES;
          adding a third VERIFIED comp (count == MIN_COMPARABLES, >= not >)
          succeeds — a different metric (count vs money) and endpoint than the
          deposit boundary.
        test_recipe:
          setup:
            - "DRAFT listing Gulfstream G550 tt 2900; 2 VERIFIED G550 comps + 1 UNVERIFIED G550 comp"
          setup_api_calls:
            - call: "POST /api/listings"
              payload: { tail_number: "N1773GS", make: "Gulfstream", model: "G550", year: 2015, total_time_hours: 2900, asking_price_usd: 12900000.00, seller_name: "Apex Jet Holdings" }
