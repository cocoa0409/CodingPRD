            - call: "POST /v1/projects/${p_id}/spec-sections"
              payload: { section_number: "051200", lead_time_days: 20, review_days: 10, default_need_date: "2026-10-30", responsible_subcontractor_id: "${c1_id}", required_submittal_kinds: ["PRODUCT_DATA", "SHOP_DRAWINGS", "SAMPLES"] }
              as: ProjectEngineer
              captures: { sec_id: $.data.id }
            - call: "POST /v1/spec-sections/${sec_id}/activate"
