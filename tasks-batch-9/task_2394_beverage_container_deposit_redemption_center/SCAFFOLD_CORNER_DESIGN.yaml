          - validations[priority=5]
          - errors[ERR_UNAUTHENTICATED]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "A request for an id that does not exist still returns 401 when the role header is unusable and 403 when the role is not on the endpoint — the 404 lookup at priority 5 is never reached."
        test_recipe:
          setup:
