            - "Overpayment: HTTP 422 with error_id ERR_PAYMENT_AMOUNT_MISMATCH — the rule rejects over-payment as well as partial payment"
            - "Exact payment of amount_cents + late_fee_cents - paid_amount_cents == 45360 + 0 - 0: HTTP 200, status PAID, paid_amount_cents 45360, paid_at set to the current logical clock instant"
            - "After settlement the membership reports dues_balance_cents 0 and dues_status CURRENT; before it, the two refused attempts left paid_amount_cents at 0 and the invoice OPEN"
