              as: CarrierRep
              as_user_id: "${carrier_id}"
              captures: { lic_v: $.data.version }
          trigger:
            - call: "POST /fmc/oti-licenses/${lic_id}/draws"
              payload: { bond_ref: "B1", amount_cents: 8000000, reason: "oversized claim", expected_license_version: "${lic_v}" }
              as: EnforcementCounsel
              as_user_id: "ec-1"
              captures: { err_over: $.data.error_id }
            - call: "POST /fmc/oti-licenses/${lic_id}/draws"
              payload: { bond_ref: "B1", amount_cents: -1, reason: "reversal with nothing drawn", expected_license_version: "${lic_v}" }
