          assert:
            - "Trigger call 1 returns 404 with data.error_id == 'ERR_OPERATOR_NOT_FOUND'"
            - "Trigger call 2 returns 404 with data.error_id == 'ERR_ENDORSEMENT_NOT_FOUND'"
            - "Trigger call 3 returns 404 with data.error_id == 'ERR_PLACEMENT_NOT_FOUND'"
            - "Trigger call 4 returns 404 with data.error_id == 'ERR_ASSESSMENT_NOT_FOUND'"
            - "Trigger call 5 returns 404 with data.error_id == 'ERR_TRANSACTION_NOT_FOUND'"
            - "Trigger call 6 returns 404 with data.error_id == 'ERR_DECLARATION_NOT_FOUND'"
            - "All six error_id values are pairwise distinct, and each response body carries a non-empty data.message"
            - "Trigger call 7 returns 200 with data.id == ${op_id} and legal_name == 'Northwind Flight Academy' — the same collection that 404s on an unknown id resolves a known one"
      - name: corner_duplicate_registration_mark_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=10]
          - errors[ERR_DUPLICATE_REGISTRATION]
          - entities.Aircraft.fields.registration_mark
        distinguishing_aspect: "Uniqueness is on registration_mark alone and is global, not scoped to an operator or to a manufacture year: a second POST reusing 'N512NW' with a completely different airframe spec must return 409 ERR_DUPLICATE_REGISTRATION and create nothing, while a different mark carrying the identical spec is accepted."
        test_recipe:
          setup:
            - "Clock at 2026-08-15T00:00:00Z; one 2020 SINGLE_PISTON airframe registered N512NW with hull_new_value_cents 40000000."
          setup_api_calls:
