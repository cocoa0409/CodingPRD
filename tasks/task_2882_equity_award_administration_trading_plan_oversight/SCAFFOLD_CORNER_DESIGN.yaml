            - "the BoardMember + DELEGATED call also returns HTTP 403 with error_id ERR_ROLE_NOT_PERMITTED"
            - "after both refusals Grant.${g_id}.status is still PENDING_APPROVAL and ApprovalAuthority.${a_id}.consumed_shares == 0"
            - "the matching DelegatedOfficer + DELEGATED call returns HTTP 200 with status APPROVED, approved_by_user_id == \"officer-1\" and approved_under_authority_id == \"${a_id}\""
            - "ApprovalAuthority.${a_id}.consumed_shares == 1000 and remaining_shares == 9000 only after the successful call"

      - name: grant_read_is_shared_across_roles_while_creation_is_not
        claim_type: shared_operations
        grounds:
          - endpoints[GET /grants/{id}]
          - endpoints[POST /grants]
          - roles.BoardMember
          - roles.ComplianceOfficer
          - roles.Participant
        distinguishing_aspect: |
          GET /grants/{id} is a shared read: PlanAdministrator, BoardMember, ComplianceOfficer,
          Auditor and the owning Participant all get the identical 200 body, while
          POST /grants is exclusive to PlanAdministrator, so a BoardMember creating a grant is
