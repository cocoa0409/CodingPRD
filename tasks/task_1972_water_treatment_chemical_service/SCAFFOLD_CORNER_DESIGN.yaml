  # ===========================================================================
  # Section: errors
  # ===========================================================================
  - section: errors
    instances:
      - name: error_catalog_triggerability_stubs
        claim_type: violation_to_error
        grounds: ["errors[ERR_PROGRAM_NOT_ACCEPTED]", "errors[ERR_CREDIT_HOLD]", "errors[ERR_ASSET_FROZEN]", "errors[ERR_WINDOW_CONFLICT]", "errors[ERR_COUPON_INTERVAL_CONFLICT]", "errors[ERR_SCHEDULE_IN_PAST]", "errors[ERR_SEGREGATION_OF_DUTIES]"]
        excluded_because:
          difficulty_instance: "state_vs_fiscal_on_delivery_schedule / delivery_schedule_requires_program_accepted / coupon_interval_closed_plus_7day_buffer_adjacency_forbidden / segregation_of_duties_same_user_approve_rejected / schedule_in_past_rejected"
          rationale: "These error codes are asserted as the failure paths of the named §1.8 instances or other §1.9 instances above; no duplicate recipe here."

      - name: error_envelope_shape_on_any_failure
        claim_type: violation_to_error
        grounds: [response_envelope]
        distinguishing_aspect: "Any failure returns response_type=error with data.error_id and data.message keys, plus meta.api_request_id — verified on a 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /wt/products/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: WaterChemist
              captures: { r2_err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_NOT_FOUND and data.message is a non-empty string"
            - "meta.api_request_id present"

  # ===========================================================================
  # Section: rbac
  # ===========================================================================
  - section: rbac
    instances:
      - name: waterchemist_cannot_manage_accounts_or_invoices
        claim_type: role_denial
        grounds: [roles.WaterChemist, "errors[ERR_UNAUTHORIZED_ROLE]"]
        distinguishing_aspect: "WaterChemist is denied AccountManager-exclusive ops: POST /wt/accounts -> 403 ERR_UNAUTHORIZED_ROLE."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /wt/accounts"
              payload: { account_name: "Nope Co" }
              as: WaterChemist
              captures: { b1_err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHORIZED_ROLE"
            - "http status == 403"

      - name: accountmanager_cannot_record_field_data
        claim_type: role_denial
        grounds: [roles.AccountManager, "errors[ERR_UNAUTHORIZED_ROLE]"]
        distinguishing_aspect: "AccountManager is denied WaterChemist-exclusive ops: POST /wt/assets -> 403; POST /wt/program-designs -> 403."
        test_recipe:
          setup: ["account exists"]
          setup_api_calls:
            - call: "POST /wt/accounts"
              payload: { account_name: "RBAC Co" }
              as: AccountManager
              captures: { b2_acct: $.data.id }
          trigger:
            - call: "POST /wt/assets"
              payload: { account_id: "${b2_acct}", asset_tag: "X", asset_type: "BOILER", recirculation_rate_gpm: 100, system_volume_gal: 500, metallurgy: "MILD_STEEL" }
              as: AccountManager
              captures: { b2_err1: $.data.error_id }
            - call: "POST /wt/program-designs"
              payload: { asset_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2" }
              as: AccountManager
              captures: { b2_err2: $.data.error_id }
          assert:
            - "both error_ids == ERR_UNAUTHORIZED_ROLE (role check precedes existence check per priority 2 < 4)"

      - name: platformadmin_exclusive_product_catalog
        claim_type: role_denial
        grounds: [roles.PlatformAdmin]
        distinguishing_aspect: "Only PlatformAdmin can create/delist products: AccountManager POST /wt/products -> 403; PlatformAdmin succeeds; CustomerContact POST /wt/_clock/set_current_utc -> 403."
        test_recipe:
          setup: ["account exists for CustomerContact identity"]
          setup_api_calls:
            - call: "POST /wt/accounts"
              payload: { account_name: "Cat Co" }
              as: AccountManager
              captures: { b3_acct: $.data.id }
          trigger:
            - call: "POST /wt/products"
              payload: { product_code: "B3-1", active_pct: 10, container_size_gal: 55, unit_price_cents_per_gal: 100, contract_price_cents_per_gal: 90 }
              as: AccountManager
              captures: { b3_err1: $.data.error_id }
            - call: "POST /wt/products"
              payload: { product_code: "B3-1", active_pct: 10, container_size_gal: 55, unit_price_cents_per_gal: 100, contract_price_cents_per_gal: 90 }
              as: PlatformAdmin
              captures: { b3_prod: $.data.id }
            - call: "POST /wt/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: CustomerContact
              as_user_id: "${b3_acct}"
              captures: { b3_err2: $.data.error_id }
          assert:
            - "AccountManager create error_id == ERR_UNAUTHORIZED_ROLE"
            - "PlatformAdmin create succeeds: ChemicalProduct.${b3_prod}.status == LISTED"
            - "CustomerContact clock-set error_id == ERR_UNAUTHORIZED_ROLE"

      - name: customer_contact_ownership_scoping
        claim_type: role_denial
        grounds: [roles.CustomerContact, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "CustomerContact with X-User-ID == account A cannot accept a design whose asset belongs to account B -> ERR_FORBIDDEN (403); nor pay B's invoice."
        test_recipe:
          setup: ["accounts A and B; B has asset with design PROPOSED"]
          setup_api_calls:
            - call: "POST /wt/accounts"
              payload: { account_name: "Own A" }
              as: AccountManager
              captures: { b4_a: $.data.id }
            - call: "POST /wt/accounts"
              payload: { account_name: "Own B" }
              as: AccountManager
              captures: { b4_b: $.data.id }
            - call: "POST /wt/assets"
              payload: { account_id: "${b4_b}", asset_tag: "CT-B4", asset_type: "BOILER", recirculation_rate_gpm: 100, system_volume_gal: 500, metallurgy: "MILD_STEEL" }
              as: WaterChemist
              captures: { b4_asset: $.data.id }
            - call: "POST /wt/program-designs"
              payload: { asset_id: "${b4_asset}" }
              as: WaterChemist
              captures: { b4_pd: $.data.id }
            - { call: "POST /wt/program-designs/${b4_pd}/record-survey", payload: { survey_notes: "s" }, as: WaterChemist }
            - { call: "POST /wt/program-designs/${b4_pd}/draft", payload: { proposed_coc: 3.0, inhibitor_target_ppm: 4, ph_min: 7.0, ph_max: 9.5, conductivity_max_umhos: 3000, service_rate_cents_per_month: 0 }, as: WaterChemist }
            - call: "POST /wt/program-designs/${b4_pd}/propose"
              payload: {}
              as: WaterChemist
              captures: { b4_pd_v: $.data.version }
          trigger:
            - call: "POST /wt/program-designs/${b4_pd}/accept"
              payload: { expected_program_design_version: "${b4_pd_v}" }
              as: CustomerContact
              as_user_id: "${b4_a}"
              captures: { b4_err: $.data.error_id }
          assert:
            - "error_id == ERR_FORBIDDEN"
            - "ProgramDesign.${b4_pd}.status == PROPOSED"

      - name: anonymous_missing_headers_rejected
        claim_type: role_denial
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "Request without X-User-ID/X-User-Role -> ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400), the highest-priority check (beats 404 on a bogus path)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /wt/assets/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: ""
              captures: { b5_err: $.data.error_id }
          assert:
            - "error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"
            - "http status == 400"

