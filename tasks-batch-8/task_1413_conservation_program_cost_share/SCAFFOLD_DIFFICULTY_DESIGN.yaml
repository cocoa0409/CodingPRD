            - { call: "POST /eqip/payment-requests", payload: { contract_id: "${con}", practice_item_id: "${item}", documented_cost_cents: 400000, documentation_refs: ["r1"] }, as: Applicant, as_user_id: "${a1}", captures: { req: $.data.id } }
            - { call: "POST /eqip/payment-requests/${req}/review", payload: {}, as: PaymentOfficer, as_user_id: "po-1" }
            - { call: "POST /eqip/payment-requests/${req}/approve", payload: {}, as: PaymentOfficer, as_user_id: "po-1" }
          trigger:
