              as: ProductionAccountant
              captures: { tcB: $.data.id }
            - call: "POST /payroll/timecards/${tcB}/approve"
              payload: {}
              as: PayrollClerk
          trigger:
            - call: "GET /payroll/timecards"
              payload: { engagement_id: "${eng}", limit: 1, offset: 0 }
              as: PayrollClerk
            - call: "GET /payroll/timecards"
