            - {call: "POST /water-rights/${wr}/beneficial-use-records", payload: {use_year: 2025, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}, as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr}/activate", as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr}/hcu-studies", payload: {method: DIVERSION_BASED, study_period_start_year: 2023, study_period_end_year: 2025}, as: WaterRightsAnalyst, captures: {st: "$.data.id"}}
            - {call: "GET /water-rights/${wr}", as: WaterRightsAnalyst, captures: {wr_vc: "$.data.version"}}
            - {call: "POST /hcu-studies/${st}/certify", payload: {expected_water_right_version: "${wr_vc}"}, as: WaterRightsAnalyst, captures: {study_status: "$.data.status"}}
            - {call: "POST /transfer-applications", payload: {water_right_id: "${wr}", hcu_study_id: "${st}", application_type: CHANGE_OF_USE, requested_af: 100.00, proposed_purpose_of_use: MUNICIPAL}, as: WaterRightsAnalyst, captures: {app: "$.data.id"}}
            - {call: "POST /decree-dockets", payload: {basin_code: "SNK", docket_number: "SNK-ADJ-13", claim_filing_deadline: "2026-04-01T00:00:00Z"}, as: BasinAdjudicator, captures: {dk: "$.data.id"}}
            - {call: "GET /water-rights/${wr}", as: WaterRightsAnalyst, captures: {wr_v0: "$.data.version"}}
          trigger:
            - {call: "POST /transfer-applications/${app}/submit", payload: {expected_water_right_version: "${wr_v0}"}, as: WaterRightsAnalyst, captures: {escrow_in_write_response: "$.data.escrowed_af"}}
            - {call: "GET /water-rights/${wr}", as: WaterRightsAnalyst, captures: {transferable_next_read: "$.data.transferable_af"}}
            - {call: "POST /adjudication-claims", payload: {decree_docket_id: "${dk}", water_right_id: "${wr}", claimed_priority_date: "1901-05-01T00:00:00Z", claimed_af: 100.00}, as: BasinAdjudicator, captures: {cm: "$.data.id"}}
            - {call: "GET /decree-dockets/${dk}", as: BasinAdjudicator, captures: {claim_count_after: "$.data.claim_count"}}
          assert:
            - "The certify response itself already reports status CERTIFIED, so no follow-up read is needed to observe a write."
            - "The submit response body already carries escrowed_af 100.00 and status SUBMITTED."
            - "The immediately following GET on the parent right returns transferable_af 95.00, encumbered_af 100.00 and status ENCUMBERED with no retry and no delay — the parent's derived buckets are updated inside the same transaction as the child write."
            - "The docket read taken immediately after the claim creation returns claim_count 1 and total_decreed_af 0.00; a lagging denormalized counter is a failure."
            - "Repeating either GET returns byte-identical data (apart from meta.api_request_id and meta.api_request_timestamp), so reads are stable and never converge over time."

      - name: consistency_immediate_cascade_effects_are_visible_to_the_very_next_call
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - state_machines.TransferApplication
          - state_machines.InjuryAnalysis
        distinguishing_aspect: >-
          Even a multi-hop cascade settles synchronously: the response to the protest
          resolution is only the Protest, yet by the very next call the application has
          already been bubbled to READY_FOR_DECISION and its analysis has already been
          FINALIZED with the offset folded in. There is no intermediate observable state
          in which the counter has dropped but the parent has not moved.
        test_recipe:
          setup:
            - "Clock 2026-03-01T00:00:00Z; claimant A's certified right with a published 100.00 AF application (gross 78.00) and claimant B's 8.00 AF protest routed to NEGOTIATION."
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-03-01T00:00:00Z"}, as: WaterRightsAnalyst}
            - {call: "POST /claimants", payload: {legal_name: "Vega Ditch Company", contact_email: "ops@vega.example", entity_type: IRRIGATION_DISTRICT}, as: WaterRightsAnalyst, captures: {cl_a: "$.data.id"}}
            - {call: "POST /claimants", payload: {legal_name: "Bell Cattle Trust", contact_email: "b@bell.example", entity_type: INDIVIDUAL}, as: WaterRightsAnalyst, captures: {cl_b: "$.data.id"}}
            - {call: "POST /water-rights", payload: {claimant_id: "${cl_a}", right_number: "WR-2198-001", priority_date: "1901-05-01T00:00:00Z", source_stream_code: "SNK-14", purpose_of_use: IRRIGATION, place_of_use_acres: 120.00, authorized_diversion_af: 400.00, authorized_rate_cfs: 5.000}, as: WaterRightsAnalyst, captures: {wr: "$.data.id"}}
            - {call: "POST /water-rights/${wr}/beneficial-use-records", payload: {use_year: 2023, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}, as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr}/beneficial-use-records", payload: {use_year: 2024, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}, as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr}/beneficial-use-records", payload: {use_year: 2025, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}, as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr}/activate", as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr}/hcu-studies", payload: {method: DIVERSION_BASED, study_period_start_year: 2023, study_period_end_year: 2025}, as: WaterRightsAnalyst, captures: {st: "$.data.id"}}
            - {call: "GET /water-rights/${wr}", as: WaterRightsAnalyst, captures: {wr_vc: "$.data.version"}}
            - {call: "POST /hcu-studies/${st}/certify", payload: {expected_water_right_version: "${wr_vc}"}, as: WaterRightsAnalyst}
            - {call: "POST /transfer-applications", payload: {water_right_id: "${wr}", hcu_study_id: "${st}", application_type: CHANGE_OF_USE, requested_af: 100.00, proposed_purpose_of_use: MUNICIPAL}, as: WaterRightsAnalyst, captures: {app: "$.data.id"}}
            - {call: "POST /transfer-applications/${app}/injury-analyses", payload: {method: SEASONAL_AVERAGE, pod_move_miles: 0.00}, as: WaterRightsAnalyst, captures: {ia: "$.data.id"}}
            - {call: "GET /water-rights/${wr}", as: WaterRightsAnalyst, captures: {wr_vs: "$.data.version"}}
            - {call: "POST /transfer-applications/${app}/submit", payload: {expected_water_right_version: "${wr_vs}"}, as: WaterRightsAnalyst}
            - {call: "POST /transfer-applications/${app}/publish", as: WaterRightsAnalyst}
            - {call: "POST /protests", payload: {transfer_application_id: "${app}", protestant_claimant_id: "${cl_b}", claimed_injury_af: 8.00, basis: INJURY_TO_SENIOR_RIGHT}, as: Claimant, as_user_id: "${cl_b}", captures: {pr: "$.data.id"}}
            - {call: "POST /protests/${pr}/route", payload: {track: NEGOTIATION}, as: HearingOfficer, as_user_id: "u-202"}
          trigger:
            - {call: "POST /protests/${pr}/resolve", payload: {outcome: STIPULATE, resolution_note: "Stipulated to an 8.00 AF offset.", stipulated_offset_af: 8.00}, as: HearingOfficer, as_user_id: "u-202", captures: {protest_status: "$.data.status"}}
            - {call: "GET /transfer-applications/${app}", as: WaterRightsAnalyst, captures: {app_status: "$.data.status"}}
            - {call: "GET /transfer-applications/${app}/injury-analyses", as: WaterRightsAnalyst, captures: {net_after: "$.data[0].net_injury_af"}}
          assert:
            - "The resolve response is the Protest: status RESOLVED_STIPULATED with stipulated_offset_af 8.00."
            - "The very next read of the application already shows unresolved_protest_count 0 and status READY_FOR_DECISION — the UNDER_PROTEST -> READY_FOR_DECISION bubble-up is part of the same request."
            - "The very next read of the analysis already shows status FINALIZED, offset_af 8.00 and net_injury_af 70.00 (78.00 - 8.00), all rounded to 2 decimal places."
            - "No intermediate state is ever observable: there is no read in which unresolved_protest_count is 0 while the application is still UNDER_PROTEST, or in which the analysis is still DRAFT after its parent left the protest phase."
