              captures: { e_community: $.data.error_id }
            - call: "GET /flood-zone/lenders/99999999-9999-4999-8999-999999999999"
              as: ProviderAnalyst
              captures: { e_lender: $.data.error_id }
            - call: "GET /flood-zone/map-panels/99999999-9999-4999-8999-999999999999"
