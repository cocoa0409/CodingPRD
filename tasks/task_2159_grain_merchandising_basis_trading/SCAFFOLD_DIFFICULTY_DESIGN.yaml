              captures: { locked_error: $.data.error_id }
          assert:
            - "hop 1: MarginCall.${call1_id}.call_amount_usd == 10400.00 and status == OPEN"
            - "hop 2: TradingDesk.${desk_id}.open_margin_call_usd == 10400.00"
            - "hop 2: TradingDesk.${desk_id}.available_credit_usd == -1000.00"
            - "hop 3: TradingDesk.${desk_id}.credit_utilization == 1.0625"
            - "hop 3: TradingDesk.${desk_id}.posture == FROZEN"
            - "hop 4: PurchaseContract.${c1_id}.pricing_locked == true"
            - "the BASIS pricing order returns HTTP 409 with error_id ERR_PRICING_LOCKED"
            - "HedgePosition.${hp1_id}.status == MARGIN_CALL"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_apply_to_cancelled_contract
        grounds:
          - validations[priority=9]
          - validations[priority=36]
          - errors[ERR_CONTRACT_NOT_ACTIVE]
          - errors[ERR_BUSHELS_EXCEEDED]
        distinguishing_aspect: |
          Error-category pair {state, business_fiscal}: one apply request violates BOTH the
          priority-9 state rule (contract is CANCELLED) and the priority-36 fiscal rule
          (15000.00 net bushels against a 10000 bushel contract). The priority-9 row wins, so
          the response is ERR_CONTRACT_NOT_ACTIVE (409), never ERR_BUSHELS_EXCEEDED (422).
        test_recipe:
          setup:
            - "Desk, elevator, ACTIVE CORN discount schedule, SHORT 2026-12 hedge with 10 lots at 448, ACTIVE basis -32 bid."
            - "One FULLY_PRICED 10,000-bushel CASH contract, graded ticket for 15,000 net bushels still GRADED, and the contract then cancelled by a RiskOfficer whose user id differs from the contract's creator."
          setup_api_calls:
            - call: "POST /grain/trading-desks"
              payload: { desk_code: "GD11", name: "Ladder A Desk", credit_line_usd: 5000000.00 }
              as: DeskAdmin
              as_user_id: "u-admin-1"
              captures: { desk_id: $.data.id }
            - call: "POST /grain/elevator-locations"
              payload: { desk_id: "${desk_id}", location_code: "ELV1", name: "Morris Elevator", intake_capacity_bushels: 5000000, rail_served: true }
              as: DeskAdmin
              as_user_id: "u-admin-1"
              captures: { loc1_id: $.data.id }
            - call: "POST /grain/discount-schedules"
              payload: { commodity_code: "CORN", effective_from: "2026-07-01T00:00:00Z", moisture_standard_pct: 15.0, shrink_factor_pct_per_point: 1.18, tiers: [ { factor: "MOISTURE", direction: "ABOVE", threshold_value: 15.0, unit_step: 0.5, rate_cents_per_bushel_per_step: 2.5 }, { factor: "TEST_WEIGHT", direction: "BELOW", threshold_value: 54.0, unit_step: 1.0, rate_cents_per_bushel_per_step: 3.5 }, { factor: "FOREIGN_MATERIAL", direction: "ABOVE", threshold_value: 3.0, unit_step: 0.5, rate_cents_per_bushel_per_step: 1.5 }, { factor: "DAMAGE", direction: "ABOVE", threshold_value: 5.0, unit_step: 1.0, rate_cents_per_bushel_per_step: 4.0 } ] }
              as: DeskAdmin
              as_user_id: "u-admin-1"
              captures: { sch1_id: $.data.id }
            - call: "POST /grain/discount-schedules/${sch1_id}/activate"
              payload: {}
              as: DeskAdmin
              as_user_id: "u-admin-1"
            - call: "POST /grain/hedge-positions"
              payload: { desk_id: "${desk_id}", commodity_code: "CORN", futures_month: "2026-12", side: "SHORT", lots_open: 10, avg_entry_price_cents: 448 }
              as: FuturesTrader
              as_user_id: "u-trader-1"
              captures: { hp1_id: $.data.id }
            - call: "POST /grain/bids"
              payload: { location_id: "${loc1_id}", commodity_code: "CORN", futures_month: "2026-12", delivery_period_start: "2026-10-01", delivery_period_end: "2026-12-31", basis_cents: -32, max_bushels: 1000000, expires_at: "2027-01-15T00:00:00Z" }
              as: Merchandiser
              as_user_id: "u-merch-1"
              captures: { bid1_id: $.data.id }
            - call: "POST /grain/bids/${bid1_id}/activate"
              payload: {}
              as: Merchandiser
              as_user_id: "u-merch-1"
            - call: "POST /grain/purchase-contracts"
              payload: { bid_id: "${bid1_id}", hedge_position_id: "${hp1_id}", contract_type: "CASH", bushels: 10000, seller_name: "Bell Farms", delivery_start: "2026-11-01", delivery_end: "2026-11-30", futures_price_cents: 448 }
              as: Merchandiser
              as_user_id: "u-merch-1"
              captures: { c1_id: $.data.id }
            - call: "POST /grain/delivery-tickets"
              payload: { contract_id: "${c1_id}", location_id: "${loc1_id}", gross_bushels: 15000, moisture_pct: 15.0, test_weight_lbs: 56.0, foreign_material_pct: 2.0, damage_pct: 0.0 }
              as: GrainInspector
              as_user_id: "u-insp-1"
              captures: { tkt_id: $.data.id }
            - call: "POST /grain/purchase-contracts/${c1_id}/cancel"
              payload: { damages_method: "MARKET_LOSS", cancellation_reason: "producer walked" }
              as: RiskOfficer
              as_user_id: "u-risk-1"
          trigger:
            - call: "POST /grain/delivery-tickets/${tkt_id}/apply"
              payload: {}
              as: Merchandiser
              as_user_id: "u-merch-1"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_CONTRACT_NOT_ACTIVE"
            - "the response status is 409, not 422"
            - "${err} != ERR_BUSHELS_EXCEEDED"
            - "DeliveryTicket.${tkt_id}.status == GRADED"
            - "PurchaseContract.${c1_id}.delivered_bushels == 0.00"

      - name: referential_beats_constraint_on_ticket_location_mismatch
        grounds:
          - validations[priority=15]
          - validations[priority=29]
          - errors[ERR_LOCATION_MISMATCH]
          - errors[ERR_NO_ACTIVE_DISCOUNT_SCHEDULE]
        distinguishing_aspect: |
          Error-category pair {business_referential, business_constraint} — a different pair from
          the {state, business_fiscal} instance. One grading request violates the priority-15
          referential rule (ticket location is elevator 2, contract sits at elevator 1) and the
          priority-29 constraint rule (no ACTIVE CORN discount schedule exists at all); the
          response is ERR_LOCATION_MISMATCH (422), never ERR_NO_ACTIVE_DISCOUNT_SCHEDULE.
        test_recipe:
          setup:
            - "Desk with two elevators and NO discount schedule of any status."
            - "SHORT 2026-12 hedge with 10 lots at 448 and an ACTIVE basis -32 bid at elevator 1."
            - "One FULLY_PRICED 10,000-bushel CASH contract at elevator 1."
          setup_api_calls:
            - call: "POST /grain/trading-desks"
              payload: { desk_code: "GD12", name: "Ladder B Desk", credit_line_usd: 5000000.00 }
              as: DeskAdmin
              as_user_id: "u-admin-1"
              captures: { desk_id: $.data.id }
            - call: "POST /grain/elevator-locations"
              payload: { desk_id: "${desk_id}", location_code: "ELV1", name: "Morris Elevator", intake_capacity_bushels: 5000000, rail_served: true }
              as: DeskAdmin
              as_user_id: "u-admin-1"
              captures: { loc1_id: $.data.id }
            - call: "POST /grain/elevator-locations"
              payload: { desk_id: "${desk_id}", location_code: "ELV2", name: "Seneca Elevator", intake_capacity_bushels: 5000000, rail_served: false }
              as: DeskAdmin
              as_user_id: "u-admin-1"
              captures: { loc2_id: $.data.id }
            - call: "POST /grain/hedge-positions"
              payload: { desk_id: "${desk_id}", commodity_code: "CORN", futures_month: "2026-12", side: "SHORT", lots_open: 10, avg_entry_price_cents: 448 }
              as: FuturesTrader
              as_user_id: "u-trader-1"
              captures: { hp1_id: $.data.id }
            - call: "POST /grain/bids"
              payload: { location_id: "${loc1_id}", commodity_code: "CORN", futures_month: "2026-12", delivery_period_start: "2026-10-01", delivery_period_end: "2026-12-31", basis_cents: -32, max_bushels: 1000000, expires_at: "2027-01-15T00:00:00Z" }
              as: Merchandiser
              as_user_id: "u-merch-1"
              captures: { bid1_id: $.data.id }
            - call: "POST /grain/bids/${bid1_id}/activate"
              payload: {}
              as: Merchandiser
              as_user_id: "u-merch-1"
            - call: "POST /grain/purchase-contracts"
              payload: { bid_id: "${bid1_id}", hedge_position_id: "${hp1_id}", contract_type: "CASH", bushels: 10000, seller_name: "Bell Farms", delivery_start: "2026-11-01", delivery_end: "2026-11-30", futures_price_cents: 448 }
              as: Merchandiser
              as_user_id: "u-merch-1"
              captures: { c1_id: $.data.id }
          trigger:
            - call: "POST /grain/delivery-tickets"
              payload: { contract_id: "${c1_id}", location_id: "${loc2_id}", gross_bushels: 5000, moisture_pct: 15.0, test_weight_lbs: 56.0, foreign_material_pct: 2.0, damage_pct: 0.0 }
              as: GrainInspector
              as_user_id: "u-insp-1"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_LOCATION_MISMATCH"
            - "the response status is 422"
            - "${err} != ERR_NO_ACTIVE_DISCOUNT_SCHEDULE"
            - "no DeliveryTicket row exists for PurchaseContract.${c1_id}"

      - name: temporal_beats_fiscal_on_expired_margin_call_cure
        grounds:
          - validations[priority=19]
          - validations[priority=37]
          - errors[ERR_MARGIN_CALL_EXPIRED]
          - errors[ERR_CURE_AMOUNT_INSUFFICIENT]
        distinguishing_aspect: |
          Error-category pair {business_temporal, business_fiscal} — distinct from both the
          {state, business_fiscal} and the {business_referential, business_constraint} pairs.
          One cure request is both one second late (priority 19) and 10300.00 USD short
          (priority 37); the response is ERR_MARGIN_CALL_EXPIRED, never
          ERR_CURE_AMOUNT_INSUFFICIENT.
        test_recipe:
          setup:
            - "Logical clock advanced to 2026-08-05T00:00:00Z, then a 4-lot SHORT CORN position marked to 500 cents, producing an OPEN MarginCall for 10400.00 with cure_deadline_at 2026-08-06T00:00:00Z."
            - "Logical clock then advanced to 2026-08-06T00:00:01Z, one second past the deadline."
          setup_api_calls:
            - call: "POST /grain/trading-desks"
              payload: { desk_code: "GD13", name: "Ladder C Desk", credit_line_usd: 5000000.00 }
              as: DeskAdmin
              as_user_id: "u-admin-1"
              captures: { desk_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: DeskAdmin
              as_user_id: "u-admin-1"
            - call: "POST /grain/hedge-positions"
              payload: { desk_id: "${desk_id}", commodity_code: "CORN", futures_month: "2026-12", side: "SHORT", lots_open: 4, avg_entry_price_cents: 448 }
              as: FuturesTrader
              as_user_id: "u-trader-1"
              captures: { hp1_id: $.data.id }
            - call: "POST /grain/hedge-positions/${hp1_id}/mark-to-market"
              payload: { settlement_price_cents: 500 }
              as: FuturesTrader
              as_user_id: "u-trader-1"
            - call: "GET /grain/margin-calls?hedge_position_id=${hp1_id}&status=OPEN"
              payload: {}
              as: RiskOfficer
              as_user_id: "u-risk-1"
              captures: { call1_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-06T00:00:01Z" }
              as: DeskAdmin
              as_user_id: "u-admin-1"
          trigger:
            - call: "POST /grain/margin-calls/${call1_id}/cure"
              payload: { payment_usd: 100.00 }
              as: RiskOfficer
              as_user_id: "u-risk-1"
              captures: { err: $.data.error_id }
          assert:
            - "MarginCall.${call1_id}.cure_deadline_at == 2026-08-06T00:00:00.000Z"
            - "${err} == ERR_MARGIN_CALL_EXPIRED"
            - "${err} != ERR_CURE_AMOUNT_INSUFFICIENT"
            - "MarginCall.${call1_id}.status == OPEN"
            - "MarginCall.${call1_id}.cured_amount_usd == 0"
            - "HedgePosition.${hp1_id}.status == MARGIN_CALL"

  - rule_id: boundary_precision_check
    instances:
      - name: moisture_exactly_at_standard_yields_no_shrink
        grounds:
          - calculations.delivery_net_bushels
          - entities.DeliveryTicket.fields.shrink_pct
          - entities.DiscountSchedule.fields.moisture_standard_pct
        distinguishing_aspect: |
          Boundary metric 1 — a strictly-greater-than threshold on the moisture percentage,
          reached through POST /grain/delivery-tickets. At exactly 15.0 the shrink is 0 and
          net_bushels equals gross_bushels (10000.00); at 15.1 the shrink is 0.118 percent and
          net_bushels is 9988.20.
