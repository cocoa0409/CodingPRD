  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: fit_result_state_beats_clearance_safety
        grounds:
          - validations[priority=6]
          - validations[priority=8]
          - errors[ERR_FIT_TEST_NOT_RECORDABLE]
          - errors[ERR_MEDICAL_CLEARANCE_NOT_CURRENT]
        distinguishing_aspect: |
          Error-category pair state-vs-business_safety: the fit test is already FAILED (state)
          AND its linked clearance has expired (safety). State (priority 6) is reported first:
          ERR_FIT_TEST_NOT_RECORDABLE, not ERR_MEDICAL_CLEARANCE_NOT_CURRENT.
        test_recipe:
          setup:
            - "Employee E1; clearance CLEARED at 2026-08-01 (expiry 2027-08-01); fit test recorded FAIL while clearance current; clock then advanced to 2027-08-02 so the clearance sweeps to EXPIRED"
          setup_api_calls:
            - { call: "POST /ih/sites", payload: { name: "Apex Coating", industry_code: "332812" }, as: FirmAdmin, captures: { site: $.data.id } }
            - { call: "POST /ih/employees", payload: { site_id: "${site}", full_name: "E One", external_ref: "E1", job_title: "Painter" }, as: FirmAdmin, captures: { e1: $.data.id } }
            - { call: "POST /ih/medical-clearances", payload: { employee_id: "${e1}" }, as: SiteSafetyManager, as_user_id: u_ssm_1, captures: { clr: $.data.id } }
            - { call: "POST /ih/medical-clearances/${clr}/decide", payload: { decision: "CLEARED" }, as: CIHDirector, as_user_id: u_cih_1 }
            - { call: "POST /ih/fit-tests", payload: { employee_id: "${e1}", medical_clearance_id: "${clr}", respirator_model: "3M-6800", test_date: "2026-08-03" }, as: SiteSafetyManager, as_user_id: u_ssm_1, captures: { ft: $.data.id } }
            - { call: "POST /ih/fit-tests/${ft}/record-result", payload: { result: "FAIL" }, as: FieldTechnician, as_user_id: u_tech_1 }
            - { call: "POST /ih/_clock/set_current_utc", payload: { to_iso8601: "2027-08-02T00:00:00Z" }, as: FirmAdmin, as_user_id: u_admin }
          trigger:
            - { call: "POST /ih/fit-tests/${ft}/record-result", payload: { result: "PASS" }, as: FieldTechnician, as_user_id: u_tech_1, captures: { err: $.data.error_id } }
          assert:
            - "trigger response http == 409 and error_id == ERR_FIT_TEST_NOT_RECORDABLE"
            - "The safety violation (clearance EXPIRED after 2027-08-01) is masked by the higher-priority state error"
            - "MedicalClearance.${clr}.status == EXPIRED and RespiratorFitTest.${ft}.status == FAILED (no side effects fired)"

      - name: sample_create_existence_beats_plan_state
        grounds:
          - validations[priority=4]
          - validations[priority=6]
          - errors[ERR_NOT_FOUND]
          - errors[ERR_PLAN_NOT_OPEN_FOR_SAMPLING]
        distinguishing_aspect: |
          Error-category pair existence-vs-state: the referenced pump does not exist (existence)
          AND the plan is DRAFT so sampling is closed (state). Existence (priority 4) is reported
          first: ERR_NOT_FOUND 404, not ERR_PLAN_NOT_OPEN_FOR_SAMPLING 409.
        test_recipe:
          setup:
            - "SEG H=1 with member E1; plan in DRAFT (never submitted); real pump P1 with calibration C1 exists but the request names a nonexistent pump id"
          setup_api_calls:
            - { call: "POST /ih/sites", payload: { name: "Apex Coating", industry_code: "332812" }, as: FirmAdmin, captures: { site: $.data.id } }
            - { call: "POST /ih/exposure-limits", payload: { analyte_code: "PB", basis: "OSHA_PEL", limit_type: "TWA8", limit_mg_m3: 0.05 }, as: FirmAdmin, captures: { lim: $.data.id } }
            - { call: "POST /ih/segs", payload: { site_id: "${site}", name: "Painters", analyte_code: "PB", exposure_limit_id: "${lim}", task_description: "spray line" }, as: IndustrialHygienist, as_user_id: u_ih_1, captures: { seg: $.data.id } }
            - { call: "POST /ih/employees", payload: { site_id: "${site}", full_name: "E One", external_ref: "E1", job_title: "Painter" }, as: FirmAdmin, captures: { e1: $.data.id } }
            - { call: "POST /ih/seg-memberships", payload: { seg_id: "${seg}", employee_id: "${e1}" }, as: IndustrialHygienist, as_user_id: u_ih_1 }
            - { call: "POST /ih/sampling-plans", payload: { seg_id: "${seg}", purpose: "INITIAL", planned_start_date: "2026-08-03", planned_end_date: "2026-08-14" }, as: IndustrialHygienist, as_user_id: u_ih_1, captures: { plan: $.data.id } }
            - { call: "POST /ih/pumps", payload: { site_id: "${site}", serial_number: "P-001" }, as: FirmAdmin, captures: { p1: $.data.id } }
            - { call: "POST /ih/pump-calibrations", payload: { pump_id: "${p1}", pre_flow_lpm: 2.0 }, as: FieldTechnician, as_user_id: u_tech_1, captures: { c1: $.data.id } }
          trigger:
            - { call: "POST /ih/field-samples", payload: { sampling_plan_id: "${plan}", sample_type: "PERSONAL", employee_id: "${e1}", pump_id: "11111111-1111-1111-1111-111111111111", pre_calibration_id: "${c1}", collection_date: "2026-08-03", start_minute: 480, duration_minutes: 240 }, as: FieldTechnician, as_user_id: u_tech_1, captures: { err: $.data.error_id } }
          assert:
            - "trigger response http == 404 and error_id == ERR_NOT_FOUND"
            - "The DRAFT plan's state violation (ERR_PLAN_NOT_OPEN_FOR_SAMPLING) is never evaluated because existence precedes state"

      - name: sample_create_referential_beats_temporal
        grounds:
          - validations[priority=7]
          - validations[priority=9]
          - errors[ERR_EMPLOYEE_NOT_SEG_MEMBER]
          - errors[ERR_SAMPLE_OUTSIDE_PLAN_WINDOW]
        distinguishing_aspect: |
          Error-category pair business_referential-vs-business_temporal: the employee is not a
          SEG member (referential) AND the collection date is outside the plan window (temporal).
          Referential (priority 7) is reported first: ERR_EMPLOYEE_NOT_SEG_MEMBER 422.
        test_recipe:
          setup:
            - "SEG with member E1; APPROVED plan with window 2026-08-03..2026-08-14; E2 exists at the site but holds no membership; pump P1 + calibration C1 ready"
          setup_api_calls:
            - { call: "POST /ih/sites", payload: { name: "Apex Coating", industry_code: "332812" }, as: FirmAdmin, captures: { site: $.data.id } }
            - { call: "POST /ih/exposure-limits", payload: { analyte_code: "PB", basis: "OSHA_PEL", limit_type: "TWA8", limit_mg_m3: 0.05 }, as: FirmAdmin, captures: { lim: $.data.id } }
            - { call: "POST /ih/segs", payload: { site_id: "${site}", name: "Painters", analyte_code: "PB", exposure_limit_id: "${lim}", task_description: "spray line" }, as: IndustrialHygienist, as_user_id: u_ih_1, captures: { seg: $.data.id } }
            - { call: "POST /ih/employees", payload: { site_id: "${site}", full_name: "E One", external_ref: "E1", job_title: "Painter" }, as: FirmAdmin, captures: { e1: $.data.id } }
            - { call: "POST /ih/employees", payload: { site_id: "${site}", full_name: "E Two", external_ref: "E2", job_title: "Helper" }, as: FirmAdmin, captures: { e2: $.data.id } }
            - { call: "POST /ih/seg-memberships", payload: { seg_id: "${seg}", employee_id: "${e1}" }, as: IndustrialHygienist, as_user_id: u_ih_1 }
            - { call: "POST /ih/sampling-plans", payload: { seg_id: "${seg}", purpose: "INITIAL", planned_start_date: "2026-08-03", planned_end_date: "2026-08-14" }, as: IndustrialHygienist, as_user_id: u_ih_1, captures: { plan: $.data.id } }
            - { call: "POST /ih/sampling-plans/${plan}/submit", payload: {}, as: IndustrialHygienist, as_user_id: u_ih_1 }
            - { call: "POST /ih/sampling-plans/${plan}/approve", payload: {}, as: CIHDirector, as_user_id: u_cih_1 }
            - { call: "POST /ih/pumps", payload: { site_id: "${site}", serial_number: "P-001" }, as: FirmAdmin, captures: { p1: $.data.id } }
            - { call: "POST /ih/pump-calibrations", payload: { pump_id: "${p1}", pre_flow_lpm: 2.0 }, as: FieldTechnician, as_user_id: u_tech_1, captures: { c1: $.data.id } }
          trigger:
            - { call: "POST /ih/field-samples", payload: { sampling_plan_id: "${plan}", sample_type: "PERSONAL", employee_id: "${e2}", pump_id: "${p1}", pre_calibration_id: "${c1}", collection_date: "2026-08-20", start_minute: 480, duration_minutes: 240 }, as: FieldTechnician, as_user_id: u_tech_1, captures: { err: $.data.error_id } }
          assert:
            - "trigger response http == 422 and error_id == ERR_EMPLOYEE_NOT_SEG_MEMBER"
            - "The temporal violation (2026-08-20 outside the plan window) is masked by the higher-priority referential error"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: drift_exactly_five_percent_stays_valid
        grounds:
          - calculations.pump_drift
          - state_machines.PumpCalibration
        distinguishing_aspect: |
          Metric = drift percentage on the record-post endpoint: drift is INVALID iff strictly
          > 5.00. pre 2.000 -> post 2.100 gives exactly 5.00 (VALID); post 2.101 gives 5.05
          (INVALID). The equality side is the trap.
        test_recipe:
          setup: ["Site with two pumps; each with a PENDING calibration at pre_flow 2.000"]
          setup_api_calls:
            - { call: "POST /ih/sites", payload: { name: "Apex Coating", industry_code: "332812" }, as: FirmAdmin, captures: { site: $.data.id } }
            - { call: "POST /ih/pumps", payload: { site_id: "${site}", serial_number: "P-001" }, as: FirmAdmin, captures: { p1: $.data.id } }
            - { call: "POST /ih/pumps", payload: { site_id: "${site}", serial_number: "P-002" }, as: FirmAdmin, captures: { p2: $.data.id } }
            - { call: "POST /ih/pump-calibrations", payload: { pump_id: "${p1}", pre_flow_lpm: 2.0 }, as: FieldTechnician, as_user_id: u_tech_1, captures: { c1: $.data.id } }
            - { call: "POST /ih/pump-calibrations", payload: { pump_id: "${p2}", pre_flow_lpm: 2.0 }, as: FieldTechnician, as_user_id: u_tech_1, captures: { c2: $.data.id } }
          trigger:
            - { call: "POST /ih/pump-calibrations/${c1}/record-post", payload: { post_flow_lpm: 2.1 }, as: FieldTechnician, as_user_id: u_tech_1 }
            - { call: "POST /ih/pump-calibrations/${c2}/record-post", payload: { post_flow_lpm: 2.101 }, as: FieldTechnician, as_user_id: u_tech_1 }
          assert:
            - "PumpCalibration.${c1}.drift_pct == 5.0 and result == VALID (equality is not a violation)"
            - "PumpCalibration.${c2}.drift_pct == 5.05 and result == INVALID (strictly greater than 5.00)"

      - name: valid_count_exactly_required_passes
        grounds:
          - calculations.plan_sample_accounting
          - state_machines.SamplingPlan.APPROVED_to_FIELD_COMPLETE
          - errors[ERR_INSUFFICIENT_VALID_SAMPLES]
        distinguishing_aspect: |
          Metric = active sample count vs required threshold on complete-field (a count
          boundary, distinct from the drift ratio): exactly 3 >= 3 succeeds on plan A, while
          2 >= 3 fails on plan B with ERR_INSUFFICIENT_VALID_SAMPLES.
        test_recipe:
          setup:
            - "SEG H=3 (required 3); plan A APPROVED with exactly 3 PERSONAL samples; plan B APPROVED with exactly 2"
          setup_api_calls:
            - { call: "POST /ih/sites", payload: { name: "Apex Coating", industry_code: "332812" }, as: FirmAdmin, captures: { site: $.data.id } }
            - { call: "POST /ih/exposure-limits", payload: { analyte_code: "PB", basis: "OSHA_PEL", limit_type: "TWA8", limit_mg_m3: 0.05 }, as: FirmAdmin, captures: { lim: $.data.id } }
            - { call: "POST /ih/segs", payload: { site_id: "${site}", name: "Painters", analyte_code: "PB", exposure_limit_id: "${lim}", task_description: "spray line" }, as: IndustrialHygienist, as_user_id: u_ih_1, captures: { seg: $.data.id } }
            - { call: "POST /ih/employees", payload: { site_id: "${site}", full_name: "E One", external_ref: "E1", job_title: "Painter" }, as: FirmAdmin, captures: { e1: $.data.id } }
            - { call: "POST /ih/employees", payload: { site_id: "${site}", full_name: "E Two", external_ref: "E2", job_title: "Painter" }, as: FirmAdmin, captures: { e2: $.data.id } }
            - { call: "POST /ih/employees", payload: { site_id: "${site}", full_name: "E Three", external_ref: "E3", job_title: "Painter" }, as: FirmAdmin, captures: { e3: $.data.id } }
            - { call: "POST /ih/seg-memberships", payload: { seg_id: "${seg}", employee_id: "${e1}" }, as: IndustrialHygienist, as_user_id: u_ih_1 }
            - { call: "POST /ih/seg-memberships", payload: { seg_id: "${seg}", employee_id: "${e2}" }, as: IndustrialHygienist, as_user_id: u_ih_1 }
            - { call: "POST /ih/seg-memberships", payload: { seg_id: "${seg}", employee_id: "${e3}" }, as: IndustrialHygienist, as_user_id: u_ih_1 }
            - { call: "POST /ih/sampling-plans", payload: { seg_id: "${seg}", purpose: "INITIAL", planned_start_date: "2026-08-03", planned_end_date: "2026-08-14" }, as: IndustrialHygienist, as_user_id: u_ih_1, captures: { planA: $.data.id } }
