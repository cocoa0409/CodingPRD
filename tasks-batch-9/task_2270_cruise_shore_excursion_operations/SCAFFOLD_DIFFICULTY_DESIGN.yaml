          setup:
            - "Cozumel is an ALONGSIDE port."
            - "One operator has two clean audits — 2026-06-01 raw 64 and 2026-07-01 raw 66 — weighting to 65.25, which rounds to 65 and clears the floor, so it is APPROVED."
