              as_user_id: "${contrib_j}"
            - call: "POST /freelance-desk/assignments/${asg_j}/expense-claims"
              payload: { category: "TRAVEL", requested_cents: 3200 }
              as: Contributor
              as_user_id: "${contrib_j}"
              captures: { exp_j: $.data.id }
            - call: "POST /freelance-desk/expense-claims/${exp_j}/decide"
              payload: { decision: "APPROVE" }
              as: Editor
            - call: "POST /freelance-desk/expense-claims/${exp_j}/submit"
              payload: { claimed_cents: 3200, receipt_attached: true }
              as: Contributor
              as_user_id: "${contrib_j}"
            - call: "POST /freelance-desk/assignments/${asg_j}/start"
              payload: {}
              as: Contributor
              as_user_id: "${contrib_j}"
            - call: "POST /freelance-desk/assignments/${asg_j}/submit"
              payload: {}
              as: Contributor
              as_user_id: "${contrib_j}"
            - call: "GET /freelance-desk/assignments/${asg_j}/verification-reports"
              payload: {}
              as: VerificationEditor
              captures: { rep_j1: "$.data[0].id", rep_j2: "$.data[1].id" }
            - call: "POST /freelance-desk/verification-reports/${rep_j1}/record-result"
              payload: { similarity_score_bps: 100, ai_probability_bps: 0 }
              as: VerificationEditor
              as_user_id: "ve-1"
            - call: "POST /freelance-desk/verification-reports/${rep_j2}/record-result"
              payload: { similarity_score_bps: 0, ai_probability_bps: 100 }
              as: VerificationEditor
              as_user_id: "ve-1"
            - call: "POST /freelance-desk/expense-claims/${exp_j}/settle-decision"
              payload: { decision: "REIMBURSE" }
