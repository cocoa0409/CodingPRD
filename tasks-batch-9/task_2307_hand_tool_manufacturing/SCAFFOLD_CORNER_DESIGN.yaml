  - section: validations
    instances:

      - name: reading_count_must_equal_specimen_count
        claim_type: violation_to_error
        grounds:
          - validations[priority=330]
          - errors[ERR_READING_COUNT_MISMATCH]
        distinguishing_aspect: "readings is checked against the TestRun's own specimen_count, not against any lot-level number: three readings on a two-specimen run is refused, an empty array is refused, and the correct arity then succeeds on the same run."
        test_recipe:
          setup:
            - "One BRANDED WRENCH SKU, one CR_MO furnace, one lot advanced to HEAT_TREATED, one SCHEDULED HARDNESS run with specimen_count 2."
          setup_api_calls:
            - call: "POST /toolworks/tool-skus"
              payload: { sku_code: "WR-17-BR", tool_family: "WRENCH", channel: "BRANDED", nominal_size_mm: 17, alloy_grade: "CR_MO", list_price_cents: 3300, warranty_tier: "LIFETIME" }
              as: ChannelManager
              captures: { sku_id: $.data.id }
            - call: "POST /toolworks/heat-treat-furnaces"
              payload: { furnace_code: "FCE-1", max_charge_kg: 900, alloy_grades_supported: ["CR_MO"] }
              as: ProductionPlanner
              captures: { furnace_id: $.data.id }
            - call: "POST /toolworks/production-lots"
              payload: { sku_id: "${sku_id}", lot_code: "LOT-A", unit_count: 500, specimen_pool_total: 20 }
              as: ProductionPlanner
              captures: { lot_id: $.data.id }
            - call: "POST /toolworks/furnace-campaigns"
              payload: { lot_id: "${lot_id}", furnace_id: "${furnace_id}", window_start: "2026-08-02T06:00:00Z", window_end: "2026-08-02T10:00:00Z", charge_kg: 800 }
              as: ProductionPlanner
              captures: { camp_id: $.data.id }
            - call: "POST /toolworks/furnace-campaigns/${camp_id}/complete"
              payload: { soak_minutes: 120 }
              as: ProductionPlanner
            - call: "POST /toolworks/production-lots/${lot_id}/advance"
              payload: { target_process_status: "HEAT_TREATED" }
              as: ProductionPlanner
            - call: "POST /toolworks/test-runs"
              payload: { lot_id: "${lot_id}", test_type: "HARDNESS", specimen_count: 2, window_start: "2026-08-03T08:00:00Z", window_end: "2026-08-03T09:00:00Z" }
              as: QualityEngineer
              captures: { run_id: $.data.id }
          trigger:
            - call: "POST /toolworks/test-runs/${run_id}/results"
              payload: { readings: [52.0, 53.0, 51.0] }
              as: QualityEngineer
              captures: { e_long: $.data.error_id }
            - call: "POST /toolworks/test-runs/${run_id}/results"
              payload: { readings: [] }
              as: QualityEngineer
              captures: { e_empty: $.data.error_id }
            - call: "POST /toolworks/test-runs/${run_id}/results"
              payload: { readings: [52.0, 53.0] }
              as: QualityEngineer
              captures: { final_status: $.data.status }
          assert:
            - "Three readings on a two-specimen run returns HTTP 422 with error_id == 'ERR_READING_COUNT_MISMATCH'"
            - "An empty readings array returns HTTP 400 with error_id == 'ERR_INVALID_REQUEST' (type check at priority 300 precedes the arity check at 330)"
            - "TestRun.${run_id}.status is still 'SCHEDULED' and mean_reading is still null after both rejections"
            - "The two-reading submission returns HTTP 200 with status == 'PASSED' and mean_reading == 52.5"

      - name: chamber_presence_is_conditional_on_test_type
