              payload: { corridor_id: "${cor_id}", run_plan_id: "${rp_a}", monitoring_start_at: "2026-09-01T02:00:00Z", monitoring_end_at: "2026-09-01T03:00:00Z", remote_operator_id: "${pro_id}", safety_support_operator_id: "${pro2_id}", geofence_type: "GEOFENCE_ONLY", intervention_protocol: "MONITOR_ONLY" }
