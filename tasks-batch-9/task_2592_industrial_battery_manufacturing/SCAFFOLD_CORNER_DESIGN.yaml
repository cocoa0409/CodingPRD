          setup:
            - "Plant PLT-RIV; workers Cara (PRODUCTION), Dana and Eli (QUALITY), plus Ada/Ben (ENGINEER) for the design; design CD-LEAD-465 APPROVED (nominal_capacity_ah 465.0, rated_cycles 1500); lot LOT-S quantity 9 walked to LOT_TESTING with sampling plan n=3 c=0; assembly ASM-S1 CERTIFIED; three tests recorded by Dana - CAPACITY 441.8 Ah PASS, CAPACITY 442.1 Ah PASS, CYCLE_LIFE 372.0 Ah at 1350 cycles PASS; clock advanced to 2026-09-03T14:00Z."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              as: PlantAdmin
              payload: { current_utc: "2026-09-01T00:00:00Z" }
            - call: POST /plants
