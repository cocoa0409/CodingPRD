          - errors[ERR_POSTURE_RESTRICTED]
        distinguishing_aspect: "The ProductionBatch PLANNED -> IN_PRODUCTION transition's validity is decided entirely by the Store's derived posture, not by anything on the batch: with an identical batch row, a store at RESTRICTED rejects the start and the same store at OPEN accepts it, so the pair tested is ProductionBatch x Store."
