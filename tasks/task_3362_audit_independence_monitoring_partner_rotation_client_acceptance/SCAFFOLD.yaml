    input: [engagement_id, professional_id, role, started_on, scheduled_end_on, expected_engagement_version]
    output: EngagementRoleAssignment
    side_effects: ["EngagementRoleAssignment.status defaults to ACTIVE", "rotation_tenure and assignment_workload_points recomputed", "Engagement.assigned_workload_points and Engagement.lead_partner_id / concurring_partner_id refreshed", "Engagement.version incremented by 1"]
  - method: GET
    path: "/audit/role-assignments"
