              captures: { lk_sh_a_status_2: $.data.show_status, lk_sh_a_liability_2: $.data.refund_liability_cents }
            - call: "GET /markets/${lk_mk_id}"
              payload: {}
              as: RiskOfficer
              captures: { lk_committed_2: $.data.committed_guarantee_cents }
            # both FKs are reverse-reachable
            - call: "GET /shows"
              payload: { rescheduled_from_show_id: "${lk_sh_a}" }
              as: TalentBuyer
            - call: "GET /cancellation-events"
              payload: { replacement_show_id: "${lk_sh_b}" }
              as: TalentBuyer
          assert:
            - "INVOICE LINK IS RECORDED ON BOTH KEYS — ${lk_vi_a_show} == ${lk_sh_a} and ${lk_vi_a_line} == ${lk_bl_a}; GET /vendor-invoices?budget_line_id=${lk_bl_a} returns total_count 1 and GET /vendor-invoices?show_id=${lk_sh_a} returns total_count 1, both containing ${lk_vi_a}"
            - "THE EVENT STARTS UNLINKED — ${lk_ce_status_0} == OPENED with ${lk_ce_replacement_0} null, and ${lk_sh_a_status_1} == POSTPONED with ${lk_sh_a_liability_1} == 500000 == ${lk_sh_a_gross}, ${lk_sh_a_paid} == 100"
            - "POSTPONEMENT ALREADY UNBOOKED THE GUARANTEE — ${lk_committed_1} == 0"
            - "THE REPLACEMENT POINTS BACK BEFORE IT IS LINKED FORWARD — ${lk_sh_b_from} == ${lk_sh_a} at creation, while ${lk_sh_b_transferred_gross_0} == 0 and ${lk_sh_b_transferred_paid_0} == 0: creating the replacement transfers nothing, only the reschedule call does"
            - "THE LINK IS WRITTEN FORWARD — ${lk_ce_status_1} == RESCHEDULED and ${lk_ce_replacement_1} == ${lk_sh_b}"
            - "THE LINK MOVES THE AUDIENCE — ${lk_sh_b_transferred_gross_1} == 500000 and ${lk_sh_b_transferred_paid_1} == 100 while ${lk_sh_b_own_gross} == 0 (the replacement has sold nothing of its own) and ${lk_sh_b_status} == PLANNED"
            - "AND ZEROES THE REFUND EXPOSURE — ${lk_sh_a_status_2} == RESCHEDULED with ${lk_sh_a_liability_2} == 0: the reschedule fork and the refund fork are mutually exclusive"
            - "THE MARKET LEDGER DOES NOT DOUBLE-COUNT — ${lk_committed_2} == ${lk_committed_1} == 0: the guarantee left the book at postponement and the PLANNED replacement re-books nothing until an offer is accepted on it"
            - "BOTH SIDES ARE LISTABLE — GET /shows?rescheduled_from_show_id=${lk_sh_a} returns total_count 1 containing ${lk_sh_b}, and GET /cancellation-events?replacement_show_id=${lk_sh_b} returns total_count 1 containing ${lk_ce_id}"

      - name: computed_reads_return_derived_money_without_persisting_it
        claim_type: Computed read
        grounds:
          - "endpoints[GET /shows/{show_id}/settlement-projection]"
          - "endpoints[GET /markets/{market_id}/portfolio-risk]"
        excluded_because:
          difficulty_instance: settlement_projection_provisional_versus_final_diverge_on_identical_show
          rationale: "GET /shows/{show_id}/settlement-projection is exactly the Computed read row, and the §1.8 instance already drives it against the canonical fixture, compares its whole field set to the FINAL settlement computed from identical data, and asserts that the projection wrote nothing (id, created_at, version all null and GET /settlements?show_id returning total_count 0). The other computed read, GET /markets/{market_id}/portfolio-risk, is driven under both of its valuation variants — including the non-persistence of the marked-to-market index — by portfolio_risk_defaults_to_trailing_settled_while_the_persisted_index_never_marks_to_market in the calculations section above."

      - name: sales_pause_and_comp_conversion_are_allowed_only_from_the_states_that_name_them
        claim_type: Conditional action
        grounds:
          - "endpoints[POST /shows/{show_id}/pause-sales]"
          - "endpoints[POST /shows/{show_id}/resume-sales]"
          - "endpoints[POST /ticket-holds/{ticket_hold_id}/convert-to-comp]"
          - "state_machines.Show[sales_status]"
          - "state_machines.TicketHold[HELD->CONVERTED]"
        distinguishing_aspect: "Four conditional actions, each attempted from exactly one state where it is legal and one where it is not, and the pause pair is the one that separates the two independent Show dimensions: pausing sales moves sales_status SELLING -> PAUSED and cascades to the tier, while show_status must stay ON_SALE, and a PRE_SALE show cannot be paused at all even though its show_status is identical to a SELLING show's. Conversion is conditional on the hold's kind as well as its status: an ARTIST_HOLD converts and reclassifies 5 seats from held to comp with available_qty deliberately UNCHANGED, while a hold that is already COMP has nothing to convert and a CONVERTED hold can neither convert again nor be released."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z. Market Cond2 Market limit 5000000, Venue Cond2 Hall cap 300 / facility 0 / tax 0, two Artists."
            - "Show N: ON_SALE (accepted FLAT_GUARANTEE offer of 100000) with GA 5000 x 300, no sales; comp allowance is ROUND_HALF_UP(300 * 3.0 / 100) == 9 seats."
            - "Holds on that tier: H1 ARTIST_HOLD qty 5 and H2 COMP qty 2, both HELD, so comp_qty is 2, held_qty is 5 and available_qty is 293."
            - "Show M: PLANNED and therefore PRE_SALE, with its own tier so that nothing but the sales dimension can be the reason a pause fails."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: RiskOfficer
            - call: "POST /markets"
              payload: { name: "Cond2 Market", region_code: "C2", guarantee_exposure_limit_cents: 5000000 }
              as: RiskOfficer
              captures: { c2_mk_id: $.data.id }
            - call: "POST /venues"
              payload: { market_id: "${c2_mk_id}", name: "Cond2 Hall", gross_capacity: 300, facility_fee_cents_per_ticket: 0, ticket_tax_pct: 0 }
              as: TalentBuyer
              captures: { c2_vn_id: $.data.id }
            - call: "POST /artists"
              payload: { name: "Cond2 Act One", agency: "Cn2 Talent", tier: "CLUB", historical_sellthrough_pct: 52.00, withholding_pct: 0 }
              as: TalentBuyer
              captures: { c2_ar_1: $.data.id }
            - call: "POST /artists"
              payload: { name: "Cond2 Act Two", agency: "Cn2 Talent", tier: "CLUB", historical_sellthrough_pct: 52.00, withholding_pct: 0 }
              as: TalentBuyer
              captures: { c2_ar_2: $.data.id }
            - call: "POST /shows"
              payload: { artist_id: "${c2_ar_1}", venue_id: "${c2_vn_id}", event_at: "2026-12-02T02:00:00.000Z", load_in_at: "2026-12-01T14:00:00.000Z", load_out_at: "2026-12-02T08:00:00.000Z", announce_at: "2026-08-01T00:00:00.000Z", venue_arrangement: "RENTAL", rental_fee_cents: 0 }
              as: TalentBuyer
              captures: { c2_sh_n: $.data.id, c2_sh_n_v: $.data.version }
            - call: "POST /offers"
              payload: { show_id: "${c2_sh_n}", expected_show_version: "${c2_sh_n_v}", deal_structure: "FLAT_GUARANTEE", guarantee_cents: 100000, deposit_cents: 0, expense_cap_cents: 100000 }
              as: TalentBuyer
              captures: { c2_of_n: $.data.id }
            - call: "POST /offers/${c2_of_n}/submit"
              payload: {}
              as: TalentBuyer
            - call: "POST /offers/${c2_of_n}/accept"
              payload: {}
              as: ArtistRep
              as_user_id: "${c2_ar_1}"
            - call: "POST /ticket-tiers"
              payload: { show_id: "${c2_sh_n}", tier_name: "GA", price_cents: 5000, allocation_qty: 300 }
              as: TalentBuyer
              captures: { c2_tt_n: $.data.id }
            - call: "POST /shows/${c2_sh_n}/on-sale"
              payload: {}
              as: TalentBuyer
              captures: { c2_sh_n_show_status_0: $.data.show_status, c2_sh_n_sales_status_0: $.data.sales_status }
            - call: "POST /ticket-holds"
              payload: { ticket_tier_id: "${c2_tt_n}", kind: "ARTIST_HOLD", qty: 5, holder: "Artist guest list" }
              as: TalentBuyer
              captures: { c2_h1: $.data.id }
            - call: "POST /ticket-holds"
              payload: { ticket_tier_id: "${c2_tt_n}", kind: "COMP", qty: 2, holder: "Local radio winners" }
              as: TalentBuyer
              captures: { c2_h2: $.data.id }
            - call: "POST /shows"
              payload: { artist_id: "${c2_ar_2}", venue_id: "${c2_vn_id}", event_at: "2026-12-09T02:00:00.000Z", load_in_at: "2026-12-08T14:00:00.000Z", load_out_at: "2026-12-09T08:00:00.000Z", announce_at: "2026-08-01T00:00:00.000Z", venue_arrangement: "RENTAL", rental_fee_cents: 0 }
              as: TalentBuyer
              captures: { c2_sh_m: $.data.id }
            - call: "POST /ticket-tiers"
              payload: { show_id: "${c2_sh_m}", tier_name: "GA", price_cents: 4000, allocation_qty: 100 }
              as: TalentBuyer
              captures: { c2_tt_m: $.data.id }
          trigger:
            # resume is not conditional on nothing - a SELLING show has nothing to resume
            - call: "POST /shows/${c2_sh_n}/resume-sales"
              payload: {}
              as: TalentBuyer
              captures: { c2_err_resume: $.data.error_id }
            - call: "POST /shows/${c2_sh_n}/pause-sales"
              payload: { reason: "Fraud review on the first-day orders" }
              as: TalentBuyer
              captures: { c2_sh_n_show_status_1: $.data.show_status, c2_sh_n_sales_status_1: $.data.sales_status }
            - call: "GET /ticket-tiers/${c2_tt_n}"
              payload: {}
              as: TalentBuyer
              captures: { c2_tt_n_status_1: $.data.status }
            - call: "POST /shows/${c2_sh_n}/pause-sales"
              payload: { reason: "Again" }
              as: TalentBuyer
              captures: { c2_err_pause_twice: $.data.error_id }
            - call: "POST /shows/${c2_sh_n}/resume-sales"
              payload: {}
              as: TalentBuyer
              captures: { c2_sh_n_sales_status_2: $.data.sales_status, c2_sh_n_show_status_2: $.data.show_status }
            - call: "GET /ticket-tiers/${c2_tt_n}"
              payload: {}
              as: TalentBuyer
              captures: { c2_tt_n_status_2: $.data.status }
            # a PRE_SALE show cannot be paused
            - call: "POST /shows/${c2_sh_m}/pause-sales"
              payload: { reason: "Nothing to pause" }
              as: TalentBuyer
              captures: { c2_err_pause_presale: $.data.error_id }
            # conversion is conditional on kind != COMP and status == HELD
            - call: "POST /ticket-holds/${c2_h1}/convert-to-comp"
              payload: {}
              as: TalentBuyer
              as_user_id: "u_c2_buyer"
              captures: { c2_h1_status: $.data.status, c2_h1_kind: $.data.kind, c2_h1_by: $.data.released_by_user_id }
            - call: "GET /ticket-tiers/${c2_tt_n}"
              payload: {}
              as: TalentBuyer
              captures: { c2_tt_n_comp: $.data.comp_qty, c2_tt_n_held: $.data.held_qty, c2_tt_n_avail: $.data.available_qty, c2_tt_n_alloc: $.data.allocation_qty }
            - call: "GET /shows/${c2_sh_n}"
              payload: {}
              as: TalentBuyer
              captures: { c2_sh_n_comps: $.data.comp_tickets_issued, c2_sh_n_held: $.data.held_tickets }
            - call: "POST /ticket-holds/${c2_h1}/convert-to-comp"
              payload: {}
              as: TalentBuyer
              captures: { c2_err_convert_again: $.data.error_id }
            - call: "POST /ticket-holds/${c2_h1}/release"
              payload: {}
              as: TalentBuyer
              captures: { c2_err_release_converted: $.data.error_id }
            - call: "POST /ticket-holds/${c2_h2}/convert-to-comp"
              payload: {}
              as: TalentBuyer
              captures: { c2_err_convert_comp: $.data.error_id }
          assert:
            - "NOTHING TO RESUME — ${c2_sh_n_show_status_0} == ON_SALE and ${c2_sh_n_sales_status_0} == SELLING, and ${c2_err_resume} == ERR_INVALID_STATE with HTTP 409 because PAUSED is the only declared source state for resume-sales"
            - "PAUSE MOVES ONE DIMENSION ONLY — ${c2_sh_n_sales_status_1} == PAUSED while ${c2_sh_n_show_status_1} == ON_SALE stays put, and the cascade reaches the tier: ${c2_tt_n_status_1} == PAUSED"
            - "PAUSE IS NOT IDEMPOTENT — ${c2_err_pause_twice} == ERR_INVALID_STATE with HTTP 409"
            - "RESUME RESTORES BOTH — ${c2_sh_n_sales_status_2} == SELLING, ${c2_sh_n_show_status_2} == ON_SALE and ${c2_tt_n_status_2} == ON_SALE"
            - "PRE_SALE CANNOT BE PAUSED — ${c2_err_pause_presale} == ERR_INVALID_STATE with HTTP 409 for show M, whose show_status is PLANNED and whose sales_status is PRE_SALE; the tier exists, so a missing-tier rule cannot be what fired"
            - "CONVERSION RECLASSIFIES WITHOUT MOVING INVENTORY — ${c2_h1_status} == CONVERTED, ${c2_h1_kind} == COMP, ${c2_h1_by} == u_c2_buyer, and on the tier ${c2_tt_n_comp} == 7 == 2 + 5, ${c2_tt_n_held} == 0 and ${c2_tt_n_avail} == 293 UNCHANGED, with the invariant ${c2_tt_n_alloc} == 300 == 0 sold + 7 comp + 0 held + 293 available"
            - "THE SHOW ROLLUP FOLLOWS — ${c2_sh_n_comps} == 7 and ${c2_sh_n_held} == 0; 7 is within the 9-seat comp allowance so priority 32 does not fire"
            - "CONVERTED IS TERMINAL — ${c2_err_convert_again} == ERR_INVALID_STATE 409 and ${c2_err_release_converted} == ERR_INVALID_STATE 409; the hold is still CONVERTED and the tier counters are unchanged"
            - "A COMP HOLD HAS NOTHING TO CONVERT — ${c2_err_convert_comp} == ERR_INVALID_STATE with HTTP 409 because the declared precondition is kind != COMP, and ${c2_tt_n_comp} stays 7 (a double-count here would silently push the show over its comp allowance)"

  # ===========================================================================
  # SECTION 6 — errors
  # Table 6 has a single requirement: every id in the §1.6 catalog must be
  # reachable by at least one test. The instance below is the audit itself. It
  # drives, with real calls, only the ids that no other §1.8 or §1.9 instance
  # reaches, and its asserts name the owning instance for all 45.
  # AUDIT FINDING: the catalog originally carried a 46th id, ERR_NO_ACCEPTED_OFFER
  # (priority 31), which this audit proved unreachable — a show reaches CONFIRMED
  # only via POST /offers/{offer_id}/accept, so no request can observe a show in
  # {CONFIRMED, ON_SALE, PERFORMED} without an ACCEPTED offer, and any earlier
  # call is owned by priority 17. Both the rule and the catalog entry were
  # deleted from SCAFFOLD.yaml rather than papered over with a fake trigger.
  # ===========================================================================
  - section: errors
    instances:
      - name: every_catalog_error_id_is_reachable_and_none_is_decorative
        claim_type: Triggerability audit
        grounds:
          - "errors[ERR_UNAUTHENTICATED]"
          - "errors[ERR_ROLE_FORBIDDEN]"
          - "errors[ERR_VARIANCE_CAP_INVALID]"
          - "validations[priority=1]"
          - "validations[priority=2]"
          - "validations[priority=3]"
          - "validations[priority=35]"
        distinguishing_aspect: "Three ids in the catalog are reachable by no other instance in this design, and each is a genuine hole rather than a formality. ERR_UNAUTHENTICATED can only be produced by omitting a header, which no functional test does; it must also PREEMPT well-formedness, so an anonymous request with a malformed body is 401 and not 400 — otherwise an unauthenticated caller can probe the schema. ERR_ROLE_FORBIDDEN has a second clause nobody exercises: a syntactically present but undeclared role value is a 403, not a 401, because the headers were supplied. ERR_VARIANCE_CAP_INVALID is invisible in the §1.8 priority-pair instance precisely BECAUSE it is preempted there, so it needs a call where the acting role is authorised and the only defect is the cap: REJECT carrying a cap, and APPROVE carrying a cap below budgeted_cents."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z. Market Err Market limit 5000000, Venue Err Hall cap 500 / facility 0 / tax 0, one Artist."
            - "Show F: CONFIRMED on an accepted FLAT_GUARANTEE offer of 300000, carrying one PRODUCTION line budgeted 200000 whose single 240000 invoice is APPROVED. variance_pct is exactly 20.00, so the line is PENDING_APPROVAL with required_approver_role TOUR_ACCOUNTANT — a TourAccountant therefore satisfies priority 34 and only priority 35 can refuse the decision."
            - "Header discipline: in this instance the `as:` field records the identity the caller WOULD have used; the three auth probes are sent with the named headers deliberately absent or corrupted, as spelled out per call."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: RiskOfficer
            - call: "POST /markets"
              payload: { name: "Err Market", region_code: "ER", guarantee_exposure_limit_cents: 5000000 }
              as: RiskOfficer
              captures: { er_mk_id: $.data.id }
            - call: "POST /venues"
              payload: { market_id: "${er_mk_id}", name: "Err Hall", gross_capacity: 500, facility_fee_cents_per_ticket: 0, ticket_tax_pct: 0 }
              as: TalentBuyer
              captures: { er_vn_id: $.data.id }
            - call: "POST /artists"
              payload: { name: "Err Act", agency: "Err Talent", tier: "THEATER", historical_sellthrough_pct: 63.00, withholding_pct: 0 }
              as: TalentBuyer
              captures: { er_ar_id: $.data.id }
            - call: "POST /shows"
              payload: { artist_id: "${er_ar_id}", venue_id: "${er_vn_id}", event_at: "2026-12-02T02:00:00.000Z", load_in_at: "2026-12-01T14:00:00.000Z", load_out_at: "2026-12-02T08:00:00.000Z", announce_at: "2026-08-01T00:00:00.000Z", venue_arrangement: "RENTAL", rental_fee_cents: 0 }
              as: TalentBuyer
              captures: { er_sh_id: $.data.id, er_sh_v: $.data.version }
            - call: "POST /offers"
              payload: { show_id: "${er_sh_id}", expected_show_version: "${er_sh_v}", deal_structure: "FLAT_GUARANTEE", guarantee_cents: 300000, deposit_cents: 0, expense_cap_cents: 300000 }
              as: TalentBuyer
              captures: { er_of_id: $.data.id }
            - call: "POST /offers/${er_of_id}/submit"
              payload: {}
              as: TalentBuyer
            - call: "POST /offers/${er_of_id}/accept"
              payload: {}
              as: ArtistRep
              as_user_id: "${er_ar_id}"
            - call: "POST /budget-lines"
              payload: { show_id: "${er_sh_id}", category: "PRODUCTION", description: "Steel and rigging", budgeted_cents: 200000, is_artist_deductible: true }
              as: TourAccountant
              captures: { er_bl_id: $.data.id }
            - call: "POST /vendor-invoices"
              payload: { show_id: "${er_sh_id}", budget_line_id: "${er_bl_id}", vendor_name: "Err Rigging", amount_cents: 240000, invoice_date: "2026-08-02T00:00:00.000Z", documentation_ref: "PKT-ER-01" }
              as: TourAccountant
              captures: { er_vi_id: $.data.id }
            - call: "POST /vendor-invoices/${er_vi_id}/verify"
              payload: {}
              as: TourAccountant
              as_user_id: "u_er_verify"
            - call: "POST /vendor-invoices/${er_vi_id}/approve"
              payload: {}
              as: TourAccountant
              as_user_id: "u_er_approve"
              captures: { er_vi_status: $.data.status }
            - call: "GET /budget-lines/${er_bl_id}"
              payload: {}
              as: TourAccountant
              captures: { er_bl_pct: $.data.variance_pct, er_bl_status: $.data.variance_status, er_bl_role: $.data.required_approver_role, er_bl_actual: $.data.actual_cents }
          trigger:
            # ERR_UNAUTHENTICATED: BOTH auth headers omitted entirely
            - call: "GET /shows/${er_sh_id}"
              payload: {}
              as: TalentBuyer
              captures: { er_err_anon_read: $.data.error_id, er_err_anon_msg: $.data.message }
            # ERR_UNAUTHENTICATED preempts ERR_INVALID_REQUEST: X-User-Role sent, X-User-ID empty, body malformed
            - call: "POST /shows"
              payload: { artist_id: "${er_ar_id}", venue_id: "${er_vn_id}", event_at: "not-a-timestamp", load_in_at: "2026-12-08T14:00:00.000Z", load_out_at: "2026-12-09T08:00:00.000Z", announce_at: "2026-08-01T00:00:00.000Z", venue_arrangement: "RENTAL", rental_fee_cents: -5 }
              as: TalentBuyer
              captures: { er_err_anon_write: $.data.error_id }
            # ERR_ROLE_FORBIDDEN, clause 1: both headers present, X-User-Role is "Producer" - not one of the five
            - call: "POST /markets"
              payload: { name: "Bogus Role Market", region_code: "BR", guarantee_exposure_limit_cents: 1000000 }
              as: RiskOfficer
              as_user_id: "u_er_producer"
              captures: { er_err_bad_role: $.data.error_id }
            # ERR_VARIANCE_CAP_INVALID: REJECT may not carry a cap
            - call: "POST /budget-lines/${er_bl_id}/variance-decision"
              payload: { decision: "REJECT", approved_cap_cents: 240000, variance_justification: "Not our overrun" }
              as: TourAccountant
              as_user_id: "u_er_ta"
              captures: { er_err_cap_on_reject: $.data.error_id }
            # ERR_VARIANCE_CAP_INVALID: APPROVE with a cap below budgeted_cents
            - call: "POST /budget-lines/${er_bl_id}/variance-decision"
              payload: { decision: "APPROVE", approved_cap_cents: 150000, variance_justification: "Partial recognition" }
              as: TourAccountant
              as_user_id: "u_er_ta"
              captures: { er_err_cap_too_low: $.data.error_id }
            # and the coherent decision, to prove the line was never touched by the two refusals
            - call: "POST /budget-lines/${er_bl_id}/variance-decision"
              payload: { decision: "APPROVE", approved_cap_cents: 240000, variance_justification: "Rigging change ordered on site" }
              as: TourAccountant
              as_user_id: "u_er_ta"
              captures: { er_bl_status_after: $.data.variance_status, er_bl_expense_after: $.data.settlement_expense_cents, er_bl_cap_after: $.data.approved_cap_cents, er_bl_by_after: $.data.variance_decided_by_user_id }
            - call: "GET /markets"
              payload: {}
              as: RiskOfficer
          assert:
            - "ANONYMOUS READ IS 401 — ${er_err_anon_read} == ERR_UNAUTHENTICATED with HTTP 401 when X-User-ID and X-User-Role are both absent, and ${er_err_anon_msg} is a non-empty human-readable string: every error envelope carries both error_id and message"
            - "AUTH PREEMPTS SHAPE — ${er_err_anon_write} == ERR_UNAUTHENTICATED with HTTP 401 even though the body also breaks priority 3 twice (an unparseable event_at and a negative rental_fee_cents); priority 1 runs first, so an anonymous caller learns nothing about the schema, and GET /markets still returns total_count 1 proving nothing was created"
            - "AN UNKNOWN ROLE IS 403, NOT 401 — ${er_err_bad_role} == ERR_ROLE_FORBIDDEN with HTTP 403 when X-User-Role is Producer: the headers were supplied, so priority 1 passes and priority 2's first clause (the value is one of the five declared roles) is what fails"
            - "VARIANCE FIXTURE — ${er_vi_status} == APPROVED, ${er_bl_actual} == 240000, ${er_bl_pct} == 20.00, ${er_bl_status} == PENDING_APPROVAL and ${er_bl_role} == TOUR_ACCOUNTANT, so the acting TourAccountant satisfies priority 34 and priority 35 is the only rule left that can refuse"
            - "REJECT MAY NOT CARRY A CAP — ${er_err_cap_on_reject} == ERR_VARIANCE_CAP_INVALID with HTTP 422; this is the id that the §1.8 instance variance_decision_authority_check_preempts_cap_validity_check deliberately never returns, so without this call it would be unreachable"
            - "APPROVE MAY NOT CAP BELOW BUDGET — ${er_err_cap_too_low} == ERR_VARIANCE_CAP_INVALID with HTTP 422 for a 150000 cap against budgeted_cents 200000"
            - "THE REFUSALS WROTE NOTHING — the third decision returns 200 with ${er_bl_status_after} == APPROVED, ${er_bl_cap_after} == 240000, ${er_bl_expense_after} == 240000 == MIN(actual 240000, cap 240000) and ${er_bl_by_after} == u_er_ta; had either refused call landed, variance_status would already have been terminal and this call would have been a 409"
            - "CATALOG COVERAGE, AUTH AND SHAPE — ERR_UNAUTHENTICATED and the undeclared-role clause of ERR_ROLE_FORBIDDEN are triggered here; the wrong-role clause of ERR_ROLE_FORBIDDEN and ERR_INVALID_REQUEST by existence_and_authorization_checks_run_before_state_and_amount_checks and by the entities-section Required Fields and Type Constraints instances; ERR_NOT_RESOURCE_OWNER by entity_backed_roles_reach_only_their_own_act_or_room; ERR_SEGREGATION_OF_DUTIES by action_endpoints_move_the_row_and_refuse_when_their_precondition_fails and by segregation_of_duties_blocks_the_same_user_from_both_halves_of_four_pairs; ERR_VARIANCE_APPROVAL_AUTHORITY by the §1.8 instance variance_decision_authority_check_preempts_cap_validity_check"
            - "CATALOG COVERAGE, THE ELEVEN 404s — ERR_MARKET_NOT_FOUND, ERR_ARTIST_NOT_FOUND, ERR_VENUE_NOT_FOUND, ERR_SHOW_NOT_FOUND, ERR_OFFER_NOT_FOUND, ERR_BUDGET_LINE_NOT_FOUND, ERR_VENDOR_INVOICE_NOT_FOUND, ERR_TICKET_TIER_NOT_FOUND, ERR_TICKET_HOLD_NOT_FOUND, ERR_SETTLEMENT_NOT_FOUND and ERR_CANCELLATION_EVENT_NOT_FOUND are all triggered by unknown_uuids_return_the_entity_specific_not_found_error_id, and four of them again under preemption by existence_and_authorization_checks_run_before_state_and_amount_checks"
            - "CATALOG COVERAGE, STATE AND CONCURRENCY — ERR_INVALID_STATE by triggers_with_no_declared_edge_from_the_current_state_are_rejected; ERR_ALREADY_TERMINAL by terminal_states_reject_every_further_trigger; ERR_STALE_SHOW_VERSION by optimistic_concurrency_rejects_both_declared_stale_show_version_writes; ERR_SETTLEMENT_ALREADY_OPEN, ERR_UNRESOLVED_VARIANCE, ERR_OFFER_EXPIRED, ERR_REPLACEMENT_SHOW_INVALID, ERR_EXPOSURE_OVERRIDE_INVALID, ERR_BUDGET_LINE_SHOW_MISMATCH and ERR_CLAIM_WINDOW_CLOSED by settlement_offer_and_claim_rule_violations_each_return_their_own_error_id; ERR_UNRESOLVED_INVOICES by the §1.8 instance settlement_calculate_blocked_by_a_still_verified_vendor_invoice"
            - "CATALOG COVERAGE, SCHEDULING AND TICKETING — ERR_INVALID_SHOW_WINDOW, ERR_EVENT_DATE_IN_PAST, ERR_DUPLICATE_TIER_NAME and ERR_INSUFFICIENT_TIER_INVENTORY by show_and_inventory_rule_violations_each_return_their_own_error_id; ERR_VENUE_WINDOW_CONFLICT and ERR_ARTIST_ROUTING_CONFLICT by the §1.8 instances venue_load_window_half_open_overlap_rejects_at_one_millisecond and artist_rest_buffer_is_a_symmetric_point_distance_not_an_interval; ERR_NO_TICKET_TIERS and ERR_ANNOUNCE_DATE_NOT_REACHED and ERR_SHOW_NOT_YET_OCCURRED by on_sale_and_perform_preconditions_each_fail_with_their_own_error; ERR_COMP_ALLOWANCE_EXCEEDED by comp_allowance_threshold_admits_exactly_thirty_comps_and_refuses_the_thirty_first; ERR_VENUE_CAPACITY_EXCEEDED and ERR_MARKET_POSTURE_FROZEN and ERR_MARKET_EXPOSURE_EXCEEDED by individually_affordable_guarantees_collectively_break_the_market_limit"
            - "CATALOG COVERAGE, MONEY AND DEAL TERMS — ERR_DEAL_TERMS_INCOHERENT and ERR_CASH_PAYMENT_LIMIT by cash_limit_and_deal_coherence_apply_only_to_the_configuration_that_names_them; ERR_NEGOTIATION_ROUNDS_EXHAUSTED by the §1.8 instance offer_negotiation_cycles_submitted_countered_submitted_until_round_limit; ERR_VARIANCE_CAP_INVALID here. That is all 45 ids in §1.6 with at least one trigger and no id left over"

  # ===========================================================================
  # SECTION 7 — rbac
  # Five roles in §1.7, two of them entity-backed (ArtistRep -> Artist,
  # VenueOperator -> Venue) and three opaque. complexity_profile.role_model is
  # segregation_of_duties, so that row of the role-model table is walked below.
  # The approval_chain, hierarchical_override and delegated_authority rows are
  # SKIPPED: no role dominates another (a RiskOfficer cannot calculate or pay a
  # settlement and a TourAccountant cannot reopen one, so there is no ordering
  # of privilege to test), and §1.5 declares no delegation grant endpoint. The
  # peer_roles row IS walked, because the two entity-backed identities create a
  # per-resource ownership dimension that priority 15 enforces.
  # ===========================================================================
  - section: rbac
    instances:
      - name: every_role_can_perform_its_own_exclusive_and_shared_operations
        claim_type: Exclusive operations
        grounds:
          - "roles[TalentBuyer]"
          - "roles[ArtistRep]"
          - "roles[TourAccountant]"
          - "roles[RiskOfficer]"
          - "roles[VenueOperator]"
        distinguishing_aspect: "One show is walked from market creation to a paid settlement, and every call is made by the role that OWNS it in §1.7 — so the whole happy path is simultaneously an authorization test. This is the direction that a too-strict implementation fails: refusing a TourAccountant the POST /settlements/{id}/pay it exclusively owns, or refusing an ArtistRep the accept that only it can perform, breaks the domain just as badly as letting the wrong role through. The two shared operations included here are exercised by a role for which they are shared rather than exclusive (a TourAccountant performing the show, a TalentBuyer recording sales), and the assert names, for each of the remaining exclusive operations, the instance where its owner exercises it."
        test_recipe:
          setup:
            - "Empty database, logical clock 2026-08-01T00:00:00Z. Every entity below is created inside the trigger block by its owning role, because creation IS the claim."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: RiskOfficer
          trigger:
            # RiskOfficer exclusive
            - call: "POST /markets"
              payload: { name: "Role Own Market", region_code: "RO", guarantee_exposure_limit_cents: 5000000 }
              as: RiskOfficer
              captures: { ro_mk_id: $.data.id }
            # TalentBuyer exclusive x4
            - call: "POST /artists"
              payload: { name: "Role Own Act", agency: "Own Talent", tier: "THEATER", historical_sellthrough_pct: 68.00, withholding_pct: 0 }
              as: TalentBuyer
              captures: { ro_ar_id: $.data.id }
            - call: "POST /venues"
              payload: { market_id: "${ro_mk_id}", name: "Role Own Hall", gross_capacity: 500, facility_fee_cents_per_ticket: 0, ticket_tax_pct: 0 }
              as: TalentBuyer
              captures: { ro_vn_id: $.data.id }
            - call: "POST /shows"
              payload: { artist_id: "${ro_ar_id}", venue_id: "${ro_vn_id}", event_at: "2026-12-02T02:00:00.000Z", load_in_at: "2026-12-01T14:00:00.000Z", load_out_at: "2026-12-02T08:00:00.000Z", announce_at: "2026-08-01T00:00:00.000Z", venue_arrangement: "RENTAL", rental_fee_cents: 0 }
              as: TalentBuyer
              captures: { ro_sh_id: $.data.id, ro_sh_v1: $.data.version }
            - call: "POST /offers"
              payload: { show_id: "${ro_sh_id}", expected_show_version: "${ro_sh_v1}", deal_structure: "FLAT_GUARANTEE", guarantee_cents: 100000, deposit_cents: 0, expense_cap_cents: 100000 }
              as: TalentBuyer
              captures: { ro_of_id: $.data.id }
            - call: "POST /offers/${ro_of_id}/submit"
              payload: {}
              as: TalentBuyer
              captures: { ro_of_status_sub: $.data.status }
            # RiskOfficer exclusive
            - call: "POST /shows/${ro_sh_id}/exposure-override"
              payload: { exposure_override_limit_cents: 9000000, exposure_override_justification: "Anchor date, board approved" }
              as: RiskOfficer
              as_user_id: "u_ro_risk"
              captures: { ro_sh_override: $.data.exposure_override_limit_cents }
            # ArtistRep exclusive
            - call: "POST /offers/${ro_of_id}/accept"
              payload: {}
              as: ArtistRep
              as_user_id: "${ro_ar_id}"
              captures: { ro_of_status_acc: $.data.status, ro_of_accepted_by: $.data.accepted_by_user_id }
            # TalentBuyer exclusive
            - call: "POST /ticket-tiers"
              payload: { show_id: "${ro_sh_id}", tier_name: "GA", price_cents: 5000, allocation_qty: 100 }
              as: TalentBuyer
              captures: { ro_tt_id: $.data.id }
            - call: "POST /shows/${ro_sh_id}/on-sale"
              payload: {}
              as: TalentBuyer
              captures: { ro_sh_sales: $.data.sales_status }
            # shared with VenueOperator, exercised here by TalentBuyer
            - call: "POST /ticket-tiers/${ro_tt_id}/sales"
              payload: { qty: 10 }
              as: TalentBuyer
              captures: { ro_tt_sold: $.data.sold_qty, ro_tt_gross: $.data.gross_sold_cents }
            - call: "GET /shows/${ro_sh_id}"
              payload: {}
              as: TalentBuyer
              captures: { ro_sh_v2: $.data.version }
            # TalentBuyer exclusive
            - call: "POST /ticket-tiers/${ro_tt_id}/price-adjustments"
              payload: { new_price_cents: 6000, expected_show_version: "${ro_sh_v2}", reason: "Demand is ahead of plan" }
              as: TalentBuyer
              captures: { ro_tt_price: $.data.price_cents, ro_tt_last_price: $.data.last_price_cents, ro_tt_revisions: $.data.price_revision_count }
            # TourAccountant exclusive
            - call: "POST /budget-lines"
              payload: { show_id: "${ro_sh_id}", category: "PRODUCTION", description: "Local crew call", budgeted_cents: 20000, is_artist_deductible: true }
              as: TourAccountant
              captures: { ro_bl_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-12-02T02:00:00.000Z" }
              as: RiskOfficer
            # shared with TalentBuyer, exercised here by TourAccountant
            - call: "POST /shows/${ro_sh_id}/perform"
              payload: {}
              as: TourAccountant
              captures: { ro_sh_status_perf: $.data.show_status }
            # TourAccountant exclusive x2
            - call: "POST /settlements"
              payload: { show_id: "${ro_sh_id}" }
              as: TourAccountant
              captures: { ro_st_id: $.data.id }
            - call: "POST /settlements/${ro_st_id}/calculate"
              payload: {}
              as: TourAccountant
              as_user_id: "u_ro_calc"
              captures: { ro_st_status_calc: $.data.status, ro_st_gross: $.data.gross_receipts_cents, ro_st_adj: $.data.adjusted_gross_cents, ro_st_due: $.data.payment_due_cents, ro_st_net: $.data.promoter_net_cents }
            # ArtistRep exclusive
            - call: "POST /settlements/${ro_st_id}/artist-response"
              payload: { response: "ACCEPT" }
              as: ArtistRep
              as_user_id: "${ro_ar_id}"
              captures: { ro_st_status_signed: $.data.status }
            # TourAccountant exclusive
            - call: "POST /settlements/${ro_st_id}/pay"
              payload: { payment_method: "WIRE", payment_reference: "WIRE-RO-01" }
              as: TourAccountant
              as_user_id: "u_ro_pay"
              captures: { ro_st_status_paid: $.data.status, ro_st_paid_at: $.data.paid_at }
            - call: "GET /shows/${ro_sh_id}"
              payload: {}
              as: TourAccountant
              captures: { ro_sh_status_final: $.data.show_status }
          assert:
            - "RISK OFFICER OWNS THE MARKET AND THE OVERRIDE — POST /markets returns 201 and ${ro_sh_override} == 9000000 (<= 2 * 5000000); no other role may make either call"
            - "TALENT BUYER OWNS BOOKING AND INVENTORY — POST /artists, /venues, /shows and /offers all return 201, ${ro_of_status_sub} == SUBMITTED, ${ro_sh_sales} == SELLING after on-sale, and the price move gives ${ro_tt_price} == 6000, ${ro_tt_last_price} == 5000, ${ro_tt_revisions} == 1"
            - "ARTIST REP OWNS ACCEPTANCE AND SIGN-OFF — ${ro_of_status_acc} == ACCEPTED with ${ro_of_accepted_by} == ${ro_ar_id}, and ${ro_st_status_signed} == ARTIST_SIGNED"
            - "TOUR ACCOUNTANT OWNS THE BOOK — POST /budget-lines returns 201, ${ro_st_status_calc} == CALCULATED and ${ro_st_status_paid} == PAID with ${ro_st_paid_at} == 2026-12-02T02:00:00.000Z"
            - "SHARED OPERATIONS WORK FOR THE NON-DEFAULT ROLE TOO — the TourAccountant's perform gives ${ro_sh_status_perf} == PERFORMED and the TalentBuyer's sale gives ${ro_tt_sold} == 10 with ${ro_tt_gross} == 50000 (10 x 5000, at the pre-adjustment price)"
            - "THE MONEY IS CONSISTENT WITH THE WALK — ${ro_st_gross} == 50000, ${ro_st_adj} == 48750 (card fee 1250), the un-invoiced 20000 line recognises 0 so ${ro_st_due} == 100000 == the FLAT guarantee, and ${ro_st_net} == -51250; ${ro_sh_status_final} == SETTLED"
            - "REMAINING EXCLUSIVE OPERATIONS ARE EXERCISED BY THEIR OWNERS ELSEWHERE — TalentBuyer's withdraw and reschedule and convert-to-comp in action_endpoints_move_the_row_and_refuse_when_their_precondition_fails, cross_reference_links_require_both_rows_and_are_readable_from_either_side and sales_pause_and_comp_conversion_are_allowed_only_from_the_states_that_name_them; TalentBuyer's resume-sales in that same instance; ArtistRep's counter in the §1.8 instance offer_negotiation_cycles_submitted_countered_submitted_until_round_limit; TourAccountant's verify, dispute-resolution and process-refunds in vendor_invoice_cycles_submitted_verified_disputed_submitted_three_times and settlement_offer_and_claim_rule_violations_each_return_their_own_error_id; RiskOfficer's reopen in action_endpoints_move_the_row_and_refuse_when_their_precondition_fails and its file-claim and settle-claim in cancellation_event_forks_into_the_reschedule_path_and_the_refund_insurance_path. VenueOperator declares no exclusive operation, and its four shared write operations are exercised in shared_operations_are_open_to_every_role_that_declares_them"

      - name: roles_cannot_reach_another_roles_exclusive_operations
        claim_type: Other roles' exclusive operations
        grounds:
          - "validations[priority=2]"
          - "errors[ERR_ROLE_FORBIDDEN]"
          - "roles[TalentBuyer]"
          - "roles[ArtistRep]"
          - "roles[VenueOperator]"
          - "roles[TourAccountant]"
          - "roles[RiskOfficer]"
        distinguishing_aspect: "A refusal matrix that covers all five roles as offenders and every family of exclusive operation as target, chosen so that each probe is plausible rather than absurd: the RiskOfficer who owns exposure tries to open and calculate the settlement whose numbers it is judging, the TourAccountant who owns the book tries to reopen its own calculation and to sign for the artist, the TalentBuyer who wrote the offer tries to accept it, and the VenueOperator tries to build inventory in its own room. The last probe pins the ordering: a wrong-role call against a non-existent id is 403 and not 404, because priority 2 runs before priorities 4 to 14 — an implementation that resolves the path id first leaks the existence of rows to callers with no rights to them."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z. Market Deny Market limit 5000000, Venue Deny Hall cap 500, Artist Deny Act. Show D is CONFIRMED on an accepted FLAT_GUARANTEE offer of 100000, with one GA tier (5000 x 100), one PROMOTER_HOLD of 4 seats and one PRODUCTION budget line."
            - "Settlement and cancellation-event probes use ids that do not exist, deliberately: priority 2 precedes every not-found rule, so the response must still be 403."
