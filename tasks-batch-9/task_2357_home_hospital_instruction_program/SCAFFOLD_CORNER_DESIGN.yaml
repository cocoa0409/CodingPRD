              payload: { enrollment_status: "WITHDRAWN" }
              as: ProgramAdministrator
              as_user_id: "pa-001"
            - call: "POST /hhi/cases"
              payload: { student_id: "${stu_c_id}", referral_date: "2026-09-07", delivery_mode: "IN_HOME" }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { err_new_case_withdrawn: $.data.error_id }
            - call: "POST /hhi/students/${stu_b_id}/enrollment"
              payload: { enrollment_status: "WITHDRAWN" }
              as: ProgramAdministrator
              as_user_id: "pa-001"
            - call: "POST /hhi/cases/${case_b_id}/activate"
              payload: {}
              as: ProgramAdministrator
