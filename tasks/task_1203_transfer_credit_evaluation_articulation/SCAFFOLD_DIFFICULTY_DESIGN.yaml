scaffold_difficulty_design:
  # ==================================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # ==================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: line_credit_provisional_vs_final_conversion
        grounds:
          - calculations.provisional_credit_award
          - calculations.final_credit_award
          - entities.EvaluationLineItem.fields.provisional_credits
          - entities.EvaluationLineItem.fields.awarded_credits
        distinguishing_aspect: |
          Entity domain = EvaluationLineItem credit conversion. For identical external
          data (4.5 quarter hours, QUARTER partner, internal cap 4.0) the provisional
          variant yields 3.4 (0.75 estimate factor, 1dp rounding) while the final
          variant yields 3.0 (exact 2/3 factor, 0.5-step rounding) — same line, same
          input, two different pinned numbers.
        test_recipe:
          setup:
            - "QUARTER partner; internal course MATH-150 cap 4.0; ACTIVE agreement [2024-08-01, 2027-07-31) with equivalency MATH-101 (4.5 quarter hours) covering term 2025-06-15"
            - "Student (major MATH) with a VERIFIED transcript carrying one course MATH-101 grade B"
          setup_api_calls:
            - { call: "POST /api/partner-institutions", payload: { name: "Quarter College", institution_code: "QC", credit_system: "QUARTER" }, as: RegistrarAdmin, captures: { p_id: "$.data.id" } }
            - { call: "POST /api/internal-courses", payload: { course_code: "MATH-150", title: "Calculus I", credit_hours: 4.0, level: "LOWER", department: "MATH", gened_tags: [] }, as: RegistrarAdmin, captures: { c1: "$.data.id" } }
            - { call: "POST /api/articulation-agreements", payload: { partner_institution_id: "${p_id}", program_scope: "ALL", effective_start: "2024-08-01", effective_end: "2027-07-31" }, as: RegistrarAdmin, captures: { ag_id: "$.data.id" } }
            - { call: "POST /api/articulation-agreements/${ag_id}/activate", as: RegistrarAdmin }
            - { call: "GET /api/articulation-agreements/${ag_id}", as: RegistrarAdmin, captures: { ag_v: "$.data.version" } }
            - { call: "POST /api/articulation-agreements/${ag_id}/course-equivalencies", payload: { internal_course_id: "${c1}", external_course_code: "MATH-101", external_title: "Intro Calc", external_credit_hours: 4.5, effective_from: "2024-08-01", effective_until: "2027-07-31", expected_agreement_version: "${ag_v}" }, as: RegistrarAdmin }
            - { call: "POST /api/students", payload: { full_name: "Sam Transfer", email: "sam@x.edu", declared_major: "MATH", catalog_year: 2026 }, as: RegistrarAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /api/transcripts", payload: { student_id: "${s_id}", partner_institution_id: "${p_id}", term_completed: "2025-06-15", courses: [ { external_course_code: "MATH-101", title: "Intro Calc", credit_hours: 4.5, grade: "B" } ] }, as: TransferCenterStaff, captures: { t_id: "$.data.id" } }
            - { call: "POST /api/transcripts/${t_id}/verify", as: TransferCenterStaff }
            - { call: "POST /api/transfer-credit-evaluations", payload: { student_id: "${s_id}", transcript_id: "${t_id}" }, as: TransferEvaluator, captures: { ev_id: "$.data.id" } }
            - { call: "GET /api/transfer-credit-evaluations/${ev_id}/line-items", as: TransferEvaluator, captures: { l1: "$.data[0].id" } }
            - { call: "POST /api/transfer-credit-evaluations/${ev_id}/start-review", as: TransferEvaluator }
          trigger:
            - { call: "POST /api/evaluation-line-items/${l1}/adopt", payload: {}, as: TransferEvaluator }
            - { call: "POST /api/transfer-credit-evaluations/${ev_id}/finalize", as: TransferEvaluator, as_user_id: "eval-a" }
            - { call: "GET /api/evaluation-line-items/${l1}", as: TransferEvaluator }
          assert:
            - "at intake (before trigger): EvaluationLineItem.${l1}.provisional_credits == 3.4 (round_half_up(4.5*0.75,1), capped by 4.0)"
            - "after adopt+finalize: EvaluationLineItem.${l1}.awarded_credits == 3.0 (half-step(4.5*2/3)=3.0, capped by 4.0)"
            - "EvaluationLineItem.${l1}.provisional_credits still == 3.4 after finalization — the two variants coexist and diverge (3.4 != 3.0)"
            - "TransferCreditEvaluation.${ev_id}.awarded_credits_total == 3.0"

      - name: degree_progress_certified_vs_provisional
        grounds:
          - calculations.requirement_coverage
          - entities.RequirementApplication.fields.applied_credits
          - state_machines.TransferCreditEvaluation.EVALUATED_to_POSTED
        distinguishing_aspect: |
          Entity domain = degree-audit RequirementApplication aggregation (distinct from
          the line-item credit-conversion domain of the sibling instance). For the same
          student state, CERTIFIED counts only POSTED-line and CREDITED-pla applications
          (7.0) while PROVISIONAL additionally projects ADOPTED lines and VERIFIED plas
          (18.0) — identical data, two variants, different totals.
        test_recipe:
          setup:
            - "SEMESTER partner; courses CMAT (MATH, 4.0, no tags), CENG (ENGL, 3.0, [GENED_COMMS]), CHIS (HIST, 6.0, no tags); ACTIVE agreement with equivalencies M-101->CMAT (4.0h), E-201->CENG (3.0h), H-301->CHIS (5.0h)"
            - "Student (major MATH); evaluation EV1 (courses M-101 A, E-201 B) fully posted; evaluation EV2 (course H-301 A) left IN_REVIEW with its line ADOPTED (awarded 5.0); one VERIFIED (not credited) PLA of 6.0"
          setup_api_calls:
            - { call: "POST /api/partner-institutions", payload: { name: "State University", institution_code: "SU", credit_system: "SEMESTER" }, as: RegistrarAdmin, captures: { p_id: "$.data.id" } }
            - { call: "POST /api/internal-courses", payload: { course_code: "MATH-150", title: "Calculus I", credit_hours: 4.0, level: "LOWER", department: "MATH", gened_tags: [] }, as: RegistrarAdmin, captures: { c_math: "$.data.id" } }
            - { call: "POST /api/internal-courses", payload: { course_code: "ENG-110", title: "Composition", credit_hours: 3.0, level: "LOWER", department: "ENGL", gened_tags: ["GENED_COMMS"] }, as: RegistrarAdmin, captures: { c_eng: "$.data.id" } }
            - { call: "POST /api/internal-courses", payload: { course_code: "HIST-100", title: "World History", credit_hours: 6.0, level: "LOWER", department: "HIST", gened_tags: [] }, as: RegistrarAdmin, captures: { c_hist: "$.data.id" } }
            - { call: "POST /api/articulation-agreements", payload: { partner_institution_id: "${p_id}", program_scope: "ALL", effective_start: "2024-08-01", effective_end: "2027-07-31" }, as: RegistrarAdmin, captures: { ag_id: "$.data.id" } }
            - { call: "POST /api/articulation-agreements/${ag_id}/activate", as: RegistrarAdmin }
            - { call: "GET /api/articulation-agreements/${ag_id}", as: RegistrarAdmin, captures: { ag_v1: "$.data.version" } }
            - { call: "POST /api/articulation-agreements/${ag_id}/course-equivalencies", payload: { internal_course_id: "${c_math}", external_course_code: "M-101", external_title: "Calc", external_credit_hours: 4.0, effective_from: "2024-08-01", effective_until: "2027-07-31", expected_agreement_version: "${ag_v1}" }, as: RegistrarAdmin }
            - { call: "GET /api/articulation-agreements/${ag_id}", as: RegistrarAdmin, captures: { ag_v2: "$.data.version" } }
            - { call: "POST /api/articulation-agreements/${ag_id}/course-equivalencies", payload: { internal_course_id: "${c_eng}", external_course_code: "E-201", external_title: "Comp", external_credit_hours: 3.0, effective_from: "2024-08-01", effective_until: "2027-07-31", expected_agreement_version: "${ag_v2}" }, as: RegistrarAdmin }
            - { call: "GET /api/articulation-agreements/${ag_id}", as: RegistrarAdmin, captures: { ag_v3: "$.data.version" } }
            - { call: "POST /api/articulation-agreements/${ag_id}/course-equivalencies", payload: { internal_course_id: "${c_hist}", external_course_code: "H-301", external_title: "History", external_credit_hours: 5.0, effective_from: "2024-08-01", effective_until: "2027-07-31", expected_agreement_version: "${ag_v3}" }, as: RegistrarAdmin }
            - { call: "POST /api/students", payload: { full_name: "Dana Audit", email: "dana@x.edu", declared_major: "MATH", catalog_year: 2026 }, as: RegistrarAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /api/transcripts", payload: { student_id: "${s_id}", partner_institution_id: "${p_id}", term_completed: "2025-06-15", courses: [ { external_course_code: "M-101", title: "Calc", credit_hours: 4.0, grade: "A" }, { external_course_code: "E-201", title: "Comp", credit_hours: 3.0, grade: "B" } ] }, as: TransferCenterStaff, captures: { t1: "$.data.id" } }
            - { call: "POST /api/transcripts/${t1}/verify", as: TransferCenterStaff }
            - { call: "POST /api/transfer-credit-evaluations", payload: { student_id: "${s_id}", transcript_id: "${t1}" }, as: TransferEvaluator, captures: { ev1: "$.data.id" } }
            - { call: "GET /api/transfer-credit-evaluations/${ev1}/line-items", as: TransferEvaluator, captures: { l1: "$.data[0].id", l2: "$.data[1].id" } }
            - { call: "POST /api/transfer-credit-evaluations/${ev1}/start-review", as: TransferEvaluator }
            - { call: "POST /api/evaluation-line-items/${l1}/adopt", payload: {}, as: TransferEvaluator }
            - { call: "POST /api/evaluation-line-items/${l2}/adopt", payload: {}, as: TransferEvaluator }
            - { call: "POST /api/transfer-credit-evaluations/${ev1}/finalize", as: TransferEvaluator, as_user_id: "eval-a" }
            - { call: "POST /api/transfer-credit-evaluations/${ev1}/post", as: TransferEvaluator, as_user_id: "eval-b" }
            - { call: "POST /api/transcripts", payload: { student_id: "${s_id}", partner_institution_id: "${p_id}", term_completed: "2025-08-15", courses: [ { external_course_code: "H-301", title: "History", credit_hours: 5.0, grade: "A" } ] }, as: TransferCenterStaff, captures: { t2: "$.data.id" } }
            - { call: "POST /api/transcripts/${t2}/verify", as: TransferCenterStaff }
            - { call: "POST /api/transfer-credit-evaluations", payload: { student_id: "${s_id}", transcript_id: "${t2}" }, as: TransferEvaluator, captures: { ev2: "$.data.id" } }
            - { call: "GET /api/transfer-credit-evaluations/${ev2}/line-items", as: TransferEvaluator, captures: { l3: "$.data[0].id" } }
            - { call: "POST /api/transfer-credit-evaluations/${ev2}/start-review", as: TransferEvaluator }
            - { call: "POST /api/evaluation-line-items/${l3}/adopt", payload: {}, as: TransferEvaluator }
            - { call: "POST /api/prior-learning-assessments", payload: { student_id: "${s_id}", source_type: "MILITARY_JST", credential_ref: "JST-123", claimed_credits: 6.0 }, as: Student, as_user_id: "${s_id}", captures: { pla: "$.data.id" } }
            - { call: "POST /api/prior-learning-assessments/${pla}/verify", payload: { verified_credits: 6.0 }, as: TransferEvaluator }
          trigger:
            - { call: "GET /api/students/${s_id}/degree-progress", payload: { variant: "CERTIFIED" }, as: TransferEvaluator, captures: { tot_cert: "$.data.total_applied_credits" } }
            - { call: "GET /api/students/${s_id}/degree-progress", payload: { variant: "PROVISIONAL" }, as: TransferEvaluator, captures: { tot_prov: "$.data.total_applied_credits" } }
          assert:
            - "CERTIFIED variant: total_applied_credits == 7.0 (4.0 MAJOR_CORE + 3.0 GENED_COMMS posted applications only)"
            - "PROVISIONAL variant: total_applied_credits == 18.0 (7.0 + ADOPTED line projection 5.0 + VERIFIED pla projection 6.0)"
            - "same student, same instant: variants diverge (7.0 != 18.0)"

  # ==================================================================
  # Rule 2 — combinatorial_formula (different modes: (a) and (b))
  # ==================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: waterfall_slot_need_spill_with_cap_truncation
        grounds:
          - calculations.credit_cap_waterfall
          - entities.RequirementApplication.fields.slot
          - entities.RequirementApplication.fields.status
        distinguishing_aspect: |
          Mode (a): a formula with >= 3 inputs and non-linear interaction —
          per line the waterfall computes min(awarded_credits, natural_slot_remaining,
          global_remaining) with a conditional FREE_ELECTIVE spill branch, iterated in
          slot-priority order (MAJOR_CORE < GENED_* < FREE_ELECTIVE) with created_at
          tie-break. Slot overflow spills across buckets and the 60.0 global cap
          truncates the final line to 0.0 (UNAPPLIED) exactly at the boundary.
        test_recipe:
          setup:
            - "SEMESTER partner; CMAT (MATH, 6.0), CENG (ENGL, 6.0, [GENED_COMMS]), CHIS (HIST, 6.0); ACTIVE agreement; 12 equivalencies: M-101..M-105 -> CMAT (6.0h), E-201/E-202 -> CENG (5.0h), H-301..H-305 -> CHIS (5.0h)"
            - "Student major MATH; transcript with the 12 courses above, all grade A, term 2025-06-15; evaluation created and IN_REVIEW with all 12 lines AUTO_MATCHED"
          setup_api_calls:
            - { call: "POST /api/partner-institutions", payload: { name: "State University", institution_code: "SU", credit_system: "SEMESTER" }, as: RegistrarAdmin, captures: { p_id: "$.data.id" } }
