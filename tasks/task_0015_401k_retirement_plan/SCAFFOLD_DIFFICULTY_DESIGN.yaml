              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /plans/${plan_id}/activate"
              payload: {}
              as: PlanAdmin
            - call: "POST /participants"
              payload: { plan_id: "${plan_id}", full_name: "Henry H", date_of_birth: "1980-06-15T00:00:00Z", hire_date: "2024-06-15T00:00:00Z", annual_compensation_cents: 12000000, deferral_rate_bps: 400 }
              as: PlanAdmin
              captures: { p_id: $.data.id }
            - call: "POST /participants/${p_id}/enroll"
              payload: {}
              as: PlanAdmin
            - call: "POST /contribution-periods"
              payload: { participant_id: "${p_id}", period_end_date: "2026-06-15T00:00:00Z", gross_compensation_cents: 500000 }
              as: PlanAdmin
              captures: { cp_id: $.data.id }
          trigger:
            - call: "POST /contribution-periods/${cp_id}/close"
              payload: {}
              as: PlanAdmin
          assert:
            - "ContributionPeriod.${cp_id}.employer_match_cents == 17500"
            - "Participant.${p_id}.employer_balance_cents == 17500"
            - "Participant.${p_id}.vested_employer_balance_cents == 7000"

  # ===========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_business_fiscal_on_loan_disburse
        grounds:
          - validations[priority=4]
          - validations[priority=10]
          - state_machines.Loan.REQUESTED_to_DISBURSED
          - errors[ERR_INVALID_STATE]
          - errors[ERR_LOAN_EXCEEDS_LIMIT]
        distinguishing_aspect: |
          Priority pair: state (priority 4) vs business_fiscal (priority 10).
          A loan already in DISBURSED state when a re-disburse is requested
          AND whose hypothetical principal also exceeds the headroom limit
          must surface ERR_INVALID_STATE (state, priority 4) NOT
          ERR_LOAN_EXCEEDS_LIMIT (business_fiscal, priority 10).
        test_recipe:
          setup:
            - "Clock at 2026-06-15."
            - "ACTIVE plan; ENROLLED participant; one DISBURSED loan whose principal is INSIDE the participant's headroom."
            - "Second disburse attempt against the same already-DISBURSED loan."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /plans"
              payload: { name: "Prio Plan", plan_year: 2026, match_formula: "TIERED", vesting_schedule: "GRADED_6" }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /plans/${plan_id}/activate"
              payload: {}
              as: PlanAdmin
            - call: "POST /participants"
              payload: { plan_id: "${plan_id}", full_name: "Ivy I", date_of_birth: "1980-06-15T00:00:00Z", hire_date: "2018-06-15T00:00:00Z", annual_compensation_cents: 50000000, deferral_rate_bps: 400 }
              as: PlanAdmin
              captures: { p_id: $.data.id }
            - call: "POST /participants/${p_id}/enroll"
              payload: {}
              as: PlanAdmin
            - call: "POST /contribution-periods"
              payload: { participant_id: "${p_id}", period_end_date: "2026-06-15T00:00:00Z", gross_compensation_cents: 10000000 }
              as: PlanAdmin
              captures: { cp_id: $.data.id }
            - call: "POST /contribution-periods/${cp_id}/close"
              payload: {}
              as: PlanAdmin
            - call: "POST /loans"
              payload: { participant_id: "${p_id}", principal_cents: 20000, term_months: 12, annual_interest_rate_bps: 700 }
              as: PlanAdmin
              captures: { loan_id: $.data.id }
            - call: "POST /loans/${loan_id}/disburse"
              payload: {}
              as: PlanAdmin
          trigger:
            - call: "POST /loans/${loan_id}/disburse"
              payload: {}
              as: PlanAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "response.status == 409"
            - "$.data.error_id == ERR_INVALID_STATE"

      - name: existence_beats_state_on_unknown_loan
        grounds:
          - validations[priority=3]
          - validations[priority=4]
          - errors[ERR_NOT_FOUND]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Different priority pair: existence (priority 3) vs state (priority 4).
          A non-existent loan id passed to POST /loans/{id}/disburse must
          return ERR_NOT_FOUND (existence, priority 3) — never
          ERR_INVALID_STATE — because the existence check fires before
          the state check.
        test_recipe:
          setup:
            - "Clock at 2026-06-15."
            - "ACTIVE plan; no Loan with the requested id exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /plans"
              payload: { name: "Existence Plan", plan_year: 2026, match_formula: "TIERED", vesting_schedule: "CLIFF_3" }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /plans/${plan_id}/activate"
              payload: {}
              as: PlanAdmin
          trigger:
            - call: "POST /loans/00000000-0000-0000-0000-000000000000/disburse"
              payload: {}
              as: PlanAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "response.status == 404"
            - "$.data.error_id == ERR_NOT_FOUND"

  # ===========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # ===========================================================================
