              payload: { qualified_plan_type: "401K", plan_sponsor_ein: "77-8889990", plan_effective_date: "2026-01-01", attestation_accepted: true }
              as: Employer
              as_user_id: "${emp3_id}"
              captures: { cert_a_id: "$.data.id" }
            - call: "POST /exemption-certifications/${cert_a_id}/decision"
              payload: { decision: "APPROVE", decision_note: "Plan document verified" }
              as: ProgramAdministrator
              as_user_id: "admin-reviewer-1"
          trigger:
            - call: "POST /employers/${emp3_id}/exemption-certifications"
              payload: { qualified_plan_type: "401K", plan_sponsor_ein: "77-8889990", plan_effective_date: "2028-12-31", attestation_accepted: true }
              as: Employer
              as_user_id: "${emp3_id}"
            - call: "POST /employers/${emp3_id}/exemption-certifications"
              payload: { qualified_plan_type: "401K", plan_sponsor_ein: "77-8889990", plan_effective_date: "2029-01-01", attestation_accepted: true }
              as: Employer
              as_user_id: "${emp3_id}"
              captures: { cert_b_id: "$.data.id" }
          assert:
            - "ExemptionCertification.${cert_a_id}.status == APPROVED"
            - "ExemptionCertification.${cert_a_id}.coverage_period_start == 2026-01-01"
            - "ExemptionCertification.${cert_a_id}.coverage_period_end == 2029-01-01"
            - "the first trigger call returns status == 409 with data.error_id == ERR_EXEMPTION_PERIOD_OVERLAP"
            - "the second trigger call returns status == 201"
            - "ExemptionCertification.${cert_b_id}.status == SUBMITTED"
            - "ExemptionCertification.${cert_b_id}.coverage_period_start == 2029-01-01"
            - "ExemptionCertification.${cert_b_id}.coverage_period_end == 2032-01-01"
            - "GET /employers/${emp3_id}/exemption-certifications returns total_count == 2"

      - name: closed_account_versus_insufficient_balance_priority_is_a_difficulty_instance
        claim_type: priority_conflict
        grounds:
          - validations.v_account_closed
