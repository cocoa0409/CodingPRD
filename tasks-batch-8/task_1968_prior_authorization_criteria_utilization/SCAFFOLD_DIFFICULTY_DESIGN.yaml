            - { call: "POST /um/prior-auth-requests/${g01}/reviewer-decision", payload: { decision: "APPROVE", reason_code: "MEDICAL_NECESSITY_MET" }, as: ClinicalReviewer, as_user_id: "u-rev-1" }
