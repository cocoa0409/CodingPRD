              as: MountainOpsDirector
              captures: { area_id: $.data.id }
            - call: "POST /mountain-ops/terrain-areas"
              payload: { season_id: "${season_id}", serving_lift_id: "${lift_id}", trail_code: "T2", name: "Eastridge", terrain_class: "BLUE", acres: 18.0, min_open_base_depth_in: 30, avalanche_terrain: false }
              as: MountainOpsDirector
              captures: { area2: $.data.id }
            - call: "POST /mountain-ops/terrain-areas"
              payload: { season_id: "${season_id}", serving_lift_id: "${lift_id}", trail_code: "T3", name: "Westbowl", terrain_class: "BLUE", acres: 18.0, min_open_base_depth_in: 30, avalanche_terrain: false }
