scaffold_corner_design:

  # =================================================================
  - section: entities
    instances:
      - name: asset_create_returns_all_fields
        claim_type: creation
        grounds:
          - entities.Asset
          - endpoints
        distinguishing_aspect: "POST /assets with all required fields returns 201 with a server-minted id, version 1, status ACTIVE, and null pci_score/condition_state."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /assets"
              payload: { asset_class: "SIGNAL", gis_segment_id: "SEG-A1", location_desc: "Signal 1", install_date: "2022-01-01T00:00:00Z", replacement_value_cents: 300000 }
              as: Supervisor
              captures: { asset_id: $.data.id, st: $.data.status, ver: $.data.version }
          assert:
            - "response code == 201"
            - "Asset.${asset_id}.status == ACTIVE"
            - "Asset.${asset_id}.version == 1"
            - "Asset.${asset_id}.pci_score == null"
            - "Asset.${asset_id}.condition_state == null"

      - name: asset_get_not_found_returns_404
        claim_type: not_found
        grounds:
          - entities.Asset
          - errors[ERR_ASSET_NOT_FOUND]
        distinguishing_aspect: "GET /assets/{unknown-uuid} returns ERR_ASSET_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /assets/00000000-0000-0000-0000-0000000000aa"
              payload: {}
              as: Supervisor
              captures: { err_id: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_ASSET_NOT_FOUND"

      - name: inspection_missing_required_field_returns_validation
        claim_type: required_fields
        grounds:
          - entities.Inspection
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "POST /inspections omitting the required raw_distress_index returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["One asset"]
          setup_api_calls:
            - call: "POST /assets"
              payload: { asset_class: "ROAD", gis_segment_id: "SEG-A2", location_desc: "r", install_date: "2022-01-01T00:00:00Z", replacement_value_cents: 200000 }
              as: Supervisor
              captures: { asset_id: $.data.id }
          trigger:
            - call: "POST /inspections"
              payload: { asset_id: "${asset_id}", inspection_type: "CONDITION", scheduled_window_start: "2026-03-01T08:00:00Z", scheduled_window_end: "2026-03-01T09:00:00Z" }
              as: Inspector
              captures: { err_id: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_VALIDATION"

      - name: material_item_available_qty_computed
        claim_type: computed_fields
        grounds:
          - entities.MaterialItem.fields.available_qty
          - entities.MaterialItem.fields.reserved_qty
        distinguishing_aspect: "A freshly created MaterialItem with on_hand 40 has reserved_qty 0 and available_qty 40 (computed = on_hand - reserved)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /yards"
              payload: { name: "Yard 1", location_desc: "Central yard" }
              as: Supervisor
              captures: { yard_id: $.data.id }
            - call: "POST /material-items"
              payload: { material_type: "SIGNAL_LAMP", yard_id: "${yard_id}", unit: "EACH", on_hand_qty: 40, unit_cost_cents: 900 }
              as: Supervisor
              captures: { item_id: $.data.id, avail: $.data.available_qty, resv: $.data.reserved_qty }
          assert:
            - "MaterialItem.${item_id}.reserved_qty == 0"
            - "MaterialItem.${item_id}.available_qty == 40"

      - name: service_request_priority_and_sla_computed
        claim_type: computed_fields
        grounds:
          - calculations.service_request_priority_sla
          - entities.ServiceRequest.fields.priority
          - entities.ServiceRequest.fields.sla_due_at
        distinguishing_aspect: "A SIGNAL_OUTAGE ServiceRequest created at clock 2026-06-01T00:00:00Z gets priority EMERGENCY and sla_due_at 2026-06-01T04:00:00Z (+4h)."
        test_recipe:
          setup: ["Clock 2026-06-01; one asset"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Supervisor
            - call: "POST /assets"
              payload: { asset_class: "SIGNAL", gis_segment_id: "SEG-A3", location_desc: "s", install_date: "2022-01-01T00:00:00Z", replacement_value_cents: 300000 }
              as: Supervisor
              captures: { asset_id: $.data.id }
          trigger:
            - call: "POST /service-requests"
              payload: { asset_id: "${asset_id}", channel: "PHONE", category: "SIGNAL_OUTAGE", reported_by: "Jane", location_desc: "Main & 1st" }
              as: Dispatcher
              captures: { sr_id: $.data.id, prio: $.data.priority, sla: $.data.sla_due_at }
          assert:
            - "ServiceRequest.${sr_id}.priority == EMERGENCY"
            - "ServiceRequest.${sr_id}.sla_due_at == 2026-06-01T04:00:00Z"

      - name: asset_list_pagination_envelope
        claim_type: listing
        grounds:
          - entities.Asset
          - endpoints
        distinguishing_aspect: "GET /assets?limit=1&offset=0 returns an array envelope carrying total_count and has_more."
        test_recipe:
          setup: ["Two assets"]
          setup_api_calls:
            - call: "POST /assets"
              payload: { asset_class: "ROAD", gis_segment_id: "SEG-A4", location_desc: "a", install_date: "2022-01-01T00:00:00Z", replacement_value_cents: 200000 }
              as: Supervisor
            - call: "POST /assets"
              payload: { asset_class: "SIGN", gis_segment_id: "SEG-A5", location_desc: "b", install_date: "2022-01-01T00:00:00Z", replacement_value_cents: 40000 }
              as: Supervisor
          trigger:
            - call: "GET /assets?limit=1&offset=0"
              payload: {}
              as: Supervisor
              captures: { first_id: "$.data[0].id" }
          assert:
            - "response meta present; response envelope carries total_count == 2 and has_more == true"

  # =================================================================
  - section: state_machines
    instances:
      - name: workorder_start_from_draft_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.WorkOrder.DISPATCHED_to_IN_PROGRESS
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "POST /work-orders/{id}/start on a DRAFT (not DISPATCHED) WorkOrder returns ERR_INVALID_STATE; no state change."
        test_recipe:
          setup: ["A DRAFT work order"]
          setup_api_calls:
            - call: "POST /assets"
              payload: { asset_class: "ROAD", gis_segment_id: "SEG-A6", location_desc: "c", install_date: "2022-01-01T00:00:00Z", replacement_value_cents: 200000 }
              as: Supervisor
              captures: { asset_id: $.data.id }
            - call: "POST /work-orders"
              payload: { asset_id: "${asset_id}", work_type: "MAINTENANCE", origin: "PREVENTIVE" }
              as: Dispatcher
              captures: { wo_id: $.data.id }
          trigger:
            - call: "POST /work-orders/${wo_id}/start"
              payload: {}
              as: CrewLead
              captures: { err_id: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_INVALID_STATE"

      - name: inspection_decision_on_draft_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Inspection.SUBMITTED_to_ACCEPTED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "POST /inspections/{id}/decision on a DRAFT (never submitted) inspection returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["A DRAFT inspection"]
          setup_api_calls:
            - call: "POST /assets"
              payload: { asset_class: "ROAD", gis_segment_id: "SEG-A7", location_desc: "d", install_date: "2022-01-01T00:00:00Z", replacement_value_cents: 200000 }
              as: Supervisor
              captures: { asset_id: $.data.id }
            - call: "POST /inspections"
              payload: { asset_id: "${asset_id}", inspection_type: "CONDITION", raw_distress_index: 10, scheduled_window_start: "2026-03-01T08:00:00Z", scheduled_window_end: "2026-03-01T09:00:00Z" }
              as: Inspector
              as_user_id: "insp-x"
              captures: { insp_id: $.data.id }
          trigger:
            - call: "POST /inspections/${insp_id}/decision"
              payload: { decision: "ACCEPT" }
              as: Supervisor
              as_user_id: "sup-x"
              captures: { err_id: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_INVALID_STATE"

      - name: workorder_cancel_twice_returns_already_terminal
        claim_type: terminal_lockdown
        grounds:
          - state_machines.WorkOrder.DRAFT_to_CANCELLED
          - errors[ERR_ALREADY_TERMINAL]
        distinguishing_aspect: "Cancelling an already CANCELLED WorkOrder returns ERR_ALREADY_TERMINAL."
        test_recipe:
          setup: ["A DRAFT work order that is cancelled once"]
          setup_api_calls:
            - call: "POST /assets"
              payload: { asset_class: "ROAD", gis_segment_id: "SEG-A8", location_desc: "e", install_date: "2022-01-01T00:00:00Z", replacement_value_cents: 200000 }
              as: Supervisor
              captures: { asset_id: $.data.id }
            - call: "POST /work-orders"
              payload: { asset_id: "${asset_id}", work_type: "MAINTENANCE", origin: "PREVENTIVE" }
              as: Dispatcher
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/cancel"
              payload: {}
              as: Dispatcher
          trigger:
            - call: "POST /work-orders/${wo_id}/cancel"
              payload: {}
              as: Dispatcher
              captures: { err_id: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_ALREADY_TERMINAL"

      - name: asset_retire_twice_returns_already_terminal
        claim_type: terminal_lockdown
        grounds:
          - state_machines.Asset.ACTIVE_to_RETIRED
          - errors[ERR_ALREADY_TERMINAL]
        distinguishing_aspect: "Retiring an already RETIRED asset returns ERR_ALREADY_TERMINAL."
        test_recipe:
          setup: ["An ACTIVE asset retired once"]
          setup_api_calls:
            - call: "POST /assets"
              payload: { asset_class: "SIGN", gis_segment_id: "SEG-A9", location_desc: "f", install_date: "2022-01-01T00:00:00Z", replacement_value_cents: 40000 }
              as: Supervisor
              captures: { asset_id: $.data.id }
            - call: "POST /assets/${asset_id}/retire"
              payload: {}
              as: Supervisor
          trigger:
            - call: "POST /assets/${asset_id}/retire"
              payload: {}
              as: Supervisor
              captures: { err_id: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_ALREADY_TERMINAL"

      - name: servicerequest_triage_duplicate_self_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.ServiceRequest.NEW_to_DUPLICATE
          - validations[priority=11]
          - errors[ERR_DUPLICATE_SELF]
        distinguishing_aspect: "Triaging a ServiceRequest as a duplicate of itself returns ERR_DUPLICATE_SELF."
        test_recipe:
          setup: ["A NEW service request"]
          setup_api_calls:
            - call: "POST /assets"
              payload: { asset_class: "ROAD", gis_segment_id: "SEG-B1", location_desc: "g", install_date: "2022-01-01T00:00:00Z", replacement_value_cents: 200000 }
              as: Supervisor
              captures: { asset_id: $.data.id }
            - call: "POST /service-requests"
              payload: { asset_id: "${asset_id}", channel: "WEB", category: "POTHOLE", reported_by: "Al", location_desc: "x" }
              as: Dispatcher
              captures: { sr_id: $.data.id }
          trigger:
            - call: "POST /service-requests/${sr_id}/triage"
              payload: { duplicate_of_id: "${sr_id}" }
              as: Dispatcher
              captures: { err_id: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_DUPLICATE_SELF"

      - name: row_permit_release_after_denied_returns_invalid_or_terminal
        claim_type: terminal_lockdown
        grounds:
          - state_machines.ROWPermit.REQUESTED_to_DENIED
          - errors[ERR_ALREADY_TERMINAL]
        distinguishing_aspect: "Releasing a DENIED (terminal) ROW permit returns ERR_ALREADY_TERMINAL."
        test_recipe:
          setup: ["A DENIED ROW permit"]
          setup_api_calls:
            - call: "POST /assets"
              payload: { asset_class: "ROAD", gis_segment_id: "SEG-B2", location_desc: "h", install_date: "2022-01-01T00:00:00Z", replacement_value_cents: 200000 }
              as: Supervisor
              captures: { asset_id: $.data.id }
            - call: "POST /work-orders"
              payload: { asset_id: "${asset_id}", work_type: "CAPITAL", origin: "PREVENTIVE" }
              as: Dispatcher
              captures: { wo_id: $.data.id }
            - call: "POST /row-permits"
              payload: { work_order_id: "${wo_id}", permit_type: "UTILITY_COORD", gis_segment_id: "SEG-B2", window_start: "2026-06-02T08:00:00Z", window_end: "2026-06-02T12:00:00Z", clearance_required: false }
              as: Coordinator
              captures: { permit_id: $.data.id }
            - call: "POST /row-permits/${permit_id}/decision"
              payload: { decision: "DENY" }
              as: Coordinator
          trigger:
            - call: "POST /row-permits/${permit_id}/release"
              payload: {}
              as: Coordinator
              captures: { err_id: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_ALREADY_TERMINAL"

  # =================================================================
  - section: calculations
    instances:
      - name: capitalization_betterment_reclassifies_maintenance_to_capital
        claim_type: correct_result
        grounds:
          - calculations.capitalization_determination
          - entities.WorkOrder.fields.capitalized
          - entities.Asset.fields.capital_cost_to_date_cents
        distinguishing_aspect: "A MAINTENANCE WorkOrder whose actual_cost 606000 (material 600000 + labor 6000) meets both CAPITALIZATION_THRESHOLD 500000 and 25% of replacement_value 1000000 (=250000) is reclassified capitalized == true and posts to capital_cost_to_date_cents."
        test_recipe:
          setup: ["Clock 2026-06-01; asset replacement_value 1000000; asphalt item 6000/unit; a MAINTENANCE WO taken to IN_PROGRESS with a 100-unit reservation and a 1h dispatch"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Supervisor
            - call: "POST /assets"
              payload: { asset_class: "ROAD", gis_segment_id: "SEG-B3", location_desc: "big", install_date: "2022-01-01T00:00:00Z", replacement_value_cents: 1000000 }
              as: Supervisor
              captures: { asset_id: $.data.id }
            - call: "POST /yards"
              payload: { name: "Yard 1", location_desc: "Central yard" }
              as: Supervisor
              captures: { yard_id: $.data.id }
            - call: "POST /material-items"
              payload: { material_type: "ASPHALT_TON", yard_id: "${yard_id}", unit: "TON", on_hand_qty: 200, unit_cost_cents: 6000 }
              as: Supervisor
              captures: { item_id: $.data.id, item_v0: $.data.version }
            - call: "POST /crews"
              payload: { name: "Paving X", crew_type: "PAVING", hourly_rate_cents: 6000 }
              as: Supervisor
              captures: { crew_id: $.data.id, crew_v0: $.data.version }
            - call: "POST /work-orders"
              payload: { asset_id: "${asset_id}", work_type: "MAINTENANCE", origin: "PREVENTIVE" }
              as: Dispatcher
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/schedule"
              payload: { scheduled_start: "2026-06-02T06:00:00Z", scheduled_end: "2026-06-02T20:00:00Z" }
              as: Dispatcher
            - call: "POST /material-reservations"
              payload: { work_order_id: "${wo_id}", material_item_id: "${item_id}", qty: 100, expected_material_item_version: "${item_v0}" }
              as: Dispatcher
            - call: "POST /dispatches"
              payload: { work_order_id: "${wo_id}", crew_id: "${crew_id}", window_start: "2026-06-02T08:00:00Z", window_end: "2026-06-02T10:00:00Z", labor_hours: 1, expected_crew_version: "${crew_v0}" }
              as: Dispatcher
            - call: "POST /work-orders/${wo_id}/dispatch"
              payload: {}
              as: Dispatcher
            - call: "POST /work-orders/${wo_id}/start"
              payload: {}
              as: CrewLead
          trigger:
            - call: "POST /work-orders/${wo_id}/complete"
              payload: {}
              as: CrewLead
              captures: { cap: $.data.capitalized, cost: $.data.actual_cost_cents }
          assert:
            - "WorkOrder.${wo_id}.actual_cost_cents == 606000"
            - "WorkOrder.${wo_id}.capitalized == true"
            - "Asset.${asset_id}.capital_cost_to_date_cents == 606000"
            - "Asset.${asset_id}.maintenance_cost_to_date_cents == 0"

      - name: labor_cost_at_regular_threshold_no_overtime
        claim_type: correct_result
        grounds:
          - calculations.labor_cost
          - entities.Dispatch.fields.labor_cost_cents
        distinguishing_aspect: "labor_hours exactly 8 at rate 6000 yields labor_cost_cents 48000 (within_regular variant, no overtime term)."
        test_recipe:
          setup: ["Clock 2026-06-01; crew 6000/hr; SCHEDULED WO"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Supervisor
            - call: "POST /assets"
              payload: { asset_class: "ROAD", gis_segment_id: "SEG-B4", location_desc: "i", install_date: "2022-01-01T00:00:00Z", replacement_value_cents: 200000 }
              as: Supervisor
              captures: { asset_id: $.data.id }
            - call: "POST /crews"
              payload: { name: "Paving Y", crew_type: "PAVING", hourly_rate_cents: 6000 }
              as: Supervisor
              captures: { crew_id: $.data.id, crew_v0: $.data.version }
            - call: "POST /work-orders"
              payload: { asset_id: "${asset_id}", work_type: "MAINTENANCE", origin: "PREVENTIVE" }
              as: Dispatcher
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/schedule"
              payload: { scheduled_start: "2026-06-02T06:00:00Z", scheduled_end: "2026-06-02T20:00:00Z" }
              as: Dispatcher
          trigger:
            - call: "POST /dispatches"
              payload: { work_order_id: "${wo_id}", crew_id: "${crew_id}", window_start: "2026-06-02T08:00:00Z", window_end: "2026-06-02T16:00:00Z", labor_hours: 8, expected_crew_version: "${crew_v0}" }
              as: Dispatcher
              captures: { d_id: $.data.id, cost: $.data.labor_cost_cents }
          assert:
            - "Dispatch.${d_id}.labor_cost_cents == 48000"

  # =================================================================
  - section: validations
    instances:
      - name: missing_auth_header_returns_unauthenticated
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "POST /assets with no X-User-Role/X-User-ID headers returns ERR_UNAUTHENTICATED (401)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /assets"
              payload: { asset_class: "ROAD", gis_segment_id: "SEG-B5", location_desc: "j", install_date: "2022-01-01T00:00:00Z", replacement_value_cents: 200000 }
              as: Anonymous
              captures: { err_id: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_UNAUTHENTICATED"

      - name: segregation_of_duties_same_user_accepts_own_inspection_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=7]
          - errors[ERR_SEGREGATION_OF_DUTIES]
        distinguishing_aspect: "When the Supervisor accepting a SUBMITTED inspection has X-User-ID equal to inspection.inspector_id, acceptance returns ERR_SEGREGATION_OF_DUTIES (403)."
        test_recipe:
          setup: ["A SUBMITTED inspection created by user 'dual-1'"]
          setup_api_calls:
            - call: "POST /assets"
              payload: { asset_class: "ROAD", gis_segment_id: "SEG-B6", location_desc: "k", install_date: "2022-01-01T00:00:00Z", replacement_value_cents: 200000 }
              as: Supervisor
              captures: { asset_id: $.data.id }
            - call: "POST /inspections"
              payload: { asset_id: "${asset_id}", inspection_type: "CONDITION", raw_distress_index: 10, scheduled_window_start: "2026-03-01T08:00:00Z", scheduled_window_end: "2026-03-01T09:00:00Z" }
              as: Inspector
              as_user_id: "dual-1"
              captures: { insp_id: $.data.id }
            - call: "POST /inspections/${insp_id}/submit"
              payload: {}
              as: Inspector
              as_user_id: "dual-1"
          trigger:
            - call: "POST /inspections/${insp_id}/decision"
              payload: { decision: "ACCEPT" }
              as: Supervisor
              as_user_id: "dual-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_SEGREGATION_OF_DUTIES"

      - name: asset_retire_with_open_workorder_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=12]
          - errors[ERR_ASSET_HAS_OPEN_WORKORDER]
        distinguishing_aspect: "Retiring an asset that still has a DRAFT (non-terminal) WorkOrder returns ERR_ASSET_HAS_OPEN_WORKORDER."
        test_recipe:
          setup: ["An ACTIVE asset with one DRAFT work order"]
          setup_api_calls:
            - call: "POST /assets"
              payload: { asset_class: "ROAD", gis_segment_id: "SEG-B7", location_desc: "l", install_date: "2022-01-01T00:00:00Z", replacement_value_cents: 200000 }
              as: Supervisor
              captures: { asset_id: $.data.id }
            - call: "POST /work-orders"
              payload: { asset_id: "${asset_id}", work_type: "MAINTENANCE", origin: "PREVENTIVE" }
              as: Dispatcher
          trigger:
            - call: "POST /assets/${asset_id}/retire"
              payload: {}
              as: Supervisor
              captures: { err_id: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_ASSET_HAS_OPEN_WORKORDER"

      - name: dispatch_workorder_without_reserved_dispatch_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=9]
          - errors[ERR_NO_DISPATCH_FOR_WORKORDER]
        distinguishing_aspect: "Dispatching a SCHEDULED WorkOrder that has no RESERVED Dispatch returns ERR_NO_DISPATCH_FOR_WORKORDER."
        test_recipe:
          setup: ["A SCHEDULED work order with no dispatch and no clearance-required permits"]
          setup_api_calls:
            - call: "POST /assets"
              payload: { asset_class: "ROAD", gis_segment_id: "SEG-B8", location_desc: "m", install_date: "2022-01-01T00:00:00Z", replacement_value_cents: 200000 }
              as: Supervisor
              captures: { asset_id: $.data.id }
            - call: "POST /work-orders"
              payload: { asset_id: "${asset_id}", work_type: "MAINTENANCE", origin: "PREVENTIVE" }
              as: Dispatcher
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/schedule"
              payload: { scheduled_start: "2026-06-02T06:00:00Z", scheduled_end: "2026-06-02T20:00:00Z" }
              as: Dispatcher
          trigger:
            - call: "POST /work-orders/${wo_id}/dispatch"
              payload: {}
              as: Dispatcher
              captures: { err_id: $.data.error_id }
          assert:
