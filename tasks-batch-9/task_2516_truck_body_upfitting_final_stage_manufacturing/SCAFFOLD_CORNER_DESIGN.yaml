          assert:
            - "HTTP 422 with error_id == \"ERR_CAB_TO_AXLE_INSUFFICIENT\", NOT \"ERR_WHEELBASE_INSUFFICIENT\", even though both book limits are violated"
            - "no BuildConfiguration row named CFG-BAD-SVC exists afterwards"
            - "the same POST with body_spec_id ${bs_dump} and config_code CFG-DUMP-B returns 201 with status \"DRAFT\" — both requirements met at exact equality"
            - "the same pairing is re-checked at order release, so a configuration published before a body spec's minimums were revised cannot smuggle an under-wheelbased truck into production"

      - name: slot_that_starts_before_the_unit_arrives_is_rejected
