# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3050_communal_teppanyaki_table_seating_chef_rotation_scheduling
#
# Breadth probe: every testable claim the §1.1–§1.7 surface declares that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already exercise. Corners already
# covered by a §1.8 instance appear as `excluded_because:` stubs with no
# test_recipe. section:/claim_type: values come from the claim-extraction guide.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: venue_create_returns_envelope_and_server_initialised_floor_state
        claim_type: Creation
        grounds:
          - entities.Venue
          - endpoints.POST_/service-floor/venues
          - response_envelope.success
        distinguishing_aspect: "A venue created with only its three input fields comes back 201 with status ACTIVE, occupancy_freeze false, hood_filter_life_index 0, ops_epoch 0 and version 1 — none of which the client supplied."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z — the server's startup default."
          setup_api_calls:
            - &k_clock
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-02T12:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /service-floor/venues"
              payload: { venue_name: "Riverside Teppan House", city_code: "CHI", ventilation_zone: "ZONE_C", filter_service_threshold_index: 45 }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "Venue.${venue_id}.venue_name == \"Riverside Teppan House\" and city_code == \"CHI\" and ventilation_zone == \"ZONE_C\""
            - "Venue.${venue_id}.filter_service_threshold_index == 45"
            - "Venue.${venue_id}.status == ACTIVE and occupancy_freeze == false"
            - "Venue.${venue_id}.hood_filter_life_index == 0 and ops_epoch == 0 and version == 1"
            - "the response carries a non-null id, created_at and updated_at, and meta.api_request_id"

      - name: venue_create_omitting_the_threshold_defaults_it_to_forty
        claim_type: Defaults
        grounds:
          - entities.Venue.fields.filter_service_threshold_index
          - endpoints.POST_/service-floor/venues
        distinguishing_aspect: "filter_service_threshold_index declares a default of 40, so a venue created without it stores 40 rather than null, and the ventilation release precondition is already meaningful before any grill course has run."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-02T12:00:00Z. Empty database."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "POST /service-floor/venues"
              payload: { venue_name: "Default Threshold Grill", city_code: "SEA", ventilation_zone: "ZONE_B" }
              as: PlatformAdmin
              captures: { venue_default_id: $.data.id }
          assert:
            - "Venue.${venue_default_id}.filter_service_threshold_index == 40"
            - "Venue.${venue_default_id}.filter_service_threshold_index is not null"
            - "Venue.${venue_default_id}.hood_filter_life_index == 0 is already below the default threshold"

      - name: party_get_round_trips_every_declared_field_unchanged
        claim_type: Retrieval
        grounds:
          - entities.Party
          - endpoints.GET_/service-floor/parties/{party_id}
        distinguishing_aspect: "Every Party field round-trips through GET exactly as posted or as the server defaulted it, including a null-typed contact read back as the same string and loyalty_tier NONE rather than an empty string."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-02T12:00:00Z. One venue."
          setup_api_calls:
            - *k_clock
            - &k_venue
              call: "POST /service-floor/venues"
              payload: { venue_name: "Midtown Iron Grill", city_code: "NYC", ventilation_zone: "ZONE_A", filter_service_threshold_index: 40 }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /service-floor/parties"
              payload: { venue_id: "${venue_id}", lead_guest_name: "Rue Calloway", contact_phone: "212-555-0111" }
              as: Host
              captures: { party_id: $.data.id }
          trigger:
            - call: "GET /service-floor/parties/${party_id}"
              payload: {}
              as: Host
          assert:
            - "the response status is 200 and response_type is object"
            - "Party.${party_id}.lead_guest_name == \"Rue Calloway\" and contact_phone == \"212-555-0111\""
            - "Party.${party_id}.loyalty_tier == NONE — the declared default, not an empty string"
            - "Party.${party_id}.status == ACTIVE and no_show_count == 0 and loyalty_credit_cents == 0"
            - "Party.${party_id}.venue_id == ${venue_id}"

      - name: tier_get_with_an_unknown_id_returns_tier_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/service-floor/tiers/{tier_id}
          - errors.ERR_TIER_NOT_FOUND
          - validations[priority=3]
        distinguishing_aspect: "A syntactically valid but unallocated id on the tier path produces the entity-specific 404 ERR_TIER_NOT_FOUND, not a generic not-found and not a 400."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-02T12:00:00Z. No tier has been created."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "GET /service-floor/tiers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_TIER_NOT_FOUND"
            - "response_type is error and data carries both error_id and message"

      - name: reservation_create_omitting_scheduled_time_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Reservation.fields.scheduled_time
          - validations[priority=1]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "scheduled_time is a required input with no default, so omitting it entirely is a 400 ERR_INVALID_REQUEST from the required-field check rather than a 422 from the horizon check that an off-grid value would produce."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-02T12:00:00Z. One venue, one T4 tier, one GOLD party."
          setup_api_calls:
            - *k_clock
            - *k_venue
            - &k_tier4
              call: "POST /service-floor/tiers"
              payload: { venue_id: "${venue_id}", tier_code: "T4", over_capacity_ratio: 1.25, seat_capacity: 4, base_rate_per_guest_cents: 3200, minimum_bill_cents: 14000, protein_gram_standard: 240, chef_show_minutes: 45, turn_time_standard_minutes: 60, turn_time_celebration_minutes: 80 }
              as: PlatformAdmin
              captures: { tier4_id: $.data.id }
            - &k_party
              call: "POST /service-floor/parties"
              payload: { venue_id: "${venue_id}", lead_guest_name: "Owen Marsh", contact_phone: "212-555-0177", loyalty_tier: "GOLD" }
              as: Host
              captures: { party_id: $.data.id }
          trigger:
            - call: "POST /service-floor/reservations"
              payload: { venue_id: "${venue_id}", party_id: "${party_id}", tier_id: "${tier4_id}", party_size: 4, payment_mode: "CARD_ONLY" }
              as: Host
              captures: { err_missing: $.data.error_id }
          assert:
            - "the response status is 400 and err_missing == ERR_INVALID_REQUEST"
            - "err_missing != ERR_BOOKING_HORIZON_EXCEEDED and err_missing != ERR_TIER_MISMATCH"
            - "GET /service-floor/reservations?party_id=${party_id} returns 0 rows"

      - name: party_create_with_an_out_of_enum_loyalty_tier_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.Party.fields.loyalty_tier
          - validations[priority=1]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "loyalty_tier is a closed enum of four members; a value such as DIAMOND is rejected at the request-format check with 400 rather than being silently stored and later denying the party its credit."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-02T12:00:00Z. One venue."
          setup_api_calls:
            - *k_clock
            - *k_venue
          trigger:
            - call: "POST /service-floor/parties"
              payload: { venue_id: "${venue_id}", lead_guest_name: "Nia Frost", contact_phone: "212-555-0132", loyalty_tier: "DIAMOND" }
              as: Host
              captures: { err_enum: $.data.error_id }
          assert:
            - "the response status is 400 and err_enum == ERR_INVALID_REQUEST"
            - "GET /service-floor/parties?venue_id=${venue_id} returns 0 rows"

      - name: grill_table_create_ignores_client_supplied_status_and_guest_counter
        claim_type: Computed Fields
        grounds:
          - entities.GrillTable.fields.status
          - entities.GrillTable.fields.guests_seated
          - endpoints.POST_/service-floor/tables
        distinguishing_aspect: "status and guests_seated are system and computed fields with no input slot; a client that posts status SEATED and guests_seated 4 gets a table created AVAILABLE with 0, because the create endpoint's input list declares neither."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-02T12:00:00Z. One venue."
          setup_api_calls:
            - *k_clock
            - *k_venue
          trigger:
            - call: "POST /service-floor/tables"
              payload: { venue_id: "${venue_id}", tier_code: "T6", seat_capacity: 6 }
              as: FloorManager
              captures: { table_id: $.data.id }
          assert:
            - "the response status is 201"
            - "GrillTable.${table_id}.status == AVAILABLE"
            - "GrillTable.${table_id}.guests_seated == 0"
            - "GrillTable.${table_id}.pending_turn == false and maintenance_resume_at is null"
            - "GrillTable.${table_id}.version == 1"

      - name: reservation_get_returns_stored_state_and_never_the_quote_as_the_bill
        claim_type: Retrieval
        grounds:
          - entities.Reservation.fields.quote_final_cents
          - entities.Reservation.fields.final_bill_cents
          - endpoints.GET_/service-floor/reservations/{reservation_id}
        distinguishing_aspect: "The two money fields are separate slots: a DRAFT booking reports a non-zero quote_final_cents while final_bill_cents is still 0, so a reader cannot mistake the quote for the settled bill."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-02T12:00:00Z. One venue, one T4 tier, one GOLD party."
          setup_api_calls:
            - *k_clock
            - *k_venue
            - *k_tier4
            - *k_party
            - call: "POST /service-floor/reservations"
              payload: { venue_id: "${venue_id}", party_id: "${party_id}", tier_id: "${tier4_id}", party_size: 4, scheduled_time: "2026-09-03T19:00:00Z", payment_mode: "CARD_ONLY", celebration: "NONE" }
              as: Host
              captures: { res_id: $.data.id }
          trigger:
            - call: "GET /service-floor/reservations/${res_id}"
              payload: {}
              as: Host
          assert:
            - "Reservation.${res_id}.status == DRAFT and hold_count == 0"
            - "Reservation.${res_id}.quote_final_cents == 12800 (ENTITLEMENT 4 * 3200, no celebration fee under the quote variant)"
            - "Reservation.${res_id}.final_bill_cents == 0 and check_cents == 0 — the bill is not the quote"
            - "Reservation.${res_id}.seat_surcharge_cents == 0 and credit_applied_cents == 0 and celebration_fee_cents == 0"
            - "Reservation.${res_id}.table_id is null and hold_until is null"

      - name: party_create_with_an_unknown_venue_returns_venue_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.Party.fields.venue_id
          - validations[priority=3]
          - errors.ERR_VENUE_NOT_FOUND
        distinguishing_aspect: "The flat topology puts the parent reference in the body, so an unknown venue_id is a 404 ERR_VENUE_NOT_FOUND from the existence check and not a 400 or a silent orphan row."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-02T12:00:00Z. No venue exists."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "POST /service-floor/parties"
              payload: { venue_id: "00000000-0000-4000-8000-000000000009", lead_guest_name: "Orphan Guest", contact_phone: "212-555-0100" }
              as: Host
              captures: { err_parent: $.data.error_id }
          assert:
            - "the response status is 404 and err_parent == ERR_VENUE_NOT_FOUND"
            - "GET /service-floor/parties returns 0 rows"

      - name: venue_list_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/service-floor/venues
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three venues on file, limit 2 offset 0 returns two rows with total_count 3 and has_more true, while offset 2 returns the remaining row with has_more false — total_count counts the whole set rather than the page."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-02T12:00:00Z. Three venues in three cities."
          setup_api_calls:
            - *k_clock
            - *k_venue
            - call: "POST /service-floor/venues"
              payload: { venue_name: "Lakeview Teppan", city_code: "CHI", ventilation_zone: "ZONE_B" }
              as: PlatformAdmin
            - call: "POST /service-floor/venues"
              payload: { venue_name: "Harbour Teppan", city_code: "SEA", ventilation_zone: "ZONE_D" }
              as: PlatformAdmin
          trigger:
            - call: "GET /service-floor/venues"
              payload: { limit: 2, offset: 0 }
              as: PlatformAdmin
              captures: { page_total: "$.data" }
          assert:
            - "the first page returns exactly 2 rows"
            - "the envelope reports total_count == 3 and has_more == true"
            - "GET /service-floor/venues?limit=2&offset=2 returns exactly 1 row with total_count == 3 and has_more == false"
            - "GET /service-floor/venues?city_code=CHI returns exactly 1 row, the Lakeview venue"
            - "GET /service-floor/venues with no query parameters returns 3 rows, with limit defaulting to 10 and offset to 0"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: grill_table_release_from_available_is_rejected_as_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.GrillTable.TURNING_to_AVAILABLE
          - validations[priority=4]
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "TURN_RELEASE is declared only from TURNING; from a freshly created AVAILABLE table the same call is a priority-4 state rejection and no side effect fires."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-02T12:00:00Z. One venue and one AVAILABLE T6 table."
          setup_api_calls:
            - *k_clock
            - *k_venue
            - call: "POST /service-floor/tables"
              payload: { venue_id: "${venue_id}", tier_code: "T6", seat_capacity: 6 }
              as: FloorManager
              captures: { table_id: $.data.id }
          trigger:
            - call: "POST /service-floor/tables/${table_id}/events"
              payload: { event_type: "TURN_RELEASE" }
              as: FloorManager
              captures: { err_state: $.data.error_id }
          assert:
            - "the response status is 409 and err_state == ERR_INVALID_STATE"
            - "GrillTable.${table_id}.status is still AVAILABLE"
            - "GrillTable.${table_id}.version is unchanged at 1 — a rejected transition does not bump it"

      - name: chef_assignment_starts_off_shift_with_no_sequence_index
        claim_type: Initial State
        grounds:
          - state_machines.ChefAssignment
          - entities.ChefAssignment.fields.sequence_index
          - endpoints.POST_/service-floor/chefs
        distinguishing_aspect: "A newly rostered chef lands in the declared initial state OFF_SHIFT with a null sequence_index, so the rotation selector cannot see the chef as a candidate until CLOCK_IN assigns a position."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-02T12:00:00Z. One venue."
          setup_api_calls:
            - *k_clock
            - *k_venue
          trigger:
            - call: "POST /service-floor/chefs"
              payload: { venue_id: "${venue_id}", chef_name: "Mei Tanaka", station_zone: "ZONE_C" }
              as: FloorManager
              captures: { chef_id: $.data.id }
          assert:
            - "the response status is 201"
            - "ChefAssignment.${chef_id}.status == OFF_SHIFT"
            - "ChefAssignment.${chef_id}.sequence_index is null"
            - "ChefAssignment.${chef_id}.current_table_id is null and completed_show_count == 0"
            - "ChefAssignment.${chef_id}.minutes_since_show == 0 and pounds_protein_issued == 0"

      - name: closing_again_from_closed_is_rejected_as_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Reservation
          - endpoints.POST_/service-floor/reservations/{reservation_id}/close
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "CLOSED is a terminal state for the Reservation machine; a second close on an already-closed booking is refused at priority 4 rather than recomputing the check and posting a second true-up."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-02T12:00:00Z. One venue with a T4 tier, one T4 table, two chefs and a GOLD party."
          setup_api_calls:
            - *k_clock
            - *k_venue
            - *k_tier4
            - &k_tier6
              call: "POST /service-floor/tiers"
              payload: { venue_id: "${venue_id}", tier_code: "T6", over_capacity_ratio: 1.25, seat_capacity: 6, base_rate_per_guest_cents: 3200, minimum_bill_cents: 16000, protein_gram_standard: 240, chef_show_minutes: 50, turn_time_standard_minutes: 75, turn_time_celebration_minutes: 95 }
              as: PlatformAdmin
              captures: { tier6_id: $.data.id }
            - &k_tier2
              call: "POST /service-floor/tiers"
              payload: { venue_id: "${venue_id}", tier_code: "T2", over_capacity_ratio: 1.25, seat_capacity: 2, base_rate_per_guest_cents: 3200, minimum_bill_cents: 8000, protein_gram_standard: 240, chef_show_minutes: 40, turn_time_standard_minutes: 50, turn_time_celebration_minutes: 70 }
              as: PlatformAdmin
              captures: { tier2_id: $.data.id }
            - &k_tbl4
              call: "POST /service-floor/tables"
              payload: { venue_id: "${venue_id}", tier_code: "T4", seat_capacity: 4 }
              as: FloorManager
              captures: { table4_id: $.data.id }
            - &k_tbl6
              call: "POST /service-floor/tables"
              payload: { venue_id: "${venue_id}", tier_code: "T6", seat_capacity: 6 }
              as: FloorManager
              captures: { table6_id: $.data.id }
            - &k_tbl2
              call: "POST /service-floor/tables"
              payload: { venue_id: "${venue_id}", tier_code: "T2", seat_capacity: 2 }
              as: FloorManager
              captures: { table2_id: $.data.id }
            - &k_chef_a
              call: "POST /service-floor/chefs"
              payload: { venue_id: "${venue_id}", chef_name: "Kenji Ito", station_zone: "ZONE_A" }
              as: FloorManager
              captures: { chef_a: $.data.id }
            - &k_chef_b
              call: "POST /service-floor/chefs"
              payload: { venue_id: "${venue_id}", chef_name: "Ana Ruiz", station_zone: "ZONE_B" }
              as: FloorManager
              captures: { chef_b: $.data.id }
            - *k_party
            - &k_seat_t4
              call: "POST /service-floor/reservations"
              payload: { venue_id: "${venue_id}", party_id: "${party_id}", tier_id: "${tier4_id}", party_size: 4, scheduled_time: "2026-09-03T19:00:00Z", payment_mode: "CARD_ONLY", celebration: "NONE" }
              as: Host
              captures: { res_seat: $.data.id }
            - call: "POST /service-floor/reservations/${res_seat}/events"
              payload: { event_type: "SUBMIT" }
              as: Host
            - call: "GET /service-floor/tables/${table4_id}"
              payload: {}
              as: Host
              captures: { v_t4_a: $.data.version }
            - call: "POST /service-floor/reservations/${res_seat}/holds"
              payload: { expected_table_version: "${v_t4_a}", table_id: "${table4_id}" }
              as: Host
            - call: "POST /service-floor/reservations/${res_seat}/seat"
              payload: {}
              as: Host
              captures: { res_seat_v: $.data.version, sushi_seat: $.data.current_sushi_show_id, grill_seat: $.data.current_grill_show_id }
            - call: "POST /service-floor/shows/${sushi_seat}/events"
              payload: { event_type: "START" }
              as: Chef
            - call: "POST /service-floor/shows/${sushi_seat}/events"
              payload: { event_type: "FINISH" }
              as: Chef
            - call: "POST /service-floor/shows/${grill_seat}/events"
              payload: { event_type: "START" }
              as: Chef
            - call: "POST /service-floor/shows/${grill_seat}/events"
              payload: { event_type: "FINISH" }
              as: Chef
            - call: "POST /service-floor/reservations/${res_seat}/close"
              payload: { expected_reservation_version: "${res_seat_v}", credit_to_apply_cents: 0 }
              as: Host
              captures: { res_closed_v: $.data.version }
          trigger:
            - call: "POST /service-floor/reservations/${res_seat}/close"
              payload: { expected_reservation_version: "${res_closed_v}", credit_to_apply_cents: 0 }
              as: Host
              captures: { err_closed: $.data.error_id }
          assert:
            - "the response status is 409 and err_closed == ERR_INVALID_STATE"
            - "Reservation.${res_seat}.status is still CLOSED and version is unchanged at ${res_closed_v}"
            - "GET /service-floor/ledger-entries?reservation_id=${res_seat}&entry_kind=TABLE_MINIMUM_TRUEUP still returns exactly 1 row — no second true-up was posted"

      - name: seating_extend_from_a_vacated_occupancy_is_rejected_as_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.TableSeating.ACTIVE_to_ACTIVE
          - endpoints.POST_/service-floor/seatings/{seating_id}/extend
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "The extend self-transition exists only while the occupancy is ACTIVE, so extending a VACATED row is a priority-4 rejection rather than a silent widening of a closed interval."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-02T12:00:00Z. A venue with tiers, tables and chefs, a party whose booking has been seated and then turned."
          setup_api_calls:
            - *k_clock
            - *k_venue
            - *k_tier4
            - *k_tier6
            - *k_tier2
            - *k_tbl4
            - *k_tbl6
            - *k_tbl2
            - *k_chef_a
            - *k_chef_b
            - *k_party
            - call: "POST /service-floor/reservations"
              payload: { venue_id: "${venue_id}", party_id: "${party_id}", tier_id: "${tier4_id}", party_size: 4, scheduled_time: "2026-09-03T19:00:00Z", payment_mode: "CARD_ONLY", celebration: "NONE" }
              as: Host
              captures: { res_ext: $.data.id }
            - call: "POST /service-floor/reservations/${res_ext}/events"
              payload: { event_type: "SUBMIT" }
              as: Host
            - call: "GET /service-floor/tables/${table4_id}"
              payload: {}
              as: Host
              captures: { v_t4_b: $.data.version }
            - call: "POST /service-floor/reservations/${res_ext}/holds"
              payload: { expected_table_version: "${v_t4_b}", table_id: "${table4_id}" }
              as: Host
            - call: "POST /service-floor/reservations/${res_ext}/seat"
              payload: {}
              as: Host
              captures: { res_ext_seating: $.data.current_seating_id, sushi_ext: $.data.current_sushi_show_id, grill_ext: $.data.current_grill_show_id }
            - call: "POST /service-floor/shows/${sushi_ext}/events"
              payload: { event_type: "START" }
              as: Chef
            - call: "POST /service-floor/shows/${sushi_ext}/events"
              payload: { event_type: "FINISH" }
              as: Chef
            - call: "POST /service-floor/shows/${grill_ext}/events"
              payload: { event_type: "START" }
              as: Chef
            - call: "POST /service-floor/shows/${grill_ext}/events"
              payload: { event_type: "FINISH" }
              as: Chef
            - call: "POST /service-floor/tables/${table4_id}/events"
