              as: EyeBankCoordinator
              captures: { donor_v1: $.data.version }
            - call: "POST /eye-bank/donors/${donor_id}/serology-panels"
              payload: { specimen_type: "POST_MORTEM", drawn_at: "2026-08-03T04:00:00.000Z", hemodilution_pct: 0.00, expected_donor_version: "${donor_v1}" }
              as: LabTechnician
              captures: { panel_id: $.data.id }
            - call: "POST /eye-bank/serology-panels/${panel_id}/results"
              payload: { hiv_result: "NON_REACTIVE", hbv_result: "NON_REACTIVE", hcv_result: "NON_REACTIVE", syphilis_result: "NON_REACTIVE" }
              as: LabTechnician
            - call: "POST /eye-bank/donors/${donor_id}/approve-recovery"
              payload: {}
              as: MedicalDirector
            - call: "POST /eye-bank/recoveries"
              payload: { donor_id: "${donor_id}", technician_id: "${rt_id}", dispatched_at: "2026-08-03T06:30:00.000Z", planned_release_at: "2026-08-03T16:00:00.000Z" }
              as: EyeBankCoordinator
              captures: { rec_id: $.data.id }
