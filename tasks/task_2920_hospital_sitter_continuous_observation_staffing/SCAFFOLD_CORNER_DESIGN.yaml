      - name: lapsed_order_sweep_releases_feeds_and_restricts_the_unit
        claim_type: side_effect_execution
        grounds:
          - endpoints.POST_observation__clock_set_current_utc
          - state_machines.ObservationOrder.status.REASSESSMENT_DUE_to_LAPSED
          - state_machines.Unit.status.OPEN_to_RESTRICTED
        distinguishing_aspect: "The clock sweep is the only automatic transition source, and its LAPSED branch has three declared side effects that must all fire from one call: the feed is released with ORDER_TERMINATED, the console recounts back to IDLE freeing its observer, and the patient's unit is RESTRICTED with OBSERVATION_ORDER_LAPSED. The first advance also proves at most one transition per order per call (ACTIVE -> REASSESSMENT_DUE only, not straight to LAPSED)."
        test_recipe:
          setup:
            - "Video-enabled unit UNIT-C16 budget 250000; admitted patient age 60; ELOPEMENT-only VIDEO_MONITORING order (score 2.5, interval 24h, next due 2026-08-02T00:00:00Z)."
            - "Console CONSOLE-C16 declared_max_span 2 with one ACTIVE feed for that order (acuity weight 2.0), so the station is ACTIVE_MONITORING and the observer is ON_ASSIGNMENT."
            - "No sitter watch exists, so the ledger stays at 0 and the RESTRICTED transition can only come from the lapse."
          setup_api_calls:
            - call: "POST /observation/units"
              payload: { unit_code: "UNIT-C16", name: "Corner Unit Sixteen", observation_cost_budget_cents: 250000, video_monitoring_enabled: true }
              as: NurseManager
              captures: { u16: $.data.id }
            - call: "POST /observation/patients"
              payload: { unit_id: "${u16}", mrn: "MRN-C1601", full_name: "Corner Patient Sixteen", age_years: 60 }
              as: NurseManager
              captures: { pt16: $.data.id }
            - call: "POST /observation/staff"
              payload: { home_unit_id: "${u16}", full_name: "Corner Observer Sixteen", source_pool: "INTERNAL_FLOAT", hourly_rate_cents: 2000, competency_level: "ADVANCED", deescalation_cert_expires_on: "2027-01-01T00:00:00Z" }
              as: StaffingCoordinator
              captures: { st16: $.data.id }
            - call: "POST /observation/orders"
              payload: { patient_id: "${pt16}", ordering_provider_user_id: "prov-1", risk_categories: ["ELOPEMENT"], required_modality: "VIDEO_MONITORING", clinical_rationale: "Remote observation for exit-seeking" }
              as: AttendingProvider
              as_user_id: "prov-1"
              captures: { o16c: $.data.id }
            - call: "POST /observation/monitoring-stations"
              payload: { observer_staff_id: "${st16}", station_label: "CONSOLE-C16", declared_max_span: 2 }
              as: StaffingCoordinator
              captures: { stn16: $.data.id }
            - call: "POST /observation/video-feeds"
              payload: { station_id: "${stn16}", order_id: "${o16c}", monitor_start_at: "2026-08-01T08:00:00Z", monitor_end_at: "2026-08-02T08:00:00Z" }
              as: RemoteObserver
              as_user_id: "${st16}"
              captures: { fd16: $.data.id }
          trigger:
            - call: "POST /observation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /observation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T07:00:00Z" }
              as: SystemAdmin
          assert:
            - "FIRST ADVANCE: data.orders_marked_reassessment_due == 1 and data.orders_lapsed == 0; ObservationOrder.${o16c}.status == REASSESSMENT_DUE and lapsed_at == null"
            - "After the first advance VideoFeed.${fd16}.status is still ACTIVE and Unit.${u16}.status is still OPEN"
            - "SECOND ADVANCE: data.orders_marked_reassessment_due == 0 and data.orders_lapsed == 1"
            - "ObservationOrder.${o16c}.status == LAPSED with lapsed_at == 2026-08-02T07:00:00Z"
            - "VideoFeed.${fd16}.status == RELEASED with release_reason == ORDER_TERMINATED and released_at == 2026-08-02T07:00:00Z"
            - "MonitoringStation.${stn16}.status == IDLE with active_feed_count 0, active_acuity_weight 0.0, effective_span_limit 2; Staff.${st16}.status == AVAILABLE"
            - "Unit.${u16}.status == RESTRICTED with restriction_reason == OBSERVATION_ORDER_LAPSED and observed_cost_to_date_cents == 0"

      - name: recertification_is_the_only_exit_from_suspended
