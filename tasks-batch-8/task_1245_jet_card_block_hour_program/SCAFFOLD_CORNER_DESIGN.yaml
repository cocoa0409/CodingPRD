  # ---------------------------------------------------------------------------
  # Section: validations
  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: invalid_return_time_round_trip
        claim_type: violation_to_error
        grounds: ["validations[priority=16]", "errors[ERR_INVALID_RETURN_TIME]"]
        distinguishing_aspect: "ROUND_TRIP with requested_return_utc <= requested_departure_utc returns ERR_INVALID_RETURN_TIME."
        test_recipe:
          setup: ["Active card"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Ops
            - call: "POST /programs"
              payload:
                program_code: "VAL1"
                aircraft_category: "LIGHT"
                hours_purchased: 25
                purchase_price_cents: 10000000
                swap_ratio_to_lower: 0.90
                swap_ratio_to_higher: 1.25
                expiry_months: 18
                taxi_minutes_per_leg: 12
                min_billable_minutes_per_leg: 60
                peak_surcharge_pct: 0.15
                availability_window_hours: 24
                round_trip_discount_pct: 0.10
                early_termination_penalty_pct: 0.20
                fractional_upgrade_ratio: 0.0625
              as: Ops
              captures: { prog_v1: $.data.id }
            - call: "POST /members"
              payload:
                email: "v1@x.com"
                full_name: "V One"
                tier: "INDIVIDUAL"
                home_base_icao: "KTEB"
              as: Ops
              captures: { m_v1: $.data.id }
            - call: "POST /members/${m_v1}/cards"
              payload: { program_id: "${prog_v1}" }
              as: Ops
              captures: { c_v1: $.data.id }
            - call: "POST /cards/${c_v1}/activate"
              payload: {}
              as: Ops
          trigger:
            - call: "POST /cards/${c_v1}/trips"
