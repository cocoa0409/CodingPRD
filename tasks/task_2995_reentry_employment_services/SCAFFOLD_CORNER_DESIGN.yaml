        as: CaseManager
        as_user_id: cm-1
        captures:
          pl1_id: $.data.id
      - call: POST /placements/${pl1_id}/offer-response
        payload:
          response: ACCEPTED
        as: Participant
        as_user_id: ${p1_id}
      - call: POST /placements/${pl1_id}/work-shifts
        payload:
          starts_at: '2026-08-03T09:00:00.000Z'
          ends_at: '2026-08-03T13:00:00.000Z'
        as: CaseManager
        as_user_id: cm-1
        captures:
          w1_id: $.data.id
      - call: POST /placements/${pl1_id}/work-shifts
        payload:
          starts_at: '2026-08-04T09:00:00.000Z'
          ends_at: '2026-08-04T13:00:00.000Z'
        as: CaseManager
        as_user_id: cm-1
        captures:
          w2_id: $.data.id
      - call: POST /placements/${pl1_id}/work-shifts
