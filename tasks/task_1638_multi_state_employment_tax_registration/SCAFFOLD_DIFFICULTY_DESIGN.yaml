  # ---------------------------------------------------------------- Rule 7 ---
  - rule_id: cross_entity_state_dependency
    instances:
      - name: registration_submit_requires_confirmed_nexus
        grounds:
          - validations[priority=8]
          - state_machines.Registration.DRAFT_to_SUBMITTED
          - errors[ERR_NEXUS_NOT_CONFIRMED]
        distinguishing_aspect: |
          Entity pair Registration -> NexusCase: submit is guarded by the
          NexusCase for the registration's state being CONFIRMED; at
          THRESHOLD_MET the same call fails with ERR_NEXUS_NOT_CONFIRMED and
          succeeds after confirm.
        test_recipe:
          setup:
            - "Employer; OR-WH agency; OR employee hired 2026-08-01; OR NexusCase at THRESHOLD_MET (20 days at 2026-08-20), NOT yet confirmed; DRAFT registration"
          setup_api_calls:
            - { call: "POST /etax/employers", payload: { legal_name: "Acme Corp", fein: "123456789", home_state_code: "CA" }, as: TaxDirector, captures: { emp_id: $.data.id, emp_v: $.data.version } }
            - { call: "POST /etax/tax-agencies", payload: { agency_kind: "STATE_WITHHOLDING", state_code: "OR", agency_name: "Oregon DOR", withholding_rate_bp: 500 }, as: TaxDirector, captures: { ag_or_wh: $.data.id } }
            - { call: "POST /etax/work-locations", payload: { label: "Portland Office", address_line1: "100 Main St", city: "Portland", state_code: "OR", postal_code: "97201", location_type: "COMPANY_OFFICE" }, as: NexusAnalyst, captures: { wl_or: $.data.id } }
