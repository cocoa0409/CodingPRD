# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Cryotherapy & Recovery Lounge — Expert
# 9 rule_ids x >=2 instances. All grounds resolve to SCAFFOLD.yaml §1.1-§1.7.
# All formula-derived asserts are literals precomputed against §1.3.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: subscription_refund_provisional_vs_daily_floor
        grounds:
          - calculations.subscription_cancellation_refund
          - entities.Subscription.fields.cycle_anchor_at
          - entities.MembershipPlan.fields.monthly_fee_cents
          - endpoints["GET /subscriptions/{subscription_id}/refund-quote"]
        distinguishing_aspect: |
          On the Subscription domain, PROVISIONAL_REMAINING (round once over the
          remaining fraction) yields 10703 while FINAL_DAILY_FLOOR (floored daily
          rate over elapsed days) yields 10707 for the SAME PLUS subscription at
          11 elapsed of 30 days — a 4-cent divergence proving two valid refund
          algorithms differ.
        test_recipe:
          setup:
            - "PLUS plan: monthly_fee_cents=16900, monthly_credit_grant=8, rollover_cap=4."
            - "Clock set to 2026-06-01T00:00:00Z; member subscribes (cycle_anchor_at=2026-06-01)."
            - "Clock advanced to 2026-06-12T00:00:00Z (11 whole days elapsed, 19 remaining)."
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier: "PLUS", monthly_fee_cents: 16900, monthly_credit_grant: 8, rollover_cap: 4 }
              as: PlatformAdmin
              captures: { plus_plan_id: $.data.id }
            - call: "POST /locations"
              payload: { name: "Austin", state_code: "TX", timezone: "America/Chicago" }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /members"
              payload: { home_location_id: "${loc_id}", email: "ref1@x.com", full_name: "Ref One", state_code: "TX" }
              as: LocationManager
              captures: { m_id: $.data.id }
            - call: "POST /members/${m_id}/subscription"
              payload: { plan_id: "${plus_plan_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-12T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /subscriptions/${sub_id}/refund-quote"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
              captures: { prov: $.data.provisional_remaining_cents, fin: $.data.final_daily_floor_cents }
          assert:
            - "refund-quote.provisional_remaining_cents == 10703"
            - "refund-quote.final_daily_floor_cents == 10707"
            - "refund-quote.elapsed_days == 11"
            - "refund-quote.remaining_days == 19"

      - name: credit_pack_refund_average_vs_total_minus_consumed
        grounds:
          - calculations.credit_pack_refund
          - calculations.credit_pack_price
          - entities.CreditPack.fields.price_paid_cents
          - state_machines.CreditPack.transitions.ACTIVE_to_REFUNDED
          - endpoints["POST /members/{member_id}/credit-packs/{pack_id}/refund"]
        distinguishing_aspect: |
          On the CreditPack domain (a DIFFERENT entity from Subscription), a STD
          pack of 3 credits priced 7112 refunds 7113 under AVERAGE_PRICE_UNUSED
          (the pinned variant for non-intro packs) whereas TOTAL_MINUS_CONSUMED
          would yield 7112 — a 1-cent divergence from the rounding residue.
        test_recipe:
          setup:
            - "Member exists with no subscription; clock at 2026-06-01T00:00:00Z."
            - "Member buys a STANDARD pack of 3 credits (is_intro=false): price_paid_cents=7112, remaining_credits=3."
          setup_api_calls:
            - call: "POST /locations"
              payload: { name: "Austin", state_code: "TX", timezone: "America/Chicago" }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /members"
              payload: { home_location_id: "${loc_id}", email: "ref2@x.com", full_name: "Ref Two", state_code: "TX" }
              as: LocationManager
              captures: { m_id: $.data.id }
            - call: "POST /members/${m_id}/credit-packs"
              payload: { total_credits: 3, is_intro: false }
              as: Member
              as_user_id: "${m_id}"
              captures: { pack_id: $.data.id, price: $.data.price_paid_cents }
          trigger:
            - call: "POST /members/${m_id}/credit-packs/${pack_id}/refund"
              payload: {}
              as: LocationManager
              captures: { refunded_status: $.data.status, refund_remaining: $.data.remaining_credits }
          assert:
            - "CreditPack.${pack_id}.price_paid_cents == 7112"
            - "CreditPack.${pack_id}.status == REFUNDED"
            - "CreditPack.${pack_id}.remaining_credits == 0"
            - "The credited refund equals 7113 (AVERAGE_PRICE_UNUSED), not 7112 (TOTAL_MINUS_CONSUMED)"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: cancellation_fee_tiered_min_max_mode_a
        grounds:
          - calculations.cancellation_fee
          - entities.Booking.fields.fee_charged_cents
          - state_machines.Booking.transitions.BOOKED_to_CANCELLED
          - endpoints["POST /bookings/{booking_id}/cancel"]
        distinguishing_aspect: |
          Mode (a): fee = min(FEE_CAP, BASE + LATE_RATE*ceil((240-notice)/60))
          with 3 inputs (notice, tier-waiver, mode) and a min-cap. With notice=30
          min on a non-waived BASE tier, BASE+1500*4=8000 is capped to 5000.
        test_recipe:
          setup:
            - "BASE plan fee 9900 grant 4 (late_cancel_fee_waived=false); COMPRESSION service dur 30 buf 0 cost 1."
            - "Member on BASE subscription with an ACTIVE waiver and a COMPRESSION room; one SCHEDULED tech shift covering the slot."
            - "Booking exists at starts_at=2026-06-15T10:00:00Z; clock set to 2026-06-15T09:30:00Z (notice=30 min)."
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier: "BASE", monthly_fee_cents: 9900, monthly_credit_grant: 4, rollover_cap: 0 }
              as: PlatformAdmin
              captures: { base_plan_id: $.data.id }
            - call: "POST /service-types"
              payload: { code: "COMPRESSION", name: "Compression", duration_minutes: 30, buffer_minutes: 0, credit_cost: 1, requires_medical_clearance: false }
              as: PlatformAdmin
              captures: { svc_comp_id: $.data.id }
            - call: "POST /locations"
              payload: { name: "Austin", state_code: "TX", timezone: "America/Chicago" }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /locations/${loc_id}/rooms"
              payload: { service_type_id: "${svc_comp_id}", name: "Compression 1" }
              as: LocationManager
              captures: { room_id: $.data.id, room_v: $.data.version }
            - call: "POST /locations/${loc_id}/technicians"
              payload: { full_name: "Tech A" }
              as: LocationManager
              captures: { tech_id: $.data.id }
            - call: "POST /technicians/${tech_id}/shifts"
              payload: { location_id: "${loc_id}", starts_at: "2026-06-15T08:00:00Z", ends_at: "2026-06-15T18:00:00Z" }
              as: LocationManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /members"
              payload: { home_location_id: "${loc_id}", email: "fee@x.com", full_name: "Fee Member", state_code: "TX" }
              as: LocationManager
              captures: { m_id: $.data.id }
            - call: "POST /members/${m_id}/waivers"
              payload: { screening_answers: { heart: false }, has_contraindication: false }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /members/${m_id}/subscription"
              payload: { plan_id: "${base_plan_id}" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /bookings"
              payload: { member_id: "${m_id}", location_id: "${loc_id}", room_id: "${room_id}", starts_at: "2026-06-15T10:00:00Z", expected_room_version: "${room_v}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { booking_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T09:30:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /bookings/${booking_id}/cancel"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
              captures: { fee: $.data.fee_charged_cents, st: $.data.status }
          assert:
            - "Booking.${booking_id}.status == CANCELLED"
            - "Booking.${booking_id}.fee_charged_cents == 5000"

      - name: credit_pack_price_rounding_order_mode_b
        grounds:
          - calculations.credit_pack_price
          - entities.CreditPack.fields.price_paid_cents
          - endpoints["POST /members/{member_id}/credit-packs"]
        distinguishing_aspect: |
          Mode (b): the rounding order is pinned to round-per-credit THEN sum
          THEN fee. An intro pack of 4 credits prices to 6640 under the pinned
          order versus 6638 under the forbidden sum-then-round order.
        test_recipe:
          setup:
            - "Member exists; clock at 2026-06-01T00:00:00Z; no intro used yet."
          setup_api_calls:
            - call: "POST /locations"
              payload: { name: "Austin", state_code: "TX", timezone: "America/Chicago" }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /members"
              payload: { home_location_id: "${loc_id}", email: "price@x.com", full_name: "Price Member", state_code: "TX" }
              as: LocationManager
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /members/${m_id}/credit-packs"
              payload: { total_credits: 4, is_intro: true }
              as: Member
              as_user_id: "${m_id}"
              captures: { pack_id: $.data.id, price: $.data.price_paid_cents }
          assert:
            - "CreditPack.${pack_id}.price_paid_cents == 6640"
            - "CreditPack.${pack_id}.remaining_credits == 4"

      - name: upgrade_proration_evaluation_order_mode_c
        grounds:
          - calculations.subscription_upgrade_charge
          - entities.Subscription.fields.cycle_anchor_at
          - state_machines.Subscription.transitions.ACTIVE_to_ACTIVE
          - endpoints["POST /subscriptions/{subscription_id}/upgrade"]
        distinguishing_aspect: |
          Mode (c): proration must be computed against the CURRENT cycle anchor
          BEFORE re-anchoring. With BASE->PLUS at 10 elapsed of 30 days,
          proration=round(7000*20/30)=4667; re-anchoring first would zero
          remaining_days and yield 7000.
        test_recipe:
          setup:
            - "BASE plan fee 9900 grant 4; PLUS plan fee 16900 grant 8."
            - "Clock 2026-06-01; member subscribes BASE (cycle_anchor 2026-06-01)."
            - "Clock advanced to 2026-06-11 (10 elapsed, 20 remaining)."
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier: "BASE", monthly_fee_cents: 9900, monthly_credit_grant: 4, rollover_cap: 0 }
              as: PlatformAdmin
              captures: { base_plan_id: $.data.id }
            - call: "POST /membership-plans"
              payload: { tier: "PLUS", monthly_fee_cents: 16900, monthly_credit_grant: 8, rollover_cap: 4 }
              as: PlatformAdmin
              captures: { plus_plan_id: $.data.id }
            - call: "POST /locations"
              payload: { name: "Austin", state_code: "TX", timezone: "America/Chicago" }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /members"
              payload: { home_location_id: "${loc_id}", email: "upg@x.com", full_name: "Upg Member", state_code: "TX" }
              as: LocationManager
              captures: { m_id: $.data.id }
            - call: "POST /members/${m_id}/subscription"
              payload: { plan_id: "${base_plan_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { sub_id: $.data.id, sub_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-11T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /subscriptions/${sub_id}/upgrade"
              payload: { plan_id: "${plus_plan_id}", expected_subscription_version: "${sub_v}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { new_plan: $.data.plan_id, paid: $.data.lifetime_paid_cents }
          assert:
            - "Subscription.${sub_id}.plan_id == ${plus_plan_id}"
            - "The UPGRADE_PRORATION Invoice amount_cents == 4667 (not 7000)"
            - "Subscription.${sub_id}.granted_credits_remaining == 8"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: subscription_freeze_unfreeze_cycle
        grounds:
          - state_machines.Subscription.transitions.ACTIVE_to_FROZEN
          - state_machines.Subscription.transitions.FROZEN_to_ACTIVE
          - entities.Subscription.fields.freeze_cycles_remaining
          - endpoints["POST /subscriptions/{subscription_id}/freeze"]
          - endpoints["POST /subscriptions/{subscription_id}/unfreeze"]
        distinguishing_aspect: |
          Subscription is CYCLIC: ACTIVE->FROZEN->ACTIVE returns to the same
          status, distinct from any linear pipeline, and grants are zeroed on
          freeze then restored on unfreeze.
        test_recipe:
          setup:
            - "PLUS plan grant 8; member subscribes ACTIVE (granted_credits_remaining=8) at clock 2026-06-01."
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier: "PLUS", monthly_fee_cents: 16900, monthly_credit_grant: 8, rollover_cap: 4 }
              as: PlatformAdmin
              captures: { plus_plan_id: $.data.id }
            - call: "POST /locations"
              payload: { name: "Austin", state_code: "TX", timezone: "America/Chicago" }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /members"
              payload: { home_location_id: "${loc_id}", email: "fz@x.com", full_name: "Freeze Member", state_code: "TX" }
              as: LocationManager
              captures: { m_id: $.data.id }
            - call: "POST /members/${m_id}/subscription"
              payload: { plan_id: "${plus_plan_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /subscriptions/${sub_id}/freeze"
              payload: { freeze_cycles: 2 }
              as: Member
              as_user_id: "${m_id}"
              captures: { frozen_status: $.data.status, frozen_grant: $.data.granted_credits_remaining }
          trigger:
            - call: "POST /subscriptions/${sub_id}/unfreeze"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
              captures: { back_status: $.data.status, back_grant: $.data.granted_credits_remaining }
          assert:
            - "After freeze: Subscription.${sub_id}.status == FROZEN and granted_credits_remaining == 0"
            - "After unfreeze: Subscription.${sub_id}.status == ACTIVE and granted_credits_remaining == 8 and freeze_cycles_remaining == 0"

      - name: booking_branching_to_completed_no_show_cancelled
        grounds:
          - state_machines.Booking.transitions.BOOKED_to_COMPLETED
          - state_machines.Booking.transitions.BOOKED_to_NO_SHOW
          - state_machines.Booking.transitions.BOOKED_to_CANCELLED
          - endpoints["POST /bookings/{booking_id}/no-show"]
        distinguishing_aspect: |
          Booking (a DIFFERENT entity from Subscription) BRANCHES from BOOKED to
          three terminal states with divergent side effects: COMPLETED (no fee,
          credits kept), NO_SHOW (fee + credits forfeited), CANCELLED (fee + credit
          refund). Tested via the NO_SHOW branch forfeiting credits.
        test_recipe:
          setup:
            - "BASE plan grant 4; COMPRESSION service cost 1; member with ACTIVE waiver, COMPRESSION room, covering shift."
            - "Booking at 2026-06-15T10:00:00Z consumes 1 subscription credit (granted 4->3); clock then set to 2026-06-15T10:05:00Z (after start)."
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier: "BASE", monthly_fee_cents: 9900, monthly_credit_grant: 4, rollover_cap: 0 }
              as: PlatformAdmin
              captures: { base_plan_id: $.data.id }
            - call: "POST /service-types"
              payload: { code: "COMPRESSION", name: "Compression", duration_minutes: 30, buffer_minutes: 0, credit_cost: 1, requires_medical_clearance: false }
              as: PlatformAdmin
              captures: { svc_comp_id: $.data.id }
            - call: "POST /locations"
              payload: { name: "Austin", state_code: "TX", timezone: "America/Chicago" }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /locations/${loc_id}/rooms"
              payload: { service_type_id: "${svc_comp_id}", name: "Compression 1" }
              as: LocationManager
              captures: { room_id: $.data.id, room_v: $.data.version }
            - call: "POST /locations/${loc_id}/technicians"
              payload: { full_name: "Tech NS" }
              as: LocationManager
              captures: { tech_id: $.data.id }
            - call: "POST /technicians/${tech_id}/shifts"
              payload: { location_id: "${loc_id}", starts_at: "2026-06-15T08:00:00Z", ends_at: "2026-06-15T18:00:00Z" }
              as: LocationManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /members"
              payload: { home_location_id: "${loc_id}", email: "ns@x.com", full_name: "NS Member", state_code: "TX" }
              as: LocationManager
              captures: { m_id: $.data.id }
            - call: "POST /members/${m_id}/waivers"
              payload: { screening_answers: { heart: false }, has_contraindication: false }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /members/${m_id}/subscription"
              payload: { plan_id: "${base_plan_id}" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /bookings"
              payload: { member_id: "${m_id}", location_id: "${loc_id}", room_id: "${room_id}", starts_at: "2026-06-15T10:00:00Z", expected_room_version: "${room_v}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { booking_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T10:05:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /bookings/${booking_id}/no-show"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
              captures: { st: $.data.status, fee: $.data.fee_charged_cents }
          assert:
            - "Booking.${booking_id}.status == NO_SHOW"
            - "Booking.${booking_id}.fee_charged_cents == 5000"
            - "Member.${m_id}.credit_balance == 3 (credit forfeited, not refunded)"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: booking_create_depletes_pack_cascade_depth3
        grounds:
          - state_machines.Booking.transitions.BOOKED_to_COMPLETED
          - state_machines.CreditPack.transitions.ACTIVE_to_DEPLETED
          - calculations.booking_credit_debit
          - calculations.member_credit_balance
          - endpoints["POST /bookings"]
        distinguishing_aspect: |
          Depth-3 chain from booking create: (A) POST /bookings debits the only
          ACTIVE CreditPack (B remaining_credits 1->0); that depletion itself
          flips (C) CreditPack.status ACTIVE->DEPLETED; which itself drops the
          pack out of the (D) Member.credit_balance aggregate. Each link is caused
          by the prior link, not by the original action.
        test_recipe:
          setup:
            - "Member with ACTIVE waiver and NO subscription; a STANDARD pack of exactly 1 credit (remaining 1)."
            - "COMPRESSION service cost 1, room, and covering shift; clock 2026-06-15T09:00:00Z, booking at 10:00:00Z."
          setup_api_calls:
            - call: "POST /service-types"
              payload: { code: "COMPRESSION", name: "Compression", duration_minutes: 30, buffer_minutes: 0, credit_cost: 1, requires_medical_clearance: false }
              as: PlatformAdmin
              captures: { svc_comp_id: $.data.id }
            - call: "POST /locations"
              payload: { name: "Austin", state_code: "TX", timezone: "America/Chicago" }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /locations/${loc_id}/rooms"
              payload: { service_type_id: "${svc_comp_id}", name: "Compression 1" }
              as: LocationManager
              captures: { room_id: $.data.id, room_v: $.data.version }
            - call: "POST /locations/${loc_id}/technicians"
              payload: { full_name: "Tech C" }
              as: LocationManager
              captures: { tech_id: $.data.id }
            - call: "POST /technicians/${tech_id}/shifts"
              payload: { location_id: "${loc_id}", starts_at: "2026-06-15T08:00:00Z", ends_at: "2026-06-15T18:00:00Z" }
              as: LocationManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /members"
              payload: { home_location_id: "${loc_id}", email: "dep@x.com", full_name: "Dep Member", state_code: "TX" }
              as: LocationManager
              captures: { m_id: $.data.id }
            - call: "POST /members/${m_id}/waivers"
              payload: { screening_answers: { heart: false }, has_contraindication: false }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /members/${m_id}/credit-packs"
              payload: { total_credits: 1, is_intro: false }
              as: Member
              as_user_id: "${m_id}"
              captures: { pack_id: $.data.id }
          trigger:
            - call: "POST /bookings"
              payload: { member_id: "${m_id}", location_id: "${loc_id}", room_id: "${room_id}", starts_at: "2026-06-15T10:00:00Z", expected_room_version: "${room_v}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { booking_id: $.data.id, src: $.data.credit_source }
          assert:
            - "Booking.${booking_id}.credit_source == PACK"
            - "CreditPack.${pack_id}.remaining_credits == 0"
            - "CreditPack.${pack_id}.status == DEPLETED"
            - "Member.${m_id}.credit_balance == 0"

      - name: waiver_revoke_flips_contraindication_cascade_depth2
        grounds:
          - state_machines.Waiver.transitions.ACTIVE_to_REVOKED
          - entities.Member.fields.contraindication_flag
          - validations[priority=13]
          - endpoints["POST /members/{member_id}/waivers/{waiver_id}/revoke"]
        distinguishing_aspect: |
          Depth-2 chain from a DIFFERENT trigger (waiver revoke, not booking
          create): (A) revoke the ACTIVE Waiver -> (B) that revocation flips
          Member.contraindication_flag to true, which in turn (C) makes the
          medical-clearance booking gate reject any subsequent WHOLE_BODY_CRYO
          booking with ERR_CONTRAINDICATION_BLOCK.
        test_recipe:
          setup:
