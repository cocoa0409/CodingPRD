# =============================================================================
# Country Club Membership & Dining Minimum — benchmark seed tables
# Difficulty band: Expert (§0.4)
# =============================================================================

scenario: |
  Country Club Membership & Dining Minimum: membership category (golf/social/corporate) &
  initiation, monthly dues & food-and-beverage minimum, member chit/charge account, guest fee &
  sponsorship, tee-time/court & dining reservation, capital assessment, waitlist & resignation
  refund, statement

domain_name: country-club-membership
api_prefix: ""

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - ops_run_checkpoint

  entity_topology: flat
  # Flat: Club is the lone root-config object; Membership, Reservation, CapitalAssessment,
  # WaitlistEntry, Statement, Chit, GuestPass are peer entities linked by FK fields, not nested
  # ownership trees. URLs are /memberships/{id}, /reservations/{id}, etc., FK in body.

  state_machine_shape: parallel
  # Membership carries two independent state axes (account_status × billing_status) that evolve
  # separately; Reservation has a cyclic revision loop (CONFIRMED -> AMEND_PENDING -> CONFIRMED);
  # WaitlistEntry branches (OFFERED -> {ACCEPTED, DECLINED, EXPIRED}).

  relationship_patterns:
    - one_to_many        # Membership has many Chits, Reservations, Statements
    - cross_aggregate    # Reservation references a Resource owned by Club; GuestPass references a sponsoring Membership
    - self_referential   # CorporateMembership.primary_member_id -> Membership.id (designated-user roster head)

  role_model: peer_roles
  # Member owns own membership/reservations/chits; Sponsor relationship is a Member acting for a
  # GuestPass; ClubManager (opaque operator) runs billing/assessments/waitlist; BillingClerk
  # (opaque) posts chits and finalizes statements. No single role can do all steps.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Club
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Club name" }
      - { name: billing_period_index, type: integer, source: system, default: 0, description: "Current monthly billing period counter; advanced by POST /clubs/{id}/close-period" }
      - { name: closed_through_period_index, type: integer, source: system, default: -1, description: "Most recent period whose statements were finalized (-1 = none closed yet)" }
      - { name: fb_minimum_carryover_allowed, type: boolean, source: input, default: false, description: "If true, unspent F&B credit (capped at one period's minimum) rolls into the next period as fb_credit_carried_cents; if false, shortfall is billed and nothing rolls" }
      - { name: resignation_refund_pct, type: integer, source: input, default: 80, description: "Percent of refundable initiation equity returned on resignation settlement (0..100)" }
      - { name: guest_visits_cap_per_period, type: integer, source: input, default: 4, description: "Max guest visits a single sponsoring membership may host per billing period" }

  - name: MembershipCategory
    parent: null
    common_fields: true
    fields:
      - { name: club_id, type: string, source: input, description: "FK -> Club.id" }
      - { name: code, type: enum, source: input, description: "GOLF | SOCIAL | CORPORATE; unique per club", constraints: "code IN {GOLF, SOCIAL, CORPORATE}; unique among MembershipCategory rows with same club_id" }
      - { name: initiation_fee_cents, type: integer, source: input, description: "One-time initiation fee charged on activation" }
      - { name: refundable_equity_cents, type: integer, source: input, description: "Portion of initiation treated as refundable equity for resignation settlement; must be <= initiation_fee_cents" }
      - { name: monthly_dues_cents, type: integer, source: input, description: "Recurring monthly dues" }
      - { name: fb_minimum_cents, type: integer, source: input, description: "Per-period food-and-beverage minimum spend this category must meet" }
      - { name: capacity, type: integer, source: input, description: "Max number of memberships in ACTIVE or SUSPENDED account_status in this category; further activations go to waitlist" }
      - { name: guest_fee_cents, type: integer, source: input, description: "Flat fee charged to the sponsor per guest visit hosted under this category" }
      - { name: allows_golf, type: boolean, source: input, default: false, description: "If false, memberships in this category may not book TEE_TIME resources" }
      - { name: active_member_count, type: integer, source: computed, description: "Count of Membership rows with this category_id whose account_status IN {ACTIVE, SUSPENDED}" }

  - name: Membership
    parent: null
    common_fields: true
    fields:
      - { name: club_id, type: string, source: input, description: "FK -> Club.id" }
      - { name: category_id, type: string, source: input, description: "FK -> MembershipCategory.id; pins category at activation" }
      - { name: primary_member_id, type: string, source: input, description: "FK -> Membership.id; self-referential — for CORPORATE designated-user rows points to the roster head; null for the head itself and for non-corporate", default: null }
      - { name: holder_name, type: string, source: input, description: "Member's full name" }
      - { name: account_status, type: enum, source: system, default: "PENDING", description: "Account axis: PENDING | ACTIVE | SUSPENDED | RESIGNED_PENDING | RESIGNED. RESIGNED is terminal", constraints: "account_status IN {PENDING, ACTIVE, SUSPENDED, RESIGNED_PENDING, RESIGNED}" }
      - { name: billing_status, type: enum, source: system, default: "CURRENT", description: "Billing axis (independent of account_status): CURRENT | PAST_DUE | DELINQUENT. Evolves via statement finalization and payment", constraints: "billing_status IN {CURRENT, PAST_DUE, DELINQUENT}" }
      - { name: charge_balance_cents, type: integer, source: computed, default: 0, description: "Outstanding chit/charge-account balance: sum of unsettled Chit.amount_cents minus payments applied; never below 0" }
      - { name: fb_spend_period_cents, type: integer, source: computed, default: 0, description: "Sum of Chit.amount_cents for Chits with counts_toward_fb=true posted in the club's current billing_period_index for this membership" }
      - { name: fb_credit_carried_cents, type: integer, source: system, default: 0, description: "Unspent F&B credit carried into the current period from the prior period (only when Club.fb_minimum_carryover_allowed)" }
      - { name: refund_owed_cents, type: integer, source: computed, default: 0, description: "Resignation settlement amount owed back to member once RESIGNED_PENDING is settled; 0 until computed" }
      - { name: activated_period_index, type: integer, source: system, default: null, description: "billing_period_index at activation; null while PENDING" }
      - { name: guest_visits_used_period, type: integer, source: computed, default: 0, description: "Count of GuestPass rows sponsored by this membership with status CHECKED_IN in the club's current billing_period_index" }

  - name: Resource
    parent: null
    common_fields: true
    fields:
      - { name: club_id, type: string, source: input, description: "FK -> Club.id" }
      - { name: kind, type: enum, source: input, description: "TEE_TIME | COURT | DINING_TABLE", constraints: "kind IN {TEE_TIME, COURT, DINING_TABLE}" }
      - { name: label, type: string, source: input, description: "Human label e.g. 'Hole 1 - Front Nine' or 'Court 3'" }
      - { name: turnaround_minutes, type: integer, source: input, default: 0, description: "Mandatory buffer in minutes that must separate the END of one reservation from the START of the next on this resource; applies to TEE_TIME and COURT" }
      - { name: seat_capacity, type: integer, source: input, default: 1, description: "For DINING_TABLE: max overlapping party seats; TEE_TIME/COURT use exclusive (capacity 1) occupancy regardless of this value" }

  - name: Reservation
    parent: null
    common_fields: true
    fields:
      - { name: club_id, type: string, source: input, description: "FK -> Club.id" }
      - { name: resource_id, type: string, source: input, description: "FK -> Resource.id" }
      - { name: membership_id, type: string, source: input, description: "FK -> Membership.id; the booking member" }
      - { name: starts_at, type: datetime, source: input, description: "Reservation start (ISO 8601 UTC). Interval is half-open [starts_at, ends_at)" }
      - { name: ends_at, type: datetime, source: input, description: "Reservation end (ISO 8601 UTC), exclusive; must be strictly after starts_at" }
      - { name: party_size, type: integer, source: input, default: 1, description: "Seats requested; for DINING_TABLE consumes party_size against Resource.seat_capacity; must be >= 1" }
      - { name: status, type: enum, source: system, default: "CONFIRMED", description: "CONFIRMED | AMEND_PENDING | CANCELLED | COMPLETED. AMEND_PENDING holds a proposed new window pending confirm; CANCELLED and COMPLETED terminal", constraints: "status IN {CONFIRMED, AMEND_PENDING, CANCELLED, COMPLETED}" }
      - { name: proposed_starts_at, type: datetime, source: system, default: null, description: "Proposed new start while status=AMEND_PENDING; null otherwise" }
      - { name: proposed_ends_at, type: datetime, source: system, default: null, description: "Proposed new end while status=AMEND_PENDING; null otherwise" }

  - name: Chit
    parent: null
    common_fields: true
    fields:
      - { name: club_id, type: string, source: input, description: "FK -> Club.id" }
      - { name: membership_id, type: string, source: input, description: "FK -> Membership.id; the charged member" }
      - { name: amount_cents, type: integer, source: input, description: "Charge amount in cents; must be > 0" }
      - { name: kind, type: enum, source: input, description: "DINING | PRO_SHOP | GUEST_FEE | EVENT; DINING counts toward F&B minimum, others do not", constraints: "kind IN {DINING, PRO_SHOP, GUEST_FEE, EVENT}" }
      - { name: counts_toward_fb, type: boolean, source: computed, description: "True iff kind == DINING; pinned at post time" }
      - { name: period_index, type: integer, source: system, description: "Club.billing_period_index at the moment the chit was posted" }
      - { name: status, type: enum, source: system, default: "POSTED", description: "POSTED | SETTLED | VOIDED. Settled when paid via charge-account payment; voided reverses its effect", constraints: "status IN {POSTED, SETTLED, VOIDED}" }

  - name: GuestPass
    parent: null
    common_fields: true
    fields:
      - { name: club_id, type: string, source: input, description: "FK -> Club.id" }
      - { name: sponsor_membership_id, type: string, source: input, description: "FK -> Membership.id; the sponsoring member responsible for guest fee and conduct" }
      - { name: guest_name, type: string, source: input, description: "Name of the guest" }
      - { name: visit_date, type: datetime, source: input, description: "Intended visit date (ISO 8601 UTC); the billing period is resolved from Club.billing_period_index at check-in" }
      - { name: status, type: enum, source: system, default: "REGISTERED", description: "REGISTERED | CHECKED_IN | CANCELLED. CHECKED_IN posts the guest fee chit; CANCELLED terminal", constraints: "status IN {REGISTERED, CHECKED_IN, CANCELLED}" }
      - { name: fee_chit_id, type: string, source: system, default: null, description: "FK -> Chit.id; the GUEST_FEE chit created on check-in; null until checked in" }

  - name: CapitalAssessment
    parent: null
    common_fields: true
    fields:
      - { name: club_id, type: string, source: input, description: "FK -> Club.id" }
      - { name: description, type: string, source: input, description: "Purpose of the assessment e.g. 'Clubhouse roof'" }
      - { name: total_target_cents, type: integer, source: input, description: "Total amount to raise across the eligible membership base; must be > 0" }
      - { name: allocation_basis, type: enum, source: input, description: "EQUAL (split evenly across eligible memberships) | DUES_WEIGHTED (proportional to each category's monthly_dues_cents)", constraints: "allocation_basis IN {EQUAL, DUES_WEIGHTED}" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | LEVIED | CANCELLED. Levy fans out a charge to each eligible membership; LEVIED and CANCELLED terminal", constraints: "status IN {DRAFT, LEVIED, CANCELLED}" }
      - { name: levied_amount_cents, type: integer, source: computed, default: 0, description: "Sum of per-membership amounts actually levied (after rounding remainder distribution); 0 until LEVIED" }
      - { name: levied_period_index, type: integer, source: system, default: null, description: "Club.billing_period_index at levy; null until LEVIED" }

  - name: AssessmentCharge
    parent: null
    common_fields: false
    fields:
      - { name: assessment_id, type: string, source: input, description: "FK -> CapitalAssessment.id" }
      - { name: membership_id, type: string, source: input, description: "FK -> Membership.id; the assessed member" }
      - { name: amount_cents, type: integer, source: system, description: "Per-membership share of the assessment after allocation and remainder distribution" }

  - name: WaitlistEntry
    parent: null
    common_fields: true
    fields:
      - { name: club_id, type: string, source: input, description: "FK -> Club.id" }
      - { name: category_id, type: string, source: input, description: "FK -> MembershipCategory.id; the category the applicant wants" }
      - { name: applicant_name, type: string, source: input, description: "Applicant full name" }
      - { name: status, type: enum, source: system, default: "WAITING", description: "WAITING | OFFERED | ACCEPTED | DECLINED | EXPIRED. OFFERED holds a promotion offer; ACCEPTED/DECLINED/EXPIRED terminal", constraints: "status IN {WAITING, OFFERED, ACCEPTED, DECLINED, EXPIRED}" }
      - { name: offered_period_index, type: integer, source: system, default: null, description: "Club.billing_period_index when the entry was offered; offer expires if not accepted by the next close-period" }
      - { name: created_membership_id, type: string, source: system, default: null, description: "FK -> Membership.id; the Membership created when this entry is ACCEPTED; null otherwise" }

  - name: Statement
    parent: null
    common_fields: true
    fields:
      - { name: club_id, type: string, source: input, description: "FK -> Club.id" }
      - { name: membership_id, type: string, source: input, description: "FK -> Membership.id; the billed member" }
      - { name: period_index, type: integer, source: system, description: "Billing period this statement covers" }
      - { name: dues_cents, type: integer, source: computed, description: "Category monthly_dues_cents at finalization" }
      - { name: fb_minimum_cents, type: integer, source: computed, description: "Category fb_minimum_cents applicable for the period (net of fb_credit_carried_cents)" }
      - { name: fb_spend_cents, type: integer, source: computed, description: "Qualifying DINING chit spend in the period" }
      - { name: fb_shortfall_cents, type: integer, source: computed, description: "F&B minimum shortfall billed this period; depends on carryover variant (see calculations)" }
      - { name: chit_charges_cents, type: integer, source: computed, description: "Sum of POSTED chit amounts in the period (all kinds) rolled into the statement" }
      - { name: assessment_cents, type: integer, source: computed, description: "Sum of AssessmentCharge.amount_cents levied to this member in the period" }
      - { name: total_due_cents, type: integer, source: computed, description: "dues + fb_shortfall + chit_charges + assessment" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | FINALIZED | PAID. Finalized at close-period; PAID once a payment settles it", constraints: "status IN {OPEN, FINALIZED, PAID}" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---- Membership: ACCOUNT axis (parallel dimension A) ----
  - entity: Membership
    initial_state: PENDING
    terminal_states: [RESIGNED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /memberships/{id}/activate"
        actor: ClubManager
        preconditions:
          - "MembershipCategory.active_member_count < MembershipCategory.capacity (else applicant must use the waitlist)"
          - "membership.account_status == PENDING"
        side_effects:
          - "set activated_period_index = Club.billing_period_index"
          - "create a Chit kind=EVENT amount_cents=MembershipCategory.initiation_fee_cents counts_toward_fb=false (the initiation charge); this debits charge_balance_cents"
          - "recompute MembershipCategory.active_member_count (now +1)"
          - "increments Membership.version by 1"
        note: "Activation is the only producer of ACTIVE; capacity gate forces over-capacity applicants to the waitlist."
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /memberships/{id}/suspend"
        actor: ClubManager
        preconditions:
          - "membership.account_status == ACTIVE"
        side_effects:
          - "membership still counts toward MembershipCategory.active_member_count (suspended seats are held)"
          - "increments Membership.version by 1"
        note: "Suspended members keep their seat but cannot book reservations (cross-entity precondition on Reservation create)."
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /memberships/{id}/reinstate"
        actor: ClubManager
        preconditions:
          - "membership.account_status == SUSPENDED"
        side_effects:
          - "increments Membership.version by 1"
        note: "Cyclic ACTIVE<->SUSPENDED loop on the account axis."
      - from: ACTIVE
        to: RESIGNED_PENDING
        trigger: "POST /memberships/{id}/resign"
        actor: Member
        preconditions:
          - "membership.account_status == ACTIVE"
        side_effects:
          - "compute refund_owed_cents via resignation_refund calculation (refundable equity * Club.resignation_refund_pct/100, then NET of outstanding charge_balance_cents)"
          - "increments Membership.version by 1"
        note: "Member may resign only their own membership."
      - from: SUSPENDED
        to: RESIGNED_PENDING
        trigger: "POST /memberships/{id}/resign"
        actor: Member
        preconditions:
          - "membership.account_status == SUSPENDED"
        side_effects:
          - "compute refund_owed_cents via resignation_refund calculation"
          - "increments Membership.version by 1"
      - from: RESIGNED_PENDING
        to: RESIGNED
        trigger: "POST /memberships/{id}/settle-resignation"
        actor: ClubManager
        preconditions:
          - "membership.account_status == RESIGNED_PENDING"
          - "membership.charge_balance_cents == 0 (all chits settled before settlement)"
        side_effects:
          - "recompute MembershipCategory.active_member_count (now -1, the seat is freed)"
          - "if a WaitlistEntry exists for this category in WAITING, promote the earliest by created_at to OFFERED (cascade: freed seat -> waitlist offer)"
          - "increments Membership.version by 1"
        note: "Terminal. Freeing the seat cascades to waitlist promotion."

  # ---- Membership: BILLING axis (parallel dimension B) — independent of account axis ----
  - entity: Membership
    initial_state: CURRENT
    terminal_states: []
    transitions:
      - from: CURRENT
        to: PAST_DUE
        trigger: "system: POST /clubs/{id}/close-period finalizes a Statement leaving total_due_cents > 0 unpaid"
        actor: system
        preconditions:
          - "a FINALIZED Statement for this membership has total_due_cents > 0 and status != PAID"
        side_effects:
          - "increments Membership.version by 1"
        note: "Billing axis advances independently of account_status; an ACTIVE member can be PAST_DUE while still ACTIVE."
      - from: PAST_DUE
        to: DELINQUENT
        trigger: "system: a second consecutive close-period leaves an unpaid FINALIZED Statement"
        actor: system
        preconditions:
          - "membership.billing_status == PAST_DUE AND another FINALIZED unpaid Statement exists for a later period_index"
        side_effects:
          - "increments Membership.version by 1"
      - from: PAST_DUE
        to: CURRENT
        trigger: "POST /memberships/{id}/payments"
        actor: Member
        preconditions:
          - "after applying payment, no FINALIZED Statement for this membership remains with status != PAID"
        side_effects:
          - "settle covered Statements (status -> PAID) and their POSTED chits (status -> SETTLED), reduce charge_balance_cents"
          - "increments Membership.version by 1"
      - from: DELINQUENT
        to: CURRENT
        trigger: "POST /memberships/{id}/payments"
        actor: Member
        preconditions:
          - "after applying payment, no FINALIZED Statement for this membership remains with status != PAID"
        side_effects:
          - "settle covered Statements and chits; reduce charge_balance_cents"
          - "increments Membership.version by 1"

  # ---- Reservation: cyclic revision loop + terminal completion ----
  - entity: Reservation
    initial_state: CONFIRMED
    terminal_states: [CANCELLED, COMPLETED]
    transitions:
      - from: CONFIRMED
        to: AMEND_PENDING
        trigger: "POST /reservations/{id}/propose-amend"
        actor: Member
        preconditions:
          - "reservation.status == CONFIRMED"
          - "proposed [proposed_starts_at, proposed_ends_at) does NOT collide with any other CONFIRMED reservation on the same resource per the resource_overlap calculation (the reservation's own current window is excluded from the check)"
        side_effects:
          - "store proposed_starts_at / proposed_ends_at; the original window remains held until confirm or abandon"
          - "increments Reservation.version by 1"
        note: "Cyclic loop start: CONFIRMED -> AMEND_PENDING -> CONFIRMED."
      - from: AMEND_PENDING
        to: CONFIRMED
        trigger: "POST /reservations/{id}/confirm-amend"
        actor: Member
        preconditions:
          - "reservation.status == AMEND_PENDING"
          - "proposed window still free per resource_overlap (re-checked at confirm time; a competing booking taken meanwhile blocks confirm)"
        side_effects:
          - "set starts_at=proposed_starts_at, ends_at=proposed_ends_at; clear proposed_* to null"
          - "increments Reservation.version by 1"
        note: "Loop close — returns to CONFIRMED with the new window."
      - from: AMEND_PENDING
        to: CONFIRMED
        trigger: "POST /reservations/{id}/abandon-amend"
        actor: Member
        preconditions:
          - "reservation.status == AMEND_PENDING"
        side_effects:
          - "clear proposed_* to null; original window retained"
          - "increments Reservation.version by 1"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /reservations/{id}/cancel"
        actor: Member
        preconditions:
          - "reservation.status == CONFIRMED"
        side_effects:
          - "free the held window on the resource"
          - "increments Reservation.version by 1"
      - from: CONFIRMED
        to: COMPLETED
        trigger: "POST /reservations/{id}/complete"
        actor: ClubManager
        preconditions:
          - "reservation.status == CONFIRMED"
          - "Club logical clock current time >= reservation.ends_at"
        side_effects:
          - "increments Reservation.version by 1"

  # ---- GuestPass: branching check-in / cancel ----
  - entity: GuestPass
    initial_state: REGISTERED
    terminal_states: [CHECKED_IN, CANCELLED]
    transitions:
      - from: REGISTERED
        to: CHECKED_IN
        trigger: "POST /guest-passes/{id}/check-in"
        actor: ClubManager
        preconditions:
          - "guestpass.status == REGISTERED"
          - "sponsor Membership.account_status == ACTIVE"
          - "sponsor.guest_visits_used_period < Club.guest_visits_cap_per_period (guest-visit quota; cross-entity capacity gate)"
        side_effects:
          - "create Chit kind=GUEST_FEE amount_cents=MembershipCategory.guest_fee_cents (sponsor's category) counts_toward_fb=false; set fee_chit_id; this debits sponsor charge_balance_cents (cascade: check-in -> chit -> sponsor balance)"
          - "recompute sponsor.guest_visits_used_period (now +1)"
          - "increments GuestPass.version by 1"
      - from: REGISTERED
        to: CANCELLED
        trigger: "POST /guest-passes/{id}/cancel"
        actor: Member
        preconditions:
          - "guestpass.status == REGISTERED"
        side_effects:
          - "increments GuestPass.version by 1"

  # ---- CapitalAssessment: draft -> levy fan-out / cancel ----
  - entity: CapitalAssessment
    initial_state: DRAFT
    terminal_states: [LEVIED, CANCELLED]
    transitions:
      - from: DRAFT
        to: LEVIED
        trigger: "POST /capital-assessments/{id}/levy"
        actor: ClubManager
        preconditions:
          - "assessment.status == DRAFT"
          - "at least one eligible Membership exists (account_status IN {ACTIVE, SUSPENDED}); else ERR_NO_ELIGIBLE_MEMBERS"
        side_effects:
          - "compute per-membership shares via assessment_allocation calculation over eligible memberships"
          - "create one AssessmentCharge per eligible membership; each AssessmentCharge debits that membership's charge_balance_cents (cascade: levy -> charge -> member balance)"
          - "set levied_amount_cents = sum of created AssessmentCharge.amount_cents; set levied_period_index = Club.billing_period_index"
          - "increments CapitalAssessment.version by 1"
        note: "Fan-out is parallel (one action -> many targets), so individual charges are NOT a transitive cascade; the per-member balance debit IS the second hop counted in transitive_cascade only when chained via member-balance derived recompute."
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /capital-assessments/{id}/cancel"
        actor: ClubManager
        preconditions:
          - "assessment.status == DRAFT"
        side_effects:
          - "increments CapitalAssessment.version by 1"

  # ---- WaitlistEntry: branching offer / accept / decline / expire ----
  - entity: WaitlistEntry
    initial_state: WAITING
    terminal_states: [ACCEPTED, DECLINED, EXPIRED]
    transitions:
      - from: WAITING
        to: OFFERED
        trigger: "system: a seat is freed (settle-resignation) OR POST /waitlist-entries/{id}/offer by ClubManager when category has spare capacity"
        actor: ClubManager
        preconditions:
          - "waitlistentry.status == WAITING"
          - "MembershipCategory.active_member_count < MembershipCategory.capacity"
        side_effects:
          - "set offered_period_index = Club.billing_period_index"
          - "increments WaitlistEntry.version by 1"
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /waitlist-entries/{id}/accept"
        actor: ClubManager
        preconditions:
          - "waitlistentry.status == OFFERED"
          - "MembershipCategory.active_member_count < MembershipCategory.capacity (re-checked; a seat taken meanwhile blocks accept)"
        side_effects:
          - "create a new Membership in PENDING for this category, then ACTIVATE it (same side-effects as activate transition: initiation chit, count recompute); set created_membership_id"
          - "increments WaitlistEntry.version by 1"
        note: "Cascade: accept -> membership create+activate -> initiation chit -> charge_balance debit -> category count recompute."
      - from: OFFERED
        to: DECLINED
        trigger: "POST /waitlist-entries/{id}/decline"
        actor: ClubManager
        preconditions:
          - "waitlistentry.status == OFFERED"
        side_effects:
          - "if another WaitlistEntry for this category is WAITING, promote the earliest by created_at to OFFERED (cascade: decline -> next offer)"
          - "increments WaitlistEntry.version by 1"
      - from: OFFERED
        to: EXPIRED
        trigger: "system: POST /clubs/{id}/close-period when offered_period_index < Club.billing_period_index after advance"
        actor: system
        preconditions:
          - "waitlistentry.status == OFFERED AND offered_period_index < new Club.billing_period_index"
        side_effects:
          - "if another WaitlistEntry for this category is WAITING, promote the earliest by created_at to OFFERED"
          - "increments WaitlistEntry.version by 1"

  # ---- Statement: open -> finalized -> paid ----
  - entity: Statement
    initial_state: OPEN
    terminal_states: [PAID]
    transitions:
      - from: OPEN
        to: FINALIZED
        trigger: "system: POST /clubs/{id}/close-period"
        actor: system
        preconditions:
          - "statement.status == OPEN AND statement.period_index == Club.billing_period_index (the period being closed)"
        side_effects:
          - "compute dues/fb_minimum/fb_spend/fb_shortfall/chit_charges/assessment/total_due via statement_total calculation"
          - "roll POSTED chits of the period into chit_charges_cents"
          - "if fb_minimum_carryover_allowed and fb_spend exceeded the minimum, set next-period fb_credit_carried_cents on the membership (capped at one minimum)"
          - "if total_due_cents > 0, advance membership billing_status (CURRENT->PAST_DUE, PAST_DUE->DELINQUENT)"
          - "increments Statement.version by 1"
      - from: FINALIZED
        to: PAID
        trigger: "POST /memberships/{id}/payments (payment covers this statement)"
        actor: Member
        preconditions:
          - "statement.status == FINALIZED AND payment amount applied covers total_due_cents"
        side_effects:
          - "settle the period's POSTED chits (status -> SETTLED); reduce membership.charge_balance_cents by the chit total"
          - "if no other FINALIZED unpaid statement remains, set membership.billing_status = CURRENT"
          - "increments Statement.version by 1"

  # ---- Chit: charge-account lifecycle (settle / void compensation) ----
  - entity: Chit
    initial_state: POSTED
    terminal_states: [SETTLED, VOIDED]
    transitions:
      - from: POSTED
        to: SETTLED
        trigger: "POST /memberships/{id}/payments (a payment fully covers this chit, oldest-first by created_at ASC)"
        actor: Member
        preconditions:
          - "chit.status == POSTED"
          - "the membership payment fully covers this chit's amount_cents in the oldest-first allocation"
        side_effects:
          - "reduce membership.charge_balance_cents by amount_cents (already applied by the payment)"
          - "increments Membership.version by 1"
        note: "Settlement is driven by the membership payment endpoint, not a per-chit endpoint."
      - from: POSTED
        to: VOIDED
        trigger: "POST /chits/{id}/void"
        actor: BillingClerk
        preconditions:
          - "chit.status == POSTED"
        side_effects:
          - "credit membership.charge_balance_cents by amount_cents (compensating reversal)"
          - "if counts_toward_fb, recompute membership.fb_spend_period_cents (subtract amount_cents) — compensating reversal of the F&B contribution"
          - "increments Membership.version by 1"
        note: "Void is the compensating action for a posted chit; charge_balance_cents and fb_spend_period_cents are conserved across post+void."

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: reservation-create-stale-resource
    parent_entity: Resource
    write_endpoint: "POST /reservations"
    occ_field: "expected_resource_version"
    description: |
      Creating a Reservation against a Resource whose version has advanced since the client last
      observed it is rejected with a stale-version error. A Resource's version is bumped whenever a
      reservation is confirmed, cancelled, or amended against it (the slot occupancy map changed), so
      a create that carries a stale expected_resource_version reflects an out-of-date view of which
      slots are free and is refused before the overlap check can give a false "available" answer.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: waitlist-accept-stale-category
    parent_entity: MembershipCategory
    write_endpoint: "POST /waitlist-entries/{id}/accept"
    occ_field: "expected_category_version"
    description: |
      Accepting a waitlist offer against a MembershipCategory whose version has advanced since the
      offer was observed is rejected with a stale-version error. The category's version is bumped on
      every activation, settlement, and count recompute that changes active_member_count, so an accept
      carrying a stale expected_category_version reflects a stale view of remaining capacity and is
      refused before another seat could be over-allocated.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  # ---- DUAL-VARIANT #1: F&B shortfall with carryover variants (on Statement / Membership domain) ----
  - name: fb_shortfall
    trigger: "Statement OPEN -> FINALIZED (close-period)"
    algorithm: threshold
    formula: |
      effective_minimum = max(0, MembershipCategory.fb_minimum_cents - Membership.fb_credit_carried_cents)
      fb_spend          = sum(Chit.amount_cents WHERE membership_id=M AND counts_toward_fb=true
                              AND period_index == period AND status IN {POSTED, SETTLED})
      shortfall         = max(0, effective_minimum - fb_spend)     # billed; never negative
      # carryover bookkeeping for NEXT period (variant FORWARD only):
      surplus           = max(0, fb_spend - effective_minimum)
    input_set: "DINING chits for this membership in the closing period with status in {POSTED, SETTLED}; VOIDED chits excluded"
    constants: {}
    precision: "integer cents, no rounding needed (sums of integer cents)"
    variants:
      - name: NO_CARRYOVER
        when: "Club.fb_minimum_carryover_allowed == false"
        difference: "fb_credit_carried_cents is always 0; surplus is discarded (not rolled forward); shortfall = max(0, fb_minimum_cents - fb_spend)"
      - name: FORWARD_CARRYOVER
        when: "Club.fb_minimum_carryover_allowed == true"
        difference: "effective_minimum is reduced by prior-period carried credit; at finalize, surplus (capped at one fb_minimum_cents) is written to NEXT period's fb_credit_carried_cents. Identical chit data yields a different shortfall and a different next-period minimum than NO_CARRYOVER."

  # ---- DUAL-VARIANT #2: resignation refund (on Membership equity domain — different subject than F&B) ----
  - name: resignation_refund
    trigger: "Membership ACTIVE|SUSPENDED -> RESIGNED_PENDING (resign)"
    algorithm: aggregation
    formula: |
      gross_refund   = floor(MembershipCategory.refundable_equity_cents * Club.resignation_refund_pct / 100)
      outstanding    = Membership.charge_balance_cents     # at resign time
      refund_owed    = max(0, gross_refund - outstanding)  # NET variant nets the outstanding balance
    input_set: "single membership; its category's refundable_equity_cents and current charge_balance_cents"
    constants: {}
    precision: "integer cents, floor on the percentage multiply (round toward zero)"
    variants:
      - name: NET_OF_BALANCE
        when: "Membership.charge_balance_cents > 0 at resign time"
        difference: "refund is the gross equity refund minus outstanding charge balance, floored at 0 — the member's debt is recovered from their equity refund."
      - name: GROSS
        when: "Membership.charge_balance_cents == 0 at resign time"
        difference: "refund_owed == gross_refund exactly; no netting applies. Same refundable_equity_cents + pct gives a larger refund than NET_OF_BALANCE."

  # ---- COMBINATORIAL (b): rounding order — assessment allocation with remainder distribution ----
  - name: assessment_allocation
    trigger: "CapitalAssessment DRAFT -> LEVIED (levy)"
    algorithm: waterfall_allocation
    formula: |
      eligible = [Membership WHERE club_id=C AND account_status IN {ACTIVE, SUSPENDED}]   # sorted by created_at ASC, then by id only never used for value
      IF allocation_basis == EQUAL:
        base   = floor(total_target_cents / count(eligible))
        rem    = total_target_cents - base * count(eligible)
        # ROUNDING ORDER PINNED: assign base to every member, THEN distribute the rem leftover cents
        # one extra cent each to the first `rem` members ordered by created_at ASC.
      IF allocation_basis == DUES_WEIGHTED:
        weight(m) = MembershipCategory(m.category_id).monthly_dues_cents
        raw(m)    = total_target_cents * weight(m) / sum(weight over eligible)   # rational
        base(m)   = floor(raw(m))
        rem       = total_target_cents - sum(base(m))
        # distribute rem leftover cents one each to the members with the largest fractional part
        # of raw(m); ties broken by created_at ASC.
      assert sum(per-member amount) == total_target_cents     # conserved-quantity invariant
    input_set: "memberships with account_status IN {ACTIVE, SUSPENDED} at levy time"
    constants: {}
    precision: "integer cents; floor each share THEN distribute the remainder — sum-then-round is forbidden, the pinned order is round-each-then-distribute-remainder"

  # ---- COMBINATORIAL (a): statement total — >=3 inputs, conditional branches ----
  - name: statement_total
    trigger: "Statement OPEN -> FINALIZED (close-period)"
    algorithm: aggregation
    formula: |
      dues            = MembershipCategory.monthly_dues_cents
      fb_shortfall    = (from fb_shortfall calculation for this membership+period)
      chit_charges    = sum(Chit.amount_cents WHERE membership_id=M AND period_index==period AND status==POSTED)
      assessment      = sum(AssessmentCharge.amount_cents WHERE membership_id=M AND assessment.levied_period_index==period)
      total_due       = dues + fb_shortfall + chit_charges + assessment
    input_set: "this membership's POSTED chits and period-levied assessment charges, plus dues and computed F&B shortfall"
    constants: {}
    precision: "integer cents; evaluation order pinned: compute fb_shortfall FIRST (needs effective_minimum), then chit_charges, then sum"

  # ---- guest-visit quota counter (threshold boundary) ----
  - name: guest_visit_quota
    trigger: "GuestPass REGISTERED -> CHECKED_IN (check-in)"
    algorithm: threshold
    formula: |
      used = count(GuestPass WHERE sponsor_membership_id=S AND status==CHECKED_IN
                   AND period_index_of(check_in) == Club.billing_period_index)
      allow_check_in = used < Club.guest_visits_cap_per_period     # STRICT < : the Nth visit where used==cap is rejected
    input_set: "CHECKED_IN guest passes for this sponsor in the current billing period"
    constants: {}
    precision: "integer count; boundary is strict < cap (used==cap rejects)"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and is one of the declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "X-User-ID header present when the role is entity_backed (Member)"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all Member-role endpoints"
  - priority: 3
    category: auth
    check: "Acting role is permitted to perform this operation per RBAC matrix"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 4
    category: auth
    check: "Member may only act on a Membership/Reservation/Chit/GuestPass they own (X-User-ID == membership_id or sponsor_membership_id)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "Member-owned resource mutations"
  - priority: 5
    category: existence
    check: "Path/body referenced resources exist (validated left-to-right): club, membership, resource, reservation, category, assessment, waitlist entry, guest pass, statement"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids or FK body fields"
  - priority: 6
    category: state
    check: "Target resource is in a valid state for the requested transition (state-machine from-state precondition)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action/transition endpoints"
  - priority: 7
    category: business_constraint
    check: "OCC: expected_<parent>_version matches the parent's current version on guarded writes (reservation create, waitlist accept)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /reservations, POST /waitlist-entries/{id}/accept"
  - priority: 8
    category: business_constraint
    check: "A category may not book a TEE_TIME resource unless its category allows_golf; party_size >= 1; ends_at strictly after starts_at"
    error_id: ERR_GOLF_NOT_ALLOWED
    http_status: 422
    applies_to: "POST /reservations, POST /reservations/{id}/propose-amend"
  - priority: 9
    category: business_safety
    check: "Suspended or non-ACTIVE membership may not create reservations (cross-entity: Reservation create requires booking Membership.account_status == ACTIVE)"
    error_id: ERR_MEMBERSHIP_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /reservations"
  - priority: 10
    category: business_temporal
    check: "Requested reservation interval [starts_at, ends_at) (plus turnaround buffer for TEE_TIME/COURT) does not overlap an existing CONFIRMED reservation on the resource; for DINING_TABLE overlapping seats must not exceed seat_capacity"
    error_id: ERR_RESOURCE_CONFLICT
    http_status: 409
    applies_to: "POST /reservations, POST /reservations/{id}/propose-amend, POST /reservations/{id}/confirm-amend"
  - priority: 11
    category: business_constraint
    check: "Activation/waitlist-accept blocked when MembershipCategory.active_member_count >= capacity"
    error_id: ERR_CATEGORY_AT_CAPACITY
    http_status: 409
    applies_to: "POST /memberships/{id}/activate, POST /waitlist-entries/{id}/accept, POST /waitlist-entries/{id}/offer"
  - priority: 12
    category: business_safety
    check: "Guest check-in blocked when sponsor.guest_visits_used_period >= Club.guest_visits_cap_per_period (guest quota)"
    error_id: ERR_GUEST_QUOTA_EXCEEDED
    http_status: 409
    applies_to: "POST /guest-passes/{id}/check-in"
  - priority: 13
    category: business_referential
    check: "Resignation settlement blocked when membership.charge_balance_cents != 0 (must clear chits first)"
    error_id: ERR_OUTSTANDING_BALANCE
    http_status: 409
    applies_to: "POST /memberships/{id}/settle-resignation"
  - priority: 14
    category: business_fiscal
    check: "Capital assessment levy requires total_target_cents > 0 and at least one eligible membership"
    error_id: ERR_NO_ELIGIBLE_MEMBERS
    http_status: 409
    applies_to: "POST /capital-assessments/{id}/levy"
  - priority: 15
    category: business_fiscal
    check: "Payment amount_cents must be > 0 and may not exceed the membership's outstanding charge_balance_cents"
    error_id: ERR_PAYMENT_INVALID
    http_status: 422
    applies_to: "POST /memberships/{id}/payments"
  - priority: 16
    category: business_constraint
    check: "Request body well-formed: required fields present, enums valid, amounts/cents positive integers where required, refundable_equity_cents <= initiation_fee_cents"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all create/config endpoints"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Club config + ops ----
  - method: POST
    path: "/clubs"
    description: "Create a club. fb_minimum_carryover_allowed, resignation_refund_pct, guest_visits_cap_per_period default per §1.1."
    roles: [ClubManager]
    code: 201
    input: [name, "fb_minimum_carryover_allowed?", "resignation_refund_pct?", "guest_visits_cap_per_period?"]
    output: Club
    side_effects: ["billing_period_index initialized to 0", "closed_through_period_index initialized to -1"]
  - method: GET
    path: "/clubs/{id}"
    description: "Fetch a club."
    roles: [ClubManager, BillingClerk, Member]
    code: 200
    input: []
    output: Club
    side_effects: []
  - method: POST
    path: "/clubs/{id}/close-period"
    description: "Advance the billing period: finalize all OPEN statements for the current period, advance billing_status of members with unpaid totals, expire stale waitlist offers, roll F&B carryover, then increment billing_period_index. Server logical clock default is 2026-01-01T00:00:00Z until set via /_clock."
    roles: [ClubManager]
    code: 200
    input: [expected_club_version]
    output: Club
    side_effects: ["finalize Statements", "advance Membership.billing_status", "expire OFFERED WaitlistEntry past offer period", "set fb_credit_carried_cents for next period", "increment Club.billing_period_index", "set closed_through_period_index", "increments Club.version by 1"]
  - method: POST
    path: "/clubs/{id}/open-statements"
    description: "Open (create) the OPEN statement rows for the current period for every ACTIVE/SUSPENDED membership, so a subsequent close-period can finalize them. Idempotent within a period (re-call does not duplicate)."
    roles: [ClubManager, BillingClerk]
    code: 200
    input: []
    output: Statement[]
    side_effects: ["create one OPEN Statement per eligible membership for billing_period_index if not already present"]

  # ---- Membership categories ----
  - method: POST
    path: "/membership-categories"
    description: "Create a membership category (GOLF/SOCIAL/CORPORATE) with fees, dues, F&B minimum, capacity, guest fee."
    roles: [ClubManager]
    code: 201
    input: [club_id, code, initiation_fee_cents, refundable_equity_cents, monthly_dues_cents, fb_minimum_cents, capacity, guest_fee_cents, "allows_golf?"]
    output: MembershipCategory
    side_effects: ["active_member_count initialized to 0"]
  - method: GET
    path: "/membership-categories/{id}"
    description: "Fetch a category including computed active_member_count."
    roles: [ClubManager, BillingClerk, Member]
    code: 200
    input: []
    output: MembershipCategory
    side_effects: []
  - method: GET
    path: "/membership-categories"
    description: "List categories, filterable by club_id (reverse-reachability for Club FK)."
    roles: [ClubManager, BillingClerk, Member]
    code: 200
    input: ["club_id?", "limit?", "offset?"]
    output: MembershipCategory[]
    side_effects: []

  # ---- Memberships ----
  - method: POST
    path: "/memberships"
    description: "Create a membership in PENDING for a category. primary_member_id optional self-reference for CORPORATE designated users."
    roles: [ClubManager]
    code: 201
    input: [club_id, category_id, holder_name, "primary_member_id?"]
    output: Membership
    side_effects: ["account_status=PENDING, billing_status=CURRENT"]
  - method: GET
    path: "/memberships/{id}"
    description: "Fetch a membership with computed balances and counters."
    roles: [ClubManager, BillingClerk, Member]
    code: 200
    input: []
    output: Membership
    side_effects: []
  - method: GET
    path: "/memberships"
    description: "List memberships; filter by club_id, category_id, or primary_member_id (reverse-reachability for Club, Category, and self FK)."
    roles: [ClubManager, BillingClerk, Member]
    code: 200
    input: ["club_id?", "category_id?", "primary_member_id?", "limit?", "offset?"]
    output: Membership[]
    side_effects: []
  - method: POST
    path: "/memberships/{id}/activate"
    description: "Activate a PENDING membership (capacity-gated); creates the initiation chit."
    roles: [ClubManager]
    code: 200
    input: []
    output: Membership
    side_effects: ["set activated_period_index", "create EVENT initiation Chit", "debit charge_balance_cents", "recompute category active_member_count", "increments Membership.version by 1"]
  - method: POST
    path: "/memberships/{id}/suspend"
    description: "Suspend an ACTIVE membership (seat held)."
    roles: [ClubManager]
    code: 200
    input: []
    output: Membership
    side_effects: ["increments Membership.version by 1"]
  - method: POST
    path: "/memberships/{id}/reinstate"
    description: "Reinstate a SUSPENDED membership to ACTIVE."
    roles: [ClubManager]
    code: 200
    input: []
    output: Membership
    side_effects: ["increments Membership.version by 1"]
  - method: POST
    path: "/memberships/{id}/resign"
    description: "Member resigns own ACTIVE/SUSPENDED membership -> RESIGNED_PENDING; computes refund_owed_cents."
    roles: [Member]
    code: 200
    input: []
    output: Membership
    side_effects: ["compute refund_owed_cents", "increments Membership.version by 1"]
  - method: POST
    path: "/memberships/{id}/settle-resignation"
    description: "Finalize resignation -> RESIGNED (requires zero charge balance); frees the seat and cascades to waitlist promotion."
    roles: [ClubManager]
    code: 200
    input: []
    output: Membership
    side_effects: ["recompute category active_member_count (-1)", "promote earliest WAITING WaitlistEntry to OFFERED", "increments Membership.version by 1"]
  - method: POST
    path: "/memberships/{id}/payments"
    description: "Member pays toward their own charge balance. Payment is applied against POSTED chits oldest-first by created_at ASC (each fully covered chit -> SETTLED); reduces charge_balance_cents by amount_cents. If any FINALIZED Statement of this membership becomes fully covered (its total_due_cents worth of POSTED chits all settled and dues/shortfall/assessment paid) the Statement -> PAID; billing_status recomputed (CURRENT when no FINALIZED unpaid Statement remains). amount_cents must be > 0 and <= charge_balance_cents."
    roles: [Member]
    code: 200
    input: [amount_cents]
    output: Membership
    side_effects: ["apply payment to POSTED chits oldest-first (created_at ASC) settling fully-covered chits to SETTLED", "reduce charge_balance_cents by amount_cents", "mark covered FINALIZED Statements PAID", "recompute billing_status", "increments Membership.version by 1"]

  # ---- Resources + reservations ----
  - method: POST
    path: "/resources"
    description: "Create a reservable resource (TEE_TIME/COURT/DINING_TABLE) under a club."
    roles: [ClubManager]
    code: 201
    input: [club_id, kind, label, "turnaround_minutes?", "seat_capacity?"]
    output: Resource
    side_effects: []
  - method: GET
    path: "/resources/{id}"
    description: "Fetch a resource."
    roles: [ClubManager, BillingClerk, Member]
    code: 200
    input: []
    output: Resource
    side_effects: []
  - method: GET
    path: "/resources"
    description: "List resources, filter by club_id (reverse-reachability for Club FK)."
    roles: [ClubManager, BillingClerk, Member]
    code: 200
    input: ["club_id?", "limit?", "offset?"]
    output: Resource[]
    side_effects: []
  - method: POST
    path: "/reservations"
    description: "Book a resource window. OCC-guarded on resource version; enforces overlap/turnaround/seat-capacity, golf-allowed, and active-member preconditions."
    roles: [Member]
    code: 201
    input: [club_id, resource_id, membership_id, starts_at, ends_at, "party_size?", expected_resource_version]
    output: Reservation
    side_effects: ["hold the window on the resource", "increments Resource.version by 1"]
  - method: GET
    path: "/reservations/{id}"
    description: "Fetch a reservation."
    roles: [ClubManager, BillingClerk, Member]
    code: 200
    input: []
    output: Reservation
    side_effects: []
  - method: GET
    path: "/reservations"
    description: "List reservations; filter by resource_id or membership_id (reverse-reachability for Resource and Membership FK)."
    roles: [ClubManager, BillingClerk, Member]
    code: 200
    input: ["resource_id?", "membership_id?", "club_id?", "limit?", "offset?"]
    output: Reservation[]
    side_effects: []
  - method: POST
    path: "/reservations/{id}/propose-amend"
    description: "Member proposes a new window for own CONFIRMED reservation (cyclic amend loop); checks overlap excluding the reservation's own current window."
    roles: [Member]
    code: 200
    input: [proposed_starts_at, proposed_ends_at]
    output: Reservation
    side_effects: ["store proposed_starts_at/proposed_ends_at", "increments Reservation.version by 1"]
  - method: POST
    path: "/reservations/{id}/confirm-amend"
    description: "Confirm the proposed window (re-checks overlap); applies the new window."
    roles: [Member]
    code: 200
    input: []
    output: Reservation
    side_effects: ["set starts_at/ends_at from proposed; clear proposed_*", "increments Reservation.version by 1"]
  - method: POST
    path: "/reservations/{id}/abandon-amend"
    description: "Abandon a pending amend, keeping the original window."
    roles: [Member]
    code: 200
    input: []
    output: Reservation
    side_effects: ["clear proposed_*", "increments Reservation.version by 1"]
  - method: POST
    path: "/reservations/{id}/cancel"
    description: "Cancel own CONFIRMED reservation; frees the resource window."
    roles: [Member]
    code: 200
    input: []
    output: Reservation
    side_effects: ["free window", "increments Reservation.version by 1"]
  - method: POST
    path: "/reservations/{id}/complete"
    description: "Mark a CONFIRMED reservation COMPLETED (clock must be at/after ends_at)."
    roles: [ClubManager]
    code: 200
    input: []
    output: Reservation
    side_effects: ["increments Reservation.version by 1"]

  # ---- Chits / charge account ----
  - method: POST
    path: "/chits"
    description: "Post a chit/charge to a membership's charge account. DINING counts toward F&B minimum."
    roles: [BillingClerk]
    code: 201
    input: [club_id, membership_id, amount_cents, kind]
    output: Chit
    side_effects: ["set counts_toward_fb=(kind==DINING)", "set period_index=Club.billing_period_index", "debit membership.charge_balance_cents", "recompute fb_spend_period_cents if DINING", "increments Membership.version by 1"]
  - method: GET
    path: "/chits/{id}"
    description: "Fetch a chit."
    roles: [ClubManager, BillingClerk, Member]
    code: 200
    input: []
    output: Chit
    side_effects: []
  - method: GET
    path: "/chits"
    description: "List chits; filter by membership_id or club_id (reverse-reachability for Membership and Club FK)."
    roles: [ClubManager, BillingClerk, Member]
    code: 200
    input: ["membership_id?", "club_id?", "limit?", "offset?"]
    output: Chit[]
    side_effects: []
  - method: POST
    path: "/chits/{id}/void"
    description: "Void a POSTED chit; reverses its charge-account debit and F&B contribution."
    roles: [BillingClerk]
    code: 200
    input: []
    output: Chit
    side_effects: ["status -> VOIDED", "credit membership.charge_balance_cents", "recompute fb_spend_period_cents if it was DINING", "increments Membership.version by 1"]

  # ---- Guest passes / sponsorship ----
  - method: POST
    path: "/guest-passes"
    description: "Register a guest pass sponsored by a member (sponsorship). Sponsor must be the acting Member."
    roles: [Member]
    code: 201
    input: [club_id, sponsor_membership_id, guest_name, visit_date]
    output: GuestPass
    side_effects: ["status=REGISTERED"]
  - method: GET
    path: "/guest-passes/{id}"
    description: "Fetch a guest pass."
    roles: [ClubManager, BillingClerk, Member]
    code: 200
    input: []
    output: GuestPass
    side_effects: []
  - method: GET
    path: "/guest-passes"
    description: "List guest passes; filter by sponsor_membership_id, club_id, or fee_chit_id (reverse-reachability for Membership, Club, and Chit FK)."
    roles: [ClubManager, BillingClerk, Member]
    code: 200
    input: ["sponsor_membership_id?", "club_id?", "fee_chit_id?", "limit?", "offset?"]
    output: GuestPass[]
    side_effects: []
  - method: POST
    path: "/guest-passes/{id}/check-in"
    description: "Check a guest in (guest quota gate, sponsor must be ACTIVE); posts the GUEST_FEE chit to the sponsor."
    roles: [ClubManager]
    code: 200
    input: []
    output: GuestPass
    side_effects: ["create GUEST_FEE Chit on sponsor", "set fee_chit_id", "debit sponsor charge_balance_cents", "recompute sponsor.guest_visits_used_period", "increments GuestPass.version by 1"]
  - method: POST
    path: "/guest-passes/{id}/cancel"
    description: "Cancel a REGISTERED guest pass."
    roles: [Member]
    code: 200
    input: []
    output: GuestPass
    side_effects: ["increments GuestPass.version by 1"]

  # ---- Capital assessments ----
  - method: POST
    path: "/capital-assessments"
    description: "Create a DRAFT capital assessment with a total target and allocation basis."
    roles: [ClubManager]
    code: 201
    input: [club_id, description, total_target_cents, allocation_basis]
    output: CapitalAssessment
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/capital-assessments/{id}"
    description: "Fetch a capital assessment."
    roles: [ClubManager, BillingClerk, Member]
    code: 200
    input: []
    output: CapitalAssessment
    side_effects: []
  - method: GET
    path: "/capital-assessments"
    description: "List capital assessments; filter by club_id (reverse-reachability for Club FK)."
    roles: [ClubManager, BillingClerk, Member]
    code: 200
    input: ["club_id?", "limit?", "offset?"]
    output: CapitalAssessment[]
    side_effects: []
  - method: POST
    path: "/capital-assessments/{id}/levy"
    description: "Levy a DRAFT assessment: allocate per-member shares and fan out AssessmentCharges, each debiting a member's charge balance."
    roles: [ClubManager]
    code: 200
    input: []
    output: CapitalAssessment
    side_effects: ["create one AssessmentCharge per eligible membership", "debit each member charge_balance_cents", "set levied_amount_cents/levied_period_index", "increments CapitalAssessment.version by 1"]
  - method: POST
    path: "/capital-assessments/{id}/cancel"
    description: "Cancel a DRAFT assessment."
    roles: [ClubManager]
    code: 200
    input: []
    output: CapitalAssessment
    side_effects: ["increments CapitalAssessment.version by 1"]
  - method: GET
    path: "/capital-assessments/{id}/charges"
    description: "List the AssessmentCharge rows created by a levy (reverse-reachability for AssessmentCharge.assessment_id FK)."
    roles: [ClubManager, BillingClerk, Member]
    code: 200
    input: []
    output: AssessmentCharge[]
    side_effects: []
  - method: GET
    path: "/assessment-charges/{id}"
    description: "Fetch a single assessment charge."
    roles: [ClubManager, BillingClerk, Member]
    code: 200
    input: []
    output: AssessmentCharge
    side_effects: []
  - method: GET
    path: "/assessment-charges"
    description: "List assessment charges; filter by membership_id or assessment_id (reverse-reachability for AssessmentCharge.membership_id and assessment_id FK)."
    roles: [ClubManager, BillingClerk, Member]
    code: 200
    input: ["membership_id?", "assessment_id?", "limit?", "offset?"]
    output: AssessmentCharge[]
    side_effects: []

  # ---- Waitlist ----
  - method: POST
    path: "/waitlist-entries"
    description: "Add an applicant to a category's waitlist (WAITING)."
    roles: [ClubManager]
    code: 201
    input: [club_id, category_id, applicant_name]
    output: WaitlistEntry
    side_effects: ["status=WAITING"]
  - method: GET
    path: "/waitlist-entries/{id}"
    description: "Fetch a waitlist entry."
    roles: [ClubManager, BillingClerk, Member]
    code: 200
    input: []
    output: WaitlistEntry
    side_effects: []
  - method: GET
    path: "/waitlist-entries"
    description: "List waitlist entries; filter by category_id, club_id, or created_membership_id (reverse-reachability for Category, Club, and Membership FK)."
    roles: [ClubManager, BillingClerk, Member]
    code: 200
    input: ["category_id?", "club_id?", "created_membership_id?", "limit?", "offset?"]
    output: WaitlistEntry[]
    side_effects: []
  - method: POST
    path: "/waitlist-entries/{id}/offer"
    description: "Offer a WAITING entry promotion when the category has spare capacity."
    roles: [ClubManager]
    code: 200
    input: []
    output: WaitlistEntry
    side_effects: ["set offered_period_index", "increments WaitlistEntry.version by 1"]
  - method: POST
    path: "/waitlist-entries/{id}/accept"
    description: "Accept an OFFERED entry (capacity re-check, OCC on category version); creates and activates a Membership."
    roles: [ClubManager]
    code: 200
    input: [expected_category_version]
    output: WaitlistEntry
    side_effects: ["create+activate Membership", "set created_membership_id", "increments WaitlistEntry.version by 1", "increments MembershipCategory.version by 1"]
  - method: POST
    path: "/waitlist-entries/{id}/decline"
    description: "Decline an OFFERED entry; promotes the next WAITING entry if any."
    roles: [ClubManager]
    code: 200
    input: []
    output: WaitlistEntry
    side_effects: ["promote next WAITING to OFFERED", "increments WaitlistEntry.version by 1"]

  # ---- Statements ----
  - method: GET
    path: "/statements/{id}"
    description: "Fetch a statement with computed dues/F&B/shortfall/chit/assessment/total breakdown."
    roles: [ClubManager, BillingClerk, Member]
    code: 200
    input: []
    output: Statement
    side_effects: []
  - method: GET
    path: "/statements"
    description: "List statements; filter by membership_id or club_id (reverse-reachability for Membership and Club FK)."
    roles: [ClubManager, BillingClerk, Member]
    code: 200
    input: ["membership_id?", "club_id?", "period_index?", "limit?", "offset?"]
    output: Statement[]
    side_effects: []

  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock to an explicit UTC instant for deterministic reservation completion/expiry tests. Server default before any call is 2026-01-01T00:00:00Z (never real wall-clock)."
    roles: [ClubManager]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock set to to_iso8601"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role, or missing X-User-ID for an entity-backed Member call" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Acting role not permitted for this operation per RBAC" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Member acting on a membership/reservation/chit/guest pass they do not own" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced club/membership/category/resource/reservation/assessment/waitlist/guest pass/statement does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a valid state for the requested transition" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC)" }
  - { id: ERR_GOLF_NOT_ALLOWED, http: 422, condition: "Booking a TEE_TIME resource from a category whose allows_golf is false" }
  - { id: ERR_MEMBERSHIP_NOT_ACTIVE, http: 409, condition: "Reservation create attempted by a membership whose account_status != ACTIVE" }
  - { id: ERR_RESOURCE_CONFLICT, http: 409, condition: "Requested reservation interval overlaps an existing CONFIRMED reservation (incl. turnaround buffer / seat capacity) on the resource" }
  - { id: ERR_CATEGORY_AT_CAPACITY, http: 409, condition: "Activation or waitlist offer/accept attempted when category active_member_count >= capacity" }
  - { id: ERR_GUEST_QUOTA_EXCEEDED, http: 409, condition: "Guest check-in attempted when sponsor.guest_visits_used_period >= Club.guest_visits_cap_per_period" }
  - { id: ERR_OUTSTANDING_BALANCE, http: 409, condition: "Resignation settlement attempted with non-zero charge_balance_cents" }
  - { id: ERR_NO_ELIGIBLE_MEMBERS, http: 409, condition: "Capital assessment levy with no eligible (ACTIVE/SUSPENDED) memberships" }
  - { id: ERR_PAYMENT_INVALID, http: 422, condition: "Payment amount_cents <= 0 or exceeds the membership's outstanding charge_balance_cents" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, invalid enum, non-positive cents where positive required, or refundable_equity_cents > initiation_fee_cents" }
  - { id: ERR_VALIDATION, http: 422, condition: "Semantic field constraint violated (party_size < 1, ends_at <= starts_at)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ClubManager
    description: "Club operations: clubs, categories, resources, membership lifecycle (activate/suspend/reinstate/settle), reservation completion, guest check-in, assessments, waitlist, period close."
    identity: "opaque"
    exclusive_operations:
      - "POST /clubs"
      - "POST /clubs/{id}/close-period"
      - "POST /membership-categories"
      - "POST /memberships"
      - "POST /memberships/{id}/activate"
      - "POST /memberships/{id}/suspend"
      - "POST /memberships/{id}/reinstate"
      - "POST /memberships/{id}/settle-resignation"
      - "POST /resources"
      - "POST /reservations/{id}/complete"
      - "POST /guest-passes/{id}/check-in"
      - "POST /capital-assessments"
      - "POST /capital-assessments/{id}/levy"
      - "POST /capital-assessments/{id}/cancel"
      - "POST /waitlist-entries"
      - "POST /waitlist-entries/{id}/offer"
      - "POST /waitlist-entries/{id}/accept"
      - "POST /waitlist-entries/{id}/decline"
    shared_operations:
      - "POST /clubs/{id}/open-statements (shared with BillingClerk)"
      - "all GET reads"
  - name: BillingClerk
    description: "Charge-account and statement operations: post/void chits, open statements, read everything."
    identity: "opaque"
    exclusive_operations:
      - "POST /chits"
      - "POST /chits/{id}/void"
    shared_operations:
      - "POST /clubs/{id}/open-statements (shared with ClubManager)"
      - "all GET reads"
  - name: Member
    description: "A club member acting on their own memberships, reservations, guest passes, and payments. X-User-ID is the acting Membership.id."
    identity: "entity_backed:Membership"
    exclusive_operations:
      - "POST /memberships/{id}/resign (own)"
      - "POST /memberships/{id}/payments (own)"
      - "POST /reservations (own membership_id)"
      - "POST /reservations/{id}/propose-amend (own)"
      - "POST /reservations/{id}/confirm-amend (own)"
      - "POST /reservations/{id}/abandon-amend (own)"
      - "POST /reservations/{id}/cancel (own)"
      - "POST /guest-passes (own sponsor_membership_id)"
      - "POST /guest-passes/{id}/cancel (own)"
    shared_operations:
      - "all GET reads"
