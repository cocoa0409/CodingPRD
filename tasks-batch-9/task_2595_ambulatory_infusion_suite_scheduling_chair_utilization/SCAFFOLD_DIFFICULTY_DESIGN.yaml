# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2595 — Ambulatory Infusion Suite Scheduling & Chair Utilization
#
# 19 instances across the nine §0.5 Difficulty Rules (>= 2 each; the
# combinatorial_formula rule carries three, one per required mode a/b/c).
# Every numeric literal in every `assert:` line was computed by executing the
# matching §1.3 formula with its declared constants.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: chair_utilization_scheduled_vs_actual_variant_divergence
        grounds:
          - calculations.chair_utilization_pct
          - calculations.biosimilar_savings
          - entities.InfusionCenter.fields.available_chair_count
          - entities.Appointment.fields.chair_minutes
          - entities.Appointment.fields.actual_start_minute
          - entities.Appointment.fields.actual_end_minute
        distinguishing_aspect: |
          Domain is the center/chair capacity ledger: on identical rows the SCHEDULED
          variant reports 18.18 because it attributes every non-abandoned appointment its
          PLANNED chair_minutes, while ACTUAL reports 9.47 because it attributes only
          realised (actual_end_minute - actual_start_minute) and gives the CONFIRMED row
          zero — a 8.71-point delta from one dataset.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T13:00:00Z (minute-of-day 780)."
            - "One center open 480-1140 with four AVAILABLE chairs (A1, A2, A3 plus the urgent-reserved U1), so available_chair_minutes == 4 * 660 == 2640."
            - "One infusion nurse on shift 480-1140 with acuity capacity 6."
            - "One originator drug with no registered biosimilar, so the steering savings term is 0."
            - "Patient One holds an injected COMPLETED visit on 2026-08-10 with planned chair_minutes 240 and realised minutes 510 -> 760 (250 minutes)."
            - "Patient Two holds a live CONFIRMED same-day add-on visit on 2026-08-10 with planned chair_minutes 240 and no realised minutes at all."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T13:00:00Z" }
              as: Scheduler
            - call: "POST /infusion-centers"
              payload: { name: "Riverside Infusion Suite", open_minute: 480, close_minute: 1140, turnover_buffer_minutes: 15, urgent_reserve_chair_count: 1, addon_cutoff_minute: 900, lab_validity_hours: 72, stagger_grid_minutes: 15, acuity_slot_minutes: 30 }
              as: Scheduler
              captures: { ctr: $.data.id }
            - call: "POST /chairs"
              payload: { center_id: "${ctr}", label: "A1", chair_type: "STANDARD", status: "AVAILABLE", reserved_for_urgent: false }
              as: Scheduler
              captures: { ch1: $.data.id }
            - call: "POST /chairs"
              payload: { center_id: "${ctr}", label: "A2", chair_type: "STANDARD", status: "AVAILABLE", reserved_for_urgent: false }
              as: Scheduler
              captures: { ch2: $.data.id }
            - call: "POST /chairs"
              payload: { center_id: "${ctr}", label: "A3", chair_type: "STANDARD", status: "AVAILABLE", reserved_for_urgent: false }
              as: Scheduler
              captures: { ch3: $.data.id }
            - call: "POST /chairs"
              payload: { center_id: "${ctr}", label: "U1", chair_type: "ISOLATION", status: "AVAILABLE", reserved_for_urgent: true }
              as: Scheduler
              captures: { chu: $.data.id }
            - call: "POST /nurses"
              payload: { center_id: "${ctr}", full_name: "Nora Ade", acuity_capacity_points: 6, shift_start_minute: 480, shift_end_minute: 1140, status: "ACTIVE" }
              as: Scheduler
              captures: { nr1: $.data.id }
            - call: "POST /drugs"
              payload: { name: "Infliximab-Ref", is_biosimilar: false, base_administration_minutes: 120, min_administration_minutes: 90, premedication_minutes: 30, observation_minutes_first_dose: 60, observation_minutes_subsequent: 30, acuity_points: 2, prep_stability_minutes: 240, unit_cost_cents: 90000, requires_lab_gate: true, lab_min_anc: 1.5, lab_min_platelets: 100 }
              as: Pharmacist
              captures: { dr1: $.data.id }
            - call: "POST /appointment-templates"
              payload: { center_id: "${ctr}", drug_id: "${dr1}", dose_tier: "MID" }
              as: Scheduler
              captures: { tp1: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-0001", full_name: "Pat One", weight_kg: 70 }
              as: Scheduler
              captures: { pt1: $.data.id }
            - call: "POST /treatment-plans"
              payload: { patient_id: "${pt1}", drug_id: "${dr1}", dose_mg_per_kg: 10, total_cycles: 6, premed_waived: false }
              as: Scheduler
              captures: { pl1: $.data.id }
            - call: "POST /_inject/appointment_history"
              payload: { center_id: "${ctr}", patient_id: "${pt1}", treatment_plan_id: "${pl1}", template_id: "${tp1}", service_date: "2026-08-10", schedule_status: "COMPLETED", chair_minutes: 240, start_minute: 510, actual_start_minute: 510, actual_end_minute: 760, cycle_number: 1 }
              as: Scheduler
              captures: { ah1: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-0002", full_name: "Pat Two", weight_kg: 70 }
              as: Scheduler
              captures: { pt2: $.data.id }
            - call: "POST /treatment-plans"
              payload: { patient_id: "${pt2}", drug_id: "${dr1}", dose_mg_per_kg: 10, total_cycles: 6, premed_waived: false }
              as: Scheduler
              captures: { pl2: $.data.id }
            - call: "POST /appointments"
              payload: { center_id: "${ctr}", patient_id: "${pt2}", treatment_plan_id: "${pl2}", template_id: "${tp1}", service_date: "2026-08-10", requested_start_minute: 840, cycle_number: 1, booking_class: "SAME_DAY_ADDON" }
              as: Scheduler
              captures: { ap2: $.data.id }
            - call: "POST /appointments/${ap2}/authorization-requests"
              payload: { payer_name: "Meridian Health Plan" }
              as: AuthorizationSpecialist
              captures: { az2: $.data.id }
            - call: "POST /authorization-requests/${az2}/submit"
              payload: {}
              as: AuthorizationSpecialist
            - call: "POST /authorization-requests/${az2}/decision"
              payload: { decision: "APPROVED", approved_units: 4 }
              as: AuthorizationSpecialist
            - call: "POST /appointments/${ap2}/confirm"
              payload: {}
              as: Scheduler
          trigger:
            - call: "GET /infusion-centers/${ctr}/utilization"
              payload: { service_date: "2026-08-10", variant: "SCHEDULED" }
              as: Scheduler
              captures: { u_sched: $.data.utilization_pct, occ_sched: $.data.occupied_chair_minutes }
            - call: "GET /infusion-centers/${ctr}/utilization"
              payload: { service_date: "2026-08-10", variant: "ACTUAL" }
              as: Scheduler
              captures: { u_actual: $.data.utilization_pct, occ_actual: $.data.occupied_chair_minutes }
          assert:
            - "SCHEDULED response available_chair_minutes == 2640"
            - "SCHEDULED response occupied_chair_minutes == 480"
            - "SCHEDULED response utilization_pct == 18.18"
            - "ACTUAL response available_chair_minutes == 2640"
            - "ACTUAL response occupied_chair_minutes == 250"
            - "ACTUAL response utilization_pct == 9.47"
            - "SCHEDULED response appointment_count == 2 and ACTUAL response appointment_count == 2 — the two variants read the identical row set"
            - "SCHEDULED response biosimilar_savings_cents == 0 and ACTUAL response biosimilar_savings_cents == 0"
            - "Appointment.${ap2}.schedule_status == CONFIRMED and Appointment.${ap2}.actual_start_minute is null, which is why it contributes 240 to SCHEDULED and 0 to ACTUAL"

      - name: no_show_risk_rolling6_vs_quarter_to_date_variant_divergence
        grounds:
          - calculations.no_show_risk_score
          - entities.Patient.fields.no_show_risk_score
          - entities.Patient.fields.reminder_tier
          - entities.Patient.fields.no_show_strikes
          - entities.Appointment.fields.late_cancellation
        distinguishing_aspect: |
          Domain is the single patient's adherence history, not the center's capacity: over
          the same three terminal visits the recency-weighted ROLLING_6 variant returns
          39.22 (the lone NO_SHOW carries weight 100 of a 255 total) while the unweighted
          QUARTER_TO_DATE variant returns 33.33 (one NO_SHOW out of three visits in Q3
          2026), and only ROLLING_6 sets reminder_tier.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-05T07:00:00Z, i.e. inside calendar quarter Q3 2026 (2026-07-01 .. 2026-09-30)."
            - "One center, one chair, one nurse, one drug, one MID template, one patient, one six-cycle plan."
            - "Patient One has exactly three terminal visits, all inside Q3 2026: COMPLETED on 2026-07-06, COMPLETED on 2026-07-20 and NO_SHOW on 2026-08-03."
            - "Ordered by service_date DESC the window is [NO_SHOW, COMPLETED, COMPLETED] carrying weights 100, 85, 70."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T07:00:00Z" }
              as: Scheduler
            - call: "POST /infusion-centers"
              payload: { name: "Riverside Infusion Suite", open_minute: 480, close_minute: 1140, turnover_buffer_minutes: 15, urgent_reserve_chair_count: 1, addon_cutoff_minute: 900, lab_validity_hours: 72, stagger_grid_minutes: 15, acuity_slot_minutes: 30 }
              as: Scheduler
              captures: { ctr: $.data.id }
            - call: "POST /chairs"
              payload: { center_id: "${ctr}", label: "A1", chair_type: "STANDARD", status: "AVAILABLE", reserved_for_urgent: false }
              as: Scheduler
              captures: { ch1: $.data.id }
            - call: "POST /nurses"
              payload: { center_id: "${ctr}", full_name: "Nora Ade", acuity_capacity_points: 6, shift_start_minute: 480, shift_end_minute: 1140, status: "ACTIVE" }
              as: Scheduler
              captures: { nr1: $.data.id }
            - call: "POST /drugs"
              payload: { name: "Infliximab-Ref", is_biosimilar: false, base_administration_minutes: 120, min_administration_minutes: 90, premedication_minutes: 30, observation_minutes_first_dose: 60, observation_minutes_subsequent: 30, acuity_points: 2, prep_stability_minutes: 240, unit_cost_cents: 90000, requires_lab_gate: true, lab_min_anc: 1.5, lab_min_platelets: 100 }
              as: Pharmacist
              captures: { dr1: $.data.id }
            - call: "POST /appointment-templates"
              payload: { center_id: "${ctr}", drug_id: "${dr1}", dose_tier: "MID" }
              as: Scheduler
              captures: { tp1: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-0001", full_name: "Pat One", weight_kg: 70 }
              as: Scheduler
              captures: { pt1: $.data.id }
            - call: "POST /treatment-plans"
              payload: { patient_id: "${pt1}", drug_id: "${dr1}", dose_mg_per_kg: 10, total_cycles: 6, premed_waived: false }
              as: Scheduler
              captures: { pl1: $.data.id }
            - call: "POST /_inject/appointment_history"
              payload: { center_id: "${ctr}", patient_id: "${pt1}", treatment_plan_id: "${pl1}", template_id: "${tp1}", service_date: "2026-07-06", schedule_status: "COMPLETED", chair_minutes: 240, start_minute: 540, actual_start_minute: 540, actual_end_minute: 780, cycle_number: 1 }
              as: Scheduler
              captures: { ah1: $.data.id }
            - call: "POST /_inject/appointment_history"
              payload: { center_id: "${ctr}", patient_id: "${pt1}", treatment_plan_id: "${pl1}", template_id: "${tp1}", service_date: "2026-07-20", schedule_status: "COMPLETED", chair_minutes: 240, start_minute: 540, actual_start_minute: 540, actual_end_minute: 780, cycle_number: 2 }
              as: Scheduler
              captures: { ah2: $.data.id }
            - call: "POST /_inject/appointment_history"
              payload: { center_id: "${ctr}", patient_id: "${pt1}", treatment_plan_id: "${pl1}", template_id: "${tp1}", service_date: "2026-08-03", schedule_status: "NO_SHOW", chair_minutes: 240, start_minute: 540, cycle_number: 3 }
              as: Scheduler
              captures: { ah3: $.data.id }
          trigger:
            - call: "GET /patients/${pt1}/no-show-risk"
              payload: { variant: "ROLLING_6" }
              as: Scheduler
              captures: { s_roll: $.data.score, tier_roll: $.data.reminder_tier }
            - call: "GET /patients/${pt1}/no-show-risk"
              payload: { variant: "QUARTER_TO_DATE" }
              as: Scheduler
              captures: { s_qtd: $.data.score }
          assert:
            - "ROLLING_6 response score == 39.22"
            - "ROLLING_6 response reminder_tier == ELEVATED"
            - "ROLLING_6 response considered_appointment_count == 3"
            - "QUARTER_TO_DATE response score == 33.33"
            - "QUARTER_TO_DATE response considered_appointment_count == 3 — identical row set, different weighting"
            - "Patient.${pt1}.no_show_risk_score == 39.22 (the persisted field mirrors ROLLING_6, never QUARTER_TO_DATE)"
            - "Patient.${pt1}.reminder_tier == ELEVATED"
            - "Patient.${pt1}.no_show_strikes == 1"
            - "Patient.${pt1}.completed_appointment_count == 2"
            - "Patient.${pt1}.steering_status == SUITE (one strike is below the threshold of 3)"

  - rule_id: combinatorial_formula
    instances:

      - name: window_build_nested_max_over_tiered_admin_leg_mode_a
        mode: a
        grounds:
          - calculations.appointment_window_build
          - calculations.template_build
          - calculations.staggered_start_assignment
          - entities.Appointment.fields.admin_minutes
          - entities.Appointment.fields.chair_minutes
          - entities.Appointment.fields.acuity_points
        distinguishing_aspect: |
          Mode (a) — nested function application: admin_minutes is
          max(min_admin_minutes, base_admin_minutes + tier_add), a floor applied OVER a
          tiered value. For the slow-infusion drug the inner tiered term is 60 + 0 = 60 but
          the outer floor is 150, so admin_minutes must be 150; any implementation that
          applies the floor before the tier add, or that returns the tiered value directly,
          yields 60 and a chair window of 125 instead of 215.
        test_recipe:
          setup:
            - "Logical clock 2026-08-05T07:00:00Z; one center, two AVAILABLE chairs A1 and A2, one nurse with acuity capacity 6 on shift 480-1140."
            - "Drug One (originator) base 120 / min 90 / premed 30 / obs-first 60 / acuity 2; its MID template therefore carries acuity_points 2 and stagger_offset_minutes 15."
            - "Drug Four (slow infusion) base 60 / min 150 / premed 20 / obs-first 45 / acuity 1; its LOW template carries acuity_points 1 and stagger_offset_minutes 15."
            - "Patient One on a 10 mg/kg plan of Drug One at 70 kg -> dose_mg 700.0 -> MID tier -> tier_add 30."
            - "Patient Two on a 5 mg/kg plan of Drug Four at 70 kg -> dose_mg 350.0 -> LOW tier -> tier_add 0."
            - "Patient One is booked first at requested_start 540 and takes chair A1 for [540, 780)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T07:00:00Z" }
              as: Scheduler
            - call: "POST /infusion-centers"
              payload: { name: "Riverside Infusion Suite", open_minute: 480, close_minute: 1140, turnover_buffer_minutes: 15, urgent_reserve_chair_count: 1, addon_cutoff_minute: 900, lab_validity_hours: 72, stagger_grid_minutes: 15, acuity_slot_minutes: 30 }
              as: Scheduler
              captures: { ctr: $.data.id }
            - call: "POST /chairs"
              payload: { center_id: "${ctr}", label: "A1", chair_type: "STANDARD", status: "AVAILABLE", reserved_for_urgent: false }
              as: Scheduler
              captures: { ch1: $.data.id }
            - call: "POST /chairs"
              payload: { center_id: "${ctr}", label: "A2", chair_type: "STANDARD", status: "AVAILABLE", reserved_for_urgent: false }
              as: Scheduler
              captures: { ch2: $.data.id }
            - call: "POST /nurses"
              payload: { center_id: "${ctr}", full_name: "Nora Ade", acuity_capacity_points: 6, shift_start_minute: 480, shift_end_minute: 1140, status: "ACTIVE" }
              as: Scheduler
              captures: { nr1: $.data.id }
            - call: "POST /drugs"
              payload: { name: "Infliximab-Ref", is_biosimilar: false, base_administration_minutes: 120, min_administration_minutes: 90, premedication_minutes: 30, observation_minutes_first_dose: 60, observation_minutes_subsequent: 30, acuity_points: 2, prep_stability_minutes: 240, unit_cost_cents: 90000, requires_lab_gate: false }
              as: Pharmacist
              captures: { dr1: $.data.id }
            - call: "POST /drugs"
              payload: { name: "Vedolizumab-Slow", is_biosimilar: false, base_administration_minutes: 60, min_administration_minutes: 150, premedication_minutes: 20, observation_minutes_first_dose: 45, observation_minutes_subsequent: 20, acuity_points: 1, prep_stability_minutes: 120, unit_cost_cents: 30000, requires_lab_gate: false }
              as: Pharmacist
              captures: { dr4: $.data.id }
            - call: "POST /appointment-templates"
              payload: { center_id: "${ctr}", drug_id: "${dr1}", dose_tier: "MID" }
              as: Scheduler
              captures: { tp1: $.data.id }
            - call: "POST /appointment-templates"
              payload: { center_id: "${ctr}", drug_id: "${dr4}", dose_tier: "LOW" }
              as: Scheduler
              captures: { tp4: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-0001", full_name: "Pat One", weight_kg: 70 }
              as: Scheduler
              captures: { pt1: $.data.id }
            - call: "POST /treatment-plans"
              payload: { patient_id: "${pt1}", drug_id: "${dr1}", dose_mg_per_kg: 10, total_cycles: 6, premed_waived: false }
              as: Scheduler
              captures: { pl1: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-0002", full_name: "Pat Two", weight_kg: 70 }
              as: Scheduler
              captures: { pt2: $.data.id }
            - call: "POST /treatment-plans"
              payload: { patient_id: "${pt2}", drug_id: "${dr4}", dose_mg_per_kg: 5, total_cycles: 4, premed_waived: false }
              as: Scheduler
              captures: { pl2: $.data.id }
            - call: "POST /appointments"
              payload: { center_id: "${ctr}", patient_id: "${pt1}", treatment_plan_id: "${pl1}", template_id: "${tp1}", service_date: "2026-08-10", requested_start_minute: 540, cycle_number: 1, booking_class: "ROUTINE" }
              as: Scheduler
              captures: { ap1: $.data.id }
          trigger:
            - call: "POST /appointments"
              payload: { center_id: "${ctr}", patient_id: "${pt2}", treatment_plan_id: "${pl2}", template_id: "${tp4}", service_date: "2026-08-10", requested_start_minute: 540, cycle_number: 1, booking_class: "ROUTINE" }
              as: Scheduler
              captures: { ap2: $.data.id }
          assert:
            - "AppointmentTemplate.${tp1}.acuity_points == 2 and AppointmentTemplate.${tp1}.stagger_offset_minutes == 15"
            - "AppointmentTemplate.${tp4}.acuity_points == 1 and AppointmentTemplate.${tp4}.stagger_offset_minutes == 15"
            - "Appointment.${ap1}.admin_minutes == 150 (max(90, 120 + 30))"
            - "Appointment.${ap1}.premed_minutes == 30 and Appointment.${ap1}.observation_minutes == 60"
            - "Appointment.${ap1}.chair_minutes == 240 and Appointment.${ap1}.acuity_points == 3"
            - "Appointment.${ap1}.start_minute == 540 and Appointment.${ap1}.end_minute == 780 and Appointment.${ap1}.chair_id == ${ch1}"
            - "Appointment.${ap2}.admin_minutes == 150 — the OUTER max floor wins over the inner tiered 60 + 0"
            - "Appointment.${ap2}.premed_minutes == 20 and Appointment.${ap2}.observation_minutes == 45"
            - "Appointment.${ap2}.chair_minutes == 215 (20 + 150 + 45), not 125 (20 + 60 + 45)"
            - "Appointment.${ap2}.acuity_points == 2 (template 1 plus the first-dose surcharge 1)"
            - "Appointment.${ap2}.start_minute == 540 and Appointment.${ap2}.end_minute == 755"
            - "Appointment.${ap2}.chair_id == ${ch2} — chair A1 is blocked at 540 by ${ap1}, so the selector takes the only remaining eligible chair at the first candidate start"
            - "Appointment.${ap2}.nurse_id == ${nr1} — the slot load 3 + 2 == 5 stays at or below the capacity 6"
            - "Chair.${ch1}.committed_minutes == 240 and Chair.${ch2}.committed_minutes == 215"
            - "Nurse.${nr1}.assigned_acuity_points == 5"

      - name: billable_units_ceiling_per_appointment_then_summed_mode_b
        mode: b
        grounds:
          - calculations.billable_chair_units
          - entities.Appointment.fields.billable_chair_units
          - endpoints.GET_/infusion-centers/{id}/chair-billing-summary
        distinguishing_aspect: |
          Mode (b) — pinned rounding ORDER, same two rounding steps in the opposite
          sequence: ceil each visit to a 15-minute unit first, THEN sum, giving
          ceil(250/15) + ceil(92/15) == 17 + 7 == 24 units and 216000 cents. Summing the
          raw minutes first and ceiling once gives ceil(342/15) == 23 units and 207000
          cents — the same inputs and the same two operations, off by one whole unit.
        test_recipe:
          setup:
            - "Logical clock 2026-08-10T20:00:00Z; one center, one AVAILABLE chair, one nurse, one drug, one MID template."
            - "Two patients each with one injected COMPLETED visit on 2026-08-10."
            - "Visit one realised 510 -> 760, i.e. 250 minutes with a remainder of 10 over 16 whole units."
            - "Visit two realised 600 -> 692, i.e. 92 minutes with a remainder of 2 over 6 whole units."
            - "Both remainders are non-zero, which is exactly the condition under which the two rounding orders disagree."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T20:00:00Z" }
              as: Scheduler
            - call: "POST /infusion-centers"
              payload: { name: "Riverside Infusion Suite", open_minute: 480, close_minute: 1140, turnover_buffer_minutes: 15, urgent_reserve_chair_count: 1, addon_cutoff_minute: 900, lab_validity_hours: 72, stagger_grid_minutes: 15, acuity_slot_minutes: 30 }
              as: Scheduler
              captures: { ctr: $.data.id }
            - call: "POST /chairs"
              payload: { center_id: "${ctr}", label: "A1", chair_type: "STANDARD", status: "AVAILABLE", reserved_for_urgent: false }
              as: Scheduler
              captures: { ch1: $.data.id }
            - call: "POST /nurses"
              payload: { center_id: "${ctr}", full_name: "Nora Ade", acuity_capacity_points: 6, shift_start_minute: 480, shift_end_minute: 1140, status: "ACTIVE" }
              as: Scheduler
              captures: { nr1: $.data.id }
            - call: "POST /drugs"
              payload: { name: "Infliximab-Ref", is_biosimilar: false, base_administration_minutes: 120, min_administration_minutes: 90, premedication_minutes: 30, observation_minutes_first_dose: 60, observation_minutes_subsequent: 30, acuity_points: 2, prep_stability_minutes: 240, unit_cost_cents: 90000, requires_lab_gate: false }
              as: Pharmacist
              captures: { dr1: $.data.id }
            - call: "POST /appointment-templates"
              payload: { center_id: "${ctr}", drug_id: "${dr1}", dose_tier: "MID" }
              as: Scheduler
              captures: { tp1: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-0001", full_name: "Pat One", weight_kg: 70 }
              as: Scheduler
              captures: { pt1: $.data.id }
            - call: "POST /treatment-plans"
              payload: { patient_id: "${pt1}", drug_id: "${dr1}", dose_mg_per_kg: 10, total_cycles: 6, premed_waived: false }
              as: Scheduler
              captures: { pl1: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-0002", full_name: "Pat Two", weight_kg: 70 }
              as: Scheduler
              captures: { pt2: $.data.id }
            - call: "POST /treatment-plans"
              payload: { patient_id: "${pt2}", drug_id: "${dr1}", dose_mg_per_kg: 10, total_cycles: 6, premed_waived: false }
              as: Scheduler
              captures: { pl2: $.data.id }
            - call: "POST /_inject/appointment_history"
              payload: { center_id: "${ctr}", patient_id: "${pt1}", treatment_plan_id: "${pl1}", template_id: "${tp1}", service_date: "2026-08-10", schedule_status: "COMPLETED", chair_minutes: 240, start_minute: 510, actual_start_minute: 510, actual_end_minute: 760, cycle_number: 1 }
              as: Scheduler
