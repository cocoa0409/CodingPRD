              as: BenefitsAdmin
              captures: { e1_id: $.data.id }
            - call: "POST /wellness/enrollments"
              payload: { program_id: "${prog_id}", employee_id: "${e1_id}" }
              as: BenefitsAdmin
              captures: { enr_id: $.data.id }
            - call: "POST /wellness/enrollments/${enr_id}/accept"
              payload: {}
              as: Employee
              as_user_id: "${e1_id}"
            - call: "POST /wellness/activity-events"
              payload: { enrollment_id: "${enr_id}", device_source: "fitbit", external_event_id: "evt-dup", activity_type: "STEPS", quantity: 100000, occurred_at: "2026-04-15T10:00:00Z" }
              as: Employee
              as_user_id: "${e1_id}"
