            - "err == ERR_SOD_SELF_APPROVAL (requester attorney id cannot approve even with the ConflictsPartner role)"
            - "st_ok == APPROVED and ap_by == ${cp} (a different partner succeeds)"

      - name: c_client_cannot_run_conflict_check_forbidden
        claim_type: rbac_denial
        grounds: ["roles[Client]", "validations[priority=2]", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Client role is not in the conflict-check endpoint's roles list: a client (even the matter's own client) running a check gets ERR_FORBIDDEN at priority 2, before any state check."
        test_recipe:
          setup: ["Matter M1 (INTAKE) for client P"]
          setup_api_calls:
            - { call: "POST /intake/parties", payload: { legal_name: "Curious Client Inc", party_type: "CORPORATION" }, as: FirmAdmin, captures: { p: $.data.id } }
