          Deviations are cumulative, so each one must be filed against the score it can actually see:
          the MODERATE deviation moved compliance_score to 94.00 and advanced the submittal version, so
          a MINOR deviation quoting the original token is refused with
          ERR_STALE_SUBMITTAL_VERSION (412) rather than being applied to a score the writer never
          observed. The submittal keeps 94.00 and exactly one deviation row.
