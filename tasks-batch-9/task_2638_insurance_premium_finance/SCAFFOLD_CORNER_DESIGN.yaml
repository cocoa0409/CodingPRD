            - "first attestation: ${cf_v1_party} == 'INSURER' (derived from the acting role, not from input), ${cf_v1_user} == the insurer id, ${cf_v1_eff_prem} == 550000 (the correction, not 600000), ${cf_v1_eff_date} == '2026-09-01' (fell back to the policy's effective_date because corrected_effective_date was absent), ${cf_v1_sup} == false"
