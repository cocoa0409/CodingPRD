      - name: claim_amount_variant_divergence_on_one_approval
        claim_type: variant_divergence
        grounds:
          - calculations.claim_reimbursement
          - calculations.claim_reimbursement.variants
        excluded_because:
          difficulty_instance: claim_provisional_versus_final_amount_divergence
          rationale: |
            The PROVISIONAL/FINAL divergence of calculation claim_reimbursement is the whole point of
            that difficulty instance: it pins both amounts on one approval from the same inputs and
            proves only the FINAL figure reaches the obligation ledger. A corner-case duplicate would
            re-derive the identical pair of numbers on the identical call.

      - name: claim_amount_variant_is_selected_by_claim_status
        claim_type: variant_selection
        grounds:
          - calculations.claim_reimbursement.variants
          - state_machines.RepairClaim
        excluded_because:
          difficulty_instance: completion_rate_regulatory_versus_operational_divergence
          rationale: |
            Variant selection is already exercised where it actually branches: the REGULATORY variant
            is the one persisted and gated on, while the OPERATIONAL variant is only ever returned by
            the metrics read. That instance asserts both variants on one population, so a separate
            selection corner case would assert the same two numbers.

      - name: obligation_ledger_reconciles_against_its_components
        claim_type: reconciliation
        grounds:
          - entities.RecallCampaign.fields.reimbursement_obligation_cents
          - calculations.claim_reimbursement
          - calculations.owner_reimbursement_amount
        excluded_because:
          difficulty_instance: obligation_cents_conserved_when_claim_reversal_leaves_owner_reimbursement_intact
          rationale: |
            Reconciliation of the money ledger against its two contributing sources is the conservation
            invariant that difficulty instance already proves, including across a reversal that removes
            only the claim component. Re-summing the same two components without a mutation in between
            would add no discriminating power.

      - name: parts_counters_reconcile_after_allocation_churn
        claim_type: reconciliation
        grounds:
          - entities.RemedyPart.fields.consumed_qty
          - entities.RemedyPart.fields.unallocated_qty
          - entities.PartsAllocation.fields.allocated_qty
        excluded_because:
          difficulty_instance: parts_units_conserved_across_supersede_and_reversal_of_consumed_allocation
          rationale: |
            The parts unit-conservation identity is asserted there under the two events that can break
            it -- a campaign supersede that revokes outstanding allocations and a reversal of an
            already-consumed one. A quieter reconciliation check would be a strict subset of those
            assertions.

      - name: wave_quota_propagates_the_coverage_constraint
        claim_type: constraint_propagation
        grounds:
          - calculations.wave_release_quota
          - entities.NotificationWave.fields.coverage_tier_factor
        excluded_because:
          difficulty_instance: wave_release_circular_coverage_ratio_mode_c
          rationale: |
            Propagating parts capacity through the provisional ratio, the tier factor and the planned
            count -- and then reporting a DIFFERENT ratio against that freshly derived count -- is the
            circular-dependency trap that difficulty instance is built around. Any corner case here
            would have to walk the same six pinned steps.

      - name: population_windows_are_compared_as_half_open_intervals
        claim_type: interval_merge
        grounds:
          - calculations.population_match
          - validations.priority_30
        excluded_because:
          difficulty_instance: population_rule_half_open_window_allows_touch_rejects_intersection
          rationale: |
            Interval arithmetic appears in exactly one place -- how two INCLUDE build windows for the same
            plant/model/year are compared -- and that difficulty instance pins both edges of it: a window
            that merely touches its predecessor is accepted while a one-day intersection is refused. A
            corner case would need the identical pair of windows to say anything new.

