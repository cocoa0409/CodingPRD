      - name: project_engineer_authorization_outranks_invalid_enum_on_hazard_area_create
        grounds:
          - validations[priority=6]
          - validations[priority=9]
          - roles.DesignEngineer
          - endpoints.POST_/hazard-areas
        distinguishing_aspect: |
          The request carries an unparseable hazard_class AND comes from an engineer who is not the
          project's lead. The 403 ERR_NOT_PROJECT_ENGINEER at priority 6 has to be returned even
          though the body would fail schema validation, which is the opposite of the usual
          parse-then-authorize instinct - an unauthorized caller must not learn anything about how
          well-formed his payload was. Re-sending the identical malformed body as the lead engineer
          then returns 422 ERR_INVALID_REQUEST, so both rules are demonstrably live.
