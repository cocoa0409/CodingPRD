        claim_type: cross_entity_validation
        grounds:
          - validations.priority_36.ERR_LAB_SUBJECT_INVALID
          - entities.LabTest.fields.subject_type
          - errors.ERR_LAB_SUBJECT_INVALID
        distinguishing_aspect: "The polymorphic FK must be resolved in the table chosen by the discriminator, not in any table: a real EggLot id under subject_type BREEDER_FLOCK is 422 ERR_LAB_SUBJECT_INVALID (the id exists, just not where the discriminator points), and the mirror-image swap must fail the same way."
