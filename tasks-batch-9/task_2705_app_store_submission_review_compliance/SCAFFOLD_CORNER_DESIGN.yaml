            - *c_acct
            - *c_cert
            - *c_acct_reread
            - *c_cert_act
            - *c_prof
            - *c_prof_act
            - *c_app
            - *c_rule
            - *c_rule_pub
            - *c_map
            - *c_map_start
            - *c_window
            - *c_map_pass
            - *c_app_reread
            - *c_sub
            - *c_loc
            - *c_age
            - *c_priv
            - *c_prc
            - *c_queue
            - *c_claim
          trigger:
