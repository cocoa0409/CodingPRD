              payload: { legal_name: "Cascade Trust", partner_type: "SECURITIZATION_TRUST", home_state: "DE" }
              as: PartnerAdmin
              as_user_id: "pa-one"
              captures: { t_id: $.data.id, t_v0: $.data.version }
            - call: "POST /platform/partners/${t_id}/activate"
              payload: {}
              as: PartnerAdmin
              as_user_id: "pa-one"
