      - name: stale_agreement_version_masks_the_scope_eligibility_rule
        grounds:
          - concurrency_rules[submission-create-stale-agreement]
          - validations[priority 60].ERR_AGREEMENT_VERSION_CONFLICT
          - validations[priority 140].ERR_SCOPE_NOT_IN_AGREEMENT
          - endpoints[POST /creative-submissions]
        distinguishing_aspect: |
          A third, distinct error-category pair: business_referential (P60, HTTP 412, the OCC guard of
          §1.2.1) versus business_constraint (P140, HTTP 409, the scope-eligibility rule). One request
          body carries BOTH a version the caller read before an earlier submission bumped the agreement
          AND a scope (MARKETING) the licensor never granted approval rights over. The OCC guard is
          checked first and returns 412, so the caller cannot distinguish a stale read from an
          ineligible scope until it re-reads the agreement; re-sending the same scope with the fresh
          version returns 409 ERR_SCOPE_NOT_IN_AGREEMENT. Unlike the other two instances the masking
          error carries a non-409 status, which is what makes the ordering observable from the status
          code alone.
        test_recipe:
          setup:
            - "One ACTIVE licence with approval_scopes [CREATIVE_EXECUTION] only (MARKETING is deliberately NOT granted) and territory_city_codes [NYC]."
            - "One PLANNED NYC run with one themed room."
            - "One CREATIVE_EXECUTION submission CE-001 already created, which advanced the agreement's version and made the caller's first read stale."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueOpsManager
            - call: "POST /venues"
              payload: { city_code: "NYC", site_name: "Pier 9 Shed", lease_start_date: "2026-08-01", lease_end_date: "2027-01-31", base_monthly_rent_cents: 4500000, buildout_allowance_cents: 1500000, buildout_cap_cents: 3000000, requested_occupancy_load: 180, egress_width_cm: 400, sprinklered: true }
              as: VenueOpsManager
              as_user_id: "vom-1"
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/permit-submissions"
              payload: { package_note: "assembly occupancy package" }
              as: VenueOpsManager
              as_user_id: "vom-1"
            - call: "POST /venues/${venue_id}/permit-decisions"
              payload: { decision: "ISSUED", note: "occupancy 180 granted" }
              as: SafetyOfficer
              as_user_id: "officer-1"
            - call: "POST /venues/${venue_id}/activate-lease"
              payload: {}
              as: VenueOpsManager
              as_user_id: "vom-1"
            - call: "POST /build-kits"
              payload: { kit_code: "KIT-P5C-001", module_count: 20, initial_condition_score: 100.00, localization_language: "en-US" }
              as: VenueOpsManager
              as_user_id: "vom-1"
              captures: { kit_id: $.data.id }
            - call: "POST /license-agreements"
              payload: { licensor_name: "Halcyon Studios", ip_title: "Neon Atrium", licensor_rep_user_id: "rep-1", royalty_rate_bps: 1250, merch_royalty_rate_bps: 750, minimum_guarantee_cents: 192790, approval_scopes: ["CREATIVE_EXECUTION"], territory_city_codes: ["NYC"], term_start_date: "2026-08-01", term_end_date: "2026-12-31" }
              as: LicensingManager
              as_user_id: "lm-1"
              captures: { agreement_id: $.data.id }
            - call: "POST /license-agreements/${agreement_id}/activate"
              payload: {}
              as: LicensingManager
              as_user_id: "lm-1"
            - call: "POST /experience-runs"
              payload: { venue_id: "${venue_id}", license_agreement_id: "${agreement_id}", build_kit_id: "${kit_id}", run_name: "Neon Atrium NYC", scheduled_open_date: "2026-08-10", scheduled_close_date: "2026-10-31", base_ticket_price_cents: 35833, timed_slot_minutes: 45, max_group_size: 12 }
              as: ExperienceProducer
              as_user_id: "producer-1"
              captures: { run_id: $.data.id }
            - call: "POST /themed-rooms"
              payload: { run_id: "${run_id}", room_sequence: 1, name: "Vestibule", room_occupancy_cap: 40, target_dwell_minutes: 15, min_dwell_minutes: 5, sensory_intensity_level: 2, has_quiet_bypass: true, wheelchair_accessible: true }
              as: ExperienceProducer
              as_user_id: "producer-1"
            - call: "GET /license-agreements/${agreement_id}"
              payload: {}
              as: ExperienceProducer
              as_user_id: "producer-1"
              captures: { agr_stale: $.data.version }
            - call: "POST /creative-submissions"
              payload: { license_agreement_id: "${agreement_id}", run_id: "${run_id}", scope: "CREATIVE_EXECUTION", asset_code: "CE-001", title: "Vestibule dressing", expected_agreement_version: "${agr_stale}" }
              as: ExperienceProducer
              as_user_id: "producer-1"
              captures: { sub_first_id: $.data.id }
          trigger:
            - call: "POST /creative-submissions"
              payload: { license_agreement_id: "${agreement_id}", run_id: "${run_id}", scope: "MARKETING", asset_code: "MK-001", title: "Out-of-home campaign", expected_agreement_version: "${agr_stale}" }
              as: ExperienceProducer
              as_user_id: "producer-1"
            - call: "GET /license-agreements/${agreement_id}"
              payload: {}
              as: ExperienceProducer
              as_user_id: "producer-1"
              captures: { agr_fresh: $.data.version }
            - call: "POST /creative-submissions"
              payload: { license_agreement_id: "${agreement_id}", run_id: "${run_id}", scope: "MARKETING", asset_code: "MK-001", title: "Out-of-home campaign", expected_agreement_version: "${agr_fresh}" }
              as: ExperienceProducer
              as_user_id: "producer-1"
            - call: "POST /creative-submissions"
              payload: { license_agreement_id: "${agreement_id}", run_id: "${run_id}", scope: "CREATIVE_EXECUTION", asset_code: "CE-002", title: "Corridor scent cue", expected_agreement_version: "${agr_fresh}" }
              as: ExperienceProducer
              as_user_id: "producer-1"
              captures: { sub_second_id: $.data.id }
          assert:
            - "the first MARKETING create responds 412 with data.error_id == ERR_AGREEMENT_VERSION_CONFLICT (P60), NOT ERR_SCOPE_NOT_IN_AGREEMENT, even though MARKETING is absent from approval_scopes"
            - "the refusal is inert: LicenseAgreement.${agreement_id}.version == ${agr_fresh} == ${agr_stale} + 1 (bumped only by the CE-001 create) and open_submission_count == 1"
            - "the second MARKETING create — same scope, fresh version — responds 409 with data.error_id == ERR_SCOPE_NOT_IN_AGREEMENT (P140), proving the scope rule was violated by the first request too"
            - "after the second refusal LicenseAgreement.${agreement_id}.version is still ${agr_fresh} and open_submission_count is still 1, so no MARKETING row was ever stored"
            - "the CREATIVE_EXECUTION CE-002 create with the same fresh version responds 201: CreativeSubmission.${sub_second_id}.status == SUBMITTED and revision_round == 0"
            - "after the accepted create LicenseAgreement.${agreement_id}.open_submission_count == 2 (CE-001 and CE-002 are different asset_code families, so nothing was superseded) and version == ${agr_fresh} + 1"
            - "CreativeSubmission.${sub_first_id}.status == SUBMITTED and superseded_by_submission_id == null throughout"

  - rule_id: boundary_precision_check
    instances:
      - name: demand_index_extension_floor_at_exactly_seventy
        grounds:
          - calculations.run_extension_demand_index
          - validations[priority 150].ERR_DEMAND_BELOW_THRESHOLD
          - endpoints[POST /experience-runs/{runId}/extensions]
          - endpoints[GET /experience-runs/{runId}/demand-index]
        distinguishing_aspect: |
          Metric: demand_index (a 2-decimal percentage) against EXTENSION_DEMAND_MIN 70.00 on
          POST /experience-runs/{runId}/extensions, where the comparison is >= so exactly 70.00 must
          pass. The refused arm sits at 67.50 — the value produced by 27 of 40 seats, which is also a
          value that must NOT be rounded up to 68 — and the accepted arm is the very next confirmable
