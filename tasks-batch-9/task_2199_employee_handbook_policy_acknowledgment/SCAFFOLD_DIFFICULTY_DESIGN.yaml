  - rule_id: resource_temporal_overlap
    instances:
      - name: policy_document_effective_window_half_open_adjacency_permitted
        resource: PolicyDocument effective-date timeline
        interval_geometry: half_open_lower_closed_upper_open
        adjacency: permitted
        grounds:
          - validations[priority=40]
          - entities.PolicyVersion.fields.effective_date
          - entities.PolicyVersion.fields.window_end_date
          - endpoints[POST /release-packages/{release_package_id}/schedule]
        distinguishing_aspect: |
          The contended resource is a single PolicyDocument's timeline, and the occupied intervals
          are HALF-OPEN [effective_date, window_end_date): the lower edge is occupied, the upper
          edge is not. v1 occupies [2026-08-10, 2026-08-20) after v2 supersedes it. A candidate
          at 2026-08-15 (interior) and a candidate at exactly 2026-08-10 (the closed lower edge)
          are both overlaps, while 2026-09-05 clears both clauses. Note this rule at priority 40
          deliberately outranks ERR_EFFECTIVE_DATE_IN_PAST at 45, so a past-dated candidate that
          also collides reports the collision, not the calendar.
