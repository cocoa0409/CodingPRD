              payload: { expected_case_version: "${case_a_v}", pricing_mode: "INSURED", eligibility_snapshot_id: "${snap_b}", lines: [{ cpt_code: "27447", quantity: 1 }] }
              as: FinancialCounselor
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_SNAPSHOT_PATIENT_MISMATCH, http 422"

      - name: duplicate_mrn_returns_409
        claim_type: violation_to_error
        grounds: ["validations[priority=15]", "errors[ERR_DUPLICATE_MRN]"]
        distinguishing_aspect: "mrn uniqueness is enforced at registration."
