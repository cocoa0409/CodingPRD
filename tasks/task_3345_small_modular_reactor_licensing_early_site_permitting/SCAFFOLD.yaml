scenario: 'Small Modular Reactor Licensing & Early Site Permitting (NuScale Power): design certification application with
  safety analysis, testing programs and regulatory review cycles spanning years, early site permit and combined license processes
  with environmental review and public hearings, first-of-a-kind engineering costs and cost-sharing arrangements with customers
  and government programs, supply chain qualification for nuclear-grade components with limited qualified vendors, customer
  commitment structures with subscription of output among utility participants and off-ramps, project cost escalation and
  participant withdrawal handling, emergency planning zone sizing arguments based on design characteristics, workforce development
  and operator licensing pipelines'
domain_name: smr-licensing-permitting
api_prefix: /licensing
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
  - optimistic_concurrency
  - cascading_side_effects
  - dual_variant_calculation
  - scheduled_actions
  entity_topology: hybrid
  state_machine_shape: cyclic
  relationship_patterns:
  - one_to_many
  - cross_aggregate
  - self_referential
  role_model: segregation_of_duties
  consistency_model: immediate
response_envelope:
  success: "{ \"meta\": { \"api_request_id\": \"req_xxx\", \"api_request_timestamp\": \"ISO8601\" },\n  \"response_type\"\
    : \"object\" | \"array\", \"data\": {} }\n"
  error: "{ \"meta\": { ... }, \"response_type\": \"error\",\n  \"data\": { \"error_id\": \"ERR_XXX\", \"message\": \"...\"\
    \ } }\n"
  pagination_fields:
  - limit
  - offset
  - total_count
  - has_more
  pagination_defaults:
    limit: 10
    min: 1
    max: 100
    offset: 0
entities:
- name: DesignCertification
  parent: null
  common_fields: true
  fields:
  - name: docket_number
    type: string
    source: input
    description: Unique regulatory docket identifier, e.g. 52-048
    constraints: unique across all DesignCertification rows
  - name: reactor_model
    type: string
    source: input
    description: Reactor model designation
  - name: target_power_mwt
    type: integer
    source: input
    description: Design thermal power rating in MWt
    constraints: must be > 0
  - name: plant_net_capacity_mw
    type: integer
    source: input
    description: Net electric capacity in MW available for utility subscription
    constraints: must be > 0; fixed pool for subscription commitments
  - name: source_term_fraction
    type: number
    source: input
    description: Fraction of reference source term released in design-basis accident (design characteristic used for EPZ sizing)
    constraints: 0 < value <= 1
  - name: site_boundary_miles
    type: number
    source: input
    description: Distance to site boundary used in EPZ dose-based sizing
    constraints: must be >= 0.25
  - name: status
    type: enum
    source: system
    description: Certification lifecycle state
    constraints: SUBMITTED | SAFETY_REVIEW | ADVANCED_REVIEW | CERTIFIED | WITHDRAWN
    default: SUBMITTED
  - name: review_phase
    type: integer
    source: computed
    description: 1=SUBMITTED, 2=SAFETY_REVIEW, 3=ADVANCED_REVIEW, 4=CERTIFIED, 0=WITHDRAWN
  - name: epz_radius_deterministic_miles
    type: number
    source: computed
    description: 'EPZ radius under deterministic variant: 10.0 * source_term_fraction'
  - name: epz_radius_dose_based_miles
    type: number
    source: computed
    description: EPZ radius under dose-consequence variant; see calculation epz_radius_determination
  - name: epz_radius_selected_miles
    type: number
    source: computed
    description: Conservative selection = max(deterministic, dose_based), floored at 0.5 and capped at 10.0
  - name: subscribed_mw
    type: integer
    source: computed
    description: Sum of committed_mw over SubscriptionCommitment rows of this DCA with status IN {EXECUTED, LOCKED}
  - name: available_mw
    type: integer
    source: computed
    description: plant_net_capacity_mw - subscribed_mw
  - name: funding_gap_usd
    type: integer
    source: computed
    description: Cost-share dollars that cannot be reallocated to remaining participants because of escalation caps; incremented
      by escalation_reallocation
    default: 0
- name: SafetyAnalysisReport
  parent: DesignCertification
  common_fields: true
  fields:
  - name: dca_id
    type: string
    source: input
    description: FK -> DesignCertification.id; owning application
  - name: section_code
    type: string
    source: input
    description: SAR chapter/section code, e.g. CH03, CH15
  - name: revision_number
    type: integer
    source: input
    description: Revision of this section
    constraints: unique per (dca_id, section_code); must be >= 0
  - name: status
    type: enum
    source: system
    description: Review state of this section revision
    constraints: SUBMITTED | UNDER_REVIEW | READY_FOR_PHASE_ADVANCE
    default: SUBMITTED
  - name: open_rais
    type: integer
    source: computed
    description: Count of RAI rows of this DCA whose sar_section_code equals this section_code and status IN {OPEN, RESPONSE_SUBMITTED,
      REOPENED}
    default: 0
- name: RAI
  parent: DesignCertification
  common_fields: true
  fields:
  - name: dca_id
    type: string
    source: input
    description: FK -> DesignCertification.id; application under review
  - name: sar_section_code
    type: string
    source: input
    description: Section code of an existing SafetyAnalysisReport of the same DCA this question targets
  - name: question_text
    type: string
    source: input
    description: Regulator's question text
  - name: due_date
    type: datetime
    source: input
    description: Response due date; responses with responded_at <= due_date are timely (inclusive boundary)
  - name: status
    type: enum
    source: system
    description: RAI lifecycle
    constraints: OPEN | RESPONSE_SUBMITTED | ACCEPTED | REOPENED | SUPERSEDED
    default: OPEN
  - name: response_text
    type: string
    source: input
    description: Applicant response, set on respond
    default: null
  - name: responded_at
    type: datetime
    source: system
    description: Logical-clock timestamp of latest respond call
    default: null
  - name: late_response
    type: boolean
    source: computed
    description: true iff responded_at > due_date at latest respond
    default: false
  - name: authored_by_user_id
    type: string
    source: system
    description: X-User-ID of the NrcReviewer who created the RAI; that user may not accept its response (segregation of duties)
- name: TestProgram
  parent: DesignCertification
  common_fields: true
  fields:
  - name: dca_id
    type: string
    source: input
    description: FK -> DesignCertification.id; application the test program supports
  - name: program_code
    type: string
    source: input
    description: Test program code, e.g. TP-THERMAL
    constraints: unique per dca_id
  - name: required_tests
    type: integer
    source: input
    description: Number of successful tests required for adequacy
    constraints: must be > 0
  - name: completed_tests
    type: integer
    source: computed
    description: Count of TestResult rows with outcome == PASS
    default: 0
  - name: status
    type: enum
    source: system
    description: Testing lifecycle; failure-loop reopens the program
    constraints: PLANNED | IN_PROGRESS | ADEQUATE | INSUFFICIENT
    default: PLANNED
- name: TestResult
  parent: TestProgram
  common_fields: false
  fields:
  - name: program_id
    type: string
    source: input
    description: FK -> TestProgram.id
  - name: outcome
    type: enum
    source: input
    description: Recorded outcome of the test run
    constraints: PASS | FAIL
  - name: run_at
    type: datetime
    source: input
    description: Logical date the test ran; must not precede any earlier TestResult.run_at of the same program (chronological
      recording)
  - name: notes
    type: string
    source: input
    description: Optional notes
    default: null
- name: Vendor
  parent: null
  common_fields: true
  fields:
  - name: name
    type: string
    source: input
    description: Vendor legal name
    constraints: unique
  - name: capability_scope
    type: string
    source: input
    description: Narrative capability scope
  - name: qualified
    type: boolean
    source: computed
    description: Derived from latest active VendorQualification.status; used by ComponentLot procurement gate
    default: false
  - name: has_active_qualification
    type: boolean
    source: computed
    description: true iff an active qualification exists with status IN {AUDIT_SCHEDULED, CONDITIONALLY_QUALIFIED, FULLY_QUALIFIED}
    default: false
- name: VendorQualification
  parent: Vendor
  common_fields: true
  fields:
  - name: vendor_id
    type: string
    source: input
    description: FK -> Vendor.id
  - name: cycle_number
    type: integer
    source: system
    description: 1-based cycle count per vendor; incremented on each create
    default: 1
  - name: audit_date
    type: datetime
    source: input
    description: Scheduled audit date; must not overlap a non-superseded qualification audit of the same vendor within +/-14
      days
  - name: defects_found
    type: integer
    source: input
    description: Defects recorded at audit; drives qualified_variant derivation
  - name: qualified_variant
    type: enum
    source: computed
    description: 'Derivation rule pinned in qualification_variant_selection: FULLY iff status FULLY_QUALIFIED; else CONDITIONALLY
      iff status CONDITIONALLY_QUALIFIED AND defects_found < QUALIFIED_DEFECTS_THRESHOLD; else UNQUALIFIED'
  - name: status
    type: enum
    source: system
    description: Qualification lifecycle
    constraints: AUDIT_SCHEDULED | CONDITIONALLY_QUALIFIED | FULLY_QUALIFIED | DISQUALIFIED | SUPERSEDED
    default: AUDIT_SCHEDULED
- name: ComponentLot
  parent: Vendor
  common_fields: true
  fields:
  - name: vendor_id
    type: string
    source: input
    description: FK -> Vendor.id; manufacturing vendor
  - name: program_id
    type: string
    source: input
    description: FK -> TestProgram.id; test program whose adequacy gates procurement
  - name: component_type
    type: string
    source: input
    description: Component category
  - name: nuclear_grade
    type: boolean
    source: input
    description: Whether the lot is nuclear-grade
    default: true
  - name: quantity
    type: integer
    source: input
    description: Units in lot
    constraints: must be >= 1
  - name: status
    type: enum
    source: system
    description: Procurement lifecycle
    constraints: PROCURED | DELIVERED | RELEASED | REJECTED
    default: PROCURED
- name: SitePermit
  parent: null
  common_fields: true
  fields:
  - name: permit_type
    type: enum
    source: input
    description: Permit flavor; drives EPZ radius source
    constraints: ESP | COL
  - name: dca_id
    type: string
    source: input
    description: FK -> DesignCertification.id
  - name: site_name
    type: string
    source: input
    description: Candidate site name
  - name: epz_radius_miles
    type: number
    source: computed
    description: 'Frozen at creation: ESP uses DCA.epz_radius_deterministic_miles; COL uses DCA.epz_radius_selected_miles'
  - name: status
    type: enum
    source: system
    description: Permit lifecycle; hearing regression loops HEARINGS -> ENVIRONMENTAL_REVIEW
    constraints: DRAFT | ENVIRONMENTAL_REVIEW | HEARINGS | GRANTED | DENIED
    default: DRAFT
- name: PublicHearing
  parent: SitePermit
  common_fields: true
  fields:
  - name: permit_id
    type: string
    source: input
    description: FK -> SitePermit.id
  - name: scheduled_at
    type: datetime
    source: input
    description: Hearing start; must be strictly in the future at scheduling time
  - name: location
    type: string
    source: input
    description: Hearing venue
  - name: status
    type: enum
    source: system
    description: Hearing lifecycle; time-based expiry and contention regression
    constraints: SCHEDULED | HELD | CANCELLED | CONTENDED
    default: SCHEDULED
- name: SubscriptionCommitment
  parent: DesignCertification
  common_fields: true
  fields:
  - name: dca_id
    type: string
    source: input
    description: FK -> DesignCertification.id; project whose output is subscribed
  - name: utility_id
    type: string
    source: input
    description: FK -> UtilityParticipant.id; subscribing utility
  - name: committed_mw
    type: integer
    source: input
    description: MW subscribed; constrained by escalation_gate against current available capacity
    constraints: 1 <= committed_mw <= DCA.available_mw at execution time
  - name: price_per_mwh_usd
    type: number
    source: input
    description: Subscription energy price in USD/MWh
    constraints: must be > 0
  - name: status
    type: enum
    source: system
    description: Commitment lifecycle
    constraints: DRAFT | EXECUTED | LOCKED | WITHDRAWN
    default: DRAFT
  - name: cost_share_total_usd
    type: integer
    source: computed
    description: Participant's share of DCA cost base at LOCK time; frozen
    default: 0
  - name: allocated_overrun_usd
    type: integer
    source: computed
    description: Overrun share allocated by escalation_reallocation, capped by withdrawal_reserve_usd
    default: 0
  - name: withdrawal_reserve_usd
    type: integer
    source: computed
    description: Cost-share exposure remaining = cost_share_total_usd - allocated_overrun_usd; zero cap blocks escalation
    default: 0
  - name: offload_penalty_usd
    type: integer
    source: computed
    description: Penalty computed by withdrawal_penalty when status moves EXECUTED -> WITHDRAWN
    default: 0
- name: CostShareAgreement
  parent: null
  common_fields: true
  fields:
  - name: dca_id
    type: string
    source: input
    description: FK -> DesignCertification.id
    constraints: unique per dca_id (at most one agreement per application)
  - name: total_cost_usd
    type: integer
    source: input
    description: FOAK engineering cost base in USD
    constraints: must be > 0
  - name: gov_contribution_usd
    type: integer
    source: input
    description: Government program contribution
    constraints: 0 <= value < total_cost_usd
  - name: participant_share_usd
    type: integer
    source: computed
    description: total_cost_usd - gov_contribution_usd; pool allocated to subscriptions at LOCK
  - name: allocated_to_participants_usd
    type: integer
    source: computed
    description: Sum of cost_share_total_usd + allocated_overrun_usd over all subscriptions of the DCA (any status); conservation
      invariant target
    default: 0
  - name: version
    type: integer
    source: system
    description: OCC field; increments on every mutation
    default: 1
- name: WorkforcePipeline
  parent: DesignCertification
  common_fields: true
  fields:
  - name: dca_id
    type: string
    source: input
    description: FK -> DesignCertification.id
  - name: cohort_code
    type: string
    source: input
    description: Cohort label
    constraints: unique per dca_id
  - name: required_operators
    type: integer
    source: input
    description: Licensed operators the DCA must graduate before CERTIFIED
    constraints: must be > 0
  - name: graduates
    type: integer
    source: computed
    description: Count of OperatorLicense rows with license_status IN {LICENSED, ACTIVE}
    default: 0
  - name: status
    type: enum
    source: system
    description: Pipeline lifecycle; time-based attrition loops GRADUATING -> ENROLLING
    constraints: ENROLLING | TRAINING | GRADUATING | STAFFED
    default: ENROLLING
- name: OperatorLicense
  parent: WorkforcePipeline
  common_fields: true
  fields:
  - name: pipeline_id
    type: string
    source: input
    description: FK -> WorkforcePipeline.id
  - name: candidate_name
    type: string
    source: input
    description: Operator candidate name
  - name: license_status
    type: enum
    source: system
    description: License lifecycle
    constraints: ENROLLED | LICENSED | ACTIVE | REVOKED
    default: ENROLLED
state_machines:
- entity: DesignCertification
  initial_state: SUBMITTED
  terminal_states:
  - WITHDRAWN
  - CERTIFIED
  transitions:
  - from: SUBMITTED
    to: SAFETY_REVIEW
    trigger: POST /licensing/dcas/{id}/enter-safety-review
    actor: NrcReviewer
    preconditions:
    - DCA.status == SUBMITTED
    - every SafetyAnalysisReport of the DCA has status != SUBMITTED (all sections entered review)
    side_effects:
    - DCA.version += 1
    - DCA.updated_at refreshed
  - from: SAFETY_REVIEW
    to: ADVANCED_REVIEW
    trigger: POST /licensing/dcas/{id}/advance-phase
    actor: NrcReviewer
    preconditions:
    - DCA.status == SAFETY_REVIEW
    - every SafetyAnalysisReport of the DCA has status == READY_FOR_PHASE_ADVANCE
    - every RAI of the DCA has status IN {ACCEPTED, SUPERSEDED}
    side_effects:
    - DCA.version += 1
    - SAR sections keep status READY_FOR_PHASE_ADVANCE (next advance drives them)
  - from: ADVANCED_REVIEW
    to: CERTIFIED
    trigger: POST /licensing/dcas/{id}/certify
    actor: NrcReviewer
    preconditions:
    - DCA.status == ADVANCED_REVIEW
    - every TestProgram of the DCA has status == ADEQUATE
    - every WorkforcePipeline of the DCA has status == STAFFED
    - at least one SubscriptionCommitment of the DCA has status == LOCKED
    side_effects:
    - DCA.version += 1
    - 'cascade: every SubscriptionCommitment of the DCA with status == EXECUTED transitions to LOCKED (see SubscriptionCommitment
      EXECUTED->LOCKED side_effects)'
  - from: SUBMITTED
    to: WITHDRAWN
    trigger: POST /licensing/dcas/{id}/withdraw
    actor: DoeProgram
    preconditions:
    - DCA.status IN {SUBMITTED, SAFETY_REVIEW, ADVANCED_REVIEW}
    side_effects:
    - DCA.version += 1
    - 'cascade: every SubscriptionCommitment with status == EXECUTED transitions to WITHDRAWN without penalty (offload_penalty_usd
      stays 0)'
  - from: SAFETY_REVIEW
    to: WITHDRAWN
    trigger: POST /licensing/dcas/{id}/withdraw
    actor: DoeProgram
    preconditions:
    - DCA.status IN {SUBMITTED, SAFETY_REVIEW, ADVANCED_REVIEW}
    side_effects:
    - same cascade as SUBMITTED->WITHDRAWN
  - from: ADVANCED_REVIEW
    to: WITHDRAWN
    trigger: POST /licensing/dcas/{id}/withdraw
    actor: DoeProgram
    preconditions:
    - DCA.status IN {SUBMITTED, SAFETY_REVIEW, ADVANCED_REVIEW}
    side_effects:
    - same cascade as SUBMITTED->WITHDRAWN
- entity: SafetyAnalysisReport
  initial_state: SUBMITTED
  terminal_states: []
  transitions:
  - from: SUBMITTED
    to: UNDER_REVIEW
    trigger: POST /licensing/sars/{id}/review (regulator opens review of the section)
    actor: NrcReviewer
    preconditions:
    - SAR.status == SUBMITTED
    side_effects:
    - SAR.version += 1
  - from: UNDER_REVIEW
    to: READY_FOR_PHASE_ADVANCE
    trigger: POST /licensing/sars/{id}/advance
    actor: NrcReviewer
    preconditions:
    - SAR.status == UNDER_REVIEW
    - SAR.open_rais == 0 (no RAI of same DCA+section in OPEN/RESPONSE_SUBMITTED/REOPENED)
    side_effects:
    - SAR.version += 1
  - from: READY_FOR_PHASE_ADVANCE
    to: UNDER_REVIEW
    trigger: 'system: RAI on this SAR''s section transitions to REOPENED (reopen-rai)'
    actor: system
    preconditions:
    - SAR.status == READY_FOR_PHASE_ADVANCE
    side_effects:
    - SAR.status = UNDER_REVIEW; SAR.version += 1; SAR.updated_at refreshed
    - DCA.review_phase stays; DCA.version += 1 (section regression bubbles to parent)
- entity: RAI
  initial_state: OPEN
  terminal_states:
  - ACCEPTED
  - SUPERSEDED
  transitions:
  - from: OPEN
    to: RESPONSE_SUBMITTED
    trigger: POST /licensing/rais/{id}/respond
    actor: DcaApplicant
    preconditions:
    - RAI.status == OPEN
    side_effects:
    - RAI.responded_at = clock; RAI.response_text = payload
    - RAI.late_response = (responded_at > due_date)
    - parent SAR.open_rais recomputed
  - from: RESPONSE_SUBMITTED
    to: ACCEPTED
    trigger: POST /licensing/rais/{id}/accept
    actor: NrcReviewer
    preconditions:
    - RAI.status == RESPONSE_SUBMITTED
    - accepting reviewer's X-User-ID != RAI.authored_by_user_id (segregation of duties)
    side_effects:
    - RAI.version += 1
    - parent SAR.open_rais recomputed
  - from: RESPONSE_SUBMITTED
    to: REOPENED
    trigger: POST /licensing/rais/{id}/reopen
    actor: NrcReviewer
    preconditions:
    - RAI.status == RESPONSE_SUBMITTED
    side_effects:
    - RAI.version += 1
    - 'cascade: if parent SAR.status == READY_FOR_PHASE_ADVANCE, SAR regresses to UNDER_REVIEW (SAR version += 1) and DCA.version
      += 1'
  - from: REOPENED
    to: RESPONSE_SUBMITTED
    trigger: POST /licensing/rais/{id}/respond (second response)
    actor: DcaApplicant
    preconditions:
    - RAI.status == REOPENED
    side_effects:
    - RAI.responded_at refreshed; late_response recomputed against same due_date
    - parent SAR.open_rais recomputed
  - from: OPEN
    to: SUPERSEDED
    trigger: POST /licensing/rais/{id}/supersede
    actor: NrcReviewer
    preconditions:
    - RAI.status IN {OPEN, REOPENED}
    side_effects:
    - RAI.version += 1; parent SAR.open_rais recomputed
  - from: REOPENED
    to: SUPERSEDED
    trigger: POST /licensing/rais/{id}/supersede
    actor: NrcReviewer
    preconditions:
    - RAI.status IN {OPEN, REOPENED}
    side_effects:
    - same as OPEN->SUPERSEDED
- entity: TestProgram
  initial_state: PLANNED
  terminal_states: []
  transitions:
  - from: PLANNED
    to: IN_PROGRESS
    trigger: POST /licensing/test-programs/{id}/start
    actor: DcaApplicant
    preconditions:
    - TestProgram.status == PLANNED
    side_effects:
    - TestProgram.version += 1
  - from: IN_PROGRESS
    to: ADEQUATE
    trigger: 'system: POST /licensing/test-programs/{id}/results with outcome=PASS causes completed_tests to reach required_tests'
    actor: system
    preconditions:
    - TestProgram.status == IN_PROGRESS
    - completed_tests == required_tests after this PASS
    side_effects:
    - TestProgram.status = ADEQUATE; version += 1
    - 'gating side effect: ComponentLot procurement against this program is now permitted (program.status == ADEQUATE satisfies
      lot precondition)'
  - from: ADEQUATE
    to: INSUFFICIENT
    trigger: 'system: a new TestResult with outcome=FAIL is recorded against an ADEQUATE program'
    actor: system
    preconditions:
    - TestProgram.status == ADEQUATE
    - outcome == FAIL
    side_effects:
    - TestProgram.status = INSUFFICIENT; version += 1
    - 'cascade: ComponentLot rows with program_id == this program AND status == PROCURED are transitioned to REJECTED (each
      lot version += 1)'
  - from: INSUFFICIENT
    to: IN_PROGRESS
    trigger: POST /licensing/test-programs/{id}/restart
    actor: DcaApplicant
    preconditions:
    - TestProgram.status == INSUFFICIENT
    side_effects:
    - TestProgram.version += 1
  - from: IN_PROGRESS
    to: INSUFFICIENT
    trigger: 'system: TestResult FAIL recorded while IN_PROGRESS and completed_tests > 0'
    actor: system
    preconditions:
    - TestProgram.status == IN_PROGRESS
    - outcome == FAIL
    - completed_tests > 0
    side_effects:
    - TestProgram.status = INSUFFICIENT; version += 1
- entity: VendorQualification
  initial_state: AUDIT_SCHEDULED
  terminal_states:
  - SUPERSEDED
  - DISQUALIFIED
  transitions:
  - from: AUDIT_SCHEDULED
    to: CONDITIONALLY_QUALIFIED
    trigger: POST /licensing/vendors/{vendor_id}/qualifications/{id}/complete-audit
    actor: VendorAuditor
    preconditions:
    - VendorQualification.status == AUDIT_SCHEDULED
    - defects_found > 0
    side_effects:
    - Vendor.qualified recomputed; Vendor.has_active_qualification recomputed
  - from: AUDIT_SCHEDULED
    to: FULLY_QUALIFIED
    trigger: POST /licensing/vendors/{vendor_id}/qualifications/{id}/complete-audit
    actor: VendorAuditor
    preconditions:
    - VendorQualification.status == AUDIT_SCHEDULED
    - defects_found == 0
    side_effects:
    - Vendor.qualified recomputed
  - from: CONDITIONALLY_QUALIFIED
    to: FULLY_QUALIFIED
    trigger: POST /licensing/vendors/{vendor_id}/qualifications/{id}/upgrade
    actor: VendorAuditor
    preconditions:
    - VendorQualification.status == CONDITIONALLY_QUALIFIED
    - defects_found < QUALIFIED_DEFECTS_THRESHOLD (3)
    side_effects:
    - Vendor.qualified recomputed
  - from: CONDITIONALLY_QUALIFIED
    to: DISQUALIFIED
    trigger: POST /licensing/vendors/{vendor_id}/qualifications/{id}/disqualify
    actor: VendorAuditor
    preconditions:
    - VendorQualification.status == CONDITIONALLY_QUALIFIED
    side_effects:
    - Vendor.qualified recomputed (becomes false if no other active qualification)
    - 'cascade: ComponentLot rows with vendor_id == this vendor AND status == PROCURED are transitioned to REJECTED'
  - from: AUDIT_SCHEDULED
    to: DISQUALIFIED
    trigger: POST /licensing/vendors/{vendor_id}/qualifications/{id}/disqualify
    actor: VendorAuditor
    preconditions:
    - VendorQualification.status == AUDIT_SCHEDULED
    - defects_found >= QUALIFIED_DEFECTS_THRESHOLD (3)
    side_effects:
    - Vendor.qualified recomputed
  - from: CONDITIONALLY_QUALIFIED
    to: SUPERSEDED
    trigger: 'system: new VendorQualification created for the same vendor while an active qualification exists'
    actor: system
    preconditions:
    - new qualification created
    side_effects:
    - prior active qualification (status IN {AUDIT_SCHEDULED, CONDITIONALLY_QUALIFIED, FULLY_QUALIFIED}) transitions to SUPERSEDED;
      Vendor fields recomputed
  - from: AUDIT_SCHEDULED
    to: SUPERSEDED
    trigger: 'system: same as above'
    actor: system
    preconditions:
    - new qualification created
    side_effects:
    - same as above
  - from: FULLY_QUALIFIED
    to: SUPERSEDED
    trigger: 'system: same as above'
    actor: system
    preconditions:
    - new qualification created
    side_effects:
    - same as above
- entity: ComponentLot
  initial_state: PROCURED
  terminal_states:
  - RELEASED
  - REJECTED
  transitions:
  - from: PROCURED
    to: DELIVERED
    trigger: POST /licensing/component-lots/{id}/deliver
    actor: SupplyChainManager
    preconditions:
    - ComponentLot.status == PROCURED
    - Vendor of lot has qualified == true (latest active qualification FULLY_QUALIFIED)
    side_effects:
    - ComponentLot.version += 1
  - from: DELIVERED
    to: RELEASED
    trigger: POST /licensing/component-lots/{id}/release
    actor: SupplyChainManager
    preconditions:
    - ComponentLot.status == DELIVERED
    - program of lot has status == ADEQUATE
    side_effects:
    - ComponentLot.version += 1
  - from: PROCURED
    to: REJECTED
    trigger: 'system: vendor disqualification cascade or test-program failure cascade'
    actor: system
    preconditions:
    - ComponentLot.status == PROCURED
    side_effects:
    - ComponentLot.version += 1
- entity: SitePermit
  initial_state: DRAFT
  terminal_states:
  - GRANTED
  - DENIED
  transitions:
  - from: DRAFT
    to: ENVIRONMENTAL_REVIEW
    trigger: POST /licensing/site-permits/{id}/submit
    actor: SitePermitApplicant
    preconditions:
    - SitePermit.status == DRAFT
    - DCA referenced has status != WITHDRAWN
    side_effects:
    - SitePermit.version += 1
  - from: ENVIRONMENTAL_REVIEW
    to: HEARINGS
    trigger: POST /licensing/site-permits/{id}/advance-to-hearings
    actor: SitePermitApplicant
    preconditions:
    - SitePermit.status == ENVIRONMENTAL_REVIEW
    - no PublicHearing of this permit with status == SCHEDULED
    side_effects:
    - SitePermit.version += 1
  - from: HEARINGS
    to: ENVIRONMENTAL_REVIEW
    trigger: 'system: a PublicHearing of this permit transitions to CONTENDED (contention cascades permit regression)'
    actor: system
    preconditions:
    - SitePermit.status == HEARINGS
    - a hearing of this permit becomes CONTENDED
    side_effects:
    - SitePermit.status = ENVIRONMENTAL_REVIEW; version += 1
    - 'bubble: permit regression forces the permit owner to re-run environmental review before re-entering HEARINGS'
  - from: HEARINGS
    to: GRANTED
    trigger: POST /licensing/site-permits/{id}/grant
    actor: SitePermitApplicant
    preconditions:
    - SitePermit.status == HEARINGS
    - all PublicHearing rows of this permit have status == HELD
    - at least one PublicHearing exists
    side_effects:
    - SitePermit.version += 1
  - from: ENVIRONMENTAL_REVIEW
    to: DENIED
    trigger: POST /licensing/site-permits/{id}/deny
    actor: SitePermitApplicant
    preconditions:
    - SitePermit.status == ENVIRONMENTAL_REVIEW
    side_effects:
    - SitePermit.version += 1
  - from: HEARINGS
    to: DENIED
    trigger: POST /licensing/site-permits/{id}/deny
    actor: SitePermitApplicant
    preconditions:
    - SitePermit.status == HEARINGS
    side_effects:
    - SitePermit.version += 1
- entity: PublicHearing
  initial_state: SCHEDULED
  terminal_states:
  - HELD
  - CANCELLED
  transitions:
  - from: SCHEDULED
    to: HELD
    trigger: POST /licensing/public-hearings/{id}/mark-held
    actor: SitePermitApplicant
    preconditions:
    - PublicHearing.status == SCHEDULED
    - clock >= scheduled_at
    side_effects:
    - PublicHearing.version += 1
    - 'bubble: permit''s HEARINGS->GRANTED precondition re-evaluated'
  - from: SCHEDULED
    to: CONTENDED
    trigger: POST /licensing/public-hearings/{id}/contend
    actor: PublicIntervenor
    preconditions:
    - PublicHearing.status == SCHEDULED
    - clock < scheduled_at
    side_effects:
    - PublicHearing.version += 1
    - 'cascade: parent SitePermit in HEARINGS regresses to ENVIRONMENTAL_REVIEW'
  - from: SCHEDULED
    to: CANCELLED
    trigger: POST /licensing/public-hearings/{id}/cancel
    actor: SitePermitApplicant
    preconditions:
    - PublicHearing.status == SCHEDULED
    - clock < scheduled_at
    side_effects:
    - PublicHearing.version += 1
  - from: SCHEDULED
    to: CANCELLED
    trigger: 'system: clock reaches scheduled_at without mark-held (expiry sweep)'
    actor: system
    preconditions:
    - PublicHearing.status == SCHEDULED
    - clock >= scheduled_at
    - mark-held not called
    side_effects:
    - PublicHearing.status = CANCELLED; version += 1
  - from: CONTENDED
    to: SCHEDULED
    trigger: POST /licensing/public-hearings/{id}/reschedule
    actor: SitePermitApplicant
    preconditions:
    - PublicHearing.status == CONTENDED
    - new scheduled_at strictly in future
    side_effects:
    - PublicHearing.version += 1; contention cleared
- entity: SubscriptionCommitment
  initial_state: DRAFT
  terminal_states:
  - WITHDRAWN
  transitions:
  - from: DRAFT
    to: EXECUTED
    trigger: POST /licensing/subscriptions/{id}/execute
    actor: UtilityParticipant
    preconditions:
    - SubscriptionCommitment.status == DRAFT
    - committed_mw <= DCA.available_mw (escalation_gate boundary check)
    - DCA.status IN {SUBMITTED, SAFETY_REVIEW, ADVANCED_REVIEW}
    side_effects:
    - SubscriptionCommitment.version += 1
    - DCA.subscribed_mw recomputed; DCA.available_mw recomputed; DCA.version += 1
  - from: EXECUTED
    to: LOCKED
    trigger: 'system: DCA reaches CERTIFIED (certify cascade locks all EXECUTED subscriptions)'
    actor: system
    preconditions:
    - SubscriptionCommitment.status == EXECUTED
    - DCA.status -> CERTIFIED
    side_effects:
    - SubscriptionCommitment.version += 1
    - cost_share_total_usd = waterfall_allocation share at LOCK time
    - withdrawal_reserve_usd = cost_share_total_usd
    - CostShareAgreement.allocated_to_participants_usd recomputed
  - from: EXECUTED
    to: WITHDRAWN
    trigger: POST /licensing/subscriptions/{id}/withdraw
    actor: UtilityParticipant
    preconditions:
    - SubscriptionCommitment.status == EXECUTED
    - request body's expected_cost_share_agreement_version matches current (OCC)
    side_effects:
    - offload_penalty_usd computed per withdrawal_penalty calculation
    - SubscriptionCommitment.version += 1
    - DCA.subscribed_mw recomputed; DCA.available_mw recomputed
    - CostShareAgreement.allocated_to_participants_usd recomputed (withdrawing participant's allocated share freed)
  - from: EXECUTED
    to: WITHDRAWN
    trigger: 'system: escalation_reallocation when remaining participants cannot absorb overrun (off-ramp)'
    actor: system
    preconditions:
    - SubscriptionCommitment.status == EXECUTED
    - escalation causes this participant's pro-rata overrun > withdrawal_reserve_usd
    side_effects:
    - SubscriptionCommitment.status = WITHDRAWN; offload_penalty_usd = 0
    - DCA.funding_gap_usd increased by un-allocatable overrun
- entity: WorkforcePipeline
  initial_state: ENROLLING
  terminal_states:
  - STAFFED
  transitions:
  - from: ENROLLING
    to: TRAINING
    trigger: POST /licensing/workforce-pipelines/{id}/start-training
    actor: WorkforceCoordinator
    preconditions:
    - WorkforcePipeline.status == ENROLLING
    side_effects:
    - WorkforcePipeline.version += 1
  - from: TRAINING
    to: GRADUATING
    trigger: POST /licensing/workforce-pipelines/{id}/advance
    actor: WorkforceCoordinator
    preconditions:
    - WorkforcePipeline.status == TRAINING
    side_effects:
    - WorkforcePipeline.version += 1
  - from: GRADUATING
    to: STAFFED
    trigger: 'system: graduates count reaches required_operators'
    actor: system
    preconditions:
    - WorkforcePipeline.status == GRADUATING
    - graduates >= required_operators
    side_effects:
    - WorkforcePipeline.status = STAFFED; version += 1
  - from: GRADUATING
    to: ENROLLING
    trigger: 'system: a REVOKED OperatorLicense drops graduates below required_operators (attrition loop)'
    actor: system
    preconditions:
    - WorkforcePipeline.status == GRADUATING
    - graduates < required_operators
    side_effects:
    - WorkforcePipeline.status = ENROLLING; version += 1
- entity: OperatorLicense
  initial_state: ENROLLED
  terminal_states:
  - REVOKED
  transitions:
  - from: ENROLLED
    to: LICENSED
    trigger: POST /licensing/operator-licenses/{id}/license
    actor: WorkforceCoordinator
    preconditions:
    - OperatorLicense.license_status == ENROLLED
    - parent pipeline status == TRAINING
    side_effects:
    - OperatorLicense.version += 1
    - parent pipeline.graduates recomputed; if reaches required_operators pipeline may auto-advance
  - from: LICENSED
    to: ACTIVE
    trigger: POST /licensing/operator-licenses/{id}/activate
    actor: WorkforceCoordinator
    preconditions:
    - OperatorLicense.license_status == LICENSED
    - parent pipeline status IN {TRAINING, GRADUATING}
    side_effects:
    - OperatorLicense.version += 1
  - from: LICENSED
    to: REVOKED
    trigger: POST /licensing/operator-licenses/{id}/revoke
    actor: WorkforceCoordinator
    preconditions:
    - OperatorLicense.license_status IN {LICENSED, ACTIVE}
    side_effects:
    - OperatorLicense.version += 1
    - parent pipeline.graduates recomputed; if pipeline was STAFFED or GRADUATING and now under required_operators, pipeline
      regresses to ENROLLING
  - from: ACTIVE
    to: REVOKED
    trigger: POST /licensing/operator-licenses/{id}/revoke
    actor: WorkforceCoordinator
    preconditions:
    - OperatorLicense.license_status IN {LICENSED, ACTIVE}
    side_effects:
    - same as LICENSED->REVOKED
concurrency_rules:
- rule_id: subscription-withdraw-stale-csa
  parent_entity: CostShareAgreement
  write_endpoint: POST /licensing/subscriptions/{id}/withdraw
  occ_field: expected_cost_share_agreement_version
  description: 'Withdrawing a SubscriptionCommitment against a CostShareAgreement whose version

    has advanced since the client last observed it is rejected with 412. The OCC

    check pins the client''s view of the allocation pool so two strictly sequential

    withdrawals cannot both read the same allocated_to_participants_usd and each

    assume the freed pool is theirs; the second observes a stale version.

    '
  error_id: ERR_STALE_VERSION
  http_status: 412
calculations:
- name: foak_cost_allocation
  trigger: on SubscriptionCommitment LOCK (system cascade from DCA certify)
  algorithm: waterfall_allocation
  formula: "pool = CostShareAgreement.participant_share_usd\nsubscriptions = LOCKED subscriptions ordered by created_at ASC\
    \ (tie-break: none needed, created_at distinct)\nfor each subscription in order:\n  base_share = floor(pool * committed_mw\
    \ / DCA.plant_net_capacity_mw)\nremainder = pool - sum(base_share)\ndistribute remainder one dollar at a time in the same\
    \ created_at ASC order until exhausted\neach subscription.cost_share_total_usd = base_share + remainder_dollars_received\n\
    each subscription.withdrawal_reserve_usd = cost_share_total_usd\n"
  input_set: SubscriptionCommitment rows of the DCA with status == LOCKED at certify time
  constants:
    POOL: CostShareAgreement.participant_share_usd
  precision: integer USD; floor per-share then distribute remainder left-to-right
  variants:
  - name: per_share_floor_then_remainder
    when: default
    difference: floor each share then allocate remainder in created_at order (pinned)
  - name: sum_then_round
    when: forbidden alternative; would produce different per-participant dollar totals
    difference: 'explicitly rejected: scaffold pins per-share floor first'
- name: escalation_reallocation
  trigger: POST /licensing/cost-share-agreements/{id}/escalate
  algorithm: waterfall_allocation
  formula: "overrun_usd = escalate payload\nparticipants = EXECUTED+LOCKED subscriptions ordered by created_at ASC\nfor each\
    \ participant in order:\n  pro_rata = floor(overrun_usd * committed_mw / total_committed_mw_at_escalation)\n  capacity\
    \ = withdrawal_reserve_usd (for EXECUTED) OR remaining headroom (for LOCKED, reserve already partially consumed)\n  allocated\
    \ = min(pro_rata, capacity)\n  participant.allocated_overrun_usd += allocated\n  participant.withdrawal_reserve_usd -=\
    \ allocated (EXECUTED only)\n  if pro_rata > capacity:\n    DCA.funding_gap_usd += (pro_rata - capacity)\n    if participant\
    \ was EXECUTED and capacity == 0: participant transitions to WITHDRAWN (off-ramp)\nremainder = overrun_usd - sum(allocated)\
    \ - sum(funding_gap increments)\nif remainder > 0: distribute one dollar at a time in created_at ASC order to participants\
    \ with capacity\n"
  input_set: subscriptions of the DCA with status IN {EXECUTED, LOCKED}
  constants:
    OFF_RAMP_THRESHOLD: withdrawal_reserve_usd == 0 forces WITHDRAWN for EXECUTED
  precision: integer USD; floor per-participant then distribute remainder
  variants:
  - name: forward_looking_pool
    when: escalation evaluated against current reserve snapshot (pinned)
    difference: uses current withdrawal_reserve_usd; not original cost_share_total_usd
  - name: chronological_pro_rata
    when: alternative using original cost_share_total_usd as base (rejected)
    difference: would over-allocate to participants whose reserve was already consumed
- name: epz_radius_determination
  trigger: on DCA create and on PATCH of source_term_fraction or site_boundary_miles
  algorithm: weighted_scoring
  formula: 'epz_radius_deterministic_miles = 10.0 * source_term_fraction

    dose_term = 2.0 * sqrt(site_boundary_miles)

    margin_term = 5.0 * (1.0 - source_term_fraction)

    epz_radius_dose_based_miles = max(0.5, dose_term + margin_term)

    epz_radius_selected_miles = max(0.5, min(10.0, max(epz_radius_deterministic_miles, epz_radius_dose_based_miles)))

    '
  input_set: single DCA row's source_term_fraction and site_boundary_miles
  constants:
    DETERMINISTIC_SCALE: 10.0
    DOSE_COEFF: 2.0
    MARGIN_COEFF: 5.0
    MIN_EPZ: 0.5
    MAX_EPZ: 10.0
  precision: 2 decimal places, round_half_up at each named output field
  variants:
  - name: deterministic
    when: ESP permits freeze this variant into SitePermit.epz_radius_miles
    difference: linear in source_term_fraction only; ignores site boundary
  - name: dose_based
    when: COL permits freeze the conservative selected radius (max of both, capped)
    difference: non-linear in site_boundary_miles via sqrt; dominates at low source_term_fraction
- name: withdrawal_penalty
  trigger: on SubscriptionCommitment EXECUTED -> WITHDRAWN via POST /withdraw (not system off-ramp)
  algorithm: tiered_pricing
  formula: "reserve = withdrawal_reserve_usd at time of withdrawal\npenalty = 0\nfor each tier in WITHDRAWAL_TIERS ordered\
    \ ascending by days_since_execution:\n  if days_since_execution >= tier.min_days and (tier.max_days is null or days_since_execution\
    \ < tier.max_days):\n    penalty = floor(reserve * tier.rate)\noffload_penalty_usd = penalty\n"
  input_set: the withdrawing subscription's withdrawal_reserve_usd and days since EXECUTE
  constants:
    WITHDRAWAL_TIERS:
    - min_days: 0
      max_days: 30
      rate: 0.0
    - min_days: 30
      max_days: 180
      rate: 0.1
    - min_days: 180
      max_days: null
      rate: 0.25
  precision: integer USD, floor
  variants: []
- name: qualification_variant_selection
  trigger: on VendorQualification complete-audit, upgrade, or disqualify
  algorithm: threshold
  formula: 'if status == FULLY_QUALIFIED: qualified_variant = FULLY_QUALIFIED

    elif status == CONDITIONALLY_QUALIFIED and defects_found < QUALIFIED_DEFECTS_THRESHOLD: qualified_variant = CONDITIONALLY_QUALIFIED

    else: qualified_variant = UNQUALIFIED

    Vendor.qualified = (latest active qualification''s qualified_variant == FULLY_QUALIFIED)

    '
  input_set: single VendorQualification row
  constants:
    QUALIFIED_DEFECTS_THRESHOLD: 3
  precision: boolean derivation; boundary defects_found == 3 yields UNQUALIFIED even when CONDITIONALLY_QUALIFIED
  variants:
  - name: latest_status
    when: pinned
    difference: variant derives from current status AND defects_found, not status alone
  - name: status_only
    when: rejected
    difference: would treat CONDITIONALLY_QUALIFIED with 5 defects as qualified
- name: cost_share_conservation
  trigger: invariant check after every escalation_reallocation and after every withdrawal
  algorithm: aggregation
  formula: "total_allocated = sum over all SubscriptionCommitment of (cost_share_total_usd + allocated_overrun_usd)\nexpected\
    \ = CostShareAgreement.participant_share_usd\nif DCA.funding_gap_usd > 0:\n  expected -= DCA.funding_gap_usd\nassert total_allocated\
    \ == expected\n"
  input_set: all SubscriptionCommitment rows of the DCA regardless of status
  constants: {}
  precision: integer USD exact match
  variants: []
- name: epz_site_freeze
  trigger: on SitePermit create
  algorithm: aggregation
  formula: 'if permit_type == ESP: epz_radius_miles = DCA.epz_radius_deterministic_miles

    elif permit_type == COL: epz_radius_miles = DCA.epz_radius_selected_miles

    '
  input_set: DCA row referenced by permit
  constants: {}
  precision: 2 decimal places, round_half_up
  variants: []
validations:
- priority: 1
  category: auth
  check: X-User-Role header present and one of the declared roles
  error_id: ERR_UNAUTHENTICATED
  http_status: 401
  applies_to: all
- priority: 2
  category: auth
  check: role permitted for the operation per RBAC matrix
  error_id: ERR_UNAUTHORIZED
  http_status: 403
  applies_to: all
- priority: 3
  category: existence
  check: path-templated ids resolve to existing resources, left-to-right
  error_id: ERR_NOT_FOUND
  http_status: 404
  applies_to: all
- priority: 4
  category: existence
  check: request-body FK references (dca_id, vendor_id, program_id, pipeline_id, utility_id, permit_id, sar_section_code)
    resolve to existing rows
  error_id: ERR_NOT_FOUND
  http_status: 404
  applies_to: all
- priority: 5
  category: state
  check: target resource in a state from which the requested transition exists
  error_id: ERR_INVALID_STATE
  http_status: 409
  applies_to: all action endpoints
- priority: 6
  category: state
  check: 'segregation of duties: RAI accept requires X-User-ID != RAI.authored_by_user_id'
  error_id: ERR_SELF_ACCEPT_FORBIDDEN
  http_status: 403
  applies_to: POST /licensing/rais/{id}/accept
- priority: 7
  category: business_safety
  check: 'RAI response timeliness: if clock > due_date the response is still accepted but late_response=true; no rejection'
  error_id: n/a (informational)
  http_status: 200
  applies_to: POST /licensing/rais/{id}/respond
- priority: 8
  category: business_safety
  check: nuclear-grade ComponentLot creation requires Vendor.qualified == true AND program.status == ADEQUATE
  error_id: ERR_PROCUREMENT_GATE
  http_status: 422
  applies_to: POST /licensing/component-lots
- priority: 9
  category: business_constraint
  check: VendorQualification audit_date must not overlap a non-superseded qualification of the same vendor within +/-14 days
  error_id: ERR_AUDIT_OVERLAP
  http_status: 409
  applies_to: POST /licensing/vendors/{vendor_id}/qualifications
- priority: 10
  category: business_constraint
  check: PublicHearing scheduled_at must be strictly in the future (clock < scheduled_at)
  error_id: ERR_HEARING_IN_PAST
  http_status: 422
  applies_to: POST /licensing/site-permits/{id}/hearings, POST /licensing/public-hearings/{id}/reschedule
- priority: 11
  category: business_temporal
  check: PublicHearing mark-held requires clock >= scheduled_at; contend and cancel require clock < scheduled_at
  error_id: ERR_HEARING_WINDOW
  http_status: 422
  applies_to: POST /licensing/public-hearings/{id}/{mark-held,contend,cancel}
- priority: 12
  category: business_temporal
  check: TestResult run_at must not precede any earlier TestResult.run_at of the same program (chronological recording)
  error_id: ERR_OUT_OF_ORDER_RESULT
  http_status: 422
  applies_to: POST /licensing/test-programs/{id}/results
- priority: 13
  category: business_referential
  check: RAI sar_section_code must match an existing SafetyAnalysisReport of the same DCA
  error_id: ERR_SAR_SECTION_UNKNOWN
  http_status: 422
  applies_to: POST /licensing/dcas/{id}/rais
- priority: 14
  category: business_fiscal
  check: 'escalation_gate: SubscriptionCommitment execute requires committed_mw <= DCA.available_mw'
  error_id: ERR_CAPACITY_EXCEEDED
  http_status: 422
  applies_to: POST /licensing/subscriptions/{id}/execute
- priority: 15
  category: business_fiscal
  check: 'OCC: expected_cost_share_agreement_version must match current CostShareAgreement.version'
  error_id: ERR_STALE_VERSION
  http_status: 412
  applies_to: POST /licensing/subscriptions/{id}/withdraw
- priority: 16
  category: business_fiscal
  check: CostShareAgreement escalate requires overrun_usd > 0 and <= 3x participant_share_usd
  error_id: ERR_ESCALATION_OUT_OF_RANGE
  http_status: 422
  applies_to: POST /licensing/cost-share-agreements/{id}/escalate
- priority: 17
  category: business_constraint
  check: 'unique constraints: docket_number, vendor name, (dca_id, section_code, revision_number), (dca_id, program_code),
    (dca_id, cohort_code), (dca_id, utility_id) subscription pair'
  error_id: ERR_DUPLICATE
  http_status: 409
  applies_to: create endpoints
- priority: 18
  category: business_constraint
  check: COL creation requires DCA.status == CERTIFIED
  error_id: ERR_DCA_NOT_CERTIFIED
  http_status: 422
  applies_to: POST /licensing/site-permits with permit_type=COL
endpoints:
- method: POST
  path: /licensing/dcas
  description: Create a DesignCertification application; computes EPZ variants immediately
  roles:
  - DcaApplicant
  code: 201
  input:
  - docket_number
  - reactor_model
  - target_power_mwt
  - plant_net_capacity_mw
  - source_term_fraction
  - site_boundary_miles
  output: DesignCertification
  side_effects:
  - epz_radius_determination computes all three EPZ fields
- method: GET
  path: /licensing/dcas/{id}
  description: Retrieve one DCA including computed EPZ, subscription, funding-gap fields
  roles:
  - DcaApplicant
  - NrcReviewer
  - DoeProgram
  - UtilityParticipant
  - SupplyChainManager
  - SitePermitApplicant
  - WorkforceCoordinator
  - VendorAuditor
  - PublicIntervenor
  code: 200
  input: []
  output: DesignCertification
  side_effects: []
- method: PATCH
  path: /licensing/dcas/{id}
  description: Update source_term_fraction or site_boundary_miles (SUBMITTED or SAFETY_REVIEW only); recomputes EPZ
  roles:
  - DcaApplicant
  code: 200
  input:
  - source_term_fraction?
  - site_boundary_miles?
  output: DesignCertification
  side_effects:
  - epz_radius_determination recomputed; version += 1
- method: POST
  path: /licensing/dcas/{id}/enter-safety-review
  description: Advance DCA SUBMITTED -> SAFETY_REVIEW
  roles:
  - NrcReviewer
  code: 200
  input: []
  output: DesignCertification
  side_effects:
