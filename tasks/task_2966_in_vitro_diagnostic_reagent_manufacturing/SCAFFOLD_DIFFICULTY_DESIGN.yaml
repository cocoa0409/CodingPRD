  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: acceptance_score_inclusive_at_exactly_85_00_and_unrounded_subscores_at_84_88
        grounds:
          - calculations.material_lot_acceptance_score
          - calculations.material_lot_acceptance_decision
          - calculations.test_result_outcome
          - entities.MaterialLot.fields.acceptance_score
        distinguishing_aspect: |
          Two lots straddle ACCEPTANCE_SCORE_MIN by one hundredth. The pass side sits
          EXACTLY on 85.00 and must be accepted because the comparison is `>=`, and
          the fail side is 84.88, which an implementation that rounds the PURITY
          sub-score to 2 decimals before weighting would compute as 85.00 and wrongly
          qualify: 0.996 -> 1.00 lifts the total by 0.0012 across the boundary. The
          declared precision rule (sub-scores unrounded, only the final percentage
          rounded) is therefore observable from the outside, and a FAILING POTENCY
          outcome is present on both lots to prove individual outcomes do not gate
          WEIGHTED_SCORE.
        test_recipe:
          setup:
            - "One MaterialSpecification EZ-BND with acceptance_mode WEIGHTED_SCORE, potency bounds 90.0-110.0, purity_min_pct 95.0, endotoxin_max_eu_per_ml 2.0 and required_test_codes [POTENCY, PURITY, ENDOTOXIN, IDENTITY], so the present-set denominator is the full 1.00."
            - "Lot BND-A with measurements POTENCY 88.75, PURITY 100.0, ENDOTOXIN 0.5, IDENTITY 1.0."
            - "Lot BND-B identical except PURITY 99.6."
            - "Clock parked at 2026-08-01T00:00:00Z throughout so ordering is by created_at."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /material-specifications"
              payload: { material_code: "EZ-BND", material_type: "ENZYME", potency_min_pct: 90.0, potency_max_pct: 110.0, endotoxin_max_eu_per_ml: 2.0, purity_min_pct: 95.0, required_test_codes: ["POTENCY", "PURITY", "ENDOTOXIN", "IDENTITY"], is_critical: false, acceptance_mode: "WEIGHTED_SCORE", max_retests: 2, retest_window_days: 30 }
              as: RegulatoryAffairs
              as_user_id: "ra-01"
              captures: { ms_id: $.data.id }
            - call: "POST /material-lots"
              payload: { material_specification_id: "${ms_id}", vendor_lot_code: "BND-A", received_quantity_units: 100.0, expiry_date: "2027-12-31T00:00:00Z" }
              as: ProductionOperator
              captures: { ml_a_id: $.data.id }
            - call: "POST /material-lots"
              payload: { material_specification_id: "${ms_id}", vendor_lot_code: "BND-B", received_quantity_units: 100.0, expiry_date: "2027-12-31T00:00:00Z" }
              as: ProductionOperator
              captures: { ml_b_id: $.data.id }
            - call: "POST /test-results"
              payload: { subject_type: "MATERIAL_LOT", material_lot_id: "${ml_a_id}", test_code: "POTENCY", measured_value: 88.75 }
              as: QCAnalyst
              as_user_id: "qc-01"
              captures: { pot_outcome: $.data.outcome }
            - call: "POST /test-results"
              payload: { subject_type: "MATERIAL_LOT", material_lot_id: "${ml_a_id}", test_code: "PURITY", measured_value: 100.0 }
              as: QCAnalyst
              as_user_id: "qc-01"
            - call: "POST /test-results"
              payload: { subject_type: "MATERIAL_LOT", material_lot_id: "${ml_a_id}", test_code: "ENDOTOXIN", measured_value: 0.5 }
              as: QCAnalyst
              as_user_id: "qc-01"
            - call: "POST /test-results"
              payload: { subject_type: "MATERIAL_LOT", material_lot_id: "${ml_a_id}", test_code: "IDENTITY", measured_value: 1.0 }
              as: QCAnalyst
              as_user_id: "qc-01"
              captures: { score_a: $.data.id }
            - call: "POST /test-results"
              payload: { subject_type: "MATERIAL_LOT", material_lot_id: "${ml_b_id}", test_code: "POTENCY", measured_value: 88.75 }
              as: QCAnalyst
              as_user_id: "qc-01"
            - call: "POST /test-results"
              payload: { subject_type: "MATERIAL_LOT", material_lot_id: "${ml_b_id}", test_code: "PURITY", measured_value: 99.6 }
              as: QCAnalyst
              as_user_id: "qc-01"
            - call: "POST /test-results"
              payload: { subject_type: "MATERIAL_LOT", material_lot_id: "${ml_b_id}", test_code: "ENDOTOXIN", measured_value: 0.5 }
              as: QCAnalyst
              as_user_id: "qc-01"
            - call: "POST /test-results"
              payload: { subject_type: "MATERIAL_LOT", material_lot_id: "${ml_b_id}", test_code: "IDENTITY", measured_value: 1.0 }
              as: QCAnalyst
              as_user_id: "qc-01"
          trigger:
            - call: "GET /material-lots/${ml_a_id}"
              payload: {}
              as: QAReleaser
              captures: { a_score: $.data.acceptance_score }
            - call: "GET /material-lots/${ml_b_id}"
              payload: {}
              as: QAReleaser
              captures: { b_score: $.data.acceptance_score }
            - call: "POST /material-lots/${ml_a_id}/disposition"
              payload: { decision: "QUALIFY" }
              as: QAReleaser
              as_user_id: "qa-01"
              captures: { a_status: $.data.qualification_status }
            - call: "POST /material-lots/${ml_b_id}/disposition"
              payload: { decision: "QUALIFY" }
              as: QAReleaser
              as_user_id: "qa-01"
              captures: { b_err: $.data.error_id }
          assert:
            - "the POTENCY TestResult on both lots has outcome FAIL because 88.75 < potency_min_pct 90.0"
            - "BND-A.acceptance_score == 85.00 exactly: 0.45*0.75 + 0.30*1.0 + 0.15*0.75 + 0.10*1.0 == 0.3375 + 0.3000 + 0.1125 + 0.1000 == 0.8500 over denominator 1.00, where the POTENCY sub-score is 1 - (90.0 - 88.75)/POTENCY_TOLERANCE_PCT 5.0 == 0.75 and the ENDOTOXIN sub-score is 1 - 0.5/2.0 == 0.75"
            - "BND-B.acceptance_score == 84.88: the PURITY sub-score is 99.6/100.0 == 0.996, contributing 0.2988, so the total is 0.8488 and round_half_up to 2dp gives 84.88 — an implementation that rounds the sub-score to 1.00 first would report 85.00"
            - "QUALIFY on BND-A returns HTTP 200 and qualification_status QUALIFIED: the comparison is acceptance_score >= ACCEPTANCE_SCORE_MIN 85.0 and equality accepts"
            - "QUALIFY on BND-B returns HTTP 409 with error_id ERR_ACCEPTANCE_CRITERIA_NOT_MET and leaves qualification_status at UNDER_TEST — 84.88 is 0.12 below the floor"
            - "any_zero_subscore is false on both lots (the smallest sub-score is 0.75), so the veto plays no part and the boundary alone decides"
            - "both scores are stored at exactly 2 decimal places (85.00 and 84.88, never 85.0 or 84.9)"

      - name: environmental_limit_equality_conforming_double_limit_major_and_third_minor_disqualifies
        grounds:
          - calculations.environmental_state
          - entities.MonitoringSample.fields.excursion
          - entities.MonitoringSample.fields.excursion_grade
          - entities.FillRun.fields.environmental_state
          - entities.ReagentLot.fields.em_excursion_count
        distinguishing_aspect: |
          A different boundary FLAVOUR from the score instance: three thresholds are
          probed at once on the same limit of 10.0 CFU/m3 — the strict-inequality
          excursion test at exactly the limit (10.0 is CONFORMING, 10.1 is not), the
          `>=` MAJOR test at exactly twice the limit (20.0 is MAJOR, not MINOR), and
          the COUNTING threshold MINOR_DISQUALIFY_COUNT where two minors leave the
          run merely EXCURSION and the third tips it to DISQUALIFIED. One is a value
          boundary, one is a multiple boundary and one is a cardinality boundary.
        test_recipe:
          setup:
            - "ProductSpecification IVD-BND-2 and one PLANNED ReagentLot BND-LOT-1 with three SCHEDULED FillRuns on LINE-C on three separate days, so no changeover buffer is involved."
            - "No run is ever started, so every sample is recorded while its run is SCHEDULED and the lot stays PLANNED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /product-specifications"
              payload: { product_code: "IVD-BND-2", reference_material_code: "REF-3", required_material_codes: [], release_test_codes: ["ACTIVITY"], max_reference_bias_pct: 5.0, shelf_life_months_claim: 12, storage_condition: "TWO_TO_EIGHT_C", min_shelf_life_days_at_ship: 90 }
              as: RegulatoryAffairs
              as_user_id: "ra-01"
              captures: { ps_id: $.data.id }
            - call: "POST /reagent-lots"
              payload: { product_specification_id: "${ps_id}", lot_code: "BND-LOT-1", planned_units: 300 }
              as: ProductionOperator
              captures: { rl_id: $.data.id }
            - call: "POST /fill-runs"
              payload: { reagent_lot_id: "${rl_id}", line_code: "LINE-C", formulation_batch_code: "BULK-B1", scheduled_start: "2026-08-10T06:00:00Z", scheduled_end: "2026-08-10T10:00:00Z", planned_fill_units: 100 }
              as: ProductionOperator
              captures: { fr_1_id: $.data.id }
            - call: "POST /fill-runs"
              payload: { reagent_lot_id: "${rl_id}", line_code: "LINE-C", formulation_batch_code: "BULK-B2", scheduled_start: "2026-08-12T06:00:00Z", scheduled_end: "2026-08-12T10:00:00Z", planned_fill_units: 100 }
              as: ProductionOperator
              captures: { fr_2_id: $.data.id }
            - call: "POST /fill-runs"
              payload: { reagent_lot_id: "${rl_id}", line_code: "LINE-C", formulation_batch_code: "BULK-B3", scheduled_start: "2026-08-14T06:00:00Z", scheduled_end: "2026-08-14T10:00:00Z", planned_fill_units: 100 }
              as: ProductionOperator
              captures: { fr_3_id: $.data.id }
          trigger:
            - call: "POST /fill-runs/${fr_1_id}/samples"
              payload: { sample_type: "VIABLE_AIR", location_code: "ROOM-1", result_value: 10.0, sampled_at: "2026-08-10T07:00:00Z" }
              as: QCAnalyst
              as_user_id: "qc-01"
              captures: { s1_grade: $.data.excursion_grade, s1_exc: $.data.excursion, s1_limit: $.data.limit_value }
            - call: "POST /fill-runs/${fr_2_id}/samples"
              payload: { sample_type: "VIABLE_AIR", location_code: "ROOM-2", result_value: 10.1, sampled_at: "2026-08-12T07:00:00Z" }
              as: QCAnalyst
              as_user_id: "qc-01"
              captures: { s2_grade: $.data.excursion_grade }
            - call: "POST /fill-runs/${fr_2_id}/samples"
              payload: { sample_type: "VIABLE_AIR", location_code: "ROOM-2", result_value: 10.2, sampled_at: "2026-08-12T07:30:00Z" }
              as: QCAnalyst
              as_user_id: "qc-01"
            - call: "GET /fill-runs/${fr_2_id}"
              payload: {}
              as: ProductionOperator
              captures: { r2_state_two_minors: $.data.environmental_state }
            - call: "POST /fill-runs/${fr_2_id}/samples"
              payload: { sample_type: "VIABLE_AIR", location_code: "ROOM-2", result_value: 10.3, sampled_at: "2026-08-12T08:00:00Z" }
              as: QCAnalyst
              as_user_id: "qc-01"
            - call: "POST /fill-runs/${fr_3_id}/samples"
              payload: { sample_type: "VIABLE_AIR", location_code: "ROOM-3", result_value: 20.0, sampled_at: "2026-08-14T07:00:00Z" }
              as: QCAnalyst
              as_user_id: "qc-01"
              captures: { s4_grade: $.data.excursion_grade }
            - call: "GET /reagent-lots/${rl_id}"
              payload: {}
              as: ProductionOperator
              captures: { em_count: $.data.em_excursion_count }
          assert:
            - "every sample stores limit_value 10.0 from LIMIT_VIABLE_AIR_CFU_PER_M3, independent of its own value"
            - "the 10.0 sample has excursion false and excursion_grade NONE because the test is result_value > limit_value and equality is CONFORMING; FillRun 1 stays environmental_state CONFORMING with minor_excursion_count 0"
            - "the 10.1 sample has excursion true and excursion_grade MINOR — one hundredth above the limit is already an excursion"
            - "after two MINOR samples FillRun 2 has minor_excursion_count 2 and environmental_state EXCURSION, because 2 < MINOR_DISQUALIFY_COUNT 3"
            - "after the third MINOR sample FillRun 2 has minor_excursion_count 3, major_excursion_count 0 and environmental_state DISQUALIFIED, on the cardinality boundary alone with no MAJOR grade present"
            - "the 20.0 sample has excursion_grade MAJOR because the rule is result_value >= 2.0 * limit_value and 20.0 is exactly twice 10.0, so FillRun 3 goes straight to DISQUALIFIED from a single sample with minor_excursion_count 0"
            - "ReagentLot.em_excursion_count == 4: it counts samples with excursion true across all runs of the lot (0 from run 1, 3 from run 2, 1 from run 3), not the number of disqualified runs"
            - "the lot's disposition_status is still PLANNED — recording samples never advances the lot, and the auto-reject hop only fires on a completing run"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: reagent_lot_release_gated_on_product_specification_clearance_state
        grounds:
          - state_machines.ReagentLot.UNDER_RELEASE_TEST_to_RELEASED
          - state_machines.ProductSpecification.DESIGN_to_CLEARED
          - validations.priority_130_ERR_PRODUCT_NOT_CLEARED
          - calculations.design_trace_completeness
        distinguishing_aspect: |
          The blocked operation and the blocking state live on DIFFERENT aggregates
          two levels apart: nothing about the ReagentLot changes between the failing
          and the succeeding release, and the repair is performed by a different role
          (RegulatoryAffairs filing the clearance) on the parent ProductSpecification.
          The gate is a state on the parent, not a field on the subject.
        test_recipe:
          setup:
            - "ProductSpecification IVD-CE-1 with all four design records APPROVED, so design_trace_complete is true, but the clearance is NOT filed: clearance_status is DESIGN."
            - "One QUALIFIED MaterialLot of the single required material code."
            - "ReagentLot CE-LOT-1 filled to 300 units with a CONFORMING run and one PASS ACTIVITY release test at zero bias, so disposition_status is UNDER_RELEASE_TEST and every release precondition except the parent's clearance holds."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /material-specifications"
              payload: { material_code: "AB-CE", material_type: "ANTIBODY", potency_min_pct: 90.0, potency_max_pct: 110.0, endotoxin_max_eu_per_ml: 2.0, purity_min_pct: 95.0, required_test_codes: ["POTENCY"], is_critical: false, acceptance_mode: "ALL_PASS", max_retests: 1, retest_window_days: 30 }
