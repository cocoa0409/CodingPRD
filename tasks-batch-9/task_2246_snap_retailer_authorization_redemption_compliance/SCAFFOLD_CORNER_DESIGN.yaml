            - "TerminalDeployment.${dep_id}.status == ACTIVE and EbtTerminal.${term_id}.status == DEPLOYED - the active child is spared"
            - "EquipmentDepot.${depot_id}: units_in_stock == 4, units_reserved == 0, units_deployed == 1, units_pending_return == 0, units_retired == 0, sum == total_units_owned == 5"
            - "Store.${store_id}.active_terminal_count == 1 and sanction_status == UNDER_INVESTIGATION"
            - "Store.${store_id}.authorization_status == AUTHORIZED (an investigation does not suspend authorization)"

      - name: active_terminal_count_survives_the_recall_path_without_double_counting
        claim_type: derived_field_reconciliation
        grounds:
          - state_machines.TerminalDeployment.ACTIVE_to_RECALL_PENDING
          - state_machines.TerminalDeployment.RECALL_PENDING_to_RETURNED
          - calculations.depot_unit_ledger
        distinguishing_aspect: "Store.active_terminal_count and the depot counters are re-derived on every hop of the two-step teardown, and the decrement happens exactly once: recall takes the count from 2 to 1, the subsequent return of that already-recalled unit does NOT decrement again, and returning the still-ACTIVE unit takes it to 0 with every unit back in stock."
        test_recipe:
          setup:
            - "The authorized store with two ACTIVE deployments from the same depot."
          setup_api_calls:
            - *k_owner
            - *k_store
            - *k_app
            - *k_submit
            - *k_insp
            - *k_visit
            - *k_start
            - *k_findings
            - *k_decision
            - *k_depot
            - *k_term
            - *k_term2
            - *k_deploy
            - *k_activate
            - call: "POST /terminal-deployments"
              payload: { store_id: "${store_id}", terminal_id: "${term2_id}", deploy_start: "2026-08-01T00:00:00Z", deploy_end: "2026-09-30T00:00:00Z" }
              as: FnsAdmin
              as_user_id: "fns-admin-1"
              captures: { recall_dep2_id: $.data.id }
            - call: "POST /terminal-deployments/${recall_dep2_id}/activate"
              payload: {}
              as: FnsAdmin
              as_user_id: "fns-admin-1"
          trigger:
            - call: "POST /terminal-deployments/${recall_dep2_id}/recall"
              payload: {}
              as: FnsAdmin
              as_user_id: "fns-admin-1"
            - call: "POST /terminal-deployments/${recall_dep2_id}/return"
              payload: {}
              as: FnsAdmin
              as_user_id: "fns-admin-1"
            - call: "POST /terminal-deployments/${dep_id}/return"
              payload: {}
              as: FnsAdmin
              as_user_id: "fns-admin-1"
          assert:
            - "before the trigger Store.${store_id}.active_terminal_count == 2 and the depot has units_deployed == 2, units_in_stock == 3"
            - "after the recall: TerminalDeployment.${recall_dep2_id}.status == RECALL_PENDING, EbtTerminal.${term2_id}.status == PENDING_RETURN, active_terminal_count == 1, units_deployed == 1, units_pending_return == 1"
            - "after the return of the recalled unit: status == RETURNED with closed_at set, EbtTerminal.${term2_id}.status == IN_STOCK, active_terminal_count is STILL 1 (no second decrement), units_pending_return == 0, units_in_stock == 4"
            - "after the return of the ACTIVE unit: TerminalDeployment.${dep_id}.status == RETURNED, active_terminal_count == 0, units_deployed == 0, units_in_stock == 5"
            - "at every step units_in_stock + units_reserved + units_deployed + units_pending_return + units_retired == 5"
            - "both deployments are terminal and a further return on either is refused as ERR_INVALID_STATE"

