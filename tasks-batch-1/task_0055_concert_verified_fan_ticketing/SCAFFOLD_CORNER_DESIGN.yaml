scaffold_corner_design:
  # ─────────────────────────────────────────────────────────────────────────
  - section: entities
    instances:
      - name: create_event_returns_201_with_defaults
        claim_type: Creation
        grounds:
          - entities.Event
          - endpoints./events
        distinguishing_aspect: "POST /events with required fields returns 201; sales_status defaults DRAFT, tickets_sold_count 0, version 1, resale_cap_pct defaults 110 when omitted."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /events"
              payload: { title: "E", venue_capacity: 100, presale_code: "S", face_value_cents: 10000 }
              as: PromoterAdmin
              captures: { ev: $.data.id }
          assert:
            - "response.status == 201"
            - "Event.${ev}.sales_status == DRAFT"
            - "Event.${ev}.tickets_sold_count == 0"
            - "Event.${ev}.resale_cap_pct == 110"
            - "Event.${ev}.version == 1"

      - name: get_event_not_found
        claim_type: Not Found
        grounds:
          - entities.Event
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /events/{id} with a random non-existent UUID returns ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /events/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PromoterAdmin
          assert:
            - "response.data.error_id == ERR_NOT_FOUND"
            - "response.status == 404"

      - name: create_event_missing_required_field
        claim_type: Required Fields
        grounds:
          - entities.Event.fields.face_value_cents
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /events omitting face_value_cents returns ERR_INVALID_REQUEST 400."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /events"
              payload: { title: "E", venue_capacity: 100, presale_code: "S" }
              as: PromoterAdmin
          assert:
            - "response.data.error_id == ERR_INVALID_REQUEST"
            - "response.status == 400"

      - name: register_then_verify_resolves_status
        claim_type: Computed Fields
        grounds:
          - entities.Fan.fields.verification_status
          - entities.Fan.fields.risk_score
          - calculations.bot_risk_score
        distinguishing_aspect: "POST /fans on a unique device with a plain email yields risk_score 0 and verification_status UNVERIFIED (version 1); POST /fans/{id}/verify then moves it to VERIFIED (version 2)."
        test_recipe:
          setup: ["A freshly-registered Fan on a unique device, still UNVERIFIED with risk_score 0."]
          setup_api_calls:
            - call: "POST /fans"
              payload: { email: "clean@x.com", full_name: "Clean", device_fingerprint: "dev-clean" }
              as: Anonymous
              captures: { fc: $.data.id }
          trigger:
            - call: "POST /fans/${fc}/verify"
              payload: {}
              as: Fan
              as_user_id: "${fc}"
          assert:
            - "Fan.${fc}.risk_score == 0"
            - "Fan.${fc}.verification_status == VERIFIED"
            - "Fan.${fc}.version == 2"

      - name: list_events_pagination_envelope
        claim_type: Listing
        grounds:
          - entities.Event
          - endpoints./events
        distinguishing_aspect: "GET /events returns array envelope with total_count and has_more; limit/offset honored."
        test_recipe:
          setup: ["Two events created."]
          setup_api_calls:
            - call: "POST /events"
              payload: { title: "E1", venue_capacity: 100, presale_code: "S", face_value_cents: 10000 }
              as: PromoterAdmin
            - call: "POST /events"
              payload: { title: "E2", venue_capacity: 100, presale_code: "S", face_value_cents: 10000 }
              as: PromoterAdmin
          trigger:
            - call: "GET /events"
              payload: { limit: 1, offset: 0 }
              as: PromoterAdmin
          assert:
            - "response.response_type == array"
            - "response.meta.total_count == 2"
            - "response.meta.has_more == true"
            - "len(response.data) == 1"

  # ─────────────────────────────────────────────────────────────────────────
  - section: state_machines
    instances:
      - name: open_presale_requires_a_tier
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Event.DRAFT_to_PRESALE
        distinguishing_aspect: "Opening presale on a DRAFT event with zero PriceTiers fails ERR_INVALID_STATE; sales_status stays DRAFT."
        test_recipe:
          setup: ["Event in DRAFT with no tiers."]
          setup_api_calls:
            - call: "POST /events"
              payload: { title: "E", venue_capacity: 100, presale_code: "S", face_value_cents: 10000 }
              as: PromoterAdmin
              captures: { ev: $.data.id, ev_v: $.data.version }
          trigger:
            - call: "POST /events/${ev}/open-presale"
              payload: { expected_event_version: "${ev_v}" }
              as: PromoterAdmin
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "Event.${ev}.sales_status == DRAFT"

      - name: open_general_from_draft_invalid_transition
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Event.PRESALE_to_GENERAL
        distinguishing_aspect: "open-general from DRAFT (no PRESALE precursor) is not a defined transition → ERR_INVALID_STATE."
        test_recipe:
          setup: ["Event in DRAFT with a tier."]
          setup_api_calls:
            - call: "POST /events"
              payload: { title: "E", venue_capacity: 100, presale_code: "S", face_value_cents: 10000 }
              as: PromoterAdmin
              captures: { ev: $.data.id, ev_v: $.data.version }
            - call: "POST /price-tiers"
              payload: { event_id: "${ev}", name: "FLOOR", allocation: 50, base_multiplier_bps: 10000 }
              as: PromoterAdmin
          trigger:
            - call: "POST /events/${ev}/open-general"
              payload: { expected_event_version: "${ev_v}" }
              as: PromoterAdmin
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: cancel_already_cancelled_order_invalid_state
        claim_type: Idempotency
        grounds:
          - state_machines.Order.PENDING_to_CANCELLED
        distinguishing_aspect: "Cancelling an Order already CANCELLED a second time returns ERR_INVALID_STATE; no further side effects."
        test_recipe:
          setup: ["Fan has a PENDING Order already cancelled once."]
          setup_api_calls:
            - call: "POST /events"
              payload: { title: "E", venue_capacity: 100, presale_code: "S", face_value_cents: 10000 }
              as: PromoterAdmin
              captures: { ev: $.data.id, ev_v: $.data.version }
            - call: "POST /price-tiers"
              payload: { event_id: "${ev}", name: "FLOOR", allocation: 50, base_multiplier_bps: 10000 }
              as: PromoterAdmin
              captures: { tier: $.data.id }
            - call: "POST /events/${ev}/open-presale"
              payload: { expected_event_version: "${ev_v}" }
              as: PromoterAdmin
            - call: "POST /fans"
              payload: { email: "z@x.com", full_name: "Z", device_fingerprint: "dev-z" }
              as: Anonymous
              captures: { fz: $.data.id }
            - call: "POST /fans/${fz}/verify"
              payload: {}
              as: Fan
              as_user_id: "${fz}"
            - call: "POST /queue-entries"
              payload: { event_id: "${ev}", fan_id: "${fz}", tier_id: "${tier}", presale_code_used: "S", requested_qty: 1 }
              as: Fan
              as_user_id: "${fz}"
              captures: { qz: $.data.id }
            - call: "POST /events/${ev}/advance-queue"
              payload: { tier_id: "${tier}", max_offers: 5 }
              as: PromoterAdmin
            - call: "POST /orders"
              payload: { queue_entry_id: "${qz}", fan_id: "${fz}", tier_id: "${tier}", quantity: 1 }
              as: Fan
              as_user_id: "${fz}"
              captures: { oz: $.data.id }
            - call: "POST /orders/${oz}/cancel"
              payload: {}
              as: Fan
              as_user_id: "${fz}"
          trigger:
            - call: "POST /orders/${oz}/cancel"
              payload: {}
              as: Fan
              as_user_id: "${fz}"
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "Order.${oz}.status == CANCELLED"

      - name: scan_terminal_void_ticket_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Ticket.VALID_to_VOID
          - state_machines.Ticket.VALID_to_SCANNED
        distinguishing_aspect: "Scanning a VOID ticket (entry_status terminal after refund) returns ERR_INVALID_STATE; entry_status stays VOID."
        test_recipe:
          setup: ["A ticket whose Order was refunded so entry_status is VOID."]
          setup_api_calls:
            - call: "POST /events"
              payload: { title: "E", venue_capacity: 100, presale_code: "S", face_value_cents: 10000 }
              as: PromoterAdmin
              captures: { ev: $.data.id, ev_v: $.data.version }
            - call: "POST /price-tiers"
              payload: { event_id: "${ev}", name: "FLOOR", allocation: 50, base_multiplier_bps: 10000 }
              as: PromoterAdmin
              captures: { tier: $.data.id }
            - call: "POST /events/${ev}/open-presale"
              payload: { expected_event_version: "${ev_v}" }
              as: PromoterAdmin
              captures: { ev_v2: $.data.version }
            - call: "POST /events/${ev}/open-general"
              payload: { expected_event_version: "${ev_v2}" }
              as: PromoterAdmin
            - call: "POST /fans"
              payload: { email: "vd@x.com", full_name: "VD", device_fingerprint: "dev-vd" }
              as: Anonymous
              captures: { fvd: $.data.id }
            - call: "POST /fans/${fvd}/verify"
              payload: {}
              as: Fan
              as_user_id: "${fvd}"
            - call: "POST /queue-entries"
              payload: { event_id: "${ev}", fan_id: "${fvd}", tier_id: "${tier}", presale_code_used: "S", requested_qty: 1 }
              as: Fan
              as_user_id: "${fvd}"
              captures: { qvd: $.data.id }
            - call: "POST /events/${ev}/advance-queue"
              payload: { tier_id: "${tier}", max_offers: 5 }
              as: PromoterAdmin
            - call: "POST /orders"
              payload: { queue_entry_id: "${qvd}", fan_id: "${fvd}", tier_id: "${tier}", quantity: 1 }
              as: Fan
              as_user_id: "${fvd}"
              captures: { ovd: $.data.id, ovd_v: $.data.version }
            - call: "POST /orders/${ovd}/pay"
              payload: { expected_order_version: "${ovd_v}" }
              as: Fan
              as_user_id: "${fvd}"
              captures: { ovd_v2: $.data.version }
            - call: "GET /tickets"
              payload: { order_id: "${ovd}" }
              as: Fan
              as_user_id: "${fvd}"
              captures: { tk: "$.data[0].id" }
            - call: "POST /orders/${ovd}/refund"
              payload: { expected_order_version: "${ovd_v2}" }
              as: Fan
              as_user_id: "${fvd}"
          trigger:
            - call: "POST /tickets/${tk}/scan"
              payload: { device_channel: "MOBILE" }
              as: GateScanner
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "Ticket.${tk}.entry_status == VOID"

      - name: scan_valid_ticket_mobile_succeeds
        claim_type: Valid Transition
        grounds:
          - state_machines.Ticket.VALID_to_SCANNED
        distinguishing_aspect: "A VALID/HELD ticket scanned with device_channel MOBILE in a GENERAL event moves entry_status to SCANNED; holding_status unchanged HELD."
        test_recipe:
          setup: ["Fan holds a VALID/HELD ticket in a GENERAL event."]
          setup_api_calls:
            - call: "POST /events"
              payload: { title: "E", venue_capacity: 100, presale_code: "S", face_value_cents: 10000 }
              as: PromoterAdmin
              captures: { ev: $.data.id, ev_v: $.data.version }
            - call: "POST /price-tiers"
              payload: { event_id: "${ev}", name: "FLOOR", allocation: 50, base_multiplier_bps: 10000 }
              as: PromoterAdmin
              captures: { tier: $.data.id }
            - call: "POST /events/${ev}/open-presale"
              payload: { expected_event_version: "${ev_v}" }
              as: PromoterAdmin
              captures: { ev_v2: $.data.version }
            - call: "POST /events/${ev}/open-general"
              payload: { expected_event_version: "${ev_v2}" }
              as: PromoterAdmin
            - call: "POST /fans"
              payload: { email: "sc@x.com", full_name: "SC", device_fingerprint: "dev-sc" }
              as: Anonymous
              captures: { fsc: $.data.id }
            - call: "POST /fans/${fsc}/verify"
              payload: {}
              as: Fan
              as_user_id: "${fsc}"
            - call: "POST /queue-entries"
              payload: { event_id: "${ev}", fan_id: "${fsc}", tier_id: "${tier}", presale_code_used: "S", requested_qty: 1 }
              as: Fan
              as_user_id: "${fsc}"
              captures: { qsc: $.data.id }
            - call: "POST /events/${ev}/advance-queue"
              payload: { tier_id: "${tier}", max_offers: 5 }
              as: PromoterAdmin
            - call: "POST /orders"
              payload: { queue_entry_id: "${qsc}", fan_id: "${fsc}", tier_id: "${tier}", quantity: 1 }
              as: Fan
              as_user_id: "${fsc}"
              captures: { osc: $.data.id, osc_v: $.data.version }
            - call: "POST /orders/${osc}/pay"
              payload: { expected_order_version: "${osc_v}" }
              as: Fan
              as_user_id: "${fsc}"
            - call: "GET /tickets"
              payload: { order_id: "${osc}" }
              as: Fan
              as_user_id: "${fsc}"
              captures: { tk: "$.data[0].id" }
          trigger:
            - call: "POST /tickets/${tk}/scan"
              payload: { device_channel: "MOBILE" }
              as: GateScanner
          assert:
            - "Ticket.${tk}.entry_status == SCANNED"
            - "Ticket.${tk}.holding_status == HELD"

      - name: transfer_accept_changes_holder_bubble
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Transfer.PENDING_to_ACCEPTED
          - state_machines.Ticket.TRANSFER_PENDING_to_HELD
        distinguishing_aspect: "Accepting a transfer to a VERIFIED recipient sets Ticket.holder_fan_id to recipient and holding_status back to HELD."
        test_recipe:
          setup: ["Fan A holds a VALID/HELD ticket; transfer to VERIFIED recipient B is PENDING."]
          setup_api_calls:
            - call: "POST /events"
              payload: { title: "E", venue_capacity: 100, presale_code: "S", face_value_cents: 10000 }
              as: PromoterAdmin
              captures: { ev: $.data.id, ev_v: $.data.version }
            - call: "POST /price-tiers"
              payload: { event_id: "${ev}", name: "FLOOR", allocation: 50, base_multiplier_bps: 10000 }
              as: PromoterAdmin
              captures: { tier: $.data.id }
            - call: "POST /events/${ev}/open-presale"
              payload: { expected_event_version: "${ev_v}" }
              as: PromoterAdmin
              captures: { ev_v2: $.data.version }
            - call: "POST /events/${ev}/open-general"
              payload: { expected_event_version: "${ev_v2}" }
              as: PromoterAdmin
            - call: "POST /fans"
              payload: { email: "ta@x.com", full_name: "TA", device_fingerprint: "dev-ta" }
              as: Anonymous
              captures: { fta: $.data.id }
            - call: "POST /fans/${fta}/verify"
              payload: {}
              as: Fan
              as_user_id: "${fta}"
            - call: "POST /fans"
              payload: { email: "tb@x.com", full_name: "TB", device_fingerprint: "dev-tb" }
              as: Anonymous
              captures: { ftb: $.data.id }
            - call: "POST /fans/${ftb}/verify"
              payload: {}
              as: Fan
              as_user_id: "${ftb}"
            - call: "POST /queue-entries"
              payload: { event_id: "${ev}", fan_id: "${fta}", tier_id: "${tier}", presale_code_used: "S", requested_qty: 1 }
              as: Fan
              as_user_id: "${fta}"
              captures: { qta: $.data.id }
            - call: "POST /events/${ev}/advance-queue"
              payload: { tier_id: "${tier}", max_offers: 5 }
              as: PromoterAdmin
            - call: "POST /orders"
              payload: { queue_entry_id: "${qta}", fan_id: "${fta}", tier_id: "${tier}", quantity: 1 }
              as: Fan
              as_user_id: "${fta}"
              captures: { ota: $.data.id, ota_v: $.data.version }
            - call: "POST /orders/${ota}/pay"
              payload: { expected_order_version: "${ota_v}" }
              as: Fan
              as_user_id: "${fta}"
            - call: "GET /tickets"
              payload: { order_id: "${ota}" }
              as: Fan
              as_user_id: "${fta}"
              captures: { tk: "$.data[0].id" }
            - call: "POST /transfers"
              payload: { ticket_id: "${tk}", sender_fan_id: "${fta}", recipient_fan_id: "${ftb}" }
              as: Fan
              as_user_id: "${fta}"
              captures: { tr: $.data.id }
          trigger:
            - call: "POST /transfers/${tr}/accept"
              payload: {}
              as: Fan
              as_user_id: "${ftb}"
          assert:
            - "Transfer.${tr}.status == ACCEPTED"
            - "Ticket.${tk}.holder_fan_id == ${ftb}"
            - "Ticket.${tk}.holding_status == HELD"

      - name: resale_buy_transfers_holder
        claim_type: Side Effect Execution
        grounds:
          - state_machines.ResaleListing.OPEN_to_SOLD
          - state_machines.Ticket.LISTED_to_HELD
        distinguishing_aspect: "Buying an OPEN listing sets listing SOLD with buyer_fan_id, and the ticket holder becomes the buyer with holding_status HELD."
        test_recipe:
          setup: ["Seller S lists a VALID/HELD ticket at 11000 (cap 21000); VERIFIED buyer B buys it."]
          setup_api_calls:
            - call: "POST /events"
              payload: { title: "E", venue_capacity: 100, presale_code: "S", face_value_cents: 10000 }
              as: PromoterAdmin
              captures: { ev: $.data.id, ev_v: $.data.version }
            - call: "POST /price-tiers"
              payload: { event_id: "${ev}", name: "FLOOR", allocation: 50, base_multiplier_bps: 10000 }
              as: PromoterAdmin
              captures: { tier: $.data.id }
            - call: "POST /events/${ev}/open-presale"
              payload: { expected_event_version: "${ev_v}" }
              as: PromoterAdmin
              captures: { ev_v2: $.data.version }
            - call: "POST /events/${ev}/open-general"
              payload: { expected_event_version: "${ev_v2}" }
              as: PromoterAdmin
            - call: "POST /fans"
              payload: { email: "sel@x.com", full_name: "SEL", device_fingerprint: "dev-sel" }
              as: Anonymous
              captures: { fsel: $.data.id }
            - call: "POST /fans/${fsel}/verify"
              payload: {}
              as: Fan
              as_user_id: "${fsel}"
            - call: "POST /fans"
              payload: { email: "buy@x.com", full_name: "BUY", device_fingerprint: "dev-buy" }
              as: Anonymous
              captures: { fbuy: $.data.id }
            - call: "POST /fans/${fbuy}/verify"
              payload: {}
              as: Fan
              as_user_id: "${fbuy}"
            - call: "POST /queue-entries"
              payload: { event_id: "${ev}", fan_id: "${fsel}", tier_id: "${tier}", presale_code_used: "S", requested_qty: 1 }
              as: Fan
              as_user_id: "${fsel}"
              captures: { qsel: $.data.id }
            - call: "POST /events/${ev}/advance-queue"
              payload: { tier_id: "${tier}", max_offers: 5 }
              as: PromoterAdmin
            - call: "POST /orders"
              payload: { queue_entry_id: "${qsel}", fan_id: "${fsel}", tier_id: "${tier}", quantity: 1 }
              as: Fan
              as_user_id: "${fsel}"
              captures: { osel: $.data.id, osel_v: $.data.version }
            - call: "POST /orders/${osel}/pay"
              payload: { expected_order_version: "${osel_v}" }
              as: Fan
              as_user_id: "${fsel}"
            - call: "GET /tickets"
              payload: { order_id: "${osel}" }
              as: Fan
              as_user_id: "${fsel}"
              captures: { tk: "$.data[0].id" }
            - call: "POST /resale-listings"
              payload: { ticket_id: "${tk}", seller_fan_id: "${fsel}", list_price_cents: 11000 }
              as: Fan
              as_user_id: "${fsel}"
              captures: { rl: $.data.id, rl_v: $.data.version }
          trigger:
            - call: "POST /resale-listings/${rl}/buy"
              payload: { buyer_fan_id: "${fbuy}", expected_resalelisting_version: "${rl_v}" }
              as: Fan
              as_user_id: "${fbuy}"
          assert:
            - "ResaleListing.${rl}.status == SOLD"
            - "ResaleListing.${rl}.buyer_fan_id == ${fbuy}"
            - "Ticket.${tk}.holder_fan_id == ${fbuy}"

  # ─────────────────────────────────────────────────────────────────────────
  - section: calculations
    instances:
      - name: dynamic_price_band0_below_50pct
        claim_type: Correct Result
        grounds:
          - calculations.dynamic_unit_price
        distinguishing_aspect: "GENERAL event, sold_ratio 0.06 (<0.50) → demand 0; unit_price equals tier price 10000."
        test_recipe:
          setup: ["GENERAL event face=10000 cap=100 with 6 sold (sold_ratio 0.06, band0); Fan buys 1 seat tier multiplier 10000."]
          setup_api_calls:
            - call: "POST /events"
              payload: { title: "E", venue_capacity: 100, presale_code: "S", face_value_cents: 10000 }
              as: PromoterAdmin
              captures: { ev: $.data.id, ev_v: $.data.version }
            - call: "POST /price-tiers"
              payload: { event_id: "${ev}", name: "FLOOR", allocation: 100, base_multiplier_bps: 10000 }
              as: PromoterAdmin
              captures: { tier: $.data.id }
            - call: "POST /events/${ev}/open-presale"
              payload: { expected_event_version: "${ev_v}" }
              as: PromoterAdmin
              captures: { ev_v2: $.data.version }
            - call: "POST /events/${ev}/open-general"
              payload: { expected_event_version: "${ev_v2}" }
              as: PromoterAdmin
            - call: "POST /fans"
              payload: { email: "sd@x.com", full_name: "SD", device_fingerprint: "dev-sd" }
              as: Anonymous
              captures: { fsd: $.data.id }
            - call: "POST /fans/${fsd}/verify"
              payload: {}
              as: Fan
              as_user_id: "${fsd}"
            - call: "POST /queue-entries"
              payload: { event_id: "${ev}", fan_id: "${fsd}", tier_id: "${tier}", presale_code_used: "S", requested_qty: 6 }
              as: Fan
              as_user_id: "${fsd}"
              captures: { qsd: $.data.id }
            - call: "POST /events/${ev}/advance-queue"
              payload: { tier_id: "${tier}", max_offers: 200 }
              as: PromoterAdmin
            - call: "POST /orders"
              payload: { queue_entry_id: "${qsd}", fan_id: "${fsd}", tier_id: "${tier}", quantity: 6 }
              as: Fan
              as_user_id: "${fsd}"
              captures: { osd: $.data.id, osd_v: $.data.version }
            - call: "POST /orders/${osd}/pay"
              payload: { expected_order_version: "${osd_v}" }
              as: Fan
              as_user_id: "${fsd}"
            - call: "POST /fans"
              payload: { email: "bd@x.com", full_name: "BD", device_fingerprint: "dev-bd" }
              as: Anonymous
              captures: { fbd: $.data.id }
            - call: "POST /fans/${fbd}/verify"
              payload: {}
              as: Fan
              as_user_id: "${fbd}"
            - call: "POST /queue-entries"
              payload: { event_id: "${ev}", fan_id: "${fbd}", tier_id: "${tier}", presale_code_used: "S", requested_qty: 1 }
              as: Fan
              as_user_id: "${fbd}"
              captures: { qbd: $.data.id }
            - call: "POST /events/${ev}/advance-queue"
              payload: { tier_id: "${tier}", max_offers: 200 }
              as: PromoterAdmin
