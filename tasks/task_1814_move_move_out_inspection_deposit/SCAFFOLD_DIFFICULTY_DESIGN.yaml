              as: PropertyManager
              captures: { mo_a: $.data.id }
            - call: "POST /pm/inspections/${mo_a}/items"
              payload: { area_name: "bedroom_paint", category: "PAINT", condition: "DAMAGED", photo_count: 4, determination: "TENANT_DAMAGE", linked_move_in_item_id: "${mi_item_a}", replacement_cost_cents: 90000 }
              as: Inspector
            - { call: "POST /pm/inspections/${mo_a}/complete", payload: {}, as: Inspector }
            - call: "POST /pm/inspections"
              payload: { tenancy_id: "${ten_b}", kind: "MOVE_OUT", inspector_user_id: "insp-1", scheduled_start_at: "2026-08-01T10:00:00Z", scheduled_end_at: "2026-08-01T11:00:00Z" }
              as: PropertyManager
              captures: { mo_b: $.data.id }
