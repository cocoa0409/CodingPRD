  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: shipment_movement_and_weight_dimensions_advance_independently
        grounds:
          - state_machines.Shipment.AWARDED_to_SURVEYED
          - state_machines.Shipment.ESTIMATED_to_ACTUAL_RECORDED
          - state_machines.Shipment.SURVEYED_to_PACKED
          - state_machines.Shipment.ACTUAL_RECORDED_to_DISPUTED
          - state_machines.Shipment.PACKED_to_PICKED_UP
          - entities.Shipment.fields.movement_status
          - entities.Shipment.fields.weight_recon_status
        distinguishing_aspect: >-
          The Shipment machine is PARALLEL: movement_status and weight_recon_status are two
          independent dimensions on one row, so recording an actual weight advances the weight
          dimension while movement_status stays SURVEYED, and a member's weight dispute leaves
          movement free to continue to PICKED_UP — the combined state (PICKED_UP, DISPUTED) is
          legal and reachable, which no single linear status column can express.
        test_recipe:
          setup:
            - "Clock at 2026-08-03T00:00:00Z; entitlement AUTHORIZED with cap 11000 lb; capacity block published."
            - "One shipment created, surveyed, awarded capacity."
