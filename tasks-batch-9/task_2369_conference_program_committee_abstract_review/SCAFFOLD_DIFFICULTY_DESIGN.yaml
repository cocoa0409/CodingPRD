  # RULE 4 — transitive_cascade  (3 instances; depths 4, 3 and 3; three
  #          DIFFERENT trigger endpoints; each link caused by the previous one)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: disclosure_rejection_cascades_four_links_and_unpublishes_session
        grounds:
          - state_machines.DisclosureStatement.VALIDATED_to_REJECTED
          - state_machines.CmeAccreditation.VALIDATED_to_REVOKED
          - state_machines.Session.PUBLISHED_to_PLANNED
          - entities.Conference.fields.cme_minutes_allocated
          - entities.Session.fields.accreditation_posture
          - calculations.cme_credit_award
        distinguishing_aspect: |
          Depth-4 cascade triggered by POST /disclosure-statements/{id}/adjudication:
          link 1 flips the disclosure to REJECTED, which alone causes link 2
          (accreditation VALIDATED -> REVOKED, awarded_credits 0.00), which alone
          causes link 3 (conference cme_minutes_allocated 45 -> 0 and the session's
          accredited_credit_total 0.75 -> 0.00 flipping posture to NON_COMPLIANT),
          which alone causes link 4 (Session PUBLISHED -> PLANNED).
