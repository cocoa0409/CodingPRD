scenario: "858. Lead & Healthy-Homes Program: blood-lead screening & case intake, environmental investigation & inspection, hazard-control order & clearance, relocation & interim controls, contractor (RRP) certification, grant-funded remediation, follow-up testing, reporting"
domain_name: "lead-healthy-homes"
api_prefix: "/api/v1"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency        # grant-fund reservation contention resolved by OCC on GrantFund.version
    - cascading_side_effects        # case-withdraw and clearance-pass propagate across 3+ entities
    - dual_variant_calculation      # provisional vs confirmed reference BLL; estimated subsidy vs final actual cost
    - rate_threshold_triggers       # blood-lead thresholds gate case opening & priority classification
    - compensating_invariant        # grant money conservation + hazard-count conservation

  entity_topology: flat
  # Peer entities linked by explicit foreign keys carried in request bodies; no
  # nesting in resource paths (all resources mount at /api/v1/<collection>).

  state_machine_shape: parallel
  # Case carries two independent axes (case_status × medical_status); the
  # HazardControlOrder machine is cyclic (CLEARANCE_PENDING <-> IN_REMEDIATION);
  # the Contractor machine is cyclic (ACTIVE <-> SUSPENDED).

  relationship_patterns:
    - one_to_many          # Child -> BloodLeadTest, Case -> HazardControlOrder, etc.
    - flat_foreign_key     # every child carries FK fields, discovered via filtered-list / sub-resource GETs
    - cross_aggregate      # RemediationProject references HazardControlOrder, Contractor, GrantFund across aggregates

  role_model: segregation_of_duties
  # Independent clearance: the Inspector who conducted the source investigation
  # MUST NOT be the Inspector who signs off the clearance test on the resulting
  # order (four-eyes, tracked by X-User-ID). Peer ownership also applies
  # (Contractor performs remediation; Inspector performs investigation/clearance).

  consistency_model: immediate
  # Every cascade (case-withdraw, clearance-pass, project-cancel) resolves
  # synchronously within the triggering request; derived counters/ledgers are
  # reconciled before the response is returned.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ===========================================================================
# §1.1 Entity-Relationship Table
# ===========================================================================
entities:
  - name: Child
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Legal name of the screened child.
      - name: date_of_birth
        type: string
        source: input
        description: ISO 8601 date (YYYY-MM-DD) of birth.
      - name: guardian_name
        type: string
        source: input
        description: Name of the responsible guardian.
      - name: primary_dwelling_id
        type: string
        source: input
        description: "FK -> Dwelling.id; the child's current residence."
      - name: medicaid_enrolled
        type: boolean
        source: input
        description: Whether the child is Medicaid-enrolled (drives eligibility reporting).
        default: false
      - name: income_tier
        type: enum
        source: input
        description: Household income band used to size the grant subsidy.
        constraints: "one of {EXTREMELY_LOW, VERY_LOW, LOW, MODERATE}"

  - name: BloodLeadTest
    parent: null
    common_fields: false
    fields:
      - name: child_id
        type: string
        source: input
        description: "FK -> Child.id; subject of this blood-lead measurement."
      - name: bll_ug_dl
        type: number
        source: input
        description: Measured blood-lead level in micrograms per deciliter (>= 0).
      - name: specimen_type
        type: enum
        source: input
        description: Collection method; venous is confirmatory, capillary is a screen.
        constraints: "one of {VENOUS, CAPILLARY}"
      - name: test_kind
        type: enum
        source: input
        description: Programmatic purpose of the test.
        constraints: "one of {SCREENING, DIAGNOSTIC, FOLLOWUP}"
      - name: collected_at
        type: datetime
        source: input
        description: ISO 8601 UTC instant the specimen was collected.
      - name: result_class
        type: enum
        source: computed
        description: Classification of bll_ug_dl against the reference thresholds; input value (if any) ignored.
        constraints: "one of {CLASS_I, CLASS_II, CLASS_III, BELOW_THRESHOLD}"

  - name: Dwelling
    parent: null
    common_fields: true
    fields:
      - name: street_address
        type: string
        source: input
        description: Street address of the residential unit.
      - name: unit_designation
        type: string
        source: input
        description: Apartment/unit label; null for single-family.
        default: null
      - name: year_built
        type: integer
        source: input
        description: Year of construction (used to derive lead-paint presumption).
      - name: owner_name
        type: string
        source: input
        description: Name of the property owner of record.
      - name: jurisdiction
        type: string
        source: input
        description: Health jurisdiction / county code responsible for the dwelling.
      - name: pre_1978
        type: boolean
        source: computed
        description: True when year_built < 1978 (lead-paint presumption); input ignored.

  - name: Case
    parent: null
    common_fields: true
    fields:
      - name: child_id
        type: string
        source: input
        description: "FK -> Child.id; the poisoned child this case tracks."
      - name: dwelling_id
        type: string
        source: input
        description: "FK -> Dwelling.id; the residence under investigation."
      - name: qualifying_test_id
        type: string
        source: input
        description: "FK -> BloodLeadTest.id; the screening/diagnostic test whose BLL opened this case."
      - name: case_status
        type: enum
        source: system
        description: Environmental-track lifecycle axis.
        constraints: "one of {OPEN, INVESTIGATION, ENFORCEMENT, CLOSED, WITHDRAWN}; initial OPEN"
      - name: medical_status
        type: enum
        source: system
        description: Health-track lifecycle axis, evolving independently of case_status.
        constraints: "one of {ELEVATED, MONITORING, RESOLVED}; initial ELEVATED"
      - name: reference_bll_ug_dl
        type: number
        source: computed
        description: Governing blood-lead level; PROVISIONAL from qualifying test, CONFIRMED from max venous diagnostic.
      - name: reference_basis
        type: enum
        source: system
        description: Which variant produced reference_bll_ug_dl.
        constraints: "one of {PROVISIONAL, CONFIRMED}; initial PROVISIONAL"
      - name: priority_class
        type: enum
        source: computed
        description: Response-priority band derived from reference_bll_ug_dl.
        constraints: "one of {CLASS_I, CLASS_II, CLASS_III}"
      - name: income_tier
        type: enum
        source: system
        description: Snapshot of the child's income_tier taken at case creation; drives subsidy sizing.
        constraints: "one of {EXTREMELY_LOW, VERY_LOW, LOW, MODERATE}"
      - name: open_hazard_count
        type: integer
        source: computed
        description: Count of HazardFindings for this case whose control_status == OPEN.
        default: 0
      - name: controlled_hazard_count
        type: integer
        source: computed
        description: Count of HazardFindings for this case whose control_status == CONTROLLED.
        default: 0
      - name: total_hazard_count
        type: integer
        source: computed
        description: open_hazard_count + controlled_hazard_count (conserved quantity).
        default: 0

  - name: Inspector
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Name of the environmental/risk-assessor inspector.
      - name: certification_id_number
        type: string
        source: input
        description: State lead risk-assessor certification number.
      - name: active
        type: boolean
        source: input
        description: Whether the inspector may be assigned work.
        default: true

  - name: EnvironmentalInvestigation
    parent: null
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> Case.id; the case this investigation serves."
      - name: dwelling_id
        type: string
        source: input
        description: "FK -> Dwelling.id; the dwelling being inspected."
      - name: inspector_id
        type: string
        source: input
        description: "FK -> Inspector.id; the inspector assigned to conduct the visit."
      - name: scheduled_start
        type: datetime
        source: input
        description: ISO 8601 UTC start of the on-site inspection window (inclusive).
      - name: scheduled_end
        type: datetime
        source: input
        description: ISO 8601 UTC end of the on-site inspection window (exclusive).
      - name: status
        type: enum
        source: system
        description: Investigation lifecycle.
        constraints: "one of {SCHEDULED, IN_PROGRESS, COMPLETED, CANCELLED}; initial SCHEDULED"
      - name: hazard_finding_count
        type: integer
        source: computed
        description: Number of HazardFindings recorded against this investigation.
        default: 0
      - name: completed_at
        type: datetime
        source: system
        description: Logical-clock instant the investigation was completed; null until COMPLETED.
        default: null

  - name: HazardFinding
    parent: null
    common_fields: true
    fields:
      - name: investigation_id
        type: string
        source: input
        description: "FK -> EnvironmentalInvestigation.id; the visit that recorded this hazard."
      - name: hazard_type
        type: enum
        source: input
        description: Medium of the lead hazard.
        constraints: "one of {PAINT, DUST, SOIL, WATER}"
      - name: location
        type: string
        source: input
        description: Free-text component/location (e.g., 'north bedroom window sill').
      - name: measurement_value
        type: number
        source: input
        description: Measured hazard level in the medium's native unit (>= 0).
      - name: severity
        type: enum
        source: input
        description: Assessor-assigned severity.
        constraints: "one of {LOW, MODERATE, HIGH}"
      - name: control_status
        type: enum
        source: system
        description: Whether the hazard has been remediated and cleared.
        constraints: "one of {OPEN, CONTROLLED}; initial OPEN"

  - name: HazardControlOrder
    parent: null
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> Case.id; the case this order enforces."
      - name: dwelling_id
        type: string
        source: input
        description: "FK -> Dwelling.id; the dwelling the order applies to."
      - name: investigation_id
        type: string
        source: input
        description: "FK -> EnvironmentalInvestigation.id; the completed investigation that justified the order."
      - name: status
        type: enum
        source: system
        description: Enforcement/clearance lifecycle (cyclic between IN_REMEDIATION and CLEARANCE_PENDING).
        constraints: "one of {ISSUED, IN_REMEDIATION, CLEARANCE_PENDING, CLEARED, VOID}; initial ISSUED"
      - name: issued_at
        type: datetime
        source: system
        description: Logical-clock instant the order was issued (cascade from investigation completion).
      - name: compliance_deadline
        type: datetime
        source: computed
        description: "issued_at + ORDER_COMPLIANCE_DEADLINE_DAYS (= 30 days)."
      - name: hazard_count
        type: integer
        source: computed
        description: Number of HazardFindings on the source investigation at issuance; drives subsidy sizing.

  - name: ClearanceTest
    parent: null
    common_fields: false
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> HazardControlOrder.id; the order being cleared."
      - name: cleared_by_inspector_id
        type: string
        source: system
        description: Inspector.id copied from X-User-ID of the signing inspector; used for four-eyes segregation (not a navigational FK).
      - name: floor_result_ug_ft2
        type: number
        source: input
        description: Post-remediation floor dust-wipe result in micrograms per square foot (>= 0).
      - name: sill_result_ug_ft2
        type: number
        source: input
        description: Post-remediation window-sill dust-wipe result (>= 0).
      - name: trough_result_ug_ft2
        type: number
        source: input
        description: Post-remediation window-trough dust-wipe result (>= 0).
      - name: evaluated_result
        type: enum
        source: computed
        description: PASS iff every measurement is within its federal limit; else FAIL. Any input result is ignored.
        constraints: "one of {PASS, FAIL}"

  - name: RelocationUnit
    parent: null
    common_fields: true
    fields:
      - name: address
        type: string
        source: input
        description: Address of the temporary relocation unit.
      - name: bedroom_count
        type: integer
        source: input
        description: Number of bedrooms in the unit.
      - name: status
        type: enum
        source: input
        description: Availability of the unit for placement.
        constraints: "one of {AVAILABLE, OFFLINE}; default AVAILABLE"
        default: AVAILABLE

  - name: RelocationPlacement
    parent: null
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> Case.id; the case whose family is relocated."
      - name: relocation_unit_id
        type: string
        source: input
        description: "FK -> RelocationUnit.id; the unit hosting the family."
      - name: start_date
        type: string
        source: input
        description: ISO 8601 date the stay begins (inclusive, closed interval).
      - name: end_date
        type: string
        source: input
        description: ISO 8601 date the stay is planned to end (inclusive, closed interval).
      - name: occupant_count
        type: integer
        source: input
        description: Number of occupants relocated (drives per-diem reimbursement, >= 1).
      - name: status
        type: enum
        source: system
        description: Placement lifecycle.
        constraints: "one of {ACTIVE, ENDED, CANCELLED}; initial ACTIVE"
      - name: actual_end_date
        type: string
        source: system
        description: Date the stay actually ended; null until ENDED.
        default: null
      - name: reimbursement_cents
        type: integer
        source: computed
        description: Lodging+meal reimbursement computed on end from actual nights; 0 until ENDED.
        default: 0

  - name: Contractor
    parent: null
    common_fields: true
    fields:
      - name: business_name
        type: string
        source: input
        description: Legal business name of the RRP remediation contractor.
      - name: rrp_certification_number
        type: string
        source: input
        description: EPA Renovation, Repair and Painting (RRP) firm certification number.
      - name: certification_status
        type: enum
        source: system
        description: Current RRP certification standing (cyclic between ACTIVE and SUSPENDED).
        constraints: "one of {PENDING, ACTIVE, SUSPENDED, EXPIRED, REVOKED}; initial PENDING"
      - name: certification_expires_at
        type: datetime
        source: system
        description: Logical-clock instant the RRP certification lapses; null until first activation.
        default: null

  - name: GrantFund
    parent: null
    common_fields: true
    fields:
      - name: fund_name
        type: string
        source: input
        description: Name of the remediation grant fund.
      - name: fiscal_year
        type: integer
        source: input
        description: Fiscal year the fund covers.
      - name: total_budget_cents
        type: integer
        source: input
        description: Total appropriated budget in cents (>= 0).
      - name: reserved_cents
        type: integer
        source: computed
        description: Sum of estimated subsidies reserved by APPROVED/IN_PROGRESS projects; released on completion/cancel.
        default: 0
      - name: spent_cents
        type: integer
        source: computed
        description: Sum of finalized grant outlays from COMPLETED projects.
        default: 0
      - name: available_cents
        type: integer
        source: computed
        description: total_budget_cents - reserved_cents - spent_cents (never negative).

  - name: RemediationProject
    parent: null
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> HazardControlOrder.id; the order this project remediates."
      - name: contractor_id
        type: string
        source: input
        description: "FK -> Contractor.id; the RRP firm performing the work."
      - name: grant_fund_id
        type: string
        source: input
        description: "FK -> GrantFund.id; the fund subsidizing the work."
      - name: status
        type: enum
        source: system
        description: Project lifecycle.
        constraints: "one of {PROPOSED, APPROVED, IN_PROGRESS, COMPLETED, CANCELLED}; initial PROPOSED"
      - name: estimated_cost_cents
        type: integer
        source: computed
        description: Income-tiered subsidy reserved against the grant at APPROVE (grant_subsidy calc); 0 until approved.
        default: 0
      - name: final_cost_cents
        type: integer
        source: computed
        description: Sum of submitted actual line_items at COMPLETE; null until completed.
        default: null
      - name: line_items
        type: array
        source: input
        description: Actual cost line items supplied at completion; array of {description, amount_cents}.
        default: []

# ===========================================================================
# §1.2 State Machine Table
# ===========================================================================
state_machines:
  # -- Case: PARALLEL dimensions (case_status × medical_status) --------------
  - entity: Case
    initial_state: OPEN            # case_status axis
    terminal_states: [CLOSED, WITHDRAWN]
    note: |
      Case carries two independent axes on the same row. case_status
      (OPEN/INVESTIGATION/ENFORCEMENT/CLOSED/WITHDRAWN) advances along the
      environmental track; medical_status (ELEVATED/MONITORING/RESOLVED)
      advances along the health track driven by follow-up blood tests.
      Transitions below are tagged [axis:case_status] or [axis:medical_status].
    transitions:
      - from: OPEN
        to: INVESTIGATION
        trigger: "POST /api/v1/investigations (first investigation scheduled for the case)"
        actor: CaseManager
        preconditions:
          - "case_status == OPEN"
        side_effects:
          - "[axis:case_status] case_status set to INVESTIGATION"
        note: "axis:case_status"
      - from: INVESTIGATION
        to: ENFORCEMENT
        trigger: "system: EnvironmentalInvestigation COMPLETED with >= 1 HazardFinding auto-issues a HazardControlOrder"
        actor: system
        preconditions:
          - "case_status == INVESTIGATION"
          - "the completing investigation has hazard_finding_count >= 1"
        side_effects:
          - "[axis:case_status] case_status set to ENFORCEMENT"
          - "a HazardControlOrder is created in ISSUED (see HazardControlOrder machine)"
        note: "axis:case_status; cascade link 1 of the clearance-track chain"
      - from: INVESTIGATION
        to: CLOSED
        trigger: "system: EnvironmentalInvestigation COMPLETED with 0 HazardFindings AND medical_status == RESOLVED"
        actor: system
        preconditions:
          - "case_status == INVESTIGATION"
          - "the completing investigation has hazard_finding_count == 0"
          - "medical_status == RESOLVED"
        side_effects:
          - "[axis:case_status] case_status set to CLOSED"
        note: "axis:case_status; empty-hazard-set boundary path"
      - from: ENFORCEMENT
        to: CLOSED
        trigger: "POST /api/v1/cases/{id}/close"
        actor: CaseManager
        preconditions:
          - "case_status == ENFORCEMENT"
          - "every HazardControlOrder for the case is in {CLEARED, VOID} and at least one is CLEARED"
          - "medical_status == RESOLVED"
          - "open_hazard_count == 0"
        side_effects:
          - "[axis:case_status] case_status set to CLOSED"
        note: "axis:case_status; cross-axis dependency (needs medical_status RESOLVED)"
      - from: OPEN
        to: WITHDRAWN
        trigger: "POST /api/v1/cases/{id}/withdraw"
        actor: CaseManager
        preconditions:
          - "case_status in {OPEN, INVESTIGATION, ENFORCEMENT}"
        side_effects:
          - "[axis:case_status] case_status set to WITHDRAWN"
          - "each EnvironmentalInvestigation of the case in {SCHEDULED, IN_PROGRESS} transitions to CANCELLED (fan-out)"
          - "each HazardControlOrder of the case in {ISSUED, IN_REMEDIATION, CLEARANCE_PENDING} transitions to VOID (cascade link 1)"
        note: "axis:case_status; head of the depth-3 withdraw cascade"
      - from: INVESTIGATION
        to: WITHDRAWN
        trigger: "POST /api/v1/cases/{id}/withdraw"
        actor: CaseManager
        preconditions:
          - "case_status in {OPEN, INVESTIGATION, ENFORCEMENT}"
        side_effects:
          - "same as OPEN -> WITHDRAWN"
        note: "axis:case_status"
      - from: ENFORCEMENT
        to: WITHDRAWN
        trigger: "POST /api/v1/cases/{id}/withdraw"
        actor: CaseManager
        preconditions:
          - "case_status in {OPEN, INVESTIGATION, ENFORCEMENT}"
        side_effects:
          - "same as OPEN -> WITHDRAWN"
        note: "axis:case_status"
      - from: ELEVATED
        to: MONITORING
        trigger: "POST /api/v1/blood-lead-tests (FOLLOWUP, VENOUS, bll_ug_dl < BLL_CASE_THRESHOLD_UG_DL) for a child with an active case whose medical_status == ELEVATED"
        actor: IntakeCoordinator
        preconditions:
          - "medical_status == ELEVATED"
          - "case_status not in {CLOSED, WITHDRAWN}"
        side_effects:
          - "[axis:medical_status] medical_status set to MONITORING"
        note: "axis:medical_status; first sub-threshold follow-up"
      - from: MONITORING
        to: RESOLVED
        trigger: "POST /api/v1/blood-lead-tests (FOLLOWUP, VENOUS, bll_ug_dl < BLL_CASE_THRESHOLD_UG_DL) for a child whose case medical_status == MONITORING"
        actor: IntakeCoordinator
        preconditions:
          - "medical_status == MONITORING"
          - "case_status not in {CLOSED, WITHDRAWN}"
        side_effects:
          - "[axis:medical_status] medical_status set to RESOLVED"
        note: "axis:medical_status; second consecutive sub-threshold follow-up"
      - from: MONITORING
        to: ELEVATED
        trigger: "POST /api/v1/blood-lead-tests (FOLLOWUP, VENOUS, bll_ug_dl >= BLL_CASE_THRESHOLD_UG_DL) for a child whose case medical_status == MONITORING"
        actor: IntakeCoordinator
        preconditions:
          - "medical_status == MONITORING"
          - "case_status not in {CLOSED, WITHDRAWN}"
        side_effects:
          - "[axis:medical_status] medical_status set to ELEVATED (regression resets the monitoring streak)"
        note: "axis:medical_status; regression on a rebounding follow-up"

  # -- EnvironmentalInvestigation --------------------------------------------
  - entity: EnvironmentalInvestigation
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /api/v1/investigations/{id}/findings (first hazard recorded starts the visit)"
        actor: Inspector
        preconditions:
          - "status == SCHEDULED"
          - "the acting Inspector's X-User-ID equals inspector_id"
        side_effects:
          - "status set to IN_PROGRESS"
          - "hazard_finding_count incremented; a HazardFinding is created in OPEN"
        note: "auto-transition on first finding"
      - from: IN_PROGRESS
        to: IN_PROGRESS
        trigger: "POST /api/v1/investigations/{id}/findings (subsequent hazards)"
        actor: Inspector
        preconditions:
          - "status == IN_PROGRESS"
          - "the acting Inspector's X-User-ID equals inspector_id"
        side_effects:
          - "hazard_finding_count incremented; a HazardFinding is created in OPEN"
        note: "self-transition while recording findings"
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /api/v1/investigations/{id}/complete"
        actor: Inspector
        preconditions:
          - "status in {SCHEDULED, IN_PROGRESS}"
          - "the acting Inspector's X-User-ID equals inspector_id"
        side_effects:
          - "status set to COMPLETED; completed_at set to the logical clock"
          - "if hazard_finding_count == 0: Case case_status INVESTIGATION -> CLOSED when medical_status == RESOLVED, else remains INVESTIGATION with no order"
          - "if hazard_finding_count >= 1: a HazardControlOrder is created in ISSUED with hazard_count = hazard_finding_count; Case case_status -> ENFORCEMENT (cascade)"
        note: "empty-set boundary decides whether an order is issued"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /api/v1/investigations/{id}/complete"
        actor: Inspector
        preconditions:
          - "status in {SCHEDULED, IN_PROGRESS}"
          - "the acting Inspector's X-User-ID equals inspector_id"
        side_effects:
          - "same as SCHEDULED -> COMPLETED"
        note: "same completion semantics"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /api/v1/cases/{id}/withdraw (fan-out) or system cancellation"
        actor: system
        preconditions:
          - "status in {SCHEDULED, IN_PROGRESS}"
        side_effects:
          - "status set to CANCELLED"
        note: "cancelled when its case is withdrawn"
      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "POST /api/v1/cases/{id}/withdraw (fan-out) or system cancellation"
        actor: system
        preconditions:
          - "status in {SCHEDULED, IN_PROGRESS}"
        side_effects:
          - "status set to CANCELLED"

  # -- HazardControlOrder: CYCLIC (CLEARANCE_PENDING <-> IN_REMEDIATION) ------
  - entity: HazardControlOrder
    initial_state: ISSUED
    terminal_states: [VOID]
    note: |
      CLEARED is the stable success state; it is left only by an administrative
      VOID (e.g., clearance later invalidated), which is the compensating action
      that reverts CONTROLLED hazards back to OPEN. VOID is the sole hard-terminal.
    transitions:
      - from: ISSUED
        to: IN_REMEDIATION
        trigger: "system: POST /api/v1/remediation-projects/{id}/start moves the linked order into remediation"
        actor: system
        preconditions:
          - "status == ISSUED"
        side_effects:
          - "status set to IN_REMEDIATION"
        note: "cross-entity: driven by RemediationProject.start"
      - from: IN_REMEDIATION
        to: CLEARANCE_PENDING
        trigger: "POST /api/v1/hazard-control-orders/{id}/request-clearance"
        actor: Contractor
        preconditions:
          - "status == IN_REMEDIATION"
          - "the acting Contractor's X-User-ID equals the contractor_id of the order's IN_PROGRESS RemediationProject"
        side_effects:
          - "status set to CLEARANCE_PENDING"
        note: "contractor declares work ready for clearance"
      - from: CLEARANCE_PENDING
        to: CLEARED
        trigger: "POST /api/v1/clearance-tests (evaluated_result == PASS)"
        actor: Inspector
        preconditions:
          - "status == CLEARANCE_PENDING"
          - "cleared_by_inspector_id != source investigation's inspector_id (four-eyes)"
        side_effects:
          - "status set to CLEARED"
          - "every OPEN HazardFinding of the source investigation transitions to CONTROLLED (cascade link 2)"
          - "Case.open_hazard_count decremented and controlled_hazard_count incremented by the number reclassified; total_hazard_count unchanged"
        note: "clearance-pass cascade; conserves total_hazard_count"
      - from: CLEARANCE_PENDING
        to: IN_REMEDIATION
        trigger: "POST /api/v1/clearance-tests (evaluated_result == FAIL)"
        actor: Inspector
        preconditions:
          - "status == CLEARANCE_PENDING"
          - "cleared_by_inspector_id != source investigation's inspector_id (four-eyes)"
        side_effects:
          - "status set to IN_REMEDIATION (re-work required; the cycle back edge)"
        note: "CYCLE: CLEARANCE_PENDING -> IN_REMEDIATION -> CLEARANCE_PENDING on retry"
      - from: ISSUED
        to: VOID
        trigger: "POST /api/v1/hazard-control-orders/{id}/void or cascade from Case withdraw"
        actor: CaseManager
        preconditions:
          - "status in {ISSUED, IN_REMEDIATION, CLEARANCE_PENDING, CLEARED}"
        side_effects:
          - "status set to VOID"
          - "every CONTROLLED HazardFinding of the source investigation reverts to OPEN (compensating; conserves total_hazard_count)"
          - "Case.controlled_hazard_count decremented and open_hazard_count incremented by the number reverted"
          - "each RemediationProject of this order in {PROPOSED, APPROVED, IN_PROGRESS} transitions to CANCELLED (cascade link 2 of withdraw chain)"
        note: "compensating action; middle link of the depth-3 withdraw cascade"
      - from: IN_REMEDIATION
        to: VOID
        trigger: "POST /api/v1/hazard-control-orders/{id}/void or cascade from Case withdraw"
        actor: CaseManager
        preconditions:
          - "status in {ISSUED, IN_REMEDIATION, CLEARANCE_PENDING, CLEARED}"
        side_effects:
          - "same as ISSUED -> VOID"
      - from: CLEARANCE_PENDING
        to: VOID
        trigger: "POST /api/v1/hazard-control-orders/{id}/void or cascade from Case withdraw"
        actor: CaseManager
        preconditions:
          - "status in {ISSUED, IN_REMEDIATION, CLEARANCE_PENDING, CLEARED}"
        side_effects:
          - "same as ISSUED -> VOID"
      - from: CLEARED
        to: VOID
        trigger: "POST /api/v1/hazard-control-orders/{id}/void (administrative: clearance invalidated)"
        actor: CaseManager
        preconditions:
          - "status in {ISSUED, IN_REMEDIATION, CLEARANCE_PENDING, CLEARED}"
        side_effects:
          - "same as ISSUED -> VOID (reverts CONTROLLED hazards to OPEN; conserves total_hazard_count)"
        note: "compensating action reachable after a clearance PASS"

  # -- RemediationProject ----------------------------------------------------
  - entity: RemediationProject
    initial_state: PROPOSED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /api/v1/remediation-projects/{id}/approve"
        actor: CaseManager
        preconditions:
          - "status == PROPOSED"
          - "linked HazardControlOrder.status == ISSUED"
          - "expected_grant_fund_version matches GrantFund.version (OCC)"
          - "grant_subsidy estimated_cost_cents <= GrantFund.available_cents"
        side_effects:
          - "status set to APPROVED"
          - "estimated_cost_cents set from grant_subsidy calc"
          - "GrantFund.reserved_cents increased by estimated_cost_cents; GrantFund.available_cents recomputed"
          - "increments GrantFund.version by 1"
        note: "reserves the income-tiered subsidy; OCC on GrantFund.version"
      - from: APPROVED
        to: IN_PROGRESS
        trigger: "POST /api/v1/remediation-projects/{id}/start"
        actor: Contractor
        preconditions:
          - "status == APPROVED"
          - "the acting Contractor's X-User-ID equals contractor_id"
          - "Contractor.certification_status == ACTIVE"
          - "Contractor.certification_expires_at > current logical clock"
          - "linked HazardControlOrder.status == ISSUED"
        side_effects:
          - "status set to IN_PROGRESS"
          - "linked HazardControlOrder ISSUED -> IN_REMEDIATION"
        note: "cross-entity dependency on Contractor certification state"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /api/v1/remediation-projects/{id}/complete"
        actor: Contractor
        preconditions:
          - "status == IN_PROGRESS"
          - "the acting Contractor's X-User-ID equals contractor_id"
          - "linked HazardControlOrder.status == CLEARED"
        side_effects:
          - "status set to COMPLETED"
          - "final_cost_cents set to sum of line_items[].amount_cents (remediation_cost_reconciliation final variant)"
          - "GrantFund.reserved_cents decreased by estimated_cost_cents; GrantFund.spent_cents increased by min(estimated_cost_cents, final_cost_cents); available_cents recomputed"
        note: "reconciles reserved subsidy against actual spend"
      - from: PROPOSED
        to: CANCELLED
        trigger: "POST /api/v1/remediation-projects/{id}/cancel or cascade from order VOID"
        actor: CaseManager
        preconditions:
          - "status in {PROPOSED, APPROVED, IN_PROGRESS}"
        side_effects:
          - "status set to CANCELLED"
          - "if it had reserved funds (was APPROVED or IN_PROGRESS): GrantFund.reserved_cents decreased by estimated_cost_cents; available_cents recomputed (compensating release, cascade link 3 of withdraw chain)"
        note: "compensating release; tail link of the depth-3 withdraw cascade"
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /api/v1/remediation-projects/{id}/cancel or cascade from order VOID"
        actor: CaseManager
        preconditions:
          - "status in {PROPOSED, APPROVED, IN_PROGRESS}"
        side_effects:
          - "same as PROPOSED -> CANCELLED (releases reserved subsidy)"
      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "POST /api/v1/remediation-projects/{id}/cancel or cascade from order VOID"
        actor: CaseManager
        preconditions:
          - "status in {PROPOSED, APPROVED, IN_PROGRESS}"
        side_effects:
          - "same as PROPOSED -> CANCELLED (releases reserved subsidy)"

  # -- Contractor: CYCLIC (ACTIVE <-> SUSPENDED) -----------------------------
  - entity: Contractor
    initial_state: PENDING
    terminal_states: [REVOKED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /api/v1/contractors/{id}/certification (action=ACTIVATE)"
        actor: ProgramAdmin
        preconditions:
          - "certification_status == PENDING"
        side_effects:
          - "certification_status set to ACTIVE; certification_expires_at set to provided expires_at"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /api/v1/contractors/{id}/certification (action=SUSPEND)"
        actor: ProgramAdmin
        preconditions:
          - "certification_status == ACTIVE"
        side_effects:
          - "certification_status set to SUSPENDED"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /api/v1/contractors/{id}/certification (action=REINSTATE)"
        actor: ProgramAdmin
        preconditions:
          - "certification_status == SUSPENDED"
        side_effects:
          - "certification_status set to ACTIVE"
        note: "CYCLE: ACTIVE <-> SUSPENDED"
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /api/v1/contractors/{id}/certification (action=EXPIRE) or system lapse when clock passes certification_expires_at"
        actor: ProgramAdmin
        preconditions:
          - "certification_status == ACTIVE"
        side_effects:
          - "certification_status set to EXPIRED"
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /api/v1/contractors/{id}/certification (action=REVOKE)"
        actor: ProgramAdmin
        preconditions:
          - "certification_status in {ACTIVE, SUSPENDED}"
        side_effects:
          - "certification_status set to REVOKED (terminal)"
      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /api/v1/contractors/{id}/certification (action=REVOKE)"
        actor: ProgramAdmin
        preconditions:
          - "certification_status in {ACTIVE, SUSPENDED}"
        side_effects:
          - "certification_status set to REVOKED (terminal)"

  # -- RelocationPlacement ---------------------------------------------------
  - entity: RelocationPlacement
    initial_state: ACTIVE
    terminal_states: [ENDED, CANCELLED]
    transitions:
      - from: ACTIVE
        to: ENDED
        trigger: "POST /api/v1/relocation-placements/{id}/end"
        actor: CaseManager
        preconditions:
          - "status == ACTIVE"
          - "actual_end_date >= start_date"
        side_effects:
          - "status set to ENDED; actual_end_date recorded"
          - "reimbursement_cents computed via relocation_reimbursement over actual nights"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /api/v1/cases/{id}/withdraw (fan-out) or system cancellation"
        actor: system
        preconditions:
          - "status == ACTIVE"
        side_effects:
          - "status set to CANCELLED; reimbursement_cents stays 0"

# ===========================================================================
# §1.2.1 Concurrency Rules
# ===========================================================================
concurrency_rules:
  - rule_id: project-approve-stale-grant
    parent_entity: GrantFund
    write_endpoint: "POST /api/v1/remediation-projects/{id}/approve"
    occ_field: "expected_grant_fund_version"
    description: |
      Approving a RemediationProject reserves an income-tiered subsidy against
      the named GrantFund. Approval is rejected when the client's
      expected_grant_fund_version no longer matches the fund's current version,
      i.e. the fund has been mutated (another project already reserved or a
      completion finalized against it) since the client last read it, so the
      client's view of available_cents is stale.
    error_id: ERR_STALE_GRANT_VERSION
    http_status: 412

# ===========================================================================
# §1.3 Calculation Rules Table
# ===========================================================================
calculations:
  # -- DUAL-VARIANT #1 (Case domain) -----------------------------------------
  - name: case_reference_bll
    trigger: "on POST /api/v1/cases (PROVISIONAL) and on POST /api/v1/blood-lead-tests when a VENOUS SCREENING/DIAGNOSTIC test is recorded for a child with a non-terminal case (CONFIRMED)"
    algorithm: dual_variant_selection
    formula: |
      PROVISIONAL (at case open):
        reference_bll_ug_dl = qualifying_test.bll_ug_dl
        reference_basis = PROVISIONAL
      CONFIRMED (when a VENOUS SCREENING/DIAGNOSTIC test lands on the child):
        candidates = child's BloodLeadTests where specimen_type == VENOUS
                     AND test_kind in {SCREENING, DIAGNOSTIC}
        reference_bll_ug_dl = max(candidates.bll_ug_dl)
        reference_basis = CONFIRMED
      priority_class is recomputed from reference_bll_ug_dl on every change.
    input_set: "PROVISIONAL uses exactly the qualifying test; CONFIRMED uses only VENOUS SCREENING/DIAGNOSTIC tests (FOLLOWUP tests are excluded from reference and drive medical_status instead)."
    constants: {}
    precision: "reference_bll_ug_dl carried to 1 decimal place; max is exact"
    variants:
      - name: provisional
        when: "at case creation, before any venous confirmation exists"
        difference: "takes the qualifying test's BLL verbatim, even if that test is a capillary screen"
      - name: confirmed
        when: "once a venous screening/diagnostic result is on file"
        difference: "takes the maximum venous BLL; a lower venous confirm can pull the reference (and priority) below the provisional capillary value"

  # -- DUAL-VARIANT #2 (RemediationProject domain) ---------------------------
  - name: remediation_cost_reconciliation
    trigger: "estimated at POST /api/v1/remediation-projects/{id}/approve; final at POST /api/v1/remediation-projects/{id}/complete"
    algorithm: forward_looking_then_chronological
    formula: |
      ESTIMATED (forward-looking, at APPROVE):
        estimated_cost_cents = grant_subsidy(order.hazard_count, case.income_tier)
        reserve estimated_cost_cents against the GrantFund
      FINAL (chronological actuals, at COMPLETE):
        final_cost_cents = sum(line_items[i].amount_cents)
        release reserved estimated_cost_cents
        spent_cents += min(estimated_cost_cents, final_cost_cents)   # grant never pays above the reserved subsidy
    input_set: "estimated uses the order's hazard_count snapshot; final uses the contractor-submitted line_items at completion"
    constants: {}
    precision: "integer cents; no rounding (amounts are already cents)"
    variants:
      - name: estimated
        when: "APPROVE"
        difference: "projection from hazard_count and income tier; reserves funds"
      - name: final
        when: "COMPLETE"
        difference: "sum of actual line items; grant outlay capped at the estimate, so overruns fall on the owner"

  # -- COMBINATORIAL #1 (mode a: >=3 inputs, non-linear min + tier select) ----
  - name: grant_subsidy
    trigger: "evaluated inside remediation_cost_reconciliation ESTIMATED at POST /api/v1/remediation-projects/{id}/approve"
    algorithm: tiered_pricing
    formula: |
      multiplier = INCOME_MULTIPLIER[case.income_tier]   # tier selection
      raw = BASE_UNIT_SUBSIDY_CENTS * order.hazard_count * multiplier
      subsidy_cents = min(SUBSIDY_CAP_CENTS, round_half_up(raw))
    input_set: "order.hazard_count (integer), case.income_tier (enum), the two rate constants"
    constants:
      BASE_UNIT_SUBSIDY_CENTS: 250000
      SUBSIDY_CAP_CENTS: 1500000
      INCOME_MULTIPLIER:
        EXTREMELY_LOW: 1.5
        VERY_LOW: 1.25
        LOW: 1.0
        MODERATE: 0.75
    precision: "round_half_up to whole cents before the cap comparison"
    variants: []

  # -- COMBINATORIAL #2 (mode b: nested rounding, order pinned) --------------
  - name: relocation_reimbursement
    trigger: "on POST /api/v1/relocation-placements/{id}/end"
    algorithm: aggregation
    formula: |
      nights = (actual_end_date - start_date) in whole days   # closed-start, open-end day count
      raw_per_day = (PER_DIEM_LODGING_CENTS + MEAL_RATE_CENTS_PER_OCCUPANT * occupant_count) * ADMIN_FACTOR
      per_day_cents = round_half_up(raw_per_day)               # ROUND PER DAY FIRST
      reimbursement_cents = per_day_cents * nights             # THEN multiply/sum
      # Pinned order: round the per-day amount, THEN multiply by nights.
      # (round_half_up(raw_per_day) * nights), NOT round_half_up(raw_per_day * nights).
    input_set: "occupant_count and the (start_date, actual_end_date) span of the placement"
    constants:
      PER_DIEM_LODGING_CENTS: 12000
      MEAL_RATE_CENTS_PER_OCCUPANT: 3500
      ADMIN_FACTOR: 1.075
    precision: "round_half_up to whole cents PER DAY, before multiplying by nights"
    variants: []

  # -- THRESHOLD: case priority classification -------------------------------
  - name: case_priority_classification
    trigger: "whenever reference_bll_ug_dl is (re)computed by case_reference_bll"
    algorithm: threshold
    formula: |
      if reference_bll_ug_dl >= BLL_CLASS_I_MIN:   priority_class = CLASS_I
      elif reference_bll_ug_dl >= BLL_CLASS_II_MIN: priority_class = CLASS_II
      else:                                         priority_class = CLASS_III   # ref always >= BLL_CASE_THRESHOLD
    input_set: "the case's current reference_bll_ug_dl"
    constants:
      BLL_CASE_THRESHOLD_UG_DL: 3.5
      BLL_CLASS_II_MIN: 20
      BLL_CLASS_I_MIN: 45
    precision: "compare on 1-decimal BLL; boundaries are inclusive lower bounds (>=)"
    variants: []

  # -- THRESHOLD: dust-wipe clearance ----------------------------------------
  - name: clearance_evaluation
    trigger: "on POST /api/v1/clearance-tests"
    algorithm: threshold
    formula: |
      evaluated_result = PASS if
        floor_result_ug_ft2 <= DUST_FLOOR_LIMIT AND
        sill_result_ug_ft2  <= DUST_SILL_LIMIT  AND
        trough_result_ug_ft2 <= DUST_TROUGH_LIMIT
      else FAIL
    input_set: "the three dust-wipe measurements submitted with the clearance test"
    constants:
      DUST_FLOOR_LIMIT: 10
      DUST_SILL_LIMIT: 100
      DUST_TROUGH_LIMIT: 400
    precision: "limits are inclusive maxima (<=); a result exactly at the limit PASSES"
    variants: []

  # -- CONSERVATION #1 (money): grant ledger ---------------------------------
  - name: grant_ledger
    trigger: "recomputed on every RemediationProject approve/complete/cancel side effect"
    algorithm: aggregation
    formula: |
      available_cents = total_budget_cents - reserved_cents - spent_cents
      INVARIANT (conserved): available_cents + reserved_cents + spent_cents == total_budget_cents
      at all times. A forward approve (reserved += S) paired with its
      compensating cancel (reserved -= S) MUST return reserved_cents and
      available_cents to their pre-approve values (no drift).
    input_set: "the GrantFund's reserved_cents and spent_cents accumulators"
    constants: {}
    precision: "integer cents; available_cents floored at 0 is never needed because approval is rejected when estimated_cost_cents > available_cents"
    variants: []

  # -- CONSERVATION #2 (count): hazard ledger --------------------------------
  - name: hazard_count_ledger
    trigger: "recomputed on HazardFinding creation, clearance-pass control, and order-void revert"
    algorithm: aggregation
    formula: |
      total_hazard_count = open_hazard_count + controlled_hazard_count
      INVARIANT (conserved): for a case, total_hazard_count is unchanged by a
      clearance PASS (open -> controlled) and by its compensating order VOID
      (controlled -> open); only HazardFinding creation increases total_hazard_count.
    input_set: "HazardFindings of the case, partitioned by control_status"
    constants: {}
    precision: "integer counts"
    variants: []

# ===========================================================================
# §1.4 Validation Rules Table (ordered by priority; lowest number wins a tie)
# ===========================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "the acting role is permitted for this endpoint per the §1.7 RBAC matrix"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: business_constraint
    check: "request body well-formed: required fields present, enum values legal, numeric fields >= 0, occupant_count >= 1, pagination limit in [1,100] and offset >= 0"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all"
  - priority: 4
    category: existence
    check: "every path id and every body FK target resolves to an existing resource, validated left-to-right"
    error_id: "ERR_<RESOURCE>_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path ids or FK body fields"
  - priority: 5
    category: business_referential
    check: "for entity_backed actors, X-User-ID equals the ownership FK of the target (Inspector==investigation.inspector_id; Contractor==project.contractor_id)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /investigations/{id}/findings, POST /investigations/{id}/complete, POST /remediation-projects/{id}/start, POST /remediation-projects/{id}/complete, POST /hazard-control-orders/{id}/request-clearance"
  - priority: 6
    category: business_safety
    check: "four-eyes: on clearance, cleared_by_inspector_id (X-User-ID) must NOT equal the source investigation's inspector_id"
    error_id: ERR_SOD_CONFLICT
    http_status: 409
    applies_to: "POST /clearance-tests"
  - priority: 7
    category: state
    check: "the target resource is in a state from which the requested transition is defined (see §1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 8
    category: business_constraint
    check: "OCC: expected_grant_fund_version equals the GrantFund's current version"
    error_id: ERR_STALE_GRANT_VERSION
    http_status: 412
    applies_to: "POST /remediation-projects/{id}/approve"
  - priority: 9
    category: business_safety
    check: "case-opening qualifying test belongs to the same child (qualifying_test.child_id == child_id) AND its bll_ug_dl >= BLL_CASE_THRESHOLD_UG_DL"
    error_id: ERR_BLL_BELOW_THRESHOLD
    http_status: 422
    applies_to: "POST /cases"
    note: "qualifying_test.child_id mismatch raises ERR_QUALIFYING_TEST_MISMATCH at this same priority, evaluated before the BLL threshold"
  - priority: 10
    category: business_referential
    check: "project start requires linked Contractor.certification_status == ACTIVE AND certification_expires_at > current logical clock"
    error_id: ERR_CONTRACTOR_NOT_CERTIFIED
    http_status: 409
    applies_to: "POST /remediation-projects/{id}/start"
  - priority: 11
    category: business_referential
    check: "relocation placement requires the target RelocationUnit.status == AVAILABLE"
    error_id: ERR_UNIT_UNAVAILABLE
    http_status: 409
    applies_to: "POST /relocation-placements"
  - priority: 12
    category: business_referential
    check: "relocation placement requires the referenced Case.case_status NOT in {CLOSED, WITHDRAWN} (cannot relocate a terminal case)"
    error_id: ERR_CASE_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /relocation-placements"
    note: "PAIR B high side (business_referential); wins over ERR_RELOCATION_OVERLAP (priority 14, temporal) when both fail"
  - priority: 13
    category: business_temporal
    check: "the inspector has no other SCHEDULED/IN_PROGRESS investigation whose [scheduled_start, scheduled_end) half-open window overlaps this one (touching endpoints do NOT overlap)"
    error_id: ERR_INSPECTOR_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /investigations"
  - priority: 14
    category: business_temporal
    check: "the RelocationUnit has no other ACTIVE placement whose closed [start_date, end_date] interval is within RELOCATION_CLEANING_BUFFER_DAYS (= 3) of this placement's interval (buffered closed intervals); conflict iff new.start_date <= existing.end_date + 3 days AND new.end_date >= existing.start_date - 3 days"
    error_id: ERR_RELOCATION_OVERLAP
    http_status: 409
    applies_to: "POST /relocation-placements"
    note: "PAIR B low side (business_temporal)"
  - priority: 15
    category: business_safety
    check: "case close requires medical_status == RESOLVED AND open_hazard_count == 0 AND at least one HazardControlOrder CLEARED"
    error_id: ERR_CASE_NOT_RESOLVABLE
    http_status: 409
    applies_to: "POST /cases/{id}/close"
  - priority: 16
    category: business_fiscal
    check: "project approval requires grant_subsidy estimated_cost_cents <= GrantFund.available_cents"
    error_id: ERR_GRANT_INSUFFICIENT
    http_status: 402
    applies_to: "POST /remediation-projects/{id}/approve"
    note: "PAIR A low side (business_fiscal); loses to ERR_INVALID_STATE (priority 7, state) when both fail"

# ===========================================================================
# §1.5 API Endpoint Table
# ===========================================================================
endpoints:
  # ---- Child ----
  - method: POST
    path: "/api/v1/children"
    description: "Register a screened child."
    roles: [IntakeCoordinator, ProgramAdmin]
    code: 201
    input: [full_name, date_of_birth, guardian_name, primary_dwelling_id, "medicaid_enrolled?", income_tier]
    output: Child
    side_effects: []
  - method: GET
    path: "/api/v1/children"
    description: "List children; filter by residence."
    roles: [IntakeCoordinator, CaseManager, Inspector, ProgramAdmin]
    code: 200
    input: ["primary_dwelling_id?", "limit?", "offset?"]
    output: Child[]
    side_effects: []
  - method: GET
    path: "/api/v1/children/{id}"
    description: "Fetch one child."
    roles: [IntakeCoordinator, CaseManager, Inspector, ProgramAdmin]
    code: 200
    input: []
    output: Child
    side_effects: []
  - method: GET
    path: "/api/v1/children/{id}/blood-lead-tests"
    description: "List a child's blood-lead tests (reverse-reachability for BloodLeadTest.child_id)."
    roles: [IntakeCoordinator, CaseManager, Inspector, ProgramAdmin]
    code: 200
    input: []
    output: BloodLeadTest[]
    side_effects: []

  # ---- BloodLeadTest ----
  - method: POST
    path: "/api/v1/blood-lead-tests"
    description: "Record a blood-lead result; drives reference-BLL confirmation and medical_status."
    roles: [IntakeCoordinator]
    code: 201
    input: [child_id, bll_ug_dl, specimen_type, test_kind, collected_at]
    output: BloodLeadTest
    side_effects:
      - "result_class computed from bll_ug_dl via case_priority_classification thresholds"
      - "if the child has a non-terminal Case and this is a VENOUS SCREENING/DIAGNOSTIC test: case_reference_bll switches the case to CONFIRMED (max venous BLL) and case_priority_classification recomputes priority_class"
      - "if this is a VENOUS FOLLOWUP test: advances/regresses Case.medical_status per the Case medical axis"

  # ---- Dwelling ----
  - method: POST
    path: "/api/v1/dwellings"
    description: "Register a residential dwelling."
    roles: [IntakeCoordinator, ProgramAdmin]
    code: 201
    input: [street_address, "unit_designation?", year_built, owner_name, jurisdiction]
    output: Dwelling
    side_effects:
      - "pre_1978 computed from year_built"

  # ---- Case ----
  - method: POST
    path: "/api/v1/cases"
    description: "Open a lead case from a qualifying blood-lead test."
    roles: [IntakeCoordinator]
    code: 201
    input: [child_id, dwelling_id, qualifying_test_id]
    output: Case
    side_effects:
      - "reference_bll_ug_dl set PROVISIONAL from the qualifying test (case_reference_bll)"
      - "income_tier snapshot copied from the child; priority_class computed"
      - "case_status=OPEN, medical_status=ELEVATED"
  - method: GET
    path: "/api/v1/cases/{id}"
    description: "Fetch one case."
    roles: [IntakeCoordinator, CaseManager, Inspector, ProgramAdmin]
    code: 200
    input: []
    output: Case
    side_effects: []
  - method: GET
    path: "/api/v1/cases"
    description: "List cases; filters cover reverse-reachability for child_id, dwelling_id, qualifying_test_id."
    roles: [IntakeCoordinator, CaseManager, Inspector, ProgramAdmin]
    code: 200
    input: ["child_id?", "dwelling_id?", "qualifying_test_id?", "case_status?", "limit?", "offset?"]
    output: Case[]
    side_effects: []
  - method: POST
    path: "/api/v1/cases/{id}/withdraw"
    description: "Withdraw a case; cascades to cancel investigations, void orders, cancel projects, release grants."
    roles: [CaseManager]
    code: 200
    input: []
    output: Case
    side_effects:
      - "case_status -> WITHDRAWN"
      - "fan-out: non-terminal investigations -> CANCELLED"
      - "cascade: non-terminal HazardControlOrders -> VOID (which revert controlled hazards and cancel projects, which release grant reservations)"
  - method: POST
    path: "/api/v1/cases/{id}/close"
    description: "Close a case once cleared and medically resolved."
    roles: [CaseManager]
    code: 200
    input: []
    output: Case
    side_effects:
      - "case_status ENFORCEMENT -> CLOSED"

  # ---- Inspector ----
  - method: POST
    path: "/api/v1/inspectors"
    description: "Register a lead risk-assessor inspector."
    roles: [ProgramAdmin]
    code: 201
    input: [full_name, certification_id_number, "active?"]
    output: Inspector
    side_effects: []

  # ---- EnvironmentalInvestigation ----
  - method: POST
    path: "/api/v1/investigations"
    description: "Schedule an environmental investigation for a case."
    roles: [CaseManager]
    code: 201
    input: [case_id, dwelling_id, inspector_id, scheduled_start, scheduled_end]
    output: EnvironmentalInvestigation
    side_effects:
      - "requires Case.case_status in {OPEN, INVESTIGATION} (cross-entity dependency)"
      - "if Case.case_status == OPEN it advances to INVESTIGATION"
      - "rejected on inspector schedule overlap (half-open window)"
  - method: GET
    path: "/api/v1/investigations/{id}"
    description: "Fetch one investigation."
    roles: [CaseManager, Inspector, ProgramAdmin]
    code: 200
    input: []
    output: EnvironmentalInvestigation
    side_effects: []
  - method: GET
    path: "/api/v1/investigations"
    description: "List investigations; filters cover reverse-reachability for case_id, dwelling_id, inspector_id."
    roles: [CaseManager, Inspector, ProgramAdmin]
    code: 200
    input: ["case_id?", "dwelling_id?", "inspector_id?", "status?", "limit?", "offset?"]
    output: EnvironmentalInvestigation[]
    side_effects: []
  - method: GET
    path: "/api/v1/investigations/{id}/hazard-findings"
    description: "List an investigation's hazard findings (reverse-reachability for HazardFinding.investigation_id)."
    roles: [CaseManager, Inspector, ProgramAdmin]
    code: 200
    input: []
    output: HazardFinding[]
    side_effects: []
  - method: POST
    path: "/api/v1/investigations/{id}/findings"
    description: "Record a hazard finding; starts the visit."
    roles: [Inspector]
    code: 201
    input: [hazard_type, location, measurement_value, severity]
    output: HazardFinding
    side_effects:
      - "investigation SCHEDULED -> IN_PROGRESS on first finding; hazard_finding_count incremented"
      - "Case.open_hazard_count and total_hazard_count incremented"
  - method: POST
    path: "/api/v1/investigations/{id}/complete"
    description: "Complete an investigation; issues an order iff hazards were found."
    roles: [Inspector]
    code: 200
    input: []
    output: EnvironmentalInvestigation
    side_effects:
      - "status -> COMPLETED; completed_at stamped"
      - "if hazard_finding_count >= 1: creates a HazardControlOrder in ISSUED (hazard_count snapshot); Case -> ENFORCEMENT"
      - "if hazard_finding_count == 0 and medical_status == RESOLVED: Case -> CLOSED"

  # ---- HazardControlOrder ----
  - method: GET
    path: "/api/v1/hazard-control-orders/{id}"
    description: "Fetch one hazard-control order."
    roles: [CaseManager, Inspector, Contractor, ProgramAdmin]
    code: 200
    input: []
    output: HazardControlOrder
    side_effects: []
  - method: GET
    path: "/api/v1/hazard-control-orders"
    description: "List orders; filters cover reverse-reachability for case_id, dwelling_id, investigation_id."
    roles: [CaseManager, Inspector, ProgramAdmin]
    code: 200
    input: ["case_id?", "dwelling_id?", "investigation_id?", "status?", "limit?", "offset?"]
    output: HazardControlOrder[]
    side_effects: []
  - method: GET
    path: "/api/v1/hazard-control-orders/{id}/clearance-tests"
    description: "List clearance tests for an order (reverse-reachability for ClearanceTest.order_id)."
    roles: [CaseManager, Inspector, ProgramAdmin]
    code: 200
    input: []
    output: ClearanceTest[]
    side_effects: []
  - method: POST
    path: "/api/v1/hazard-control-orders/{id}/request-clearance"
    description: "Contractor declares remediation ready for clearance."
    roles: [Contractor]
    code: 200
    input: []
    output: HazardControlOrder
    side_effects:
      - "order IN_REMEDIATION -> CLEARANCE_PENDING"
  - method: POST
    path: "/api/v1/hazard-control-orders/{id}/void"
    description: "Void an order; reverts controlled hazards and cancels dependent projects."
    roles: [CaseManager]
    code: 200
    input: []
    output: HazardControlOrder
    side_effects:
      - "order -> VOID"
      - "CONTROLLED hazards of the source investigation revert to OPEN (conservation); Case counts adjust"
      - "non-terminal RemediationProjects of the order -> CANCELLED (which release grant reservations)"

  # ---- ClearanceTest ----
  - method: POST
    path: "/api/v1/clearance-tests"
    description: "Sign off a post-remediation dust-wipe clearance test (independent inspector)."
    roles: [Inspector]
    code: 201
    input: [order_id, floor_result_ug_ft2, sill_result_ug_ft2, trough_result_ug_ft2]
    output: ClearanceTest
    side_effects:
      - "cleared_by_inspector_id set from X-User-ID; four-eyes enforced vs source investigation inspector"
      - "evaluated_result computed (clearance_evaluation)"
      - "PASS: order CLEARANCE_PENDING -> CLEARED; OPEN hazards -> CONTROLLED (cascade); case counts adjust"
      - "FAIL: order CLEARANCE_PENDING -> IN_REMEDIATION (cyclic back edge)"

  # ---- RelocationUnit ----
  - method: POST
    path: "/api/v1/relocation-units"
    description: "Register a temporary relocation unit."
    roles: [ProgramAdmin]
    code: 201
    input: [address, bedroom_count, "status?"]
    output: RelocationUnit
    side_effects: []

  # ---- RelocationPlacement ----
  - method: POST
    path: "/api/v1/relocation-placements"
    description: "Place a case's family in a relocation unit (interim controls)."
    roles: [CaseManager]
    code: 201
    input: [case_id, relocation_unit_id, start_date, end_date, occupant_count]
    output: RelocationPlacement
    side_effects:
      - "rejected if unit not AVAILABLE (referential), if the Case is terminal CLOSED/WITHDRAWN (referential), or if the stay overlaps an ACTIVE placement within the cleaning buffer (temporal)"
      - "status=ACTIVE"
  - method: GET
    path: "/api/v1/relocation-placements/{id}"
    description: "Fetch one relocation placement."
    roles: [CaseManager, ProgramAdmin]
    code: 200
    input: []
    output: RelocationPlacement
    side_effects: []
  - method: GET
    path: "/api/v1/relocation-placements"
    description: "List placements; filters cover reverse-reachability for case_id, relocation_unit_id."
    roles: [CaseManager, ProgramAdmin]
    code: 200
    input: ["case_id?", "relocation_unit_id?", "status?", "limit?", "offset?"]
    output: RelocationPlacement[]
    side_effects: []
  - method: POST
    path: "/api/v1/relocation-placements/{id}/end"
    description: "End a placement and compute reimbursement."
    roles: [CaseManager]
    code: 200
    input: [actual_end_date]
    output: RelocationPlacement
    side_effects:
      - "status ACTIVE -> ENDED; actual_end_date recorded"
      - "reimbursement_cents computed (relocation_reimbursement)"

  # ---- Contractor ----
  - method: POST
    path: "/api/v1/contractors"
    description: "Register an RRP remediation contractor (starts PENDING)."
    roles: [ProgramAdmin]
    code: 201
    input: [business_name, rrp_certification_number]
    output: Contractor
    side_effects:
      - "certification_status=PENDING"
  - method: POST
    path: "/api/v1/contractors/{id}/certification"
    description: "Drive the RRP certification lifecycle."
    roles: [ProgramAdmin]
    code: 200
    input: [action, "expires_at?"]
    output: Contractor
    side_effects:
      - "action ACTIVATE: PENDING -> ACTIVE, sets certification_expires_at=expires_at"
      - "action SUSPEND: ACTIVE -> SUSPENDED; REINSTATE: SUSPENDED -> ACTIVE; EXPIRE: ACTIVE -> EXPIRED; REVOKE: {ACTIVE,SUSPENDED} -> REVOKED"

  # ---- GrantFund ----
  - method: POST
    path: "/api/v1/grant-funds"
    description: "Create a remediation grant fund."
    roles: [ProgramAdmin]
    code: 201
    input: [fund_name, fiscal_year, total_budget_cents]
    output: GrantFund
    side_effects:
      - "reserved_cents=0, spent_cents=0, available_cents=total_budget_cents"
  - method: GET
    path: "/api/v1/grant-funds/{id}"
    description: "Fetch a grant fund (read version + ledger for OCC)."
    roles: [ProgramAdmin, CaseManager]
    code: 200
    input: []
    output: GrantFund
    side_effects: []

  # ---- RemediationProject ----
  - method: POST
    path: "/api/v1/remediation-projects"
    description: "Propose a grant-funded remediation project against an issued order."
    roles: [CaseManager]
    code: 201
    input: [order_id, contractor_id, grant_fund_id]
    output: RemediationProject
    side_effects:
      - "status=PROPOSED; requires order.status==ISSUED"
  - method: GET
    path: "/api/v1/remediation-projects/{id}"
    description: "Fetch one remediation project."
    roles: [CaseManager, Contractor, ProgramAdmin]
    code: 200
    input: []
    output: RemediationProject
    side_effects: []
  - method: GET
    path: "/api/v1/remediation-projects"
    description: "List projects; filters cover reverse-reachability for order_id, contractor_id, grant_fund_id."
    roles: [CaseManager, Contractor, ProgramAdmin]
    code: 200
    input: ["order_id?", "contractor_id?", "grant_fund_id?", "status?", "limit?", "offset?"]
    output: RemediationProject[]
    side_effects: []
  - method: POST
    path: "/api/v1/remediation-projects/{id}/approve"
    description: "Approve a project; reserves the income-tiered subsidy (OCC on GrantFund.version)."
    roles: [CaseManager]
    code: 200
    input: [expected_grant_fund_version]
    output: RemediationProject
    side_effects:
      - "status PROPOSED -> APPROVED"
      - "estimated_cost_cents set (grant_subsidy); GrantFund.reserved_cents += estimated_cost_cents"
      - "increments GrantFund.version by 1"
  - method: POST
    path: "/api/v1/remediation-projects/{id}/start"
    description: "Contractor starts approved work (requires ACTIVE certification)."
    roles: [Contractor]
    code: 200
    input: []
    output: RemediationProject
    side_effects:
      - "status APPROVED -> IN_PROGRESS; linked order ISSUED -> IN_REMEDIATION"
  - method: POST
    path: "/api/v1/remediation-projects/{id}/complete"
    description: "Contractor completes work; finalizes cost against reserved subsidy."
    roles: [Contractor]
    code: 200
    input: [line_items]
    output: RemediationProject
    side_effects:
      - "requires linked order.status == CLEARED"
      - "status IN_PROGRESS -> COMPLETED; final_cost_cents = sum(line_items.amount_cents)"
      - "GrantFund.reserved_cents -= estimated_cost_cents; spent_cents += min(estimated_cost_cents, final_cost_cents)"
  - method: POST
    path: "/api/v1/remediation-projects/{id}/cancel"
    description: "Cancel a project; releases any reserved subsidy."
    roles: [CaseManager]
    code: 200
    input: []
    output: RemediationProject
    side_effects:
      - "status -> CANCELLED; if it held a reservation, GrantFund.reserved_cents -= estimated_cost_cents (compensating release)"

  # ---- Reporting ----
  - method: GET
    path: "/api/v1/reports/surveillance"
    description: "Aggregate surveillance report over cases and grant ledger."
    roles: [ProgramAdmin, CaseManager]
    code: 200
    input: ["jurisdiction?"]
    output: "{ total_cases: integer, open_cases: integer, class_i_count: integer, class_ii_count: integer, class_iii_count: integer, resolved_count: integer, total_reserved_cents: integer, total_spent_cents: integer }"
    side_effects: []

  # ---- Test-driving clock ----
  - method: POST
    path: "/api/v1/_clock/set_current_utc"
    description: "Set the server's logical clock. Startup default is 2026-05-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [ProgramAdmin]
    code: 200
    input: [to_iso8601]
    output: "null"
    side_effects:
      - "advances the logical clock used for deadlines, certification expiry, and completed_at/issued_at stamps"

# ===========================================================================
# §1.6 Error Code Catalog
# ===========================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing/invalid X-User-Role or X-User-ID headers"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "acting role not permitted for the endpoint"
  - id: ERR_VALIDATION
    http: 422
    condition: "malformed body: missing required field, illegal enum, negative number, occupant_count < 1, or bad pagination bounds"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "entity_backed actor's X-User-ID does not match the target's ownership FK"
  - id: ERR_SOD_CONFLICT
    http: 409
    condition: "clearance inspector equals the source investigation inspector (four-eyes violation)"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "requested transition not defined from the resource's current state"
  - id: ERR_STALE_GRANT_VERSION
    http: 412
    condition: "expected_grant_fund_version does not match the fund's current version"
  - id: ERR_QUALIFYING_TEST_MISMATCH
    http: 422
    condition: "qualifying_test.child_id != the case's child_id"
  - id: ERR_BLL_BELOW_THRESHOLD
    http: 422
    condition: "qualifying test bll_ug_dl < BLL_CASE_THRESHOLD_UG_DL (3.5)"
  - id: ERR_CONTRACTOR_NOT_CERTIFIED
    http: 409
    condition: "project start attempted while contractor certification is not ACTIVE or is expired by the clock"
  - id: ERR_UNIT_UNAVAILABLE
    http: 409
    condition: "relocation unit is not AVAILABLE"
  - id: ERR_CASE_NOT_ACTIVE
    http: 409
    condition: "relocation placement attempted for a Case in a terminal state (CLOSED or WITHDRAWN)"
  - id: ERR_INSPECTOR_DOUBLE_BOOKED
    http: 409
    condition: "inspector already has an overlapping SCHEDULED/IN_PROGRESS investigation window"
  - id: ERR_RELOCATION_OVERLAP
    http: 409
    condition: "unit already has an ACTIVE placement within the cleaning-buffer of the requested interval"
  - id: ERR_CASE_NOT_RESOLVABLE
    http: 409
    condition: "case close attempted while medical_status != RESOLVED, open hazards remain, or no order is CLEARED"
  - id: ERR_GRANT_INSUFFICIENT
    http: 402
    condition: "estimated subsidy exceeds the fund's available_cents at approval"
  - id: ERR_CHILD_NOT_FOUND
    http: 404
    condition: "referenced Child id does not exist"
  - id: ERR_DWELLING_NOT_FOUND
    http: 404
    condition: "referenced Dwelling id does not exist"
  - id: ERR_TEST_NOT_FOUND
    http: 404
    condition: "referenced BloodLeadTest id does not exist"
  - id: ERR_CASE_NOT_FOUND
    http: 404
    condition: "referenced Case id does not exist"
  - id: ERR_INSPECTOR_NOT_FOUND
    http: 404
    condition: "referenced Inspector id does not exist"
  - id: ERR_INVESTIGATION_NOT_FOUND
    http: 404
    condition: "referenced EnvironmentalInvestigation id does not exist"
  - id: ERR_ORDER_NOT_FOUND
    http: 404
    condition: "referenced HazardControlOrder id does not exist"
  - id: ERR_UNIT_NOT_FOUND
    http: 404
    condition: "referenced RelocationUnit id does not exist"
  - id: ERR_PLACEMENT_NOT_FOUND
    http: 404
    condition: "referenced RelocationPlacement id does not exist"
  - id: ERR_CONTRACTOR_NOT_FOUND
    http: 404
    condition: "referenced Contractor id does not exist"
  - id: ERR_GRANT_NOT_FOUND
    http: 404
    condition: "referenced GrantFund id does not exist"
  - id: ERR_PROJECT_NOT_FOUND
    http: 404
    condition: "referenced RemediationProject id does not exist"

# ===========================================================================
# §1.7 RBAC Matrix
# ===========================================================================
roles:
  - name: IntakeCoordinator
    description: "Program staff who register children/dwellings, record blood-lead tests, and open cases."
    identity: "opaque"
    exclusive_operations:
      - "POST /api/v1/children"
      - "POST /api/v1/blood-lead-tests"
      - "POST /api/v1/cases"
    shared_operations:
      - "POST /api/v1/dwellings (with ProgramAdmin)"
      - "GET reads on children, cases, blood-lead-tests"
  - name: CaseManager
    description: "Owns case lifecycle: schedules investigations, issues/voids orders, manages relocation, proposes/approves/cancels projects."
    identity: "opaque"
    exclusive_operations:
      - "POST /api/v1/cases/{id}/withdraw"
      - "POST /api/v1/cases/{id}/close"
      - "POST /api/v1/investigations"
      - "POST /api/v1/hazard-control-orders/{id}/void"
      - "POST /api/v1/relocation-placements"
      - "POST /api/v1/relocation-placements/{id}/end"
      - "POST /api/v1/remediation-projects"
      - "POST /api/v1/remediation-projects/{id}/approve"
      - "POST /api/v1/remediation-projects/{id}/cancel"
    shared_operations:
      - "GET reads across cases, investigations, orders, placements, projects, grant-funds, reports"
  - name: Inspector
    description: "Field risk-assessor who conducts investigations and signs independent clearance tests."
    identity: "entity_backed:Inspector"
    exclusive_operations:
      - "POST /api/v1/investigations/{id}/findings"
      - "POST /api/v1/investigations/{id}/complete"
      - "POST /api/v1/clearance-tests"
    shared_operations:
      - "GET reads on investigations, orders, clearance-tests, cases, children"
  - name: Contractor
    description: "RRP-certified firm that performs remediation and requests clearance."
    identity: "entity_backed:Contractor"
    exclusive_operations:
      - "POST /api/v1/hazard-control-orders/{id}/request-clearance"
      - "POST /api/v1/remediation-projects/{id}/start"
      - "POST /api/v1/remediation-projects/{id}/complete"
    shared_operations:
      - "GET reads on own projects and their orders"
  - name: ProgramAdmin
    description: "Operator managing inspectors, contractors, relocation units, grant funds, and reporting."
    identity: "opaque"
    exclusive_operations:
      - "POST /api/v1/inspectors"
      - "POST /api/v1/relocation-units"
      - "POST /api/v1/contractors"
      - "POST /api/v1/contractors/{id}/certification"
      - "POST /api/v1/grant-funds"
      - "POST /api/v1/_clock/set_current_utc"
    shared_operations:
      - "POST /api/v1/dwellings (with IntakeCoordinator)"
      - "GET reads across all collections and reports"
