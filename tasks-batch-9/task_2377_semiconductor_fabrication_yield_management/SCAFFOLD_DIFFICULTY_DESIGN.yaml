  # =====================================================================
  # R8 — resource_temporal_overlap
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: chamber_occupancy_is_open_ended_until_track_out
        grounds:
          - calculations.chamber_dispatch_score
          - validations[priority=39]
          - entities.Chamber.fields.occupancy_state
          - calculations.equipment_capacity_hours_ledger
        distinguishing_aspect: |
          Resource entity: Chamber. Interval semantics: the occupancy interval is
          [tracked_in_at, +infinity) while the run is OPEN — it has no scheduled end, so the
          chamber is excluded from every candidate pool until an explicit track-out closes it at
          [tracked_in_at, tracked_out_at). With CH_L1 the only LITHO chamber, LOT-002's track-in
          is refused with an empty pool, and the same call succeeds the instant LOT-001 tracks
          out, reusing the identical chamber.
        test_recipe:
          setup:
            - "FLOW-A RELEASED with seq 10 LITHO 2.0h and seq 20 ETCH 3.0h."
            - "Exactly ONE LITHO chamber exists in the fab: CH_L1 on LITHO-1, QUALIFIED at 2026-08-01T00:00:00Z, particle_count 0.0, available_capacity_hours 720.00, hours_since_pm 0.0, purge_buffer_hours 0.0."
            - "Operator OP-001 certified for LITHO/ETCH/CMP and GOWNED."
            - "PLAN-A COMMITTED; LOT-001 and LOT-002 (3 wafers each, STANDARD) both released at current_step_seq 0."
            - "LOT-001 has an OPEN seq-10 run on CH_L1 opened at 2026-08-01T00:00:00Z, so CH_L1 is OCCUPIED and LITHO-1 shows 718.00 capacity hours."
            - "The logical clock reads 2026-08-01T00:00:00Z at the start of the trigger."
          setup_api_calls:
            - call: "POST /fab/recipes"
              payload: { recipe_code: "LITHO-100", tool_type: "LITHO", target_value: 50.00, qual_expiry_days: 100 }
