  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      # ---- Instance 1: restricted-account available_balance conserved by deny
      - name: ci_account_available_conserved_by_deny
        grounds:
          - calculations.restricted_account_available
          - state_machines.Expenditure.PENDING_COURT_to_APPROVED
          - state_machines.Expenditure.APPROVED_to_DENIED
          - entities.RestrictedAccount.fields.available_balance_cents
          - entities.RestrictedAccount.fields.encumbered_cents
        distinguishing_aspect: |
          Conserved quantity available_balance_cents: a court expenditure APPROVED (encumbered +600,000,
          available 5,000,000 -> 4,400,000) then DENIED (compensating action) releases the hold, returning
          available_balance_cents to exactly 5,000,000 and encumbered_cents to 0 — no drift on the account balance.
        test_recipe:
          setup:
            - "CONSERVATORSHIP case ACTIVE, account funded 5,000,000, APPROVED 2026 budget admin cap 2,000,000"
            - "A court-required ADMIN expenditure of 600,000 (ADMIN always routes to PENDING_COURT) approved by the judge"
          setup_api_calls:
            - call: "POST /gc/protected-persons"
              payload: { full_name: "Cons Ward", date_of_birth: "1935-10-10", annual_income_cents: 0, liquid_estate_cents: 8000000 }
              as: CourtClerk
