            - call: "POST /shore-excursions/excursions"
              payload: { port_id: "${port_id}", operator_id: "${op_id}", title: "Reef Snorkel", duration_minutes: 300, min_age: 18, mobility_level: "LEVEL_2", languages: ["EN", "ES"], base_price_cents: 12000, price_tier: "PREMIUM", is_line_operated: false }
              as: ExcursionManager
              as_user_id: "u_mgr_1"
