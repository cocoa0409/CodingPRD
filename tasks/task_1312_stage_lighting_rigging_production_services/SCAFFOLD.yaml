scenario: "Stage Lighting, Rigging & Production Services (concert production vendor): design & plot development with load calculations, rigging point approval & structural engineering sign-off, equipment pull list & prep scheduling, crew call & union labor rules by venue, load-in/load-out schedule & truck pack, power distribution & generator planning, safety inspection & certification, damage/loss reconciliation post-event"

domain_name: "stage-lighting-rigging-production"
api_prefix: "/api"

complexity_profile:
  primary_archetype: posture_driven_gating
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Venue
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Venue display name" }
      - { name: union_ruleset, type: enum, source: input, description: "Labor ruleset governing all crew calls at this venue", constraints: "IATSE | TEAMSTERS | NON_UNION" }
      - { name: max_point_capacity_kg, type: number, source: input, description: "Structural limit per individual rigging point, kg", constraints: "> 0" }
      - { name: bay_aggregate_limit_kg, type: number, source: input, description: "Maximum summed factored load of all points sharing one bay_index, kg", constraints: "> 0" }
      - { name: house_power_amps_per_phase, type: integer, source: input, description: "House service capacity per phase in amps at 208V", constraints: "> 0" }
      - { name: dock_doors, type: integer, source: input, description: "Number of loading dock doors; dock_door_index must be < this", constraints: ">= 1" }
      - { name: min_call_hours, type: number, source: input, description: "Union minimum billed hours per crew call per day", default: 4 }
      - { name: ot1_threshold_hours, type: number, source: input, description: "Daily straight-time hours before 1.5x overtime begins", default: 8 }
      - { name: ot2_threshold_hours, type: number, source: input, description: "Daily hours before 2.0x double time begins", default: 12 }
      - { name: turnaround_min_hours, type: number, source: input, description: "Minimum rest gap between two call windows for the same technician", default: 8 }
      - { name: crew_call_publish_lead_hours, type: integer, source: input, description: "Crew call must be published at least this many hours before call_start", default: 48 }
      - { name: engineering_submission_lead_hours, type: integer, source: input, description: "Rigging points must enter engineering review at least this many hours before production load_in_at", default: 72 }

  - name: Technician
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Technician legal name" }
      - { name: union_card_no, type: string, source: input, description: "Union card number; globally unique", constraints: "unique across all technicians" }
      - { name: classification, type: enum, source: input, description: "Trade classification", constraints: "LIGHTING_TECH | RIGGER | STAGEHAND" }
      - { name: hourly_rate_cents, type: integer, source: input, description: "Straight-time hourly rate in cents", constraints: "> 0" }

  - name: Production
    parent: null
    common_fields: true
    fields:
      - { name: venue_id, type: string, source: input, description: "FK -> Venue.id; hosting venue" }
      - { name: name, type: string, source: input, description: "Production / show name" }
      - { name: load_in_at, type: datetime, source: input, description: "Load-in window open (venue occupancy start, inclusive)" }
      - { name: show_at, type: datetime, source: input, description: "Show start time" }
      - { name: load_out_at, type: datetime, source: input, description: "Venue occupancy end (inclusive); must satisfy load_in_at < show_at < load_out_at" }
      - { name: status, type: enum, source: system, description: "Lifecycle state", default: DRAFT, constraints: "DRAFT | PLANNING | READY_FOR_LOADIN | LOAD_IN | SHOW_READY | SHOW_COMPLETE | LOAD_OUT | CLOSED | SETTLED | CANCELLED" }
      - { name: posture, type: enum, source: computed, description: "Derived readiness aggregate per production_readiness_posture; gates the READY_FOR_LOADIN transition", default: BLOCKED, constraints: "BLOCKED | PARTIAL | READY" }

  - name: LightingPlot
    parent: null
    common_fields: true
    fields:
      - { name: production_id, type: string, source: input, description: "FK -> Production.id; owning production" }
      - { name: title, type: string, source: input, description: "Plot title" }
      - { name: revision, type: integer, source: system, description: "Server-assigned per-production sequence starting at 1; ordering key for plots (tie-break created_at ASC never needed since revisions are unique per production)" }
      - { name: status, type: enum, source: system, description: "Review lifecycle", default: DRAFT, constraints: "DRAFT | SUBMITTED | APPROVED | SUPERSEDED" }
      - { name: total_factored_load_kg, type: number, source: computed, description: "Sum of factored_load_kg over this plot's rigging points with status RESERVED, UNDER_REVIEW, APPROVED, or REJECTED (RELEASED points excluded); recomputed on every point mutation" }
      - { name: rejection_reason, type: string, source: input, description: "Required when transition to=DRAFT from SUBMITTED (reject); cleared on resubmit", default: null }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID of the StructuralEngineer who approved; null until approved" }
      - { name: approved_at, type: datetime, source: system, description: "Logical-clock timestamp of approval; null until approved" }

  - name: RiggingPoint
    parent: null
    common_fields: true
    fields:
      - { name: plot_id, type: string, source: input, description: "FK -> LightingPlot.id; plot this hang belongs to" }
      - { name: point_label, type: string, source: input, description: "Venue physical point label; unique among non-RELEASED points at the same venue whose productions' occupancy windows [load_in_at, load_out_at] (closed) intersect" }
      - { name: bay_index, type: integer, source: input, description: "Structural bay grouping for the aggregate load check", constraints: ">= 0" }
      - { name: hang_type, type: enum, source: input, description: "Rigging geometry driving the load factor", constraints: "STRAIGHT | BRIDLE | DEAD_HANG" }
      - { name: motor_count, type: integer, source: input, description: "Chain motors hung on this point", default: 0, constraints: ">= 0" }
      - { name: deadweight_kg, type: number, source: input, description: "Static hung load before factors, kg", constraints: "> 0" }
      - { name: factored_load_kg, type: number, source: computed, description: "Per rigging_point_factored_load; recomputed on create and revise" }
      - { name: utilization, type: number, source: computed, description: "factored_load_kg / venue.max_point_capacity_kg, 4 decimal places round_half_up" }
      - { name: status, type: enum, source: system, description: "Approval lifecycle", default: RESERVED, constraints: "RESERVED | UNDER_REVIEW | APPROVED | REJECTED | RELEASED" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID of the RiggingSupervisor who created the point (SoD reference)" }
      - { name: reviewed_by_user_id, type: string, source: system, description: "X-User-ID of the StructuralEngineer who approved; null until approved" }
      - { name: plot_version_at_submission, type: integer, source: system, description: "LightingPlot.version captured when the point entered UNDER_REVIEW; approval requires the plot to still be at this version (version-pinning)" }

  - name: EquipmentAsset
    parent: null
    common_fields: true
    fields:
      - { name: asset_tag, type: string, source: input, description: "Serialized inventory tag; globally unique", constraints: "unique" }
      - { name: asset_class, type: enum, source: input, description: "Equipment class", constraints: "MOVING_LIGHT | LED_PANEL | TRUSS_12IN | CHAIN_MOTOR | DISTRO_BOX | CABLE_FEEDER | CONSOLE | FOLLOWSPOT" }
      - { name: weight_kg, type: number, source: input, description: "Pack weight kg", constraints: "> 0" }
      - { name: power_draw_watts, type: integer, source: input, description: "Nameplate draw; informational for power planning", default: 0, constraints: ">= 0" }
      - { name: daily_rate_cents, type: integer, source: input, description: "Rental day rate in cents (tiered per equipment_rental_billing)", constraints: "> 0" }
      - { name: replacement_cost_cents, type: integer, source: input, description: "Full replacement cost in cents (damage valuation basis)", constraints: "> 0" }
      - { name: acquired_at, type: datetime, source: input, description: "Acquisition timestamp; depreciation age basis" }
      - { name: status, type: enum, source: system, description: "Inventory lifecycle; RESERVED/PREPPED/DEPLOYED are driven only by pull-list cascades", default: AVAILABLE, constraints: "AVAILABLE | RESERVED | PREPPED | DEPLOYED | DAMAGED | LOST | RETIRED" }

  - name: PullListEntry
    parent: null
    common_fields: true
    fields:
      - { name: production_id, type: string, source: input, description: "FK -> Production.id; production pulling the gear" }
      - { name: asset_id, type: string, source: input, description: "FK -> EquipmentAsset.id; requested serialized asset" }
      - { name: status, type: enum, source: system, description: "Pull lifecycle", default: REQUESTED, constraints: "REQUESTED | RESERVED | PREPPED | OUT | RETURNED | DAMAGED | LOST | CANCELLED" }
      - { name: prep_window_start, type: datetime, source: input, description: "Required when transition to=PREPPED; prep start", default: null }
      - { name: prep_window_end, type: datetime, source: input, description: "Required when transition to=PREPPED; must be > prep_window_start", default: null }
      - { name: load_schedule_id, type: string, source: input, description: "FK -> LoadSchedule.id; required when transition to=OUT (which authorized LOAD_IN truck run carries it); null otherwise", default: null }
      - { name: out_at, type: datetime, source: system, description: "Logical-clock time of check-out; null until OUT" }
      - { name: returned_at, type: datetime, source: system, description: "Logical-clock time of check-in or damage assessment (billing end); null until then" }
      - { name: rental_charge_cents, type: integer, source: computed, description: "Per equipment_rental_billing; computed at check-in or at damage/loss assessment; null before", default: null }

  - name: CrewCall
    parent: null
    common_fields: true
    fields:
      - { name: production_id, type: string, source: input, description: "FK -> Production.id" }
      - { name: department, type: enum, source: input, description: "Department staffing this call", constraints: "LIGHTING | RIGGING | STAGEHANDS" }
      - { name: call_start, type: datetime, source: input, description: "Call window start" }
      - { name: call_end, type: datetime, source: input, description: "Call window end; must be > call_start" }
      - { name: required_headcount, type: integer, source: input, description: "Confirmed assignments needed to confirm the call", constraints: ">= 1" }
      - { name: status, type: enum, source: system, description: "Call lifecycle", default: DRAFT, constraints: "DRAFT | PUBLISHED | CONFIRMED | COMPLETED | CANCELLED" }
      - { name: labor_cost_cents, type: integer, source: computed, description: "Per crew_call_labor_cost; computed at COMPLETED as the sum of per-assignment rounded charges", default: null }

  - name: CrewAssignment
    parent: null
    common_fields: true
    fields:
      - { name: crew_call_id, type: string, source: input, description: "FK -> CrewCall.id" }
      - { name: technician_id, type: string, source: input, description: "FK -> Technician.id" }
      - { name: status, type: enum, source: system, description: "Assignment lifecycle", default: ASSIGNED, constraints: "ASSIGNED | CONFIRMED | WORKED | NO_SHOW | RECONCILED | CANCELLED" }
      - { name: worked_hours, type: number, source: input, description: "Required when transition to=WORKED; 2dp hours actually worked", default: null, constraints: "0 < worked_hours <= 24, max 2 decimal places" }
      - { name: labor_charge_cents, type: integer, source: computed, description: "Per crew_call_labor_cost; computed when the parent call completes; null before", default: null }

  - name: PowerPlan
    parent: null
    common_fields: true
    fields:
      - { name: production_id, type: string, source: input, description: "FK -> Production.id" }
      - { name: phase_l1_watts, type: integer, source: input, description: "Connected load on phase L1", constraints: ">= 0" }
      - { name: phase_l2_watts, type: integer, source: input, description: "Connected load on phase L2", constraints: ">= 0" }
      - { name: phase_l3_watts, type: integer, source: input, description: "Connected load on phase L3", constraints: ">= 0" }
      - { name: feeder_length_m, type: integer, source: input, description: "Feeder cable run length in meters; drives line loss", constraints: ">= 0" }
      - { name: generator_required, type: boolean, source: input, description: "True: size a rental generator; false: use house power" }
      - { name: total_load_watts, type: number, source: computed, description: "Per power_distribution_sizing (loss-inclusive); null until first submit", default: null }
      - { name: required_kva, type: number, source: computed, description: "Per power_distribution_sizing; null until first submit; null when generator_required is false", default: null }
      - { name: selected_generator_tier_kva, type: integer, source: computed, description: "Smallest tier >= required_kva per power_distribution_sizing; null when generator_required is false", default: null }
      - { name: max_phase_imbalance_pct, type: number, source: computed, description: "(max_phase - min_phase) / max_phase, 4dp round_half_up; 0 when all phases are 0", default: null }
      - { name: status, type: enum, source: system, description: "Electrical review lifecycle", default: DRAFT, constraints: "DRAFT | SUBMITTED | APPROVED | REJECTED | SUPERSEDED" }

  - name: Truck
    parent: null
    common_fields: true
    fields:
      - { name: plate_no, type: string, source: input, description: "License plate; globally unique", constraints: "unique" }
      - { name: capacity_kg, type: number, source: input, description: "Maximum legal payload kg", constraints: "> 0" }

  - name: LoadSchedule
    parent: null
    common_fields: true
    fields:
      - { name: production_id, type: string, source: input, description: "FK -> Production.id" }
      - { name: truck_id, type: string, source: input, description: "FK -> Truck.id" }
      - { name: direction, type: enum, source: input, description: "Whether this run hauls in or out", constraints: "LOAD_IN | LOAD_OUT" }
      - { name: dock_door_index, type: integer, source: input, description: "Dock door used; must be < venue.dock_doors", constraints: ">= 0" }
      - { name: window_start, type: datetime, source: input, description: "Dock window start; half-open interval [window_start, window_end)" }
      - { name: window_end, type: datetime, source: input, description: "Dock window end (exclusive); must be > window_start" }
      - { name: pack_weight_kg, type: number, source: computed, description: "Per truck_pack_weight; recomputed on every check-out assigned to this schedule; 0 before", default: 0 }
      - { name: status, type: enum, source: system, description: "Run lifecycle", default: PLANNED, constraints: "PLANNED | CONFIRMED | AUTHORIZED | COMPLETE | CANCELLED" }

  - name: SafetyInspection
    parent: null
    common_fields: true
    fields:
      - { name: production_id, type: string, source: input, description: "FK -> Production.id" }
      - { name: inspection_type, type: enum, source: input, description: "Certification scope", constraints: "RIGGING | ELECTRICAL | FINAL" }
      - { name: status, type: enum, source: system, description: "Inspection lifecycle", default: SCHEDULED, constraints: "SCHEDULED | IN_PROGRESS | PASSED | FAILED | CANCELLED" }
      - { name: attempt_no, type: integer, source: system, description: "1 at creation; increments on every FAILED -> SCHEDULED reschedule" }
      - { name: inspector_user_id, type: string, source: system, description: "X-User-ID of the SafetyInspector who began the inspection; null until IN_PROGRESS" }
      - { name: findings, type: string, source: input, description: "Required when transition to=FAILED; inspector findings text", default: null }

  - name: DamageReport
    parent: null
    common_fields: true
    fields:
      - { name: production_id, type: string, source: input, description: "FK -> Production.id" }
      - { name: pull_list_entry_id, type: string, source: input, description: "FK -> PullListEntry.id; the entry whose asset was damaged or lost" }
      - { name: report_type, type: enum, source: input, description: "DAMAGE: repairable; LOSS: unrecoverable", constraints: "DAMAGE | LOSS" }
      - { name: valuation_method, type: enum, source: input, description: "Chosen at assess time: DEPRECIATED (book value) or REPAIR_QUOTE (quote + diminution); LOSS accepts only DEPRECIATED", default: null, constraints: "DEPRECIATED | REPAIR_QUOTE" }
      - { name: repair_quote_cents, type: integer, source: input, description: "Required at assess iff valuation_method == REPAIR_QUOTE; forbidden otherwise", default: null, constraints: "> 0" }
      - { name: assessed_charge_cents, type: integer, source: computed, description: "Per damage_valuation; null until ASSESSED", default: null }
      - { name: status, type: enum, source: system, description: "Claim lifecycle", default: FILED, constraints: "FILED | ASSESSED | CHARGED | WAIVED" }

  - name: SettlementStatement
    parent: null
    common_fields: true
    fields:
      - { name: production_id, type: string, source: input, description: "FK -> Production.id; exactly one settlement per production" }
      - { name: labor_total_cents, type: integer, source: computed, description: "Sum of labor_cost_cents over the production's COMPLETED crew calls" }
      - { name: equipment_total_cents, type: integer, source: computed, description: "Sum of rental_charge_cents over entries in RETURNED, DAMAGED, or LOST" }
      - { name: damage_total_cents, type: integer, source: computed, description: "Sum of assessed_charge_cents over CHARGED reports; debited on charge, credited on waive-from-CHARGED" }
      - { name: provisional_damage_cents, type: integer, source: computed, description: "Snapshot taken at settlement creation: sum of assessed_charge_cents over reports then in ASSESSED or CHARGED (forward-looking variant); frozen thereafter" }
      - { name: grand_total_cents, type: integer, source: computed, description: "labor_total_cents + equipment_total_cents + damage_total_cents (+ dispute_adjustment_cents once RESOLVED)" }
      - { name: provisional_grand_total_cents, type: integer, source: computed, description: "labor_total_cents + equipment_total_cents + provisional_damage_cents, frozen at creation" }
      - { name: dispute_adjustment_cents, type: integer, source: input, description: "Required when transition to=RESOLVED; signed cents adjustment", default: 0, constraints: "abs(value) <= damage_total_cents at resolve time" }
      - { name: status, type: enum, source: system, description: "Settlement lifecycle", default: DRAFT, constraints: "DRAFT | ISSUED | DISPUTED | RESOLVED | PAID" }

state_machines:
  - entity: Production
    initial_state: DRAFT
    terminal_states: [SETTLED, CANCELLED]
    transitions:
      - from: DRAFT
        to: PLANNING
        trigger: "POST /api/productions/{id}/transition to=PLANNING"
        actor: ProductionManager
        preconditions: ["production.status == DRAFT"]
        side_effects: ["increments Production.version by 1"]
      - from: PLANNING
        to: READY_FOR_LOADIN
        trigger: "POST /api/productions/{id}/transition to=READY_FOR_LOADIN"
        actor: ProductionManager
        preconditions: ["production.posture == READY per production_readiness_posture (else ERR_PRODUCTION_NOT_READY)"]
        side_effects: ["increments Production.version by 1"]
      - from: READY_FOR_LOADIN
        to: LOAD_IN
        trigger: "POST /api/productions/{id}/transition to=LOAD_IN"
        actor: ProductionManager
        preconditions: ["logical clock >= production.load_in_at (else ERR_TOO_EARLY)"]
        side_effects: ["increments Production.version by 1"]
      - from: LOAD_IN
        to: SHOW_READY
        trigger: "system: fires when a FINAL SafetyInspection transitions to PASSED"
        actor: system
        preconditions: ["a FINAL inspection just passed; the production's latest-attempt RIGGING and ELECTRICAL inspections are both PASSED"]
        side_effects: ["increments Production.version by 1"]
      - from: SHOW_READY
        to: SHOW_COMPLETE
        trigger: "POST /api/productions/{id}/transition to=SHOW_COMPLETE"
        actor: ProductionManager
        preconditions: ["logical clock >= production.show_at (else ERR_TOO_EARLY)"]
        side_effects: ["increments Production.version by 1"]
      - from: SHOW_COMPLETE
        to: LOAD_OUT
        trigger: "POST /api/productions/{id}/transition to=LOAD_OUT"
        actor: ProductionManager
        preconditions: []
        side_effects: ["increments Production.version by 1"]
      - from: LOAD_OUT
        to: CLOSED
        trigger: "POST /api/productions/{id}/transition to=CLOSED"
        actor: ProductionManager
        preconditions:
          - "every PullListEntry of the production is in RETURNED, DAMAGED, LOST, or CANCELLED (else ERR_OPEN_PULL_LIST)"
          - "every LoadSchedule of the production is in COMPLETE or CANCELLED (else ERR_OPEN_LOAD_SCHEDULE)"
        side_effects: ["increments Production.version by 1"]
      - from: CLOSED
        to: SETTLED
        trigger: "system: fires when the production's SettlementStatement transitions to PAID or RESOLVED"
        actor: system
        preconditions: ["settlement just reached PAID or RESOLVED"]
        side_effects: ["increments Production.version by 1"]
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /api/productions/{id}/transition to=CANCELLED"
        actor: ProductionManager
        preconditions: []
        side_effects: ["cancel cascade (see note)", "increments Production.version by 1"]
        note: "Cancel cascade (applies equally from DRAFT, PLANNING, READY_FOR_LOADIN): (1) every CrewCall in DRAFT/PUBLISHED/CONFIRMED -> CANCELLED; (2) each cancelled call's CrewAssignments in ASSIGNED/CONFIRMED/WORKED -> CANCELLED; (3) every RiggingPoint in RESERVED/UNDER_REVIEW/REJECTED/APPROVED -> RELEASED, recomputing its plot's total_factored_load_kg; (4) every PullListEntry in REQUESTED/RESERVED/PREPPED -> CANCELLED, and each freed asset (status RESERVED or PREPPED) -> AVAILABLE then runs the waitlist promotion scan of calculations.waitlist_promotion; (5) every LoadSchedule in PLANNED/CONFIRMED/AUTHORIZED -> CANCELLED; (6) every SafetyInspection in SCHEDULED/IN_PROGRESS/FAILED -> CANCELLED. Entities already terminal are untouched."
      - from: PLANNING
        to: CANCELLED
        trigger: "POST /api/productions/{id}/transition to=CANCELLED"
        actor: ProductionManager
        preconditions: []
        side_effects: ["cancel cascade (identical to DRAFT -> CANCELLED)", "increments Production.version by 1"]
      - from: READY_FOR_LOADIN
        to: CANCELLED
        trigger: "POST /api/productions/{id}/transition to=CANCELLED"
        actor: ProductionManager
        preconditions: []
        side_effects: ["cancel cascade (identical to DRAFT -> CANCELLED)", "increments Production.version by 1"]
      - from: READY_FOR_LOADIN
        to: PLANNING
        trigger: "system: readiness downgrade when an APPROVED RiggingPoint is released or a FINAL inspection fails while READY"
        actor: system
        preconditions: ["posture recomputed to PARTIAL or BLOCKED after a child mutation"]
        side_effects: ["recompute production.posture", "increments Production.version by 1"]

  - entity: LightingPlot
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /api/plots/{id}/transition to=SUBMITTED"
        actor: ProductionManager
        preconditions:
          - "plot has >= 1 rigging point with status RESERVED, UNDER_REVIEW, or APPROVED (else ERR_EMPTY_PLOT)"
          - "production.status == PLANNING (else ERR_INVALID_STATE)"
        side_effects: ["rejection_reason := null", "increments LightingPlot.version by 1"]
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /api/plots/{id}/transition to=APPROVED"
        actor: StructuralEngineer
        preconditions:
          - "for every bay_index used by this plot's non-RELEASED points: sum of factored_load_kg <= venue.bay_aggregate_limit_kg (else ERR_BAY_OVERLOAD)"
        side_effects:
          - "approved_by_user_id := X-User-ID; approved_at := logical clock"
          - "supersede cascade: any other APPROVED plot of the same production -> SUPERSEDED, and every RiggingPoint on that superseded plot with status RESERVED/UNDER_REVIEW/APPROVED/REJECTED -> RELEASED (which recomputes that plot's total_factored_load_kg to 0)"
          - "recompute production.posture"
          - "increments LightingPlot.version by 1"
      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /api/plots/{id}/transition to=DRAFT with rejection_reason (engineering reject; revision loop)"
        actor: StructuralEngineer
        preconditions: ["rejection_reason present in payload (else ERR_INVALID_REQUEST)"]
        side_effects: ["rejection_reason := payload value", "increments LightingPlot.version by 1"]
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system: another plot of the same production was approved"
        actor: system
        preconditions: ["sibling plot approval"]
        side_effects: ["this plot's non-RELEASED points -> RELEASED", "increments LightingPlot.version by 1"]

  - entity: RiggingPoint
    initial_state: RESERVED
    terminal_states: [RELEASED]
    transitions:
      - from: RESERVED
        to: UNDER_REVIEW
        trigger: "POST /api/rigging-points/{id}/transition to=UNDER_REVIEW"
        actor: RiggingSupervisor
        preconditions:
          - "logical clock <= production.load_in_at minus venue.engineering_submission_lead_hours (else ERR_ENGINEERING_DEADLINE_PASSED)"
          - "plot.status in {SUBMITTED, APPROVED} (else ERR_PLOT_NOT_SUBMITTED)"
        side_effects: ["plot_version_at_submission := plot.version", "increments RiggingPoint.version by 1"]
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /api/rigging-points/{id}/transition to=APPROVED"
        actor: StructuralEngineer
        preconditions:
          - "X-User-ID != point.submitted_by_user_id (else ERR_SOD_VIOLATION)"
          - "plot.version == point.plot_version_at_submission (else ERR_STALE_PLOT_REVISION)"
          - "bay aggregate including this point: sum of factored_load_kg over non-RELEASED points with the same bay_index on the production's currently APPROVED-or-SUBMITTED plots <= venue.bay_aggregate_limit_kg (else ERR_BAY_OVERLOAD)"
        side_effects: ["reviewed_by_user_id := X-User-ID", "recompute production.posture", "increments RiggingPoint.version by 1"]
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /api/rigging-points/{id}/transition to=REJECTED"
        actor: StructuralEngineer
        preconditions: []
        side_effects: ["increments RiggingPoint.version by 1"]
      - from: REJECTED
        to: RESERVED
        trigger: "POST /api/rigging-points/{id}/transition to=RESERVED with deadweight_kg and motor_count (revision loop)"
        actor: RiggingSupervisor
        preconditions: ["recomputed factored_load_kg <= venue.max_point_capacity_kg (else ERR_POINT_OVERLOAD)"]
        side_effects: ["deadweight_kg and motor_count := payload values", "recompute factored_load_kg, utilization, and plot.total_factored_load_kg", "increments RiggingPoint.version by 1"]
      - from: RESERVED
        to: RELEASED
        trigger: "POST /api/rigging-points/{id}/transition to=RELEASED"
        actor: RiggingSupervisor
        preconditions: []
        side_effects: ["recompute plot.total_factored_load_kg", "frees point_label for the venue window", "increments RiggingPoint.version by 1"]
      - from: UNDER_REVIEW
        to: RELEASED
        trigger: "POST /api/rigging-points/{id}/transition to=RELEASED"
        actor: RiggingSupervisor
        preconditions: []
        side_effects: ["recompute plot.total_factored_load_kg", "frees point_label", "increments RiggingPoint.version by 1"]
      - from: REJECTED
        to: RELEASED
        trigger: "POST /api/rigging-points/{id}/transition to=RELEASED"
        actor: RiggingSupervisor
        preconditions: []
        side_effects: ["recompute plot.total_factored_load_kg", "frees point_label", "increments RiggingPoint.version by 1"]
      - from: APPROVED
        to: RELEASED
        trigger: "POST /api/rigging-points/{id}/transition to=RELEASED"
        actor: RiggingSupervisor
        preconditions: []
        side_effects: ["recompute plot.total_factored_load_kg", "frees point_label", "recompute production.posture; if the production was READY_FOR_LOADIN and posture drops below READY, downgrade production -> PLANNING", "increments RiggingPoint.version by 1"]

  - entity: EquipmentAsset
    initial_state: AVAILABLE
    terminal_states: [RETIRED, LOST]
    transitions:
      - from: AVAILABLE
        to: RETIRED
        trigger: "POST /api/assets/{id}/transition to=RETIRED"
        actor: WarehouseChief
        preconditions: []
        side_effects: ["increments EquipmentAsset.version by 1"]
      - from: DAMAGED
        to: AVAILABLE
        trigger: "POST /api/assets/{id}/transition to=AVAILABLE (QC pass)"
        actor: WarehouseChief
        preconditions: []
        side_effects: ["increments EquipmentAsset.version by 1"]
      - from: DAMAGED
        to: RETIRED
        trigger: "POST /api/assets/{id}/transition to=RETIRED (beyond repair)"
        actor: WarehouseChief
        preconditions: []
        side_effects: ["increments EquipmentAsset.version by 1"]
      - from: AVAILABLE
        to: RESERVED
        trigger: "system: pull-list entry reserved (direct or waitlist promotion)"
        actor: system
        preconditions: []
        side_effects: ["increments EquipmentAsset.version by 1"]
      - from: RESERVED
        to: PREPPED
        trigger: "system: pull-list entry prepped"
        actor: system
        preconditions: []
        side_effects: ["increments EquipmentAsset.version by 1"]
      - from: PREPPED
        to: DEPLOYED
        trigger: "system: pull-list entry checked out"
        actor: system
        preconditions: []
        side_effects: ["increments EquipmentAsset.version by 1"]
      - from: RESERVED
        to: AVAILABLE
        trigger: "system: pull-list entry cancelled"
        actor: system
        preconditions: []
        side_effects: ["increments EquipmentAsset.version by 1"]
      - from: PREPPED
        to: AVAILABLE
        trigger: "system: pull-list entry cancelled from PREPPED (production cancel cascade only)"
        actor: system
        preconditions: []
        side_effects: ["increments EquipmentAsset.version by 1"]
      - from: DEPLOYED
        to: AVAILABLE
        trigger: "system: pull-list entry checked in"
        actor: system
        preconditions: []
        side_effects: ["increments EquipmentAsset.version by 1"]
      - from: DEPLOYED
        to: DAMAGED
        trigger: "system: damage report (type DAMAGE) assessed on the deployed entry"
        actor: system
        preconditions: []
        side_effects: ["increments EquipmentAsset.version by 1"]
      - from: DEPLOYED
        to: LOST
        trigger: "system: damage report (type LOSS) assessed on the deployed entry"
        actor: system
        preconditions: []
        side_effects: ["increments EquipmentAsset.version by 1"]

  - entity: PullListEntry
    initial_state: REQUESTED
    terminal_states: [RETURNED, DAMAGED, LOST, CANCELLED]
    transitions:
      - from: REQUESTED
        to: RESERVED
        trigger: "POST /api/pull-list-entries/{id}/transition to=RESERVED"
        actor: WarehouseChief
        preconditions: ["asset.status == AVAILABLE (else ERR_ASSET_NOT_AVAILABLE)"]
        side_effects: ["asset -> RESERVED", "increments PullListEntry.version by 1"]
      - from: REQUESTED
        to: RESERVED
        trigger: "system: waitlist promotion when the asset becomes AVAILABLE"
        actor: system
        preconditions: ["selected per calculations.waitlist_promotion"]
        side_effects: ["asset -> RESERVED", "increments PullListEntry.version by 1"]
      - from: RESERVED
        to: PREPPED
        trigger: "POST /api/pull-list-entries/{id}/transition to=PREPPED with prep_window_start/prep_window_end"
        actor: WarehouseChief
        preconditions: ["prep_window_start and prep_window_end present with prep_window_end > prep_window_start (else ERR_INVALID_REQUEST)"]
        side_effects: ["asset -> PREPPED", "increments PullListEntry.version by 1"]
      - from: PREPPED
        to: OUT
        trigger: "POST /api/pull-list-entries/{id}/transition to=OUT with load_schedule_id"
        actor: WarehouseChief
        preconditions:
          - "load_schedule_id present (else ERR_INVALID_REQUEST)"
          - "referenced LoadSchedule has status AUTHORIZED and direction LOAD_IN (else ERR_SCHEDULE_NOT_AUTHORIZED)"
          - "truck_pack_weight check: recomputed pack_weight_kg including this entry <= truck.capacity_kg (else ERR_TRUCK_OVERLOAD)"
        side_effects: ["out_at := logical clock", "asset -> DEPLOYED", "recompute load_schedule.pack_weight_kg per truck_pack_weight", "increments PullListEntry.version by 1"]
      - from: OUT
        to: RETURNED
        trigger: "POST /api/pull-list-entries/{id}/transition to=RETURNED"
        actor: WarehouseChief
        preconditions: []
        side_effects:
          - "returned_at := logical clock; compute rental_charge_cents per equipment_rental_billing"
          - "asset -> AVAILABLE"
          - "waitlist promotion scan per calculations.waitlist_promotion: the promoted entry -> RESERVED and the asset -> RESERVED again"
          - "increments PullListEntry.version by 1"
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /api/pull-list-entries/{id}/transition to=CANCELLED"
        actor: WarehouseChief
        preconditions: []
        side_effects: ["increments PullListEntry.version by 1"]
      - from: RESERVED
        to: CANCELLED
        trigger: "POST /api/pull-list-entries/{id}/transition to=CANCELLED"
        actor: WarehouseChief
        preconditions: []
        side_effects: ["asset -> AVAILABLE", "waitlist promotion scan per calculations.waitlist_promotion (promoted entry -> RESERVED, asset -> RESERVED)", "increments PullListEntry.version by 1"]
      - from: OUT
        to: DAMAGED
        trigger: "system: a DAMAGE report on this entry is assessed"
        actor: system
        preconditions: []
        side_effects: ["returned_at := assessment clock time; compute rental_charge_cents per equipment_rental_billing (end = returned_at)", "asset -> DAMAGED", "increments PullListEntry.version by 1"]
      - from: OUT
        to: LOST
        trigger: "system: a LOSS report on this entry is assessed"
        actor: system
        preconditions: []
        side_effects: ["returned_at := assessment clock time; compute rental_charge_cents per equipment_rental_billing (end = returned_at)", "asset -> LOST", "increments PullListEntry.version by 1"]

  - entity: CrewCall
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /api/crew-calls/{id}/transition to=PUBLISHED"
        actor: ProductionManager
        preconditions: ["logical clock <= call_start minus venue.crew_call_publish_lead_hours (else ERR_CREW_CALL_LATE)"]
        side_effects: ["increments CrewCall.version by 1"]
      - from: PUBLISHED
        to: CONFIRMED
        trigger: "POST /api/crew-calls/{id}/transition to=CONFIRMED"
        actor: ProductionManager
        preconditions: ["count of assignments with status CONFIRMED >= required_headcount (else ERR_CREW_HEADCOUNT_UNMET)"]
        side_effects: ["increments CrewCall.version by 1"]
      - from: CONFIRMED
        to: COMPLETED
        trigger: "POST /api/crew-calls/{id}/transition to=COMPLETED"
        actor: ProductionManager
        preconditions:
          - "every assignment is in WORKED, NO_SHOW, or CANCELLED (else ERR_INVALID_STATE)"
          - "logical clock >= call_end (else ERR_TOO_EARLY)"
        side_effects:
          - "compute each WORKED assignment's labor_charge_cents per crew_call_labor_cost (per-line rounding)"
          - "labor_cost_cents := sum of per-line rounded charges over WORKED assignments"
          - "each WORKED assignment -> RECONCILED"
          - "increments CrewCall.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /api/crew-calls/{id}/transition to=CANCELLED"
        actor: ProductionManager
        preconditions: []
        side_effects: ["assignments in ASSIGNED/CONFIRMED/WORKED -> CANCELLED", "increments CrewCall.version by 1"]
      - from: PUBLISHED
        to: CANCELLED
        trigger: "POST /api/crew-calls/{id}/transition to=CANCELLED"
        actor: ProductionManager
        preconditions: []
        side_effects: ["assignments in ASSIGNED/CONFIRMED/WORKED -> CANCELLED", "increments CrewCall.version by 1"]
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /api/crew-calls/{id}/transition to=CANCELLED"
        actor: ProductionManager
        preconditions: []
        side_effects: ["assignments in ASSIGNED/CONFIRMED/WORKED -> CANCELLED", "increments CrewCall.version by 1"]

  - entity: CrewAssignment
    initial_state: ASSIGNED
    terminal_states: [RECONCILED, NO_SHOW, CANCELLED]
    transitions:
      - from: ASSIGNED
        to: CONFIRMED
        trigger: "POST /api/crew-assignments/{id}/transition to=CONFIRMED"
        actor: CrewChief
        preconditions: ["X-User-ID == assignment.technician_id (else ERR_NOT_RESOURCE_OWNER)"]
        side_effects: ["increments CrewAssignment.version by 1"]
      - from: CONFIRMED
        to: WORKED
        trigger: "POST /api/crew-assignments/{id}/transition to=WORKED with worked_hours"
        actor: CrewChief
        preconditions: ["X-User-ID == assignment.technician_id (else ERR_NOT_RESOURCE_OWNER)", "0 < worked_hours <= 24 with at most 2 decimal places (else ERR_HOURS_OUT_OF_RANGE)"]
        side_effects: ["worked_hours := payload value", "increments CrewAssignment.version by 1"]
      - from: CONFIRMED
        to: WORKED
        trigger: "POST /api/crew-assignments/{id}/transition to=WORKED with worked_hours (manager entry on behalf)"
        actor: ProductionManager
        preconditions: ["0 < worked_hours <= 24 with at most 2 decimal places (else ERR_HOURS_OUT_OF_RANGE)"]
        side_effects: ["worked_hours := payload value", "increments CrewAssignment.version by 1"]
      - from: ASSIGNED
        to: NO_SHOW
        trigger: "POST /api/crew-assignments/{id}/transition to=NO_SHOW"
        actor: ProductionManager
        preconditions: []
        side_effects: ["increments CrewAssignment.version by 1"]
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /api/crew-assignments/{id}/transition to=NO_SHOW"
        actor: ProductionManager
        preconditions: []
        side_effects: ["increments CrewAssignment.version by 1"]
      - from: WORKED
        to: RECONCILED
        trigger: "system: parent crew call completed"
        actor: system
        preconditions: []
        side_effects: ["labor_charge_cents computed per crew_call_labor_cost", "increments CrewAssignment.version by 1"]

  - entity: PowerPlan
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /api/power-plans/{id}/transition to=SUBMITTED"
        actor: ProductionManager
        preconditions:
          - "compute power_distribution_sizing; when generator_required: required_kva must map to a tier (required_kva <= 400 else ERR_GENERATOR_CAPACITY_EXCEEDED)"
          - "when not generator_required: every phase's watts <= venue.house_power_amps_per_phase x 208 (else ERR_HOUSE_POWER_OVERLOAD)"
          - "max_phase_imbalance_pct <= 0.1500 (else ERR_PHASE_IMBALANCE)"
        side_effects: ["persist total_load_watts, required_kva, selected_generator_tier_kva, max_phase_imbalance_pct", "increments PowerPlan.version by 1"]
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /api/power-plans/{id}/transition to=APPROVED"
        actor: SafetyInspector
        preconditions: ["production.status == PLANNING (else ERR_INVALID_STATE)"]
        side_effects: ["any other APPROVED power plan of this production -> SUPERSEDED", "recompute production.posture", "increments PowerPlan.version by 1"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /api/power-plans/{id}/transition to=REJECTED"
        actor: SafetyInspector
        preconditions: []
        side_effects: ["increments PowerPlan.version by 1"]
      - from: REJECTED
        to: DRAFT
        trigger: "POST /api/power-plans/{id}/transition to=DRAFT with new phase/feeder/generator fields (revision loop)"
        actor: ProductionManager
        preconditions: []
        side_effects: ["input fields := payload values", "computed fields reset to null until next submit", "increments PowerPlan.version by 1"]
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system: another power plan of the same production was approved"
        actor: system
        preconditions: []
        side_effects: ["increments PowerPlan.version by 1"]

  - entity: LoadSchedule
    initial_state: PLANNED
    terminal_states: [COMPLETE, CANCELLED]
    transitions:
      - from: PLANNED
        to: CONFIRMED
        trigger: "POST /api/load-schedules/{id}/transition to=CONFIRMED"
        actor: ProductionManager
        preconditions: ["no other LoadSchedule with status CONFIRMED or AUTHORIZED at the same venue with the same dock_door_index whose half-open window [window_start, window_end) intersects this one (touching endpoints allowed); violation -> ERR_DOCK_WINDOW_CONFLICT"]
        side_effects: ["increments LoadSchedule.version by 1"]
      - from: CONFIRMED
        to: AUTHORIZED
        trigger: "POST /api/load-schedules/{id}/transition to=AUTHORIZED"
        actor: ProductionManager
        preconditions: ["direction LOAD_IN requires production.status in {READY_FOR_LOADIN, LOAD_IN}; direction LOAD_OUT requires production.status in {SHOW_COMPLETE, LOAD_OUT} (else ERR_SCHEDULE_NOT_AUTHORIZED)"]
        side_effects: ["increments LoadSchedule.version by 1"]
      - from: AUTHORIZED
        to: COMPLETE
        trigger: "POST /api/load-schedules/{id}/transition to=COMPLETE"
        actor: ProductionManager
        preconditions: []
        side_effects: ["increments LoadSchedule.version by 1"]
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /api/load-schedules/{id}/transition to=CANCELLED"
        actor: ProductionManager
        preconditions: []
        side_effects: ["increments LoadSchedule.version by 1"]
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /api/load-schedules/{id}/transition to=CANCELLED"
        actor: ProductionManager
        preconditions: []
        side_effects: ["increments LoadSchedule.version by 1"]

  - entity: SafetyInspection
    initial_state: SCHEDULED
    terminal_states: [PASSED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /api/inspections/{id}/transition to=IN_PROGRESS"
        actor: SafetyInspector
        preconditions:
          - "type RIGGING: every point on the production's currently APPROVED plot is APPROVED (else ERR_RIGGING_NOT_APPROVED)"
          - "type ELECTRICAL: production has an APPROVED power plan (else ERR_POWER_PLAN_NOT_APPROVED)"
          - "type FINAL: production.status == LOAD_IN (else ERR_INVALID_STATE) and the production's latest-attempt RIGGING and ELECTRICAL inspections are both PASSED (else ERR_PREREQUISITE_INSPECTION_MISSING)"
        side_effects: ["inspector_user_id := X-User-ID", "increments SafetyInspection.version by 1"]
      - from: IN_PROGRESS
        to: PASSED
        trigger: "POST /api/inspections/{id}/transition to=PASSED"
        actor: SafetyInspector
        preconditions:
          - "X-User-ID == inspection.inspector_user_id (continuity; else ERR_NOT_RESOURCE_OWNER)"
          - "type FINAL only: X-User-ID must differ from the reviewed_by_user_id of every rigging point on the production's currently APPROVED plot (else ERR_SOD_VIOLATION)"
        side_effects:
          - "type FINAL: production LOAD_IN -> SHOW_READY"
          - "increments SafetyInspection.version by 1"
      - from: IN_PROGRESS
        to: FAILED
        trigger: "POST /api/inspections/{id}/transition to=FAILED with findings"
        actor: SafetyInspector
        preconditions: ["findings present (else ERR_INVALID_REQUEST)"]
        side_effects: ["if production.status == SHOW_READY, downgrade production -> LOAD_IN", "recompute production.posture", "increments SafetyInspection.version by 1"]
      - from: FAILED
        to: SCHEDULED
        trigger: "POST /api/inspections/{id}/transition to=SCHEDULED (re-inspection loop)"
        actor: ProductionManager
        preconditions: []
        side_effects: ["attempt_no += 1", "inspector_user_id := null", "findings := null", "increments SafetyInspection.version by 1"]

  - entity: DamageReport
    initial_state: FILED
    terminal_states: [CHARGED, WAIVED]
    transitions:
      - from: FILED
        to: ASSESSED
        trigger: "POST /api/damage-reports/{id}/assess"
        actor: WarehouseChief
        preconditions:
          - "report_type LOSS requires valuation_method DEPRECIATED (else ERR_VALUATION_METHOD_INVALID)"
          - "valuation_method REPAIR_QUOTE requires repair_quote_cents (else ERR_REPAIR_QUOTE_REQUIRED); valuation_method DEPRECIATED forbids repair_quote_cents (else ERR_INVALID_REQUEST)"
        side_effects:
          - "compute assessed_charge_cents per damage_valuation"
          - "entry OUT -> DAMAGED (report_type DAMAGE) or -> LOST (report_type LOSS); asset -> DAMAGED or LOST; entry.rental_charge_cents computed with end = assessment clock"
          - "increments DamageReport.version by 1"
      - from: ASSESSED
        to: CHARGED
        trigger: "POST /api/damage-reports/{id}/transition to=CHARGED"
        actor: WarehouseChief
        preconditions: ["the production's SettlementStatement exists and is DRAFT (else ERR_SETTLEMENT_NOT_DRAFT)"]
        side_effects: ["settlement.damage_total_cents += assessed_charge_cents; settlement.grand_total_cents recomputed", "increments DamageReport.version by 1", "increments SettlementStatement.version by 1"]
      - from: ASSESSED
        to: WAIVED
        trigger: "POST /api/damage-reports/{id}/transition to=WAIVED"
        actor: ProductionManager
        preconditions: []
        side_effects: ["increments DamageReport.version by 1"]
      - from: CHARGED
        to: WAIVED
        trigger: "POST /api/damage-reports/{id}/transition to=WAIVED (compensation)"
        actor: ProductionManager
        preconditions: ["settlement.status == DRAFT (else ERR_SETTLEMENT_NOT_DRAFT)"]
        side_effects: ["settlement.damage_total_cents -= assessed_charge_cents; settlement.grand_total_cents recomputed", "increments DamageReport.version by 1", "increments SettlementStatement.version by 1"]

  - entity: SettlementStatement
    initial_state: DRAFT
    terminal_states: [RESOLVED, PAID]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /api/settlements/{id}/transition to=ISSUED"
        actor: ProductionManager
        preconditions: ["every DamageReport of the production is in CHARGED or WAIVED (else ERR_UNRESOLVED_DAMAGE_REPORTS)"]
        side_effects: ["recompute damage_total_cents (CHARGED only) and grand_total_cents as FINAL variant; provisional_* fields remain frozen", "increments SettlementStatement.version by 1"]
      - from: ISSUED
        to: DISPUTED
        trigger: "POST /api/settlements/{id}/transition to=DISPUTED"
        actor: ClientContact
        preconditions: []
        side_effects: ["increments SettlementStatement.version by 1"]
      - from: DISPUTED
        to: RESOLVED
        trigger: "POST /api/settlements/{id}/transition to=RESOLVED with dispute_adjustment_cents"
        actor: ProductionManager
        preconditions: ["abs(dispute_adjustment_cents) <= damage_total_cents (else ERR_ADJUSTMENT_OUT_OF_RANGE)"]
        side_effects: ["grand_total_cents += dispute_adjustment_cents", "production CLOSED -> SETTLED", "increments SettlementStatement.version by 1"]
      - from: ISSUED
        to: PAID
        trigger: "POST /api/settlements/{id}/transition to=PAID"
        actor: ProductionManager
        preconditions: []
        side_effects: ["production CLOSED -> SETTLED", "increments SettlementStatement.version by 1"]

concurrency_rules:
  - rule_id: plot-create-stale-production
    parent_entity: Production
    write_endpoint: "POST /api/productions/{id}/plots"
    occ_field: "expected_production_version"
    description: |
      Creating a LightingPlot against a Production whose version has advanced
      since the client last observed it is rejected. A new plot supersedes the
      currently APPROVED plot on approval, so a client holding a stale view of
      the production must re-read before drafting; the OCC check on
      Production.version is what rejects the stale write.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: point-reserve-stale-plot
    parent_entity: LightingPlot
    write_endpoint: "POST /api/plots/{id}/rigging-points"
    occ_field: "expected_plot_version"
    description: |
      Reserving a RiggingPoint against a LightingPlot whose version has
      advanced since the client last observed it is rejected: every point
      reservation mutates the plot (total_factored_load_kg recompute bumps
      plot.version), so a client reserving from a stale load picture must
      re-read the plot before adding load.
    error_id: ERR_STALE_VERSION
    http_status: 412

calculations:
  - name: rigging_point_factored_load
    trigger: "on RiggingPoint create and on REJECTED -> RESERVED revise"
    algorithm: threshold
    formula: |
      base = deadweight_kg * DYNAMIC_FACTOR[hang_type]
      motors = motor_count * MOTOR_SELF_WEIGHT_KG
      if hang_type == BRIDLE:
          factored_load_kg = (base + motors) * BRIDLE_UNCERTAINTY
      else:
          factored_load_kg = base + motors
      utilization = factored_load_kg / venue.max_point_capacity_kg
      Point capacity check: factored_load_kg <= venue.max_point_capacity_kg
      (equality passes; strictly greater fails with ERR_POINT_OVERLOAD).
    input_set: "the RiggingPoint's own deadweight_kg, hang_type, motor_count; the venue's max_point_capacity_kg"
    constants:
      DYNAMIC_FACTOR_STRAIGHT: 1.10
      DYNAMIC_FACTOR_BRIDLE: 1.10
      DYNAMIC_FACTOR_DEAD_HANG: 1.00
      MOTOR_SELF_WEIGHT_KG: 20
      BRIDLE_UNCERTAINTY: 1.15
    precision: "factored_load_kg: 2 decimal places, round_half_up; utilization: 4 decimal places, round_half_up"

  - name: bay_aggregate_load_check
    trigger: "on LightingPlot SUBMITTED -> APPROVED and on RiggingPoint UNDER_REVIEW -> APPROVED"
    algorithm: aggregation
    formula: |
      For each bay_index present among the included points:
          bay_sum = sum(factored_load_kg) over included points with that bay_index
          require bay_sum <= venue.bay_aggregate_limit_kg (equality passes; strictly greater fails with ERR_BAY_OVERLOAD)
    input_set: "all RiggingPoints whose plot belongs to the same production, whose plot.status is in {SUBMITTED, APPROVED}, and whose own status is in {RESERVED, UNDER_REVIEW, APPROVED, REJECTED}; RELEASED points and points on SUPERSEDED plots are excluded"
    constants: {}
    precision: "sum at 2 decimal places, round_half_up per point before summing"

  - name: power_distribution_sizing
    trigger: "on PowerPlan DRAFT -> SUBMITTED (computed fields persist only when every check passes)"
    algorithm: constraint_propagation
    formula: |
      PINNED EVALUATION ORDER (loss depends on subtotal; tier depends on loss-inclusive total):
      1. subtotal_watts = phase_l1_watts + phase_l2_watts + phase_l3_watts
      2. feeder_loss_watts = subtotal_watts * FEEDER_LOSS_PCT_PER_100M * (feeder_length_m / 100)
      3. total_load_watts = subtotal_watts + feeder_loss_watts
      4. generator branch (generator_required == true):
           required_kva = total_load_watts / (POWER_FACTOR * DERATING * 1000)
           selected_generator_tier_kva = smallest t in GENERATOR_TIERS_KVA with t >= required_kva
           if required_kva > max(GENERATOR_TIERS_KVA): fail ERR_GENERATOR_CAPACITY_EXCEEDED
      5. house branch (generator_required == false):
           for each phase p: require phase_p_watts <= venue.house_power_amps_per_phase * VOLTAGE
           else fail ERR_HOUSE_POWER_OVERLOAD
      6. imbalance = (max(phases) - min(phases)) / max(phases); 0 when all phases are 0
           require imbalance <= MAX_IMBALANCE_PCT else fail ERR_PHASE_IMBALANCE
    input_set: "the PowerPlan's phase watts, feeder_length_m, generator_required; venue.house_power_amps_per_phase"
    constants:
      FEEDER_LOSS_PCT_PER_100M: 0.03
      POWER_FACTOR: 0.9
      DERATING: 0.8
      VOLTAGE: 208
      MAX_IMBALANCE_PCT: 0.15
      GENERATOR_TIERS_KVA: [45, 60, 100, 150, 200, 300, 400]
    precision: "total_load_watts: 2 decimal places, round_half_up; required_kva: 2 decimal places, round_half_up; max_phase_imbalance_pct: 4 decimal places, round_half_up"

  - name: crew_call_labor_cost
    trigger: "on CrewCall CONFIRMED -> COMPLETED, per assignment in WORKED"
    algorithm: chronological
    formula: |
      billable_hours = max(worked_hours, venue.min_call_hours)
      PER-LINE ROUNDING (pinned): each assignment's charge is rounded to whole
      cents (round_half_up) BEFORE summing into CrewCall.labor_cost_cents.
      Summing unrounded lines and rounding once is a different, forbidden order.
      Variant UNION (venue.union_ruleset in {IATSE, TEAMSTERS}):
        st_h  = min(billable_hours, venue.ot1_threshold_hours)
        ot1_h = min(max(billable_hours - venue.ot1_threshold_hours, 0), venue.ot2_threshold_hours - venue.ot1_threshold_hours)
        ot2_h = max(billable_hours - venue.ot2_threshold_hours, 0)
        meal_penalty_h = 2 if (venue.union_ruleset == IATSE and worked_hours > MEAL_WINDOW_HOURS) else 0
        paid_hours = st_h + 1.5 * ot1_h + 2 * ot2_h + meal_penalty_h
      Variant NON_UNION (venue.union_ruleset == NON_UNION):
        st_h  = min(billable_hours, NON_UNION_ST_HOURS)
        ot1_h = max(billable_hours - NON_UNION_ST_HOURS, 0)
        ot2_h = 0
        meal_penalty_h = 0
        paid_hours = st_h + 1.5 * ot1_h
      labor_charge_cents = round_half_up(hourly_rate_cents * paid_hours)   # integer cents, per assignment
      crew_call.labor_cost_cents = sum of rounded labor_charge_cents over WORKED assignments
    input_set: "assignments of the call with status WORKED (NO_SHOW and CANCELLED excluded); technician.hourly_rate_cents; venue ruleset fields"
    constants:
      MEAL_WINDOW_HOURS: 6
      NON_UNION_ST_HOURS: 10
    precision: "whole cents, round_half_up, applied per assignment line before summation"
    variants:
      - name: union_ruleset
        when: "venue.union_ruleset is IATSE or TEAMSTERS"
        difference: "OT1 starts at venue.ot1_threshold_hours, DT at ot2_threshold_hours; IATSE adds a 2-hour double-time meal penalty when worked_hours > 6; TEAMSTERS omits the meal penalty"
      - name: non_union_ruleset
        when: "venue.union_ruleset is NON_UNION"
        difference: "straight time up to 10 hours, 1.5x beyond, no double-time tier, no meal penalty"

  - name: equipment_rental_billing
    trigger: "on PullListEntry OUT -> RETURNED, and on DamageReport FILED -> ASSESSED for an OUT entry (billing end = returned_at)"
    algorithm: tiered_pricing
    formula: |
      billable_days = number of calendar dates touched by [date(out_at), date(returned_at)], BOTH endpoints inclusive
      (same-day return = 1 day)
      days 1..3  bill at 1.00 * daily_rate_cents each
      days 4..7  bill at 0.50 * daily_rate_cents each
      days 8..n  bill at 0.25 * daily_rate_cents each
      rental_charge_cents = round_half_up(sum of per-day amounts)
    input_set: "the single entry's out_at, returned_at, and asset.daily_rate_cents"
    constants:
      TIER1_DAYS: 3
      TIER1_FACTOR: 1.0
      TIER2_DAYS: 7
      TIER2_FACTOR: 0.5
      TIER3_FACTOR: 0.25
    precision: "whole cents, round_half_up, applied once per entry after summing per-day amounts"

  - name: damage_valuation
    trigger: "on DamageReport FILED -> ASSESSED"
    algorithm: decay_function
    formula: |
      Variant DEPRECIATED (mandatory for LOSS, optional for DAMAGE):
        age_years = full 365.25-day anniversaries elapsed between asset.acquired_at and the logical clock (floor)
        factor = max(DEPRECIATION_FLOOR, 1.00 - DEPRECIATION_PER_YEAR * age_years)
        assessed_charge_cents = round_half_up(asset.replacement_cost_cents * factor)
      Variant REPAIR_QUOTE (DAMAGE only):
        assessed_charge_cents = round_half_up(repair_quote_cents * (1 + DIMINUTION_PCT))
    input_set: "the report's valuation_method and repair_quote_cents; the asset's replacement_cost_cents and acquired_at; logical clock"
    constants:
      DEPRECIATION_PER_YEAR: 0.10
      DEPRECIATION_FLOOR: 0.20
      DIMINUTION_PCT: 0.15
    precision: "whole cents, round_half_up"
    variants:
      - name: depreciated_value
        when: "valuation_method == DEPRECIATED (always for LOSS)"
        difference: "charge derives from replacement_cost_cents decayed 10% per full year with a 20% floor"
      - name: repair_quote
        when: "valuation_method == REPAIR_QUOTE (DAMAGE reports only)"
        difference: "charge derives from the quoted repair cost uplifted 15% for diminution of value, independent of asset age"

  - name: truck_pack_weight
    trigger: "on every PullListEntry PREPPED -> OUT carrying load_schedule_id"
    algorithm: aggregation
    formula: |
      pack_weight_kg = round_half_up(sum(asset.weight_kg over the schedule's OUT entries) * (1 + DUNNAGE_PCT), 2dp)
      require pack_weight_kg <= truck.capacity_kg (equality passes; strictly greater fails with ERR_TRUCK_OVERLOAD)
    input_set: "all PullListEntries with status OUT whose load_schedule_id == this schedule; the truck's capacity_kg"
    constants:
      DUNNAGE_PCT: 0.02
    precision: "2 decimal places, round_half_up"

  - name: settlement_totals
    trigger: "on settlement creation (DRAFT, captures provisional variant), on every charge/waive mutation, and on DRAFT -> ISSUED (FINAL variant)"
    algorithm: aggregation
    formula: |
      labor_total_cents      = sum(CrewCall.labor_cost_cents) over the production's calls with status COMPLETED
      equipment_total_cents  = sum(PullListEntry.rental_charge_cents) over entries in {RETURNED, DAMAGED, LOST}
      damage_total_cents     = sum(DamageReport.assessed_charge_cents) over reports in CHARGED
      grand_total_cents      = labor_total_cents + equipment_total_cents + damage_total_cents (+ dispute_adjustment_cents once RESOLVED)
      PROVISIONAL VARIANT (frozen at creation):
      provisional_damage_cents       = sum(assessed_charge_cents) over reports in {ASSESSED, CHARGED} at creation time
      provisional_grand_total_cents  = labor_total_cents + equipment_total_cents + provisional_damage_cents
      FINAL VARIANT (at ISSUED): damage_total_cents counts CHARGED only.
      Rounding order (pinned): all inputs are already integer cents; sums are integer
      arithmetic; no re-rounding at the settlement level.
    input_set: "the production's COMPLETED crew calls, terminally-billed pull list entries, and damage reports; inclusion sets pinned above per variant"
    constants: {}
    precision: "integer cents; no rounding at aggregate level"
    variants:
      - name: provisional
        when: "settlement creation (DRAFT)"
        difference: "damage inclusion set is {ASSESSED, CHARGED} at creation time; frozen snapshot, never recomputed"
      - name: final
        when: "settlement DRAFT -> ISSUED"
        difference: "damage inclusion set is {CHARGED} only; recomputed live on every charge/waive until issued"

  - name: production_readiness_posture
    trigger: "recomputed on every mutation of the production's plots, rigging points, power plans, pull list entries, or crew calls"
    algorithm: constraint_propagation
    formula: |
      posture = READY iff ALL of:
        (a) the production has a LightingPlot with status APPROVED
        (b) that APPROVED plot has >= 1 RiggingPoint with status APPROVED, and every
            RiggingPoint on it is in {APPROVED, RELEASED}
        (c) the production has a PowerPlan with status APPROVED
        (d) no PullListEntry of the production is in {REQUESTED, RESERVED}
        (e) no CrewCall of the production is in {DRAFT, PUBLISHED}
      posture = BLOCKED iff condition (a) fails
      posture = PARTIAL otherwise
    input_set: "the production's plots (status), rigging points on the APPROVED plot (status), power plans (status), pull list entries (status), crew calls (status)"
    constants: {}
    precision: "enum; deterministic"

  - name: waitlist_promotion
    trigger: "whenever an EquipmentAsset transitions into AVAILABLE from RESERVED, PREPPED, or DEPLOYED (entry cancel or check-in)"
    algorithm: aggregation
    formula: |
      candidate set = PullListEntries with status REQUESTED whose asset_id == this asset
      and whose production.status == PLANNING
      if empty: no promotion
      else: promote exactly one entry — earliest created_at ASC (tie-break never reaches id;
      created_at at 3-fractional-digit precision is the final key) — entry -> RESERVED,
      asset -> RESERVED
    input_set: "PullListEntries in REQUESTED for this asset; their productions' status"
    constants: {}
    precision: "selector determinism: eligibility filter + created_at ASC ordering; empty-set fallback is no-op"

validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "X-User-Role is listed in the endpoint's roles; for transition endpoints the role must also own the requested `to` transition per the state machine's actor", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 3, category: auth, check: "Segregation of duties: rigging point approver != point.submitted_by_user_id; FINAL inspection passer != any reviewed_by_user_id on the production's current APPROVED plot", error_id: ERR_SOD_VIOLATION, http_status: 403, applies_to: "POST /api/rigging-points/{id}/transition (to=APPROVED), POST /api/inspections/{id}/transition (to=PASSED, type FINAL)" }
  - { priority: 4, category: auth, check: "Ownership: CrewChief confirming or reporting hours must have X-User-ID == assignment.technician_id; SafetyInspector passing/failing must equal inspection.inspector_user_id", error_id: ERR_NOT_RESOURCE_OWNER, http_status: 403, applies_to: "POST /api/crew-assignments/{id}/transition, POST /api/inspections/{id}/transition (to=PASSED, to=FAILED)" }
  - { priority: 5, category: existence, check: "Request body schema: required fields present, enum members valid, numeric ranges valid, window end > start (productions require load_in_at < show_at < load_out_at); unique-attribute collisions on Technician.union_card_no, EquipmentAsset.asset_tag, Truck.plate_no", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all write endpoints" }
  - { priority: 6, category: existence, check: "Path and body resource ids resolve (venue, production, plot, point, asset, entry, call, assignment, plan, truck, schedule, inspection, report, settlement), validated left-to-right", error_id: ERR_RESOURCE_NOT_FOUND, http_status: 404, applies_to: "all parameterized endpoints" }
  - { priority: 7, category: state, check: "Current state terminal for any further transition", error_id: ERR_ALREADY_TERMINAL, http_status: 409, applies_to: "all transition endpoints" }
  - { priority: 8, category: state, check: "Requested `to` is a declared transition from the entity's current state for this actor; child-creation endpoints whose parent must be in a specific state (plots/points/pull-list/crew-calls/power-plans/load-schedules require PLANNING; inspections require PLANNING or LOAD_IN; damage reports require entry OUT; settlement requires CLOSED)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all transition endpoints and state-gated creation endpoints" }
  - { priority: 9, category: state, check: "OCC: expected_production_version matches Production.version (plot creation); expected_plot_version matches LightingPlot.version (point reservation)", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /api/productions/{id}/plots, POST /api/plots/{id}/rigging-points" }
  - { priority: 10, category: business_safety, check: "RiggingPoint factored_load_kg <= venue.max_point_capacity_kg (create and revise)", error_id: ERR_POINT_OVERLOAD, http_status: 422, applies_to: "POST /api/plots/{id}/rigging-points, POST /api/rigging-points/{id}/transition (to=RESERVED)" }
  - { priority: 11, category: business_safety, check: "Bay aggregate sum of factored loads <= venue.bay_aggregate_limit_kg", error_id: ERR_BAY_OVERLOAD, http_status: 422, applies_to: "POST /api/plots/{id}/transition (to=APPROVED), POST /api/rigging-points/{id}/transition (to=APPROVED)" }
  - { priority: 12, category: business_safety, check: "Power plan: generator tier exists for required_kva", error_id: ERR_GENERATOR_CAPACITY_EXCEEDED, http_status: 422, applies_to: "POST /api/power-plans/{id}/transition (to=SUBMITTED)" }
  - { priority: 13, category: business_safety, check: "Power plan house branch: each phase <= house_power_amps_per_phase x 208", error_id: ERR_HOUSE_POWER_OVERLOAD, http_status: 422, applies_to: "POST /api/power-plans/{id}/transition (to=SUBMITTED)" }
  - { priority: 14, category: business_safety, check: "Power plan phase imbalance <= 15%", error_id: ERR_PHASE_IMBALANCE, http_status: 422, applies_to: "POST /api/power-plans/{id}/transition (to=SUBMITTED)" }
  - { priority: 15, category: business_safety, check: "Truck pack weight including new entry <= truck.capacity_kg", error_id: ERR_TRUCK_OVERLOAD, http_status: 422, applies_to: "POST /api/pull-list-entries/{id}/transition (to=OUT)" }
  - { priority: 16, category: business_constraint, check: "point_label not held by a non-RELEASED point at the same venue whose production occupancy window intersects (closed interval)", error_id: ERR_POINT_ALREADY_RESERVED, http_status: 409, applies_to: "POST /api/plots/{id}/rigging-points" }
  - { priority: 17, category: business_constraint, check: "Venue occupancy: new production [load_in_at, load_out_at] (closed) must not intersect another non-CANCELLED production at the same venue", error_id: ERR_VENUE_DOUBLE_BOOKED, http_status: 409, applies_to: "POST /api/productions" }
  - { priority: 18, category: business_constraint, check: "Dock door window: no CONFIRMED/AUTHORIZED schedule at same venue + dock_door_index with intersecting half-open window", error_id: ERR_DOCK_WINDOW_CONFLICT, http_status: 409, applies_to: "POST /api/load-schedules/{id}/transition (to=CONFIRMED)" }
  - { priority: 19, category: business_constraint, check: "dock_door_index < venue.dock_doors", error_id: ERR_DOCK_DOOR_INVALID, http_status: 422, applies_to: "POST /api/productions/{id}/load-schedules" }
  - { priority: 20, category: business_constraint, check: "Technician turnaround: for any other assignment of the same technician in {ASSIGNED, CONFIRMED, WORKED}, gap between call windows must be >= venue.turnaround_min_hours (exactly equal passes)", error_id: ERR_TECHNICIAN_TURNAROUND, http_status: 409, applies_to: "POST /api/crew-calls/{id}/assignments" }
  - { priority: 21, category: business_constraint, check: "Technician classification matches call department mapping (LIGHTING<->LIGHTING_TECH, RIGGING<->RIGGER, STAGEHANDS<->STAGEHAND)", error_id: ERR_CLASSIFICATION_MISMATCH, http_status: 422, applies_to: "POST /api/crew-calls/{id}/assignments" }
  - { priority: 22, category: business_constraint, check: "No other non-terminal (FILED/ASSESSED) damage report exists for the same pull list entry", error_id: ERR_DUPLICATE_DAMAGE_REPORT, http_status: 409, applies_to: "POST /api/productions/{id}/damage-reports" }
  - { priority: 23, category: business_constraint, check: "No SettlementStatement exists yet for the production", error_id: ERR_SETTLEMENT_EXISTS, http_status: 409, applies_to: "POST /api/productions/{id}/settlement" }
  - { priority: 24, category: business_temporal, check: "Engineering submission at or before load_in_at - engineering_submission_lead_hours", error_id: ERR_ENGINEERING_DEADLINE_PASSED, http_status: 422, applies_to: "POST /api/rigging-points/{id}/transition (to=UNDER_REVIEW)" }
  - { priority: 25, category: business_temporal, check: "Crew call publish at or before call_start - crew_call_publish_lead_hours", error_id: ERR_CREW_CALL_LATE, http_status: 422, applies_to: "POST /api/crew-calls/{id}/transition (to=PUBLISHED)" }
  - { priority: 26, category: business_temporal, check: "Clock gates: begin LOAD_IN requires clock >= load_in_at; SHOW_COMPLETE requires clock >= show_at; call completion requires clock >= call_end", error_id: ERR_TOO_EARLY, http_status: 422, applies_to: "POST /api/productions/{id}/transition, POST /api/crew-calls/{id}/transition" }
  - { priority: 27, category: business_referential, check: "Plot submit requires >= 1 rigging point in RESERVED/UNDER_REVIEW/APPROVED", error_id: ERR_EMPTY_PLOT, http_status: 422, applies_to: "POST /api/plots/{id}/transition (to=SUBMITTED)" }
  - { priority: 28, category: business_referential, check: "Engineering review requires plot SUBMITTED or APPROVED", error_id: ERR_PLOT_NOT_SUBMITTED, http_status: 409, applies_to: "POST /api/rigging-points/{id}/transition (to=UNDER_REVIEW)" }
  - { priority: 29, category: business_referential, check: "Point approval requires plot.version == plot_version_at_submission (version-pinning)", error_id: ERR_STALE_PLOT_REVISION, http_status: 409, applies_to: "POST /api/rigging-points/{id}/transition (to=APPROVED)" }
  - { priority: 30, category: business_referential, check: "Production READY gate: posture == READY", error_id: ERR_PRODUCTION_NOT_READY, http_status: 409, applies_to: "POST /api/productions/{id}/transition (to=READY_FOR_LOADIN)" }
  - { priority: 31, category: business_referential, check: "Reserve requires asset AVAILABLE; pull creation requires asset not RETIRED/LOST/DAMAGED", error_id: ERR_ASSET_NOT_AVAILABLE, http_status: 409, applies_to: "POST /api/pull-list-entries/{id}/transition (to=RESERVED), POST /api/productions/{id}/pull-list-entries" }
  - { priority: 32, category: business_referential, check: "Check-out requires an AUTHORIZED LOAD_IN schedule; schedule authorization requires the production state matching direction", error_id: ERR_SCHEDULE_NOT_AUTHORIZED, http_status: 409, applies_to: "POST /api/pull-list-entries/{id}/transition (to=OUT), POST /api/load-schedules/{id}/transition (to=AUTHORIZED)" }
  - { priority: 33, category: business_referential, check: "Crew call confirm requires confirmed assignments >= required_headcount", error_id: ERR_CREW_HEADCOUNT_UNMET, http_status: 409, applies_to: "POST /api/crew-calls/{id}/transition (to=CONFIRMED)" }
  - { priority: 34, category: business_referential, check: "Production CLOSED requires all pull entries terminal (RETURNED/DAMAGED/LOST/CANCELLED)", error_id: ERR_OPEN_PULL_LIST, http_status: 409, applies_to: "POST /api/productions/{id}/transition (to=CLOSED)" }
  - { priority: 35, category: business_referential, check: "Production CLOSED requires all load schedules COMPLETE/CANCELLED", error_id: ERR_OPEN_LOAD_SCHEDULE, http_status: 409, applies_to: "POST /api/productions/{id}/transition (to=CLOSED)" }
  - { priority: 36, category: business_referential, check: "FINAL inspection begin requires the production's latest-attempt RIGGING and ELECTRICAL inspections both PASSED", error_id: ERR_PREREQUISITE_INSPECTION_MISSING, http_status: 409, applies_to: "POST /api/inspections/{id}/transition (to=IN_PROGRESS, type FINAL)" }
  - { priority: 37, category: business_referential, check: "RIGGING inspection begin requires every point on the current APPROVED plot APPROVED", error_id: ERR_RIGGING_NOT_APPROVED, http_status: 409, applies_to: "POST /api/inspections/{id}/transition (to=IN_PROGRESS, type RIGGING)" }
  - { priority: 38, category: business_referential, check: "ELECTRICAL inspection begin requires an APPROVED power plan", error_id: ERR_POWER_PLAN_NOT_APPROVED, http_status: 409, applies_to: "POST /api/inspections/{id}/transition (to=IN_PROGRESS, type ELECTRICAL)" }
  - { priority: 39, category: business_referential, check: "Damage charge or waive-from-CHARGED requires the production's settlement in DRAFT", error_id: ERR_SETTLEMENT_NOT_DRAFT, http_status: 409, applies_to: "POST /api/damage-reports/{id}/transition (to=CHARGED, to=WAIVED)" }
  - { priority: 40, category: business_referential, check: "Settlement issue requires every damage report in CHARGED or WAIVED", error_id: ERR_UNRESOLVED_DAMAGE_REPORTS, http_status: 409, applies_to: "POST /api/settlements/{id}/transition (to=ISSUED)" }
  - { priority: 41, category: business_fiscal, check: "LOSS reports accept only valuation_method DEPRECIATED", error_id: ERR_VALUATION_METHOD_INVALID, http_status: 422, applies_to: "POST /api/damage-reports/{id}/assess" }
  - { priority: 42, category: business_fiscal, check: "REPAIR_QUOTE valuation requires repair_quote_cents", error_id: ERR_REPAIR_QUOTE_REQUIRED, http_status: 422, applies_to: "POST /api/damage-reports/{id}/assess" }
  - { priority: 43, category: business_fiscal, check: "abs(dispute_adjustment_cents) <= damage_total_cents", error_id: ERR_ADJUSTMENT_OUT_OF_RANGE, http_status: 422, applies_to: "POST /api/settlements/{id}/transition (to=RESOLVED)" }
  - { priority: 44, category: business_fiscal, check: "worked_hours within (0, 24] at <= 2 decimal places (evaluated after state checks so a stale-state call reports its state error first)", error_id: ERR_HOURS_OUT_OF_RANGE, http_status: 422, applies_to: "POST /api/crew-assignments/{id}/transition (to=WORKED)" }

endpoints:
  - { method: POST, path: "/api/venues", description: "Register a venue with its structural, power, dock, and union-rule parameters", roles: [ProductionManager], code: 201, input: [name, union_ruleset, max_point_capacity_kg, bay_aggregate_limit_kg, house_power_amps_per_phase, dock_doors, "min_call_hours?", "ot1_threshold_hours?", "ot2_threshold_hours?", "turnaround_min_hours?", "crew_call_publish_lead_hours?", "engineering_submission_lead_hours?"], output: Venue, side_effects: [] }
  - { method: GET, path: "/api/venues", description: "List venues (paginated)", roles: [PlatformAdmin, ProductionManager, RiggingSupervisor, StructuralEngineer, WarehouseChief, SafetyInspector, CrewChief, ClientContact], code: 200, input: ["limit?", "offset?"], output: "Venue[]", side_effects: [] }
  - { method: GET, path: "/api/venues/{id}", description: "Fetch one venue", roles: [PlatformAdmin, ProductionManager, RiggingSupervisor, StructuralEngineer, WarehouseChief, SafetyInspector, CrewChief, ClientContact], code: 200, input: [], output: Venue, side_effects: [] }
  - { method: GET, path: "/api/venues/{id}/productions", description: "List productions hosted at this venue (FK reverse)", roles: [PlatformAdmin, ProductionManager, RiggingSupervisor, StructuralEngineer, WarehouseChief, SafetyInspector, CrewChief, ClientContact], code: 200, input: ["limit?", "offset?"], output: "Production[]", side_effects: [] }
  - { method: POST, path: "/api/technicians", description: "Register a technician", roles: [ProductionManager], code: 201, input: [full_name, union_card_no, classification, hourly_rate_cents], output: Technician, side_effects: [] }
  - { method: GET, path: "/api/technicians/{id}", description: "Fetch one technician", roles: [PlatformAdmin, ProductionManager, RiggingSupervisor, StructuralEngineer, WarehouseChief, SafetyInspector, CrewChief, ClientContact], code: 200, input: [], output: Technician, side_effects: [] }
  - { method: GET, path: "/api/technicians/{id}/crew-assignments", description: "List a technician's crew assignments across all calls (FK reverse)", roles: [PlatformAdmin, ProductionManager, RiggingSupervisor, StructuralEngineer, WarehouseChief, SafetyInspector, CrewChief, ClientContact], code: 200, input: ["limit?", "offset?"], output: "CrewAssignment[]", side_effects: [] }
  - { method: POST, path: "/api/productions", description: "Create a production at a venue; venue closed-interval occupancy check applies", roles: [ProductionManager], code: 201, input: [venue_id, name, load_in_at, show_at, load_out_at], output: Production, side_effects: [] }
  - { method: GET, path: "/api/productions", description: "List productions, optionally filtered", roles: [PlatformAdmin, ProductionManager, RiggingSupervisor, StructuralEngineer, WarehouseChief, SafetyInspector, CrewChief, ClientContact], code: 200, input: ["venue_id?", "status?", "limit?", "offset?"], output: "Production[]", side_effects: [] }
