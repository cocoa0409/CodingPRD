        claim_type: correct_result
        grounds: [calculations.claim_credit, state_machines.ReplacementClaim.SUBMITTED_to_APPROVED_CHARGED]
        distinguishing_aspect: "DEALER_ERROR branch: final credit 0 and replacement charge round(45,000 x 0.60) = 27,000 — the charged terminal state, distinct from the no-charge branch covered in §1.8."
        test_recipe:
          setup: ["Dealer L4 (0.75); shipped door order line unit 30,000 qty 4; claim DEALER_ERROR qty 2 -> basis 45,000"]
          setup_api_calls:
            - call: "POST /kcma/dealers"
              payload: { name: "Dealer L4", dealer_code: "DL4", price_level: "L4", credit_limit_cents: 100000000 }
              as: PlantAdmin
              captures: { d_id: $.data.id }
            - call: "POST /kcma/door-styles"
              payload: { style_code: "DS-SHK", name: "Shaker", construction: "SHAKER", base_list_price_cents: 30000 }
              as: PlantAdmin
              captures: { ds_id: $.data.id }
            - call: "POST /kcma/finish-specs"
              payload: { finish_code: "FS-SAT-10", color_name: "Oak Satin", sheen: "SATIN", upcharge_pct: 0.10, delta_e_tolerance: 1.5 }
              as: PlantAdmin
              captures: { fs_id: $.data.id }
            - call: "POST /kcma/orders"
              as: Dealer
              as_user_id: ${d_id}
              captures: { o_id: $.data.id }
            - call: "POST /kcma/orders/${o_id}/lines"
              payload: { line_type: "DOOR", door_style_id: "${ds_id}", finish_id: "${fs_id}", width_in: 15, height_in: 30, depth_in: 1, qty: 4, unit_list_price_cents: 30000 }
              as: Dealer
              as_user_id: ${d_id}
              captures: { ol_id: $.data.id }
            - call: "POST /kcma/orders/${o_id}/submit"
              as: Dealer
              as_user_id: ${d_id}
            - call: "POST /kcma/finish-batches"
              payload: { finish_id: "${fs_id}", sheen_lot_no: "LOT-1", capacity_doors: 10 }
              as: FinishSupervisor
              captures: { fb_id: $.data.id }
            - call: "POST /kcma/finish-batches/${fb_id}/assign"
              payload: { order_line_id: "${ol_id}" }
              as: FinishSupervisor
            - call: "POST /kcma/finish-batches/${fb_id}/qc-record"
              payload: { measured_delta_e: 1.0 }
              as: FinishSupervisor
            - call: "POST /kcma/delivery-routes"
              payload: { route_code: "RT-1", route_date: "2026-05-04", capacity_cu_ft: 100.0 }
              as: ShippingCoordinator
              captures: { rt_id: $.data.id }
            - call: "GET /kcma/orders/${o_id}"
              as: ShippingCoordinator
              captures: { o_v: $.data.version }
            - call: "POST /kcma/delivery-routes/${rt_id}/assign-order"
              payload: { order_id: "${o_id}", expected_order_version: "${o_v}" }
              as: ShippingCoordinator
            - call: "POST /kcma/delivery-routes/${rt_id}/lock"
              as: ShippingCoordinator
            - call: "POST /kcma/delivery-routes/${rt_id}/dispatch"
              as: ShippingCoordinator
            - call: "POST /kcma/replacement-claims"
              payload: { original_order_line_id: "${ol_id}", claim_type: "DEALER_ERROR", qty: 2 }
              as: Dealer
              as_user_id: ${d_id}
              captures: { cl_id: $.data.id, cl_basis: $.data.credit_basis_cents, cl_prov: $.data.provisional_credit_cents }
          trigger:
            - call: "POST /kcma/replacement-claims/${cl_id}/adjudicate"
              payload: { decision: "APPROVE", note: "dealer-caused" }
              as: PlantAdmin
              captures: { cl_status: $.data.status, cl_final: $.data.final_credit_cents, cl_charge: $.data.replacement_charge_cents }
          assert:
            - "ReplacementClaim.credit_basis_cents == 45000"
            - "provisional_credit_cents == 22500 (flat 50% estimate even for DEALER_ERROR)"
            - "status == APPROVED_CHARGED; final_credit_cents == 0; replacement_charge_cents == 27000"

      - name: mod_surcharge_correct_result
        claim_type: correct_result
        grounds: [calculations.mod_surcharge]
        excluded_because:
          difficulty_instance: mod_surcharge_tiered_formula_with_cap
          rationale: "§1.8 instance pins the tiered formula and the cap with literal 4000."

      - name: order_provisional_totals_correct_result
        claim_type: correct_result
        grounds: [calculations.order_provisional_totals]
        excluded_because:
          difficulty_instance: order_pricing_provisional_vs_final_variant
          rationale: "§1.8 instance pins provisional totals (1,627,600) as literals."

      - name: claim_credit_variant_selection
        claim_type: variant_selection
        grounds: [calculations.claim_credit]
        excluded_because:
          difficulty_instance: claim_credit_provisional_vs_final_variant
          rationale: "§1.8 instance pins both claim variants and their selecting events."

