            - { call: "POST /youth-ministry/trips/${trip}/open-registration", as: ProgramDirector }
            # reg1 -> SUBMITTED only
            - { call: "POST /youth-ministry/participants", payload: {program_id: "${prog}", family_key: "f1", first_name: "P", last_name: "One", birth_date: "2011-01-01", grade: 10, annual_income_bracket: "BAND_B", household_size: 3}, as: Guardian, as_user_id: "guardian-1", captures: {p1: $.data.id} }
            - { call: "POST /youth-ministry/registrations", payload: {trip_id: "${trip}", participant_id: "${p1}", insurance_tier: "INTERNATIONAL", fundraising_goal_cents: 0}, as: Guardian, as_user_id: "guardian-1", captures: {reg1: $.data.id} }
            - { call: "POST /youth-ministry/registrations/${reg1}/consent-forms", payload: {form_type: "PARENTAL_CONSENT", signed_by_name: "G", signed_at: "2026-08-02T10:00:00Z"}, as: Guardian, as_user_id: "guardian-1" }
            - { call: "POST /youth-ministry/registrations/${reg1}/consent-forms", payload: {form_type: "MEDICAL_RELEASE", signed_by_name: "G", signed_at: "2026-08-02T10:01:00Z", medical_notes: "n"}, as: Guardian, as_user_id: "guardian-1" }
            - { call: "POST /youth-ministry/registrations/${reg1}/consent-forms", payload: {form_type: "CONDUCT_AGREEMENT", signed_by_name: "G", signed_at: "2026-08-02T10:02:00Z"}, as: Guardian, as_user_id: "guardian-1" }
            - { call: "POST /youth-ministry/registrations/${reg1}/submit", as: Guardian, as_user_id: "guardian-1" }
            # reg2 -> APPROVED with live application
            - { call: "POST /youth-ministry/participants", payload: {program_id: "${prog}", family_key: "f2", first_name: "Q", last_name: "Two", birth_date: "2011-02-01", grade: 10, annual_income_bracket: "BAND_B", household_size: 3}, as: Guardian, as_user_id: "guardian-2", captures: {p2: $.data.id} }
            - { call: "POST /youth-ministry/registrations", payload: {trip_id: "${trip}", participant_id: "${p2}", insurance_tier: "INTERNATIONAL", fundraising_goal_cents: 0}, as: Guardian, as_user_id: "guardian-2", captures: {reg2: $.data.id} }
