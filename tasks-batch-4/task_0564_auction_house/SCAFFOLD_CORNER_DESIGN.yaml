scaffold_corner_design:

  # =========================================================================
  - section: entities
    instances:
      - name: corner_consignor_create_returns_201
        claim_type: Creation
        grounds: ['entities.Consignor', 'endpoints."POST /consignors"']
        distinguishing_aspect: "POST /consignors with display_name/email returns 201 with a server-minted id, created_at, version=1, and payout_method defaulting to CHECK."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /consignors"
              payload: { display_name: "Estate A", email: "a@x.com" }
              as: AuctionStaff
              captures: { cid: "$.data.id", pm: "$.data.payout_method", ver: "$.data.version" }
          assert:
            - "${pm} == 'CHECK'"
            - "${ver} == 1"
            - "Consignor.${cid}.display_name == 'Estate A'"

      - name: corner_get_lot_nonexistent_returns_404
        claim_type: Not Found
        grounds: ['entities.Lot', 'errors[ERR_LOT_NOT_FOUND]']
        distinguishing_aspect: "GET /lots/{id} for an unknown UUID returns ERR_LOT_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /lots/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: AuctionStaff
              captures: { err: "$.data.error_id" }
          assert:
            - "${err} == 'ERR_LOT_NOT_FOUND'"

      - name: corner_bidder_duplicate_paddle_returns_409
        claim_type: Type Constraints
        grounds: ['entities.Bidder.fields.paddle_number', 'errors[ERR_DUPLICATE_PADDLE]', 'validations[priority=8]']
        distinguishing_aspect: "Registering a second bidder with an already-used paddle_number returns ERR_DUPLICATE_PADDLE (409)."
        test_recipe:
          setup: ["Bidder with paddle P1 exists."]
          setup_api_calls:
            - call: "POST /bidders"
              payload: { display_name: "B1", email: "b1@x.com", paddle_number: "P1", deposit_cents: 0 }
              as: AuctionStaff
          trigger:
            - call: "POST /bidders"
              payload: { display_name: "B2", email: "b2@x.com", paddle_number: "P1", deposit_cents: 0 }
              as: AuctionStaff
              captures: { err: "$.data.error_id" }
          assert:
            - "${err} == 'ERR_DUPLICATE_PADDLE'"

      - name: corner_consignment_missing_commission_rate_returns_400
        claim_type: Required Fields
        grounds: ['entities.Consignment.fields.commission_rate', 'errors[ERR_VALIDATION]', 'validations[priority=3]']
        distinguishing_aspect: "POST /consignments omitting commission_rate returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["Consignor cn exists."]
          setup_api_calls:
            - call: "POST /consignors"
              payload: { display_name: "Estate A", email: "a@x.com" }
              as: AuctionStaff
              captures: { cn: "$.data.id" }
          trigger:
            - call: "POST /consignments"
              payload: { consignor_id: "${cn}", estimate_low_cents: 100000, estimate_high_cents: 200000, intake_window_start: "2026-05-02T09:00:00Z", intake_window_end: "2026-05-02T10:00:00Z" }
              as: AuctionStaff
              captures: { err: "$.data.error_id" }
          assert:
            - "${err} == 'ERR_VALIDATION'"

      - name: corner_auction_end_before_start_returns_400
        claim_type: Type Constraints
        grounds: ['entities.Auction.fields.scheduled_end', 'errors[ERR_VALIDATION]', 'validations[priority=3]']
        distinguishing_aspect: "POST /auctions with scheduled_end <= scheduled_start returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["Saleroom sr exists."]
          setup_api_calls:
            - call: "POST /salerooms"
              payload: { name: "Main", location: "NYC", capacity: 100 }
              as: AuctionStaff
              captures: { sr: "$.data.id" }
          trigger:
            - call: "POST /auctions"
              payload: { title: "Bad", sale_type: "LIVE", saleroom_id: "${sr}", scheduled_start: "2026-06-10T12:00:00Z", scheduled_end: "2026-06-10T10:00:00Z" }
              as: AuctionStaff
              captures: { err: "$.data.error_id" }
          assert:
            - "${err} == 'ERR_VALIDATION'"

      - name: corner_bid_unknown_bidder_returns_404
        claim_type: Not Found
        grounds: ['entities.Bid.fields.bidder_id', 'errors[ERR_BIDDER_NOT_FOUND]', 'validations[priority=4]']
        distinguishing_aspect: "Placing a bid whose bidder_id does not resolve returns ERR_BIDDER_NOT_FOUND (404)."
        test_recipe:
          setup: ["A lot is OPEN."]
          setup_api_calls:
            - call: "POST /salerooms"
              payload: { name: "Main", location: "NYC", capacity: 100 }
              as: AuctionStaff
              captures: { sr: "$.data.id" }
            - call: "POST /auctions"
              payload: { title: "Spring", sale_type: "LIVE", saleroom_id: "${sr}", scheduled_start: "2026-06-10T10:00:00Z", scheduled_end: "2026-06-10T18:00:00Z" }
              as: AuctionStaff
              captures: { au: "$.data.id" }
            - call: "POST /consignors"
              payload: { display_name: "Estate A", email: "a@x.com" }
              as: AuctionStaff
              captures: { cn: "$.data.id" }
            - call: "POST /consignments"
              payload: { consignor_id: "${cn}", commission_rate: 0.15, estimate_low_cents: 100000, estimate_high_cents: 200000, intake_window_start: "2026-05-02T09:00:00Z", intake_window_end: "2026-05-02T10:00:00Z" }
              as: AuctionStaff
              captures: { cg: "$.data.id" }
            - call: "POST /consignments/${cg}/appraise"
              payload: { appraised_low_cents: 100000, appraised_high_cents: 200000 }
              as: Appraiser
            - call: "POST /consignments/${cg}/decision"
              payload: { outcome: "ACCEPT" }
              as: AuctionStaff
            - call: "POST /lots"
              payload: { consignment_id: "${cg}", auction_id: "${au}", title: "Vase", category: "ART", reserve_cents: 0, starting_bid_cents: 100000, estimate_low_cents: 100000, estimate_high_cents: 200000, lot_number: 1 }
              as: AuctionStaff
              captures: { lot: "$.data.id" }
            - call: "POST /auctions/${au}/open"
              payload: {}
              as: AuctionStaff
            - call: "POST /lots/${lot}/open"
              payload: {}
              as: AuctionStaff
              captures: { lot_v: "$.data.version" }
          trigger:
            - call: "POST /lots/${lot}/bids"
              payload: { bidder_id: "00000000-0000-0000-0000-000000000000", bid_type: "LIVE", amount_cents: 100000, expected_lot_version: "${lot_v}" }
              as: Bidder
              as_user_id: "00000000-0000-0000-0000-000000000000"
              captures: { err: "$.data.error_id" }
          assert:
            - "${err} == 'ERR_BIDDER_NOT_FOUND'"

  # =========================================================================
  - section: state_machines
    instances:
      - name: corner_consignment_decision_before_appraised_returns_conflict
        claim_type: Precondition Enforcement
        grounds: ['state_machines.Consignment.APPRAISED_to_ACCEPTED', 'errors[ERR_CONSIGNMENT_NOT_APPRAISED]']
        distinguishing_aspect: "A decision on a SUBMITTED (not yet APPRAISED) consignment returns ERR_CONSIGNMENT_NOT_APPRAISED (409)."
        test_recipe:
          setup: ["Consignment cg is SUBMITTED (never appraised)."]
          setup_api_calls:
            - call: "POST /consignors"
              payload: { display_name: "Estate A", email: "a@x.com" }
              as: AuctionStaff
              captures: { cn: "$.data.id" }
            - call: "POST /consignments"
              payload: { consignor_id: "${cn}", commission_rate: 0.15, estimate_low_cents: 100000, estimate_high_cents: 200000, intake_window_start: "2026-05-02T09:00:00Z", intake_window_end: "2026-05-02T10:00:00Z" }
              as: AuctionStaff
              captures: { cg: "$.data.id" }
          trigger:
            - call: "POST /consignments/${cg}/decision"
              payload: { outcome: "ACCEPT" }
              as: AuctionStaff
              captures: { err: "$.data.error_id" }
          assert:
            - "${err} == 'ERR_CONSIGNMENT_NOT_APPRAISED'"

      - name: corner_lot_create_from_unaccepted_consignment_returns_conflict
        claim_type: Precondition Enforcement
        grounds: ['entities.Lot.fields.consignment_id', 'errors[ERR_CONSIGNMENT_NOT_ACCEPTED]', 'validations[priority=7]']
        distinguishing_aspect: "Cataloging a lot from a consignment still in SUBMITTED returns ERR_CONSIGNMENT_NOT_ACCEPTED (409)."
        test_recipe:
          setup: ["Consignment cg is SUBMITTED; an auction exists."]
          setup_api_calls:
            - call: "POST /salerooms"
              payload: { name: "Main", location: "NYC", capacity: 100 }
              as: AuctionStaff
              captures: { sr: "$.data.id" }
            - call: "POST /auctions"
              payload: { title: "Spring", sale_type: "LIVE", saleroom_id: "${sr}", scheduled_start: "2026-06-10T10:00:00Z", scheduled_end: "2026-06-10T18:00:00Z" }
              as: AuctionStaff
              captures: { au: "$.data.id" }
            - call: "POST /consignors"
              payload: { display_name: "Estate A", email: "a@x.com" }
              as: AuctionStaff
              captures: { cn: "$.data.id" }
            - call: "POST /consignments"
              payload: { consignor_id: "${cn}", commission_rate: 0.15, estimate_low_cents: 100000, estimate_high_cents: 200000, intake_window_start: "2026-05-02T09:00:00Z", intake_window_end: "2026-05-02T10:00:00Z" }
              as: AuctionStaff
              captures: { cg: "$.data.id" }
          trigger:
            - call: "POST /lots"
              payload: { consignment_id: "${cg}", auction_id: "${au}", title: "Vase", category: "ART", reserve_cents: 0, starting_bid_cents: 100000, estimate_low_cents: 100000, estimate_high_cents: 200000, lot_number: 1 }
              as: AuctionStaff
              captures: { err: "$.data.error_id" }
          assert:
            - "${err} == 'ERR_CONSIGNMENT_NOT_ACCEPTED'"

      - name: corner_hammer_no_bids_returns_conflict
        claim_type: Precondition Enforcement
        grounds: ['state_machines.Lot.OPEN_to_HAMMERED', 'errors[ERR_NO_BIDS]', 'validations[priority=10]']
        distinguishing_aspect: "Hammering an OPEN lot with zero ACTIVE bids returns ERR_NO_BIDS (409)."
        test_recipe:
          setup: ["A lot is OPEN with no bids."]
          setup_api_calls:
            - call: "POST /salerooms"
              payload: { name: "Main", location: "NYC", capacity: 100 }
              as: AuctionStaff
              captures: { sr: "$.data.id" }
            - call: "POST /auctions"
              payload: { title: "Spring", sale_type: "LIVE", saleroom_id: "${sr}", scheduled_start: "2026-06-10T10:00:00Z", scheduled_end: "2026-06-10T18:00:00Z" }
              as: AuctionStaff
              captures: { au: "$.data.id" }
            - call: "POST /consignors"
              payload: { display_name: "Estate A", email: "a@x.com" }
              as: AuctionStaff
              captures: { cn: "$.data.id" }
            - call: "POST /consignments"
              payload: { consignor_id: "${cn}", commission_rate: 0.15, estimate_low_cents: 100000, estimate_high_cents: 200000, intake_window_start: "2026-05-02T09:00:00Z", intake_window_end: "2026-05-02T10:00:00Z" }
              as: AuctionStaff
              captures: { cg: "$.data.id" }
            - call: "POST /consignments/${cg}/appraise"
              payload: { appraised_low_cents: 100000, appraised_high_cents: 200000 }
              as: Appraiser
            - call: "POST /consignments/${cg}/decision"
              payload: { outcome: "ACCEPT" }
              as: AuctionStaff
            - call: "POST /lots"
              payload: { consignment_id: "${cg}", auction_id: "${au}", title: "Vase", category: "ART", reserve_cents: 0, starting_bid_cents: 100000, estimate_low_cents: 100000, estimate_high_cents: 200000, lot_number: 1 }
              as: AuctionStaff
              captures: { lot: "$.data.id" }
            - call: "POST /auctions/${au}/open"
              payload: {}
              as: AuctionStaff
            - call: "POST /lots/${lot}/open"
              payload: {}
              as: AuctionStaff
          trigger:
            - call: "POST /lots/${lot}/hammer"
              payload: {}
              as: AuctionStaff
              captures: { err: "$.data.error_id" }
          assert:
            - "${err} == 'ERR_NO_BIDS'"

      - name: corner_hammer_reserve_not_met_returns_conflict
        claim_type: Precondition Enforcement
        grounds: ['state_machines.Lot.OPEN_to_HAMMERED', 'errors[ERR_RESERVE_NOT_MET]', 'validations[priority=11]']
        distinguishing_aspect: "Hammering a lot whose current high bid (100000) is below reserve (500000) returns ERR_RESERVE_NOT_MET (409); the lot must be passed instead."
        test_recipe:
          setup: ["A lot (reserve 500000, starting 100000) is OPEN with one bid of 100000."]
          setup_api_calls:
            - call: "POST /salerooms"
              payload: { name: "Main", location: "NYC", capacity: 100 }
              as: AuctionStaff
              captures: { sr: "$.data.id" }
            - call: "POST /auctions"
              payload: { title: "Spring", sale_type: "LIVE", saleroom_id: "${sr}", scheduled_start: "2026-06-10T10:00:00Z", scheduled_end: "2026-06-10T18:00:00Z" }
              as: AuctionStaff
              captures: { au: "$.data.id" }
            - call: "POST /consignors"
              payload: { display_name: "Estate A", email: "a@x.com" }
              as: AuctionStaff
              captures: { cn: "$.data.id" }
            - call: "POST /consignments"
              payload: { consignor_id: "${cn}", commission_rate: 0.15, estimate_low_cents: 400000, estimate_high_cents: 900000, intake_window_start: "2026-05-02T09:00:00Z", intake_window_end: "2026-05-02T10:00:00Z" }
              as: AuctionStaff
              captures: { cg: "$.data.id" }
            - call: "POST /consignments/${cg}/appraise"
              payload: { appraised_low_cents: 400000, appraised_high_cents: 900000 }
              as: Appraiser
            - call: "POST /consignments/${cg}/decision"
              payload: { outcome: "ACCEPT" }
              as: AuctionStaff
            - call: "POST /lots"
              payload: { consignment_id: "${cg}", auction_id: "${au}", title: "Vase", category: "ART", reserve_cents: 500000, starting_bid_cents: 100000, estimate_low_cents: 400000, estimate_high_cents: 900000, lot_number: 1 }
              as: AuctionStaff
              captures: { lot: "$.data.id" }
            - call: "POST /auctions/${au}/open"
              payload: {}
              as: AuctionStaff
            - call: "POST /lots/${lot}/open"
              payload: {}
              as: AuctionStaff
              captures: { lot_v: "$.data.version" }
            - call: "POST /bidders"
              payload: { display_name: "Buyer", email: "b@x.com", paddle_number: "P1", deposit_cents: 0 }
              as: AuctionStaff
              captures: { bd: "$.data.id" }
            - call: "POST /lots/${lot}/bids"
              payload: { bidder_id: "${bd}", bid_type: "LIVE", amount_cents: 100000, expected_lot_version: "${lot_v}" }
              as: Bidder
              as_user_id: "${bd}"
          trigger:
            - call: "POST /lots/${lot}/hammer"
              payload: {}
              as: AuctionStaff
              captures: { err: "$.data.error_id" }
          assert:
            - "${err} == 'ERR_RESERVE_NOT_MET'"

      - name: corner_lot_pass_buy_in_valid
        claim_type: Valid Transition
        grounds: ['state_machines.Lot.OPEN_to_PASSED']
        distinguishing_aspect: "Passing an OPEN lot moves it to PASSED (unsold/bought-in) and outbids its ACTIVE bids, with no Invoice created."
        test_recipe:
          setup: ["A lot (reserve 500000) is OPEN with one under-reserve bid of 100000."]
          setup_api_calls:
            - call: "POST /salerooms"
              payload: { name: "Main", location: "NYC", capacity: 100 }
              as: AuctionStaff
              captures: { sr: "$.data.id" }
            - call: "POST /auctions"
              payload: { title: "Spring", sale_type: "LIVE", saleroom_id: "${sr}", scheduled_start: "2026-06-10T10:00:00Z", scheduled_end: "2026-06-10T18:00:00Z" }
              as: AuctionStaff
              captures: { au: "$.data.id" }
            - call: "POST /consignors"
              payload: { display_name: "Estate A", email: "a@x.com" }
              as: AuctionStaff
              captures: { cn: "$.data.id" }
            - call: "POST /consignments"
              payload: { consignor_id: "${cn}", commission_rate: 0.15, estimate_low_cents: 400000, estimate_high_cents: 900000, intake_window_start: "2026-05-02T09:00:00Z", intake_window_end: "2026-05-02T10:00:00Z" }
              as: AuctionStaff
              captures: { cg: "$.data.id" }
            - call: "POST /consignments/${cg}/appraise"
              payload: { appraised_low_cents: 400000, appraised_high_cents: 900000 }
              as: Appraiser
            - call: "POST /consignments/${cg}/decision"
              payload: { outcome: "ACCEPT" }
              as: AuctionStaff
            - call: "POST /lots"
              payload: { consignment_id: "${cg}", auction_id: "${au}", title: "Vase", category: "ART", reserve_cents: 500000, starting_bid_cents: 100000, estimate_low_cents: 400000, estimate_high_cents: 900000, lot_number: 1 }
              as: AuctionStaff
              captures: { lot: "$.data.id" }
            - call: "POST /auctions/${au}/open"
              payload: {}
              as: AuctionStaff
            - call: "POST /lots/${lot}/open"
              payload: {}
              as: AuctionStaff
              captures: { lot_v: "$.data.version" }
            - call: "POST /bidders"
              payload: { display_name: "Buyer", email: "b@x.com", paddle_number: "P1", deposit_cents: 0 }
              as: AuctionStaff
              captures: { bd: "$.data.id" }
            - call: "POST /lots/${lot}/bids"
              payload: { bidder_id: "${bd}", bid_type: "LIVE", amount_cents: 100000, expected_lot_version: "${lot_v}" }
              as: Bidder
              as_user_id: "${bd}"
              captures: { bid: "$.data.id" }
          trigger:
            - call: "POST /lots/${lot}/pass"
              payload: {}
              as: AuctionStaff
              captures: { lot_status: "$.data.sale_status" }
            - call: "GET /bids/${bid}"
              payload: {}
              as: AuctionStaff
              captures: { bid_status: "$.data.status" }
            - call: "GET /invoices?bidder_id=${bd}&auction_id=${au}"
              payload: {}
              as: AuctionStaff
          assert:
            - "${lot_status} == 'PASSED'"
            - "${bid_status} == 'OUTBID'"
            - "GET /invoices?bidder_id=${bd}&auction_id=${au} returns an empty data array (no Invoice created for a passed lot)"

      - name: corner_dispute_resolve_from_open_invalid
        claim_type: Invalid Transitions
        grounds: ['state_machines.Dispute.UNDER_REVIEW_to_UPHELD', 'errors[ERR_INVALID_STATE]']
        distinguishing_aspect: "Resolving a dispute still in OPEN (not yet UNDER_REVIEW) returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A hammered lot's InvoiceLine has an OPEN (unreviewed) dispute."]
          setup_api_calls:
            - call: "POST /salerooms"
              payload: { name: "Main", location: "NYC", capacity: 100 }
              as: AuctionStaff
              captures: { sr: "$.data.id" }
            - call: "POST /auctions"
              payload: { title: "Spring", sale_type: "LIVE", saleroom_id: "${sr}", scheduled_start: "2026-06-10T10:00:00Z", scheduled_end: "2026-06-10T18:00:00Z" }
              as: AuctionStaff
              captures: { au: "$.data.id" }
            - call: "POST /consignors"
              payload: { display_name: "Estate A", email: "a@x.com" }
              as: AuctionStaff
              captures: { cn: "$.data.id" }
            - call: "POST /consignments"
              payload: { consignor_id: "${cn}", commission_rate: 0.15, estimate_low_cents: 100000, estimate_high_cents: 400000, intake_window_start: "2026-05-02T09:00:00Z", intake_window_end: "2026-05-02T10:00:00Z" }
              as: AuctionStaff
              captures: { cg: "$.data.id" }
            - call: "POST /consignments/${cg}/appraise"
              payload: { appraised_low_cents: 100000, appraised_high_cents: 400000 }
              as: Appraiser
            - call: "POST /consignments/${cg}/decision"
              payload: { outcome: "ACCEPT" }
              as: AuctionStaff
            - call: "POST /lots"
              payload: { consignment_id: "${cg}", auction_id: "${au}", title: "Vase", category: "ART", reserve_cents: 0, starting_bid_cents: 200000, estimate_low_cents: 100000, estimate_high_cents: 400000, lot_number: 1 }
              as: AuctionStaff
              captures: { lot: "$.data.id" }
            - call: "POST /auctions/${au}/open"
              payload: {}
              as: AuctionStaff
            - call: "POST /lots/${lot}/open"
              payload: {}
              as: AuctionStaff
              captures: { lot_v: "$.data.version" }
            - call: "POST /bidders"
              payload: { display_name: "Buyer", email: "b@x.com", paddle_number: "P1", deposit_cents: 0 }
              as: AuctionStaff
              captures: { bd: "$.data.id" }
            - call: "POST /lots/${lot}/bids"
              payload: { bidder_id: "${bd}", bid_type: "LIVE", amount_cents: 250000, expected_lot_version: "${lot_v}" }
              as: Bidder
              as_user_id: "${bd}"
            - call: "POST /lots/${lot}/hammer"
              payload: {}
              as: AuctionStaff
            - call: "GET /invoice-lines?lot_id=${lot}"
              payload: {}
              as: AuctionStaff
              captures: { line: "$.data[0].id" }
            - call: "POST /disputes"
              payload: { invoice_line_id: "${line}", reason: "Questioned" }
              as: Bidder
              as_user_id: "${bd}"
              captures: { dsp: "$.data.id" }
          trigger:
            - call: "POST /disputes/${dsp}/resolve"
              payload: { outcome: "UPHELD", resolution_notes: "x" }
              as: Appraiser
              captures: { err: "$.data.error_id" }
          assert:
            - "${err} == 'ERR_INVALID_STATE'"

      - name: corner_auction_open_twice_invalid
        claim_type: Idempotency
        grounds: ['state_machines.Auction.SCHEDULED_to_OPEN', 'errors[ERR_INVALID_STATE]']
        distinguishing_aspect: "Opening an already-OPEN auction a second time returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Auction au is OPEN."]
          setup_api_calls:
            - call: "POST /salerooms"
              payload: { name: "Main", location: "NYC", capacity: 100 }
              as: AuctionStaff
              captures: { sr: "$.data.id" }
            - call: "POST /auctions"
              payload: { title: "Spring", sale_type: "LIVE", saleroom_id: "${sr}", scheduled_start: "2026-06-10T10:00:00Z", scheduled_end: "2026-06-10T18:00:00Z" }
              as: AuctionStaff
              captures: { au: "$.data.id" }
            - call: "POST /auctions/${au}/open"
              payload: {}
              as: AuctionStaff
          trigger:
            - call: "POST /auctions/${au}/open"
              payload: {}
              as: AuctionStaff
              captures: { err: "$.data.error_id" }
          assert:
            - "${err} == 'ERR_INVALID_STATE'"

  # =========================================================================
  - section: calculations
    instances:
      - name: corner_winning_highest_active_bid_wins
        claim_type: Correct Result
        grounds: ['calculations.winning_bid_determination', 'state_machines.Bid.ACTIVE_to_WINNING', 'state_machines.Bid.ACTIVE_to_OUTBID']
        distinguishing_aspect: "With bids 100000 (bd1) then 120000 (bd2), hammer makes bd2's bid WINNING and bd1's OUTBID; lot.winning_bid_id is bd2's bid."
        test_recipe:
          setup: ["A lot is OPEN; bd1 bid 100000, bd2 raised to 120000."]
