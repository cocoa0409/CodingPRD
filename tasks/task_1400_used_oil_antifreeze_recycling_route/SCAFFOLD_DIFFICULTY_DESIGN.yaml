# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN — §1.8 Test Targeting Index
# Used-Oil & Antifreeze Recycling Route
#
# Nine Difficulty Rules x >=2 instances each. Every instance's test_recipe is
# operational and grounded in §1.5 endpoints declared in SCAFFOLD.yaml.
# =============================================================================

scaffold_difficulty_design:

  # ==========================================================================
  # RULE 1 — dual_variant_calc (different entity domains)
  # ==========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: settlement_provisional_vs_adjusted
        grounds:
          - calculations.settlement_amount
          - entities.PickupTicket.fields.net_amount_cents
          - entities.Customer.fields.prepaid_balance_cents
        distinguishing_aspect: |
          Entity domain = PickupTicket/Customer settlement. Two variants of
          settlement_amount produce different net_amount_cents for the same
          PickupTicket: provisional uses the original metered volume and the
          scheduled_date market price; adjusted uses the corrected volume
          supplied at /adjust and posts only the DELTA to Customer.
        test_recipe:
          setup:
            - "Clock is at 2026-08-01T00:00:00Z (default)"
            - "Customer C in zone NORTH, credit_terms=PREPAY, status=ACTIVE, halogen_violation_count=0, prepaid_balance_cents=0"
            - "TankSite S under C in URBAN, route_eligibility_override=false"
            - "Tank T under S: USED_OIL, capacity 500, ownership=CUSTOMER_OWNED, ownership_status=INSTALLED, current_volume_gallons=200"
            - "Driver D with hazmat_endorsement=true, status=ACTIVE"
            - "MarketPrice (NORTH, USED_OIL, 2026-08-01) = +50c/gal published"
            - "Route R scheduled 2026-08-05, URBAN, vehicle_capacity_gallons=1000, driver=D, dispatched"
            - "RouteStop RS on R at tank T, sequence=1, SCHEDULED -> EN_ROUTE -> SCREENING -> READY_TO_PUMP -> COMPLETED with metered_volume_gallons=100"
            - "PickupTicket PT created with net_amount_cents=+5000 (provisional variant), payment_status=PROVISIONAL"
          setup_api_calls:
            - { call: "POST /recycle-routes/customers", payload: { legal_name: "Acme Lube", epa_generator_id: "EPAGEN000001", market_zone: "NORTH", credit_terms: "PREPAY" }, as: RoutePlanner, captures: { cust_id: "$.data.id" } }
            - { call: "POST /recycle-routes/tank-sites", payload: { customer_id: "${cust_id}", site_address: "1 Main St", density_zone: "URBAN" }, as: RoutePlanner, captures: { site_id: "$.data.id" } }
            - { call: "POST /recycle-routes/tanks", payload: { tank_site_id: "${site_id}", tank_kind: "USED_OIL", capacity_gallons: 500, ownership: "CUSTOMER_OWNED" }, as: TankInstaller, captures: { tank_id: "$.data.id" } }
            - { call: "POST /recycle-routes/tanks/${tank_id}/register-existing", payload: {}, as: TankInstaller }
            - { call: "POST /recycle-routes/tanks/${tank_id}/record-intake", payload: { gallons: 200 }, as: RoutePlanner }
            - { call: "POST /recycle-routes/customers/${cust_id}/activate", payload: {}, as: RoutePlanner }
            - { call: "POST /recycle-routes/drivers", payload: { driver_name: "Dan", cdl_class: "A", hazmat_endorsement: true }, as: RoutePlanner, captures: { drv_id: "$.data.id" } }
            - { call: "POST /recycle-routes/market-prices", payload: { market_zone: "NORTH", tank_kind: "USED_OIL", effective_date: "2026-08-01", price_cents_per_gal: 50 }, as: Regulator }
            - { call: "POST /recycle-routes/routes", payload: { route_code: "R-1", scheduled_date: "2026-08-05", driver_id: "${drv_id}", vehicle_capacity_gallons: 1000, density_zone: "URBAN" }, as: RoutePlanner, captures: { route_id: "$.data.id", route_v: "$.data.version" } }
            - { call: "POST /recycle-routes/routes/${route_id}/route-stops", payload: { tank_site_id: "${site_id}", tank_id: "${tank_id}", scheduled_window_start: "08:00", scheduled_window_end: "10:00", sequence: 1, estimated_volume_gallons: 150, expected_route_version: "${route_v}" }, as: RoutePlanner, captures: { stop_id: "$.data.id" } }
            - { call: "POST /recycle-routes/routes/${route_id}/dispatch", payload: {}, as: RoutePlanner }
            - { call: "POST /recycle-routes/route-stops/${stop_id}/arrive", payload: {}, as: Driver, as_user_id: "${drv_id}" }
            - { call: "POST /recycle-routes/route-stops/${stop_id}/begin-screening", payload: {}, as: Driver, as_user_id: "${drv_id}" }
            - { call: "POST /recycle-routes/route-stops/${stop_id}/sample-screenings", payload: { halogen_ppm: 50, water_pct: 1.0, ph_level: 7.0 }, as: LabTech }
            - { call: "POST /recycle-routes/route-stops/${stop_id}/pickup-tickets", payload: { client_request_id: "PT-1", metered_volume_gallons: 100 }, as: Driver, as_user_id: "${drv_id}", captures: { pt_id: "$.data.id", pt_net: "$.data.net_amount_cents", pt_gross: "$.data.gross_amount_cents" } }
            - { call: "POST /recycle-routes/pickup-tickets/${pt_id}/dispute", payload: {}, as: SettlementClerk }
          trigger:
            - { call: "POST /recycle-routes/pickup-tickets/${pt_id}/adjust", payload: { corrected_metered_volume_gallons: 80 }, as: SettlementClerk }
            - { call: "GET /recycle-routes/customers/${cust_id}", payload: {}, as: SettlementClerk, captures: { cust_bal: "$.data.prepaid_balance_cents" } }
          assert:
            - "provisional variant: PickupTicket.${pt_id} originally had gross_amount_cents == 5000 (50 * 100)"
            - "provisional variant: PickupTicket.${pt_id} originally had net_amount_cents == 5000 (PAY_CUSTOMER direction)"
            - "provisional variant: original commodity_price_cents_per_gal == 50 (snapshot at scheduled_date)"
            - "adjusted variant: PickupTicket.${pt_id}.gross_amount_cents == 4000 (50 * 80) after adjust"
            - "adjusted variant: PickupTicket.${pt_id}.net_amount_cents == 4000 after adjust"
            - "adjusted variant: PickupTicket.${pt_id}.payment_status == ADJUSTED"
            - "Ticket was never settled before adjust: full new net (not a delta) is posted; Customer.${cust_id}.prepaid_balance_cents == 4000"

      - name: blend_yield_planned_vs_actual
        grounds:
          - calculations.blend_batch_yield
          - entities.BlendBatch.fields.planned_output_gallons
          - entities.BlendBatch.fields.output_gallons
        distinguishing_aspect: |
          Entity domain = BlendBatch feedstock yield. Two variants of
          blend_batch_yield produce different output_gallons for identical
          input_pickup_ticket_ids: planned_estimate (assumes avg_H=0 and no
          mix_penalty) vs actual (uses real frozen_halogen_count and mix).
        test_recipe:
          setup:
            - "Two customers C1 (halogen_violation_count=5 after five prior halogen rejects — pinned by performing 5 halogen rejects first OR by constructing tickets whose frozen_halogen_count=5)"
            - "Simplification: we directly create two SETTLED PickupTickets PT_A and PT_B each with metered_volume_gallons=100, each with frozen_halogen_count=5 (setup drives customer through 5 halogen rejects before the final PASS pickup)"
            - "Both tickets are USED_OIL (same kind, so mix_penalty=0)"
            - "Resale price 120c/gal"
            - "BlendBatch created with planned_estimate variant: output = round_half_up(200 * 72 / 100) = 144"
          setup_api_calls:
            - { call: "POST /recycle-routes/customers", payload: { legal_name: "Blend Feed Cust", epa_generator_id: "EPAGEN000002", market_zone: "NORTH", credit_terms: "NET30" }, as: RoutePlanner, captures: { cust_id: "$.data.id" } }
            - { call: "POST /recycle-routes/tank-sites", payload: { customer_id: "${cust_id}", site_address: "9 Side St", density_zone: "URBAN", route_eligibility_override: true }, as: RoutePlanner, captures: { site_id: "$.data.id" } }
            - { call: "POST /recycle-routes/tanks", payload: { tank_site_id: "${site_id}", tank_kind: "USED_OIL", capacity_gallons: 1000, ownership: "CUSTOMER_OWNED" }, as: TankInstaller, captures: { tank_id: "$.data.id" } }
            - { call: "POST /recycle-routes/tanks/${tank_id}/register-existing", payload: {}, as: TankInstaller }
            - { call: "POST /recycle-routes/customers/${cust_id}/activate", payload: {}, as: RoutePlanner }
            - { call: "POST /recycle-routes/drivers", payload: { driver_name: "Dee", cdl_class: "B", hazmat_endorsement: true }, as: RoutePlanner, captures: { drv_id: "$.data.id" } }
            - { call: "POST /recycle-routes/market-prices", payload: { market_zone: "NORTH", tank_kind: "USED_OIL", effective_date: "2026-08-01", price_cents_per_gal: 40 }, as: Regulator }
            # Drive customer.halogen_violation_count to 5 by doing 5 halogen rejects on 5 separate stops
            - { call: "POST /recycle-routes/tanks/${tank_id}/record-intake", payload: { gallons: 900 }, as: RoutePlanner }
            - { call: "POST /recycle-routes/routes", payload: { route_code: "HAL-1", scheduled_date: "2026-08-02", driver_id: "${drv_id}", vehicle_capacity_gallons: 2000, density_zone: "URBAN" }, as: RoutePlanner, captures: { r1_id: "$.data.id", r1_v: "$.data.version" } }
            - { call: "POST /recycle-routes/routes/${r1_id}/route-stops", payload: { tank_site_id: "${site_id}", tank_id: "${tank_id}", scheduled_window_start: "08:00", scheduled_window_end: "09:00", sequence: 1, estimated_volume_gallons: 100, expected_route_version: "${r1_v}" }, as: RoutePlanner, captures: { s1_id: "$.data.id" } }
            - { call: "POST /recycle-routes/routes/${r1_id}/dispatch", payload: {}, as: RoutePlanner }
            - { call: "POST /recycle-routes/route-stops/${s1_id}/arrive", payload: {}, as: Driver, as_user_id: "${drv_id}" }
            - { call: "POST /recycle-routes/route-stops/${s1_id}/begin-screening", payload: {}, as: Driver, as_user_id: "${drv_id}" }
            - { call: "POST /recycle-routes/route-stops/${s1_id}/sample-screenings", payload: { halogen_ppm: 5000, water_pct: 1.0, ph_level: 7.0 }, as: LabTech }
            # Tank is now QUARANTINED; clear it, top up volume back, run 4 more reject cycles via fresh stops/routes
            - { call: "POST /recycle-routes/tanks/${tank_id}/clear-quarantine", payload: {}, as: EHSOfficer }
            - { call: "POST /recycle-routes/routes", payload: { route_code: "HAL-2", scheduled_date: "2026-08-03", driver_id: "${drv_id}", vehicle_capacity_gallons: 2000, density_zone: "URBAN" }, as: RoutePlanner, captures: { r2_id: "$.data.id", r2_v: "$.data.version" } }
            - { call: "POST /recycle-routes/routes/${r2_id}/route-stops", payload: { tank_site_id: "${site_id}", tank_id: "${tank_id}", scheduled_window_start: "08:00", scheduled_window_end: "09:00", sequence: 1, estimated_volume_gallons: 100, expected_route_version: "${r2_v}" }, as: RoutePlanner, captures: { s2_id: "$.data.id" } }
            - { call: "POST /recycle-routes/routes/${r2_id}/dispatch", payload: {}, as: RoutePlanner }
            - { call: "POST /recycle-routes/route-stops/${s2_id}/arrive", payload: {}, as: Driver, as_user_id: "${drv_id}" }
            - { call: "POST /recycle-routes/route-stops/${s2_id}/begin-screening", payload: {}, as: Driver, as_user_id: "${drv_id}" }
            - { call: "POST /recycle-routes/route-stops/${s2_id}/sample-screenings", payload: { halogen_ppm: 5000, water_pct: 1.0, ph_level: 7.0 }, as: LabTech }
            - { call: "POST /recycle-routes/tanks/${tank_id}/clear-quarantine", payload: {}, as: EHSOfficer }
            - { call: "POST /recycle-routes/routes", payload: { route_code: "HAL-3", scheduled_date: "2026-08-04", driver_id: "${drv_id}", vehicle_capacity_gallons: 2000, density_zone: "URBAN" }, as: RoutePlanner, captures: { r3_id: "$.data.id", r3_v: "$.data.version" } }
            - { call: "POST /recycle-routes/routes/${r3_id}/route-stops", payload: { tank_site_id: "${site_id}", tank_id: "${tank_id}", scheduled_window_start: "08:00", scheduled_window_end: "09:00", sequence: 1, estimated_volume_gallons: 100, expected_route_version: "${r3_v}" }, as: RoutePlanner, captures: { s3_id: "$.data.id" } }
            - { call: "POST /recycle-routes/routes/${r3_id}/dispatch", payload: {}, as: RoutePlanner }
            - { call: "POST /recycle-routes/route-stops/${s3_id}/arrive", payload: {}, as: Driver, as_user_id: "${drv_id}" }
            - { call: "POST /recycle-routes/route-stops/${s3_id}/begin-screening", payload: {}, as: Driver, as_user_id: "${drv_id}" }
            - { call: "POST /recycle-routes/route-stops/${s3_id}/sample-screenings", payload: { halogen_ppm: 5000, water_pct: 1.0, ph_level: 7.0 }, as: LabTech }
            - { call: "POST /recycle-routes/tanks/${tank_id}/clear-quarantine", payload: {}, as: EHSOfficer }
            - { call: "POST /recycle-routes/routes", payload: { route_code: "HAL-4", scheduled_date: "2026-08-05", driver_id: "${drv_id}", vehicle_capacity_gallons: 2000, density_zone: "URBAN" }, as: RoutePlanner, captures: { r4_id: "$.data.id", r4_v: "$.data.version" } }
            - { call: "POST /recycle-routes/routes/${r4_id}/route-stops", payload: { tank_site_id: "${site_id}", tank_id: "${tank_id}", scheduled_window_start: "08:00", scheduled_window_end: "09:00", sequence: 1, estimated_volume_gallons: 100, expected_route_version: "${r4_v}" }, as: RoutePlanner, captures: { s4_id: "$.data.id" } }
            - { call: "POST /recycle-routes/routes/${r4_id}/dispatch", payload: {}, as: RoutePlanner }
            - { call: "POST /recycle-routes/route-stops/${s4_id}/arrive", payload: {}, as: Driver, as_user_id: "${drv_id}" }
            - { call: "POST /recycle-routes/route-stops/${s4_id}/begin-screening", payload: {}, as: Driver, as_user_id: "${drv_id}" }
            - { call: "POST /recycle-routes/route-stops/${s4_id}/sample-screenings", payload: { halogen_ppm: 5000, water_pct: 1.0, ph_level: 7.0 }, as: LabTech }
            - { call: "POST /recycle-routes/tanks/${tank_id}/clear-quarantine", payload: {}, as: EHSOfficer }
            - { call: "POST /recycle-routes/routes", payload: { route_code: "HAL-5", scheduled_date: "2026-08-06", driver_id: "${drv_id}", vehicle_capacity_gallons: 2000, density_zone: "URBAN" }, as: RoutePlanner, captures: { r5_id: "$.data.id", r5_v: "$.data.version" } }
            - { call: "POST /recycle-routes/routes/${r5_id}/route-stops", payload: { tank_site_id: "${site_id}", tank_id: "${tank_id}", scheduled_window_start: "08:00", scheduled_window_end: "09:00", sequence: 1, estimated_volume_gallons: 100, expected_route_version: "${r5_v}" }, as: RoutePlanner, captures: { s5_id: "$.data.id" } }
            - { call: "POST /recycle-routes/routes/${r5_id}/dispatch", payload: {}, as: RoutePlanner }
            - { call: "POST /recycle-routes/route-stops/${s5_id}/arrive", payload: {}, as: Driver, as_user_id: "${drv_id}" }
            - { call: "POST /recycle-routes/route-stops/${s5_id}/begin-screening", payload: {}, as: Driver, as_user_id: "${drv_id}" }
            - { call: "POST /recycle-routes/route-stops/${s5_id}/sample-screenings", payload: { halogen_ppm: 5000, water_pct: 1.0, ph_level: 7.0 }, as: LabTech }
            - { call: "POST /recycle-routes/tanks/${tank_id}/clear-quarantine", payload: {}, as: EHSOfficer }
            # halogen_violation_count is now 5. Now do two PASS pickups to produce SETTLED tickets
            - { call: "POST /recycle-routes/routes", payload: { route_code: "BLEND-A", scheduled_date: "2026-08-07", driver_id: "${drv_id}", vehicle_capacity_gallons: 2000, density_zone: "URBAN" }, as: RoutePlanner, captures: { ra_id: "$.data.id", ra_v: "$.data.version" } }
            - { call: "POST /recycle-routes/routes/${ra_id}/route-stops", payload: { tank_site_id: "${site_id}", tank_id: "${tank_id}", scheduled_window_start: "08:00", scheduled_window_end: "09:00", sequence: 1, estimated_volume_gallons: 100, expected_route_version: "${ra_v}" }, as: RoutePlanner, captures: { sa_id: "$.data.id" } }
            - { call: "POST /recycle-routes/routes/${ra_id}/dispatch", payload: {}, as: RoutePlanner }
            - { call: "POST /recycle-routes/route-stops/${sa_id}/arrive", payload: {}, as: Driver, as_user_id: "${drv_id}" }
            - { call: "POST /recycle-routes/route-stops/${sa_id}/begin-screening", payload: {}, as: Driver, as_user_id: "${drv_id}" }
            - { call: "POST /recycle-routes/route-stops/${sa_id}/sample-screenings", payload: { halogen_ppm: 10, water_pct: 1.0, ph_level: 7.0 }, as: LabTech }
            - { call: "POST /recycle-routes/route-stops/${sa_id}/pickup-tickets", payload: { client_request_id: "PT-A", metered_volume_gallons: 100 }, as: Driver, as_user_id: "${drv_id}", captures: { pta_id: "$.data.id" } }
            - { call: "GET /recycle-routes/customers/${cust_id}", payload: {}, as: SettlementClerk, captures: { cust_v_pre_settle_a: "$.data.version" } }
            - { call: "POST /recycle-routes/pickup-tickets/${pta_id}/settle", payload: { expected_customer_version: "${cust_v_pre_settle_a}" }, as: SettlementClerk, captures: { pta_after: "$.data.payment_status" } }
            - { call: "POST /recycle-routes/routes", payload: { route_code: "BLEND-B", scheduled_date: "2026-08-08", driver_id: "${drv_id}", vehicle_capacity_gallons: 2000, density_zone: "URBAN" }, as: RoutePlanner, captures: { rb_id: "$.data.id", rb_v: "$.data.version" } }
            - { call: "POST /recycle-routes/routes/${rb_id}/route-stops", payload: { tank_site_id: "${site_id}", tank_id: "${tank_id}", scheduled_window_start: "08:00", scheduled_window_end: "09:00", sequence: 1, estimated_volume_gallons: 100, expected_route_version: "${rb_v}" }, as: RoutePlanner, captures: { sb_id: "$.data.id" } }
            - { call: "POST /recycle-routes/routes/${rb_id}/dispatch", payload: {}, as: RoutePlanner }
            - { call: "POST /recycle-routes/route-stops/${sb_id}/arrive", payload: {}, as: Driver, as_user_id: "${drv_id}" }
            - { call: "POST /recycle-routes/route-stops/${sb_id}/begin-screening", payload: {}, as: Driver, as_user_id: "${drv_id}" }
            - { call: "POST /recycle-routes/route-stops/${sb_id}/sample-screenings", payload: { halogen_ppm: 10, water_pct: 1.0, ph_level: 7.0 }, as: LabTech }
            - { call: "POST /recycle-routes/route-stops/${sb_id}/pickup-tickets", payload: { client_request_id: "PT-B", metered_volume_gallons: 100 }, as: Driver, as_user_id: "${drv_id}", captures: { ptb_id: "$.data.id" } }
            - { call: "GET /recycle-routes/customers/${cust_id}", payload: {}, as: SettlementClerk, captures: { cust_v_pre_settle_b: "$.data.version" } }
            - { call: "POST /recycle-routes/pickup-tickets/${ptb_id}/settle", payload: { expected_customer_version: "${cust_v_pre_settle_b}" }, as: SettlementClerk }
          trigger:
            - { call: "POST /recycle-routes/blend-batches", payload: { batch_code: "BB-1", target_product: "RE_REFINED_BASE_OIL", input_pickup_ticket_ids: ["${pta_id}", "${ptb_id}"], resale_price_cents_per_gal: 120 }, as: RoutePlanner, captures: { bb_id: "$.data.id", bb_planned: "$.data.planned_output_gallons" } }
            - { call: "POST /recycle-routes/blend-batches/${bb_id}/start-blending", payload: {}, as: RoutePlanner, captures: { bb_actual_out: "$.data.output_gallons", bb_yield: "$.data.yield_pct" } }
          assert:
            - "planned_estimate variant: BlendBatch.${bb_id}.planned_output_gallons == 144 (base 72%, no halogen penalty, no mix penalty)"
            - "actual variant: avg_H = round_half_up((5*100 + 5*100) / 200) = 5"
            - "actual variant: penalty_pct = min(20, max(0, 2*(5-4))) = 2"
            - "actual variant: mix_penalty = 0 (both USED_OIL)"
            - "actual variant: yield_pct = 72 - 2 - 0 = 70"
            - "actual variant: BlendBatch.${bb_id}.output_gallons == 140"
            - "BlendBatch.${bb_id}.planned_output_gallons != BlendBatch.${bb_id}.output_gallons (144 != 140 — variants diverge)"

  # ==========================================================================
  # RULE 2 — combinatorial_formula (different modes from {(a),(b),(c)})
  # ==========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: settlement_amount_tiered_surcharge_and_zone_fee
        grounds:
          - calculations.settlement_amount
        distinguishing_aspect: |
          Mode (a) — non-linear multi-input formula with tiered-rate selection
          (halogen surcharge tier by violation count) nested inside conditional
          branches on sign of market price, plus min/max on density fee.
          >=3 inputs interact non-linearly.
        test_recipe:
          setup:
            - "Customer with halogen_violation_count=5 (driven by 5 prior halogen rejects)"
            - "TankSite density_zone=RURAL (zone_min=150, density_fee=10c/gal), override=false"
            - "Tank ANTIFREEZE (signed price allowed)"
            - "MarketPrice (SOUTH, ANTIFREEZE, 2026-08-01) = -20c/gal (we charge customer)"
            - "Route scheduled 2026-08-05 in RURAL; pickup of metered=100 (below zone_min of 150)"
          setup_api_calls:
            - { call: "POST /recycle-routes/customers", payload: { legal_name: "Rural AF", epa_generator_id: "EPAGEN000010", market_zone: "SOUTH", credit_terms: "CHARGE_ONLY" }, as: RoutePlanner, captures: { cust_id: "$.data.id" } }
            - { call: "POST /recycle-routes/tank-sites", payload: { customer_id: "${cust_id}", site_address: "Rural Route 1", density_zone: "RURAL" }, as: RoutePlanner, captures: { site_id: "$.data.id" } }
            - { call: "POST /recycle-routes/tanks", payload: { tank_site_id: "${site_id}", tank_kind: "ANTIFREEZE", capacity_gallons: 500, ownership: "CUSTOMER_OWNED" }, as: TankInstaller, captures: { tank_id: "$.data.id" } }
            - { call: "POST /recycle-routes/tanks/${tank_id}/register-existing", payload: {}, as: TankInstaller }
            - { call: "POST /recycle-routes/tanks/${tank_id}/record-intake", payload: { gallons: 400 }, as: RoutePlanner }
            - { call: "POST /recycle-routes/customers/${cust_id}/activate", payload: {}, as: RoutePlanner }
            - { call: "POST /recycle-routes/drivers", payload: { driver_name: "Hal", cdl_class: "A", hazmat_endorsement: true }, as: RoutePlanner, captures: { drv_id: "$.data.id" } }
            - { call: "POST /recycle-routes/market-prices", payload: { market_zone: "SOUTH", tank_kind: "ANTIFREEZE", effective_date: "2026-08-01", price_cents_per_gal: -20 }, as: Regulator }
            # Drive halogen_violation_count to 5 via 5 halogen-reject cycles
            - { call: "POST /recycle-routes/routes", payload: { route_code: "H1", scheduled_date: "2026-08-02", driver_id: "${drv_id}", vehicle_capacity_gallons: 500, density_zone: "RURAL" }, as: RoutePlanner, captures: { r1: "$.data.id", r1v: "$.data.version" } }
            - { call: "POST /recycle-routes/routes/${r1}/route-stops", payload: { tank_site_id: "${site_id}", tank_id: "${tank_id}", scheduled_window_start: "08:00", scheduled_window_end: "09:00", sequence: 1, estimated_volume_gallons: 100, expected_route_version: "${r1v}" }, as: RoutePlanner, captures: { s1: "$.data.id" } }
            - { call: "POST /recycle-routes/routes/${r1}/dispatch", payload: {}, as: RoutePlanner }
            - { call: "POST /recycle-routes/route-stops/${s1}/arrive", payload: {}, as: Driver, as_user_id: "${drv_id}" }
