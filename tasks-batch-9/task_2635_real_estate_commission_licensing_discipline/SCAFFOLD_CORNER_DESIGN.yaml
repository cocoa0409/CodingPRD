            - "the third failure moves license_status to DENIED with exam_attempt_count == 3 and exam_best_score == 74"
            - "the fourth attempt returns 409 ERR_EXAM_ATTEMPTS_EXHAUSTED - not ERR_INVALID_STATE, per the priority 9 carve-out"
            - "Licensee.${sam_id}.exam_attempt_count is still 3, exam_best_score is still 74, exam_passed_at is still null and license_status is still DENIED - a passing score cannot resurrect a DENIED applicant"
