      - name: serial_mismatch_then_rejection_locks_the_heat_and_quarantines_its_wire
        claim_type: Error triggerable
        grounds:
          - errors[ERR_MILL_CERT_SERIAL_MISMATCH]
          - errors[ERR_INVALID_HEAT_STATE]
          - errors[ERR_INVALID_WIRE_LOT_STATE]
          - state_machines[SteelHeat.cert_status].PENDING_to_REJECTED
        distinguishing_aspect: >
          A verification presenting the wrong serial is a 422 counterfeit signal that leaves cert_status
          PENDING at version 1; the subsequent REJECTED verification is terminal, so both a second verify
          and a flag-counterfeit answer ERR_INVALID_HEAT_STATE, and the wire lot quarantined by that
          rejection (quarantine_source HEAT_REJECTED) can no longer be released.
        test_recipe:
          setup:
            - "Heat H-88001 with mill_cert_serial MC-2026-000900 in cert_status PENDING and one DRAWN wire lot on it."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T06:00:00Z" }
              as: QualityInspector
            - call: "POST /steel-heats"
              payload: { heat_number: "H-88001", mill_code: "MC-A", grade: "SAE_10B21", carbon_pct: 0.21, boron_ppm: 25, gross_mass_kg: 400.0, mill_cert_serial: "MC-2026-000900" }
              as: QualityInspector
              as_user_id: "insp-1"
              captures: { heat_id: $.data.id }
            - call: "POST /wire-lots"
              payload: { steel_heat_id: "${heat_id}", draw_pass_count: 3, inlet_diameter_mm: 8.00, outlet_diameter_mm: 6.80, lubricant_coating: "PHOSPHATE", coating_weight_gsm: 4.5, gross_mass_kg: 400.0 }
              as: ProcessEngineer
              captures: { wire_id: $.data.id }
          trigger:
            - call: "POST /steel-heats/${heat_id}/verify-mill-cert"
              payload: { outcome: "VERIFIED", mill_cert_serial: "MC-2026-000901", lab_report_reference: "LAB-0007" }
              as: QualityInspector
              as_user_id: "insp-1"
              captures: { mismatch_err: $.data.error_id }
            - call: "POST /steel-heats/${heat_id}/verify-mill-cert"
              payload: { outcome: "REJECTED", mill_cert_serial: "MC-2026-000900", lab_report_reference: "LAB-0008" }
              as: QualityInspector
              as_user_id: "insp-1"
            - call: "POST /steel-heats/${heat_id}/verify-mill-cert"
              payload: { outcome: "VERIFIED", mill_cert_serial: "MC-2026-000900", lab_report_reference: "LAB-0009" }
              as: QualityInspector
              as_user_id: "insp-1"
              captures: { reverify_err: $.data.error_id }
            - call: "POST /steel-heats/${heat_id}/flag-counterfeit"
              payload: { reason: "ANONYMOUS_TIP" }
              as: QualityManager
              as_user_id: "qm-2"
              captures: { flag_err: $.data.error_id }
            - call: "POST /wire-lots/${wire_id}/release"
              payload: {}
              as: QualityInspector
              as_user_id: "insp-1"
              captures: { release_err: $.data.error_id }
          assert:
            - "The mismatched verification returns 422 ERR_MILL_CERT_SERIAL_MISMATCH; SteelHeat.${heat_id}.cert_status is still PENDING at version 1 and WireLot.${wire_id}.status is still DRAWN"
            - "The REJECTED verification returns 200: cert_status REJECTED, version 2, and WireLot.${wire_id}.status == QUARANTINED with quarantine_source HEAT_REJECTED at version 2"
            - "The second verification returns 409 ERR_INVALID_HEAT_STATE — REJECTED is terminal"
            - "flag-counterfeit on the REJECTED heat returns 409 ERR_INVALID_HEAT_STATE (it needs PENDING or VERIFIED)"
            - "Releasing the quarantined wire returns 409 ERR_INVALID_WIRE_LOT_STATE from priority 10, before any lubrication or reduction check"

      - name: unverified_heat_blocks_wire_release_ahead_of_the_lubrication_check
        claim_type: Priority conflict
        grounds:
          - errors[ERR_STEEL_HEAT_NOT_VERIFIED]
          - validations[priority=11, error_id=ERR_STEEL_HEAT_NOT_VERIFIED]
          - validations[priority=13, error_id=ERR_LUBRICATION_INSUFFICIENT]
        distinguishing_aspect: >
          Wire drawn from a PENDING heat and coated with nothing violates priority 11 and priority 13 at
          once; the response is ERR_STEEL_HEAT_NOT_VERIFIED (409), and only after the heat is verified does
          the same call surface ERR_LUBRICATION_INSUFFICIENT (422). A heat flagged SUSPECTED_COUNTERFEIT
          blocks release the same way for wire drawn after the flag, which the cascade never touched.
        test_recipe:
          setup:
            - "Heat H-88010 (serial MC-2026-000910) left PENDING, with wire lot W-BAD coated NONE at 0.0 g/m2."
            - "Heat H-88011 (serial MC-2026-000911) verified then flagged SUSPECTED_COUNTERFEIT, with wire lot W-LATE drawn after the flag."
