# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http: 400
    condition: "X-User-ID or X-User-Role header is missing or malformed"

  - id: ERR_FORBIDDEN_FOR_ROLE
    http: 403
    condition: "Caller role is valid but not allowed for this endpoint"

  - id: ERR_NOT_FOUND
    http: 404
    condition: "Resource ID does not exist"

  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body, negative/zero amounts, invalid enum"

  - id: ERR_INVALID_STATE
    http: 409
    condition: "Resource is in wrong state for requested operation"

  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_case_version does not match current ConciergeCase.version"

  - id: ERR_CASE_FROZEN
    http: 409
    condition: "ConciergeCase posture is FROZEN; homeowner action blocked"

  - id: ERR_PROJECT_NOT_APPROVED
    http: 409
    condition: "Vendor engagement requires an APPROVED improvement project"

  - id: ERR_ADVANCE_LIMIT_EXCEEDED
    http: 409
    condition: "Operation would exceed the case advance limit"

  - id: ERR_DISPUTE_ACTIVE
    http: 409
    condition: "Disbursement release blocked by active dispute on engagement"

  - id: ERR_VENDOR_CAPACITY_EXCEEDED
    http: 409
    condition: "Vendor capacity window cannot cover engagement dates or crew-days"

  - id: ERR_LISTING_EVENT_ORDER
    http: 409
    condition: "Listing event sequence violation"

  - id: ERR_LISTING_WINDOW_NOT_ELAPSED
    http: 409
    condition: "CLOSED_UNSOLD requires the listing window to have elapsed"

  - id: ERR_DISPUTE_NOT_TERMINAL
    http: 409
    condition: "Closing statement finalization blocked by non-terminal disputes"

  - id: ERR_DUPLICATE_LISTED_EVENT
    http: 409
    condition: "A LISTED event already exists for this case"

  - id: ERR_NO_APPROVED_PROJECTS
    http: 409
    condition: "Plan approval requires at least one APPROVED project"

  - id: ERR_ELIGIBILITY_FAILED
    http: 409
    condition: "Eligibility preconditions not met (equity ratio, listing agreement, disclosure)"

  - id: ERR_ENGAGEMENT_HAS_RELEASED_DISBURSEMENT
    http: 409
    condition: "Cannot cancel engagement with RELEASED disbursements"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "System administrator for reference data (agents, vendors, capacity windows, clock)"
    identity: opaque
    exclusive_operations:
      - "POST /concierge/agents"
      - "POST /concierge/vendors"
      - "POST /concierge/vendors/{id}/capacity-windows"
      - "POST /_clock/set_current_utc"

  - name: ListingAgent
    description: "Real-estate agent who creates cases, recommends projects, and records listing events"
    identity: entity_backed:Agent
    exclusive_operations:
      - "POST /concierge/cases"
      - "POST /concierge/cases/{id}/projects"
      - "POST /concierge/cases/{id}/projects/{id}/propose"
      - "POST /concierge/cases/{id}/projects/{id}/verify"
      - "POST /concierge/cases/{id}/listing-events"
      - "POST /concierge/engagements"
    shared_operations:
      - "GET endpoints"

  - name: Homeowner
    description: "Property owner who approves plans, projects, change orders, and pays closing statements"
    identity: opaque
    exclusive_operations:
      - "POST /concierge/cases/{id}/plan/approve"
      - "POST /concierge/cases/{id}/projects/{id}/approve"
      - "POST /concierge/cases/{id}/projects/{id}/cancel"
      - "POST /concierge/cases/{id}/cancel"
      - "POST /concierge/change-orders/{id}/approve"
      - "POST /concierge/change-orders/{id}/reject"
      - "POST /concierge/engagements/{id}/cancel"
      - "POST /concierge/disputes/{id}/withdraw"
      - "POST /concierge/closing-statements/{id}/pay"
    shared_operations:
      - "POST /concierge/disputes (create)"

  - name: Vendor
    description: "Contractor who starts/completes engagements and files change orders"
    identity: entity_backed:Vendor
    exclusive_operations:
      - "POST /concierge/engagements/{id}/start"
      - "POST /concierge/engagements/{id}/complete"
      - "POST /concierge/change-orders"
    shared_operations:
      - "POST /concierge/disputes (create)"

  - name: ProgramUnderwriter
    description: "Program staff who approve eligibility, disbursements, review disputes, and finalize closing statements"
    identity: opaque
    exclusive_operations:
      - "POST /concierge/cases/{id}/eligibility/approve"
      - "POST /concierge/cases/{id}/eligibility/reject"
      - "POST /concierge/disbursements"
      - "POST /concierge/disbursements/{id}/approve"
      - "POST /concierge/disbursements/{id}/release"
      - "POST /concierge/disbursements/{id}/void"
      - "POST /concierge/disputes/{id}/review"
      - "POST /concierge/disputes/{id}/resolve"
      - "POST /concierge/closing-statements/{id}/finalize"
      - "POST /concierge/closing-statements/{id}/waive"

  - name: Any
    description: "Shared read access"
    identity: opaque
    shared_operations:
      - "GET /concierge/agents/{id}"
      - "GET /concierge/vendors/{id}"
      - "GET /concierge/vendors"
      - "GET /concierge/vendors/{id}/capacity-windows"
      - "GET /concierge/vendors/{id}/engagements"
      - "GET /concierge/cases/{id}"
      - "GET /concierge/cases"
      - "GET /concierge/cases/{id}/projects"
      - "GET /concierge/cases/{id}/projects/{id}"
      - "GET /concierge/cases/{id}/listing-events"
      - "GET /concierge/cases/{id}/closing-statement"
      - "GET /concierge/cases/{id}/disbursements"
      - "GET /concierge/cases/{id}/disputes"
      - "GET /concierge/engagements/{id}"
      - "GET /concierge/engagements"
      - "GET /concierge/engagements/{id}/disputes"
      - "GET /concierge/projects/{id}/engagements"
      - "GET /concierge/projects/{id}/change-orders"
      - "GET /concierge/projects/{id}/disputes"
      - "GET /concierge/disbursements/{id}"
      - "GET /concierge/disbursements"
      - "GET /concierge/change-orders/{id}"
      - "GET /concierge/change-orders"
      - "GET /concierge/disputes/{id}"
      - "GET /concierge/disputes"
