      - name: transfers_to_insolvent_and_to_delinquent_with_orphans_are_both_rejected
        claim_type: Conditional validation
        grounds:
          - validations[priority 63].ERR_TRANSFER_TO_INSOLVENT_OPERATOR
        distinguishing_aspect: |
          The rule has two limbs and the second is conditional on a computed count, not on a state
          alone: an INSOLVENT transferee is refused outright, a DELINQUENT transferee is refused only
          because it already carries an orphan candidate, and an ACTIVE transferee with adequate bond
          is accepted. A state-list-only implementation accepts the DELINQUENT case.
