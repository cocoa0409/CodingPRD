          Each precondition of DECLARED -> SURGE_ACTIVE is isolated to its own error, and the FIRST probe
          violates BOTH at once (no ACTIVE block and a stale snapshot) — the housing precondition is declared
          first, so ERR_NO_ACTIVE_HOUSING must win, not ERR_LOSS_ESTIMATE_STALE. Opening the block then
          leaves exactly one gate failing and flips the error to ERR_LOSS_ESTIMATE_STALE. The staleness is
          produced the only way the scaffold allows: a snapshot taken at high-water 0 and then overtaken by
          the INITIAL_CASE ReserveEntry that triage appends.
        test_recipe:
          setup:
            - "Clock at the 2026-08-01T00:00:00Z startup default."
