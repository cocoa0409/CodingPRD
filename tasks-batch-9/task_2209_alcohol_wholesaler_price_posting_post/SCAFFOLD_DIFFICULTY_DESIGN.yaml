          The edge probed here is a zero count rather than a numeric threshold, and it is read through
          POST /retailer-invoices/{id}/validate rather than through an assessment: at cases_quantity 0 the depletion
          cap is 0 * 150 = 0 and the eligible tier set is empty, so a single cent of depletion allowance is wholly
          excess and flags a line whose charged prices match the posted prices exactly (variance_cents 0,
