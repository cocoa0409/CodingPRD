              captures: { ll1_id: $.data.id }
            - call: "POST /licenses/${ll1_id}/submit"
              payload: {}
              as: Owner
              as_user_id: "${ol_id}"
            - call: "POST /licenses/${ll1_id}/start-review"
              payload: {}
              as: LicensingClerk
            - call: "POST /licenses/${ll1_id}/request-vaccination-proof"
              payload: {}
              as: LicensingClerk
            - call: "POST /licenses/${ll1_id}/attach-vaccination"
              payload: { vaccination_record_id: "${vl_id}" }
              as: Owner
              as_user_id: "${ol_id}"
            - call: "POST /licenses/${ll1_id}/approve"
              payload: {}
              as: LicensingClerk
            - call: "POST /licenses/${ll1_id}/issue-tag"
              payload: {}
              as: LicensingClerk
            # second license for SAME pet
            - call: "POST /licenses"
              payload: { owner_id: "${ol_id}", pet_id: "${pl_id}", license_kind: "INDIVIDUAL", term_years: 1 }
              as: Owner
              as_user_id: "${ol_id}"
              captures: { ll2_id: $.data.id }
            - call: "POST /licenses/${ll2_id}/submit"
              payload: {}
              as: Owner
              as_user_id: "${ol_id}"
            - call: "POST /licenses/${ll2_id}/start-review"
              payload: {}
              as: LicensingClerk
            - call: "POST /licenses/${ll2_id}/request-vaccination-proof"
              payload: {}
              as: LicensingClerk
            - call: "POST /licenses/${ll2_id}/attach-vaccination"
              payload: { vaccination_record_id: "${vl_id}" }
              as: Owner
              as_user_id: "${ol_id}"
            - call: "POST /licenses/${ll2_id}/approve"
              payload: {}
              as: LicensingClerk
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LicensingClerk
          trigger:
            - call: "POST /licenses/${ll2_id}/issue-tag"
              payload: {}
              as: LicensingClerk
              captures: { err: $.data.error_id }
          assert:
