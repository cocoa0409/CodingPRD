      - name: a_new_plan_starting_exactly_when_the_old_one_ends_still_conflicts
        claim_type: Correct Result
        grounds:
          - calculations.rollout_window_exclusivity.formula
          - errors.ERR_ROLLOUT_WINDOW_CONFLICT
        distinguishing_aspect: "Rollout occupancy is a CLOSED interval, so a second plan whose scheduled_start_at equals the first plan's projected_end_at 2026-08-08T00:00:00Z is refused with ERR_ROLLOUT_WINDOW_CONFLICT - the exact opposite of the half-open review-window rule where touching endpoints are legal."
