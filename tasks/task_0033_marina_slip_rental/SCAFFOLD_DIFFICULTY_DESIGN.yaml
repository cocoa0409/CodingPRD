              as: HarborMaster
              captures: { tj_id: $.data.id }
            - call: "POST /tenants"
              payload: { email: "tk@x.com", full_name: "T K" }
              as: HarborMaster
              captures: { tk_id: $.data.id }
            - call: "POST /tenants"
              payload: { email: "tl@x.com", full_name: "T L" }
              as: HarborMaster
              captures: { tl_id: $.data.id }
            - call: "POST /tenants/${tj_id}/liveaboard-applications"
              payload: { marina_id: "${mar_id}" }
              as: Tenant
              as_user_id: "${tj_id}"
            - call: "POST /tenants/${tj_id}/liveaboard-approve"
              payload: { marina_id: "${mar_id}" }
              as: HarborMaster
            - call: "POST /tenants/${tk_id}/liveaboard-applications"
              payload: { marina_id: "${mar_id}" }
              as: Tenant
              as_user_id: "${tk_id}"
            - call: "POST /tenants/${tk_id}/liveaboard-approve"
              payload: { marina_id: "${mar_id}" }
              as: HarborMaster
            - call: "POST /tenants/${tl_id}/liveaboard-applications"
              payload: { marina_id: "${mar_id}" }
              as: Tenant
              as_user_id: "${tl_id}"
          trigger:
            - call: "POST /tenants/${tl_id}/liveaboard-approve"
              payload: { marina_id: "${mar_id}" }
              as: HarborMaster
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == \"ERR_LIVEABOARD_QUOTA_EXCEEDED\""
            - "Marina.${mar_id}.liveaboard_current_count == 2"

  # =====================================================================
  # Rule 9 — compensating_invariant
  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: cancel_reserved_lease_restores_slip_availability
        grounds:
          - state_machines.Lease.RESERVED_to_CANCELLED
          - state_machines.Slip.RESERVED_to_AVAILABLE
        distinguishing_aspect: |
          Conserved quantity: number of AVAILABLE slips at the marina,
          measured as |{Slip in marina with status==AVAILABLE}|. The
          forward action (POST /leases) decrements this by 1 (slip goes
          AVAILABLE -> RESERVED). The compensating action (POST
          /leases/{id}/cancel) restores it by 1 (RESERVED -> AVAILABLE).
          After the pair runs, the count equals its pre-pair value. The
          conserved quantity here is a COUNT OF SLOTS.
        test_recipe:
          setup:
            - "Marina HMQ with two slips S1, S2 both AVAILABLE (count_available = 2). Tenant TM with valid vessel."
          setup_api_calls:
            - call: "POST /marinas"
              payload: { name: "HMQ", harbor_code: "HMQ", liveaboard_cap: 1 }
              as: HarborMaster
              captures: { mar_id: $.data.id }
            - call: "POST /marinas/${mar_id}/slips"
              payload: { slip_number: "Q-1", length_ft: 50, beam_ft: 15, power_amp: "A50", base_daily_rate_cents: 5000 }
              as: HarborMaster
              captures: { slip_1_id: $.data.id, slip_1_v0: $.data.version }
            - call: "POST /marinas/${mar_id}/slips"
              payload: { slip_number: "Q-2", length_ft: 50, beam_ft: 15, power_amp: "A50", base_daily_rate_cents: 5000 }
              as: HarborMaster
              captures: { slip_2_id: $.data.id }
            - call: "POST /tenants"
              payload: { email: "tm@x.com", full_name: "T M" }
              as: HarborMaster
              captures: { tm_id: $.data.id }
            - call: "POST /vessels"
              payload: { tenant_id: "${tm_id}", name: "VM", loa_ft: 40, beam_ft: 12, insurance_policy_number: "PM", insurance_expires_on: "2027-01-01", insurance_coverage_cents: 6000000 }
              as: Tenant
              as_user_id: "${tm_id}"
              captures: { vm_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: HarborMaster
            - call: "POST /leases"
              payload: { marina_id: "${mar_id}", slip_id: "${slip_1_id}", tenant_id: "${tm_id}", vessel_id: "${vm_id}", start_date: "2026-07-10", end_date: "2026-07-15", expected_slip_version: "${slip_1_v0}" }
              as: Tenant
              as_user_id: "${tm_id}"
              captures: { lease_m_id: $.data.id }
          trigger:
            - call: "POST /leases/${lease_m_id}/cancel"
              payload: {}
              as: Tenant
              as_user_id: "${tm_id}"
          assert:
            - "Lease.${lease_m_id}.status == \"CANCELLED\""
            - "Slip.${slip_1_id}.status == \"AVAILABLE\""
            - "Slip.${slip_2_id}.status == \"AVAILABLE\""

      - name: revoke_then_reapprove_preserves_marina_counter
        grounds:
          - state_machines.Tenant.APPROVED_to_REVOKED
          - state_machines.Tenant.REVOKED_to_PENDING
          - state_machines.Tenant.PENDING_to_APPROVED
        distinguishing_aspect: |
          A DIFFERENT conserved quantity:
          Marina.liveaboard_current_count. Pre-pair value is N; the
          forward+compensating sequence revoke (decrement) -> re-apply ->
          re-approve (increment) leaves the count at N. The conservation
          target is a COUNTER (liveaboard headcount), not a count-of-slots
          — different type from instance 1.
        test_recipe:
          setup:
            - "Marina HMR cap=3; Tenant TN APPROVED; count = 1."
          setup_api_calls:
            - call: "POST /marinas"
              payload: { name: "HMR", harbor_code: "HMR", liveaboard_cap: 3 }
              as: HarborMaster
              captures: { mar_id: $.data.id }
            - call: "POST /tenants"
              payload: { email: "tn@x.com", full_name: "T N" }
              as: HarborMaster
              captures: { tn_id: $.data.id }
            - call: "POST /tenants/${tn_id}/liveaboard-applications"
              payload: { marina_id: "${mar_id}" }
              as: Tenant
              as_user_id: "${tn_id}"
            - call: "POST /tenants/${tn_id}/liveaboard-approve"
              payload: { marina_id: "${mar_id}" }
              as: HarborMaster
          trigger:
            - call: "POST /tenants/${tn_id}/liveaboard-revoke"
              payload: { marina_id: "${mar_id}" }
              as: HarborMaster
            - call: "POST /tenants/${tn_id}/liveaboard-applications"
              payload: { marina_id: "${mar_id}" }
              as: Tenant
              as_user_id: "${tn_id}"
            - call: "POST /tenants/${tn_id}/liveaboard-approve"
              payload: { marina_id: "${mar_id}" }
              as: HarborMaster
          assert:
            - "Tenant.${tn_id}.liveaboard_status == \"APPROVED\""
            - "Marina.${mar_id}.liveaboard_current_count == 1"
