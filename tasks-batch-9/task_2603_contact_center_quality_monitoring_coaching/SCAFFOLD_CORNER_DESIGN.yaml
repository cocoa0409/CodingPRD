              payload: { agent_id: "${ag1}", channel: "CHAT", started_at: "2026-08-03T12:00:00Z", ended_at: "2026-08-03T12:10:00Z", required_disclosures: ["RECORDING"], customer_flagged: true, csat_score: 2, repeat_contact_within_72h: true }
              as: QualityManager
              captures: { i2: $.data.id }
            - call: "POST /interactions/${i2}/consent-review"
              payload: { consent_outcome: "VERIFIED", captured_disclosures: ["RECORDING"] }
              as: ComplianceAuditor
