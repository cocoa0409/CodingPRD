    roles: [PlatformAdmin, StateRegulator, FacilityStaff, AccountHolder, RecipientParty, ComplianceOfficer]
    code: 200
    input: ["facility_id?", "inmate_id?", "funding_model?", "status?", "escheat_status?", "limit?", "offset?"]
    output: "Account[]"
    side_effects: []
