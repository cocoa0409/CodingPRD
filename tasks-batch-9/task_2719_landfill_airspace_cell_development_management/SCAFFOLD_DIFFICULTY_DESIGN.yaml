      - name: leachate_surcharge_tier_keyed_on_pre_surcharge_subtotal
        grounds:
          - calculations.leachate_disposal_invoice
          - entities.LeachateShipment.fields.treatment_fee
          - entities.LeachateShipment.fields.surcharge_pct
          - entities.LeachateShipment.fields.invoice_total
          - entities.TreatmentAgreement.fields.base_haul_fee
          - entities.TreatmentAgreement.fields.treatment_rate_per_kgal
          - state_machines.LeachateShipment.DISPATCHED_to_ACCEPTED
        distinguishing_aspect: |
          The surcharge tier is selected from the pre-surcharge subtotal (treatment fee plus
          haul fee), not from the invoice total the surcharge then produces. At 13280 gallons
          the subtotal is 1180.00, which sits in the 0.06 band and yields 1250.80; keying the
          lookup off the final total 1298.00 would land in the 0.10 band and produce 1298.00.
          Both numbers are reachable from the same inputs, so only the pinned evaluation
          order distinguishes them.
        test_recipe:
          setup:
            - "Landfill LF registered."
            - "TreatmentAgreement TA ACTIVE with daily_gallon_cap 20000, concurrent_slot_capacity 2, base_haul_fee 350.00 and treatment_rate_per_kgal 62.50."
            - "No other shipment exists under TA, so neither the slot nor the daily gallon check binds."
            - "Logical clock at its startup default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /landfills"
              payload: { name: "Ridgeview MSW", permit_number: "MSW-4417", permitted_total_airspace_cy: 5000000, design_footprint_sf: 400000, planned_density_tons_per_cy: 0.90, annual_tonnage_forecast: 300000, daily_load_limit: 200 }
              as: PlatformAdmin
              captures: { lf_id: $.data.id }
            - call: "POST /treatment-agreements"
              payload: { landfill_id: "${lf_id}", facility_name: "Valley POTW", daily_gallon_cap: 20000, concurrent_slot_capacity: 2, base_haul_fee: 350.00, treatment_rate_per_kgal: 62.50, effective_from: "2026-01-01T00:00:00Z", expires_on: "2027-01-01T00:00:00Z" }
              as: EnvironmentalManager
              as_user_id: "env-manager-1"
              captures: { ta_id: $.data.id }
          trigger:
            - call: "POST /leachate-shipments"
              payload: { treatment_agreement_id: "${ta_id}", gallons: 13280, window_start: "2026-08-01T02:00:00Z", window_end: "2026-08-01T04:00:00Z" }
              as: SiteOperator
              as_user_id: "${lf_id}"
              captures: { sh_id: $.data.id, fee: $.data.treatment_fee, pct: $.data.surcharge_pct }
            - call: "POST /leachate-shipments/${sh_id}/dispatch"
              payload: { hauler_ref: "TNK-77" }
              as: SiteOperator
              as_user_id: "${lf_id}"
            - call: "POST /leachate-shipments/${sh_id}/confirm-acceptance"
              payload: {}
              as: SiteOperator
              as_user_id: "${lf_id}"
              captures: { total: $.data.invoice_total }
          assert:
            - "${fee} == 830.00 (13280 / 1000 * 62.50)"
            - "${pct} == 0.06, selected from the pre-surcharge subtotal 1180.00 which is under the 1200.00 ceiling"
            - "${total} == 1250.80 (1180.00 plus surcharge 70.80)"
            - "${total} != 1298.00, which is what keying the tier off the final invoice total would give"
            - "LeachateShipment.${sh_id}.status == 'ACCEPTED'"
            - "TreatmentAgreement.${ta_id}.scheduled_gallons_today == 13280 (the window falls on the logical-clock date 2026-08-01)"

  - rule_id: non_linear_state_machine
    instances:

      - name: liner_qa_return_resubmit_cycle_rejects_cell_on_third_round
        grounds:
          - state_machines.LinerQaPackage.SUBMITTED_to_UNDER_REVIEW
          - state_machines.LinerQaPackage.UNDER_REVIEW_to_RETURNED
          - state_machines.LinerQaPackage.RETURNED_to_SUBMITTED
          - state_machines.LinerQaPackage.UNDER_REVIEW_to_REJECTED
          - state_machines.Cell.QA_REVIEW_to_UNDER_CONSTRUCTION
          - state_machines.Cell.QA_REVIEW_to_REJECTED
          - entities.LinerQaPackage.fields.revision_round
        distinguishing_aspect: |
          The package loops SUBMITTED -> UNDER_REVIEW -> RETURNED -> SUBMITTED and drags the
          parent Cell backwards with it (QA_REVIEW -> UNDER_CONSTRUCTION -> QA_REVIEW), so the
          same two entities visit the same states three times. The identical trigger
          POST .../return resolves to RETURNED on rounds 1 and 2 but to REJECTED on round 3,
          and the loop terminates by driving the Cell into its terminal REJECTED state — the
          cycle has a bounded loop counter, not a free revert.
        test_recipe:
          setup:
            - "Landfill LF registered."
            - "Cell C-1 in UNDER_CONSTRUCTION."
            - "LinerQaPackage QA-1 submitted with revision_round at its default 1 and qa_conformance_score 80.00 (below the 85.0 approval threshold), so returning is the only reviewer option."
          setup_api_calls:
            - call: "POST /landfills"
              payload: { name: "Ridgeview MSW", permit_number: "MSW-4417", permitted_total_airspace_cy: 5000000, design_footprint_sf: 400000, planned_density_tons_per_cy: 0.90, annual_tonnage_forecast: 300000, daily_load_limit: 200 }
              as: PlatformAdmin
              captures: { lf_id: $.data.id }
            - call: "POST /cells"
              payload: { landfill_id: "${lf_id}", cell_code: "C-1", design_airspace_cy: 1000000, design_area_sf: 120001, liner_type: "DOUBLE_COMPOSITE", construction_start_date: "2026-06-01T00:00:00Z", construction_end_date: "2026-07-15T00:00:00Z" }
              as: SiteOperator
              as_user_id: "${lf_id}"
              captures: { c1_id: $.data.id }
            - call: "POST /cells/${c1_id}/begin-construction"
              payload: {}
              as: SiteOperator
              as_user_id: "${lf_id}"
            - call: "POST /liner-qa-packages"
              payload: { cell_id: "${c1_id}", seam_length_ft: 4000, destructive_test_count: 20, passing_test_count: 16, panel_count: 40, defect_count: 2 }
              as: SiteOperator
              as_user_id: "${lf_id}"
              captures: { qa_id: $.data.id, score0: $.data.qa_conformance_score, round0: $.data.revision_round }
          trigger:
            - call: "POST /liner-qa-packages/${qa_id}/begin-review"
              payload: {}
              as: CqaEngineer
              as_user_id: "cqa-engineer-2"
            - call: "POST /liner-qa-packages/${qa_id}/return"
              payload: { return_note: "Seam log incomplete on panels 12-18." }
              as: CqaEngineer
              as_user_id: "cqa-engineer-2"
              captures: { st1: $.data.status, round1: $.data.revision_round }
            - call: "POST /liner-qa-packages/${qa_id}/resubmit"
              payload: { seam_length_ft: 4000, destructive_test_count: 20, passing_test_count: 16, panel_count: 40, defect_count: 2 }
              as: SiteOperator
              as_user_id: "${lf_id}"
              captures: { st2: $.data.status, reviewer2: $.data.reviewed_by_user_id }
            - call: "POST /liner-qa-packages/${qa_id}/begin-review"
              payload: {}
              as: CqaEngineer
              as_user_id: "cqa-engineer-2"
            - call: "POST /liner-qa-packages/${qa_id}/return"
              payload: { return_note: "Destructive test coverage still short." }
              as: CqaEngineer
              as_user_id: "cqa-engineer-2"
              captures: { st3: $.data.status, round3: $.data.revision_round }
            - call: "POST /liner-qa-packages/${qa_id}/resubmit"
              payload: { seam_length_ft: 4000, destructive_test_count: 20, passing_test_count: 16, panel_count: 40, defect_count: 2 }
              as: SiteOperator
              as_user_id: "${lf_id}"
            - call: "POST /liner-qa-packages/${qa_id}/begin-review"
              payload: {}
              as: CqaEngineer
              as_user_id: "cqa-engineer-2"
            - call: "POST /liner-qa-packages/${qa_id}/return"
              payload: { return_note: "Third round exhausted; liner not certifiable." }
              as: CqaEngineer
              as_user_id: "cqa-engineer-2"
              captures: { st4: $.data.status, round4: $.data.revision_round }
            - call: "POST /liner-qa-packages/${qa_id}/begin-review"
              payload: {}
              as: CqaEngineer
              as_user_id: "cqa-engineer-2"
          assert:
            - "${score0} == 80.00 and ${round0} == 1"
            - "${st1} == 'RETURNED' and ${round1} == 2, and Cell.${c1_id}.status == 'UNDER_CONSTRUCTION' after this call"
            - "${st2} == 'SUBMITTED' and ${reviewer2} is null, and Cell.${c1_id}.status == 'QA_REVIEW' again (second visit)"
            - "${st3} == 'RETURNED' and ${round3} == 3, and Cell.${c1_id}.status == 'UNDER_CONSTRUCTION' again"
            - "the third return resolves to the REJECTED branch instead: ${st4} == 'REJECTED' and ${round4} == 3 (not incremented past MAX_REVISION_ROUNDS)"
            - "Cell.${c1_id}.status == 'REJECTED' (terminal)"
            - "Landfill.${lf_id}.certified_airspace_cy == 0, because no return branch ever grants airspace credit"
            - "the final begin-review returns ERR_INVALID_STATE_TRANSITION with HTTP 409, proving the terminal state is locked"

      - name: waste_load_screening_and_billing_dimensions_advance_independently
        grounds:
          - state_machines.WasteLoad.PENDING_to_FLAGGED
          - state_machines.WasteLoad.PENDING_to_CLEARED
          - state_machines.WasteLoad.FLAGGED_to_REJECTED
          - state_machines.WasteLoad.UNBILLED_to_PROVISIONAL
          - state_machines.WasteLoad.PROVISIONAL_to_FINALIZED
          - state_machines.WasteLoad.FINALIZED_to_PROVISIONAL
          - entities.WasteLoad.fields.screening_status
          - entities.WasteLoad.fields.billing_status
        distinguishing_aspect: |
          One WasteLoad carries two independent state dimensions and the machine is neither
          linear nor single-valued: POST /flag moves screening PENDING -> FLAGGED while billing
          stays UNBILLED, POST /clear-screening advances BOTH dimensions in one call, day close
          advances only billing (PROVISIONAL -> FINALIZED) while screening stays CLEARED, and
          day amend walks billing back to PROVISIONAL while screening still stays CLEARED. A
          second load shows the other combination: screening REJECTED with billing forced to
          VOID by the same call. Four distinct (screening, billing) pairs are observed on the
          same rows.
        test_recipe:
          setup:
            - "Landfill LF with Cell C-1 ACTIVE, a FUNDED financial-assurance position and an EXECUTED HostCommunityAgreement."
            - "OperatingDay D1 on 2026-08-05, cover ALTERNATIVE_TARP, working_face_area_sf 5000 (so effective density is exactly 0.8500)."
            - "WasteLoad L1 (MSW, manifest_tons 100.00, load_check_result PASS) and WasteLoad L2 (MSW, manifest_tons 60.00, load_check_result PASS), both PENDING/UNBILLED."
