# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Youth Club Site Operations
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: c_member_create_defaults_and_computed
        claim_type: creation
        grounds: ["entities.Member", "state_machines.Member"]
        distinguishing_aspect: "A new Member starts APPLIED with defaults: walker_ok false when omitted, fee_balance_cents 0, behavior_points 0, discipline_watch false, eligibility_tier null, version 1."
        test_recipe:
          setup: ["site + ACTIVE director staff"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: PlatformAdmin }
            - call: "POST /sites"
              payload: { name: "Club S", youth_capacity: 60, standard_ratio: 15, elevated_ratio: 8, base_weekly_fee_cents: 5000, registration_fee_cents: 2500, max_arrears_cents: 10000, meal_rates_cents: { BREAKFAST: { FREE: 225, REDUCED: 195, PAID: 45 }, SNACK: { FREE: 110, REDUCED: 55, PAID: 15 }, SUPPER: { FREE: 315, REDUCED: 275, PAID: 55 } } }
              as: PlatformAdmin
              captures: { site_id: $.data.id }
            - call: "POST /staff"
              payload: { site_id: "${site_id}", full_name: "Dir One", position: "DIRECTOR" }
              as: PlatformAdmin
              captures: { dir_id: $.data.id }
            - { call: "POST /staff/${dir_id}/credentials", payload: { kind: "BACKGROUND_CHECK", expires_at: "2027-01-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /staff/${dir_id}/credentials", payload: { kind: "TRAINING", expires_at: "2027-01-01T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - call: "POST /members"
              payload: { site_id: "${site_id}", legal_name: "New Kid", date_of_birth: "2013-01-01", grade: 6, household_size: 2, household_income_cents: 1000000 }
              as: SiteDirector
              as_user_id: "${dir_id}"
              captures: { m1: $.data.id }
          assert:
            - "Member.${m1}.status == APPLIED (initial state)"
            - "Member.${m1}.walker_ok == false (default applied)"
            - "Member.${m1}.fee_balance_cents == 0 and behavior_points == 0 and discipline_watch == false"
            - "Member.${m1}.eligibility_tier is null (computed only at approval) and weekly_fee_cents is null"
            - "Member.${m1}.version == 1 and id/created_at/updated_at are server-stamped"

      - name: c_member_create_missing_required_and_unknown_field_rejected
        claim_type: required_fields
        grounds: ["entities.Member", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Missing required household_income_cents -> ERR_VALIDATION (400); an unknown input key (eligibility_tier, which is computed) is also rejected -> ERR_VALIDATION."
        test_recipe:
          setup: ["site + ACTIVE director staff"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: PlatformAdmin }
            - call: "POST /sites"
              payload: { name: "Club S", youth_capacity: 60, standard_ratio: 15, elevated_ratio: 8, base_weekly_fee_cents: 5000, registration_fee_cents: 2500, max_arrears_cents: 10000, meal_rates_cents: { BREAKFAST: { FREE: 225, REDUCED: 195, PAID: 45 }, SNACK: { FREE: 110, REDUCED: 55, PAID: 15 }, SUPPER: { FREE: 315, REDUCED: 275, PAID: 55 } } }
              as: PlatformAdmin
              captures: { site_id: $.data.id }
            - call: "POST /staff"
              payload: { site_id: "${site_id}", full_name: "Dir One", position: "DIRECTOR" }
              as: PlatformAdmin
              captures: { dir_id: $.data.id }
            - { call: "POST /staff/${dir_id}/credentials", payload: { kind: "BACKGROUND_CHECK", expires_at: "2027-01-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /staff/${dir_id}/credentials", payload: { kind: "TRAINING", expires_at: "2027-01-01T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - call: "POST /members"
              payload: { site_id: "${site_id}", legal_name: "No Income", date_of_birth: "2013-01-01", grade: 6, household_size: 2 }
              as: SiteDirector
              as_user_id: "${dir_id}"
              captures: { err1: $.data.error_id }
            - call: "POST /members"
              payload: { site_id: "${site_id}", legal_name: "Extra Field", date_of_birth: "2013-01-01", grade: 6, household_size: 2, household_income_cents: 1000000, eligibility_tier: "FREE" }
              as: SiteDirector
              as_user_id: "${dir_id}"
              captures: { err2: $.data.error_id }
          assert:
            - "first trigger: error_id == ERR_VALIDATION, http 400 (missing household_income_cents); no Member created"
            - "second trigger: error_id == ERR_VALIDATION (unknown/computed field eligibility_tier in input); no Member created"

      - name: c_member_get_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but nonexistent member id returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty database is sufficient"]
          setup_api_calls: []
          trigger:
            - call: "GET /members/00000000-0000-0000-0000-000000000000"
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND and http == 404"

      - name: c_members_list_pagination_and_filter
        claim_type: listing
        grounds: ["response_envelope", "endpoints[GET /sites/{id}/members]"]
        distinguishing_aspect: "limit/offset paginate with total_count and has_more; status filter narrows the set (2 ACTIVE of 3 total after one denial)."
        test_recipe:
          setup: ["site + director; 3 members created, 2 approved (ACTIVE), 1 denied (DENIED)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: PlatformAdmin }
            - call: "POST /sites"
              payload: { name: "Club S", youth_capacity: 60, standard_ratio: 15, elevated_ratio: 8, base_weekly_fee_cents: 5000, registration_fee_cents: 2500, max_arrears_cents: 10000, meal_rates_cents: { BREAKFAST: { FREE: 225, REDUCED: 195, PAID: 45 }, SNACK: { FREE: 110, REDUCED: 55, PAID: 15 }, SUPPER: { FREE: 315, REDUCED: 275, PAID: 55 } } }
              as: PlatformAdmin
              captures: { site_id: $.data.id }
            - call: "POST /staff"
              payload: { site_id: "${site_id}", full_name: "Dir One", position: "DIRECTOR" }
              as: PlatformAdmin
              captures: { dir_id: $.data.id }
            - { call: "POST /staff/${dir_id}/credentials", payload: { kind: "BACKGROUND_CHECK", expires_at: "2027-01-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /staff/${dir_id}/credentials", payload: { kind: "TRAINING", expires_at: "2027-01-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /members"
              payload: { site_id: "${site_id}", legal_name: "Kid A", date_of_birth: "2012-01-01", grade: 7, household_size: 1, household_income_cents: 1000000 }
              as: SiteDirector
              as_user_id: "${dir_id}"
              captures: { m1: $.data.id }
            - call: "POST /members"
              payload: { site_id: "${site_id}", legal_name: "Kid B", date_of_birth: "2012-02-01", grade: 7, household_size: 1, household_income_cents: 1000000 }
              as: SiteDirector
              as_user_id: "${dir_id}"
              captures: { m2: $.data.id }
            - call: "POST /members"
              payload: { site_id: "${site_id}", legal_name: "Kid C", date_of_birth: "2012-03-01", grade: 7, household_size: 1, household_income_cents: 1000000 }
              as: SiteDirector
              as_user_id: "${dir_id}"
              captures: { m3: $.data.id }
            - { call: "POST /members/${m1}/decide", payload: { decision: "APPROVE" }, as: SiteDirector, as_user_id: "${dir_id}" }
            - { call: "POST /members/${m2}/decide", payload: { decision: "APPROVE" }, as: SiteDirector, as_user_id: "${dir_id}" }
            - { call: "POST /members/${m3}/decide", payload: { decision: "DENY" }, as: SiteDirector, as_user_id: "${dir_id}" }
          trigger:
            - { call: "GET /sites/${site_id}/members?limit=2&offset=0", as: PlatformAdmin }
            - { call: "GET /sites/${site_id}/members?limit=2&offset=2", as: PlatformAdmin }
            - { call: "GET /sites/${site_id}/members?status=ACTIVE", as: PlatformAdmin }
          assert:
            - "page 1: 2 items, total_count == 3, has_more == true"
            - "page 2: 1 item, total_count == 3, has_more == false"
            - "status=ACTIVE filter: 2 items, total_count == 2 (DENIED member excluded)"

      - name: c_guardian_create_with_bogus_member_returns_not_found
        claim_type: parent_relationships
        grounds: ["entities.Guardian.fields.member_id", "errors[ERR_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "Body FK member_id that does not resolve is rejected ERR_NOT_FOUND (404) — referential integrity on creation."
        test_recipe:
          setup: ["site + director staff"]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Club S", youth_capacity: 60, standard_ratio: 15, elevated_ratio: 8, base_weekly_fee_cents: 5000, registration_fee_cents: 2500, max_arrears_cents: 10000, meal_rates_cents: { BREAKFAST: { FREE: 225, REDUCED: 195, PAID: 45 }, SNACK: { FREE: 110, REDUCED: 55, PAID: 15 }, SUPPER: { FREE: 315, REDUCED: 275, PAID: 55 } } }
              as: PlatformAdmin
              captures: { site_id: $.data.id }
            - call: "POST /staff"
              payload: { site_id: "${site_id}", full_name: "Dir One", position: "DIRECTOR" }
              as: PlatformAdmin
              captures: { dir_id: $.data.id }
            - { call: "POST /staff/${dir_id}/credentials", payload: { kind: "BACKGROUND_CHECK", expires_at: "2027-01-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /staff/${dir_id}/credentials", payload: { kind: "TRAINING", expires_at: "2027-01-01T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - call: "POST /guardians"
              payload: { member_id: "00000000-0000-0000-0000-000000000000", full_name: "Jane Doe", relation: "mother" }
              as: SiteDirector
              as_user_id: "${dir_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND and http == 404; no Guardian created"

      - name: c_rotation_polymorphic_kind_field_validation
        claim_type: type_constraints
        grounds: ["entities.RotationAssignment.fields.kind", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "kind=YOUTH with staff_id set (or missing member_id) violates the polymorphic FK consistency rule -> ERR_VALIDATION; block enum outside {BLOCK_A,BLOCK_B,BLOCK_C} -> ERR_VALIDATION."
        test_recipe:
          setup: ["site + director; club day 2026-08-03 OPEN; area; ACTIVE member"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:00:00Z" }, as: PlatformAdmin }
            - call: "POST /sites"
              payload: { name: "Club S", youth_capacity: 60, standard_ratio: 15, elevated_ratio: 8, base_weekly_fee_cents: 5000, registration_fee_cents: 2500, max_arrears_cents: 10000, meal_rates_cents: { BREAKFAST: { FREE: 225, REDUCED: 195, PAID: 45 }, SNACK: { FREE: 110, REDUCED: 55, PAID: 15 }, SUPPER: { FREE: 315, REDUCED: 275, PAID: 55 } } }
              as: PlatformAdmin
              captures: { site_id: $.data.id }
            - call: "POST /staff"
              payload: { site_id: "${site_id}", full_name: "Dir One", position: "DIRECTOR" }
              as: PlatformAdmin
              captures: { dir_id: $.data.id }
            - { call: "POST /staff/${dir_id}/credentials", payload: { kind: "BACKGROUND_CHECK", expires_at: "2027-01-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /staff/${dir_id}/credentials", payload: { kind: "TRAINING", expires_at: "2027-01-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /club-days"
              payload: { site_id: "${site_id}", date: "2026-08-03" }
              as: SiteDirector
              as_user_id: "${dir_id}"
              captures: { day: $.data.id }
            - call: "POST /program-areas"
              payload: { site_id: "${site_id}", name: "Gym", capacity: 30 }
              as: PlatformAdmin
              captures: { area: $.data.id }
            - call: "POST /members"
              payload: { site_id: "${site_id}", legal_name: "Kid A", date_of_birth: "2012-01-01", grade: 7, household_size: 1, household_income_cents: 1000000 }
              as: SiteDirector
              as_user_id: "${dir_id}"
              captures: { m1: $.data.id }
            - { call: "POST /members/${m1}/decide", payload: { decision: "APPROVE" }, as: SiteDirector, as_user_id: "${dir_id}" }
          trigger:
            - call: "POST /rotation-assignments"
              payload: { club_day_id: "${day}", area_id: "${area}", block: "BLOCK_A", kind: "YOUTH", staff_id: "${dir_id}" }
              as: SiteDirector
              as_user_id: "${dir_id}"
              captures: { err1: $.data.error_id }
            - call: "POST /rotation-assignments"
              payload: { club_day_id: "${day}", area_id: "${area}", block: "BLOCK_Z", kind: "YOUTH", member_id: "${m1}" }
              as: SiteDirector
              as_user_id: "${dir_id}"
              captures: { err2: $.data.error_id }
          assert:
            - "first trigger: error_id == ERR_VALIDATION (kind=YOUTH forbids staff_id / requires member_id)"
            - "second trigger: error_id == ERR_VALIDATION (block enum out of range)"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: c_staff_activation_requires_both_credentials
        claim_type: valid_transition
        grounds: ["state_machines.Staff.HIRED_to_ACTIVE", "entities.Staff.fields.compliance_status"]
        distinguishing_aspect: "Staff stays HIRED/INCOMPLETE after only one credential; the second valid credential auto-promotes to ACTIVE with compliance_status COMPLIANT."
        test_recipe:
          setup: ["site exists"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: PlatformAdmin }
            - call: "POST /sites"
              payload: { name: "Club S", youth_capacity: 60, standard_ratio: 15, elevated_ratio: 8, base_weekly_fee_cents: 5000, registration_fee_cents: 2500, max_arrears_cents: 10000, meal_rates_cents: { BREAKFAST: { FREE: 225, REDUCED: 195, PAID: 45 }, SNACK: { FREE: 110, REDUCED: 55, PAID: 15 }, SUPPER: { FREE: 315, REDUCED: 275, PAID: 55 } } }
              as: PlatformAdmin
              captures: { site_id: $.data.id }
          trigger:
            - call: "POST /staff"
              payload: { site_id: "${site_id}", full_name: "Flo One", position: "FRONTLINE" }
              as: PlatformAdmin
              captures: { f1: $.data.id }
            - { call: "POST /staff/${f1}/credentials", payload: { kind: "BACKGROUND_CHECK", expires_at: "2027-01-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /staff/${f1}/credentials", payload: { kind: "TRAINING", expires_at: "2027-01-01T00:00:00Z" }, as: PlatformAdmin }
          assert:
            - "after create: Staff.${f1}.status == HIRED (initial) and compliance_status == INCOMPLETE"
            - "after first credential: status still == HIRED and compliance_status == INCOMPLETE"
            - "after second credential: status == ACTIVE (system auto-transition) and compliance_status == COMPLIANT"

      - name: c_decide_twice_returns_member_not_applied
        claim_type: invalid_transition
        grounds: ["state_machines.Member.APPLIED_to_ACTIVE", "errors[ERR_MEMBER_NOT_APPLIED]"]
        distinguishing_aspect: "decide on an already-ACTIVE member is rejected ERR_MEMBER_NOT_APPLIED; the second decision does not re-run side effects (balance unchanged)."
        test_recipe:
          setup: ["ACTIVE member (approved)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: PlatformAdmin }
            - call: "POST /sites"
              payload: { name: "Club S", youth_capacity: 60, standard_ratio: 15, elevated_ratio: 8, base_weekly_fee_cents: 5000, registration_fee_cents: 2500, max_arrears_cents: 10000, meal_rates_cents: { BREAKFAST: { FREE: 225, REDUCED: 195, PAID: 45 }, SNACK: { FREE: 110, REDUCED: 55, PAID: 15 }, SUPPER: { FREE: 315, REDUCED: 275, PAID: 55 } } }
              as: PlatformAdmin
              captures: { site_id: $.data.id }
            - call: "POST /staff"
              payload: { site_id: "${site_id}", full_name: "Dir One", position: "DIRECTOR" }
              as: PlatformAdmin
              captures: { dir_id: $.data.id }
            - { call: "POST /staff/${dir_id}/credentials", payload: { kind: "BACKGROUND_CHECK", expires_at: "2027-01-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /staff/${dir_id}/credentials", payload: { kind: "TRAINING", expires_at: "2027-01-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /members"
              payload: { site_id: "${site_id}", legal_name: "Kid A", date_of_birth: "2012-01-01", grade: 7, household_size: 1, household_income_cents: 1000000 }
              as: SiteDirector
              as_user_id: "${dir_id}"
              captures: { m1: $.data.id }
            - { call: "POST /members/${m1}/decide", payload: { decision: "APPROVE" }, as: SiteDirector, as_user_id: "${dir_id}" }
          trigger:
            - call: "POST /members/${m1}/decide"
              payload: { decision: "DENY" }
              as: SiteDirector
              as_user_id: "${dir_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_MEMBER_NOT_APPLIED (409); Member.${m1}.status remains ACTIVE and fee_balance_cents remains 2500"

      - name: c_guardian_revoke_twice_returns_not_active
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.Guardian.ACTIVE_to_REVOKED", "errors[ERR_GUARDIAN_NOT_ACTIVE]"]
        distinguishing_aspect: "REVOKED is terminal for Guardian: a second revoke fails ERR_GUARDIAN_NOT_ACTIVE."
        test_recipe:
          setup: ["ACTIVE member with guardian g1 ACTIVE, then revoked once"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: PlatformAdmin }
            - call: "POST /sites"
              payload: { name: "Club S", youth_capacity: 60, standard_ratio: 15, elevated_ratio: 8, base_weekly_fee_cents: 5000, registration_fee_cents: 2500, max_arrears_cents: 10000, meal_rates_cents: { BREAKFAST: { FREE: 225, REDUCED: 195, PAID: 45 }, SNACK: { FREE: 110, REDUCED: 55, PAID: 15 }, SUPPER: { FREE: 315, REDUCED: 275, PAID: 55 } } }
              as: PlatformAdmin
              captures: { site_id: $.data.id }
            - call: "POST /staff"
              payload: { site_id: "${site_id}", full_name: "Dir One", position: "DIRECTOR" }
              as: PlatformAdmin
              captures: { dir_id: $.data.id }
            - { call: "POST /staff/${dir_id}/credentials", payload: { kind: "BACKGROUND_CHECK", expires_at: "2027-01-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /staff/${dir_id}/credentials", payload: { kind: "TRAINING", expires_at: "2027-01-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /members"
              payload: { site_id: "${site_id}", legal_name: "Kid A", date_of_birth: "2012-01-01", grade: 7, household_size: 1, household_income_cents: 1000000 }
              as: SiteDirector
              as_user_id: "${dir_id}"
              captures: { m1: $.data.id }
            - { call: "POST /members/${m1}/decide", payload: { decision: "APPROVE" }, as: SiteDirector, as_user_id: "${dir_id}" }
            - call: "POST /guardians"
              payload: { member_id: "${m1}", full_name: "Jane Doe", relation: "mother" }
              as: SiteDirector
              as_user_id: "${dir_id}"
              captures: { g1: $.data.id }
            - { call: "POST /guardians/${g1}/revoke", payload: {}, as: SiteDirector, as_user_id: "${dir_id}" }
          trigger:
            - call: "POST /guardians/${g1}/revoke"
              payload: {}
              as: SiteDirector
              as_user_id: "${dir_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_GUARDIAN_NOT_ACTIVE (409); Guardian.${g1}.status remains REVOKED"

      - name: c_signout_missing_signout_returns_attendance_final
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.AttendanceRecord.ON_SITE_to_MISSING_SIGNOUT", "errors[ERR_ATTENDANCE_FINAL]"]
        distinguishing_aspect: "After club-day close flips an ON_SITE record to MISSING_SIGNOUT, sign-out is rejected ERR_ATTENDANCE_FINAL — a different error than ERR_ALREADY_SIGNED_OUT."
        test_recipe:
          setup: ["member signed in on day 2026-08-03; day closed without sign-out"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:00:00Z" }, as: PlatformAdmin }
            - call: "POST /sites"
              payload: { name: "Club S", youth_capacity: 60, standard_ratio: 15, elevated_ratio: 8, base_weekly_fee_cents: 5000, registration_fee_cents: 2500, max_arrears_cents: 10000, meal_rates_cents: { BREAKFAST: { FREE: 225, REDUCED: 195, PAID: 45 }, SNACK: { FREE: 110, REDUCED: 55, PAID: 15 }, SUPPER: { FREE: 315, REDUCED: 275, PAID: 55 } } }
              as: PlatformAdmin
              captures: { site_id: $.data.id }
            - call: "POST /staff"
              payload: { site_id: "${site_id}", full_name: "Dir One", position: "DIRECTOR" }
              as: PlatformAdmin
              captures: { dir_id: $.data.id }
            - { call: "POST /staff/${dir_id}/credentials", payload: { kind: "BACKGROUND_CHECK", expires_at: "2027-01-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /staff/${dir_id}/credentials", payload: { kind: "TRAINING", expires_at: "2027-01-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /members"
              payload: { site_id: "${site_id}", legal_name: "Kid A", date_of_birth: "2012-01-01", grade: 7, household_size: 1, household_income_cents: 1000000, walker_ok: true }
              as: SiteDirector
              as_user_id: "${dir_id}"
              captures: { m1: $.data.id }
            - { call: "POST /members/${m1}/decide", payload: { decision: "APPROVE" }, as: SiteDirector, as_user_id: "${dir_id}" }
            - call: "POST /club-days"
              payload: { site_id: "${site_id}", date: "2026-08-03" }
              as: SiteDirector
              as_user_id: "${dir_id}"
              captures: { day: $.data.id }
            - call: "POST /attendance-records"
              payload: { club_day_id: "${day}", member_id: "${m1}" }
              as: SiteDirector
              as_user_id: "${dir_id}"
              captures: { att: $.data.id }
            - { call: "POST /club-days/${day}/close", payload: {}, as: SiteDirector, as_user_id: "${dir_id}" }
          trigger:
            - call: "POST /attendance-records/${att}/sign-out"
              payload: { sign_out_type: "WALKER" }
              as: SiteDirector
              as_user_id: "${dir_id}"
              captures: { err: $.data.error_id }
          assert:
            - "AttendanceRecord.${att}.status == MISSING_SIGNOUT after close (auto-transition)"
            - "trigger error_id == ERR_ATTENDANCE_FINAL (409); record unchanged"

      - name: c_checkin_cancelled_assignment_returns_not_checkable
        claim_type: invalid_transition
        grounds: ["state_machines.RotationAssignment.SCHEDULED_to_CHECKED_IN", "errors[ERR_ASSIGNMENT_NOT_CHECKABLE]"]
        distinguishing_aspect: "A member-withdrawal cascade CANCELS the member's SCHEDULED assignment; check-in on the cancelled row fails ERR_ASSIGNMENT_NOT_CHECKABLE."
        test_recipe:
