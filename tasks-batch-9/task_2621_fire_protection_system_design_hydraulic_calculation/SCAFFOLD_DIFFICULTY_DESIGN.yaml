            - "PipeSizingIteration.${it2}.in_active_chain == false"
            - "PipeSizingIteration.${it3}.in_active_chain == false"
            - "PipeSizingIteration.${it4}.in_active_chain == true"
            - "PipeSizingIteration.${it4}.friction_loss_psi == 0.89"
            - "PipeSizingIteration.${it4}.velocity_fps == 5.64"
            - "PipeSizingIteration.${it4}.cumulative_psi_after == 27.50"
            - "PipeSizingIteration.${it5}.cumulative_psi_after == 32.76"
            - "HydraulicCalculation.${hc1}.end_head_psi == 26.61"
            - "HydraulicCalculation.${hc1}.iteration_count == 2"
