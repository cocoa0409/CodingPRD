      - name: remove_site_approval_cascades_into_void_and_patient_ledger_depth_five
        grounds:
          - state_machines.ScopeChangeRequest.UNDER_REVIEW_to_APPROVED
          - state_machines.ServiceSite.IN_SCOPE_to_REMOVED
          - state_machines.Encounter.UNBILLED_to_VOID
          - calculations.patient_balance_invariant
          - calculations.scope_listing_invariant
          - calculations.governance_posture
          - entities.Encounter.fields.void_reason
          - entities.Encounter.fields.charge_adjustment_cents
          - entities.HealthCenter.fields.wraparound_receivable_cents
        distinguishing_aspect: |
          A DIFFERENT triggering transition (a caller-driven BoardChair approval, not a system
          sweep) producing a different depth-5 chain: target site IN_SCOPE -> REMOVED (hop 1),
          in_scope_site_count recomputed (hop 2), every UNBILLED encounter at that site voided with
          void_reason SITE_OUT_OF_SCOPE (hop 3), each affected Patient.patient_balance_cents
          decremented (hop 4), wraparound_receivable_cents recomputed (hop 5). The PAID Medicaid
          encounter is deliberately NOT voided, so hop 5 must recompute the receivable rather than
          subtract, and governance_posture flips to GOVERNANCE_DEFICIENT only AFTER the gate has
          already been passed on the pre-transition snapshot.
        test_recipe:
