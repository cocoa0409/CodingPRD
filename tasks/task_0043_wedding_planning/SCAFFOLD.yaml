scenario: |
  Wedding planning management system: wedding project with project profile (date/style/scale),
  planner assignment, milestone definition, project-stage status, and project-template library;
  vendor management with vendor categorization (venue/photography/floral/catering/MC/band),
  qualification and review records, quotation library, contract binding, and vendor performance
  rating; budget allocation and tracking with overall budget and category sub-budget,
  vendor-quote vs. budget comparison, change-order approval, overspend warning, and budget
  reallocation; timeline scheduling with pre-wedding preparation tasks, ceremony-day
  minute-by-minute timeline, vendor arrival and setup time, multi-vendor parallel coordination,
  and timeline rehearsal version; guest management with guest list, RSVP collection, dietary
  and accessibility requirements, seating arrangement, gift money and gift records, and
  post-wedding thank-you tracking; final payment settlement with milestone payment schedule,
  vendor acceptance confirmation, deduction for breach of contract, change-of-scope billing
  adjustment, refund handling, and final account closing; event-driven synchronization with
  payment, IM, and electronic-signature systems; audit logging for budget changes and vendor
  settlements.

domain_name: wedding-planning
api_prefix: /wedding-projects

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: pricing_engine
  complexity_layers:
    - dual_variant_calculation       # provisional cost vs final settlement
    - cascading_side_effects          # vendor cancellation cascades to budget, timeline, payment
    - version_pinning_on_approval     # lock Quote.version when Contract is signed
    - compliance_audit                # AuditEntry append-only log on budget + settlement
    - scheduled_deferred_actions      # ceremony-day timeline events fire on clock advance

  entity_topology: hybrid
  # WeddingProject is the aggregate root; Vendor lives at top-level (peer/flat) and is bound
  # into a project through Contract (cross-aggregate junction). Mixed nesting.

  state_machine_shape: parallel
  # Contract carries TWO independent state dimensions: contract_status (lifecycle of the binding)
  # × payment_status (waterfall of milestone settlements). They evolve independently on the same row.

  relationship_patterns:
    - one_to_many                # Project → Milestone, Project → TimelineSlot, Project → Guest
    - many_to_many               # Project ↔ Vendor through Contract (junction)
    - cross_aggregate            # Contract references Quote across the Vendor aggregate
    - polymorphic                # AuditEntry.subject_type ∈ {Budget, Contract, Settlement}

  role_model: segregation_of_duties
  # The same Planner who approves a ChangeOrder MAY NOT also confirm the matching Settlement.
  # Auditor role is required to close the project (separation between operator and reviewer).

  consistency_model: immediate
  # All cascades execute inside the triggering request; AuditEntry writes are part of the same
  # transaction (append-only log, no eventual reconciliation).

# =============================================================================
# 1.0 Response Envelope (FIXED — VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: WeddingProject
    parent: null
    common_fields: true
    fields:
      - { name: couple_name, type: string, source: input, description: "Display name for the couple, e.g. 'Alice & Bob'" }
      - { name: ceremony_date, type: integer, source: input, description: "Unix timestamp (seconds) of the ceremony start instant" }
      - { name: style, type: enum, source: input, description: "Aesthetic style", constraints: "CLASSIC | RUSTIC | MODERN | DESTINATION" }
      - { name: scale, type: enum, source: input, description: "Guest-count band that controls per-category budget caps", constraints: "INTIMATE | MEDIUM | GRAND" }
      - { name: planner_user_id, type: string, source: input, description: "Planner who owns this project; equals X-User-ID of acting Planner. Set on creation." }
      - { name: auditor_user_id, type: string, source: input, description: "Auditor who must close the project; MUST differ from planner_user_id." }
      - { name: template_id, type: string, source: input, description: "Optional ProjectTemplate used at creation; copies milestones into this project. Nullable." }
      - { name: status, type: enum, source: system, description: "Project lifecycle stage", constraints: "DRAFT | PLANNING | EXECUTION | SETTLEMENT | CLOSED | CANCELLED", default: "DRAFT" }
      - { name: total_budget_cents, type: integer, source: input, description: "Overall budget cap in cents" }
      - { name: provisional_committed_cents, type: integer, source: computed, description: "Sum of Quote.amount_cents for Contracts in BOUND status whose Settlement is not yet FINALIZED" }
      - { name: finalized_settled_cents, type: integer, source: computed, description: "Sum of Settlement.final_amount_cents for FINALIZED settlements" }
      - { name: budget_balance_cents, type: integer, source: computed, description: "total_budget_cents - provisional_committed_cents - finalized_settled_cents" }
      - { name: rehearsal_version, type: integer, source: system, description: "Monotonic counter incremented each time the timeline is snapshotted to a rehearsal", default: 0 }

  - name: ProjectTemplate
    parent: null
    common_fields: false  # immutable library entry
    fields:
      - { name: name, type: string, source: input, description: "Library template name, unique" }
      - { name: scale, type: enum, source: input, description: "Target scale band", constraints: "INTIMATE | MEDIUM | GRAND" }
      - { name: default_milestones, type: array, source: input, description: "Ordered list of milestone seeds, each {label, offset_days_from_ceremony, percent_of_budget}" }

  - name: Milestone
    parent: WeddingProject
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "Owning WeddingProject id" }
      - { name: label, type: string, source: input, description: "Human label, e.g. 'Venue Deposit'" }
      - { name: due_at, type: integer, source: input, description: "Unix timestamp the milestone is due" }
      - { name: percent_of_budget, type: number, source: input, description: "Share of total_budget_cents this milestone represents, 0–100" }
      - { name: status, type: enum, source: system, description: "Milestone progression", constraints: "PENDING | IN_PROGRESS | COMPLETED | OVERDUE", default: "PENDING" }

  - name: Vendor
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Vendor business name" }
      - { name: category, type: enum, source: input, description: "Service category", constraints: "VENUE | PHOTOGRAPHY | FLORAL | CATERING | MC | BAND" }
      - { name: qualification_status, type: enum, source: system, description: "Review state of vendor's submitted credentials", constraints: "PENDING_REVIEW | APPROVED | REJECTED | SUSPENDED", default: "PENDING_REVIEW" }
      - { name: avg_performance_rating, type: number, source: computed, description: "Mean of PerformanceRating.score across this vendor's FINALIZED settlements; null if zero ratings", default: null }
      - { name: rating_count, type: integer, source: computed, description: "Count of PerformanceRating rows for this vendor", default: 0 }

  - name: Quote
    parent: Vendor
    common_fields: true
    fields:
      - { name: vendor_id, type: string, source: system, description: "Owning Vendor id" }
      - { name: category, type: enum, source: system, description: "Copied from Vendor.category at creation" }
      - { name: amount_cents, type: integer, source: input, description: "Quoted price in cents" }
      - { name: scope_description, type: string, source: input, description: "What the quote covers" }
      - { name: valid_until, type: integer, source: input, description: "Unix timestamp after which the quote may not be bound to a contract" }
      - { name: status, type: enum, source: system, description: "Quote lifecycle", constraints: "DRAFT | OFFERED | BOUND | EXPIRED | WITHDRAWN", default: "DRAFT" }

  - name: Contract
    parent: WeddingProject
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "Owning WeddingProject id" }
      - { name: vendor_id, type: string, source: input, description: "Bound vendor id" }
      - { name: quote_id, type: string, source: input, description: "Bound Quote id; the Quote MUST be in OFFERED status at signing" }
      - { name: pinned_quote_version, type: integer, source: system, description: "Quote.version captured at signing; later mutations of the Quote do NOT change this" }
      - { name: pinned_amount_cents, type: integer, source: system, description: "Quote.amount_cents captured at signing (provisional commitment)" }
      - { name: contract_status, type: enum, source: system, description: "Binding lifecycle (parallel dimension 1)", constraints: "DRAFT | NEGOTIATING | SIGNED | ACCEPTED | TERMINATED", default: "DRAFT" }
      - { name: payment_status, type: enum, source: system, description: "Settlement lifecycle (parallel dimension 2)", constraints: "UNPAID | PARTIAL | FINALIZED | REFUNDED", default: "UNPAID" }
      - { name: e_sign_envelope_id, type: string, source: system, description: "Identifier returned by the e-signature subsystem when SIGN is dispatched; null until then", default: null }
      - { name: negotiation_round, type: integer, source: system, description: "Increments every time contract returns from NEGOTIATING to DRAFT (cyclic loop)", default: 0 }

  - name: ChangeOrder
    parent: Contract
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: system, description: "Owning Contract id" }
      - { name: delta_amount_cents, type: integer, source: input, description: "Signed delta to add to pinned_amount_cents (may be negative)" }
      - { name: reason, type: string, source: input, description: "Explanation for the change" }
      - { name: requested_by_user_id, type: string, source: system, description: "X-User-ID of the requester at creation time" }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID of the approver at APPROVED transition; MUST differ from requested_by_user_id (segregation)", default: null }
      - { name: status, type: enum, source: system, description: "Approval lifecycle", constraints: "PENDING | APPROVED | REJECTED", default: "PENDING" }

  - name: Settlement
    parent: Contract
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: system, description: "Owning Contract id" }
      - { name: provisional_total_cents, type: integer, source: computed, description: "pinned_amount_cents + sum(approved ChangeOrder.delta_amount_cents) at creation" }
      - { name: breach_deduction_cents, type: integer, source: input, description: "Penalty deduction for vendor breach; 0 if none. Non-negative.", default: 0 }
      - { name: refund_cents, type: integer, source: input, description: "Refund amount the vendor returns to the project; 0 if none. Non-negative.", default: 0 }
      - { name: final_amount_cents, type: integer, source: computed, description: "max(0, provisional_total_cents - breach_deduction_cents - refund_cents); see calculation final_settlement_amount" }
      - { name: status, type: enum, source: system, description: "Settlement progression", constraints: "DRAFT | VENDOR_CONFIRMED | FINALIZED", default: "DRAFT" }
      - { name: confirmed_by_vendor_at, type: integer, source: system, description: "Unix timestamp of vendor acceptance; null until VENDOR_CONFIRMED", default: null }
      - { name: confirmed_by_user_id, type: string, source: system, description: "X-User-ID of the Planner that drafted the settlement" }
      - { name: finalized_by_user_id, type: string, source: system, description: "X-User-ID of the Auditor at FINALIZED transition; MUST differ from confirmed_by_user_id (segregation)", default: null }

  - name: TimelineSlot
    parent: WeddingProject
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "Owning WeddingProject id" }
      - { name: vendor_id, type: string, source: input, description: "Vendor responsible for this slot; MUST have an ACCEPTED Contract on this project. Nullable for couple-only slots." }
      - { name: start_at, type: integer, source: input, description: "Unix timestamp (seconds) of slot start, half-open lower bound" }
      - { name: end_at, type: integer, source: input, description: "Unix timestamp of slot end, half-open upper bound (exclusive)" }
      - { name: setup_buffer_seconds, type: integer, source: input, description: "Pre-slot setup time required exclusively by this vendor; effectively extends start_at backward for overlap detection", default: 0 }
      - { name: kind, type: enum, source: input, description: "Slot kind", constraints: "PREPARATION | CEREMONY | RECEPTION", default: "CEREMONY" }
      - { name: label, type: string, source: input, description: "Human label" }

  - name: Guest
    parent: WeddingProject
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "Owning WeddingProject id" }
      - { name: full_name, type: string, source: input, description: "Guest's full name" }
      - { name: party_size, type: integer, source: input, description: "Number of seats the invitation covers (>= 1)", default: 1 }
      - { name: rsvp_status, type: enum, source: system, description: "RSVP lifecycle", constraints: "INVITED | CONFIRMED | DECLINED | NO_RESPONSE", default: "INVITED" }
      - { name: dietary_requirements, type: array, source: input, description: "Free-form list of dietary tags, e.g. ['VEGAN','GLUTEN_FREE']", default: "[]" }
      - { name: accessibility_requirements, type: array, source: input, description: "List of accessibility tags, e.g. ['WHEELCHAIR']", default: "[]" }
      - { name: table_number, type: integer, source: input, description: "Assigned reception table number; null until seated", default: null }
      - { name: gift_amount_cents, type: integer, source: input, description: "Recorded monetary gift; 0 if none", default: 0 }
      - { name: thank_you_sent_at, type: integer, source: input, description: "Unix timestamp the thank-you was sent; null until sent", default: null }

  - name: AuditEntry
    parent: WeddingProject
    common_fields: false  # append-only log: id + created_at only
    fields:
      - { name: project_id, type: string, source: system, description: "Owning WeddingProject id" }
      - { name: subject_type, type: enum, source: system, description: "Polymorphic subject", constraints: "BUDGET | CONTRACT | SETTLEMENT | CHANGE_ORDER" }
      - { name: subject_id, type: string, source: system, description: "Id of the subject row at the time of the event" }
      - { name: actor_user_id, type: string, source: system, description: "X-User-ID of the actor that triggered the entry" }
      - { name: actor_role, type: enum, source: system, description: "Role of the actor", constraints: "Planner | VendorRep | Couple | Auditor" }
      - { name: event_kind, type: enum, source: system, description: "What happened", constraints: "BUDGET_REALLOCATED | CHANGE_ORDER_APPROVED | CONTRACT_TERMINATED | SETTLEMENT_FINALIZED | OVERSPEND_WARNING_RAISED" }
      - { name: payload, type: object, source: system, description: "JSON snapshot of fields that changed (before/after)" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: WeddingProject
    initial_state: DRAFT
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: DRAFT
        to: PLANNING
        trigger: POST /wedding-projects/{projectId}/activate
        actor: Planner
        preconditions:
          - "Project must be in DRAFT (ERR_PROJECT_NOT_IN_DRAFT)"
          - "At least one Milestone exists (ERR_NO_MILESTONES)"
          - "Sum of Milestone.percent_of_budget across this project equals 100.0 (ERR_MILESTONE_PERCENTAGES_INVALID)"
        side_effects: []

      - from: PLANNING
        to: EXECUTION
        trigger: POST /wedding-projects/{projectId}/start-execution
        actor: Planner
        preconditions:
          - "Project must be PLANNING (ERR_PROJECT_NOT_IN_PLANNING)"
          - "Every Vendor category {VENUE, CATERING} has at least one Contract in ACCEPTED status (ERR_REQUIRED_CATEGORY_UNCOVERED)"
          - "budget_balance_cents >= 0 (ERR_BUDGET_OVERCOMMITTED)"
        side_effects: []

      - from: EXECUTION
        to: SETTLEMENT
        trigger: POST /wedding-projects/{projectId}/enter-settlement
        actor: Planner
        preconditions:
          - "Project must be EXECUTION (ERR_PROJECT_NOT_IN_EXECUTION)"
          - "All Contracts on this project are in contract_status ∈ {ACCEPTED, TERMINATED} (ERR_OPEN_CONTRACTS_REMAIN)"
          - "Clock has advanced past ceremony_date (ERR_CEREMONY_NOT_ELAPSED)"
        side_effects: []

      - from: SETTLEMENT
        to: CLOSED
        trigger: POST /wedding-projects/{projectId}/close
        actor: Auditor
        preconditions:
          - "Project must be SETTLEMENT (ERR_PROJECT_NOT_IN_SETTLEMENT)"
          - "Every Contract on this project has either contract_status=TERMINATED, or a Settlement in FINALIZED status (ERR_UNFINALIZED_SETTLEMENTS)"
          - "Acting user X-User-ID equals WeddingProject.auditor_user_id and differs from planner_user_id (ERR_AUDITOR_REQUIRED, ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "Append AuditEntry(event_kind=SETTLEMENT_FINALIZED, subject_type=BUDGET) capturing the final budget snapshot"

      - from: DRAFT
        to: CANCELLED
        trigger: POST /wedding-projects/{projectId}/cancel
        actor: Planner
        preconditions: []
        side_effects: []

      - from: PLANNING
        to: CANCELLED
        trigger: POST /wedding-projects/{projectId}/cancel
        actor: Planner
        preconditions: []
        side_effects:
          - "All Contracts on this project in contract_status ∈ {DRAFT, NEGOTIATING, SIGNED, ACCEPTED} → TERMINATED via cascade (see Contract.* → TERMINATED side_effects which then cascade to Quote and Settlement)"

      - from: EXECUTION
        to: CANCELLED
        trigger: POST /wedding-projects/{projectId}/cancel
        actor: Planner
        preconditions: []
        side_effects:
          - "Same cascade as PLANNING → CANCELLED"

  - entity: Contract
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    transitions:
      - from: DRAFT
        to: NEGOTIATING
        trigger: POST /wedding-projects/{projectId}/contracts/{contractId}/send-for-negotiation
        actor: Planner
        preconditions:
          - "Contract must be in DRAFT (ERR_CONTRACT_NOT_IN_DRAFT)"
          - "Bound Quote.status must be DRAFT or OFFERED (ERR_QUOTE_NOT_AVAILABLE)"
        side_effects:
          - "Bound Quote → OFFERED (if currently DRAFT)"

      - from: NEGOTIATING
        to: DRAFT
        trigger: POST /wedding-projects/{projectId}/contracts/{contractId}/revise
        actor: VendorRep
        preconditions:
          - "Contract must be NEGOTIATING (ERR_CONTRACT_NOT_NEGOTIATING)"
          - "VendorRep X-User-ID equals Vendor.id of the bound vendor (ERR_NOT_OWNING_VENDOR)"
        side_effects:
          - "negotiation_round += 1 (cyclic loop back)"
          - "Bound Quote → DRAFT for re-pricing"

      - from: NEGOTIATING
        to: SIGNED
        trigger: POST /wedding-projects/{projectId}/contracts/{contractId}/sign
        actor: Planner
        preconditions:
          - "Contract must be NEGOTIATING (ERR_CONTRACT_NOT_NEGOTIATING)"
          - "Quote.status must be OFFERED (ERR_QUOTE_NOT_AVAILABLE)"
          - "Clock < Quote.valid_until (ERR_QUOTE_EXPIRED)"
          - "Project.status ∈ {PLANNING} (ERR_PROJECT_NOT_IN_PLANNING)"
          - "After binding, project.budget_balance_cents - Quote.amount_cents >= 0 (ERR_BUDGET_OVERCOMMITTED)"
        side_effects:
          - "pinned_quote_version := Quote.version"
          - "pinned_amount_cents := Quote.amount_cents"
          - "Quote → BOUND (Quote.status changed; Quote.version increments)"
          - "Dispatch e-sign envelope; e_sign_envelope_id := envelope id returned by stub"
          - "WeddingProject.provisional_committed_cents recomputed; if exceeds soft warning threshold, append AuditEntry(event_kind=OVERSPEND_WARNING_RAISED)"

      - from: SIGNED
        to: ACCEPTED
        trigger: POST /wedding-projects/{projectId}/contracts/{contractId}/accept-signature
        actor: system
        preconditions:
          - "Contract must be SIGNED (ERR_CONTRACT_NOT_SIGNED)"
          - "An e-sign callback has been received via POST /_events/emit with kind=ESIGN_COMPLETED for this e_sign_envelope_id (ERR_ESIGN_NOT_COMPLETE)"
        side_effects: []

      - from: DRAFT
        to: TERMINATED
        trigger: POST /wedding-projects/{projectId}/contracts/{contractId}/terminate
        actor: Planner
        preconditions: []
        side_effects:
          - "Bound Quote → WITHDRAWN if currently OFFERED or BOUND"

      - from: NEGOTIATING
        to: TERMINATED
        trigger: POST /wedding-projects/{projectId}/contracts/{contractId}/terminate
        actor: Planner
        preconditions: []
        side_effects:
          - "Bound Quote → WITHDRAWN if currently OFFERED or BOUND"

      - from: SIGNED
        to: TERMINATED
        trigger: POST /wedding-projects/{projectId}/contracts/{contractId}/terminate
        actor: Planner
        preconditions: []
        side_effects:
          - "Bound Quote → WITHDRAWN"
          - "All TimelineSlots on this project for this vendor → deleted"
          - "WeddingProject.provisional_committed_cents recomputed (subtract pinned_amount_cents)"
          - "Append AuditEntry(event_kind=CONTRACT_TERMINATED)"

      - from: ACCEPTED
        to: TERMINATED
        trigger: POST /wedding-projects/{projectId}/contracts/{contractId}/terminate
        actor: Planner
        preconditions: []
        side_effects:
          - "Bound Quote → WITHDRAWN"
          - "All TimelineSlots on this project for this vendor → deleted"
          - "If a Settlement exists in DRAFT or VENDOR_CONFIRMED status, force its status → DRAFT and reset confirmed_by_vendor_at := null"
          - "WeddingProject.provisional_committed_cents recomputed"
          - "Append AuditEntry(event_kind=CONTRACT_TERMINATED)"

  - entity: Quote
    initial_state: DRAFT
    terminal_states: [EXPIRED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: OFFERED
        trigger: POST /vendors/{vendorId}/quotes/{quoteId}/offer
        actor: VendorRep
        preconditions:
          - "Vendor.qualification_status must be APPROVED (ERR_VENDOR_NOT_APPROVED)"
          - "Clock < valid_until (ERR_QUOTE_EXPIRED)"
        side_effects: []
      - from: OFFERED
        to: BOUND
        trigger: "system (cascade from Contract NEGOTIATING → SIGNED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OFFERED
        to: EXPIRED
        trigger: "system (sweep when clock passes valid_until)"
        actor: system
        preconditions:
          - "Clock >= valid_until and Quote.status == OFFERED"
        side_effects: []
      - from: DRAFT
        to: WITHDRAWN
        trigger: POST /vendors/{vendorId}/quotes/{quoteId}/withdraw
        actor: VendorRep
        preconditions: []
        side_effects: []
      - from: OFFERED
        to: WITHDRAWN
        trigger: "system (cascade from Contract terminate)"
        actor: system
        preconditions: []
        side_effects: []
      - from: BOUND
        to: WITHDRAWN
        trigger: "system (cascade from Contract terminate after SIGNED/ACCEPTED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Vendor
    initial_state: PENDING_REVIEW
    terminal_states: []
    transitions:
      - from: PENDING_REVIEW
        to: APPROVED
        trigger: POST /vendors/{vendorId}/approve
        actor: Auditor
        preconditions: []
        side_effects: []
      - from: PENDING_REVIEW
        to: REJECTED
        trigger: POST /vendors/{vendorId}/reject
        actor: Auditor
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: SUSPENDED
        trigger: POST /vendors/{vendorId}/suspend
        actor: Auditor
        preconditions: []
        side_effects:
          - "All Quotes in DRAFT or OFFERED → WITHDRAWN"
      - from: SUSPENDED
        to: APPROVED
        trigger: POST /vendors/{vendorId}/reinstate
        actor: Auditor
        preconditions: []
        side_effects: []

  - entity: ChangeOrder
    initial_state: PENDING
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: POST /wedding-projects/{projectId}/contracts/{contractId}/change-orders/{changeOrderId}/approve
        actor: Planner
        preconditions:
          - "ChangeOrder must be PENDING (ERR_CHANGE_ORDER_NOT_PENDING)"
          - "Acting Planner X-User-ID MUST differ from requested_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "Contract.contract_status ∈ {SIGNED, ACCEPTED} (ERR_CONTRACT_NOT_BOUND)"
          - "After applying delta, WeddingProject.budget_balance_cents - delta_amount_cents >= 0 (ERR_BUDGET_OVERCOMMITTED)"
        side_effects:
          - "approved_by_user_id := X-User-ID of acting Planner"
          - "Append AuditEntry(event_kind=CHANGE_ORDER_APPROVED)"
          - "If a Settlement exists for the contract in DRAFT, recompute Settlement.provisional_total_cents := pinned_amount_cents + sum(approved ChangeOrder.delta_amount_cents) — and re-derive final_amount_cents (cascade)"
      - from: PENDING
        to: REJECTED
        trigger: POST /wedding-projects/{projectId}/contracts/{contractId}/change-orders/{changeOrderId}/reject
        actor: Planner
        preconditions:
          - "ChangeOrder must be PENDING (ERR_CHANGE_ORDER_NOT_PENDING)"
        side_effects: []

  - entity: Settlement
    initial_state: DRAFT
    terminal_states: [FINALIZED]
    transitions:
      - from: DRAFT
        to: VENDOR_CONFIRMED
        trigger: POST /wedding-projects/{projectId}/contracts/{contractId}/settlement/confirm
        actor: VendorRep
        preconditions:
          - "Settlement must be DRAFT (ERR_SETTLEMENT_NOT_DRAFT)"
          - "Contract.contract_status == ACCEPTED (ERR_CONTRACT_NOT_ACCEPTED)"
          - "VendorRep X-User-ID equals Vendor.id of the bound vendor (ERR_NOT_OWNING_VENDOR)"
        side_effects:
          - "confirmed_by_vendor_at := current clock"
      - from: VENDOR_CONFIRMED
        to: DRAFT
        trigger: "system (cascade from Contract terminate after settlement was confirmed)"
        actor: system
        preconditions: []
        side_effects:
          - "confirmed_by_vendor_at := null"
      - from: VENDOR_CONFIRMED
        to: FINALIZED
        trigger: POST /wedding-projects/{projectId}/contracts/{contractId}/settlement/finalize
        actor: Auditor
        preconditions:
          - "Settlement must be VENDOR_CONFIRMED (ERR_SETTLEMENT_NOT_CONFIRMED)"
          - "Acting Auditor X-User-ID MUST differ from Settlement.confirmed_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "Acting user role MUST be Auditor (ERR_AUDITOR_REQUIRED)"
        side_effects:
          - "finalized_by_user_id := X-User-ID of acting Auditor"
          - "Recompute final_amount_cents (see calculation final_settlement_amount)"
          - "Contract.payment_status: UNPAID|PARTIAL → FINALIZED if final_amount_cents > 0; → REFUNDED if refund_cents > 0 and final_amount_cents == 0"
          - "WeddingProject.finalized_settled_cents += Settlement.final_amount_cents"
          - "WeddingProject.provisional_committed_cents -= Settlement.provisional_total_cents"
          - "Vendor.avg_performance_rating recomputed using all PerformanceRatings on FINALIZED settlements (see calculation vendor_avg_performance)"
          - "Append AuditEntry(event_kind=SETTLEMENT_FINALIZED)"

  - entity: Milestone
    initial_state: PENDING
    terminal_states: [COMPLETED]
    transitions:
      - from: PENDING
        to: IN_PROGRESS
        trigger: PATCH /wedding-projects/{projectId}/milestones/{milestoneId}
        actor: Planner
        preconditions:
          - "Milestone must be PENDING (ERR_MILESTONE_NOT_PENDING)"
        side_effects: []
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: PATCH /wedding-projects/{projectId}/milestones/{milestoneId}
        actor: Planner
        preconditions:
          - "Milestone must be IN_PROGRESS (ERR_MILESTONE_NOT_IN_PROGRESS)"
        side_effects: []
      - from: PENDING
        to: OVERDUE
        trigger: "system (sweep when clock advances past due_at while status==PENDING)"
        actor: system
        preconditions:
          - "Clock >= due_at and status == PENDING"
        side_effects: []
      - from: IN_PROGRESS
        to: OVERDUE
        trigger: "system (sweep when clock advances past due_at while status==IN_PROGRESS)"
        actor: system
        preconditions:
          - "Clock >= due_at and status == IN_PROGRESS"
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two Planners attempt to sign the same Contract simultaneously after both passed budget checks"
    guarantee: "Exactly one sign succeeds; the second sees the contract has already advanced past NEGOTIATING"
    error_id: ERR_CONTRACT_NOT_NEGOTIATING
    http_status: 409
    serialization: "First-writer-wins on Contract.contract_status"

  - scenario: "Two Planners simultaneously bind two different Contracts whose pinned_amount_cents sums exceed budget_balance_cents (each individually fits, the pair does not)"
    guarantee: "At most one sign succeeds; the loser sees the post-commit budget check fail"
    error_id: ERR_BUDGET_OVERCOMMITTED
    http_status: 409
    serialization: "Serialize on WeddingProject.id; second writer recomputes provisional_committed_cents and rejects"

  - scenario: "Planner A approves a ChangeOrder while Planner B (also distinct from requester) approves a sibling ChangeOrder on the same contract simultaneously, and the combined delta would overcommit"
    guarantee: "At most one approval succeeds; loser sees overcommit"
    error_id: ERR_BUDGET_OVERCOMMITTED
    http_status: 409
    serialization: "Serialize on Contract.id"

  - scenario: "Two TimelineSlot creations overlap on the same vendor's window (vendor cannot be in two places at once)"
    guarantee: "First creation wins; second is rejected"
    error_id: ERR_TIMELINE_VENDOR_OVERLAP
    http_status: 409
    serialization: "Serialize on (project_id, vendor_id)"

  - scenario: "Two TimelineSlot creations on the same project overlap in CEREMONY-kind windows beyond the project's max parallel-ceremony cap"
    guarantee: "First creation wins; second exceeds the cap and is rejected"
    error_id: ERR_TIMELINE_PARALLEL_CAP_EXCEEDED
    http_status: 409
    serialization: "Serialize on project_id"

  - scenario: "Auditor finalize and Planner cancel-project occur simultaneously on a settlement-stage project"
    guarantee: "Exactly one wins; the loser sees the project status has moved"
    error_id: ERR_PROJECT_NOT_IN_SETTLEMENT
    http_status: 409
    serialization: "First-writer-wins on WeddingProject.status"

  - scenario: "Two RSVP updates on the same Guest race"
    guarantee: "OCC: second writer with stale version is rejected"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    serialization: "Optimistic concurrency on Guest.version"

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: provisional_committed_cents
    trigger: "Recomputed on every Contract sign, terminate, ChangeOrder approval, and Settlement finalize"
    algorithm: aggregation
    formula: |
      sum(
        Contract.pinned_amount_cents
          + sum(ChangeOrder.delta_amount_cents WHERE ChangeOrder.contract_id == Contract.id AND ChangeOrder.status == APPROVED)
        FOR Contract WHERE Contract.project_id == this.id
                       AND Contract.contract_status IN {SIGNED, ACCEPTED}
                       AND (no Settlement exists for Contract OR Settlement.status != FINALIZED)
      )
    input_set: "Contracts on this project whose contract_status IN {SIGNED, ACCEPTED} and whose linked Settlement (if any) is not yet FINALIZED."
    precision: "integer cents (no rounding)"
    note: "Excludes DRAFT/NEGOTIATING contracts (not yet committed) and FINALIZED settlements (those have been swept into finalized_settled_cents)."

  - name: finalized_settled_cents
    trigger: "Incremented when Settlement transitions to FINALIZED"
    algorithm: aggregation
    formula: |
      sum(Settlement.final_amount_cents FOR Settlement
          WHERE Settlement.contract.project_id == this.id
            AND Settlement.status == FINALIZED)
    input_set: "All FINALIZED settlements on this project, regardless of breach/refund."
    precision: "integer cents"

  - name: budget_balance_cents
    trigger: "Read-derived; recomputed alongside provisional_committed_cents and finalized_settled_cents"
    algorithm: aggregation
    formula: |
      budget_balance_cents = total_budget_cents - provisional_committed_cents - finalized_settled_cents

  - name: final_settlement_amount
    trigger: "Settlement.VENDOR_CONFIRMED → FINALIZED transition"
    algorithm: chronological
    formula: |
      # Apply ChangeOrders in chronological order of their APPROVED transition (created_at ascending of the
      # AuditEntry(event_kind=CHANGE_ORDER_APPROVED) row). Each delta is applied to a running base; if at any
      # point the running base would go negative, clamp at 0 BEFORE applying the next delta. Then deduct breach
      # and refund.
      base = Contract.pinned_amount_cents
      for change_order in approved_change_orders sorted by approval_audit_entry.created_at ASC:
        base = max(0, base + change_order.delta_amount_cents)
      provisional_total_cents = base
      final_amount_cents = max(0, provisional_total_cents - breach_deduction_cents - refund_cents)
    input_set: "All APPROVED ChangeOrders on the contract, ordered by AuditEntry.created_at of the approval."
    precision: "integer cents"
    variants:
      - name: provisional_estimate
        when: "Settlement.status == DRAFT or VENDOR_CONFIRMED — UI preview before finalize"
        difference: |
          The provisional preview applies deltas in DESCENDING order of approval time (so the latest revisions
          dominate first), without the per-step clamp at zero. Result may differ from final_amount_cents when
          intermediate sums would go negative. The provisional estimate is what is shown in the GET response
          for a DRAFT settlement; final_amount_cents (computed at FINALIZED) is what is committed to the budget.
      - name: final_committed
        when: "Settlement.status == FINALIZED"
        difference: |
          Final committed value uses ascending order with per-step max(0, …) clamp; it is the value persisted
          to Settlement.final_amount_cents and added to WeddingProject.finalized_settled_cents.

  - name: vendor_avg_performance
    trigger: "Settlement → FINALIZED, or PerformanceRating create/update/delete"
    algorithm: aggregation
    formula: |
      ratings = [PerformanceRating.score FOR PerformanceRating
                 WHERE PerformanceRating.vendor_id == this.id
                   AND PerformanceRating.settlement_id refers to a Settlement in FINALIZED status]
      if len(ratings) == 0:
        avg_performance_rating = null
        rating_count = 0
      else:
        # Sum then round once (NOT round-per-rating-then-sum). Fixed evaluation order.
        avg_performance_rating = round(sum(ratings) / len(ratings), 2)  # half-up
        rating_count = len(ratings)
    input_set: "PerformanceRatings whose linked Settlement is FINALIZED. Excludes ratings whose Settlement reverted to DRAFT after a Contract terminate cascade."
    precision: "2 decimal places, round_half_up"
    note: "PerformanceRating is an embedded record on Settlement (see endpoints) — created at finalize via POST .../settlement/{id}/performance-rating; vendor_avg_performance recomputes from scratch each time."
    variants:
      - name: include_terminated_finalized
        when: "Default — used by GET /vendors/{id}"
        difference: "Includes ratings whose contract was later TERMINATED (settlement still FINALIZED)."

  - name: timeline_overlap_check
    trigger: "TimelineSlot create/update; project rehearsal snapshot"
    algorithm: interval_merge
    formula: |
      Two slots A and B overlap (per-vendor rule) iff:
        max(A.start_at - A.setup_buffer_seconds, B.start_at - B.setup_buffer_seconds) <
        min(A.end_at, B.end_at)
      Adjacency without overlap (A.end_at == B.start_at - B.setup_buffer_seconds) is allowed (half-open intervals).
      Per-vendor rule (filter to A.vendor_id == B.vendor_id): if any pair overlaps → reject ERR_TIMELINE_VENDOR_OVERLAP.
      Project parallel-cap rule (filter to A.kind == B.kind == CEREMONY, ignore vendor): the count of CEREMONY
      slots overlapping at any instant t (counting setup_buffer extension on the start side) must not exceed
      MAX_PARALLEL_CEREMONY_SLOTS; otherwise reject ERR_TIMELINE_PARALLEL_CAP_EXCEEDED.
    constants:
      MAX_PARALLEL_CEREMONY_SLOTS: 2
    input_set: "All TimelineSlots on the project (excluding the slot under deletion)."
    precision: "integer seconds, half-open intervals [start_at - setup_buffer_seconds, end_at)"

  - name: rehearsal_snapshot_version
    trigger: "POST /wedding-projects/{projectId}/timeline/snapshot-rehearsal"
    algorithm: aggregation
    formula: |
      WeddingProject.rehearsal_version += 1
    input_set: "Atomic increment of the project's rehearsal counter; the snapshot is opaque to this scaffold."

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and non-empty"
    error_id: ERR_MISSING_AUTH_HEADERS
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role MUST be one of {Planner, VendorRep, Couple, Auditor}"
    error_id: ERR_INVALID_ROLE
    http_status: 401
    applies_to: all

  - priority: 3
    category: auth
    check: "When role is Planner, X-User-ID MUST equal WeddingProject.planner_user_id of the project in the URL path. When role is VendorRep, X-User-ID MUST equal Vendor.id of the vendor in the URL path or referenced by the contract."
    error_id: ERR_NOT_OWNING_PLANNER  # or ERR_NOT_OWNING_VENDOR depending on subject
    http_status: 403
    applies_to: "endpoints under /wedding-projects/{projectId}/* (Planner check) and /vendors/{vendorId}/* (VendorRep check)"

  - priority: 4
    category: existence
    check: "Resource ids in path MUST exist and belong to the URL parent (left-to-right validation)"
    error_id: "ERR_{RESOURCE}_NOT_FOUND (ERR_PROJECT_NOT_FOUND, ERR_VENDOR_NOT_FOUND, ERR_CONTRACT_NOT_FOUND, ERR_QUOTE_NOT_FOUND, ERR_MILESTONE_NOT_FOUND, ERR_GUEST_NOT_FOUND, ERR_TIMELINE_SLOT_NOT_FOUND, ERR_CHANGE_ORDER_NOT_FOUND, ERR_SETTLEMENT_NOT_FOUND, ERR_TEMPLATE_NOT_FOUND, ERR_AUDIT_ENTRY_NOT_FOUND)"
    http_status: 404
    applies_to: all nested resource endpoints

  - priority: 5
    category: state
    check: "Acting on a CANCELLED or CLOSED WeddingProject is forbidden for any mutation"
    error_id: ERR_PROJECT_TERMINAL
    http_status: 409
    applies_to: all mutating endpoints under /wedding-projects/{projectId}/*

  - priority: 6
    category: state
    check: "Target resource MUST be in the correct state for the requested transition (varies by transition; see §1.2)"
    error_id: "varies (ERR_CONTRACT_NOT_NEGOTIATING, ERR_CONTRACT_NOT_SIGNED, ERR_SETTLEMENT_NOT_DRAFT, ERR_SETTLEMENT_NOT_CONFIRMED, ERR_CHANGE_ORDER_NOT_PENDING, ERR_QUOTE_NOT_AVAILABLE, ERR_QUOTE_EXPIRED, ERR_PROJECT_NOT_IN_DRAFT, ERR_PROJECT_NOT_IN_PLANNING, ERR_PROJECT_NOT_IN_EXECUTION, ERR_PROJECT_NOT_IN_SETTLEMENT, ERR_MILESTONE_NOT_PENDING, ERR_MILESTONE_NOT_IN_PROGRESS, ERR_VENDOR_NOT_APPROVED)"
    http_status: 409
    applies_to: state-transition endpoints

  - priority: 7
    category: business_referential
    check: "Cross-aggregate references must resolve: Contract.quote_id MUST belong to Contract.vendor_id; Quote.vendor_id MUST refer to a Vendor with qualification_status==APPROVED at the time of binding; TimelineSlot.vendor_id MUST have an ACCEPTED Contract on this project."
    error_id: "varies (ERR_QUOTE_VENDOR_MISMATCH, ERR_VENDOR_NOT_APPROVED, ERR_TIMELINE_VENDOR_NOT_CONTRACTED)"
    http_status: 422
    applies_to: "POST /contracts, POST /timeline-slots, POST /quotes/offer"

  - priority: 8
    category: business_safety
    check: "Segregation of duties: (a) ChangeOrder.approved_by_user_id MUST differ from requested_by_user_id; (b) Settlement.finalized_by_user_id MUST differ from confirmed_by_user_id; (c) WeddingProject.auditor_user_id MUST differ from planner_user_id at creation"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /change-orders/{id}/approve, POST /settlement/finalize, POST /wedding-projects (creation), POST /wedding-projects/{id}/close"

  - priority: 9
    category: business_temporal
    check: "TimelineSlot per-vendor overlap rule (per calculation timeline_overlap_check): no two slots for the same vendor on the same project may overlap; setup_buffer_seconds extends the start side; intervals are half-open."
    error_id: ERR_TIMELINE_VENDOR_OVERLAP
    http_status: 409
    applies_to: "POST /timeline-slots, PATCH /timeline-slots/{id}"

  - priority: 10
    category: business_temporal
    check: "TimelineSlot project parallel-CEREMONY cap (per calculation timeline_overlap_check): at no instant may more than MAX_PARALLEL_CEREMONY_SLOTS=2 CEREMONY-kind slots be active simultaneously."
    error_id: ERR_TIMELINE_PARALLEL_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /timeline-slots, PATCH /timeline-slots/{id}"

  - priority: 11
    category: business_constraint
    check: "Guest.party_size MUST be >= 1; sum of party_size for Guests with rsvp_status==CONFIRMED on the project MUST not exceed the per-scale cap (INTIMATE=50, MEDIUM=200, GRAND=500)."
    error_id: ERR_GUEST_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /guests, PATCH /guests/{id}, POST /guests/{id}/rsvp"

  - priority: 12
    category: business_constraint
    check: "Guest.table_number, when set, MUST be a positive integer; the sum of party_size of guests assigned to the same table MUST not exceed TABLE_SEAT_LIMIT=10"
    error_id: ERR_TABLE_SEAT_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "PATCH /guests/{id}"

  - priority: 13
    category: business_fiscal
    check: "Budget overcommit: at any point WeddingProject.budget_balance_cents MUST remain >= 0 after the proposed mutation (sign, change-order approve, budget reallocation)"
    error_id: ERR_BUDGET_OVERCOMMITTED
    http_status: 402
    applies_to: "POST /contracts/{id}/sign, POST /change-orders/{id}/approve, POST /budget/reallocate"

  - priority: 14
    category: business_fiscal
    check: "Milestone percent_of_budget across the project MUST sum to exactly 100.0 before activation and after every milestone create/update/delete on a project in DRAFT or PLANNING status"
    error_id: ERR_MILESTONE_PERCENTAGES_INVALID
    http_status: 422
    applies_to: "POST /wedding-projects/{id}/activate, POST/PATCH/DELETE /milestones"

  - priority: 15
    category: business_constraint
    check: "OCC: when version is supplied on a PUT/PATCH and does not match the resource's current version, reject"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: "All PATCH/PUT endpoints accepting optional version field"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- WeddingProject ---
  - { method: POST,   path: "/wedding-projects", description: "Create a wedding project (optionally from a template)", roles: [Planner], code: 201, input: [couple_name, ceremony_date, style, scale, planner_user_id, auditor_user_id, total_budget_cents, "template_id?"], output: WeddingProject, side_effects: ["If template_id is supplied, copy ProjectTemplate.default_milestones into Milestone rows; status=DRAFT"] }
  - { method: GET,    path: "/wedding-projects", description: "List projects", roles: [Planner, Auditor, Couple], code: 200, input: ["limit?", "offset?", "status?"], output: "WeddingProject[]", side_effects: [] }
  - { method: GET,    path: "/wedding-projects/{projectId}", description: "Get one project", roles: [Planner, Auditor, Couple, VendorRep], code: 200, input: [], output: WeddingProject, side_effects: [] }
  - { method: POST,   path: "/wedding-projects/{projectId}/activate", description: "DRAFT → PLANNING", roles: [Planner], code: 200, input: [], output: WeddingProject, side_effects: ["state transition"] }
  - { method: POST,   path: "/wedding-projects/{projectId}/start-execution", description: "PLANNING → EXECUTION", roles: [Planner], code: 200, input: [], output: WeddingProject, side_effects: ["state transition"] }
  - { method: POST,   path: "/wedding-projects/{projectId}/enter-settlement", description: "EXECUTION → SETTLEMENT", roles: [Planner], code: 200, input: [], output: WeddingProject, side_effects: ["state transition"] }
  - { method: POST,   path: "/wedding-projects/{projectId}/close", description: "SETTLEMENT → CLOSED (Auditor only)", roles: [Auditor], code: 200, input: [], output: WeddingProject, side_effects: ["AuditEntry append"] }
  - { method: POST,   path: "/wedding-projects/{projectId}/cancel", description: "Cancel project from any non-terminal status", roles: [Planner], code: 200, input: [], output: WeddingProject, side_effects: ["Cascade: Contracts → TERMINATED → Quote WITHDRAWN, Settlements reset"] }
  - { method: POST,   path: "/wedding-projects/{projectId}/budget/reallocate", description: "Adjust per-milestone share without changing total_budget; supplied as new percent_of_budget per milestone", roles: [Planner], code: 200, input: [allocations], output: "Milestone[]", side_effects: ["Append AuditEntry(event_kind=BUDGET_REALLOCATED)"] }

  # --- ProjectTemplate ---
  - { method: POST,   path: "/project-templates", description: "Create a template", roles: [Auditor], code: 201, input: [name, scale, default_milestones], output: ProjectTemplate, side_effects: [] }
  - { method: GET,    path: "/project-templates", description: "List templates", roles: [Planner, Auditor], code: 200, input: ["limit?", "offset?", "scale?"], output: "ProjectTemplate[]", side_effects: [] }
  - { method: GET,    path: "/project-templates/{templateId}", description: "Get a template", roles: [Planner, Auditor], code: 200, input: [], output: ProjectTemplate, side_effects: [] }

  # --- Milestone ---
  - { method: POST,   path: "/wedding-projects/{projectId}/milestones", description: "Add a milestone", roles: [Planner], code: 201, input: [label, due_at, percent_of_budget], output: Milestone, side_effects: ["sum of percent_of_budget revalidated"] }
  - { method: GET,    path: "/wedding-projects/{projectId}/milestones", description: "List milestones", roles: [Planner, Auditor, Couple], code: 200, input: ["limit?", "offset?"], output: "Milestone[]", side_effects: [] }
  - { method: PATCH,  path: "/wedding-projects/{projectId}/milestones/{milestoneId}", description: "Update milestone (label, due_at, percent_of_budget) or advance status", roles: [Planner], code: 200, input: ["label?", "due_at?", "percent_of_budget?", "status?", "version?"], output: Milestone, side_effects: ["state transition if status supplied"] }
  - { method: DELETE, path: "/wedding-projects/{projectId}/milestones/{milestoneId}", description: "Remove milestone (only while project DRAFT)", roles: [Planner], code: 204, input: [], output: null, side_effects: ["Sum re-validated; ERR_MILESTONE_PERCENTAGES_INVALID if not 100% afterward"] }

  # --- Vendor ---
  - { method: POST,   path: "/vendors", description: "Register a vendor (PENDING_REVIEW)", roles: [VendorRep], code: 201, input: [name, category], output: Vendor, side_effects: [] }
  - { method: GET,    path: "/vendors", description: "List vendors", roles: [Planner, Auditor, VendorRep], code: 200, input: ["limit?", "offset?", "category?", "qualification_status?"], output: "Vendor[]", side_effects: [] }
  - { method: GET,    path: "/vendors/{vendorId}", description: "Get vendor", roles: [Planner, Auditor, VendorRep], code: 200, input: [], output: Vendor, side_effects: [] }
  - { method: POST,   path: "/vendors/{vendorId}/approve", description: "PENDING_REVIEW → APPROVED", roles: [Auditor], code: 200, input: [], output: Vendor, side_effects: [] }
  - { method: POST,   path: "/vendors/{vendorId}/reject", description: "PENDING_REVIEW → REJECTED", roles: [Auditor], code: 200, input: [], output: Vendor, side_effects: [] }
  - { method: POST,   path: "/vendors/{vendorId}/suspend", description: "APPROVED → SUSPENDED; cascades quotes WITHDRAWN", roles: [Auditor], code: 200, input: [], output: Vendor, side_effects: ["Quotes DRAFT/OFFERED → WITHDRAWN"] }
  - { method: POST,   path: "/vendors/{vendorId}/reinstate", description: "SUSPENDED → APPROVED", roles: [Auditor], code: 200, input: [], output: Vendor, side_effects: [] }

  # --- Quote ---
  - { method: POST,   path: "/vendors/{vendorId}/quotes", description: "Create a quote (DRAFT)", roles: [VendorRep], code: 201, input: [amount_cents, scope_description, valid_until], output: Quote, side_effects: ["category := Vendor.category"] }
  - { method: GET,    path: "/vendors/{vendorId}/quotes", description: "List quotes for a vendor", roles: [Planner, Auditor, VendorRep], code: 200, input: ["limit?", "offset?", "status?"], output: "Quote[]", side_effects: [] }
  - { method: POST,   path: "/vendors/{vendorId}/quotes/{quoteId}/offer", description: "DRAFT → OFFERED", roles: [VendorRep], code: 200, input: [], output: Quote, side_effects: [] }
  - { method: POST,   path: "/vendors/{vendorId}/quotes/{quoteId}/withdraw", description: "DRAFT → WITHDRAWN", roles: [VendorRep], code: 200, input: [], output: Quote, side_effects: [] }

  # --- Contract ---
  - { method: POST,   path: "/wedding-projects/{projectId}/contracts", description: "Create a contract binding (DRAFT)", roles: [Planner], code: 201, input: [vendor_id, quote_id], output: Contract, side_effects: ["Validates Quote belongs to Vendor"] }
  - { method: GET,    path: "/wedding-projects/{projectId}/contracts", description: "List contracts on a project", roles: [Planner, Auditor, Couple], code: 200, input: ["limit?", "offset?", "contract_status?", "payment_status?"], output: "Contract[]", side_effects: [] }
  - { method: GET,    path: "/wedding-projects/{projectId}/contracts/{contractId}", description: "Get one contract", roles: [Planner, Auditor, Couple, VendorRep], code: 200, input: [], output: Contract, side_effects: [] }
  - { method: POST,   path: "/wedding-projects/{projectId}/contracts/{contractId}/send-for-negotiation", description: "DRAFT → NEGOTIATING (Quote → OFFERED)", roles: [Planner], code: 200, input: [], output: Contract, side_effects: [] }
  - { method: POST,   path: "/wedding-projects/{projectId}/contracts/{contractId}/revise", description: "NEGOTIATING → DRAFT (cyclic, by VendorRep); negotiation_round += 1; Quote → DRAFT", roles: [VendorRep], code: 200, input: [], output: Contract, side_effects: ["Quote → DRAFT for re-pricing"] }
  - { method: POST,   path: "/wedding-projects/{projectId}/contracts/{contractId}/sign", description: "NEGOTIATING → SIGNED (pin Quote.version + amount; dispatch e-sign)", roles: [Planner], code: 200, input: [], output: Contract, side_effects: ["Quote → BOUND; e_sign_envelope_id set; provisional_committed_cents recomputed; possible OVERSPEND_WARNING_RAISED audit"] }
  - { method: POST,   path: "/wedding-projects/{projectId}/contracts/{contractId}/accept-signature", description: "SIGNED → ACCEPTED after e-sign callback received", roles: [Planner, Auditor], code: 200, input: [], output: Contract, side_effects: [] }
  - { method: POST,   path: "/wedding-projects/{projectId}/contracts/{contractId}/terminate", description: "Any non-terminal contract_status → TERMINATED with cascading effects", roles: [Planner], code: 200, input: [], output: Contract, side_effects: ["Quote → WITHDRAWN; TimelineSlots deleted; Settlement reset to DRAFT if confirmed; AuditEntry append"] }

  # --- ChangeOrder ---
  - { method: POST,   path: "/wedding-projects/{projectId}/contracts/{contractId}/change-orders", description: "Create a change order (PENDING)", roles: [Planner], code: 201, input: [delta_amount_cents, reason], output: ChangeOrder, side_effects: ["requested_by_user_id := X-User-ID"] }
  - { method: GET,    path: "/wedding-projects/{projectId}/contracts/{contractId}/change-orders", description: "List change orders for a contract", roles: [Planner, Auditor], code: 200, input: ["limit?", "offset?", "status?"], output: "ChangeOrder[]", side_effects: [] }
  - { method: POST,   path: "/wedding-projects/{projectId}/contracts/{contractId}/change-orders/{changeOrderId}/approve", description: "PENDING → APPROVED (segregation: approver != requester)", roles: [Planner], code: 200, input: [], output: ChangeOrder, side_effects: ["Settlement.provisional_total_cents recomputed if exists; AuditEntry append"] }
  - { method: POST,   path: "/wedding-projects/{projectId}/contracts/{contractId}/change-orders/{changeOrderId}/reject", description: "PENDING → REJECTED", roles: [Planner], code: 200, input: [], output: ChangeOrder, side_effects: [] }

  # --- Settlement ---
  - { method: POST,   path: "/wedding-projects/{projectId}/contracts/{contractId}/settlement", description: "Create the (single) Settlement for an ACCEPTED contract (DRAFT)", roles: [Planner], code: 201, input: ["breach_deduction_cents?", "refund_cents?"], output: Settlement, side_effects: ["confirmed_by_user_id := X-User-ID; provisional_total_cents computed"] }
  - { method: GET,    path: "/wedding-projects/{projectId}/contracts/{contractId}/settlement", description: "Get the contract's settlement", roles: [Planner, Auditor, VendorRep], code: 200, input: [], output: Settlement, side_effects: ["Returns provisional_estimate variant of final_amount_cents in DRAFT/VENDOR_CONFIRMED state"] }
  - { method: PATCH,  path: "/wedding-projects/{projectId}/contracts/{contractId}/settlement", description: "Update breach_deduction_cents or refund_cents while still DRAFT", roles: [Planner], code: 200, input: ["breach_deduction_cents?", "refund_cents?", "version?"], output: Settlement, side_effects: [] }
  - { method: POST,   path: "/wedding-projects/{projectId}/contracts/{contractId}/settlement/confirm", description: "DRAFT → VENDOR_CONFIRMED (VendorRep only)", roles: [VendorRep], code: 200, input: [], output: Settlement, side_effects: ["confirmed_by_vendor_at := clock"] }
  - { method: POST,   path: "/wedding-projects/{projectId}/contracts/{contractId}/settlement/finalize", description: "VENDOR_CONFIRMED → FINALIZED (Auditor only; segregation)", roles: [Auditor], code: 200, input: [], output: Settlement, side_effects: ["final_settlement_amount computed (final_committed variant); Contract.payment_status updated; project ledgers updated; vendor_avg_performance recomputed; AuditEntry append"] }
  - { method: POST,   path: "/wedding-projects/{projectId}/contracts/{contractId}/settlement/performance-rating", description: "Record a vendor performance rating (1-5) on a FINALIZED settlement", roles: [Planner], code: 201, input: [score, "comment?"], output: PerformanceRating, side_effects: ["vendor_avg_performance recomputed"] }

  # --- TimelineSlot ---
  - { method: POST,   path: "/wedding-projects/{projectId}/timeline-slots", description: "Create a timeline slot", roles: [Planner], code: 201, input: ["vendor_id?", start_at, end_at, "setup_buffer_seconds?", "kind?", label], output: TimelineSlot, side_effects: ["Overlap and parallel-cap validated"] }
  - { method: GET,    path: "/wedding-projects/{projectId}/timeline-slots", description: "List timeline slots", roles: [Planner, Auditor, Couple, VendorRep], code: 200, input: ["limit?", "offset?", "kind?", "vendor_id?"], output: "TimelineSlot[]", side_effects: [] }
  - { method: PATCH,  path: "/wedding-projects/{projectId}/timeline-slots/{slotId}", description: "Update a slot", roles: [Planner], code: 200, input: ["start_at?", "end_at?", "setup_buffer_seconds?", "label?", "version?"], output: TimelineSlot, side_effects: ["Overlap re-validated"] }
  - { method: DELETE, path: "/wedding-projects/{projectId}/timeline-slots/{slotId}", description: "Delete a slot", roles: [Planner], code: 204, input: [], output: null, side_effects: [] }
  - { method: POST,   path: "/wedding-projects/{projectId}/timeline/snapshot-rehearsal", description: "Increment rehearsal_version (snapshot the timeline as a rehearsal)", roles: [Planner], code: 200, input: [], output: WeddingProject, side_effects: ["rehearsal_version += 1"] }

  # --- Guest ---
  - { method: POST,   path: "/wedding-projects/{projectId}/guests", description: "Add a guest (INVITED)", roles: [Planner, Couple], code: 201, input: [full_name, "party_size?", "dietary_requirements?", "accessibility_requirements?"], output: Guest, side_effects: [] }
  - { method: GET,    path: "/wedding-projects/{projectId}/guests", description: "List guests", roles: [Planner, Auditor, Couple], code: 200, input: ["limit?", "offset?", "rsvp_status?"], output: "Guest[]", side_effects: [] }
  - { method: PATCH,  path: "/wedding-projects/{projectId}/guests/{guestId}", description: "Update guest fields including table_number, dietary, gift_amount_cents, thank_you_sent_at", roles: [Planner, Couple], code: 200, input: ["full_name?", "party_size?", "dietary_requirements?", "accessibility_requirements?", "table_number?", "gift_amount_cents?", "thank_you_sent_at?", "version?"], output: Guest, side_effects: ["Capacity and table-seat-limit re-validated"] }
  - { method: POST,   path: "/wedding-projects/{projectId}/guests/{guestId}/rsvp", description: "Set rsvp_status (INVITED/CONFIRMED/DECLINED/NO_RESPONSE)", roles: [Planner, Couple], code: 200, input: [rsvp_status], output: Guest, side_effects: ["Capacity re-validated when CONFIRMED"] }

  # --- AuditEntry (append-only, read-only externally) ---
  - { method: GET,    path: "/wedding-projects/{projectId}/audit-entries", description: "List audit entries for a project", roles: [Planner, Auditor], code: 200, input: ["limit?", "offset?", "subject_type?", "event_kind?"], output: "AuditEntry[]", side_effects: [] }

  # --- External-system event hooks (test driving + integration with payment/IM/e-sign) ---
  - { method: POST,   path: "/_events/emit", description: "Test/integration hook: emit an external event ({kind: ESIGN_COMPLETED|PAYMENT_RECEIVED|IM_DELIVERED, envelope_id?, contract_id?, settlement_id?}). Drives system-actor transitions.", roles: [Planner, Auditor, VendorRep, Couple], code: 202, input: [kind, "envelope_id?", "contract_id?", "settlement_id?"], output: null, side_effects: ["May trigger Contract SIGNED→ACCEPTED auto-eligibility; PAYMENT_RECEIVED records but is informational here"] }
  - { method: POST,   path: "/_clock/advance", description: "Test hook: advance the system clock to an absolute Unix timestamp; runs scheduled sweeps (Quote EXPIRED, Milestone OVERDUE)", roles: [Planner, Auditor, VendorRep, Couple], code: 200, input: [to_timestamp], output: null, side_effects: ["Quote OFFERED → EXPIRED if clock >= valid_until; Milestone PENDING/IN_PROGRESS → OVERDUE if clock >= due_at"] }
  - { method: POST,   path: "/_sweep/run", description: "Test hook: run the periodic sweep manually (alias for forcing the same logic _clock/advance triggers)", roles: [Planner, Auditor, VendorRep, Couple], code: 200, input: [], output: null, side_effects: ["Same as _clock/advance side-effect set, without changing the clock"] }

# Note: PerformanceRating is referenced by the settlement/performance-rating endpoint.
# It is a small embedded record with: id, settlement_id (FK), vendor_id (FK, denormalized from settlement.contract.vendor_id), score (integer 1..5), comment (string, optional), created_at.
# It is intentionally NOT a top-level entity (immutable, append-only); declared inline here to keep the entity count lean while still letting the vendor_avg_performance calculation reference it.

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  # auth
  - { id: ERR_MISSING_AUTH_HEADERS,             http: 401, condition: "Missing or empty X-User-ID / X-User-Role" }
  - { id: ERR_INVALID_ROLE,                     http: 401, condition: "X-User-Role not in {Planner, VendorRep, Couple, Auditor}" }
  - { id: ERR_NOT_OWNING_PLANNER,               http: 403, condition: "Acting Planner does not own the WeddingProject" }
  - { id: ERR_NOT_OWNING_VENDOR,                http: 403, condition: "Acting VendorRep is not the bound Vendor" }
  - { id: ERR_AUDITOR_REQUIRED,                 http: 403, condition: "Operation requires Auditor role" }
  - { id: ERR_SEGREGATION_OF_DUTIES,            http: 403, condition: "Approver/Finalizer same as Requester/Confirmer (or Auditor==Planner)" }

  # not found
  - { id: ERR_PROJECT_NOT_FOUND,                http: 404, condition: "WeddingProject id does not exist" }
  - { id: ERR_VENDOR_NOT_FOUND,                 http: 404, condition: "Vendor id does not exist" }
  - { id: ERR_CONTRACT_NOT_FOUND,               http: 404, condition: "Contract id does not exist or wrong project" }
  - { id: ERR_QUOTE_NOT_FOUND,                  http: 404, condition: "Quote id does not exist or wrong vendor" }
  - { id: ERR_MILESTONE_NOT_FOUND,              http: 404, condition: "Milestone id does not exist or wrong project" }
  - { id: ERR_GUEST_NOT_FOUND,                  http: 404, condition: "Guest id does not exist or wrong project" }
  - { id: ERR_TIMELINE_SLOT_NOT_FOUND,          http: 404, condition: "TimelineSlot id does not exist or wrong project" }
  - { id: ERR_CHANGE_ORDER_NOT_FOUND,           http: 404, condition: "ChangeOrder id does not exist or wrong contract" }
  - { id: ERR_SETTLEMENT_NOT_FOUND,             http: 404, condition: "Settlement does not exist for this contract" }
  - { id: ERR_TEMPLATE_NOT_FOUND,               http: 404, condition: "ProjectTemplate id does not exist" }
  - { id: ERR_AUDIT_ENTRY_NOT_FOUND,            http: 404, condition: "AuditEntry id does not exist" }

  # state
  - { id: ERR_PROJECT_TERMINAL,                 http: 409, condition: "Project is CLOSED or CANCELLED — mutations forbidden" }
  - { id: ERR_PROJECT_NOT_IN_DRAFT,             http: 409, condition: "Project must be DRAFT" }
  - { id: ERR_PROJECT_NOT_IN_PLANNING,          http: 409, condition: "Project must be PLANNING" }
  - { id: ERR_PROJECT_NOT_IN_EXECUTION,         http: 409, condition: "Project must be EXECUTION" }
  - { id: ERR_PROJECT_NOT_IN_SETTLEMENT,        http: 409, condition: "Project must be SETTLEMENT" }
  - { id: ERR_CONTRACT_NOT_IN_DRAFT,            http: 409, condition: "Contract must be DRAFT" }
  - { id: ERR_CONTRACT_NOT_NEGOTIATING,         http: 409, condition: "Contract must be NEGOTIATING" }
  - { id: ERR_CONTRACT_NOT_SIGNED,              http: 409, condition: "Contract must be SIGNED" }
  - { id: ERR_CONTRACT_NOT_ACCEPTED,            http: 409, condition: "Contract must be ACCEPTED" }
  - { id: ERR_CONTRACT_NOT_BOUND,               http: 409, condition: "Contract must be SIGNED or ACCEPTED" }
  - { id: ERR_QUOTE_NOT_AVAILABLE,              http: 409, condition: "Quote must be DRAFT or OFFERED" }
  - { id: ERR_QUOTE_EXPIRED,                    http: 409, condition: "Quote.valid_until has passed" }
  - { id: ERR_VENDOR_NOT_APPROVED,              http: 422, condition: "Vendor.qualification_status != APPROVED" }
  - { id: ERR_SETTLEMENT_NOT_DRAFT,             http: 409, condition: "Settlement must be DRAFT" }
  - { id: ERR_SETTLEMENT_NOT_CONFIRMED,         http: 409, condition: "Settlement must be VENDOR_CONFIRMED" }
  - { id: ERR_CHANGE_ORDER_NOT_PENDING,         http: 409, condition: "ChangeOrder must be PENDING" }
  - { id: ERR_MILESTONE_NOT_PENDING,            http: 409, condition: "Milestone must be PENDING" }
  - { id: ERR_MILESTONE_NOT_IN_PROGRESS,        http: 409, condition: "Milestone must be IN_PROGRESS" }
  - { id: ERR_NO_MILESTONES,                    http: 422, condition: "Project has zero milestones" }
  - { id: ERR_REQUIRED_CATEGORY_UNCOVERED,      http: 422, condition: "VENUE or CATERING category has no ACCEPTED Contract before EXECUTION" }
  - { id: ERR_OPEN_CONTRACTS_REMAIN,            http: 422, condition: "Contracts still in DRAFT/NEGOTIATING/SIGNED block enter-settlement" }
  - { id: ERR_CEREMONY_NOT_ELAPSED,             http: 422, condition: "Clock has not yet passed ceremony_date" }
  - { id: ERR_UNFINALIZED_SETTLEMENTS,          http: 422, condition: "Some Contract on the project lacks a FINALIZED Settlement (and is not TERMINATED)" }
  - { id: ERR_ESIGN_NOT_COMPLETE,               http: 409, condition: "No ESIGN_COMPLETED event has been received for this envelope" }

  # referential / business
  - { id: ERR_QUOTE_VENDOR_MISMATCH,            http: 422, condition: "Contract.quote_id does not belong to Contract.vendor_id" }
  - { id: ERR_TIMELINE_VENDOR_NOT_CONTRACTED,   http: 422, condition: "TimelineSlot vendor_id has no ACCEPTED Contract on this project" }
  - { id: ERR_TIMELINE_VENDOR_OVERLAP,          http: 409, condition: "Per-vendor timeline overlap (with setup_buffer)" }
  - { id: ERR_TIMELINE_PARALLEL_CAP_EXCEEDED,   http: 409, condition: "More than MAX_PARALLEL_CEREMONY_SLOTS=2 CEREMONY slots overlap at some instant" }
  - { id: ERR_GUEST_CAPACITY_EXCEEDED,          http: 409, condition: "Sum of CONFIRMED party_size exceeds per-scale cap" }
  - { id: ERR_TABLE_SEAT_LIMIT_EXCEEDED,        http: 409, condition: "Sum of party_size at a table exceeds TABLE_SEAT_LIMIT=10" }
  - { id: ERR_BUDGET_OVERCOMMITTED,             http: 402, condition: "WeddingProject.budget_balance_cents would go negative after this mutation" }
  - { id: ERR_MILESTONE_PERCENTAGES_INVALID,    http: 422, condition: "Sum of Milestone.percent_of_budget != 100.0" }

  # OCC
  - { id: ERR_VERSION_CONFLICT,                 http: 409, condition: "Supplied version does not match current resource version" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Planner
    description: "Project owner; creates and operates the WeddingProject and its sub-resources, signs contracts, approves change orders, drafts settlements, manages timeline and guests."
    identity: "opaque"  # Planner is an operator identity; planner_user_id is stored as a free string on WeddingProject, not an FK to a Planner entity. Ownership is enforced by string-equality of X-User-ID against WeddingProject.planner_user_id.
    exclusive_operations:
      - "POST /wedding-projects (create project — also sets planner_user_id)"
      - "POST /wedding-projects/{id}/activate, /start-execution, /enter-settlement, /cancel"
      - "POST /wedding-projects/{id}/contracts (create), /send-for-negotiation, /sign, /terminate"
      - "POST /change-orders, /change-orders/{id}/approve, /change-orders/{id}/reject"
      - "POST /settlement (create draft), PATCH /settlement"
      - "POST /settlement/performance-rating"
      - "POST /timeline-slots, PATCH /timeline-slots, DELETE /timeline-slots, /timeline/snapshot-rehearsal"
      - "POST /milestones, PATCH /milestones, DELETE /milestones"
      - "POST /budget/reallocate"
    shared_operations:
      - "GET on most read endpoints (with Auditor, Couple)"
      - "POST /accept-signature (with Auditor)"
      - "POST /guests, PATCH /guests, /guests/{id}/rsvp (with Couple)"
      - "POST /_events/emit, /_clock/advance, /_sweep/run (test hooks; any role)"

  - name: VendorRep
    description: "Acts on behalf of a single Vendor entity; creates quotes, revises contracts (cyclic loop), confirms settlements."
    identity: "entity_backed:Vendor"  # X-User-ID equals the Vendor.id this representative speaks for
    exclusive_operations:
      - "POST /vendors (register), POST /vendors/{id}/quotes, /quotes/{id}/offer, /quotes/{id}/withdraw"
      - "POST /contracts/{id}/revise (NEGOTIATING → DRAFT, cyclic)"
      - "POST /settlement/confirm (DRAFT → VENDOR_CONFIRMED)"
    shared_operations:
      - "GET on vendor, quote, contract, settlement endpoints"

  - name: Couple
    description: "The wedding couple; can view their project and manage the guest list."
    identity: "opaque"  # X-User-ID is a free identifier; the Couple is implicit (the project's couple_name); Couple ownership is enforced by membership in the project, not by FK to a Couple entity.
    exclusive_operations: []
    shared_operations:
      - "POST /guests, PATCH /guests, /guests/{id}/rsvp (with Planner)"
      - "GET on project, contracts, milestones, guests, timeline-slots"

  - name: Auditor
    description: "Independent reviewer; approves vendor qualification, finalizes settlements (segregation from Planner), closes the project."
    identity: "opaque"  # Auditor is an operator identity; Auditor ownership of a project is enforced by string-equality of X-User-ID against WeddingProject.auditor_user_id.
    exclusive_operations:
      - "POST /vendors/{id}/approve, /reject, /suspend, /reinstate"
      - "POST /settlement/finalize"
      - "POST /wedding-projects/{id}/close"
      - "POST /project-templates (create)"
    shared_operations:
      - "GET on most read endpoints"
      - "POST /accept-signature (with Planner)"
