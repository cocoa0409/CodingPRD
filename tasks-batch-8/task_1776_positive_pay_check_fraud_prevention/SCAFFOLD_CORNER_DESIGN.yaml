            - "err == ERR_SESSION_NOT_COMPLETABLE (409)"
      - name: session_no_show_via_sweep
        claim_type: valid_transition
        grounds: [state_machines.TrainingSession.SCHEDULED_to_NO_SHOW]
        distinguishing_aspect: "DAILY_SWEEP marks SCHEDULED sessions whose scheduled_end has passed as NO_SHOW."
        test_recipe:
          setup: ["Enrollment with a session scheduled 2026-08-02T09:00:00Z..10:00:00Z; clock advanced beyond"]
          setup_api_calls:
            - { call: "POST /treasury/enrollments", payload: { business_name: "ShowCo", tier: "POSITIVE_PAY", default_decision: "PAY" }, as: BankTreasuryManager, captures: { enr: $.data.id } }
            - { call: "POST /treasury/training-sessions", payload: { enrollment_id: "${enr}", trainer_id: "tr-9", scheduled_start: "2026-08-02T09:00:00Z", scheduled_end: "2026-08-02T10:00:00Z" }, as: BankOps, captures: { sess: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: BankOps }
          trigger:
            - { call: "POST /treasury/ops-runs", payload: { kind: "DAILY_SWEEP", enrollment_id: "${enr}" }, as: BankOps, captures: { n: $.data.sessions_marked_no_show } }
            - { call: "GET /treasury/training-sessions/${sess}", payload: {}, as: BankOps, captures: { st: $.data.status } }
          assert:
