# =============================================================================
# Funeral Home & Cemetery — benchmark seed tables (Expert)
# §1.0–§1.7 live here. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml;
# §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Funeral Home & Cemetery: decedent/case intake, itemized GPL service/merchandise,
  preneed vs at-need trust contract, plot/interment inventory, chapel/graveside
  scheduling, death certificate/permit, FTC funeral-rule disclosure, insurance
  assignment

domain_name: funeral-home-cemetery
api_prefix: ""

# Flat topology: peer top-level collections (/cases, /contracts, /plots, /venues,
# /gpl-items, /events, /permits, /trust-deposits, /insurance-assignments) joined
# by foreign keys; FuneralHome is a singleton-style configuration tenant created
# first and referenced by GplItem/Plot/Venue. Cross-cutting associations
# (StatementLine -> GplItem, Event -> Venue|Plot, InsuranceAssignment -> Contract)
# span the graph.
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - derived_field_reconciliation
    - optimistic_concurrency
    - temporal_windowing

  entity_topology: flat
  state_machine_shape: branching            # Contract cyclic + Permit branching-with-revert + Case parallel dimensions
  relationship_patterns:
    - one_to_many                            # Case -> StatementLine, Contract -> TrustDeposit
    - cross_aggregate                        # Event -> Venue|Plot, StatementLine -> GplItem
    - polymorphic                            # Event.resource_id references Venue OR Plot per resource_kind
  role_model: segregation_of_duties          # FTC disclosure-giver cannot also be the trust-funding officer
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: FuneralHome
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: name, type: string, source: input, description: "Establishment legal name" }
      - { name: sales_tax_pct, type: number, source: input, description: "Sales tax rate applied to taxable merchandise lines, e.g. 0.08", constraints: "0 <= sales_tax_pct < 1" }
      - { name: state_trust_pct, type: number, source: input, description: "State-mandated fraction of preneed trustable goods/services that must be deposited to trust, e.g. 0.90", constraints: "0 < state_trust_pct <= 1" }
      - { name: trust_admin_retention_cents, type: integer, source: input, default: 0, description: "Flat per-contract administrative amount the home may retain (not trusted), in cents", constraints: ">= 0" }
      - { name: chapel_buffer_minutes, type: integer, source: input, default: 30, description: "Mandatory cleanup buffer enforced between consecutive chapel bookings on the same Venue", constraints: ">= 0" }
      - { name: trust_balance_cents, type: integer, source: computed, default: 0, description: "Conserved quantity: sum over all this home's Contracts of (trust_principal_cents + credited_earnings_cents); i.e. POSTED PRINCIPAL+EARNINGS minus POSTED REFUND across the home's contracts" }

  - name: GplItem
    parent: null
    common_fields: true
    fields:
      - { name: funeral_home_id, type: string, source: input, description: "FK -> FuneralHome.id" }
      - { name: code, type: string, source: input, description: "Catalog code, unique within funeral_home_id" }
      - { name: name, type: string, source: input, description: "Line item display name" }
      - { name: category, type: enum, source: input, description: "SERVICE | MERCHANDISE", constraints: "SERVICE | MERCHANDISE" }
      - { name: taxable, type: boolean, source: input, default: false, description: "True only for MERCHANDISE; SERVICE lines are tax-exempt" }
      - { name: non_declinable, type: boolean, source: input, default: false, description: "FTC non-declinable basic-services-of-funeral-director fee; always included on every statement" }
      - { name: preneed_trustable, type: boolean, source: input, default: true, description: "Whether this item's value enters the preneed trust requirement base" }
      - { name: unit_price_cents, type: integer, source: input, description: "Current GPL unit price in cents", constraints: ">= 0" }
      - { name: active, type: boolean, source: system, default: true, description: "Catalog availability flag; deactivated items cannot be added to new statements" }

  - name: Case
    parent: null
    common_fields: true
    fields:
      - { name: funeral_home_id, type: string, source: input, description: "FK -> FuneralHome.id" }
      - { name: decedent_name, type: string, source: input, description: "Full legal name of the decedent" }
      - { name: case_mode, type: enum, source: input, description: "AT_NEED (death has occurred) | PRENEED (arranged in advance)", constraints: "AT_NEED | PRENEED" }
      - { name: date_of_death, type: datetime, source: input, default: null, description: "ISO 8601; required for AT_NEED, must be null for PRENEED" }
      - { name: arrangement_status, type: enum, source: system, description: "Arrangement-axis state: INTAKE -> DISCLOSED -> ARRANGED -> COMPLETED | CANCELLED", constraints: "INTAKE | DISCLOSED | ARRANGED | COMPLETED | CANCELLED" }
      - { name: interment_status, type: enum, source: system, default: "NOT_READY", description: "Independent interment-axis state: NOT_READY -> READY -> INTERRED; reset to NOT_READY on cancel", constraints: "NOT_READY | READY | INTERRED" }
      - { name: disclosure_acknowledged, type: boolean, source: system, default: false, description: "True once FTC funeral-rule GPL disclosure has been acknowledged for this case" }
      - { name: disclosure_officer_id, type: string, source: system, default: null, description: "X-User-ID of the Arranger who acknowledged the FTC disclosure (segregation-of-duties anchor)" }
      - { name: statement_total_provisional_cents, type: integer, source: computed, default: 0, description: "Provisional GPL statement total: per-line rounded tax then summed over PROPOSED+SELECTED lines" }
      - { name: statement_total_final_cents, type: integer, source: computed, default: 0, description: "Final locked GPL statement total: per-line rounded tax then summed over SELECTED lines only; frozen at GFS issuance" }
      - { name: gfs_issued, type: boolean, source: system, default: false, description: "True once the itemized Goods & Services Statement (GFS) has been issued and final total locked" }
      - { name: version, type: integer, source: system, description: "OCC version; starts at 1, +1 every mutation including cascades" }

  - name: StatementLine
    parent: Case
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id" }
      - { name: gpl_item_id, type: string, source: input, description: "FK -> GplItem.id; price/category/flags snapshotted at add time" }
      - { name: description, type: string, source: system, description: "Copied from GplItem.name at add time" }
      - { name: category, type: enum, source: system, description: "Snapshot of GplItem.category", constraints: "SERVICE | MERCHANDISE" }
      - { name: taxable, type: boolean, source: system, description: "Snapshot of GplItem.taxable" }
      - { name: non_declinable, type: boolean, source: system, description: "Snapshot of GplItem.non_declinable" }
      - { name: preneed_trustable, type: boolean, source: system, description: "Snapshot of GplItem.preneed_trustable" }
      - { name: unit_price_cents, type: integer, source: system, description: "Snapshot of GplItem.unit_price_cents at add time (price-lock)" }
      - { name: quantity, type: integer, source: input, default: 1, description: "Line quantity", constraints: ">= 1" }
      - { name: line_status, type: enum, source: system, default: "PROPOSED", description: "PROPOSED -> SELECTED -> REMOVED; non_declinable lines are created SELECTED and cannot be REMOVED", constraints: "PROPOSED | SELECTED | REMOVED" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: Contract
    parent: Case
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id; exactly one Contract per Case" }
      - { name: funding_type, type: enum, source: input, description: "PRENEED_TRUST | AT_NEED_DIRECT | INSURANCE_ASSIGNMENT", constraints: "PRENEED_TRUST | AT_NEED_DIRECT | INSURANCE_ASSIGNMENT" }
      - { name: status, type: enum, source: system, description: "DRAFT -> PENDING_FUNDING -> FUNDED -> SETTLED | VOID; PENDING_FUNDING can revert to DRAFT (preneed amendment loop)", constraints: "DRAFT | PENDING_FUNDING | FUNDED | SETTLED | VOID" }
      - { name: contract_amount_cents, type: integer, source: computed, default: 0, description: "Amount the contract must cover; mirrors Case.statement_total_final_cents once GFS issued, else statement_total_provisional_cents" }
      - { name: trust_required_cents, type: integer, source: computed, default: 0, description: "Required trust PRINCIPAL for PRENEED_TRUST: max(0, round_half_up(trustable_base * state_trust_pct) - trust_admin_retention_cents); 0 for non-preneed. The trust gate compares trust_principal_cents (PRINCIPAL only) to this." }
      - { name: trust_principal_cents, type: integer, source: computed, default: 0, description: "Conserved quantity (PRINCIPAL corpus): sum(TrustDeposit.amount_cents where kind=PRINCIPAL and status=POSTED) - sum(where kind=REFUND and status=POSTED). EARNINGS deposits do NOT count here." }
      - { name: credited_earnings_cents, type: integer, source: computed, default: 0, description: "Sum(TrustDeposit.amount_cents where kind=EARNINGS and status=POSTED); credited interest, separate from principal" }
      - { name: funded_amount_cents, type: integer, source: computed, default: 0, description: "Dual-variant: PRENEED_TRUST -> trust_principal_cents + credited_earnings_cents + projected_earnings_cents; AT_NEED_DIRECT -> chronological sum of posted PRINCIPAL payments; INSURANCE_ASSIGNMENT -> sum of VERIFIED assignment values" }
      - { name: projected_earnings_cents, type: integer, source: computed, default: 0, description: "Forward-looking projected trust earnings = floor(trust_principal_cents * PROJECTION_RATE) for PRENEED_TRUST; 0 otherwise" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: TrustDeposit
    parent: Contract
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> Contract.id" }
      - { name: kind, type: enum, source: input, description: "PRINCIPAL (client payment into trust) | EARNINGS (credited interest) | REFUND (reversal on void)", constraints: "PRINCIPAL | EARNINGS | REFUND" }
      - { name: amount_cents, type: integer, source: input, description: "Deposit amount in cents; sign is implied by kind (REFUND subtracts)", constraints: ">= 1" }
      - { name: status, type: enum, source: system, default: "POSTED", description: "POSTED -> REFUNDED; REFUND-kind deposits are created POSTED and represent the subtraction leg", constraints: "POSTED | REFUNDED" }
      - { name: posted_at, type: datetime, source: system, description: "Server stamp used as the chronological ordering key for at-need ledger replay (created_at tie-break)" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: InsuranceAssignment
    parent: Contract
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> Contract.id" }
      - { name: policy_number, type: string, source: input, description: "Assigned life-insurance policy number" }
      - { name: carrier, type: string, source: input, description: "Insurance carrier name" }
      - { name: assigned_value_cents, type: integer, source: input, description: "Irrevocably assigned death benefit available to fund the contract", constraints: ">= 1" }
      - { name: status, type: enum, source: system, default: "PENDING", description: "PENDING -> VERIFIED -> RELEASED | DECLINED; only VERIFIED assignments count toward funded_amount_cents", constraints: "PENDING | VERIFIED | RELEASED | DECLINED" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: Plot
    parent: null
    common_fields: true
    fields:
      - { name: funeral_home_id, type: string, source: input, description: "FK -> FuneralHome.id (cemetery owned by this home)" }
      - { name: section, type: string, source: input, description: "Cemetery section label" }
      - { name: plot_code, type: string, source: input, description: "Plot identifier, unique within funeral_home_id" }
      - { name: current_price_cents, type: integer, source: input, description: "Current at-need plot price in cents", constraints: ">= 0" }
      - { name: status, type: enum, source: system, default: "AVAILABLE", description: "AVAILABLE -> RESERVED -> INTERRED; RESERVED can release back to AVAILABLE", constraints: "AVAILABLE | RESERVED | INTERRED" }
      - { name: reserved_case_id, type: string, source: system, default: null, description: "FK -> Case.id; the Case holding this plot while RESERVED or INTERRED (null when AVAILABLE)" }
      - { name: locked_price_cents, type: integer, source: system, default: null, description: "Price snapshotted onto the plot at reservation time (price-lock); used for PRENEED, vs current_price_cents for AT_NEED" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: Venue
    parent: null
    common_fields: true
    fields:
      - { name: funeral_home_id, type: string, source: input, description: "FK -> FuneralHome.id" }
      - { name: name, type: string, source: input, description: "Chapel/venue name" }
      - { name: capacity, type: integer, source: input, description: "Seating capacity", constraints: ">= 1" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: Event
    parent: Case
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id" }
      - { name: resource_kind, type: enum, source: input, description: "CHAPEL (books a Venue, buffered half-open interval) | GRAVESIDE (books a Plot, whole-day exclusive)", constraints: "CHAPEL | GRAVESIDE" }
      - { name: resource_id, type: string, source: input, description: "FK -> Venue.id when resource_kind=CHAPEL; FK -> Plot.id when resource_kind=GRAVESIDE (polymorphic)" }
      - { name: starts_at, type: datetime, source: input, description: "ISO 8601 UTC start; CHAPEL uses minute granularity, GRAVESIDE uses the calendar date only" }
      - { name: ends_at, type: datetime, source: input, default: null, description: "ISO 8601 UTC end; required for CHAPEL (half-open [starts_at, ends_at)); ignored for GRAVESIDE" }
      - { name: status, type: enum, source: system, default: "SCHEDULED", description: "SCHEDULED -> CANCELLED", constraints: "SCHEDULED | CANCELLED" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: Permit
    parent: Case
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id" }
      - { name: permit_type, type: enum, source: input, description: "DEATH_CERTIFICATE | BURIAL_TRANSIT", constraints: "DEATH_CERTIFICATE | BURIAL_TRANSIT" }
      - { name: reference_number, type: string, source: input, default: null, description: "Issuing authority reference; set on issuance" }
      - { name: status, type: enum, source: system, default: "APPLIED", description: "APPLIED -> ISSUED | REJECTED; REJECTED can revert to APPLIED (re-apply loop)", constraints: "APPLIED | ISSUED | REJECTED" }
      - { name: version, type: integer, source: system, description: "OCC version" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---- Case (parallel dimensions: arrangement_status × interment_status) ----
  - entity: Case
    initial_state: INTAKE             # arrangement_status axis
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: INTAKE
        to: DISCLOSED
        trigger: "POST /cases/{caseId}/acknowledge-disclosure"
        actor: Arranger
        preconditions:
          - "Case.arrangement_status == INTAKE"
        side_effects:
          - "disclosure_acknowledged = true"
          - "disclosure_officer_id = X-User-ID (records the Arranger for later segregation-of-duties check)"
          - "increments Case.version by 1"
        note: "FTC funeral rule: GPL disclosure must be acknowledged before any charges are committed."

      - from: DISCLOSED
        to: ARRANGED
        trigger: "POST /cases/{caseId}/issue-gfs"
        actor: Arranger
        preconditions:
          - "Case.arrangement_status == DISCLOSED"
          - "disclosure_acknowledged == true"
          - "at least one SELECTED StatementLine exists (ERR_EMPTY_STATEMENT)"
          - "a Contract exists for the Case (ERR_CONTRACT_REQUIRED)"
        side_effects:
          - "recompute statement_total_final_cents over SELECTED lines (per-line rounded tax then summed)"
          - "gfs_issued = true (final total locked)"
          - "Contract.contract_amount_cents recomputed from statement_total_final_cents; Contract.trust_required_cents recomputed"
          - "increments Case.version by 1"

      - from: ARRANGED
        to: COMPLETED
        trigger: "POST /cases/{caseId}/complete"
        actor: Arranger
        preconditions:
          - "Case.arrangement_status == ARRANGED"
          - "Case.interment_status == INTERRED (ERR_INTERMENT_INCOMPLETE)"
          - "Contract.status == FUNDED (ERR_CONTRACT_NOT_FUNDED)"
        side_effects:
          - "Contract.status -> SETTLED"
          - "increments Case.version by 1"

      - from: INTAKE
        to: CANCELLED
        trigger: "POST /cases/{caseId}/cancel"
        actor: Arranger
        preconditions:
          - "Case.arrangement_status in {INTAKE, DISCLOSED, ARRANGED}"
        side_effects:
          - "CASCADE L1: if a Contract exists and is not VOID/SETTLED -> Contract.status = VOID (link 1)"
          - "interment_status reset to NOT_READY"
          - "increments Case.version by 1"
        note: "Cancellation is the head of cascade dual_void_release (depth 4). See Contract VOID transition for links 2-4."

      - from: DISCLOSED
        to: CANCELLED
        trigger: "POST /cases/{caseId}/cancel"
        actor: Arranger
        preconditions:
          - "Case.arrangement_status in {INTAKE, DISCLOSED, ARRANGED}"
        side_effects:
          - "CASCADE L1: if a Contract exists and is not VOID/SETTLED -> Contract.status = VOID (link 1)"
          - "interment_status reset to NOT_READY"
          - "increments Case.version by 1"

      - from: ARRANGED
        to: CANCELLED
        trigger: "POST /cases/{caseId}/cancel"
        actor: Arranger
        preconditions:
          - "Case.arrangement_status in {INTAKE, DISCLOSED, ARRANGED}"
        side_effects:
          - "CASCADE L1: if a Contract exists and is not VOID/SETTLED -> Contract.status = VOID (link 1)"
          - "interment_status reset to NOT_READY"
          - "increments Case.version by 1"

  # ---- Case interment axis (independent; advanced by interment/permit actions) ----
  - entity: Case
    initial_state: NOT_READY           # interment_status axis
    terminal_states: [INTERRED]
    transitions:
      - from: NOT_READY
        to: READY
        trigger: "system: automatic when a DEATH_CERTIFICATE Permit AND a BURIAL_TRANSIT Permit for the Case are both ISSUED"
        actor: system
        preconditions:
          - "exactly one ISSUED DEATH_CERTIFICATE Permit and one ISSUED BURIAL_TRANSIT Permit exist for the Case"
        side_effects:
          - "interment_status -> READY"
          - "increments Case.version by 1"
        note: "Bubble-up from Permit issuance (cross-entity). See Permit APPLIED->ISSUED side_effects."

      - from: READY
        to: INTERRED
        trigger: "POST /plots/{plotId}/inter"
        actor: CemeteryClerk
        preconditions:
          - "Plot.status == RESERVED (ERR_PLOT_NOT_RESERVED) and Plot.reserved_case_id == this Case (the plot's own reserved case)"
          - "Case.interment_status == READY (ERR_INTERMENT_NOT_READY)"
        side_effects:
          - "CASCADE interment_close link-1: Plot.status -> INTERRED"
          - "CASCADE interment_close link-2: Case.interment_status -> INTERRED (caused by Plot becoming INTERRED)"
          - "increments Plot.version by 1; increments Case.version by 1"
        note: "Head of cascade interment_close (depth 2): Plot INTERRED -> Case interment_status INTERRED. The interred Case is the plot's reserved_case_id."

  # ---- Contract (cyclic: PENDING_FUNDING <-> DRAFT amendment loop) ----
  - entity: Contract
    initial_state: DRAFT
    terminal_states: [SETTLED, VOID]
    transitions:
      - from: DRAFT
        to: PENDING_FUNDING
        trigger: "POST /contracts/{contractId}/submit-for-funding"
        actor: Arranger
        preconditions:
          - "Contract.status == DRAFT"
          - "Case.gfs_issued == true (ERR_GFS_NOT_ISSUED)"
        side_effects:
          - "recompute trust_required_cents and funded_amount_cents"
          - "increments Contract.version by 1"

      - from: PENDING_FUNDING
        to: DRAFT
        trigger: "POST /contracts/{contractId}/reopen"
        actor: Arranger
        preconditions:
          - "Contract.status == PENDING_FUNDING"
          - "Contract.funding_type == PRENEED_TRUST (only preneed contracts may be reopened for amendment) (ERR_NOT_AMENDABLE)"
        side_effects:
          - "increments Contract.version by 1"
        note: "Cyclic revision loop: a preneed contract can bounce back to DRAFT to amend the statement, then resubmit."

      - from: PENDING_FUNDING
        to: FUNDED
        trigger: "POST /contracts/{contractId}/mark-funded"
        actor: TrustOfficer
        preconditions:
          - "Contract.status == PENDING_FUNDING"
          - "Case.disclosure_officer_id != X-User-ID (segregation of duties: the disclosure-acknowledging Arranger cannot also fund) (ERR_SEGREGATION_OF_DUTIES)"
          - "funded_amount_cents >= contract_amount_cents (boundary >=) (ERR_FUNDING_SHORTFALL)"
          - "for PRENEED_TRUST: trust_principal_cents >= trust_required_cents (ERR_TRUST_UNDERFUNDED)"
        side_effects:
          - "increments Contract.version by 1"

      - from: FUNDED
        to: SETTLED
        trigger: "system: automatic on Case complete (POST /cases/{caseId}/complete)"
        actor: system
        preconditions:
          - "Contract.status == FUNDED"
        side_effects:
          - "increments Contract.version by 1"

      - from: DRAFT
        to: VOID
        trigger: "system: cascade from Case cancel (CASCADE L1)"
        actor: system
        preconditions: []
        side_effects:
          - "CASCADE L2: for each POSTED PRINCIPAL/EARNINGS TrustDeposit -> create a REFUND TrustDeposit of equal amount and mark the original REFUNDED (trust_principal_cents returns to 0)"
          - "CASCADE L2: for each VERIFIED InsuranceAssignment -> status RELEASED"
          - "CASCADE L3: if a Plot has reserved_case_id == this Case and status==RESERVED -> Plot.status = AVAILABLE, reserved_case_id=null, locked_price_cents=null (caused by contract voiding)"
          - "CASCADE L4: for each SCHEDULED Event of this Case -> status = CANCELLED (caused by plot release / contract void)"
          - "increments Contract.version by 1; bumps versions of affected TrustDeposit/Plot/Event rows"
        note: "Links 2-4 of cascade dual_void_release. Conserved: trust_balance_cents and plot availability both restored."

      - from: PENDING_FUNDING
        to: VOID
        trigger: "system: cascade from Case cancel (CASCADE L1)"
        actor: system
        preconditions: []
        side_effects:
          - "CASCADE L2: for each POSTED PRINCIPAL/EARNINGS TrustDeposit -> create a REFUND TrustDeposit of equal amount and mark the original REFUNDED"
          - "CASCADE L2: for each VERIFIED InsuranceAssignment -> status RELEASED"
          - "CASCADE L3: if a Plot has reserved_case_id == this Case and status==RESERVED -> Plot.status = AVAILABLE, reserved_case_id=null, locked_price_cents=null"
          - "CASCADE L4: for each SCHEDULED Event of this Case -> status = CANCELLED"
          - "increments Contract.version by 1; bumps versions of affected rows"

      - from: FUNDED
        to: VOID
        trigger: "system: cascade from Case cancel (CASCADE L1)"
        actor: system
        preconditions: []
        side_effects:
          - "CASCADE L2: refund all POSTED TrustDeposits; RELEASE all VERIFIED InsuranceAssignments"
          - "CASCADE L3: release reserved Plot (RESERVED -> AVAILABLE) if reserved_case_id == this Case"
          - "CASCADE L4: cancel all SCHEDULED Events of this Case"
          - "increments Contract.version by 1; bumps versions of affected rows"

  # ---- InsuranceAssignment ----
  - entity: InsuranceAssignment
    initial_state: PENDING
    terminal_states: [RELEASED, DECLINED]
    transitions:
      - from: PENDING
        to: VERIFIED
        trigger: "POST /insurance-assignments/{assignmentId}/verify"
        actor: TrustOfficer
        preconditions:
          - "InsuranceAssignment.status == PENDING"
          - "parent Contract.funding_type == INSURANCE_ASSIGNMENT (ERR_FUNDING_TYPE_MISMATCH)"
        side_effects:
          - "recompute Contract.funded_amount_cents (now includes assigned_value_cents)"
          - "increments InsuranceAssignment.version by 1; increments Contract.version by 1"

      - from: PENDING
        to: DECLINED
        trigger: "POST /insurance-assignments/{assignmentId}/decline"
        actor: TrustOfficer
        preconditions:
          - "InsuranceAssignment.status == PENDING"
        side_effects:
          - "increments InsuranceAssignment.version by 1"

      - from: VERIFIED
        to: RELEASED
        trigger: "system: cascade from Contract VOID (CASCADE L2)"
        actor: system
        preconditions: []
        side_effects:
          - "recompute Contract.funded_amount_cents (drops assigned_value_cents)"
          - "increments InsuranceAssignment.version by 1"

  # ---- Plot ----
  - entity: Plot
    initial_state: AVAILABLE
    terminal_states: [INTERRED]
    transitions:
      - from: AVAILABLE
        to: RESERVED
        trigger: "POST /plots/{plotId}/reserve"
        actor: CemeteryClerk
        preconditions:
          - "Plot.status == AVAILABLE (ERR_PLOT_NOT_AVAILABLE)"
          - "target Case exists and is not CANCELLED/COMPLETED"
        side_effects:
          - "reserved_case_id = case_id"
          - "locked_price_cents = current_price_cents (price-lock snapshot)"
          - "increments Plot.version by 1"

      - from: RESERVED
        to: AVAILABLE
        trigger: "POST /plots/{plotId}/release"
        actor: CemeteryClerk
        preconditions:
          - "Plot.status == RESERVED (ERR_PLOT_NOT_RESERVED)"
          - "Plot.reserved_case_id's Case.interment_status != INTERRED"
        side_effects:
          - "reserved_case_id = null; locked_price_cents = null"
          - "increments Plot.version by 1"

      - from: RESERVED
        to: INTERRED
        trigger: "POST /plots/{plotId}/inter"
        actor: CemeteryClerk
        preconditions:
          - "Plot.status == RESERVED (ERR_PLOT_NOT_RESERVED)"
          - "reserved_case_id's Case.interment_status == READY (ERR_INTERMENT_NOT_READY)"
        side_effects:
          - "CASCADE interment_close link-1: Plot.status -> INTERRED"
          - "CASCADE interment_close link-2: reserved Case.interment_status -> INTERRED (caused by this Plot becoming INTERRED)"
          - "increments Plot.version by 1; increments Case.version by 1"

      - from: RESERVED
        to: AVAILABLE
        trigger: "system: cascade from Contract VOID (CASCADE L3)"
        actor: system
        preconditions: []
        side_effects:
          - "reserved_case_id = null; locked_price_cents = null"
          - "increments Plot.version by 1"
        note: "Caused by the parent Case's Contract going VOID, not by a direct release call."

  # ---- Event (chapel/graveside booking) ----
  - entity: Event
    initial_state: SCHEDULED
    terminal_states: [CANCELLED]
    transitions:
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /cases/{caseId}/events/{eventId}/cancel"
        actor: Arranger
        preconditions:
          - "Event.status == SCHEDULED (ERR_INVALID_STATE)"
        side_effects:
          - "frees the resource interval so a later overlapping booking on the same Venue/Plot succeeds"
          - "increments Event.version by 1"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "system: cascade from Contract VOID (CASCADE L4)"
        actor: system
        preconditions: []
        side_effects:
          - "increments Event.version by 1"
        note: "Link 4 of the dual_void_release cascade: each SCHEDULED Event of the cancelled Case is cancelled."

  # ---- Permit (branching with revert: APPLIED -> {ISSUED, REJECTED}; REJECTED -> APPLIED) ----
  - entity: Permit
    initial_state: APPLIED
    terminal_states: [ISSUED]
    transitions:
      - from: APPLIED
        to: ISSUED
        trigger: "POST /permits/{permitId}/issue"
        actor: Registrar
        preconditions:
          - "Permit.status == APPLIED (ERR_PERMIT_NOT_APPLIED)"
          - "for BURIAL_TRANSIT: an ISSUED DEATH_CERTIFICATE Permit must already exist for the same Case (ERR_DEATH_CERT_REQUIRED)"
        side_effects:
          - "reference_number set"
          - "if this issuance makes both a DEATH_CERTIFICATE and a BURIAL_TRANSIT ISSUED for the Case AND Case.interment_status==NOT_READY -> Case.interment_status = READY (bubble-up cross-entity)"
          - "increments Permit.version by 1; may increment Case.version by 1"

      - from: APPLIED
        to: REJECTED
        trigger: "POST /permits/{permitId}/reject"
        actor: Registrar
        preconditions:
          - "Permit.status == APPLIED (ERR_PERMIT_NOT_APPLIED)"
        side_effects:
          - "increments Permit.version by 1"

      - from: REJECTED
        to: APPLIED
        trigger: "POST /permits/{permitId}/reapply"
        actor: Registrar
        preconditions:
          - "Permit.status == REJECTED (ERR_PERMIT_NOT_REJECTED)"
        side_effects:
          - "increments Permit.version by 1"
        note: "Branching-with-revert loop: a rejected permit can be re-applied and re-evaluated."

# =============================================================================
# §1.2.1 Concurrency Rules (OCC, true races only)
# =============================================================================
concurrency_rules:
  - rule_id: plot-reserve-stale-version
    parent_entity: Plot
    write_endpoint: "POST /plots/{plotId}/reserve"
    occ_field: "expected_plot_version"
    description: |
      Reserving a Plot whose version has advanced since the client last observed
      it is rejected. This captures the case where the plot was already reserved
      for another case (a legitimate supersede of the AVAILABLE view) and the
      current caller's view of the plot is therefore stale. Resolved as a
      stale-version check, not a timing window.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: contract-mark-funded-stale-version
    parent_entity: Contract
    write_endpoint: "POST /contracts/{contractId}/mark-funded"
    occ_field: "expected_contract_version"
    description: |
      Marking a Contract FUNDED while carrying a stale Contract.version is
      rejected. A TrustDeposit post or InsuranceAssignment verify silently bumps
      the contract's version (funded_amount recompute) between the client's read
      and this call; the stale view is rejected so funding decisions are made
      against the current funded_amount_cents.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: statement_total
    trigger: "any StatementLine add/select/remove; recomputed and locked at GFS issuance (Case DISCLOSED->ARRANGED)"
    algorithm: aggregation
    formula: |
      # PER-LINE ROUNDING THEN SUM (pinned order — do NOT sum-then-round).
      def line_total(line):
          subtotal = line.unit_price_cents * line.quantity
          tax = round_half_up(subtotal * sales_tax_pct) if line.taxable else 0
          return subtotal + tax
      provisional = sum(line_total(l) for l in lines if l.line_status in {PROPOSED, SELECTED})
      final       = sum(line_total(l) for l in lines if l.line_status == SELECTED)
    input_set: "provisional includes PROPOSED+SELECTED lines; final includes SELECTED-only; REMOVED lines excluded from both"
    constants:
      ROUNDING: round_half_up
    precision: "integer cents; tax rounded per line with round_half_up before summing"
    variants:
      - name: provisional
        when: "before GFS issuance; reflected in Case.statement_total_provisional_cents"
        difference: "includes both PROPOSED and SELECTED lines"
      - name: final
        when: "at and after GFS issuance; frozen into Case.statement_total_final_cents"
        difference: "includes SELECTED lines only — dropping PROPOSED lines changes the total"

  - name: contract_funded_amount
    trigger: "TrustDeposit post; InsuranceAssignment verify/release; Contract submit-for-funding/mark-funded"
    algorithm: chronological
    formula: |
      if funding_type == PRENEED_TRUST:
          # FORWARD-LOOKING projection variant. trust_principal_cents is the
          # PRINCIPAL corpus (excludes EARNINGS); credited_earnings and the
          # projection both lift funded_amount without lifting trust_principal.
          funded_amount_cents = trust_principal_cents + credited_earnings_cents + projected_earnings_cents
      elif funding_type == INSURANCE_ASSIGNMENT:
          funded_amount_cents = sum(a.assigned_value_cents for a in assignments if a.status == VERIFIED)
      else:  # AT_NEED_DIRECT
          # CHRONOLOGICAL replay of posted principal payments, ordered by
          # posted_at ASC, created_at ASC tie-break (never id).
          funded_amount_cents = sum(d.amount_cents for d in deposits
                                    if d.kind == PRINCIPAL and d.status == POSTED)
    input_set: "PRENEED: principal corpus + credited earnings + projection; INSURANCE: VERIFIED assignments; AT_NEED: POSTED PRINCIPAL deposits in posted_at order"
    precision: "integer cents"
    variants:
      - name: preneed_forward_projection
        when: "funding_type == PRENEED_TRUST"
        difference: "adds credited_earnings_cents and forward-looking projected_earnings_cents to the principal corpus — a projected maturity value"
      - name: at_need_chronological
        when: "funding_type == AT_NEED_DIRECT"
        difference: "pure chronological sum of realized POSTED principal payments; no earnings, no projection"

  - name: trust_required_principal
    trigger: "GFS issuance; Contract submit-for-funding; any SELECTED StatementLine change while preneed"
    algorithm: threshold
    formula: |
      # Combinatorial mode (a): >=3 inputs, conditional branch on funding_type,
      # nested max() floor at zero.
      if funding_type != PRENEED_TRUST:
          trust_required_cents = 0
      else:
          trustable_base = sum(line_total(l) for l in lines
                               if l.line_status == SELECTED and l.preneed_trustable)
          gross = round_half_up(trustable_base * state_trust_pct)
          trust_required_cents = max(0, gross - trust_admin_retention_cents)
    input_set: "SELECTED + preneed_trustable lines only; line_total reuses statement_total per-line rounding"
    constants:
      ROUNDING: round_half_up
    precision: "integer cents"

  - name: projected_trust_earnings
    trigger: "TrustDeposit post (PRINCIPAL); Contract submit-for-funding"
    algorithm: forward_looking
    formula: |
      # Forward projection over the PRINCIPAL corpus only (excludes already-
      # credited EARNINGS, which are tracked separately in credited_earnings_cents).
      projected_earnings_cents = floor(trust_principal_cents * PROJECTION_RATE)
    input_set: "trust_principal_cents (POSTED PRINCIPAL minus POSTED REFUND) for the contract"
    constants:
      PROJECTION_RATE: 0.03
    precision: "integer cents; floor on the projection term"

  - name: plot_charge
    trigger: "plot reservation (price-lock) and read-time pricing"
    algorithm: aggregation
    formula: |
      # Dual price source by case_mode of the reserving Case.
      if case_mode == PRENEED:
          plot_charge_cents = locked_price_cents   # snapshot at reservation
      else:  # AT_NEED
          plot_charge_cents = current_price_cents  # live price
    input_set: "single Plot; locked_price_cents snapshot vs live current_price_cents"
    precision: "integer cents"
    variants:
      - name: preneed_locked
        when: "reserving Case.case_mode == PRENEED"
        difference: "uses locked_price_cents captured at reservation, immune to later GPL price changes"
      - name: at_need_live
        when: "reserving Case.case_mode == AT_NEED"
        difference: "uses current_price_cents, so a later GPL price change moves the charge"

  - name: trust_balance_reconciliation
    trigger: "TrustDeposit post; Contract VOID cascade (REFUND deposits)"
    algorithm: aggregation
    formula: |
      # Conserved-quantity ledger. Per contract:
      trust_principal_cents  = sum(d.amount_cents for d in deposits if d.kind == PRINCIPAL and d.status == POSTED) \
                             - sum(d.amount_cents for d in deposits if d.kind == REFUND   and d.status == POSTED)
      credited_earnings_cents = sum(d.amount_cents for d in deposits if d.kind == EARNINGS and d.status == POSTED)
      trust_corpus = trust_principal_cents + credited_earnings_cents
      # Funeral-home rollup (the conserved global quantity):
      trust_balance_cents = sum(c.trust_principal_cents + c.credited_earnings_cents for c in this_home_contracts)
    input_set: "Per contract: POSTED PRINCIPAL minus POSTED REFUND for principal; POSTED EARNINGS for credited earnings. The home rollup sums both across the home's contracts."
    precision: "integer cents"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role is permitted for the operation per §1.7 RBAC"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Every path/body resource id resolves (FuneralHome, Case, Contract, GplItem, Plot, Venue, Event, Permit, TrustDeposit, InsuranceAssignment), validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_constraint
    check: "Request body well-formed: required fields present, enums valid, integers in range, AT_NEED requires date_of_death and PRENEED forbids it"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all writes"

  - priority: 5
    category: state
    check: "OCC: expected_<parent>_version (when supplied/required) matches current parent.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /plots/{plotId}/reserve, POST /contracts/{contractId}/mark-funded"

  - priority: 6
    category: state
    check: "Target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 7
    category: business_safety
    check: "FTC compliance gate: no StatementLine may be added and no GFS issued unless disclosure_acknowledged == true"
    error_id: ERR_DISCLOSURE_REQUIRED
    http_status: 409
    applies_to: "POST /cases/{caseId}/statement-lines, POST /cases/{caseId}/issue-gfs"

  - priority: 8
    category: business_safety
    check: "Segregation of duties: the Case.disclosure_officer_id must differ from the X-User-ID marking the contract FUNDED"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /contracts/{contractId}/mark-funded"

  - priority: 9
    category: business_referential
    check: "Cross-entity gating: BURIAL_TRANSIT issuance requires an ISSUED DEATH_CERTIFICATE; plot interment requires Case.interment_status==READY; case complete requires Contract.status==FUNDED and interment INTERRED"
    error_id: ERR_DEATH_CERT_REQUIRED
    http_status: 409
    applies_to: "POST /permits/{permitId}/issue, POST /plots/{plotId}/inter, POST /cases/{caseId}/complete"

  - priority: 10
    category: business_temporal
    check: "Resource scheduling overlap: CHAPEL bookings must not overlap (half-open [start,end) plus chapel_buffer_minutes) on the same Venue; GRAVESIDE bookings must not share the same calendar date on the same Plot"
    error_id: ERR_SCHEDULE_CONFLICT
    http_status: 409
    applies_to: "POST /cases/{caseId}/events"

  - priority: 11
    category: business_constraint
    check: "Empty-set guards: GFS issuance requires >=1 SELECTED StatementLine; interment requires a Plot RESERVED for the Case"
    error_id: ERR_EMPTY_STATEMENT
    http_status: 409
    applies_to: "POST /cases/{caseId}/issue-gfs"

  - priority: 12
    category: business_fiscal
    check: "Funding sufficiency: funded_amount_cents >= contract_amount_cents (and, for PRENEED, trust_principal_cents >= trust_required_cents) before mark-funded"
    error_id: ERR_FUNDING_SHORTFALL
    http_status: 409
    applies_to: "POST /contracts/{contractId}/mark-funded"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- FuneralHome ----
  - method: POST
    path: "/funeral-homes"
    description: "Create a funeral home (config tenant: tax/trust rates, chapel buffer)"
    roles: [Admin]
    code: 201
    input: [name, sales_tax_pct, state_trust_pct, "trust_admin_retention_cents?", "chapel_buffer_minutes?"]
    output: FuneralHome
    side_effects: ["trust_balance_cents = 0"]

  - method: GET
    path: "/funeral-homes/{homeId}"
    description: "Get a funeral home, including computed trust_balance_cents"
    roles: [Admin, Arranger, TrustOfficer, CemeteryClerk, Registrar]
    code: 200
    input: []
    output: FuneralHome
    side_effects: []

  # ---- GplItem (catalog) ----
  - method: POST
    path: "/gpl-items"
    description: "Create a GPL price-list item"
    roles: [Admin]
    code: 201
    input: [funeral_home_id, code, name, category, "taxable?", "non_declinable?", "preneed_trustable?", unit_price_cents]
    output: GplItem
    side_effects: ["active = true"]

  - method: GET
    path: "/gpl-items/{itemId}"
    description: "Get a GPL item"
    roles: [Admin, Arranger]
    code: 200
    input: []
    output: GplItem
    side_effects: []

  - method: GET
    path: "/gpl-items"
    description: "List GPL items, optionally filtered by funeral home"
    roles: [Admin, Arranger]
    code: 200
    input: ["funeral_home_id?", "limit?", "offset?"]
    output: "GplItem[]"
    side_effects: []

  - method: PATCH
    path: "/gpl-items/{itemId}"
    description: "Update a GPL item's price or active flag (does not retroactively change existing snapshotted StatementLines)"
    roles: [Admin]
    code: 200
    input: ["unit_price_cents?", "active?"]
    output: GplItem
    side_effects: ["new price affects only future StatementLine snapshots and AT_NEED plot_charge reads"]

  # ---- Case ----
  - method: POST
    path: "/cases"
    description: "Open a decedent case (intake)"
    roles: [Arranger]
    code: 201
    input: [funeral_home_id, decedent_name, case_mode, "date_of_death?"]
    output: Case
    side_effects: ["arrangement_status=INTAKE, interment_status=NOT_READY, disclosure_acknowledged=false, gfs_issued=false"]

  - method: GET
    path: "/cases/{caseId}"
    description: "Get a case with both status axes and computed statement totals"
    roles: [Admin, Arranger, TrustOfficer, CemeteryClerk, Registrar]
    code: 200
    input: []
    output: Case
    side_effects: []

  - method: GET
    path: "/cases"
    description: "List cases, optionally filtered by funeral home"
    roles: [Admin, Arranger, TrustOfficer, CemeteryClerk, Registrar]
    code: 200
    input: ["funeral_home_id?", "limit?", "offset?"]
    output: "Case[]"
    side_effects: []

  - method: POST
    path: "/cases/{caseId}/acknowledge-disclosure"
    description: "Acknowledge FTC funeral-rule GPL disclosure (arrangement INTAKE->DISCLOSED)"
    roles: [Arranger]
    code: 200
    input: []
    output: Case
    side_effects: ["disclosure_acknowledged=true", "disclosure_officer_id=X-User-ID", "arrangement_status=DISCLOSED"]

  - method: POST
    path: "/cases/{caseId}/issue-gfs"
    description: "Issue the itemized Goods & Services Statement and lock final total (DISCLOSED->ARRANGED)"
    roles: [Arranger]
    code: 200
    input: []
    output: Case
    side_effects:
      - "statement_total_final_cents recomputed over SELECTED lines (per-line rounded tax then summed)"
      - "gfs_issued=true, arrangement_status=ARRANGED"
      - "Contract.contract_amount_cents and trust_required_cents recomputed"

  - method: POST
    path: "/cases/{caseId}/complete"
    description: "Complete a case (ARRANGED->COMPLETED); settles the contract"
    roles: [Arranger]
    code: 200
    input: []
    output: Case
    side_effects: ["arrangement_status=COMPLETED", "Contract.status=SETTLED"]

  - method: POST
    path: "/cases/{caseId}/cancel"
    description: "Cancel a case; head of the dual_void_release cascade"
    roles: [Arranger]
    code: 200
    input: []
    output: Case
    side_effects:
      - "arrangement_status=CANCELLED, interment_status=NOT_READY"
      - "CASCADE: Contract VOID -> refund TrustDeposits + release InsuranceAssignments -> release reserved Plot -> cancel SCHEDULED Events"

  # ---- StatementLine (sub-resource of Case) ----
  - method: POST
    path: "/cases/{caseId}/statement-lines"
    description: "Add a GPL item as a statement line (snapshots price/flags)"
    roles: [Arranger]
    code: 201
    input: [gpl_item_id, "quantity?"]
    output: StatementLine
    side_effects:
      - "snapshot description/category/taxable/non_declinable/preneed_trustable/unit_price_cents from GplItem"
      - "line_status=SELECTED if non_declinable else PROPOSED"
      - "recompute Case.statement_total_provisional_cents"

  - method: GET
    path: "/cases/{caseId}/statement-lines"
    description: "List statement lines for a case (convenience sub-resource view)"
    roles: [Admin, Arranger]
    code: 200
    input: ["limit?", "offset?"]
    output: "StatementLine[]"
    side_effects: []

  - method: GET
    path: "/statement-lines/{lineId}"
    description: "Get a single statement line (establishes the statement-lines collection segment)"
    roles: [Admin, Arranger]
    code: 200
    input: []
    output: StatementLine
    side_effects: []

  - method: GET
    path: "/statement-lines"
    description: "List statement lines, optionally by case or GPL item (reverse-reachability for StatementLine.case_id and StatementLine.gpl_item_id)"
    roles: [Admin, Arranger]
    code: 200
    input: ["case_id?", "gpl_item_id?", "limit?", "offset?"]
    output: "StatementLine[]"
    side_effects: []

  - method: POST
    path: "/cases/{caseId}/statement-lines/{lineId}/select"
    description: "Promote a PROPOSED line to SELECTED"
    roles: [Arranger]
    code: 200
    input: []
    output: StatementLine
    side_effects: ["line_status=SELECTED", "recompute Case.statement_total_provisional_cents"]

  - method: POST
    path: "/cases/{caseId}/statement-lines/{lineId}/remove"
    description: "Remove a non-mandatory line (line_status=REMOVED)"
    roles: [Arranger]
    code: 200
    input: []
    output: StatementLine
    side_effects: ["line_status=REMOVED (rejected for non_declinable lines)", "recompute Case.statement_total_provisional_cents"]

  # ---- Contract (sub-resource create, flat actions) ----
  - method: POST
    path: "/cases/{caseId}/contract"
    description: "Create the single Contract for a case"
    roles: [Arranger]
    code: 201
    input: [funding_type]
    output: Contract
    side_effects: ["status=DRAFT", "recompute contract_amount/trust_required/funded_amount"]

  - method: GET
    path: "/contracts/{contractId}"
    description: "Get a contract with computed funding fields"
    roles: [Admin, Arranger, TrustOfficer]
    code: 200
    input: []
    output: Contract
    side_effects: []

  - method: GET
    path: "/contracts"
    description: "List contracts, optionally filtered by case (reverse-reachability for Contract.case_id)"
    roles: [Admin, Arranger, TrustOfficer]
    code: 200
    input: ["case_id?", "limit?", "offset?"]
    output: "Contract[]"
    side_effects: []

  - method: POST
    path: "/contracts/{contractId}/submit-for-funding"
    description: "Move contract DRAFT->PENDING_FUNDING"
    roles: [Arranger]
    code: 200
    input: []
    output: Contract
    side_effects: ["status=PENDING_FUNDING", "recompute trust_required/funded_amount"]

  - method: POST
    path: "/contracts/{contractId}/reopen"
    description: "Reopen a preneed contract PENDING_FUNDING->DRAFT for amendment (cyclic)"
    roles: [Arranger]
    code: 200
    input: []
    output: Contract
    side_effects: ["status=DRAFT"]

  - method: POST
    path: "/contracts/{contractId}/mark-funded"
    description: "Mark contract FUNDED (TrustOfficer; OCC + segregation + funding checks)"
    roles: [TrustOfficer]
    code: 200
    input: [expected_contract_version]
    output: Contract
    side_effects: ["status=FUNDED", "increments Contract.version by 1"]

  # ---- TrustDeposit (sub-resource of Contract) ----
  - method: POST
    path: "/contracts/{contractId}/trust-deposits"
    description: "Post a trust deposit (PRINCIPAL/EARNINGS/REFUND)"
    roles: [TrustOfficer]
    code: 201
    input: [kind, amount_cents]
    output: TrustDeposit
    side_effects:
      - "status=POSTED, posted_at stamped"
      - "recompute Contract.trust_principal_cents, projected_earnings_cents, funded_amount_cents; recompute FuneralHome.trust_balance_cents"
      - "increments Contract.version by 1"

  - method: GET
    path: "/contracts/{contractId}/trust-deposits"
    description: "List trust deposits for a contract (convenience sub-resource view)"
    roles: [Admin, TrustOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: "TrustDeposit[]"
    side_effects: []

  - method: GET
    path: "/trust-deposits/{depositId}"
    description: "Get a single trust deposit (establishes the trust-deposits collection segment)"
    roles: [Admin, TrustOfficer]
    code: 200
    input: []
    output: TrustDeposit
    side_effects: []

  - method: GET
    path: "/trust-deposits"
    description: "List trust deposits, optionally by contract (reverse-reachability for TrustDeposit.contract_id)"
    roles: [Admin, TrustOfficer]
    code: 200
    input: ["contract_id?", "limit?", "offset?"]
    output: "TrustDeposit[]"
    side_effects: []

  # ---- InsuranceAssignment ----
  - method: POST
    path: "/contracts/{contractId}/insurance-assignments"
    description: "Attach an insurance assignment to a contract"
    roles: [TrustOfficer]
    code: 201
    input: [policy_number, carrier, assigned_value_cents]
    output: InsuranceAssignment
    side_effects: ["status=PENDING"]

  - method: GET
    path: "/insurance-assignments/{assignmentId}"
    description: "Get an insurance assignment"
    roles: [Admin, TrustOfficer]
    code: 200
    input: []
    output: InsuranceAssignment
    side_effects: []

  - method: GET
    path: "/insurance-assignments"
    description: "List insurance assignments, optionally by contract (reverse-reachability for InsuranceAssignment.contract_id)"
    roles: [Admin, TrustOfficer]
    code: 200
    input: ["contract_id?", "limit?", "offset?"]
    output: "InsuranceAssignment[]"
    side_effects: []

  - method: POST
    path: "/insurance-assignments/{assignmentId}/verify"
    description: "Verify an assignment (PENDING->VERIFIED); counts toward funded_amount"
    roles: [TrustOfficer]
    code: 200
    input: []
    output: InsuranceAssignment
    side_effects: ["status=VERIFIED", "recompute Contract.funded_amount_cents", "increments Contract.version by 1"]

  - method: POST
    path: "/insurance-assignments/{assignmentId}/decline"
    description: "Decline an assignment (PENDING->DECLINED)"
    roles: [TrustOfficer]
    code: 200
    input: []
    output: InsuranceAssignment
    side_effects: ["status=DECLINED"]

  # ---- Plot (cemetery inventory + graveside resource) ----
  - method: POST
    path: "/plots"
    description: "Create a cemetery plot"
    roles: [Admin, CemeteryClerk]
    code: 201
    input: [funeral_home_id, section, plot_code, current_price_cents]
    output: Plot
    side_effects: ["status=AVAILABLE"]

  - method: GET
    path: "/plots/{plotId}"
    description: "Get a plot"
    roles: [Admin, Arranger, CemeteryClerk]
    code: 200
    input: []
    output: Plot
    side_effects: []

  - method: GET
    path: "/plots"
    description: "List plots, optionally by funeral home or reserving case (reverse-reachability for Plot.funeral_home_id and Plot.reserved_case_id)"
    roles: [Admin, Arranger, CemeteryClerk]
    code: 200
    input: ["funeral_home_id?", "reserved_case_id?", "limit?", "offset?"]
    output: "Plot[]"
    side_effects: []

  - method: POST
    path: "/plots/{plotId}/reserve"
    description: "Reserve an AVAILABLE plot for a case (price-lock); OCC-guarded"
    roles: [CemeteryClerk]
    code: 200
    input: [case_id, expected_plot_version]
    output: Plot
    side_effects: ["status=RESERVED", "reserved_case_id=case_id", "locked_price_cents=current_price_cents", "increments Plot.version by 1"]

  - method: POST
    path: "/plots/{plotId}/release"
    description: "Release a RESERVED plot back to AVAILABLE"
    roles: [CemeteryClerk]
    code: 200
    input: []
    output: Plot
    side_effects: ["status=AVAILABLE", "reserved_case_id=null", "locked_price_cents=null"]

  - method: POST
    path: "/plots/{plotId}/inter"
    description: "Perform interment (RESERVED->INTERRED); bubbles Case.interment_status to INTERRED"
    roles: [CemeteryClerk]
    code: 200
    input: []
    output: Plot
    side_effects: ["Plot.status=INTERRED", "reserved Case.interment_status=INTERRED", "increments Case.version by 1"]

  # ---- Venue (chapel resource) ----
  - method: POST
    path: "/venues"
    description: "Create a chapel/venue"
    roles: [Admin]
    code: 201
    input: [funeral_home_id, name, capacity]
    output: Venue
    side_effects: []

  - method: GET
    path: "/venues/{venueId}"
    description: "Get a venue"
    roles: [Admin, Arranger, CemeteryClerk]
    code: 200
    input: []
    output: Venue
    side_effects: []

  - method: GET
    path: "/venues"
    description: "List venues, optionally by funeral home (reverse-reachability for Venue.funeral_home_id)"
    roles: [Admin, Arranger, CemeteryClerk]
    code: 200
    input: ["funeral_home_id?", "limit?", "offset?"]
    output: "Venue[]"
    side_effects: []

  # ---- Event (chapel/graveside scheduling, sub-resource of Case) ----
  - method: POST
    path: "/cases/{caseId}/events"
    description: "Schedule a chapel or graveside event; enforces resource overlap rules"
    roles: [Arranger]
    code: 201
    input: [resource_kind, resource_id, starts_at, "ends_at?"]
    output: Event
    side_effects: ["status=SCHEDULED", "overlap-checked against existing SCHEDULED Events on the same resource"]

  - method: GET
    path: "/cases/{caseId}/events"
    description: "List events for a case (convenience sub-resource view)"
    roles: [Admin, Arranger, CemeteryClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: "Event[]"
    side_effects: []

  - method: GET
    path: "/events/{eventId}"
    description: "Get a single event (establishes the events collection segment)"
    roles: [Admin, Arranger, CemeteryClerk]
    code: 200
    input: []
    output: Event
    side_effects: []

  - method: GET
    path: "/events"
    description: "List events, optionally by case or resource (reverse-reachability for Event.case_id and Event.resource_id)"
    roles: [Admin, Arranger, CemeteryClerk]
    code: 200
    input: ["case_id?", "resource_id?", "limit?", "offset?"]
    output: "Event[]"
    side_effects: []

  - method: POST
    path: "/cases/{caseId}/events/{eventId}/cancel"
    description: "Cancel a scheduled event (frees the resource interval)"
    roles: [Arranger]
    code: 200
    input: []
    output: Event
    side_effects: ["status=CANCELLED"]

  # ---- Permit (death certificate / burial-transit, sub-resource of Case) ----
  - method: POST
    path: "/cases/{caseId}/permits"
    description: "Apply for a permit (death certificate or burial-transit)"
    roles: [Arranger, Registrar]
    code: 201
    input: [permit_type]
    output: Permit
    side_effects: ["status=APPLIED"]

  - method: GET
    path: "/cases/{caseId}/permits"
    description: "List permits for a case (convenience sub-resource view)"
    roles: [Admin, Arranger, Registrar]
    code: 200
    input: ["limit?", "offset?"]
    output: "Permit[]"
    side_effects: []

  - method: GET
    path: "/permits/{permitId}"
    description: "Get a permit (establishes the permits collection segment)"
    roles: [Admin, Arranger, Registrar]
    code: 200
    input: []
    output: Permit
    side_effects: []

  - method: GET
    path: "/permits"
    description: "List permits, optionally by case (reverse-reachability for Permit.case_id)"
    roles: [Admin, Arranger, Registrar]
    code: 200
    input: ["case_id?", "limit?", "offset?"]
    output: "Permit[]"
    side_effects: []

  - method: POST
    path: "/permits/{permitId}/issue"
    description: "Issue a permit (APPLIED->ISSUED); BURIAL_TRANSIT requires issued death certificate; may make Case READY"
    roles: [Registrar]
    code: 200
    input: [reference_number]
    output: Permit
    side_effects: ["status=ISSUED, reference_number set", "may bubble Case.interment_status NOT_READY->READY"]

  - method: POST
    path: "/permits/{permitId}/reject"
    description: "Reject a permit (APPLIED->REJECTED)"
    roles: [Registrar]
    code: 200
    input: []
    output: Permit
    side_effects: ["status=REJECTED"]

  - method: POST
    path: "/permits/{permitId}/reapply"
    description: "Re-apply a rejected permit (REJECTED->APPLIED)"
    roles: [Registrar]
    code: 200
    input: []
    output: Permit
    side_effects: ["status=APPLIED"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown X-User-Role or missing X-User-ID" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Acting role not permitted for this operation" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Malformed body: missing required field, bad enum, out-of-range integer, AT_NEED missing date_of_death or PRENEED supplying it" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match current parent.version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a state from which the requested transition is defined" }
  - { id: ERR_DISCLOSURE_REQUIRED, http: 409, condition: "FTC: statement line add or GFS issuance attempted before disclosure_acknowledged" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 409, condition: "Same X-User-ID acknowledged disclosure and is attempting to mark the contract FUNDED" }
  - { id: ERR_DEATH_CERT_REQUIRED, http: 409, condition: "BURIAL_TRANSIT issuance without an ISSUED DEATH_CERTIFICATE for the same case" }
  - { id: ERR_INTERMENT_NOT_READY, http: 409, condition: "Interment attempted while Case.interment_status != READY" }
  - { id: ERR_INTERMENT_INCOMPLETE, http: 409, condition: "Case complete attempted while interment_status != INTERRED" }
  - { id: ERR_CONTRACT_NOT_FUNDED, http: 409, condition: "Case complete attempted while Contract.status != FUNDED" }
  - { id: ERR_CONTRACT_REQUIRED, http: 409, condition: "GFS issuance attempted before a Contract exists for the case" }
  - { id: ERR_GFS_NOT_ISSUED, http: 409, condition: "Contract submit-for-funding attempted before GFS issued" }
  - { id: ERR_EMPTY_STATEMENT, http: 409, condition: "GFS issuance with zero SELECTED statement lines" }
  - { id: ERR_FUNDING_SHORTFALL, http: 409, condition: "funded_amount_cents < contract_amount_cents at mark-funded" }
  - { id: ERR_TRUST_UNDERFUNDED, http: 409, condition: "PRENEED trust_principal_cents < trust_required_cents at mark-funded" }
  - { id: ERR_SCHEDULE_CONFLICT, http: 409, condition: "Event interval collides with an existing SCHEDULED event on the same resource (chapel buffered half-open / graveside whole-day)" }
  - { id: ERR_PLOT_NOT_AVAILABLE, http: 409, condition: "Reserve attempted on a plot not in AVAILABLE" }
  - { id: ERR_PLOT_NOT_RESERVED, http: 409, condition: "Release/inter attempted on a plot not in RESERVED" }
  - { id: ERR_NON_DECLINABLE_LINE, http: 409, condition: "Remove attempted on a non_declinable statement line" }
  - { id: ERR_NOT_AMENDABLE, http: 409, condition: "Reopen attempted on a non-PRENEED_TRUST contract" }
  - { id: ERR_FUNDING_TYPE_MISMATCH, http: 409, condition: "Insurance assignment verify on a contract whose funding_type != INSURANCE_ASSIGNMENT" }
  - { id: ERR_PERMIT_NOT_APPLIED, http: 409, condition: "Issue/reject attempted on a permit not in APPLIED" }
  - { id: ERR_PERMIT_NOT_REJECTED, http: 409, condition: "Reapply attempted on a permit not in REJECTED" }
  - { id: ERR_CONTRACT_EXISTS, http: 409, condition: "Second contract creation attempted for a case that already has one" }
  - { id: ERR_VALIDATION_OUT_OF_RANGE, http: 422, condition: "Pagination limit/offset outside allowed bounds" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Admin
    description: "Establishment administrator: configures funeral home, GPL catalog, venues, and plots; read access across the system."
    identity: opaque
    exclusive_operations:
      - "POST /funeral-homes — create funeral home"
      - "POST /gpl-items — create GPL item"
      - "PATCH /gpl-items/{itemId} — update GPL item price/active"
      - "POST /venues — create venue"
    shared_operations:
      - "POST /plots — create plot (shared with CemeteryClerk)"
      - "GET (all read endpoints)"

  - name: Arranger
    description: "Funeral arranger: handles case intake, FTC disclosure, GPL statement, contract creation, scheduling, and case lifecycle. Acts as the disclosure officer (segregation-of-duties anchor)."
    identity: opaque
    exclusive_operations:
      - "POST /cases — open case"
      - "POST /cases/{caseId}/acknowledge-disclosure — FTC disclosure"
      - "POST /cases/{caseId}/issue-gfs — issue GFS"
      - "POST /cases/{caseId}/complete — complete case"
      - "POST /cases/{caseId}/cancel — cancel case (cascade head)"
      - "POST /cases/{caseId}/statement-lines — add line"
      - "POST /cases/{caseId}/statement-lines/{lineId}/select — select line"
      - "POST /cases/{caseId}/statement-lines/{lineId}/remove — remove line"
      - "POST /cases/{caseId}/contract — create contract"
      - "POST /contracts/{contractId}/submit-for-funding — submit"
      - "POST /contracts/{contractId}/reopen — reopen preneed contract"
      - "POST /cases/{caseId}/events — schedule event"
      - "POST /cases/{caseId}/events/{eventId}/cancel — cancel event"
    shared_operations:
      - "POST /cases/{caseId}/permits — apply for permit (shared with Registrar)"
      - "GET (case/contract/plot/venue/permit/gpl reads)"

  - name: TrustOfficer
    description: "Trust/funding officer: manages trust deposits, insurance assignments, and marks contracts funded. Cannot be the same person who acknowledged the disclosure (segregation of duties)."
    identity: opaque
    exclusive_operations:
      - "POST /contracts/{contractId}/mark-funded — mark funded"
      - "POST /contracts/{contractId}/trust-deposits — post trust deposit"
      - "POST /contracts/{contractId}/insurance-assignments — attach assignment"
      - "POST /insurance-assignments/{assignmentId}/verify — verify assignment"
      - "POST /insurance-assignments/{assignmentId}/decline — decline assignment"
    shared_operations:
      - "GET (contract/trust-deposit/insurance/case/funeral-home reads)"

  - name: CemeteryClerk
    description: "Cemetery clerk: manages plot inventory, reservation/release/interment."
    identity: opaque
    exclusive_operations:
      - "POST /plots/{plotId}/reserve — reserve plot"
      - "POST /plots/{plotId}/release — release plot"
      - "POST /plots/{plotId}/inter — inter (interment)"
    shared_operations:
      - "POST /plots — create plot (shared with Admin)"
      - "GET (plot/venue/event/case reads)"

  - name: Registrar
    description: "Vital-records registrar: issues, rejects, and re-evaluates death certificates and burial-transit permits."
    identity: opaque
    exclusive_operations:
      - "POST /permits/{permitId}/issue — issue permit"
      - "POST /permits/{permitId}/reject — reject permit"
      - "POST /permits/{permitId}/reapply — re-apply permit"
    shared_operations:
      - "POST /cases/{caseId}/permits — apply for permit (shared with Arranger)"
      - "GET (permit/case reads)"
