# ============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# Task 2749 — Minor League Affiliation & Player Development Pipeline
# 9 rule_ids x 2 instances = 18 instances
# Every numeric literal in every `assert:` line was computed by executing the
# matching §1.3 formula with exact Decimal arithmetic and ROUND_HALF_UP.
# ============================================================================

scaffold_difficulty_design:

  # ==========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: workload_index_actual_vs_projected_diverge_for_same_logs
        grounds:
          - calculations.player_workload_index
          - entities.Player.fields.workload_index
          - entities.Player.fields.workload_index_projected
          - entities.WorkloadLog.fields.is_rehab_outing
          - entities.DevelopmentPlan.fields.workload_limit_weekly_index
        distinguishing_aspect: |
          This instance's two variants diverge on INPUT-SET MEMBERSHIP plus a
          forward-looking allowance over the identical three WorkloadLog rows:
          actual_rolling drops the rehab outing entirely and adds nothing,
          while projected_promotion admits it at weight 0.50 and adds the ACTIVE
          plan's 1.50 weekly allowance, yielding 1.27 versus 2.94 on one player.
        test_recipe:
          setup:
            - "Logical clock left at its startup default 2026-08-01T00:00:00Z, so the 14-day rolling window is [2026-07-19, 2026-08-01]."
            - "A DOUBLE_A affiliate (LEVEL_WORKLOAD_MULTIPLIER 1.12) with an ACTIVE agreement whose minimum_active_players is 0, so posture is OPEN."
            - "A cleared player on an ACTIVE LEVEL assignment covering 2026-07-20..2026-09-30 with workload_ceiling_index 12.00."
            - "An ACTIVE DevelopmentPlan on that assignment with four curriculum modules and workload_limit_weekly_index 1.50."
            - "Two non-rehab outings already logged inside the window (contributions 0.74480 and 0.52640)."
          setup_api_calls:
            - call: "POST /affiliates"
              payload: { name: "Rockford Rivets", level: "DOUBLE_A", market_city: "Rockford", meal_stipend_cents_per_day: 3000 }
              as: FarmDirector
              as_user_id: "u-farm-1"
              captures: { aff_id: $.data.id }
            - call: "POST /affiliates/${aff_id}/agreements"
              payload: { term_start_date: "2026-01-01", term_end_date: "2026-12-31", facility_standard_tier: "TIER_1", club_reimbursement_cap_cents: 5000000, minimum_active_players: 0 }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
              captures: { agr_id: $.data.id }
            - call: "POST /agreements/${agr_id}/disposition"
              payload: { action: "SUBMIT" }
              as: AffiliateOperator
              as_user_id: "${aff_id}"
            - call: "POST /agreements/${agr_id}/disposition"
              payload: { action: "ACTIVATE" }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
            - call: "POST /players"
              payload: { full_name: "Diego Marte", origin: "DOMESTIC_DRAFT", signed_date: "2024-06-10", service_days_accrued: 200 }
              as: FarmDirector
              as_user_id: "u-farm-1"
              captures: { player_id: $.data.id }
            - call: "POST /players/${player_id}/medical-clearances"
              payload: { clearance_type: "LEVEL_ASSIGNMENT" }
              as: FarmDirector
              as_user_id: "u-farm-1"
              captures: { clr_id: $.data.id }
            - call: "POST /medical-clearances/${clr_id}/disposition"
              payload: { action: "ISSUE", cleared_workload_ceiling_index: 25.00, expires_on: "2026-12-31" }
              as: MedicalDirector
              as_user_id: "u-med-1"
            - call: "GET /players/${player_id}"
              payload: {}
              as: FarmDirector
              as_user_id: "u-farm-1"
              captures: { player_v: $.data.version }
            - call: "POST /assignments"
              payload: { player_id: "${player_id}", affiliate_id: "${aff_id}", assignment_type: "LEVEL", movement_reason: "INITIAL", effective_date: "2026-07-20", end_date: "2026-09-30", expected_player_version: "${player_v}", workload_ceiling_index: 12.00 }
              as: FarmDirector
              as_user_id: "u-farm-1"
              captures: { asg_id: $.data.id }
            - call: "POST /assignments/${asg_id}/disposition"
              payload: { action: "ACTIVATE" }
              as: FarmDirector
              as_user_id: "u-farm-1"
            - call: "POST /assignments/${asg_id}/development-plans"
              payload: { target_level: "TRIPLE_A", curriculum_version: "2026.1", curriculum_modules: ["MOD_MECHANICS", "MOD_SEQUENCING", "MOD_RECOVERY", "MOD_GAMEPLAN"], workload_limit_weekly_index: 1.50 }
              as: FarmDirector
              as_user_id: "u-farm-1"
              captures: { plan_id: $.data.id }
            - call: "POST /development-plans/${plan_id}/disposition"
              payload: { action: "ACTIVATE" }
              as: FarmDirector
              as_user_id: "u-farm-1"
            - call: "POST /assignments/${asg_id}/workload-logs"
              payload: { log_date: "2026-07-28", pitches_thrown: 100, innings_pitched: 3.0, high_intensity_minutes: 10, is_rehab_outing: false }
              as: FarmDirector
              as_user_id: "u-farm-1"
            - call: "POST /assignments/${asg_id}/workload-logs"
              payload: { log_date: "2026-07-30", pitches_thrown: 80, innings_pitched: 1.0, high_intensity_minutes: 0, is_rehab_outing: false }
              as: FarmDirector
              as_user_id: "u-farm-1"
              captures: { wi_before: $.data.id }
          trigger:
            - call: "POST /assignments/${asg_id}/workload-logs"
              payload: { log_date: "2026-08-01", pitches_thrown: 40, innings_pitched: 2.0, high_intensity_minutes: 12, is_rehab_outing: true }
              as: MedicalDirector
              as_user_id: "u-med-1"
            - call: "GET /players/${player_id}"
              payload: {}
              as: FarmDirector
              as_user_id: "u-farm-1"
              captures: { wi: $.data.workload_index, wip: $.data.workload_index_projected }
          assert:
            - "Player.${player_id}.workload_index == 1.27"
            - "Player.${player_id}.workload_index_projected == 2.94"
            - "Player.${player_id}.workload_index_projected - Player.${player_id}.workload_index == 1.67 over the identical three-log set"
            - "Player.${player_id}.workload_index was 1.27 before the rehab log and is still 1.27 after it (actual_rolling excludes is_rehab_outing == true entirely)"
            - "Player.${player_id}.workload_index_projected was 2.77 before the rehab log and is 2.94 after it (the rehab outing enters at weight 0.50)"
            - "GET /assignments/${asg_id}/workload-logs returns 3 rows and has_more == false"

      - name: expense_allocation_provisional_vs_final_cap_application
        grounds:
          - calculations.expense_allocation_settlement
          - entities.AffiliationAgreement.fields.provisional_club_obligation_cents
          - entities.AffiliationAgreement.fields.final_club_obligation_cents
          - entities.AffiliationAgreement.fields.affiliate_overflow_cents
          - state_machines.AffiliationAgreement.DRAFT_to_SUBMITTED
          - state_machines.AffiliationAgreement.ACTIVE_to_ACTIVE
        distinguishing_aspect: |
          This instance's two variants diverge on CAP TOPOLOGY rather than on
          input-set membership: provisional_at_submit drains one aggregate cap
          in CATEGORY_ORDER (obligation 1759000, overflow 0), whereas
          final_at_settlement splits the same 1800000 cap into pro-rata
          per-category sub-caps with no borrowing (obligation 1378231, overflow
          380769) for byte-identical expense inputs.
        test_recipe:
          setup:
            - "A HIGH_A affiliate with a DRAFT agreement declaring club_reimbursement_cap_cents 1800000 and gross expenses housing 1200000, meals 640000, travel 355000, upkeep 480000."
            - "No audited_* figures are supplied at settlement, so the final variant falls back to the same declared gross figures — the only thing that changes is which cap topology applies."
          setup_api_calls:
            - call: "POST /affiliates"
              payload: { name: "Beloit Sky Carp", level: "HIGH_A", market_city: "Beloit", meal_stipend_cents_per_day: 2800 }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
              captures: { aff2_id: $.data.id }
            - call: "POST /affiliates/${aff2_id}/agreements"
              payload: { term_start_date: "2026-01-01", term_end_date: "2026-12-31", facility_standard_tier: "TIER_2", club_reimbursement_cap_cents: 1800000, minimum_active_players: 0, housing_expense_cents: 1200000, meal_expense_cents: 640000, travel_expense_cents: 355000, upkeep_expense_cents: 480000 }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
              captures: { agr2_id: $.data.id }
            - call: "POST /agreements/${agr2_id}/disposition"
              payload: { action: "SUBMIT" }
              as: AffiliateOperator
              as_user_id: "${aff2_id}"
              captures: { prov: $.data.provisional_club_obligation_cents, ovf_prov: $.data.affiliate_overflow_cents }
            - call: "POST /agreements/${agr2_id}/disposition"
              payload: { action: "ACTIVATE" }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
          trigger:
            - call: "POST /agreements/${agr2_id}/disposition"
              payload: { action: "SETTLE" }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
              captures: { fin: $.data.final_club_obligation_cents, ovf_fin: $.data.affiliate_overflow_cents, sstatus: $.data.settlement_status }
          assert:
            - "After SUBMIT: AffiliationAgreement.${agr2_id}.provisional_club_obligation_cents == 1759000"
            - "After SUBMIT: AffiliationAgreement.${agr2_id}.affiliate_overflow_cents == 0"
            - "After SETTLE: AffiliationAgreement.${agr2_id}.final_club_obligation_cents == 1378231"
            - "After SETTLE: AffiliationAgreement.${agr2_id}.affiliate_overflow_cents == 380769"
            - "AffiliationAgreement.${agr2_id}.provisional_club_obligation_cents remains 1759000 after settlement (the provisional ledger is not overwritten)"
            - "1759000 - 1378231 == 380769, i.e. the whole variant delta lands in affiliate_overflow_cents"
            - "AffiliationAgreement.${agr2_id}.settlement_status == SETTLED and status == ACTIVE (SETTLE is a self-transition)"
            - "The final HOUSING line is capped at sub_cap 519231 while MEALS (384000 <= 415385), TRAVEL (355000 <= 692308) and FACILITY_UPKEEP (120000 <= 173077) pass through uncapped"

  # ==========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: expense_allocation_rounds_per_category_then_sums
        grounds:
          - calculations.expense_allocation_settlement
          - entities.AffiliationAgreement.fields.provisional_club_obligation_cents
          - state_machines.AffiliationAgreement.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          This instance pins ROUNDING GRANULARITY: two of the four category
          products end in exactly 0.25 cents, so rounding each category line
          before summing yields 1759014 while the plausible-but-wrong
          round-after-summing order yields 1759015 from the same four inputs.
        test_recipe:
          setup:
            - "A SINGLE_A affiliate with a DRAFT agreement whose cap 5000000 is far above the total obligation, so no capping interferes with the rounding observation."
            - "Gross expenses chosen so HOUSING * 0.75 == 900002.25 and FACILITY_UPKEEP * 0.25 == 120002.25 while MEALS * 0.60 == 384003 and TRAVEL * 1.00 == 355007 are exact."
          setup_api_calls:
            - call: "POST /affiliates"
              payload: { name: "Jupiter Hammerheads", level: "SINGLE_A", market_city: "Jupiter", meal_stipend_cents_per_day: 2600 }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
              captures: { aff3_id: $.data.id }
            - call: "POST /affiliates/${aff3_id}/agreements"
              payload: { term_start_date: "2026-01-01", term_end_date: "2026-12-31", facility_standard_tier: "TIER_2", club_reimbursement_cap_cents: 5000000, minimum_active_players: 0, housing_expense_cents: 1200003, meal_expense_cents: 640005, travel_expense_cents: 355007, upkeep_expense_cents: 480009 }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
              captures: { agr3_id: $.data.id }
          trigger:
            - call: "POST /agreements/${agr3_id}/disposition"
              payload: { action: "SUBMIT" }
              as: AffiliateOperator
              as_user_id: "${aff3_id}"
              captures: { prov3: $.data.provisional_club_obligation_cents, ovf3: $.data.affiliate_overflow_cents, st3: $.data.status }
          assert:
            - "AffiliationAgreement.${agr3_id}.provisional_club_obligation_cents == 1759014"
            - "AffiliationAgreement.${agr3_id}.provisional_club_obligation_cents != 1759015 (the value produced by rounding the summed exact products 1759014.50 instead of rounding each category line first)"
            - "AffiliationAgreement.${agr3_id}.affiliate_overflow_cents == 0 because 1759014 is below the 5000000 cap"
            - "AffiliationAgreement.${agr3_id}.status == SUBMITTED and posture == FROZEN (posture only leaves FROZEN on ACTIVATE)"
            - "The four rounded category lines are 900002 (from 900002.25), 384003, 355007 and 120002 (from 120002.25), summing to 1759014"

      - name: signing_pool_charge_evaluation_order_pinned_before_forfeit
        grounds:
          - calculations.signing_pool_charge
          - entities.SigningPool.fields.forfeited_cents
          - entities.SigningPool.fields.effective_pool_cents
          - entities.SigningPool.fields.remaining_cents
          - entities.InternationalSigning.fields.overage_tax_cents
          - entities.InternationalSigning.fields.tier3_breach
          - state_machines.InternationalSigning.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          This instance pins EVALUATION ORDER across three interacting terms
          rather than rounding: the taxable overage must be measured against the
          PRE-forfeit effective pool (tax 1075000 over segments 500000, 500000,
          200000), and applying TIER3_FORFEIT_CENTS first would inflate the
          overage to 1450000 and the tax to 1325000.
        test_recipe:
          setup:
            - "A DOMINICAN_ACADEMY affiliate with an ACTIVE agreement (minimum_active_players 0) and housing_beds 40."
            - "A 2026 SigningPool with base_pool_cents 5000000 and trade_adjustment_cents 0, so effective_pool_cents starts at 5000000."
            - "A first INTERNATIONAL_FA signee approved at bonus 5000000, taking allocated_cents to exactly 5000000 with zero overage and the pool still OPEN."
            - "A second INTERNATIONAL_FA signee submitted at bonus 1200000, which will push cumulative overage to 1200000 and cross the TIER_3 ceiling."
          setup_api_calls:
            - call: "POST /affiliates"
              payload: { name: "Boca Chica Academy", level: "DOMINICAN_ACADEMY", market_city: "Boca Chica", meal_stipend_cents_per_day: 2500, housing_beds: 40 }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
              captures: { acad_id: $.data.id }
            - call: "POST /affiliates/${acad_id}/agreements"
              payload: { term_start_date: "2026-01-01", term_end_date: "2026-12-31", facility_standard_tier: "TIER_3", club_reimbursement_cap_cents: 100000, minimum_active_players: 0 }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
              captures: { acad_agr_id: $.data.id }
            - call: "POST /agreements/${acad_agr_id}/disposition"
              payload: { action: "SUBMIT" }
              as: AffiliateOperator
              as_user_id: "${acad_id}"
            - call: "POST /agreements/${acad_agr_id}/disposition"
              payload: { action: "ACTIVATE" }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
            - call: "POST /signing-pools"
              payload: { season_year: 2026, base_pool_cents: 5000000, trade_adjustment_cents: 0 }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
              captures: { pool_id: $.data.id, pool_v1: $.data.version }
            - call: "POST /players"
              payload: { full_name: "Elian Reyes", origin: "INTERNATIONAL_FA", signed_date: "2026-01-15" }
              as: InternationalScout
              as_user_id: "u-scout-1"
              captures: { ip1: $.data.id }
            - call: "POST /players"
              payload: { full_name: "Yoel Castro", origin: "INTERNATIONAL_FA", signed_date: "2026-01-15" }
              as: InternationalScout
              as_user_id: "u-scout-1"
              captures: { ip2: $.data.id }
            - call: "POST /international-signings"
              payload: { pool_id: "${pool_id}", player_id: "${ip1}", academy_affiliate_id: "${acad_id}", bonus_cents: 5000000, expected_pool_version: "${pool_v1}" }
              as: InternationalScout
              as_user_id: "u-scout-1"
              captures: { sgn1: $.data.id }
            - call: "POST /international-signings/${sgn1}/disposition"
              payload: { action: "APPROVE" }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
              captures: { tax1: $.data.overage_tax_cents, breach1: $.data.tier3_breach }
            - call: "GET /signing-pools/${pool_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
              captures: { pool_v2: $.data.version, alloc1: $.data.allocated_cents, status1: $.data.status }
            - call: "POST /international-signings"
              payload: { pool_id: "${pool_id}", player_id: "${ip2}", academy_affiliate_id: "${acad_id}", bonus_cents: 1200000, expected_pool_version: "${pool_v2}" }
              as: InternationalScout
              as_user_id: "u-scout-1"
              captures: { sgn2: $.data.id }
          trigger:
            - call: "POST /international-signings/${sgn2}/disposition"
              payload: { action: "APPROVE" }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
              captures: { tax2: $.data.overage_tax_cents, breach2: $.data.tier3_breach, charge2: $.data.pool_charge_cents }
            - call: "GET /signing-pools/${pool_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
              captures: { eff2: $.data.effective_pool_cents, alloc2: $.data.allocated_cents, rem2: $.data.remaining_cents, forf2: $.data.forfeited_cents, status2: $.data.status }
          assert:
            - "InternationalSigning.${sgn1}.overage_tax_cents == 0 and InternationalSigning.${sgn1}.tier3_breach == false"
            - "SigningPool.${pool_id}.allocated_cents == 5000000 and SigningPool.${pool_id}.status == OPEN after the first approval"
            - "InternationalSigning.${sgn2}.overage_tax_cents == 1075000"
            - "InternationalSigning.${sgn2}.overage_tax_cents != 1325000 (the value produced when TIER3_FORFEIT_CENTS is subtracted from the pool before the overage is measured)"
            - "InternationalSigning.${sgn2}.tier3_breach == true and InternationalSigning.${sgn2}.pool_charge_cents == 1200000"
            - "SigningPool.${pool_id}.forfeited_cents == 250000"
            - "SigningPool.${pool_id}.effective_pool_cents == 4750000"
            - "SigningPool.${pool_id}.allocated_cents == 6200000"
            - "SigningPool.${pool_id}.remaining_cents == -1450000"
            - "SigningPool.${pool_id}.overage_tax_accrued_cents == 1075000"
            - "SigningPool.${pool_id}.status == HARD_CAPPED"
            - "The tax decomposes as 500000 * 0.75 + 500000 * 1.00 + 200000 * 1.00 == 375000 + 500000 + 200000 == 1075000"

  # ==========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: player_roster_and_medical_dimensions_advance_independently
        grounds:
          - state_machines.Player.roster_status
          - state_machines.Player.medical_status
          - state_machines.MedicalClearance.REQUESTED_to_ISSUED
          - state_machines.MedicalClearance.REQUESTED_to_DENIED
          - state_machines.PlayerAssignment.PENDING_CLEARANCE_to_ACTIVE
        distinguishing_aspect: |
          This instance exercises the PARALLEL dimension pair on one Player:
          three consecutive writes each move exactly one of the two state
          fields, walking (RESERVE_LIST, PENDING_CLEARANCE) ->
          (RESERVE_LIST, CLEARED) -> (ACTIVE, CLEARED) -> (ACTIVE, RESTRICTED)
          while the ACTIVE assignment never changes state.
        test_recipe:
          setup:
            - "A SINGLE_A affiliate with an ACTIVE agreement whose minimum_active_players is 0 and required_staff_roles is empty, so posture is OPEN throughout."
            - "A freshly created player, so roster_status is RESERVE_LIST and medical_status is PENDING_CLEARANCE."
            - "One REQUESTED LEVEL_ASSIGNMENT clearance for that player."
            - "There is no uniqueness rule on MedicalClearance, so a second LEVEL_ASSIGNMENT clearance can be requested while the first is ISSUED."
          setup_api_calls:
            - call: "POST /affiliates"
              payload: { name: "Fredericksburg Nationals", level: "SINGLE_A", market_city: "Fredericksburg", meal_stipend_cents_per_day: 2700 }
              as: FarmDirector
              as_user_id: "u-farm-1"
              captures: { aff5_id: $.data.id }
            - call: "POST /affiliates/${aff5_id}/agreements"
              payload: { term_start_date: "2026-01-01", term_end_date: "2026-12-31", facility_standard_tier: "TIER_2", club_reimbursement_cap_cents: 900000, minimum_active_players: 0 }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
              captures: { agr5_id: $.data.id }
            - call: "POST /agreements/${agr5_id}/disposition"
              payload: { action: "SUBMIT" }
              as: AffiliateOperator
              as_user_id: "${aff5_id}"
            - call: "POST /agreements/${agr5_id}/disposition"
              payload: { action: "ACTIVATE" }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
            - call: "POST /players"
              payload: { full_name: "Marcus Vail", origin: "DOMESTIC_DRAFT", signed_date: "2025-07-01" }
              as: FarmDirector
              as_user_id: "u-farm-1"
              captures: { p5_id: $.data.id }
            - call: "POST /players/${p5_id}/medical-clearances"
              payload: { clearance_type: "LEVEL_ASSIGNMENT" }
              as: FarmDirector
              as_user_id: "u-farm-1"
              captures: { c5a: $.data.id }
            - call: "GET /players/${p5_id}"
              payload: {}
              as: FarmDirector
              as_user_id: "u-farm-1"
              captures: { rs0: $.data.roster_status, ms0: $.data.medical_status }
          trigger:
            - call: "POST /medical-clearances/${c5a}/disposition"
              payload: { action: "ISSUE", cleared_workload_ceiling_index: 25.00, expires_on: "2026-12-31" }
              as: MedicalDirector
              as_user_id: "u-med-1"
            - call: "GET /players/${p5_id}"
              payload: {}
              as: FarmDirector
              as_user_id: "u-farm-1"
              captures: { rs1: $.data.roster_status, ms1: $.data.medical_status, pv5: $.data.version }
            - call: "POST /assignments"
              payload: { player_id: "${p5_id}", affiliate_id: "${aff5_id}", assignment_type: "LEVEL", movement_reason: "INITIAL", effective_date: "2026-08-05", end_date: "2026-09-30", expected_player_version: "${pv5}" }
              as: FarmDirector
              as_user_id: "u-farm-1"
              captures: { asg5: $.data.id }
            - call: "POST /assignments/${asg5}/disposition"
              payload: { action: "ACTIVATE" }
              as: FarmDirector
              as_user_id: "u-farm-1"
            - call: "GET /players/${p5_id}"
              payload: {}
              as: FarmDirector
              as_user_id: "u-farm-1"
              captures: { rs2: $.data.roster_status, ms2: $.data.medical_status }
            - call: "POST /players/${p5_id}/medical-clearances"
              payload: { clearance_type: "LEVEL_ASSIGNMENT" }
              as: FarmDirector
              as_user_id: "u-farm-1"
              captures: { c5b: $.data.id }
            - call: "POST /medical-clearances/${c5b}/disposition"
              payload: { action: "DENY", restriction_note: "elbow inflammation flagged on re-screen" }
              as: MedicalDirector
              as_user_id: "u-med-1"
            - call: "GET /players/${p5_id}"
              payload: {}
              as: FarmDirector
