            - "${e_stale} == ERR_STALE_ESTATE_VERSION with HTTP 412"
            - "${est_v3} == ${est_v2} (a 412 mutates nothing, not even the version)"
            - "${run1_gross} == 200000 and ${run1_included} == 1 (the SOCIAL_PROFILE asset is NON_TRANSFERABLE and UNVERIFIED)"
            - "${est_v4} > ${est_v3} (the run mirrored gross, deduction, taxable, undistributed and the allocation plan onto the estate)"
            - "${e_stale_2} == ERR_STALE_ESTATE_VERSION with HTTP 412 and ${est_v5} == ${est_v4}"
            - "GET /valuation-runs filtered by estate_id ${est_id} returns exactly 1 row"
            - "an expected_estate_version greater than Estate.version is also ERR_STALE_ESTATE_VERSION: the comparison is equality, not a floor"

      - name: the_asset_occ_token_guards_every_disposition_election
        claim_type: optimistic_concurrency
        excluded_because:
          difficulty_instance: rejection_and_supersession_both_restore_the_inventory_counter_identity
          rationale: |
            That §1.8 instance already captures expected_asset_version, mutates the asset through a
            SUBMIT/REJECT round trip, replays the stale token to obtain 412 ERR_STALE_ASSET_VERSION on
            POST /digital-assets/{asset_id}/disposition-elections, and then re-reads the asset for a
            fresh token, so the second §1.2.1 concurrency rule is fully covered there.

      - name: approval_and_confirmation_cascades_reach_every_level
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: cancellation_confirm_cascades_to_term_then_asset_then_estate_while_fail_cascades_nowhere
          rationale: |
            The §1.8 transitive_cascade block already walks both multi-level chains end to end — grant →
            asset disclosure → auto-created cancellation order → estate counters on APPROVE, and term →
            asset billing state → estate counters on CONFIRM — and asserts that FAIL propagates nowhere,
            which is the ordering-sensitivity and partial-propagation claim for this layer.

      - name: both_valuation_bases_and_both_refund_methods_diverge_on_identical_data
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: alternate_basis_decay_diverges_from_date_of_death_appraisal
          rationale: |
            The §1.8 dual_variant_calc block covers both variant pairs on identical inputs — DATE_OF_DEATH
            versus ALTERNATE appraisal with the per-category decay, and PRORATA_DAILY versus
            UNUSED_PERIOD refund on one interval — including the delta each switch produces, so a
            separate §1.9 instance would only restate it.

      - name: the_five_estate_counters_reconcile_after_create_disclose_dispose_and_reverse
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Estate.fields.inventory_total_count
          - entities.Estate.fields.assets_pending_disposition_count
          - entities.Estate.fields.assets_disposed_count
          - entities.Estate.fields.disclosed_asset_count
