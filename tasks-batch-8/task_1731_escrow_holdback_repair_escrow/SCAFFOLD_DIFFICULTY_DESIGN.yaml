            - "hb_amt == 240000 (amended estimate 200000 x 1.20, recomputed at amend)"
            - "Approval.${ap_len2}.holdback_version_at_decision == ${hb_v5} (approval pins the agreement version it decided on)"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
