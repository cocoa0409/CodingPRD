  # =================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =================================================================
  - rule_id: compensating_invariant
    instances:
      - name: cancel_refund_conserves_net_cash_minus_retention
        grounds:
          - state_machines.Booking.CONFIRMED_to_CANCELLED
          - calculations.cancellation_refund
          - entities.Booking.fields.amount_paid_cents
          - entities.Payment.fields.amount_cents
        distinguishing_aspect: |
          Conserved quantity = net cash held by the venue. Invariant: after a client cancel,
          sum(INBOUND POSTED) - sum(OUTBOUND POSTED) == retained == round(paid * retention_pct).
          For STANDARD/CONFIRMED on paid 783800: amount_paid_cents lands at exactly 195950 and the
          OUTBOUND refund is 587850, summing back to the original 783800.
        test_recipe:
          setup:
            - "Confirmed STANDARD booking, deposit 783800 paid (only inbound), then client cancels"
          setup_api_calls:
            - call: "POST /venues"
