        captures:
          po_id: $.data.id
      - call: POST /api/v1/component-purchase-orders
        payload:
          component_id: ${ws200_id}
          qty_ordered: 4
          unit_cost_cents: 200000
          order_date: '2026-09-01'
          expected_receipt_date: '2026-09-11'
        as: SupplyChainCoordinator
        captures:
          cpo_id: $.data.id
      - call: POST /api/v1/component-purchase-orders/${cpo_id}/confirm
        payload: {}
        as: SupplyChainCoordinator
      - call: POST /api/v1/component-receipts
        payload:
          component_purchase_order_id: ${cpo_id}
          component_id: ${ws200_id}
          qty_received: 4
          receipt_date: '2026-09-11'
        as: SupplyChainCoordinator
        captures:
          cr_id: $.data.id
      - call: POST /api/v1/component-receipts/${cr_id}/receive
        payload: {}
        as: SupplyChainCoordinator
      - call: POST /api/v1/production-orders/${po_id}/reserve-components
        payload: {}
        as: ProductionPlanner
      - call: POST /api/v1/production-orders/${po_id}/release
        payload: {}
        as: ProductionPlanner
      - call: POST /api/v1/production-lines/LINE-A/changeover
        payload:
          production_order_id: ${po_id}
          scheduled_start_date: '2026-09-05'
          scheduled_end_date: '2026-09-15'
        as: ProductionPlanner
      - call: POST /api/v1/production-orders/${po_id}/complete
        payload:
          completed_qty: 1
          completion_date: '2026-09-15'
        as: ProductionPlanner
      - call: GET /api/v1/lease-fleet-cars
        payload:
          production_order_id: ${po_id}
        as: PlatformAdmin
        captures:
          car_id: $.data[0].id
      - call: POST /api/v1/lessees
        payload:
          legal_name: Acme Leasing LLC
          credit_tier: A
          utilization_threshold_pct: 50
          credit_ceiling_cents: 50000000
        as: LeaseAdministrator
        captures:
          lessee_id: $.data.id
      - call: POST /api/v1/lease-contracts
        payload:
          lessee_id: ${lessee_id}
          lease_type: FULL_SERVICE
          per_diem_rate_cents: 25000
          liability_bearer: LESSOR
          term_start_date: '2026-09-01'
