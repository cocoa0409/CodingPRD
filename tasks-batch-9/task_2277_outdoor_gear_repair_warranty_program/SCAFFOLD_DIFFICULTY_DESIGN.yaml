            - "Technician.${t1_id}.scheduled_minutes_open == 180 (120 + 60)"
            - "the straddling block returns error_id == ERR_TECHNICIAN_WINDOW_CONFLICT with HTTP 409"
            - "GET /gear-service/work-blocks?technician_id=${t1_id}&status=SCHEDULED returns exactly 2 rows"
            - "Technician.${t1_id}.scheduled_minutes_open == 180 after the refusal (unchanged)"

      - name: surge_window_shared_endpoint_date_rejected_disjoint_accepted
        grounds:
          - validations[priority=33]
          - entities.SurgeWindow.fields.start_date
          - entities.SurgeWindow.fields.end_date
          - calculations.turnaround_commitment
        distinguishing_aspect: |
          A different resource (ServiceCenter surge calendar) under the OPPOSITE interval
          convention: SurgeWindow uses CLOSED-INCLUSIVE dates, so a window starting on the
          incumbent's last covered day (2026-09-30) IS an overlap and is rejected, whereas
          the WorkBlock instance treats a shared endpoint as legal adjacency.
        test_recipe:
          setup:
            - "clock 2026-06-15T09:00:00Z; Cascade Service Hub with one ACTIVE window 2026-09-01..2026-09-30"
          setup_api_calls:
            - call: "POST /gear-service/_clock/set_current_utc"
              payload: { current_utc: "2026-06-15T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /gear-service/service-centers"
              payload: { name: "Cascade Service Hub", region_code: "US-OR", liability_cap_cents: 5000000 }
              as: ProgramAdmin
              captures: { sc_id: $.data.id }
            - call: "POST /gear-service/service-centers/${sc_id}/surge-windows"
              payload: { label: "September shoulder surge", start_date: "2026-09-01T00:00:00Z", end_date: "2026-09-30T00:00:00Z", multiplier: 1.25 }
              as: ProgramAdmin
              captures: { sw_sep_id: $.data.id }
          trigger:
            - call: "POST /gear-service/service-centers/${sc_id}/surge-windows"
              payload: { label: "Fall overlap attempt", start_date: "2026-09-30T00:00:00Z", end_date: "2026-10-15T00:00:00Z", multiplier: 1.60 }
              as: ProgramAdmin
            - call: "POST /gear-service/service-centers/${sc_id}/surge-windows"
              payload: { label: "October surge", start_date: "2026-10-01T00:00:00Z", end_date: "2026-10-15T00:00:00Z", multiplier: 1.60 }
              as: ProgramAdmin
              captures: { sw_oct_id: $.data.id }
          assert:
            - "the shared-endpoint window returns error_id == ERR_SURGE_WINDOW_OVERLAP with HTTP 409"
            - "the day-after window returns 201: SurgeWindow.${sw_oct_id}.status == ACTIVE with multiplier 1.60"
            - "GET /gear-service/service-centers/${sc_id}/surge-windows?status=ACTIVE returns exactly 2 rows (${sw_sep_id} and ${sw_oct_id})"
            - "ServiceCenter.${sc_id}.current_surge_multiplier == 1.00 (neither window covers the 2026-06-15 clock)"

  # =========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: parts_reservation_release_restores_lot_units
        grounds:
          - state_machines.PartsReservation.RESERVED_to_RELEASED
          - entities.PartLot.fields.reserved_units
          - entities.PartLot.fields.available_units
          - calculations.parts_substitution_eligibility
        distinguishing_aspect: |
          Conserved quantity: PartLot.reserved_units == sum of units over RESERVED
          PartsReservation rows on that lot, with on_hand_units untouched by any
          reservation lifecycle. Reserving 2 of 5 and then releasing them returns the lot
          to (5, 0, 5) exactly, with no unit invented or lost.
        test_recipe:
          setup:
            - "clock 2026-06-15T09:00:00Z; WARRANTY_REPAIR order on AS2-00417"
            - "AS2-FLOOR-PANEL lot at on_hand_units 5, low_watermark_units 2, status AVAILABLE"
          setup_api_calls:
            - call: "POST /gear-service/_clock/set_current_utc"
              payload: { current_utc: "2026-06-15T09:00:00Z" }
              as: ProgramAdmin
