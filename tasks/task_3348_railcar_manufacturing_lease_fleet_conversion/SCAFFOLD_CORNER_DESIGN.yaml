  - name: lease_contract_amendment_redraft_stale_version_rejected
    claim_type: Precondition Enforcement
    grounds:
    - state_machines.LeaseContract.ACTIVE_to_AMENDMENT_DRAFTED
    - concurrency_rules[amendment-redraft-stale-contract]
    - errors[ERR_STALE_VERSION]
    distinguishing_aspect: Redrafting an amendment with the version observed before the first draft returns
      412 ERR_STALE_VERSION under the amendment-redraft-stale-contract rule, while the legitimate redraft
      in AMENDMENT_DRAFTED succeeds — the two writes differ only by the observed version.
    test_recipe:
      setup:
      - Empty DB; one ACTIVE contract at a known version captured from its activation response.
      setup_api_calls:
      - call: POST /api/v1/_clock/set_current_utc
        payload:
