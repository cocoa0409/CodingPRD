scaffold_difficulty_design:
  # ==========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # ==========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: retrans_settlement_provisional_vs_final_share
        grounds:
          - calculations.reverse_comp_provisional_vs_final
          - state_machines.RetransSettlement.DRAFT_to_COMMITTED
          - state_machines.RetransSettlement.COMMITTED_to_RECONCILED
          - entities.RetransSettlement.fields.variant_used
        distinguishing_aspect: |
          Same settlement data produces different network_share_cents under
          PROVISIONAL vs FINAL variants because PROVISIONAL uses the current-period
          trailing aggregate with round_half_up while FINAL uses the prior-period
          trailing aggregate snapshot with ceiling — different snapshot and
          different rounding rule. Domain: RetransSettlement / network compensation.
        test_recipe:
          setup:
            - "Network N1 with reverse_comp_standard_pct=0.40, retrans_share_standard_pct=0.60, current_period_index=0"
            - "StationGroup SG1 with leverage_tier=MAJOR, aggregate_retrans_cents=0"
            - "Station S1 in SG1 affiliated with N1, dma_code=DMA-001"
            - "Territory T1 on N1 for DMA-001 with empty protection window"
            - "AffiliationAgreement A1 ACTIVE on S1, reverse_comp_pct=0.40, retrans_share_pct=0.60, clearance_obligation_hours=100, term 2026-01-01 to 2027-01-01"
            - "RetransSettlement RS1 for period_index=0 with gross_retrans_cents=120000000 (gross makes current trailing hit MAJOR tier but prior trailing is 0, so MAJOR discount applies in PROVISIONAL but not FINAL)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /networks"
              payload: { call_sign: "PBN", primary_feed_tz: "America/New_York", reverse_comp_standard_pct: 0.40, retrans_share_standard_pct: 0.60 }
              as: PlatformAdmin
              captures: { net_id: $.data.id }
            - call: "POST /station-groups"
              payload: { group_name: "Meridian", leverage_tier: "MAJOR" }
              as: PlatformAdmin
              captures: { sg_id: $.data.id }
            - call: "POST /networks/${net_id}/stations"
              payload: { call_sign: "KPBN", dma_code: "DMA-001", station_group_id: "${sg_id}" }
              as: NetworkAffiliateRelations
              captures: { st_id: $.data.id, st_v: $.data.version }
            - call: "POST /networks/${net_id}/territories"
              payload: { dma_code: "DMA-001", protection_window_start_utc: "2026-05-01T00:00:00Z", protection_window_end_utc: "2026-05-02T00:00:00Z" }
              as: NetworkAffiliateRelations
            - call: "POST /networks/${net_id}/stations/${st_id}/agreements"
              payload: { term_start_utc: "2026-01-01T00:00:00Z", term_end_utc: "2027-01-01T00:00:00Z", reverse_comp_pct: 0.40, retrans_share_pct: 0.60, clearance_obligation_hours: 100 }
              as: NetworkAffiliateRelations
              captures: { ag_id: $.data.id }
            - call: "POST /networks/${net_id}/stations/${st_id}/agreements/${ag_id}/submit"
              payload: {}
              as: NetworkAffiliateRelations
            - call: "POST /networks/${net_id}/stations/${st_id}/agreements/${ag_id}/activate"
              payload: {}
              as: NetworkAffiliateRelations
            - call: "POST /networks/${net_id}/stations/${st_id}/retrans-settlements"
              payload: { agreement_id: "${ag_id}", period_index: 0, gross_retrans_cents: 120000000 }
              as: NetworkAffiliateRelations
              captures: { rs_id: $.data.id }
            - call: "POST /networks/${net_id}/stations/${st_id}/retrans-settlements/${rs_id}/commit"
              payload: { expected_station_version: "${st_v}" }
              as: NetworkAffiliateRelations
          trigger:
            - call: "POST /networks/${net_id}/advance-period"
              payload: {}
              as: PlatformAdmin
            - call: "POST /networks/${net_id}/stations/${st_id}/retrans-settlements/${rs_id}/reconcile"
              payload: {}
              as: NetworkAffiliateRelations
              captures: { final_share: $.data.network_share_cents, final_variant: $.data.variant_used }
          assert:
            - "After commit: RetransSettlement.${rs_id}.variant_used == PROVISIONAL"
            - "After commit: RetransSettlement.${rs_id}.network_share_cents == 46080000  # PROVISIONAL: net=120000000, MAJOR discount 0.04, base=round_half_up(120000000*0.40,0)=48000000, share=round_half_up(48000000*0.96,0)=46080000"
            - "After reconcile: variant_used == FINAL"
            - "final_share == 48000000  # FINAL: prior trailing=0, discount=0.0, share=ceil(120000000*0.40*(1-0)) = 48000000"
            - "PROVISIONAL share (46080000) != FINAL share (48000000) — same data, different result"

      - name: outage_credit_cause_dependent_tiers
        grounds:
          - calculations.outage_credit_amount
          - state_machines.OutageEvent.REPORTED_to_CONFIRMED
          - entities.OutageCredit.fields.credit_cents
        distinguishing_aspect: |
          Outage credit for identical duration produces different credit_cents
          depending on cause: SATELLITE_JAM applies 1.5x multiplier while
          PLANNED_MAINTENANCE zeroes the credit; the tiered minute brackets
          (1.0x / 1.5x / 2.0x by minute range) interact with the cause multiplier
          multiplicatively. Domain: OutageEvent / outage credits — different
          entity domain from retrans settlement.
        test_recipe:
          setup:
            - "Network N1, StationGroup SG1 (MID), Station S1, Territory T1, AffiliationAgreement A1 ACTIVE"
            - "Two OutageEvents: OE1 with cause=SATELLITE_JAM duration 200 min; OE2 with cause=PLANNED_MAINTENANCE duration 200 min"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /networks"
              payload: { call_sign: "PBN", primary_feed_tz: "America/New_York", reverse_comp_standard_pct: 0.40, retrans_share_standard_pct: 0.60 }
              as: PlatformAdmin
              captures: { net_id: $.data.id }
            - call: "POST /station-groups"
              payload: { group_name: "Meridian", leverage_tier: "MID" }
              as: PlatformAdmin
              captures: { sg_id: $.data.id }
            - call: "POST /networks/${net_id}/stations"
              payload: { call_sign: "KPBN", dma_code: "DMA-001", station_group_id: "${sg_id}" }
              as: NetworkAffiliateRelations
              captures: { st_id: $.data.id }
            - call: "POST /networks/${net_id}/territories"
              payload: { dma_code: "DMA-001", protection_window_start_utc: "2026-05-01T00:00:00Z", protection_window_end_utc: "2026-05-02T00:00:00Z" }
              as: NetworkAffiliateRelations
            - call: "POST /networks/${net_id}/stations/${st_id}/agreements"
              payload: { term_start_utc: "2026-01-01T00:00:00Z", term_end_utc: "2027-01-01T00:00:00Z", reverse_comp_pct: 0.40, retrans_share_pct: 0.60, clearance_obligation_hours: 100 }
              as: NetworkAffiliateRelations
              captures: { ag_id: $.data.id }
            - call: "POST /networks/${net_id}/stations/${st_id}/agreements/${ag_id}/submit"
              payload: {}
              as: NetworkAffiliateRelations
            - call: "POST /networks/${net_id}/stations/${st_id}/agreements/${ag_id}/activate"
              payload: {}
              as: NetworkAffiliateRelations
            - call: "POST /networks/${net_id}/stations/${st_id}/outage-events"
              payload: { period_index: 0, started_at_utc: "2026-05-05T01:00:00Z", ended_at_utc: "2026-05-05T04:20:00Z", cause: "SATELLITE_JAM" }
              as: StationGroupOwner
              as_user_id: "${sg_id}"
              captures: { oe_satjam: $.data.id }
            - call: "POST /networks/${net_id}/stations/${st_id}/outage-events"
              payload: { period_index: 0, started_at_utc: "2026-05-06T01:00:00Z", ended_at_utc: "2026-05-06T04:20:00Z", cause: "PLANNED_MAINTENANCE" }
              as: StationGroupOwner
              as_user_id: "${sg_id}"
              captures: { oe_maint: $.data.id }
          trigger:
            - call: "POST /networks/${net_id}/stations/${st_id}/outage-events/${oe_satjam}/confirm"
              payload: {}
              as: NetworkAffiliateRelations
            - call: "POST /networks/${net_id}/stations/${st_id}/outage-events/${oe_maint}/confirm"
              payload: {}
              as: NetworkAffiliateRelations
            - call: "GET /networks/${net_id}/stations/${st_id}/outage-credits"
              payload: {}
              as: NetworkAffiliateRelations
              captures: {satjam_credit: "$.data[0].credit_cents", maint_credit: "$.data[1].credit_cents"}
          assert:
            - "satjam_credit == 243750  # (30*1.0 + 90*1.5 + 80*2.0)*500*1.5 = 325*500*1.5 = 243750"
            - "maint_credit == 0"
            - "OutageEvent.${oe_satjam}.status == CONFIRMED"
            - "OutageEvent.${oe_maint}.status == CONFIRMED"

  # ==========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # ==========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: retrans_tiered_discount_multi_input
        grounds:
          - calculations.reverse_comp_provisional_vs_final
          - entities.StationGroup.fields.leverage_tier
          - entities.StationGroup.fields.aggregate_retrans_cents
        distinguishing_aspect: |
          Mode (a) — non-linear formula with >=3 inputs: tier classification
          depends on (StationGroup.leverage_tier, aggregate_retrans_cents,
          tier_threshold constants); discount combines multiplicatively with
          agreement.reverse_comp_pct; rounding rule differs per variant
          (round_half_up vs ceiling). Result is a piecewise function over
          {MAJOR, LARGE, MID, SMALL} x {above/below threshold} x {PROVISIONAL,
          FINAL}.
        test_recipe:
          setup:
            - "Network N1 with reverse_comp_standard_pct=0.40"
            - "StationGroup SG_LARGE with leverage_tier=LARGE (trailing starts at 0)"
            - "Station S1 in SG_LARGE, agreement A1 ACTIVE reverse_comp_pct=0.40"
            - "First settlement RS1 with gross_retrans_cents=51000000 committed (bumps aggregate above LARGE threshold 50000000)"
            - "Second settlement RS2 for next period with same gross; PROVISIONAL now applies LARGE discount 0.025"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /networks"
              payload: { call_sign: "PBN", primary_feed_tz: "America/New_York", reverse_comp_standard_pct: 0.40, retrans_share_standard_pct: 0.60 }
              as: PlatformAdmin
              captures: { net_id: $.data.id }
            - call: "POST /station-groups"
              payload: { group_name: "MeridianLarge", leverage_tier: "LARGE" }
              as: PlatformAdmin
              captures: { sg_id: $.data.id }
            - call: "POST /networks/${net_id}/stations"
              payload: { call_sign: "KPBN", dma_code: "DMA-001", station_group_id: "${sg_id}" }
              as: NetworkAffiliateRelations
              captures: { st_id: $.data.id, st_v0: $.data.version }
            - call: "POST /networks/${net_id}/territories"
              payload: { dma_code: "DMA-001", protection_window_start_utc: "2026-05-01T00:00:00Z", protection_window_end_utc: "2026-05-02T00:00:00Z" }
              as: NetworkAffiliateRelations
            - call: "POST /networks/${net_id}/stations/${st_id}/agreements"
              payload: { term_start_utc: "2026-01-01T00:00:00Z", term_end_utc: "2027-01-01T00:00:00Z", reverse_comp_pct: 0.40, retrans_share_pct: 0.60, clearance_obligation_hours: 100 }
              as: NetworkAffiliateRelations
              captures: { ag_id: $.data.id }
            - call: "POST /networks/${net_id}/stations/${st_id}/agreements/${ag_id}/submit"
              payload: {}
              as: NetworkAffiliateRelations
            - call: "POST /networks/${net_id}/stations/${st_id}/agreements/${ag_id}/activate"
              payload: {}
              as: NetworkAffiliateRelations
            - call: "POST /networks/${net_id}/stations/${st_id}/retrans-settlements"
              payload: { agreement_id: "${ag_id}", period_index: 0, gross_retrans_cents: 51000000 }
              as: NetworkAffiliateRelations
              captures: { rs1: $.data.id }
            - call: "POST /networks/${net_id}/stations/${st_id}/retrans-settlements/${rs1}/commit"
              payload: { expected_station_version: "${st_v0}" }
              as: NetworkAffiliateRelations
              captures: { st_v1: $.data.version }
            - call: "POST /networks/${net_id}/advance-period"
              payload: {}
              as: PlatformAdmin
            - call: "POST /networks/${net_id}/stations/${st_id}/retrans-settlements"
              payload: { agreement_id: "${ag_id}", period_index: 1, gross_retrans_cents: 51000000 }
              as: NetworkAffiliateRelations
              captures: { rs2: $.data.id }
          trigger:
            - call: "POST /networks/${net_id}/stations/${st_id}/retrans-settlements/${rs2}/commit"
              payload: { expected_station_version: "${st_v1}" }
              as: NetworkAffiliateRelations
              captures: { rs2_share: $.data.network_share_cents }
          assert:
            - "RetransSettlement.${rs1}.network_share_cents == 20400000  # trailing=0 before commit -> discount 0; 51000000*0.40 = 20400000"
            - "rs2_share == 19890000  # trailing=51000000 >= 50000000 -> LARGE discount 0.025; base=round_half_up(51000000*0.40,0)=20400000; share=round_half_up(20400000*0.975,0)=19890000"
            - "rs1 share != rs2 share even though gross is identical"

      - name: clearance_rate_pinned_rounding_order
        grounds:
          - calculations.clearance_rate_calc
          - entities.ClearanceReport.fields.clearance_rate
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters: the formula pins
          'divide first, then round half-up to 4 decimals'. If an implementation
          pre-rounds cleared_hours and obligated_hours before dividing, the
          4-decimal result differs. Test drives inputs (cleared_hours=87.345,
          obligation=103) where the two orderings diverge at the 4th decimal.
        test_recipe:
          setup:
            - "Network N1, Station S1, Territory T1, Agreement A1 ACTIVE with clearance_obligation_hours=103"
            - "ClearanceReport CR1 with cleared_hours=87.345, preempted_hours=15.655"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /networks"
              payload: { call_sign: "PBN", primary_feed_tz: "America/New_York", reverse_comp_standard_pct: 0.40, retrans_share_standard_pct: 0.60 }
              as: PlatformAdmin
              captures: { net_id: $.data.id }
            - call: "POST /station-groups"
              payload: { group_name: "M", leverage_tier: "SMALL" }
              as: PlatformAdmin
              captures: { sg_id: $.data.id }
            - call: "POST /networks/${net_id}/stations"
              payload: { call_sign: "KPBN", dma_code: "DMA-001", station_group_id: "${sg_id}" }
              as: NetworkAffiliateRelations
              captures: { st_id: $.data.id }
            - call: "POST /networks/${net_id}/territories"
              payload: { dma_code: "DMA-001", protection_window_start_utc: "2026-05-01T00:00:00Z", protection_window_end_utc: "2026-05-02T00:00:00Z" }
              as: NetworkAffiliateRelations
            - call: "POST /networks/${net_id}/stations/${st_id}/agreements"
              payload: { term_start_utc: "2026-01-01T00:00:00Z", term_end_utc: "2027-01-01T00:00:00Z", reverse_comp_pct: 0.40, retrans_share_pct: 0.60, clearance_obligation_hours: 103 }
              as: NetworkAffiliateRelations
              captures: { ag_id: $.data.id }
            - call: "POST /networks/${net_id}/stations/${st_id}/agreements/${ag_id}/submit"
              payload: {}
              as: NetworkAffiliateRelations
            - call: "POST /networks/${net_id}/stations/${st_id}/agreements/${ag_id}/activate"
              payload: {}
              as: NetworkAffiliateRelations
            - call: "POST /networks/${net_id}/stations/${st_id}/clearance-reports"
              payload: { period_index: 0, cleared_hours: 87.345, preempted_hours: 15.655 }
              as: StationGroupOwner
              as_user_id: "${sg_id}"
              captures: { cr_id: $.data.id }
          trigger:
            - call: "POST /networks/${net_id}/stations/${st_id}/clearance-reports/${cr_id}/file"
              payload: {}
              as: StationGroupOwner
              as_user_id: "${sg_id}"
              captures: { rate: $.data.clearance_rate }
          assert:
            - "rate == 0.8480  # 87.345/103 = 0.848010... -> round_half_up to 4 decimals = 0.8480 (divide-then-round)"
            - "If implementation pre-rounds inputs (e.g., round(87.345)=87 then 87/103=0.8447), the value differs at the 4th decimal — test distinguishes the two orderings"

  # ==========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # ==========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: preemption_counter_cycle
        grounds:
          - state_machines.PreemptionRequest.SUBMITTED_to_UNDER_REVIEW
          - state_machines.PreemptionRequest.UNDER_REVIEW_to_COUNTERED
          - state_machines.PreemptionRequest.COUNTERED_to_SUBMITTED
          - entities.PreemptionRequest.fields.counter_round_count
        distinguishing_aspect: |
          Cyclic shape on PreemptionRequest: SUBMITTED -> UNDER_REVIEW ->
          COUNTERED -> SUBMITTED loops up to 3 times before
          ERR_COUNTER_ROUND_EXHAUSTED terminates the cycle. Counter-window
          semantics evolve per round (requested window mutates to counter window).
        test_recipe:
          setup:
            - "Network, Station, Territory, Agreement ACTIVE clearance_obligation_hours=100"
            - "Program P1 (syndicated) 2026-06-01 20:00-22:00 UTC"
            - "PreemptionRequest PR1 for 2026-06-01 20:00-22:00"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /networks"
              payload: { call_sign: "PBN", primary_feed_tz: "America/New_York", reverse_comp_standard_pct: 0.40, retrans_share_standard_pct: 0.60 }
              as: PlatformAdmin
              captures: { net_id: $.data.id }
            - call: "POST /station-groups"
              payload: { group_name: "M", leverage_tier: "MID" }
              as: PlatformAdmin
              captures: { sg_id: $.data.id }
            - call: "POST /networks/${net_id}/stations"
              payload: { call_sign: "KPBN", dma_code: "DMA-001", station_group_id: "${sg_id}" }
              as: NetworkAffiliateRelations
              captures: { st_id: $.data.id }
            - call: "POST /networks/${net_id}/territories"
              payload: { dma_code: "DMA-001", protection_window_start_utc: "2026-05-01T00:00:00Z", protection_window_end_utc: "2026-06-30T00:00:00Z" }
              as: NetworkAffiliateRelations
            - call: "POST /networks/${net_id}/programs"
              payload: { title: "Late Show", scheduled_start_utc: "2026-06-01T20:00:00Z", scheduled_end_utc: "2026-06-01T22:00:00Z", avail_minutes_total: 30, avail_minutes_local_allocatable: 10, is_syndicated: true }
              as: NetworkAffiliateRelations
              captures: { prog_id: $.data.id }
            - call: "POST /networks/${net_id}/stations/${st_id}/agreements"
              payload: { term_start_utc: "2026-01-01T00:00:00Z", term_end_utc: "2027-01-01T00:00:00Z", reverse_comp_pct: 0.40, retrans_share_pct: 0.60, clearance_obligation_hours: 100 }
              as: NetworkAffiliateRelations
              captures: { ag_id: $.data.id }
            - call: "POST /networks/${net_id}/stations/${st_id}/agreements/${ag_id}/submit"
              payload: {}
              as: NetworkAffiliateRelations
            - call: "POST /networks/${net_id}/stations/${st_id}/agreements/${ag_id}/activate"
              payload: {}
              as: NetworkAffiliateRelations
            - call: "POST /networks/${net_id}/stations/${st_id}/preemptions"
              payload: { program_id: "${prog_id}", agreement_id: "${ag_id}", requested_start_utc: "2026-06-01T20:00:00Z", requested_end_utc: "2026-06-01T22:00:00Z", reason: "BREAKING_NEWS" }
              as: StationGroupOwner
              as_user_id: "${sg_id}"
              captures: { pr_id: $.data.id }
          trigger:
            - call: "POST /networks/${net_id}/stations/${st_id}/preemptions/${pr_id}/begin-review"
              payload: {}
              as: NetworkAffiliateRelations
            - call: "POST /networks/${net_id}/stations/${st_id}/preemptions/${pr_id}/counter"
              payload: { counter_start_utc: "2026-06-01T21:00:00Z", counter_end_utc: "2026-06-01T22:00:00Z" }
              as: NetworkAffiliateRelations
            - call: "POST /networks/${net_id}/stations/${st_id}/preemptions/${pr_id}/resubmit"
              payload: {}
              as: StationGroupOwner
              as_user_id: "${sg_id}"
              captures: { round_after_1: $.data.counter_round_count }
            - call: "POST /networks/${net_id}/stations/${st_id}/preemptions/${pr_id}/begin-review"
              payload: {}
              as: NetworkAffiliateRelations
            - call: "POST /networks/${net_id}/stations/${st_id}/preemptions/${pr_id}/counter"
              payload: { counter_start_utc: "2026-06-01T21:30:00Z", counter_end_utc: "2026-06-01T22:00:00Z" }
              as: NetworkAffiliateRelations
            - call: "POST /networks/${net_id}/stations/${st_id}/preemptions/${pr_id}/resubmit"
              payload: {}
              as: StationGroupOwner
              as_user_id: "${sg_id}"
              captures: { round_after_2: $.data.counter_round_count }
            - call: "POST /networks/${net_id}/stations/${st_id}/preemptions/${pr_id}/begin-review"
              payload: {}
              as: NetworkAffiliateRelations
            - call: "POST /networks/${net_id}/stations/${st_id}/preemptions/${pr_id}/counter"
              payload: { counter_start_utc: "2026-06-01T21:45:00Z", counter_end_utc: "2026-06-01T22:00:00Z" }
              as: NetworkAffiliateRelations
            - call: "POST /networks/${net_id}/stations/${st_id}/preemptions/${pr_id}/resubmit"
              payload: {}
              as: StationGroupOwner
              as_user_id: "${sg_id}"
              captures: { round_after_3: $.data.counter_round_count }
            - call: "POST /networks/${net_id}/stations/${st_id}/preemptions/${pr_id}/begin-review"
              payload: {}
              as: NetworkAffiliateRelations
            - call: "POST /networks/${net_id}/stations/${st_id}/preemptions/${pr_id}/counter"
              payload: { counter_start_utc: "2026-06-01T21:50:00Z", counter_end_utc: "2026-06-01T22:00:00Z" }
              as: NetworkAffiliateRelations
            - call: "POST /networks/${net_id}/stations/${st_id}/preemptions/${pr_id}/resubmit"
              payload: {}
              as: StationGroupOwner
              as_user_id: "${sg_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "round_after_1 == 1"
            - "round_after_2 == 2"
            - "round_after_3 == 3"
            - "err_id == ERR_COUNTER_ROUND_EXHAUSTED"
            - "requested_start_utc == counter window from prior round (window mutates each cycle)"

      - name: renewal_offer_branching_fork
        grounds:
          - state_machines.RenewalOffer.PROPOSED_to_ACCEPTED
          - state_machines.RenewalOffer.PROPOSED_to_REJECTED
          - state_machines.RenewalOffer.PROPOSED_to_WITHDRAWN
          - state_machines.RenewalOffer.PROPOSED_to_COUNTERED
        distinguishing_aspect: |
          Branching fork on RenewalOffer (different entity from PreemptionRequest):
          from PROPOSED, the offer can diverge to one of four successor states
          (ACCEPTED, REJECTED, WITHDRAWN, COUNTERED) with divergent side-effect
          sets per branch (ACCEPTED mutates agreement; COUNTERED supersedes prior
          offer; WITHDRAWN requires proposer). Test drives two branches on two
          distinct offers to show divergent downstream effects.
        test_recipe:
          setup:
            - "Network, StationGroup (MAJOR), Station, Territory, Agreement A1 ACTIVE with term_end_utc = 2026-12-31T00:00:00Z (within 180 days of clock)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /networks"
