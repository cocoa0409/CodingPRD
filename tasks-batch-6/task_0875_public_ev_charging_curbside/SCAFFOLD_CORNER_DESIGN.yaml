# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe over §1.1–§1.7. Same setup_api_calls / lint gates as §1.8.
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: create_host_site_returns_201_with_computed_defaults
        claim_type: Creation
        grounds: [entities.HostSite.fields.lifetime_gross_revenue_cents, entities.HostSite.fields.station_count]
        distinguishing_aspect: "POST /host-sites with required fields → 201; lifetime_gross_revenue_cents==0 and station_count==0 on creation."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /host-sites", payload: { name: "Curb Z", address: "99 Main", state_code: "CA", revenue_share_pct: 0.15 }, as: ProgramAdmin, captures: { site_id: "$.data.id" } }
          assert:
            - "HostSite.${site_id}.lifetime_gross_revenue_cents == 0"
            - "HostSite.${site_id}.station_count == 0"

      - name: get_station_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Station, "errors[ERR_STATION_NOT_FOUND]"]
        distinguishing_aspect: "GET /stations/{unknown-uuid} → ERR_STATION_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "GET /stations/00000000-0000-4000-8000-000000000000", payload: {}, as: ProgramAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "response http_status == 404"
            - "response data.error_id == ERR_STATION_NOT_FOUND"

      - name: create_station_missing_required_name_returns_validation
        claim_type: Required Fields
        grounds: [entities.Station.fields.name, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /stations without required name → ERR_VALIDATION (400)."
        test_recipe:
          setup: ["A site exists."]
          setup_api_calls:
            - { call: "POST /host-sites", payload: { name: "Curb Y", address: "98 Main", state_code: "CA", revenue_share_pct: 0.15 }, as: ProgramAdmin, captures: { site_id: "$.data.id" } }
          trigger:
            - { call: "POST /stations", payload: { site_id: "${site_id}" }, as: ProgramAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "response http_status == 400"
            - "response data.error_id == ERR_VALIDATION"

      - name: host_site_station_count_reconciles_after_two_stations
        claim_type: Computed Fields
        grounds: [entities.HostSite.fields.station_count, calculations.available_ports]
        distinguishing_aspect: "station_count is a derived count of Stations with site_id==this.id; equals 2 after creating two stations."
        test_recipe:
          setup: ["A site with two stations."]
          setup_api_calls:
            - { call: "POST /host-sites", payload: { name: "Curb X", address: "97 Main", state_code: "CA", revenue_share_pct: 0.15 }, as: ProgramAdmin, captures: { site_id: "$.data.id" } }
            - { call: "POST /stations", payload: { site_id: "${site_id}", name: "S1" }, as: ProgramAdmin }
            - { call: "POST /stations", payload: { site_id: "${site_id}", name: "S2" }, as: ProgramAdmin }
          trigger:
            - { call: "GET /host-sites/${site_id}", payload: {}, as: ProgramAdmin }
          assert:
            - "HostSite.${site_id}.station_count == 2"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: finalize_active_session_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.ChargingSession.STOPPED_to_FINALIZED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Finalize requires STOPPED; finalizing an ACTIVE session → ERR_INVALID_STATE (409); no ledger change."
        test_recipe:
          setup: ["Site; station; port; an ACTIVE session (not yet stopped)."]
          setup_api_calls:
            - { call: "POST /host-sites", payload: { name: "Curb W", address: "96 Main", state_code: "CA", revenue_share_pct: 0.15 }, as: ProgramAdmin, captures: { site_id: "$.data.id" } }
            - { call: "POST /stations", payload: { site_id: "${site_id}", name: "S1" }, as: ProgramAdmin, captures: { stn_id: "$.data.id" } }
            - { call: "POST /ports", payload: { station_id: "${stn_id}", connector_type: "CCS2", power_kw: 100 }, as: ProgramAdmin, captures: { port_id: "$.data.id" } }
            - { call: "POST /charging-sessions", payload: { port_id: "${port_id}", driver_id: "drv-1" }, as: Driver, as_user_id: "drv-1", captures: { s_id: "$.data.id" } }
          trigger:
            - { call: "POST /charging-sessions/${s_id}/finalize", payload: {}, as: ProgramAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "response http_status == 409"
            - "response data.error_id == ERR_INVALID_STATE"

      - name: resolve_already_resolved_work_order_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds: [state_machines.WorkOrder.OPEN_to_RESOLVED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "RESOLVED is terminal; a second resolve → ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Site; station; port; a LOW work order opened then resolved."]
          setup_api_calls:
            - { call: "POST /host-sites", payload: { name: "Curb V", address: "95 Main", state_code: "CA", revenue_share_pct: 0.15 }, as: ProgramAdmin, captures: { site_id: "$.data.id" } }
            - { call: "POST /stations", payload: { site_id: "${site_id}", name: "S1" }, as: ProgramAdmin, captures: { stn_id: "$.data.id" } }
            - { call: "POST /ports", payload: { station_id: "${stn_id}", connector_type: "CCS2", power_kw: 100 }, as: ProgramAdmin, captures: { port_id: "$.data.id" } }
            - { call: "POST /work-orders", payload: { port_id: "${port_id}", severity: "LOW", description: "cosmetic" }, as: FieldTechnician, captures: { wo_id: "$.data.id" } }
            - { call: "POST /work-orders/${wo_id}/resolve", payload: {}, as: FieldTechnician }
          trigger:
            - { call: "POST /work-orders/${wo_id}/resolve", payload: {}, as: FieldTechnician, captures: { err: "$.data.error_id" } }
          assert:
            - "response http_status == 409"
            - "response data.error_id == ERR_INVALID_STATE"

      - name: activate_already_active_agreement_returns_invalid_state
        claim_type: Idempotency
        grounds: [state_machines.HostAgreement.PROPOSED_to_ACTIVE, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "There is no ACTIVE→ACTIVE edge; a second activate → ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Site; agreement proposed then activated."]
          setup_api_calls:
            - { call: "POST /host-sites", payload: { name: "Curb U", address: "94 Main", state_code: "CA", revenue_share_pct: 0.15 }, as: ProgramAdmin, captures: { site_id: "$.data.id" } }
            - { call: "POST /host-agreements", payload: { site_id: "${site_id}", term_start_date: "2026-05-01T00:00:00Z", term_end_date: "2027-05-01T00:00:00Z", proposed_revenue_share_pct: 0.15 }, as: ProgramAdmin, captures: { agr_id: "$.data.id" } }
            - { call: "POST /host-agreements/${agr_id}/propose", payload: {}, as: ProgramAdmin }
            - { call: "POST /host-agreements/${agr_id}/activate", payload: {}, as: ProgramAdmin }
          trigger:
            - { call: "POST /host-agreements/${agr_id}/activate", payload: {}, as: ProgramAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "response http_status == 409"
            - "response data.error_id == ERR_INVALID_STATE"

  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: work_order_sla_breached_when_resolved_after_due
        claim_type: Correct Result
        grounds: [calculations.work_order_sla, entities.WorkOrder.fields.sla_due_at, entities.WorkOrder.fields.sla_breached]
        distinguishing_aspect: "CRITICAL SLA is 4h; opened 00:00, sla_due_at 04:00, resolved 06:00 → sla_breached==true."
        test_recipe:
          setup: ["Site; station; port. CRITICAL work order opened at 00:00 and resolved at 06:00."]
          setup_api_calls:
            - { call: "POST /host-sites", payload: { name: "Curb T", address: "93 Main", state_code: "CA", revenue_share_pct: 0.15 }, as: ProgramAdmin, captures: { site_id: "$.data.id" } }
            - { call: "POST /stations", payload: { site_id: "${site_id}", name: "S1" }, as: ProgramAdmin, captures: { stn_id: "$.data.id" } }
            - { call: "POST /ports", payload: { station_id: "${stn_id}", connector_type: "CCS2", power_kw: 180 }, as: ProgramAdmin, captures: { port_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-06T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /work-orders", payload: { port_id: "${port_id}", severity: "CRITICAL", description: "fault" }, as: FieldTechnician, captures: { wo_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-06T06:00:00Z" }, as: ProgramAdmin }
          trigger:
            - { call: "POST /work-orders/${wo_id}/resolve", payload: {}, as: FieldTechnician }
          assert:
            - "WorkOrder.${wo_id}.sla_due_at == 2026-05-06T04:00:00.000Z"
            - "WorkOrder.${wo_id}.sla_breached == true"

      - name: session_final_cost_includes_idle_component
        claim_type: Reconciliation
        grounds: [calculations.session_final_cost]
        excluded_because:
          difficulty_instance: compensating_invariant / session_void_conserves_gross_revenue
          rationale: "That instance finalizes a session with idle 25 min → final_cost 1363 = 663 energy + 100 fee + 600 idle, exercising the final variant including idle."

  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: stop_session_with_zero_energy_returns_energy_invalid
        claim_type: "Violation → Error"
        grounds: ["validations[priority=10]", "errors[ERR_ENERGY_INVALID]"]
        distinguishing_aspect: "energy_kwh==0 at stop → ERR_ENERGY_INVALID (422) — zero-quantity boundary."
        test_recipe:
          setup: ["Site; station; port; an ACTIVE session."]
          setup_api_calls:
            - { call: "POST /host-sites", payload: { name: "Curb S", address: "92 Main", state_code: "CA", revenue_share_pct: 0.15 }, as: ProgramAdmin, captures: { site_id: "$.data.id" } }
            - { call: "POST /stations", payload: { site_id: "${site_id}", name: "S1" }, as: ProgramAdmin, captures: { stn_id: "$.data.id" } }
            - { call: "POST /ports", payload: { station_id: "${stn_id}", connector_type: "CCS2", power_kw: 100 }, as: ProgramAdmin, captures: { port_id: "$.data.id" } }
            - { call: "POST /charging-sessions", payload: { port_id: "${port_id}", driver_id: "drv-1" }, as: Driver, as_user_id: "drv-1", captures: { s_id: "$.data.id" } }
          trigger:
            - { call: "POST /charging-sessions/${s_id}/stop", payload: { energy_kwh: 0 }, as: Driver, as_user_id: "drv-1", captures: { err: "$.data.error_id" } }
          assert:
            - "response http_status == 422"
            - "response data.error_id == ERR_ENERGY_INVALID"

      - name: reservation_end_not_after_start_returns_invalid_window
        claim_type: "Violation → Error"
        grounds: ["validations[priority=9]", "errors[ERR_INVALID_WINDOW]"]
        distinguishing_aspect: "window_end <= window_start → ERR_INVALID_WINDOW (409)."
        test_recipe:
          setup: ["Site; station; port."]
          setup_api_calls:
            - { call: "POST /host-sites", payload: { name: "Curb AA", address: "91 Main", state_code: "CA", revenue_share_pct: 0.15 }, as: ProgramAdmin, captures: { site_id: "$.data.id" } }
            - { call: "POST /stations", payload: { site_id: "${site_id}", name: "S1" }, as: ProgramAdmin, captures: { stn_id: "$.data.id" } }
            - { call: "POST /ports", payload: { station_id: "${stn_id}", connector_type: "CCS2", power_kw: 100 }, as: ProgramAdmin, captures: { port_id: "$.data.id" } }
          trigger:
            - { call: "POST /reservations", payload: { port_id: "${port_id}", driver_id: "drv-1", window_start: "2026-05-04T11:00:00Z", window_end: "2026-05-04T10:00:00Z" }, as: Driver, as_user_id: "drv-1", captures: { err: "$.data.error_id" } }
          assert:
            - "response http_status == 409"
            - "response data.error_id == ERR_INVALID_WINDOW"

      - name: rebate_claim_end_not_after_start_returns_invalid_period
        claim_type: "Violation → Error"
        grounds: ["validations[priority=9]", "errors[ERR_INVALID_PERIOD]"]
        distinguishing_aspect: "period_end <= period_start at claim create → ERR_INVALID_PERIOD (409), evaluated before the OCC check."
        test_recipe:
          setup: ["Grant; site; grant station with one 180kW ADA port; station read for its version."]
          setup_api_calls:
            - { call: "POST /grant-programs", payload: { name: "NEVI", program_code: "NEVI", min_uptime_pct: 97.0, min_ports: 1, min_power_kw: 150, reimbursement_rate_cents_per_kwh: 20, reimbursement_cap_cents: 5000000 }, as: ProgramAdmin, captures: { grant_id: "$.data.id" } }
            - { call: "POST /host-sites", payload: { name: "Curb AB", address: "90 Main", state_code: "CA", revenue_share_pct: 0.15 }, as: ProgramAdmin, captures: { site_id: "$.data.id" } }
            - { call: "POST /stations", payload: { site_id: "${site_id}", grant_id: "${grant_id}", name: "S1", ada_accessible: true }, as: ProgramAdmin, captures: { stn_id: "$.data.id" } }
            - { call: "POST /ports", payload: { station_id: "${stn_id}", connector_type: "CCS2", power_kw: 180, ada_accessible: true }, as: ProgramAdmin, captures: { port_id: "$.data.id" } }
            - { call: "GET /stations/${stn_id}", payload: {}, as: ProgramAdmin, captures: { stn_v: "$.data.version" } }
          trigger:
            - { call: "POST /rebate-claims", payload: { station_id: "${stn_id}", grant_id: "${grant_id}", period_start: "2026-06-01T00:00:00Z", period_end: "2026-05-01T00:00:00Z", reported_energy_kwh: 1000, reported_uptime_pct: 97.0, expected_station_version: "${stn_v}" }, as: ProgramAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "response http_status == 409"
            - "response data.error_id == ERR_INVALID_PERIOD"

      - name: commission_missing_ada_port_returns_ada_required
        claim_type: Conditional validation
        grounds: ["validations[priority=8]", "errors[ERR_ADA_PORT_REQUIRED]", state_machines.Station.PENDING_to_COMMISSIONED]
        distinguishing_aspect: "Grant present but no ada_accessible port; ACTIVE agreement and min_ports satisfied → ADA gate (priority 8) fires → ERR_ADA_PORT_REQUIRED (409)."
        test_recipe:
          setup: ["Grant (min_ports 1); site; ACTIVE agreement; grant station with one 180kW NON-ADA port."]
          setup_api_calls:
            - { call: "POST /grant-programs", payload: { name: "NEVI", program_code: "NEVI", min_uptime_pct: 97.0, min_ports: 1, min_power_kw: 150, reimbursement_rate_cents_per_kwh: 20, reimbursement_cap_cents: 5000000 }, as: ProgramAdmin, captures: { grant_id: "$.data.id" } }
            - { call: "POST /host-sites", payload: { name: "Curb AC", address: "89 Main", state_code: "CA", revenue_share_pct: 0.15 }, as: ProgramAdmin, captures: { site_id: "$.data.id" } }
            - { call: "POST /host-agreements", payload: { site_id: "${site_id}", term_start_date: "2026-05-01T00:00:00Z", term_end_date: "2027-05-01T00:00:00Z", proposed_revenue_share_pct: 0.15 }, as: ProgramAdmin, captures: { agr_id: "$.data.id" } }
            - { call: "POST /host-agreements/${agr_id}/propose", payload: {}, as: ProgramAdmin }
            - { call: "POST /host-agreements/${agr_id}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /stations", payload: { site_id: "${site_id}", grant_id: "${grant_id}", name: "S1" }, as: ProgramAdmin, captures: { stn_id: "$.data.id" } }
            - { call: "POST /ports", payload: { station_id: "${stn_id}", connector_type: "CCS2", power_kw: 180, ada_accessible: false }, as: ProgramAdmin, captures: { port_id: "$.data.id" } }
          trigger:
            - { call: "POST /stations/${stn_id}/commission", payload: {}, as: ProgramAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "response http_status == 409"
            - "response data.error_id == ERR_ADA_PORT_REQUIRED"

      - name: start_session_on_reserved_port_returns_not_available
        claim_type: Cross-entity validation
        grounds: ["validations[priority=10]", "errors[ERR_PORT_NOT_AVAILABLE]", state_machines.Port.AVAILABLE_to_RESERVED]
        distinguishing_aspect: "Port is IN_SERVICE but occupancy RESERVED (held by a confirmed reservation); starting a session → ERR_PORT_NOT_AVAILABLE (409)."
        test_recipe:
          setup: ["Site; station; port; a CONFIRMED reservation holding the port (occupancy RESERVED)."]
          setup_api_calls:
            - { call: "POST /host-sites", payload: { name: "Curb AD", address: "88 Main", state_code: "CA", revenue_share_pct: 0.15 }, as: ProgramAdmin, captures: { site_id: "$.data.id" } }
            - { call: "POST /stations", payload: { site_id: "${site_id}", name: "S1" }, as: ProgramAdmin, captures: { stn_id: "$.data.id" } }
            - { call: "POST /ports", payload: { station_id: "${stn_id}", connector_type: "CCS2", power_kw: 100 }, as: ProgramAdmin, captures: { port_id: "$.data.id" } }
            - { call: "POST /reservations", payload: { port_id: "${port_id}", driver_id: "drv-9", window_start: "2026-05-04T10:00:00Z", window_end: "2026-05-04T11:00:00Z" }, as: Driver, as_user_id: "drv-9", captures: { r_id: "$.data.id" } }
            - { call: "POST /reservations/${r_id}/confirm", payload: {}, as: Driver, as_user_id: "drv-9" }
          trigger:
            - { call: "POST /charging-sessions", payload: { port_id: "${port_id}", driver_id: "drv-1" }, as: Driver, as_user_id: "drv-1", captures: { err: "$.data.error_id" } }
          assert:
            - "response http_status == 409"
            - "response data.error_id == ERR_PORT_NOT_AVAILABLE"

  # ---------------------------------------------------------------------------
  - section: rbac
    instances:
      - name: driver_cannot_create_station_returns_unauthorized
        claim_type: "peer_roles"
        grounds: [roles.Driver, roles.ProgramAdmin, "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "POST /stations is ProgramAdmin-exclusive; a Driver → ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["A site exists."]
          setup_api_calls:
            - { call: "POST /host-sites", payload: { name: "Curb AE", address: "87 Main", state_code: "CA", revenue_share_pct: 0.15 }, as: ProgramAdmin, captures: { site_id: "$.data.id" } }
          trigger:
            - { call: "POST /stations", payload: { site_id: "${site_id}", name: "S1" }, as: Driver, as_user_id: "drv-1", captures: { err: "$.data.error_id" } }
          assert:
            - "response http_status == 403"
            - "response data.error_id == ERR_UNAUTHORIZED"

      - name: host_operator_cannot_counter_other_sites_agreement_returns_not_owner
        claim_type: "peer_roles"
        grounds: [roles.HostOperator, "errors[ERR_NOT_RESOURCE_OWNER]", state_machines.HostAgreement.PROPOSED_to_COUNTERED]
        distinguishing_aspect: "HostOperator whose X-User-ID != agreement.site_id counters → ERR_NOT_RESOURCE_OWNER (403)."
        test_recipe:
          setup: ["Site A with a PROPOSED agreement; site B (a foreign operator identity)."]
          setup_api_calls:
            - { call: "POST /host-sites", payload: { name: "Site A", address: "1 A", state_code: "CA", revenue_share_pct: 0.15 }, as: ProgramAdmin, captures: { site_a: "$.data.id" } }
            - { call: "POST /host-sites", payload: { name: "Site B", address: "1 B", state_code: "CA", revenue_share_pct: 0.15 }, as: ProgramAdmin, captures: { site_b: "$.data.id" } }
            - { call: "POST /host-agreements", payload: { site_id: "${site_a}", term_start_date: "2026-05-01T00:00:00Z", term_end_date: "2027-05-01T00:00:00Z", proposed_revenue_share_pct: 0.15 }, as: ProgramAdmin, captures: { agr_id: "$.data.id" } }
            - { call: "POST /host-agreements/${agr_id}/propose", payload: {}, as: ProgramAdmin }
          trigger:
            - { call: "POST /host-agreements/${agr_id}/counter", payload: { counter_revenue_share_pct: 0.12 }, as: HostOperator, as_user_id: "${site_b}", captures: { err: "$.data.error_id" } }
          assert:
            - "response http_status == 403"
            - "response data.error_id == ERR_NOT_RESOURCE_OWNER"

      - name: approve_rebate_by_submitter_returns_segregation_of_duties
        claim_type: "Segregation of duties"
        grounds: ["validations[priority=8]", "errors[ERR_SEGREGATION_OF_DUTIES]", state_machines.RebateClaim.AUDITED_to_APPROVED]
        distinguishing_aspect: "Approver X-User-ID equals submitted_by_user_id (admin-1) → ERR_SEGREGATION_OF_DUTIES (409); a different admin would succeed."
        test_recipe:
          setup: ["Grant; site; ACTIVE agreement; grant station with 180kW ADA port; COMMISSIONED; claim submitted by admin-1 then audited (no downtime → COMPLIANT)."]
          setup_api_calls:
            - { call: "POST /grant-programs", payload: { name: "NEVI", program_code: "NEVI", min_uptime_pct: 97.0, min_ports: 1, min_power_kw: 150, reimbursement_rate_cents_per_kwh: 20, reimbursement_cap_cents: 5000000 }, as: ProgramAdmin, captures: { grant_id: "$.data.id" } }
            - { call: "POST /host-sites", payload: { name: "Curb AF", address: "86 Main", state_code: "CA", revenue_share_pct: 0.15 }, as: ProgramAdmin, captures: { site_id: "$.data.id" } }
            - { call: "POST /host-agreements", payload: { site_id: "${site_id}", term_start_date: "2026-05-01T00:00:00Z", term_end_date: "2027-05-01T00:00:00Z", proposed_revenue_share_pct: 0.15 }, as: ProgramAdmin, captures: { agr_id: "$.data.id" } }
            - { call: "POST /host-agreements/${agr_id}/propose", payload: {}, as: ProgramAdmin }
            - { call: "POST /host-agreements/${agr_id}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /stations", payload: { site_id: "${site_id}", grant_id: "${grant_id}", name: "S1", ada_accessible: true }, as: ProgramAdmin, captures: { stn_id: "$.data.id" } }
            - { call: "POST /ports", payload: { station_id: "${stn_id}", connector_type: "CCS2", power_kw: 180, ada_accessible: true }, as: ProgramAdmin, captures: { port_id: "$.data.id" } }
            - { call: "POST /stations/${stn_id}/commission", payload: {}, as: ProgramAdmin }
            - { call: "GET /stations/${stn_id}", payload: {}, as: ProgramAdmin, captures: { stn_v: "$.data.version" } }
            - { call: "POST /rebate-claims", payload: { station_id: "${stn_id}", grant_id: "${grant_id}", period_start: "2026-05-01T00:00:00Z", period_end: "2026-06-01T00:00:00Z", reported_energy_kwh: 1000, reported_uptime_pct: 97.0, expected_station_version: "${stn_v}" }, as: ProgramAdmin, captures: { claim_id: "$.data.id" } }
            - { call: "POST /rebate-claims/${claim_id}/submit", payload: {}, as: ProgramAdmin, as_user_id: "admin-1" }
            - { call: "POST /rebate-claims/${claim_id}/audit", payload: {}, as: ProgramAdmin, as_user_id: "admin-1" }
          trigger:
            - { call: "POST /rebate-claims/${claim_id}/approve", payload: {}, as: ProgramAdmin, as_user_id: "admin-1", captures: { err: "$.data.error_id" } }
          assert:
            - "response http_status == 409"
            - "response data.error_id == ERR_SEGREGATION_OF_DUTIES"

