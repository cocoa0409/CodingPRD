              as: Producer
              captures: { it_id: $.data.id }
            - call: "POST /studio/shoot-sessions"
              payload: { station_id: "${st_id}", provider_id: "${pr_id}", scheduled_start: "2026-08-03T09:00:00Z", scheduled_end: "2026-08-03T13:00:00Z", required_usage_scope: "ECOM_ONLY", budget_cap_cents: 500000 }
              as: Producer
              captures: { ses_id: $.data.id, ses_v1: $.data.version }
            - call: "POST /studio/shot-list-items/${it_id}/assign"
              payload: { session_id: "${ses_id}" }
              as: Producer
            - call: "POST /studio/talent-bookings"
              payload: { session_id: "${ses_id}", talent_id: "${ph_id}", role_on_set: "PHOTOGRAPHER", call_time: "2026-08-03T09:00:00Z", wrap_time: "2026-08-03T13:00:00Z", expected_session_version: "${ses_v1}" }
              as: Producer
              captures: { bk_id: $.data.id }
          trigger:
            - call: "POST /studio/shoot-sessions/${ses_id}/cancel"
              payload: { reason: "sample never arrived" }
              as: Producer
            - call: "GET /studio/shot-list-items/${it_id}"
              as: Producer
            - call: "GET /studio/talent-bookings/${bk_id}"
              as: Producer
          assert:
            - "first call: status == 200 and the response body already shows session_state == \"CANCELLED\""
            - "second call: item_state == \"PLANNED\" and session_id == null on the first read"
            - "third call: booking_state == \"CANCELLED\" and charge_cents == 0 on the first read"
            - "Station.${st_id}.committed_minutes_today == 0 - the 240 minutes were returned by the same request"
            - "TalentProfile.${ph_id}.booked_minutes_today == 0 - the held booking's minutes were returned too"
