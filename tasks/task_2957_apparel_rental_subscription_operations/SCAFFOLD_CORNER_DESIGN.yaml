          difficulty_instance: boundary_precision_check / required_depth_ceil_at_exact_planning_month_multiple
          rationale: >-
            The ceil boundary at committed_days exactly 60 versus 61 is the whole subject of the named §1.8
            instance, which pins required_depth_units 2 and then 3 on the same style.
      - name: calc_unit_economics_variant_divergence
