  - section: errors
    instances:
      - name: unauthenticated_missing_role_header_returns_401
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A write call carrying no valid X-User-Role header is rejected with 401 ERR_UNAUTHENTICATED before any role check runs."
        test_recipe:
          setup:
            - "empty database; request is sent with no X-User-Role header (as: Anonymous documents the absent header)"
          setup_api_calls: []
          trigger:
            - call: "POST /api/strains"
              payload: { strain_code: "C57BL6J", species: "MOUSE", immune_class: "IMMUNOCOMPETENT", breeding_type: "INBRED", min_barrier_level: "MPF", gestation_days: 21, wean_age_days: 21, typical_litter_size: 6, base_price_cents: 1000 }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHENTICATED"
            - "HTTP status == 401"

  - section: rbac
    instances:
      - name: customer_cannot_create_strain
        claim_type: rbac_denial
        grounds: [roles.PlatformAdmin, "endpoints.POST /api/strains", "errors[ERR_UNAUTHORIZED_ROLE]"]
        distinguishing_aspect: "Strain registration is PlatformAdmin-exclusive; the Customer role is rejected with 403 ERR_UNAUTHORIZED_ROLE."
        test_recipe:
          setup:
            - "one customer"
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { institution_name: "Inst A", account_number: "ACCT-1", credit_limit_cents: 100000, accepted_min_health_status: "MPF", is_commercial: false }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /api/strains"
              payload: { strain_code: "C57BL6J", species: "MOUSE", immune_class: "IMMUNOCOMPETENT", breeding_type: "INBRED", min_barrier_level: "MPF", gestation_days: 21, wean_age_days: 21, typical_litter_size: 6, base_price_cents: 1000 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHORIZED_ROLE"
            - "HTTP status == 403"

      - name: protocol_segregation_of_duties
        claim_type: segregation_of_duties
        grounds: [roles.IACUCReviewer, "errors[ERR_SEGREGATION_OF_DUTIES]", "state_machines.IACUCProtocol.UNDER_REVIEW_to_APPROVED"]
        distinguishing_aspect: "The same opaque user id that submitted a protocol (as FacilityManager) may not approve it (as IACUCReviewer): ERR_SEGREGATION_OF_DUTIES; a different reviewer approves fine."
        test_recipe:
          setup:
            - "protocol submitted by user shared_1 and now UNDER_REVIEW"
          setup_api_calls:
            - call: "POST /api/facilities"
              payload: { name: "Site Alpha", site_code: "SA", registration_number: "REG-001", registration_expires_at: "2027-09-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /api/protocols"
              payload: { facility_id: "${fac_id}", protocol_number: "P-100", pi_name: "Dr. Xu", species: "MOUSE", approved_animal_quota: 100, effective_date: "2026-09-01T00:00:00Z", expiration_date: "2029-09-01T00:00:00Z" }
              as: FacilityManager
              as_user_id: "shared_1"
              captures: { prot_id: $.data.id }
            - call: "POST /api/protocols/${prot_id}/transition"
              payload: { target_state: "SUBMITTED" }
              as: FacilityManager
              as_user_id: "shared_1"
            - call: "POST /api/protocols/${prot_id}/transition"
              payload: { target_state: "UNDER_REVIEW" }
              as: IACUCReviewer
              as_user_id: "rev_1"
          trigger:
            - call: "POST /api/protocols/${prot_id}/transition"
              payload: { target_state: "APPROVED" }
              as: IACUCReviewer
              as_user_id: "shared_1"
              captures: { err: $.data.error_id }
            - call: "POST /api/protocols/${prot_id}/transition"
              payload: { target_state: "APPROVED" }
              as: IACUCReviewer
              as_user_id: "rev_2"
              captures: { final_state: $.data.status }
          assert:
            - "error_id == ERR_SEGREGATION_OF_DUTIES  (submitter shared_1 cannot approve)"
            - "HTTP status == 403"
            - "final_state == APPROVED  (independent reviewer rev_2 succeeds)"

      - name: inspection_verify_segregation_of_duties
        claim_type: segregation_of_duties
        grounds: [roles.WelfareInspector, "errors[ERR_SEGREGATION_OF_DUTIES]", "state_machines.WelfareInspection.CORRECTIVE_ACTION_to_CLOSED_VERIFIED"]
        distinguishing_aspect: "The inspector who filed a report (insp_1) cannot verify its corrective closure; a second inspector (insp_2) can."
        test_recipe:
          setup:
            - "facility inspection in CORRECTIVE_ACTION, reported by insp_1 with one MINOR finding"
          setup_api_calls:
            - call: "POST /api/facilities"
              payload: { name: "Site Alpha", site_code: "SA", registration_number: "REG-001", registration_expires_at: "2027-09-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /api/inspections"
              payload: { facility_id: "${fac_id}", inspection_type: "ROUTINE", scheduled_date: "2026-09-05T00:00:00Z" }
              as: WelfareInspector
              as_user_id: "insp_1"
              captures: { insp_id: $.data.id }
            - call: "POST /api/inspections/${insp_id}/report"
              payload: { findings: [ { deficiency: "recordkeeping gap", severity: "MINOR" } ], corrective_deadline: "2026-09-20T00:00:00Z" }
              as: WelfareInspector
              as_user_id: "insp_1"
          trigger:
            - call: "POST /api/inspections/${insp_id}/verify"
              payload: { outcome: "VERIFIED_OK" }
              as: WelfareInspector
              as_user_id: "insp_1"
              captures: { err: $.data.error_id }
            - call: "POST /api/inspections/${insp_id}/verify"
              payload: { outcome: "VERIFIED_OK" }
              as: WelfareInspector
              as_user_id: "insp_2"
              captures: { final_state: $.data.status }
          assert:
            - "error_id == ERR_SEGREGATION_OF_DUTIES  (reporter cannot verify own report)"
            - "HTTP status == 403"
            - "final_state == CLOSED_VERIFIED"

      - name: customer_cannot_read_other_customers_record
        claim_type: rbac_denial
        grounds: ["validations[priority=3]", "errors[ERR_OWNERSHIP_MISMATCH]", roles.Customer]
        distinguishing_aspect: "entity_backed identity: Customer B's X-User-ID does not match customer A's id, so reading A's record returns ERR_OWNERSHIP_MISMATCH while A reading itself succeeds."
        test_recipe:
          setup:
            - "customers A and B exist"
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { institution_name: "Inst A", account_number: "ACCT-1", credit_limit_cents: 100000, accepted_min_health_status: "MPF", is_commercial: false }
              as: PlatformAdmin
              captures: { cust_a: $.data.id }
            - call: "POST /api/customers"
              payload: { institution_name: "Inst B", account_number: "ACCT-2", credit_limit_cents: 100000, accepted_min_health_status: "MPF", is_commercial: false }
              as: PlatformAdmin
              captures: { cust_b: $.data.id }
          trigger:
            - call: "GET /api/customers/${cust_a}"
              as: Customer
              as_user_id: "${cust_b}"
              captures: { err: $.data.error_id }
            - call: "GET /api/customers/${cust_a}"
              as: Customer
              as_user_id: "${cust_a}"
              captures: { ok_name: $.data.institution_name }
          assert:
            - "error_id == ERR_OWNERSHIP_MISMATCH"
            - "HTTP status == 403"
            - "ok_name == Inst A  (self-read succeeds)"

