scenario: 'Indoor Vertical Farm Production (Bowery/AeroFarms style grower): grow recipe (light/nutrient/climate) by crop, seeding-to-harvest schedule & rack allocation, yield per tower & energy cost per
  pound, food-safety & water system sanitation, harvest/pack same-day distribution window, crop failure & replant scheduling, retail contract fill rate, labor scheduling around harvest peaks

  '
domain_name: indoor-vertical-farm
api_prefix: /farm
complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: posture_driven_gating
  complexity_layers:
  - optimistic_concurrency
  - cascading_side_effects
  - dual_variant_calculation
  - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: compound
  relationship_patterns:
  - one_to_many
  - self_referential
  - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
  entity_count: 17
  state_machine_count: 16
  calculation_count: 13
  endpoint_count: 90
  error_code_count: 50
  role_count: 7
response_envelope:
  success: "{ \"meta\": { \"api_request_id\": \"req_xxx\", \"api_request_timestamp\": \"ISO8601\" },\n  \"response_type\": \"object\" | \"array\", \"data\": {} }\n"
  error: "{ \"meta\": { ... }, \"response_type\": \"error\",\n  \"data\": { \"error_id\": \"ERR_XXX\", \"message\": \"...\" } }\n"
  pagination_fields:
  - limit
  - offset
  - total_count
  - has_more
  pagination_defaults:
    limit: 10
    min: 1
    max: 100
    offset: 0
entities:
- name: Crop
  parent: null
  common_fields: true
  fields:
  - name: crop_code
    type: string
    source: input
    description: Unique crop code; unique across all crops
  - name: display_name
    type: string
    source: input
    description: Human-readable crop name
  - name: category
    type: enum
    source: input
    description: LEAFY_GREEN | HERB | FRUITING; drives harvest productivity constant
  - name: margin_cents_per_lb
    type: integer
    source: input
    description: Contribution margin per pound; used by replant priority scoring
  - name: floor_price_cents_per_lb
    type: integer
    source: input
    description: Minimum allowed contract price per pound for this crop
  - name: crop_status
    type: enum
    source: system
    description: ACTIVE | RETIRED
    default: ACTIVE
- name: GrowRecipe
  parent: null
  common_fields: true
  fields:
  - name: crop_id
    type: string
    source: input
    description: FK -> Crop.id; the crop this recipe grows
  - name: light_hours_per_day
    type: integer
    source: input
    description: Photoperiod hours per day; drives energy projection
  - name: light_ppfd_umol
    type: integer
    source: input
    description: Light intensity PPFD
  - name: ec_target_ms
    type: number
    source: input
    description: Nutrient EC target (mS/cm)
  - name: ph_target
    type: number
    source: input
    description: Nutrient pH target
  - name: temp_day_c
    type: number
    source: input
    description: Daytime air temperature target C
  - name: temp_night_c
    type: number
    source: input
    description: Nighttime air temperature target C
  - name: humidity_pct
    type: integer
    source: input
    description: Relative humidity target percent
  - name: co2_ppm
    type: integer
    source: input
    description: CO2 enrichment target ppm
  - name: days_to_harvest
    type: integer
    source: input
    description: Days from seeding to projected harvest
  - name: expected_yield_lb_per_tower
    type: number
    description: Expected pounds per tower at full germination; 2dp
    source: input
  - name: recipe_status
    type: enum
    source: system
    description: DRAFT | ACTIVE | RETIRED; at most one ACTIVE per crop
    default: DRAFT
- name: WaterLoop
  parent: null
  common_fields: true
  fields:
  - name: loop_code
    type: string
    source: input
    description: Unique water loop code
  - name: posture
    type: enum
    source: computed
    description: IN_SERVICE | SANITATION_DUE | SANITATION_IN_PROGRESS | SANITATION_HOLD; derived per water_loop_posture calculation
  - name: last_passed_at
    type: datetime
    source: system
    description: completed_at of the most recent PASSED SanitationCycle; null if none
  - name: next_sanitation_due_at
    type: datetime
    source: computed
    description: last_passed_at + SANITATION_INTERVAL_HOURS; null until first PASS
- name: Rack
  parent: null
  common_fields: true
  fields:
  - name: rack_code
    type: string
    source: input
    description: Unique rack code
  - name: water_loop_id
    type: string
    source: input
    description: FK -> WaterLoop.id; loop irrigating this rack
  - name: zone
    type: string
    source: input
    description: Climate zone label, e.g. Z1
  - name: tower_count
    type: integer
    source: input
    description: Number of towers; rack creation auto-creates this many Tower rows (tower_index 1..tower_count)
  - name: occupied_towers
    type: integer
    source: computed
    description: Count of ACTIVE TowerAllocations on this rack's towers
    default: 0
  - name: rack_posture
    type: enum
    source: system
    description: OPERATING | SANITATION_HOLD | OUT_OF_SERVICE
    default: OPERATING
- name: Tower
  parent: null
  common_fields: true
  fields:
  - name: rack_id
    type: string
    source: input
    description: FK -> Rack.id; owning rack
  - name: tower_index
    type: integer
    source: system
    description: Position within rack, 1..tower_count; allocation order tie-break within a rack
  - name: tower_status
    type: enum
    source: computed
    description: 'IDLE | ALLOCATED; clock-dependent: ALLOCATED iff an ACTIVE TowerAllocation on this tower has occupied_from_at <= logical clock < occupied_to_at; future-dated allocations leave the tower
      IDLE but still block overlapping requests'
    default: IDLE
- name: GrowBatch
  parent: null
  common_fields: true
  fields:
  - name: crop_id
    type: string
    source: input
    description: FK -> Crop.id; crop being grown
  - name: recipe_id
    type: string
    source: system
    description: FK -> GrowRecipe.id; the crop's ACTIVE recipe pinned at batch creation (version-pinning)
  - name: origin_replant_request_id
    type: string
    source: system
    description: FK -> ReplantRequest.id; set when the batch was created by replant approval; null otherwise
  - name: production_status
    type: enum
    source: system
    description: PLANNED | SEEDED | GROWING | AT_RISK | HARVEST_READY | HARVESTED | PACKED | FAILED | CULLED
    default: PLANNED
  - name: safety_status
    type: enum
    source: system
    description: PENDING | RELEASED | CONDEMNED | QUARANTINED; parallel dimension, evolves independently of production_status
    default: PENDING
  - name: seeded_at
    type: datetime
    source: system
    description: Logical clock time at seed transition; null until seeded
  - name: germination_rate_pct
    type: number
    source: input
    description: Observed germination percent recorded at germination check; null until checked
  - name: yield_factor
    type: number
    source: computed
    description: Tiered factor from germination rate per yield_projection calculation; 1.00 before check
    default: 1.0
  - name: replant_recommended
    type: boolean
    source: computed
    description: true when germination_rate_pct < GERMINATION_REPLANT_THRESHOLD
    default: false
  - name: stress_extension_days
    type: integer
    source: computed
    description: Cumulative +1 day per report-stress event, capped at STRESS_EXTENSION_CAP
    default: 0
  - name: projected_harvest_at
    type: datetime
    source: computed
    description: seeded_at + recipe.days_to_harvest days + stress_extension_days; null until seeded
  - name: projected_yield_lb
    type: number
    source: computed
    description: tower count x pinned recipe.expected_yield_lb_per_tower x yield_factor; 2dp round_half_up
  - name: harvested_at
    type: datetime
    source: system
    description: Clock time at harvest; null until harvested
  - name: harvested_by_user_id
    type: string
    source: system
    description: X-User-ID of the Grower who harvested; drives segregation-of-duties on safety-release
  - name: grade_a_lb
    type: number
    source: input
    description: Grade A pounds harvested; 2dp; null until harvest
  - name: grade_b_lb
    type: number
    source: input
    description: Grade B pounds harvested; 2dp; null until harvest
  - name: cull_lb
    type: number
    source: input
    description: Culled pounds at harvest; 2dp; null until harvest
  - name: harvested_total_lb
    type: number
    source: computed
    description: grade_a_lb + grade_b_lb (cull excluded); 2dp
  - name: packed_available_lb
    type: number
    source: computed
    description: Pounds available to reserve = packed_lb - (Σ reserved_lb of RESERVED lines) - (Σ packed_lb of lines in {PACKED, SHORTED, SHIPPED}); 2dp; 0 until pack
  - name: packed_lb
    type: number
    source: computed
    description: Pounds packed at pack transition; 2dp
    default: 0
  - name: reserved_lb
    type: number
    source: computed
    description: Σ reserved_lb of ShipmentLines in RESERVED status on this batch; 2dp
    default: 0
  - name: actual_cost_per_pound_cents
    type: number
    source: computed
    description: ACTUAL variant of energy_cost_per_pound; null until a covering EnergyMeterReading exists
- name: TowerAllocation
  parent: null
  common_fields: true
  fields:
  - name: batch_id
    type: string
    source: system
    description: FK -> GrowBatch.id; occupying batch
  - name: tower_id
    type: string
    source: system
    description: FK -> Tower.id; occupied tower
  - name: occupied_from_at
    type: datetime
    source: system
    description: Interval start (inclusive) = batch seeded_at at seed, or batch creation time for PLANNED reservations; half-open interval [from, to)
  - name: occupied_to_at
    type: datetime
    source: system
    description: Interval end (exclusive) = projected_harvest_at; moves when stress extends the projection
  - name: allocation_status
    type: enum
    source: system
    description: ACTIVE | RELEASED
    default: ACTIVE
- name: SanitationCycle
  parent: null
  common_fields: true
  fields:
  - name: water_loop_id
    type: string
    source: input
    description: FK -> WaterLoop.id; loop being sanitized
  - name: parent_cycle_id
    type: string
    source: input
    description: FK -> SanitationCycle.id; set when this cycle is a retest of a FAILED cycle; null otherwise
  - name: scheduled_start_at
    type: datetime
    source: input
    description: Planned window start (closed interval start)
  - name: scheduled_end_at
    type: datetime
    source: input
    description: Planned window end (closed interval end); duration must be within [MIN_CYCLE_HOURS, MAX_CYCLE_HOURS]
  - name: started_at
    type: datetime
    source: system
    description: Clock time at start; null until started
  - name: completed_at
    type: datetime
    source: system
    description: Clock time at record-result; null until result recorded
  - name: result
    type: enum
    source: input
    description: PASSED | FAILED; null until recorded
  - name: coliform_cfu
    type: integer
    source: input
    description: Lab coliform count recorded with the result
  - name: result_recorded_by
    type: string
    source: system
    description: X-User-ID who recorded the result; retest cycles reject the same user (segregation of duties)
  - name: cycle_status
    type: enum
    source: system
    description: SCHEDULED | IN_PROGRESS | PASSED | FAILED | CANCELED
    default: SCHEDULED
- name: RetailContract
  parent: null
  common_fields: true
  fields:
  - name: retailer_name
    type: string
    source: input
    description: Retail customer name
  - name: crop_id
    type: string
    source: input
    description: FK -> Crop.id; contracted crop
  - name: weekly_commitment_lb
    type: integer
    source: input
    description: Committed pounds per week
  - name: price_per_pound_cents
    type: integer
    source: input
    description: Contract price per pound; must be >= crop.floor_price_cents_per_lb
  - name: penalty_cents_per_short_lb
    type: integer
    source: input
    description: Penalty per short pound when final fill rate is strictly below fill_rate_threshold
  - name: fill_rate_threshold
    type: number
    source: input
    description: Fill-rate threshold, 4dp (e.g. 0.9800); penalty triggers when final fill rate is STRICTLY below this
  - name: week_start_day
    type: enum
    source: input
    description: MONDAY | TUESDAY | ... | SUNDAY; weeks are [week_start, +7 days) aligned to this weekday on/after start_date
  - name: start_date
    type: string
    source: input
    description: Contract first day (ISO date); first settlement week starts on the first week_start_day on/after start_date
  - name: end_date
    type: string
    source: input
    description: Contract last day (ISO date); must be > start_date
  - name: contract_status
    type: enum
    source: system
    description: ACTIVE | SUSPENDED | TERMINATED | COMPLETED
    default: ACTIVE
  - name: next_unsettled_week_start
    type: string
    source: computed
    description: ISO date of the earliest week not yet settled; settle-week must target exactly this week
  - name: consecutive_short_weeks
    type: integer
    source: computed
    description: Count of consecutive settled weeks with fill rate strictly below threshold, ending at the most recent settled week; drives penalty escalation
    default: 0
  - name: week_reserved_lb
    type: number
    source: computed
    description: Σ reserved_lb of this contract's shipments with status in {RESERVED, PACKED} whose ship_date falls in the week containing the current clock date; 2dp
    default: 0
- name: Shipment
  parent: null
  common_fields: true
  fields:
  - name: contract_id
    type: string
    source: input
    description: FK -> RetailContract.id; contract being fulfilled
  - name: ship_date
    type: string
    source: input
    description: ISO date the shipment goes out; must equal the harvest UTC date of every line's batch (same-day rule)
  - name: window_start_at
    type: datetime
    source: input
    description: Dock window start; ship allowed at/after this instant
  - name: window_end_at
    type: datetime
    source: input
    description: Dock window end; ship allowed at exactly this instant (inclusive), rejected after
  - name: shipment_status
    type: enum
    source: system
    description: RESERVED | PACKED | SHIPPED | CANCELED | EXPIRED
    default: RESERVED
  - name: reserved_lb
    type: number
    source: computed
    description: Σ reserved_lb of lines in {RESERVED, PACKED, SHORTED} status; 2dp
  - name: packed_lb
    type: number
    source: computed
    description: Σ packed_lb across lines; 2dp
    default: 0
  - name: shipped_lb
    type: number
    source: computed
    description: Σ shipped_lb across lines; 2dp
    default: 0
  - name: has_shortage
    type: boolean
    source: computed
    description: true iff any line is SHORTED
    default: false
  - name: has_safety_block
    type: boolean
    source: computed
    description: true iff any non-RELEASED line's batch has safety_status != RELEASED; cleared when all line batches are RELEASED
    default: false
  - name: invoice_total_cents
    type: integer
    source: computed
    description: 'Per shipment_invoice_total calculation: Σ per-line rounded amounts; set at ship time'
    default: 0
- name: ShipmentLine
  parent: null
  common_fields: true
  fields:
  - name: shipment_id
    type: string
    source: system
    description: FK -> Shipment.id; owning shipment
  - name: batch_id
    type: string
    source: input
    description: FK -> GrowBatch.id; batch supplying the pounds
  - name: reserved_lb
    type: number
    source: input
    description: Pounds reserved against the batch; 2dp; must be > 0
  - name: packed_lb
    type: number
    source: input
    description: Pounds actually packed for this line at confirm-pack; 2dp
  - name: shipped_lb
    type: number
    source: computed
    description: = packed_lb when the shipment ships; 2dp
    default: 0
  - name: line_status
    type: enum
    source: system
    description: RESERVED | PACKED | SHORTED | SHIPPED | RELEASED
    default: RESERVED
- name: Worker
  parent: null
  common_fields: true
  fields:
  - name: full_name
    type: string
    source: input
    description: Worker name
  - name: certifications
    type: array
    source: input
    description: 'Array of role_type values the worker is certified for: HARVEST_CREW | PACK_CREW | SANITATION_CREW'
  - name: hourly_rate_cents
    type: integer
    source: input
    description: Regular hourly rate in cents
  - name: scheduled_hours_current_week
    type: number
    source: computed
    description: Σ hours of this worker's ShiftAssignments in {ASSIGNED, CONFIRMED} whose shift_date falls in the ISO Monday-Sunday week containing the current clock date; 2dp
    default: 0
- name: LaborShift
  parent: null
  common_fields: true
  fields:
  - name: shift_date
    type: string
    source: input
    description: ISO date of the shift
  - name: role_type
    type: enum
    source: input
    description: HARVEST_CREW | PACK_CREW | SANITATION_CREW
  - name: start_at
    type: datetime
    source: input
    description: Shift start (inclusive); must be on shift_date
  - name: end_at
    type: datetime
    source: input
    description: Shift end (exclusive); must be after start_at
  - name: headcount_required
    type: integer
    source: input
    description: Planned crew size; assignments beyond this are rejected
  - name: headcount_assigned
    type: integer
    source: computed
    description: Count of ShiftAssignments in {ASSIGNED, CONFIRMED}
    default: 0
  - name: planned_hourly_rate_cents
    type: integer
    source: input
    description: Rate used by projected_labor_cost
  - name: projected_labor_cost_cents
    type: integer
    source: computed
    description: Per harvest_labor_cost calculation; 0 for non-HARVEST_CREW shifts
    default: 0
  - name: overtime_hours
    type: number
    source: computed
    description: max(0, Σ assigned workers' weekly hours after assignment - REGULAR_HOURS_PER_WEEK); 2dp
    default: 0
  - name: shift_status
    type: enum
    source: system
    description: DRAFT | PUBLISHED | COMPLETED | CANCELED
    default: DRAFT
- name: ShiftAssignment
  parent: null
  common_fields: true
  fields:
  - name: shift_id
    type: string
    source: system
    description: FK -> LaborShift.id; the shift
  - name: worker_id
    type: string
    source: input
    description: FK -> Worker.id; assigned worker
  - name: assignment_status
    type: enum
    source: system
    description: ASSIGNED | CONFIRMED | RELEASED
    default: ASSIGNED
- name: EnergyMeterReading
  parent: null
  common_fields: false
  fields:
  - name: scope_type
    type: enum
    source: input
    description: FACILITY | ZONE; intervals are partitioned per (scope_type, zone) key
  - name: zone
    type: string
    source: input
    description: Required iff scope_type == ZONE; free-form zone label; the overlap partition key is (scope_type, zone)
  - name: period_start_at
    type: datetime
    source: input
    description: Period start (inclusive); half-open [start, end)
  - name: period_end_at
    type: datetime
    source: input
    description: Period end (exclusive); must be after start
  - name: kwh_consumed
    type: number
    source: input
    description: Metered kWh over the period; 2dp
  - name: peak_demand_kw
    type: number
    source: input
    description: Peak demand kW over the period; 2dp; drives tiered demand charge
- name: FailureReport
  parent: null
  common_fields: true
  fields:
  - name: batch_id
    type: string
    source: system
    description: FK -> GrowBatch.id; the failed batch (created by the fail transition)
  - name: cause_category
    type: enum
    source: input
    description: PATHOGEN | EQUIPMENT | NUTRIENT | CLIMATE | HUMAN_ERROR
  - name: lost_lb_estimate
    type: number
    source: input
    description: Estimated lost pounds; 2dp; defaults to the batch's projected_yield_lb at failure time
  - name: triaged_by_user_id
    type: string
    source: system
    description: X-User-ID who triaged; null until triaged
  - name: report_status
    type: enum
    source: system
    description: REPORTED | TRIAGED | REPLANT_REQUESTED | CLOSED
    default: REPORTED
- name: ReplantRequest
  parent: null
  common_fields: true
  fields:
  - name: failure_id
    type: string
    source: system
    description: FK -> FailureReport.id; originating failure
  - name: priority_score
    type: number
    source: computed
    description: Frozen at queue time per replant_priority_score calculation; never recomputed afterwards; 2dp
  - name: towers_needed
    type: integer
    source: computed
    description: Tower count of the failed batch; the selector must supply exactly this many
  - name: replant_status
    type: enum
    source: system
    description: QUEUED | CONVERTED | DROPPED
    default: QUEUED
state_machines:
- entity: Crop
  field: crop_status
  initial_state: ACTIVE
  terminal_states:
  - RETIRED
  transitions:
  - from: ACTIVE
    to: RETIRED
    trigger: POST /farm/crops/{id}/retire
    actor: FarmManager
    preconditions:
    - No GrowBatch with this crop_id in production_status in {PLANNED, SEEDED, GROWING, AT_RISK, HARVEST_READY, HARVESTED} (else ERR_CROP_IN_USE)
    - No RetailContract with this crop_id in contract_status in {ACTIVE, SUSPENDED} (else ERR_CROP_IN_USE)
    side_effects:
    - All DRAFT GrowRecipes of this crop transition to RETIRED
    - Increments Crop.version by 1
- entity: GrowRecipe
  field: recipe_status
  initial_state: DRAFT
  terminal_states:
  - RETIRED
  transitions:
  - from: DRAFT
    to: ACTIVE
    trigger: POST /farm/recipes/{id}/activate
    actor: Grower
    preconditions:
    - The recipe's Crop (GrowRecipe.crop_id -> Crop.id) has crop_status == ACTIVE
    - Request body expected_crop_version equals the Crop's current version (OCC)
    side_effects:
    - Any other GrowRecipe of the same crop currently ACTIVE transitions to RETIRED (supersede)
    - Increments the parent Crop.version by 1
  - from:
    - DRAFT
    - ACTIVE
    to: RETIRED
    trigger: POST /farm/recipes/{id}/retire or system (supersede on another activation, or crop retirement)
    actor: Grower or system
    preconditions:
    - 'Manual retire: no GrowBatch with this recipe_id in production_status in {PLANNED, SEEDED, GROWING, AT_RISK, HARVEST_READY, HARVESTED}'
    side_effects: []
- entity: WaterLoop
  field: posture
  initial_state: IN_SERVICE
  terminal_states: []
  transitions:
  - from: IN_SERVICE
    to: SANITATION_DUE
    trigger: system (clock reaches next_sanitation_due_at)
    actor: system
    preconditions: []
    side_effects: []
  - from:
    - IN_SERVICE
    - SANITATION_DUE
    to: SANITATION_IN_PROGRESS
    trigger: system (SanitationCycle on this loop transitions SCHEDULED -> IN_PROGRESS)
    actor: system
    preconditions: []
    side_effects:
    - All Racks with water_loop_id == this loop and rack_posture == OPERATING transition to SANITATION_HOLD
  - from: SANITATION_IN_PROGRESS
    to: SANITATION_HOLD
    trigger: system (SanitationCycle record-result with result == FAILED)
    actor: system
    preconditions: []
    side_effects:
    - Racks on the loop remain SANITATION_HOLD
    - Every GrowBatch occupying a tower on those racks with production_status in {SEEDED, GROWING, AT_RISK, HARVEST_READY, HARVESTED, PACKED} has safety_status -> QUARANTINED (from PENDING or RELEASED)
    - Every Shipment with a non-terminal ShipmentLine on such a batch recomputes has_safety_block = true
    - Each affected RetailContract's week_reserved_lb is unchanged (lines stay RESERVED) but provisional fill projections must treat the pounds as blocked
  - from: SANITATION_HOLD
    to: SANITATION_IN_PROGRESS
    trigger: system (a retest SanitationCycle with parent_cycle_id -> the FAILED cycle transitions to IN_PROGRESS)
    actor: system
    preconditions: []
    side_effects: []
  - from: SANITATION_IN_PROGRESS
    to: IN_SERVICE
    trigger: system (SanitationCycle record-result with result == PASSED)
    actor: system
    preconditions: []
    side_effects:
    - last_passed_at = completed_at; next_sanitation_due_at recomputed (+ SANITATION_INTERVAL_HOURS)
    - All SANITATION_HOLD racks on the loop transition to OPERATING
    - Every GrowBatch with safety_status == QUARANTINED on those racks returns to safety_status == PENDING (fresh release decision required)
    - Shipments recompute has_safety_block (cleared only when every line batch is RELEASED again)
- entity: Rack
  field: rack_posture
  initial_state: OPERATING
  terminal_states: []
  transitions:
  - from: OPERATING
    to: SANITATION_HOLD
    trigger: system (owning WaterLoop enters SANITATION_IN_PROGRESS or SANITATION_HOLD)
    actor: system
    preconditions: []
    side_effects:
    - Blocks harvest, pack, and new allocations on all of this rack's towers
  - from: SANITATION_HOLD
    to: OPERATING
    trigger: system (owning WaterLoop returns to IN_SERVICE)
    actor: system
    preconditions: []
    side_effects: []
  - from: OPERATING
    to: OUT_OF_SERVICE
    trigger: POST /farm/racks/{id}/set-out-of-service
    actor: FarmManager
    preconditions:
    - No ACTIVE TowerAllocation on any of this rack's towers (ERR_RACK_HAS_ACTIVE_BATCHES otherwise)
    side_effects:
    - occupied_towers must already be 0 given the precondition
  - from: OUT_OF_SERVICE
    to: OPERATING
    trigger: POST /farm/racks/{id}/return-to-service
    actor: FarmManager
    preconditions:
    - Owning WaterLoop posture is in {IN_SERVICE, SANITATION_DUE} (cross-entity state dependency)
    side_effects: []
- entity: Tower
  field: tower_status
  initial_state: IDLE
  terminal_states: []
  transitions:
  - from: IDLE
    to: ALLOCATED
    trigger: system (TowerAllocation created referencing this tower)
    actor: system
    preconditions:
    - Rack rack_posture == OPERATING (else ERR_RACK_NOT_OPERATING)
    - 'No other ACTIVE TowerAllocation on this tower whose [occupied_from_at, occupied_to_at) overlaps the requested [from, to) — half-open semantics: adjacency (next.from == existing.to) is allowed (else
      ERR_TOWER_INTERVAL_OVERLAP)'
    side_effects: []
  - from: ALLOCATED
    to: IDLE
    trigger: system (the ACTIVE TowerAllocation is RELEASED by harvest, fail, or cull)
    actor: system
    preconditions: []
    side_effects:
    - Rack.occupied_towers decremented by 1
- entity: GrowBatch
  field: production_status
  initial_state: PLANNED
  terminal_states:
  - PACKED
  - FAILED
  - CULLED
  transitions:
  - from: PLANNED
    to: SEEDED
    trigger: POST /farm/batches/{id}/seed
    actor: Grower
    preconditions:
    - Every allocated tower's Rack has rack_posture == OPERATING
    side_effects:
    - seeded_at = logical clock; projected_harvest_at = seeded_at + recipe.days_to_harvest days
    - Each TowerAllocation.occupied_from_at confirmed at seeded_at; occupied_to_at = projected_harvest_at
  - from: SEEDED
    to: GROWING
    trigger: POST /farm/batches/{id}/germination-check
    actor: Grower
    preconditions: []
    side_effects:
    - germination_rate_pct recorded; yield_factor computed per tier table; projected_yield_lb recomputed
    - replant_recommended set true when germination_rate_pct < 75.0
  - from: GROWING
    to: AT_RISK
    trigger: POST /farm/batches/{id}/report-stress
    actor: Grower
    preconditions:
    - stress_extension_days < STRESS_EXTENSION_CAP (5) — else ERR_STRESS_CAP_REACHED
    side_effects:
    - stress_extension_days += 1; projected_harvest_at += 1 day
    - Every ACTIVE TowerAllocation.occupied_to_at += 1 day (interval re-validated against later allocations)
  - from: AT_RISK
    to: GROWING
    trigger: POST /farm/batches/{id}/recover
    actor: Grower
    preconditions: []
    side_effects: []
  - from:
    - GROWING
    - AT_RISK
    to: HARVEST_READY
    trigger: POST /farm/batches/{id}/mark-harvest-ready
    actor: Grower
    preconditions:
    - Logical clock >= projected_harvest_at - HARVEST_READY_EARLY_HOURS (48h) — else ERR_HARVEST_NOT_DUE
    side_effects: []
  - from: HARVEST_READY
    to: HARVESTED
    trigger: POST /farm/batches/{id}/harvest
    actor: Grower
    preconditions:
    - Every allocated tower's Rack rack_posture == OPERATING — else ERR_RACK_NOT_OPERATING (cross-entity state dependency)
    side_effects:
    - harvested_at = clock; harvested_by_user_id = X-User-ID; harvested_total_lb = grade_a_lb + grade_b_lb; packed_available_lb = 0 until pack
    - 'Cascade link 1: every ACTIVE TowerAllocation -> RELEASED'
    - 'Cascade link 2 (caused by link 1): each released Tower -> IDLE'
    - 'Cascade link 3 (caused by link 2): each affected Rack.occupied_towers decremented per released tower'
  - from: HARVESTED
    to: PACKED
    trigger: POST /farm/batches/{id}/pack
    actor: Grower
    preconditions:
    - safety_status == RELEASED — else ERR_BATCH_SAFETY_PENDING / ERR_BATCH_QUARANTINED
    - Clock UTC date == harvested_at UTC date (same-day rule) — else ERR_SAME_DAY_PACK_VIOLATION
    - A SanitationCycle on the batch's water loop with cycle_status == PASSED and completed_at >= clock - FOOD_SAFETY_RECENCY_HOURS (72h) exists — else ERR_SANITATION_RECENCY_MISSING
    side_effects:
    - packed_lb recorded (input must be > 0 and <= harvested_total_lb, else ERR_INVALID_REQUEST); packed_available_lb = packed_lb (no lines exist yet)
  - from:
    - PLANNED
    - SEEDED
    - GROWING
    - AT_RISK
    - HARVEST_READY
    to: FAILED
    trigger: POST /farm/batches/{id}/fail
    actor: Grower
    preconditions: []
    side_effects:
    - 'Cascade link 1: creates a FailureReport (REPORTED) with lost_lb_estimate defaulting to projected_yield_lb'
    - 'Cascade link 2: every ACTIVE TowerAllocation -> RELEASED (which releases towers and decrements Rack.occupied_towers as in the harvest chain)'
    - Shipments with RESERVED lines on this batch keep the lines; has_safety_block unchanged (FAILED batches were never RELEASED so already blocked)
  - from:
    - PLANNED
    - SEEDED
    - GROWING
    - AT_RISK
    - HARVEST_READY
    to: CULLED
    trigger: POST /farm/batches/{id}/cull
    actor: Grower
    preconditions: []
    side_effects:
    - Same allocation/tower/rack release cascade as harvest (no FailureReport created)
- entity: GrowBatch
  field: safety_status
  initial_state: PENDING
  terminal_states:
  - CONDEMNED
  note: 'Parallel dimension: evolves independently of production_status.'
  transitions:
  - from:
    - PENDING
    - QUARANTINED
    to: RELEASED
    trigger: POST /farm/batches/{id}/safety-release with decision=RELEASED
    actor: QualityAssurance
    preconditions:
    - production_status in {GROWING, AT_RISK, HARVEST_READY, HARVESTED, PACKED} (PACKED covers the re-release path after a quarantine retest)
    - X-User-ID != harvested_by_user_id when harvested_by_user_id is set (segregation of duties — ERR_SEGREGATION_OF_DUTIES)
    side_effects:
    - Shipments with lines on this batch recompute has_safety_block
  - from:
    - PENDING
    - QUARANTINED
    - RELEASED
    to: CONDEMNED
    trigger: POST /farm/batches/{id}/safety-release with decision=CONDEMNED
    actor: QualityAssurance
    preconditions:
    - X-User-ID != harvested_by_user_id when set (segregation of duties)
    side_effects:
    - Every ShipmentLine in {RESERVED, PACKED, SHORTED} on this batch -> RELEASED
    - Shipment.reserved_lb recomputed; a Shipment whose lines are all RELEASED transitions to CANCELED
    - packed_available_lb set to 0
  - from:
    - PENDING
    - RELEASED
    to: QUARANTINED
    trigger: system (WaterLoop enters SANITATION_HOLD via FAILED sanitation result)
    actor: system
    preconditions: []
    side_effects:
    - Shipments with lines on this batch recompute has_safety_block = true
  - from: QUARANTINED
    to: PENDING
    trigger: system (WaterLoop returns to IN_SERVICE via a PASSED retest)
    actor: system
    preconditions: []
    side_effects:
    - Fresh safety-release decision required before pack/ship
- entity: TowerAllocation
  field: allocation_status
  initial_state: ACTIVE
  terminal_states:
  - RELEASED
  transitions:
  - from: ACTIVE
    to: RELEASED
    trigger: system (batch harvest / fail / cull)
    actor: system
    preconditions: []
    side_effects:
    - Tower -> IDLE; Rack.occupied_towers -= 1
- entity: SanitationCycle
  field: cycle_status
  initial_state: SCHEDULED
  terminal_states:
  - PASSED
  - FAILED
  - CANCELED
  transitions:
  - from: SCHEDULED
    to: IN_PROGRESS
    trigger: POST /farm/sanitation-cycles/{id}/start
    actor: SanitationLead
    preconditions:
    - WaterLoop posture in {IN_SERVICE, SANITATION_DUE, SANITATION_HOLD}
    - No GrowBatch on this loop's racks in production_status in {HARVEST_READY, HARVESTED} (would strand produce) — ERR_HARVEST_IN_FLIGHT
    - Clock >= scheduled_start_at - SANITATION_EARLY_START_MINUTES (30 min) — else ERR_CYCLE_NOT_DUE
    side_effects:
    - started_at = clock; WaterLoop -> SANITATION_IN_PROGRESS; OPERATING racks -> SANITATION_HOLD
  - from: IN_PROGRESS
    to: PASSED
    trigger: POST /farm/sanitation-cycles/{id}/record-result with result=PASSED
    actor: SanitationLead
    preconditions:
    - 'If parent_cycle_id is set: X-User-ID != parent cycle''s result_recorded_by (segregation of duties)'
    side_effects:
    - completed_at = clock; WaterLoop -> IN_SERVICE with last_passed_at/next_sanitation_due_at recomputed; racks -> OPERATING; QUARANTINED batches -> PENDING
  - from: IN_PROGRESS
    to: FAILED
    trigger: POST /farm/sanitation-cycles/{id}/record-result with result=FAILED
    actor: SanitationLead
    preconditions:
    - 'If parent_cycle_id is set: X-User-ID != parent cycle''s result_recorded_by (segregation of duties)'
    side_effects:
    - completed_at = clock; WaterLoop -> SANITATION_HOLD; racks stay SANITATION_HOLD; batches -> QUARANTINED; shipments flagged has_safety_block (full 4-link cascade, see WaterLoop machine)
  - from: SCHEDULED
    to: CANCELED
    trigger: POST /farm/sanitation-cycles/{id}/cancel
    actor: SanitationLead
    preconditions: []
    side_effects: []
- entity: RetailContract
  field: contract_status
  initial_state: ACTIVE
  terminal_states:
  - TERMINATED
  - COMPLETED
  transitions:
  - from: ACTIVE
    to: SUSPENDED
    trigger: POST /farm/contracts/{id}/suspend
    actor: ContractsManager
    preconditions:
    - No Shipment of this contract in shipment_status == PACKED (suspend freezes mid-flight freight) — ERR_SHIPMENT_IN_FLIGHT
    side_effects:
    - New shipment creation blocked while SUSPENDED
  - from: SUSPENDED
    to: ACTIVE
    trigger: POST /farm/contracts/{id}/reinstate
    actor: ContractsManager
    preconditions: []
    side_effects: []
  - from:
    - ACTIVE
    - SUSPENDED
    to: TERMINATED
    trigger: POST /farm/contracts/{id}/terminate
    actor: ContractsManager
    preconditions: []
    side_effects:
    - 'Cascade link 1: every Shipment in {RESERVED, PACKED} -> CANCELED'
    - 'Cascade link 2 (caused by link 1): each canceled shipment''s ShipmentLines in {RESERVED, PACKED, SHORTED} -> RELEASED'
    - 'Cascade link 3 (caused by link 2): each affected GrowBatch.reserved_lb and packed_available_lb recomputed'
  - from: ACTIVE
    to: COMPLETED
    trigger: system (settle-week for the final week whose end_date has passed completes the contract)
    actor: system
    preconditions:
    - All weeks through end_date settled
    side_effects: []
- entity: Shipment
  field: shipment_status
  initial_state: RESERVED
  terminal_states:
  - SHIPPED
  - CANCELED
  - EXPIRED
  transitions:
  - from: RESERVED
    to: PACKED
    trigger: POST /farm/shipments/{id}/confirm-pack
    actor: ContractsManager
    preconditions:
    - Every line gets a packed_lb value in the request
    side_effects:
    - 'Per line: packed_lb == reserved_lb -> PACKED; packed_lb < reserved_lb -> SHORTED and the difference is released back to the batch (packed_available_lb += reserved - packed)'
    - has_shortage recomputed; contract week_reserved_lb recomputed
  - from:
    - RESERVED
    - PACKED
    to: SHIPPED
    trigger: POST /farm/shipments/{id}/ship
    actor: ContractsManager
    preconditions:
    - Every line's batch has safety_status == RELEASED — else ERR_BATCH_SAFETY_PENDING / ERR_BATCH_QUARANTINED / ERR_BATCH_CONDEMNED
    - Clock >= window_start_at and clock <= window_end_at (inclusive end) — else ERR_SHIPMENT_WINDOW_CLOSED
    - Clock UTC date == ship_date — else ERR_SHIPMENT_WINDOW_CLOSED
    side_effects:
    - 'Lines -> SHIPPED with shipped_lb = packed_lb (RESERVED lines ship reserved_lb only if confirm-pack already ran; lines still RESERVED at ship time are rejected: ERR_LINE_NOT_PACKED)'
    - invoice_total_cents computed per shipment_invoice_total (per-line round then sum)
  - from:
    - RESERVED
    - PACKED
    to: CANCELED
    trigger: POST /farm/shipments/{id}/cancel or system (contract terminate)
    actor: ContractsManager or system
    preconditions: []
    side_effects:
    - Lines in {RESERVED, PACKED, SHORTED} -> RELEASED; batches' reserved_lb / packed_available_lb recomputed; contract week_reserved_lb recomputed
  - from:
    - RESERVED
    - PACKED
    to: EXPIRED
    trigger: 'system (settle-week sweep: ship_date falls inside the settled week and the shipment never shipped)'
    actor: system
    preconditions: []
    side_effects:
    - Same release cascade as cancel
- entity: ShipmentLine
  field: line_status
  initial_state: RESERVED
  terminal_states:
  - SHIPPED
  - RELEASED
  transitions:
  - from: RESERVED
    to: PACKED
    trigger: system (confirm-pack with packed_lb == reserved_lb)
    actor: system
    preconditions: []
    side_effects: []
  - from: RESERVED
    to: SHORTED
    trigger: system (confirm-pack with packed_lb < reserved_lb)
    actor: system
    preconditions: []
    side_effects:
    - Difference (reserved_lb - packed_lb) returned to the batch's packed_available_lb
  - from:
    - PACKED
    - SHORTED
    to: SHIPPED
    trigger: system (shipment ships)
    actor: system
    preconditions: []
    side_effects:
    - shipped_lb = packed_lb; batch packed_available_lb -= packed_lb; batch reserved_lb -= reserved_lb
  - from:
    - RESERVED
    - PACKED
    - SHORTED
    to: RELEASED
    trigger: system (shipment canceled/expired, batch condemned, or contract terminated)
    actor: system
    preconditions: []
    side_effects:
    - Batch reserved_lb -= reserved_lb; packed_available_lb += (packed_lb if any)
- entity: LaborShift
  field: shift_status
  initial_state: DRAFT
  terminal_states:
  - COMPLETED
  - CANCELED
  transitions:
  - from: DRAFT
    to: PUBLISHED
    trigger: POST /farm/labor-shifts/{id}/publish
    actor: LaborPlanner
    preconditions: []
    side_effects:
    - projected_labor_cost_cents computed (HARVEST_CREW shifts only)
    - Increments LaborShift.version by 1
  - from: PUBLISHED
    to: COMPLETED
    trigger: POST /farm/labor-shifts/{id}/complete
    actor: LaborPlanner
    preconditions:
    - Clock >= end_at
    - Every ShiftAssignment in ASSIGNED has been CONFIRMED (ERR_UNCONFIRMED_ASSIGNMENTS otherwise)
    side_effects:
    - ShiftAssignments in CONFIRMED stay terminal-resolved (assignment_status unchanged; shift history immutable)
  - from:
    - DRAFT
    - PUBLISHED
    to: CANCELED
    trigger: POST /farm/labor-shifts/{id}/cancel
    actor: LaborPlanner
    preconditions: []
    side_effects:
    - ShiftAssignments in {ASSIGNED, CONFIRMED} -> RELEASED; workers' scheduled_hours_current_week recomputed
- entity: ShiftAssignment
  field: assignment_status
  initial_state: ASSIGNED
  terminal_states:
  - CONFIRMED
  - RELEASED
  transitions:
  - from: ASSIGNED
    to: CONFIRMED
    trigger: POST /farm/labor-shifts/{id}/assignments/{assignment_id}/confirm
    actor: Worker
    preconditions:
    - X-User-ID == the assignment's worker_id (ownership check)
    - Shift still PUBLISHED
    side_effects: []
  - from:
    - ASSIGNED
    - CONFIRMED
    to: RELEASED
    trigger: POST /farm/labor-shifts/{id}/assignments/{assignment_id}/release or system (shift canceled)
    actor: LaborPlanner
    preconditions: []
    side_effects:
    - Worker.scheduled_hours_current_week recomputed; LaborShift.headcount_assigned -= 1; overtime_hours recomputed
- entity: FailureReport
  field: report_status
  initial_state: REPORTED
  terminal_states:
  - CLOSED
  transitions:
  - from: REPORTED
    to: TRIAGED
    trigger: POST /farm/failure-reports/{id}/triage
    actor: Grower
    preconditions: []
    side_effects:
    - triaged_by_user_id recorded; lost_lb_estimate finalized from input
  - from:
    - TRIAGED
    - REPLANT_REQUESTED
    to: REPLANT_REQUESTED
    trigger: POST /farm/failure-reports/{id}/request-replant
    actor: Grower
    preconditions:
    - No existing ReplantRequest for this failure in QUEUED status (else ERR_REPLANT_ALREADY_QUEUED); a prior DROPPED request does not block a fresh request
    side_effects:
    - Creates ReplantRequest (QUEUED) with priority_score frozen per replant_priority_score and towers_needed = failed batch's tower count
  - from:
    - TRIAGED
    - REPLANT_REQUESTED
    to: CLOSED
    trigger: POST /farm/failure-reports/{id}/close
    actor: Grower
    preconditions:
    - 'If REPLANT_REQUESTED: its ReplantRequest is in {CONVERTED, DROPPED} — ERR_REPLANT_STILL_QUEUED otherwise'
    side_effects: []
- entity: ReplantRequest
  field: replant_status
  initial_state: QUEUED
  terminal_states:
  - CONVERTED
  - DROPPED
  transitions:
  - from: QUEUED
    to: CONVERTED
    trigger: POST /farm/replant-requests/{id}/approve
    actor: FarmManager
    preconditions:
    - Failed batch's Crop crop_status == ACTIVE — ERR_CROP_RETIRED
    - Failed batch's Crop has an ACTIVE GrowRecipe — ERR_NO_ACTIVE_RECIPE
    - Tower selector returns a non-empty candidate set of exactly towers_needed towers — ERR_REPLANT_NO_TOWERS (empty-pool fallback)
    side_effects:
    - 'Creates a new GrowBatch (PLANNED) with crop_id/recipe_id pinned, origin_replant_request_id set, and TowerAllocations created on the selected towers (selector: see tower_allocation_selector calculation)'
  - from: QUEUED
    to: DROPPED
    trigger: POST /farm/replant-requests/{id}/drop
    actor: FarmManager
    preconditions: []
    side_effects: []
concurrency_rules:
- rule_id: recipe-activate-stale-crop
  parent_entity: Crop
  write_endpoint: POST /farm/recipes/{id}/activate
  occ_field: expected_crop_version
  description: 'Activating a GrowRecipe legitimately supersedes the crop''s current ACTIVE

    recipe. A client carrying a Crop version that no longer matches the stored

    version (because a prior activation already advanced it) is rejected as stale;

    the client must re-read the Crop and retry with the fresh version.

    '
  error_id: ERR_STALE_VERSION
  http_status: 412
- rule_id: shipment-create-stale-contract
  parent_entity: RetailContract
  write_endpoint: POST /farm/shipments
  occ_field: expected_contract_version
  description: 'Creating a Shipment debits the contract''s weekly reservation pool. A client

    carrying a RetailContract version that no longer matches the stored version

    (because a prior shipment creation or settlement already advanced it) is

    rejected as stale; the client must re-read the contract and retry.

    '
  error_id: ERR_STALE_VERSION
  http_status: 412
- rule_id: assignment-create-stale-shift
  parent_entity: LaborShift
  write_endpoint: POST /farm/labor-shifts/{id}/assignments
  occ_field: expected_labor_shift_version
  description: 'Creating a ShiftAssignment increments headcount_assigned on the shift. A

    client carrying a LaborShift version that no longer matches the stored

    version (because a prior assignment or publish already advanced it) is

    rejected as stale; the client must re-read the shift and retry.

    '
  error_id: ERR_STALE_VERSION
  http_status: 412
calculations:
- name: projected_harvest_schedule
  trigger: batch seed; report-stress
  algorithm: chronological
  formula: "On seed: projected_harvest_at = seeded_at + recipe.days_to_harvest * 24h\nOn report-stress (while stress_extension_days < 5):\n  stress_extension_days += 1\n  projected_harvest_at = projected_harvest_at\
    \ + 24h\n  every ACTIVE TowerAllocation.occupied_to_at += 24h\n"
  input_set: the batch's pinned GrowRecipe (days_to_harvest); batch stress_extension_days
  constants:
    STRESS_EXTENSION_CAP: 5
    HARVEST_READY_EARLY_HOURS: 48
- name: yield_projection
  trigger: batch creation (factor 1.00); germination-check
  algorithm: threshold
  formula: "tier(germination_rate_pct):\n  r >= 95.0        -> 1.00\n  85.0 <= r < 95.0 -> 0.90\n  75.0 <= r < 85.0 -> 0.75\n  r < 75.0         -> 0.50 AND replant_recommended = true\nBefore germination\
    \ check: yield_factor = 1.00.\nprojected_yield_lb = round_half_up(tower_count * expected_yield_lb_per_tower * yield_factor, 2)\ntower_count = count of ACTIVE TowerAllocations on the batch.\n"
  input_set: batch's ACTIVE TowerAllocations; pinned recipe.expected_yield_lb_per_tower; germination_rate_pct
  constants:
    GERMINATION_REPLANT_THRESHOLD: 75.0
  precision: 2 decimal places, round_half_up
- name: energy_cost_per_pound
  trigger: on demand via GET /farm/batches/{id}/cost-summary; ACTUAL variant additionally recomputed when a covering EnergyMeterReading is created
  algorithm: aggregation
  formula: "PROVISIONAL variant (nameplate projection; always computable once seeded):\n  kwh_prov = tower_count * light_hours_per_day * days_to_harvest * FIXTURE_KW_PER_TOWER\n  energy_cents_prov = kwh_prov\
    \ * ENERGY_RATE_CENTS_PER_KWH\n  provisional_cost_per_pound_cents = round_half_up(energy_cents_prov / projected_yield_lb, 2)\nACTUAL variant (only when a FACILITY-scope EnergyMeterReading's period covers\n\
    [seeded_at, projected_harvest_at)):\n  batch_light_hours = tower_count * light_hours_per_day * grow_days_in_period\n    where grow_days_in_period = days in intersection [seeded_at, projected_harvest_at)\
    \ ∩ [period_start_at, period_end_at) — half-open on both\n  total_light_hours = Σ batch_light_hours over all GrowBatches whose [seeded_at, projected_harvest_at) intersects the period (any production_status\
    \ except PLANNED)\n  share = batch_light_hours / total_light_hours\n  energy_charge_cents = kwh_consumed * ENERGY_RATE_CENTS_PER_KWH\n  demand_charge_cents = tiered: min(peak_demand_kw, 500) * DEMAND_RATE_T1_CENTS_PER_KW\n\
    \                                + max(0, peak_demand_kw - 500) * DEMAND_RATE_T2_CENTS_PER_KW\n  energy_alloc_cents = round_half_up(energy_charge_cents * share, 0)\n  demand_alloc_cents = round_half_up(demand_charge_cents\
    \ * share, 0)\n  basis_lb = harvested_total_lb if production_status in {HARVESTED, PACKED} else projected_yield_lb\n  actual_cost_per_pound_cents = round_half_up((energy_alloc_cents + demand_alloc_cents)\
    \ / basis_lb, 2)\n"
  input_set: covering FACILITY EnergyMeterReading; all GrowBatches intersecting its period; pinned recipe light/days fields
  constants:
    FIXTURE_KW_PER_TOWER: 0.6
    ENERGY_RATE_CENTS_PER_KWH: 11
    DEMAND_TIER1_LIMIT_KW: 500
    DEMAND_RATE_T1_CENTS_PER_KW: 900
    DEMAND_RATE_T2_CENTS_PER_KW: 1400
  precision: allocations integer cents round_half_up; per-pound 2 decimal places round_half_up
  variants:
  - name: PROVISIONAL
    when: always available after seeding; used for planning
    difference: nameplate kW and projected yield; ignores metered kWh and demand charges entirely
  - name: ACTUAL
    when: a covering FACILITY meter reading exists
    difference: metered kWh + tiered demand charge allocated by tower-light-hour share; divides by harvested_total_lb once harvested — different result from PROVISIONAL for identical batch inputs
- name: contract_week_fill_rate
  trigger: GET /farm/contracts/{id}/week-summary (PROVISIONAL); POST /farm/contracts/{id}/settle-week (FINAL)
  algorithm: aggregation
  formula: 'Week window W = [week_start_date, week_start_date + 7 days), aligned to week_start_day.

    shipped_lb(W)  = Σ shipped_lb of Shipments with shipment_status == SHIPPED and ship_date ∈ W

    reserved_lb(W) = Σ reserved_lb of Shipments with shipment_status in {RESERVED, PACKED} and ship_date ∈ W

    PROVISIONAL fill_rate = round_half_up((shipped_lb(W) + reserved_lb(W)) / weekly_commitment_lb, 4)

    FINAL fill_rate       = round_half_up(shipped_lb(W) / weekly_commitment_lb, 4)

    '
  input_set: contract's shipments partitioned by shipment_status and ship_date
  precision: ratio 4 decimal places, round_half_up
  variants:
  - name: PROVISIONAL
    when: mid-week read before settlement
    difference: counts RESERVED and PACKED pounds as if they will ship
  - name: FINAL
    when: settle-week; reserved-but-unshipped shipments are first swept to EXPIRED
    difference: counts only SHIPPED pounds — strictly lower whenever any reservation failed to ship
- name: contract_shortfall_penalty
  trigger: POST /farm/contracts/{id}/settle-week (after FINAL fill rate computed)
  algorithm: threshold
  formula: "short_lb = max(0, weekly_commitment_lb - shipped_lb(W))\nif FINAL fill_rate < fill_rate_threshold (STRICTLY less; equality pays nothing):\n  multiplier = 1.25 if consecutive_short_weeks >= 1\
    \ (i.e., the immediately previous settled week was also short) else 1.0\n  penalty_cents = round_half_up(short_lb * penalty_cents_per_short_lb * multiplier, 0)\n  consecutive_short_weeks += 1\nelse:\n\
    \  penalty_cents = 0\n  consecutive_short_weeks = 0\nnext_unsettled_week_start advances by 7 days.\n"
  input_set: the single week being settled; contract.consecutive_short_weeks
  constants:
    ESCALATION_MULTIPLIER: 1.25
  precision: integer cents, round_half_up at the final step only
- name: shipment_invoice_total
  trigger: POST /farm/shipments/{id}/ship
  algorithm: aggregation
  formula: "PINNED ROUNDING ORDER — round per line first, then sum:\n  line_amount_cents(line) = round_half_up(line.shipped_lb * contract.price_per_pound_cents, 0)\n  invoice_total_cents = Σ line_amount_cents\
    \ over all SHIPPED lines\n(Sum-then-round of the same lines can differ by cents; the per-line-first order is the contract.)\n"
  input_set: the shipment's SHIPPED lines; contract price
  precision: integer cents, round_half_up per line
- name: harvest_labor_cost
  trigger: LaborShift publish and on read; HARVEST_CREW shifts only
  algorithm: constraint_propagation
  formula: "inputs: forecast pounds, crop-category productivity, assigned headcount, planned rate\nbatch_hours = Σ over GrowBatches b where b.projected_harvest_at's UTC date == shift_date\n            \
    \  and b.production_status in {GROWING, AT_RISK, HARVEST_READY}:\n                b.projected_yield_lb / PRODUCTIVITY_LB_PER_HOUR[b.crop.category]\nrequired_crew_hours = ceil(batch_hours)\nregular_hours\
    \ = min(required_crew_hours, SHIFT_LENGTH_HOURS * headcount_assigned)\novertime_h    = max(0, required_crew_hours - SHIFT_LENGTH_HOURS * headcount_assigned)\nprojected_labor_cost_cents = round_half_up(regular_hours\
    \ * planned_hourly_rate_cents\n                                           + overtime_h * planned_hourly_rate_cents * OT_MULTIPLIER, 0)\nNon-HARVEST_CREW shifts: projected_labor_cost_cents = 0.\n"
  input_set: batches by projected harvest date and status filter; headcount_assigned; planned_hourly_rate_cents
  constants:
    PRODUCTIVITY_LEAFY_GREEN: 60
    PRODUCTIVITY_HERB: 40
    PRODUCTIVITY_FRUITING: 25
    SHIFT_LENGTH_HOURS: 8
    OT_MULTIPLIER: 1.5
  precision: integer cents, round_half_up; hours ceiled to integer before cost
- name: replant_priority_score
  trigger: ReplantRequest creation (score computed once and FROZEN on the row)
  algorithm: weighted_scoring
  formula: "PINNED EVALUATION ORDER (breaks the circularity: approved replants create new batches\nthat would change supply, which would change other requests' scores):\n  (1) week W = the week (aligned\
    \ to the crop's contract week_start_day... when several ACTIVE\n      contracts exist for the crop, use the earliest week_start among them) containing the\n      failed batch's projected_harvest_at\n\
    \  (2) projected_supply_lb = Σ projected_yield_lb over GrowBatches of the same crop with\n      production_status in {SEEDED, GROWING, AT_RISK, HARVEST_READY} and projected_harvest_at ∈ W\n      (FAILED\
    \ batches are excluded by the status filter)\n  (3) commitment_lb = Σ weekly_commitment_lb over that crop's RetailContracts with contract_status == ACTIVE\n  (4) shortfall_lb = max(0, commitment_lb\
    \ - projected_supply_lb)\n  (5) urgency_factor = 2.0 if (failed batch's projected_harvest_at - FailureReport.created_at) <= 14 days else 1.0\n  (6) priority_score = round_half_up(shortfall_lb * crop.margin_cents_per_lb\
    \ * urgency_factor, 2)\nThe score is FROZEN at creation; later supply changes never recompute it.\nApproval order among QUEUED requests: priority_score DESC, tie-break FailureReport.created_at ASC (never\
    \ id).\n"
  input_set: same-crop batches in grow states; same-crop ACTIVE contracts; the failed batch; the FailureReport
  precision: 2 decimal places, round_half_up
- name: tower_allocation_selector
  trigger: POST /farm/replant-requests/{id}/approve (auto-allocation)
  algorithm: constraint_propagation
  formula: "Eligibility filter: Tower t eligible iff\n  no ACTIVE TowerAllocation on t overlaps [clock, clock + crop's ACTIVE recipe.days_to_harvest)\n  AND t.rack.rack_posture == OPERATING\n  AND t.rack.water_loop.posture\
    \ in {IN_SERVICE, SANITATION_DUE}\nRanking: best-fit defragmentation — group eligible towers by rack; candidate racks are those\n  with idle_count >= towers_needed; rank racks by (idle_count - towers_needed)\
    \ ASC (fullest-after-use first),\n  tie-break Rack.created_at ASC (never id); within the chosen rack take towers by tower_index ASC.\nEmpty pool fallback: no candidate rack -> reject with ERR_REPLANT_NO_TOWERS\
    \ (no partial allocation).\n"
  input_set: all Towers joined to Rack and WaterLoop posture
- name: sanitation_schedule
  trigger: SanitationCycle record-result; clock reads
  algorithm: chronological
  formula: "last_passed_at = completed_at of the most recent SanitationCycle with cycle_status == PASSED on the loop\nnext_sanitation_due_at = last_passed_at + SANITATION_INTERVAL_HOURS (null when never\
    \ passed)\nWaterLoop.posture derivation (evaluated on every read and mutation):\n  SANITATION_IN_PROGRESS if any cycle on the loop is IN_PROGRESS\n  else SANITATION_HOLD if the most recent completed\
    \ (non-canceled) cycle has result == FAILED\n  else SANITATION_DUE if next_sanitation_due_at is not null and clock > next_sanitation_due_at\n  else IN_SERVICE\n"
  input_set: SanitationCycles of the loop ordered by created_at ASC (chronological); loop fields
  constants:
    SANITATION_INTERVAL_HOURS: 168
    SANITATION_BUFFER_HOURS: 4
    MIN_CYCLE_HOURS: 2
    MAX_CYCLE_HOURS: 12
    SANITATION_EARLY_START_MINUTES: 30
    FOOD_SAFETY_RECENCY_HOURS: 72
- name: worker_weekly_hours
  trigger: ShiftAssignment create / release / confirm; shift cancel
  algorithm: aggregation
  formula: "ISO week = Monday 00:00 UTC .. next Monday 00:00 UTC containing the clock date.\nscheduled_hours_current_week = Σ (end_at - start_at in hours, 2dp) over the worker's\n  ShiftAssignments with\
    \ assignment_status in {ASSIGNED, CONFIRMED} whose shift_date ∈ that ISO week.\novertime flag: hours beyond REGULAR_HOURS_PER_WEEK are overtime; exactly 40.00 is NOT overtime.\nHARD CAP: when creating\
    \ an assignment, total the worker's {ASSIGNED, CONFIRMED} hours over the\n  ISO week containing the TARGET SHIFT's shift_date (including the new shift); a total strictly\n  above WEEKLY_HOURS_HARD_CAP\
    \ (48.00) is rejected (ERR_WEEKLY_HOURS_EXCEEDED); exactly 48.00 is allowed.\nWorker.scheduled_hours_current_week reports the same sum for the ISO week containing the clock date.\n"
  input_set: worker's assignments in active statuses within the current ISO week
  constants:
    REGULAR_HOURS_PER_WEEK: 40.0
    WEEKLY_HOURS_HARD_CAP: 48.0
  precision: 2 decimal places, round_half_up
- name: dock_day_capacity
  trigger: POST /farm/shipments
  algorithm: threshold
  formula: "Aggregate-capacity semantics (NOT interval arithmetic): shipments compete for a per-day dock quota.\ndock_load(ship_date) = count of Shipments with shipment_status in {RESERVED, PACKED, SHIPPED}\
    \ and this ship_date\nCreating a shipment is rejected with ERR_DOCK_CAPACITY_EXCEEDED when dock_load(ship_date) >= DOCK_MAX_SHIPMENTS_PER_DAY,\n  regardless of the requested window_start_at/window_end_at\
    \ values (windows may overlap freely up to the quota).\n"
  input_set: shipments by ship_date and status filter
  constants:
    DOCK_MAX_SHIPMENTS_PER_DAY: 3
- name: pack_recency_check
  trigger: POST /farm/batches/{id}/pack
  algorithm: chronological
  formula: "latest_pass = the SanitationCycle on the batch's water loop (via any allocated tower's rack)\n  with cycle_status == PASSED and the greatest completed_at\npack is rejected with ERR_SANITATION_RECENCY_MISSING\
    \ when:\n  latest_pass does not exist, OR clock - latest_pass.completed_at > FOOD_SAFETY_RECENCY_HOURS (strictly greater; exactly 72h passes)\n"
  input_set: PASSED SanitationCycles on the batch's loop, greatest completed_at
  constants:
    FOOD_SAFETY_RECENCY_HOURS: 72
validations:
- priority: 1
  category: auth
  check: X-User-ID and X-User-Role headers present and X-User-Role is a declared role
  error_id: ERR_MISSING_CONTEXT_HEADER
  http_status: 400
  applies_to: all
- priority: 2
  category: auth
  check: The role is permitted for this endpoint per §1.5 roles
  error_id: ERR_FORBIDDEN_ROLE
  http_status: 403
  applies_to: all
- priority: 3
  category: auth
  check: 'Segregation of duties: safety-release X-User-ID must differ from the batch''s harvested_by_user_id; sanitation record-result on a retest cycle (parent_cycle_id set) must differ from the parent
    cycle''s result_recorded_by; Worker confirm requires X-User-ID == assignment.worker_id'
  error_id: ERR_SEGREGATION_OF_DUTIES
  http_status: 403
  applies_to: POST /farm/batches/{id}/safety-release; POST /farm/sanitation-cycles/{id}/record-result; POST /farm/labor-shifts/{id}/assignments/{assignment_id}/confirm
- priority: 4
  category: existence
  check: Path resource ids exist, validated left-to-right; body FK references (crop_id, water_loop_id, tower_ids[], contract_id, worker_id, parent_cycle_id, lines[].batch_id) exist
  error_id: ERR_NOT_FOUND
  http_status: 404
  applies_to: all resource endpoints
- priority: 5
  category: state
  check: Target resource lifecycle permits the transition (e.g., pack requires HARVESTED; germination-check requires SEEDED; confirm-pack requires RESERVED; safety-release requires production_status in
    {GROWING, AT_RISK, HARVEST_READY, HARVESTED, PACKED} and safety in {PENDING, QUARANTINED, RELEASED})
  error_id: ERR_INVALID_STATE_TRANSITION | ERR_LINE_NOT_PACKED
  http_status: 409
  applies_to: all action endpoints
- priority: 6
  category: state
  check: 'Cross-entity state/posture gates: rack OPERATING for seed/harvest/allocation; water loop not IN_PROGRESS for return-to-service; contract ACTIVE for shipment create; shipment line batches in production_status
    == PACKED at shipment create; labor shift PUBLISHED for assignment create; no HARVEST_READY/HARVESTED batch on the loop at sanitation start; no ACTIVE allocations at rack set-out-of-service; no PACKED
    shipment at contract suspend; all assignments CONFIRMED at shift complete'
  error_id: ERR_RACK_NOT_OPERATING | ERR_WATER_LOOP_SANITATION_HOLD | ERR_CONTRACT_NOT_ACTIVE | ERR_SHIFT_NOT_PUBLISHED | ERR_BATCH_NOT_PACKED | ERR_HARVEST_IN_FLIGHT | ERR_RACK_HAS_ACTIVE_BATCHES | ERR_SHIPMENT_IN_FLIGHT
    | ERR_UNCONFIRMED_ASSIGNMENTS
  http_status: 409
  applies_to: seed, harvest, batch create, rack return-to-service, shipment create, assignment create, sanitation start, rack set-out-of-service, contract suspend, shift complete
- priority: 7
  category: business_safety
  check: 'Food-safety gates: batch safety RELEASED for pack/ship; batch not CONDEMNED/QUARANTINED; same-day pack rule; sanitation recency (72h PASSED cycle)'
  error_id: ERR_BATCH_SAFETY_PENDING | ERR_BATCH_QUARANTINED | ERR_BATCH_CONDEMNED | ERR_SAME_DAY_PACK_VIOLATION | ERR_SANITATION_RECENCY_MISSING
  http_status: 422
  applies_to: pack, ship
- priority: 8
  category: business_referential
  check: 'Reference coherence: crop not RETIRED for new batches/contracts/recipes; an ACTIVE recipe exists for the crop on batch create; every shipment line''s batch crop matches the contract crop'
  error_id: ERR_CROP_RETIRED | ERR_NO_ACTIVE_RECIPE | ERR_SHIPMENT_CROP_MISMATCH | ERR_RECIPE_IN_USE | ERR_CROP_IN_USE
  http_status: 422
  applies_to: batch create, contract create, recipe activate/retire, shipment create, replant approve, crop retire
- priority: 9
  category: business_temporal
  check: 'Window and overlap rules: tower allocation half-open overlap; sanitation closed-interval + 4h buffer; worker shift half-open overlap; shipment window inclusive end; mark-harvest-ready earliness;
    cycle start earliness; contract end_date > start_date; energy reading period half-open per scope key'
  error_id: ERR_TOWER_INTERVAL_OVERLAP | ERR_SANITATION_OVERLAP | ERR_SHIFT_OVERLAP | ERR_SHIPMENT_WINDOW_CLOSED | ERR_HARVEST_NOT_DUE | ERR_CYCLE_NOT_DUE | ERR_CONTRACT_WINDOW_INVALID | ERR_ENERGY_PERIOD_OVERLAP
    | ERR_CYCLE_DURATION_INVALID | ERR_SHIP_DATE_MISMATCH
  http_status: 422
  applies_to: batch create, sanitation create/start, assignment create, ship, mark-harvest-ready, contract create, energy reading create
- priority: 10
  category: business_constraint
  check: 'Capacity/quota: contract weekly commitment pool (reserved <= commitment); dock day quota 3; headcount_required; weekly hours hard cap 48; stress extension cap 5; replant selector non-empty; duplicate
    crop_code / rack_code / loop_code uniqueness; one replant QUEUED per failure'
  error_id: ERR_CONTRACT_COMMITMENT_EXCEEDED | ERR_DOCK_CAPACITY_EXCEEDED | ERR_HEADCOUNT_EXCEEDED | ERR_WEEKLY_HOURS_EXCEEDED | ERR_STRESS_CAP_REACHED | ERR_REPLANT_NO_TOWERS | ERR_DUPLICATE_CODE | ERR_REPLANT_ALREADY_QUEUED
    | ERR_CERTIFICATION_MISSING | ERR_BATCH_POUNDS_INSUFFICIENT
  http_status: 422
  applies_to: shipment create, assignment create, report-stress, replant approve/request, crop/rack/loop create
- priority: 11
  category: state
  check: OCC version preconditions (expected_crop_version / expected_contract_version / expected_labor_shift_version) are evaluated ONLY after every other validation tier passes; a request that already fails role/existence/state/business checks reports that error, never ERR_STALE_VERSION
  error_id: ERR_STALE_VERSION
  http_status: 412
  applies_to: POST /farm/recipes/{id}/activate; POST /farm/shipments; POST /farm/labor-shifts/{id}/assignments
- priority: 12
  category: business_fiscal
  check: 'Fiscal floors: contract price_per_pound_cents >= crop.floor_price_cents_per_lb; money/pound fields non-negative'
  error_id: ERR_PRICE_BELOW_FLOOR | ERR_INVALID_REQUEST
  http_status: 422
  applies_to: contract create, harvest, confirm-pack
endpoints:
- method: POST
  path: /farm/_clock/set_current_utc
  description: Sets the logical clock. Startup default before any call is exactly 2026-08-01T00:00:00Z; the clock never falls back to wall-clock time. All date/window rules read this clock.
  roles:
  - FarmManager
  code: 200
  input:
  - to_iso8601
  output:
    current_utc: string
  side_effects:
  - WaterLoop posture re-derived against the new clock (SANITATION_DUE transitions)
- method: POST
  path: /farm/crops
  description: Create a crop
  roles:
  - FarmManager
  code: 201
  input:
  - crop_code
  - display_name
  - category
  - margin_cents_per_lb
  - floor_price_cents_per_lb
  output: Crop
  side_effects:
  - crop_status=ACTIVE
- method: GET
  path: /farm/crops
  description: List crops
  roles:
  - FarmManager
  - Grower
  - SanitationLead
  - QualityAssurance
  - ContractsManager
  - LaborPlanner
  - Worker
  code: 200
  input:
  - category?
  - crop_status?
  - limit?
  - offset?
  output: Crop[]
  side_effects: []
- method: GET
  path: /farm/crops/{id}
  description: Get a crop
  roles:
  - FarmManager
  - Grower
  - SanitationLead
  - QualityAssurance
  - ContractsManager
  - LaborPlanner
  - Worker
  code: 200
  input: []
  output: Crop
  side_effects: []
- method: POST
  path: /farm/crops/{id}/retire
  description: Retire a crop (blocked while batches grow or contracts live)
  roles:
  - FarmManager
  code: 200
  input: []
  output: Crop
  side_effects:
  - crop_status -> RETIRED
  - DRAFT recipes of the crop -> RETIRED
  - increments Crop.version by 1
- method: POST
  path: /farm/recipes
  description: Create a grow recipe (DRAFT)
  roles:
  - Grower
  code: 201
  input:
  - crop_id
  - light_hours_per_day
  - light_ppfd_umol
  - ec_target_ms
  - ph_target
  - temp_day_c
  - temp_night_c
  - humidity_pct
  - co2_ppm
  - days_to_harvest
  - expected_yield_lb_per_tower
  output: GrowRecipe
  side_effects:
  - recipe_status=DRAFT
- method: GET
  path: /farm/recipes
  description: List recipes
  roles:
  - FarmManager
  - Grower
  - SanitationLead
  - QualityAssurance
  - ContractsManager
  - LaborPlanner
  - Worker
  code: 200
  input:
  - crop_id?
  - recipe_status?
  - limit?
  - offset?
  output: GrowRecipe[]
  side_effects: []
- method: GET
  path: /farm/recipes/{id}
  description: Get a recipe
  roles:
  - FarmManager
  - Grower
  - SanitationLead
  - QualityAssurance
  - ContractsManager
  - LaborPlanner
  - Worker
  code: 200
  input: []
  output: GrowRecipe
  side_effects: []
- method: POST
  path: /farm/recipes/{id}/activate
  description: Activate a recipe; supersedes the crop's current ACTIVE recipe (OCC on Crop.version)
  roles:
  - Grower
  code: 200
  input:
  - expected_crop_version
  output: GrowRecipe
  side_effects:
  - recipe_status -> ACTIVE
  - prior ACTIVE recipe of the same crop -> RETIRED
  - increments Crop.version by 1
- method: POST
  path: /farm/recipes/{id}/retire
  description: Retire a recipe (blocked while non-terminal batches reference it)
  roles:
  - Grower
  code: 200
  input: []
  output: GrowRecipe
  side_effects:
  - recipe_status -> RETIRED
- method: POST
  path: /farm/water-loops
  description: Create a water loop
  roles:
  - FarmManager
  code: 201
  input:
  - loop_code
  output: WaterLoop
  side_effects:
  - posture=IN_SERVICE
- method: GET
  path: /farm/water-loops
  description: List water loops
  roles:
  - FarmManager
  - Grower
  - SanitationLead
  - QualityAssurance
  - ContractsManager
  - LaborPlanner
  - Worker
  code: 200
  input:
  - posture?
  - limit?
  - offset?
  output: WaterLoop[]
  side_effects: []
- method: GET
  path: /farm/water-loops/{id}
  description: Get a water loop
  roles:
  - FarmManager
  - Grower
  - SanitationLead
  - QualityAssurance
  - ContractsManager
  - LaborPlanner
  - Worker
  code: 200
  input: []
  output: WaterLoop
  side_effects: []
- method: GET
  path: /farm/water-loops/{id}/sanitation-cycles
  description: List sanitation cycles of a loop
