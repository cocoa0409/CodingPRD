            - "DealMemo.${memo_id}.cancellation_penalty_cents == 200000 (depth-1: memo mutated by booking cancel)"
            - "Submission.${sub_id}.status == NOT_BOOKED (depth-2: caused by booking's mutation)"
            - "Role.${role_id}.status == OPEN (depth-3: caused by submission's mutation)"

      - name: breakdown_cancel_cascade_depth2
        grounds:
          - state_machines.Breakdown.RELEASED_OPEN_to_CANCELLED
          - state_machines.AvailabilityHold.ACTIVE_to_RELEASED
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (breakdown cancel, not booking
          cancel): Breakdown(RELEASED_OPEN->CANCELLED) drives Submission
          ->WITHDRAWN [depth1]; the submission's withdrawal drives its ACTIVE
          AvailabilityHold ->RELEASED [depth2].
        test_recipe:
          setup:
            - "Released OPEN breakdown with one UNDER_REVIEW submission that has one ACTIVE AVAIL hold"
          setup_api_calls:
            - { call: "POST /casting/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: CastingDirector }
            - call: "POST /casting/productions"
              payload: { title: "Casc2P", production_type: "FILM", union_signatory: false, shoot_city: "LA", shoot_state: "CA", start_date: "2026-08-01T00:00:00Z", wrap_date: "2026-09-30T00:00:00Z", casting_office_id: "office-1" }
              as: CastingDirector
              captures: { prod_id: $.data.id }
            - call: "POST /casting/productions/${prod_id}/roles"
              payload: { character_name: "Casc2R", is_minor_role: false, is_union_covered: false, engagement_start: "2026-08-20T00:00:00Z", engagement_end: "2026-08-22T00:00:00Z" }
              as: CastingDirector
              captures: { role_id: $.data.id }
            - call: "POST /casting/productions/${prod_id}/breakdowns"
              payload: { role_id: "${role_id}", distribution: "OPEN_CALL", submission_deadline: "2026-09-01T00:00:00Z", rate_weekly_cents: 1000000 }
              as: CastingDirector
              captures: { br_id: $.data.id }
            - call: "POST /casting/breakdowns/${br_id}/release"
              payload: { distribution: "OPEN_CALL" }
              as: CastingDirector
              captures: { br_v: $.data.version }
            - call: "POST /casting/talents"
              payload: { full_name: "Casc2T", date_of_birth: "1990-01-01T00:00:00Z", union_status: "NON_UNION" }
              as: CastingDirector
              captures: { tal_id: $.data.id }
            - call: "POST /casting/breakdowns/${br_id}/submissions"
              payload: { talent_id: "${tal_id}", expected_breakdown_version: "${br_v}" }
              as: CastingAssociate
              captures: { sub_id: $.data.id }
            - call: "POST /casting/submissions/${sub_id}/start-review"
              payload: {}
              as: CastingAssociate
            - call: "POST /casting/submissions/${sub_id}/holds"
              payload: { talent_id: "${tal_id}", hold_kind: "AVAIL", window_start: "2026-08-20T00:00:00Z", window_end: "2026-08-23T00:00:00Z", priority_rank: 1, expires_at: "2026-08-19T00:00:00Z" }
