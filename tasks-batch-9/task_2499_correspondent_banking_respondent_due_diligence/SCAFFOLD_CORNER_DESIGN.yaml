      - name: notice_period_days_adds_the_obligation_extension_to_a_commercial_exit
        claim_type: correct_result
        grounds:
          - calculations.notice_period_days
          - endpoints[POST /correspondent-banking/respondents/{respondentId}/closure-plans]
          - entities.ClosurePlan.fields.notice_period_days
        distinguishing_aspect: "COMMERCIAL carries the longest base (90) and the plan is opened with a non-zero original_obligation_cents, so OBLIGATION_EXTENSION_DAYS adds 15 for a total of 105; the respondent is UNRATED so no PROHIBITED reduction applies and the home jurisdiction is unsanctioned so the zero override never fires. Opening the plan is also what pushes the respondent into EXITING / WIND_DOWN_ONLY."
        test_recipe:
          setup: ["One DD_IN_PROGRESS respondent under DE, no existing closure plan."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /correspondent-banking/jurisdiction-profiles"
