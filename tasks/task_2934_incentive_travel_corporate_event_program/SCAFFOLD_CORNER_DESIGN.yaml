      None of the transition endpoints are idempotent: replaying shortlist on an already SHORTLISTED destination, execute on an already EXECUTED contract, review on an already QUALIFIED qualifier or site-inspection on an already INSPECTED destination each returns a 409 state error rather than silently returning the prior result, and none of them applies its side effects twice.
