  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_precondition_outranks_funding_insufficiency
        grounds:
          - validations[priority=61]
          - validations[priority=98]
          - errors.ERR_PROPERTY_NOT_IN_INVENTORY
          - calculations.maintenance_order_estimate
        distinguishing_aspect: |
          The request violates the state gate at priority 61 (the parcel is still a PROSPECT
          registry record, not inventory) and the fiscal gate at priority 98 (the 197025-cent MOW
          estimate exceeds the source's 50000 available cents) at the same time. Only the
          higher-priority state error may surface, so the response must be 409
          ERR_PROPERTY_NOT_IN_INVENTORY and never 422 ERR_FUNDING_INSUFFICIENT.
        test_recipe:
          setup:
            - "One ACTIVE funding source, restriction ANY, authorized only 50000 cents."
            - "One parcel of 100000 sqft left in PROSPECT (no acquisition packet at all), so the MOW estimate 197025 also exceeds available_cents."
            - "One non-debarred contractor whose specialties include MOW and whose licence runs past the requested window."
          setup_api_calls:
            - call: "POST /land-bank/funding-sources"
              payload: { name: "Thin Maintenance Line", source_type: "GENERAL_FUND", authorized_cents: 50000, restriction: "ANY", expires_on: "2029-12-31T00:00:00Z" }
              as: BoardClerk
              as_user_id: "clerk-1"
              captures: { fs_id: $.data.id }
            - call: "POST /land-bank/properties"
              payload: { parcel_id: "APN-100110", address: "110 Juniper Rd", situs_ward: 8, lot_area_sqft: 100000, assessed_value_cents: 500000, structure_present: false, structure_condition_grade: "C", vacancy_months: 5 }
              as: IntakeOfficer
              as_user_id: "intake-1"
              captures: { p_id: $.data.id }
            - call: "POST /land-bank/contractors"
              payload: { name: "Meadow Mowing Co", license_expires_on: "2027-12-31T00:00:00Z", max_concurrent_crews: 4, specialties: ["MOW"], debarred: false }
              as: InventoryManager
              as_user_id: "inv-1"
              captures: { ctr_id: $.data.id }
            - call: "GET /land-bank/properties/${p_id}"
              payload: {}
              as: InventoryManager
              as_user_id: "inv-1"
              captures: { p_v: $.data.version, custody_before: $.data.custody_status }
          trigger:
            - call: "POST /land-bank/properties/${p_id}/maintenance-orders"
              payload: { work_type: "MOW", contractor_id: "${ctr_id}", funding_source_id: "${fs_id}", window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-03T00:00:00Z", expected_property_version: "${p_v}" }
              as: InventoryManager
              as_user_id: "inv-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "${custody_before} == PROSPECT"
            - "HTTP 409 and ${err_id} == ERR_PROPERTY_NOT_IN_INVENTORY  # priority 61 wins"
            - "${err_id} != ERR_FUNDING_INSUFFICIENT  # priority 98 is also violated (estimate 197025 > available 50000) but must not surface"
            - "FundingSource.${fs_id}.committed_cents == 0 and FundingSource.${fs_id}.available_cents == 50000"
            - "no MaintenanceOrder exists for Property.${p_id} and Property.${p_id}.version == ${p_v}"

      - name: contractor_debarment_outranks_license_expiry
        grounds:
          - validations[priority=74]
          - validations[priority=82]
          - errors.ERR_CONTRACTOR_DEBARRED
          - errors.ERR_CONTRACTOR_LICENSE_EXPIRED
        distinguishing_aspect: |
          A different adjacent pair on the same endpoint, both inside the safety/temporal half of
          the ladder rather than state-versus-money: the contractor is debarred (priority 74) and
          the requested window also runs past its 2026-08-10 licence expiry (priority 82). The
          422 that comes back must be ERR_CONTRACTOR_DEBARRED, proving the ladder is ordered
          within the same HTTP status class and not merely between status classes.
        test_recipe:
          setup:
            - "One ACTIVE funding source, restriction ANY, authorized 1000000 cents - plenty for the 19703-cent MOW estimate."
            - "One 10000 sqft parcel acquired by donation, so its custody_status is ACQUIRED and the state gate passes."
            - "One contractor with debarred true, license_expires_on 2026-08-10, specialties [MOW, SECURE], so both the debarment and the licence checks fail for a September window."
          setup_api_calls:
            - call: "POST /land-bank/funding-sources"
              payload: { name: "Maintenance Line", source_type: "GENERAL_FUND", authorized_cents: 1000000, restriction: "ANY", expires_on: "2029-12-31T00:00:00Z" }
              as: BoardClerk
              as_user_id: "clerk-1"
              captures: { fs_id: $.data.id }
            - call: "POST /land-bank/properties"
              payload: { parcel_id: "APN-100120", address: "120 Juniper Rd", situs_ward: 8, lot_area_sqft: 10000, assessed_value_cents: 200000, structure_present: false, structure_condition_grade: "C", vacancy_months: 5 }
              as: IntakeOfficer
              as_user_id: "intake-1"
              captures: { p_id: $.data.id }
            - call: "POST /land-bank/acquisition-packets"
              payload: { property_id: "${p_id}", funding_source_id: "${fs_id}", channel: "DONATION", offer_price_cents: 0, title_search_fee_cents: 0, donor_name: "Juniper Road Trust" }
              as: IntakeOfficer
              as_user_id: "intake-1"
              captures: { pk_id: $.data.id }
            - call: "POST /land-bank/acquisition-packets/${pk_id}/board-approval"
              payload: { resolution_no: "R-2026-121" }
              as: BoardClerk
              as_user_id: "clerk-1"
            - call: "POST /land-bank/acquisition-packets/${pk_id}/close"
