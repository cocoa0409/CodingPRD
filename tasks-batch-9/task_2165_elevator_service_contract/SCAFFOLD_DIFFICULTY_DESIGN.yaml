          - entities.PenaltyAssessment.fields.service_credit_cents
          - entities.ElevatorCar.fields.car_code
          - endpoints[POST /elevator-program/penalties]
        distinguishing_aspect: |
          MODE (b) — nested rounding where the ORDER decides the cents: three cars each at 99.14%
          uptime against a 500000-cent fee give an exact per-car credit of 1433.3333..., so
