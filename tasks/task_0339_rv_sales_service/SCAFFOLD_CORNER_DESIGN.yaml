              payload: { dealership_id: "${did}", campaign_code: "RC-FORBID-1", target_class_type: "CLASS_C", target_model_year: 2024, severity: "ADVISORY" }
              as: SalesAgent
              captures: { err: $.data.error_id }
          assert:
            - "response code == 403 and error_id == ERR_FORBIDDEN_ROLE"

      - name: missing_auth_header_returns_401
        claim_type: peer_roles
        grounds:
          - 'validations[priority=1]'
          - 'errors[ERR_MISSING_AUTH]'
          - 'endpoints["POST /customers"]'
        distinguishing_aspect: "A request without valid auth headers returns ERR_MISSING_AUTH (401) before any role check."
