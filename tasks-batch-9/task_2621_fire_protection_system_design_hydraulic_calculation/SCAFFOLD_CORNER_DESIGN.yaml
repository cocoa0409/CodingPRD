          setup:
            - "Project FP-2601 with HC-1 CONVERGED then QC_PASSED by Priya Nair; ledger 1380.0 + 750.0 == 2130.0"
            - "RAW_TEST evaluation on H-14: design_demand_gpm 2130.0, required 55.54 psi, available 65.54 psi, margin 10.00, ADEQUATE"
