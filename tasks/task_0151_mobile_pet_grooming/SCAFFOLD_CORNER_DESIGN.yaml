scaffold_corner_design:

  # =========================================================================
  - section: entities
    instances:
      - name: create_pet_returns_201_with_computed_fields
        claim_type: Creation
        grounds:
          - entities.Pet.fields.customer_id
          - entities.Pet.fields.breed_id
          - entities.Pet.fields.muzzle_required
          - entities.Pet.fields.vaccination_status
        distinguishing_aspect: "POST /pets with required fields returns 201; muzzle_required defaults false (CALM) and vaccination_status defaults EXPIRED (no records)."
        test_recipe:
          setup:
            - "A breed and a customer exist."
          setup_api_calls:
            - call: "POST /breeds"
              payload: { name: "Beagle", coat_type: "SMOOTH", size_class: "MEDIUM", base_service_minutes: 60 }
              as: PlatformAdmin
              captures: { breed_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "ce1@x.com", full_name: "CE One", service_zip: "10001" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /pets"
              payload: { customer_id: "${cust_id}", breed_id: "${breed_id}", name: "Rex", weight_lbs: 30 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { pet_id: $.data.id, muzzle: $.data.muzzle_required, vax: $.data.vaccination_status }
          assert:
            - "Response code 201; Pet.${pet_id}.muzzle_required == false."
            - "Pet.${pet_id}.vaccination_status == EXPIRED."

      - name: aggressive_pet_muzzle_required_true_on_create
        claim_type: Computed Fields
        grounds:
          - entities.Pet.fields.behavioral_flag
          - entities.Pet.fields.muzzle_required
        distinguishing_aspect: "Creating a pet with behavioral_flag AGGRESSIVE yields computed muzzle_required == true; the input is derived, not client-set."
        test_recipe:
          setup: ["A breed and customer exist."]
          setup_api_calls:
            - call: "POST /breeds"
              payload: { name: "Mastiff", coat_type: "SMOOTH", size_class: "GIANT", base_service_minutes: 70 }
              as: PlatformAdmin
              captures: { breed_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "ce2@x.com", full_name: "CE Two", service_zip: "10002" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /pets"
              payload: { customer_id: "${cust_id}", breed_id: "${breed_id}", name: "Killer", weight_lbs: 90, behavioral_flag: "AGGRESSIVE" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { muzzle: $.data.muzzle_required }
          assert:
            - "Pet.muzzle_required == true on the create response."

      - name: patch_pet_behavioral_flag_reconciles_muzzle
        claim_type: Computed Fields
        grounds:
          - entities.Pet.fields.behavioral_flag
          - entities.Pet.fields.muzzle_required
        distinguishing_aspect: "PATCH /pets changing behavioral_flag CALM->AGGRESSIVE re-derives muzzle_required to true (derived-field reconciliation on update)."
        test_recipe:
          setup: ["A CALM pet (muzzle_required false) exists."]
          setup_api_calls:
            - call: "POST /breeds"
              payload: { name: "Shepherd", coat_type: "DOUBLE", size_class: "LARGE", base_service_minutes: 60 }
              as: PlatformAdmin
              captures: { breed_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "ce3@x.com", full_name: "CE Three", service_zip: "10003" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /pets"
              payload: { customer_id: "${cust_id}", breed_id: "${breed_id}", name: "Max", weight_lbs: 50, behavioral_flag: "CALM" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { pet_id: $.data.id }
          trigger:
            - call: "PATCH /pets/${pet_id}"
              payload: { behavioral_flag: "AGGRESSIVE" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { muzzle: $.data.muzzle_required }
          assert:
            - "Pet.${pet_id}.muzzle_required == true after the PATCH."

      - name: get_nonexistent_pet_returns_not_found
        claim_type: Not Found
        grounds:
          - entities.Pet
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /pets/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /pets/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_NOT_FOUND, HTTP 404."

      - name: create_pet_missing_required_field_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Pet.fields.weight_lbs
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /pets missing required weight_lbs returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["A breed and customer exist."]
          setup_api_calls:
            - call: "POST /breeds"
              payload: { name: "Poodle", coat_type: "CURLY", size_class: "MEDIUM", base_service_minutes: 55 }
              as: PlatformAdmin
              captures: { breed_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "ce4@x.com", full_name: "CE Four", service_zip: "10004" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /pets"
              payload: { customer_id: "${cust_id}", breed_id: "${breed_id}", name: "NoWeight" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_INVALID_REQUEST, HTTP 422."

      - name: create_breed_invalid_coat_enum_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.Breed.fields.coat_type
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /breeds with coat_type not in {SMOOTH,DOUBLE,CURLY,WIRE,HAIRLESS} returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /breeds"
              payload: { name: "Bad", coat_type: "FLUFFY", size_class: "MEDIUM", base_service_minutes: 60 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_INVALID_REQUEST, HTTP 422."

      - name: vaccination_record_immutable_no_version
        claim_type: Immutability
        grounds:
          - entities.VaccinationRecord
          - entities.VaccinationRecord.fields.expires_on
        distinguishing_aspect: "VaccinationRecord has common_fields:false — it exposes id and created_at only, with no version field and no update endpoint."
        test_recipe:
          setup: ["A pet with one uploaded vaccination record."]
          setup_api_calls:
            - call: "POST /breeds"
              payload: { name: "Vizsla", coat_type: "SMOOTH", size_class: "MEDIUM", base_service_minutes: 50 }
              as: PlatformAdmin
              captures: { breed_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "ce5@x.com", full_name: "CE Five", service_zip: "10005" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /pets"
              payload: { customer_id: "${cust_id}", breed_id: "${breed_id}", name: "Vee", weight_lbs: 40 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { pet_id: $.data.id }
            - call: "POST /pets/${pet_id}/vaccinations"
              payload: { vaccine_type: "RABIES", issued_on: "2026-01-01T00:00:00Z", expires_on: "2027-01-01T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { vax_id: $.data.id }
          trigger:
            - call: "GET /pets/${pet_id}/vaccinations"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { first_id: "$.data[0].id" }
          assert:
            - "The vaccination record exposes id and created_at; no version field is present (common_fields:false)."

      - name: list_customer_pets_paginated
        claim_type: Listing
        grounds:
          - entities.Pet.fields.customer_id
        distinguishing_aspect: "GET /customers/{id}/pets returns a paginated Pet[] with total_count and has_more in meta."
        test_recipe:
          setup: ["A customer with two pets."]
          setup_api_calls:
            - call: "POST /breeds"
              payload: { name: "Cattle", coat_type: "SMOOTH", size_class: "MEDIUM", base_service_minutes: 50 }
              as: PlatformAdmin
              captures: { breed_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "ce6@x.com", full_name: "CE Six", service_zip: "10006" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /pets"
              payload: { customer_id: "${cust_id}", breed_id: "${breed_id}", name: "P1", weight_lbs: 20 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /pets"
              payload: { customer_id: "${cust_id}", breed_id: "${breed_id}", name: "P2", weight_lbs: 25 }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "GET /customers/${cust_id}/pets"
              payload: { limit: 10, offset: 0 }
              as: Customer
              as_user_id: "${cust_id}"
          assert:
            - "Response is a Pet[] of length 2; pagination meta total_count == 2, has_more == false."

  # =========================================================================
  - section: state_machines
    instances:
      - name: quote_from_completed_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Appointment
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Issuing a quote on a COMPLETED appointment is not a declared transition; returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A COMPLETED appointment."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /service-tiers"
              payload: { code: "FULL_GROOM", base_price_cents: 6000, duration_multiplier: 1.00 }
              as: PlatformAdmin
              captures: { tier_id: $.data.id }
            - call: "POST /breeds"
              payload: { name: "Whippet", coat_type: "SMOOTH", size_class: "MEDIUM", base_service_minutes: 50 }
              as: PlatformAdmin
              captures: { breed_id: $.data.id }
            - call: "POST /groomers"
              payload: { email: "cg1@x.com", full_name: "CG One", skill_level: "SENIOR", handles_aggressive: true, status: "AVAILABLE" }
              as: PlatformAdmin
              captures: { groomer_id: $.data.id }
            - call: "POST /vans"
              payload: { label: "CVAN-1", max_stops: 5 }
              as: PlatformAdmin
              captures: { van_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "ce7@x.com", full_name: "CE Seven", service_zip: "10007" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /pets"
              payload: { customer_id: "${cust_id}", breed_id: "${breed_id}", name: "Zip", weight_lbs: 30 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { pet_id: $.data.id }
            - call: "POST /pets/${pet_id}/vaccinations"
              payload: { vaccine_type: "RABIES", issued_on: "2026-01-01T00:00:00Z", expires_on: "2027-01-01T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /route-days"
              payload: { van_id: "${van_id}", service_date: "2026-07-01T00:00:00Z", window_start: "2026-07-01T09:00:00Z", window_end: "2026-07-01T17:00:00Z", coverage_zip: "10007" }
              as: Dispatcher
              captures: { rd_id: $.data.id, rd_v0: $.data.version }
            - call: "POST /appointments"
              payload: { pet_id: "${pet_id}", service_tier_id: "${tier_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { appt_id: $.data.id }
            - call: "POST /appointments/${appt_id}/quote"
              payload: {}
              as: Dispatcher
            - call: "POST /appointments/${appt_id}/schedule"
              payload: { route_day_id: "${rd_id}", slot_start: "2026-07-01T09:30:00Z", expected_route_day_version: "${rd_v0}" }
              as: Dispatcher
            - call: "POST /appointments/${appt_id}/complete"
              payload: {}
              as: Groomer
              as_user_id: "${groomer_id}"
          trigger:
            - call: "POST /appointments/${appt_id}/quote"
              payload: {}
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_INVALID_STATE, HTTP 409."

      - name: cancel_terminal_appointment_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Appointment
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Cancelling an already-CANCELLED appointment is rejected with ERR_INVALID_STATE; no side effects fire."
        test_recipe:
          setup: ["A CANCELLED appointment (cancelled from REQUESTED)."]
          setup_api_calls:
            - call: "POST /service-tiers"
              payload: { code: "FULL_GROOM", base_price_cents: 6000, duration_multiplier: 1.00 }
              as: PlatformAdmin
              captures: { tier_id: $.data.id }
            - call: "POST /breeds"
              payload: { name: "Basset", coat_type: "SMOOTH", size_class: "MEDIUM", base_service_minutes: 50 }
              as: PlatformAdmin
              captures: { breed_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "ce8@x.com", full_name: "CE Eight", service_zip: "10008" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /pets"
              payload: { customer_id: "${cust_id}", breed_id: "${breed_id}", name: "Lou", weight_lbs: 30 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { pet_id: $.data.id }
            - call: "POST /appointments"
              payload: { pet_id: "${pet_id}", service_tier_id: "${tier_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { appt_id: $.data.id }
            - call: "POST /appointments/${appt_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /appointments/${appt_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_INVALID_STATE, HTTP 409."

      - name: new_appointment_starts_in_requested
        claim_type: Initial State
        grounds:
          - state_machines.Appointment
          - entities.Appointment.fields.status
        distinguishing_aspect: "A freshly created appointment is in status REQUESTED with quote_round 0."
        test_recipe:
          setup: ["A pet and tier exist."]
          setup_api_calls:
            - call: "POST /service-tiers"
              payload: { code: "FULL_GROOM", base_price_cents: 6000, duration_multiplier: 1.00 }
              as: PlatformAdmin
              captures: { tier_id: $.data.id }
            - call: "POST /breeds"
              payload: { name: "Dane", coat_type: "SMOOTH", size_class: "GIANT", base_service_minutes: 60 }
              as: PlatformAdmin
              captures: { breed_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "ce9@x.com", full_name: "CE Nine", service_zip: "10009" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /pets"
              payload: { customer_id: "${cust_id}", breed_id: "${breed_id}", name: "Titan", weight_lbs: 120 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { pet_id: $.data.id }
          trigger:
            - call: "POST /appointments"
              payload: { pet_id: "${pet_id}", service_tier_id: "${tier_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { st: $.data.status, qr: $.data.quote_round }
          assert:
            - "Appointment status == REQUESTED, quote_round == 0."

      - name: error_vaccination_required_on_quote
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Appointment.REQUESTED_to_QUOTED
          - validations[priority=7]
          - errors[ERR_VACCINATION_REQUIRED]
        distinguishing_aspect: "Quoting a pet with no valid RABIES record fails ERR_VACCINATION_REQUIRED (422); the appointment stays REQUESTED."
        test_recipe:
          setup: ["A pet with NO vaccination record at all."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-02T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /service-tiers"
              payload: { code: "FULL_GROOM", base_price_cents: 6000, duration_multiplier: 1.00 }
              as: PlatformAdmin
              captures: { tier_id: $.data.id }
            - call: "POST /breeds"
              payload: { name: "Akita", coat_type: "DOUBLE", size_class: "LARGE", base_service_minutes: 60 }
              as: PlatformAdmin
              captures: { breed_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "ce10@x.com", full_name: "CE Ten", service_zip: "10010" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /pets"
              payload: { customer_id: "${cust_id}", breed_id: "${breed_id}", name: "Kuma", weight_lbs: 70 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { pet_id: $.data.id }
            - call: "POST /appointments"
              payload: { pet_id: "${pet_id}", service_tier_id: "${tier_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { appt_id: $.data.id }
          trigger:
            - call: "POST /appointments/${appt_id}/quote"
              payload: {}
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_VACCINATION_REQUIRED, HTTP 422; appointment remains REQUESTED."

      - name: schedule_from_requested_unquoted_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Appointment.QUOTED_to_SCHEDULED
          - validations[priority=5]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Scheduling an appointment still in REQUESTED (never quoted), onto a real route day, fails ERR_INVALID_STATE — schedule requires QUOTED."
        test_recipe:
          setup: ["A REQUESTED appointment and a valid OPEN route day matching the owner ZIP."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-03T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /service-tiers"
              payload: { code: "FULL_GROOM", base_price_cents: 6000, duration_multiplier: 1.00 }
              as: PlatformAdmin
              captures: { tier_id: $.data.id }
            - call: "POST /breeds"
              payload: { name: "Cocker", coat_type: "CURLY", size_class: "MEDIUM", base_service_minutes: 55 }
              as: PlatformAdmin
              captures: { breed_id: $.data.id }
            - call: "POST /groomers"
              payload: { email: "cg2@x.com", full_name: "CG Two", skill_level: "SENIOR", handles_aggressive: true, status: "AVAILABLE" }
              as: PlatformAdmin
              captures: { groomer_id: $.data.id }
            - call: "POST /vans"
              payload: { label: "CVAN-2", max_stops: 5 }
              as: PlatformAdmin
              captures: { van_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "ce11@x.com", full_name: "CE Eleven", service_zip: "10011" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /pets"
              payload: { customer_id: "${cust_id}", breed_id: "${breed_id}", name: "Goldie", weight_lbs: 30 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { pet_id: $.data.id }
            - call: "POST /pets/${pet_id}/vaccinations"
              payload: { vaccine_type: "RABIES", issued_on: "2026-01-01T00:00:00Z", expires_on: "2027-01-01T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /route-days"
              payload: { van_id: "${van_id}", service_date: "2026-07-03T00:00:00Z", window_start: "2026-07-03T09:00:00Z", window_end: "2026-07-03T17:00:00Z", coverage_zip: "10011" }
              as: Dispatcher
              captures: { rd_id: $.data.id, rd_v0: $.data.version }
            - call: "POST /appointments"
              payload: { pet_id: "${pet_id}", service_tier_id: "${tier_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { appt_id: $.data.id }
          trigger:
            - call: "POST /appointments/${appt_id}/schedule"
              payload: { route_day_id: "${rd_id}", slot_start: "2026-07-03T09:30:00Z", expected_route_day_version: "${rd_v0}" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_INVALID_STATE, HTTP 409; appointment remains REQUESTED."

  # =========================================================================
  - section: calculations
    instances:
      - name: no_show_fee_cap_applied
        claim_type: Constants Applied
        grounds:
          - calculations.no_show_fee
          - entities.FeeCharge.fields.amount_cents
        distinguishing_aspect: "With quoted_price 18000 and 2 prior strikes, raw fee 9000+1500=10500 is capped to NO_SHOW_FEE_CAP_CENTS == 8000."
        test_recipe:
          setup:
            - "A customer with 2 prior strikes; a third SHOW_CUT appointment quoted at 18000 then no-showed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-04T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /service-tiers"
              payload: { code: "FULL_GROOM", base_price_cents: 6000, duration_multiplier: 1.00 }
              as: PlatformAdmin
              captures: { tier_small: $.data.id }
            - call: "POST /service-tiers"
              payload: { code: "SHOW_CUT", base_price_cents: 18000, duration_multiplier: 2.00 }
              as: PlatformAdmin
              captures: { tier_big: $.data.id }
            - call: "POST /breeds"
              payload: { name: "Afghan", coat_type: "CURLY", size_class: "LARGE", base_service_minutes: 50 }
              as: PlatformAdmin
              captures: { breed_id: $.data.id }
            - call: "POST /groomers"
              payload: { email: "cg3@x.com", full_name: "CG Three", skill_level: "SENIOR", handles_aggressive: true, status: "AVAILABLE" }
              as: PlatformAdmin
              captures: { groomer_id: $.data.id }
            - call: "POST /vans"
              payload: { label: "CVAN-3", max_stops: 6, has_show_equipment: true }
              as: PlatformAdmin
              captures: { van_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "ce12@x.com", full_name: "CE Twelve", service_zip: "10012" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /pets"
              payload: { customer_id: "${cust_id}", breed_id: "${breed_id}", name: "Show", weight_lbs: 40 }
              as: Customer
              as_user_id: "${cust_id}"
