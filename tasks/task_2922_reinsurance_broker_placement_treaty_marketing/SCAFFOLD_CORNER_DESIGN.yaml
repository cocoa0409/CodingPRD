      - name: fiduciary_outflow_and_program_settlement_ceilings_reject_then_admit_exact_equality
        claim_type: Violation → Error
        grounds:
          - validations[priority=71]
          - validations[priority=72]
          - validations[priority=21]
          - calculations.fiduciary_holding
          - errors.ERR_INSUFFICIENT_FIDUCIARY_BALANCE
          - errors.ERR_PROGRAM_HAS_OPEN_TRANSACTIONS
        distinguishing_aspect: |
          Both ceilings are inclusive and both are evaluated at the LATEST moment, not at booking: an
          outflow of 60000000 is booked and approved happily against a balance of 50000000 and only
          refused at settle, and the refusal leaves it APPROVED — which is precisely what then blocks
          program settlement. Topping the account up to exactly 60000000 lets the same movement settle
          (equality is allowed, draining the account to exactly 0), after which the program settles.
          The naive implementation checks the balance when the movement is booked and never re-checks.
