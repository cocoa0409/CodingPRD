              as: FilmOfficeCoordinator
              captures: { dept_pol_id: $.data.id }
            - call: "POST /street-segments"
              payload: { segment_code: "S1", name: "S1", length_m: 70 }
              as: FilmOfficeCoordinator
              captures: { seg1_id: $.data.id }
            - call: "POST /street-segments"
              payload: { segment_code: "S2", name: "S2", length_m: 70 }
              as: FilmOfficeCoordinator
              captures: { seg2_id: $.data.id }
            - call: "POST /applications"
              payload: { production_company_id: "${pc_id}", title: "Rej", synopsis: "x", shoot_start_at: "2026-06-01T06:00:00Z", shoot_end_at: "2026-06-01T20:00:00Z", crew_size: 5, requires_road_closure: true }
              as: ProductionCompany
              as_user_id: "${pc_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/location-details"
              payload: { address: "1 S", geo_zone: "Z8", activity_type: "FILMING", requested_start_at: "2026-06-01T06:00:00Z", requested_end_at: "2026-06-01T20:00:00Z", uses_road_closure: true }
              as: ProductionCompany
              as_user_id: "${pc_id}"
            - call: "POST /road-closure-bookings"
              payload: { application_id: "${app_id}", street_segment_id: "${seg1_id}", closure_start_at: "2026-06-01T08:00:00Z", closure_end_at: "2026-06-01T12:00:00Z" }
              as: ProductionCompany
              as_user_id: "${pc_id}"
              captures: { b1_id: $.data.id }
            - call: "POST /road-closure-bookings"
              payload: { application_id: "${app_id}", street_segment_id: "${seg2_id}", closure_start_at: "2026-06-01T08:00:00Z", closure_end_at: "2026-06-01T12:00:00Z" }
