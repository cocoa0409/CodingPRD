              captures: { si18: $.data.id }
            - call: "POST /fountain-network/telemetry-readings"
              payload: { dispenser_unit_id: "${du18}", supply_item_id: "${si18}", dispensed_ounces: 7000, reading_at: "2026-07-31T00:00:00Z", window_days: 7, source: "TELEMETRY" }
              as: SupplyPlanner
            - call: "POST /fountain-network/supply-positions"
              payload: { outlet_id: "${o18}", supply_item_id: "${si18}", on_hand_units: 6 }
              as: SupplyPlanner
              captures: { sp18: $.data.id }
            - call: "POST /fountain-network/supply-positions/${sp18}/forecast"
              payload: { variant: "TRAILING_ACTUAL", window_days: 7 }
              as: SupplyPlanner
              captures: { req18: $.data.requested_units, alert18: $.data.alert_level }
            - call: "POST /fountain-network/replenishment-routes"
              payload: { route_code: "RT-CI-1", depot_region_code: "R18", service_date: "2026-08-02T00:00:00Z", van_code: "V-21", capacity_units: 500 }
              as: SupplyPlanner
              captures: { rt18: $.data.id, rt18v1: $.data.version }
            - call: "POST /fountain-network/replenishment-routes/${rt18}/stops"
              payload: { outlet_id: "${o18}", sequence_index: 1, window_start: "2026-08-02T08:00:00Z", window_end: "2026-08-02T10:00:00Z", expected_route_version: "${rt18v1}" }
              as: SupplyPlanner
              captures: { st18: $.data.id }
            - call: "POST /fountain-network/route-stops/${st18}/allocations"
              payload: { supply_position_ids: ["${sp18}"] }
              as: SupplyPlanner
              captures: { alloc18: $.data.total_allocated_units, pos_count18: $.data.allocated_position_count }
            - call: "GET /fountain-network/replenishment-routes/${rt18}"
              payload: {}
              as: SupplyPlanner
              captures: { rt18v2: $.data.version }
          trigger:
            - call: "POST /fountain-network/replenishment-routes/${rt18}/cancel"
              payload: { expected_route_version: "${rt18v2}", reason_code: "DEPOT_OUTAGE" }
              as: SupplyPlanner
              captures: { rt18_status: $.data.status, committed18: $.data.committed_units }
          assert:
            - "Before the trigger: ${req18} == 34, ${alert18} == CRITICAL, ${alloc18} == 32, ${pos_count18} == 1, ${rt18v2} == 3"
            - "Before the trigger: SupplyItem.${si18}.reserved_pool_units == 32 == OutletSupplyPosition.${sp18}.allocated_units and ReplenishmentRoute.${rt18}.committed_units == 32"
            - "${rt18_status} == CANCELLED and ${committed18} == 0"
            - "RouteStop.${st18}.status == SKIPPED with skip_reason_code == ACCESS_DENIED and delivered_units == 0"
            - "OutletSupplyPosition.${sp18}.allocated_units == 0, planned_route_stop_id == null, on_hand_units == 6, requested_units == 34"
            - "SupplyItem.${si18}.reserved_pool_units == 0 == SUM(OutletSupplyPosition.allocated_units WHERE supply_item_id == ${si18})"
            - "SupplyItem.${si18}.national_allocation_units == 1000 (the pool ceiling is never rewritten by allocate or release)"
            - "ReplenishmentRoute.${rt18}.delivered_units == 0"
