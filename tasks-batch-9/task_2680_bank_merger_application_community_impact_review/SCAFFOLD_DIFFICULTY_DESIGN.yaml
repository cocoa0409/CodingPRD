            - "error_id != ERR_PRO_FORMA_CAPITAL_INSUFFICIENT"
            - "ProFormaCapitalSchedule.${sch_bad_id}.status == CURRENT"
            - "ProFormaCapitalSchedule.${sch_bad_id}.pro_forma_cet1_ratio_pct == 0.28"
            - "ProFormaCapitalSchedule.${sch_bad_id}.pro_forma_tier1_leverage_pct == 0.61"
            - "ProFormaCapitalSchedule.${sch_bad_id}.capital_adequacy_flag == UNDERCAPITALIZED"
            - "ProFormaCapitalSchedule.${sch_good_id}.status == SUPERSEDED"
            - "MergerApplication.${app_id}.filing_status == SUBMITTED"

