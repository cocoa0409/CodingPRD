            - { call: "POST /loans/${l_id}/properties", payload: { address: "1 Esc St", property_type: "OFFICE", appraised_value_cents: 1000000000, appraisal_date: "2026-06-01T00:00:00Z" }, as: MasterServicer, captures: { p_id: $.data.id } }
            - { call: "POST /loans/${l_id}/reserve-accounts", payload: { account_type: "TI_LC", target_balance_cents: 0 }, as: MasterServicer, captures: { r_id: $.data.id } }
            - { call: "POST /reserve-accounts/${r_id}/deposits", payload: { amount_cents: 1000000 }, as: MasterServicer, captures: { r_v2: $.data.version } }
            - { call: "POST /reserve-accounts/${r_id}/disbursement-requests", payload: { purpose: "CAPITAL_REPAIR", line_items: [ { description: "d1", amount_cents: 100000 } ], expected_reserve_account_version: "${r_v2}" }, as: Borrower, as_user_id: "${b_id}", captures: { d1_id: $.data.id } }
            - { call: "GET /reserve-accounts/${r_id}", as: MasterServicer, captures: { r_v3: $.data.version } }
            - { call: "POST /reserve-accounts/${r_id}/disbursement-requests", payload: { purpose: "TENANT_IMPROVEMENT", line_items: [ { description: "d2", amount_cents: 200000 } ], expected_reserve_account_version: "${r_v3}" }, as: Borrower, as_user_id: "${b_id}", captures: { d2_id: $.data.id } }
            - { call: "POST /disbursement-requests/${d2_id}/review", payload: { decision: "APPROVE" }, as: MasterServicer }
            - { call: "POST /loans/${l_id}/extension-options", payload: { option_seq: 1, exercise_window_start: "2026-12-01T00:00:00Z", exercise_window_end: "2027-03-01T00:00:00Z", extension_months: 12, fee_pct: 0.0025 }, as: MasterServicer, captures: { e_id: $.data.id } }
            - { call: "POST /inspectors", payload: { full_name: "Esc Spect", license_no: "LIC-ESC" }, as: MasterServicer, captures: { i_id: $.data.id } }
            - { call: "POST /properties/${p_id}/inspections", payload: { inspector_id: "${i_id}", scheduled_start: "2026-08-01T09:00:00Z", scheduled_end: "2026-08-01T10:00:00Z" }, as: MasterServicer, captures: { in_id: $.data.id } }
            - { call: "POST /inspections/${in_id}/close", payload: { outcome: "COMPLETED", condition_rating: "POOR" }, as: Inspector, as_user_id: "${i_id}" }
            - { call: "GET /loans/${l_id}/watchlist-entries", as: MasterServicer, captures: { w_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /watchlist-entries/${w_id}/escalate", as: MasterServicer, payload: {}, captures: { w_st: $.data.status } }
            - { call: "GET /loans/${l_id}", as: MasterServicer, captures: { l_srv: $.data.servicing_status } }
            - { call: "GET /reserve-accounts/${r_id}", as: MasterServicer, captures: { r_frozen: $.data.disbursement_frozen, r_held: $.data.held_cents } }
            - { call: "GET /reserve-accounts/${r_id}/disbursement-requests", as: MasterServicer, captures: { d1_st: "$.data[0].status" } }
            - { call: "GET /loans/${l_id}/extension-options", as: MasterServicer, captures: { e_st: "$.data[0].status" } }
          assert:
            - "entry status == ESCALATED; loan.servicing_status == SPECIAL_SERVICING"
            - "reserve.disbursement_frozen == true and elevated_retainage stays true"
            - "draw1 (was SUBMITTED) auto-REJECTED; draw2 (was APPROVED) auto-CANCELLED"
            - "held_cents == 0 after cascade (200000 hold released); balance_cents unchanged 1000000"
            - "extension option AVAILABLE -> SUSPENDED"
      - name: reinstate_restores_performing_and_unsuspends
        claim_type: valid_transition
        grounds:
          - "state_machines.Loan.SPECIAL_SERVICING_to_PERFORMING"
          - "state_machines.ExtensionOption.SUSPENDED_to_AVAILABLE"
        distinguishing_aspect: "Successful reinstatement: SPECIAL_SERVICING -> PERFORMING, reserves unfrozen and de-elevated, SUSPENDED option with open window -> AVAILABLE."
        test_recipe:
          setup: ["loan escalated to SPECIAL_SERVICING via POOR-inspection entry (now ESCALATED terminal); reserve target 0 (balance 0 satisfies); option SUSPENDED with window [2026-12-01, 2027-03-01]; payment CURRENT; no assessments"]
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "Rein Co", tax_id: "TX-REI", contact_email: "rei@x.com" }, as: MasterServicer, captures: { b_id: $.data.id } }
