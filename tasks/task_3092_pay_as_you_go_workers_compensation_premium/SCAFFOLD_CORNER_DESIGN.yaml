  # ===========================================================================
  - section: cross_cutting_layers
    instances:

      - name: occ_stale_version_on_dispute_decide_happy_path_then_stale
        claim_type: optimistic_concurrency
        grounds: ['concurrency_rules.dispute-decide-stale-policy', 'endpoints.POST_/wc/disputes/{id}/decide']
        distinguishing_aspect: "Covered with a deliberately stale expression in the §1.8 priority instance."
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / dispute_decide_sod_vs_stale_version_priority
          rationale: "Same write endpoint, same occ_field, same error; that instance exercises the stale path and this corner adds nothing beyond it. The happy path of decide-with-current-version is exercised by dispute_approval_supersede_reinvoice_adjustment_chain."

      - name: occ_version_increments_on_every_policy_mutation
        claim_type: optimistic_concurrency
        grounds: ['concurrency_rules.dispute-decide-stale-policy', 'entities.Policy']
        distinguishing_aspect: "Policy.version starts at 1 on create and increments by exactly 1 per mutation: bind (+1) and report acceptance (+1) move it to 3, observable via GET."
        test_recipe:
          setup: ["CA table; employer; policy created."]
          setup_api_calls:
            - *cd_ca
            - *cd_emp
            - call: "POST /wc/policies"
              payload: { employer_id: "${cd_emp_id}", policy_number: "WC-VER-001", effective_date: "2026-09-01T00:00:00Z", expiry_date: "2027-09-01T00:00:00Z", experience_mod: 1.0, class_codes: [{state_code: "CA", class_code: "8810", estimated_annual_payroll_cents: 1000000}] }
              as: Underwriter
              captures: { cd_ver_pol: $.data.id, cd_ver_v0: $.data.version }
          trigger:
            - call: "POST /wc/policies/${cd_ver_pol}/bind"
              payload: {}
              as: Underwriter
            - call: "POST /wc/payroll-reports"
              payload: { policy_id: "${cd_ver_pol}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-08T00:00:00Z", idempotency_key: "ver-run-1", lines: [{state_code: "CA", class_code: "8810", gross_wages_cents: 10000000, ot_premium_cents: 0, severance_cents: 0, executive_wages_cents: 0, headcount: 1}] }
              as: PayrollProvider
            - call: "GET /wc/policies/${cd_ver_pol}"
              as: Underwriter
              captures: { cd_ver_v2: $.data.version }
          assert:
            - "version at create == 1"
            - "version after bind + one accepted report == 3 (exactly one increment per mutation)"

      - name: cascading_side_effects_full_chain
        claim_type: cascading_side_effects
        grounds: ['state_machines.ClassCodeDispute.UNDER_REVIEW_to_APPROVED']
        distinguishing_aspect: "Covered end-to-end by the §1.8 cascade instances."
        excluded_because:
          difficulty_instance: transitive_cascade / dispute_approval_supersede_reinvoice_adjustment_chain
          rationale: "That instance verifies the 4-hop chain including VOID, replacement, and adjustment side effects."

      - name: dual_variant_layer_coverage
        claim_type: dual_variant_calculation
        grounds: ['calculations.invoice_total', 'calculations.audit_variance']
        distinguishing_aspect: "Both dual-variant calculations are asserted with pinned divergent literals."
        excluded_because:
          difficulty_instance: dual_variant_calc / issuance_estimate_vs_actual_payroll_invoice_diverge
          rationale: "Both variants of both calculations are exercised by the two §1.8 dual_variant_calc instances."

      - name: threshold_boundaries_layer_coverage
        claim_type: rate_threshold_triggers
        grounds: ['calculations.cancellation_clock', 'calculations.invoice_total']
        distinguishing_aspect: "Inclusive day-count thresholds and the strict minimum-premium threshold are both asserted at their exact boundaries."
        excluded_because:
          difficulty_instance: boundary_precision_check / minimum_premium_substitution_strictly_less_than
          rationale: "That instance pins the strictly-less-than substitution boundary; cancellation_clock_inclusive_boundaries (calculations section) pins the inclusive day-count boundary."

      - name: scheduled_deferred_retro_effective_dating
        claim_type: scheduled_actions
        grounds: ['entities.ClassCodeDispute.fields.effective_from', 'calculations.retro_adjustment_delta']
        distinguishing_aspect: "The retro reassignment takes effect from a past date selected at filing time; the cascade only touches reports intersecting [effective_from, expiry) — a report BEFORE effective_from is untouched."
