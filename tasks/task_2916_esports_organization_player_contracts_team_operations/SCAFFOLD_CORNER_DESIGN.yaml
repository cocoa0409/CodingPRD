        claim_type: Priority conflict
        grounds:
          - validations[priority=8]
          - validations[priority=13]
          - errors[ERR_OFFER_EXPIRED]
          - errors[ERR_SALARY_CAP_EXCEEDED]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / expired_offer_state_error_outranks_salary_cap_fiscal_error_on_acceptance
          rationale: "That §1.8 instance builds one call that violates both the priority-8 lazy-expiry rule and the priority-13 cap rule and asserts ERR_OFFER_EXPIRED, then repairs only the expiry to expose ERR_SALARY_CAP_EXCEEDED."

      - name: weekly_hour_cap_error_outranks_the_facility_slot_error
        claim_type: Priority conflict
        grounds:
          - validations[priority=9]
          - validations[priority=11]
          - errors[ERR_WEEKLY_HOUR_CAP_EXCEEDED]
          - errors[ERR_FACILITY_SLOT_CONFLICT]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / weekly_hour_cap_safety_error_outranks_facility_slot_constraint_error
          rationale: "That §1.8 instance files one block that breaks both the weekly cap and the room buffer and asserts the safety error, then shortens the block to expose ERR_FACILITY_SLOT_CONFLICT."

