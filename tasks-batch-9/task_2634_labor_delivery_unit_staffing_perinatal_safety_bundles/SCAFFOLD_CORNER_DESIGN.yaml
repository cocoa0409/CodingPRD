          trigger:
            - call: POST /fetal-monitoring-assessments
              payload: { encounter_id: "${enc_id}", interpreted_by_staff_id: "${rn_charge}", category: "CATEGORY_II", baseline_rate_bpm: 145, variability: "MINIMAL", assessed_at: "2026-08-01T05:00:00Z" }
              as: ChargeNurse
              as_user_id: "charge-nurse-01"
              captures: { e_stamp: $.data.error_id }
            - call: POST /fetal-monitoring-assessments
              payload: { encounter_id: "${enc_id}", interpreted_by_staff_id: "${rn_charge}", category: "CATEGORY_II", baseline_rate_bpm: 145, variability: "MINIMAL" }
              as: ChargeNurse
              as_user_id: "charge-nurse-01"
              captures: { assess_id: $.data.id, assess_status0: $.data.escalation_status, assess_due: $.data.escalation_due_at }
            - call: POST /fetal-monitoring-assessments/${assess_id}/resolve
              payload: {}
              as: ObstetricianAttending
              as_user_id: "ob-attending-01"
              captures: { e_not_started: $.data.error_id }
            - call: POST /fetal-monitoring-assessments/${assess_id}/escalate
              payload: { target_tier: 1, notified_staff_id: "${rn_bedside}" }
              as: BedsideNurse
              as_user_id: "bedside-nurse-01"
              captures: { e_target: $.data.error_id }
            - call: POST /fetal-monitoring-assessments/${assess_id}/escalate
              payload: { target_tier: 1, notified_staff_id: "${rn_charge}" }
