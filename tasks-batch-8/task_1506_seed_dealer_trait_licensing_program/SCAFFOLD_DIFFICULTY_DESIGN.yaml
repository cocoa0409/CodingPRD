            - "refund: prepay_balance_cents == 0; order UNPAID with net_amount_cents restored to 633600 and prepay_discount_cents == 0"
            - "prepay 2 (same terms): prepay_balance_cents == 582912, order PREPAID"
            - "after settle: prepay_balance_cents == 0 (582912 + 582912 - 582912 - 582912 == 0) and order CLOSED/SETTLED"
            - "net0 == 633600 (locked at 1200bps tier)"
