            - "AcademicProgram.${prog_id}.lifecycle_state == UNDER_REVIEW and version == 2 — only the accepted first cycle bumped it"

      - name: self_study_submit_passes_at_the_deadline_and_fails_one_second_later
        claim_type: temporal_validation
        grounds:
          - validations[priority=19]
          - errors[ERR_SELF_STUDY_WINDOW_CLOSED]
          - state_machines.SelfStudy.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          The window comparison is `clock <= self_study_due_at`, so equality
          submits. Both attempts are made on the SAME self-study: the late one
          is refused and leaves the row DRAFT, which is precisely why the
          on-time retry at exactly the due instant can still succeed.
        test_recipe:
          setup:
            - "Program HIST-BA with a cycle whose self_study_due_at is 2026-09-01T00:00:00Z and a complete DRAFT self-study."
            - "The clock is moved to 2026-09-01T00:00:01Z, one second past the deadline."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ReviewCoordinator
            - call: "POST /provost/academic-programs"
              payload: { code: "HIST-BA", name: "History BA", degree_level: "UNDERGRADUATE", department_code: "HIST" }
