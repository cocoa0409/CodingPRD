  # =================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: forbidden_role_beats_invalid_state
        grounds:
          - validations[priority=2]
          - validations[priority=5]
          - errors[ERR_FORBIDDEN_ROLE]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: >-
          Pair auth (priority 2, ERR_FORBIDDEN_ROLE) vs state (priority 5, ERR_INVALID_STATE): a RemediationVendor
          (forbidden) calling complete on a QUEUED scan (state-invalid for complete) returns the higher-priority
          ERR_FORBIDDEN_ROLE, not ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "Org+ACTIVE sub+Site; a scan in QUEUED (never started, so complete is also state-invalid)."
          setup_api_calls:
            - call: "POST /compliance/organizations"
              payload: { legal_name: "Kappa", contact_email: "k@kappa.test" }
              as: PlatformAdmin
              captures: { org_id: "$.data.id" }
            - call: "POST /compliance/subscriptions"
              payload: { organization_id: "${org_id}", tier: "MONITOR" }
              as: OrgAdmin
              as_user_id: "${org_id}"
              captures: { sub_id: "$.data.id", sub_v: "$.data.version" }
            - call: "POST /compliance/sites"
              payload: { organization_id: "${org_id}", url: "https://kappa.test", audited_page_count: 20 }
              as: OrgAdmin
              as_user_id: "${org_id}"
              captures: { site_id: "$.data.id" }
            - call: "POST /compliance/subscriptions/${sub_id}/activate"
              payload: { expected_subscription_version: "${sub_v}" }
              as: OrgAdmin
              as_user_id: "${org_id}"
            - call: "POST /compliance/scans"
              payload: { site_id: "${site_id}", wcag_target_level: "AA" }
              as: AuditEngineer
              captures: { scan_id: "$.data.id" }
          trigger:
            - call: "POST /compliance/scans/${scan_id}/complete"
              payload: { findings: [ { wcag_criterion: "1.4.3", severity: "CRITICAL" } ] }
              as: RemediationVendor
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_FORBIDDEN_ROLE"
            - "http_status == 403"

      - name: invalid_state_beats_empty_findings
        grounds:
          - validations[priority=5]
          - validations[priority=12]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_EMPTY_FINDINGS]
        distinguishing_aspect: >-
          Pair state (priority 5, ERR_INVALID_STATE) vs business_constraint (priority 12, ERR_EMPTY_FINDINGS):
          calling complete on a QUEUED scan with an empty findings[] returns the higher-priority ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "Org+ACTIVE sub+Site; a scan in QUEUED (never started)."
          setup_api_calls:
            - call: "POST /compliance/organizations"
              payload: { legal_name: "Lambda", contact_email: "l@lambda.test" }
              as: PlatformAdmin
              captures: { org_id: "$.data.id" }
            - call: "POST /compliance/subscriptions"
              payload: { organization_id: "${org_id}", tier: "SCAN" }
              as: OrgAdmin
              as_user_id: "${org_id}"
              captures: { sub_id: "$.data.id", sub_v: "$.data.version" }
            - call: "POST /compliance/sites"
              payload: { organization_id: "${org_id}", url: "https://lambda.test", audited_page_count: 8 }
              as: OrgAdmin
              as_user_id: "${org_id}"
              captures: { site_id: "$.data.id" }
            - call: "POST /compliance/subscriptions/${sub_id}/activate"
              payload: { expected_subscription_version: "${sub_v}" }
              as: OrgAdmin
              as_user_id: "${org_id}"
            - call: "POST /compliance/scans"
              payload: { site_id: "${site_id}", wcag_target_level: "A" }
              as: AuditEngineer
              captures: { scan_id: "$.data.id" }
          trigger:
            - call: "POST /compliance/scans/${scan_id}/complete"
