      - name: reverse_reachability_preorders_by_campaign
        claim_type: computed_read
        grounds: [endpoints: "GET /spirit-store/preorders", entities.PreOrder.fields.campaign_id]
        distinguishing_aspect: "GET /preorders?campaign_id returns all and only that campaign's preorders — the FK reverse channel for a cascade-created population."
        test_recipe:
          setup: ["Program ACTIVE; design APPROVED; variant M; campaign OPEN; two preorders (qty 1, qty 2) on the campaign"]
