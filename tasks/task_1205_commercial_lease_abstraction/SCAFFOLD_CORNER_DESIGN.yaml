scaffold_corner_design:
  # ==========================================================================
  # Section: entities — creation, defaults, computed/system fields, FK integrity
  # ==========================================================================
  - section: entities
    instances:
      - name: property_create_required_fields
        claim_type: creation
        grounds:
          - "entities.Property"
        distinguishing_aspect: "POST with all required fields returns 201 with all input fields and system fields (id, version=1, posture=OPERATING)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /lease-admin/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /lease-admin/properties"
              payload: { name: "P1", address: "1 Main", total_rentable_sf: 10000, fiscal_year_end_month: 12 }
              as: PlatformAdmin
              captures: { p: $.data.id, posture: $.data.posture, ver: $.data.version }
          assert:
            - "p != null"
            - "posture == OPERATING"
            - "ver == 1"

      - name: property_create_missing_required_returns_invalid_request
        claim_type: violation_to_error
        grounds:
          - "entities.Property"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "Missing required total_rentable_sf -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /lease-admin/properties"
              payload: { name: "P1", address: "1 Main", fiscal_year_end_month: 12 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: property_get_not_found
        claim_type: not_found
        grounds:
          - "entities.Property"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET with random UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /lease-admin/properties/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND"

      - name: lease_computed_fields_cached_on_create
        claim_type: computed_fields
        grounds:
          - "entities.Lease.fields.cached_annual_rent_cents"
          - "entities.Lease.fields.cached_recovery_ytd_cents"
        distinguishing_aspect: "On Lease creation, cached_annual_rent_cents == 0 and cached_recovery_ytd_cents == 0 (no schedule, no billings yet); client-supplied values ignored."
        test_recipe:
          setup: ["Property P1"]
          setup_api_calls:
            - call: "POST /lease-admin/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /lease-admin/properties"
              payload: { name: "P1", address: "1 Main", total_rentable_sf: 10000, fiscal_year_end_month: 12 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
          trigger:
            - call: "POST /lease-admin/properties/${prop_id}/leases"
              payload: { tenant_legal_name: "T1", suite: "100", leased_sf: 4000, commencement_date: "2027-01-01", expiration_date: "2027-12-31", base_rent_annual_cents: 1200000, escalation_type: NONE, recovery_structure: NNN, pro_rata_share_bps: 4000, security_deposit_cents: 0 }
              as: PortfolioManager
              captures: { lid: $.data.id, cached_rent: $.data.cached_annual_rent_cents, cached_rec: $.data.cached_recovery_ytd_cents, status: $.data.status, abs: $.data.abstraction_status, bill: $.data.billing_posture }
          assert:
            - "cached_rent == 0"
            - "cached_rec == 0"
            - "status == DRAFT"
            - "abs == PENDING"
            - "bill == CURRENT"

      - name: escalation_step_conditional_required_pct_bps
        claim_type: required_fields
        grounds:
          - "entities.EscalationStep.fields.pct_bps"
        distinguishing_aspect: "kind=FIXED_PCT requires pct_bps; omitting it returns ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Property P1, Lease L1"]
          setup_api_calls:
            - call: "POST /lease-admin/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /lease-admin/properties"
              payload: { name: "P1", address: "1 Main", total_rentable_sf: 10000, fiscal_year_end_month: 12 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /lease-admin/properties/${prop_id}/leases"
              payload: { tenant_legal_name: "T1", suite: "100", leased_sf: 4000, commencement_date: "2027-01-01", expiration_date: "2027-12-31", base_rent_annual_cents: 1200000, escalation_type: FIXED_PCT, recovery_structure: GROSS, pro_rata_share_bps: 0, security_deposit_cents: 0 }
              as: PortfolioManager
              captures: { lease_id: $.data.id }
          trigger:
            - call: "POST /lease-admin/leases/${lease_id}/escalation-steps"
              payload: { step_index: 1, kind: FIXED_PCT, effective_on: "2027-06-01" }
              as: PortfolioManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: escalation_step_conditional_required_amount
        claim_type: required_fields
        grounds:
          - "entities.EscalationStep.fields.amount_cents"
        distinguishing_aspect: "kind=STEPPED_AMOUNT requires amount_cents; omitting returns ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Property P1, Lease L1"]
          setup_api_calls:
            - call: "POST /lease-admin/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /lease-admin/properties"
              payload: { name: "P1", address: "1 Main", total_rentable_sf: 10000, fiscal_year_end_month: 12 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /lease-admin/properties/${prop_id}/leases"
              payload: { tenant_legal_name: "T1", suite: "100", leased_sf: 4000, commencement_date: "2027-01-01", expiration_date: "2027-12-31", base_rent_annual_cents: 1200000, escalation_type: NONE, recovery_structure: GROSS, pro_rata_share_bps: 0, security_deposit_cents: 0 }
              as: PortfolioManager
              captures: { lease_id: $.data.id }
          trigger:
            - call: "POST /lease-admin/leases/${lease_id}/escalation-steps"
              payload: { step_index: 1, kind: STEPPED_AMOUNT, effective_on: "2027-06-01" }
              as: PortfolioManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: recovery_pool_gross_up_floor_default
        claim_type: defaults
        grounds:
          - "entities.RecoveryPool.fields.gross_up_floor_pct_bps"
        distinguishing_aspect: "Omitting gross_up_floor_pct_bps applies default 9500."
        test_recipe:
          setup: ["Property P1"]
          setup_api_calls:
            - call: "POST /lease-admin/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /lease-admin/properties"
              payload: { name: "P1", address: "1 Main", total_rentable_sf: 10000, fiscal_year_end_month: 12 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
          trigger:
            - call: "POST /lease-admin/properties/${prop_id}/recovery-pools"
              payload: { category: CAM, fiscal_year: 2027, budgeted_cents: 1000000 }
              as: LeaseAccountant
              captures: { floor: $.data.gross_up_floor_pct_bps }
          assert:
            - "floor == 9500"

      - name: property_invalid_total_sf
        claim_type: violation_to_error
        grounds:
          - "entities.Property.fields.total_rentable_sf"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "total_rentable_sf = 0 violates >= 1 constraint -> ERR_INVALID_REQUEST."
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - call: "POST /lease-admin/properties"
              payload: { name: "P1", address: "1 Main", total_rentable_sf: 0, fiscal_year_end_month: 12 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: lease_fk_to_property_enforced
        claim_type: violation_to_error
        grounds:
          - "entities.Lease.fields.property_id"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "POST lease under non-existent property_id -> ERR_NOT_FOUND."
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - call: "POST /lease-admin/properties/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/leases"
              payload: { tenant_legal_name: "T1", suite: "100", leased_sf: 4000, commencement_date: "2027-01-01", expiration_date: "2027-12-31", base_rent_annual_cents: 1200000, escalation_type: NONE, recovery_structure: NNN, pro_rata_share_bps: 4000, security_deposit_cents: 0 }
              as: PortfolioManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND"

  # ==========================================================================
  # Section: state_machines — valid/invalid transitions, terminal lockdown
  # ==========================================================================
  - section: state_machines
    instances:
      - name: recovery_billing_invalid_transition_from_paid
        claim_type: invalid_transition
        grounds:
          - "state_machines.RecoveryBilling"
        distinguishing_aspect: "PAID is terminal; void on PAID returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["ACTIVE Lease with one PAID RecoveryBilling"]
          setup_api_calls:
            - call: "POST /lease-admin/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /lease-admin/properties"
              payload: { name: "P1", address: "1 Main", total_rentable_sf: 10000, fiscal_year_end_month: 12 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /lease-admin/properties/${prop_id}/leases"
              payload: { tenant_legal_name: "T1", suite: "100", leased_sf: 4000, commencement_date: "2027-01-01", expiration_date: "2027-12-31", base_rent_annual_cents: 1200000, escalation_type: NONE, recovery_structure: NNN, pro_rata_share_bps: 4000, security_deposit_cents: 0 }
              as: PortfolioManager
              captures: { lease_id: $.data.id }
            - call: "POST /lease-admin/leases/${lease_id}/abstract"
              payload: {}
              as: Abstractor
            - call: "POST /lease-admin/leases/${lease_id}/certify"
              payload: {}
              as: Certifier
            - call: "POST /lease-admin/leases/${lease_id}/rent-schedule-lines"
              payload: { period_start: "2027-01-01", period_end: "2028-01-01", base_rent_cents: 1200000 }
              as: PortfolioManager
            - call: "POST /lease-admin/properties/${prop_id}/recovery-pools"
              payload: { category: CAM, fiscal_year: 2027, budgeted_cents: 1200000 }
              as: LeaseAccountant
              captures: { pool_id: $.data.id }
            - call: "POST /lease-admin/leases/${lease_id}/recovery-billings"
              payload: { pool_id: "${pool_id}", fiscal_year: 2027, period_index: 1 }
              as: LeaseAccountant
              captures: { b1: $.data.id }
            - call: "POST /lease-admin/recovery-billings/${b1}/issue"
              payload: {}
              as: LeaseAccountant
            - call: "POST /lease-admin/recovery-billings/${b1}/mark-paid"
              payload: {}
              as: LeaseAccountant
          trigger:
            - call: "POST /lease-admin/recovery-billings/${b1}/void"
              payload: {}
              as: LeaseAccountant
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"

      - name: critical_date_lapsed_is_terminal
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.CriticalDate"
        distinguishing_aspect: "Once LAPSED, notify and exercise both fail with ERR_INVALID_STATE."
        test_recipe:
          setup: ["ACTIVE Lease with PENDING CriticalDate past due_date"]
          setup_api_calls:
            - call: "POST /lease-admin/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /lease-admin/properties"
              payload: { name: "P1", address: "1 Main", total_rentable_sf: 10000, fiscal_year_end_month: 12 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /lease-admin/properties/${prop_id}/leases"
              payload: { tenant_legal_name: "T1", suite: "100", leased_sf: 4000, commencement_date: "2027-01-01", expiration_date: "2027-12-31", base_rent_annual_cents: 1200000, escalation_type: NONE, recovery_structure: GROSS, pro_rata_share_bps: 0, security_deposit_cents: 0 }
              as: PortfolioManager
              captures: { lease_id: $.data.id }
            - call: "POST /lease-admin/leases/${lease_id}/abstract"
              payload: {}
              as: Abstractor
            - call: "POST /lease-admin/leases/${lease_id}/certify"
              payload: {}
              as: Certifier
            - call: "POST /lease-admin/leases/${lease_id}/rent-schedule-lines"
              payload: { period_start: "2027-01-01", period_end: "2028-01-01", base_rent_cents: 1200000 }
              as: PortfolioManager
            - call: "POST /lease-admin/properties/${prop_id}/recovery-pools"
              payload: { category: CAM, fiscal_year: 2027, budgeted_cents: 1200000 }
              as: LeaseAccountant
              captures: { pool_id: $.data.id }
            - call: "POST /lease-admin/leases/${lease_id}/recovery-billings"
              payload: { pool_id: "${pool_id}", fiscal_year: 2027, period_index: 1 }
              as: LeaseAccountant
              captures: { b: $.data.id }
            - call: "POST /lease-admin/recovery-billings/${b}/issue"
              payload: {}
              as: LeaseAccountant
            - call: "POST /lease-admin/leases/${lease_id}/activate"
              payload: {}
              as: PortfolioManager
            - call: "POST /lease-admin/leases/${lease_id}/critical-dates"
              payload: { kind: NOTICE_DEADLINE, due_date: "2027-03-01", advance_notice_days: 30 }
              as: PropertyManager
              captures: { cd: $.data.id }
            - call: "POST /lease-admin/_clock/set_current_utc"
              payload: { to_iso8601: "2027-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /lease-admin/critical-dates/${cd}/lapse"
              payload: {}
              as: PropertyManager
          trigger:
            - call: "POST /lease-admin/critical-dates/${cd}/notify"
              payload: {}
              as: PropertyManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"

      - name: amendment_reject_from_applied_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.Amendment"
        distinguishing_aspect: "APPLIED is terminal; reject on APPLIED fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["ACTIVE Lease with APPLIED Amendment"]
          setup_api_calls:
            - call: "POST /lease-admin/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /lease-admin/properties"
              payload: { name: "P1", address: "1 Main", total_rentable_sf: 10000, fiscal_year_end_month: 12 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /lease-admin/properties/${prop_id}/leases"
              payload: { tenant_legal_name: "T1", suite: "100", leased_sf: 4000, commencement_date: "2027-01-01", expiration_date: "2027-12-31", base_rent_annual_cents: 1200000, escalation_type: NONE, recovery_structure: NNN, pro_rata_share_bps: 4000, security_deposit_cents: 0 }
              as: PortfolioManager
              captures: { lease_id: $.data.id }
            - call: "POST /lease-admin/leases/${lease_id}/abstract"
              payload: {}
              as: Abstractor
            - call: "POST /lease-admin/leases/${lease_id}/certify"
              payload: {}
              as: Certifier
            - call: "POST /lease-admin/leases/${lease_id}/rent-schedule-lines"
              payload: { period_start: "2027-01-01", period_end: "2028-01-01", base_rent_cents: 1200000 }
              as: PortfolioManager
            - call: "POST /lease-admin/properties/${prop_id}/recovery-pools"
              payload: { category: CAM, fiscal_year: 2027, budgeted_cents: 1200000 }
              as: LeaseAccountant
              captures: { pool_id: $.data.id }
            - call: "POST /lease-admin/leases/${lease_id}/recovery-billings"
              payload: { pool_id: "${pool_id}", fiscal_year: 2027, period_index: 1 }
              as: LeaseAccountant
              captures: { b: $.data.id }
            - call: "POST /lease-admin/recovery-billings/${b}/issue"
              payload: {}
              as: LeaseAccountant
            - call: "POST /lease-admin/leases/${lease_id}/activate"
              payload: {}
              as: PortfolioManager
            - call: "GET /lease-admin/leases/${lease_id}"
              payload: {}
              as: PortfolioManager
              captures: { lv: $.data.version }
            - call: "POST /lease-admin/leases/${lease_id}/amendments"
              payload: { kind: RENT_CHANGE, effective_date: "2027-06-01", new_base_rent_annual_cents: 2400000 }
              as: PortfolioManager
              captures: { amend_id: $.data.id }
            - call: "POST /lease-admin/amendments/${amend_id}/approve"
              payload: { expected_lease_version: "${lv}" }
              as: PortfolioManager
            - call: "POST /lease-admin/amendments/${amend_id}/apply"
              payload: {}
              as: PortfolioManager
          trigger:
            - call: "POST /lease-admin/amendments/${amend_id}/reject"
              payload: {}
              as: PortfolioManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"

      - name: reconciliation_initial_state_open
        claim_type: initial_state
        grounds:
          - "state_machines.Reconciliation"
        distinguishing_aspect: "Newly created Reconciliation has status=OPEN."
        test_recipe:
          setup: ["ACTIVE Lease"]
          setup_api_calls:
            - call: "POST /lease-admin/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /lease-admin/properties"
              payload: { name: "P1", address: "1 Main", total_rentable_sf: 10000, fiscal_year_end_month: 12 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /lease-admin/properties/${prop_id}/leases"
              payload: { tenant_legal_name: "T1", suite: "100", leased_sf: 4000, commencement_date: "2027-01-01", expiration_date: "2027-12-31", base_rent_annual_cents: 1200000, escalation_type: NONE, recovery_structure: NNN, pro_rata_share_bps: 4000, security_deposit_cents: 0 }
              as: PortfolioManager
              captures: { lease_id: $.data.id }
            - call: "POST /lease-admin/leases/${lease_id}/abstract"
              payload: {}
              as: Abstractor
            - call: "POST /lease-admin/leases/${lease_id}/certify"
              payload: {}
              as: Certifier
            - call: "POST /lease-admin/leases/${lease_id}/rent-schedule-lines"
              payload: { period_start: "2027-01-01", period_end: "2028-01-01", base_rent_cents: 1200000 }
              as: PortfolioManager
            - call: "POST /lease-admin/properties/${prop_id}/recovery-pools"
              payload: { category: CAM, fiscal_year: 2027, budgeted_cents: 1200000 }
              as: LeaseAccountant
              captures: { pool_id: $.data.id }
            - call: "POST /lease-admin/leases/${lease_id}/recovery-billings"
              payload: { pool_id: "${pool_id}", fiscal_year: 2027, period_index: 1 }
              as: LeaseAccountant
              captures: { b: $.data.id }
            - call: "POST /lease-admin/recovery-billings/${b}/issue"
              payload: {}
              as: LeaseAccountant
            - call: "POST /lease-admin/leases/${lease_id}/activate"
              payload: {}
              as: PortfolioManager
          trigger:
            - call: "POST /lease-admin/leases/${lease_id}/reconciliations"
              payload: { fiscal_year: 2027 }
              as: LeaseAccountant
              captures: { status: $.data.status }
          assert:
            - "status == OPEN"

      - name: audit_right_time_barred_on_window_pass
        claim_type: valid_transition
        grounds:
          - "state_machines.AuditRight.INVOKED_to_TIME_BARRED"
        distinguishing_aspect: "AuditRight in INVOKED auto-transitions to TIME_BARRED when clock advances past window_close_date; subsequent start-fieldwork returns ERR_INVALID_STATE (terminal)."
        test_recipe:
          setup: ["CLOSED Reconciliation + AuditRight INVOKED with window_close_date=2028-03-14"]
          setup_api_calls:
            - call: "POST /lease-admin/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /lease-admin/properties"
              payload: { name: "P1", address: "1 Main", total_rentable_sf: 10000, fiscal_year_end_month: 12 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /lease-admin/properties/${prop_id}/leases"
              payload: { tenant_legal_name: "T1", suite: "100", leased_sf: 4000, commencement_date: "2027-01-01", expiration_date: "2027-12-31", base_rent_annual_cents: 1200000, escalation_type: NONE, recovery_structure: NNN, pro_rata_share_bps: 4000, security_deposit_cents: 0 }
              as: PortfolioManager
              captures: { lease_id: $.data.id }
            - call: "POST /lease-admin/leases/${lease_id}/abstract"
              payload: {}
              as: Abstractor
            - call: "POST /lease-admin/leases/${lease_id}/certify"
              payload: {}
              as: Certifier
            - call: "POST /lease-admin/leases/${lease_id}/rent-schedule-lines"
              payload: { period_start: "2027-01-01", period_end: "2028-01-01", base_rent_cents: 1200000 }
              as: PortfolioManager
            - call: "POST /lease-admin/properties/${prop_id}/recovery-pools"
              payload: { category: CAM, fiscal_year: 2027, budgeted_cents: 1200000 }
              as: LeaseAccountant
              captures: { pool_id: $.data.id }
            - call: "POST /lease-admin/leases/${lease_id}/recovery-billings"
              payload: { pool_id: "${pool_id}", fiscal_year: 2027, period_index: 1 }
              as: LeaseAccountant
              captures: { b: $.data.id }
            - call: "POST /lease-admin/recovery-billings/${b}/issue"
              payload: {}
              as: LeaseAccountant
            - call: "POST /lease-admin/leases/${lease_id}/activate"
              payload: {}
              as: PortfolioManager
            - call: "PUT /lease-admin/recovery-pools/${pool_id}/actuals"
              payload: { actual_cents: 1200000 }
              as: LeaseAccountant
            - call: "POST /lease-admin/leases/${lease_id}/reconciliations"
              payload: { fiscal_year: 2027 }
              as: LeaseAccountant
              captures: { recon_id: $.data.id }
            - call: "POST /lease-admin/reconciliations/${recon_id}/post"
              payload: {}
              as: LeaseAccountant
            - call: "POST /lease-admin/reconciliations/${recon_id}/approve"
              payload: {}
              as: PortfolioManager
            - call: "POST /lease-admin/_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /lease-admin/reconciliations/${recon_id}/close"
              payload: {}
              as: PortfolioManager
            - call: "POST /lease-admin/leases/${lease_id}/audit-rights"
              payload: { reconciliation_id: "${recon_id}", invoked_on: "2027-04-01" }
              as: PropertyManager
