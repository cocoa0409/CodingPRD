            - "HOP 2 (caused by hop 1): GET /complaints/${cmp1_id}/remediation-credits returns exactly one RemediationCredit with basis PRORATA_DAYS, amount_cents 942, status ISSUED, issued_by_user_id 'an-1'"
            - "HOP 3 (caused by hop 2): SubscriberAccount.${acct_id}.credit_balance_cents == 942 and remediation_count == 1"
