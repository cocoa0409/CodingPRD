              as: PlatformAdmin
              as_user_id: "admin-01"
            - call: "POST /political-ads/spots/${sp_t1}/disposition"
              payload: { disposition: "AIRED" }
              as: TrafficScheduler
              as_user_id: "traffic-01"
            - call: "POST /political-ads/orders"
              payload: { station_id: "${st}", advertiser_id: "${adv_w}", rate_class_id: "${rc}", payment_terms: "NET_30", sponsorship_disclosure_text: "PAID FOR BY Whitlock For Governor; AUTHORIZED BY Whitlock For Governor", disclosure_duration_seconds: 5, election_id: "${el}", agency_placed: false }
              as: AdvertiserAgent
              as_user_id: "${adv_w}"
              captures: { ord_g: $.data.id }
            - call: "POST /political-ads/orders/${ord_g}/spots"
              payload: { air_date: "2026-08-25", start_offset_seconds: 0, duration_seconds: 30, program_code: "EN-G1" }
              as: AdvertiserAgent
              as_user_id: "${adv_w}"
            - call: "POST /political-ads/orders/${ord_g}/submit"
              payload: {}
              as: AdvertiserAgent
              as_user_id: "${adv_w}"
            - call: "POST /political-ads/orders/${ord_g}/decision"
              payload: { decision: "ACCEPT" }
              as: StationComplianceOfficer
              as_user_id: "officer-beta"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T09:00:00Z" }
              as: PlatformAdmin
