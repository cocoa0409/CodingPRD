          setup:
            - "Clock at 2026-08-01T00:00:00Z; season S7 LIVE."
            - "Offer KID_PACK (LIMITED_TIME, list 300, declared 400, minor_purchasable true) is APPROVED and LIVE."
            - "Player pk is a minor with guardian_verified false; player pa is an adult, also with guardian_verified false. Both hold HARD_GEM accounts."
