            - { call: "POST /grillops/seasons/${s_id}/lots", payload: { model_id: "${m_id}", build_week: "2026-W06", units_built: 20 }, as: PlannerAdmin }
            - { call: "POST /grillops/seasons/${s_id}/advance", payload: { target_status: "BUILD" }, as: PlannerAdmin }
            - { call: "POST /grillops/seasons/${s_id}/advance", payload: { target_status: "ALLOCATION" }, as: PlannerAdmin }
            - { call: "GET /grillops/seasons/${s_id}", as: PlannerAdmin, captures: { sv: "$.data.version" } }
            - { call: "POST /grillops/allocations", payload: { season_id: "${s_id}", channel_account_id: "${ch_id}", model_id: "${m_id}", allocated_units: 5, expected_season_version: "${sv}" }, as: PlannerAdmin, captures: { a_id: "$.data.id", a_v: "$.data.version" } }
          trigger:
            - { call: "POST /grillops/allocations/${a_id}/respond", payload: { action: "REVISE", allocated_units: 7, expected_allocation_version: "${a_v}" }, as: PlannerAdmin, captures: { a_v2: "$.data.version" } }
            - { call: "POST /grillops/allocations/${a_id}/respond", payload: { action: "ACCEPT", expected_allocation_version: "${a_v}" }, as: ChannelRep, as_user_id: "${ch_id}", captures: { err: "$.data.error_id" } }
            - { call: "POST /grillops/allocations/${a_id}/respond", payload: { action: "ACCEPT", expected_allocation_version: "${a_v2}" }, as: ChannelRep, as_user_id: "${ch_id}", captures: { ok_st: "$.data.status", ok_units: "$.data.allocated_units" } }
          assert:
            - "captured a_v2 == ${a_v} + 1 (REVISE re-offers in place and bumps the version)"
            - "captured err == ERR_STALE_VERSION (http 412) — the channel's view predates the re-offer"
            - "captured ok_st == ACCEPTED and ok_units == 7 with the fresh version (channel accepted the REVISED terms)"

