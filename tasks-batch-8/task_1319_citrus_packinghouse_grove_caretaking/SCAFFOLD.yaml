    side_effects: ["Invoice DRAFT -> ISSUED; swept orders -> INVOICED with invoice_id; grower.caretaking_balance_cents += total_cents; increments grower.version"]
  - method: POST
    path: /packinghouse/caretaking-invoices/{id}/payments
    description: "Record a payment against an issued invoice (partial allowed, overpayment rejected)"
