  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_patch_member_stale_version
        claim_type: stale_version_conflict
        grounds:
          - concurrency_rules[member-profile-update-occ]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "PATCH with the pre-update version succeeds and bumps to 2; a replay of the same stale version is rejected 412."
        test_recipe:
          setup: ["registered member at version 1"]
          setup_api_calls:
            - call: "POST /dog-park/members"
              payload: { full_name: "Own Er", email: "owner@x.com" }
              as: Anonymous
              captures: { m_id: $.data.id, m_v1: $.data.version }
          trigger:
            - call: "PATCH /dog-park/members/${m_id}"
              payload: { expected_member_version: "${m_v1}", full_name: "Owner Renamed" }
              as: Member
              as_user_id: "${m_id}"
              captures: { m_v2: $.data.version, nm: $.data.full_name }
            - call: "PATCH /dog-park/members/${m_id}"
              payload: { expected_member_version: "${m_v1}", full_name: "Stale Writer" }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "first PATCH: full_name == 'Owner Renamed' and version == 2 (version increments on every mutation)"
            - "second PATCH with stale expected_member_version: error_id == ERR_STALE_VERSION (412)"
            - "Member.${m_id}.full_name remains 'Owner Renamed'"

      - name: occ_renew_stale_version
        claim_type: stale_version_conflict
        grounds:
          - concurrency_rules[membership-renew-stale-version]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "Two sequential early renewals are both legitimate; the one carrying the pre-renewal version is rejected 412 and renewal_count does not double."
        test_recipe:
          setup: ["clock 2026-08-01; active member with membership at version 1"]
          setup_api_calls:
            - call: "POST /dog-park/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ParkAdmin
            - call: "POST /dog-park/members"
              payload: { full_name: "Own Er", email: "owner@x.com" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /dog-park/members/${m_id}/dogs"
              payload: { name: "Rex", size_class: "LARGE", license_number: "LIC-1", vaccination_expires_on: "2027-06-01" }
              as: Member
              as_user_id: "${m_id}"
              captures: { d_id: $.data.id }
            - call: "POST /dog-park/dogs/${d_id}/verify"
              payload: { decision: "VERIFIED" }
              as: ParkAdmin
            - call: "POST /dog-park/members/${m_id}/memberships"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
              captures: { ms_id: $.data.id, ms_v1: $.data.version }
          trigger:
            - call: "POST /dog-park/memberships/${ms_id}/renew"
              payload: { expected_membership_version: "${ms_v1}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { rc1: $.data.renewal_count, ms_v2: $.data.version }
            - call: "POST /dog-park/memberships/${ms_id}/renew"
              payload: { expected_membership_version: "${ms_v1}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "first renew: renewal_count == 1 and version == 2"
            - "second renew with stale version: error_id == ERR_STALE_VERSION (412)"
            - "Membership.${ms_id}.renewal_count remains 1 (no double extension)"

      - name: nightly_run_summary_counts
        claim_type: ops_run_checkpoint
        grounds:
          - calculations.waste_fill_accumulation
          - state_machines.Membership.ACTIVE_to_EXPIRED
          - state_machines.GuestPass.ISSUED_to_EXPIRED
          - state_machines.ParkVisit.OPEN_to_FORCE_CLOSED
          - state_machines.Dog.VERIFIED_to_EXPIRED
        distinguishing_aspect: "One mixed-state epoch produces an exact summary: 1 visit force-closed, 1 membership expired + 1 member lapsed, 1 guest pass expired, 0 closures, 0 dogs (vaccination still valid), 0 stations."
        test_recipe:
          setup: ["clock 2026-08-01; active member with VERIFIED dog (vaccination 2027-06-01), membership, ISSUED pass valid_on 2026-08-03, one OPEN visit; clock advanced to 2027-01-02"]
          setup_api_calls:
            - call: "POST /dog-park/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ParkAdmin
            - call: "POST /dog-park/areas"
