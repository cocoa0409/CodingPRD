      - name: statement_periods_are_fully_closed_so_a_shared_boundary_date_collides
        grounds:
          - validations[priority=40]
          - errors[ERR_STATEMENT_PERIOD_OVERLAP]
          - entities.RemittanceStatement.fields.period_start
