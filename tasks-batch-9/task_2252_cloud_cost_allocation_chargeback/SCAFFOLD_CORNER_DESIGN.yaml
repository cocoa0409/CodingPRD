              - "The pool still reports pooled_cost_cents 0 and absorbed_record_count 0."

        - name: regional_hourly_commit_ceiling_is_inclusive_at_five_hundred
          claim_type: Violation → Error
          grounds: "§1.4 priority 82 ERR_COMMITMENT_CAPACITY_EXCEEDED (422) with REGION_MAX_HOURLY_COMMIT_CENTS 500 summed across PENDING, ACTIVE and UNDER_UTILIZED commitments in the region, the new one included."
          distinguishing_aspect: "Aggregate ceiling probed at the boundary while deliberately dodging the priority-71 window rule: the second commitment is a SAVINGS_PLAN, so its term may overlap the reserved instance's term and only the capacity rule can speak. 300 + 201 = 501 fails, 300 + 200 = 500 passes, and a different region is unaffected."
          test_recipe:
            setup:
              - "One PENDING RESERVED_INSTANCE of 300 cents per hour in us-east-1 for July."
            setup_api_calls:
              - call: "POST /finops/commitments"
                payload: { commitment_type: "RESERVED_INSTANCE", region: "us-east-1", covered_resource_kind: "COMPUTE", term_start: "2026-07-01T00:00:00Z", term_end: "2026-08-01T00:00:00Z", hourly_commit_cents: 300 }
                as: FinOpsController
                as_user_id: "controller-1"
            trigger:
              - call: "POST /finops/commitments"
                payload: { commitment_type: "SAVINGS_PLAN", region: "us-east-1", term_start: "2026-07-01T00:00:00Z", term_end: "2026-08-01T00:00:00Z", hourly_commit_cents: 201 }
                as: FinOpsController
                as_user_id: "controller-1"
              - call: "POST /finops/commitments"
                payload: { commitment_type: "SAVINGS_PLAN", region: "us-east-1", term_start: "2026-07-01T00:00:00Z", term_end: "2026-08-01T00:00:00Z", hourly_commit_cents: 200 }
                as: FinOpsController
                as_user_id: "controller-1"
              - call: "POST /finops/commitments"
                payload: { commitment_type: "SAVINGS_PLAN", region: "eu-west-1", term_start: "2026-07-01T00:00:00Z", term_end: "2026-08-01T00:00:00Z", hourly_commit_cents: 300 }
                as: FinOpsController
                as_user_id: "controller-1"
              - call: "GET /finops/commitments?region=us-east-1"
                payload: {}
                as: FinOpsController
                as_user_id: "controller-1"
            assert:
              - "201 attempt: HTTP 422 with data.error_id == \"ERR_COMMITMENT_CAPACITY_EXCEEDED\" (300 + 201 = 501 > 500)."
              - "200 attempt: HTTP 201 — the ceiling is inclusive at exactly 500. data.committed_capacity_cents is null until activation."
              - "eu-west-1 attempt: HTTP 201 — the ceiling is per region."
              - "us-east-1 list: meta.total_count == 2, both status \"PENDING\"."

