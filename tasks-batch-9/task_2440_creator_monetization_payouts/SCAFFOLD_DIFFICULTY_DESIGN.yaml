            - "trigger step 1 returns HTTP 409 with error_id ERR_INVESTIGATION_WINDOW_OVERLAP (closed intervals collide when they merely touch)"
            - "trigger step 2 returns HTTP 201 with ${i2_state} == OPEN (one second past the closed end is clear)"
            - "trigger step 3 returns HTTP 201 (the resource is per-creator; c2's identical window is unconstrained by c1's)"
            - "${i1_cleared} == CLEARED and Investigation.${i1_id}.clawback_base_cents == 0"
            - "trigger step 6 returns HTTP 201 with ${i4_state} == OPEN - the exact payload rejected in step 1's spirit is now legal because only OPEN investigations reserve a window"
            - "GET /monetization/investigations?creator_id=${c1_id} returns total_count 3 (I1 CLEARED, I2 OPEN, I4 OPEN)"
            - "Creator.${c1_id}.payout_state == ACCRUING throughout (hold_payouts false on every investigation)"
            - "Creator.${c1_id}.active_strike_count == 0 and eligibility_status == ELIGIBLE"

      - name: accrual_blocked_at_both_inclusive_endpoints_of_investigation_window
        resource: "the point-in-interval containment test between one RevenueEvent instant and an OPEN Investigation's closed window"
        interval_semantics: "point containment in a fully closed window: blocked iff violation_window_start <= occurred_at <= violation_window_end"
        grounds:
          - validations.priority_48
          - errors.ERR_ACCRUAL_UNDER_INVESTIGATION
          - entities.RevenueEvent.fields.occurred_at
          - entities.Investigation.fields.violation_window_start
          - entities.Investigation.fields.violation_window_end
          - "endpoints.POST /monetization/revenue-events"
          - validations.priority_71
        distinguishing_aspect: |
          A third temporal shape on a different resource pair: not
          interval-versus-interval but POINT-versus-interval, and the point is
          on the RevenueEvent while the interval is on the Investigation. Because
          the window is fully closed, an event at exactly
          violation_window_start and an event at exactly violation_window_end
          are BOTH rejected 409 ERR_ACCRUAL_UNDER_INVESTIGATION, while the
          instants one second outside either endpoint are accepted - so both
          endpoints are inclusive, in direct contrast to the EarningsPeriod
