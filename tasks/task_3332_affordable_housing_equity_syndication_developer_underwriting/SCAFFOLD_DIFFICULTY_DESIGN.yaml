              as: Underwriter
            - call: "PUT /projects/${proj_j_id}"
              payload: { underwriting_action: "FINALIZE", expected_project_version: "${proj_j_version}" }
              as: Underwriter
            - call: "POST /projects/${proj_j_id}/commit"
