              as: Dispatcher
            - call: "POST /jobs"
              payload: { contract_id: "${contract_id}", job_type: "INSTALL", scheduled_date: "2026-11-30T10:00:00Z" }
              as: Dispatcher
              captures: { job_c: $.data.id }
            - call: "GET /route-days/${rd_id}"
              payload: {}
