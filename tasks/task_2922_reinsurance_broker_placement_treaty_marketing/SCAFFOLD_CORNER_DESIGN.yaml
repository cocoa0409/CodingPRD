          setup:
            - "One cedent, one reinsurer, one program walked end to end: signed-off exposure package, acknowledged disclosure, one CATASTROPHE layer placed 100.0000 by Alpha Re, bound, three contract documents filed to WORDING_AGREED, one renewal report, one claim advocacy under dispute."
