# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth walk of references/claim-extraction-guide.md against SCAFFOLD.yaml
# §1.1-§1.7. Corners already exercised by §1.8 are emitted as excluded_because
# stubs naming the covering difficulty instance.
scaffold_corner_design:

  - section: entities
    instances:

      - name: create_battery_model_derives_hazmat_and_watt_hour_fields
        claim_type: Computed Fields
        grounds:
          - entities.BatteryModel.fields.hazmat_class_code
          - entities.BatteryModel.fields.hazmat_severity_rank
          - entities.BatteryModel.fields.watt_hour_rating
          - calculations.hazmat_classification
        distinguishing_aspect: "A flooded lead-acid model posts with no hazmat fields in the body and comes back with watt_hour_rating 1200.0, hazmat_class_code UN2794 and hazmat_severity_rank 4."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /distribution/battery-models"
              payload: { sku: "IB-31-FLD", chemistry: "FLOODED_LEAD_ACID", nominal_voltage: 12, amp_hour_capacity: 100, peukert_exponent: 1.25, unit_weight_kg: 26.0, lead_content_kg: 12.5, core_deposit_cents: 2200, list_price_cents: 18500, warranty_free_replacement_months: 12, warranty_prorata_months: 24, shelf_life_days: 540, self_discharge_pct_per_month: 6.0 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { m_fld: $.data.id }
          trigger:
            - call: "GET /distribution/battery-models/${m_fld}"
              as: SalesRep
              as_user_id: "rep-1"
              captures: { wh: $.data.watt_hour_rating, cls: $.data.hazmat_class_code, rank: $.data.hazmat_severity_rank }
          assert:
            - "HTTP status == 200"
            - "${wh} == 1200.0"
            - "${cls} == UN2794"
            - "${rank} == 4"
            - "BatteryModel.${m_fld}.status == ACTIVE"
            - "BatteryModel.${m_fld}.replacement_model_id == null"
            - "BatteryModel.${m_fld}.version == 1"

      - name: create_account_applies_declared_defaults
        claim_type: Defaults
        grounds:
          - entities.Account.fields.storm_priority_rank
          - entities.Account.fields.status
          - entities.Account.fields.open_receivable_cents
          - entities.Account.fields.lifetime_lead_recovered_kg
        distinguishing_aspect: "Omitting the optional storm_priority_rank yields the declared default 9, status initialises to ACTIVE and all four ledger fields to zero."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /distribution/accounts"
              payload: { name: "Default Ranch Supply", account_tier: "STANDARD", state_code: "TX", credit_limit_cents: 500000 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { acct: $.data.id, rank: $.data.storm_priority_rank }
          assert:
            - "HTTP status == 201"
            - "${rank} == 9"
            - "Account.${acct}.status == ACTIVE"
            - "Account.${acct}.open_receivable_cents == 0"
            - "Account.${acct}.core_deposit_balance_cents == 0"
            - "Account.${acct}.warranty_credit_cents == 0"
            - "Account.${acct}.lifetime_lead_recovered_kg == 0.0"

      - name: create_order_missing_warehouse_id_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
          - entities.Order.fields.warehouse_id
        distinguishing_aspect: "warehouse_id is a required input on POST /distribution/orders; omitting it returns ERR_INVALID_REQUEST with HTTP 400 and no Order row is created."
        test_recipe:
          setup:
            - "One STANDARD TX account exists."
          setup_api_calls:
            - call: "POST /distribution/accounts"
              payload: { name: "Delta Fleet", account_tier: "STANDARD", state_code: "TX", credit_limit_cents: 100000000, storm_priority_rank: 5 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { acct: $.data.id }
          trigger:
            - call: "POST /distribution/orders"
              payload: { account_id: "${acct}", requested_ship_date: "2026-08-10" }
              as: SalesRep
              as_user_id: "rep-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "${err} == ERR_INVALID_REQUEST"
            - "GET /distribution/orders with account_id ${acct} returns an empty array with total_count 0"

      - name: create_battery_model_with_undeclared_chemistry_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
          - entities.BatteryModel.fields.chemistry
        distinguishing_aspect: "SODIUM_ION is not a member of the declared chemistry enum, so the create is rejected with ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /distribution/battery-models"
              payload: { sku: "IB-NA-99", chemistry: "SODIUM_ION", nominal_voltage: 12, amp_hour_capacity: 100, peukert_exponent: 1.15, unit_weight_kg: 20.0, lead_content_kg: 0.0, core_deposit_cents: 0, list_price_cents: 40000, warranty_free_replacement_months: 12, warranty_prorata_months: 12, shelf_life_days: 700, self_discharge_pct_per_month: 2.0 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "${err} == ERR_INVALID_REQUEST"

      - name: order_line_core_expected_above_quantity_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
          - entities.OrderLine.fields.core_expected_count
        distinguishing_aspect: "core_expected_count 6 on a quantity of 5 breaches the declared constraint core_expected_count <= quantity and returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup:
            - "One TX warehouse, one STANDARD TX account, one AGM model and one DRAFT order."
          setup_api_calls:
            - call: "POST /distribution/warehouses"
              payload: { code: "TX-DAL", state_code: "TX", hazmat_endorsement: true, storm_reserve_pct: 0.0, dock_capacity_kg_per_window: 100000.0 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { wh_tx: $.data.id }
            - call: "POST /distribution/accounts"
              payload: { name: "Delta Fleet", account_tier: "STANDARD", state_code: "TX", credit_limit_cents: 100000000, storm_priority_rank: 5 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { acct: $.data.id }
            - call: "POST /distribution/battery-models"
              payload: { sku: "IB-AGM-95", chemistry: "AGM", nominal_voltage: 12, amp_hour_capacity: 95, peukert_exponent: 1.10, unit_weight_kg: 28.0, lead_content_kg: 13.0, core_deposit_cents: 2500, list_price_cents: 26000, warranty_free_replacement_months: 24, warranty_prorata_months: 36, shelf_life_days: 730, self_discharge_pct_per_month: 3.0 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { m_agm: $.data.id }
            - call: "POST /distribution/orders"
              payload: { account_id: "${acct}", warehouse_id: "${wh_tx}", requested_ship_date: "2026-08-10" }
              as: SalesRep
              as_user_id: "rep-1"
              captures: { ord: $.data.id }
          trigger:
            - call: "POST /distribution/orders/${ord}/lines"
              payload: { battery_model_id: "${m_agm}", quantity: 5, core_expected_count: 6 }
              as: SalesRep
              as_user_id: "rep-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "${err} == ERR_INVALID_REQUEST"
            - "Order.${ord}.line_count == 0"

      - name: get_account_with_unknown_id_returns_account_not_found
        claim_type: Not Found
        grounds:
          - validations[priority=4]
          - errors[ERR_ACCOUNT_NOT_FOUND]
        distinguishing_aspect: "A well-formed UUID that matches no Account row returns ERR_ACCOUNT_NOT_FOUND with HTTP 404."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "GET /distribution/accounts/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "${err} == ERR_ACCOUNT_NOT_FOUND"

      - name: get_order_line_with_unknown_id_returns_order_line_not_found
        claim_type: Not Found
        grounds:
          - validations[priority=4]
          - errors[ERR_ORDER_LINE_NOT_FOUND]
        distinguishing_aspect: "The order-line collection has its own not-found code, distinct from ERR_ORDER_NOT_FOUND, returned at HTTP 404."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "GET /distribution/order-lines/1b2c3d4e-5f60-4718-9a2b-3c4d5e6f7081"
              as: SalesRep
              as_user_id: "rep-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "${err} == ERR_ORDER_LINE_NOT_FOUND"

      - name: create_order_with_unknown_warehouse_id_returns_warehouse_not_found
        claim_type: Parent Relationships
        grounds:
          - validations[priority=6]
          - errors[ERR_WAREHOUSE_NOT_FOUND]
          - entities.Order.fields.warehouse_id
        distinguishing_aspect: "A body foreign key that resolves to nothing is caught by the priority-6 existence sweep and returns ERR_WAREHOUSE_NOT_FOUND (404), not ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "One STANDARD TX account exists; no warehouse carries the referenced id."
          setup_api_calls:
            - call: "POST /distribution/accounts"
              payload: { name: "Delta Fleet", account_tier: "STANDARD", state_code: "TX", credit_limit_cents: 100000000, storm_priority_rank: 5 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { acct: $.data.id }
          trigger:
            - call: "POST /distribution/orders"
              payload: { account_id: "${acct}", warehouse_id: "0f0e0d0c-0b0a-4908-8706-050403020100", requested_ship_date: "2026-08-10" }
              as: SalesRep
              as_user_id: "rep-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "${err} == ERR_WAREHOUSE_NOT_FOUND"

      - name: list_orders_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints[GET /distribution/orders]
          - entities.Order.fields.account_id
        distinguishing_aspect: "With three orders on one account, limit 2 offset 0 returns exactly 2 rows with total_count 3 and has_more true; offset 2 returns 1 row with has_more false."
        test_recipe:
          setup:
            - "One TX warehouse, one STANDARD TX account and three DRAFT orders on that account."
          setup_api_calls:
            - call: "POST /distribution/warehouses"
              payload: { code: "TX-DAL", state_code: "TX", hazmat_endorsement: true, storm_reserve_pct: 0.0, dock_capacity_kg_per_window: 100000.0 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { wh_tx: $.data.id }
            - call: "POST /distribution/accounts"
              payload: { name: "Delta Fleet", account_tier: "STANDARD", state_code: "TX", credit_limit_cents: 100000000, storm_priority_rank: 5 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { acct: $.data.id }
            - call: "POST /distribution/orders"
              payload: { account_id: "${acct}", warehouse_id: "${wh_tx}", requested_ship_date: "2026-08-10" }
              as: SalesRep
              as_user_id: "rep-1"
              captures: { o1: $.data.id }
            - call: "POST /distribution/orders"
              payload: { account_id: "${acct}", warehouse_id: "${wh_tx}", requested_ship_date: "2026-08-11" }
              as: SalesRep
              as_user_id: "rep-1"
              captures: { o2: $.data.id }
            - call: "POST /distribution/orders"
              payload: { account_id: "${acct}", warehouse_id: "${wh_tx}", requested_ship_date: "2026-08-12" }
              as: SalesRep
              as_user_id: "rep-1"
              captures: { o3: $.data.id }
          trigger:
            - call: "GET /distribution/orders"
              payload: { account_id: "${acct}", limit: 2, offset: 0 }
              as: SalesRep
              as_user_id: "rep-1"
              captures: { first_id: "$.data[0].id" }
          assert:
            - "HTTP status == 200"
            - "response meta pagination total_count == 3"
            - "response meta pagination has_more == true"
            - "the data array holds exactly 2 Order rows"
            - "a follow-up GET /distribution/orders with account_id ${acct}, limit 2 and offset 2 returns 1 row with has_more == false"

      - name: list_inventory_lots_filters_by_warehouse_and_condition_state
        claim_type: Listing
        grounds:
          - endpoints[GET /distribution/inventory-lots]
          - entities.InventoryLot.fields.condition_state
          - entities.InventoryLot.fields.warehouse_id
        distinguishing_aspect: "Filtering by warehouse_id plus condition_state SHELF_EXPIRED returns only the 2024-01-01 lot and excludes the 2026-06-01 SELLABLE lot at the same site."
        test_recipe:
          setup:
            - "One TX warehouse, model IB-31-FLD with shelf_life_days 540, one SELLABLE lot manufactured 2026-06-01 and one SHELF_EXPIRED lot manufactured 2024-01-01."
          setup_api_calls:
            - call: "POST /distribution/warehouses"
              payload: { code: "TX-DAL", state_code: "TX", hazmat_endorsement: true, storm_reserve_pct: 0.0, dock_capacity_kg_per_window: 100000.0 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { wh_tx: $.data.id }
            - call: "POST /distribution/battery-models"
              payload: { sku: "IB-31-FLD", chemistry: "FLOODED_LEAD_ACID", nominal_voltage: 12, amp_hour_capacity: 100, peukert_exponent: 1.25, unit_weight_kg: 26.0, lead_content_kg: 12.5, core_deposit_cents: 2200, list_price_cents: 18500, warranty_free_replacement_months: 12, warranty_prorata_months: 24, shelf_life_days: 540, self_discharge_pct_per_month: 6.0 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { m_fld: $.data.id }
            - call: "POST /distribution/inventory-lots"
              payload: { battery_model_id: "${m_fld}", warehouse_id: "${wh_tx}", manufactured_on: "2026-06-01", quantity_on_hand: 20 }
              as: WarehouseOperator
              as_user_id: "op-1"
              captures: { lot_ok: $.data.id }
            - call: "POST /distribution/inventory-lots"
              payload: { battery_model_id: "${m_fld}", warehouse_id: "${wh_tx}", manufactured_on: "2024-01-01", quantity_on_hand: 4 }
              as: WarehouseOperator
              as_user_id: "op-1"
              captures: { lot_old: $.data.id }
          trigger:
            - call: "GET /distribution/inventory-lots"
              payload: { warehouse_id: "${wh_tx}", condition_state: "SHELF_EXPIRED", limit: 10, offset: 0 }
              as: WarehouseOperator
              as_user_id: "op-1"
              captures: { hit: "$.data[0].id" }
          assert:
            - "HTTP status == 200"
            - "response meta pagination total_count == 1"
            - "${hit} == ${lot_old}"
            - "the data array does not contain ${lot_ok}"

      - name: discontinued_model_is_reachable_through_replacement_model_id_filter
        claim_type: Retrieval
        grounds:
          - entities.BatteryModel.fields.replacement_model_id
          - endpoints[GET /distribution/battery-models]
          - endpoints[POST /distribution/battery-models/{batteryModelId}/discontinue]
        distinguishing_aspect: "The self-referential supersession edge is reverse-reachable: filtering battery-models by replacement_model_id equal to the successor returns exactly the discontinued predecessor."
        test_recipe:
          setup:
            - "Two ACTIVE models, IB-31-FLD and its successor IB-31-FLD2."
          setup_api_calls:
            - call: "POST /distribution/battery-models"
              payload: { sku: "IB-31-FLD", chemistry: "FLOODED_LEAD_ACID", nominal_voltage: 12, amp_hour_capacity: 100, peukert_exponent: 1.25, unit_weight_kg: 26.0, lead_content_kg: 12.5, core_deposit_cents: 2200, list_price_cents: 18500, warranty_free_replacement_months: 12, warranty_prorata_months: 24, shelf_life_days: 540, self_discharge_pct_per_month: 6.0 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { m_old: $.data.id }
            - call: "POST /distribution/battery-models"
              payload: { sku: "IB-31-FLD2", chemistry: "FLOODED_LEAD_ACID", nominal_voltage: 12, amp_hour_capacity: 105, peukert_exponent: 1.24, unit_weight_kg: 26.5, lead_content_kg: 12.8, core_deposit_cents: 2200, list_price_cents: 19500, warranty_free_replacement_months: 12, warranty_prorata_months: 24, shelf_life_days: 540, self_discharge_pct_per_month: 6.0 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { m_new: $.data.id }
            - call: "POST /distribution/battery-models/${m_old}/discontinue"
              payload: { replacement_model_id: "${m_new}" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { old_status: $.data.status }
          trigger:
            - call: "GET /distribution/battery-models"
              payload: { replacement_model_id: "${m_new}", limit: 10, offset: 0 }
              as: SalesRep
              as_user_id: "rep-1"
              captures: { hit: "$.data[0].id" }
          assert:
            - "${old_status} == DISCONTINUED"
            - "HTTP status == 200"
            - "response meta pagination total_count == 1"
            - "${hit} == ${m_old}"
            - "BatteryModel.${m_old}.replacement_model_id == ${m_new}"
            - "BatteryModel.${m_new}.status == ACTIVE"

      - name: new_inventory_lot_starts_sellable_with_derived_charge
        claim_type: Creation
        grounds:
          - state_machines.InventoryLot.initial_state
          - calculations.lot_state_of_charge
          - entities.InventoryLot.fields.quantity_available
        distinguishing_aspect: "A lot manufactured 2026-06-01 at the 2026-08-01 default clock is 61 days old, 2 storage months, so state_of_charge_pct is 88.0, condition_state is SELLABLE and quantity_available equals quantity_on_hand."
        test_recipe:
          setup:
            - "The logical clock is at its 2026-08-01T00:00:00Z default; one TX warehouse and model IB-31-FLD with self_discharge_pct_per_month 6.0."
          setup_api_calls:
            - call: "POST /distribution/warehouses"
              payload: { code: "TX-DAL", state_code: "TX", hazmat_endorsement: true, storm_reserve_pct: 0.0, dock_capacity_kg_per_window: 100000.0 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { wh_tx: $.data.id }
            - call: "POST /distribution/battery-models"
              payload: { sku: "IB-31-FLD", chemistry: "FLOODED_LEAD_ACID", nominal_voltage: 12, amp_hour_capacity: 100, peukert_exponent: 1.25, unit_weight_kg: 26.0, lead_content_kg: 12.5, core_deposit_cents: 2200, list_price_cents: 18500, warranty_free_replacement_months: 12, warranty_prorata_months: 24, shelf_life_days: 540, self_discharge_pct_per_month: 6.0 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { m_fld: $.data.id }
          trigger:
            - call: "POST /distribution/inventory-lots"
              payload: { battery_model_id: "${m_fld}", warehouse_id: "${wh_tx}", manufactured_on: "2026-06-01", quantity_on_hand: 40 }
              as: WarehouseOperator
              as_user_id: "op-1"
              captures: { lot: $.data.id, soc: $.data.state_of_charge_pct, st: $.data.condition_state, avail: $.data.quantity_available }
          assert:
            - "HTTP status == 201"
            - "${soc} == 88.0"
            - "${st} == SELLABLE"
            - "${avail} == 40"
            - "InventoryLot.${lot}.quantity_reserved == 0"
            - "InventoryLot.${lot}.refresh_charge_count == 0"
            - "InventoryLot.${lot}.last_refresh_charged_at == null"
            - "InventoryLot.${lot}.scrap_manifest_id == null"

      - name: duplicate_battery_model_sku_returns_duplicate_sku
        claim_type: Type Constraints
        grounds:
          - validations[priority=39]
          - errors[ERR_DUPLICATE_SKU]
          - entities.BatteryModel.fields.sku
        distinguishing_aspect: "sku is unique across all BatteryModel rows regardless of status, so a second create with sku IB-31-FLD returns ERR_DUPLICATE_SKU at HTTP 409."
        test_recipe:
          setup:
            - "One model already carries sku IB-31-FLD."
          setup_api_calls:
            - call: "POST /distribution/battery-models"
              payload: { sku: "IB-31-FLD", chemistry: "FLOODED_LEAD_ACID", nominal_voltage: 12, amp_hour_capacity: 100, peukert_exponent: 1.25, unit_weight_kg: 26.0, lead_content_kg: 12.5, core_deposit_cents: 2200, list_price_cents: 18500, warranty_free_replacement_months: 12, warranty_prorata_months: 24, shelf_life_days: 540, self_discharge_pct_per_month: 6.0 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { m1: $.data.id }
          trigger:
            - call: "POST /distribution/battery-models"
              payload: { sku: "IB-31-FLD", chemistry: "AGM", nominal_voltage: 12, amp_hour_capacity: 95, peukert_exponent: 1.10, unit_weight_kg: 28.0, lead_content_kg: 13.0, core_deposit_cents: 2500, list_price_cents: 26000, warranty_free_replacement_months: 24, warranty_prorata_months: 36, shelf_life_days: 730, self_discharge_pct_per_month: 3.0 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "${err} == ERR_DUPLICATE_SKU"
            - "GET /distribution/battery-models with limit 10 and offset 0 returns total_count 1"

      - name: duplicate_warranty_serial_number_returns_duplicate_serial_number
        claim_type: Type Constraints
        grounds:
          - validations[priority=40]
          - errors[ERR_DUPLICATE_SERIAL_NUMBER]
          - entities.WarrantyClaim.fields.serial_number
        distinguishing_aspect: "A second claim quoting serial SN-DUP-1 is rejected with ERR_DUPLICATE_SERIAL_NUMBER (409), a different uniqueness code from ERR_DUPLICATE_SKU."
        test_recipe:
          setup:
            - "One STANDARD TX account, one model IB-31-FLD and one existing claim on serial SN-DUP-1."
          setup_api_calls:
            - call: "POST /distribution/accounts"
              payload: { name: "Delta Fleet", account_tier: "STANDARD", state_code: "TX", credit_limit_cents: 100000000, storm_priority_rank: 5 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { acct: $.data.id }
            - call: "POST /distribution/battery-models"
              payload: { sku: "IB-31-FLD", chemistry: "FLOODED_LEAD_ACID", nominal_voltage: 12, amp_hour_capacity: 100, peukert_exponent: 1.25, unit_weight_kg: 26.0, lead_content_kg: 12.5, core_deposit_cents: 2200, list_price_cents: 18500, warranty_free_replacement_months: 12, warranty_prorata_months: 24, shelf_life_days: 540, self_discharge_pct_per_month: 6.0 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { m_fld: $.data.id }
            - call: "POST /distribution/warranty-claims"
              payload: { account_id: "${acct}", battery_model_id: "${m_fld}", serial_number: "SN-DUP-1", installed_on: "2025-01-10", failed_on: "2025-06-10" }
              as: SalesRep
              as_user_id: "rep-1"
              captures: { wc1: $.data.id }
          trigger:
            - call: "POST /distribution/warranty-claims"
              payload: { account_id: "${acct}", battery_model_id: "${m_fld}", serial_number: "SN-DUP-1", installed_on: "2025-02-10", failed_on: "2025-07-10" }
