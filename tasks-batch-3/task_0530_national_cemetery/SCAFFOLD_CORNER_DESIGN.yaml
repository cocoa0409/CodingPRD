# =============================================================================
# §1.9 Scaffold Corner Design — breadth coverage of every other testable claim
# National Cemetery & Veteran Burial (Expert).
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_cemetery_returns_201_with_computed_is_overseas
        claim_type: Creation
        grounds: [entities.Cemetery, entities.Cemetery.fields.is_overseas]
        distinguishing_aspect: "POST /registry/cemeteries with country_code=FR returns 201 and is_overseas==true (computed, not input)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /registry/cemeteries"
              payload: { name: "Manila American", country_code: "PH", honors_squad_capacity: 2 }
              as: NCA_Admin
              captures: { cem_id: $.data.id }
          assert:
            - "response status == 201"
            - "Cemetery.${cem_id}.is_overseas == true"
            - "Cemetery.${cem_id}.country_code == PH"

      - name: create_cemetery_missing_required_field_rejected
        claim_type: Required Fields
        grounds: [entities.Cemetery.fields.honors_squad_capacity]
        distinguishing_aspect: "POST /registry/cemeteries omitting honors_squad_capacity returns ERR_VALIDATION (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /registry/cemeteries"
              payload: { name: "NoCapacity National", country_code: "US" }
              as: NCA_Admin
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "error_id == ERR_VALIDATION"

      - name: cemetery_country_code_defaults_to_US
        claim_type: Defaults
        grounds: [entities.Cemetery.fields.country_code, entities.Cemetery.fields.is_overseas]
        distinguishing_aspect: "Omitting country_code applies default 'US' and is_overseas==false."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /registry/cemeteries"
              payload: { name: "Default National", honors_squad_capacity: 1 }
              as: NCA_Admin
              captures: { cem_id: $.data.id }
          assert:
            - "Cemetery.${cem_id}.country_code == US"
            - "Cemetery.${cem_id}.is_overseas == false"

      - name: get_cemetery_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Cemetery]
        distinguishing_aspect: "GET a non-existent cemetery id returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /registry/cemeteries/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: NCA_Admin
              captures: { err: $.data.error_id }
          assert:
            - "response status == 404"
            - "error_id == ERR_NOT_FOUND"

      - name: eligibility_determination_is_immutable_no_version
        claim_type: Immutability
        grounds: [entities.EligibilityDetermination]
        distinguishing_aspect: "EligibilityDetermination has common_fields:false — response carries id/created_at but no version/updated_at field and there is no update endpoint."
        test_recipe:
          setup: ["US cemetery; one VETERAN case adjudicated APPROVED."]
          setup_api_calls:
            - call: "POST /registry/cemeteries"
              payload: { name: "Immut National", country_code: "US", honors_squad_capacity: 1 }
              as: NCA_Admin
              captures: { cem_id: $.data.id }
            - call: "POST /registry/burial-cases"
              payload: { cemetery_id: "${cem_id}", case_type: "AT_NEED", applicant_role: "VETERAN", requested_class: "STANDARD", character_of_discharge: "HONORABLE", service_days: 3650 }
              as: EligibilityOfficer
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /registry/burial-cases/${case_id}/eligibility"
              payload: {}
              as: EligibilityOfficer
              captures: { det_decision: $.data.decision }
          assert:
            - "response status == 201"
            - "EligibilityDetermination for ${case_id}: decision == APPROVED"
            - "EligibilityDetermination response has no `version` field"

      - name: gravesite_system_fields_input_ignored
        claim_type: System Fields
        grounds: [entities.Gravesite.fields.status, entities.Gravesite.fields.interment_count]
        distinguishing_aspect: "Creating a gravesite ignores any client-supplied status/interment_count; status is AVAILABLE and interment_count is 0."
        test_recipe:
          setup: ["US cemetery with an IN_GROUND section."]
          setup_api_calls:
            - call: "POST /registry/cemeteries"
              payload: { name: "SysF National", country_code: "US", honors_squad_capacity: 1 }
              as: NCA_Admin
              captures: { cem_id: $.data.id }
            - call: "POST /registry/sections"
              payload: { cemetery_id: "${cem_id}", code: "A", kind: "IN_GROUND" }
              as: NCA_Admin
              captures: { sec_id: $.data.id }
          trigger:
            - call: "POST /registry/gravesites"
              payload: { section_id: "${sec_id}", grid_ref: "R1C1", gravesite_class: "STANDARD", depth_capacity: 1 }
              as: NCA_Admin
              captures: { grv_id: $.data.id }
          assert:
            - "response status == 201"
            - "Gravesite.${grv_id}.status == AVAILABLE"
            - "Gravesite.${grv_id}.interment_count == 0"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: gravesite_created_under_columbarium_section_rejected
        claim_type: guarded transitions
        grounds: [entities.Section.fields.kind, "validations[priority=6]"]
        distinguishing_aspect: "Creating a Gravesite under a COLUMBARIUM section returns ERR_UNIT_KIND_MISMATCH (422)."
        test_recipe:
          setup: ["US cemetery with a COLUMBARIUM section."]
          setup_api_calls:
            - call: "POST /registry/cemeteries"
              payload: { name: "Guard National", country_code: "US", honors_squad_capacity: 1 }
              as: NCA_Admin
              captures: { cem_id: $.data.id }
            - call: "POST /registry/sections"
              payload: { cemetery_id: "${cem_id}", code: "C", kind: "COLUMBARIUM" }
              as: NCA_Admin
              captures: { sec_id: $.data.id }
          trigger:
            - call: "POST /registry/gravesites"
              payload: { section_id: "${sec_id}", grid_ref: "R1C1", gravesite_class: "STANDARD", depth_capacity: 1 }
              as: NCA_Admin
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "error_id == ERR_UNIT_KIND_MISMATCH"

      - name: assign_plot_from_submitted_case_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.BurialCase.ELIGIBLE_to_ASSIGNED]
        distinguishing_aspect: "assign-plot on a case still in SUBMITTED (never adjudicated) returns ERR_INVALID_STATE (409); no plot reserved."
        test_recipe:
          setup: ["US cemetery, IN_GROUND section + STANDARD gravesite; a VETERAN case in SUBMITTED (no eligibility run)."]
          setup_api_calls:
            - call: "POST /registry/cemeteries"
              payload: { name: "InvState National", country_code: "US", honors_squad_capacity: 1 }
              as: NCA_Admin
              captures: { cem_id: $.data.id }
            - call: "POST /registry/sections"
              payload: { cemetery_id: "${cem_id}", code: "A", kind: "IN_GROUND" }
              as: NCA_Admin
              captures: { sec_id: $.data.id }
            - call: "POST /registry/gravesites"
              payload: { section_id: "${sec_id}", grid_ref: "R1C1", gravesite_class: "STANDARD", depth_capacity: 1 }
              as: NCA_Admin
              captures: { grv_id: $.data.id }
            - call: "POST /registry/burial-cases"
              payload: { cemetery_id: "${cem_id}", case_type: "AT_NEED", applicant_role: "VETERAN", requested_class: "STANDARD", character_of_discharge: "HONORABLE", service_days: 3650 }
              as: EligibilityOfficer
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /registry/burial-cases/${case_id}/assign-plot"
              payload: {}
              as: SchedulingClerk
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "error_id == ERR_INVALID_STATE"
            - "Gravesite.${grv_id}.status == AVAILABLE"

      - name: engrave_marker_before_case_interred_invalid_state
        claim_type: Precondition Enforcement
        grounds: [state_machines.MarkerOrder.SUBMITTED_to_ENGRAVED]
        distinguishing_aspect: "engrave on a SUBMITTED marker whose case is only ASSIGNED (not INTERRED) returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["US cemetery, IN_GROUND section + STANDARD gravesite; VETERAN case approved and assigned (ASSIGNED, not INTERRED). A SUBMITTED marker order."]
          setup_api_calls:
            - call: "POST /registry/cemeteries"
              payload: { name: "Engrave National", country_code: "US", honors_squad_capacity: 1 }
              as: NCA_Admin
              captures: { cem_id: $.data.id }
            - call: "POST /registry/sections"
              payload: { cemetery_id: "${cem_id}", code: "A", kind: "IN_GROUND" }
              as: NCA_Admin
              captures: { sec_id: $.data.id }
            - call: "POST /registry/gravesites"
              payload: { section_id: "${sec_id}", grid_ref: "R1C1", gravesite_class: "STANDARD", depth_capacity: 1 }
              as: NCA_Admin
              captures: { grv_id: $.data.id }
            - call: "POST /registry/burial-cases"
              payload: { cemetery_id: "${cem_id}", case_type: "AT_NEED", applicant_role: "VETERAN", requested_class: "STANDARD", character_of_discharge: "HONORABLE", service_days: 3650 }
              as: EligibilityOfficer
              captures: { case_id: $.data.id }
            - call: "POST /registry/burial-cases/${case_id}/eligibility"
              payload: {}
              as: EligibilityOfficer
            - call: "POST /registry/burial-cases/${case_id}/assign-plot"
              payload: {}
              as: SchedulingClerk
            - call: "POST /registry/marker-orders"
              payload: { burial_case_id: "${case_id}", marker_type: "FLAT_GRANITE", inscription_lines: ["A VETERAN"] }
              as: MarkerClerk
              captures: { mk_id: $.data.id }
            - call: "POST /registry/marker-orders/${mk_id}/submit"
              payload: {}
              as: MarkerClerk
          trigger:
            - call: "POST /registry/marker-orders/${mk_id}/engrave"
              payload: {}
              as: MarkerClerk
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "error_id == ERR_INVALID_STATE"

      - name: cancel_already_cancelled_schedule_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.IntermentSchedule.SCHEDULED_to_CANCELLED]
        distinguishing_aspect: "Cancelling an already-CANCELLED interment schedule returns ERR_INVALID_STATE (409); no further cascade."
        test_recipe:
          setup: ["US cemetery, IN_GROUND section + STANDARD gravesite; VETERAN case approved, assigned, scheduled, then schedule CANCELLED."]
          setup_api_calls:
            - call: "POST /registry/cemeteries"
              payload: { name: "Term National", country_code: "US", honors_squad_capacity: 1 }
              as: NCA_Admin
              captures: { cem_id: $.data.id }
            - call: "POST /registry/sections"
              payload: { cemetery_id: "${cem_id}", code: "A", kind: "IN_GROUND" }
              as: NCA_Admin
              captures: { sec_id: $.data.id }
            - call: "POST /registry/gravesites"
              payload: { section_id: "${sec_id}", grid_ref: "R1C1", gravesite_class: "STANDARD", depth_capacity: 1 }
              as: NCA_Admin
              captures: { grv_id: $.data.id }
            - call: "POST /registry/burial-cases"
              payload: { cemetery_id: "${cem_id}", case_type: "AT_NEED", applicant_role: "VETERAN", requested_class: "STANDARD", character_of_discharge: "HONORABLE", service_days: 3650 }
              as: EligibilityOfficer
              captures: { case_id: $.data.id }
            - call: "POST /registry/burial-cases/${case_id}/eligibility"
              payload: {}
              as: EligibilityOfficer
            - call: "POST /registry/burial-cases/${case_id}/assign-plot"
              payload: {}
              as: SchedulingClerk
            - call: "POST /registry/interment-schedules"
              payload: { burial_case_id: "${case_id}", window_start: "2026-06-10T10:00:00Z", window_end: "2026-06-10T12:00:00Z" }
              as: SchedulingClerk
              captures: { sched_id: $.data.id }
            - call: "POST /registry/interment-schedules/${sched_id}/cancel"
              payload: {}
              as: SchedulingClerk
          trigger:
            - call: "POST /registry/interment-schedules/${sched_id}/cancel"
              payload: {}
              as: SchedulingClerk
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "error_id == ERR_INVALID_STATE"

      - name: preneed_deny_from_approved_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.PreNeedDetermination.PENDING_to_DENIED]
        distinguishing_aspect: "Denying a PMC that is already APPROVED (only PENDING may be denied) returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["US cemetery; PRE_NEED VETERAN case approved (ELIGIBLE) with an APPROVED PMC."]
          setup_api_calls:
            - call: "POST /registry/cemeteries"
              payload: { name: "DenyBlock National", country_code: "US", honors_squad_capacity: 1 }
              as: NCA_Admin
              captures: { cem_id: $.data.id }
            - call: "POST /registry/burial-cases"
              payload: { cemetery_id: "${cem_id}", case_type: "PRE_NEED", applicant_role: "VETERAN", requested_class: "STANDARD", character_of_discharge: "HONORABLE", service_days: 3650 }
              as: EligibilityOfficer
              captures: { case_id: $.data.id }
            - call: "POST /registry/burial-cases/${case_id}/eligibility"
              payload: {}
              as: EligibilityOfficer
            - call: "POST /registry/pre-need-determinations"
              payload: { burial_case_id: "${case_id}" }
              as: EligibilityOfficer
              captures: { pmc_id: $.data.id, pmc_v0: $.data.version }
            - call: "POST /registry/pre-need-determinations/${pmc_id}/approve"
              payload: { expected_pmc_version: "${pmc_v0}" }
              as: EligibilityOfficer
          trigger:
            - call: "POST /registry/pre-need-determinations/${pmc_id}/deny"
              payload: {}
              as: EligibilityOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "error_id == ERR_INVALID_STATE"

      - name: burial_case_starts_in_submitted
        claim_type: Initial State
        grounds: [state_machines.BurialCase, entities.BurialCase.fields.status]
        distinguishing_aspect: "A freshly created burial case has status SUBMITTED before any eligibility run."
        test_recipe:
          setup: ["US cemetery."]
          setup_api_calls:
            - call: "POST /registry/cemeteries"
              payload: { name: "Init National", country_code: "US", honors_squad_capacity: 1 }
              as: NCA_Admin
              captures: { cem_id: $.data.id }
          trigger:
            - call: "POST /registry/burial-cases"
              payload: { cemetery_id: "${cem_id}", case_type: "AT_NEED", applicant_role: "VETERAN", requested_class: "STANDARD", character_of_discharge: "HONORABLE", service_days: 3650 }
              as: EligibilityOfficer
              captures: { case_id: $.data.id }
          assert:
            - "response status == 201"
            - "BurialCase.${case_id}.status == SUBMITTED"

  # ===========================================================================
  - section: calculations
    instances:
      - name: eligibility_insufficient_service_denied
        claim_type: Constants Applied
        grounds: [calculations.eligibility_decision, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "A VETERAN with HONORABLE discharge but service_days=729 (below MIN_SERVICE_DAYS=730) is DENIED with denial_reason=INSUFFICIENT_SERVICE; 730 would pass."
        test_recipe:
          setup: ["US cemetery; VETERAN case, HONORABLE, service_days=729, not died in service."]
          setup_api_calls:
            - call: "POST /registry/cemeteries"
              payload: { name: "Service National", country_code: "US", honors_squad_capacity: 1 }
              as: NCA_Admin
              captures: { cem_id: $.data.id }
            - call: "POST /registry/burial-cases"
              payload: { cemetery_id: "${cem_id}", case_type: "AT_NEED", applicant_role: "VETERAN", requested_class: "STANDARD", character_of_discharge: "HONORABLE", service_days: 729 }
              as: EligibilityOfficer
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /registry/burial-cases/${case_id}/eligibility"
              payload: {}
              as: EligibilityOfficer
              captures: { reason: $.data.denial_reason }
          assert:
            - "EligibilityDetermination for ${case_id}: decision == DENIED and denial_reason == INSUFFICIENT_SERVICE"
            - "BurialCase.${case_id}.status == INELIGIBLE"

      - name: overseas_case_at_us_cemetery_denied_cemetery_mismatch
        claim_type: Correct Result
        grounds: [calculations.eligibility_decision, entities.EligibilityDetermination.fields.denial_reason]
        distinguishing_aspect: "An is_overseas_case=true case adjudicated at a US (is_overseas=false) cemetery is DENIED with denial_reason=CEMETERY_MISMATCH — the first branch of the calc."
        test_recipe:
          setup: ["US cemetery; a VETERAN case flagged is_overseas_case=true, HONORABLE, 3650 days."]
          setup_api_calls:
            - call: "POST /registry/cemeteries"
              payload: { name: "Mismatch2 National", country_code: "US", honors_squad_capacity: 1 }
              as: NCA_Admin
              captures: { cem_id: $.data.id }
            - call: "POST /registry/burial-cases"
              payload: { cemetery_id: "${cem_id}", case_type: "AT_NEED", applicant_role: "VETERAN", requested_class: "STANDARD", is_overseas_case: true, character_of_discharge: "HONORABLE", service_days: 3650 }
              as: EligibilityOfficer
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /registry/burial-cases/${case_id}/eligibility"
              payload: {}
              as: EligibilityOfficer
              captures: { reason: $.data.denial_reason }
          assert:
            - "EligibilityDetermination for ${case_id}: decision == DENIED and denial_reason == CEMETERY_MISMATCH"

      - name: overseas_case_at_overseas_cemetery_basis_overseas_only
        claim_type: Correct Result
        grounds: [calculations.eligibility_decision, entities.EligibilityDetermination.fields.basis]
        distinguishing_aspect: "An is_overseas_case=true VETERAN adjudicated at an overseas cemetery (country_code=PH) is APPROVED with basis overridden to OVERSEAS_ONLY."
        test_recipe:
          setup: ["Overseas cemetery (country_code=PH); a VETERAN case is_overseas_case=true, HONORABLE, 3650 days."]
          setup_api_calls:
            - call: "POST /registry/cemeteries"
              payload: { name: "Manila American", country_code: "PH", honors_squad_capacity: 1 }
              as: NCA_Admin
              captures: { cem_id: $.data.id }
            - call: "POST /registry/burial-cases"
              payload: { cemetery_id: "${cem_id}", case_type: "AT_NEED", applicant_role: "VETERAN", requested_class: "STANDARD", is_overseas_case: true, character_of_discharge: "HONORABLE", service_days: 3650 }
              as: EligibilityOfficer
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /registry/burial-cases/${case_id}/eligibility"
              payload: {}
              as: EligibilityOfficer
              captures: { basis: $.data.basis }
          assert:
            - "EligibilityDetermination for ${case_id}: decision == APPROVED and basis == OVERSEAS_ONLY"
            - "BurialCase.${case_id}.status == ELIGIBLE"

      - name: marker_charge_free_allowance_boundary_zero
        claim_type: Precision
        grounds: [calculations.marker_charge]
        distinguishing_aspect: "Inscription totalling exactly 60 chars (=FREE_CHARACTER_ALLOWANCE) with no emblem yields billable_characters=0 and marker_charge_cents=0; 61 chars would charge 250."
        test_recipe:
          setup: ["US cemetery, IN_GROUND section + STANDARD gravesite; VETERAN case approved and assigned; DRAFT marker with lines [40 chars, 20 chars], no emblem."]
          setup_api_calls:
            - call: "POST /registry/cemeteries"
              payload: { name: "Boundary National", country_code: "US", honors_squad_capacity: 1 }
              as: NCA_Admin
              captures: { cem_id: $.data.id }
            - call: "POST /registry/sections"
              payload: { cemetery_id: "${cem_id}", code: "A", kind: "IN_GROUND" }
              as: NCA_Admin
              captures: { sec_id: $.data.id }
            - call: "POST /registry/gravesites"
              payload: { section_id: "${sec_id}", grid_ref: "R1C1", gravesite_class: "STANDARD", depth_capacity: 1 }
              as: NCA_Admin
              captures: { grv_id: $.data.id }
            - call: "POST /registry/burial-cases"
              payload: { cemetery_id: "${cem_id}", case_type: "AT_NEED", applicant_role: "VETERAN", requested_class: "STANDARD", character_of_discharge: "HONORABLE", service_days: 3650 }
              as: EligibilityOfficer
              captures: { case_id: $.data.id }
            - call: "POST /registry/burial-cases/${case_id}/eligibility"
              payload: {}
              as: EligibilityOfficer
            - call: "POST /registry/burial-cases/${case_id}/assign-plot"
              payload: {}
              as: SchedulingClerk
            - call: "POST /registry/marker-orders"
              payload: { burial_case_id: "${case_id}", marker_type: "FLAT_BRONZE", inscription_lines: ["AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA", "BBBBBBBBBBBBBBBBBBBB"] }
              as: MarkerClerk
              captures: { mk_id: $.data.id }
          trigger:
            - call: "POST /registry/marker-orders/${mk_id}/submit"
              payload: {}
              as: MarkerClerk
          assert:
            - "response status == 200"
            - "MarkerOrder.${mk_id}.billable_characters == 0"
            - "MarkerOrder.${mk_id}.marker_charge_cents == 0"

      - name: plot_allocation_auto_select_deterministic_order
        claim_type: Correct Result
        grounds: [calculations.plot_allocation]
        distinguishing_aspect: "With two AVAILABLE STANDARD gravesites (section A grid R1C1 and R1C2), auto assign-plot selects R1C1 first (section.code then grid_ref ASC), leaving R1C2 AVAILABLE."
        test_recipe:
          setup: ["US cemetery, IN_GROUND section A with two STANDARD gravesites R1C1 and R1C2 (created in that order); VETERAN case approved (ELIGIBLE)."]
          setup_api_calls:
            - call: "POST /registry/cemeteries"
              payload: { name: "Alloc National", country_code: "US", honors_squad_capacity: 1 }
              as: NCA_Admin
              captures: { cem_id: $.data.id }
            - call: "POST /registry/sections"
              payload: { cemetery_id: "${cem_id}", code: "A", kind: "IN_GROUND" }
              as: NCA_Admin
              captures: { sec_id: $.data.id }
            - call: "POST /registry/gravesites"
              payload: { section_id: "${sec_id}", grid_ref: "R1C1", gravesite_class: "STANDARD", depth_capacity: 1 }
              as: NCA_Admin
              captures: { grv1: $.data.id }
            - call: "POST /registry/gravesites"
              payload: { section_id: "${sec_id}", grid_ref: "R1C2", gravesite_class: "STANDARD", depth_capacity: 1 }
              as: NCA_Admin
              captures: { grv2: $.data.id }
            - call: "POST /registry/burial-cases"
              payload: { cemetery_id: "${cem_id}", case_type: "AT_NEED", applicant_role: "VETERAN", requested_class: "STANDARD", character_of_discharge: "HONORABLE", service_days: 3650 }
              as: EligibilityOfficer
              captures: { case_id: $.data.id }
            - call: "POST /registry/burial-cases/${case_id}/eligibility"
              payload: {}
              as: EligibilityOfficer
          trigger:
            - call: "POST /registry/burial-cases/${case_id}/assign-plot"
              payload: {}
              as: SchedulingClerk
          assert:
            - "BurialCase.${case_id}.assigned_gravesite_id == ${grv1}"
            - "Gravesite.${grv1}.status == RESERVED"
            - "Gravesite.${grv2}.status == AVAILABLE"

  # ===========================================================================
