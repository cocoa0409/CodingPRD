  # RULE 5 — priority pairs across three different category pairs
  #   5a: state (8)         vs business_temporal (37)
  #   5b: state/OCC (7)     vs business_safety   (22)
  #   5c: business_safety (24) vs business_referential (26)
  # =====================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: scoped_exercise_with_overlapping_window_rejects_on_state_before_window_conflict
        grounds:
          - validations.priority_8
          - validations.priority_37
