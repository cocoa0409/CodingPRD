      - name: a_repeated_settled_action_is_a_conflict_not_a_no_op
        claim_type: idempotency
        grounds:
          - state_machines[AllocationRun].transitions[PROPOSED->COMMITTED]
          - state_machines[AllocationLine].transitions[PENDING->SHIPPED]
          - state_machines[AllocationLine].transitions[SHIPPED->RECEIVED]
          - state_machines[TransferRecommendation].transitions[PROPOSED->APPROVED]
          - entities.StorePosition.fields.in_transit_units
          - entities.StorePosition.fields.reserved_out_units
          - errors.ERR_INVALID_STATE_TRANSITION
