# =============================================================================
# Task 2003 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 Difficulty Rules x 2 instances = 18 instances.
# All chains replay from empty-DB; logical clock default 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: balance_settled_vs_provisional_divergence
        grounds:
          - calculations.account_balances
          - entities.Account.fields.settled_balance_cents
          - entities.Account.fields.provisional_balance_cents
        distinguishing_aspect: |
          Same append-only ledger, two inclusion sets: the settled variant counts
          POSTED entries only, the provisional variant counts POSTED+PENDING, so
          one PENDING deferral credit of 100000 makes the two balances diverge by
          exactly 100000 on identical data. Entity domain: Account ledger balances.
        test_recipe:
          setup:
            - "ACTIVE plan with a FIXED_RATE fund and a 2027 GENERAL window"
            - "vested participant (hire 2023-08-03) with an open account"
            - "LOCKED election with one PENDING deferral credit of 100000 cents, not yet settled"
          setup_api_calls:
            - call: "POST /api/plans"
              payload: { name: "Plan DV", effective_date: "2026-01-01", distribution_events_allowed: ["SEPARATION", "DEATH", "DISABILITY", "FIXED_TIME", "UNFORESEEABLE_EMERGENCY", "CHANGE_IN_CONTROL"], officer_comp_threshold_cents: 20000000, six_month_delay_enabled: true, rabbi_trust_required: false, accelerate_on_cic: false, separation_fraction_test: "DEFAULT_50", vesting_cliff_years: 3, processing_lag_days: 30 }
              as: PlanSponsor
              captures: { plan_id: $.data.id }
            - call: "POST /api/plans/${plan_id}/activate"
              as: PlanSponsor
              captures: { plan_v: $.data.version }
            - call: "POST /api/notional-funds"
              payload: { plan_id: "${plan_id}", ticker: "FIX5", crediting_mode: "FIXED_RATE", annual_rate_bp: 500 }
              as: PlanSponsor
              captures: { fund_id: $.data.id }
            - call: "POST /api/election-windows"
              payload: { plan_id: "${plan_id}", plan_year: 2027, general_open_date: "2026-10-01", general_close_date: "2026-12-31", expected_plan_version: "${plan_v}" }
              as: PlanSponsor
              captures: { window_id: $.data.id }
            - call: "POST /api/participants"
              payload: { plan_id: "${plan_id}", employee_ref: "EMP-DV", hire_date: "2023-08-03", initial_eligibility_date: "2026-01-05", annual_compensation_cents: 30000000 }
              as: BenefitsAdministrator
              captures: { participant_id: $.data.id }
            - call: "POST /api/accounts"
              payload: { participant_id: "${participant_id}", plan_id: "${plan_id}" }
              as: BenefitsAdministrator
              captures: { account_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/deferral-elections"
              payload: { participant_id: "${participant_id}", election_window_id: "${window_id}", election_type: "GENERAL", deferral_percent_bp: 5000, notional_fund_id: "${fund_id}" }
              as: Participant
              as_user_id: "${participant_id}"
              captures: { election_id: $.data.id }
            - call: "POST /api/deferral-elections/${election_id}/submit"
              as: Participant
              as_user_id: "${participant_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/deferral-elections/${election_id}/post-deferral"
              payload: { amount_cents: 100000, service_period_start: "2027-01-01", service_period_end: "2027-01-31" }
              as: BenefitsAdministrator
          trigger:
            - call: "GET /api/accounts/${account_id}/statement"
              as: BenefitsAdministrator
          assert:
            - "statement.settled_balance_cents == 0"
            - "statement.provisional_balance_cents == 100000"
            - "statement.pending_entries_count == 1"
            - "statement.posted_entries_count == 0"
            - "settled and provisional diverge by exactly the unsettled PENDING entry (100000)"
      - name: separation_fraction_plan_variant_determination_flip
        grounds:
          - calculations.service_fraction_average
          - entities.Plan.fields.separation_fraction_test
          - state_machines.SeparationCase.EVIDENCE_SUBMITTED_to_DETERMINED_SEPARATED
        distinguishing_aspect: |
          Identical service records (weighted average 4001 bp) produce opposite
          determination validity under the two plan-elected variants: CONFIRMED is
          valid under DEFAULT_50 (4001 < 5000) and rejected under LIBERAL_20
          (4001 >= 2000). Entity domain: SeparationCase/Participant employment
          determination — distinct from the Account balance domain of the sibling
          instance.
        test_recipe:
          setup:
            - "Two ACTIVE plans identical except separation_fraction_test: P50 DEFAULT_50, P20 LIBERAL_20"
            - "One participant per plan, each with an EVIDENCE_SUBMITTED separation case whose records average 4001 bp over 1096 contiguous days ending 2026-06-30"
          setup_api_calls:
            - call: "POST /api/plans"
              payload: { name: "Plan P50", effective_date: "2026-01-01", distribution_events_allowed: ["SEPARATION"], officer_comp_threshold_cents: 20000000, separation_fraction_test: "DEFAULT_50" }
              as: PlanSponsor
              captures: { plan50_id: $.data.id }
            - call: "POST /api/plans/${plan50_id}/activate"
              as: PlanSponsor
            - call: "POST /api/plans"
              payload: { name: "Plan P20", effective_date: "2026-01-01", distribution_events_allowed: ["SEPARATION"], officer_comp_threshold_cents: 20000000, separation_fraction_test: "LIBERAL_20" }
              as: PlanSponsor
              captures: { plan20_id: $.data.id }
            - call: "POST /api/plans/${plan20_id}/activate"
              as: PlanSponsor
            - call: "POST /api/participants"
              payload: { plan_id: "${plan50_id}", employee_ref: "EMP-50", hire_date: "2020-01-06", initial_eligibility_date: "2026-01-05", annual_compensation_cents: 30000000 }
              as: BenefitsAdministrator
              captures: { p50_id: $.data.id }
            - call: "POST /api/participants"
              payload: { plan_id: "${plan20_id}", employee_ref: "EMP-20", hire_date: "2020-01-06", initial_eligibility_date: "2026-01-05", annual_compensation_cents: 30000000 }
              as: BenefitsAdministrator
              captures: { p20_id: $.data.id }
            - call: "POST /api/separation-cases"
              payload: { participant_id: "${p50_id}", alleged_separation_date: "2026-06-30", trigger_reason: "SERVICE_REDUCTION" }
              as: BenefitsAdministrator
              as_user_id: "ba-1"
              captures: { case50_id: $.data.id }
            - call: "POST /api/separation-cases"
              payload: { participant_id: "${p20_id}", alleged_separation_date: "2026-06-30", trigger_reason: "SERVICE_REDUCTION" }
              as: BenefitsAdministrator
              as_user_id: "ba-1"
              captures: { case20_id: $.data.id }
            - call: "POST /api/separation-cases/${case50_id}/service-records"
              payload: { period_start: "2023-06-30", period_end: "2024-06-30", service_fraction_bp: 6000 }
              as: BenefitsAdministrator
            - call: "POST /api/separation-cases/${case50_id}/service-records"
              payload: { period_start: "2024-06-30", period_end: "2025-06-30", service_fraction_bp: 4000 }
              as: BenefitsAdministrator
            - call: "POST /api/separation-cases/${case50_id}/service-records"
              payload: { period_start: "2025-06-30", period_end: "2026-06-30", service_fraction_bp: 2000 }
              as: BenefitsAdministrator
            - call: "POST /api/separation-cases/${case20_id}/service-records"
              payload: { period_start: "2023-06-30", period_end: "2024-06-30", service_fraction_bp: 6000 }
              as: BenefitsAdministrator
            - call: "POST /api/separation-cases/${case20_id}/service-records"
              payload: { period_start: "2024-06-30", period_end: "2025-06-30", service_fraction_bp: 4000 }
              as: BenefitsAdministrator
            - call: "POST /api/separation-cases/${case20_id}/service-records"
              payload: { period_start: "2025-06-30", period_end: "2026-06-30", service_fraction_bp: 2000 }
              as: BenefitsAdministrator
          trigger:
            - call: "POST /api/separation-cases/${case50_id}/determine"
              payload: { outcome: "CONFIRMED_SEPARATION" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { case50_status: $.data.status, case50_avg: $.data.computed_avg_fraction_bp }
            - call: "POST /api/separation-cases/${case20_id}/determine"
              payload: { outcome: "CONFIRMED_SEPARATION" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { det20_err: $.data.error_id }
          assert:
            - "${case50_avg} == 4001 (floor(4386000/1096))"
            - "${case50_status} == DETERMINED_SEPARATED (4001 < 5000 presumption met under DEFAULT_50)"
            - "${det20_err} == ERR_SERVICE_FRACTION_CONTRADICTS_OUTCOME (identical records, 4001 >= 2000 under LIBERAL_20)"
            - "SeparationCase.${case20_id}.status remains EVIDENCE_SUBMITTED"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: crediting_round_per_entry_then_sum
        grounds:
          - calculations.notional_crediting
          - entities.CreditingRun.fields.total_gain_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: the scaffold pins round-per-(account,fund)-
          entry-then-sum. Two funds each holding 33333 settled cents at 500 bp for
          31 days yield raw 141.5514 per entry; per-entry round_half_up gives
          142+142=284, while the forbidden sum-then-round order gives
          round_half_up(283.1028)=283 — one cent of divergence on identical input.
        test_recipe:
          setup:
            - "ACTIVE plan, two FIXED_RATE funds F1/F2 at 500 bp, windows for 2027 and 2028"
            - "one vested participant whose single account holds exactly 33333 settled cents in EACH fund (two elections, two deferrals, both settled)"
            - "no prior crediting runs"
          setup_api_calls:
            - call: "POST /api/plans"
              payload: { name: "Plan CR", effective_date: "2026-01-01", distribution_events_allowed: ["SEPARATION"], officer_comp_threshold_cents: 20000000, vesting_cliff_years: 3 }
              as: PlanSponsor
              captures: { plan_id: $.data.id }
            - call: "POST /api/plans/${plan_id}/activate"
              as: PlanSponsor
              captures: { plan_v: $.data.version }
            - call: "POST /api/notional-funds"
              payload: { plan_id: "${plan_id}", ticker: "FA", crediting_mode: "FIXED_RATE", annual_rate_bp: 500 }
              as: PlanSponsor
              captures: { fund1_id: $.data.id }
            - call: "POST /api/notional-funds"
              payload: { plan_id: "${plan_id}", ticker: "FB", crediting_mode: "FIXED_RATE", annual_rate_bp: 500 }
              as: PlanSponsor
              captures: { fund2_id: $.data.id }
            - call: "POST /api/election-windows"
              payload: { plan_id: "${plan_id}", plan_year: 2027, general_open_date: "2026-10-01", general_close_date: "2026-12-31", expected_plan_version: "${plan_v}" }
              as: PlanSponsor
              captures: { window1_id: $.data.id }
            - call: "GET /api/plans/${plan_id}"
              as: PlanSponsor
              captures: { plan_v: $.data.version }
            - call: "POST /api/election-windows"
              payload: { plan_id: "${plan_id}", plan_year: 2028, general_open_date: "2027-10-01", general_close_date: "2027-12-31", expected_plan_version: "${plan_v}" }
              as: PlanSponsor
              captures: { window2_id: $.data.id }
            - call: "POST /api/participants"
              payload: { plan_id: "${plan_id}", employee_ref: "EMP-CR", hire_date: "2023-08-03", initial_eligibility_date: "2026-01-05", annual_compensation_cents: 30000000 }
              as: BenefitsAdministrator
              captures: { participant_id: $.data.id }
            - call: "POST /api/accounts"
              payload: { participant_id: "${participant_id}", plan_id: "${plan_id}" }
              as: BenefitsAdministrator
              captures: { account_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/deferral-elections"
              payload: { participant_id: "${participant_id}", election_window_id: "${window1_id}", election_type: "GENERAL", deferral_percent_bp: 5000, notional_fund_id: "${fund1_id}" }
              as: Participant
              as_user_id: "${participant_id}"
              captures: { election1_id: $.data.id }
            - call: "POST /api/deferral-elections/${election1_id}/submit"
              as: Participant
              as_user_id: "${participant_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/deferral-elections/${election1_id}/post-deferral"
              payload: { amount_cents: 33333, service_period_start: "2027-01-01", service_period_end: "2027-01-31" }
              as: BenefitsAdministrator
            - call: "POST /api/accounts/${account_id}/settle-entries"
              as: BenefitsAdministrator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-10-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/deferral-elections"
              payload: { participant_id: "${participant_id}", election_window_id: "${window2_id}", election_type: "GENERAL", deferral_percent_bp: 5000, notional_fund_id: "${fund2_id}" }
              as: Participant
              as_user_id: "${participant_id}"
              captures: { election2_id: $.data.id }
            - call: "POST /api/deferral-elections/${election2_id}/submit"
              as: Participant
              as_user_id: "${participant_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/deferral-elections/${election2_id}/post-deferral"
              payload: { amount_cents: 33333, service_period_start: "2028-01-01", service_period_end: "2028-01-31" }
              as: BenefitsAdministrator
            - call: "POST /api/accounts/${account_id}/settle-entries"
              as: BenefitsAdministrator
            - call: "GET /api/plans/${plan_id}"
              as: PlanSponsor
              captures: { plan_v: $.data.version }
          trigger:
            - call: "POST /api/crediting-runs"
              payload: { plan_id: "${plan_id}", period_start: "2028-03-01", period_end: "2028-04-01", expected_plan_version: "${plan_v}" }
              as: BenefitsAdministrator
              captures: { run_id: $.data.id, run_total: $.data.total_gain_cents }
          assert:
            - "${run_total} == 284 (round_half_up(33333*500*31/3650000)=142 per entry; 142+142)"
            - "GET /api/ledger-entries?crediting_run_id=${run_id} returns exactly 2 CREDITING_GAIN entries of amount_cents == 142 each"
            - "Account.${account_id}.settled_balance_cents == 66950 (33333+33333+284)"
            - "the forbidden sum-then-round order would yield 283 — the observed 284 pins the per-entry-first order"
      - name: six_month_delay_nested_max_scheduling
        grounds:
          - calculations.scheduled_payment_date
          - state_machines.DistributionRequest.EVENT_VERIFIED_to_SCHEDULED
          - state_machines.SpecifiedEmployeeList.DRAFT_to_FINALIZED
        distinguishing_aspect: |
          Mode (a): the formula takes >= 3 inputs (event_type, separation_date,
          processing_lag_days, plan.six_month_delay_enabled,
          participant.is_specified_employee) with conditional branches feeding a
          nested max. Same separation (2027-03-15, lag 30): not-specified yields
          max(2027-04-14, -) = 2027-04-14; specified yields
          max(2027-04-14, 2027-09-15) = 2027-09-15.
        test_recipe:
          setup:
            - "ACTIVE plan with six_month_delay_enabled=true, processing_lag_days=30"
            - "vested participant, account funded with 100000 settled cents, separation confirmed with alleged_separation_date 2027-03-15 (records avg 2666 bp < 5000)"
            - "participant not yet specified at first scheduling; a FIVE_PERCENT_OWNER specified list finalizes mid-test"
          setup_api_calls:
            - call: "POST /api/plans"
              payload: { name: "Plan SD", effective_date: "2026-01-01", distribution_events_allowed: ["SEPARATION", "FIXED_TIME"], officer_comp_threshold_cents: 20000000, six_month_delay_enabled: true, processing_lag_days: 30, vesting_cliff_years: 3 }
              as: PlanSponsor
              captures: { plan_id: $.data.id }
            - call: "POST /api/plans/${plan_id}/activate"
              as: PlanSponsor
              captures: { plan_v: $.data.version }
            - call: "POST /api/notional-funds"
              payload: { plan_id: "${plan_id}", ticker: "FIX5", crediting_mode: "FIXED_RATE", annual_rate_bp: 500 }
              as: PlanSponsor
              captures: { fund_id: $.data.id }
            - call: "POST /api/election-windows"
              payload: { plan_id: "${plan_id}", plan_year: 2027, general_open_date: "2026-10-01", general_close_date: "2026-12-31", expected_plan_version: "${plan_v}" }
              as: PlanSponsor
              captures: { window_id: $.data.id }
            - call: "POST /api/participants"
              payload: { plan_id: "${plan_id}", employee_ref: "EMP-SD", hire_date: "2023-08-03", initial_eligibility_date: "2026-01-05", annual_compensation_cents: 30000000 }
              as: BenefitsAdministrator
              captures: { participant_id: $.data.id }
            - call: "POST /api/accounts"
              payload: { participant_id: "${participant_id}", plan_id: "${plan_id}" }
              as: BenefitsAdministrator
              captures: { account_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/deferral-elections"
              payload: { participant_id: "${participant_id}", election_window_id: "${window_id}", election_type: "GENERAL", deferral_percent_bp: 5000, notional_fund_id: "${fund_id}" }
              as: Participant
              as_user_id: "${participant_id}"
              captures: { election_id: $.data.id }
            - call: "POST /api/deferral-elections/${election_id}/submit"
              as: Participant
              as_user_id: "${participant_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/deferral-elections/${election_id}/post-deferral"
              payload: { amount_cents: 100000, service_period_start: "2027-01-01", service_period_end: "2027-01-31" }
              as: BenefitsAdministrator
            - call: "POST /api/accounts/${account_id}/settle-entries"
              as: BenefitsAdministrator
            - call: "POST /api/separation-cases"
              payload: { participant_id: "${participant_id}", alleged_separation_date: "2027-03-15", trigger_reason: "TERMINATION" }
              as: BenefitsAdministrator
              as_user_id: "ba-1"
              captures: { case_id: $.data.id }
            - call: "POST /api/separation-cases/${case_id}/service-records"
              payload: { period_start: "2024-03-15", period_end: "2025-03-15", service_fraction_bp: 6000 }
              as: BenefitsAdministrator
            - call: "POST /api/separation-cases/${case_id}/service-records"
              payload: { period_start: "2025-03-15", period_end: "2026-03-15", service_fraction_bp: 2000 }
              as: BenefitsAdministrator
            - call: "POST /api/separation-cases/${case_id}/service-records"
              payload: { period_start: "2026-03-15", period_end: "2027-03-15", service_fraction_bp: 0 }
              as: BenefitsAdministrator
            - call: "POST /api/separation-cases/${case_id}/determine"
              payload: { outcome: "CONFIRMED_SEPARATION" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /api/distribution-requests"
              payload: { account_id: "${account_id}", event_type: "SEPARATION", separation_case_id: "${case_id}" }
              as: Participant
              as_user_id: "${participant_id}"
              captures: { req_a: $.data.id }
            - call: "POST /api/distribution-requests/${req_a}/verify-event"
              as: ComplianceOfficer
            - call: "POST /api/distribution-requests/${req_a}/schedule"
              as: BenefitsAdministrator
              captures: { sched_a: $.data.scheduled_payment_date, locked_a: $.data.locked_amount_cents }
            - call: "GET /api/plans/${plan_id}"
              as: PlanSponsor
              captures: { plan_v2: $.data.version }
            - call: "POST /api/specified-employee-lists"
              payload: { plan_id: "${plan_id}", identification_date: "2027-01-01", effective_date: "2027-04-01", expected_plan_version: "${plan_v2}" }
              as: ComplianceOfficer
              captures: { list_id: $.data.id }
            - call: "POST /api/specified-employee-lists/${list_id}/members"
              payload: { participant_id: "${participant_id}", basis: "FIVE_PERCENT_OWNER", annual_compensation_cents: 30000000 }
              as: ComplianceOfficer
            - call: "POST /api/specified-employee-lists/${list_id}/finalize"
              as: ComplianceOfficer
          trigger:
            - call: "GET /api/distribution-requests/${req_a}"
              as: BenefitsAdministrator
              captures: { sched_a_after: $.data.scheduled_payment_date }
            - call: "POST /api/distribution-requests"
              payload: { account_id: "${account_id}", event_type: "SEPARATION", separation_case_id: "${case_id}", requested_amount_cents: 50000 }
              as: Participant
              as_user_id: "${participant_id}"
              captures: { req_b: $.data.id }
            - call: "POST /api/distribution-requests/${req_b}/verify-event"
              as: ComplianceOfficer
            - call: "POST /api/distribution-requests/${req_b}/schedule"
              as: BenefitsAdministrator
              captures: { sched_b: $.data.scheduled_payment_date }
          assert:
            - "${sched_a} == 2027-04-14 (base = separation 2027-03-15 + 30 lag days; delay inapplicable while not specified)"
            - "${sched_a_after} == 2027-09-15 (finalize cascade recomputed max(base, separation+6 calendar months))"
            - "${sched_b} == 2027-09-15 (nested max selects the six-month delay floor for a specified employee)"
            - "${locked_a} == 100000 (full vested balance when requested_amount_cents omitted)"
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: participant_separation_rehire_cycle
        grounds:
          - state_machines.Participant
          - state_machines.SeparationCase.EVIDENCE_SUBMITTED_to_DETERMINED_SEPARATED
        distinguishing_aspect: |
          Cyclic machine (A->B->C->A): Participant ACTIVE -> SEPARATION_REVIEW ->
          SEPARATED -> ACTIVE via rehire, with per-hop field effects
          (separation_date set then cleared, is_specified_employee reset).
          Entity: Participant.
        test_recipe:
          setup:
            - "ACTIVE plan; participant ACTIVE; separation case with evidence averaging 2666 bp ending 2027-03-15"
          setup_api_calls:
            - call: "POST /api/plans"
              payload: { name: "Plan CY", effective_date: "2026-01-01", distribution_events_allowed: ["SEPARATION"], officer_comp_threshold_cents: 20000000 }
              as: PlanSponsor
              captures: { plan_id: $.data.id }
            - call: "POST /api/plans/${plan_id}/activate"
              as: PlanSponsor
            - call: "POST /api/participants"
              payload: { plan_id: "${plan_id}", employee_ref: "EMP-CY", hire_date: "2023-08-03", initial_eligibility_date: "2026-01-05", annual_compensation_cents: 30000000 }
              as: BenefitsAdministrator
              captures: { participant_id: $.data.id }
            - call: "POST /api/separation-cases"
              payload: { participant_id: "${participant_id}", alleged_separation_date: "2027-03-15", trigger_reason: "RESIGNATION" }
              as: BenefitsAdministrator
              as_user_id: "ba-1"
              captures: { case_id: $.data.id }
            - call: "POST /api/separation-cases/${case_id}/service-records"
              payload: { period_start: "2024-03-15", period_end: "2025-03-15", service_fraction_bp: 6000 }
              as: BenefitsAdministrator
