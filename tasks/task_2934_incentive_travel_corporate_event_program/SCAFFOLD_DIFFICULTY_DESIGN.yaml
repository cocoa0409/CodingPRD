  - name: room_nights_blocked_is_conserved_as_confirmed_plus_available
    grounds:
    - '§1.3 room_night_ledger ("CONSERVED QUANTITY: room_nights_blocked == room_nights_confirmed + room_nights_available,
      always")'
    - §1.3 room_night_ledger (attrition_floor_room_nights, shortfall_room_nights, attrition_posture)
    - §1.1 SupplierContract.room_nights_blocked, room_nights_confirmed, room_nights_available
    - §1.2 Registration CONFIRMED -> CANCELLED side_effect "releases room_nights"
    distinguishing_aspect: |-
      Room-nights are conserved: room_nights_blocked stays pinned at 60 while room_nights_confirmed and room_nights_available move in exact opposition across two confirmations and one cancellation (0/60 -> 10/50 -> 15/45 -> 5/55), and the derived shortfall_room_nights tracks the same ledger (38 -> 33 -> 43) without ever letting the sum drift.
