            - "ModificationRequest.${m_id}.status == WITHDRAWN (cascade) and ConsentVote.${v1}.status == VOIDED"
            - "DistributionRun.${run_id}.interest_pool_cents == 57777 (13,333 base 8/1-8/11 + 44,444 at 1200+800bps 8/11-8/31)"
            - "DistributionRun.${run_id}.servicing_fee_cents == 833"
            - "Facility.${f_id}.accrued_interest_cents == 57777 after run creation (re-rated via draw hop)"

      - name: buyback_settle_voids_votes_rebases_tally
        grounds:
          - state_machines.BuybackDemand.ACKNOWLEDGED_to_SETTLED
          - state_machines.DefaultVote.CAST_to_VOIDED
          - calculations.default_vote_tally
        distinguishing_aspect: |
          Depth-3 chain from a third trigger (buyback settle): demand settle -> Participant
          EXITED with committed_cents reduced -> CAST DefaultVote VOIDED and tally rebased
          (accelerate_share collapses 3000 -> 0), then a single remaining participant's vote
          clears the supermajority at 8571 bps against the adjusted base.
        test_recipe:
          setup:
            - "Facility 10,000,000 (P1 6,000,000 / P2 3,000,000 / P3 1,000,000 funded), draw 5,000,000 SETTLED 2026-08-01"
