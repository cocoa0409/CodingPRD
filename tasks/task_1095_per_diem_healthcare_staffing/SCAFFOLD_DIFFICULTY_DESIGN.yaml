            - "Facility.${fac_id}.pending_pay_cents == 300900"

      - name: award_with_empty_eligible_pool_returns_no_eligible_claim
        grounds:
          - calculations.claim_award_selection
          - validations[priority=98]
          - errors[ERR_NO_ELIGIBLE_CLAIM]
          - state_machines.Credential.VERIFIED_to_REVOKED
        distinguishing_aspect: |
          An EMPTY-SET boundary on a different metric (candidate-pool cardinality, not an hour
          threshold) reached through a different endpoint (POST /staffing/shifts/{id}/award):
          the shift still has one PENDING claim, but after the claimant's licence is revoked the
          eligibility filter leaves zero candidates and the empty-pool fallback must fire.
        test_recipe:
          setup:
            - "Clock at 2026-06-01T00:00:00Z; facility Willow Bend requiring RN_LICENSE; RN rate card 7500."
            - "Clinician Lena Kwan claimed Shift 2026-06-08T07:00Z..19:00Z while her RN_LICENSE was VERIFIED."
            - "A ComplianceOfficer has since REVOKED that licence, so the claim is still PENDING but its clinician is no longer eligible."
          setup_api_calls:
            - call: "POST /staffing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /staffing/facilities"
              payload: { name: "Willow Bend", unit_name: "ICU", unit_capacity: 2, required_credential_types: ["RN_LICENSE"] }
              as: PlatformAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /staffing/facilities/${fac_id}/rate-cards"
              payload: { specialty: "RN", base_pay_rate_cents_per_hour: 7500, effective_from: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /staffing/clinicians"
              payload: { full_name: "Lena Kwan", email: "lena.kwan@example.com", specialty: "RN" }
              as: PlatformAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /staffing/clinicians/${cl_id}/credentials"
              payload: { credential_type: "RN_LICENSE", license_number: "RN-1313", issued_on: "2025-01-01T00:00:00Z", expires_on: "2027-01-01T00:00:00Z" }
              as: Clinician
              as_user_id: "${cl_id}"
              captures: { cred_id: $.data.id }
            - call: "POST /staffing/credentials/${cred_id}/verify"
              payload: { decision: "VERIFIED" }
              as: ComplianceOfficer
            - call: "POST /staffing/orders"
              payload: { facility_id: "${fac_id}", specialty: "RN", headcount: 1, urgency: "STANDARD", window_start: "2026-06-08T00:00:00Z", window_end: "2026-06-15T00:00:00Z" }
              as: FacilityScheduler
              as_user_id: "${fac_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /staffing/orders/${ord_id}/shifts"
              payload: { scheduled_start: "2026-06-08T07:00:00Z", scheduled_end: "2026-06-08T19:00:00Z" }
              as: FacilityScheduler
              as_user_id: "${fac_id}"
              captures: { sh_id: $.data.id }
            - call: "POST /staffing/shifts/${sh_id}/claims"
              payload: { clinician_id: "${cl_id}" }
              as: Clinician
              as_user_id: "${cl_id}"
              captures: { clm_id: $.data.id }
            - call: "POST /staffing/credentials/${cred_id}/revoke"
              payload: { reason: "licence surrendered" }
              as: ComplianceOfficer
            - call: "GET /staffing/shifts/${sh_id}"
              as: FacilityScheduler
              as_user_id: "${fac_id}"
              captures: { sh_v: $.data.version, cc: $.data.claim_count }
          trigger:
            - call: "POST /staffing/shifts/${sh_id}/award"
              payload: { expected_shift_version: "${sh_v}" }
              as: FacilityScheduler
              as_user_id: "${fac_id}"
              captures: { err: $.data.error_id }
          assert:
            - "${cc} == 1"
            - "${err} == ERR_NO_ELIGIBLE_CLAIM with HTTP 409"
            - "Shift.${sh_id}.status == OPEN"
            - "ShiftClaim.${clm_id}.status == PENDING"
            - "StaffingOrder.${ord_id}.filled_count == 0 and StaffingOrder.${ord_id}.open_count == 1"
            - "GET /staffing/assignments?shift_id=${sh_id} returns 0 items"

