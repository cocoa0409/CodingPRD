          ImplementationStrategy carries two independent state dimensions on
          one row: three consecutive execution-status calls walk
          ON_TRACK -> AT_RISK -> BEHIND -> ON_TRACK while approval_state stays
          APPROVED at every step, and the execution axis is free to move
          backwards where the approval axis is not.
