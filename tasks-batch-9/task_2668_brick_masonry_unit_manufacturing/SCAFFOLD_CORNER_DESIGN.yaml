# ===========================================================================
# 1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task 2668 - Brick & Masonry Unit Manufacturing
#
# Breadth probe. Every instance is a claim the scaffold's sections 1.1-1.7
# already declare; section values and claim_type values come from
# references/claim-extraction-guide.md and nothing else. Corners already
# asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as excluded_because
# stubs with no test_recipe.
#
# Shared bootstrap conventions (identical to the 1.8 file):
#   - The logical clock starts at 2026-08-01T00:00:00Z.
#   - Plant "P1": grid (0,0), market_radius_miles 300,
#     freight_rate_cents_per_ton_mile 42, base_capacity_green_units_per_day
#     40000, unloading_equipment_available
#     [CUSTOMER_FORKLIFT, TRUCK_MOUNTED_FORKLIFT, CRANE].
#   - Formulation "F1": 50.00 percent CLAY pit (Fe 7.500 / CaO 1.200) plus
#     50.00 percent SHALE pit (Fe 5.000 / CaO 0.800) -> blend_iron_oxide_pct
#     6.250, blend_lime_pct 1.000, shale_share_pct 50.00, absorption_index
#     8.00, computed_durability_grade SW, clay_tons_per_thousand_units 3.20.
#   - Kiln "K1": position_count 5 (centerline 3.0), setpoint_peak_c 1050,
#     cooldown_buffer_hours 6.0. Fired at 1040 C / 3.0 h: base_cdi 20.68,
#     position 3 -> color_index 52.18, positions 1 and 5 -> 49.81.
#   - Run of 10000 green units losing 400 -> net 9600 units, status SET.
#   - PlantOperator is entity_backed:Plant, so its X-User-ID is a Plant id.
#     All other roles use opaque ids (sales-001, blend-001, qual-001,
#     arch-001, logi-001, admin-001, body-001).
# ===========================================================================
scaffold_corner_design:

  # =======================================================================
  # SECTION 1 - Entities
  # =======================================================================
  - section: entities
    instances:
      - name: plant_creation_returns_all_declared_fields
        claim_type: creation
        grounds:
          - entities.Plant
          - endpoints["POST /plants"]
        distinguishing_aspect: "All eight input fields are echoed and every source:system / source:computed field on Plant is populated at 201, not left absent."
        test_recipe:
          setup:
            - "Empty database with the logical clock at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
              as_user_id: "admin-001"
          trigger:
            - call: "POST /plants"
              payload: { plant_code: "P1", name: "Riverbend Brick", grid_x: 0, grid_y: 0, market_radius_miles: 300, freight_rate_cents_per_ton_mile: 42, base_capacity_green_units_per_day: 40000, unloading_equipment_available: ["CUSTOMER_FORKLIFT", "TRUCK_MOUNTED_FORKLIFT", "CRANE"] }
              as: PlantAdmin
              as_user_id: "admin-001"
              captures: { p1: "$.data.id", p1_status: "$.data.status", p1_scrap: "$.data.fired_scrap_units", p1_idled: "$.data.idled_at", p1_version: "$.data.version" }
          assert:
            - "HTTP 201 with response_type object"
            - "plant_code == P1, name == Riverbend Brick, grid_x == 0, grid_y == 0, market_radius_miles == 300, freight_rate_cents_per_ton_mile == 42, base_capacity_green_units_per_day == 40000"
            - "unloading_equipment_available == [CUSTOMER_FORKLIFT, TRUCK_MOUNTED_FORKLIFT, CRANE] with order preserved"
            - "${p1_status} == ACTIVE (the state machine's initial_state)"
            - "${p1_scrap} == 0 and ${p1_idled} == null"
            - "${p1} is a bare UUID with no type prefix, and ${p1_version} == 1"

      - name: plant_single_resource_get_returns_stored_row
        claim_type: retrieval
        grounds:
          - endpoints["GET /plants/{id}"]
        distinguishing_aspect: "A read-back of the created plant returns byte-identical business fields, proving persistence rather than echo."
        test_recipe:
          setup:
            - "Plant P1 created as in the shared bootstrap"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
              as_user_id: "admin-001"
            - call: "POST /plants"
              payload: { plant_code: "P1", name: "Riverbend Brick", grid_x: 0, grid_y: 0, market_radius_miles: 300, freight_rate_cents_per_ton_mile: 42, base_capacity_green_units_per_day: 40000, unloading_equipment_available: ["CUSTOMER_FORKLIFT", "TRUCK_MOUNTED_FORKLIFT", "CRANE"] }
              as: PlantAdmin
              as_user_id: "admin-001"
              captures: { p1: "$.data.id", p1_created: "$.data.created_at" }
          trigger:
            - call: "GET /plants/${p1}"
              payload: {}
              as: SalesRep
              as_user_id: "sales-001"
              captures: { got_id: "$.data.id", got_code: "$.data.plant_code", got_radius: "$.data.market_radius_miles", got_created: "$.data.created_at" }
          assert:
            - "HTTP 200 with response_type object"
            - "${got_id} == ${p1}, ${got_code} == P1 and ${got_radius} == 300"
            - "${got_created} == ${p1_created} - created_at is stable across reads"
            - "Any role may read: SalesRep is not the creating role and still gets 200"

      - name: plants_list_honors_limit_and_offset
        claim_type: listing
        grounds:
          - endpoints["GET /plants"]
          - response_envelope.pagination_fields
        distinguishing_aspect: "Three plants exist; limit 2 returns exactly two rows with has_more true, and offset 2 returns the remaining one with has_more false - total_count stays 3 in both responses."
        test_recipe:
          setup:
            - "Three ACTIVE plants P1, P2 and P3 created in that order"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
              as_user_id: "admin-001"
            - call: "POST /plants"
              payload: { plant_code: "P1", name: "Riverbend Brick", grid_x: 0, grid_y: 0, market_radius_miles: 300, freight_rate_cents_per_ton_mile: 42, base_capacity_green_units_per_day: 40000, unloading_equipment_available: ["CUSTOMER_FORKLIFT"] }
              as: PlantAdmin
              as_user_id: "admin-001"
              captures: { p1: "$.data.id" }
            - call: "POST /plants"
              payload: { plant_code: "P2", name: "Kilnside Works", grid_x: 100, grid_y: 0, market_radius_miles: 300, freight_rate_cents_per_ton_mile: 40, base_capacity_green_units_per_day: 30000, unloading_equipment_available: ["CRANE"] }
              as: PlantAdmin
              as_user_id: "admin-001"
              captures: { p2: "$.data.id" }
            - call: "POST /plants"
              payload: { plant_code: "P3", name: "Shale Hollow", grid_x: 200, grid_y: 0, market_radius_miles: 300, freight_rate_cents_per_ton_mile: 45, base_capacity_green_units_per_day: 20000, unloading_equipment_available: ["CRANE"] }
              as: PlantAdmin
              as_user_id: "admin-001"
              captures: { p3: "$.data.id" }
          trigger:
            - call: "GET /plants"
              payload: { limit: 2, offset: 0 }
              as: PlantAdmin
              as_user_id: "admin-001"
              captures: { page1_first: "$.data[0].plant_code" }
            - call: "GET /plants"
              payload: { limit: 2, offset: 2 }
              as: PlantAdmin
              as_user_id: "admin-001"
              captures: { page2_first: "$.data[0].plant_code" }
          assert:
            - "First response: response_type array, exactly 2 elements, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "${page1_first} == P1 - default ordering is created_at ASC, never by id"
            - "Second response: exactly 1 element, total_count == 3, has_more == false, offset == 2"
            - "${page2_first} == P3"
            - "The union of the two pages is exactly {P1, P2, P3} with no duplicates"

      - name: plant_get_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - validations[priority=4]
          - errors[ERR_PLANT_NOT_FOUND]
        distinguishing_aspect: "A syntactically valid but unknown UUID on a GET path yields 404 ERR_PLANT_NOT_FOUND rather than an empty 200 body."
        test_recipe:
          setup:
            - "Exactly one plant P1 exists, so the database is non-empty and the 404 is genuinely id-driven"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
              as_user_id: "admin-001"
            - call: "POST /plants"
              payload: { plant_code: "P1", name: "Riverbend Brick", grid_x: 0, grid_y: 0, market_radius_miles: 300, freight_rate_cents_per_ton_mile: 42, base_capacity_green_units_per_day: 40000, unloading_equipment_available: ["CRANE"] }
              as: PlantAdmin
              as_user_id: "admin-001"
              captures: { p1: "$.data.id" }
          trigger:
            - call: "GET /plants/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-001"
              captures: { err: "$.data.error_id", msg: "$.data.message" }
          assert:
            - "${err} == ERR_PLANT_NOT_FOUND with HTTP 404"
            - "The envelope is the declared error shape: response_type error and data carrying error_id plus ${msg}"
            - "P1 is unaffected and still readable"

      - name: plant_creation_missing_required_market_radius_returns_invalid_request
        claim_type: required_fields
        grounds:
          - validations[priority=7]
          - entities.Plant.fields.market_radius_miles
        distinguishing_aspect: "market_radius_miles has source input and no default, so omitting it is a 400 ERR_INVALID_REQUEST, not a silent zero radius that would break plant assignment."
        test_recipe:
          setup:
            - "Empty database"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
              as_user_id: "admin-001"
          trigger:
            - call: "POST /plants"
              payload: { plant_code: "P1", name: "Riverbend Brick", grid_x: 0, grid_y: 0, freight_rate_cents_per_ton_mile: 42, base_capacity_green_units_per_day: 40000, unloading_equipment_available: ["CRANE"] }
              as: PlantAdmin
              as_user_id: "admin-001"
              captures: { err: "$.data.error_id" }
          assert:
            - "${err} == ERR_INVALID_REQUEST with HTTP 400"
            - "No Plant row is persisted: a subsequent GET /plants returns total_count == 0"

      - name: order_omitted_optional_flags_default_to_false
        claim_type: defaults
        grounds:
          - entities.Order.fields.is_special_order
          - entities.Order.fields.requires_panel_approval
          - calculations.order_lead_time
        distinguishing_aspect: "is_special_order and requires_panel_approval are the only two optional booleans on POST /orders; omitting both must yield false / false, which is observable through lead_time_days 15 rather than 50."
        test_recipe:
          setup:
            - "Plant P1 ACTIVE with base_capacity_green_units_per_day 40000"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
              as_user_id: "admin-001"
            - call: "POST /plants"
              payload: { plant_code: "P1", name: "Riverbend Brick", grid_x: 0, grid_y: 0, market_radius_miles: 300, freight_rate_cents_per_ton_mile: 42, base_capacity_green_units_per_day: 40000, unloading_equipment_available: ["TRUCK_MOUNTED_FORKLIFT"] }
              as: PlantAdmin
              as_user_id: "admin-001"
              captures: { p1: "$.data.id" }
          trigger:
            - call: "POST /orders"
              payload: { order_code: "O1", jobsite_grid_x: 30, jobsite_grid_y: 30, requested_units: 12000, color_family: "RED", texture: "WIRE_CUT", durability_grade: "SW", unloading_equipment_required: "TRUCK_MOUNTED_FORKLIFT", banding_type: "STEEL" }
              as: SalesRep
              as_user_id: "sales-001"
              captures: { o1: "$.data.id", o1_special: "$.data.is_special_order", o1_panel: "$.data.requires_panel_approval", o1_ff: "$.data.fulfillment_status", o1_fr: "$.data.freight_status" }
            - call: "POST /orders/${o1}/assign-plant"
              payload: {}
              as: SalesRep
              as_user_id: "sales-001"
              captures: { o1_lead: "$.data.lead_time_days", o1_ship: "$.data.promised_ship_date" }
          assert:
            - "${o1_special} == false and ${o1_panel} == false - omitted booleans default, they are not null"
            - "${o1_ff} == DRAFT and ${o1_fr} == UNQUOTED at creation"
            - "${o1_lead} == 15 == BASE_LEAD_DAYS 14 plus ceil(12000 / 40000) == 1, with neither the 28-day special-order adder nor the 7-day panel adder"
            - "${o1_ship} == 2026-08-16T00:00:00Z"

      - name: production_run_projected_units_and_clay_commitment_are_computed_at_creation
        claim_type: computed_fields
        grounds:
          - entities.ProductionRun.fields.projected_net_green_units
          - entities.ProductionRun.fields.clay_tons_committed
          - calculations.green_yield
        distinguishing_aspect: "Neither projected_net_green_units nor clay_tons_committed appears in the endpoint's input, so both must be derived server-side at 201 and must not be null awaiting close-green."
        test_recipe:
          setup:
            - "Plant P1 ACTIVE, formulation F1 QUALIFIED, kiln car C1 IDLE with capacity 12000"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
              as_user_id: "admin-001"
            - call: "POST /plants"
              payload: { plant_code: "P1", name: "Riverbend Brick", grid_x: 0, grid_y: 0, market_radius_miles: 300, freight_rate_cents_per_ton_mile: 42, base_capacity_green_units_per_day: 40000, unloading_equipment_available: ["CRANE"] }
              as: PlantAdmin
              as_user_id: "admin-001"
              captures: { p1: "$.data.id" }
            - call: "POST /plants/${p1}/clay-pits"
              payload: { pit_name: "PIT-CLAY-A", material_type: "CLAY", proven_reserve_tons: 5000.00, iron_oxide_pct: 7.500, lime_pct: 1.200 }
              as: PlantAdmin
              as_user_id: "admin-001"
              captures: { pit_a: "$.data.id" }
            - call: "POST /plants/${p1}/clay-pits"
              payload: { pit_name: "PIT-SHALE-B", material_type: "SHALE", proven_reserve_tons: 5000.00, iron_oxide_pct: 5.000, lime_pct: 0.800 }
              as: PlantAdmin
              as_user_id: "admin-001"
              captures: { pit_b: "$.data.id" }
            - call: "POST /formulations"
              payload: { plant_id: "${p1}", formulation_code: "F1", target_color_family: "RED", target_cdi: 20.00, target_soak_hours: 3.0, clay_tons_per_thousand_units: 3.20 }
              as: BodyEngineer
              as_user_id: "body-001"
              captures: { f1: "$.data.id", f1v1: "$.data.version" }
            - call: "POST /formulations/${f1}/components"
              payload: { pit_id: "${pit_a}", share_pct: 50.00, expected_formulation_version: "${f1v1}" }
              as: BodyEngineer
              as_user_id: "body-001"
              captures: { f1v2: "$.data.version" }
            - call: "POST /formulations/${f1}/components"
              payload: { pit_id: "${pit_b}", share_pct: 50.00, expected_formulation_version: "${f1v2}" }
              as: BodyEngineer
              as_user_id: "body-001"
            - call: "POST /formulations/${f1}/qualify"
              payload: {}
              as: BodyEngineer
              as_user_id: "body-001"
            - call: "POST /plants/${p1}/kiln-cars"
              payload: { car_code: "C1", capacity_green_units: 12000 }
              as: PlantAdmin
              as_user_id: "admin-001"
              captures: { c1: "$.data.id" }
          trigger:
            - call: "POST /production-runs"
              payload: { plant_id: "${p1}", formulation_id: "${f1}", kiln_car_id: "${c1}", run_code: "R1", texture: "WIRE_CUT", green_units_set: 10000 }
              as: PlantOperator
              as_user_id: "${p1}"
              captures: { r1_projected: "$.data.projected_net_green_units", r1_committed: "$.data.clay_tons_committed", r1_net: "$.data.net_green_units", r1_pct: "$.data.green_loss_pct", r1_status: "$.data.status" }
          assert:
            - "${r1_projected} == 9638 == 10000 - ceil(10000 * GREEN_HANDLING_LOSS_BP 350 / 10000) - SETTING_LOSS_UNITS_PER_CAR 12"
            - "${r1_committed} == 32.00 == round_half_up(10000 / 1000 * 3.20, 2)"
            - "${r1_net} == null and ${r1_pct} == null - the ACTUAL variant has no inputs yet"
            - "${r1_status} == SETTING"

      - name: plant_system_fields_are_server_minted_and_version_starts_at_one
        claim_type: system_fields
        grounds:
          - entities.Plant
          - complexity_profile.complexity_layers.optimistic_concurrency
        distinguishing_aspect: "id, created_at, updated_at and version are absent from every endpoint's input, so they must be minted server-side; version must be 1 at creation and exactly 2 after the first mutation."
        test_recipe:
          setup:
            - "Plant P1 ACTIVE"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
              as_user_id: "admin-001"
            - call: "POST /plants"
              payload: { plant_code: "P1", name: "Riverbend Brick", grid_x: 0, grid_y: 0, market_radius_miles: 300, freight_rate_cents_per_ton_mile: 42, base_capacity_green_units_per_day: 40000, unloading_equipment_available: ["CRANE"] }
              as: PlantAdmin
              as_user_id: "admin-001"
              captures: { p1: "$.data.id", v0: "$.data.version", created: "$.data.created_at", updated: "$.data.updated_at" }
          trigger:
            - call: "POST /plants/${p1}/idle"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-001"
              captures: { v1: "$.data.version", created_after: "$.data.created_at", updated_after: "$.data.updated_at", idled: "$.data.idled_at" }
          assert:
            - "${v0} == 1 and ${v1} == 2 - one mutation, one increment"
            - "${created_after} == ${created} - created_at is never rewritten"
            - "${updated_after} == 2026-08-01T00:00:00Z and equals ${idled}"
            - "${p1} is a bare UUID: no domain prefix such as plant_ appears in it"
            - "${updated} == ${created} immediately after creation"

      - name: production_run_with_unknown_texture_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.ProductionRun.fields.texture
          - validations[priority=7]
        distinguishing_aspect: "texture is a closed enum on ProductionRun; an out-of-range value is a 400 at priority 7, ahead of any state or business rule."
        test_recipe:
          setup:
            - "Plant P1 ACTIVE, formulation F1 QUALIFIED, kiln car C1 IDLE"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
              as_user_id: "admin-001"
            - call: "POST /plants"
              payload: { plant_code: "P1", name: "Riverbend Brick", grid_x: 0, grid_y: 0, market_radius_miles: 300, freight_rate_cents_per_ton_mile: 42, base_capacity_green_units_per_day: 40000, unloading_equipment_available: ["CRANE"] }
              as: PlantAdmin
              as_user_id: "admin-001"
              captures: { p1: "$.data.id" }
            - call: "POST /plants/${p1}/clay-pits"
              payload: { pit_name: "PIT-CLAY-A", material_type: "CLAY", proven_reserve_tons: 5000.00, iron_oxide_pct: 7.500, lime_pct: 1.200 }
              as: PlantAdmin
              as_user_id: "admin-001"
              captures: { pit_a: "$.data.id" }
            - call: "POST /plants/${p1}/clay-pits"
              payload: { pit_name: "PIT-SHALE-B", material_type: "SHALE", proven_reserve_tons: 5000.00, iron_oxide_pct: 5.000, lime_pct: 0.800 }
              as: PlantAdmin
              as_user_id: "admin-001"
              captures: { pit_b: "$.data.id" }
            - call: "POST /formulations"
              payload: { plant_id: "${p1}", formulation_code: "F1", target_color_family: "RED", target_cdi: 20.00, target_soak_hours: 3.0, clay_tons_per_thousand_units: 3.20 }
              as: BodyEngineer
              as_user_id: "body-001"
              captures: { f1: "$.data.id", f1v1: "$.data.version" }
            - call: "POST /formulations/${f1}/components"
              payload: { pit_id: "${pit_a}", share_pct: 50.00, expected_formulation_version: "${f1v1}" }
              as: BodyEngineer
              as_user_id: "body-001"
              captures: { f1v2: "$.data.version" }
            - call: "POST /formulations/${f1}/components"
              payload: { pit_id: "${pit_b}", share_pct: 50.00, expected_formulation_version: "${f1v2}" }
              as: BodyEngineer
              as_user_id: "body-001"
            - call: "POST /formulations/${f1}/qualify"
              payload: {}
              as: BodyEngineer
              as_user_id: "body-001"
            - call: "POST /plants/${p1}/kiln-cars"
              payload: { car_code: "C1", capacity_green_units: 12000 }
              as: PlantAdmin
              as_user_id: "admin-001"
              captures: { c1: "$.data.id" }
          trigger:
            - call: "POST /production-runs"
              payload: { plant_id: "${p1}", formulation_id: "${f1}", kiln_car_id: "${c1}", run_code: "R1", texture: "HAND_CARVED_DELUXE", green_units_set: 10000 }
              as: PlantOperator
              as_user_id: "${p1}"
              captures: { err: "$.data.error_id" }
          assert:
            - "${err} == ERR_INVALID_REQUEST with HTTP 400"
            - "No ProductionRun is persisted and the clay pits' committed_tons remain 0.00"

      - name: kiln_run_with_end_at_before_start_at_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - validations[priority=7]
          - entities.KilnRun.fields.start_at
          - entities.KilnRun.fields.end_at
        distinguishing_aspect: "The priority 7 check explicitly requires end_at strictly after start_at, so an inverted window is a 400 rather than a window-overlap 409 - the ordering rule fires before the kiln-contention rule at priority 38."
        test_recipe:
          setup:
            - "Plant P1 ACTIVE, formulation F1 QUALIFIED, kiln K1 with no scheduled runs"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
              as_user_id: "admin-001"
            - call: "POST /plants"
              payload: { plant_code: "P1", name: "Riverbend Brick", grid_x: 0, grid_y: 0, market_radius_miles: 300, freight_rate_cents_per_ton_mile: 42, base_capacity_green_units_per_day: 40000, unloading_equipment_available: ["CRANE"] }
              as: PlantAdmin
              as_user_id: "admin-001"
              captures: { p1: "$.data.id" }
            - call: "POST /plants/${p1}/clay-pits"
              payload: { pit_name: "PIT-CLAY-A", material_type: "CLAY", proven_reserve_tons: 5000.00, iron_oxide_pct: 7.500, lime_pct: 1.200 }
              as: PlantAdmin
              as_user_id: "admin-001"
              captures: { pit_a: "$.data.id" }
            - call: "POST /plants/${p1}/clay-pits"
