# =============================================================================
# SCAFFOLD.yaml — Resident Feedback Panel & Community Survey Program
# §1.0–§1.7 seed tables (difficulty design lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml,
# corner design in SCAFFOLD_CORNER_DESIGN.yaml — neither key appears here).
# =============================================================================

scenario: |
  Resident Feedback Panel & Community Survey Program (city resident survey panel): panel recruitment & demographic representativeness targets, survey instrument design & translation, invitation cadence & response rate management, incentive administration, weighting & analysis of results, result publication & department follow-up commitments, panel attrition & refresh, privacy & de-identification policy

domain_name: resident-feedback-panel
api_prefix: /feedback-panel

# Step 0: Complexity Profile
complexity_profile:
  primary_archetype: quota_allocation        # demographic cell quotas: reserved on dispatch, committed on completion, released on expiry/decline/suppression
  secondary_archetype: compliance_audit      # privacy holds, de-identification k-anonymity gate, segregation of duties on publication
  complexity_layers:
    - optimistic_concurrency                 # OCC on SurveyWave.version (snapshot create) and PanelCell.version (target adjust)
    - rate_threshold_triggers                # response-rate early-close boundary, missed-streak lapse threshold, k-anonymity threshold, contact cap
    - derived_field_reconciliation           # cell reserved/active counts, wave pool buckets, missed_streak, weighted shares
    - ops_run_checkpoint                     # wave close and refresh-run apply advance the system epoch with cascades
  entity_topology: flat                      # peer entities joined by FK references; no nested URL ownership (weight-snapshot create nested under wave for OCC context only)
  state_machine_shape: cyclic                # instrument/translation/commitment revision loops + parallel dimensions on IncentiveAward + guarded waves
  relationship_patterns:
    - one_to_many                            # wave→invitations, wave→responses, panelist→invitations
    - cross_aggregate                        # publication pins weight snapshot; award pins response+wave; commitment pins publication
  role_model: segregation_of_duties          # response review (DataAnalyst) vs incentive payout (IncentiveClerk) vs de-identification publish (PrivacyOfficer); publisher != snapshot finalizer
  consistency_model: immediate               # every mutation + cascade is atomic within the request

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (13 entities, flat topology)
# =============================================================================
entities:
  - name: PanelCell
    parent: null
    common_fields: true
    fields:
      - { name: age_band, type: enum, source: input, description: "Age band of the demographic cell", constraints: "one of AGE_18_29 | AGE_30_44 | AGE_45_64 | AGE_65_PLUS" }
      - { name: district, type: string, source: input, description: "City district code, e.g. D1..D9" }
      - { name: tenure_bucket, type: enum, source: input, description: "Housing tenure of the cell", constraints: "RENTER | OWNER" }
      - { name: target_size, type: integer, source: input, description: "Recruitment target: desired number of seated panelists in this cell", constraints: ">= 0; (age_band, district, tenure_bucket) triple is unique across PanelCell" }
      - { name: reserved_count, type: integer, source: computed, description: "Count of live (status SENT) Invitations whose panelist's home_cell_id == this cell" }
      - { name: active_count, type: integer, source: computed, description: "Count of Panelists with home_cell_id == this cell and status IN {ACTIVE, LAPSED, SUSPENDED}" }
      - { name: status, type: enum, source: system, description: "OPEN when active_count < target_size; SATURATED when active_count >= target_size; auto-derived on every count/target change", constraints: "OPEN | SATURATED" }

  - name: Panelist
    parent: null
    common_fields: true
    fields:
      - { name: external_ref, type: string, source: input, description: "Registrar-supplied contact reference token (PII handle); unique" }
      - { name: full_name, type: string, source: input, description: "Panelist full name (PII; restricted visibility)" }
      - { name: age_band, type: enum, source: input, description: "Declared age band; join key resolving home cell", constraints: "AGE_18_29 | AGE_30_44 | AGE_45_64 | AGE_65_PLUS" }
      - { name: district, type: string, source: input, description: "Declared district; join key resolving home cell" }
      - { name: tenure_bucket, type: enum, source: input, description: "Declared tenure; join key resolving home cell", constraints: "RENTER | OWNER" }
      - { name: preferred_locale, type: string, source: input, description: "Preferred survey locale; drives translation coverage and locale bonus", default: "en" }
      - { name: home_cell_id, type: string, source: system, description: "FK -> PanelCell.id; resolved at enroll from the (age_band, district, tenure_bucket) triple" }
      - { name: status, type: enum, source: system, description: "Panel membership lifecycle", constraints: "APPLICANT | ACTIVE | LAPSED | SUSPENDED | ATTRITED | WITHDRAWN" }
      - { name: missed_streak, type: integer, source: computed, description: "Consecutive EXPIRED invitations, counting backward over the panelist's invitations ordered by wave closes_at DESC (tie-break: invitation created_at DESC), stopping at the first COMPLETED or DECLINED" }
      - { name: last_contacted_at, type: datetime, source: system, description: "sent_at of the panelist's most recent invitation (any status, including SUPPRESSED/EXPIRED); null when never invited" }
      - { name: lapsed_at, type: datetime, source: system, description: "Timestamp of the ACTIVE -> LAPSED transition; null until first lapse" }

  - name: Instrument
    parent: null
    common_fields: true
    fields:
      - { name: title, type: string, source: input, description: "Survey instrument title" }
      - { name: question_count, type: integer, source: input, description: "Number of questions", constraints: ">= 1" }
      - { name: required_locales, type: array, source: input, description: "Locales that must hold CERTIFIED translations before approval; must include base_locale" }
      - { name: base_locale, type: string, source: input, description: "Authoring locale", default: "en" }
      - { name: revision, type: integer, source: system, description: "Starts at 1; +1 on every revise from APPROVED back to DRAFT" }
      - { name: status, type: enum, source: system, description: "Instrument lifecycle with revision loop", constraints: "DRAFT | IN_REVIEW | APPROVED | LOCKED" }

  - name: Translation
    parent: null
    common_fields: true
    fields:
      - { name: instrument_id, type: string, source: input, description: "FK -> Instrument.id" }
      - { name: locale, type: string, source: input, description: "Locale code of this translation" }
      - { name: translator_ref, type: string, source: input, description: "Translator identity reference" }
      - { name: instrument_revision, type: integer, source: system, description: "Instrument revision this translation certifies; copied from instrument at create/resubmit" }
      - { name: status, type: enum, source: system, description: "Translation certification lifecycle", constraints: "SUBMITTED | CERTIFIED | REJECTED | STALE" }

  - name: SurveyWave
    parent: null
    common_fields: true
    fields:
      - { name: wave_code, type: string, source: input, description: "Human wave identifier; unique" }
      - { name: instrument_id, type: string, source: input, description: "FK -> Instrument.id; instrument must reach LOCKED before arm" }
      - { name: opens_at, type: datetime, source: input, description: "Fielding window open (inclusive)" }
      - { name: closes_at, type: datetime, source: input, description: "Fielding window close (inclusive); must be > opens_at" }
      - { name: min_response_rate, type: number, source: input, description: "Minimum final response rate required to close early; in (0, 1]" }
      - { name: incentive_pool_total_cents, type: integer, source: input, description: "Total incentive budget for the wave", constraints: ">= 0" }
      - { name: base_incentive_cents, type: integer, source: input, description: "Base award amount per accepted response", constraints: ">= 0" }
      - { name: incentive_pool_available_cents, type: integer, source: computed, description: "Uncommitted pool; debited at award authorize, credited at forfeit" }
      - { name: incentive_pool_reserved_cents, type: integer, source: computed, description: "Sum of award amounts with payout_status AUTHORIZED" }
      - { name: incentive_pool_paid_cents, type: integer, source: computed, description: "Sum of award amounts with payout_status PAID" }
      - { name: invited_count, type: integer, source: computed, description: "Invitations ever dispatched (entered SENT) for this wave" }
      - { name: completed_count, type: integer, source: computed, description: "Invitations of this wave in status COMPLETED" }
      - { name: status, type: enum, source: system, description: "Wave lifecycle", constraints: "DRAFT | ARMED | FIELDING | CLOSED | WEIGHTED | PUBLISHED | CANCELLED" }

  - name: Invitation
    parent: null
    common_fields: true
    fields:
      - { name: wave_id, type: string, source: input, description: "FK -> SurveyWave.id" }
      - { name: panelist_id, type: string, source: input, description: "FK -> Panelist.id" }
      - { name: sent_at, type: datetime, source: system, description: "Dispatch timestamp (logical clock at creation)" }
      - { name: reminder_count, type: integer, source: system, description: "Number of reminders sent; starts 0", default: 0 }
      - { name: last_reminder_at, type: datetime, source: system, description: "Timestamp of most recent reminder; null until first reminder" }
      - { name: status, type: enum, source: system, description: "Invitation lifecycle; (wave_id, panelist_id) unique among status SENT", constraints: "SENT | COMPLETED | DECLINED | EXPIRED | SUPPRESSED" }

  - name: Response
    parent: null
    common_fields: true
    fields:
      - { name: invitation_id, type: string, source: input, description: "FK -> Invitation.id; at most one Response per invitation" }
      - { name: wave_id, type: string, source: system, description: "FK -> SurveyWave.id; copied from the invitation" }
      - { name: panelist_id, type: string, source: system, description: "FK -> Panelist.id; copied from the invitation" }
      - { name: answers_payload, type: object, source: input, description: "Opaque answer map (PII-adjacent; DataAnalyst sees it, IncentiveClerk does not)" }
      - { name: completeness_pct, type: number, source: input, description: "Share of questions answered", constraints: "0 <= x <= 100" }
      - { name: completion_seconds, type: integer, source: input, description: "Time the respondent took", constraints: ">= 0" }
      - { name: speeder_flag, type: boolean, source: computed, description: "true when completion_seconds < SPEEDER_MIN_SECONDS (120)" }
      - { name: low_effort_flag, type: boolean, source: computed, description: "true when completeness_pct < LOW_EFFORT_MIN_PCT (50)" }
      - { name: status, type: enum, source: system, description: "Review lifecycle", constraints: "SUBMITTED | ACCEPTED | QUARANTINED | DISCARDED" }

  - name: IncentiveAward
    parent: null
    common_fields: true
    fields:
      - { name: response_id, type: string, source: system, description: "FK -> Response.id; exactly one award per response (created at response submission)" }
      - { name: wave_id, type: string, source: system, description: "FK -> SurveyWave.id; copied from response for pool accounting" }
      - { name: amount_cents, type: integer, source: computed, description: "Award amount per incentive_amount_cents calculation (computed at creation, fixed thereafter)" }
      - { name: eligibility_status, type: enum, source: system, description: "Review-driven eligibility dimension", constraints: "PENDING | ELIGIBLE | INELIGIBLE" }
      - { name: payout_status, type: enum, source: system, description: "Payment dimension, independent of eligibility", constraints: "UNPAID | AUTHORIZED | PAID | FORFEITED" }

  - name: WeightSnapshot
    parent: null
    common_fields: true
    fields:
      - { name: wave_id, type: string, source: system, description: "FK -> SurveyWave.id; taken from the nested create path" }
      - { name: method, type: enum, source: input, description: "Weighting algorithm", constraints: "RIM | POST_STRAT" }
      - { name: weight_mass, type: number, source: computed, description: "Sum of all response weights; equals count of ACCEPTED responses of the wave" }
      - { name: accepted_count, type: integer, source: computed, description: "Count of ACCEPTED responses included in the weighting" }
      - { name: design_effect, type: number, source: computed, description: "1 + (stddev(weights)/mean(weights))^2 over included responses; 6 dp round_half_up" }
      - { name: weighted_cell_shares, type: object, source: computed, description: "Map home_cell_id -> weighted share (sum of weights of cell's responses / weight_mass), 6 dp round_half_up" }
      - { name: status, type: enum, source: system, description: "Snapshot lifecycle", constraints: "PROVISIONAL | FINALIZED | SUPERSEDED" }
      - { name: finalized_by_user_id, type: string, source: system, description: "X-User-ID of the DataAnalyst who finalized; consumed by the publication segregation-of-duties check" }

  - name: Publication
    parent: null
    common_fields: true
    fields:
      - { name: wave_id, type: string, source: input, description: "FK -> SurveyWave.id" }
      - { name: weight_snapshot_id, type: string, source: input, description: "FK -> WeightSnapshot.id; pinned snapshot must belong to wave_id" }
      - { name: title, type: string, source: input, description: "Publication title" }
      - { name: k_threshold, type: integer, source: input, description: "Minimum respondents per published breakdown cell", default: 5 }
      - { name: breakdown_cells, type: array, source: computed, description: "Per-home-cell breakdown over ACCEPTED responses: [{cell_id, n_respondents, weighted_share, suppressed}]; suppressed = true when 0 < n_respondents < k_threshold" }
      - { name: status, type: enum, source: system, description: "Publication lifecycle", constraints: "DRAFT | PUBLISHED | RETRACTED" }

  - name: FollowUpCommitment
    parent: null
    common_fields: true
    fields:
      - { name: publication_id, type: string, source: input, description: "FK -> Publication.id; publication must be PUBLISHED at creation" }
      - { name: department_name, type: string, source: input, description: "City department making the commitment (free-form department identifier)" }
      - { name: summary, type: string, source: input, description: "Commitment text" }
      - { name: due_at, type: datetime, source: input, description: "Deadline for fulfillment" }
      - { name: breached_at, type: datetime, source: system, description: "Timestamp of mark-breached transition; null until breached" }
      - { name: status, type: enum, source: system, description: "Commitment lifecycle with renegotiation loop", constraints: "COMMITTED | IN_PROGRESS | FULFILLED | BREACHED | SUSPENDED" }

  - name: PrivacyHold
    parent: null
    common_fields: true
    fields:
      - { name: panelist_id, type: string, source: input, description: "FK -> Panelist.id; at most one ACTIVE hold per panelist" }
      - { name: scope, type: enum, source: input, description: "NO_CONTACT: blocks invitation dispatch only. FULL_SUPPRESS: also suspends the panelist and suppresses live invitations", constraints: "NO_CONTACT | FULL_SUPPRESS" }
      - { name: reason, type: string, source: input, description: "Audit reason" }
      - { name: status, type: enum, source: system, description: "Hold lifecycle", constraints: "ACTIVE | RELEASED" }

  - name: RefreshRun
    parent: null
    common_fields: true
    fields:
      - { name: run_label, type: string, source: input, description: "Operator label for the refresh run" }
      - { name: attrition_grace_days, type: integer, source: input, description: "Days a panelist may remain LAPSED before refresh attrits them", default: 30 }
      - { name: planned_attrition_count, type: integer, source: computed, description: "At creation: count of LAPSED panelists whose lapsed_at <= now - attrition_grace_days" }
      - { name: applied_attrition_count, type: integer, source: computed, description: "Set at apply: panelists transitioned LAPSED -> ATTRITED; null until applied" }
      - { name: applied_forfeit_count, type: integer, source: computed, description: "Set at apply: awards transitioned AUTHORIZED -> FORFEITED; null until applied" }
      - { name: status, type: enum, source: system, description: "Refresh run lifecycle", constraints: "OPEN | APPLIED | ABORTED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: PanelCell
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: SATURATED
        trigger: "system (auto on active_count reaching target_size via enroll/reactivate, or on target adjust)"
        actor: system
        preconditions: ["active_count >= target_size after the triggering mutation"]
        side_effects: ["PanelCell.version increments"]
      - from: SATURATED
        to: OPEN
        trigger: "system (auto on active_count dropping below target_size via attrition/withdrawal, or on target increase)"
        actor: system
        preconditions: ["active_count < target_size after the triggering mutation"]
        side_effects: ["PanelCell.version increments"]

  - entity: Panelist
    initial_state: APPLICANT
    terminal_states: [ATTRITED, WITHDRAWN]
    transitions:
      - from: APPLICANT
        to: ACTIVE
        trigger: "POST /feedback-panel/panelists/{id}/enroll"
        actor: PanelManager
        preconditions:
          - "A PanelCell exists matching (age_band, district, tenure_bucket) exactly (else ERR_PANEL_CELL_NOT_FOUND)"
          - "That cell's active_count < target_size (else ERR_CELL_SATURATED)"
        side_effects:
          - "home_cell_id resolved to the matching cell"
          - "cell.active_count += 1; cell status re-derived (OPEN/SATURATED); cell.version increments"
      - from: ACTIVE
        to: LAPSED
        trigger: "system (during wave close cascade when missed_streak becomes >= STRIKE_LIMIT 2)"
        actor: system
        preconditions: ["missed_streak after increment >= 2"]
        side_effects:
          - "lapsed_at := now"
          - "missed_streak := 0 (streak consumed by the lapse)"
      - from: LAPSED
        to: ACTIVE
        trigger: "POST /feedback-panel/panelists/{id}/reactivate"
        actor: PanelManager
        preconditions:
          - "Panelist status == LAPSED (else ERR_PANELIST_NOT_LAPSED)"
          - "No ACTIVE PrivacyHold exists for the panelist (else ERR_PRIVACY_HOLD_ACTIVE)"
        side_effects: ["cell.active_count unchanged in kind (LAPSED already counts); cell status re-derived"]
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /feedback-panel/panelists/{id}/withdraw"
        actor: PanelManager
        preconditions: []
        side_effects:
          - "cell.active_count -= 1; cell status re-derived; cell.version increments"
          - "panelist's SENT invitations -> SUPPRESSED; cell.reserved_count re-derived"
      - from: LAPSED
        to: WITHDRAWN
        trigger: "POST /feedback-panel/panelists/{id}/withdraw"
        actor: PanelManager
        preconditions: []
        side_effects: ["cell.active_count -= 1; cell status re-derived; cell.version increments"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (PrivacyHold with scope FULL_SUPPRESS created)"
        actor: system
        preconditions: []
        side_effects: ["panelist's SENT invitations -> SUPPRESSED; cell.reserved_count re-derived"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system (last ACTIVE PrivacyHold released)"
        actor: system
        preconditions: ["no other ACTIVE PrivacyHold remains for the panelist"]
        side_effects: ["SUPPRESSED invitations remain SUPPRESSED (compensation is partial by policy)"]
      - from: LAPSED
        to: ATTRITED
        trigger: "system (RefreshRun apply where lapsed_at <= now - attrition_grace_days)"
        actor: system
        preconditions: []
        side_effects:
          - "cell.active_count -= 1; cell status re-derived; cell.version increments"
          - "panelist's IncentiveAwards with payout_status AUTHORIZED -> FORFEITED; each forfeiture credits its wave.incentive_pool_available_cents and debits incentive_pool_reserved_cents"

  - entity: Instrument
    initial_state: DRAFT
    terminal_states: [LOCKED]
    transitions:
      - from: DRAFT
        to: IN_REVIEW
        trigger: "POST /feedback-panel/instruments/{id}/submit-review"
        actor: SurveyDesigner
        preconditions: []
        side_effects: []
      - from: IN_REVIEW
        to: APPROVED
        trigger: "POST /feedback-panel/instruments/{id}/approve"
        actor: SurveyDesigner
        preconditions:
          - "Every locale in required_locales has a Translation with status CERTIFIED and instrument_revision == instrument.revision (else ERR_TRANSLATION_NOT_CERTIFIED)"
        side_effects: []
      - from: IN_REVIEW
        to: DRAFT
        trigger: "POST /feedback-panel/instruments/{id}/revise"
        actor: SurveyDesigner
        preconditions: []
        side_effects: ["revision unchanged"]
      - from: APPROVED
        to: DRAFT
        trigger: "POST /feedback-panel/instruments/{id}/revise"
        actor: SurveyDesigner
        preconditions: []
        side_effects:
          - "revision += 1"
          - "Translations with instrument_revision < new revision and status CERTIFIED -> STALE"
      - from: APPROVED
        to: LOCKED
        trigger: "POST /feedback-panel/instruments/{id}/lock"
        actor: SurveyDesigner
        preconditions: []
        side_effects: ["Instrument becomes immutable; waves may now arm against it"]

  - entity: Translation
    initial_state: SUBMITTED
    terminal_states: []
    transitions:
      - from: SUBMITTED
        to: CERTIFIED
        trigger: "POST /feedback-panel/translations/{id}/certify"
        actor: SurveyDesigner
        preconditions:
          - "Instrument status IN {IN_REVIEW, APPROVED} (else ERR_INSTRUMENT_NOT_IN_REVIEW)"
          - "translation.instrument_revision == instrument.revision (else ERR_TRANSLATION_STALE_REVISION)"
        side_effects: []
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /feedback-panel/translations/{id}/reject"
        actor: SurveyDesigner
        preconditions: []
        side_effects: []
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /feedback-panel/translations/{id}/resubmit"
        actor: SurveyDesigner
        preconditions: []
        side_effects: ["instrument_revision := instrument.revision (current)"]
      - from: STALE
        to: SUBMITTED
        trigger: "POST /feedback-panel/translations/{id}/resubmit"
        actor: SurveyDesigner
        preconditions: []
        side_effects: ["instrument_revision := instrument.revision (current)"]
      - from: CERTIFIED
        to: STALE
        trigger: "system (instrument revise from APPROVED bumps revision beyond translation's instrument_revision)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: SurveyWave
    initial_state: DRAFT
    terminal_states: [PUBLISHED, CANCELLED]
    transitions:
      - from: DRAFT
        to: ARMED
        trigger: "POST /feedback-panel/survey-waves/{id}/arm"
        actor: PanelManager
        preconditions:
          - "Instrument status == LOCKED (else ERR_INSTRUMENT_NOT_LOCKED)"
          - "Every locale in instrument.required_locales has a CERTIFIED translation at instrument.revision (else ERR_TRANSLATION_NOT_CERTIFIED)"
          - "now <= opens_at (else ERR_WAVE_WINDOW_NOT_OPEN)"
        side_effects: []
      - from: ARMED
        to: FIELDING
        trigger: "POST /feedback-panel/survey-waves/{id}/open-fielding"
        actor: PanelManager
        preconditions: ["opens_at <= now <= closes_at (else ERR_WAVE_WINDOW_NOT_OPEN)"]
        side_effects: []
      - from: FIELDING
        to: CLOSED
        trigger: "POST /feedback-panel/survey-waves/{id}/close"
        actor: PanelManager
        preconditions:
          - "now > closes_at OR (invited_count > 0 AND completed_count / invited_count >= min_response_rate) (else ERR_MIN_RESPONSE_NOT_MET)"
        side_effects:
          - "CASCADE hop 1: every Invitation of this wave in status SENT -> EXPIRED"
          - "CASCADE hop 2: per affected panelist, missed_streak recomputed (chronological); cell.reserved_count re-derived (each expiry releases its reservation)"
          - "CASCADE hop 3: panelists whose recomputed missed_streak >= 2 transition ACTIVE -> LAPSED (lapsed_at := now, missed_streak := 0)"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /feedback-panel/survey-waves/{id}/cancel"
        actor: PanelManager
        preconditions: []
        side_effects: []
      - from: ARMED
        to: CANCELLED
        trigger: "POST /feedback-panel/survey-waves/{id}/cancel"
        actor: PanelManager
        preconditions: []
        side_effects: []
      - from: CLOSED
        to: WEIGHTED
        trigger: "system (WeightSnapshot finalize)"
        actor: system
        preconditions: []
        side_effects: []
      - from: WEIGHTED
        to: CLOSED
        trigger: "system (a new WeightSnapshot is created for the wave, reopening analysis)"
        actor: system
        preconditions: []
        side_effects: []
      - from: WEIGHTED
        to: PUBLISHED
        trigger: "system (Publication publish)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Invitation
    initial_state: SENT
    terminal_states: [COMPLETED, DECLINED, EXPIRED, SUPPRESSED]
    transitions:
      - from: SENT
        to: COMPLETED
        trigger: "system (Response created against this invitation)"
        actor: system
        preconditions: []
        side_effects:
          - "wave.completed_count += 1"
          - "cell.reserved_count -= 1 (reservation converts to completion)"
          - "panelist.missed_streak recomputed (a COMPLETED breaks the streak)"
      - from: SENT
        to: DECLINED
        trigger: "POST /feedback-panel/invitations/{id}/decline"
        actor: PanelManager
        preconditions: []
        side_effects:
          - "cell.reserved_count -= 1"
          - "panelist.missed_streak recomputed (DECLINED breaks the streak)"
      - from: SENT
        to: EXPIRED
        trigger: "system (wave close cascade)"
        actor: system
        preconditions: []
        side_effects: ["cell.reserved_count -= 1", "panelist.missed_streak recomputed (EXPIRED extends the streak)"]
      - from: SENT
        to: SUPPRESSED
        trigger: "system (FULL_SUPPRESS privacy hold, or panelist withdrawal)"
        actor: system
        preconditions: []
        side_effects: ["cell.reserved_count -= 1", "missed_streak NOT recomputed (SUPPRESSED is streak-neutral)"]
      - from: SENT
        to: SENT
        trigger: "POST /feedback-panel/invitations/{id}/remind"
        actor: PanelManager
        preconditions:
          - "reminder_count < REMINDER_CAP 2 (else ERR_REMINDER_CAP_REACHED)"
          - "now >= COALESCE(last_reminder_at, sent_at) + REMINDER_GAP_HOURS 48 (else ERR_REMINDER_CADENCE_TOO_SOON)"
          - "wave still FIELDING (else ERR_WAVE_NOT_FIELDING)"
        side_effects: ["reminder_count += 1", "last_reminder_at := now"]

  - entity: Response
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED, DISCARDED]
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /feedback-panel/responses/{id}/accept"
        actor: DataAnalyst
        preconditions: []
        side_effects: ["award.eligibility_status PENDING -> ELIGIBLE"]
      - from: SUBMITTED
        to: QUARANTINED
        trigger: "POST /feedback-panel/responses/{id}/quarantine"
        actor: DataAnalyst
        preconditions: []
        side_effects: []
      - from: QUARANTINED
        to: ACCEPTED
        trigger: "POST /feedback-panel/responses/{id}/accept"
        actor: DataAnalyst
        preconditions: []
        side_effects: ["award.eligibility_status PENDING -> ELIGIBLE"]
      - from: QUARANTINED
        to: DISCARDED
        trigger: "POST /feedback-panel/responses/{id}/discard"
        actor: DataAnalyst
        preconditions: []
        side_effects: ["award.eligibility_status PENDING -> INELIGIBLE"]

  - entity: IncentiveAward
    initial_state: "eligibility_status PENDING, payout_status UNPAID (parallel dimensions)"
    terminal_states: ["eligibility INELIGIBLE", "payout PAID", "payout FORFEITED"]
    transitions:
      - from: "eligibility PENDING"
        to: "eligibility ELIGIBLE"
        trigger: "system (response ACCEPTED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: "eligibility PENDING"
        to: "eligibility INELIGIBLE"
        trigger: "system (response DISCARDED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: "payout UNPAID"
        to: "payout AUTHORIZED"
        trigger: "POST /feedback-panel/incentive-awards/{id}/authorize"
        actor: IncentiveClerk
        preconditions:
          - "eligibility_status == ELIGIBLE (else ERR_AWARD_NOT_AUTHORIZED_STATE)"
          - "payout_status == UNPAID (else ERR_AWARD_NOT_AUTHORIZED_STATE)"
          - "wave.incentive_pool_available_cents >= amount_cents (else ERR_INCENTIVE_POOL_INSUFFICIENT)"
        side_effects: ["wave: available -= amount_cents; reserved += amount_cents; wave.version increments"]
      - from: "payout AUTHORIZED"
        to: "payout PAID"
        trigger: "POST /feedback-panel/incentive-awards/{id}/pay"
        actor: IncentiveClerk
        preconditions: ["payout_status == AUTHORIZED (else ERR_AWARD_NOT_PAID_STATE)"]
        side_effects: ["wave: reserved -= amount_cents; paid += amount_cents; wave.version increments"]
      - from: "payout AUTHORIZED"
        to: "payout FORFEITED"
        trigger: "POST /feedback-panel/incentive-awards/{id}/forfeit (IncentiveClerk) OR system (panelist attrition during refresh apply)"
        actor: IncentiveClerk
        preconditions: ["payout_status == AUTHORIZED (else ERR_AWARD_NOT_FORFEIT_STATE)"]
        side_effects: ["wave: reserved -= amount_cents; available += amount_cents; wave.version increments"]

  - entity: WeightSnapshot
    initial_state: PROVISIONAL
    terminal_states: [SUPERSEDED]
    transitions:
      - from: PROVISIONAL
        to: FINALIZED
        trigger: "POST /feedback-panel/weight-snapshots/{id}/finalize"
        actor: DataAnalyst
        preconditions:
          - "wave status == CLOSED (else ERR_WAVE_NOT_CLOSED)"
          - "snapshot is the latest (non-SUPERSEDED) snapshot of the wave (else ERR_SNAPSHOT_SUPERSEDED)"
        side_effects:
          - "finalized_by_user_id := X-User-ID of the caller"
          - "wave CLOSED -> WEIGHTED"
      - from: PROVISIONAL
        to: SUPERSEDED
        trigger: "system (a newer WeightSnapshot is created for the same wave)"
        actor: system
        preconditions: []
        side_effects: []
      - from: FINALIZED
        to: SUPERSEDED
        trigger: "system (a newer WeightSnapshot is created for the same wave; wave reverts WEIGHTED -> CLOSED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Publication
    initial_state: DRAFT
    terminal_states: [RETRACTED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /feedback-panel/publications/{id}/publish"
        actor: PrivacyOfficer
        preconditions:
          - "CHECKED IN THIS ORDER: (1) pinned snapshot status == FINALIZED (else ERR_SNAPSHOT_NOT_FINALIZED)"
          - "(2) wave status == WEIGHTED (else ERR_WAVE_NOT_WEIGHTED)"
          - "(3) segregation of duties: X-User-ID != snapshot.finalized_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "(4) no breakdown cell has 0 < n_respondents < k_threshold (else ERR_K_ANONYMITY_VIOLATION)"
        side_effects: ["wave WEIGHTED -> PUBLISHED"]
      - from: PUBLISHED
        to: RETRACTED
        trigger: "POST /feedback-panel/publications/{id}/retract"
        actor: PrivacyOfficer
        preconditions: []
        side_effects:
          - "commitments of this publication in COMMITTED or IN_PROGRESS -> SUSPENDED"
          - "FULFILLED and BREACHED commitments unchanged (conditional cascade)"

  - entity: FollowUpCommitment
    initial_state: COMMITTED
    terminal_states: [FULFILLED, SUSPENDED]
    transitions:
      - from: COMMITTED
        to: IN_PROGRESS
        trigger: "POST /feedback-panel/follow-up-commitments/{id}/start"
        actor: DepartmentLiaison
        preconditions: ["commitment.department_name == caller X-User-ID (else ERR_FORBIDDEN_DEPARTMENT)"]
        side_effects: []
      - from: IN_PROGRESS
        to: FULFILLED
        trigger: "POST /feedback-panel/follow-up-commitments/{id}/fulfill"
        actor: DepartmentLiaison
        preconditions:
          - "commitment.department_name == caller X-User-ID (else ERR_FORBIDDEN_DEPARTMENT)"
          - "now <= due_at (else ERR_COMMITMENT_OVERDUE)"
        side_effects: []
      - from: COMMITTED
        to: BREACHED
        trigger: "POST /feedback-panel/follow-up-commitments/{id}/mark-breached"
        actor: PanelManager
        preconditions: ["now > due_at (else ERR_COMMITMENT_NOT_OVERDUE)"]
        side_effects: ["breached_at := now"]
      - from: IN_PROGRESS
        to: BREACHED
        trigger: "POST /feedback-panel/follow-up-commitments/{id}/mark-breached"
        actor: PanelManager
        preconditions: ["now > due_at (else ERR_COMMITMENT_NOT_OVERDUE)"]
        side_effects: ["breached_at := now"]
      - from: BREACHED
        to: COMMITTED
        trigger: "POST /feedback-panel/follow-up-commitments/{id}/renegotiate"
        actor: DepartmentLiaison
        preconditions:
          - "commitment.department_name == caller X-User-ID (else ERR_FORBIDDEN_DEPARTMENT)"
          - "new_due_at > now (else ERR_COMMITMENT_OVERDUE)"
        side_effects: ["due_at := new_due_at", "breached_at := null"]
      - from: COMMITTED
        to: SUSPENDED
        trigger: "system (publication retracted)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_PROGRESS
        to: SUSPENDED
        trigger: "system (publication retracted)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: PrivacyHold
    initial_state: ACTIVE
    terminal_states: [RELEASED]
    transitions:
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /feedback-panel/privacy-holds/{id}/release"
        actor: PrivacyOfficer
        preconditions: []
        side_effects:
          - "if scope FULL_SUPPRESS and no other ACTIVE hold remains: panelist SUSPENDED -> ACTIVE"
          - "SUPPRESSED invitations are NOT restored"

  - entity: RefreshRun
    initial_state: OPEN
    terminal_states: [APPLIED, ABORTED]
    transitions:
      - from: OPEN
        to: APPLIED
        trigger: "POST /feedback-panel/refresh-runs/{id}/apply"
        actor: PanelManager
        preconditions: []
        side_effects:
          - "CASCADE hop 1: every LAPSED panelist with lapsed_at <= now - attrition_grace_days -> ATTRITED"
          - "CASCADE hop 2: each attrited panelist's AUTHORIZED awards -> FORFEITED"
          - "CASCADE hop 3: each forfeiture credits its wave pool (available += amount, reserved -= amount)"
          - "applied_attrition_count / applied_forfeit_count set; home cells' active_count re-derived"
      - from: OPEN
        to: ABORTED
        trigger: "POST /feedback-panel/refresh-runs/{id}/abort"
        actor: PanelManager
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: snapshot-create-stale-wave
    parent_entity: SurveyWave
    write_endpoint: "POST /feedback-panel/survey-waves/{id}/weight-snapshots"
    occ_field: "expected_wave_version"
    description: |
      Creating a WeightSnapshot against a SurveyWave whose version has advanced
      since the client last observed it is rejected. A prior snapshot creation,
      finalization cascade, or pool mutation legitimately supersedes the client's
      view of the wave (the newest snapshot wins by specification), so a create
      carrying a stale expected_wave_version must fail instead of silently
      superseding state the client never saw.
    error_id: ERR_STALE_WAVE_VERSION
    http_status: 412

  - rule_id: cell-target-adjust-stale
    parent_entity: PanelCell
    write_endpoint: "POST /feedback-panel/panel-cells/{id}/targets"
    occ_field: "expected_cell_version"
    description: |
      Adjusting a PanelCell target against a cell whose version has advanced
      since the client last observed it is rejected. Target changes re-derive
      saturation and representativeness, and any intervening enrollment,
      attrition, or target adjustment legitimately advances the cell version,
      so a stale expected_cell_version must fail rather than clobber the
      newer quota state.
    error_id: ERR_STALE_CELL_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: cell_deficit
    trigger: "on every active_count/target_size change; read via PanelCell GET"
    algorithm: aggregation
    formula: |
      deficit_c = max(0, target_size_c - active_count_c)
      active_count_c counts Panelists with home_cell_id == c and status IN {ACTIVE, LAPSED, SUSPENDED}.
    input_set: "Panelists status IN {ACTIVE, LAPSED, SUSPENDED} only; APPLICANT/ATTRITED/WITHDRAWN excluded"
    precision: "integer"

  - name: representativeness_score
    trigger: "GET /feedback-panel/survey-waves/{id}/analysis (program-wide score, computed over ALL PanelCells regardless of wave)"
    algorithm: weighted_scoring
    formula: |
      Let T = sum over all cells of target_size_c. If T == 0, score = 100.
      For each cell c with target_size_c > 0:
        ratio_c = min(deficit_c / target_size_c, 1.0)
        w_c = target_size_c / T
      score = 100 - 100 * sum_c( w_c * ratio_c )
      Round to 6 decimal places, round_half_up.
      Cells with target_size == 0 contribute nothing to T or the sum.
    input_set: "all PanelCells (any status); deficit per cell_deficit"
    constants:
      DEFICIT_CAP: 1.0
    precision: "6 decimal places, round_half_up"

  - name: response_weight
    trigger: "WeightSnapshot creation (POST /feedback-panel/survey-waves/{id}/weight-snapshots)"
    algorithm: weighted_scoring
    formula: |
      Input set: Responses of the wave with status ACCEPTED, grouped by panelist.home_cell_id.
      Let N = count of included responses. If N == 0 -> reject creation ERR_WEIGHTS_NOT_COMPUTABLE.
      Cells with zero ACCEPTED responses contribute no respondents and are absent from weighted_cell_shares.

      Variant POST_STRAT:
        raw_c = target_size_c / n_c            for each cell c with n_c > 0
        w_i = raw_{cell(i)}
      Variant RIM (single deterministic rake pass, fixed margin order: age_band then tenure_bucket):
        start w_i = 1 for all respondents
        age margin: target_a = sum of target_size over cells of age band a;
          current_a = sum of w over respondents whose cell age band == a;
          factor_a = target_a / current_a; multiply respondents' weights by factor_a
        tenure margin: target_t = sum of target_size over cells of tenure bucket t;
          current_t = sum of w over respondents whose cell tenure == t;
          factor_t = target_t / current_t; multiply by factor_t
      Common tail (both variants), evaluation order pinned:
        1. raw weights as above
        2. normalize: w_i := w_i * N / sum(w)              (mass := N)
        3. trim: cap each w_i at TRIM_MULT * mean(w) = TRIM_MULT * 1.0
        4. renormalize once: w_i := w_i * N / sum(w)
      weight_mass = sum(w_i) (= N up to rounding); weighted_cell_shares[c] = sum of w_i in c / weight_mass.
      All reported values 6 decimal places, round_half_up.
    input_set: "Responses status == ACCEPTED only; SUBMITTED/QUARANTINED/DISCARDED excluded"
    constants:
      TRIM_MULT: 5.0
    precision: "6 decimal places, round_half_up"
    variants:
      - name: POST_STRAT
        when: "snapshot.method == POST_STRAT"
        difference: "cell-level ratio targets; equal weights within a cell"
      - name: RIM
        when: "snapshot.method == RIM"
        difference: "margin raking over age_band then tenure_bucket; respondents within one cell may receive different weights only via shared margins (identical within a cell here since margins are cell attributes); diverges from POST_STRAT whenever cells share a margin"

  - name: projected_response_rate
    trigger: "GET /feedback-panel/survey-waves/{id}/analysis"
    algorithm: forward_looking
    formula: |
      invited = invited_count; completed = completed_count
      open_sent = count of Invitations of the wave with status SENT
      PROVISIONAL (wave status == FIELDING):
        projected = (completed + UPTAKE_ASSUMPTION * open_sent) / invited
        (invited == 0 -> projected = 0)
      FINAL (wave status IN {CLOSED, WEIGHTED, PUBLISHED}):
        projected = completed / invited   (invited == 0 -> 0)
      Round to 6 dp, round_half_up.
    input_set: "Invitations of the wave; SENT counted as open, COMPLETED counted as done, DECLINED/EXPIRED/SUPPRESSED count toward invited but never toward completed"
    constants:
      UPTAKE_ASSUMPTION: 0.5
    precision: "6 decimal places, round_half_up"
    variants:
      - name: PROVISIONAL
        when: "wave FIELDING"
        difference: "credits half of still-open invitations as projected completions"
      - name: FINAL
        when: "wave CLOSED or later"
        difference: "completions only; open invitations contribute zero"

  - name: incentive_amount_cents
    trigger: "Response creation (award minted in PENDING/UNPAID with computed amount)"
    algorithm: tiered_pricing
    formula: |
      Evaluation order PINNED (nested rounding; per-component first):
        1. completion_bonus = round_half_up(base_incentive_cents * completeness_pct / 100)
        2. locale_bonus = round_half_up(base_incentive_cents * LOCALE_BONUS_PCT) if panelist.preferred_locale != "en" else 0
        3. subtotal = base_incentive_cents + completion_bonus + locale_bonus
        4. quality adjust: if response.speeder_flag then subtotal = round_half_up(subtotal / 2)
        5. cap: amount_cents = min(subtotal, MAX_AWARD_CENTS)
      The alternative order (sum unrounded components, round once at the end) yields
      different cents whenever step 1 or 2 lands on a .5 boundary; the pinned order wins.
    input_set: "single Response + its wave.base_incentive_cents + panelist.preferred_locale"
    constants:
      LOCALE_BONUS_PCT: 0.10
      MAX_AWARD_CENTS: 10000
      SPEEDER_MIN_SECONDS: 120
      LOW_EFFORT_MIN_PCT: 50
    precision: "integer cents; each rounding step round_half_up"

  - name: missed_streak
    trigger: "invitation terminal transitions (COMPLETED/DECLINED/EXPIRED) and wave close sweep"
    algorithm: chronological
    formula: |
      Order the panelist's invitations by their wave's closes_at DESC;
      ties broken by invitation.created_at DESC.
      Walk from the front: count leading invitations with status EXPIRED;
      stop at the first COMPLETED or DECLINED. SUPPRESSED invitations are skipped
      (streak-neutral: they neither increment nor break the streak).
      streak = that leading count.
      When streak >= STRIKE_LIMIT during a close sweep: panelist ACTIVE -> LAPSED,
      lapsed_at := now, and streak resets to 0.
    input_set: "all Invitations of the panelist (any wave), with their waves' closes_at"
    constants:
      STRIKE_LIMIT: 2
    precision: "integer"

  - name: invitation_dispatch_gates
    trigger: "POST /feedback-panel/invitations"
    algorithm: threshold
    formula: |
      WASHOUT (pairwise buffer semantics on the Panelist resource):
        if panelist.last_contacted_at is not null:
          occupied interval = [last_contacted_at, last_contacted_at + WASHOUT_DAYS days)
          reject ERR_CONTACT_WASHOUT_VIOLATION when now < last_contacted_at + WASHOUT_DAYS days
          (half-open: dispatch at exactly last_contacted_at + WASHOUT_DAYS is allowed)
      CONTACT CAP (aggregate sliding-window semantics on the PanelCell resource):
        window = [now - CONTACT_WINDOW_DAYS days, now], BOTH bounds inclusive
        recent = count of Invitations whose panelist.home_cell_id == cell and
                 sent_at within window (any status — contact occurred)
        reject ERR_CELL_CONTACT_CAP_REACHED when recent >= CONTACT_CAP
    input_set: "panelist contact history; invitations per cell in trailing window"
    constants:
      WASHOUT_DAYS: 7
      CONTACT_CAP: 3
      CONTACT_WINDOW_DAYS: 7
    precision: "second-resolution timestamps"

  - name: k_anonymity_gate
    trigger: "Publication creation computes breakdown_cells; publish enforces the gate"
    algorithm: threshold
    formula: |
      breakdown_cells: group the wave's ACCEPTED responses by panelist.home_cell_id.
      For each cell with n_respondents > 0:
        suppressed = (n_respondents < k_threshold)
      Publish gate: reject ERR_K_ANONYMITY_VIOLATION when any cell has
      0 < n_respondents < k_threshold. A cell with exactly k_threshold respondents
      passes (inclusive >=). Cells with zero responses are absent, not violations.
    input_set: "Responses status == ACCEPTED of the publication's wave, grouped by home cell"
    precision: "integer counts; boundary inclusive at k_threshold"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "Caller role is listed on the endpoint; department-scoped commitment actions additionally require commitment.department_name == X-User-ID"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: existence
    check: "Path ids exist, validated left-to-right; body FK references exist (panelist_id, wave_id, instrument_id, invitation_id, publication_id, weight_snapshot_id, panelist demographic triple -> PanelCell)"
    error_id: "ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path/body references"
  - priority: 4
    category: existence
    check: "Malformed request body: missing required field, wrong type, enum value outside declared set, range violation (completeness_pct in [0,100], min_response_rate in (0,1], closes_at > opens_at, question_count >= 1, target_size >= 0)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"
  - priority: 5
    category: state
    check: "OCC: expected_wave_version / expected_cell_version equals the parent's current version"
    error_id: "ERR_STALE_WAVE_VERSION | ERR_STALE_CELL_VERSION"
    http_status: 412
    applies_to: "POST /feedback-panel/survey-waves/{id}/weight-snapshots, POST /feedback-panel/panel-cells/{id}/targets"
  - priority: 6
    category: state
    check: "Target resource state precondition for the operation (wave FIELDING for dispatch; wave ARMED window for open-fielding; instrument LOCKED for arm; instrument IN_REVIEW/APPROVED for certify; panelist LAPSED for reactivate; snapshot latest for finalize; publication DRAFT for publish; award/response/invitation/commitment/hold/run in the required from-state; terminal states reject all further transitions)"
    error_id: "state-specific: ERR_WAVE_NOT_FIELDING | ERR_WAVE_INVALID_STATE | ERR_WAVE_NOT_ARMED | ERR_WAVE_NOT_CLOSED | ERR_WAVE_NOT_WEIGHTED | ERR_WAVE_ALREADY_TERMINAL | ERR_INSTRUMENT_NOT_LOCKED | ERR_INSTRUMENT_NOT_IN_REVIEW | ERR_PANELIST_NOT_LAPSED | ERR_PANELIST_NOT_ACTIVE | ERR_INVITATION_NOT_OPEN | ERR_RESPONSE_NOT_REVIEWABLE | ERR_AWARD_NOT_AUTHORIZED_STATE | ERR_AWARD_NOT_PAID_STATE | ERR_AWARD_NOT_FORFEIT_STATE | ERR_SNAPSHOT_SUPERSEDED | ERR_SNAPSHOT_NOT_FINALIZED | ERR_PUBLICATION_NOT_PUBLISHED | ERR_COMMITMENT_NOT_OPEN | ERR_REFRESH_RUN_NOT_OPEN | ERR_INSTRUMENT_INVALID_STATE | ERR_TRANSLATION_INVALID_STATE | ERR_PRIVACY_HOLD_NOT_ACTIVE"
    http_status: 409
    applies_to: "state transition endpoints"
  - priority: 7
    category: business_safety
    check: "Privacy: no ACTIVE PrivacyHold on the panelist for dispatch/reactivate; segregation of duties on publish (publisher != snapshot.finalized_by_user_id)"
    error_id: "ERR_PRIVACY_HOLD_ACTIVE | ERR_SEGREGATION_OF_DUTIES"
    http_status: 403
    applies_to: "POST /feedback-panel/invitations, POST /feedback-panel/panelists/{id}/reactivate, POST /feedback-panel/publications/{id}/publish"
  - priority: 8
    category: business_temporal
    check: "Time-window rules: open-fielding within [opens_at, closes_at]; dispatch washout (now >= last_contacted_at + 7d); reminder cadence (>= 48h since last contact/reminder); fulfill only when now <= due_at; mark-breached only when now > due_at; renegotiate new_due_at > now"
    error_id: "ERR_WAVE_WINDOW_NOT_OPEN | ERR_CONTACT_WASHOUT_VIOLATION | ERR_REMINDER_CADENCE_TOO_SOON | ERR_COMMITMENT_OVERDUE | ERR_COMMITMENT_NOT_OVERDUE"
    http_status: 409
    applies_to: "open-fielding, invitations create, remind, fulfill, mark-breached, renegotiate"
  - priority: 9
    category: business_constraint
    check: "Uniqueness and capacity, evaluated in this intra-priority order: duplicate SENT invitation per (wave_id, panelist_id); cell saturation at ENROLL (active_count >= target_size); cell contact cap (>= 3 sent in trailing 7d); one ACTIVE privacy hold per panelist; one non-REJECTED translation per (instrument_id, locale); k-anonymity gate; snapshot computable (>= 1 ACCEPTED response); min response rate for early close"
    error_id: "ERR_DUPLICATE_INVITATION | ERR_CELL_SATURATED | ERR_CELL_CONTACT_CAP_REACHED | ERR_PRIVACY_HOLD_EXISTS | ERR_DUPLICATE_TRANSLATION | ERR_K_ANONYMITY_VIOLATION | ERR_WEIGHTS_NOT_COMPUTABLE | ERR_MIN_RESPONSE_NOT_MET"
    http_status: 409
    applies_to: "invitations create, translations create, privacy-holds create, publish, snapshot create/finalize, wave close, enroll"
  - priority: 10
    category: business_fiscal
    check: "Incentive pool sufficiency: dispatch requires wave.incentive_pool_available_cents >= base_incentive_cents; award authorize requires available >= amount_cents"
    error_id: ERR_INCENTIVE_POOL_INSUFFICIENT
    http_status: 402
    applies_to: "POST /feedback-panel/invitations, POST /feedback-panel/incentive-awards/{id}/authorize"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- logical clock (test-driving; default time 2026-08-01T00:00:00Z at startup) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Before any call the clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to wall-clock time."
    roles: [PanelManager]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["logical clock advanced to to_iso8601"]

  # --- PanelCell ---
  - method: POST
    path: "/feedback-panel/panel-cells"
    description: "Create a demographic quota cell"
    roles: [PanelManager]
    code: 201
    input: [age_band, district, tenure_bucket, target_size]
    output: PanelCell
    side_effects: ["status OPEN (SATURATED when target_size == 0); reserved_count 0; active_count 0"]
  - method: GET
    path: "/feedback-panel/panel-cells"
    description: "List cells"
    roles: [PanelManager, DataAnalyst]
    code: 200
    input: ["status?"]
    output: "PanelCell[]"
    side_effects: []
  - method: GET
    path: "/feedback-panel/panel-cells/{id}"
    description: "Get one cell"
    roles: [PanelManager, DataAnalyst]
    code: 200
    input: []
    output: PanelCell
    side_effects: []
  - method: POST
    path: "/feedback-panel/panel-cells/{id}/targets"
    description: "Adjust cell recruitment target (OCC on cell version)"
    roles: [PanelManager]
    code: 200
    input: [target_size, expected_cell_version]
    output: PanelCell
    side_effects: ["PanelCell.version increments by 1", "status re-derived from active_count vs new target_size"]

  # --- Panelist ---
  - method: POST
    path: "/feedback-panel/panelists"
    description: "Register a panel applicant"
    roles: [PanelManager]
    code: 201
    input: [external_ref, full_name, age_band, district, tenure_bucket, "preferred_locale?"]
    output: Panelist
    side_effects: ["status APPLICANT; missed_streak 0; last_contacted_at null"]
  - method: GET
    path: "/feedback-panel/panelists"
    description: "List panelists"
    roles: [PanelManager, PrivacyOfficer]
    code: 200
    input: ["status?", "home_cell_id?"]
    output: "Panelist[]"
    side_effects: []
  - method: GET
    path: "/feedback-panel/panelists/{id}"
    description: "Get one panelist"
    roles: [PanelManager, PrivacyOfficer]
    code: 200
    input: []
    output: Panelist
    side_effects: []
  - method: POST
    path: "/feedback-panel/panelists/{id}/enroll"
    description: "Seat an applicant into their demographic cell (APPLICANT -> ACTIVE)"
    roles: [PanelManager]
    code: 200
    input: []
    output: Panelist
    side_effects: ["home_cell_id resolved", "cell.active_count += 1; cell status re-derived; cell.version increments"]
  - method: POST
    path: "/feedback-panel/panelists/{id}/reactivate"
    description: "Reactivate a LAPSED panelist"
    roles: [PanelManager]
    code: 200
    input: []
    output: Panelist
    side_effects: ["status -> ACTIVE"]
  - method: POST
    path: "/feedback-panel/panelists/{id}/withdraw"
    description: "Withdraw an ACTIVE or LAPSED panelist"
    roles: [PanelManager]
    code: 200
    input: []
    output: Panelist
    side_effects: ["status -> WITHDRAWN", "cell.active_count -= 1", "SENT invitations -> SUPPRESSED"]

  # --- Instrument ---
  - method: POST
    path: "/feedback-panel/instruments"
    description: "Create a survey instrument"
    roles: [SurveyDesigner]
    code: 201
    input: [title, question_count, required_locales, "base_locale?"]
    output: Instrument
    side_effects: ["status DRAFT; revision 1"]
  - method: GET
    path: "/feedback-panel/instruments"
    description: "List instruments"
    roles: [SurveyDesigner, PanelManager]
    code: 200
    input: ["status?"]
    output: "Instrument[]"
    side_effects: []
  - method: GET
    path: "/feedback-panel/instruments/{id}"
    description: "Get one instrument"
    roles: [SurveyDesigner, PanelManager, DataAnalyst]
    code: 200
    input: []
    output: Instrument
    side_effects: []
  - method: POST
    path: "/feedback-panel/instruments/{id}/submit-review"
    description: "DRAFT -> IN_REVIEW"
    roles: [SurveyDesigner]
    code: 200
    input: []
    output: Instrument
    side_effects: []
  - method: POST
    path: "/feedback-panel/instruments/{id}/approve"
    description: "IN_REVIEW -> APPROVED; requires CERTIFIED translations for all required locales at current revision"
    roles: [SurveyDesigner]
    code: 200
    input: []
    output: Instrument
    side_effects: []
  - method: POST
    path: "/feedback-panel/instruments/{id}/revise"
    description: "IN_REVIEW or APPROVED -> DRAFT; from APPROVED bumps revision and stales CERTIFIED translations at older revisions"
    roles: [SurveyDesigner]
    code: 200
    input: []
    output: Instrument
    side_effects: ["revision += 1 when from APPROVED", "CERTIFIED translations with instrument_revision < revision -> STALE"]
  - method: POST
    path: "/feedback-panel/instruments/{id}/lock"
    description: "APPROVED -> LOCKED; instrument becomes immutable and waves may arm"
    roles: [SurveyDesigner]
    code: 200
    input: []
    output: Instrument
    side_effects: []

  # --- Translation ---
  - method: POST
    path: "/feedback-panel/translations"
    description: "Create a translation (enters SUBMITTED at the instrument's current revision)"
    roles: [SurveyDesigner]
    code: 201
    input: [instrument_id, locale, translator_ref]
    output: Translation
    side_effects: ["instrument_revision := instrument.revision"]
  - method: GET
    path: "/feedback-panel/translations"
    description: "List translations"
    roles: [SurveyDesigner, PanelManager]
    code: 200
    input: ["instrument_id?", "locale?", "status?"]
    output: "Translation[]"
    side_effects: []
  - method: GET
    path: "/feedback-panel/translations/{id}"
    description: "Get one translation"
    roles: [SurveyDesigner]
    code: 200
    input: []
    output: Translation
    side_effects: []
  - method: POST
    path: "/feedback-panel/translations/{id}/certify"
    description: "SUBMITTED -> CERTIFIED"
    roles: [SurveyDesigner]
    code: 200
    input: []
    output: Translation
    side_effects: []
  - method: POST
    path: "/feedback-panel/translations/{id}/reject"
    description: "SUBMITTED -> REJECTED"
    roles: [SurveyDesigner]
    code: 200
    input: []
    output: Translation
    side_effects: []
  - method: POST
    path: "/feedback-panel/translations/{id}/resubmit"
    description: "REJECTED or STALE -> SUBMITTED at current instrument revision"
    roles: [SurveyDesigner]
    code: 200
    input: []
    output: Translation
    side_effects: ["instrument_revision := instrument.revision"]

  # --- SurveyWave ---
  - method: POST
    path: "/feedback-panel/survey-waves"
    description: "Create a survey wave"
    roles: [PanelManager]
    code: 201
    input: [wave_code, instrument_id, opens_at, closes_at, min_response_rate, incentive_pool_total_cents, base_incentive_cents]
    output: SurveyWave
    side_effects: ["status DRAFT; pool available = total; reserved/paid = 0; invited/completed = 0"]
  - method: GET
    path: "/feedback-panel/survey-waves"
    description: "List waves"
    roles: [PanelManager, DataAnalyst]
    code: 200
    input: ["instrument_id?", "status?"]
    output: "SurveyWave[]"
    side_effects: []
  - method: GET
    path: "/feedback-panel/survey-waves/{id}"
    description: "Get one wave"
    roles: [PanelManager, DataAnalyst, PrivacyOfficer, IncentiveClerk]
    code: 200
    input: []
    output: SurveyWave
    side_effects: []
  - method: POST
    path: "/feedback-panel/survey-waves/{id}/arm"
    description: "DRAFT -> ARMED"
    roles: [PanelManager]
    code: 200
    input: []
    output: SurveyWave
    side_effects: []
  - method: POST
    path: "/feedback-panel/survey-waves/{id}/open-fielding"
    description: "ARMED -> FIELDING within the declared window"
    roles: [PanelManager]
    code: 200
    input: []
    output: SurveyWave
    side_effects: []
  - method: POST
    path: "/feedback-panel/survey-waves/{id}/close"
    description: "FIELDING -> CLOSED; expires SENT invitations, recomputes streaks, lapses streak >= 2 panelists"
    roles: [PanelManager]
    code: 200
    input: []
    output: SurveyWave
    side_effects: ["SENT invitations -> EXPIRED", "missed_streak recompute", "ACTIVE -> LAPSED when streak >= 2", "cell.reserved_count re-derived"]
  - method: POST
    path: "/feedback-panel/survey-waves/{id}/cancel"
    description: "DRAFT or ARMED -> CANCELLED"
    roles: [PanelManager]
    code: 200
    input: []
    output: SurveyWave
    side_effects: []
  - method: GET
    path: "/feedback-panel/survey-waves/{id}/analysis"
    description: "Computed analysis read: projected/final response rate, program-wide representativeness score"
    roles: [DataAnalyst]
    code: 200
    input: []
    output: "{ projected_response_rate: number, final_response_rate: number|null, representativeness_score: number }"
    side_effects: []

  # --- Invitation ---
  - method: POST
    path: "/feedback-panel/invitations"
    description: "Dispatch an invitation (creates in SENT); enforces wave/panelist state, privacy holds, washout, saturation, contact cap, pool floor"
    roles: [PanelManager]
    code: 201
    input: [wave_id, panelist_id]
    output: Invitation
    side_effects:
      - "sent_at := now; panelist.last_contacted_at := now"
      - "cell.reserved_count += 1; cell.version increments"
      - "wave.invited_count += 1; wave.version increments"
  - method: GET
    path: "/feedback-panel/invitations"
    description: "List invitations"
    roles: [PanelManager]
    code: 200
    input: ["wave_id?", "panelist_id?", "status?"]
    output: "Invitation[]"
    side_effects: []
  - method: GET
    path: "/feedback-panel/invitations/{id}"
    description: "Get one invitation"
    roles: [PanelManager]
    code: 200
    input: []
    output: Invitation
    side_effects: []
  - method: POST
    path: "/feedback-panel/invitations/{id}/decline"
    description: "SENT -> DECLINED"
    roles: [PanelManager]
    code: 200
    input: []
    output: Invitation
    side_effects: ["cell.reserved_count -= 1", "missed_streak recomputed"]
  - method: POST
    path: "/feedback-panel/invitations/{id}/remind"
    description: "Send a reminder (SENT self-transition); cadence 48h, cap 2"
    roles: [PanelManager]
    code: 200
    input: []
    output: Invitation
    side_effects: ["reminder_count += 1", "last_reminder_at := now"]

  # --- Response ---
  - method: POST
    path: "/feedback-panel/responses"
    description: "Submit a response against a SENT invitation (creates SUBMITTED; mints the IncentiveAward)"
    roles: [PanelManager]
    code: 201
    input: [invitation_id, answers_payload, completeness_pct, completion_seconds]
    output: Response
    side_effects:
      - "invitation SENT -> COMPLETED; wave.completed_count += 1; cell.reserved_count -= 1"
      - "speeder_flag / low_effort_flag computed"
      - "IncentiveAward created (PENDING, UNPAID) with amount per incentive_amount_cents"
  - method: GET
    path: "/feedback-panel/responses"
    description: "List responses"
    roles: [PanelManager, DataAnalyst]
    code: 200
    input: ["invitation_id?", "wave_id?", "panelist_id?", "status?"]
    output: "Response[]"
    side_effects: []
  - method: GET
    path: "/feedback-panel/responses/{id}"
    description: "Get one response"
    roles: [PanelManager, DataAnalyst]
    code: 200
    input: []
    output: Response
    side_effects: []
  - method: POST
    path: "/feedback-panel/responses/{id}/accept"
    description: "SUBMITTED or QUARANTINED -> ACCEPTED"
    roles: [DataAnalyst]
    code: 200
    input: []
    output: Response
    side_effects: ["award.eligibility_status -> ELIGIBLE"]
  - method: POST
    path: "/feedback-panel/responses/{id}/quarantine"
    description: "SUBMITTED -> QUARANTINED"
    roles: [DataAnalyst]
    code: 200
    input: []
    output: Response
    side_effects: []
  - method: POST
    path: "/feedback-panel/responses/{id}/discard"
    description: "QUARANTINED -> DISCARDED"
    roles: [DataAnalyst]
    code: 200
    input: []
    output: Response
    side_effects: ["award.eligibility_status -> INELIGIBLE"]

  # --- IncentiveAward ---
  - method: GET
    path: "/feedback-panel/incentive-awards"
    description: "List awards"
    roles: [IncentiveClerk, PanelManager]
    code: 200
    input: ["response_id?", "wave_id?", "payout_status?", "eligibility_status?"]
    output: "IncentiveAward[]"
    side_effects: []
  - method: GET
    path: "/feedback-panel/incentive-awards/{id}"
    description: "Get one award"
    roles: [IncentiveClerk]
    code: 200
    input: []
    output: IncentiveAward
    side_effects: []
  - method: POST
    path: "/feedback-panel/incentive-awards/{id}/authorize"
    description: "payout UNPAID -> AUTHORIZED; reserves pool funds"
    roles: [IncentiveClerk]
    code: 200
    input: []
    output: IncentiveAward
    side_effects: ["wave: available -= amount_cents; reserved += amount_cents"]
  - method: POST
    path: "/feedback-panel/incentive-awards/{id}/pay"
    description: "payout AUTHORIZED -> PAID"
    roles: [IncentiveClerk]
    code: 200
    input: []
    output: IncentiveAward
    side_effects: ["wave: reserved -= amount_cents; paid += amount_cents"]
  - method: POST
    path: "/feedback-panel/incentive-awards/{id}/forfeit"
    description: "payout AUTHORIZED -> FORFEITED; returns funds to pool"
    roles: [IncentiveClerk]
    code: 200
    input: []
    output: IncentiveAward
    side_effects: ["wave: reserved -= amount_cents; available += amount_cents"]

  # --- WeightSnapshot ---
  - method: POST
    path: "/feedback-panel/survey-waves/{id}/weight-snapshots"
    description: "Create a weight snapshot for a CLOSED/WEIGHTED wave (OCC on wave version); supersedes prior non-SUPERSEDED snapshots"
    roles: [DataAnalyst]
    code: 201
    input: [method, expected_wave_version]
    output: WeightSnapshot
    side_effects:
      - "SurveyWave.version increments by 1"
      - "prior PROVISIONAL/FINALIZED snapshots of the wave -> SUPERSEDED"
      - "wave WEIGHTED -> CLOSED when re-weighting"
      - "weights computed per response_weight calculation"
  - method: GET
    path: "/feedback-panel/weight-snapshots"
    description: "List snapshots"
    roles: [DataAnalyst, PrivacyOfficer]
    code: 200
    input: ["wave_id?", "status?"]
    output: "WeightSnapshot[]"
    side_effects: []
  - method: GET
    path: "/feedback-panel/weight-snapshots/{id}"
    description: "Get one snapshot"
    roles: [DataAnalyst, PrivacyOfficer]
    code: 200
    input: []
    output: WeightSnapshot
    side_effects: []
  - method: POST
    path: "/feedback-panel/weight-snapshots/{id}/finalize"
    description: "PROVISIONAL -> FINALIZED; records finalized_by_user_id; wave CLOSED -> WEIGHTED"
    roles: [DataAnalyst]
    code: 200
    input: []
    output: WeightSnapshot
    side_effects: ["finalized_by_user_id := caller X-User-ID", "wave CLOSED -> WEIGHTED"]

  # --- Publication ---
  - method: POST
    path: "/feedback-panel/publications"
    description: "Draft a publication pinning a weight snapshot; breakdown_cells computed at creation"
    roles: [DataAnalyst]
    code: 201
    input: [wave_id, weight_snapshot_id, title, "k_threshold?"]
    output: Publication
    side_effects: ["breakdown_cells computed over ACCEPTED responses grouped by home cell"]
  - method: GET
    path: "/feedback-panel/publications"
    description: "List publications"
    roles: [DataAnalyst, PrivacyOfficer, DepartmentLiaison]
    code: 200
    input: ["wave_id?", "weight_snapshot_id?", "status?"]
    output: "Publication[]"
    side_effects: []
  - method: GET
    path: "/feedback-panel/publications/{id}"
    description: "Get one publication"
    roles: [DataAnalyst, PrivacyOfficer, DepartmentLiaison]
    code: 200
    input: []
    output: Publication
    side_effects: []
  - method: POST
    path: "/feedback-panel/publications/{id}/publish"
    description: "DRAFT -> PUBLISHED; enforces wave WEIGHTED, snapshot FINALIZED, segregation of duties, k-anonymity"
    roles: [PrivacyOfficer]
    code: 200
    input: []
    output: Publication
    side_effects: ["wave WEIGHTED -> PUBLISHED"]
  - method: POST
    path: "/feedback-panel/publications/{id}/retract"
    description: "PUBLISHED -> RETRACTED; suspends open commitments"
    roles: [PrivacyOfficer]
    code: 200
    input: []
    output: Publication
    side_effects: ["COMMITTED/IN_PROGRESS commitments -> SUSPENDED"]

  # --- FollowUpCommitment ---
  - method: POST
    path: "/feedback-panel/follow-up-commitments"
    description: "Create a department follow-up commitment on a PUBLISHED publication"
    roles: [DepartmentLiaison]
    code: 201
    input: [publication_id, department_name, summary, due_at]
    output: FollowUpCommitment
    side_effects: []
  - method: GET
    path: "/feedback-panel/follow-up-commitments"
    description: "List commitments"
    roles: [DepartmentLiaison, PanelManager, PrivacyOfficer]
    code: 200
    input: ["publication_id?", "department_name?", "status?"]
    output: "FollowUpCommitment[]"
    side_effects: []
  - method: GET
    path: "/feedback-panel/follow-up-commitments/{id}"
    description: "Get one commitment"
    roles: [DepartmentLiaison, PanelManager, PrivacyOfficer]
    code: 200
    input: []
    output: FollowUpCommitment
    side_effects: []
  - method: POST
    path: "/feedback-panel/follow-up-commitments/{id}/start"
    description: "COMMITTED -> IN_PROGRESS (own department only)"
    roles: [DepartmentLiaison]
    code: 200
    input: []
    output: FollowUpCommitment
    side_effects: []
  - method: POST
    path: "/feedback-panel/follow-up-commitments/{id}/fulfill"
    description: "IN_PROGRESS -> FULFILLED when now <= due_at (own department only)"
    roles: [DepartmentLiaison]
    code: 200
    input: []
    output: FollowUpCommitment
    side_effects: []
  - method: POST
    path: "/feedback-panel/follow-up-commitments/{id}/mark-breached"
    description: "COMMITTED/IN_PROGRESS -> BREACHED when now > due_at"
    roles: [PanelManager]
    code: 200
    input: []
    output: FollowUpCommitment
    side_effects: ["breached_at := now"]
  - method: POST
    path: "/feedback-panel/follow-up-commitments/{id}/renegotiate"
    description: "BREACHED -> COMMITTED with a new future due date (own department only)"
    roles: [DepartmentLiaison]
    code: 200
    input: [new_due_at]
    output: FollowUpCommitment
    side_effects: ["due_at := new_due_at", "breached_at := null"]

  # --- PrivacyHold ---
  - method: POST
    path: "/feedback-panel/privacy-holds"
    description: "Place a privacy hold; FULL_SUPPRESS suspends the panelist and suppresses live invitations"
    roles: [PrivacyOfficer]
    code: 201
    input: [panelist_id, scope, reason]
    output: PrivacyHold
    side_effects: ["FULL_SUPPRESS: panelist ACTIVE -> SUSPENDED; SENT invitations -> SUPPRESSED; cell.reserved_count re-derived"]
  - method: GET
    path: "/feedback-panel/privacy-holds"
    description: "List privacy holds"
    roles: [PrivacyOfficer, PanelManager]
    code: 200
    input: ["panelist_id?", "status?"]
    output: "PrivacyHold[]"
    side_effects: []
  - method: GET
    path: "/feedback-panel/privacy-holds/{id}"
    description: "Get one privacy hold"
    roles: [PrivacyOfficer, PanelManager]
    code: 200
    input: []
    output: PrivacyHold
    side_effects: []
  - method: POST
    path: "/feedback-panel/privacy-holds/{id}/release"
    description: "ACTIVE -> RELEASED; reactivates a suspended panelist when no other ACTIVE hold remains"
    roles: [PrivacyOfficer]
    code: 200
    input: []
    output: PrivacyHold
    side_effects: ["panelist SUSPENDED -> ACTIVE when last ACTIVE hold released"]

  # --- RefreshRun ---
  - method: POST
    path: "/feedback-panel/refresh-runs"
    description: "Open a refresh run; previews planned attrition count"
    roles: [PanelManager]
    code: 201
    input: [run_label, "attrition_grace_days?"]
    output: RefreshRun
    side_effects: ["planned_attrition_count computed"]
  - method: GET
    path: "/feedback-panel/refresh-runs/{id}"
    description: "Get one refresh run"
    roles: [PanelManager]
    code: 200
    input: []
    output: RefreshRun
    side_effects: []
  - method: POST
    path: "/feedback-panel/refresh-runs/{id}/apply"
    description: "OPEN -> APPLIED; attrits grace-expired LAPSED panelists; forfeits their AUTHORIZED awards; credits wave pools"
    roles: [PanelManager]
    code: 200
    input: []
    output: RefreshRun
    side_effects: ["LAPSED -> ATTRITED sweep", "AUTHORIZED awards of attrited panelists -> FORFEITED", "pool buckets re-derived", "applied counters set"]
  - method: POST
    path: "/feedback-panel/refresh-runs/{id}/abort"
    description: "OPEN -> ABORTED"
    roles: [PanelManager]
    code: 200
    input: []
    output: RefreshRun
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # auth / authz
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role or X-User-ID header missing or role not declared" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Caller role not permitted for the endpoint" }
  - { id: ERR_FORBIDDEN_DEPARTMENT, http: 403, condition: "DepartmentLiaison acting on a commitment whose department_name differs from the caller's X-User-ID (for DepartmentLiaison, X-User-ID is the department name)" }
  # request shape
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, type mismatch, enum outside declared set, range violation (completeness_pct outside [0,100], min_response_rate outside (0,1], closes_at <= opens_at, question_count < 1, target_size < 0), duplicate unique field (wave_code, external_ref, cell demographic triple), or weight_snapshot_id not belonging to wave_id on publication create" }
  # not found
  - { id: ERR_PANEL_CELL_NOT_FOUND, http: 404, condition: "Cell id unknown, or no cell matches a panelist's demographic triple at enroll" }
  - { id: ERR_PANELIST_NOT_FOUND, http: 404, condition: "Panelist id unknown" }
  - { id: ERR_INSTRUMENT_NOT_FOUND, http: 404, condition: "Instrument id unknown" }
  - { id: ERR_TRANSLATION_NOT_FOUND, http: 404, condition: "Translation id unknown" }
  - { id: ERR_WAVE_NOT_FOUND, http: 404, condition: "SurveyWave id unknown" }
  - { id: ERR_INVITATION_NOT_FOUND, http: 404, condition: "Invitation id unknown" }
  - { id: ERR_RESPONSE_NOT_FOUND, http: 404, condition: "Response id unknown" }
  - { id: ERR_AWARD_NOT_FOUND, http: 404, condition: "IncentiveAward id unknown" }
  - { id: ERR_SNAPSHOT_NOT_FOUND, http: 404, condition: "WeightSnapshot id unknown" }
  - { id: ERR_PUBLICATION_NOT_FOUND, http: 404, condition: "Publication id unknown" }
  - { id: ERR_COMMITMENT_NOT_FOUND, http: 404, condition: "FollowUpCommitment id unknown" }
  - { id: ERR_PRIVACY_HOLD_NOT_FOUND, http: 404, condition: "PrivacyHold id unknown" }
  - { id: ERR_REFRESH_RUN_NOT_FOUND, http: 404, condition: "RefreshRun id unknown" }
  # OCC
  - { id: ERR_STALE_WAVE_VERSION, http: 412, condition: "expected_wave_version does not match the wave's current version" }
  - { id: ERR_STALE_CELL_VERSION, http: 412, condition: "expected_cell_version does not match the cell's current version" }
  # state
  - { id: ERR_WAVE_NOT_FIELDING, http: 409, condition: "Operation requires wave status FIELDING (dispatch, remind, close from a non-FIELDING non-terminal wave)" }
  - { id: ERR_WAVE_INVALID_STATE, http: 409, condition: "Wave transition not valid from its current non-terminal status (e.g., arm from ARMED, cancel from FIELDING)" }
  - { id: ERR_WAVE_NOT_ARMED, http: 409, condition: "open-fielding requires wave status ARMED" }
  - { id: ERR_WAVE_NOT_CLOSED, http: 409, condition: "Snapshot finalize requires wave status CLOSED" }
  - { id: ERR_WAVE_NOT_WEIGHTED, http: 409, condition: "Publish requires wave status WEIGHTED" }
  - { id: ERR_WAVE_ALREADY_TERMINAL, http: 409, condition: "Wave is PUBLISHED or CANCELLED; no further transitions" }
  - { id: ERR_INSTRUMENT_NOT_LOCKED, http: 409, condition: "Wave arm requires instrument status LOCKED" }
  - { id: ERR_INSTRUMENT_NOT_IN_REVIEW, http: 409, condition: "Translation certify requires instrument IN_REVIEW or APPROVED" }
  - { id: ERR_INSTRUMENT_INVALID_STATE, http: 409, condition: "Instrument transition not valid from its current status (incl. any transition from LOCKED)" }
  - { id: ERR_TRANSLATION_INVALID_STATE, http: 409, condition: "Translation transition not valid from its current status" }
  - { id: ERR_TRANSLATION_STALE_REVISION, http: 409, condition: "Translation certifies an older instrument revision" }
  - { id: ERR_TRANSLATION_NOT_CERTIFIED, http: 409, condition: "A required locale lacks a CERTIFIED translation at the instrument's current revision (instrument approve, wave arm)" }
  - { id: ERR_PANELIST_NOT_LAPSED, http: 409, condition: "Reactivate requires panelist status LAPSED" }
  - { id: ERR_PANELIST_NOT_ACTIVE, http: 409, condition: "Dispatch requires panelist status ACTIVE" }
  - { id: ERR_INVITATION_NOT_OPEN, http: 409, condition: "Decline/remind/response require invitation status SENT" }
  - { id: ERR_RESPONSE_NOT_REVIEWABLE, http: 409, condition: "Response transition not valid from its current status" }
  - { id: ERR_AWARD_NOT_AUTHORIZED_STATE, http: 409, condition: "Authorize requires eligibility ELIGIBLE and payout UNPAID" }
  - { id: ERR_AWARD_NOT_PAID_STATE, http: 409, condition: "Pay requires payout AUTHORIZED" }
  - { id: ERR_AWARD_NOT_FORFEIT_STATE, http: 409, condition: "Forfeit requires payout AUTHORIZED" }
  - { id: ERR_SNAPSHOT_SUPERSEDED, http: 409, condition: "Snapshot already SUPERSEDED; only the latest snapshot can finalize" }
  - { id: ERR_SNAPSHOT_NOT_FINALIZED, http: 409, condition: "Publish requires pinned snapshot status FINALIZED" }
  - { id: ERR_PUBLICATION_NOT_PUBLISHED, http: 409, condition: "Commitment creation requires publication status PUBLISHED" }
  - { id: ERR_COMMITMENT_NOT_OPEN, http: 409, condition: "Commitment transition not valid from its current status" }
  - { id: ERR_PRIVACY_HOLD_NOT_ACTIVE, http: 409, condition: "Release requires hold status ACTIVE" }
  - { id: ERR_REFRESH_RUN_NOT_OPEN, http: 409, condition: "Apply/abort require run status OPEN" }
  # safety / compliance
  - { id: ERR_PRIVACY_HOLD_ACTIVE, http: 403, condition: "An ACTIVE privacy hold bars invitation dispatch or panelist reactivation" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Publisher X-User-ID equals the snapshot's finalized_by_user_id" }
  # temporal
  - { id: ERR_WAVE_WINDOW_NOT_OPEN, http: 409, condition: "now outside [opens_at, closes_at] for open-fielding, or now > opens_at at arm" }
  - { id: ERR_CONTACT_WASHOUT_VIOLATION, http: 409, condition: "now < panelist.last_contacted_at + 7 days (half-open washout buffer)" }
  - { id: ERR_REMINDER_CADENCE_TOO_SOON, http: 409, condition: "Fewer than 48h since sent_at or the last reminder" }
  - { id: ERR_REMINDER_CAP_REACHED, http: 409, condition: "reminder_count already == 2" }
  - { id: ERR_COMMITMENT_OVERDUE, http: 409, condition: "Fulfill with now > due_at, or renegotiate with new_due_at <= now" }
  - { id: ERR_COMMITMENT_NOT_OVERDUE, http: 409, condition: "mark-breached with now <= due_at" }
  # constraint
  - { id: ERR_DUPLICATE_INVITATION, http: 409, condition: "A SENT invitation already exists for (wave_id, panelist_id)" }
  - { id: ERR_CELL_SATURATED, http: 409, condition: "Cell active_count >= target_size at enroll" }
  - { id: ERR_CELL_CONTACT_CAP_REACHED, http: 409, condition: "3+ invitations already sent into the cell within the trailing 7-day window" }
  - { id: ERR_PRIVACY_HOLD_EXISTS, http: 409, condition: "An ACTIVE hold already exists for the panelist" }
  - { id: ERR_DUPLICATE_TRANSLATION, http: 409, condition: "A non-REJECTED translation already exists for (instrument_id, locale)" }
  - { id: ERR_K_ANONYMITY_VIOLATION, http: 422, condition: "A breakdown cell has 0 < n_respondents < k_threshold" }
  - { id: ERR_WEIGHTS_NOT_COMPUTABLE, http: 422, condition: "No ACCEPTED responses exist for the wave" }
  - { id: ERR_MIN_RESPONSE_NOT_MET, http: 409, condition: "Early close requested before closes_at with completed/invited < min_response_rate (or invited_count == 0)" }
  # fiscal
  - { id: ERR_INCENTIVE_POOL_INSUFFICIENT, http: 402, condition: "Wave incentive pool available below base_incentive_cents at dispatch or below amount_cents at authorize" }

# =============================================================================
# §1.7 RBAC Matrix (segregation of duties; all roles opaque operator identities)
# =============================================================================
roles:
  - name: PanelManager
    description: "Program operator: cells, panelists, waves, invitation dispatch, refresh runs, breach marking"
    identity: opaque
    exclusive_operations:
      - "POST /feedback-panel/panel-cells, POST /feedback-panel/panel-cells/{id}/targets"
      - "POST /feedback-panel/panelists* (register, enroll, reactivate, withdraw)"
      - "POST /feedback-panel/survey-waves* (create, arm, open-fielding, close, cancel)"
      - "POST /feedback-panel/invitations* (create, decline, remind)"
      - "POST /feedback-panel/responses (submit on behalf of respondent)"
      - "POST /feedback-panel/refresh-runs* (create, apply, abort)"
      - "POST /feedback-panel/follow-up-commitments/{id}/mark-breached"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET reads on cells, panelists, instruments, translations, waves, invitations, responses, awards, holds, commitments, refresh runs"
  - name: SurveyDesigner
    description: "Instrument author: questionnaire lifecycle and translation certification"
    identity: opaque
    exclusive_operations:
      - "POST /feedback-panel/instruments* (create, submit-review, approve, revise, lock)"
      - "POST /feedback-panel/translations* (create, certify, reject, resubmit)"
    shared_operations:
      - "GET reads on instruments and translations"
  - name: DataAnalyst
    description: "Methodologist: response review, weighting, analysis, publication drafting; barred from payout and publish"
    identity: opaque
    exclusive_operations:
      - "POST /feedback-panel/responses/{id}/accept|quarantine|discard"
      - "POST /feedback-panel/survey-waves/{id}/weight-snapshots"
      - "POST /feedback-panel/weight-snapshots/{id}/finalize"
      - "POST /feedback-panel/publications"
      - "GET /feedback-panel/survey-waves/{id}/analysis"
    shared_operations:
      - "GET reads on cells, waves, responses, snapshots, publications"
  - name: IncentiveClerk
    description: "Incentive administrator: authorizes, pays, and forfeits awards; never sees response payloads or panelist PII"
    identity: opaque
    exclusive_operations:
      - "POST /feedback-panel/incentive-awards/{id}/authorize|pay|forfeit"
    shared_operations:
      - "GET reads on awards and waves"
  - name: PrivacyOfficer
    description: "Privacy authority: holds, de-identification gate, publish and retract; must not be the snapshot finalizer"
    identity: opaque
    exclusive_operations:
      - "POST /feedback-panel/privacy-holds, POST /feedback-panel/privacy-holds/{id}/release"
      - "POST /feedback-panel/publications/{id}/publish, POST /feedback-panel/publications/{id}/retract"
    shared_operations:
      - "GET reads on panelists, holds, snapshots, publications, commitments, waves"
  - name: DepartmentLiaison
    description: "Department representative: owns follow-up commitments for their own department. X-User-ID is the department name; commitment actions require commitment.department_name == X-User-ID."
    identity: opaque
    exclusive_operations:
      - "POST /feedback-panel/follow-up-commitments"
      - "POST /feedback-panel/follow-up-commitments/{id}/start|fulfill|renegotiate (commitment.department_name must equal caller X-User-ID)"
    shared_operations:
      - "GET reads on publications and commitments"
