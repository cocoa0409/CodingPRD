          setup:
            - "One SELF_CERTIFIED Fund managed by mgr-fund-1."
            - "Two QOZBusinesses, each total_asset_value 1000000.00 and total_tangible_property_basis 900000.00: B1 with declared_nqfp_amount 10000.00 and B2 with declared_nqfp_amount 300000.00; both qualification_status UNTESTED."
            - "One QOZB_EQUITY FundAsset of 400000.00 per business; both start qualification NONQUALIFIED because their businesses are UNTESTED."
            - "One MEASURED BusinessTest per business, both measured by co-measurer-1 with GROSS_INCOME_ACTUAL (600000.00 / 1000000.00) and intangibles 50000.00 / 100000.00, so only the nqfp prong differs between them."
            - "No AssetTest exists for the fund, so the DISQUALIFIED cascade's re-measure link has no MEASURED test to touch."
          setup_api_calls:
            - call: "POST /qof/funds"
              payload: { name: "Fork Fund", entity_type: "PARTNERSHIP", manager_user_id: "mgr-fund-1" }
