          rationale: "The named §1.8 instance walks the aggregation both ways — running totals after each COMMIT, correct reversal after each RELEASE, and the two-sided conservation identity plus seat_shortfall flooring at 0 — on the same guarantees."

      - name: staffing_waterfall_funds_the_least_protected_tier_first
        claim_type: waterfall_allocation
        grounds:
