  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_fiscal_faulted_stall_beats_capacity
        grounds:
          - validations[priority=7]
          - validations[priority=15]
        distinguishing_aspect: |
          Error-category pair (state vs business_fiscal): a session-start on a FAULTED
          stall while the driver also has an empty wallet returns ERR_STALL_NOT_AVAILABLE
          (priority 7, state), NOT the fiscal ERR_INSUFFICIENT_WALLET (priority 15) —
          state precedes fiscal.
        test_recipe:
          setup:
            - "A stall driven to FAULTED via ocpp-status; a home driver with wallet 0."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CPOOperator
