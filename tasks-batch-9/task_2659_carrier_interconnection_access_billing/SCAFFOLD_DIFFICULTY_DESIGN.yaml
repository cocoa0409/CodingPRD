        payload: {}
        as: RegulatoryAffairsSpecialist
      - call: POST /interconnection/agreements
        payload:
          carrier_id: ${car_id}
          agreement_label: ICA-NORTHSTAR-2026
          proposed_reciprocal_rate_per_mou_usd: 0.061250
          proposed_term_months: 36
          transit_traffic_allowed: false
          effective_date: '2026-08-01T00:00:00.000Z'
          poi_facility_capacity_trunks: 192
        as: InterconnectionManager
        captures:
          agr_id: $.data.id
          agr_v0: $.data.version
      - call: POST /interconnection/agreements/${agr_id}/offers
        payload:
          expected_agreement_version: ${agr_v0}
          offer_type: PROPOSAL
          reciprocal_rate_per_mou_usd: 0.061250
          term_months: 36
          poi_financial_responsibility: SHARED
          transit_traffic_allowed: false
        as: InterconnectionManager
        captures:
          offer1_id: $.data.id
      - call: POST /interconnection/negotiation-offers/${offer1_id}/accept
        payload: {}
        as: CarrierRepresentative
        as_user_id: ${car_id}
      - call: POST /interconnection/agreements/${agr_id}/activate
        payload: {}
        as: InterconnectionManager
      - *id001
      - *id002
      - *id003
      trigger:
      - call: POST /interconnection/trunk-groups/${tg1_id}/traffic-measurements
        payload:
          measurement_period_start: '2026-07-01T00:00:00.000Z'
          measurement_period_end: '2026-07-31T00:00:00.000Z'
          offered_calls: 10000
          blocked_calls: 300
          busy_hour_ccs: 2100.00
        as: NetworkPlanner
        captures:
          m1_id: $.data.id
      - call: GET /interconnection/trunk-augment-orders
        payload:
          trunk_group_id: ${tg1_id}
          status: PENDING
        as: NetworkPlanner
        captures:
          o1_id: $.data[0].id
      assert:
      - 'hop 1: TrunkGroup.${tg1_id}.latest_blocking_pct == 3.00, required_trunks == 68, augment_status == AUGMENT_ORDERED'
      - 'hop 1: TrafficMeasurement.${m1_id}.blocking_pct == 3.00, required_trunks_at_measurement == 68, augment_triggered == true'
      - 'hop 2: TrunkAugmentOrder.${o1_id}.status == PENDING, requested_additional_trunks == 24, required_trunks_target == 68'
      - 'hop 2: TrunkAugmentOrder.${o1_id}.triggering_measurement_id == ${m1_id} and TrunkGroup.${tg1_id}.open_augment_order_count == 1'
      - 'hop 3: InterconnectionAgreement.${agr_id}.poi_augment_pending_count == 1 and capacity_posture == CONSTRAINED'
      - 'hop 3: InterconnectionAgreement.${agr_id}.total_in_service_trunks is still 48 (no trunks are installed by the order yet)'
