# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Group Home & IDD Residential (HCBS Waiver)
# 22 instances across the 9 Difficulty Rules (every rule >= 2 instances).
# All numeric asserts are precomputed literals.
# Common fixture roles: AgencyAdmin (opaque), staff CM (CASE_MANAGER),
# Q (QIDP), D1 (DSP with MED_CERT), D2 (DSP without MED_CERT).
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (3 instances, different entity domains)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: census_current_vs_projected_diverge
        grounds:
          - calculations.census_variants
          - entities.GroupHome.fields.current_occupancy
          - entities.BedAssignment.fields.status
        distinguishing_aspect: |
          Bed/home domain: the chronological variant counts only ACTIVE assignments
          (1) while the forward-looking variant adds the PENDING admission inside the
          14-day projection window (2) — same home, same date, different counts.
        test_recipe:
          setup:
            - "Agency with a 3-bed home; individual I1 ENROLLED with ACTIVE BedAssignment (moved in 2026-06-01); individual I2 ENROLLED with PENDING BedAssignment move_in 2026-06-10; clock at 2026-06-01"
          setup_api_calls:
            - { call: "POST /agencies", payload: { name: "Agency A" }, as: AgencyAdmin, captures: { ag_id: $.data.id } }
            - { call: "POST /homes", payload: { agency_id: "${ag_id}", name: "Home A", license_number: "LIC-1", certified_bed_count: 3 }, as: AgencyAdmin, captures: { hm_id: $.data.id } }
            - { call: "POST /staff", payload: { agency_id: "${ag_id}", full_name: "Casey Manager", staff_role: "CASE_MANAGER", certifications: ["CPR"], hire_date: "2025-01-15" }, as: AgencyAdmin, captures: { cm_id: $.data.id } }
            - { call: "POST /staff", payload: { agency_id: "${ag_id}", full_name: "Quinn Qidp", staff_role: "QIDP", certifications: ["CPR"], hire_date: "2025-01-15" }, as: AgencyAdmin, captures: { q_id: $.data.id } }
            - { call: "POST /individuals", payload: { agency_id: "${ag_id}", legal_name: "Ind One", medicaid_id: "MCD-001", date_of_birth: "1990-01-01", mobility_level: "AMBULATORY" }, as: CaseManager, as_user_id: "${cm_id}", captures: { ind1_id: $.data.id, ind1_v: $.data.version } }
            - { call: "POST /individuals/${ind1_id}/enroll", payload: {}, as: QIDP, as_user_id: "${q_id}" }
            - { call: "POST /individuals", payload: { agency_id: "${ag_id}", legal_name: "Ind Two", medicaid_id: "MCD-002", date_of_birth: "1985-05-05", mobility_level: "AMBULATORY" }, as: CaseManager, as_user_id: "${cm_id}", captures: { ind2_id: $.data.id } }
            - { call: "POST /individuals/${ind2_id}/enroll", payload: {}, as: QIDP, as_user_id: "${q_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: AgencyAdmin }
            - { call: "POST /bed-assignments", payload: { home_id: "${hm_id}", bed_label: "R1-A", individual_id: "${ind1_id}", move_in_date: "2026-06-01" }, as: CaseManager, as_user_id: "${cm_id}", captures: { ba1_id: $.data.id } }
            - { call: "POST /bed-assignments/${ba1_id}/move-in", payload: {}, as: QIDP, as_user_id: "${q_id}" }
            - { call: "POST /bed-assignments", payload: { home_id: "${hm_id}", bed_label: "R1-B", individual_id: "${ind2_id}", move_in_date: "2026-06-10" }, as: CaseManager, as_user_id: "${cm_id}", captures: { ba2_id: $.data.id } }
          trigger:
            - call: "GET /homes/${hm_id}/census"
              payload: { as_of_date: "2026-06-01" }
              as: Any
              captures: { cur: $.data.current_census, proj: $.data.projected_census }
          assert:
            - "current_census == 1 (only the moved-in, ACTIVE assignment counts)"
            - "projected_census == 2 (PENDING assignment moving in 2026-06-10 is inside as_of + 14 days = 2026-06-15)"
            - "current_census != projected_census — the two variants provably diverge on identical home data"

      - name: evv_provisional_vs_final_units_diverge
        grounds:
          - calculations.billable_unit_calculation
          - entities.EVVVisit.fields.provisional_units
          - entities.EVVVisit.fields.final_units
        distinguishing_aspect: |
          Billing/EVV domain (different entity domain from census): the provisional
          variant computes 7 units from raw EVV timestamps (round_half_up(100/15));
          the final variant at exception resolution computes 5 units from adjusted
          minutes (75/15) — same visit, two valid variants, different results.
        test_recipe:
          setup:
            - "Individual ENROLLED with ACTIVE ISP and ACTIVE DAY_PROG authorization (24 units, 1500 cents/unit, span 2026-01-01..2026-12-31); DSP D1; clock 2026-06-01"
            - "EVV visit on 2026-06-02 09:00-10:40 (100 minutes), geo_within_radius=true -> PENDING with provisional_units 7"
          setup_api_calls:
            - { call: "POST /agencies", payload: { name: "Agency A" }, as: AgencyAdmin, captures: { ag_id: $.data.id } }
            - { call: "POST /staff", payload: { agency_id: "${ag_id}", full_name: "Casey Manager", staff_role: "CASE_MANAGER", certifications: ["CPR"], hire_date: "2025-01-15" }, as: AgencyAdmin, captures: { cm_id: $.data.id } }
            - { call: "POST /staff", payload: { agency_id: "${ag_id}", full_name: "Quinn Qidp", staff_role: "QIDP", certifications: ["CPR"], hire_date: "2025-01-15" }, as: AgencyAdmin, captures: { q_id: $.data.id } }
            - { call: "POST /staff", payload: { agency_id: "${ag_id}", full_name: "Dee Spone", staff_role: "DSP", certifications: ["MED_CERT", "CPR"], hire_date: "2025-02-01" }, as: AgencyAdmin, captures: { d1_id: $.data.id } }
            - { call: "POST /individuals", payload: { agency_id: "${ag_id}", legal_name: "Ind One", medicaid_id: "MCD-001", date_of_birth: "1990-01-01", mobility_level: "AMBULATORY" }, as: CaseManager, as_user_id: "${cm_id}", captures: { ind_id: $.data.id, ind_v0: $.data.version } }
            - { call: "POST /individuals/${ind_id}/enroll", payload: {}, as: QIDP, as_user_id: "${q_id}", captures: { ind_v: $.data.version } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: AgencyAdmin }
            - { call: "POST /isps", payload: { individual_id: "${ind_id}", plan_year_start: "2026-01-01", plan_year_end: "2026-12-31", goals_summary: "Community integration goals", expected_individual_version: "${ind_v}" }, as: CaseManager, as_user_id: "${cm_id}", captures: { isp_id: $.data.id } }
            - { call: "POST /isps/${isp_id}/submit-review", payload: {}, as: CaseManager, as_user_id: "${cm_id}" }
            - { call: "POST /isps/${isp_id}/approve", payload: {}, as: QIDP, as_user_id: "${q_id}" }
            - { call: "POST /isps/${isp_id}/activate", payload: {}, as: QIDP, as_user_id: "${q_id}" }
            - { call: "POST /authorizations", payload: { individual_id: "${ind_id}", isp_id: "${isp_id}", service_code: "DAY_PROG", unit_type: "FIFTEEN_MIN", authorized_units: 24, rate_cents: 1500, span_start: "2026-01-01", span_end: "2026-12-31" }, as: CaseManager, as_user_id: "${cm_id}", captures: { auth_id: $.data.id } }
            - { call: "POST /authorizations/${auth_id}/approve", payload: {}, as: QIDP, as_user_id: "${q_id}" }
            - { call: "POST /evv-visits", payload: { individual_id: "${ind_id}", authorization_id: "${auth_id}", service_date: "2026-06-02", check_in_at: "2026-06-02T09:00:00Z", check_out_at: "2026-06-02T10:40:00Z", geo_within_radius: true }, as: DSP, as_user_id: "${d1_id}", captures: { visit_id: $.data.id, prov_units: $.data.provisional_units } }
          trigger:
            - { call: "POST /evv-visits/${visit_id}/flag-exception", payload: {}, as: QIDP, as_user_id: "${q_id}" }
            - call: "POST /evv-visits/${visit_id}/resolve-exception"
              payload: { adjusted_minutes: 75, resolution_note: "EVV device malfunction; duration verified from case notes" }
              as: QIDP
              as_user_id: "${q_id}"
              captures: { fin_units: $.data.final_units, vstatus: $.data.verification_status }
            - call: "GET /authorizations/${auth_id}"
              payload: {}
              as: Any
              captures: { consumed: $.data.consumed_units, remaining: $.data.remaining_units }
          assert:
            - "provisional_units == 7 (round_half_up(100/15) = round_half_up(6.67))"
            - "final_units == 5 (75/15 exact) after exception resolution — provisional != final on the same visit"
            - "verification_status == VERIFIED"
            - "authorization consumed_units == 5 and remaining_units == 19 (final variant, not provisional, debits the authorization)"

      - name: staffing_scheduled_vs_actual_variant_diverge
        grounds:
          - calculations.weighted_staffing_requirement
          - entities.ShiftAssignment.fields.status
          - entities.EVVVisit.fields.verification_status
        distinguishing_aspect: |
          GroupHome staffing domain: with two WHEELCHAIR residents the scheduled
          variant counts 1 SCHEDULED shift (compliant) while the actual variant
          counts 0 verified EVV attendances (non-compliant) — plan vs reality
          variants disagree on identical census data.
        test_recipe:
          setup:
            - "Home (4 beds) with two ENROLLED WHEELCHAIR residents moved in 2026-06-01 (weighted census 4); one DAY shift 2026-06-02 07:00-15:00 SCHEDULED for DSP D1; clock 2026-06-01"
          setup_api_calls:
            - { call: "POST /agencies", payload: { name: "Agency A" }, as: AgencyAdmin, captures: { ag_id: $.data.id } }
            - { call: "POST /homes", payload: { agency_id: "${ag_id}", name: "Home A", license_number: "LIC-1", certified_bed_count: 4 }, as: AgencyAdmin, captures: { hm_id: $.data.id } }
            - { call: "POST /staff", payload: { agency_id: "${ag_id}", full_name: "Casey Manager", staff_role: "CASE_MANAGER", certifications: ["CPR"], hire_date: "2025-01-15" }, as: AgencyAdmin, captures: { cm_id: $.data.id } }
            - { call: "POST /staff", payload: { agency_id: "${ag_id}", full_name: "Quinn Qidp", staff_role: "QIDP", certifications: ["CPR"], hire_date: "2025-01-15" }, as: AgencyAdmin, captures: { q_id: $.data.id } }
            - { call: "POST /staff", payload: { agency_id: "${ag_id}", full_name: "Dee Spone", staff_role: "DSP", certifications: ["MED_CERT", "CPR"], hire_date: "2025-02-01" }, as: AgencyAdmin, captures: { d1_id: $.data.id } }
            - { call: "POST /individuals", payload: { agency_id: "${ag_id}", legal_name: "Res One", medicaid_id: "MCD-101", date_of_birth: "1990-01-01", mobility_level: "WHEELCHAIR" }, as: CaseManager, as_user_id: "${cm_id}", captures: { r1_id: $.data.id } }
            - { call: "POST /individuals/${r1_id}/enroll", payload: {}, as: QIDP, as_user_id: "${q_id}" }
            - { call: "POST /individuals", payload: { agency_id: "${ag_id}", legal_name: "Res Two", medicaid_id: "MCD-102", date_of_birth: "1991-02-02", mobility_level: "WHEELCHAIR" }, as: CaseManager, as_user_id: "${cm_id}", captures: { r2_id: $.data.id } }
            - { call: "POST /individuals/${r2_id}/enroll", payload: {}, as: QIDP, as_user_id: "${q_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: AgencyAdmin }
            - { call: "POST /bed-assignments", payload: { home_id: "${hm_id}", bed_label: "R1", individual_id: "${r1_id}", move_in_date: "2026-06-01" }, as: CaseManager, as_user_id: "${cm_id}", captures: { ba1_id: $.data.id } }
            - { call: "POST /bed-assignments/${ba1_id}/move-in", payload: {}, as: QIDP, as_user_id: "${q_id}" }
            - { call: "POST /bed-assignments", payload: { home_id: "${hm_id}", bed_label: "R2", individual_id: "${r2_id}", move_in_date: "2026-06-01" }, as: CaseManager, as_user_id: "${cm_id}", captures: { ba2_id: $.data.id } }
            - { call: "POST /bed-assignments/${ba2_id}/move-in", payload: {}, as: QIDP, as_user_id: "${q_id}" }
            - { call: "POST /shifts", payload: { home_id: "${hm_id}", staff_member_id: "${d1_id}", window_start: "2026-06-02T07:00:00Z", window_end: "2026-06-02T15:00:00Z", shift_type: "DAY" }, as: AgencyAdmin, captures: { sh_id: $.data.id } }
          trigger:
            - call: "GET /homes/${hm_id}/staffing-check"
              payload: { shift_date: "2026-06-02", shift_type: "DAY" }
              as: Any
              captures: { req: $.data.required_dsps, sch: $.data.scheduled_dsps, act: $.data.actual_dsps, c_sch: $.data.compliant_scheduled, c_act: $.data.compliant_actual }
          assert:
            - "weighted_census == 4 (two WHEELCHAIR residents at weight 2)"
            - "required_dsps == 1 (ceil(4/4))"
            - "scheduled_dsps == 1 and compliant_scheduled == true (1 >= 1)"
            - "actual_dsps == 0 and compliant_actual == false — the two staffing variants disagree on the same census"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (3 instances, modes a, b, c)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: staffing_weighted_ceiling_multi_input
        grounds:
          - calculations.weighted_staffing_requirement
          - entities.Individual.fields.mobility_level
          - entities.ProviderAgency.fields.day_staff_ratio
        distinguishing_aspect: |
          Mode (a): >= 3 inputs (resident mobility weights, day/night ratio tier,
          census count) with non-linear interaction — ceil() over a weighted sum
          whose ratio switches on shift_type. 6 weighted residents need 2 DAY DSPs
          but only 1 NIGHT DSP.
        test_recipe:
          setup:
            - "Home (4 beds) with 4 ENROLLED residents moved in 2026-06-01: two WHEELCHAIR (weight 2 each), one AMBULATORY (1), one ASSIST (1) -> weighted census 6; no shifts; clock 2026-06-01"
          setup_api_calls:
            - { call: "POST /agencies", payload: { name: "Agency A" }, as: AgencyAdmin, captures: { ag_id: $.data.id } }
            - { call: "POST /homes", payload: { agency_id: "${ag_id}", name: "Home A", license_number: "LIC-1", certified_bed_count: 4 }, as: AgencyAdmin, captures: { hm_id: $.data.id } }
            - { call: "POST /staff", payload: { agency_id: "${ag_id}", full_name: "Casey Manager", staff_role: "CASE_MANAGER", certifications: ["CPR"], hire_date: "2025-01-15" }, as: AgencyAdmin, captures: { cm_id: $.data.id } }
            - { call: "POST /staff", payload: { agency_id: "${ag_id}", full_name: "Quinn Qidp", staff_role: "QIDP", certifications: ["CPR"], hire_date: "2025-01-15" }, as: AgencyAdmin, captures: { q_id: $.data.id } }
            - { call: "POST /individuals", payload: { agency_id: "${ag_id}", legal_name: "Res WC1", medicaid_id: "MCD-201", date_of_birth: "1990-01-01", mobility_level: "WHEELCHAIR" }, as: CaseManager, as_user_id: "${cm_id}", captures: { r1_id: $.data.id } }
            - { call: "POST /individuals/${r1_id}/enroll", payload: {}, as: QIDP, as_user_id: "${q_id}" }
            - { call: "POST /individuals", payload: { agency_id: "${ag_id}", legal_name: "Res WC2", medicaid_id: "MCD-202", date_of_birth: "1990-01-02", mobility_level: "WHEELCHAIR" }, as: CaseManager, as_user_id: "${cm_id}", captures: { r2_id: $.data.id } }
            - { call: "POST /individuals/${r2_id}/enroll", payload: {}, as: QIDP, as_user_id: "${q_id}" }
            - { call: "POST /individuals", payload: { agency_id: "${ag_id}", legal_name: "Res AMB", medicaid_id: "MCD-203", date_of_birth: "1990-01-03", mobility_level: "AMBULATORY" }, as: CaseManager, as_user_id: "${cm_id}", captures: { r3_id: $.data.id } }
            - { call: "POST /individuals/${r3_id}/enroll", payload: {}, as: QIDP, as_user_id: "${q_id}" }
            - { call: "POST /individuals", payload: { agency_id: "${ag_id}", legal_name: "Res AST", medicaid_id: "MCD-204", date_of_birth: "1990-01-04", mobility_level: "ASSIST" }, as: CaseManager, as_user_id: "${cm_id}", captures: { r4_id: $.data.id } }
            - { call: "POST /individuals/${r4_id}/enroll", payload: {}, as: QIDP, as_user_id: "${q_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: AgencyAdmin }
            - { call: "POST /bed-assignments", payload: { home_id: "${hm_id}", bed_label: "B1", individual_id: "${r1_id}", move_in_date: "2026-06-01" }, as: CaseManager, as_user_id: "${cm_id}", captures: { ba1_id: $.data.id } }
            - { call: "POST /bed-assignments/${ba1_id}/move-in", payload: {}, as: QIDP, as_user_id: "${q_id}" }
            - { call: "POST /bed-assignments", payload: { home_id: "${hm_id}", bed_label: "B2", individual_id: "${r2_id}", move_in_date: "2026-06-01" }, as: CaseManager, as_user_id: "${cm_id}", captures: { ba2_id: $.data.id } }
            - { call: "POST /bed-assignments/${ba2_id}/move-in", payload: {}, as: QIDP, as_user_id: "${q_id}" }
            - { call: "POST /bed-assignments", payload: { home_id: "${hm_id}", bed_label: "B3", individual_id: "${r3_id}", move_in_date: "2026-06-01" }, as: CaseManager, as_user_id: "${cm_id}", captures: { ba3_id: $.data.id } }
            - { call: "POST /bed-assignments/${ba3_id}/move-in", payload: {}, as: QIDP, as_user_id: "${q_id}" }
            - { call: "POST /bed-assignments", payload: { home_id: "${hm_id}", bed_label: "B4", individual_id: "${r4_id}", move_in_date: "2026-06-01" }, as: CaseManager, as_user_id: "${cm_id}", captures: { ba4_id: $.data.id } }
            - { call: "POST /bed-assignments/${ba4_id}/move-in", payload: {}, as: QIDP, as_user_id: "${q_id}" }
          trigger:
            - call: "GET /homes/${hm_id}/staffing-check"
              payload: { shift_date: "2026-06-02", shift_type: "DAY" }
              as: Any
              captures: { wc_d: $.data.weighted_census, req_d: $.data.required_dsps }
            - call: "GET /homes/${hm_id}/staffing-check"
              payload: { shift_date: "2026-06-02", shift_type: "NIGHT" }
              as: Any
              captures: { req_n: $.data.required_dsps }
          assert:
            - "weighted_census == 6 (2+2+1+1)"
            - "DAY required_dsps == 2 (ceil(6/4))"
            - "NIGHT required_dsps == 1 (ceil(6/8)) — the ratio tier switch on shift_type changes the result non-linearly"

      - name: per_visit_rounding_then_sum_pinned
        grounds:
          - calculations.billable_unit_calculation
          - calculations.claim_amount_aggregation
          - entities.BillingClaim.fields.total_units
        distinguishing_aspect: |
          Mode (b): nested rounding order pinned — per-visit round_half_up then sum.
          Two 8-minute visits yield max(1, round(0.53)) = 1 unit each = 2 units /
          3000 cents; the forbidden sum-then-round order yields round(16/15) = 1
          unit / 1500 cents. The scaffold pins per-visit-first.
        test_recipe:
          setup:
            - "Individual ENROLLED, ISP ACTIVE, DAY_PROG authorization ACTIVE (24 units, 1500 cents/unit); DSP D1; clock 2026-06-01"
            - "Two EVV visits on 2026-06-02 (09:00-09:08 and 10:00-10:08, 8 minutes each), both VERIFIED"
          setup_api_calls:
            - { call: "POST /agencies", payload: { name: "Agency A" }, as: AgencyAdmin, captures: { ag_id: $.data.id } }
            - { call: "POST /staff", payload: { agency_id: "${ag_id}", full_name: "Casey Manager", staff_role: "CASE_MANAGER", certifications: ["CPR"], hire_date: "2025-01-15" }, as: AgencyAdmin, captures: { cm_id: $.data.id } }
            - { call: "POST /staff", payload: { agency_id: "${ag_id}", full_name: "Quinn Qidp", staff_role: "QIDP", certifications: ["CPR"], hire_date: "2025-01-15" }, as: AgencyAdmin, captures: { q_id: $.data.id } }
            - { call: "POST /staff", payload: { agency_id: "${ag_id}", full_name: "Dee Spone", staff_role: "DSP", certifications: ["MED_CERT", "CPR"], hire_date: "2025-02-01" }, as: AgencyAdmin, captures: { d1_id: $.data.id } }
            - { call: "POST /individuals", payload: { agency_id: "${ag_id}", legal_name: "Ind One", medicaid_id: "MCD-001", date_of_birth: "1990-01-01", mobility_level: "AMBULATORY" }, as: CaseManager, as_user_id: "${cm_id}", captures: { ind_id: $.data.id } }
            - { call: "POST /individuals/${ind_id}/enroll", payload: {}, as: QIDP, as_user_id: "${q_id}", captures: { ind_v: $.data.version } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: AgencyAdmin }
            - { call: "POST /isps", payload: { individual_id: "${ind_id}", plan_year_start: "2026-01-01", plan_year_end: "2026-12-31", goals_summary: "Community integration goals", expected_individual_version: "${ind_v}" }, as: CaseManager, as_user_id: "${cm_id}", captures: { isp_id: $.data.id } }
            - { call: "POST /isps/${isp_id}/submit-review", payload: {}, as: CaseManager, as_user_id: "${cm_id}" }
            - { call: "POST /isps/${isp_id}/approve", payload: {}, as: QIDP, as_user_id: "${q_id}" }
            - { call: "POST /isps/${isp_id}/activate", payload: {}, as: QIDP, as_user_id: "${q_id}" }
            - { call: "POST /authorizations", payload: { individual_id: "${ind_id}", isp_id: "${isp_id}", service_code: "DAY_PROG", unit_type: "FIFTEEN_MIN", authorized_units: 24, rate_cents: 1500, span_start: "2026-01-01", span_end: "2026-12-31" }, as: CaseManager, as_user_id: "${cm_id}", captures: { auth_id: $.data.id } }
            - { call: "POST /authorizations/${auth_id}/approve", payload: {}, as: QIDP, as_user_id: "${q_id}" }
            - { call: "POST /evv-visits", payload: { individual_id: "${ind_id}", authorization_id: "${auth_id}", service_date: "2026-06-02", check_in_at: "2026-06-02T09:00:00Z", check_out_at: "2026-06-02T09:08:00Z", geo_within_radius: true }, as: DSP, as_user_id: "${d1_id}", captures: { v1_id: $.data.id } }
            - { call: "POST /evv-visits", payload: { individual_id: "${ind_id}", authorization_id: "${auth_id}", service_date: "2026-06-02", check_in_at: "2026-06-02T10:00:00Z", check_out_at: "2026-06-02T10:08:00Z", geo_within_radius: true }, as: DSP, as_user_id: "${d1_id}", captures: { v2_id: $.data.id } }
            - { call: "POST /evv-visits/${v1_id}/verify", payload: {}, as: QIDP, as_user_id: "${q_id}" }
            - { call: "POST /evv-visits/${v2_id}/verify", payload: {}, as: QIDP, as_user_id: "${q_id}" }
          trigger:
            - call: "POST /claims"
              payload: { individual_id: "${ind_id}", service_period_start: "2026-06-02", service_period_end: "2026-06-02" }
              as: BillingSpecialist
              captures: { claim_id: $.data.id, tu: $.data.total_units, ta: $.data.total_amount_cents }
          assert:
            - "claim.total_units == 2 (1 unit per 8-minute visit, rounded per visit then summed)"
            - "claim.total_amount_cents == 3000 (2 units * 1500 cents)"
            - "sum-then-round would produce 1 unit / 1500 cents — the pinned per-visit-first order is what the implementation must reproduce"

      - name: recoupment_netting_order_pinned
        grounds:
          - calculations.recoupment_netting
          - entities.ProviderAgency.fields.recoupment_balance_cents
          - entities.BillingClaim.fields.posted_net_cents
        distinguishing_aspect: |
          Mode (c): circular-looking dependency (net depends on recoupment which
          depends on gross) resolved by a pinned evaluation order: gross -> recoup
          = min(floor(gross*0.10), PRE-payment balance) -> net = gross - recoup.
          A 30000-cent claim against a 30000-cent balance posts net 27000.
        test_recipe:
          setup:
            - "Individual ENROLLED, ISP ACTIVE, DAY_PROG authorization ACTIVE (60 units, 1500 cents/unit); clock 2026-06-01"
            - "Claim1: two verified 150-minute visits on 2026-06-02 (10 units each, 20 units, 30000 cents); submitted by bill-1; paid in full by bill-2 (net 30000); then VOIDED -> cash back to 0 and recoupment_balance_cents == 30000"
