        grounds:
          - state_machines.InfusionOrder.PENDING_AUTH_to_RELEASED
          - state_machines.PriorAuthorization.SUBMITTED_to_APPROVED
          - validations[priority=9]
        distinguishing_aspect: |
          Entity pair InfusionOrder -> PriorAuthorization: the order's PENDING_AUTH -> RELEASED transition is
          driven only by the linked PriorAuthorization reaching APPROVED; a SUBMITTED auth leaves the order
          stuck in PENDING_AUTH.
