        distinguishing_aspect: "Drift uses strict >: at quarter Q1 the US_EQUITY and CASH classes sit exactly at their 500bps bands (actuals 5500/1500 vs targets 5000/2000) and stay IN_BAND; at Q2 they cross to 5600/1400 and breach, while FIXED_INCOME pinned at target stays IN_BAND throughout."
