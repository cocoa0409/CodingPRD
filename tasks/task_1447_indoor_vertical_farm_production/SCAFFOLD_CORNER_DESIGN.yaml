        payload:
          expected_crop_version: ${c_v2}
        as: Grower
        captures:
          r2_status: $.data.recipe_status
      - call: GET /farm/recipes/${r1}
        as: Grower
        captures:
          r1_after: $.data.recipe_status
      assert:
      - R1 activation succeeds (recipe_status == ACTIVE); Crop.version advances 1 -> 2
      - R2 activation carrying the stale version (1) -> error_id == ERR_STALE_VERSION (412)
      - R2 activation with the fresh version succeeds; R1 is superseded to RETIRED; Crop.version == 3
