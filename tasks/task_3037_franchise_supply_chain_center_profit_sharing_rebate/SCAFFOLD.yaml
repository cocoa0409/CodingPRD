errors:
  - id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http: 400
    condition: "X-User-ID or X-User-Role header is missing or malformed"

  - id: ERR_FORBIDDEN_FOR_ROLE
    http: 403
    condition: "Caller role is valid but not allowed for this endpoint"

  - id: ERR_CENTER_NOT_FOUND
    http: 404
    condition: "SupplyCenter with given ID does not exist"

  - id: ERR_STORE_NOT_FOUND
    http: 404
    condition: "Store with given ID does not exist in this center"

  - id: ERR_PRODUCT_NOT_FOUND
    http: 404
    condition: "Product with given ID does not exist in this center"

  - id: ERR_ORDER_NOT_FOUND
    http: 404
    condition: "PurchaseOrder with given ID does not exist"

  - id: ERR_ROUTE_NOT_FOUND
    http: 404
    condition: "DeliveryRoute with given ID does not exist"

  - id: ERR_PROMOTION_NOT_FOUND
    http: 404
    condition: "PromotionEvent with given ID does not exist"

  - id: ERR_POOL_NOT_FOUND
    http: 404
    condition: "RebatePool with given ID does not exist"

  - id: ERR_LEDGER_NOT_FOUND
    http: 404
    condition: "RebateLedger with given ID does not exist"

  - id: ERR_AGREEMENT_NOT_FOUND
    http: 404
    condition: "ComplianceAgreement with given ID does not exist"

  - id: ERR_PLAN_NOT_FOUND
    http: 404
    condition: "CapacityPlan with given ID does not exist"

  - id: ERR_VARIANCE_NOT_FOUND
    http: 404
    condition: "FoodCostVariance with given ID does not exist"

  - id: ERR_CENTER_NOT_ACTIVE
    http: 409
    condition: "SupplyCenter is not ACTIVE or SURGE_MODE"

  - id: ERR_STORE_NOT_ACTIVE
    http: 409
    condition: "Store is not ACTIVE"

  - id: ERR_INVALID_STATE_TRANSITION
    http: 409
    condition: "Resource is in wrong state for requested operation"

  - id: ERR_PRODUCT_UNAVAILABLE
    http: 409
    condition: "Product is DISCONTINUED or RECALLED"

  - id: ERR_CAPACITY_EXCEEDED
    http: 409
    condition: "Weekly capacity plan has insufficient available units"

  - id: ERR_ROUTE_OVERLOADED
    http: 409
    condition: "Route load exceeds truck capacity"

  - id: ERR_CREDIT_LIMIT_EXCEEDED
    http: 409
    condition: "Order total exceeds store credit limit minus outstanding balance"

  - id: ERR_PRICE_BOOK_OVERLAP
    http: 409
    condition: "Price book effective window overlaps with existing ACTIVE book"

  - id: ERR_PROMOTION_OVERLAP
    http: 409
    condition: "Promotion dates overlap with existing CONFIRMED/EXECUTING promotion"

  - id: ERR_INVALID_DATE_RANGE
    http: 400
    condition: "effective_from >= effective_until or start_date >= end_date"

  - id: ERR_COMPLIANCE_REQUIRED
    http: 409
    condition: "Store lacks ACTIVE compliance agreement for rebate accrual"

  - id: ERR_POOL_INSUFFICIENT
    http: 409
    condition: "Rebate pool balance insufficient for settlement"

  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_*_version does not match current resource version"

  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body, missing required fields, invalid enum values, or constraint violation"

  - id: ERR_STORE_HAS_ACTIVE_ORDERS
    http: 409
    condition: "Cannot terminate store with non-terminal purchase orders"

  - id: ERR_CENTER_HAS_ACTIVE_STORES
    http: 409
    condition: "Cannot decommission center with ACTIVE stores"

  - id: ERR_NO_ROUTE_AVAILABLE
    http: 409
    condition: "No PLANNED route covers this store for the order week"

  - id: ERR_ORDER_HAS_NO_LINES
    http: 409
    condition: "Cannot submit purchase order with zero lines"

  - id: ERR_PROMOTION_HAS_COMMITTED_ORDERS
    http: 409
    condition: "Cannot cancel promotion with CONFIRMED or later purchase orders"

  - id: ERR_REBATE_ALREADY_SETTLED
    http: 409
    condition: "Rebate ledger entry is already SETTLED"

  - id: ERR_CAPACITY_PLAN_LOCKED
    http: 409
    condition: "Capacity plan is LOCKED; modifications blocked"

roles:
  - name: SupplyChainAdmin
    description: "Corporate supply chain administrator: manages centers, products, pricing, promotions, rebates, compliance, and capacity"
    identity: opaque
    exclusive_operations:
      - "POST /supply-centers — Create center"
      - "POST .../activate — Activate center"
      - "POST .../suspend — Suspend center"
      - "POST .../decommission — Decommission center"
      - "POST .../run_ops — Run ops checkpoint"
      - "POST .../products — Create product"
      - "POST .../products/{id}/discontinue — Discontinue product"
      - "POST .../products/{id}/recall — Recall product"
      - "POST .../price-books — Create price book"
      - "POST .../promotions — Create promotion"
      - "POST .../promotions/{id}/confirm — Confirm promotion"
      - "POST .../promotions/{id}/close — Close promotion"
      - "POST .../promotions/{id}/cancel — Cancel promotion"
      - "POST .../rebate-pools — Create rebate pool"
      - "POST .../rebate-pools/{id}/calculate — Calculate pool"
      - "POST .../rebate-pools/{id}/settle — Settle pool"
      - "POST .../rebate-ledgers/{id}/void — Void ledger entry"
      - "POST .../capacity-plans — Create capacity plan"
      - "POST .../capacity-plans/{id}/lock — Lock capacity plan"
      - "POST .../stores — Create store"
      - "POST .../stores/{id}/activate — Activate store"
      - "POST .../stores/{id}/suspend — Suspend store"
      - "POST .../stores/{id}/terminate — Terminate store"
      - "POST .../compliance-agreements — Create agreement"
      - "POST .../compliance-agreements/{id}/activate — Activate agreement"
      - "POST .../compliance-agreements/{id}/cure — Cure agreement"
      - "POST .../compliance-agreements/{id}/terminate — Terminate agreement"
      - "POST .../purchase-orders/{id}/confirm — Confirm PO"
      - "POST .../purchase-orders/{id}/reject — Reject PO"
      - "POST .../purchase-orders/{id}/settle — Settle PO"
      - "POST .../food-cost-variances — Create variance analysis"
    shared_operations:
      - "GET /supply-centers/{id} — Read center"
      - "GET .../stores/{id} — Read store"
      - "GET .../products/{id} — Read product"
      - "GET .../price-books/{id} — Read price book"
      - "GET .../routes/{id} — Read route"
      - "GET .../purchase-orders/{id} — Read PO"
      - "GET .../promotions/{id} — Read promotion"
      - "GET .../rebate-pools/{id} — Read pool"
      - "GET .../rebate-ledgers/{id} — Read ledger"
      - "GET .../compliance-agreements/{id} — Read agreement"
      - "GET .../capacity-plans/{id} — Read capacity plan"
      - "GET .../food-cost-variances/{id} — Read variance"

  - name: StoreManager
    description: "Franchise store manager: creates and submits purchase orders, reports compliance"
    identity: "entity_backed:Store"
    exclusive_operations:
      - "POST .../purchase-orders — Create draft PO"
      - "POST .../purchase-orders/{id}/lines — Add order line"
      - "POST .../purchase-orders/{id}/submit — Submit PO"
      - "POST .../purchase-orders/{id}/cancel — Cancel PO"
      - "POST .../compliance-reports — Submit compliance report"
    shared_operations:
      - "GET .../stores/{id} — Read own store"
      - "GET .../purchase-orders/{id} — Read own POs"
      - "GET .../products — List products"
      - "GET .../price-books — List price books"
      - "GET .../promotions — List promotions"
      - "GET .../rebate-ledgers — Read own rebate entries"
      - "GET .../food-cost-variances — Read own variances"

  - name: RouteCoordinator
    description: "Logistics coordinator: manages delivery routes, dispatches trucks, records deliveries"
    identity: opaque
    exclusive_operations:
      - "POST .../routes — Create route"
      - "POST .../routes/{id}/dispatch — Dispatch route"
      - "POST .../routes/{id}/cancel — Cancel route"
      - "POST .../stops/{id}/arrive — Mark stop arrived"
      - "POST .../stops/{id}/complete — Complete stop"
      - "POST .../stops/{id}/skip — Skip stop"
      - "POST .../purchase-orders/{id}/load — Load PO"
      - "POST .../purchase-orders/{id}/deliver — Deliver PO"
      - "POST .../lines/{id}/mark-shorted — Mark line shorted"
    shared_operations:
      - "GET .../routes — List routes"
      - "GET .../stops — List stops"
      - "GET .../purchase-orders — List POs"
      - "GET .../stores — List stores"

  - name: Any
    description: "Shared read access for all authenticated roles"
    identity: opaque
    shared_operations:
      - "GET /supply-centers/{id} — Read center"
      - "GET .../stores/{id} — Read store"
      - "GET .../stores — List stores"
      - "GET .../products/{id} — Read product"
      - "GET .../products — List products"
      - "GET .../price-books/{id} — Read price book"
      - "GET .../price-books — List price books"
      - "GET .../routes/{id} — Read route"
      - "GET .../routes — List routes"
      - "GET .../stops/{id} — Read stop"
      - "GET .../stops — List stops"
      - "GET .../purchase-orders/{id} — Read PO"
      - "GET .../purchase-orders — List POs"
      - "GET .../purchase-orders/{id}/lines — List order lines"
      - "GET .../promotions/{id} — Read promotion"
      - "GET .../promotions — List promotions"
      - "GET .../rebate-pools/{id} — Read pool"
      - "GET .../rebate-pools — List pools"
      - "GET .../rebate-ledgers/{id} — Read ledger"
      - "GET .../rebate-ledgers — List ledgers"
      - "GET .../compliance-agreements/{id} — Read agreement"
      - "GET .../compliance-agreements — List agreements"
      - "GET .../capacity-plans/{id} — Read capacity plan"
      - "GET .../capacity-plans — List capacity plans"
      - "GET .../food-cost-variances/{id} — Read variance"
      - "GET .../food-cost-variances — List variances"
