          assert:
            - "Trigger step 1 returns HTTP 422 with error_id == ERR_CLOCK_REWIND"
            - "Trigger step 2 returns HTTP 200 — setting the clock to its current value is allowed"
            - "Trigger step 3 returns HTTP 200"
            - "Trigger step 4 returns HTTP 422 with error_id == ERR_CLOCK_REWIND, and a student created afterwards still records created_at at clock date 2026-09-05"

      - name: the_validation_ladder_rejects_on_its_lowest_numbered_applicable_rule
        claim_type: priority_ordering
        grounds:
          - validations[priority=2]
          - validations[priority=3]
          - validations[priority=6]
          - validations[priority=9]
          - errors.ERR_UNAUTHORIZED
          - errors.ERR_INVALID_REQUEST
          - errors.ERR_OFFICIAL_LEVEL_MISMATCH
          - errors.ERR_CERTIFICATION_NOT_FOUND
        distinguishing_aspect: "Four requests each break two rules at once and always surface the lower priority number: role-not-allowed plus a malformed body gives ERR_UNAUTHORIZED (2 before 3), a missing required field plus an unknown student_id gives ERR_INVALID_REQUEST (3 before 9), a level-mismatched identity plus a duplicate student_number gives ERR_OFFICIAL_LEVEL_MISMATCH (6 before 26), and an unknown certification_id plus a stale expected_certification_version gives ERR_CERTIFICATION_NOT_FOUND (9 before 10)."
        test_recipe:
          setup:
            - "Clock 2026-08-01. One SCO official, one SUPERVISORY official, program BSN-UG, term FA2026, student V-1001 and one DRAFT certification (whose version is captured so a deliberately stale value can be sent) exist so that each trigger can violate exactly two rules."
