# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2752 — Address Point & Emergency Response Geographic Data Management
#
# 25 instances across the nine §0.5 Difficulty Rules (minimum 2 each, 18 total).
# Every numeric literal in an `assert:` line was computed by executing the
# corresponding calculations[].formula with its declared constants.
# Logical clock startup default: 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  # RULE 1 — dual_variant_calc (3 instances, three different entity domains:
  #          QcValidationReport, AddressPoint, Jurisdiction/CoverageCell)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: qc_strict_vs_advisory_quality_score_diverge
        grounds:
          - calculations.qc_quality_score
          - calculations.qc_defect_scan
          - entities.QcValidationReport.fields.quality_score
          - entities.QcValidationReport.fields.advisory_quality_score
          - entities.QcValidationReport.fields.quality_tier
        distinguishing_aspect: |
          On ONE QcValidationReport the strict_certification variant (all OPEN defects deduct)
          yields quality_score 77.06 while the advisory_snapshot variant (BLOCKING only) yields
          81.26 — a 4.20 spread on the same eight defect rows, and the tier C is read from the
          strict number alone.
        test_recipe:
          setup:
            - "Jurisdiction LARCO with postal_city FORT COLLINS."
            - "Exactly one CoverageCell C001 and NO EmergencyServiceBoundary anywhere, so all three (C001, service_type) pairs are uncovered."
            - "One DRAFT RoadCenterline whose primary_name 'N Maple St' differs from normalized_name 'N MAPLE STREET' and whose qc_dirty is true."
            - "One PENDING AddressPoint on that road: house_number 100 LEFT, source FIELD, geometry_verified false, postal_city LOVELAND (mismatched), confidence_score 71.00 so it is NOT low-confidence."
            - "Expected defect set: ADDRESS {1 BLOCKING missing geometry, 1 WARNING postal mismatch}; ROAD {1 BLOCKING unvalidated, 2 WARNING not-normalized + qc_dirty}; BOUNDARY {3 BLOCKING coverage gaps}."
          setup_api_calls:
            - call: "POST /gis/jurisdictions"
              payload: { name: "Larimer County", code: "LARCO", jurisdiction_type: "COUNTY", postal_city: "FORT COLLINS" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { j_id: $.data.id }
            - call: "POST /gis/coverage-cells"
              payload: { cell_code: "C001", jurisdiction_id: "${j_id}" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { cell_id: $.data.id }
            - call: "POST /gis/road-centerlines"
              payload: { primary_name: "N Maple St", jurisdiction_id: "${j_id}", from_addr_left: 100, to_addr_left: 198, parity_left: "EVEN", from_addr_right: 101, to_addr_right: 199, parity_right: "ODD" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { road_id: $.data.id }
            - call: "POST /gis/address-points"
              payload: { house_number: 100, road_centerline_id: "${road_id}", side: "LEFT", source: "FIELD", postal_city: "LOVELAND", cell_id: "${cell_id}" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { pt_id: $.data.id }
          trigger:
            - call: "POST /gis/qc-validation-reports"
              payload: { scope: "JURISDICTION", jurisdiction_id: "${j_id}" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { rep_id: $.data.id }
          assert:
            - "QcValidationReport.${rep_id}.defect_count == 8"
            - "QcValidationReport.${rep_id}.blocking_defect_count == 5"
            - "QcValidationReport.${rep_id}.warning_defect_count == 3"
            - "QcValidationReport.${rep_id}.info_defect_count == 0"
            - "QcValidationReport.${rep_id}.quality_score == 77.06"
            - "QcValidationReport.${rep_id}.advisory_quality_score == 81.26"
            - "QcValidationReport.${rep_id}.quality_score != QcValidationReport.${rep_id}.advisory_quality_score"
            - "QcValidationReport.${rep_id}.quality_tier == \"C\"   # read from the strict 77.06, never from the advisory 81.26"
            - "AddressPoint.${pt_id}.confidence_score == 71.00"
            - "QcValidationReport.${rep_id}.status == \"GENERATED\""

      - name: address_confidence_provisional_vs_certified_diverge
        grounds:
          - calculations.address_point_confidence_score
          - entities.AddressPoint.fields.confidence_score
          - entities.AddressPoint.fields.certified_confidence_score
          - entities.AddressPoint.fields.confidence_basis
          - state_machines.QcValidationReport.GENERATED_to_CERTIFIED
        distinguishing_aspect: |
          The SAME AddressPoint carries two different numbers at once: confidence_score stays at
          the provisional 96.00 while certified_confidence_score computed at certification is
          76.00, because only the certified variant applies OPEN_DISCREPANCY_PENALTY (-20) for
          the road's open discrepancy case; the entity domain is AddressPoint, not the report.
        test_recipe:
          setup:
            - "Jurisdiction LARCO (postal_city FORT COLLINS) with one cell C001 and no boundaries."
            - "Two ACTIVE agencies in LARCO: a LAW agency and a FIRE agency."
            - "RoadCenterline 'N MAPLE STREET' PUBLISHED (primary_name already equals normalized_name, qc_dirty false)."
            - "One ACTIVE AddressPoint: house_number 100 LEFT, source PARCEL, geometry_verified true, postal_city FORT COLLINS -> provisional confidence 96.00 (70 + 12 + 8 + 6 - 0)."
            - "An OPEN DiscrepancyCase on subject_type ROAD_NAME for that centerline, opened AFTER the point was activated, so road.open_discrepancy_case_count == 1."
            - "A ROAD-scoped QcValidationReport over that centerline with zero defects, still GENERATED."
          setup_api_calls:
            - call: "POST /gis/jurisdictions"
              payload: { name: "Larimer County", code: "LARCO", jurisdiction_type: "COUNTY", postal_city: "FORT COLLINS" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { j_id: $.data.id }
            - call: "POST /gis/coverage-cells"
              payload: { cell_code: "C001", jurisdiction_id: "${j_id}" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { cell_id: $.data.id }
            - call: "POST /gis/agencies"
              payload: { name: "Larimer County Sheriff", agency_type: "LAW", jurisdiction_id: "${j_id}" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { law_id: $.data.id }
            - call: "POST /gis/agencies"
              payload: { name: "Poudre Fire Authority", agency_type: "FIRE", jurisdiction_id: "${j_id}" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { fire_id: $.data.id }
            - call: "POST /gis/road-centerlines"
              payload: { primary_name: "N MAPLE STREET", jurisdiction_id: "${j_id}", from_addr_left: 100, to_addr_left: 198, parity_left: "EVEN", from_addr_right: 101, to_addr_right: 199, parity_right: "ODD" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { road_id: $.data.id }
            - call: "POST /gis/address-points"
              payload: { house_number: 100, road_centerline_id: "${road_id}", side: "LEFT", source: "PARCEL", postal_city: "FORT COLLINS", cell_id: "${cell_id}", geometry_verified: true }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { pt_id: $.data.id }
            - call: "POST /gis/road-centerlines/${road_id}/validate"
              payload: {}
              as: GisAnalyst
              as_user_id: "analyst-1"
            - call: "POST /gis/road-centerlines/${road_id}/publish"
              payload: {}
              as: QcCertifier
              as_user_id: "qc-1"
            - call: "POST /gis/address-points/${pt_id}/activate"
              payload: {}
              as: GisAnalyst
              as_user_id: "analyst-1"
            - call: "POST /gis/discrepancy-cases"
              payload: { subject_type: "ROAD_NAME", subject_ref_id: "${road_id}", counterparty_agency_id: "${fire_id}", description: "Sheriff dispatch signage reads N MAPLE AVE" }
              as: AgencyLiaison
              as_user_id: "${law_id}"
              captures: { case_id: $.data.id }
            - call: "POST /gis/qc-validation-reports"
              payload: { scope: "ROAD", road_centerline_id: "${road_id}" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { rep_id: $.data.id }
          trigger:
            - call: "POST /gis/qc-validation-reports/${rep_id}/certify"
              payload: {}
              as: QcCertifier
              as_user_id: "qc-1"
          assert:
            - "QcValidationReport.${rep_id}.defect_count == 0"
            - "QcValidationReport.${rep_id}.quality_score == 100.00"
            - "QcValidationReport.${rep_id}.status == \"CERTIFIED\""
            - "AddressPoint.${pt_id}.confidence_score == 96.00   # provisional variant, left untouched"
            - "AddressPoint.${pt_id}.certified_confidence_score == 76.00   # 96 + 0 full-coverage bonus - 20 open-discrepancy penalty"
            - "AddressPoint.${pt_id}.confidence_basis == \"CERTIFIED\""
            - "AddressPoint.${pt_id}.certified_confidence_score != AddressPoint.${pt_id}.confidence_score"
            - "RoadCenterline.${road_id}.open_discrepancy_case_count == 1"

      - name: jurisdiction_instantaneous_vs_forward_gap_counters_diverge
        grounds:
          - calculations.coverage_integrity_counters
          - entities.Jurisdiction.fields.gap_pair_count
          - entities.Jurisdiction.fields.forward_gap_pair_count
          - entities.CoverageCell.fields.active_assignment_count
          - state_machines.EmergencyServiceBoundary.PROPOSED_to_ACTIVE
        distinguishing_aspect: |
          With all three service types covering cell C001 at the clock instant, the instantaneous
          variant reports gap_pair_count 0 while the forward_window variant reports
          forward_gap_pair_count 1, because the LAW claim expires on 2026-08-11 inside the 30-day
          horizon; the diverging metric lives on Jurisdiction/CoverageCell, not on a report or a
          point.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Jurisdiction LARCO with exactly one CoverageCell C001."
            - "Three ACTIVE agencies: LAW, FIRE, EMS."
            - "Three ACTIVE EmergencyServiceBoundaries, one per agency, each holding exactly one ACTIVE BoundaryCellAssignment on C001."
            - "The LAW assignment window is [2026-08-01, 2026-08-11); the FIRE and EMS assignments are open-ended."
          setup_api_calls:
            - call: "POST /gis/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
            - call: "POST /gis/jurisdictions"
              payload: { name: "Larimer County", code: "LARCO", jurisdiction_type: "COUNTY", postal_city: "FORT COLLINS" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { j_id: $.data.id }
            - call: "POST /gis/coverage-cells"
              payload: { cell_code: "C001", jurisdiction_id: "${j_id}" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { cell_id: $.data.id }
            - call: "POST /gis/agencies"
              payload: { name: "Larimer County Sheriff", agency_type: "LAW", jurisdiction_id: "${j_id}" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { law_id: $.data.id }
            - call: "POST /gis/agencies"
              payload: { name: "Poudre Fire Authority", agency_type: "FIRE", jurisdiction_id: "${j_id}" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { fire_id: $.data.id }
            - call: "POST /gis/agencies"
              payload: { name: "Thompson Valley EMS", agency_type: "EMS", jurisdiction_id: "${j_id}" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { ems_id: $.data.id }
            - call: "POST /gis/emergency-service-boundaries"
              payload: { agency_id: "${law_id}", effective_start: "2026-08-01T00:00:00Z" }
              as: AgencyLiaison
              as_user_id: "${law_id}"
              captures: { b_law_id: $.data.id, b_law_v: $.data.version }
            - call: "POST /gis/emergency-service-boundaries/${b_law_id}/cell-assignments"
              payload: { cell_id: "${cell_id}", effective_start: "2026-08-01T00:00:00Z", effective_end: "2026-08-11T00:00:00Z", expected_boundary_version: "${b_law_v}" }
              as: AgencyLiaison
              as_user_id: "${law_id}"
              captures: { a_law_id: $.data.id }
            - call: "POST /gis/emergency-service-boundaries/${b_law_id}/propose"
              payload: {}
              as: AgencyLiaison
              as_user_id: "${law_id}"
            - call: "POST /gis/emergency-service-boundaries/${b_law_id}/activate"
              payload: {}
              as: AgencyLiaison
              as_user_id: "${law_id}"
            - call: "POST /gis/emergency-service-boundaries"
              payload: { agency_id: "${fire_id}", effective_start: "2026-08-01T00:00:00Z" }
              as: AgencyLiaison
              as_user_id: "${fire_id}"
              captures: { b_fire_id: $.data.id, b_fire_v: $.data.version }
            - call: "POST /gis/emergency-service-boundaries/${b_fire_id}/cell-assignments"
              payload: { cell_id: "${cell_id}", effective_start: "2026-08-01T00:00:00Z", expected_boundary_version: "${b_fire_v}" }
              as: AgencyLiaison
              as_user_id: "${fire_id}"
            - call: "POST /gis/emergency-service-boundaries/${b_fire_id}/propose"
              payload: {}
              as: AgencyLiaison
              as_user_id: "${fire_id}"
            - call: "POST /gis/emergency-service-boundaries/${b_fire_id}/activate"
              payload: {}
              as: AgencyLiaison
              as_user_id: "${fire_id}"
            - call: "POST /gis/emergency-service-boundaries"
              payload: { agency_id: "${ems_id}", effective_start: "2026-08-01T00:00:00Z" }
              as: AgencyLiaison
              as_user_id: "${ems_id}"
              captures: { b_ems_id: $.data.id, b_ems_v: $.data.version }
            - call: "POST /gis/emergency-service-boundaries/${b_ems_id}/cell-assignments"
              payload: { cell_id: "${cell_id}", effective_start: "2026-08-01T00:00:00Z", expected_boundary_version: "${b_ems_v}" }
              as: AgencyLiaison
              as_user_id: "${ems_id}"
            - call: "POST /gis/emergency-service-boundaries/${b_ems_id}/propose"
              payload: {}
              as: AgencyLiaison
              as_user_id: "${ems_id}"
          trigger:
            - call: "POST /gis/emergency-service-boundaries/${b_ems_id}/activate"
              payload: {}
              as: AgencyLiaison
              as_user_id: "${ems_id}"
            - call: "GET /gis/jurisdictions/${j_id}"
              payload: {}
              as: SystemAdmin
              as_user_id: "sysadmin-1"
            - call: "GET /gis/coverage-cells/${cell_id}/coverage-status"
              payload: {}
              as: SystemAdmin
              as_user_id: "sysadmin-1"
          assert:
            - "Jurisdiction.${j_id}.gap_pair_count == 0   # instantaneous variant: all three types cover 2026-08-01"
            - "Jurisdiction.${j_id}.forward_gap_pair_count == 1   # forward_window variant: LAW uncovered on [2026-08-11, 2026-08-31)"
            - "Jurisdiction.${j_id}.gap_pair_count != Jurisdiction.${j_id}.forward_gap_pair_count"
            - "Jurisdiction.${j_id}.covered_cell_count == 1"
            - "Jurisdiction.${j_id}.cell_count == 1"
            - "CoverageCell.${cell_id}.active_assignment_count == 3"
            - "GET /gis/coverage-cells/${cell_id}/coverage-status data.covered_service_types == [\"LAW\", \"FIRE\", \"EMS\"]"
            - "GET /gis/coverage-cells/${cell_id}/coverage-status data.gap_service_types == []"
            - "GET /gis/coverage-cells/${cell_id}/coverage-status data.forward_gap_service_types == [\"LAW\"]"
            - "GET /gis/coverage-cells/${cell_id}/coverage-status data.responding_assignment_count == 3"
            - "BoundaryCellAssignment.${a_law_id}.status == \"ACTIVE\""

  # ===========================================================================
  # RULE 2 — combinatorial_formula (3 instances, three different §0.5 modes:
  #          (b) nested rounding order, (c) pinned evaluation order,
  #          (a) >=3 inputs with non-linear clamp interaction)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: qc_quality_score_per_category_rounding_order
        grounds:
          - calculations.qc_quality_score
          - calculations.qc_defect_scan
          - entities.QcValidationReport.fields.quality_score
        distinguishing_aspect: |
          Mode (b) — nested rounding order: ADDRESS weights to 44.325 and BOUNDARY to 21.875, so
          rounding per category BEFORE summing gives 44.33 + 30.00 + 21.88 = 96.21 while summing
          first gives round(96.200, 2) = 96.20; the implementation must land on 96.21.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Jurisdiction LARCO (postal_city FORT COLLINS) with exactly one CoverageCell C001."
            - "A LAW agency and a FIRE agency, each with one ACTIVE open-ended boundary claiming C001; NO EMS agency, so exactly one (C001, EMS) gap pair exists -> exactly one BOUNDARY BLOCKING defect."
            - "One VALIDATED RoadCenterline 'N MAPLE STREET' (primary_name == normalized_name, qc_dirty false) carrying one PENDING AddressPoint."
            - "That point is POSTAL-sourced, geometry_verified true, postal_city FORT COLLINS -> confidence 66.00 < 70 -> exactly one ADDRESS INFO defect and nothing else."
          setup_api_calls:
            - call: "POST /gis/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
            - call: "POST /gis/jurisdictions"
              payload: { name: "Larimer County", code: "LARCO", jurisdiction_type: "COUNTY", postal_city: "FORT COLLINS" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { j_id: $.data.id }
            - call: "POST /gis/coverage-cells"
              payload: { cell_code: "C001", jurisdiction_id: "${j_id}" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { cell_id: $.data.id }
            - call: "POST /gis/agencies"
              payload: { name: "Larimer County Sheriff", agency_type: "LAW", jurisdiction_id: "${j_id}" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { law_id: $.data.id }
            - call: "POST /gis/agencies"
              payload: { name: "Poudre Fire Authority", agency_type: "FIRE", jurisdiction_id: "${j_id}" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { fire_id: $.data.id }
            - call: "POST /gis/emergency-service-boundaries"
              payload: { agency_id: "${law_id}", effective_start: "2026-08-01T00:00:00Z" }
              as: AgencyLiaison
              as_user_id: "${law_id}"
              captures: { b_law_id: $.data.id, b_law_v: $.data.version }
            - call: "POST /gis/emergency-service-boundaries/${b_law_id}/cell-assignments"
              payload: { cell_id: "${cell_id}", effective_start: "2026-08-01T00:00:00Z", expected_boundary_version: "${b_law_v}" }
              as: AgencyLiaison
              as_user_id: "${law_id}"
            - call: "POST /gis/emergency-service-boundaries/${b_law_id}/propose"
              payload: {}
              as: AgencyLiaison
              as_user_id: "${law_id}"
            - call: "POST /gis/emergency-service-boundaries/${b_law_id}/activate"
              payload: {}
              as: AgencyLiaison
              as_user_id: "${law_id}"
            - call: "POST /gis/emergency-service-boundaries"
              payload: { agency_id: "${fire_id}", effective_start: "2026-08-01T00:00:00Z" }
              as: AgencyLiaison
              as_user_id: "${fire_id}"
              captures: { b_fire_id: $.data.id, b_fire_v: $.data.version }
            - call: "POST /gis/emergency-service-boundaries/${b_fire_id}/cell-assignments"
              payload: { cell_id: "${cell_id}", effective_start: "2026-08-01T00:00:00Z", expected_boundary_version: "${b_fire_v}" }
              as: AgencyLiaison
              as_user_id: "${fire_id}"
            - call: "POST /gis/emergency-service-boundaries/${b_fire_id}/propose"
              payload: {}
              as: AgencyLiaison
              as_user_id: "${fire_id}"
            - call: "POST /gis/emergency-service-boundaries/${b_fire_id}/activate"
              payload: {}
              as: AgencyLiaison
              as_user_id: "${fire_id}"
            - call: "POST /gis/road-centerlines"
              payload: { primary_name: "N MAPLE STREET", jurisdiction_id: "${j_id}", from_addr_left: 100, to_addr_left: 198, parity_left: "EVEN", from_addr_right: 101, to_addr_right: 199, parity_right: "ODD" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { road_id: $.data.id }
            - call: "POST /gis/road-centerlines/${road_id}/validate"
              payload: {}
              as: GisAnalyst
              as_user_id: "analyst-1"
            - call: "POST /gis/address-points"
              payload: { house_number: 100, road_centerline_id: "${road_id}", side: "LEFT", source: "POSTAL", postal_city: "FORT COLLINS", cell_id: "${cell_id}", geometry_verified: true }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { pt_id: $.data.id }
          trigger:
            - call: "POST /gis/qc-validation-reports"
              payload: { scope: "JURISDICTION", jurisdiction_id: "${j_id}" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { rep_id: $.data.id }
          assert:
            - "AddressPoint.${pt_id}.confidence_score == 66.00"
            - "QcValidationReport.${rep_id}.defect_count == 2"
            - "QcValidationReport.${rep_id}.blocking_defect_count == 1"
            - "QcValidationReport.${rep_id}.warning_defect_count == 0"
            - "QcValidationReport.${rep_id}.info_defect_count == 1"
            - "QcValidationReport.${rep_id}.quality_score == 96.21   # per-category round-then-sum; 96.20 is the sum-then-round error"
            - "QcValidationReport.${rep_id}.advisory_quality_score == 96.88"
            - "QcValidationReport.${rep_id}.quality_tier == \"A\""
            - "QcValidationReport.${rep_id}.provisioning_eligibility_score == 96.21"
            - "QcValidationReport.${rep_id}.is_provisioning_eligible == false   # open_blocking_defect_count is 1"
            - "Jurisdiction.${j_id}.gap_pair_count == 1"

      - name: provisioning_eligibility_tier_pinned_to_base_score
        grounds:
          - calculations.provisioning_eligibility_score
          - calculations.qc_quality_score
          - state_machines.QcDefect.OPEN_to_WAIVED
          - entities.QcValidationReport.fields.quality_tier
          - entities.QcValidationReport.fields.provisioning_eligibility_score
        distinguishing_aspect: |
          Mode (c) — a circular-looking dependency pinned by evaluation order: waiving the single
          BLOCKING defect raises the base to 95.05 (tier A, rate 1.0) so eligibility is 94.05;
          re-deriving the tier from the penalised 94.05 would pick tier B (rate 2.5) and yield
          92.55, so the 1.50 spread proves the tier is frozen at the base score.
          The rounding order of instance qc_quality_score_per_category_rounding_order is NOT what
          this instance probes.
        test_recipe:
          setup:
            - "Jurisdiction LARCO (postal_city FORT COLLINS) with one CoverageCell C001."
            - "One VALIDATED RoadCenterline 'N MAPLE STREET' (primary_name == normalized_name, qc_dirty false), LEFT range [100,198] EVEN."
            - "Five PENDING AddressPoints on it: two POSTAL/geometry-verified/postal-matching base points at 100 and 102 (confidence 66.00 each -> INFO), one PARCEL/geometry-verified base point at 104 with postal_city LOVELAND (confidence 83.00 -> WARNING), one FIELD base point at 106 with geometry_verified false (confidence 89.00 -> BLOCKING), and one subaddress unit '1' under 106 with unit_type omitted (confidence 95.00 -> WARNING)."
