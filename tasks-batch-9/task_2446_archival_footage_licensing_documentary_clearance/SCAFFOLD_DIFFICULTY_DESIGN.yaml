              payload: { to_status: "SUSPENDED" }
              as: ClearanceSupervisor
          trigger:
            - call: "POST /licenses/${lic_id}/state"
              payload: { to_status: "EXECUTED" }
              as: ClearanceSupervisor
            - call: "POST /archives/${arch_id}/state"
              payload: { to_status: "ACTIVE" }
              as: ClearanceSupervisor
            - call: "POST /licenses/${lic_id}/state"
              payload: { to_status: "EXECUTED" }
              as: ClearanceSupervisor
          assert:
            - "the first EXECUTED attempt returns 409 with error_id ERR_ARCHIVE_SUSPENDED while Archive.${arch_id}.status == SUSPENDED"
            - "after that rejection License.${lic_id}.status is still QUOTED, executed_fee_cents is null and Production.${prod_id}.committed_fee_cents == 0"
            - "the second EXECUTED attempt (identical body, archive back to ACTIVE) returns 200"
            - "License.${lic_id}.status == EXECUTED with executed_fee_cents == 362250 and Production.${prod_id}.committed_fee_cents == 362250"
            - "Asset.${asset_id}.licensing_status == CLEARED and rights_basis == LICENSED"
            - "a POST /archives/${arch_id}/rate-cards issued while the archive was SUSPENDED would also have returned ERR_ARCHIVE_SUSPENDED (same rule, second listed endpoint)"

      - name: unbound_eo_application_blocks_delivery_of_a_fully_validated_package
        grounds:
          - validations[priority=28]
          - state_machines.DeliveryPackage.VALIDATED_to_DELIVERED
          - state_machines.EOApplication.CLEARED_TO_BIND_to_BOUND
          - errors.ERR_EO_NOT_BOUND
          - endpoints.POST_/eo-applications/{id}/reviews
        distinguishing_aspect: |
          A SIBLING-to-SIBLING dependency rather than a pointed-at-parent one: the DeliveryPackage
          holds no reference to the EOApplication at all — the rule reaches sideways through the
          shared Production. The blocking state is one step short of ready (CLEARED_TO_BIND with
          both reviews already PASSED), so only the final BOUND flip unblocks delivery; the
          package itself is untouched between the failure and the success.
        test_recipe:
          setup:
            - "A production in CLEARANCE, posture OPEN, one 45-second asset CLEARED by an EXECUTED ALL_MEDIA_WINDOW licence, and a PINNED chart."
            - "An EOApplication on that chart advanced to CLEARED_TO_BIND: SUBMITTED, then LEGAL PASSED by counsel-beta and UNDERWRITING PASSED by supervisor-one, which auto-joins at CLEARED_TO_BIND."
            - "A DeliveryPackage on the same chart already in status VALIDATED."
          setup_api_calls:
            - call: "POST /productions"
              payload: { title: "Bind Before Deliver", delivery_deadline_date: "2027-11-30" }
              as: ProductionAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /productions/${prod_id}/state"
