# =============================================================================
# Task 0140: Estate Planning & Trust Administration — Scaffold Difficulty Design
#
# Test Targeting Index (§1.8). Each rule below references §0.5 in SKILL.md;
# every `grounds:` entry resolves into a declared element of SCAFFOLD.yaml.
# All concrete numeric literals in `assert:` were computed against the
# formulas in SCAFFOLD.yaml §1.3 with the constants pinned there.
# =============================================================================

scaffold_difficulty_design:

  # -------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: gross_estate_value_forward_vs_chronological
        grounds:
          - calculations.gross_estate_value
          - state_machines.Estate.INVENTORIED_to_DISTRIBUTING
          - state_machines.Estate.DISTRIBUTING_to_SETTLED
          - entities.Asset.fields.status
          - entities.Asset.fields.declared_value_cents
          - entities.Asset.fields.appraised_value_cents
        distinguishing_aspect: |
          On Estate INVENTORIED→DISTRIBUTING the forward_looking variant includes
          declared_value_cents of still-INVENTORIED assets; on DISTRIBUTING→SETTLED
          the chronological variant only counts APPRAISED/DISTRIBUTED assets. The
          two variants operate on the Estate/Asset domain.
        test_recipe:
          setup:
            - "Create Estate E with testator_name='X'."
            - "Confirm Executor fiduciary F with bond_amount_cents=1000000."
            - "Submit + accept PETITION_TO_PROBATE filing P0."
            - "Estate state DRAFT→IN_PROBATE."
            - "Create Asset A (asset_class=REAL_ESTATE, declared_value_cents=100000000)."
            - "Create Asset B (asset_class=FINANCIAL,  declared_value_cents=100000000)."
            - "Transition A: DECLARED→INVENTORIED→APPRAISED with appraised_value_cents=500000000."
            - "Transition B: DECLARED→INVENTORIED (do not APPRAISE)."
            - "Submit + accept INVENTORY_REPORT filing P1."
          trigger:
            - "POST /estates/{E}/state to_status=INVENTORIED."
            - "GET /estates/{E} -> capture gross_value_at_inventoried (forward_looking)."
          assert:
            - "Response Estate.gross_estate_value_cents == 600000000 (forward_looking: 500000000 APPRAISED + 100000000 INVENTORIED declared)."
            - "Subsequent attempt to advance INVENTORIED→DISTRIBUTING that re-reads gross under chronological variant for FINAL_ACCOUNTING-side checks treats B as 0 (chronological) — observable later as gross_value_at_settled == 500000000 after Asset B is EXCLUDED and Asset A is DISTRIBUTED."

      - name: fiduciary_risk_score_provisional_vs_final
        grounds:
          - calculations.fiduciary_risk_score
          - state_machines.Fiduciary.CONFIRMED_to_RESIGNED
          - state_machines.Estate.DISTRIBUTING_to_SETTLED
          - entities.Fiduciary.fields.bond_amount_cents
        distinguishing_aspect: |
          On Fiduciary RESIGNED the provisional variant uses
          gross_estate_value forward_looking; at SETTLED the final variant uses
          gross_estate_value chronological — same Fiduciary row, different
          denominator -> different bond_factor -> different score. This rule
          operates on the Fiduciary domain (distinct from gross_estate_value's
          Estate/Asset domain).
        test_recipe:
          setup:
            - "Reach the state of the prior instance (gross=600M forward, 500M chronological)."
            - "Mark a successor EXECUTOR fiduciary F2 as NOMINATED."
            - "Note Fiduciary F's bond_amount_cents=1000000."
          trigger:
            - "POST /estates/{E}/fiduciaries/{F}/state to_status=RESIGNED -> read F.risk_score_provisional."
            - "Complete the Estate path to SETTLED (after distributing); compute F.risk_score_final from final accounting."
          assert:
            - "score_provisional != score_final because bond_factor uses gross 600M (provisional) vs 500M (final); concretely bond_factor_provisional = 1000000 / required_bond(600M_cents) and bond_factor_final = 1000000 / required_bond(500M_cents) differ."

  # -------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: required_bond_per_tier_round_then_sum
        grounds:
          - calculations.required_bond
          - calculations.required_bond.constants.TIER1_RATE
          - calculations.required_bond.constants.TIER2_RATE
          - calculations.required_bond.constants.TIER3_RATE
          - calculations.required_bond.constants.FLAT_BOND_FEE_CENTS
          - state_machines.Fiduciary.NOMINATED_to_CONFIRMED
        distinguishing_aspect: |
          Mode (b): nested rounding where the order matters — required_bond pins
          per-tier banker's rounding THEN sum, plus a flat fee added unrounded.
          A naive sum-then-round implementation would diverge on inputs where any
          tier's product has a half-cent.
        test_recipe:
          setup:
            - "Create Estate E and an EXECUTOR Fiduciary F with bond_amount_cents=325000."
            - "Create Assets summing to gross_estate_value_cents=50000000 (e.g., one Asset declared=50000000, APPRAISED at 50000000)."
          trigger:
            - "POST /estates/{E}/fiduciaries/{F}/state to_status=CONFIRMED."
          assert:
            - "Transition succeeds (200) because required_bond_cents == 325000 (per-tier: tier1=100000 floor 100000 + tier2=200000 + flat 25000 = 325000) and bond_amount_cents == 325000."
            - "Re-create same scenario with bond_amount_cents=324999 -> ERR_BOND_INSUFFICIENT (422)."

      - name: planned_distribution_waterfall_with_priority
        grounds:
          - calculations.planned_distribution
          - entities.BeneficiaryDesignation.fields.share_basis_points
          - entities.BeneficiaryDesignation.fields.priority_rank
          - state_machines.Estate.INVENTORIED_to_DISTRIBUTING
        distinguishing_aspect: |
          Mode (a): formula with ≥3 inputs and non-linear interaction —
          per-Asset waterfall ranking (eligibility by status=LOCKED,
          ranking by priority_rank ASC then designation.id ASC, fallback when
          Σshare_bp<10000), combined with floor + deterministic remainder
          distribution. This is a different mode from required_bond's
          nested-rounding (b).
        test_recipe:
          setup:
            - "Estate E in INVENTORIED; Beneficiaries B1, B2; one Asset A with appraised_value_cents=1000."
            - "Two designations on A: D1 (B1, share=3333, priority_rank=1), D2 (B2, share=6667, priority_rank=2). Total = 10000."
          trigger:
            - "POST /estates/{E}/state to_status=DISTRIBUTING (with ACCEPTED DISTRIBUTION_PETITION present)."
            - "GET /estates/{E}/distributions."
          assert:
            - "Distribution for B1 planned_amount_cents == 334 (floor(1000*3333/10000)=333 + 1 cent remainder allocated first by priority_rank ASC)."
            - "Distribution for B2 planned_amount_cents == 666 (floor(1000*6667/10000)=666 + 0)."
            - "Σ planned_amount_cents == 1000 (no drift; equals appraised_value)."

  # -------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: estate_branching_revert_via_contested
        grounds:
          - state_machines.Estate.IN_PROBATE_to_CONTESTED
          - state_machines.Estate.INVENTORIED_to_CONTESTED
          - state_machines.Estate.CONTESTED_to_IN_PROBATE
        distinguishing_aspect: |
          Estate state machine branches from {IN_PROBATE, INVENTORIED} to
          CONTESTED and reverts CONTESTED→IN_PROBATE (forward + rollback). It
          lives on the Estate entity.
        test_recipe:
          setup:
            - "Estate E in IN_PROBATE state."
            - "Submit a SUBMITTED INVENTORY_REPORT filing P1."
          trigger:
            - "CourtClerk POST /estates/{E}/state to_status=CONTESTED."
            - "GET /estates/{E}/filings/{P1}."
            - "CourtClerk POST /estates/{E}/state to_status=IN_PROBATE (after P1 re-submitted and ACCEPTED)."
          assert:
            - "After CONTESTED, filing P1.status == REVISION_REQUESTED with rejection_reason=='estate_contested'."
            - "Estate.contested_at != null after CONTESTED; reverts to null after CONTESTED→IN_PROBATE."

      - name: directive_cyclic_revision_loop
        grounds:
          - state_machines.EndOfLifeDirective.DRAFT_to_SUPERSEDED
          - state_machines.EndOfLifeDirective.SUPERSEDED_to_DRAFT
          - state_machines.EndOfLifeDirective.EXECUTED_to_SUPERSEDED
        distinguishing_aspect: |
          EndOfLifeDirective has a cycle: SUPERSEDED→DRAFT permits revision
          loops. Lives on EndOfLifeDirective (different entity from Estate).
        test_recipe:
          setup:
            - "Estate E in IN_PROBATE with ACTIVE HIPAAAuthorization scope=ALL."
            - "Create EndOfLifeDirective D1 (DRAFT)."
            - "Create EndOfLifeDirective D2 with supersedes_directive_id=D1."
          trigger:
            - "POST /estates/{E}/directives/{D1}/state to_status=DRAFT (after D1 becomes SUPERSEDED via D2 creation)."
          assert:
            - "After D2 creation, D1.status == SUPERSEDED."
            - "After SUPERSEDED→DRAFT transition, D1.status == DRAFT (cycle closed)."

  # -------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: estate_inprobate_terminates_poa_locks_asset_chain
        grounds:
          - state_machines.Estate.DRAFT_to_IN_PROBATE
          - state_machines.PowerOfAttorney.ACTIVE_to_TERMINATED
          - state_machines.PowerOfAttorney.PENDING_to_TERMINATED
          - entities.Asset.fields.requires_poa_for_mutation
          - validations[priority=8]
        distinguishing_aspect: |
          Depth ≥ 3 chain: Estate DRAFT→IN_PROBATE (link 1) causes ALL POA
          rows to TERMINATED (link 2), which itself causes any Asset with
          requires_poa_for_mutation=true to lose its sole permission grant
          (link 3 — subsequent PATCH/state on such an Asset is rejected with
          ERR_POA_SCOPE_INSUFFICIENT). Each link is caused by the previous.
        test_recipe:
          setup:
            - "Estate E in DRAFT."
            - "Create ACTIVE PowerOfAttorney POA covering REAL_ESTATE."
            - "Create Asset A1 requires_poa_for_mutation=true asset_class=REAL_ESTATE in DECLARED."
            - "Confirm there is an ACCEPTED PETITION_TO_PROBATE and a CONFIRMED EXECUTOR with sufficient bond."
          trigger:
            - "POST /estates/{E}/state to_status=IN_PROBATE (link 1)."
            - "POST /estates/{E}/assets/{A1}/state to_status=INVENTORIED (link 3 attempt)."
          assert:
            - "After IN_PROBATE: POA.status == TERMINATED (link 2 observed)."
            - "PATCH or state on A1 referencing POA fails with ERR_POA_SCOPE_INSUFFICIENT 403 (link 3 — but note Estate is now IN_PROBATE so POA gate no longer applies; verify by attempting PATCH while still DRAFT before transition and after: behavior differs and is the third-hop observable)."

      - name: beneficiary_disclaim_voids_designations_blocks_estate
        grounds:
          - state_machines.Beneficiary.ACTIVE_to_DISCLAIMED
          - state_machines.BeneficiaryDesignation.LOCKED_to_VOIDED
          - state_machines.BeneficiaryDesignation.PROPOSED_to_VOIDED
          - state_machines.Estate.INVENTORIED_to_DISTRIBUTING
        distinguishing_aspect: |
          Depth ≥ 2: Beneficiary ACTIVE→DISCLAIMED (link 1) voids the
          beneficiary's PROPOSED/LOCKED BeneficiaryDesignations (link 2),
          which itself causes Estate INVENTORIED→DISTRIBUTING precondition
          'Σshare=10000 per asset' to fail (link 3 — different trigger from
          the Estate cascade above).
        test_recipe:
          setup:
            - "Estate E in INVENTORIED."
            - "Beneficiary B1 ACTIVE with a PROPOSED designation D1 (share=10000) on Asset A."
            - "ACCEPTED DISTRIBUTION_PETITION P3 ready."
          trigger:
            - "POST /estates/{E}/beneficiaries/{B1}/state to_status=DISCLAIMED (link 1)."
            - "POST /estates/{E}/state to_status=DISTRIBUTING (link 3 attempt)."
          assert:
            - "After DISCLAIMED, D1.status == VOIDED (link 2)."
            - "Estate→DISTRIBUTING attempt fails with ERR_DESIGNATIONS_INCOMPLETE 422 (link 3)."

  # -------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_fiscal_distribution_drift
        grounds:
          - validations[priority=6]
          - validations[priority=13]
          - state_machines.Distribution.PLANNED_to_EXECUTED
        distinguishing_aspect: |
          Pair: state (priority 6) vs business_fiscal (priority 13). A request
          that supplies actual_amount_cents ≠ planned and targets a Distribution
          already EXECUTED — ERR_INVALID_STATE must win.
        test_recipe:
          setup:
            - "Distribution D with planned_amount_cents=1000, already EXECUTED."
          trigger:
            - "POST /estates/{E}/distributions/{D}/state to_status=EXECUTED, actual_amount_cents=999."
          assert:
            - "Response.error_id == 'ERR_INVALID_STATE' (state check wins over drift check)."

      - name: state_vs_business_safety_hipaa
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - state_machines.EndOfLifeDirective.DRAFT_to_EXECUTED
        distinguishing_aspect: |
          Pair: state (priority 6) vs business_safety (priority 7) — different
          error-category pair from the fiscal pair above. Attempt to EXECUTE
          a directive already EXECUTED while HIPAA is also missing scope —
          ERR_INVALID_STATE must win over ERR_HIPAA_SCOPE_INSUFFICIENT.
        test_recipe:
          setup:
            - "Directive D in status=EXECUTED."
            - "No ACTIVE HIPAAAuthorization covering D.requires_hipaa_scope."
          trigger:
            - "POST /estates/{E}/directives/{D}/state to_status=EXECUTED."
          assert:
            - "Response.error_id == 'ERR_INVALID_STATE' (state wins over hipaa-scope check)."

  # -------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: bond_exactly_equal_passes
        grounds:
          - calculations.required_bond
          - validations[priority=12]
          - state_machines.Fiduciary.NOMINATED_to_CONFIRMED
        distinguishing_aspect: |
          Numeric ≥ vs > on Fiduciary.bond_amount_cents against required_bond.
          At exact equality the transition MUST succeed.
        test_recipe:
          setup:
            - "Estate E with gross=50000000 cents (one Asset APPRAISED at that amount)."
            - "Fiduciary F bond_amount_cents=325000 (required_bond computed above)."
          trigger:
            - "POST /estates/{E}/fiduciaries/{F}/state to_status=CONFIRMED."
          assert:
            - "Response status == 200; F.status == 'CONFIRMED' (≥ at boundary passes)."

      - name: empty_designation_set_blocks_distributing
        grounds:
          - state_machines.Estate.INVENTORIED_to_DISTRIBUTING
          - entities.BeneficiaryDesignation
          - validations[priority=10]
        distinguishing_aspect: |
          Different metric: empty-collection boundary — a single Asset with
          ZERO BeneficiaryDesignations (count = 0, not a numeric threshold).
          Reachable via the DISTRIBUTING transition endpoint, distinct from
          the bond endpoint above.
        test_recipe:
          setup:
            - "Estate E in INVENTORIED with one APPRAISED Asset A."
            - "No BeneficiaryDesignation rows exist for A."
            - "ACCEPTED DISTRIBUTION_PETITION present."
          trigger:
            - "POST /estates/{E}/state to_status=DISTRIBUTING."
          assert:
            - "Response.error_id == 'ERR_DESIGNATIONS_INCOMPLETE' (empty set fails the 10000-bp rule)."

  # -------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: estate_distributing_requires_guardianship_effective
        grounds:
          - state_machines.Estate.INVENTORIED_to_DISTRIBUTING
          - state_machines.GuardianshipDirective.DRAFT_to_EFFECTIVE
          - entities.Beneficiary.fields.is_minor
        distinguishing_aspect: |
          Entity pair: Estate ↔ GuardianshipDirective. Estate INVENTORIED→
          DISTRIBUTING requires the related GuardianshipDirective for every
          minor Beneficiary to be in EFFECTIVE — not DRAFT.
        test_recipe:
          setup:
            - "Estate E in INVENTORIED with one minor Beneficiary B."
            - "GuardianshipDirective G effective_at=now()+1day, status=DRAFT."
            - "Designations sum to 10000."
          trigger:
            - "POST /estates/{E}/state to_status=DISTRIBUTING (no clock advance)."
          assert:
            - "Response.error_id == 'ERR_GUARDIANSHIP_MISSING'."
            - "After POST /_clock/advance to G.effective_at, G.status == 'EFFECTIVE' and a re-attempt succeeds."

      - name: directive_execute_requires_active_hipaa
        grounds:
          - state_machines.EndOfLifeDirective.DRAFT_to_EXECUTED
          - state_machines.HIPAAAuthorization.ACTIVE_to_EXPIRED
          - state_machines.HIPAAAuthorization.ACTIVE_to_REVOKED
        distinguishing_aspect: |
          Different entity pair: EndOfLifeDirective ↔ HIPAAAuthorization.
          DRAFT→EXECUTED is gated on the state of an UNRELATED-by-FK
          HIPAAAuthorization row whose scope must cover requires_hipaa_scope.
        test_recipe:
          setup:
            - "Estate E in IN_PROBATE; Directive D requires_hipaa_scope='ALL'."
            - "HIPAAAuthorization H scope='MEDICAL_RECORDS', status=ACTIVE."
          trigger:
            - "POST /estates/{E}/directives/{D}/state to_status=EXECUTED."
          assert:
            - "Response.error_id == 'ERR_HIPAA_SCOPE_INSUFFICIENT' because H.scope does not cover 'ALL'."

  # -------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: single_executor_at_a_time
        grounds:
          - concurrency_rules[duplicate_executor]
          - state_machines.Fiduciary.NOMINATED_to_CONFIRMED
        distinguishing_aspect: |
          Interval semantics #1: full-resource exclusion — at most one
          CONFIRMED EXECUTOR per Estate at any instant (point-wise exclusion).
          Lives on the Fiduciary resource.
        test_recipe:
          setup:
            - "Estate E with two NOMINATED EXECUTOR fiduciaries F1, F2 both with sufficient bond."
            - "Confirm F1 first → status=CONFIRMED."
          trigger:
            - "POST /estates/{E}/fiduciaries/{F2}/state to_status=CONFIRMED."
          assert:
            - "Response.error_id == 'ERR_DUPLICATE_EXECUTOR' 409."

      - name: single_pending_filing_per_type
        grounds:
          - concurrency_rules[filing_already_pending]
          - entities.ProbateFiling.fields.filing_type
        distinguishing_aspect: |
          Interval semantics #2: collection-scoped exclusion keyed on
          (estate_id, filing_type) — different shape from the EXECUTOR
          exclusion above (filtered by filing_type sub-resource, not the
          whole entity). Lives on a different resource (ProbateFiling).
        test_recipe:
          setup:
            - "Estate E with one ProbateFiling P1 (filing_type=INVENTORY_REPORT, status=SUBMITTED)."
          trigger:
            - "POST /estates/{E}/filings with filing_type=INVENTORY_REPORT."
          assert:
            - "Response.error_id == 'ERR_FILING_ALREADY_PENDING' 409."

  # -------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: gross_estate_invariant_under_distribute_then_reverse
        grounds:
          - state_machines.Distribution.PLANNED_to_EXECUTED
          - state_machines.Distribution.EXECUTED_to_REVERSED
          - calculations.gross_estate_value
          - calculations.net_estate_value
        distinguishing_aspect: |
          Conserved quantity #1: Estate.gross_estate_value_cents must be
          identical before EXECUTE and after the EXECUTE+REVERSE pair.
          Asset transitions APPRAISED→DISTRIBUTED→APPRAISED restore the
          value-bearing field.
        test_recipe:
          setup:
            - "Estate E in DISTRIBUTING with one APPRAISED Asset A (appraised_value=500000000) and a PLANNED Distribution D1 (planned=500000000)."
            - "Capture gross_before = Estate.gross_estate_value_cents."
          trigger:
            - "POST /distributions/{D1}/state to_status=EXECUTED, actual_amount_cents=500000000."
            - "POST /assets/{A}/state to_status=DISTRIBUTED, distribution_id=D1."
            - "POST /distributions/{D1}/state to_status=REVERSED."
          assert:
            - "Asset A.status == 'APPRAISED' and distribution_id == null after REVERSE."
            - "Estate.gross_estate_value_cents == gross_before (invariant preserved)."

      - name: bytes_unrelated_designation_share_invariant_under_disclaim_reissue
        grounds:
          - state_machines.Beneficiary.ACTIVE_to_DISCLAIMED
          - state_machines.BeneficiaryDesignation.PROPOSED_to_VOIDED
          - calculations.planned_distribution
        distinguishing_aspect: |
          Conserved quantity #2 (different from gross_estate_value cents):
          Σ share_basis_points per asset across PROPOSED designations MUST
          return to 10000 after a DISCLAIM-then-reissue pair (reissue is a
          new PROPOSED designation to a substitute Beneficiary). The
          quantity 'sum-of-shares per Asset' is conserved at 10000.
        test_recipe:
          setup:
            - "Estate E in INVENTORIED with Beneficiaries B1, B2 (ACTIVE)."
            - "Asset A (APPRAISED); designation D1 (B1, share=10000)."
          trigger:
            - "POST /beneficiaries/{B1}/state to_status=DISCLAIMED → D1.status=VOIDED."
            - "POST /designations creating D2 (B2, share=10000)."
            - "GET designations for A."
          assert:
            - "Σ designation.share_basis_points for A across status=PROPOSED == 10000 after the disclaim+reissue pair (sum-of-shares invariant)."
