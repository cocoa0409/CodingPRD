              as: LicensingOfficer
              as_user_id: "officer-1"
            - call: "POST /production-quotas"
              payload: { agreement_id: "${a_id}", variety_id: "${v_id}", season_code: "2026S1", basis: "PER_PLANT", territory_code: "US-WA", territory_class: "DOMESTIC", allocated_units: 20000 }
              as: LicensingOfficer
              as_user_id: "officer-1"
              captures: { q_id: $.data.id }
            - call: "POST /royalty-reports"
              payload: { agreement_id: "${a_id}", period_code: "2026Q3", period_start: "2026-08-01T00:00:00Z", period_end: "2026-11-01T00:00:00Z", due_at: "2026-08-10T00:00:00Z" }
              as: Propagator
              as_user_id: "${p_id}"
              captures: { r_id: $.data.id, r_ver: $.data.version }
            - call: "POST /royalty-reports/${r_id}/line-items"
              payload: { quota_id: "${q_id}", reported_units: 100, expected_report_version: "${r_ver}" }
              as: Propagator
              as_user_id: "${p_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:00Z" }
              as: LicensingOfficer
              as_user_id: "officer-1"
            - call: "POST /royalty-reports/${r_id}/submit"
              payload: {}
              as: Propagator
              as_user_id: "${p_id}"
            - call: "POST /royalty-reports/${r_id}/accept"
              payload: {}
              as: LicensingOfficer
              as_user_id: "officer-2"
            - call: "POST /royalty-reports/${r_id}/settle"
              payload: {}
              as: LicensingOfficer
              as_user_id: "officer-3"
            - call: "POST /audit-engagements"
              payload: { agreement_id: "${a_id}", royalty_report_id: "${r_id}" }
              as: ComplianceAuditor
              as_user_id: "auditor-1"
              captures: { e_id: $.data.id }
            - call: "POST /audit-engagements/${e_id}/finalize"
              payload: { finding_severity: "MATERIAL", underreported_units: 50 }
              as: ComplianceAuditor
              as_user_id: "auditor-1"
          trigger:
            - call: "POST /propagator-agreements/${a_id}/reinstate"
              payload: {}
              as: LicensingOfficer
              as_user_id: "officer-1"
          assert:
            - "After the accept: RoyaltyReport.${r_id}.late_fee_cents == 70 and booked_amount_cents == 3570, Propagator.${p_id}.compliance_score == 94"
            - "After the settle: Propagator.${p_id}.royalty_settled_cents == 3570 and royalty_payable_cents == 0"
            - "After the finalize: RoyaltyReport.${r_id}.review_status is still ACCEPTED with settlement_status SETTLED and booked_amount_cents 3570 - a SETTLED report is never disputed by a finding"
            - "After the finalize: Propagator.${p_id}.compliance_score == 69, lifetime_compliance_score == 69, material_audit_finding_count == 1; PropagatorAgreement.${a_id}.status == SUSPENDED with suspension_reason == AUDIT_FINDING; ProductionQuota.${q_id}.status == FROZEN"
            - "HTTP status is 403 and data.error_id == ERR_COMPLIANCE_SCORE_TOO_LOW - priority 16 wins over the equally violated priority 17"
            - "PropagatorAgreement.${a_id}.status is still SUSPENDED and reinstatement_count == 0"

      - name: aggregate_capacity_validation_corner_deferred_to_difficulty_design
        claim_type: aggregate_validation
        grounds:
          - validations[priority=35]
          - errors.ERR_TRIAL_SITE_CAPACITY_EXCEEDED
        distinguishing_aspect: "The aggregate-validation corner - each individual trial fitting the site but the collective exceeding plot_capacity - is asserted by the difficulty design."
        excluded_because:
          difficulty_instance: trial_site_aggregate_plot_capacity_over_half_open_windows_with_adjacency_allowed
          rationale: "That resource_temporal_overlap instance already plants 30 of 50 plots, is refused a second overlapping 30, and is then allowed an adjacent 30 - covering the aggregate sum, the overlap window and the adjacency boundary in one recipe."

      - name: cross_entity_state_validation_corner_deferred_to_difficulty_design
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=11]
          - validations[priority=13]
        distinguishing_aspect: "The cross-entity-validation corner - an operation's legality depending on a DIFFERENT entity's state, tested both valid and invalid - is asserted twice by the difficulty design."
        excluded_because:
          difficulty_instance: report_submission_requires_governing_agreement_active
          rationale: "That cross_entity_state_dependency instance tests submit against a SUSPENDED and then an ACTIVE agreement; sublicense_activation_requires_a_granted_protection_filing_in_that_jurisdiction does the same against the filing's state."

      - name: quota_priority_conflict_corner_deferred_to_difficulty_design
        claim_type: priority_conflict
        grounds:
          - validations[priority=10]
          - validations[priority=36]
          - validations[priority=11]
          - validations[priority=18]
        distinguishing_aspect: "The two priority-conflict pairs on the tag and line-item write paths are asserted by the difficulty design."
        excluded_because:
          difficulty_instance: frozen_quota_state_check_outranks_tag_unit_ceiling_check
          rationale: "That priority_pair_validation_conflict instance pins priority 10 over priority 36 on tag issue, and agreement_activity_safety_check_outranks_quota_agreement_referential_check pins priority 11 over priority 18 on line-item creation."

  # =====================================================================
  - section: endpoints
    instances:
      - name: propagator_crud_surface_create_read_and_list
        claim_type: standard_crud
        grounds:
          - endpoints[POST /propagators]
          - endpoints[GET /propagators]
          - endpoints[GET /propagators/{propagator_id}]
        distinguishing_aspect: "Propagator exposes create / read / list and nothing else - there is no update and no delete endpoint in §1.5, so its mutable fields move only through the compliance and ledger calculations."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /propagators"
