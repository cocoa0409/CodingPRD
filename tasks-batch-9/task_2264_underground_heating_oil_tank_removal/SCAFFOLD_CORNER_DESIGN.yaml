      - name: cascading_side_effects_chain_is_verified_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers[cascading_side_effects]
          - state_machines.SoilSample.transitions
          - state_machines.TankProject.transitions
        excluded_because:
          difficulty_instance: transitive_cascade / cascade_depth_five_from_lab_result_to_insurance_notification_status
          rationale: "That §1.8 instance walks the five-level chain (sample RESULTED -> contamination_class -> project REMEDIATION_ACTIVE -> remediation cost/volume recompute -> insurance reserve allocation -> notification status) with an assertion at every level, and its sibling cascade_depth_four_from_nfa_rescission_to_claim_and_reserve_revert covers the compensating direction."

      - name: dual_variant_calculations_produce_divergent_results
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers[dual_variant_calculation]
          - calculations[remediation_soil_volume].variants
          - calculations[trust_fund_eligible_amount].variants
        excluded_because:
          difficulty_instance: dual_variant_calc / remediation_volume_provisional_grid_versus_final_surveyed
          rationale: "That §1.8 instance runs both remediation_soil_volume variants over identical data and asserts the delta plus the basis field, and trust_fund_preliminary_estimate_versus_final_settlement_eligibility does the same for the two eligibility variants."

      - name: rate_threshold_triggers_fire_exactly_at_the_boundary
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers[rate_threshold_triggers]
          - calculations[contamination_classification].constants
          - calculations[laboratory_timing].constants
        excluded_because:
          difficulty_instance: boundary_precision_check / contamination_thresholds_exactly_at_action_level_classify_clean
          rationale: "That §1.8 instance pins the strict-greater-than semantics at exactly 500.0 mg/kg tph and 0.5 mg/kg benzene, and holding_time_exactly_at_limit_is_compliant_one_second_past_is_not pins the temporal threshold at its boundary and one second past it."

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: cascaded_fields_are_visible_in_the_same_logical_instant
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - state_machines.HomeownerDisclosure.transitions
          - state_machines.TankProject.transitions
        distinguishing_aspect: "The consistency model is immediate: the DECLINED response body already carries the disclosure's terminal status, and the very next reads — with no clock movement and no retry — already show TankProject VOID and Property.open_project_count back at 0. Nothing about the cascade is deferred to a later request."
        test_recipe:
          setup:
            - "One NJ project at SURVEYED with a PENDING SWEEP_FINDINGS disclosure; Property.open_project_count == 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /properties"
              payload: { street_address: "42 Corner Way", state_code: "NJ", county_code: "MRS", homeowner_name: "Pia Cove", homeowner_email: "pia@example.com", insurance_carrier_code: "CARR-C-42" }
              as: ProjectCoordinator
              captures: { prop_id: $.data.id }
            - call: "POST /tank-projects"
              payload: { property_id: "${prop_id}" }
              as: ProjectCoordinator
              captures: { proj_id: $.data.id }
            - call: "POST /tank-projects/${proj_id}/sweep-survey"
              payload: { survey_method: "GPR", tanks_detected_count: 1, tank_capacity_gallons: 550, tank_depth_to_top_inches: 60, tank_distance_to_foundation_inches: 90, tank_under_structure: false, tank_material: "STEEL" }
              as: FieldTechnician
            - call: "POST /disclosures"
              payload: { tank_project_id: "${proj_id}", disclosure_kind: "SWEEP_FINDINGS" }
              as: ProjectCoordinator
              captures: { disc_id: $.data.id }
            - call: "GET /properties/${prop_id}"
              as: ProjectCoordinator
              captures: { open_before: $.data.open_project_count }
          trigger:
            - call: "POST /disclosures/${disc_id}/respond"
              payload: { response: "DECLINED", response_channel: "PORTAL" }
              as: Homeowner
              as_user_id: "${prop_id}"
              captures: { disc_status: $.data.status, disc_responded_at: $.data.responded_at }
            - call: "GET /tank-projects/${proj_id}"
              as: ProjectCoordinator
              captures: { proj_state: $.data.status }
            - call: "GET /properties/${prop_id}"
              as: ProjectCoordinator
              captures: { open_after: $.data.open_project_count }
          assert:
            - "${open_before} == 1"
            - "${disc_status} == DECLINED"
            - "${disc_responded_at} == 2026-08-03T08:00:00Z"
            - "${proj_state} == VOID"
            - "${open_after} == 0"
            - "GET /tank-projects/${proj_id}/summary reports status VOID in the same logical instant"
