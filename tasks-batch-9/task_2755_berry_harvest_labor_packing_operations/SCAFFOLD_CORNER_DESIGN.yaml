      - name: fruit_lot_list_filters_reverse_navigate_window_block_tunnel_and_repack_lineage
        claim_type: standard_crud
        grounds:
          - endpoints["GET /berry-ops/fruit-lots"]
          - entities.FruitLot.fields.source_lot_id
          - entities.FruitLot.fields.cooling_tunnel_id
          - response_envelope.pagination_fields
        distinguishing_aspect: |
          The lot list is the ONLY discovery channel for a repack child, and each
          filter selects a different subset of the same three rows: the window and
          block filters return all 3, source_lot_id returns exactly the 1 child,
          cooling_tunnel_id returns the 2 rows that carry the source lot's cooling
          fields (the child inherits them), cold_chain_status COOLED returns those
          same 2, and disposition_status UNCOMMITTED returns the child plus the
          never-cooled lot - so the REPACKED parent is excluded from the last one
          while remaining visible under the tunnel filter.
