# =============================================================================
# Task 0102: Auto Insurance Claims (FNOL) benchmark seed tables
# =============================================================================

scenario: |
  102. Auto Insurance Claims (FNOL): first notice of loss, coverage verification,
  adjuster assignment, repair estimate/appraisal, total loss (ACV/salvage),
  rental reimbursement, subrogation, comparative-negligence fault, deductible

domain_name: auto-insurance-fnol
# Flat topology: entities are peer collections (/policies, /claims, /adjusters,
# /repair-estimates, /subrogation-cases, ...) linked by foreign keys, not nested
# ownership paths. The API root is "/"; there is no single top-level resource.
api_prefix: /

# Difficulty band: Expert (10-15 entities, 20-32 endpoints).
complexity_profile:
  primary_archetype: Ledger reconciliation
  secondary_archetype: Compliance / audit
  complexity_layers:
    - Dual-variant calculation        # repair-path vs total-loss-path settlement on the same claim
    - Cascading side effects          # total-loss decision cascades into rental cap + payment + subrogation
    - Rate / threshold triggers       # total-loss threshold (repair_cost / ACV >= TLT) with >= vs > boundary
    - Optimistic concurrency          # OCC on Claim.version for adjuster-decision writes
  entity_topology: flat
  # Peer entities linked by foreign keys; URLs are flat collections (/claims, /repair-estimates,
  # /subrogation-cases) carrying FK fields in the body, not nested ownership paths.
  state_machine_shape: branching
  # Claim forks at the disposition decision into REPAIR vs TOTAL_LOSS branches with divergent
  # side-effect sets; SubrogationCase carries a revision cycle (DEMAND_SENT -> NEGOTIATING -> DEMAND_SENT).
  relationship_patterns:
    - one_to_many       # Policy -> Coverage; Claim -> EstimateLine; Claim -> ClaimParty
    - flat              # Claim references Policy/Adjuster by FK; RepairEstimate references Claim by FK
    - cross_aggregate   # SubrogationCase references Claim; RentalReimbursement references Claim
  role_model: segregation_of_duties
  # The Adjuster who authored the repair estimate may not also approve total-loss disposition on the
  # same claim (SIU/total-loss is a distinct approval); ClaimsSupervisor approves disbursements.
  consistency_model: immediate

# =============================================================================
# Table 1.0: Response Envelope (FIXED — emitted verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1.1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Policy
    parent: null
    common_fields: true
    fields:
      - { name: policyholder_name, type: string, source: input, description: "Named insured" }
      - { name: policy_number, type: string, source: input, description: "Unique policy identifier (unique across all Policy rows)" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | LAPSED | CANCELLED — only ACTIVE policies provide coverage" }
      - { name: effective_date, type: datetime, source: input, description: "Coverage period start (ISO 8601 UTC)" }
      - { name: expiration_date, type: datetime, source: input, description: "Coverage period end (ISO 8601 UTC); a loss outside [effective_date, expiration_date) is uncovered" }
      - { name: comparative_fault_rule, type: enum, source: input, default: "MODIFIED_50", description: "PURE | MODIFIED_50 | MODIFIED_51 — governs how insured fault reduces a recovery" }

  - name: Coverage
    parent: Policy
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: input, description: "FK -> Policy.id; the policy this coverage belongs to" }
      - { name: coverage_type, type: enum, source: input, description: "COLLISION | COMPREHENSIVE | RENTAL — at most one row per type per policy" }
      - { name: limit_cents, type: integer, source: input, description: "Per-claim payout ceiling for this coverage in cents" }
      - { name: deductible_cents, type: integer, source: input, default: 0, description: "Deductible withheld from the gross loss for COLLISION/COMPREHENSIVE coverages; 0 for RENTAL" }
      - { name: rental_daily_cap_cents, type: integer, source: input, default: 0, description: "RENTAL only: per-day reimbursement cap in cents; 0 for non-rental coverages" }
      - { name: rental_max_days, type: integer, source: input, default: 0, description: "RENTAL only: maximum reimbursable rental days; 0 for non-rental coverages" }

  - name: Adjuster
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Adjuster display name" }
      - { name: license_tier, type: enum, source: input, default: "STANDARD", description: "STANDARD | SENIOR — SENIOR is required to author a TotalLossEvaluation" }
      - { name: active, type: boolean, source: input, default: true, description: "Whether the adjuster may receive new assignments" }

  - name: Claim
    parent: null
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: input, description: "FK -> Policy.id; the policy the loss is reported against" }
      - { name: assigned_adjuster_id, type: string, source: system, default: null, description: "FK -> Adjuster.id; set by assignment, null until assigned" }
      - { name: loss_datetime, type: datetime, source: input, description: "When the loss occurred (ISO 8601 UTC); used for coverage-window verification" }
      - { name: loss_type, type: enum, source: input, description: "COLLISION | COMPREHENSIVE — selects which Coverage applies" }
      - { name: vehicle_acv_cents, type: integer, source: input, description: "Actual Cash Value of the vehicle at time of loss, in cents" }
      - { name: insured_fault_pct, type: integer, source: input, default: 0, description: "Insured party's fault percentage 0..100 (comparative negligence); reduces a third-party recovery, not the first-party payout" }
      - { name: status, type: enum, source: system, default: "FNOL_SUBMITTED", description: "FNOL_SUBMITTED | COVERAGE_VERIFIED | COVERAGE_DENIED | UNDER_REVIEW | REPAIR_APPROVED | TOTAL_LOSS | SETTLED | CLOSED | REOPENED" }
      - { name: disposition, type: enum, source: computed, default: null, description: "null | REPAIR | TOTAL_LOSS — set when disposition is decided" }
      - { name: settlement_cents, type: integer, source: computed, default: 0, description: "Net first-party payout to the insured after deductible and limit, in cents; 0 until disposition" }
      - { name: salvage_value_cents, type: integer, source: input, default: 0, description: "Salvage proceeds for a totaled vehicle, in cents; meaningful only on the total-loss path" }
      - { name: total_disbursed_cents, type: integer, source: computed, default: 0, description: "Denormalized running net of APPROVED Disbursements for this claim (recomputed on every disbursement create); kept consistent with calculation claim_ledger_balance" }

  - name: ClaimParty
    parent: Claim
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: input, description: "FK -> Claim.id; the claim this party is involved in" }
      - { name: party_role, type: enum, source: input, description: "INSURED | THIRD_PARTY — at most one INSURED party per claim" }
      - { name: display_name, type: string, source: input, description: "Party name" }
      - { name: fault_pct, type: integer, source: input, default: 0, description: "This party's assigned fault percentage 0..100" }
      - { name: at_fault_carrier_name, type: string, source: input, default: null, description: "THIRD_PARTY only: name of the at-fault party's insurer, the subrogation target" }

  - name: CoverageVerification
    parent: Claim
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: input, description: "FK -> Claim.id; the claim being verified" }
      - { name: matched_coverage_type, type: enum, source: system, default: null, description: "COLLISION | COMPREHENSIVE | null — coverage_type of the Coverage matched to the loss_type (find it via the policy's coverages by this type); null if denied" }
      - { name: outcome, type: enum, source: system, description: "VERIFIED | DENIED — VERIFIED only when policy ACTIVE, loss in window, and a matching coverage exists" }
      - { name: denial_reason, type: enum, source: system, default: null, description: "null | POLICY_INACTIVE | OUTSIDE_COVERAGE_WINDOW | NO_MATCHING_COVERAGE" }

  - name: RepairEstimate
    parent: Claim
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: input, description: "FK -> Claim.id; the claim being estimated" }
      - { name: authored_by_adjuster_id, type: string, source: system, description: "FK -> Adjuster.id; the adjuster who created this estimate (segregation-of-duties subject)" }
      - { name: lines, type: array, source: input, description: "Estimate lines: list of { description, labor_cents, parts_cents }" }
      - { name: repair_total_cents, type: integer, source: computed, description: "Sum over lines of (labor_cents + parts_cents); the gross repair cost" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | SUBMITTED | SUPERSEDED — SUBMITTED is the active estimate used for disposition; SUPERSEDED when a newer estimate is submitted" }

  - name: TotalLossEvaluation
    parent: Claim
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: input, description: "FK -> Claim.id; the claim being evaluated for total loss" }
      - { name: evaluated_by_adjuster_id, type: string, source: system, description: "FK -> Adjuster.id; the SENIOR adjuster who authored the evaluation (must differ from the repair estimate author)" }
      - { name: acv_cents, type: integer, source: system, description: "Snapshot of Claim.vehicle_acv_cents at evaluation time" }
      - { name: repair_total_cents, type: integer, source: system, description: "Snapshot of the SUBMITTED RepairEstimate.repair_total_cents at evaluation time" }
      - { name: total_loss_ratio, type: number, source: computed, description: "repair_total_cents / acv_cents, rounded to 4 decimals (round_half_up)" }
      - { name: is_total_loss, type: boolean, source: computed, description: "true when total_loss_ratio >= policy total-loss threshold TLT" }
      - { name: salvage_retained_by_insurer, type: boolean, source: input, default: true, description: "Whether insurer keeps the salvage (deducts salvage from payout) or insured keeps it" }

  - name: RentalReimbursement
    parent: Claim
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: input, description: "FK -> Claim.id; the claim the rental is reimbursed against" }
      - { name: rental_start_date, type: datetime, source: input, description: "Rental period start (ISO 8601 UTC, inclusive)" }
      - { name: rental_end_date, type: datetime, source: input, description: "Rental period end (ISO 8601 UTC, exclusive); reimbursable days = ceil((end-start)/86400s)" }
      - { name: daily_rate_cents, type: integer, source: input, description: "Quoted daily rental rate in cents" }
      - { name: reimbursable_days, type: integer, source: computed, description: "min(requested_days, RENTAL coverage rental_max_days), capped further on total loss (see calc rental_reimbursement)" }
      - { name: reimbursement_cents, type: integer, source: computed, description: "Net rental reimbursement in cents after per-day cap and day cap" }
      - { name: status, type: enum, source: system, default: "PENDING", description: "PENDING | APPROVED | REJECTED" }

  - name: SubrogationCase
    parent: Claim
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: input, description: "FK -> Claim.id; the settled claim being subrogated" }
      - { name: target_party_id, type: string, source: input, description: "FK -> ClaimParty.id; the THIRD_PARTY whose carrier is pursued" }
      - { name: demand_cents, type: integer, source: input, description: "Gross demand amount before comparative-fault reduction, in cents" }
      - { name: recoverable_cents, type: integer, source: computed, description: "Net recoverable after comparative-negligence reduction by insured_fault_pct under the policy's comparative_fault_rule" }
      - { name: recovered_cents, type: integer, source: input, default: 0, description: "Amount actually recovered (input on RESOLVED), 0 while open" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | DEMAND_SENT | NEGOTIATING | RESOLVED | CLOSED_NO_RECOVERY" }

  - name: Disbursement
    parent: Claim
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: system, description: "FK -> Claim.id; the claim being paid (set by the creating cascade)" }
      - { name: disbursement_type, type: enum, source: system, description: "SETTLEMENT | RENTAL | SUBROGATION_RECOVERY — recovery is an inbound credit" }
      - { name: amount_cents, type: integer, source: system, description: "Signed amount in cents: positive outbound for SETTLEMENT/RENTAL, negative for SUBROGATION_RECOVERY credit" }
      - { name: source_entity_id, type: string, source: system, description: "FK -> Claim.id; the originating claim record (same as claim_id; pins the ledger source)" }
      - { name: status, type: enum, source: system, default: "APPROVED", description: "APPROVED | VOIDED — disbursements are created APPROVED by a cascade; a supervisor may VOID one (compensating action)" }

# =============================================================================
# Table 1.2: State Machine Table
# =============================================================================
state_machines:
  - entity: Claim
    initial_state: FNOL_SUBMITTED
    terminal_states: [CLOSED]
    transitions:
      - from: FNOL_SUBMITTED
        to: COVERAGE_VERIFIED
        trigger: "POST /claims/{id}/verify-coverage"
        actor: ClaimsAdjuster
        preconditions:
          - "Policy.status == ACTIVE"
          - "Claim.loss_datetime in [Policy.effective_date, Policy.expiration_date)"
          - "A Coverage row exists for the policy whose coverage_type matches Claim.loss_type (COLLISION->COLLISION, COMPREHENSIVE->COMPREHENSIVE)"
        side_effects:
          - "Creates a CoverageVerification with outcome=VERIFIED and matched_coverage_type set to the matched Coverage.coverage_type"
        note: "If any precondition fails the system instead transitions FNOL_SUBMITTED -> COVERAGE_DENIED (see next row)."

      - from: FNOL_SUBMITTED
        to: COVERAGE_DENIED
        trigger: "POST /claims/{id}/verify-coverage (preconditions not met)"
        actor: ClaimsAdjuster
        preconditions:
          - "At least one of: Policy.status != ACTIVE, loss_datetime outside coverage window, or no matching Coverage"
        side_effects:
          - "Creates a CoverageVerification with outcome=DENIED and denial_reason set (POLICY_INACTIVE | OUTSIDE_COVERAGE_WINDOW | NO_MATCHING_COVERAGE)"
        note: "COVERAGE_DENIED is non-terminal: a corrected policy can be re-verified only after REOPENED."

      - from: COVERAGE_VERIFIED
        to: UNDER_REVIEW
        trigger: "POST /claims/{id}/assign-adjuster"
        actor: ClaimsSupervisor
        preconditions:
          - "Target Adjuster.active == true"
          - "Claim.assigned_adjuster_id is null (not yet assigned)"
          - "expected_claim_version matches Claim.version (OCC)"
        side_effects:
          - "Sets Claim.assigned_adjuster_id to the target adjuster"
          - "increments Claim.version by 1"

      - from: UNDER_REVIEW
        to: REPAIR_APPROVED
        trigger: "POST /claims/{id}/decide-disposition (decision=REPAIR)"
        actor: ClaimsAdjuster
        preconditions:
          - "Exactly one RepairEstimate for this claim is in status SUBMITTED"
          - "No TotalLossEvaluation with is_total_loss=true exists for this claim"
          - "expected_claim_version matches Claim.version (OCC)"
        side_effects:
          - "Sets Claim.disposition = REPAIR"
          - "Recomputes Claim.settlement_cents via calculation repair_path_settlement"
          - "increments Claim.version by 1"

      - from: UNDER_REVIEW
        to: TOTAL_LOSS
        trigger: "POST /claims/{id}/decide-disposition (decision=TOTAL_LOSS)"
        actor: TotalLossAdjuster
        preconditions:
          - "A TotalLossEvaluation for this claim exists with is_total_loss=true"
          - "The TotalLossEvaluation.evaluated_by_adjuster_id differs from the SUBMITTED RepairEstimate.authored_by_adjuster_id (segregation of duties)"
          - "expected_claim_version matches Claim.version (OCC)"
        side_effects:
          - "Hop 1: sets Claim.disposition = TOTAL_LOSS and recomputes Claim.settlement_cents via calculation total_loss_settlement (deducts salvage when salvage_retained_by_insurer)"
          - "Hop 2 (caused by Hop 1's disposition flip to TOTAL_LOSS): recomputes every PENDING RentalReimbursement for this claim via calculation rental_reimbursement with day_cap = min(rental_max_days, TOTAL_LOSS_RENTAL_MAX_DAYS), lowering its reimbursable_days and reimbursement_cents"
          - "increments Claim.version by 1"
        note: "Transitive cascade (depth 2): TOTAL_LOSS decision -> Claim.disposition flips -> PENDING RentalReimbursement curtailed."

      - from: REPAIR_APPROVED
        to: SETTLED
        trigger: "POST /claims/{id}/settle"
        actor: ClaimsSupervisor
        preconditions:
          - "Claim.settlement_cents > 0"
          - "expected_claim_version matches Claim.version (OCC)"
        side_effects:
          - "Creates a SETTLEMENT Disbursement in status APPROVED for amount_cents = +Claim.settlement_cents"
          - "Recomputes Claim.total_disbursed_cents via calculation claim_ledger_balance"
          - "increments Claim.version by 1"

      - from: TOTAL_LOSS
        to: SETTLED
        trigger: "POST /claims/{id}/settle"
        actor: ClaimsSupervisor
        preconditions:
          - "Claim.settlement_cents > 0"
          - "expected_claim_version matches Claim.version (OCC)"
        side_effects:
          - "Creates a SETTLEMENT Disbursement in status APPROVED for amount_cents = +Claim.settlement_cents"
          - "Recomputes Claim.total_disbursed_cents via calculation claim_ledger_balance"
          - "increments Claim.version by 1"

      - from: SETTLED
        to: CLOSED
        trigger: "POST /claims/{id}/close"
        actor: ClaimsSupervisor
        preconditions:
          - "No SubrogationCase for this claim is in status OPEN, DEMAND_SENT, or NEGOTIATING (all subrogation resolved)"
          - "No RentalReimbursement for this claim is in status PENDING"
        side_effects: []

      - from: COVERAGE_DENIED
        to: REOPENED
        trigger: "POST /claims/{id}/reopen"
        actor: ClaimsSupervisor
        preconditions:
          - "Claim.status == COVERAGE_DENIED"
        side_effects:
          - "Clears the prior CoverageVerification linkage so coverage may be re-verified"

      - from: REOPENED
        to: COVERAGE_VERIFIED
        trigger: "POST /claims/{id}/verify-coverage"
        actor: ClaimsAdjuster
        preconditions:
          - "Policy.status == ACTIVE"
          - "Claim.loss_datetime in [Policy.effective_date, Policy.expiration_date)"
          - "A matching Coverage exists for Claim.loss_type"
        side_effects:
          - "Creates a new CoverageVerification with outcome=VERIFIED"

  - entity: RepairEstimate
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /repair-estimates/{id}/submit"
        actor: ClaimsAdjuster
        preconditions:
          - "Parent Claim.status == UNDER_REVIEW"
          - "authored_by_adjuster_id == Claim.assigned_adjuster_id (only the assigned adjuster submits)"
        side_effects:
          - "If another RepairEstimate for the same claim is already SUBMITTED, transitions that one to SUPERSEDED (cross-entity supersede)"
          - "Recomputes repair_total_cents"

      - from: SUBMITTED
        to: SUPERSEDED
        trigger: "system (a newer RepairEstimate for the same claim is submitted)"
        actor: system
        preconditions:
          - "A second RepairEstimate for the same claim transitions DRAFT -> SUBMITTED"
        side_effects: []

  - entity: SubrogationCase
    initial_state: OPEN
    terminal_states: [RESOLVED, CLOSED_NO_RECOVERY]
    transitions:
      - from: OPEN
        to: DEMAND_SENT
        trigger: "POST /subrogation-cases/{id}/send-demand"
        actor: SubrogationSpecialist
        preconditions:
          - "Parent Claim.status == SETTLED"
          - "recoverable_cents > 0"
        side_effects:
          - "Recomputes recoverable_cents via calculation subrogation_recovery"

      - from: DEMAND_SENT
        to: NEGOTIATING
        trigger: "POST /subrogation-cases/{id}/begin-negotiation"
        actor: SubrogationSpecialist
        preconditions: []
        side_effects: []

      - from: NEGOTIATING
        to: DEMAND_SENT
        trigger: "POST /subrogation-cases/{id}/send-demand"
        actor: SubrogationSpecialist
        preconditions:
          - "A revised demand_cents is supplied"
        side_effects:
          - "Recomputes recoverable_cents via calculation subrogation_recovery"
        note: "Cyclic revision loop: counter-offers bounce NEGOTIATING -> DEMAND_SENT repeatedly."

      - from: NEGOTIATING
        to: RESOLVED
        trigger: "POST /subrogation-cases/{id}/resolve (recovered_cents > 0)"
        actor: SubrogationSpecialist
        preconditions:
          - "recovered_cents > 0 and recovered_cents <= recoverable_cents"
        side_effects:
          - "Hop 1: SubrogationCase.status -> RESOLVED and SubrogationCase.recovered_cents set"
          - "Hop 2 (caused by Hop 1): creates a SUBROGATION_RECOVERY Disbursement in status APPROVED for amount_cents = -recovered_cents (inbound credit)"
          - "Hop 3 (caused by Hop 2's Disbursement creation): recomputes parent Claim.total_disbursed_cents via calculation claim_ledger_balance"
        note: "Transitive cascade (depth 3): resolve -> SubrogationCase RESOLVED -> Disbursement created -> Claim.total_disbursed_cents recomputed."

      - from: DEMAND_SENT
        to: CLOSED_NO_RECOVERY
        trigger: "POST /subrogation-cases/{id}/resolve (recovered_cents == 0)"
        actor: SubrogationSpecialist
        preconditions:
          - "recovered_cents == 0"
        side_effects: []

      - from: NEGOTIATING
        to: CLOSED_NO_RECOVERY
        trigger: "POST /subrogation-cases/{id}/resolve (recovered_cents == 0)"
        actor: SubrogationSpecialist
        preconditions:
          - "recovered_cents == 0"
        side_effects: []

  - entity: RentalReimbursement
    initial_state: PENDING
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /rental-reimbursements/{id}/approve"
        actor: ClaimsAdjuster
        preconditions:
          - "Parent Claim has a VERIFIED CoverageVerification AND the policy carries a RENTAL Coverage"
          - "reimbursement_cents > 0"
        side_effects:
          - "Creates a RENTAL Disbursement in status APPROVED for amount_cents = +reimbursement_cents"
          - "Recomputes parent Claim.total_disbursed_cents via calculation claim_ledger_balance"

      - from: PENDING
        to: REJECTED
        trigger: "POST /rental-reimbursements/{id}/reject"
        actor: ClaimsAdjuster
        preconditions:
          - "reimbursement_cents == 0 OR the policy carries no RENTAL Coverage"
        side_effects: []

  - entity: Disbursement
    initial_state: APPROVED
    terminal_states: [VOIDED]
    transitions:
      - from: APPROVED
        to: VOIDED
        trigger: "POST /disbursements/{id}/void"
        actor: ClaimsSupervisor
        preconditions:
          - "Disbursement.status == APPROVED"
        side_effects:
          - "Hop 1: Disbursement.status -> VOIDED (its amount_cents drops out of the APPROVED sum)"
          - "Hop 2 (caused by Hop 1): recomputes parent Claim.total_disbursed_cents via calculation claim_ledger_balance"
        note: "Compensating action for a Disbursement: voiding it restores Claim.total_disbursed_cents to the value it held before the disbursement was created (cash conservation)."

# =============================================================================
# Table 1.2.1: Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: disposition-decision-stale-claim
    parent_entity: Claim
    write_endpoint: "POST /claims/{id}/decide-disposition"
    occ_field: "expected_claim_version"
    description: |
      Deciding disposition against a Claim whose version has advanced since the
      client last observed it is rejected with a stale-version error. Disposition
      writes settlement_cents and the disposition branch; a stale view means the
      client is deciding on an outdated estimate/evaluation snapshot, so the write
      is refused until the client re-reads the claim.
    error_id: ERR_STALE_CLAIM_VERSION
    http_status: 412

  - rule_id: assign-adjuster-stale-claim
    parent_entity: Claim
    write_endpoint: "POST /claims/{id}/assign-adjuster"
    occ_field: "expected_claim_version"
    description: |
      Assigning an adjuster against a Claim whose version has advanced since the
      client last read it is rejected with a stale-version error. A stale view
      means another assignment (or reopen) already mutated the claim; the loser's
      expected_claim_version no longer matches and the write is refused.
    error_id: ERR_STALE_CLAIM_VERSION
    http_status: 412

  - rule_id: settle-stale-claim
    parent_entity: Claim
    write_endpoint: "POST /claims/{id}/settle"
    occ_field: "expected_claim_version"
    description: |
      Settling a Claim whose version has advanced since the client last observed
      it is rejected with a stale-version error. Because disposition mutations bump
      the version, a settle carrying a pre-disposition version is stale and refused.
    error_id: ERR_STALE_CLAIM_VERSION
    http_status: 412

# =============================================================================
# Table 1.3: Calculation Rules Table
# =============================================================================
calculations:
  - name: repair_total
    trigger: "On POST /repair-estimates and on POST /repair-estimates/{id}/submit"
    algorithm: aggregation
    formula: |
      repair_total_cents = sum over each line in lines of (line.labor_cents + line.parts_cents)
      # Each line is summed as whole cents; no intermediate rounding (all inputs are integer cents).
    input_set: "All lines on the estimate; no status filter (lines are immutable inputs of the estimate)."
    precision: "integer cents, exact (no rounding — all inputs integer cents)"

  - name: repair_path_settlement
    trigger: "On POST /claims/{id}/decide-disposition with decision=REPAIR (Claim UNDER_REVIEW -> REPAIR_APPROVED)"
    algorithm: threshold
    formula: |
      # First-party repair payout. Deductible is withheld; payout is capped at the coverage limit.
      gross = SUBMITTED RepairEstimate.repair_total_cents
      after_deductible = max(0, gross - matched_Coverage.deductible_cents)
      settlement_cents = min(after_deductible, matched_Coverage.limit_cents)
      # comparative-negligence insured_fault_pct does NOT reduce first-party collision/comp payout
      # (it reduces only third-party subrogation recovery — see subrogation_recovery).
    input_set: "The single SUBMITTED RepairEstimate for the claim and the matched Coverage (the policy's Coverage whose coverage_type == CoverageVerification.matched_coverage_type)."
    constants: {}
    precision: "integer cents; max/min over integers, no rounding"
    variants:
      - name: under_limit
        when: "after_deductible <= coverage limit"
        difference: "settlement = gross - deductible"
      - name: limit_capped
        when: "after_deductible > coverage limit"
        difference: "settlement = coverage limit (the excess is the insured's responsibility)"

  - name: total_loss_decision
    trigger: "On POST /total-loss-evaluations (computes total_loss_ratio and is_total_loss)"
    algorithm: threshold
    formula: |
      total_loss_ratio = round(repair_total_cents / acv_cents, 4)   # round_half_up, 4 decimals
      is_total_loss = (total_loss_ratio >= TOTAL_LOSS_THRESHOLD)     # >= boundary, NOT >
      # acv_cents and repair_total_cents are snapshots taken at evaluation time.
    input_set: "Snapshot of Claim.vehicle_acv_cents and the SUBMITTED RepairEstimate.repair_total_cents at evaluation creation."
    constants:
      TOTAL_LOSS_THRESHOLD: 0.75   # repair-to-ACV ratio at or above which the vehicle is a total loss
    precision: "ratio rounded to 4 decimals, round_half_up; boundary is inclusive (>=)"
    variants:
      - name: at_threshold
        when: "total_loss_ratio == 0.7500 exactly"
        difference: "is_total_loss = true (>= is inclusive; a ratio of exactly 0.75 IS a total loss)"
      - name: below_threshold
        when: "total_loss_ratio == 0.7499"
        difference: "is_total_loss = false (just below the boundary stays on the repair path)"

  - name: total_loss_settlement
    trigger: "On POST /claims/{id}/decide-disposition with decision=TOTAL_LOSS (Claim UNDER_REVIEW -> TOTAL_LOSS)"
    algorithm: threshold
    formula: |
      # First-party total-loss payout: pay ACV, withhold deductible, optionally net out salvage, cap at limit.
      base = TotalLossEvaluation.acv_cents
      after_salvage = base - (Claim.salvage_value_cents if TotalLossEvaluation.salvage_retained_by_insurer else 0)
      after_deductible = max(0, after_salvage - matched_Coverage.deductible_cents)
      settlement_cents = min(after_deductible, matched_Coverage.limit_cents)
      # Evaluation order is pinned: salvage first, THEN deductible, THEN limit cap.
    input_set: "The TotalLossEvaluation (acv snapshot + salvage_retained flag), Claim.salvage_value_cents, and the matched Coverage."
    constants: {}
    precision: "integer cents; evaluation order salvage -> deductible -> limit is fixed"
    variants:
      - name: salvage_retained
        when: "TotalLossEvaluation.salvage_retained_by_insurer == true"
        difference: "salvage_value_cents is subtracted from ACV before deductible"
      - name: salvage_to_insured
        when: "TotalLossEvaluation.salvage_retained_by_insurer == false"
        difference: "salvage is NOT subtracted (insured keeps the wreck); payout is higher by salvage_value_cents"

  - name: rental_reimbursement
    trigger: "On POST /rental-reimbursements (compute) and recomputed on the TOTAL_LOSS disposition cascade"
    algorithm: aggregation
    formula: |
      requested_days = ceil((rental_end_date - rental_start_date) / 86400 seconds)   # half-open interval
      day_cap = RENTAL_Coverage.rental_max_days
      if parent Claim.disposition == TOTAL_LOSS: day_cap = min(day_cap, TOTAL_LOSS_RENTAL_MAX_DAYS)
      reimbursable_days = min(requested_days, day_cap)
      per_day = min(daily_rate_cents, RENTAL_Coverage.rental_daily_cap_cents)
      reimbursement_cents = reimbursable_days * per_day
      # Per-day cap is applied BEFORE multiplying by days (cap each day, then sum), NOT after.
    input_set: "The RentalReimbursement row, the policy's RENTAL Coverage (daily cap + max days), and parent Claim.disposition."
    constants:
      TOTAL_LOSS_RENTAL_MAX_DAYS: 5   # on a total loss, rental is curtailed to at most 5 days
    precision: "integer cents; day count via ceil of half-open interval; per-day cap applied before summation"
    variants:
      - name: repair_path_days
        when: "Claim.disposition != TOTAL_LOSS"
        difference: "day_cap = rental_max_days (full rental window allowed)"
      - name: total_loss_curtailed
        when: "Claim.disposition == TOTAL_LOSS"
        difference: "day_cap = min(rental_max_days, 5); rental is curtailed because the insured is paid out and no longer repairing"

  - name: subrogation_recovery
    trigger: "On POST /subrogation-cases/{id}/send-demand (computes recoverable_cents)"
    algorithm: threshold
    formula: |
      # Comparative-negligence reduction of a third-party recovery by the INSURED's fault.
      rule = parent Policy.comparative_fault_rule
      f = Claim.insured_fault_pct        # 0..100
      if rule == PURE:
          recoverable_cents = round(demand_cents * (100 - f) / 100, 0)     # always reduced by f%
      elif rule == MODIFIED_50:
          recoverable_cents = 0 if f >= 50 else round(demand_cents * (100 - f) / 100, 0)
      elif rule == MODIFIED_51:
          recoverable_cents = 0 if f >= 51 else round(demand_cents * (100 - f) / 100, 0)
      # Rounding: round_half_up to whole cents AFTER the percentage multiply (round once at the end).
    input_set: "The SubrogationCase.demand_cents, parent Claim.insured_fault_pct, and parent Policy.comparative_fault_rule."
    constants: {}
    precision: "integer cents; round_half_up applied once after the multiply (NOT per-intermediate)"
    variants:
      - name: pure_comparative
        when: "comparative_fault_rule == PURE"
        difference: "recovery always reduced by insured fault %, never zeroed by a bar"
      - name: modified_50_barred
        when: "comparative_fault_rule == MODIFIED_50 and insured_fault_pct >= 50"
        difference: "recovery is zeroed (the 50%-bar): at exactly 50% fault recovery = 0"
      - name: modified_51_barred
        when: "comparative_fault_rule == MODIFIED_51 and insured_fault_pct >= 51"
        difference: "recovery is zeroed only at 51%+; at exactly 50% the insured still recovers 50% of demand"

  - name: claim_ledger_balance
    trigger: "On every APPROVED Disbursement creation (settle, rental approve, subrogation resolve) to refresh Claim.total_disbursed_cents; also computed at read time for GET /claims/{id}/ledger"
    algorithm: aggregation
    formula: |
      net_paid_cents = sum over APPROVED Disbursements for the claim of amount_cents
      total_disbursed_cents = net_paid_cents   # the denormalized Claim field is set to this value
      # SETTLEMENT and RENTAL are positive (outbound); SUBROGATION_RECOVERY is negative (credit).
      # Invariant: a SUBROGATION_RECOVERY of -X paired with the original SETTLEMENT must leave
      # net_paid_cents reduced by exactly X — the ledger conserves total cash to the cent.
    input_set: "All Disbursement rows for the claim with status == APPROVED; PENDING and VOIDED excluded; ordered by created_at ASC for deterministic replay."
    constants: {}
    precision: "integer cents; sum is exact"

# =============================================================================
# Table 1.4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Acting role is permitted for the operation per §1.7 RBAC"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path/body-referenced resources exist (Claim, Policy, Adjuster, Coverage, RepairEstimate, etc.), validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a path id or FK body field"

  - priority: 4
    category: business_referential
    check: "Required input fields present and well-typed; enums in their declared set; fault_pct in 0..100"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all write endpoints"

  - priority: 5
    category: state
    check: "Target resource is in a state from which the requested transition is defined (§1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 6
    category: state
    check: "OCC: expected_claim_version equals current Claim.version on assign-adjuster, decide-disposition, settle"
    error_id: ERR_STALE_CLAIM_VERSION
    http_status: 412
    applies_to: "POST /claims/{id}/assign-adjuster, POST /claims/{id}/decide-disposition, POST /claims/{id}/settle"

  - priority: 7
    category: business_safety
    check: "Segregation of duties: the TotalLossEvaluation author must differ from the SUBMITTED RepairEstimate author before TOTAL_LOSS disposition"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /claims/{id}/decide-disposition (decision=TOTAL_LOSS)"

  - priority: 8
    category: business_safety
    check: "A TotalLossEvaluation may be authored only by a SENIOR-tier adjuster"
    error_id: ERR_SENIOR_TIER_REQUIRED
    http_status: 409
    applies_to: "POST /total-loss-evaluations"

  - priority: 9
    category: business_constraint
    check: "Coverage uniqueness: at most one Coverage per (policy_id, coverage_type)"
    error_id: ERR_DUPLICATE_COVERAGE
    http_status: 409
    applies_to: "POST /policies/{id}/coverages"

  - priority: 10
    category: business_constraint
    check: "At most one ClaimParty with party_role=INSURED per claim"
    error_id: ERR_DUPLICATE_INSURED_PARTY
    http_status: 409
    applies_to: "POST /claim-parties"

  - priority: 11
    category: business_constraint
    check: "decide-disposition=REPAIR requires exactly one SUBMITTED RepairEstimate and no is_total_loss evaluation"
    error_id: ERR_NO_SUBMITTED_ESTIMATE
    http_status: 409
    applies_to: "POST /claims/{id}/decide-disposition (decision=REPAIR)"

  - priority: 12
    category: business_constraint
    check: "decide-disposition=TOTAL_LOSS requires a TotalLossEvaluation with is_total_loss=true"
    error_id: ERR_NOT_A_TOTAL_LOSS
    http_status: 409
    applies_to: "POST /claims/{id}/decide-disposition (decision=TOTAL_LOSS)"

  - priority: 13
    category: business_constraint
    check: "Subrogation send-demand requires recoverable_cents > 0 (a fully-barred recovery cannot be demanded)"
    error_id: ERR_NO_RECOVERABLE_AMOUNT
    http_status: 409
    applies_to: "POST /subrogation-cases/{id}/send-demand"

  - priority: 14
    category: business_temporal
    check: "RentalReimbursement rental_end_date must be strictly after rental_start_date (positive interval)"
    error_id: ERR_INVALID_RENTAL_INTERVAL
    http_status: 422
    applies_to: "POST /rental-reimbursements"

  - priority: 15
    category: business_fiscal
    check: "Subrogation resolve recovered_cents must be 0 <= recovered_cents <= recoverable_cents"
    error_id: ERR_RECOVERY_EXCEEDS_DEMAND
    http_status: 409
    applies_to: "POST /subrogation-cases/{id}/resolve"

  - priority: 16
    category: business_fiscal
    check: "Settle requires Claim.settlement_cents > 0 (no zero-value settlement disbursement)"
    error_id: ERR_NO_SETTLEMENT_AMOUNT
    http_status: 409
    applies_to: "POST /claims/{id}/settle"

  - priority: 17
    category: business_temporal
    check: |
      Rental-period overlap on the same Claim: a new RentalReimbursement's half-open
      interval [rental_start_date, rental_end_date) must not overlap the half-open interval
      of any existing PENDING or APPROVED RentalReimbursement on the same claim.
      ADJACENCY IS ALLOWED: end_A == start_B is NOT an overlap (touching endpoints do not collide).
      Overlap iff start_A < end_B AND start_B < end_A.
    error_id: ERR_RENTAL_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /rental-reimbursements"

  - priority: 18
    category: business_temporal
    check: |
      Policy-period overlap for the same policyholder_name: a new Policy's CLOSED interval
      [effective_date, expiration_date] must not overlap the closed interval of any existing
      non-CANCELLED Policy (status IN {ACTIVE, LAPSED}) with the same policyholder_name.
      ADJACENCY IS REJECTED: touching endpoints DO collide (a new policy's effective_date must be
      strictly after the prior policy's expiration_date). Overlap iff start_A <= end_B AND start_B <= end_A.
    error_id: ERR_POLICY_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /policies"

# =============================================================================
# Table 1.5: API Endpoint Table
# =============================================================================
endpoints:
  # ---- Policies & Coverages ----
  - method: POST
    path: "/policies"
    description: "Create a policy"
    roles: [ClaimsSupervisor]
    code: 201
    input: ["policyholder_name", "policy_number", "effective_date", "expiration_date", "comparative_fault_rule?"]
    output: Policy
    side_effects: ["Policy created in status ACTIVE"]

  - method: GET
    path: "/policies/{id}"
    description: "Fetch a policy"
    roles: [ClaimsSupervisor, ClaimsAdjuster, TotalLossAdjuster, SubrogationSpecialist]
    code: 200
    input: []
    output: Policy
    side_effects: []

  - method: POST
    path: "/policies/{id}/lapse"
    description: "Mark a policy LAPSED (admin correction)"
    roles: [ClaimsSupervisor]
    code: 200
    input: []
    output: Policy
    side_effects: ["Policy.status -> LAPSED"]

  - method: POST
    path: "/policies/{id}/coverages"
    description: "Add a coverage line to a policy"
    roles: [ClaimsSupervisor]
    code: 201
    input: ["coverage_type", "limit_cents", "deductible_cents?", "rental_daily_cap_cents?", "rental_max_days?"]
    output: Coverage
    side_effects: ["Coverage created under the policy"]

  - method: GET
    path: "/policies/{id}/coverages"
    description: "List coverages for a policy (FK reverse-reachability for Coverage.policy_id)"
    roles: [ClaimsSupervisor, ClaimsAdjuster, TotalLossAdjuster, SubrogationSpecialist]
    code: 200
    input: ["limit?", "offset?"]
    output: Coverage[]
    side_effects: []

  # ---- Adjusters ----
  - method: POST
    path: "/adjusters"
    description: "Create an adjuster"
    roles: [ClaimsSupervisor]
    code: 201
    input: ["full_name", "license_tier?", "active?"]
    output: Adjuster
    side_effects: []

  - method: GET
    path: "/adjusters/{id}"
    description: "Fetch an adjuster"
    roles: [ClaimsSupervisor, ClaimsAdjuster, TotalLossAdjuster]
    code: 200
    input: []
    output: Adjuster
    side_effects: []

  # ---- Claims (FNOL lifecycle) ----
  - method: POST
    path: "/claims"
    description: "File a first notice of loss (FNOL)"
    roles: [ClaimsAdjuster, ClaimsSupervisor]
    code: 201
    input: ["policy_id", "loss_datetime", "loss_type", "vehicle_acv_cents", "insured_fault_pct?", "salvage_value_cents?"]
    output: Claim
    side_effects: ["Claim created in status FNOL_SUBMITTED, version=1, disposition=null, settlement_cents=0"]

  - method: GET
    path: "/claims/{id}"
    description: "Fetch a claim"
    roles: [ClaimsSupervisor, ClaimsAdjuster, TotalLossAdjuster, SubrogationSpecialist]
    code: 200
    input: []
    output: Claim
    side_effects: []

  - method: GET
    path: "/claims"
    description: "List claims, optionally filtered by policy_id (FK reverse-reachability for Claim.policy_id) or assigned_adjuster_id (FK reverse-reachability for Claim.assigned_adjuster_id)"
    roles: [ClaimsSupervisor, ClaimsAdjuster, TotalLossAdjuster, SubrogationSpecialist]
    code: 200
    input: ["policy_id?", "assigned_adjuster_id?", "status?", "limit?", "offset?"]
    output: Claim[]
    side_effects: []

  - method: POST
    path: "/claims/{id}/verify-coverage"
    description: "Run coverage verification; transitions to COVERAGE_VERIFIED or COVERAGE_DENIED"
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: Claim
    side_effects: ["Creates a CoverageVerification (VERIFIED or DENIED); sets Claim.status accordingly"]

  - method: POST
    path: "/claims/{id}/assign-adjuster"
    description: "Assign an adjuster to a verified claim (OCC-guarded)"
    roles: [ClaimsSupervisor]
    code: 200
    input: [adjuster_id, expected_claim_version]
    output: Claim
    side_effects: ["Sets assigned_adjuster_id; status -> UNDER_REVIEW; increments Claim.version by 1"]

  - method: POST
    path: "/claims/{id}/decide-disposition"
    description: "Decide REPAIR or TOTAL_LOSS disposition (OCC-guarded); computes settlement_cents"
    roles: [ClaimsAdjuster, TotalLossAdjuster]
    code: 200
    input: [decision, expected_claim_version]
    output: Claim
    side_effects: ["Sets disposition; recomputes settlement_cents (repair_path_settlement or total_loss_settlement); on TOTAL_LOSS caps PENDING rentals; increments Claim.version by 1"]

  - method: POST
    path: "/claims/{id}/settle"
    description: "Settle an approved claim, emitting a SETTLEMENT disbursement (OCC-guarded)"
    roles: [ClaimsSupervisor]
    code: 200
    input: [expected_claim_version]
    output: Claim
    side_effects: ["Creates an APPROVED SETTLEMENT Disbursement for settlement_cents; status -> SETTLED; increments Claim.version by 1"]

  - method: POST
    path: "/claims/{id}/close"
    description: "Close a settled claim once subrogation and rentals are resolved"
    roles: [ClaimsSupervisor]
    code: 200
    input: []
    output: Claim
    side_effects: ["status -> CLOSED"]

  - method: POST
    path: "/claims/{id}/reopen"
    description: "Reopen a coverage-denied claim for re-verification"
    roles: [ClaimsSupervisor]
    code: 200
    input: []
    output: Claim
    side_effects: ["status -> REOPENED; clears prior CoverageVerification linkage"]

  - method: GET
    path: "/claims/{id}/ledger"
    description: "Computed read: net cash ledger over the claim's APPROVED disbursements"
    roles: [ClaimsSupervisor, ClaimsAdjuster, SubrogationSpecialist]
    code: 200
    input: []
    output: "{ net_paid_cents: integer, disbursement_count: integer }"
    side_effects: []

  - method: GET
    path: "/claims/{id}/coverage-verifications"
    description: "List coverage verifications for a claim (FK reverse-reachability for CoverageVerification.claim_id)"
    roles: [ClaimsSupervisor, ClaimsAdjuster]
    code: 200
    input: ["limit?", "offset?"]
    output: CoverageVerification[]
    side_effects: []

  - method: GET
    path: "/claims/{id}/parties"
    description: "List parties for a claim (FK reverse-reachability for ClaimParty.claim_id)"
    roles: [ClaimsSupervisor, ClaimsAdjuster, SubrogationSpecialist]
    code: 200
    input: ["limit?", "offset?"]
    output: ClaimParty[]
    side_effects: []

  - method: GET
    path: "/claims/{id}/disbursements"
    description: "List disbursements for a claim (FK reverse-reachability for Disbursement.claim_id and Disbursement.source_entity_id)"
    roles: [ClaimsSupervisor, ClaimsAdjuster, SubrogationSpecialist]
    code: 200
    input: ["limit?", "offset?"]
    output: Disbursement[]
    side_effects: []

  # ---- Claim parties ----
  - method: POST
    path: "/claim-parties"
    description: "Add a party (INSURED or THIRD_PARTY) to a claim"
    roles: [ClaimsAdjuster, ClaimsSupervisor]
    code: 201
    input: ["claim_id", "party_role", "display_name", "fault_pct?", "at_fault_carrier_name?"]
    output: ClaimParty
    side_effects: ["ClaimParty created"]

  # ---- Repair estimates ----
  - method: POST
    path: "/repair-estimates"
    description: "Create a draft repair estimate for a claim"
    roles: [ClaimsAdjuster]
    code: 201
    input: [claim_id, lines]
    output: RepairEstimate
    side_effects: ["RepairEstimate created in DRAFT; authored_by_adjuster_id set to acting adjuster; repair_total_cents computed"]

  - method: GET
    path: "/repair-estimates/{id}"
    description: "Fetch a repair estimate"
    roles: [ClaimsSupervisor, ClaimsAdjuster, TotalLossAdjuster]
    code: 200
    input: []
    output: RepairEstimate
    side_effects: []

  - method: GET
    path: "/repair-estimates"
    description: "List repair estimates filtered by claim_id (FK reverse-reachability for RepairEstimate.claim_id) or authored_by_adjuster_id (FK reverse-reachability for RepairEstimate.authored_by_adjuster_id)"
    roles: [ClaimsSupervisor, ClaimsAdjuster, TotalLossAdjuster]
    code: 200
    input: ["claim_id?", "authored_by_adjuster_id?", "status?", "limit?", "offset?"]
    output: RepairEstimate[]
    side_effects: []

  - method: POST
    path: "/repair-estimates/{id}/submit"
    description: "Submit a draft estimate; supersedes any prior SUBMITTED estimate on the same claim"
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: RepairEstimate
    side_effects: ["status -> SUBMITTED; supersedes prior SUBMITTED estimate (cross-entity); recomputes repair_total_cents"]

  # ---- Total-loss evaluations ----
  - method: POST
    path: "/total-loss-evaluations"
    description: "A SENIOR adjuster authors a total-loss evaluation, computing ratio and is_total_loss"
    roles: [TotalLossAdjuster]
    code: 201
    input: ["claim_id", "salvage_retained_by_insurer?"]
    output: TotalLossEvaluation
    side_effects: ["Snapshots acv_cents and repair_total_cents; computes total_loss_ratio and is_total_loss; evaluated_by_adjuster_id set to acting adjuster"]

  - method: GET
    path: "/total-loss-evaluations/{id}"
    description: "Fetch a total-loss evaluation"
    roles: [ClaimsSupervisor, ClaimsAdjuster, TotalLossAdjuster]
    code: 200
    input: []
    output: TotalLossEvaluation
    side_effects: []

  - method: GET
    path: "/total-loss-evaluations"
    description: "List total-loss evaluations filtered by claim_id (FK reverse-reachability for TotalLossEvaluation.claim_id) or evaluated_by_adjuster_id (FK reverse-reachability for TotalLossEvaluation.evaluated_by_adjuster_id)"
    roles: [ClaimsSupervisor, ClaimsAdjuster, TotalLossAdjuster]
    code: 200
    input: ["claim_id?", "evaluated_by_adjuster_id?", "limit?", "offset?"]
    output: TotalLossEvaluation[]
    side_effects: []

  # ---- Rental reimbursements ----
  - method: POST
    path: "/rental-reimbursements"
    description: "Compute a rental reimbursement for a claim"
    roles: [ClaimsAdjuster]
    code: 201
    input: [claim_id, rental_start_date, rental_end_date, daily_rate_cents]
    output: RentalReimbursement
    side_effects: ["Computes reimbursable_days and reimbursement_cents (rental_reimbursement calc); status PENDING"]

  - method: GET
    path: "/rental-reimbursements/{id}"
    description: "Fetch a rental reimbursement"
    roles: [ClaimsSupervisor, ClaimsAdjuster]
    code: 200
    input: []
    output: RentalReimbursement
    side_effects: []

  - method: GET
    path: "/rental-reimbursements"
    description: "List rental reimbursements filtered by claim_id (FK reverse-reachability for RentalReimbursement.claim_id)"
    roles: [ClaimsSupervisor, ClaimsAdjuster]
    code: 200
    input: ["claim_id?", "status?", "limit?", "offset?"]
    output: RentalReimbursement[]
    side_effects: []

  - method: POST
    path: "/rental-reimbursements/{id}/approve"
    description: "Approve a rental reimbursement, emitting a RENTAL disbursement"
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: RentalReimbursement
    side_effects: ["status -> APPROVED; creates an APPROVED RENTAL Disbursement for reimbursement_cents"]

  - method: POST
    path: "/rental-reimbursements/{id}/reject"
    description: "Reject a rental reimbursement"
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: RentalReimbursement
    side_effects: ["status -> REJECTED"]

  # ---- Subrogation ----
  - method: POST
    path: "/subrogation-cases"
    description: "Open a subrogation case against a third party for a settled claim"
    roles: [SubrogationSpecialist]
    code: 201
    input: [claim_id, target_party_id, demand_cents]
    output: SubrogationCase
    side_effects: ["SubrogationCase created in OPEN; recoverable_cents computed via subrogation_recovery"]

  - method: GET
    path: "/subrogation-cases/{id}"
    description: "Fetch a subrogation case"
    roles: [ClaimsSupervisor, SubrogationSpecialist]
    code: 200
    input: []
    output: SubrogationCase
    side_effects: []

  - method: GET
    path: "/subrogation-cases"
    description: "List subrogation cases filtered by claim_id (FK reverse-reachability for SubrogationCase.claim_id) or target_party_id (FK reverse-reachability for SubrogationCase.target_party_id)"
    roles: [ClaimsSupervisor, SubrogationSpecialist]
    code: 200
    input: ["claim_id?", "target_party_id?", "status?", "limit?", "offset?"]
    output: SubrogationCase[]
    side_effects: []

  - method: POST
    path: "/subrogation-cases/{id}/send-demand"
    description: "Send (or re-send a revised) demand; recomputes recoverable_cents"
    roles: [SubrogationSpecialist]
    code: 200
    input: ["demand_cents?"]
    output: SubrogationCase
    side_effects: ["status -> DEMAND_SENT; recomputes recoverable_cents via subrogation_recovery"]

  - method: POST
    path: "/subrogation-cases/{id}/begin-negotiation"
    description: "Move a sent demand into negotiation"
    roles: [SubrogationSpecialist]
    code: 200
    input: []
    output: SubrogationCase
    side_effects: ["status -> NEGOTIATING"]

  - method: POST
    path: "/subrogation-cases/{id}/resolve"
    description: "Resolve a subrogation case with a recovered amount (or 0 for no recovery)"
    roles: [SubrogationSpecialist]
    code: 200
    input: [recovered_cents]
    output: SubrogationCase
    side_effects: ["status -> RESOLVED (recovered>0) or CLOSED_NO_RECOVERY (recovered==0); on RESOLVED creates a SUBROGATION_RECOVERY Disbursement for -recovered_cents"]

  # ---- Disbursements ----
  - method: GET
    path: "/disbursements/{id}"
    description: "Fetch a disbursement"
    roles: [ClaimsSupervisor, ClaimsAdjuster, SubrogationSpecialist]
    code: 200
    input: []
    output: Disbursement
    side_effects: []

  - method: POST
    path: "/disbursements/{id}/void"
    description: "Void an APPROVED disbursement (compensating action); restores Claim.total_disbursed_cents"
    roles: [ClaimsSupervisor]
    code: 200
    input: []
    output: Disbursement
    side_effects: ["status -> VOIDED; recomputes parent Claim.total_disbursed_cents via claim_ledger_balance"]

# =============================================================================
# Table 1.6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID header, or unknown role" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Acting role not permitted for this operation" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced Claim/Policy/Adjuster/Coverage/RepairEstimate/etc. does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Missing required field, bad type, enum out of set, or fault_pct outside 0..100" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Requested transition is not defined from the resource's current state" }
  - { id: ERR_STALE_CLAIM_VERSION, http: 412, condition: "expected_claim_version does not match current Claim.version (OCC)" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 409, condition: "TotalLossEvaluation author equals the SUBMITTED RepairEstimate author on TOTAL_LOSS disposition" }
  - { id: ERR_SENIOR_TIER_REQUIRED, http: 409, condition: "TotalLossEvaluation authored by a non-SENIOR adjuster" }
  - { id: ERR_DUPLICATE_COVERAGE, http: 409, condition: "A Coverage of the same coverage_type already exists for the policy" }
  - { id: ERR_DUPLICATE_INSURED_PARTY, http: 409, condition: "A second INSURED party added to a claim" }
  - { id: ERR_NO_SUBMITTED_ESTIMATE, http: 409, condition: "REPAIR disposition requested with no single SUBMITTED estimate" }
  - { id: ERR_NOT_A_TOTAL_LOSS, http: 409, condition: "TOTAL_LOSS disposition requested with no is_total_loss=true evaluation" }
  - { id: ERR_NO_RECOVERABLE_AMOUNT, http: 409, condition: "send-demand attempted when recoverable_cents == 0" }
  - { id: ERR_INVALID_RENTAL_INTERVAL, http: 422, condition: "rental_end_date not strictly after rental_start_date" }
  - { id: ERR_RECOVERY_EXCEEDS_DEMAND, http: 409, condition: "recovered_cents > recoverable_cents or recovered_cents < 0 on resolve" }
  - { id: ERR_NO_SETTLEMENT_AMOUNT, http: 409, condition: "settle attempted when Claim.settlement_cents == 0" }
  - { id: ERR_RENTAL_PERIOD_OVERLAP, http: 409, condition: "new rental's half-open interval overlaps an existing PENDING/APPROVED rental on the same claim (adjacency allowed)" }
  - { id: ERR_POLICY_PERIOD_OVERLAP, http: 409, condition: "new policy's closed interval overlaps a non-CANCELLED policy with the same policyholder_name (adjacency rejected)" }

# =============================================================================
# Table 1.7: RBAC Matrix
# =============================================================================
roles:
  - name: ClaimsSupervisor
    description: "Sets up policies/coverages/adjusters, assigns adjusters, settles and closes claims; the disbursement-approval authority"
    identity: opaque
    exclusive_operations:
      - "POST /policies"
      - "POST /policies/{id}/lapse"
      - "POST /policies/{id}/coverages"
      - "POST /adjusters"
      - "POST /claims/{id}/assign-adjuster"
      - "POST /claims/{id}/settle"
      - "POST /claims/{id}/close"
      - "POST /claims/{id}/reopen"
      - "POST /disbursements/{id}/void"
    shared_operations:
      - "POST /claims"
      - "POST /claim-parties"
      - "GET endpoints"

  - name: ClaimsAdjuster
    description: "Front-line adjuster: files FNOL, verifies coverage, authors/submits repair estimates, computes rentals, decides REPAIR disposition"
    identity: "entity_backed:Adjuster"
    exclusive_operations:
      - "POST /claims/{id}/verify-coverage"
      - "POST /repair-estimates"
      - "POST /repair-estimates/{id}/submit"
      - "POST /rental-reimbursements"
      - "POST /rental-reimbursements/{id}/approve"
      - "POST /rental-reimbursements/{id}/reject"
    shared_operations:
      - "POST /claims"
      - "POST /claim-parties"
      - "POST /claims/{id}/decide-disposition (decision=REPAIR)"
      - "GET endpoints"

  - name: TotalLossAdjuster
    description: "SENIOR adjuster who authors total-loss evaluations and decides the TOTAL_LOSS disposition; segregated from the repair-estimate author"
    identity: "entity_backed:Adjuster"
    exclusive_operations:
      - "POST /total-loss-evaluations"
    shared_operations:
      - "POST /claims/{id}/decide-disposition (decision=TOTAL_LOSS)"
      - "GET endpoints"

  - name: SubrogationSpecialist
    description: "Pursues third-party recovery on settled claims: opens cases, sends demands, negotiates, resolves"
    identity: opaque
    exclusive_operations:
      - "POST /subrogation-cases"
      - "POST /subrogation-cases/{id}/send-demand"
      - "POST /subrogation-cases/{id}/begin-negotiation"
      - "POST /subrogation-cases/{id}/resolve"
    shared_operations:
      - "GET endpoints"
