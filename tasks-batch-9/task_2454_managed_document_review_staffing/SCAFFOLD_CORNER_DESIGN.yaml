                starts_at_utc: "2026-08-15T00:00:00Z"
                ends_at_utc: "2026-08-20T00:00:00Z"
              as: Reviewer
              as_user_id: "${ra_id}"
              captures: { err_overlap: $.data.error_id }
          assert:
            - "first call: HTTP 422 with error_id \"ERR_INVALID_TIME_WINDOW\" — start must be strictly before end"
            - "second call: HTTP 409 with error_id \"ERR_SESSION_OUTSIDE_COVERAGE\" — the window starts one day after coverage ends"
            - "third call: HTTP 201 with status \"SCHEDULED\""
