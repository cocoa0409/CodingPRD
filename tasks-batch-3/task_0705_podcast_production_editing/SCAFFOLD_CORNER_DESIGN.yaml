              as: ProducerEng
              as_user_id: "${eng_id}"
            - call: "POST /deliverables"
              payload: { episode_id: "${ep_id}", kind: "MASTER_AUDIO" }
              as: ProducerEng
              as_user_id: "${eng_id}"
              captures: { d_id: $.data.id }
            - call: "POST /asset-versions"
              payload: { deliverable_id: "${d_id}", integrated_loudness_lufs: -16.0 }
              as: ProducerEng
              as_user_id: "${eng_id}"
              captures: { av_id: $.data.id }
            - call: "POST /asset-versions/${av_id}/accept"
              payload: {}
              as: ProducerEng
              as_user_id: "${eng_id}"
            - call: "POST /episodes/${ep_id}/submit-edit"
              payload: {}
              as: ProducerEng
              as_user_id: "${eng_id}"
            - call: "POST /episodes/${ep_id}/approve-edit"
              payload: {}
              as: ShowOwner
              as_user_id: "${show_id}"
            - call: "POST /episodes/${ep_id}/schedule"
              payload: {}
              as: ProducerEng
              as_user_id: "${eng_id}"
            - call: "POST /episodes/${ep_id}/publish"
              payload: {}
              as: ProducerEng
              as_user_id: "${eng_id}"
            - call: "GET /invoices"
              payload: { episode_id: "${ep_id}" }
              as: PlatformAdmin
              captures: { inv_id: "$.data[0].id" }
          trigger:
            - call: "GET /shows/${show_id}"
              payload: {}
              as: PlatformAdmin
              captures: { p0: $.data.production_posture }
            - call: "POST /invoices/${inv_id}/mark-overdue"
              payload: {}
              as: PlatformAdmin
            - call: "GET /shows/${show_id}"
              payload: {}
              as: PlatformAdmin
              captures: { p1: $.data.production_posture }
            - call: "POST /invoices/${inv_id}/pay"
              payload: {}
              as: ShowOwner
              as_user_id: "${show_id}"
            - call: "GET /shows/${show_id}"
              payload: {}
              as: PlatformAdmin
              captures: { p2: $.data.production_posture }
          assert:
            - "Show.${show_id}.production_posture == 'ACTIVE' while the invoice is ISSUED."
            - "Show.${show_id}.production_posture == 'ON_HOLD' after the invoice is marked OVERDUE."
            - "Show.${show_id}.production_posture == 'ACTIVE' again after the invoice is PAID."

      - name: cascading_retainer_close_issues_overage_invoice
        claim_type: cascading_side_effects
        grounds:
          - state_machines.RetainerCycle.OPEN_to_CLOSED
          - entities.Invoice.fields.kind
          - entities.Show.fields.lifetime_billed_cents
        excluded_because:
          difficulty_instance: dual_variant_calc / retainer_reconciliation_projection_vs_close_diverge_on_cycle
          rationale: "RetainerCycle close cascading into a RETAINER_OVERAGE Invoice and lifetime_billed_cents increment is reachable from the named §1.8 instance's close trigger; that instance's setup publishes the eligible episodes that drive the cascade."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_posture_visible_in_same_response
        claim_type: immediate
        grounds:
          - entities.Show.fields.production_posture
          - state_machines.EngagementContract.DRAFT_to_ACTIVE
        distinguishing_aspect: "immediate consistency: activating the only contract flips Show.production_posture SUSPENDED->ACTIVE and the change is visible on the very next GET /shows/{id} (same request cycle, no lag)."
        test_recipe:
          setup:
            - "Show S (no ACTIVE contract -> SUSPENDED) with one DRAFT contract."
          setup_api_calls:
            - call: "POST /shows"
              payload: { title: "Imm S", format: "SOLO", billing_model: "PER_EPISODE" }
              as: PlatformAdmin
              captures: { show_id: $.data.id }
            - call: "POST /contracts"
              payload: { show_id: "${show_id}", tier: "STANDARD", engagement_type: "PER_EPISODE" }
              as: PlatformAdmin
              captures: { contract_id: $.data.id }
          trigger:
            - call: "GET /shows/${show_id}"
              payload: {}
              as: PlatformAdmin
              captures: { p_before: $.data.production_posture }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "GET /shows/${show_id}"
              payload: {}
              as: PlatformAdmin
              captures: { p_after: $.data.production_posture }
          assert:
            - "Show.${show_id}.production_posture == 'SUSPENDED' before activation."
            - "Show.${show_id}.production_posture == 'ACTIVE' immediately after activate, on the next GET (immediate consistency)."
