            - "No Device exists at either site, so the UNSUCCESSFUL_LOCKED branch locks nothing and the score difference is purely the pt_unit branch"
            - "CliaCertificate.${cert_id}.covered_site_count == 2"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: operator_regains_competency_while_access_stays_locked_out
        grounds:
          - state_machines.Operator.COMPETENT_to_LAPSED
          - state_machines.Operator.LAPSED_to_COMPETENT
          - calculations.operator_access_grace_and_lockout
          - entities.Operator.fields.access_status
          - entities.Operator.fields.competency_status
        distinguishing_aspect: |
          Approving a fresh competency assessment moves competency_status
          LAPSED -> COMPETENT while access_status remains LOCKED_OUT with
          lockout_reason COMPETENCY_LAPSED - the two dimensions of the same
          Operator row advance on different triggers and are asserted
          independently in the same response.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z, later advanced to 2026-10-01T00:00:00Z."
            - "One WAIVED site with ACTIVE waiver coverage through 2027-12-31."
            - "op_dir (PHYSICIAN) trained and assigned as the site's lab director; op_b (MEDICAL_TECHNOLOGIST) trained as assessor; op_a (MEDICAL_ASSISTANT) trained."
            - "op_a holds an APPROVED competency for GlucoMeter-X over [2026-08-01, 2026-09-15), so competency_status == COMPETENT and competency_expires_at == 2026-09-15."
            - "An oversight run at 2026-10-01 with the site posture OPEN gives op_a 14 grace days (lapse_deadline 2026-09-29) and lapses it to LAPSED x LOCKED_OUT (COMPETENCY_LAPSED)."
            - "A second assessment for op_a over [2026-10-01, 2027-10-01) is SUBMITTED and awaits decision."
          setup_api_calls:
            - call: "POST /poct/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /poct/certificates"
              payload: { certificate_number: "45D2243006", certificate_type: "CERTIFICATE_OF_WAIVER", permitted_complexity: "WAIVED", effective_date: "2026-01-01", expiration_date: "2027-12-31" }
              as: ProgramAdmin
              captures: { cert_id: $.data.id }
            - call: "POST /poct/sites"
              payload: { name: "Urgent Care POCT", department_code: "DEPT-150", complexity_scope: "WAIVED" }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /poct/certificate-coverages"
              payload: { site_id: "${site_id}", certificate_id: "${cert_id}", coverage_start: "2026-01-01", coverage_end: "2027-12-31" }
              as: ProgramAdmin
            - call: "POST /poct/operators"
              payload: { site_id: "${site_id}", full_name: "Dr Iris Vale", role_title: "PHYSICIAN", hire_date: "2026-01-15" }
              as: ProgramAdmin
              captures: { op_dir_id: $.data.id }
            - call: "POST /poct/operators/${op_dir_id}/training"
              payload: { training_module_code: "POCT-101", completed_on: "2026-08-01" }
              as: ProgramAdmin
            - call: "PATCH /poct/sites/${site_id}/director"
              payload: { lab_director_operator_id: "${op_dir_id}" }
              as: ProgramAdmin
            - call: "POST /poct/operators"
              payload: { site_id: "${site_id}", full_name: "Ben Osei", role_title: "MEDICAL_TECHNOLOGIST", hire_date: "2026-02-01" }
              as: ProgramAdmin
              captures: { op_b_id: $.data.id }
            - call: "POST /poct/operators/${op_b_id}/training"
              payload: { training_module_code: "POCT-101", completed_on: "2026-08-01" }
              as: ProgramAdmin
            - call: "POST /poct/operators"
              payload: { site_id: "${site_id}", full_name: "Alma Ruiz", role_title: "MEDICAL_ASSISTANT", hire_date: "2026-03-01" }
              as: ProgramAdmin
              captures: { op_a_id: $.data.id }
            - call: "POST /poct/operators/${op_a_id}/training"
              payload: { training_module_code: "POCT-101", completed_on: "2026-08-01" }
              as: ProgramAdmin
              captures: { op_a_v1: $.data.version }
            - call: "POST /poct/competency-assessments"
              payload: { operator_id: "${op_a_id}", assessor_operator_id: "${op_b_id}", device_model: "GlucoMeter-X", assessment_type: "INITIAL", methods_demonstrated: 6, effective_date: "2026-08-01", expires_at: "2026-09-15", expected_operator_version: "${op_a_v1}" }
              as: QualityCoordinator
              captures: { ca1_id: $.data.id }
            - call: "POST /poct/competency-assessments/${ca1_id}/decision"
              payload: { decision: "APPROVE", note: "All six elements observed" }
              as: LabDirector
              as_user_id: "${op_dir_id}"
            - call: "POST /poct/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /poct/oversight-runs"
              payload: { note: "October epoch" }
              as: ProgramAdmin
            - call: "GET /poct/operators/${op_a_id}"
              as: ProgramAdmin
              captures: { op_a_v2: $.data.version, lapsed_status: $.data.competency_status, lapsed_access: $.data.access_status, grace_days: $.data.current_grace_days, deadline: $.data.lapse_deadline }
            - call: "POST /poct/competency-assessments"
              payload: { operator_id: "${op_a_id}", assessor_operator_id: "${op_b_id}", device_model: "GlucoMeter-X", assessment_type: "ANNUAL", methods_demonstrated: 6, effective_date: "2026-10-01", expires_at: "2027-10-01", expected_operator_version: "${op_a_v2}" }
              as: QualityCoordinator
              captures: { ca2_id: $.data.id }
          trigger:
            - call: "POST /poct/competency-assessments/${ca2_id}/decision"
              payload: { decision: "APPROVE", note: "Re-assessed after lapse" }
              as: LabDirector
              as_user_id: "${op_dir_id}"
          assert:
            - "${lapsed_status} == LAPSED and ${lapsed_access} == LOCKED_OUT before the trigger"
            - "${grace_days} == 14 and ${deadline} == 2026-09-29"
            - "CompetencyAssessment.${ca2_id}.status == APPROVED"
            - "Operator.${op_a_id}.competency_status == COMPETENT"
            - "Operator.${op_a_id}.access_status == LOCKED_OUT"
            - "Operator.${op_a_id}.lockout_reason == COMPETENCY_LAPSED"
            - "Operator.${op_a_id}.competency_expires_at == 2027-10-01"
            - "Operator.${op_a_id}.consecutive_rejection_count == 0"
            - "TestSite.${site_id}.locked_out_operator_count == 1 and TestSite.${site_id}.total_operator_count == 3"
            - "TestSite.${site_id}.lapsed_or_locked_operator_count == 1 (op_a still counted via access_status although competency_status is COMPETENT)"
            - "CompetencyAssessment.${ca1_id}.status == APPROVED (the earlier approval is not voided by the new one)"

      - name: deficiency_correction_rejection_cycle_then_close_bubbles_inspection
        grounds:
          - state_machines.DeficiencyFinding.CORRECTION_SUBMITTED_to_CORRECTION_REJECTED
          - state_machines.DeficiencyFinding.CORRECTION_REJECTED_to_CORRECTION_SUBMITTED
          - state_machines.Inspection.DEFICIENCIES_ISSUED_to_CLOSED
          - entities.DeficiencyFinding.fields.correction_round
        distinguishing_aspect: |
          The finding traverses OPEN -> CORRECTION_SUBMITTED ->
          CORRECTION_REJECTED -> CORRECTION_SUBMITTED -> CLOSED, ending with
          correction_round == 2, and the closing decision compound-derives the
          parent Inspection to CLOSED because every one of its findings is now
          terminal.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One WAIVED site with ACTIVE waiver coverage."
            - "One inspection with a single STANDARD_LEVEL finding issued by surveyor-alpha, weight 3.00, so open_deficiency_weight == 3.00 and posture stays OPEN."
            - "A first plan of correction is submitted and rejected by surveyor-beta, then a second plan of correction is submitted, leaving the finding in CORRECTION_SUBMITTED with correction_round == 2."
          setup_api_calls:
            - call: "POST /poct/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /poct/certificates"
              payload: { certificate_number: "45D2243007", certificate_type: "CERTIFICATE_OF_WAIVER", permitted_complexity: "WAIVED", effective_date: "2026-01-01", expiration_date: "2027-12-31" }
              as: ProgramAdmin
              captures: { cert_id: $.data.id }
            - call: "POST /poct/sites"
              payload: { name: "Oncology POCT", department_code: "DEPT-160", complexity_scope: "WAIVED" }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /poct/certificate-coverages"
              payload: { site_id: "${site_id}", certificate_id: "${cert_id}", coverage_start: "2026-01-01", coverage_end: "2027-12-31" }
              as: ProgramAdmin
            - call: "POST /poct/inspections"
              payload: { site_id: "${site_id}", inspection_type: "BIENNIAL_SURVEY", scheduled_date: "2026-08-01" }
              as: Surveyor
              as_user_id: "surveyor-alpha"
              captures: { insp_id: $.data.id }
            - call: "POST /poct/deficiencies"
              payload: { inspection_id: "${insp_id}", category: "RESULT_REPORTING", severity: "STANDARD_LEVEL", description: "Manual results posted without second-person review", correction_due_date: "2026-09-30" }
              as: Surveyor
              as_user_id: "surveyor-alpha"
              captures: { def_id: $.data.id }
            - call: "POST /poct/inspections/${insp_id}/issue"
              payload: { issued_on: "2026-08-01" }
              as: Surveyor
              as_user_id: "surveyor-alpha"
            - call: "POST /poct/deficiencies/${def_id}/correction"
              payload: { correction_narrative: "Second-person review checklist added", evidence_ref: "EV-RR-001" }
              as: QualityCoordinator
            - call: "POST /poct/deficiencies/${def_id}/correction-decision"
              payload: { decision: "REJECT", note: "No evidence of staff attestation" }
              as: Surveyor
              as_user_id: "surveyor-beta"
              captures: { round1_status: $.data.status, round1_round: $.data.correction_round }
            - call: "POST /poct/deficiencies/${def_id}/correction"
              payload: { correction_narrative: "Checklist plus signed attestations for all 12 operators", evidence_ref: "EV-RR-002" }
              as: QualityCoordinator
              captures: { round2_round: $.data.correction_round }
          trigger:
            - call: "POST /poct/deficiencies/${def_id}/correction-decision"
              payload: { decision: "ACCEPT", note: "Attestations verified" }
              as: Surveyor
              as_user_id: "surveyor-beta"
          assert:
            - "${round1_status} == CORRECTION_REJECTED and ${round1_round} == 1"
            - "${round2_round} == 2"
            - "DeficiencyFinding.${def_id}.status == CLOSED and DeficiencyFinding.${def_id}.correction_round == 2"
            - "DeficiencyFinding.${def_id}.closed_by_user_id == surveyor-beta"
            - "Inspection.${insp_id}.status == CLOSED (compound bubble-up: every finding terminal)"
            - "Inspection.${insp_id}.issued_weight_total == 3.00 (unchanged audit record)"
