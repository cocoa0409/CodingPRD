            - "Nonprofit.${np_id}.cumulative_federal_expenditures_cents == 5000000"

  # ---------------- Errors ----------------
  - section: errors
    instances:
      - name: drawdown_create_stale_subaward_version_returns_412
        claim_type: violation_to_error
        grounds: ["concurrency_rules[drawdown-create-stale-subaward]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "After a first drawdown create advances subaward.version, a second create carrying the earlier expected_subaward_version returns ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["An ACTIVE subaward (total 11000000) whose post-activation version is captured as sub_v0."]
          setup_api_calls:
            - call: "POST /nonprofits"
              payload: { legal_name: "OCC Org", uei: "UEI-OC", ein: "17-0000017" }
              as: ProgramOfficer
              captures: { np_id: $.data.id }
            - call: "POST /nofos"
              payload: { title: "OCC", cfda_number: "26.261", total_pool_cents: 100000000, max_award_cents: 100000000, indirect_cost_cap_pct: 0.30, open_date: "2026-05-01T00:00:00Z", close_date: "2026-12-31T00:00:00Z" }
              as: ProgramOfficer
