  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: material_conservation_allocate_then_void_via_cancel
        grounds:
          - state_machines.WorkOrder.RELEASED_to_CANCELLED
          - calculations.lot_waterfall_allocation
          - entities.MaterialLot.fields.qty_remaining
          - entities.MaterialLot.fields.qty_received
          - entities.LotAllocation.fields.qty_allocated
        distinguishing_aspect: |
          Conserved quantity: total material units. Invariant
          (sum over a lot's ACTIVE LotAllocations of qty_allocated) + lot.qty_remaining
          == lot.qty_received holds before allocation, after allocation, and after
          the cancel compensation voids the allocation — no unit drift. Quantity
          type: physical material units.
        test_recipe:
          setup:
            - "Single AL_6061 lot qty_received=10; a RELEASED WO that allocated 6 from it (qty_remaining=4)."
          setup_api_calls:
            - call: "POST /rfqs"
              payload: { customer_name: "InvA", customer_id: "CUST-17", requested_due_date: "2026-08-01T00:00:00Z" }
              as: ShopAdmin
              captures: { rfq_id: $.data.id }
            - call: "POST /rfqs/${rfq_id}/part-lines"
              payload: { part_number: "P-IA", drawing_rev: "A", material_spec: "AL_6061", quantity: 6, tolerance_class: "STANDARD" }
              as: ShopAdmin
              captures: { pl_id: $.data.id }
            - call: "POST /rfqs/${rfq_id}/submit"
              payload: {}
              as: ShopAdmin
            - call: "POST /quotes"
              payload: { rfq_id: "${rfq_id}", part_line_id: "${pl_id}", material_unit_cost_cents: 1000, scrap_allowance_pct: 0 }
              as: Estimator
              captures: { q_id: $.data.id }
            - call: "POST /quotes/${q_id}/routing-ops"
              payload: { seq: 1, machine_class: "MILL_3AX", estimated_cycle_min: 5.0, setup_fee_cents: 2000 }
              as: Estimator
            - call: "POST /quotes/${q_id}/price"
              payload: {}
              as: Estimator
              captures: { q_v: $.data.version }
            - call: "POST /quotes/${q_id}/approve"
              payload: { expected_quote_version: "${q_v}" }
              as: Estimator
            - call: "POST /material-lots"
              payload: { material_spec: "AL_6061", heat_number: "H-IA", qty_received: 10, unit_cost_cents: 1000, received_at: "2026-06-01T00:00:00Z" }
              as: MaterialController
              captures: { lot_id: $.data.id }
            - call: "POST /work-orders"
              payload: { quote_id: "${q_id}", part_line_id: "${pl_id}", qty_ordered: 6, qty_started: 6 }
              as: ShopAdmin
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/allocate-material"
              payload: {}
              as: MaterialController
              captures: { wo_v: $.data.version }
            - call: "POST /work-orders/${wo_id}/release"
              payload: { expected_work_order_version: "${wo_v}" }
              as: ShopAdmin
          trigger:
            - call: "POST /work-orders/${wo_id}/cancel"
              payload: {}
              as: ShopAdmin
            - call: "GET /material-lots/${lot_id}"
              payload: {}
              as: MaterialController
              captures: { rem: $.data.qty_remaining, recv: $.data.qty_received }
          assert:
            - "MaterialLot.${lot_id}.qty_remaining == 10"
            - "MaterialLot.${lot_id}.qty_received == 10"
            - "WorkOrder.${wo_id}.material_allocated == false"

      - name: part_count_conservation_shipment_void_restores_qty_shipped
        grounds:
          - state_machines.Shipment.SHIPPED_to_VOIDED
          - entities.WorkOrder.fields.qty_shipped
          - entities.WorkOrder.fields.qty_accepted
          - entities.WorkOrder.fields.status
        distinguishing_aspect: |
          Different conserved quantity: produced-part count. Invariant
          WorkOrder.qty_shipped after a Shipment void returns to its pre-ship
          value, and the WO reverts SHIPPED->COMPLETED, leaving qty_accepted
          unchanged — finished-goods count conserved across ship-then-void.
          Distinct quantity type from raw material units above.
        test_recipe:
          setup:
            - "WorkOrder COMPLETED with qty_accepted=10; one SHIPPED Shipment of 10 (WO now SHIPPED, qty_shipped=10)."
          setup_api_calls:
