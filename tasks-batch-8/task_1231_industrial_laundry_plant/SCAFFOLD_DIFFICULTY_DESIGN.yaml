        grounds:
          - state_machines.WashLoad.AWAITING_TEST_to_TESTED_FAIL
          - state_machines.WashLoad.TESTED_FAIL_to_REWASH_PENDING
          - state_machines.WashLoad.REWASH_PENDING_to_RUNNING
        distinguishing_aspect: |
          WashLoad contains a cycle: STAGED→RUNNING→AWAITING_TEST→TESTED_FAIL
          →REWASH_PENDING→RUNNING (re-entry into RUNNING). Each pass through
          the cycle increments rewash_count and escalates formula_code one
          level (WF_STANDARD→WF_HEAVY_SOIL); the cycle is bounded by
          MAX_REWASH_COUNT=2 (ERR_REWASH_LIMIT_REACHED).
        test_recipe:
          setup:
            - "Plant P; category GOWN with hygienic_test_required=true, wash_formula_code=WF_STANDARD"
            - "HEALTHCARE COG customer C; stop picked up; batch of 20 ACCEPTED GOWN pieces locked+posted"
