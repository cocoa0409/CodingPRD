      - name: complaint_triage_three_way_fork_divergent_side_effects
        grounds:
          - state_machines.Complaint.INTAKE_to_INVESTIGATING
          - state_machines.Complaint.INTAKE_to_CLOSED_NO_ACTION
          - state_machines.Complaint.INTAKE_to_REFERRED_OUT
          - calculations.complaint_credibility_score
          - endpoints.POST_/complaints/{complaint_id}/triage
        distinguishing_aspect: |
          A three-way FORK out of a single state in the Complaint machine - a
          different entity's machine from the RatingCycle loop above, and a
          branch shape rather than a cycle. The three edges share one trigger
          endpoint and differ only by disposition, yet their side-effect sets are
          disjoint: one arms a clock and scores, one scores and terminates, one
          terminates unscored. Two of the three targets are terminal, so the
          divergence is permanent.
        test_recipe:
          setup:
            - "Logical clock at its 2026-08-01T00:00:00Z default"
            - "One organization with three complaints in INTAKE, filed by a DONOR, a BENEFICIARY and an EMPLOYEE respectively"
          setup_api_calls:
            - call: "POST /organizations"
              payload: { legal_name: "Harbor Relief Fund", ein: "11-1111111", org_type: "PUBLIC_CHARITY", fiscal_year_end_month: 12, contact_email: "ops@harborrelief.org" }
              as: MethodologyAdmin
              as_user_id: "admin-1"
              captures: { org1: $.data.id }
            - call: "POST /complaints"
              payload: { organization_id: "${org1}", complainant_kind: "DONOR", category: "MISUSE_OF_FUNDS", narrative: "restricted gift spent on overhead", corroborating_document_count: 2 }
              as: PublicUser
              as_user_id: "donor-1"
              captures: { cp1: $.data.id }
            - call: "POST /complaints"
              payload: { organization_id: "${org1}", complainant_kind: "BENEFICIARY", category: "GOVERNANCE", narrative: "board never meets in public", corroborating_document_count: 0 }
              as: PublicUser
              as_user_id: "beneficiary-1"
              captures: { cp2: $.data.id }
            - call: "POST /complaints"
              payload: { organization_id: "${org1}", complainant_kind: "EMPLOYEE", category: "TRANSPARENCY", narrative: "audited statements withheld from staff", corroborating_document_count: 1 }
              as: PublicUser
              as_user_id: "employee-1"
              captures: { cp3: $.data.id }
          trigger:
            - call: "POST /complaints/${cp1}/triage"
              payload: { disposition: "INVESTIGATE", triage_note: "credible on its face" }
              as: RatingAnalyst
              as_user_id: "analyst-1"
            - call: "POST /complaints/${cp2}/triage"
              payload: { disposition: "CLOSE_NO_ACTION", triage_note: "no allegation of a standards breach" }
              as: RatingAnalyst
              as_user_id: "analyst-1"
            - call: "POST /complaints/${cp3}/triage"
              payload: { disposition: "REFER_OUT", triage_note: "employment matter", referred_to: "State Attorney General - Charities Bureau" }
              as: RatingAnalyst
              as_user_id: "analyst-1"
          assert:
            - "Complaint.${cp1}.status == INVESTIGATING, credibility_score == 76.00, credibility_variant == INTAKE, severity_tier == MEDIUM, investigation_due_at == 2026-08-31T00:00:00Z, resolved_at == null"
            - "Complaint.${cp2}.status == CLOSED_NO_ACTION, credibility_score == null, credibility_variant == null, severity_tier == null, investigation_due_at == null, resolved_at == 2026-08-01T00:00:00Z"
            - "Complaint.${cp3}.status == REFERRED_OUT, credibility_score == 58.00, credibility_variant == INTAKE, severity_tier == MEDIUM, investigation_due_at == null, referred_to == State Attorney General - Charities Bureau, resolved_at == 2026-08-01T00:00:00Z"
            - "All three complaints have penalty_points_applied == 0 and penalized_rating_cycle_id == null"
            - "Organization.${org1}.substantiated_complaint_count == 0"
            - "A second POST /complaints/${cp2}/triage with any disposition returns ERR_COMPLAINT_STATE_INVALID (409) because CLOSED_NO_ACTION is terminal"

  - rule_id: transitive_cascade
    instances:
      - name: substantiated_complaint_four_hop_accountability_cascade
        grounds:
          - endpoints.POST_/complaints/{complaint_id}/resolve
          - calculations.complaint_penalty_target
          - state_machines.DimensionScore.COMPUTED_to_STALE
          - state_machines.RatingCycle.CORRECTION_REQUESTED_to_SCORED
          - state_machines.CorrectionRequest.UNDER_ANALYST_REVIEW_to_REJECTED
          - entities.RatingCycle.fields.accountability_penalty_points
        distinguishing_aspect: |
          Depth 4, triggered from the COMPLAINT side of the system
          (POST /complaints/{id}/resolve). The chain crosses four entities in one
          direction - Complaint selects a cycle, the cycle's ACCOUNTABILITY row is
          penalised and staled, the stale row forces the cycle back to SCORED, and
          only because the cycle left CORRECTION_REQUESTED is the in-flight
