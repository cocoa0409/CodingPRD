      - name: claim_confidence_duplicate_and_settlement_floor_guards_all_fire
        claim_type: violation_to_error
        grounds:
          - validations[priority=41].claim_confidence_minimum
          - validations[priority=42].one_claim_per_match
          - validations[priority=43].notice_confidence_minimum
          - validations[priority=44].settlement_floor
        distinguishing_aspect: |
          The two confidence gates are shown to be different thresholds on the same axis by a single match
          at 84.9: it is high enough to open a claim (>= 70.0) yet too low to serve notice (< 85.0). The
          settlement floor is then probed both with an amount below the floor and with the amount omitted
          entirely, which the same rule must reject.
        test_recipe:
          setup:
            - "One CATALOGED work with three fingerprint matches on the same platform: 65.0, 84.9 and 96.0 confidence."
          setup_api_calls:
            - call: "POST /music-library/composers"
              payload: { display_name: "Nadia Okoro", pro_affiliation: "ASCAP" }
              as: CatalogAdmin
              captures: { c1: $.data.id }
