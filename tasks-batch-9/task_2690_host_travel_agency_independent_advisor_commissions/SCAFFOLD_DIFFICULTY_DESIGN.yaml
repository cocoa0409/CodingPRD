  - rule_id: non_linear_state_machine
    instances:
      - name: claim_deny_resubmit_cycle_blocked_at_third_round
        grounds:
          - state_machines.CommissionClaim.SUBMITTED_to_DENIED
          - state_machines.CommissionClaim.DENIED_to_SUBMITTED
          - entities.CommissionClaim.fields.round_count
          - validations[priority=70]
          - errors[ERR_CLAIM_ROUND_LIMIT]
        distinguishing_aspect: |
          The non-linearity is a COUNTED CYCLE on CommissionClaim: DENIED -> SUBMITTED is a
          genuine backward edge that may be traversed only while round_count < 3, so the third
          resubmission of the same claim is rejected with ERR_CLAIM_ROUND_LIMIT while the state
          stays DENIED — the loop terminates on an integer guard carried by the entity itself.
        test_recipe:
          setup:
            - "One ACTIVE consortium-member advisor in NY accredited with Aurora Cruises."
            - "One CONSORTIUM booking of gross 1000000 (expected commission 160000), CONFIRMED, with no commission receipt recorded, so commission_status is EXPECTED."
