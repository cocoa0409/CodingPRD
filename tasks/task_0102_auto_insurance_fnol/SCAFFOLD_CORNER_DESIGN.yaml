              captures: { adj1: $.data.id }
            - call: "POST /claims"
              payload: { policy_id: "${pol}", loss_datetime: "2026-06-01T00:00:00.000Z", loss_type: "COLLISION", vehicle_acv_cents: 800000 }
              as: ClaimsAdjuster
              as_user_id: "${adj1}"
              captures: { claim: $.data.id }
            - call: "POST /claims/${claim}/verify-coverage"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "${adj1}"
              captures: { c_v1: $.data.version }
          trigger:
            - call: "POST /claims/${claim}/assign-adjuster"
              payload: { adjuster_id: "${adj1}", expected_claim_version: "${c_v1}" }
              as: ClaimsSupervisor
              captures: { c_v2: $.data.version, st: $.data.status }
          assert:
            - "Claim.${claim}.status == UNDER_REVIEW"
            - "Claim.${claim}.version == ${c_v1} + 1"

      - name: segregation_of_duties_same_author_blocks_total_loss
        claim_type: Segregation of duties
        grounds: ["validations[priority=7]", "errors[ERR_SEGREGATION_OF_DUTIES]", state_machines.Claim.UNDER_REVIEW_to_TOTAL_LOSS]
        distinguishing_aspect: "When the SENIOR adjuster who authored the SUBMITTED repair estimate is also the one who authored the total-loss evaluation, deciding TOTAL_LOSS -> ERR_SEGREGATION_OF_DUTIES (409)."
        test_recipe:
          setup: ["A SENIOR adjuster is assigned to the claim, authors AND submits the repair estimate, then authors a total-loss evaluation with is_total_loss=true on the same claim."]
          setup_api_calls:
            - call: "POST /policies"
              payload: { policyholder_name: "Sod Co", policy_number: "POL-SOD-1", effective_date: "2026-01-01T00:00:00.000Z", expiration_date: "2026-12-31T00:00:00.000Z", comparative_fault_rule: "PURE" }
              as: ClaimsSupervisor
              captures: { pol: $.data.id }
            - call: "POST /policies/${pol}/coverages"
              payload: { coverage_type: "COLLISION", limit_cents: 1000000, deductible_cents: 50000 }
              as: ClaimsSupervisor
            - call: "POST /adjusters"
              payload: { full_name: "Adj Senior", license_tier: "SENIOR" }
              as: ClaimsSupervisor
              captures: { adjS: $.data.id }
            - call: "POST /claims"
              payload: { policy_id: "${pol}", loss_datetime: "2026-06-01T00:00:00.000Z", loss_type: "COLLISION", vehicle_acv_cents: 800000 }
              as: ClaimsAdjuster
              as_user_id: "${adjS}"
              captures: { claim: $.data.id }
            - call: "POST /claims/${claim}/verify-coverage"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "${adjS}"
              captures: { c_v1: $.data.version }
            - call: "POST /claims/${claim}/assign-adjuster"
              payload: { adjuster_id: "${adjS}", expected_claim_version: "${c_v1}" }
              as: ClaimsSupervisor
              captures: { c_v2: $.data.version }
            - call: "POST /repair-estimates"
              payload: { claim_id: "${claim}", lines: [ { description: "body", labor_cents: 400000, parts_cents: 200000 } ] }
              as: ClaimsAdjuster
              as_user_id: "${adjS}"
              captures: { est: $.data.id }
            - call: "POST /repair-estimates/${est}/submit"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "${adjS}"
            - call: "POST /total-loss-evaluations"
              payload: { claim_id: "${claim}", salvage_retained_by_insurer: true }
              as: TotalLossAdjuster
              as_user_id: "${adjS}"
          trigger:
            - call: "POST /claims/${claim}/decide-disposition"
              payload: { decision: "TOTAL_LOSS", expected_claim_version: "${c_v2}" }
              as: TotalLossAdjuster
              as_user_id: "${adjS}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_SEGREGATION_OF_DUTIES"

  # ===========================================================================
  - section: endpoints
    instances:
      - name: coverage_reverse_reachability_list_by_policy
        claim_type: Computed read
        grounds: [endpoints, entities.Coverage.fields.policy_id]
        distinguishing_aspect: "GET /policies/{id}/coverages returns the policy's two coverages (COLLISION + RENTAL) as an array, exercising FK reverse-reachability for Coverage.policy_id."
        test_recipe:
          setup: ["A policy with COLLISION and RENTAL coverages."]
          setup_api_calls:
            - call: "POST /policies"
              payload: { policyholder_name: "Rev Co", policy_number: "POL-REV-1", effective_date: "2026-01-01T00:00:00.000Z", expiration_date: "2026-12-31T00:00:00.000Z", comparative_fault_rule: "PURE" }
              as: ClaimsSupervisor
              captures: { pol: $.data.id }
            - call: "POST /policies/${pol}/coverages"
              payload: { coverage_type: "COLLISION", limit_cents: 1000000, deductible_cents: 50000 }
              as: ClaimsSupervisor
            - call: "POST /policies/${pol}/coverages"
              payload: { coverage_type: "RENTAL", limit_cents: 100000, rental_daily_cap_cents: 5000, rental_max_days: 10 }
              as: ClaimsSupervisor
          trigger:
            - call: "GET /policies/${pol}/coverages"
              payload: {}
              as: ClaimsSupervisor
              captures: { first_type: "$.data[0].coverage_type" }
          assert:
            - "response.response_type == array"
            - "meta-level total_count == 2"

  # ===========================================================================
  # excluded_because stubs — corners already covered by a §1.8 difficulty instance
  # ===========================================================================
  - section: calculations
    instances:
      - name: error_total_loss_ratio_boundary_inclusive
        claim_type: Correct Result
        grounds: [calculations.total_loss_decision]
        excluded_because:
          difficulty_instance: boundary_precision_check / total_loss_ratio_inclusive_at_exactly_0_75
          rationale: "The exact-0.75 inclusive boundary and is_total_loss=true are asserted by the named §1.8 instance."
      - name: error_subrogation_modified50_bar_at_50
        claim_type: Correct Result
        grounds: [calculations.subrogation_recovery]
        excluded_because:
          difficulty_instance: boundary_precision_check / modified_50_fault_bar_inclusive_at_exactly_50
          rationale: "The MODIFIED_50 bar at exactly 50% fault (recoverable_cents=0) is asserted by the named §1.8 instance."

  - section: state_machines
    instances:
      - name: error_invalid_state_on_repair_disposition_from_wrong_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Claim.UNDER_REVIEW_to_REPAIR_APPROVED]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / state_beats_no_submitted_estimate_on_repair_disposition
          rationale: "Deciding REPAIR from a non-UNDER_REVIEW state yielding ERR_INVALID_STATE is asserted by the named §1.8 instance."
      - name: subrogation_cycle_revision_recompute
        claim_type: cyclic
        grounds: [state_machines.SubrogationCase.NEGOTIATING_to_DEMAND_SENT]
        excluded_because:
          difficulty_instance: non_linear_state_machine / subrogation_cyclic_negotiating_back_to_demand_sent
          rationale: "The NEGOTIATING->DEMAND_SENT revision loop with recoverable recompute is asserted by the named §1.8 instance."

  - section: cross_cutting_complexity_layers
    instances:
      - name: settle_void_cash_conservation_layer
        claim_type: derived_field_reconciliation
        grounds: [entities.Claim.fields.total_disbursed_cents, calculations.claim_ledger_balance]
        excluded_because:
          difficulty_instance: compensating_invariant / settle_then_void_conserves_claim_net_cash
