scenario: "desgin task harder than expert level.!!!!2170. Food Hub & Aggregation Cooperative (regional food hub): producer onboarding & product catalog with availability, order aggregation & allocation across producers, cross-dock scheduling & cold storage, pricing (producer price + hub margin) & payment terms, food-safety documentation collection, delivery routing to institutional buyers, shrink/rejection allocation to producer, member equity & governance"
domain_name: "food-hub-aggregation-coop"
api_prefix: ""

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy
  entity_topology: graph
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
  difficulty_level: expert_plus
  difficulty_notes: |
    Calibrated above the Expert band on coupling density rather than table size.
    Product availability is a finite pool competed for by many OrderLines; the
    same pool is released by two different compensating cascades (producer
    suspension, dock no-show) that originate four hops apart. Money is computed
    twice over the same rows (provisional at aggregation from allocated
    quantity, final at invoice from delivered quantity) with a margin tier that
    is keyed on a subtotal the margin itself feeds into, and a per-allocation
    rounding order that diverges from sum-then-round by whole cents. Two
    temporal resources use deliberately different interval geometry.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =====================================================================
# 1.1 Entity-Relationship Table
# =====================================================================
entities:

  - name: Producer
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Registered farm/producer business name"
        constraints: "1..120 chars, non-blank"
      - name: region_code
        type: string
        source: input
        description: "Three-letter uppercase growing-region code used for reporting"
        constraints: "exactly 3 uppercase letters"
      - name: contact_email
        type: string
        source: input
        description: "Primary member contact email"
        constraints: "must contain '@'"
      - name: onboarding_status
        type: enum
        source: system
        description: "Membership lifecycle state; see state_machines.Producer"
        default: DRAFT
        constraints: "DRAFT | SUBMITTED | UNDER_REVIEW | CHANGES_REQUESTED | ACTIVE | SUSPENDED | TERMINATED"
      - name: food_safety_tier
        type: enum
        source: computed
        description: "Derived from the producer's VERIFIED, unexpired ProducerDocument set (calculations.producer_compliance_evaluation)"
        default: TIER_NONE
        constraints: "TIER_NONE | TIER_BASIC | TIER_AUDITED"
      - name: compliance_ok
        type: boolean
        source: computed
        description: "True iff every REQUIRED_DOC_TYPES doc_type has at least one VERIFIED doc whose expires_on > current clock"
        default: false
      - name: review_cycles
        type: integer
        source: system
        description: "Number of REQUEST_CHANGES decisions issued against this producer; capped by MAX_REVIEW_CYCLES"
        default: 0
      - name: suspension_count
        type: integer
        source: system
        description: "Number of times this producer has entered SUSPENDED (manual or compliance-triggered)"
        default: 0
      - name: paid_in_capital_cents
        type: integer
        source: system
        description: "Cumulative member equity capital contributed; only POST /producers/{id}/equity-contributions changes it"
        default: 0
      - name: voting_shares
        type: integer
        source: computed
        description: "min(floor(paid_in_capital_cents / EQUITY_SHARE_UNIT_CENTS), MAX_VOTING_SHARES)"
        default: 0
      - name: patronage_volume_cents
        type: integer
        source: system
        description: "Gross patronage basis: cumulative Allocation.producer_amount_cents credited when an order reaches settlement_status PAID (variant gross_at_delivery)"
        default: 0
      - name: shrink_charge_cents
        type: integer
        source: system
        description: "Cumulative producer_charge_cents from APPROVED RejectionClaims against this producer's allocations"
        default: 0
      - name: retained_patronage_cents
        type: integer
        source: system
        description: "Cumulative patronage credited to this member by DISTRIBUTED PatronageCycles"
        default: 0

  - name: ProducerDocument
    parent: Producer
    common_fields: true
    fields:
      - name: producer_id
        type: string
        source: input
        description: "FK -> Producer.id; owning producer (taken from the URL path)"
      - name: doc_type
        type: enum
        source: input
        description: "Food-safety document category"
        constraints: "GAP_AUDIT | LIABILITY_INSURANCE | HACCP_PLAN | ORGANIC_CERT | WATER_TEST"
      - name: issued_on
        type: datetime
        source: input
        description: "ISO 8601 UTC issue instant"
      - name: expires_on
        type: datetime
        source: input
        description: "ISO 8601 UTC expiry instant; must be strictly after issued_on"
      - name: status
        type: enum
        source: system
        description: "Document lifecycle; see state_machines.ProducerDocument"
        default: SUBMITTED
        constraints: "SUBMITTED | VERIFIED | REJECTED | EXPIRED | SUPERSEDED"
      - name: adjudicated_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ComplianceOfficer that VERIFIED or REJECTED this document; null while SUBMITTED"
        default: null
      - name: rejection_reason
        type: string
        source: system
        description: "Free-text reason captured on a REJECT adjudication; null otherwise"
        default: null

  - name: Product
    parent: Producer
    common_fields: true
    fields:
      - name: producer_id
        type: string
        source: input
        description: "FK -> Producer.id; the producer that owns this catalog item"
      - name: commodity_code
        type: string
        source: input
        description: "Hub-wide commodity identifier that buyers order against (e.g. CARROT_LOOSE)"
        constraints: "1..40 chars, uppercase and underscore"
      - name: unit_of_measure
        type: enum
        source: input
        description: "Sales unit"
        constraints: "CASE | LB | EACH"
      - name: storage_class
        type: enum
        source: input
        description: "Temperature regime the item must be handled in"
        constraints: "AMBIENT | CHILL | FROZEN"
      - name: pack_weight_lb
        type: number
        source: input
        description: "Net weight of one sales unit in pounds"
        constraints: "> 0"
      - name: units_per_pallet
        type: integer
        source: input
        description: "Sales units per pallet; drives per-allocation pallet ceiling"
        constraints: ">= 1"
      - name: producer_unit_price_cents
        type: integer
        source: input
        description: "Price the producer is paid per sales unit, before hub margin"
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: "Catalog listing state; see state_machines.Product"
        default: DRAFT
        constraints: "DRAFT | LISTED | DELISTED"
      - name: quantity_offered
        type: integer
        source: system
        description: "Units published for the current offer window; set by POST /products/{id}/offers"
        default: 0
      - name: quantity_committed
        type: integer
        source: system
        description: "Units held by Allocations in status RESERVED, STAGED or DELIVERED"
        default: 0
      - name: quantity_available
        type: integer
        source: computed
        description: "max(0, quantity_offered - quantity_committed); the allocatable pool"
        default: 0
      - name: offer_window_start
        type: datetime
        source: system
        description: "Inclusive start of the offer window; null while DRAFT"
        default: null
      - name: offer_window_end
        type: datetime
        source: system
        description: "Exclusive end of the offer window; null while DRAFT"
        default: null

  - name: Buyer
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Institutional buyer legal name"
        constraints: "1..120 chars, non-blank"
      - name: buyer_type
        type: enum
        source: input
        description: "Institution category"
        constraints: "SCHOOL_DISTRICT | HOSPITAL | UNIVERSITY | CORRECTIONS"
      - name: dock_zone_code
        type: string
        source: input
        description: "Receiving dock zone used for route planning"
        constraints: "1..12 chars"
      - name: payment_terms_days
        type: integer
        source: input
        description: "Net terms in days; invoice_due_date = invoice instant + this many days"
        constraints: "one of 15, 30, 45"
      - name: credit_limit_cents
        type: integer
        source: input
        description: "Maximum outstanding_balance_cents the hub will carry for this buyer"
        constraints: ">= 0"
      - name: outstanding_balance_cents
        type: integer
        source: system
        description: "Sum over this buyer's orders of (invoiced_total_cents - paid_total_cents - credit_memo_cents), floored at 0 only by construction"
        default: 0

  - name: BuyerOrder
    parent: Buyer
    common_fields: true
    fields:
      - name: buyer_id
        type: string
        source: input
        description: "FK -> Buyer.id; ordering institution"
      - name: requested_delivery_date
        type: datetime
        source: input
        description: "ISO 8601 UTC instant the buyer wants delivery; must fall inside a candidate Product's offer window"
      - name: fulfillment_status
        type: enum
        source: system
        description: "Physical dimension of the order; evolves independently of settlement_status"
        default: DRAFT
        constraints: "DRAFT | AGGREGATED | SCHEDULED | IN_TRANSIT | DELIVERED | CLOSED"
      - name: settlement_status
        type: enum
        source: system
        description: "Money dimension of the order; evolves independently of fulfillment_status"
        default: UNBILLED
        constraints: "UNBILLED | INVOICED | PARTIALLY_PAID | PAID | WRITTEN_OFF"
      - name: producer_subtotal_cents
        type: integer
        source: computed
        description: "Sum of Allocation.producer_amount_cents for this order under the currently applicable valuation variant"
        default: 0
      - name: hub_margin_cents
        type: integer
        source: computed
        description: "max(sum of per-allocation rounded margins, MIN_ORDER_MARGIN_CENTS)"
        default: 0
      - name: order_total_cents
        type: integer
        source: computed
        description: "producer_subtotal_cents + hub_margin_cents"
        default: 0
      - name: margin_tier_bp
        type: integer
        source: computed
        description: "Basis-point margin rate selected by calculations.hub_margin_tier_selection from the pre-margin producer subtotal"
        default: 0
      - name: invoiced_total_cents
        type: integer
        source: system
        description: "order_total_cents frozen at the moment of invoicing (final_at_invoice variant)"
        default: 0
      - name: paid_total_cents
        type: integer
        source: system
        description: "Cumulative cash applied via POST /buyer-orders/{id}/payments"
        default: 0
      - name: credit_memo_cents
        type: integer
        source: system
        description: "Cumulative buyer_credit_cents from APPROVED RejectionClaims on this order's allocations"
        default: 0
      - name: invoice_due_date
        type: datetime
        source: computed
        description: "Invoice instant + Buyer.payment_terms_days; null while UNBILLED"
        default: null
      - name: route_id
        type: string
        source: system
        description: "FK -> DeliveryRoute.id; assigned delivery route, null until a stop is created"
        default: null
      - name: route_sequence_no
        type: integer
        source: system
        description: "Stop ordinal on the assigned route; null when route_id is null"
        default: null
      - name: planned_arrival_at
        type: datetime
        source: system
        description: "Inclusive start of this order's service interval on the route"
        default: null
      - name: service_minutes
        type: integer
        source: system
        description: "Length of this order's service interval; the interval is [planned_arrival_at, planned_arrival_at + service_minutes)"
        default: null
      - name: order_pallets
        type: integer
        source: computed
        description: "Sum over this order's non-reversed Allocations of ceil(Allocation.quantity / Product.units_per_pallet); ceiling is taken per allocation, then summed"
        default: 0

  - name: OrderLine
    parent: BuyerOrder
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> BuyerOrder.id; owning order (taken from the URL path)"
      - name: commodity_code
        type: string
        source: input
        description: "Commodity the buyer wants; matched exactly against Product.commodity_code"
      - name: storage_class
        type: enum
        source: input
        description: "Required temperature regime"
        constraints: "AMBIENT | CHILL | FROZEN"
      - name: unit_of_measure
        type: enum
        source: input
        description: "Required sales unit"
        constraints: "CASE | LB | EACH"
      - name: quantity_requested
        type: integer
        source: input
        description: "Units requested"
        constraints: ">= 1"
      - name: max_unit_price_cents
        type: integer
        source: input
        description: "Buyer price ceiling per unit, inclusive of hub margin; eligibility uses MARGIN_BP_CEILING"
        constraints: ">= 1"
      - name: quantity_allocated
        type: integer
        source: computed
        description: "Sum of Allocation.quantity for this line over allocations not in status REVERSED"
        default: 0
      - name: quantity_delivered
        type: integer
        source: system
        description: "Sum of Allocation.delivered_quantity for this line"
        default: 0
      - name: quantity_rejected
        type: integer
        source: system
        description: "Sum of Allocation.rejected_quantity for this line (APPROVED claims only)"
        default: 0
      - name: line_producer_cents
        type: integer
        source: computed
        description: "Sum of Allocation.producer_amount_cents for this line"
        default: 0
      - name: line_margin_cents
        type: integer
        source: computed
        description: "Sum of Allocation.hub_margin_cents for this line"
        default: 0
      - name: line_total_cents
        type: integer
        source: computed
        description: "line_producer_cents + line_margin_cents"
        default: 0
      - name: status
        type: enum
        source: system
        description: "Line fulfilment state; see state_machines.OrderLine"
        default: PENDING
        constraints: "PENDING | ALLOCATED | SHORT | DELIVERED | SETTLED"

  - name: Allocation
    parent: OrderLine
    common_fields: true
    fields:
      - name: order_line_id
        type: string
        source: system
        description: "FK -> OrderLine.id; the demand row this allocation fills"
      - name: product_id
        type: string
        source: system
        description: "FK -> Product.id; the supply row this allocation draws from"
      - name: quantity
        type: integer
        source: system
        description: "Units drawn from the product's available pool"
      - name: producer_unit_price_cents
        type: integer
        source: system
        description: "Snapshot of Product.producer_unit_price_cents at allocation time; later price edits never re-price this row"
      - name: margin_bp
        type: integer
        source: system
        description: "Snapshot of the order's margin_tier_bp applied to this allocation"
        default: 0
      - name: producer_amount_cents
        type: integer
        source: computed
        description: "valuation_quantity * producer_unit_price_cents, where valuation_quantity is quantity (provisional) or delivered_quantity (final)"
        default: 0
      - name: hub_margin_cents
        type: integer
        source: computed
        description: "round_half_up(producer_amount_cents * margin_bp / 10000), plus any MIN_ORDER_MARGIN_CENTS top-up assigned to this row"
        default: 0
      - name: buyer_amount_cents
        type: integer
        source: computed
        description: "producer_amount_cents + hub_margin_cents"
        default: 0
      - name: delivered_quantity
        type: integer
        source: system
        description: "Units actually delivered, recorded by POST /buyer-orders/{id}/delivery-record"
        default: 0
      - name: rejected_quantity
        type: integer
        source: system
        description: "Units credited back to the buyer by APPROVED RejectionClaims"
        default: 0
      - name: producer_charge_cents
        type: integer
        source: system
        description: "Portion of approved rejection credits charged back to the producer"
        default: 0
      - name: hub_absorbed_cents
        type: integer
        source: system
        description: "Portion of approved rejection credits absorbed by the hub"
        default: 0
      - name: staged_temp_c
        type: number
        source: system
        description: "recorded_temp_c copied from the DockAppointment receipt that staged this allocation; null until STAGED"
        default: null
      - name: temp_excursion
        type: boolean
        source: system
        description: "True iff staged_temp_c > DockSlot.temp_setpoint_c + TEMP_TOLERANCE_C at staging time"
        default: false
      - name: status
        type: enum
        source: system
        description: "Allocation lifecycle; see state_machines.Allocation"
        default: RESERVED
        constraints: "RESERVED | STAGED | DELIVERED | SHORT_CLOSED | REVERSED"

  - name: DockSlot
    parent: null
    common_fields: true
    fields:
      - name: door_code
        type: string
        source: input
        description: "Cross-dock door identifier"
        constraints: "1..12 chars"
      - name: storage_class
        type: enum
        source: input
        description: "Temperature regime this slot is conditioned for"
        constraints: "AMBIENT | CHILL | FROZEN"
      - name: window_start
        type: datetime
        source: input
        description: "Inclusive start of the slot's bookable window"
      - name: window_end
        type: datetime
        source: input
        description: "Exclusive end of the slot's bookable window; must be strictly after window_start"
      - name: pallet_capacity
        type: integer
        source: input
        description: "Maximum pallets that overlapping BOOKED or RECEIVED appointments may occupy on the door at once"
        constraints: ">= 1"
      - name: temp_setpoint_c
        type: number
        source: input
        description: "Cold-storage setpoint in Celsius for goods received at this slot"
      - name: sanitation_buffer_minutes
        type: integer
        source: input
        description: "Minimum separation required between appointments of differing risk_class on this slot"
        default: 45
        constraints: ">= 0"
      - name: pallets_booked
        type: integer
        source: computed
        description: "Sum of pallets over this slot's appointments in status BOOKED or RECEIVED"
        default: 0
      - name: status
        type: enum
        source: system
        description: "OPEN while pallets_booked < pallet_capacity, FULL when equal, CLOSED once window_end has passed on the logical clock"
        default: OPEN
        constraints: "OPEN | FULL | CLOSED"

  - name: DockAppointment
    parent: DockSlot
    common_fields: true
    fields:
      - name: dock_slot_id
        type: string
        source: input
        description: "FK -> DockSlot.id; the door and window being occupied"
      - name: producer_id
        type: string
        source: input
        description: "FK -> Producer.id; the producer dropping off"
      - name: arrival_start
        type: datetime
        source: input
        description: "Inclusive start of the occupation interval"
      - name: arrival_end
        type: datetime
        source: input
        description: "Exclusive end of the occupation interval; must be strictly after arrival_start"
      - name: pallets
        type: integer
        source: input
        description: "Pallets the producer will drop"
        constraints: ">= 1"
      - name: risk_class
        type: enum
        source: input
        description: "Cross-contamination class driving the sanitation buffer rule"
        constraints: "RAW_ANIMAL | PRODUCE | READY_TO_EAT"
      - name: received_pallets
        type: integer
        source: system
        description: "Pallets actually accepted at receipt"
        default: 0
      - name: recorded_temp_c
        type: number
        source: system
        description: "Product temperature measured at receipt; null until RECEIVED"
        default: null
      - name: status
        type: enum
        source: system
        description: "Appointment lifecycle; see state_machines.DockAppointment"
        default: BOOKED
        constraints: "BOOKED | RECEIVED | NO_SHOW | CANCELLED"

  - name: DeliveryRoute
    parent: null
    common_fields: true
    fields:
      - name: route_date
        type: datetime
        source: input
        description: "Service date of the route"
      - name: vehicle_code
        type: string
        source: input
        description: "Refrigerated vehicle identifier"
        constraints: "1..12 chars"
      - name: storage_class
        type: enum
        source: input
        description: "Temperature regime the vehicle runs at; every assigned order line must match"
        constraints: "AMBIENT | CHILL | FROZEN"
      - name: pallet_capacity
        type: integer
        source: input
        description: "Vehicle pallet capacity"
        constraints: ">= 1"
      - name: depot_departure_at
        type: datetime
        source: input
        description: "Planned departure instant from the hub depot"
      - name: pallets_loaded
        type: integer
        source: computed
        description: "Sum of BuyerOrder.order_pallets over orders whose route_id equals this route"
        default: 0
      - name: stop_count
        type: integer
        source: computed
        description: "Count of orders whose route_id equals this route"
        default: 0
      - name: status
        type: enum
        source: system
        description: "Route lifecycle; see state_machines.DeliveryRoute"
        default: PLANNED
        constraints: "PLANNED | LOADED | DISPATCHED | COMPLETED"

  - name: RejectionClaim
    parent: Allocation
    common_fields: true
    fields:
      - name: allocation_id
        type: string
        source: input
        description: "FK -> Allocation.id; the delivered allocation being claimed against"
      - name: quantity_rejected
        type: integer
        source: input
        description: "Units the buyer refuses"
        constraints: ">= 1"
      - name: reason_code
        type: enum
        source: input
        description: "Root-cause category driving fault apportionment"
        constraints: "TEMP_ABUSE | DAMAGE | SPEC_MISMATCH | SHORT_COUNT | LATE_DELIVERY"
      - name: note
        type: string
        source: input
        description: "Optional free-text detail"
        default: null
      - name: filed_by_user_id
        type: string
        source: system
        description: "X-User-ID that filed the claim"
      - name: adjudicated_by_user_id
        type: string
        source: system
        description: "X-User-ID that approved, denied or withdrew the claim; null while FILED"
        default: null
      - name: status
        type: enum
        source: system
        description: "Claim lifecycle; see state_machines.RejectionClaim"
        default: FILED
        constraints: "FILED | APPROVED | DENIED | WITHDRAWN"
      - name: producer_fault_bp
        type: integer
        source: computed
        description: "Basis points of the buyer credit charged back to the producer; 0 until adjudicated"
        default: 0
      - name: buyer_credit_cents
        type: integer
        source: computed
        description: "round_half_up(Allocation.buyer_amount_cents * quantity_rejected / Allocation.delivered_quantity)"
        default: 0
      - name: producer_charge_cents
        type: integer
        source: computed
        description: "round_half_up(buyer_credit_cents * producer_fault_bp / 10000)"
        default: 0
      - name: hub_absorbed_cents
        type: integer
        source: computed
        description: "buyer_credit_cents - producer_charge_cents; the hub absorbs the rounding residue by construction"
        default: 0

  - name: PatronageCycle
    parent: null
    common_fields: true
    fields:
      - name: fiscal_year
        type: integer
        source: input
        description: "Cooperative fiscal year the distribution belongs to"
        constraints: "2000..2100, unique across PatronageCycle"
      - name: distributable_pool_cents
        type: integer
        source: input
        description: "Board-proposed surplus to distribute to members"
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: "Governance lifecycle; see state_machines.PatronageCycle"
        default: PROPOSED
        constraints: "PROPOSED | RATIFIED | DISTRIBUTED | CANCELLED"
      - name: proposed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the HubAdmin that created the cycle"
      - name: ratified_by_user_id
        type: string
        source: system
        description: "X-User-ID of the BoardDirector that ratified or rejected it; null while PROPOSED"
        default: null
      - name: basis_snapshot_total_cents
        type: integer
        source: system
        description: "Sum of the net_at_ratification patronage basis over eligible producers, frozen at ratification"
        default: 0
      - name: eligible_producer_count
        type: integer
        source: system
        description: "Count of producers whose basis entered basis_snapshot_total_cents"
        default: 0
      - name: distributed_total_cents
        type: integer
        source: system
        description: "Sum actually credited to producers by the distribution waterfall"
        default: 0
      - name: remainder_cents
        type: integer
        source: system
        description: "distributable_pool_cents - distributed_total_cents; retained in the hub's unallocated reserve"
        default: 0

# =====================================================================
# 1.2 State Machine Table
# =====================================================================
state_machines:

  - entity: Producer
    dimension: onboarding_status
    shape: cyclic
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /producers/{id}/application"
        actor: Producer
        preconditions:
          - "for every doc_type in REQUIRED_DOC_TYPES the producer has >= 1 ProducerDocument with status IN {SUBMITTED, VERIFIED}, else ERR_MISSING_REQUIRED_DOCUMENTS"
        side_effects:
          - "Producer.updated_at refreshed and Producer.version incremented by 1"
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "system: first POST /producer-documents/{id}/adjudication against any of this producer's documents"
        actor: system
        preconditions:
          - "Producer.onboarding_status == SUBMITTED"
        side_effects:
          - "Producer.updated_at refreshed and Producer.version incremented by 1"
        note: "Automatic; fires as part of the adjudication request, before compliance is recomputed."
      - from: UNDER_REVIEW
        to: CHANGES_REQUESTED
        trigger: "POST /producers/{id}/review with decision=REQUEST_CHANGES"
        actor: ComplianceOfficer
        preconditions:
          - "Producer.review_cycles < MAX_REVIEW_CYCLES, else ERR_REVIEW_CYCLE_LIMIT"
        side_effects:
          - "Producer.review_cycles incremented by 1"
      - from: CHANGES_REQUESTED
        to: SUBMITTED
        trigger: "POST /producers/{id}/application (resubmission)"
        actor: Producer
        preconditions:
          - "for every doc_type in REQUIRED_DOC_TYPES the producer has >= 1 ProducerDocument with status IN {SUBMITTED, VERIFIED}, else ERR_MISSING_REQUIRED_DOCUMENTS"
        side_effects:
          - "Producer.updated_at refreshed and Producer.version incremented by 1"
        note: "Closes the revision cycle CHANGES_REQUESTED -> SUBMITTED -> UNDER_REVIEW -> CHANGES_REQUESTED."
      - from: UNDER_REVIEW
        to: ACTIVE
        trigger: "POST /producers/{id}/review with decision=APPROVE"
        actor: ComplianceOfficer
        preconditions:
          - "Producer.compliance_ok == true, else ERR_PRODUCER_NOT_COMPLIANT"
          - "X-User-ID is not present in the set { ProducerDocument.adjudicated_by_user_id : doc.producer_id == this producer AND doc.status == VERIFIED }, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "calculations.producer_compliance_evaluation refreshes Producer.food_safety_tier"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /producers/{id}/review with decision=SUSPEND"
        actor: HubAdmin
        preconditions:
          - "Producer.onboarding_status == ACTIVE, else ERR_INVALID_PRODUCER_STATE"
        side_effects:
          - "hop 1: Producer.suspension_count incremented by 1"
          - "hop 2 (caused by hop 1): every Product of this producer with status == LISTED becomes DELISTED and its quantity_offered is set to 0"
          - "hop 3 (caused by hop 2): every Allocation with status == RESERVED whose product_id is one of those delisted Products, and whose order is in fulfillment_status IN {AGGREGATED, SCHEDULED}, becomes REVERSED; Product.quantity_committed is decremented by Allocation.quantity"
          - "hop 4 (caused by hop 3): each affected OrderLine recomputes quantity_allocated; a line with quantity_allocated == 0 returns to PENDING, a line with 0 < quantity_allocated < quantity_requested becomes SHORT"
          - "hop 5 (caused by hop 4): each affected BuyerOrder re-runs calculations.order_pricing_rollup (provisional variant); an order whose lines are all back to PENDING returns to fulfillment_status DRAFT, is detached from its route (route_id, route_sequence_no, planned_arrival_at, service_minutes set to null) and the route's stop_count and pallets_loaded are recomputed"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /producers/{id}/review with decision=REINSTATE"
        actor: HubAdmin
        preconditions:
          - "Producer.compliance_ok == true, else ERR_PRODUCER_NOT_COMPLIANT"
        side_effects:
          - "calculations.producer_compliance_evaluation refreshes Producer.food_safety_tier"
        note: "Second leg of the ACTIVE <-> SUSPENDED cycle; DELISTED products are NOT auto-relisted."
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system: POST /_clock/set_current_utc advances the clock past a VERIFIED document's expires_on and compliance_ok flips to false"
        actor: system
        preconditions:
          - "Producer.onboarding_status == ACTIVE AND Producer.compliance_ok transitions true -> false"
        side_effects:
          - "identical hop 1..hop 5 cascade as the manual SUSPEND transition"
        note: "Compliance-triggered suspension; distinct trigger, same cascade body."
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /producers/{id}/review with decision=TERMINATE"
        actor: HubAdmin
        preconditions:
          - "no Allocation with status IN {RESERVED, STAGED} references a Product of this producer, else ERR_INVALID_PRODUCER_STATE"
        side_effects:
          - "every Product of this producer becomes DELISTED with quantity_offered set to 0"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /producers/{id}/review with decision=TERMINATE"
        actor: HubAdmin
        preconditions:
          - "no Allocation with status IN {RESERVED, STAGED} references a Product of this producer, else ERR_INVALID_PRODUCER_STATE"
        side_effects:
          - "every Product of this producer becomes DELISTED with quantity_offered set to 0"
      - from: CHANGES_REQUESTED
        to: TERMINATED
        trigger: "POST /producers/{id}/review with decision=TERMINATE"
        actor: HubAdmin
        preconditions:
          - "no Allocation with status IN {RESERVED, STAGED} references a Product of this producer, else ERR_INVALID_PRODUCER_STATE"
        side_effects:
          - "Producer.updated_at refreshed and Producer.version incremented by 1"

  - entity: ProducerDocument
    dimension: status
    shape: branching_with_revert
    initial_state: SUBMITTED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /producer-documents/{id}/adjudication with decision=VERIFY"
        actor: ComplianceOfficer
        preconditions:
          - "ProducerDocument.status == SUBMITTED, else ERR_INVALID_DOCUMENT_STATE"
          - "ProducerDocument.expires_on > logical clock, else ERR_INVALID_DOCUMENT_STATE"
        side_effects:
          - "adjudicated_by_user_id set to the acting X-User-ID"
          - "any other ProducerDocument of the same producer_id and doc_type with status IN {VERIFIED, REJECTED, EXPIRED} becomes SUPERSEDED"
          - "calculations.producer_compliance_evaluation recomputes Producer.compliance_ok and Producer.food_safety_tier"
          - "if Producer.onboarding_status == SUBMITTED it auto-advances to UNDER_REVIEW"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /producer-documents/{id}/adjudication with decision=REJECT"
        actor: ComplianceOfficer
        preconditions:
          - "ProducerDocument.status == SUBMITTED, else ERR_INVALID_DOCUMENT_STATE"
        side_effects:
          - "adjudicated_by_user_id and rejection_reason set"
          - "calculations.producer_compliance_evaluation recomputes Producer.compliance_ok and Producer.food_safety_tier"
          - "if Producer.onboarding_status == SUBMITTED it auto-advances to UNDER_REVIEW"
      - from: VERIFIED
        to: EXPIRED
        trigger: "system: POST /_clock/set_current_utc moves the logical clock to an instant >= expires_on"
        actor: system
        preconditions:
          - "ProducerDocument.status == VERIFIED AND expires_on <= new logical clock"
        side_effects:
          - "calculations.producer_compliance_evaluation recomputes Producer.compliance_ok and Producer.food_safety_tier"
          - "if the producer was ACTIVE and compliance_ok flips to false, the Producer ACTIVE -> SUSPENDED cascade fires"
        note: "Expiry is strict: a document whose expires_on equals the new clock instant IS expired."
      - from: REJECTED
        to: SUPERSEDED
        trigger: "system: a newer document of the same producer_id and doc_type is VERIFIED"
        actor: system
        preconditions:
          - "a sibling document of the same doc_type reaches VERIFIED"
        side_effects:
          - "ProducerDocument.updated_at refreshed and version incremented by 1"
      - from: EXPIRED
        to: SUPERSEDED
        trigger: "system: a newer document of the same producer_id and doc_type is VERIFIED"
        actor: system
        preconditions:
          - "a sibling document of the same doc_type reaches VERIFIED"
        side_effects:
          - "ProducerDocument.updated_at refreshed and version incremented by 1"
      - from: VERIFIED
        to: SUPERSEDED
        trigger: "system: a newer document of the same producer_id and doc_type is VERIFIED"
        actor: system
        preconditions:
          - "a sibling document of the same doc_type reaches VERIFIED"
        side_effects:
          - "ProducerDocument.updated_at refreshed and version incremented by 1"

  - entity: Product
    dimension: status
    shape: cyclic
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: LISTED
        trigger: "POST /products/{id}/offers"
        actor: Producer
        preconditions:
          - "Producer.onboarding_status == ACTIVE, else ERR_INVALID_PRODUCER_STATE"
          - "Producer.compliance_ok == true, else ERR_PRODUCER_NOT_COMPLIANT"
          - "offer_window_end > offer_window_start, else ERR_INVALID_WINDOW"
          - "request carries expected_product_version equal to Product.version, else ERR_STALE_PRODUCT_VERSION"
        side_effects:
          - "quantity_offered, offer_window_start, offer_window_end set; producer_unit_price_cents overwritten when supplied"
          - "quantity_available recomputed as max(0, quantity_offered - quantity_committed)"
          - "increments Product.version by 1"
      - from: LISTED
        to: LISTED
        trigger: "POST /products/{id}/offers (re-offer / repricing)"
        actor: Producer
        preconditions:
          - "Producer.onboarding_status == ACTIVE, else ERR_INVALID_PRODUCER_STATE"
          - "quantity_offered >= Product.quantity_committed, else ERR_INVALID_REQUEST"
          - "request carries expected_product_version equal to Product.version, else ERR_STALE_PRODUCT_VERSION"
        side_effects:
          - "offer fields replaced wholesale; existing Allocations keep their snapshotted producer_unit_price_cents"
          - "increments Product.version by 1"
      - from: LISTED
        to: DELISTED
        trigger: "system: owning Producer enters SUSPENDED or TERMINATED"
        actor: system
        preconditions:
          - "Product.status == LISTED"
        side_effects:
          - "quantity_offered set to 0 so quantity_available becomes 0"
          - "increments Product.version by 1"
      - from: DELISTED
        to: LISTED
        trigger: "POST /products/{id}/offers after the producer is reinstated"
        actor: Producer
        preconditions:
          - "Producer.onboarding_status == ACTIVE, else ERR_INVALID_PRODUCER_STATE"
          - "request carries expected_product_version equal to Product.version, else ERR_STALE_PRODUCT_VERSION"
        side_effects:
          - "offer fields replaced; increments Product.version by 1"
        note: "Closes the LISTED -> DELISTED -> LISTED cycle."

  - entity: BuyerOrder
    dimension: fulfillment_status
    shape: parallel_dimension_1
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: AGGREGATED
        trigger: "POST /buyer-orders/{id}/aggregation"
        actor: HubAdmin
        preconditions:
          - "BuyerOrder.fulfillment_status == DRAFT, else ERR_INVALID_ORDER_STATE"
          - "the order has >= 1 OrderLine, else ERR_INVALID_ORDER_STATE"
          - "calculations.line_allocation_waterfall allocates >= 1 unit across the whole order, else ERR_NO_ELIGIBLE_SUPPLY"
          - "Buyer.outstanding_balance_cents + provisional order_total_cents <= Buyer.credit_limit_cents, else ERR_CREDIT_LIMIT_EXCEEDED"
        side_effects:
          - "Allocations created in status RESERVED; each Product.quantity_committed incremented and quantity_available recomputed; each Product.version incremented by 1"
          - "each OrderLine moves PENDING -> ALLOCATED or PENDING -> SHORT"
          - "calculations.hub_margin_tier_selection then calculations.order_pricing_rollup set margin_tier_bp, producer_subtotal_cents, hub_margin_cents, order_total_cents, order_pallets (provisional_at_aggregation variant)"
      - from: AGGREGATED
        to: DRAFT
        trigger: "system: a producer-suspension or dock-no-show cascade reverses every Allocation on the order"
        actor: system
        preconditions:
          - "after the cascade every OrderLine has quantity_allocated == 0"
        side_effects:
          - "order detached from any route; producer_subtotal_cents, hub_margin_cents, order_total_cents, margin_tier_bp and order_pallets reset to 0"
      - from: AGGREGATED
        to: SCHEDULED
        trigger: "POST /delivery-routes/{id}/stops"
        actor: HubAdmin
        preconditions:
          - "BuyerOrder.fulfillment_status == AGGREGATED, else ERR_INVALID_ORDER_STATE"
          - "every OrderLine.storage_class equals DeliveryRoute.storage_class, else ERR_STORAGE_CLASS_MISMATCH"
          - "the new service interval does not overlap an existing stop on the route, else ERR_STOP_WINDOW_OVERLAP"
          - "DeliveryRoute.pallets_loaded + BuyerOrder.order_pallets <= DeliveryRoute.pallet_capacity, else ERR_ROUTE_CAPACITY_EXCEEDED"
          - "request carries expected_route_version equal to DeliveryRoute.version, else ERR_STALE_ROUTE_VERSION"
        side_effects:
          - "route_id, route_sequence_no, planned_arrival_at, service_minutes set on the order"
          - "DeliveryRoute.stop_count and pallets_loaded recomputed; increments DeliveryRoute.version by 1"
      - from: SCHEDULED
        to: IN_TRANSIT
        trigger: "system: POST /delivery-routes/{id}/dispatch on the assigned route"
        actor: system
        preconditions:
          - "the route transitions LOADED -> DISPATCHED"
        side_effects:
          - "BuyerOrder.updated_at refreshed and version incremented by 1"
      - from: IN_TRANSIT
        to: DELIVERED
        trigger: "POST /buyer-orders/{id}/delivery-record"
        actor: HubAdmin
        preconditions:
          - "BuyerOrder.fulfillment_status == IN_TRANSIT, else ERR_INVALID_ORDER_STATE"
          - "every line_receipts entry references an Allocation belonging to this order, else ERR_ALLOCATION_NOT_FOUND"
          - "every delivered_quantity is between 0 and the referenced Allocation.quantity, else ERR_INVALID_REQUEST"
        side_effects:
          - "each referenced Allocation records delivered_quantity and becomes DELIVERED, or SHORT_CLOSED when delivered_quantity == 0"
          - "each OrderLine recomputes quantity_delivered; lines with quantity_delivered > 0 become DELIVERED"
          - "if every order assigned to the route has reached DELIVERED the route auto-advances DISPATCHED -> COMPLETED"
      - from: DELIVERED
        to: CLOSED
        trigger: "system: settlement_status reaches PAID or WRITTEN_OFF"
        actor: system
        preconditions:
          - "BuyerOrder.fulfillment_status == DELIVERED"
        side_effects:
          - "every OrderLine becomes SETTLED"
        note: "Cross-dimension coupling: the money axis closes the physical axis, never the reverse."

  - entity: BuyerOrder
    dimension: settlement_status
    shape: parallel_dimension_2
    initial_state: UNBILLED
    terminal_states: [PAID, WRITTEN_OFF]
    transitions:
      - from: UNBILLED
        to: INVOICED
        trigger: "POST /buyer-orders/{id}/invoice"
        actor: HubAdmin
        preconditions:
          - "BuyerOrder.fulfillment_status == DELIVERED, else ERR_INVALID_ORDER_STATE"
          - "BuyerOrder.settlement_status == UNBILLED, else ERR_INVALID_ORDER_STATE"
        side_effects:
          - "calculations.order_pricing_rollup runs under the final_at_invoice variant; margin_tier_bp is re-selected from the delivered producer subtotal"
          - "invoiced_total_cents set to the recomputed order_total_cents"
          - "invoice_due_date set to the logical clock plus Buyer.payment_terms_days days"
          - "Buyer.outstanding_balance_cents incremented by invoiced_total_cents"
      - from: INVOICED
        to: PARTIALLY_PAID
        trigger: "POST /buyer-orders/{id}/payments"
        actor: Buyer
        preconditions:
          - "BuyerOrder.settlement_status IN {INVOICED, PARTIALLY_PAID}, else ERR_ORDER_NOT_INVOICED"
          - "amount_cents <= invoiced_total_cents - paid_total_cents - credit_memo_cents, else ERR_PAYMENT_EXCEEDS_BALANCE"
          - "paid_total_cents + amount_cents + credit_memo_cents < invoiced_total_cents"
        side_effects:
          - "paid_total_cents incremented by amount_cents; Buyer.outstanding_balance_cents decremented by amount_cents"
      - from: PARTIALLY_PAID
        to: PARTIALLY_PAID
        trigger: "POST /buyer-orders/{id}/payments (subsequent instalment)"
        actor: Buyer
        preconditions:
          - "amount_cents <= invoiced_total_cents - paid_total_cents - credit_memo_cents, else ERR_PAYMENT_EXCEEDS_BALANCE"
          - "paid_total_cents + amount_cents + credit_memo_cents < invoiced_total_cents"
        side_effects:
          - "paid_total_cents incremented by amount_cents; Buyer.outstanding_balance_cents decremented by amount_cents"
        note: "Self-loop; an institutional buyer may pay in any number of instalments."
      - from: INVOICED
        to: PAID
        trigger: "POST /buyer-orders/{id}/payments that closes the balance"
        actor: Buyer
        preconditions:
          - "paid_total_cents + amount_cents + credit_memo_cents == invoiced_total_cents"
        side_effects:
          - "paid_total_cents incremented; Buyer.outstanding_balance_cents decremented by amount_cents"
          - "each Producer owning a DELIVERED Allocation on this order has patronage_volume_cents incremented by that allocation's producer_amount_cents (gross_at_delivery variant)"
          - "fulfillment_status DELIVERED -> CLOSED and every OrderLine becomes SETTLED"
      - from: PARTIALLY_PAID
        to: PAID
        trigger: "POST /buyer-orders/{id}/payments that closes the balance"
        actor: Buyer
        preconditions:
          - "paid_total_cents + amount_cents + credit_memo_cents == invoiced_total_cents"
        side_effects:
          - "paid_total_cents incremented; Buyer.outstanding_balance_cents decremented by amount_cents"
          - "each Producer owning a DELIVERED Allocation on this order has patronage_volume_cents incremented by that allocation's producer_amount_cents"
          - "fulfillment_status DELIVERED -> CLOSED and every OrderLine becomes SETTLED"
      - from: INVOICED
        to: WRITTEN_OFF
        trigger: "system: POST /_clock/set_current_utc moves the clock past invoice_due_date plus WRITE_OFF_GRACE_DAYS while a balance remains"
        actor: system
        preconditions:
          - "logical clock > invoice_due_date + WRITE_OFF_GRACE_DAYS days AND invoiced_total_cents - paid_total_cents - credit_memo_cents > 0"
        side_effects:
          - "Buyer.outstanding_balance_cents decremented by the remaining balance"
          - "fulfillment_status DELIVERED -> CLOSED; no patronage is credited to any producer"
      - from: PARTIALLY_PAID
        to: WRITTEN_OFF
        trigger: "system: POST /_clock/set_current_utc moves the clock past invoice_due_date plus WRITE_OFF_GRACE_DAYS while a balance remains"
        actor: system
        preconditions:
          - "logical clock > invoice_due_date + WRITE_OFF_GRACE_DAYS days AND invoiced_total_cents - paid_total_cents - credit_memo_cents > 0"
        side_effects:
          - "Buyer.outstanding_balance_cents decremented by the remaining balance"
          - "fulfillment_status DELIVERED -> CLOSED; no patronage is credited to any producer"

  - entity: OrderLine
    dimension: status
    shape: branching_with_revert
    initial_state: PENDING
    terminal_states: [SETTLED]
    transitions:
      - from: PENDING
        to: ALLOCATED
        trigger: "system: calculations.line_allocation_waterfall fills the line completely"
        actor: system
        preconditions:
          - "quantity_allocated == quantity_requested"
        side_effects:
          - "line_producer_cents, line_margin_cents, line_total_cents set"
      - from: PENDING
        to: SHORT
        trigger: "system: calculations.line_allocation_waterfall fills the line partially"
        actor: system
        preconditions:
          - "0 < quantity_allocated < quantity_requested"
        side_effects:
          - "line_producer_cents, line_margin_cents, line_total_cents set"
      - from: ALLOCATED
        to: SHORT
        trigger: "system: a producer-suspension or dock-no-show cascade reverses part of the line's allocations"
        actor: system
        preconditions:
          - "0 < quantity_allocated < quantity_requested after reversal"
        side_effects:
          - "line money fields recomputed from the surviving allocations"
      - from: ALLOCATED
        to: PENDING
        trigger: "system: a cascade reverses every allocation on the line"
        actor: system
        preconditions:
          - "quantity_allocated == 0 after reversal"
        side_effects:
          - "line money fields reset to 0"
      - from: SHORT
        to: PENDING
        trigger: "system: a cascade reverses every remaining allocation on the line"
        actor: system
        preconditions:
          - "quantity_allocated == 0 after reversal"
        side_effects:
          - "line money fields reset to 0"
      - from: ALLOCATED
        to: DELIVERED
        trigger: "system: POST /buyer-orders/{id}/delivery-record records quantity_delivered > 0"
        actor: system
        preconditions:
          - "quantity_delivered > 0"
        side_effects:
          - "quantity_delivered set from the line's allocations"
      - from: SHORT
        to: DELIVERED
        trigger: "system: POST /buyer-orders/{id}/delivery-record records quantity_delivered > 0"
        actor: system
        preconditions:
          - "quantity_delivered > 0"
        side_effects:
          - "quantity_delivered set from the line's allocations"
      - from: DELIVERED
        to: SETTLED
        trigger: "system: the order's settlement_status reaches PAID or WRITTEN_OFF"
        actor: system
        preconditions:
          - "BuyerOrder.fulfillment_status becomes CLOSED"
        side_effects:
          - "OrderLine.updated_at refreshed and version incremented by 1"

  - entity: Allocation
    dimension: status
    shape: branching
    initial_state: RESERVED
    terminal_states: [DELIVERED, SHORT_CLOSED, REVERSED]
    transitions:
      - from: RESERVED
        to: STAGED
        trigger: "system: POST /dock-appointments/{id}/receipt with outcome=RECEIVED for the owning producer"
        actor: system
        preconditions:
          - "Allocation.status == RESERVED"
          - "the allocation's Product.producer_id equals the appointment's producer_id"
          - "the allocation's BuyerOrder.fulfillment_status == SCHEDULED"
        side_effects:
          - "staged_temp_c set to the appointment's recorded_temp_c"
          - "temp_excursion set to (staged_temp_c > DockSlot.temp_setpoint_c + TEMP_TOLERANCE_C)"
          - "when every allocation of every order on the route is STAGED the route auto-advances PLANNED -> LOADED"
      - from: RESERVED
        to: REVERSED
        trigger: "system: producer suspension cascade or POST /dock-appointments/{id}/receipt with outcome=NO_SHOW"
        actor: system
        preconditions:
          - "Allocation.status == RESERVED"
        side_effects:
          - "Product.quantity_committed decremented by Allocation.quantity and quantity_available recomputed as max(0, quantity_offered - quantity_committed)"
          - "the owning OrderLine and BuyerOrder are recomputed (hops 4 and 5 of the cascade)"
      - from: STAGED
        to: DELIVERED
        trigger: "POST /buyer-orders/{id}/delivery-record with delivered_quantity > 0"
        actor: HubAdmin
        preconditions:
          - "Allocation.status == STAGED"
        side_effects:
          - "delivered_quantity recorded; producer_amount_cents / hub_margin_cents / buyer_amount_cents re-derived at invoice under the final_at_invoice variant"
      - from: STAGED
        to: SHORT_CLOSED
        trigger: "POST /buyer-orders/{id}/delivery-record with delivered_quantity == 0"
        actor: HubAdmin
        preconditions:
          - "Allocation.status == STAGED"
        side_effects:
          - "Product.quantity_committed decremented by Allocation.quantity; the allocation contributes 0 to every money rollup"

  - entity: DockAppointment
    dimension: status
    shape: branching
    initial_state: BOOKED
    terminal_states: [RECEIVED, NO_SHOW, CANCELLED]
    transitions:
      - from: BOOKED
        to: RECEIVED
        trigger: "POST /dock-appointments/{id}/receipt with outcome=RECEIVED"
        actor: HubAdmin
        preconditions:
          - "DockAppointment.status == BOOKED, else ERR_INVALID_APPOINTMENT_STATE"
          - "Producer.onboarding_status == ACTIVE, else ERR_INVALID_PRODUCER_STATE"
        side_effects:
          - "received_pallets and recorded_temp_c stored"
          - "every RESERVED Allocation of this producer on a SCHEDULED order becomes STAGED (see state_machines.Allocation)"
          - "DockSlot.pallets_booked recomputed; DockSlot.status refreshed"
      - from: BOOKED
        to: NO_SHOW
        trigger: "POST /dock-appointments/{id}/receipt with outcome=NO_SHOW"
        actor: HubAdmin
        preconditions:
          - "DockAppointment.status == BOOKED, else ERR_INVALID_APPOINTMENT_STATE"
        side_effects:
          - "hop 1: DockSlot.pallets_booked recomputed without this appointment and DockSlot.status refreshed"
          - "hop 2 (caused by hop 1 releasing the producer's drop): every Allocation with status == RESERVED whose Product.producer_id equals this appointment's producer_id and whose order is in fulfillment_status IN {AGGREGATED, SCHEDULED} becomes REVERSED and its Product.quantity_committed is decremented"
          - "hop 3 (caused by hop 2): each affected OrderLine recomputes quantity_allocated and moves ALLOCATED -> SHORT or ALLOCATED/SHORT -> PENDING"
          - "hop 4 (caused by hop 3): each affected BuyerOrder re-runs calculations.order_pricing_rollup; an order left with zero allocated units returns to DRAFT, is detached from its route, and the route's stop_count and pallets_loaded are recomputed"
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /dock-appointments/{id}/receipt with outcome=CANCELLED"
        actor: HubAdmin
        preconditions:
          - "DockAppointment.status == BOOKED, else ERR_INVALID_APPOINTMENT_STATE"
        side_effects:
          - "DockSlot.pallets_booked recomputed without this appointment; no allocation is touched"

  - entity: DeliveryRoute
    dimension: status
    shape: compound
    initial_state: PLANNED
    terminal_states: [COMPLETED]
    transitions:
      - from: PLANNED
        to: LOADED
        trigger: "system: every Allocation of every order assigned to this route reaches STAGED"
        actor: system
        preconditions:
          - "DeliveryRoute.stop_count >= 1"
          - "no order on the route holds an Allocation in status RESERVED"
        side_effects:
          - "DeliveryRoute.updated_at refreshed and version incremented by 1"
        note: "Compound: route state is a function of the states of allocations two aggregates away."
      - from: LOADED
        to: DISPATCHED
        trigger: "POST /delivery-routes/{id}/dispatch"
        actor: HubAdmin
        preconditions:
          - "DeliveryRoute.status == LOADED, else ERR_INVALID_ROUTE_STATE"
          - "pallets_loaded <= pallet_capacity, else ERR_ROUTE_CAPACITY_EXCEEDED"
        side_effects:
          - "every assigned BuyerOrder moves SCHEDULED -> IN_TRANSIT"
      - from: DISPATCHED
        to: COMPLETED
        trigger: "system: every assigned BuyerOrder reaches fulfillment_status DELIVERED"
        actor: system
        preconditions:
          - "no assigned order remains in IN_TRANSIT"
        side_effects:
          - "DeliveryRoute.updated_at refreshed and version incremented by 1"

  - entity: RejectionClaim
    dimension: status
    shape: branching
    initial_state: FILED
    terminal_states: [APPROVED, DENIED, WITHDRAWN]
    transitions:
      - from: FILED
        to: APPROVED
        trigger: "POST /rejection-claims/{id}/adjudication with decision=APPROVE"
        actor: ComplianceOfficer
        preconditions:
          - "RejectionClaim.status == FILED, else ERR_INVALID_CLAIM_STATE"
          - "X-User-ID differs from RejectionClaim.filed_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "calculations.rejection_shrink_allocation sets producer_fault_bp, buyer_credit_cents, producer_charge_cents, hub_absorbed_cents"
          - "Allocation.rejected_quantity, producer_charge_cents and hub_absorbed_cents incremented"
          - "OrderLine.quantity_rejected incremented"
          - "BuyerOrder.credit_memo_cents incremented by buyer_credit_cents and Buyer.outstanding_balance_cents decremented by the same amount"
          - "Producer.shrink_charge_cents incremented by producer_charge_cents"
      - from: FILED
        to: DENIED
        trigger: "POST /rejection-claims/{id}/adjudication with decision=DENY"
        actor: ComplianceOfficer
        preconditions:
          - "RejectionClaim.status == FILED, else ERR_INVALID_CLAIM_STATE"
          - "X-User-ID differs from RejectionClaim.filed_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "adjudicated_by_user_id recorded; no money moves"
      - from: FILED
        to: WITHDRAWN
        trigger: "POST /rejection-claims/{id}/adjudication with decision=WITHDRAW"
        actor: Buyer
        preconditions:
          - "RejectionClaim.status == FILED, else ERR_INVALID_CLAIM_STATE"
          - "X-User-ID equals the Buyer that owns the claim's order, else ERR_NOT_RESOURCE_OWNER"
        side_effects:
          - "adjudicated_by_user_id recorded; no money moves"

  - entity: PatronageCycle
    dimension: status
    shape: branching
    initial_state: PROPOSED
    terminal_states: [DISTRIBUTED, CANCELLED]
    transitions:
      - from: PROPOSED
        to: RATIFIED
        trigger: "POST /patronage-cycles/{id}/ratification with decision=RATIFY"
        actor: BoardDirector
        preconditions:
          - "PatronageCycle.status == PROPOSED, else ERR_INVALID_CYCLE_STATE"
          - "X-User-ID differs from PatronageCycle.proposed_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
          - "basis_snapshot_total_cents computed by calculations.patronage_basis_valuation (net_at_ratification variant) is > 0, else ERR_NO_PATRONAGE_BASIS"
        side_effects:
          - "basis_snapshot_total_cents and eligible_producer_count frozen"
          - "ratified_by_user_id recorded"
      - from: PROPOSED
        to: CANCELLED
        trigger: "POST /patronage-cycles/{id}/ratification with decision=REJECT"
        actor: BoardDirector
        preconditions:
          - "PatronageCycle.status == PROPOSED, else ERR_INVALID_CYCLE_STATE"
          - "X-User-ID differs from PatronageCycle.proposed_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "ratified_by_user_id recorded; no distribution occurs"
      - from: RATIFIED
        to: DISTRIBUTED
        trigger: "POST /patronage-cycles/{id}/distribution"
        actor: HubAdmin
        preconditions:
          - "PatronageCycle.status == RATIFIED, else ERR_INVALID_CYCLE_STATE"
        side_effects:
          - "calculations.patronage_distribution_waterfall credits each eligible Producer.retained_patronage_cents"
          - "distributed_total_cents and remainder_cents set so that distributed_total_cents + remainder_cents == distributable_pool_cents"

# =====================================================================
# 1.2.1 Concurrency Rules (OCC on the parent's version — no other mechanism)
# =====================================================================
concurrency_rules:
  - rule_id: offer-publish-stale-product
    parent_entity: Product
    write_endpoint: "POST /products/{id}/offers"
    occ_field: "expected_product_version"
    description: |
      Publishing an offer against a Product whose version has advanced since
      the client last observed it is rejected. A new offer legitimately
      replaces the prior offer window, quantity and price wholesale, so the
      server cannot merge; it requires the writer to prove its view of the
      product is current. Allocation commits and delisting cascades also bump
      Product.version, so a stale view can arise without any competing offer.
    error_id: ERR_STALE_PRODUCT_VERSION
    http_status: 412

  - rule_id: appointment-book-stale-dock-slot
    parent_entity: DockSlot
    write_endpoint: "POST /dock-appointments"
    occ_field: "expected_dock_slot_version"
    description: |
      Booking a cross-dock appointment against a DockSlot whose version has
      advanced since the client read its remaining pallet capacity is
      rejected. Capacity and sanitation-buffer feasibility are both functions
      of the slot's current appointment set, so a stale slot view can produce
      a booking the client believed was feasible.
    error_id: ERR_STALE_DOCK_SLOT_VERSION
    http_status: 412

  - rule_id: route-stop-stale-route
    parent_entity: DeliveryRoute
    write_endpoint: "POST /delivery-routes/{id}/stops"
    occ_field: "expected_route_version"
    description: |
      Adding a stop to a DeliveryRoute whose version has advanced since the
      client read its remaining pallet capacity and stop windows is rejected.
      A no-show cascade can detach an order and change pallets_loaded without
      any competing stop write, so the version is the only sound proof that
      the planner's view of the route is current.
    error_id: ERR_STALE_ROUTE_VERSION
    http_status: 412

# =====================================================================
# 1.3 Calculation Rules Table
# =====================================================================
calculations:

  - name: producer_compliance_evaluation
    trigger: "On POST /producer-documents/{id}/adjudication, on POST /_clock/set_current_utc, and immediately before a Product is considered by line_allocation_waterfall"
    algorithm: threshold
    formula: |
      now := logical clock
      verified(t) := EXISTS d in ProducerDocument
                       WHERE d.producer_id == producer.id
                         AND d.doc_type == t
                         AND d.status == VERIFIED
                         AND d.expires_on > now          # STRICT: expires_on == now is EXPIRED
      compliance_ok := verified(GAP_AUDIT) AND verified(LIABILITY_INSURANCE) AND verified(HACCP_PLAN)
      food_safety_tier :=
          TIER_AUDITED  if compliance_ok AND verified(ORGANIC_CERT) AND verified(WATER_TEST)
          TIER_BASIC    if compliance_ok
          TIER_NONE     otherwise
    input_set: "ProducerDocument rows of this producer with status == VERIFIED only; SUBMITTED, REJECTED, EXPIRED and SUPERSEDED rows never count"
    constants:
      REQUIRED_DOC_TYPES: [GAP_AUDIT, LIABILITY_INSURANCE, HACCP_PLAN]
      AUDITED_EXTRA_DOC_TYPES: [ORGANIC_CERT, WATER_TEST]
    precision: "boolean / enum; datetime comparison is exact to the millisecond"

  - name: line_allocation_waterfall
    trigger: "POST /buyer-orders/{id}/aggregation"
    algorithm: waterfall_allocation
    formula: |
      # Pass 1 — physical allocation. Lines are processed in ASC OrderLine.created_at.
      FOR each OrderLine L of the order IN ASC L.created_at:
        remaining := L.quantity_requested
        # eligibility filter (all clauses conjunctive)
        candidates := { Product P :
              P.status == LISTED
          AND P.commodity_code   == L.commodity_code
          AND P.storage_class    == L.storage_class
          AND P.unit_of_measure  == L.unit_of_measure
          AND P.quantity_available > 0
          AND P.offer_window_start <= order.requested_delivery_date
          AND order.requested_delivery_date < P.offer_window_end
          AND Producer(P).onboarding_status == ACTIVE
          AND Producer(P).compliance_ok == true
          AND P.producer_unit_price_cents
              + round_half_up(P.producer_unit_price_cents * MARGIN_BP_CEILING / 10000)
              <= L.max_unit_price_cents }
        # ranking expression, applied in this exact order
        rank candidates BY  (1) P.producer_unit_price_cents            ASC
                            (2) Producer(P).patronage_volume_cents     ASC
                            (3) P.created_at                           ASC
        FOR each P in rank order WHILE remaining > 0:
          take := min(remaining, P.quantity_available)
          create Allocation{ order_line_id: L.id, product_id: P.id, quantity: take,
                             producer_unit_price_cents: P.producer_unit_price_cents,
                             status: RESERVED }
          P.quantity_committed += take
          remaining -= take
        L.quantity_allocated := L.quantity_requested - remaining
        L.status := ALLOCATED if remaining == 0
                    SHORT     if 0 < L.quantity_allocated < L.quantity_requested
                    PENDING   if L.quantity_allocated == 0
      IF sum over lines of L.quantity_allocated == 0 -> ERR_NO_ELIGIBLE_SUPPLY (422)
    input_set: "Products in status LISTED with quantity_available > 0 owned by producers in onboarding_status ACTIVE with compliance_ok == true; DRAFT and DELISTED products and any product of a SUBMITTED/UNDER_REVIEW/CHANGES_REQUESTED/SUSPENDED/TERMINATED producer are excluded"
    constants:
      MARGIN_BP_CEILING: 1800
    precision: "integer units; no fractional allocation"
    notes: |
      Empty-pool fallback is per line: a line with an empty candidate set stays
      PENDING with quantity_allocated == 0 and the run continues. Only when
      EVERY line ends at zero does the whole request fail with
      ERR_NO_ELIGIBLE_SUPPLY and no Allocation is persisted.
      The eligibility price ceiling deliberately uses the WORST tier
      (MARGIN_BP_CEILING = 1800) because the order's real tier is not known
      until pass 1 finishes; the ceiling is therefore conservative in the
      buyer's favour and never re-evaluated afterwards.

  - name: hub_margin_tier_selection
    trigger: "Immediately after line_allocation_waterfall pass 1, and again at POST /buyer-orders/{id}/invoice"
    algorithm: tiered_pricing
    formula: |
      # EVALUATION ORDER IS PINNED — read this before implementing.
      # order_total_cents = producer_subtotal_cents + hub_margin_cents, and
      # hub_margin_cents is derived from a tier. The tier is selected from
      # producer_subtotal_cents (the PRE-MARGIN figure) and is NEVER re-selected
      # from order_total_cents, even when adding the margin pushes the order
      # total across a higher tier boundary. One pass, no fixed-point iteration.
      producer_subtotal_cents := SUM over the order's valuation allocations of
                                 producer_amount_cents          # see order_pricing_rollup
      margin_tier_bp :=
          1800  if producer_subtotal_cents  <  50000
          1500  if  50000 <= producer_subtotal_cents <  200000
          1250  if 200000 <= producer_subtotal_cents <  500000
          1000  if producer_subtotal_cents >= 500000
    input_set: "Allocations of the order in status RESERVED or STAGED (provisional variant), or in status DELIVERED (final variant); REVERSED and SHORT_CLOSED allocations contribute 0"
    constants:
      TIER_1_UPPER_EXCLUSIVE_CENTS: 50000
      TIER_2_UPPER_EXCLUSIVE_CENTS: 200000
      TIER_3_UPPER_EXCLUSIVE_CENTS: 500000
      TIER_BP: [1800, 1500, 1250, 1000]
    precision: "integer basis points; tier lower bounds are inclusive (>=), upper bounds exclusive (<)"

  - name: order_pricing_rollup
    trigger: "POST /buyer-orders/{id}/aggregation (provisional) and POST /buyer-orders/{id}/invoice (final); also re-run by every cascade that reverses an allocation"
    algorithm: aggregation
    formula: |
      # ROUNDING ORDER IS PINNED: round per allocation, THEN sum.
      # Summing first and rounding once produces a different number of cents
      # and is WRONG under this specification.
      FOR each valuation allocation A of the order IN ASC A.created_at:
        A.producer_amount_cents := valuation_quantity(A) * A.producer_unit_price_cents
      producer_subtotal_cents := SUM of A.producer_amount_cents
      margin_tier_bp := hub_margin_tier_selection(producer_subtotal_cents)
      FOR each valuation allocation A IN ASC A.created_at:
        A.margin_bp        := margin_tier_bp
        A.hub_margin_cents := round_half_up(A.producer_amount_cents * margin_tier_bp / 10000)
      raw_margin_total := SUM of A.hub_margin_cents
      hub_margin_cents := max(raw_margin_total, MIN_ORDER_MARGIN_CENTS)
      IF hub_margin_cents > raw_margin_total:
        top_up := hub_margin_cents - raw_margin_total
        target := the allocation with the greatest producer_amount_cents;
                  ties broken by ASC created_at
        target.hub_margin_cents += top_up
      FOR each valuation allocation A:
        A.buyer_amount_cents := A.producer_amount_cents + A.hub_margin_cents
      order_total_cents := producer_subtotal_cents + hub_margin_cents
      order_pallets := SUM over allocations of ceil(A.quantity / Product(A).units_per_pallet)
      # per line
      L.line_producer_cents := SUM of A.producer_amount_cents for A on L
      L.line_margin_cents   := SUM of A.hub_margin_cents      for A on L
      L.line_total_cents    := L.line_producer_cents + L.line_margin_cents
    input_set: "provisional_at_aggregation: allocations in status RESERVED or STAGED, valuation_quantity(A) = A.quantity. final_at_invoice: allocations in status DELIVERED, valuation_quantity(A) = A.delivered_quantity; SHORT_CLOSED and REVERSED allocations are excluded from both."
    constants:
      MIN_ORDER_MARGIN_CENTS: 2500
    notes: |
      Empty-set guard: when the order has no valuation allocation at all
      (every allocation REVERSED or SHORT_CLOSED), producer_subtotal_cents,
      hub_margin_cents, margin_tier_bp and order_total_cents are all 0 and
      MIN_ORDER_MARGIN_CENTS is NOT applied - there is no row to carry the
      top-up, so the floor cannot manufacture margin out of nothing.
    precision: "integer cents, round_half_up per allocation; the pallet ceiling is taken per allocation and then summed"
    variants:
      - name: provisional_at_aggregation
        when: "POST /buyer-orders/{id}/aggregation, and after any cascade that reverses allocations while the order is still pre-delivery"
        difference: "valuation_quantity(A) = A.quantity (what was reserved). Sets producer_subtotal_cents / hub_margin_cents / order_total_cents but never invoiced_total_cents."
      - name: final_at_invoice
        when: "POST /buyer-orders/{id}/invoice"
        difference: "valuation_quantity(A) = A.delivered_quantity (what actually arrived). Because the subtotal shrinks, hub_margin_tier_selection may land on a HIGHER basis-point tier than the provisional run did, so the final margin is not a proportional scaling of the provisional margin. The result is frozen into invoiced_total_cents."

  - name: rejection_shrink_allocation
    trigger: "POST /rejection-claims/{id}/adjudication with decision=APPROVE"
    algorithm: weighted_scoring
    formula: |
      A := Allocation(claim.allocation_id)
      buyer_credit_cents := round_half_up(A.buyer_amount_cents * claim.quantity_rejected
                                          / A.delivered_quantity)
      base_bp :=
          2000   if claim.reason_code == TEMP_ABUSE      AND A.temp_excursion == true
          8000   if claim.reason_code == TEMP_ABUSE      AND A.temp_excursion == false
          5000   if claim.reason_code == DAMAGE
          9000   if claim.reason_code == SPEC_MISMATCH
         10000   if claim.reason_code == SHORT_COUNT
             0   if claim.reason_code == LATE_DELIVERY
      relieved_bp := max(0, base_bp - AUDITED_TIER_RELIEF_BP)
                       if Producer(A).food_safety_tier == TIER_AUDITED
                     else base_bp
      producer_fault_bp   := min(relieved_bp, PRODUCER_FAULT_CAP_BP)
      producer_charge_cents := round_half_up(buyer_credit_cents * producer_fault_bp / 10000)
      hub_absorbed_cents    := buyer_credit_cents - producer_charge_cents
    input_set: "The single Allocation named by the claim; its temp_excursion flag was frozen at staging time from the DockAppointment receipt, and the producer's food_safety_tier is read at adjudication time"
    constants:
      TEMP_ABUSE_EXCURSION_BP: 2000
      TEMP_ABUSE_NO_EXCURSION_BP: 8000
      DAMAGE_BP: 5000
      SPEC_MISMATCH_BP: 9000
      SHORT_COUNT_BP: 10000
      LATE_DELIVERY_BP: 0
      AUDITED_TIER_RELIEF_BP: 1500
      PRODUCER_FAULT_CAP_BP: 9000
    precision: "integer cents, round_half_up; hub_absorbed_cents is computed by subtraction so producer_charge_cents + hub_absorbed_cents == buyer_credit_cents exactly"
    notes: |
      TEMP_ABUSE inverts on entity state: a cold-chain failure the hub's own
      dock recorded (temp_excursion == true) puts the hub at fault (2000 bp to
      the producer); the same reason code with a clean receipt puts the
      producer at fault (8000 bp). The audited-tier relief is applied BEFORE
      the cap, so a TIER_AUDITED producer on SHORT_COUNT pays
      min(10000 - 1500, 9000) = 8500 bp, not 9000.

  - name: patronage_basis_valuation
    trigger: "Continuously as orders are paid (gross), and once at POST /patronage-cycles/{id}/ratification (net snapshot)"
    algorithm: aggregation
    formula: |
      gross(p)  := p.patronage_volume_cents
      net(p)    := max(0, p.patronage_volume_cents - p.shrink_charge_cents)
      eligible(p) := p.onboarding_status == ACTIVE
                     AND p.compliance_ok == true
                     AND net(p) > 0
      basis_snapshot_total_cents := SUM of net(p) over eligible producers
      eligible_producer_count    := COUNT of eligible producers
    input_set: "Producers only; patronage_volume_cents accrues from Allocations that reached DELIVERED on an order whose settlement_status reached PAID. Orders that reached WRITTEN_OFF never credit patronage."
    constants: {}
    precision: "integer cents"
    variants:
      - name: gross_at_delivery
        when: "The running Producer.patronage_volume_cents field, credited when an order's settlement_status reaches PAID"
        difference: "Counts the full Allocation.producer_amount_cents with no deduction for approved rejection claims, so a producer with shrink charges shows a larger basis here than in the ratification snapshot."
      - name: net_at_ratification
        when: "PatronageCycle ratification freezes basis_snapshot_total_cents and drives the distribution waterfall"
        difference: "Subtracts Producer.shrink_charge_cents, floored at 0. For identical underlying rows the two variants produce different per-producer bases and therefore different distribution shares."

  - name: patronage_distribution_waterfall
    trigger: "POST /patronage-cycles/{id}/distribution"
    algorithm: waterfall_allocation
    formula: |
      pool      := cycle.distributable_pool_cents
      total     := cycle.basis_snapshot_total_cents
      cap_cents := floor(pool * PATRONAGE_CAP_BP / 10000)
      FOR each eligible producer p (as frozen at ratification):
        raw(p)  := pool * net(p) / total                 # exact rational, not rounded yet
        base(p) := min(floor(raw(p)), cap_cents)
      leftover := pool - SUM of base(p)
      headroom(p) := cap_cents - base(p)
      order producers BY (1) DESC fractional_part(raw(p))
                         (2) DESC net(p)
                         (3) ASC  p.created_at
      WHILE leftover > 0 AND SUM of headroom(p) > 0:
        walk the ordered producer list; give 1 cent to each p with headroom(p) > 0,
        decrement headroom(p) and leftover by 1, stop the moment leftover hits 0
      FOR each eligible producer p:
        p.retained_patronage_cents += base(p)            # base(p) now includes cents won above
      distributed_total_cents := SUM of base(p)
      remainder_cents         := pool - distributed_total_cents
    input_set: "Exactly the producer set and net() bases frozen at ratification; a producer suspended between ratification and distribution still receives its frozen share"
    constants:
      PATRONAGE_CAP_BP: 3000
    precision: "integer cents; floor first, then a largest-remainder walk bounded by the per-member cap"
    notes: |
      The cap makes the waterfall lossy on purpose: when the cap binds for
      every member the pool cannot be fully distributed and the undistributed
      balance lands in remainder_cents. The invariant
      distributed_total_cents + remainder_cents == distributable_pool_cents
      holds in every case.

  - name: producer_voting_shares
    trigger: "POST /producers/{id}/equity-contributions, and on every read of Producer"
    algorithm: threshold
    formula: |
      voting_shares := min(floor(paid_in_capital_cents / EQUITY_SHARE_UNIT_CENTS),
                           MAX_VOTING_SHARES)
    input_set: "Producer.paid_in_capital_cents only; retained patronage never converts to voting shares"
    constants:
      EQUITY_SHARE_UNIT_CENTS: 25000
      MAX_VOTING_SHARES: 10
    precision: "integer; the boundary is inclusive — exactly 25000 cents yields 1 share, 24999 yields 0"

  - name: dock_slot_occupancy
    trigger: "POST /dock-appointments and POST /dock-appointments/{id}/receipt"
    algorithm: interval_merge
    formula: |
      # AGGREGATE capacity over a half-open overlap test.
      OVERLAP(new) := { a in DockAppointment :
                          a.dock_slot_id == new.dock_slot_id
                      AND a.status IN {BOOKED, RECEIVED}
                      AND a.arrival_start <  new.arrival_end
                      AND new.arrival_start <  a.arrival_end }      # touching endpoints do NOT overlap
      capacity_ok := new.pallets + SUM over OVERLAP(new) of a.pallets
                     <= slot.pallet_capacity
      # BUFFERED separation, evaluated against every appointment on the slot,
      # overlapping or not, whose risk_class differs.
      CROSS(new) := { a in DockAppointment :
                          a.dock_slot_id == new.dock_slot_id
                      AND a.status IN {BOOKED, RECEIVED}
                      AND a.risk_class != new.risk_class }
      buffer_ok := FOR ALL a in CROSS(new):
                        a.arrival_end   + slot.sanitation_buffer_minutes <= new.arrival_start
                     OR new.arrival_end + slot.sanitation_buffer_minutes <= a.arrival_start
      # Field maintenance
      pallets_booked := SUM of a.pallets over appointments with status IN {BOOKED, RECEIVED}
      slot.status    := CLOSED if logical clock >= slot.window_end
                        FULL   if pallets_booked >= slot.pallet_capacity
                        OPEN   otherwise
    input_set: "Appointments on the same dock_slot_id with status BOOKED or RECEIVED; NO_SHOW and CANCELLED appointments release their pallets and are excluded from both tests"
    constants:
      DEFAULT_SANITATION_BUFFER_MINUTES: 45
    precision: "minute resolution on datetimes; capacity is checked with capacity_ok BEFORE buffer_ok, so a request violating both returns ERR_DOCK_CAPACITY_EXCEEDED"

  - name: route_stop_window_check
    trigger: "POST /delivery-routes/{id}/stops"
    algorithm: interval_merge
    formula: |
      # EXCLUSIVE occupation of one vehicle, half-open, adjacency EXPLICITLY allowed.
      new_start := planned_arrival_at
      new_end   := planned_arrival_at + service_minutes minutes
      require service_minutes >= 1                       # zero-length stop is rejected
      conflict := EXISTS o in BuyerOrder :
                      o.route_id == route.id
                  AND o.id != new order id
                  AND o.planned_arrival_at < new_end
                  AND new_start < o.planned_arrival_at + o.service_minutes minutes
      # o.end == new_start (back-to-back) is NOT a conflict.
      order_pallets := SUM over the order's allocations of
                       ceil(A.quantity / Product(A).units_per_pallet)
      capacity_ok := route.pallets_loaded + order_pallets <= route.pallet_capacity
    input_set: "BuyerOrders whose route_id equals this route; orders detached by a cascade (route_id null) free their window immediately"
    constants: {}
    precision: "minute resolution; interval is [start, start + service_minutes), so adjacency at a shared endpoint is legal"

# =====================================================================
# 1.4 Validation Rules Table (evaluated strictly in ascending priority)
# =====================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "X-User-Role is one of HubAdmin, ComplianceOfficer, Producer, Buyer, BoardDirector"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 3
    category: auth
    check: "the endpoint's roles list contains X-User-Role"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 4
    category: existence
    check: "every path-segment resource id resolves, validated left to right"
    error_id: ERR_PRODUCER_NOT_FOUND
    http_status: 404
    applies_to: "all path-templated endpoints; the concrete error_id is the one matching the missing segment (ERR_PRODUCER_NOT_FOUND, ERR_DOCUMENT_NOT_FOUND, ERR_PRODUCT_NOT_FOUND, ERR_BUYER_NOT_FOUND, ERR_ORDER_NOT_FOUND, ERR_ALLOCATION_NOT_FOUND, ERR_DOCK_SLOT_NOT_FOUND, ERR_APPOINTMENT_NOT_FOUND, ERR_ROUTE_NOT_FOUND, ERR_CLAIM_NOT_FOUND, ERR_CYCLE_NOT_FOUND)"
  - priority: 5
    category: existence
    check: "every foreign-key id supplied in the request body resolves to an existing row"
    error_id: ERR_PRODUCT_NOT_FOUND
    http_status: 404
    applies_to: "POST /products (producer_id -> ERR_PRODUCER_NOT_FOUND), POST /buyer-orders (buyer_id -> ERR_BUYER_NOT_FOUND), POST /dock-appointments (dock_slot_id -> ERR_DOCK_SLOT_NOT_FOUND, producer_id -> ERR_PRODUCER_NOT_FOUND), POST /delivery-routes/{id}/stops (order_id -> ERR_ORDER_NOT_FOUND), POST /rejection-claims (allocation_id -> ERR_ALLOCATION_NOT_FOUND), POST /buyer-orders/{id}/delivery-record (line_receipts[].allocation_id -> ERR_ALLOCATION_NOT_FOUND)"
  - priority: 6
    category: business_constraint
    check: "request body required fields present; enum values legal; numeric fields within their declared constraints; datetimes parse as ISO 8601 UTC"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST endpoints"
  - priority: 7
    category: auth
    check: "for entity_backed roles the acting X-User-ID equals the owning entity id — Producer acts only on its own Producer/ProducerDocument/Product/DockAppointment rows, Buyer acts only on its own Buyer/BuyerOrder/OrderLine/RejectionClaim rows"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /producers/{id}/application, POST /producers/{id}/documents, POST /products, POST /products/{id}/offers, POST /dock-appointments, POST /buyer-orders, POST /buyer-orders/{id}/lines, POST /buyer-orders/{id}/payments, POST /rejection-claims, POST /rejection-claims/{id}/adjudication"
  - priority: 8
    category: auth
    check: "the requested decision is one this role may issue: APPROVE and REQUEST_CHANGES require ComplianceOfficer; SUSPEND, REINSTATE and TERMINATE require HubAdmin; APPROVE and DENY on a claim require ComplianceOfficer; WITHDRAW on a claim requires Buyer"
    error_id: ERR_DECISION_ROLE_MISMATCH
    http_status: 403
    applies_to: "POST /producers/{id}/review, POST /rejection-claims/{id}/adjudication"
  - priority: 9
    category: state
    check: "the supplied expected_<parent>_version equals the parent entity's current version"
    error_id: ERR_STALE_PRODUCT_VERSION
    http_status: 412
    applies_to: "POST /products/{id}/offers (ERR_STALE_PRODUCT_VERSION), POST /dock-appointments (ERR_STALE_DOCK_SLOT_VERSION), POST /delivery-routes/{id}/stops (ERR_STALE_ROUTE_VERSION)"
  - priority: 10
    category: state
    check: "the target resource is in a state from which the requested transition is declared in §1.2"
    error_id: ERR_INVALID_ORDER_STATE
    http_status: 409
    applies_to: "all transition endpoints; the concrete error_id is ERR_INVALID_PRODUCER_STATE, ERR_INVALID_DOCUMENT_STATE, ERR_INVALID_ORDER_STATE, ERR_INVALID_APPOINTMENT_STATE, ERR_INVALID_ROUTE_STATE, ERR_INVALID_CLAIM_STATE or ERR_INVALID_CYCLE_STATE. POST /rejection-claims is covered by this row too: the allocation's BuyerOrder must be fulfillment_status DELIVERED and settlement_status IN {INVOICED, PARTIALLY_PAID}, and the Allocation itself must be status DELIVERED, else ERR_INVALID_ORDER_STATE"
  - priority: 11
    category: state
    check: "POST /buyer-orders/{id}/payments requires settlement_status IN {INVOICED, PARTIALLY_PAID}"
    error_id: ERR_ORDER_NOT_INVOICED
    http_status: 409
    applies_to: "POST /buyer-orders/{id}/payments"
  - priority: 12
    category: business_safety
    check: "segregation of duties — the acting X-User-ID must not also have performed the conflicting prior step: approving a producer whose documents this same user verified; ratifying a patronage cycle this same user proposed; adjudicating a rejection claim this same user filed"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /producers/{id}/review (decision=APPROVE), POST /patronage-cycles/{id}/ratification, POST /rejection-claims/{id}/adjudication"
  - priority: 13
    category: business_safety
    check: "the producer whose supply, catalog or dock drop is involved is in onboarding_status ACTIVE with compliance_ok == true"
    error_id: ERR_PRODUCER_NOT_COMPLIANT
    http_status: 422
    applies_to: "POST /products, POST /products/{id}/offers, POST /dock-appointments, POST /producers/{id}/review (decision=APPROVE or REINSTATE)"
  - priority: 14
    category: business_safety
    check: "submitting an application requires at least one ProducerDocument in status SUBMITTED or VERIFIED for every doc_type in REQUIRED_DOC_TYPES"
    error_id: ERR_MISSING_REQUIRED_DOCUMENTS
    http_status: 422
    applies_to: "POST /producers/{id}/application"
  - priority: 15
    category: business_safety
    check: "every OrderLine.storage_class on an order being added to a route equals DeliveryRoute.storage_class"
    error_id: ERR_STORAGE_CLASS_MISMATCH
    http_status: 422
    applies_to: "POST /delivery-routes/{id}/stops"
  - priority: 16
    category: business_referential
    check: "every line_receipts[].allocation_id belongs to an OrderLine of the order named in the path"
    error_id: ERR_ALLOCATION_NOT_FOUND
    http_status: 404
    applies_to: "POST /buyer-orders/{id}/delivery-record"
  - priority: 17
    category: business_constraint
    check: "Producer.review_cycles < MAX_REVIEW_CYCLES before issuing another REQUEST_CHANGES"
    error_id: ERR_REVIEW_CYCLE_LIMIT
    http_status: 409
    applies_to: "POST /producers/{id}/review (decision=REQUEST_CHANGES)"
  - priority: 18
    category: business_temporal
    check: "interval end is strictly after interval start, and a route stop's service_minutes is >= 1"
    error_id: ERR_INVALID_WINDOW
    http_status: 422
    applies_to: "POST /products/{id}/offers, POST /dock-slots, POST /dock-appointments, POST /delivery-routes/{id}/stops"
  - priority: 19
    category: business_temporal
    check: "the appointment interval lies inside [DockSlot.window_start, DockSlot.window_end)"
    error_id: ERR_INVALID_WINDOW
    http_status: 422
    applies_to: "POST /dock-appointments"
  - priority: 20
    category: business_constraint
    check: "aggregate dock capacity — new.pallets plus the pallets of every BOOKED/RECEIVED appointment whose half-open interval overlaps the new one must not exceed DockSlot.pallet_capacity"
    error_id: ERR_DOCK_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /dock-appointments"
  - priority: 21
    category: business_constraint
    check: "sanitation separation — every BOOKED/RECEIVED appointment on the slot with a different risk_class must be separated from the new interval by at least DockSlot.sanitation_buffer_minutes on one side"
    error_id: ERR_SANITATION_BUFFER_VIOLATION
    http_status: 409
    applies_to: "POST /dock-appointments"
  - priority: 22
    category: business_constraint
    check: "exclusive route service window — the new stop's half-open interval must not overlap any existing stop's interval on the same route; sharing an endpoint (back-to-back) is legal"
    error_id: ERR_STOP_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /delivery-routes/{id}/stops"
  - priority: 23
    category: business_constraint
    check: "DeliveryRoute.pallets_loaded + BuyerOrder.order_pallets <= DeliveryRoute.pallet_capacity"
    error_id: ERR_ROUTE_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /delivery-routes/{id}/stops, POST /delivery-routes/{id}/dispatch"
  - priority: 24
    category: business_constraint
    check: "dispatching a route in status PLANNED because some allocation is still RESERVED"
    error_id: ERR_ALLOCATIONS_NOT_STAGED
    http_status: 409
    applies_to: "POST /delivery-routes/{id}/dispatch"
  - priority: 25
    category: business_constraint
    check: "the aggregation run allocated at least one unit across the whole order"
    error_id: ERR_NO_ELIGIBLE_SUPPLY
    http_status: 422
    applies_to: "POST /buyer-orders/{id}/aggregation"
  - priority: 26
    category: business_constraint
    check: "quantity_rejected <= Allocation.delivered_quantity - Allocation.rejected_quantity"
    error_id: ERR_REJECTION_EXCEEDS_DELIVERED
    http_status: 422
    applies_to: "POST /rejection-claims"
  - priority: 27
    category: business_constraint
    check: "fiscal_year is not already used by another PatronageCycle"
    error_id: ERR_DUPLICATE_FISCAL_YEAR
    http_status: 409
    applies_to: "POST /patronage-cycles"
  - priority: 28
    category: business_constraint
    check: "basis_snapshot_total_cents computed at ratification is greater than 0"
    error_id: ERR_NO_PATRONAGE_BASIS
    http_status: 422
    applies_to: "POST /patronage-cycles/{id}/ratification (decision=RATIFY)"
  - priority: 29
    category: business_fiscal
    check: "amount_cents <= invoiced_total_cents - paid_total_cents - credit_memo_cents"
    error_id: ERR_PAYMENT_EXCEEDS_BALANCE
    http_status: 422
    applies_to: "POST /buyer-orders/{id}/payments"
  - priority: 30
    category: business_fiscal
    check: "Buyer.outstanding_balance_cents + the provisional order_total_cents must not exceed Buyer.credit_limit_cents"
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /buyer-orders/{id}/aggregation"

# =====================================================================
# 1.5 API Endpoint Table
# =====================================================================
endpoints:

  # ---- Producer onboarding ----
  - method: POST
    path: "/producers"
    description: "Register a prospective member producer in DRAFT"
    roles: [HubAdmin]
    code: 201
    input: [legal_name, region_code, contact_email]
    output: Producer
    side_effects: ["Producer created with onboarding_status DRAFT, compliance_ok false, food_safety_tier TIER_NONE"]
  - method: GET
    path: "/producers/{id}"
    description: "Read one producer including computed compliance, tier, equity and patronage fields"
    roles: [HubAdmin, ComplianceOfficer, Producer, BoardDirector]
    code: 200
    input: []
    output: Producer
    side_effects: []
  - method: GET
    path: "/producers/{id}/documents"
    description: "List a producer's food-safety documents (reverse reachability for ProducerDocument.producer_id)"
    roles: [HubAdmin, ComplianceOfficer, Producer]
    code: 200
    input: ["doc_type?", "status?", "limit?", "offset?"]
    output: ProducerDocument[]
    side_effects: []
  - method: POST
    path: "/producers/{id}/documents"
    description: "Attach a food-safety document to a producer's onboarding file"
    roles: [Producer, HubAdmin]
    code: 201
    input: [doc_type, issued_on, expires_on]
    output: ProducerDocument
    side_effects: ["ProducerDocument created in status SUBMITTED"]
  - method: POST
    path: "/producers/{id}/application"
    description: "Submit or resubmit the membership application (DRAFT->SUBMITTED, CHANGES_REQUESTED->SUBMITTED)"
    roles: [Producer, HubAdmin]
    code: 200
    input: []
    output: Producer
    side_effects: ["onboarding_status advances to SUBMITTED"]
  - method: POST
    path: "/producers/{id}/review"
    description: "Issue a membership decision: APPROVE | REQUEST_CHANGES (ComplianceOfficer) or SUSPEND | REINSTATE | TERMINATE (HubAdmin)"
    roles: [ComplianceOfficer, HubAdmin]
    code: 200
    input: ["decision", "note?"]
    output: Producer
    side_effects:
      - "onboarding_status transitions per state_machines.Producer"
      - "SUSPEND and TERMINATE fire the five-hop delist/reverse/reprice/detach cascade"
      - "REQUEST_CHANGES increments review_cycles"
  - method: POST
    path: "/producer-documents/{id}/adjudication"
    description: "Verify or reject a submitted food-safety document"
    roles: [ComplianceOfficer]
    code: 200
    input: ["decision", "rejection_reason?"]
    output: ProducerDocument
    side_effects:
      - "document status becomes VERIFIED or REJECTED and adjudicated_by_user_id is stamped"
      - "an older VERIFIED/REJECTED/EXPIRED document of the same doc_type becomes SUPERSEDED"
      - "producer_compliance_evaluation refreshes Producer.compliance_ok and food_safety_tier"
      - "a producer in SUBMITTED auto-advances to UNDER_REVIEW"
  - method: POST
    path: "/producers/{id}/equity-contributions"
    description: "Record a member equity capital contribution and re-derive voting_shares"
    roles: [HubAdmin]
    code: 201
    input: ["amount_cents", "memo?"]
    output: Producer
    side_effects: ["paid_in_capital_cents incremented", "voting_shares recomputed by producer_voting_shares"]

  # ---- Catalog & availability ----
  - method: POST
    path: "/products"
    description: "Create a catalog item for an ACTIVE producer, in status DRAFT with no availability"
    roles: [Producer, HubAdmin]
    code: 201
    input: [producer_id, commodity_code, unit_of_measure, storage_class, pack_weight_lb, units_per_pallet, producer_unit_price_cents]
    output: Product
    side_effects: ["Product created in status DRAFT with quantity_offered 0"]
  - method: GET
    path: "/products/{id}"
    description: "Read one catalog item including quantity_available"
    roles: [HubAdmin, ComplianceOfficer, Producer, Buyer]
    code: 200
    input: []
    output: Product
    side_effects: []
  - method: GET
    path: "/products"
    description: "List catalog items with filters (reverse reachability for Product.producer_id)"
    roles: [HubAdmin, Producer, Buyer]
    code: 200
    input: ["producer_id?", "commodity_code?", "storage_class?", "status?", "limit?", "offset?"]
    output: Product[]
    side_effects: []
  - method: POST
    path: "/products/{id}/offers"
    description: "Publish or replace the product's offer window, quantity and (optionally) price; OCC-guarded on the product version"
    roles: [Producer, HubAdmin]
    code: 200
    input: ["quantity_offered", "offer_window_start", "offer_window_end", "producer_unit_price_cents?", "expected_product_version"]
    output: Product
    side_effects:
      - "status becomes LISTED, quantity_available recomputed"
      - "increments Product.version by 1"

  # ---- Buyers & demand ----
  - method: POST
    path: "/buyers"
    description: "Register an institutional buyer with payment terms and a credit limit"
    roles: [HubAdmin]
    code: 201
    input: [legal_name, buyer_type, dock_zone_code, payment_terms_days, credit_limit_cents]
    output: Buyer
    side_effects: ["Buyer created with outstanding_balance_cents 0"]
  - method: GET
    path: "/buyers/{id}"
    description: "Read one buyer including outstanding_balance_cents"
    roles: [HubAdmin, Buyer]
    code: 200
    input: []
    output: Buyer
    side_effects: []
  - method: POST
    path: "/buyer-orders"
    description: "Open a purchase order in fulfillment_status DRAFT / settlement_status UNBILLED"
    roles: [Buyer, HubAdmin]
    code: 201
    input: [buyer_id, requested_delivery_date]
    output: BuyerOrder
    side_effects: ["BuyerOrder created with both status dimensions at their initial states"]
  - method: GET
    path: "/buyer-orders/{id}"
    description: "Read one order including both status dimensions and all money rollups"
    roles: [HubAdmin, Buyer]
    code: 200
    input: []
    output: BuyerOrder
    side_effects: []
  - method: GET
    path: "/buyer-orders"
    description: "List orders with filters (reverse reachability for BuyerOrder.buyer_id and BuyerOrder.route_id)"
    roles: [HubAdmin, Buyer]
    code: 200
    input: ["buyer_id?", "route_id?", "fulfillment_status?", "settlement_status?", "limit?", "offset?"]
    output: BuyerOrder[]
    side_effects: []
  - method: POST
    path: "/buyer-orders/{id}/lines"
    description: "Add a demand line to a DRAFT order"
    roles: [Buyer, HubAdmin]
    code: 201
    input: [commodity_code, storage_class, unit_of_measure, quantity_requested, max_unit_price_cents]
    output: OrderLine
    side_effects: ["OrderLine created in status PENDING"]
  - method: GET
    path: "/buyer-orders/{id}/lines"
    description: "List an order's demand lines (reverse reachability for OrderLine.order_id)"
    roles: [HubAdmin, Buyer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: OrderLine[]
    side_effects: []
  - method: POST
    path: "/buyer-orders/{id}/aggregation"
    description: "Run the cross-producer allocation waterfall and provisional pricing for the order"
    roles: [HubAdmin]
    code: 200
    input: []
    output: BuyerOrder
    side_effects:
      - "Allocations created in status RESERVED; each source Product.quantity_committed incremented and Product.version incremented by 1"
      - "line_allocation_waterfall, hub_margin_tier_selection and order_pricing_rollup (provisional_at_aggregation) run in that order"
      - "fulfillment_status DRAFT -> AGGREGATED"
  - method: POST
    path: "/buyer-orders/{id}/invoice"
    description: "Freeze the final valuation from delivered quantities and bill the buyer"
    roles: [HubAdmin]
    code: 200
    input: []
    output: BuyerOrder
    side_effects:
      - "order_pricing_rollup re-runs under final_at_invoice; margin_tier_bp may change"
      - "invoiced_total_cents and invoice_due_date set; Buyer.outstanding_balance_cents incremented"
      - "settlement_status UNBILLED -> INVOICED"
  - method: POST
    path: "/buyer-orders/{id}/payments"
    description: "Apply a cash instalment against an invoiced order"
    roles: [Buyer, HubAdmin]
    code: 200
    input: [amount_cents]
    output: BuyerOrder
    side_effects:
      - "paid_total_cents incremented and Buyer.outstanding_balance_cents decremented"
      - "settlement_status advances to PARTIALLY_PAID or PAID; reaching PAID credits producer patronage and closes the fulfillment dimension"
  - method: POST
    path: "/buyer-orders/{id}/delivery-record"
    description: "Record per-allocation delivered quantities at the buyer's dock"
    roles: [HubAdmin]
    code: 200
    input: [line_receipts]
    output: BuyerOrder
    side_effects:
      - "each referenced Allocation becomes DELIVERED or SHORT_CLOSED"
      - "OrderLine.quantity_delivered recomputed; fulfillment_status IN_TRANSIT -> DELIVERED"
      - "the route auto-advances DISPATCHED -> COMPLETED once every assigned order is DELIVERED"

  # ---- Allocations ----
  - method: GET
    path: "/allocations/{id}"
    description: "Read one allocation including its money split and cold-chain flags"
    roles: [HubAdmin, Producer, Buyer]
    code: 200
    input: []
    output: Allocation
    side_effects: []
  - method: GET
    path: "/allocations"
    description: "List allocations with filters (reverse reachability for Allocation.order_line_id and Allocation.product_id)"
    roles: [HubAdmin, Producer, Buyer]
    code: 200
    input: ["order_line_id?", "product_id?", "status?", "limit?", "offset?"]
    output: Allocation[]
    side_effects: []
  - method: GET
    path: "/allocations/{id}/rejection-claims"
    description: "List rejection claims filed against an allocation (reverse reachability for RejectionClaim.allocation_id)"
    roles: [HubAdmin, ComplianceOfficer, Producer, Buyer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: RejectionClaim[]
    side_effects: []

  # ---- Cross-dock & cold storage ----
  - method: POST
    path: "/dock-slots"
    description: "Open a cross-dock door window with a pallet capacity, temperature setpoint and sanitation buffer"
    roles: [HubAdmin]
    code: 201
    input: ["door_code", "storage_class", "window_start", "window_end", "pallet_capacity", "temp_setpoint_c", "sanitation_buffer_minutes?"]
    output: DockSlot
    side_effects: ["DockSlot created in status OPEN with pallets_booked 0"]
  - method: GET
    path: "/dock-slots/{id}"
    description: "Read one dock slot including pallets_booked and derived status"
    roles: [HubAdmin, Producer]
    code: 200
    input: []
    output: DockSlot
    side_effects: []
  - method: POST
    path: "/dock-appointments"
    description: "Book a producer drop-off interval on a dock slot; OCC-guarded on the slot version"
    roles: [Producer, HubAdmin]
    code: 201
    input: [dock_slot_id, producer_id, arrival_start, arrival_end, pallets, risk_class, expected_dock_slot_version]
    output: DockAppointment
    side_effects:
      - "DockAppointment created in status BOOKED"
      - "DockSlot.pallets_booked recomputed and DockSlot.status refreshed"
      - "increments DockSlot.version by 1"
  - method: GET
    path: "/dock-appointments/{id}"
    description: "Read one dock appointment"
    roles: [HubAdmin, Producer]
    code: 200
    input: []
    output: DockAppointment
    side_effects: []
  - method: GET
    path: "/dock-appointments"
    description: "List dock appointments with filters (reverse reachability for DockAppointment.dock_slot_id and DockAppointment.producer_id)"
    roles: [HubAdmin, Producer]
    code: 200
    input: ["dock_slot_id?", "producer_id?", "status?", "limit?", "offset?"]
    output: DockAppointment[]
    side_effects: []
  - method: POST
    path: "/dock-appointments/{id}/receipt"
    description: "Close out an appointment: RECEIVED stages the producer's allocations, NO_SHOW reverses them, CANCELLED only frees pallets"
    roles: [HubAdmin]
    code: 200
    input: ["outcome", "received_pallets?", "recorded_temp_c?"]
    output: DockAppointment
    side_effects:
      - "RECEIVED: recorded_temp_c stored; the producer's RESERVED allocations on SCHEDULED orders become STAGED with staged_temp_c and temp_excursion set; the route may auto-advance PLANNED -> LOADED"
      - "NO_SHOW: four-hop reverse/reprice/detach cascade"
      - "DockSlot.pallets_booked recomputed"

  # ---- Delivery routing ----
  - method: POST
    path: "/delivery-routes"
    description: "Create a refrigerated delivery route for a service date"
    roles: [HubAdmin]
    code: 201
    input: [route_date, vehicle_code, storage_class, pallet_capacity, depot_departure_at]
    output: DeliveryRoute
    side_effects: ["DeliveryRoute created in status PLANNED with stop_count 0"]
  - method: GET
    path: "/delivery-routes/{id}"
    description: "Read one route including stop_count, pallets_loaded and status"
    roles: [HubAdmin, Buyer]
    code: 200
    input: []
    output: DeliveryRoute
    side_effects: []
  - method: POST
    path: "/delivery-routes/{id}/stops"
    description: "Assign an aggregated order to this route at an exclusive service window; OCC-guarded on the route version"
    roles: [HubAdmin]
    code: 201
    input: [order_id, sequence_no, planned_arrival_at, service_minutes, expected_route_version]
    output: BuyerOrder
    side_effects:
      - "order route_id, route_sequence_no, planned_arrival_at and service_minutes set; fulfillment_status AGGREGATED -> SCHEDULED"
      - "DeliveryRoute.stop_count and pallets_loaded recomputed; increments DeliveryRoute.version by 1"
  - method: POST
    path: "/delivery-routes/{id}/dispatch"
    description: "Dispatch a fully staged route"
    roles: [HubAdmin]
    code: 200
    input: []
    output: DeliveryRoute
    side_effects:
      - "route LOADED -> DISPATCHED"
      - "every assigned order moves SCHEDULED -> IN_TRANSIT"

  # ---- Shrink / rejection ----
  - method: POST
    path: "/rejection-claims"
    description: "File a rejection claim against a DELIVERED allocation of an order that is fulfillment_status DELIVERED and settlement_status INVOICED or PARTIALLY_PAID"
    roles: [Buyer, HubAdmin]
    code: 201
    input: ["allocation_id", "quantity_rejected", "reason_code", "note?"]
    output: RejectionClaim
    side_effects: ["RejectionClaim created in status FILED with filed_by_user_id stamped"]
  - method: POST
    path: "/rejection-claims/{id}/adjudication"
    description: "Approve, deny or withdraw a rejection claim and apportion the shrink between producer and hub"
    roles: [ComplianceOfficer, Buyer]
    code: 200
    input: ["decision", "note?"]
    output: RejectionClaim
    side_effects:
      - "APPROVE runs rejection_shrink_allocation and moves money: buyer credit memo, producer shrink charge, hub absorption"
      - "Buyer.outstanding_balance_cents decremented by buyer_credit_cents"
      - "Producer.shrink_charge_cents incremented by producer_charge_cents"

  # ---- Member equity & governance ----
  - method: POST
    path: "/patronage-cycles"
    description: "Propose a fiscal-year patronage distribution"
    roles: [HubAdmin]
    code: 201
    input: [fiscal_year, distributable_pool_cents]
    output: PatronageCycle
    side_effects: ["PatronageCycle created in status PROPOSED with proposed_by_user_id stamped"]
  - method: GET
    path: "/patronage-cycles/{id}"
    description: "Read one patronage cycle including the frozen basis snapshot and distribution totals"
    roles: [HubAdmin, BoardDirector, Producer]
    code: 200
    input: []
    output: PatronageCycle
    side_effects: []
  - method: POST
    path: "/patronage-cycles/{id}/ratification"
    description: "Board vote on a proposed cycle: RATIFY freezes the net patronage basis, REJECT cancels it"
    roles: [BoardDirector]
    code: 200
    input: [decision]
    output: PatronageCycle
    side_effects:
      - "RATIFY computes patronage_basis_valuation (net_at_ratification) into basis_snapshot_total_cents and eligible_producer_count"
      - "ratified_by_user_id stamped"
  - method: POST
    path: "/patronage-cycles/{id}/distribution"
    description: "Execute the capped largest-remainder patronage waterfall"
    roles: [HubAdmin]
    code: 200
    input: []
    output: PatronageCycle
    side_effects:
      - "each eligible Producer.retained_patronage_cents incremented by its share"
      - "distributed_total_cents and remainder_cents set with distributed_total_cents + remainder_cents == distributable_pool_cents"

  # ---- Test-driving surface ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical UTC clock. The clock's startup default is exactly 2026-08-01T00:00:00Z; before any call to this endpoint every deadline, expiry and window comparison uses that fixed instant and never real wall-clock time. Setting the clock runs the expiry sweep: VERIFIED documents whose expires_on <= the new instant become EXPIRED, producer compliance is re-evaluated, compliance-triggered suspensions cascade, dock slots past their window_end become CLOSED, and invoiced orders past invoice_due_date + WRITE_OFF_GRACE_DAYS become WRITTEN_OFF."
    roles: [HubAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects:
      - "ProducerDocument VERIFIED -> EXPIRED sweep"
      - "producer_compliance_evaluation for every producer; ACTIVE -> SUSPENDED cascade where compliance flips false"
      - "DockSlot.status refresh"
      - "BuyerOrder settlement INVOICED/PARTIALLY_PAID -> WRITTEN_OFF sweep"

# =====================================================================
# 1.6 Error Code Catalog
# =====================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, empty, or naming a role outside the RBAC matrix"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "The acting role is not listed in the endpoint's roles"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "An entity_backed role acted on a resource whose owning entity id differs from X-User-ID"
  - id: ERR_DECISION_ROLE_MISMATCH
    http: 403
    condition: "The submitted decision value is not one the acting role may issue on this endpoint"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The acting X-User-ID already performed the conflicting prior step (verified the documents being approved, proposed the cycle being ratified, or filed the claim being adjudicated)"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required body field, illegal enum member, out-of-range number, unparseable datetime, or an offer quantity below the already committed quantity"
  - id: ERR_PRODUCER_NOT_FOUND
    http: 404
    condition: "No Producer with the given id"
  - id: ERR_DOCUMENT_NOT_FOUND
    http: 404
    condition: "No ProducerDocument with the given id"
  - id: ERR_PRODUCT_NOT_FOUND
    http: 404
    condition: "No Product with the given id"
  - id: ERR_BUYER_NOT_FOUND
    http: 404
    condition: "No Buyer with the given id"
  - id: ERR_ORDER_NOT_FOUND
    http: 404
    condition: "No BuyerOrder with the given id"
  - id: ERR_ALLOCATION_NOT_FOUND
    http: 404
    condition: "No Allocation with the given id, or the allocation does not belong to the order named in the path"
  - id: ERR_DOCK_SLOT_NOT_FOUND
    http: 404
    condition: "No DockSlot with the given id"
  - id: ERR_APPOINTMENT_NOT_FOUND
    http: 404
    condition: "No DockAppointment with the given id"
  - id: ERR_ROUTE_NOT_FOUND
    http: 404
    condition: "No DeliveryRoute with the given id"
  - id: ERR_CLAIM_NOT_FOUND
    http: 404
    condition: "No RejectionClaim with the given id"
  - id: ERR_CYCLE_NOT_FOUND
    http: 404
    condition: "No PatronageCycle with the given id"
  - id: ERR_STALE_PRODUCT_VERSION
    http: 412
    condition: "expected_product_version does not equal Product.version"
  - id: ERR_STALE_DOCK_SLOT_VERSION
    http: 412
    condition: "expected_dock_slot_version does not equal DockSlot.version"
  - id: ERR_STALE_ROUTE_VERSION
    http: 412
    condition: "expected_route_version does not equal DeliveryRoute.version"
  - id: ERR_INVALID_PRODUCER_STATE
    http: 409
    condition: "The producer's onboarding_status does not permit the requested transition or dependent operation"
  - id: ERR_INVALID_DOCUMENT_STATE
    http: 409
    condition: "The document is not SUBMITTED, or is already expired at the moment of verification"
  - id: ERR_INVALID_ORDER_STATE
    http: 409
    condition: "The order's fulfillment_status or settlement_status does not permit the requested operation, or the order has no lines"
  - id: ERR_ORDER_NOT_INVOICED
    http: 409
    condition: "A payment was applied to an order whose settlement_status is not INVOICED or PARTIALLY_PAID"
  - id: ERR_INVALID_APPOINTMENT_STATE
    http: 409
    condition: "The dock appointment is not in status BOOKED"
  - id: ERR_INVALID_ROUTE_STATE
    http: 409
    condition: "The route is not in status LOADED when dispatch was requested"
  - id: ERR_INVALID_CLAIM_STATE
    http: 409
    condition: "The rejection claim is not in status FILED"
  - id: ERR_INVALID_CYCLE_STATE
    http: 409
    condition: "The patronage cycle is not in the status the requested governance step needs"
  - id: ERR_REVIEW_CYCLE_LIMIT
    http: 409
    condition: "A REQUEST_CHANGES decision was issued after review_cycles already reached MAX_REVIEW_CYCLES"
  - id: ERR_MISSING_REQUIRED_DOCUMENTS
    http: 422
    condition: "An application was submitted without a SUBMITTED or VERIFIED document for every REQUIRED_DOC_TYPES entry"
  - id: ERR_PRODUCER_NOT_COMPLIANT
    http: 422
    condition: "The producer is not ACTIVE with compliance_ok true at the moment supply, catalog or dock work was attempted"
  - id: ERR_STORAGE_CLASS_MISMATCH
    http: 422
    condition: "An order line's storage_class differs from the route's storage_class"
  - id: ERR_INVALID_WINDOW
    http: 422
    condition: "Interval end is not strictly after interval start, service_minutes is below 1, or an appointment falls outside its slot's window"
  - id: ERR_DOCK_CAPACITY_EXCEEDED
    http: 409
    condition: "Overlapping BOOKED/RECEIVED pallets plus the requested pallets exceed DockSlot.pallet_capacity"
  - id: ERR_SANITATION_BUFFER_VIOLATION
    http: 409
    condition: "An appointment of a different risk_class sits closer than sanitation_buffer_minutes on the same slot"
  - id: ERR_STOP_WINDOW_OVERLAP
    http: 409
    condition: "The requested service interval overlaps an existing stop on the same route"
  - id: ERR_ROUTE_CAPACITY_EXCEEDED
    http: 409
    condition: "pallets_loaded plus the order's order_pallets exceed DeliveryRoute.pallet_capacity"
  - id: ERR_ALLOCATIONS_NOT_STAGED
    http: 409
    condition: "Dispatch was requested while at least one allocation on the route is still RESERVED"
  - id: ERR_NO_ELIGIBLE_SUPPLY
    http: 422
    condition: "The aggregation run could not allocate a single unit on any line of the order"
  - id: ERR_REJECTION_EXCEEDS_DELIVERED
    http: 422
    condition: "quantity_rejected exceeds the allocation's delivered_quantity minus already rejected_quantity"
  - id: ERR_DUPLICATE_FISCAL_YEAR
    http: 409
    condition: "A PatronageCycle already exists for the requested fiscal_year"
  - id: ERR_NO_PATRONAGE_BASIS
    http: 422
    condition: "Ratification found no eligible producer with a positive net patronage basis"
  - id: ERR_PAYMENT_EXCEEDS_BALANCE
    http: 422
    condition: "amount_cents exceeds invoiced_total_cents minus paid_total_cents minus credit_memo_cents"
  - id: ERR_CREDIT_LIMIT_EXCEEDED
    http: 422
    condition: "The buyer's outstanding balance plus the provisional order total would exceed credit_limit_cents"

# =====================================================================
# 1.7 RBAC Matrix
# =====================================================================
roles:
  - name: HubAdmin
    description: "Food hub operations staff: onboards buyers, runs aggregation, schedules cross-dock and routes, invoices, and executes ratified patronage distributions"
    identity: "opaque"
    exclusive_operations:
      - "POST /producers"
      - "POST /producers/{id}/equity-contributions"
      - "POST /producers/{id}/review with decision SUSPEND, REINSTATE or TERMINATE"
      - "POST /buyers"
      - "POST /buyer-orders/{id}/aggregation"
      - "POST /buyer-orders/{id}/invoice"
      - "POST /buyer-orders/{id}/delivery-record"
      - "POST /dock-slots"
      - "POST /dock-appointments/{id}/receipt"
      - "POST /delivery-routes"
      - "POST /delivery-routes/{id}/stops"
      - "POST /delivery-routes/{id}/dispatch"
      - "POST /patronage-cycles"
      - "POST /patronage-cycles/{id}/distribution"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /producers/{id}/application"
      - "POST /producers/{id}/documents"
      - "POST /products"
      - "POST /products/{id}/offers"
      - "POST /buyer-orders"
      - "POST /buyer-orders/{id}/lines"
      - "POST /buyer-orders/{id}/payments"
      - "POST /dock-appointments"
      - "POST /rejection-claims"
      - "all GET endpoints except GET /allocations/{id}/rejection-claims is also open to ComplianceOfficer"
  - name: ComplianceOfficer
    description: "Food-safety and claims adjudicator; verifies documents, approves or requests changes on membership applications, and apportions shrink between producer and hub"
    identity: "opaque"
    exclusive_operations:
      - "POST /producer-documents/{id}/adjudication"
      - "POST /producers/{id}/review with decision APPROVE or REQUEST_CHANGES"
      - "POST /rejection-claims/{id}/adjudication with decision APPROVE or DENY"
    shared_operations:
      - "GET /producers/{id}"
      - "GET /producers/{id}/documents"
      - "GET /products/{id}"
      - "GET /allocations/{id}/rejection-claims"
  - name: Producer
    description: "Member farm acting on its own membership file, catalog, offers and dock appointments"
    identity: "entity_backed:Producer"
    exclusive_operations: []
    shared_operations:
      - "POST /producers/{id}/application (own producer id only)"
      - "POST /producers/{id}/documents (own producer id only)"
      - "POST /products (own producer_id only)"
      - "POST /products/{id}/offers (own product only)"
      - "POST /dock-appointments (own producer_id only)"
      - "GET /producers/{id}, GET /producers/{id}/documents, GET /products, GET /products/{id}, GET /allocations, GET /allocations/{id}, GET /allocations/{id}/rejection-claims, GET /dock-slots/{id}, GET /dock-appointments, GET /dock-appointments/{id}, GET /patronage-cycles/{id}"
  - name: Buyer
    description: "Institutional buyer acting on its own orders, payments and rejection claims"
    identity: "entity_backed:Buyer"
    exclusive_operations:
      - "POST /rejection-claims/{id}/adjudication with decision WITHDRAW"
    shared_operations:
      - "POST /buyer-orders (own buyer_id only)"
      - "POST /buyer-orders/{id}/lines (own order only)"
      - "POST /buyer-orders/{id}/payments (own order only)"
      - "POST /rejection-claims (own order's allocation only)"
      - "GET /buyers/{id}, GET /buyer-orders, GET /buyer-orders/{id}, GET /buyer-orders/{id}/lines, GET /products, GET /products/{id}, GET /allocations, GET /allocations/{id}, GET /allocations/{id}/rejection-claims, GET /delivery-routes/{id}"
  - name: BoardDirector
    description: "Elected cooperative board member; the only role that may ratify or reject a proposed patronage distribution, and never the one that proposed it"
    identity: "opaque"
    exclusive_operations:
      - "POST /patronage-cycles/{id}/ratification"
    shared_operations:
      - "GET /producers/{id}"
      - "GET /patronage-cycles/{id}"
