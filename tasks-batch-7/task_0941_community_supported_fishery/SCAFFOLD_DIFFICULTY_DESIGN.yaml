  - rule_id: resource_temporal_overlap
    instances:
      - name: cooler_slot_capacity_partition_rejects_the_extra_box
        grounds:
          - calculations.hub_slot_accounting
          - validations[priority=47]
          - errors[ERR_HUB_CAPACITY_EXCEEDED]
          - entities.PickupWindow.fields.cooler_slots_total
        distinguishing_aspect: |
          The resource is a PickupWindow and the interval semantics are a discrete aggregate
          capacity partition: the window is one occupancy interval with cooler_slots_total = 1
          and adjacency is irrelevant; the second box collides purely because the aggregate
          count would exceed capacity, and the rejection happens before any slot is consumed.
        test_recipe:
          setup:
            - "an OPEN season with a MEDIUM x PREMIUM_FINFISH x WEEKLY plan and a hub whose windows hold one cooler slot"
            - "two fully paid ACTIVE HUB_PICKUP members joining at week 1"
            - "a 10.00 lb SALMON lot allocated 5.00 lb to each week-1 box, split to the hub, both boxes packed"
            - "one week-1 window with cooler_slots_total 1 and the first box already staged into it"
