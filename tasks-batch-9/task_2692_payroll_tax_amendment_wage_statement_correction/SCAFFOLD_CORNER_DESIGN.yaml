# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 breadth probe for
# task_2692 Payroll Tax Amendment & Wage Statement Correction.
#
# Taxonomy: the nine section: values are exactly the nine sections of
# references/claim-extraction-guide.md; every claim_type: comes from that
# section's own table. Corners already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml
# carry an excluded_because: stub naming the covering §1.8 instance and have no
# test_recipe. Every instance name is unique across both files.

scaffold_corner_design:

  - section: entities
    instances:

      - name: employer_creation_returns_every_declared_field
        claim_type: Creation
        grounds:
          - entities.Employer
          - endpoints.POST_/employers
        distinguishing_aspect: "POST /employers with all four input fields returns 201 and every declared field, with the three derived counters seeded to 0 and version 1."
        test_recipe:
          setup:
            - "Empty database; the logical clock is left at its default 2026-08-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - call: "POST /employers"
              payload: { legal_name: "Acme Manufacturing", fein: "12-3456789", deposit_schedule: "SEMIWEEKLY", authorization_limit_cents: 5000000 }
              as: PlatformAdmin
              captures: { emp_id: "$.data.id" }
          assert:
            - "HTTP status is 201"
            - "Employer.${emp_id}.legal_name == Acme Manufacturing"
            - "Employer.${emp_id}.fein == 12-3456789"
            - "Employer.${emp_id}.deposit_schedule == SEMIWEEKLY"
            - "Employer.${emp_id}.authorization_limit_cents == 5000000"
            - "Employer.${emp_id}.open_exposure_cents == 0"
            - "Employer.${emp_id}.open_remediation_count == 0"
            - "Employer.${emp_id}.granted_abatement_count == 0"
            - "Employer.${emp_id}.version == 1"
            - "id, created_at and updated_at are all present and non-null"

      - name: tax_agency_retrieval_returns_the_stored_row
        claim_type: Retrieval
        grounds:
          - entities.TaxAgency
          - endpoints.GET_/tax-agencies/{tax_agency_id}
        distinguishing_aspect: "GET /tax-agencies/{id} echoes every stored configuration field of the agency created one call earlier, including the requires_registration default."
        test_recipe:
          setup:
            - "One STATE agency NY-WH created with requires_registration omitted."
          setup_api_calls:
            - call: "POST /tax-agencies"
              payload: { agency_code: "NY-WH", level: "STATE", jurisdiction_code: "NY", interest_rate_bps_annual: 1200, interest_method: "DEPOSIT_WEIGHTED", penalty_multiplier_bps: 7500, min_days_between_amendments: 30, amendment_window_days: 1095 }
              as: PlatformAdmin
              captures: { ny_id: "$.data.id" }
          trigger:
            - call: "GET /tax-agencies/${ny_id}"
              payload: {}
              as: TaxPreparer
          assert:
            - "HTTP status is 200"
            - "TaxAgency.${ny_id}.agency_code == NY-WH and level == STATE and jurisdiction_code == NY"
            - "TaxAgency.${ny_id}.interest_rate_bps_annual == 1200 and interest_method == DEPOSIT_WEIGHTED"
            - "TaxAgency.${ny_id}.penalty_multiplier_bps == 7500 and min_days_between_amendments == 30 and amendment_window_days == 1095"
            - "TaxAgency.${ny_id}.requires_registration == false (declared default applied)"

      - name: correction_case_listing_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/correction-cases
          - response_envelope.pagination_fields
        distinguishing_aspect: "Three cases for one employer, listed with limit 2: the first page returns 2 rows with total_count 3 and has_more true, the second page returns 1 row with has_more false."
        test_recipe:
          setup:
            - "One employer and one federal agency."
            - "Three correction cases for tax year 2025, quarters 1, 2 and 3."
          setup_api_calls:
            - call: "POST /employers"
              payload: { legal_name: "Acme Manufacturing", fein: "12-3456789", deposit_schedule: "MONTHLY", authorization_limit_cents: 5000000 }
              as: PlatformAdmin
              captures: { emp_id: "$.data.id" }
            - call: "POST /tax-agencies"
              payload: { agency_code: "FED-941", level: "FEDERAL", jurisdiction_code: "US", interest_rate_bps_annual: 800, interest_method: "STATUTORY_DAILY", penalty_multiplier_bps: 10000, min_days_between_amendments: 30, amendment_window_days: 1095, requires_registration: false }
              as: PlatformAdmin
              captures: { fed_id: "$.data.id" }
            - call: "POST /correction-cases"
              payload: { employer_id: "${emp_id}", agency_id: "${fed_id}", tax_year: 2025, quarter: 1 }
              as: PayrollAnalyst
            - call: "POST /correction-cases"
              payload: { employer_id: "${emp_id}", agency_id: "${fed_id}", tax_year: 2025, quarter: 2 }
              as: PayrollAnalyst
            - call: "POST /correction-cases"
              payload: { employer_id: "${emp_id}", agency_id: "${fed_id}", tax_year: 2025, quarter: 3 }
              as: PayrollAnalyst
          trigger:
            - call: "GET /correction-cases"
              payload: { employer_id: "${emp_id}", limit: 2, offset: 0 }
              as: PayrollAnalyst
            - call: "GET /correction-cases"
              payload: { employer_id: "${emp_id}", limit: 2, offset: 2 }
              as: PayrollAnalyst
          assert:
            - "the first page returns HTTP 200 with response_type == array"
            - "the first page carries limit == 2, offset == 0, total_count == 3 and has_more == true"
            - "the first page data array length == 2"
            - "the second page carries limit == 2, offset == 2, total_count == 3 and has_more == false"
            - "the second page data array length == 1"

      - name: get_correction_case_with_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - validations.priority_10.ERR_CORRECTION_CASE_NOT_FOUND
          - endpoints.GET_/correction-cases/{correction_case_id}
        distinguishing_aspect: "A well-formed but absent case id returns 404 ERR_CORRECTION_CASE_NOT_FOUND rather than 200 with an empty body or 500."
        test_recipe:
          setup:
            - "Empty database — no correction case has ever been created."
          setup_api_calls: []
          trigger:
            - call: "GET /correction-cases/00000000-0000-0000-0000-000000009999"
              payload: {}
              as: PayrollAnalyst
          assert:
            - "HTTP status is 404"
            - "response data.error_id == ERR_CORRECTION_CASE_NOT_FOUND"
            - "response_type == error and data.message is a non-empty string"

      - name: create_employee_missing_required_full_name_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - validations.priority_20.ERR_INVALID_REQUEST
          - endpoints.POST_/employees
        distinguishing_aspect: "Omitting full_name — an input field with no declared default — returns 400 ERR_INVALID_REQUEST and persists nothing."
        test_recipe:
          setup:
            - "One employer exists."
          setup_api_calls:
            - call: "POST /employers"
              payload: { legal_name: "Acme Manufacturing", fein: "12-3456789", deposit_schedule: "MONTHLY", authorization_limit_cents: 5000000 }
              as: PlatformAdmin
              captures: { emp_id: "$.data.id" }
          trigger:
            - call: "POST /employees"
              payload: { employer_id: "${emp_id}", national_id_last4: "4821", mailing_state_code: "NY" }
              as: PayrollAnalyst
          assert:
            - "HTTP status is 400"
            - "response data.error_id == ERR_INVALID_REQUEST"
            - "GET /employees?employer_id=${emp_id} returns total_count == 0"

      - name: agency_account_defaults_applied_when_optional_fields_omitted
        claim_type: Defaults
        grounds:
          - entities.AgencyAccount.fields.account_number
          - entities.AgencyAccount.fields.retroactive
          - entities.AgencyAccount.fields.registration_status
          - entities.AgencyAccount.fields.to_period_ordinal
        distinguishing_aspect: "Creating a registration with account_number, effective_to_* and retroactive all omitted yields account_number null, retroactive false, registration_status PENDING and the open-ended sentinel to_period_ordinal 999999."
        test_recipe:
          setup:
            - "One employer and one STATE agency that requires registration."
          setup_api_calls:
            - call: "POST /employers"
              payload: { legal_name: "Acme Manufacturing", fein: "12-3456789", deposit_schedule: "MONTHLY", authorization_limit_cents: 5000000 }
              as: PlatformAdmin
              captures: { emp_id: "$.data.id" }
            - call: "POST /tax-agencies"
              payload: { agency_code: "NY-WH", level: "STATE", jurisdiction_code: "NY", interest_rate_bps_annual: 1200, interest_method: "DEPOSIT_WEIGHTED", penalty_multiplier_bps: 7500, min_days_between_amendments: 30, amendment_window_days: 1095, requires_registration: true }
              as: PlatformAdmin
              captures: { ny_id: "$.data.id" }
          trigger:
            - call: "POST /agency-accounts"
              payload: { employer_id: "${emp_id}", agency_id: "${ny_id}", effective_from_tax_year: 2025, effective_from_quarter: 1 }
              as: PlatformAdmin
              captures: { acct_id: "$.data.id" }
          assert:
            - "HTTP status is 201"
            - "AgencyAccount.${acct_id}.account_number == null"
            - "AgencyAccount.${acct_id}.effective_to_tax_year == null and effective_to_quarter == null"
            - "AgencyAccount.${acct_id}.retroactive == false"
            - "AgencyAccount.${acct_id}.registration_status == PENDING"
            - "AgencyAccount.${acct_id}.activated_at == null"
            - "AgencyAccount.${acct_id}.to_period_ordinal == 999999"

      - name: agency_account_period_ordinals_computed_from_year_and_quarter
        claim_type: Computed Fields
        grounds:
          - entities.AgencyAccount.fields.from_period_ordinal
          - entities.AgencyAccount.fields.to_period_ordinal
        distinguishing_aspect: "from_period_ordinal and to_period_ordinal are derived as tax_year * 4 + (quarter - 1): 2025 Q3 becomes 8102 and 2026 Q2 becomes 8105, values the client never supplies."
        test_recipe:
          setup:
            - "One employer and one STATE agency."
          setup_api_calls:
            - call: "POST /employers"
              payload: { legal_name: "Acme Manufacturing", fein: "12-3456789", deposit_schedule: "MONTHLY", authorization_limit_cents: 5000000 }
              as: PlatformAdmin
              captures: { emp_id: "$.data.id" }
            - call: "POST /tax-agencies"
              payload: { agency_code: "NY-WH", level: "STATE", jurisdiction_code: "NY", interest_rate_bps_annual: 1200, interest_method: "DEPOSIT_WEIGHTED", penalty_multiplier_bps: 7500, min_days_between_amendments: 30, amendment_window_days: 1095, requires_registration: true }
              as: PlatformAdmin
              captures: { ny_id: "$.data.id" }
          trigger:
            - call: "POST /agency-accounts"
              payload: { employer_id: "${emp_id}", agency_id: "${ny_id}", account_number: "NY-7788", effective_from_tax_year: 2025, effective_from_quarter: 3, effective_to_tax_year: 2026, effective_to_quarter: 2 }
              as: PlatformAdmin
              captures: { acct_id: "$.data.id" }
          assert:
            - "AgencyAccount.${acct_id}.from_period_ordinal == 8102"
            - "AgencyAccount.${acct_id}.to_period_ordinal == 8105"
            - "AgencyAccount.${acct_id}.registration_status == PENDING"

      - name: employer_system_fields_are_server_minted_and_client_input_ignored
        claim_type: System Fields
        grounds:
          - entities.Employer.fields.open_exposure_cents
          - entities.Employer.fields.open_remediation_count
        distinguishing_aspect: "Supplying id, version and open_exposure_cents in the create body changes nothing: the server mints its own id, sets version 1 and seeds open_exposure_cents to 0."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /employers"
              payload: { legal_name: "Beacon Foods", fein: "98-7654321", deposit_schedule: "MONTHLY", authorization_limit_cents: 5000000, id: "client-supplied-id", version: 99, open_exposure_cents: 123456 }
              as: PlatformAdmin
              captures: { emp_id: "$.data.id" }
          assert:
            - "Employer.${emp_id}.id != client-supplied-id"
            - "Employer.${emp_id}.version == 1"
            - "Employer.${emp_id}.open_exposure_cents == 0"
            - "Employer.${emp_id}.open_remediation_count == 0"
            - "GET /employers/client-supplied-id returns 404 ERR_EMPLOYER_NOT_FOUND"

      - name: register_line_with_quarter_five_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.PayrollRegisterLine.fields.quarter
          - validations.priority_20.ERR_INVALID_REQUEST
        distinguishing_aspect: "quarter is constrained to 1..4, so quarter 5 is refused with 400 ERR_INVALID_REQUEST and no register line is written."
        test_recipe:
          setup:
            - "One employer, one federal agency and one employee."
          setup_api_calls:
            - call: "POST /employers"
              payload: { legal_name: "Acme Manufacturing", fein: "12-3456789", deposit_schedule: "MONTHLY", authorization_limit_cents: 5000000 }
              as: PlatformAdmin
              captures: { emp_id: "$.data.id" }
            - call: "POST /tax-agencies"
              payload: { agency_code: "FED-941", level: "FEDERAL", jurisdiction_code: "US", interest_rate_bps_annual: 800, interest_method: "STATUTORY_DAILY", penalty_multiplier_bps: 10000, min_days_between_amendments: 30, amendment_window_days: 1095, requires_registration: false }
              as: PlatformAdmin
              captures: { fed_id: "$.data.id" }
            - call: "POST /employees"
              payload: { employer_id: "${emp_id}", full_name: "Dana Reed", national_id_last4: "4821", mailing_state_code: "NY" }
              as: PayrollAnalyst
              captures: { e1_id: "$.data.id" }
          trigger:
            - call: "POST /payroll-register-lines"
              payload: { employer_id: "${emp_id}", employee_id: "${e1_id}", agency_id: "${fed_id}", tax_year: 2025, quarter: 5, taxable_wage_cents: 1000000, withheld_cents: 150000, work_jurisdiction_code: "US" }
              as: PayrollAnalyst
          assert:
            - "HTTP status is 400"
            - "response data.error_id == ERR_INVALID_REQUEST"
            - "GET /payroll-register-lines?employer_id=${emp_id} returns total_count == 0"

      - name: payroll_register_line_is_immutable_and_carries_no_version
        claim_type: Immutability
        grounds:
          - entities.PayrollRegisterLine
          - entities.DepositRecord
        distinguishing_aspect: "PayrollRegisterLine and DepositRecord declare common_fields: false, so their rows expose no version field and §1.5 declares no update endpoint for either — source records are append-only evidence."
        test_recipe:
          setup:
            - "One employer, one federal agency, one employee, one posted register line and one CLEARED deposit."
          setup_api_calls:
            - call: "POST /employers"
              payload: { legal_name: "Acme Manufacturing", fein: "12-3456789", deposit_schedule: "MONTHLY", authorization_limit_cents: 5000000 }
              as: PlatformAdmin
              captures: { emp_id: "$.data.id" }
            - call: "POST /tax-agencies"
              payload: { agency_code: "FED-941", level: "FEDERAL", jurisdiction_code: "US", interest_rate_bps_annual: 800, interest_method: "STATUTORY_DAILY", penalty_multiplier_bps: 10000, min_days_between_amendments: 30, amendment_window_days: 1095, requires_registration: false }
              as: PlatformAdmin
              captures: { fed_id: "$.data.id" }
            - call: "POST /employees"
              payload: { employer_id: "${emp_id}", full_name: "Dana Reed", national_id_last4: "4821", mailing_state_code: "NY" }
              as: PayrollAnalyst
              captures: { e1_id: "$.data.id" }
            - call: "POST /payroll-register-lines"
              payload: { employer_id: "${emp_id}", employee_id: "${e1_id}", agency_id: "${fed_id}", tax_year: 2025, quarter: 1, taxable_wage_cents: 1000000, withheld_cents: 150000, work_jurisdiction_code: "US" }
              as: PayrollAnalyst
              captures: { line_id: "$.data.id" }
            - call: "POST /deposit-records"
              payload: { employer_id: "${emp_id}", agency_id: "${fed_id}", tax_year: 2025, quarter: 1, deposit_due_date: "2025-02-19", deposit_date: "2025-02-19", amount_cents: 150000, obligation_amount_cents: 150000 }
              as: PayrollAnalyst
              captures: { dep_id: "$.data.id" }
          trigger:
            - call: "GET /payroll-register-lines/${line_id}"
              payload: {}
              as: PayrollAnalyst
            - call: "GET /deposit-records/${dep_id}"
              payload: {}
              as: PayrollAnalyst
          assert:
            - "the register-line response contains no version key"
            - "the deposit-record response contains no version key"
            - "PayrollRegisterLine.${line_id}.posting_status == POSTED (declared default)"
            - "DepositRecord.${dep_id}.clearing_status == CLEARED (declared default)"
            - "no PATCH, PUT or DELETE endpoint is declared for /payroll-register-lines/{register_line_id} or /deposit-records/{deposit_record_id}"

      - name: register_line_with_unknown_employer_fk_returns_not_found
        claim_type: Parent Relationships
        grounds:
          - validations.priority_11.ERR_EMPLOYER_NOT_FOUND
          - complexity_profile.entity_topology
        distinguishing_aspect: "The topology is flat, so foreign keys are validated by reference rather than by URL nesting: a register line naming an absent employer_id returns 404 ERR_EMPLOYER_NOT_FOUND even though every other field is valid."
        test_recipe:
          setup:
            - "One federal agency and one employee under a real employer."
          setup_api_calls:
            - call: "POST /employers"
              payload: { legal_name: "Acme Manufacturing", fein: "12-3456789", deposit_schedule: "MONTHLY", authorization_limit_cents: 5000000 }
              as: PlatformAdmin
              captures: { emp_id: "$.data.id" }
            - call: "POST /tax-agencies"
              payload: { agency_code: "FED-941", level: "FEDERAL", jurisdiction_code: "US", interest_rate_bps_annual: 800, interest_method: "STATUTORY_DAILY", penalty_multiplier_bps: 10000, min_days_between_amendments: 30, amendment_window_days: 1095, requires_registration: false }
              as: PlatformAdmin
              captures: { fed_id: "$.data.id" }
            - call: "POST /employees"
              payload: { employer_id: "${emp_id}", full_name: "Dana Reed", national_id_last4: "4821", mailing_state_code: "NY" }
              as: PayrollAnalyst
              captures: { e1_id: "$.data.id" }
          trigger:
            - call: "POST /payroll-register-lines"
              payload: { employer_id: "00000000-0000-0000-0000-000000009999", employee_id: "${e1_id}", agency_id: "${fed_id}", tax_year: 2025, quarter: 1, taxable_wage_cents: 1000000, withheld_cents: 150000, work_jurisdiction_code: "US" }
              as: PayrollAnalyst
          assert:
            - "HTTP status is 404"
            - "response data.error_id == ERR_EMPLOYER_NOT_FOUND"
            - "GET /payroll-register-lines?employee_id=${e1_id} returns total_count == 0"

  - section: state_machines
    instances:

      - name: amended_return_initial_state_is_draft
        claim_type: Initial State
        grounds:
          - state_machines.AmendedReturn.initial_state
          - endpoints.POST_/amended-returns
        distinguishing_aspect: "A freshly created AmendedReturn sits in DRAFT with every computed money field at 0 and prepared_by_user_id null; none of the rollup calculations has run yet."
        test_recipe:
          setup:
            - "Logical clock at 2026-04-30T00:00:00Z."
            - "Employer Acme, federal agency FED-941 (requires_registration false), two employees."
            - "2025 Q1 register totals 5000000 wage / 750000 withheld in jurisdiction US; the filed 941 reports 4750000 / 500000 with original_due_date 2025-04-30; one cleared deposit of 500000 against a 750000 obligation."
            - "Reconciliation has emitted three discrepancies; none has been categorised yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-30T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /employers"
              payload: { legal_name: "Acme Manufacturing", fein: "12-3456789", deposit_schedule: "SEMIWEEKLY", authorization_limit_cents: 5000000 }
              as: PlatformAdmin
              captures: { emp_id: "$.data.id" }
            - call: "POST /tax-agencies"
              payload: { agency_code: "FED-941", level: "FEDERAL", jurisdiction_code: "US", interest_rate_bps_annual: 800, interest_method: "STATUTORY_DAILY", penalty_multiplier_bps: 10000, min_days_between_amendments: 30, amendment_window_days: 1095, requires_registration: false }
              as: PlatformAdmin
              captures: { fed_id: "$.data.id" }
            - call: "POST /employees"
              payload: { employer_id: "${emp_id}", full_name: "Dana Reed", national_id_last4: "4821", mailing_state_code: "NY" }
              as: PayrollAnalyst
              captures: { e1_id: "$.data.id" }
            - call: "POST /payroll-register-lines"
              payload: { employer_id: "${emp_id}", employee_id: "${e1_id}", agency_id: "${fed_id}", tax_year: 2025, quarter: 1, taxable_wage_cents: 5000000, withheld_cents: 750000, work_jurisdiction_code: "US" }
              as: PayrollAnalyst
            - call: "POST /filed-returns"
              payload: { employer_id: "${emp_id}", agency_id: "${fed_id}", tax_year: 2025, quarter: 1, form_code: "941X", filed_at: "2025-04-30T00:00:00Z", reported_taxable_wage_cents: 4750000, reported_withheld_cents: 500000 }
              as: TaxPreparer
            - call: "POST /deposit-records"
              payload: { employer_id: "${emp_id}", agency_id: "${fed_id}", tax_year: 2025, quarter: 1, deposit_due_date: "2025-02-19", deposit_date: "2025-02-19", amount_cents: 500000, obligation_amount_cents: 750000, clearing_status: "CLEARED" }
              as: PayrollAnalyst
            - call: "POST /correction-cases"
              payload: { employer_id: "${emp_id}", agency_id: "${fed_id}", tax_year: 2025, quarter: 1 }
              as: PayrollAnalyst
              captures: { case_id: "$.data.id" }
            - call: "POST /correction-cases/${case_id}/reconcile"
              payload: {}
              as: PayrollAnalyst
            - call: "GET /correction-cases/${case_id}"
              payload: {}
              as: TaxPreparer
              captures: { case_ver: "$.data.version" }
          trigger:
            - call: "POST /amended-returns"
              payload: { correction_case_id: "${case_id}", form_code: "941X", accrual_through_date: "2026-04-30", expected_correction_case_version: "${case_ver}" }
              as: TaxPreparer
              captures: { ar_id: "$.data.id" }
          assert:
            - "HTTP status is 201"
            - "AmendedReturn.${ar_id}.status == DRAFT"
            - "AmendedReturn.${ar_id}.wage_delta_cents == 0 and tax_delta_cents == 0 and deposit_shortfall_cents == 0"
            - "AmendedReturn.${ar_id}.interest_cents == 0 and penalty_cents == 0 and days_late == 0"
            - "AmendedReturn.${ar_id}.prepared_by_user_id == null and signed_by_user_id == null"
            - "AmendedReturn.${ar_id}.version == 1"

      - name: agency_account_activate_moves_pending_to_active
        claim_type: Valid Transition
        grounds:
          - state_machines.AgencyAccount.PENDING_to_ACTIVE
          - endpoints.POST_/agency-accounts/{agency_account_id}/activate
        distinguishing_aspect: "Activating a non-retroactive PENDING registration lands in ACTIVE (not RETRO_ACTIVE), which is the branch distinction the AgencyAccount machine turns on."
        test_recipe:
          setup:
            - "One employer and one STATE agency requiring registration."
            - "A PENDING registration created with retroactive omitted and no account_number."
          setup_api_calls:
            - call: "POST /employers"
              payload: { legal_name: "Acme Manufacturing", fein: "12-3456789", deposit_schedule: "MONTHLY", authorization_limit_cents: 5000000 }
              as: PlatformAdmin
              captures: { emp_id: "$.data.id" }
            - call: "POST /tax-agencies"
              payload: { agency_code: "NY-45", level: "STATE", jurisdiction_code: "NY", interest_rate_bps_annual: 1200, interest_method: "DEPOSIT_WEIGHTED", penalty_multiplier_bps: 5000, min_days_between_amendments: 45, amendment_window_days: 1095, requires_registration: true }
              as: PlatformAdmin
              captures: { ny_id: "$.data.id" }
            - call: "POST /agency-accounts"
              payload: { employer_id: "${emp_id}", agency_id: "${ny_id}", effective_from_tax_year: 2025, effective_from_quarter: 1 }
              as: PlatformAdmin
              captures: { acct_id: "$.data.id" }
          trigger:
            - call: "POST /agency-accounts/${acct_id}/activate"
              payload: { account_number: "NY-99123" }
              as: PlatformAdmin
          assert:
            - "HTTP status is 200"
            - "AgencyAccount.${acct_id}.registration_status == ACTIVE"
            - "AgencyAccount.${acct_id}.registration_status != RETRO_ACTIVE"
            - "AgencyAccount.${acct_id}.retroactive == false"

      - name: activate_side_effects_record_account_number_and_activation_instant
