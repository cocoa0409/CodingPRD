  - rule_id: resource_temporal_overlap
    instances:
      - name: statement_month_half_open_interval_adjacency_and_lookback_window
        grounds:
          - validations.priority_26
          - validations.priority_27
          - entities.StatementMonth.fields.period_start_date
          - entities.StatementMonth.fields.period_end_date
          - endpoints.POST_income_worksheets_id_statement_months
        distinguishing_aspect: |
          Resource entity: IncomeWorksheet, whose StatementMonth children compete for calendar
          intervals. Interval semantics: HALF-OPEN [period_start_date, period_end_date), so
          two months touching at a shared boundary instant are adjacent and legal while a single
          shared interior day is an overlap. Excluded months keep occupying their interval, and
          the same endpoint independently enforces a lookback window anchored on the logical
          clock (2 * statement_period_months = 24 whole months back, and no period may end after
          the clock date).
        test_recipe:
          setup:
            - "The logical clock is left at its declared default of 2026-08-01T00:00:00Z, so the lookback window opens at 2024-08-01T00:00:00Z."
            - "A BANK_STATEMENT_12MO program (statement_period_months 12) and a self-employed borrower."
            - "A bank-statement loan file in UNDERWRITING with a DRAFT bank-statement worksheet."
          setup_api_calls:
            - call: "POST /documentation-programs"
              payload: { program_code: "BANK_STATEMENT_12MO", name: "12-Month Bank Statement", statement_period_months: 12, default_expense_factor_pct: 50.00, min_expense_factor_pct: 25.00, max_ltv_pct: 80.00, min_fico: 660, min_reserves_months: 6, max_dti_pct: 50.00, min_residual_income_cents: 250000, second_valuation_ltv_threshold_pct: 85.00, second_valuation_loan_amount_threshold_cents: 150000000, atr_exempt_flag: false, seasoning_matrix: { FORECLOSURE: 36, SHORT_SALE: 24, DEED_IN_LIEU: 24, BK_CH7: 24, BK_CH13: 12, MODIFICATION: 12, MORTGAGE_LATE_60: 12 } }
