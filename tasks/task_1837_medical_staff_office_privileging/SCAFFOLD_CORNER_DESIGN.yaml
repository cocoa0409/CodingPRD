        distinguishing_aspect: "Any endpoint call without X-User-ID/X-User-Role headers returns ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400) before role or existence checks."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /mso/members"
              payload: {}
              as: MedicalStaffCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "Request sent without headers yields error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400)"
            - "(harness note: the trigger call shown with `as:` is the positive control; the negative variant omits both headers)"

