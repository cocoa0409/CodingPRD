  # -------------------------------------------------------------------
  # Rule 3 - non_linear_state_machine
  # -------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: commissioning_dimension_cycles_through_failed_while_install_status_stays_scheduled
        grounds:
          - state_machines.InstallJob.commissioning_status.PENDING_to_PAIRED
          - state_machines.InstallJob.commissioning_status.PAIRED_to_FAILED
          - state_machines.InstallJob.commissioning_status.FAILED_to_PAIRED
          - state_machines.InstallJob.commissioning_status.PAIRED_to_VERIFIED
          - state_machines.InstallJob.SCHEDULED_to_COMPLETED
          - entities.InstallJob.fields.commissioning_attempt_count
          - validations.priority_33_ERR_COMMISSIONING_NOT_VERIFIED
        distinguishing_aspect: |
          Non-linearity of the PARALLEL kind: an InstallJob carries two independent state
          dimensions, and this instance drives the commissioning dimension through the
          full PENDING -> PAIRED -> FAILED -> PAIRED -> VERIFIED cycle (a partial pairing
          that verifies to FAILED and is then retried) while install_status never leaves
          SCHEDULED, and only the join guard at /complete couples them.
        test_recipe:
          setup:
            - "One ACTIVE territory, one ACTIVE designer holding MOTORIZATION, one vendor supporting MOTORIZED lifts and the MATTER hub with concurrent_capacity 2."
            - "A consultation carrying TWO motorized openings - WD-FAUX / MOTORIZED / HARDWIRED at 60.000 x 84.000 (list 73363) and LT-SHEER / MOTORIZED / BATTERY at 24.000 x 48.000 (list 17460) - so the job freezes motorized_channel_count at 2."
            - "The quote is presented (subtotal 90823, install fee 21500, pre-discount 112323, discount 4541, net 86282) and accepted, both openings go on one vendor order, the order is shipped and received."
            - "One install job is created for that order and the clock is moved into the appointment window; commissioning_status starts PENDING because the channel count is non-zero."
          setup_api_calls:
            - call: "POST /blinds/territories"
              payload: { legal_name: "Northgate Blinds LLC", postal_codes: ["30301"], royalty_rate_pct: 0.055, lead_capacity_per_week: 5, credit_limit_cents: 2000000, liability_window: "ROLLING_180D" }
              as: Franchisor
              as_user_id: "hq-ops"
              captures: { t1: $.data.id }
            - call: "POST /blinds/designers"
              payload: { territory_id: "${t1}", full_name: "Dana Reed", home_postal_code: "30301", certifications: ["MOTORIZATION"] }
              as: Franchisee
              as_user_id: "${t1}"
              captures: { d1: $.data.id }
            - call: "POST /blinds/vendors"
              payload: { name: "Ridgeline Shade Works", base_lead_time_days: 10, motorization_extra_days: 3, cutoff_hour_utc: 15, remake_policy: "SHARED_50_50", concurrent_capacity: 2, supported_lift_systems: ["CORDED", "CORDLESS", "MOTORIZED"], supported_hub_platforms: ["MATTER", "HOMEKIT"] }
              as: Franchisor
              as_user_id: "hq-ops"
              captures: { v1: $.data.id }
            - call: "POST /blinds/leads"
              payload: { customer_name: "Ana Ruiz", postal_code: "30301", source: "WEB_FORM", requested_at: "2026-08-03T00:00:00.000Z", child_occupied_dwelling: false }
              as: Franchisee
              as_user_id: "${t1}"
              captures: { l1: $.data.id }
            - call: "POST /blinds/consultations"
              payload: { lead_id: "${l1}", designer_id: "${d1}", scheduled_start_at: "2026-08-03T14:00:00.000Z", scheduled_end_at: "2026-08-03T15:00:00.000Z", service_postal_code: "30301" }
              as: Designer
              as_user_id: "${d1}"
              captures: { c1: $.data.id }
            - call: "POST /blinds/openings"
              payload: { consultation_id: "${c1}", label: "Great room slider", room_type: "LIVING_ROOM", mount_type: "INSIDE", width_top_in: 60.000, width_middle_in: 60.000, width_bottom_in: 60.000, height_left_in: 84.000, height_center_in: 84.000, height_right_in: 84.000, depth_in: 3.000 }
              as: Designer
              as_user_id: "${d1}"
              captures: { o1: $.data.id }
            - call: "POST /blinds/openings"
              payload: { consultation_id: "${c1}", label: "Landing transom", room_type: "OFFICE", mount_type: "INSIDE", width_top_in: 24.000, width_middle_in: 24.000, width_bottom_in: 24.000, height_left_in: 48.000, height_center_in: 48.000, height_right_in: 48.000, depth_in: 3.000 }
              as: Designer
              as_user_id: "${d1}"
              captures: { o2: $.data.id }
            - call: "PATCH /blinds/openings/${o1}/configuration"
              payload: { fabric_code: "WD-FAUX", lift_system: "MOTORIZED", motorization_option: "HARDWIRED" }
              as: Designer
              as_user_id: "${d1}"
