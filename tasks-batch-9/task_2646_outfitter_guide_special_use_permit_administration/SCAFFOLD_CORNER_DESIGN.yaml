# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml
# task_2646_outfitter_guide_special_use_permit_administration
#
# §1.9 Corner Design — the BREADTH probe. One instance per applicable row of
# references/claim-extraction-guide.md, walked against SCAFFOLD.yaml §1.1-§1.7.
# §1.8 (SCAFFOLD_DIFFICULTY_DESIGN.yaml) is the depth probe; every corner it
# already asserts appears here only as an `excluded_because:` stub.
#
# Reusable literals (identical to §1.8 so the two files share fixtures):
#   BRW-01: total_allocated 1000, reserved_admin 100 -> allocatable 900,
#     season 2027-05-15 .. 2027-09-30, party_size_max 12, max_clients_per_guide 8,
#     min_liability_coverage_cents 100000000.
#   Alpine Outfitters LLC, ein 410000001, prequalification_insurance_verified true.
#   Guide "Rita Long" LEAD / WFR / 7 seasons  -> base_client_capacity 10, frozen 8.
#   Guide "Ben Cruz" ASSISTANT / BASIC_FIRST_AID / 2 seasons -> base 4, frozen 4.
#   200-day permit -> required_financial_assurance clamp(1000000, 250000, 5000000) = 1000000.
#   Absent-row probe id: 00000000-0000-0000-0000-000000000000.
#   Default logical clock before any /_clock/set_current_utc call: 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  # SECTION 1 — ENTITIES (claim-extraction-guide Table 1 + entity_topology flat)
  # ===========================================================================
  - section: entities
    instances:

      - name: use_area_creation_returns_computed_allocation_fields_and_version_one
        claim_type: creation
        grounds:
          - entities.UseArea
          - entities.UseArea.fields.available_service_days
          - entities.UseArea.fields.demand_ratio
          - entities.UseArea.fields.allocation_posture
          - calculations.use_area_service_day_availability
          - endpoints.POST /osup/use-areas
        distinguishing_aspect: |
          Creating a use area with every declared input returns 201 and the four derived allocation
          fields already populated from an EMPTY permit and application set: committed 0, pending 0,
          available 900 (1000 - 100 reserved), demand_ratio 0.0000 and allocation_posture OPEN, with
          common_fields version == 1.
        test_recipe:
          setup:
            - "empty database; logical clock moved to 2027-01-05T00:00:00Z"
          setup_api_calls:
            - call: "POST /osup/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-05T00:00:00Z" }
              as: ProgramAdministrator
          trigger:
            - call: "POST /osup/use-areas"
              payload: { area_code: "BRW-01", name: "Bear River Wilderness", total_allocated_service_days: 1000, season_year: 2027, season_open_date: "2027-05-15", season_close_date: "2027-09-30", party_size_max: 12, max_clients_per_guide: 8, reserved_admin_service_days: 100, min_liability_coverage_cents: 100000000 }
              as: ProgramAdministrator
              captures: { ua_id: "$.data.id" }
          assert:
            - "HTTP 201 and the envelope is { meta: { api_request_id, api_request_timestamp }, response_type: \"object\", data: {...} }"
            - "data.area_code == \"BRW-01\", data.name == \"Bear River Wilderness\", data.total_allocated_service_days == 1000, data.reserved_admin_service_days == 100"
            - "data.season_year == 2027, data.party_size_max == 12, data.max_clients_per_guide == 8, data.min_liability_coverage_cents == 100000000"
            - "data.committed_service_days == 0 and data.pending_service_days == 0"
            - "data.available_service_days == 900 — allocatable is total 1000 minus reserved 100, not total"
            - "data.demand_ratio == 0.0000 and data.allocation_posture == \"OPEN\""
            - "data.id is a UUID, data.created_at and data.updated_at are RFC-3339 UTC, data.version == 1"
            - "GET /osup/use-areas/${ua_id}/allocation-summary returns allocatable_service_days 900 == committed 0 + pending 0 + available 900, satisfying allocatable_service_day_conservation at creation time"

      - name: outfitter_retrieval_returns_the_stored_registration
        claim_type: retrieval
        grounds:
          - entities.Outfitter
          - entities.Outfitter.fields.status
          - entities.Outfitter.fields.prior_permit_count
          - entities.Outfitter.fields.active_permit_count
          - endpoints.GET /osup/outfitters/{id}
        distinguishing_aspect: |
          GET /osup/outfitters/{id} returns exactly the registered row — legal_name, ein and
          contact_email as stored — plus the three server-owned fields at their creation values:
          status APPLICANT, prior_permit_count 0 and active_permit_count 0.
        test_recipe:
          setup:
            - "logical clock at 2027-01-05T00:00:00Z"
            - "Outfitter Alpine registered by the specialist with prequalification_insurance_verified true and no permits"
          setup_api_calls:
            - call: "POST /osup/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-05T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /osup/outfitters"
              payload: { legal_name: "Alpine Outfitters LLC", ein: "410000001", contact_email: "ops@alpine.example", prequalification_insurance_verified: true }
              as: PermitSpecialist
              captures: { oa_id: "$.data.id" }
          trigger:
            - call: "GET /osup/outfitters/${oa_id}"
              payload: {}
              as: OutfitterRepresentative
              as_user_id: "${oa_id}"
          assert:
            - "HTTP 200 and data.id == ${oa_id}"
            - "data.legal_name == \"Alpine Outfitters LLC\", data.ein == \"410000001\", data.contact_email == \"ops@alpine.example\""
            - "data.prequalification_insurance_verified == true"
            - "data.status == \"APPLICANT\" — outfitter_status_derivation leaves an outfitter with zero permits in APPLICANT"
            - "data.prior_permit_count == 0 and data.active_permit_count == 0"
            - "data.version == 1 and data.created_at == data.updated_at on a row that has never been written twice"

      - name: use_area_listing_pages_newest_first_with_envelope_counters
        claim_type: listing
        grounds:
          - endpoints.GET /osup/use-areas
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          The list endpoint orders created_at DESC and reports limit, offset, total_count and has_more:
          with three areas created in order BRW-01, BRW-02, BRW-03, limit 2 offset 0 returns BRW-03 then
          BRW-02 with total_count 3 and has_more true, and limit 2 offset 2 returns only BRW-01 with
          has_more false.
        test_recipe:
          setup:
            - "logical clock at 2027-01-05T00:00:00Z"
            - "three use areas created in this order: BRW-01 (season 2027), BRW-02 (season 2027), BRW-03 (season 2028)"
          setup_api_calls:
            - call: "POST /osup/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-05T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /osup/use-areas"
              payload: { area_code: "BRW-01", name: "Bear River Wilderness", total_allocated_service_days: 1000, season_year: 2027, season_open_date: "2027-05-15", season_close_date: "2027-09-30", party_size_max: 12, max_clients_per_guide: 8, reserved_admin_service_days: 100, min_liability_coverage_cents: 100000000 }
              as: ProgramAdministrator
              captures: { ua1_id: "$.data.id" }
            - call: "POST /osup/use-areas"
              payload: { area_code: "BRW-02", name: "Cedar Basin", total_allocated_service_days: 200, season_year: 2027, season_open_date: "2027-06-01", season_close_date: "2027-09-15", party_size_max: 10, max_clients_per_guide: 6 }
              as: ProgramAdministrator
              captures: { ua2_id: "$.data.id" }
            - call: "POST /osup/use-areas"
              payload: { area_code: "BRW-03", name: "Granite Fork", total_allocated_service_days: 500, season_year: 2028, season_open_date: "2028-06-01", season_close_date: "2028-09-15", party_size_max: 8, max_clients_per_guide: 4 }
              as: ProgramAdministrator
              captures: { ua3_id: "$.data.id" }
          trigger:
            - call: "GET /osup/use-areas"
              payload: { limit: 2, offset: 0 }
              as: PermitSpecialist
              captures: { first_page_head: "$.data[0].id" }
            - call: "GET /osup/use-areas"
              payload: { limit: 2, offset: 2 }
              as: PermitSpecialist
              captures: { second_page_head: "$.data[0].id" }
            - call: "GET /osup/use-areas"
              payload: { season_year: 2028 }
              as: PermitSpecialist
            - call: "GET /osup/use-areas"
              payload: {}
              as: PermitSpecialist
          assert:
            - "page 1: response_type == \"array\", meta.total_count == 3, meta.limit == 2, meta.offset == 0, meta.has_more == true"
            - "page 1 holds exactly 2 rows and ${first_page_head} == ${ua3_id} — created_at DESC puts BRW-03 first, BRW-02 second"
            - "page 2: exactly 1 row, ${second_page_head} == ${ua1_id}, total_count == 3, has_more == false"
            - "the season_year 2028 filter returns exactly 1 row (${ua3_id}) with total_count == 1"
            - "the unparameterised list applies pagination_defaults limit 10 / offset 0 and returns all 3 rows with has_more == false"

      - name: every_collection_lookup_with_an_unknown_uuid_returns_not_found
        claim_type: not_found
        grounds:
          - validations[ERR_USE_AREA_NOT_FOUND]
          - validations[ERR_OUTFITTER_NOT_FOUND]
          - validations[ERR_NEEDS_ASSESSMENT_NOT_FOUND]
          - validations[ERR_PROSPECTUS_NOT_FOUND]
          - validations[ERR_APPLICATION_NOT_FOUND]
          - validations[ERR_PERMIT_NOT_FOUND]
          - validations[ERR_OPERATING_PLAN_NOT_FOUND]
          - validations[ERR_GUIDE_NOT_FOUND]
          - validations[ERR_AUTHORIZATION_NOT_FOUND]
          - validations[ERR_USE_REPORT_NOT_FOUND]
          - validations[ERR_FEE_ASSESSMENT_NOT_FOUND]
          - validations[ERR_NONCOMPLIANCE_ACTION_NOT_FOUND]
        distinguishing_aspect: |
          Each of the twelve priority-3 existence rules owns a distinct 404 error_id, and the rule that
          fires is selected by WHICH collection the unresolvable id addresses — not by a generic
          not-found. The same probe id 00000000-0000-0000-0000-000000000000 therefore produces twelve
          different error_ids across twelve endpoints, and on POST /osup/permit-applications the body
          ids are checked in the §1.5 `input:` order, so a bogus outfitter_id beats a bogus use_area_id.
        test_recipe:
          setup:
            - "logical clock at 2027-01-05T00:00:00Z"
            - "one real Outfitter Alpine exists so the body-id ordering probe can hold outfitter_id valid while use_area_id is unknown"
          setup_api_calls:
            - call: "POST /osup/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-05T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /osup/outfitters"
              payload: { legal_name: "Alpine Outfitters LLC", ein: "410000001", contact_email: "ops@alpine.example", prequalification_insurance_verified: true }
              as: PermitSpecialist
              captures: { oa_id: "$.data.id" }
          trigger:
            - call: "GET /osup/use-areas/00000000-0000-0000-0000-000000000000/allocation-summary"
              payload: {}
              as: PermitSpecialist
            - call: "GET /osup/outfitters/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PermitSpecialist
            - call: "POST /osup/needs-assessments/00000000-0000-0000-0000-000000000000/publish"
              payload: {}
              as: AuthorizedOfficer
            - call: "GET /osup/prospectuses/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PermitSpecialist
            - call: "GET /osup/permit-applications/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PermitSpecialist
            - call: "GET /osup/permits/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PermitSpecialist
            - call: "POST /osup/operating-plans/00000000-0000-0000-0000-000000000000/submit"
              payload: {}
              as: OutfitterRepresentative
              as_user_id: "${oa_id}"
            - call: "GET /osup/guides/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PermitSpecialist
            - call: "POST /osup/guide-authorizations/00000000-0000-0000-0000-000000000000/revoke"
              payload: { revocation_reason_code: "HOLDER_REQUEST" }
              as: OutfitterRepresentative
              as_user_id: "${oa_id}"
            - call: "GET /osup/trip-use-reports/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PermitSpecialist
            - call: "POST /osup/fee-assessments/00000000-0000-0000-0000-000000000000/finalize"
              payload: {}
              as: PermitSpecialist
            - call: "POST /osup/noncompliance-actions/00000000-0000-0000-0000-000000000000/appeal"
              payload: { appeal_basis: "The cited provision does not apply to this operation." }
              as: OutfitterRepresentative
              as_user_id: "${oa_id}"
            - call: "POST /osup/permit-applications"
              payload: { outfitter_id: "${oa_id}", use_area_id: "00000000-0000-0000-0000-000000000000", application_type: "NEW", season_year: 2027, requested_service_days: 200, proposed_activity_type: "RIVER_FLOAT" }
              as: PermitSpecialist
            - call: "POST /osup/permit-applications"
              payload: { outfitter_id: "00000000-0000-0000-0000-000000000000", use_area_id: "00000000-0000-0000-0000-000000000000", application_type: "NEW", season_year: 2027, requested_service_days: 200, proposed_activity_type: "RIVER_FLOAT" }
              as: PermitSpecialist
          assert:
            - "every call returns HTTP 404 with response_type \"error\" and no row is created by any of them"
            - "call 1 -> ERR_USE_AREA_NOT_FOUND; call 2 -> ERR_OUTFITTER_NOT_FOUND; call 3 -> ERR_NEEDS_ASSESSMENT_NOT_FOUND; call 4 -> ERR_PROSPECTUS_NOT_FOUND"
            - "call 5 -> ERR_APPLICATION_NOT_FOUND; call 6 -> ERR_PERMIT_NOT_FOUND; call 7 -> ERR_OPERATING_PLAN_NOT_FOUND; call 8 -> ERR_GUIDE_NOT_FOUND"
            - "call 9 -> ERR_AUTHORIZATION_NOT_FOUND; call 10 -> ERR_USE_REPORT_NOT_FOUND; call 11 -> ERR_FEE_ASSESSMENT_NOT_FOUND; call 12 -> ERR_NONCOMPLIANCE_ACTION_NOT_FOUND"
            - "call 13, with a real outfitter_id and an unknown use_area_id, returns ERR_USE_AREA_NOT_FOUND"
            - "call 14, with BOTH body ids unknown, returns ERR_OUTFITTER_NOT_FOUND — body ids are validated in the §1.5 input order outfitter_id, use_area_id, so the earlier field wins the tie"
            - "the 404s are returned even though calls 3, 7, 9, 11 and 12 also carry action payloads whose state preconditions could never be met: priority 3 runs before priorities 5, 7 and 11"

      - name: creation_with_a_missing_required_input_field_is_rejected
        claim_type: required_fields
        grounds:
          - endpoints.POST /osup/use-areas
          - endpoints.POST /osup/permit-applications
          - endpoints.POST /osup/outfitters/{id}/guides
          - validations[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          Only the fields marked with a trailing `?` in §1.5 `input:` are optional. Dropping a
          non-optional field — total_allocated_service_days on a use area, requested_service_days on an
          application, first_aid_expires_on on a guide — is ERR_INVALID_REQUEST (400) even though every
          other field is present and well-formed, and nothing is persisted.
        test_recipe:
          setup:
            - "logical clock at 2027-01-05T00:00:00Z"
            - "one use area BRW-01 and one outfitter Alpine exist so the application and guide probes have valid FK targets"
          setup_api_calls:
            - call: "POST /osup/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-05T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /osup/use-areas"
              payload: { area_code: "BRW-01", name: "Bear River Wilderness", total_allocated_service_days: 1000, season_year: 2027, season_open_date: "2027-05-15", season_close_date: "2027-09-30", party_size_max: 12, max_clients_per_guide: 8, reserved_admin_service_days: 100, min_liability_coverage_cents: 100000000 }
              as: ProgramAdministrator
              captures: { ua_id: "$.data.id" }
            - call: "POST /osup/outfitters"
              payload: { legal_name: "Alpine Outfitters LLC", ein: "410000001", contact_email: "ops@alpine.example", prequalification_insurance_verified: true }
              as: PermitSpecialist
              captures: { oa_id: "$.data.id" }
          trigger:
            - call: "POST /osup/use-areas"
              payload: { area_code: "BRW-09", name: "No Ceiling Area", season_year: 2027, season_open_date: "2027-05-15", season_close_date: "2027-09-30", party_size_max: 12, max_clients_per_guide: 8 }
              as: ProgramAdministrator
            - call: "POST /osup/use-areas"
              payload: { area_code: "BRW-10", name: "No Window Area", total_allocated_service_days: 500, season_year: 2027, season_close_date: "2027-09-30", party_size_max: 12, max_clients_per_guide: 8 }
              as: ProgramAdministrator
            - call: "POST /osup/permit-applications"
              payload: { outfitter_id: "${oa_id}", use_area_id: "${ua_id}", application_type: "NEW", season_year: 2027, proposed_activity_type: "RIVER_FLOAT" }
              as: PermitSpecialist
            - call: "POST /osup/outfitters/${oa_id}/guides"
              payload: { full_name: "Rita Long", qualification_level: "LEAD", first_aid_cert_type: "WFR" }
              as: OutfitterRepresentative
              as_user_id: "${oa_id}"
            - call: "GET /osup/use-areas"
              payload: {}
              as: ProgramAdministrator
          assert:
            - "each of the four creation attempts returns HTTP 400 with error_id ERR_INVALID_REQUEST"
            - "call 1 is rejected for the absent total_allocated_service_days even though reserved_admin_service_days and min_liability_coverage_cents were legitimately omitted as optional"
            - "call 2 is rejected for the absent season_open_date; call 3 for requested_service_days; call 4 for first_aid_expires_on"
            - "the closing list confirms total_count == 1: neither BRW-09 nor BRW-10 was persisted, so a 400 leaves no partial row"
            - "GET /osup/outfitters/${oa_id}/guides returns total_count 0"

      - name: omitted_optional_inputs_fall_back_to_declared_defaults
        claim_type: defaults
        grounds:
          - entities.UseArea.fields.reserved_admin_service_days
          - entities.UseArea.fields.min_liability_coverage_cents
          - entities.Outfitter.fields.prequalification_insurance_verified
          - entities.Guide.fields.seasons_experience
          - entities.Prospectus.fields.min_qualifying_score
          - calculations.guide_client_capacity
        distinguishing_aspect: |
          Every `default:` in §1.1 is applied when its field is omitted, and the default participates in
          the derived arithmetic rather than sitting inert: reserved_admin_service_days 0 makes
          available_service_days the FULL 1000, seasons_experience 0 removes the experience bonus so a
          LEAD/WFR guide computes base_client_capacity 8 instead of 10, and min_qualifying_score lands
          at exactly 60.0 rather than null.
        test_recipe:
          setup:
            - "empty database; logical clock at 2027-01-05T00:00:00Z"
          setup_api_calls:
            - call: "POST /osup/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-05T00:00:00Z" }
              as: ProgramAdministrator
          trigger:
            - call: "POST /osup/use-areas"
              payload: { area_code: "BRW-01", name: "Bear River Wilderness", total_allocated_service_days: 1000, season_year: 2027, season_open_date: "2027-05-15", season_close_date: "2027-09-30", party_size_max: 12, max_clients_per_guide: 8 }
              as: ProgramAdministrator
              captures: { ua_id: "$.data.id" }
            - call: "POST /osup/outfitters"
              payload: { legal_name: "Alpine Outfitters LLC", ein: "410000001", contact_email: "ops@alpine.example" }
              as: PermitSpecialist
              captures: { oa_id: "$.data.id" }
            - call: "POST /osup/outfitters/${oa_id}/guides"
              payload: { full_name: "Rita Long", qualification_level: "LEAD", first_aid_cert_type: "WFR", first_aid_expires_on: "2030-06-30" }
              as: OutfitterRepresentative
              as_user_id: "${oa_id}"
              captures: { g_id: "$.data.id" }
            - call: "POST /osup/use-areas/${ua_id}/needs-assessments"
              payload: { assessment_year: 2027, public_need_finding: "NEED_EXISTS", determined_capacity_service_days: 900, allocated_service_days: 0 }
              as: PermitSpecialist
              captures: { na_id: "$.data.id" }
            - call: "POST /osup/needs-assessments/${na_id}/publish"
              payload: {}
              as: AuthorizedOfficer
            - call: "POST /osup/prospectuses"
              payload: { use_area_id: "${ua_id}", needs_assessment_id: "${na_id}", offered_service_days: 300, submission_deadline_date: "2027-03-01" }
              as: PermitSpecialist
              captures: { pr_id: "$.data.id" }
          assert:
            - "the use area lands with reserved_admin_service_days == 0 and min_liability_coverage_cents == 100000000"
            - "with reserved 0 the allocatable total is the full 1000: committed 0, pending 0, available_service_days == 1000, demand_ratio == 0.0000, allocation_posture == \"OPEN\""
            - "the outfitter lands with prequalification_insurance_verified == false, NOT null"
            - "the guide lands with seasons_experience == 0 and status PENDING_QUALIFICATION"
            - "guide base_client_capacity == 8 — LEVEL_RATIO[LEAD] 8 and CERT_CAP[WFR] 8 give min 8, and the experience bonus min(2, floor(0/3)) is 0, so the default suppresses the +2 a 7-season guide would earn"
            - "the prospectus lands with min_qualifying_score == 60.0 and status OPEN, responsive_application_count == 0"

      - name: client_supplied_values_for_computed_fields_are_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.UseArea.fields.committed_service_days
          - entities.UseArea.fields.available_service_days
          - entities.UseArea.fields.demand_ratio
          - entities.UseArea.fields.allocation_posture
          - entities.Guide.fields.base_client_capacity
          - entities.PermitApplication.fields.routing_decision
        distinguishing_aspect: |
          Fields whose §1.1 `source:` is `computed` are never taken from the request body. Posting a use
          area that claims committed 500 / available 12 / demand_ratio 0.9 / posture EXHAUSTED, a guide
          that claims base_client_capacity 99, and an application that claims routing_decision DIRECT
          all yield the SERVER's computed values, and the poisoned posture in particular does not block
          the later application the caller was trying to pre-authorize.
        test_recipe:
          setup:
            - "logical clock at 2027-01-05T00:00:00Z"
          setup_api_calls:
            - call: "POST /osup/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-05T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /osup/outfitters"
              payload: { legal_name: "Alpine Outfitters LLC", ein: "410000001", contact_email: "ops@alpine.example", prequalification_insurance_verified: true }
              as: PermitSpecialist
              captures: { oa_id: "$.data.id" }
          trigger:
            - call: "POST /osup/use-areas"
              payload: { area_code: "BRW-01", name: "Bear River Wilderness", total_allocated_service_days: 1000, season_year: 2027, season_open_date: "2027-05-15", season_close_date: "2027-09-30", party_size_max: 12, max_clients_per_guide: 8, reserved_admin_service_days: 100, min_liability_coverage_cents: 100000000, committed_service_days: 500, pending_service_days: 400, available_service_days: 12, demand_ratio: 0.9, allocation_posture: "EXHAUSTED" }
              as: ProgramAdministrator
              captures: { ua_id: "$.data.id" }
            - call: "POST /osup/outfitters/${oa_id}/guides"
              payload: { full_name: "Rita Long", qualification_level: "LEAD", first_aid_cert_type: "WFR", first_aid_expires_on: "2030-06-30", seasons_experience: 7, base_client_capacity: 99 }
              as: OutfitterRepresentative
              as_user_id: "${oa_id}"
              captures: { g_id: "$.data.id" }
            - call: "POST /osup/permit-applications"
              payload: { outfitter_id: "${oa_id}", use_area_id: "${ua_id}", application_type: "NEW", season_year: 2027, requested_service_days: 200, proposed_activity_type: "RIVER_FLOAT", narrative: "Guided day floats.", routing_decision: "DIRECT", hold_expires_at: "2027-02-04", preliminary_evaluation_score: 99.9 }
              as: PermitSpecialist
              captures: { app_id: "$.data.id" }
            - call: "GET /osup/use-areas/${ua_id}/allocation-summary"
              payload: {}
              as: PermitSpecialist
          assert:
            - "the use area response reports committed_service_days == 0, pending_service_days == 0, available_service_days == 900, demand_ratio == 0.0000 and allocation_posture == \"OPEN\" — all five submitted values are discarded"
            - "the allocation-summary recomputation agrees: allocatable 900 == committed 0 + pending 0 + available 900"
            - "the guide response reports base_client_capacity == 10 — LEVEL_RATIO[LEAD] 8, CERT_CAP[WFR] 8, plus the min(2, floor(7/3)) == 2 experience bonus — not the submitted 99"
            - "the application response reports routing_decision == null, hold_expires_at == null and preliminary_evaluation_score == null, because nothing has been screened or scored yet"
            - "all three rows are created (201) — a computed field in the body is silently ignored, never a 400"

      - name: client_supplied_values_for_system_fields_are_input_ignored
        claim_type: system_fields
        grounds:
          - common_fields.id
          - common_fields.created_at
          - common_fields.version
          - entities.Outfitter.fields.status
          - entities.PermitApplication.fields.status
          - entities.PermitApplication.fields.screened_at
        distinguishing_aspect: |
          The four common fields and every §1.1 `source: system` field are server-owned. A body that
          supplies id, created_at, updated_at, version 47, Outfitter.status PERMITTED and
          PermitApplication.status AWARDED with a screened_at stamp gets a fresh UUID, fresh timestamps,
          version 1, status APPLICANT and status DRAFT with screened_at null — so the caller cannot
          skip the screening fork by declaring the outcome.
        test_recipe:
          setup:
            - "logical clock at 2027-01-05T00:00:00Z, one use area BRW-01 on file"
          setup_api_calls:
            - call: "POST /osup/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-05T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /osup/use-areas"
              payload: { area_code: "BRW-01", name: "Bear River Wilderness", total_allocated_service_days: 1000, season_year: 2027, season_open_date: "2027-05-15", season_close_date: "2027-09-30", party_size_max: 12, max_clients_per_guide: 8, reserved_admin_service_days: 100, min_liability_coverage_cents: 100000000 }
              as: ProgramAdministrator
              captures: { ua_id: "$.data.id" }
          trigger:
            - call: "POST /osup/outfitters"
              payload: { legal_name: "Alpine Outfitters LLC", ein: "410000001", contact_email: "ops@alpine.example", prequalification_insurance_verified: true, id: "11111111-1111-1111-1111-111111111111", created_at: "2001-01-01T00:00:00Z", updated_at: "2001-01-01T00:00:00Z", version: 47, status: "PERMITTED", prior_permit_count: 9 }
              as: PermitSpecialist
              captures: { oa_id: "$.data.id" }
            - call: "POST /osup/permit-applications"
              payload: { outfitter_id: "${oa_id}", use_area_id: "${ua_id}", application_type: "NEW", season_year: 2027, requested_service_days: 200, proposed_activity_type: "RIVER_FLOAT", narrative: "Guided day floats.", status: "AWARDED", screened_at: "2027-01-04T00:00:00Z", version: 12 }
              as: PermitSpecialist
              captures: { app_id: "$.data.id" }
            - call: "POST /osup/permit-applications/${app_id}/screen"
              payload: {}
              as: PermitSpecialist
          assert:
            - "the outfitter response has data.id != \"11111111-1111-1111-1111-111111111111\", created_at at the 2027-01-05T00:00:00Z logical clock rather than 2001, version == 1, status == \"APPLICANT\" and prior_permit_count == 0"
            - "the application response has status == \"DRAFT\", screened_at == null and version == 1"
            - "the screen attempt on that DRAFT application returns HTTP 409 ERR_INVALID_APPLICATION_STATE, proving the declared status AWARDED never took effect — the screen transition is declared only from SUBMITTED"
            - "the use area's pending_service_days is still 0 after the rejected screen"

      - name: enum_range_uniqueness_and_inverted_date_inputs_are_rejected
        claim_type: type_constraints
        grounds:
          - entities.UseArea.fields.total_allocated_service_days
          - entities.UseArea.fields.reserved_admin_service_days
          - entities.Outfitter.fields.ein
          - entities.PermitApplication.fields.proposed_activity_type
          - entities.PermitApplication.fields.requested_service_days
          - validations[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          One 400 covers five structurally different shape faults, and each is checked even when every
          other field is impeccable: an out-of-range integer (total 0, requested 0), a violated
          cross-field range (reserved == total leaves zero allocatable), a bad string format
          (7-digit ein), a non-member enum, an inverted date pair, and a uniqueness collision on
          area_code or ein.
        test_recipe:
          setup:
            - "logical clock at 2027-01-05T00:00:00Z; BRW-01 and Alpine (ein 410000001) already on file so the collision probes have something to collide with"
          setup_api_calls:
            - call: "POST /osup/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-05T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /osup/use-areas"
              payload: { area_code: "BRW-01", name: "Bear River Wilderness", total_allocated_service_days: 1000, season_year: 2027, season_open_date: "2027-05-15", season_close_date: "2027-09-30", party_size_max: 12, max_clients_per_guide: 8, reserved_admin_service_days: 100, min_liability_coverage_cents: 100000000 }
              as: ProgramAdministrator
              captures: { ua_id: "$.data.id" }
            - call: "POST /osup/outfitters"
              payload: { legal_name: "Alpine Outfitters LLC", ein: "410000001", contact_email: "ops@alpine.example", prequalification_insurance_verified: true }
              as: PermitSpecialist
              captures: { oa_id: "$.data.id" }
          trigger:
            - call: "POST /osup/use-areas"
              payload: { area_code: "BRW-11", name: "Zero Allocation", total_allocated_service_days: 0, season_year: 2027, season_open_date: "2027-05-15", season_close_date: "2027-09-30", party_size_max: 12, max_clients_per_guide: 8 }
              as: ProgramAdministrator
            - call: "POST /osup/use-areas"
              payload: { area_code: "BRW-12", name: "All Reserved", total_allocated_service_days: 500, season_year: 2027, season_open_date: "2027-05-15", season_close_date: "2027-09-30", party_size_max: 12, max_clients_per_guide: 8, reserved_admin_service_days: 500 }
              as: ProgramAdministrator
            - call: "POST /osup/use-areas"
              payload: { area_code: "BRW-13", name: "Inverted Season", total_allocated_service_days: 500, season_year: 2027, season_open_date: "2027-09-30", season_close_date: "2027-05-15", party_size_max: 12, max_clients_per_guide: 8 }
              as: ProgramAdministrator
            - call: "POST /osup/use-areas"
              payload: { area_code: "BRW-01", name: "Duplicate Code", total_allocated_service_days: 500, season_year: 2028, season_open_date: "2028-05-15", season_close_date: "2028-09-30", party_size_max: 12, max_clients_per_guide: 8 }
              as: ProgramAdministrator
            - call: "POST /osup/outfitters"
              payload: { legal_name: "Short EIN LLC", ein: "4100001", contact_email: "short@alpine.example" }
              as: PermitSpecialist
            - call: "POST /osup/outfitters"
              payload: { legal_name: "Twin EIN LLC", ein: "410000001", contact_email: "twin@alpine.example" }
              as: PermitSpecialist
            - call: "POST /osup/permit-applications"
              payload: { outfitter_id: "${oa_id}", use_area_id: "${ua_id}", application_type: "NEW", season_year: 2027, requested_service_days: 200, proposed_activity_type: "HELI_SKIING" }
              as: PermitSpecialist
            - call: "POST /osup/permit-applications"
              payload: { outfitter_id: "${oa_id}", use_area_id: "${ua_id}", application_type: "NEW", season_year: 2027, requested_service_days: 0, proposed_activity_type: "RIVER_FLOAT" }
              as: PermitSpecialist
          assert:
            - "all eight calls return HTTP 400 ERR_INVALID_REQUEST"
            - "call 1: total_allocated_service_days must be >= 1; call 2: reserved_admin_service_days must be strictly less than total, so 500/500 is refused even though each value is individually in range"
            - "call 3: season_close_date before season_open_date is an inverted date pair; call 4: area_code BRW-01 collides"
            - "call 5: ein \"4100001\" is 7 digits, not exactly 9; call 6: ein 410000001 collides with Alpine"
            - "call 7: HELI_SKIING is not a member of {HUNTING, FISHING, PACK_STOCK, RIVER_FLOAT, MOUNTAINEERING}; call 8: requested_service_days must be >= 1"
            - "GET /osup/use-areas reports total_count 1 and the second outfitter never appears — no partial rows"

      - name: performance_evaluation_row_is_immutable_and_carries_no_version
        claim_type: immutability
        grounds:
          - entities.PerformanceEvaluation
          - entities.PerformanceEvaluation.common_fields
          - endpoints.POST /osup/permits/{id}/performance-evaluations
          - endpoints.GET /osup/permits/{id}/performance-evaluations
          - calculations.performance_weighted_rating
        distinguishing_aspect: |
          PerformanceEvaluation is the one entity declared `common_fields: false`: the response carries
          no version field and §1.5 exposes no PUT, PATCH or DELETE for it, so a later year's evaluation
          can only be a NEW row. Recording 2028 therefore leaves the 2027 row byte-identical while the
          MUTABLE parent moves — Permit.latest_performance_rating flips SATISFACTORY -> MARGINAL and
          Permit.version increments on both filings.
        test_recipe:
          setup:
            - "canonical BRW-01 chain through issue-permit: Alpine holds an ISSUED permit for 200 service days, term 2027-01-01..2029-12-31, with zero noncompliance points"
          setup_api_calls:
            - call: "POST /osup/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-05T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /osup/use-areas"
              payload: { area_code: "BRW-01", name: "Bear River Wilderness", total_allocated_service_days: 1000, season_year: 2027, season_open_date: "2027-05-15", season_close_date: "2027-09-30", party_size_max: 12, max_clients_per_guide: 8, reserved_admin_service_days: 100, min_liability_coverage_cents: 100000000 }
