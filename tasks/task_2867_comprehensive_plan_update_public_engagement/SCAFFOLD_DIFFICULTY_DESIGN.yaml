  # ===========================================================================
  # Rule 5 - priority pair validation conflicts, four DIFFERENT category pairs:
  #   auth(20) vs existence(30) / business_constraint(35) vs existence(40) /
  #   state(50) vs business_temporal(67) / business_temporal(62) vs
  #   business_constraint(73)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: role_check_outranks_path_existence_on_inventory_certify
        grounds:
          - validations.priority_20_ERR_ROLE_NOT_PERMITTED
          - validations.priority_30_path_existence
        distinguishing_aspect: |
          Pair auth(20) vs existence(30): a PlanningStaff caller aims POST
          /planning/inventory-datasets/{id}/certify (a PlanningDirector-only endpoint) at an id that
          does not exist, so both rules are violated and the response must be
          ERR_ROLE_NOT_PERMITTED (403), never ERR_INVENTORY_NOT_FOUND - the paired control call
          proves rule 30 does fire for the same URL once the role is correct.
        test_recipe:
          setup:
            - "One plan and one DRAFT LAND_USE inventory exist, so the failure cannot be blamed on an empty database."
          setup_api_calls:
            - call: "POST /planning/plan-updates"
              payload: { title: "Horizon 2045", jurisdiction_code: "CA-0451", base_year: 2025, horizon_year: 2045 }
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { pu: $.data.id }
            - call: "POST /planning/inventory-datasets"
              payload: { plan_update_id: "${pu}", inventory_type: "LAND_USE", vintage_year: 2025, vacant_acres: 400, underutilized_acres: 250, infrastructure_constrained_acres: 60, allowed_density_units_per_acre: 18 }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { inv_land: $.data.id, inv_status: $.data.status }
          trigger:
            - call: "POST /planning/inventory-datasets/00000000-0000-4000-8000-0000000000ff/certify"
              payload: {}
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { err_role: $.data.error_id }
            - call: "POST /planning/inventory-datasets/00000000-0000-4000-8000-0000000000ff/certify"
              payload: {}
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { err_missing: $.data.error_id }
          assert:
            - "the staff attempt returns HTTP 403 with error_id == \"ERR_ROLE_NOT_PERMITTED\" (priority 20 wins over priority 30)"
            - "the director attempt against the same non-existent id returns HTTP 404 with error_id == \"ERR_INVENTORY_NOT_FOUND\" (priority 30 is reachable once auth passes)"
            - "InventoryDataset.${inv_land}.status == DRAFT (neither attempt touched the real row)"

      - name: input_schema_check_outranks_body_foreign_key_existence
        grounds:
          - validations.priority_35_ERR_INVALID_REQUEST
          - validations.priority_40_body_foreign_key_existence
        distinguishing_aspect: |
          Pair business_constraint(35) vs existence(40): a single POST /planning/inventory-datasets
          body carries BOTH a plan_update_id that does not exist AND vacant_acres on a DEMOGRAPHIC
          inventory (acreage fields are legal only for LAND_USE), so the answer must be
          ERR_INVALID_REQUEST (422) rather than ERR_PLAN_UPDATE_NOT_FOUND; the control call drops the
          illegal acreage field and then, and only then, the 404 surfaces.
        test_recipe:
          setup:
            - "One real plan exists but is never referenced by the triggering calls."
          setup_api_calls:
            - call: "POST /planning/plan-updates"
              payload: { title: "Horizon 2045", jurisdiction_code: "CA-0451", base_year: 2025, horizon_year: 2045 }
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { pu: $.data.id }
          trigger:
            - call: "POST /planning/inventory-datasets"
              payload: { plan_update_id: "00000000-0000-4000-8000-00000000beef", inventory_type: "DEMOGRAPHIC", vintage_year: 2025, record_count: 4200, vacant_acres: 400 }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { err_shape: $.data.error_id }
            - call: "POST /planning/inventory-datasets"
              payload: { plan_update_id: "00000000-0000-4000-8000-00000000beef", inventory_type: "DEMOGRAPHIC", vintage_year: 2025, record_count: 4200 }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { err_fk: $.data.error_id }
          assert:
            - "the first attempt returns HTTP 422 with error_id == \"ERR_INVALID_REQUEST\" (priority 35 wins over priority 40)"
            - "the second attempt returns HTTP 404 with error_id == \"ERR_PLAN_UPDATE_NOT_FOUND\""
            - "GET /planning/plan-updates/${pu}/inventory-datasets returns total_count == 0 (no partial row was written by either rejected attempt)"

      - name: activity_state_check_outranks_clock_gate_on_complete
        grounds:
          - validations.priority_50_ERR_ACTIVITY_NOT_SCHEDULED
          - validations.priority_67_ERR_ACTIVITY_NOT_ENDED
        distinguishing_aspect: |
          Pair state(50) vs business_temporal(67): a CANCELLED activity whose end_at is still in the
          logical future violates both the state precondition and the clock gate on
          POST /planning/engagement-activities/{id}/complete; the state rule must win with
          ERR_ACTIVITY_NOT_SCHEDULED, while a sibling activity that is still SCHEDULED but equally
          un-ended yields ERR_ACTIVITY_NOT_ENDED.
        test_recipe:
          setup:
            - "The logical clock is left at its startup default 2026-08-01T00:00:00Z."
            - "Two activities are scheduled in the logical future on two different venues so the venue occupancy rule at priority 62 never fires; one of them is cancelled."
          setup_api_calls:
            - call: "POST /planning/plan-updates"
              payload: { title: "Horizon 2045", jurisdiction_code: "CA-0451", base_year: 2025, horizon_year: 2045 }
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { pu: $.data.id }
            - call: "POST /planning/venues"
              payload: { name: "Eastside Community Room", seated_capacity: 120, turnover_buffer_minutes: 0, ada_accessible: true, transit_served: true }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { v1: $.data.id }
            - call: "POST /planning/venues"
              payload: { name: "Westside Library Annex", seated_capacity: 80, turnover_buffer_minutes: 0, ada_accessible: true, transit_served: true }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { v2: $.data.id }
            - call: "POST /planning/engagement-activities"
              payload: { plan_update_id: "${pu}", venue_id: "${v1}", activity_type: "WORKSHOP", title: "Cancelled Workshop", start_at: "2026-08-20T18:00:00.000Z", end_at: "2026-08-20T20:00:00.000Z" }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { act_dead: $.data.id }
            - call: "POST /planning/engagement-activities/${act_dead}/cancel"
              payload: { cancellation_reason: "Venue lost to a scheduling conflict." }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { dead_status: $.data.status }
            - call: "POST /planning/engagement-activities"
              payload: { plan_update_id: "${pu}", venue_id: "${v2}", activity_type: "WORKSHOP", title: "Future Workshop", start_at: "2026-08-20T18:00:00.000Z", end_at: "2026-08-20T20:00:00.000Z" }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { act_live: $.data.id }
          trigger:
            - call: "POST /planning/engagement-activities/${act_dead}/complete"
              payload: {}
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { err_state: $.data.error_id }
            - call: "POST /planning/engagement-activities/${act_live}/complete"
              payload: {}
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { err_clock: $.data.error_id }
          assert:
            - "the cancelled activity returns HTTP 409 with error_id == \"ERR_ACTIVITY_NOT_SCHEDULED\" (priority 50 wins over priority 67)"
            - "the scheduled-but-un-ended activity returns HTTP 409 with error_id == \"ERR_ACTIVITY_NOT_ENDED\""
            - "EngagementActivity.${act_dead}.status == CANCELLED and EngagementActivity.${act_live}.status == SCHEDULED"
            - "PlanUpdate.${pu}.participation_weight_total == 0.0 (no completion was credited)"

      - name: venue_time_conflict_outranks_equity_eligibility_on_outreach
        grounds:
          - validations.priority_62_ERR_VENUE_TIME_CONFLICT
          - validations.priority_73_ERR_VENUE_NOT_EQUITY_ELIGIBLE
        distinguishing_aspect: |
          Pair business_temporal(62) vs business_constraint(73): a TARGETED_OUTREACH activity is
          booked at a venue that is NOT transit-served and whose interval also overlaps an existing
          SCHEDULED activity at that venue; the temporal rule must answer first with
          ERR_VENUE_TIME_CONFLICT, and only after the interval is moved clear does the equity
          eligibility rule surface ERR_VENUE_NOT_EQUITY_ELIGIBLE.
        test_recipe:
          setup:
            - "A non-transit-served but ADA-accessible venue with turnover_buffer_minutes 0 already hosts a SCHEDULED WORKSHOP from 18:00 to 20:00 on 2026-08-20 (a WORKSHOP has no transit requirement)."
          setup_api_calls:
            - call: "POST /planning/plan-updates"
              payload: { title: "Horizon 2045", jurisdiction_code: "CA-0451", base_year: 2025, horizon_year: 2045 }
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { pu: $.data.id }
            - call: "POST /planning/venues"
              payload: { name: "Hilltop Grange Hall", seated_capacity: 60, turnover_buffer_minutes: 0, ada_accessible: true, transit_served: false }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { v_notransit: $.data.id }
            - call: "POST /planning/engagement-activities"
              payload: { plan_update_id: "${pu}", venue_id: "${v_notransit}", activity_type: "WORKSHOP", title: "Hilltop Workshop", start_at: "2026-08-20T18:00:00.000Z", end_at: "2026-08-20T20:00:00.000Z" }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { act_existing: $.data.id }
          trigger:
            - call: "POST /planning/engagement-activities"
              payload: { plan_update_id: "${pu}", venue_id: "${v_notransit}", activity_type: "TARGETED_OUTREACH", title: "Renter Outreach", start_at: "2026-08-20T19:00:00.000Z", end_at: "2026-08-20T21:00:00.000Z", interpretation_offered: true }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { err_overlap: $.data.error_id }
            - call: "POST /planning/engagement-activities"
              payload: { plan_update_id: "${pu}", venue_id: "${v_notransit}", activity_type: "TARGETED_OUTREACH", title: "Renter Outreach", start_at: "2026-08-20T20:00:00.000Z", end_at: "2026-08-20T22:00:00.000Z", interpretation_offered: true }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { err_equity: $.data.error_id }
          assert:
            - "the overlapping attempt returns HTTP 409 with error_id == \"ERR_VENUE_TIME_CONFLICT\" (priority 62 wins over priority 73)"
            - "the second attempt, exactly adjacent at 20:00:00.000Z and therefore allowed by the half-open rule at buffer 0, returns HTTP 409 with error_id == \"ERR_VENUE_NOT_EQUITY_ELIGIBLE\""
            - "GET /planning/engagement-activities with venue_id == ${v_notransit} returns total_count == 1 (only the original WORKSHOP survived)"
            - "EngagementActivity.${act_existing}.status == SCHEDULED"

  # ===========================================================================
  # Rule 6 - boundary / precision checks on THREE different metrics through
  #   THREE different endpoints: vintage_year vs base_year (POST
  #   /planning/inventory-datasets), the selector candidate pool (POST
  #   .../select-preferred-alternative) and indicator reading vs target
  #   (POST .../record-reading)
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: inventory_vintage_year_equal_to_base_year_is_accepted
        grounds:
          - state_machines.InventoryDataset.create_preconditions
          - validations.priority_67_ERR_INVENTORY_VINTAGE_TOO_LATE
        distinguishing_aspect: |
          Metric: the integer comparison vintage_year <= PlanUpdate.base_year on
          POST /planning/inventory-datasets. A vintage exactly equal to base_year (2025 == 2025) must
          be accepted, base_year + 1 must be rejected with ERR_INVENTORY_VINTAGE_TOO_LATE, and
          base_year - 1 must be accepted - fixing the boundary as inclusive on the upper side.
        test_recipe:
          setup:
            - "A single plan with base_year 2025 and horizon_year 2045; the logical clock stays at its startup default."
          setup_api_calls:
            - call: "POST /planning/plan-updates"
              payload: { title: "Horizon 2045", jurisdiction_code: "CA-0451", base_year: 2025, horizon_year: 2045 }
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { pu: $.data.id, base_year: $.data.base_year }
          trigger:
            - call: "POST /planning/inventory-datasets"
              payload: { plan_update_id: "${pu}", inventory_type: "DEMOGRAPHIC", vintage_year: 2025, record_count: 4200 }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { inv_at: $.data.id, at_vintage: $.data.vintage_year, at_status: $.data.status }
            - call: "POST /planning/inventory-datasets"
              payload: { plan_update_id: "${pu}", inventory_type: "EMPLOYMENT", vintage_year: 2026, record_count: 2600 }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { err_over: $.data.error_id }
            - call: "POST /planning/inventory-datasets"
              payload: { plan_update_id: "${pu}", inventory_type: "EMPLOYMENT", vintage_year: 2024, record_count: 2600 }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { inv_under: $.data.id, under_vintage: $.data.vintage_year }
          assert:
            - "the vintage_year == 2025 attempt returns HTTP 201 with vintage_year == 2025 and status == \"DRAFT\""
            - "the vintage_year == 2026 attempt returns HTTP 409 with error_id == \"ERR_INVENTORY_VINTAGE_TOO_LATE\""
            - "the vintage_year == 2024 attempt returns HTTP 201 with vintage_year == 2024"
            - "GET /planning/plan-updates/${pu}/inventory-datasets returns total_count == 2 (the rejected attempt wrote nothing)"
            - "PlanUpdate.${pu}.compliance_posture == CAPACITY_HOLD throughout (no scenario is adopted yet)"

      - name: preferred_alternative_selector_pool_shrinks_to_empty
        grounds:
          - calculations.preferred_alternative_selector
          - state_machines.PlanAlternative.EVALUATED_to_PREFERRED
          - validations.priority_90_ERR_NO_ELIGIBLE_ALTERNATIVE
        distinguishing_aspect: |
          Metric: the size of the selector's eligibility pool (PlanAlternative rows with status
          EVALUATED) as it shrinks 2 -> 1 -> 0 across three successive
          POST /planning/environmental-reviews/{id}/select-preferred-alternative calls. The first
          call must pick the lowest net_impact_score (49.00, not the 59.50 alternative), the second
          must pick the only remaining EVALUATED row and demote the incumbent to SUPERSEDED, and the
          third must hit the empty-pool boundary with ERR_NO_ELIGIBLE_ALTERNATIVE and mutate nothing.
        test_recipe:
          setup:
            - "A plan with one EIR carrying exactly two alternatives: a 49-across-the-board alternative (raw 49.00, credit 0.00 because 49.00 < MITIGATION_MID_THRESHOLD, net 49.00) and a 70-across-the-board alternative (raw 70.00, credit 10.50 at the HIGH rate, net 59.50)."
            - "The review is CIRCULATED, which the selector requires; the logical clock stays at its startup default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /planning/plan-updates"
              payload: { title: "Horizon 2045", jurisdiction_code: "CA-0451", base_year: 2025, horizon_year: 2045 }
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { pu: $.data.id }
            - call: "POST /planning/environmental-reviews"
              payload: { plan_update_id: "${pu}", document_type: "EIR", title: "Horizon 2045 Draft EIR" }
              as: EnvironmentalConsultant
              as_user_id: "consultant-1"
              captures: { er: $.data.id }
            - call: "POST /planning/plan-alternatives"
              payload: { environmental_review_id: "${er}", label: "Transit-Focused Alternative", traffic_vmt_index: 49, ghg_index: 49, habitat_index: 49, water_index: 49 }
              as: EnvironmentalConsultant
              as_user_id: "consultant-1"
              captures: { alt_low: $.data.id, low_raw: $.data.raw_impact_score, low_net: $.data.net_impact_score }
            - call: "POST /planning/plan-alternatives"
              payload: { environmental_review_id: "${er}", label: "Auto-Oriented Alternative", traffic_vmt_index: 70, ghg_index: 70, habitat_index: 70, water_index: 70 }
              as: EnvironmentalConsultant
              as_user_id: "consultant-1"
              captures: { alt_high: $.data.id, high_raw: $.data.raw_impact_score, high_net: $.data.net_impact_score }
            - call: "POST /planning/environmental-reviews/${er}/circulate"
              payload: {}
              as: EnvironmentalConsultant
              as_user_id: "consultant-1"
              captures: { er_status: $.data.status, alt_count: $.data.alternative_count }
          trigger:
            - call: "POST /planning/environmental-reviews/${er}/select-preferred-alternative"
              payload: {}
              as: EnvironmentalConsultant
              as_user_id: "consultant-1"
              captures: { pick1: $.data.id, pick1_net: $.data.net_impact_score, pick1_status: $.data.status }
            - call: "POST /planning/environmental-reviews/${er}/select-preferred-alternative"
              payload: {}
              as: EnvironmentalConsultant
              as_user_id: "consultant-1"
              captures: { pick2: $.data.id, pick2_net: $.data.net_impact_score }
            - call: "POST /planning/environmental-reviews/${er}/select-preferred-alternative"
              payload: {}
              as: EnvironmentalConsultant
              as_user_id: "consultant-1"
              captures: { err_empty: $.data.error_id }
          assert:
            - "PlanAlternative.${alt_low}.raw_impact_score == 49.00, mitigation_credit == 0.00 and net_impact_score == 49.00"
            - "PlanAlternative.${alt_high}.raw_impact_score == 70.00, mitigation_credit == 10.50 and net_impact_score == 59.50"
            - "pool of 2: the first selection returns id == ${alt_low} with status == \"PREFERRED\" and net_impact_score == 49.00, and EnvironmentalReview.${er}.preferred_alternative_id == ${alt_low}"
            - "pool of 1: the second selection returns id == ${alt_high} with status == \"PREFERRED\"; PlanAlternative.${alt_low}.status == SUPERSEDED and EnvironmentalReview.${er}.preferred_alternative_id == ${alt_high}"
            - "pool of 0: the third selection returns HTTP 409 with error_id == \"ERR_NO_ELIGIBLE_ALTERNATIVE\""
            - "after the rejected third call EnvironmentalReview.${er}.preferred_alternative_id is still ${alt_high} and PlanAlternative.${alt_high}.status == PREFERRED (nothing was mutated)"
            - "EnvironmentalReview.${er}.alternative_count == 2"

      - name: indicator_reading_exactly_equal_to_target_is_on_track
        grounds:
          - calculations.indicator_on_track
          - entities.ImplementationAction.on_track
        distinguishing_aspect: |
          Metric: the DECREASE-direction comparison latest_reading_value <= target_value on
          POST /planning/implementation-actions/{id}/record-reading at one-decimal precision. A
          reading exactly equal to the target (12.5 vs 12.5) must set on_track true and lift
          PlanUpdate.monitoring_on_track_count to 1; the next reading one tenth above (12.6) must
          flip on_track back to false and the counter back to 0, because only the newest reading
          counts and earlier readings are never averaged.
        test_recipe:
          setup:
            - "A plan with one DRAFT LAND_USE element and one PENDING MONITORING ImplementationAction whose indicator_direction is DECREASE, baseline_value 18.0 and target_value 12.5."
            - "Readings are accepted while the action is PENDING, so no plan adoption is needed."
          setup_api_calls:
            - call: "POST /planning/plan-updates"
              payload: { title: "Horizon 2045", jurisdiction_code: "CA-0451", base_year: 2025, horizon_year: 2045 }
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { pu: $.data.id }
            - call: "POST /planning/plan-elements"
              payload: { plan_update_id: "${pu}", element_type: "TRANSPORTATION", title: "Transportation Element", draft_body: "Complete streets network.", policy_count: 6 }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { el_trans: $.data.id }
            - call: "POST /planning/implementation-actions"
              payload: { plan_update_id: "${pu}", source_element_id: "${el_trans}", action_type: "MONITORING", title: "VMT per capita monitoring", indicator_name: "vmt_per_capita", indicator_direction: "DECREASE", baseline_value: 18.0, target_value: 12.5 }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { ia: $.data.id, ia_status: $.data.status, ia_on_track: $.data.on_track, ia_readings: $.data.reading_count }
          trigger:
            - call: "POST /planning/implementation-actions/${ia}/record-reading"
              payload: { reading_value: 12.5 }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { at_track: $.data.on_track, at_value: $.data.latest_reading_value, at_count: $.data.reading_count }
            - call: "POST /planning/implementation-actions/${ia}/record-reading"
              payload: { reading_value: 12.6 }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { over_track: $.data.on_track, over_value: $.data.latest_reading_value, over_count: $.data.reading_count }
          assert:
            - "at creation: ImplementationAction.${ia}.status == PENDING, on_track == false, reading_count == 0, latest_reading_value == null and due_at == null"
            - "after the 12.5 reading: on_track == true, latest_reading_value == 12.5, latest_reading_at == \"2026-08-01T00:00:00.000Z\", reading_count == 1 and PlanUpdate.${pu}.monitoring_on_track_count == 1"
            - "after the 12.6 reading: on_track == false, latest_reading_value == 12.6, reading_count == 2 and PlanUpdate.${pu}.monitoring_on_track_count == 0 (the newest reading replaces, never averages, the previous one)"
            - "ImplementationAction.${ia}.status is still PENDING (recording a reading is not a state transition)"

  # ===========================================================================
  # Rule 7 - cross-entity state dependencies over THREE different entity pairs:
  #   GrowthScenario <- InventoryDataset / EnvironmentalReview <- PlanAlternative
  #   / PlanElement <- GrowthScenario
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: scenario_create_requires_certified_land_use_inventory
        grounds:
          - state_machines.GrowthScenario.create_preconditions
          - state_machines.InventoryDataset.DRAFT_to_CERTIFIED
          - calculations.land_capacity_units
        distinguishing_aspect: |
          Entity pair GrowthScenario <- InventoryDataset: creating a scenario is legal only while the
          pinned LAND_USE dataset is CERTIFIED. The identical request body is rejected with
          ERR_INVENTORY_NOT_CERTIFIED against a DRAFT dataset and accepted against the same dataset
          after certification, which also proves the state check at priority 50 runs before the OCC
          check at priority 55 (the supplied expected_inventory_version was current in both attempts).
        test_recipe:
          setup:
            - "A plan and one DRAFT LAND_USE inventory (vacant 400, underutilized 250, constrained 60, density 18) authored by staff-1."
          setup_api_calls:
            - call: "POST /planning/plan-updates"
              payload: { title: "Horizon 2045", jurisdiction_code: "CA-0451", base_year: 2025, horizon_year: 2045 }
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { pu: $.data.id }
            - call: "POST /planning/inventory-datasets"
              payload: { plan_update_id: "${pu}", inventory_type: "LAND_USE", vintage_year: 2025, vacant_acres: 400, underutilized_acres: 250, infrastructure_constrained_acres: 60, allowed_density_units_per_acre: 18 }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { inv_land: $.data.id, v_draft: $.data.version, draft_status: $.data.status }
          trigger:
            - call: "POST /planning/growth-scenarios"
              payload: { plan_update_id: "${pu}", land_use_inventory_id: "${inv_land}", expected_inventory_version: "${v_draft}", label: "Trend 2045", method: "TREND", horizon_year: 2045, base_households: 60000, annual_household_growth_rate: 0.008, job_growth_total: 31000, demolition_replacement_units: 1200 }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { err_not_certified: $.data.error_id }
            - call: "POST /planning/inventory-datasets/${inv_land}/certify"
              payload: {}
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { v_cert: $.data.version, cert_status: $.data.status }
            - call: "POST /planning/growth-scenarios"
              payload: { plan_update_id: "${pu}", land_use_inventory_id: "${inv_land}", expected_inventory_version: "${v_cert}", label: "Trend 2045", method: "TREND", horizon_year: 2045, base_households: 60000, annual_household_growth_rate: 0.008, job_growth_total: 31000, demolition_replacement_units: 1200 }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { sc: $.data.id, sc_capacity: $.data.land_capacity_units, sc_variant: $.data.capacity_variant }
          assert:
            - "the first attempt returns HTTP 409 with error_id == \"ERR_INVENTORY_NOT_CERTIFIED\" and InventoryDataset.${inv_land}.referencing_scenario_count == 0 afterwards"
            - "certification returns status == CERTIFIED with version == 2 (create left it at 1)"
            - "the second attempt returns HTTP 201 with capacity_variant == \"GROSS_CAPACITY\", land_capacity_units == 11700 ((400 + 250) * 18), projected_demand_units == 12144 and capacity_gap_units == 444"
            - "InventoryDataset.${inv_land}.referencing_scenario_count == 1 and version == 3 (the accepted scenario bumped it)"
            - "PlanUpdate.${pu}.adopted_scenario_id == null and compliance_posture == CAPACITY_HOLD (creating a scenario is not adopting it)"

      - name: review_certify_requires_selected_preferred_alternative
        grounds:
          - state_machines.EnvironmentalReview.CIRCULATED_to_CERTIFIED
          - state_machines.PlanAlternative.EVALUATED_to_PREFERRED
          - validations.priority_77_ERR_PREFERRED_ALTERNATIVE_NOT_SELECTED
        distinguishing_aspect: |
          Entity pair EnvironmentalReview <- PlanAlternative: the review's own lifecycle is gated by
          the state of its children twice over. With one alternative circulation fails with
          ERR_INSUFFICIENT_ALTERNATIVES; with two it succeeds; and after the comment period has
          elapsed certification still fails with ERR_PREFERRED_ALTERNATIVE_NOT_SELECTED until one
          child reaches PREFERRED - the clock gate at priority 67 having already been satisfied so
          that the child-state rule is the only remaining obstacle.
        test_recipe:
          setup:
            - "A plan with a DRAFT EIR carrying exactly one alternative."
            - "The logical clock starts at its default 2026-08-01T00:00:00Z; the EIR comment period is EIR_COMMENT_PERIOD_DAYS (45) days, so circulation on 2026-08-01 ends at 2026-09-15T00:00:00Z."
          setup_api_calls:
            - call: "POST /planning/plan-updates"
              payload: { title: "Horizon 2045", jurisdiction_code: "CA-0451", base_year: 2025, horizon_year: 2045 }
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { pu: $.data.id }
            - call: "POST /planning/environmental-reviews"
              payload: { plan_update_id: "${pu}", document_type: "EIR", title: "Horizon 2045 Draft EIR" }
              as: EnvironmentalConsultant
              as_user_id: "consultant-1"
              captures: { er: $.data.id, er_status: $.data.status }
            - call: "POST /planning/plan-alternatives"
              payload: { environmental_review_id: "${er}", label: "Transit-Focused Alternative", traffic_vmt_index: 49, ghg_index: 49, habitat_index: 49, water_index: 49 }
              as: EnvironmentalConsultant
              as_user_id: "consultant-1"
              captures: { alt_low: $.data.id, low_net: $.data.net_impact_score }
          trigger:
            - call: "POST /planning/environmental-reviews/${er}/circulate"
              payload: {}
              as: EnvironmentalConsultant
              as_user_id: "consultant-1"
              captures: { err_alts: $.data.error_id }
            - call: "POST /planning/plan-alternatives"
              payload: { environmental_review_id: "${er}", label: "Auto-Oriented Alternative", traffic_vmt_index: 70, ghg_index: 70, habitat_index: 70, water_index: 70 }
              as: EnvironmentalConsultant
              as_user_id: "consultant-1"
              captures: { alt_high: $.data.id }
            - call: "POST /planning/environmental-reviews/${er}/circulate"
              payload: {}
              as: EnvironmentalConsultant
              as_user_id: "consultant-1"
              captures: { circ_status: $.data.status, circ_ends: $.data.comment_period_ends_at }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00.000Z" }
              as: PlanningDirector
              as_user_id: "director-1"
            - call: "POST /planning/environmental-reviews/${er}/certify"
              payload: {}
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { err_no_pref: $.data.error_id }
            - call: "POST /planning/environmental-reviews/${er}/select-preferred-alternative"
              payload: {}
              as: EnvironmentalConsultant
              as_user_id: "consultant-1"
              captures: { picked: $.data.id }
            - call: "POST /planning/environmental-reviews/${er}/certify"
              payload: {}
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { final_status: $.data.status, certified_at: $.data.certified_at }
          assert:
            - "circulation with alternative_count == 1 returns HTTP 409 with error_id == \"ERR_INSUFFICIENT_ALTERNATIVES\" and EnvironmentalReview.${er}.status stays DRAFT"
            - "circulation with alternative_count == 2 returns HTTP 200 with status == \"CIRCULATED\", comment_period_days == 45, circulated_at == \"2026-08-01T00:00:00.000Z\" and comment_period_ends_at == \"2026-09-15T00:00:00.000Z\""
            - "certification at exactly comment_period_ends_at with preferred_alternative_id null returns HTTP 409 with error_id == \"ERR_PREFERRED_ALTERNATIVE_NOT_SELECTED\" (the clock gate at priority 67 is satisfied inclusively, so it is not the blocker)"
            - "the selector returns id == ${alt_low} (net 49.00 beats 59.50) and EnvironmentalReview.${er}.preferred_alternative_id == ${alt_low}"
            - "the final certification returns status == \"CERTIFIED\" with certified_at == \"2026-09-15T00:00:00.000Z\""
            - "PlanAlternative.${alt_high}.status == EVALUATED (it was never selected and never superseded)"

      - name: element_approve_requires_adopted_growth_scenario
        grounds:
          - state_machines.PlanElement.IN_REVIEW_to_APPROVED
          - state_machines.GrowthScenario.DRAFT_to_ADOPTED
          - validations.priority_50_ERR_SCENARIO_NOT_ADOPTED
        distinguishing_aspect: |
          Entity pair PlanElement <- GrowthScenario, and the dependency is conditional on
          element_type: approving the HOUSING element requires the plan to have an ADOPTED scenario,
          while approving the TRANSPORTATION element in the same request sequence does not. The
          rejected HOUSING approval must leave the element in IN_REVIEW with revision_round 0 and
          reviewed_by_user_id null, proving the failed decision was not recorded as a revision round.
        test_recipe:
          setup:
            - "A plan with all four inventories CERTIFIED and one DRAFT TREND scenario (not yet adopted)."
            - "A HOUSING element and a TRANSPORTATION element, both IN_REVIEW, both authored by staff-1 so director-1 may decide on them."
          setup_api_calls:
            - call: "POST /planning/plan-updates"
              payload: { title: "Horizon 2045", jurisdiction_code: "CA-0451", base_year: 2025, horizon_year: 2045 }
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { pu: $.data.id }
            - call: "POST /planning/inventory-datasets"
              payload: { plan_update_id: "${pu}", inventory_type: "DEMOGRAPHIC", vintage_year: 2025, record_count: 4200 }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { inv_demo: $.data.id }
            - call: "POST /planning/inventory-datasets/${inv_demo}/certify"
              payload: {}
              as: PlanningDirector
              as_user_id: "director-1"
            - call: "POST /planning/inventory-datasets"
              payload: { plan_update_id: "${pu}", inventory_type: "HOUSING", vintage_year: 2025, record_count: 3100 }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { inv_hous: $.data.id }
            - call: "POST /planning/inventory-datasets/${inv_hous}/certify"
              payload: {}
              as: PlanningDirector
              as_user_id: "director-1"
            - call: "POST /planning/inventory-datasets"
              payload: { plan_update_id: "${pu}", inventory_type: "EMPLOYMENT", vintage_year: 2025, record_count: 2600 }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { inv_emp: $.data.id }
