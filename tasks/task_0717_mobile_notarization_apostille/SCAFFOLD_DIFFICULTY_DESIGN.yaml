            - "SigningRequest.${req_id}.status == DRAFT"
            - "SigningRequest.${req_id}.assigned_notary_id == null"

      - name: request_revise_cancels_session_depth2
        grounds:
          - state_machines.SigningRequest.ASSIGNED_to_DRAFT
          - state_machines.RonSession.SCHEDULED_to_ENDED
          - entities.RonSession.fields.recording_status
        distinguishing_aspect: "Depth-2 chain from POST /requests/{id}/revise: (1) request ASSIGNED->DRAFT causes (2) its SCHEDULED RonSession to be cancelled (session_status->ENDED, recording_status->ARCHIVED). Originates from a different transition than the notary-expire cascade."
