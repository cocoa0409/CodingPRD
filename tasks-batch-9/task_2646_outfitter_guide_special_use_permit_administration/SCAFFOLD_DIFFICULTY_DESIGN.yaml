              as: ProgramAdministrator
              captures: { ua2_id: "$.data.id" }
            - call: "POST /osup/use-areas/${ua_id}/needs-assessments"
              payload: { assessment_year: 2026, public_need_finding: "NEED_EXISTS", determined_capacity_service_days: 900, allocated_service_days: 0 }
              as: PermitSpecialist
              captures: { na26_id: "$.data.id" }
            - call: "POST /osup/needs-assessments/${na26_id}/publish"
              payload: {}
              as: AuthorizedOfficer
            - call: "POST /osup/use-areas/${ua_id}/needs-assessments"
              payload: { assessment_year: 2027, public_need_finding: "NEED_EXISTS", determined_capacity_service_days: 900, allocated_service_days: 0 }
              as: PermitSpecialist
              captures: { na27_id: "$.data.id" }
            - call: "POST /osup/use-areas/${ua2_id}/needs-assessments"
              payload: { assessment_year: 2027, public_need_finding: "NO_NEED", determined_capacity_service_days: 450, allocated_service_days: 0 }
              as: PermitSpecialist
              captures: { na2_id: "$.data.id" }
            - call: "POST /osup/needs-assessments/${na2_id}/publish"
              payload: {}
              as: AuthorizedOfficer
            - call: "POST /osup/outfitters"
              payload: { legal_name: "Alpine Outfitters LLC", ein: "410000001", contact_email: "ops@alpine.example", prequalification_insurance_verified: true }
              as: PermitSpecialist
              captures: { oa_id: "$.data.id" }
            - call: "POST /osup/permit-applications"
              payload: { outfitter_id: "${oa_id}", use_area_id: "${ua_id}", application_type: "NEW", season_year: 2027, requested_service_days: 200, proposed_activity_type: "RIVER_FLOAT", narrative: "Alpine BRW-01 2027" }
              as: PermitSpecialist
              captures: { app1_id: "$.data.id" }
            - call: "POST /osup/permit-applications/${app1_id}/submit"
              payload: {}
              as: OutfitterRepresentative
              as_user_id: "${oa_id}"
            - call: "POST /osup/permit-applications"
              payload: { outfitter_id: "${oa_id}", use_area_id: "${ua2_id}", application_type: "NEW", season_year: 2027, requested_service_days: 100, proposed_activity_type: "HUNTING", narrative: "Alpine BRW-02 2027" }
              as: PermitSpecialist
              captures: { app2_id: "$.data.id" }
            - call: "POST /osup/permit-applications/${app2_id}/submit"
              payload: {}
              as: OutfitterRepresentative
              as_user_id: "${oa_id}"
          trigger:
            - call: "POST /osup/permit-applications/${app1_id}/screen"
