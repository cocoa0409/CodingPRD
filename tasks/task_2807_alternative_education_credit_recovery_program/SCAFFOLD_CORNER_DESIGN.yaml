            - "the second call returns HTTP 409 with ERR_SEAT_TIME_INSUFFICIENT: seat_fraction round(5.00 / 60.00, 4) == 0.0833 floors to 0.00 credits, and the SEAT_TIME variant never consults mastery_pct 90.00"
            - "both enrollments stay in progress_state SUBMITTED_FOR_AWARD with projected_credits 0.00 and no CreditAward row exists (GET /credit-awards?student_id=${stu_id} is empty)"
