      - name: suspension_auto_lift_at_boundary
        claim_type: valid_transition
        grounds: ["state_machines.Candidate.status_SUSPENDED_to_ACTIVE", "entities.Candidate.fields.suspended_until"]
        distinguishing_aspect: "System transition at the boundary: SUSPENSION for 30 days resolved at 2026-09-05 sets suspended_until 2026-10-05T00:00:00Z; at 2026-10-04 the candidate is still SUSPENDED, and the sweep at exactly 2026-10-05T00:00:00Z lifts (<= semantics) to ACTIVE."
        test_recipe:
          setup:
            - "candidate with a FILED discipline case; clock at 2026-09-05"
          setup_api_calls:
            - call: "POST /actuarial/candidates"
              payload: { email: "cand1@example.com", full_name: "Cand One" }
              as: Anonymous
              captures: { cand_id: $.data.id }
            - call: "POST /actuarial/discipline-cases"
              payload: { candidate_id: "${cand_id}", charge: "Disruptive conduct", severity: 4 }
              as: Registrar
              captures: { case_id: $.data.id }
            - call: "POST /actuarial/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: Registrar
            - call: "POST /actuarial/discipline-cases/${case_id}/sanction"
              payload: { resolution: "SUSPENSION", suspension_days: 30 }
              as: DisciplineBoard
          trigger:
            - call: "POST /actuarial/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-04T00:00:00Z" }
              as: Registrar
              captures: { lifted_early: $.data.suspensions_lifted }
            - call: "GET /actuarial/candidates/${cand_id}"
              as: Registrar
              captures: { st_before: $.data.status }
            - call: "POST /actuarial/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-05T00:00:00Z" }
              as: Registrar
              captures: { lifted_at_boundary: $.data.suspensions_lifted }
            - call: "GET /actuarial/candidates/${cand_id}"
              as: Registrar
              captures: { st_after: $.data.status, until_after: $.data.suspended_until }
          assert:
            - "${lifted_early} == 0 and ${st_before} == SUSPENDED (one day before the boundary)"
            - "${lifted_at_boundary} == 1 and ${st_after} == ACTIVE and ${until_after} == null (lifted exactly at suspended_until)"

