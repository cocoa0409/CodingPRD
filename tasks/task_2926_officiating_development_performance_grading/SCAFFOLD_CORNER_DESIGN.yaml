  # ===========================================================================
  - section: cross_cutting_layers
    instances:

      - name: stale_expected_game_version_on_assignment_create_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[assignment-create-stale-game]
          - errors[ERR_STALE_GAME_VERSION]
          - validations[priority=9]
          - entities.Game.fields.version
        distinguishing_aspect: "Game.version is bumped by the first assignment, so replaying the original expected_game_version returns 412 ERR_STALE_GAME_VERSION; re-reading the game and retrying with the fresh version succeeds, and the rejected attempt left the version untouched."
        test_recipe:
          setup:
            - "SeasonProgram 2026 is OPEN with crew_size_required 2."
            - "Dan and Rita are both ACTIVE and preseason-cleared; G1 is SCHEDULED and its version at creation was captured."
          setup_api_calls:
            - *k_clock
            - *k_prog
            - *k_open
            - *k_off_dan
            - *k_dan_exam
            - *k_dan_phys
            - *k_off_rita
            - *k_rita_exam
            - *k_rita_phys
            - *k_game
            - *k_assign_dan
          trigger:
            - call: "POST /crew-assignments"
              payload: { game_id: "${g_id}", official_id: "${rita_id}", position: "REFEREE", expected_game_version: "${g_v0}" }
              as: CrewScheduler
              captures: { occ_err_stale: $.data.error_id }
            - call: "GET /games/${g_id}"
              payload: {}
              as: CrewScheduler
              captures: { occ_v_after_reject: $.data.version, occ_csi_after_reject: $.data.crew_strength_index }
            - call: "POST /crew-assignments"
              payload: { game_id: "${g_id}", official_id: "${rita_id}", position: "REFEREE", expected_game_version: "${occ_v_after_reject}" }
              as: CrewScheduler
              captures: { occ_retry_id: $.data.id, occ_retry_status: $.data.status }
            - call: "GET /games/${g_id}"
              payload: {}
              as: CrewScheduler
              captures: { occ_v_after_retry: $.data.version, occ_csi_after_retry: $.data.crew_strength_index }
          assert:
            - "${occ_err_stale} == ERR_STALE_GAME_VERSION with HTTP 412 because Dan's assignment already advanced the game past ${g_v0}"
            - "${occ_v_after_reject} is exactly one greater than ${g_v0} — the failed write did not bump it a second time"
            - "${occ_csi_after_reject} == 2.40 (4.80 / crew_size_required 2) — still only Dan's row is counted"
            - "the retry with the fresh version returns 201 with ${occ_retry_status} == PROPOSED"
            - "${occ_v_after_retry} is one greater than ${occ_v_after_reject} and ${occ_csi_after_retry} == 8.64 ((4.80 + 12.48) / 2)"

      - name: stale_expected_official_version_on_discipline_create_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[discipline-create-stale-official]
          - errors[ERR_STALE_OFFICIAL_VERSION]
          - entities.Official.fields.version
        distinguishing_aspect: "The auto-activation triggered by a passed rules exam bumps Official.version behind the caller's back, so a discipline action carrying the version captured at creation returns 412; the retry with the re-read version opens the action and puts Dan on PROBATION."
        test_recipe:
          setup:
            - "SeasonProgram 2026 is OPEN and Dan's version was captured at creation, before any training record existed."
          setup_api_calls:
            - *k_clock
            - *k_prog
            - *k_open
            - *k_off_dan
            - *k_dan_exam
          trigger:
            - call: "POST /discipline-actions"
              payload: { official_id: "${dan_id}", reason_category: "PERFORMANCE", severity: "REMEDIATION", expected_official_version: "${dan_v0}" }
              as: OfficiatingDirector
              captures: { doc_err_stale: $.data.error_id }
            - call: "GET /officials/${dan_id}"
              payload: {}
              as: OfficiatingDirector
              captures: { doc_v_fresh: $.data.version, doc_status_before: $.data.status }
            - call: "POST /discipline-actions"
              payload: { official_id: "${dan_id}", reason_category: "PERFORMANCE", severity: "REMEDIATION", expected_official_version: "${doc_v_fresh}" }
              as: OfficiatingDirector
              captures: { doc_da_id: $.data.id, doc_da_status: $.data.status, doc_da_cycles: $.data.remediation_cycle_count }
            - call: "GET /officials/${dan_id}"
              payload: {}
              as: OfficiatingDirector
              captures: { doc_status_after: $.data.status, doc_v_after: $.data.version }
          assert:
            - "${doc_err_stale} == ERR_STALE_OFFICIAL_VERSION with HTTP 412 — the CANDIDATE -> ACTIVE auto-transition invalidated ${dan_v0}"
            - "${doc_v_fresh} is greater than ${dan_v0} and ${doc_status_before} == ACTIVE"
            - "the retry returns 201 with ${doc_da_status} == OPENED and ${doc_da_cycles} == 0"
            - "${doc_status_after} == PROBATION and ${doc_v_after} is one greater than ${doc_v_fresh}"

      - name: third_exposure_to_the_same_team_trips_the_rotation_cap
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.team_rotation_exposure
          - validations[priority=14]
          - errors[ERR_TEAM_ROTATION_LIMIT]
        distinguishing_aspect: "The cap counts prior exposures, so the second BUF game is accepted and the third is rejected at exactly max_team_exposures_per_season 2; the three games are spaced so the occupancy rule at the higher priority 10 cannot fire and mask the cap."
        test_recipe:
          setup:
            - "SeasonProgram 2026 is OPEN with crew_size_required 1, max_team_exposures_per_season 2, travel_lead_hours 24 and min_rest_hours_between_games 96."
            - "Dan is ACTIVE, preseason-cleared and unaffiliated."
            - "G1 MIA vs BUF at 2026-09-13T17:00:00Z, G2 BUF vs DEN at 2026-09-18T21:00:00Z, G3 SEA vs BUF at 2026-09-24T01:00:00Z — consecutive occupancy windows touch but never overlap."
          setup_api_calls:
            - *k_clock
            - *k_prog1
            - *k_open
            - *k_off_dan
            - *k_dan_exam
            - *k_dan_phys
            - *k_game
            - *k_game2
            - *k_game3
          trigger:
            - call: "POST /crew-assignments"
              payload: { game_id: "${g_id}", official_id: "${dan_id}", position: "UMPIRE", expected_game_version: "${g_v0}" }
              as: CrewScheduler
              captures: { rot_a1_id: $.data.id, rot_a1_until: $.data.occupied_until_utc }
            - call: "POST /crew-assignments"
              payload: { game_id: "${g2_id}", official_id: "${dan_id}", position: "UMPIRE", expected_game_version: "${g2_v0}" }
              as: CrewScheduler
              captures: { rot_a2_id: $.data.id, rot_a2_from: $.data.occupied_from_utc, rot_a2_until: $.data.occupied_until_utc }
            - call: "POST /crew-assignments"
              payload: { game_id: "${g3_id}", official_id: "${dan_id}", position: "UMPIRE", expected_game_version: "${g3_v0}" }
              as: CrewScheduler
              captures: { rot_err_cap: $.data.error_id }
            - call: "GET /crew-assignments"
              payload: { official_id: "${dan_id}" }
              as: CrewScheduler
              captures: { rot_row0_id: "$.data[0].id", rot_row1_id: "$.data[1].id" }
            - call: "GET /officials/${dan_id}"
              payload: {}
              as: CrewScheduler
              captures: { rot_oac: $.data.open_assignment_count }
          assert:
            - "${rot_a1_until} == 2026-09-17T21:00:00Z and ${rot_a2_from} == 2026-09-17T21:00:00Z — half-open adjacency, so priority 10 stays silent"
            - "${rot_a2_until} == 2026-09-23T01:00:00Z, one hour before G3's window opens at 2026-09-24T01:00:00Z minus 24h"
            - "the third BUF assignment returns HTTP 409 with ${rot_err_cap} == ERR_TEAM_ROTATION_LIMIT because two prior exposures already exist (G1 as away team, G2 as home team)"
            - "${rot_row0_id} == ${rot_a1_id} and ${rot_row1_id} == ${rot_a2_id} — exactly two rows survive"
            - "${rot_oac} == 2 — the rejected assignment did not increment the counter"

      - name: postseason_lock_cascades_into_retention_and_the_eligible_count
        claim_type: cascading_side_effects
        grounds:
          - endpoints[POST /season-programs/{id}/lock-postseason]
          - calculations.retention_score
          - calculations.accuracy_index
          - calculations.training_deficiency_count
          - entities.SeasonProgram.fields.eligible_official_count
        distinguishing_aspect: "One lock call runs the whole chain end to end: FINAL accuracy recompute (95.00), availability (100.00), raw composite 96.50, the high-band penalty 2.00 for one clinic shortfall, retention 94.50 -> RETAIN, and eligible_official_count 1 on the program."
        test_recipe:
          setup:
            - "SeasonProgram 2026 is OPEN with crew_size_required 1, threshold 95.00, min_graded_plays_for_eligibility 3 and clinic_attendance_required 1."
            - "Dan holds a passed exam and a passed physical but has attended no rules clinic, so his training_deficiency_count is 1."
            - "Game G1 is FINALIZED with three FINAL grades on Dan: CORRECT, CORRECT and MISSED_CALL/LOW (0.75); his only assignment is COMPLETED."
          setup_api_calls:
            - *k_clock
            - *k_prog1
            - *k_open
            - *k_off_dan
            - *k_dan_exam
            - *k_dan_phys
            - *k_game
            - *k_assign_dan
            - *k_confirm_dan
            - *k_clock_kick
            - *k_kick
            - *k_clock_grade
            - *k_played
            - *k_three_correct_grades
            - *k_grade
            - *k_post_grade
            - *k_finalize
            - call: "GET /season-programs/${sp_id}"
              payload: {}
              as: OfficiatingDirector
              captures: { lock_v_before: $.data.version }
          trigger:
            - call: "GET /season-records"
              payload: { official_id: "${dan_id}" }
              as: OfficiatingDirector
              captures: { lock_index_prov: "$.data[0].accuracy_index", lock_variant_prov: "$.data[0].accuracy_variant", lock_n_prov: "$.data[0].graded_play_count" }
            - call: "POST /season-programs/${sp_id}/lock-postseason"
              payload: {}
              as: OfficiatingDirector
              captures: { lock_status: $.data.status, lock_eligible_count: $.data.eligible_official_count, lock_v_after: $.data.version }
            - call: "GET /season-records"
              payload: { official_id: "${dan_id}" }
              as: OfficiatingDirector
              captures:
                lock_index_final: "$.data[0].accuracy_index"
                lock_variant_final: "$.data[0].accuracy_variant"
                lock_n_final: "$.data[0].graded_play_count"
                lock_wep_final: "$.data[0].weighted_error_points"
                lock_avail: "$.data[0].availability_component"
                lock_retention: "$.data[0].retention_score"
                lock_reco: "$.data[0].retention_recommendation"
                lock_post_elig: "$.data[0].postseason_eligible"
            - call: "GET /officials/${dan_id}"
              payload: {}
              as: OfficiatingDirector
              captures: { lock_official_status: $.data.status }
          assert:
            - "before the lock ${lock_variant_prov} == PROVISIONAL with ${lock_n_prov} == 3 and ${lock_index_prov} == 95.00 (the same three plays are already FINAL)"
            - "${lock_status} == POSTSEASON_LOCKED, ${lock_v_after} is one greater than ${lock_v_before} and ${lock_eligible_count} == 1"
            - "${lock_variant_final} == FINAL with ${lock_n_final} == 3 and ${lock_wep_final} == 0.75, so ${lock_index_final} == 95.00 and the official is accuracy_eligible on the inclusive threshold"
            - "${lock_avail} == 100.00 — one COMPLETED assignment out of one obligated assignment"
            - "${lock_retention} == 94.50 — raw 95.00*0.7 + 100.00*0.3 = 96.50 sits in the >= 90.00 band, so the rate is 2.00 and 96.50 - 2.00*1 = 94.50"
            - "${lock_reco} == RETAIN (94.50 >= 90.00) and ${lock_post_elig} == true"
            - "${lock_official_status} == ACTIVE — only RELEASE recommendations release an official"

      - name: suspension_cascade_reprices_the_game_after_voiding_assignments
