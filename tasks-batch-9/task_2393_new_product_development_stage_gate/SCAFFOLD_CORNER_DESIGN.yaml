              payload: { test_type: "MONADIC", sample_size: 200, purchase_intent_top2_pct: 40.00, uniqueness_pct: 30.00, fielded_at: "2026-07-24T00:00:00Z" }
              as: InnovationLead
              captures: { pg_ct1_id: $.data.id }
            - call: "POST /innovation-projects/${pg_p_id}/concept-tests"
              payload: { test_type: "MONADIC", sample_size: 200, purchase_intent_top2_pct: 40.00, uniqueness_pct: 30.00, fielded_at: "2026-07-23T00:00:00Z" }
              as: InnovationLead
            - call: "POST /innovation-projects/${pg_p_id}/concept-tests"
              payload: { test_type: "MONADIC", sample_size: 200, purchase_intent_top2_pct: 40.00, uniqueness_pct: 30.00, fielded_at: "2026-07-22T00:00:00Z" }
              as: InnovationLead
            - call: "POST /innovation-projects/${pg_p_id}/concept-tests"
              payload: { test_type: "MONADIC", sample_size: 200, purchase_intent_top2_pct: 40.00, uniqueness_pct: 30.00, fielded_at: "2026-07-21T00:00:00Z" }
