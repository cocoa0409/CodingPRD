            - "SupplyOrder.${o_la}.allocation_state == DROPPED and fulfillment_state == CANCELLED (ALLOCATED + PENDING at terminate time)"
            - "SupplyOrder.${o_lb}.allocation_state == ALLOCATED (promoted by the released 6 units) and final_total_cents == 314650 (5 * 62930)"
            - "AllocationCycle.${cT}.licensee_reserved_units == 6 (HD2 1 + LB 5) and available_units == 4 (capacity conserved at 10)"

      - name: product_line_retirement_cascades_order_drop_credit_release
        grounds:
          - state_machines.ProductLine.CLEARANCE_to_RETIRED
          - state_machines.SupplyOrder.RESERVED_to_DROPPED
          - calculations.credit_exposure
        distinguishing_aspect: |
          Depth-2 chain from POST /api/product-lines/{id}/advance into RETIRED:
          (1) both RESERVED orders of the line flip DROPPED/CANCELLED;
