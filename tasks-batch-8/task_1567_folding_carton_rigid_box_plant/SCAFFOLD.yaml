# =============================================================================
# Scaffold: Folding-Carton & Rigid-Box Plant (task_1567)
# =============================================================================

scenario: |
  Folding-Carton & Rigid-Box Plant (folding carton converter): structural design & CAD sample, layout/nesting on sheet & yield, coating/foil/emboss routing, brand color standard & press approval, small-run digital vs offset routing, kitting & carton assembly service, retail-ready packaging compliance, minimum & make-ready recovery

domain_name: folding-carton-plant
api_prefix: /plant

# =============================================================================
# §0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat            # peer entities joined by FK references; no nested URL ownership
  state_machine_shape: cyclic      # revision loops on DesignRevision/PressApproval/RetailReadyAudit + auto-revert cycle on Job
  relationship_patterns:
    - one_to_many                  # Customer -> Jobs, Job -> children
    - cross_aggregate              # PressApproval -> ColorStandard; ImpositionPlan -> DesignRevision; Job -> BoardStock
  role_model: approval_chain       # PlantAdmin/Designer build, PressOperator runs, BrandQuality (brand-side) approves
  consistency_model: immediate     # all side effects atomic within the triggering request

# =============================================================================
# §1.0: Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1: Entity-Relationship Table
# All linear measures are integer hundredths of an inch ("cin"); all money is
# integer cents; delta-E is integer milli-units; weight is integer grams.
# =============================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Brand owner display name" }
      - { name: brand_code, type: string, source: input, description: "Short brand code, unique per plant" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED", constraints: "SUSPENDED blocks new job creation" }

  - name: ColorStandard
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; owning brand" }
      - { name: ink_slot, type: string, source: input, description: "Ink/deck slot name this standard governs (e.g. PROCESS_MAGENTA, BRAND_RED)" }
      - { name: l_target, type: integer, source: input, description: "CIELAB L* target x100 (integer)" }
      - { name: a_target, type: integer, source: input, description: "CIELAB a* target x100 (integer, may be negative)" }
      - { name: b_target, type: integer, source: input, description: "CIELAB b* target x100 (integer, may be negative)" }
      - { name: tolerance_delta_e_milli, type: integer, source: input, description: "Approval tolerance in milli delta-E; measured <= tolerance passes (boundary inclusive)" }
      - { name: substrate_class, type: enum, source: input, description: "COATED | UNCOATED" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | PENDING_BRAND | ACTIVE | SUPERSEDED" }

  - name: Job
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id" }
      - { name: quantity_ordered, type: integer, source: input, description: "Ordered carton count (>=1)" }
      - { name: blank_w_cin, type: integer, source: input, description: "Flat blank width, hundredths of inch" }
      - { name: blank_h_cin, type: integer, source: input, description: "Flat blank height, hundredths of inch" }
      - { name: grain_rotation_allowed, type: boolean, source: input, description: "If false, rotated nesting orientation is forbidden" }
      - { name: substrate_code, type: string, source: input, description: "Board grade code matched to BoardStock.substrate_code" }
      - { name: caliper_pts, type: integer, source: input, description: "Board caliper in points matched to BoardStock.caliper_pts" }
      - { name: finish_coat, type: boolean, source: input, description: "Requires aqueous coating pass" }
      - { name: finish_foil, type: boolean, source: input, description: "Requires foil stamping pass (forces OFFSET route)" }
      - { name: finish_emboss, type: boolean, source: input, description: "Requires embossing pass (forces OFFSET route)" }
      - { name: required_ink_slots, type: array, source: input, description: "Ink slots that each need an ACTIVE ColorStandard and an APPROVED PressApproval" }
      - { name: requires_retail_compliance, type: boolean, source: input, description: "If true, job cannot COMPLETE without a CERTIFIED RetailReadyAudit" }
      - { name: route_type, type: enum, source: computed, description: "DIGITAL | OFFSET — see calculation route_selection" }
      - { name: status, type: enum, source: system, default: QUOTED, description: "QUOTED | ENGINEERING | PRESS_READY | IN_PRODUCTION | FINISHING | FINISHED | COMPLETE | CANCELLED" }
      - { name: provisional_subtotal_cents, type: integer, source: computed, description: "Forward-looking quote subtotal at creation (calculation provisional_quote)" }
      - { name: provisional_total_cents, type: integer, source: computed, description: "Quote total after minimum/make-ready recovery at creation" }
      - { name: board_stock_id, type: string, source: system, description: "FK -> BoardStock.id; selected at mark-press-ready by sheet_allocation selector" }
      - { name: locked_ups, type: integer, source: system, description: "Cartons per sheet from the LOCKED ImpositionPlan, captured at mark-press-ready" }
      - { name: reserved_sheets, type: integer, source: system, default: 0, description: "Sheets currently reserved from board_stock_id for this job" }
      - { name: sheets_consumed_actual, type: integer, source: system, default: 0, description: "Sum of sheets_printed over COMPLETED press bookings" }
      - { name: good_sheets_actual, type: integer, source: system, default: 0, description: "Sum of sheets_good over COMPLETED press bookings" }
      - { name: good_cartons_actual, type: integer, source: computed, description: "= good_sheets_actual * locked_ups" }
      - { name: allocated_cartons, type: integer, source: system, default: 0, description: "Finished cartons allocated to non-cancelled kit orders" }
      - { name: available_cartons, type: integer, source: computed, description: "= good_cartons_actual - allocated_cartons" }

  - name: DesignRevision
    parent: null
    common_fields: true
    fields:
      - { name: job_id, type: string, source: input, description: "FK -> Job.id" }
      - { name: cad_ref, type: string, source: input, description: "CAD/dieline document reference" }
      - { name: blank_w_cin, type: integer, source: input, description: "Structural blank width (overrides job nominal for nesting)" }
      - { name: blank_h_cin, type: integer, source: input, description: "Structural blank height" }
      - { name: grain_rotation_allowed, type: boolean, source: input, description: "Structural grain constraint for nesting rotation" }
      - { name: revision_number, type: integer, source: system, description: "1-based per job, increments on each new revision" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | SAMPLE_MADE | BRAND_APPROVED | SUPERSEDED" }

  - name: ImpositionPlan
    parent: null
    common_fields: true
    fields:
      - { name: job_id, type: string, source: input, description: "FK -> Job.id" }
      - { name: design_revision_id, type: string, source: input, description: "FK -> DesignRevision.id; must belong to same job and not be SUPERSEDED" }
      - { name: sheet_w_cin, type: integer, source: input, description: "Press sheet width, hundredths of inch" }
      - { name: sheet_h_cin, type: integer, source: input, description: "Press sheet height" }
      - { name: gutter_cin, type: integer, source: input, description: "Inter-blank gutter" }
      - { name: edge_margin_cin, type: integer, source: input, description: "Unprintable edge margin (applied both side edges; one edge + gripper on height)" }
      - { name: gripper_cin, type: integer, source: input, description: "Gripper bite deducted from sheet height" }
      - { name: ups, type: integer, source: computed, description: "Cartons per sheet per calculation nesting_yield" }
      - { name: orientation, type: enum, source: computed, description: "NORMAL | ROTATED — winning orientation" }
      - { name: net_sheets, type: integer, source: computed, description: "ceil(quantity_ordered / ups)" }
      - { name: gross_sheets, type: integer, source: computed, description: "net with route spoilage uplift (theoretical variant)" }
      - { name: layout_yield_milli_pct, type: integer, source: computed, description: "Blank area / sheet area in milli-percent (floor)" }
      - { name: realized_sheets_printed, type: integer, source: system, default: 0, description: "Cascaded from job actuals at press booking completion" }
      - { name: realized_good_sheets, type: integer, source: system, default: 0, description: "Cascaded from job actuals at press booking completion" }
      - { name: realized_waste_milli_pct, type: integer, source: computed, description: "Realized variant: (printed - good) * 100000 / printed, floor; null until any completion" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | LOCKED | SUPERSEDED" }

  - name: PressApproval
    parent: null
    common_fields: true
    fields:
      - { name: job_id, type: string, source: input, description: "FK -> Job.id" }
      - { name: color_standard_id, type: string, source: input, description: "FK -> ColorStandard.id; must be ACTIVE and match job customer + ink slot" }
      - { name: ink_slot, type: string, source: input, description: "Slot being approved; must equal ColorStandard.ink_slot and be in job.required_ink_slots" }
      - { name: measured_delta_e_milli, type: integer, source: input, description: "Measured color deviation at submit/resubmit" }
      - { name: submission_index, type: integer, source: system, description: "1 on create, increments on each resubmit" }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "SUBMITTED | APPROVED | REJECTED | INVALIDATED" }

  - name: Press
    parent: null
    common_fields: true
    fields:
      - { name: press_code, type: string, source: input, description: "Machine code, unique" }
      - { name: press_type, type: enum, source: input, description: "DIGITAL | OFFSET" }
      - { name: max_sheet_w_cin, type: integer, source: input, description: "Max sheet width the press accepts" }
      - { name: max_sheet_h_cin, type: integer, source: input, description: "Max sheet height the press accepts" }
      - { name: max_sheets_per_booking, type: integer, source: input, description: "Sheet-count capacity per booking (boundary: planned_sheets <= max passes)" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | DOWN" }

  - name: PressBooking
    parent: null
    common_fields: true
    fields:
      - { name: job_id, type: string, source: input, description: "FK -> Job.id" }
      - { name: press_id, type: string, source: input, description: "FK -> Press.id" }
      - { name: planned_sheets, type: integer, source: input, description: "Sheets planned for this booking (<= press.max_sheets_per_booking)" }
      - { name: start_utc, type: datetime, source: input, description: "Window start; half-open interval [start_utc, end_utc)" }
      - { name: end_utc, type: datetime, source: input, description: "Window end (exclusive)" }
      - { name: sheets_printed, type: integer, source: system, description: "Reported at completion" }
      - { name: sheets_good, type: integer, source: system, description: "Good sheets at completion (<= sheets_printed)" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | COMPLETED | CANCELLED" }

  - name: FinishingLine
    parent: null
    common_fields: true
    fields:
      - { name: line_code, type: string, source: input, description: "Line code, unique" }
      - { name: supported_ops, type: array, source: input, description: "Subset of [COAT, FOIL, EMBOSS]" }
      - { name: setup_buffer_minutes, type: integer, source: input, description: "Changeover buffer prepended to every booking on this line" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | DOWN" }

  - name: FinishingBooking
    parent: null
    common_fields: true
    fields:
      - { name: job_id, type: string, source: input, description: "FK -> Job.id" }
      - { name: line_id, type: string, source: input, description: "FK -> FinishingLine.id" }
      - { name: operation, type: enum, source: input, description: "COAT | FOIL | EMBOSS; must be required by the job's finish flags" }
      - { name: start_utc, type: datetime, source: input, description: "Run start; occupied interval is padded closed [start-buffer, end]" }
      - { name: end_utc, type: datetime, source: input, description: "Run end (inclusive under padded closed semantics)" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | COMPLETED | CANCELLED" }

  - name: BoardStock
    parent: null
    common_fields: true
    fields:
      - { name: substrate_code, type: string, source: input, description: "Board grade code" }
      - { name: caliper_pts, type: integer, source: input, description: "Board caliper in points" }
      - { name: sheet_w_cin, type: integer, source: input, description: "Stock sheet width" }
      - { name: sheet_h_cin, type: integer, source: input, description: "Stock sheet height" }
      - { name: unit_cost_cents, type: integer, source: input, description: "Cost per sheet" }
      - { name: received_sheets, type: integer, source: system, description: "Total sheets ever received (initial + receive calls)" }
      - { name: reserved_sheets, type: integer, source: system, default: 0, description: "Sheets reserved by PRESS_READY jobs" }
      - { name: consumed_sheets, type: integer, source: system, default: 0, description: "Sheets consumed by completed press bookings" }
      - { name: available_sheets, type: integer, source: computed, description: "= received_sheets - reserved_sheets - consumed_sheets (invariant, >= 0)" }

  - name: KitOrder
    parent: null
    common_fields: true
    fields:
      - { name: job_id, type: string, source: input, description: "FK -> Job.id; job must be FINISHED" }
      - { name: kit_name, type: string, source: input, description: "Kit display name" }
      - { name: components, type: array, source: input, description: "Array of { description, units_per_kit>=1 }; every unit is drawn from this job's finished cartons" }
      - { name: kits_planned, type: integer, source: input, description: "Planned kit count (>=1)" }
      - { name: consumed_per_kit, type: integer, source: computed, description: "= sum(components[].units_per_kit)" }
      - { name: allocated_cartons, type: integer, source: computed, description: "= consumed_per_kit * kits_planned, reserved from job.available_cartons at creation" }
      - { name: kits_completed, type: integer, source: system, default: 0, description: "Reported at completion (<= kits_planned)" }
      - { name: consumed_cartons, type: integer, source: system, default: 0, description: "= kits_completed * consumed_per_kit at completion" }
      - { name: labor_minutes_actual, type: integer, source: system, description: "Assembly labor minutes reported at completion" }
      - { name: status, type: enum, source: system, default: PLANNED, description: "PLANNED | IN_PROGRESS | COMPLETED | CANCELLED" }

  - name: RetailReadyAudit
    parent: null
    common_fields: true
    fields:
      - { name: job_id, type: string, source: input, description: "FK -> Job.id" }
      - { name: retailer_code, type: string, source: input, description: "Retailer program code (e.g. CLUB-A)" }
      - { name: orientation, type: enum, source: input, description: "LENGTHWISE | WIDTHWISE — case long edge vs pallet deck" }
      - { name: case_w_cin, type: integer, source: input, description: "Case width" }
      - { name: case_h_cin, type: integer, source: input, description: "Case height (vertical)" }
      - { name: case_d_cin, type: integer, source: input, description: "Case depth" }
      - { name: case_weight_g, type: integer, source: input, description: "Gross case weight in grams" }
      - { name: cases_per_layer, type: integer, source: input, description: "Cases per pallet layer" }
      - { name: layers, type: integer, source: input, description: "Pallet layers" }
      - { name: case_count, type: integer, source: input, description: "Total cases on pallet; must equal cases_per_layer * layers exactly" }
      - { name: verdict, type: enum, source: computed, description: "COMPLIANT | NON_COMPLIANT per calculation retail_compliance_verdict" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | SUBMITTED | CERTIFIED | REJECTED" }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: job_id, type: string, source: input, description: "FK -> Job.id; at most one non-VOIDED invoice per job" }
      - { name: variant, type: enum, source: computed, description: "PROVISIONAL while DRAFT | FINAL after finalize" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | FINALIZED | SETTLED | VOIDED" }
      - { name: lines, type: array, source: computed, description: "Charge lines [{code, amount_cents}]: PRINT, BOARD, FINISH_COAT, FINISH_FOIL, FINISH_EMBOSS, KITTING, MAKE_READY" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Sum of per-line rounded amounts (rounding order pinned in final_settlement)" }
      - { name: make_ready_waived, type: boolean, source: computed, description: "True when print line >= MAKE_READY_WAIVER_THRESHOLD_CENTS and route OFFSET" }
      - { name: make_ready_line_cents, type: integer, source: computed, description: "Make-ready line actually charged after waiver rule" }
      - { name: minimum_recovery_cents, type: integer, source: computed, description: "max(0, MIN_ORDER_CENTS - subtotal_cents)" }
      - { name: total_cents, type: integer, source: computed, description: "= subtotal_cents + minimum_recovery_cents" }

# =============================================================================
# §1.2: State Machine Table
# =============================================================================
state_machines:
  - entity: Customer
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /plant/customers/{customerId}/set-status"
        actor: PlantAdmin
        preconditions: []
        side_effects: ["blocks new job creation for this customer (ERR_CUSTOMER_INACTIVE)"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /plant/customers/{customerId}/set-status"
        actor: PlantAdmin
        preconditions: []
        side_effects: []

  - entity: ColorStandard
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PENDING_BRAND
        trigger: "POST /plant/color-standards/{id}/submit"
        actor: PlantAdmin
        preconditions: []
        side_effects: []
      - from: PENDING_BRAND
        to: ACTIVE
        trigger: "POST /plant/color-standards/{id}/approve"
        actor: BrandQuality
        preconditions:
          - "X-User-ID == standard.customer_id (ERR_CUSTOMER_OWNERSHIP_MISMATCH)"
        side_effects:
          - "CASCADE L1: any other ACTIVE ColorStandard with same (customer_id, ink_slot) -> SUPERSEDED"
          - "CASCADE L2 (caused by L1): every PressApproval pinned to the newly SUPERSEDED standard whose job.status is not IN_PRODUCTION/FINISHING/FINISHED/COMPLETE/CANCELLED -> INVALIDATED"
          - "CASCADE L3 (caused by L2): each Job in PRESS_READY that lost an APPROVED approval -> ENGINEERING; its board reservation is released (BoardStock.reserved_sheets -= job.reserved_sheets; job.reserved_sheets = 0; job.board_stock_id = null)"

  - entity: DesignRevision
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SAMPLE_MADE
        trigger: "POST /plant/design-revisions/{id}/make-sample"
        actor: StructuralDesigner
        preconditions:
          - "Job of this revision is in ENGINEERING (ERR_INVALID_STATE_TRANSITION)"
        side_effects: []
      - from: SAMPLE_MADE
        to: BRAND_APPROVED
        trigger: "POST /plant/design-revisions/{id}/brand-accept"
        actor: BrandQuality
        preconditions:
          - "X-User-ID == job.customer_id (ERR_CUSTOMER_OWNERSHIP_MISMATCH)"
        side_effects: []
      - from: SAMPLE_MADE
        to: DRAFT
        trigger: "POST /plant/design-revisions/{id}/brand-reject (revision loop)"
        actor: BrandQuality
        preconditions:
          - "X-User-ID == job.customer_id (ERR_CUSTOMER_OWNERSHIP_MISMATCH)"
        side_effects: []
      - from: [DRAFT, SAMPLE_MADE, BRAND_APPROVED]
        to: SUPERSEDED
        trigger: "system (a newer DesignRevision is created for the same job via POST /plant/design-revisions)"
        actor: system
        preconditions: []
        side_effects:
          - "CASCADE L1: the superseding create moves the prior non-SUPERSEDED revision -> SUPERSEDED"
          - "CASCADE L2 (caused by L1): if the superseded revision was BRAND_APPROVED and job.status == PRESS_READY, job -> ENGINEERING"
          - "CASCADE L3 (caused by L2): job revert releases its board reservation (BoardStock.reserved_sheets -= job.reserved_sheets; job.reserved_sheets = 0; job.board_stock_id = null)"

  - entity: Job
    initial_state: QUOTED
    terminal_states: [COMPLETE, CANCELLED]
    transitions:
      - from: QUOTED
        to: ENGINEERING
        trigger: "POST /plant/jobs/{id}/start-engineering"
        actor: PlantAdmin
        preconditions: []
        side_effects: []
      - from: ENGINEERING
        to: PRESS_READY
        trigger: "POST /plant/jobs/{id}/mark-press-ready"
        actor: StructuralDesigner
        preconditions:
          - "A BRAND_APPROVED DesignRevision exists for the job (ERR_DESIGN_NOT_APPROVED)"
          - "A LOCKED ImpositionPlan exists for the job (ERR_PLAN_NOT_LOCKED)"
          - "Every slot in required_ink_slots has an ACTIVE ColorStandard for this customer (ERR_COLOR_STANDARD_MISSING)"
          - "Board stock selector finds a covering BoardStock (ERR_INSUFFICIENT_BOARD_STOCK)"
        side_effects:
          - "sheet_allocation selector picks BoardStock; job.board_stock_id set; job.locked_ups = LOCKED plan.ups"
          - "job.reserved_sheets = LOCKED plan.gross_sheets; BoardStock.reserved_sheets += gross_sheets"
      - from: PRESS_READY
        to: IN_PRODUCTION
        trigger: "POST /plant/jobs/{id}/start-production"
        actor: PressOperator
        preconditions:
          - "Every slot in required_ink_slots has an APPROVED PressApproval pinned to an ACTIVE ColorStandard (ERR_PRESS_APPROVAL_MISSING)"
          - "At least one SCHEDULED PressBooking exists for the job (ERR_NO_PRESS_BOOKING)"
        side_effects: []
      - from: PRESS_READY
        to: ENGINEERING
        trigger: "system (color standard supersede cascade, or design supersede cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "Board reservation released: BoardStock.reserved_sheets -= job.reserved_sheets; job.reserved_sheets = 0; job.board_stock_id = null"
      - from: IN_PRODUCTION
        to: FINISHING
        trigger: "POST /plant/jobs/{id}/complete-press"
        actor: PressOperator
        preconditions:
          - "All PressBookings of the job are COMPLETED or CANCELLED (ERR_OPEN_PRESS_BOOKINGS)"
          - "good_cartons_actual >= quantity_ordered (ERR_SHORT_COUNT)"
        side_effects: []
      - from: FINISHING
        to: FINISHED
        trigger: "POST /plant/jobs/{id}/complete-finishing"
        actor: FinishingOperator
        preconditions:
          - "For each true finish flag, at least one COMPLETED FinishingBooking of that operation exists for the job (ERR_FINISHING_INCOMPLETE)"
        side_effects: []
      - from: FINISHED
        to: COMPLETE
        trigger: "POST /plant/jobs/{id}/complete"
        actor: PlantAdmin
        preconditions:
          - "If requires_retail_compliance: a CERTIFIED RetailReadyAudit exists for the job (ERR_RRP_NOT_CERTIFIED) [business_safety]"
          - "No KitOrder of the job is PLANNED or IN_PROGRESS (ERR_OPEN_KIT_ORDERS) [business_referential]"
        side_effects:
          - "Unused reservation released: BoardStock.reserved_sheets -= job.reserved_sheets; job.reserved_sheets = 0"
      - from: [QUOTED, ENGINEERING, PRESS_READY]
        to: CANCELLED
        trigger: "POST /plant/jobs/{id}/cancel"
        actor: PlantAdmin
        preconditions: []
        side_effects:
          - "CASCADE L1: board reservation released if any (BoardStock.reserved_sheets -= job.reserved_sheets; job.reserved_sheets = 0)"
          - "CASCADE L2 (caused by L1's job mutation): every SCHEDULED PressBooking and FinishingBooking of the job -> CANCELLED"

  - entity: ImpositionPlan
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: LOCKED
        trigger: "POST /plant/imposition-plans/{id}/lock"
        actor: StructuralDesigner
        preconditions:
          - "Job is in ENGINEERING (ERR_INVALID_STATE_TRANSITION)"
          - "OCC: expected_job_version == job.version (ERR_STALE_JOB_VERSION)"
        side_effects:
          - "Any other LOCKED plan of the same job -> SUPERSEDED (supersede semantics make this a create-with-supersede write)"
          - "increments Job.version by 1"
      - from: LOCKED
        to: SUPERSEDED
        trigger: "POST /plant/imposition-plans/{id}/supersede or system (another plan locked)"
        actor: StructuralDesigner | system
        preconditions:
          - "Manual supersede: job not yet IN_PRODUCTION or later (ERR_INVALID_STATE_TRANSITION)"
        side_effects: []

  - entity: PressApproval
    initial_state: SUBMITTED
    terminal_states: [INVALIDATED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /plant/press-approvals/{id}/approve"
        actor: BrandQuality
        preconditions:
          - "X-User-ID == job.customer_id (ERR_CUSTOMER_OWNERSHIP_MISMATCH)"
          - "measured_delta_e_milli <= ColorStandard.tolerance_delta_e_milli, inclusive boundary (ERR_DELTA_E_EXCEEDED)"
        side_effects: []
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /plant/press-approvals/{id}/reject"
        actor: BrandQuality
        preconditions:
          - "X-User-ID == job.customer_id (ERR_CUSTOMER_OWNERSHIP_MISMATCH)"
        side_effects: []
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /plant/press-approvals/{id}/resubmit (approval round loop)"
        actor: PressOperator
        preconditions: []
        side_effects: ["measured_delta_e_milli replaced by request value; submission_index += 1"]
      - from: [SUBMITTED, REJECTED, APPROVED]
        to: INVALIDATED
        trigger: "system (pinned ColorStandard SUPERSEDED while job not yet IN_PRODUCTION)"
        actor: system
        preconditions: []
        side_effects: ["may force owning Job PRESS_READY -> ENGINEERING (see ColorStandard cascade)"]

  - entity: Press
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: DOWN
        trigger: "POST /plant/presses/{id}/set-status"
        actor: PlantAdmin
        preconditions: []
        side_effects: ["new bookings rejected with ERR_PRESS_UNAVAILABLE"]
      - from: DOWN
        to: ACTIVE
        trigger: "POST /plant/presses/{id}/set-status"
        actor: PlantAdmin
        preconditions: []
        side_effects: []

  - entity: PressBooking
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /plant/press-bookings/{id}/complete"
        actor: PressOperator
        preconditions:
          - "sheets_good <= sheets_printed (ERR_INVALID_REQUEST)"
          - "If sheets_printed exceeds the job's remaining reserved sheets, the excess must fit BoardStock.available_sheets (ERR_INSUFFICIENT_BOARD_STOCK)"
        side_effects:
          - "CASCADE L1: BoardStock.consumed_sheets += sheets_printed; BoardStock.reserved_sheets -= min(sheets_printed, job.reserved_sheets); job.reserved_sheets -= min(sheets_printed, job.reserved_sheets)"
          - "CASCADE L2 (caused by L1's stock/job mutation): job.sheets_consumed_actual += sheets_printed; job.good_sheets_actual += sheets_good; job.good_cartons_actual recomputed (= good_sheets_actual * locked_ups)"
          - "CASCADE L3 (caused by L2's job actuals change): LOCKED ImpositionPlan realized fields updated (realized_sheets_printed, realized_good_sheets, realized_waste_milli_pct recomputed)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /plant/press-bookings/{id}/cancel or system (job cancelled)"
        actor: PressOperator | system
        preconditions: []
        side_effects: []

  - entity: FinishingLine
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: DOWN
        trigger: "POST /plant/finishing-lines/{id}/set-status"
        actor: PlantAdmin
        preconditions: []
        side_effects: ["new bookings rejected with ERR_LINE_UNAVAILABLE"]
      - from: DOWN
        to: ACTIVE
        trigger: "POST /plant/finishing-lines/{id}/set-status"
        actor: PlantAdmin
        preconditions: []
        side_effects: []

  - entity: FinishingBooking
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /plant/finishing-bookings/{id}/complete"
        actor: FinishingOperator
        preconditions: []
        side_effects: ["operation becomes billable for invoice final_settlement"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /plant/finishing-bookings/{id}/cancel or system (job cancelled)"
        actor: FinishingOperator | system
        preconditions: []
        side_effects: []

  - entity: KitOrder
    initial_state: PLANNED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PLANNED
        to: IN_PROGRESS
        trigger: "POST /plant/kit-orders/{id}/start"
        actor: KittingLead
        preconditions: []
        side_effects: []
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /plant/kit-orders/{id}/complete"
        actor: KittingLead
        preconditions:
          - "kits_completed <= kits_planned (ERR_INVALID_REQUEST)"
        side_effects:
          - "kit.consumed_cartons = kits_completed * consumed_per_kit; kit.labor_minutes_actual recorded"
          - "Unused allocation returned: job.allocated_cartons -= (kits_planned - kits_completed) * consumed_per_kit"
      - from: [PLANNED, IN_PROGRESS]
        to: CANCELLED
        trigger: "POST /plant/kit-orders/{id}/cancel"
        actor: KittingLead
        preconditions: []
        side_effects:
          - "Remaining allocation returned: job.allocated_cartons -= (kits_planned - kits_completed) * consumed_per_kit"

  - entity: RetailReadyAudit
    initial_state: DRAFT
    terminal_states: [CERTIFIED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /plant/retail-audits/{id}/submit"
        actor: KittingLead
        preconditions:
          - "verdict == COMPLIANT (ERR_AUDIT_NON_COMPLIANT)"
        side_effects: []
      - from: SUBMITTED
        to: CERTIFIED
        trigger: "POST /plant/retail-audits/{id}/certify"
        actor: BrandQuality
        preconditions:
          - "X-User-ID == job.customer_id (ERR_CUSTOMER_OWNERSHIP_MISMATCH)"
        side_effects: []
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /plant/retail-audits/{id}/reject"
        actor: BrandQuality
        preconditions:
          - "X-User-ID == job.customer_id (ERR_CUSTOMER_OWNERSHIP_MISMATCH)"
        side_effects: []
      - from: REJECTED
        to: DRAFT
        trigger: "POST /plant/retail-audits/{id}/revise (audit revision loop)"
        actor: KittingLead
        preconditions: []
        side_effects: ["case/pallet inputs replaced by request values; verdict recomputed"]

  - entity: Invoice
    initial_state: DRAFT
    terminal_states: [SETTLED, VOIDED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /plant/invoices/{id}/finalize"
        actor: BillingClerk
        preconditions:
          - "Job is COMPLETE (ERR_JOB_NOT_COMPLETE)"
        side_effects:
          - "final_settlement recomputes lines with actuals; variant PROVISIONAL -> FINAL"
          - "minimum_makeready_recovery applied: make_ready_waived, minimum_recovery_cents, total_cents set"
      - from: FINALIZED
        to: SETTLED
        trigger: "POST /plant/invoices/{id}/settle"
        actor: BillingClerk
        preconditions: []
        side_effects: []
      - from: FINALIZED
        to: VOIDED
        trigger: "POST /plant/invoices/{id}/void"
        actor: BillingClerk
        preconditions: []
        side_effects: ["job becomes eligible for a new invoice (non-VOIDED uniqueness released)"]

# =============================================================================
# §1.2.1: Concurrency Rules (true create-with-supersede writes only, OCC on Job.version)
# =============================================================================
concurrency_rules:
  - rule_id: design-revision-create-stale-job
    parent_entity: Job
    write_endpoint: "POST /plant/design-revisions"
    occ_field: expected_job_version
    description: |
      Creating a DesignRevision legitimately supersedes the job's current
      non-SUPERSEDED revision, so the write is accepted only when the client's
      observed Job.version still matches; a request carrying a stale
      expected_job_version is rejected with ERR_STALE_JOB_VERSION.
    error_id: ERR_STALE_JOB_VERSION
    http_status: 412
  - rule_id: imposition-lock-stale-job
    parent_entity: Job
    write_endpoint: "POST /plant/imposition-plans/{planId}/lock"
    occ_field: expected_job_version
    description: |
      Locking an ImpositionPlan legitimately supersedes the job's currently
      LOCKED plan, so the write is accepted only when the client's observed
      Job.version still matches; a request carrying a stale
      expected_job_version is rejected with ERR_STALE_JOB_VERSION.
    error_id: ERR_STALE_JOB_VERSION
    http_status: 412

# =============================================================================
# §1.3: Calculation Rules Table
# Integer arithmetic only: dims in cin, money in cents, delta-E in milli.
# ceil(a/b) for non-negative integers = (a + b - 1) // b.
# round_half_up(x) for rational x = floor(x + 1/2); implemented on integer
# numerators as (2*num + den) // (2*den).
# =============================================================================
calculations:
  - name: nesting_yield
    trigger: "ImpositionPlan creation; provisional_quote reuses it with the standard sheet constants"
    algorithm: constraint_propagation
    formula: |
      usable_w = sheet_w_cin - 2 * edge_margin_cin
      usable_h = sheet_h_cin - edge_margin_cin - gripper_cin
      orientation A (NORMAL): cols_a = usable_w // (blank_w + gutter); rows_a = usable_h // (blank_h + gutter); ups_a = cols_a * rows_a
      orientation B (ROTATED, blanks swapped): cols_b = usable_w // (blank_h + gutter); rows_b = usable_h // (blank_w + gutter); ups_b = cols_b * rows_b
      if grain_rotation_allowed == false: ups = ups_a; orientation = NORMAL
      else: ups = max(ups_a, ups_b); orientation = NORMAL if ups_a >= ups_b else ROTATED
      if ups == 0: reject creation with ERR_LAYOUT_IMPOSSIBLE
      net_sheets = ceil(quantity_ordered / ups)
      gross_sheets (theoretical variant): OFFSET -> ceil(net_sheets * 108 / 100); DIGITAL -> ceil(net_sheets * 103 / 100)
      layout_yield_milli_pct = (ups * blank_w * blank_h * 100000) // (sheet_w_cin * sheet_h_cin)   [floor]
      realized variant (on press booking completion, from job actuals):
        realized_sheets_printed = job.sheets_consumed_actual; realized_good_sheets = job.good_sheets_actual
        realized_waste_milli_pct = (printed - good) * 100000 // printed (floor); null when printed == 0
    input_set: "Job (quantity_ordered, route_type, grain via design revision), DesignRevision blank dims, plan sheet params"
    constants:
      STD_SHEET_W_CIN: 4000
      STD_SHEET_H_CIN: 2800
      STD_GUTTER_CIN: 25
      STD_EDGE_MARGIN_CIN: 50
      STD_GRIPPER_CIN: 75
      OFFSET_SPOILAGE_NUM: 108
      DIGITAL_SPOILAGE_NUM: 103
      SPOILAGE_DEN: 100
    precision: "integer sheets (ceil); milli-percent floor"
    variants:
      - name: theoretical
        when: "plan creation / provisional quote — uses declared spoilage constants"
        difference: "gross_sheets from spoilage constants; no actuals consulted"
      - name: realized
        when: "after each press booking completion"
        difference: "realized_sheets_printed / realized_good_sheets / realized_waste_milli_pct from job actuals; theoretical fields unchanged"

  - name: route_selection
    trigger: "Job creation (sets route_type, immutable afterwards)"
    algorithm: threshold
    formula: |
      if finish_foil == true OR finish_emboss == true: route_type = OFFSET
      elif quantity_ordered <= DIGITAL_MAX_QTY: route_type = DIGITAL
      else: route_type = OFFSET
      Boundary: quantity_ordered == 2500 exactly routes DIGITAL (inclusive); 2501 routes OFFSET.
    input_set: "Job creation inputs only"
    constants:
      DIGITAL_MAX_QTY: 2500
    precision: "exact integer comparison, inclusive <="

  - name: provisional_quote
    trigger: "Job creation"
    algorithm: forward_looking
    formula: |
      billable_quantity = max(quantity_ordered, MIN_BILLING_QTY)
      unit_price_cents = tier rate: billable >= 10000 -> 24; >= 5000 -> 30; >= 2500 -> 38; >= 1000 -> 45
      print_line = billable_quantity * unit_price_cents                        [exact integer]
      planned sheets: nesting_yield(theoretical) on the STANDARD sheet constants with job blanks/grain
      board_line = gross_sheets * REFERENCE_SHEET_COST_CENTS                   [no stock chosen yet]
      finishing lines: for each true finish flag F: finish_line_F = round_half_up(quantity_ordered * RATE_PER_M[F] / 1000)
        = (2 * quantity_ordered * RATE_PER_M[F] + 1000) // 2000                [per-line rounding, pinned]
      make_ready_line: OFFSET -> MAKE_READY_OFFSET_CENTS, waived to 0 when print_line >= MAKE_READY_WAIVER_THRESHOLD_CENTS;
        DIGITAL -> MAKE_READY_DIGITAL_CENTS, never waived
      provisional_subtotal_cents = print_line + board_line + sum(finish lines) + make_ready_line
      minimum_recovery = max(0, MIN_ORDER_CENTS - provisional_subtotal_cents)
      provisional_total_cents = provisional_subtotal_cents + minimum_recovery
    input_set: "Job creation inputs; no actuals exist yet"
    constants:
      MIN_BILLING_QTY: 1000
      TIER_1_QTY: 2500
      TIER_1_RATE_CENTS: 38
      TIER_2_QTY: 5000
      TIER_2_RATE_CENTS: 30
      TIER_3_QTY: 10000
      TIER_3_RATE_CENTS: 24
      BASE_RATE_CENTS: 45
      REFERENCE_SHEET_COST_CENTS: 320
      RATE_PER_M_COAT_CENTS: 950
      RATE_PER_M_FOIL_CENTS: 2650
      RATE_PER_M_EMBOSS_CENTS: 1775
      MAKE_READY_OFFSET_CENTS: 180000
      MAKE_READY_DIGITAL_CENTS: 25000
      MAKE_READY_WAIVER_THRESHOLD_CENTS: 400000
      MIN_ORDER_CENTS: 750000
    precision: "each charge line independently rounded half-up to whole cents BEFORE summing (see final_settlement rounding order pin)"
    variants:
      - name: provisional
        when: "job creation / DRAFT invoice"
        difference: "planned sheets on standard sheet at reference cost; finishing estimated on quantity_ordered; kitting absent (0)"
      - name: final
        when: "invoice finalize"
        difference: "actual consumed sheets at selected BoardStock.unit_cost_cents; finishing on good_cartons_actual and only COMPLETED operations; kitting lines included"

  - name: final_settlement
    trigger: "POST /plant/invoices/{id}/finalize"
    algorithm: chronological
    formula: |
      billable_quantity = max(quantity_ordered, MIN_BILLING_QTY)
      print_line = billable_quantity * tier rate (same tier table as provisional_quote)
      board_line = job.sheets_consumed_actual * BoardStock.unit_cost_cents     [job.board_stock_id]
      finishing: for each operation with >= 1 COMPLETED FinishingBooking for the job:
        finish_line_op = round_half_up(job.good_cartons_actual * RATE_PER_M[op] / 1000)
        = (2 * good_cartons_actual * RATE_PER_M[op] + 1000) // 2000
      kitting: for each COMPLETED KitOrder: kit_line = labor_minutes_actual * KIT_LABOR_CENTS_PER_MIN + kits_completed * KIT_FEE_PER_KIT_CENTS
      ROUNDING ORDER PIN (mode b): every line is rounded half-up to whole cents individually; subtotal_cents is the
      sum of the already-rounded lines. Summing unrounded line values and rounding once at the end is FORBIDDEN
      (produces different cents — e.g. good_cartons 20750 with COAT+FOIL+EMBOSS: per-line 19713+54988+36831 = 111532
      vs aggregate-rounded 111531).
      make_ready_waived / make_ready_line / minimum_recovery / total per minimum_makeready_recovery.
    input_set: "Job COMPLETE; BoardStock selected; COMPLETED bookings and kit orders only (CANCELLED/SCHEDULED excluded)"
    constants:
      KIT_LABOR_CENTS_PER_MIN: 150
      KIT_FEE_PER_KIT_CENTS: 85
    precision: "per-line round_half_up to cents, then integer sum"

  - name: minimum_makeready_recovery
    trigger: "inside provisional_quote and final_settlement, after line computation"
    algorithm: tiered_pricing
    formula: |
      Evaluation order is PINNED (removes the circular-looking dependency):
        1. billable_quantity = max(quantity_ordered, MIN_BILLING_QTY)
        2. tier rate selected from billable_quantity; print_line computed
        3. make_ready_waived = (route_type == OFFSET) AND (print_line >= MAKE_READY_WAIVER_THRESHOLD_CENTS)
           — decided from print_line ALONE, which by step 2 does not include make_ready
        4. make_ready_line = 0 if waived else (OFFSET ? 180000 : 25000)
        5. subtotal_cents = print_line + board_line + finish lines + kit lines + make_ready_line
        6. minimum_recovery_cents = max(0, MIN_ORDER_CENTS - subtotal_cents)   — boundary: subtotal == MIN_ORDER yields recovery 0
        7. total_cents = subtotal_cents + minimum_recovery_cents
    input_set: "lines computed by the calling settlement variant"
    constants:
      MIN_ORDER_CENTS: 750000
      MAKE_READY_WAIVER_THRESHOLD_CENTS: 400000
    precision: "integer cents; >= comparison inclusive on both thresholds"

  - name: sheet_allocation
    trigger: "POST /plant/jobs/{id}/mark-press-ready"
    algorithm: waterfall_allocation
    formula: |
      Candidate set: BoardStock where substrate_code == job.substrate_code AND caliper_pts == job.caliper_pts
        AND available_sheets >= LOCKED plan.gross_sheets
      Ranking: unit_cost_cents ASC; tie-break: created_at ASC (never id)
      Fallback on empty candidate set: ERR_INSUFFICIENT_BOARD_STOCK (single stock must cover the full reservation;
      no partial split across stocks)
      On success: job.board_stock_id = winner; stock.reserved_sheets += gross_sheets; job.reserved_sheets = gross_sheets
      Conserved invariant (INV-SHEETS): for every BoardStock, received_sheets == available_sheets + reserved_sheets + consumed_sheets
    input_set: "BoardStocks matching job substrate/caliper"
    precision: "integer sheets"

  - name: kitting_consumption
    trigger: "KitOrder create / complete / cancel"
    algorithm: aggregation
    formula: |
      consumed_per_kit = sum(components[].units_per_kit)
      allocated_cartons = consumed_per_kit * kits_planned
      Creation requires allocated_cartons <= job.available_cartons (ERR_KIT_QTY_EXCEEDS_REMAINING)
      On create: job.allocated_cartons += allocated_cartons
      On complete: job.allocated_cartons -= (kits_planned - kits_completed) * consumed_per_kit
      On cancel: job.allocated_cartons -= (kits_planned - kits_completed) * consumed_per_kit
      Conserved invariant (INV-CARTONS): for every Job, good_cartons_actual == allocated_cartons + available_cartons;
      create paired with cancel leaves available_cartons unchanged.
    input_set: "KitOrders of the job in any non-cancelled state"
    precision: "integer cartons"

  - name: retail_compliance_verdict
    trigger: "RetailReadyAudit create / revise"
    algorithm: threshold
    formula: |
      Pallet deck: PALLET_W_CIN x PALLET_D_CIN; orientation selects which case edge runs along pallet width.
      footprint_ok: LENGTHWISE -> cases_per_layer * case_w_cin <= PALLET_W_CIN AND case_d_cin <= PALLET_D_CIN
                    WIDTHWISE  -> cases_per_layer * case_d_cin <= PALLET_W_CIN AND case_w_cin <= PALLET_D_CIN
      height_ok: layers * case_h_cin <= MAX_PALLET_HEIGHT_CIN
      weight_ok: case_count * case_weight_g <= MAX_PALLET_WEIGHT_G
      count_ok: case_count == cases_per_layer * layers        [exact integer equality — divisibility boundary]
      verdict = COMPLIANT iff footprint_ok AND height_ok AND weight_ok AND count_ok else NON_COMPLIANT
    input_set: "audit inputs only"
    constants:
      PALLET_W_CIN: 12192
      PALLET_D_CIN: 10160
      MAX_PALLET_HEIGHT_CIN: 15240
      MAX_PALLET_WEIGHT_G: 680389
    precision: "integer comparisons, all inclusive <="

# =============================================================================
# §1.4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; role name recognized"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per §1.5 roles"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "BrandQuality ownership: X-User-ID equals the customer_id of the acted-on resource (standard/job chain)"
    error_id: ERR_CUSTOMER_OWNERSHIP_MISMATCH
    http_status: 403
    applies_to: "BrandQuality action endpoints (color approve, design accept/reject, press-approval approve/reject, audit certify/reject)"
  - priority: 4
    category: existence
    check: "Path ids and body FK references (customer_id, job_id, color_standard_id, design_revision_id, press_id, line_id) exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"
  - priority: 5
    category: existence
    check: "Request shape: required fields present, enum membership, integers >= 1 where applicable, sheets_good <= sheets_printed, kits_completed <= kits_planned, components non-empty with units_per_kit >= 1"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with bodies"
  - priority: 6
    category: state
    check: "Target resource in a state from which the transition/action is defined (incl. job COMPLETE for invoice finalize, revision not SUPERSEDED for plan creation)"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 7
    category: business_safety
    check: "Quality/compliance gates: delta-E within tolerance on approve; RRP certification present on job complete"
    error_id: "ERR_DELTA_E_EXCEEDED | ERR_RRP_NOT_CERTIFIED"
    http_status: 409
    applies_to: "POST /plant/press-approvals/{id}/approve; POST /plant/jobs/{id}/complete"
  - priority: 8
    category: business_temporal
    check: "Booking windows: start_utc >= current clock; press half-open overlap; finishing padded closed overlap"
    error_id: "ERR_WINDOW_IN_PAST | ERR_PRESS_WINDOW_CONFLICT | ERR_FINISHING_WINDOW_CONFLICT"
    http_status: 409
    applies_to: "POST /plant/press-bookings; POST /plant/finishing-bookings"
  - priority: 9
    category: business_referential
    check: "Referenced-entity state: customer ACTIVE for new jobs; color standard ACTIVE + customer/slot match; press ACTIVE + type match + sheet fits; line ACTIVE + op supported + op required; no open kit orders on job complete"
    error_id: "ERR_CUSTOMER_INACTIVE | ERR_COLOR_STANDARD_NOT_ACTIVE | ERR_INK_SLOT_MISMATCH | ERR_PRESS_UNAVAILABLE | ERR_PRESS_TYPE_MISMATCH | ERR_LINE_UNAVAILABLE | ERR_OPERATION_UNSUPPORTED | ERR_OPERATION_NOT_REQUIRED | ERR_OPEN_KIT_ORDERS"
    http_status: 409
    applies_to: "job creation; press-approval creation; press/finishing booking creation; job complete"
  - priority: 10
    category: business_constraint
    check: "Uniqueness/aggregate constraints: one non-VOIDED invoice per job; one non-CANCELLED finishing booking per (job, operation); revision belongs to plan's job; layout feasible (ups >= 1); press capacity per booking"
    error_id: "ERR_INVOICE_ALREADY_OPEN | ERR_OPERATION_ALREADY_BOOKED | ERR_REVISION_JOB_MISMATCH | ERR_LAYOUT_IMPOSSIBLE | ERR_SHEET_EXCEEDS_CAPACITY"
    http_status: 409
    applies_to: "invoice creation; finishing booking creation; imposition plan creation; press booking creation"
  - priority: 11
    category: business_fiscal
    check: "Capacity/fiscal sufficiency last: board stock covers reservation or over-print excess; kit allocation within available finished cartons; engineering gates (design approved, plan locked, standards active) for mark-press-ready; short-count and finishing completeness on production transitions"
    error_id: "ERR_INSUFFICIENT_BOARD_STOCK | ERR_KIT_QTY_EXCEEDS_REMAINING | ERR_DESIGN_NOT_APPROVED | ERR_PLAN_NOT_LOCKED | ERR_COLOR_STANDARD_MISSING | ERR_PRESS_APPROVAL_MISSING | ERR_NO_PRESS_BOOKING | ERR_OPEN_PRESS_BOOKINGS | ERR_SHORT_COUNT | ERR_FINISHING_INCOMPLETE | ERR_AUDIT_NON_COMPLIANT"
    http_status: 409
    applies_to: "mark-press-ready; press booking completion; kit order creation; production/audit transitions"

# =============================================================================
# §1.5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Customer ---
  - { method: POST, path: "/plant/customers", description: "Create brand customer", roles: [PlantAdmin], code: 201, input: [name, brand_code], output: Customer, side_effects: ["status=ACTIVE"] }
  - { method: GET, path: "/plant/customers", description: "List customers", roles: [PlantAdmin, StructuralDesigner, PressOperator, FinishingOperator, KittingLead, BrandQuality, BillingClerk], code: 200, input: ["status?"], output: "Customer[]", side_effects: [] }
  - { method: GET, path: "/plant/customers/{customerId}", description: "Get customer", roles: [PlantAdmin, StructuralDesigner, PressOperator, FinishingOperator, KittingLead, BrandQuality, BillingClerk], code: 200, input: [], output: Customer, side_effects: [] }
  - { method: POST, path: "/plant/customers/{customerId}/set-status", description: "Suspend/reactivate customer", roles: [PlantAdmin], code: 200, input: [to_status], output: Customer, side_effects: ["status <- to_status"] }

  # --- ColorStandard ---
  - { method: POST, path: "/plant/color-standards", description: "Create color standard (DRAFT)", roles: [PlantAdmin], code: 201, input: [customer_id, ink_slot, l_target, a_target, b_target, tolerance_delta_e_milli, substrate_class], output: ColorStandard, side_effects: [] }
  - { method: GET, path: "/plant/color-standards", description: "List color standards", roles: [PlantAdmin, StructuralDesigner, PressOperator, FinishingOperator, KittingLead, BrandQuality, BillingClerk], code: 200, input: ["customer_id?", "status?", "ink_slot?"], output: "ColorStandard[]", side_effects: [] }
  - { method: GET, path: "/plant/color-standards/{standardId}", description: "Get color standard", roles: [PlantAdmin, StructuralDesigner, PressOperator, FinishingOperator, KittingLead, BrandQuality, BillingClerk], code: 200, input: [], output: ColorStandard, side_effects: [] }
  - { method: POST, path: "/plant/color-standards/{standardId}/submit", description: "Submit standard to brand (DRAFT->PENDING_BRAND)", roles: [PlantAdmin], code: 200, input: [], output: ColorStandard, side_effects: [] }
  - { method: POST, path: "/plant/color-standards/{standardId}/approve", description: "Brand approves standard; supersedes prior ACTIVE revision of same (customer, slot) with invalidation cascade", roles: [BrandQuality], code: 200, input: [], output: ColorStandard, side_effects: ["prior ACTIVE standard -> SUPERSEDED", "pinned non-terminal PressApprovals -> INVALIDATED (job not yet IN_PRODUCTION)", "affected PRESS_READY jobs -> ENGINEERING with board reservation released"] }

  # --- Job ---
  - { method: POST, path: "/plant/jobs", description: "Create job (QUOTED); computes route_type and provisional quote", roles: [PlantAdmin], code: 201, input: [customer_id, quantity_ordered, blank_w_cin, blank_h_cin, grain_rotation_allowed, substrate_code, caliper_pts, finish_coat, finish_foil, finish_emboss, required_ink_slots, requires_retail_compliance], output: Job, side_effects: ["route_selection", "provisional_quote"] }
  - { method: GET, path: "/plant/jobs", description: "List jobs", roles: [PlantAdmin, StructuralDesigner, PressOperator, FinishingOperator, KittingLead, BrandQuality, BillingClerk], code: 200, input: ["customer_id?", "status?"], output: "Job[]", side_effects: [] }
  - { method: GET, path: "/plant/jobs/{jobId}", description: "Get job", roles: [PlantAdmin, StructuralDesigner, PressOperator, FinishingOperator, KittingLead, BrandQuality, BillingClerk], code: 200, input: [], output: Job, side_effects: [] }
  - { method: POST, path: "/plant/jobs/{jobId}/start-engineering", description: "QUOTED -> ENGINEERING", roles: [PlantAdmin], code: 200, input: [], output: Job, side_effects: [] }
  - { method: POST, path: "/plant/jobs/{jobId}/mark-press-ready", description: "ENGINEERING -> PRESS_READY; selects board stock and reserves gross sheets", roles: [StructuralDesigner], code: 200, input: [], output: Job, side_effects: ["sheet_allocation selector", "BoardStock.reserved_sheets += gross_sheets", "job.board_stock_id/locked_ups/reserved_sheets set"] }
  - { method: POST, path: "/plant/jobs/{jobId}/start-production", description: "PRESS_READY -> IN_PRODUCTION; requires full press approvals and a scheduled booking", roles: [PressOperator], code: 200, input: [], output: Job, side_effects: [] }
  - { method: POST, path: "/plant/jobs/{jobId}/complete-press", description: "IN_PRODUCTION -> FINISHING; requires bookings terminal and good cartons >= quantity_ordered", roles: [PressOperator], code: 200, input: [], output: Job, side_effects: [] }
  - { method: POST, path: "/plant/jobs/{jobId}/complete-finishing", description: "FINISHING -> FINISHED; requires every flagged operation to have a COMPLETED booking", roles: [FinishingOperator], code: 200, input: [], output: Job, side_effects: [] }
  - { method: POST, path: "/plant/jobs/{jobId}/complete", description: "FINISHED -> COMPLETE; RRP + open-kit gates; releases unused reservation", roles: [PlantAdmin], code: 200, input: [], output: Job, side_effects: ["BoardStock.reserved_sheets -= job.reserved_sheets; job.reserved_sheets = 0"] }
  - { method: POST, path: "/plant/jobs/{jobId}/cancel", description: "Cancel from QUOTED/ENGINEERING/PRESS_READY; releases reservation and cancels scheduled bookings", roles: [PlantAdmin], code: 200, input: [], output: Job, side_effects: ["BoardStock.reserved_sheets -= job.reserved_sheets", "SCHEDULED PressBooking/FinishingBooking of job -> CANCELLED"] }

  # --- DesignRevision ---
  - { method: POST, path: "/plant/design-revisions", description: "Create design revision for a job in ENGINEERING; supersedes the current non-SUPERSEDED revision (OCC on job)", roles: [StructuralDesigner], code: 201, input: [job_id, expected_job_version, cad_ref, blank_w_cin, blank_h_cin, grain_rotation_allowed], output: DesignRevision, side_effects: ["prior non-SUPERSEDED revision of job -> SUPERSEDED", "if that revision was BRAND_APPROVED and job PRESS_READY: job -> ENGINEERING + reservation release", "increments Job.version by 1"] }
  - { method: GET, path: "/plant/design-revisions", description: "List design revisions", roles: [PlantAdmin, StructuralDesigner, PressOperator, FinishingOperator, KittingLead, BrandQuality, BillingClerk], code: 200, input: ["job_id?", "status?"], output: "DesignRevision[]", side_effects: [] }
  - { method: GET, path: "/plant/design-revisions/{revisionId}", description: "Get design revision", roles: [PlantAdmin, StructuralDesigner, PressOperator, FinishingOperator, KittingLead, BrandQuality, BillingClerk], code: 200, input: [], output: DesignRevision, side_effects: [] }
  - { method: POST, path: "/plant/design-revisions/{revisionId}/make-sample", description: "DRAFT -> SAMPLE_MADE (CAD sample produced)", roles: [StructuralDesigner], code: 200, input: [], output: DesignRevision, side_effects: [] }
  - { method: POST, path: "/plant/design-revisions/{revisionId}/brand-accept", description: "SAMPLE_MADE -> BRAND_APPROVED", roles: [BrandQuality], code: 200, input: [], output: DesignRevision, side_effects: [] }
  - { method: POST, path: "/plant/design-revisions/{revisionId}/brand-reject", description: "SAMPLE_MADE -> DRAFT (revision loop)", roles: [BrandQuality], code: 200, input: [], output: DesignRevision, side_effects: [] }

  # --- ImpositionPlan ---
  - { method: POST, path: "/plant/imposition-plans", description: "Create imposition plan for a job in ENGINEERING; computes nesting_yield fields", roles: [StructuralDesigner], code: 201, input: [job_id, design_revision_id, sheet_w_cin, sheet_h_cin, gutter_cin, edge_margin_cin, gripper_cin], output: ImpositionPlan, side_effects: ["nesting_yield (theoretical variant)"] }
  - { method: GET, path: "/plant/imposition-plans", description: "List imposition plans", roles: [PlantAdmin, StructuralDesigner, PressOperator, FinishingOperator, KittingLead, BrandQuality, BillingClerk], code: 200, input: ["job_id?", "design_revision_id?", "status?"], output: "ImpositionPlan[]", side_effects: [] }
  - { method: GET, path: "/plant/imposition-plans/{planId}", description: "Get imposition plan", roles: [PlantAdmin, StructuralDesigner, PressOperator, FinishingOperator, KittingLead, BrandQuality, BillingClerk], code: 200, input: [], output: ImpositionPlan, side_effects: [] }
  - { method: POST, path: "/plant/imposition-plans/{planId}/lock", description: "DRAFT -> LOCKED; supersedes prior LOCKED plan of the job (OCC on job)", roles: [StructuralDesigner], code: 200, input: [expected_job_version], output: ImpositionPlan, side_effects: ["prior LOCKED plan -> SUPERSEDED", "increments Job.version by 1"] }
  - { method: POST, path: "/plant/imposition-plans/{planId}/supersede", description: "LOCKED -> SUPERSEDED (manual release before production)", roles: [StructuralDesigner], code: 200, input: [], output: ImpositionPlan, side_effects: [] }

  # --- PressApproval ---
  - { method: POST, path: "/plant/press-approvals", description: "Submit press/color approval for a job ink slot (SUBMITTED)", roles: [PressOperator], code: 201, input: [job_id, color_standard_id, ink_slot, measured_delta_e_milli], output: PressApproval, side_effects: ["submission_index=1"] }
  - { method: GET, path: "/plant/press-approvals", description: "List press approvals", roles: [PlantAdmin, StructuralDesigner, PressOperator, FinishingOperator, KittingLead, BrandQuality, BillingClerk], code: 200, input: ["job_id?", "color_standard_id?", "status?"], output: "PressApproval[]", side_effects: [] }
  - { method: GET, path: "/plant/press-approvals/{approvalId}", description: "Get press approval", roles: [PlantAdmin, StructuralDesigner, PressOperator, FinishingOperator, KittingLead, BrandQuality, BillingClerk], code: 200, input: [], output: PressApproval, side_effects: [] }
  - { method: POST, path: "/plant/press-approvals/{approvalId}/approve", description: "SUBMITTED -> APPROVED when measured delta-E <= tolerance (inclusive)", roles: [BrandQuality], code: 200, input: [], output: PressApproval, side_effects: [] }
  - { method: POST, path: "/plant/press-approvals/{approvalId}/reject", description: "SUBMITTED -> REJECTED", roles: [BrandQuality], code: 200, input: [], output: PressApproval, side_effects: [] }
  - { method: POST, path: "/plant/press-approvals/{approvalId}/resubmit", description: "REJECTED -> SUBMITTED with a new measured value", roles: [PressOperator], code: 200, input: [measured_delta_e_milli], output: PressApproval, side_effects: ["submission_index += 1"] }

  # --- Press ---
  - { method: POST, path: "/plant/presses", description: "Register press", roles: [PlantAdmin], code: 201, input: [press_code, press_type, max_sheet_w_cin, max_sheet_h_cin, max_sheets_per_booking], output: Press, side_effects: ["status=ACTIVE"] }
  - { method: GET, path: "/plant/presses", description: "List presses", roles: [PlantAdmin, StructuralDesigner, PressOperator, FinishingOperator, KittingLead, BrandQuality, BillingClerk], code: 200, input: ["press_type?", "status?"], output: "Press[]", side_effects: [] }
  - { method: GET, path: "/plant/presses/{pressId}", description: "Get press", roles: [PlantAdmin, StructuralDesigner, PressOperator, FinishingOperator, KittingLead, BrandQuality, BillingClerk], code: 200, input: [], output: Press, side_effects: [] }
  - { method: POST, path: "/plant/presses/{pressId}/set-status", description: "ACTIVE <-> DOWN", roles: [PlantAdmin], code: 200, input: [to_status], output: Press, side_effects: [] }

  # --- PressBooking ---
  - { method: POST, path: "/plant/press-bookings", description: "Book press window for a PRESS_READY/IN_PRODUCTION job; half-open overlap; capacity and type checks", roles: [PressOperator], code: 201, input: [job_id, press_id, planned_sheets, start_utc, end_utc], output: PressBooking, side_effects: [] }
  - { method: GET, path: "/plant/press-bookings", description: "List press bookings", roles: [PlantAdmin, StructuralDesigner, PressOperator, FinishingOperator, KittingLead, BrandQuality, BillingClerk], code: 200, input: ["job_id?", "press_id?", "status?"], output: "PressBooking[]", side_effects: [] }
  - { method: GET, path: "/plant/press-bookings/{bookingId}", description: "Get press booking", roles: [PlantAdmin, StructuralDesigner, PressOperator, FinishingOperator, KittingLead, BrandQuality, BillingClerk], code: 200, input: [], output: PressBooking, side_effects: [] }
  - { method: POST, path: "/plant/press-bookings/{bookingId}/complete", description: "Report sheets; consumes board stock and cascades actuals to job and locked plan", roles: [PressOperator], code: 200, input: [sheets_printed, sheets_good], output: PressBooking, side_effects: ["BoardStock.consumed_sheets += sheets_printed; reserved released by min(printed, job.reserved_sheets)", "job actuals updated; good_cartons_actual recomputed", "LOCKED plan realized fields recomputed"] }
  - { method: POST, path: "/plant/press-bookings/{bookingId}/cancel", description: "SCHEDULED -> CANCELLED", roles: [PressOperator], code: 200, input: [], output: PressBooking, side_effects: [] }

  # --- FinishingLine ---
  - { method: POST, path: "/plant/finishing-lines", description: "Register finishing line", roles: [PlantAdmin], code: 201, input: [line_code, supported_ops, setup_buffer_minutes], output: FinishingLine, side_effects: ["status=ACTIVE"] }
  - { method: GET, path: "/plant/finishing-lines", description: "List finishing lines", roles: [PlantAdmin, StructuralDesigner, PressOperator, FinishingOperator, KittingLead, BrandQuality, BillingClerk], code: 200, input: ["status?"], output: "FinishingLine[]", side_effects: [] }
  - { method: GET, path: "/plant/finishing-lines/{lineId}", description: "Get finishing line", roles: [PlantAdmin, StructuralDesigner, PressOperator, FinishingOperator, KittingLead, BrandQuality, BillingClerk], code: 200, input: [], output: FinishingLine, side_effects: [] }
  - { method: POST, path: "/plant/finishing-lines/{lineId}/set-status", description: "ACTIVE <-> DOWN", roles: [PlantAdmin], code: 200, input: [to_status], output: FinishingLine, side_effects: [] }

  # --- FinishingBooking ---
  - { method: POST, path: "/plant/finishing-bookings", description: "Book finishing window for an IN_PRODUCTION/FINISHING job; padded closed overlap per line buffer", roles: [FinishingOperator], code: 201, input: [job_id, line_id, operation, start_utc, end_utc], output: FinishingBooking, side_effects: [] }
  - { method: GET, path: "/plant/finishing-bookings", description: "List finishing bookings", roles: [PlantAdmin, StructuralDesigner, PressOperator, FinishingOperator, KittingLead, BrandQuality, BillingClerk], code: 200, input: ["job_id?", "line_id?", "status?"], output: "FinishingBooking[]", side_effects: [] }
  - { method: GET, path: "/plant/finishing-bookings/{bookingId}", description: "Get finishing booking", roles: [PlantAdmin, StructuralDesigner, PressOperator, FinishingOperator, KittingLead, BrandQuality, BillingClerk], code: 200, input: [], output: FinishingBooking, side_effects: [] }
  - { method: POST, path: "/plant/finishing-bookings/{bookingId}/complete", description: "SCHEDULED -> COMPLETED (operation becomes billable)", roles: [FinishingOperator], code: 200, input: [], output: FinishingBooking, side_effects: [] }
  - { method: POST, path: "/plant/finishing-bookings/{bookingId}/cancel", description: "SCHEDULED -> CANCELLED", roles: [FinishingOperator], code: 200, input: [], output: FinishingBooking, side_effects: [] }

  # --- BoardStock ---
  - { method: POST, path: "/plant/board-stocks", description: "Receive a board stock lot (received_sheets initialized)", roles: [PlantAdmin], code: 201, input: [substrate_code, caliper_pts, sheet_w_cin, sheet_h_cin, unit_cost_cents, received_sheets], output: BoardStock, side_effects: [] }
  - { method: GET, path: "/plant/board-stocks", description: "List board stocks", roles: [PlantAdmin, StructuralDesigner, PressOperator, FinishingOperator, KittingLead, BrandQuality, BillingClerk], code: 200, input: ["substrate_code?", "caliper_pts?"], output: "BoardStock[]", side_effects: [] }
  - { method: GET, path: "/plant/board-stocks/{stockId}", description: "Get board stock", roles: [PlantAdmin, StructuralDesigner, PressOperator, FinishingOperator, KittingLead, BrandQuality, BillingClerk], code: 200, input: [], output: BoardStock, side_effects: [] }
  - { method: POST, path: "/plant/board-stocks/{stockId}/receive", description: "Top up received sheets", roles: [PlantAdmin], code: 200, input: [additional_sheets], output: BoardStock, side_effects: ["received_sheets += additional_sheets"] }

  # --- KitOrder ---
  - { method: POST, path: "/plant/kit-orders", description: "Create kitting/assembly order for a FINISHED job; allocates finished cartons", roles: [KittingLead], code: 201, input: [job_id, kit_name, components, kits_planned], output: KitOrder, side_effects: ["job.allocated_cartons += consumed_per_kit * kits_planned"] }
  - { method: GET, path: "/plant/kit-orders", description: "List kit orders", roles: [PlantAdmin, StructuralDesigner, PressOperator, FinishingOperator, KittingLead, BrandQuality, BillingClerk], code: 200, input: ["job_id?", "status?"], output: "KitOrder[]", side_effects: [] }
  - { method: GET, path: "/plant/kit-orders/{kitId}", description: "Get kit order", roles: [PlantAdmin, StructuralDesigner, PressOperator, FinishingOperator, KittingLead, BrandQuality, BillingClerk], code: 200, input: [], output: KitOrder, side_effects: [] }
  - { method: POST, path: "/plant/kit-orders/{kitId}/start", description: "PLANNED -> IN_PROGRESS", roles: [KittingLead], code: 200, input: [], output: KitOrder, side_effects: [] }
  - { method: POST, path: "/plant/kit-orders/{kitId}/complete", description: "IN_PROGRESS -> COMPLETED; consumes cartons, returns unused allocation, records labor", roles: [KittingLead], code: 200, input: [kits_completed, labor_minutes_actual], output: KitOrder, side_effects: ["job.allocated_cartons -= (kits_planned - kits_completed) * consumed_per_kit", "consumed_cartons set"] }
  - { method: POST, path: "/plant/kit-orders/{kitId}/cancel", description: "PLANNED/IN_PROGRESS -> CANCELLED; returns remaining allocation", roles: [KittingLead], code: 200, input: [], output: KitOrder, side_effects: ["job.allocated_cartons -= (kits_planned - kits_completed) * consumed_per_kit"] }

  # --- RetailReadyAudit ---
  - { method: POST, path: "/plant/retail-audits", description: "Create retail-ready audit for a job; computes compliance verdict", roles: [KittingLead], code: 201, input: [job_id, retailer_code, orientation, case_w_cin, case_h_cin, case_d_cin, case_weight_g, cases_per_layer, layers, case_count], output: RetailReadyAudit, side_effects: ["retail_compliance_verdict"] }
  - { method: GET, path: "/plant/retail-audits", description: "List retail audits", roles: [PlantAdmin, StructuralDesigner, PressOperator, FinishingOperator, KittingLead, BrandQuality, BillingClerk], code: 200, input: ["job_id?", "status?"], output: "RetailReadyAudit[]", side_effects: [] }
  - { method: GET, path: "/plant/retail-audits/{auditId}", description: "Get retail audit", roles: [PlantAdmin, StructuralDesigner, PressOperator, FinishingOperator, KittingLead, BrandQuality, BillingClerk], code: 200, input: [], output: RetailReadyAudit, side_effects: [] }
  - { method: POST, path: "/plant/retail-audits/{auditId}/submit", description: "DRAFT -> SUBMITTED; requires COMPLIANT verdict", roles: [KittingLead], code: 200, input: [], output: RetailReadyAudit, side_effects: [] }
  - { method: POST, path: "/plant/retail-audits/{auditId}/certify", description: "SUBMITTED -> CERTIFIED (brand certifies retail compliance)", roles: [BrandQuality], code: 200, input: [], output: RetailReadyAudit, side_effects: [] }
  - { method: POST, path: "/plant/retail-audits/{auditId}/reject", description: "SUBMITTED -> REJECTED", roles: [BrandQuality], code: 200, input: [], output: RetailReadyAudit, side_effects: [] }
  - { method: POST, path: "/plant/retail-audits/{auditId}/revise", description: "REJECTED -> DRAFT with new case/pallet inputs; verdict recomputed", roles: [KittingLead], code: 200, input: [orientation, case_w_cin, case_h_cin, case_d_cin, case_weight_g, cases_per_layer, layers, case_count], output: RetailReadyAudit, side_effects: ["retail_compliance_verdict recomputed"] }

  # --- Invoice ---
  - { method: POST, path: "/plant/invoices", description: "Create DRAFT invoice (PROVISIONAL variant) for a job", roles: [BillingClerk], code: 201, input: [job_id], output: Invoice, side_effects: ["provisional_quote lines snapshotted"] }
  - { method: GET, path: "/plant/invoices", description: "List invoices", roles: [PlantAdmin, StructuralDesigner, PressOperator, FinishingOperator, KittingLead, BrandQuality, BillingClerk], code: 200, input: ["job_id?", "status?"], output: "Invoice[]", side_effects: [] }
  - { method: GET, path: "/plant/invoices/{invoiceId}", description: "Get invoice", roles: [PlantAdmin, StructuralDesigner, PressOperator, FinishingOperator, KittingLead, BrandQuality, BillingClerk], code: 200, input: [], output: Invoice, side_effects: [] }
  - { method: POST, path: "/plant/invoices/{invoiceId}/finalize", description: "DRAFT -> FINALIZED; recomputes with actuals and applies minimum & make-ready recovery", roles: [BillingClerk], code: 200, input: [], output: Invoice, side_effects: ["final_settlement", "minimum_makeready_recovery"] }
  - { method: POST, path: "/plant/invoices/{invoiceId}/void", description: "FINALIZED -> VOIDED; releases the one-open-invoice constraint", roles: [BillingClerk], code: 200, input: [], output: Invoice, side_effects: [] }
  - { method: POST, path: "/plant/invoices/{invoiceId}/settle", description: "FINALIZED -> SETTLED", roles: [BillingClerk], code: 200, input: [], output: Invoice, side_effects: [] }

  # --- Logical clock (test-driving) ---
  - { method: POST, path: "/plant/_clock/set_current_utc", description: "Set the plant logical clock. Server startup default (before any set call) is exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time.", roles: [PlantAdmin], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: ["logical clock <- to_iso8601"] }

# =============================================================================
# §1.6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role missing/unrecognized" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_CUSTOMER_OWNERSHIP_MISMATCH, http: 403, condition: "BrandQuality X-User-ID does not equal the customer_id of the acted-on resource" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK reference does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, unknown enum member, non-positive integer, sheets_good > sheets_printed, kits_completed > kits_planned, empty components" }
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "Resource not in a state from which the requested transition/action is defined" }
  - { id: ERR_STALE_JOB_VERSION, http: 412, condition: "expected_job_version does not match the job's current version (OCC)" }
  - { id: ERR_CUSTOMER_INACTIVE, http: 409, condition: "Job creation for a SUSPENDED customer" }
  - { id: ERR_DESIGN_NOT_APPROVED, http: 409, condition: "mark-press-ready without a BRAND_APPROVED design revision" }
  - { id: ERR_REVISION_SUPERSEDED, http: 409, condition: "Imposition plan creation against a SUPERSEDED design revision" }
  - { id: ERR_REVISION_JOB_MISMATCH, http: 409, condition: "design_revision_id belongs to a different job than job_id" }
  - { id: ERR_PLAN_NOT_LOCKED, http: 409, condition: "mark-press-ready without a LOCKED imposition plan" }
  - { id: ERR_LAYOUT_IMPOSSIBLE, http: 409, condition: "Blank does not fit the sheet in any permitted orientation (ups == 0)" }
  - { id: ERR_COLOR_STANDARD_MISSING, http: 409, condition: "A required ink slot lacks an ACTIVE color standard at mark-press-ready" }
  - { id: ERR_COLOR_STANDARD_NOT_ACTIVE, http: 409, condition: "Press approval references a standard not in ACTIVE status" }
  - { id: ERR_INK_SLOT_MISMATCH, http: 409, condition: "Approval ink_slot differs from the standard's ink_slot or is not required by the job; or standard belongs to another customer" }
  - { id: ERR_PRESS_APPROVAL_MISSING, http: 409, condition: "start-production without an APPROVED approval (pinned to an ACTIVE standard) for every required ink slot" }
  - { id: ERR_DELTA_E_EXCEEDED, http: 409, condition: "measured_delta_e_milli > standard.tolerance_delta_e_milli on approve" }
  - { id: ERR_NO_PRESS_BOOKING, http: 409, condition: "start-production without any SCHEDULED press booking" }
  - { id: ERR_OPEN_PRESS_BOOKINGS, http: 409, condition: "complete-press while a booking is still SCHEDULED" }
  - { id: ERR_SHORT_COUNT, http: 409, condition: "complete-press with good_cartons_actual < quantity_ordered" }
  - { id: ERR_FINISHING_INCOMPLETE, http: 409, condition: "complete-finishing while a flagged operation lacks a COMPLETED booking" }
  - { id: ERR_OPEN_KIT_ORDERS, http: 409, condition: "job complete with PLANNED or IN_PROGRESS kit orders" }
  - { id: ERR_RRP_NOT_CERTIFIED, http: 409, condition: "job complete with requires_retail_compliance but no CERTIFIED audit" }
  - { id: ERR_AUDIT_NON_COMPLIANT, http: 409, condition: "submit of an audit whose verdict is NON_COMPLIANT" }
  - { id: ERR_KIT_QTY_EXCEEDS_REMAINING, http: 409, condition: "allocated cartons requested exceed job.available_cartons" }
  - { id: ERR_PRESS_TYPE_MISMATCH, http: 409, condition: "Booking a DIGITAL job on an OFFSET press or vice versa" }
  - { id: ERR_PRESS_UNAVAILABLE, http: 409, condition: "Booking on a DOWN press" }
  - { id: ERR_LINE_UNAVAILABLE, http: 409, condition: "Booking on a DOWN finishing line" }
  - { id: ERR_PRESS_WINDOW_CONFLICT, http: 409, condition: "Half-open window [start,end) intersects a non-CANCELLED booking on the same press; touching endpoints allowed" }
  - { id: ERR_FINISHING_WINDOW_CONFLICT, http: 409, condition: "Padded closed window [start-buffer, end] intersects a non-CANCELLED booking's padded window on the same line" }
  - { id: ERR_WINDOW_IN_PAST, http: 409, condition: "Booking start_utc earlier than the logical clock" }
  - { id: ERR_OPERATION_NOT_REQUIRED, http: 409, condition: "Booking an operation the job's finish flags do not require" }
  - { id: ERR_OPERATION_UNSUPPORTED, http: 409, condition: "Finishing line does not support the requested operation" }
  - { id: ERR_OPERATION_ALREADY_BOOKED, http: 409, condition: "A non-CANCELLED booking for the same (job_id, operation) already exists" }
  - { id: ERR_SHEET_EXCEEDS_CAPACITY, http: 409, condition: "planned_sheets > press.max_sheets_per_booking, or sheet dims exceed press max dims" }
  - { id: ERR_INSUFFICIENT_BOARD_STOCK, http: 409, condition: "No stock covers the reservation, or over-print excess exceeds available sheets" }
  - { id: ERR_INVOICE_ALREADY_OPEN, http: 409, condition: "A non-VOIDED invoice already exists for the job" }
  - { id: ERR_JOB_NOT_COMPLETE, http: 409, condition: "Invoice finalize while job is not COMPLETE" }

# =============================================================================
# §1.7: RBAC Matrix
# =============================================================================
roles:
  - name: PlantAdmin
    description: "Plant superintendent: master data (customers, standards drafts, presses, lines, board stock), job creation and lifecycle admin, logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /plant/customers, /plant/customers/{id}/set-status"
      - "POST /plant/color-standards, /plant/color-standards/{id}/submit"
      - "POST /plant/jobs, /plant/jobs/{id}/start-engineering, /plant/jobs/{id}/complete, /plant/jobs/{id}/cancel"
      - "POST /plant/presses, /plant/presses/{id}/set-status"
      - "POST /plant/finishing-lines, /plant/finishing-lines/{id}/set-status"
      - "POST /plant/board-stocks, /plant/board-stocks/{id}/receive"
      - "POST /plant/_clock/set_current_utc"
    shared_operations: ["all GET endpoints"]
  - name: StructuralDesigner
    description: "Structural/CAD engineer: design revisions, samples, imposition plans, press-ready gating"
    identity: opaque
    exclusive_operations:
      - "POST /plant/design-revisions, /plant/design-revisions/{id}/make-sample"
      - "POST /plant/imposition-plans, /plant/imposition-plans/{id}/lock, /plant/imposition-plans/{id}/supersede"
      - "POST /plant/jobs/{id}/mark-press-ready"
    shared_operations: ["all GET endpoints"]
  - name: PressOperator
    description: "Pressroom operator: press bookings, sheet reporting, press-approval submissions"
    identity: opaque
    exclusive_operations:
      - "POST /plant/press-bookings, /plant/press-bookings/{id}/complete, /plant/press-bookings/{id}/cancel"
      - "POST /plant/press-approvals, /plant/press-approvals/{id}/resubmit"
      - "POST /plant/jobs/{id}/start-production, /plant/jobs/{id}/complete-press"
    shared_operations: ["all GET endpoints"]
  - name: FinishingOperator
    description: "Finishing department: coating/foil/emboss bookings and finishing completion"
    identity: opaque
    exclusive_operations:
      - "POST /plant/finishing-bookings, /plant/finishing-bookings/{id}/complete, /plant/finishing-bookings/{id}/cancel"
      - "POST /plant/jobs/{id}/complete-finishing"
    shared_operations: ["all GET endpoints"]
  - name: KittingLead
    description: "Kitting & assembly lead: kit orders and retail-ready audits"
    identity: opaque
    exclusive_operations:
      - "POST /plant/kit-orders, /plant/kit-orders/{id}/start, /plant/kit-orders/{id}/complete, /plant/kit-orders/{id}/cancel"
      - "POST /plant/retail-audits, /plant/retail-audits/{id}/submit, /plant/retail-audits/{id}/revise"
    shared_operations: ["all GET endpoints"]
  - name: BrandQuality
    description: "Brand-owner quality approver; X-User-ID equals the Customer.id whose work is being approved"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /plant/color-standards/{id}/approve"
      - "POST /plant/design-revisions/{id}/brand-accept, /plant/design-revisions/{id}/brand-reject"
      - "POST /plant/press-approvals/{id}/approve, /plant/press-approvals/{id}/reject"
      - "POST /plant/retail-audits/{id}/certify, /plant/retail-audits/{id}/reject"
    shared_operations: ["all GET endpoints"]
  - name: BillingClerk
    description: "Commercial billing: invoice lifecycle"
    identity: opaque
    exclusive_operations:
      - "POST /plant/invoices, /plant/invoices/{id}/finalize, /plant/invoices/{id}/void, /plant/invoices/{id}/settle"
    shared_operations: ["all GET endpoints"]
