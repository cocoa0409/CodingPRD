  - rule_id: transitive_cascade
    instances:
      - name: mastery_to_graduation_cascade
        grounds:
          - state_machines.AssessmentAttempt.UNDER_REVIEW_to_SCORED_MASTERED
          - state_machines.Student.ACTIVE_to_GRADUATED
          - state_machines.MentorAssignment.ACTIVE_to_ENDED
          - state_machines.SubscriptionTerm.ACTIVE_to_COMPLETED
          - entities.Mentor.fields.current_caseload
          - calculations.credit_hour_equivalency
        distinguishing_aspect: |
          Depth-4 cascade whose TRIGGERING TRANSITION is AssessmentAttempt
          UNDER_REVIEW -> SCORED_MASTERED (a scoring write by an Evaluator).
          hop 1 the attempt masters; hop 2 fires ONLY because hop 1 changed the
          attempt's contribution, raising Student.mastered_unit_total to 8;
          hop 3 fires ONLY because hop 2 made mastered_unit_total reach
          Program.required_unit_total, so enrollment_status goes GRADUATED;
          hop 4 fires ONLY because hop 3 graduated the student, ending the
          MentorAssignment (decrementing Mentor.current_caseload to 0) and closing
          the ACTIVE term COMPLETED. Nothing in the scoring request mentions the
          mentor, the term or graduation.
        test_recipe:
          setup:
            - "logical clock at 2026-09-01T00:00:00.000Z"
            - "PUBLISHED program with required_unit_total 8 and units_per_credit_hour 3.0"
            - "competencies FC-1 and FC-2, each worth 4 units with a single-reader 1.0000-weight 100-point blueprint"
            - "ACTIVE student with an ACTIVE term covering 2026-09-01 to 2026-12-01 and tuition 375000"
            - "mentor with max_caseload 5 and cadence_days 7, holding one ACTIVE assignment for this student, so current_caseload is 1"
            - "FC-1 already mastered at 90.00, so mastered_unit_total is 4 of the 8 required"
