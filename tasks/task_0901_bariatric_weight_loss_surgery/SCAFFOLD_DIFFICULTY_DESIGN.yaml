# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 Difficulty Rules x 2 instances = 18 instances. Every ground resolves to §1.1-§1.7.
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: weight_loss_outcome_ewl_ibw_vs_bmi25
        grounds:
          - calculations.weight_loss_outcome
          - entities.FollowUpVisit.fields.ewl_pct_ibw
          - entities.FollowUpVisit.fields.ewl_pct_bmi25
          - state_machines.FollowUpVisit.SCHEDULED_to_COMPLETED
        distinguishing_aspect: "Same recorded weight yields ewl_pct_ibw=34.2 (denominator baseline-IBW) but ewl_pct_bmi25=41.9 (denominator baseline-BMI25 weight) on a FollowUpVisit — patient-outcome entity domain."
        test_recipe:
          setup:
            - "SELF_PAY program for a FEMALE patient, height 170cm, baseline weight 120kg (baseline_bmi 41.5, ideal_body_weight 61.437), cleared and surgery completed so the follow-up series exists; program in POST_OP."
          setup_api_calls:
            - call: "POST /patients"
              payload: { mrn: "M-EWL-1", full_name: "Ewl One", date_of_birth: "1985-04-01", sex: "FEMALE", height_cm: 170, baseline_weight_kg: 120 }
              as: ProgramCoordinator
              captures: { pid: $.data.id }
            - call: "POST /programs"
              payload: { patient_id: "${pid}", payment_pathway: "SELF_PAY", comorbidities: [] }
              as: ProgramCoordinator
              captures: { prog: $.data.id }
            - call: "POST /programs/${prog}/candidacy-review"
              payload: {}
              as: ProgramCoordinator
            - call: "POST /programs/${prog}/request-clearance"
              payload: {}
              as: ProgramCoordinator
            - call: "POST /programs/${prog}/psych-evaluations"
              payload: {}
              as: BehavioralHealthClinician
              captures: { pe: $.data.id }
            - call: "POST /psych-evaluations/${pe}/decision"
              payload: { decision: "CLEARED" }
              as: BehavioralHealthClinician
            - call: "POST /programs/${prog}/nutrition-clearances"
              payload: { decision: "CLEARED", diet_readiness_score: 80 }
              as: Dietitian
            - call: "POST /programs/${prog}/milestones"
              payload: { milestone_code: "NUTRITION_CLASS", completed: true }
              as: ProgramCoordinator
            - call: "POST /programs/${prog}/milestones"
              payload: { milestone_code: "EXERCISE_ORIENTATION", completed: true }
              as: ProgramCoordinator
            - call: "POST /programs/${prog}/milestones"
              payload: { milestone_code: "SURGERY_RISKS_CONSENT", completed: true }
              as: ProgramCoordinator
            - call: "POST /programs/${prog}/milestones"
              payload: { milestone_code: "POST_OP_DIET_EDUCATION", completed: true }
              as: ProgramCoordinator
            - call: "POST /programs/${prog}/finalize-clearance"
              payload: {}
              as: ProgramCoordinator
              captures: { pv: $.data.version }
            - call: "POST /surgeons"
              payload: { full_name: "Dr Sleeve", npi: "1000000001", credentialed_procedures: ["SLEEVE_GASTRECTOMY"] }
              as: SystemAdmin
              captures: { surg: $.data.id }
            - call: "POST /operating-rooms"
              payload: { room_code: "OR-1", turnover_buffer_minutes: 30 }
              as: SystemAdmin
              captures: { room: $.data.id }
            - call: "POST /programs/${prog}/surgery-cases"
              payload: { operating_room_id: "${room}", surgeon_id: "${surg}", procedure_type: "SLEEVE_GASTRECTOMY", scheduled_start: "2026-06-15T08:00:00Z", scheduled_end: "2026-06-15T09:30:00Z", expected_program_version: "${pv}" }
              as: ProgramCoordinator
              captures: { case: $.data.id }
            - call: "POST /surgery-cases/${case}/complete"
              payload: { actual_or_minutes: 120 }
              as: Surgeon
              as_user_id: "${surg}"
            - call: "GET /programs/${prog}/follow-up-visits"
              payload: {}
              as: ProgramCoordinator
              captures: { fv: "$.data[0].id" }
          trigger:
            - call: "POST /follow-up-visits/${fv}/record"
              payload: { recorded_weight_kg: 100 }
              as: Dietitian
              captures: { ewl_ibw: $.data.ewl_pct_ibw, ewl_b25: $.data.ewl_pct_bmi25 }
          assert:
            - "FollowUpVisit.${fv}.ewl_pct_ibw == 34.2"
            - "FollowUpVisit.${fv}.ewl_pct_bmi25 == 41.9"
            - "FollowUpVisit.${fv}.ewl_pct_ibw != FollowUpVisit.${fv}.ewl_pct_bmi25"

      - name: case_bundle_estimate_vs_final
        grounds:
          - calculations.case_bundle_price
          - entities.SurgeryCase.fields.estimated_bundle_cents
          - entities.SurgeryCase.fields.final_bundle_cents
          - state_machines.SurgeryCase.SCHEDULED_to_COMPLETED
        distinguishing_aspect: "Same SLEEVE case at bmi 41.5 yields estimated_bundle_cents=1944000 at scheduling but final_bundle_cents=2694000 after completion with 120 actual OR minutes (30 over the 90 standard) — cost-accounting entity domain (SurgeryCase), distinct from the %EWL patient-outcome variant."
        test_recipe:
          setup:
            - "SELF_PAY female 170cm/120kg program cleared; a surgeon credentialed SLEEVE_GASTRECTOMY and an OPEN OR room exist."
          setup_api_calls:
            - call: "POST /patients"
              payload: { mrn: "M-BND-1", full_name: "Bundle One", date_of_birth: "1984-03-02", sex: "FEMALE", height_cm: 170, baseline_weight_kg: 120 }
              as: ProgramCoordinator
              captures: { pid: $.data.id }
            - call: "POST /programs"
              payload: { patient_id: "${pid}", payment_pathway: "SELF_PAY", comorbidities: [] }
              as: ProgramCoordinator
              captures: { prog: $.data.id }
            - call: "POST /programs/${prog}/candidacy-review"
              payload: {}
              as: ProgramCoordinator
            - call: "POST /programs/${prog}/request-clearance"
              payload: {}
              as: ProgramCoordinator
            - call: "POST /programs/${prog}/psych-evaluations"
              payload: {}
              as: BehavioralHealthClinician
              captures: { pe: $.data.id }
            - call: "POST /psych-evaluations/${pe}/decision"
              payload: { decision: "CLEARED" }
              as: BehavioralHealthClinician
            - call: "POST /programs/${prog}/nutrition-clearances"
              payload: { decision: "CLEARED", diet_readiness_score: 85 }
              as: Dietitian
            - call: "POST /programs/${prog}/milestones"
              payload: { milestone_code: "NUTRITION_CLASS", completed: true }
              as: ProgramCoordinator
            - call: "POST /programs/${prog}/milestones"
              payload: { milestone_code: "EXERCISE_ORIENTATION", completed: true }
              as: ProgramCoordinator
            - call: "POST /programs/${prog}/milestones"
              payload: { milestone_code: "SURGERY_RISKS_CONSENT", completed: true }
              as: ProgramCoordinator
            - call: "POST /programs/${prog}/milestones"
              payload: { milestone_code: "POST_OP_DIET_EDUCATION", completed: true }
              as: ProgramCoordinator
            - call: "POST /programs/${prog}/finalize-clearance"
              payload: {}
              as: ProgramCoordinator
              captures: { pv: $.data.version }
            - call: "POST /surgeons"
              payload: { full_name: "Dr Bundle", npi: "1000000002", credentialed_procedures: ["SLEEVE_GASTRECTOMY"] }
              as: SystemAdmin
              captures: { surg: $.data.id }
            - call: "POST /operating-rooms"
              payload: { room_code: "OR-2", turnover_buffer_minutes: 30 }
              as: SystemAdmin
              captures: { room: $.data.id }
            - call: "POST /programs/${prog}/surgery-cases"
              payload: { operating_room_id: "${room}", surgeon_id: "${surg}", procedure_type: "SLEEVE_GASTRECTOMY", scheduled_start: "2026-06-15T08:00:00Z", scheduled_end: "2026-06-15T09:30:00Z", expected_program_version: "${pv}" }
              as: ProgramCoordinator
              captures: { case: $.data.id, est: $.data.estimated_bundle_cents }
          trigger:
            - call: "POST /surgery-cases/${case}/complete"
              payload: { actual_or_minutes: 120 }
              as: Surgeon
              as_user_id: "${surg}"
              captures: { fin: $.data.final_bundle_cents }
          assert:
            - "SurgeryCase.${case}.estimated_bundle_cents == 1944000"
            - "SurgeryCase.${case}.final_bundle_cents == 2694000"
            - "SurgeryCase.${case}.final_bundle_cents != SurgeryCase.${case}.estimated_bundle_cents"

  - rule_id: combinatorial_formula
    instances:
      - name: candidacy_bmi35_comorbidity_tier_selection
        grounds:
          - calculations.candidacy_determination
          - entities.Program.fields.candidacy_status
          - entities.Program.fields.qualifying_reason
          - state_machines.Program.CANDIDACY_REVIEW_to_ELIGIBLE
        distinguishing_aspect: "Mode (a): three inputs (baseline_bmi=35.0, comorbidity set {TYPE_2_DIABETES}, plan floor pair 40/35) select the BMI_35_PLUS_COMORBIDITY tier — non-linear conditional branch, not a single-input threshold."
        test_recipe:
          setup:
            - "SELF_PAY program, FEMALE 170cm / 101.15kg (baseline_bmi exactly 35.0) with TYPE_2_DIABETES comorbidity."
          setup_api_calls:
            - call: "POST /patients"
              payload: { mrn: "M-C35-1", full_name: "Cand ThirtyFive", date_of_birth: "1980-01-01", sex: "FEMALE", height_cm: 170, baseline_weight_kg: 101.15 }
              as: ProgramCoordinator
              captures: { pid: $.data.id }
            - call: "POST /programs"
              payload: { patient_id: "${pid}", payment_pathway: "SELF_PAY", comorbidities: ["TYPE_2_DIABETES"] }
              as: ProgramCoordinator
              captures: { prog: $.data.id, bmi: $.data.baseline_bmi }
          trigger:
            - call: "POST /programs/${prog}/candidacy-review"
              payload: {}
              as: ProgramCoordinator
              captures: { cs: $.data.candidacy_status, qr: $.data.qualifying_reason }
          assert:
            - "Program.${prog}.baseline_bmi == 35.0"
            - "Program.${prog}.candidacy_status == QUALIFIED"
            - "Program.${prog}.qualifying_reason == BMI_35_PLUS_COMORBIDITY"
            - "Program.${prog}.status == ELIGIBLE"

      - name: financing_schedule_round_then_split
        grounds:
          - calculations.financing_schedule
          - entities.FinancingPlan.fields.interest_cents
          - entities.FinancingPlan.fields.installment_cents
          - entities.FinancingPlan.fields.final_installment_cents
        distinguishing_aspect: "Mode (b): interest is rounded ONCE on the whole principal (185280) then the financed total 1729280 is split with floor per-installment (144106 x11) and the remainder waterfalled into final_installment (144114) — a different rounding-order axis than the candidacy tier branch."
        test_recipe:
          setup:
            - "SELF_PAY female 170/120 (baseline_bmi 41.5, SLEEVE bundle 1944000) program CLEARED."
          setup_api_calls:
            - call: "POST /patients"
              payload: { mrn: "M-FIN-1", full_name: "Fin One", date_of_birth: "1983-05-06", sex: "FEMALE", height_cm: 170, baseline_weight_kg: 120 }
              as: ProgramCoordinator
              captures: { pid: $.data.id }
            - call: "POST /programs"
              payload: { patient_id: "${pid}", payment_pathway: "SELF_PAY", comorbidities: [] }
              as: ProgramCoordinator
              captures: { prog: $.data.id }
            - call: "POST /programs/${prog}/candidacy-review"
              payload: {}
              as: ProgramCoordinator
            - call: "POST /programs/${prog}/request-clearance"
              payload: {}
              as: ProgramCoordinator
            - call: "POST /programs/${prog}/psych-evaluations"
              payload: {}
              as: BehavioralHealthClinician
              captures: { pe: $.data.id }
            - call: "POST /psych-evaluations/${pe}/decision"
              payload: { decision: "CLEARED" }
              as: BehavioralHealthClinician
            - call: "POST /programs/${prog}/nutrition-clearances"
              payload: { decision: "CLEARED", diet_readiness_score: 90 }
              as: Dietitian
            - call: "POST /programs/${prog}/milestones"
              payload: { milestone_code: "NUTRITION_CLASS", completed: true }
              as: ProgramCoordinator
            - call: "POST /programs/${prog}/milestones"
              payload: { milestone_code: "EXERCISE_ORIENTATION", completed: true }
              as: ProgramCoordinator
            - call: "POST /programs/${prog}/milestones"
              payload: { milestone_code: "SURGERY_RISKS_CONSENT", completed: true }
              as: ProgramCoordinator
            - call: "POST /programs/${prog}/milestones"
              payload: { milestone_code: "POST_OP_DIET_EDUCATION", completed: true }
              as: ProgramCoordinator
            - call: "POST /programs/${prog}/finalize-clearance"
              payload: {}
              as: ProgramCoordinator
              captures: { pv: $.data.version }
          trigger:
            - call: "POST /programs/${prog}/financing-plan"
              payload: { procedure_type: "SLEEVE_GASTRECTOMY", down_payment_cents: 400000, term_months: 12, apr_bps: 1200, expected_program_version: "${pv}" }
              as: BillingSpecialist
              captures: { fpid: $.data.id }
          assert:
            - "FinancingPlan.${fpid}.bundle_price_cents == 1944000"
            - "FinancingPlan.${fpid}.interest_cents == 185280"
            - "FinancingPlan.${fpid}.installment_cents == 144106"
            - "FinancingPlan.${fpid}.final_installment_cents == 144114"

  - rule_id: non_linear_state_machine
    instances:
      - name: psych_defer_then_reevaluate_cycle
        grounds:
          - state_machines.PsychEvaluation.PENDING_to_DEFERRED
          - state_machines.PsychEvaluation.DEFERRED_to_PENDING
          - entities.PsychEvaluation.fields.reevaluation_count
        distinguishing_aspect: "PsychEvaluation cycles DEFERRED->PENDING (reevaluate), a genuine A->B->A loop on the PsychEvaluation entity; reevaluation_count increments to 1 and status returns to PENDING."
        test_recipe:
          setup:
            - "SELF_PAY program in CLEARANCE_IN_PROGRESS with one PENDING psych evaluation."
          setup_api_calls:
            - call: "POST /patients"
              payload: { mrn: "M-PSY-1", full_name: "Psy One", date_of_birth: "1979-02-02", sex: "MALE", height_cm: 175, baseline_weight_kg: 130 }
              as: ProgramCoordinator
              captures: { pid: $.data.id }
            - call: "POST /programs"
              payload: { patient_id: "${pid}", payment_pathway: "SELF_PAY", comorbidities: [] }
              as: ProgramCoordinator
              captures: { prog: $.data.id }
            - call: "POST /programs/${prog}/candidacy-review"
              payload: {}
              as: ProgramCoordinator
            - call: "POST /programs/${prog}/request-clearance"
              payload: {}
              as: ProgramCoordinator
            - call: "POST /programs/${prog}/psych-evaluations"
              payload: {}
              as: BehavioralHealthClinician
              captures: { pe: $.data.id }
            - call: "POST /psych-evaluations/${pe}/decision"
              payload: { decision: "DEFERRED", deferral_reason: "needs 8 weeks therapy" }
              as: BehavioralHealthClinician
          trigger:
            - call: "POST /psych-evaluations/${pe}/reevaluate"
              payload: {}
              as: BehavioralHealthClinician
              captures: { st: $.data.status, rc: $.data.reevaluation_count }
          assert:
            - "PsychEvaluation.${pe}.status == PENDING"
            - "PsychEvaluation.${pe}.reevaluation_count == 1"
            - "PsychEvaluation.${pe}.deferral_reason == null"

      - name: program_postop_readmit_postop_cycle
        grounds:
          - state_machines.Program.POST_OP_to_READMITTED
          - state_machines.Program.READMITTED_to_POST_OP
          - entities.Program.fields.readmission_count
          - entities.Program.fields.active_complication_count
        distinguishing_aspect: "Program cycles POST_OP->READMITTED->POST_OP (a different entity than PsychEvaluation); readmission_count stays 1 while active_complication_count returns to 0 after resolve."
        test_recipe:
          setup:
            - "SELF_PAY female 170/120 program with a COMPLETED surgery (program POST_OP), then a readmission-triggering OPEN complication."
          setup_api_calls:
            - call: "POST /patients"
              payload: { mrn: "M-RDM-1", full_name: "Readmit One", date_of_birth: "1982-06-06", sex: "FEMALE", height_cm: 170, baseline_weight_kg: 120 }
              as: ProgramCoordinator
              captures: { pid: $.data.id }
            - call: "POST /programs"
              payload: { patient_id: "${pid}", payment_pathway: "SELF_PAY", comorbidities: [] }
              as: ProgramCoordinator
              captures: { prog: $.data.id }
            - call: "POST /programs/${prog}/candidacy-review"
              payload: {}
              as: ProgramCoordinator
            - call: "POST /programs/${prog}/request-clearance"
              payload: {}
              as: ProgramCoordinator
            - call: "POST /programs/${prog}/psych-evaluations"
              payload: {}
              as: BehavioralHealthClinician
              captures: { pe: $.data.id }
            - call: "POST /psych-evaluations/${pe}/decision"
              payload: { decision: "CLEARED" }
              as: BehavioralHealthClinician
            - call: "POST /programs/${prog}/nutrition-clearances"
              payload: { decision: "CLEARED", diet_readiness_score: 88 }
              as: Dietitian
            - call: "POST /programs/${prog}/milestones"
              payload: { milestone_code: "NUTRITION_CLASS", completed: true }
              as: ProgramCoordinator
            - call: "POST /programs/${prog}/milestones"
              payload: { milestone_code: "EXERCISE_ORIENTATION", completed: true }
              as: ProgramCoordinator
            - call: "POST /programs/${prog}/milestones"
              payload: { milestone_code: "SURGERY_RISKS_CONSENT", completed: true }
              as: ProgramCoordinator
            - call: "POST /programs/${prog}/milestones"
              payload: { milestone_code: "POST_OP_DIET_EDUCATION", completed: true }
              as: ProgramCoordinator
            - call: "POST /programs/${prog}/finalize-clearance"
              payload: {}
              as: ProgramCoordinator
              captures: { pv: $.data.version }
            - call: "POST /surgeons"
              payload: { full_name: "Dr Readmit", npi: "1000000003", credentialed_procedures: ["SLEEVE_GASTRECTOMY"] }
              as: SystemAdmin
              captures: { surg: $.data.id }
            - call: "POST /operating-rooms"
              payload: { room_code: "OR-3", turnover_buffer_minutes: 30 }
              as: SystemAdmin
              captures: { room: $.data.id }
            - call: "POST /programs/${prog}/surgery-cases"
              payload: { operating_room_id: "${room}", surgeon_id: "${surg}", procedure_type: "SLEEVE_GASTRECTOMY", scheduled_start: "2026-06-15T08:00:00Z", scheduled_end: "2026-06-15T09:30:00Z", expected_program_version: "${pv}" }
              as: ProgramCoordinator
              captures: { case: $.data.id }
            - call: "POST /surgery-cases/${case}/complete"
              payload: { actual_or_minutes: 95 }
              as: Surgeon
              as_user_id: "${surg}"
            - call: "POST /surgery-cases/${case}/complications"
              payload: { complication_type: "LEAK", severity: "SEVERE", requires_readmission: true, onset_date: "2026-06-16" }
              as: Surgeon
              as_user_id: "${surg}"
              captures: { comp: $.data.id }
          trigger:
            - call: "POST /complications/${comp}/resolve"
              payload: {}
              as: Surgeon
              as_user_id: "${surg}"
          assert:
            - "Program.${prog}.status == POST_OP"
            - "Program.${prog}.readmission_count == 1"
            - "Program.${prog}.active_complication_count == 0"
            - "Complication.${comp}.status == RESOLVED"

  - rule_id: transitive_cascade
    instances:
      - name: surgery_complete_generates_followup_series_cascade
        grounds:
          - state_machines.SurgeryCase.SCHEDULED_to_COMPLETED
          - state_machines.Program.SURGERY_SCHEDULED_to_POST_OP
          - entities.FollowUpVisit.fields.interval_code
          - entities.Program.fields.status
        distinguishing_aspect: "Depth-3 chain from surgery completion: (1) SurgeryCase->COMPLETED causes (2) Program SURGERY_SCHEDULED->POST_OP, which causes (3) generation of the 5-visit FollowUpVisit series (WEEK_2..MONTH_12); each hop is caused by the prior, not by the trigger directly."
        test_recipe:
          setup:
            - "SELF_PAY female 170/120 program CLEARED with a SCHEDULED SLEEVE surgery case owned by a credentialed surgeon."
          setup_api_calls:
            - call: "POST /patients"
              payload: { mrn: "M-CAS-1", full_name: "Cascade One", date_of_birth: "1981-07-07", sex: "FEMALE", height_cm: 170, baseline_weight_kg: 120 }
              as: ProgramCoordinator
              captures: { pid: $.data.id }
            - call: "POST /programs"
              payload: { patient_id: "${pid}", payment_pathway: "SELF_PAY", comorbidities: [] }
              as: ProgramCoordinator
              captures: { prog: $.data.id }
            - call: "POST /programs/${prog}/candidacy-review"
              payload: {}
              as: ProgramCoordinator
            - call: "POST /programs/${prog}/request-clearance"
              payload: {}
              as: ProgramCoordinator
            - call: "POST /programs/${prog}/psych-evaluations"
              payload: {}
              as: BehavioralHealthClinician
              captures: { pe: $.data.id }
            - call: "POST /psych-evaluations/${pe}/decision"
              payload: { decision: "CLEARED" }
              as: BehavioralHealthClinician
            - call: "POST /programs/${prog}/nutrition-clearances"
              payload: { decision: "CLEARED", diet_readiness_score: 82 }
              as: Dietitian
            - call: "POST /programs/${prog}/milestones"
              payload: { milestone_code: "NUTRITION_CLASS", completed: true }
              as: ProgramCoordinator
            - call: "POST /programs/${prog}/milestones"
              payload: { milestone_code: "EXERCISE_ORIENTATION", completed: true }
              as: ProgramCoordinator
            - call: "POST /programs/${prog}/milestones"
              payload: { milestone_code: "SURGERY_RISKS_CONSENT", completed: true }
              as: ProgramCoordinator
            - call: "POST /programs/${prog}/milestones"
              payload: { milestone_code: "POST_OP_DIET_EDUCATION", completed: true }
              as: ProgramCoordinator
            - call: "POST /programs/${prog}/finalize-clearance"
              payload: {}
              as: ProgramCoordinator
              captures: { pv: $.data.version }
            - call: "POST /surgeons"
              payload: { full_name: "Dr Cascade", npi: "1000000004", credentialed_procedures: ["SLEEVE_GASTRECTOMY"] }
              as: SystemAdmin
              captures: { surg: $.data.id }
            - call: "POST /operating-rooms"
              payload: { room_code: "OR-4", turnover_buffer_minutes: 30 }
              as: SystemAdmin
              captures: { room: $.data.id }
            - call: "POST /programs/${prog}/surgery-cases"
              payload: { operating_room_id: "${room}", surgeon_id: "${surg}", procedure_type: "SLEEVE_GASTRECTOMY", scheduled_start: "2026-06-15T08:00:00Z", scheduled_end: "2026-06-15T09:30:00Z", expected_program_version: "${pv}" }
              as: ProgramCoordinator
              captures: { case: $.data.id }
          trigger:
            - call: "POST /surgery-cases/${case}/complete"
              payload: { actual_or_minutes: 95 }
              as: Surgeon
              as_user_id: "${surg}"
            - call: "GET /programs/${prog}/follow-up-visits"
              payload: {}
              as: ProgramCoordinator
          assert:
            - "Program.${prog}.status == POST_OP"
            - "GET /programs/${prog}/follow-up-visits returns exactly 5 FollowUpVisit rows with interval_code set {WEEK_2, WEEK_6, MONTH_3, MONTH_6, MONTH_12}"
            - "SurgeryCase.${case}.status == COMPLETED"

      - name: complication_readmission_cascade
        grounds:
          - state_machines.Complication.OPEN
          - state_machines.Program.POST_OP_to_READMITTED
          - entities.Program.fields.readmission_count
          - entities.Program.fields.active_complication_count
        distinguishing_aspect: "Depth-2 chain from a DIFFERENT trigger (logging a complication, not surgery completion): (1) Complication created OPEN with requires_readmission causes (2) Program POST_OP->READMITTED with readmission_count 1 and active_complication_count 1."
        test_recipe:
          setup:
            - "SELF_PAY female 170/120 program with a COMPLETED surgery; program in POST_OP."
          setup_api_calls:
            - call: "POST /patients"
              payload: { mrn: "M-CMP-1", full_name: "Comp One", date_of_birth: "1980-08-08", sex: "FEMALE", height_cm: 170, baseline_weight_kg: 120 }
              as: ProgramCoordinator
              captures: { pid: $.data.id }
            - call: "POST /programs"
              payload: { patient_id: "${pid}", payment_pathway: "SELF_PAY", comorbidities: [] }
              as: ProgramCoordinator
              captures: { prog: $.data.id }
            - call: "POST /programs/${prog}/candidacy-review"
