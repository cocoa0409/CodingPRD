            - "the NETWORKED attempt returns HTTP 201 and ShareholderAccount.${acc_net}.account_channel == NETWORKED"
            - "GET /shareholder-accounts with account_channel DIRECT returns total_count 0"

      - name: as_of_approval_by_the_capturing_officer_is_rejected_for_segregation_of_duties
        claim_type: segregation_of_duties
        grounds:
          - "validations[priority=90]"
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - state_machines.Trade.PENDING_AS_OF_APPROVAL_to_RECEIVED
          - entities.Trade.fields.captured_by_user_id
        distinguishing_aspect: "The approver is compared against captured_by_user_id: officer co-1 who captured the as-of order is refused with 403 ERR_SEGREGATION_OF_DUTIES, and officer co-2 then approves the identical order successfully."
        test_recipe:
          setup:
            - "Class A, CA registration, account AS is DIRECT/CA and ACTIVE."
            - "The clock reads 2026-08-04T10:00:00Z and compliance officer co-1 has captured an as-of order for 2026-08-03, which sits in PENDING_AS_OF_APPROVAL."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: FundAccountant
            - call: "POST /funds"
              payload: { name: "Meridian Growth Fund", fund_family_code: "MER" }
              as: FundAccountant
              captures: { fund_id: $.data.id }
            - call: "POST /share-classes"
              payload: { fund_id: "${fund_id}", class_code: "A", seed_nav_per_share: 10.0000, breakpoint_tiers: [{min_qualifying_amount: 0, load_pct: 0.0575}] }
              as: FundAccountant
              captures: { sc_a: $.data.id }
            - call: "POST /blue-sky-registrations"
              payload: { share_class_id: "${sc_a}", state_code: "CA", registered_amount: 1000000.00, effective_date: "2026-01-01", expiration_date: "2027-01-01" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { bs_ca: $.data.id }
            - call: "POST /shareholder-accounts"
              payload: { registration_type: "INDIVIDUAL", account_channel: "DIRECT", state_code: "CA", tax_id: "636-36-3636", primary_owner_name: "Ash Asof" }
              as: TransferAgentOperator
              captures: { acc_as: $.data.id }
            - call: "POST /shareholder-accounts/${acc_as}/activate"
              payload: { tin_certified: true }
              as: TransferAgentOperator
            - call: "POST /nav-records"
              payload: { share_class_id: "${sc_a}", valuation_date: "2026-08-03", total_net_assets: 0.00 }
              as: FundAccountant
              captures: { nav1: $.data.id }
            - call: "POST /nav-records/${nav1}/finalize"
              payload: {}
              as: FundAccountant
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T10:00:00Z" }
              as: FundAccountant
            - call: "POST /trades"
              payload: { account_id: "${acc_as}", share_class_id: "${sc_a}", trade_type: "PURCHASE", gross_amount: 8000.00, as_of_date: "2026-08-03" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { t_as: $.data.id }
          trigger:
            - call: "POST /trades/${t_as}/approve-as-of"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { err_id: $.data.error_id }
            - call: "POST /trades/${t_as}/approve-as-of"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-2"
          assert:
            - "Trade.${t_as}.trade_date == 2026-08-03"
            - "Trade.${t_as}.captured_by_user_id == co-1"
            - "the self-approval returns HTTP 403 with error_id ERR_SEGREGATION_OF_DUTIES"
            - "after the co-1 attempt Trade.${t_as}.execution_status is still PENDING_AS_OF_APPROVAL"
            - "the co-2 approval returns HTTP 200 and Trade.${t_as}.execution_status == RECEIVED"
            - "Trade.${t_as}.approved_by_user_id == co-2"

      - name: reprocess_by_the_detecting_accountant_is_rejected_for_segregation_of_duties
        claim_type: segregation_of_duties
        grounds:
          - "validations[priority=90]"
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - state_machines.PricingErrorCase.MATERIAL_APPROVED_to_REPROCESSED
          - entities.PricingErrorCase.fields.detected_by_user_id
        distinguishing_aspect: "A second segregation surface on a different pair of steps: the reprocessing sweep compares X-User-ID against detected_by_user_id, so accountant fa-1 who opened the case cannot run it and the case stays MATERIAL_APPROVED."
        test_recipe:
          setup:
