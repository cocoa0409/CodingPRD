  - name: claim_rejection_leaves_assessment_zero
    grounds:
    - state_machines.ChargebackClaim.FILED_to_REJECTED
    - state_machines.ChargebackClaim.FILED_to_APPROVED
    - calculations.chargeback_net_recovery
    - entities.ServiceProvider.fields.chargeback_outstanding_cents
    distinguishing_aspect: 'A different conserved quantity family: a cardinal assessment count of

      SettlementDeduction rows with deduction_type CHARGEBACK, asserted as the

      zero-sum invariant that a rejected claim contributes no deduction row, no

      outstanding cents and no change to the branded service area score.

