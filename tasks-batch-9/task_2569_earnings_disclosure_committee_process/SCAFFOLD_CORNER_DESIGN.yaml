            - call: "POST /disclosure/documents"
              payload: { cycle_id: "${cycle_id}", doc_type: "EARNINGS_RELEASE", title: "Q2 2026 Earnings Release rev 2", author_member_id: "${fin_id}", safe_harbor_present: true, expected_cycle_version: "${v3}" }
              as: Controller
              as_user_id: "${fin_id}"
              captures: { er2_id: $.data.id }
            - call: "GET /disclosure/documents/${er2_id}"
              payload: {}
              as: Controller
              as_user_id: "${fin_id}"
              captures: { er2_v: $.data.version }
            - call: "POST /disclosure/documents/${er2_id}/tie-out-items"
              payload: { line_label: "Net revenue", reported_value: 5000000, source_record_value: 5000000, tolerance_bp: 25, preparer_member_id: "${fin_id}", expected_document_version: "${er2_v}" }
