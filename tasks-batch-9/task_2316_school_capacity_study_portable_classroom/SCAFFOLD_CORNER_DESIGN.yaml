      - name: study_revision_cycle_state_machine_loop
        claim_type: cyclic
        grounds: [state_machines.CapacityStudy.transitions, complexity_profile.state_machine_shape]
        excluded_because:
          difficulty_instance: non_linear_state_machine / study_revision_cycle_to_round_cap
          rationale: "That instance drives the DRAFT/SUBMITTED/RETURNED loop three times and asserts the revision_round cap and the ERR_REVISION_LIMIT_REACHED refusal, which is the whole cyclic claim."

      - name: placement_request_permit_fork_and_join
        claim_type: branching
        grounds: [state_machines.PlacementRequest.transitions, complexity_profile.state_machine_shape]
        excluded_because:
          difficulty_instance: non_linear_state_machine / placement_request_fork_join_over_permit_set
          rationale: "That instance forks three permits, loops one through corrections and asserts the join fires only on the last approval."

      - name: unsafe_unit_cascade_down_to_open_requests
        claim_type: cascade_down
        grounds: [state_machines.PortableUnit.transitions, state_machines.PlacementRequest.transitions]
        excluded_because:
          difficulty_instance: transitive_cascade / unsafe_condition_cascade_to_pad_release
          rationale: "That instance asserts the four-link condemnation cascade and that only non-terminal requests and open schedules are touched."

      - name: permit_approval_bubbles_up_to_request
        claim_type: bubble_up
        grounds: ["state_machines.PlacementRequest.transitions.PERMIT_PENDING_to_PERMITTED"]
        excluded_because:
          difficulty_instance: transitive_cascade / permit_join_cascade_to_pad_occupation
          rationale: "That instance asserts the request auto-transitions only when the last of its permits is approved, plus the encumbrance and pad occupation that follow."

      - name: hosted_seat_ledger_sync_on_installation
        claim_type: ledger_sync
        grounds: [entities.School.hosted_portable_seats, state_machines.InstallationSchedule.transitions]
        excluded_because:
          difficulty_instance: compensating_invariant / hosted_seat_ledger_restored_on_decommission
          rationale: "That instance reconciles the campus seat ledger against the installed-unit population before and after both directions."

      - name: encumbrance_compensation_on_withdrawal
        claim_type: compensation
        grounds: [entities.CapitalBudget, "state_machines.PlacementRequest.transitions.PERMITTED_to_WITHDRAWN"]
        excluded_because:
          difficulty_instance: compensating_invariant / capital_budget_partition_restored_on_withdrawal
          rationale: "That instance asserts the encumbrance is released at exactly the stored amount with no drift and no double release."

      - name: site_assessment_guarded_by_study_certification
        claim_type: guarded_transitions
        grounds: ["validations[11]", state_machines.PlacementRequest.transitions]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / request_site_assessment_requires_certified_study
          rationale: "That instance is exactly the guarded-transition claim: the same call flips on another entity's status alone."

      - name: unsafe_cascade_skips_terminal_children
        claim_type: conditional_cascade
        grounds: [state_machines.PortableUnit.transitions, state_machines.InstallationSchedule.transitions]
        excluded_because:
          difficulty_instance: transitive_cascade / unsafe_condition_cascade_to_pad_release
          rationale: "That instance's asserts include that only PLANNED or IN_PROGRESS schedules are cancelled and only non-terminal requests are withdrawn."

