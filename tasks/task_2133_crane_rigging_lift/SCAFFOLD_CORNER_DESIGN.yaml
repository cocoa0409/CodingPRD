        distinguishing_aspect: "Both halves of priority 20 are enforced on POST /lift-plans: window_end equal to window_start (not strictly after) is rejected, and a window_start of 2026-07-01T00:00:00Z (before the 2026-08-01T00:00:00Z default clock) is rejected, both with ERR_INVALID_WINDOW (422)."
        test_recipe:
          setup: ["A customer and a site exist; the clock is at its 2026-08-01T00:00:00Z startup default."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { account_name: "Harborline Fabricators" }
              as: Dispatcher
              captures: { cust_id: $.data.id }
            - call: "POST /sites"
              payload: { customer_id: "${cust_id}", address_label: "Pier 9 Yard", jurisdiction_code: "NJ-HUDSON", soil_bearing_capacity_psf: 3500 }
              as: Dispatcher
              captures: { site_id: $.data.id }
          trigger:
            - call: "POST /lift-plans"
              payload: { site_id: "${site_id}", job_reference: "JOB-BAD-1", window_start: "2026-09-10T06:00:00Z", window_end: "2026-09-10T06:00:00Z", load_weight_lb: 60000 }
              as: Dispatcher
              captures: { err1: $.data.error_id }
            - call: "POST /lift-plans"
              payload: { site_id: "${site_id}", job_reference: "JOB-BAD-2", window_start: "2026-07-01T00:00:00Z", window_end: "2026-07-01T10:00:00Z", load_weight_lb: 60000 }
              as: Dispatcher
              captures: { err2: $.data.error_id }
          assert:
            - "${err1} == ERR_INVALID_WINDOW with HTTP 422"
            - "${err2} == ERR_INVALID_WINDOW with HTTP 422"
            - "GET /lift-plans?site_id=${site_id} returns an empty array with total_count 0"

