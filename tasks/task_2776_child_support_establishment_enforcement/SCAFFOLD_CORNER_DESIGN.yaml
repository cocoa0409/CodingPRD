          Case P carries 150000 of arrears - comfortably over
          MIN_COMPROMISE_ARREARS_CENTS - and is refused anyway because
          tanf_assistance makes the arrears assigned to the state. Case D is refused
          for a different reason at a different band: its NCP scores 77 on the
          compromise variant (payment history weighted 40 and a DELINQUENT IWO
          weighted 20) which is HIGH, and priority 39 fires ahead of priority 43
          even though the 75000 of arrears is ALSO below the 100000 minimum. The
