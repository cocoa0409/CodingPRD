  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: discharge_cascade_depth3_device_return_then_monitoring_off
        grounds:
          - state_machines.Patient.enrollment_PENDING_or_ENROLLED_or_SUSPENDED_to_DISCHARGED
          - state_machines.Device.ACTIVE_to_RETURNED
          - state_machines.Patient.monitoring_MONITORING_to_PAUSED
          - state_machines.CarePlan.ACTIVE_to_RETIRED
        distinguishing_aspect: |
          Depth-3 chain from the discharge trigger: discharge (A) flips an ACTIVE Device -> RETURNED (B,
          caused by A); B leaves no ACTIVE device which forces the patient's monitoring recompute to
          INACTIVE (C, caused by B). Each link is caused by the prior link, not directly by discharge.
        test_recipe:
          setup:
            - "Patient ENROLLED + MONITORING with one ACTIVE device and an ACTIVE care plan; no OPEN period with logged minutes."
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "P-DC", payer_type: "MEDICARE", rate_99453_cents: 1965, rate_99454_cents: 4774, rate_99457_cents: 4877 }
              as: BillingSpecialist
              captures: { payer_id: $.data.id }
