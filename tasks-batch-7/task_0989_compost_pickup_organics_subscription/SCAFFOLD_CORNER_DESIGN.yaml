      - name: duplicate_weigh_ticket_returns_error
        claim_type: idempotency
        grounds: ["errors[ERR_DUPLICATE_WEIGH_TICKET]", "validations[priority=9]"]
        distinguishing_aspect: "(route_id, service_date) is unique: a second ticket for the same pair -> ERR_DUPLICATE_WEIGH_TICKET; the first allocation is not recomputed."
