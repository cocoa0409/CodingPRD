            - "Application.${a1_id}.status == DRAFT"
            - "GET /esa/accounts?application_id=${a1_id} returns 0 rows"
            - "ProgramYear.${py_id}.seats_committed == 0 and seats_available == 2"

      - name: provider_probation_then_reinstatement_closes_the_cycle
        claim_type: Valid Transition
        grounds:
          - state_machines.Provider.APPROVED_to_PROBATION
          - state_machines.Provider.PROBATION_to_APPROVED
          - entities.Provider.fields.sanction_reason
          - complexity_profile.state_machine_shape
        distinguishing_aspect: "The cyclic shape is exercised on the Provider machine: APPROVED -> PROBATION -> APPROVED returns to a state already occupied, and the second hop clears sanction_reason back to null because surveillance_score 0 is below the 75 reinstatement bar."
        test_recipe:
          setup:
            - "Provider P1 was screened with an empty flag list (screening_score 0, surveillance_score 0) and approved for [TUTORING], so its status is APPROVED."
            - "ExpenseCategory TUTORING exists so the authorized code resolves."
          setup_api_calls:
            - call: "POST /esa/expense-categories"
              payload: { code: "TUTORING", name: "Tutoring services", per_year_cap_cents: 200000, allowable: true, requires_preapproval: true, requires_service_period: true }
              as: ProgramAdmin
              captures: { cat_tut_id: $.data.id }
            - call: "POST /esa/providers"
              payload: { legal_name: "Lone Star Tutors LLC", ein: "751234567", address_state: "TX", provider_type: "TUTOR" }
              as: ProgramAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /esa/providers/${p1_id}/fraud-screenings"
              payload: { flags: [] }
              as: VendorScreener
              as_user_id: "vs-1"
              captures: { fs_score: $.data.screening_score }
            - call: "POST /esa/providers/${p1_id}/approve"
              payload: { authorized_category_codes: ["TUTORING"] }
              as: VendorScreener
              as_user_id: "vs-1"
          trigger:
            - call: "POST /esa/providers/${p1_id}/sanctions"
              payload: { action: "PROBATION", reason: "Late invoice documentation." }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /esa/providers/${p1_id}/sanctions"
              payload: { action: "REINSTATE", reason: "Documentation received and verified." }
              as: ComplianceOfficer
              as_user_id: "co-1"
          assert:
            - "${fs_score} == 0 and the approve call left Provider.${p1_id}.status == APPROVED"
            - "after the PROBATION sanction, Provider.${p1_id}.status == PROBATION and sanction_reason == 'Late invoice documentation.'"
            - "after the REINSTATE sanction, Provider.${p1_id}.status == APPROVED and sanction_reason is null"
            - "Provider.${p1_id}.authorized_category_codes == ['TUTORING'] throughout"
            - "Provider.${p1_id}.surveillance_score == 0 (no substantiated case ever attached)"

      - name: permanently_barred_provider_rejects_every_later_sanction
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Provider.DELISTED_to_PERMANENTLY_BARRED
          - state_machines.Appeal.FILED_to_UPHELD
          - errors.ERR_INVALID_STATE_TRANSITION
        distinguishing_aspect: "PERMANENTLY_BARRED is the Provider machine's only terminal state: after an UPHELD delisting appeal, both REINSTATE and DELIST return 409 and the status never changes again."
        test_recipe:
          setup:
            - "Provider P1 was screened clean, approved for [TUTORING], then DELISTED by co-1."
            - "The provider filed a PROVIDER_DELISTING appeal which ao-1 UPHELD, moving P1 to PERMANENTLY_BARRED."
          setup_api_calls:
            - call: "POST /esa/expense-categories"
              payload: { code: "TUTORING", name: "Tutoring services", per_year_cap_cents: 200000, allowable: true, requires_preapproval: true, requires_service_period: true }
              as: ProgramAdmin
              captures: { cat_tut_id: $.data.id }
            - call: "POST /esa/providers"
              payload: { legal_name: "Lone Star Tutors LLC", ein: "751234567", address_state: "TX", provider_type: "TUTOR" }
              as: ProgramAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /esa/providers/${p1_id}/fraud-screenings"
              payload: { flags: [] }
              as: VendorScreener
              as_user_id: "vs-1"
            - call: "POST /esa/providers/${p1_id}/approve"
              payload: { authorized_category_codes: ["TUTORING"] }
              as: VendorScreener
              as_user_id: "vs-1"
            - call: "POST /esa/providers/${p1_id}/sanctions"
              payload: { action: "DELIST", reason: "Falsified attendance logs." }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /esa/appeals"
              payload: { subject_type: "PROVIDER_DELISTING", provider_id: "${p1_id}", grounds: "The attendance logs were mis-filed, not falsified." }
              as: Provider
              as_user_id: "${p1_id}"
              captures: { ap_id: $.data.id }
            - call: "POST /esa/appeals/${ap_id}/decision"
              payload: { decision: "UPHELD", rationale: "Falsification confirmed by two independent site visits." }
              as: AppealsOfficer
              as_user_id: "ao-1"
          trigger:
            - call: "POST /esa/providers/${p1_id}/sanctions"
              payload: { action: "REINSTATE", reason: "Requesting readmission." }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { err1: $.data.error_id }
            - call: "POST /esa/providers/${p1_id}/sanctions"
              payload: { action: "DELIST", reason: "Duplicate delisting attempt." }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { err2: $.data.error_id }
          assert:
            - "Appeal.${ap_id}.status == UPHELD and Provider.${p1_id}.status == PERMANENTLY_BARRED"
            - "the REINSTATE attempt returns HTTP 409 with error_id ERR_INVALID_STATE_TRANSITION"
            - "the DELIST attempt returns HTTP 409 with error_id ERR_INVALID_STATE_TRANSITION"
            - "Provider.${p1_id}.status == PERMANENTLY_BARRED after both rejected calls"

      - name: cascade_down_on_account_suspension_covered_by_difficulty
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Account.ACTIVE_to_SUSPENDED
          - endpoints["POST /esa/misuse-cases/{id}/adjudication"].side_effects
        excluded_because:
          difficulty_instance: transitive_cascade / substantiation_suspends_account_voids_requests_and_releases_encumbrances
          rationale: "The depth-4 cascade down from adjudication (suspend -> void requests -> release holds -> restore balance) is asserted hop by hop in the named §1.8 instance."

      - name: compensation_reversal_of_clawback_covered_by_difficulty
        claim_type: Side Effect Execution
        grounds:
          - state_machines.MisuseCase.UNDER_APPEAL_to_REVERSED
          - entities.ClawbackEntry.fields.entry_type
        excluded_because:
          difficulty_instance: compensating_invariant / overturned_clawback_appeal_restores_the_account_money_identity
          rationale: "The undo path and its money identity, including the append-only REVERSAL entry, are asserted in the named §1.8 instance."

      - name: parallel_state_dimensions_on_purchase_request_covered_by_difficulty
        claim_type: Valid Transition
        grounds:
          - "state_machines.PurchaseRequest.SETTLEMENT:UNSETTLED_to_SETTLEMENT:CLAIMED"
          - entities.PurchaseRequest.fields.approval_status
        excluded_because:
          difficulty_instance: non_linear_state_machine / purchase_request_claim_advances_while_approval_still_pending
          rationale: "Independent advance of the settlement dimension and the cross-dimension settle guard are both asserted in the named §1.8 instance."

      - name: cyclic_loop_bound_on_application_appeals_covered_by_difficulty
        claim_type: Valid Transition
        grounds:
          - state_machines.Application.UNDER_APPEAL_to_SUBMITTED
          - entities.Application.fields.appeal_round_count
        excluded_because:
          difficulty_instance: non_linear_state_machine / denied_application_cycles_back_to_submitted_on_overturned_appeal
          rationale: "The DENIED -> UNDER_APPEAL -> SUBMITTED loop, the round counter and the second determination are asserted in the named §1.8 instance."

