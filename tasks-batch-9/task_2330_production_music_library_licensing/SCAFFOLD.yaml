    roles: [RoyaltyAccountant, Composer]
    input: ["composer_id?", "status?", "basis?", "limit?", "offset?"]
    output: RoyaltyStatement[]
    status_code: 200
    description: "Reverse lookup for RoyaltyStatement.composer_id."
