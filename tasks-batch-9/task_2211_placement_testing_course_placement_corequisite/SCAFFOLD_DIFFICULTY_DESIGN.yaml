            - call: "POST /students"
              payload: { student_number: "SG", full_name: "Student G", race_ethnicity_code: "HISPANIC", hs_gpa: 2.07, hs_transcript_status: "VERIFIED", transcript_recorded_at: "2025-06-01T00:00:00Z", self_guided_pathway: "BSTEM" }
