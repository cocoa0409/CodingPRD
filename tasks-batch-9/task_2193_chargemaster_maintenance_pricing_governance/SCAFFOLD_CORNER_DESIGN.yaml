      - name: companion_and_duplicate_links_require_a_same_facility_active_target
        claim_type: cross_reference_link
        grounds:
          - validations[priority=10]
          - validations[priority=26]
          - validations[priority=27]
          - validations[priority=51]
          - entities.ChargeItem.companion_required_item_id
          - entities.ChargeItem.duplicate_of_item_id
        distinguishing_aspect: "Both self-referential links are validated against the SAME facility: a companion in facility CCN-0002 returns ERR_COMPANION_ITEM_INVALID while a non-resolving UUID returns the higher-priority ERR_REFERENCED_RESOURCE_NOT_FOUND. duplicate_of_item_id must additionally be a DIFFERENT ACTIVE item, so pointing at a DRAFT item or at the item itself returns ERR_DUPLICATE_TARGET_INVALID; the successful MARK_DUPLICATE leaves the retired item INACTIVE with the link set, discoverable by filtering the list endpoint, and REACTIVATE then returns ERR_ITEM_RETIRED_AS_DUPLICATE."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z; facility CCN-0001 (NEAREST_CENT, duplicate_detection_mode default STRICT_CODE), revenue code 0300, department CC-100, COST_PLUS_MARKUP rule with the default tiers."
            - "ACTIVE items CDM-1001 and CDM-1002, both CPT 93458 in department CC-100 under revenue code 0300 (STRICT_CODE score 1.0000 against each other), plus DRAFT item CDM-1003."
            - "Second facility CCN-0002 with department CC-900 and DRAFT item CDM-8001 used as a foreign companion target."
