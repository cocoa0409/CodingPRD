      - name: safety_segregation_before_referential_award_active_on_certify
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - errors[ERR_AWARD_NOT_ACTIVE]
          - errors[ERR_SEGREGATION_OF_DUTIES]
        distinguishing_aspect: |
          Category pair business_safety (segregation, priority 7) vs business_referential (award-active,
          priority 6): on a certify where the acting user is also a drawdown initiator AND the award has
          been SUSPENDED, the lower-priority-number referential check is NOT triggered on certify (certify
          allows ACTIVE or PENDING_CLOSEOUT, not SUSPENDED) — so this conflict is realised as state(4) vs
          safety(7). To keep a clean safety-vs-referential pair, the scenario keeps the award ACTIVE and
          pits the segregation check against the disburse-time referential guard reused on a sibling action;
          concretely: certifying a report whose award is ACTIVE while acting as a drawdown initiator returns
          ERR_SEGREGATION_OF_DUTIES (priority 7), and the same user disbursing on a SUSPENDED award returns
