      - name: ops_run_sweeps_every_dataset_and_reports_per_sweep_counts
        claim_type: bulk_action
        grounds:
          - endpoints.POST /open-data/ops-run
          - calculations.dataset_currency_status
          - calculations.department_compliance_posture
        distinguishing_aspect: "One sweep touches every non-RETIRED published dataset and returns per-sweep counters: the WEEKLY dataset crosses AGING -> STALE (one alert, posture change), the MONTHLY dataset is not yet due and does not transition, and a second identical sweep re-alerts the still-STALE dataset without any further transition."
