              captures: { ca_id: $.data.id }
            - call: "POST /fleet/chargers"
              payload: { depot_id: "${d_id}", name: "CB", connector_type: "CCS", max_power_kw: 150 }
              as: FleetManager
              captures: { cb_id: $.data.id }
            - call: "POST /fleet/vehicles"
              payload: { depot_id: "${d_id}", vin: "VA", connector_type: "CCS", battery_capacity_kwh: 100, efficiency_kwh_per_km: 0.2, current_soc_pct: 20 }
              as: FleetManager
              captures: { va_id: $.data.id }
            - call: "POST /fleet/charge-sessions"
              payload: { depot_id: "${d_id}", charger_id: "${ca_id}", vehicle_id: "${va_id}", scheduled_start: "2026-05-10T10:00:00Z", scheduled_end: "2026-05-10T11:00:00Z", target_soc_pct: 50, power_kw: 50, expected_depot_version: "${d_v}" }
              as: DepotOperator
              captures: { e_id: $.data.id }
            - call: "GET /fleet/depots/${d_id}"
              payload: {}
              as: FleetManager
              captures: { d_v2: $.data.version }
          trigger:
            - call: "POST /fleet/charge-sessions"
              payload: { depot_id: "${d_id}", charger_id: "${cb_id}", vehicle_id: "${va_id}", scheduled_start: "2026-05-10T11:00:00Z", scheduled_end: "2026-05-10T12:00:00Z", target_soc_pct: 50, power_kw: 50, expected_depot_version: "${d_v2}" }
              as: DepotOperator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VEHICLE_TIME_CONFLICT (HTTP 409)"

  # =================================================================
  # RULE 9 — compensating_invariant  (≥2, different conserved quantities)
  # =================================================================
  - rule_id: compensating_invariant
    instances:
      - name: reserved_load_conserved_schedule_then_cancel
        grounds:
          - entities.Depot.fields.reserved_load_kw
          - state_machines.ChargeSession.SCHEDULED_to_CANCELLED
          - calculations.depot_reserved_load
        distinguishing_aspect: "Conserved quantity = committed POWER (kW): schedule debits reserved_load_kw +120 and cancel credits -120, returning it to the pre-schedule 0 == sum of power_kw over SCHEDULED/ACTIVE sessions (empty). No drift."
        test_recipe:
          setup:
            - "Depot D (reserved_load_kw 0); Charger C1; Vehicle V. Session scheduled power 120 (reserved becomes 120)."
          setup_api_calls:
            - call: "POST /fleet/depots"
              payload: { name: "D", max_load_kw: 500, contracted_capacity_kw: 300, demand_rate_cents_per_kw: 1000, overage_rate_cents_per_kw: 2500, reimbursement_budget_cents: 100000, tariff_windows: [{period: FLAT, start_hour_utc: 0, end_hour_utc: 24, rate_cents_per_kwh: 20}] }
              as: FleetManager
              captures: { d_id: $.data.id, d_v: $.data.version }
            - call: "POST /fleet/chargers"
              payload: { depot_id: "${d_id}", name: "C1", connector_type: "CCS", max_power_kw: 150 }
              as: FleetManager
              captures: { c_id: $.data.id }
            - call: "POST /fleet/vehicles"
              payload: { depot_id: "${d_id}", vin: "V", connector_type: "CCS", battery_capacity_kwh: 100, efficiency_kwh_per_km: 0.2, current_soc_pct: 20 }
              as: FleetManager
              captures: { v_id: $.data.id }
            - call: "POST /fleet/charge-sessions"
              payload: { depot_id: "${d_id}", charger_id: "${c_id}", vehicle_id: "${v_id}", scheduled_start: "2026-05-10T10:00:00Z", scheduled_end: "2026-05-10T11:00:00Z", target_soc_pct: 50, power_kw: 120, expected_depot_version: "${d_v}" }
              as: DepotOperator
              captures: { s_id: $.data.id }
            - call: "GET /fleet/depots/${d_id}"
              payload: {}
              as: FleetManager
              captures: { reserved_mid: $.data.reserved_load_kw }
          trigger:
            - call: "POST /fleet/charge-sessions/${s_id}/cancel"
              payload: {}
              as: DepotOperator
          assert:
            - "Depot.${d_id}.reserved_load_kw before cancel (reserved_mid) == 120"
            - "Depot.${d_id}.reserved_load_kw == 0 after cancel (schedule +120 then cancel -120 conserve the pool)"
            - "ChargeSession.${s_id}.status == CANCELLED"

      - name: reimbursement_committed_conserved_submit_then_reject
        grounds:
          - entities.Depot.fields.reimbursement_committed_cents
          - state_machines.ReimbursementClaim.SUBMITTED_to_REJECTED
          - calculations.depot_reimbursement_committed
        distinguishing_aspect: "Conserved quantity = MONEY (cents), a different quantity than power: submit commits +1500 and reject releases -1500, returning reimbursement_committed_cents to the pre-submit 0 == sum over SUBMITTED/APPROVED claims (empty). No drift."
        test_recipe:
          setup:
            - "Depot D budget 100000 (committed 0); Driver DR tariff 15. Claim submitted 100kWh (committed 1500)."
          setup_api_calls:
            - call: "POST /fleet/depots"
              payload: { name: "D", max_load_kw: 500, contracted_capacity_kw: 300, demand_rate_cents_per_kw: 1000, overage_rate_cents_per_kw: 2500, reimbursement_budget_cents: 100000, tariff_windows: [{period: FLAT, start_hour_utc: 0, end_hour_utc: 24, rate_cents_per_kwh: 20}] }
              as: FleetManager
              captures: { d_id: $.data.id, d_v: $.data.version }
            - call: "POST /fleet/drivers"
              payload: { depot_id: "${d_id}", name: "DR", email: "dr@x.com", home_tariff_cents_per_kwh: 15 }
              as: FleetManager
              captures: { dr_id: $.data.id }
            - call: "POST /fleet/reimbursement-claims"
              payload: { driver_id: "${dr_id}", depot_id: "${d_id}", period_month: "2026-05", kwh_claimed: 100, odometer_start: 1000, odometer_end: 1500, expected_depot_version: "${d_v}" }
              as: Driver
              as_user_id: "${dr_id}"
              captures: { claim_id: $.data.id }
            - call: "GET /fleet/depots/${d_id}"
              payload: {}
              as: FleetManager
              captures: { committed_mid: $.data.reimbursement_committed_cents }
          trigger:
            - call: "POST /fleet/reimbursement-claims/${claim_id}/review"
              payload: { decision: "REJECT" }
              as: FinanceManager
          assert:
            - "Depot.${d_id}.reimbursement_committed_cents before reject (committed_mid) == 1500"
            - "Depot.${d_id}.reimbursement_committed_cents == 0 after reject (submit +1500 then reject -1500 conserve money)"
            - "ReimbursementClaim.${claim_id}.status == REJECTED"
