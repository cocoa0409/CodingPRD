  # =====================================================================
  # Rule 8 — resource_temporal_overlap (≥2 instances, different interval semantics + resources)
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: ebt_card_replace_abuse_rolling_90day_window
        grounds:
          - state_machines.EBTCard.ACTIVE_to_REPLACED
          - entities.EBTCard.fields.replaced_by_card_id
          - entities.FraudFlag.fields.trigger_rule
        distinguishing_aspect: |
          Interval semantics: ROLLING window (90 days backward from
          SystemClock.current_utc, inclusive). Resource: EBTCard. The 3rd
          /replace of the same household within a 90-day rolling window
          triggers FraudFlag(CARD_REPLACE_ABUSE). Different interval
          semantics from monthly_allotment_per_month_uniqueness (DISCRETE
          calendar-month slot uniqueness, no rolling window), and different
          resource (EBTCard vs MonthlyAllotment).
