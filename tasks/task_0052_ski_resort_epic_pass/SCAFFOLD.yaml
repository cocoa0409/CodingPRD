# ==========================================================================
# SEED TABLES: Ski Resort Epic Pass — multi-resort season pass & lift access
# Profile: access-control-matrix + quota-allocation; flat topology; OCC + clock
# ==========================================================================
scenario: "Ski Resort Epic Pass: pass tier, Blackout dates, Buddy ticket, scan-and-go lift access, magnetic anti-counterfeit, cross-resort interoperability, end-of-season refund, IKON interchange"
scenario_summary: "Season pass network: tier-gated scan-and-go lift access with blackout dates, magnetic anti-counterfeit tokens, anti-passback windows, finite buddy-ticket allotments, cross-resort interchange (IKON), and end-of-season refunds."

domain_name: ski-resort-epic-pass
api_prefix: ""

complexity_profile:
  primary_archetype: access-control-matrix
  secondary_archetype: quota-allocation
  complexity_layers:
    - rate-threshold-triggers
    - cascading-side-effects
    - scheduled-deferred-actions
    - optimistic-concurrency
  entity_topology: flat
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ==========================================================================
# 1.1 ENTITY-RELATIONSHIP TABLE
# ==========================================================================
entities:
  - name: Resort
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Resort display name
        constraints: required
      - name: home_network
        type: enum
        source: input
        description: Which pass network owns this resort outright
        default: EPIC
        constraints: "one of EPIC, IKON"
      - name: status
        type: enum
        source: system
        description: Lifecycle state of the resort within the network
        default: OPEN
        constraints: "one of OPEN, SUSPENDED"
      - name: gate_count
        type: integer
        source: input
        description: Number of physical lift gates that can scan passes here
        default: 1
        constraints: ">= 1"

  - name: PassProduct
    parent: null
    common_fields: true
    fields:
      - name: tier
        type: enum
        source: input
        description: Marketing tier of the pass product
        constraints: "required, one of LOCAL, EPIC_DAY, FULL_EPIC; unique across PassProduct rows"
      - name: price_cents
        type: integer
        source: input
        description: Sticker price of the pass in cents
        constraints: "required, >= 0"
      - name: blackout_dates
        type: array
        source: input
        description: List of ISO date strings (YYYY-MM-DD) on which non-FULL_EPIC holders cannot scan
        default: []
        constraints: "each entry YYYY-MM-DD; ignored for FULL_EPIC"
      - name: buddy_ticket_allotment
        type: integer
        source: input
        description: Number of buddy tickets each pass of this product grants for the season
        default: 0
        constraints: ">= 0"
      - name: buddy_ticket_price_cents
        type: integer
        source: input
        description: Per-buddy-ticket charge in cents
        default: 0
        constraints: ">= 0"
      - name: ikon_interchange_enabled
        type: boolean
        source: input
        description: Whether passes of this product may scan at IKON-home resorts via interchange
        default: false

  - name: Pass
    parent: null
    common_fields: true
    fields:
      - name: pass_product_id
        type: string
        source: input
        description: "FK -> PassProduct.id; the product this pass was issued under"
        constraints: required
      - name: holder_name
        type: string
        source: input
        description: Name of the person the pass is issued to
        constraints: required
      - name: magnetic_token
        type: string
        source: system
        description: Server-minted anti-counterfeit token printed on the pass media; required at every scan
        constraints: "system-generated, unique"
      - name: status
        type: enum
        source: system
        description: Lifecycle state of the pass
        default: ISSUED
        constraints: "one of ISSUED, ACTIVE, SUSPENDED, REFUNDED, EXPIRED"
      - name: activated_on
        type: datetime
        source: system
        description: UTC timestamp at which the pass was first activated
        default: null
      - name: scan_count
        type: integer
        source: computed
        description: Count of LiftScan rows with result==GRANTED for this pass; advanced on each granted scan
        default: 0
      - name: buddy_tickets_remaining
        type: integer
        source: computed
        description: PassProduct.buddy_ticket_allotment minus count of BuddyTicket rows in status IN {RESERVED, REDEEMED} for this pass
        default: 0
      - name: refund_basis_cents
        type: integer
        source: computed
        description: Cents amount used as the base for refund proration; set to PassProduct.price_cents at first activation
        default: 0

  - name: LiftScan
    parent: null
    common_fields: false
    fields:
      - name: pass_id
        type: string
        source: input
        description: "FK -> Pass.id; the pass presented at the gate"
        constraints: required
      - name: resort_id
        type: string
        source: input
        description: "FK -> Resort.id; the resort whose gate performed the scan"
        constraints: required
      - name: presented_token
        type: string
        source: input
        description: Magnetic token read off the pass media at the gate
        constraints: required
      - name: scan_at
        type: datetime
        source: system
        description: UTC instant of the scan, copied from the system clock; basis for the anti-passback window
      - name: scan_date
        type: string
        source: system
        description: ISO date (YYYY-MM-DD) derived from scan_at, used for blackout checks
      - name: result
        type: enum
        source: system
        description: Outcome of the scan decision
        constraints: "one of GRANTED, DENIED"
      - name: denial_reason
        type: enum
        source: system
        description: Why a scan was denied; null when GRANTED
        default: null
        constraints: "one of BLACKOUT, TOKEN_MISMATCH, NOT_ACTIVE, NO_INTERCHANGE, RESORT_SUSPENDED, ANTI_PASSBACK, null"

  - name: BuddyTicket
    parent: null
    common_fields: true
    fields:
      - name: pass_id
        type: string
        source: input
        description: "FK -> Pass.id; the host pass whose allotment funds this buddy ticket"
        constraints: required
      - name: resort_id
        type: string
        source: input
        description: "FK -> Resort.id; the resort the buddy ticket is valid at"
        constraints: required
      - name: guest_name
        type: string
        source: input
        description: Name of the guest who will use the buddy ticket
        constraints: required
      - name: valid_date
        type: string
        source: input
        description: ISO date (YYYY-MM-DD) the buddy ticket is valid for
        constraints: "required, YYYY-MM-DD"
      - name: price_charged_cents
        type: integer
        source: computed
        description: Amount charged for this buddy ticket; copied from PassProduct.buddy_ticket_price_cents at reservation
        default: 0
      - name: status
        type: enum
        source: system
        description: Lifecycle of the buddy ticket
        default: RESERVED
        constraints: "one of RESERVED, REDEEMED, CANCELLED"

  - name: RefundRequest
    parent: null
    common_fields: true
    fields:
      - name: pass_id
        type: string
        source: input
        description: "FK -> Pass.id; the pass being refunded"
        constraints: required
      - name: reason
        type: enum
        source: input
        description: Reason category supplied by the requester
        constraints: "required, one of INJURY, RELOCATION, DISSATISFIED"
      - name: scan_count_at_request
        type: integer
        source: system
        description: Snapshot of Pass.scan_count captured when the request was created
        default: 0
      - name: refund_amount_cents
        type: integer
        source: computed
        description: Computed proration payout; set on approval, 0 on rejection
        default: 0
      - name: status
        type: enum
        source: system
        description: Lifecycle of the refund request
        default: PENDING
        constraints: "one of PENDING, APPROVED, REJECTED"

  - name: InterchangeAgreement
    parent: null
    common_fields: true
    fields:
      - name: resort_id
        type: string
        source: input
        description: "FK -> Resort.id; the IKON-home resort that honors interchange scans"
        constraints: required
      - name: max_interchange_days
        type: integer
        source: input
        description: Maximum number of distinct GRANTED interchange scan-days a single pass may use at this resort per season
        constraints: "required, >= 1"
      - name: status
        type: enum
        source: system
        description: Lifecycle of the agreement
        default: ACTIVE
        constraints: "one of ACTIVE, TERMINATED"

# ==========================================================================
# 1.2 STATE MACHINE TABLE
# ==========================================================================
state_machines:
  - entity: Pass
    initial_state: ISSUED
    terminal_states: [REFUNDED, EXPIRED]
    transitions:
      - from: ISSUED
        to: ACTIVE
        trigger: "POST /passes/{id}/activate"
        actor: ResortOps
        preconditions:
          - "pass.status == ISSUED"
        side_effects:
          - "set pass.activated_on = current clock UTC"
          - "set pass.refund_basis_cents = referenced PassProduct.price_cents"
          - "set pass.buddy_tickets_remaining = referenced PassProduct.buddy_ticket_allotment"
          - "increments Pass.version by 1"
        note: "A pass must be ACTIVE before any scan can be GRANTED."
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /passes/{id}/suspend"
        actor: ResortOps
        preconditions:
          - "pass.status == ACTIVE"
        side_effects:
          - "cascade: every BuddyTicket with pass_id==pass.id and status==RESERVED transitions to CANCELLED"
          - "cascade: pass.buddy_tickets_remaining recomputed via buddy_tickets_remaining calc"
          - "increments Pass.version by 1"
        note: "Suspending a pass cancels its outstanding reserved buddy tickets."
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /passes/{id}/activate"
        actor: ResortOps
        preconditions:
          - "pass.status == SUSPENDED"
        side_effects:
          - "increments Pass.version by 1"
        note: "Reinstating a suspended pass; activated_on and refund_basis_cents are unchanged from first activation. Previously cancelled buddy tickets are NOT restored."
      - from: ACTIVE
        to: REFUNDED
        trigger: "POST /refund-requests/{id}/approve (cascades to the referenced pass)"
        actor: RefundAdmin
        preconditions:
          - "pass.status == ACTIVE"
          - "the approving RefundRequest.status == PENDING and RefundRequest.pass_id == pass.id"
        side_effects:
          - "cascade: every BuddyTicket with pass_id==pass.id and status==RESERVED transitions to CANCELLED"
          - "cascade: pass.buddy_tickets_remaining recomputed via buddy_tickets_remaining calc"
          - "increments Pass.version by 1"
        note: "Approving a refund terminates the pass and cancels reserved buddy tickets."
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /_clock/set_current_utc advancing past season end (system auto-transition)"
        actor: system
        preconditions:
          - "pass.status == ACTIVE"
          - "new clock date > SEASON_END_DATE"
        side_effects:
          - "cascade: every BuddyTicket with pass_id==pass.id and status==RESERVED transitions to CANCELLED"
          - "cascade: pass.buddy_tickets_remaining recomputed via buddy_tickets_remaining calc"
          - "increments Pass.version by 1"
        note: "When the clock is advanced past season end, every ACTIVE pass auto-expires and its reserved buddy tickets cancel."

  - entity: BuddyTicket
    initial_state: RESERVED
    terminal_states: [REDEEMED, CANCELLED]
    transitions:
      - from: RESERVED
        to: REDEEMED
        trigger: "POST /buddy-tickets/{id}/redeem"
        actor: ResortOps
        preconditions:
          - "buddy_ticket.status == RESERVED"
          - "referenced Pass.status == ACTIVE"
        side_effects:
          - "increments BuddyTicket.version by 1"
        note: "Redemption requires the host pass to be ACTIVE (cross-entity guard); allotment slot stays consumed."
      - from: RESERVED
        to: CANCELLED
        trigger: "POST /buddy-tickets/{id}/cancel"
        actor: ResortOps
        preconditions:
          - "buddy_ticket.status == RESERVED"
        side_effects:
          - "cascade: referenced Pass.buddy_tickets_remaining recomputed via buddy_tickets_remaining calc (frees one allotment slot)"
          - "increments BuddyTicket.version by 1"
        note: "Explicit cancel frees the allotment; also reached via Pass suspend/refund/expire cascades."

  - entity: RefundRequest
    initial_state: PENDING
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /refund-requests/{id}/approve"
        actor: RefundAdmin
        preconditions:
          - "refund_request.status == PENDING"
          - "referenced Pass.status == ACTIVE"
          - "referenced Pass.scan_count <= MAX_SCANS_FOR_REFUND"
          - "expected_pass_version == referenced Pass.version (OCC)"
        side_effects:
          - "set refund_request.refund_amount_cents via end_of_season_refund calculation"
          - "cascade: referenced Pass transitions ACTIVE -> REFUNDED (which itself cancels RESERVED buddy tickets)"
          - "increments RefundRequest.version by 1"
        note: "Refund eligibility depends on the pass being ACTIVE and lightly used; approval triggers the deepest cascade in the system."
      - from: PENDING
        to: REJECTED
        trigger: "POST /refund-requests/{id}/reject"
        actor: RefundAdmin
        preconditions:
          - "refund_request.status == PENDING"
        side_effects:
          - "set refund_request.refund_amount_cents = 0"
          - "increments RefundRequest.version by 1"
        note: "Rejection leaves the pass untouched."

# --------------------------------------------------------------------------
# 1.2.1 CONCURRENCY RULES
# --------------------------------------------------------------------------
concurrency_rules:
  - rule_id: refund-approve-stale-pass
    parent_entity: Pass
    write_endpoint: "POST /refund-requests/{id}/approve"
    occ_field: "expected_pass_version"
    description: |
      Approving a RefundRequest against a Pass whose version has advanced since
      the client last observed it is rejected. This captures the case where the
      pass has been mutated (e.g., a granted scan advanced scan_count and bumped
      the version) after the approver loaded it, so the approver's view of the
      pass — and therefore of its refund eligibility — is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# ==========================================================================
# 1.3 CALCULATION RULES TABLE
# ==========================================================================
calculations:
  - name: end_of_season_refund
    trigger: "RefundRequest PENDING -> APPROVED (POST /refund-requests/{id}/approve)"
    algorithm: threshold
    formula: |
      basis = pass.refund_basis_cents
      used  = refund_request.scan_count_at_request   # snapshot taken at request creation, NOT live scan_count
      if reason == INJURY:
          # injury refunds are not penalized for usage; flat 90% of basis
          refund = round_half_up(basis * 0.90)
      else:
          # RELOCATION / DISSATISFIED: prorate by unused share, then a 10% processing fee.
          # ROUNDING ORDER IS PINNED: multiply basis * unused_fraction * (1 - PROCESSING_FEE_RATE)
          # as exact rationals, then apply round_half_up ONCE to the final cents value.
          # (Rounding the proration and the fee separately would diverge by a cent in some cases.)
          if used >= MAX_SCANS_FOR_REFUND:
              refund = 0
          else:
              unused_fraction = (MAX_SCANS_FOR_REFUND - used) / MAX_SCANS_FOR_REFUND
              refund = round_half_up(basis * unused_fraction * (1 - PROCESSING_FEE_RATE))
      refund_request.refund_amount_cents = refund
    input_set: "single RefundRequest in PENDING and its referenced Pass; uses scan_count_at_request snapshot, NOT live Pass.scan_count"
    constants:
      MAX_SCANS_FOR_REFUND: 10
      PROCESSING_FEE_RATE: 0.10
    precision: "integer cents, round_half_up applied exactly once to the final cents value (single-rounding order pinned)"
    variants:
      - name: injury_flat
        when: "reason == INJURY"
        difference: "flat 90% of basis, ignores scan usage entirely"
      - name: prorated_with_fee
        when: "reason in {RELOCATION, DISSATISFIED}"
        difference: "prorates by unused scan fraction then deducts a 10% processing fee in one rounding step"

  - name: scan_access_decision
    trigger: "POST /passes/{id}/scan (LiftScan creation)"
    algorithm: constraint_propagation
    formula: |
      # Evaluation order is fixed; the first failing rule sets denial_reason and short-circuits.
      # 1. token: presented_token must equal pass.magnetic_token (anti-counterfeit, highest priority)
      if presented_token != pass.magnetic_token: result=DENIED, reason=TOKEN_MISMATCH
      # 2. pass must be ACTIVE
      elif pass.status != ACTIVE: result=DENIED, reason=NOT_ACTIVE
      # 3. resort must be OPEN
      elif resort.status != OPEN: result=DENIED, reason=RESORT_SUSPENDED
      # 4. anti-passback: reject if a prior GRANTED scan for this pass+resort happened within
      #    ANTI_PASSBACK_MINUTES before scan_at, using a half-open window [last_grant, last_grant+cooldown)
      elif exists GRANTED LiftScan L with L.pass_id==pass.id and L.resort_id==resort.id
           and 0 <= (scan_at - L.scan_at) in minutes < ANTI_PASSBACK_MINUTES:
               result=DENIED, reason=ANTI_PASSBACK
      # 5. interchange: if resort.home_network==IKON, product must allow it AND an ACTIVE agreement
      #    must exist AND distinct prior GRANTED interchange scan-days at this resort for this pass
      #    must be < agreement.max_interchange_days
      elif resort.home_network == IKON:
          if not product.ikon_interchange_enabled: result=DENIED, reason=NO_INTERCHANGE
          elif no ACTIVE InterchangeAgreement for resort: result=DENIED, reason=NO_INTERCHANGE
          elif distinct_interchange_days_used >= agreement.max_interchange_days: result=DENIED, reason=NO_INTERCHANGE
          else: result=GRANTED
      # 6. blackout: FULL_EPIC products ignore blackout_dates entirely; others are blacked out on listed dates
      elif product.tier != FULL_EPIC and scan_date in product.blackout_dates: result=DENIED, reason=BLACKOUT
      else: result=GRANTED
      # distinct_interchange_days_used = count of DISTINCT LiftScan.scan_date values among LiftScan rows
      #   with result==GRANTED, pass_id==pass.id, resort_id==resort.id (excludes the current scan)
    input_set: "the presented Pass, its PassProduct, the scanning Resort, prior GRANTED LiftScan rows for this pass+resort (for anti-passback and interchange-day counting)"
    constants:
      ANTI_PASSBACK_MINUTES: 5
    precision: "boolean decision; no rounding; time comparisons in whole minutes"
    variants:
      - name: epic_home_scan
        when: "resort.home_network == EPIC"
        difference: "interchange check skipped; anti-passback then blackout (unless FULL_EPIC) apply"
      - name: ikon_interchange_scan
        when: "resort.home_network == IKON"
        difference: "interchange eligibility + per-season distinct-day cap apply after anti-passback, before blackout"

  - name: buddy_tickets_remaining
    trigger: "computed on read of Pass; recomputed by Pass activate side_effects and by BuddyTicket reserve/cancel and by Pass suspend/refund/expire cascades"
    algorithm: aggregation
    formula: |
      remaining = product.buddy_ticket_allotment
                  - count(BuddyTicket where pass_id==pass.id and status IN {RESERVED, REDEEMED})
      pass.buddy_tickets_remaining = remaining
    input_set: "BuddyTicket rows for this pass whose status IN {RESERVED, REDEEMED}; CANCELLED rows are excluded; no time window; order-independent count"
    constants: {}
    precision: "non-negative integer"
    variants:
      - name: base
        when: "always"
        difference: "single definition; CANCELLED tickets do not consume allotment"

# ==========================================================================
# 1.4 VALIDATION RULES TABLE (ordered by priority)
# ==========================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_AUTH_MISSING
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "Role is permitted for this operation per the RBAC matrix"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "All path/body referenced resources exist, validated left-to-right (Pass, Resort, PassProduct, BuddyTicket, RefundRequest, InterchangeAgreement)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 4
    category: business_constraint
    check: "Required body fields present and well-typed (e.g., tier, price_cents, pass_product_id, holder_name, presented_token, resort_id, reason, valid_date, max_interchange_days)"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all POST/PATCH"
  - priority: 5
    category: business_constraint
    check: "PassProduct.tier is unique across all PassProduct rows"
    error_id: ERR_DUPLICATE_TIER
    http_status: 409
    applies_to: "POST /pass-products"
  - priority: 6
    category: state
    check: "Target entity is in a state from which the requested transition is allowed (pass/buddy-ticket/refund-request state preconditions)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints (activate, suspend, redeem, cancel, approve, reject)"
  - priority: 7
    category: business_safety
    check: "At scan time presented_token must equal Pass.magnetic_token (anti-counterfeit)"
    error_id: ERR_TOKEN_MISMATCH
    http_status: 409
    applies_to: "POST /passes/{id}/scan"
    note: "Token mismatch is recorded as a DENIED LiftScan AND returns ERR_TOKEN_MISMATCH; it is the highest-priority scan decision rule, ahead of pass/resort state and anti-passback."
  - priority: 8
    category: business_temporal
    check: "Anti-passback: at scan time no prior GRANTED LiftScan for this pass+resort may fall within ANTI_PASSBACK_MINUTES before scan_at (half-open window)"
    error_id: ERR_ANTI_PASSBACK
    http_status: 409
    applies_to: "POST /passes/{id}/scan"
    note: "Recorded as a DENIED LiftScan with denial_reason=ANTI_PASSBACK; evaluated after token/state, before interchange/blackout."
  - priority: 9
    category: business_referential
    check: "Scanning at an IKON-home resort requires interchange enabled, an ACTIVE agreement, and distinct interchange scan-days for this pass+resort < agreement.max_interchange_days"
    error_id: ERR_INTERCHANGE_DENIED
    http_status: 409
    applies_to: "POST /passes/{id}/scan"
    note: "Recorded as a DENIED LiftScan with denial_reason=NO_INTERCHANGE; returns ERR_INTERCHANGE_DENIED."
  - priority: 10
    category: business_referential
    check: "Refund eligibility: referenced Pass.status == ACTIVE and Pass.scan_count <= MAX_SCANS_FOR_REFUND"
    error_id: ERR_REFUND_INELIGIBLE
    http_status: 409
    applies_to: "POST /refund-requests/{id}/approve"
    note: "Distinct from the generic state check (priority 6): an ACTIVE pass that has been scanned too many times is a referential/usage failure, not a state failure."
  - priority: 11
    category: business_constraint
    check: "Optimistic concurrency: expected_pass_version must equal current Pass.version on refund approval"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /refund-requests/{id}/approve"
  - priority: 12
    category: business_fiscal
    check: "Reserving a buddy ticket requires Pass.buddy_tickets_remaining >= 1 (allotment not exhausted)"
    error_id: ERR_BUDDY_ALLOTMENT_EXHAUSTED
    http_status: 409
    applies_to: "POST /buddy-tickets"
  - priority: 13
    category: business_temporal
    check: "A guest_name may not hold two non-CANCELLED buddy tickets for the same valid_date at the same resort_id (same-day double-book)"
    error_id: ERR_BUDDY_DATE_CONFLICT
    http_status: 409
    applies_to: "POST /buddy-tickets"
    note: "Same-calendar-day collision (closed point interval); distinct from the anti-passback buffer window."

# ==========================================================================
# 1.5 API ENDPOINT TABLE
# ==========================================================================
endpoints:
  # ---- Resort ----
  - method: POST
    path: "/resorts"
    description: "Create a resort"
    roles: [NetworkAdmin]
    code: 201
    input: ["name", "home_network?", "gate_count?"]
    output: Resort
    side_effects: ["Resort created with status=OPEN"]
  - method: GET
    path: "/resorts"
    description: "List resorts (paginated; optional home_network filter)"
    roles: [NetworkAdmin, ResortOps, RefundAdmin]
    code: 200
    input: ["home_network?", "limit?", "offset?"]
    output: Resort[]
    side_effects: []
  - method: GET
    path: "/resorts/{id}"
    description: "Read a resort"
    roles: [NetworkAdmin, ResortOps, RefundAdmin]
    code: 200
    input: []
    output: Resort
    side_effects: []
  - method: POST
    path: "/resorts/{id}/suspend"
    description: "Suspend a resort (gates stop granting scans)"
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: Resort
    side_effects: ["Resort.status -> SUSPENDED"]

  # ---- PassProduct ----
  - method: POST
    path: "/pass-products"
    description: "Create a pass product / tier configuration"
    roles: [NetworkAdmin]
    code: 201
    input: ["tier", "price_cents", "blackout_dates?", "buddy_ticket_allotment?", "buddy_ticket_price_cents?", "ikon_interchange_enabled?"]
    output: PassProduct
    side_effects: ["PassProduct created"]
  - method: GET
    path: "/pass-products"
    description: "List pass products (paginated)"
    roles: [NetworkAdmin, ResortOps, RefundAdmin]
    code: 200
    input: ["tier?", "limit?", "offset?"]
    output: PassProduct[]
    side_effects: []
  - method: GET
    path: "/pass-products/{id}"
    description: "Read a pass product"
    roles: [NetworkAdmin, ResortOps, RefundAdmin]
    code: 200
    input: []
    output: PassProduct
    side_effects: []

  # ---- Pass ----
  - method: POST
    path: "/passes"
    description: "Issue a pass under a product; server mints magnetic_token"
    roles: [ResortOps]
    code: 201
    input: [pass_product_id, holder_name]
    output: Pass
    side_effects: ["Pass created with status=ISSUED and a unique magnetic_token"]
  - method: GET
    path: "/passes"
    description: "List passes (paginated; optional pass_product_id filter)"
    roles: [NetworkAdmin, ResortOps, RefundAdmin]
    code: 200
    input: ["pass_product_id?", "limit?", "offset?"]
    output: Pass[]
    side_effects: []
  - method: GET
    path: "/passes/{id}"
    description: "Read a pass (includes computed scan_count, buddy_tickets_remaining, magnetic_token)"
    roles: [NetworkAdmin, ResortOps, RefundAdmin]
    code: 200
    input: []
    output: Pass
    side_effects: []
  - method: POST
    path: "/passes/{id}/activate"
    description: "Activate an ISSUED pass, or reinstate a SUSPENDED pass"
    roles: [ResortOps]
    code: 200
    input: []
    output: Pass
    side_effects:
      - "ISSUED->ACTIVE sets activated_on, refund_basis_cents, buddy_tickets_remaining"
      - "SUSPENDED->ACTIVE reinstates"
      - "increments Pass.version by 1"
  - method: POST
    path: "/passes/{id}/suspend"
    description: "Suspend an ACTIVE pass"
    roles: [ResortOps]
    code: 200
    input: []
    output: Pass
    side_effects:
      - "ACTIVE->SUSPENDED"
      - "cascade: RESERVED buddy tickets for this pass -> CANCELLED; pass.buddy_tickets_remaining recomputed"
      - "increments Pass.version by 1"
  - method: POST
    path: "/passes/{id}/scan"
    description: "Present a pass at a resort gate; creates a LiftScan with GRANTED/DENIED"
    roles: [ResortOps]
    code: 201
    input: [resort_id, presented_token]
    output: LiftScan
    side_effects:
      - "LiftScan created with scan_at=clock, scan_date, result, and (on denial) denial_reason"
      - "on GRANTED: Pass.scan_count += 1, increments Pass.version by 1"

  # ---- BuddyTicket ----
  - method: POST
    path: "/buddy-tickets"
    description: "Reserve a buddy ticket against a host pass's allotment"
    roles: [ResortOps]
    code: 201
    input: [pass_id, resort_id, guest_name, valid_date]
    output: BuddyTicket
    side_effects:
      - "BuddyTicket created status=RESERVED, price_charged_cents copied from product"
      - "Pass.buddy_tickets_remaining recomputed (decremented)"
  - method: GET
    path: "/buddy-tickets"
    description: "List buddy tickets (paginated; optional pass_id filter)"
    roles: [NetworkAdmin, ResortOps, RefundAdmin]
    code: 200
    input: ["pass_id?", "limit?", "offset?"]
    output: BuddyTicket[]
    side_effects: []
  - method: GET
    path: "/buddy-tickets/{id}"
    description: "Read a buddy ticket"
    roles: [NetworkAdmin, ResortOps, RefundAdmin]
    code: 200
    input: []
    output: BuddyTicket
    side_effects: []
  - method: POST
    path: "/buddy-tickets/{id}/redeem"
    description: "Redeem a reserved buddy ticket (host pass must be ACTIVE)"
    roles: [ResortOps]
    code: 200
    input: []
    output: BuddyTicket
    side_effects: ["RESERVED->REDEEMED", "increments BuddyTicket.version by 1"]
  - method: POST
    path: "/buddy-tickets/{id}/cancel"
    description: "Cancel a reserved buddy ticket, freeing the allotment slot"
    roles: [ResortOps]
    code: 200
    input: []
    output: BuddyTicket
    side_effects:
      - "RESERVED->CANCELLED"
      - "Pass.buddy_tickets_remaining recomputed (incremented)"
      - "increments BuddyTicket.version by 1"

  # ---- RefundRequest ----
  - method: POST
    path: "/refund-requests"
    description: "Open a refund request against a pass; snapshots scan_count"
    roles: [ResortOps, RefundAdmin]
    code: 201
    input: [pass_id, reason]
    output: RefundRequest
    side_effects: ["RefundRequest created PENDING with scan_count_at_request snapshot of Pass.scan_count"]
  - method: GET
    path: "/refund-requests"
    description: "List refund requests (paginated; optional pass_id filter)"
    roles: [NetworkAdmin, ResortOps, RefundAdmin]
    code: 200
    input: ["pass_id?", "limit?", "offset?"]
    output: RefundRequest[]
    side_effects: []
  - method: GET
    path: "/refund-requests/{id}"
    description: "Read a refund request"
    roles: [NetworkAdmin, ResortOps, RefundAdmin]
    code: 200
    input: []
    output: RefundRequest
    side_effects: []
  - method: POST
    path: "/refund-requests/{id}/approve"
    description: "Approve a pending refund; computes payout and refunds the pass"
    roles: [RefundAdmin]
    code: 200
    input: [expected_pass_version]
    output: RefundRequest
    side_effects:
      - "RefundRequest.refund_amount_cents set via end_of_season_refund"
      - "RefundRequest PENDING->APPROVED"
      - "cascade: referenced Pass ACTIVE->REFUNDED; its RESERVED buddy tickets -> CANCELLED; pass.buddy_tickets_remaining recomputed"
      - "increments Pass.version by 1"
  - method: POST
    path: "/refund-requests/{id}/reject"
    description: "Reject a pending refund"
    roles: [RefundAdmin]
    code: 200
    input: []
    output: RefundRequest
    side_effects: ["RefundRequest PENDING->REJECTED, refund_amount_cents=0", "increments RefundRequest.version by 1"]

  # ---- InterchangeAgreement ----
  - method: POST
    path: "/interchange-agreements"
    description: "Create an IKON interchange agreement for an IKON-home resort"
    roles: [NetworkAdmin]
    code: 201
    input: [resort_id, max_interchange_days]
    output: InterchangeAgreement
    side_effects: ["InterchangeAgreement created status=ACTIVE"]
  - method: GET
    path: "/interchange-agreements"
    description: "List interchange agreements (paginated; optional resort_id filter)"
    roles: [NetworkAdmin, ResortOps, RefundAdmin]
    code: 200
    input: ["resort_id?", "limit?", "offset?"]
    output: InterchangeAgreement[]
    side_effects: []
  - method: GET
    path: "/interchange-agreements/{id}"
    description: "Read an interchange agreement"
    roles: [NetworkAdmin, ResortOps, RefundAdmin]
    code: 200
    input: []
    output: InterchangeAgreement
    side_effects: []
  - method: POST
    path: "/interchange-agreements/{id}/terminate"
    description: "Terminate an interchange agreement"
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: InterchangeAgreement
    side_effects: ["InterchangeAgreement.status -> TERMINATED"]

  # ---- FK reverse-reachability GETs ----
  - method: GET
    path: "/passes/{id}/lift-scans"
    description: "List LiftScan rows for a pass (FK reverse-reachability for LiftScan.pass_id)"
    roles: [NetworkAdmin, ResortOps, RefundAdmin]
    code: 200
    input: ["resort_id?", "limit?", "offset?"]
    output: LiftScan[]
    side_effects: []
  - method: GET
    path: "/resorts/{id}/lift-scans"
    description: "List LiftScan rows performed at a resort (FK reverse-reachability for LiftScan.resort_id)"
    roles: [NetworkAdmin, ResortOps, RefundAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: LiftScan[]
    side_effects: []
  - method: GET
    path: "/passes/{id}/buddy-tickets"
    description: "List buddy tickets for a host pass (FK reverse-reachability for BuddyTicket.pass_id)"
    roles: [NetworkAdmin, ResortOps, RefundAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: BuddyTicket[]
    side_effects: []
  - method: GET
    path: "/resorts/{id}/buddy-tickets"
    description: "List buddy tickets valid at a resort (FK reverse-reachability for BuddyTicket.resort_id)"
    roles: [NetworkAdmin, ResortOps, RefundAdmin]
    code: 200
    input: ["valid_date?", "limit?", "offset?"]
    output: BuddyTicket[]
    side_effects: []
  - method: GET
    path: "/passes/{id}/refund-requests"
    description: "List refund requests for a pass (FK reverse-reachability for RefundRequest.pass_id)"
    roles: [NetworkAdmin, ResortOps, RefundAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: RefundRequest[]
    side_effects: []
  - method: GET
    path: "/resorts/{id}/interchange-agreements"
    description: "List interchange agreements for a resort (FK reverse-reachability for InterchangeAgreement.resort_id)"
    roles: [NetworkAdmin, ResortOps, RefundAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: InterchangeAgreement[]
    side_effects: []

  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the system clock (drives scan_at/scan_date and season-end auto-expiry)"
    roles: [NetworkAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects:
      - "system clock set to to_iso8601"
      - "if new date > SEASON_END_DATE: every ACTIVE Pass auto-transitions ACTIVE->EXPIRED; its RESERVED buddy tickets -> CANCELLED; pass.buddy_tickets_remaining recomputed"

# ==========================================================================
# 1.6 ERROR CODE CATALOG
# ==========================================================================
errors:
  - id: ERR_AUTH_MISSING
    http: 401
    condition: "X-User-Role or X-User-ID header absent, or role not a known role"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "Authenticated role is not permitted for this operation"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "A referenced resource (pass, resort, product, buddy ticket, refund request, agreement) does not exist"
  - id: ERR_VALIDATION
    http: 422
    condition: "A required field is missing or of the wrong type/format"
  - id: ERR_DUPLICATE_TIER
    http: 409
    condition: "A PassProduct with the same tier already exists"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "The target entity is not in a state from which the requested transition is allowed"
  - id: ERR_TOKEN_MISMATCH
    http: 409
    condition: "presented_token does not match Pass.magnetic_token at scan time"
  - id: ERR_ANTI_PASSBACK
    http: 409
    condition: "A prior GRANTED scan for this pass+resort falls within ANTI_PASSBACK_MINUTES before the current scan"
  - id: ERR_INTERCHANGE_DENIED
    http: 409
    condition: "Scan attempted at an IKON-home resort without interchange enabled / ACTIVE agreement / remaining distinct interchange days"
  - id: ERR_REFUND_INELIGIBLE
    http: 409
    condition: "Refund approval attempted on a non-ACTIVE pass or a pass whose scan_count exceeds MAX_SCANS_FOR_REFUND"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_pass_version does not equal current Pass.version on refund approval"
  - id: ERR_BUDDY_ALLOTMENT_EXHAUSTED
    http: 409
    condition: "Buddy-ticket reservation attempted when Pass.buddy_tickets_remaining < 1"
  - id: ERR_BUDDY_DATE_CONFLICT
    http: 409
    condition: "Guest already holds a non-CANCELLED buddy ticket for the same valid_date at the same resort"

# ==========================================================================
# 1.7 RBAC MATRIX
# ==========================================================================
roles:
  - name: NetworkAdmin
    description: "Manages the network: resorts, pass products, interchange agreements, and the system clock"
    identity: opaque
    exclusive_operations:
      - "POST /resorts"
      - "POST /resorts/{id}/suspend"
      - "POST /pass-products"
      - "POST /interchange-agreements"
      - "POST /interchange-agreements/{id}/terminate"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "all GET reads"
  - name: ResortOps
    description: "Resort gate/operations staff: issues passes, runs lift scans, manages buddy tickets"
    identity: opaque
    exclusive_operations:
      - "POST /passes"
      - "POST /passes/{id}/activate"
      - "POST /passes/{id}/suspend"
      - "POST /passes/{id}/scan"
      - "POST /buddy-tickets"
      - "POST /buddy-tickets/{id}/redeem"
      - "POST /buddy-tickets/{id}/cancel"
    shared_operations:
      - "POST /refund-requests"
      - "all GET reads"
  - name: RefundAdmin
    description: "Back-office refund processor: opens, approves, and rejects refund requests"
    identity: opaque
    exclusive_operations:
      - "POST /refund-requests/{id}/approve"
      - "POST /refund-requests/{id}/reject"
    shared_operations:
      - "POST /refund-requests"
      - "all GET reads"
