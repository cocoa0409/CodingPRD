        distinguishing_aspect: "For f'c > 5000 the individual floor is round(0.90 * f'c) instead of f'c - 500: f'c 6000, sets 7000/7000/5300 give a healthy moving average 6430 >= 6000 but the 5300 set breaches the 5400 floor -> NONCONFORMING (constant HIGH_FC_FLOOR_RATIO applied, not the 500 offset)."
        test_recipe:
          setup: ["project with APPROVED SSI (MOVING_AVERAGE, specified_fc_psi 6000, CONCRETE_STRENGTH item required_count 3), lab capacity 10, technician t1, DISPATCHED assignment, three samples cast 2026-04-01T08:00 age 28 scheduled 2026-04-29"]
