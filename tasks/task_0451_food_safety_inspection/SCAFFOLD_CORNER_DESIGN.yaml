      - name: val_missing_user_context_header
        claim_type: Violation → Error
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_MISSING_USER_CONTEXT]"
        distinguishing_aspect: "A request with no X-User-Role / X-User-ID -> ERR_MISSING_USER_CONTEXT (401)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /establishments"
              payload: { name: "Diner E1", address: "1 Main St", seating_capacity: 40 }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_MISSING_USER_CONTEXT"
            - "response.http_status == 401"

      - name: val_reinspection_target_must_be_same_establishment_finalized
        claim_type: Cross-entity validation
        grounds:
          - "validations[priority=8]"
          - "errors[ERR_INVALID_REINSPECTION_TARGET]"
        distinguishing_aspect: "Scheduling a REINSPECTION whose reinspection_of_id points at an inspection that is not FINALIZED -> ERR_INVALID_REINSPECTION_TARGET (409)."
        test_recipe:
          setup: ["Inspector i1; establishment e1 PERMITTED; a ROUTINE inspection still SCHEDULED (not finalized)."]
          setup_api_calls:
            - call: "POST /inspectors"
              payload: { full_name: "Ivy One", badge_number: "B-001" }
              as: HealthDirector
              captures: { i1: $.data.id }
            - call: "POST /establishments"
              payload: { name: "Diner E1", address: "1 Main St", seating_capacity: 40 }
              as: PermitClerk
              captures: { e1: $.data.id }
