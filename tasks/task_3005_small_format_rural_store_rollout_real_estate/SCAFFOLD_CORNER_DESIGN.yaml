        test_recipe:
          setup: ["program P in DRAFT; trade area A created? — creation also requires ACTIVE; instead create everything, then deactivate back to DRAFT"]
          setup_api_calls:
            - call: "POST /rollouts"
              payload: { name: "P", fiscal_year: 2027, new_build_capital_budget_cents: 2000000000 }
              as: PROGRAM_ADMIN
              captures: { rid: $.data.id }
