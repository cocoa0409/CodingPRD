              as_user_id: "tech-001"
            - call: "POST /cbb/units/${unit_f1_id}/eligibility-determination"
              payload: {}
              as: MedicalDirector
              as_user_id: "md-001"
            - call: "POST /cbb/units/${unit_f1_id}/cryopreserve"
              payload: { tank_id: "${tank_b_id}", slot_code: "B-02", freeze_at: "2026-08-11T02:00:00Z" }
