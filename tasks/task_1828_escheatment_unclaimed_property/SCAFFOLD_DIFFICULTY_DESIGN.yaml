          assert:
            - "interest_cents == 876 (round per line: 438 + 438); the sum-then-round alternative 877 MUST NOT be produced"
            - "penalty_cents == 16666 (raw 100000 capped at floor(66666*25/100) == 16666 — cap binding)"
            - "total_cents == 17542"

      - name: claim_payout_fee_tier_pinned_evaluation_order
        grounds:
          - calculations.claim_payout
          - entities.OwnerClaim.fields.processing_fee_cents
        distinguishing_aspect: |
          Mode (c) circular-looking dependency: the fee tier is keyed on gross, but
          gross includes interest, and the fee reduces the payout — the scaffold
          pins evaluation order base -> interest -> gross -> tier -> fee -> payout.
          At gross exactly 100000c the fee tier does not apply (strict >); one
          interest day later gross 100033c crosses and a 1500c fee appears.
        test_recipe:
