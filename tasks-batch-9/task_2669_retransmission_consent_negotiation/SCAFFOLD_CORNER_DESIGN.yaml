# ===========================================================================
# 1.9 Scaffold Corner Design - retransmission-consent-negotiation (task 2669)
#
# Breadth probe over SCAFFOLD.yaml §1.1-§1.7, walked section-by-section
# against references/claim-extraction-guide.md. Depth corners already carried
# by SCAFFOLD_DIFFICULTY_DESIGN.yaml appear here as `excluded_because:` stubs.
# Every one of the 47 error ids in §1.6 is triggered by at least one instance
# in this file or by a named §1.8 instance.
#
# Logical clock: every recipe starts from the mandated 2026-08-01T00:00:00Z
# default and only moves it through POST /_clock/set_current_utc.
# ===========================================================================
scaffold_corner_design:

  # =========================================================================
  - section: entities
    instances:
      - name: corner_station_create_returns_all_declared_fields
        claim_type: Creation
        grounds:
          - entities.Station
          - endpoints[POST /retrans/stations]
          - response_envelope.success
        distinguishing_aspect: "POST /retrans/stations with all five required inputs returns 201 and a data object carrying call_sign, market_code, dma_rank, market_tv_households, network_affiliation, filed_election_count, id, created_at, updated_at and version."
        test_recipe:
          setup:
            - "Empty database, logical clock at the 2026-08-01T00:00:00Z default"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CarriageAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /retrans/stations"
              payload: { call_sign: "WXYZ", market_code: "SEA", dma_rank: 12, market_tv_households: 1800000, network_affiliation: "CBS" }
              as: CarriageAdmin
              as_user_id: "admin-1"
              captures: { st_id: "$.data.id", st_count: "$.data.filed_election_count", st_version: "$.data.version" }
          assert:
            - "HTTP status is 201"
            - "${st_id} is a non-empty string"
            - "${st_count} == 0"
            - "${st_version} == 1"
            - "Station.${st_id}.call_sign == \"WXYZ\" and market_code == \"SEA\" and dma_rank == 12"
            - "Station.${st_id}.market_tv_households == 1800000 and network_affiliation == \"CBS\""
            - "The response envelope carries meta.api_request_id, meta.api_request_timestamp and response_type == \"object\""

      - name: corner_station_create_missing_network_affiliation_rejected
        claim_type: Required Fields
        grounds:
          - validations[priority=3]
          - entities.Station.fields.network_affiliation
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "network_affiliation has source input and no default, so omitting it returns 400 ERR_INVALID_REQUEST and persists no Station."
        test_recipe:
          setup:
            - "Empty database"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CarriageAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /retrans/stations"
              payload: { call_sign: "WABC", market_code: "PDX", dma_rank: 22, market_tv_households: 1100000 }
              as: CarriageAdmin
              as_user_id: "admin-1"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP status is 400"
            - "${err_id} == \"ERR_INVALID_REQUEST\""
            - "GET /retrans/stations/{any id} finds no station with call_sign WABC (nothing was persisted)"

      - name: corner_subscriber_report_excluded_free_trial_defaults_to_zero
        claim_type: Defaults
        grounds:
          - entities.SubscriberReport.fields.excluded_free_trial_count
          - calculations.subscriber_basis_determination
          - endpoints[POST /retrans/subscriber-reports]
        distinguishing_aspect: "Omitting the optional excluded_free_trial_count applies its declared default 0, so adjusted_subscriber_count equals reported_subscriber_count exactly."
        test_recipe:
          setup:
            - "One CBS station and one CABLE distributor measuring BILLED_HOUSEHOLDS"
          setup_api_calls:
            - call: "POST /retrans/stations"
              payload: { call_sign: "WXYZ", market_code: "SEA", dma_rank: 12, market_tv_households: 1800000, network_affiliation: "CBS" }
              as: CarriageAdmin
              as_user_id: "admin-1"
              captures: { st_id: "$.data.id" }
            - call: "POST /retrans/distributors"
              payload: { name: "Cascade Cable", distributor_type: "CABLE", subscriber_measurement_method: "BILLED_HOUSEHOLDS", video_household_count: 240000 }
              as: CarriageAdmin
              as_user_id: "admin-1"
              captures: { dist_id: "$.data.id" }
          trigger:
            - call: "POST /retrans/subscriber-reports"
              payload: { station_id: "${st_id}", period_label: "2027-01", period_start_utc: "2027-01-01T00:00:00Z", period_end_utc: "2027-02-01T00:00:00Z", reported_subscriber_count: 100000 }
              as: DistributorRep
              as_user_id: "${dist_id}"
              captures: { rep_id: "$.data.id", excluded: "$.data.excluded_free_trial_count", basis: "$.data.billable_subscriber_basis" }
          assert:
            - "HTTP status is 201"
            - "${excluded} == 0"
            - "SubscriberReport.${rep_id}.adjusted_subscriber_count == 100000"
            - "${basis} == 100000"
            - "SubscriberReport.${rep_id}.as_reported_basis == 100000"
            - "SubscriberReport.${rep_id}.status == REPORTED"
            - "SubscriberReport.${rep_id}.distributor_id == ${dist_id} (system-derived from X-User-ID, never supplied in the body)"

      - name: corner_distributor_required_notice_days_computed_from_type
        claim_type: Computed Fields
        grounds:
          - entities.Distributor.fields.required_blackout_notice_days
          - calculations.blackout_notice_deadline
          - endpoints[POST /retrans/distributors]
        distinguishing_aspect: "required_blackout_notice_days is computed from distributor_type at creation: a VMVPD gets 14 and a CABLE distributor gets 30, and the client cannot supply the field at all."
        test_recipe:
          setup:
            - "Empty database"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CarriageAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /retrans/distributors"
              payload: { name: "Cascade Cable", distributor_type: "CABLE", subscriber_measurement_method: "BILLED_HOUSEHOLDS", video_household_count: 240000 }
              as: CarriageAdmin
              as_user_id: "admin-1"
              captures: { cable_id: "$.data.id", cable_days: "$.data.required_blackout_notice_days" }
            - call: "POST /retrans/distributors"
              payload: { name: "StreamRiver TV", distributor_type: "VMVPD", subscriber_measurement_method: "WEIGHTED_STREAMING_DEVICES", video_household_count: 90000 }
              as: CarriageAdmin
              as_user_id: "admin-1"
              captures: { vmvpd_id: "$.data.id", vmvpd_days: "$.data.required_blackout_notice_days" }
          assert:
            - "${cable_days} == 30"
            - "${vmvpd_days} == 14"
            - "Distributor.${cable_id}.open_true_up_count == 0 and Distributor.${vmvpd_id}.open_true_up_count == 0"

      - name: corner_good_faith_log_sequence_index_and_actor_role_are_system_assigned
        claim_type: System Fields
        grounds:
          - entities.GoodFaithLog.fields.sequence_index
          - entities.GoodFaithLog.fields.actor_role
          - endpoints[POST /retrans/negotiations/{id}/good-faith-log]
        distinguishing_aspect: "sequence_index is assigned by the server in created_at ASC order starting at 1 and actor_role is stamped from X-User-Role, so two entries appended by different roles carry 1 and 2 with the caller's role recorded, not any client-supplied value."
        test_recipe:
          setup:
            - "One CBS station, one CABLE distributor, a filed RETRANS_CONSENT election with an OPEN negotiation"
          setup_api_calls:
            - call: "POST /retrans/stations"
              payload: { call_sign: "WXYZ", market_code: "SEA", dma_rank: 12, market_tv_households: 1800000, network_affiliation: "CBS" }
              as: CarriageAdmin
              as_user_id: "admin-1"
              captures: { st_id: "$.data.id" }
            - call: "POST /retrans/stations/${st_id}/affiliation-agreements"
              payload: { network_name: "CBS", term_end_utc: "2032-01-01T00:00:00Z", reverse_comp_floor_per_sub_cents: 90, split_premium_bp: 500, permitted_tiers: ["BROADCAST_BASIC", "EXPANDED_BASIC"], digital_rights_grantable: true, ooh_rights_grantable: false, streaming_rights_grantable: true }
              as: CarriageAdmin
              as_user_id: "admin-1"
            - call: "POST /retrans/distributors"
              payload: { name: "Cascade Cable", distributor_type: "CABLE", subscriber_measurement_method: "BILLED_HOUSEHOLDS", video_household_count: 240000 }
              as: CarriageAdmin
              as_user_id: "admin-1"
              captures: { dist_id: "$.data.id" }
            - call: "POST /retrans/elections"
              payload: { station_id: "${st_id}", distributor_id: "${dist_id}", cycle_label: "2027-2029", election_type: "RETRANS_CONSENT", requested_tier: "EXPANDED_BASIC", incumbent_expiry_utc: "2027-01-01T00:00:00Z", incumbent_rate_per_sub_cents: 220 }
              as: StationGroupNegotiator
              as_user_id: "${st_id}"
              captures: { el_id: "$.data.id" }
            - call: "POST /retrans/elections/${el_id}/file"
              payload: {}
              as: StationGroupNegotiator
              as_user_id: "${st_id}"
            - call: "GET /retrans/elections/${el_id}/negotiations"
              payload: {}
              as: CarriageAdmin
              as_user_id: "admin-1"
              captures: { neg_id: "$.data[0].id" }
          trigger:
            - call: "POST /retrans/negotiations/${neg_id}/good-faith-log"
              payload: { event_type: "INFORMATION_REQUESTED", occurred_at_utc: "2026-08-03T00:00:00Z", summary: "Station group requests subscriber tape" }
              as: StationGroupNegotiator
              as_user_id: "${st_id}"
              captures: { g1_seq: "$.data.sequence_index", g1_role: "$.data.actor_role" }
            - call: "POST /retrans/negotiations/${neg_id}/good-faith-log"
              payload: { event_type: "MEETING_HELD", occurred_at_utc: "2026-08-04T00:00:00Z", summary: "First session" }
              as: DistributorRep
              as_user_id: "${dist_id}"
              captures: { g2_seq: "$.data.sequence_index", g2_role: "$.data.actor_role" }
          assert:
            - "${g1_seq} == 1 and ${g2_seq} == 2"
            - "${g1_role} == \"StationGroupNegotiator\" and ${g2_role} == \"DistributorRep\""
            - "Negotiation.${neg_id}.good_faith_meeting_count == 1 (only the MEETING_HELD entry counts)"

      - name: corner_distributor_unknown_measurement_method_enum_rejected
        claim_type: Type Constraints
        grounds:
          - validations[priority=3]
          - entities.Distributor.fields.subscriber_measurement_method
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "subscriber_measurement_method is constrained to the three declared members, so SET_TOP_BOX_TAPS returns 400 ERR_INVALID_REQUEST rather than being stored as an unknown enum."
        test_recipe:
          setup:
            - "Empty database"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CarriageAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /retrans/distributors"
              payload: { name: "Bad Method Cable", distributor_type: "CABLE", subscriber_measurement_method: "SET_TOP_BOX_TAPS", video_household_count: 240000 }
              as: CarriageAdmin
              as_user_id: "admin-1"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP status is 400"
            - "${err_id} == \"ERR_INVALID_REQUEST\""

      - name: corner_good_faith_log_is_immutable_with_no_version_field
        claim_type: Immutability
        grounds:
          - entities.GoodFaithLog
          - endpoints[GET /retrans/negotiations/{id}/good-faith-log]
        distinguishing_aspect: "GoodFaithLog declares common_fields false, so its rows expose no version and no updated_at and §1.5 offers no PATCH or DELETE for them; the append-only list is the only mutation path."
        test_recipe:
          setup:
            - "One CBS station, one CABLE distributor, a filed election with an OPEN negotiation carrying one log entry"
          setup_api_calls:
            - call: "POST /retrans/stations"
              payload: { call_sign: "WXYZ", market_code: "SEA", dma_rank: 12, market_tv_households: 1800000, network_affiliation: "CBS" }
              as: CarriageAdmin
              as_user_id: "admin-1"
              captures: { st_id: "$.data.id" }
            - call: "POST /retrans/stations/${st_id}/affiliation-agreements"
              payload: { network_name: "CBS", term_end_utc: "2032-01-01T00:00:00Z", reverse_comp_floor_per_sub_cents: 90, split_premium_bp: 500, permitted_tiers: ["BROADCAST_BASIC", "EXPANDED_BASIC"], digital_rights_grantable: true, ooh_rights_grantable: false, streaming_rights_grantable: true }
              as: CarriageAdmin
              as_user_id: "admin-1"
            - call: "POST /retrans/distributors"
              payload: { name: "Cascade Cable", distributor_type: "CABLE", subscriber_measurement_method: "BILLED_HOUSEHOLDS", video_household_count: 240000 }
              as: CarriageAdmin
              as_user_id: "admin-1"
              captures: { dist_id: "$.data.id" }
            - call: "POST /retrans/elections"
              payload: { station_id: "${st_id}", distributor_id: "${dist_id}", cycle_label: "2027-2029", election_type: "RETRANS_CONSENT", requested_tier: "EXPANDED_BASIC", incumbent_expiry_utc: "2027-01-01T00:00:00Z", incumbent_rate_per_sub_cents: 220 }
              as: StationGroupNegotiator
              as_user_id: "${st_id}"
              captures: { el_id: "$.data.id" }
            - call: "POST /retrans/elections/${el_id}/file"
              payload: {}
              as: StationGroupNegotiator
              as_user_id: "${st_id}"
            - call: "GET /retrans/elections/${el_id}/negotiations"
              payload: {}
              as: CarriageAdmin
              as_user_id: "admin-1"
              captures: { neg_id: "$.data[0].id" }
            - call: "POST /retrans/negotiations/${neg_id}/good-faith-log"
              payload: { event_type: "PROPOSAL_EXCHANGED", occurred_at_utc: "2026-08-06T00:00:00Z", summary: "Term sheet exchanged" }
              as: StationGroupNegotiator
              as_user_id: "${st_id}"
          trigger:
            - call: "GET /retrans/negotiations/${neg_id}/good-faith-log"
              payload: { event_type: "PROPOSAL_EXCHANGED" }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
              captures: { first_seq: "$.data[0].sequence_index" }
          assert:
            - "HTTP status is 200 and the filtered list holds exactly 1 row"
            - "${first_seq} == 1"
            - "The row exposes no version field and no updated_at field"
            - "§1.5 declares no PATCH, PUT or DELETE on /retrans/negotiations/{id}/good-faith-log"

      - name: corner_audit_finding_on_unknown_report_returns_report_not_found
        claim_type: Parent Relationships
        grounds:
          - validations[priority=4]
          - errors.ERR_REPORT_NOT_FOUND
          - endpoints[POST /retrans/subscriber-reports/{id}/audit-findings]
        distinguishing_aspect: "The AuditFinding parent is resolved from the path before any business rule runs, so a well-formed body against a non-existent report id returns 404 ERR_REPORT_NOT_FOUND and not the 403 counterparty error."
        test_recipe:
          setup:
            - "One CBS station exists; no subscriber report exists"
          setup_api_calls:
            - call: "POST /retrans/stations"
              payload: { call_sign: "WXYZ", market_code: "SEA", dma_rank: 12, market_tv_households: 1800000, network_affiliation: "CBS" }
              as: CarriageAdmin
              as_user_id: "admin-1"
              captures: { st_id: "$.data.id" }
          trigger:
            - call: "POST /retrans/subscriber-reports/11111111-1111-4111-8111-111111111111/audit-findings"
              payload: { adjustment_subscribers: 500, basis_note: "Audit against a report that does not exist" }
              as: StationGroupNegotiator
              as_user_id: "${st_id}"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP status is 404"
            - "${err_id} == \"ERR_REPORT_NOT_FOUND\""

      - name: corner_get_unknown_station_returns_station_not_found
        claim_type: Not Found
        grounds:
          - validations[priority=4]
          - errors.ERR_STATION_NOT_FOUND
          - endpoints[GET /retrans/stations/{id}]
        distinguishing_aspect: "A syntactically valid but unknown station id on the single-resource read returns 404 ERR_STATION_NOT_FOUND, distinct from the 400 shape error."
        test_recipe:
          setup:
            - "Empty database"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CarriageAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "GET /retrans/stations/22222222-2222-4222-8222-222222222222"
              payload: {}
              as: CarriageAdmin
              as_user_id: "admin-1"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP status is 404"
            - "${err_id} == \"ERR_STATION_NOT_FOUND\""

      - name: corner_elections_list_pagination_and_status_filter
        claim_type: Listing
        grounds:
          - endpoints[GET /retrans/elections]
          - response_envelope.pagination_fields
          - entities.CarriageElection.fields.status
        distinguishing_aspect: "With two elections on one station, GET /retrans/elections?station_id=&limit=1 returns total_count 2 and has_more true, and adding status=NEGOTIATING narrows the page to the single filed election."
        test_recipe:
          setup:
            - "One CBS station, two CABLE distributors, two elections on the station: one filed (NEGOTIATING) and one still DRAFT"
          setup_api_calls:
            - call: "POST /retrans/stations"
              payload: { call_sign: "WXYZ", market_code: "SEA", dma_rank: 12, market_tv_households: 1800000, network_affiliation: "CBS" }
              as: CarriageAdmin
              as_user_id: "admin-1"
              captures: { st_id: "$.data.id" }
            - call: "POST /retrans/stations/${st_id}/affiliation-agreements"
              payload: { network_name: "CBS", term_end_utc: "2032-01-01T00:00:00Z", reverse_comp_floor_per_sub_cents: 90, split_premium_bp: 500, permitted_tiers: ["BROADCAST_BASIC", "EXPANDED_BASIC"], digital_rights_grantable: true, ooh_rights_grantable: false, streaming_rights_grantable: true }
              as: CarriageAdmin
              as_user_id: "admin-1"
            - call: "POST /retrans/distributors"
              payload: { name: "Cascade Cable", distributor_type: "CABLE", subscriber_measurement_method: "BILLED_HOUSEHOLDS", video_household_count: 240000 }
              as: CarriageAdmin
              as_user_id: "admin-1"
              captures: { dist1_id: "$.data.id" }
            - call: "POST /retrans/distributors"
              payload: { name: "Rainier Telco", distributor_type: "TELCO", subscriber_measurement_method: "BILLED_HOUSEHOLDS", video_household_count: 60000 }
              as: CarriageAdmin
              as_user_id: "admin-1"
              captures: { dist2_id: "$.data.id" }
            - call: "POST /retrans/elections"
              payload: { station_id: "${st_id}", distributor_id: "${dist1_id}", cycle_label: "2027-2029", election_type: "RETRANS_CONSENT", requested_tier: "EXPANDED_BASIC", incumbent_expiry_utc: "2027-01-01T00:00:00Z", incumbent_rate_per_sub_cents: 220 }
              as: StationGroupNegotiator
              as_user_id: "${st_id}"
              captures: { el1_id: "$.data.id" }
            - call: "POST /retrans/elections"
              payload: { station_id: "${st_id}", distributor_id: "${dist2_id}", cycle_label: "2027-2029", election_type: "RETRANS_CONSENT", requested_tier: "EXPANDED_BASIC", incumbent_expiry_utc: "2027-01-01T00:00:00Z", incumbent_rate_per_sub_cents: 180 }
              as: StationGroupNegotiator
              as_user_id: "${st_id}"
              captures: { el2_id: "$.data.id" }
            - call: "POST /retrans/elections/${el1_id}/file"
              payload: {}
              as: StationGroupNegotiator
              as_user_id: "${st_id}"
          trigger:
            - call: "GET /retrans/elections"
              payload: { station_id: "${st_id}", limit: 1, offset: 0 }
              as: CarriageAdmin
              as_user_id: "admin-1"
              captures: { page1_first: "$.data[0].id" }
            - call: "GET /retrans/elections"
              payload: { station_id: "${st_id}", status: "NEGOTIATING", limit: 10, offset: 0 }
              as: CarriageAdmin
              as_user_id: "admin-1"
              captures: { filtered_first: "$.data[0].id" }
          assert:
            - "The first response carries total_count == 2, has_more == true, limit == 1, offset == 0 and exactly 1 element"
            - "${page1_first} == ${el1_id} (created_at ASC ordering)"
            - "The filtered response carries total_count == 1 and has_more == false"
            - "${filtered_first} == ${el1_id} and CarriageElection.${el2_id}.status == DRAFT (excluded by the filter)"

      - name: corner_one_distributor_faces_two_stations_through_election_junction
        claim_type: graph
        grounds:
          - complexity_profile.entity_topology
          - entities.CarriageElection.fields.station_id
          - entities.CarriageElection.fields.distributor_id
          - endpoints[GET /retrans/elections]
        distinguishing_aspect: "CarriageElection is the many-to-many junction of the Station and Distributor axes: one distributor filtered by distributor_id returns two elections belonging to two different stations, each with its own independent negotiation."
        test_recipe:
          setup:
            - "Two CBS stations, each with an ACTIVE affiliation, and one shared CABLE distributor"
            - "Both stations file a RETRANS_CONSENT election against that distributor"
          setup_api_calls:
            - call: "POST /retrans/stations"
              payload: { call_sign: "WXYZ", market_code: "SEA", dma_rank: 12, market_tv_households: 1800000, network_affiliation: "CBS" }
              as: CarriageAdmin
              as_user_id: "admin-1"
              captures: { st1_id: "$.data.id" }
            - call: "POST /retrans/stations"
              payload: { call_sign: "WQRS", market_code: "SPO", dma_rank: 73, market_tv_households: 420000, network_affiliation: "CBS" }
              as: CarriageAdmin
              as_user_id: "admin-1"
              captures: { st2_id: "$.data.id" }
            - call: "POST /retrans/stations/${st1_id}/affiliation-agreements"
              payload: { network_name: "CBS", term_end_utc: "2032-01-01T00:00:00Z", reverse_comp_floor_per_sub_cents: 90, split_premium_bp: 500, permitted_tiers: ["BROADCAST_BASIC", "EXPANDED_BASIC"], digital_rights_grantable: true, ooh_rights_grantable: false, streaming_rights_grantable: true }
              as: CarriageAdmin
              as_user_id: "admin-1"
            - call: "POST /retrans/stations/${st2_id}/affiliation-agreements"
              payload: { network_name: "CBS", term_end_utc: "2032-01-01T00:00:00Z", reverse_comp_floor_per_sub_cents: 80, split_premium_bp: 0, permitted_tiers: ["BROADCAST_BASIC", "EXPANDED_BASIC"], digital_rights_grantable: false, ooh_rights_grantable: false, streaming_rights_grantable: false }
              as: CarriageAdmin
              as_user_id: "admin-1"
            - call: "POST /retrans/distributors"
              payload: { name: "Cascade Cable", distributor_type: "CABLE", subscriber_measurement_method: "BILLED_HOUSEHOLDS", video_household_count: 240000 }
              as: CarriageAdmin
              as_user_id: "admin-1"
              captures: { dist_id: "$.data.id" }
            - call: "POST /retrans/elections"
              payload: { station_id: "${st1_id}", distributor_id: "${dist_id}", cycle_label: "2027-2029", election_type: "RETRANS_CONSENT", requested_tier: "EXPANDED_BASIC", incumbent_expiry_utc: "2027-01-01T00:00:00Z", incumbent_rate_per_sub_cents: 220 }
              as: StationGroupNegotiator
