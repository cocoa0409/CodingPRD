    # =====================================================================
    # SECTION 8 -- cross_cutting_complexity_layers
    # Exactly the five layers declared in §1.0 complexity_profile:
    # optimistic_concurrency (one instance per §1.2.1 rule),
    # cascading_side_effects, dual_variant_calculation,
    # version_pinning_on_approval, selector_policy.
    # =====================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: layer_occ_stale_trial_version_on_return_authorization
        claim_type: optimistic_concurrency
        grounds: [complexity_layers.optimistic_concurrency, concurrency_rules.trial_return_stale_trial, errors.ERR_STALE_TRIAL_VERSION]
        distinguishing_aspect: "A goodwill extension bumps TrialPeriod.version, so a return authorization pinned to the pre-extension version is 412 ERR_STALE_TRIAL_VERSION; replaying with the observed version succeeds and creates exactly one RA."
        test_recipe:
          setup:
            - "Canonical delivered order at 2026-08-01 with an ACTIVE trial (nominal_end 2026-09-15). The client observes version v0, then CareOpsAgent grants 5 extension days, moving effective_end_utc to 2026-09-20 and version to v0+1."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /state-policies", payload: { state_code: "CA", otc_sales_permitted: true, telehealth_fitting_permitted: true, min_age_years: 18, trial_period_days: 45, restocking_fee_mode: "FLAT_PCT", restocking_fee_pct: 0.1, restocking_fee_cap_cents: 0, shipping_refundable: false, referral_validity_days: 180, waiver_required: false, max_loss_damage_claims: 2 }, as: PlatformAdmin, captures: { pol_ca: "$.data.id" } }
            - { call: "POST /inventory-pools", payload: { sku: "NEO-M-OPEN", model: "NEO", dome_size: "M", tip_type: "OPEN" }, as: PlatformAdmin, captures: { pool_mo: "$.data.id" } }
            - { call: "POST /inventory-pools/${pool_mo}/restock", payload: { units: 5 }, as: PlatformAdmin }
            - { call: "POST /devices", payload: { serial_number: "SN-L001", model: "NEO", firmware_version: "4.0.0" }, as: PlatformAdmin }
            - { call: "POST /patients", payload: { state_policy_id: "${pol_ca}", email: "l1@x.test", full_name: "L One", age_years: 70 }, as: CareOpsAgent, captures: { pat_l1: "$.data.id" } }
            - { call: "POST /patients/${pat_l1}/screening-sessions", payload: {}, as: Patient, as_user_id: "${pat_l1}", captures: { scr_l1: "$.data.id" } }
            - { call: "PATCH /screening-sessions/${scr_l1}", payload: { pure_tone_avg_db: 40.0, asymmetry_db: 5.0, self_reported_difficulty_score: 20, speech_in_noise_pct: 70.0, symptom_codes: [] }, as: Patient, as_user_id: "${pat_l1}" }
            - { call: "POST /screening-sessions/${scr_l1}/submit", payload: {}, as: Patient, as_user_id: "${pat_l1}" }
            - { call: "POST /patients/${pat_l1}/device-orders", payload: { model: "NEO", dome_size: "M", tip_type: "OPEN", list_price_cents: 200000, discount_cents: 0, accessory_subtotal_cents: 0, shipping_cents: 1495 }, as: Patient, as_user_id: "${pat_l1}", captures: { ord_l1: "$.data.id" } }
            - { call: "POST /_payments/simulate", payload: { device_order_id: "${ord_l1}", outcome: "AUTHORIZED" }, as: PlatformAdmin }
            - { call: "POST /device-orders/${ord_l1}/confirm-fit", payload: {}, as: CareOpsAgent }
            - { call: "POST /device-orders/${ord_l1}/ship", payload: {}, as: CareOpsAgent }
            - { call: "POST /_shipments/scan", payload: { device_order_id: "${ord_l1}", event: "DELIVERED" }, as: PlatformAdmin }
            - { call: "GET /trial-periods?device_order_id=${ord_l1}", payload: {}, as: CareOpsAgent, captures: { trial_l1: "$.data[0].id", trial_l1_v0: "$.data[0].version" } }
            - { call: "POST /trial-periods/${trial_l1}/extend", payload: { extension_days: 5 }, as: CareOpsAgent, note: "version -> v0+1, effective_end_utc 2026-09-20" }
          trigger:
            - { call: "POST /trial-periods/${trial_l1}/return-authorizations", payload: { expected_trial_period_version: "${trial_l1_v0}" }, as: Patient, as_user_id: "${pat_l1}" }
          assert:
            - "HTTP 412"
            - "data.error_id == \"ERR_STALE_TRIAL_VERSION\""
            - "GET /return-authorizations?device_order_id=${ord_l1}&limit=10&offset=0 returns data.total_count == 0"
            - "GET /trial-periods/${trial_l1} returns data.status == \"ACTIVE\", data.extension_days_granted == 5, data.effective_end_utc == \"2026-09-20T00:00:00Z\" and data.version == ${trial_l1_v0} + 1"
            - "replaying the same POST with expected_trial_period_version = ${trial_l1_v0} + 1 returns 201 and the trial moves to RETURN_REQUESTED"

      - name: layer_occ_stale_order_version_on_fit_exchange
        claim_type: optimistic_concurrency
        grounds: [complexity_layers.optimistic_concurrency, concurrency_rules.fit_exchange_stale_order, errors.ERR_STALE_ORDER_VERSION]
