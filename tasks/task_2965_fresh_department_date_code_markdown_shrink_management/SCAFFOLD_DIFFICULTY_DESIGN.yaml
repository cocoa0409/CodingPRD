              payload: { item_id: "${item_id}", production_date: "2026-08-05", quantity_original: 24 }
              as: FreshClerk
              captures: { lot_id: $.data.id, lot_v1: $.data.version, est_at_create: $.data.expected_sell_through_pct }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-12T00:00:00.000Z" }
              as: StoreOperationsAdmin
            - call: "GET /fresh/departments/${dept_id}"
              payload: {}
              as: DepartmentManager
              captures: { liability_before: $.data.markdown_liability_cents }
          trigger:
            - call: "POST /fresh/lots/${lot_id}/markdowns"
              payload: { expected_lot_version: "${lot_v1}" }
              as: DepartmentManager
              captures: { label_id: $.data.id, label_price: $.data.to_price_cents, label_status: $.data.status }
            - call: "GET /fresh/departments/${dept_id}"
              payload: {}
              as: DepartmentManager
              captures: { liability_marked: $.data.markdown_liability_cents }
            - call: "GET /fresh/lots/${lot_id}"
              payload: {}
              as: DepartmentManager
              captures: { est_marked: $.data.expected_sell_through_pct, qoh_marked: $.data.quantity_on_hand }
            - call: "POST /fresh/lots/${lot_id}/markdown-void"
              payload: { reason_note: "priced in error, restoring base retail" }
              as: DepartmentManager
              captures: { status_void: $.data.status, price_void: $.data.current_price_cents, rung_void: $.data.current_rung_index, discount_void: $.data.total_discount_pct, est_void: $.data.expected_sell_through_pct, qoh_void: $.data.quantity_on_hand }
            - call: "GET /fresh/departments/${dept_id}"
              payload: {}
              as: DepartmentManager
              captures: { liability_after: $.data.markdown_liability_cents }
          assert:
            - "${est_at_create} == 66.67 and ${liability_before} == 0"
            - "${label_price} == 509 and ${label_status} == QUEUED"
            - "${liability_marked} == 2160, which is 24 * (599 - 509)"
            - "${est_marked} == 50.00, recomputed at days_remaining 3 with no APPLIED label"
            - "${status_void} == FRESH"
            - "${price_void} == 599 and ${rung_void} == -1 and ${discount_void} == 0"
            - "${liability_after} == 0, exactly the pre-markdown value with no residue"
            - "MarkdownLabel.${label_id}.status == VOIDED"
            - "${est_void} == 50.00, unchanged by the void because no units moved"
            - "${qoh_marked} == 24 and ${qoh_void} == 24 and DateCodeLot.${lot_id}.units_sold == 0 and DateCodeLot.${lot_id}.units_shrunk == 0"
            - "DateCodeLot.${lot_id}.markdown_giveback_cents == 0, because no unit was ever sold at the marked-down price"
