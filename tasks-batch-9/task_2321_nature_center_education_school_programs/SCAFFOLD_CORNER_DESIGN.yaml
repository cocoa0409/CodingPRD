      - name: stewardship_machines_reject_transitions_that_skip_the_open_state
        claim_type: Invalid Transitions
        grounds:
          - validations.priority_14
          - errors.ERR_INVALID_PERMIT_STATE
          - errors.ERR_INVALID_ANIMAL_STATE
          - errors.ERR_INVALID_TRAIL_STATE
          - state_machines.Permit
          - state_machines.AnimalAmbassador
          - state_machines.TrailSegment
        distinguishing_aspect: |
          All three stewardship machines are shaped as hubs: every side state returns only to the
          neutral state, never sideways to another side state. The instance drives each row into
          one side state and then asks for a sibling side state, which is the transition an
          implementation built from a flat enum would wrongly allow.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-28T07:00:00Z"
            - "Permit lap_permit driven ACTIVE -> LAPSED"
            - "AnimalAmbassador an_id driven AVAILABLE -> VET_HOLD on its own ACTIVE permit"
            - "TrailSegment trail_id driven OPEN -> CLOSED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-28T07:00:00Z" }
              as: EducationDirector
              as_user_id: "ed-01"
            - call: "POST /nature-center/permits"
              payload: { agency: "USFWS", permit_number: "MB-2026-118", valid_from: "2026-01-01T00:00:00Z", valid_to: "2027-12-31T00:00:00Z" }
              as: StewardshipManager
              as_user_id: "sm-01"
              captures: { an_permit: $.data.id }
            - call: "POST /nature-center/animals"
              payload: { common_name: "Eastern Screech Owl", species_code: "MEAS", permit_id: "${an_permit}", handling_tier_required: "TIER_1", contact_rule: "VIEW_ONLY", weekly_exposure_cap_minutes: 240 }
              as: StewardshipManager
              as_user_id: "sm-01"
              captures: { an_id: $.data.id }
            - call: "POST /nature-center/trail-segments"
              payload: { name: "Oxbow Loop", capacity_persons: 60, habitat_sensitivity: "LOW", weekly_visitor_budget_persons: 300, recovery_buffer_minutes: 30 }
              as: StewardshipManager
              as_user_id: "sm-01"
              captures: { trail_id: $.data.id }
            - call: "POST /nature-center/permits"
              payload: { agency: "STATE_DNR", permit_number: "DNR-2026-441", valid_from: "2026-01-01T00:00:00Z", valid_to: "2027-12-31T00:00:00Z" }
              as: StewardshipManager
              as_user_id: "sm-01"
              captures: { lap_permit: $.data.id }
            - call: "POST /nature-center/permits/${lap_permit}/set-status"
              payload: { status: "LAPSED", note: "Renewal paperwork outstanding" }
              as: StewardshipManager
              as_user_id: "sm-01"
            - call: "POST /nature-center/animals/${an_id}/set-care-status"
              payload: { status: "VET_HOLD", note: "Beak abrasion" }
              as: StewardshipManager
              as_user_id: "sm-01"
            - call: "POST /nature-center/trail-segments/${trail_id}/set-status"
              payload: { status: "CLOSED", note: "Washout at the boardwalk" }
              as: StewardshipManager
              as_user_id: "sm-01"
          trigger:
            - call: "POST /nature-center/permits/${lap_permit}/set-status"
              payload: { status: "SUSPENDED" }
