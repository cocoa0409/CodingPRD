# mini-swe-agent overrides for OpenAI models on Amazon Bedrock (bedrock-runtime OpenAI-compatible endpoint).
# Layered on top of the builtin mini.yaml by harbor (-c mini -c <this file>).
# Use with:
#   harbor run -a mini-swe-agent -m openai/global.openai.gpt-6-astra \
#     --ak config_file=harbor_utils/mini-bedrock.yaml --ak reasoning_effort=xhigh \
#     --ae MSWEA_API_KEY="$AWS_BEARER_TOKEN_BEDROCK" --ae OPENAI_API_KEY="$AWS_BEARER_TOKEN_BEDROCK" \
#     --ae OPENAI_BASE_URL=https://bedrock-runtime.us-east-1.amazonaws.com/openai/v1 \
#     --ae MSWEA_MODEL_RETRY_STOP_AFTER_ATTEMPT=30
# bedrock-runtime sometimes accepts a request and never answers under load; a per-request timeout
# turns such a stall into a retry instead of a multi-minute hang.
model:
  model_kwargs:
    timeout: 300
