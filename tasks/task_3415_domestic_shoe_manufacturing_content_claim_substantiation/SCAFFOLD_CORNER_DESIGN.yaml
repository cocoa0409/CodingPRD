  # ===========================================================================
  - section: endpoints
    instances:

      - name: success_envelope_shape_on_create
        claim_type: Standard CRUD
        grounds:
          - response_envelope.success
          - endpoints.POST_/footwear/components
        distinguishing_aspect: "Every success response carries meta.api_request_id + meta.api_request_timestamp, response_type 'object', and the entity under data; a component create is the probe."
        test_recipe:
          setup:
            - "Empty database (logical clock default)."
          setup_api_calls: []
          trigger:
            - *k_comp_t
          assert:
            - "the response status is 201 with response_type == 'object'"
            - "meta.api_request_id is a non-empty string and meta.api_request_timestamp is an ISO-8601 timestamp"
            - "data carries the Component with server-minted id, created_at, updated_at, version == 1"

      - name: error_envelope_shape_on_business_error
        claim_type: Standard CRUD
        grounds:
          - response_envelope.error
          - errors.ERR_STYLE_CODE_EXISTS
        distinguishing_aspect: "Every error response carries response_type 'error' and data.error_id + data.message; a duplicate style_code create is the probe (409)."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; factory, component, model MSTD."
          setup_api_calls:
            - *k_clk
            - *k_fac
            - *k_comp_t
            - *k_model_std
          trigger:
            - call: "POST /footwear/models"
              payload: { style_code: "MSTD", production_policy: "IMPORT_ONLY", base_price_cents: 9000, import_cost_basis_cents: 4000, bom_lines: [ { component_id: "${c_t}", quantity_per_pair: 1.0, sourcing_requirement: "IMPORT_ALLOWED", planned_unit_cost_cents: 100, planned_is_domestic: false } ], standard_stitching_minutes: 0, standard_lasting_minutes: 0, standard_assembly_minutes: 0 }
              as: SourcingManager
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 with response_type == 'error'"
            - "data.error_id == ERR_STYLE_CODE_EXISTS and data.message is a non-empty string"
            - "meta.api_request_id is present on error responses too"

      - name: runs_list_filters_by_factory_status_and_week
        claim_type: Listing
        grounds:
          - endpoints.GET_/footwear/production-runs
        distinguishing_aspect: "Filter interaction: runs of the same factory in two different weeks and states — factory_id+iso_week pins the week, status pins the lifecycle stage, and filters compose."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; standard kit; run A (W36, PLANNED) and run B (W37, MATERIAL_RESERVED after lock+reserve); both STOCK on lines 1 and 1 respectively (different weeks)."
          setup_api_calls:
            - *k_clk
            - *k_fac
            - *k_comp_t
            - *k_lot_t
            - *k_model_std
            - *k_alloc
            - *k_run_std
            - *k_lock
            - *k_alloc_open
            - &k_run_b37
              call: "POST /footwear/production-runs"
              payload: { model_id: "${m_id}", factory_id: "${f_id}", run_type: "STOCK", planned_units: 10, line_index: 1, start_day: "2026-09-14", end_day: "2026-09-18", iso_week: "2026-W37" }
              as: ProductionPlanner
              captures: { r_b: $.data.id }
            - *k_lock_w37
            - &k_reserve_b
              call: "POST /footwear/production-runs/${r_b}/reserve-materials"
              payload: {}
              as: ProductionPlanner
          trigger:
            - call: "GET /footwear/production-runs"
              payload: { factory_id: "${f_id}", iso_week: "2026-W37" }
              as: ProductionPlanner
              captures: { n_w37: "$.data[0].id" }
            - call: "GET /footwear/production-runs"
              payload: { factory_id: "${f_id}", status: "PLANNED" }
              as: ProductionPlanner
          assert:
            - "GET ?factory_id=${f_id}&iso_week=2026-W37 returns exactly 1 row: run ${r_b}"
            - "GET ?factory_id=${f_id}&status=PLANNED returns exactly 1 row: run ${r_id} (run B is MATERIAL_RESERVED)"
            - "GET ?factory_id=${f_id} returns 2 rows with total_count == 2"

      - name: fk_reverse_reachability_spot_checks
        claim_type: Parent Relationships
        grounds:
          - endpoints.GET_/footwear/lots
          - endpoints.GET_/footwear/workers/{id}/training-enrollments
          - endpoints.GET_/footwear/label-claims
          - endpoints.GET_/footwear/production-runs/{id}/content-reports
        distinguishing_aspect: "Every declared FK has a working reverse GET: lots by component_id, enrollments by worker (sub-resource), claims by model_id, and reports nested under their run — each returns an array (0..n)."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; standard kit incl. PLANNED run; worker Ada with one ENROLLED enrollment; DRAFT claim on MSTD; one PROVISIONAL report on the run."
          setup_api_calls:
            - *k_clk
            - *k_fac
            - *k_comp_t
            - *k_lot_t
            - *k_model_std
            - *k_alloc
            - *k_run_std
            - *k_w_std
            - *k_enr_80
            - *k_claim_std
            - call: "GET /footwear/production-runs/${r_id}"
              payload: {}
              as: ProductionPlanner
              captures: { run_v: $.data.version }
            - call: "POST /footwear/production-runs/${r_id}/content-reports"
              payload: { variant: "PROVISIONAL", expected_run_version: "${run_v}" }
              as: ProductionPlanner
          trigger:
            - call: "GET /footwear/lots"
              payload: { component_id: "${c_t}" }
              as: SourcingManager
            - call: "GET /footwear/workers/${w1}/training-enrollments"
              payload: {}
              as: TrainingCoordinator
            - call: "GET /footwear/label-claims"
              payload: { model_id: "${m_id}" }
              as: ComplianceOfficer
            - call: "GET /footwear/production-runs/${r_id}/content-reports"
              payload: {}
              as: ProductionPlanner
          assert:
            - "GET /footwear/lots?component_id=${c_t} returns exactly the 1 lot ${l_t}"
            - "GET /footwear/workers/${w1}/training-enrollments returns exactly the 1 enrollment ${e80}"
            - "GET /footwear/label-claims?model_id=${m_id} returns exactly the 1 claim ${cl_id}"
            - "GET /footwear/production-runs/${r_id}/content-reports returns exactly the 1 PROVISIONAL report"
            - "GET /footwear/label-claims?model_id=<unknown-uuid> returns an empty array with total_count 0 (not a 404 — filters are not path ids)"

  # ===========================================================================
  - section: errors
    instances:

      - name: err_factory_not_active_corner
        claim_type: violation_to_error
        grounds:
          - errors.ERR_FACTORY_NOT_ACTIVE
        excluded_because:
          difficulty_instance: run_reserve_requires_factory_active_cross_entity
          rationale: "Triggered and asserted (409) by the named §1.8 instance, including the reactivate-then-succeed leg."

      - name: err_content_threshold_not_met_corner
        claim_type: violation_to_error
        grounds:
          - errors.ERR_CONTENT_THRESHOLD_NOT_MET
        excluded_because:
          difficulty_instance: substantiate_threshold_safety_beats_evidence_referential
          rationale: "Triggered at 94.99 and asserted by the named §1.8 instance."

      - name: err_capacity_week_exceeded_corner
        claim_type: violation_to_error
        grounds:
          - errors.ERR_CAPACITY_WEEK_EXCEEDED
        excluded_because:
          difficulty_instance: weekly_capacity_pool_exact_fit_boundary
          rationale: "Exact-fit vs +1 overflow asserted by the named §1.8 instance."

      - name: err_line_window_conflict_corner
        claim_type: violation_to_error
        grounds:
          - errors.ERR_LINE_WINDOW_CONFLICT
        excluded_because:
          difficulty_instance: line_window_half_open_overlap_semantics
          rationale: "Half-open adjacency vs interior overlap asserted by the named §1.8 instance."

      - name: err_gov_contract_window_conflict_corner
        claim_type: violation_to_error
        grounds:
          - errors.ERR_GOV_CONTRACT_WINDOW_CONFLICT
        excluded_because:
          difficulty_instance: contract_window_closed_interval_overlap_semantics
          rationale: "Closed-interval touching-endpoint collision asserted by the named §1.8 instance."

      - name: err_material_shortage_vs_domestic_shortage
        claim_type: violation_to_error
        grounds:
          - errors.ERR_MATERIAL_SHORTAGE
          - errors.ERR_DOMESTIC_MATERIAL_SHORTAGE
          - calculations.fifo_lot_consumption
        distinguishing_aspect: "Plain quantity shortage on an IMPORT_ALLOWED line (needs 10, only 5 on hand) yields 409 ERR_MATERIAL_SHORTAGE; the pinned BOM array order decides which line fails first when several are short. The origin-filtered companion error ERR_DOMESTIC_MATERIAL_SHORTAGE is covered by domestic_material_shortage_only_imported_stock."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; factory; thread lot of only 5 units; model MSHORT with BOM line 1 thread 1.0 IMPORT_ALLOWED and line 2 upper 1.0 DOMESTIC_REQUIRED; upper lot of 10 IMPORTED units; two STOCK runs of 10 (separate models) created pre-lock."
          setup_api_calls:
            - *k_clk
            - *k_fac
            - *k_comp_t
            - *k_comp_a
            - &k_lot_t5
              call: "POST /footwear/lots"
              payload: { component_id: "${c_t}", supplier_name: "Fall River Mills", is_domestic: true, quantity_received: 5, unit_cost_cents: 100 }
              as: SourcingManager
            - &k_lot_a_imp
              call: "POST /footwear/lots"
              payload: { component_id: "${c_a}", supplier_name: "Incheon Leather", is_domestic: false, quantity_received: 10, unit_cost_cents: 900 }
              as: SourcingManager
            - &k_model_short
              call: "POST /footwear/models"
              payload: { style_code: "MSHORT", production_policy: "DUAL_SOURCE", base_price_cents: 5000, import_cost_basis_cents: 2000, bom_lines: [ { component_id: "${c_t}", quantity_per_pair: 1.0, sourcing_requirement: "IMPORT_ALLOWED", planned_unit_cost_cents: 100, planned_is_domestic: false }, { component_id: "${c_a}", quantity_per_pair: 1.0, sourcing_requirement: "DOMESTIC_REQUIRED", planned_unit_cost_cents: 900, planned_is_domestic: true } ], standard_stitching_minutes: 0, standard_lasting_minutes: 0, standard_assembly_minutes: 0 }
              as: SourcingManager
              captures: { m_id: $.data.id }
            - *k_alloc
            - *k_run_std
            - *k_lock
          trigger:
            - call: "POST /footwear/production-runs/${r_id}/reserve-materials"
              payload: {}
              as: ProductionPlanner
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and err == ERR_MATERIAL_SHORTAGE: fifo_lot_consumption evaluates BOM lines in array order, and line 1 (thread, IMPORT_ALLOWED, needs 10, only 5 on hand) fails before line 2 is ever checked"
            - "the failed reservation is atomic: the thread lot still has quantity_remaining == 5, the upper lot is untouched at 10, and the run stays PLANNED with consumed_lots []"

      - name: domestic_material_shortage_only_imported_stock
        claim_type: violation_to_error
        grounds:
          - errors.ERR_DOMESTIC_MATERIAL_SHORTAGE
          - calculations.fifo_lot_consumption
        distinguishing_aspect: "A DOMESTIC_REQUIRED line with plentiful IMPORTED stock but zero domestic stock fails with ERR_DOMESTIC_MATERIAL_SHORTAGE (409) — eligibility is filtered by origin before quantity is considered; the run stays PLANNED and no lot is touched (atomic abort)."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; factory; upper component; imported upper lot of 100 @900; model MDOMREQ whose single BOM line is 1.0 upper DOMESTIC_REQUIRED; STOCK run of 10 pre-lock."
          setup_api_calls:
            - *k_clk
            - *k_fac
            - *k_comp_a
            - &k_lot_a_imp2
              call: "POST /footwear/lots"
              payload: { component_id: "${c_a}", supplier_name: "Incheon Leather", is_domestic: false, quantity_received: 100, unit_cost_cents: 900 }
              as: SourcingManager
            - &k_model_domreq
              call: "POST /footwear/models"
              payload: { style_code: "MDOMREQ", production_policy: "DUAL_SOURCE", base_price_cents: 5000, import_cost_basis_cents: 2000, bom_lines: [ { component_id: "${c_a}", quantity_per_pair: 1.0, sourcing_requirement: "DOMESTIC_REQUIRED", planned_unit_cost_cents: 900, planned_is_domestic: true } ], standard_stitching_minutes: 0, standard_lasting_minutes: 0, standard_assembly_minutes: 0 }
              as: SourcingManager
              captures: { m_id: $.data.id }
            - *k_alloc
            - *k_run_std
            - *k_lock
          trigger:
            - call: "POST /footwear/production-runs/${r_id}/reserve-materials"
              payload: {}
              as: ProductionPlanner
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and err == ERR_DOMESTIC_MATERIAL_SHORTAGE (100 imported units do not count toward a DOMESTIC_REQUIRED line)"
            - "the upper lot's quantity_remaining is still 100 and the run stays PLANNED with consumed_lots []"

      - name: workforce_shortfall_blocks_run_start
        claim_type: violation_to_error
        grounds:
          - errors.ERR_WORKFORCE_SHORTFALL
          - calculations.skill_coverage_score
        distinguishing_aspect: "Run start with an empty roster fails on the first short operation (STITCHING needs 2, has 0): 422 ERR_WORKFORCE_SHORTFALL; the run stays MATERIAL_RESERVED with its lots consumed."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; standard kit; STOCK run of 10 MATERIAL_RESERVED; NO workers at the factory."
          setup_api_calls:
            - *k_clk
            - *k_fac
            - *k_comp_t
            - *k_lot_t
            - *k_model_std
            - *k_alloc
            - *k_run_std
            - *k_lock
            - *k_reserve
          trigger:
            - call: "POST /footwear/production-runs/${r_id}/start"
              payload: {}
              as: ProductionPlanner
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 422 and err == ERR_WORKFORCE_SHORTFALL"
            - "the run remains MATERIAL_RESERVED (lots stay consumed: thread lot at 990)"

      - name: clock_regression_is_rejected
        claim_type: violation_to_error
        grounds:
          - errors.ERR_CLOCK_REGRESSION
          - endpoints.POST_/_clock/set_current_utc
        distinguishing_aspect: "The logical clock is monotone: after setting 2026-09-05, a set to 2026-09-04 returns 400 ERR_CLOCK_REGRESSION; setting the SAME timestamp is allowed (idempotent)."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
          setup_api_calls:
            - *k_clk
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-04T00:00:00Z" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: PlatformAdmin
              captures: { cur: $.data.current_utc }
          assert:
            - "the backward set: 400 and err == ERR_CLOCK_REGRESSION"
            - "re-setting the current timestamp exactly: 200 and cur == '2026-09-05T00:00:00Z'"

  # ===========================================================================
  - section: rbac
    instances:

      - name: sourcing_manager_cannot_verify_evidence
        claim_type: RBAC denial
        grounds:
          - roles.SourcingManager
          - roles.ComplianceOfficer
          - errors.ERR_FORBIDDEN_ROLE
        distinguishing_aspect: "Evidence verification is ComplianceOfficer-exclusive: a SourcingManager (who may UPLOAD evidence) is denied with 403 ERR_FORBIDDEN_ROLE — upload and adjudication are different roles."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; factory, component, lot; a SUBMITTED lot-linked origin cert (uploaded by sm-1)."
          setup_api_calls:
            - *k_clk
            - *k_fac
            - *k_comp_t
            - *k_lot_t
            - &k_doc_rbac
              call: "POST /footwear/evidence-documents"
              payload: { doc_type: "SUPPLIER_ORIGIN_CERT", issuer: "Fall River Mills", valid_from: "2026-08-01", valid_until: "2027-08-31", material_lot_id: "${l_t}" }
              as: SourcingManager
              as_user_id: "sm-1"
              captures: { d_id: $.data.id }
          trigger:
            - call: "POST /footwear/evidence-documents/${d_id}/verify"
              payload: {}
              as: SourcingManager
              as_user_id: "sm-1"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 403 and err == ERR_FORBIDDEN_ROLE"
            - "EvidenceDocument.${d_id} remains SUBMITTED"

      - name: training_coordinator_cannot_create_factory
        claim_type: RBAC denial
        grounds:
          - roles.TrainingCoordinator
          - roles.PlatformAdmin
          - errors.ERR_FORBIDDEN_ROLE
        distinguishing_aspect: "Factory creation is PlatformAdmin-exclusive; TrainingCoordinator gets 403 ERR_FORBIDDEN_ROLE and no factory is persisted."
        test_recipe:
          setup:
            - "Empty database (logical clock default)."
          setup_api_calls: []
          trigger:
            - call: "POST /footwear/factories"
              payload: { factory_name: "Rogue Plant", location_type: "DOMESTIC", weekly_capacity_units: 10, line_count: 1, labor_rate_cents_per_minute: 1, overhead_cents_per_pair: 1 }
              as: TrainingCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 403 and err == ERR_FORBIDDEN_ROLE"
            - "a subsequent GET /footwear/factories (as PlatformAdmin) returns 0 rows"

      - name: production_planner_cannot_publish_claim
        claim_type: RBAC denial
        grounds:
          - roles.ProductionPlanner
          - roles.ComplianceOfficer
          - errors.ERR_FORBIDDEN_ROLE
        distinguishing_aspect: "Role check (priority 2) precedes state check (priority 6): a ProductionPlanner publishing a DRAFT claim gets 403 ERR_FORBIDDEN_ROLE, not 409 ERR_INVALID_STATE — the denial proves role, not state."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; factory, component, model; DRAFT claim on MSTD."
          setup_api_calls:
            - *k_clk
            - *k_fac
            - *k_comp_t
            - *k_model_std
            - *k_claim_std
          trigger:
            - call: "POST /footwear/label-claims/${cl_id}/publish"
              payload: {}
              as: ProductionPlanner
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 403 and err == ERR_FORBIDDEN_ROLE (a DRAFT claim would otherwise fail with 409 — the role error proves ordering)"
            - "LabelClaim.${cl_id} remains DRAFT"

      - name: custom_program_customer_cannot_accept_orders
        claim_type: RBAC denial
        grounds:
          - roles.CustomProgramCustomer
          - roles.ProductionPlanner
          - errors.ERR_FORBIDDEN_ROLE
        distinguishing_aspect: "Customers submit and cancel but never accept: accept as CustomProgramCustomer on their own order is 403 ERR_FORBIDDEN_ROLE."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; factory, component, model; order (buyer cust-1) SUBMITTED."
          setup_api_calls:
            - *k_clk
            - *k_fac
            - *k_comp_t
            - *k_model_std
            - *k_order_std
          trigger:
            - call: "POST /footwear/custom-orders/${o_id}/accept"
              payload: {}
              as: CustomProgramCustomer
              as_user_id: "cust-1"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 403 and err == ERR_FORBIDDEN_ROLE"
            - "CustomOrder.${o_id} remains SUBMITTED with quoted_price_cents null"

      - name: factory_manager_holds_own_factory_run_but_not_others
        claim_type: RBAC denial
        grounds:
          - roles.FactoryManager
          - errors.ERR_FACTORY_OWNERSHIP_MISMATCH
          - state_machines.ProductionRun.IN_PRODUCTION_to_QUALITY_HOLD
        distinguishing_aspect: "Entity-backed identity: FactoryManager with X-User-ID == factory F1's id holds F1's IN_PRODUCTION run (200) but is denied on F2's run (403 ERR_FACTORY_OWNERSHIP_MISMATCH) — and the ownership check fires before the state check, which a planner hitting the same PLANNED run sees as 409."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; factory F1 with an IN_PRODUCTION STOCK run (full workforce); second factory F2 with a merely-PLANNED run of the same model."
          setup_api_calls:
            - *k_clk
            - *k_fac
            - *k_comp_t
            - *k_lot_t
            - *k_model_std
            - *k_alloc
            - *k_run_std
            - *k_lock
            - *k_reserve
            - *k_w1c
            - *k_w1es
            - *k_w1as
            - *k_w1el
            - *k_w1al
            - *k_w1ea
            - *k_w1aa
            - *k_w2c
            - *k_w2es
            - *k_w2as
            - *k_w2el
            - *k_w2al
            - *k_w2ea
            - *k_w2aa
            - *k_start
            - &k_fac_f2
              call: "POST /footwear/factories"
              payload: { factory_name: "Second Plant", location_type: "DOMESTIC", weekly_capacity_units: 500, line_count: 1, labor_rate_cents_per_minute: 50, overhead_cents_per_pair: 600 }
              as: PlatformAdmin
              captures: { f2: $.data.id }
            - &k_run_f2
              call: "POST /footwear/production-runs"
              payload: { model_id: "${m_id}", factory_id: "${f2}", run_type: "STOCK", planned_units: 5, line_index: 1, start_day: "2026-09-07", end_day: "2026-09-11", iso_week: "2026-W36" }
              as: ProductionPlanner
              captures: { r_f2: $.data.id }
          trigger:
            - call: "POST /footwear/production-runs/${r_id}/hold"
              payload: {}
              as: FactoryManager
              as_user_id: "${f_id}"
              captures: { st_own: $.data.status }
            - call: "POST /footwear/production-runs/${r_f2}/hold"
              payload: {}
              as: FactoryManager
              as_user_id: "${f_id}"
              captures: { err: $.data.error_id }
            - call: "POST /footwear/production-runs/${r_f2}/hold"
              payload: {}
              as: ProductionPlanner
              captures: { err2: $.data.error_id }
          assert:
            - "own-factory hold: 200 and st_own == QUALITY_HOLD"
            - "foreign-factory hold: 403 and err == ERR_FACTORY_OWNERSHIP_MISMATCH (ownership precedes state — run2 is PLANNED and would otherwise 409)"
            - "planner hold on the same PLANNED run2: 409 and err2 == ERR_INVALID_STATE (planner role passes, state fails) — the two denials are layered, not merged"

      - name: customer_cancels_own_order_but_not_foreign_order
        claim_type: RBAC denial
        grounds:
          - roles.CustomProgramCustomer
          - errors.ERR_BUYER_REF_MISMATCH
        distinguishing_aspect: "Opaque-role ownership via buyer_ref: cust-1 cancels cust-1's own SUBMITTED order (200) but is denied on cust-2's order (403 ERR_BUYER_REF_MISMATCH); ProductionPlanner can cancel either (shared operation without the ownership clause)."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; factory, component, model; order A (buyer_ref cust-1, created by cust-1) and order B (buyer_ref cust-2, created by ProductionPlanner)."
          setup_api_calls:
            - *k_clk
            - *k_fac
            - *k_comp_t
            - *k_model_std
            - *k_order_std
            - &k_order_b
              call: "POST /footwear/custom-orders"
              payload: { model_id: "${m_id}", buyer_ref: "cust-2", colorway: "STD", size: "8", quantity_units: 1 }
              as: ProductionPlanner
              captures: { o_b: $.data.id }
          trigger:
            - call: "POST /footwear/custom-orders/${o_id}/cancel"
              payload: {}
              as: CustomProgramCustomer
              as_user_id: "cust-1"
              captures: { st_a: $.data.production_status }
            - call: "POST /footwear/custom-orders/${o_b}/cancel"
              payload: {}
              as: CustomProgramCustomer
              as_user_id: "cust-1"
              captures: { err: $.data.error_id }
            - call: "POST /footwear/custom-orders/${o_b}/cancel"
              payload: {}
              as: ProductionPlanner
              captures: { st_b: $.data.production_status }
          assert:
            - "own order: 200 and st_a == CANCELLED"
            - "foreign order as cust-1: 403 and err == ERR_BUYER_REF_MISMATCH"
            - "same foreign order as ProductionPlanner: 200 and st_b == CANCELLED (the ownership clause binds only CustomProgramCustomer)"

      - name: evidence_uploader_cannot_self_verify
        claim_type: RBAC denial
        grounds:
          - validations[priority=3]
          - errors.ERR_SELF_ATTESTATION_FORBIDDEN
          - entities.EvidenceDocument.fields.uploaded_by
        distinguishing_aspect: "Segregation of duties INSIDE the ComplianceOfficer role: co-1 uploads a document (allowed role) but co-1 may not verify or reject it (403 ERR_SELF_ATTESTATION_FORBIDDEN); co-2 — same role, different person — verifies it (200)."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; factory, component, lot; a SUBMITTED lot-linked origin cert uploaded by ComplianceOfficer co-1."
          setup_api_calls:
            - *k_clk
            - *k_fac
            - *k_comp_t
            - *k_lot_t
            - &k_doc_sod
              call: "POST /footwear/evidence-documents"
              payload: { doc_type: "SUPPLIER_ORIGIN_CERT", issuer: "Fall River Mills", valid_from: "2026-08-01", valid_until: "2027-08-31", material_lot_id: "${l_t}" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { d_id: $.data.id }
          trigger:
            - call: "POST /footwear/evidence-documents/${d_id}/verify"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { err1: $.data.error_id }
            - call: "POST /footwear/evidence-documents/${d_id}/reject"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { err2: $.data.error_id }
            - call: "POST /footwear/evidence-documents/${d_id}/verify"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-2"
              captures: { st_ok: $.data.status }
          assert:
            - "self-verify: 403 and err1 == ERR_SELF_ATTESTATION_FORBIDDEN"
            - "self-reject: 403 and err2 == ERR_SELF_ATTESTATION_FORBIDDEN"
            - "peer verify (co-2): 200 and st_ok == VERIFIED — uploaded_by == 'co-1' was recorded from the creator's X-User-ID"

  # ===========================================================================
  - section: complexity_layers
    instances:

      - name: occ_report_create_with_stale_run_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[report-create-stale-run]
          - errors.ERR_STALE_RUN_VERSION
          - endpoints.POST_/footwear/production-runs/{id}/content-reports
        distinguishing_aspect: "True OCC on ProductionRun.version: after a successful report creation bumps the run from v2 to v3, replaying the same call with the client's last-observed v2 is rejected 412 ERR_STALE_RUN_VERSION — two strictly sequential requests, no parallelism; the first report stays ACTIVE and no supersede happens."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; standard kit; STOCK run of 10 MATERIAL_RESERVED (version 2 after reserve)."
          setup_api_calls:
            - *k_clk
            - *k_fac
            - *k_comp_t
            - *k_lot_t
            - *k_model_std
            - *k_alloc
            - *k_run_std
            - *k_lock
            - *k_reserve
            - call: "GET /footwear/production-runs/${r_id}"
              payload: {}
              as: ProductionPlanner
              captures: { run_v: $.data.version }
          trigger:
            - call: "POST /footwear/production-runs/${r_id}/content-reports"
              payload: { variant: "PROVISIONAL", expected_run_version: "${run_v}" }
              as: ProductionPlanner
              captures: { rep1: $.data.id }
            - call: "POST /footwear/production-runs/${r_id}/content-reports"
              payload: { variant: "PROVISIONAL", expected_run_version: "${run_v}" }
              as: ProductionPlanner
              captures: { err: $.data.error_id }
          assert:
            - "first create with the observed version (2): 201, report ${rep1} ACTIVE"
            - "second create with the now-stale version: 412 and err == ERR_STALE_RUN_VERSION (the successful create bumped the run to version 3)"
            - "still exactly one PROVISIONAL report exists and it is ACTIVE — a stale writer does not supersede"

      - name: occ_shift_with_stale_allocation_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[allocation-shift-stale-version]
          - errors.ERR_STALE_ALLOCATION_VERSION
          - endpoints.POST_/footwear/capacity-allocations/{id}/shift
        distinguishing_aspect: "True OCC on CapacityAllocation.version: after a first shift moves the pools (and bumps the version), a second shift carrying the pre-shift version is rejected 412 ERR_STALE_ALLOCATION_VERSION and the pools stay where the first shift left them."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; factory; week 2026-W36 allocation total 100, LOCKED with zero demand (domestic 0 / import 100, version 2)."
          setup_api_calls:
            - *k_clk
            - *k_fac
            - *k_alloc
            - *k_lock
            - call: "GET /footwear/capacity-allocations/${a_id}"
              payload: {}
              as: PlatformAdmin
              captures: { a_v: $.data.version }
          trigger:
            - call: "POST /footwear/capacity-allocations/${a_id}/shift"
              payload: { direction: "TO_DOMESTIC", units: 10, expected_allocation_version: "${a_v}" }
              as: PlatformAdmin
              captures: { dom1: $.data.domestic_reserved_units, imp1: $.data.import_reserved_units }
            - call: "POST /footwear/capacity-allocations/${a_id}/shift"
              payload: { direction: "TO_DOMESTIC", units: 10, expected_allocation_version: "${a_v}" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "first shift: 200 with dom1 == 10 and imp1 == 90 (version now 3)"
            - "second shift replaying the stale version: 412 and err == ERR_STALE_ALLOCATION_VERSION"
            - "pools remain domestic 10 / import 90 — the rejected shift moved nothing"

      - name: derived_field_reconciliation_corner
        claim_type: derived_field_reconciliation
        grounds:
          - calculations.cost_differential_pricing
          - entities.ShoeModel.fields.domestic_price_cents
        excluded_because:
          difficulty_instance: content_provisional_vs_certified_diverge
          rationale: "Model domestic_unit_cost_cents == 5000 and domestic_price_cents == 18750 after the CERTIFIED report are asserted by the named §1.8 instance; the null-before-report leg is asserted by model_create_returns_bom_and_null_pricing."

      - name: cascading_side_effects_corner
        claim_type: cascading_side_effects
        grounds:
          - state_machines.EvidenceDocument.VERIFIED_to_REJECTED
          - state_machines.Factory.ACTIVE_to_SUSPENDED
        excluded_because:
          difficulty_instance: origin_cert_rejection_report_claim_contract_cascade
          rationale: "Depth-3 and depth-2 cascades with per-hop assertions are covered by the named §1.8 instances (origin_cert_rejection_report_claim_contract_cascade, factory_suspension_run_lot_order_cascade)."

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: action_response_reflects_mutation_immediately
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST_/footwear/production-runs/{id}/reserve-materials
        distinguishing_aspect: "Immediate consistency: the reserve-materials RESPONSE itself carries status MATERIAL_RESERVED, version 2, and the full consumed_lots array — no re-read is needed to observe the mutation, and a subsequent GET returns byte-identical state."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; standard kit; STOCK run of 10 PLANNED; allocation LOCKED."
          setup_api_calls:
            - *k_clk
            - *k_fac
            - *k_comp_t
            - *k_lot_t
            - *k_model_std
            - *k_alloc
            - *k_run_std
            - *k_lock
          trigger:
            - call: "POST /footwear/production-runs/${r_id}/reserve-materials"
              payload: {}
              as: ProductionPlanner
              captures: { st: $.data.status, v: $.data.version, cons: $.data.consumed_lots }
            - call: "GET /footwear/production-runs/${r_id}"
              payload: {}
              as: ProductionPlanner
              captures: { st2: $.data.status, cons2: $.data.consumed_lots }
          assert:
            - "the reserve response already shows st == MATERIAL_RESERVED, v == 2, and cons == [ { lot_id: ${l_t}, units_consumed: 10, unit_cost_cents: 100, is_domestic: true } ]"
            - "the follow-up GET shows identical status and consumed_lots (st2 == st, cons2 == cons) — mutations are visible in the same request, not eventually"

      - name: not_found_sweep_covers_entity_specific_404s
        claim_type: violation_to_error
        grounds:
          - validations[priority=4]
          - errors.ERR_MODEL_NOT_FOUND
          - errors.ERR_RUN_NOT_FOUND
          - errors.ERR_ORDER_NOT_FOUND
          - errors.ERR_CLAIM_NOT_FOUND
          - errors.ERR_DOC_NOT_FOUND
          - errors.ERR_WORKER_NOT_FOUND
          - errors.ERR_ENROLLMENT_NOT_FOUND
          - errors.ERR_ALLOCATION_NOT_FOUND
          - errors.ERR_CONTRACT_NOT_FOUND
          - errors.ERR_LOT_NOT_FOUND
          - errors.ERR_COMPONENT_NOT_FOUND
          - errors.ERR_REPORT_NOT_FOUND
        distinguishing_aspect: "Every entity-specific 404 is reachable: unknown path ids on GET-one endpoints, unknown body FKs (component_id on lot create, report_id on substantiate), and the derived allocation lookup at reserve time — each returns its own ERR_<RESOURCE>_NOT_FOUND, never a generic error."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; standard kit; a DRAFT claim on MSTD; a PLANNED run; NO capacity allocation for (factory, 2026-W37) exists."
          setup_api_calls:
            - *k_clk
            - *k_fac
            - *k_comp_t
            - *k_lot_t
            - *k_model_std
            - *k_alloc
            - *k_run_std
            - *k_claim_std
            - &k_run_w37_noalloc
              call: "POST /footwear/production-runs"
              payload: { model_id: "${m_id}", factory_id: "${f_id}", run_type: "STOCK", planned_units: 5, line_index: 2, start_day: "2026-09-14", end_day: "2026-09-18", iso_week: "2026-W37" }
              as: ProductionPlanner
              captures: { r_w37: $.data.id }
          trigger:
            - call: "GET /footwear/models/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: SourcingManager
              captures: { e_model: $.data.error_id }
            - call: "GET /footwear/production-runs/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ProductionPlanner
              captures: { e_run: $.data.error_id }
            - call: "GET /footwear/custom-orders/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ProductionPlanner
              captures: { e_order: $.data.error_id }
            - call: "GET /footwear/label-claims/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ComplianceOfficer
              captures: { e_claim: $.data.error_id }
            - call: "GET /footwear/evidence-documents/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ComplianceOfficer
              captures: { e_doc: $.data.error_id }
            - call: "GET /footwear/workers/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: TrainingCoordinator
              captures: { e_worker: $.data.error_id }
            - call: "POST /footwear/training-enrollments/00000000-0000-0000-0000-000000000000/record-assessment"
              payload: { score: 90 }
              as: TrainingCoordinator
              captures: { e_enr: $.data.error_id }
            - call: "GET /footwear/capacity-allocations/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { e_alloc: $.data.error_id }
            - call: "GET /footwear/gov-contracts/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { e_contract: $.data.error_id }
            - call: "GET /footwear/lots/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: SourcingManager
              captures: { e_lot: $.data.error_id }
            - call: "POST /footwear/lots"
              payload: { component_id: "00000000-0000-0000-0000-000000000000", supplier_name: "Ghost Supplier", is_domestic: true, quantity_received: 10, unit_cost_cents: 100 }
              as: SourcingManager
              captures: { e_comp: $.data.error_id }
            - call: "POST /footwear/label-claims/${cl_id}/substantiate"
              payload: { report_id: "00000000-0000-0000-0000-000000000000" }
              as: ComplianceOfficer
              captures: { e_rep: $.data.error_id }
            - call: "POST /footwear/production-runs/${r_w37}/reserve-materials"
              payload: {}
              as: ProductionPlanner
              captures: { e_alloc2: $.data.error_id }
          assert:
            - "e_model == ERR_MODEL_NOT_FOUND; e_run == ERR_RUN_NOT_FOUND; e_order == ERR_ORDER_NOT_FOUND; e_claim == ERR_CLAIM_NOT_FOUND; e_doc == ERR_DOC_NOT_FOUND; e_worker == ERR_WORKER_NOT_FOUND (all 404)"
            - "e_enr == ERR_ENROLLMENT_NOT_FOUND (404); e_alloc == ERR_ALLOCATION_NOT_FOUND (404); e_contract == ERR_CONTRACT_NOT_FOUND (404); e_lot == ERR_LOT_NOT_FOUND (404)"
            - "body-FK misses: e_comp == ERR_COMPONENT_NOT_FOUND (lot create) and e_rep == ERR_REPORT_NOT_FOUND (substantiate) — both 404"
            - "reserve into a week with no allocation: 404 and e_alloc2 == ERR_ALLOCATION_NOT_FOUND (the derived (factory, iso_week) lookup is an existence check)"

      - name: contract_start_on_uncleared_factory_returns_factory_not_cleared
        claim_type: violation_to_error
        grounds:
          - errors.ERR_FACTORY_NOT_CLEARED
          - state_machines.GovContract.AWARDED_to_IN_FULFILLMENT
        distinguishing_aspect: "The clearance gate is separate from the Berry gate: DOMESTIC_ONLY model and ACTIVE DOMESTIC factory, but government_cleared == false -> 422 ERR_FACTORY_NOT_CLEARED (factory capability is checked before any content report is consulted)."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; DOMESTIC factory WITHOUT clearance; DOMESTIC_ONLY model GOV1; contract G-400 AWARDED."
          setup_api_calls:
            - *k_clk
            - *k_fac
            - *k_comp_g
            - *k_model_gov1
            - &k_contract_nc
              call: "POST /footwear/gov-contracts"
              payload: { contract_number: "G-400", model_id: "${m_id}", factory_id: "${f_id}", awarded_units: 10, fulfillment_start: "2027-02-01", fulfillment_end: "2027-02-28" }
              as: PlatformAdmin
              captures: { g_id: $.data.id }
          trigger:
            - call: "POST /footwear/gov-contracts/${g_id}/start-fulfillment"
              payload: {}
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 422 and err == ERR_FACTORY_NOT_CLEARED"
            - "GovContract.${g_id} remains AWARDED"

      - name: import_only_model_on_domestic_factory_returns_policy_forbids_domestic
        claim_type: violation_to_error
        grounds:
          - errors.ERR_POLICY_FORBIDS_DOMESTIC
          - entities.ShoeModel.fields.production_policy
          - validations[priority=7]
        distinguishing_aspect: "The mirror policy rule: an IMPORT_ONLY model may not occupy a DOMESTIC line (422 ERR_POLICY_FORBIDS_DOMESTIC) — the domestic plant is reserved for domestic-eligible styles."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; DOMESTIC factory; IMPORT_ONLY model MIMP."
          setup_api_calls:
            - *k_clk
            - *k_fac
            - *k_comp_t
            - &k_model_imp
              call: "POST /footwear/models"
              payload: { style_code: "MIMP", production_policy: "IMPORT_ONLY", base_price_cents: 4000, import_cost_basis_cents: 1500, bom_lines: [ { component_id: "${c_t}", quantity_per_pair: 1.0, sourcing_requirement: "IMPORT_ALLOWED", planned_unit_cost_cents: 100, planned_is_domestic: false } ], standard_stitching_minutes: 0, standard_lasting_minutes: 0, standard_assembly_minutes: 0 }
              as: SourcingManager
              captures: { m_imp: $.data.id }
          trigger:
            - call: "POST /footwear/production-runs"
              payload: { model_id: "${m_imp}", factory_id: "${f_id}", run_type: "STOCK", planned_units: 10, line_index: 1, start_day: "2026-09-07", end_day: "2026-09-11", iso_week: "2026-W36" }
              as: ProductionPlanner
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 422 and err == ERR_POLICY_FORBIDS_DOMESTIC"
            - "GET /footwear/production-runs?model_id=${m_imp} returns 0 rows"

      - name: model_discontinue_blocked_by_published_claim
        claim_type: violation_to_error
        grounds:
          - errors.ERR_MODEL_HAS_PUBLISHED_CLAIMS
          - state_machines.ShoeModel.ACTIVE_to_DISCONTINUED
        distinguishing_aspect: "The PUBLISHED-claim guard (not the open-run guard): the M95 model has zero open runs and one PUBLISHED claim — discontinue returns 409 ERR_MODEL_HAS_PUBLISHED_CLAIMS and both model and claim are untouched."
        test_recipe:
          setup:
            - "The M95 95.00-fixture with the claim PUBLISHED (identical chain to claim_publish_happy_path); the run is COMPLETED (terminal), so only the published claim blocks."
          setup_api_calls:
            - *k_clk
            - *k_fac
            - *k_comp_a
            - *k_comp_b
            - *k_lot_a95
            - *k_lot_b95
