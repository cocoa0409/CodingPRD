            - "error_id == ERR_FORBIDDEN"

      - name: unauthenticated_request_rejected
        claim_type: Cannot perform
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_UNAUTHENTICATED]"
        distinguishing_aspect: "A request with no recognized X-User-Role -> ERR_UNAUTHENTICATED 401 before any other check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /tanks"
              payload: {}
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 401"
            - "error_id == ERR_UNAUTHENTICATED"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_correct_version_renew_succeeds
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[membership-renew-stale-version]"
          - "entities.Membership.fields.version"
        excluded_because:
          difficulty_instance: combinatorial_formula / comb_b_rollover_order_pinned
          rationale: "The happy-path renew with the correct expected_membership_version is executed by the rollover-order instance; the stale-version negative path is covered by error_stale_version_on_renew."

      - name: derived_member_no_show_strike_increments
        claim_type: derived_field_reconciliation
        grounds: [entities.Member.fields.no_show_strikes, state_machines.Booking.CONFIRMED_to_NO_SHOW]
        distinguishing_aspect: "A NO_SHOW transition increments Member.no_show_strikes from 0 to 1 (single strike, below the suspend threshold so status stays ACTIVE)."
        test_recipe:
          setup: ["oriented active member; single tank; CONFIRMED CASH booking; clock past start+grace"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: Admin
            - call: "POST /plans"
              payload: { tier: "SOLO", monthly_fee_cents: 8000, included_floats_per_cycle: 4, rollover_cap: 4, retail_float_cents: 5000 }
              as: Admin
              captures: { plan_id: $.data.id }
            - call: "POST /members"
              payload: { email: "ns@x.com", full_name: "N S" }
              as: FrontDesk
              captures: { mem_id: $.data.id }
            - call: "POST /attendants"
              payload: { full_name: "Va" }
              as: Admin
              captures: { att_id: $.data.id }
            - call: "POST /orientations"
              payload: { member_id: "${mem_id}", attendant_id: "${att_id}", start_utc: "2026-07-01T01:00:00Z", end_utc: "2026-07-01T01:30:00Z" }
              as: FrontDesk
              captures: { ori_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T01:05:00Z" }
              as: Admin
            - call: "POST /orientations/${ori_id}/complete"
              payload: {}
              as: FrontDesk
            - call: "POST /tanks"
              payload: { name: "Pod-Ns", capacity_kind: "SINGLE" }
              as: Admin
              captures: { tank_id: $.data.id }
            - call: "POST /bookings"
              payload: { member_id: "${mem_id}", tank_id: "${tank_id}", session_minutes: 60, start_utc: "2026-07-03T10:00:00Z", pay_source: "CASH" }
              as: FrontDesk
              captures: { bk_id: $.data.id }
            - call: "POST /bookings/${bk_id}/confirm"
              payload: {}
              as: FrontDesk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-03T10:20:00Z" }
              as: Admin
          trigger:
            - call: "POST /bookings/${bk_id}/no-show"
              payload: {}
              as: FrontDesk
            - call: "GET /members/${mem_id}"
              payload: {}
              as: FrontDesk
              captures: { strikes: $.data.no_show_strikes, st: $.data.status }
          assert:
            - "Member.${mem_id}.no_show_strikes == 1"
            - "Member.${mem_id}.status == ACTIVE"
            - "Booking.${bk_id}.status == NO_SHOW"

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: cascade_visible_in_same_request_immediate
        claim_type: immediate
        grounds: [state_machines.Booking.CHECKED_IN_to_COMPLETED, state_machines.Tank.CLEAN_to_IN_CYCLE]
        excluded_because:
          difficulty_instance: transitive_cascade / cascade_complete_sanitation_tank_autocancel
          rationale: "Immediate visibility of the completion cascade (tank IN_CYCLE, auto-cancel) within one request is asserted by the depth-3 cascade instance."
