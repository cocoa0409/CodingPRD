            - call: "POST /warehouse/putaway-tasks/${pid}/assign"
              payload: {}
              as: PutawayOperator
            - call: "POST /warehouse/putaway-tasks/${pid}/complete"
              payload: {}
              as: PutawayOperator
            - call: "POST /warehouse/outbound-orders"
              payload: { order_number: "ORD-SW1", priority: 5 }
              as: WavePlanner
              captures: { oid: "$.data.id" }
            - call: "POST /warehouse/outbound-orders/${oid}/lines"
