      - name: terminate_terminal_agreement_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.ExhibitorAgreement, errors.ERR_INVALID_STATE]
        distinguishing_aspect: "Once TERMINATED, an agreement rejects all further transitions."
        test_recipe:
          setup: ["Agreement in TERMINATED state."]
          setup_api_calls:
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlatformContractManager }
            - { call: "POST /v1/markets", payload: { market_name: "Metro", country_code: "US", screen_capacity_cap: 5, target_format_mix: ["PREMIUM_2D"] }, as: NetworkPlanner, captures: { mkt_id: $.data.id } }
