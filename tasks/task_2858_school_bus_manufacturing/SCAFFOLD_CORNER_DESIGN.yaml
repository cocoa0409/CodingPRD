              captures: { open_after_complete: $.data.open_recall_unit_count, standing_after_complete: $.data.certification_standing }
            - call: "POST /remedy-tasks/${task_b_id}/cancel"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "compliance-01"
              captures: { task_b_status: $.data.status }
            - call: "GET /dealers/${dealer_id}"
              payload: {}
              as: ContractsAdmin
              as_user_id: "contracts-01"
              captures: { open_after_cancel: $.data.open_recall_unit_count, standing_after_cancel: $.data.certification_standing }
            - call: "POST /dealers/${dealer_id}/legacy-fleet-records"
              payload: { bus_model_id: "${model_c_id}", propulsion_package_id: "${pkg_dsl_id}", spec_profile_id: "${tx_id}", vin: "1TXDSL0000001102", delivered_at: "2026-06-02" }
              as: ContractsAdmin
              as_user_id: "contracts-01"
              captures: { unit_2_id: $.data.id }
            - call: "GET /dealers/${dealer_id}"
              payload: {}
              as: ContractsAdmin
              as_user_id: "contracts-01"
              captures: { delivered_final: $.data.delivered_unit_count, open_final: $.data.open_recall_unit_count }
          assert:
            - "the dealer is created with delivered_unit_count 0, open_recall_unit_count 0 and certification_standing GOOD; after the first legacy import delivered_unit_count is 1"
            - "RC-A launches with affected_unit_count 1 and reserved_kits 1; the dealer then reports open_recall_unit_count 1 and standing GOOD (1 < RESTRICT threshold 2)"
            - "RC-B also launches with affected_unit_count 1 on the SAME bus, yet the dealer still reports open_recall_unit_count 1 and standing GOOD — two live tasks on one distinct unit count once"
            - "GET /remedy-tasks?dealer_id&status=OPEN returns 2 elements with total_count 2, proving both tasks exist while the derived count remains 1"
            - "completing the RC-A task leaves open_recall_unit_count at 1 (the RC-B task is still live) and the bus service_status still RECALL_OPEN"
            - "cancelling the RC-B task drops open_recall_unit_count to 0 with standing GOOD, returns its kit to RC-B (available_kits 2, consumed_kits 0) and moves the bus to RECALL_CLOSED because it retains a COMPLETED task"
            - "the second legacy import lifts delivered_unit_count to 2 with open_recall_unit_count still 0: the counters are recomputed from their source rows on every event, never incremented blindly"

      - name: a_failed_release_test_cascades_through_unit_order_and_damages
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers[cascading_side_effects]
        excluded_because:
          difficulty_instance: "transitive_cascade / cascade_a_test_failure_reaches_order_breach_and_damages"
          rationale: |
            That instance walks the full four-hop chain (test FAIL -> unit certification BLOCKED -> slot
            release and posture recomputation -> order BREACHED with liquidated_damages_cents), asserts the
            state after each hop and checks the ordering sensitivity of the release. Re-deriving the same
            chain here would only restate it with different literals.

      - name: provisional_and_final_award_price_variants_diverge_on_the_same_bid
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers[dual_variant_calculation]
          - calculations.bid_unit_price
        excluded_because:
          difficulty_instance: "dual_variant_calc / bid_price_provisional_firm_versus_final_award_variant"
          rationale: |
            Both variants of bid_unit_price, the delta produced by switching at award (spec upgrade plus
            escalation months) and the fact that the stored provisional price never moves are all asserted
            there against pinned literals; the range_validation electric-versus-liquid-fuel pair is likewise
            covered by range_validation_electric_versus_liquid_fuel_variant.

  - section: consistency_model
    instances:

      - name: computed_fields_are_present_in_the_creating_response_itself
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - response_envelope.success
          - calculations.bid_unit_price
          - calculations.range_validation
          - calculations.spec_compliance_evaluation
        distinguishing_aspect: |
          Consistency is immediate, so the 201 body of POST /bids already carries every derived field —
          provisional_unit_price_cents, offered_joint_strength_kn, nominal_range_mi, derated_route_range_mi,
          spec_compliance_status, exception_count and unmet_mandatory_items — with no second read and no
          "pending computation" placeholder. A follow-up GET must be byte-identical, which is what
          distinguishes an immediate model from an eventual one.
        test_recipe:
          setup:
            - "TYPE_C_CONV + ELEC-155; CA 2026-2027 PUBLISHED demanding 78 seats, 7 exits, CROSSVIEW_HEATED mirrors, belts, rollover protection and 120.0 mi of route range on MOUNTAIN terrain"
            - "SOL-CA-126 for 1 unit; the bid deliberately offers a short-range, 6-exit configuration"
