      - name: rate_lock_overlap_same_sender_corridor_half_open
        grounds:
          - state_machines.Quote.DRAFT_to_LOCKED
          - entities.Quote.fields.expires_at
          - errors[ERR_RATE_LOCK_OVERLAP]
        distinguishing_aspect: |
          Interval semantics: half-open [locked_at, expires_at) with NO buffer on
          the Quote resource. A second quote lock for the same (sender, corridor)
          while a prior lock's window is still open (expires_at in the future) is
          rejected with ERR_RATE_LOCK_OVERLAP; once the first window elapses the
          collision clears.
        test_recipe:
          setup:
            - "One LOCKED quote (ttl 1800s) for sender S on corridor C, clock at lock time; a second DRAFT quote for the same S+C."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /corridors"
              payload: { name: "US->PH", send_country: "US", receive_country: "PH", send_currency: "USD", receive_currency: "PHP", enabled_payout_methods: ["BANK"], fx_margin_bps: 137, fee_flat_minor: 199, fee_pct_bps: 120, fee_tier_threshold_minor: 100000, fee_pct_tier2_bps: 70, per_transfer_max_minor: 2000000, rolling_window_hours: 24, rolling_window_cap_minor: 4000000, rate_lock_ttl_seconds: 1800 }
              as: PlatformAdmin
              captures: { corridor_id: $.data.id }
            - call: "POST /fx-rates"
              payload: { corridor_id: "${corridor_id}", mid_rate_micro: 56333333, effective_at: "2026-05-31T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /senders"
              payload: { full_name: "Vic Sender", country: "US", date_of_birth: "1983-02-28" }
              as: RemittanceAgent
              captures: { sender_id: $.data.id }
            - call: "POST /quotes"
              payload: { corridor_id: "${corridor_id}", sender_id: "${sender_id}", send_principal_minor: 50000, payout_method: "BANK" }
              as: RemittanceAgent
              captures: { quote_a: $.data.id }
            - call: "POST /quotes/${quote_a}/lock"
              payload: {}
              as: RemittanceAgent
            - call: "POST /quotes"
              payload: { corridor_id: "${corridor_id}", sender_id: "${sender_id}", send_principal_minor: 60000, payout_method: "BANK" }
              as: RemittanceAgent
              captures: { quote_b: $.data.id }
          trigger:
            - call: "POST /quotes/${quote_b}/lock"
              payload: {}
              as: RemittanceAgent
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_RATE_LOCK_OVERLAP"
            - "Quote.${quote_b}.status == DRAFT"

      - name: rolling_window_capacity_overlap_aggregate_on_corridor
        grounds:
          - calculations.corridor_limit_check
          - entities.Corridor.fields.rolling_window_cap_minor
          - errors[ERR_ROLLING_WINDOW_LIMIT]
        distinguishing_aspect: |
          Different interval semantics on a different resource (Corridor): an
          aggregate-capacity overlap over the rolling [clock - rolling_window_hours,
          clock] window. Unlike the point-collision half-open quote lock, here the
          rejection is the SUM of funded principals within the window exceeding
          rolling_window_cap_minor — a capacity overlap, not a point overlap.
        test_recipe:
          setup:
            - "Corridor cap=400000, TIER2 sender, two FUNDED transfers of 150000 each (prior=300000) inside the window; a third UNFUNDED transfer of 150000 (projected 450000 > cap)."
