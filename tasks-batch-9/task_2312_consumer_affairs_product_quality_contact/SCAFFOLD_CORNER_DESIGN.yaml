            - { call: "POST /complaints", as: CareAgent, as_user_id: "${ag1}", payload: { contact_id: "${ct1}", complaint_type: ILLNESS, reported_batch_code: "A1B20260710", medical_attention_sought: true }, captures: { cp1: "$.data.id" } }
            - { call: "POST /complaints/${cp1}/triage", as: CareSupervisor, as_user_id: "${sup1}", payload: { reviewer_note: "Serious." }, captures: { bd: "$.data.effective_severity_band" } }
