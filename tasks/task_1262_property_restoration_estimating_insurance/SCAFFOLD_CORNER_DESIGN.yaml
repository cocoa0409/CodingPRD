        grounds: ["complexity_profile.consistency_model", "calculations.line_extended_pricing"]
        distinguishing_aspect: "The line-creation response itself carries the computed extended_cents (20,000) and server-pinned unit_price_cents — no re-read needed; the approve response carries status APPROVED and refreshed totals."
