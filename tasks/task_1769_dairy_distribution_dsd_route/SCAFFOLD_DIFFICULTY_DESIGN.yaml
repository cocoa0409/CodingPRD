              as: RouteDriver
              as_user_id: "${dr1}"
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T11:00:00Z" }, as: TerritoryManager }
            - { call: "POST /dairy/trips/${t2}/complete", payload: {}, as: RouteDriver, as_user_id: "${dr1}", captures: { ex2: "$.data.excursion_minutes", br2: "$.data.cold_chain_breach" } }
