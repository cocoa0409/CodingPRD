            - call: "POST /cancer-registry/qa-audits"
              payload: { abstraction_id: "${abst_id}", auditor_id: "${abs_q_id}", audit_type: "TARGETED", window_start: "2026-08-01", window_end: "2026-08-31" }
              as: RegistryManager
              captures: { audit_id: $.data.id }
            - call: "POST /cancer-registry/qa-audits/${audit_id}/void"
              payload: { void_reason: "opened against the wrong abstraction" }
              as: RegistryManager
          trigger:
            - call: "POST /cancer-registry/qa-audits/${audit_id}/void"
              payload: { void_reason: "duplicate void attempt" }
              as: RegistryManager
              captures: { err: $.data.error_id }
          assert:
            - "the first void returned HTTP 200 with audit_state == VOIDED and left lifetime_discrepancy_points at 0"
            - "the second void returns HTTP 409 with data.error_id == ERR_AUDIT_ALREADY_VOIDED (not ERR_AUDIT_ALREADY_SCORED)"
            - "QaAudit.${audit_id}.audit_state is still VOIDED and verdict is still null"
            - "a subsequent POST /cancer-registry/qa-audits/${audit_id}/score also fails - VOIDED accepts no transition"

      - name: hold_before_session_start_at_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines[ConferenceSession].SCHEDULED->HELD
          - validations[priority 56 session not yet started]
          - errors[ERR_SESSION_NOT_YET_STARTED]
        distinguishing_aspect: |
          A session scheduled for 2026-09-10 cannot be held while the logical clock still reads
          2026-08-01: the temporal guard fires with ERR_SESSION_NOT_YET_STARTED (409) even though
          the state (SCHEDULED) and the posted counts are both valid.
        test_recipe:
          setup:
            - "One program with a SCHEDULED session starting 2026-09-10T13:00:00Z; the clock is untouched at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /cancer-registry/programs"
              payload: { name: "Northside Cancer Center", coc_program_id: "COC-1456N", annual_analytic_caseload: 300, reference_year: 2018, timeliness_standard_days: 180 }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /cancer-registry/conference-sessions"
              payload: { program_id: "${prog_id}", start_at: "2026-09-10T13:00:00Z", end_at: "2026-09-10T14:30:00Z", required_disciplines: ["SURGERY", "MEDICAL_ONCOLOGY"] }
              as: AccreditationCoordinator
              captures: { sess_id: $.data.id }
          trigger:
            - call: "POST /cancer-registry/conference-sessions/${sess_id}/hold"
              payload: { cases_presented_count: 6, prospective_case_count: 6 }
              as: AccreditationCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 and data.error_id == ERR_SESSION_NOT_YET_STARTED"
            - "ConferenceSession.${sess_id}.session_state is still SCHEDULED"
            - "that session still reports cases_presented_count == 0 and quorum_met == false"

      - name: staffing_suspension_cascades_case_release_and_draft_abstraction_rejection
        claim_type: Side Effect Execution
        grounds:
          - endpoints[POST /cancer-registry/abstractors/{abstractorId}/employment-status]
          - state_machines[TumorCase.case_state].ASSIGNED->IDENTIFIED
          - state_machines[Abstraction].DRAFT->REJECTED
          - calculations.workload_conservation
        distinguishing_aspect: |
          One status change fires a three-part conditional cascade: the open case returns to
          IDENTIFIED with a null abstractor, the in-flight DRAFT abstraction becomes terminal
          REJECTED, and assigned_open_case_count is set to 0 - while the program's
          open_backlog_count stays 1 because the case is still in the backlog, only unassigned.
        test_recipe:
          setup:
            - "One program, one abstractor holding one ASSIGNED case with a DRAFT abstraction."
          setup_api_calls:
            - call: "POST /cancer-registry/programs"
              payload: { name: "Northside Cancer Center", coc_program_id: "COC-1456N", annual_analytic_caseload: 300, reference_year: 2018, timeliness_standard_days: 180 }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /cancer-registry/abstractors"
              payload: { program_id: "${prog_id}", name: "Dana Reyes", credential: "CTR", productivity_target_cases_per_day: 2, certification_expires_on: "2027-12-31" }
              as: RegistryManager
              captures: { abs_a_id: $.data.id }
            - call: "POST /cancer-registry/casefinding-sources"
              payload: { program_id: "${prog_id}", source_type: "PATHOLOGY", expected_monthly_volume: 40 }
              as: RegistryManager
              captures: { src_id: $.data.id }
            - call: "POST /cancer-registry/casefinding-sources/${src_id}/entries"
