scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (different entity domains: Invoice vs DamageAssessment)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: provisional_vs_final_bed_night_billing
        grounds:
          - calculations.bed_night_billing
          - state_machines.Invoice.PROVISIONAL_to_FINALIZED
          - entities.Invoice.fields.provisional_total_cents
          - entities.Invoice.fields.final_bed_night_subtotal_cents
        distinguishing_aspect: |
          On the Invoice entity domain, the provisional variant (planned nights of
          RESERVED/CHECKED_IN assignments) and the final variant (actual CHECKED_OUT
          nights plus a flat base-rate night per NO_SHOW) produce different totals
          for the same contract: provisional 54000 vs final bed-night subtotal 36000.
        test_recipe:
          setup:
            - "Building B (fall 2026-08-20, key pool 10) TURN_ACTIVE, with room R1 (2 beds) and R2 (1 bed)"
            - "Group G (arrival 2026-06-15, departure 2026-06-19, no minors, STANDARD linen, contracted_bed_count 3, deposit 20000) CONFIRMED with provisional invoice 54000 (12 planned bed-nights * 4500)"
            - "3 assignments: P1/P2 in R1 and P3 in R2, all 2026-06-15T15:00:00Z -> 2026-06-19T11:00:00Z (4 planned nights each, Mon-Thu, no weekend)"
            - "P1/P2 checked in 2026-06-15T15:30:00Z; P3 marked NO_SHOW at 2026-06-16T16:00:00Z; P1 checked out early 2026-06-18T09:00:00Z (3 actual nights); P2 checked out 2026-06-19T10:00:00Z (4 actual nights); group DEPARTED"
          setup_api_calls:
            - call: "POST /buildings"
              payload: { name: "Baker Hall", fall_opening_date: "2026-08-20", key_pool_size: 10 }
              as: ConferenceServicesAdmin
              captures: { b_id: $.data.id }
            - call: "POST /buildings/${b_id}/rooms"
              payload: { room_number: "R1", bed_count: 2 }
              as: FacilitiesManager
              captures: { r1_id: $.data.id }
            - call: "POST /buildings/${b_id}/rooms"
              payload: { room_number: "R2", bed_count: 1 }
              as: FacilitiesManager
              captures: { r2_id: $.data.id }
            - call: "POST /buildings/${b_id}/initiate-release"
              payload: {  }
              as: FacilitiesManager
            - call: "POST /buildings/${b_id}/confirm-release"
              payload: {  }
              as: FacilitiesManager
            - call: "POST /buildings/${b_id}/begin-turn-season"
              payload: {  }
              as: FacilitiesManager
            - call: "POST /conference-groups"
              payload: { building_id: "${b_id}", client_name: "Chess Camp", contact_email: "cc@x.com", arrival_date: "2026-06-15", departure_date: "2026-06-19", has_minor_participants: false, linen_tier: "STANDARD", contracted_bed_count: 3, deposit_paid_cents: 20000 }
              as: ConferenceServicesAdmin
              captures: { g_id: $.data.id }
            - call: "POST /conference-groups/${g_id}/participants"
              payload: { full_name: "P One", date_of_birth: "1990-01-01", role_in_group: "ATTENDEE" }
              as: ClientCoordinator
              as_user_id: "${g_id}"
              captures: { p1_id: $.data.id }
            - call: "POST /conference-groups/${g_id}/participants"
              payload: { full_name: "P Two", date_of_birth: "1990-01-02", role_in_group: "ATTENDEE" }
              as: ClientCoordinator
              as_user_id: "${g_id}"
              captures: { p2_id: $.data.id }
            - call: "POST /conference-groups/${g_id}/participants"
              payload: { full_name: "P Three", date_of_birth: "1990-01-03", role_in_group: "ATTENDEE" }
              as: ClientCoordinator
              as_user_id: "${g_id}"
              captures: { p3_id: $.data.id }
            - call: "GET /conference-groups/${g_id}"
              as: ConferenceServicesAdmin
              captures: { g_ver: $.data.version }
            - call: "POST /conference-groups/${g_id}/rooming-list-revisions"
              payload:
                expected_conference_group_version: "${g_ver}"
                assignments:
                  - { participant_id: "${p1_id}", room_id: "${r1_id}", checkin_at: "2026-06-15T15:00:00Z", checkout_at: "2026-06-19T11:00:00Z" }
                  - { participant_id: "${p2_id}", room_id: "${r1_id}", checkin_at: "2026-06-15T15:00:00Z", checkout_at: "2026-06-19T11:00:00Z" }
                  - { participant_id: "${p3_id}", room_id: "${r2_id}", checkin_at: "2026-06-15T15:00:00Z", checkout_at: "2026-06-19T11:00:00Z" }
              as: ClientCoordinator
              as_user_id: "${g_id}"
            - call: "POST /conference-groups/${g_id}/submit"
              payload: {  }
              as: ClientCoordinator
              as_user_id: "${g_id}"
            - call: "POST /conference-groups/${g_id}/confirm"
              payload: {  }
              as: ConferenceServicesAdmin
              captures: { inv_id: $.data.provisional_invoice_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T15:30:00Z" }
              as: ConferenceServicesAdmin
            - call: "GET /stay-assignments"
              payload: { group_id: "${g_id}", participant_id: "${p1_id}" }
              as: ConferenceServicesAdmin
              captures: { a1_id: "$.data[0].id" }
            - call: "GET /stay-assignments"
              payload: { group_id: "${g_id}", participant_id: "${p2_id}" }
              as: ConferenceServicesAdmin
              captures: { a2_id: "$.data[0].id" }
            - call: "GET /stay-assignments"
              payload: { group_id: "${g_id}", participant_id: "${p3_id}" }
              as: ConferenceServicesAdmin
              captures: { a3_id: "$.data[0].id" }
            - call: "POST /stay-assignments/${a1_id}/check-in"
              payload: {  }
              as: ConferenceServicesAdmin
            - call: "POST /stay-assignments/${a2_id}/check-in"
              payload: {  }
              as: ConferenceServicesAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-16T16:00:00Z" }
              as: ConferenceServicesAdmin
            - call: "POST /stay-assignments/${a3_id}/mark-no-show"
              payload: {  }
              as: ConferenceServicesAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-18T09:00:00Z" }
              as: ConferenceServicesAdmin
            - call: "POST /stay-assignments/${a1_id}/check-out"
              payload: {  }
              as: ConferenceServicesAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-19T10:00:00Z" }
              as: ConferenceServicesAdmin
            - call: "POST /stay-assignments/${a2_id}/check-out"
              payload: {  }
              as: ConferenceServicesAdmin
            - call: "POST /conference-groups/${g_id}/close-out"
              payload: {  }
              as: ConferenceServicesAdmin
          trigger:
            - call: "POST /invoices/${inv_id}/finalize"
              payload: {  }
              as: FinanceOfficer
          assert:
            - "Invoice.${inv_id}.provisional_total_cents == 54000 (12 planned bed-nights * 4500)"
            - "Invoice.${inv_id}.final_bed_night_subtotal_cents == 36000 (P1 3 actual nights * 4500 = 13500; P2 4 actual nights * 4500 = 18000; P3 NO_SHOW flat 4500)"
            - "Invoice.${inv_id}.provisional_total_cents != Invoice.${inv_id}.final_bed_night_subtotal_cents (54000 vs 36000)"
            - "Invoice.${inv_id}.total_cents == 36000 (linen/key/damage all 0)"
            - "Invoice.${inv_id}.balance_due_cents == 16000 (36000 - deposit 20000)"

      - name: damage_estimate_vs_assessed_charge
        grounds:
          - calculations.damage_charge
          - state_machines.DamageAssessment.REPORTED_to_ASSESSED
          - entities.DamageAssessment.fields.estimate_total_cents
          - entities.DamageAssessment.fields.assessed_total_cents
        distinguishing_aspect: |
          On the DamageAssessment entity domain (distinct from the Invoice domain of
          provisional_vs_final_bed_night_billing), the estimate variant (straight
          replacement sum, no fee) yields 116500 while the assessed variant
          (depreciated per-unit rounding plus admin fee) yields 109100 for identical
          line items.
        test_recipe:
          setup:
            - "Building B TURN_ACTIVE with room R1 (1 bed); group G CONFIRMED and IN_HOUSE; the single assignment already CHECKED_OUT at 2026-06-19T09:00:00Z"
          setup_api_calls:
            - call: "POST /buildings"
              payload: { name: "Carter Hall", fall_opening_date: "2026-08-20", key_pool_size: 10 }
              as: ConferenceServicesAdmin
              captures: { b_id: $.data.id }
            - call: "POST /buildings/${b_id}/rooms"
              payload: { room_number: "R1", bed_count: 1 }
              as: FacilitiesManager
              captures: { r1_id: $.data.id }
            - call: "POST /buildings/${b_id}/initiate-release"
              payload: {  }
              as: FacilitiesManager
            - call: "POST /buildings/${b_id}/confirm-release"
              payload: {  }
              as: FacilitiesManager
            - call: "POST /buildings/${b_id}/begin-turn-season"
              payload: {  }
              as: FacilitiesManager
            - call: "POST /conference-groups"
              payload: { building_id: "${b_id}", client_name: "Debate Camp", contact_email: "dc@x.com", arrival_date: "2026-06-15", departure_date: "2026-06-19", has_minor_participants: false, contracted_bed_count: 1, deposit_paid_cents: 5000 }
              as: ConferenceServicesAdmin
              captures: { g_id: $.data.id }
            - call: "POST /conference-groups/${g_id}/participants"
              payload: { full_name: "P One", date_of_birth: "1988-05-05", role_in_group: "ATTENDEE" }
              as: ClientCoordinator
              as_user_id: "${g_id}"
              captures: { p1_id: $.data.id }
            - call: "GET /conference-groups/${g_id}"
              as: ConferenceServicesAdmin
              captures: { g_ver: $.data.version }
            - call: "POST /conference-groups/${g_id}/rooming-list-revisions"
              payload:
                expected_conference_group_version: "${g_ver}"
                assignments:
                  - { participant_id: "${p1_id}", room_id: "${r1_id}", checkin_at: "2026-06-15T15:00:00Z", checkout_at: "2026-06-19T11:00:00Z" }
              as: ClientCoordinator
              as_user_id: "${g_id}"
            - call: "POST /conference-groups/${g_id}/submit"
              payload: {  }
              as: ClientCoordinator
              as_user_id: "${g_id}"
            - call: "POST /conference-groups/${g_id}/confirm"
              payload: {  }
              as: ConferenceServicesAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T16:00:00Z" }
              as: ConferenceServicesAdmin
            - call: "GET /stay-assignments"
              payload: { group_id: "${g_id}", participant_id: "${p1_id}" }
              as: ConferenceServicesAdmin
              captures: { a1_id: "$.data[0].id" }
            - call: "POST /stay-assignments/${a1_id}/check-in"
              payload: {  }
              as: ConferenceServicesAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-19T09:00:00Z" }
              as: ConferenceServicesAdmin
            - call: "POST /stay-assignments/${a1_id}/check-out"
              payload: {  }
              as: ConferenceServicesAdmin
            - call: "POST /rooms/${r1_id}/damage-assessments"
              payload:
                group_id: "${g_id}"
                line_items:
                  - { description: "Headboard replacement", quantity: 1, unit_replacement_cost_cents: 100000, fixture_age_months: 0 }
                  - { description: "Desk lamp", quantity: 2, unit_replacement_cost_cents: 8250, fixture_age_months: 30 }
              as: FacilitiesManager
              captures: { da_id: $.data.id }
          trigger:
            - call: "POST /damage-assessments/${da_id}/assess"
              payload: {  }
              as: FacilitiesManager
          assert:
            - "DamageAssessment.${da_id}.estimate_total_cents == 116500 (100000 + 2*8250; no depreciation, no fee)"
            - "DamageAssessment.${da_id}.assessed_total_cents == 109100 (line1 100000*max(0.40,1-0)=100000; line2 round_half_up(8250*max(0.40,1-0.60))=3300 *2 = 6600; + admin fee 2500)"
            - "DamageAssessment.${da_id}.estimate_total_cents != DamageAssessment.${da_id}.assessed_total_cents (116500 vs 109100)"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (modes a, b, c)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: tiered_minor_weekend_bed_night_pricing
        grounds:
          - calculations.bed_night_billing
          - entities.ConferenceGroup.fields.has_minor_participants
        distinguishing_aspect: |
          Mode (a): >= 3 inputs with non-linear interaction — tier selection on the
          cumulative bed-night index, a conditional 15% minor surcharge rounded
          per-night BEFORE the flat weekend premium is added on Fri/Sat nights only.
          Two minor-flagged assignments Fri 2026-06-26 15:00 -> Mon 2026-06-29 11:00
          (nights Fri/Sat/Sun) price per assignment at (5175+400)*2 + 5175 = 16325;
          subtotal 32650.
        test_recipe:
          setup:
            - "Building B TURN_ACTIVE, room R1 (2 beds)"
            - "Group G has_minor_participants=true, contracted_bed_count 2, deposit 10000, arrival 2026-06-26, departure 2026-06-29"
            - "1 adult CHAPERONE with CLEARED screening + 1 minor ATTENDEE; revision assigns both to R1 for 2026-06-26T15:00:00Z -> 2026-06-29T11:00:00Z; group SUBMITTED"
          setup_api_calls:
            - call: "POST /buildings"
              payload: { name: "Drew Hall", fall_opening_date: "2026-08-20", key_pool_size: 10 }
              as: ConferenceServicesAdmin
              captures: { b_id: $.data.id }
            - call: "POST /buildings/${b_id}/rooms"
              payload: { room_number: "R1", bed_count: 2 }
              as: FacilitiesManager
              captures: { r1_id: $.data.id }
            - call: "POST /buildings/${b_id}/initiate-release"
              payload: {  }
              as: FacilitiesManager
            - call: "POST /buildings/${b_id}/confirm-release"
              payload: {  }
              as: FacilitiesManager
            - call: "POST /buildings/${b_id}/begin-turn-season"
              payload: {  }
              as: FacilitiesManager
            - call: "POST /conference-groups"
              payload: { building_id: "${b_id}", client_name: "Youth Orchestra", contact_email: "yo@x.com", arrival_date: "2026-06-26", departure_date: "2026-06-29", has_minor_participants: true, contracted_bed_count: 2, deposit_paid_cents: 10000 }
              as: ConferenceServicesAdmin
              captures: { g_id: $.data.id }
            - call: "POST /conference-groups/${g_id}/participants"
              payload: { full_name: "Chap One", date_of_birth: "1985-03-03", role_in_group: "CHAPERONE" }
              as: ClientCoordinator
              as_user_id: "${g_id}"
              captures: { pc_id: $.data.id }
            - call: "POST /conference-groups/${g_id}/participants"
              payload: { full_name: "Kid One", date_of_birth: "2012-04-04", role_in_group: "ATTENDEE" }
              as: ClientCoordinator
              as_user_id: "${g_id}"
              captures: { pk_id: $.data.id }
            - call: "POST /participants/${pc_id}/background-screenings"
              payload: { consent_reference: "CONS-1" }
              as: ClientCoordinator
              as_user_id: "${g_id}"
              captures: { sc_id: $.data.id }
            - call: "POST /background-screenings/${sc_id}/begin-review"
              payload: {  }
              as: ScreeningReviewer
            - call: "POST /background-screenings/${sc_id}/decide"
              payload: { outcome: "CLEAR" }
              as: ScreeningReviewer
            - call: "GET /conference-groups/${g_id}"
              as: ConferenceServicesAdmin
              captures: { g_ver: $.data.version }
            - call: "POST /conference-groups/${g_id}/rooming-list-revisions"
              payload:
                expected_conference_group_version: "${g_ver}"
                assignments:
                  - { participant_id: "${pc_id}", room_id: "${r1_id}", checkin_at: "2026-06-26T15:00:00Z", checkout_at: "2026-06-29T11:00:00Z" }
                  - { participant_id: "${pk_id}", room_id: "${r1_id}", checkin_at: "2026-06-26T15:00:00Z", checkout_at: "2026-06-29T11:00:00Z" }
              as: ClientCoordinator
              as_user_id: "${g_id}"
            - call: "POST /conference-groups/${g_id}/submit"
              payload: {  }
              as: ClientCoordinator
              as_user_id: "${g_id}"
          trigger:
            - call: "POST /conference-groups/${g_id}/confirm"
              payload: {  }
              as: ConferenceServicesAdmin
              captures: { inv_id: $.data.provisional_invoice_id }
          assert:
            - "ConferenceGroup.${g_id}.status == CONFIRMED"
            - "Invoice.${inv_id}.provisional_bed_night_subtotal_cents == 32650 (per-night minor rate round_half_up(4500*1.15)=5175; Fri 2026-06-26 and Sat 2026-06-27 nights add 400 -> 5575 each; Sun 2026-06-28 night 5175; per assignment 16325; two assignments 32650)"

      - name: per_line_rounding_damage_charge
        grounds:
          - calculations.damage_charge
          - entities.DamageAssessment.fields.assessed_total_cents
        distinguishing_aspect: |
          Mode (b): nested rounding order pinned — round_half_up per UNIT before
          multiplying by quantity. unit 3333 at 25 months (factor 0.5) rounds to
          1667 per unit, so 3 units cost 5001 (+ 2500 fee = 7501); the sum-then-round
          order would yield round_half_up(3333*0.5*3)=5000 (+2500 = 7500). The
          scaffold pins 7501.
        test_recipe:
          setup:
            - "Building B TURN_ACTIVE, room R1 (1 bed); group G IN_HOUSE; its single assignment CHECKED_OUT at 2026-06-19T09:00:00Z"
          setup_api_calls:
            - call: "POST /buildings"
              payload: { name: "Eaton Hall", fall_opening_date: "2026-08-20", key_pool_size: 10 }
              as: ConferenceServicesAdmin
              captures: { b_id: $.data.id }
            - call: "POST /buildings/${b_id}/rooms"
              payload: { room_number: "R1", bed_count: 1 }
              as: FacilitiesManager
              captures: { r1_id: $.data.id }
            - call: "POST /buildings/${b_id}/initiate-release"
              payload: {  }
              as: FacilitiesManager
            - call: "POST /buildings/${b_id}/confirm-release"
              payload: {  }
              as: FacilitiesManager
            - call: "POST /buildings/${b_id}/begin-turn-season"
              payload: {  }
              as: FacilitiesManager
            - call: "POST /conference-groups"
              payload: { building_id: "${b_id}", client_name: "Robotics Camp", contact_email: "rc@x.com", arrival_date: "2026-06-15", departure_date: "2026-06-19", has_minor_participants: false, contracted_bed_count: 1, deposit_paid_cents: 5000 }
              as: ConferenceServicesAdmin
              captures: { g_id: $.data.id }
            - call: "POST /conference-groups/${g_id}/participants"
              payload: { full_name: "P One", date_of_birth: "1991-07-07", role_in_group: "ATTENDEE" }
              as: ClientCoordinator
              as_user_id: "${g_id}"
              captures: { p1_id: $.data.id }
            - call: "GET /conference-groups/${g_id}"
              as: ConferenceServicesAdmin
              captures: { g_ver: $.data.version }
            - call: "POST /conference-groups/${g_id}/rooming-list-revisions"
              payload:
                expected_conference_group_version: "${g_ver}"
                assignments:
                  - { participant_id: "${p1_id}", room_id: "${r1_id}", checkin_at: "2026-06-15T15:00:00Z", checkout_at: "2026-06-19T11:00:00Z" }
              as: ClientCoordinator
              as_user_id: "${g_id}"
            - call: "POST /conference-groups/${g_id}/submit"
              payload: {  }
              as: ClientCoordinator
              as_user_id: "${g_id}"
            - call: "POST /conference-groups/${g_id}/confirm"
              payload: {  }
              as: ConferenceServicesAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T16:00:00Z" }
              as: ConferenceServicesAdmin
            - call: "GET /stay-assignments"
              payload: { group_id: "${g_id}", participant_id: "${p1_id}" }
              as: ConferenceServicesAdmin
              captures: { a1_id: "$.data[0].id" }
            - call: "POST /stay-assignments/${a1_id}/check-in"
              payload: {  }
              as: ConferenceServicesAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-19T09:00:00Z" }
              as: ConferenceServicesAdmin
            - call: "POST /stay-assignments/${a1_id}/check-out"
              payload: {  }
              as: ConferenceServicesAdmin
            - call: "POST /rooms/${r1_id}/damage-assessments"
              payload:
                group_id: "${g_id}"
                line_items:
                  - { description: "Chair caster", quantity: 3, unit_replacement_cost_cents: 3333, fixture_age_months: 25 }
              as: FacilitiesManager
              captures: { da_id: $.data.id }
          trigger:
            - call: "POST /damage-assessments/${da_id}/assess"
              payload: {  }
              as: FacilitiesManager
          assert:
            - "DamageAssessment.${da_id}.assessed_total_cents == 7501 (per-unit round_half_up(3333*0.5)=1667, 1667*3=5001, +2500 fee)"
            - "DamageAssessment.${da_id}.assessed_total_cents != 7500 (the unpinned sum-then-round order would produce 5000+2500)"

      - name: ordered_waterfall_revenue_allocation
        grounds:
          - calculations.revenue_allocation
          - entities.AllocationRun.fields.reserve_cents
          - entities.AllocationRun.fields.ops_cents
        distinguishing_aspect: |
          Mode (c): circular-looking dependency with pinned evaluation order —
          reserve keys off (gross - overhead), never gross. On gross 36000 the pinned
          order yields overhead 4320, reserve round_half_up(31680*0.08)=2534, ops
          remainder 29146; keying reserve off gross would yield 2880, so the order is
          falsifiable.
        test_recipe:
          setup:
            - "Building B TURN_ACTIVE, room R1 (2 beds); group G (contracted 2, deposit 20000) with two 4-night assignments 2026-06-15T15:00:00Z -> 2026-06-19T11:00:00Z, both checked in 2026-06-15T16:00:00Z and checked out 2026-06-19T10:00:00Z"
            - "Invoice FINALIZED (final bed-night subtotal 8*4500 = 36000; total 36000; balance_due 16000) and PAID at 2026-06-19T12:00:00Z with amount 16000"
          setup_api_calls:
            - call: "POST /buildings"
              payload: { name: "Foster Hall", fall_opening_date: "2026-08-20", key_pool_size: 10 }
              as: ConferenceServicesAdmin
              captures: { b_id: $.data.id }
            - call: "POST /buildings/${b_id}/rooms"
              payload: { room_number: "R1", bed_count: 2 }
              as: FacilitiesManager
              captures: { r1_id: $.data.id }
            - call: "POST /buildings/${b_id}/initiate-release"
              payload: {  }
              as: FacilitiesManager
            - call: "POST /buildings/${b_id}/confirm-release"
              payload: {  }
              as: FacilitiesManager
            - call: "POST /buildings/${b_id}/begin-turn-season"
              payload: {  }
              as: FacilitiesManager
            - call: "POST /conference-groups"
              payload: { building_id: "${b_id}", client_name: "Chess Camp", contact_email: "cc@x.com", arrival_date: "2026-06-15", departure_date: "2026-06-19", has_minor_participants: false, contracted_bed_count: 2, deposit_paid_cents: 20000 }
              as: ConferenceServicesAdmin
              captures: { g_id: $.data.id }
            - call: "POST /conference-groups/${g_id}/participants"
              payload: { full_name: "P One", date_of_birth: "1990-01-01", role_in_group: "ATTENDEE" }
              as: ClientCoordinator
