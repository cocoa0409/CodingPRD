  # ===========================================================================
  # Rule 7 -- cross-entity state dependencies across different entity pairs
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: agreement_insurance_verification_gated_by_certificate_coverage_window
        grounds:
          - state_machines.Agreement.status.PENDING_INSURANCE_to_PENDING_ALLOCATION
          - state_machines.InsuranceCertificate.status.ACTIVE_to_EXPIRED
          - entities.Agreement.fields.insurance_certificate_id
          - errors[ERR_INSURANCE_INVALID]
          - validations[priority=40]
        distinguishing_aspect: |
          ENTITY PAIR Agreement <- InsuranceCertificate: the Agreement's PENDING_INSURANCE ->
          PENDING_ALLOCATION transition is legal only when some certificate of THAT customer is
          ACTIVE and spans the whole agreement window. With only a certificate expiring 2026-08-31
          against an agreement ending 2026-09-10 the transition is refused with
          ERR_INSURANCE_INVALID; filing a certificate through 2027-01-01 makes the identical call
          succeed and pins that certificate's id on the agreement.
        test_recipe:
          setup:
            - "Branch WST-01 with one DRY_VAN_53 trailer and one ACTIVE rate card."
            - "Customer Ridge Haul LLC holds exactly one certificate, effective 2024-01-01 and expiring 2026-08-31."
            - "Agreement AG1 for 2026-08-20 .. 2026-09-10 has been submitted and sits in PENDING_INSURANCE."
          setup_api_calls:
            - call: "POST /fleet/branches"
              payload:
                code: "WST-01"
                name: "West Yard"
                region: "WEST"
                yard_capacity: 10
                peak_season_start_date: "2026-09-01"
                peak_season_end_date: "2026-11-30"
