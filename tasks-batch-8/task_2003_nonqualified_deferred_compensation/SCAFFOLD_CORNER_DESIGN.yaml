            - call: "POST /api/distribution-requests"
              payload: { account_id: "${acct1_id}", event_type: "FIXED_TIME", fixed_date: "2027-06-01", requested_amount_cents: 1000 }
              as: Participant
              as_user_id: "${p2_id}"
              captures: { err2: $.data.error_id }
          assert:
            - "${err1} == ERR_RESOURCE_OWNERSHIP_MISMATCH (P2 cannot submit P1's election)"
            - "${err2} == ERR_RESOURCE_OWNERSHIP_MISMATCH (P2 cannot draw on P1's account)"
            - "DeferralElection.${e1_id}.status == DRAFT (unchanged)"
      - name: segregation_of_duties_same_user_rejected
        claim_type: segregation_of_duties
        grounds: ["validations[priority=7.1]", "errors[ERR_SEGREGATION_OF_DUTIES]", "complexity_profile"]
        distinguishing_aspect: "Segregation is enforced on X-User-ID across role boundaries: the same user id that opened a case cannot determine it even when presenting the ComplianceOfficer role; the same user id that reported a failure cannot assess it."
        test_recipe:
          setup: ["ACTIVE plan; participant; account; case opened by ba-1 with evidence complete; failure reported by ba-1 and quantified"]
