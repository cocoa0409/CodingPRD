              as: PerformanceDirector
            - call: "POST /athletes"
              payload: { full_name: "Sara Whitfield", date_of_birth: "2010-01-15", sport: "BASKETBALL", position: "GUARD", guardian_email: "parent.whitfield@example.com" }
              as: FrontDesk
              captures: { ath_id: $.data.id }
            - call: "POST /test-sessions"
              payload: { athlete_id: "${ath_id}", battery_type: "MOVEMENT_SCREEN" }
              as: Coach
              as_user_id: "${coach_id}"
              captures: { scr_id: $.data.id }
            - call: "POST /test-sessions/${scr_id}/results"
              payload: { results: [ { metric_code: "OH_SQUAT", value: 3, side: "BILATERAL" }, { metric_code: "HURDLE_STEP", value: 3, side: "BILATERAL" }, { metric_code: "INLINE_LUNGE", value: 3, side: "BILATERAL" }, { metric_code: "SL_HOP_L", value: 3, side: "LEFT" }, { metric_code: "SL_HOP_R", value: 3, side: "RIGHT" } ] }
              as: Coach
              as_user_id: "${coach_id}"
            - call: "POST /test-sessions/${scr_id}/finalize"
              payload: {}
              as: Coach
              as_user_id: "${coach_id}"
            - call: "POST /membership-packages"
              payload: { athlete_id: "${ath_id}", sessions_purchased: 1, price_cents: 12000, expires_on: "2026-12-31" }
              as: FrontDesk
              captures: { pkg_id: $.data.id }
            - call: "POST /group-sessions"
              payload: { start_at: "2026-08-11T10:00:00Z", end_at: "2026-08-11T11:00:00Z", site_code: "ONSITE", station_count: 3, phase_focus: "GENERAL_PREP", max_athletes: 10 }
              as: PerformanceDirector
              captures: { gs_id: $.data.id, gs_v0: $.data.version }
            - call: "POST /group-sessions/${gs_id}/coaches"
              payload: { staff_member_id: "${coach_id}", expected_group_session_version: "${gs_v0}" }
              as: PerformanceDirector
            - call: "POST /enrollments"
              payload: { athlete_id: "${ath_id}", group_session_id: "${gs_id}", funding_preference: "PACKAGE_ONLY" }
              as: FrontDesk
              captures: { enr_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T10:00:00Z" }
              as: FrontDesk
          trigger:
