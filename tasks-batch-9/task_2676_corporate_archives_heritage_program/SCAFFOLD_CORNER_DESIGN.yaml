  # ------------------------------------------------------------------------------
  # SECTION 2 — STATE MACHINES (§1.2)
  # ------------------------------------------------------------------------------
  - section: state_machines
    instances:

      - name: accession_starts_in_received_status_on_create
        claim_type: initial_state
        grounds:
          - state_machines.Accession.initial_state
          - entities.Accession.fields.status
          - entities.Accession.fields.provenance_documented
        distinguishing_aspect: "A newly created Accession is RECEIVED with provenance_documented false, processed_unit_count 0 and deaccessioned_unit_count 0 — no transition has fired yet."
        test_recipe:
          setup:
            - "One RetentionSchedule and one RecordSeries."
          setup_api_calls:
            - call: "POST /retention-schedules"
              payload: { code: "GEN-05", retention_years: 5, disposition_action: "DESTROY", legal_citation: "Corp Policy 1.4", min_appraisal_score_for_permanent: 84.00 }
              as: ArchivesDirector
              as_user_id: "director-a"
              captures: { sched_id: $.data.id }
            - call: "POST /record-series"
              payload: { title: "General Files", business_unit: "Administration", retention_schedule_id: "${sched_id}", sensitivity_ceiling: "INTERNAL", annual_volume_linear_feet: 30, earliest_record_year: 1975, latest_record_year: 2001 }
              as: Archivist
              as_user_id: "archivist-a"
              captures: { series_id: $.data.id }
          trigger:
            - call: "POST /accessions"
              payload: { record_series_id: "${series_id}", donor_name: "Administration Office", transfer_instrument: "INTERNAL_TRANSFER", declared_unit_count: 4 }
              as: Archivist
              as_user_id: "archivist-a"
              captures: { acc_id: $.data.id }
          assert:
            - "HTTP status is 201"
            - "Accession.${acc_id}.status == RECEIVED"
            - "Accession.${acc_id}.provenance_documented == false"
            - "Accession.${acc_id}.processed_unit_count == 0"
            - "Accession.${acc_id}.deaccessioned_unit_count == 0"
            - "Accession.${acc_id}.version == 1"

      - name: accession_verify_provenance_moves_received_to_provenance_verified
        claim_type: valid_transition
        grounds:
          - state_machines.Accession.RECEIVED_to_PROVENANCE_VERIFIED
          - endpoints[POST /accessions/{id}/verify-provenance]
        distinguishing_aspect: "verify-provenance moves the accession RECEIVED -> PROVENANCE_VERIFIED, flips provenance_documented to true and stores both the statement and the instrument reference."
        test_recipe:
          setup:
            - "One RECEIVED Accession with declared_unit_count 2."
          setup_api_calls:
            - call: "POST /retention-schedules"
              payload: { code: "GEN-06", retention_years: 6, disposition_action: "REVIEW", legal_citation: "Corp Policy 1.5", min_appraisal_score_for_permanent: 81.00 }
              as: ArchivesDirector
              as_user_id: "director-a"
              captures: { sched_id: $.data.id }
            - call: "POST /record-series"
              payload: { title: "Facilities Records", business_unit: "Facilities", retention_schedule_id: "${sched_id}", sensitivity_ceiling: "INTERNAL", annual_volume_linear_feet: 16, earliest_record_year: 1968, latest_record_year: 2003 }
              as: Archivist
              as_user_id: "archivist-a"
              captures: { series_id: $.data.id }
            - call: "POST /accessions"
              payload: { record_series_id: "${series_id}", donor_name: "Facilities Office", transfer_instrument: "INTERNAL_TRANSFER", declared_unit_count: 2 }
              as: Archivist
              as_user_id: "archivist-a"
              captures: { acc_id: $.data.id }
          trigger:
            - call: "POST /accessions/${acc_id}/verify-provenance"
              payload: { provenance_statement: "Chain of custody confirmed against the 1998 facilities inventory.", transfer_instrument_reference: "IT-2026-052" }
              as: Archivist
              as_user_id: "archivist-a"
          assert:
            - "HTTP status is 200"
            - "Accession.${acc_id}.status == PROVENANCE_VERIFIED"
            - "Accession.${acc_id}.provenance_documented == true"
            - "Accession.${acc_id}.provenance_statement == \"Chain of custody confirmed against the 1998 facilities inventory.\""
            - "Accession.${acc_id}.transfer_instrument_reference == \"IT-2026-052\""
            - "Accession.${acc_id}.version == 2"

      - name: finding_aid_publish_moves_under_review_to_published_and_stamps_published_at
