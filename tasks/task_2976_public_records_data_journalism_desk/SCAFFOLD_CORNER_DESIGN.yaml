      - name: dataset_creation_rejects_an_investigation_belonging_to_another_desk
        claim_type: graph
        grounds:
          - entities.Dataset.fields.investigation_id
          - entities.Dataset.fields.request_id
          - errors[ERR_DATASET_NOT_LINKED]
          - complexity_profile.entity_topology
        distinguishing_aspect: |
          Dataset is the node that closes the Investigation <-> Dataset reference cycle, so its two
          foreign keys must be checked for MUTUAL consistency and not merely for existence: a request on
          desk A plus an investigation on desk B are both resolvable, yet the pair is refused with
          ERR_DATASET_NOT_LINKED (422) because the cycle would span two desks and let one desk's budget
          fund another desk's release.
        test_recipe:
          setup:
            - "Two Desks; one Agency; one RecordsRequest on desk A; one Investigation on desk A and one Investigation on desk B."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ManagingEditor
            - call: "POST /records-desk/desks"
              payload: { name: "Metro Investigations Desk", fee_budget_total_cents: 500000, retention_policy_days: 1095 }
              as: ManagingEditor
              captures: { desk_a_id: $.data.id }
            - call: "POST /records-desk/desks"
              payload: { name: "Statehouse Investigations Desk", fee_budget_total_cents: 500000, retention_policy_days: 1095 }
              as: ManagingEditor
              captures: { desk_b_id: $.data.id }
            - call: "POST /records-desk/agencies"
              payload: { name: "State Housing Authority", jurisdiction_code: "CA-STATE", statute_name: "CPRA", initial_response_days: 10, deadline_basis: "BUSINESS_DAYS", tolling_allowed: true, appeal_venue: "OMBUDS", appeal_decision_days: 20, search_fee_cents_per_hour: 3500, page_fee_cents: 25, max_waiver_cents: 10000, holiday_dates: ["2026-09-07"] }
              as: RecordsCoordinator
              captures: { agency_id: $.data.id }
            - call: "GET /records-desk/desks/${desk_a_id}"
              as: RecordsCoordinator
              captures: { desk_a_v: $.data.version }
            - call: "POST /records-desk/records-requests"
              payload: { desk_id: "${desk_a_id}", agency_id: "${agency_id}", subject_summary: "Cross-desk linkage probe", requested_format: "CSV", estimated_page_count: 10, waiver_requested: false, public_interest_score: 10, expected_desk_version: "${desk_a_v}" }
              as: RecordsCoordinator
              captures: { req_a_id: $.data.id }
            - call: "POST /records-desk/investigations"
              payload: { desk_id: "${desk_a_id}", headline: "Desk A investigation", publication_mode: "METHODOLOGY_ONLY" }
              as: ManagingEditor
              captures: { inv_a_id: $.data.id }
            - call: "POST /records-desk/investigations"
              payload: { desk_id: "${desk_b_id}", headline: "Desk B investigation", publication_mode: "METHODOLOGY_ONLY" }
              as: ManagingEditor
              captures: { inv_b_id: $.data.id }
          trigger:
            - call: "POST /records-desk/datasets"
              payload: { request_id: "${req_a_id}", investigation_id: "${inv_b_id}", name: "cross-desk-dataset", negotiated_format: "CSV", expected_field_count: 1, sensitivity_tier: "PUBLIC" }
              as: DataReporter
              captures: { e1: $.data.error_id }
            - call: "POST /records-desk/datasets"
              payload: { request_id: "${req_a_id}", investigation_id: "00000000-0000-4000-8000-000000000000", name: "cross-desk-dataset", negotiated_format: "CSV", expected_field_count: 1, sensitivity_tier: "PUBLIC" }
              as: DataReporter
              captures: { e2: $.data.error_id }
            - call: "POST /records-desk/datasets"
              payload: { request_id: "${req_a_id}", investigation_id: "${inv_a_id}", name: "cross-desk-dataset", negotiated_format: "CSV", expected_field_count: 1, sensitivity_tier: "PUBLIC" }
              as: DataReporter
              captures: { ds_ok_id: $.data.id }
          assert:
            - "trigger call 1: HTTP 422 with error_id == \"ERR_DATASET_NOT_LINKED\" - both foreign keys resolve, but the investigation's desk is not the request's desk"
            - "trigger call 2: HTTP 404 with error_id == \"ERR_INVESTIGATION_NOT_FOUND\" - the priority-60 existence check precedes the linkage check"
            - "trigger call 3: HTTP 201 with the same dataset name, proving call 1 persisted nothing (otherwise this would be ERR_DATASET_NAME_CONFLICT)"
            - "trigger call 3: Dataset.${ds_ok_id}.investigation_id == \"${inv_a_id}\", request_id == \"${req_a_id}\", status == \"RAW\", format_negotiation_status == \"REQUESTED\", documentation_status == \"INCOMPLETE\", record_count == 0, allocated_cost_cents == 0"
