            - call: "POST /trade-packages/${tp_id}/bids"
              payload: { bidder_name: "Iota Elec2", contact_email: "i2@x.com", base_bid_cents: 9100000, bid_received_at: "2026-05-15T13:00:00Z" }
              as: BuyoutLead
              captures: { bid_i2: $.data.id }
            - call: "POST /trade-packages/${tp_id}/close-bidding"
              as: BuyoutLead
            - call: "POST /trade-packages/${tp_id}/bids/${bid_i2}/withdraw"
              as: BuyoutLead
            - call: "POST /trade-packages/${tp_id}/subcontracts"
              payload: { subcontractor_name: "Theta Elec", source_bid_id: "${bid_th}", flow_down_terms: "fd", payment_terms: { retainage_pct: 0.10, pay_if_paid: true }, change_authority_limits: [{ max_value_cents: -1, max_cumulative_pct: -1, roles: ["OperationsManager"] }] }
              as: BuyoutLead
              captures: { sub_h: $.data.id }
            - call: "POST /subcontracts/${sub_h}/recommend-award"
