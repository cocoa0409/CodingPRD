          - errors[ERR_ALIAS_CHAIN_NOT_ALLOWED]
          - calculations.seller_strike_points
        distinguishing_aspect: "The alias graph is exactly one level deep: after B is linked to A, linking C to B (target is itself an alias), linking A to C (source is already a canonical root of B) and linking A to A (self-link) are all ERR_ALIAS_CHAIN_NOT_ALLOWED."
