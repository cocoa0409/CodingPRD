  - rule_id: priority_pair_validation_conflict
    instances:
      - name: license_issue_reports_booking_state_before_insufficient_deposit_credit
        grounds:
          - validations[priority=40]
          - validations[priority=95]
          - errors.ERR_BOOKING_STATE_INVALID
          - errors.ERR_INSUFFICIENT_DEPOSIT_CREDIT
        distinguishing_aspect: |
          Category pair state (priority 40) versus business_fiscal (priority 95). A DRAFT
          license sits on a CANCELLED booking held by a client with credit_balance_cents 0
          against a deposit_required_cents of 1350000, so both checks fail on one call. The
          contract demands 409 ERR_BOOKING_STATE_INVALID; an implementation that runs the
          money check first answers 402 ERR_INSUFFICIENT_DEPOSIT_CREDIT.
        test_recipe:
          setup:
            - "Ballroom B has daily_base_rate_cents 1200000 and the CONSUMER_SHOW window has rental_discount_pct 0.0"
            - "Sunbelt Show Promotions has paid no deposits, so credit_balance_cents is 0"
            - "the booking on 2027-06-08 through 2027-06-13 has deposit_required_cents 1350000 and has been cancelled while holding no SpaceHold rows"
            - "its LicenseAgreement is still DRAFT"
          setup_api_calls:
            - call: "POST /convention-center/policy-windows"
              payload: { event_class: "CONSUMER_SHOW", priority_rank: 3, open_months_before: 18, close_months_before: 2, max_holds_per_booking: 2, challenge_response_hours: 48, rental_discount_pct: 0.0, max_challenge_rounds: 1 }
