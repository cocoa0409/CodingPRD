            - call: "POST /otb/assortment-items/${item_id}/adopt"
              payload: {}
              as: CategoryBuyer
              as_user_id: "buyer-1"
              captures: { base_mult: $.data.effective_overlay_multiplier_bps, base_st: $.data.sell_through_bps, base_basis: $.data.sell_through_basis }
            - call: "POST /otb/localization-overlays"
              payload: { category_plan_id: "${plan_id}", store_cluster_id: "${cluster_id}", overlay_type: "VOLUME", effective_start: "2026-08-05T00:00:00Z", effective_end: "2026-08-31T00:00:00Z", unit_multiplier_bps: 11000 }
              as: MerchandisePlanner
              as_user_id: "planner-1"
