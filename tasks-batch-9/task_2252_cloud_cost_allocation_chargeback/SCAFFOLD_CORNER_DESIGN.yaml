              - "Second publish: HTTP 200 with data.status == \"PUBLISHED\" and data.published_by_user_id == \"controller-1\"."
              - "Invoice list: meta.total_count == 1 with settlement_status \"UNBILLED\", gross_amount_cents 4000 and dispute_status \"NONE\"."

        - name: manual_adjustment_that_would_drive_a_unit_negative_is_rejected
          claim_type: Violation → Error
          grounds: "§1.4 priority 86 ERR_ADJUSTMENT_WOULD_GO_NEGATIVE (422); §1.2.1 concurrency rule allocation-adjustment-stale-run supplies the expected_allocation_run_version on the same call."
          distinguishing_aspect: "Aggregate validation on a signed adjustment: the exact credit that lands the unit on zero is allowed, and only one cent more is refused — the check is on the unit's line total for the run, not on the adjustment's own sign."
          test_recipe:
            setup:
              - "A COMPUTED_FINAL showback run whose only line is a 1000-cent SHARED line for the unit."
            setup_api_calls:
              - call: "POST /finops/business-units"
                payload: { name: "Ops", cost_center_code: "CC-400", headcount: 10 }
                as: PlatformAdmin
                as_user_id: "admin-1"
                captures: { bu_id: "$.data.id" }
              - call: "POST /finops/cost-records"
                payload: { billing_period_start: "2026-07-01T00:00:00Z", billing_period_end: "2026-08-01T00:00:00Z", resource_kind: "STORAGE", list_cost_cents: 1000 }
                as: PlatformAdmin
                as_user_id: "admin-1"
                captures: { cr_id: "$.data.id" }
              - call: "POST /finops/allocation-runs"
                payload: { mode: "SHOWBACK", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z" }
                as: FinOpsAnalyst
                as_user_id: "analyst-1"
                captures: { run_id: "$.data.id" }
              - call: "POST /finops/allocation-runs/${run_id}/shared-cost-pools"
                payload: { name: "Untagged", methodology: "EVEN_SPLIT", participant_business_unit_ids: ["${bu_id}"] }
                as: FinOpsAnalyst
                as_user_id: "analyst-1"
                captures: { pool_id: "$.data.id" }
              - call: "POST /finops/shared-cost-pools/${pool_id}/absorb-untagged"
                payload: { cost_record_ids: ["${cr_id}"] }
                as: FinOpsAnalyst
                as_user_id: "analyst-1"
              - call: "POST /finops/allocation-runs/${run_id}/compute"
                payload: { variant: "FINAL" }
                as: FinOpsAnalyst
                as_user_id: "analyst-1"
                captures: { run_v: "$.data.version" }
            trigger:
              - call: "POST /finops/allocation-runs/${run_id}/manual-adjustments"
                payload: { expected_allocation_run_version: "${run_v}", business_unit_id: "${bu_id}", allocated_cents: -1001, memo: "over-credit" }
                as: FinOpsController
                as_user_id: "controller-1"
              - call: "POST /finops/allocation-runs/${run_id}/manual-adjustments"
                payload: { expected_allocation_run_version: "${run_v}", business_unit_id: "${bu_id}", allocated_cents: -1000, memo: "zero-out" }
                as: FinOpsController
                as_user_id: "controller-1"
              - call: "GET /finops/allocation-runs/${run_id}"
                payload: {}
                as: FinOpsController
                as_user_id: "controller-1"
            assert:
              - "First adjustment: HTTP 422 with data.error_id == \"ERR_ADJUSTMENT_WOULD_GO_NEGATIVE\"; the run's version is unchanged, so the second call may reuse ${run_v}."
              - "Second adjustment: HTTP 201, data.line_kind == \"MANUAL_ADJUSTMENT\", data.allocated_cents == -1000."
              - "Run read: data.line_count == 2 and data.total_allocated_cents == 1000 — manual lines never move the DIRECT/SHARED total."

        - name: pool_participant_outside_the_scoped_subtree_is_rejected
          claim_type: Violation → Error
          grounds: "§1.4 priority 60 ERR_PARTICIPANT_OUT_OF_SCOPE (422): participants must exist and, when the run has a scope_business_unit_id, sit inside that unit's subtree."
          distinguishing_aspect: "Cross-entity validation over the self-referential business-unit tree: the descendant is accepted while a sibling of the scope root is refused, so the check walks parent_business_unit_id rather than merely testing existence."
          test_recipe:
            setup:
              - "Engineering with child Engineering/Data, plus an unrelated Marketing unit; one SHOWBACK run scoped to Engineering."
            setup_api_calls:
