            - "Member.${referrer_id}.available_points == 500"
            - "Member.${referee_id}.available_points == 350"

      - name: confirm_fifo_burn_exhausts_first_lot_recomputes_balance_depth2
        grounds:
          - state_machines.Redemption.QUOTED_to_CONFIRMED
          - state_machines.PointsLot.ACTIVE_to_EXHAUSTED
          - calculations.member_balance
        distinguishing_aspect: |
          Depth-2 chain from POST /redemptions/{id}/confirm: (1) FIFO burn decrements PointsLot.remaining_points;
          (2) the oldest lot reaching 0 transitions ACTIVE->EXHAUSTED and Member.available_points recomputes.
          Different trigger than the depth-3 cascade (confirm vs purchase).
        test_recipe:
          setup:
            - "ACTIVE program; member M has lot A=600 (older) and lot B=300 (newer); reward R point_cost=700 stock=5; redemption QUOTED for 700."
