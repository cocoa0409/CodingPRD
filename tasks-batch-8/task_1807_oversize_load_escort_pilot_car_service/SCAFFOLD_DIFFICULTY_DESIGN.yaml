            - { call: "POST /escorts", payload: { operator_name: "Risky Rider", certified_state_codes: ["TX"] }, as: Dispatcher, captures: { esc_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: Dispatcher }
