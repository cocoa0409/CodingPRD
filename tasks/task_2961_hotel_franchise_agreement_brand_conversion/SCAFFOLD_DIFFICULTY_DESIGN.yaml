              payload: { category: "GUESTROOM", priority: "MAJOR", description: "Guestroom soft goods and case goods replacement", estimated_cost: 2400000.00 }
              as: BrandStandardsDirector
              captures: { item_guest_id: $.data.id }
            - call: "POST /pips/${pip_id}/items"
              payload: { category: "LIFE_SAFETY", priority: "CRITICAL", description: "Sprinkler and addressable alarm upgrade", estimated_cost: 480000.00 }
              as: BrandStandardsDirector
              captures: { item_ls_id: $.data.id }
            - call: "POST /pips/${pip_id}/items"
              payload: { category: "EXTERIOR", priority: "MINOR", description: "Porte-cochere rebuild and signage", estimated_cost: 240000.00 }
              as: BrandStandardsDirector
              captures: { item_ext_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-05T00:00:00Z" }
              as: BrandStandardsDirector
            - call: "POST /pips/${pip_id}/accept"
              payload: { acknowledgement: "ACCEPTED_IN_FULL" }
              as: Owner
              as_user_id: "${owner_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-20T00:00:00Z" }
              as: Owner
          trigger:
            - call: "POST /pip-items/${item_guest_id}/complete"
              payload: { completion_evidence: "Model room signed off, floors 3-14 installed" }
              as: Owner
              as_user_id: "${owner_id}"
            - call: "GET /pips/${pip_id}"
              payload: {}
              as: BrandStandardsDirector
            - call: "POST /pip-items/${item_guest_id}/verify"
              payload: { outcome: "REJECT", verification_notes: "Case goods finish does not match the approved brand spec." }
              as: BrandStandardsDirector
          assert:
            - "After the complete call the plan reads items_pending_count == 2, items_submitted_count == 1, items_verified_count == 0, items_overdue_count == 0 and status == IN_PROGRESS"
            - "The mid-sequence GET shows items_pending_count + items_submitted_count + items_verified_count + items_overdue_count == PropertyImprovementPlan.${pip_id}.items_total_count == 3"
            - "After the reject PipItem.${item_guest_id}.status == PENDING"
            - "PipItem.${item_guest_id}.rejection_count == 1"
            - "PipItem.${item_guest_id}.verified_at == null"
            - "PipItem.${item_guest_id}.due_date == 2027-04-03 (a rejection does not move the deadline)"
            - "PropertyImprovementPlan.${pip_id}.items_pending_count == 3"
            - "PropertyImprovementPlan.${pip_id}.items_submitted_count == 0"
            - "PropertyImprovementPlan.${pip_id}.items_verified_count == 0"
            - "PropertyImprovementPlan.${pip_id}.items_overdue_count == 0"
            - "PropertyImprovementPlan.${pip_id}.items_total_count == 3, and the four buckets sum to exactly 3 again"
            - "PropertyImprovementPlan.${pip_id}.status == IN_PROGRESS (the plan does not rewind to ACCEPTED)"
            - "PropertyImprovementPlan.${pip_id}.total_estimated_cost == 3120000.00 (unchanged by the reject)"
