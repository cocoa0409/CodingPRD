scaffold_difficulty_design:
  # =================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: source_pte_uncontrolled_vs_controlled
        grounds:
          - calculations.source_pte
          - entities.EmissionSource.fields.uncontrolled_pte_tpy
          - entities.EmissionSource.fields.controlled_pte_tpy
        distinguishing_aspect: >-
          The two PTE variants operate on the EmissionSource domain: uncontrolled ignores
          control_efficiency (219.0 t) while controlled multiplies by (1-0.90) (21.9 t) —
          identical inputs, divergent tons.
        test_recipe:
          setup:
            - "One facility; one source rate=50 lbs/hr, hours=8760, control_efficiency=0.90."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Acme Co", operator_name: "Acme LLC", county: "Kern" }
              as: FacilityOperator
              captures: { fac_id: $.data.id, fac_v0: $.data.version }
            - call: "POST /sources"
              payload: { facility_id: "${fac_id}", source_type: "BOILER", pollutant: "NOX", max_hourly_rate_lbs: 50, operating_hours_per_year: 8760, control_efficiency: 0.90, permit_limit_ppm: 100, expected_facility_version: "${fac_v0}" }
              as: FacilityOperator
              as_user_id: "${fac_id}"
              captures: { src_id: $.data.id }
          trigger:
            - call: "GET /sources/${src_id}"
              payload: {}
              as: FacilityOperator
              as_user_id: "${fac_id}"
          assert:
            - "EmissionSource.${src_id}.uncontrolled_pte_tpy == 219.0"
            - "EmissionSource.${src_id}.controlled_pte_tpy == 21.9"
      - name: emissions_fee_estimated_vs_assessed
        grounds:
          - calculations.emissions_fee
          - entities.EmissionsInventory.fields.estimated_fee_cents
          - entities.EmissionsInventory.fields.assessed_fee_cents
        distinguishing_aspect: >-
          The two fee variants operate on the EmissionsInventory domain: estimated (at submit)
          omits the late surcharge (252500) while assessed (at certify past due_at) adds
          LATE_SURCHARGE_PCT (290375) on the same 60.0-ton total.
        test_recipe:
          setup:
            - "Facility + one source; inventory reporting_year 2025 due_at 2026-04-01 with a single 60.000-ton line item; submitted at clock 2026-03-01, certified at clock 2026-05-01 (late)."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Acme Co", operator_name: "Acme LLC", county: "Kern" }
              as: FacilityOperator
              captures: { fac_id: $.data.id, fac_v0: $.data.version }
            - call: "POST /sources"
              payload: { facility_id: "${fac_id}", source_type: "BOILER", pollutant: "NOX", max_hourly_rate_lbs: 50, operating_hours_per_year: 8760, control_efficiency: 0, permit_limit_ppm: 100, expected_facility_version: "${fac_v0}" }
              as: FacilityOperator
              as_user_id: "${fac_id}"
              captures: { src_id: $.data.id }
            - call: "POST /inventories"
              payload: { facility_id: "${fac_id}", reporting_year: 2025, due_at: "2026-04-01T00:00:00Z" }
              as: FacilityOperator
              as_user_id: "${fac_id}"
              captures: { inv_id: $.data.id }
            - call: "POST /line-items"
              payload: { inventory_id: "${inv_id}", source_id: "${src_id}", method: "ESTIMATED", reported_tons: 60.000 }
              as: FacilityOperator
              as_user_id: "${fac_id}"
            - call: "POST /inventories/${inv_id}/submit"
              payload: {}
              as: FacilityOperator
              as_user_id: "${fac_id}"
            - call: "GET /facilities/${fac_id}"
              payload: {}
              as: PermitReviewer
              captures: { fac_v1: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PermitReviewer
          trigger:
            - call: "POST /inventories/${inv_id}/certify"
              payload: { expected_facility_version: "${fac_v1}" }
              as: PermitReviewer
          assert:
            - "EmissionsInventory.${inv_id}.estimated_fee_cents == 252500"
            - "EmissionsInventory.${inv_id}.assessed_fee_cents == 290375"
  # =================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: emissions_fee_marginal_tier_selection
        grounds:
          - calculations.emissions_fee
          - entities.EmissionsInventory.fields.estimated_fee_cents
        distinguishing_aspect: >-
          Mode (a): the fee is a >=3-input marginal tiered formula (first 25 t @4500, next 75 t
          @4000, above 100 @3500); a 100.0-ton total spans two tiers → 112500+300000 = 412500,
          not a single flat rate.
        test_recipe:
          setup:
            - "Facility + one source; inventory with a single 100.000-ton line item; submitted on time."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Bravo Co", operator_name: "Bravo LLC", county: "Fresno" }
              as: FacilityOperator
              captures: { fac_id: $.data.id, fac_v0: $.data.version }
            - call: "POST /sources"
              payload: { facility_id: "${fac_id}", source_type: "GENERATOR", pollutant: "CO", max_hourly_rate_lbs: 300, operating_hours_per_year: 8760, control_efficiency: 0, permit_limit_ppm: 100, expected_facility_version: "${fac_v0}" }
              as: FacilityOperator
              as_user_id: "${fac_id}"
              captures: { src_id: $.data.id }
            - call: "POST /inventories"
              payload: { facility_id: "${fac_id}", reporting_year: 2025, due_at: "2026-12-31T00:00:00Z" }
              as: FacilityOperator
              as_user_id: "${fac_id}"
              captures: { inv_id: $.data.id }
            - call: "POST /line-items"
              payload: { inventory_id: "${inv_id}", source_id: "${src_id}", method: "ESTIMATED", reported_tons: 100.000 }
              as: FacilityOperator
              as_user_id: "${fac_id}"
          trigger:
            - call: "POST /inventories/${inv_id}/submit"
              payload: {}
              as: FacilityOperator
              as_user_id: "${fac_id}"
          assert:
            - "EmissionsInventory.${inv_id}.total_emissions_tons == 100.0"
            - "EmissionsInventory.${inv_id}.estimated_fee_cents == 412500"
      - name: inventory_total_sum_then_round
        grounds:
          - calculations.inventory_total
          - entities.EmissionsInventory.fields.total_emissions_tons
          - entities.InventoryLineItem.fields.reported_tons
        distinguishing_aspect: >-
          Mode (b): rounding order is pinned sum-then-round — three 21.005-ton line items sum to
          63.015 then round to 63.02; round-each-then-sum would give 63.03, so order changes the cents.
        test_recipe:
          setup:
            - "Facility + one source; inventory with three 21.005-ton line items."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Charlie Co", operator_name: "Charlie LLC", county: "Kern" }
              as: FacilityOperator
              captures: { fac_id: $.data.id, fac_v0: $.data.version }
            - call: "POST /sources"
              payload: { facility_id: "${fac_id}", source_type: "FLARE", pollutant: "VOC", max_hourly_rate_lbs: 20, operating_hours_per_year: 8760, control_efficiency: 0, permit_limit_ppm: 50, expected_facility_version: "${fac_v0}" }
              as: FacilityOperator
              as_user_id: "${fac_id}"
              captures: { src_id: $.data.id }
            - call: "POST /inventories"
              payload: { facility_id: "${fac_id}", reporting_year: 2025, due_at: "2026-12-31T00:00:00Z" }
              as: FacilityOperator
              as_user_id: "${fac_id}"
              captures: { inv_id: $.data.id }
            - call: "POST /line-items"
              payload: { inventory_id: "${inv_id}", source_id: "${src_id}", method: "ESTIMATED", reported_tons: 21.005 }
              as: FacilityOperator
              as_user_id: "${fac_id}"
            - call: "POST /line-items"
              payload: { inventory_id: "${inv_id}", source_id: "${src_id}", method: "ESTIMATED", reported_tons: 21.005 }
              as: FacilityOperator
              as_user_id: "${fac_id}"
            - call: "POST /line-items"
              payload: { inventory_id: "${inv_id}", source_id: "${src_id}", method: "ESTIMATED", reported_tons: 21.005 }
              as: FacilityOperator
              as_user_id: "${fac_id}"
          trigger:
            - call: "POST /inventories/${inv_id}/submit"
              payload: {}
              as: FacilityOperator
              as_user_id: "${fac_id}"
          assert:
            - "EmissionsInventory.${inv_id}.total_emissions_tons == 63.02"
  # =================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: permit_revision_cycle_returns_to_draft
        grounds:
          - state_machines.Permit.UNDER_REVIEW_to_DRAFT
          - state_machines.Permit.DRAFT_to_SUBMITTED
        distinguishing_aspect: >-
          Permit is cyclic: UNDER_REVIEW -> DRAFT (return-for-revision) then DRAFT -> SUBMITTED
          again, a loop no linear pipeline permits.
        test_recipe:
          setup:
            - "Facility with a small source (PERMIT_BY_RULE track); a PERMIT_BY_RULE permit submitted, review begun, then returned for revision (back to DRAFT)."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Delta Co", operator_name: "Delta LLC", county: "Kern" }
              as: FacilityOperator
              captures: { fac_id: $.data.id, fac_v0: $.data.version }
            - call: "POST /sources"
              payload: { facility_id: "${fac_id}", source_type: "BOILER", pollutant: "NOX", max_hourly_rate_lbs: 10, operating_hours_per_year: 8760, control_efficiency: 0, permit_limit_ppm: 50, expected_facility_version: "${fac_v0}" }
              as: FacilityOperator
              as_user_id: "${fac_id}"
              captures: { src_id: $.data.id }
            - call: "POST /permits"
              payload: { facility_id: "${fac_id}", permit_type: "PERMIT_BY_RULE" }
              as: FacilityOperator
              as_user_id: "${fac_id}"
              captures: { perm_id: $.data.id }
            - call: "POST /permits/${perm_id}/submit"
              payload: {}
              as: FacilityOperator
              as_user_id: "${fac_id}"
            - call: "POST /permits/${perm_id}/begin-review"
              payload: {}
              as: PermitReviewer
            - call: "POST /permits/${perm_id}/return-for-revision"
              payload: {}
              as: PermitReviewer
          trigger:
            - call: "POST /permits/${perm_id}/submit"
              payload: {}
              as: FacilityOperator
              as_user_id: "${fac_id}"
          assert:
            - "Permit.${perm_id}.status == SUBMITTED"
      - name: exceedance_report_branch_fork_late
        grounds:
          - state_machines.ExceedanceEvent.OPEN_to_REPORTED
          - state_machines.ExceedanceEvent.OPEN_to_REPORTED_LATE
        distinguishing_aspect: >-
          ExceedanceEvent is a branching fork: the single report trigger diverges to REPORTED_LATE
          (not REPORTED) when the clock passes detected_at+72h, and only that branch spawns an
          EnforcementAction — divergent side effects per branch.
        test_recipe:
          setup:
            - "Facility + source; an OPEN EXCEEDANCE detected 2026-03-01; clock advanced to 2026-03-10 (past 72h deadline)."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Echo Co", operator_name: "Echo LLC", county: "Kern" }
              as: FacilityOperator
              captures: { fac_id: $.data.id, fac_v0: $.data.version }
            - call: "POST /sources"
              payload: { facility_id: "${fac_id}", source_type: "BOILER", pollutant: "NOX", max_hourly_rate_lbs: 50, operating_hours_per_year: 8760, control_efficiency: 0, permit_limit_ppm: 100, expected_facility_version: "${fac_v0}" }
              as: FacilityOperator
              as_user_id: "${fac_id}"
              captures: { src_id: $.data.id }
            - call: "POST /exceedances"
              payload: { source_id: "${src_id}", event_type: "EXCEEDANCE", detected_at: "2026-03-01T00:00:00Z", magnitude_pct: 20 }
              as: Inspector
              captures: { exc_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T00:00:00Z" }
              as: Inspector
          trigger:
            - call: "POST /exceedances/${exc_id}/report"
              payload: {}
              as: FacilityOperator
              as_user_id: "${fac_id}"
          assert:
            - "ExceedanceEvent.${exc_id}.status == REPORTED_LATE"
            - "Facility.${fac_id}.compliance_status == ENFORCEMENT"
  # =================================================================
  - rule_id: transitive_cascade
    instances:
      - name: stack_test_failed_cascades_to_facility_deviation
        grounds:
          - state_machines.StackTest.CONDUCTED_to_FAILED
          - state_machines.ExceedanceEvent.initial_state
          - entities.Facility.fields.compliance_status
          - entities.Facility.fields.open_exceedance_count
        distinguishing_aspect: >-
          Depth-3 chain, each link caused by the prior: StackTest CONDUCTED->FAILED creates an
          ExceedanceEvent(OPEN); that creation drives Facility.compliance_status to DEVIATION and
          open_exceedance_count to 1.
        test_recipe:
          setup:
            - "Facility + source rate=50; a stack test scheduled 2026-03-01..02 (clock default 2026-03-01)."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Foxtrot Co", operator_name: "Foxtrot LLC", county: "Kern" }
              as: FacilityOperator
              captures: { fac_id: $.data.id, fac_v0: $.data.version }
            - call: "POST /sources"
              payload: { facility_id: "${fac_id}", source_type: "BOILER", pollutant: "NOX", max_hourly_rate_lbs: 50, operating_hours_per_year: 8760, control_efficiency: 0, permit_limit_ppm: 100, expected_facility_version: "${fac_v0}" }
              as: FacilityOperator
              as_user_id: "${fac_id}"
              captures: { src_id: $.data.id }
            - call: "POST /stack-tests"
              payload: { source_id: "${src_id}", scheduled_start: "2026-03-01T00:00:00Z", scheduled_end: "2026-03-02T00:00:00Z" }
              as: Inspector
              captures: { st_id: $.data.id }
          trigger:
            - call: "POST /stack-tests/${st_id}/conduct"
              payload: { measured_rate_lbs: 60 }
              as: Inspector
          assert:
            - "StackTest.${st_id}.status == FAILED"
            - "Facility.${fac_id}.compliance_status == DEVIATION"
            - "Facility.${fac_id}.open_exceedance_count == 1"
      - name: penalty_assessment_cascades_facility_and_sources
        grounds:
          - state_machines.EnforcementAction.INITIATED_to_PENALTY_ASSESSED
          - state_machines.EmissionSource.OPERATING_to_SUSPENDED
          - entities.Facility.fields.compliance_status
        distinguishing_aspect: >-
          Depth-3 chain from a different trigger: assess-penalty sets EnforcementAction
          PENALTY_ASSESSED, which flips Facility to SUSPENDED, which in turn suspends the
          OPERATING source; penalty_cents = 250000 (sev 1, 0 days).
        test_recipe:
          setup:
            - "Facility + one source moved REGISTERED->PERMITTED->OPERATING; an INITIATED PENALTY enforcement action."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Golf Co", operator_name: "Golf LLC", county: "Kern" }
              as: FacilityOperator
              captures: { fac_id: $.data.id, fac_v0: $.data.version }
            - call: "POST /sources"
              payload: { facility_id: "${fac_id}", source_type: "BOILER", pollutant: "NOX", max_hourly_rate_lbs: 50, operating_hours_per_year: 8760, control_efficiency: 0, permit_limit_ppm: 100, expected_facility_version: "${fac_v0}" }
              as: FacilityOperator
              as_user_id: "${fac_id}"
              captures: { src_id: $.data.id }
            - call: "POST /sources/${src_id}/permit"
              payload: {}
              as: PermitReviewer
            - call: "POST /sources/${src_id}/start-operating"
              payload: {}
              as: FacilityOperator
              as_user_id: "${fac_id}"
            - call: "POST /enforcement-actions"
              payload: { facility_id: "${fac_id}", action_type: "PENALTY", origin: "MANUAL" }
              as: EnforcementOfficer
              captures: { ea_id: $.data.id }
          trigger:
            - call: "POST /enforcement-actions/${ea_id}/assess-penalty"
              payload: {}
              as: EnforcementOfficer
          assert:
            - "EnforcementAction.${ea_id}.status == PENALTY_ASSESSED"
            - "EnforcementAction.${ea_id}.penalty_cents == 250000"
            - "Facility.${fac_id}.compliance_status == SUSPENDED"
            - "EmissionSource.${src_id}.lifecycle_status == SUSPENDED"
  # =================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: certify_suspended_beats_unresolved_exceedance
        grounds:
          - validations[priority=6]
          - validations[priority=8]
          - errors[ERR_FACILITY_SUSPENDED]
          - errors[ERR_UNRESOLVED_EXCEEDANCE]
        distinguishing_aspect: >-
          Category pair state (priority 6, ERR_FACILITY_SUSPENDED) vs business_safety
          (priority 8, ERR_UNRESOLVED_EXCEEDANCE): both hold at certify, state wins →
          ERR_FACILITY_SUSPENDED.
        test_recipe:
          setup:
            - "Facility + source; SUBMITTED inventory over that source; an OPEN exceedance on the source; a PENALTY assessed so the facility is SUSPENDED."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Hotel Co", operator_name: "Hotel LLC", county: "Kern" }
              as: FacilityOperator
              captures: { fac_id: $.data.id, fac_v0: $.data.version }
            - call: "POST /sources"
              payload: { facility_id: "${fac_id}", source_type: "BOILER", pollutant: "NOX", max_hourly_rate_lbs: 50, operating_hours_per_year: 8760, control_efficiency: 0, permit_limit_ppm: 100, expected_facility_version: "${fac_v0}" }
              as: FacilityOperator
              as_user_id: "${fac_id}"
              captures: { src_id: $.data.id }
            - call: "POST /inventories"
              payload: { facility_id: "${fac_id}", reporting_year: 2025, due_at: "2026-12-31T00:00:00Z" }
              as: FacilityOperator
              as_user_id: "${fac_id}"
              captures: { inv_id: $.data.id }
            - call: "POST /line-items"
              payload: { inventory_id: "${inv_id}", source_id: "${src_id}", method: "ESTIMATED", reported_tons: 10.000 }
              as: FacilityOperator
              as_user_id: "${fac_id}"
            - call: "POST /inventories/${inv_id}/submit"
              payload: {}
              as: FacilityOperator
              as_user_id: "${fac_id}"
            - call: "POST /exceedances"
              payload: { source_id: "${src_id}", event_type: "EXCEEDANCE", detected_at: "2026-03-01T00:00:00Z", magnitude_pct: 20 }
              as: Inspector
            - call: "POST /enforcement-actions"
              payload: { facility_id: "${fac_id}", action_type: "PENALTY", origin: "MANUAL" }
              as: EnforcementOfficer
              captures: { ea_id: $.data.id }
            - call: "POST /enforcement-actions/${ea_id}/assess-penalty"
              payload: {}
              as: EnforcementOfficer
            - call: "GET /facilities/${fac_id}"
              payload: {}
              as: PermitReviewer
              captures: { fac_v_after: $.data.version }
          trigger:
            - call: "POST /inventories/${inv_id}/certify"
              payload: { expected_facility_version: "${fac_v_after}" }
              as: PermitReviewer
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_FACILITY_SUSPENDED"
      - name: permit_issue_invalid_state_beats_notice_not_closed
        grounds:
          - validations[priority=5]
          - validations[priority=7]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_NOTICE_NOT_CLOSED]
        distinguishing_aspect: >-
          Category pair state (priority 5, ERR_INVALID_STATE) vs business_referential
          (priority 7, ERR_NOTICE_NOT_CLOSED): a permit still UNDER_REVIEW with an OPEN notice
          fails both; state wins → ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "Facility + small source (PERMIT_BY_RULE); permit submitted and UNDER_REVIEW; an OPEN public notice exists but issue is attempted before open-public-notice."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "India Co", operator_name: "India LLC", county: "Kern" }
              as: FacilityOperator
              captures: { fac_id: $.data.id, fac_v0: $.data.version }
            - call: "POST /sources"
              payload: { facility_id: "${fac_id}", source_type: "BOILER", pollutant: "NOX", max_hourly_rate_lbs: 10, operating_hours_per_year: 8760, control_efficiency: 0, permit_limit_ppm: 50, expected_facility_version: "${fac_v0}" }
              as: FacilityOperator
              as_user_id: "${fac_id}"
              captures: { src_id: $.data.id }
            - call: "POST /permits"
              payload: { facility_id: "${fac_id}", permit_type: "PERMIT_BY_RULE" }
              as: FacilityOperator
              as_user_id: "${fac_id}"
              captures: { perm_id: $.data.id }
            - call: "POST /permits/${perm_id}/submit"
              payload: {}
              as: FacilityOperator
              as_user_id: "${fac_id}"
            - call: "POST /permits/${perm_id}/begin-review"
              payload: {}
              as: PermitReviewer
            - call: "POST /public-notices"
              payload: { permit_id: "${perm_id}", comment_open_at: "2026-03-01T00:00:00Z", comment_close_at: "2026-03-15T00:00:00Z" }
              as: PermitReviewer
          trigger:
            - call: "POST /permits/${perm_id}/issue"
              payload: {}
              as: PermitReviewer
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
  # =================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: title_v_pte_threshold_ge_100_boundary
        grounds:
          - calculations.facility_pte
          - entities.Facility.fields.potential_to_emit_tpy
          - entities.Facility.fields.permit_track
        distinguishing_aspect: >-
          Metric: facility PTE tons on POST /sources — a source giving exactly 100.000 tpy
          (rate 200, hours 1000) crosses the >= threshold → TITLE_V (99.999 would be
          PERMIT_BY_RULE).
        test_recipe:
          setup:
            - "Facility with one source rate=200 lbs/hr, hours=1000, no control → uncontrolled PTE exactly 100.000."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Juliet Co", operator_name: "Juliet LLC", county: "Kern" }
              as: FacilityOperator
              captures: { fac_id: $.data.id, fac_v0: $.data.version }
            - call: "POST /sources"
              payload: { facility_id: "${fac_id}", source_type: "GENERATOR", pollutant: "NOX", max_hourly_rate_lbs: 200, operating_hours_per_year: 1000, control_efficiency: 0, permit_limit_ppm: 100, expected_facility_version: "${fac_v0}" }
              as: FacilityOperator
              as_user_id: "${fac_id}"
              captures: { src_id: $.data.id }
          trigger:
            - call: "GET /facilities/${fac_id}"
              payload: {}
              as: FacilityOperator
              as_user_id: "${fac_id}"
          assert:
            - "Facility.${fac_id}.potential_to_emit_tpy == 100.0"
            - "Facility.${fac_id}.permit_track == TITLE_V"
      - name: cem_exceedance_strict_greater_than_boundary
        grounds:
          - calculations.cem_exceedance
          - entities.CEMDataBlock.fields.is_exceedance
          - entities.EmissionSource.fields.permit_limit_ppm
        distinguishing_aspect: >-
          Different metric/endpoint: concentration ppm on POST /sources/{id}/cem-data — avg equal
          to permit_limit_ppm (100 == 100) is NOT an exceedance because the test is strict > (not >=).
        test_recipe:
          setup:
            - "Facility + source with permit_limit_ppm=100; one CEM block with avg_concentration_ppm exactly 100."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Kilo Co", operator_name: "Kilo LLC", county: "Kern" }
              as: FacilityOperator
              captures: { fac_id: $.data.id, fac_v0: $.data.version }
            - call: "POST /sources"
              payload: { facility_id: "${fac_id}", source_type: "BOILER", pollutant: "SO2", max_hourly_rate_lbs: 50, operating_hours_per_year: 8760, control_efficiency: 0, permit_limit_ppm: 100, expected_facility_version: "${fac_v0}" }
              as: FacilityOperator
              as_user_id: "${fac_id}"
              captures: { src_id: $.data.id }
          trigger:
            - call: "POST /sources/${src_id}/cem-data"
              payload: { period_start: "2026-03-01T00:00:00Z", period_end: "2026-03-02T00:00:00Z", avg_concentration_ppm: 100 }
              as: Inspector
              captures: { cem_id: $.data.id }
          assert:
            - "CEMDataBlock.${cem_id}.is_exceedance == false"
  # =================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: permit_issue_requires_public_notice_closed
        grounds:
          - state_machines.Permit.PUBLIC_NOTICE_to_ISSUED
          - entities.PublicNotice.fields.status
          - validations[priority=7]
        distinguishing_aspect: >-
          Entity pair Permit -> PublicNotice: the Permit PUBLIC_NOTICE->ISSUED transition is gated
          by the linked PublicNotice.status == CLOSED; an OPEN notice blocks issue with
          ERR_NOTICE_NOT_CLOSED.
        test_recipe:
          setup:
            - "Facility + small source; permit taken to PUBLIC_NOTICE with its notice still OPEN."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Lima Co", operator_name: "Lima LLC", county: "Kern" }
              as: FacilityOperator
              captures: { fac_id: $.data.id, fac_v0: $.data.version }
            - call: "POST /sources"
              payload: { facility_id: "${fac_id}", source_type: "BOILER", pollutant: "NOX", max_hourly_rate_lbs: 10, operating_hours_per_year: 8760, control_efficiency: 0, permit_limit_ppm: 50, expected_facility_version: "${fac_v0}" }
              as: FacilityOperator
              as_user_id: "${fac_id}"
              captures: { src_id: $.data.id }
            - call: "POST /permits"
              payload: { facility_id: "${fac_id}", permit_type: "PERMIT_BY_RULE" }
              as: FacilityOperator
              as_user_id: "${fac_id}"
              captures: { perm_id: $.data.id }
            - call: "POST /permits/${perm_id}/submit"
              payload: {}
              as: FacilityOperator
              as_user_id: "${fac_id}"
            - call: "POST /permits/${perm_id}/begin-review"
              payload: {}
              as: PermitReviewer
            - call: "POST /public-notices"
              payload: { permit_id: "${perm_id}", comment_open_at: "2026-03-01T00:00:00Z", comment_close_at: "2026-03-15T00:00:00Z" }
              as: PermitReviewer
            - call: "POST /permits/${perm_id}/open-public-notice"
              payload: {}
              as: PermitReviewer
          trigger:
            - call: "POST /permits/${perm_id}/issue"
              payload: {}
              as: PermitReviewer
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOTICE_NOT_CLOSED"
      - name: certify_requires_no_open_exceedance_on_sources
        grounds:
          - state_machines.EmissionsInventory.SUBMITTED_to_CERTIFIED
          - entities.ExceedanceEvent.fields.status
          - validations[priority=8]
        distinguishing_aspect: >-
          Entity pair EmissionsInventory -> ExceedanceEvent: certify is gated by the ExceedanceEvent
          status of the inventory's sources; an OPEN exceedance (facility only DEVIATION, not
          SUSPENDED) blocks certify with ERR_UNRESOLVED_EXCEEDANCE.
        test_recipe:
          setup:
            - "Facility + source; SUBMITTED inventory over that source; one OPEN exceedance on the source; facility not suspended."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Mike Co", operator_name: "Mike LLC", county: "Kern" }
              as: FacilityOperator
              captures: { fac_id: $.data.id, fac_v0: $.data.version }
            - call: "POST /sources"
              payload: { facility_id: "${fac_id}", source_type: "BOILER", pollutant: "NOX", max_hourly_rate_lbs: 50, operating_hours_per_year: 8760, control_efficiency: 0, permit_limit_ppm: 100, expected_facility_version: "${fac_v0}" }
              as: FacilityOperator
              as_user_id: "${fac_id}"
              captures: { src_id: $.data.id }
            - call: "POST /inventories"
              payload: { facility_id: "${fac_id}", reporting_year: 2025, due_at: "2026-12-31T00:00:00Z" }
              as: FacilityOperator
              as_user_id: "${fac_id}"
              captures: { inv_id: $.data.id }
            - call: "POST /line-items"
              payload: { inventory_id: "${inv_id}", source_id: "${src_id}", method: "ESTIMATED", reported_tons: 10.000 }
              as: FacilityOperator
              as_user_id: "${fac_id}"
            - call: "POST /inventories/${inv_id}/submit"
              payload: {}
              as: FacilityOperator
              as_user_id: "${fac_id}"
            - call: "POST /exceedances"
              payload: { source_id: "${src_id}", event_type: "EXCEEDANCE", detected_at: "2026-03-01T00:00:00Z", magnitude_pct: 5 }
              as: Inspector
            - call: "GET /facilities/${fac_id}"
              payload: {}
              as: PermitReviewer
              captures: { fac_v1: $.data.version }
          trigger:
            - call: "POST /inventories/${inv_id}/certify"
              payload: { expected_facility_version: "${fac_v1}" }
              as: PermitReviewer
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_UNRESOLVED_EXCEEDANCE"
  # =================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: stack_test_within_seven_day_buffer_rejected
        grounds:
          - validations[priority=10]
          - errors[ERR_STACK_TEST_CONFLICT]
          - entities.StackTest.fields.scheduled_start
          - entities.StackTest.fields.scheduled_end
        distinguishing_aspect: >-
          Resource EmissionSource, closed-interval + 7-day buffer semantics: a second window
          starting 2026-03-05 (only 3 days after the first ends 2026-03-02) is inside the
          STACK_TEST_BUFFER_DAYS gap → ERR_STACK_TEST_CONFLICT, even though the windows do not overlap.
        test_recipe:
          setup:
            - "Facility + source; one StackTest scheduled 2026-03-01..2026-03-02."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "November Co", operator_name: "November LLC", county: "Kern" }
              as: FacilityOperator
              captures: { fac_id: $.data.id, fac_v0: $.data.version }
            - call: "POST /sources"
              payload: { facility_id: "${fac_id}", source_type: "BOILER", pollutant: "NOX", max_hourly_rate_lbs: 50, operating_hours_per_year: 8760, control_efficiency: 0, permit_limit_ppm: 100, expected_facility_version: "${fac_v0}" }
              as: FacilityOperator
              as_user_id: "${fac_id}"
              captures: { src_id: $.data.id }
            - call: "POST /stack-tests"
              payload: { source_id: "${src_id}", scheduled_start: "2026-03-01T00:00:00Z", scheduled_end: "2026-03-02T00:00:00Z" }
              as: Inspector
              captures: { st1: $.data.id }
          trigger:
            - call: "POST /stack-tests"
              payload: { source_id: "${src_id}", scheduled_start: "2026-03-05T00:00:00Z", scheduled_end: "2026-03-06T00:00:00Z" }
              as: Inspector
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STACK_TEST_CONFLICT"
      - name: inspection_half_open_adjacency_allowed
        grounds:
          - validations[priority=11]
          - entities.Inspection.fields.scheduled_start
          - entities.Inspection.fields.scheduled_end
        distinguishing_aspect: >-
          Resource Facility, half-open [start,end) semantics: a second inspection starting exactly
          at the first's end (12:00 == 12:00) is ACCEPTED (adjacency allowed) — the opposite
          boundary treatment from the stack-test buffer rule.
        test_recipe:
          setup:
            - "Facility with one inspection scheduled 2026-03-01 10:00..12:00."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Oscar Co", operator_name: "Oscar LLC", county: "Kern" }
              as: FacilityOperator
              captures: { fac_id: $.data.id, fac_v0: $.data.version }
            - call: "POST /inspections"
              payload: { facility_id: "${fac_id}", scheduled_start: "2026-03-01T10:00:00Z", scheduled_end: "2026-03-01T12:00:00Z" }
              as: Inspector
              captures: { insp1: $.data.id }
          trigger:
            - call: "POST /inspections"
              payload: { facility_id: "${fac_id}", scheduled_start: "2026-03-01T12:00:00Z", scheduled_end: "2026-03-01T14:00:00Z" }
              as: Inspector
              captures: { insp2: $.data.id }
          assert:
            - "Inspection.${insp2}.status == SCHEDULED"
  # =================================================================
  - rule_id: compensating_invariant
    instances:
      - name: fee_balance_certify_then_amend_nets_to_zero
        grounds:
          - state_machines.EmissionsInventory.SUBMITTED_to_CERTIFIED
          - state_machines.EmissionsInventory.CERTIFIED_to_AMENDED
          - entities.Facility.fields.fee_balance_cents
        distinguishing_aspect: >-
          Conserved quantity currency: certify debits fee_balance_cents by assessed_fee (132500);
          amend credits back exactly 132500, so fee_balance_cents == sum of CERTIFIED assessed
          fees returns to 0 with no drift.
        test_recipe:
          setup:
            - "Facility + source; inventory with a single 30.000-ton line item, submitted then certified on time (assessed 132500)."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Papa Co", operator_name: "Papa LLC", county: "Kern" }
              as: FacilityOperator
              captures: { fac_id: $.data.id, fac_v0: $.data.version }
            - call: "POST /sources"
              payload: { facility_id: "${fac_id}", source_type: "BOILER", pollutant: "NOX", max_hourly_rate_lbs: 50, operating_hours_per_year: 8760, control_efficiency: 0, permit_limit_ppm: 100, expected_facility_version: "${fac_v0}" }
              as: FacilityOperator
              as_user_id: "${fac_id}"
              captures: { src_id: $.data.id }
            - call: "POST /inventories"
              payload: { facility_id: "${fac_id}", reporting_year: 2025, due_at: "2026-12-31T00:00:00Z" }
              as: FacilityOperator
              as_user_id: "${fac_id}"
              captures: { inv_id: $.data.id }
            - call: "POST /line-items"
              payload: { inventory_id: "${inv_id}", source_id: "${src_id}", method: "ESTIMATED", reported_tons: 30.000 }
              as: FacilityOperator
              as_user_id: "${fac_id}"
            - call: "POST /inventories/${inv_id}/submit"
              payload: {}
              as: FacilityOperator
              as_user_id: "${fac_id}"
            - call: "GET /facilities/${fac_id}"
              payload: {}
              as: PermitReviewer
              captures: { fac_v1: $.data.version }
            - call: "POST /inventories/${inv_id}/certify"
              payload: { expected_facility_version: "${fac_v1}" }
              as: PermitReviewer
          trigger:
            - call: "POST /inventories/${inv_id}/amend"
              payload: {}
              as: FacilityOperator
              as_user_id: "${fac_id}"
          assert:
            - "Facility.${fac_id}.fee_balance_cents == 0"
            - "EmissionsInventory.${inv_id}.assessed_fee_cents == 0"
      - name: pte_register_then_shutdown_nets_to_remaining
        grounds:
          - calculations.facility_pte
          - state_machines.EmissionSource.OPERATING_to_SHUTDOWN
          - entities.Facility.fields.potential_to_emit_tpy
        distinguishing_aspect: >-
          Conserved quantity mass (tons): registering source A (+219.0) and B (+43.8) yields
          PTE 262.8; shutting down A subtracts exactly 219.0, leaving 43.8 == sum over
          non-SHUTDOWN sources — a different conserved quantity than the fee-ledger invariant.
        test_recipe:
          setup:
            - "Facility with source A (rate 50, 8760 h → 219.0) permitted, and source B (rate 10, 8760 h → 43.8); PTE 262.8 before shutdown."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Quebec Co", operator_name: "Quebec LLC", county: "Kern" }
              as: FacilityOperator
              captures: { fac_id: $.data.id, fac_v0: $.data.version }
            - call: "POST /sources"
              payload: { facility_id: "${fac_id}", source_type: "BOILER", pollutant: "NOX", max_hourly_rate_lbs: 50, operating_hours_per_year: 8760, control_efficiency: 0, permit_limit_ppm: 100, expected_facility_version: "${fac_v0}" }
              as: FacilityOperator
              as_user_id: "${fac_id}"
              captures: { src_a: $.data.id }
            - call: "GET /facilities/${fac_id}"
              payload: {}
              as: FacilityOperator
              as_user_id: "${fac_id}"
              captures: { fac_v1: $.data.version }
            - call: "POST /sources"
              payload: { facility_id: "${fac_id}", source_type: "GENERATOR", pollutant: "NOX", max_hourly_rate_lbs: 10, operating_hours_per_year: 8760, control_efficiency: 0, permit_limit_ppm: 100, expected_facility_version: "${fac_v1}" }
              as: FacilityOperator
              as_user_id: "${fac_id}"
              captures: { src_b: $.data.id }
            - call: "POST /sources/${src_a}/permit"
              payload: {}
              as: PermitReviewer
          trigger:
            - call: "POST /sources/${src_a}/shutdown"
              payload: {}
              as: FacilityOperator
              as_user_id: "${fac_id}"
          assert:
            - "Facility.${fac_id}.potential_to_emit_tpy == 43.8"
            - "EmissionSource.${src_a}.lifecycle_status == SHUTDOWN"
