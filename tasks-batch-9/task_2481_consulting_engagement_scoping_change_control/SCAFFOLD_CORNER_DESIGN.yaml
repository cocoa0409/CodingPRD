  - name: baseline_tier_boundary_and_per_line_rounding
    claim_type: tiered_pricing
    grounds:
    - calculations.scope_baseline_cost
    excluded_because:
      difficulty_instance: combinatorial_formula / scope_baseline_per_line_rounding_and_discount_tier
      rationale: That instance walks the 199.99 / 200.00 / 200.75 tier boundary and pins the 1-cent per-line-versus-sum divergence.
  - name: change_materiality_threshold_boundary
    claim_type: threshold
    grounds:
    - calculations.change_request_impact
    excluded_because:
      difficulty_instance: boundary_precision_check / change_materiality_ceiling_exact_forty_boundary
      rationale: That instance tests cumulative_change_pct at exactly 40.00 (accepted) and 40.01 (rejected).
  - name: qualification_threshold_boundary
    claim_type: threshold
    grounds:
    - calculations.qualification_score.constants.QUALIFICATION_THRESHOLD
    excluded_because:
      difficulty_instance: boundary_precision_check / qualification_threshold_exact_sixty_boundary
      rationale: That instance tests the verified score at exactly 60.00 and at 59.96 against the inclusive gate.
  - name: burn_ledger_aggregation_after_reversal
    claim_type: aggregation
    grounds:
    - calculations.engagement_economics
    - calculations.time_entry_costing
    excluded_because:
      difficulty_instance: compensating_invariant / time_entry_reversal_restores_burn_ledger
      rationale: That instance asserts the running totals after the add and after the reversal, including the deliverable-level hours_consumed.
  - name: lead_window_interval_semantics
    claim_type: interval_merge
    grounds:
    - calculations.consultant_lead_load
    excluded_because:
      difficulty_instance: resource_temporal_overlap / consultant_capacity_half_open_boundary_and_aggregate_cap
      rationale: That instance pins the half-open touching-window case and the aggregate third-overlap rejection.
  - name: qualification_variant_divergence
    claim_type: variant_divergence
    grounds:
    - calculations.qualification_score.variants
    excluded_because:
      difficulty_instance: dual_variant_calc / qualification_intake_vs_verified_budget_divergence
      rationale: That instance stores both variants on one row (68.00 intake versus 56.00 verified) and shows the gate reading only the verified one.
  - name: sow_pricing_variant_selection
    claim_type: variant_selection
    grounds:
    - calculations.sow_quoted_fee.variants
    excluded_because:
      difficulty_instance: dual_variant_calc / sow_fixed_fee_vs_time_and_materials_variant_divergence
      rationale: That instance prices the same frozen scope under two pricing models and asserts which variant fields each path populates.
  - name: sow_reprice_reconciliation_on_revision
    claim_type: reconciliation
    grounds:
    - calculations.sow_quoted_fee
    - calculations.engagement_risk_score
    excluded_because:
      difficulty_instance: non_linear_state_machine / sow_negotiation_cycle_revision_round_reprice
      rationale: That instance asserts the re-priced quote after the scope change that moved the risk tier on cycle re-entry.
