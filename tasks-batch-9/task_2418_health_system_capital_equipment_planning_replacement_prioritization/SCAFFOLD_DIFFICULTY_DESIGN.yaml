# §1.8 Scaffold Difficulty Design — task 2418 Health System Capital Equipment
# Planning & Replacement Prioritization. Nine §0.5 rule_ids, 24 instances.
# Every numeric literal in an `assert:` was computed by executing the §1.3
# formula it belongs to; no expression is left for the test generator to resolve.
scaffold_difficulty_design:

  # =========================================================================
  # 1. dual_variant_calc — three instances, three different entity domains:
  #    asset condition (EquipmentAsset), lifecycle cost (ReplacementRequest),
  #    capital distribution (FacilityAllocation).
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: asset_nominal_vs_adjusted_ruls_diverge_on_same_asset
        grounds:
          - calculations.asset_ruls_score
          - entities.EquipmentAsset.fields.nominal_ruls_score
          - entities.EquipmentAsset.fields.adjusted_ruls_score
          - entities.EquipmentAsset.fields.service_penalty_points
          - entities.ServiceEvent.fields.downtime_hours
        distinguishing_aspect: >-
          Domain = asset condition: the `nominal` variant reads only install_date and
          expected_life_years (40.00) while the `adjusted` variant subtracts the service
          penalty derived from the same asset's ServiceEvent history (30.00), so the two
          variants of asset_ruls_score differ by exactly 10.00 points on one stored row.
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "Facility NRH with department DEPT-A1 (CT)."
            - "Asset A1 installed 2020-08-02 (exactly 2190 days old -> age_years 6.00), expected_life_years 10, OEM support ending 2029-01-01 so no end-of-support penalty applies."
            - "Two CORRECTIVE service events inside the trailing 730-day window, 4.00 downtime hours each."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: CapitalPlanner
              as_user_id: "planner-setup"
            - call: "POST /capital/facilities"
              payload: { name: "North Regional Hospital", code: "NRH", region: "NORTH", max_concurrent_construction: 1 }
              as: CapitalPlanner
              as_user_id: "planner-setup"
              captures: { fac_a_id: $.data.id }
            - call: "POST /capital/departments"
              payload: { facility_id: "${fac_a_id}", name: "Diagnostic Imaging CT", modality_scope: "CT" }
              as: CapitalPlanner
              as_user_id: "planner-setup"
              captures: { dept_a1_id: $.data.id }
            - call: "POST /capital/assets"
              payload: { facility_id: "${fac_a_id}", department_id: "${dept_a1_id}", modality: "CT", model_name: "Aquilon CT-16", install_date: "2020-08-02T00:00:00Z", expected_life_years: 10, acquisition_cost_cents: 240000000, oem_support_end_date: "2029-01-01T00:00:00Z" }
              as: CapitalPlanner
              as_user_id: "planner-setup"
              captures: { asset_a1_id: $.data.id }
            - call: "POST /capital/assets/${asset_a1_id}/service-events"
              payload: { event_date: "2026-05-01T00:00:00Z", category: "CORRECTIVE", downtime_hours: 4.00, cost_cents: 500000 }
              as: CapitalPlanner
              as_user_id: "planner-setup"
            - call: "POST /capital/assets/${asset_a1_id}/service-events"
              payload: { event_date: "2026-06-01T00:00:00Z", category: "CORRECTIVE", downtime_hours: 4.00, cost_cents: 500000 }
              as: CapitalPlanner
              as_user_id: "planner-setup"
          trigger:
            - call: "GET /capital/assets/${asset_a1_id}"
              as: CapitalPlanner
              as_user_id: "planner-setup"
          assert:
            - "EquipmentAsset.${asset_a1_id}.age_years == 6.00"
            - "EquipmentAsset.${asset_a1_id}.nominal_ruls_score == 40.00"
            - "EquipmentAsset.${asset_a1_id}.service_penalty_points == 10.00"
            - "EquipmentAsset.${asset_a1_id}.adjusted_ruls_score == 30.00"
            - "EquipmentAsset.${asset_a1_id}.nominal_ruls_score - EquipmentAsset.${asset_a1_id}.adjusted_ruls_score == 10.00"
            - "EquipmentAsset.${asset_a1_id}.corrective_count_24m == 2"
            - "EquipmentAsset.${asset_a1_id}.downtime_hours_24m == 8.00"
            - "EquipmentAsset.${asset_a1_id}.unresolved_recall == false"
            - "EquipmentAsset.${asset_a1_id}.status == IN_SERVICE"
            - "EquipmentAsset.${asset_a1_id}.ruls_as_of == 2026-08-01T00:00:00Z"

      - name: tco_budgetary_vs_negotiated_diverge_on_funded_request
        grounds:
          - calculations.five_year_tco
          - calculations.negotiated_capital_price
          - calculations.request_funded_amount
          - entities.ReplacementRequest.fields.budgetary_tco_cents
          - entities.ReplacementRequest.fields.negotiated_tco_cents
          - entities.ReplacementRequest.fields.baseline_year1_opex_cents
          - state_machines.VendorQuote.SUBMITTED_to_ACCEPTED
        distinguishing_aspect: >-
          Domain = lifecycle cost of a ReplacementRequest: accepting a quote switches
          five_year_tco from the `budgetary` variant (escalation 0.05, no warranty waiver,
          tco 388961531) to the `negotiated` variant (quote escalation 0.04, year-1 service
          waived by the 12-month warranty, tco 304231363) — a delta of 84730168 cents, and
          baseline_year1_opex_cents is reconciled from 14228624 to 1882946.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; facility NRH, department DEPT-A1, asset A1 with two CORRECTIVE events (adjusted RULS 30.00, eligible)."
            - "Cycle C1 plan_year 2027 with total_capital_cents 500000000, contingency_pct 0.10, facility_contingency_pct 0.05 -> system_contingency 50000000, distributable 450000000."
            - "One request R1 (estimated 250000001 + modification 60000000), submitted, screened, scored composite 66.18."
            - "Allocation PRO_RATA run by planner-alloc gives facility A its full demand 310000001; committee M1 (CHAIR w3) and M2 (FINANCE w2) both APPROVE; planner-fund funds R1 for 310000001, exhausting the allocation."
            - "GPO contract GPO-CT-2027 and quote Q1 (list 250000001, multi-unit 2, trade-in offer 30000000 against asset A1, escalation 0.04, warranty 12 months) exist in SUBMITTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: CapitalPlanner
              as_user_id: "planner-setup"
            - call: "POST /capital/facilities"
              payload: { name: "North Regional Hospital", code: "NRH", region: "NORTH", max_concurrent_construction: 1 }
              as: CapitalPlanner
              as_user_id: "planner-setup"
              captures: { fac_a_id: $.data.id }
            - call: "POST /capital/departments"
              payload: { facility_id: "${fac_a_id}", name: "Diagnostic Imaging CT", modality_scope: "CT" }
              as: CapitalPlanner
              as_user_id: "planner-setup"
              captures: { dept_a1_id: $.data.id }
            - call: "POST /capital/assets"
              payload: { facility_id: "${fac_a_id}", department_id: "${dept_a1_id}", modality: "CT", model_name: "Aquilon CT-16", install_date: "2020-08-02T00:00:00Z", expected_life_years: 10, acquisition_cost_cents: 240000000, oem_support_end_date: "2029-01-01T00:00:00Z" }
              as: CapitalPlanner
              as_user_id: "planner-setup"
              captures: { asset_a1_id: $.data.id }
            - call: "POST /capital/assets/${asset_a1_id}/service-events"
              payload: { event_date: "2026-05-01T00:00:00Z", category: "CORRECTIVE", downtime_hours: 4.00 }
              as: CapitalPlanner
              as_user_id: "planner-setup"
            - call: "POST /capital/assets/${asset_a1_id}/service-events"
              payload: { event_date: "2026-06-01T00:00:00Z", category: "CORRECTIVE", downtime_hours: 4.00 }
              as: CapitalPlanner
              as_user_id: "planner-setup"
            - call: "POST /capital/cycles"
              payload: { plan_year: 2027, plan_year_start: "2027-01-01T00:00:00Z", total_capital_cents: 500000000, contingency_pct: 0.10, facility_contingency_pct: 0.05 }
              as: CapitalPlanner
              as_user_id: "planner-setup"
              captures: { c1_id: $.data.id }
            - call: "POST /capital/cycles/${c1_id}/open-intake"
              payload: {}
              as: CapitalPlanner
              as_user_id: "planner-setup"
            - call: "POST /capital/committee-members"
              payload: { full_name: "Dana Whitfield", seat: "CHAIR", voting_weight: 3 }
              as: CapitalPlanner
              as_user_id: "planner-setup"
              captures: { m1_id: $.data.id }
            - call: "POST /capital/committee-members"
              payload: { full_name: "Roy Adeyemi", seat: "FINANCE", voting_weight: 2 }
              as: CapitalPlanner
              as_user_id: "planner-setup"
              captures: { m2_id: $.data.id }
            - call: "POST /capital/requests"
              payload: { cycle_id: "${c1_id}", department_id: "${dept_a1_id}", asset_id: "${asset_a1_id}", clinical_justification: "CT-16 scanner at end of service life; replacement restores stroke protocol throughput.", current_annual_volume: 1200, projected_annual_volume: 1801, estimated_capital_cents: 250000001, annual_service_contract_cents: 12345678, disposable_unit_cents: 1230, facility_modification_cents: 60000000, regulatory_mandate_flag: true, mandate_deadline: "2027-06-30T00:00:00Z" }
              as: ClinicalRequester
              as_user_id: "${dept_a1_id}"
              captures: { r1_id: $.data.id }
            - call: "POST /capital/requests/${r1_id}/submit"
              payload: {}
              as: ClinicalRequester
              as_user_id: "${dept_a1_id}"
            - call: "POST /capital/requests/${r1_id}/screen"
              payload: { decision: "ACCEPT", screening_note: "Justification and volume projection accepted." }
              as: CapitalPlanner
              as_user_id: "planner-setup"
            - call: "POST /capital/cycles/${c1_id}/close-intake"
              payload: {}
              as: CapitalPlanner
              as_user_id: "planner-setup"
            - call: "POST /capital/cycles/${c1_id}/score"
              payload: {}
              as: CapitalPlanner
              as_user_id: "planner-setup"
            - call: "GET /capital/cycles/${c1_id}"
              as: CapitalPlanner
              as_user_id: "planner-setup"
              captures: { c1_v: $.data.version }
            - call: "POST /capital/cycles/${c1_id}/allocate"
              payload: { allocation_method: "PRO_RATA", expected_cycle_version: "${c1_v}" }
              as: CapitalPlanner
              as_user_id: "planner-alloc"
            - call: "GET /capital/allocations?cycle_id=${c1_id}&facility_id=${fac_a_id}&posture=ACTIVE"
              as: CapitalPlanner
              as_user_id: "planner-setup"
              captures: { alloc_a_id: "$.data[0].id" }
            - call: "GET /capital/requests/${r1_id}"
              as: CommitteeMember
              as_user_id: "${m1_id}"
              captures: { r1_v_a: $.data.version }
            - call: "POST /capital/requests/${r1_id}/votes"
              payload: { vote: "APPROVE", expected_request_version: "${r1_v_a}", rationale: "Safety driver and regulatory mandate both support replacement." }
              as: CommitteeMember
              as_user_id: "${m1_id}"
            - call: "GET /capital/requests/${r1_id}"
              as: CommitteeMember
              as_user_id: "${m2_id}"
              captures: { r1_v_b: $.data.version }
            - call: "POST /capital/requests/${r1_id}/votes"
              payload: { vote: "APPROVE", expected_request_version: "${r1_v_b}" }
              as: CommitteeMember
              as_user_id: "${m2_id}"
            - call: "POST /capital/requests/${r1_id}/committee-decision"
              payload: { decision_note: "Approved on a 5-of-5 counted weight." }
              as: CommitteeMember
              as_user_id: "${m1_id}"
            - call: "POST /capital/requests/${r1_id}/fund"
              payload: {}
              as: CapitalPlanner
              as_user_id: "planner-fund"
            - call: "POST /capital/gpo-contracts"
              payload: { contract_code: "GPO-CT-2027", vendor_name: "Aquilon Medical Systems", small_tier_pct: 0.05, mid_tier_pct: 0.12, large_tier_pct: 0.18, tier_mid_floor_cents: 100000000, tier_large_floor_cents: 240000000, multi_unit_addendum_pct: 0.03, trade_in_cap_pct: 0.10, expires_on: "2027-12-31T00:00:00Z" }
              as: CapitalPlanner
              as_user_id: "planner-setup"
              captures: { gpo1_id: $.data.id }
            - call: "POST /capital/requests/${r1_id}/quotes"
              payload: { gpo_contract_id: "${gpo1_id}", vendor_name: "Aquilon Medical Systems", list_price_cents: 250000001, service_escalation_pct: 0.04, valid_until: "2027-12-31T00:00:00Z", trade_in_asset_id: "${asset_a1_id}", trade_in_offer_cents: 30000000, multi_unit_count: 2, warranty_months: 12 }
              as: CapitalPlanner
              as_user_id: "planner-setup"
              captures: { q1_id: $.data.id }
          trigger:
            - call: "POST /capital/vendor-quotes/${q1_id}/accept"
              payload: {}
              as: CapitalPlanner
              as_user_id: "planner-setup"
          assert:
            - "VendorQuote.${q1_id}.status == ACCEPTED"
            - "VendorQuote.${q1_id}.net_capital_cents == 178965001"
            - "ReplacementRequest.${r1_id}.budgetary_operating_5y_cents == 78961530"
            - "ReplacementRequest.${r1_id}.budgetary_tco_cents == 388961531"
            - "ReplacementRequest.${r1_id}.negotiated_operating_5y_cents == 65266362"
            - "ReplacementRequest.${r1_id}.negotiated_tco_cents == 304231363"
            - "ReplacementRequest.${r1_id}.budgetary_tco_cents - ReplacementRequest.${r1_id}.negotiated_tco_cents == 84730168"
            - "ReplacementRequest.${r1_id}.baseline_year1_opex_cents == 1882946"
            - "ReplacementRequest.${r1_id}.funded_amount_cents == 238965001"
            - "ReplacementRequest.${r1_id}.status == FUNDED"
            - "FacilityAllocation.${alloc_a_id}.allocated_cents == 310000001"
            - "FacilityAllocation.${alloc_a_id}.committed_cents == 238965001"
            - "FacilityAllocation.${alloc_a_id}.available_cents == 71035000"
            - "FacilityAllocation.${alloc_a_id}.posture == ACTIVE"
            - "CapitalCycle.${c1_id}.exhausted_allocation_count == 0"
            - "CapitalCycle.${c1_id}.status == COMMITTED"
            - "EquipmentAsset.${asset_a1_id}.trade_in_credit_applied_cents == 19885000"
            - "EquipmentAsset.${asset_a1_id}.disposition_status == HELD_FOR_TRADE_IN"

      - name: allocation_pro_rata_vs_rank_ordered_diverge_on_same_score_set
        grounds:
          - calculations.facility_allocation_waterfall
          - entities.FacilityAllocation.fields.allocated_cents
          - entities.FacilityAllocation.fields.contingency_reserve_cents
          - entities.FacilityAllocation.fields.posture
          - state_machines.CapitalCycle.ALLOCATED_to_ALLOCATED
        distinguishing_aspect: >-
          Domain = capital distribution across FacilityAllocation rows: on the identical
          two-facility score set the `PRO_RATA` variant grants B 171000000 / A 279000000
          (including the 1-cent remainder sweep) while the `RANK_ORDERED` re-run grants
          B 190000000 / A 260000000 — a 19000000-cent divergence per facility with
          identical cycle aggregates.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; facilities NRH (north) and SMC (south) with departments DEPT-A1 (CT) and DEPT-B1 (MRI)."
            - "Asset A1 (adjusted RULS 30.00) at DEPT-A1 and asset B1 (OEM support ending 2026-12-01, four CORRECTIVE events, adjusted RULS 20.00) at DEPT-B1."
            - "Cycle C1 plan_year 2027, total_capital_cents 500000000, contingency_pct 0.10, facility_contingency_pct 0.05."
            - "R1 at facility A: 250000001 + 60000000 -> demand 310000001, composite 66.18. R2 at facility B: 150000000 + 40000000 -> demand 190000000, composite 81.60. Both SCORED."
            - "A first allocation run with allocation_method PRO_RATA has completed and nothing has been committed against it."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: CapitalPlanner
              as_user_id: "planner-setup"
            - call: "POST /capital/facilities"
              payload: { name: "North Regional Hospital", code: "NRH", region: "NORTH", max_concurrent_construction: 1 }
              as: CapitalPlanner
              as_user_id: "planner-setup"
              captures: { fac_a_id: $.data.id }
            - call: "POST /capital/facilities"
              payload: { name: "South Metro Center", code: "SMC", region: "SOUTH", max_concurrent_construction: 2 }
              as: CapitalPlanner
              as_user_id: "planner-setup"
              captures: { fac_b_id: $.data.id }
            - call: "POST /capital/departments"
              payload: { facility_id: "${fac_a_id}", name: "Diagnostic Imaging CT", modality_scope: "CT" }
              as: CapitalPlanner
              as_user_id: "planner-setup"
              captures: { dept_a1_id: $.data.id }
            - call: "POST /capital/departments"
              payload: { facility_id: "${fac_b_id}", name: "Advanced MRI Suite", modality_scope: "MRI" }
              as: CapitalPlanner
              as_user_id: "planner-setup"
              captures: { dept_b1_id: $.data.id }
            - call: "POST /capital/assets"
              payload: { facility_id: "${fac_a_id}", department_id: "${dept_a1_id}", modality: "CT", model_name: "Aquilon CT-16", install_date: "2020-08-02T00:00:00Z", expected_life_years: 10, acquisition_cost_cents: 240000000, oem_support_end_date: "2029-01-01T00:00:00Z" }
              as: CapitalPlanner
              as_user_id: "planner-setup"
              captures: { asset_a1_id: $.data.id }
            - call: "POST /capital/assets/${asset_a1_id}/service-events"
              payload: { event_date: "2026-05-01T00:00:00Z", category: "CORRECTIVE", downtime_hours: 4.00 }
              as: CapitalPlanner
              as_user_id: "planner-setup"
            - call: "POST /capital/assets/${asset_a1_id}/service-events"
              payload: { event_date: "2026-06-01T00:00:00Z", category: "CORRECTIVE", downtime_hours: 4.00 }
              as: CapitalPlanner
              as_user_id: "planner-setup"
            - call: "POST /capital/assets"
              payload: { facility_id: "${fac_b_id}", department_id: "${dept_b1_id}", modality: "MRI", model_name: "Helion MR-1.5T", install_date: "2020-08-02T00:00:00Z", expected_life_years: 10, acquisition_cost_cents: 300000000, oem_support_end_date: "2026-12-01T00:00:00Z" }
              as: CapitalPlanner
              as_user_id: "planner-setup"
              captures: { asset_b1_id: $.data.id }
            - call: "POST /capital/assets/${asset_b1_id}/service-events"
              payload: { event_date: "2026-02-01T00:00:00Z", category: "CORRECTIVE", downtime_hours: 0.00 }
              as: CapitalPlanner
              as_user_id: "planner-setup"
            - call: "POST /capital/assets/${asset_b1_id}/service-events"
              payload: { event_date: "2026-03-01T00:00:00Z", category: "CORRECTIVE", downtime_hours: 0.00 }
              as: CapitalPlanner
              as_user_id: "planner-setup"
            - call: "POST /capital/assets/${asset_b1_id}/service-events"
              payload: { event_date: "2026-04-01T00:00:00Z", category: "CORRECTIVE", downtime_hours: 0.00 }
              as: CapitalPlanner
              as_user_id: "planner-setup"
            - call: "POST /capital/assets/${asset_b1_id}/service-events"
              payload: { event_date: "2026-05-01T00:00:00Z", category: "CORRECTIVE", downtime_hours: 0.00 }
              as: CapitalPlanner
              as_user_id: "planner-setup"
            - call: "POST /capital/cycles"
              payload: { plan_year: 2027, plan_year_start: "2027-01-01T00:00:00Z", total_capital_cents: 500000000, contingency_pct: 0.10, facility_contingency_pct: 0.05 }
              as: CapitalPlanner
              as_user_id: "planner-setup"
              captures: { c1_id: $.data.id }
            - call: "POST /capital/cycles/${c1_id}/open-intake"
              payload: {}
              as: CapitalPlanner
              as_user_id: "planner-setup"
            - call: "POST /capital/requests"
              payload: { cycle_id: "${c1_id}", department_id: "${dept_a1_id}", asset_id: "${asset_a1_id}", clinical_justification: "CT-16 scanner at end of service life; replacement restores stroke protocol throughput.", current_annual_volume: 1200, projected_annual_volume: 1801, estimated_capital_cents: 250000001, annual_service_contract_cents: 12345678, disposable_unit_cents: 1230, facility_modification_cents: 60000000, regulatory_mandate_flag: true, mandate_deadline: "2027-06-30T00:00:00Z" }
              as: ClinicalRequester
              as_user_id: "${dept_a1_id}"
              captures: { r1_id: $.data.id }
            - call: "POST /capital/requests/${r1_id}/submit"
              payload: {}
              as: ClinicalRequester
              as_user_id: "${dept_a1_id}"
            - call: "POST /capital/requests"
              payload: { cycle_id: "${c1_id}", department_id: "${dept_b1_id}", asset_id: "${asset_b1_id}", clinical_justification: "1.5T magnet loses OEM support in 2026; replacement is required to keep the MRI suite compliant.", current_annual_volume: 20000, projected_annual_volume: 21999, estimated_capital_cents: 150000000, annual_service_contract_cents: 9000001, disposable_unit_cents: 100, facility_modification_cents: 40000000, regulatory_mandate_flag: true, mandate_deadline: "2027-06-30T00:00:00Z" }
              as: ClinicalRequester
              as_user_id: "${dept_b1_id}"
              captures: { r2_id: $.data.id }
            - call: "POST /capital/requests/${r2_id}/submit"
              payload: {}
              as: ClinicalRequester
              as_user_id: "${dept_b1_id}"
            - call: "POST /capital/requests/${r1_id}/screen"
              payload: { decision: "ACCEPT" }
              as: CapitalPlanner
              as_user_id: "planner-setup"
            - call: "POST /capital/requests/${r2_id}/screen"
              payload: { decision: "ACCEPT" }
              as: CapitalPlanner
              as_user_id: "planner-setup"
            - call: "POST /capital/cycles/${c1_id}/close-intake"
              payload: {}
              as: CapitalPlanner
              as_user_id: "planner-setup"
            - call: "POST /capital/cycles/${c1_id}/score"
              payload: {}
              as: CapitalPlanner
              as_user_id: "planner-setup"
            - call: "GET /capital/cycles/${c1_id}"
              as: CapitalPlanner
              as_user_id: "planner-setup"
              captures: { c1_v: $.data.version }
            - call: "POST /capital/cycles/${c1_id}/allocate"
              payload: { allocation_method: "PRO_RATA", expected_cycle_version: "${c1_v}" }
              as: CapitalPlanner
              as_user_id: "planner-alloc"
            - call: "GET /capital/allocations?cycle_id=${c1_id}&facility_id=${fac_a_id}&posture=ACTIVE"
              as: CapitalPlanner
              as_user_id: "planner-setup"
              captures: { alloc_a_pro_id: "$.data[0].id" }
            - call: "GET /capital/allocations?cycle_id=${c1_id}&facility_id=${fac_b_id}&posture=ACTIVE"
              as: CapitalPlanner
              as_user_id: "planner-setup"
              captures: { alloc_b_pro_id: "$.data[0].id" }
            - call: "GET /capital/cycles/${c1_id}"
              as: CapitalPlanner
              as_user_id: "planner-setup"
              captures: { c1_v2: $.data.version }
          trigger:
            - call: "POST /capital/cycles/${c1_id}/allocate"
              payload: { allocation_method: "RANK_ORDERED", expected_cycle_version: "${c1_v2}" }
              as: CapitalPlanner
              as_user_id: "planner-alloc"
          assert:
