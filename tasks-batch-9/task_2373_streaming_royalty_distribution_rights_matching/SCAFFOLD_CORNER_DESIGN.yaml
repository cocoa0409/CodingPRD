              captures: { d: "$.data.distributable_cents", hold: "$.data.holding_cents", resid: "$.data.rounding_residual_cents" }
            - call: "GET /royalties/usage-lines/${l1}"
              payload: {}
              as: RoyaltyAdmin
              captures: { a1: "$.data.attributed_revenue_cents" }
            - call: "POST /royalties/pools/${pl}/finalize"
              payload: {}
              as: RoyaltyAdmin
              captures: { pst: "$.data.status", rp: "$.data.residual_payee_holder_id" }
            - call: "GET /royalties/periods/${per}"
              payload: {}
              as: RoyaltyAdmin
              captures: { perst: "$.data.status", perhold: "$.data.total_holding_cents" }
            - call: "GET /royalties/usage-batches/${ub}"
