              as_user_id: "planner-1"
              captures: { ok_code: $.data.code }
          assert:
            - "${e1} == ERR_UNAUTHENTICATED with HTTP 401: an empty X-User-ID is treated as absent even though X-User-Role names a declared role"
            - "${e2} == ERR_UNAUTHENTICATED, NOT ERR_DEPARTMENT_NOT_FOUND: priority 1 outranks priority 5, so an anonymous caller cannot probe which ids exist"
            - "${e3} == ERR_UNAUTHENTICATED, NOT ERR_UNAUTHORIZED_ROLE: a CategoryBuyer is not on POST /otb/departments, but priority 1 outranks priority 2, so the 403 never surfaces"
            - "${ok_code} == WAPP: the identical first request with a non-empty X-User-ID succeeds, so the 401 is caused by the header and nothing else"
            - "every 401 body still carries the standard error envelope with response_type error and a populated error_id"

      - name: option_slots_run_out_at_the_floor_of_two
