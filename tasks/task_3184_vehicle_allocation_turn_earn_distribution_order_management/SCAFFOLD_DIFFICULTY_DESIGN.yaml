            - "after locking both children but leaving the appeal FILED, lock still rejected with ERR_APPEALS_OPEN"
            - "after appeal withdrawn and children LOCKED, lock succeeds"

      - name: shipment_pickup_gated_by_order_built_state
        grounds:
          - state_machines.Shipment
          - state_machines.VehicleOrder.ACCEPTED_to_SCHEDULED
        distinguishing_aspect: |
          Different entity pair than instance 1: Shipment creation and pickup
          depend on VehicleOrder state — POST /shipments requires the order to
          be BUILT (state precondition), and pickup requires current week >=
          pickup_week. Entity pair: Shipment x VehicleOrder.
        test_recipe:
          setup:
            - "Order ACCEPTED but not yet BUILT; carrier available"
          setup_api_calls:
            - call: "POST /wholesale/regions"
              payload: { code: "R11", name: "Region Eleven" }
              as: RegionalAllocator
              captures: { r11_id: $.data.id }
            - call: "POST /wholesale/dealers"
              payload: { region_id: "${r11_id}", dealer_code: "D-N", name: "Dealer N", opened_on: "2020-01-01T00:00:00Z" }
              as: RegionalAllocator
              captures: { d_n: $.data.id }
            - call: "POST /wholesale/model-lines"
              payload: { model_code: "L11", name: "Line Eleven" }
              as: RegionalAllocator
              captures: { l11_id: $.data.id }
            - call: "POST /wholesale/allocation-runs"
              payload: { period: "2026-09", model_line_id: "${l11_id}", base_units: 5, lookback_start: "2026-06-01T00:00:00Z", lookback_end: "2026-09-01T00:00:00Z", retail_priority_pct: 0 }
              as: RegionalAllocator
              captures: { run11_id: $.data.id }
            - call: "POST /wholesale/allocation-runs/${run11_id}/publish"
              payload: {}
              as: RegionalAllocator
            - call: "GET /wholesale/allocation-runs/${run11_id}/dealer-allocations"
              payload: { dealer_id: "${d_n}" }
              as: RegionalAllocator
              captures: { da_n_v: "$.data[0].version "}
            - call: "POST /wholesale/orders"
              payload: { dealer_id: "${d_n}", model_line_id: "${l11_id}", run_id: "${run11_id}", order_kind: "STOCK", expected_dealer_allocation_version: "${da_n_v}", configuration: { trim: "XLT", commodity_codes: [] } }
              as: Dealer
              as_user_id: "${d_n}"
              captures: { o_n1: $.data.id }
            - call: "POST /wholesale/carriers"
              payload: { code: "CAR11", name: "Carrier Eleven", weekly_capacity: 3 }
              as: LogisticsCoordinator
              captures: { car11: $.data.id }
          trigger:
            - call: "POST /wholesale/shipments"
              payload: { order_id: "${o_n1}", carrier_id: "${car11}", pickup_week: "2026-W36" }
              as: LogisticsCoordinator
              captures: { err5: $.data.error_id }
          assert:
            - "shipment create against an ACCEPTED (not BUILT) order rejected with ERR_INVALID_STATE, HTTP 409"
            - "after schedule + build, the same create succeeds and pickup before pickup_week is rejected ERR_WINDOW_CLOSED"

  # ===========================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: commodity_restriction_window_overlap_rejection
        grounds:
          - calculations.carrier_capacity
          - validations[priority=12]
          - errors[ERR_RESTRICTION_OVERLAP]
        distinguishing_aspect: |
          Interval semantics: half-open [effective_from, effective_to) windows
          on the (commodity, line) resource pair. A new restriction whose
          window overlaps the ACTIVE one's window — but does not start at or
          after the existing window's end — is rejected
          ERR_RESTRICTION_OVERLAP; adjacency (new from == old to, gap 0) is
          allowed because the interval is end-exclusive.
        test_recipe:
          setup:
            - "Commodity + line with ACTIVE restriction [2026-08-01, 2026-10-01)"
          setup_api_calls:
            - call: "POST /wholesale/commodities"
              payload: { code: "BEDLINER", name: "Bed Liner" }
              as: CommodityManager
              captures: { c_bed: $.data.id }
            - call: "POST /wholesale/model-lines"
              payload: { model_code: "L12", name: "Line Twelve" }
              as: RegionalAllocator
              captures: { l12_id: $.data.id }
            - call: "POST /wholesale/commodity-restrictions"
              payload: { commodity_id: "${c_bed}", model_line_id: "${l12_id}", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-10-01T00:00:00Z", install_rate_pct: 30, allow_partial_build: false }
              as: CommodityManager
              captures: { cr_bed1: $.data.id }
          trigger:
            - call: "POST /wholesale/commodity-restrictions"
              payload: { commodity_id: "${c_bed}", model_line_id: "${l12_id}", effective_from: "2026-09-01T00:00:00Z", effective_to: "2026-11-01T00:00:00Z", install_rate_pct: 40, allow_partial_build: false }
              as: CommodityManager
              captures: { err6: $.data.error_id }
            - call: "POST /wholesale/commodity-restrictions"
              payload: { commodity_id: "${c_bed}", model_line_id: "${l12_id}", effective_from: "2026-10-01T00:00:00Z", effective_to: "2026-12-01T00:00:00Z", install_rate_pct: 40, allow_partial_build: false }
              as: CommodityManager
              captures: { cr_bed2: $.data.id }
          assert:
            - "overlapping window [2026-09-01, 2026-11-01) rejected ERR_RESTRICTION_OVERLAP (HTTP 422)"
            - "adjacent window starting exactly at effective_to (gap 0) is ACCEPTED and SUPERSEDES the old one: cr_bed1.status == SUPERSEDED, cr_bed2.status == ACTIVE"

      - name: carrier_weekly_bucket_capacity_not_interval
        grounds:
          - calculations.carrier_capacity
          - errors[ERR_CARRIER_CAPACITY]
        distinguishing_aspect: |
          Different interval semantics than instance 1: carrier capacity is an
          AGGREGATE over a discrete ISO-week bucket (count of active shipments
          in the bucket vs weekly_capacity), not a pairwise [from, to) window
          overlap. Adjacent-week shipments never collide (bucket boundary is
          hard), while within-week overflow collides regardless of exact days.
        test_recipe:
          setup:
            - "Carrier capacity 1; two BUILT orders, one pickup W36 and one pickup W37 (adjacent weeks)"
          setup_api_calls:
            - call: "POST /wholesale/regions"
              payload: { code: "R13", name: "Region Thirteen" }
              as: RegionalAllocator
              captures: { r13_id: $.data.id }
            - call: "POST /wholesale/dealers"
              payload: { region_id: "${r13_id}", dealer_code: "D-O", name: "Dealer O", opened_on: "2020-01-01T00:00:00Z" }
              as: RegionalAllocator
              captures: { d_o: $.data.id }
            - call: "POST /wholesale/model-lines"
              payload: { model_code: "L13", name: "Line Thirteen" }
              as: RegionalAllocator
              captures: { l13_id: $.data.id }
            - call: "POST /wholesale/allocation-runs"
              payload: { period: "2026-09", model_line_id: "${l13_id}", base_units: 5, lookback_start: "2026-06-01T00:00:00Z", lookback_end: "2026-09-01T00:00:00Z", retail_priority_pct: 0 }
              as: RegionalAllocator
              captures: { run13_id: $.data.id }
            - call: "POST /wholesale/allocation-runs/${run13_id}/publish"
              payload: {}
              as: RegionalAllocator
            - call: "GET /wholesale/allocation-runs/${run13_id}/dealer-allocations"
              payload: { dealer_id: "${d_o}" }
              as: RegionalAllocator
              captures: { da_o_v: "$.data[0].version "}
            - call: "POST /wholesale/orders"
              payload: { dealer_id: "${d_o}", model_line_id: "${l13_id}", run_id: "${run13_id}", order_kind: "STOCK", expected_dealer_allocation_version: "${da_o_v}", configuration: { trim: "XLT", commodity_codes: [] } }
              as: Dealer
              as_user_id: "${d_o}"
              captures: { o_o1: $.data.id }
            - call: "GET /wholesale/allocation-runs/${run13_id}/dealer-allocations"
              payload: { dealer_id: "${d_o}" }
              as: RegionalAllocator
              captures: { da_o_v2: "$.data[0].version "}
            - call: "POST /wholesale/orders"
              payload: { dealer_id: "${d_o}", model_line_id: "${l13_id}", run_id: "${run13_id}", order_kind: "STOCK", expected_dealer_allocation_version: "${da_o_v2}", configuration: { trim: "XLT", commodity_codes: [] } }
              as: Dealer
              as_user_id: "${d_o}"
              captures: { o_o2: $.data.id }
            - call: "POST /wholesale/orders/${o_o1}/schedule"
              payload: { build_week: "2026-W36" }
              as: ProductionScheduler
            - call: "POST /wholesale/orders/${o_o1}/build"
              payload: {}
              as: ProductionScheduler
            - call: "POST /wholesale/orders/${o_o2}/schedule"
              payload: { build_week: "2026-W36" }
              as: ProductionScheduler
            - call: "POST /wholesale/orders/${o_o2}/build"
              payload: {}
              as: ProductionScheduler
            - call: "POST /wholesale/carriers"
              payload: { code: "CAR13", name: "Carrier Thirteen", weekly_capacity: 1 }
              as: LogisticsCoordinator
              captures: { car13: $.data.id }
            - call: "POST /wholesale/shipments"
              payload: { order_id: "${o_o1}", carrier_id: "${car13}", pickup_week: "2026-W36" }
              as: LogisticsCoordinator
              captures: { sh_o1: $.data.id }
          trigger:
            - call: "POST /wholesale/shipments"
              payload: { order_id: "${o_o2}", carrier_id: "${car13}", pickup_week: "2026-W37" }
              as: LogisticsCoordinator
              captures: { sh_o2: $.data.id }
          assert:
            - "W37 pickup succeeds despite W36 being at capacity: week buckets are discrete, adjacency across the boundary does not collide"
            - "a second W36 pickup would have been rejected ERR_CARRIER_CAPACITY"

  # ===========================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: accept_cancel_pool_conservation
        grounds:
          - state_machines.VehicleOrder.SUBMITTED_to_ACCEPTED
          - state_machines.VehicleOrder.ACCEPTED_to_CANCELLED
          - entities.DealerAllocation.fields.consumed_units
        distinguishing_aspect: |
          Conserved quantity: DealerAllocation.consumed_units == count of
          child orders in pool-holding states {ACCEPTED, SCHEDULED, BUILT,
          DELIVERED}. Forward action (accept) increments, compensating action
          (cancel from ACCEPTED) decrements; after accept+cancel the pool
          returns exactly to its prior value and consumed_units == 0.
        test_recipe:
          setup:
            - "Published run, dealer with final_units 5, zero consumed"
          setup_api_calls:
            - call: "POST /wholesale/regions"
              payload: { code: "R14", name: "Region Fourteen" }
              as: RegionalAllocator
              captures: { r14_id: $.data.id }
            - call: "POST /wholesale/dealers"
              payload: { region_id: "${r14_id}", dealer_code: "D-P", name: "Dealer P", opened_on: "2020-01-01T00:00:00Z" }
              as: RegionalAllocator
              captures: { d_p: $.data.id }
            - call: "POST /wholesale/model-lines"
              payload: { model_code: "L14", name: "Line Fourteen" }
              as: RegionalAllocator
              captures: { l14_id: $.data.id }
            - call: "POST /wholesale/allocation-runs"
              payload: { period: "2026-09", model_line_id: "${l14_id}", base_units: 5, lookback_start: "2026-06-01T00:00:00Z", lookback_end: "2026-09-01T00:00:00Z", retail_priority_pct: 0 }
              as: RegionalAllocator
              captures: { run14_id: $.data.id }
            - call: "POST /wholesale/allocation-runs/${run14_id}/publish"
              payload: {}
              as: RegionalAllocator
            - call: "GET /wholesale/allocation-runs/${run14_id}/dealer-allocations"
              payload: { dealer_id: "${d_p}" }
              as: RegionalAllocator
              captures: { da_p_v: "$.data[0].version "}
          trigger:
            - call: "POST /wholesale/orders"
              payload: { dealer_id: "${d_p}", model_line_id: "${l14_id}", run_id: "${run14_id}", order_kind: "STOCK", expected_dealer_allocation_version: "${da_p_v}", configuration: { trim: "XLT", commodity_codes: [] } }
              as: Dealer
              as_user_id: "${d_p}"
              captures: { o_p_c: $.data.id }
            - call: "POST /wholesale/orders/${o_p_c}/cancel"
              payload: { cancel_reason: "customer backed out" }
              as: Dealer
              as_user_id: "${d_p}"
            - call: "GET /wholesale/allocation-runs/${run14_id}/dealer-allocations"
              payload: { dealer_id: "${d_p}" }
              as: RegionalAllocator
              captures: { da_p_after: "$.data[0].consumed_units "}
          assert:
            - "after accept: consumed_units == 1; after cancel: consumed_units == 0 (invariant restored exactly)"
            - "remaining pool == final_units again (5 of 5 available)"

      - name: trade_execute_pairwise_pool_conservation
        grounds:
          - state_machines.DealerTrade.ACCEPTED_to_EXECUTED
          - calculations.trade_earn_penalty
        distinguishing_aspect: |
          Different conserved quantity than instance 1: the SUM of the two
          dealers' final_units across a trade is invariant (from -= units,
          to += units; total unchanged). Earned credit is NOT conserved — it
          decays by units * 0.5 — proving the invariant is about the pool
          pair, not the credit ledger.
        test_recipe:
          setup:
            - "Same-region dealers F and G with final_units Fa and Ga; executed trade of 2 units"
          setup_api_calls:
            - call: "POST /wholesale/regions"
              payload: { code: "R15", name: "Region Fifteen" }
              as: RegionalAllocator
              captures: { r15_id: $.data.id }
            - call: "POST /wholesale/dealers"
              payload: { region_id: "${r15_id}", dealer_code: "D-Q", name: "Dealer Q", opened_on: "2020-01-01T00:00:00Z" }
              as: RegionalAllocator
              captures: { d_q: $.data.id }
            - call: "POST /wholesale/dealers"
              payload: { region_id: "${r15_id}", dealer_code: "D-R", name: "Dealer R", opened_on: "2020-01-01T00:00:00Z" }
              as: RegionalAllocator
              captures: { d_r: $.data.id }
            - call: "POST /wholesale/model-lines"
              payload: { model_code: "L15", name: "Line Fifteen" }
              as: RegionalAllocator
              captures: { l15_id: $.data.id }
            - call: "POST /wholesale/allocation-runs"
              payload: { period: "2026-09", model_line_id: "${l15_id}", base_units: 10, lookback_start: "2026-06-01T00:00:00Z", lookback_end: "2026-09-01T00:00:00Z", retail_priority_pct: 0 }
              as: RegionalAllocator
              captures: { run15_id: $.data.id, run15_v: $.data.version }
            - call: "POST /wholesale/allocation-runs/${run15_id}/publish"
              payload: {}
              as: RegionalAllocator
            - call: "GET /wholesale/allocation-runs/${run15_id}/dealer-allocations"
              payload: { dealer_id: "${d_q}" }
              as: RegionalAllocator
              captures: { da_q_f: "$.data[0].final_units "}
            - call: "GET /wholesale/allocation-runs/${run15_id}/dealer-allocations"
              payload: { dealer_id: "${d_r}" }
              as: RegionalAllocator
              captures: { da_r_f: "$.data[0].final_units "}
            - call: "POST /wholesale/dealer-trades"
              payload: { from_dealer_id: "${d_q}", to_dealer_id: "${d_r}", run_id: "${run15_id}", units: 2 }
              as: Dealer
              as_user_id: "${d_q}"
              captures: { tr_qr: $.data.id }
            - call: "POST /wholesale/dealer-trades/${tr_qr}/accept"
              payload: {}
              as: Dealer
              as_user_id: "${d_r}"
            - call: "GET /wholesale/allocation-runs/${run15_id}"
              payload: {}
              as: RegionalAllocator
              captures: { run15_v2: $.data.version }
          trigger:
            - call: "POST /wholesale/dealer-trades/${tr_qr}/execute"
              payload: { expected_run_version: "${run15_v2}" }
              as: RegionalAllocator
            - call: "GET /wholesale/allocation-runs/${run15_id}/dealer-allocations"
              payload: { dealer_id: "${d_q}" }
              as: RegionalAllocator
              captures: { da_q_f2: "$.data[0].final_units "}
            - call: "GET /wholesale/allocation-runs/${run15_id}/dealer-allocations"
              payload: { dealer_id: "${d_r}" }
              as: RegionalAllocator
              captures: { da_r_f2: "$.data[0].final_units "}
          assert:
            - "da_q_f2 == da_q_f - 2 AND da_r_f2 == da_r_f + 2 (pairwise sum conserved)"
            - "DealerModelLine(d_q, l15).earned_credit_units decreased by 1.0 (2 * 0.5) — credit NOT conserved, only the pool pair is"
