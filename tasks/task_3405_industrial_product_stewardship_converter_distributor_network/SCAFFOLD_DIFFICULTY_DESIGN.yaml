              captures: { followup_err: $.data.error_id }
          assert:
            - "CounterfeitReport.${rep3_id}.status == CONFIRMED_COUNTERFEIT"
            - "link 1: Converter.${conv_id}.status == SUSPENDED"
            - "link 2: Order.${oc_id}.compliance_status == FLAGGED and flagged_by_report_id == ${rep3_id} (fulfillment stays ALLOCATED)"
            - "post-cascade: follow-on converter order rejected 409 ERR_CONVERTER_NOT_AUTHORIZED (actual ${followup_err})"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: terminal_case_retest_beats_bench_capacity
        grounds:
          - validations[priority=8]
          - validations[priority=27]
          - errors.ERR_INVALID_STATE
          - errors.ERR_BENCH_CAPACITY_EXCEEDED
        distinguishing_aspect: |
          Category pair state(p8) vs business_fiscal(p27): the same book-lab call
          targets a terminal CLOSED_PASS case AND a bench/date already at 8.0
          hours; the state error ERR_INVALID_STATE must win because priority 8
          evaluates before priority 27.
        test_recipe:
          setup:
            - "Clock at 2026-10-01. Formulation ACTIVE. Case A LAB_BOOKED with 8.0h on bench B5/2026-11-02 (bench full). Case B already CLOSED_PASS."
          setup_api_calls:
            - *c_clock
            - *c_jur_de
            - *c_form100
            - *c_clear_exempt
            - *c_decide_clear
            - call: "POST /stewardship/application-cases"
              payload: { formulation_id: "${f_id}", customer_ref: "K-A", substrate_class: "METAL" }
              as: TechnicalEngineer
              as_user_id: "te-1"
              captures: { ca_id: $.data.id }
            - call: "POST /stewardship/application-cases"
              payload: { formulation_id: "${f_id}", customer_ref: "K-B", substrate_class: "GLASS" }
              as: TechnicalEngineer
              as_user_id: "te-1"
              captures: { cb_id: $.data.id }
            - call: "POST /stewardship/application-cases/${cb_id}/book-lab"
              payload: { bench_id: "B6", bench_date: "2026-11-02T00:00:00Z", bench_hours: 1.0 }
              as: TechnicalEngineer
              as_user_id: "te-1"
            - call: "POST /stewardship/application-cases/${cb_id}/record-result"
              payload: { peel_strength_n_per_25mm: 11.0, test_temp_c: 23, test_standard: "NOMINAL" }
              as: TechnicalEngineer
              as_user_id: "te-1"
            - call: "POST /stewardship/application-cases/${ca_id}/book-lab"
              payload: { bench_id: "B5", bench_date: "2026-11-02T00:00:00Z", bench_hours: 8.0 }
              as: TechnicalEngineer
              as_user_id: "te-1"
          trigger:
            - call: "POST /stewardship/application-cases/${cb_id}/book-lab"
              payload: { bench_id: "B5", bench_date: "2026-11-02T00:00:00Z", bench_hours: 1.0 }
              as: TechnicalEngineer
              as_user_id: "te-1"
              captures: { conflict_err: $.data.error_id }
          assert:
            - "ApplicationCase.${cb_id}.status == CLOSED_PASS (terminal) before trigger"
            - "bench B5/2026-11-02 occupied == 8.0 (case A LAB_BOOKED), so capacity also fails"
            - "trigger returns 409 with error_id == ERR_INVALID_STATE (actual ${conflict_err}), NOT ERR_BENCH_CAPACITY_EXCEEDED"
            - "ApplicationCase.${ca_id}.status == LAB_BOOKED unchanged"

      - name: missing_clearance_beats_closed_ltb_window
        grounds:
          - validations[priority=11]
          - validations[priority=14]
          - errors.ERR_CLEARANCE_NOT_CLEARED
          - errors.ERR_LTB_WINDOW_CLOSED
        distinguishing_aspect: |
          Category pair business_safety(p11) vs business_temporal(p14): one order
          create hits a jurisdiction with no CLEARED clearance AND a clock past
          the discontinued formulation's ltb_deadline; ERR_CLEARANCE_NOT_CLEARED
          must win because safety evaluates before temporal.
        test_recipe:
          setup:
            - "Clock initially 2026-10-01. Formulation ACTIVE via DE clearance only, then DISCONTINUED with ltb_deadline 2027-01-15."
            - "Distributor agreement in jurisdiction US (no clearance exists for (formulation, US)), window [2026-10-01, 2027-06-01)."
            - "Clock advanced to 2027-01-16, one day past the LTB deadline."
          setup_api_calls:
            - *c_clock
            - *c_jur_de
            - *c_form100
            - *c_clear_exempt
            - *c_decide_clear
            - *c_dist1
            - call: "POST /stewardship/jurisdictions"
              payload: { code: "US", name: "United States", declaration_threshold_ppm: 500, full_disclosure_threshold_ppm: 5000 }
              as: PlatformAdmin
              captures: { jur_us: $.data.id }
            - call: "POST /stewardship/formulations/${f_id}/discontinue"
              payload: { last_time_buy_deadline: "2027-01-15T00:00:00Z", last_ship_date: "2027-03-01T00:00:00Z", ltb_pool_quantity: 100 }
              as: ProductManager
            - call: "POST /stewardship/price-agreements"
              payload: { formulation_id: "${f_id}", jurisdiction_id: "${jur_us}", distributor_id: "${dist_id}", tier: "STANDARD", base_price_cents: 5000, effective_from: "2026-10-01T00:00:00Z", effective_to: "2027-06-01T00:00:00Z" }
              as: ChannelManager
              as_user_id: "cm-1"
              captures: { agus_id: $.data.id, agus_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-16T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /stewardship/orders"
              payload: { agreement_id: "${agus_id}", distributor_id: "${dist_id}", quantity: 5, requested_ship_date: "2027-02-01T00:00:00Z", expected_price_agreement_version: "${agus_v}" }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { prio_err: $.data.error_id }
          assert:
            - "both violations hold: no CLEARED clearance for (F-100, US) AND clock 2027-01-16 > ltb_deadline 2027-01-15"
            - "response is 409 with error_id == ERR_CLEARANCE_NOT_CLEARED (actual ${prio_err}), NOT ERR_LTB_WINDOW_CLOSED"

  - rule_id: boundary_precision_check
    instances:
      - name: ltb_deadline_inclusive_at_exact_deadline
        grounds:
          - validations[priority=14]
          - entities.Formulation.fields.ltb_deadline
          - calculations.ltb_pool_tracking
        distinguishing_aspect: |
          Datetime boundary on POST /orders: an LTB order placed with the clock
          exactly equal to ltb_deadline (2027-01-15T00:00:00Z) is accepted
          (inclusive <=), while the identical order one second later is rejected
          ERR_LTB_WINDOW_CLOSED — a <= vs < precision probe on the deadline metric.
        test_recipe:
          setup:
            - "Clock 2026-10-01. Formulation ACTIVE (DE clearance); distributor STANDARD agreement window [2026-10-01, 2027-06-01)."
            - "Formulation DISCONTINUED with ltb_deadline 2027-01-15T00:00:00Z, last_ship_date 2027-03-01, pool 1000."
          setup_api_calls:
            - *c_clock
            - *c_jur_de
            - *c_form100
            - *c_clear_exempt
            - *c_decide_clear
            - *c_dist1
            - *c_ag_dist_std
            - call: "POST /stewardship/formulations/${f_id}/discontinue"
              payload: { last_time_buy_deadline: "2027-01-15T00:00:00Z", last_ship_date: "2027-03-01T00:00:00Z", ltb_pool_quantity: 1000 }
              as: ProductManager
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-15T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /stewardship/orders"
              payload: { agreement_id: "${ag_id}", distributor_id: "${dist_id}", quantity: 10, requested_ship_date: "2027-02-01T00:00:00Z", expected_price_agreement_version: "${ag_v}" }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { o_ltb: $.data.id }
            - call: "GET /stewardship/price-agreements/${ag_id}"
              payload: {}
              as: ChannelManager
              as_user_id: "cm-1"
              captures: { ag_v_after: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-15T00:00:01Z" }
              as: PlatformAdmin
            - call: "POST /stewardship/orders"
              payload: { agreement_id: "${ag_id}", distributor_id: "${dist_id}", quantity: 10, requested_ship_date: "2027-02-01T00:00:00Z", expected_price_agreement_version: "${ag_v_after}" }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { ltb_err: $.data.error_id }
          assert:
            - "at clock == ltb_deadline exactly: order ${o_ltb} created 201 with is_ltb_order == true and fulfillment_status == PENDING"
            - "at clock == ltb_deadline + 1s: 409 error_id == ERR_LTB_WINDOW_CLOSED (actual ${ltb_err})"

      - name: bench_capacity_admits_exactly_eight_hours
        grounds:
          - calculations.bench_daily_capacity
          - validations[priority=27]
          - errors.ERR_BENCH_CAPACITY_EXCEEDED
        distinguishing_aspect: |
          Hours boundary on POST book-lab (a different metric and endpoint than
          the LTB deadline): bookings of 3.5h then 4.5h on one bench/day total
          exactly 8.0 and are both admitted (inclusive <=), while a further 0.5h
          tips the sum to 8.5 and is rejected.
        test_recipe:
          setup:
            - "Clock 2026-10-01. Formulation ACTIVE. Three METAL application cases A, B, C."
          setup_api_calls:
            - *c_clock
            - *c_jur_de
            - *c_form100
            - *c_clear_exempt
            - *c_decide_clear
            - call: "POST /stewardship/application-cases"
              payload: { formulation_id: "${f_id}", customer_ref: "K-A", substrate_class: "METAL" }
              as: TechnicalEngineer
              as_user_id: "te-1"
              captures: { ba_id: $.data.id }
            - call: "POST /stewardship/application-cases"
              payload: { formulation_id: "${f_id}", customer_ref: "K-B", substrate_class: "METAL" }
              as: TechnicalEngineer
              as_user_id: "te-1"
              captures: { bb_id: $.data.id }
            - call: "POST /stewardship/application-cases"
              payload: { formulation_id: "${f_id}", customer_ref: "K-C", substrate_class: "METAL" }
              as: TechnicalEngineer
              as_user_id: "te-1"
              captures: { bc_id: $.data.id }
          trigger:
            - call: "POST /stewardship/application-cases/${ba_id}/book-lab"
              payload: { bench_id: "B9", bench_date: "2026-11-02T00:00:00Z", bench_hours: 3.5 }
              as: TechnicalEngineer
              as_user_id: "te-1"
            - call: "POST /stewardship/application-cases/${bb_id}/book-lab"
              payload: { bench_id: "B9", bench_date: "2026-11-02T00:00:00Z", bench_hours: 4.5 }
              as: TechnicalEngineer
              as_user_id: "te-1"
            - call: "POST /stewardship/application-cases/${bc_id}/book-lab"
              payload: { bench_id: "B9", bench_date: "2026-11-02T00:00:00Z", bench_hours: 0.5 }
              as: TechnicalEngineer
              as_user_id: "te-1"
              captures: { cap_err: $.data.error_id }
          assert:
            - "ApplicationCase.${ba_id}.status == LAB_BOOKED (3.5h)"
            - "ApplicationCase.${bb_id}.status == LAB_BOOKED (cumulative exactly 8.0 admitted)"
            - "third booking: 409 error_id == ERR_BENCH_CAPACITY_EXCEEDED (actual ${cap_err}); ApplicationCase.${bc_id}.status stays OPEN"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: order_create_gated_by_clearance_state
        grounds:
          - validations[priority=11]
          - state_machines.JurisdictionClearance
          - entities.Order.fields.fulfillment_status
        distinguishing_aspect: |
          Entity pair Order x JurisdictionClearance: order creation reads the
          clearance state machine — CHANGES_REQUESTED blocks with
          ERR_CLEARANCE_NOT_CLEARED, and after the clearance is resubmitted and
          CLEARED the identical order payload succeeds; the failed attempt does
          not bump the agreement's OCC version.
        test_recipe:
          setup:
            - "Clock 2026-10-01. Formulation with CLEARED-then-CHANGES_REQUESTED clearance in DE (currently CHANGES_REQUESTED, formulation still DRAFT)."
            - "Distributor STANDARD agreement in DE, window covers clock."
          setup_api_calls:
            - *c_clock
            - *c_jur_de
            - *c_form100
            - *c_clear_exempt
            - call: "POST /stewardship/clearances/${cl_id}/decision"
              payload: { decision: "CHANGES_REQUESTED" }
              as: RegulatoryManager
              as_user_id: "rm-1"
            - *c_dist1
            - *c_ag_dist_std
          trigger:
            - call: "POST /stewardship/orders"
              payload: { agreement_id: "${ag_id}", distributor_id: "${dist_id}", quantity: 10, requested_ship_date: "2026-11-01T00:00:00Z", expected_price_agreement_version: "${ag_v}" }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { gate_err: $.data.error_id }
            - call: "POST /stewardship/clearances"
              payload: { formulation_id: "${f_id}", jurisdiction_id: "${jur_de}", disclosure_package_level: "EXEMPT" }
              as: ProductManager
            - call: "POST /stewardship/clearances/${cl_id}/decision"
              payload: { decision: "CLEARED" }
              as: RegulatoryManager
              as_user_id: "rm-1"
            - call: "POST /stewardship/orders"
              payload: { agreement_id: "${ag_id}", distributor_id: "${dist_id}", quantity: 10, requested_ship_date: "2026-11-01T00:00:00Z", expected_price_agreement_version: "${ag_v}" }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { o_gated: $.data.id }
          assert:
            - "first attempt: 409 error_id == ERR_CLEARANCE_NOT_CLEARED (actual ${gate_err}) while clearance CHANGES_REQUESTED"
            - "failed create did not bump PriceAgreement.${ag_id}.version: retry with the original expected version succeeds"
            - "retry after CLEARED: 201, Order.${o_gated}.fulfillment_status == PENDING and Formulation.${f_id}.status == ACTIVE"

      - name: authorization_create_gated_by_converter_state
        grounds:
          - validations[priority=18]
          - state_machines.Converter
          - errors.ERR_CONVERTER_NOT_AUTHORIZED
        distinguishing_aspect: |
          Entity pair ConverterAuthorization x Converter (different pair than
          Order x Clearance): granting an authorization to an APPLIED converter
          fails ERR_CONVERTER_NOT_AUTHORIZED; after record-audit + authorize move
          the converter to AUTHORIZED, the same grant succeeds with a fresh OCC
          version.
        test_recipe:
          setup:
            - "Clock 2026-10-01. Converter onboarded but still APPLIED (no audit recorded)."
          setup_api_calls:
            - *c_clock
            - *c_conv_applied
            - call: "GET /stewardship/converters/${conv_id}"
              payload: {}
              as: ChannelManager
              as_user_id: "cm-1"
              captures: { conv_v1: $.data.version }
          trigger:
            - call: "POST /stewardship/converter-authorizations"
              payload: { converter_id: "${conv_id}", capability: "SLITTING", territory_code: "DE", valid_from: "2026-10-01T00:00:00Z", valid_to: "2027-04-01T00:00:00Z", expected_converter_version: "${conv_v1}" }
              as: ChannelManager
              as_user_id: "cm-1"
              captures: { conv_gate_err: $.data.error_id }
            - call: "POST /stewardship/converters/${conv_id}/record-audit"
              payload: { audit_score: 80, audit_standard: "ISO9001" }
              as: QualityAuditor
              as_user_id: "qa-1"
            - call: "POST /stewardship/converters/${conv_id}/authorize"
              payload: {}
              as: ChannelManager
              as_user_id: "cm-1"
              captures: { conv_v3: $.data.version }
            - call: "POST /stewardship/converter-authorizations"
              payload: { converter_id: "${conv_id}", capability: "SLITTING", territory_code: "DE", valid_from: "2026-10-01T00:00:00Z", valid_to: "2027-04-01T00:00:00Z", expected_converter_version: "${conv_v3}" }
              as: ChannelManager
              as_user_id: "cm-1"
              captures: { authz_id: $.data.id }
          assert:
            - "while APPLIED: 409 error_id == ERR_CONVERTER_NOT_AUTHORIZED (actual ${conv_gate_err})"
            - "after audit(80) + authorize: Converter.${conv_id}.status == AUTHORIZED"
            - "retry: 201, ConverterAuthorization.${authz_id} created with capability SLITTING territory DE"

  - rule_id: resource_temporal_overlap
    instances:
      - name: authorization_windows_half_open_adjacency_allowed
        grounds:
          - validations[priority=15]
          - entities.ConverterAuthorization.fields.valid_from
          - entities.ConverterAuthorization.fields.valid_to
          - errors.ERR_AUTHORIZATION_WINDOW_OVERLAP
        distinguishing_aspect: |
          Interval semantics: half-open [valid_from, valid_to) on the
          (converter, capability, territory) resource — a window starting exactly
          at the previous window's valid_to is adjacent and ALLOWED, a window
          starting one day earlier OVERLAPS and is rejected, and a window
          overlapping in time but for a different capability is allowed.
        test_recipe:
          setup:
            - "Clock 2026-10-01. Converter AUTHORIZED (version captured)."
          setup_api_calls:
            - *c_clock
            - *c_conv_applied
            - *c_conv_audit
            - *c_conv_authorize
          trigger:
            - call: "POST /stewardship/converter-authorizations"
              payload: { converter_id: "${conv_id}", capability: "SLITTING", territory_code: "DE", valid_from: "2026-10-01T00:00:00Z", valid_to: "2027-04-01T00:00:00Z", expected_converter_version: "${conv_v}" }
              as: ChannelManager
              as_user_id: "cm-1"
              captures: { az1: $.data.id }
            - call: "GET /stewardship/converters/${conv_id}"
              payload: {}
              as: ChannelManager
              as_user_id: "cm-1"
              captures: { conv_v4: $.data.version }
            - call: "POST /stewardship/converter-authorizations"
              payload: { converter_id: "${conv_id}", capability: "SLITTING", territory_code: "DE", valid_from: "2027-04-01T00:00:00Z", valid_to: "2027-10-01T00:00:00Z", expected_converter_version: "${conv_v4}" }
              as: ChannelManager
              as_user_id: "cm-1"
              captures: { az2: $.data.id }
            - call: "GET /stewardship/converters/${conv_id}"
              payload: {}
              as: ChannelManager
              as_user_id: "cm-1"
              captures: { conv_v5: $.data.version }
            - call: "POST /stewardship/converter-authorizations"
              payload: { converter_id: "${conv_id}", capability: "SLITTING", territory_code: "DE", valid_from: "2027-03-31T00:00:00Z", valid_to: "2027-05-01T00:00:00Z", expected_converter_version: "${conv_v5}" }
              as: ChannelManager
              as_user_id: "cm-1"
              captures: { ovl_err: $.data.error_id }
            - call: "POST /stewardship/converter-authorizations"
              payload: { converter_id: "${conv_id}", capability: "DIE_CUTTING", territory_code: "DE", valid_from: "2026-11-01T00:00:00Z", valid_to: "2027-02-01T00:00:00Z", expected_converter_version: "${conv_v5}" }
              as: ChannelManager
              as_user_id: "cm-1"
              captures: { az4: $.data.id }
          assert:
            - "az1 created 201 ([2026-10-01, 2027-04-01))"
            - "az2 created 201: starts exactly at az1.valid_to — adjacency is not overlap under half-open semantics"
            - "az3 rejected 409 ERR_AUTHORIZATION_WINDOW_OVERLAP (actual ${ovl_err}): [2027-03-31, 2027-05-01) intersects az1"
            - "az4 created 201: time-overlapping but different capability (DIE_CUTTING), not the same resource key"

      - name: bench_day_capacity_is_aggregate_not_interval
        grounds:
          - calculations.bench_daily_capacity
          - validations[priority=27]
        distinguishing_aspect: |
          Different interval semantics on a different resource: lab bookings
          carry no time-of-day interval at all — the bench/day resource is gated
          purely by the AGGREGATE of bench_hours (<= 8.0), partitioned by
          (bench_id, bench_date); identical hours on a different date never
          interact, and there is no notion of adjacency to allow.
        test_recipe:
          setup:
            - "Clock 2026-10-01. Formulation ACTIVE. Four cases A, B, C, D."
          setup_api_calls:
            - *c_clock
            - *c_jur_de
            - *c_form100
            - *c_clear_exempt
            - *c_decide_clear
            - call: "POST /stewardship/application-cases"
              payload: { formulation_id: "${f_id}", customer_ref: "K-A", substrate_class: "METAL" }
              as: TechnicalEngineer
              as_user_id: "te-1"
              captures: { pa_id: $.data.id }
            - call: "POST /stewardship/application-cases"
              payload: { formulation_id: "${f_id}", customer_ref: "K-B", substrate_class: "METAL" }
              as: TechnicalEngineer
              as_user_id: "te-1"
              captures: { pb_id: $.data.id }
            - call: "POST /stewardship/application-cases"
              payload: { formulation_id: "${f_id}", customer_ref: "K-C", substrate_class: "METAL" }
              as: TechnicalEngineer
              as_user_id: "te-1"
              captures: { pc_id: $.data.id }
            - call: "POST /stewardship/application-cases"
              payload: { formulation_id: "${f_id}", customer_ref: "K-D", substrate_class: "METAL" }
              as: TechnicalEngineer
              as_user_id: "te-1"
              captures: { pd_id: $.data.id }
          trigger:
            - call: "POST /stewardship/application-cases/${pa_id}/book-lab"
              payload: { bench_id: "B3", bench_date: "2026-12-01T00:00:00Z", bench_hours: 4.0 }
              as: TechnicalEngineer
              as_user_id: "te-1"
            - call: "POST /stewardship/application-cases/${pb_id}/book-lab"
              payload: { bench_id: "B3", bench_date: "2026-12-02T00:00:00Z", bench_hours: 4.0 }
              as: TechnicalEngineer
              as_user_id: "te-1"
            - call: "POST /stewardship/application-cases/${pc_id}/book-lab"
              payload: { bench_id: "B3", bench_date: "2026-12-01T00:00:00Z", bench_hours: 4.0 }
              as: TechnicalEngineer
              as_user_id: "te-1"
            - call: "POST /stewardship/application-cases/${pd_id}/book-lab"
              payload: { bench_id: "B3", bench_date: "2026-12-01T00:00:00Z", bench_hours: 0.5 }
              as: TechnicalEngineer
              as_user_id: "te-1"
              captures: { agg_err: $.data.error_id }
          assert:
            - "A on B3/2026-12-01 4.0h: LAB_BOOKED"
            - "B on B3/2026-12-02 4.0h: LAB_BOOKED — different bench_date, zero interaction with A despite identical hours"
            - "C on B3/2026-12-01 4.0h: LAB_BOOKED — aggregate reaches exactly 8.0 on that (bench, date)"
            - "D on B3/2026-12-01 0.5h: 409 ERR_BENCH_CAPACITY_EXCEEDED (actual ${agg_err}) — aggregate semantics, no interval adjacency exists to negotiate"

  - rule_id: compensating_invariant
    instances:
      - name: ltb_pool_allocate_cancel_conserves_units
        grounds:
          - calculations.ltb_pool_tracking
          - entities.Formulation.fields.ltb_pool_remaining
          - state_machines.Order
        distinguishing_aspect: |
          Conserved quantity: LTB pool units. The forward action (allocate
          reserves units) and its compensation (cancel of an ALLOCATED order
          releases the same units) keep ltb_pool_remaining == ltb_pool_quantity
          - sum(ALLOCATED/SHIPPED quantities) at every probe point, including
          after an over-pool rejection.
        test_recipe:
          setup:
            - "Clock 2026-10-01. Formulation ACTIVE then DISCONTINUED with pool 1000, deadline 2027-01-15, last_ship 2027-03-01. Distributor agreement window covers December."
            - "Four LTB orders: O1 qty 400, O2 qty 600, O3 qty 401, O4 qty 400."
          setup_api_calls:
            - *c_clock
            - *c_jur_de
            - *c_form100
            - *c_clear_exempt
            - *c_decide_clear
            - *c_dist1
            - call: "POST /stewardship/price-agreements"
              payload: { formulation_id: "${f_id}", jurisdiction_id: "${jur_de}", distributor_id: "${dist_id}", tier: "STANDARD", base_price_cents: 10000, effective_from: "2026-10-01T00:00:00Z", effective_to: "2027-06-01T00:00:00Z" }
              as: ChannelManager
              as_user_id: "cm-1"
              captures: { ag9_id: $.data.id, ag9_v: $.data.version }
            - call: "POST /stewardship/formulations/${f_id}/discontinue"
              payload: { last_time_buy_deadline: "2027-01-15T00:00:00Z", last_ship_date: "2027-03-01T00:00:00Z", ltb_pool_quantity: 1000 }
              as: ProductManager
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-12-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stewardship/orders"
              payload: { agreement_id: "${ag9_id}", distributor_id: "${dist_id}", quantity: 400, requested_ship_date: "2027-02-01T00:00:00Z", expected_price_agreement_version: "${ag9_v}" }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { p1: $.data.id }
            - call: "GET /stewardship/price-agreements/${ag9_id}"
              payload: {}
              as: ChannelManager
              as_user_id: "cm-1"
              captures: { ag9_v2: $.data.version }
            - call: "POST /stewardship/orders"
              payload: { agreement_id: "${ag9_id}", distributor_id: "${dist_id}", quantity: 600, requested_ship_date: "2027-02-01T00:00:00Z", expected_price_agreement_version: "${ag9_v2}" }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { p2: $.data.id }
            - call: "GET /stewardship/price-agreements/${ag9_id}"
              payload: {}
              as: ChannelManager
              as_user_id: "cm-1"
              captures: { ag9_v3: $.data.version }
            - call: "POST /stewardship/orders"
              payload: { agreement_id: "${ag9_id}", distributor_id: "${dist_id}", quantity: 401, requested_ship_date: "2027-02-01T00:00:00Z", expected_price_agreement_version: "${ag9_v3}" }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { p3: $.data.id }
            - call: "GET /stewardship/price-agreements/${ag9_id}"
              payload: {}
              as: ChannelManager
              as_user_id: "cm-1"
              captures: { ag9_v4: $.data.version }
            - call: "POST /stewardship/orders"
              payload: { agreement_id: "${ag9_id}", distributor_id: "${dist_id}", quantity: 400, requested_ship_date: "2027-02-01T00:00:00Z", expected_price_agreement_version: "${ag9_v4}" }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { p4: $.data.id }
          trigger:
            - call: "POST /stewardship/orders/${p1}/advance"
              payload: {}
              as: Distributor
              as_user_id: "${dist_id}"
            - call: "POST /stewardship/orders/${p2}/advance"
              payload: {}
              as: Distributor
              as_user_id: "${dist_id}"
            - call: "GET /stewardship/formulations/${f_id}"
              payload: {}
              as: ProductManager
              captures: { pool_after_2: $.data.ltb_pool_remaining }
            - call: "POST /stewardship/orders/${p3}/advance"
              payload: {}
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { pool_err: $.data.error_id }
            - call: "POST /stewardship/orders/${p1}/cancel"
              payload: {}
              as: Distributor
              as_user_id: "${dist_id}"
            - call: "GET /stewardship/formulations/${f_id}"
              payload: {}
              as: ProductManager
              captures: { pool_after_cancel: $.data.ltb_pool_remaining }
            - call: "POST /stewardship/orders/${p4}/advance"
              payload: {}
              as: Distributor
              as_user_id: "${dist_id}"
            - call: "GET /stewardship/formulations/${f_id}"
              payload: {}
              as: ProductManager
              captures: { pool_final: $.data.ltb_pool_remaining }
          assert:
            - "after O1,O2 allocate: ltb_pool_remaining == 0 (actual ${pool_after_2}) == 1000 - (400+600)"
            - "O3 qty 401 allocate rejected 409 ERR_LTB_POOL_EXHAUSTED (actual ${pool_err}); O3 stays PENDING"
            - "after O1 cancel (compensation): ltb_pool_remaining == 400 (actual ${pool_after_cancel}) == 1000 - 600"
            - "after O4 allocate: ltb_pool_remaining == 0 (actual ${pool_final}) == 1000 - (600+400); invariant held at every probe"

      - name: bench_book_result_pair_conserves_daily_hours
        grounds:
          - calculations.bench_daily_capacity
          - state_machines.ApplicationCase
          - errors.ERR_BENCH_CAPACITY_EXCEEDED
        distinguishing_aspect: |
          Conserved quantity: bench-hours per (bench, date) — a different
          quantity type than LTB units. A book-lab (reserve) followed by its
          record-result (release) returns occupied hours to the pre-pair level,
          proven by probe bookings that fail before the release and succeed
          after.
        test_recipe:
          setup:
            - "Clock 2026-10-01. Formulation ACTIVE. Cases A, B, C, D, E on bench B7 date 2026-12-03."
          setup_api_calls:
            - *c_clock
            - *c_jur_de
            - *c_form100
            - *c_clear_exempt
            - *c_decide_clear
            - call: "POST /stewardship/application-cases"
              payload: { formulation_id: "${f_id}", customer_ref: "K-A", substrate_class: "METAL" }
              as: TechnicalEngineer
              as_user_id: "te-1"
              captures: { qa_id: $.data.id }
            - call: "POST /stewardship/application-cases"
              payload: { formulation_id: "${f_id}", customer_ref: "K-B", substrate_class: "METAL" }
              as: TechnicalEngineer
              as_user_id: "te-1"
              captures: { qb_id: $.data.id }
            - call: "POST /stewardship/application-cases"
              payload: { formulation_id: "${f_id}", customer_ref: "K-C", substrate_class: "METAL" }
              as: TechnicalEngineer
              as_user_id: "te-1"
              captures: { qc_id: $.data.id }
            - call: "POST /stewardship/application-cases"
              payload: { formulation_id: "${f_id}", customer_ref: "K-D", substrate_class: "METAL" }
              as: TechnicalEngineer
              as_user_id: "te-1"
              captures: { qd_id: $.data.id }
            - call: "POST /stewardship/application-cases"
              payload: { formulation_id: "${f_id}", customer_ref: "K-E", substrate_class: "METAL" }
              as: TechnicalEngineer
              as_user_id: "te-1"
              captures: { qe_id: $.data.id }
            - call: "POST /stewardship/application-cases/${qa_id}/book-lab"
              payload: { bench_id: "B7", bench_date: "2026-12-03T00:00:00Z", bench_hours: 5.0 }
              as: TechnicalEngineer
              as_user_id: "te-1"
            - call: "POST /stewardship/application-cases/${qb_id}/book-lab"
              payload: { bench_id: "B7", bench_date: "2026-12-03T00:00:00Z", bench_hours: 3.0 }
              as: TechnicalEngineer
              as_user_id: "te-1"
          trigger:
            - call: "POST /stewardship/application-cases/${qc_id}/book-lab"
              payload: { bench_id: "B7", bench_date: "2026-12-03T00:00:00Z", bench_hours: 1.0 }
              as: TechnicalEngineer
              as_user_id: "te-1"
              captures: { pre_err: $.data.error_id }
            - call: "POST /stewardship/application-cases/${qa_id}/record-result"
              payload: { peel_strength_n_per_25mm: 16.0, test_temp_c: 23, test_standard: "NOMINAL" }
              as: TechnicalEngineer
              as_user_id: "te-1"
            - call: "POST /stewardship/application-cases/${qc_id}/book-lab"
              payload: { bench_id: "B7", bench_date: "2026-12-03T00:00:00Z", bench_hours: 1.0 }
              as: TechnicalEngineer
              as_user_id: "te-1"
            - call: "POST /stewardship/application-cases/${qd_id}/book-lab"
              payload: { bench_id: "B7", bench_date: "2026-12-03T00:00:00Z", bench_hours: 4.0 }
              as: TechnicalEngineer
              as_user_id: "te-1"
            - call: "POST /stewardship/application-cases/${qe_id}/book-lab"
              payload: { bench_id: "B7", bench_date: "2026-12-03T00:00:00Z", bench_hours: 0.5 }
              as: TechnicalEngineer
              as_user_id: "te-1"
              captures: { post_err: $.data.error_id }
          assert:
            - "with A(5.0)+B(3.0) booked, C(1.0) rejected 409 ERR_BENCH_CAPACITY_EXCEEDED (actual ${pre_err})"
            - "A record-result (pass at 16.0 >= 15.0) closes A CLOSED_PASS and releases its 5.0h"
            - "C retry 200 -> LAB_BOOKED: occupied now 3.0+1.0 = 4.0 (book+result pair conserved hours)"
            - "D(4.0) admitted (total exactly 8.0); E(0.5) rejected 409 ERR_BENCH_CAPACITY_EXCEEDED (actual ${post_err})"
