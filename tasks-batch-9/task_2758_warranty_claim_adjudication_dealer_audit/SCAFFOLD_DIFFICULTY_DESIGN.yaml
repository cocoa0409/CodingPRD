# §1.8 Scaffold Difficulty Design (Test Targeting Index) for
# task_2758_warranty_claim_adjudication_dealer_audit.
#
# Nine rule_id blocks, 22 instances total. Every instance grounds only in elements already
# declared in SCAFFOLD.yaml §1.1-§1.7; deleting this file leaves the declared behavior identical.
#
# Fixture conventions used throughout:
#   * The logical clock is set explicitly as the first call of every chain. Unset it reads
#     2026-08-01T00:00:00Z (SCAFFOLD.yaml's mandated startup default).
#   * Opaque operator ids: wa-user-1 (WarrantyAdmin), adj-user-1 / adj-user-2 (ClaimAdjudicator),
#     mgr-user-1 (AdjudicationManager), auditor-lead-1 (FieldAuditor), aum-user-1 (AuditManager),
#     appeal-rev-1 (AppealReviewer). DealerWarrantyAdmin is entity_backed:Dealer, so its
#     as_user_id is always the captured Dealer id.
#   * Narratives are always >= 20 characters so the NARRATIVE_THIN WARN edit never fires
#     accidentally; instances that want it say so.

scaffold_difficulty_design:

  # =====================================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: claim_pricing_provisional_versus_final_variant_divergence
        grounds:
          - calculations.claim_reimbursement_amount
          - entities.WarrantyClaim.fields.provisional_total_cents
          - entities.WarrantyClaim.fields.approved_total_cents
          - entities.Dealer.fields.approved_parts_markup_pct
          - entities.StateLawProfile.fields.markup_cap_pct
          - entities.LaborOperation.fields.standard_time_hours
          - state_machines.WarrantyClaim.status.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          The two variants of claim_reimbursement_amount differ in TWO independent input
          substitutions at once - provisional uses the dealer's uncapped 0.40 markup and the
          dealer's own hours, final substitutes min(0.40, state cap 0.30) and
          min(approved_labor_hours, standard_time_hours) - so the same stored claim row carries
          124782 and 117342 simultaneously, and the 7440-cent delta is attributable to the markup
          cap alone while the hours cap independently suppresses a 2.0h claim to 1.5h.
        test_recipe:
          setup:
            - "Logical clock at 2026-05-01T00:00:00Z."
            - "CA state law profile with markup_cap_pct 0.30."
            - "Dealer D1 in CA with approved_labor_rate_cents 13750 and approved_parts_markup_pct 0.40 (grandfathered above the cap)."
            - "Vehicle VEH1 with basic terms 36 months / 36000 miles from 2024-01-15."
            - "Labor operation A1234-56: standard_time_hours 1.5, max_time_hours 2.5, BASIC, causal part required in failure group BRAKE_FRONT."
            - "Part BRK-PAD-9931 at dealer_net_cents 24799 in failure group BRAKE_FRONT."
            - "Claim CL1 submitted at 1.5 claimed hours and 3 parts, landing in SUBMITTED with no suspend edit."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-05-01T00:00:00Z" }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
            - call: "POST /warranty/state-law-profiles"
              payload: { state_code: "CA", markup_cap_pct: 0.30, labor_rate_method: "RETAIL_SAMPLE", min_sample_repair_orders: 5, max_labor_rate_cents: 19500, deemed_approved_days: 30, appeal_window_days: 30 }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { slp_ca_id: $.data.id }
            - call: "POST /warranty/dealers"
              payload: { dealer_code: "D1", name: "Dealer One", state_law_profile_id: "${slp_ca_id}", vehicles_in_operation: 100, initial_labor_rate_cents: 13750, initial_parts_markup_pct: 0.40 }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { d1_id: $.data.id }
            - call: "POST /warranty/vehicles"
              payload: { vin: "VIN00000000000001", model_year: 2024, warranty_start_date: "2024-01-15", in_service_odometer: 0, basic_months: 36, basic_miles: 36000, powertrain_months: 60, powertrain_miles: 60000 }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { veh1_id: $.data.id }
            - call: "POST /warranty/labor-operations"
              payload: { op_code: "A1234-56", description: "Front brake pad replacement", standard_time_hours: 1.5, max_time_hours: 2.5, category: "BASIC", requires_causal_part: true, causal_failure_group: "BRAKE_FRONT", overlap_group: "BRAKE_FRONT" }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { lo_brake_id: $.data.id }
            - call: "POST /warranty/parts"
              payload: { part_number: "BRK-PAD-9931", description: "Front brake pad set", dealer_net_cents: 24799, failure_group: "BRAKE_FRONT", return_required: true, retention_days: 30 }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { part_brake_id: $.data.id }
            - call: "POST /warranty/claims"
              payload: { dealer_id: "${d1_id}", vehicle_id: "${veh1_id}", labor_operation_id: "${lo_brake_id}", causal_part_id: "${part_brake_id}", repair_order_number: "RO-1001", repair_date: "2026-04-10", odometer_at_repair: 20000, claimed_labor_hours: 1.5, claimed_parts_qty: 3, complaint_text: "Customer reports brake squeal at low speed.", cause_text: "Front brake pads worn beyond specification.", correction_text: "Replaced front brake pads and verified normal braking." }
              as: DealerWarrantyAdmin
              as_user_id: "${d1_id}"
              captures: { cl1_id: $.data.id }
          trigger:
            - call: "POST /warranty/claims/${cl1_id}/adjudicate"
              payload: { decision: "APPROVE", approved_labor_hours: 2.0, approved_parts_qty: 3 }
              as: ClaimAdjudicator
              as_user_id: "adj-user-1"
          assert:
            - "WarrantyClaim.${cl1_id}.coverage_type == BASIC"
            - "WarrantyClaim.${cl1_id}.status == APPROVED"
            - "WarrantyClaim.${cl1_id}.provisional_labor_amount_cents == 20625"
            - "WarrantyClaim.${cl1_id}.provisional_parts_amount_cents == 104157"
            - "WarrantyClaim.${cl1_id}.provisional_total_cents == 124782"
            - "WarrantyClaim.${cl1_id}.approved_labor_amount_cents == 20625 (min(2.0, 1.5) * 13750, NOT 27500)"
            - "WarrantyClaim.${cl1_id}.approved_parts_amount_cents == 96717 (markup capped to 0.30, NOT 104157)"
            - "WarrantyClaim.${cl1_id}.approved_total_cents == 117342"
            - "WarrantyClaim.${cl1_id}.provisional_total_cents - WarrantyClaim.${cl1_id}.approved_total_cents == 7440"
            - "WarrantyClaim.${cl1_id}.dealer_participation_cents == 0 and oem_payable_cents == 117342"

      - name: dealer_expense_per_vehicle_paid_versus_incurred_basis_divergence
        grounds:
          - calculations.dealer_warranty_expense_per_vehicle
          - entities.Dealer.fields.vehicles_in_operation
          - entities.Dealer.fields.outlier_flag
          - entities.WarrantyClaim.fields.payment_status
          - state_machines.WarrantyClaim.payment_status.UNPAID_to_PAID
        distinguishing_aspect: |
          The two variants differ ONLY in the payment_status filter applied to the same numerator
          set: paid_basis counts payment_status == PAID and incurred_basis counts every APPROVED
          claim, so a dealer holding one PAID 50000 claim and one APPROVED-but-UNPAID 20000 claim
          over 100 vehicles reports 500 and 700 cents per vehicle in the same response, and only
          the paid_basis figure feeds the peer median and the outlier ratio.
        test_recipe:
          setup:
            - "Logical clock at 2026-05-01T00:00:00Z, so the default analytics window is [2025-05-01, 2026-05-01)."
            - "CA state law profile with markup_cap_pct 0.30."
            - "Exactly two dealers exist: DX1 and DX2, each with vehicles_in_operation 100, approved_labor_rate_cents 10000 and approved_parts_markup_pct 0.25."
            - "DX1 holds one APPROVED PAID claim worth 50000 and one APPROVED UNPAID claim worth 20000, both with repair_date 2026-04-10 / 2026-03-01."
            - "DX2 holds one APPROVED PAID claim worth 5000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-05-01T00:00:00Z" }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
            - call: "POST /warranty/state-law-profiles"
              payload: { state_code: "CA", markup_cap_pct: 0.30, labor_rate_method: "RETAIL_SAMPLE", min_sample_repair_orders: 5, max_labor_rate_cents: 19500, deemed_approved_days: 30, appeal_window_days: 30 }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { slp_ca_id: $.data.id }
            - call: "POST /warranty/dealers"
              payload: { dealer_code: "DX1", name: "Analytics Dealer One", state_law_profile_id: "${slp_ca_id}", vehicles_in_operation: 100, initial_labor_rate_cents: 10000, initial_parts_markup_pct: 0.25 }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { dx1_id: $.data.id }
            - call: "POST /warranty/dealers"
              payload: { dealer_code: "DX2", name: "Analytics Dealer Two", state_law_profile_id: "${slp_ca_id}", vehicles_in_operation: 100, initial_labor_rate_cents: 10000, initial_parts_markup_pct: 0.25 }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { dx2_id: $.data.id }
            - call: "POST /warranty/vehicles"
              payload: { vin: "VINX0000000000001", model_year: 2024, warranty_start_date: "2024-01-15", in_service_odometer: 0, basic_months: 36, basic_miles: 36000, powertrain_months: 60, powertrain_miles: 60000 }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { vehx1_id: $.data.id }
            - call: "POST /warranty/vehicles"
              payload: { vin: "VINX0000000000002", model_year: 2024, warranty_start_date: "2024-01-15", in_service_odometer: 0, basic_months: 36, basic_miles: 36000, powertrain_months: 60, powertrain_miles: 60000 }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { vehx2_id: $.data.id }
            - call: "POST /warranty/labor-operations"
              payload: { op_code: "AUD-100", description: "Electrical harness repair", standard_time_hours: 2.0, max_time_hours: 3.0, category: "BASIC", requires_causal_part: true, causal_failure_group: "ELEC", overlap_group: "ELEC" }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { lo_elec_id: $.data.id }
            - call: "POST /warranty/labor-operations"
              payload: { op_code: "D0001-00", description: "Diagnostic time only", standard_time_hours: 2.0, max_time_hours: 2.5, category: "BASIC", requires_causal_part: false, overlap_group: "DIAG" }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { lo_diag_id: $.data.id }
            - call: "POST /warranty/parts"
              payload: { part_number: "AUD-P1", description: "Electrical harness", dealer_net_cents: 24000, failure_group: "ELEC", return_required: false, retention_days: 0 }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { part_elec_id: $.data.id }
            - call: "POST /warranty/claims"
              payload: { dealer_id: "${dx1_id}", vehicle_id: "${vehx1_id}", labor_operation_id: "${lo_elec_id}", causal_part_id: "${part_elec_id}", repair_order_number: "RO-X1-1", repair_date: "2026-04-10", odometer_at_repair: 20000, claimed_labor_hours: 2.0, claimed_parts_qty: 1, complaint_text: "Customer reports intermittent electrical fault.", cause_text: "Harness chafed through insulation layer.", correction_text: "Replaced the electrical harness assembly." }
              as: DealerWarrantyAdmin
              as_user_id: "${dx1_id}"
              captures: { clx1_id: $.data.id }
            - call: "POST /warranty/claims/${clx1_id}/adjudicate"
              payload: { decision: "APPROVE", approved_labor_hours: 2.0, approved_parts_qty: 1 }
              as: ClaimAdjudicator
              as_user_id: "adj-user-1"
            - call: "POST /warranty/claims/${clx1_id}/pay"
              payload: {}
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
            - call: "POST /warranty/claims"
              payload: { dealer_id: "${dx1_id}", vehicle_id: "${vehx1_id}", labor_operation_id: "${lo_diag_id}", repair_order_number: "RO-X1-2", repair_date: "2026-03-01", odometer_at_repair: 18000, claimed_labor_hours: 2.0, claimed_parts_qty: 0, complaint_text: "Customer reports dash warning lamp on.", cause_text: "Diagnostic scan traced a transient sensor code.", correction_text: "Cleared the code and verified no recurrence." }
              as: DealerWarrantyAdmin
              as_user_id: "${dx1_id}"
              captures: { clx2_id: $.data.id }
            - call: "POST /warranty/claims/${clx2_id}/adjudicate"
              payload: { decision: "APPROVE", approved_labor_hours: 2.0, approved_parts_qty: 0 }
              as: ClaimAdjudicator
              as_user_id: "adj-user-1"
            - call: "POST /warranty/claims"
              payload: { dealer_id: "${dx2_id}", vehicle_id: "${vehx2_id}", labor_operation_id: "${lo_diag_id}", repair_order_number: "RO-X2-1", repair_date: "2026-04-10", odometer_at_repair: 12000, claimed_labor_hours: 0.5, claimed_parts_qty: 0, complaint_text: "Customer reports a faint rattle at idle.", cause_text: "Diagnostic time only, heat shield loose.", correction_text: "Retorqued the heat shield fastener." }
              as: DealerWarrantyAdmin
              as_user_id: "${dx2_id}"
              captures: { clx3_id: $.data.id }
            - call: "POST /warranty/claims/${clx3_id}/adjudicate"
              payload: { decision: "APPROVE", approved_labor_hours: 0.5, approved_parts_qty: 0 }
              as: ClaimAdjudicator
              as_user_id: "adj-user-1"
            - call: "POST /warranty/claims/${clx3_id}/pay"
              payload: {}
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
          trigger:
            - call: "GET /warranty/dealers/${dx1_id}/expense-analytics"
              payload: {}
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { paid_per_veh: $.data.warranty_expense_per_vehicle_paid_cents, incurred_per_veh: $.data.warranty_expense_per_vehicle_incurred_cents }
          assert:
            - "response.data.paid_numerator_cents == 50000 and incurred_numerator_cents == 70000"
            - "response.data.warranty_expense_per_vehicle_paid_cents == 500"
            - "response.data.warranty_expense_per_vehicle_incurred_cents == 700"
            - "response.data.incurred_claim_count == 2 and paid_claim_count == 1"
            - "response.data.peer_median_paid_cents == 275 (even peer count: round_half_up((50 + 500) / 2))"
            - "response.data.outlier_ratio == 1.8182 (round_half_up(500 / 275, 4)), computed from the paid basis and NOT from 700 / 275 == 2.5455"
            - "response.data.outlier_flag == true and Dealer.${dx1_id}.outlier_flag == true"
            - "GET /warranty/dealers/${dx2_id}/expense-analytics reports warranty_expense_per_vehicle_paid_cents == 50, outlier_ratio == 0.1818 and outlier_flag == false"

  # =====================================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: parts_amount_rounding_before_quantity_multiply_order
        grounds:
          - calculations.claim_reimbursement_amount
          - entities.PartCatalogItem.fields.dealer_net_cents
          - entities.WarrantyClaim.fields.provisional_parts_amount_cents
          - entities.WarrantyClaim.fields.approved_parts_amount_cents
        distinguishing_aspect: |
          Four inputs (dealer_net_cents 24799, markup pct, quantity 3, the state markup cap)
          combine in an order that is NOT commutative under rounding: the pinned order rounds the
          marked-up unit price to whole cents FIRST and then multiplies by quantity, so 24799 at
          0.40 gives 34719 * 3 = 104157 while the natural single-expression order
          round_half_up(24799 * 1.40 * 3) gives 104156. The same 1-cent fork repeats on the capped
          0.30 branch (96717 pinned versus 96716 forbidden), so an implementation that rounds late
          is off on both variants of the same row and cannot be rescued by the delta.
        test_recipe:
          setup:
            - "Identical to the dual_variant_calc World A fixture: clock 2026-05-01T00:00:00Z, CA profile with markup_cap_pct 0.30, dealer D1 at rate 13750 / markup 0.40, vehicle VEH1, labor op A1234-56, part BRK-PAD-9931 at dealer_net_cents 24799."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-05-01T00:00:00Z" }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
            - call: "POST /warranty/state-law-profiles"
              payload: { state_code: "CA", markup_cap_pct: 0.30, labor_rate_method: "RETAIL_SAMPLE", min_sample_repair_orders: 5, max_labor_rate_cents: 19500, deemed_approved_days: 30, appeal_window_days: 30 }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { slp_ca_id: $.data.id }
            - call: "POST /warranty/dealers"
              payload: { dealer_code: "D1", name: "Dealer One", state_law_profile_id: "${slp_ca_id}", vehicles_in_operation: 100, initial_labor_rate_cents: 13750, initial_parts_markup_pct: 0.40 }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { d1_id: $.data.id }
            - call: "POST /warranty/vehicles"
              payload: { vin: "VIN00000000000001", model_year: 2024, warranty_start_date: "2024-01-15", in_service_odometer: 0, basic_months: 36, basic_miles: 36000, powertrain_months: 60, powertrain_miles: 60000 }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { veh1_id: $.data.id }
            - call: "POST /warranty/labor-operations"
              payload: { op_code: "A1234-56", description: "Front brake pad replacement", standard_time_hours: 1.5, max_time_hours: 2.5, category: "BASIC", requires_causal_part: true, causal_failure_group: "BRAKE_FRONT", overlap_group: "BRAKE_FRONT" }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { lo_brake_id: $.data.id }
            - call: "POST /warranty/parts"
              payload: { part_number: "BRK-PAD-9931", description: "Front brake pad set", dealer_net_cents: 24799, failure_group: "BRAKE_FRONT", return_required: true, retention_days: 30 }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { part_brake_id: $.data.id }
          trigger:
            - call: "POST /warranty/claims"
              payload: { dealer_id: "${d1_id}", vehicle_id: "${veh1_id}", labor_operation_id: "${lo_brake_id}", causal_part_id: "${part_brake_id}", repair_order_number: "RO-1001", repair_date: "2026-04-10", odometer_at_repair: 20000, claimed_labor_hours: 1.5, claimed_parts_qty: 3, complaint_text: "Customer reports brake squeal at low speed.", cause_text: "Front brake pads worn beyond specification.", correction_text: "Replaced front brake pads and verified normal braking." }
              as: DealerWarrantyAdmin
              as_user_id: "${d1_id}"
              captures: { cl_round_id: $.data.id }
            - call: "POST /warranty/claims/${cl_round_id}/adjudicate"
              payload: { decision: "APPROVE", approved_labor_hours: 1.5, approved_parts_qty: 3 }
              as: ClaimAdjudicator
              as_user_id: "adj-user-1"
          assert:
            - "WarrantyClaim.${cl_round_id}.provisional_parts_amount_cents == 104157, NOT 104156"
            - "WarrantyClaim.${cl_round_id}.provisional_total_cents == 124782"
            - "WarrantyClaim.${cl_round_id}.approved_parts_amount_cents == 96717, NOT 96716"
            - "WarrantyClaim.${cl_round_id}.approved_total_cents == 117342"

      - name: audit_extrapolation_pinned_six_step_evaluation_order
        grounds:
          - calculations.audit_extrapolated_chargeback
          - entities.DealerAudit.fields.sample_paid_snapshot_cents
          - entities.DealerAudit.fields.population_paid_snapshot_cents
          - entities.DealerAudit.fields.error_rate
          - entities.DealerAudit.fields.extrapolation_factor
          - entities.DealerAudit.fields.total_chargeback_cents
        distinguishing_aspect: |
          Six terms feed one another in a pinned order that cannot be reassociated: the two paid
          snapshots must be captured BEFORE step 7 debits the sampled claims (otherwise the
          sampled claims leave payment_status PAID and both denominators collapse), the population
          denominator is the in-period paid total MINUS the sample rather than the whole
          population, error_rate is rounded to 4 places before it selects the tier, and the tier
          factor multiplies the already-rounded rate. Two sampled claims at 100000 with 40000 of
          findings against a 50000 non-sampled remainder land on 0.4000 / 1.00 / 20000 / 60000;
          any of the four reorderings produces a different total.
        test_recipe:
          setup:
            - "Clock 2026-05-01T00:00:00Z; CA profile with markup_cap_pct 0.30 and appeal_window_days 30."
            - "Dealer D_AUD at rate 10000 / markup 0.25, vehicles_in_operation 100."
            - "One vehicle VEH_A and labor op AUD-100 (standard 2.0 h, max 3.0 h, BASIC, causal group ELEC) with part AUD-P1 at dealer_net_cents 24000 and return_required false."
            - "Three claims with repair_date 2026-01-05, 2026-02-10 and 2026-03-20 (all gaps >= 31 days, so no overlap error and only REPEAT_REPAIR WARN edits), each approved at 2.0 h / 1 part for approved_total_cents 50000, and all three paid."
            - "Audit A1 over [2026-01-01, 2026-07-01) with sample_size 2, started, carrying findings of 30000 on CLA1 and 10000 on CLA2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-05-01T00:00:00Z" }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
            - call: "POST /warranty/state-law-profiles"
              payload: { state_code: "CA", markup_cap_pct: 0.30, labor_rate_method: "RETAIL_SAMPLE", min_sample_repair_orders: 5, max_labor_rate_cents: 19500, deemed_approved_days: 30, appeal_window_days: 30 }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { slp_ca_id: $.data.id }
            - call: "POST /warranty/dealers"
              payload: { dealer_code: "D-AUD", name: "Audit Dealer", state_law_profile_id: "${slp_ca_id}", vehicles_in_operation: 100, initial_labor_rate_cents: 10000, initial_parts_markup_pct: 0.25 }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { daud_id: $.data.id, daud_version: $.data.version }
            - call: "POST /warranty/vehicles"
              payload: { vin: "VINA0000000000001", model_year: 2024, warranty_start_date: "2024-01-15", in_service_odometer: 0, basic_months: 36, basic_miles: 36000, powertrain_months: 60, powertrain_miles: 60000 }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { veha_id: $.data.id }
            - call: "POST /warranty/labor-operations"
              payload: { op_code: "AUD-100", description: "Electrical harness repair", standard_time_hours: 2.0, max_time_hours: 3.0, category: "BASIC", requires_causal_part: true, causal_failure_group: "ELEC", overlap_group: "ELEC" }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { lo_elec_id: $.data.id }
            - call: "POST /warranty/parts"
              payload: { part_number: "AUD-P1", description: "Electrical harness", dealer_net_cents: 24000, failure_group: "ELEC", return_required: false, retention_days: 0 }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
