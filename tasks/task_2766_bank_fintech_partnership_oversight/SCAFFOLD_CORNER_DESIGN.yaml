            - "plan_status == DRAFT, plan_round == 1 and plan_residual == 8606250 — the residual is the live sum of both custody balances (8100000 FBO + 506250 RESERVE)"
            - "plan_appr_status == APPROVED and plan_appr_by == rc-dana"
            - "the response status is 409 and err_unsettled == ERR_UNSETTLED_BATCHES_OUTSTANDING"
            - "err_unsettled != ERR_WIND_DOWN_NOTICE_NOT_ELAPSED — the notice period has in fact elapsed"
            - "WindDownPlan.${plan_id}.status is still APPROVED"

  - section: calculations
    instances:

      - name: diligence_composite_rounds_each_weighted_component_to_two_dp_then_the_sum_to_one_dp
        claim_type: Precision
        grounds:
          - calculations.diligence_composite_score
          - calculations.diligence_composite_score.precision
          - entities.DiligenceReview.fields.composite_score
        distinguishing_aspect: "An odd compliance score makes the third component land on a half-cent: 83*0.35 == 29.05 exactly, so the component sum is 82.05 and round_half_up at 1 dp gives 82.1 — truncation or banker's rounding both yield 82.0, and rounding once over the unrounded products yields the same 82.05 that must still be rounded UP."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z. One partner, one INITIAL review with sub-scores 80 / 80 / 83 / 85."
          setup_api_calls:
            - *q_clock
            - *q_partner_a
          trigger:
            - call: "POST /oversight/diligence-reviews"
              payload: { partner_id: "${pa_id}", review_type: "INITIAL", business_model_score: 80, funding_score: 80, compliance_capability_score: 83, complaint_history_score: 85, expected_partner_version: "${pa_v1}" }
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { dr_p_id: $.data.id }
            - call: "POST /oversight/diligence-reviews/${dr_p_id}/submit"
              payload: { submission_note: "Rounding-sensitive scorecard." }
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { dr_p_eff: $.data.effective_complaint_history_score, dr_p_score: $.data.composite_score, dr_p_tier: $.data.tier }
          assert:
            - "dr_p_eff == 85 — INITIAL uses the submitted complaint_history_score verbatim"
            - "dr_p_score == 82.1 exactly: components 16.00 + 20.00 + 29.05 + 17.00 == 82.05, round_half_up to 1 dp"
            - "dr_p_score is NOT 82.0"
            - "dr_p_tier == TIER_2 — 82.1 is below TIER_1_FLOOR 85.0 and at or above TIER_2_FLOOR 70.0"

      - name: renewal_diligence_discards_the_submitted_complaint_history_score_and_fails_the_composite_floor
        claim_type: Variant Divergence
        grounds:
          - calculations.diligence_composite_score.variants.initial_underwrite
          - calculations.diligence_composite_score.variants.renewal_underwrite
          - validations.priority_57
          - errors.ERR_DILIGENCE_SCORE_BELOW_FLOOR
        distinguishing_aspect: "The identical four sub-scores 60/60/60/100 pass as INITIAL with composite 68.0 (TIER_3) and fail as RENEWAL with composite 48.0 (UNRATED), because RENEWAL substitutes max(0, 100 - floor(complaint_rate_bps/5)) — at 500 bps that is exactly 0, so the submitted 100 is stored but never used, and the PASS is refused by the composite floor rather than the capability floor."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z. Partner B is DILIGENCE_PASSED off an INITIAL review, then reports a census of 20 accounts and receives one complaint, pinning complaint_rate_bps at exactly 500."
          setup_api_calls:
            - *q_clock
            - &q_partner_b
              call: "POST /oversight/partners"
              payload: { legal_name: "Riverlane Lending LLC", business_model: "LENDING", funding_stage: "SEED", months_runway: 9, disclosed_complaints_per_10k: 45.00, end_user_account_count: 20 }
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { pb_id: $.data.id, pb_v1: $.data.version }
            - call: "POST /oversight/diligence-reviews"
              payload: { partner_id: "${pb_id}", review_type: "INITIAL", business_model_score: 60, funding_score: 60, compliance_capability_score: 60, complaint_history_score: 100, expected_partner_version: "${pb_v1}" }
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { dr_b1_id: $.data.id }
            - call: "POST /oversight/diligence-reviews/${dr_b1_id}/submit"
              payload: { submission_note: "Initial underwrite." }
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { dr_b1_eff: $.data.effective_complaint_history_score, dr_b1_score: $.data.composite_score, dr_b1_tier: $.data.tier }
            - call: "POST /oversight/diligence-reviews/${dr_b1_id}/decide"
              payload: { outcome: "PASSED", decision_note: "Marginal but acceptable at TIER_3." }
              as: ComplianceOfficer
              as_user_id: "co-brett"
            - call: "POST /oversight/partners/${pb_id}/account-census"
              payload: { end_user_account_count: 20, as_of_date: "2026-08-01T00:00:00Z" }
              as: ProgramOfficer
              as_user_id: "po-alice"
            - call: "POST /oversight/complaints"
              payload: { partner_id: "${pb_id}", channel: "CFPB_PORTAL", category: "CREDIT_REPORTING", severity: "HIGH", received_at: "2026-07-30T00:00:00Z", narrative: "Furnished a charge-off that the consumer says was paid in full.", is_reg_e_dispute: false }
              as: ComplianceOfficer
              as_user_id: "co-brett"
            - call: "GET /oversight/partners/${pb_id}"
              payload: {}
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { pb_rate: $.data.complaint_rate_bps, pb_v_now: $.data.version }
            - call: "POST /oversight/diligence-reviews"
              payload: { partner_id: "${pb_id}", review_type: "RENEWAL", business_model_score: 60, funding_score: 60, compliance_capability_score: 60, complaint_history_score: 100, expected_partner_version: "${pb_v_now}" }
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { dr_b2_id: $.data.id }
          trigger:
            - call: "POST /oversight/diligence-reviews/${dr_b2_id}/submit"
              payload: { submission_note: "Renewal underwrite with the same analyst sub-scores." }
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { dr_b2_eff: $.data.effective_complaint_history_score, dr_b2_score: $.data.composite_score, dr_b2_tier: $.data.tier, dr_b2_submitted_ch: $.data.complaint_history_score }
            - call: "POST /oversight/diligence-reviews/${dr_b2_id}/decide"
              payload: { outcome: "PASSED", decision_note: "Attempting to renew." }
              as: ComplianceOfficer
              as_user_id: "co-brett"
              captures: { err_floor: $.data.error_id }
          assert:
            - "dr_b1_eff == 100, dr_b1_score == 68.0 (12.00 + 15.00 + 21.00 + 20.00) and dr_b1_tier == TIER_3"
            - "pb_rate == 500 — round_half_up(1 * 10000 / 20, 0)"
            - "dr_b2_eff == 0 — max(0, 100 - floor(500/5)) == max(0, 0)"
            - "dr_b2_submitted_ch == 100 — the submitted value is still stored, merely unused"
            - "dr_b2_score == 48.0 (12.00 + 15.00 + 21.00 + 0.00) and dr_b2_tier == UNRATED"
            - "the decide returns 422 with err_floor == ERR_DILIGENCE_SCORE_BELOW_FLOOR, not ERR_COMPLIANCE_CAPABILITY_FLOOR — compliance_capability_score 60 clears its floor at priority 56"
            - "Partner.${pb_id}.status is still IN_DILIGENCE and capability_tier is still TIER_3 from the earlier PASS"

      - name: complaint_rate_uses_a_denominator_floor_of_one_when_no_census_was_ever_filed
        claim_type: Constants Applied
        grounds:
          - calculations.complaint_rate_bps.constants
          - calculations.complaint_rate_bps.input_set
          - endpoints.POST_/oversight/partners/{id}/account-census
        distinguishing_aspect: "end_user_account_count 0 does not divide by zero and does not yield 0 bps: DENOMINATOR_FLOOR 1 turns a single complaint into 10000 bps, the maximum-severity reading — and filing a census of 100000 immediately rescales the same complaint to 0 bps without touching the Complaint row."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z. Partner D registered with end_user_account_count 0 and no census."
          setup_api_calls:
            - *q_clock
            - call: "POST /oversight/partners"
              payload: { legal_name: "Zerobase Payments Inc", business_model: "PAYMENT_FACILITATION", funding_stage: "SEED", months_runway: 4, disclosed_complaints_per_10k: 0.00, end_user_account_count: 0 }
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { pd_id: $.data.id, pd_rate0: $.data.complaint_rate_bps }
          trigger:
            - call: "POST /oversight/complaints"
              payload: { partner_id: "${pd_id}", channel: "PARTNER_APP", category: "ACCOUNT_ACCESS", severity: "CRITICAL", received_at: "2026-07-31T18:00:00Z", narrative: "Sole pilot user locked out of the app for nine days.", is_reg_e_dispute: true }
              as: ComplianceOfficer
              as_user_id: "co-brett"
              captures: { cmp_d_id: $.data.id, cmp_d_owner: $.data.handling_owner }
            - call: "GET /oversight/partners/${pd_id}"
              payload: {}
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { pd_rate1: $.data.complaint_rate_bps }
            - call: "POST /oversight/partners/${pd_id}/account-census"
              payload: { end_user_account_count: 100000, as_of_date: "2026-08-01T00:00:00Z" }
              as: FintechPartner
              as_user_id: "${pd_id}"
              captures: { pd_rate2: $.data.complaint_rate_bps, pd_census: $.data.end_user_account_count }
          assert:
            - "pd_rate0 == 0 — no complaints, so the numerator is 0 regardless of the floor"
            - "cmp_d_owner == BANK — the computed default applies because no EXECUTED ProgramAgreement exists"
            - "pd_rate1 == 10000 — round_half_up(1 * 10000 / max(1, 0), 0)"
            - "pd_census == 100000 and pd_rate2 == 0 — round_half_up(1 * 10000 / 100000, 0) == round_half_up(0.1, 0)"
            - "Complaint.${cmp_d_id}.status is still RECEIVED — the census rescaled the rate without touching the complaint"

      - name: the_complaint_rate_restrict_threshold_is_inclusive_at_exactly_two_hundred_fifty_bps
        claim_type: Correct Result
        grounds:
          - calculations.partner_oversight_posture.constants
          - calculations.partner_oversight_posture.precision
          - calculations.complaint_rate_bps
        distinguishing_aspect: "A census of 40 accounts with one complaint gives exactly 250 bps and the >= comparison makes that RESTRICTED, while 41 accounts gives round_half_up(243.90) == 244 bps, which lands in the HEIGHTENED band — the one-account difference is what separates the two postures, and the posture ladder is only evaluated at all because the Partner is CONTRACTED."
        test_recipe:
          setup:
            - "Partner A CONTRACTED (posture recomputation applies), reserve funded to 312500 so reserve_shortfall_cents is 0 and the shortfall predicate cannot mask the complaint-rate predicate."
          setup_api_calls:
            - *q_clock
            - *q_cycle_aug
            - *q_partner_a
            - *q_dr_a
            - *q_dr_a_submit
            - *q_dr_a_pass
            - *q_pa_read_passed
            - *q_agr_a
            - *q_agr_a_submit
            - *q_agr_a_execute
            - *q_res_a_read
            - *q_res_fund_312500
            - call: "POST /oversight/partners/${pa_id}/account-census"
              payload: { end_user_account_count: 40, as_of_date: "2026-08-01T00:00:00Z" }
              as: ProgramOfficer
              as_user_id: "po-alice"
          trigger:
            - call: "POST /oversight/complaints"
              payload: { partner_id: "${pa_id}", channel: "STATE_AG", category: "FEES", severity: "HIGH", received_at: "2026-08-03T09:30:00Z", narrative: "State attorney general forwarded a fee-stacking allegation.", is_reg_e_dispute: false }
              as: ComplianceOfficer
              as_user_id: "co-brett"
              captures: { cmp_ag_id: $.data.id, cmp_ag_due: $.data.response_due_at }
            - call: "GET /oversight/partners/${pa_id}"
              payload: {}
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { pa_rate_250: $.data.complaint_rate_bps, pa_posture_250: $.data.oversight_posture }
            - call: "POST /oversight/partners/${pa_id}/account-census"
              payload: { end_user_account_count: 41, as_of_date: "2026-08-03T00:00:00Z" }
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { pa_rate_244: $.data.complaint_rate_bps, pa_posture_244: $.data.oversight_posture }
          assert:
            - "cmp_ag_due == 2026-08-17T23:59:59.999Z — STATE_AG is 10 BUSINESS days from the Monday 2026-08-03 anchor"
            - "pa_rate_250 == 250 and pa_posture_250 == RESTRICTED — RESTRICT_COMPLAINT_RATE_BPS is inclusive"
            - "pa_rate_244 == 244 — round_half_up(1 * 10000 / 41, 0) == round_half_up(243.902..., 0)"
            - "pa_posture_244 == HEIGHTENED — 244 is below 250 but at or above HEIGHTEN_COMPLAINT_RATE_BPS 120"
            - "Partner.${pa_id}.reserve_shortfall_cents == 0 throughout, so the HEIGHTENED reading comes from the complaint rate and not from the reserve"

      - name: a_saturday_and_the_following_monday_intake_share_one_business_basis_due_date
        claim_type: Variant Divergence
        grounds:
          - calculations.complaint_response_due_at.variants.business_basis
          - calculations.complaint_response_due_at.variants.calendar_basis
          - calculations.complaint_response_due_at.precision
        distinguishing_aspect: "SOCIAL is a 5-business-day channel whose weekend anchor jumps to the next Monday midnight, so a Saturday 2026-08-01T09:30:00Z intake and a Monday 2026-08-03T09:30:00Z intake both land on 2026-08-10T23:59:59.999Z — while the CALENDAR channel CFPB_PORTAL on the same Saturday instant preserves the time-of-day and consumes the weekend, landing on 2026-08-16T09:30:00.000Z."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-16T12:00:00Z so that all three received_at instants are in the past. 2026-08-01 is a Saturday and 2026-08-03 is a Monday."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-16T12:00:00Z" }
              as: ProgramOfficer
              as_user_id: "po-alice"
            - *q_partner_a
          trigger:
            - call: "POST /oversight/complaints"
              payload: { partner_id: "${pa_id}", channel: "SOCIAL", category: "DISCLOSURE", severity: "MEDIUM", received_at: "2026-08-01T09:30:00Z", narrative: "Weekend social post alleging a hidden monthly fee.", is_reg_e_dispute: false }
              as: ComplianceOfficer
              as_user_id: "co-brett"
              captures: { due_sat: $.data.response_due_at }
            - call: "POST /oversight/complaints"
              payload: { partner_id: "${pa_id}", channel: "SOCIAL", category: "DISCLOSURE", severity: "MEDIUM", received_at: "2026-08-03T09:30:00Z", narrative: "Monday social post alleging the same hidden monthly fee.", is_reg_e_dispute: false }
              as: ComplianceOfficer
              as_user_id: "co-brett"
