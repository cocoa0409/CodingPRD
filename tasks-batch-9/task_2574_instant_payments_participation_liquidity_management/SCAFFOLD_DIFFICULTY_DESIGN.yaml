              as: NetworkOperator
              as_user_id: "netops-01"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T10:00:00Z" }
              as: NetworkOperator
              as_user_id: "netops-01"
            - call: "POST /outage-events"
              payload: { scope: "PARTICIPANT", severity: "FULL_OUTAGE", fallback_rail: "FALLBACK_ACH", started_at: "2026-08-03T10:00:00Z", participant_id: "${pa_id}" }
              as: NetworkOperator
              as_user_id: "netops-01"
              captures: { oe1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T12:00:00Z" }
              as: NetworkOperator
              as_user_id: "netops-01"
            - call: "POST /outage-events/${oe1_id}/resolution"
              payload: { ended_at: "2026-08-03T12:00:00Z" }
              as: NetworkOperator
              as_user_id: "netops-01"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T12:10:00Z" }
              as: NetworkOperator
              as_user_id: "netops-01"
          trigger:
            - call: "POST /outage-events"
              payload: { scope: "PARTICIPANT", severity: "DEGRADED", fallback_rail: "FALLBACK_WIRE", started_at: "2026-08-03T12:10:00Z", participant_id: "${pa_id}" }
              as: NetworkOperator
              as_user_id: "netops-01"
          assert:
            - "While the first event was DECLARED, Participant.${pa_id}.operational_posture == OFFLINE"
            - "OutageEvent.${oe1_id}.status == RESOLVED with ended_at == 2026-08-03T12:00:00Z, and Participant.${pa_id}.operational_posture == NORMAL again"
