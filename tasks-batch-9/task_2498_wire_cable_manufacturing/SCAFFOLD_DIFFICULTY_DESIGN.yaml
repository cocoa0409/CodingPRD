      - name: lot_release_dimensional_nonconformance_beats_segregation_of_duties
        grounds:
          - validations.priority_52_ERR_DIMENSIONAL_NONCONFORMANCE
          - validations.priority_57_ERR_SEGREGATION_OF_DUTIES
          - calculations.lot_dimensional_conformance
          - endpoints.POST_/production-lots/{id}/release
        conflicting_priorities: [52, 57]
        categories: [business_safety, auth]
        expected_error: ERR_DIMENSIONAL_NONCONFORMANCE
        expected_http: 422
        distinguishing_aspect: |
          A different category pair (business_safety vs auth) on a different
          endpoint, and the surprising direction: the auth-category rule loses.
          ERR_SEGREGATION_OF_DUTIES sits at priority 57, below the dimensional
          gate at 52, so unlike the usual "auth first" intuition the 401/403
          family does not automatically win - only the declared ladder position
          does. The measurements are tuned so the release-time minimum-wall check
          is the only thing that fails dimensionally: 25.19 mils passes the
          concentricity gate at extrusion (86.86 >= 85) but misses the required
          25.20 mils by one hundredth.
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; copper 2026-07-30 at 4.10; QUALIFIED compounds; ACTIVE UL file; RELEASED SKU THHN-12-CU with insulation_thickness_mils 28, min_wall_pct 90 (required minimum wall = round(28 * 90 / 100, 2) = 25.20) and concentricity_min_pct 85."
            - "Order SO-SOD for 5.000 kft; rod lot 20000 lbs; lot LOT-SOD drawn and stranded."
            - "EXTRUSION recorded with measured_min_wall_mils 25.19 and measured_max_wall_mils 29.0: concentricity_pct = round(100 * 25.19 / 29.0, 2) = 86.86 >= 85, so extrusion succeeds and quality_state stays PENDING."
            - "Both required tests are performed by the SAME user qe-001, so that user is on every CableTest.operator_user_id; lot reaches process_state TESTED with quality_state still PENDING, awaiting release."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /metal-price-quotes"
