              payload: { cat_code: "CAT-2026-148", peril_type: "HURRICANE", jurisdiction_state: "FL", event_start_utc: "2026-07-28T00:00:00.000Z", exposure_count: 1000, avg_insured_value: 250000, expected_severity_index: 0.0500 }
              as: CatastropheManager
              as_user_id: "cm-001"
              captures: { ev: $.data.id }
            - call: "POST /catastrophe-events/${ev}/declare"
              payload: {}
              as: CatastropheManager
              as_user_id: "cm-001"
            - call: "POST /claims"
              payload: { policy_number: "POL-1001", loss_state: "FL", loss_date_utc: "2026-07-28T00:00:00.000Z", reported_loss_amount: 8000, coverage_lines: [{ coverage_code: "DWELLING", limit_amount: 200000, deductible_amount: 1000, estimated_damage_amount: 6000 }], event_id: "${ev}", access_status: "ACCESSIBLE" }
