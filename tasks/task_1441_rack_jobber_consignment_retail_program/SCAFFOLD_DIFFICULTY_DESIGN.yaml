          assert:
            - "status path: COUNTS_SUBMITTED -> DISPUTED -> CHECKED_IN -> COUNTS_SUBMITTED -> CONFIRMED"
            - "recount cleared submitted_lines; second submit re-froze them; total_restock_units == 40"
            - "InventoryBalance[0].on_hand_units == 40 and lifetime_delivered_units == 40 (restock posted exactly once, on the confirm)"
            - "ServiceVisit.${visit}.version == 7 (create + check-in + submit + dispute + recount + submit + confirm)"

  - rule_id: transitive_cascade
    instances:
      - name: audit_certify_shrink_suspension_cascade
        grounds: [state_machines.AuditCount.SUBMITTED_to_CERTIFIED, state_machines.StoreAgreement.ACTIVE_to_SUSPENDED, calculations.shrink_ratio_posture, state_machines.ServiceVisit.SCHEDULED_to_CANCELLED]
