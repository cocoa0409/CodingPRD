      - name: work_order_completion_rebands_segment_and_restores_loop_posture
        grounds:
          - state_machines.WorkOrder.BACKFILLED_to_COMPLETED
          - state_machines.PipeSegment.UNDER_REPAIR_to_MONITORED
          - state_machines.NetworkLoop.ISOLATED_to_NORMAL
          - calculations.segment_leak_risk_score
          - entities.PipeSegment.fields.historical_leak_count
          - entities.NetworkLoop.fields.suspect_segment_count
        distinguishing_aspect: |
          Depth-3 cascade originating from POST /district-energy/work-orders/{id}/complete — a
          different triggering transition from the fuel-contract cascade: completion zeroes
          PipeSegment.makeup_water_ratio and raises historical_leak_count to 3, the recomputed
          leak_risk_score of 56.08 is what re-bands the segment out of UNDER_REPAIR into MONITORED,
          and that recomputed band (suspect_segment_count back to 0) is what selects
          NetworkLoop.posture ISOLATED to NORMAL rather than ISOLATED to CONSTRAINED.
        test_recipe:
          setup:
            - "Logical clock advanced to 2026-09-01T09:00:00Z, inside the work window."
            - "NetworkLoop LOOP-G (HEATING, rated_capacity_kw 20000.0)."
            - "PipeSegment SEG-G1 (install_year 1986, insulation_class C) assessed with makeup_water_ratio 0.06 and historical_leak_count 2, giving leak_risk_score 79.42 and condition SUSPECT, so NetworkLoop.suspect_segment_count == 1."
            - "WorkOrder WOG on SEG-G1, work_type LEAK_REPAIR, requires_isolation true, window 2026-09-01T08:00:00Z to 2026-09-01T16:00:00Z, reported by tech-1, permit GRANTED, driven through EXCAVATING and REPAIRING to BACKFILLED, so the segment is UNDER_REPAIR and the loop is ISOLATED with open_isolation_count 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemController
            - call: "POST /district-energy/network-loops"
              payload: { code: "LOOP-G", name: "Industrial Loop G", service_mode: "HEATING", design_supply_temp_c: 110.0, max_pressure_kpa: 2000.0, rated_capacity_kw: 20000.0 }
              as: SystemController
              captures: { loop_g_id: $.data.id }
            - call: "POST /district-energy/pipe-segments"
              payload: { loop_id: "${loop_g_id}", code: "SEG-G1", length_m: 1200.0, diameter_mm: 300, install_year: 1986, insulation_class: "C", buried_depth_m: 1.5, makeup_water_ratio: 0.06, historical_leak_count: 2 }
              as: NetworkEngineer
              captures: { seg_g1_id: $.data.id }
            - call: "POST /district-energy/pipe-segments/${seg_g1_id}/condition-assessment"
              payload: { makeup_water_ratio: 0.06, historical_leak_count: 2, insulation_class: "C", survey_note: "annual acoustic survey" }
              as: NetworkEngineer
            - call: "POST /district-energy/work-orders"
              payload: { segment_id: "${seg_g1_id}", loop_id: "${loop_g_id}", work_type: "LEAK_REPAIR", window_start: "2026-09-01T08:00:00Z", window_end: "2026-09-01T16:00:00Z", requires_isolation: true }
              as: FieldTechnician
              as_user_id: "tech-1"
              captures: { wog_id: $.data.id }
            - call: "POST /district-energy/work-orders/${wog_id}/submit-permit"
              payload: {}
              as: FieldTechnician
              as_user_id: "tech-1"
            - call: "POST /district-energy/work-orders/${wog_id}/permit-decision"
              payload: { permit_decision: "GRANTED", decision_note: "excavation permit issued" }
              as: NetworkEngineer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T09:00:00Z" }
              as: SystemController
            - call: "POST /district-energy/work-orders/${wog_id}/begin-excavation"
              payload: {}
              as: FieldTechnician
              as_user_id: "tech-1"
            - call: "POST /district-energy/work-orders/${wog_id}/begin-repair"
              payload: {}
              as: FieldTechnician
              as_user_id: "tech-1"
            - call: "POST /district-energy/work-orders/${wog_id}/backfill"
              payload: {}
              as: FieldTechnician
              as_user_id: "tech-1"
            - call: "GET /district-energy/network-loops/${loop_g_id}"
              payload: {}
              as: NetworkEngineer
          trigger:
            - call: "POST /district-energy/work-orders/${wog_id}/complete"
              payload: { completion_note: "joint replaced, insulation patched" }
              as: FieldTechnician
              as_user_id: "tech-2"
            - call: "GET /district-energy/pipe-segments/${seg_g1_id}"
              payload: {}
              as: NetworkEngineer
            - call: "GET /district-energy/network-loops/${loop_g_id}"
              payload: {}
              as: NetworkEngineer
          assert:
            - "GET /district-energy/network-loops/${loop_g_id} before the trigger: NetworkLoop.${loop_g_id}.posture == ISOLATED, NetworkLoop.${loop_g_id}.open_isolation_count == 1, NetworkLoop.${loop_g_id}.suspect_segment_count == 0"
            - "WorkOrder.${wog_id}.work_state == COMPLETED"
            - "WorkOrder.${wog_id}.completed_by_user_id == tech-2"
            - "PipeSegment.${seg_g1_id}.makeup_water_ratio == 0.0"
            - "PipeSegment.${seg_g1_id}.historical_leak_count == 3"
            - "PipeSegment.${seg_g1_id}.leak_risk_score == 56.08"
            - "PipeSegment.${seg_g1_id}.condition == MONITORED"
            - "NetworkLoop.${loop_g_id}.open_isolation_count == 0"
            - "NetworkLoop.${loop_g_id}.suspect_segment_count == 0"
            - "NetworkLoop.${loop_g_id}.posture == NORMAL"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: plan_state_beats_reserve_margin_on_review_of_draft_plan
        grounds:
          - validations[priority=10]
          - validations[priority=12]
          - errors[ERR_PLAN_STATE_INVALID]
          - errors[ERR_RESERVE_MARGIN_INSUFFICIENT]
          - calculations.plan_reliability_metrics
        distinguishing_aspect: |
          Error-category pair state (priority 10) versus business_safety (priority 12): the LOOP-E
          plan violates both the review from-state requirement (it is DRAFT, not
          SUBMITTED) and the reserve-margin floor (reserve_margin_pct 12.09 < 15.0), and the
          response must be ERR_PLAN_STATE_INVALID; submitting first removes only the state
          violation and the very same review call then returns ERR_RESERVE_MARGIN_INSUFFICIENT.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "NetworkLoop LOOP-E (HEATING, rated_capacity_kw 2000.0) in posture NORMAL."
            - "RateSchedule RS-I (INDUSTRIAL_PROCESS) and ACTIVE ConnectionAgreement CE1 (INDUSTRIAL_PROCESS, reserved 2000.0)."
            - "PUBLISHED LoadForecast F5 for LOOP-E on 2026-08-06 with coincident_demand_kw 2052.00."
