  - { method: POST, path: "/api/agreements/{id}/terminate", description: "Terminate/withdraw agreement with early_termination_fee invoice (DRAFT/PENDING -> WITHDRAWN no fee; ACTIVE/SUSPENDED -> TERMINATED with fee)", roles: [PremiumSalesRep, StadiumAdmin], code: 200, input: [], output: LicenseAgreement, side_effects: ["fee invoice; suite -> AVAILABLE"] }
