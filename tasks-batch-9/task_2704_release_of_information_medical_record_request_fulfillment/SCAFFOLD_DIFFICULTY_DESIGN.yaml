              payload: {}
              as: ReleaseReviewer
              as_user_id: "u-review-1"
          assert:
            - "after REWORK: RecordSegment.${seg_bh}.redaction_status == REWORK and redaction_applied_by_user_id == null"
            - "after REWORK: RecordSegment.${seg_bh}.retrieval_status is still RETRIEVED and sensitivity_status is still AUTHORIZED_INCLUDE — the other two dimensions did not move"
            - "after REWORK: Request.${rq}.fulfillment_status == REDACTION and billable_page_count == 62 (the 9 pages never counted while unapproved)"
            - "after the second apply: RecordSegment.${seg_bh}.redaction_status == APPLIED, redacted_page_count == 5, redaction_applied_by_user_id == u-analyst-2"
            - "after the second apply: Request.${rq}.billable_page_count is still 62"
            - "after APPROVE: RecordSegment.${seg_bh}.redaction_status == APPROVED and redaction_approved_by_user_id == u-review-1"
            - "after APPROVE: Request.${rq}.fulfillment_status == RELEASE_READY (bubble-up) and billable_page_count == 57, redacted_page_count_total == 5"
            - "RecordSegment.${seg_gen} never left retrieval_status RETRIEVED / sensitivity_status NOT_SENSITIVE / redaction_status NOT_REQUIRED"

