  - section: rbac
    instances:
      - name: read_establishment_with_missing_auth_headers_returns_unauthenticated
        claim_type: Segregation of duties
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "The request is issued with BOTH X-User-Role and X-User-ID omitted; priority 1 fires before any existence check, so a read of a real establishment id returns ERR_UNAUTHENTICATED (401), not 404 and not 403."
        test_recipe:
          setup:
            - "One Establishment exists."
          setup_api_calls:
            - call: "POST /body-art/establishments"
              payload: { name: "Header Ink", street_address: "47 Fortyseventh St", county_code: "ADA", establishment_type: "TATTOO" }
              as: HealthOfficer
              as_user_id: "officer-ho-1"
              captures: { est_id: $.data.id }
          trigger:
            - call: "GET /body-art/establishments/${est_id}"
              payload: {}
              captures: { err: $.data.error_id }
          assert:
            - "the request carries neither X-User-Role nor X-User-ID"
            - "HTTP status is 401"
            - "${err} == ERR_UNAUTHENTICATED"

      - name: inspector_cannot_activate_establishment
        claim_type: peer_roles
        grounds:
          - validations[priority=2]
          - errors[ERR_UNAUTHORIZED]
          - roles.Inspector
          - roles.HealthOfficer
        distinguishing_aspect: "Permit issuance is a HealthOfficer exclusive operation; an Inspector calling activate on a correctly staged establishment returns ERR_UNAUTHORIZED (403) and the permit stays PENDING_INSPECTION."
        test_recipe:
          setup:
            - "One Establishment in PENDING_INSPECTION with a PASSED PREOPENING inspection, so only the role check can fail."
          setup_api_calls:
            - call: "POST /body-art/establishments"
              payload: { name: "Role Gate Ink", street_address: "48 Fortyeighth St", county_code: "ADA", establishment_type: "TATTOO" }
              as: HealthOfficer
              as_user_id: "officer-ho-1"
              captures: { est_id: $.data.id }
            - call: "POST /body-art/plan-reviews"
              payload: { establishment_id: "${est_id}", floor_plan_reference: "FP-RG", sterilization_area_sqft: 60, procedure_station_count: 2, has_handwash_sink: true }
              as: EstablishmentOperator
              as_user_id: "${est_id}"
              captures: { pr_id: $.data.id }
            - call: "POST /body-art/plan-reviews/${pr_id}/decision"
              payload: { decision: "APPROVE", decision_notes: "Approved" }
              as: PlanReviewer
              as_user_id: "reviewer-1"
            - call: "POST /body-art/inspections"
              payload: { establishment_id: "${est_id}", inspection_type: "PREOPENING", scheduled_start_at: "2026-05-01T00:00:00Z", scheduled_end_at: "2026-05-01T02:00:00Z" }
              as: Inspector
              as_user_id: "officer-insp-1"
              captures: { ins_pre_id: $.data.id }
            - call: "POST /body-art/inspections/${ins_pre_id}/start"
              payload: {}
              as: Inspector
              as_user_id: "officer-insp-1"
            - call: "POST /body-art/inspections/${ins_pre_id}/finalize"
              payload: {}
              as: Inspector
              as_user_id: "officer-insp-1"
          trigger:
            - call: "POST /body-art/establishments/${est_id}/activate"
              payload: {}
              as: Inspector
              as_user_id: "officer-insp-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 403"
            - "${err} == ERR_UNAUTHORIZED"
            - "Establishment.${est_id}.permit_status == PENDING_INSPECTION"
            - "Establishment.${est_id}.permit_issued_on == null"

      - name: public_user_cannot_read_departmental_records
        claim_type: peer_roles
        grounds:
          - validations[priority=2]
          - errors[ERR_UNAUTHORIZED]
          - roles.PublicUser
        distinguishing_aspect: "PublicUser holds only complaint and infection-report writes; a PublicUser GET on the establishments list returns ERR_UNAUTHORIZED (403) even though the same actor may file a complaint against that establishment."
        test_recipe:
          setup:
            - "One Establishment exists."
          setup_api_calls:
            - call: "POST /body-art/establishments"
              payload: { name: "Public Gate Ink", street_address: "49 Fortyninth St", county_code: "ADA", establishment_type: "TATTOO" }
              as: HealthOfficer
              as_user_id: "officer-ho-1"
              captures: { est_id: $.data.id }
          trigger:
            - call: "GET /body-art/establishments"
              payload: {}
              as: PublicUser
              as_user_id: "citizen-8"
              captures: { err: $.data.error_id }
            - call: "POST /body-art/complaints"
              payload: { establishment_id: "${est_id}", complainant_contact: "pub@example.com", category: "SANITATION", narrative: "Concerned about cleanliness." }
              as: PublicUser
              as_user_id: "citizen-8"
              captures: { cmp_id: $.data.id }
          assert:
            - "the list read returns HTTP 403 and ${err} == ERR_UNAUTHORIZED"
            - "the complaint create returns HTTP 201"
            - "Complaint.${cmp_id}.status == RECEIVED"

      - name: operator_cannot_file_plan_review_for_another_establishment
        claim_type: peer_roles
        grounds:
          - validations[priority=6]
          - errors[ERR_NOT_RESOURCE_OWNER]
          - roles.EstablishmentOperator
        distinguishing_aspect: "EstablishmentOperator is entity_backed:Establishment, so X-User-ID must equal the establishment_id in the body; operator B submitting plans for establishment A returns ERR_NOT_RESOURCE_OWNER (403) even though both ids resolve."
        test_recipe:
          setup:
            - "Two Establishments, A and B, both in PENDING_PLAN_REVIEW."
          setup_api_calls:
            - call: "POST /body-art/establishments"
              payload: { name: "Owner A", street_address: "50 Fiftieth St", county_code: "ADA", establishment_type: "TATTOO" }
              as: HealthOfficer
