            - call: "POST /reroof/work-windows"
              payload: { project_id: "${p1}", party_id: "${roofer_id}", trade: "ROOFING", start_utc: "2026-08-01T00:00:00Z", end_utc: "2026-08-01T08:00:00Z" }
              as: ProjectCoordinator
