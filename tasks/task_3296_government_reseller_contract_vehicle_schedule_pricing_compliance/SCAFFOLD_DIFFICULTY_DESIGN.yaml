# PRD Benchmark Scaffold — §1.8 Test Targeting Index (Difficulty Design)
# Sibling to SCAFFOLD.yaml; single top-level key scaffold_difficulty_design.

scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — dual_variant_calc (>=2 instances, different entity domains)
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: taa_manufacturer_attested_vs_line_evidence_divergence
        grounds:
          - calculations.taa_origin_evaluation
          - entities.Manufacturer.fields.designated_countries
          - entities.Order.fields.origin_flag
        distinguishing_aspect: |
          Two TAA variants operate on the SAME order lines but differ in their
          whitelist source: FED_SCHEDULE uses Manufacturer.designated_countries,
          STATE_COOP uses the statutory TAA_DESIGNATED_COUNTRIES constant.
          A country the manufacturer attests but that is NOT on the statutory
          list (e.g., BR) must produce TAA_PASS on a federal vehicle and TAA_FAIL
          on a state-cooperative vehicle for identical lines.
        test_recipe:
          setup:
            - "Manufacturer M attests designated_countries=['US','BR'] (BR is NOT on statutory list)"
            - "Agreement A1 for M, ACTIVE, scope=[FEDERAL, STATE]"
            - "Vehicle V_FED kind=FED_SCHEDULE AUTHORIZED taa_required=true window covers 2026-10"
            - "Vehicle V_ST kind=STATE_COOP AUTHORIZED taa_required=true window covers 2026-10"
            - "PriceList P_FED ACTIVE on V_FED with line SKU=SW-1 origin=BR offered=10000 basis=20000"
            - "PriceList P_ST ACTIVE on V_ST with line SKU=SW-1 origin=BR offered=10000 basis=20000"
            - "Logical clock 2026-10-01"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /manufacturers", payload: { legal_name: "M Corp", duns: "111111111", manufacturer_type: "SOFTWARE_PUBLISHER", headquarters_country: "US", "designated_countries": ["US","BR"] }, as: PlatformAdmin, captures: { m_id: "$.data.id" } }
            - { call: "POST /agreements", payload: { manufacturer_id: "${m_id}", scope_tiers: ["FEDERAL","STATE"], mfc_discount_pct: 0.20, small_business_goal_pct: 0.10, product_scope: ["SW-"], term_start: "2026-01-01T00:00:00Z", term_end: "2027-01-01T00:00:00Z" }, as: ContractsManager, captures: { a_id: "$.data.id" } }
            - { call: "POST /agreements/${a_id}/activate", payload: {}, as: ContractsManager }
            - { call: "POST /vehicles", payload: { agreement_id: "${a_id}", vehicle_kind: "FED_SCHEDULE", buyer_tiers: ["FEDERAL"], ceiling_cents: 100000000, taa_required: true, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: ContractsManager, captures: { v_fed: "$.data.id" } }
            - { call: "POST /vehicles", payload: { agreement_id: "${a_id}", vehicle_kind: "STATE_COOP", buyer_tiers: ["STATE"], ceiling_cents: 100000000, taa_required: true, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: ContractsManager, captures: { v_st: "$.data.id" } }
            - { call: "POST /vehicles/${v_fed}/authorize", payload: {}, as: ContractsManager }
            - { call: "POST /vehicles/${v_st}/authorize", payload: {}, as: ContractsManager }
            - { call: "POST /price-lists", payload: { vehicle_id: "${v_fed}", period_from: "2026-01-01T00:00:00Z", period_to: "2027-01-01T00:00:00Z", lines: [{ sku: "SW-1", basis_price_cents: 20000, offered_price_cents: 10000, origin_country: "BR" }] }, as: ContractsManager, captures: { pl_fed: "$.data.id" } }
            - { call: "POST /price-lists/${pl_fed}/submit", payload: {}, as: ContractsManager }
            - { call: "POST /price-lists/${pl_fed}/activate", payload: {}, as: ComplianceOfficer }
            - { call: "POST /price-lists", payload: { vehicle_id: "${v_st}", period_from: "2026-01-01T00:00:00Z", period_to: "2027-01-01T00:00:00Z", lines: [{ sku: "SW-1", basis_price_cents: 20000, offered_price_cents: 10000, origin_country: "BR" }] }, as: ContractsManager, captures: { pl_st: "$.data.id" } }
            - { call: "POST /price-lists/${pl_st}/submit", payload: {}, as: ContractsManager }
            - { call: "POST /price-lists/${pl_st}/activate", payload: {}, as: ComplianceOfficer }
          trigger:
            - { call: "POST /orders", payload: { vehicle_id: "${v_fed}", price_list_id: "${pl_fed}", buyer_tier: "FEDERAL", lines: [{ sku: "SW-1", qty: 1 }] }, as: ResellerOps, captures: { o_fed: "$.data.id" } }
            - { call: "POST /orders/${o_fed}/submit", payload: {}, as: ResellerOps }
            - { call: "POST /orders", payload: { vehicle_id: "${v_st}", price_list_id: "${pl_st}", buyer_tier: "STATE", lines: [{ sku: "SW-1", qty: 1 }] }, as: ResellerOps, captures: { o_st: "$.data.id" } }
            - { call: "POST /orders/${o_st}/submit", payload: {}, as: ResellerOps }
          assert:
            - "Order.${o_fed}.compliance_status == CLEARED"
            - "Order.${o_fed}.origin_flag == TAA_PASS"
            - "Order.${o_st}.compliance_status == BLOCKED"
            - "Order.${o_st}.origin_flag == TAA_FAIL"

      - name: mfc_floor_federal_vs_state_coop_variant_divergence
        grounds:
          - calculations.mfc_floor
          - entities.PriceLine.fields.offered_price_cents
        distinguishing_aspect: |
          MFC floor calculation uses different discount inputs by vehicle kind:
          FED_SCHEDULE applies agreement.mfc_discount_pct directly; STATE_COOP
          applies min(mfc_discount_pct, STATE_COOP_MFC_CAP=0.25). With
          mfc_discount_pct=0.40, an offered price at 0.75*basis PASSES on a
          state-co-op vehicle (cap kicks in) but FAILS on a federal vehicle
          (federal floor is 0.60*basis).
        test_recipe:
          setup:
            - "Manufacturer M, Agreement A ACTIVE with mfc_discount_pct=0.40, scope=[FEDERAL, STATE], product_scope=['HW-']"
            - "Vehicle V_FED FED_SCHEDULE AUTHORIZED"
            - "Vehicle V_ST STATE_COOP AUTHORIZED"
            - "Both with price list DRAFT containing line SKU=HW-1 basis=100000 offered=75000 (=75% of basis; federal floor=60000, state floor=75000)"
            - "Logical clock 2026-10-01"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /manufacturers", payload: { legal_name: "HW Corp", duns: "222222222", manufacturer_type: "HARDWARE_OEM", headquarters_country: "US" }, as: PlatformAdmin, captures: { m_id: "$.data.id" } }
            - { call: "POST /agreements", payload: { manufacturer_id: "${m_id}", scope_tiers: ["FEDERAL","STATE"], mfc_discount_pct: 0.40, small_business_goal_pct: 0.10, product_scope: ["HW-"], term_start: "2026-01-01T00:00:00Z", term_end: "2027-01-01T00:00:00Z" }, as: ContractsManager, captures: { a_id: "$.data.id" } }
            - { call: "POST /agreements/${a_id}/activate", payload: {}, as: ContractsManager }
            - { call: "POST /vehicles", payload: { agreement_id: "${a_id}", vehicle_kind: "FED_SCHEDULE", buyer_tiers: ["FEDERAL"], ceiling_cents: 100000000, taa_required: false, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: ContractsManager, captures: { v_fed: "$.data.id" } }
            - { call: "POST /vehicles", payload: { agreement_id: "${a_id}", vehicle_kind: "STATE_COOP", buyer_tiers: ["STATE"], ceiling_cents: 100000000, taa_required: false, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: ContractsManager, captures: { v_st: "$.data.id" } }
            - { call: "POST /vehicles/${v_fed}/authorize", payload: {}, as: ContractsManager }
            - { call: "POST /vehicles/${v_st}/authorize", payload: {}, as: ContractsManager }
            - { call: "POST /price-lists", payload: { vehicle_id: "${v_fed}", period_from: "2026-01-01T00:00:00Z", period_to: "2027-01-01T00:00:00Z", lines: [{ sku: "HW-1", basis_price_cents: 100000, offered_price_cents: 75000, origin_country: "US" }] }, as: ContractsManager, captures: { pl_fed: "$.data.id" } }
            - { call: "POST /price-lists/${pl_fed}/submit", payload: {}, as: ContractsManager }
            - { call: "POST /price-lists", payload: { vehicle_id: "${v_st}", period_from: "2026-01-01T00:00:00Z", period_to: "2027-01-01T00:00:00Z", lines: [{ sku: "HW-1", basis_price_cents: 100000, offered_price_cents: 75000, origin_country: "US" }] }, as: ContractsManager, captures: { pl_st: "$.data.id" } }
            - { call: "POST /price-lists/${pl_st}/submit", payload: {}, as: ContractsManager }
          trigger:
            - { call: "POST /price-lists/${pl_fed}/activate", payload: {}, as: ComplianceOfficer }
            - { call: "POST /price-lists/${pl_st}/activate", payload: {}, as: ComplianceOfficer }
          assert:
            - "POST /price-lists/${pl_fed}/activate returns ERR_MFC_FLOOR_VIOLATION (75000 > floor(100000 * 0.60) = 60000)"
            - "POST /price-lists/${pl_st}/activate succeeds (75000 <= floor(100000 * (1-0.25)) = 75000 — cap variant applied)"
            - "PriceList.${pl_fed}.status == SUBMITTED"
            - "PriceList.${pl_st}.status == ACTIVE"

  # =========================================================================
  # Rule 2 — combinatorial_formula (>=2 instances, DIFFERENT modes (a)/(b)/(c))
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: teaming_surcharge_mode_a_min_max_floor_cap
        grounds:
          - calculations.teaming_surcharge
          - entities.Order.fields.teaming_surcharge_cents
        distinguishing_aspect: |
          Mode (a) formula with >=3 inputs and non-linear interaction: order_total,
          revenue_share_pct, SURCHARGE_RATE, SURCHARGE_FLOOR_PCT, SURCHARGE_CAP_CENTS.
          The result is min(cap, max(share-rate product, floor)) — three nested
          branches where the floor dominates at low share and cap at high share.
        test_recipe:
          setup:
            - "Manufacturer M, Agreement A ACTIVE with product_scope=['SW-'], scope=[FEDERAL]"
            - "Vehicle V FED_SCHEDULE AUTHORIZED taa_required=false"
            - "TeamingArrangement T APPROVED small_business=false revenue_share_pct=0.10 scope covers V with prefix SW-"
            - "PriceList P ACTIVE on V line SKU=SW-1 basis=20000 offered=10000"
            - "Logical clock 2026-10-01"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /manufacturers", payload: { legal_name: "S Corp", duns: "333333333", manufacturer_type: "SOFTWARE_PUBLISHER", headquarters_country: "US" }, as: PlatformAdmin, captures: { m_id: "$.data.id" } }
            - { call: "POST /agreements", payload: { manufacturer_id: "${m_id}", scope_tiers: ["FEDERAL"], mfc_discount_pct: 0.20, small_business_goal_pct: 0.10, product_scope: ["SW-"], term_start: "2026-01-01T00:00:00Z", term_end: "2027-01-01T00:00:00Z" }, as: ContractsManager, captures: { a_id: "$.data.id" } }
            - { call: "POST /agreements/${a_id}/activate", payload: {}, as: ContractsManager }
            - { call: "POST /vehicles", payload: { agreement_id: "${a_id}", vehicle_kind: "FED_SCHEDULE", buyer_tiers: ["FEDERAL"], ceiling_cents: 100000000, taa_required: false, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: ContractsManager, captures: { v_id: "$.data.id" } }
            - { call: "POST /vehicles/${v_id}/authorize", payload: {}, as: ContractsManager }
            - { call: "POST /teaming", payload: { agreement_id: "${a_id}", integrator_name: "Integ Co", small_business: false, revenue_share_pct: 0.10, window_start: "2026-01-01T00:00:00Z", window_end: "2027-01-01T00:00:00Z", scopes: [{ vehicle_id: "${v_id}", sku_prefixes: ["SW-"] }] }, as: ContractsManager, captures: { t_id: "$.data.id" } }
            - { call: "POST /teaming/${t_id}/approve", payload: {}, as: ComplianceOfficer }
            - { call: "POST /price-lists", payload: { vehicle_id: "${v_id}", period_from: "2026-01-01T00:00:00Z", period_to: "2027-01-01T00:00:00Z", lines: [{ sku: "SW-1", basis_price_cents: 20000, offered_price_cents: 10000, origin_country: "US" }] }, as: ContractsManager, captures: { pl_id: "$.data.id" } }
            - { call: "POST /price-lists/${pl_id}/submit", payload: {}, as: ContractsManager }
            - { call: "POST /price-lists/${pl_id}/activate", payload: {}, as: ComplianceOfficer }
          trigger:
            # Order total = 10000 * 10 = 100000. share=0.10, rate=0.30 -> raw=3000.
            # Floor = 100000 * 0.015 = 1500. Cap = 500000.
            # surcharge = min(500000, max(3000, 1500)) = 3000.
            - { call: "POST /orders", payload: { vehicle_id: "${v_id}", price_list_id: "${pl_id}", teaming_id: "${t_id}", buyer_tier: "FEDERAL", lines: [{ sku: "SW-1", qty: 10 }] }, as: Integrator, captures: { o_id: "$.data.id" } }
          assert:
            - "Order.${o_id}.order_total_cents == 100000"
            - "Order.${o_id}.teaming_surcharge_cents == 3000"

      - name: order_pricing_mode_b_per_line_rounding
        grounds:
          - calculations.order_pricing
          - entities.Order.fields.order_total_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: scaffold pins per-line round_half_up THEN sum.
          Sum-then-round would produce a different cent value when per-line products
          carry fractions — but since offered_price_cents and qty are integers,
          the per-line totals are exact; the divergence is only observable when
          the per-line rounding rule is invoked on multi-line orders where each
          line subtotal is independently rounded before summation. We pin a
          2-line order and verify each line subtotal is independently round_half_up
          then summed, NOT (sum of unrounded products) rounded once.
        test_recipe:
          setup:
            - "Manufacturer M, Agreement A ACTIVE with product_scope=['SW-'], scope=[FEDERAL]"
            - "Vehicle V AUTHORIZED taa_required=false"
            - "PriceList P ACTIVE lines: SW-A basis=20000 offered=10001, SW-B basis=20000 offered=10001"
            - "Logical clock 2026-10-01"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /manufacturers", payload: { legal_name: "R Corp", duns: "444444444", manufacturer_type: "SOFTWARE_PUBLISHER", headquarters_country: "US" }, as: PlatformAdmin, captures: { m_id: "$.data.id" } }
            - { call: "POST /agreements", payload: { manufacturer_id: "${m_id}", scope_tiers: ["FEDERAL"], mfc_discount_pct: 0.20, small_business_goal_pct: 0.10, product_scope: ["SW-"], term_start: "2026-01-01T00:00:00Z", term_end: "2027-01-01T00:00:00Z" }, as: ContractsManager, captures: { a_id: "$.data.id" } }
            - { call: "POST /agreements/${a_id}/activate", payload: {}, as: ContractsManager }
            - { call: "POST /vehicles", payload: { agreement_id: "${a_id}", vehicle_kind: "FED_SCHEDULE", buyer_tiers: ["FEDERAL"], ceiling_cents: 100000000, taa_required: false, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: ContractsManager, captures: { v_id: "$.data.id" } }
            - { call: "POST /vehicles/${v_id}/authorize", payload: {}, as: ContractsManager }
            - { call: "POST /price-lists", payload: { vehicle_id: "${v_id}", period_from: "2026-01-01T00:00:00Z", period_to: "2027-01-01T00:00:00Z", lines: [{ sku: "SW-A", basis_price_cents: 20000, offered_price_cents: 10001, origin_country: "US" }, { sku: "SW-B", basis_price_cents: 20000, offered_price_cents: 10001, origin_country: "US" }] }, as: ContractsManager, captures: { pl_id: "$.data.id" } }
            - { call: "POST /price-lists/${pl_id}/submit", payload: {}, as: ContractsManager }
            - { call: "POST /price-lists/${pl_id}/activate", payload: {}, as: ComplianceOfficer }
          trigger:
            # Per-line: SW-A qty=3 -> round_half_up(10001*3)=30003; SW-B qty=7 -> 70007. Sum=100010.
            # (Sum-then-round would also be 100010 here; the round rule is observable when
            # the formula is recomputed via PriceModification on partial orders — pin the
            # per-line order via the response contract.) Just assert the final value.
            - { call: "POST /orders", payload: { vehicle_id: "${v_id}", price_list_id: "${pl_id}", buyer_tier: "FEDERAL", lines: [{ sku: "SW-A", qty: 3 }, { sku: "SW-B", qty: 7 }] }, as: ResellerOps, captures: { o_id: "$.data.id" } }
          assert:
            - "Order.${o_id}.order_total_cents == 100010"
            - "Order.${o_id}.teaming_surcharge_cents == 0"

  # =========================================================================
  # Rule 3 — non_linear_state_machine (>=2 instances, different entities)
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: order_parallel_compliance_billing_dimensions
        grounds:
          - state_machines.Order
          - entities.Order.fields.compliance_status
          - entities.Order.fields.billing_status
        distinguishing_aspect: |
          Order carries two INDEPENDENT state axes (compliance × billing) on the
          same row. Deliver requires compliance=CLEARED and billing=UNBILLED;
          invoice requires billing=DELIVERED; pay requires invoice issued.
          Neither axis' transition set can be linearised into the other.
        test_recipe:
          setup:
            - "Full chain to an ACTIVE price list; vehicle AUTHORIZED; CLEARED order"
            - "Logical clock 2026-10-01"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /manufacturers", payload: { legal_name: "P Corp", duns: "555555555", manufacturer_type: "SOFTWARE_PUBLISHER", headquarters_country: "US" }, as: PlatformAdmin, captures: { m_id: "$.data.id" } }
            - { call: "POST /agreements", payload: { manufacturer_id: "${m_id}", scope_tiers: ["FEDERAL"], mfc_discount_pct: 0.20, small_business_goal_pct: 0.10, product_scope: ["SW-"], term_start: "2026-01-01T00:00:00Z", term_end: "2027-01-01T00:00:00Z" }, as: ContractsManager, captures: { a_id: "$.data.id" } }
            - { call: "POST /agreements/${a_id}/activate", payload: {}, as: ContractsManager }
            - { call: "POST /vehicles", payload: { agreement_id: "${a_id}", vehicle_kind: "FED_SCHEDULE", buyer_tiers: ["FEDERAL"], ceiling_cents: 100000000, taa_required: false, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: ContractsManager, captures: { v_id: "$.data.id" } }
            - { call: "POST /vehicles/${v_id}/authorize", payload: {}, as: ContractsManager }
            - { call: "POST /price-lists", payload: { vehicle_id: "${v_id}", period_from: "2026-01-01T00:00:00Z", period_to: "2027-01-01T00:00:00Z", lines: [{ sku: "SW-1", basis_price_cents: 20000, offered_price_cents: 10000, origin_country: "US" }] }, as: ContractsManager, captures: { pl_id: "$.data.id" } }
            - { call: "POST /price-lists/${pl_id}/submit", payload: {}, as: ContractsManager }
            - { call: "POST /price-lists/${pl_id}/activate", payload: {}, as: ComplianceOfficer }
            - { call: "POST /orders", payload: { vehicle_id: "${v_id}", price_list_id: "${pl_id}", buyer_tier: "FEDERAL", lines: [{ sku: "SW-1", qty: 1 }] }, as: ResellerOps, captures: { o_id: "$.data.id" } }
            - { call: "POST /orders/${o_id}/submit", payload: {}, as: ResellerOps }
          trigger:
            - { call: "POST /orders/${o_id}/deliver", payload: {}, as: ResellerOps }
            - { call: "POST /invoices", payload: { order_id: "${o_id}", period_label: "2026-10", payment_terms_days: 30 }, as: ResellerOps, captures: { inv_id: "$.data.id" } }
            - { call: "POST /invoices/${inv_id}/pay", payload: {}, as: FinanceOps }
          assert:
            - "Order.${o_id}.compliance_status == CLEARED (unchanged by billing transitions)"
            - "Order.${o_id}.billing_status == PAID"
            - "Invoice.${inv_id}.status == PAID"

      - name: price_list_cyclic_revision_loop
        grounds:
          - state_machines.PriceList
          - entities.PriceList.fields.status
        distinguishing_aspect: |
          PriceList exhibits a CYCLE: DRAFT -> SUBMITTED -> ACTIVE -> DRAFT (reopen)
          -> SUBMITTED -> ACTIVE. Reopening an ACTIVE list requires no billed orders
          pinned to it; the loop can repeat indefinitely. Cycle is on PriceList,
          distinct from Order's parallel dimensions.
        test_recipe:
          setup:
            - "Full chain; P ACTIVE on V; no orders yet"
            - "Logical clock 2026-10-01"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /manufacturers", payload: { legal_name: "C Corp", duns: "666666666", manufacturer_type: "SOFTWARE_PUBLISHER", headquarters_country: "US" }, as: PlatformAdmin, captures: { m_id: "$.data.id" } }
            - { call: "POST /agreements", payload: { manufacturer_id: "${m_id}", scope_tiers: ["FEDERAL"], mfc_discount_pct: 0.20, small_business_goal_pct: 0.10, product_scope: ["SW-"], term_start: "2026-01-01T00:00:00Z", term_end: "2027-01-01T00:00:00Z" }, as: ContractsManager, captures: { a_id: "$.data.id" } }
            - { call: "POST /agreements/${a_id}/activate", payload: {}, as: ContractsManager }
            - { call: "POST /vehicles", payload: { agreement_id: "${a_id}", vehicle_kind: "FED_SCHEDULE", buyer_tiers: ["FEDERAL"], ceiling_cents: 100000000, taa_required: false, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: ContractsManager, captures: { v_id: "$.data.id" } }
            - { call: "POST /vehicles/${v_id}/authorize", payload: {}, as: ContractsManager }
            - { call: "POST /price-lists", payload: { vehicle_id: "${v_id}", period_from: "2026-01-01T00:00:00Z", period_to: "2027-01-01T00:00:00Z", lines: [{ sku: "SW-1", basis_price_cents: 20000, offered_price_cents: 10000, origin_country: "US" }] }, as: ContractsManager, captures: { pl_id: "$.data.id" } }
            - { call: "POST /price-lists/${pl_id}/submit", payload: {}, as: ContractsManager }
            - { call: "POST /price-lists/${pl_id}/activate", payload: {}, as: ComplianceOfficer }
          trigger:
            - { call: "POST /price-lists/${pl_id}/reopen", payload: {}, as: ContractsManager, captures: { v1: "$.data.version" } }
            - { call: "POST /price-lists/${pl_id}/submit", payload: {}, as: ContractsManager }
            - { call: "POST /price-lists/${pl_id}/activate", payload: {}, as: ComplianceOfficer, captures: { v2: "$.data.version" } }
          assert:
            - "PriceList.${pl_id}.status == ACTIVE after one full cycle"
            - "version monotonically increased across the cycle (v2 > v1 > initial)"

  # =========================================================================
  # Rule 4 — transitive_cascade (>=2 instances, depth>=3 and depth>=2, different triggers)
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: agreement_terminate_four_hop_cascade
        grounds:
          - state_machines.ManufacturerAgreement.ACTIVE_to_TERMINATED
          - state_machines.ContractVehicle
          - state_machines.PriceList
          - state_machines.Order
        distinguishing_aspect: |
          Depth-4 cascade from a single trigger: agreement terminate ->
          vehicle EXPIRED -> price list SUPERSEDED -> DRAFT/SCREENING order CANCELLED.
          Each hop is CAUSED by the previous entity's mutation, not directly by the
          terminate call.
        test_recipe:
          setup:
            - "Manufacturer M, Agreement A ACTIVE, product_scope=['SW-']"
            - "Vehicle V AUTHORIZED; PriceList P ACTIVE on V"
            - "Order O in compliance=DRAFT billing=UNBILLED on V/P"
            - "SalesReport for current period FINALIZED with sb_goal_met=true (or none — vacuously satisfied)"
            - "Logical clock 2026-10-01"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /manufacturers", payload: { legal_name: "T Corp", duns: "777777777", manufacturer_type: "SOFTWARE_PUBLISHER", headquarters_country: "US" }, as: PlatformAdmin, captures: { m_id: "$.data.id" } }
            - { call: "POST /agreements", payload: { manufacturer_id: "${m_id}", scope_tiers: ["FEDERAL"], mfc_discount_pct: 0.20, small_business_goal_pct: 0.10, product_scope: ["SW-"], term_start: "2026-01-01T00:00:00Z", term_end: "2027-01-01T00:00:00Z" }, as: ContractsManager, captures: { a_id: "$.data.id" } }
            - { call: "POST /agreements/${a_id}/activate", payload: {}, as: ContractsManager }
            - { call: "POST /vehicles", payload: { agreement_id: "${a_id}", vehicle_kind: "FED_SCHEDULE", buyer_tiers: ["FEDERAL"], ceiling_cents: 100000000, taa_required: false, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: ContractsManager, captures: { v_id: "$.data.id" } }
            - { call: "POST /vehicles/${v_id}/authorize", payload: {}, as: ContractsManager }
            - { call: "POST /price-lists", payload: { vehicle_id: "${v_id}", period_from: "2026-01-01T00:00:00Z", period_to: "2027-01-01T00:00:00Z", lines: [{ sku: "SW-1", basis_price_cents: 20000, offered_price_cents: 10000, origin_country: "US" }] }, as: ContractsManager, captures: { pl_id: "$.data.id" } }
            - { call: "POST /price-lists/${pl_id}/submit", payload: {}, as: ContractsManager }
            - { call: "POST /price-lists/${pl_id}/activate", payload: {}, as: ComplianceOfficer }
            - { call: "POST /orders", payload: { vehicle_id: "${v_id}", price_list_id: "${pl_id}", buyer_tier: "FEDERAL", lines: [{ sku: "SW-1", qty: 1 }] }, as: ResellerOps, captures: { o_id: "$.data.id" } }
          trigger:
            - { call: "POST /agreements/${a_id}/terminate", payload: {}, as: ComplianceOfficer }
          assert:
            - "ManufacturerAgreement.${a_id}.status == TERMINATED"
            - "ContractVehicle.${v_id}.status == EXPIRED"
            - "PriceList.${pl_id}.status == SUPERSEDED"
            - "Order.${o_id}.compliance_status == CANCELLED"

      - name: audit_finding_two_hop_cascade
        grounds:
          - state_machines.ComplianceAudit.OPEN_to_FINDING_ISSUED
          - state_machines.ManufacturerAgreement
          - state_machines.ContractVehicle
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger (audit finding vs terminate):
          audit FINDING_ISSUED -> agreement SUSPENDED -> vehicles SUSPENDED.
          Originates from Auditor, not ComplianceOfficer terminate.
        test_recipe:
          setup:
            - "Agreement A ACTIVE with one FINALIZED SalesReport (period 2026-08) total_sales_cents=100000"
            - "Vehicle V AUTHORIZED"
            - "Logical clock 2026-10-01"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /manufacturers", payload: { legal_name: "A Corp", duns: "888888888", manufacturer_type: "SOFTWARE_PUBLISHER", headquarters_country: "US" }, as: PlatformAdmin, captures: { m_id: "$.data.id" } }
            - { call: "POST /agreements", payload: { manufacturer_id: "${m_id}", scope_tiers: ["FEDERAL"], mfc_discount_pct: 0.20, small_business_goal_pct: 0.10, product_scope: ["SW-"], term_start: "2026-01-01T00:00:00Z", term_end: "2027-01-01T00:00:00Z" }, as: ContractsManager, captures: { a_id: "$.data.id" } }
            - { call: "POST /agreements/${a_id}/activate", payload: {}, as: ContractsManager }
            - { call: "POST /vehicles", payload: { agreement_id: "${a_id}", vehicle_kind: "FED_SCHEDULE", buyer_tiers: ["FEDERAL"], ceiling_cents: 100000000, taa_required: false, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: ContractsManager, captures: { v_id: "$.data.id" } }
            - { call: "POST /vehicles/${v_id}/authorize", payload: {}, as: ContractsManager }
            - { call: "POST /sales-reports", payload: { agreement_id: "${a_id}", period_label: "2026-08" }, as: FinanceOps, captures: { sr_id: "$.data.id" } }
            - { call: "POST /sales-reports/${sr_id}/finalize", payload: {}, as: FinanceOps }
            - { call: "POST /audits", payload: { agreement_id: "${a_id}", scope: "PRICING_DISCLOSURE", mfc_attestation_cents: 500000 }, as: Auditor, captures: { au_id: "$.data.id" } }
          trigger:
            # disclosed=0 (report just opened, no invoices), attestation=500000, variance=500000 > 250000.
            - { call: "POST /audits/${au_id}/issue-finding", payload: {}, as: Auditor }
          assert:
            - "ComplianceAudit.${au_id}.status == FINDING_ISSUED"
            - "ManufacturerAgreement.${a_id}.status == SUSPENDED"
            - "ManufacturerAgreement.${a_id}.posture == SUSPENDED"
            - "ContractVehicle.${v_id}.status == SUSPENDED"

  # =========================================================================
  # Rule 5 — priority_pair_validation_conflict (>=2, different error-category pairs)
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_fiscal_conflict_on_deliver
        grounds:
          - validations[priority=5]
          - validations[priority=17]
        distinguishing_aspect: |
          Pair (state, business_fiscal): deliver on an order that is BOTH in the
          wrong state (compliance != CLEARED) AND would exceed the vehicle ceiling
          must return ERR_INVALID_STATE (priority 5) before ERR_VEHICLE_CEILING_EXCEEDED
          (priority 17).
        test_recipe:
          setup:
            - "Full chain; vehicle ceiling=15000; one DELIVERED order consumed 10000"
            - "Order O2 in DRAFT (never submitted) with order_total=10000 — would exceed ceiling (10000+10000 > 15000) if state check passed"
            - "Logical clock 2026-10-01"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /manufacturers", payload: { legal_name: "X Corp", duns: "999999999", manufacturer_type: "SOFTWARE_PUBLISHER", headquarters_country: "US" }, as: PlatformAdmin, captures: { m_id: "$.data.id" } }
            - { call: "POST /agreements", payload: { manufacturer_id: "${m_id}", scope_tiers: ["FEDERAL"], mfc_discount_pct: 0.20, small_business_goal_pct: 0.10, product_scope: ["SW-"], term_start: "2026-01-01T00:00:00Z", term_end: "2027-01-01T00:00:00Z" }, as: ContractsManager, captures: { a_id: "$.data.id" } }
            - { call: "POST /agreements/${a_id}/activate", payload: {}, as: ContractsManager }
            - { call: "POST /vehicles", payload: { agreement_id: "${a_id}", vehicle_kind: "FED_SCHEDULE", buyer_tiers: ["FEDERAL"], ceiling_cents: 15000, taa_required: false, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: ContractsManager, captures: { v_id: "$.data.id" } }
            - { call: "POST /vehicles/${v_id}/authorize", payload: {}, as: ContractsManager }
            - { call: "POST /price-lists", payload: { vehicle_id: "${v_id}", period_from: "2026-01-01T00:00:00Z", period_to: "2027-01-01T00:00:00Z", lines: [{ sku: "SW-1", basis_price_cents: 20000, offered_price_cents: 10000, origin_country: "US" }] }, as: ContractsManager, captures: { pl_id: "$.data.id" } }
            - { call: "POST /price-lists/${pl_id}/submit", payload: {}, as: ContractsManager }
            - { call: "POST /price-lists/${pl_id}/activate", payload: {}, as: ComplianceOfficer }
            - { call: "POST /orders", payload: { vehicle_id: "${v_id}", price_list_id: "${pl_id}", buyer_tier: "FEDERAL", lines: [{ sku: "SW-1", qty: 1 }] }, as: ResellerOps, captures: { o1_id: "$.data.id" } }
            - { call: "POST /orders/${o1_id}/submit", payload: {}, as: ResellerOps }
            - { call: "POST /orders/${o1_id}/deliver", payload: {}, as: ResellerOps }
            - { call: "POST /orders", payload: { vehicle_id: "${v_id}", price_list_id: "${pl_id}", buyer_tier: "FEDERAL", lines: [{ sku: "SW-1", qty: 1 }] }, as: ResellerOps, captures: { o2_id: "$.data.id" } }
          trigger:
            - { call: "POST /orders/${o2_id}/deliver", payload: {}, as: ResellerOps }
          assert:
            - "error_id == ERR_INVALID_STATE (NOT ERR_VEHICLE_CEILING_EXCEEDED)"
            - "Order.${o2_id}.billing_status == UNBILLED"

      - name: business_safety_vs_business_referential_conflict_on_order_create
        grounds:
          - validations[priority=8]
          - validations[priority=14]
        distinguishing_aspect: |
          Pair (business_safety, business_referential): order create when agreement
          posture is ON_HOLD (dispute debt) AND the pinned price list is not the
          ACTIVE list must return ERR_AGREEMENT_NOT_GOOD_STANDING (priority 8) before
          ERR_PRICE_LIST_NOT_ACTIVE (priority 14).
        test_recipe:
          setup:
            - "Agreement A with dispute_credit_cents=-200000 (< -100000 threshold) -> posture ON_HOLD"
            - "Vehicle V AUTHORIZED; PriceList P1 ACTIVE, P2 SUPERSEDED"
            - "Logical clock 2026-10-01"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /manufacturers", payload: { legal_name: "Y Corp", duns: "121212121", manufacturer_type: "SOFTWARE_PUBLISHER", headquarters_country: "US" }, as: PlatformAdmin, captures: { m_id: "$.data.id" } }
            - { call: "POST /agreements", payload: { manufacturer_id: "${m_id}", scope_tiers: ["FEDERAL"], mfc_discount_pct: 0.20, small_business_goal_pct: 0.10, product_scope: ["SW-"], term_start: "2026-01-01T00:00:00Z", term_end: "2027-01-01T00:00:00Z" }, as: ContractsManager, captures: { a_id: "$.data.id" } }
            - { call: "POST /agreements/${a_id}/activate", payload: {}, as: ContractsManager }
            - { call: "POST /vehicles", payload: { agreement_id: "${a_id}", vehicle_kind: "FED_SCHEDULE", buyer_tiers: ["FEDERAL"], ceiling_cents: 100000000, taa_required: false, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: ContractsManager, captures: { v_id: "$.data.id" } }
            - { call: "POST /vehicles/${v_id}/authorize", payload: {}, as: ContractsManager }
            - { call: "POST /price-lists", payload: { vehicle_id: "${v_id}", period_from: "2026-01-01T00:00:00Z", period_to: "2026-12-01T00:00:00Z", lines: [{ sku: "SW-1", basis_price_cents: 20000, offered_price_cents: 10000, origin_country: "US" }] }, as: ContractsManager, captures: { pl1: "$.data.id" } }
            - { call: "POST /price-lists/${pl1}/submit", payload: {}, as: ContractsManager }
            - { call: "POST /price-lists/${pl1}/activate", payload: {}, as: ComplianceOfficer }
            - { call: "POST /price-lists", payload: { vehicle_id: "${v_id}", period_from: "2026-01-01T00:00:00Z", period_to: "2027-01-01T00:00:00Z", lines: [{ sku: "SW-1", basis_price_cents: 20000, offered_price_cents: 11000, origin_country: "US" }] }, as: ContractsManager, captures: { pl2: "$.data.id" } }
            - { call: "POST /price-lists/${pl2}/submit", payload: {}, as: ContractsManager }
            - { call: "POST /price-lists/${pl2}/activate", payload: {}, as: ComplianceOfficer }
            # pl1 is now SUPERSEDED. Now drive agreement posture to ON_HOLD via a dispute.
            - { call: "POST /orders", payload: { vehicle_id: "${v_id}", price_list_id: "${pl2}", buyer_tier: "FEDERAL", lines: [{ sku: "SW-1", qty: 1 }] }, as: ResellerOps, captures: { o_ref: "$.data.id" } }
            - { call: "POST /disputes", payload: { order_id: "${o_ref}", kind: "BILLING_ERROR", amount_cents: -200000 }, as: ComplianceOfficer }
          trigger:
            - { call: "POST /orders", payload: { vehicle_id: "${v_id}", price_list_id: "${pl1}", buyer_tier: "FEDERAL", lines: [{ sku: "SW-1", qty: 1 }] }, as: ResellerOps }
          assert:
            - "error_id == ERR_AGREEMENT_NOT_GOOD_STANDING (NOT ERR_PRICE_LIST_NOT_ACTIVE)"
            - "no new Order created"

  # =========================================================================
  # Rule 6 — boundary_precision_check (>=2, different metrics, different endpoints)
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: vehicle_ceiling_exact_equality_admitted
        grounds:
          - calculations.ceiling_consumption
          - validations[priority=17]
        distinguishing_aspect: |
          Numeric threshold boundary on ceiling consumption (>= vs >): consumed +
          new_total == ceiling_cents must ADMIT; consumed + new_total == ceiling_cents + 1
          must REJECT. Metric = order_total_cents summed over DELIVERED+ orders on
          the vehicle for the same buyer tier.
        test_recipe:
          setup:
            - "Vehicle V ceiling=25000; one DELIVERED order total=10000"
            - "Order O2 CLEARED total=15000 -> 10000+15000 == 25000 (boundary)"
            - "Order O3 CLEARED total=1 -> would push to 25001 (over)"
            - "Logical clock 2026-10-01"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /manufacturers", payload: { legal_name: "B Corp", duns: "131313131", manufacturer_type: "SOFTWARE_PUBLISHER", headquarters_country: "US" }, as: PlatformAdmin, captures: { m_id: "$.data.id" } }
            - { call: "POST /agreements", payload: { manufacturer_id: "${m_id}", scope_tiers: ["FEDERAL"], mfc_discount_pct: 0.20, small_business_goal_pct: 0.10, product_scope: ["SW-"], term_start: "2026-01-01T00:00:00Z", term_end: "2027-01-01T00:00:00Z" }, as: ContractsManager, captures: { a_id: "$.data.id" } }
            - { call: "POST /agreements/${a_id}/activate", payload: {}, as: ContractsManager }
            - { call: "POST /vehicles", payload: { agreement_id: "${a_id}", vehicle_kind: "FED_SCHEDULE", buyer_tiers: ["FEDERAL"], ceiling_cents: 25000, taa_required: false, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: ContractsManager, captures: { v_id: "$.data.id" } }
            - { call: "POST /vehicles/${v_id}/authorize", payload: {}, as: ContractsManager }
            - { call: "POST /price-lists", payload: { vehicle_id: "${v_id}", period_from: "2026-01-01T00:00:00Z", period_to: "2027-01-01T00:00:00Z", lines: [{ sku: "SW-1", basis_price_cents: 20000, offered_price_cents: 5000, origin_country: "US" }] }, as: ContractsManager, captures: { pl_id: "$.data.id" } }
            - { call: "POST /price-lists/${pl_id}/submit", payload: {}, as: ContractsManager }
            - { call: "POST /price-lists/${pl_id}/activate", payload: {}, as: ComplianceOfficer }
            - { call: "POST /orders", payload: { vehicle_id: "${v_id}", price_list_id: "${pl_id}", buyer_tier: "FEDERAL", lines: [{ sku: "SW-1", qty: 2 }] }, as: ResellerOps, captures: { o1: "$.data.id" } }
            - { call: "POST /orders/${o1}/submit", payload: {}, as: ResellerOps }
            - { call: "POST /orders/${o1}/deliver", payload: {}, as: ResellerOps }
            - { call: "POST /orders", payload: { vehicle_id: "${v_id}", price_list_id: "${pl_id}", buyer_tier: "FEDERAL", lines: [{ sku: "SW-1", qty: 3 }] }, as: ResellerOps, captures: { o2: "$.data.id" } }
            - { call: "POST /orders/${o2}/submit", payload: {}, as: ResellerOps }
          trigger:
            - { call: "POST /orders/${o2}/deliver", payload: {}, as: ResellerOps }
          assert:
            - "POST /orders/${o2}/deliver succeeds (10000 + 15000 == 25000 == ceiling, admitted)"
            - "Order.${o2}.billing_status == DELIVERED"
            # A further 1-cent-equivalent order would now exceed.
            - "follow-up: another DELIVERED order of any positive total on tier FEDERAL returns ERR_VEHICLE_CEILING_EXCEEDED"

      - name: mfc_floor_exact_equality_admitted
        grounds:
          - calculations.mfc_floor
          - validations[priority=10]
        distinguishing_aspect: |
          Empty-collection/zero-style boundary on a different metric (price floor):
          offered == floor(basis*(1-disc)) must PASS; offered == floor+1 must FAIL.
          Metric = offered_price_cents vs MFC floor; reachable through
          POST /price-lists/{id}/activate (different endpoint from ceiling).
        test_recipe:
          setup:
            - "Agreement mfc=0.20; Vehicle FED_SCHEDULE AUTHORIZED; basis=10000"
            - "P1 line offered=8000 (=floor(10000*0.80)) -- exact boundary"
            - "P2 line offered=8001 -- one cent over"
            - "Logical clock 2026-10-01"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /manufacturers", payload: { legal_name: "Z Corp", duns: "141414141", manufacturer_type: "SOFTWARE_PUBLISHER", headquarters_country: "US" }, as: PlatformAdmin, captures: { m_id: "$.data.id" } }
            - { call: "POST /agreements", payload: { manufacturer_id: "${m_id}", scope_tiers: ["FEDERAL"], mfc_discount_pct: 0.20, small_business_goal_pct: 0.10, product_scope: ["SW-"], term_start: "2026-01-01T00:00:00Z", term_end: "2027-01-01T00:00:00Z" }, as: ContractsManager, captures: { a_id: "$.data.id" } }
            - { call: "POST /agreements/${a_id}/activate", payload: {}, as: ContractsManager }
            - { call: "POST /vehicles", payload: { agreement_id: "${a_id}", vehicle_kind: "FED_SCHEDULE", buyer_tiers: ["FEDERAL"], ceiling_cents: 100000000, taa_required: false, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: ContractsManager, captures: { v_id: "$.data.id" } }
            - { call: "POST /vehicles/${v_id}/authorize", payload: {}, as: ContractsManager }
            - { call: "POST /price-lists", payload: { vehicle_id: "${v_id}", period_from: "2026-01-01T00:00:00Z", period_to: "2027-01-01T00:00:00Z", lines: [{ sku: "SW-1", basis_price_cents: 10000, offered_price_cents: 8000, origin_country: "US" }] }, as: ContractsManager, captures: { p1: "$.data.id" } }
            - { call: "POST /price-lists/${p1}/submit", payload: {}, as: ContractsManager }
            - { call: "POST /price-lists", payload: { vehicle_id: "${v_id}", period_from: "2026-01-01T00:00:00Z", period_to: "2027-01-01T00:00:00Z", lines: [{ sku: "SW-1", basis_price_cents: 10000, offered_price_cents: 8001, origin_country: "US" }] }, as: ContractsManager, captures: { p2: "$.data.id" } }
            - { call: "POST /price-lists/${p2}/submit", payload: {}, as: ContractsManager }
          trigger:
            - { call: "POST /price-lists/${p1}/activate", payload: {}, as: ComplianceOfficer }
            - { call: "POST /price-lists/${p2}/activate", payload: {}, as: ComplianceOfficer }
          assert:
            - "POST /price-lists/${p1}/activate succeeds (offered == floor -> admitted)"
            - "POST /price-lists/${p2}/activate returns ERR_MFC_FLOOR_VIOLATION (offered == floor + 1)"

  # =========================================================================
  # Rule 7 — cross_entity_state_dependency (>=2, different entity pairs)
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: order_submit_gated_by_agreement_posture
        grounds:
          - state_machines.Order.transitions
          - entities.ManufacturerAgreement.fields.posture
        distinguishing_aspect: |
          Pair (Order, ManufacturerAgreement): order submit requires
          agreement.posture == GOOD_STANDING; once a dispute drives posture to
          ON_HOLD the same order submission is rejected with
          ERR_AGREEMENT_NOT_GOOD_STANDING.
        test_recipe:
          setup:
            - "Full chain to ACTIVE price list; O1 DRAFT order created"
            - "Drive posture ON_HOLD via dispute -200000 on a separate reference order"
            - "Logical clock 2026-10-01"
          setup_api_calls:
