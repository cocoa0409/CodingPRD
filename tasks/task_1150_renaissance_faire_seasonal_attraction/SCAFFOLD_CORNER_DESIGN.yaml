# =============================================================================
# §1.9: Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task 1150 — Renaissance Faire & Seasonal Attraction Operations
# Breadth coverage of §1.1–§1.7 claims not already covered by §1.8.
# =============================================================================
scaffold_corner_design:
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: season_creation_applies_defaults
        claim_type: creation
        grounds: [entities.Season]
        distinguishing_aspect: "A newly created season starts PLANNING with posture BLOCKED, zeroed counters, version 1, and season_weeks derived from the date span."
        test_recipe:
          setup: ["Empty database; logical clock at its 2026-05-01T00:00:00Z default"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: FaireOperator }
          trigger:
            - { call: "POST /seasons", payload: { name: "Default Revel", opening_date: "2026-06-06T00:00:00Z", closing_date: "2026-06-20T00:00:00Z", daily_capacity: 500, group_min_size: 10, volunteer_min_hours: 0, weather_call_deadline_hour: 6, rain_check_grace_days: 14 }, as: FaireOperator, captures: { st: $.data.status, po: $.data.readiness_posture, vh: $.data.volunteer_confirmed_hours, oa: $.data.outstanding_admissions, wk: $.data.season_weeks, ver: $.data.version } }
          assert:
            - "status == PLANNING, readiness_posture == BLOCKED, volunteer_confirmed_hours == 0, outstanding_admissions == 0"
            - "season_weeks == 2 (ceil(14 days / 7)), version == 1, id is a server-minted UUID"

      - name: season_missing_required_name_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Season.fields.name, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting the required input field name is rejected with ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /seasons", payload: { opening_date: "2026-06-06T00:00:00Z", closing_date: "2026-06-20T00:00:00Z", daily_capacity: 500, group_min_size: 10, volunteer_min_hours: 0, weather_call_deadline_hour: 6, rain_check_grace_days: 14 }, as: FaireOperator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST, http 400, no Season persisted"

      - name: volunteer_shift_invalid_enum_returns_invalid_request
        claim_type: type_constraints
        grounds: [entities.VolunteerShift.fields.role, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "role outside {GATE, PARKING, TAVERN, INFO, BACKSTAGE} is rejected before any state or overlap check."
        test_recipe:
          setup: ["Season PLANNING with one SCHEDULED faire day"]
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "Enum Revel", opening_date: "2026-06-06T00:00:00Z", closing_date: "2026-06-20T00:00:00Z", daily_capacity: 500, group_min_size: 10, volunteer_min_hours: 0, weather_call_deadline_hour: 6, rain_check_grace_days: 14 }
              as: FaireOperator
              captures: { s_id: $.data.id }
            - { call: "POST /faire-days", payload: { season_id: "${s_id}", date: "2026-06-06T00:00:00Z" }, as: FaireOperator, captures: { d1: $.data.id } }
          trigger:
            - { call: "POST /volunteer-shifts", payload: { season_id: "${s_id}", faire_day_id: "${d1}", role: "JESTER", start_time: "2026-06-06T08:00:00Z", end_time: "2026-06-06T12:00:00Z" }, as: Volunteer, as_user_id: "vol-eve", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST (400); no VolunteerShift persisted"

      - name: get_nonexistent_season_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_SEASON_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but unknown UUID returns ERR_SEASON_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /seasons/00000000-0000-0000-0000-000000000000", payload: {}, as: Any, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SEASON_NOT_FOUND, http 404"

      - name: ticket_order_total_cents_input_rejected
        claim_type: computed_fields
        grounds: [entities.TicketOrder.fields.total_cents]
        distinguishing_aspect: "total_cents is server-computed; a client-supplied total_cents is an unknown field and rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Season BUILD with day 06-06 OPEN_FOR_SALES"]
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "Computed Revel", opening_date: "2026-06-06T00:00:00Z", closing_date: "2026-06-20T00:00:00Z", daily_capacity: 500, group_min_size: 10, volunteer_min_hours: 0, weather_call_deadline_hour: 6, rain_check_grace_days: 14 }
              as: FaireOperator
              captures: { s_id: $.data.id }
            - { call: "POST /faire-days", payload: { season_id: "${s_id}", date: "2026-06-06T00:00:00Z" }, as: FaireOperator, captures: { d1: $.data.id } }
            - { call: "POST /seasons/${s_id}/begin-build", payload: {}, as: FaireOperator }
            - { call: "POST /faire-days/${d1}/open-sales", payload: {}, as: FaireOperator }
          trigger:
            - { call: "POST /ticket-orders", payload: { season_id: "${s_id}", order_type: "DAY", quantity: 1, unit_price_cents: 3000, faire_day_id: "${d1}", total_cents: 1 }, as: Guest, as_user_id: "g-sneaky@x.com", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST (400); the server never accepts client-computed totals"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: faire_day_initial_state_scheduled
        claim_type: initial_state
        grounds: [state_machines.FaireDay]
        distinguishing_aspect: "A newly created FaireDay starts in SCHEDULED with tickets_sold_count 0."
        test_recipe:
          setup: ["Season PLANNING"]
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "Init Revel", opening_date: "2026-06-06T00:00:00Z", closing_date: "2026-06-20T00:00:00Z", daily_capacity: 500, group_min_size: 10, volunteer_min_hours: 0, weather_call_deadline_hour: 6, rain_check_grace_days: 14 }
              as: FaireOperator
              captures: { s_id: $.data.id }
          trigger:
            - { call: "POST /faire-days", payload: { season_id: "${s_id}", date: "2026-06-06T00:00:00Z" }, as: FaireOperator, captures: { st: $.data.status, sold: $.data.tickets_sold_count } }
          assert:
            - "FaireDay.status == SCHEDULED, tickets_sold_count == 0"

      - name: cancel_terminal_day_returns_invalid_state
        claim_type: terminal_state_lockdown
        grounds: [state_machines.FaireDay.terminal_states, "errors[ERR_DAY_NOT_CANCELLABLE]"]
        distinguishing_aspect: "CANCELLED_WEATHER is terminal: a second cancel-weather is rejected and no cascade side effects fire twice."
        test_recipe:
          setup: ["Season BUILD (capacity 500, volunteer_min_hours 0); day 06-06 OPEN_FOR_SALES with one PAID DAY ticket; day then weather-cancelled"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: FaireOperator }
            - call: "POST /seasons"
              payload: { name: "Terminal Revel", opening_date: "2026-06-06T00:00:00Z", closing_date: "2026-06-20T00:00:00Z", daily_capacity: 500, group_min_size: 10, volunteer_min_hours: 0, weather_call_deadline_hour: 6, rain_check_grace_days: 14 }
              as: FaireOperator
              captures: { s_id: $.data.id }
            - { call: "POST /faire-days", payload: { season_id: "${s_id}", date: "2026-06-06T00:00:00Z" }, as: FaireOperator, captures: { d1: $.data.id } }
            - { call: "POST /seasons/${s_id}/begin-build", payload: {}, as: FaireOperator }
            - { call: "POST /faire-days/${d1}/open-sales", payload: {}, as: FaireOperator }
            - { call: "POST /ticket-orders", payload: { season_id: "${s_id}", order_type: "DAY", quantity: 1, unit_price_cents: 3000, faire_day_id: "${d1}" }, as: Guest, as_user_id: "g-t@x.com", captures: { o1: $.data.id } }
            - { call: "POST /ticket-orders/${o1}/pay", payload: {}, as: Guest, as_user_id: "g-t@x.com" }
            - { call: "POST /faire-days/${d1}/cancel-weather", payload: {}, as: FaireOperator }
          trigger:
            - { call: "POST /faire-days/${d1}/cancel-weather", payload: {}, as: FaireOperator, captures: { err: $.data.error_id } }
            - { call: "GET /seasons/${s_id}", payload: {}, as: Any, captures: { oa: $.data.outstanding_admissions } }
          assert:
            - "Second cancel-weather returns ERR_DAY_NOT_CANCELLABLE (409)"
            - "outstanding_admissions == 1 (exactly one rain check issued — the cascade did not re-fire)"

      - name: contract_accept_from_draft_rejected
        claim_type: invalid_transition
        grounds: [state_machines.CastContract.OFFERED_to_ACCEPTED, "errors[ERR_CONTRACT_NOT_OFFERED]"]
        distinguishing_aspect: "accept from DRAFT (skipping offer) is rejected with ERR_CONTRACT_NOT_OFFERED."
        test_recipe:
          setup: ["Season PLANNING; performer; contract DRAFT"]
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "Skip Revel", opening_date: "2026-06-06T00:00:00Z", closing_date: "2026-06-20T00:00:00Z", daily_capacity: 500, group_min_size: 10, volunteer_min_hours: 0, weather_call_deadline_hour: 6, rain_check_grace_days: 14 }
              as: FaireOperator
              captures: { s_id: $.data.id }
            - { call: "POST /performers", payload: { stage_name: "Brother Roland", act_type: "MUSIC", base_day_rate_cents: 12000 }, as: CastDirector, captures: { p_id: $.data.id } }
            - { call: "POST /cast-contracts", payload: { season_id: "${s_id}", performer_id: "${p_id}", offered_day_rate_cents: 12000, guaranteed_days: 2, weather_pay_pct: 0.5, required_rehearsal_hours: 2 }, as: CastDirector, captures: { c_id: $.data.id } }
          trigger:
            - { call: "POST /cast-contracts/${c_id}/accept", payload: {}, as: Performer, as_user_id: "${p_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_CONTRACT_NOT_OFFERED (409); contract remains DRAFT"

      - name: build_task_dependency_unmet_blocks_start
        claim_type: precondition_enforcement
        grounds: [state_machines.BuildTask.PENDING_to_IN_PROGRESS, "errors[ERR_TASK_DEPENDENCY_UNMET]"]
        distinguishing_aspect: "Advancing a task whose dependency is not DONE is rejected; once the dependency completes, the same advance succeeds."
        test_recipe:
          setup: ["Season PLANNING; tasks T1 'Lay foundations' PENDING, T2 'Erect stage' PENDING depending on T1"]
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "Build Revel", opening_date: "2026-06-06T00:00:00Z", closing_date: "2026-06-20T00:00:00Z", daily_capacity: 500, group_min_size: 10, volunteer_min_hours: 0, weather_call_deadline_hour: 6, rain_check_grace_days: 14 }
              as: FaireOperator
              captures: { s_id: $.data.id }
            - { call: "POST /build-tasks", payload: { season_id: "${s_id}", phase: "BUILD", name: "Lay foundations" }, as: FaireOperator, captures: { t1: $.data.id } }
            - { call: "POST /build-tasks", payload: { season_id: "${s_id}", phase: "BUILD", name: "Erect stage", depends_on_task_ids: ["${t1}"] }, as: FaireOperator, captures: { t2: $.data.id } }
          trigger:
            - { call: "POST /build-tasks/${t2}/advance", payload: { to: "IN_PROGRESS" }, as: FaireOperator, captures: { err: $.data.error_id } }
            - { call: "POST /build-tasks/${t1}/advance", payload: { to: "IN_PROGRESS" }, as: FaireOperator }
            - { call: "POST /build-tasks/${t1}/advance", payload: { to: "DONE" }, as: FaireOperator }
            - { call: "POST /build-tasks/${t2}/advance", payload: { to: "IN_PROGRESS" }, as: FaireOperator, captures: { t2_st: $.data.status } }
          assert:
            - "First advance of T2 returns ERR_TASK_DEPENDENCY_UNMET (409)"
            - "After T1 DONE: T2 advance succeeds, status IN_PROGRESS"

      - name: pay_mints_quantity_valid_tickets
        claim_type: side_effect_execution
        grounds: [state_machines.TicketOrder.UNPAID_to_PAID, calculations.outstanding_admissions_invariant]
        distinguishing_aspect: "Paying a DAY order of quantity 3 mints exactly 3 VALID tickets bound to the faire day and raises outstanding_admissions by 3."
        test_recipe:
          setup: ["Season BUILD; day 06-06 OPEN_FOR_SALES; DAY order qty3 created"]
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "Mint Revel", opening_date: "2026-06-06T00:00:00Z", closing_date: "2026-06-20T00:00:00Z", daily_capacity: 500, group_min_size: 10, volunteer_min_hours: 0, weather_call_deadline_hour: 6, rain_check_grace_days: 14 }
              as: FaireOperator
              captures: { s_id: $.data.id }
            - { call: "POST /faire-days", payload: { season_id: "${s_id}", date: "2026-06-06T00:00:00Z" }, as: FaireOperator, captures: { d1: $.data.id } }
            - { call: "POST /seasons/${s_id}/begin-build", payload: {}, as: FaireOperator }
            - { call: "POST /faire-days/${d1}/open-sales", payload: {}, as: FaireOperator }
            - { call: "POST /ticket-orders", payload: { season_id: "${s_id}", order_type: "DAY", quantity: 3, unit_price_cents: 3000, faire_day_id: "${d1}" }, as: Guest, as_user_id: "g-mint@x.com", captures: { o1: $.data.id } }
          trigger:
            - { call: "POST /ticket-orders/${o1}/pay", payload: {}, as: Guest, as_user_id: "g-mint@x.com", captures: { ps: $.data.payment_status } }
            - { call: "GET /tickets", payload: { order_id: "${o1}" }, as: Any, captures: { tk0: "$.data[0].status", tk1: "$.data[1].status", tk2: "$.data[2].status", tkday: "$.data[0].faire_day_id" } }
            - { call: "GET /seasons/${s_id}", payload: {}, as: Any, captures: { oa: $.data.outstanding_admissions } }
          assert:
            - "payment_status == PAID; exactly 3 tickets exist for the order, all VALID, faire_day_id == ${d1}"
            - "Season.outstanding_admissions == 3"

      - name: double_pay_rejected
        claim_type: idempotency
        grounds: [state_machines.TicketOrder.UNPAID_to_PAID, "errors[ERR_ORDER_NOT_UNPAID]"]
        distinguishing_aspect: "Repeating pay on an already-PAID order is rejected with ERR_ORDER_NOT_UNPAID; no duplicate tickets are minted."
        test_recipe:
          setup: ["Season BUILD; day OPEN_FOR_SALES; DAY order qty2 PAID"]
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "Idem Revel", opening_date: "2026-06-06T00:00:00Z", closing_date: "2026-06-20T00:00:00Z", daily_capacity: 500, group_min_size: 10, volunteer_min_hours: 0, weather_call_deadline_hour: 6, rain_check_grace_days: 14 }
              as: FaireOperator
              captures: { s_id: $.data.id }
            - { call: "POST /faire-days", payload: { season_id: "${s_id}", date: "2026-06-06T00:00:00Z" }, as: FaireOperator, captures: { d1: $.data.id } }
            - { call: "POST /seasons/${s_id}/begin-build", payload: {}, as: FaireOperator }
            - { call: "POST /faire-days/${d1}/open-sales", payload: {}, as: FaireOperator }
            - { call: "POST /ticket-orders", payload: { season_id: "${s_id}", order_type: "DAY", quantity: 2, unit_price_cents: 3000, faire_day_id: "${d1}" }, as: Guest, as_user_id: "g-i@x.com", captures: { o1: $.data.id } }
            - { call: "POST /ticket-orders/${o1}/pay", payload: {}, as: Guest, as_user_id: "g-i@x.com" }
          trigger:
            - { call: "POST /ticket-orders/${o1}/pay", payload: {}, as: Guest, as_user_id: "g-i@x.com", captures: { err: $.data.error_id } }
            - { call: "GET /seasons/${s_id}", payload: {}, as: Any, captures: { oa: $.data.outstanding_admissions } }
          assert:
            - "Second pay returns ERR_ORDER_NOT_UNPAID (409)"
            - "outstanding_admissions == 2 (no duplicate minting)"

      - name: faire_day_hold_release_cycle
        claim_type: valid_transition
        grounds: [state_machines.FaireDay.OPEN_FOR_SALES_to_WEATHER_HOLD, state_machines.FaireDay.WEATHER_HOLD_to_OPEN_FOR_SALES]
        distinguishing_aspect: "The weather-hold loop is cyclic: OPEN_FOR_SALES -> WEATHER_HOLD -> OPEN_FOR_SALES, and ticket sales work again after the cycle."
        test_recipe:
          setup: ["Season BUILD; day 06-06 OPEN_FOR_SALES"]
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "Hold Revel", opening_date: "2026-06-06T00:00:00Z", closing_date: "2026-06-20T00:00:00Z", daily_capacity: 500, group_min_size: 10, volunteer_min_hours: 0, weather_call_deadline_hour: 6, rain_check_grace_days: 14 }
              as: FaireOperator
              captures: { s_id: $.data.id }
            - { call: "POST /faire-days", payload: { season_id: "${s_id}", date: "2026-06-06T00:00:00Z" }, as: FaireOperator, captures: { d1: $.data.id } }
            - { call: "POST /seasons/${s_id}/begin-build", payload: {}, as: FaireOperator }
            - { call: "POST /faire-days/${d1}/open-sales", payload: {}, as: FaireOperator }
          trigger:
            - { call: "POST /faire-days/${d1}/weather-hold", payload: {}, as: FaireOperator, captures: { st1: $.data.status } }
            - { call: "POST /faire-days/${d1}/release-hold", payload: {}, as: FaireOperator, captures: { st2: $.data.status } }
            - { call: "POST /ticket-orders", payload: { season_id: "${s_id}", order_type: "DAY", quantity: 1, unit_price_cents: 3000, faire_day_id: "${d1}" }, as: Guest, as_user_id: "g-h@x.com", captures: { o_id: $.data.id } }
          assert:
            - "After weather-hold: status WEATHER_HOLD; after release-hold: status OPEN_FOR_SALES"
            - "Post-cycle ticket purchase succeeds (201)"

      - name: ticket_order_parallel_dimensions_independent
        claim_type: valid_transition
        grounds: [state_machines.TicketOrder]
        distinguishing_aspect: "payment_status and redemption_status evolve independently: a refund moves payment to PARTIALLY_REFUNDED without touching redemption, and a gate redemption moves redemption to PARTIALLY_REDEEMED without touching payment."
        test_recipe:
          setup: ["Season OPEN; day 06-06 OPERATING (clock 2026-06-06T07:00:00Z); DAY order qty2 PAID"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: FaireOperator }
            - call: "POST /seasons"
              payload: { name: "Parallel Revel", opening_date: "2026-06-06T00:00:00Z", closing_date: "2026-06-20T00:00:00Z", daily_capacity: 500, group_min_size: 10, volunteer_min_hours: 0, weather_call_deadline_hour: 6, rain_check_grace_days: 14 }
              as: FaireOperator
              captures: { s_id: $.data.id }
            - { call: "POST /faire-days", payload: { season_id: "${s_id}", date: "2026-06-06T00:00:00Z" }, as: FaireOperator, captures: { d1: $.data.id } }
            - { call: "POST /seasons/${s_id}/begin-build", payload: {}, as: FaireOperator }
            - { call: "POST /seasons/${s_id}/open", payload: {}, as: FaireOperator }
            - { call: "POST /faire-days/${d1}/open-sales", payload: {}, as: FaireOperator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-06T07:00:00Z" }, as: FaireOperator }
            - { call: "POST /faire-days/${d1}/open-gates", payload: {}, as: FaireOperator }
            - { call: "POST /ticket-orders", payload: { season_id: "${s_id}", order_type: "DAY", quantity: 2, unit_price_cents: 3000, faire_day_id: "${d1}" }, as: Guest, as_user_id: "g-p@x.com", captures: { o1: $.data.id } }
            - { call: "POST /ticket-orders/${o1}/pay", payload: {}, as: Guest, as_user_id: "g-p@x.com" }
          trigger:
            - { call: "GET /tickets", payload: { order_id: "${o1}" }, as: Any, captures: { t1: "$.data[0].id" } }
            - { call: "POST /tickets/${t1}/redeem", payload: {}, as: GateAgent }
            - { call: "GET /ticket-orders/${o1}", payload: {}, as: Any, captures: { pay1: $.data.payment_status, red1: $.data.redemption_status } }
            - { call: "POST /ticket-orders/${o1}/refund", payload: { refund_cents: 1000 }, as: GateAgent }
            - { call: "GET /ticket-orders/${o1}", payload: {}, as: Any, captures: { pay2: $.data.payment_status, red2: $.data.redemption_status } }
          assert:
            - "After one redemption: redemption_status == PARTIALLY_REDEEMED, payment_status == PAID (unchanged)"
            - "After refund 1000: payment_status == PARTIALLY_REFUNDED, redemption_status == PARTIALLY_REDEEMED (unchanged)"

      - name: rehearsal_attend_bubbles_contract_to_rehearsing
        claim_type: precondition_enforcement
        grounds: [state_machines.CastContract.ACCEPTED_to_REHEARSING, state_machines.RehearsalSlot.SCHEDULED_to_ATTENDED]
        distinguishing_aspect: "Bubble-up: the first ATTENDED rehearsal slot both credits completed_rehearsal_hours and flips the contract ACCEPTED -> REHEARSING."
        test_recipe:
          setup: ["Season PLANNING; contract ACCEPTED with required_rehearsal_hours 4; one 2h slot SCHEDULED"]
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "Bubble Revel", opening_date: "2026-06-06T00:00:00Z", closing_date: "2026-06-20T00:00:00Z", daily_capacity: 500, group_min_size: 10, volunteer_min_hours: 0, weather_call_deadline_hour: 6, rain_check_grace_days: 14 }
              as: FaireOperator
              captures: { s_id: $.data.id }
            - { call: "POST /performers", payload: { stage_name: "Axel the Bold", act_type: "COMBAT", base_day_rate_cents: 20000 }, as: CastDirector, captures: { p_id: $.data.id } }
            - { call: "POST /cast-contracts", payload: { season_id: "${s_id}", performer_id: "${p_id}", offered_day_rate_cents: 20000, guaranteed_days: 2, weather_pay_pct: 0.5, required_rehearsal_hours: 4 }, as: CastDirector, captures: { c_id: $.data.id } }
            - { call: "POST /cast-contracts/${c_id}/offer", payload: {}, as: CastDirector }
            - { call: "POST /cast-contracts/${c_id}/accept", payload: {}, as: Performer, as_user_id: "${p_id}" }
            - { call: "POST /rehearsal-slots", payload: { contract_id: "${c_id}", stage_name: "MAIN", start_time: "2026-05-10T09:00:00Z", end_time: "2026-05-10T11:00:00Z" }, as: CastDirector, captures: { r1: $.data.id } }
          trigger:
            - { call: "POST /rehearsal-slots/${r1}/record-attendance", payload: { outcome: "ATTENDED" }, as: CastDirector, captures: { hrs: $.data.hours_credit } }
            - { call: "GET /cast-contracts/${c_id}", payload: {}, as: Any, captures: { c_st: $.data.status, c_hrs: $.data.completed_rehearsal_hours } }
          assert:
            - "Slot hours_credit == 2.0"
            - "Contract: status == REHEARSING, completed_rehearsal_hours == 2.0"

      - name: waitlist_promotion_selector_on_release
        claim_type: side_effect_execution
        grounds: [state_machines.VendorApplication.WAITLISTED_to_JURIED_IN, calculations.waitlist_promotion, state_machines.BoothAssignment.RESERVED_to_RELEASED]
        distinguishing_aspect: "Releasing a RESERVED booth promotes the top WAITLISTED application by jury_score DESC with created_at ASC tie-break: highest score first (8.5 beats 8.0), and among equal scores the earlier-filed application wins."
        test_recipe:
          setup:
            - "Season PLANNING; five artisan vendors with applications: A and B JURIED_IN with booths B-01/B-02 RESERVED; X (filed 1st, score 8.0), Y (filed 2nd, score 8.0), Z (filed 3rd, score 8.5) WAITLISTED"
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "Waitlist Revel", opening_date: "2026-06-06T00:00:00Z", closing_date: "2026-06-20T00:00:00Z", daily_capacity: 500, group_min_size: 10, volunteer_min_hours: 0, weather_call_deadline_hour: 6, rain_check_grace_days: 14 }
              as: FaireOperator
              captures: { s_id: $.data.id }
            - { call: "POST /vendors", payload: { business_name: "Vendor A", category: "ARTISAN" }, as: VendorCoordinator, captures: { va: $.data.id } }
            - { call: "POST /vendors", payload: { business_name: "Vendor B", category: "ARTISAN" }, as: VendorCoordinator, captures: { vb: $.data.id } }
            - { call: "POST /vendors", payload: { business_name: "Vendor X", category: "ARTISAN" }, as: VendorCoordinator, captures: { vx: $.data.id } }
            - { call: "POST /vendors", payload: { business_name: "Vendor Y", category: "ARTISAN" }, as: VendorCoordinator, captures: { vy: $.data.id } }
            - { call: "POST /vendors", payload: { business_name: "Vendor Z", category: "ARTISAN" }, as: VendorCoordinator, captures: { vz: $.data.id } }
            - { call: "POST /vendor-applications", payload: { season_id: "${s_id}", booth_size_sqft: 64, requested_location_tier: "MEADOW" }, as: Vendor, as_user_id: "${va}", captures: { aa: $.data.id } }
            - { call: "POST /vendor-applications", payload: { season_id: "${s_id}", booth_size_sqft: 64, requested_location_tier: "MEADOW" }, as: Vendor, as_user_id: "${vb}", captures: { ab: $.data.id } }
            - { call: "POST /vendor-applications", payload: { season_id: "${s_id}", booth_size_sqft: 64, requested_location_tier: "MEADOW" }, as: Vendor, as_user_id: "${vx}", captures: { ax: $.data.id } }
            - { call: "POST /vendor-applications", payload: { season_id: "${s_id}", booth_size_sqft: 64, requested_location_tier: "MEADOW" }, as: Vendor, as_user_id: "${vy}", captures: { ay: $.data.id } }
            - { call: "POST /vendor-applications", payload: { season_id: "${s_id}", booth_size_sqft: 64, requested_location_tier: "MEADOW" }, as: Vendor, as_user_id: "${vz}", captures: { az: $.data.id } }
            - { call: "POST /vendor-applications/${aa}/decide", payload: { craft_score: 8, authenticity_score: 8, safety_score: 8, outcome: "JURIED_IN" }, as: VendorCoordinator }
            - { call: "POST /vendor-applications/${ab}/decide", payload: { craft_score: 8, authenticity_score: 8, safety_score: 8, outcome: "JURIED_IN" }, as: VendorCoordinator }
            - { call: "POST /vendor-applications/${ax}/decide", payload: { craft_score: 8, authenticity_score: 8, safety_score: 8, outcome: "WAITLISTED" }, as: VendorCoordinator }
            - { call: "POST /vendor-applications/${ay}/decide", payload: { craft_score: 8, authenticity_score: 8, safety_score: 8, outcome: "WAITLISTED" }, as: VendorCoordinator }
            - { call: "POST /vendor-applications/${az}/decide", payload: { craft_score: 9, authenticity_score: 8, safety_score: 8, outcome: "WAITLISTED" }, as: VendorCoordinator }
            - { call: "POST /booth-assignments", payload: { application_id: "${aa}", booth_site: "B-01", residency_start_date: "2026-06-06T00:00:00Z", residency_end_date: "2026-06-21T00:00:00Z" }, as: VendorCoordinator, captures: { ba: $.data.id } }
            - { call: "POST /booth-assignments", payload: { application_id: "${ab}", booth_site: "B-02", residency_start_date: "2026-06-06T00:00:00Z", residency_end_date: "2026-06-21T00:00:00Z" }, as: VendorCoordinator, captures: { bb: $.data.id } }
          trigger:
            - { call: "POST /booth-assignments/${ba}/release", payload: {}, as: VendorCoordinator }
            - { call: "GET /vendor-applications/${az}", payload: {}, as: Any, captures: { z_st: $.data.status } }
            - { call: "GET /vendor-applications/${ax}", payload: {}, as: Any, captures: { x_st_mid: $.data.status } }
            - { call: "POST /booth-assignments/${bb}/release", payload: {}, as: VendorCoordinator }
            - { call: "GET /vendor-applications/${ax}", payload: {}, as: Any, captures: { x_st: $.data.status } }
            - { call: "GET /vendor-applications/${ay}", payload: {}, as: Any, captures: { y_st: $.data.status } }
          assert:
            - "First release promotes Z (jury_score 8.5 highest): Z JURIED_IN; X (8.0) still WAITLISTED"
            - "Second release promotes X over Y (equal 8.0, X filed earlier): X JURIED_IN, Y still WAITLISTED"

  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: jury_score_weighted_value
        claim_type: correct_result
        grounds: [calculations.jury_score]
        excluded_because:
          difficulty_instance: vendor_application_appeal_cycle
          rationale: "The §1.8 appeal-cycle instance asserts jury_score == 7.7 (0.5*7+0.3*8+0.2*9) and 9.0 literally on decide responses."

      - name: posture_volunteer_hours_exact_threshold
        claim_type: correct_result
        grounds: [calculations.readiness_posture]
        distinguishing_aspect: "Threshold boundary: volunteer_confirmed_hours exactly == volunteer_min_hours (8.0) qualifies as READY (>= semantics); 7.5 does not."
        test_recipe:
          setup: ["Season PLANNING with volunteer_min_hours 8; one 8h shift CONFIRMED on day 06-06 (second season with one 7.5h shift for the below-threshold leg)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: FaireOperator }
            - call: "POST /seasons"
              payload: { name: "Exact Revel", opening_date: "2026-06-06T00:00:00Z", closing_date: "2026-06-20T00:00:00Z", daily_capacity: 500, group_min_size: 10, volunteer_min_hours: 8, weather_call_deadline_hour: 6, rain_check_grace_days: 14 }
              as: FaireOperator
              captures: { s1: $.data.id }
            - { call: "POST /faire-days", payload: { season_id: "${s1}", date: "2026-06-06T00:00:00Z" }, as: FaireOperator, captures: { d1: $.data.id } }
            - { call: "POST /volunteer-shifts", payload: { season_id: "${s1}", faire_day_id: "${d1}", role: "GATE", start_time: "2026-06-06T08:00:00Z", end_time: "2026-06-06T16:00:00Z" }, as: Volunteer, as_user_id: "vol-fay", captures: { sh1: $.data.id } }
            - call: "POST /seasons"
              payload: { name: "Short Revel", opening_date: "2026-06-06T00:00:00Z", closing_date: "2026-06-20T00:00:00Z", daily_capacity: 500, group_min_size: 10, volunteer_min_hours: 8, weather_call_deadline_hour: 6, rain_check_grace_days: 14 }
              as: FaireOperator
              captures: { s2: $.data.id }
            - { call: "POST /faire-days", payload: { season_id: "${s2}", date: "2026-06-06T00:00:00Z" }, as: FaireOperator, captures: { d2: $.data.id } }
            - { call: "POST /volunteer-shifts", payload: { season_id: "${s2}", faire_day_id: "${d2}", role: "GATE", start_time: "2026-06-06T08:00:00Z", end_time: "2026-06-06T15:30:00Z" }, as: Volunteer, as_user_id: "vol-gus", captures: { sh2: $.data.id } }
          trigger:
            - { call: "POST /volunteer-shifts/${sh1}/confirm", payload: {}, as: VolunteerCoordinator }
            - { call: "GET /seasons/${s1}", payload: {}, as: Any, captures: { p1: $.data.readiness_posture, h1: $.data.volunteer_confirmed_hours } }
            - { call: "POST /volunteer-shifts/${sh2}/confirm", payload: {}, as: VolunteerCoordinator }
            - { call: "GET /seasons/${s2}", payload: {}, as: Any, captures: { p2: $.data.readiness_posture, h2: $.data.volunteer_confirmed_hours } }
          assert:
            - "Season with exactly 8.0 confirmed hours: readiness_posture == READY (== min qualifies)"
            - "Season with 7.5 confirmed hours: readiness_posture == CONDITIONAL (< min)"

      - name: group_tier_crossing_nineteen_vs_twenty
        claim_type: correct_result
        grounds: [calculations.ticket_order_total]
        distinguishing_aspect: "Tier-crossing trap: GROUP qty 19 prices at the 10% tier (51300) while qty 20 crosses into the 15% tier (51000) — one more ticket lowers the total."
        test_recipe:
          setup: ["Season BUILD (group_min_size 10); day 06-06 OPEN_FOR_SALES"]
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "Tier Revel", opening_date: "2026-06-06T00:00:00Z", closing_date: "2026-06-20T00:00:00Z", daily_capacity: 500, group_min_size: 10, volunteer_min_hours: 0, weather_call_deadline_hour: 6, rain_check_grace_days: 14 }
              as: FaireOperator
              captures: { s_id: $.data.id }
            - { call: "POST /faire-days", payload: { season_id: "${s_id}", date: "2026-06-06T00:00:00Z" }, as: FaireOperator, captures: { d1: $.data.id } }
            - { call: "POST /seasons/${s_id}/begin-build", payload: {}, as: FaireOperator }
            - { call: "POST /faire-days/${d1}/open-sales", payload: {}, as: FaireOperator }
          trigger:
            - { call: "POST /ticket-orders", payload: { season_id: "${s_id}", order_type: "GROUP", quantity: 19, unit_price_cents: 3000, faire_day_id: "${d1}" }, as: Guest, as_user_id: "g-19@x.com", captures: { t19: $.data.total_cents, d19: $.data.discount_pct } }
            - { call: "POST /ticket-orders", payload: { season_id: "${s_id}", order_type: "GROUP", quantity: 20, unit_price_cents: 3000, faire_day_id: "${d1}" }, as: Guest, as_user_id: "g-20@x.com", captures: { t20: $.data.total_cents, d20: $.data.discount_pct } }
          assert:
            - "qty 19: total_cents == 51300 (57000 * 0.90), discount_pct == 0.10"
            - "qty 20: total_cents == 51000 (60000 * 0.85), discount_pct == 0.15 — crossing the 2*group_min_size tier lowers the total"

      - name: rehearsal_shortfall_penalty_in_final_payout
        claim_type: correct_result
        grounds: [calculations.cast_final_payout, calculations.cast_accrued_payout]
        distinguishing_aspect: "A contract closing with 2 of 4 required rehearsal hours pays max(accrual 10000, guarantee 40000) minus (4-2)*5000 = 30000 — penalty observable, and final differs from accrual."
        test_recipe:
          setup:
            - "Season (volunteer_min_hours 0) OPEN; contract rate 20000, guaranteed_days 2, weather_pay_pct 0.5, required 4h; one 2h slot ATTENDED (contract stays REHEARSING at open)"
            - "Day 06-06 COMPLETED (no accrual — contract not PERFORMING); day 06-07 CANCELLED_WEATHER (accrual +10000 for REHEARSING)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: FaireOperator }
            - call: "POST /seasons"
              payload: { name: "Shortfall Revel", opening_date: "2026-06-06T00:00:00Z", closing_date: "2026-06-20T00:00:00Z", daily_capacity: 500, group_min_size: 10, volunteer_min_hours: 0, weather_call_deadline_hour: 6, rain_check_grace_days: 14 }
              as: FaireOperator
              captures: { s_id: $.data.id }
            - { call: "POST /faire-days", payload: { season_id: "${s_id}", date: "2026-06-06T00:00:00Z" }, as: FaireOperator, captures: { d1: $.data.id } }
            - { call: "POST /faire-days", payload: { season_id: "${s_id}", date: "2026-06-07T00:00:00Z" }, as: FaireOperator, captures: { d2: $.data.id } }
            - { call: "POST /performers", payload: { stage_name: "Penny Dreadful", act_type: "COMEDY", base_day_rate_cents: 20000 }, as: CastDirector, captures: { p_id: $.data.id } }
            - { call: "POST /cast-contracts", payload: { season_id: "${s_id}", performer_id: "${p_id}", offered_day_rate_cents: 20000, guaranteed_days: 2, weather_pay_pct: 0.5, required_rehearsal_hours: 4 }, as: CastDirector, captures: { c_id: $.data.id } }
            - { call: "POST /cast-contracts/${c_id}/offer", payload: {}, as: CastDirector }
            - { call: "POST /cast-contracts/${c_id}/accept", payload: {}, as: Performer, as_user_id: "${p_id}" }
            - { call: "POST /rehearsal-slots", payload: { contract_id: "${c_id}", stage_name: "MAIN", start_time: "2026-05-10T09:00:00Z", end_time: "2026-05-10T11:00:00Z" }, as: CastDirector, captures: { r1: $.data.id } }
            - { call: "POST /rehearsal-slots/${r1}/record-attendance", payload: { outcome: "ATTENDED" }, as: CastDirector }
            - { call: "POST /seasons/${s_id}/begin-build", payload: {}, as: FaireOperator }
            - { call: "POST /seasons/${s_id}/open", payload: {}, as: FaireOperator }
            - { call: "POST /faire-days/${d1}/open-sales", payload: {}, as: FaireOperator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-06T07:00:00Z" }, as: FaireOperator }
            - { call: "POST /faire-days/${d1}/open-gates", payload: {}, as: FaireOperator }
            - { call: "POST /faire-days/${d1}/complete", payload: {}, as: FaireOperator }
            - { call: "POST /faire-days/${d2}/open-sales", payload: {}, as: FaireOperator }
            - { call: "POST /faire-days/${d2}/cancel-weather", payload: {}, as: FaireOperator }
          trigger:
            - { call: "POST /seasons/${s_id}/begin-strike", payload: {}, as: FaireOperator }
            - { call: "GET /cast-contracts/${c_id}", payload: {}, as: Any, captures: { acc: $.data.accrued_payout_cents, fin: $.data.final_payout_cents, st: $.data.status } }
          assert:
            - "Contract stayed REHEARSING through open (2.0 completed < 4 required), so the COMPLETED day accrued 0"
            - "accrued_payout_cents == 10000 (one weather-cancelled day at round(20000*0.5))"
            - "final_payout_cents == 30000 (max(10000, 2*20000) - (4-2)*5000), status COMPLETED"

  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: missing_headers_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "A request sent WITHOUT X-User-ID/X-User-Role headers is rejected with ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400) before anything else."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /seasons/00000000-0000-0000-0000-000000000000", payload: {}, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400) — auth (p1) fires even though the id is also unknown (p3)"

      - name: body_fk_contract_not_found
        claim_type: violation_to_error
        grounds: ["validations[priority=3]", "errors[ERR_CONTRACT_NOT_FOUND]"]
        distinguishing_aspect: "A body FK (contract_id) referencing a nonexistent CastContract yields ERR_CONTRACT_NOT_FOUND (404) at existence priority, before overlap checks."
        test_recipe:
          setup: ["Empty database (no contract exists)"]
          setup_api_calls: []
          trigger:
            - { call: "POST /rehearsal-slots", payload: { contract_id: "00000000-0000-0000-0000-000000000000", stage_name: "MAIN", start_time: "2026-05-10T09:00:00Z", end_time: "2026-05-10T10:00:00Z" }, as: CastDirector, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_CONTRACT_NOT_FOUND (404)"

      - name: duplicate_application_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_DUPLICATE_APPLICATION]", "validations[priority=8]"]
        distinguishing_aspect: "A vendor with a non-terminal application for the season cannot file a second one."
        test_recipe:
          setup: ["Season PLANNING; vendor with one application in JURY_REVIEW"]
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "Dup Revel", opening_date: "2026-06-06T00:00:00Z", closing_date: "2026-06-20T00:00:00Z", daily_capacity: 500, group_min_size: 10, volunteer_min_hours: 0, weather_call_deadline_hour: 6, rain_check_grace_days: 14 }
              as: FaireOperator
              captures: { s_id: $.data.id }
            - { call: "POST /vendors", payload: { business_name: "Candle Corner", category: "ARTISAN" }, as: VendorCoordinator, captures: { v_id: $.data.id } }
            - { call: "POST /vendor-applications", payload: { season_id: "${s_id}", booth_size_sqft: 64, requested_location_tier: "STANDARD" }, as: Vendor, as_user_id: "${v_id}", captures: { a1: $.data.id } }
          trigger:
            - { call: "POST /vendor-applications", payload: { season_id: "${s_id}", booth_size_sqft: 100, requested_location_tier: "PRIME" }, as: Vendor, as_user_id: "${v_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_DUPLICATE_APPLICATION (409)"

      - name: appeal_twice_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_APPEAL_ALREADY_USED]", state_machines.VendorApplication.JURIED_OUT_to_APPEALED]
        distinguishing_aspect: "The single appeal is consumed on use: after JURIED_OUT -> APPEALED -> JURIED_OUT again, a second appeal fails with ERR_APPEAL_ALREADY_USED."
        test_recipe:
          setup: ["Season PLANNING; application appealed once and re-decided JURIED_OUT"]
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "Appeal Revel", opening_date: "2026-06-06T00:00:00Z", closing_date: "2026-06-20T00:00:00Z", daily_capacity: 500, group_min_size: 10, volunteer_min_hours: 0, weather_call_deadline_hour: 6, rain_check_grace_days: 14 }
              as: FaireOperator
              captures: { s_id: $.data.id }
            - { call: "POST /vendors", payload: { business_name: "Bone Carvers", category: "ARTISAN" }, as: VendorCoordinator, captures: { v_id: $.data.id } }
            - { call: "POST /vendor-applications", payload: { season_id: "${s_id}", booth_size_sqft: 64, requested_location_tier: "MEADOW" }, as: Vendor, as_user_id: "${v_id}", captures: { a_id: $.data.id } }
            - { call: "POST /vendor-applications/${a_id}/decide", payload: { craft_score: 5, authenticity_score: 5, safety_score: 5, outcome: "JURIED_OUT" }, as: VendorCoordinator }
            - { call: "POST /vendor-applications/${a_id}/appeal", payload: {}, as: Vendor, as_user_id: "${v_id}" }
            - { call: "POST /vendor-applications/${a_id}/decide", payload: { craft_score: 5, authenticity_score: 5, safety_score: 5, outcome: "JURIED_OUT" }, as: VendorCoordinator }
          trigger:
            - { call: "POST /vendor-applications/${a_id}/appeal", payload: {}, as: Vendor, as_user_id: "${v_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_APPEAL_ALREADY_USED (409); application remains JURIED_OUT"

      - name: weather_call_at_deadline_rejected
        claim_type: temporal
        grounds: ["errors[ERR_WEATHER_CALL_TOO_LATE]", "validations[priority=7]"]
        distinguishing_aspect: "Boundary precision on the deadline: cancel-weather at exactly date + weather_call_deadline_hour is too late (strict < required); one second before would pass."
        test_recipe:
          setup: ["Season BUILD (deadline hour 6); day 06-06 OPEN_FOR_SALES; clock at 2026-06-06T06:00:00Z (exactly the deadline)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: FaireOperator }
            - call: "POST /seasons"
              payload: { name: "Deadline Revel", opening_date: "2026-06-06T00:00:00Z", closing_date: "2026-06-20T00:00:00Z", daily_capacity: 500, group_min_size: 10, volunteer_min_hours: 0, weather_call_deadline_hour: 6, rain_check_grace_days: 14 }
              as: FaireOperator
              captures: { s_id: $.data.id }
            - { call: "POST /faire-days", payload: { season_id: "${s_id}", date: "2026-06-06T00:00:00Z" }, as: FaireOperator, captures: { d1: $.data.id } }
            - { call: "POST /seasons/${s_id}/begin-build", payload: {}, as: FaireOperator }
            - { call: "POST /faire-days/${d1}/open-sales", payload: {}, as: FaireOperator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-06T06:00:00Z" }, as: FaireOperator }
          trigger:
            - { call: "POST /faire-days/${d1}/cancel-weather", payload: {}, as: FaireOperator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_WEATHER_CALL_TOO_LATE (409); the day remains OPEN_FOR_SALES"

      - name: day_at_capacity_on_pay
        claim_type: aggregate
        grounds: ["errors[ERR_DAY_AT_CAPACITY]", state_machines.TicketOrder.UNPAID_to_PAID]
        distinguishing_aspect: "Two individually valid UNPAID orders for the same day exceed capacity collectively: the second pay mints nothing and fails with ERR_DAY_AT_CAPACITY."
        test_recipe:
          setup: ["Season BUILD with daily_capacity 1; day 06-06 OPEN_FOR_SALES; two DAY orders qty1; first order PAID"]
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "Capacity Revel", opening_date: "2026-06-06T00:00:00Z", closing_date: "2026-06-20T00:00:00Z", daily_capacity: 1, group_min_size: 10, volunteer_min_hours: 0, weather_call_deadline_hour: 6, rain_check_grace_days: 14 }
              as: FaireOperator
              captures: { s_id: $.data.id }
            - { call: "POST /faire-days", payload: { season_id: "${s_id}", date: "2026-06-06T00:00:00Z" }, as: FaireOperator, captures: { d1: $.data.id } }
            - { call: "POST /seasons/${s_id}/begin-build", payload: {}, as: FaireOperator }
            - { call: "POST /faire-days/${d1}/open-sales", payload: {}, as: FaireOperator }
            - { call: "POST /ticket-orders", payload: { season_id: "${s_id}", order_type: "DAY", quantity: 1, unit_price_cents: 3000, faire_day_id: "${d1}" }, as: Guest, as_user_id: "g-c1@x.com", captures: { o1: $.data.id } }
            - { call: "POST /ticket-orders", payload: { season_id: "${s_id}", order_type: "DAY", quantity: 1, unit_price_cents: 3000, faire_day_id: "${d1}" }, as: Guest, as_user_id: "g-c2@x.com", captures: { o2: $.data.id } }
            - { call: "POST /ticket-orders/${o1}/pay", payload: {}, as: Guest, as_user_id: "g-c1@x.com" }
          trigger:
            - { call: "POST /ticket-orders/${o2}/pay", payload: {}, as: Guest, as_user_id: "g-c2@x.com", captures: { err: $.data.error_id } }
            - { call: "GET /faire-days/${d1}", payload: {}, as: Any, captures: { sold: $.data.tickets_sold_count } }
          assert:
            - "Second pay returns ERR_DAY_AT_CAPACITY (409)"
            - "FaireDay.tickets_sold_count == 1 (no partial minting)"

