# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3235_youth_league_charter_boundary_waivers_tournament_advancement
#
# Breadth probe over SCAFFOLD.yaml §1.1–§1.7. Corners already exercised by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as excluded_because stubs.
#
# Shared fixture conventions: charter prefix = clock 2026-10-15 -> league
# (season 2027) -> insurance 2027-01-01..2027-12-31 -> renewal -> APPROVE.
# Eligible player prefix: clock 2027-02-01 -> register -> BIRTH_CERTIFICATE +
# RESIDENCE_PROOF (2027-01-15) -> verify-eligibility. Divisions list order is
# pinned: index 2 == MAJOR.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: league_create_returns_all_fields_and_autocreates_five_divisions
        claim_type: Creation
        grounds: [entities.League, entities.Division, endpoints.POST_/leagues]
        distinguishing_aspect: "POST /leagues returns 201 with charter_status PROVISIONAL, total_team_count 0, version 1, system id/created_at/updated_at; the divisions list contains exactly the five standard divisions in pinned order with team_count 0."
        test_recipe:
          setup: ["Empty database; clock at default 2026-09-01T00:00:00Z."]
          setup_api_calls: []
          trigger:
            - call: "POST /leagues"
              payload: { league_name: "Cedar Falls LL", region_code: "CENTRAL", season_year: 2027 }
              as: DistrictAdministrator
              captures: { lg: $.data.id }
            - call: "GET /leagues/${lg}/divisions"
              payload: {}
              as: DistrictAdministrator
              captures: { div0: "$.data[0].division_code", div4: "$.data[4].division_code" }
          assert:
            - "League.${lg}.charter_status == PROVISIONAL and total_team_count == 0 and version == 1"
            - "League.${lg} has non-null id, created_at, updated_at"
            - "divisions list total_count == 5; ${div0} == TEE_BALL and ${div4} == SENIOR"
            - "Division TEE_BALL has min_league_age 4 and max_league_age 6; SENIOR has 15 and 16"

      - name: player_computed_fields_league_age_and_division_assignment
        claim_type: Computed Fields
        grounds: [entities.Player.fields.league_age, entities.Player.fields.division_id, calculations.league_age_determination]
        distinguishing_aspect: "league_age uses the Aug 31 cutoff: born 2015-09-01 in season 2027 -> 11 (MINOR); born 2015-08-31 -> 12 (MAJOR); auto-assigned division_id matches the covering standard division."
        test_recipe:
          setup: ["League CHARTERED via charter prefix; clock 2027-02-01."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-15T00:00:00Z" }
              as: DistrictAdministrator
            - call: "POST /leagues"
              payload: { league_name: "Cutoff LL", region_code: "WEST", season_year: 2027 }
              as: DistrictAdministrator
              captures: { lg: $.data.id }
            - call: "POST /leagues/${lg}/insurance-certificates"
              payload: { carrier_name: "LL-INS", coverage_start: "2027-01-01", coverage_end: "2027-12-31" }
              as: DistrictAdministrator
            - call: "POST /leagues/${lg}/charter-renewals"
              payload: { season_year: 2027 }
              as: LeagueAdministrator
              captures: { ren: $.data.id }
            - call: "POST /leagues/${lg}/charter-renewals/${ren}/decide"
              payload: { action: "APPROVE", late_fee_paid: false }
              as: DistrictAdministrator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-02-01T00:00:00Z" }
              as: DistrictAdministrator
            - call: "GET /leagues/${lg}/divisions"
              payload: {}
              as: LeagueAdministrator
              captures: { min_id: "$.data[1].id", maj_id: "$.data[2].id" }
          trigger:
            - call: "POST /leagues/${lg}/players"
              payload: { first_name: "Sep", last_name: "First", birth_date: "2015-09-01", residence_within_boundary: true, school_within_boundary: false, games_played: 3, games_scheduled: 5 }
              as: LeagueAdministrator
              captures: { pa: $.data.id, pa_age: $.data.league_age, pa_div: $.data.division_id }
            - call: "POST /leagues/${lg}/players"
              payload: { first_name: "Aug", last_name: "ThirtyOne", birth_date: "2015-08-31", residence_within_boundary: true, school_within_boundary: false, games_played: 3, games_scheduled: 5 }
              as: LeagueAdministrator
              captures: { pb: $.data.id, pb_age: $.data.league_age, pb_div: $.data.division_id }
          assert:
            - "${pa_age} == 11 and ${pa_div} == ${min_id} (born one day past the cutoff)"
            - "${pb_age} == 12 and ${pb_div} == ${maj_id} (born on the cutoff)"
            - "both players have eligibility_status PENDING and version 1"

      - name: player_age_outside_all_ranges_gets_null_division
        claim_type: Computed Fields
        grounds: [entities.Player.fields.division_id, errors.ERR_AGE_DIVISION_MISMATCH]
        distinguishing_aspect: "A 17-year-old (born 2010-01-01) matches no standard division; registration succeeds with division_id null and verify-eligibility fails ERR_AGE_DIVISION_MISMATCH."
        test_recipe:
          setup: ["League CHARTERED; clock 2027-02-01."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-15T00:00:00Z" }
              as: DistrictAdministrator
            - call: "POST /leagues"
              payload: { league_name: "Too Old LL", region_code: "WEST", season_year: 2027 }
              as: DistrictAdministrator
              captures: { lg: $.data.id }
            - call: "POST /leagues/${lg}/insurance-certificates"
              payload: { carrier_name: "LL-INS", coverage_start: "2027-01-01", coverage_end: "2027-12-31" }
              as: DistrictAdministrator
            - call: "POST /leagues/${lg}/charter-renewals"
              payload: { season_year: 2027 }
              as: LeagueAdministrator
              captures: { ren: $.data.id }
            - call: "POST /leagues/${lg}/charter-renewals/${ren}/decide"
              payload: { action: "APPROVE", late_fee_paid: false }
              as: DistrictAdministrator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-02-01T00:00:00Z" }
              as: DistrictAdministrator
          trigger:
            - call: "POST /leagues/${lg}/players"
              payload: { first_name: "Old", last_name: "Timer", birth_date: "2010-01-01", residence_within_boundary: true, school_within_boundary: false, games_played: 3, games_scheduled: 5 }
              as: LeagueAdministrator
              captures: { p1: $.data.id, dv: $.data.division_id, age: $.data.league_age }
            - call: "POST /leagues/${lg}/players/${p1}/eligibility-documents"
              payload: { doc_type: "BIRTH_CERTIFICATE", issued_date: "2010-01-03" }
              as: LeagueAdministrator
            - call: "POST /leagues/${lg}/players/${p1}/eligibility-documents"
              payload: { doc_type: "RESIDENCE_PROOF", issued_date: "2027-01-15" }
              as: LeagueAdministrator
            - call: "POST /leagues/${lg}/players/${p1}/verify-eligibility"
              payload: {}
              as: LeagueAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "${age} == 17 and ${dv} == null"
            - "${err} == ERR_AGE_DIVISION_MISMATCH"
            - "Player.${p1}.eligibility_status == PENDING"

      - name: eligibility_document_is_immutable_attestation
        claim_type: Immutability
        grounds: [entities.EligibilityDocument]
        distinguishing_aspect: "EligibilityDocument has common_fields false: no version/updated_at; no update/delete endpoint exists; a second POST appends rather than mutates."
        test_recipe:
          setup: ["League CHARTERED; clock 2027-02-01; player P1 registered."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-15T00:00:00Z" }
              as: DistrictAdministrator
            - call: "POST /leagues"
              payload: { league_name: "Docs LL", region_code: "WEST", season_year: 2027 }
              as: DistrictAdministrator
              captures: { lg: $.data.id }
            - call: "POST /leagues/${lg}/insurance-certificates"
              payload: { carrier_name: "LL-INS", coverage_start: "2027-01-01", coverage_end: "2027-12-31" }
              as: DistrictAdministrator
            - call: "POST /leagues/${lg}/charter-renewals"
              payload: { season_year: 2027 }
              as: LeagueAdministrator
              captures: { ren: $.data.id }
            - call: "POST /leagues/${lg}/charter-renewals/${ren}/decide"
              payload: { action: "APPROVE", late_fee_paid: false }
              as: DistrictAdministrator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-02-01T00:00:00Z" }
              as: DistrictAdministrator
            - call: "POST /leagues/${lg}/players"
              payload: { first_name: "Doc", last_name: "Holder", birth_date: "2015-03-10", residence_within_boundary: true, school_within_boundary: false, games_played: 3, games_scheduled: 5 }
              as: LeagueAdministrator
              captures: { p1: $.data.id }
          trigger:
            - call: "POST /leagues/${lg}/players/${p1}/eligibility-documents"
              payload: { doc_type: "RESIDENCE_PROOF", issued_date: "2027-01-15" }
              as: LeagueAdministrator
            - call: "POST /leagues/${lg}/players/${p1}/eligibility-documents"
              payload: { doc_type: "RESIDENCE_PROOF", issued_date: "2027-01-20" }
              as: LeagueAdministrator
          assert:
            - "GET /leagues/${lg}/players/${p1}/eligibility-documents returns 2 rows (both attestations coexist)"
            - "each document exposes id and created_at but no version field"

      - name: players_list_filters_by_division_and_eligibility
        claim_type: Listing
        grounds: ["endpoints.GET_/leagues/{leagueId}/players", response_envelope.pagination_fields]
        distinguishing_aspect: "Players list supports division_id and eligibility_status filters plus pagination: 3 players (2 ELIGIBLE, 1 PENDING); eligibility filter returns 2; limit=2&offset=2 returns the last page with total_count 3 and has_more false."
        test_recipe:
          setup: ["League CHARTERED; clock 2027-02-01; P1, P2 verified ELIGIBLE in MAJOR; P3 registered PENDING."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-15T00:00:00Z" }
              as: DistrictAdministrator
            - call: "POST /leagues"
              payload: { league_name: "List LL", region_code: "WEST", season_year: 2027 }
              as: DistrictAdministrator
              captures: { lg: $.data.id }
            - call: "POST /leagues/${lg}/insurance-certificates"
              payload: { carrier_name: "LL-INS", coverage_start: "2027-01-01", coverage_end: "2027-12-31" }
              as: DistrictAdministrator
            - call: "POST /leagues/${lg}/charter-renewals"
              payload: { season_year: 2027 }
              as: LeagueAdministrator
              captures: { ren: $.data.id }
            - call: "POST /leagues/${lg}/charter-renewals/${ren}/decide"
              payload: { action: "APPROVE", late_fee_paid: false }
              as: DistrictAdministrator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-02-01T00:00:00Z" }
              as: DistrictAdministrator
            - call: "GET /leagues/${lg}/divisions"
              payload: {}
              as: LeagueAdministrator
              captures: { maj: "$.data[2].id" }
            - call: "POST /leagues/${lg}/players"
              payload: { first_name: "P", last_name: "One", birth_date: "2015-03-10", residence_within_boundary: true, school_within_boundary: false, games_played: 3, games_scheduled: 5 }
              as: LeagueAdministrator
              captures: { p1: $.data.id }
            - call: "POST /leagues/${lg}/players/${p1}/eligibility-documents"
              payload: { doc_type: "BIRTH_CERTIFICATE", issued_date: "2015-03-12" }
              as: LeagueAdministrator
            - call: "POST /leagues/${lg}/players/${p1}/eligibility-documents"
              payload: { doc_type: "RESIDENCE_PROOF", issued_date: "2027-01-15" }
              as: LeagueAdministrator
            - call: "POST /leagues/${lg}/players/${p1}/verify-eligibility"
              payload: {}
              as: LeagueAdministrator
            - call: "POST /leagues/${lg}/players"
              payload: { first_name: "P", last_name: "Two", birth_date: "2015-04-11", residence_within_boundary: true, school_within_boundary: false, games_played: 3, games_scheduled: 5 }
              as: LeagueAdministrator
              captures: { p2: $.data.id }
            - call: "POST /leagues/${lg}/players/${p2}/eligibility-documents"
              payload: { doc_type: "BIRTH_CERTIFICATE", issued_date: "2015-04-12" }
              as: LeagueAdministrator
            - call: "POST /leagues/${lg}/players/${p2}/eligibility-documents"
              payload: { doc_type: "RESIDENCE_PROOF", issued_date: "2027-01-15" }
              as: LeagueAdministrator
            - call: "POST /leagues/${lg}/players/${p2}/verify-eligibility"
              payload: {}
              as: LeagueAdministrator
            - call: "POST /leagues/${lg}/players"
              payload: { first_name: "P", last_name: "Three", birth_date: "2015-05-12", residence_within_boundary: true, school_within_boundary: false, games_played: 3, games_scheduled: 5 }
              as: LeagueAdministrator
          trigger:
            - call: "GET /leagues/${lg}/players"
              payload: { eligibility_status: "ELIGIBLE" }
              as: TournamentDirector
            - call: "GET /leagues/${lg}/players"
              payload: { division_id: "${maj}", limit: 2, offset: 2 }
              as: OfficialScorer
          assert:
            - "filter eligibility_status=ELIGIBLE returns exactly 2 rows with total_count 2"
            - "division filter with limit=2 offset=2 returns 1 row, total_count 3, has_more false"
            - "unfiltered list returns total_count 3 with default limit 10"

      - name: get_unknown_league_returns_league_not_found
        claim_type: Not Found
        grounds: ["endpoints.GET_/leagues/{leagueId}", errors.ERR_LEAGUE_NOT_FOUND]
        distinguishing_aspect: "A syntactically valid but unknown leagueId yields ERR_LEAGUE_NOT_FOUND (404), not a generic 400."
        test_recipe:
          setup: ["Empty database; clock at default."]
          setup_api_calls: []
          trigger:
            - call: "GET /leagues/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: LeagueAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_LEAGUE_NOT_FOUND with http 404"

      - name: renewal_create_missing_season_year_returns_invalid_request
        claim_type: Required Fields
        grounds: ["endpoints.POST_/leagues/{leagueId}/charter-renewals", errors.ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting required season_year from the renewal submission is a 400 ERR_INVALID_REQUEST, distinct from any window or state error."
        test_recipe:
          setup: ["League created (PROVISIONAL) at clock 2026-10-15."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-15T00:00:00Z" }
              as: DistrictAdministrator
            - call: "POST /leagues"
              payload: { league_name: "Required LL", region_code: "WEST", season_year: 2027 }
              as: DistrictAdministrator
              captures: { lg: $.data.id }
          trigger:
            - call: "POST /leagues/${lg}/charter-renewals"
              payload: {}
              as: LeagueAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST with http 400"

      - name: waiver_create_invalid_window_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.BoundaryWaiver.fields.valid_until, errors.ERR_INVALID_REQUEST]
        distinguishing_aspect: "valid_until <= valid_from violates the window constraint at creation: 400 ERR_INVALID_REQUEST before any overlap logic runs."
        test_recipe:
          setup: ["League CHARTERED; clock 2027-02-01; player P1 registered."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-15T00:00:00Z" }
              as: DistrictAdministrator
            - call: "POST /leagues"
              payload: { league_name: "Window LL", region_code: "WEST", season_year: 2027 }
              as: DistrictAdministrator
              captures: { lg: $.data.id }
            - call: "POST /leagues/${lg}/insurance-certificates"
              payload: { carrier_name: "LL-INS", coverage_start: "2027-01-01", coverage_end: "2027-12-31" }
              as: DistrictAdministrator
            - call: "POST /leagues/${lg}/charter-renewals"
              payload: { season_year: 2027 }
              as: LeagueAdministrator
              captures: { ren: $.data.id }
            - call: "POST /leagues/${lg}/charter-renewals/${ren}/decide"
              payload: { action: "APPROVE", late_fee_paid: false }
              as: DistrictAdministrator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-02-01T00:00:00Z" }
              as: DistrictAdministrator
            - call: "POST /leagues/${lg}/players"
              payload: { first_name: "Wi", last_name: "Ndow", birth_date: "2015-03-10", residence_within_boundary: true, school_within_boundary: false, games_played: 3, games_scheduled: 5 }
              as: LeagueAdministrator
              captures: { p1: $.data.id }
            - call: "GET /leagues/${lg}"
              payload: {}
              as: LeagueAdministrator
              captures: { lgv: $.data.version }
          trigger:
            - call: "POST /leagues/${lg}/boundary-waivers"
              payload: { player_id: "${p1}", waiver_type: "RESIDENCY_BOUNDARY", reason: "bad window", valid_from: "2027-06-01", valid_until: "2027-06-01", expected_league_version: "${lgv}" }
              as: LeagueAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST (valid_until must be > valid_from)"
            - "League.${lg}.version unchanged (failed create does not bump the OCC parent)"

      - name: division_patch_updates_total_team_count
        claim_type: Computed Fields
        grounds: [entities.League.fields.total_team_count, "endpoints.PATCH_/leagues/{leagueId}/divisions/{divisionId}"]
        distinguishing_aspect: "PATCHing team_count on MINOR (2) and MAJOR (3) reconciles League.total_team_count to 5 and bumps League.version."
        test_recipe:
          setup: ["League created (PROVISIONAL) at clock 2026-10-15; divisions auto-created."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-15T00:00:00Z" }
              as: DistrictAdministrator
            - call: "POST /leagues"
              payload: { league_name: "Teams LL", region_code: "WEST", season_year: 2027 }
              as: DistrictAdministrator
              captures: { lg: $.data.id }
            - call: "GET /leagues/${lg}/divisions"
              payload: {}
              as: LeagueAdministrator
              captures: { min: "$.data[1].id", maj: "$.data[2].id" }
          trigger:
            - call: "PATCH /leagues/${lg}/divisions/${min}"
              payload: { team_count: 2 }
              as: LeagueAdministrator
            - call: "PATCH /leagues/${lg}/divisions/${maj}"
              payload: { team_count: 3 }
              as: LeagueAdministrator
            - call: "GET /leagues/${lg}"
              payload: {}
              as: LeagueAdministrator
              captures: { tot: $.data.total_team_count, ver: $.data.version }
          assert:
            - "${tot} == 5"
            - "${ver} == 3 (create + two PATCH bumps)"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: renewal_decide_on_approved_returns_not_pending
        claim_type: invalid_transition
        grounds: [state_machines.CharterRenewal, errors.ERR_RENEWAL_NOT_PENDING]
        distinguishing_aspect: "decide on an already-APPROVED renewal is rejected ERR_RENEWAL_NOT_PENDING — terminal states accept no further decide actions."
        test_recipe:
          setup: ["League CHARTERED via charter prefix (renewal already APPROVED)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-15T00:00:00Z" }
              as: DistrictAdministrator
            - call: "POST /leagues"
              payload: { league_name: "Terminal LL", region_code: "WEST", season_year: 2027 }
              as: DistrictAdministrator
              captures: { lg: $.data.id }
            - call: "POST /leagues/${lg}/insurance-certificates"
              payload: { carrier_name: "LL-INS", coverage_start: "2027-01-01", coverage_end: "2027-12-31" }
              as: DistrictAdministrator
            - call: "POST /leagues/${lg}/charter-renewals"
              payload: { season_year: 2027 }
              as: LeagueAdministrator
              captures: { ren: $.data.id }
            - call: "POST /leagues/${lg}/charter-renewals/${ren}/decide"
              payload: { action: "APPROVE", late_fee_paid: false }
              as: DistrictAdministrator
          trigger:
            - call: "POST /leagues/${lg}/charter-renewals/${ren}/decide"
              payload: { action: "REJECT" }
              as: DistrictAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_RENEWAL_NOT_PENDING"
            - "CharterRenewal.${ren}.status == APPROVED (unchanged)"

      - name: waiver_revoke_from_pending_rejected_and_approved_revoke_works
        claim_type: invalid_transition
        grounds: [state_machines.BoundaryWaiver, errors.ERR_WAIVER_NOT_PENDING]
        distinguishing_aspect: "REVOKE is only legal from APPROVED: REVOKE on a PENDING waiver fails ERR_WAIVER_NOT_PENDING; after APPROVE, REVOKE succeeds and a further APPROVE fails (REVOKED is terminal)."
        test_recipe:
          setup: ["League CHARTERED; clock 2027-02-01; player P1 registered; waiver W PENDING."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-15T00:00:00Z" }
              as: DistrictAdministrator
            - call: "POST /leagues"
              payload: { league_name: "Waiver State LL", region_code: "WEST", season_year: 2027 }
              as: DistrictAdministrator
              captures: { lg: $.data.id }
            - call: "POST /leagues/${lg}/insurance-certificates"
              payload: { carrier_name: "LL-INS", coverage_start: "2027-01-01", coverage_end: "2027-12-31" }
              as: DistrictAdministrator
            - call: "POST /leagues/${lg}/charter-renewals"
              payload: { season_year: 2027 }
              as: LeagueAdministrator
              captures: { ren: $.data.id }
            - call: "POST /leagues/${lg}/charter-renewals/${ren}/decide"
              payload: { action: "APPROVE", late_fee_paid: false }
              as: DistrictAdministrator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-02-01T00:00:00Z" }
              as: DistrictAdministrator
            - call: "POST /leagues/${lg}/players"
              payload: { first_name: "Wa", last_name: "Iver", birth_date: "2015-03-10", residence_within_boundary: true, school_within_boundary: false, games_played: 3, games_scheduled: 5 }
              as: LeagueAdministrator
              captures: { p1: $.data.id }
            - call: "GET /leagues/${lg}"
              payload: {}
              as: LeagueAdministrator
              captures: { lgv: $.data.version }
            - call: "POST /leagues/${lg}/boundary-waivers"
              payload: { player_id: "${p1}", waiver_type: "RESIDENCY_BOUNDARY", reason: "move pending", valid_from: "2027-01-01", valid_until: "2027-12-01", expected_league_version: "${lgv}" }
              as: LeagueAdministrator
              captures: { w: $.data.id }
          trigger:
            - call: "POST /leagues/${lg}/boundary-waivers/${w}/decide"
              payload: { action: "REVOKE" }
              as: DistrictAdministrator
              captures: { err1: $.data.error_id }
            - call: "POST /leagues/${lg}/boundary-waivers/${w}/decide"
              payload: { action: "APPROVE" }
              as: DistrictAdministrator
            - call: "POST /leagues/${lg}/boundary-waivers/${w}/decide"
              payload: { action: "REVOKE" }
              as: DistrictAdministrator
              captures: { st2: $.data.status }
            - call: "POST /leagues/${lg}/boundary-waivers/${w}/decide"
