      - name: award_of_a_draft_claim_rejected_as_not_scored
        claim_type: precondition_enforcement
        grounds:
          - state_machines.PlaClaim.assessment_status.transitions.SCORED_to_AWARDED
          - validations[priority 15]
          - errors[ERR_CLAIM_NOT_SCORED]
          - endpoints[POST /pla-claims/{claim_id}/award]
        distinguishing_aspect: |
          POST /pla-claims/{claim_id}/award on a DRAFT claim returns HTTP 409
          ERR_CLAIM_NOT_SCORED — not ERR_CLAIM_ALREADY_TERMINAL (priority 14 passes
          because DRAFT is not terminal) and not ERR_STALE_STUDENT_VERSION
          (priority 12 passes because the version supplied is current) — and the
          Student ledger stays all zeros.
