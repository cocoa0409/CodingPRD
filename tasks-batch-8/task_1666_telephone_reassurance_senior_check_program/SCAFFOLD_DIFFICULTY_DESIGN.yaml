            - { call: "POST /api/call-assignments", payload: { participant_id: "${p_id}", volunteer_id: "${v_id}", scheduled_date: "2026-08-04", window_start: "09:00", window_end: "09:30" }, as: ProgramCoordinator, captures: { a3: $.data.id } }
