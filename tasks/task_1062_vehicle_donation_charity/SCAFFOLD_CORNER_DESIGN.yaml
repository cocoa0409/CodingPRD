            - call: "POST /api/charities"
              payload: { name: "Batch State Trust", ein: "80-0000072", state_code: "CA", remittance_fee_pct: 0.10 }
              as: ProgramAdmin
              captures: { cbs: $.data.id }
            - call: "POST /api/donors"
              payload: { email: "bst@example.com", full_name: "Bat St", state_code: "CA" }
              as: IntakeAgent
              captures: { dn1: $.data.id }
            - call: "POST /api/venues"
              payload: { name: "Closed Yard", venue_type: "SALVAGE", state_code: "CA" }
              as: ProgramAdmin
              captures: { vsus: $.data.id }
            - call: "POST /api/venues/${vsus}/suspend"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/donations"
              payload: { donor_id: "${dn1}", charity_id: "${cbs}", intake_channel: "WEB", declared_condition: "GOOD", pickup_required: false }
              as: IntakeAgent
              captures: { dbs: $.data.id }
            - call: "POST /api/donations/${dbs}/accept"
              payload: {}
              as: IntakeAgent
            - call: "POST /api/donations/${dbs}/receive-dropoff"
              payload: {}
              as: IntakeAgent
            - call: "POST /api/remittance-batches"
              payload: { charity_id: "${cbs}", period_start_utc: "2026-07-01T00:00:00Z", period_end_utc: "2026-08-01T00:00:00Z" }
              as: FinanceOfficer
              as_user_id: "fo-alice"
              captures: { bbs: $.data.id, bbs_v: $.data.version }
          trigger:
            - call: "POST /api/remittance-batches/${bbs}/pay"
              payload: { payment_reference: "ACH-9001", expected_batch_version: "${bbs_v}" }
              as: FinanceOfficer
              as_user_id: "fo-bob"
              captures: { e_batch: $.data.error_id }
            - call: "POST /api/donations/${dbs}/withhold-payout"
              payload: { reason: "donor under investigation" }
              as: ProgramAdmin
            - call: "POST /api/donations/${dbs}/withhold-payout"
              payload: { reason: "still under investigation" }
              as: ProgramAdmin
              captures: { e_payout: $.data.error_id }
            - call: "POST /api/auction-lots"
              payload: { donation_id: "${dbs}", venue_id: "${vsus}", lot_number: "L-BS", reserve_price_cents: 1000 }
              as: AuctionManager
              captures: { e_venue: $.data.error_id }
          assert:
            - "the pay on the OPEN batch returns HTTP 409 with error_id ERR_INVALID_BATCH_STATE"
            - "RemittanceBatch.${bbs}.status == OPEN and paid_by_user_id is null"
            - "the first withhold returns HTTP 200 with Donation.${dbs}.payout_status == WITHHELD"
            - "the second withhold returns HTTP 409 with error_id ERR_INVALID_PAYOUT_STATE"
            - "GET /api/donations/${dbs}/ledger-entries returns an empty array because net_to_charity_cents was 0 at withhold time"
            - "the lot create at the suspended venue returns HTTP 409 with error_id ERR_VENUE_SUSPENDED"
            - "GET /api/auction-lots with venue_id == ${vsus} returns an empty array"
