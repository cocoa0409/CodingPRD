            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T00:00:00Z" }, as: HRAdmin }
            - { call: "GET /api/budgets/${bud}", payload: {}, as: FinanceAdmin, captures: { bud_v2: $.data.version, posture: $.data.posture } }
          trigger:
            - { call: "POST /api/budgets/${bud}/adjustments", payload: { delta_allocated_points: 5000, reason: "top up", expected_budget_version: "${bud_v2}" }, as: FinanceAdmin, captures: { err: $.data.error_id } }
          assert:
            - "${posture} == CLOSED"
            - "${err} == ERR_BUDGET_CLOSED"

