# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Cross-references SCAFFOLD.yaml §1.1–§1.7 against the nine §0.5 Difficulty Rules.
# 9 rule_ids × 2 instances = 18 instances.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: draw_release_provisional_vs_final_amounts_on_draw
        grounds:
          - calculations.draw_release_amounts
          - entities.Draw.fields.gross_amount_cents
          - entities.Draw.fields.retainage_cents
          - entities.Draw.fields.net_release_cents
          - state_machines.Draw.REQUESTED_to_APPROVED
        distinguishing_aspect: |
          On the Draw entity domain, the provisional_at_request variant freezes
          gross/retainage/net at the contract_value AS OF draw creation; a change
          order approved between request and approval does NOT recompute the draw,
          so the final_at_approval variant moves exactly the frozen amounts.
        test_recipe:
          setup:
            - "Project IN_PROGRESS, contract_value 600000, escrow FUNDED available 600000."
            - "Milestone seq 1 (release_pct 0.40) PENDING; a draw is requested on it (gross 240000, retainage 24000, net 216000)."
            - "An APPROVED change order of +100000 is applied AFTER the draw request (contract_value -> 700000) but BEFORE draw approval."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /homeowners"
              payload: { full_name: "Hattie Owner", email: "ho_dv1@x.com" }
              as: Anonymous
              captures: { ho_id: $.data.id }
            - call: "POST /contractors"
              payload: { legal_name: "Acme Build", trade: "GENERAL", license_number: "L-1", license_expiry: "2027-01-01T00:00:00Z", insurance_coverage_cents: 5000000 }
              as: Anonymous
              captures: { c_id: $.data.id }
            - call: "POST /contractors/${c_id}/qualify"
              payload: {}
              as: PlatformAdmin
            - call: "POST /projects"
              payload: { homeowner_id: "${ho_id}", title: "Kitchen", budget_cap_cents: 1000000, bid_deadline: "2026-07-01T00:00:00Z", required_trade: "GENERAL", min_rating: 0 }
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { p_id: $.data.id }
            - call: "POST /projects/${p_id}/scope-line-items"
              payload: { description: "Flooring", quantity: 100, unit: "SQFT", estimated_unit_cost_cents: 1000 }
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { s1_id: $.data.id }
            - call: "POST /projects/${p_id}/scope-line-items"
              payload: { description: "Cabinets", quantity: 1, unit: "LUMP", estimated_unit_cost_cents: 500000 }
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { s2_id: $.data.id }
            - call: "POST /projects/${p_id}/milestones"
              payload: { sequence: 1, title: "Rough-in", release_pct: 0.40 }
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { m1_id: $.data.id }
            - call: "POST /projects/${p_id}/milestones"
              payload: { sequence: 2, title: "Final", release_pct: 0.60 }
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { m2_id: $.data.id }
            - call: "POST /projects/${p_id}/open"
              payload: {}
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { p_ver_open: $.data.version }
            - call: "POST /bids"
              payload: { project_id: "${p_id}", contractor_id: "${c_id}", duration_days: 30 }
              as: Contractor
              as_user_id: "${c_id}"
              captures: { bid_id: $.data.id }
            - call: "POST /bids/${bid_id}/line-items"
              payload: { scope_line_item_id: "${s1_id}", quantity: 100, unit_price_cents: 1200 }
              as: Contractor
              as_user_id: "${c_id}"
            - call: "POST /bids/${bid_id}/line-items"
              payload: { scope_line_item_id: "${s2_id}", quantity: 1, unit_price_cents: 480000 }
              as: Contractor
              as_user_id: "${c_id}"
            - call: "POST /bids/${bid_id}/submit"
              payload: {}
              as: Contractor
              as_user_id: "${c_id}"
            - call: "POST /projects/${p_id}/award"
              payload: { bid_id: "${bid_id}", expected_project_version: "${p_ver_open}" }
              as: Homeowner
              as_user_id: "${ho_id}"
            - call: "GET /escrows"
              payload: {}
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { esc_id: "$.data[0].id" }
            - call: "POST /escrows/${esc_id}/fund"
              payload: { deposit_cents: 600000 }
              as: EscrowAgent
            - call: "POST /draws"
              payload: { project_id: "${p_id}", milestone_id: "${m1_id}", conditional_waiver_amount_cents: 216000 }
              as: Contractor
              as_user_id: "${c_id}"
              captures: { draw1_id: $.data.id }
            - call: "POST /change-orders"
              payload: { project_id: "${p_id}", bid_id: "${bid_id}", description: "Add island", delta_cents: 100000 }
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { co_id: $.data.id }
            - call: "GET /bids/${bid_id}"
              payload: {}
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { bid_ver: $.data.version }
            - call: "POST /change-orders/${co_id}/approve"
              payload: { expected_bid_version: "${bid_ver}" }
              as: Homeowner
              as_user_id: "${ho_id}"
          trigger:
            - call: "POST /draws/${draw1_id}/approve"
              payload: {}
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { d_gross: $.data.gross_amount_cents, d_net: $.data.net_release_cents }
          assert:
            - "Draw.${draw1_id}.gross_amount_cents == 240000"
            - "Draw.${draw1_id}.retainage_cents == 24000"
            - "Draw.${draw1_id}.net_release_cents == 216000"
            - "Project.${p_id}.contract_value_cents == 700000"
            - "Escrow.${esc_id}.retained_cents == 24000"

      - name: bid_rank_estimated_vs_award_persistence_on_bid
        grounds:
          - calculations.bid_rank_score
          - entities.Bid.fields.rank_score
          - state_machines.Project.OPEN_FOR_BIDS_to_AWARDED
        distinguishing_aspect: |
          On the Bid entity domain, the estimated_rank variant (GET bid-comparison)
          computes rank_score over the live SUBMITTED pool without persisting it,
          while the award_rank variant persists rank_score on each pooled bid at
          award time — a different entity domain from draw_release_amounts (Draw).
        test_recipe:
          setup:
            - "Project OPEN_FOR_BIDS with three SUBMITTED bids P(600000,30d,rating5), Q(700000,20d,rating4), R(650000,40d,rating3)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /homeowners"
              payload: { full_name: "Rita Rank", email: "ho_dv2@x.com" }
              as: Anonymous
              captures: { ho_id: $.data.id }
            - call: "POST /contractors"
              payload: { legal_name: "P Co", trade: "GENERAL", license_number: "LP", license_expiry: "2027-01-01T00:00:00Z", insurance_coverage_cents: 5000000 }
              as: Anonymous
              captures: { cp_id: $.data.id }
            - call: "POST /contractors/${cp_id}/qualify"
              payload: {}
              as: PlatformAdmin
            - call: "POST /contractors"
              payload: { legal_name: "Q Co", trade: "GENERAL", license_number: "LQ", license_expiry: "2027-01-01T00:00:00Z", insurance_coverage_cents: 5000000 }
              as: Anonymous
              captures: { cq_id: $.data.id }
            - call: "POST /contractors/${cq_id}/qualify"
              payload: {}
              as: PlatformAdmin
            - call: "POST /contractors"
              payload: { legal_name: "R Co", trade: "GENERAL", license_number: "LR", license_expiry: "2027-01-01T00:00:00Z", insurance_coverage_cents: 5000000 }
              as: Anonymous
              captures: { cr_id: $.data.id }
            - call: "POST /contractors/${cr_id}/qualify"
              payload: {}
              as: PlatformAdmin
            - call: "POST /projects"
              payload: { homeowner_id: "${ho_id}", title: "Bath", budget_cap_cents: 1000000, bid_deadline: "2026-07-01T00:00:00Z", required_trade: "GENERAL", min_rating: 0 }
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { p_id: $.data.id }
            - call: "POST /projects/${p_id}/scope-line-items"
              payload: { description: "Whole job", quantity: 1, unit: "LUMP", estimated_unit_cost_cents: 600000 }
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { s1_id: $.data.id }
            - call: "POST /projects/${p_id}/milestones"
              payload: { sequence: 1, title: "Done", release_pct: 1.0 }
              as: Homeowner
              as_user_id: "${ho_id}"
            - call: "POST /projects/${p_id}/open"
              payload: {}
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { p_ver_open: $.data.version }
            # NOTE: ratings on cp/cq/cr are 0 here; for this instance assert the
            # NORMALIZED price/duration contribution only (rating equal across pool
            # is impossible without prior completed projects, so we test the
            # estimated vs award persistence behaviour, not exact rating term).
            - call: "POST /bids"
              payload: { project_id: "${p_id}", contractor_id: "${cp_id}", duration_days: 30 }
              as: Contractor
              as_user_id: "${cp_id}"
              captures: { bp_id: $.data.id }
            - call: "POST /bids/${bp_id}/line-items"
              payload: { scope_line_item_id: "${s1_id}", quantity: 1, unit_price_cents: 600000 }
              as: Contractor
              as_user_id: "${cp_id}"
            - call: "POST /bids/${bp_id}/submit"
              payload: {}
              as: Contractor
              as_user_id: "${cp_id}"
            - call: "POST /bids"
              payload: { project_id: "${p_id}", contractor_id: "${cq_id}", duration_days: 20 }
              as: Contractor
              as_user_id: "${cq_id}"
              captures: { bq_id: $.data.id }
            - call: "POST /bids/${bq_id}/line-items"
              payload: { scope_line_item_id: "${s1_id}", quantity: 1, unit_price_cents: 700000 }
              as: Contractor
              as_user_id: "${cq_id}"
            - call: "POST /bids/${bq_id}/submit"
              payload: {}
              as: Contractor
              as_user_id: "${cq_id}"
            - call: "POST /bids"
              payload: { project_id: "${p_id}", contractor_id: "${cr_id}", duration_days: 40 }
              as: Contractor
              as_user_id: "${cr_id}"
              captures: { br_id: $.data.id }
            - call: "POST /bids/${br_id}/line-items"
              payload: { scope_line_item_id: "${s1_id}", quantity: 1, unit_price_cents: 650000 }
              as: Contractor
              as_user_id: "${cr_id}"
            - call: "POST /bids/${br_id}/submit"
              payload: {}
              as: Contractor
              as_user_id: "${cr_id}"
          trigger:
            - call: "GET /projects/${p_id}/bid-comparison"
              payload: {}
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { top_id: "$.data[0].id" }
            - call: "POST /projects/${p_id}/award"
              payload: { bid_id: "${bp_id}", expected_project_version: "${p_ver_open}" }
              as: Homeowner
              as_user_id: "${ho_id}"
          assert:
            # all three contractors have rating 0 -> rating_norm == 1.0 for all,
            # so rating term is identical and ranking is decided by price+duration.
            # P: price_norm 0, dur_norm (30-20)/20=0.5 -> 0.5*0 + 0.3*0.5 + 0.2*1.0 = 0.35
            # Q: price_norm 1, dur_norm 0           -> 0.5*1 + 0   + 0.2*1.0 = 0.70
            # R: price_norm 0.5, dur_norm 1.0       -> 0.25 + 0.30 + 0.20    = 0.75
            - "GET bid-comparison data[0].id == ${bp_id} (lowest rank_score, estimated_rank, not persisted)"
            - "Bid.${bp_id}.rank_score == 0.35 after award (award_rank persisted)"
            - "Bid.${bq_id}.rank_score == 0.70 after award"
            - "Bid.${br_id}.rank_score == 0.75 after award"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: bid_rank_three_input_nonlinear_normalization
        grounds:
          - calculations.bid_rank_score
          - entities.Bid.fields.total_cents
          - entities.Bid.fields.duration_days
          - entities.Contractor.fields.average_rating
        distinguishing_aspect: |
          Mode (a): rank_score is a formula with three inputs (price, duration,
          rating) each pool-normalized then weight-combined — non-linear because
          each norm depends on pool min/max, not the bid alone.
        test_recipe:
          setup:
            - "Project OPEN_FOR_BIDS, two SUBMITTED bids: A(500000,10d), B(600000,30d), both contractors rating 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /homeowners"
              payload: { full_name: "Cara Combo", email: "ho_cf1@x.com" }
              as: Anonymous
              captures: { ho_id: $.data.id }
            - call: "POST /contractors"
              payload: { legal_name: "A Co", trade: "GENERAL", license_number: "CA", license_expiry: "2027-01-01T00:00:00Z", insurance_coverage_cents: 5000000 }
              as: Anonymous
              captures: { ca_id: $.data.id }
            - call: "POST /contractors/${ca_id}/qualify"
              payload: {}
              as: PlatformAdmin
            - call: "POST /contractors"
              payload: { legal_name: "B Co", trade: "GENERAL", license_number: "CB", license_expiry: "2027-01-01T00:00:00Z", insurance_coverage_cents: 5000000 }
              as: Anonymous
              captures: { cb_id: $.data.id }
            - call: "POST /contractors/${cb_id}/qualify"
              payload: {}
              as: PlatformAdmin
            - call: "POST /projects"
              payload: { homeowner_id: "${ho_id}", title: "Deck", budget_cap_cents: 1000000, bid_deadline: "2026-07-01T00:00:00Z", required_trade: "GENERAL", min_rating: 0 }
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { p_id: $.data.id }
            - call: "POST /projects/${p_id}/scope-line-items"
              payload: { description: "Deck", quantity: 1, unit: "LUMP", estimated_unit_cost_cents: 550000 }
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { s1_id: $.data.id }
            - call: "POST /projects/${p_id}/milestones"
              payload: { sequence: 1, title: "Done", release_pct: 1.0 }
              as: Homeowner
              as_user_id: "${ho_id}"
            - call: "POST /projects/${p_id}/open"
              payload: {}
              as: Homeowner
              as_user_id: "${ho_id}"
            - call: "POST /bids"
              payload: { project_id: "${p_id}", contractor_id: "${ca_id}", duration_days: 10 }
              as: Contractor
              as_user_id: "${ca_id}"
              captures: { ba_id: $.data.id }
            - call: "POST /bids/${ba_id}/line-items"
              payload: { scope_line_item_id: "${s1_id}", quantity: 1, unit_price_cents: 500000 }
              as: Contractor
              as_user_id: "${ca_id}"
            - call: "POST /bids/${ba_id}/submit"
              payload: {}
              as: Contractor
              as_user_id: "${ca_id}"
            - call: "POST /bids"
              payload: { project_id: "${p_id}", contractor_id: "${cb_id}", duration_days: 30 }
              as: Contractor
              as_user_id: "${cb_id}"
              captures: { bb_id: $.data.id }
            - call: "POST /bids/${bb_id}/line-items"
              payload: { scope_line_item_id: "${s1_id}", quantity: 1, unit_price_cents: 600000 }
              as: Contractor
              as_user_id: "${cb_id}"
            - call: "POST /bids/${bb_id}/submit"
              payload: {}
              as: Contractor
              as_user_id: "${cb_id}"
          trigger:
            - call: "GET /projects/${p_id}/bid-comparison"
              payload: {}
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { rank0: "$.data[0].rank_score", rank1: "$.data[1].rank_score" }
          assert:
            # both ratings 0 -> rating_norm 1.0 each.
            # A: price_norm 0, dur_norm 0 -> 0.5*0+0.3*0+0.2*1.0 = 0.20
            # B: price_norm 1, dur_norm 1 -> 0.5*1+0.3*1+0.2*1.0 = 1.00
            - "bid-comparison data[0].rank_score == 0.20 (bid A, lowest)"
            - "bid-comparison data[1].rank_score == 1.00 (bid B)"

      - name: draw_retainage_round_then_subtract_order
        grounds:
          - calculations.draw_release_amounts
          - entities.Draw.fields.gross_amount_cents
          - entities.Draw.fields.retainage_cents
          - entities.Draw.fields.net_release_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — retainage is rounded
          (round_half_up of gross*0.10) THEN subtracted from gross; with gross
          12345 the pinned order yields net 11111, whereas subtract-then-round
          would not produce an integer at all. The scaffold pins round-then-subtract.
        test_recipe:
          setup:
            - "Project IN_PROGRESS, contract_value 123450, milestone seq1 release_pct 0.10, seq2 0.90, escrow FUNDED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /homeowners"
              payload: { full_name: "Ria Round", email: "ho_cf2@x.com" }
              as: Anonymous
              captures: { ho_id: $.data.id }
            - call: "POST /contractors"
              payload: { legal_name: "Round Co", trade: "GENERAL", license_number: "RC", license_expiry: "2027-01-01T00:00:00Z", insurance_coverage_cents: 5000000 }
              as: Anonymous
              captures: { c_id: $.data.id }
            - call: "POST /contractors/${c_id}/qualify"
              payload: {}
              as: PlatformAdmin
            - call: "POST /projects"
              payload: { homeowner_id: "${ho_id}", title: "Reno", budget_cap_cents: 200000, bid_deadline: "2026-07-01T00:00:00Z", required_trade: "GENERAL", min_rating: 0 }
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { p_id: $.data.id }
            - call: "POST /projects/${p_id}/scope-line-items"
              payload: { description: "Job", quantity: 1, unit: "LUMP", estimated_unit_cost_cents: 123450 }
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { s1_id: $.data.id }
            - call: "POST /projects/${p_id}/milestones"
              payload: { sequence: 1, title: "Phase 1", release_pct: 0.10 }
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { m1_id: $.data.id }
            - call: "POST /projects/${p_id}/milestones"
              payload: { sequence: 2, title: "Phase 2", release_pct: 0.90 }
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { m2_id: $.data.id }
            - call: "POST /projects/${p_id}/open"
              payload: {}
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { p_ver_open: $.data.version }
            - call: "POST /bids"
              payload: { project_id: "${p_id}", contractor_id: "${c_id}", duration_days: 30 }
              as: Contractor
              as_user_id: "${c_id}"
              captures: { bid_id: $.data.id }
            - call: "POST /bids/${bid_id}/line-items"
              payload: { scope_line_item_id: "${s1_id}", quantity: 1, unit_price_cents: 123450 }
              as: Contractor
              as_user_id: "${c_id}"
            - call: "POST /bids/${bid_id}/submit"
              payload: {}
              as: Contractor
              as_user_id: "${c_id}"
            - call: "POST /projects/${p_id}/award"
              payload: { bid_id: "${bid_id}", expected_project_version: "${p_ver_open}" }
              as: Homeowner
              as_user_id: "${ho_id}"
            - call: "GET /escrows"
              payload: {}
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { esc_id: "$.data[0].id" }
            - call: "POST /escrows/${esc_id}/fund"
              payload: { deposit_cents: 123450 }
              as: EscrowAgent
          trigger:
            # gross seq1 = round_half_up(123450 * 0.10) = round_half_up(12345.0) = 12345
            # retainage = round_half_up(12345 * 0.10) = round_half_up(1234.5) = 1235
            # net = 12345 - 1235 = 11110
            - call: "POST /draws"
              payload: { project_id: "${p_id}", milestone_id: "${m1_id}", conditional_waiver_amount_cents: 11110 }
              as: Contractor
              as_user_id: "${c_id}"
              captures: { draw_id: $.data.id, g: $.data.gross_amount_cents, r: $.data.retainage_cents, n: $.data.net_release_cents }
          assert:
            - "Draw.${draw_id}.gross_amount_cents == 12345"
            - "Draw.${draw_id}.retainage_cents == 1235"
            - "Draw.${draw_id}.net_release_cents == 11110"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: bid_cyclic_submitted_revising_submitted_loop
        grounds:
          - state_machines.Bid.SUBMITTED_to_REVISING
          - state_machines.Bid.REVISING_to_SUBMITTED
          - entities.Bid.fields.total_cents
        distinguishing_aspect: |
          The Bid machine is cyclic: SUBMITTED -> REVISING -> SUBMITTED, and
          total_cents is recomputed on the return SUBMIT — a non-linear shape on
          the Bid entity (distinct from the Draw branching machine below).
        test_recipe:
          setup:
            - "Project OPEN_FOR_BIDS, contractor QUALIFIED, bid SUBMITTED with total 600000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /homeowners"
              payload: { full_name: "Cyril Cycle", email: "ho_nl1@x.com" }
              as: Anonymous
              captures: { ho_id: $.data.id }
            - call: "POST /contractors"
              payload: { legal_name: "Loop Co", trade: "GENERAL", license_number: "LC", license_expiry: "2027-01-01T00:00:00Z", insurance_coverage_cents: 5000000 }
              as: Anonymous
              captures: { c_id: $.data.id }
            - call: "POST /contractors/${c_id}/qualify"
              payload: {}
              as: PlatformAdmin
            - call: "POST /projects"
              payload: { homeowner_id: "${ho_id}", title: "Loop", budget_cap_cents: 1000000, bid_deadline: "2026-07-01T00:00:00Z", required_trade: "GENERAL", min_rating: 0 }
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { p_id: $.data.id }
            - call: "POST /projects/${p_id}/scope-line-items"
              payload: { description: "Whole", quantity: 1, unit: "LUMP", estimated_unit_cost_cents: 600000 }
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { s1_id: $.data.id }
            - call: "POST /projects/${p_id}/milestones"
              payload: { sequence: 1, title: "Done", release_pct: 1.0 }
              as: Homeowner
              as_user_id: "${ho_id}"
            - call: "POST /projects/${p_id}/open"
