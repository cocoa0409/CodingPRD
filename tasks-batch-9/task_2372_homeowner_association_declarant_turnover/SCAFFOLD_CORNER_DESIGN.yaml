          assert:
            - "DefectClaim.${claim_id}.repose_deadline == 2032-01-01T00:00:00Z and status == WITHDRAWN before the triggers"
            - "e_notice == ERR_CLAIM_STATE_INVALID with HTTP 409"
            - "e_reserve == ERR_CLAIM_STATE_INVALID with HTTP 409"
            - "e_withdraw_twice == ERR_CLAIM_STATE_INVALID with HTTP 409"
            - "e_reject == ERR_CLAIM_STATE_INVALID with HTTP 409"
            - "DefectClaim.${claim_id}.status == WITHDRAWN, reserved_amount_cents == 0, valuation_basis == null"
            - "Association.${assoc_id}.reserve_claim_committed_cents == 0 and reserve_claim_available_cents == 500000"

      - name: corner_parallel_dimensions_advance_independently
        claim_type: Valid Transition
        grounds:
          - state_machines.TurnoverCase
          - calculations.turnover_posture_derivation
        excluded_because:
          difficulty_instance: non_linear_state_machine / turnover_case_governance_reaches_owner_control_while_subsidy_still_active
          rationale: "The parallel-shape claim (each dimension advances on its own trigger and turnover_posture is derived from the pair) is the whole subject of the named §1.8 instance."

      - name: corner_vendor_fork_branches_have_disjoint_side_effects
        claim_type: Side Effect Execution
        grounds:
          - state_machines.VendorContract.ASSIGNMENT_REQUESTED_to_CONSENTED
          - state_machines.VendorContract.ASSIGNMENT_REQUESTED_to_CONSENT_REFUSED
        excluded_because:
          difficulty_instance: non_linear_state_machine / vendor_contract_consent_and_refusal_branches_have_disjoint_effects
          rationale: "Both fork branches and their disjoint side-effect sets are asserted call-by-call in the named §1.8 instance."

      - name: corner_defect_claim_cycle_terminates_at_the_round_cap
        claim_type: Idempotency
        grounds:
          - state_machines.DefectClaim.REJECTED_BY_DEVELOPER_to_INVESTIGATING
          - errors.ERR_NEGOTIATION_ROUNDS_EXHAUSTED
        excluded_because:
          difficulty_instance: non_linear_state_machine / defect_claim_negotiation_cycle_reentry_and_round_cap
          rationale: "The cyclic re-entry and its MAX_NEGOTIATION_ROUNDS termination condition are asserted round-by-round in the named §1.8 instance."

      - name: corner_certify_trigger_cascade_reaches_every_dependent_row
        claim_type: Side Effect Execution
        grounds:
          - state_machines.TurnoverCase.DECLARANT_CONTROL_to_ELECTION_CALLED
        excluded_because:
          difficulty_instance: transitive_cascade / certify_trigger_five_hop_cascade_to_superseded_draft_budget
          rationale: "All five cascade hops of certify-trigger, including the cascade-down to directors and contracts, are asserted hop-by-hop in the named §1.8 instance."

      - name: corner_director_seating_bubbles_up_into_governance_status
        claim_type: Side Effect Execution
        grounds:
          - state_machines.TurnoverCase.ELECTION_CALLED_to_ELECTION_HELD
          - state_machines.TurnoverCase.ELECTION_HELD_to_ELECTION_CALLED
        excluded_because:
          difficulty_instance: compensating_invariant / board_seat_count_conserved_across_resignation_seating_and_rescission
          rationale: "Both the bubble-up promotion and the demotion on rescission are asserted at every seat count in the named §1.8 instance."

      - name: corner_claim_withdrawal_compensates_the_reserve_commitment
        claim_type: Side Effect Execution
        grounds:
          - state_machines.DefectClaim.RESERVED_to_WITHDRAWN
        excluded_because:
          difficulty_instance: compensating_invariant / claim_reserve_release_conserves_the_association_claim_pool
          rationale: "The compensating release of reserved_amount_cents with no drift is the named §1.8 instance's central invariant."

  # ===========================================================================
  - section: calculations
    instances:

      - name: sold_lot_count_counts_closed_lots_only
        claim_type: Input Set Filtering
        grounds:
          - calculations.sold_lot_percentage
          - entities.Lot.fields.sale_status
          - entities.Association.fields.total_planned_lots
        distinguishing_aspect: "The numerator is the CLOSED Lot rows and the denominator is the declaration's total_planned_lots, not the number of Lot rows on file: with 8 planned lots, 5 rows and 3 closings the percentage is 37.50, not 60.00. UNDER_CONTRACT is expressly outside the numerator even though it is inside the assessment divisor."
        test_recipe:
          setup:
            - "Association 'Coppice End' with total_planned_lots 8 and no TurnoverCase."
            - "Five Lots: three created UNSOLD, one created with sale_status UNDER_CONTRACT, one left UNSOLD."
          setup_api_calls:
            - call: "POST /hoa/associations"
              payload: { name: "Coppice End", total_planned_lots: 8, turnover_threshold_pct: 66.67, fixed_turnover_date: "2027-01-01T00:00:00Z", statute_of_repose_years: 8, reserve_pool_cents: 0, reserve_claim_pool_cents: 0, declarant_monthly_subsidy_cents: 0 }
              as: PlatformAdmin
              captures: { assoc_id: $.data.id }
            - call: "POST /hoa/lots"
              payload: { association_id: "${assoc_id}", lot_number: "C-001" }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { lot1: $.data.id }
            - call: "POST /hoa/lots"
              payload: { association_id: "${assoc_id}", lot_number: "C-002" }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { lot2: $.data.id }
            - call: "POST /hoa/lots"
              payload: { association_id: "${assoc_id}", lot_number: "C-003" }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { lot3: $.data.id }
            - call: "POST /hoa/lots"
              payload: { association_id: "${assoc_id}", lot_number: "C-004", sale_status: "UNDER_CONTRACT" }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { lot4_under_contract: $.data.id }
            - call: "POST /hoa/lots"
              payload: { association_id: "${assoc_id}", lot_number: "C-005" }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { lot5_unsold: $.data.id }
          trigger:
            - call: "POST /hoa/lots/${lot1}/close-sale"
              payload: { closing_date: "2026-02-01T00:00:00Z" }
              as: Declarant
              as_user_id: "declarant-1"
            - call: "POST /hoa/lots/${lot2}/close-sale"
              payload: { closing_date: "2026-03-01T00:00:00Z" }
              as: Declarant
              as_user_id: "declarant-1"
            - call: "POST /hoa/lots/${lot3}/close-sale"
              payload: { closing_date: "2026-04-01T00:00:00Z" }
              as: Declarant
              as_user_id: "declarant-1"
            - call: "GET /hoa/associations/${assoc_id}/lots"
              payload: { sale_status: "CLOSED", limit: 10, offset: 0 }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
          assert:
            - "after the first trigger call: Association.${assoc_id}.sold_lot_count == 1 and sold_lot_pct == 12.50"
            - "after the second trigger call: sold_lot_count == 2 and sold_lot_pct == 25.00"
            - "after the third trigger call: sold_lot_count == 3 and sold_lot_pct == 37.50, NOT 60.00 from 3 of the 5 rows on file"
            - "fourth trigger call: total_count == 3"
            - "Lot.${lot4_under_contract}.sale_status == UNDER_CONTRACT and Lot.${lot5_unsold}.sale_status == UNSOLD"

      - name: cash_flow_year_walk_escalates_expenditure_and_takes_the_running_minimum
        claim_type: Constants Applied
        grounds:
          - calculations.reserve_funding_adequacy
          - calculations.reserve_funding_adequacy.constants.CASH_FLOW_PROJECTION_YEARS
          - calculations.reserve_funding_adequacy.constants.CASH_FLOW_ESCALATION_PCT_PER_YEAR
          - calculations.reserve_funding_adequacy.constants.CASH_FLOW_MARGINAL_FLOOR_CENTS
          - state_machines.ReserveStudy.DRAFT_to_SUPERSEDED
        distinguishing_aspect: "The CASH_FLOW verdict is the minimum of a five-year walk in which each year's expenditure is inflated by 3 percent per elapsed year and floor()ed per line — not a flat multiple. From the same 400000 pool, planned 200000 bottoms out at -235000 (MARGINAL, inside the 500000 floor) while planned 100000 bottoms out at -735000 (DEFICIENT, past it), and the recommendation tops the planned figure up by the shortfall spread over the horizon."
        test_recipe:
          setup:
            - "Association 'Dovegate' with reserve_pool_cents 400000 and no components."
            - "A first ReserveStudy with planned_annual_contribution_cents 200000 and projected_annual_expenditure_cents 300000."
            - "A second ReserveStudy created afterwards with planned_annual_contribution_cents 100000 and the same expenditure, whose creation supersedes the first study while it is still DRAFT."
          setup_api_calls:
            - call: "POST /hoa/associations"
              payload: { name: "Dovegate", total_planned_lots: 6, turnover_threshold_pct: 66.67, fixed_turnover_date: "2027-01-01T00:00:00Z", statute_of_repose_years: 8, reserve_pool_cents: 400000, reserve_claim_pool_cents: 0, declarant_monthly_subsidy_cents: 0 }
              as: PlatformAdmin
              captures: { assoc_id: $.data.id }
            - call: "POST /hoa/reserve-studies"
              payload: { association_id: "${assoc_id}", funding_method: "CASH_FLOW", planned_annual_contribution_cents: 200000, projected_annual_expenditure_cents: 300000 }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
              captures: { study_marginal_id: $.data.id }
          trigger:
            - call: "POST /hoa/reserve-studies/${study_marginal_id}/actions"
              payload: { action: "RECOMPUTE", method: "CASH_FLOW" }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
            - call: "POST /hoa/reserve-studies"
              payload: { association_id: "${assoc_id}", funding_method: "CASH_FLOW", planned_annual_contribution_cents: 100000, projected_annual_expenditure_cents: 300000 }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
              captures: { study_deficient_id: $.data.id }
            - call: "POST /hoa/reserve-studies/${study_deficient_id}/actions"
              payload: { action: "RECOMPUTE", method: "CASH_FLOW" }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
          assert:
            - "first trigger call returns 200 with data.evaluated_method == CASH_FLOW, data.min_projected_balance_cents == -235000, data.adequacy_verdict == MARGINAL, data.recommended_annual_contribution_cents == 247000"
            - "first trigger call: data.status == DRAFT, data.component_count == 0 and data.percent_funded == 0.00"
            - "second trigger call returns 201 and ReserveStudy.${study_marginal_id}.status == SUPERSEDED"
            - "ReserveStudy.${study_marginal_id}.min_projected_balance_cents == -235000, preserved through the supersession"
            - "third trigger call returns 200 with data.min_projected_balance_cents == -735000, data.adequacy_verdict == DEFICIENT, data.recommended_annual_contribution_cents == 247000"
            - "third trigger call: data.min_projected_balance_cents is the year-5 balance, so the walk was carried forward rather than evaluated year by year in isolation"

      - name: audit_snapshot_window_is_closed_on_both_month_bounds
        claim_type: Input Set Filtering
        grounds:
          - calculations.audit_unreconciled_delta
          - endpoints[POST /hoa/audit-engagements/{id}/issue]
          - entities.AuditEngagement.fields.audited_receivable_snapshot_cents
        distinguishing_aspect: "in_window compares period_month as a YYYY-MM string against the MONTHS of period_start and period_end, both inclusive, so a window of 2026-01-15..2026-03-20 admits 2026-01 and 2026-03 in full while excluding 2025-12 and 2026-04. The snapshot is 60000 against a life-to-date receivable of 180000, so the engagement is EXCEPTION_NOTED with a 120000 delta the instant it is issued."
        test_recipe:
          setup:
            - "Association 'Elmsworth' with declarant_monthly_subsidy_cents 100000."
            - "Four POSTED SubsidyEntries: ACCRUAL 100000 for 2026-01, PAYMENT 40000 for 2026-03, ACCRUAL 70000 for 2025-12 and ACCRUAL 50000 for 2026-04."
            - "One AuditEngagement over 2026-01-15..2026-03-20 in ENGAGED."
          setup_api_calls:
            - call: "POST /hoa/associations"
              payload: { name: "Elmsworth", total_planned_lots: 6, turnover_threshold_pct: 66.67, fixed_turnover_date: "2027-01-01T00:00:00Z", statute_of_repose_years: 8, reserve_pool_cents: 0, reserve_claim_pool_cents: 0, declarant_monthly_subsidy_cents: 100000 }
              as: PlatformAdmin
              captures: { assoc_id: $.data.id }
            - call: "POST /hoa/subsidy-entries"
              payload: { association_id: "${assoc_id}", direction: "ACCRUAL", amount_cents: 100000, period_month: "2026-01" }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { e_jan: $.data.id }
            - call: "POST /hoa/subsidy-entries"
              payload: { association_id: "${assoc_id}", direction: "PAYMENT", amount_cents: 40000, period_month: "2026-03" }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { e_mar: $.data.id }
            - call: "POST /hoa/subsidy-entries"
              payload: { association_id: "${assoc_id}", direction: "ACCRUAL", amount_cents: 70000, period_month: "2025-12" }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { e_dec: $.data.id }
            - call: "POST /hoa/subsidy-entries"
              payload: { association_id: "${assoc_id}", direction: "ACCRUAL", amount_cents: 50000, period_month: "2026-04" }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { e_apr: $.data.id }
            - call: "POST /hoa/audit-engagements"
              payload: { association_id: "${assoc_id}", period_start: "2026-01-15T00:00:00Z", period_end: "2026-03-20T00:00:00Z" }
              as: Auditor
              as_user_id: "auditor-9"
              captures: { eng_id: $.data.id }
          trigger:
            - call: "GET /hoa/associations/${assoc_id}"
              payload: {}
              as: Auditor
              as_user_id: "auditor-9"
            - call: "POST /hoa/audit-engagements/${eng_id}/issue"
              payload: {}
              as: Auditor
              as_user_id: "auditor-9"
          assert:
            - "first trigger call: data.subsidy_receivable_cents == 180000, the life-to-date netting of all four entries"
            - "second trigger call returns 200 with data.audited_receivable_snapshot_cents == 60000, which is 100000 minus 40000 and excludes both out-of-window entries"
            - "second trigger call: data.unreconciled_delta_cents == 120000 and data.finding_status == EXCEPTION_NOTED"
            - "second trigger call: data.status == ISSUED and data.issued_by_user_id == auditor-9"
            - "SubsidyEntry.${e_dec}.status == POSTED and SubsidyEntry.${e_apr}.status == POSTED, excluded by window rather than by state"
            - "SubsidyEntry.${e_jan}.period_month == 2026-01 and SubsidyEntry.${e_mar}.period_month == 2026-03, both bounds admitted"

      - name: records_completeness_is_vacuously_complete_and_rounds_half_up
        claim_type: Precision
        grounds:
          - calculations.records_transfer_completeness
          - entities.RecordsTransferItem.fields.required
        distinguishing_aspect: "An empty required set yields 100.00 rather than a division by zero, a non-required item leaves the percentage untouched at 100.00, and one accepted item out of three required rounds 33.333... half up to 33.33 — never truncated to 33.30 or inflated by the optional row."
        test_recipe:
          setup:
            - "Association 'Fernbrook' with a TurnoverCase (total_seats 3) carrying no RecordsTransferItems at all."
          setup_api_calls:
            - call: "POST /hoa/associations"
              payload: { name: "Fernbrook", total_planned_lots: 6, turnover_threshold_pct: 66.67, fixed_turnover_date: "2027-01-01T00:00:00Z", statute_of_repose_years: 8, reserve_pool_cents: 0, reserve_claim_pool_cents: 0, declarant_monthly_subsidy_cents: 0 }
              as: PlatformAdmin
              captures: { assoc_id: $.data.id }
            - call: "POST /hoa/turnover-cases"
              payload: { association_id: "${assoc_id}", total_seats: 3 }
              as: PlatformAdmin
              captures: { case_id: $.data.id }
          trigger:
            - call: "GET /hoa/turnover-cases/${case_id}"
              payload: {}
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
            - call: "POST /hoa/records-items"
              payload: { turnover_case_id: "${case_id}", category: "PERMITS", required: false }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { opt_id: $.data.id }
            - call: "POST /hoa/records-items"
              payload: { turnover_case_id: "${case_id}", category: "FINANCIAL_RECORDS", required: true }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { req1: $.data.id }
            - call: "POST /hoa/records-items"
              payload: { turnover_case_id: "${case_id}", category: "WARRANTIES", required: true }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { req2: $.data.id }
            - call: "POST /hoa/records-items"
              payload: { turnover_case_id: "${case_id}", category: "PLANS_AND_SPECS", required: true }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { req3: $.data.id }
            - call: "POST /hoa/records-items/${req1}/transitions"
              payload: { action: "DELIVER" }
              as: Declarant
              as_user_id: "declarant-1"
            - call: "POST /hoa/records-items/${req1}/transitions"
              payload: { action: "ACCEPT" }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
            - call: "GET /hoa/turnover-cases/${case_id}"
              payload: {}
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
          assert:
            - "first trigger call: data.records_transfer_completeness_pct == 100.00 with zero items on file"
            - "after the second trigger call: TurnoverCase.${case_id}.records_transfer_completeness_pct == 100.00, unmoved by the non-required item"
            - "after the fifth trigger call (three required, none accepted): records_transfer_completeness_pct == 0.00"
            - "eighth trigger call: data.records_transfer_completeness_pct == 33.33"
            - "RecordsTransferItem.${opt_id}.required == false and status == OUTSTANDING"
            - "RecordsTransferItem.${req2}.status == OUTSTANDING and RecordsTransferItem.${req3}.status == OUTSTANDING"

      - name: owner_elected_seat_requirement_is_a_ceiling_of_two_thirds_of_the_board
        claim_type: Constants Applied
        grounds:
          - calculations.governance_seat_ledger
          - calculations.governance_seat_ledger.constants.OWNER_CONTROL_SEAT_NUMERATOR
          - calculations.governance_seat_ledger.constants.OWNER_CONTROL_SEAT_DENOMINATOR
          - state_machines.TurnoverCase.DECLARANT_CONTROL_to_ELECTION_CALLED
        distinguishing_aspect: "owner_elected_seats_required is 0 until the trigger is certified and then a CEILING of two thirds of total_seats, so 5 seats need 4 (not 3), 3 seats need 2 and 7 seats need 5 — flooring or plain rounding would understate every odd board."
        test_recipe:
          setup:
            - "Three associations, each with fixed_turnover_date 2026-07-01T00:00:00Z already reached at the default clock 2026-08-01T00:00:00Z, and one TurnoverCase each with total_seats 5, 3 and 7."
          setup_api_calls:
            - call: "POST /hoa/associations"
              payload: { name: "Gallowtree Five", total_planned_lots: 6, turnover_threshold_pct: 66.67, fixed_turnover_date: "2026-07-01T00:00:00Z", statute_of_repose_years: 8, reserve_pool_cents: 0, reserve_claim_pool_cents: 0, declarant_monthly_subsidy_cents: 0 }
              as: PlatformAdmin
              captures: { assoc5_id: $.data.id }
            - call: "POST /hoa/associations"
              payload: { name: "Gallowtree Three", total_planned_lots: 6, turnover_threshold_pct: 66.67, fixed_turnover_date: "2026-07-01T00:00:00Z", statute_of_repose_years: 8, reserve_pool_cents: 0, reserve_claim_pool_cents: 0, declarant_monthly_subsidy_cents: 0 }
              as: PlatformAdmin
              captures: { assoc3_id: $.data.id }
            - call: "POST /hoa/associations"
              payload: { name: "Gallowtree Seven", total_planned_lots: 6, turnover_threshold_pct: 66.67, fixed_turnover_date: "2026-07-01T00:00:00Z", statute_of_repose_years: 8, reserve_pool_cents: 0, reserve_claim_pool_cents: 0, declarant_monthly_subsidy_cents: 0 }
              as: PlatformAdmin
              captures: { assoc7_id: $.data.id }
            - call: "POST /hoa/turnover-cases"
              payload: { association_id: "${assoc5_id}", total_seats: 5 }
              as: PlatformAdmin
              captures: { case5_id: $.data.id }
            - call: "POST /hoa/turnover-cases"
              payload: { association_id: "${assoc3_id}", total_seats: 3 }
              as: PlatformAdmin
              captures: { case3_id: $.data.id }
            - call: "POST /hoa/turnover-cases"
              payload: { association_id: "${assoc7_id}", total_seats: 7 }
              as: PlatformAdmin
              captures: { case7_id: $.data.id }
          trigger:
            - call: "POST /hoa/turnover-cases/${case5_id}/certify-trigger"
              payload: { trigger_basis: "FIXED_DATE" }
              as: TransitionCommittee
              as_user_id: "${assoc5_id}"
            - call: "POST /hoa/turnover-cases/${case3_id}/certify-trigger"
              payload: { trigger_basis: "FIXED_DATE" }
              as: TransitionCommittee
              as_user_id: "${assoc3_id}"
            - call: "POST /hoa/turnover-cases/${case7_id}/certify-trigger"
              payload: { trigger_basis: "FIXED_DATE" }
              as: TransitionCommittee
              as_user_id: "${assoc7_id}"
          assert:
            - "before the triggers: TurnoverCase.${case5_id}.owner_elected_seats_required == 0 while governance_status is DECLARANT_CONTROL"
            - "first trigger call returns 200 with data.owner_elected_seats_required == 4, data.vacant_seats == 5, data.governance_status == ELECTION_CALLED"
            - "second trigger call: data.owner_elected_seats_required == 2 and data.vacant_seats == 3"
            - "third trigger call: data.owner_elected_seats_required == 5 and data.vacant_seats == 7"
            - "each case keeps declarant_appointed_seats == 0 and owner_elected_seats == 0"

      - name: repose_deadline_clamps_february_29_and_keeps_the_time_of_day
        claim_type: Precision
        grounds:
          - calculations.defect_repose_deadline
          - entities.Association.fields.statute_of_repose_years
          - entities.CommonAreaComponent.fields.substantial_completion_date
        distinguishing_aspect: "The deadline is calendar-year addition on the same month and day with the time-of-day preserved, and 29 February clamps to 28 February in a non-leap target year: 2020-02-29T14:45:00Z + 5 years is 2025-02-28T14:45:00Z, while 2018-03-15T09:30:00Z + 5 years is 2023-03-15T09:30:00Z — not midnight, and not 2025-03-01."
        test_recipe:
          setup:
            - "Association 'Hallowmere' with statute_of_repose_years 5."
            - "Two components taken to build_status COMPLETE with effective_date 2020-02-29T14:45:00Z and 2018-03-15T09:30:00Z."
          setup_api_calls:
            - call: "POST /hoa/associations"
              payload: { name: "Hallowmere", total_planned_lots: 6, turnover_threshold_pct: 66.67, fixed_turnover_date: "2027-01-01T00:00:00Z", statute_of_repose_years: 5, reserve_pool_cents: 0, reserve_claim_pool_cents: 900000, declarant_monthly_subsidy_cents: 0 }
              as: PlatformAdmin
              captures: { assoc_id: $.data.id }
            - call: "POST /hoa/components"
              payload: { association_id: "${assoc_id}", name: "Leap Year Clubhouse", category: "AMENITY", replacement_cost_cents: 500000, useful_life_years: 20, effective_age_years: 6, promised_completion_date: "2020-02-29T14:45:00Z" }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { comp_leap_id: $.data.id }
            - call: "POST /hoa/components"
              payload: { association_id: "${assoc_id}", name: "Perimeter Wall", category: "STRUCTURE", replacement_cost_cents: 300000, useful_life_years: 25, effective_age_years: 8, promised_completion_date: "2018-03-15T09:30:00Z" }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { comp_plain_id: $.data.id }
            - call: "POST /hoa/components/${comp_leap_id}/milestones"
              payload: { milestone: "BUILD_COMPLETE", effective_date: "2020-02-29T14:45:00Z" }
              as: Declarant
              as_user_id: "declarant-1"
            - call: "POST /hoa/components/${comp_plain_id}/milestones"
              payload: { milestone: "BUILD_COMPLETE", effective_date: "2018-03-15T09:30:00Z" }
