          trigger:
            - call: "PATCH /api/movement-permits/${perm_id}"
              payload: { expected_permit_version: "${perm_ver}", allocated_head_count: 5 }
              as: StateVetOfficer
              captures: { err_low: $.data.error_id }
            - call: "PATCH /api/movement-permits/${perm_id}"
              payload: { expected_permit_version: "${perm_ver}", allocated_head_count: 12 }
              as: StateVetOfficer
              captures: { alloc2: $.data.allocated_head_count, comm2: $.data.committed_headroom }
          assert:
            - "PATCH allocation 5 < consumed 6 -> error_id == 'ERR_ALLOCATION_BELOW_CONSUMED' (422); version unchanged so the next PATCH with the same expected version still passes OCC"
