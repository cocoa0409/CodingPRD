          setup:
            - "Canonical two-location award: program in SCORING at clock 2026-09-06T00:00:00Z, QUALIFIED subgrantee S1, application A1 claiming ADDR-0002 and ADDR-0003 at 900002 cents each, scored, selected and obligated."
