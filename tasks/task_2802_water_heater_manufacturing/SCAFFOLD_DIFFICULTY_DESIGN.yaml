          setup:
            - "Model GX50-T has an APPROVED certification, so certification_status == CERTIFIED."
            - "The same model has never been released, so release_status is still DRAFT."
            - "uef_rated is 0.59, fhr_rated 63, recovery_rate_rated 41.3 and label_serial_prefix GX50-T."
