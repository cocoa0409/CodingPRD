        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[plan-create-stale-client]", "validations[priority=6]", "errors[ERR_STALE_CLIENT_VERSION]"]
        distinguishing_aspect: "Plan creation supersedes the client's non-terminal plan, so the write is OCC-guarded on Client.version: a second create carrying the pre-first-create version is rejected with ERR_STALE_CLIENT_VERSION (412), and a re-read version succeeds and supersedes plan 1."
        test_recipe:
          setup: ["client (version captured at creation) with APPROVED intake; plan 1 already created, which advanced Client.version"]
          setup_api_calls:
            - { call: "POST /api/families", payload: { account_name: "Fam OC", primary_email: "oc2@x.com" }, as: PracticeAdmin, captures: { fam_id: "$.data.id" } }
            - { call: "POST /api/families/${fam_id}/clients", payload: { full_name: "Kid OC", date_of_birth: "2015-09-15", track: "INDIVIDUAL" }, as: PracticeAdmin, captures: { cl_id: "$.data.id", cl_v: "$.data.version" } }
            - { call: "POST /api/families/${fam_id}/transition", payload: { to_state: "ACTIVE" }, as: PracticeAdmin }
            - { call: "POST /api/coaches", payload: { full_name: "Coach OC", credential_level: "CERTIFIED" }, as: PracticeAdmin, captures: { co_id: "$.data.id" } }
            - { call: "POST /api/clients/${cl_id}/intakes", payload: { presenting_concerns: "oc", baseline_score: 50 }, as: PracticeAdmin, captures: { in_id: "$.data.id" } }
            - { call: "POST /api/intakes/${in_id}/transition", payload: { to_state: "SUBMITTED" }, as: FamilyMember, as_user_id: "${fam_id}" }
            - { call: "POST /api/intakes/${in_id}/transition", payload: { to_state: "UNDER_REVIEW" }, as: Coach, as_user_id: "${co_id}" }
            - { call: "POST /api/intakes/${in_id}/transition", payload: { to_state: "APPROVED" }, as: Coach, as_user_id: "${co_id}" }
            - { call: "POST /api/clients/${cl_id}/plans", payload: { coach_id: "${co_id}", intake_id: "${in_id}", cadence: "WEEKLY", expected_client_version: "${cl_v}" }, as: Coach, as_user_id: "${co_id}", captures: { p1_id: "$.data.id" } }
          trigger:
            - { call: "POST /api/clients/${cl_id}/plans", payload: { coach_id: "${co_id}", intake_id: "${in_id}", cadence: "BIWEEKLY", expected_client_version: "${cl_v}" }, as: Coach, as_user_id: "${co_id}", captures: { err: "$.data.error_id" } }
            - { call: "GET /api/clients/${cl_id}", as: PracticeAdmin, captures: { cl_v2: "$.data.version" } }
            - { call: "POST /api/clients/${cl_id}/plans", payload: { coach_id: "${co_id}", intake_id: "${in_id}", cadence: "BIWEEKLY", expected_client_version: "${cl_v2}" }, as: Coach, as_user_id: "${co_id}", captures: { p2_id: "$.data.id", p2_rev: "$.data.revision_number" } }
            - { call: "GET /api/plans/${p1_id}", as: PracticeAdmin, captures: { p1_status: "$.data.status" } }
          assert:
            - "err == ERR_STALE_CLIENT_VERSION"
            - "p2_rev == 2"
            - "p1_status == SUPERSEDED (the fresh-version create legitimately supersedes the DRAFT)"

      - name: occ_consent_create_stale_family_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[consent-create-stale-family]", "validations[priority=7]", "errors[ERR_STALE_FAMILY_VERSION]"]
        distinguishing_aspect: "Consent creation supersedes existing grants, so it is OCC-guarded on Family.version: after consent 1 advances the version, a create carrying the stale version fails with ERR_STALE_FAMILY_VERSION (412); the same call with a re-read version succeeds."
        test_recipe:
          setup: ["family with two contacts; family version captured before consent 1"]
          setup_api_calls:
            - { call: "POST /api/families", payload: { account_name: "Fam OV", primary_email: "ov@x.com" }, as: PracticeAdmin, captures: { fam_id: "$.data.id" } }
            - { call: "POST /api/families/${fam_id}/contacts", payload: { name: "Dr One", organization: "Clinic", contact_type: "CLINICIAN", email: "one@clinic.com" }, as: FamilyMember, as_user_id: "${fam_id}", captures: { ct1_id: "$.data.id" } }
            - { call: "POST /api/families/${fam_id}/contacts", payload: { name: "Ms Two", organization: "School", contact_type: "SCHOOL", email: "two@school.edu" }, as: FamilyMember, as_user_id: "${fam_id}", captures: { ct2_id: "$.data.id" } }
            - { call: "GET /api/families/${fam_id}", as: PracticeAdmin, captures: { fam_v: "$.data.version" } }
            - { call: "POST /api/families/${fam_id}/consents", payload: { contact_id: "${ct1_id}", scope: "FULL_PLAN", expires_at: "2027-01-01T00:00:00Z", expected_family_version: "${fam_v}" }, as: FamilyMember, as_user_id: "${fam_id}", captures: { cg1_id: "$.data.id" } }
          trigger:
            - { call: "POST /api/families/${fam_id}/consents", payload: { contact_id: "${ct2_id}", scope: "PROGRESS_ONLY", expires_at: "2027-01-01T00:00:00Z", expected_family_version: "${fam_v}" }, as: FamilyMember, as_user_id: "${fam_id}", captures: { err: "$.data.error_id" } }
            - { call: "GET /api/families/${fam_id}", as: PracticeAdmin, captures: { fam_v2: "$.data.version" } }
            - { call: "POST /api/families/${fam_id}/consents", payload: { contact_id: "${ct2_id}", scope: "PROGRESS_ONLY", expires_at: "2027-01-01T00:00:00Z", expected_family_version: "${fam_v2}" }, as: FamilyMember, as_user_id: "${fam_id}", captures: { cg2_status: "$.data.status" } }
          assert:
            - "err == ERR_STALE_FAMILY_VERSION"
            - "cg2_status == PENDING_SIGNATURE"

      - name: plan_posture_recovers_after_family_reactivation
        claim_type: derived_field_reconciliation
        grounds: [entities.CoachingPlan.fields.posture, state_machines.Family]
        distinguishing_aspect: "Plan posture is derived: suspending the family flips it to SCHEDULING_BLOCKED and reactivation restores SCHEDULABLE — the denormalized gate reconciles on every ancestor mutation."
        test_recipe:
          setup: ["ACTIVE plan with 1-credit package (outstanding 17500 <= 20000 so reactivation is allowed)"]
          setup_api_calls:
            - { call: "POST /api/families", payload: { account_name: "Fam PO", primary_email: "po@x.com" }, as: PracticeAdmin, captures: { fam_id: "$.data.id" } }
            - { call: "POST /api/families/${fam_id}/clients", payload: { full_name: "Kid PO", date_of_birth: "2015-10-15", track: "INDIVIDUAL" }, as: PracticeAdmin, captures: { cl_id: "$.data.id", cl_v: "$.data.version" } }
            - { call: "POST /api/families/${fam_id}/transition", payload: { to_state: "ACTIVE" }, as: PracticeAdmin }
            - { call: "POST /api/coaches", payload: { full_name: "Coach PO", credential_level: "CERTIFIED" }, as: PracticeAdmin, captures: { co_id: "$.data.id" } }
            - { call: "POST /api/clients/${cl_id}/intakes", payload: { presenting_concerns: "po", baseline_score: 50 }, as: PracticeAdmin, captures: { in_id: "$.data.id" } }
            - { call: "POST /api/intakes/${in_id}/transition", payload: { to_state: "SUBMITTED" }, as: FamilyMember, as_user_id: "${fam_id}" }
            - { call: "POST /api/intakes/${in_id}/transition", payload: { to_state: "UNDER_REVIEW" }, as: Coach, as_user_id: "${co_id}" }
            - { call: "POST /api/intakes/${in_id}/transition", payload: { to_state: "APPROVED" }, as: Coach, as_user_id: "${co_id}" }
            - { call: "POST /api/families/${fam_id}/packages", payload: { track: "INDIVIDUAL", credits_total: 1 }, as: PracticeAdmin }
            - { call: "POST /api/clients/${cl_id}/plans", payload: { coach_id: "${co_id}", intake_id: "${in_id}", cadence: "WEEKLY", expected_client_version: "${cl_v}" }, as: Coach, as_user_id: "${co_id}", captures: { pl_id: "$.data.id" } }
            - { call: "POST /api/plans/${pl_id}/goals", payload: { title: "G", target_date: "2026-09-01" }, as: Coach, as_user_id: "${co_id}" }
            - { call: "POST /api/plans/${pl_id}/transition", payload: { to_state: "PROPOSED" }, as: Coach, as_user_id: "${co_id}" }
            - { call: "POST /api/plans/${pl_id}/transition", payload: { to_state: "ACTIVE" }, as: FamilyMember, as_user_id: "${fam_id}" }
            - { call: "GET /api/plans/${pl_id}", as: PracticeAdmin, captures: { posture0: "$.data.posture" } }
          trigger:
            - { call: "POST /api/families/${fam_id}/transition", payload: { to_state: "SUSPENDED" }, as: PracticeAdmin }
            - { call: "GET /api/plans/${pl_id}", as: PracticeAdmin, captures: { posture1: "$.data.posture" } }
            - { call: "POST /api/families/${fam_id}/transition", payload: { to_state: "ACTIVE" }, as: PracticeAdmin }
            - { call: "GET /api/plans/${pl_id}", as: PracticeAdmin, captures: { posture2: "$.data.posture" } }
          assert:
            - "posture0 == SCHEDULABLE"
            - "posture1 == SCHEDULING_BLOCKED"
            - "posture2 == SCHEDULABLE"

  - section: consistency_model
    instances:
      - name: immediate_read_after_write_visibility
        claim_type: immediate
        grounds: [complexity_profile.consistency_model]
        distinguishing_aspect: "Immediate consistency: a mutation's effects are visible in the very next read — a family activated by transition reads back ACTIVE with version incremented in the same response stream."
        test_recipe:
          setup: ["family with one client, still INTAKE"]
          setup_api_calls:
            - { call: "POST /api/families", payload: { account_name: "Fam IM", primary_email: "im@x.com" }, as: PracticeAdmin, captures: { fam_id: "$.data.id", fam_v0: "$.data.version" } }
            - { call: "POST /api/families/${fam_id}/clients", payload: { full_name: "Kid IM", date_of_birth: "2015-11-15", track: "INDIVIDUAL" }, as: PracticeAdmin }
          trigger:
            - { call: "POST /api/families/${fam_id}/transition", payload: { to_state: "ACTIVE" }, as: PracticeAdmin, captures: { fam_status: "$.data.status", fam_v1: "$.data.version" } }
            - { call: "GET /api/families/${fam_id}", as: PracticeAdmin, captures: { fam_read: "$.data.status" } }
          assert:
            - "fam_v0 == 1"
            - "fam_status == ACTIVE and fam_v1 == 2"
            - "fam_read == ACTIVE (no replication lag)"

  - section: cross_cutting_complexity_layers
    instances:
      - name: caseload_cap_twelve_boundary
        claim_type: rate_threshold_triggers
        grounds: [calculations.supervision_requirement, entities.Coach.fields.caseload_cap, "errors[ERR_CASELOAD_CAP_REACHED]"]
        distinguishing_aspect: |
          The capacity gate is a strict less-than: with an ASSOCIATE coach (cap 12),
          acceptance #12 (caseload 11 < 12) succeeds and #13 (12 == cap) is rejected
          with ERR_CASELOAD_CAP_REACHED. The coach is pre-loaded with 6 verified
          supervision hours so floor(caseload/2) <= 6 never triggers the deficit gate
          and isolates the cap as the only failing rule.
        test_recipe:
          setup:
            - "One family with 13 clients, each with an APPROVED intake (approved by the SUPERVISOR coach)"
            - "ASSOCIATE coach A with 6 verified supervision hours (record HELD by SUPERVISOR, VERIFIED by admin)"
            - "Plans for clients 1..12 ACCEPTED for coach A (caseload reaches 12)"
            - "Plan 13 proposed for client 13"
