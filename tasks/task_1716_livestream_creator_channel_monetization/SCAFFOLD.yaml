# =============================================================================
# SCAFFOLD — Livestream Creator Channel Monetization (task_1716)
# Sections §1.0–§1.7. Difficulty design (§1.8) and corner design (§1.9) live in
# SCAFFOLD_DIFFICULTY_DESIGN.yaml / SCAFFOLD_CORNER_DESIGN.yaml respectively.
# =============================================================================

scenario: |
  Livestream Creator Channel Monetization (Twitch/YouTube creator business): revenue stream
  tracking (subscription/tips/ads/sponsorship), payout threshold & schedule with tax forms,
  subscriber tier & perk fulfillment, moderation team & channel policy enforcement, content
  strike/appeal & platform compliance, sponsorship deliverable scheduling & disclosure,
  schedule consistency & audience analytics, multi-platform simulcast rights

domain_name: livestream-creator-monetization
api_prefix: /api

# =============================================================================
# §0 Complexity Profile (Expert band, maxed)
# =============================================================================
complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation      # provisional vs final revenue recognition; hard-window vs decayed strike weight
    - rate_threshold_triggers       # payout threshold, strike suspension weight, volume rebate cliff
    - cascading_side_effects        # strike → posture → payout hold; deliverable miss → deal breach → clawback → balance
    - optimistic_concurrency        # OCC on Channel.version and Deliverable.version
  entity_topology: flat             # all collections top-level under /api; FK references only
  state_machine_shape: compound     # mix: cyclic (Payout, TaxForm-chain, ContentStrike, PerkGrant), parallel dims (Deliverable), compound (Viewer.standing), posture-driven (Channel)
  relationship_patterns:
    - one_to_many
    - self_referential              # RevenueEvent.reverses_event_id -> RevenueEvent.id (chargebacks)
    - cross_aggregate               # Deliverable -> StreamSession; Subscription -> Viewer/Tier
  role_model: segregation_of_duties # TrustAgent issues strikes; AppealsOfficer resolves; resolver != issuer
  consistency_model: immediate      # every mutation + cascade visible in the same response
  entity_count: 15
  state_machine_count: 15
  calculation_count: 10
  endpoint_count: 57
  error_code_count: 30
  role_count: 6

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Channel
    parent: null
    common_fields: true
    fields:
      - { name: handle, type: string, source: input, description: "Unique creator handle; unique across all channels" }
      - { name: display_name, type: string, source: input, description: "Public display name" }
      - { name: home_platform, type: enum, source: input, description: "TWITCH | YOUTUBE — primary platform" }
      - { name: payout_schedule, type: enum, source: input, default: MONTHLY, description: "WEEKLY | BIWEEKLY | MONTHLY — payout cadence label" }
      - { name: payout_threshold_cents, type: integer, default: 10000, source: input, description: "Minimum payable balance (inclusive) required to open a payout" }
      - { name: monetization_posture, type: enum, source: computed, description: "STANDARD | RESTRICTED | SUSPENDED — derived from active strike weight and current tax form status" }
      - { name: balance_pending_cents, type: integer, source: computed, description: "Sum of provisional net_cents over PENDING revenue events" }
      - { name: balance_payable_cents, type: integer, source: computed, description: "Sum of final net over CLEARED events minus amounts held by in-flight payouts and lifetime paid" }
      - { name: lifetime_paid_cents, type: integer, source: computed, description: "Sum of net_transfer_cents over PAID payouts" }
      - { name: trust_score_bp, type: integer, source: computed, description: "0..10000 trust score derived from active strike weight (canonical hard-window variant)" }
      - { name: projected_strike_weight, type: number, source: computed, description: "Analytics-only projected strike weight: sum(severity_weight * 2^(-age_days/30)) over strikes ISSUED/UPHELD/UNDER_APPEAL/EXPIRED within the last 180 days, 4 decimal places round_half_up; NEVER gates posture" }
      - { name: consistency_score_bps, type: integer, source: computed, description: "Schedule consistency score in basis points 0..10000 over trailing 28-day window" }
      - { name: active_strike_count, type: integer, source: computed, description: "Count of strikes with strike_status in {ISSUED, UNDER_APPEAL, UPHELD}" }
      - { name: tax_form_current_id, type: string, source: system, description: "Id of the channel's current TaxForm; null until first submission" }

  - name: TaxForm
    parent: null
    common_fields: true
    fields:
      - { name: channel_id, type: string, source: input, description: "FK -> Channel.id; owning channel" }
      - { name: form_type, type: enum, source: input, description: "W9 | W8BEN | W8BENE" }
      - { name: legal_name, type: string, source: input, description: "Legal name on the form" }
      - { name: tax_id_last4, type: string, source: input, description: "Last 4 of tax identifier" }
      - { name: tax_status, type: enum, source: system, description: "SUBMITTED | VERIFIED | REJECTED | EXPIRED" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical clock time at submission" }
      - { name: verified_at, type: datetime, source: system, description: "Set on VERIFY; null otherwise" }
      - { name: rejection_reason, type: string, source: system, description: "Set on REJECT; null otherwise" }
      - { name: expires_on, type: datetime, source: computed, description: "verified_at + 365 days; null until VERIFIED" }
      - { name: prior_form_id, type: string, source: system, description: "FK -> TaxForm.id; previous current form this submission supersedes; null for first" }

  - name: RevenueEvent
    parent: null
    common_fields: false   # append-only ledger event: id + created_at only; content immutable
    fields:
      - { name: channel_id, type: string, source: input, description: "FK -> Channel.id; earning channel" }
      - { name: kind, type: enum, source: input, description: "SUBSCRIPTION | TIP | AD_SHARE | SPONSORSHIP | CHARGEBACK" }
      - { name: gross_cents, type: integer, source: input, description: "Gross amount; negative only for CHARGEBACK" }
      - { name: platform_fee_bps, type: integer, source: input, description: "Platform fee in basis points of gross, 0..10000" }
      - { name: occurred_at, type: datetime, source: input, description: "Business timestamp; determines settlement_month" }
      - { name: recognition_status, type: enum, source: system, description: "PENDING | CLEARED | REVERSED; CHARGEBACK ingests directly as CLEARED" }
      - { name: settlement_month, type: string, source: system, description: "YYYY-MM derived from occurred_at" }
      - { name: reverses_event_id, type: string, source: input, description: "FK -> RevenueEvent.id; set on CHARGEBACK events only; self-referential link to the reversed event" }
      - { name: net_cents, type: integer, source: computed, description: "Provisional net while PENDING; final net once CLEARED (see net_revenue_recognition)" }
      - { name: withholding_cents, type: integer, source: computed, description: "Per-event withholding (30% of net for W8* channels, else 0), rounded per event" }

  - name: Payout
    parent: null
    common_fields: true
    fields:
      - { name: channel_id, type: string, source: system, description: "FK -> Channel.id; paying channel" }
      - { name: payout_status, type: enum, source: system, description: "SCHEDULED | PROCESSING | PAID | FAILED | HELD | CANCELLED" }
      - { name: amount_cents, type: integer, source: computed, description: "Snapshot of eligible payable at open (post-withholding, pre-fee)" }
      - { name: withholding_cents, type: integer, source: computed, description: "Sum of per-event withholding over swept events" }
      - { name: fee_cents, type: integer, source: computed, description: "Transfer fee; tier selected on the post-withholding snapshot" }
      - { name: net_transfer_cents, type: integer, source: computed, description: "amount_cents - fee_cents" }
      - { name: settled_event_count, type: integer, source: computed, description: "Count of CLEARED events swept into this payout" }
      - { name: retry_count, type: integer, source: system, description: "Number of RETRY transitions used; starts 0, cap 3" }
      - { name: failure_reason, type: string, source: system, description: "Set on SETTLE_FAILURE; null otherwise" }
      - { name: hold_reason, type: enum, source: system, description: "NONE | TAX_FORM | POSTURE; set when cascaded into HELD" }
      - { name: scheduled_for, type: datetime, source: system, description: "Payout window label = creation clock time" }

  - name: SubscriptionTier
    parent: null
    common_fields: true
    fields:
      - { name: channel_id, type: string, source: system, description: "FK -> Channel.id; owning channel" }
      - { name: tier_code, type: enum, source: input, description: "TIER_1 | TIER_2 | TIER_3; at most one ACTIVE tier per tier_code per channel" }
      - { name: monthly_price_cents, type: integer, source: input, description: "Subscription price per cycle" }
      - { name: revenue_share_bps, type: integer, source: input, description: "Creator share of the price in basis points, 0..10000; platform fee = 10000 - revenue_share_bps" }
      - { name: perk_inventory_total, type: integer, source: input, description: "Limited MERCH perk units available per tier" }
      - { name: perk_inventory_remaining, type: integer, source: computed, description: "perk_inventory_total minus count of this tier's PerkGrants currently FULFILLED" }
      - { name: tier_status, type: enum, source: system, description: "ACTIVE | RETIRED" }

  - name: Viewer
    parent: null
    common_fields: true
    fields:
      - { name: channel_id, type: string, source: system, description: "FK -> Channel.id; home channel of this viewer identity" }
      - { name: handle, type: string, source: input, description: "Viewer handle" }
      - { name: standing, type: enum, source: computed, description: "GOOD_STANDING | TIMED_OUT | BANNED — derived from ACTIVE ModerationActions" }
      - { name: lifetime_spend_cents, type: integer, source: computed, description: "Sum of gross over this viewer's subscription cycles and tips" }

  - name: Subscription
    parent: null
    common_fields: true
    fields:
      - { name: channel_id, type: string, source: system, description: "FK -> Channel.id" }
      - { name: viewer_id, type: string, source: input, description: "FK -> Viewer.id; subscribing viewer" }
      - { name: tier_id, type: string, source: input, description: "FK -> SubscriptionTier.id" }
      - { name: sub_status, type: enum, source: system, description: "ACTIVE | PAST_DUE | CANCELLED | EXPIRED" }
      - { name: started_at, type: datetime, source: system, description: "Creation clock time" }
      - { name: current_period_end, type: datetime, source: system, description: "started_at + 1 calendar month; extended on renewal" }
      - { name: cycles_paid, type: integer, source: system, description: "Number of paid cycles; starts at 1" }

  - name: PerkGrant
    parent: null
    common_fields: true
    fields:
      - { name: subscription_id, type: string, source: system, description: "FK -> Subscription.id; granting subscription" }
      - { name: perk_kind, type: enum, source: system, description: "MERCH — limited inventory perk granted per paid cycle" }
      - { name: perk_status, type: enum, source: system, description: "PENDING | FULFILLED | FAILED | EXPIRED | VOIDED" }
      - { name: due_at, type: datetime, source: computed, description: "created_at + 14 days fulfillment SLA" }
      - { name: failure_count, type: integer, source: system, description: "Number of FAIL transitions; starts 0" }
      - { name: fulfilled_at, type: datetime, source: system, description: "Set on FULFILL; null otherwise" }

  - name: Moderator
    parent: null
    common_fields: true
    fields:
      - { name: channel_id, type: string, source: system, description: "FK -> Channel.id; channel this moderator serves" }
      - { name: moderator_handle, type: string, source: input, description: "Moderator display handle" }
      - { name: scopes, type: array, source: input, description: "Subset of [TIMEOUT, BAN]; BAN scope required to issue BAN actions" }
      - { name: moderator_status, type: enum, source: system, description: "INVITED | ACTIVE | SUSPENDED | REMOVED" }
      - { name: actions_issued_count, type: integer, source: computed, description: "Count of non-REVERSED ModerationActions issued by this moderator" }

  - name: ModerationAction
    parent: null
    common_fields: true
    fields:
      - { name: channel_id, type: string, source: system, description: "FK -> Channel.id" }
      - { name: viewer_id, type: string, source: input, description: "FK -> Viewer.id; target viewer" }
      - { name: moderator_id, type: string, source: system, description: "FK -> Moderator.id; issuing moderator; null when issued by the Creator" }
      - { name: action_kind, type: enum, source: input, description: "TIMEOUT | BAN" }
      - { name: duration_minutes, type: integer, source: input, description: "Required 1..10080 for TIMEOUT; must be omitted for BAN" }
      - { name: reason, type: string, source: input, description: "Free-form enforcement reason" }
      - { name: action_status, type: enum, source: system, description: "ACTIVE | REVERSED | EXPIRED" }
      - { name: issued_at, type: datetime, source: system, description: "Logical clock time at issuance" }
      - { name: expires_at, type: datetime, source: computed, description: "issued_at + duration_minutes for TIMEOUT; null for BAN (never auto-expires)" }

  - name: ContentStrike
    parent: null
    common_fields: true
    fields:
      - { name: channel_id, type: string, source: system, description: "FK -> Channel.id; struck channel" }
      - { name: policy_code, type: enum, source: input, description: "COPYRIGHT | HATE_SPEECH | NUDITY | HARASSMENT | SPAM" }
      - { name: severity, type: enum, source: input, description: "MINOR (weight 1) | MAJOR (weight 2) | SEVERE (weight 3)" }
      - { name: evidence_ref, type: string, source: input, description: "Evidence URL or reference" }
      - { name: strike_status, type: enum, source: system, description: "ISSUED | UNDER_APPEAL | UPHELD | REVERSED | EXPIRED" }
      - { name: issued_at, type: datetime, source: system, description: "Logical clock time at issuance" }
      - { name: expires_at, type: datetime, source: computed, description: "issued_at + 90 days; hard-window decay boundary" }
      - { name: appeal_deadline, type: datetime, source: computed, description: "issued_at + 14 days for round 1; upheld_at + 14 days for round 2" }
      - { name: appeal_round, type: integer, source: system, description: "Number of appeals used; starts 0, cap 2" }
      - { name: issued_by_user_id, type: string, source: system, description: "X-User-ID of issuing TrustAgent; recorded for segregation of duties" }
      - { name: resolved_by_user_id, type: string, source: system, description: "X-User-ID of resolving AppealsOfficer; null until resolved" }
      - { name: upheld_at, type: datetime, source: system, description: "Set on UPHELD resolution; null otherwise" }

  - name: SponsorshipDeal
    parent: null
    common_fields: true
    fields:
      - { name: channel_id, type: string, source: system, description: "FK -> Channel.id" }
      - { name: sponsor_ref, type: string, source: input, description: "Sponsor identifier; must equal Sponsor role X-User-ID for sponsor actions" }
      - { name: title, type: string, source: input, description: "Deal title" }
      - { name: category, type: enum, source: input, description: "GAMING_HARDWARE | ENERGY_DRINK | VPN | GAME_PUBLISHER | OTHER" }
      - { name: total_value_cents, type: integer, source: input, description: "Contracted sponsorship value" }
      - { name: flight_start, type: datetime, source: input, description: "Campaign flight start (closed interval)" }
      - { name: flight_end, type: datetime, source: input, description: "Campaign flight end (closed interval)" }
      - { name: required_deliverable_count, type: integer, source: input, description: "Verified deliverables required to complete the deal" }
      - { name: deal_status, type: enum, source: system, description: "DRAFT | PROPOSED | ACCEPTED | ACTIVE | COMPLETED | BREACHED | CANCELLED" }
      - { name: miss_count, type: integer, source: system, description: "Count of deliverable MISSED transitions; breach at 3" }
      - { name: verified_deliverable_count, type: integer, source: computed, description: "Count of deliverables with performance_status VERIFIED" }
      - { name: disclosure_compliant, type: boolean, source: computed, description: "true iff no deliverable has disclosure_status in {DISCLOSED_LATE, MISSING}" }

  - name: Deliverable
    parent: null
    common_fields: true
    fields:
      - { name: deal_id, type: string, source: system, description: "FK -> SponsorshipDeal.id" }
      - { name: stream_id, type: string, source: input, description: "FK -> StreamSession.id; stream the deliverable was/will be performed in; null until scheduled against a stream" }
      - { name: kind, type: enum, source: input, description: "AD_READ | SPONSORED_SEGMENT | LOGO_PLACEMENT | PRODUCT_PLACEMENT" }
      - { name: due_at, type: datetime, source: input, description: "Performance deadline; must lie within the deal flight" }
      - { name: performance_status, type: enum, source: system, description: "SCHEDULED | PERFORMED | VERIFIED | MISSED | DISPUTED — parallel axis 1" }
      - { name: disclosure_status, type: enum, source: system, description: "PENDING | DISCLOSED_ON_TIME | DISCLOSED_LATE | MISSING — parallel axis 2" }
      - { name: performed_at, type: datetime, source: system, description: "Set on PERFORM; null otherwise" }
      - { name: disclosure_deadline, type: datetime, source: computed, description: "performed_at + 24 hours; null until performed" }

  - name: StreamSession
    parent: null
    common_fields: true
    fields:
      - { name: channel_id, type: string, source: system, description: "FK -> Channel.id" }
      - { name: title, type: string, source: input, description: "Stream title" }
      - { name: scheduled_start, type: datetime, source: input, description: "Scheduled start; half-open interval [scheduled_start, scheduled_end)" }
      - { name: scheduled_end, type: datetime, source: input, description: "Scheduled end; must be strictly after scheduled_start" }
      - { name: simulcast, type: boolean, source: input, default: false, description: "True requires an APPROVED SimulcastGrant covering the full scheduled window at START" }
      - { name: stream_status, type: enum, source: system, description: "SCHEDULED | LIVE | ENDED | CANCELLED | NO_SHOW" }
      - { name: actual_start, type: datetime, source: system, description: "Set on START; null otherwise" }
      - { name: actual_end, type: datetime, source: system, description: "Set on END; null otherwise" }
      - { name: peak_viewers, type: integer, source: input, description: "Required input on END; peak concurrent viewers" }
      - { name: avg_viewers, type: integer, source: input, description: "Required input on END; average concurrent viewers" }
      - { name: punctuality_minutes_late, type: integer, source: computed, description: "max(0, actual_start - scheduled_start) in whole minutes; null until START" }

  - name: SimulcastGrant
    parent: null
    common_fields: true
    fields:
      - { name: channel_id, type: string, source: system, description: "FK -> Channel.id" }
      - { name: platform, type: enum, source: input, description: "TWITCH | YOUTUBE | KICK — simulcast target platform" }
      - { name: window_start, type: datetime, source: input, description: "Rights window start (closed interval)" }
      - { name: window_end, type: datetime, source: input, description: "Rights window end (closed interval); must be strictly after window_start" }
      - { name: exclusive, type: boolean, source: input, default: false, description: "Exclusive rights flag (recorded; conflict rule is platform+window based)" }
      - { name: grant_status, type: enum, source: system, description: "REQUESTED | APPROVED | DENIED | REVOKED | EXPIRED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Channel
    field: monetization_posture
    initial_state: RESTRICTED
    terminal_states: []
    note: "Posture-driven derived machine: recomputed immediately after every strike transition, tax-form transition, and ops-run expiry. STANDARD requires active_strike_weight == 0 AND current tax form VERIFIED. SUSPENDED when active_strike_weight >= 3.0. Otherwise RESTRICTED."
    transitions:
      - from: RESTRICTED
        to: STANDARD
        trigger: "system (tax form VERIFY recomputation when no active strikes)"
        actor: system
        preconditions: ["active_strike_weight == 0", "current TaxForm tax_status == VERIFIED"]
        side_effects: []
      - from: STANDARD
        to: RESTRICTED
        trigger: "system (tax form EXPIRED at ops run, or strike issued below suspension weight)"
        actor: system
        preconditions: ["active_strike_weight < 3.0"]
        side_effects:
          - "All Payouts of this channel in SCHEDULED -> HELD with hold_reason=TAX_FORM or POSTURE"
      - from: RESTRICTED
        to: SUSPENDED
        trigger: "system (strike issuance or appeal-uphold pushes active_strike_weight >= 3.0)"
        actor: system
        preconditions: ["active_strike_weight >= 3.0"]
        side_effects:
          - "All Payouts of this channel in SCHEDULED -> HELD with hold_reason=POSTURE"
      - from: STANDARD
        to: SUSPENDED
        trigger: "system (strike issuance or appeal-uphold pushes active_strike_weight >= 3.0)"
        actor: system
        preconditions: ["active_strike_weight >= 3.0"]
        side_effects:
          - "All Payouts of this channel in SCHEDULED -> HELD with hold_reason=POSTURE"
      - from: SUSPENDED
        to: RESTRICTED
        trigger: "system (strike REVERSED or EXPIRED drops active_strike_weight below 3.0 while tax form not VERIFIED)"
        actor: system
        preconditions: ["active_strike_weight < 3.0", "current TaxForm tax_status != VERIFIED"]
        side_effects: []
      - from: SUSPENDED
        to: STANDARD
        trigger: "system (strike REVERSED or EXPIRED drops weight to 0 while tax form VERIFIED)"
        actor: system
        preconditions: ["active_strike_weight == 0", "current TaxForm tax_status == VERIFIED"]
        side_effects: []

  - entity: TaxForm
    field: tax_status
    initial_state: SUBMITTED
    terminal_states: [EXPIRED]
    transitions:
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /api/tax-forms/{tax_form_id}/transition (action=VERIFY)"
        actor: TrustAgent
        preconditions: []
        side_effects:
          - "Channel.tax_form_current_id stays on this form; Channel posture recomputed"
          - "Each Payout of the channel in HELD with hold_reason=TAX_FORM -> SCHEDULED, hold_reason=NONE, provided Channel posture is not SUSPENDED"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /api/tax-forms/{tax_form_id}/transition (action=REJECT)"
        actor: TrustAgent
        preconditions: ["rejection_reason supplied"]
        side_effects: ["rejection_reason recorded"]
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /api/channels/{channel_id}/tax-forms (supersession: a new form is created SUBMITTED and becomes current; the rejected form remains REJECTED as history)"
        actor: Creator
        preconditions: []
        side_effects: ["New form.prior_form_id = previous current form id", "Channel.version increments by 1"]
        note: "The cycle is realized by supersession: the old row stays REJECTED; a new SUBMITTED row takes over as current."
      - from: VERIFIED
        to: EXPIRED
        trigger: "system (ops run: current_utc >= expires_on)"
        actor: system
        preconditions: []
        side_effects:
          - "Channel posture recomputed (drops to RESTRICTED when no other VERIFIED form)"
          - "Cascade: Channel -> RESTRICTED -> SCHEDULED Payouts -> HELD (hold_reason=TAX_FORM)"

  - entity: RevenueEvent
    field: recognition_status
    initial_state: PENDING
    terminal_states: [REVERSED]
    transitions:
      - from: PENDING
        to: CLEARED
        trigger: "system (ops run month settlement: settlement_month strictly before the clock's current month)"
        actor: system
        preconditions: []
        side_effects:
          - "Final net_cents recomputed with volume rebate rule (may differ from provisional)"
          - "Channel.balance_pending_cents -= provisional net; Channel.balance_payable_cents += final net"
      - from: CLEARED
        to: REVERSED
        trigger: "POST /api/revenue-events/{revenue_event_id}/reverse"
        actor: PlatformAdmin
        preconditions: ["kind != CHARGEBACK (else ERR_CHARGEABILITY_VIOLATION)", "recognition_status == CLEARED (else ERR_CHARGEABILITY_VIOLATION)", "no existing CHARGEBACK event with reverses_event_id == this event id (else ERR_CHARGEABILITY_VIOLATION)"]
        side_effects:
          - "A CHARGEBACK RevenueEvent is created (gross_cents = -original gross_cents, recognition_status=CLEARED, reverses_event_id = original id)"
          - "Channel.balance_payable_cents -= original net_cents (may drive balance negative)"
    note: "CHARGEBACK events are ingested directly in CLEARED and are terminal-immutable (no reverse of a reverse)."

  - entity: Payout
    field: payout_status
    initial_state: SCHEDULED
    terminal_states: [PAID, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: PROCESSING
        trigger: "POST /api/payouts/{payout_id}/transition (action=PROCESS)"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []
      - from: PROCESSING
        to: PAID
        trigger: "POST /api/payouts/{payout_id}/transition (action=SETTLE_SUCCESS)"
        actor: PlatformAdmin
        preconditions: []
        side_effects: ["Channel.lifetime_paid_cents += net_transfer_cents"]
      - from: PROCESSING
        to: FAILED
        trigger: "POST /api/payouts/{payout_id}/transition (action=SETTLE_FAILURE)"
        actor: PlatformAdmin
        preconditions: ["failure_reason supplied"]
        side_effects: ["failure_reason recorded"]
      - from: FAILED
        to: SCHEDULED
        trigger: "POST /api/payouts/{payout_id}/transition (action=RETRY)"
        actor: Creator
        preconditions:
          - "retry_count < 3 (else ERR_RETRY_LIMIT_REACHED)"
          - "Channel monetization_posture != SUSPENDED (else ERR_CHANNEL_SUSPENDED)"
          - "Current TaxForm tax_status == VERIFIED (else ERR_TAX_FORM_NOT_VERIFIED)"
        side_effects: ["retry_count += 1", "failure_reason cleared"]
        note: "Threshold/eligibility are validated once at open; the swept amount stays reserved while in-flight, so RETRY re-checks only the compliance gates."
      - from: SCHEDULED
        to: HELD
        trigger: "system (cascade: Channel posture leaves STANDARD, or current tax form EXPIRED/REJECTED)"
        actor: system
        preconditions: []
        side_effects: ["hold_reason set to TAX_FORM or POSTURE"]
      - from: HELD
        to: SCHEDULED
        trigger: "system (cascade release on tax VERIFY when posture not SUSPENDED, or posture returning to STANDARD releases hold_reason=POSTURE payouts)"
        actor: system
        preconditions: ["Channel monetization_posture != SUSPENDED", "current TaxForm tax_status == VERIFIED"]
        side_effects: ["hold_reason cleared to NONE"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /api/payouts/{payout_id}/transition (action=CANCEL)"
        actor: Creator
        preconditions: []
        side_effects: ["Channel.balance_payable_cents += amount_cents (compensating restore)"]
      - from: HELD
        to: CANCELLED
        trigger: "POST /api/payouts/{payout_id}/transition (action=CANCEL)"
        actor: Creator
        preconditions: []
        side_effects: ["Channel.balance_payable_cents += amount_cents (compensating restore)"]

  - entity: SubscriptionTier
    field: tier_status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /api/tiers/{tier_id}/transition (action=RETIRE)"
        actor: Creator
        preconditions: []
        side_effects: ["New Subscriptions referencing this tier are rejected while RETIRED; existing Subscriptions unaffected"]
      - from: RETIRED
        to: ACTIVE
        trigger: "POST /api/tiers/{tier_id}/transition (action=REACTIVATE)"
        actor: Creator
        preconditions: ["No other ACTIVE tier with the same tier_code on this channel (else ERR_TIER_CODE_IN_USE)"]
        side_effects: []

  - entity: Viewer
    field: standing
    initial_state: GOOD_STANDING
    terminal_states: []
    note: "Compound machine: standing is derived from this viewer's ACTIVE ModerationActions on the channel and recomputed on every action issuance, reversal, and expiry."
    transitions:
      - from: GOOD_STANDING
        to: TIMED_OUT
        trigger: "system (a TIMEOUT ModerationAction becomes ACTIVE for this viewer)"
        actor: system
        preconditions: ["at least one ACTIVE TIMEOUT", "no ACTIVE BAN"]
        side_effects: []
      - from: GOOD_STANDING
        to: BANNED
        trigger: "system (a BAN ModerationAction becomes ACTIVE for this viewer)"
        actor: system
        preconditions: ["at least one ACTIVE BAN"]
        side_effects: ["All viewer's Subscriptions on this channel in ACTIVE/PAST_DUE -> CANCELLED", "Those subscriptions' PENDING/FAILED PerkGrants -> VOIDED"]
      - from: TIMED_OUT
        to: BANNED
        trigger: "system (a BAN becomes ACTIVE while a TIMEOUT is active)"
        actor: system
        preconditions: ["at least one ACTIVE BAN"]
        side_effects: ["Same subscription/perk cascade as GOOD_STANDING -> BANNED"]
      - from: TIMED_OUT
        to: GOOD_STANDING
        trigger: "system (last ACTIVE TIMEOUT REVERSED or EXPIRED)"
        actor: system
        preconditions: ["no ACTIVE TIMEOUT", "no ACTIVE BAN"]
        side_effects: []
      - from: BANNED
        to: GOOD_STANDING
        trigger: "system (all ACTIVE BANs REVERSED and no ACTIVE TIMEOUT)"
        actor: system
        preconditions: ["no ACTIVE BAN", "no ACTIVE TIMEOUT"]
        side_effects: []
      - from: BANNED
        to: TIMED_OUT
        trigger: "system (all ACTIVE BANs REVERSED while a TIMEOUT remains ACTIVE)"
        actor: system
        preconditions: ["no ACTIVE BAN", "at least one ACTIVE TIMEOUT"]
        side_effects: []

  - entity: Subscription
    field: sub_status
    initial_state: ACTIVE
    terminal_states: [CANCELLED, EXPIRED]
    transitions:
      - from: ACTIVE
        to: PAST_DUE
        trigger: "POST /api/subscriptions/{subscription_id}/transition (action=MARK_PAST_DUE)"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []
      - from: PAST_DUE
        to: ACTIVE
        trigger: "POST /api/subscriptions/{subscription_id}/transition (action=RECOVER)"
        actor: PlatformAdmin
        preconditions: ["Viewer standing != BANNED (else ERR_VIEWER_BANNED)"]
        side_effects: []
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /api/subscriptions/{subscription_id}/transition (action=CANCEL) or system (viewer BANNED cascade)"
        actor: "Creator or system"
        preconditions: []
        side_effects: ["This subscription's PerkGrants in PENDING or FAILED -> VOIDED (no inventory restore: FULFILLED grants are untouched)"]
      - from: PAST_DUE
        to: CANCELLED
        trigger: "POST /api/subscriptions/{subscription_id}/transition (action=CANCEL) or system (viewer BANNED cascade)"
        actor: "Creator or system"
        preconditions: []
        side_effects: ["Same perk cascade as ACTIVE -> CANCELLED"]
      - from: PAST_DUE
        to: EXPIRED
        trigger: "system (ops run: current_utc >= current_period_end + 7 days grace)"
        actor: system
        preconditions: []
        side_effects: ["PerkGrants in PENDING or FAILED -> VOIDED"]
    note: "ACTIVE has no automatic EXPIRED edge — renewal rolls the period (calculations.subscription_renewal). EXPIRED is reachable only from PAST_DUE grace lapse. CANCELLED/EXPIRED both void non-terminal perks."

  - entity: PerkGrant
    field: perk_status
    initial_state: PENDING
    terminal_states: [EXPIRED, VOIDED]
    transitions:
      - from: PENDING
        to: FULFILLED
        trigger: "POST /api/perk-grants/{perk_grant_id}/transition (action=FULFILL)"
        actor: Creator
        preconditions: ["Tier perk_inventory_remaining > 0 (else ERR_PERK_INVENTORY_EXHAUSTED)"]
        side_effects: ["Tier.perk_inventory_remaining -= 1", "fulfilled_at = clock"]
      - from: PENDING
        to: FAILED
        trigger: "POST /api/perk-grants/{perk_grant_id}/transition (action=FAIL)"
        actor: Creator
        preconditions: []
        side_effects: ["failure_count += 1"]
      - from: FAILED
        to: PENDING
        trigger: "POST /api/perk-grants/{perk_grant_id}/transition (action=RETRY)"
        actor: Creator
        preconditions: ["current_utc <= due_at (past-SLA grants are no longer retryable -> ERR_INVALID_STATE)"]
        side_effects: []
      - from: PENDING
        to: EXPIRED
        trigger: "system (ops run: current_utc > due_at)"
        actor: system
        preconditions: []
        side_effects: []
      - from: FAILED
        to: EXPIRED
        trigger: "system (ops run: current_utc > due_at)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PENDING
        to: VOIDED
        trigger: "system (subscription CANCELLED/EXPIRED cascade, or viewer BANNED cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: FAILED
        to: VOIDED
        trigger: "system (subscription CANCELLED/EXPIRED cascade, or viewer BANNED cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: FULFILLED
        to: VOIDED
        trigger: "POST /api/perk-grants/{perk_grant_id}/transition (action=VOID)"
        actor: Creator
        preconditions: []
        side_effects: ["Tier.perk_inventory_remaining += 1 (compensating restore)"]

  - entity: Moderator
    field: moderator_status
    initial_state: INVITED
    terminal_states: [REMOVED]
    transitions:
      - from: INVITED
        to: ACTIVE
        trigger: "POST /api/moderators/{moderator_id}/transition (action=ACCEPT)"
        actor: Moderator
        preconditions: ["X-User-ID == this Moderator.id (the invitee accepts their own invite)"]
        side_effects: []
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /api/moderators/{moderator_id}/transition (action=SUSPEND)"
        actor: Creator
        preconditions: []
        side_effects: ["Moderator may no longer issue ModerationActions while SUSPENDED"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /api/moderators/{moderator_id}/transition (action=REINSTATE)"
        actor: Creator
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: REMOVED
        trigger: "POST /api/moderators/{moderator_id}/transition (action=REMOVE)"
        actor: Creator
        preconditions: []
        side_effects: ["Existing ModerationActions issued by this moderator are NOT auto-reversed"]
      - from: SUSPENDED
        to: REMOVED
        trigger: "POST /api/moderators/{moderator_id}/transition (action=REMOVE)"
        actor: Creator
        preconditions: []
        side_effects: []

  - entity: ModerationAction
    field: action_status
    initial_state: ACTIVE
    terminal_states: [REVERSED, EXPIRED]
    transitions:
      - from: ACTIVE
        to: REVERSED
        trigger: "POST /api/moderation-actions/{moderation_action_id}/reverse"
        actor: "Creator or AppealsOfficer"
        preconditions: []
        side_effects: ["Viewer.standing recomputed", "issuing Moderator.actions_issued_count -= 1"]
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (ops run: action_kind == TIMEOUT and current_utc >= expires_at)"
        actor: system
        preconditions: []
        side_effects: ["Viewer.standing recomputed"]

  - entity: ContentStrike
    field: strike_status
    initial_state: ISSUED
    terminal_states: [REVERSED, EXPIRED]
    transitions:
      - from: ISSUED
        to: UNDER_APPEAL
        trigger: "POST /api/strikes/{strike_id}/appeal"
        actor: Creator
        preconditions:
          - "appeal_round < 2 (else ERR_APPEAL_LIMIT_REACHED)"
          - "current_utc <= appeal_deadline (else ERR_APPEAL_WINDOW_CLOSED)"
        side_effects: ["appeal_round += 1", "Channel posture recomputed (strike weight still counts while UNDER_APPEAL)"]
      - from: UNDER_APPEAL
        to: UPHELD
        trigger: "POST /api/strikes/{strike_id}/resolve-appeal (outcome=UPHELD)"
        actor: AppealsOfficer
        preconditions: ["resolved_by X-User-ID != issued_by_user_id (else ERR_SELF_REVIEW_FORBIDDEN)"]
        side_effects: ["upheld_at = clock", "appeal_deadline recomputed = upheld_at + 14 days", "Channel posture recomputed"]
      - from: UNDER_APPEAL
        to: REVERSED
        trigger: "POST /api/strikes/{strike_id}/resolve-appeal (outcome=REVERSED)"
        actor: AppealsOfficer
        preconditions: ["resolved_by X-User-ID != issued_by_user_id (else ERR_SELF_REVIEW_FORBIDDEN)"]
        side_effects: ["Strike weight removed", "Channel posture recomputed", "If posture returns to STANDARD: HELD payouts with hold_reason=POSTURE -> SCHEDULED"]
      - from: UPHELD
        to: UNDER_APPEAL
        trigger: "POST /api/strikes/{strike_id}/appeal (second and final appeal round)"
        actor: Creator
        preconditions:
          - "appeal_round < 2 (else ERR_APPEAL_LIMIT_REACHED)"
          - "current_utc <= appeal_deadline (else ERR_APPEAL_WINDOW_CLOSED)"
        side_effects: ["appeal_round += 1"]
      - from: ISSUED
        to: EXPIRED
        trigger: "system (ops run: current_utc >= expires_at)"
        actor: system
        preconditions: []
        side_effects: ["Strike weight removed", "Channel posture recomputed"]
      - from: UPHELD
        to: EXPIRED
        trigger: "system (ops run: current_utc >= expires_at; UNDER_APPEAL strikes are exempt from expiry — appeal tolls the window)"
        actor: system
        preconditions: []
        side_effects: ["Strike weight removed", "Channel posture recomputed"]

  - entity: SponsorshipDeal
    field: deal_status
    initial_state: DRAFT
    terminal_states: [COMPLETED, BREACHED, CANCELLED]
    transitions:
      - from: DRAFT
        to: PROPOSED
        trigger: "POST /api/deals/{deal_id}/transition (action=PROPOSE)"
        actor: Creator
        preconditions: []
        side_effects: []
      - from: PROPOSED
        to: ACCEPTED
        trigger: "POST /api/deals/{deal_id}/transition (action=ACCEPT)"
        actor: Sponsor
        preconditions: ["X-User-ID == deal.sponsor_ref (else ERR_SPONSOR_MISMATCH)"]
        side_effects: []
      - from: ACCEPTED
        to: ACTIVE
        trigger: "POST /api/deals/{deal_id}/transition (action=ACTIVATE)"
        actor: Creator
        preconditions:
          - "Channel monetization_posture != SUSPENDED (else ERR_CHANNEL_SUSPENDED)"
          - "current_utc >= flight_start and current_utc <= flight_end (else ERR_INVALID_STATE)"
          - "Category exclusivity: no other deal of this channel with deal_status in {ACCEPTED, ACTIVE} and same category whose [flight_start, flight_end] closed interval intersects this deal's (else ERR_CATEGORY_EXCLUSIVITY_CONFLICT)"
        side_effects: ["A SPONSORSHIP RevenueEvent is created: gross_cents = total_value_cents, platform_fee_bps = 1000, occurred_at = clock, recognition_status = PENDING"]
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /api/deals/{deal_id}/transition (action=CANCEL)"
        actor: Creator
        preconditions: []
        side_effects: []
      - from: PROPOSED
        to: CANCELLED
        trigger: "POST /api/deals/{deal_id}/transition (action=CANCEL)"
        actor: Creator
        preconditions: []
        side_effects: []
      - from: ACCEPTED
        to: CANCELLED
        trigger: "POST /api/deals/{deal_id}/transition (action=CANCEL)"
        actor: Creator
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: BREACHED
        trigger: "system (cascade: a deliverable MISSED transition raises miss_count to >= 3)"
        actor: system
        preconditions: ["miss_count >= 3"]
        side_effects:
          - "A CHARGEBACK RevenueEvent is created clawing back the sponsorship inflow: gross_cents = -total_value_cents, platform_fee_bps = 1000, reverses_event_id = the ACTIVATE-time SPONSORSHIP event id, recognition_status = CLEARED"
          - "Channel.balance_payable_cents recomputed (clawback net subtracted)"
      - from: ACTIVE
        to: COMPLETED
        trigger: "system (ops run: verified_deliverable_count >= required_deliverable_count AND current_utc >= flight_end AND disclosure_compliant == true)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Deliverable
    field: "performance_status (axis 1) x disclosure_status (axis 2)"
    initial_state: "SCHEDULED x PENDING"
    terminal_states: ["VERIFIED (any disclosure axis value except PENDING)"]
    note: "Two parallel state dimensions evolve on one row. performance_status: SCHEDULED|PERFORMED|VERIFIED|MISSED|DISPUTED. disclosure_status: PENDING|DISCLOSED_ON_TIME|DISCLOSED_LATE|MISSING."
    transitions:
      - from: SCHEDULED
        to: PERFORMED
        trigger: "POST /api/deliverables/{deliverable_id}/transition (action=PERFORM, stream_id required)"
        actor: Creator
        preconditions:
          - "Channel monetization_posture != SUSPENDED (else ERR_CHANNEL_SUSPENDED)"
          - "current_utc <= due_at (else ERR_DELIVERABLE_OVERDUE)"
          - "Referenced StreamSession stream_status == ENDED (else ERR_INVALID_STATE)"
        side_effects: ["performed_at = clock", "disclosure_deadline = performed_at + 24h", "stream_id bound"]
      - from: PERFORMED
        to: VERIFIED
        trigger: "POST /api/deliverables/{deliverable_id}/transition (action=VERIFY)"
        actor: Sponsor
        preconditions:
          - "X-User-ID == deal.sponsor_ref (else ERR_SPONSOR_MISMATCH)"
          - "disclosure_status in {DISCLOSED_ON_TIME, DISCLOSED_LATE} (else ERR_DISCLOSURE_REQUIRED)"
        side_effects: ["Deal.verified_deliverable_count recomputed"]
      - from: PERFORMED
        to: DISPUTED
        trigger: "POST /api/deliverables/{deliverable_id}/transition (action=DISPUTE)"
        actor: Sponsor
        preconditions: ["X-User-ID == deal.sponsor_ref (else ERR_SPONSOR_MISMATCH)"]
        side_effects: []
      - from: DISPUTED
        to: VERIFIED
        trigger: "POST /api/deliverables/{deliverable_id}/transition (action=VERIFY)"
        actor: Sponsor
        preconditions:
          - "X-User-ID == deal.sponsor_ref (else ERR_SPONSOR_MISMATCH)"
          - "disclosure_status in {DISCLOSED_ON_TIME, DISCLOSED_LATE} (else ERR_DISCLOSURE_REQUIRED)"
        side_effects: ["Deal.verified_deliverable_count recomputed"]
      - from: MISSED
        to: SCHEDULED
        trigger: "POST /api/deliverables/{deliverable_id}/reschedule"
        actor: Creator
        preconditions: ["expected_deliverable_version == current version (OCC, else ERR_STALE_VERSION)", "new due_at within deal flight"]
        side_effects: ["due_at replaced", "version increments by 1", "miss_count NOT decremented (misses are permanent history)"]
      - from: DISPUTED
        to: SCHEDULED
        trigger: "POST /api/deliverables/{deliverable_id}/reschedule"
        actor: Creator
        preconditions: ["expected_deliverable_version == current version (OCC, else ERR_STALE_VERSION)", "new due_at within deal flight"]
        side_effects: ["due_at replaced", "performance fields cleared (performed_at, stream_id)", "disclosure_status reset to PENDING", "version increments by 1"]
      - from: SCHEDULED
        to: MISSED
        trigger: "system (ops run: current_utc > due_at)"
        actor: system
        preconditions: []
        side_effects: ["Deal.miss_count += 1", "If miss_count >= 3: Deal -> BREACHED with clawback cascade"]
      - from: "PERFORMED (disclosure axis: PENDING)"
        to: "PERFORMED (disclosure axis: DISCLOSED_ON_TIME)"
        trigger: "POST /api/deliverables/{deliverable_id}/transition (action=DISCLOSE) with current_utc <= disclosure_deadline"
        actor: Creator
        preconditions: ["performance_status == PERFORMED"]
        side_effects: ["Deal.disclosure_compliant recomputed"]
      - from: "PERFORMED (disclosure axis: PENDING)"
        to: "PERFORMED (disclosure axis: DISCLOSED_LATE)"
        trigger: "POST /api/deliverables/{deliverable_id}/transition (action=DISCLOSE) with current_utc > disclosure_deadline"
        actor: Creator
        preconditions: ["performance_status == PERFORMED"]
        side_effects: ["Deal.disclosure_compliant recomputed (set false)"]
      - from: "PERFORMED (disclosure axis: PENDING)"
        to: "PERFORMED (disclosure axis: MISSING)"
        trigger: "system (ops run: current_utc > performed_at + 72h with no disclosure)"
        actor: system
        preconditions: []
        side_effects: ["Deal.disclosure_compliant recomputed (set false)"]

  - entity: StreamSession
    field: stream_status
    initial_state: SCHEDULED
    terminal_states: [ENDED, CANCELLED, NO_SHOW]
    transitions:
      - from: SCHEDULED
        to: LIVE
        trigger: "POST /api/streams/{stream_id}/transition (action=START)"
        actor: Creator
        preconditions:
          - "current_utc <= scheduled_start + 30 minutes grace (else the stream is NO_SHOW-eligible; START after grace -> ERR_INVALID_STATE)"
          - "If simulcast == true: an APPROVED SimulcastGrant exists for this channel whose [window_start, window_end] fully covers [scheduled_start, scheduled_end] (else ERR_SIMULCAST_GRANT_MISSING)"
        side_effects: ["actual_start = clock", "punctuality_minutes_late = max(0, actual_start - scheduled_start) in whole minutes"]
      - from: LIVE
        to: ENDED
        trigger: "POST /api/streams/{stream_id}/transition (action=END, peak_viewers + avg_viewers required)"
        actor: Creator
        preconditions: []
        side_effects: ["actual_end = clock", "Channel.consistency_score_bps recomputed over trailing 28-day window"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /api/streams/{stream_id}/transition (action=CANCEL)"
        actor: Creator
        preconditions: []
        side_effects: ["Channel.consistency_score_bps recomputed (cancellation keeps the slot in the scheduled set)"]
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "system (ops run: current_utc > scheduled_start + 30 minutes and still SCHEDULED)"
        actor: system
        preconditions: []
        side_effects: ["Channel.consistency_score_bps recomputed"]

  - entity: SimulcastGrant
    field: grant_status
    initial_state: REQUESTED
    terminal_states: [DENIED, REVOKED, EXPIRED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /api/simulcast-grants/{simulcast_grant_id}/transition (action=APPROVE)"
        actor: PlatformAdmin
        preconditions:
          - "Channel monetization_posture != SUSPENDED (else ERR_CHANNEL_SUSPENDED)"
          - "Buffer rule: for every other APPROVED grant on the same channel+platform, the gap between the two windows must be >= 24h in both directions — i.e. new.window_start >= other.window_end + 24h OR other.window_start >= new.window_end + 24h (else ERR_SIMULCAST_BUFFER_CONFLICT)"
        side_effects: []
      - from: REQUESTED
        to: DENIED
        trigger: "POST /api/simulcast-grants/{simulcast_grant_id}/transition (action=DENY)"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: REVOKED
        trigger: "POST /api/simulcast-grants/{simulcast_grant_id}/transition (action=REVOKE)"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: EXPIRED
        trigger: "system (ops run: current_utc >= window_end)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (true races only, OCC-resolved)
# =============================================================================
concurrency_rules:
  - rule_id: channel-payout-settings-stale
    parent_entity: Channel
    write_endpoint: "PATCH /api/channels/{channel_id}/payout-settings"
    occ_field: expected_channel_version
    description: |
      Updating a channel's payout schedule/threshold against a Channel whose
      version has advanced since the client last observed it is rejected. A
      second writer carrying a stale expected_channel_version must re-read the
      channel before its settings may replace the current ones.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: tax-form-supersede-stale-channel
    parent_entity: Channel
    write_endpoint: "POST /api/channels/{channel_id}/tax-forms"
    occ_field: expected_channel_version
    description: |
      Submitting a new TaxForm supersedes the channel's current form. Doing so
      against a Channel whose version has advanced since the client last
      observed it (e.g. another form was just submitted and became current) is
      rejected as a stale-version conflict.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: deliverable-reschedule-stale
    parent_entity: Deliverable
    write_endpoint: "POST /api/deliverables/{deliverable_id}/reschedule"
    occ_field: expected_deliverable_version
    description: |
      Rescheduling a MISSED or DISPUTED deliverable against a Deliverable whose
      version has advanced since the client last observed it is rejected; the
      client must re-read the deliverable and re-issue with the current version.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: net_revenue_recognition
    trigger: "RevenueEvent ingestion (provisional) and ops-run month settlement (final)"
    algorithm: aggregation
    formula: |
      PROVISIONAL (at ingestion, recognition_status=PENDING):
        net_cents = round_half_up(gross_cents * (10000 - platform_fee_bps) / 10000)
      FINAL (at ops-run settlement of settlement_month M):
        month_gross = sum(gross_cents) over the channel's non-CHARGEBACK events with settlement_month == M being settled in this run
        effective_fee_bps = platform_fee_bps - VOLUME_REBATE_BPS if month_gross >= VOLUME_REBATE_THRESHOLD_CENTS else platform_fee_bps
        net_cents = round_half_up(gross_cents * (10000 - effective_fee_bps) / 10000)
      The rebate is a CLIFF applied to every event settled in that month (not marginal).
      CHARGEBACK events always use the plain fee (no rebate) and are CLEARED at ingestion.
    input_set: "Events of one channel; PENDING events with settlement_month strictly before the clock's current month"
    constants:
      VOLUME_REBATE_THRESHOLD_CENTS: 5000000
      VOLUME_REBATE_BPS: 250
    precision: "integer cents, round_half_up per event"
    variants:
      - name: provisional
        when: "At ingestion; drives Channel.balance_pending_cents"
        difference: "Uses the event's platform_fee_bps as-is; never applies the volume rebate"
      - name: final
        when: "At ops-run month settlement; drives Channel.balance_payable_cents"
        difference: "Applies the 250bps rebate to ALL events of the month when month gross >= 5000000, so identical events yield larger net_cents than provisional once the cliff is crossed"

  - name: withholding_per_event
    trigger: "Payout opening sweeps eligible CLEARED events"
    algorithm: aggregation
    formula: |
      For each swept event: withholding_cents(event) = round_half_up(net_cents * WITHHOLDING_BPS / 10000)
        where WITHHOLDING_BPS = 3000 when the channel's current tax form form_type is W8BEN or W8BENE, else 0 (W9).
      payout.withholding_cents = sum of per-event withholding_cents over swept events.
      PINNED ROUNDING ORDER: round each event first, THEN sum. (The alternative — sum net then round — can differ by cents and is NOT used.)
    input_set: "CLEARED revenue events swept into the payout"
    constants:
      WITHHOLDING_BPS_W8: 3000
    precision: "integer cents, round_half_up, per-event then summed"
    variants: []

  - name: payout_settlement
    trigger: "POST /api/channels/{channel_id}/payouts (payout opening)"
    algorithm: tiered_pricing
    formula: |
      PINNED EVALUATION ORDER (removes the circular look — fee tier is keyed on the PRE-fee snapshot):
        (1) snapshot = Channel.balance_payable_cents - payout.withholding_cents   [withholding computed first per withholding_per_event]
        (2) fee_bps selected on snapshot: snapshot >= 1000000 -> 25; snapshot >= 100000 -> 50; else 100
        (3) payout.amount_cents = snapshot
        (4) payout.fee_cents = round_half_up(snapshot * fee_bps / 10000)
        (5) payout.net_transfer_cents = amount_cents - fee_cents
    input_set: "Channel payable balance and the swept CLEARED event set at open time"
    constants:
      FEE_TIER_HIGH_CENTS: 1000000
      FEE_TIER_MID_CENTS: 100000
      FEE_BPS_HIGH: 25
      FEE_BPS_MID: 50
      FEE_BPS_LOW: 100
    precision: "integer cents, round_half_up"
    variants: []

  - name: payout_threshold_gate
    trigger: "POST /api/channels/{channel_id}/payouts and Payout RETRY"
    algorithm: threshold
    formula: |
      eligible iff Channel.balance_payable_cents >= Channel.payout_threshold_cents   (INCLUSIVE >=: exactly-at-threshold is eligible)
      also requires at least one swept CLEARED event (else ERR_NO_ELIGIBLE_REVENUE)
    input_set: "Channel balances"
    constants: {}
    precision: "integer cents; boundary is inclusive"
    variants: []

  - name: strike_weight
    trigger: "Every strike transition and ops-run strike expiry; drives Channel posture"
    algorithm: decay_function
    formula: |
      CANONICAL (hard window): active_strike_weight = sum(severity_weight) over strikes of the channel
        with strike_status in {ISSUED, UNDER_APPEAL, UPHELD} and expires_at > current_utc
        severity_weight: MINOR=1, MAJOR=2, SEVERE=3
      Posture: weight >= 3.0 -> SUSPENDED; weight > 0 OR current tax form not VERIFIED -> RESTRICTED; else STANDARD.
      trust_score_bp = max(0, 10000 - 2500 * active_strike_weight)
    input_set: "ContentStrikes of one channel"
    constants:
      WEIGHT_MINOR: 1
      WEIGHT_MAJOR: 2
      WEIGHT_SEVERE: 3
      SUSPENSION_WEIGHT: 3
      TRUST_PENALTY_PER_WEIGHT_BP: 2500
    precision: "integer weights; comparison >= SUSPENSION_WEIGHT is inclusive"
    variants:
      - name: projected_decay
        when: "Analytics projection only (GET /api/channels/{id} analytics context); NEVER drives posture"
        difference: "weight = sum(severity_weight * 2^(-age_days/30)) — continuous decay instead of the hard 90-day cutoff, so identical strike sets produce different (nonzero, smoothly declining) weight"
  - name: perk_inventory
    trigger: "PerkGrant FULFILL and VOID transitions"
    algorithm: aggregation
    formula: |
      tier.perk_inventory_remaining = tier.perk_inventory_total - count(this tier's PerkGrants currently in FULFILLED)
      Invariant: remaining + count(FULFILLED) == perk_inventory_total at all times
        (FULFILL: -1; VOID from FULFILLED: +1; no other transition touches the counter)
    input_set: "PerkGrants of the subscription's tier (via subscription -> tier_id)"
    constants: {}
    precision: "integer units"
    variants: []

  - name: consistency_score
    trigger: "StreamSession END / CANCEL / NO_SHOW (ops run) — recomputed over trailing window"
    algorithm: weighted_scoring
    formula: |
      Window: streams of the channel with scheduled_start in [current_utc - 28 days, current_utc].
      scheduled_count = count(streams in window with stream_status in {LIVE, ENDED, NO_SHOW, CANCELLED})
      If scheduled_count == 0: consistency_score_bps = 10000 (vacuous perfect score).
      attended = count(status == ENDED)
      attendance_rate = attended / scheduled_count
      avg_late = mean(punctuality_minutes_late over ENDED streams); 0 when attended == 0
      punctuality_factor = max(0, 1 - avg_late / 30)
      avg_dur_ratio = mean(actual_duration_minutes / scheduled_duration_minutes over ENDED streams); 1 when attended == 0
      duration_factor = min(1, avg_dur_ratio)
      score = 10000 * attendance_rate * (0.5 + 0.3 * punctuality_factor + 0.2 * duration_factor)
      consistency_score_bps = round_half_up(score) clamped to [0, 10000]
    input_set: "StreamSessions of one channel in the trailing 28-day window"
    constants:
      WINDOW_DAYS: 28
      LATE_TOLERANCE_MIN: 30
      W_BASE: 0.5
      W_PUNCTUALITY: 0.3
      W_DURATION: 0.2
    precision: "basis points integer, round_half_up; means computed in exact rational then rounded once at the end"
    variants: []

  - name: subscription_renewal
    trigger: "ops run step 8"
    algorithm: chronological
    formula: |
      For each ACTIVE Subscription with current_period_end <= current_utc (processed in order current_period_end ASC, tie-break created_at ASC):
        cycles_paid += 1; current_period_end += 1 calendar month
        create RevenueEvent(kind=SUBSCRIPTION, gross_cents=tier.monthly_price_cents, platform_fee_bps=10000-tier.revenue_share_bps, occurred_at=clock, PENDING)
        create PerkGrant(perk_kind=MERCH, PENDING, due_at=clock+14d)
        Viewer.lifetime_spend_cents += tier.monthly_price_cents
    input_set: "ACTIVE subscriptions past period end"
    constants:
      PERIOD_MONTHS: 1
      PERK_SLA_DAYS: 14
    precision: "calendar-month arithmetic (same day-of-month, clamped to month length)"
    variants: []

  - name: moderator_escalation_count
    trigger: "ModerationAction issuance (BAN eligibility) and reversal"
    algorithm: aggregation
    formula: |
      prior_timeouts = count(ModerationActions of this channel+viewer with action_kind=TIMEOUT and action_status in {ACTIVE, EXPIRED})
      BAN requires prior_timeouts >= 2 at issuance (progressive discipline). REVERSED timeouts do NOT count.
    input_set: "ModerationActions for one (channel, viewer) pair"
    constants:
      BAN_MIN_PRIOR_TIMEOUTS: 2
    precision: "integer count; >= inclusive"
    variants: []

  - name: payout_balance_ledger
    trigger: "Payout open / CANCEL / PAID; revenue clearance; chargeback"
    algorithm: aggregation
    formula: |
      Conservation invariant (money): for every channel,
        balance_payable_cents + sum(amount_cents over Payouts in {SCHEDULED, PROCESSING, FAILED, HELD}) + lifetime_paid_cents + lifetime_fees_cents_accumulated_as_fee_cents_of_PAID
          == sum(net_cents over CLEARED RevenueEvents) - sum(net_cents over REVERSED originals already subtracted at reversal)
      Simplified pinned form used by the implementation:
        balance_payable_cents = sum(final net over CLEARED events, with CHARGEBACK net negative) - sum(amount_cents over payouts in {SCHEDULED, PROCESSING, FAILED, HELD}) - sum(amount_cents over PAID payouts)
        lifetime_paid_cents = sum(net_transfer_cents over PAID payouts)
      Forward/compensating pair: open payout deducts amount_cents from payable; CANCEL restores exactly amount_cents. Open+Cancel leaves payable unchanged.
    input_set: "RevenueEvents and Payouts of one channel"
    constants: {}
    precision: "integer cents"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"
  - priority: 2
    category: existence
    check: "Request body parses; required fields present; enums in declared sets; integer ranges respected (e.g. duration_minutes 1..10080 for TIMEOUT, omitted for BAN; scheduled_end > scheduled_start; window_end > window_start; due_at within deal flight)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"
  - priority: 3
    category: auth
    check: "X-User-Role is listed on the endpoint's roles; for /transition endpoints the role must also be permitted for the requested action (per-action map in §1.5)"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all endpoints"
  - priority: 4
    category: existence
    check: "Path ids exist, validated left-to-right; body-referenced FK ids (viewer_id, tier_id, stream_id, reverses_event_id) exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with ids"
  - priority: 5
    category: auth
    check: "Ownership/identity: Creator X-User-ID must equal the owning channel id; Sponsor X-User-ID must equal deal.sponsor_ref; Moderator ACCEPT requires X-User-ID == moderator id"
    error_id: ERR_CHANNEL_OWNERSHIP_MISMATCH
    http_status: 403
    applies_to: "Creator-scoped writes, Sponsor actions, Moderator ACCEPT"
  - priority: 6
    category: state
    check: "Target entity is in a state that admits the requested transition per §1.2 (covers wrong-from-state, terminal lockdown, duplicate/repeat actions)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition and stateful write endpoints"
  - priority: 6
    category: state
    check: "Payout retry cap: RETRY requires retry_count < 3"
    error_id: ERR_RETRY_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /api/payouts/{payout_id}/transition (action=RETRY)"
  - priority: 7
    category: business_safety
    check: "Compliance gates: channel not SUSPENDED for payout open/retry, deal ACTIVATE, deliverable PERFORM, simulcast APPROVE; strike appeal resolution forbidden when resolver == issuer; BAN requires >= 2 prior non-reversed TIMEOUTs"
    error_id: ERR_CHANNEL_SUSPENDED
    http_status: 409
    applies_to: "payout open/retry, deal ACTIVATE, deliverable PERFORM, simulcast APPROVE"
  - priority: 8
    category: business_safety
    check: "Segregation of duties on appeal resolution: AppealsOfficer X-User-ID != ContentStrike.issued_by_user_id"
    error_id: ERR_SELF_REVIEW_FORBIDDEN
    http_status: 403
    applies_to: "POST /api/strikes/{strike_id}/resolve-appeal"
  - priority: 9
    category: business_safety
    check: "Progressive discipline: BAN requires prior_timeouts >= 2 for this (channel, viewer)"
    error_id: ERR_PROGRESSIVE_DISCIPLINE
    http_status: 409
    applies_to: "POST /api/channels/{channel_id}/moderation-actions with action_kind=BAN"
  - priority: 10
    category: business_temporal
    check: "Strike appeal window: current_utc <= appeal_deadline"
    error_id: ERR_APPEAL_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /api/strikes/{strike_id}/appeal"
  - priority: 11
    category: business_temporal
    check: "Appeal rounds exhausted: appeal_round >= 2"
    error_id: ERR_APPEAL_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /api/strikes/{strike_id}/appeal"
  - priority: 12
    category: business_temporal
    check: "Stream scheduling half-open overlap: no other StreamSession of the channel with stream_status in {SCHEDULED, LIVE} whose [scheduled_start, scheduled_end) intersects the new one (adjacency start==other.end is allowed)"
    error_id: ERR_STREAM_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /api/channels/{channel_id}/streams"
  - priority: 13
    category: business_temporal
    check: "Simulcast buffer: every other APPROVED grant on same channel+platform must be separated by >= 24h in both directions"
    error_id: ERR_SIMULCAST_BUFFER_CONFLICT
    http_status: 409
    applies_to: "POST /api/simulcast-grants/{simulcast_grant_id}/transition (action=APPROVE)"
  - priority: 14
    category: business_temporal
    check: "Deal category exclusivity: no other {ACCEPTED, ACTIVE} deal of the channel with same category and closed-interval flight intersection (shared boundary counts as conflict)"
    error_id: ERR_CATEGORY_EXCLUSIVITY_CONFLICT
    http_status: 409
    applies_to: "POST /api/deals/{deal_id}/transition (action=ACTIVATE)"
  - priority: 15
    category: business_temporal
    check: "Deliverable timeliness: PERFORM requires current_utc <= due_at; simulcast stream START requires covering APPROVED grant"
    error_id: ERR_DELIVERABLE_OVERDUE
    http_status: 409
    applies_to: "POST /api/deliverables/{deliverable_id}/transition (action=PERFORM)"
  - priority: 16
    category: business_temporal
    check: "Simulcast stream START requires an APPROVED grant fully covering the scheduled window"
    error_id: ERR_SIMULCAST_GRANT_MISSING
    http_status: 409
    applies_to: "POST /api/streams/{stream_id}/transition (action=START, simulcast=true)"
  - priority: 17
    category: business_constraint
    check: "OCC: expected_<parent>_version equals the parent entity's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "PATCH /api/channels/{channel_id}/payout-settings; POST /api/channels/{channel_id}/tax-forms; POST /api/deliverables/{deliverable_id}/reschedule"
  - priority: 18
    category: business_constraint
    check: "Uniqueness: channel handle unique; at most one ACTIVE tier per (channel, tier_code); at most one in-flight payout per channel (SCHEDULED/PROCESSING/FAILED/HELD)"
    error_id: ERR_TIER_CODE_IN_USE
    http_status: 409
    applies_to: "tier create/reactivate (ERR_TIER_CODE_IN_USE); channel create (ERR_INVALID_REQUEST on duplicate handle); payout open (ERR_PAYOUT_IN_FLIGHT)"
  - priority: 19
    category: business_constraint
    check: "Sponsor identity on sponsor actions"
    error_id: ERR_SPONSOR_MISMATCH
    http_status: 403
    applies_to: "deal ACCEPT; deliverable VERIFY/DISPUTE"
  - priority: 20
    category: business_constraint
    check: "Moderator gating: issuing moderator must be ACTIVE and hold the scope matching action_kind"
    error_id: ERR_MODERATOR_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /api/channels/{channel_id}/moderation-actions (ERR_MODERATOR_NOT_ACTIVE; scope failure -> ERR_MODERATOR_SCOPE_MISSING)"
  - priority: 21
    category: business_constraint
    check: "Perk inventory available at FULFILL"
    error_id: ERR_PERK_INVENTORY_EXHAUSTED
    http_status: 409
    applies_to: "POST /api/perk-grants/{perk_grant_id}/transition (action=FULFILL)"
  - priority: 22
    category: business_constraint
    check: "Disclosure must be recorded before sponsor verification"
    error_id: ERR_DISCLOSURE_REQUIRED
    http_status: 409
    applies_to: "POST /api/deliverables/{deliverable_id}/transition (action=VERIFY)"
  - priority: 23
    category: business_referential
    check: "Cross-references consistent: viewer/tier belong to the path channel; stream belongs to deal's channel; viewer not BANNED for new/recovered subscriptions"
    error_id: ERR_VIEWER_BANNED
    http_status: 409
    applies_to: "subscription create/recover (ERR_VIEWER_BANNED); other FK mismatches -> ERR_NOT_FOUND"
  - priority: 24
    category: business_fiscal
    check: "Tax gate: current TaxForm must be VERIFIED to open or retry a payout"
    error_id: ERR_TAX_FORM_NOT_VERIFIED
    http_status: 402
    applies_to: "POST /api/channels/{channel_id}/payouts; Payout RETRY"
  - priority: 25
    category: business_fiscal
    check: "Non-empty sweep: at least one eligible CLEARED revenue event exists (a zero-balance channel fails here, before the threshold check)"
    error_id: ERR_NO_ELIGIBLE_REVENUE
    http_status: 422
    applies_to: "POST /api/channels/{channel_id}/payouts"
  - priority: 26
    category: business_fiscal
    check: "Threshold gate: balance_payable_cents >= payout_threshold_cents (inclusive)"
    error_id: ERR_BELOW_PAYOUT_THRESHOLD
    http_status: 422
    applies_to: "POST /api/channels/{channel_id}/payouts"

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Channel ---
  - method: POST
    path: /api/channels
    description: "Onboard a new creator channel (platform-side)"
    roles: [PlatformAdmin]
    code: 201
    input: [handle, display_name, home_platform, "payout_schedule?", "payout_threshold_cents?"]
    output: Channel
    side_effects: ["posture initialized RESTRICTED (no verified tax form)", "balances 0", "version=1"]
  - method: GET
    path: /api/channels/{channel_id}
    description: "Read a channel including computed posture/balances/scores"
    roles: [PlatformAdmin, Creator, Moderator, Sponsor, TrustAgent, AppealsOfficer]
    code: 200
    input: []
    output: Channel
    side_effects: []
  - method: PATCH
    path: /api/channels/{channel_id}/payout-settings
    description: "Update payout schedule and threshold. OCC-guarded."
    roles: [Creator]
    code: 200
    input: ["payout_schedule?", "payout_threshold_cents?", expected_channel_version]
    output: Channel
    side_effects: ["increments Channel.version by 1", "ERR_STALE_VERSION on version mismatch"]
  # --- TaxForm ---
  - method: POST
    path: /api/channels/{channel_id}/tax-forms
    description: "Submit a tax form; supersedes the channel's current form. OCC-guarded."
    roles: [Creator]
    code: 201
    input: [form_type, legal_name, tax_id_last4, expected_channel_version]
    output: TaxForm
    side_effects: ["new form SUBMITTED and current", "prior_form_id chains to previous current form", "increments Channel.version by 1", "posture recomputed"]
  - method: GET
    path: /api/tax-forms/{tax_form_id}
    description: "Read a tax form"
    roles: [PlatformAdmin, Creator, TrustAgent]
    code: 200
    input: []
    output: TaxForm
    side_effects: []
  - method: GET
    path: /api/tax-forms
    description: "List tax forms with filters (channel_id for the owning channel, prior_form_id for the supersession successor)"
    roles: [PlatformAdmin, Creator, TrustAgent]
    code: 200
    input: ["channel_id?", "tax_status?", "prior_form_id?"]
    output: TaxForm[]
    side_effects: []
  - method: POST
    path: /api/tax-forms/{tax_form_id}/transition
    description: "Verify or reject a submitted form"
    roles: [TrustAgent]
    code: 200
    input: [action, "rejection_reason?"]
    output: TaxForm
    side_effects: ["VERIFY: posture recompute + HELD(TAX_FORM) payouts release when posture not SUSPENDED", "REJECT: rejection_reason recorded"]
  # --- RevenueEvent ---
  - method: POST
    path: /api/channels/{channel_id}/revenue-events
    description: "Ingest a revenue event (platform billing/ads ingestion). CHARGEBACK requires reverses_event_id."
    roles: [PlatformAdmin]
    code: 201
    input: [kind, gross_cents, platform_fee_bps, occurred_at, "reverses_event_id?"]
    output: RevenueEvent
    side_effects: ["provisional net computed", "PENDING kinds add net to balance_pending_cents; CHARGEBACK ingests CLEARED and subtracts from balance_payable_cents"]
  - method: GET
    path: /api/revenue-events/{revenue_event_id}
    description: "Read a revenue event"
    roles: [PlatformAdmin, Creator]
    code: 200
    input: []
    output: RevenueEvent
    side_effects: []
  - method: GET
    path: /api/revenue-events
    description: "List revenue events with filters (reverses_event_id finds the chargeback of an event)"
    roles: [PlatformAdmin, Creator]
    code: 200
    input: ["channel_id?", "kind?", "recognition_status?", "settlement_month?", "reverses_event_id?"]
    output: RevenueEvent[]
    side_effects: []
  - method: POST
    path: /api/revenue-events/{revenue_event_id}/reverse
    description: "Reverse a CLEARED non-CHARGEBACK event (chargeback)"
    roles: [PlatformAdmin]
    code: 201
    input: [reason]
    output: RevenueEvent
    side_effects: ["original CLEARED -> REVERSED", "CHARGEBACK event created (gross=-original gross, CLEARED)", "balance_payable_cents -= original net"]
  # --- Payout ---
  - method: POST
    path: /api/channels/{id}/payouts
    description: "Open a payout sweeping the eligible payable balance"
    roles: [Creator]
    code: 201
    input: []
    output: Payout
    side_effects: ["payout created SCHEDULED with amount/fee/net computed per payout_settlement", "balance_payable_cents -= amount_cents", "gates: posture/tax/threshold/non-empty/in-flight"]
  - method: GET
    path: /api/channels/{id}/payouts
    description: "List payouts of a channel"
    roles: [PlatformAdmin, Creator]
    code: 200
    input: ["payout_status?"]
    output: Payout[]
    side_effects: []
  - method: POST
    path: /api/payouts/{payout_id}/transition
    description: "Drive payout lifecycle. Actions: PROCESS, SETTLE_SUCCESS, SETTLE_FAILURE (PlatformAdmin); RETRY, CANCEL (Creator owner)"
    roles: [PlatformAdmin, Creator]
    code: 200
    input: [action, "failure_reason?"]
    output: Payout
    side_effects: ["PAID: lifetime_paid += net_transfer", "CANCEL: payable += amount", "RETRY: retry_count+=1 with gate revalidation"]
  # --- SubscriptionTier ---
  - method: POST
    path: /api/channels/{id}/tiers
    description: "Create a subscription tier"
    roles: [Creator]
    code: 201
    input: [tier_code, monthly_price_cents, revenue_share_bps, perk_inventory_total]
    output: SubscriptionTier
    side_effects: ["tier_status=ACTIVE", "perk_inventory_remaining=perk_inventory_total"]
  - method: GET
    path: /api/tiers/{tier_id}
    description: "Read a tier"
    roles: [PlatformAdmin, Creator, Moderator, Sponsor, TrustAgent, AppealsOfficer]
    code: 200
    input: []
    output: SubscriptionTier
    side_effects: []
  - method: GET
    path: /api/channels/{id}/tiers
    description: "List tiers of a channel"
    roles: [PlatformAdmin, Creator, Moderator, Sponsor, TrustAgent, AppealsOfficer]
    code: 200
    input: ["tier_status?"]
    output: SubscriptionTier[]
    side_effects: []
  - method: POST
    path: /api/tiers/{tier_id}/transition
    description: "Retire or reactivate a tier"
    roles: [Creator]
    code: 200
    input: [action]
    output: SubscriptionTier
    side_effects: ["RETIRE blocks new subscriptions; REACTIVATE enforces unique ACTIVE tier_code"]
  # --- Viewer ---
  - method: POST
    path: /api/channels/{id}/viewers
    description: "Register a viewer identity under a channel"
    roles: [PlatformAdmin]
    code: 201
    input: [handle]
    output: Viewer
    side_effects: ["standing=GOOD_STANDING", "lifetime_spend_cents=0"]
  - method: GET
    path: /api/viewers/{viewer_id}
    description: "Read a viewer"
    roles: [PlatformAdmin, Creator, Moderator, AppealsOfficer]
    code: 200
    input: []
    output: Viewer
    side_effects: []
  - method: GET
    path: /api/channels/{id}/viewers
    description: "List viewers of a channel"
    roles: [PlatformAdmin, Creator, Moderator, AppealsOfficer]
    code: 200
    input: ["standing?"]
    output: Viewer[]
    side_effects: []
  # --- Subscription ---
  - method: POST
    path: /api/channels/{channel_id}/subscriptions
    description: "Start a subscription (platform billing); creates cycle-1 revenue event and MERCH perk grant"
    roles: [PlatformAdmin]
    code: 201
    input: [viewer_id, tier_id]
    output: Subscription
    side_effects: ["RevenueEvent SUBSCRIPTION created (PENDING)", "PerkGrant MERCH created (PENDING, due +14d)", "cycles_paid=1", "current_period_end=clock+1 month", "viewer.lifetime_spend += price"]
  - method: GET
    path: /api/subscriptions/{subscription_id}
    description: "Read a subscription"
    roles: [PlatformAdmin, Creator]
    code: 200
    input: []
    output: Subscription
    side_effects: []
  - method: GET
    path: /api/subscriptions
    description: "List subscriptions with filters"
    roles: [PlatformAdmin, Creator]
    code: 200
    input: ["channel_id?", "viewer_id?", "tier_id?", "sub_status?"]
    output: Subscription[]
    side_effects: []
  - method: POST
    path: /api/subscriptions/{subscription_id}/transition
    description: "Billing lifecycle: MARK_PAST_DUE, RECOVER (PlatformAdmin); CANCEL (Creator owner)"
    roles: [PlatformAdmin, Creator]
    code: 200
    input: [action]
    output: Subscription
    side_effects: ["CANCEL: PENDING/FAILED perk grants -> VOIDED"]
  # --- PerkGrant ---
  - method: GET
    path: /api/subscriptions/{id}/perk-grants
    description: "List perk grants of a subscription"
    roles: [PlatformAdmin, Creator]
    code: 200
    input: ["perk_status?"]
    output: PerkGrant[]
    side_effects: []
  - method: POST
    path: /api/perk-grants/{perk_grant_id}/transition
    description: "Fulfillment lifecycle: FULFILL, FAIL, RETRY, VOID"
    roles: [Creator]
    code: 200
    input: [action]
    output: PerkGrant
    side_effects: ["FULFILL: inventory -1", "VOID from FULFILLED: inventory +1"]
  # --- Moderator ---
  - method: POST
    path: /api/channels/{id}/moderators
    description: "Invite a moderator"
    roles: [Creator]
    code: 201
    input: [moderator_handle, scopes]
    output: Moderator
    side_effects: ["moderator_status=INVITED"]
  - method: GET
    path: /api/moderators/{moderator_id}
    description: "Read a moderator"
    roles: [PlatformAdmin, Creator, Moderator]
    code: 200
    input: []
    output: Moderator
    side_effects: []
  - method: GET
    path: /api/channels/{id}/moderators
    description: "List moderators of a channel"
    roles: [PlatformAdmin, Creator, Moderator]
    code: 200
    input: ["moderator_status?"]
    output: Moderator[]
    side_effects: []
  - method: POST
    path: /api/moderators/{moderator_id}/transition
    description: "Moderator lifecycle: ACCEPT (Moderator self), SUSPEND, REINSTATE, REMOVE (Creator owner)"
    roles: [Creator, Moderator]
    code: 200
    input: [action]
    output: Moderator
    side_effects: []
  # --- ModerationAction ---
  - method: POST
    path: /api/channels/{channel_id}/moderation-actions
    description: "Issue a TIMEOUT or BAN against a viewer"
    roles: [Creator, Moderator]
    code: 201
    input: [viewer_id, action_kind, "duration_minutes?", reason]
    output: ModerationAction
    side_effects: ["viewer standing recomputed", "BAN cascades subscriptions->CANCELLED and perks->VOIDED", "moderator actions_issued_count+=1"]
  - method: GET
    path: /api/moderation-actions/{moderation_action_id}
    description: "Read a moderation action"
    roles: [PlatformAdmin, Creator, Moderator, AppealsOfficer]
    code: 200
    input: []
    output: ModerationAction
    side_effects: []
  - method: GET
    path: /api/moderation-actions
    description: "List moderation actions with filters"
    roles: [PlatformAdmin, Creator, Moderator, AppealsOfficer]
    code: 200
    input: ["channel_id?", "viewer_id?", "moderator_id?", "action_status?"]
    output: ModerationAction[]
    side_effects: []
  - method: POST
    path: /api/moderation-actions/{moderation_action_id}/reverse
    description: "Reverse an active moderation action"
    roles: [Creator, AppealsOfficer]
    code: 200
    input: [reason]
    output: ModerationAction
    side_effects: ["action -> REVERSED", "viewer standing recomputed", "moderator actions_issued_count-=1"]
  # --- ContentStrike ---
  - method: POST
    path: /api/channels/{id}/strikes
    description: "Issue a content strike"
    roles: [TrustAgent]
    code: 201
    input: [policy_code, severity, evidence_ref]
    output: ContentStrike
    side_effects: ["issued_at/expires_at/appeal_deadline stamped", "issued_by_user_id recorded", "posture recomputed with payout-hold cascade"]
  - method: GET
    path: /api/channels/{id}/strikes
    description: "List strikes of a channel"
    roles: [PlatformAdmin, Creator, TrustAgent, AppealsOfficer]
    code: 200
    input: ["strike_status?"]
    output: ContentStrike[]
    side_effects: []
  - method: POST
    path: /api/strikes/{strike_id}/appeal
    description: "Appeal a strike (round 1 from ISSUED, round 2 from UPHELD)"
    roles: [Creator]
    code: 200
    input: [statement]
    output: ContentStrike
    side_effects: ["appeal_round+=1"]
  - method: POST
    path: /api/strikes/{strike_id}/resolve-appeal
    description: "Resolve an appealed strike (segregated from issuer)"
    roles: [AppealsOfficer]
    code: 200
    input: [outcome, resolution_note]
    output: ContentStrike
    side_effects: ["REVERSED: weight removed + posture recompute + POSTURE-hold payouts release when posture STANDARD"]
  # --- SponsorshipDeal ---
  - method: POST
    path: /api/channels/{id}/deals
    description: "Draft a sponsorship deal"
    roles: [Creator]
    code: 201
    input: [sponsor_ref, title, category, total_value_cents, flight_start, flight_end, required_deliverable_count]
    output: SponsorshipDeal
    side_effects: ["deal_status=DRAFT", "miss_count=0", "disclosure_compliant=true"]
  - method: GET
    path: /api/deals/{deal_id}
    description: "Read a deal"
    roles: [PlatformAdmin, Creator, Sponsor]
    code: 200
    input: []
    output: SponsorshipDeal
    side_effects: []
  - method: GET
    path: /api/channels/{id}/deals
    description: "List deals of a channel"
    roles: [PlatformAdmin, Creator, Sponsor]
    code: 200
    input: ["deal_status?", "category?"]
    output: SponsorshipDeal[]
    side_effects: []
  - method: POST
    path: /api/deals/{deal_id}/transition
    description: "Deal lifecycle: PROPOSE, ACTIVATE, CANCEL (Creator owner); ACCEPT (Sponsor matching sponsor_ref)"
    roles: [Creator, Sponsor]
    code: 200
    input: [action]
    output: SponsorshipDeal
    side_effects: ["ACTIVATE: SPONSORSHIP revenue event created (PENDING)"]
  # --- Deliverable ---
  - method: POST
    path: /api/deals/{deal_id}/deliverables
    description: "Add a deliverable to an ACTIVE deal"
    roles: [Creator]
    code: 201
    input: [kind, due_at, "stream_id?"]
    output: Deliverable
    side_effects: ["performance_status=SCHEDULED", "disclosure_status=PENDING"]
  - method: GET
    path: /api/deliverables/{deliverable_id}
    description: "Read a deliverable"
    roles: [PlatformAdmin, Creator, Sponsor]
    code: 200
    input: []
    output: Deliverable
    side_effects: []
  - method: GET
    path: /api/deliverables
    description: "List deliverables with filters"
    roles: [PlatformAdmin, Creator, Sponsor]
    code: 200
    input: ["deal_id?", "stream_id?", "performance_status?", "disclosure_status?"]
    output: Deliverable[]
    side_effects: []
  - method: POST
    path: /api/deliverables/{deliverable_id}/transition
    description: "Deliverable lifecycle: PERFORM, DISCLOSE (Creator owner); VERIFY, DISPUTE (Sponsor matching sponsor_ref)"
    roles: [Creator, Sponsor]
    code: 200
    input: [action, "stream_id?"]
    output: Deliverable
    side_effects: ["PERFORM: performed_at + disclosure_deadline stamped", "VERIFY: deal verified count recomputed"]
  - method: POST
    path: /api/deliverables/{deliverable_id}/reschedule
    description: "Reschedule a MISSED or DISPUTED deliverable. OCC-guarded."
    roles: [Creator]
    code: 200
    input: [due_at, expected_deliverable_version]
    output: Deliverable
    side_effects: ["back to SCHEDULED, disclosure reset PENDING", "increments Deliverable.version by 1", "miss_count NOT decremented"]
  # --- StreamSession ---
  - method: POST
    path: /api/channels/{id}/streams
    description: "Schedule a stream (half-open window, adjacency allowed)"
    roles: [Creator]
    code: 201
    input: [title, scheduled_start, scheduled_end, "simulcast?"]
    output: StreamSession
    side_effects: ["stream_status=SCHEDULED"]
  - method: GET
    path: /api/streams/{stream_id}
    description: "Read a stream"
    roles: [PlatformAdmin, Creator, Sponsor, Moderator]
    code: 200
    input: []
    output: StreamSession
    side_effects: []
  - method: GET
    path: /api/channels/{id}/streams
    description: "List streams of a channel"
    roles: [PlatformAdmin, Creator, Sponsor, Moderator]
    code: 200
    input: ["stream_status?"]
    output: StreamSession[]
    side_effects: []
  - method: POST
    path: /api/streams/{stream_id}/transition
    description: "Stream lifecycle: START, END (peak_viewers, avg_viewers required), CANCEL"
    roles: [Creator]
    code: 200
    input: [action, "peak_viewers?", "avg_viewers?"]
    output: StreamSession
    side_effects: ["START: actual_start + punctuality", "END: actual_end + consistency recompute"]
  # --- SimulcastGrant ---
  - method: POST
    path: /api/channels/{id}/simulcast-grants
    description: "Request simulcast rights for a platform window"
    roles: [Creator]
    code: 201
    input: [platform, window_start, window_end, "exclusive?"]
    output: SimulcastGrant
    side_effects: ["grant_status=REQUESTED"]
  - method: GET
    path: /api/channels/{id}/simulcast-grants
    description: "List simulcast grants of a channel"
    roles: [PlatformAdmin, Creator]
    code: 200
    input: ["grant_status?", "platform?"]
    output: SimulcastGrant[]
    side_effects: []
  - method: POST
    path: /api/simulcast-grants/{simulcast_grant_id}/transition
    description: "Grant lifecycle: APPROVE (buffer rule), DENY, REVOKE"
    roles: [PlatformAdmin]
    code: 200
    input: [action]
    output: SimulcastGrant
    side_effects: []
  # --- Ops & clock ---
  - method: POST
    path: /api/ops/run
    description: "Advance the ops checkpoint. Pinned step order: (1) settle prior-month PENDING revenue events to CLEARED with final net; (2) expire ISSUED/UPHELD strikes past expires_at (UNDER_APPEAL exempt) + posture recompute; (3) expire VERIFIED tax forms past expires_on + posture/payout-hold cascade; (4) expire APPROVED simulcast grants past window_end; (5) mark SCHEDULED streams past 30-min grace as NO_SHOW; (6) mark SCHEDULED deliverables past due_at as MISSED with miss_count/BREACH cascade; (7) expire PENDING/FAILED perk grants past due_at; (8) renew ACTIVE subscriptions past period end (revenue event + perk grant) and EXPIRE PAST_DUE subscriptions past 7-day grace; (9) complete qualifying ACTIVE deals; (10) expire ACTIVE TIMEOUT moderation actions past expires_at. Server startup default clock is 2026-08-01T00:00:00Z (see /api/_clock/set_current_utc); ops_run_index starts at 0."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: "{ ops_run_index: integer, events_cleared: integer, strikes_expired: integer, tax_forms_expired: integer, grants_expired: integer, streams_no_show: integer, deliverables_missed: integer, perks_expired: integer, subscriptions_renewed: integer, subscriptions_expired: integer, deals_completed: integer, payouts_released: integer }"
    side_effects: ["ops_run_index += 1", "all step cascades per §1.2"]
  - method: POST
    path: /api/_clock/set_current_utc
    description: "Set the logical clock (test-driving endpoint). Server startup default is exactly 2026-08-01T00:00:00Z; the clock never falls back to wall time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["logical clock replaced; all date arithmetic derives from it"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or empty X-User-Role / X-User-ID headers" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing required field, invalid enum, out-of-range value (incl. duplicate channel handle, BAN with duration, TIMEOUT duration outside 1..10080)" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted on endpoint, or role not permitted for the requested transition action" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or body-referenced id does not exist (or FK belongs to a different parent than the path implies)" }
  - { id: ERR_CHANNEL_OWNERSHIP_MISMATCH, http: 403, condition: "Creator X-User-ID does not equal the owning channel id, or Moderator ACCEPT issued for a different moderator id" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity not in a state admitting the requested transition (wrong-from, terminal lockdown, repeat trigger, stream start past grace, deal activate outside flight)" }
  - { id: ERR_CHANNEL_SUSPENDED, http: 409, condition: "Channel monetization_posture == SUSPENDED blocks payout open/retry, deal ACTIVATE, deliverable PERFORM, simulcast APPROVE" }
  - { id: ERR_SELF_REVIEW_FORBIDDEN, http: 403, condition: "AppealsOfficer X-User-ID equals the strike's issued_by_user_id (segregation of duties)" }
  - { id: ERR_PROGRESSIVE_DISCIPLINE, http: 409, condition: "BAN issued with fewer than 2 prior non-reversed TIMEOUTs on the same (channel, viewer)" }
  - { id: ERR_APPEAL_WINDOW_CLOSED, http: 409, condition: "current_utc > strike appeal_deadline" }
  - { id: ERR_APPEAL_LIMIT_REACHED, http: 409, condition: "appeal_round already at cap 2" }
  - { id: ERR_STREAM_WINDOW_CONFLICT, http: 409, condition: "Half-open overlap with another non-terminal stream of the channel (adjacency allowed)" }
  - { id: ERR_SIMULCAST_BUFFER_CONFLICT, http: 409, condition: "APPROVE would leave < 24h gap versus another APPROVED grant on same channel+platform" }
  - { id: ERR_SIMULCAST_GRANT_MISSING, http: 409, condition: "START with simulcast=true but no APPROVED grant fully covers the scheduled window" }
  - { id: ERR_CATEGORY_EXCLUSIVITY_CONFLICT, http: 409, condition: "ACTIVATE collides on closed-interval flight intersection with an ACCEPTED/ACTIVE deal of the same category" }
  - { id: ERR_DELIVERABLE_OVERDUE, http: 409, condition: "PERFORM attempted with current_utc > due_at" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC)" }
  - { id: ERR_TIER_CODE_IN_USE, http: 409, condition: "Another ACTIVE tier with the same tier_code exists on the channel" }
  - { id: ERR_SPONSOR_MISMATCH, http: 403, condition: "Sponsor X-User-ID != deal.sponsor_ref" }
  - { id: ERR_MODERATOR_NOT_ACTIVE, http: 409, condition: "Issuing moderator is INVITED/SUSPENDED/REMOVED" }
  - { id: ERR_MODERATOR_SCOPE_MISSING, http: 403, condition: "Moderator lacks the scope matching action_kind (e.g. BAN without BAN scope)" }
  - { id: ERR_PERK_INVENTORY_EXHAUSTED, http: 409, condition: "FULFILL with tier perk_inventory_remaining == 0" }
  - { id: ERR_DISCLOSURE_REQUIRED, http: 409, condition: "VERIFY while disclosure_status is PENDING or MISSING" }
  - { id: ERR_VIEWER_BANNED, http: 409, condition: "Subscription create/recover for a viewer whose standing is BANNED" }
  - { id: ERR_TAX_FORM_NOT_VERIFIED, http: 402, condition: "Payout open/retry while the channel's current tax form is missing or not VERIFIED" }
  - { id: ERR_BELOW_PAYOUT_THRESHOLD, http: 422, condition: "balance_payable_cents < payout_threshold_cents (strictly below; exactly-at-threshold is eligible)" }
  - { id: ERR_NO_ELIGIBLE_REVENUE, http: 422, condition: "Payout open with zero eligible CLEARED revenue events" }
  - { id: ERR_RETRY_LIMIT_REACHED, http: 409, condition: "Payout RETRY attempted when retry_count is already 3 (state-level cap, fires before fiscal gates)" }
  - { id: ERR_PAYOUT_IN_FLIGHT, http: 409, condition: "Payout open while another payout of the channel is SCHEDULED/PROCESSING/FAILED/HELD" }
  - { id: ERR_CHARGEABILITY_VIOLATION, http: 409, condition: "reverse on a non-CLEARED event, on a CHARGEBACK, or when a chargeback already exists for the event" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Platform operations: channel onboarding, revenue ingestion, chargebacks, payout processing, simulcast approval, ops runs, clock"
    identity: opaque
    exclusive_operations:
      - "POST /api/channels"
      - "POST /api/channels/{id}/revenue-events; POST /api/revenue-events/{id}/reverse"
      - "POST /api/channels/{id}/viewers; POST /api/channels/{id}/subscriptions"
      - "POST /api/payouts/{id}/transition actions PROCESS/SETTLE_SUCCESS/SETTLE_FAILURE"
      - "POST /api/simulcast-grants/{id}/transition"
      - "POST /api/ops/run; POST /api/_clock/set_current_utc"
    shared_operations: ["All GET endpoints"]
  - name: Creator
    description: "The channel owner managing tiers, moderators, deals, deliverables, streams, appeals, and payout requests"
    identity: "entity_backed:Channel"
    exclusive_operations:
      - "PATCH /api/channels/{id}/payout-settings; POST /api/channels/{id}/tax-forms"
      - "POST /api/channels/{id}/payouts; payout RETRY/CANCEL"
      - "POST /api/channels/{id}/tiers; tier transitions"
      - "POST /api/channels/{id}/moderators; moderator SUSPEND/REINSTATE/REMOVE"
      - "POST /api/channels/{id}/deals; deal PROPOSE/ACTIVATE/CANCEL; deliverable create/PERFORM/DISCLOSE/reschedule"
      - "POST /api/channels/{id}/streams; stream START/END/CANCEL"
      - "POST /api/channels/{id}/simulcast-grants"
      - "POST /api/strikes/{id}/appeal"
      - "POST /api/perk-grants/{id}/transition"
      - "subscription CANCEL"
    shared_operations: ["All GET endpoints", "POST /api/channels/{id}/moderation-actions", "POST /api/moderation-actions/{id}/reverse"]
  - name: Moderator
    description: "Channel moderation staff issuing enforcement actions within granted scopes"
    identity: "entity_backed:Moderator"
    exclusive_operations:
      - "POST /api/moderators/{id}/transition action=ACCEPT (self only)"
    shared_operations: ["GET viewers/moderators/moderation-actions/streams", "POST /api/channels/{id}/moderation-actions"]
  - name: Sponsor
    description: "Brand counterparty accepting deals and verifying/disputing deliverables"
    identity: opaque
    exclusive_operations:
      - "POST /api/deals/{id}/transition action=ACCEPT (sponsor_ref match)"
      - "POST /api/deliverables/{id}/transition actions VERIFY/DISPUTE (sponsor_ref match)"
    shared_operations: ["GET deals/deliverables/streams/channels"]
  - name: TrustAgent
    description: "Trust & safety issuer: files content strikes and adjudicates tax forms; NEVER resolves appeals (segregation of duties)"
    identity: opaque
    exclusive_operations:
      - "POST /api/channels/{id}/strikes"
      - "POST /api/tax-forms/{id}/transition"
    shared_operations: ["GET channels/tax-forms/strikes"]
  - name: AppealsOfficer
    description: "Independent reviewer resolving strike appeals and reversing moderation actions; forbidden from resolving strikes they issued (SoD via issued_by_user_id)"
    identity: opaque
    exclusive_operations:
      - "POST /api/strikes/{id}/resolve-appeal"
    shared_operations: ["GET channels/strikes/moderation-actions/viewers", "POST /api/moderation-actions/{id}/reverse"]
