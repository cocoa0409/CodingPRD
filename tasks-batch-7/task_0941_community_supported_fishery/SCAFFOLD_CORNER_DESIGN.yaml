      - name: vessel_compliance_cycle_restores_the_ledger_to_open
        claim_type: Cross-entity
        grounds: ["state_machines.Vessel.SUSPENDED_to_COMPLIANT", "state_machines.QuotaLedger.SUSPENDED_to_OPEN", "entities.Vessel.fields.violation_count"]
        distinguishing_aspect: "COMPLIANT -> PROBATION -> SUSPENDED -> COMPLIANT is a closed cycle on the vessel axis, and the return leg puts every SUSPENDED ledger of that vessel back to OPEN because its consumption ratio 0.00 is below QUOTA_WARNING_PCT; violation_count stays at 2 and is never decremented."
        test_recipe:
          setup: ["a vessel with one 500.00 lb SALMON entitlement, already walked to SUSPENDED"]
          setup_api_calls:
            - call: "POST /csf/seasons"
              payload: { season_code: "CSF-2026", start_date: "2026-05-04T00:00:00Z", end_date: "2026-09-21T00:00:00Z", total_weeks: 20, ambient_band: "HOT", offered_species: ["SALMON"], landing_commit_lead_hours: 72 }
              as: CsfAdmin
              captures: { season_id: $.data.id }
            - call: "POST /csf/vessels"
              payload: { vessel_name: "Northeaster", permit_number: "P-100", home_port: "Portland", gear_types: ["HOOK_AND_LINE"] }
              as: CsfAdmin
              captures: { vessel_id: $.data.id }
            - call: "POST /csf/quota-ledgers"
              payload: { vessel_id: "${vessel_id}", season_id: "${season_id}", species: "SALMON", management_area: "GOM-1", entitlement_pounds: 500.00, species_open_date: "2026-05-01T00:00:00Z", species_close_date: "2026-09-30T00:00:00Z", permitted_gears: ["HOOK_AND_LINE"] }
              as: CsfAdmin
              captures: { ledger_id: $.data.id }
            - call: "POST /csf/vessels/${vessel_id}/compliance"
              payload: { target_status: "PROBATION" }
              as: CsfAdmin
            - call: "POST /csf/vessels/${vessel_id}/compliance"
              payload: { target_status: "SUSPENDED" }
              as: CsfAdmin
          trigger:
            - call: "POST /csf/vessels/${vessel_id}/compliance"
              payload: { target_status: "COMPLIANT" }
              as: CsfAdmin
          assert:
            - "Vessel.${vessel_id}.compliance_status == COMPLIANT"
            - "Vessel.${vessel_id}.violation_count == 2"
            - "QuotaLedger.${ledger_id}.status == OPEN"
            - "QuotaLedger.${ledger_id}.remaining_pounds == 500.00"

