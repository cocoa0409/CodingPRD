      - name: the_line_state_check_runs_before_the_title_document_check
        claim_type: cascading_validation
        grounds:
          - validations[priority=61]
          - validations[priority=80]
          - errors.ERR_CREDIT_LINE_NOT_ACTIVE
          - errors.ERR_MSO_REQUIRED_FOR_NEW_UNIT
        distinguishing_aspect: "A NEW unit is registered against a PENDING line while also presenting a TITLE instead of an MSO, so both the priority-61 state check and the priority-80 document check are violated; the state error is returned and the document error only becomes observable once the line is ACTIVE."
        test_recipe:
