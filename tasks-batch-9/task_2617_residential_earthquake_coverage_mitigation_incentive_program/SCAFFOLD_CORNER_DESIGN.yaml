          - validations.priority_3
        distinguishing_aspect: "An absent or undeclared X-Role is a 401 ERR_MISSING_ROLE that fires ahead of body validation, and on the five segregation-of-duties endpoints an absent X-User-ID is a 401 ERR_MISSING_USER_ID that fires ahead of the existence check even though the role itself is correct."
        test_recipe:
          setup:
