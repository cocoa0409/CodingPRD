      - name: subcontractor_default_cascade_down_to_held_cost_reports
        claim_type: cascade_down
        excluded_because:
          difficulty_instance: subcontractor_default_five_level_cascade_to_held_cost_reports
          rationale: |
            The §1.8 instance already drives the full downward cascade from a single
            TERMINATE_FOR_DEFAULT through the package, the minted premium draw, the project's
            contingency posture and finally every OPEN CostReport moving to
            RECONCILIATION_HELD with held_reason CONSTRUCTION_CONTINGENCY_CONSTRAINED. A
            separate corner test would re-drive the same five levels with weaker assertions.

      - name: scope_change_classification_mutates_sibling_estimates_cross_entity
        claim_type: cross_entity
        excluded_because:
          difficulty_instance: scope_change_classification_three_level_cascade_stales_reconciled_estimates
          rationale: |
            Classifying a change event as SCOPE_CHANGE is the canonical cross-entity side
            effect: it mints an AMENDMENT GmpProposal, re-runs the proposed-price roll-up on
            the project and flips reconciliation_stale on every RECONCILED ProgressiveEstimate.
            The §1.8 instance asserts all three writes from one call.

      - name: classification_fork_selects_which_side_effect_set_runs
        claim_type: conditional_cascade
        excluded_because:
          difficulty_instance: change_event_three_way_classification_fork_with_divergent_side_effect_sets
          rationale: |
            The conditional cascade is exactly the three-way classify fork: SCOPE_CHANGE mints a
            proposal and moves the proposed price, CONTINGENCY_USE_OWNER mints an always-approval-
            gated OWNER draw, CONTINGENCY_USE_CONSTRUCTION mints a CONSTRUCTION draw whose
            approval flag is derived. The §1.8 instance runs all three branches on sibling
            events created from identical payloads.

      - name: draw_void_compensates_the_posted_contingency_movement
        claim_type: compensation
        excluded_because:
          difficulty_instance: contingency_draw_post_then_void_restores_the_seven_term_gmp_identity
          rationale: |
            Void is the compensating transition on the contingency ledger, and the §1.8 instance
            already asserts that post-then-void restores every term of the price-conservation
            identity - the pot remainder, contingency_drawn_to_cost_total and the untouched
            gmp_amount - rather than merely flipping the draw's status.

  # ===================================================================
  - section: calculations
    instances:
      - name: allowance_reconcile_books_actual_cost_and_reports_the_rate_variance
        claim_type: correct_result
        grounds:
          - calculations.allowance_unit_conservation
          - endpoints.POST_/qualification-items/{id}/allowance-reconciliation
        distinguishing_aspect: |
          One RECONCILE action writes six figures, and the booked amount (units times ACTUAL
          unit cost) must be kept separate from the expected amount (units times the ALLOWANCE
          unit rate); variance_amount is the difference of the two rounded products. The unit
          ledger identity allocated == remaining + reconciled must hold after the action.
        test_recipe:
          setup:
            - "empty database"
            - "logical clock at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "Harborview Clinic", owner_org: "Harborview Health", cm_fee_pct: 0.04, insurance_rate: 0.01 }
              as: ProgramAdmin
              captures: { proj: $.data.id, pv1: $.data.version }
