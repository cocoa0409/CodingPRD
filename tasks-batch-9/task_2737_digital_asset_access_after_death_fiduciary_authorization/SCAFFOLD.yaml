      - "POST /estates/{estate_id}/digital-assets"
      - "POST /estates/{estate_id}/documents"
      - "POST /estates/{estate_id}/fiduciaries"
      - "POST /estates/{estate_id}/grant-expiry-sweeps"
      - "POST /estates/{estate_id}/platform-requests"
      - "POST /estates/{estate_id}/valuation-runs"
      - "POST /platform-requests/{request_id}/transitions"
      - "POST /refund-claims/{claim_id}/transitions"
      - "POST /valuation-runs/{run_id}/transitions"

  - id: ERR_INVALID_DOCUMENT_STATE
    http_status: 409
    validation_priority: [29]
    condition: "NOT (the Document is in a status from which the submitted action is defined)"
    applies_to:
      - "POST /documents/{document_id}/transitions"

  - id: ERR_INVALID_REQUEST_STATE
    http_status: 409
    validation_priority: [30]
    condition: "NOT (the PlatformRequest is in a status from which the submitted action is defined)"
    applies_to:
      - "POST /platform-requests/{request_id}/transitions"

  - id: ERR_INVALID_GRANT_STATE
    http_status: 409
    validation_priority: [31]
    condition: "NOT (the AuthorityGrant status is ACTIVE)"
    applies_to:
      - "POST /authority-grants/{grant_id}/transitions"

  - id: ERR_INVALID_ELECTION_STATE
    http_status: 409
    validation_priority: [32]
    condition: "NOT (the DispositionElection is in a status from which the submitted action is defined, and for REVERSE the asset's disposition_status is EXECUTED — a PURGED asset can never be reversed)"
    applies_to:
      - "POST /disposition-elections/{election_id}/transitions"

  - id: ERR_INVALID_ORDER_STATE
    http_status: 409
    validation_priority: [33]
    condition: "NOT (the CancellationOrder is in a status from which the submitted action is defined, and for refund-claim creation the order status is CONFIRMED)"
    applies_to:
      - "POST /cancellation-orders/{order_id}/refund-claims"
      - "POST /cancellation-orders/{order_id}/transitions"

  - id: ERR_INVALID_CLAIM_STATE
    http_status: 409
    validation_priority: [34]
    condition: "NOT (the RefundClaim is in a status from which the submitted action is defined)"
    applies_to:
      - "POST /refund-claims/{claim_id}/transitions"

  - id: ERR_INVALID_RUN_STATE
    http_status: 409
    validation_priority: [35]
    condition: "NOT (the ValuationRun status is COMPUTED)"
    applies_to:
      - "POST /valuation-runs/{run_id}/transitions"

  - id: ERR_VALUATION_ALREADY_FINALIZED
    http_status: 409
    validation_priority: [36]
    condition: "NOT (no ValuationRun of the estate already has status FINALIZED)"
    applies_to:
      - "POST /estates/{estate_id}/valuation-runs"
      - "POST /valuation-runs/{run_id}/transitions"

  - id: ERR_DOCUMENT_ESTATE_MISMATCH
    http_status: 409
    validation_priority: [37]
    condition: "NOT (every Document referenced by a PlatformRequest belongs to the same Estate as the request)"
    applies_to:
      - "POST /estates/{estate_id}/platform-requests"

  - id: ERR_DOCUMENT_TYPE_MISMATCH
    http_status: 400
    validation_priority: [38]
    condition: "NOT (death_certificate_document_id points at a Document with doc_type == DEATH_CERTIFICATE and letters_document_id at one with doc_type == LETTERS_OF_AUTHORITY)"
    applies_to:
      - "POST /estates/{estate_id}/platform-requests"

  - id: ERR_PLATFORM_FORM_MISMATCH
    http_status: 409
    validation_priority: [39]
    condition: "NOT (the submitted platform_form_code equals Platform.form_code)"
    applies_to:
      - "POST /estates/{estate_id}/platform-requests"
      - "POST /platform-requests/{request_id}/transitions"

  - id: ERR_DEATH_CERTIFICATE_NOT_VERIFIED
    http_status: 409
    validation_priority: [40]
    condition: "NOT (the referenced death certificate has verification_status == VERIFIED)"
    applies_to:
      - "POST /platform-requests/{request_id}/transitions"

  - id: ERR_LETTERS_NOT_ISSUED
    http_status: 409
    validation_priority: [41]
    condition: "NOT (the referenced letters document is VERIFIED and the Fiduciary it names has letters_status == ISSUED)"
    applies_to:
      - "POST /disposition-elections/{election_id}/transitions"
      - "POST /platform-requests/{request_id}/transitions"

  - id: ERR_PLATFORM_SUSPENDED
    http_status: 409
    validation_priority: [42]
    condition: "NOT (Platform.status != SUSPENDED)"
    applies_to:
      - "POST /disposition-elections/{election_id}/transitions"
      - "POST /platform-requests/{request_id}/transitions"

  - id: ERR_NO_ACTIVE_AUTHORITY
    http_status: 409
    validation_priority: [43]
    condition: "NOT (an AuthorityGrant with status == ACTIVE covers the asset's (estate_id, platform_id), and the asset's access_status IN {CATALOG_DISCLOSED, CONTENT_DISCLOSED})"
    applies_to:
      - "POST /cancellation-orders/{order_id}/transitions"
      - "POST /digital-assets/{asset_id}/disposition-elections"
      - "POST /disposition-elections/{election_id}/transitions"

  - id: ERR_CONTENT_DISCLOSURE_NOT_AUTHORIZED
    http_status: 409
    validation_priority: [44]
    condition: "NOT (for a CONTENT_ACCESS request, calculation platform_authority_precedence resolves to CATALOG_AND_CONTENT with clamp_reason NONE)"
    applies_to:
      - "POST /platform-requests/{request_id}/transitions"

  - id: ERR_COURT_ORDER_REQUIRED
    http_status: 409
    validation_priority: [45]
    condition: "NOT (when the resolving platform has requires_court_order_for_content, a VERIFIED COURT_ORDER Document exists on the estate)"
    applies_to:
      - "POST /platform-requests/{request_id}/transitions"

  - id: ERR_ONLINE_TOOL_UNSUPPORTED
    http_status: 409
    validation_priority: [46]
    condition: "NOT (when directive_type == ONLINE_TOOL, Platform.supports_online_tool is true and platform_id is not null)"
    applies_to:
      - "POST /estates/{estate_id}/authority-directives"

  - id: ERR_COUNTERSIGN_REQUIRED
    http_status: 409
    validation_priority: [47]
    condition: "NOT (for election == DELETE, countersigned_by_fiduciary_id is not null before SUBMIT)"
    applies_to:
      - "POST /disposition-elections/{election_id}/transitions"

  - id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    validation_priority: [48]
    condition: "NOT (the countersigning X-User-ID differs from DispositionElection.elected_by_fiduciary_id)"
    applies_to:
      - "POST /disposition-elections/{election_id}/transitions"

  - id: ERR_ASSET_NOT_TRANSFERABLE
    http_status: 409
    validation_priority: [49]
    condition: "NOT (for election == TRANSFER, DigitalAsset.transferability == TRANSFERABLE)"
    applies_to:
      - "POST /digital-assets/{asset_id}/disposition-elections"

  - id: ERR_DISPOSITION_UNSUPPORTED
    http_status: 409
    validation_priority: [50]
    condition: "NOT (the platform supports the elected disposition: supports_memorialization for MEMORIALIZE, supports_deletion for DELETE, supports_transfer for TRANSFER)"
    applies_to:
      - "POST /digital-assets/{asset_id}/disposition-elections"

  - id: ERR_BENEFICIARY_REQUIRED
    http_status: 400
    validation_priority: [51]
    condition: "NOT (beneficiary_designation_id is supplied for election == TRANSFER and omitted for MEMORIALIZE and DELETE)"
    applies_to:
      - "POST /digital-assets/{asset_id}/disposition-elections"

  - id: ERR_SUBSCRIPTION_TERM_MISSING
    http_status: 409
    validation_priority: [52]
    condition: "NOT (the asset has a SubscriptionTerm)"
    applies_to:
      - "POST /cancellation-orders/{order_id}/refund-claims"

  - id: ERR_SUBSCRIPTION_TERM_EXISTS
    http_status: 409
    validation_priority: [53]
    condition: "NOT (the asset has no SubscriptionTerm yet, and asset.category == SUBSCRIPTION)"
    applies_to:
      - "POST /digital-assets/{asset_id}/subscription-terms"

  - id: ERR_REFUND_NOT_OFFERED
    http_status: 409
    validation_priority: [54]
    condition: "NOT (CancellationOrder.refund_policy_snapshot != NONE)"
    applies_to:
      - "POST /cancellation-orders/{order_id}/refund-claims"

  - id: ERR_DATE_OF_DEATH_IN_FUTURE
    http_status: 400
    validation_priority: [55]
    condition: "NOT (date_of_death <= the logical clock's date)"
    applies_to:
      - "POST /estates"

  - id: ERR_EFFECTIVE_DATE_BEFORE_DEATH
    http_status: 400
    validation_priority: [56]
    condition: "NOT (effective_date >= Estate.date_of_death)"
    applies_to:
      - "POST /cancellation-orders/{order_id}/transitions"

  - id: ERR_ALTERNATE_DATE_NOT_REACHED
    http_status: 409
    validation_priority: [57]
    condition: "NOT (for basis == ALTERNATE, the logical clock's date >= Estate.alternate_valuation_date)"
    applies_to:
      - "POST /estates/{estate_id}/valuation-runs"

  - id: ERR_REQUEST_WINDOW_OVERLAP
    http_status: 409
    validation_priority: [58]
    condition: "NOT (the half-open review window [review_window_start, review_window_end) of the submission does not overlap the window of another PlatformRequest with the same (estate_id, platform_id, request_type) in status SUBMITTED, UNDER_REVIEW or INFO_REQUESTED)"
    applies_to:
      - "POST /platform-requests/{request_id}/transitions"

  - id: ERR_CLAIM_PERIOD_OUT_OF_TERM
    http_status: 400
    validation_priority: [59]
    condition: "NOT (claimed_period_start >= SubscriptionTerm.term_start_date and claimed_period_end <= SubscriptionTerm.term_end_date and claimed_period_start <= claimed_period_end)"
    applies_to:
      - "POST /cancellation-orders/{order_id}/refund-claims"

  - id: ERR_CLAIM_PERIOD_OVERLAP
    http_status: 409
    validation_priority: [60]
    condition: "NOT (the CLOSED claimed interval [claimed_period_start, claimed_period_end] does not overlap the interval of any other RefundClaim on the same SubscriptionTerm whose status is FILED, PLATFORM_REVIEW, ESCALATED or CREDITED)"
    applies_to:
      - "POST /cancellation-orders/{order_id}/refund-claims"

  - id: ERR_REFUND_WINDOW_TOO_SHORT
    http_status: 400
    validation_priority: [61]
    condition: "NOT (claimed_days >= REFUND_MIN_CLAIM_DAYS (7))"
    applies_to:
      - "POST /cancellation-orders/{order_id}/refund-claims"

  - id: ERR_CREDIT_EXCEEDS_CLAIM
    http_status: 400
    validation_priority: [62]
    condition: "NOT (credited_cents <= RefundClaim.claimed_cents)"
    applies_to:
      - "POST /refund-claims/{claim_id}/transitions"

  - id: ERR_SHARE_TOTAL_INVALID
    http_status: 400
    validation_priority: [63]
    condition: "NOT (the sum of share_bp over all BeneficiaryDesignation rows of the estate, including the one being created, is <= 10000; and it is exactly 10000 before a ValuationRun may be created)"
    applies_to:
      - "POST /estates/{estate_id}/beneficiary-designations"
      - "POST /estates/{estate_id}/valuation-runs"

  - id: ERR_VALUATION_REQUIRED
    http_status: 409
    validation_priority: [64]
    condition: "NOT (for election == TRANSFER at EXECUTE, a ValuationRun with status IN {COMPUTED, FINALIZED} exists on the estate and DigitalAsset.appraised_value_cents is not null)"
    applies_to:
      - "POST /disposition-elections/{election_id}/transitions"

  - id: ERR_DISTRIBUTION_POOL_EXHAUSTED
    http_status: 409
    validation_priority: [65]
    condition: "NOT (DigitalAsset.appraised_value_cents <= Estate.undistributed_value_cents)"
    applies_to:
      - "POST /disposition-elections/{election_id}/transitions"

  - id: ERR_BENEFICIARY_ALLOCATION_EXCEEDED
    http_status: 409
    validation_priority: [66]
    condition: "NOT (BeneficiaryDesignation.received_value_cents + DigitalAsset.appraised_value_cents <= BeneficiaryDesignation.planned_allocation_cents)"
    applies_to:
      - "POST /disposition-elections/{election_id}/transitions"

  - id: ERR_VALUATION_NOT_FINALIZED
    http_status: 409
    validation_priority: [67]
    condition: "NOT (the estate's newest non-SUPERSEDED ValuationRun has status == FINALIZED)"
    applies_to:
      - "POST /estates/{estate_id}/close"

  - id: ERR_ASSETS_PENDING_DISPOSITION
    http_status: 409
    validation_priority: [68]
    condition: "NOT (every DigitalAsset of the estate has disposition_status IN {EXECUTED, PURGED})"
    applies_to:
      - "POST /estates/{estate_id}/close"

  - id: ERR_DUPLICATE_ASSET_HANDLE
    http_status: 409
    validation_priority: [69]
    condition: "NOT (no other DigitalAsset of the estate has the same (platform_id, account_handle))"
    applies_to:
      - "POST /estates/{estate_id}/digital-assets"

  - id: ERR_INFO_CYCLE_LIMIT
    http_status: 409
    validation_priority: [70]
    condition: "NOT (PlatformRequest.info_cycle_count < MAX_INFO_CYCLES (3))"
    applies_to:
      - "POST /platform-requests/{request_id}/transitions"

  - id: ERR_OPEN_CANCELLATIONS
    http_status: 409
    validation_priority: [71]
    condition: "NOT (every CancellationOrder of the estate's assets has status IN {CONFIRMED, FAILED})"
    applies_to:
      - "POST /estates/{estate_id}/close"

  - id: ERR_OPEN_REFUND_CLAIMS
    http_status: 409
    validation_priority: [72]
    condition: "NOT (every RefundClaim of the estate has status IN {CREDITED, DENIED, CHARGED_BACK})"
    applies_to:
      - "POST /estates/{estate_id}/close"

# =============================================================================
# §1.7 RBAC Permission Matrix — role_model: segregation_of_duties
#
# X-User-Role selects the role; X-User-ID is the acting identity. Two of the
# four roles are entity-backed, so X-User-ID must resolve to a real row and is
# checked against the target resource's owner (§1.4 priorities 24-25).
#
# Action-level RBAC (§1.4 priority 5) applies on every POST .../transitions:
# passing endpoint-level RBAC is not enough, the submitted `action` must belong
# to the calling role.
# =============================================================================
roles:

  - name: Fiduciary
    description: >-
      The estate's executor, administrator or trustee. Owns the inventory, the request packages,
      the elections, the cancellations, the refund pursuit and the valuation. May only touch its
      own estate, and only while its letters are ISSUED.
    identity: "entity_backed:Fiduciary"
    identity_note: >-
      X-User-ID must be the id of a Fiduciary row. Its estate_id must equal the estate that owns
      the target resource, otherwise ERR_FIDUCIARY_ESTATE_MISMATCH (403).
    exclusive_operations:
      - "POST /estates/{estate_id}/digital-assets"
      - "POST /digital-assets/{asset_id}/transferability-reviews"
      - "POST /digital-assets/{asset_id}/subscription-terms"
      - "POST /estates/{estate_id}/platform-requests"
      - "POST /estates/{estate_id}/beneficiary-designations"
      - "POST /digital-assets/{asset_id}/disposition-elections"
      - "POST /cancellation-orders/{order_id}/refund-claims"
      - "POST /estates/{estate_id}/valuation-runs"
      - "POST /valuation-runs/{run_id}/transitions"
      - "POST /estates/{estate_id}/close"
    exclusive_actions:
      - "POST /platform-requests/{request_id}/transitions — SUBMIT, RESUBMIT, WITHDRAW"
      - "POST /disposition-elections/{election_id}/transitions — COUNTERSIGN, SUBMIT"
      - "POST /cancellation-orders/{order_id}/transitions — REQUEST"
      - "POST /refund-claims/{claim_id}/transitions — ESCALATE"
      - "POST /valuation-runs/{run_id}/transitions — FINALIZE"
    shared_operations:
      - "POST /estates/{estate_id}/documents (shared with CourtRegistrar)"
      - "POST /estates/{estate_id}/authority-directives (shared with CourtRegistrar)"
      - "every GET endpoint except none — all reads are open to all four roles unless noted"
    denied:
      - "POST /platforms and PATCH /platforms/{platform_id} — EstateAdmin only"
      - "POST /estates — EstateAdmin only"
      - "POST /estates/{estate_id}/fiduciaries — CourtRegistrar only"
      - "POST /documents/{document_id}/transitions — CourtRegistrar only"
      - "POST /authority-grants/{grant_id}/transitions — CourtRegistrar only"
      - "POST /_clock/set_current_utc and POST /estates/{estate_id}/grant-expiry-sweeps — EstateAdmin only"
      - "DECIDE, START_REVIEW, REQUEST_INFO, EXECUTE, REJECT, REVERSE, CONFIRM, FAIL, CREDIT, DENY, CHARGE_BACK — PlatformCompliance actions, rejected with ERR_ACTION_ROLE_MISMATCH (403)"

  - name: PlatformCompliance
    description: >-
      A service provider's death-administration desk. Decides the requests addressed to its own
      platform, executes or rejects dispositions on its own platform's assets, confirms
      cancellations and settles refund claims. Never sees another provider's traffic.
    identity: "entity_backed:Platform"
    identity_note: >-
      X-User-ID must be the id of a Platform row and must equal the platform_id of the target
      resource — PlatformRequest.platform_id, or DigitalAsset.platform_id for elections,
      cancellation orders and refund claims — otherwise ERR_PLATFORM_SCOPE_MISMATCH (403).
    exclusive_operations: []
    exclusive_actions:
      - "POST /platform-requests/{request_id}/transitions — START_REVIEW, REQUEST_INFO, DECIDE"
      - "POST /disposition-elections/{election_id}/transitions — EXECUTE, REJECT, REVERSE"
      - "POST /cancellation-orders/{order_id}/transitions — CONFIRM, FAIL"
      - "POST /refund-claims/{claim_id}/transitions — START_REVIEW, CREDIT, DENY, CHARGE_BACK"
    shared_operations:
      - "all read endpoints except GET /estates, GET /authority-directives, GET /beneficiary-designations, GET /valuation-runs, GET /estates/{estate_id}/authority-resolution"
    denied:
      - "every creation endpoint — a provider never files paperwork on the estate's behalf"
      - "SUBMIT, RESUBMIT, WITHDRAW, COUNTERSIGN, REQUEST, ESCALATE, FINALIZE — Fiduciary actions, rejected with ERR_ACTION_ROLE_MISMATCH (403)"
      - "VERIFY and REVOKE — CourtRegistrar actions"

  - name: CourtRegistrar
    description: >-
      The probate court's registry. Appoints fiduciaries, verifies and revokes the documents that
      confer authority, records will and trust provisions, and can revoke a live grant. Never
      touches inventory, valuation or money.
    identity: opaque
    identity_note: >-
      X-User-ID is an opaque registry operator identifier, not a row in any table. It is recorded
      on Document.verified_by_user_id for audit but is never resolved as a foreign key.
    exclusive_operations:
      - "POST /estates/{estate_id}/fiduciaries"
      - "POST /documents/{document_id}/transitions"
      - "POST /authority-grants/{grant_id}/transitions"
    exclusive_actions:
      - "POST /documents/{document_id}/transitions — VERIFY, REVOKE"
      - "POST /authority-grants/{grant_id}/transitions — REVOKE"
    shared_operations:
      - "POST /estates/{estate_id}/documents (shared with Fiduciary)"
      - "POST /estates/{estate_id}/authority-directives (shared with Fiduciary)"
      - "all read endpoints"
    denied:
      - "POST /estates/{estate_id}/digital-assets, POST /estates/{estate_id}/platform-requests, POST /estates/{estate_id}/valuation-runs, POST /estates/{estate_id}/close and every other Fiduciary-exclusive write"
      - "POST /platforms, PATCH /platforms/{platform_id}, POST /estates, POST /_clock/set_current_utc"
      - "every PlatformCompliance action"

  - name: EstateAdmin
    description: >-
      The platform operator of this administration service. Registers providers, opens estate
      files, drives the logical clock and runs the grant-expiry sweep. Has no authority over any
      individual estate's substantive decisions.
    identity: opaque
    identity_note: "X-User-ID is an opaque operator identifier and is never resolved as a foreign key."
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /platforms"
      - "PATCH /platforms/{platform_id}"
      - "POST /estates"
      - "POST /estates/{estate_id}/grant-expiry-sweeps"
    exclusive_actions: []
    shared_operations:
      - "all read endpoints"
    denied:
      - "every Fiduciary-exclusive write, every CourtRegistrar-exclusive write, and every transition action of any kind"
