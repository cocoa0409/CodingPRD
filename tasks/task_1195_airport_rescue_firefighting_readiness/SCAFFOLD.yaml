  - { id: ERR_NOTIFICATION_NOT_ACKNOWLEDGEABLE, http: 409, condition: "Acknowledge attempted on a RESOLVED notification" }
  - { id: ERR_REPORT_WINDOW_EXPIRED, http: 422, condition: "Report creation more than 10 days after the incident's controlled_at" }
  - { id: ERR_NARRATIVE_TOO_SHORT, http: 422, condition: "Report narrative shorter than 200 characters at creation" }
  - { id: ERR_NOT_REPORT_AUTHOR, http: 403, condition: "Submit/PATCH attempted by a user other than report.author_user_id" }
  - { id: ERR_SELF_APPROVAL_FORBIDDEN, http: 403, condition: "Accept/return attempted by the report's author" }
  - { id: ERR_REPORT_NOT_SUBMITTABLE, http: 409, condition: "Submit attempted on a non-DRAFT report" }
  - { id: ERR_REPORT_NOT_REVIEWABLE, http: 409, condition: "Accept/return attempted on a non-SUBMITTED report" }
  - { id: ERR_REPORT_NOT_EDITABLE, http: 409, condition: "PATCH attempted on a SUBMITTED or ACCEPTED report" }
  - { id: ERR_REPORT_NOT_ACCEPTED, http: 409, condition: "Post-incident review creation on a non-ACCEPTED report" }
  - { id: ERR_REVIEW_ALREADY_OPEN, http: 409, condition: "Second OPEN post-incident review for the same report" }
  - { id: ERR_REVIEW_NOT_CLOSABLE, http: 409, condition: "Close attempted on a CLOSED review" }
  - { id: ERR_ACTIONS_STILL_OPEN, http: 422, condition: "Review close attempted with corrective_actions_open > 0" }
  - { id: ERR_REVIEW_NOT_EDITABLE, http: 409, condition: "PATCH attempted on a CLOSED review" }
  - { id: ERR_DUPLICATE_CALL_SIGN, http: 409, condition: "Vehicle call_sign already in use" }
  - { id: ERR_DUPLICATE_EMPLOYEE_NO, http: 409, condition: "Firefighter employee_no already in use" }
  - { id: ERR_DUPLICATE_INSPECTION_YEAR, http: 409, condition: "An inspection already exists for inspection_year" }
  - { id: ERR_INSPECTION_NOT_BEGINNABLE, http: 409, condition: "Begin attempted on a non-SCHEDULED inspection" }
  - { id: ERR_INSPECTION_NOT_IN_PROGRESS, http: 409, condition: "Issue-findings attempted on an inspection not IN_PROGRESS" }
  - { id: ERR_INSPECTION_NOT_CONCLUDABLE, http: 409, condition: "Conclude attempted on an inspection not in FINDINGS_ISSUED" }
  - { id: ERR_INSPECTION_BLOCKING_NOTIFICATIONS, http: 422, condition: "Conclude PASS while a downgrade notification is PENDING, ACKNOWLEDGED, or OVERDUE" }
  - { id: ERR_NO_VALID_CERTIFIED_DRILL, http: 422, condition: "Conclude PASS without a CERTIFIED drill executed within the preceding 12 calendar months" }
  - { id: ERR_PROFILE_NOT_COMPLIANT, http: 422, condition: "Conclude PASS while index_compliance_status is not COMPLIANT" }
