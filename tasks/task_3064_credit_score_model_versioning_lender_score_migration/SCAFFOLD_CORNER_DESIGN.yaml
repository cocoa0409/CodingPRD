# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3064_credit_score_model_versioning_lender_score_migration
#
# Breadth probe. Every testable claim the §1.1–§1.7 surface declares that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already exercise. Corners §1.8
# already covers appear as `excluded_because:` stubs with no test_recipe.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: score_model_create_returns_declared_fields_and_development_status
        claim_type: Creation
        grounds:
          - entities.ScoreModel
          - endpoints.POST_/score-models
          - entities.ScoreModel.fields.predecessor_model_id
        distinguishing_aspect: "A version created with only family_code, version_label and min_input_count comes back 201 with status DEVELOPMENT, version 1, cascade_depth 0, active_variant_count 0, and score_floor / score_ceiling defaulted to 300 and 850."
        test_recipe:
          setup:
            - "Empty database; logical clock at the fixed default 2026-09-01T00:00:00Z."
          setup_api_calls:
            - {call: "POST /bureaus", payload: {bureau_code: "TUC", display_name: "TransUnion"}, as: BureauAdministrator, captures: {b_tuc: $.data.id}}
          trigger:
            - {call: "POST /score-models", payload: {family_code: "FICO_CORE", version_label: "CREDIT-DUAL-V1", min_input_count: 100}, as: ModelDeveloper, captures: {m1: $.data.id, m1_status: $.data.status, m1_depth: $.data.cascade_depth, m1_floor: $.data.score_floor, m1_ceil: $.data.score_ceiling, m1_avc: $.data.active_variant_count}}
          assert:
            - "the response status is 201 and response_type is object"
            - "data.m1_status == \"DEVELOPMENT\" && data.m1_depth == 0 && data.m1_avc == 0"
            - "data.m1_floor == 300 && data.m1_ceil == 850 — the defaults applied without being supplied"
            - "the response data carries a non-null id, created_at and updated_at, and version == 1"
            - "meta.api_request_id and meta.api_request_timestamp are present"

      - name: consumer_get_round_trips_every_stored_field
        claim_type: Retrieval
        grounds:
          - entities.Consumer
          - endpoints.GET_/consumers/{consumerId}
        distinguishing_aspect: "A consumer's consumer_ref, age_years and is_protected_class round-trip unchanged through GET, and the computed model_undecided_count starts at 0 with latest_uploaded_at null."
        test_recipe:
          setup:
            - "Empty database; logical clock at the fixed default 2026-09-01T00:00:00Z."
          setup_api_calls:
            - {call: "POST /bureaus", payload: {bureau_code: "TUC", display_name: "TransUnion"}, as: BureauAdministrator, captures: {b_tuc: $.data.id}}
            - {call: "POST /consumers", payload: {consumer_ref: "cons-rt-1", age_years: 57, is_protected_class: true}, as: ModelDeveloper, captures: {c: $.data.id}}
          trigger:
            - {call: "GET /consumers/${c}", payload: {}, as: ModelDeveloper, captures: {ref: $.data.consumer_ref, age: $.data.age_years, prot: $.data.is_protected_class, und: $.data.model_undecided_count}}
          assert:
            - "the response status is 200"
            - "data.ref == \"cons-rt-1\" && data.age == 57 && data.prot == true"
            - "data.und == 0 and the response carries a null latest_uploaded_at"

      - name: score_results_list_paginates_and_reports_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/score-results
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three postings on file, limit=2&offset=0 returns two rows with total_count 3 and has_more true, while offset=2 returns the last row with has_more false, so total_count counts the whole filtered set rather than the page."
        test_recipe:
          setup:
            - "Release M1 with a released AUTO variant (weight 0.42, ref_score 700, base_odds 18.0, double_odds_points 35, segment_width 60, segment_offsets: [0, 10, -6], rounding_penalty_pct 0.02, cutoff_baseline 700, elongation_points 700) and a FILED MODEL_RISK_REPORT; an ACTIVE license LEND-NORTH on it; consumer 'cons-page' with three settled postings."
          setup_api_calls:
            - {call: "POST /bureaus", payload: {bureau_code: "TUC", display_name: "TransUnion"}, as: BureauAdministrator, captures: {b_tuc: $.data.id}}
            - {call: "POST /score-models", payload: {family_code: "FICO_CORE", version_label: "CREDIT-DUAL-V1", min_input_count: 100, score_floor: 300, score_ceiling: 850}, as: ModelDeveloper, captures: {m1: $.data.id}}
            - {call: "POST /score-models/${m1}/variants", payload: {industry: "AUTO", ref_score: 700, base_odds: 18.0, double_odds_points: 35, segment_width: 60, segment_offsets: [0, 10, -6], rounding_penalty_pct: 0.02, aggregate_weight_pct: 0.42, elongation_points: 700, cutoff_baseline: 700}, as: ModelDeveloper, captures: {v1: $.data.id}}
            - {call: "POST /score-variants/${v1}/release", payload: {}, as: ModelDeveloper}
            - {call: "POST /model-documentation", payload: {score_model_id: "${m1}", doc_type: "MODEL_RISK_REPORT", required_version_label: "CREDIT-DUAL-V1"}, as: ComplianceOfficer, captures: {md: $.data.id, mdv: $.data.version}}
            - {call: "POST /model-documentation/${md}/file", payload: {expected_documentation_version: "${mdv}"}, as: ComplianceOfficer}
            - {call: "GET /score-models/${m1}", payload: {}, as: ModelDeveloper, captures: {m1v: $.data.version}}
            - {call: "POST /score-models/${m1}/release", payload: {expected_model_version: "${m1v}"}, as: ModelDeveloper}
            - {call: "POST /consumers", payload: {consumer_ref: "cons-page", age_years: 30, is_protected_class: false}, as: ModelDeveloper, captures: {c: $.data.id}}
            - {call: "POST /licenses", payload: {lender_name: "North Bank", lender_code: "LEND-NORTH", score_variant_id: "${v1}", volume_tier: "VOLUME_TIER_1", entitled_count: 500, window_start_month: "2026-01", window_end_month: "2027-01"}, as: ComplianceOfficer, captures: {lic: $.data.id}}
            - {call: "GET /licenses/${lic}", payload: {}, as: ComplianceOfficer, captures: {licv0: $.data.version}}
            - {call: "POST /licenses/${lic}/activate", payload: {expected_license_version: "${licv0}"}, as: ComplianceOfficer}
            - {call: "GET /licenses/${lic}", payload: {}, as: ScoreConsumer, as_user_id: "${lic}", captures: {licv1: $.data.version}}
            - {call: "POST /score-results", payload: {consumer_id: "${c}", score_variant_id: "${v1}", bureau_id: "${b_tuc}", license_id: "${lic}", raw_posted_score: 715, expected_license_version: "${licv1}"}, as: ScoreConsumer, as_user_id: "${lic}"}
            - {call: "GET /licenses/${lic}", payload: {}, as: ScoreConsumer, as_user_id: "${lic}", captures: {licv2: $.data.version}}
            - {call: "POST /score-results", payload: {consumer_id: "${c}", score_variant_id: "${v1}", bureau_id: "${b_tuc}", license_id: "${lic}", raw_posted_score: 716, expected_license_version: "${licv2}"}, as: ScoreConsumer, as_user_id: "${lic}"}
            - {call: "GET /licenses/${lic}", payload: {}, as: ScoreConsumer, as_user_id: "${lic}", captures: {licv3: $.data.version}}
            - {call: "POST /score-results", payload: {consumer_id: "${c}", score_variant_id: "${v1}", bureau_id: "${b_tuc}", license_id: "${lic}", raw_posted_score: 717, expected_license_version: "${licv3}"}, as: ScoreConsumer, as_user_id: "${lic}"}
          trigger:
            - {call: "GET /score-results?consumer_id=${c}&limit=2&offset=0", payload: {}, as: ModelDeveloper, captures: {n0: "$.data[0].id", n1: "$.data[1].id"}}
            - {call: "GET /score-results?consumer_id=${c}&limit=100&offset=2", payload: {}, as: ModelDeveloper, captures: {n2: "$.data[0].id"}}
            - {call: "GET /score-results?consumer_id=${c}", payload: {}, as: ModelDeveloper}
          assert:
            - "the first list returns two rows; the response meta carries total_count == 3 and has_more == true"
            - "the second list returns exactly one row and its meta carries total_count == 3 and has_more == false — total_count is the whole filtered set"
            - "the third list returns three rows and applies the defaults limit == 10 and offset == 0 from response_envelope.pagination_defaults"

      - name: license_get_with_an_unknown_id_returns_license_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/licenses/{licenseId}
          - errors.ERR_LICENSE_NOT_FOUND
          - validations[priority=4]
        distinguishing_aspect: "A syntactically valid but unallocated id on the licence path produces the entity-specific 404 ERR_LICENSE_NOT_FOUND, not a generic error and not a 400."
        test_recipe:
          setup:
            - "Empty database; logical clock at the fixed default 2026-09-01T00:00:00Z."
          setup_api_calls:
            - {call: "POST /bureaus", payload: {bureau_code: "TUC", display_name: "TransUnion"}, as: BureauAdministrator}
          trigger:
            - {call: "GET /licenses/0ab1c2d3-4e5f-4061-8273-849506172839", payload: {}, as: ComplianceOfficer, captures: {err: $.data.error_id}}
          assert:
            - "the response status is 404 and data.err == \"ERR_LICENSE_NOT_FOUND\""
            - "the response_type is error and data.message is non-empty"

      - name: score_model_create_missing_min_input_count_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.ScoreModel.fields.min_input_count
          - endpoints.POST_/score-models
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "Omitting the required min_input_count is a 400 ERR_INVALID_REQUEST, and no ScoreModel row is written."
        test_recipe:
          setup:
            - "Empty database; logical clock at the fixed default 2026-09-01T00:00:00Z."
          setup_api_calls:
            - {call: "POST /bureaus", payload: {bureau_code: "TUC", display_name: "TransUnion"}, as: BureauAdministrator}
          trigger:
            - {call: "POST /score-models", payload: {family_code: "FICO_CORE", version_label: "NO-MIN-V1"}, as: ModelDeveloper, captures: {err: $.data.error_id}}
          assert:
            - "the response status is 400 and data.err == \"ERR_INVALID_REQUEST\""
            - "the rejected create wrote nothing, so GET /score-models with no filter reports total_count == 0"

      - name: score_result_effective_score_is_computed_and_ignores_client_supplied_value
        claim_type: Computed Fields
        grounds:
          - entities.ScoreResult.fields.effective_score
          - calculations.score_effective_and_odds
          - endpoints.POST_/score-results
        distinguishing_aspect: "effective_score is derived from raw_posted_score, so a posting of raw 715 yields 700 — not the raw value — and the client never supplies effective_score at all."
        test_recipe:
          setup:
            - "Release M1 with a released AUTO variant (weight 0.42, ref_score 700, base_odds 18.0, double_odds_points 35, segment_width 60, segment_offsets: [0, 10, -6], rounding_penalty_pct 0.02, cutoff_baseline 700, elongation_points 700) and a FILED MODEL_RISK_REPORT; an ACTIVE license LEND-NORTH on it; consumer 'cons-cf-1'."
          setup_api_calls:
            - {call: "POST /bureaus", payload: {bureau_code: "TUC", display_name: "TransUnion"}, as: BureauAdministrator, captures: {b_tuc: $.data.id}}
            - {call: "POST /score-models", payload: {family_code: "FICO_CORE", version_label: "CREDIT-DUAL-V1", min_input_count: 100, score_floor: 300, score_ceiling: 850}, as: ModelDeveloper, captures: {m1: $.data.id}}
            - {call: "POST /score-models/${m1}/variants", payload: {industry: "AUTO", ref_score: 700, base_odds: 18.0, double_odds_points: 35, segment_width: 60, segment_offsets: [0, 10, -6], rounding_penalty_pct: 0.02, aggregate_weight_pct: 0.42, elongation_points: 700, cutoff_baseline: 700}, as: ModelDeveloper, captures: {v1: $.data.id}}
            - {call: "POST /score-variants/${v1}/release", payload: {}, as: ModelDeveloper}
            - {call: "POST /model-documentation", payload: {score_model_id: "${m1}", doc_type: "MODEL_RISK_REPORT", required_version_label: "CREDIT-DUAL-V1"}, as: ComplianceOfficer, captures: {md: $.data.id, mdv: $.data.version}}
            - {call: "POST /model-documentation/${md}/file", payload: {expected_documentation_version: "${mdv}"}, as: ComplianceOfficer}
            - {call: "GET /score-models/${m1}", payload: {}, as: ModelDeveloper, captures: {m1v: $.data.version}}
            - {call: "POST /score-models/${m1}/release", payload: {expected_model_version: "${m1v}"}, as: ModelDeveloper}
            - {call: "POST /consumers", payload: {consumer_ref: "cons-cf-1", age_years: 26, is_protected_class: false}, as: ModelDeveloper, captures: {c: $.data.id}}
            - {call: "POST /licenses", payload: {lender_name: "North Bank", lender_code: "LEND-NORTH", score_variant_id: "${v1}", volume_tier: "VOLUME_TIER_1", entitled_count: 500, window_start_month: "2026-01", window_end_month: "2027-01"}, as: ComplianceOfficer, captures: {lic: $.data.id}}
            - {call: "GET /licenses/${lic}", payload: {}, as: ComplianceOfficer, captures: {licv0: $.data.version}}
            - {call: "POST /licenses/${lic}/activate", payload: {expected_license_version: "${licv0}"}, as: ComplianceOfficer}
            - {call: "GET /licenses/${lic}", payload: {}, as: ScoreConsumer, as_user_id: "${lic}", captures: {licv1: $.data.version}}
          trigger:
            - {call: "POST /score-results", payload: {consumer_id: "${c}", score_variant_id: "${v1}", bureau_id: "${b_tuc}", license_id: "${lic}", raw_posted_score: 715, expected_license_version: "${licv1}"}, as: ScoreConsumer, as_user_id: "${lic}", captures: {sr: $.data.id, eff: $.data.effective_score, odds: $.data.odds_at_posted_score}}
          assert:
            - "data.eff == 700 — raw 715 sat in band 0 (offset 0), the clamp left it at 715, and the rounding penalty ceil(715 * 0.02) == 15 brought it to 700"
            - "data.eff != 715, so the raw value is not echoed back as the effective score"
            - "data.odds is 28.2843 — round_half_up(18.0 * 2 ** ((700 - 700) / 35) + 1.0 + (700 / 700), 4)"
            - "GET /score-results/${sr} returns the same effective_score, so the stored row and the create response agree"

      - name: score_model_invalid_extra_system_fields_are_rejected
        claim_type: System Fields
        grounds:
          - entities.ScoreModel
          - endpoints.POST_/score-models
        distinguishing_aspect: "A create body carrying status, released_at, cascade_depth and active_variant_count is rejected as an unknown field rather than honoured, so every system-sourced field is minted by the server."
        test_recipe:
          setup:
            - "Empty database; logical clock at the fixed default 2026-09-01T00:00:00Z."
          setup_api_calls:
            - {call: "POST /bureaus", payload: {bureau_code: "TUC", display_name: "TransUnion"}, as: BureauAdministrator}
          trigger:
            - {call: "POST /score-models", payload: {family_code: "FICO_CORE", version_label: "SYS-V1", min_input_count: 100, status: "RELEASED", released_at: "2026-01-01T00:00:00.000Z", cascade_depth: 9, active_variant_count: 4}, as: ModelDeveloper, captures: {err: $.data.error_id}}
          assert:
            - "the response status is 400 and data.err == \"ERR_INVALID_REQUEST\" — server-sourced fields are not writable through the create body"
            - "the rejected create wrote nothing, so GET /score-models with no filter reports total_count == 0"

      - name: score_result_rejects_an_out_of_range_raw_score
        claim_type: Type Constraints
        grounds:
          - entities.ScoreResult.fields.raw_posted_score
          - validations[priority=14]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "raw_posted_score 299 and 851 are both rejected with 400 ERR_INVALID_REQUEST, while 300 and 850 are accepted, pinning the closed interval at both ends."
        test_recipe:
          setup:
            - "Release M1 with a released AUTO variant (weight 0.42, ref_score 700, base_odds 18.0, double_odds_points 35, segment_width 60, segment_offsets: [0, 10, -6], rounding_penalty_pct 0.02, cutoff_baseline 700, elongation_points 700) and a FILED MODEL_RISK_REPORT; an ACTIVE license LEND-NORTH; consumer 'cons-tc-1'."
          setup_api_calls:
            - {call: "POST /bureaus", payload: {bureau_code: "TUC", display_name: "TransUnion"}, as: BureauAdministrator, captures: {b_tuc: $.data.id}}
            - {call: "POST /score-models", payload: {family_code: "FICO_CORE", version_label: "CREDIT-DUAL-V1", min_input_count: 100, score_floor: 300, score_ceiling: 850}, as: ModelDeveloper, captures: {m1: $.data.id}}
            - {call: "POST /score-models/${m1}/variants", payload: {industry: "AUTO", ref_score: 700, base_odds: 18.0, double_odds_points: 35, segment_width: 60, segment_offsets: [0, 10, -6], rounding_penalty_pct: 0.02, aggregate_weight_pct: 0.42, elongation_points: 700, cutoff_baseline: 700}, as: ModelDeveloper, captures: {v1: $.data.id}}
            - {call: "POST /score-variants/${v1}/release", payload: {}, as: ModelDeveloper}
            - {call: "POST /model-documentation", payload: {score_model_id: "${m1}", doc_type: "MODEL_RISK_REPORT", required_version_label: "CREDIT-DUAL-V1"}, as: ComplianceOfficer, captures: {md: $.data.id, mdv: $.data.version}}
            - {call: "POST /model-documentation/${md}/file", payload: {expected_documentation_version: "${mdv}"}, as: ComplianceOfficer}
            - {call: "GET /score-models/${m1}", payload: {}, as: ModelDeveloper, captures: {m1v: $.data.version}}
            - {call: "POST /score-models/${m1}/release", payload: {expected_model_version: "${m1v}"}, as: ModelDeveloper}
            - {call: "POST /consumers", payload: {consumer_ref: "cons-tc-1", age_years: 62, is_protected_class: false}, as: ModelDeveloper, captures: {c: $.data.id}}
            - {call: "POST /licenses", payload: {lender_name: "North Bank", lender_code: "LEND-NORTH", score_variant_id: "${v1}", volume_tier: "VOLUME_TIER_1", entitled_count: 500, window_start_month: "2026-01", window_end_month: "2027-01"}, as: ComplianceOfficer, captures: {lic: $.data.id}}
            - {call: "GET /licenses/${lic}", payload: {}, as: ComplianceOfficer, captures: {licv0: $.data.version}}
            - {call: "POST /licenses/${lic}/activate", payload: {expected_license_version: "${licv0}"}, as: ComplianceOfficer}
            - {call: "GET /licenses/${lic}", payload: {}, as: ScoreConsumer, as_user_id: "${lic}", captures: {licv1: $.data.version}}
          trigger:
            - {call: "POST /score-results", payload: {consumer_id: "${c}", score_variant_id: "${v1}", bureau_id: "${b_tuc}", license_id: "${lic}", raw_posted_score: 299, expected_license_version: "${licv1}"}, as: ScoreConsumer, as_user_id: "${lic}", captures: {err_low: $.data.error_id}}
            - {call: "POST /score-results", payload: {consumer_id: "${c}", score_variant_id: "${v1}", bureau_id: "${b_tuc}", license_id: "${lic}", raw_posted_score: 851, expected_license_version: "${licv1}"}, as: ScoreConsumer, as_user_id: "${lic}", captures: {err_high: $.data.error_id}}
            - {call: "POST /score-results", payload: {consumer_id: "${c}", score_variant_id: "${v1}", bureau_id: "${b_tuc}", license_id: "${lic}", raw_posted_score: 300, expected_license_version: "${licv1}"}, as: ScoreConsumer, as_user_id: "${lic}", captures: {ok_low: $.data.id}}
          assert:
            - "data.err_low == \"ERR_INVALID_REQUEST\" && data.err_high == \"ERR_INVALID_REQUEST\""
            - "data.ok_low is non-null — 300 is inside the closed interval"
            - "GET /score-results?consumer_id=${c} reports total_count == 1"

      - name: fee_ledger_entry_has_no_version_and_no_update_endpoint
        claim_type: Immutability
        grounds:
          - entities.FeeLedgerEntry
          - endpoints.GET_/fee-ledger-entries
        distinguishing_aspect: "A ledger entry is declared with common_fields false, so its read shape carries id and created_at but no updated_at and no version, and no endpoint in §1.5 writes it directly."
        test_recipe:
          setup:
            - "Release M1 with a released AUTO variant (weight 0.42, ref_score 700, base_odds 18.0, double_odds_points 35, segment_width 60, segment_offsets: [0, 10, -6], rounding_penalty_pct 0.02, cutoff_baseline 700, elongation_points 700) and a FILED MODEL_RISK_REPORT; an ACTIVE licence with one settled posting."
          setup_api_calls:
            - {call: "POST /bureaus", payload: {bureau_code: "TUC", display_name: "TransUnion"}, as: BureauAdministrator, captures: {b_tuc: $.data.id}}
            - {call: "POST /score-models", payload: {family_code: "FICO_CORE", version_label: "CREDIT-DUAL-V1", min_input_count: 100, score_floor: 300, score_ceiling: 850}, as: ModelDeveloper, captures: {m1: $.data.id}}
            - {call: "POST /score-models/${m1}/variants", payload: {industry: "AUTO", ref_score: 700, base_odds: 18.0, double_odds_points: 35, segment_width: 60, segment_offsets: [0, 10, -6], rounding_penalty_pct: 0.02, aggregate_weight_pct: 0.42, elongation_points: 700, cutoff_baseline: 700}, as: ModelDeveloper, captures: {v1: $.data.id}}
            - {call: "POST /score-variants/${v1}/release", payload: {}, as: ModelDeveloper}
            - {call: "POST /model-documentation", payload: {score_model_id: "${m1}", doc_type: "MODEL_RISK_REPORT", required_version_label: "CREDIT-DUAL-V1"}, as: ComplianceOfficer, captures: {md: $.data.id, mdv: $.data.version}}
            - {call: "POST /model-documentation/${md}/file", payload: {expected_documentation_version: "${mdv}"}, as: ComplianceOfficer}
            - {call: "GET /score-models/${m1}", payload: {}, as: ModelDeveloper, captures: {m1v: $.data.version}}
            - {call: "POST /score-models/${m1}/release", payload: {expected_model_version: "${m1v}"}, as: ModelDeveloper}
            - {call: "POST /consumers", payload: {consumer_ref: "cons-imm-1", age_years: 46, is_protected_class: false}, as: ModelDeveloper, captures: {c: $.data.id}}
            - {call: "POST /licenses", payload: {lender_name: "North Bank", lender_code: "LEND-NORTH", score_variant_id: "${v1}", volume_tier: "VOLUME_TIER_1", entitled_count: 500, window_start_month: "2026-01", window_end_month: "2027-01"}, as: ComplianceOfficer, captures: {lic: $.data.id}}
            - {call: "GET /licenses/${lic}", payload: {}, as: ComplianceOfficer, captures: {licv0: $.data.version}}
            - {call: "POST /licenses/${lic}/activate", payload: {expected_license_version: "${licv0}"}, as: ComplianceOfficer}
            - {call: "GET /licenses/${lic}", payload: {}, as: ScoreConsumer, as_user_id: "${lic}", captures: {licv1: $.data.version}}
            - {call: "POST /score-results", payload: {consumer_id: "${c}", score_variant_id: "${v1}", bureau_id: "${b_tuc}", license_id: "${lic}", raw_posted_score: 715, expected_license_version: "${licv1}"}, as: ScoreConsumer, as_user_id: "${lic}"}
          trigger:
            - {call: "GET /fee-ledger-entries?license_id=${lic}", payload: {}, as: ComplianceOfficer, captures: {le_id: "$.data[0].id", le_kind: "$.data[0].kind", le_fee: "$.data[0].fee_cents", le_before: "$.data[0].cumulative_count_before"}}
            - {call: "GET /licenses/${lic}", payload: {}, as: ComplianceOfficer, captures: {lic_fee: $.data.cumulative_fee_cents, lic_n: $.data.cumulative_score_count}}
          assert:
            - "data.le_kind == \"MARGINAL_PRICING\" && data.le_fee == 18 && data.le_before == 0"
            - "License.${lic}.cumulative_fee_cents == 18 and License.${lic}.cumulative_score_count == 1, matching the single ledger row"
            - "the ledger read carries id and created_at but no updated_at and no version, and §1.5 declares no PUT, PATCH or DELETE on /fee-ledger-entries"

      - name: archive_sample_returns_not_found_for_an_unknown_parent_model
        claim_type: Parent Relationships
        grounds:
          - entities.ArchiveSample.fields.score_model_id
          - endpoints.POST_/archive-samples
          - errors.ERR_SCORE_MODEL_NOT_FOUND
        distinguishing_aspect: "An archive draw whose parent model id does not resolve returns 404 ERR_SCORE_MODEL_NOT_FOUND before any window arithmetic runs."
        test_recipe:
          setup:
            - "Empty database; logical clock at the fixed default 2026-09-01T00:00:00Z."
          setup_api_calls:
            - {call: "POST /bureaus", payload: {bureau_code: "TUC", display_name: "TransUnion"}, as: BureauAdministrator}
          trigger:
            - {call: "POST /archive-samples", payload: {score_model_id: "7f3a1b2c-3d4e-4f50-9161-728394a5b6c7", sample_ref: "DEV-ORPHAN", record_count: 1000, segment_name: "PRIME", sample_kind: "DEVELOPMENT", observation_window_months: 12, window_start_month: "2025-01", window_end_month: "2026-01"}, as: ModelDeveloper, captures: {err: $.data.error_id}}
          assert:
            - "the response status is 404 and data.err == \"ERR_SCORE_MODEL_NOT_FOUND\""
            - "the rejected draw wrote nothing, so GET /archive-samples with no filter reports total_count == 0"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: score_discovery_request_consume_is_terminal
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.ScoreDiscoveryRequest.REGISTERED_to_CONSUMED
          - entities.ScoreDiscoveryRequest.fields.status
        distinguishing_aspect: "Once a discovery slot is consumed it can be neither consumed again nor returned to REGISTERED, and the second posting carrying the same tag is refused."
        test_recipe:
          setup:
            - "Release M1 with a released AUTO variant (weight 0.42, ref_score 700, base_odds 18.0, double_odds_points 35, segment_width 60, segment_offsets: [0, 10, -6], rounding_penalty_pct 0.02, cutoff_baseline 700, elongation_points 700) and a FILED MODEL_RISK_REPORT; an ACTIVE licence; consumer 'cons-dt-1'; one REGISTERED discovery slot tagged 'DISC-1' already consumed by the first posting."
          setup_api_calls:
            - {call: "POST /bureaus", payload: {bureau_code: "TUC", display_name: "TransUnion"}, as: BureauAdministrator, captures: {b_tuc: $.data.id}}
            - {call: "POST /score-models", payload: {family_code: "FICO_CORE", version_label: "CREDIT-DUAL-V1", min_input_count: 100, score_floor: 300, score_ceiling: 850}, as: ModelDeveloper, captures: {m1: $.data.id}}
            - {call: "POST /score-models/${m1}/variants", payload: {industry: "AUTO", ref_score: 700, base_odds: 18.0, double_odds_points: 35, segment_width: 60, segment_offsets: [0, 10, -6], rounding_penalty_pct: 0.02, aggregate_weight_pct: 0.42, elongation_points: 700, cutoff_baseline: 700}, as: ModelDeveloper, captures: {v1: $.data.id}}
            - {call: "POST /score-variants/${v1}/release", payload: {}, as: ModelDeveloper}
            - {call: "POST /model-documentation", payload: {score_model_id: "${m1}", doc_type: "MODEL_RISK_REPORT", required_version_label: "CREDIT-DUAL-V1"}, as: ComplianceOfficer, captures: {md: $.data.id, mdv: $.data.version}}
            - {call: "POST /model-documentation/${md}/file", payload: {expected_documentation_version: "${mdv}"}, as: ComplianceOfficer}
            - {call: "GET /score-models/${m1}", payload: {}, as: ModelDeveloper, captures: {m1v: $.data.version}}
            - {call: "POST /score-models/${m1}/release", payload: {expected_model_version: "${m1v}"}, as: ModelDeveloper}
            - {call: "POST /consumers", payload: {consumer_ref: "cons-dt-1", age_years: 35, is_protected_class: false}, as: ModelDeveloper, captures: {c: $.data.id}}
            - {call: "POST /licenses", payload: {lender_name: "North Bank", lender_code: "LEND-NORTH", score_variant_id: "${v1}", volume_tier: "VOLUME_TIER_1", entitled_count: 500, window_start_month: "2026-01", window_end_month: "2027-01"}, as: ComplianceOfficer, captures: {lic: $.data.id}}
