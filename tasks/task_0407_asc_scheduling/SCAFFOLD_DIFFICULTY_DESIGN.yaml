            - call: "POST /asc/surgeons"
              payload: { facility_id: "${fac_id}", full_name: "Dr Cut", npi: "1234567890" }
              as: Scheduler
              captures: { surg_id: $.data.id }
            - call: "POST /asc/procedures"
              payload: { facility_id: "${fac_id}", cpt_code: "29881", description: "Phase2 proc", scheduled_minutes: 60, cms_payment_indicator: "COVERED_ASC", cms_base_rate_cents: 150000, anesthesia_class: "MAC", requires_phase2: true }
              as: BillingAnalyst
