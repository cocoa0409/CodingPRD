  # ===========================================================================
  - section: errors
    instances:

      - name: missing_auth_headers_returns_unauthenticated
        claim_type: Violation → Error
        grounds:
          - validations[priority=1]
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: "A call with no X-User-ID / X-User-Role headers fails authentication at priority 1 with 401 ERR_UNAUTHENTICATED — before role authorization, existence, or any business rule."
        test_recipe:
