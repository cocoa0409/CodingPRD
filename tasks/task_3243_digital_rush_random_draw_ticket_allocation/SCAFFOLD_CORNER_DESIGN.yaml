scaffold_corner_design:
- section: entities
  instances:
  - name: production_creation_applies_defaults_and_opens_in_draft
    claim_type: Creation
    grounds:
    - entities.Production.fields.status
    - entities.Production.fields.exchange_allowed
    - endpoints.POST_/productions
    distinguishing_aspect: A production posted with only title, producer_org, refund_window_hours and exchange_fee_cents comes back 201 with exchange_allowed defaulted to false, status DRAFT, and server-stamped id, created_at, updated_at and version 1.
    test_recipe:
      setup:
      - Logical clock at 2026-09-12T09:00:00Z. Empty database.
      setup_api_calls:
      - &id001
        call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-12T09:00:00Z'
        as: PlatformAdmin
      trigger:
      - call: POST /productions
        payload:
          title: Draft Play
          producer_org: Draft Partners
          refund_window_hours: 24
          exchange_fee_cents: 250
        as: OpsManager
        captures:
          prod_id: $.data.id
          prod_v: $.data.version
      assert:
      - the response status is 201 and response_type is object
      - Production.${prod_id}.status == DRAFT
      - Production.${prod_id}.exchange_allowed == false, the declared default
      - Production.${prod_id}.version == 1
      - the response data carries non-null id, created_at and updated_at
      - meta.api_request_id and meta.api_request_timestamp are present
  - name: performance_creation_rejects_unknown_market_code
    claim_type: Required Fields
    grounds:
    - entities.Performance.fields.market_code
    - errors[ERR_REFERENCE_NOT_FOUND]
    - validations[priority=4]
    distinguishing_aspect: A performance whose market_code names no declared market is rejected at priority 4 with the body-reference 404 ERR_REFERENCE_NOT_FOUND, not with a generic 400 and not with the path-segment 404 family.
    test_recipe:
      setup:
      - Logical clock at 2026-09-12T09:00:00Z. An ACTIVE production exists; no market has been declared.
      setup_api_calls:
      - *id001
      - call: POST /productions
        payload:
          title: No Market Play
          producer_org: Draft Partners
          refund_window_hours: 24
          exchange_fee_cents: 250
        as: OpsManager
        captures:
          prod_id: $.data.id
          prod_v: $.data.version
      - call: POST /productions/${prod_id}/status-transitions
        payload:
          to_status: ACTIVE
          expected_production_version: ${prod_id_stub}
        as: OpsManager
        captures:
          prod_v: $.data.version
      trigger:
      - call: POST /performances
        payload:
          production_id: ${prod_id}
          market_code: ZZZ
          venue_name: Nowhere
          starts_at: '2026-10-05T19:00:00Z'
          face_value_cents: 10000
          total_seat_capacity: 20
        as: OpsManager
        captures:
          err: $.data.error_id
          perf_v: $.data.version
      assert:
      - the response status is 404
      - the response reported ${err} == ERR_REFERENCE_NOT_FOUND
      - no Performance row was created for production ${prod_id}
  - name: patron_creation_starts_active_with_zero_violations
    claim_type: Defaults
    grounds:
    - entities.Patron.fields.status
    - entities.Patron.fields.draw_violation_count
    - endpoints.POST_/patrons/registrations
    distinguishing_aspect: A patron registration posted with the three required fields returns 201 with status ACTIVE and draw_violation_count 0 without any identity header, because registration is the only Anonymous-reachable operation in the catalog.
    test_recipe:
      setup:
      - Logical clock at 2026-09-12T09:00:00Z. Empty database.
      setup_api_calls:
      - *id001
      trigger:
      - call: POST /patrons/registrations
        payload:
          email: fresh_patron@x.com
          display_name: Fresh Patron
          market_code: NYC
        as: Anonymous
        captures:
          pat_id: $.data.id
          patron_v: $.data.version
      assert:
      - the response status is 201
      - Patron.${pat_id}.status == ACTIVE
      - Patron.${pat_id}.draw_violation_count == 0
      - Patron.${pat_id}.email == "fresh_patron@x.com" and display_name == "Fresh Patron"
      - no X-User-Role or X-User-ID header was required for this call
  - name: market_creation_deploys_a_desk_only_for_non_mobile_models
    claim_type: Retrieval
    grounds:
    - entities.Market.fields.handoff_model
    - entities.ConciergeDesk.fields.daily_capacity
    - endpoints.POST_/markets
    distinguishing_aspect: "Declaring a CONCIERGE_DESK market with desk_code and daily_capacity creates the market and its first desk together, while declaring a MOBILE_PUSH market with the same desk fields creates only the market \u2014 GET /markets/{id} round-trips the handoff model in both cases."
    test_recipe:
      setup:
      - Logical clock at 2026-09-12T09:00:00Z. Empty database.
      setup_api_calls:
      - *id001
      trigger:
      - call: POST /markets
        payload:
          market_code: LDN
          city: London
          handoff_model: CONCIERGE_DESK
          desk_code: LDN-W1
          daily_capacity: 3
        as: OpsManager
        captures:
          ldn_id: $.data.id
          mkt_v: $.data.version
      - call: GET /markets/${ldn_id}
        payload: {}
        as: ConciergeDeskStaff
        captures:
          mkt_v: $.data.version
      assert:
      - the market creation returned 201 and Market.${ldn_id}.handoff_model == CONCIERGE_DESK
      - Market.${ldn_id}.market_code == "LDN" and city == "London"
      - the round-trip GET returned 200 with the same handoff_model CONCIERGE_DESK
      - a MOBILE_PUSH market created with desk_code "CHI-W2" does not make GET /markets/{id} report a desk obligation, because handoff_status for its purchases stays NOT_REQUIRED
- section: state_machines
  instances:
  - name: allocation_scheduling_from_released_returns_invalid_state
    claim_type: invalid_transition
    grounds:
    - state_machines.RushAllocation.SCHEDULED_to_RELEASED
    - errors[ERR_INVALID_STATE]
    - validations[priority=5]
    distinguishing_aspect: 'Scheduling is legal only from DRAFT: once an allocation has been released, a second scheduling call is refused at priority 5b with ERR_INVALID_STATE and the allocation''s released counters are untouched.'
    test_recipe:
      setup:
      - Logical clock at 2026-09-12T09:00:00Z. A MOBILE_PUSH market, an ACTIVE production and an ONSALE performance.
      - A RUSH allocation released for epoch 2026-09-12, so its status is RELEASED and quantity_released_today is 5.
      setup_api_calls:
      - *id001
      - call: POST /markets
        payload:
          market_code: NYC
          city: New York
          handoff_model: MOBILE_PUSH
        as: PlatformAdmin
        captures:
          nyc_id: $.data.id
          mkt_v: $.data.version
      - call: POST /productions
        payload:
          title: Corner Play
          producer_org: Corner Partners
          refund_window_hours: 720
          exchange_fee_cents: 300
          exchange_allowed: true
        as: OpsManager
        captures:
          prod_id: $.data.id
          prod_v: $.data.version
      - call: POST /productions/${prod_id}/status-transitions
        payload:
          to_status: ACTIVE
          expected_production_version: ${prod_v}
        as: OpsManager
        captures:
          prod_v: $.data.version
      - call: POST /performances
        payload:
          production_id: ${prod_id}
          market_code: NYC
          venue_name: State Theatre
          starts_at: '2026-10-05T19:00:00Z'
          face_value_cents: 10000
          total_seat_capacity: 30
        as: OpsManager
        captures:
          perf_id: $.data.id
          perf_v: $.data.version
      - call: POST /performances/${perf_id}/status-transitions
        payload:
          to_status: ONSALE
          expected_performance_version: ${perf_v}
        as: OpsManager
        captures:
          perf_v: $.data.version
      - call: POST /performances/${perf_id}/allocations
        payload:
          ticket_type: RUSH
          daily_quantity: 5
          discount_pct: 0.5
          release_time_local: 09:00
          refundable: true
          per_order_limit: 2
        as: AllocationsCoordinator
        captures:
          alloc_id: $.data.id
          alloc_v: $.data.version
      - call: POST /allocations/${alloc_id}/scheduling
        payload:
          expected_allocation_version: ${alloc_v}
        as: AllocationsCoordinator
        captures:
          alloc_v: $.data.version
      - call: POST /allocations/${alloc_id}/releases/2026-09-12
        payload:
          expected_production_version: ${prod_v}
          expected_performance_version: ${perf_v}
          expected_allocation_version: ${alloc_v}
        as: OpsManager
        captures:
          alloc_v: $.data.version
      trigger:
      - call: POST /allocations/${alloc_id}/scheduling
        payload:
          expected_allocation_version: ${alloc_v}
        as: AllocationsCoordinator
        captures:
          err: $.data.error_id
          alloc_v: $.data.version
      assert:
      - the response status is 409
      - the response reported ${err} == ERR_INVALID_STATE
      - RushAllocation.${alloc_id}.status == RELEASED, unchanged by the rejected call
      - RushAllocation.${alloc_id}.quantity_released_today == 5, unchanged by the rejected call
  - name: performance_cancellation_is_terminal_for_further_lifecycle_moves
    claim_type: terminal_lockdown
    grounds:
    - state_machines.Performance.SCHEDULED_to_CANCELLED
    - errors[ERR_INVALID_STATE]
    - state_machines.Performance.SCHEDULED_to_ONSALE
    distinguishing_aspect: 'CANCELLED is terminal: after a performance is cancelled, both a second cancellation and an on-sale call are refused with ERR_INVALID_STATE, and the cancellation cascade''s allocation closures are not re-applied.'
    test_recipe:
      setup:
      - Logical clock at 2026-09-12T09:00:00Z. A MOBILE_PUSH market, an ACTIVE production, and a performance with one SCHEDULED RUSH allocation that has been cancelled.
      setup_api_calls:
      - *id001
      - call: POST /markets
        payload:
          market_code: NYC
          city: New York
          handoff_model: MOBILE_PUSH
        as: PlatformAdmin
        captures:
          nyc_id: $.data.id
          mkt_v: $.data.version
      - call: POST /productions
        payload:
          title: Corner Play
          producer_org: Corner Partners
          refund_window_hours: 720
          exchange_fee_cents: 300
          exchange_allowed: true
        as: OpsManager
        captures:
          prod_id: $.data.id
          prod_v: $.data.version
      - call: POST /productions/${prod_id}/status-transitions
        payload:
          to_status: ACTIVE
          expected_production_version: ${prod_v}
        as: OpsManager
        captures:
          prod_v: $.data.version
      - call: POST /performances
        payload:
          production_id: ${prod_id}
          market_code: NYC
          venue_name: Terminal Theatre
          starts_at: '2026-10-05T19:00:00Z'
          face_value_cents: 10000
          total_seat_capacity: 30
        as: OpsManager
        captures:
          perf_id: $.data.id
          perf_v: $.data.version
      - call: POST /performances/${perf_id}/allocations
        payload:
          ticket_type: RUSH
          daily_quantity: 5
          discount_pct: 0.5
          release_time_local: 09:00
          refundable: true
          per_order_limit: 2
        as: AllocationsCoordinator
        captures:
          alloc_id: $.data.id
          alloc_v: $.data.version
      - call: POST /allocations/${alloc_id}/scheduling
        payload:
          expected_allocation_version: ${alloc_v}
        as: AllocationsCoordinator
        captures:
          alloc_v: $.data.version
      - call: POST /performances/${perf_id}/status-transitions
        payload:
          to_status: CANCELLED
          expected_performance_version: ${perf_v}
        as: OpsManager
        captures:
          alloc_v_after_cancel: $.data.version
          perf_v: $.data.version
      trigger:
      - call: POST /performances/${perf_id}/status-transitions
        payload:
          to_status: CANCELLED
          expected_performance_version: ${perf_v}
        as: OpsManager
        captures:
          err: $.data.error_id
          perf_v: $.data.version
      - call: POST /performances/${perf_id}/status-transitions
        payload:
          to_status: ONSALE
          expected_performance_version: ${perf_v}
        as: OpsManager
        captures:
          err2: $.data.error_id
          perf_v: $.data.version
      assert:
      - the first trigger reported ${err} == ERR_INVALID_STATE at status 409
      - the second trigger reported ${err2} == ERR_INVALID_STATE at status 409
      - Performance.${perf_id}.status == CANCELLED throughout
      - RushAllocation.${alloc_id}.status == CLOSED, closed once by the original cancellation and not re-closed
  - name: second_join_while_queue_position_active_is_rejected
    claim_type: violation_to_error
    grounds:
    - validations[priority=18]
    - errors[ERR_QUEUE_POSITION_EXISTS]
    - state_machines.QueuePosition.WAITING_to_ADMITTED
    distinguishing_aspect: A patron holding a WAITING or ADMITTED position cannot join the same performance's queue again, and the refusal comes from the uniqueness rule at priority 18 rather than from any window or capacity rule.
    test_recipe:
      setup:
      - Logical clock at 2026-09-12T09:00:00Z. A MOBILE_PUSH market, an ACTIVE production, an ONSALE performance and a released RUSH allocation.
      - One patron already holds a WAITING queue position for that performance.
      setup_api_calls:
      - *id001
      - call: POST /markets
        payload:
          market_code: NYC
          city: New York
          handoff_model: MOBILE_PUSH
        as: PlatformAdmin
        captures:
          nyc_id: $.data.id
          mkt_v: $.data.version
      - call: POST /productions
        payload:
          title: Corner Play
          producer_org: Corner Partners
          refund_window_hours: 720
          exchange_fee_cents: 300
          exchange_allowed: true
        as: OpsManager
        captures:
          prod_id: $.data.id
          prod_v: $.data.version
      - call: POST /productions/${prod_id}/status-transitions
        payload:
          to_status: ACTIVE
          expected_production_version: ${prod_v}
        as: OpsManager
        captures:
          prod_v: $.data.version
      - call: POST /performances
        payload:
          production_id: ${prod_id}
          market_code: NYC
          venue_name: Queue Theatre
          starts_at: '2026-10-05T19:00:00Z'
          face_value_cents: 10000
          total_seat_capacity: 30
        as: OpsManager
        captures:
          perf_id: $.data.id
          perf_v: $.data.version
      - call: POST /performances/${perf_id}/status-transitions
        payload:
          to_status: ONSALE
          expected_performance_version: ${perf_v}
        as: OpsManager
        captures:
          perf_v: $.data.version
      - call: POST /performances/${perf_id}/allocations
        payload:
          ticket_type: RUSH
          daily_quantity: 5
          discount_pct: 0.5
          release_time_local: 09:00
          refundable: true
          per_order_limit: 2
        as: AllocationsCoordinator
        captures:
          alloc_id: $.data.id
          alloc_v: $.data.version
      - call: POST /allocations/${alloc_id}/scheduling
        payload:
          expected_allocation_version: ${alloc_v}
        as: AllocationsCoordinator
        captures:
          alloc_v: $.data.version
      - call: POST /allocations/${alloc_id}/releases/2026-09-12
        payload:
          expected_production_version: ${prod_v}
          expected_performance_version: ${perf_v}
          expected_allocation_version: ${alloc_v}
        as: OpsManager
        captures:
          alloc_v: $.data.version
      - call: POST /patrons/registrations
        payload:
          email: queue_once@x.com
          display_name: Queue Once
          market_code: NYC
        as: Anonymous
        captures:
          pat_id: $.data.id
          patron_v: $.data.version
      - call: POST /performances/${perf_id}/queue-positions
        payload:
          allocation_id: ${alloc_id}
        as: Patron
        as_user_id: ${pat_id}
        captures:
          qp_id: $.data.id
      trigger:
      - call: POST /performances/${perf_id}/queue-positions
        payload:
          allocation_id: ${alloc_id}
        as: Patron
        as_user_id: ${pat_id}
        captures:
          err: $.data.error_id
      assert:
      - the response status is 409
      - the response reported ${err} == ERR_QUEUE_POSITION_EXISTS
      - GET /performances/${perf_id}/queue-positions?patron_id=${pat_id} still returns exactly 1 row
      - QueuePosition.${qp_id}.status == WAITING, unchanged by the rejected attempt
- section: calculations
  instances:
  - name: queue_rank_admits_half_the_released_cap_rounded_up
    claim_type: Correct Result
    grounds:
    - calculations.queue_rank
    - constants.QUOTA_DENOMINATOR
    - state_machines.QueuePosition.WAITING_to_ADMITTED
    distinguishing_aspect: "queue_rank admits ceil(daily_release_cap / 2) waiting positions, so a released cap of 5 admits exactly 3 \u2014 the proportional term is computed with ceil, not floor, and the ranked order is the join order rather than any id order."
    test_recipe:
      setup:
      - Logical clock at 2026-09-12T09:00:00Z. A MOBILE_PUSH market, an ACTIVE production, an ONSALE performance and a released RUSH allocation whose daily_release_cap is 5.
      - Four patrons hold WAITING queue positions, joined in the order q1, q2, q3, q4.
      setup_api_calls:
      - *id001
      - call: POST /markets
        payload:
          market_code: NYC
          city: New York
          handoff_model: MOBILE_PUSH
        as: PlatformAdmin
        captures:
          nyc_id: $.data.id
          mkt_v: $.data.version
      - call: POST /productions
        payload:
          title: Corner Play
          producer_org: Corner Partners
          refund_window_hours: 720
          exchange_fee_cents: 300
          exchange_allowed: true
        as: OpsManager
        captures:
          prod_id: $.data.id
          prod_v: $.data.version
      - call: POST /productions/${prod_id}/status-transitions
        payload:
          to_status: ACTIVE
          expected_production_version: ${prod_v}
        as: OpsManager
        captures:
          prod_v: $.data.version
      - call: POST /performances
        payload:
          production_id: ${prod_id}
          market_code: NYC
          venue_name: Quota Theatre
          starts_at: '2026-10-05T19:00:00Z'
          face_value_cents: 10000
          total_seat_capacity: 30
        as: OpsManager
        captures:
          perf_id: $.data.id
          perf_v: $.data.version
      - call: POST /performances/${perf_id}/status-transitions
        payload:
          to_status: ONSALE
          expected_performance_version: ${perf_v}
        as: OpsManager
        captures:
          perf_v: $.data.version
      - call: POST /performances/${perf_id}/allocations
        payload:
          ticket_type: RUSH
          daily_quantity: 5
          discount_pct: 0.5
          release_time_local: 09:00
          refundable: true
          per_order_limit: 2
        as: AllocationsCoordinator
        captures:
          alloc_id: $.data.id
          alloc_v: $.data.version
      - call: POST /allocations/${alloc_id}/scheduling
        payload:
          expected_allocation_version: ${alloc_v}
        as: AllocationsCoordinator
        captures:
          alloc_v: $.data.version
      - call: POST /allocations/${alloc_id}/releases/2026-09-12
        payload:
          expected_production_version: ${prod_v}
          expected_performance_version: ${perf_v}
          expected_allocation_version: ${alloc_v}
        as: OpsManager
        captures:
          alloc_v: $.data.version
      - call: POST /patrons/registrations
        payload:
          email: q1@x.com
          display_name: Q One
          market_code: NYC
        as: Anonymous
        captures:
          q1u: $.data.id
          patron_v: $.data.version
      - call: POST /patrons/registrations
        payload:
          email: q2@x.com
          display_name: Q Two
          market_code: NYC
        as: Anonymous
        captures:
          q2u: $.data.id
          patron_v: $.data.version
      - call: POST /patrons/registrations
        payload:
          email: q3@x.com
          display_name: Q Three
          market_code: NYC
        as: Anonymous
        captures:
          q3u: $.data.id
          patron_v: $.data.version
      - call: POST /patrons/registrations
        payload:
          email: q4@x.com
          display_name: Q Four
          market_code: NYC
        as: Anonymous
        captures:
          q4u: $.data.id
          patron_v: $.data.version
      - call: POST /performances/${perf_id}/queue-positions
        payload:
          allocation_id: ${alloc_id}
        as: Patron
        as_user_id: ${q1u}
        captures:
          pos1: $.data.id
      - call: POST /performances/${perf_id}/queue-positions
        payload:
          allocation_id: ${alloc_id}
        as: Patron
        as_user_id: ${q2u}
        captures:
          pos2: $.data.id
      - call: POST /performances/${perf_id}/queue-positions
        payload:
          allocation_id: ${alloc_id}
        as: Patron
        as_user_id: ${q3u}
        captures:
          pos3: $.data.id
      - call: POST /performances/${perf_id}/queue-positions
        payload:
          allocation_id: ${alloc_id}
        as: Patron
        as_user_id: ${q4u}
        captures:
          pos4: $.data.id
      trigger:
      - call: POST /ops-runs
        payload:
          as_of_iso8601: '2026-09-12T09:05:00Z'
        as: PlatformAdmin
        captures:
          issued: $.data.admissions_issued_count
      assert:
      - the ops run reported ${issued} == 3 admissions, which is ceil(5 / 2)
      - QueuePosition.${pos1}.status == ADMITTED and QueuePosition.${pos2}.status == ADMITTED and QueuePosition.${pos3}.status == ADMITTED
      - QueuePosition.${pos4}.status == WAITING, since the fourth position falls outside the quota
      - the admitted set is the three earliest joins, so the ranking key is joined_at rather than any identifier
  - name: refund_amount_non_refundable_allocation_inside_window_is_zero
    claim_type: Constants Applied
    grounds:
    - calculations.refund_amount
    - constants.REFUND_PROCESSING_FEE_CENTS
    - entities.RushAllocation.fields.refundable
    distinguishing_aspect: A non-refundable allocation whose performance is inside the production's refund window prices the refund at 0, and the max(0, base - fee) clamp keeps it at 0 rather than going negative once the 200 cent processing fee is subtracted.
    test_recipe:
      setup:
      - Logical clock at 2026-09-12T09:00:00Z. A MOBILE_PUSH market, an ACTIVE production with refund_window_hours 720, and an ONSALE performance starting 2026-09-12T20:00:00Z so only 11 hours remain, well inside the window.
      - A released RUSH allocation with refundable false, holding a settled two-ticket purchase.
      setup_api_calls:
      - *id001
      - call: POST /markets
        payload:
          market_code: NYC
          city: New York
          handoff_model: MOBILE_PUSH
        as: PlatformAdmin
        captures:
          nyc_id: $.data.id
          mkt_v: $.data.version
      - call: POST /productions
        payload:
          title: Corner Play
          producer_org: Corner Partners
          refund_window_hours: 720
          exchange_fee_cents: 300
          exchange_allowed: true
        as: OpsManager
        captures:
          prod_id: $.data.id
          prod_v: $.data.version
      - call: POST /productions/${prod_id}/status-transitions
        payload:
          to_status: ACTIVE
          expected_production_version: ${prod_v}
        as: OpsManager
        captures:
          prod_v: $.data.version
      - call: POST /performances
        payload:
          production_id: ${prod_id}
          market_code: NYC
          venue_name: Window Theatre
          starts_at: '2026-09-12T20:00:00Z'
          face_value_cents: 10000
          total_seat_capacity: 30
        as: OpsManager
        captures:
          perf_id: $.data.id
          perf_v: $.data.version
      - call: POST /performances/${perf_id}/status-transitions
        payload:
          to_status: ONSALE
          expected_performance_version: ${perf_v}
        as: OpsManager
        captures:
          perf_v: $.data.version
      - call: POST /performances/${perf_id}/allocations
        payload:
          ticket_type: RUSH
          daily_quantity: 6
          discount_pct: 0.5
          release_time_local: 09:00
          refundable: false
          per_order_limit: 2
        as: AllocationsCoordinator
        captures:
          alloc_id: $.data.id
          alloc_v: $.data.version
      - call: POST /allocations/${alloc_id}/scheduling
