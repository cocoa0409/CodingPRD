          approve-credit is called by a CreditManager on an order still in DRAFT (credit_status not PENDING -> state
          fails, priority 7 ERR_INVALID_STATE) whose Customer is also on CREDIT_HOLD (priority 12 ERR_CUSTOMER_ON_CREDIT_HOLD);
          state (7) outranks safety (12). Category pair state vs business_safety — distinct from the auth/state instance.
