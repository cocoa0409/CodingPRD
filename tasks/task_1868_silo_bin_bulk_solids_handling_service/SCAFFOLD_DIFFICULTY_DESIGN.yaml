# =============================================================================
# Task 1868 — Silo, Bin & Bulk-Solids Handling Service
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: reorder_target_fill_vs_days_of_cover
        grounds:
          - calculations.reorder_quantity
          - entities.Vessel.fields.replenishment_policy
          - entities.ReplenishmentOrder.fields.order_quantity_tons
        distinguishing_aspect: |
          Two replenishment-policy variants on the SAME inventory data produce
          different order quantities (inventory domain): TARGET_FILL yields
          65.0 t while DAYS_OF_COVER yields 5.0 t for vessels at identical
          25 pct level, 100 t capacity, 90 pct target / 10 cover-days x 3.0 t/day.
        test_recipe:
          setup:
            - "Site S1 (defaults). Vessel VA: capacity 100, reorder_point_pct 30, target_fill_pct 90, policy TARGET_FILL. Vessel VB: capacity 100, reorder_point_pct 30, policy DAYS_OF_COVER, cover_days 10, default_usage_tons 3.0."
            - "Both vessels report level_pct 25.0; each auto-creates a TRIGGERED order."
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Site One", state_code: "IA" }
              as: ServiceManager
              captures: { s1: $.data.id }
            - call: "POST /vessels"
              payload: { site_id: "${s1}", name: "SILO-A", vessel_kind: "SILO", capacity_tons: 100, material_name: "cement", reorder_point_pct: 30, target_fill_pct: 90, replenishment_policy: "TARGET_FILL" }
              as: ServiceManager
              captures: { va: $.data.id }
            - call: "POST /vessels"
              payload: { site_id: "${s1}", name: "BIN-B", vessel_kind: "BIN", capacity_tons: 100, material_name: "cement", reorder_point_pct: 30, replenishment_policy: "DAYS_OF_COVER", cover_days: 10, default_usage_tons: 3.0 }
              as: ServiceManager
              captures: { vb: $.data.id }
            - call: "POST /level-readings"
              payload: { vessel_id: "${va}", measured_at: "2026-08-02T00:00:00Z", level_pct: 25.0 }
              as: PlantOperator
              as_user_id: "${s1}"
            - call: "POST /level-readings"
              payload: { vessel_id: "${vb}", measured_at: "2026-08-02T00:00:00Z", level_pct: 25.0 }
              as: PlantOperator
              as_user_id: "${s1}"
          trigger:
            - call: "GET /replenishment-orders"
              payload: { vessel_id: "${va}", status: "TRIGGERED" }
              as: ServiceManager
              captures: { qa: "$.data[0].order_quantity_tons" }
            - call: "GET /replenishment-orders"
              payload: { vessel_id: "${vb}", status: "TRIGGERED" }
              as: ServiceManager
              captures: { qb: "$.data[0].order_quantity_tons" }
          assert:
            - "VA order order_quantity_tons == 65.0 (90 pct of 100 t minus 25.0 t)"
            - "VB order order_quantity_tons == 5.0 (10 days x 3.0 t/day minus 25.0 t)"
            - "VA order policy_used == TARGET_FILL and VB order policy_used == DAYS_OF_COVER"
            - "65.0 != 5.0 — identical inventory, different variant, different quantity"

      - name: calibration_of_reading_vs_full_scale
        grounds:
          - calculations.calibration_error_pct
          - entities.Vessel.fields.error_basis
          - entities.ScaleCalibration.fields.result
        distinguishing_aspect: |
          Two calibration error bases on the SAME weights produce different
          error percentages and opposite verdicts (metrology domain, distinct
          from the inventory domain of reorder_target_fill_vs_days_of_cover):
          OF_READING yields 0.300 pct FAIL while OF_FULL_SCALE yields 0.060 pct
          PASS for test 20.000 t / indicated 20.060 t / full scale 100 t.
        test_recipe:
          setup:
            - "Site S2. Vessel VC error_basis OF_READING; vessel VD error_basis OF_FULL_SCALE with full_scale_tons 100."
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Site Two", state_code: "IA" }
              as: ServiceManager
              captures: { s2: $.data.id }
            - call: "POST /vessels"
              payload: { site_id: "${s2}", name: "SILO-C", vessel_kind: "SILO", capacity_tons: 100, material_name: "flour", reorder_point_pct: 30, error_basis: "OF_READING" }
              as: ServiceManager
              captures: { vc: $.data.id }
            - call: "POST /vessels"
              payload: { site_id: "${s2}", name: "SILO-D", vessel_kind: "SILO", capacity_tons: 100, material_name: "flour", reorder_point_pct: 30, error_basis: "OF_FULL_SCALE", full_scale_tons: 100 }
              as: ServiceManager
              captures: { vd: $.data.id }
            - call: "POST /technicians"
              payload: { name: "Tech Cal One", weekly_capacity_hours: 40 }
              as: ServiceManager
              captures: { ttc: $.data.id }
          trigger:
            - call: "POST /scale-calibrations"
              payload: { vessel_id: "${vc}", tested_at: "2026-08-02T00:00:00Z", test_weight_tons: 20.0, indicated_tons: 20.06 }
              as: Technician
              as_user_id: "${ttc}"
              captures: { ec: $.data.error_pct, rc: $.data.result }
            - call: "POST /scale-calibrations"
              payload: { vessel_id: "${vd}", tested_at: "2026-08-02T00:00:00Z", test_weight_tons: 20.0, indicated_tons: 20.06 }
              as: Technician
              as_user_id: "${ttc}"
              captures: { ed: $.data.error_pct, rd: $.data.result }
          assert:
            - "VC calibration error_pct == 0.300 and result == FAIL (0.06/20.0 x 100 = 0.300 > 0.25)"
            - "VD calibration error_pct == 0.060 and result == PASS (0.06/100 x 100 = 0.060 <= 0.25)"
            - "GET /vessels/${vc} shows scale_status == OUT_OF_TOLERANCE; GET /vessels/${vd} shows scale_status == IN_TOLERANCE"
            - "Same weights, different variant: 0.300 != 0.060 and FAIL != PASS"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: estimate_tiered_rate_crew_posture_discount
        grounds:
          - calculations.service_estimate_cents
          - entities.ServiceTicket.fields.estimate_cents
          - entities.ServiceTicket.fields.commercial_track
        distinguishing_aspect: |
          Mode (a) combinatorial formula with >= 3 inputs and non-linear
          interaction: tiered per-job-type rate table x est_hours x crew_size,
          a conditional 1.5x emergency multiplier keyed on vessel flow_posture,
          and a site discount. CLEANOUT 8 h x crew 2 on a NORMAL vessel with
          10 pct discount pins estimate_cents == 208800.
        test_recipe:
          setup:
            - "Site S3 with contract_discount_pct 10 and capital_threshold_cents 500000. Vessel VE in NORMAL posture."
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Site Three", state_code: "IL", contract_discount_pct: 10, capital_threshold_cents: 500000 }
              as: ServiceManager
              captures: { s3: $.data.id }
            - call: "POST /vessels"
              payload: { site_id: "${s3}", name: "BIN-E", vessel_kind: "BIN", capacity_tons: 100, material_name: "pellets", reorder_point_pct: 30 }
              as: ServiceManager
              captures: { ve: $.data.id }
          trigger:
            - call: "POST /service-tickets"
              payload: { site_id: "${s3}", vessel_id: "${ve}", job_type: "CLEANOUT", requires_entry: false, est_hours: 8, crew_size: 2 }
              as: ServiceManager
              captures: { t3: $.data.id, est3: $.data.estimate_cents }
            - call: "POST /service-tickets/${t3}/quote"
              payload: {}
              as: ServiceManager
              captures: { track3: $.data.commercial_track }
          assert:
            - "estimate_cents == 208800 (14500 x 8 x 2 = 232000; x 1.0 NORMAL; discount round(232000 x 0.10) = 23200; 232000 - 23200 = 208800)"
            - "commercial_track == CONTRACT_SERVICE (208800 < 500000)"

      - name: invoice_per_line_rounding_then_sum
        grounds:
          - calculations.invoice_total_cents
          - entities.ServiceTicket.fields.invoice_total_cents
        distinguishing_aspect: |
          Mode (b) nested rounding where order matters (distinct from mode (a)
          above): the scaffold pins round-per-line-then-sum-then-discount-then-tax.
          Completion inputs 7.5 h / 12 mi / 1.25 t yield invoice_total_cents ==
          215649, whereas the non-conformant sum-then-round order yields 215650.
        test_recipe:
          setup:
            - "Site S4 discount 10, threshold 500000. Vessel VF NORMAL. Technician TT1 capacity 40. CLEANOUT ticket crew 2 approved and scheduled, then started."
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Site Four", state_code: "IL", contract_discount_pct: 10, capital_threshold_cents: 500000 }
              as: ServiceManager
              captures: { s4: $.data.id }
            - call: "POST /vessels"
              payload: { site_id: "${s4}", name: "BIN-F", vessel_kind: "BIN", capacity_tons: 100, material_name: "pellets", reorder_point_pct: 30 }
              as: ServiceManager
              captures: { vf: $.data.id }
            - call: "POST /technicians"
              payload: { name: "Tech One", weekly_capacity_hours: 40 }
              as: ServiceManager
              captures: { tt1: $.data.id }
            - call: "POST /service-tickets"
              payload: { site_id: "${s4}", vessel_id: "${vf}", job_type: "CLEANOUT", requires_entry: false, est_hours: 8, crew_size: 2 }
              as: ServiceManager
              captures: { t4: $.data.id }
            - call: "POST /service-tickets/${t4}/quote"
              payload: {}
              as: ServiceManager
            - call: "POST /service-tickets/${t4}/approve"
              payload: {}
              as: PlantOperator
              as_user_id: "${s4}"
            - call: "POST /service-tickets/${t4}/schedule"
              payload: { technician_id: "${tt1}", window_start: "2026-08-10T09:00:00Z", window_end: "2026-08-10T17:00:00Z" }
              as: ServiceManager
            - call: "POST /service-tickets/${t4}/start"
              payload: {}
              as: Technician
              as_user_id: "${tt1}"
          trigger:
            - call: "POST /service-tickets/${t4}/complete"
              payload: { actual_hours: 7.5, mileage_miles: 12, disposal_tons: 1.25 }
              as: Technician
              as_user_id: "${tt1}"
              captures: { tot4: $.data.invoice_total_cents }
          assert:
            - "invoice_labor_cents == 217500 (7.5 x 14500 x 2)"
            - "invoice_mobilization_cents == 3980 (12 x 331.7 = 3980.4, per-line round_half_up)"
            - "invoice_disposal_cents == 4567 (1.25 x 3653.92 = 4567.40)"
            - "invoice_subtotal_cents == 226047 (per-line rounded sum; raw sum 226047.8 would round to 226048)"
            - "invoice_discount_cents == 22605 (round_half_up(226047 x 0.10) = round_half_up(22604.7))"
            - "invoice_tax_cents == 12207 (round_half_up(203442 x 0.06) = round_half_up(12206.52))"
            - "invoice_total_cents == 215649 (not 215650, the sum-then-round result)"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: ticket_hold_resume_cycle_via_permit_suspension
        grounds:
          - state_machines.ServiceTicket.IN_PROGRESS_to_ON_HOLD
          - state_machines.ServiceTicket.ON_HOLD_to_IN_PROGRESS
          - state_machines.EntryPermit.ACTIVE_to_SUSPENDED
        distinguishing_aspect: |
          ServiceTicket carries a non-linear cycle IN_PROGRESS -> ON_HOLD ->
          IN_PROGRESS driven entirely by cascades from a different entity
          (EntryPermit); a purely linear pipeline could not express this.
        test_recipe:
          setup:
            - "Site S5. Vessel VG. Technician TT2. CLEANOUT ticket requires_entry true, APPROVED, SCHEDULED 2026-08-10 08:00-12:00. EntryPermit for the ticket with the same window, ISSUED then ACTIVATED. Ticket started (IN_PROGRESS)."
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Site Five", state_code: "IL" }
              as: ServiceManager
              captures: { s5: $.data.id }
            - call: "POST /vessels"
              payload: { site_id: "${s5}", name: "SILO-G", vessel_kind: "SILO", capacity_tons: 100, material_name: "grain", reorder_point_pct: 30 }
              as: ServiceManager
              captures: { vg: $.data.id }
            - call: "POST /technicians"
              payload: { name: "Tech Two", weekly_capacity_hours: 40 }
              as: ServiceManager
              captures: { tt2: $.data.id }
            - call: "POST /service-tickets"
              payload: { site_id: "${s5}", vessel_id: "${vg}", job_type: "CLEANOUT", requires_entry: true, est_hours: 4, crew_size: 1 }
              as: ServiceManager
              captures: { t5: $.data.id }
            - call: "POST /service-tickets/${t5}/quote"
              payload: {}
              as: ServiceManager
            - call: "POST /service-tickets/${t5}/approve"
              payload: {}
              as: PlantOperator
              as_user_id: "${s5}"
            - call: "POST /service-tickets/${t5}/schedule"
              payload: { technician_id: "${tt2}", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-10T12:00:00Z" }
              as: ServiceManager
            - call: "POST /entry-permits"
              payload: { vessel_id: "${vg}", ticket_id: "${t5}", entrant_technician_id: "${tt2}", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-10T12:00:00Z" }
              as: SafetyOfficer
              captures: { p5: $.data.id }
            - call: "POST /entry-permits/${p5}/issue"
              payload: { lockout_checklist_confirmed: true }
              as: SafetyOfficer
            - call: "POST /entry-permits/${p5}/activate"
              payload: { oxygen_pct: 20.9, combustible_pct: 2.0 }
              as: SafetyOfficer
            - call: "POST /service-tickets/${t5}/start"
              payload: {}
              as: Technician
              as_user_id: "${tt2}"
          trigger:
            - call: "POST /entry-permits/${p5}/atmosphere-check"
              payload: { oxygen_pct: 18.0, combustible_pct: 2.0 }
              as: Technician
              as_user_id: "${tt2}"
            - call: "POST /entry-permits/${p5}/resume"
              payload: { oxygen_pct: 20.9, combustible_pct: 1.0 }
              as: SafetyOfficer
          assert:
            - "After failing check: permit ${p5} status == SUSPENDED and atmosphere_ok == false"
            - "After failing check: ticket ${t5} status == ON_HOLD (cascade)"
            - "After resume: permit ${p5} status == ACTIVE and atmosphere_ok == true"
            - "After resume: ticket ${t5} status == IN_PROGRESS (cascade) — cycle completed"

      - name: permit_suspend_resume_repeatable_cycle_then_close
        grounds:
          - state_machines.EntryPermit.ACTIVE_to_SUSPENDED
          - state_machines.EntryPermit.SUSPENDED_to_ACTIVE
          - state_machines.EntryPermit.ACTIVE_to_CLOSED
        distinguishing_aspect: |
          EntryPermit (a different entity than ServiceTicket in the sibling
          instance) loops ACTIVE -> SUSPENDED -> ACTIVE twice before reaching
          CLOSED, proving the cycle is repeatable rather than a one-way branch.
        test_recipe:
          setup:
            - "Site S6. Vessel VH. Technician TT3. DIAGNOSIS ticket requires_entry true, APPROVED (unscheduled). Permit created, issued, activated."
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Site Six", state_code: "IL" }
              as: ServiceManager
              captures: { s6: $.data.id }
            - call: "POST /vessels"
              payload: { site_id: "${s6}", name: "BIN-H", vessel_kind: "BIN", capacity_tons: 80, material_name: "sand", reorder_point_pct: 30 }
              as: ServiceManager
              captures: { vh: $.data.id }
            - call: "POST /technicians"
              payload: { name: "Tech Three", weekly_capacity_hours: 40 }
              as: ServiceManager
              captures: { tt3: $.data.id }
            - call: "POST /service-tickets"
              payload: { site_id: "${s6}", vessel_id: "${vh}", job_type: "DIAGNOSIS", requires_entry: true, est_hours: 4, crew_size: 1 }
              as: ServiceManager
              captures: { t6: $.data.id }
            - call: "POST /service-tickets/${t6}/quote"
              payload: {}
              as: ServiceManager
            - call: "POST /service-tickets/${t6}/approve"
              payload: {}
              as: PlantOperator
              as_user_id: "${s6}"
            - call: "POST /entry-permits"
              payload: { vessel_id: "${vh}", ticket_id: "${t6}", entrant_technician_id: "${tt3}", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-10T10:00:00Z" }
              as: SafetyOfficer
              captures: { p6: $.data.id }
            - call: "POST /entry-permits/${p6}/issue"
              payload: { lockout_checklist_confirmed: true }
              as: SafetyOfficer
            - call: "POST /entry-permits/${p6}/activate"
              payload: { oxygen_pct: 20.9, combustible_pct: 0.0 }
              as: SafetyOfficer
          trigger:
            - call: "POST /entry-permits/${p6}/atmosphere-check"
              payload: { oxygen_pct: 24.0, combustible_pct: 0.0 }
              as: SafetyOfficer
            - call: "POST /entry-permits/${p6}/resume"
              payload: { oxygen_pct: 20.5, combustible_pct: 0.0 }
              as: SafetyOfficer
            - call: "POST /entry-permits/${p6}/atmosphere-check"
              payload: { oxygen_pct: 20.9, combustible_pct: 15.0 }
              as: SafetyOfficer
            - call: "POST /entry-permits/${p6}/resume"
              payload: { oxygen_pct: 20.9, combustible_pct: 5.0 }
              as: SafetyOfficer
            - call: "POST /entry-permits/${p6}/close"
              payload: { findings: "NONE" }
              as: SafetyOfficer
          assert:
            - "First check (oxygen 24.0 > 23.5) -> SUSPENDED; first resume -> ACTIVE"
            - "Second check (combustible 15.0 > 10.0) -> SUSPENDED; second resume -> ACTIVE — cycle repeats"
            - "close from ACTIVE -> CLOSED with findings NONE"
            - "GET /service-tickets?source_permit_id=${p6} returns total_count == 0 (no findings, no auto DIAGNOSIS ticket)"
            - "Ticket ${t6} status remains APPROVED throughout (cascade only touches IN_PROGRESS/ON_HOLD tickets)"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: reading_order_vessel_site_cascade
        grounds:
          - state_machines.ReplenishmentOrder.TRIGGERED (initial)
          - calculations.flow_posture_derivation
          - entities.CustomerSite.fields.site_posture
        distinguishing_aspect: |
          Depth-3 cascade originating at LevelReading creation: the reading
          auto-creates a ReplenishmentOrder; the order's existence recomputes
          Vessel.flow_posture to PENDING_REPLENISHMENT; the vessel mutation
          recomputes CustomerSite.site_posture to ATTENTION. Each link is
          caused by the previous link, not by the original POST.
        test_recipe:
          setup:
            - "Site S7 (posture NORMAL). Vessel VI capacity 100, reorder_point_pct 30, target_fill_pct 90, policy TARGET_FILL."
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Site Seven", state_code: "MO" }
              as: ServiceManager
              captures: { s7: $.data.id }
            - call: "POST /vessels"
              payload: { site_id: "${s7}", name: "SILO-I", vessel_kind: "SILO", capacity_tons: 100, material_name: "cement", reorder_point_pct: 30, target_fill_pct: 90 }
              as: ServiceManager
              captures: { vi: $.data.id }
          trigger:
            - call: "POST /level-readings"
              payload: { vessel_id: "${vi}", measured_at: "2026-08-02T00:00:00Z", level_pct: 25.0 }
              as: PlantOperator
              as_user_id: "${s7}"
              captures: { r7: $.data.id }
          assert:
            - "GET /replenishment-orders?vessel_id=${vi}&status=TRIGGERED returns total_count == 1 with order_quantity_tons == 65.0 and trigger_reading_id == ${r7} (link 1)"
            - "GET /vessels/${vi} shows flow_posture == PENDING_REPLENISHMENT (link 2)"
            - "GET /sites/${s7} shows site_posture == ATTENTION (link 3)"

      - name: quality_breach_posture_permit_void_cascade
        grounds:
          - state_machines.EntryPermit.DRAFT_to_VOIDED
          - state_machines.EntryPermit.ISSUED_to_VOIDED
          - calculations.flow_posture_derivation
        distinguishing_aspect: |
          Depth-2 cascade originating at a DIFFERENT trigger (MaterialQualityReport
          creation, not a level reading): the report mutates Vessel.flow_posture
          to FLOW_IMPAIRED; that posture mutation auto-voids the vessel's DRAFT
          EntryPermit with void_reason AUTO_QUALITY_HAZARD and lifts
          site_posture to CRITICAL.
        test_recipe:
          setup:
            - "Site S8. Vessel VJ moisture_limit_pct 12.0. Technician TT4. Entry-requiring ticket APPROVED. EntryPermit P8 in DRAFT (window 2026-08-10 08:00-10:00)."
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Site Eight", state_code: "MO" }
              as: ServiceManager
              captures: { s8: $.data.id }
            - call: "POST /vessels"
              payload: { site_id: "${s8}", name: "BIN-J", vessel_kind: "BIN", capacity_tons: 60, material_name: "sugar", reorder_point_pct: 30, moisture_limit_pct: 12.0 }
              as: ServiceManager
              captures: { vj: $.data.id }
            - call: "POST /technicians"
              payload: { name: "Tech Four", weekly_capacity_hours: 40 }
              as: ServiceManager
              captures: { tt4: $.data.id }
            - call: "POST /service-tickets"
              payload: { site_id: "${s8}", vessel_id: "${vj}", job_type: "CLEANOUT", requires_entry: true, est_hours: 4, crew_size: 1 }
              as: ServiceManager
              captures: { t8: $.data.id }
            - call: "POST /service-tickets/${t8}/quote"
              payload: {}
              as: ServiceManager
            - call: "POST /service-tickets/${t8}/approve"
              payload: {}
              as: PlantOperator
              as_user_id: "${s8}"
            - call: "POST /entry-permits"
              payload: { vessel_id: "${vj}", ticket_id: "${t8}", entrant_technician_id: "${tt4}", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-10T10:00:00Z" }
              as: SafetyOfficer
              captures: { p8: $.data.id }
          trigger:
            - call: "POST /quality-reports"
              payload: { vessel_id: "${vj}", sampled_at: "2026-08-02T00:00:00Z", moisture_pct: 15.0, caking_index: 2 }
              as: Technician
              as_user_id: "${tt4}"
          assert:
            - "GET /vessels/${vj} shows flow_posture == FLOW_IMPAIRED (15.0 > 12.0)"
            - "GET /entry-permits/${p8} shows status == VOIDED and void_reason == AUTO_QUALITY_HAZARD (cascade link 2)"
            - "GET /sites/${s8} shows site_posture == CRITICAL"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: activate_draft_permit_state_error_beats_safety_error
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - errors[ERR_INVALID_PERMIT_STATE]
          - errors[ERR_ATMOSPHERE_UNSAFE]
        distinguishing_aspect: |
          Error-category pair state vs business_safety: activating a DRAFT
          permit with fatally bad atmosphere values (oxygen 18.0) violates both
          rule 6 and rule 7; the state error ERR_INVALID_PERMIT_STATE (priority
          6) MUST win over ERR_ATMOSPHERE_UNSAFE (priority 7).
        test_recipe:
          setup:
            - "Site S9. Vessel VK. Technician TT5. Entry-requiring ticket APPROVED. Permit P9 in DRAFT."
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Site Nine", state_code: "MO" }
              as: ServiceManager
              captures: { s9: $.data.id }
            - call: "POST /vessels"
              payload: { site_id: "${s9}", name: "HOP-K", vessel_kind: "HOPPER", capacity_tons: 40, material_name: "lime", reorder_point_pct: 30 }
              as: ServiceManager
              captures: { vk: $.data.id }
            - call: "POST /technicians"
