              payload: { action: "REQUEST_NDA" }
              as: AccountExecutive
              as_user_id: "ae-1"
          trigger:
            - call: "POST /soc/report-distributions/${d}/transitions"
              payload: { action: "APPROVE", nda_reference: "NDA-0002" }
              as: AccountExecutive
              as_user_id: "ae-1"
              captures: { err: $.data.error_id }
            - call: "POST /soc/report-distributions/${d}/transitions"
              payload: { action: "APPROVE", nda_reference: "NDA-0002" }
              as: ComplianceLead
              as_user_id: "cl-1"
          assert:
            - "${err} == ERR_ROLE_NOT_PERMITTED with HTTP status 403"
            - "ReportDistribution.${d}.status == APPROVED after the ComplianceLead call"
            - "ReportDistribution.${d}.nda_reference == NDA-0002"

  - section: cross_cutting_complexity_layers
    instances:
      - name: corner_occ_stale_engagement_version_rejects_second_description
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[system-description-create-stale-engagement]", "validations[priority=90]", "errors[ERR_STALE_ENGAGEMENT_VERSION]"]
        distinguishing_aspect: "Two strictly sequential creates: the first carries the observed engagement version and succeeds (bumping Engagement.version), the second still carries that now-stale value and is rejected with 412 ERR_STALE_ENGAGEMENT_VERSION; re-reading the engagement and retrying succeeds."
        test_recipe:
          setup:
            - "One engagement in SCOPING with version 1 and no SystemDescription rows."
          setup_api_calls:
            - call: "POST /soc/engagements"
              payload: { client_name: "Stale View", report_type: "SOC_2_TYPE_2", observation_period_start: "2026-09-01T00:00:00.000Z", observation_period_end: "2026-11-30T00:00:00.000Z", required_criteria_categories: ["SECURITY"] }
