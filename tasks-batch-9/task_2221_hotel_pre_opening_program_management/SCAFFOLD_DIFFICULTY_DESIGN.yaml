scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: schedule_variant_divergence_after_milestone_rework
        grounds:
          - calculations.critical_path_schedule
          - entities.PreOpeningProgram.fields.projected_opening_date_optimistic
          - entities.PreOpeningProgram.fields.projected_opening_date_committed
          - entities.PreOpeningProgram.fields.schedule_slip_days
          - entities.Milestone.fields.rework_count
          - state_machines.Milestone.COMPLETE_to_REOPENED
        distinguishing_aspect: |
          This dual variant operates on the Milestone/schedule domain and its output is a DATE:
          from identical stored rows the OPTIMISTIC variant returns projected_opening_date_optimistic
          2027-02-22 while the COMMITTED variant returns 2027-02-25, because only COMMITTED inserts
          program.rework_buffer_days after the reworked predecessor M1.
        test_recipe:
          setup:
            - "Program 'Harbor Crest Hotel' with construction_start_date 2026-09-01, target_opening_date 2027-02-01, licensing_buffer_days 14, rework_buffer_days 3, slip_tolerance_days 10."
            - "Three milestones chained M1 -> M2 (FINISH_START, lag 0) -> M3 (FINISH_START, lag 5), durations 90 / 30 / 25."
            - "Schedule baselined, then M1 run to COMPLETE (actual 2026-09-01..2026-12-05), reopened for rework, restarted and completed again (actual 2026-12-05..2026-12-10), so M1.rework_count == 1 and M1.actual_duration_days == 5."
            - "M2 and M3 are still NOT_STARTED with blocked_days_accrued 0."
          setup_api_calls:
            - call: "POST /pre-opening/programs"
              payload: { property_name: "Harbor Crest Hotel", brand_code: "HRC", room_count: 180, construction_start_date: "2026-09-01", target_opening_date: "2027-02-01", storage_capacity_pallets: 120, relocation_rate_cents: 25000, guarantee_penalty_cents: 150000, room_night_ceiling: 500, contingency_liability_cap_cents: 90000000, licensing_buffer_days: 14, rework_buffer_days: 3, slip_tolerance_days: 10 }
              as: ProgramDirector
              captures: { prog_a_id: "$.data.id" }
            - call: "POST /pre-opening/milestones"
              payload: { program_id: "${prog_a_id}", code: "CONSTRUCTION_COMPLETE", name: "Construction complete", duration_days: 90, planned_start_date: "2026-09-01" }
              as: ConstructionManager
              captures: { m_a1_id: "$.data.id" }
            - call: "POST /pre-opening/milestones"
              payload: { program_id: "${prog_a_id}", code: "CO_ISSUANCE", name: "Certificate of occupancy issuance", duration_days: 30, planned_start_date: "2026-12-01" }
              as: ConstructionManager
              captures: { m_a2_id: "$.data.id" }
            - call: "POST /pre-opening/milestones"
              payload: { program_id: "${prog_a_id}", code: "SYSTEMS_CUTOVER", name: "Systems cutover", duration_days: 25, planned_start_date: "2027-01-05" }
              as: ConstructionManager
              captures: { m_a3_id: "$.data.id" }
            - call: "POST /pre-opening/milestone-dependencies"
              payload: { predecessor_milestone_id: "${m_a1_id}", successor_milestone_id: "${m_a2_id}", dependency_type: "FINISH_START", lag_days: 0 }
              as: ConstructionManager
            - call: "POST /pre-opening/milestone-dependencies"
              payload: { predecessor_milestone_id: "${m_a2_id}", successor_milestone_id: "${m_a3_id}", dependency_type: "FINISH_START", lag_days: 5 }
              as: ConstructionManager
            - call: "POST /pre-opening/programs/${prog_a_id}/baseline-schedule"
              payload: {}
              as: ProgramDirector
              as_user_id: "pd-baseline-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ConstructionManager
            - call: "POST /pre-opening/milestones/${m_a1_id}/start"
              payload: {}
              as: ConstructionManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-05T00:00:00Z" }
              as: ConstructionManager
            - call: "POST /pre-opening/milestones/${m_a1_id}/complete"
              payload: {}
              as: ConstructionManager
            - call: "POST /pre-opening/milestones/${m_a1_id}/reopen"
              payload: { reason: "Corridor fire-rating rework" }
              as: ConstructionManager
            - call: "POST /pre-opening/milestones/${m_a1_id}/start"
              payload: {}
              as: ConstructionManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-10T00:00:00Z" }
              as: ConstructionManager
            - call: "POST /pre-opening/milestones/${m_a1_id}/complete"
              payload: {}
              as: ConstructionManager
          trigger:
            - call: "GET /pre-opening/programs/${prog_a_id}/readiness"
              as: ProgramDirector
          assert:
            - "PreOpeningProgram.${prog_a_id}.projected_opening_date_optimistic == \"2027-02-22\""
            - "PreOpeningProgram.${prog_a_id}.projected_opening_date_committed == \"2027-02-25\""
            - "PreOpeningProgram.${prog_a_id}.projected_opening_date == \"2027-02-25\""
            - "GET /pre-opening/programs/${prog_a_id}/readiness response: variant_gap_days == 3"
            - "PreOpeningProgram.${prog_a_id}.schedule_slip_days == 24"
            - "PreOpeningProgram.${prog_a_id}.readiness_posture == \"RESTRICTED\""
            - "Milestone.${m_a1_id}.rework_count == 1"
            - "Milestone.${m_a1_id}.actual_start_date == \"2026-12-05\" and Milestone.${m_a1_id}.actual_finish_date == \"2026-12-10\" and Milestone.${m_a1_id}.actual_duration_days == 5"
            - "Milestone.${m_a2_id}.earliest_start_date == \"2026-12-13\" and Milestone.${m_a2_id}.earliest_finish_date == \"2027-01-12\""
            - "Milestone.${m_a3_id}.earliest_start_date == \"2027-01-17\" and Milestone.${m_a3_id}.earliest_finish_date == \"2027-02-11\""
            - "Milestone.${m_a1_id}.total_float_days == 0 and Milestone.${m_a2_id}.total_float_days == 0 and Milestone.${m_a3_id}.total_float_days == 0"
            - "PreOpeningProgram.${prog_a_id}.critical_path_milestone_count == 3"

      - name: cost_at_completion_commitment_vs_accrual_basis
        grounds:
          - calculations.cost_at_completion
          - entities.PreOpeningProgram.fields.cost_at_completion_commitment_cents
          - entities.PreOpeningProgram.fields.cost_at_completion_accrual_cents
          - entities.PreOpeningProgram.fields.payroll_accrual_cents
          - entities.Hire.fields.accrual_cents
          - state_machines.Hire.OFFERED_to_ACCEPTED
        distinguishing_aspect: |
          This dual variant operates on a completely different entity domain — BudgetLine/Hire money in
          cents, not Milestone dates — and its divergence comes from input-set substitution rather than
          buffer insertion: COMMITMENT_BASIS returns 650000 (BudgetLine commitments only) while
          ACCRUAL_BASIS returns 1790078 because it swaps the PAYROLL line's committed_cents for the
          forward payroll projection of both ACCEPTED hires.
        test_recipe:
          setup:
            - "Program with construction_start_date 2026-09-01, licensing_buffer_days 14 and one 90-day milestone; schedule baselined so projected_opening_date_committed == 2026-12-14."
            - "ROOMS hiring plan (headcount_target 2, wave_start_date 2026-09-28) with two ACCEPTED hires, each hourly_rate_cents 1333.4, scheduled_hours_per_day 7.5, start_date 2026-09-28."
            - "PAYROLL budget line authorized 5000000 carrying a COMMITTED order of 400000; MARKETING budget line authorized 2000000 carrying a COMMITTED order of 250000; neither order received."
          setup_api_calls:
            - call: "POST /pre-opening/programs"
              payload: { property_name: "Riverbend Suites", brand_code: "RBS", room_count: 150, construction_start_date: "2026-09-01", target_opening_date: "2027-02-01", storage_capacity_pallets: 120, relocation_rate_cents: 25000, guarantee_penalty_cents: 150000, room_night_ceiling: 500, contingency_liability_cap_cents: 90000000, licensing_buffer_days: 14 }
              as: ProgramDirector
              captures: { prog_b_id: "$.data.id" }
            - call: "POST /pre-opening/milestones"
              payload: { program_id: "${prog_b_id}", code: "CONSTRUCTION_COMPLETE", name: "Construction complete", duration_days: 90, planned_start_date: "2026-09-01" }
              as: ConstructionManager
              captures: { m_b1_id: "$.data.id" }
            - call: "POST /pre-opening/programs/${prog_b_id}/baseline-schedule"
              payload: {}
              as: ProgramDirector
            - call: "POST /pre-opening/hiring-plans"
              payload: { program_id: "${prog_b_id}", department: "ROOMS", headcount_target: 2, wave_start_date: "2026-09-28" }
              as: TalentManager
              captures: { plan_b_id: "$.data.id" }
            - call: "POST /pre-opening/hires"
              payload: { hiring_plan_id: "${plan_b_id}", full_name: "Ana Reyes", hourly_rate_cents: 1333.4, scheduled_hours_per_day: 7.5, start_date: "2026-09-28" }
              as: TalentManager
              captures: { hire_b1_id: "$.data.id" }
            - call: "POST /pre-opening/hires/${hire_b1_id}/respond"
              payload: { decision: "ACCEPT" }
              as: TalentManager
            - call: "POST /pre-opening/hires"
              payload: { hiring_plan_id: "${plan_b_id}", full_name: "Ben Oduya", hourly_rate_cents: 1333.4, scheduled_hours_per_day: 7.5, start_date: "2026-09-28" }
              as: TalentManager
              captures: { hire_b2_id: "$.data.id" }
            - call: "POST /pre-opening/hires/${hire_b2_id}/respond"
              payload: { decision: "ACCEPT" }
              as: TalentManager
            - call: "POST /pre-opening/budget-lines"
              payload: { program_id: "${prog_b_id}", category: "PAYROLL", authorized_cents: 5000000 }
              as: ProgramDirector
              captures: { bl_pay_id: "$.data.id", bl_pay_v: "$.data.version" }
            - call: "POST /pre-opening/budget-lines"
              payload: { program_id: "${prog_b_id}", category: "MARKETING", authorized_cents: 2000000 }
              as: ProgramDirector
              captures: { bl_mkt_id: "$.data.id", bl_mkt_v: "$.data.version" }
            - call: "POST /pre-opening/ose-orders"
              payload: { program_id: "${prog_b_id}", budget_line_id: "${bl_pay_id}", description: "Pre-opening agency staffing retainer", amount_cents: 400000, pallet_count: 2, delivery_window_start: "2026-10-01", delivery_window_end: "2026-10-15", expected_budget_line_version: "${bl_pay_v}" }
              as: ProcurementManager
            - call: "POST /pre-opening/ose-orders"
              payload: { program_id: "${prog_b_id}", budget_line_id: "${bl_mkt_id}", description: "Launch campaign print run", amount_cents: 250000, pallet_count: 3, delivery_window_start: "2026-10-05", delivery_window_end: "2026-10-20", expected_budget_line_version: "${bl_mkt_v}" }
              as: ProcurementManager
          trigger:
            - call: "GET /pre-opening/programs/${prog_b_id}/readiness"
              as: ProgramDirector
          assert:
            - "PreOpeningProgram.${prog_b_id}.projected_opening_date_committed == \"2026-12-14\""
            - "Hire.${hire_b1_id}.accrual_cents == 770039"
            - "Hire.${hire_b2_id}.accrual_cents == 770039"
            - "PreOpeningProgram.${prog_b_id}.payroll_accrual_cents == 1540078"
            - "PreOpeningProgram.${prog_b_id}.cost_at_completion_commitment_cents == 650000"
            - "PreOpeningProgram.${prog_b_id}.cost_at_completion_accrual_cents == 1790078"
            - "cost_at_completion_accrual_cents - cost_at_completion_commitment_cents == 1140078"

  # ===========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: readiness_score_four_term_weighted_with_clamped_slip_term
        grounds:
          - calculations.readiness_posture
          - entities.PreOpeningProgram.fields.readiness_score
          - entities.PreOpeningProgram.fields.readiness_posture
          - entities.PreOpeningProgram.fields.departments_ready_count
          - entities.PreOpeningProgram.fields.certified_system_count
          - entities.PreOpeningProgram.fields.issued_mandatory_permit_count
        distinguishing_aspect: |
          Mode (a): four independent ratio inputs (systems, staffing, permits, clamped schedule term)
          interact non-linearly through a max() clamp and four constant weights, and the posture is then
          picked by an ordered branch chain — 0.30*0.5 + 0.25*0.5 + 0.25*0.25 + 0.20*max(0, 1 - 6/30)
          == 0.4975 with posture MOBILIZING.
        test_recipe:
          setup:
            - "Program 'Lakeview Grand' with construction_start_date 2026-09-01, target_opening_date 2026-12-08, licensing_buffer_days 14, slip_tolerance_days 10."
            - "One 90-day CONSTRUCTION_COMPLETE milestone run to COMPLETE over 2026-09-01..2026-11-30, so projected_opening_date_committed is 2026-12-14 and schedule_slip_days is 6."
            - "Two required SystemImplementations (PMS, POS); PMS certified off a 40/40 test run, POS still PLANNED."
            - "Two hiring plans (ROOMS headcount_target 1, ADMIN headcount_target 1); the ROOMS hire is ONBOARDED after its orientation session completes, ADMIN has no hires."
            - "One mandatory ELEVATOR permit ISSUED; the other three mandatory permit types absent."
          setup_api_calls:
            - call: "POST /pre-opening/programs"
              payload: { property_name: "Lakeview Grand", brand_code: "LVG", room_count: 240, construction_start_date: "2026-09-01", target_opening_date: "2026-12-08", storage_capacity_pallets: 120, relocation_rate_cents: 25000, guarantee_penalty_cents: 150000, room_night_ceiling: 500, contingency_liability_cap_cents: 90000000, licensing_buffer_days: 14, slip_tolerance_days: 10 }
              as: ProgramDirector
              captures: { prog_d_id: "$.data.id" }
            - call: "POST /pre-opening/milestones"
              payload: { program_id: "${prog_d_id}", code: "CONSTRUCTION_COMPLETE", name: "Construction complete", duration_days: 90, planned_start_date: "2026-09-01" }
              as: ConstructionManager
              captures: { m_d1_id: "$.data.id" }
            - call: "POST /pre-opening/programs/${prog_d_id}/baseline-schedule"
              payload: {}
              as: ProgramDirector
            - call: "POST /pre-opening/hiring-plans"
              payload: { program_id: "${prog_d_id}", department: "ROOMS", headcount_target: 1, wave_start_date: "2026-09-10" }
              as: TalentManager
              captures: { plan_d_rooms_id: "$.data.id" }
            - call: "POST /pre-opening/hiring-plans"
              payload: { program_id: "${prog_d_id}", department: "ADMIN", headcount_target: 1, wave_start_date: "2026-09-10" }
              as: TalentManager
              captures: { plan_d_admin_id: "$.data.id" }
            - call: "POST /pre-opening/training-sessions"
              payload: { program_id: "${prog_d_id}", title: "Rooms orientation", training_room_code: "TR-1", starts_at: "2026-09-10T09:00:00Z", ends_at: "2026-09-10T12:00:00Z", capacity: 10, department: "ROOMS" }
              as: TalentManager
              captures: { sess_d_id: "$.data.id" }
            - call: "POST /pre-opening/hires"
              payload: { hiring_plan_id: "${plan_d_rooms_id}", full_name: "Ana Reyes", hourly_rate_cents: 2000, scheduled_hours_per_day: 8, start_date: "2026-09-15", orientation_session_id: "${sess_d_id}" }
              as: TalentManager
              captures: { hire_d_id: "$.data.id" }
            - call: "POST /pre-opening/hires/${hire_d_id}/respond"
              payload: { decision: "ACCEPT" }
              as: TalentManager
            - call: "POST /pre-opening/system-implementations"
              payload: { program_id: "${prog_d_id}", system_type: "PMS", is_required: true }
              as: SystemsIntegrator
              captures: { sys_d_pms_id: "$.data.id" }
            - call: "POST /pre-opening/system-implementations"
              payload: { program_id: "${prog_d_id}", system_type: "POS", is_required: true }
              as: SystemsIntegrator
              captures: { sys_d_pos_id: "$.data.id" }
            - call: "POST /pre-opening/permit-applications"
              payload: { program_id: "${prog_d_id}", gating_milestone_id: "${m_d1_id}", permit_type: "ELEVATOR", review_days: 21 }
              as: LicensingCoordinator
              captures: { permit_d_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ConstructionManager
            - call: "POST /pre-opening/milestones/${m_d1_id}/start"
              payload: {}
              as: ConstructionManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-30T00:00:00Z" }
              as: ConstructionManager
            - call: "POST /pre-opening/milestones/${m_d1_id}/complete"
              payload: {}
              as: ConstructionManager
            - call: "POST /pre-opening/training-sessions/${sess_d_id}/complete"
              payload: {}
              as: TalentManager
            - call: "POST /pre-opening/hires/${hire_d_id}/onboard"
              payload: {}
              as: TalentManager
            - call: "POST /pre-opening/system-implementations/${sys_d_pms_id}/test-runs"
              payload: { executed_at: "2026-11-30T10:00:00Z", cases_total: 40, cases_passed: 40, blocker_count: 0 }
              as: SystemsIntegrator
              as_user_id: "si-runner-1"
            - call: "POST /pre-opening/system-implementations/${sys_d_pms_id}/certify"
              payload: {}
              as: SystemsIntegrator
              as_user_id: "si-certifier-2"
            - call: "POST /pre-opening/permit-applications/${permit_d_id}/submit"
              payload: {}
              as: LicensingCoordinator
            - call: "POST /pre-opening/permit-applications/${permit_d_id}/record-review"
              payload: { decision: "ISSUE" }
              as: LicensingCoordinator
          trigger:
            - call: "GET /pre-opening/programs/${prog_d_id}/readiness"
              as: ProgramDirector
          assert:
            - "GET /pre-opening/programs/${prog_d_id}/readiness response: systems_ratio == 0.5"
            - "GET /pre-opening/programs/${prog_d_id}/readiness response: staffing_ratio == 0.5"
            - "GET /pre-opening/programs/${prog_d_id}/readiness response: permit_ratio == 0.25"
            - "GET /pre-opening/programs/${prog_d_id}/readiness response: schedule_term == 0.8"
            - "PreOpeningProgram.${prog_d_id}.schedule_slip_days == 6"
            - "PreOpeningProgram.${prog_d_id}.projected_opening_date_committed == \"2026-12-14\""
            - "PreOpeningProgram.${prog_d_id}.readiness_score == 0.4975"
            - "PreOpeningProgram.${prog_d_id}.readiness_posture == \"MOBILIZING\""
            - "PreOpeningProgram.${prog_d_id}.certified_system_count == 1 and PreOpeningProgram.${prog_d_id}.required_system_count == 2"
            - "PreOpeningProgram.${prog_d_id}.departments_ready_count == 1 and PreOpeningProgram.${prog_d_id}.hiring_plan_count == 2"
            - "PreOpeningProgram.${prog_d_id}.issued_mandatory_permit_count == 1"

      - name: payroll_accrual_rounds_per_hire_before_summing
        grounds:
          - calculations.cost_at_completion
          - entities.Hire.fields.accrual_cents
          - entities.PreOpeningProgram.fields.payroll_accrual_cents
          - entities.Hire.fields.hourly_rate_cents
          - entities.Hire.fields.scheduled_hours_per_day
        distinguishing_aspect: |
          Mode (b): the scaffold pins round-per-hire-then-sum, so three hires each accruing exactly
          770038.50 cents produce payroll_accrual_cents 2310117 (3 x 770039); the sum-then-round order
          would produce 2310116, and the two orders differ by exactly 1 cent.
        test_recipe:
          setup:
            - "Program with construction_start_date 2026-09-01, licensing_buffer_days 14 and one 90-day milestone, baselined so projected_opening_date_committed == 2026-12-14."
            - "FOOD_BEVERAGE plan with headcount_target 3, wave_start_date 2026-09-28, and three ACCEPTED hires each at hourly_rate_cents 1333.4 x scheduled_hours_per_day 7.5 (10000.50 cents/day) starting 2026-09-28, i.e. 77 pre-opening days each."
          setup_api_calls:
            - call: "POST /pre-opening/programs"
              payload: { property_name: "Cedar Point Inn", brand_code: "CPI", room_count: 120, construction_start_date: "2026-09-01", target_opening_date: "2027-02-01", storage_capacity_pallets: 120, relocation_rate_cents: 25000, guarantee_penalty_cents: 150000, room_night_ceiling: 500, contingency_liability_cap_cents: 90000000, licensing_buffer_days: 14 }
              as: ProgramDirector
              captures: { prog_r_id: "$.data.id" }
            - call: "POST /pre-opening/milestones"
              payload: { program_id: "${prog_r_id}", code: "CONSTRUCTION_COMPLETE", name: "Construction complete", duration_days: 90, planned_start_date: "2026-09-01" }
              as: ConstructionManager
              captures: { m_r1_id: "$.data.id" }
            - call: "POST /pre-opening/programs/${prog_r_id}/baseline-schedule"
              payload: {}
              as: ProgramDirector
            - call: "POST /pre-opening/hiring-plans"
              payload: { program_id: "${prog_r_id}", department: "FOOD_BEVERAGE", headcount_target: 3, wave_start_date: "2026-09-28" }
              as: TalentManager
              captures: { plan_r_id: "$.data.id" }
            - call: "POST /pre-opening/hires"
              payload: { hiring_plan_id: "${plan_r_id}", full_name: "Cora Lin", hourly_rate_cents: 1333.4, scheduled_hours_per_day: 7.5, start_date: "2026-09-28" }
              as: TalentManager
              captures: { hire_r1_id: "$.data.id" }
            - call: "POST /pre-opening/hires"
              payload: { hiring_plan_id: "${plan_r_id}", full_name: "Dan Mbeki", hourly_rate_cents: 1333.4, scheduled_hours_per_day: 7.5, start_date: "2026-09-28" }
              as: TalentManager
              captures: { hire_r2_id: "$.data.id" }
            - call: "POST /pre-opening/hires"
              payload: { hiring_plan_id: "${plan_r_id}", full_name: "Eve Tanaka", hourly_rate_cents: 1333.4, scheduled_hours_per_day: 7.5, start_date: "2026-09-28" }
              as: TalentManager
              captures: { hire_r3_id: "$.data.id" }
            - call: "POST /pre-opening/hires/${hire_r1_id}/respond"
              payload: { decision: "ACCEPT" }
              as: TalentManager
            - call: "POST /pre-opening/hires/${hire_r2_id}/respond"
              payload: { decision: "ACCEPT" }
              as: TalentManager
          trigger:
            - call: "POST /pre-opening/hires/${hire_r3_id}/respond"
              payload: { decision: "ACCEPT" }
              as: TalentManager
          assert:
            - "Hire.${hire_r1_id}.accrual_cents == 770039"
            - "Hire.${hire_r2_id}.accrual_cents == 770039"
            - "Hire.${hire_r3_id}.accrual_cents == 770039"
            - "PreOpeningProgram.${prog_r_id}.payroll_accrual_cents == 2310117"
            - "PreOpeningProgram.${prog_r_id}.payroll_accrual_cents != 2310116"
            - "PreOpeningProgram.${prog_r_id}.cost_at_completion_accrual_cents == 2310117"
            - "PreOpeningProgram.${prog_r_id}.cost_at_completion_commitment_cents == 0"

      - name: contingency_admin_fee_tier_keyed_on_pre_fee_base
        grounds:
          - calculations.contingency_liability
          - entities.ReservationBlock.fields.contingency_cents
          - entities.PreOpeningProgram.fields.contingency_liability_cents
          - state_machines.ReservationBlock.ACCEPTED_to_GUARANTEED
        distinguishing_aspect: |
          Mode (c): the admin fee looks circular (total = base + fee, fee banded by the contingency's
          size), and the scaffold pins base -> tier -> fee -> subtotal -> penalty, so the 1900000 base
          selects TIER_2_PCT 0.08 for a contingency of 2052000; a tier keyed on the post-fee subtotal
          would select 0.12 and return 2128000, and the 150000 guarantee penalty applied afterwards
          leaves the 0.08 tier intact at 2202000.
