              as: EnrollmentCounselor
              as_user_id: "counselor-01"
            - call: "POST /retiree-benefits/eligibility-determinations/${det1_id}/certify"
              payload: {}
              as: EligibilityAnalyst
              as_user_id: "analyst-02"
            - call: "POST /retiree-benefits/election-events"
              payload: { retiree_id: "${r1_id}", plan_year_id: "${py_id}", requested_plan_option_id: "${po_pre_id}", event_type: "ANNUAL_OPEN", event_date: "2026-10-20" }
              as: EnrollmentCounselor
              as_user_id: "counselor-01"
              captures: { ee1_id: $.data.id }
          assert:
            - "BEFORE: the first POST returns HTTP 409 with data.error_id == ERR_DETERMINATION_NOT_CERTIFIED"
            - "BEFORE: the error is not ERR_NOT_ELIGIBLE_FOR_RETIREE_MEDICAL, because the DRAFT determination's outcome is already ELIGIBLE and priority 29 precedes priority 30"
            - "BEFORE: no ElectionEvent row exists for (${r1_id}, ${py_id})"
            - "AFTER: EligibilityDetermination.${det1_id}.status == CERTIFIED with certified_by_user_id == analyst-02 and certified_at == 2026-10-20T00:00:00.000Z"
            - "AFTER: the byte-identical third POST returns HTTP 201"
            - "AFTER: ElectionEvent.${ee1_id}.status == SUBMITTED with coverage_effective_date == 2027-01-01T00:00:00.000Z"
