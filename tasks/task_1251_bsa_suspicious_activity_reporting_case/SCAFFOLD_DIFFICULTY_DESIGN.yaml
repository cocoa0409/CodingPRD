  - rule_id: non_linear_state_machine
    instances:
      - name: case_qa_return_cycle
        grounds: [state_machines.Case.PENDING_QA_to_INVESTIGATING, state_machines.Case.INVESTIGATING_to_PENDING_QA, state_machines.Case.PENDING_QA_to_CLOSED]
        distinguishing_aspect: "Case machine is cyclic (not a linear pipeline): PENDING_QA -> INVESTIGATING on QA FAIL reopens investigation and the case can traverse INVESTIGATING -> PENDING_QA a second time before CLOSED; the revert does not reset the recorded NO_SAR decision."
        test_recipe:
          setup:
            - "One case for a customer, assigned to analyst an1, in INVESTIGATING"
          setup_api_calls:
            - { call: "POST /analysts", payload: { full_name: "Ann Analyst", capacity_max_cases: 10 }, as: ComplianceAdmin, captures: { an1: $.data.id } }
            - { call: "POST /analysts", payload: { full_name: "Quinn QA", capacity_max_cases: 10 }, as: ComplianceAdmin, captures: { qa1: $.data.id } }
            - { call: "POST /analysts", payload: { full_name: "Meg Manager", capacity_max_cases: 10 }, as: ComplianceAdmin, captures: { mg1: $.data.id } }
            - { call: "POST /customers", payload: { full_name: "Carl Customer", country_code: "US", country_risk: "LOW" }, as: ComplianceAdmin, captures: { cu1: $.data.id } }
            - { call: "POST /cases", payload: { customer_id: "${cu1}" }, as: BSAAnalyst, as_user_id: "${an1}", captures: { c1: $.data.id } }
            - { call: "POST /cases/${c1}/assign", payload: { analyst_id: "${an1}" }, as: BSAManager, as_user_id: "${mg1}" }
            - { call: "POST /cases/${c1}/start-investigation", as: BSAAnalyst, as_user_id: "${an1}", captures: { c1_v: $.data.version } }
          trigger:
            - { call: "POST /cases/${c1}/sar-decision", payload: { decision: "NO_SAR", decision_rationale: "Legitimate business activity documented", expected_case_version: "${c1_v}" }, as: BSAAnalyst, as_user_id: "${an1}" }
            - { call: "POST /cases/${c1}/qa-review", payload: { outcome: "FAIL", notes: "Rationale does not address the cash pattern" }, as: QAReviewer, as_user_id: "${qa1}", captures: { c1_v2: $.data.version, c1_state_after_fail: $.data.status } }
            - { call: "POST /cases/${c1}/sar-decision", payload: { decision: "NO_SAR", decision_rationale: "Reworked: added payroll records analysis", expected_case_version: "${c1_v2}" }, as: BSAAnalyst, as_user_id: "${an1}" }
            - { call: "POST /cases/${c1}/qa-review", payload: { outcome: "PASS", notes: "Adequate after rework" }, as: QAReviewer, as_user_id: "${qa1}" }
            - { call: "GET /analysts/${an1}", as: BSAManager, as_user_id: "${mg1}" }
          assert:
            - "After QA FAIL: Case.${c1}.status == INVESTIGATING (cycle traversed PENDING_QA -> INVESTIGATING)"
            - "Second sar-decision succeeds with the post-FAIL version (loop iteration 2 reaches PENDING_QA again)"
            - "Final: Case.${c1}.status == CLOSED, closed_reason == NO_SAR_CONFIRMED, decision == NO_SAR (decision survived the revert), closed_at != null"
            - "Analyst.${an1}.assigned_open_cases == 0 (decremented exactly once at close)"

      - name: sar_qa_fail_rework_cycle
        grounds: [state_machines.SARReport.IN_QA_to_DRAFT, state_machines.SARReport.DRAFT_to_IN_QA, state_machines.SARReport.APPROVED_to_FILED]
        distinguishing_aspect: "SARReport machine is cyclic on a DIFFERENT entity than the Case cycle: IN_QA -> DRAFT on QA FAIL returns the report to drafting, and a second DRAFT -> IN_QA traversal leads through QA_PASSED and APPROVED to FILED — plus the case-level cascade and 90-day review creation on filing."
        test_recipe:
          setup:
            - "Case in SAR_IN_PROGRESS for a customer (no alerts; detection = case created_at at default clock 2026-05-01T00:00:00Z, deadline 2026-05-31)"
            - "SAR draft created with activity [2026-03-10, 2026-04-10]"
          setup_api_calls:
            - { call: "POST /analysts", payload: { full_name: "Ann Analyst", capacity_max_cases: 10 }, as: ComplianceAdmin, captures: { an1: $.data.id } }
            - { call: "POST /analysts", payload: { full_name: "Quinn QA", capacity_max_cases: 10 }, as: ComplianceAdmin, captures: { qa1: $.data.id } }
            - { call: "POST /analysts", payload: { full_name: "Meg Manager", capacity_max_cases: 10 }, as: ComplianceAdmin, captures: { mg1: $.data.id } }
            - { call: "POST /customers", payload: { full_name: "Carl Customer", country_code: "US", country_risk: "LOW" }, as: ComplianceAdmin, captures: { cu1: $.data.id } }
            - { call: "POST /cases", payload: { customer_id: "${cu1}" }, as: BSAAnalyst, as_user_id: "${an1}", captures: { c1: $.data.id } }
            - { call: "POST /cases/${c1}/assign", payload: { analyst_id: "${an1}" }, as: BSAManager, as_user_id: "${mg1}" }
            - { call: "POST /cases/${c1}/start-investigation", as: BSAAnalyst, as_user_id: "${an1}", captures: { c1_v: $.data.version } }
            - { call: "POST /cases/${c1}/sar-decision", payload: { decision: "SAR_REQUIRED", decision_rationale: "Unexplained structuring pattern", expected_case_version: "${c1_v}" }, as: BSAAnalyst, as_user_id: "${an1}" }
            - { call: "POST /cases/${c1}/sar-reports", payload: { activity_start_date: "2026-03-10", activity_end_date: "2026-04-10" }, as: BSAAnalyst, as_user_id: "${an1}", captures: { sar1: $.data.id, sar1_v: $.data.version } }
          trigger:
            - { call: "PUT /sar-reports/${sar1}/narrative", payload: { narrative: "Narrative: Between 2026-03-10 and 2026-04-10 the subject account received a pattern of cash deposits in amounts between 300000 and 500000 cents, each below the 1000000-cent reporting threshold, aggregating 1300000 cents across three branch and ATM visits within seven days. The customer could not explain the source of funds when contacted, the stated occupation is inconsistent with cash-intensive activity, and the deposits were followed by rapid transfers out of the account. This activity is consistent with structuring designed to evade currency transaction reporting requirements under 31 USC 5324 and is being reported as suspicious.", expected_sar_version: "${sar1_v}" }, as: BSAAnalyst, as_user_id: "${an1}" }
            - { call: "POST /sar-reports/${sar1}/submit-qa", as: BSAAnalyst, as_user_id: "${an1}" }
            - { call: "POST /sar-reports/${sar1}/qa-review", payload: { outcome: "FAIL", notes: "Narrative omits prior SAR check" }, as: QAReviewer, as_user_id: "${qa1}", captures: { sar1_v4: $.data.version, sar1_state_after_fail: $.data.status } }
            - { call: "PUT /sar-reports/${sar1}/narrative", payload: { narrative: "Narrative (reworked): Between 2026-03-10 and 2026-04-10 the subject account received a pattern of cash deposits in amounts between 300000 and 500000 cents, each below the 1000000-cent reporting threshold, aggregating 1300000 cents across three branch and ATM visits within seven days. The customer could not explain the source of funds when contacted, the stated occupation is inconsistent with cash-intensive activity, and the deposits were followed by rapid transfers out of the account. A review of prior filings confirms no earlier SAR exists for this subject. This activity is consistent with structuring designed to evade currency transaction reporting requirements under 31 USC 5324 and is being reported as suspicious.", expected_sar_version: "${sar1_v4}" }, as: BSAAnalyst, as_user_id: "${an1}" }
            - { call: "POST /sar-reports/${sar1}/submit-qa", as: BSAAnalyst, as_user_id: "${an1}" }
            - { call: "POST /sar-reports/${sar1}/qa-review", payload: { outcome: "PASS" }, as: QAReviewer, as_user_id: "${qa1}" }
            - { call: "POST /sar-reports/${sar1}/approve", as: BSAManager, as_user_id: "${mg1}" }
            - { call: "POST /sar-reports/${sar1}/file", as: BSAManager, as_user_id: "${mg1}", captures: { sar1_state_final: $.data.status, sar1_filed_at: $.data.filed_at } }
            - { call: "GET /cases/${c1}", as: BSAAnalyst, as_user_id: "${an1}", captures: { c1_state_final: $.data.status } }
            - { call: "GET /sar-reports/${sar1}/continuing-reviews", as: BSAAnalyst, as_user_id: "${an1}", captures: { rev_due: "$.data[0].due_at", rev_dl: "$.data[0].filing_deadline_at", rev_id: "$.data[0].id" } }
          assert:
            - "After QA FAIL: SARReport.${sar1}.status == DRAFT (IN_QA -> DRAFT cycle traversed)"
            - "Second submit-qa succeeds from DRAFT; QA PASS -> QA_PASSED; approve -> APPROVED; file -> FILED"
            - "SARReport.${sar1}.filed_at == 2026-05-01T00:00:00Z and filing_reference is non-null"
            - "Case.${c1}.status == PENDING_QA (file cascade SAR_IN_PROGRESS -> PENDING_QA)"
            - "ContinuingReview created: due_at == 2026-07-30T00:00:00Z (filed + 90d), filing_deadline_at == 2026-08-29T00:00:00Z (filed + 120d), cycle_number == 1, status == SCHEDULED"

  - rule_id: transitive_cascade
    instances:
      - name: exit_decision_three_level_cascade
        grounds: [state_machines.AccountDecision.APPROVED_to_EXECUTED, state_machines.Account.OPEN_to_EXITED, state_machines.Customer.ACTIVE_to_EXITED, state_machines.Alert.NEW_to_AUTO_CLOSED, state_machines.InfoShareRequest.DRAFT_to_CANCELLED]
        distinguishing_aspect: "Depth-3 chain from POST /account-decisions/{id}/execute: the decision mutates the Account (EXITED, link 1); losing its last open account mutates the Customer (EXITED, link 2, caused by link 1); the customer exit mutates the customer's non-terminal Alerts (AUTO_CLOSED/CUSTOMER_EXITED) and DRAFT 314(b) requests (CANCELLED) (link 3, caused by link 2) — not a fan-out from the original action."
        test_recipe:
          setup:
            - "Customer cu1 (LOW risk) with exactly one account ac1; one alert al1 for the account in UNDER_TRIAGE; one DRAFT 314(b) request isr1 for cu1"
            - "EXIT decision on ac1 APPROVED, not yet executed"
            - "Logical clock at default 2026-05-01T00:00:00Z"
          setup_api_calls:
            - { call: "POST /analysts", payload: { full_name: "Ann Analyst", capacity_max_cases: 10 }, as: ComplianceAdmin, captures: { an1: $.data.id } }
            - { call: "POST /analysts", payload: { full_name: "Meg Manager", capacity_max_cases: 10 }, as: ComplianceAdmin, captures: { mg1: $.data.id } }
            - { call: "POST /customers", payload: { full_name: "Carl Customer", country_code: "US", country_risk: "LOW" }, as: ComplianceAdmin, captures: { cu1: $.data.id } }
            - { call: "POST /customers/${cu1}/accounts", payload: { account_number: "ACC-4001" }, as: ComplianceAdmin, captures: { ac1: $.data.id } }
            - { call: "POST /monitoring-scenarios", payload: { scenario_code: "STRUCT-CASH-7D", name: "Structuring cash 7d", applies_to_txn_types: ["CASH_DEPOSIT"], direction_filter: "CREDIT" }, as: ComplianceAdmin, captures: { sc1: $.data.id, sc1_v: $.data.version } }
            - { call: "POST /monitoring-scenarios/${sc1}/threshold-versions", payload: { expected_scenario_version: "${sc1_v}", threshold_amount_cents: 1000000, lookback_days: 7, min_transaction_count: 3, weight_amount: 0.5, weight_velocity: 0.3, weight_geo: 0.2, effective_from: "2026-04-01T00:00:00Z", tuning_rationale: "Initial calibration", backtest_precision: 0.7, backtest_recall: 0.6 }, as: BSAAnalyst, as_user_id: "${an1}", captures: { th1: $.data.id } }
            - { call: "POST /threshold-versions/${th1}/approve", as: BSAManager, as_user_id: "${mg1}" }
            - { call: "POST /monitoring-scenarios/${sc1}/activate", as: BSAManager, as_user_id: "${mg1}" }
            - { call: "POST /threshold-versions/${th1}/activate", as: BSAManager, as_user_id: "${mg1}" }
            - { call: "POST /accounts/${ac1}/transactions", payload: { amount_cents: 500000, txn_type: "CASH_DEPOSIT", direction: "CREDIT", counterparty_country: "US", posted_at: "2026-04-28T10:00:00Z", channel: "BRANCH" }, as: ComplianceAdmin }
            - { call: "POST /accounts/${ac1}/transactions", payload: { amount_cents: 500000, txn_type: "CASH_DEPOSIT", direction: "CREDIT", counterparty_country: "US", posted_at: "2026-04-29T10:00:00Z", channel: "BRANCH" }, as: ComplianceAdmin }
            - { call: "POST /accounts/${ac1}/transactions", payload: { amount_cents: 300000, txn_type: "CASH_DEPOSIT", direction: "CREDIT", counterparty_country: "US", posted_at: "2026-04-30T10:00:00Z", channel: "ATM" }, as: ComplianceAdmin }
            - { call: "POST /monitoring-scenarios/${sc1}/evaluate", payload: { account_id: "${ac1}", evaluated_at: "2026-05-01T00:00:00Z" }, as: ComplianceAdmin, captures: { al1: $.data.alert_id } }
            - { call: "POST /alerts/${al1}/triage", as: BSAAnalyst, as_user_id: "${an1}" }
            - { call: "POST /info-share-requests", payload: { direction: "OUTBOUND", counterparty_institution_id: "INST-9", subject_customer_id: "${cu1}", certified_at: "2026-04-01T00:00:00Z", purpose_note: "Coordinate on suspected structuring" }, as: BSAAnalyst, as_user_id: "${an1}", captures: { isr1: $.data.id } }
            - { call: "POST /accounts/${ac1}/exit-decisions", payload: { decision: "EXIT", rationale: "Confirmed structuring; relationship not retainable" }, as: BSAAnalyst, as_user_id: "${an1}", captures: { dec1: $.data.id } }
            - { call: "POST /account-decisions/${dec1}/approve", as: BSAManager, as_user_id: "${mg1}" }
          trigger:
            - { call: "POST /account-decisions/${dec1}/execute", as: BSAManager, as_user_id: "${mg1}" }
            - { call: "GET /accounts/${ac1}", as: BSAAnalyst, as_user_id: "${an1}", captures: { ac1_status: $.data.status } }
            - { call: "GET /customers/${cu1}", as: BSAAnalyst, as_user_id: "${an1}", captures: { cu1_status: $.data.status } }
            - { call: "GET /alerts/${al1}", as: BSAAnalyst, as_user_id: "${an1}", captures: { al1_status: $.data.status, al1_reason: $.data.closure_reason } }
            - { call: "GET /info-share-requests/${isr1}", as: BSAAnalyst, as_user_id: "${an1}", captures: { isr1_status: $.data.status } }
          assert:
            - "Link 1: Account.${ac1}.status == EXITED (caused by the decision execution)"
            - "Link 2: Customer.${cu1}.status == EXITED (caused by the account exit — no remaining accounts in {OPEN, RESTRICTED})"
            - "Link 3: Alert.${al1}.status == AUTO_CLOSED with closure_reason == CUSTOMER_EXITED (caused by the customer exit, not by the decision directly)"
            - "Link 3 sibling: InfoShareRequest.${isr1}.status == CANCELLED"
            - "Customer.${cu1}.risk_score_standard == 500 (100 + 400 exited-account points) and risk_rating == HIGH"
            - "AccountDecision.${dec1}.status == EXECUTED and executed_at != null"

      - name: sar_file_risk_restriction_cascade
        grounds: [state_machines.SARReport.APPROVED_to_FILED, state_machines.Account.OPEN_to_RESTRICTED, calculations.customer_risk_rating_recompute]
        distinguishing_aspect: "Depth-2 chain from a DIFFERENT trigger (POST /sar-reports/{id}/file): filing mutates the Customer (sar_filings_365d 1->2, risk_score_standard 350->600, rating crosses MEDIUM->HIGH — link 1); the rating crossing INTO HIGH itself mutates the customer's OPEN Account to RESTRICTED with restriction_reason RISK_CASCADE (link 2, caused by link 1). The first filing (350, MEDIUM) provably causes NO restriction, isolating the crossing as the cause."
