      - name: instrument_capability_run_concurrency_and_stage_readiness_each_refuse_a_run
        claim_type: error_triggerable
        grounds:
          - errors.ERR_METROLOGY_CAPABILITY_INSUFFICIENT
          - errors.ERR_RUN_ALREADY_OPEN
          - errors.ERR_WORK_ORDER_NOT_IN_PROCESS
          - validations.priority_15
          - validations.priority_17
          - calculations.metrology_capability_index
        distinguishing_aspect: |
          Three refusals that are all about fabrication readiness rather than about data: an instrument
          whose capability ratio for a 0.0100-wave budget is 0.4000 cannot be scheduled at all, a second
          run cannot be opened on an order that already owns a SCHEDULED one, and a coating run cannot be
          opened on an order that has not reached FIGURE_ACCEPTED. Swapping in the finer instrument (ratio
          0.2400) shows the capability refusal was about the ratio and nothing else.
        test_recipe:
          setup:
            - "A RELEASED design OD-2540-T with a very tight tolerance_budget_waves of 0.0100 and one ACTIVE allocation of sensitivity 0.1 and tolerance 0.0250, so the stack is 0.0025 <= 0.0100 and the verdict is PASS."
            - "A RELEASED lot GL-2540-1 (20 blanks, H3/B, blank thickness 6200.0) and one work order WO-2540-1 (element_count 2) in BLANKS_RESERVED."
            - "Two interferometers calibrated at the clock's start value: IF-2540-COARSE with base_uncertainty_waves 0.0010 (capability_ratio 4 * 0.0010 / 0.0100 == 0.4000, above the 0.2500 limit) and IF-2540-FINE with 0.0006 (ratio 0.2400, inside it)."
            - "The logical clock stays at its start value 2026-08-01T00:00:00Z."
