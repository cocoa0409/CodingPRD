            - "UpfitOrder.${uo}.chassis_warranty_status == \"INTACT\" — a DIRECT_SPLICE on J1939_CAN computed warranty_impact VOIDS, but a REJECTED row never enters the posture"
            - "ElectricalInterface.${if1}.warranty_impact == \"VOIDS\" (the stamp survives the rejection)"
            - "EquipmentInstallation.${ei_crane}.status == \"REMOVED\" and UpfitOrder.${uo}.committed_pto_flow_gpm == 0"

      - name: committed_aux_amp_draw_falls_back_to_the_body_baseline_after_a_removal
        claim_type: aggregation
        grounds:
          - calculations.aux_electrical_load
          - state_machines.EquipmentInstallation.PLANNED_to_REMOVED
        distinguishing_aspect: |
          The running total must be correct after a reversal, and its floor is NOT zero: the body's
          12 A is counted from order creation and never leaves, so removing every installation must
          land on exactly 12, not 0 and not 42.
        test_recipe:
          setup:
            - "A CUSTOMER_SPECIFIC service order on F550-DRW-84CA with one PLANNED liftgate drawing 30 A, so committed_aux_amp_draw reads 42."
