  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_business_referential_on_dispatch
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_PRODUCT_MISMATCH]
        distinguishing_aspect: |
          A dispatch on an already-FUELED order that ALSO has a product/contract
          mismatch returns ERR_INVALID_STATE (priority 5, category state), not
          ERR_PRODUCT_MISMATCH (priority 6, category business_referential) — the
          state-vs-business_referential pair resolves to state.
        test_recipe:
          setup:
            - "A FUELED JET_A order; its contract has since been EXPIRED so a dispatch would also mismatch, but the order is already past REQUESTED."
          setup_api_calls:
            - call: "POST /operators"
              payload: { legal_name: "Aero Ops", contact_email: "ops@aero.test" }
              as: BillingClerk
              captures: { op_id: $.data.id }
            - call: "POST /aircraft"
              payload: { operator_id: "${op_id}", tail_number: "N100AA", fuel_type: "JET_A", mtow_lb: 30000 }
              as: OpsDispatcher
              captures: { ac_id: $.data.id }
            - call: "POST /fuel-contracts"
              payload: { operator_id: "${op_id}", product: "JET_A", base_price_cents_per_gal: 520, tankering_fee_cents_per_gal: 30 }
              as: BillingClerk
              captures: { fc_id: $.data.id }
            - call: "POST /service-visits"
              payload: { operator_id: "${op_id}", aircraft_id: "${ac_id}", arrival_utc: "2026-06-14T08:00:00.000Z", departure_utc: "2026-06-15T08:00:00.000Z" }
              as: OpsDispatcher
              captures: { v_id: $.data.id }
            - call: "POST /service-visits/${v_id}/arrive"
              payload: {}
              as: OpsDispatcher
            - call: "POST /fuel-orders"
              payload: { service_visit_id: "${v_id}", aircraft_id: "${ac_id}", fuel_contract_id: "${fc_id}", product: "JET_A", ordered_gallons: 6000, tankering: false }
              as: FuelTech
              captures: { fo_id: $.data.id }
            - call: "POST /fuel-orders/${fo_id}/dispatch"
              payload: {}
              as: FuelTech
            - call: "POST /fuel-orders/${fo_id}/complete-fueling"
              payload: {}
              as: FuelTech
          trigger:
            - call: "POST /fuel-orders/${fo_id}/dispatch"
              payload: {}
              as: FuelTech
          assert:
            - "response.error_id == ERR_INVALID_STATE"
            - "response.http_status == 409"

      - name: existence_beats_state_on_occupy
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - errors[ERR_NOT_FOUND]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          An occupy call naming a non-existent assignment id returns ERR_NOT_FOUND
          (priority 4, category existence) rather than any state error (priority 5),
          proving the existence-vs-state pair resolves to existence.
        test_recipe:
          setup:
            - "Empty DB except one operator (so the path id is genuinely unknown)."
          setup_api_calls:
            - call: "POST /operators"
              payload: { legal_name: "Aero Ops", contact_email: "ops@aero.test" }
              as: BillingClerk
              captures: { op_id: $.data.id }
          trigger:
            - call: "POST /parking-assignments/00000000-0000-4000-8000-000000000000/occupy"
              payload: { expected_assignment_version: "${op_id}" }
              as: OpsDispatcher
          assert:
            - "response.error_id == ERR_NOT_FOUND"
            - "response.http_status == 404"

  # =========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: reconciliation_tolerance_exactly_two_pct
        grounds:
          - calculations.into_plane_reconciliation
          - state_machines.FuelOrder.NOT_STARTED_to_RECONCILED
          - entities.IntoPlaneTicket.fields.outcome
        distinguishing_aspect: |
          Delivering exactly +2.00% variance (6000 ordered, 6120 delivered)
          RECONCILES because the tolerance test is `<=` 2.00; one gallon more
          (6121, +2.02%) would FLAG. Boundary on the variance_pct metric via
          POST /into-plane-tickets.
        test_recipe:
          setup:
            - "A FUELED 6000-gal order with reconciliation_status NOT_STARTED."
          setup_api_calls:
            - call: "POST /operators"
              payload: { legal_name: "Aero Ops", contact_email: "ops@aero.test" }
              as: BillingClerk
              captures: { op_id: $.data.id }
            - call: "POST /aircraft"
              payload: { operator_id: "${op_id}", tail_number: "N100AA", fuel_type: "JET_A", mtow_lb: 30000 }
              as: OpsDispatcher
              captures: { ac_id: $.data.id }
            - call: "POST /fuel-contracts"
              payload: { operator_id: "${op_id}", product: "JET_A", base_price_cents_per_gal: 520, tankering_fee_cents_per_gal: 30 }
              as: BillingClerk
              captures: { fc_id: $.data.id }
            - call: "POST /service-visits"
              payload: { operator_id: "${op_id}", aircraft_id: "${ac_id}", arrival_utc: "2026-06-14T08:00:00.000Z", departure_utc: "2026-06-15T08:00:00.000Z" }
              as: OpsDispatcher
              captures: { v_id: $.data.id }
            - call: "POST /service-visits/${v_id}/arrive"
              payload: {}
              as: OpsDispatcher
            - call: "POST /fuel-orders"
              payload: { service_visit_id: "${v_id}", aircraft_id: "${ac_id}", fuel_contract_id: "${fc_id}", product: "JET_A", ordered_gallons: 6000, tankering: false }
              as: FuelTech
              captures: { fo_id: $.data.id }
            - call: "POST /fuel-orders/${fo_id}/dispatch"
              payload: {}
              as: FuelTech
            - call: "POST /fuel-orders/${fo_id}/complete-fueling"
              payload: {}
              as: FuelTech
          trigger:
            - call: "POST /into-plane-tickets"
              payload: { fuel_order_id: "${fo_id}", delivered_gallons: 6120 }
              as: FuelTech
