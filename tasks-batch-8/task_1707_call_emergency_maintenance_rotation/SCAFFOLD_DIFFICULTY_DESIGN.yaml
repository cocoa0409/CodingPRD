            - { call: "GET /v1/rotation-shifts/${shA}", as: PropertyAdmin, captures: { nca: $.data.needs_coverage } }
          assert:
            - "Technician.${t1}.callback_minutes_168h == 720 (400 + 320; crossing lands exactly on the inclusive cap)"
            - "Technician.${t1}.fatigue_block_until == 2026-08-01T22:50:00Z (ticket 2 mitigated_at 12:50 + 10h)"
            - "RotationShift.${shB}.needs_coverage == true (PUBLISHED shift overlapping the rest window — flagged by the fatigue mutation, link 2)"
            - "RotationShift.${shA}.needs_coverage == false (ACTIVE, and its window precedes the block)"

  # ---------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_precedes_fiscal_on_authorize
        grounds:
          - validations[priority=5]
          - validations[priority=10]
          - state_machines.VendorAuthorization.PROPOSED_to_AUTHORIZED
        distinguishing_aspect: |
          Category pair = state vs business_fiscal. The authorization is REJECTED (state
          violation) AND its 300000 amount exceeds the supervisor's 250000 role cap (fiscal
          violation); the single returned error must be the state error
          ERR_VENDOR_AUTHORIZATION_INVALID_STATE (priority 5 < 10).
        test_recipe:
          setup:
            - "Ticket mitigated (unit_uninhabitable=false); work order WO; vendor limit 500000; VA of 300000 proposed by T1, then REJECTED by S1 (reason recorded)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: PropertyAdmin }
            - { call: "POST /v1/technicians", payload: { full_name: "Pat Tech", capability: "TECHNICIAN", base_hourly_rate_cents: 4800, on_call_differential_bp: 1500 }, as: PropertyAdmin, captures: { t1: $.data.id } }
            - { call: "POST /v1/technicians", payload: { full_name: "Sam Sup", capability: "SUPERVISOR", base_hourly_rate_cents: 6000, on_call_differential_bp: 1500 }, as: PropertyAdmin, captures: { sup1: $.data.id } }
            - { call: "POST /v1/units", payload: { unit_number: "U-601", building_code: "B6" }, as: PropertyAdmin, captures: { u1: $.data.id } }
            - { call: "POST /v1/vendors", payload: { name: "PowerPros", trade: "ELECTRICAL", per_incident_limit_cents: 500000 }, as: PropertyAdmin, captures: { v1: $.data.id } }
            - { call: "POST /v1/rotation-shifts", payload: { technician_id: "${t1}", start_at: "2026-08-03T00:00:00Z", end_at: "2026-08-03T08:00:00Z" }, as: PropertyAdmin, captures: { sh: $.data.id } }
            - { call: "POST /v1/rotation-shifts/${sh}/start", as: PropertyAdmin }
            - { call: "POST /v1/call-tickets", payload: { unit_id: "${u1}", caller_name: "Caller H", caller_phone: "555-0109", category: "NO_POWER", description: "Outage" }, as: Dispatcher, captures: { tk: $.data.id } }
            - { call: "POST /v1/call-tickets/${tk}/triage", payload: { is_true_emergency: true }, as: Dispatcher }
            - { call: "GET /v1/call-tickets/${tk}", as: Dispatcher, captures: { tv: $.data.version } }
            - { call: "POST /v1/call-tickets/${tk}/dispatch", payload: { technician_id: "${t1}", expected_call_ticket_version: "${tv}" }, as: Dispatcher }
            - { call: "POST /v1/call-tickets/${tk}/arrive", as: OnCallTechnician, as_user_id: "${t1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T01:00:00Z" }, as: PropertyAdmin }
            - { call: "POST /v1/call-tickets/${tk}/mitigate", payload: { mitigation_notes: "Temp generator", unit_uninhabitable: false }, as: OnCallTechnician, as_user_id: "${t1}" }
            - { call: "GET /v1/work-orders?call_ticket_id=${tk}", as: Dispatcher, captures: { wo: "$.data[0].id" } }
            - { call: "POST /v1/call-tickets/${tk}/vendor-authorizations", payload: { work_order_id: "${wo}", vendor_id: "${v1}", amount_cents: 300000 }, as: OnCallTechnician, as_user_id: "${t1}", captures: { va: $.data.id } }
            - { call: "POST /v1/vendor-authorizations/${va}/reject", payload: { reason: "Quote too high" }, as: MaintenanceSupervisor, as_user_id: "${sup1}" }
          trigger:
