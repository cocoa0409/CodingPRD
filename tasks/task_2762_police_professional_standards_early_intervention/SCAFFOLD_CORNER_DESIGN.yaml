            - "Complaint.${c2_id}.classification == CLASS_II and assigned_unit_id == ${patrol_unit_id}"
            - "Investigation.${inv2_id}.statutory_days == 121, required_certification_level == 2, due_at == 2026-11-30T00:00:00Z"
            - "Complaint.${c3_id}.classification == CLASS_III and screening_required == false and assigned_unit_id == ${patrol_unit_id} (a PUBLIC channel never triggers the screen)"
            - "Investigation.${inv3_id}.statutory_days == 90, required_certification_level == 1, due_at == 2026-10-30T00:00:00Z"
            - "all three investigations report tolled_days == 0 and overdue == false"

      - name: the_watch_band_admits_a_score_of_exactly_thirty_and_refuses_twenty_six
        claim_type: threshold
        grounds:
          - calculations.eis_composite_score
          - endpoints["GET /officers/{id}/eis-profile"]
          - endpoints["POST /officers/{id}/activity-events"]
          - entities.Officer.fields.eis_alert_level
        distinguishing_aspect: |
          ALERT_LEVEL_THRESHOLDS.WATCH is 30 and the band comparison is non-strict, so a score
          landing exactly on 30.00 must open an alert while 26.25 must leave the officer at NONE
          with no alert row at all. Both officers are PATROL with multiplier 1.0 and both stay
          under the FORCE_COUNT indicator threshold of 3, so nothing but the severity multiplier
          separates them: two LEVEL_3 events give 3*2.0*2 = 12.0 weighted and 30.00 scaled,
          while a LEVEL_3 plus a LEVEL_2 gives 10.5 weighted and 26.25 scaled.
        test_recipe:
          setup:
            - "The logical clock stands at 2026-08-01T00:00:00Z."
            - "One PATROL_DIVISION unit holds Officer Nagy and Officer Ortiz, both assignment_type PATROL with no prior activity events and eis_score 0.00."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /units"
              payload: { name: "Patrol North", unit_role: "PATROL_DIVISION", command_code: "PN", peer_group_code: "PG_NORTH", sworn_headcount: 60, intake_enabled: true }
              as: SystemAdmin
