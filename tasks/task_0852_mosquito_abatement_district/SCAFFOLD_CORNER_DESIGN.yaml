            - "TrapCollection.${coll_id}.status == LOGGED"
            - "Notification.${notif_id}.status == SENT"
            - "Notification.${notif_id}.acknowledged_at == null"

      - name: corner_segregation_of_duties_blocks_self_and_repeat_approval
        claim_type: Segregation of duties
        grounds:
          - validations[priority=12]
          - errors[ERR_SELF_APPROVAL]
          - errors[ERR_DUPLICATE_APPROVER]
          - entities.TreatmentPlan.fields.approver_user_ids
        distinguishing_aspect: "The submitter's own user id is refused with ERR_SELF_APPROVAL (403) even when it arrives under the AbatementManager role, and a manager who has already approved is refused a second time with ERR_DUPLICATE_APPROVER (409); the AERIAL quorum only closes with two distinct ids."
        test_recipe:
          setup:
            - "A SUBMITTED AERIAL plan (required_approvals 2) submitted by the shared user id u-dual-1 acting as VectorEcologist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: DistrictAdmin
            - call: "POST /service-areas"
              payload: { name: "Northwest Zone", code: "NW1", season_start_date: "2026-05-01", population: 50000 }
              as: DistrictAdmin
              captures: { area_id: $.data.id }
            - call: "POST /applicators"
              payload: { full_name: "Tess Vega", license_no: "L-1001", license_category: "AERIAL", license_expires_on: "2027-12-31" }
              as: DistrictAdmin
              captures: { tech_id: $.data.id }
            - call: "GET /service-areas/${area_id}"
              payload: {}
              as: VectorEcologist
              as_user_id: "u-dual-1"
              captures: { area_v: $.data.version }
            - call: "POST /service-areas/${area_id}/risk-assessments"
              payload: { as_of_date: "2026-06-01", expected_service_area_version: "${area_v}" }
              as: VectorEcologist
              as_user_id: "u-dual-1"
              captures: { ra_id: $.data.id }
            - call: "POST /risk-assessments/${ra_id}/confirm"
              payload: {}
              as: VectorEcologist
              as_user_id: "u-dual-1"
            - call: "POST /pesticide-products"
              payload: { name: "Trumpet EC", epa_reg_no: "EPA-303", active_ingredient: "NALED", application_method: "AERIAL", label_rate_ml_per_acre: 50.0, reentry_interval_hours: 12, cost_cents_per_liter: 3000, received_total_ml: 50000.0 }
              as: DistrictAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /treatment-plans"
              payload: { service_area_id: "${area_id}", trigger_assessment_id: "${ra_id}", treatment_type: "AERIAL" }
              as: VectorEcologist
              as_user_id: "u-dual-1"
              captures: { plan_id: $.data.id }
            - call: "POST /treatment-plans/${plan_id}/routes"
              payload: { applicator_id: "${tech_id}", pesticide_product_id: "${prod_id}", route_code: "R-1", window_start: "2026-06-05T09:00:00.000Z", window_end: "2026-06-05T10:00:00.000Z", planned_acres: 10.0, center_x_m: 20000, center_y_m: 20000 }
              as: VectorEcologist
              as_user_id: "u-dual-1"
            - call: "POST /treatment-plans/${plan_id}/transitions"
              payload: { action: "SUBMIT" }
              as: VectorEcologist
              as_user_id: "u-dual-1"
          trigger:
            - call: "POST /treatment-plans/${plan_id}/transitions"
              payload: { action: "APPROVE" }
              as: AbatementManager
              as_user_id: "u-dual-1"
              captures: { err_self: $.data.error_id }
            - call: "POST /treatment-plans/${plan_id}/transitions"
              payload: { action: "APPROVE" }
              as: AbatementManager
              as_user_id: "u-mgr-1"
              captures: { status_after_first: $.data.status }
            - call: "POST /treatment-plans/${plan_id}/transitions"
              payload: { action: "APPROVE" }
              as: AbatementManager
              as_user_id: "u-mgr-1"
              captures: { err_dup: $.data.error_id }
            - call: "POST /treatment-plans/${plan_id}/transitions"
              payload: { action: "APPROVE" }
              as: AbatementManager
              as_user_id: "u-mgr-2"
              captures: { status_final: $.data.status }
          assert:
            - "${err_self} == ERR_SELF_APPROVAL"
            - "${status_after_first} == SUBMITTED"
            - "${err_dup} == ERR_DUPLICATE_APPROVER"
            - "${status_final} == APPROVED"
            - "TreatmentPlan.${plan_id}.approver_user_ids == [u-mgr-1, u-mgr-2]"
            - "TreatmentPlan.${plan_id}.submitted_by_user_id == u-dual-1"

  - section: cross_cutting_complexity_layers
    instances:
      - name: corner_stale_service_area_version_rejects_second_assessment
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[assessment-create-stale-area]
          - errors[ERR_STALE_SERVICE_AREA_VERSION]
          - endpoints[POST /service-areas/{id}/risk-assessments]
        distinguishing_aspect: "The first create with the observed area version succeeds and advances ServiceArea.version by 1; a second create still carrying the pre-create version is rejected with ERR_STALE_SERVICE_AREA_VERSION and HTTP 412, and the first assessment stays OPEN."
        test_recipe:
          setup:
            - "ServiceArea NW1 exists and its version has been read once."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: DistrictAdmin
            - call: "POST /service-areas"
              payload: { name: "Northwest Zone", code: "NW1", season_start_date: "2026-05-01", population: 50000 }
              as: DistrictAdmin
              captures: { area_id: $.data.id }
            - call: "GET /service-areas/${area_id}"
              payload: {}
              as: VectorEcologist
              as_user_id: "u-eco-1"
              captures: { area_v: $.data.version }
          trigger:
            - call: "POST /service-areas/${area_id}/risk-assessments"
              payload: { as_of_date: "2026-06-01", expected_service_area_version: "${area_v}" }
              as: VectorEcologist
              as_user_id: "u-eco-1"
              captures: { ra1: $.data.id }
            - call: "POST /service-areas/${area_id}/risk-assessments"
              payload: { as_of_date: "2026-06-01", expected_service_area_version: "${area_v}" }
              as: VectorEcologist
              as_user_id: "u-eco-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_STALE_SERVICE_AREA_VERSION"
            - "HTTP status == 412"
            - "RiskAssessment.${ra1}.status == OPEN"
            - "ServiceArea.${area_id}.version == ${area_v} + 1"
            - "GET /service-areas/${area_id}/risk-assessments returns total_count 1"

      - name: corner_stale_product_version_rejects_second_adjustment
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[inventory-adjustment-stale-product]
          - errors[ERR_STALE_PRODUCT_VERSION]
          - endpoints[POST /pesticide-products/{id}/adjustments]
        distinguishing_aspect: "The first +500.0 ml adjustment against the observed product version succeeds (on_hand 1500.00, received 1500.00, version +1); replaying the same expected_product_version is rejected with ERR_STALE_PRODUCT_VERSION (412) and the ledger does not move again."
        test_recipe:
          setup:
            - "One PesticideProduct with received_total_ml 1000.00 and its version read once."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: DistrictAdmin
            - call: "POST /pesticide-products"
              payload: { name: "VectoBac 12AS", epa_reg_no: "EPA-202", active_ingredient: "BTI", application_method: "LARVICIDE", label_rate_ml_per_acre: 100.0, reentry_interval_hours: 0, cost_cents_per_liter: 4000, received_total_ml: 1000.0 }
              as: DistrictAdmin
              captures: { prod_id: $.data.id }
            - call: "GET /pesticide-products/${prod_id}"
              payload: {}
              as: DistrictAdmin
              captures: { prod_v: $.data.version }
          trigger:
            - call: "POST /pesticide-products/${prod_id}/adjustments"
              payload: { delta_ml: 500.0, reason: "Drum received from state depot", expected_product_version: "${prod_v}" }
              as: DistrictAdmin
              captures: { on_hand_after: $.data.on_hand_ml, v_after: $.data.version }
            - call: "POST /pesticide-products/${prod_id}/adjustments"
              payload: { delta_ml: 500.0, reason: "Duplicate posting of the same delivery", expected_product_version: "${prod_v}" }
              as: DistrictAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "${on_hand_after} == 1500.00"
            - "${v_after} == ${prod_v} + 1"
            - "${err_id} == ERR_STALE_PRODUCT_VERSION"
            - "HTTP status == 412"
            - "PesticideProduct.${prod_id}.received_total_ml == 1500.00"
            - "PesticideProduct.${prod_id}.on_hand_ml == 1500.00"

      - name: corner_rate_threshold_reset_after_new_confirmed_assessment
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.area_risk_posture
          - state_machines.RiskAssessment.CONFIRMED_to_SUPERSEDED
          - entities.ServiceArea.fields.latest_confirmed_vector_index
        distinguishing_aspect: "Confirming a second assessment supersedes the first and rebases the threshold input: latest_confirmed_vector_index moves from 24.00 to 0.00 (the later window contains no eligible collection), and because no positive pool exists the posture returns to NORMAL with posture_source INDEX."
        test_recipe:
          setup:
            - "The clock is set to 2026-06-01 with one SUBMITTED collection of 60 females / 2 nights dated 2026-05-28; a first assessment as_of 2026-06-01 is confirmed at index 24.00."
            - "The clock is then advanced to 2026-06-20, past the 14-day surveillance window of that collection."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: DistrictAdmin
            - call: "POST /service-areas"
              payload: { name: "Northwest Zone", code: "NW1", season_start_date: "2026-05-01", population: 50000 }
              as: DistrictAdmin
              captures: { area_id: $.data.id }
            - call: "POST /applicators"
              payload: { full_name: "Tess Vega", license_no: "L-1001", license_category: "AERIAL", license_expires_on: "2027-12-31" }
              as: DistrictAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /service-areas/${area_id}/trap-sites"
              payload: { site_code: "T-001", trap_type: "CDC_LIGHT", habitat: "URBAN", x_m: 0, y_m: 0 }
              as: DistrictAdmin
              captures: { site_id: $.data.id }
            - call: "POST /trap-sites/${site_id}/collections"
              payload: { collection_date: "2026-05-28", trap_nights: 2, female_count: 60, species: "CULEX_PIPIENS" }
              as: FieldTech
              as_user_id: "${tech_id}"
              captures: { coll_id: $.data.id }
            - call: "POST /trap-collections/${coll_id}/transitions"
              payload: { action: "SUBMIT" }
              as: FieldTech
              as_user_id: "${tech_id}"
            - call: "GET /service-areas/${area_id}"
              payload: {}
              as: VectorEcologist
              as_user_id: "u-eco-1"
              captures: { area_v1: $.data.version }
            - call: "POST /service-areas/${area_id}/risk-assessments"
              payload: { as_of_date: "2026-06-01", expected_service_area_version: "${area_v1}" }
              as: VectorEcologist
              as_user_id: "u-eco-1"
              captures: { ra1: $.data.id }
            - call: "POST /risk-assessments/${ra1}/confirm"
              payload: {}
              as: VectorEcologist
              as_user_id: "u-eco-1"
              captures: { index1: $.data.vector_index_confirmed }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-20T00:00:00.000Z" }
              as: DistrictAdmin
            - call: "GET /service-areas/${area_id}"
              payload: {}
              as: VectorEcologist
              as_user_id: "u-eco-1"
              captures: { area_v2: $.data.version }
            - call: "POST /service-areas/${area_id}/risk-assessments"
              payload: { as_of_date: "2026-06-20", expected_service_area_version: "${area_v2}" }
              as: VectorEcologist
              as_user_id: "u-eco-1"
              captures: { ra2: $.data.id }
          trigger:
            - call: "POST /risk-assessments/${ra2}/confirm"
              payload: {}
              as: VectorEcologist
              as_user_id: "u-eco-1"
              captures: { index2: $.data.vector_index_confirmed }
          assert:
            - "${index1} == 24.00"
            - "${index2} == 0.00"
            - "RiskAssessment.${ra1}.status == SUPERSEDED"
            - "RiskAssessment.${ra2}.status == CONFIRMED"
            - "RiskAssessment.${ra2}.abundance_index == 0.00"
            - "ServiceArea.${area_id}.latest_confirmed_vector_index == 0.00"
            - "ServiceArea.${area_id}.risk_posture == NORMAL"
            - "ServiceArea.${area_id}.posture_source == INDEX"

  - section: consistency_model
    instances:
      - name: corner_immediate_consistency_of_cascade_in_same_request
        claim_type: immediate
        grounds:
          - state_machines.LabPool.IN_TESTING_to_RESULT_POSITIVE
          - calculations.area_risk_posture
        excluded_because:
          difficulty_instance: lab_positive_cascades_five_hops_to_service_request_priority
          rationale: "That §1.8 instance already asserts every hop of the cascade is visible on the immediately following reads, which is exactly the immediate-consistency claim; a separate corner test would duplicate it."

      - name: corner_derived_counters_reconciled_on_every_mutation
        claim_type: derived_field_reconciliation
        grounds:
          - calculations.service_request_count_partition
          - entities.ServiceArea.fields.request_open_count
        excluded_because:
          difficulty_instance: service_request_case_count_partition_unchanged_by_resolve_then_reopen
          rationale: "The four ServiceArea counters are asserted before and after the compensating REOPEN in that §1.8 instance, covering derived-field reconciliation for this scaffold's only denormalized counter set."
