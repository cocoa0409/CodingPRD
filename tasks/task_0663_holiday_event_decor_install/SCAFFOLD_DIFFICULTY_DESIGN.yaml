  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: storage_bay_capacity_conserved_on_lot_release
        grounds:
          - state_machines.StorageLot.STORED_to_RELEASED
          - state_machines.StorageLot.RESERVED_to_STORED
          - entities.StorageBay.fields.capacity_units
          - entities.StorageLot.fields.unit_count
        distinguishing_aspect: >
          Conserved quantity = bay free capacity (= capacity_units − sum of overlapping non-RELEASED
          lot unit_count). After reserving a 30-unit lot then releasing it, a second 100-unit lot on
          the same interval succeeds — free capacity returned to the full 100, proving the release
          fully compensated the reservation.
        test_recipe:
          setup:
            - "Bay capacity 100; contract reserves a 30-unit lot over [2027-01-01,2027-03-01), checks it in (STORED), then releases it (RELEASED)."
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "Romeo Co", account_type: "COMMERCIAL", contact_email: "r@romeo.test", site_address: "19 St" }
              as: AccountManager
              captures: { client_id: $.data.id }
            - call: "POST /storage-bays"
              payload: { bay_code: "BAY-R", capacity_units: 100 }
              as: FieldSupervisor
              captures: { bay_id: $.data.id }
            - call: "POST /clients/${client_id}/contracts"
              payload: { contract_type: "COMMERCIAL", season_year: 2026, early_bird_deadline: "2026-03-01T00:00:00Z" }
              as: AccountManager
              captures: { contract_id: $.data.id }
            - call: "POST /storage-lots"
              payload: { contract_id: "${contract_id}", storage_bay_id: "${bay_id}", unit_count: 30, stored_from: "2027-01-01T00:00:00Z", released_on: "2027-03-01T00:00:00Z" }
              as: FieldSupervisor
              captures: { lot_one: $.data.id }
            - call: "POST /storage-lots/${lot_one}/check-in"
              payload: {}
              as: FieldSupervisor
            - call: "POST /storage-lots/${lot_one}/release"
              payload: {}
              as: FieldSupervisor
          trigger:
            - call: "POST /storage-lots"
              payload: { contract_id: "${contract_id}", storage_bay_id: "${bay_id}", unit_count: 100, stored_from: "2027-01-01T00:00:00Z", released_on: "2027-03-01T00:00:00Z" }
              as: FieldSupervisor
              captures: { lot_two: $.data.id }
          trigger_note: "succeeds because released lot no longer occupies capacity"
          assert:
            - "response status == 201"
            - "StorageLot.${lot_two}.unit_count == 100"
            - "StorageLot.${lot_one}.status == RELEASED"

