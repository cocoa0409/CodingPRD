      - name: engagement_decay_holds_at_seven_days_and_drops_to_three_quarters_at_eight
        claim_type: precision
        grounds:
          - calculations.supporter_value_score
          - complexity_profile.temporal_semantics
          - entities.Supporter.fields.engagement_score
        distinguishing_aspect: "The decay bucket is chosen by an integer day count with an inclusive upper bound, so a PHONE action aged exactly 7 days still scores at factor 1.00 (4.00) and only at 8 days falls to 0.75 (3.25) - an implementation using a strict < 7 comparison drops a day early."
        test_recipe:
          setup:
            - "One ACTIVE campaign with one UNDECIDED legislator in HD-14."
            - "One PETITION supporter in HD-14 with EMAIL and PHONE consent."
            - "One PHONE action logged at clock 2026-08-01T00:00:00Z."
