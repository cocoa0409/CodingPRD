- rule_id: combinatorial_formula
  instances:
  - name: per_line_floor_discount_beats_sum_then_round
    grounds:
    - calculations.purchase_order_total
    distinguishing_aspect: 'Mode (b) nested rounding order: the pinned order floors the discount

      PER LINE then sums (79), while the rejected sum-then-round order would

      give 80 — a 1-cent observable difference on the same inputs.

      '
    test_recipe:
      setup:
      - ORG2 (STANDARD/STANDARD, idp [FIDO2], minimum 2)
      - KeyModels M-D (201c) and M-E (99c)
      - 'Subscription SUB2 ACTIVE: 100 credits, coverage 100c, percent_discount 10'
      - 'PO2 lines [{M-D,3},{M-E,3}]: line bases 603 and 297; coverage 100 absorbs into line 1; remainders 503 and 297; per-line 10% floors 50 + 29 = 79; final = 900 - 100 - 79 = 721'
      setup_api_calls:
      - call: POST /v1/organizations
        payload:
          legal_name: Rounding Org
          assurance_tier: STANDARD
          authentication_policy: STANDARD
          idp_protocols:
          - FIDO2
          backup_key_minimum: 2
        as: PlatformAdmin
        as_user_id: pa1
        captures:
          org2: $.data.id
      - call: POST /v1/key-models
        payload:
          model_code: M-D
          connectors:
          - USB_C
          protocols:
          - FIDO2
          form_factor: KEYCHAIN
          unit_price_cents: 201
        as: PlatformAdmin
        as_user_id: pa1
      - call: POST /v1/key-models
        payload:
          model_code: M-E
          connectors:
          - USB_C
          protocols:
          - FIDO2
          form_factor: NANO
          unit_price_cents: 99
        as: PlatformAdmin
        as_user_id: pa1
      - call: POST /v1/organizations/${org2}/subscriptions
        payload:
          tier: BASIC
          refresh_interval_days: 90
          replacement_credits_total: 100
          coverage_cents_total: 100
          percent_discount: 10
        as: ProcurementAdmin
        as_user_id: proca1
      - call: POST /v1/organizations/${org2}/purchase-orders
        payload:
          lines:
          - model_code: M-D
            quantity: 3
          - model_code: M-E
            quantity: 3
          shipping_location: HQ
        as: ProcurementAdmin
        as_user_id: proca1
        captures:
          po2: $.data.id
          po2_v: $.data.version
      trigger:
      - call: POST /v1/organizations/${org2}/purchase-orders/${po2}/approve
        payload:
          expected_purchase_order_version: ${po2_v}
        as: SecurityAdmin
        as_user_id: seca1
        captures:
          final2: $.data.final_total_cents
          disc2: $.data.quantity_discount_cents
          credit2: $.data.credit_applied_cents
      assert:
      - credit2 == 100
      - disc2 == 79
      - final2 == 721
      - disc2 != 80 (sum-then-round rejected)
  - name: discount_applies_to_post_coverage_remainder_not_base
    grounds:
    - calculations.purchase_order_total
    distinguishing_aspect: 'Mode (c) pinned evaluation order of a circular-looking dependency:

      the tier/percent discount is computed on the POST-COVERAGE remainder

      (5000 -> 250), never on the pre-coverage base (10000 -> 500), and the

      discount never feeds back into the coverage amount; effective percent

      is max(subscription percent_discount 3, volume tier 5) = 5 at the

      line_count == 50 inclusive boundary.

      '
    test_recipe:
      setup:
      - ORG3 (STANDARD/STANDARD, idp [FIDO2])
      - KeyModel M-F (200c)
      - 'Subscription SUB3 ACTIVE: 100 credits, coverage 5000c, percent_discount 3'
      - 'PO3 single line [{M-F,50}]: base 10000, coverage min(10000, 5000) = 5000, remainder 5000, tier at line_count 50 is 5% (>= inclusive), effective pct max(3,5)=5, discount 250, final 4750, credit_units
        ceil(5000/100)=50'
      setup_api_calls:
      - call: POST /v1/organizations
        payload:
          legal_name: Order Org
          assurance_tier: STANDARD
          authentication_policy: STANDARD
          idp_protocols:
          - FIDO2
          backup_key_minimum: 2
        as: PlatformAdmin
        as_user_id: pa1
        captures:
          org3: $.data.id
      - call: POST /v1/key-models
        payload:
          model_code: M-F
          connectors:
          - USB_C
          protocols:
          - FIDO2
          form_factor: KEYCHAIN
          unit_price_cents: 200
        as: PlatformAdmin
        as_user_id: pa1
      - call: POST /v1/organizations/${org3}/subscriptions
        payload:
          tier: ENTERPRISE
          refresh_interval_days: 90
          replacement_credits_total: 100
          coverage_cents_total: 5000
          percent_discount: 3
        as: ProcurementAdmin
        as_user_id: proca1
        captures:
          sub3: $.data.id
      - call: POST /v1/organizations/${org3}/purchase-orders
        payload:
          lines:
          - model_code: M-F
            quantity: 50
          shipping_location: HQ
        as: ProcurementAdmin
        as_user_id: proca1
        captures:
          po3: $.data.id
          po3_v: $.data.version
      trigger:
      - call: POST /v1/organizations/${org3}/purchase-orders/${po3}/approve
        payload:
          expected_purchase_order_version: ${po3_v}
        as: SecurityAdmin
        as_user_id: seca1
        captures:
          final3: $.data.final_total_cents
          disc3: $.data.quantity_discount_cents
          credit3: $.data.credit_applied_cents
          status3: $.data.status
      - call: GET /v1/organizations/${org3}/subscriptions
        payload: {}
        as: ProcurementAdmin
        as_user_id: proca1
        captures:
          sub3_used: $.data[0].credits_used
          sub3_cov_left: $.data[0].coverage_cents_remaining
      assert:
      - status3 == APPROVED
      - credit3 == 5000
      - disc3 == 250
      - final3 == 4750
      - disc3 != 500 (discount on pre-coverage base rejected)
      - sub3_used == 50
      - sub3_cov_left == 0
- rule_id: non_linear_state_machine
  instances:
  - name: enrollment_expiring_active_cycle_once_per_period
    grounds:
    - state_machines.EnrollmentCeremony.ACTIVE_to_EXPIRING
    - state_machines.EnrollmentCeremony.EXPIRING_to_ACTIVE
    distinguishing_aspect: 'Cyclic machine: ACTIVE -> EXPIRING (sweep) -> ACTIVE (renew) loops,

      and the cycle may be taken exactly once per EXPIRING entry — a second

      renew before the next sweep entry is rejected. Entity:

      EnrollmentCeremony.

      '
    test_recipe:
      setup:
      - ORG4 (STANDARD/STANDARD, idp [FIDO2], minimum 2)
      - KeyModel M-C; employee + account ACCT4; RECEIVED order with one VERIFIED DISTRIBUTED key K4; one ACTIVE enrollment EN4 activated at 2026-09-01 (expires 2027-09-01)
      - Clock advanced to 2027-08-10 (inside the 30-day EXPIRING window) and sweep run -> EN4 EXPIRING
      setup_api_calls:
      - call: POST /v1/organizations
        payload:
          legal_name: Cycle Org
          assurance_tier: STANDARD
          authentication_policy: STANDARD
          idp_protocols:
          - FIDO2
          backup_key_minimum: 2
        as: PlatformAdmin
        as_user_id: pa1
        captures:
          org4: $.data.id
      - call: POST /v1/key-models
        payload:
          model_code: M-C4
          connectors:
          - USB_C
          protocols:
          - FIDO2
          form_factor: KEYCHAIN
          unit_price_cents: 150
        as: PlatformAdmin
        as_user_id: pa1
      - call: POST /v1/organizations/${org4}/employees
        payload:
          employee_ref: E-C1
          location: HQ
          directory_user_id: u-c1
        as: SecurityAdmin
        as_user_id: seca1
        captures:
          acct4: $.data.identity_account_id
      - call: POST /v1/organizations/${org4}/purchase-orders
        payload:
          lines:
          - model_code: M-C4
            quantity: 1
          shipping_location: HQ
        as: ProcurementAdmin
        as_user_id: proca1
        captures:
          po4: $.data.id
          po4_v: $.data.version
      - call: POST /v1/organizations/${org4}/purchase-orders/${po4}/approve
        payload:
          expected_purchase_order_version: ${po4_v}
        as: SecurityAdmin
        as_user_id: seca1
      - call: POST /v1/organizations/${org4}/purchase-orders/${po4}/ship
        payload: {}
        as: LogisticsCoordinator
        as_user_id: logc1
      - call: POST /v1/organizations/${org4}/purchase-orders/${po4}/receive
        payload: {}
        as: LogisticsCoordinator
        as_user_id: logc1
      - call: POST /v1/organizations/${org4}/purchase-orders/${po4}/keys
        payload:
          keys:
          - serial_number: C-001
            firmware_version: 5.4.3
        as: LogisticsCoordinator
        as_user_id: logc1
        captures:
          k4: $.data[0].id
      - call: POST /v1/organizations/${org4}/security-keys/${k4}/attest
        payload: {}
        as: SecurityAdmin
        as_user_id: seca1
      - call: POST /v1/organizations/${org4}/security-keys/${k4}/assign
        payload:
          identity_account_id: ${acct4}
        as: SecurityAdmin
        as_user_id: seca1
      - call: POST /v1/organizations/${org4}/security-keys/${k4}/mark-distributed
        payload: {}
        as: LogisticsCoordinator
        as_user_id: logc1
      - call: POST /v1/identity-accounts/${acct4}/enrollments
        payload:
          security_key_id: ${k4}
        as: SecurityAdmin
        as_user_id: seca1
        captures:
          en4: $.data.id
      - call: GET /v1/identity-accounts/${acct4}
        payload: {}
        as: SecurityAdmin
        as_user_id: seca1
        captures:
          av4: $.data.version
      - call: POST /v1/identity-accounts/${acct4}/enrollments/${en4}/activate
        payload:
          expected_identity_account_version: ${av4}
        as: SecurityAdmin
        as_user_id: seca1
      - call: POST /v1/_clock/set_current_utc
        payload:
          to_iso8601: '2027-08-10T00:00:00Z'
        as: PlatformAdmin
        as_user_id: pa1
      - call: POST /v1/_ops/run_periodic
        payload: {}
        as: PlatformAdmin
        as_user_id: pa1
        captures:
          expiring4: $.data.enrollments_expiring
      trigger:
      - call: POST /v1/identity-accounts/${acct4}/enrollments/${en4}/renew
        payload: {}
        as: SecurityAdmin
        as_user_id: seca1
        captures:
          st_first: $.data.status
          exp_first: $.data.expires_at
      - call: POST /v1/identity-accounts/${acct4}/enrollments/${en4}/renew
        payload: {}
        as: SecurityAdmin
        as_user_id: seca1
        captures:
          err_second: $.data.error_id
      assert:
      - expiring4 == 1
      - st_first == ACTIVE
      - exp_first == 2028-08-09T00:00:00.000Z (now 2027-08-10 + 365 days, ISO8601 with millisecond precision)
      - err_second == ERR_INVALID_STATE (cyclic edge exhausted for this period)
  - name: security_key_parallel_dimensions_independent
    grounds:
    - state_machines.SecurityKey
    - entities.SecurityKey.fields.hardware_status
    - entities.SecurityKey.fields.attestation_status
    distinguishing_aspect: 'Parallel state dimensions on ONE entity: attestation_status moves

      UNVERIFIED -> VERIFIED while hardware_status stays PRE_REGISTERED;

      hardware_status then moves PRE_REGISTERED -> ASSIGNED ->

      DISTRIBUTED without touching attestation_status; and a later hardware

      transition to REVOKED leaves attestation_status VERIFIED. Different

      entity (SecurityKey) and different non-linear shape (parallel, not

      cyclic) from instance 1.

      '
    test_recipe:
      setup:
      - ORG5 (STANDARD/STANDARD, idp [FIDO2])
      - KeyModel M-G; RECEIVED order PO5 with one PRE_REGISTERED key K5
      setup_api_calls:
      - call: POST /v1/organizations
        payload:
