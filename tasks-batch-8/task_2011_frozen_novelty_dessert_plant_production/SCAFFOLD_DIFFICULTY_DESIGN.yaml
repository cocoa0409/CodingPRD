# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Task 2011: Frozen Novelty & Dessert Plant Production
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7; 2 instances per rule.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: run_mix_usage_standard_vs_metered
        grounds:
          - calculations.overrun_mix_usage
          - entities.ProductionRun.fields.mix_litres_theoretical
          - entities.ProductionRun.fields.overrun_actual_pct
          - entities.ProductionRun.fields.mix_cost_variance_cents
        distinguishing_aspect: |
          Dual-variant logic on the PRODUCTION-COSTING domain: the same completed run
          yields mix_litres_theoretical == 500.0 under the standard_cost variant (target
          overrun 40%) while the meter reading gives 460.0 actual litres, a 52.17%
          implied overrun and a +3400-cent favorable variance — two valid algorithms,
          different numbers, one dataset.
        test_recipe:
          setup:
            - "Product BAR-VAN-70: NOVELTY, VANILLA family, allergens [MILK], fill 70 ml/unit, target overrun 40%, 100 units/pallet, shelf life 540 days"
            - "NOVELTY line L-1 (12000 u/h), tunnel T-1 (20000 u/h), freezer zone Z-A (400 pallets)"
            - "Logical clock at 2026-08-10T08:00:00Z; mix batch MB-1 of 1000 litres pasteurized 08:00 (expires 2026-08-13T08:00) and RELEASED by a different user"
            - "Run R-1: 10000 planned units, scheduled 2026-08-10T14:00; changeover to BAR-VAN-70 VERIFIED; tunnel booked 13:00-15:00; mix assigned; run started"
          setup_api_calls:
            - { call: "POST /products", payload: { sku_code: "BAR-VAN-70", product_name: "Vanilla Bar 70ml", format: NOVELTY, flavor_family: VANILLA, allergens: [MILK], fill_volume_ml_per_unit: 70, target_overrun_pct: 40, units_per_pallet: 100, shelf_life_days: 540 }, as: PlantManager, captures: { p_bar: $.data.id } }
            - { call: "POST /lines", payload: { line_code: "L-1", format: NOVELTY, rate_units_per_hour: 12000 }, as: PlantManager, captures: { l1: $.data.id } }
            - { call: "POST /tunnels", payload: { tunnel_code: "T-1", max_units_per_hour: 20000 }, as: PlantManager, captures: { t1: $.data.id } }
            - { call: "POST /freezer-zones", payload: { zone_code: "Z-A", pallet_capacity: 400 }, as: PlantManager, captures: { z_a: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T08:00:00Z" }, as: PlantManager }
            - { call: "POST /mix-batches", payload: { batch_code: "MB-1", product_id: "${p_bar}", litres_produced: 1000 }, as: ProductionPlanner, captures: { m1: $.data.id } }
            - { call: "POST /mix-batches/${m1}/pasteurize", payload: {}, as: LineOperator, as_user_id: "op_1" }
            - { call: "POST /mix-batches/${m1}/release", payload: {}, as: QAManager, as_user_id: "qa_1" }
            - { call: "POST /production-runs", payload: { run_code: "R-1", product_id: "${p_bar}", line_id: "${l1}", planned_units: 10000, scheduled_start: "2026-08-10T14:00:00Z" }, as: ProductionPlanner, captures: { r1: $.data.id } }
            - { call: "POST /changeovers", payload: { line_id: "${l1}", to_product_id: "${p_bar}" }, as: ProductionPlanner, captures: { ch1: $.data.id } }
            - { call: "POST /changeovers/${ch1}/complete", payload: {}, as: LineOperator, as_user_id: "op_1" }
            - { call: "POST /changeovers/${ch1}/verify", payload: { outcome: PASS }, as: QAManager, as_user_id: "qa_1" }
            - { call: "POST /tunnel-bookings", payload: { tunnel_id: "${t1}", run_id: "${r1}", start_at: "2026-08-10T13:00:00Z", end_at: "2026-08-10T15:00:00Z" }, as: ProductionPlanner }
            - { call: "POST /production-runs/${r1}/assign-mix", payload: { mix_batch_id: "${m1}" }, as: ProductionPlanner }
            - { call: "POST /production-runs/${r1}/start", payload: {}, as: LineOperator, as_user_id: "op_1" }
          trigger:
            - call: "POST /production-runs/${r1}/complete"
              payload: { actual_units: 10000, mix_metered_litres: 460.0, zone_id: "${z_a}" }
              as: LineOperator
              as_user_id: "op_1"
              captures: { run_theo: $.data.mix_litres_theoretical, run_ovr: $.data.overrun_actual_pct, run_var: $.data.mix_cost_variance_cents }
          assert:
            - "trigger response mix_litres_theoretical == 500.0 (10000*70/(1+40/100)/1000 at target overrun)"
            - "trigger response overrun_actual_pct == 52.17 ((10000*70/(460.0*1000)-1)*100, 2dp round_half_up)"
            - "trigger response mix_cost_variance_cents == 3400 (500.0*85 - 460.0*85)"
            - "standard variant (500.0 litres) and metered variant (460.0 litres) disagree by 40.0 litres on identical inputs"

      - name: claim_payout_standard_vs_carrier_policy
        grounds:
          - calculations.claim_payout
          - calculations.temperature_replay
          - entities.TempAbuseClaim.fields.payout_standard_cents
          - entities.TempAbuseClaim.fields.payout_carrier_cents
        distinguishing_aspect: |
          Dual-variant logic on the CLAIMS domain (different entity domain than the
          run-costing instance): two shipments with byte-identical temperature logs and
          the same 180 abuse minutes pay out 39000 cents under STANDARD tiering but
          22000 cents under the CARRIER deductible/cap variant, selected by
          shipment.carrier_liability at approve.
        test_recipe:
          setup:
            - "Completed lot LOT-R-A with 10000 units of BAR-VAN-70 in zone Z-A (same run fixture as run_mix_usage_standard_vs_metered)"
            - "Customer C-DIST (DISTRIBUTOR); shipments SH-STD (carrier_liability false) and SH-CAR (carrier_liability true), each allocated 1000 units, loaded, dispatched 2026-08-12T08:00, identical readings (08:00 -19.0, 09:00 -16.0, 10:00 -16.0, 11:00 -20.0, 12:00 -15.0), delivered 2026-08-12T13:00"
            - "Claims CL-STD and CL-CAR filed by the customer with declared_value_cents 100000"
          setup_api_calls:
            - { call: "POST /products", payload: { sku_code: "BAR-VAN-70", product_name: "Vanilla Bar 70ml", format: NOVELTY, flavor_family: VANILLA, allergens: [MILK], fill_volume_ml_per_unit: 70, target_overrun_pct: 40, units_per_pallet: 100, shelf_life_days: 540 }, as: PlantManager, captures: { p_bar: $.data.id } }
            - { call: "POST /lines", payload: { line_code: "L-1", format: NOVELTY, rate_units_per_hour: 12000 }, as: PlantManager, captures: { l1: $.data.id } }
            - { call: "POST /tunnels", payload: { tunnel_code: "T-1", max_units_per_hour: 20000 }, as: PlantManager, captures: { t1: $.data.id } }
            - { call: "POST /freezer-zones", payload: { zone_code: "Z-A", pallet_capacity: 400 }, as: PlantManager, captures: { z_a: $.data.id } }
            - { call: "POST /customers", payload: { customer_code: "C-DIST", display_name: "Distributor Co", kind: DISTRIBUTOR }, as: PlantManager, captures: { c_dist: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T08:00:00Z" }, as: PlantManager }
            - { call: "POST /mix-batches", payload: { batch_code: "MB-1", product_id: "${p_bar}", litres_produced: 1000 }, as: ProductionPlanner, captures: { m1: $.data.id } }
            - { call: "POST /mix-batches/${m1}/pasteurize", payload: {}, as: LineOperator, as_user_id: "op_1" }
            - { call: "POST /mix-batches/${m1}/release", payload: {}, as: QAManager, as_user_id: "qa_1" }
            - { call: "POST /production-runs", payload: { run_code: "R-A", product_id: "${p_bar}", line_id: "${l1}", planned_units: 10000, scheduled_start: "2026-08-10T14:00:00Z" }, as: ProductionPlanner, captures: { r1: $.data.id } }
            - { call: "POST /changeovers", payload: { line_id: "${l1}", to_product_id: "${p_bar}" }, as: ProductionPlanner, captures: { ch1: $.data.id } }
            - { call: "POST /changeovers/${ch1}/complete", payload: {}, as: LineOperator, as_user_id: "op_1" }
            - { call: "POST /changeovers/${ch1}/verify", payload: { outcome: PASS }, as: QAManager, as_user_id: "qa_1" }
            - { call: "POST /tunnel-bookings", payload: { tunnel_id: "${t1}", run_id: "${r1}", start_at: "2026-08-10T13:00:00Z", end_at: "2026-08-10T15:00:00Z" }, as: ProductionPlanner }
            - { call: "POST /production-runs/${r1}/assign-mix", payload: { mix_batch_id: "${m1}" }, as: ProductionPlanner }
            - { call: "POST /production-runs/${r1}/start", payload: {}, as: LineOperator, as_user_id: "op_1" }
            - { call: "POST /production-runs/${r1}/complete", payload: { actual_units: 10000, mix_metered_litres: 460.0, zone_id: "${z_a}" }, as: LineOperator, as_user_id: "op_1" }
            - { call: "GET /inventory-lots", payload: { run_id: "${r1}" }, as: QAManager, captures: { lot1: "$.data[0].id" } }
            - { call: "POST /shipments", payload: { shipment_code: "SH-STD", customer_id: "${c_dist}", carrier_liability: false }, as: WarehouseLead, captures: { s_std: $.data.id } }
            - { call: "POST /shipments/${s_std}/allocations", payload: { lot_id: "${lot1}", units: 1000 }, as: WarehouseLead }
            - { call: "POST /shipments/${s_std}/load", payload: {}, as: WarehouseLead }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T08:00:00Z" }, as: PlantManager }
            - { call: "POST /shipments/${s_std}/dispatch", payload: {}, as: WarehouseLead }
            - { call: "POST /shipments/${s_std}/temperature-readings", payload: { readings: [ { recorded_at: "2026-08-12T08:00:00Z", temp_c: -19.0 }, { recorded_at: "2026-08-12T09:00:00Z", temp_c: -16.0 }, { recorded_at: "2026-08-12T10:00:00Z", temp_c: -16.0 }, { recorded_at: "2026-08-12T11:00:00Z", temp_c: -20.0 }, { recorded_at: "2026-08-12T12:00:00Z", temp_c: -15.0 } ] }, as: WarehouseLead }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T13:00:00Z" }, as: PlantManager }
            - { call: "POST /shipments/${s_std}/deliver", payload: {}, as: WarehouseLead }
            - { call: "POST /shipments", payload: { shipment_code: "SH-CAR", customer_id: "${c_dist}", carrier_liability: true }, as: WarehouseLead, captures: { s_car: $.data.id } }
            - { call: "POST /shipments/${s_car}/allocations", payload: { lot_id: "${lot1}", units: 1000 }, as: WarehouseLead }
            - { call: "POST /shipments/${s_car}/load", payload: {}, as: WarehouseLead }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-13T08:00:00Z" }, as: PlantManager }
            - { call: "POST /shipments/${s_car}/dispatch", payload: {}, as: WarehouseLead }
            - { call: "POST /shipments/${s_car}/temperature-readings", payload: { readings: [ { recorded_at: "2026-08-13T08:00:00Z", temp_c: -19.0 }, { recorded_at: "2026-08-13T09:00:00Z", temp_c: -16.0 }, { recorded_at: "2026-08-13T10:00:00Z", temp_c: -16.0 }, { recorded_at: "2026-08-13T11:00:00Z", temp_c: -20.0 }, { recorded_at: "2026-08-13T12:00:00Z", temp_c: -15.0 } ] }, as: WarehouseLead }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-13T13:00:00Z" }, as: PlantManager }
            - { call: "POST /shipments/${s_car}/deliver", payload: {}, as: WarehouseLead }
            - { call: "POST /temp-abuse-claims", payload: { claim_code: "CL-STD", shipment_id: "${s_std}", declared_value_cents: 100000 }, as: CustomerRep, as_user_id: "${c_dist}", captures: { cl_std: $.data.id } }
            - { call: "POST /temp-abuse-claims", payload: { claim_code: "CL-CAR", shipment_id: "${s_car}", declared_value_cents: 100000 }, as: CustomerRep, as_user_id: "${c_dist}", captures: { cl_car: $.data.id } }
          trigger:
            - call: "POST /temp-abuse-claims/${cl_std}/open-review"
              payload: {}
              as: ClaimsAdjuster
              captures: { std_abuse: $.data.abuse_minutes, std_pay: $.data.payout_standard_cents, std_carpay: $.data.payout_carrier_cents }
            - call: "POST /temp-abuse-claims/${cl_car}/open-review"
              payload: {}
              as: ClaimsAdjuster
              captures: { car_abuse: $.data.abuse_minutes, car_pay: $.data.payout_carrier_cents }
            - { call: "POST /temp-abuse-claims/${cl_std}/approve", payload: {}, as: ClaimsAdjuster, captures: { std_final: $.data.payout_cents, std_variant: $.data.payout_variant } }
            - { call: "POST /temp-abuse-claims/${cl_car}/approve", payload: {}, as: ClaimsAdjuster, captures: { car_final: $.data.payout_cents, car_variant: $.data.payout_variant } }
          assert:
            - "both claims replay identical logs: abuse_minutes == 180 and peak_temp_c == -15.0 on both"
            - "CL-STD.payout_standard_cents == 39000 ((120-30)*200 + (180-120)*350, capped at 100000)"
            - "CL-CAR.payout_carrier_cents == 22000 (max(0, 180*150 - 5000), cap 0.80*100000 = 80000 not binding)"
            - "approve selects by shipment.carrier_liability: CL-STD payout_variant == STANDARD and payout_cents == 39000; CL-CAR payout_variant == CARRIER and payout_cents == 22000"
            - "identical abuse_minutes produce different payouts (39000 != 22000) purely from the variant selection"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: changeover_matrix_set_containment_branches
        grounds:
          - calculations.changeover_matrix
          - entities.Changeover.fields.required_clean_level
          - entities.Changeover.fields.duration_minutes
        distinguishing_aspect: |
          Mode (a) combinatorial: the formula takes >= 3 inputs (from-allergens,
          to-allergens, flavor-family equality) with non-linear set-containment
          branching — the allergen branch DOMINATES the flavor branch, so
          NUT_BAKERY->VANILLA with [MILK,PEANUT,SOY]->[MILK] yields ALLERGEN_CIP(240),
          NUT_BAKERY->CHOCOLATE with [MILK,PEANUT,SOY]->[MILK,PEANUT,SOY,WHEAT] yields
          WASH(90) (superset, family differs), and NUT_BAKERY->NUT_BAKERY with
          [MILK,PEANUT,SOY]->[MILK,PEANUT,SOY,WHEAT] yields RINSE(30).
        test_recipe:
          setup:
            - "Products: NUTBAR (NUT_BAKERY, [MILK,PEANUT,SOY]), VANBAR (VANILLA, [MILK]), CHOCSUP (CHOCOLATE, [MILK,PEANUT,SOY,WHEAT]), NUTBAR-2 (NUT_BAKERY, [MILK,PEANUT,SOY,WHEAT])"
            - "Line L-MIX (NOVELTY) has a COMPLETED run of NUTBAR, so last_product_id = NUTBAR"
          setup_api_calls:
            - { call: "POST /products", payload: { sku_code: "NUTBAR", product_name: "Nut Bar", format: NOVELTY, flavor_family: NUT_BAKERY, allergens: [MILK, PEANUT, SOY], fill_volume_ml_per_unit: 70, target_overrun_pct: 40, units_per_pallet: 100, shelf_life_days: 540 }, as: PlantManager, captures: { p_nut: $.data.id } }
            - { call: "POST /products", payload: { sku_code: "VANBAR", product_name: "Vanilla Bar", format: NOVELTY, flavor_family: VANILLA, allergens: [MILK], fill_volume_ml_per_unit: 70, target_overrun_pct: 40, units_per_pallet: 100, shelf_life_days: 540 }, as: PlantManager, captures: { p_van: $.data.id } }
            - { call: "POST /products", payload: { sku_code: "CHOCSUP", product_name: "Choc Supreme", format: NOVELTY, flavor_family: CHOCOLATE, allergens: [MILK, PEANUT, SOY, WHEAT], fill_volume_ml_per_unit: 70, target_overrun_pct: 40, units_per_pallet: 100, shelf_life_days: 540 }, as: PlantManager, captures: { p_choc: $.data.id } }
            - { call: "POST /products", payload: { sku_code: "NUTBAR-2", product_name: "Nut Bar Light", format: NOVELTY, flavor_family: NUT_BAKERY, allergens: [MILK, PEANUT, SOY, WHEAT], fill_volume_ml_per_unit: 70, target_overrun_pct: 40, units_per_pallet: 100, shelf_life_days: 540 }, as: PlantManager, captures: { p_nut2: $.data.id } }
            - { call: "POST /lines", payload: { line_code: "L-MIX", format: NOVELTY, rate_units_per_hour: 12000 }, as: PlantManager, captures: { lmix: $.data.id } }
            - { call: "POST /tunnels", payload: { tunnel_code: "T-1", max_units_per_hour: 20000 }, as: PlantManager, captures: { t1: $.data.id } }
            - { call: "POST /freezer-zones", payload: { zone_code: "Z-A", pallet_capacity: 400 }, as: PlantManager, captures: { z_a: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T08:00:00Z" }, as: PlantManager }
            - { call: "POST /mix-batches", payload: { batch_code: "MB-N", product_id: "${p_nut}", litres_produced: 200 }, as: ProductionPlanner, captures: { m1: $.data.id } }
            - { call: "POST /mix-batches/${m1}/pasteurize", payload: {}, as: LineOperator, as_user_id: "op_1" }
            - { call: "POST /mix-batches/${m1}/release", payload: {}, as: QAManager, as_user_id: "qa_1" }
            - { call: "POST /production-runs", payload: { run_code: "R-NUT", product_id: "${p_nut}", line_id: "${lmix}", planned_units: 1000, scheduled_start: "2026-08-10T14:00:00Z" }, as: ProductionPlanner, captures: { r1: $.data.id } }
            - { call: "POST /changeovers", payload: { line_id: "${lmix}", to_product_id: "${p_nut}" }, as: ProductionPlanner, captures: { ch0: $.data.id } }
            - { call: "POST /changeovers/${ch0}/complete", payload: {}, as: LineOperator, as_user_id: "op_1" }
            - { call: "POST /changeovers/${ch0}/verify", payload: { outcome: PASS }, as: QAManager, as_user_id: "qa_1" }
            - { call: "POST /tunnel-bookings", payload: { tunnel_id: "${t1}", run_id: "${r1}", start_at: "2026-08-10T13:00:00Z", end_at: "2026-08-10T14:00:00Z" }, as: ProductionPlanner }
            - { call: "POST /production-runs/${r1}/assign-mix", payload: { mix_batch_id: "${m1}" }, as: ProductionPlanner }
            - { call: "POST /production-runs/${r1}/start", payload: {}, as: LineOperator, as_user_id: "op_1" }
            - { call: "POST /production-runs/${r1}/complete", payload: { actual_units: 1000, mix_metered_litres: 40.0, zone_id: "${z_a}" }, as: LineOperator, as_user_id: "op_1" }
          trigger:
            - call: "POST /changeovers"
              payload: { line_id: "${lmix}", to_product_id: "${p_van}" }
              as: ProductionPlanner
              captures: { chA_level: $.data.required_clean_level, chA_dur: $.data.duration_minutes, chA: $.data.id }
            - { call: "POST /changeovers/${chA}/complete", payload: {}, as: LineOperator, as_user_id: "op_1" }
            - { call: "POST /changeovers/${chA}/verify", payload: { outcome: PASS }, as: QAManager, as_user_id: "qa_1" }
            - call: "POST /changeovers"
              payload: { line_id: "${lmix}", to_product_id: "${p_choc}" }
              as: ProductionPlanner
              captures: { chB_level: $.data.required_clean_level, chB_dur: $.data.duration_minutes, chB: $.data.id }
            - { call: "POST /changeovers/${chB}/complete", payload: {}, as: LineOperator, as_user_id: "op_1" }
            - { call: "POST /changeovers/${chB}/verify", payload: { outcome: PASS }, as: QAManager, as_user_id: "qa_1" }
            - call: "POST /changeovers"
              payload: { line_id: "${lmix}", to_product_id: "${p_nut2}" }
              as: ProductionPlanner
              captures: { chC_level: $.data.required_clean_level, chC_dur: $.data.duration_minutes }
          assert:
            - "NUTBAR->VANBAR: required_clean_level == ALLERGEN_CIP and duration_minutes == 240 (from-allergens [MILK,PEANUT,SOY] not subset of [MILK])"
            - "NUTBAR->CHOCSUP: required_clean_level == WASH and duration_minutes == 90 (allergen subset holds, flavor family differs)"
            - "NUTBAR->NUTBAR-2: required_clean_level == RINSE and duration_minutes == 30 (from-allergens [MILK,PEANUT,SOY] subset of [MILK,PEANUT,SOY,WHEAT], same flavor family)"
            - "all three changeovers snapshot from_product_id == ${p_nut} (line.last_product_id unchanged because no run completed between them)"

      - name: zone_pallet_occupancy_per_lot_ceil_then_sum
        grounds:
          - calculations.freezer_zone_capacity
          - entities.InventoryLot.fields.pallets
          - entities.FreezerZone.fields.occupied_pallets
        distinguishing_aspect: |
          Mode (b) nested-rounding-order: two lots of 150 units each at 100 units/pallet
          occupy 2 + 2 = 4 pallets under the pinned per-lot-ceil-then-sum order, while
          the unpinned sum-then-ceil order would give ceil(300/100) = 3 — the orders
          observably diverge.
        test_recipe:
          setup:
            - "Product BULK-PINT (BULK, VANILLA, [MILK], units_per_pallet 100, shelf 540)"
            - "Zone Z-R with pallet_capacity 10; two runs of 150 actual units each complete into Z-R"
          setup_api_calls:
            - { call: "POST /products", payload: { sku_code: "BULK-PINT", product_name: "Vanilla Pint", format: BULK, flavor_family: VANILLA, allergens: [MILK], fill_volume_ml_per_unit: 473, target_overrun_pct: 30, units_per_pallet: 100, shelf_life_days: 540 }, as: PlantManager, captures: { p_pint: $.data.id } }
            - { call: "POST /lines", payload: { line_code: "L-B", format: BULK, rate_units_per_hour: 8000 }, as: PlantManager, captures: { lb: $.data.id } }
            - { call: "POST /tunnels", payload: { tunnel_code: "T-2", max_units_per_hour: 20000 }, as: PlantManager, captures: { t2: $.data.id } }
            - { call: "POST /freezer-zones", payload: { zone_code: "Z-R", pallet_capacity: 10 }, as: PlantManager, captures: { zr: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T08:00:00Z" }, as: PlantManager }
            - { call: "POST /mix-batches", payload: { batch_code: "MB-P", product_id: "${p_pint}", litres_produced: 500 }, as: ProductionPlanner, captures: { m1: $.data.id } }
            - { call: "POST /mix-batches/${m1}/pasteurize", payload: {}, as: LineOperator, as_user_id: "op_1" }
            - { call: "POST /mix-batches/${m1}/release", payload: {}, as: QAManager, as_user_id: "qa_1" }
            - { call: "POST /production-runs", payload: { run_code: "R-P1", product_id: "${p_pint}", line_id: "${lb}", planned_units: 150, scheduled_start: "2026-08-10T14:00:00Z" }, as: ProductionPlanner, captures: { rp1: $.data.id } }
            - { call: "POST /changeovers", payload: { line_id: "${lb}", to_product_id: "${p_pint}" }, as: ProductionPlanner, captures: { chp1: $.data.id } }
            - { call: "POST /changeovers/${chp1}/complete", payload: {}, as: LineOperator, as_user_id: "op_1" }
            - { call: "POST /changeovers/${chp1}/verify", payload: { outcome: PASS }, as: QAManager, as_user_id: "qa_1" }
            - { call: "POST /tunnel-bookings", payload: { tunnel_id: "${t2}", run_id: "${rp1}", start_at: "2026-08-10T13:00:00Z", end_at: "2026-08-10T14:00:00Z" }, as: ProductionPlanner }
