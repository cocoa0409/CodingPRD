  # ===========================================================================
  - section: state_machines
    instances:

      - name: every_machine_assigns_its_declared_initial_state_on_create
        claim_type: Initial State
        grounds:
          - state_machines.MaterialLot.initial_state
          - state_machines.ProductSpecification.initial_state
          - state_machines.FillRun.initial_state
          - state_machines.StabilityStudy.initial_state
          - state_machines.BridgingStudy.initial_state
          - state_machines.Complaint.initial_state
          - state_machines.DistributionOrder.initial_state
        distinguishing_aspect: "One sweep pins the initial state of seven machines in a single fixture, including the two easy-to-get-wrong ones: ProductSpecification starts at DESIGN (not CLEARED) and StabilityStudy starts at PROTOCOL_DRAFT (not APPROVED)."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; one MaterialSpecification, one ProductSpecification, one PLANNED ReagentLot, and a second RELEASED-capable lot is NOT needed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /material-specifications"
              payload: { material_code: "AB-SM-1", material_type: "ANTIBODY", potency_min_pct: 90.0, potency_max_pct: 110.0, endotoxin_max_eu_per_ml: 2.0, purity_min_pct: 95.0, required_test_codes: ["POTENCY"], is_critical: false, acceptance_mode: "ALL_PASS", max_retests: 1, retest_window_days: 30 }
              as: RegulatoryAffairs
              as_user_id: "ra-01"
              captures: { ms_id: $.data.id }
            - call: "POST /material-lots"
              payload: { material_specification_id: "${ms_id}", vendor_lot_code: "V-SM-1", received_quantity_units: 500.0, expiry_date: "2027-12-31T00:00:00Z" }
              as: ProductionOperator
              captures: { ml_id: $.data.id, ml_status: $.data.qualification_status }
            - call: "POST /product-specifications"
              payload: { product_code: "IVD-SM-1", reference_material_code: "REF-SM1", required_material_codes: [], release_test_codes: ["ACTIVITY"], max_reference_bias_pct: 5.0, shelf_life_months_claim: 12, storage_condition: "TWO_TO_EIGHT_C", min_shelf_life_days_at_ship: 90 }
              as: RegulatoryAffairs
              as_user_id: "ra-01"
              captures: { ps_id: $.data.id, ps_status: $.data.clearance_status }
            - call: "POST /reagent-lots"
              payload: { product_specification_id: "${ps_id}", lot_code: "SM-LOT-1", planned_units: 200 }
              as: ProductionOperator
              captures: { rl_id: $.data.id }
            - call: "POST /reagent-lots"
              payload: { product_specification_id: "${ps_id}", lot_code: "SM-LOT-2", planned_units: 200 }
              as: ProductionOperator
              captures: { rl2_id: $.data.id }
          trigger:
            - call: "POST /fill-runs"
              payload: { reagent_lot_id: "${rl_id}", line_code: "LINE-S", formulation_batch_code: "BULK-S1", scheduled_start: "2026-08-10T06:00:00Z", scheduled_end: "2026-08-10T10:00:00Z", planned_fill_units: 200 }
              as: ProductionOperator
              captures: { fr_id: $.data.id, fr_status: $.data.status }
            - call: "POST /stability-studies"
              payload: { product_specification_id: "${ps_id}", reagent_lot_id: "${rl_id}", study_type: "REAL_TIME", chamber_code: "CH-S1", storage_temp_c: 5.0, protocol_start: "2026-09-01T00:00:00Z", protocol_end: "2026-12-01T00:00:00Z", planned_timepoints_months: [0, 3], baseline_value: 100.0 }
              as: RegulatoryAffairs
              as_user_id: "ra-01"
              captures: { ss_id: $.data.id, ss_status: $.data.status }
            - call: "POST /bridging-studies"
              payload: { predicate_lot_id: "${rl_id}", candidate_lot_id: "${rl2_id}", changed_material_lot_id: "${ml_id}", paired_test_codes: ["ACTIVITY"] }
              as: RegulatoryAffairs
              as_user_id: "ra-01"
              captures: { bs_id: $.data.id, bs_status: $.data.status }
            - call: "POST /complaints"
              payload: { reagent_lot_id: "${rl_id}", complaint_code: "CPL-SM-1", narrative: "Customer reports drift on control level 2." }
              as: RegulatoryAffairs
              as_user_id: "ra-01"
              captures: { cp_id: $.data.id, cp_status: $.data.status }
            - call: "POST /distribution-orders"
              payload: { product_specification_id: "${ps_id}", customer_code: "CUST-SM", requested_units: 100, required_min_shelf_life_days: 90, ship_by: "2026-12-31T00:00:00Z" }
              as: DistributionPlanner
              as_user_id: "dp-01"
              captures: { do_id: $.data.id, do_status: $.data.status }
          assert:
            - "MaterialLot.qualification_status == RECEIVED"
            - "ProductSpecification.clearance_status == DESIGN and design_trace_complete == false, with submission_ref and cleared_at null"
            - "ReagentLot.disposition_status == PLANNED and distribution_status == WITHHELD"
            - "FillRun.status == SCHEDULED with started_at and ended_at null, minor_excursion_count 0, major_excursion_count 0 and environmental_state CONFORMING"
            - "StabilityStudy.status == PROTOCOL_DRAFT with timepoint_count 0, last_conforming_month null and established_shelf_life_months null"
            - "BridgingStudy.status == DRAFT with equivalence_verdict PENDING and decided_at null"
            - "Complaint.status == RECEIVED with severity, malfunction_suspected, reportable and report_due_at all null before triage, and received_at == 2026-08-01T00:00:00.000Z"
            - "DistributionOrder.status == DRAFT with allocated_units 0 and shortfall_units 100"

      - name: fill_run_complete_from_scheduled_returns_state_invalid
        claim_type: Invalid Transitions
        grounds:
          - state_machines.FillRun.transitions
          - errors.ERR_FILL_RUN_STATE_INVALID
          - validations.priority_60
        distinguishing_aspect: "complete is declared only from RUNNING, so firing it on a freshly created SCHEDULED run must 409 — and critically must NOT set filled_units or move the ReagentLot to FILLED as a side effect of the failed call."
        test_recipe:
          setup:
            - "One PLANNED ReagentLot with one SCHEDULED FillRun of 200 planned units; the run has never been started."
          setup_api_calls:
            - call: "POST /product-specifications"
              payload: { product_code: "IVD-SM-2", reference_material_code: "REF-SM2", required_material_codes: [], release_test_codes: ["ACTIVITY"], max_reference_bias_pct: 5.0, shelf_life_months_claim: 12, storage_condition: "TWO_TO_EIGHT_C", min_shelf_life_days_at_ship: 90 }
              as: RegulatoryAffairs
              as_user_id: "ra-01"
              captures: { ps_id: $.data.id }
            - call: "POST /reagent-lots"
              payload: { product_specification_id: "${ps_id}", lot_code: "SM-LOT-3", planned_units: 200 }
              as: ProductionOperator
              captures: { rl_id: $.data.id }
            - call: "POST /fill-runs"
              payload: { reagent_lot_id: "${rl_id}", line_code: "LINE-S", formulation_batch_code: "BULK-S2", scheduled_start: "2026-08-11T06:00:00Z", scheduled_end: "2026-08-11T10:00:00Z", planned_fill_units: 200 }
              as: ProductionOperator
              captures: { fr_id: $.data.id }
          trigger:
            - call: "POST /fill-runs/${fr_id}/complete"
              payload: { filled_units: 200 }
              as: ProductionOperator
              captures: { err: $.data.error_id }
            - call: "GET /fill-runs/${fr_id}"
              payload: {}
              as: ProductionOperator
              captures: { status_after: $.data.status, filled_after: $.data.filled_units }
            - call: "GET /reagent-lots/${rl_id}"
              payload: {}
              as: ProductionOperator
              captures: { lot_status_after: $.data.disposition_status }
          assert:
            - "HTTP 409 with error_id ERR_FILL_RUN_STATE_INVALID"
            - "the run is still SCHEDULED with filled_units 0 and ended_at null"
            - "the ReagentLot is still PLANNED with filled_units 0 — a rejected transition applies no side effect"

      - name: fill_run_start_twice_returns_state_invalid_on_the_second_call
        claim_type: Idempotency
        grounds:
          - state_machines.FillRun.transitions.SCHEDULED_to_RUNNING
          - state_machines.ReagentLot.transitions.PLANNED_to_IN_PROCESS
          - errors.ERR_FILL_RUN_STATE_INVALID
        distinguishing_aspect: "The first start is the only valid one; replaying it must 409 rather than re-stamping started_at or double-bumping the ReagentLot, which would corrupt the parallel machine's disposition dimension."
        test_recipe:
          setup:
            - "Clock at 2026-08-11T06:00:00Z. One QUALIFIED MaterialLot AB-SM-3 of 500.00 units, one PLANNED ReagentLot SM-LOT-4 with one CONSUMED component, one SCHEDULED FillRun."
