              payload: {}
              as: EngineeringLead
              as_user_id: "eng-1"
            - call: "POST /engineering-changes/${ecs_id}/start-review"
              payload: {}
              as: EngineeringLead
              as_user_id: "eng-1"
            - call: "POST /engineering-changes/${ecs_id}/decide"
              payload: { decision: "APPROVE" }
              as: EngineeringLead
              as_user_id: "eng-2"
            - *c_stop1
            - call: "POST /engineering-changes/${ecs_id}/cut-in"
              payload: {}
              as: EngineeringLead
              as_user_id: "eng-2"
          trigger:
            - call: "POST /parts/${p_doorb_id}/obsolete"
              payload: {}
              as: PlantAdmin
              captures: { err_s0_id: $.data.error_id }
            - call: "POST /parts/${p_door_id}/obsolete"
              payload: {}
