            - call: "POST /reit-compliance/shareholder-snapshots/${snap_id}/finalize"
              payload: {}
              as: ComplianceOfficer
              captures: { top5: $.data.top5_individual_pct, passed: $.data.five_fifty_passed }
          assert:
            - "top5_individual_pct == 45.0 (the 55% ENTITY holder is excluded from the individual test)"
            - "five_fifty_passed == true"

      - name: prohibited_sale_at_exactly_24_months_is_safe
        claim_type: boundary_edge
        grounds: [calculations.calc_prohibited_transaction]
        distinguishing_aspect: "The 24-month safe harbor is inclusive: a dealer asset held exactly 24 months (720 days) escapes the 100% tax (is_prohibited false, tax 0), while 719 days would trigger it."
        test_recipe:
          setup: ["Reit R1 ACTIVE; dealer asset acquired 2024-06-15, sale date 2026-06-09 (720 days -> 24 months floor)"]
          setup_api_calls:
            - call: "POST /reit-compliance/reits"
              payload: { legal_name: "C6 REIT", ticker: "C6RE", charter_ownership_limit_pct: 9.8, taxable_year_start: "2026-01-01" }
