            - "trigger step 4: ${eng_ad27_id} has benchmark_percentile 74, total_cost_bps 20.00 and fiscal_quarter_index 0, yet rfp_required == true because last_rfp_quarter_index IS NULL — the never-benchmarked arm fires on its own"
            - "trigger step 5 also pins the tier edge: gross_cost_bps == 25.00 gives fee_credit_tier == TIER_A with offset_bps 0.00 and total_cost_bps == 25.00"
            - "trigger step 6: ${eng_au27_id} gross_cost_bps == 25.01 gives fee_credit_tier == TIER_B (offset_bps 5.00 by tier, forced to 0.00 by the zero balance) and total_cost_bps == 25.01 with rfp_required == false"
            - "every benchmarked engagement has last_benchmarked_quarter_index == 0, and a second benchmark of any of them in quarter 0 would return ERR_BENCHMARK_ALREADY_CURRENT"
            - "no engagement's total_cost_bps was used to pick its own tier: ${eng_rk26_id} stays TIER_C at total 60.00 rather than being re-tiered to TIER_C-after-offset, and ${eng_au27_id} stays TIER_B at total 25.01 rather than dropping to TIER_A"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: ips_adopt_gated_by_motion_and_meeting_rows_not_by_its_own_status
        grounds:
          - state_machines.InvestmentPolicyStatement.DRAFT_to_ADOPTED
          - state_machines.InvestmentPolicyStatement.DRAFT_to_RETIRED
          - state_machines.CommitteeMeeting.ADJOURNED_to_MINUTES_APPROVED
          - state_machines.Motion.OPEN_to_CARRIED
          - validations[priority=60]
          - validations[priority=61]
          - entities.Motion.fields.status
          - entities.CommitteeMeeting.fields.status
          - entities.InvestmentPolicyStatement.fields.approving_motion_id
        distinguishing_aspect: |
          The identical adopt call on an unchanged DRAFT IPS returns ERR_MOTION_NOT_CARRIED, then
          ERR_MINUTES_NOT_APPROVED twice (IN_SESSION and ADJOURNED), then 200 — every verdict is decided
          by the Motion and CommitteeMeeting rows, and a carried motion pointed at a sibling IPS is
          refused with ERR_MOTION_SUBJECT_MISMATCH rather than adopting the wrong version.
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; Plan.fiscal_quarter_index 0; charter ADOPTED; two ACTIVE trained members on voting seats."
            - "Two DRAFT InvestmentPolicyStatement rows: IPS-2026-P (the intended one) and IPS-2026-Q (the decoy sibling)."
            - "One IN_SESSION CommitteeMeeting with an OPEN IPS_ADOPTION motion whose subject_id is IPS-2026-P."
