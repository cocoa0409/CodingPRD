            - { call: "POST /midway/inspection-appointments/${appt_b}/complete", payload: { outcome: "PASS" }, as: StateInspector, as_user_id: "${appt_b_insp}" }
            - { call: "GET /midway/fairs/${fair_a}", as: FairManager, as_user_id: "${sup_a}", captures: { fair_a_v: "$.data.version" } }
            - { call: "POST /midway/permits/${permit_a}/approve", payload: { expected_fair_version: "${fair_a_v}" }, as: StateInspector, as_user_id: "${insp2_id}" }
            - { call: "GET /midway/fairs/${fair_b}", as: FairManager, as_user_id: "${sup_b}", captures: { fair_b_v: "$.data.version" } }
