      - name: rbac_missing_headers_returns_unauthenticated
        claim_type: peer_roles
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]", endpoints]
        distinguishing_aspect: "A request with an unknown X-User-Role returns ERR_UNAUTHENTICATED 401 before any business logic."
        test_recipe:
          setup: ["A county exists; the read call uses an unknown role."]
