              captures: { ctr_v1: $.data.version }
          trigger:
            - call: "POST /pipeline-nominations"
              payload: { contract_id: "${contract_id}", plant_id: "${plant_id}", gas_day_start: "2026-09-05T00:00:00Z", gas_day_end: "2026-09-06T00:00:00Z", nominated_dth: 2400.0, expected_contract_version: "${ctr_v1}" }
              as: CommercialScheduler
              captures: { err_id: $.data.error_id }
          assert:
