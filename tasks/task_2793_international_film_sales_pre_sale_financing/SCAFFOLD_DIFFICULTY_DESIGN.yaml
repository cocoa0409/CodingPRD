# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
#   task_2793 — International Film Sales & Pre-Sale Financing
#   Every rule_id below is verbatim from §0.5; every grounds ref resolves into
#   SCAFFOLD.yaml §1.1–§1.7. 19 instances across the 9 rules.
#
#   Canonical fixture used by most chains (all figures computed, not estimated):
#     Film "Northern Lights"  ACTION, budget 24000000.00, cast score 88,
#                             theatrical_release_date 2027-04-15
#     Territory DE            base_value_index 1.20, market_tier 1
#     Comps (ACTION/DE/verified) 800000.00, 1000000.00, 1200000.00 -> median 1000000.00
#     Agreement               commission_pct 0.10, expense_cap 75000.00, 24 months
#     Buyer "Rhein Films"     AAA, ACTIVE, exposure_limit 3000000.00
#     Contract                MG 2000000.00, 24 months, holdback 60 days
#     Milestones              0.45/0.20/0.10/0.25 -> 900000/400000/200000/500000
#     Clock default           2026-08-01T00:00:00Z
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: territory_value_estimate_diverges_between_comparable_weighted_and_cast_adjusted
        grounds:
          - calculations.territory_value_estimate
          - entities.TerritoryValuation.fields.method
          - entities.TerritoryValuation.fields.cast_multiplier
          - entities.TerritoryValuation.fields.estimate_usd
          - entities.TerritoryValuation.fields.floor_price_usd
          - entities.Film.fields.principal_cast_score
          - entities.Territory.fields.base_value_index
        distinguishing_aspect: |
          Domain = territory pricing. On byte-identical comparable data and one film with
          principal_cast_score 88, COMPARABLE_WEIGHTED forces cast_multiplier to exactly 1.00 and
          yields estimate_usd 1200000.00, while CAST_ADJUSTED applies the >=85 cast tier 1.40 and
          yields exactly 1680000.00 — a 480000.00 delta that is exactly 1.40x, so the two variants
          cannot be collapsed into one code path.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z, so the comparable lookback window admits release_year >= 2019."
            - "One ACTION film with principal_cast_score 88 (>= 85, the top cast tier)."
            - "Territory DE with base_value_index 1.20."
            - "Exactly three verified ACTION comps in DE with fees 800000.00, 1000000.00 and 1200000.00 — an odd sample whose median is the middle element 1000000.00."
            - "No valuation exists yet for the (film, DE) pair."
          setup_api_calls:
            - call: "POST /film-sales/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /film-sales/films"
              payload: { title: "Northern Lights", genre: "ACTION", production_budget_usd: 24000000.00, principal_cast_score: 88, estimated_delivery_date: "2027-02-28T00:00:00Z", theatrical_release_date: "2027-04-15T00:00:00Z" }
              as: PlatformAdmin
              captures: { film_id: $.data.id }
            - call: "POST /film-sales/territories"
              payload: { code: "DE", name: "Germany", region: "EMEA", market_tier: 1, currency_code: "EUR", base_value_index: 1.20 }
              as: PlatformAdmin
              captures: { terr_de_id: $.data.id }
            - call: "POST /film-sales/territories/${terr_de_id}/comparable-titles"
              payload: { name: "Comp Alpha", genre: "ACTION", cast_score: 80, gross_license_fee_usd: 800000.00, release_year: 2022, verified: true }
              as: PlatformAdmin
            - call: "POST /film-sales/territories/${terr_de_id}/comparable-titles"
              payload: { name: "Comp Beta", genre: "ACTION", cast_score: 74, gross_license_fee_usd: 1000000.00, release_year: 2023, verified: true }
              as: PlatformAdmin
            - call: "POST /film-sales/territories/${terr_de_id}/comparable-titles"
              payload: { name: "Comp Gamma", genre: "ACTION", cast_score: 91, gross_license_fee_usd: 1200000.00, release_year: 2021, verified: true }
              as: PlatformAdmin
          trigger:
            - call: "POST /film-sales/territory-valuations"
              payload: { film_id: "${film_id}", territory_id: "${terr_de_id}", method: "COMPARABLE_WEIGHTED" }
              as: SalesAgent
              captures: { val_cw_id: $.data.id }
            - call: "POST /film-sales/territory-valuations"
              payload: { film_id: "${film_id}", territory_id: "${terr_de_id}", method: "CAST_ADJUSTED" }
              as: SalesAgent
              captures: { val_ca_id: $.data.id }
          assert:
            - "TerritoryValuation.${val_cw_id}.comp_sample_size == 3"
            - "TerritoryValuation.${val_cw_id}.comp_median_usd == 1000000.00"
            - "TerritoryValuation.${val_cw_id}.cast_multiplier == 1.00"
            - "TerritoryValuation.${val_cw_id}.estimate_usd == 1200000.00"
            - "TerritoryValuation.${val_cw_id}.ask_price_usd == 1500000.00"
            - "TerritoryValuation.${val_cw_id}.floor_price_usd == 840000.00"
            - "TerritoryValuation.${val_ca_id}.comp_median_usd == 1000000.00"
            - "TerritoryValuation.${val_ca_id}.cast_multiplier == 1.40"
            - "TerritoryValuation.${val_ca_id}.estimate_usd == 1680000.00"
            - "TerritoryValuation.${val_ca_id}.ask_price_usd == 2100000.00"
            - "TerritoryValuation.${val_ca_id}.floor_price_usd == 1176000.00"
            - "TerritoryValuation.${val_ca_id}.estimate_usd - TerritoryValuation.${val_cw_id}.estimate_usd == 480000.00"
            - "both valuations have status == DRAFT"

      - name: buyer_exposure_diverges_between_gross_pipeline_and_net_unpaid_after_first_receipt
        grounds:
          - calculations.buyer_exposure
          - entities.Buyer.fields.outstanding_exposure_usd
          - entities.Buyer.fields.net_unpaid_exposure_usd
          - entities.PaymentMilestone.fields.status
          - state_machines.PaymentMilestone.INVOICED_to_RECEIVED
          - validations[priority=100]
          - validations[priority=101]
        distinguishing_aspect: |
          Domain = buyer credit, not territory pricing. On one EXECUTED contract with MG 2000000.00
          and one 900000.00 milestone already RECEIVED, GROSS_PIPELINE still reads the whole MG
          (2000000.00) while NET_UNPAID reads only the unbilled/unpaid milestone amounts
          (1100000.00); the 900000.00 delta proves cash received is removed from one basis and not
          the other, and the two feed different gates (raw limit vs 1.50x headroom).
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; agency agreement EXECUTED and in term; film IN_MARKET with one PUBLISHED CAST_ADJUSTED valuation for DE (floor 1176000.00)."
            - "Buyer Rhein Films is AAA/ACTIVE with exposure_limit_usd 3000000.00."
            - "One contract MG 2000000.00 executed, with a four-line milestone schedule 900000/400000/200000/500000 summing to exactly 1.0000 of the MG."
            - "An OPEN collection account exists so cash can be posted."
          setup_api_calls:
            - call: "POST /film-sales/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /film-sales/films"
              payload: { title: "Northern Lights", genre: "ACTION", production_budget_usd: 24000000.00, principal_cast_score: 88, estimated_delivery_date: "2027-02-28T00:00:00Z", theatrical_release_date: "2027-04-15T00:00:00Z" }
              as: PlatformAdmin
              captures: { film_id: $.data.id }
            - call: "POST /film-sales/territories"
              payload: { code: "DE", name: "Germany", region: "EMEA", market_tier: 1, currency_code: "EUR", base_value_index: 1.20 }
              as: PlatformAdmin
              captures: { terr_de_id: $.data.id }
            - call: "POST /film-sales/territories/${terr_de_id}/comparable-titles"
              payload: { name: "Comp Alpha", genre: "ACTION", cast_score: 80, gross_license_fee_usd: 800000.00, release_year: 2022, verified: true }
              as: PlatformAdmin
            - call: "POST /film-sales/territories/${terr_de_id}/comparable-titles"
              payload: { name: "Comp Beta", genre: "ACTION", cast_score: 74, gross_license_fee_usd: 1000000.00, release_year: 2023, verified: true }
              as: PlatformAdmin
            - call: "POST /film-sales/territories/${terr_de_id}/comparable-titles"
              payload: { name: "Comp Gamma", genre: "ACTION", cast_score: 91, gross_license_fee_usd: 1200000.00, release_year: 2021, verified: true }
              as: PlatformAdmin
            - call: "POST /film-sales/territories/${terr_de_id}/buyers"
              payload: { company_name: "Rhein Films", credit_rating: "AAA", exposure_limit_usd: 3000000.00, status: "ACTIVE" }
              as: PlatformAdmin
              captures: { buyer_de_id: $.data.id }
            - call: "POST /film-sales/films/${film_id}/agency-agreements"
              payload: { commission_pct: 0.10, expense_cap_usd: 75000.00, term_months: 24, term_start_date: "2026-08-01T00:00:00Z" }
              as: HeadOfSales
              captures: { agr_id: $.data.id }
            - call: "POST /film-sales/agency-agreements/${agr_id}/state"
              payload: { to_status: "EXECUTED" }
              as: HeadOfSales
              as_user_id: "hos-signer-1"
            - call: "POST /film-sales/films/${film_id}/state"
              payload: { to_status: "PACKAGING" }
              as: PlatformAdmin
            - call: "POST /film-sales/territory-valuations"
              payload: { film_id: "${film_id}", territory_id: "${terr_de_id}", method: "CAST_ADJUSTED" }
              as: SalesAgent
              captures: { val_de_id: $.data.id }
            - call: "GET /film-sales/films/${film_id}"
              payload: {}
              as: HeadOfSales
              captures: { film_v1: $.data.version }
            - call: "POST /film-sales/territory-valuations/${val_de_id}/publish"
              payload: { expected_film_version: "${film_v1}" }
              as: HeadOfSales
              as_user_id: "hos-valuer-1"
            - call: "POST /film-sales/films/${film_id}/state"
              payload: { to_status: "IN_MARKET" }
              as: HeadOfSales
            - call: "GET /film-sales/buyers/${buyer_de_id}"
              payload: {}
              as: SalesAgent
              captures: { buyer_v1: $.data.version }
            - call: "POST /film-sales/pre-sale-contracts"
              payload: { film_id: "${film_id}", buyer_id: "${buyer_de_id}", territory_id: "${terr_de_id}", minimum_guarantee_usd: 2000000.00, license_term_months: 24, holdback_days: 60, expected_buyer_version: "${buyer_v1}" }
              as: SalesAgent
              captures: { contract_id: $.data.id }
            - call: "POST /film-sales/pre-sale-contracts/${contract_id}/payment-milestones"
              payload: { label: "ON_SIGNATURE", pct_of_mg: 0.45, due_date: "2026-09-01T00:00:00Z" }
              as: SalesAgent
              captures: { ms_sig_id: $.data.id }
            - call: "POST /film-sales/pre-sale-contracts/${contract_id}/payment-milestones"
              payload: { label: "ON_DELIVERY", pct_of_mg: 0.20, due_date: "2027-06-15T00:00:00Z" }
              as: SalesAgent
              captures: { ms_del_id: $.data.id }
            - call: "POST /film-sales/pre-sale-contracts/${contract_id}/payment-milestones"
              payload: { label: "ON_RELEASE", pct_of_mg: 0.10, due_date: "2027-07-15T00:00:00Z" }
              as: SalesAgent
              captures: { ms_rel_id: $.data.id }
            - call: "POST /film-sales/pre-sale-contracts/${contract_id}/payment-milestones"
              payload: { label: "ON_TERM_END", pct_of_mg: 0.25, due_date: "2028-08-01T00:00:00Z" }
              as: SalesAgent
              captures: { ms_end_id: $.data.id }
            - call: "POST /film-sales/pre-sale-contracts/${contract_id}/accept"
              payload: {}
              as: Buyer
              as_user_id: "${buyer_de_id}"
            - call: "POST /film-sales/pre-sale-contracts/${contract_id}/execute"
              payload: {}
              as: HeadOfSales
              as_user_id: "hos-closer-9"
            - call: "POST /film-sales/films/${film_id}/collection-accounts"
              payload: { bank_name: "Fiduciary Trust", account_reference: "CAM-2793" }
              as: CollectionAgent
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /film-sales/payment-milestones/${ms_sig_id}/receipt"
              payload: { amount_usd: 900000.00, received_at: "2026-08-05T00:00:00Z" }
              as: CollectionAgent
              as_user_id: "collect-1"
            - call: "GET /film-sales/buyers/${buyer_de_id}"
              payload: {}
              as: SalesAgent
              captures: { exposure_gross: $.data.outstanding_exposure_usd, exposure_net: $.data.net_unpaid_exposure_usd }
          assert:
            - "Buyer.${buyer_de_id}.outstanding_exposure_usd == 2000000.00"
            - "Buyer.${buyer_de_id}.net_unpaid_exposure_usd == 1100000.00"
            - "Buyer.${buyer_de_id}.outstanding_exposure_usd - Buyer.${buyer_de_id}.net_unpaid_exposure_usd == 900000.00"
            - "PaymentMilestone.${ms_sig_id}.status == RECEIVED"
            - "PreSaleContract.${contract_id}.unpaid_amount_usd == 1100000.00"
            - "PreSaleContract.${contract_id}.collection_status == PARTIALLY_PAID"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: commission_rate_picked_from_pre_receipt_total_never_split_across_breakpoint
        grounds:
          - calculations.sales_commission_accrual
          - entities.SalesAgencyAgreement.fields.gross_collected_usd
          - entities.SalesAgencyAgreement.fields.commission_earned_usd
          - entities.PaymentMilestone.fields.accrued_commission_usd
          - state_machines.PaymentMilestone.INVOICED_to_RECEIVED
          - state_machines.PaymentMilestone.SCHEDULED_to_RECEIVED
        distinguishing_aspect: |
          Combinatorial mode (c) — circular-looking dependency with a pinned evaluation order: the
          rate depends on the running total and the running total depends on this receipt. The
          400000.00 receipt arrives on before=900000.00 and therefore straddles TIER1_BREAK
          1000000.00, yet is charged entirely at the tier-1 rate 0.10 for 40000.00; the forbidden
          split (100000.00 @ 0.10 + 300000.00 @ 0.075 = 32500.00) would leave commission_earned_usd
          at 137500.00 instead of the correct 145000.00 after the third receipt.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; agency agreement EXECUTED with commission_pct 0.10 and gross_collected_usd 0.00."
            - "Film IN_MARKET with one PUBLISHED CAST_ADJUSTED DE valuation (floor 1176000.00)."
            - "Contract MG 2000000.00 EXECUTED with milestones 900000.00 / 400000.00 / 200000.00 / 500000.00."
            - "An OPEN collection account exists for the film; no waterfall tiers yet, so no cap resync noise."
          setup_api_calls:
            - call: "POST /film-sales/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /film-sales/films"
              payload: { title: "Northern Lights", genre: "ACTION", production_budget_usd: 24000000.00, principal_cast_score: 88, estimated_delivery_date: "2027-02-28T00:00:00Z", theatrical_release_date: "2027-04-15T00:00:00Z" }
              as: PlatformAdmin
              captures: { film_id: $.data.id }
            - call: "POST /film-sales/territories"
              payload: { code: "DE", name: "Germany", region: "EMEA", market_tier: 1, currency_code: "EUR", base_value_index: 1.20 }
              as: PlatformAdmin
              captures: { terr_de_id: $.data.id }
            - call: "POST /film-sales/territories/${terr_de_id}/comparable-titles"
              payload: { name: "Comp Alpha", genre: "ACTION", cast_score: 80, gross_license_fee_usd: 800000.00, release_year: 2022, verified: true }
              as: PlatformAdmin
            - call: "POST /film-sales/territories/${terr_de_id}/comparable-titles"
              payload: { name: "Comp Beta", genre: "ACTION", cast_score: 74, gross_license_fee_usd: 1000000.00, release_year: 2023, verified: true }
              as: PlatformAdmin
            - call: "POST /film-sales/territories/${terr_de_id}/comparable-titles"
              payload: { name: "Comp Gamma", genre: "ACTION", cast_score: 91, gross_license_fee_usd: 1200000.00, release_year: 2021, verified: true }
              as: PlatformAdmin
            - call: "POST /film-sales/territories/${terr_de_id}/buyers"
              payload: { company_name: "Rhein Films", credit_rating: "AAA", exposure_limit_usd: 3000000.00, status: "ACTIVE" }
              as: PlatformAdmin
              captures: { buyer_de_id: $.data.id }
            - call: "POST /film-sales/films/${film_id}/agency-agreements"
              payload: { commission_pct: 0.10, expense_cap_usd: 75000.00, term_months: 24, term_start_date: "2026-08-01T00:00:00Z" }
              as: HeadOfSales
              captures: { agr_id: $.data.id }
            - call: "POST /film-sales/agency-agreements/${agr_id}/state"
              payload: { to_status: "EXECUTED" }
              as: HeadOfSales
              as_user_id: "hos-signer-1"
            - call: "POST /film-sales/films/${film_id}/state"
              payload: { to_status: "PACKAGING" }
              as: PlatformAdmin
            - call: "POST /film-sales/territory-valuations"
              payload: { film_id: "${film_id}", territory_id: "${terr_de_id}", method: "CAST_ADJUSTED" }
              as: SalesAgent
              captures: { val_de_id: $.data.id }
            - call: "GET /film-sales/films/${film_id}"
              payload: {}
              as: HeadOfSales
              captures: { film_v1: $.data.version }
            - call: "POST /film-sales/territory-valuations/${val_de_id}/publish"
              payload: { expected_film_version: "${film_v1}" }
