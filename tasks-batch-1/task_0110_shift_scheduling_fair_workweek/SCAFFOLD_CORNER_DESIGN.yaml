# =============================================================================
# §1.9 Scaffold Corner Design (breadth coverage of testable claims not in §1.8)
# Walks references/claim-extraction-guide.md against this scaffold's §1.1-§1.7.
# Shared conventions match §1.8 (Manager as_user_id "mgr-1"; clock pinned first).
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_location_returns_201_with_defaults_applied
        claim_type: Defaults
        grounds:
          - entities.Location.fields.advance_notice_days
          - entities.Location.fields.overtime_multiplier
          - endpoints
        distinguishing_aspect: "Omitting advance_notice_days/overtime_multiplier applies defaults 14 and 1.5; overtime_weekly_threshold_hours defaults 40; status ACTIVE."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Manager
              as_user_id: "mgr-1"
          trigger:
            - call: "POST /locations"
              payload: { name: "L", time_zone: "UTC", overtime_cost_guardrail_cents: 100000 }
              as: Manager
              as_user_id: "mgr-1"
              captures: { loc: $.data.id }
          assert:
            - "Location.${loc}.advance_notice_days == 14"
            - "Location.${loc}.overtime_multiplier == 1.5"
            - "Location.${loc}.overtime_weekly_threshold_hours == 40"
            - "Location.${loc}.status == ACTIVE"

      - name: create_worker_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Worker.fields.base_hourly_rate_cents
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /locations/{id}/workers without base_hourly_rate_cents -> ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Location L exists"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Manager
              as_user_id: "mgr-1"
            - call: "POST /locations"
              payload: { name: "L", time_zone: "UTC", overtime_cost_guardrail_cents: 100000 }
              as: Manager
              as_user_id: "mgr-1"
              captures: { loc: $.data.id }
          trigger:
            - call: "POST /locations/${loc}/workers"
              payload: { full_name: "W", email: "w@x.com" }
              as: Manager
              as_user_id: "mgr-1"
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: get_worker_nonexistent_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /workers/{nonexistent uuid} -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB; pinned clock"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Manager
              as_user_id: "mgr-1"
          trigger:
            - call: "GET /workers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Manager
              as_user_id: "mgr-1"
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_NOT_FOUND"

      - name: system_fields_generated_on_shift_create
        claim_type: System Fields
        grounds:
          - entities.Shift.fields.status
          - entities.Shift.fields.duration_hours
        distinguishing_aspect: "On POST /locations/{id}/shifts the server mints id/created_at/version=1, sets status=DRAFT, and computes duration_hours=8 from a 09:00..17:00 window regardless of any client-supplied values."
        test_recipe:
          setup: ["Location L exists; pinned clock"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Manager
              as_user_id: "mgr-1"
            - call: "POST /locations"
              payload: { name: "L", time_zone: "UTC", overtime_cost_guardrail_cents: 100000 }
              as: Manager
              as_user_id: "mgr-1"
              captures: { loc: $.data.id }
          trigger:
            - call: "POST /locations/${loc}/shifts"
              payload: { role_name: "Cashier", start_utc: "2026-06-02T09:00:00Z", end_utc: "2026-06-02T17:00:00Z", headcount_required: 1 }
              as: Manager
              as_user_id: "mgr-1"
              captures: { s: $.data.id }
          assert:
            - "Shift.${s}.status == DRAFT"
            - "Shift.${s}.version == 1"
            - "Shift.${s}.duration_hours == 8"
            - "Shift.${s}.headcount_filled == 0"

      - name: shift_invalid_time_window_returns_invalid_time_window
        claim_type: Type Constraints
        grounds:
          - validations[priority=5]
          - errors[ERR_INVALID_TIME_WINDOW]
        distinguishing_aspect: "POST /locations/{id}/shifts with end_utc <= start_utc -> ERR_INVALID_TIME_WINDOW (422)."
        test_recipe:
          setup: ["Location L exists; pinned clock"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Manager
              as_user_id: "mgr-1"
            - call: "POST /locations"
              payload: { name: "L", time_zone: "UTC", overtime_cost_guardrail_cents: 100000 }
              as: Manager
              as_user_id: "mgr-1"
              captures: { loc: $.data.id }
          trigger:
            - call: "POST /locations/${loc}/shifts"
              payload: { role_name: "Cashier", start_utc: "2026-06-02T17:00:00Z", end_utc: "2026-06-02T09:00:00Z", headcount_required: 1 }
              as: Manager
              as_user_id: "mgr-1"
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_INVALID_TIME_WINDOW"

      - name: computed_clopening_pay_accrual_on_short_rest
        claim_type: Computed Fields
        grounds:
          - calculations.clopening_rest_gap
          - entities.Assignment.fields.clopening_flag
          - entities.PredictabilityLedgerEntry.fields.reason
        distinguishing_aspect: "A new assignment whose worker's prior shift ends 8h before start (< 10h rest) sets clopening_flag=true and appends a CLOPENING ledger entry of 5000 cents (flat constant)."
        test_recipe:
          setup:
            - "Location L min_rest 10, predictability ON advance_notice 1, base 2000"
            - "Worker W with a prior assignment 2026-06-02T18:00..22:00; new shift starts 2026-06-03T06:00 (8h gap)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Manager
              as_user_id: "mgr-1"
            - call: "POST /locations"
              payload: { name: "L", time_zone: "UTC", overtime_cost_guardrail_cents: 100000000, predictability_pay_enabled: true, advance_notice_days: 1, min_rest_hours_between_shifts: 10 }
              as: Manager
              as_user_id: "mgr-1"
              captures: { loc: $.data.id }
            - call: "POST /locations/${loc}/workers"
              payload: { full_name: "W", email: "w@x.com", base_hourly_rate_cents: 2000 }
              as: Manager
              as_user_id: "mgr-1"
              captures: { w: $.data.id }
            - call: "POST /locations/${loc}/pay-periods"
              payload: { start_utc: "2026-06-01T00:00:00Z", end_utc: "2026-06-08T00:00:00Z" }
              as: Manager
              as_user_id: "mgr-1"
              captures: { pp: $.data.id }
            - call: "POST /locations/${loc}/shifts"
              payload: { role_name: "Cashier", start_utc: "2026-06-02T18:00:00Z", end_utc: "2026-06-02T22:00:00Z", headcount_required: 1 }
              as: Manager
              as_user_id: "mgr-1"
              captures: { sprior: $.data.id }
            - call: "POST /locations/${loc}/shifts/${sprior}/post"
              payload: {}
              as: Manager
              as_user_id: "mgr-1"
            - call: "POST /locations/${loc}/assignments"
              payload: { shift_id: "${sprior}", worker_id: "${w}" }
              as: Manager
              as_user_id: "mgr-1"
            - call: "POST /locations/${loc}/shifts"
              payload: { role_name: "Cashier", start_utc: "2026-06-03T06:00:00Z", end_utc: "2026-06-03T10:00:00Z", headcount_required: 1 }
              as: Manager
              as_user_id: "mgr-1"
              captures: { snew: $.data.id }
            - call: "POST /locations/${loc}/shifts/${snew}/post"
              payload: {}
              as: Manager
              as_user_id: "mgr-1"
          trigger:
            - call: "POST /locations/${loc}/assignments"
              payload: { shift_id: "${snew}", worker_id: "${w}" }
              as: Manager
              as_user_id: "mgr-1"
              captures: { anew: $.data.id }
          assert:
            - "Assignment.${anew}.clopening_flag == true"
            - "exactly one PredictabilityLedgerEntry with shift_id == ${snew} and reason == CLOPENING and amount_cents == 5000 exists"

      - name: list_shifts_pagination_envelope
        claim_type: Listing
        grounds:
          - endpoints
          - response_envelope
        distinguishing_aspect: "GET /shifts?location_id=...&limit=1 returns response_type array with pagination meta (total_count, has_more)."
        test_recipe:
          setup: ["Location L with two DRAFT shifts; pinned clock"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Manager
              as_user_id: "mgr-1"
            - call: "POST /locations"
              payload: { name: "L", time_zone: "UTC", overtime_cost_guardrail_cents: 100000 }
              as: Manager
              as_user_id: "mgr-1"
              captures: { loc: $.data.id }
            - call: "POST /locations/${loc}/shifts"
              payload: { role_name: "Cashier", start_utc: "2026-06-02T09:00:00Z", end_utc: "2026-06-02T13:00:00Z", headcount_required: 1 }
              as: Manager
              as_user_id: "mgr-1"
            - call: "POST /locations/${loc}/shifts"
              payload: { role_name: "Cashier", start_utc: "2026-06-03T09:00:00Z", end_utc: "2026-06-03T13:00:00Z", headcount_required: 1 }
              as: Manager
              as_user_id: "mgr-1"
          trigger:
            - call: "GET /shifts?location_id=${loc}&limit=1&offset=0"
              payload: {}
              as: Manager
              as_user_id: "mgr-1"
          assert:
            - "response_type == array"
            - "meta total_count == 2"
            - "meta has_more == true"
            - "len(data) == 1"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: post_already_posted_shift_returns_invalid_shift_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Shift.DRAFT_to_OPEN
          - errors[ERR_INVALID_SHIFT_STATE]
        distinguishing_aspect: "Posting a shift already in OPEN (not DRAFT) -> ERR_INVALID_SHIFT_STATE; no second posted_utc stamp."
        test_recipe:
          setup: ["Location L; shift S posted (OPEN)"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Manager
              as_user_id: "mgr-1"
            - call: "POST /locations"
              payload: { name: "L", time_zone: "UTC", overtime_cost_guardrail_cents: 100000 }
              as: Manager
              as_user_id: "mgr-1"
              captures: { loc: $.data.id }
            - call: "POST /locations/${loc}/shifts"
              payload: { role_name: "Cashier", start_utc: "2026-06-02T09:00:00Z", end_utc: "2026-06-02T13:00:00Z", headcount_required: 1 }
              as: Manager
              as_user_id: "mgr-1"
              captures: { s: $.data.id }
            - call: "POST /locations/${loc}/shifts/${s}/post"
              payload: {}
              as: Manager
              as_user_id: "mgr-1"
          trigger:
            - call: "POST /locations/${loc}/shifts/${s}/post"
              payload: {}
              as: Manager
              as_user_id: "mgr-1"
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_INVALID_SHIFT_STATE"

      - name: complete_shift_before_end_returns_shift_not_ended
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Shift.OPEN_to_COMPLETED
          - errors[ERR_SHIFT_NOT_ENDED]
        distinguishing_aspect: "Completing a shift while current clock < shift.end_utc -> ERR_SHIFT_NOT_ENDED."
        test_recipe:
          setup: ["Location L; shift S posted; clock before end_utc"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Manager
              as_user_id: "mgr-1"
            - call: "POST /locations"
              payload: { name: "L", time_zone: "UTC", overtime_cost_guardrail_cents: 100000 }
              as: Manager
              as_user_id: "mgr-1"
              captures: { loc: $.data.id }
            - call: "POST /locations/${loc}/shifts"
              payload: { role_name: "Cashier", start_utc: "2026-06-02T09:00:00Z", end_utc: "2026-06-02T13:00:00Z", headcount_required: 1 }
              as: Manager
              as_user_id: "mgr-1"
              captures: { s: $.data.id }
            - call: "POST /locations/${loc}/shifts/${s}/post"
              payload: {}
              as: Manager
              as_user_id: "mgr-1"
          trigger:
            - call: "POST /locations/${loc}/shifts/${s}/complete"
              payload: {}
              as: Manager
              as_user_id: "mgr-1"
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_SHIFT_NOT_ENDED"

      - name: noshow_before_shift_start_returns_shift_not_started
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Assignment.SCHEDULED_to_NO_SHOW
          - errors[ERR_SHIFT_NOT_STARTED]
        distinguishing_aspect: "Marking an assignment no-show while current clock < shift.start_utc -> ERR_SHIFT_NOT_STARTED."
        test_recipe:
          setup: ["Location L; worker W assigned to shift S; clock before start"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Manager
              as_user_id: "mgr-1"
            - call: "POST /locations"
              payload: { name: "L", time_zone: "UTC", overtime_cost_guardrail_cents: 100000000, predictability_pay_enabled: false, advance_notice_days: 1 }
              as: Manager
              as_user_id: "mgr-1"
              captures: { loc: $.data.id }
            - call: "POST /locations/${loc}/workers"
              payload: { full_name: "W", email: "w@x.com", base_hourly_rate_cents: 2000 }
              as: Manager
              as_user_id: "mgr-1"
              captures: { w: $.data.id }
            - call: "POST /locations/${loc}/pay-periods"
              payload: { start_utc: "2026-06-01T00:00:00Z", end_utc: "2026-06-08T00:00:00Z" }
              as: Manager
              as_user_id: "mgr-1"
            - call: "POST /locations/${loc}/shifts"
              payload: { role_name: "Cashier", start_utc: "2026-06-05T09:00:00Z", end_utc: "2026-06-05T13:00:00Z", headcount_required: 1 }
              as: Manager
              as_user_id: "mgr-1"
              captures: { s: $.data.id }
            - call: "POST /locations/${loc}/shifts/${s}/post"
              payload: {}
              as: Manager
              as_user_id: "mgr-1"
            - call: "POST /locations/${loc}/assignments"
              payload: { shift_id: "${s}", worker_id: "${w}" }
              as: Manager
              as_user_id: "mgr-1"
              captures: { a: $.data.id }
          trigger:
            - call: "POST /locations/${loc}/assignments/${a}/no-show"
              payload: {}
              as: Manager
              as_user_id: "mgr-1"
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_SHIFT_NOT_STARTED"

      - name: confirm_after_shift_started_returns_shift_already_started
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Assignment.SCHEDULED_to_CONFIRMED
          - errors[ERR_SHIFT_ALREADY_STARTED]
        distinguishing_aspect: "Worker confirming after current clock >= shift.start_utc -> ERR_SHIFT_ALREADY_STARTED."
        test_recipe:
          setup: ["Location L; worker W assigned to shift S; clock advanced past start"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Manager
              as_user_id: "mgr-1"
            - call: "POST /locations"
              payload: { name: "L", time_zone: "UTC", overtime_cost_guardrail_cents: 100000000, predictability_pay_enabled: false, advance_notice_days: 1 }
              as: Manager
              as_user_id: "mgr-1"
              captures: { loc: $.data.id }
            - call: "POST /locations/${loc}/workers"
              payload: { full_name: "W", email: "w@x.com", base_hourly_rate_cents: 2000 }
              as: Manager
              as_user_id: "mgr-1"
              captures: { w: $.data.id }
            - call: "POST /locations/${loc}/pay-periods"
              payload: { start_utc: "2026-06-01T00:00:00Z", end_utc: "2026-06-08T00:00:00Z" }
              as: Manager
              as_user_id: "mgr-1"
            - call: "POST /locations/${loc}/shifts"
              payload: { role_name: "Cashier", start_utc: "2026-06-05T09:00:00Z", end_utc: "2026-06-05T13:00:00Z", headcount_required: 1 }
              as: Manager
              as_user_id: "mgr-1"
              captures: { s: $.data.id }
            - call: "POST /locations/${loc}/shifts/${s}/post"
              payload: {}
              as: Manager
              as_user_id: "mgr-1"
            - call: "POST /locations/${loc}/assignments"
              payload: { shift_id: "${s}", worker_id: "${w}" }
              as: Manager
              as_user_id: "mgr-1"
              captures: { a: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T09:00:01Z" }
              as: Manager
              as_user_id: "mgr-1"
          trigger:
            - call: "POST /locations/${loc}/assignments/${a}/confirm"
              payload: {}
              as: Worker
              as_user_id: "${w}"
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_SHIFT_ALREADY_STARTED"

      - name: lock_payperiod_with_open_assignment_returns_open_assignments_exist
        claim_type: precondition_enforcement
        grounds:
          - state_machines.PayPeriod.OPEN_to_LOCKED
          - errors[ERR_OPEN_ASSIGNMENTS_EXIST]
        distinguishing_aspect: "Locking a pay-period that still has a SCHEDULED (non-terminal) assignment -> ERR_OPEN_ASSIGNMENTS_EXIST."
        test_recipe:
          setup: ["Location L; PayPeriod PP with one SCHEDULED assignment"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Manager
              as_user_id: "mgr-1"
            - call: "POST /locations"
              payload: { name: "L", time_zone: "UTC", overtime_cost_guardrail_cents: 100000000, predictability_pay_enabled: false, advance_notice_days: 1 }
              as: Manager
              as_user_id: "mgr-1"
              captures: { loc: $.data.id }
            - call: "POST /locations/${loc}/workers"
              payload: { full_name: "W", email: "w@x.com", base_hourly_rate_cents: 2000 }
              as: Manager
              as_user_id: "mgr-1"
              captures: { w: $.data.id }
            - call: "POST /locations/${loc}/pay-periods"
              payload: { start_utc: "2026-06-01T00:00:00Z", end_utc: "2026-06-08T00:00:00Z" }
              as: Manager
              as_user_id: "mgr-1"
              captures: { pp: $.data.id }
            - call: "POST /locations/${loc}/shifts"
              payload: { role_name: "Cashier", start_utc: "2026-06-05T09:00:00Z", end_utc: "2026-06-05T13:00:00Z", headcount_required: 1 }
              as: Manager
              as_user_id: "mgr-1"
              captures: { s: $.data.id }
            - call: "POST /locations/${loc}/shifts/${s}/post"
              payload: {}
              as: Manager
              as_user_id: "mgr-1"
            - call: "POST /locations/${loc}/assignments"
              payload: { shift_id: "${s}", worker_id: "${w}" }
              as: Manager
              as_user_id: "mgr-1"
          trigger:
            - call: "POST /locations/${loc}/pay-periods/${pp}/lock"
              payload: {}
              as: Manager
              as_user_id: "mgr-1"
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_OPEN_ASSIGNMENTS_EXIST"

      - name: award_non_winning_bid_returns_bid_not_winner
        claim_type: precondition_enforcement
        grounds:
          - state_machines.OpenShiftBid.SUBMITTED_to_AWARDED
          - errors[ERR_BID_NOT_WINNER]
        distinguishing_aspect: "Two SUBMITTED bids (seniority 9 and 3); awarding the lower-seniority bid -> ERR_BID_NOT_WINNER (winner is the seniority-9 bid; created_at tie-break unused here)."
        test_recipe:
          setup: ["Location L; OPEN single-seat shift S; bid A seniority 9, bid B seniority 3"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Manager
              as_user_id: "mgr-1"
            - call: "POST /locations"
              payload: { name: "L", time_zone: "UTC", overtime_cost_guardrail_cents: 100000000, predictability_pay_enabled: false, advance_notice_days: 1 }
              as: Manager
              as_user_id: "mgr-1"
              captures: { loc: $.data.id }
            - call: "POST /locations/${loc}/workers"
              payload: { full_name: "WA", email: "wa@x.com", base_hourly_rate_cents: 2000 }
              as: Manager
              as_user_id: "mgr-1"
              captures: { wa: $.data.id }
            - call: "POST /locations/${loc}/workers"
              payload: { full_name: "WB", email: "wb@x.com", base_hourly_rate_cents: 2000 }
              as: Manager
              as_user_id: "mgr-1"
              captures: { wb: $.data.id }
            - call: "POST /locations/${loc}/pay-periods"
              payload: { start_utc: "2026-06-01T00:00:00Z", end_utc: "2026-06-08T00:00:00Z" }
              as: Manager
              as_user_id: "mgr-1"
            - call: "POST /locations/${loc}/shifts"
              payload: { role_name: "Cashier", start_utc: "2026-06-05T09:00:00Z", end_utc: "2026-06-05T13:00:00Z", headcount_required: 1 }
              as: Manager
              as_user_id: "mgr-1"
              captures: { s: $.data.id }
            - call: "POST /locations/${loc}/shifts/${s}/post"
