            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-04-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /enrollment/deposits", payload: { application_id: "${app_id}", amount_cents: 50000 }, as: Applicant, as_user_id: "${ap_id}" }
