  # ===========================================================================
  - section: state_machines
    instances:

      - name: every_entity_starts_in_its_declared_initial_state
        claim_type: initial_state
        grounds:
          - state_machines.Registration.initial_state
          - state_machines.ReportingWindow.initial_state
          - state_machines.Submission.initial_state
          - state_machines.MarketReport.initial_state
          - state_machines.AuditCase.initial_state
          - state_machines.PenaltyAssessment.initial_state
          - state_machines.MethodologyChange.initial_state
        distinguishing_aspect: |
          One pass over all seven state machines: DRAFT / OPEN / DRAFT /
          (PENDING, UNREVIEWED, UNPUBLISHED) / OPEN / ASSESSED / COMMENT_OPEN.
          MarketReport is the only entity whose initial state is a TRIPLE because
          its three dimensions are parallel and independent.
        test_recipe:
          setup:
            - "Alpha Packing with plant EST-101 (five-year history averaging 126000 head) and an ACTIVE 2026 registration; one OPEN CATTLE LIVE_ANIMAL window; one ACCEPTED submission so that an AuditCase can be opened."
