scenario: |
  Citizenship Class & Naturalization Assistance (community naturalization program): eligibility screening & application readiness assessment, civics/English class enrollment & attendance, application preparation workshop with legal supervision, fee waiver eligibility & documentation, interview preparation & mock interview, case status tracking & RFE response support, oath ceremony logistics & voter registration referral, volunteer training & accreditation requirements

domain_name: citizenship-naturalization
api_prefix: /naturalization

complexity_profile:
  primary_archetype: "Compliance / audit"
  secondary_archetype: "Quota / allocation"
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: graph   # many-to-many junctions (Enrollment, WorkshopSeat, MockInterview) plus cross-aggregate FKs
  state_machine_shape: cyclic   # packet revision cycle, volunteer accreditation lapse/renewal cycle; USCISCase additionally carries parallel stage x rfe dimensions
  relationship_patterns: [one_to_many, many_to_many, cross_aggregate]
  role_model: segregation_of_duties   # packet preparer may never certify the same packet; decide is admin-only vs applicant-created requests
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table (15 entities)
# =============================================================================
entities:
  - name: Program
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Program display name" }
      - { name: n400_fee_cents, type: integer, source: input, default: 76000, description: "N-400 application fee line, integer cents" }
      - { name: biometric_fee_cents, type: integer, source: input, default: 8501, description: "Biometric services fee line, integer cents" }
      - { name: translation_stipend_cents, type: integer, source: input, default: 3001, description: "Document translation pass-through line, integer cents" }
      - { name: poverty_base_cents, type: integer, source: input, default: 1565000, description: "Poverty guideline for household size 1, integer cents" }
      - { name: poverty_per_additional_cents, type: integer, source: input, default: 550000, description: "Poverty guideline increment per additional household member, integer cents" }
      - { name: full_waiver_threshold_pct, type: integer, source: input, default: 150, description: "Income <= threshold_pct x guideline qualifies for FULL waiver" }
      - { name: partial_waiver_threshold_pct, type: integer, source: input, default: 200, description: "Income <= threshold_pct x guideline qualifies for PARTIAL waiver" }
      - { name: attendance_complete_bp, type: integer, source: input, default: 8000, description: "Attendance basis points required to complete an enrollment (inclusive)" }
      - { name: attendance_midterm_floor_bp, type: integer, source: input, default: 5000, description: "Midterm attendance floor in basis points; strictly below triggers auto-revoke" }
      - { name: readiness_certify_threshold, type: integer, source: input, default: 70, description: "Attained readiness score (0-100) required to certify a packet (inclusive)" }
      - { name: rfe_deadline_days, type: integer, source: input, default: 84, description: "Days added to RFE issue time to form the response deadline" }
      - { name: accreditation_valid_months, type: integer, source: input, default: 24, description: "Months a GENERAL/LEGAL accreditation stays active before lapsing" }
      - { name: general_training_hours, type: integer, source: input, default: 10, description: "Trailing-window training hours required for GENERAL accreditation (inclusive)" }
      - { name: legal_supervised_hours, type: integer, source: input, default: 8, description: "Supervised hours alternative path for LEGAL accreditation (inclusive)" }
      - { name: renewal_training_hours, type: integer, source: input, default: 4, description: "Trailing-window training hours required to renew a LAPSED accreditation (inclusive)" }
      - { name: promotion_offer_hours, type: integer, source: input, default: 72, description: "Hours a waitlist promotion offer remains open" }
      - { name: mock_buffer_minutes, type: integer, source: input, default: 15, description: "Minimum gap in minutes between a volunteer's mock interviews (gap >= buffer is allowed)" }
      - { name: mock_max_attempts, type: integer, source: input, default: 3, description: "Max non-cancelled mock interviews per applicant" }

  - name: Applicant
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Applicant legal name" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: date_of_birth, type: string, source: input, description: "ISO date of birth" }
      - { name: preferred_language, type: string, source: input, default: "en", description: "Preferred contact language" }
      - { name: stage, type: enum, source: system, description: "REGISTERED | SCREENED | IN_PIPELINE | FILED | NATURALIZED" }
      - { name: current_screening_id, type: string, source: system, description: "FK -> Screening.id; the ACTIVE (non-SUPERSEDED) screening, null until first screening" , constraints: "nullable" }
      - { name: voter_registration_referred, type: boolean, source: system, default: false, description: "Set true when the applicant's oath ceremony concludes" }

  - name: Screening
    parent: Applicant
    common_fields: true
    fields:
      - { name: applicant_id, type: string, source: system, description: "FK -> Applicant.id; owning applicant" }
      - { name: marital_to_citizen, type: boolean, source: input, description: "3-year rule eligibility flag" }
      - { name: lpr_months, type: integer, source: input, description: "Months as lawful permanent resident" }
      - { name: continuous_residence_months, type: integer, source: input, description: "Months of continuous residence" }
      - { name: physical_presence_days, type: integer, source: input, description: "Days physically present" }
      - { name: age_years, type: integer, source: input, description: "Applicant age in whole years at screening time" }
      - { name: english_level, type: integer, source: input, description: "Assessed English level 0-4", constraints: "0..4" }
      - { name: civics_practice_pct, type: integer, source: input, description: "Civics practice test percent 0-100", constraints: "0..100" }
      - { name: has_legal_flag, type: boolean, source: input, description: "True when a legal issue needs attorney review" }
      - { name: outcome, type: enum, source: computed, description: "ELIGIBLE | ELIGIBLE_WITH_EXEMPTION | NOT_ELIGIBLE | NEEDS_REVIEW — per screening_outcome calc" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUPERSEDED" }
      - { name: expires_at, type: datetime, source: computed, description: "created clock time + 180 days; guards compare against logical clock" }

  - name: ClassSection
    parent: null
    common_fields: true
    fields:
      - { name: title, type: string, source: input, description: "Class title" }
      - { name: weekday, type: enum, source: input, description: "MON | TUE | WED | THU | FRI | SAT | SUN" }
      - { name: start_minute, type: integer, source: input, description: "Meeting start, minutes from midnight, half-open [start_minute, end_minute)" }
      - { name: end_minute, type: integer, source: input, description: "Meeting end, minutes from midnight; must be > start_minute" }
      - { name: room_id, type: string, source: input, description: "Room identifier string; overlap checks group by this value" }
      - { name: instructor_volunteer_id, type: string, source: input, description: "FK -> Volunteer.id; must hold GENERAL or LEGAL non-lapsed accreditation" }
      - { name: capacity, type: integer, source: input, description: "Seat capacity, >= 1" }
      - { name: total_sessions, type: integer, source: input, description: "Planned session count, >= 2" }
      - { name: enrolled_count, type: integer, source: computed, description: "Count of ENROLLED enrollments; invariant per seat_ledger" }
      - { name: pending_promotion_count, type: integer, source: computed, description: "Count of PENDING_PROMOTION enrollments" }
      - { name: waitlisted_count, type: integer, source: computed, description: "Count of WAITLISTED enrollments" }
      - { name: seats_open, type: integer, source: computed, description: "capacity - enrolled_count - pending_promotion_count (evaluation order pinned in seat_ledger calc)" }

  - name: Enrollment
    parent: null
    common_fields: true
    fields:
      - { name: applicant_id, type: string, source: input, description: "FK -> Applicant.id" }
      - { name: class_section_id, type: string, source: input, description: "FK -> ClassSection.id" }
      - { name: status, type: enum, source: system, description: "ENROLLED | WAITLISTED | PENDING_PROMOTION | COMPLETED | WITHDRAWN | REVOKED" }
      - { name: attendance_bp, type: integer, source: computed, description: "(PRESENT + ABSENT_EXCUSED) * 10000 / records_count, integer truncation; 0 when no records" }
      - { name: records_count, type: integer, source: computed, description: "Number of AttendanceRecord events" }
      - { name: offer_expires_at, type: datetime, source: system, description: "Promotion offer expiry; set on PENDING_PROMOTION, null otherwise", constraints: "nullable" }

  - name: AttendanceRecord
    parent: Enrollment
    common_fields: false   # append-only event: id + created_at only
    fields:
      - { name: enrollment_id, type: string, source: system, description: "FK -> Enrollment.id" }
      - { name: session_index, type: integer, source: input, description: "1..total_sessions; unique per enrollment" }
      - { name: outcome, type: enum, source: input, description: "PRESENT | ABSENT_EXCUSED | ABSENT_UNEXCUSED" }

  - name: Volunteer
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Volunteer name" }
      - { name: email, type: string, source: input, description: "Volunteer email" }
      - { name: background_check_cleared, type: boolean, source: input, description: "Background check cleared flag" }
      - { name: bar_number, type: string, source: input, description: "Attorney bar number; attorney path to LEGAL", constraints: "nullable, optional" }
      - { name: accreditation_level, type: enum, source: system, description: "TRAINEE | GENERAL | LEGAL | LAPSED" }
      - { name: lapsed_from_level, type: enum, source: system, description: "GENERAL | LEGAL captured at lapse; null unless LAPSED", constraints: "nullable" }
      - { name: accredited_at, type: datetime, source: system, description: "Clock time of latest accreditation/renewal", constraints: "nullable" }
      - { name: training_hours_24mo, type: integer, source: computed, description: "Sum of TrainingCredit.hours with earned_at >= clock - 730 days (inclusive boundary); integer hours" }
      - { name: supervised_hours, type: integer, source: computed, description: "Sum of duration_hours from workshops where this volunteer is assisting_volunteer and status COMPLETED; debited on reverse-completion" }

  - name: TrainingCredit
    parent: Volunteer
    common_fields: false   # append-only event
    fields:
      - { name: volunteer_id, type: string, source: system, description: "FK -> Volunteer.id" }
      - { name: topic, type: string, source: input, description: "Training topic" }
      - { name: hours, type: integer, source: input, description: "Credit hours, >= 1" }
      - { name: earned_at, type: datetime, source: input, description: "When the training occurred" }

  - name: Workshop
    parent: null
    common_fields: true
    fields:
      - { name: title, type: string, source: input, description: "Workshop title" }
      - { name: supervising_volunteer_id, type: string, source: input, description: "FK -> Volunteer.id; must hold LEGAL non-lapsed accreditation" }
      - { name: assisting_volunteer_id, type: string, source: input, description: "FK -> Volunteer.id; apprentice who earns supervised_hours on completion", constraints: "nullable, optional" }
      - { name: scheduled_start, type: datetime, source: input, description: "Workshop start instant" }
      - { name: duration_hours, type: integer, source: input, description: "Length in whole hours, >= 1" }
      - { name: capacity, type: integer, source: input, description: "Seat capacity, >= 1" }
      - { name: reserved_count, type: integer, source: computed, description: "Count of RESERVED or ATTENDED seats" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED | COMPLETION_REVERSED | CANCELLED" }

  - name: WorkshopSeat
    parent: null
    common_fields: true
    fields:
      - { name: workshop_id, type: string, source: input, description: "FK -> Workshop.id" }
      - { name: applicant_id, type: string, source: input, description: "FK -> Applicant.id" }
      - { name: status, type: enum, source: system, description: "RESERVED | ATTENDED | REVERSED | CANCELLED" }

  - name: ApplicationPacket
    parent: Applicant
    common_fields: true
    fields:
      - { name: applicant_id, type: string, source: system, description: "FK -> Applicant.id; owning applicant" }
      - { name: workshop_seat_id, type: string, source: input, description: "FK -> WorkshopSeat.id; must be an ATTENDED seat of this applicant" }
      - { name: prepared_by_volunteer_id, type: string, source: input, description: "FK -> Volunteer.id; volunteer who assisted preparation; GENERAL or LEGAL, non-lapsed" }
      - { name: fee_waiver_request_id, type: string, source: input, description: "FK -> FeeWaiverRequest.id; request whose final tier sets the filing fee", constraints: "nullable, optional" }
      - { name: status, type: enum, source: system, description: "DRAFT | IN_LEGAL_REVIEW | NEEDS_REVISION | CERTIFIED | FILED" }
      - { name: certified_by_volunteer_id, type: string, source: system, description: "FK -> Volunteer.id; set from X-User-ID at certify", constraints: "nullable" }
      - { name: filing_fee_cents, type: integer, source: computed, description: "Computed at certify per filing_fee_total; null until CERTIFIED", constraints: "nullable" }

  - name: FeeWaiverRequest
    parent: Applicant
    common_fields: true
    fields:
      - { name: applicant_id, type: string, source: system, description: "FK -> Applicant.id; owning applicant" }
      - { name: household_size, type: integer, source: input, description: "Household size 1..12", constraints: "1..12" }
      - { name: self_reported_income_cents, type: integer, source: input, description: "Annual household income, self-reported, integer cents >= 0" }
      - { name: self_reported_benefit, type: boolean, source: input, description: "Self-reported means-tested benefit receipt" }
      - { name: provisional_tier, type: enum, source: computed, description: "FULL | PARTIAL | DENIED — from self-reported values at creation" }
      - { name: attached_document_count, type: integer, source: system, default: 0, description: "Documents attached at submit; reset to 0 on resubmit" }
      - { name: required_document_count, type: integer, source: computed, description: "2 when benefit-based (self_reported_benefit true), else household_size + 1" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | DENIED" }
      - { name: documented_income_cents, type: integer, source: input, description: "Verified income supplied at decide", constraints: "null until decided" }
      - { name: documented_benefit, type: boolean, source: input, description: "Verified benefit receipt supplied at decide", constraints: "null until decided" }
      - { name: final_tier, type: enum, source: computed, description: "FULL | PARTIAL — verified tier when APPROVED; null otherwise", constraints: "nullable" }
      - { name: decided_by, type: string, source: system, description: "X-User-ID of the deciding ProgramAdmin", constraints: "nullable" }

  - name: USCISCase
    parent: Applicant
    common_fields: true
    fields:
      - { name: applicant_id, type: string, source: system, description: "FK -> Applicant.id; owning applicant" }
      - { name: packet_id, type: string, source: system, description: "FK -> ApplicationPacket.id; the filed packet" }
      - { name: receipt_number, type: string, source: system, description: "System-generated receipt number, format NRC-<zero-padded sequence>" }
      - { name: stage, type: enum, source: system, description: "FILED | RECEIPTED | BIOMETRICS_COMPLETE | INTERVIEW_SCHEDULED | INTERVIEW_PASSED | APPROVED_PENDING_OATH | OATH_SCHEDULED | NATURALIZED | APPLICATION_DENIED" }
      - { name: rfe_status, type: enum, source: system, description: "NONE | ISSUED | RESPONDED | OVERDUE — parallel dimension independent of stage" }
      - { name: rfe_issued_at, type: datetime, source: system, description: "Clock time of latest RFE issuance", constraints: "nullable" }
      - { name: rfe_deadline, type: datetime, source: computed, description: "rfe_issued_at + Program.rfe_deadline_days", constraints: "nullable" }
      - { name: oath_ceremony_id, type: string, source: system, description: "FK -> OathCeremony.id; set at assign", constraints: "nullable" }

  - name: MockInterview
    parent: null
    common_fields: true
    fields:
      - { name: applicant_id, type: string, source: input, description: "FK -> Applicant.id" }
      - { name: volunteer_id, type: string, source: input, description: "FK -> Volunteer.id; must hold GENERAL or LEGAL non-lapsed accreditation" }
      - { name: scheduled_start, type: datetime, source: input, description: "Interview start instant" }
      - { name: duration_minutes, type: integer, source: input, default: 30, description: "Length in minutes, >= 10" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED | NO_SHOW | CANCELLED" }
      - { name: english_pct, type: integer, source: input, description: "Rubric English percent 0-100, supplied at score", constraints: "null until scored" }
      - { name: civics_pct, type: integer, source: input, description: "Rubric civics percent 0-100, supplied at score", constraints: "null until scored" }
      - { name: n400_pct, type: integer, source: input, description: "Rubric N-400 familiarity percent 0-100, supplied at score", constraints: "null until scored" }
      - { name: overall_score, type: integer, source: computed, description: "(40*english_pct + 40*civics_pct + 20*n400_pct)/100, integer division truncated; null until scored", constraints: "nullable" }
      - { name: outcome, type: enum, source: computed, description: "PASS | NEEDS_RETRY — null until scored", constraints: "nullable" }

  - name: OathCeremony
    parent: null
    common_fields: true
    fields:
      - { name: ceremony_date, type: datetime, source: input, description: "Ceremony instant" }
      - { name: venue, type: string, source: input, description: "Venue name" }
      - { name: capacity, type: integer, source: input, description: "Seat capacity, >= 1" }
      - { name: assigned_count, type: integer, source: computed, description: "Count of USCISCase rows with oath_ceremony_id = this ceremony" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | CONCLUDED | CANCELLED" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Applicant
    field: stage
    initial_state: REGISTERED
    terminal_states: [NATURALIZED]
    transitions:
      - from: REGISTERED
        to: SCREENED
        trigger: "system (automatic when a screening computes outcome ELIGIBLE or ELIGIBLE_WITH_EXEMPTION)"
        actor: system
        preconditions: ["screening.outcome IN {ELIGIBLE, ELIGIBLE_WITH_EXEMPTION}"]
        side_effects: ["Applicant.current_screening_id set to the new screening"]
      - from: SCREENED
        to: IN_PIPELINE
        trigger: "system (automatic on first Enrollment reaching ENROLLED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_PIPELINE
        to: FILED
        trigger: "system (automatic when POST /naturalization/packets/{packet_id}/file creates the USCISCase)"
        actor: system
        preconditions: []
        side_effects: []
      - from: FILED
        to: NATURALIZED
        trigger: "system (cascade from OathCeremony CONCLUDED -> USCISCase NATURALIZED)"
        actor: system
        preconditions: []
        side_effects: ["Applicant.voter_registration_referred = true"]

  - entity: Screening
    field: status
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (automatic when a newer Screening is created for the same Applicant)"
        actor: system
        preconditions: []
        side_effects: ["Applicant.current_screening_id repointed to the newer screening"]

  - entity: Enrollment
    field: status
    initial_state: ENROLLED   # or WAITLISTED when seats_open == 0 at creation
    terminal_states: [COMPLETED, WITHDRAWN, REVOKED]
    transitions:
      - from: "<create>"
        to: ENROLLED
        trigger: POST /naturalization/enrollments
        actor: "IntakeCoordinator | Applicant(self)"
        preconditions:
          - "Applicant has an ACTIVE screening with outcome IN {ELIGIBLE, ELIGIBLE_WITH_EXEMPTION} and expires_at > clock (ERR_SCREENING_NOT_ELIGIBLE / ERR_SCREENING_EXPIRED)"
          - "No existing enrollment for (applicant_id, class_section_id) with status IN {ENROLLED, WAITLISTED, PENDING_PROMOTION} (ERR_ENROLLMENT_DUPLICATE_ACTIVE)"
          - "ClassSection.seats_open >= 1, else create as WAITLISTED instead"
        side_effects:
          - "ClassSection.enrolled_count += 1; ClassSection.version += 1"
          - "If Applicant.stage == SCREENED: Applicant.stage -> IN_PIPELINE"
      - from: "<create>"
        to: WAITLISTED
        trigger: POST /naturalization/enrollments
        actor: "IntakeCoordinator | Applicant(self)"
        preconditions: ["same as ENROLLED create except ClassSection.seats_open == 0"]
        side_effects: ["ClassSection.waitlisted_count += 1; ClassSection.version += 1"]
      - from: WAITLISTED
        to: PENDING_PROMOTION
        trigger: "system (automatic when a seat opens: withdraw / auto-revoke / promotion-expiry sweep)"
        actor: system
        preconditions: ["ClassSection.seats_open >= 1 after the freeing mutation"]
        side_effects:
          - "Selector: among this section's WAITLISTED enrollments pick lowest created_at (ASC); tie-break impossible (timestamps unique per insert order, else earliest created_at wins deterministically)"
          - "ClassSection.waitlisted_count -= 1; pending_promotion_count += 1"
          - "offer_expires_at = clock + Program.promotion_offer_hours"
      - from: PENDING_PROMOTION
        to: ENROLLED
        trigger: POST /naturalization/enrollments/{enrollment_id}/confirm-promotion
        actor: "Applicant(self) | IntakeCoordinator"
        preconditions:
          - "status == PENDING_PROMOTION (ERR_INVALID_STATE) — the clock sweep has already withdrawn expired offers, so a live PENDING_PROMOTION is always within its offer window; confirm at exactly offer_expires_at is still allowed (sweep uses strict <)"
        side_effects:
          - "ClassSection.pending_promotion_count -= 1; enrolled_count += 1"
          - "offer_expires_at = null"
          - "If Applicant.stage == SCREENED: Applicant.stage -> IN_PIPELINE"
      - from: PENDING_PROMOTION
        to: WITHDRAWN
        trigger: "system (clock sweep: offer_expires_at < now at POST /naturalization/_clock/set_current_utc; exactly at expiry the offer survives)"
        actor: system
        preconditions: []
        side_effects:
          - "ClassSection.pending_promotion_count -= 1; offer_expires_at = null"
          - "Auto-decline is terminal for that enrollment; the freed seat immediately re-runs the WAITLISTED -> PENDING_PROMOTION selector for the next waiting enrollment"
      - from: ENROLLED
        to: WITHDRAWN
        trigger: POST /naturalization/enrollments/{enrollment_id}/withdraw
        actor: "Applicant(self) | IntakeCoordinator"
        preconditions: ["status == ENROLLED (ERR_INVALID_STATE)"]
        side_effects:
          - "ClassSection.enrolled_count -= 1"
          - "Seat frees: run WAITLISTED -> PENDING_PROMOTION selector"
      - from: ENROLLED
        to: REVOKED
        trigger: "system (automatic on AttendanceRecord creation when the midterm floor check fails)"
        actor: system
        preconditions:
          - "After insert, records_count == ceil(total_sessions/2) (first time the midterm point is reached)"
          - "attendance_bp < Program.attendance_midterm_floor_bp (strictly below; equality survives)"
        side_effects:
          - "ClassSection.enrolled_count -= 1"
          - "Seat frees: run WAITLISTED -> PENDING_PROMOTION selector"
      - from: ENROLLED
        to: COMPLETED
        trigger: POST /naturalization/enrollments/{enrollment_id}/complete
        actor: IntakeCoordinator
        preconditions:
          - "status == ENROLLED (ERR_INVALID_STATE)"
          - "records_count == ClassSection.total_sessions (ERR_SESSIONS_INCOMPLETE)"
          - "attendance_bp >= Program.attendance_complete_bp (ERR_ATTENDANCE_BELOW_THRESHOLD)"
        side_effects: []

  - entity: Volunteer
    field: accreditation_level
    initial_state: TRAINEE
    terminal_states: []
    transitions:
      - from: TRAINEE
        to: GENERAL
        trigger: POST /naturalization/volunteers/{volunteer_id}/accredit with target_level=GENERAL
        actor: ProgramAdmin
        preconditions:
          - "background_check_cleared == true (ERR_ACCREDITATION_INSUFFICIENT)"
          - "training_hours_24mo >= Program.general_training_hours (ERR_ACCREDITATION_INSUFFICIENT)"
        side_effects: ["accredited_at = clock"]
      - from: GENERAL
        to: LEGAL
        trigger: POST /naturalization/volunteers/{volunteer_id}/accredit with target_level=LEGAL
        actor: ProgramAdmin
        preconditions:
          - "bar_number is not null OR supervised_hours >= Program.legal_supervised_hours (ERR_ACCREDITATION_INSUFFICIENT)"
        side_effects: ["accredited_at = clock"]
      - from: GENERAL
        to: LAPSED
        trigger: "system (clock sweep: accredited_at + Program.accreditation_valid_months < now)"
        actor: system
        preconditions: []
        side_effects: ["lapsed_from_level = GENERAL"]
      - from: LEGAL
        to: LAPSED
        trigger: "system (clock sweep: accredited_at + Program.accreditation_valid_months < now)"
        actor: system
        preconditions: []
        side_effects: ["lapsed_from_level = LEGAL"]
      - from: LAPSED
        to: GENERAL
        trigger: POST /naturalization/volunteers/{volunteer_id}/renew when lapsed_from_level == GENERAL
        actor: ProgramAdmin
        preconditions: ["training_hours_24mo >= Program.renewal_training_hours (ERR_ACCREDITATION_INSUFFICIENT)"]
        side_effects: ["accredited_at = clock; lapsed_from_level = null"]
      - from: LAPSED
        to: LEGAL
        trigger: POST /naturalization/volunteers/{volunteer_id}/renew when lapsed_from_level == LEGAL
        actor: ProgramAdmin
        preconditions: ["training_hours_24mo >= Program.renewal_training_hours (ERR_ACCREDITATION_INSUFFICIENT)"]
        side_effects: ["accredited_at = clock; lapsed_from_level = null"]

  - entity: Workshop
    field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETION_REVERSED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: POST /naturalization/workshops/{workshop_id}/complete
        actor: "Volunteer(supervising_volunteer_id == X-User-ID) | ProgramAdmin"
        preconditions:
          - "supervising volunteer accreditation_level == LEGAL (ERR_ACCREDITATION_LAPSED when LAPSED, ERR_ACCREDITATION_INSUFFICIENT otherwise)"
          - "clock >= scheduled_start (ERR_WORKSHOP_NOT_YET_HELD)"
        side_effects:
          - "All WorkshopSeat rows with status RESERVED -> ATTENDED"
          - "If assisting_volunteer_id set: Volunteer.supervised_hours += duration_hours (credits the assistant)"
      - from: COMPLETED
        to: COMPLETION_REVERSED
        trigger: POST /naturalization/workshops/{workshop_id}/reverse-completion
        actor: ProgramAdmin
        preconditions:
          - "No ApplicationPacket references any of this workshop's seats (ERR_COMPLETION_LOCKED)"
        side_effects:
          - "All WorkshopSeat rows with status ATTENDED -> REVERSED"
          - "If assisting_volunteer_id set: Volunteer.supervised_hours -= duration_hours (exact debit of the earlier credit)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /naturalization/workshops/{workshop_id}/cancel"
        actor: ProgramAdmin
        preconditions: ["status == SCHEDULED (ERR_INVALID_STATE)"]
        side_effects: ["All WorkshopSeat rows with status RESERVED -> CANCELLED"]

  - entity: WorkshopSeat
    field: status
    initial_state: RESERVED
    terminal_states: [REVERSED, CANCELLED]
    transitions:
      - from: RESERVED
        to: ATTENDED
        trigger: "system (cascade from Workshop SCHEDULED -> COMPLETED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ATTENDED
        to: REVERSED
        trigger: "system (cascade from Workshop COMPLETED -> COMPLETION_REVERSED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: RESERVED
        to: CANCELLED
        trigger: "POST /naturalization/workshop-seats/{seat_id}/cancel OR cascade from Workshop cancel"
        actor: "Applicant(self) | IntakeCoordinator | system"
        preconditions: ["status == RESERVED (ERR_INVALID_STATE)"]
        side_effects: ["Workshop.reserved_count -= 1 (only on the direct-cancel path; cascade cancel recomputes wholesale)"]

  - entity: ApplicationPacket
    field: status
    initial_state: DRAFT
    terminal_states: [FILED]
    transitions:
      - from: DRAFT
        to: IN_LEGAL_REVIEW
        trigger: POST /naturalization/packets/{packet_id}/submit-review
        actor: IntakeCoordinator
        preconditions: ["status == DRAFT (ERR_INVALID_STATE)"]
        side_effects: []
      - from: IN_LEGAL_REVIEW
        to: NEEDS_REVISION
        trigger: POST /naturalization/packets/{packet_id}/request-revision
        actor: "Volunteer (must hold LEGAL non-lapsed accreditation; ERR_ACCREDITATION_INSUFFICIENT)"
        preconditions: ["status == IN_LEGAL_REVIEW (ERR_INVALID_STATE)"]
        side_effects: []
      - from: NEEDS_REVISION
        to: DRAFT
        trigger: POST /naturalization/packets/{packet_id}/revise
        actor: IntakeCoordinator
        preconditions: ["status == NEEDS_REVISION (ERR_INVALID_STATE)"]
        side_effects: []
      - from: IN_LEGAL_REVIEW
        to: CERTIFIED
        trigger: POST /naturalization/packets/{packet_id}/certify
        actor: "Volunteer (LEGAL non-lapsed)"
        preconditions:
          - "status == IN_LEGAL_REVIEW (ERR_INVALID_STATE)"
          - "actor accreditation_level == LEGAL (ERR_ACCREDITATION_INSUFFICIENT / ERR_ACCREDITATION_LAPSED)"
          - "X-User-ID != prepared_by_volunteer_id (ERR_SOD_CERTIFIER_IS_PREPARER)"
          - "If fee_waiver_request_id set: that request status IN {APPROVED, DENIED} (ERR_FEE_WAIVER_PENDING); DENIED counts as tier NONE for the fee"
          - "Applicant attained readiness score >= Program.readiness_certify_threshold (ERR_READINESS_BELOW_THRESHOLD)"
          - "Applicant's ACTIVE screening expires_at > clock (ERR_SCREENING_EXPIRED)"
        side_effects:
          - "certified_by_volunteer_id = X-User-ID"
          - "filing_fee_cents computed per filing_fee_total (FULL -> 0; PARTIAL -> per-line 50% half-up then sum; DENIED/NONE -> raw sum)"
      - from: CERTIFIED
        to: FILED
        trigger: POST /naturalization/packets/{packet_id}/file
        actor: IntakeCoordinator
        preconditions:
          - "status == CERTIFIED (ERR_INVALID_STATE)"
          - "No other USCISCase for this applicant with stage NOT IN {APPLICATION_DENIED} (ERR_CASE_ALREADY_ACTIVE)"
        side_effects:
          - "Creates USCISCase(stage=FILED, rfe_status=NONE, packet_id=this packet)"
          - "Applicant.stage -> FILED"

  - entity: FeeWaiverRequest
    field: status
    initial_state: DRAFT
    terminal_states: [APPROVED]   # DENIED is non-terminal: resubmit loops back to DRAFT
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: POST /naturalization/fee-waiver-requests/{request_id}/submit
        actor: "Applicant(self) | IntakeCoordinator"
        preconditions:
          - "status == DRAFT (ERR_INVALID_STATE)"
          - "attached_document_count >= required_document_count (ERR_FEE_WAIVER_DOCS_INSUFFICIENT)"
        side_effects: []
      - from: SUBMITTED
        to: APPROVED
        trigger: POST /naturalization/fee-waiver-requests/{request_id}/decide with decision=APPROVED
        actor: ProgramAdmin
        preconditions:
          - "status == SUBMITTED (ERR_INVALID_STATE)"
          - "verified tier computed from documented_income_cents/documented_benefit is FULL or PARTIAL (ERR_TIER_INELIGIBLE)"
        side_effects: ["final_tier = verified tier; decided_by = X-User-ID"]
      - from: SUBMITTED
        to: DENIED
        trigger: POST /naturalization/fee-waiver-requests/{request_id}/decide with decision=DENIED
        actor: ProgramAdmin
        preconditions: ["status == SUBMITTED (ERR_INVALID_STATE)"]
        side_effects: ["final_tier = null; decided_by = X-User-ID"]
      - from: DENIED
        to: DRAFT
        trigger: POST /naturalization/fee-waiver-requests/{request_id}/resubmit
        actor: "Applicant(self) | IntakeCoordinator"
        preconditions: ["status == DENIED (ERR_INVALID_STATE)"]
        side_effects: ["attached_document_count reset to 0; documented_* cleared; provisional_tier recomputed from (unchanged) self-reported values"]

  - entity: USCISCase
    field: stage
    initial_state: FILED
    terminal_states: [NATURALIZED, APPLICATION_DENIED]
    transitions:
      - from: FILED
        to: RECEIPTED
        trigger: POST /naturalization/cases/{case_id}/advance with to_stage=RECEIPTED
        actor: ProgramAdmin
        preconditions: ["to_stage is exactly the next stage in the linear order (ERR_INVALID_STAGE_JUMP)", "rfe_status == NONE (ERR_RFE_OPEN)"]
        side_effects: []
      - from: RECEIPTED
        to: BIOMETRICS_COMPLETE
        trigger: POST /naturalization/cases/{case_id}/advance with to_stage=BIOMETRICS_COMPLETE
        actor: ProgramAdmin
        preconditions: ["next-stage rule", "rfe_status == NONE (ERR_RFE_OPEN)"]
        side_effects: []
      - from: BIOMETRICS_COMPLETE
        to: INTERVIEW_SCHEDULED
        trigger: POST /naturalization/cases/{case_id}/advance with to_stage=INTERVIEW_SCHEDULED
        actor: ProgramAdmin
        preconditions: ["next-stage rule", "rfe_status == NONE (ERR_RFE_OPEN)"]
        side_effects: []
      - from: INTERVIEW_SCHEDULED
        to: INTERVIEW_PASSED
        trigger: POST /naturalization/cases/{case_id}/advance with to_stage=INTERVIEW_PASSED
        actor: ProgramAdmin
        preconditions: ["next-stage rule", "rfe_status == NONE (ERR_RFE_OPEN)"]
        side_effects: []
      - from: INTERVIEW_PASSED
        to: APPROVED_PENDING_OATH
        trigger: POST /naturalization/cases/{case_id}/advance with to_stage=APPROVED_PENDING_OATH
        actor: ProgramAdmin
        preconditions: ["next-stage rule", "rfe_status == NONE (ERR_RFE_OPEN)"]
        side_effects: []
      - from: INTERVIEW_PASSED
        to: APPLICATION_DENIED
        trigger: POST /naturalization/cases/{case_id}/advance with to_stage=APPLICATION_DENIED
        actor: ProgramAdmin
        preconditions: ["stage == INTERVIEW_PASSED", "rfe_status == NONE (ERR_RFE_OPEN)"]
        side_effects: []
      - from: APPROVED_PENDING_OATH
        to: OATH_SCHEDULED
        trigger: POST /naturalization/oath-ceremonies/{ceremony_id}/assign
        actor: "IntakeCoordinator | ProgramAdmin"
        preconditions:
          - "ceremony status == SCHEDULED (ERR_INVALID_STATE)"
          - "case stage == APPROVED_PENDING_OATH (ERR_CASE_NOT_OATH_READY)"
          - "case rfe_status == NONE (ERR_RFE_OPEN)"
          - "ceremony assigned_count < capacity (ERR_CEREMONY_FULL)"
        side_effects: ["USCISCase.oath_ceremony_id = ceremony; OathCeremony.assigned_count += 1; OathCeremony.version += 1"]
      - from: OATH_SCHEDULED
        to: NATURALIZED
        trigger: "system (cascade from OathCeremony SCHEDULED -> CONCLUDED)"
        actor: system
        preconditions: []
        side_effects: ["Applicant.stage -> NATURALIZED; Applicant.voter_registration_referred = true"]

  - entity: USCISCase
    field: rfe_status
    initial_state: NONE
    terminal_states: []
    transitions:
      - from: NONE
        to: ISSUED
        trigger: POST /naturalization/cases/{case_id}/issue-rfe
        actor: ProgramAdmin
        preconditions:
          - "stage IN {RECEIPTED, BIOMETRICS_COMPLETE, INTERVIEW_SCHEDULED} (ERR_INVALID_STATE)"
          - "rfe_status == NONE (ERR_INVALID_STATE)"
        side_effects: ["rfe_issued_at = clock; rfe_deadline = clock + Program.rfe_deadline_days"]
      - from: ISSUED
        to: RESPONDED
        trigger: POST /naturalization/cases/{case_id}/respond-rfe
        actor: "IntakeCoordinator | ProgramAdmin"
        preconditions: ["rfe_status IN {ISSUED, OVERDUE} (ERR_INVALID_STATE)"]
        side_effects: []
      - from: OVERDUE
        to: RESPONDED
        trigger: POST /naturalization/cases/{case_id}/respond-rfe (late response permitted)
        actor: "IntakeCoordinator | ProgramAdmin"
        preconditions: []
        side_effects: []
      - from: ISSUED
        to: OVERDUE
        trigger: "system (clock sweep: rfe_deadline < now at POST /naturalization/_clock/set_current_utc; exactly at deadline remains ISSUED)"
        actor: system
        preconditions: []
        side_effects: ["Advance and oath-assign remain blocked while OVERDUE"]
      - from: RESPONDED
        to: NONE
        trigger: POST /naturalization/cases/{case_id}/clear-rfe
        actor: ProgramAdmin
        preconditions: ["rfe_status == RESPONDED (ERR_INVALID_STATE)"]
        side_effects: ["rfe_issued_at = null; rfe_deadline = null"]

  - entity: MockInterview
    field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, NO_SHOW, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: POST /naturalization/mock-interviews/{interview_id}/score
        actor: "Volunteer (must be the assigned volunteer_id; ERR_FORBIDDEN otherwise)"
        preconditions: ["status == SCHEDULED (ERR_INVALID_STATE)"]
        side_effects: ["overall_score and outcome computed per mock_interview_score"]
      - from: SCHEDULED
        to: NO_SHOW
        trigger: POST /naturalization/mock-interviews/{interview_id}/no-show
        actor: "Volunteer(assigned) | IntakeCoordinator"
        preconditions: ["status == SCHEDULED (ERR_INVALID_STATE)"]
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: POST /naturalization/mock-interviews/{interview_id}/cancel
        actor: "Applicant(self) | IntakeCoordinator"
        preconditions: ["status == SCHEDULED (ERR_INVALID_STATE)"]
        side_effects: ["Slot freed: cancelled interviews no longer participate in the volunteer buffer-overlap check or the attempt cap"]

  - entity: OathCeremony
    field: status
    initial_state: SCHEDULED
    terminal_states: [CONCLUDED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: CONCLUDED
        trigger: POST /naturalization/oath-ceremonies/{ceremony_id}/conclude
        actor: ProgramAdmin
        preconditions: ["status == SCHEDULED (ERR_INVALID_STATE)", "clock >= ceremony_date (ERR_CEREMONY_NOT_YET_HELD)"]
        side_effects:
          - "Every assigned USCISCase (oath_ceremony_id == this ceremony) with stage OATH_SCHEDULED -> NATURALIZED"
          - "Each such case's Applicant.stage -> NATURALIZED and Applicant.voter_registration_referred = true (cascade depth 3)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /naturalization/oath-ceremonies/{ceremony_id}/cancel"
        actor: ProgramAdmin
        preconditions: ["status == SCHEDULED (ERR_INVALID_STATE)"]
        side_effects: ["Assigned cases revert: stage OATH_SCHEDULED -> APPROVED_PENDING_OATH, oath_ceremony_id = null, assigned_count -= n"]

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: enrollment-create-stale-section
    parent_entity: ClassSection
    write_endpoint: "POST /naturalization/enrollments"
    occ_field: "expected_section_version"
    description: |
      Creating an Enrollment against a ClassSection whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another writer has just enrolled, withdrawn, or been promoted
      (each legitimately changing the seat ledger) and the current writer's
      view of seats_open is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: workshop-seat-reserve-stale-workshop
    parent_entity: Workshop
    write_endpoint: "POST /naturalization/workshops/{workshop_id}/seats"
    occ_field: "expected_workshop_version"
    description: |
      Reserving a WorkshopSeat against a Workshop whose version has advanced
      since the client last observed it is rejected, because the seat ledger
      (reserved_count vs capacity) the client relied on is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: screening-supersede-stale-applicant
    parent_entity: Applicant
    write_endpoint: "POST /naturalization/applicants/{applicant_id}/screenings"
    occ_field: "expected_applicant_version"
    description: |
      Creating a Screening supersedes the applicant's prior ACTIVE screening;
      doing so against an Applicant whose version has advanced since the
      client last observed it is rejected as a stale-view write.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: oath-assign-stale-ceremony
    parent_entity: OathCeremony
    write_endpoint: "POST /naturalization/oath-ceremonies/{ceremony_id}/assign"
    occ_field: "expected_ceremony_version"
    description: |
      Assigning a case to an OathCeremony whose version has advanced since the
      client last observed it is rejected, because the assigned_count the
      client relied on for capacity is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: screening_outcome
    trigger: "Screening creation (POST /naturalization/applicants/{applicant_id}/screenings)"
    algorithm: threshold
    formula: |
      residence_req_months = 36 if marital_to_citizen else 60
      presence_req_days = 548 if marital_to_citizen else 913
      if continuous_residence_months < residence_req_months: outcome = NOT_ELIGIBLE
      elif physical_presence_days < presence_req_days: outcome = NOT_ELIGIBLE
      elif has_legal_flag: outcome = NEEDS_REVIEW
      elif english_level >= 1: outcome = ELIGIBLE
      elif age_years >= 55 AND lpr_months >= 180: outcome = ELIGIBLE_WITH_EXEMPTION
      else: outcome = NOT_ELIGIBLE
      expires_at = clock + 180 days
    input_set: "The Screening's own input fields; thresholds are fixed constants (not Program-tunable)"
    constants:
      RESIDENCE_MONTHS_STANDARD: 60
      RESIDENCE_MONTHS_MARITAL: 36
      PRESENCE_DAYS_STANDARD: 913
      PRESENCE_DAYS_MARITAL: 548
      EXEMPTION_AGE: 55
      EXEMPTION_LPR_MONTHS: 180
      SCREENING_VALID_DAYS: 180
    precision: "integer comparison; boundaries inclusive (>= meets requirement)"

  - name: fee_waiver_tier
    trigger: "FeeWaiverRequest creation (provisional variant) and decide (verified variant)"
    algorithm: threshold
    formula: |
      guideline_cents = Program.poverty_base_cents + Program.poverty_per_additional_cents * (household_size - 1)
      full_cap_cents  = guideline_cents * Program.full_waiver_threshold_pct    / 100   # exact integer product, then /100
      part_cap_cents  = guideline_cents * Program.partial_waiver_threshold_pct / 100
      tier(income, benefit):
        if benefit: return FULL
        if income * 100 <= guideline_cents * Program.full_waiver_threshold_pct: return FULL
        if income * 100 <= guideline_cents * Program.partial_waiver_threshold_pct: return PARTIAL
        return DENIED
      # all comparisons in integer cents; no floating point anywhere
    input_set: "household_size, income_cents, benefit flag — self-reported for provisional, documented for verified"
    constants:
      # resolved from Program defaults
      POVERTY_BASE_CENTS: 1565000
      POVERTY_PER_ADDITIONAL_CENTS: 550000
      FULL_THRESHOLD_PCT: 150
      PARTIAL_THRESHOLD_PCT: 200
    precision: "integer cents; boundaries inclusive (<= qualifies)"
    variants:
      - name: provisional
        when: "at creation; stored as provisional_tier; inputs are self_reported_*"
        difference: "uses self-reported income/benefit; advisory only, never gates money"
      - name: verified
        when: "at decide; inputs are documented_income_cents/documented_benefit"
        difference: "same formula on documented values; result becomes final_tier on APPROVED and drives filing_fee_total"

  - name: filing_fee_total
    trigger: "ApplicationPacket certify (status IN_LEGAL_REVIEW -> CERTIFIED)"
    algorithm: tiered_pricing
    formula: |
      # Evaluation order is PINNED: (1) resolve effective tier, (2) discount per line
      # with round_half_up to integer cents per line, (3) sum the discounted lines.
      tier = final_tier of linked APPROVED FeeWaiverRequest; NONE if no link or request DENIED
      lines = [Program.n400_fee_cents, Program.biometric_fee_cents, Program.translation_stipend_cents]
      if tier == FULL:    filing_fee_cents = 0
      if tier == NONE:    filing_fee_cents = sum(lines)                       # 87502 with defaults
      if tier == PARTIAL: filing_fee_cents = sum(round_half_up(line * 50 / 100) for line in lines)
      # round_half_up per line THEN sum. With defaults: 38000 + 4251 + 1501 = 43752.
      # The alternative order (sum-then-halve: round_half_up(87502*0.5)=43751) is a DIFFERENT
      # number and is NOT the spec; the pinned order is per-line-first.
    input_set: "Program fee schedule + linked FeeWaiverRequest final_tier at certify time"
    constants:
      PARTIAL_DISCOUNT_PCT: 50
    precision: "integer cents; round_half_up per line, then sum (order pinned)"
    variants:
      - name: full_waiver
        when: "final_tier == FULL"
        difference: "fee is exactly 0 regardless of schedule"
      - name: no_waiver
        when: "no linked request or linked request DENIED"
        difference: "raw line sum, no discount"

  - name: readiness_score
    trigger: "GET /naturalization/applicants/{applicant_id}/readiness?variant=... and ApplicationPacket certify gate (attained variant)"
    algorithm: weighted_scoring
    formula: |
      # Weights sum to 100. Single rounding: round_half_up applied ONCE to the final sum.
      res_pts   = 25 if ACTIVE screening meets residence requirement else 0
      pres_pts  = 25 if ACTIVE screening meets presence requirement else 0
      eng_pts   = 20 * english_level_used / 4        # exact rational
      civ_pts   = 20 * civics_best_used / 100        # exact rational
      legal_pts = 10 if ACTIVE screening has_legal_flag == false else 0
      score = round_half_up(res_pts + pres_pts + eng_pts + civ_pts + legal_pts)  # integer 0..100
      Variant input selection:
        attained:  english_level_used = ACTIVE screening.english_level
                   civics_best_used = max(screening.civics_practice_pct,
                                          max overall_score over this applicant's COMPLETED MockInterviews, default 0)
        projected: english_level_used = min(4, screening.english_level + 1) if the applicant has any
                                          enrollment with status == ENROLLED, else screening.english_level
                   civics_best_used   = max(attained civics_best_used, 70) if the applicant has any
                                          MockInterview with status == SCHEDULED, else attained civics_best_used
      Missing ACTIVE screening -> all terms 0 (score 0).
    input_set: "Applicant's ACTIVE screening; enrollments with status ENROLLED; MockInterviews with status COMPLETED or SCHEDULED"
    constants:
      W_RESIDENCE: 25
      W_PRESENCE: 25
      W_ENGLISH: 20
      W_CIVICS: 20
      W_LEGAL: 10
      PROJECTED_CIVICS_FLOOR: 70
    precision: "single round_half_up to integer at the end; no intermediate rounding"
    variants:
      - name: attained
        when: "default; used by the certify gate"
        difference: "only realized evidence counts (COMPLETED mocks, screened levels)"
      - name: projected
        when: "variant=projected"
        difference: "forward-looking: active enrollment bumps english by 1 level (cap 4); a SCHEDULED mock floors civics at 70"

  - name: attendance_pct
    trigger: "AttendanceRecord creation; read on Enrollment"
    algorithm: aggregation
    formula: |
      records_count = count of AttendanceRecord rows for the enrollment
      attended = count with outcome IN {PRESENT, ABSENT_EXCUSED}
      attendance_bp = records_count == 0 ? 0 : floor(attended * 10000 / records_count)   # integer truncation
    input_set: "All AttendanceRecord rows of the enrollment (event log is append-only)"
    constants:
      COMPLETE_BP: 8000
      MIDTERM_FLOOR_BP: 5000
    precision: "integer basis points, truncated"

  - name: midterm_revoke_check
    trigger: "after attendance_pct recompute on each AttendanceRecord creation"
    algorithm: threshold
    formula: |
      midterm_point = ceil(ClassSection.total_sessions / 2)   # (total_sessions + 1) // 2 integer math
      if records_count == midterm_point AND attendance_bp < Program.attendance_midterm_floor_bp:
          Enrollment -> REVOKED (fires exactly once, at the moment the midterm count is first reached)
    input_set: "the enrollment and its parent ClassSection.total_sessions"
    constants: {}
    precision: "integer; floor comparison is strict (<), so exactly 5000 bp survives"

  - name: seat_ledger
    trigger: "enrollment create / withdraw / auto-revoke / promote / confirm / promotion-expiry sweep"
    algorithm: constraint_propagation
    formula: |
      # Evaluation order is PINNED to break the circular-looking dependency between
      # promotion offers and availability:
      #   1. enrolled_count          = count(ENROLLED)
      #   2. pending_promotion_count = count(PENDING_PROMOTION)   # offers hold seats
      #   3. seats_open              = capacity - enrolled_count - pending_promotion_count
      #   4. promotions issued only while seats_open >= 1, selector: WAITLISTED by created_at ASC
      # Invariant (compensating): enrolled_count == count(ENROLLED rows) at all times;
      # enroll(+1) / withdraw(-1) / revoke(-1) / confirm(+1) pairs keep it exact.
    input_set: "Enrollments of the ClassSection in statuses ENROLLED, WAITLISTED, PENDING_PROMOTION"
    constants: {}
    precision: "integer counts"

  - name: training_hours_window
    trigger: "TrainingCredit creation; clock set (window slides); accredit/renew gates"
    algorithm: aggregation
    formula: |
      training_hours_24mo = sum(TrainingCredit.hours where earned_at >= clock - 730 days)
      # boundary INCLUSIVE: a credit earned exactly 730 days ago still counts
    input_set: "All TrainingCredit rows of the volunteer (append-only)"
    constants:
      TRAINING_WINDOW_DAYS: 730
    precision: "integer hours"

  - name: mock_interview_score
    trigger: "POST /naturalization/mock-interviews/{interview_id}/score"
    algorithm: weighted_scoring
    formula: |
      overall_score = (40 * english_pct + 40 * civics_pct + 20 * n400_pct) / 100   # integer division, truncated
      outcome = PASS if overall_score >= 70 AND civics_pct >= 60 else NEEDS_RETRY
    input_set: "the three rubric inputs of the score call"
    constants:
      W_ENGLISH: 40
      W_CIVICS: 40
      W_N400: 20
      PASS_OVERALL: 70
      PASS_CIVICS_FLOOR: 60
    precision: "integer truncation on overall_score; thresholds inclusive (>=)"

  - name: rfe_deadline
    trigger: "issue-rfe; clock sweep evaluates OVERDUE"
    algorithm: threshold
    formula: |
      rfe_deadline = rfe_issued_at + Program.rfe_deadline_days
      OVERDUE when rfe_status == ISSUED AND rfe_deadline < clock   # strictly past; exactly at deadline stays ISSUED
    input_set: "USCISCase with rfe_status == ISSUED"
    constants:
      RFE_DEADLINE_DAYS: 84
    precision: "datetime comparison, strict <"

  - name: workshop_hours_ledger
    trigger: "workshop complete / reverse-completion"
    algorithm: aggregation
    formula: |
      on complete:          Volunteer[assisting_volunteer_id].supervised_hours += Workshop.duration_hours
      on reverse-completion: Volunteer[assisting_volunteer_id].supervised_hours -= Workshop.duration_hours
      # Compensating invariant: complete(+h) followed by reverse(-h) leaves supervised_hours
      # exactly at its prior value; no drift.
    input_set: "Workshops with assisting_volunteer_id set, status COMPLETED"
    constants: {}
    precision: "integer hours"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "Request body well-formed: required fields present, types correct, enum members valid, integer ranges respected (e.g. household_size 1..12, english_level 0..4, end_minute > start_minute)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 2
    category: auth
    check: "X-User-Role and X-User-ID headers present; role is one of the declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 3
    category: auth
    check: "Role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 4
    category: existence
    check: "Path-template ids resolve left-to-right (applicant, then child, etc.); body-supplied FK ids must exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"
  - priority: 5
    category: auth
    check: "Ownership: Applicant actors may only touch rows whose applicant_id == X-User-ID; Volunteer actors only rows they instruct/supervise/are assigned to"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "self-scoped endpoints (withdraw, confirm-promotion, seat cancel, packet reads, fee-waiver create/submit/resubmit, mock cancel/score, attendance create)"
  - priority: 6
    category: state
    check: "Target resource state permits the transition (generic machine precondition)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 7
    category: business_safety
    check: "Accreditation: instructor/supervisor/certifier holds required non-lapsed level for the operation"
    error_id: ERR_ACCREDITATION_INSUFFICIENT
    http_status: 409
    applies_to: "POST class-sections, POST workshops, workshop complete, request-revision, certify, accredit, renew, POST mock-interviews"
  - priority: 8
    category: business_safety
    check: "Accreditation lapsed: required accreditation exists but level == LAPSED at check time"
    error_id: ERR_ACCREDITATION_LAPSED
    http_status: 409
    applies_to: "workshop complete, certify, request-revision, POST class-sections, POST workshops, POST mock-interviews"
  - priority: 9
    category: business_safety
    check: "Segregation of duties: certifier must differ from prepared_by_volunteer_id"
    error_id: ERR_SOD_CERTIFIER_IS_PREPARER
    http_status: 409
    applies_to: "POST /naturalization/packets/{packet_id}/certify"
  - priority: 10
    category: business_temporal
    check: "Time guards: screening not expired (ERR_SCREENING_EXPIRED); workshop complete before scheduled_start (ERR_WORKSHOP_NOT_YET_HELD); ceremony conclude before ceremony_date (ERR_CEREMONY_NOT_YET_HELD)"
    error_id: ERR_SCREENING_EXPIRED
    http_status: 409
    applies_to: "enrollment create, workshop seat reserve, packet certify, workshop complete, ceremony conclude"
  - priority: 11
    category: business_temporal
    check: "Overlap: ClassSection room window [start_minute,end_minute) half-open per weekday (adjacent allowed); MockInterview per volunteer requires gap >= mock_buffer_minutes (gap exactly 15 allowed, 14 rejected)"
    error_id: ERR_SCHEDULE_CONFLICT
    http_status: 409
    applies_to: "POST class-sections (ERR_SCHEDULE_CONFLICT), POST mock-interviews (ERR_INTERVIEW_SLOT_CONFLICT)"
  - priority: 12
    category: business_referential
    check: "Referenced child valid and belongs to the same aggregate: workshop seat must be ATTENDED (ERR_WORKSHOP_NOT_ATTENDED) and owned by the packet's applicant (ERR_REFERENTIAL_MISMATCH); fee_waiver_request, when set, must belong to the same applicant (ERR_REFERENTIAL_MISMATCH)"
    error_id: ERR_REFERENTIAL_MISMATCH
    http_status: 409
    applies_to: "POST /naturalization/applicants/{applicant_id}/packets"
  - priority: 13
    category: business_constraint
    check: "Uniqueness/duplicate-active: one Program; one active enrollment per (applicant, section); one non-terminal fee waiver per applicant; one active packet per applicant; one active case per applicant; session_index unique per enrollment; mock attempt cap"
    error_id: ERR_DUPLICATE_ACTIVE
    http_status: 409
    applies_to: "creation endpoints (specific ids: ERR_PROGRAM_EXISTS, ERR_ENROLLMENT_DUPLICATE_ACTIVE, ERR_FEE_WAIVER_ALREADY_ACTIVE, ERR_PACKET_ALREADY_ACTIVE, ERR_CASE_ALREADY_ACTIVE, ERR_SESSION_ALREADY_RECORDED, ERR_MOCK_ATTEMPTS_EXHAUSTED)"
  - priority: 14
    category: business_constraint
    check: "Cross-dimension gate: advance/assign require rfe_status == NONE"
    error_id: ERR_RFE_OPEN
    http_status: 409
    applies_to: "POST /naturalization/cases/{case_id}/advance, POST /naturalization/oath-ceremonies/{ceremony_id}/assign"
  - priority: 15
    category: business_constraint
    check: "Aggregate thresholds: attendance >= 8000 bp to complete; records_count == total_sessions before complete (ERR_SESSIONS_INCOMPLETE, evaluated BEFORE the attendance threshold within this priority); attained readiness >= 70 to certify (ERR_READINESS_BELOW_THRESHOLD); docs count >= required (ERR_FEE_WAIVER_DOCS_INSUFFICIENT); mock booking eligibility (ERR_MOCK_ELIGIBILITY)"
    error_id: ERR_ATTENDANCE_BELOW_THRESHOLD
    http_status: 409
    applies_to: "complete, certify, fee-waiver submit, mock create"
  - priority: 16
    category: business_fiscal
    check: "Money/capacity decisions last: fee waiver pending blocks certify/file (ERR_FEE_WAIVER_PENDING); verified tier DENIED blocks APPROVED (ERR_TIER_INELIGIBLE); ceremony full (ERR_CEREMONY_FULL); workshop full (ERR_WORKSHOP_FULL)"
    error_id: ERR_FEE_WAIVER_PENDING
    http_status: 409
    applies_to: "certify, decide, assign, workshop seats"
  - priority: 17
    category: business_fiscal
    check: "OCC stale version on guarded writes (final guard before commit; a write failing any earlier check never reaches the version comparison)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST enrollments, POST workshop seats, POST screenings, POST oath assign"

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Program / clock ---
  - method: POST
    path: "/naturalization/programs"
    description: "Create the singleton Program configuration (second create -> ERR_PROGRAM_EXISTS)"
    roles: [ProgramAdmin]
    code: 201
    input: [name, "n400_fee_cents?", "biometric_fee_cents?", "translation_stipend_cents?", "poverty_base_cents?", "poverty_per_additional_cents?", "full_waiver_threshold_pct?", "partial_waiver_threshold_pct?", "attendance_complete_bp?", "attendance_midterm_floor_bp?", "readiness_certify_threshold?", "rfe_deadline_days?", "accreditation_valid_months?", "general_training_hours?", "legal_supervised_hours?", "renewal_training_hours?", "promotion_offer_hours?", "mock_buffer_minutes?", "mock_max_attempts?"]
    output: Program
    side_effects: ["all omitted threshold/fee fields take their declared defaults"]

  - method: GET
    path: "/naturalization/programs/current"
    description: "Read the singleton Program configuration"
    roles: [ProgramAdmin, IntakeCoordinator, Volunteer, Applicant]
    code: 200
    input: []
    output: Program
    side_effects: []

  - method: POST
    path: "/naturalization/_clock/set_current_utc"
    description: "Advance the logical clock. Before any call, the clock reads exactly 2026-08-01T00:00:00Z (startup default; never falls back to wall-clock). Setting the clock runs the sweep: lapse accreditations past accredited_at + accreditation_valid_months; mark ISSUED RFEs with rfe_deadline < now OVERDUE; expire PENDING_PROMOTION offers (back to WAITLISTED) and re-run promotion selection."
    roles: [ProgramAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["accreditation lapse sweep", "RFE OVERDUE sweep", "promotion expiry sweep with re-promotion"]

  # --- Applicant / screening / readiness ---
  - method: POST
    path: "/naturalization/applicants"
    description: "Register an applicant"
    roles: [IntakeCoordinator]
    code: 201
    input: [full_name, email, date_of_birth, "preferred_language?"]
    output: Applicant
    side_effects: ["stage=REGISTERED"]

  - method: GET
    path: "/naturalization/applicants"
    description: "List applicants; supports reverse lookup of the applicant holding a given ACTIVE screening"
    roles: [ProgramAdmin, IntakeCoordinator]
    code: 200
    input: ["current_screening_id?", "stage?"]
    output: Applicant[]
    side_effects: []

  - method: GET
    path: "/naturalization/applicants/{applicant_id}"
    description: "Get an applicant (Applicant role: self only)"
    roles: [ProgramAdmin, IntakeCoordinator, Applicant]
    code: 200
    input: []
    output: Applicant
    side_effects: []

  - method: POST
    path: "/naturalization/applicants/{applicant_id}/screenings"
    description: "Create a screening; supersedes the applicant's prior ACTIVE screening. OCC: expected_applicant_version must match Applicant.version."
    roles: [IntakeCoordinator]
    code: 201
    input: [expected_applicant_version, marital_to_citizen, lpr_months, continuous_residence_months, physical_presence_days, age_years, english_level, civics_practice_pct, has_legal_flag]
    output: Screening
    side_effects:
      - "outcome computed per screening_outcome; expires_at = clock + 180 days"
      - "prior ACTIVE screening -> SUPERSEDED; Applicant.current_screening_id repointed"
      - "increments Applicant.version by 1"
      - "if outcome IN {ELIGIBLE, ELIGIBLE_WITH_EXEMPTION} and Applicant.stage == REGISTERED: stage -> SCREENED"

  - method: GET
    path: "/naturalization/applicants/{id}/screenings"
    description: "List an applicant's screenings (Applicant role: self only)"
    roles: [ProgramAdmin, IntakeCoordinator, Applicant]
    code: 200
    input: []
    output: Screening[]
    side_effects: []

  - method: GET
    path: "/naturalization/applicants/{applicant_id}/readiness"
    description: "Computed readiness report; variant query param attained (default) or projected"
    roles: [ProgramAdmin, IntakeCoordinator, Applicant]
    code: 200
    input: ["variant?"]
    output: { variant: string, score: integer, residence_points: integer, presence_points: integer, english_points: integer, civics_points: integer, legal_points: integer }
    side_effects: []

  # --- Class sections / enrollments / attendance ---
  - method: POST
    path: "/naturalization/class-sections"
    description: "Create a class section; instructor must hold GENERAL/LEGAL non-lapsed; room window overlap rejected (half-open per weekday, adjacency allowed)"
    roles: [ProgramAdmin]
    code: 201
    input: [title, weekday, start_minute, end_minute, room_id, instructor_volunteer_id, capacity, total_sessions]
    output: ClassSection
    side_effects: ["counters initialized to 0; seats_open = capacity"]

  - method: GET
    path: "/naturalization/class-sections"
    description: "List class sections, optionally filtered by instructor"
    roles: [ProgramAdmin, IntakeCoordinator, Volunteer, Applicant]
    code: 200
    input: ["instructor_volunteer_id?"]
    output: ClassSection[]
    side_effects: []

  - method: GET
    path: "/naturalization/class-sections/{section_id}"
    description: "Get a class section"
    roles: [ProgramAdmin, IntakeCoordinator, Volunteer, Applicant]
    code: 200
    input: []
    output: ClassSection
    side_effects: []

  - method: GET
    path: "/naturalization/class-sections/{section_id}/enrollments"
    description: "List enrollments of a section"
    roles: [ProgramAdmin, IntakeCoordinator, Volunteer]
    code: 200
    input: []
    output: Enrollment[]
    side_effects: []

  - method: POST
    path: "/naturalization/enrollments"
    description: "Enroll an applicant; ENROLLED when seats_open >= 1 else WAITLISTED. OCC: expected_section_version must match ClassSection.version."
    roles: [IntakeCoordinator, Applicant]
    code: 201
    input: [applicant_id, class_section_id, expected_section_version]
    output: Enrollment
    side_effects:
      - "increments ClassSection.version by 1 and updates seat ledger per seat_ledger calc"
      - "if ENROLLED and Applicant.stage == SCREENED: Applicant.stage -> IN_PIPELINE"

  - method: GET
    path: "/naturalization/enrollments"
    description: "List enrollments with optional filters"
    roles: [ProgramAdmin, IntakeCoordinator, Volunteer, Applicant]
    code: 200
    input: ["applicant_id?", "class_section_id?", "status?"]
    output: Enrollment[]
    side_effects: []

  - method: GET
    path: "/naturalization/enrollments/{enrollment_id}"
    description: "Get an enrollment (Applicant: self only; Volunteer: own sections only)"
    roles: [ProgramAdmin, IntakeCoordinator, Volunteer, Applicant]
    code: 200
    input: []
    output: Enrollment
    side_effects: []

  - method: POST
    path: "/naturalization/enrollments/{enrollment_id}/withdraw"
    description: "Withdraw an ENROLLED enrollment; frees the seat and triggers promotion selection"
    roles: [IntakeCoordinator, Applicant]
    code: 200
    input: []
    output: Enrollment
    side_effects: ["ClassSection.enrolled_count -= 1", "WAITLISTED -> PENDING_PROMOTION selector runs"]

  - method: POST
    path: "/naturalization/enrollments/{enrollment_id}/confirm-promotion"
    description: "Confirm a PENDING_PROMOTION enrollment before offer expiry"
    roles: [IntakeCoordinator, Applicant]
    code: 200
    input: []
    output: Enrollment
    side_effects: ["ClassSection.pending_promotion_count -= 1; enrolled_count += 1", "offer_expires_at = null", "stage SCREENED -> IN_PIPELINE if first enrollment"]

  - method: POST
    path: "/naturalization/enrollments/{enrollment_id}/complete"
    description: "Complete an enrollment: requires records_count == total_sessions and attendance_bp >= attendance_complete_bp"
    roles: [IntakeCoordinator]
    code: 200
    input: []
    output: Enrollment
    side_effects: ["status -> COMPLETED"]

  - method: POST
    path: "/naturalization/enrollments/{enrollment_id}/attendance-records"
    description: "Append an attendance event (Volunteer: only the section's instructor); session_index unique per enrollment"
    roles: [Volunteer, IntakeCoordinator]
    code: 201
    input: [session_index, outcome]
    output: AttendanceRecord
    side_effects:
      - "Enrollment.records_count += 1; attendance_bp recomputed per attendance_pct"
      - "midterm_revoke_check runs; on failure Enrollment -> REVOKED and seat cascade fires"

  - method: GET
    path: "/naturalization/enrollments/{id}/attendance-records"
    description: "List attendance events of an enrollment"
    roles: [ProgramAdmin, IntakeCoordinator, Volunteer, Applicant]
    code: 200
    input: []
    output: AttendanceRecord[]
    side_effects: []

  # --- Volunteers / training / accreditation ---
  - method: POST
    path: "/naturalization/volunteers"
    description: "Create a volunteer (starts TRAINEE)"
    roles: [ProgramAdmin]
    code: 201
    input: [full_name, email, background_check_cleared, "bar_number?"]
    output: Volunteer
    side_effects: ["accreditation_level=TRAINEE; supervised_hours=0; training_hours_24mo=0"]

  - method: GET
    path: "/naturalization/volunteers/{volunteer_id}"
    description: "Get a volunteer (Volunteer role: self only)"
    roles: [ProgramAdmin, IntakeCoordinator, Volunteer]
    code: 200
    input: []
    output: Volunteer
    side_effects: []

  - method: POST
    path: "/naturalization/volunteers/{volunteer_id}/training-credits"
    description: "Append a training credit event"
    roles: [ProgramAdmin]
    code: 201
    input: [topic, hours, earned_at]
    output: TrainingCredit
    side_effects: ["Volunteer.training_hours_24mo recomputed per training_hours_window"]

  - method: GET
    path: "/naturalization/volunteers/{id}/training-credits"
    description: "List training credits of a volunteer"
    roles: [ProgramAdmin, IntakeCoordinator, Volunteer]
    code: 200
    input: []
    output: TrainingCredit[]
    side_effects: []

  - method: POST
    path: "/naturalization/volunteers/{volunteer_id}/accredit"
    description: "Accredit TRAINEE->GENERAL (background check + training hours) or GENERAL->LEGAL (bar_number OR supervised_hours >= legal_supervised_hours)"
    roles: [ProgramAdmin]
    code: 200
    input: [target_level]
    output: Volunteer
    side_effects: ["accredited_at = clock on success"]

  - method: POST
    path: "/naturalization/volunteers/{volunteer_id}/renew"
    description: "Renew a LAPSED accreditation back to lapsed_from_level when renewal_training_hours met"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Volunteer
    side_effects: ["accredited_at = clock; lapsed_from_level = null"]

  # --- Workshops / seats ---
  - method: POST
    path: "/naturalization/workshops"
    description: "Create a workshop; supervising volunteer must hold LEGAL non-lapsed accreditation"
    roles: [ProgramAdmin]
    code: 201
    input: [title, supervising_volunteer_id, "assisting_volunteer_id?", scheduled_start, duration_hours, capacity]
    output: Workshop
    side_effects: ["status=SCHEDULED; reserved_count=0"]

  - method: GET
    path: "/naturalization/workshops"
    description: "List workshops with optional supervisor/assistant filters"
    roles: [ProgramAdmin, IntakeCoordinator, Volunteer, Applicant]
    code: 200
    input: ["supervising_volunteer_id?", "assisting_volunteer_id?"]
    output: Workshop[]
    side_effects: []

  - method: GET
    path: "/naturalization/workshops/{workshop_id}"
    description: "Get a workshop"
    roles: [ProgramAdmin, IntakeCoordinator, Volunteer, Applicant]
    code: 200
    input: []
    output: Workshop
    side_effects: []

  - method: POST
    path: "/naturalization/workshops/{workshop_id}/seats"
    description: "Reserve a seat; applicant must hold an unexpired ELIGIBLE/ELIGIBLE_WITH_EXEMPTION screening. OCC: expected_workshop_version must match Workshop.version."
    roles: [IntakeCoordinator, Applicant]
    code: 201
    input: [applicant_id, expected_workshop_version]
    output: WorkshopSeat
    side_effects: ["increments Workshop.version by 1; reserved_count += 1 (ERR_WORKSHOP_FULL when reserved_count == capacity)"]

  - method: GET
    path: "/naturalization/workshops/{workshop_id}/seats"
    description: "List seats of a workshop"
    roles: [ProgramAdmin, IntakeCoordinator, Volunteer, Applicant]
    code: 200
    input: []
    output: WorkshopSeat[]
    side_effects: []

  - method: GET
    path: "/naturalization/workshop-seats"
    description: "List workshop seats with optional filters (Applicant role: own rows only)"
    roles: [ProgramAdmin, IntakeCoordinator, Applicant]
    code: 200
    input: ["applicant_id?", "workshop_id?", "status?"]
    output: WorkshopSeat[]
    side_effects: []

  - method: GET
    path: "/naturalization/workshop-seats/{seat_id}"
    description: "Get a workshop seat (Applicant role: own seat only)"
    roles: [ProgramAdmin, IntakeCoordinator, Volunteer, Applicant]
    code: 200
    input: []
    output: WorkshopSeat
    side_effects: []

  - method: POST
    path: "/naturalization/workshop-seats/{seat_id}/cancel"
    description: "Cancel a RESERVED seat (Applicant: own seat only)"
    roles: [IntakeCoordinator, Applicant]
    code: 200
    input: []
    output: WorkshopSeat
    side_effects: ["Workshop.reserved_count -= 1"]

  - method: POST
    path: "/naturalization/workshops/{workshop_id}/complete"
    description: "Mark a workshop held; RESERVED seats -> ATTENDED; credits duration_hours to assisting volunteer"
    roles: [Volunteer, ProgramAdmin]
    code: 200
    input: []
    output: Workshop
    side_effects: ["seats RESERVED -> ATTENDED", "Volunteer[assisting].supervised_hours += duration_hours"]

  - method: POST
    path: "/naturalization/workshops/{workshop_id}/reverse-completion"
    description: "Reverse a completion (blocked when any packet references its seats); debits supervised hours"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Workshop
    side_effects: ["seats ATTENDED -> REVERSED", "Volunteer[assisting].supervised_hours -= duration_hours", "status -> COMPLETION_REVERSED"]

  - method: POST
    path: "/naturalization/workshops/{workshop_id}/cancel"
    description: "Cancel a SCHEDULED workshop; RESERVED seats -> CANCELLED"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Workshop
    side_effects: ["seats RESERVED -> CANCELLED", "status -> CANCELLED"]

  # --- Application packets ---
  - method: POST
    path: "/naturalization/applicants/{applicant_id}/packets"
    description: "Create a packet from an ATTENDED workshop seat owned by this applicant"
    roles: [IntakeCoordinator]
    code: 201
    input: [workshop_seat_id, prepared_by_volunteer_id, "fee_waiver_request_id?"]
    output: ApplicationPacket
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/naturalization/packets"
    description: "List packets with optional filters"
    roles: [ProgramAdmin, IntakeCoordinator, Volunteer, Applicant]
    code: 200
    input: ["applicant_id?", "workshop_seat_id?", "status?", "prepared_by_volunteer_id?", "certified_by_volunteer_id?", "fee_waiver_request_id?"]
    output: ApplicationPacket[]
    side_effects: []

  - method: GET
    path: "/naturalization/packets/{packet_id}"
    description: "Get a packet"
    roles: [ProgramAdmin, IntakeCoordinator, Volunteer, Applicant]
    code: 200
    input: []
    output: ApplicationPacket
    side_effects: []

  - method: POST
    path: "/naturalization/packets/{packet_id}/submit-review"
    description: "DRAFT -> IN_LEGAL_REVIEW"
    roles: [IntakeCoordinator]
    code: 200
    input: []
    output: ApplicationPacket
    side_effects: []

  - method: POST
    path: "/naturalization/packets/{packet_id}/request-revision"
    description: "IN_LEGAL_REVIEW -> NEEDS_REVISION (LEGAL volunteers only)"
    roles: [Volunteer]
    code: 200
    input: [revision_notes]
    output: ApplicationPacket
    side_effects: []

  - method: POST
    path: "/naturalization/packets/{packet_id}/revise"
    description: "NEEDS_REVISION -> DRAFT (revision cycle)"
    roles: [IntakeCoordinator]
    code: 200
    input: []
    output: ApplicationPacket
    side_effects: []

  - method: POST
    path: "/naturalization/packets/{packet_id}/certify"
    description: "IN_LEGAL_REVIEW -> CERTIFIED; LEGAL actor != preparer; fee waiver terminal; attained readiness >= threshold; screening unexpired; computes filing_fee_cents"
    roles: [Volunteer]
    code: 200
    input: []
    output: ApplicationPacket
    side_effects: ["certified_by_volunteer_id = X-User-ID", "filing_fee_cents per filing_fee_total"]

  - method: POST
    path: "/naturalization/packets/{packet_id}/file"
    description: "CERTIFIED -> FILED; creates the applicant's USCISCase"
    roles: [IntakeCoordinator]
    code: 201
    input: []
    output: USCISCase
    side_effects: ["packet -> FILED", "USCISCase created (stage=FILED, rfe_status=NONE)", "Applicant.stage -> FILED"]

  # --- Fee waivers ---
  - method: POST
    path: "/naturalization/applicants/{applicant_id}/fee-waiver-requests"
    description: "Create a fee waiver request; computes provisional_tier; applicant must hold unexpired ELIGIBLE screening; one non-terminal request per applicant"
    roles: [IntakeCoordinator, Applicant]
    code: 201
    input: [household_size, self_reported_income_cents, self_reported_benefit]
    output: FeeWaiverRequest
    side_effects: ["provisional_tier and required_document_count computed; status=DRAFT"]

  - method: GET
    path: "/naturalization/fee-waiver-requests"
    description: "List fee waiver requests with optional filters (Applicant: own only)"
    roles: [ProgramAdmin, IntakeCoordinator, Applicant]
    code: 200
    input: ["applicant_id?", "status?"]
    output: FeeWaiverRequest[]
    side_effects: []

  - method: GET
    path: "/naturalization/fee-waiver-requests/{request_id}"
    description: "Get a fee waiver request"
    roles: [ProgramAdmin, IntakeCoordinator, Applicant]
    code: 200
    input: []
    output: FeeWaiverRequest
    side_effects: []

  - method: POST
    path: "/naturalization/fee-waiver-requests/{request_id}/submit"
    description: "DRAFT -> SUBMITTED; attached_document_count must meet required_document_count"
    roles: [IntakeCoordinator, Applicant]
    code: 200
    input: [attached_document_count]
    output: FeeWaiverRequest
    side_effects: []

  - method: POST
    path: "/naturalization/fee-waiver-requests/{request_id}/decide"
    description: "SUBMITTED -> APPROVED (verified tier must be FULL/PARTIAL) or DENIED"
    roles: [ProgramAdmin]
    code: 200
    input: [decision, documented_income_cents, documented_benefit]
    output: FeeWaiverRequest
    side_effects: ["verified tier computed per fee_waiver_tier; final_tier set on APPROVED; decided_by = X-User-ID"]

  - method: POST
    path: "/naturalization/fee-waiver-requests/{request_id}/resubmit"
    description: "DENIED -> DRAFT; clears documented values and attached_document_count"
    roles: [IntakeCoordinator, Applicant]
    code: 200
    input: []
    output: FeeWaiverRequest
    side_effects: ["attached_document_count = 0; provisional_tier recomputed"]

  # --- Cases / RFE ---
  - method: GET
    path: "/naturalization/cases"
    description: "List cases with optional filters"
    roles: [ProgramAdmin, IntakeCoordinator, Applicant]
    code: 200
    input: ["applicant_id?", "oath_ceremony_id?", "stage?", "packet_id?"]
    output: USCISCase[]
    side_effects: []

  - method: GET
    path: "/naturalization/cases/{case_id}"
    description: "Get a case (Applicant: own only)"
    roles: [ProgramAdmin, IntakeCoordinator, Applicant]
    code: 200
    input: []
    output: USCISCase
    side_effects: []

  - method: POST
    path: "/naturalization/cases/{case_id}/advance"
    description: "Advance stage by exactly one step (or APPLICATION_DENIED from INTERVIEW_PASSED); blocked while rfe_status != NONE"
    roles: [ProgramAdmin]
    code: 200
    input: [to_stage]
    output: USCISCase
    side_effects: []

  - method: POST
    path: "/naturalization/cases/{case_id}/issue-rfe"
    description: "Issue an RFE; sets rfe_issued_at and rfe_deadline = clock + rfe_deadline_days"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: USCISCase
    side_effects: ["rfe_status NONE -> ISSUED"]

  - method: POST
    path: "/naturalization/cases/{case_id}/respond-rfe"
    description: "Respond to an RFE (ISSUED or OVERDUE -> RESPONDED)"
    roles: [IntakeCoordinator, ProgramAdmin]
    code: 200
    input: []
    output: USCISCase
    side_effects: []

  - method: POST
    path: "/naturalization/cases/{case_id}/clear-rfe"
    description: "Clear a RESPONDED RFE back to NONE"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: USCISCase
    side_effects: ["rfe_issued_at/rfe_deadline nulled"]

  # --- Oath ceremonies ---
  - method: POST
    path: "/naturalization/oath-ceremonies"
    description: "Create an oath ceremony"
    roles: [ProgramAdmin]
    code: 201
    input: [ceremony_date, venue, capacity]
    output: OathCeremony
    side_effects: ["status=SCHEDULED; assigned_count=0"]

  - method: GET
    path: "/naturalization/oath-ceremonies/{ceremony_id}"
    description: "Get an oath ceremony"
    roles: [ProgramAdmin, IntakeCoordinator, Volunteer, Applicant]
    code: 200
    input: []
    output: OathCeremony
    side_effects: []

  - method: POST
    path: "/naturalization/oath-ceremonies/{ceremony_id}/assign"
    description: "Assign an APPROVED_PENDING_OATH case to a ceremony. OCC: expected_ceremony_version must match OathCeremony.version."
    roles: [IntakeCoordinator, ProgramAdmin]
    code: 200
    input: [case_id, expected_ceremony_version]
    output: USCISCase
    side_effects: ["case -> OATH_SCHEDULED with oath_ceremony_id set", "increments OathCeremony.version by 1; assigned_count += 1"]

  - method: POST
    path: "/naturalization/oath-ceremonies/{ceremony_id}/conclude"
    description: "Conclude a ceremony at/after ceremony_date; assigned cases -> NATURALIZED; applicants -> NATURALIZED with voter_registration_referred = true"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: OathCeremony
    side_effects: ["cascade: case NATURALIZED -> applicant NATURALIZED + voter referral flag"]

  - method: POST
    path: "/naturalization/oath-ceremonies/{ceremony_id}/cancel"
    description: "Cancel a SCHEDULED ceremony; assigned cases revert to APPROVED_PENDING_OATH"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: OathCeremony
    side_effects: ["cases OATH_SCHEDULED -> APPROVED_PENDING_OATH; oath_ceremony_id nulled; assigned_count -= n"]

  # --- Mock interviews ---
  - method: POST
    path: "/naturalization/mock-interviews"
    description: "Book a mock interview; eligibility: COMPLETED enrollment OR attained readiness >= 40; volunteer GENERAL/LEGAL non-lapsed; per-volunteer buffer gap >= mock_buffer_minutes; attempt cap mock_max_attempts (CANCELLED rows excluded)"
    roles: [IntakeCoordinator, Applicant]
    code: 201
    input: [applicant_id, volunteer_id, scheduled_start, "duration_minutes?"]
    output: MockInterview
    side_effects: ["status=SCHEDULED"]

  - method: GET
    path: "/naturalization/mock-interviews"
    description: "List mock interviews with optional filters"
    roles: [ProgramAdmin, IntakeCoordinator, Volunteer, Applicant]
    code: 200
    input: ["applicant_id?", "volunteer_id?", "status?"]
    output: MockInterview[]
    side_effects: []

  - method: GET
    path: "/naturalization/mock-interviews/{interview_id}"
    description: "Get a mock interview"
    roles: [ProgramAdmin, IntakeCoordinator, Volunteer, Applicant]
    code: 200
    input: []
    output: MockInterview
    side_effects: []

  - method: POST
    path: "/naturalization/mock-interviews/{interview_id}/score"
    description: "Score a SCHEDULED interview (assigned volunteer only); computes overall_score and outcome"
    roles: [Volunteer]
    code: 200
    input: [english_pct, civics_pct, n400_pct]
    output: MockInterview
    side_effects: ["status -> COMPLETED; overall_score/outcome per mock_interview_score"]

  - method: POST
    path: "/naturalization/mock-interviews/{interview_id}/no-show"
    description: "Mark a SCHEDULED interview NO_SHOW"
    roles: [Volunteer, IntakeCoordinator]
    code: 200
    input: []
    output: MockInterview
    side_effects: []

  - method: POST
    path: "/naturalization/mock-interviews/{interview_id}/cancel"
    description: "Cancel a SCHEDULED interview; frees the slot from overlap checks and the attempt cap"
    roles: [IntakeCoordinator, Applicant]
    code: 200
    input: []
    output: MockInterview
    side_effects: []

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing required field, invalid enum member, or out-of-range integer (e.g. household_size outside 1..12, english_level outside 0..4, end_minute <= start_minute)" }
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing X-User-Role / X-User-ID headers or unknown role" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted on endpoint, or entity-backed actor does not own the target row" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or body FK reference does not resolve (checked left-to-right)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource state does not permit the requested transition" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent's current version (OCC)" }
  - { id: ERR_PROGRAM_EXISTS, http: 409, condition: "A Program configuration already exists (singleton)" }
  - { id: ERR_SCREENING_NOT_ELIGIBLE, http: 409, condition: "No ACTIVE screening with outcome ELIGIBLE/ELIGIBLE_WITH_EXEMPTION (missing, NOT_ELIGIBLE, or NEEDS_REVIEW)" }
  - { id: ERR_SCREENING_EXPIRED, http: 409, condition: "ACTIVE screening's expires_at <= clock" }
  - { id: ERR_ENROLLMENT_DUPLICATE_ACTIVE, http: 409, condition: "Applicant already holds an ENROLLED/WAITLISTED/PENDING_PROMOTION enrollment in this section" }
  - { id: ERR_SESSION_ALREADY_RECORDED, http: 409, condition: "An AttendanceRecord with this session_index already exists for the enrollment" }
  - { id: ERR_SESSIONS_INCOMPLETE, http: 409, condition: "records_count < ClassSection.total_sessions at completion" }
  - { id: ERR_ATTENDANCE_BELOW_THRESHOLD, http: 409, condition: "attendance_bp < attendance_complete_bp at completion" }
  - { id: ERR_ACCREDITATION_INSUFFICIENT, http: 409, condition: "Required accreditation level not held (level too low, background check missing, hours short, or renewal hours short)" }
  - { id: ERR_ACCREDITATION_LAPSED, http: 409, condition: "Required accreditation exists but is LAPSED at check time" }
  - { id: ERR_SOD_CERTIFIER_IS_PREPARER, http: 409, condition: "Certifying volunteer equals prepared_by_volunteer_id (segregation of duties)" }
  - { id: ERR_SCHEDULE_CONFLICT, http: 409, condition: "ClassSection room window overlaps an existing section on the same weekday (half-open; adjacency allowed)" }
  - { id: ERR_INTERVIEW_SLOT_CONFLICT, http: 409, condition: "Volunteer has a non-cancelled interview with gap < mock_buffer_minutes" }
  - { id: ERR_REFERENTIAL_MISMATCH, http: 409, condition: "Referenced child row belongs to a different applicant (seat or fee waiver)" }
  - { id: ERR_WORKSHOP_NOT_ATTENDED, http: 409, condition: "Packet creation requires an ATTENDED workshop seat" }
  - { id: ERR_WORKSHOP_NOT_YET_HELD, http: 409, condition: "Workshop complete before scheduled_start" }
  - { id: ERR_WORKSHOP_FULL, http: 409, condition: "reserved_count == capacity on seat reserve" }
  - { id: ERR_COMPLETION_LOCKED, http: 409, condition: "reverse-completion blocked: a packet already references one of the workshop's seats" }
  - { id: ERR_FEE_WAIVER_ALREADY_ACTIVE, http: 409, condition: "Applicant already has a DRAFT or SUBMITTED fee waiver request" }
  - { id: ERR_FEE_WAIVER_DOCS_INSUFFICIENT, http: 409, condition: "attached_document_count < required_document_count at submit" }
  - { id: ERR_FEE_WAIVER_PENDING, http: 409, condition: "Linked fee waiver request not terminal (DRAFT/SUBMITTED) at certify" }
  - { id: ERR_TIER_INELIGIBLE, http: 409, condition: "decision=APPROVED but verified tier computes to DENIED" }
  - { id: ERR_READINESS_BELOW_THRESHOLD, http: 409, condition: "Attained readiness score < readiness_certify_threshold at certify" }
  - { id: ERR_MOCK_ELIGIBILITY, http: 409, condition: "No COMPLETED enrollment and attained readiness < 40 at mock booking" }
  - { id: ERR_MOCK_ATTEMPTS_EXHAUSTED, http: 409, condition: "Applicant already has mock_max_attempts non-cancelled mock interviews" }
  - { id: ERR_PACKET_ALREADY_ACTIVE, http: 409, condition: "Applicant already has a packet in DRAFT/IN_LEGAL_REVIEW/NEEDS_REVISION/CERTIFIED" }
  - { id: ERR_CASE_ALREADY_ACTIVE, http: 409, condition: "Applicant already has a case with stage != APPLICATION_DENIED" }
  - { id: ERR_INVALID_STAGE_JUMP, http: 409, condition: "advance to_stage is not the immediate next stage (or APPLICATION_DENIED from INTERVIEW_PASSED)" }
  - { id: ERR_RFE_OPEN, http: 409, condition: "advance/assign blocked while rfe_status IN {ISSUED, RESPONDED, OVERDUE}" }
  - { id: ERR_CASE_NOT_OATH_READY, http: 409, condition: "assign requires case stage == APPROVED_PENDING_OATH" }
  - { id: ERR_CEREMONY_FULL, http: 409, condition: "assigned_count == capacity on assign" }
  - { id: ERR_CEREMONY_NOT_YET_HELD, http: 409, condition: "conclude before ceremony_date" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: ProgramAdmin
    description: "Program operator: configuration, clock, sections, workshops, ceremonies, volunteers, accreditation, fee-waiver decisions, case advancement"
    identity: opaque
    exclusive_operations:
      - "POST /naturalization/programs, POST /naturalization/_clock/set_current_utc"
      - "POST /naturalization/class-sections"
      - "POST /naturalization/volunteers, training-credits, accredit, renew"
      - "POST /naturalization/workshops (+reverse-completion, +cancel)"
      - "POST /naturalization/fee-waiver-requests/{id}/decide"
      - "POST /naturalization/cases/{id}/advance, issue-rfe, clear-rfe"
      - "POST /naturalization/oath-ceremonies (+conclude, +cancel)"
    shared_operations:
      - "read endpoints across all resources"
      - "workshop complete, oath assign (with IntakeCoordinator/Volunteer as declared)"
      - "respond-rfe (with IntakeCoordinator)"
  - name: IntakeCoordinator
    description: "Front-desk staff: applicant intake, screenings, enrollments, attendance, packets, fee-waiver intake, RFE response, oath assignment, mock booking"
    identity: opaque
    exclusive_operations:
      - "POST /naturalization/applicants"
      - "POST /naturalization/applicants/{id}/screenings"
      - "POST /naturalization/enrollments/{id}/complete"
      - "POST /naturalization/applicants/{id}/packets, submit-review, revise, file"
    shared_operations:
      - "enrollments create/withdraw/confirm-promotion (with Applicant self)"
      - "attendance-records create (with Volunteer instructor)"
      - "workshop seats create/cancel (with Applicant self)"
      - "fee-waiver create/submit/resubmit (with Applicant self)"
      - "respond-rfe, oath assign (with ProgramAdmin)"
      - "mock-interviews create/no-show/cancel (with Applicant self / assigned Volunteer)"
      - "read endpoints"
  - name: Volunteer
    description: "Accredited program volunteer; capabilities gated by accreditation_level (GENERAL instructs/interviews, LEGAL supervises/certifies)"
    identity: "entity_backed:Volunteer"
    exclusive_operations:
      - "POST /naturalization/packets/{id}/request-revision (LEGAL only)"
      - "POST /naturalization/packets/{id}/certify (LEGAL only, and != preparer)"
      - "POST /naturalization/mock-interviews/{id}/score (assigned volunteer only)"
    shared_operations:
      - "attendance-records create (own sections only, with IntakeCoordinator)"
      - "workshop complete (own supervised workshops, with ProgramAdmin)"
      - "read endpoints (self-scoped where declared)"
  - name: Applicant
    description: "Naturalization applicant; self-service on own rows only"
    identity: "entity_backed:Applicant"
    exclusive_operations: []
    shared_operations:
      - "enrollments create/withdraw/confirm-promotion (own applicant_id only)"
      - "workshop seats create/cancel (own applicant_id only)"
      - "fee-waiver create/submit/resubmit (own rows only)"
      - "mock-interviews create/cancel (own applicant_id only)"
      - "read own applicants/screenings/readiness/enrollments/attendance/seats/packets/waivers/cases/mocks; read class-sections, workshops, ceremonies"
