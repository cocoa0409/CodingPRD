# =============================================================================
# §1.9 Scaffold Corner Design — Manufactured Home Transport & Set Crew
#
# Breadth probe over the §1.1-§1.7 surface of SCAFFOLD.yaml. Sections and
# claim_type values are taken from references/claim-extraction-guide.md; rows
# already proved by SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8) appear as
# excluded_because stubs naming the covering difficulty instance.
#
# Every fee, split, score and invoice literal below was executed in Python
# before being written down.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: order_creation_returns_declared_fields_and_open_posture
        claim_type: creation
        grounds:
          - entities.InstallationOrder
          - endpoints[POST /installations/orders]
          - calculations.order_posture
        distinguishing_aspect: |
          POST with every required field returns 201 and echoes all six input
          fields plus the four common fields; a descendant-free order lands on
          ladder rung P5 and reads posture OPEN, not null and not TRANSPORT_BLOCKED.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "one Plant to own the order"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /installations/plants"
              payload: { name: "Champion Chandler", state_code: "AZ", hud_plant_code: "AZ-014" }
              as: NetworkAdmin
              captures: { plant_id: $.data.id }
          trigger:
            - call: "POST /installations/orders"
              payload: { plant_id: "${plant_id}", dealer_name: "Valley Homes", home_model: "Titan 2860", section_count: 2, destination_state: "AZ", wind_zone: "I" }
              as: NetworkAdmin
              captures: { order_id: $.data.id }
          assert:
            - "trigger returns HTTP 201"
            - "InstallationOrder.${order_id}.plant_id == ${plant_id}"
            - "InstallationOrder.${order_id}.dealer_name == Valley Homes"
            - "InstallationOrder.${order_id}.home_model == Titan 2860"
            - "InstallationOrder.${order_id}.section_count == 2"
            - "InstallationOrder.${order_id}.destination_state == AZ"
            - "InstallationOrder.${order_id}.wind_zone == I"
            - "InstallationOrder.${order_id}.posture == OPEN"
            - "InstallationOrder.${order_id}.invoice_total_cents == 0"
            - "InstallationOrder.${order_id}.warranty_start_date == null"
            - "InstallationOrder.${order_id}.version == 1"
            - "response envelope carries meta.api_request_id, meta.api_request_timestamp and response_type == object"

      - name: hauler_retrieval_returns_stored_row
        claim_type: retrieval
        grounds:
          - endpoints[GET /installations/haulers/{id}]
          - entities.Hauler
        distinguishing_aspect: |
          GET /{id} returns the same row the POST minted, including the two
          computed fields (chargeback_balance_cents 0 and status ACTIVE) that the
          client never supplied.
        test_recipe:
          setup:
            - "one Hauler created with an endorsed-state array of two entries"
          setup_api_calls:
            - call: "POST /installations/haulers"
              payload: { name: "Desert Toter", dot_number: "DOT-771004", insurance_expiry_date: "2027-01-31", endorsed_states: ["AZ", "NM"] }
              as: NetworkAdmin
              captures: { hauler_id: $.data.id }
          trigger:
            - call: "GET /installations/haulers/${hauler_id}"
              payload: {}
              as: PermitDesk
          assert:
            - "trigger returns HTTP 200"
            - "Hauler.${hauler_id}.name == Desert Toter"
            - "Hauler.${hauler_id}.dot_number == DOT-771004"
            - "Hauler.${hauler_id}.insurance_expiry_date == 2027-01-31"
            - "Hauler.${hauler_id}.endorsed_states == [AZ, NM]"
            - "Hauler.${hauler_id}.chargeback_balance_cents == 0"
            - "Hauler.${hauler_id}.status == ACTIVE"
            - "Hauler.${hauler_id}.version == 1"

      - name: sections_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /installations/sections]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          total_count reports the full filtered set (3) regardless of the page
          size, has_more is true on the first page of 2 and false on the second
          page of 1, and the order_id filter is applied before pagination so a
          second order's sections never leak into either page.
        test_recipe:
          setup:
            - "one Plant and two orders; order A declares 3 sections, order B declares 1"
            - "three sections on order A (indexes 1, 2, 3) and one section on order B"
          setup_api_calls:
            - call: "POST /installations/plants"
              payload: { name: "Champion Chandler", state_code: "AZ", hud_plant_code: "AZ-014" }
              as: NetworkAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /installations/orders"
              payload: { plant_id: "${plant_id}", dealer_name: "Valley Homes", home_model: "Titan 3266", section_count: 3, destination_state: "AZ", wind_zone: "I" }
              as: NetworkAdmin
              captures: { order_a_id: $.data.id }
            - call: "POST /installations/orders"
              payload: { plant_id: "${plant_id}", dealer_name: "Mesa Homes", home_model: "Titan 1660", section_count: 1, destination_state: "AZ", wind_zone: "I" }
              as: NetworkAdmin
              captures: { order_b_id: $.data.id }
            - call: "POST /installations/sections"
              payload: { order_id: "${order_a_id}", section_index: 1, declared_width_in: 168, declared_height_in: 150, declared_length_in: 768, declared_weight_lb: 24000 }
              as: PlantDispatcher
              as_user_id: "${plant_id}"
              captures: { sec_a1_id: $.data.id }
            - call: "POST /installations/sections"
              payload: { order_id: "${order_a_id}", section_index: 2, declared_width_in: 168, declared_height_in: 150, declared_length_in: 768, declared_weight_lb: 24000, mates_to_section_id: "${sec_a1_id}" }
              as: PlantDispatcher
              as_user_id: "${plant_id}"
            - call: "POST /installations/sections"
              payload: { order_id: "${order_a_id}", section_index: 3, declared_width_in: 168, declared_height_in: 150, declared_length_in: 768, declared_weight_lb: 24000 }
              as: PlantDispatcher
              as_user_id: "${plant_id}"
            - call: "POST /installations/sections"
              payload: { order_id: "${order_b_id}", section_index: 1, declared_width_in: 168, declared_height_in: 150, declared_length_in: 720, declared_weight_lb: 22000 }
              as: PlantDispatcher
              as_user_id: "${plant_id}"
          trigger:
            - call: "GET /installations/sections?order_id=${order_a_id}&limit=2&offset=0"
              payload: {}
              as: NetworkAdmin
            - call: "GET /installations/sections?order_id=${order_a_id}&limit=2&offset=2"
              payload: {}
              as: NetworkAdmin
          assert:
            - "trigger step 1 returns HTTP 200 with response_type == array"
            - "trigger step 1 data length == 2"
            - "trigger step 1 total_count == 3"
            - "trigger step 1 has_more == true"
            - "trigger step 2 data length == 1"
            - "trigger step 2 total_count == 3"
            - "trigger step 2 has_more == false"
            - "no section belonging to ${order_b_id} appears in either page"

      - name: permit_get_unknown_uuid_returns_not_found
        claim_type: not_found
        grounds:
          - endpoints[GET /installations/permits/{id}]
          - errors[ERR_PERMIT_NOT_FOUND]
          - validations[priority=4]
        distinguishing_aspect: |
          A syntactically valid but unused UUID on the permit path yields the
          permit-specific 404 code, not a generic ERR_NOT_FOUND and not a 400.
        test_recipe:
          setup:
            - "empty database; no permits exist"
          setup_api_calls: []
          trigger:
            - call: "GET /installations/permits/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PermitDesk
          assert:
            - "trigger returns HTTP 404 with error_id ERR_PERMIT_NOT_FOUND"
            - "response_type == error"

      - name: section_create_missing_declared_width_rejected
        claim_type: required_fields
        grounds:
          - entities.HomeSection.fields.declared_width_in
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          declared_width_in has source input, no default and required true, so
          omitting it is a 400 at priority 3 - ahead of the existence checks,
          which is why an omitted width on a request that ALSO names an unknown
          order still reports ERR_INVALID_REQUEST rather than ERR_ORDER_NOT_FOUND.
        test_recipe:
          setup:
            - "one Plant and one order with a valid id"
          setup_api_calls:
            - call: "POST /installations/plants"
              payload: { name: "Champion Chandler", state_code: "AZ", hud_plant_code: "AZ-014" }
              as: NetworkAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /installations/orders"
              payload: { plant_id: "${plant_id}", dealer_name: "Valley Homes", home_model: "Titan 1660", section_count: 1, destination_state: "AZ", wind_zone: "I" }
              as: NetworkAdmin
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /installations/sections"
              payload: { order_id: "${order_id}", section_index: 1, declared_height_in: 150, declared_length_in: 720, declared_weight_lb: 22000 }
              as: PlantDispatcher
              as_user_id: "${plant_id}"
            - call: "POST /installations/sections"
              payload: { order_id: "00000000-0000-4000-8000-000000000000", section_index: 1, declared_height_in: 150, declared_length_in: 720, declared_weight_lb: 22000 }
              as: PlantDispatcher
              as_user_id: "${plant_id}"
          assert:
            - "trigger step 1 returns HTTP 400 with error_id ERR_INVALID_REQUEST"
            - "trigger step 2 returns HTTP 400 with error_id ERR_INVALID_REQUEST (priority 3 outranks the priority 5 body-FK existence check)"
            - "GET /installations/sections?order_id=${order_id} returns total_count == 0"

      - name: escort_crew_and_set_crew_defaults_applied
        claim_type: defaults
        grounds:
          - entities.EscortCrew.fields.buffer_minutes
          - entities.EscortCrew.fields.max_reserved_minutes
          - entities.SetCrew.fields.daily_capacity
          - entities.DamageClaim.fields.blocks_set
        distinguishing_aspect: |
          Three declared defaults land when their fields are omitted -
          buffer_minutes 45, max_reserved_minutes 600, daily_capacity 1 - and the
          defaults are the DECLARED values, not zero. Sending an explicit 0
          buffer must be preserved rather than being replaced by the default.
        test_recipe:
          setup:
            - "no fixtures required beyond the two creates below"
          setup_api_calls: []
          trigger:
            - call: "POST /installations/escort-crews"
              payload: { vendor_name: "Default Escort", endorsed_states: ["AZ"], certified_roles: ["ESCORT"], endorsement_class: "STANDARD" }
              as: NetworkAdmin
              captures: { esc_default_id: $.data.id }
            - call: "POST /installations/escort-crews"
              payload: { vendor_name: "Explicit Zero Escort", endorsed_states: ["AZ"], certified_roles: ["ESCORT"], endorsement_class: "STANDARD", buffer_minutes: 0, max_reserved_minutes: 600 }
              as: NetworkAdmin
              captures: { esc_zero_id: $.data.id }
            - call: "POST /installations/set-crews"
              payload: { company_name: "Sonoran Set", hud_installer_license_no: "AZ-INST-88", license_state: "AZ", license_expiry_date: "2027-06-30" }
              as: NetworkAdmin
              captures: { crew_id: $.data.id }
          assert:
            - "EscortCrew.${esc_default_id}.buffer_minutes == 45"
            - "EscortCrew.${esc_default_id}.max_reserved_minutes == 600"
            - "EscortCrew.${esc_default_id}.reserved_minutes == 0"
            - "EscortCrew.${esc_default_id}.status == AVAILABLE"
            - "EscortCrew.${esc_zero_id}.buffer_minutes == 0"
            - "SetCrew.${crew_id}.daily_capacity == 1"
            - "SetCrew.${crew_id}.chargeback_balance_cents == 0"
            - "SetCrew.${crew_id}.status == ACTIVE"

      - name: permit_computed_fee_fields_ignore_client_supplied_values
        claim_type: computed_fields
        grounds:
          - entities.TransportPermit.fields.provisional_fee_cents
          - entities.TransportPermit.fields.permit_class
          - entities.TransportPermit.fields.escort_count_required
          - calculations.escort_requirement_matrix
          - calculations.permit_fee_assessment
        distinguishing_aspect: |
          permit_class, escort_count_required, pilot_car_required,
          provisional_fee_cents, final_fee_cents, paid_amount_cents and status all
          have source computed, and §1.5 declares none of them as inputs on POST
          /installations/permits, so they are unforgeable: an AZ 168 in section on
          1 planned leg is STANDARD with 0 escorts, 16500 cents provisional, 0
          paid, a null final fee and status REQUESTED, all derived from the five
          declared inputs alone. Any such key added to the body is not part of the
          endpoint contract.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "one Plant, a single-section AZ order, the 168 in section measured and released"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /installations/plants"
              payload: { name: "Champion Chandler", state_code: "AZ", hud_plant_code: "AZ-014" }
              as: NetworkAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /installations/orders"
              payload: { plant_id: "${plant_id}", dealer_name: "Valley Homes", home_model: "Titan 1660", section_count: 1, destination_state: "AZ", wind_zone: "I" }
              as: NetworkAdmin
              captures: { order_id: $.data.id }
            - call: "POST /installations/sections"
              payload: { order_id: "${order_id}", section_index: 1, declared_width_in: 168, declared_height_in: 150, declared_length_in: 720, declared_weight_lb: 22000 }
              as: PlantDispatcher
              as_user_id: "${plant_id}"
              captures: { sec_id: $.data.id }
            - call: "POST /installations/sections/${sec_id}/measure"
              payload: { measured_width_in: 168, measured_height_in: 150 }
              as: PlantDispatcher
              as_user_id: "${plant_id}"
            - call: "POST /installations/sections/${sec_id}/release"
              payload: {}
              as: PlantDispatcher
              as_user_id: "${plant_id}"
              captures: { sec_v: $.data.version }
          trigger:
            - call: "POST /installations/permits"
              payload: { section_id: "${sec_id}", state_code: "AZ", planned_leg_count: 1, expected_section_version: "${sec_v}", night_move: false }
              as: PermitDesk
              captures: { permit_id: $.data.id }
          assert:
            - "trigger returns HTTP 201"
            - "TransportPermit.${permit_id}.permit_class == STANDARD"
            - "TransportPermit.${permit_id}.escort_count_required == 0"
            - "TransportPermit.${permit_id}.pilot_car_required == false"
            - "TransportPermit.${permit_id}.provisional_fee_cents == 16500"
            - "TransportPermit.${permit_id}.status == REQUESTED"
            - "TransportPermit.${permit_id}.paid_amount_cents == 0"
            - "TransportPermit.${permit_id}.final_fee_cents == null"

      - name: order_system_fields_minted_by_server
        claim_type: system_fields
        grounds:
          - entities.InstallationOrder
          - endpoints[POST /installations/orders]
        distinguishing_aspect: |
          id, created_at, updated_at and version are server-minted and §1.5
          declares none of them as inputs: the returned id is a bare UUID with no
          type prefix and version starts at 1. The load-bearing half of the claim
          is that a mutation the client never addressed - inserting a child
          section - still advances the ORDER's version to 2 and moves its
          updated_at while leaving created_at untouched.
        test_recipe:
          setup:
            - "one Plant to own the order"
          setup_api_calls:
            - call: "POST /installations/plants"
              payload: { name: "Champion Chandler", state_code: "AZ", hud_plant_code: "AZ-014" }
              as: NetworkAdmin
              captures: { plant_id: $.data.id }
          trigger:
            - call: "POST /installations/orders"
              payload: { plant_id: "${plant_id}", dealer_name: "Valley Homes", home_model: "Titan 1660", section_count: 1, destination_state: "AZ", wind_zone: "I" }
              as: NetworkAdmin
              captures: { order_id: $.data.id }
            - call: "POST /installations/sections"
              payload: { order_id: "${order_id}", section_index: 1, declared_width_in: 168, declared_height_in: 150, declared_length_in: 720, declared_weight_lb: 22000 }
              as: PlantDispatcher
              as_user_id: "${plant_id}"
          assert:
            - "trigger step 1 returns HTTP 201"
            - "InstallationOrder.${order_id}.id is a bare UUID with no type prefix"
            - "InstallationOrder.${order_id}.version == 1 immediately after trigger step 1"
            - "InstallationOrder.${order_id}.created_at is an ISO-8601 UTC timestamp with three fractional digits"
            - "after trigger step 2: InstallationOrder.${order_id}.version == 2"
            - "after trigger step 2: InstallationOrder.${order_id}.created_at is unchanged from trigger step 1"
            - "after trigger step 2: InstallationOrder.${order_id}.updated_at is strictly later than its value after trigger step 1"

      - name: order_and_section_type_constraints_rejected
        claim_type: type_constraints
        grounds:
          - entities.InstallationOrder.fields.wind_zone
          - entities.InstallationOrder.fields.section_count
          - entities.HomeSection.fields.declared_width_in
          - validations[priority=3]
        distinguishing_aspect: |
          Three different shapes of schema violation all land on
          ERR_INVALID_REQUEST at priority 3: an out-of-catalogue enum (wind_zone
          IV, where the anchor table only knows I/II/III), a below-range integer
          (section_count 0, which would make the required joint count negative)
          and a negative dimension (declared_width_in -1).
        test_recipe:
          setup:
            - "one Plant and one valid order to hang the section create on"
          setup_api_calls:
            - call: "POST /installations/plants"
              payload: { name: "Champion Chandler", state_code: "AZ", hud_plant_code: "AZ-014" }
              as: NetworkAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /installations/orders"
              payload: { plant_id: "${plant_id}", dealer_name: "Valley Homes", home_model: "Titan 1660", section_count: 1, destination_state: "AZ", wind_zone: "I" }
              as: NetworkAdmin
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /installations/orders"
              payload: { plant_id: "${plant_id}", dealer_name: "Valley Homes", home_model: "Titan 1660", section_count: 1, destination_state: "AZ", wind_zone: "IV" }
              as: NetworkAdmin
            - call: "POST /installations/orders"
              payload: { plant_id: "${plant_id}", dealer_name: "Valley Homes", home_model: "Titan 1660", section_count: 0, destination_state: "AZ", wind_zone: "I" }
              as: NetworkAdmin
            - call: "POST /installations/sections"
              payload: { order_id: "${order_id}", section_index: 1, declared_width_in: -1, declared_height_in: 150, declared_length_in: 720, declared_weight_lb: 22000 }
              as: PlantDispatcher
              as_user_id: "${plant_id}"
          assert:
            - "trigger step 1 returns HTTP 400 with error_id ERR_INVALID_REQUEST"
            - "trigger step 2 returns HTTP 400 with error_id ERR_INVALID_REQUEST"
            - "trigger step 3 returns HTTP 400 with error_id ERR_INVALID_REQUEST"
            - "GET /installations/orders?plant_id=${plant_id} returns total_count == 1"
            - "GET /installations/sections?order_id=${order_id} returns total_count == 0"

      - name: marriage_joint_immutable_row_has_no_version_and_no_update
        claim_type: immutability
        grounds:
          - entities.MarriageJoint
          - endpoints[POST /installations/marriage-joints]
          - endpoints[GET /installations/marriage-joints/{id}]
        distinguishing_aspect: |
          MarriageJoint is declared common_fields false and entity_kind event, so
          the row carries id and created_at only: no version, no updated_at, and
          §1.5 exposes no PATCH or DELETE for it. Its deviation_score is frozen at
          insert; correcting a joint means inserting a new joint_index, which is
          why the duplicate-index rule exists.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "one Plant, one SetCrew, a two-section AZ order and a SetJob booked on it"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /installations/plants"
              payload: { name: "Champion Chandler", state_code: "AZ", hud_plant_code: "AZ-014" }
              as: NetworkAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /installations/set-crews"
              payload: { company_name: "Sonoran Set", hud_installer_license_no: "AZ-INST-88", license_state: "AZ", license_expiry_date: "2027-06-30", daily_capacity: 1 }
              as: NetworkAdmin
              captures: { crew_id: $.data.id }
            - call: "POST /installations/orders"
              payload: { plant_id: "${plant_id}", dealer_name: "Valley Homes", home_model: "Titan 2860", section_count: 2, destination_state: "AZ", wind_zone: "I" }
              as: NetworkAdmin
              captures: { order_id: $.data.id, order_v: $.data.version }
            - call: "POST /installations/set-jobs"
              payload: { order_id: "${order_id}", set_crew_id: "${crew_id}", scheduled_start_date: "2026-08-10", scheduled_end_date: "2026-08-11", labor_base_cents: 480000, expected_order_version: "${order_v}" }
              as: NetworkAdmin
              captures: { job_id: $.data.id }
          trigger:
            - call: "POST /installations/marriage-joints"
              payload: { set_job_id: "${job_id}", joint_index: 1, gap_in: 0.5, vertical_offset_in: 1.0, ridge_beam_shim_in: 0.25 }
              as: SetCrewLead
              as_user_id: "${crew_id}"
              captures: { joint_id: $.data.id }
            - call: "GET /installations/marriage-joints/${joint_id}"
              payload: {}
              as: InstallationInspector
              as_user_id: "insp-site-1"
          assert:
            - "trigger step 1 returns HTTP 201"
            - "MarriageJoint.${joint_id} response contains id and created_at"
            - "MarriageJoint.${joint_id} response contains NO version field"
            - "MarriageJoint.${joint_id} response contains NO updated_at field"
            - "MarriageJoint.${joint_id}.deviation_score == 0.65 (1.0*0.25 + 0.6*0.5 + 0.4*0.25)"
            - "§1.5 declares no PATCH and no DELETE on /installations/marriage-joints/{id}"

      - name: section_create_under_unknown_order_returns_order_not_found
        claim_type: parent_relationships
        grounds:
          - entities.HomeSection.parent
          - entities.HomeSection.fields.order_id
          - validations[priority=5]
          - errors[ERR_ORDER_NOT_FOUND]
        distinguishing_aspect: |
          HomeSection declares InstallationOrder as its parent, so a schema-valid
          body naming an unused order UUID fails the priority-5 body-FK existence
          check with the ORDER-specific 404 - the section is never created and the
          error is not a 422 integrity error.
        test_recipe:
          setup:
            - "one Plant exists; no order carries the UUID used in the trigger"
          setup_api_calls:
            - call: "POST /installations/plants"
              payload: { name: "Champion Chandler", state_code: "AZ", hud_plant_code: "AZ-014" }
              as: NetworkAdmin
              captures: { plant_id: $.data.id }
          trigger:
            - call: "POST /installations/sections"
              payload: { order_id: "00000000-0000-4000-8000-000000000000", section_index: 1, declared_width_in: 168, declared_height_in: 150, declared_length_in: 720, declared_weight_lb: 22000 }
              as: PlantDispatcher
              as_user_id: "${plant_id}"
          assert:
            - "trigger returns HTTP 404 with error_id ERR_ORDER_NOT_FOUND"
            - "GET /installations/sections returns total_count == 0"

      - name: damage_claim_graph_junction_reachable_from_all_four_parents
        claim_type: graph
        grounds:
          - complexity_profile.entity_topology
          - entities.DamageClaim.fields.order_id
          - entities.DamageClaim.fields.section_id
          - entities.DamageClaim.fields.hauler_id
          - entities.DamageClaim.fields.set_crew_id
          - endpoints[GET /installations/damage-claims]
        distinguishing_aspect: |
          DamageClaim is the graph junction that makes the topology non-tree: one
          row simultaneously references an order, a section, a hauler and a set
          crew, and each of the four filtered list forms must return exactly that
          row while returning nothing for a sibling party that is not on the
          claim.
        test_recipe:
          setup:
