              captures: { d_post: $.data.direct_obligated_cents, p_post: $.data.indirect_pool_cents, o_post: $.data.obligated_cents, r_post: $.data.remaining_cents, rate_post: $.data.indirect_rate }
          assert:
            - "${appr1} == 212509"
            - "${appr2} == 212509"
            - "${d_pre} == 425018"
            - "${p_pre} == 34511"
            - "${o_pre} == 459529"
            - "${r_pre} == 4540471"
            - "${v_st} == VOIDED"
            - "${v_appr} == null"
            - "${d_post} == 212509"
            - "${p_post} == 17256"
            - "${p_post} != 17255"
            - "${rate_post} == 0.0812"
            - "${o_post} == 229765"
            - "${r_post} == 4770235"
            - "${r_post} != 4770236"
            - "Expenditure.${exp1_id}.status == CERTIFIED and approved_cents == 212509"
            - "GrantAward.${grant_id}.allocation_cents == ${o_post} + ${r_post}"

      - name: reversing_a_credit_posting_restores_the_student_and_the_cohort_ledger_exactly
        grounds:
          - endpoints[POST /cte/students/{id}/credit-postings]
          - calculations.concentrator_cohort_classification
          - calculations.performance_indicator_actual
          - entities.PerformanceIndicator.fields.denominator_count
          - entities.PerformanceIndicator.fields.small_cohort_flag
          - validations[priority=37]
          - errors[ERR_CREDIT_BALANCE_NEGATIVE]
        distinguishing_aspect: |
          This compensation crosses TWO derived layers rather than one ledger: a negative credit_delta must demote the
          student from CONCENTRATOR back to PARTICIPANT AND shrink the indicator's denominator_count from 5 to 4, which
          flips small_cohort_flag to true; re-posting the same magnitude must restore every one of those four values,
          with no drift in cte_credits_earned and no residual small_cohort_flag.
        test_recipe:
          setup:
            - "Logical clock at its startup default 2026-08-01T00:00:00Z."
            - "One ProgramOfStudy in approval_status DRAFT with one ACTIVE SECONDARY course of 4.00 credit hours and one NATIONAL Credential."
            - "Five Students in cohort_year 2026 each holding exactly 2.00 CTE credits, so all five are CONCENTRATOR."
            - "One PerformanceIndicator 4S1_CREDENTIAL / reporting_year 2027 / cohort_year 2026 in status AGREED with negotiated_level_pct 44.44, denominator_count 5 and small_cohort_flag false because 5 is not below SMALL_COHORT_MIN 5."
          setup_api_calls:
            - call: "POST /cte/programs-of-study"
              payload: { cip_code: "13.1319", title: "Technology Education", cluster: "INFORMATION_TECHNOLOGY", labor_market_data_asof: "2026-03-01" }
              as: CteDirector
              as_user_id: "u_dir_1"
              captures: { pos_id: $.data.id }
            - call: "POST /cte/programs-of-study/${pos_id}/sequence-courses"
              payload: { code: "TEC-1", title: "Technology Education I", segment: "SECONDARY", position: 1, credit_hours: 4.00, status: "ACTIVE" }
              as: CteDirector
              as_user_id: "u_dir_1"
              captures: { crs_sec_id: $.data.id }
            - call: "POST /cte/programs-of-study/${pos_id}/credentials"
              payload: { code: "ITF-PLUS", title: "CompTIA ITF+", tier: "NATIONAL", exam_required: false }
              as: CteDirector
              as_user_id: "u_dir_1"
              captures: { cred_id: $.data.id }
            - call: "POST /cte/programs-of-study/${pos_id}/students"
              payload: { state_student_id: "100000001", cohort_year: 2026 }
              as: SchoolRegistrar
              as_user_id: "u_reg_1"
              captures: { stu1_id: $.data.id }
            - call: "POST /cte/students/${stu1_id}/credit-postings"
              payload: { sequence_course_id: "${crs_sec_id}", credit_delta: 2.00, posted_on: "2026-07-15" }
              as: SchoolRegistrar
              as_user_id: "u_reg_1"
            - call: "POST /cte/programs-of-study/${pos_id}/students"
              payload: { state_student_id: "100000002", cohort_year: 2026 }
              as: SchoolRegistrar
              as_user_id: "u_reg_1"
              captures: { stu2_id: $.data.id }
            - call: "POST /cte/students/${stu2_id}/credit-postings"
              payload: { sequence_course_id: "${crs_sec_id}", credit_delta: 2.00, posted_on: "2026-07-15" }
              as: SchoolRegistrar
              as_user_id: "u_reg_1"
            - call: "POST /cte/programs-of-study/${pos_id}/students"
              payload: { state_student_id: "100000003", cohort_year: 2026 }
              as: SchoolRegistrar
              as_user_id: "u_reg_1"
              captures: { stu3_id: $.data.id }
            - call: "POST /cte/students/${stu3_id}/credit-postings"
