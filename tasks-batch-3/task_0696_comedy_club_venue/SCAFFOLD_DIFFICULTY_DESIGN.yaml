              as: Booker
              captures: { show_id: $.data.id }
            - call: "POST /venues/${venue_id}/shows/${show_id}/sections"
              payload: { kind: "TABLE", label: "Floor" }
              as: Booker
              captures: { section_id: $.data.id }
            - call: "POST /venues/${venue_id}/shows/${show_id}/sections/${section_id}/tables"
              payload: { table_number: "T1", seats: 4 }
