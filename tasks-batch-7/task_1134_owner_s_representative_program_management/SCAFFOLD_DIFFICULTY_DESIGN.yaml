  - rule_id: compensating_invariant
    instances:
      - name: contingency_reserve_release_conservation
        grounds:
          - calculations.contingency_pool_recompute
          - state_machines.ContingencyDrawdown.RESERVED_to_COMMITTED
          - state_machines.ContingencyDrawdown.COMMITTED_to_RELEASED
        distinguishing_aspect: |
          Conserved quantity = the contingency pool total: reserve -> commit ->
          release moves 400000 through RESERVED then COMMITTED and back to
          available, and at every step
          total == reserved + committed + drawn + available holds exactly; the
          forward/compensating pair leaves all four pool fields unchanged.
        test_recipe:
          setup:
            - "Program ACTIVE: budget 10000000, contingency 1000000; pool pristine (reserved 0, committed 0, drawn 0, available 1000000)"
          setup_api_calls:
            - { call: "POST /programs", payload: { program_name: "P-POOL", owner_organization: "OwnerOrg" }, as: OwnerRepPM, as_user_id: "pm-1", captures: { prog: $.data.id } }
            - { call: "POST /charters", payload: { program_id: "${prog}", objectives: "obj", scope_statement: "scope" }, as: OwnerRepPM, as_user_id: "pm-1", captures: { ch: $.data.id } }
            - { call: "POST /charters/${ch}/submit", payload: {}, as: OwnerRepPM, as_user_id: "pm-1" }
            - { call: "GET /programs/${prog}", payload: {}, as: OwnerRepPM, as_user_id: "pm-1", captures: { pv: $.data.version } }
            - { call: "POST /charters/${ch}/decide", payload: { decision: "APPROVE", expected_program_version: "${pv}" }, as: Owner, as_user_id: "owner-1" }
            - { call: "POST /baselines", payload: { program_id: "${prog}", total_budget_cents: 10000000, contingency_total_cents: 1000000, target_finish_date: "2027-03-31", lines: [ { cost_code: "CC-100", amount_cents: 10000000 } ] }, as: OwnerRepPM, as_user_id: "pm-1", captures: { bl: $.data.id } }
            - { call: "POST /baselines/${bl}/submit", payload: {}, as: OwnerRepPM, as_user_id: "pm-1" }
            - { call: "GET /programs/${prog}", payload: {}, as: OwnerRepPM, as_user_id: "pm-1", captures: { pv2: $.data.version } }
            - { call: "POST /baselines/${bl}/decide", payload: { decision: "APPROVE", expected_program_version: "${pv2}" }, as: Owner, as_user_id: "owner-1" }
            - { call: "POST /programs/${prog}/activate", payload: {}, as: OwnerRepPM, as_user_id: "pm-1" }
          trigger:
            - { call: "POST /contingency-drawdowns", payload: { program_id: "${prog}", purpose: "round trip", amount_cents: 400000 }, as: OwnerRepPM, as_user_id: "pm-1", captures: { dd: $.data.id } }
            - { call: "POST /contingency-drawdowns/${dd}/commit", payload: {}, as: OwnerRepPM, as_user_id: "pm-1", captures: { st1: $.data.status } }
            - { call: "POST /contingency-drawdowns/${dd}/release", payload: {}, as: OwnerRepPM, as_user_id: "pm-1", captures: { st2: $.data.status } }
            - { call: "GET /programs/${prog}", payload: {}, as: OwnerRepPM, as_user_id: "pm-1", captures: { tot: $.data.contingency_total_cents, res: $.data.contingency_reserved_cents, com: $.data.contingency_committed_cents, drn: $.data.contingency_drawn_cents, avail: $.data.contingency_available_cents } }
          assert:
            - "st1 == COMMITTED and st2 == RELEASED"
            - "tot == 1000000 and res == 0 and com == 0 and drn == 0 and avail == 1000000   # pool restored exactly"
            - "tot == res + com + drn + avail   # conserved quantity holds after the round trip"

      - name: contract_commitment_approve_void_conservation
        grounds:
          - calculations.contract_commitment_rollup
          - state_machines.ChangeOrder.RECOMMEND_APPROVAL_to_APPROVED
          - state_machines.ChangeOrder.APPROVED_to_VOID
        distinguishing_aspect: |
          Conserved quantity = contract commitment (different quantity from the
          contingency pool): approving a 200000 CO raises current_commitment_cents
          from 4500000 to 4700000 and voiding it returns the commitment to exactly
          4500000, with the linked drawdown ending RELEASED and the pool restored.
        test_recipe:
          setup:
            - "Program ACTIVE: budget 10000000, contingency 1000000; CT1 EXECUTED 4500000"
          setup_api_calls:
            - { call: "POST /programs", payload: { program_name: "P-COMMIT", owner_organization: "OwnerOrg" }, as: OwnerRepPM, as_user_id: "pm-1", captures: { prog: $.data.id } }
            - { call: "POST /charters", payload: { program_id: "${prog}", objectives: "obj", scope_statement: "scope" }, as: OwnerRepPM, as_user_id: "pm-1", captures: { ch: $.data.id } }
            - { call: "POST /charters/${ch}/submit", payload: {}, as: OwnerRepPM, as_user_id: "pm-1" }
            - { call: "GET /programs/${prog}", payload: {}, as: OwnerRepPM, as_user_id: "pm-1", captures: { pv: $.data.version } }
            - { call: "POST /charters/${ch}/decide", payload: { decision: "APPROVE", expected_program_version: "${pv}" }, as: Owner, as_user_id: "owner-1" }
            - { call: "POST /baselines", payload: { program_id: "${prog}", total_budget_cents: 10000000, contingency_total_cents: 1000000, target_finish_date: "2027-03-31", lines: [ { cost_code: "CC-100", amount_cents: 10000000 } ] }, as: OwnerRepPM, as_user_id: "pm-1", captures: { bl: $.data.id } }
            - { call: "POST /baselines/${bl}/submit", payload: {}, as: OwnerRepPM, as_user_id: "pm-1" }
            - { call: "GET /programs/${prog}", payload: {}, as: OwnerRepPM, as_user_id: "pm-1", captures: { pv2: $.data.version } }
            - { call: "POST /baselines/${bl}/decide", payload: { decision: "APPROVE", expected_program_version: "${pv2}" }, as: Owner, as_user_id: "owner-1" }
            - { call: "POST /programs/${prog}/activate", payload: {}, as: OwnerRepPM, as_user_id: "pm-1" }
            - { call: "POST /contracts", payload: { program_id: "${prog}", vendor_name: "V1", contract_type: "CONTRACTOR", solicitation_estimate_cents: 4500000 }, as: OwnerRepPM, as_user_id: "pm-1", captures: { ct1: $.data.id } }
            - { call: "POST /contracts/${ct1}/begin-negotiation", payload: {}, as: OwnerRepPM, as_user_id: "pm-1" }
            - { call: "POST /contracts/${ct1}/execute", payload: { awarded_amount_cents: 4500000 }, as: OwnerRepExecutive, as_user_id: "exec-1" }
            - { call: "POST /change-orders", payload: { contract_id: "${ct1}", title: "CO", reason: "round trip", amount_cents: 200000 }, as: OwnerRepPM, as_user_id: "pm-1", captures: { co: $.data.id } }
            - { call: "POST /change-orders/${co}/submit", payload: {}, as: OwnerRepPM, as_user_id: "pm-1" }
            - { call: "POST /change-orders/${co}/recommend", payload: { recommendation: "APPROVE", analysis_note: "ok" }, as: OwnerRepPM, as_user_id: "pm-1" }
          trigger:
            - { call: "POST /change-orders/${co}/decide", payload: { decision: "APPROVE" }, as: Owner, as_user_id: "owner-1", captures: { co_dd: $.data.linked_drawdown_id } }
            - { call: "GET /contracts/${ct1}", payload: {}, as: OwnerRepPM, as_user_id: "pm-1", captures: { comm1: $.data.current_commitment_cents } }
            - { call: "POST /change-orders/${co}/void", payload: { void_reason: "compensate" }, as: Owner, as_user_id: "owner-1", captures: { co_st: $.data.status } }
            - { call: "GET /contracts/${ct1}", payload: {}, as: OwnerRepPM, as_user_id: "pm-1", captures: { comm2: $.data.current_commitment_cents } }
            - { call: "GET /contingency-drawdowns/${co_dd}", payload: {}, as: OwnerRepPM, as_user_id: "pm-1", captures: { dd_st: $.data.status } }
            - { call: "GET /programs/${prog}", payload: {}, as: OwnerRepPM, as_user_id: "pm-1", captures: { avail: $.data.contingency_available_cents } }
          assert:
            - "comm1 == 4700000   # forward action: 4500000 + 200000"
            - "co_st == VOID and comm2 == 4500000   # compensating action restores commitment exactly"
            - "dd_st == RELEASED and avail == 1000000   # linked draw released; pool restored"


