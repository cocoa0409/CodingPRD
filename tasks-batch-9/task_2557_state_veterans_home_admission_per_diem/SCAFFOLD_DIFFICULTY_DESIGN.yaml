            - "One RECOGNIZED VeteransHome and one CERTIFIED NURSING CareUnit with licensed_bed_count 2."
            - "One Resident admitted 2026-08-01 and hospitalized 2026-08-02 with bed_hold_days_used 0 and bed_hold_started_on 2026-08-02."
