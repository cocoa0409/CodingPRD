            - call: "POST /integrity/reports"
              payload: { offering_id: "${offering_id}", student_id: "${other_student_id}", alleged_violation_type: "PLAGIARISM", narrative: "The office attempting to author a report." }
              as: IntegrityOfficer
              captures: { err_officer_cannot_report: $.data.error_id }
            - call: "GET /integrity/cases"
              as: Student
              as_user_id: "${student_id}"
              captures: { err_student_cannot_list_cases: $.data.error_id }
            - call: "POST /integrity/appeals"
              payload: { case_id: "${case_id}", grounds: "PROCEDURE", statement: "An unrelated student filing on someone else's case." }
              as: Student
              as_user_id: "${other_student_id}"
              captures: { err_wrong_student_owner: $.data.error_id }
            - call: "POST /integrity/notifications/${notice_id}/acknowledge"
              as: Student
              as_user_id: "${other_student_id}"
              captures: { err_wrong_student_acknowledge: $.data.error_id }
            - call: "POST /integrity/hearing-sessions/${session_id}/convene"
              as: PanelChair
              as_user_id: "${pan1_id}"
              captures: { err_wrong_chair_owner: $.data.error_id }
            - call: "POST /integrity/reports/${report_id}/submit"
              as: FacultyReporter
              as_user_id: "${chair_id}"
              captures: { err_wrong_reporter_owner: $.data.error_id }
            - call: "GET /integrity/cases/${case_id}"
              as: IntegrityOfficer
              captures: { case_v_final: $.data.version }
          assert:
            - "IntegrityOfficer on POST /integrity/appeals returns HTTP 403 with data.error_id == ERR_ROLE_NOT_PERMITTED"
            - "IntegrityOfficer on POST /integrity/panel-votes returns HTTP 403 with data.error_id == ERR_ROLE_NOT_PERMITTED - the office may schedule a hearing but never vote in one"
            - "IntegrityOfficer on POST /integrity/cases/${case_id}/notation/post returns HTTP 403 with data.error_id == ERR_ROLE_NOT_PERMITTED - the notation dimension belongs exclusively to the registrar"
            - "PanelChair on POST /integrity/sanctions returns HTTP 403 with data.error_id == ERR_ROLE_NOT_PERMITTED"
            - "AppealsDean on POST /integrity/sanctions returns HTTP 403 with data.error_id == ERR_ROLE_NOT_PERMITTED - the dean can only produce a reduced sanction as a side effect of SANCTION_REDUCED"
            - "AppealsDean on POST /integrity/hearing-sessions/${session_id}/decide returns HTTP 403 with data.error_id == ERR_ROLE_NOT_PERMITTED"
            - "RegistrarOfficer on POST /integrity/cases/${case_id}/dismiss returns HTTP 403 with data.error_id == ERR_ROLE_NOT_PERMITTED"
            - "IntegrityOfficer on POST /integrity/reports returns HTTP 403 with data.error_id == ERR_ROLE_NOT_PERMITTED, NOT 400 ERR_INVALID_REQUEST, even though the payload also omits the required incident_at and component_scores - priority 3 pre-empts priority 5"
            - "Student on GET /integrity/cases (the unscoped list) returns HTTP 403 with data.error_id == ERR_ROLE_NOT_PERMITTED"
            - "Student ${other_student_id} on POST /integrity/appeals for ${case_id} returns HTTP 403 with data.error_id == ERR_NOT_RESOURCE_OWNER, NOT ERR_ROLE_NOT_PERMITTED - the role is permitted on this endpoint, only the identity is wrong"
            - "Student ${other_student_id} on POST /integrity/notifications/${notice_id}/acknowledge returns HTTP 403 with data.error_id == ERR_NOT_RESOURCE_OWNER"
            - "PanelChair ${pan1_id} on POST /integrity/hearing-sessions/${session_id}/convene returns HTTP 403 with data.error_id == ERR_NOT_RESOURCE_OWNER - being a panelist is not being the chair, and the case is not yet acknowledged so this 403 also pre-empts the response-window precondition"
            - "FacultyReporter ${chair_id} on POST /integrity/reports/${report_id}/submit returns HTTP 403 with data.error_id == ERR_NOT_RESOURCE_OWNER - the report's reporter_id is ${reporter_id}"
            - "${case_v_final} == ${case_v_notified}: thirteen refused writes bumped Case.version zero times"
            - "GET /integrity/cases/${case_id}/appeals returns total_count == 0, GET /integrity/panel-votes?session_id=${session_id} returns total_count == 0, GET /integrity/sanctions?case_id=${case_id} returns total_count == 0, and Notification.${notice_id}.acknowledged_at == null"

  - section: cross_cutting_complexity_layers
    instances:
      - name: both_occ_rules_reject_a_stale_expected_case_version_with_412_and_write_nothing
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.formal-sanction-create-stale-case
          - concurrency_rules.informal-proposal-stale-case
          - validations[priority=23]
          - errors.ERR_STALE_CASE_VERSION
          - entities.Case.fields.version
        distinguishing_aspect: |
          Both §1.2.1 rules guard the SAME parent counter through different write endpoints, and both are
          exercised twice: once with a hand-decremented version that was never current, and once with a
          version that WAS current until an intervening accepted write bumped it. Every refusal is 412
