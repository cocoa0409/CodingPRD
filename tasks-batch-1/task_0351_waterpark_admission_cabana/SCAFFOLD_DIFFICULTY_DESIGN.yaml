scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: quote_order_group_vs_standard_variant_divergence
        grounds:
          - calculations.quote_order
          - entities.Order.fields.subtotal_cents
          - entities.PricingPolicy.fields.group_discount_pct
        distinguishing_aspect: |
          Same DAY_TICKET PricingPolicy (base 5000, group_pct 0.15, threshold 10),
          two Orders differing only in party_size produce different per-ticket
          prices: party_size 12 selects the group_party variant (per_ticket 4250)
          while party_size 4 selects standard_party (per_ticket 5000). This is the
          Order/pricing entity domain, distinct from the Admission freeze domain.
        test_recipe:
          setup:
            - "Park with no resident prefixes; active DAY_TICKET PricingPolicy base 5000, group_threshold 10, group_discount_pct 0.15, combo 800."
            - "Guest with zip not matching any prefix, wallet 0."
            - "Two orders: order_big party_size 12 (combo off), order_small party_size 4 (combo off)."
          setup_api_calls:
            - call: "POST /parks"
              payload: { name: "Wave Park", total_gate_capacity: 1000, resident_zip_prefixes: [], rain_check_value_cents: 4000 }
              as: ParkManager
              captures: { park_id: $.data.id }
            - call: "POST /pricing-policies"
              payload: { park_id: "${park_id}", product_type: "DAY_TICKET", base_price_cents: 5000, resident_discount_pct: 0.20, group_threshold: 10, group_discount_pct: 0.15, combo_price_cents: 800 }
              as: ParkManager
            - call: "POST /guests"
              payload: { full_name: "Pat Guest", email: "pat@x.com", zip_code: "99999", height_cm: 175 }
              as: Guest
              captures: { guest_id: $.data.id }
            - call: "POST /orders"
              payload: { park_id: "${park_id}", guest_id: "${guest_id}", product_type: "DAY_TICKET", party_size: 12, food_beverage_combo: false }
              as: Guest
              as_user_id: "${guest_id}"
              captures: { order_big_id: $.data.id }
            - call: "POST /orders"
              payload: { park_id: "${park_id}", guest_id: "${guest_id}", product_type: "DAY_TICKET", party_size: 4, food_beverage_combo: false }
              as: Guest
              as_user_id: "${guest_id}"
              captures: { order_small_id: $.data.id }
          trigger:
            - call: "POST /orders/${order_big_id}/pay"
              payload: {}
              as: Guest
              as_user_id: "${guest_id}"
              captures: { big_subtotal: $.data.subtotal_cents }
            - call: "POST /orders/${order_small_id}/pay"
              payload: {}
              as: Guest
              as_user_id: "${guest_id}"
              captures: { small_subtotal: $.data.subtotal_cents }
          assert:
            - "Order.${order_big_id}.group_rate_applied == true"
            - "Order.${order_big_id}.subtotal_cents == 51000"
            - "Order.${order_small_id}.group_rate_applied == false"
            - "Order.${order_small_id}.subtotal_cents == 20000"

      - name: freeze_days_first_vs_subsequent_episode_divergence
        grounds:
          - calculations.freeze_days_accounting
          - entities.Admission.fields.freeze_days_used
          - state_machines.Admission.FROZEN_to_CONFIRMED
        distinguishing_aspect: |
          The same unfreeze formula yields a different running total depending on
          prior episodes: first_episode sets freeze_days_used to the episode's
          ceil-days (3 for a 2.5-day episode), subsequent_episode accumulates onto
          the prior total (3 + 1 = 4). This operates on the Admission entity domain,
          structurally distinct from the Order pricing calculation above.
        test_recipe:
          setup:
            - "Active SEASON_PASS policy; a FULFILLED season-pass order; one admission CONFIRMED on an OPEN window with capacity headroom; clock at 2026-06-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /parks"
              payload: { name: "Pass Park", total_gate_capacity: 1000, resident_zip_prefixes: [] }
              as: ParkManager
              captures: { park_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ParkManager
            - call: "POST /pricing-policies"
              payload: { park_id: "${park_id}", product_type: "SEASON_PASS", base_price_cents: 30000 }
              as: ParkManager
            - call: "POST /parks/${park_id}/entry-windows"
              payload: { starts_at: "2026-06-01T09:00:00Z", ends_at: "2026-12-31T23:00:00Z", window_capacity: 50 }
              as: ParkManager
              captures: { window_id: $.data.id, window_v: $.data.version }
            - call: "POST /guests"
              payload: { full_name: "Sky Pass", email: "sky@x.com", zip_code: "12345", height_cm: 160 }
              as: Guest
              captures: { guest_id: $.data.id }
            - call: "POST /orders"
              payload: { park_id: "${park_id}", guest_id: "${guest_id}", product_type: "SEASON_PASS", party_size: 1 }
              as: Guest
              as_user_id: "${guest_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/pay"
              payload: {}
              as: Guest
              as_user_id: "${guest_id}"
            - call: "POST /orders/${order_id}/fulfill"
              payload: {}
              as: Guest
              as_user_id: "${guest_id}"
            - call: "GET /orders/${order_id}/admissions"
              payload: {}
              as: Guest
              as_user_id: "${guest_id}"
              captures: { adm_id: "$.data[0].id" }
            - call: "POST /admissions/${adm_id}/bind-guest"
              payload: { guest_id: "${guest_id}" }
              as: Guest
              as_user_id: "${guest_id}"
            - call: "POST /admissions/${adm_id}/assign-window"
              payload: { entry_window_id: "${window_id}", expected_entry_window_version: "${window_v}" }
              as: Guest
              as_user_id: "${guest_id}"
          trigger:
            - call: "POST /admissions/${adm_id}/freeze"
              payload: {}
              as: Guest
              as_user_id: "${guest_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-03T12:00:00Z" }
              as: ParkManager
            - call: "POST /admissions/${adm_id}/unfreeze"
              payload: {}
              as: Guest
              as_user_id: "${guest_id}"
              captures: { after_first: $.data.freeze_days_used }
            - call: "POST /admissions/${adm_id}/freeze"
              payload: {}
              as: Guest
              as_user_id: "${guest_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-04T01:00:00Z" }
              as: ParkManager
            - call: "POST /admissions/${adm_id}/unfreeze"
              payload: {}
              as: Guest
              as_user_id: "${guest_id}"
              captures: { after_second: $.data.freeze_days_used }
          assert:
            - "Admission.${adm_id}.freeze_days_used == 3 after first unfreeze"
            - "Admission.${adm_id}.freeze_days_used == 4 after second unfreeze"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: quote_order_max_discount_not_stacked_mode_a
        grounds:
          - calculations.quote_order
          - entities.PricingPolicy.fields.resident_discount_pct
          - entities.PricingPolicy.fields.group_discount_pct
        distinguishing_aspect: |
          Mode (a) non-linear interaction of >=3 inputs: resident eligibility,
          group eligibility, and combo opt-in combine via effective_pct =
          max(resident_pct, group_pct) — NOT a multiplicative stack. With base
          5000, resident 0.20, group 0.15, both eligible, per_ticket is 4000
          (max 0.20), never 3400 (stacked). Pins the max-selection branch.
        test_recipe:
          setup:
            - "Park with resident_zip_prefix '900'; active DAY_TICKET policy base 5000, resident_discount_pct 0.20, group_threshold 10, group_discount_pct 0.15, combo 800."
            - "Resident guest (zip 90011), order party_size 12, combo on."
          setup_api_calls:
            - call: "POST /parks"
              payload: { name: "Max Park", total_gate_capacity: 1000, resident_zip_prefixes: ["900"] }
              as: ParkManager
              captures: { park_id: $.data.id }
            - call: "POST /pricing-policies"
              payload: { park_id: "${park_id}", product_type: "DAY_TICKET", base_price_cents: 5000, resident_discount_pct: 0.20, group_threshold: 10, group_discount_pct: 0.15, combo_price_cents: 800 }
              as: ParkManager
            - call: "POST /guests"
              payload: { full_name: "Res Ident", email: "res@x.com", zip_code: "90011", height_cm: 180 }
              as: Guest
              captures: { guest_id: $.data.id }
            - call: "POST /orders"
              payload: { park_id: "${park_id}", guest_id: "${guest_id}", product_type: "DAY_TICKET", party_size: 12, food_beverage_combo: true }
              as: Guest
              as_user_id: "${guest_id}"
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /orders/${order_id}/pay"
              payload: {}
              as: Guest
              as_user_id: "${guest_id}"
              captures: { sub: $.data.subtotal_cents }
          assert:
            - "Order.${order_id}.resident_rate_applied == true"
            - "Order.${order_id}.group_rate_applied == true"
            - "Order.${order_id}.subtotal_cents == 57600"

      - name: quote_order_round_then_multiply_mode_b
        grounds:
          - calculations.quote_order
          - entities.Order.fields.subtotal_cents
          - entities.PricingPolicy.fields.base_price_cents
        distinguishing_aspect: |
          Mode (b) nested rounding where order matters: the scaffold pins
          "round the discounted per-ticket price to whole cents FIRST, then
          multiply by party_size". With base 3333, resident 0.15, party 12:
          round(3333*0.85)=2833 per ticket, *12 = 33996. The alternative
          "multiply then round" yields round(3333*0.85*12)=33997 — a 1-cent
          divergence — so the pinned per-line-item rounding order is observable.
        test_recipe:
          setup:
            - "Park no prefixes; active DAY_TICKET policy base 3333, resident_discount_pct 0.15, group_threshold 99, combo 0."
            - "Guest non-resident; order party_size 12, combo off."
          setup_api_calls:
            - call: "POST /parks"
              payload: { name: "Round Park", total_gate_capacity: 1000, resident_zip_prefixes: [] }
              as: ParkManager
              captures: { park_id: $.data.id }
            - call: "POST /pricing-policies"
              payload: { park_id: "${park_id}", product_type: "DAY_TICKET", base_price_cents: 3333, resident_discount_pct: 0.15, group_threshold: 99, group_discount_pct: 0.10, combo_price_cents: 0 }
              as: ParkManager
            - call: "POST /guests"
              payload: { full_name: "Round Guest", email: "rg@x.com", zip_code: "55555", height_cm: 170 }
              as: Guest
              captures: { guest_id: $.data.id }
            - call: "POST /orders"
              payload: { park_id: "${park_id}", guest_id: "${guest_id}", product_type: "DAY_TICKET", party_size: 12, food_beverage_combo: false }
              as: Guest
              as_user_id: "${guest_id}"
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /orders/${order_id}/pay"
              payload: {}
              as: Guest
              as_user_id: "${guest_id}"
          assert:
            - "per-ticket rounds to 2833 (round_half_up(3333*0.85)=2833)"
            - "Order.${order_id}.subtotal_cents == 33996 (round-then-multiply; multiply-then-round would give 33997)"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: admission_freeze_unfreeze_cycle
        grounds:
          - state_machines.Admission.CONFIRMED_to_FROZEN
          - state_machines.Admission.FROZEN_to_CONFIRMED
          - entities.Admission.fields.status
        distinguishing_aspect: |
          Admission exhibits a true cycle CONFIRMED -> FROZEN -> CONFIRMED:
          status returns to CONFIRMED after unfreeze, distinguishing it from a
          linear pipeline. The same admission can re-enter FROZEN repeatedly,
          accumulating freeze_days_used each loop.
        test_recipe:
          setup:
            - "A FULFILLED season-pass order with one admission CONFIRMED on an OPEN window; clock at 2026-06-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /parks"
              payload: { name: "Cycle Park", total_gate_capacity: 1000, resident_zip_prefixes: [] }
              as: ParkManager
              captures: { park_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ParkManager
            - call: "POST /pricing-policies"
              payload: { park_id: "${park_id}", product_type: "SEASON_PASS", base_price_cents: 30000 }
              as: ParkManager
            - call: "POST /parks/${park_id}/entry-windows"
              payload: { starts_at: "2026-06-01T09:00:00Z", ends_at: "2026-12-31T23:00:00Z", window_capacity: 50 }
              as: ParkManager
              captures: { window_id: $.data.id, window_v: $.data.version }
            - call: "POST /guests"
              payload: { full_name: "Loop Guest", email: "loop@x.com", zip_code: "12345", height_cm: 160 }
              as: Guest
              captures: { guest_id: $.data.id }
            - call: "POST /orders"
              payload: { park_id: "${park_id}", guest_id: "${guest_id}", product_type: "SEASON_PASS", party_size: 1 }
              as: Guest
              as_user_id: "${guest_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/pay"
              payload: {}
              as: Guest
              as_user_id: "${guest_id}"
            - call: "POST /orders/${order_id}/fulfill"
              payload: {}
              as: Guest
              as_user_id: "${guest_id}"
            - call: "GET /orders/${order_id}/admissions"
              payload: {}
              as: Guest
              as_user_id: "${guest_id}"
              captures: { adm_id: "$.data[0].id" }
            - call: "POST /admissions/${adm_id}/bind-guest"
              payload: { guest_id: "${guest_id}" }
              as: Guest
              as_user_id: "${guest_id}"
            - call: "POST /admissions/${adm_id}/assign-window"
              payload: { entry_window_id: "${window_id}", expected_entry_window_version: "${window_v}" }
              as: Guest
              as_user_id: "${guest_id}"
          trigger:
            - call: "POST /admissions/${adm_id}/freeze"
              payload: {}
              as: Guest
              as_user_id: "${guest_id}"
              captures: { frozen_status: $.data.status }
            - call: "POST /admissions/${adm_id}/unfreeze"
              payload: {}
              as: Guest
              as_user_id: "${guest_id}"
              captures: { back_status: $.data.status }
          assert:
            - "Admission.${adm_id}.status == FROZEN after freeze"
            - "Admission.${adm_id}.status == CONFIRMED after unfreeze (cycle closed)"

      - name: order_parallel_payment_fulfillment_dimensions
        grounds:
          - state_machines.Order.payment_status=PENDING_to_payment_status=PAID
          - state_machines.Order.payment_status=PAID_to_fulfillment_status=FULFILLED
          - entities.Order.fields.payment_status
          - entities.Order.fields.fulfillment_status
        distinguishing_aspect: |
          Order carries two independent state axes: payment_status advances
          PENDING->PAID while fulfillment_status stays UNFULFILLED, then
          fulfillment_status advances to FULFILLED independently. Two dimensions
          on one row — a different entity from the Admission cycle above.
        test_recipe:
          setup:
            - "Active DAY_TICKET policy; a PENDING/UNFULFILLED order party_size 2."
          setup_api_calls:
            - call: "POST /parks"
              payload: { name: "Par Park", total_gate_capacity: 1000, resident_zip_prefixes: [] }
              as: ParkManager
              captures: { park_id: $.data.id }
            - call: "POST /pricing-policies"
              payload: { park_id: "${park_id}", product_type: "DAY_TICKET", base_price_cents: 4000 }
              as: ParkManager
            - call: "POST /guests"
              payload: { full_name: "Dim Guest", email: "dim@x.com", zip_code: "33333", height_cm: 150 }
              as: Guest
              captures: { guest_id: $.data.id }
            - call: "POST /orders"
              payload: { park_id: "${park_id}", guest_id: "${guest_id}", product_type: "DAY_TICKET", party_size: 2 }
              as: Guest
              as_user_id: "${guest_id}"
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /orders/${order_id}/pay"
              payload: {}
              as: Guest
              as_user_id: "${guest_id}"
              captures: { pay_state: $.data.payment_status, fulfill_state: $.data.fulfillment_status }
            - call: "POST /orders/${order_id}/fulfill"
              payload: {}
              as: Guest
              as_user_id: "${guest_id}"
              captures: { fulfill_state2: $.data.fulfillment_status }
          assert:
            - "After pay: Order.${order_id}.payment_status == PAID and fulfillment_status == UNFULFILLED"
            - "After fulfill: Order.${order_id}.fulfillment_status == FULFILLED and payment_status == PAID"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: rainout_cascade_window_admission_raincheck_depth3
        grounds:
          - state_machines.EntryWindow.OPEN_to_RAINED_OUT
          - state_machines.Admission.CONFIRMED_to_RAINED_OUT
          - entities.RainCheck.fields.status
        distinguishing_aspect: |
          Depth-3 cascade originating from rain-out: POST /entry-windows/{id}/rain-out
          mutates the window to RAINED_OUT (link 1) which itself flips each CONFIRMED
          admission to RAINED_OUT (link 2) which itself issues a RainCheck (link 3).
          Each link is caused by the prior link, not directly by the operator action.
        test_recipe:
          setup:
            - "Park weather RAINED_OUT; an OPEN window with one CONFIRMED admission bound to a guest; rain_check_value_cents 4000."
          setup_api_calls:
            - call: "POST /parks"
              payload: { name: "Rain Park", total_gate_capacity: 1000, resident_zip_prefixes: [], rain_check_value_cents: 4000 }
              as: ParkManager
              captures: { park_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T08:00:00Z" }
              as: ParkManager
            - call: "POST /pricing-policies"
              payload: { park_id: "${park_id}", product_type: "DAY_TICKET", base_price_cents: 5000 }
              as: ParkManager
            - call: "POST /parks/${park_id}/entry-windows"
              payload: { starts_at: "2026-07-01T09:00:00Z", ends_at: "2026-07-01T17:00:00Z", window_capacity: 50 }
              as: ParkManager
              captures: { window_id: $.data.id, window_v: $.data.version }
            - call: "POST /guests"
              payload: { full_name: "Wet Guest", email: "wet@x.com", zip_code: "11111", height_cm: 165 }
              as: Guest
              captures: { guest_id: $.data.id }
            - call: "POST /orders"
              payload: { park_id: "${park_id}", guest_id: "${guest_id}", product_type: "DAY_TICKET", party_size: 1 }
              as: Guest
              as_user_id: "${guest_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/pay"
              payload: {}
              as: Guest
              as_user_id: "${guest_id}"
            - call: "POST /orders/${order_id}/fulfill"
              payload: {}
              as: Guest
              as_user_id: "${guest_id}"
            - call: "GET /orders/${order_id}/admissions"
              payload: {}
              as: Guest
              as_user_id: "${guest_id}"
              captures: { adm_id: "$.data[0].id" }
            - call: "POST /admissions/${adm_id}/bind-guest"
              payload: { guest_id: "${guest_id}" }
              as: Guest
              as_user_id: "${guest_id}"
            - call: "POST /admissions/${adm_id}/assign-window"
              payload: { entry_window_id: "${window_id}", expected_entry_window_version: "${window_v}" }
              as: Guest
              as_user_id: "${guest_id}"
            - call: "POST /parks/${park_id}/weather"
              payload: { weather_status: "RAINED_OUT" }
              as: ParkManager
          trigger:
            - call: "POST /entry-windows/${window_id}/rain-out"
              payload: {}
              as: ParkManager
            - call: "GET /rain-checks"
              payload: {}
              as: ParkManager
              captures: { rc_id: "$.data[0].id", rc_status: "$.data[0].status" }
          assert:
            - "Admission.${adm_id}.status == RAINED_OUT (link 2)"
            - "exactly one RainCheck exists for guest ${guest_id} with status ISSUED and value_cents 4000 (link 3)"
            - "EntryWindow.${window_id}.reserved_count == 0"

      - name: refund_cascade_order_admission_window_depth3
        grounds:
          - state_machines.Order.payment_status=PAID_to_payment_status=REFUNDED_&_fulfillment_status=CANCELLED
          - state_machines.Admission.ISSUED_to_CANCELLED
          - entities.EntryWindow.fields.reserved_count
        distinguishing_aspect: |
          Distinct trigger (refund, not rain-out) drives a depth-3 cascade:
          POST /orders/{id}/refund flips the order to REFUNDED/CANCELLED (link 1)
          which itself cancels each non-terminal admission (link 2) which itself
          decrements the admission's EntryWindow.reserved_count (link 3). Different
          origin transition and different conserved field than the rain-out chain.
        test_recipe:
          setup:
            - "A FULFILLED day-ticket order, party_size 2, one admission CONFIRMED on a window (reserved_count 1), none checked in."
          setup_api_calls:
            - call: "POST /parks"
              payload: { name: "Ref Park", total_gate_capacity: 1000, resident_zip_prefixes: [] }
              as: ParkManager
              captures: { park_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T08:00:00Z" }
              as: ParkManager
            - call: "POST /pricing-policies"
              payload: { park_id: "${park_id}", product_type: "DAY_TICKET", base_price_cents: 5000 }
              as: ParkManager
            - call: "POST /parks/${park_id}/entry-windows"
              payload: { starts_at: "2026-07-01T09:00:00Z", ends_at: "2026-07-01T17:00:00Z", window_capacity: 50 }
              as: ParkManager
              captures: { window_id: $.data.id, window_v: $.data.version }
            - call: "POST /guests"
              payload: { full_name: "Ref Guest", email: "ref@x.com", zip_code: "22222", height_cm: 160 }
              as: Guest
              captures: { guest_id: $.data.id }
            - call: "POST /orders"
              payload: { park_id: "${park_id}", guest_id: "${guest_id}", product_type: "DAY_TICKET", party_size: 2 }
              as: Guest
              as_user_id: "${guest_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/pay"
              payload: {}
              as: Guest
              as_user_id: "${guest_id}"
            - call: "POST /orders/${order_id}/fulfill"
              payload: {}
              as: Guest
              as_user_id: "${guest_id}"
            - call: "GET /orders/${order_id}/admissions"
              payload: {}
              as: Guest
              as_user_id: "${guest_id}"
              captures: { adm_id: "$.data[0].id" }
            - call: "POST /admissions/${adm_id}/bind-guest"
              payload: { guest_id: "${guest_id}" }
              as: Guest
              as_user_id: "${guest_id}"
            - call: "POST /admissions/${adm_id}/assign-window"
              payload: { entry_window_id: "${window_id}", expected_entry_window_version: "${window_v}" }
              as: Guest
              as_user_id: "${guest_id}"
          trigger:
