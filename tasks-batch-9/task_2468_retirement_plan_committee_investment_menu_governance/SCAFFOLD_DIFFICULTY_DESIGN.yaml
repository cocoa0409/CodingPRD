      - name: levelization_per_capita_remainder_vs_pro_rata_waterfall
        grounds:
          - calculations.levelized_fee_allocation
          - entities.FeeLevelizationRun.fields.method
          - entities.FeeLevelizationRun.fields.per_account_cents
          - entities.FeeLevelizationRun.fields.allocated_total_cents
          - entities.FeeLevelizationRun.fields.remainder_cents
          - entities.FeeLevelizationRun.fields.allocation_lines
          - entities.Plan.fields.participant_account_count
          - entities.Plan.fields.total_plan_assets_cents
          - validations[priority=83]
          - validations[priority=90]
        distinguishing_aspect: |
          Two FeeLevelizationRun rows built over the identical single-fund pool and the identical
          credit_pool_cents 2400 diverge purely on FeeLevelizationRun.method: PER_CAPITA divides by
          participant_account_count 7 and parks the indivisible tail, giving per_account_cents 342,
          allocated_total_cents 2394 and remainder_cents 6, while PRO_RATA divides by
          Plan.total_plan_assets_cents 3000000, floors to 960 and then hands the whole 1440-cent
          leftover back through the largest-assets-first waterfall, giving allocated_total_cents 2400
          and remainder_cents 0 - so only PRO_RATA credits the fund 2400 cents it did not accrue past 960.
        test_recipe:
          setup:
            - "One Plan with charter_status ADOPTED, participant_account_count 7, menu_slot_capacity 6, fiscal_quarter_index 1."
            - "Two ACTIVE CommitteeMember rows on two FILLED voting seats, training CURRENT."
            - "One ADOPTED InvestmentPolicyStatement (expense_peer_multiple 1.25, min_track_record_quarters 12, style_drift_r2_floor 0.8000)."
            - "Two AssetClassSlot rows status ACTIVE: US_LARGE_CAP seating Fund ACMLX (plan_assets_cents 1200000, revenue_share_bps 20) and CORE_BOND seating Fund ACMBX (plan_assets_cents 1800000, revenue_share_bps 0)."
            - "Plan.total_plan_assets_cents == 3000000 and Plan.menu_posture == OPEN."
            - "Fund ACMLX PASS-1 accrual is floor(1200000 * 20 / 10000) == 2400 cents, so the eligible pool for credit_pool_cents 2400 is exactly 2400."
