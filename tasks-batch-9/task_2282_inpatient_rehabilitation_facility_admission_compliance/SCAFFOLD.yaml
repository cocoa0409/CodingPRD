    code: 200
    input: []
    output: Patient
    side_effects: []

  - method: GET
    path: "/patients"
    description: "List patients, filterable by facility and medical record number"
    roles: [ComplianceOfficer, RehabPhysician, NurseCaseManager, TherapyLead, HimCoder]
    code: 200
    input: ["facility_id?", "mrn?", "limit?", "offset?"]
    output: Patient[]
    side_effects: []

