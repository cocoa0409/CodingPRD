              as: SystemAdmin
              captures: { p_qc_id: $.data.id }
            - call: "POST /peer-reviewers"
              payload: { reviewer_firm_name: "Kestrel Peer Review PC", license_state: "CA", qualified_categories: [], max_concurrent_reviews: 2, experience_hours: 5000 }
              as: PeerReviewCommittee
              captures: { rv1_id: $.data.id }
            - call: "POST /firms/${firm_id}/peer-reviews"
              payload: { review_type: "SYSTEM_REVIEW", year_end: "2026-12-31", scheduled_window_start: "2026-09-01", scheduled_window_end: "2026-09-15" }
              as: PeerReviewCommittee
              captures: { pr_id: $.data.id }
            - call: "POST /peer-reviews/${pr_id}/reviewer-assignment"
              payload: { reviewer_id: "${rv1_id}" }
              as: PeerReviewCommittee
            - call: "POST /peer-reviews/${pr_id}/scope"
              payload: {}
              as: PeerReviewer
              as_user_id: "${rv1_id}"
            - call: "POST /firms/${firm_id}/internal-inspections"
              payload: { inspection_year: 2024, target_engagement_count: 2 }
              as: QualityControlDirector
              as_user_id: "${p_qc_id}"
              captures: { insp_id: $.data.id }
            - call: "POST /internal-inspections/${insp_id}/selections"
              payload: {}
              as: QualityControlDirector
              as_user_id: "${p_qc_id}"
          trigger:
            - call: "POST /peer-reviews/${pr_id}/transitions"
              payload: { to_state: "FIELDWORK" }
              as: PeerReviewer
              as_user_id: "${rv1_id}"
              captures: { gate_error: $.data.error_id }
            - call: "POST /internal-inspections/${insp_id}/transitions"
              payload: { to_state: "CONCLUDED" }
              as: QualityControlDirector
              as_user_id: "${p_qc_id}"
            - call: "POST /peer-reviews/${pr_id}/transitions"
              payload: { to_state: "FIELDWORK" }
              as: PeerReviewer
              as_user_id: "${rv1_id}"
          assert:
            - "the first trigger call returns HTTP 409 with error_id ERR_INSPECTION_NOT_CONCLUDED"
            - "PeerReview.${pr_id}.must_select_categories == []"
            - "PeerReview.${pr_id}.total_scope_hours == 16"
            - "PeerReview.${pr_id}.unallocated_hours == 16"
            - "InternalInspection.${insp_id}.state == CONCLUDED"
            - "InternalInspection.${insp_id}.must_select_coverage_pct == 100.00"
            - "the third trigger call returns HTTP 200"
            - "PeerReview.${pr_id}.state == FIELDWORK"

  # =====================================================================
  # Rule 8 - resource_temporal_overlap
  # Two different resources with deliberately different interval semantics:
  # Partner uses zero-buffer aggregate capacity over half-open intervals,
  # PeerReviewer uses pairwise rejection with a 5-day buffer on the EXISTING end.
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: partner_eqr_aggregate_capacity_counts_only_intervals_still_open
        grounds:
          - calculations.eqr_reviewer_concurrency_window
          - entities.Partner.fields.open_eqr_count
          - entities.EngagementQualityReview.fields.concluded_at
          - state_machines.EngagementQualityReview.IN_PROGRESS_to_CONCURRED
          - state_machines.EngagementQualityReview.ASSIGNED_to_WITHDRAWN
          - errors[ERR_EQR_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          One EQ reviewer accumulates four reviews before the trigger: one CONCURRED and one WITHDRAWN
          (both with a non-null concluded_at, so their half-open intervals are closed and no longer
          overlap the candidate interval) plus one ASSIGNED and one IN_PROGRESS (null concluded_at,
          treated as +infinity). The overlap count is therefore 2, not 4: the fifth assignment must
          SUCCEED, and only the sixth - which faces three genuinely open intervals - is refused with
          ERR_EQR_CAPACITY_EXCEEDED. An implementation that counts all of the reviewer's EQ review
          rows, or that counts rows by reviewer_partner_id without the state filter, refuses the fifth.
          MAX_CONCURRENT_EQR is compared with >=, so 2 open intervals pass and 3 fail.
        test_recipe:
          setup:
            - "Firm 'Barrowfield Kyle LLP' with engagement partner Ines Vale, QC director Quinn Cade and EQ reviewer Odile Frey (EQ_REVIEWER, cpe_hours_last_3y 240, no client history so cooling-off never applies)."
            - "Six engagements E1..E6, all non-public-interest, all driven to FIELDWORK so they sit inside the EQR window."
            - "Odile Frey holds four reviews: E1 CONCURRED (concluded 2026-08-10), E2 WITHDRAWN, E3 ASSIGNED, E4 IN_PROGRESS."
            - "The logical clock is advanced to 2026-08-10 before the closing transitions, so the two closed intervals end strictly before the candidate interval starts."
