            - "co_c_status == OUT"
            - "GearCheckout.${co_a}.status == OUT"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: seat_capacity_conserved_book_then_cancel
        grounds:
          - calculations.slot_remaining_capacity
          - state_machines.Booking.CONFIRMED_to_CANCELLED
          - entities.TimeSlot.fields.remaining_capacity
          - entities.TimeSlot.fields.capacity
        distinguishing_aspect: |
          Seat capacity is conserved: capacity(4) == remaining_capacity + active bookings throughout;
          booking drops remaining to 3, cancelling restores it to 4 (conserved quantity = slot seats).
        test_recipe:
          setup:
            - "Course, weekday slot capacity 4, guide assigned, participant p (weight 70)"
          setup_api_calls:
            - call: "POST /courses"
              payload: { name: "Zip A", difficulty_level: 2, min_weight_kg: 30, max_weight_kg: 120, min_age_years: 8, base_price_cents: 5000, duration_minutes: 90, default_capacity: 4, max_participants_per_guide: 4, weekend_surcharge_pct: 0.15 }
              as: Operator
              captures: { course_id: $.data.id }
            - call: "POST /time-slots"
              payload: { course_id: "${course_id}", start_at: "2026-06-03T10:00:00Z" }
              as: Operator
              captures: { ts_id: $.data.id }
            - call: "POST /guides"
              payload: { name: "G1", certification_level: 3 }
              as: Operator
              captures: { g1_id: $.data.id }
            - call: "POST /guide-assignments"
              payload: { guide_id: "${g1_id}", time_slot_id: "${ts_id}" }
              as: Operator
            - call: "POST /participants"
              payload: { full_name: "P A", weight_kg: 70, birthdate: "2000-01-01T00:00:00Z" }
              as: Operator
              captures: { p_a_id: $.data.id }
          trigger:
            - call: "POST /bookings"
              payload: { time_slot_id: "${ts_id}", participant_id: "${p_a_id}" }
              as: Operator
              captures: { b_a_id: $.data.id }
            - call: "GET /time-slots/${ts_id}"
              payload: {}
              as: Operator
              captures: { rem_after_book: $.data.remaining_capacity }
            - call: "POST /bookings/${b_a_id}/cancel"
              payload: {}
              as: Operator
            - call: "GET /time-slots/${ts_id}"
              payload: {}
              as: Operator
              captures: { rem_after_cancel: $.data.remaining_capacity }
          assert:
            - "rem_after_book == 3"
            - "rem_after_cancel == 4"
            - "TimeSlot.${ts_id}.remaining_capacity == 4"

      - name: pass_entitlement_conserved_use_then_cancel
        grounds:
          - calculations.season_pass_usage
          - state_machines.Booking.CONFIRMED_to_CANCELLED
          - entities.SeasonPass.fields.uses_remaining
          - entities.SeasonPass.fields.total_uses
        distinguishing_aspect: |
          Season-pass entitlement is conserved: total_uses(5) == uses_committed + uses_settled + uses_remaining;
          a pass booking drops uses_remaining to 4, cancelling restores it to 5 (conserved quantity = pass entitlements,
          distinct from slot seats).
        test_recipe:
          setup:
            - "Course, weekday slot, guide assigned, participant p with ACTIVE pass total_uses=5"
          setup_api_calls:
            - call: "POST /courses"
              payload: { name: "Zip A", difficulty_level: 2, min_weight_kg: 30, max_weight_kg: 120, min_age_years: 8, base_price_cents: 5000, duration_minutes: 90, default_capacity: 4, max_participants_per_guide: 4, weekend_surcharge_pct: 0.15 }
              as: Operator
              captures: { course_id: $.data.id }
            - call: "POST /time-slots"
              payload: { course_id: "${course_id}", start_at: "2026-06-03T10:00:00Z" }
              as: Operator
              captures: { ts_id: $.data.id }
            - call: "POST /guides"
              payload: { name: "G1", certification_level: 3 }
              as: Operator
              captures: { g1_id: $.data.id }
            - call: "POST /guide-assignments"
              payload: { guide_id: "${g1_id}", time_slot_id: "${ts_id}" }
              as: Operator
            - call: "POST /participants"
              payload: { full_name: "P A", weight_kg: 70, birthdate: "2000-01-01T00:00:00Z" }
              as: Operator
              captures: { p_a_id: $.data.id, p_v: $.data.version }
            - call: "POST /participants/${p_a_id}/season-passes"
              payload: { tier: "STANDARD", valid_from: "2026-05-01T00:00:00Z", valid_until: "2026-12-31T23:59:59Z", total_uses: 5, expected_participant_version: "${p_v}" }
              as: Operator
              captures: { sp_id: $.data.id }
          trigger:
            - call: "POST /bookings"
              payload: { time_slot_id: "${ts_id}", participant_id: "${p_a_id}", use_season_pass: true }
              as: Operator
              captures: { b_a_id: $.data.id }
            - call: "GET /participants/${p_a_id}/season-passes"
              payload: {}
              as: Operator
              captures: { rem_after_book: "$.data[0].uses_remaining" }
            - call: "POST /bookings/${b_a_id}/cancel"
              payload: {}
              as: Operator
            - call: "GET /participants/${p_a_id}/season-passes"
              payload: {}
              as: Operator
              captures: { rem_after_cancel: "$.data[0].uses_remaining" }
          assert:
            - "rem_after_book == 4"
            - "rem_after_cancel == 5"
            - "SeasonPass.${sp_id}.uses_committed == 0"
