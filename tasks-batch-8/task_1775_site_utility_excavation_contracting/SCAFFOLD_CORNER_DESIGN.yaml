  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: unauthenticated_unknown_role
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
        distinguishing_aspect: "An undeclared role header (Anonymous) is rejected 401 ERR_UNAUTHENTICATED at priority 1 before any other check."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /site-utility/projects"
              payload: { name: "P-NOAUTH", contract_ref: "C-400", soil_class_default: SOIL_B, contingency_cents: 100000000, single_co_cap_cents: 5000000 }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_UNAUTHENTICATED and http status == 401"

      - name: slope_below_soil_c_minimum_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=7]
          - calculations.trench_slope_requirement
        distinguishing_aspect: "SOIL_C SLOPING plan with slope_ratio 1.4 (< required 1.5) fails submit with ERR_SLOPE_NONCOMPLIANT; exactly 1.5 passes (inclusive)."
        test_recipe:
          setup: ["Project P; owner O; segment S PLANNED; two DRAFT plans SP_BAD (ratio 1.4) and SP_OK (ratio 1.5), both SOIL_C SLOPING"]
          setup_api_calls:
            - call: "POST /site-utility/projects"
              payload: { name: "P-SC", contract_ref: "C-401", soil_class_default: SOIL_C, contingency_cents: 100000000, single_co_cap_cents: 5000000 }
              as: ProjectManager
              captures: { p_id: $.data.id }
            - call: "POST /site-utility/utility-owners"
              payload: { name: "City Water", owner_type: WATER, min_notice_hours: 48, max_shutdown_hours: 8 }
              as: OpsAdmin
              captures: { o_id: $.data.id }
            - call: "POST /site-utility/pipe-segments"
              payload: { project_id: "${p_id}", utility_owner_id: "${o_id}", segment_label: "WL-V-01", pipe_material: PVC_C900, diameter_in: 12, length_ft: 200.0, bedding_class: CLASS_B, design_invert_depth_ft: 8.0, design_slope_pct: 1.0, requires_dewatering: false }
              as: Foreman
              captures: { s_id: $.data.id }
            - call: "POST /site-utility/trench-safety-plans"
              payload: { project_id: "${p_id}", pipe_segment_id: "${s_id}", max_depth_ft: 9.5, soil_class: SOIL_C, protective_system: SLOPING, slope_ratio: 1.4 }
              as: Foreman
              captures: { sp_bad: $.data.id }
            - call: "POST /site-utility/trench-safety-plans"
              payload: { project_id: "${p_id}", pipe_segment_id: "${s_id}", max_depth_ft: 9.5, soil_class: SOIL_C, protective_system: SLOPING, slope_ratio: 1.5 }
              as: Foreman
              captures: { sp_ok: $.data.id }
          trigger:
            - call: "POST /site-utility/trench-safety-plans/${sp_bad}/submit"
              payload: {}
              as: Foreman
              captures: { err: $.data.error_id }
            - call: "POST /site-utility/trench-safety-plans/${sp_ok}/submit"
              payload: {}
              as: Foreman
          assert:
            - "err == ERR_SLOPE_NONCOMPLIANT (http 422); TrenchSafetyPlan.${sp_bad}.status stays DRAFT"
            - "TrenchSafetyPlan.${sp_ok}.status == SUBMITTED (1.5 >= 1.5 passes)"

      - name: deep_trench_requires_engineered_system
        claim_type: violation_to_error
        grounds:
          - validations[priority=7]
          - calculations.trench_slope_requirement
        distinguishing_aspect: "max_depth_ft >= 20 forbids SLOPING outright and requires engineered_certification for TRENCH_BOX: three branches of the depth rule exercised."
        test_recipe:
          setup: ["Project P; owner O; segment S PLANNED; three DRAFT plans at max_depth_ft 25.0: SP1 SLOPING, SP2 TRENCH_BOX without certification, SP3 TRENCH_BOX with certification"]
          setup_api_calls:
            - call: "POST /site-utility/projects"
              payload: { name: "P-DP", contract_ref: "C-402", soil_class_default: SOIL_B, contingency_cents: 100000000, single_co_cap_cents: 5000000 }
              as: ProjectManager
              captures: { p_id: $.data.id }
            - call: "POST /site-utility/utility-owners"
              payload: { name: "City Water", owner_type: WATER, min_notice_hours: 48, max_shutdown_hours: 8 }
