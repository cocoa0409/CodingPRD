          assert:
            - "Sale.${sale_a_id}.sale_type == GALLERY_SALE"
            - "Sale.${sale_a_id}.taxable_base_cents == 229885"
            - "Sale.${sale_a_id}.sales_tax_cents == 20115"
            - "Sale.${sale_a_id}.commission_cents == 80460"
            - "Sale.${sale_a_id}.artist_payable_cents == 149425"
            - "Sale.${sale_a_id}.buyer_total_cents == 250000"
            - "Sale.${sale_b_id}.sale_type == PURCHASE_AWARD"
