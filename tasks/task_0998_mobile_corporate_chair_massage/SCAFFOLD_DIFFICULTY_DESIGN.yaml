          trigger:
            - { call: "POST /chair-massage/bookings/${bk_id}/cancel", payload: {}, as: Organizer, as_user_id: "${acct_id}", captures: { fee: "$.data.cancellation_fee_cents" } }
          assert:
            - "Booking.${bk_id}.cancellation_fee_cents == 6000"
            - "fee == floor(24000 * 0.25) because H == 24 (H < 24 false) -> second tier"

      - name: signup_sheet_capacity_exact_fit
        grounds:
          - validations[priority=9]
          - endpoints."POST /chair-massage/chair-slots/{id}/claims"
        distinguishing_aspect: |
          Metric = chair capacity (count of slot_minutes units that exactly
          fill window_duration_minutes). A chair with window 60 / slot 15 has
          capacity 4. The 4th claim (slot_ordinal=3) satisfies
          (3+1)*15 <= 60 — succeeds. The 5th claim violates (4+1)*15 <= 60
          — fails ERR_SIGNUP_SHEET_FULL. Boundary is `<=` (inclusive) vs `>`.
          Endpoint = claims. Distinct metric (capacity vs hours) and
          endpoint from the cancellation-fee boundary.
        test_recipe:
          setup:
            - "Region R0; ACME; T1 licensed"
            - "Booking EVENT 2026-06-10 window_duration=60, slot_minutes=15, chair_count=1 -> capacity 4"
            - "Booking in SCHEDULING, chair cs0 ASSIGNED to T1"
