  # ===========================================================================
  # SECTION 2 — State Machines (claim-extraction-guide Table 2)
  # ===========================================================================
  - section: state_machines
    instances:

      - name: district_moves_formed_to_active_without_restamping_its_term_dates
        claim_type: valid_transition
        grounds:
          - state_machines.District.FORMED_to_ACTIVE
          - endpoints.POST_/districts/{id}/lifecycle-advances
          - entities.District.fields.formed_on
          - entities.District.fields.expiration_date
        distinguishing_aspect: |
          formed_on 2026-08-01T00:00:00Z and expiration_date 2027-08-01T00:00:00Z are stamped by the
          FORMATION certification, so the FORMED -> ACTIVE advance moves status only: both dates come
          back byte-identical to their pre-advance values even though effective_on is supplied.
        test_recipe:
          setup:
            - "canonical district with the four-property roll"
            - "FORMATION drive CERTIFIED, so the district stands FORMED with its term dates stamped"
            - "logical clock 2026-08-01T00:00:00Z"
          setup_api_calls:
            - *c_clock_form
            - *c_district
            - *c_b1
            - *c_b2
            - *c_b3
            - *c_b4
            - *c_drive
            - *c_sign_b1
            - *c_tally
            - *c_certify
            - call: "GET /districts/${d_id}"
              payload: {}
              as: DistrictAdministrator
              as_user_id: "admin-01"
              captures: { d_v_formed: "$.data.version" }
          trigger:
            - call: "POST /districts/${d_id}/lifecycle-advances"
              payload: { to_status: "ACTIVE", effective_on: "2026-08-01T00:00:00Z", reason: "board resolution 2026-14" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
          assert:
            - "the response status is 200"
            - "District.${d_id}.status == ACTIVE"
            - "District.${d_id}.formed_on == 2026-08-01T00:00:00Z"
            - "District.${d_id}.expiration_date == 2027-08-01T00:00:00Z"
            - "District.${d_id}.version == ${d_v_formed} + 1"
            - "PetitionDrive.${pd_id}.status is still CERTIFIED"
            - "District.${d_id}.assessable_business_count == 4"

      - name: activation_is_refused_once_the_assessable_roll_falls_below_the_petition_pool
        claim_type: precondition_enforcement
        grounds:
          - state_machines.District.FORMED_to_ACTIVE
          - state_machines.LodgingBusiness.ASSESSABLE_to_CLOSED_OUT
          - calculations.petition_support.constants.MIN_PETITION_POOL
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: |
          The FORMATION drive is still CERTIFIED and nothing about the district changed, but two
          close-outs drop assessable_business_count from 4 to 2, below MIN_PETITION_POOL 3, so the
          activation is refused with ERR_INVALID_STATE_TRANSITION and the district stays FORMED.
        test_recipe:
          setup:
            - "canonical district FORMED with its FORMATION drive CERTIFIED"
            - "b2 and b3 closed out after certification, leaving 2 assessable properties"
          setup_api_calls:
            - *c_clock_form
            - *c_district
            - *c_b1
            - *c_b2
            - *c_b3
            - *c_b4
            - *c_drive
            - *c_sign_b1
            - *c_tally
            - *c_certify
            - call: "POST /lodging-businesses/${b2_id}/revisions"
              payload: { close_out: true }
              as: DistrictAdministrator
              as_user_id: "admin-01"
            - call: "POST /lodging-businesses/${b3_id}/revisions"
              payload: { close_out: true }
              as: DistrictAdministrator
              as_user_id: "admin-01"
          trigger:
            - call: "POST /districts/${d_id}/lifecycle-advances"
              payload: { to_status: "ACTIVE", effective_on: "2026-08-01T00:00:00Z" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
          assert:
            - "the response status is 409"
            - "data.error_id == ERR_INVALID_STATE_TRANSITION"
            - "District.${d_id}.status is still FORMED"
            - "District.${d_id}.assessable_business_count == 2"
            - "District.${d_id}.assessable_basis_cents == 65000000"
            - "LodgingBusiness.${b2_id}.status == CLOSED_OUT and LodgingBusiness.${b3_id}.status == CLOSED_OUT"
            - "PetitionDrive.${pd_id}.status is still CERTIFIED"

      - name: boundary_revision_executes_every_declared_side_effect_in_one_call
        claim_type: side_effect_execution
        grounds:
          - endpoints.POST_/districts/{id}/boundary-revisions
          - state_machines.LodgingBusiness.ASSESSABLE_to_OUTSIDE_BOUNDARY
          - state_machines.PetitionSignature.VALID_to_DISQUALIFIED
          - calculations.petition_support
          - entities.PetitionSignature.fields.disqualification_reason
        distinguishing_aspect: |
          One boundary revision to [ZONE_CORE] fires all five declared side effects at once: b3 and b4
          move to OUTSIDE_BOUNDARY, b3's VALID signature becomes DISQUALIFIED with reason
          OUTSIDE_BOUNDARY, the OPEN drive recomputes to signed_basis_cents 60000000 over
          assessable_basis_snapshot_cents 80000000 = weighted_support_pct 0.7500, the district roll
          falls to 2 / 80000000, and District.version increments exactly once.
        test_recipe:
          setup:
            - "canonical district with the four-property roll and an OPEN FORMATION drive"
            - "b1 (ZONE_CORE) and b3 (ZONE_PERIMETER) have both signed"
            - "logical clock 2026-08-01T00:00:00Z, inside the drive window"
          setup_api_calls:
            - *c_clock_form
            - *c_district
            - *c_b1
            - *c_b2
            - *c_b3
            - *c_b4
            - *c_drive
            - *c_sign_b1
            - call: "POST /petition-drives/${pd_id}/signatures"
              payload: { lodging_business_id: "${b3_id}" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
              captures: { sig_b3_rev_id: "$.data.id" }
            - call: "GET /districts/${d_id}"
              payload: {}
              as: DistrictAdministrator
              as_user_id: "admin-01"
              captures: { d_v_pre_revision: "$.data.version" }
          trigger:
            - call: "POST /districts/${d_id}/boundary-revisions"
              payload: { included_zones: ["ZONE_CORE"], effective_on: "2026-08-05T00:00:00Z" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
          assert:
            - "the response status is 200"
            - "District.${d_id}.included_zones == [ZONE_CORE]"
            - "LodgingBusiness.${b3_id}.status == OUTSIDE_BOUNDARY and LodgingBusiness.${b4_id}.status == OUTSIDE_BOUNDARY"
            - "LodgingBusiness.${b1_id}.status is still ASSESSABLE and LodgingBusiness.${b2_id}.status is still ASSESSABLE"
            - "PetitionSignature.${sig_b3_rev_id}.status == DISQUALIFIED"
            - "PetitionSignature.${sig_b3_rev_id}.disqualification_reason == OUTSIDE_BOUNDARY"
            - "PetitionSignature.${sig_b1_id}.status is still VALID"
            - "PetitionDrive.${pd_id}.signed_basis_cents == 60000000"
            - "PetitionDrive.${pd_id}.valid_signature_count == 1"
            - "PetitionDrive.${pd_id}.assessable_basis_snapshot_cents == 80000000"
            - "PetitionDrive.${pd_id}.assessable_count_snapshot == 2"
            - "PetitionDrive.${pd_id}.weighted_support_pct == 0.7500"
            - "District.${d_id}.assessable_basis_cents == 80000000 and assessable_business_count == 2"
            - "District.${d_id}.version == ${d_v_pre_revision} + 1"

      - name: withdrawing_a_dispute_already_under_review_is_an_undeclared_transition
        claim_type: invalid_transitions
        grounds:
          - state_machines.AssessmentDispute.SUBMITTED_to_WITHDRAWN
          - state_machines.AssessmentDispute.SUBMITTED_to_UNDER_REVIEW
          - errors[ERR_INVALID_STATE_TRANSITION]
          - endpoints.POST_/assessment-disputes/{id}/proceedings
        distinguishing_aspect: |
          WITHDRAW is declared only from SUBMITTED, so once the hearing officer has opened review the
          operator's withdrawal returns ERR_INVALID_STATE_TRANSITION with HTTP 409 and the dispute
          stays UNDER_REVIEW with appeal_count 0 — the operator cannot pull a docketed dispute.
        test_recipe:
          setup:
            - "district ACTIVE, st1 filed 824,500"
            - "a CALCULATION_ERROR dispute on st1 moved SUBMITTED -> UNDER_REVIEW by the hearing officer"
          setup_api_calls:
            - *c_clock_form
            - *c_district
            - *c_b1
            - *c_b2
            - *c_b3
            - *c_b4
            - *c_drive
            - *c_sign_b1
            - *c_tally
            - *c_certify
            - *c_activate
            - *c_period_q1
            - *c_generate_q1
            - *c_find_st1
            - *c_file_st1
            - &c_dispute_st1
              call: "POST /assessment-disputes"
              payload: { assessment_statement_id: "${st1_id}", dispute_type: "CALCULATION_ERROR", claimed_adjustment_cents: 82450, dispute_note: "resort fee should not sit in the revenue basis" }
              as: LodgingOperator
              as_user_id: "${b1_id}"
              captures: { dsp1_id: "$.data.id" }
            - &c_open_review_st1
              call: "POST /assessment-disputes/${dsp1_id}/proceedings"
              payload: { action: "OPEN_REVIEW", note: "docketed for hearing" }
              as: HearingOfficer
              as_user_id: "hearing-01"
              captures: { dsp1_v_under_review: "$.data.version" }
          trigger:
            - call: "POST /assessment-disputes/${dsp1_id}/proceedings"
              payload: { action: "WITHDRAW", note: "operator wants to settle privately" }
              as: LodgingOperator
              as_user_id: "${b1_id}"
          assert:
            - "the response status is 409"
            - "data.error_id == ERR_INVALID_STATE_TRANSITION"
            - "AssessmentDispute.${dsp1_id}.status is still UNDER_REVIEW"
            - "AssessmentDispute.${dsp1_id}.appeal_count == 0"
            - "AssessmentDispute.${dsp1_id}.version == ${dsp1_v_under_review}"
            - "AssessmentStatement.${st1_id}.effective_assessment_cents is still 824500"

      - name: marketing_program_starts_planned_with_no_performance_figures_yet
        claim_type: initial_state
        grounds:
          - state_machines.MarketingProgram.initial_state
          - entities.MarketingProgram.fields.status
          - entities.MarketingProgram.fields.spend_frozen
          - entities.MarketingProgram.fields.efficiency_tier
          - entities.MarketingProgram.fields.performance_flag
          - entities.AnnualWorkPlan.fields.committed_program_cents
        distinguishing_aspect: |
          A newly created program is PLANNED with spend_frozen false, verified_room_nights 0, both
          cost-per-room-night figures null, efficiency_tier null and performance_flag NOT_MEASURED —
          program_performance has not run — while the funding plan's committed_program_cents already
          reflects the 62000 commitment.
        test_recipe:
          setup:
            - "district ACTIVE, st1 and st2 filed so the FY2027 forecast is 1,164,500"
