  - section: errors
    instances:

      - name: missing_auth_headers_unknown_role_and_unknown_identity_are_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority 1]", "validations[priority 2]", "validations[priority 5]", "errors[ERR_MISSING_AUTH_HEADERS]", "errors[ERR_UNKNOWN_ROLE]", "errors[ERR_ACTING_IDENTITY_NOT_FOUND]"]
        distinguishing_aspect: >-
          The first three rules in the global order separate three failures that a naive implementation
          collapses into one 401: no headers at all, a syntactically fine but unrecognised role, and a
          recognised role whose X-User-Id does not resolve to the row that role is bound to. The third
          is a 404, not a 401 or 403, and it must fire on a request whose body is otherwise perfectly
          valid — which is only visible because Member binds to Member rows and ResortManager binds to
          Resort rows.
        test_recipe:
          setup: >-
            Tier PLUS and one member M1 on PLUS, plus Resort A affiliated with a GOLD band, so that
            valid rows exist for the control comparisons. No further state is needed.
          setup_api_calls:
            - call: "POST /exchange-network/membership-tiers"
              as: NetworkOperator
              payload: { tier_code: "PLUS", annual_dues_cents: 19900, base_exchange_fee_cents: 20900, priority_surcharge_cents: 2500, priority_window_days: 365, deposit_first_bonus_pct: 10, max_active_requests: 3, cancellation_fee_cents: 8900, reinstatement_fee_cents: 10900, extension_fee_cents_per_month: 3400 }
              captures: { plus_tier: "$.data.id" }
            - call: "POST /exchange-network/resorts"
              as: NetworkOperator
              payload: { name: "Aspen Ridge Club", region_code: "US-CO", required_annual_deposit_units: 2, initial_quality_rating: "GOLD_CROWN", units_per_size: 2, demand_index: 4 }
              captures: { resort_a: "$.data.id" }
            - call: "POST /exchange-network/season-bands"
              as: NetworkOperator
              payload: { resort_id: "${resort_a}", band_code: "GOLD", start_month_day: "04-01", end_month_day: "06-30" }
            - call: "POST /exchange-network/resorts/${resort_a}/affiliation"
              as: NetworkOperator
              payload: {}
            - call: "POST /exchange-network/members"
              as: NetworkOperator
              payload: { email: "m1@example.com", full_name: "Dana Oyelaran", tier_id: "${plus_tier}" }
              captures: { m1: "$.data.id" }
          trigger:
            - call: "GET /exchange-network/membership-tiers"
              as: __NO_AUTH_HEADERS__
              payload: {}
              captures: { err_none: "$.data.error_id" }
            - call: "GET /exchange-network/membership-tiers"
              as: TravelAgent
              payload: {}
              captures: { err_role: "$.data.error_id" }
            - call: "GET /exchange-network/membership-tiers"
              as: Member
              as_user_id: "${resort_a}"
              payload: {}
              captures: { err_identity: "$.data.error_id" }
            - call: "GET /exchange-network/membership-tiers"
              as: ResortManager
              as_user_id: "${m1}"
              payload: {}
              captures: { err_identity2: "$.data.error_id" }
          assert:
            - "call 1, neither X-Role nor X-User-Id present — HTTP 401 with error_id ERR_MISSING_AUTH_HEADERS"
            - "call 2, role TravelAgent is outside {Member, ResortManager, NetworkOperator, DisputeAnalyst} — HTTP 401 with error_id ERR_UNKNOWN_ROLE, not 403"
            - "call 3, role Member with a Resort id as X-User-Id — HTTP 404 with error_id ERR_ACTING_IDENTITY_NOT_FOUND; a real id of the wrong kind does not satisfy the binding"
            - "call 4, role ResortManager with a Member id as X-User-Id — HTTP 404 with the same error_id, proving the binding is checked per role rather than as a generic id lookup"
            - "every one of the four responses uses the error envelope with response_type \"error\" and data holding only error_id and message"
            - "the same read as Member with X-User-Id \"${m1}\" returns HTTP 200, so the endpoint itself is reachable"

      - name: every_path_and_body_reference_has_its_own_not_found_error
        claim_type: violation_to_error
        grounds: ["validations[priority 6]", "errors[ERR_TIER_NOT_FOUND]", "errors[ERR_RESORT_NOT_FOUND]", "errors[ERR_SEASON_BAND_NOT_FOUND]", "errors[ERR_MEMBER_NOT_FOUND]", "errors[ERR_EXCHANGE_REQUEST_NOT_FOUND]", "errors[ERR_CONFIRMATION_NOT_FOUND]", "errors[ERR_GETAWAY_OFFER_NOT_FOUND]", "errors[ERR_DISPUTE_NOT_FOUND]", "errors[ERR_MATCHING_RUN_NOT_FOUND]", "errors[ERR_QUALITY_REVIEW_NOT_FOUND]", "errors[ERR_LEDGER_ENTRY_NOT_FOUND]"]
        distinguishing_aspect: >-
          The catalog declares a distinct 404 per entity rather than one generic ERR_NOT_FOUND, so every
          single-row read has to name its own type. Sharing a code across eleven endpoints is the default
          shortcut, and it is invisible until all eleven are probed against a database where no row of
          any type exists.
        test_recipe:
          setup: ["A completely empty network at the default clock. No row of any type has ever been created."]
          setup_api_calls: []
          trigger:
            - call: "GET /exchange-network/membership-tiers/aaaaaaaa-0000-4000-8000-000000000001"
              as: NetworkOperator
              payload: {}
              captures: { e1: "$.data.error_id" }
            - call: "GET /exchange-network/resorts/aaaaaaaa-0000-4000-8000-000000000002"
              as: NetworkOperator
              payload: {}
              captures: { e2: "$.data.error_id" }
            - call: "GET /exchange-network/season-bands/aaaaaaaa-0000-4000-8000-000000000003"
              as: NetworkOperator
              payload: {}
              captures: { e3: "$.data.error_id" }
            - call: "GET /exchange-network/members/aaaaaaaa-0000-4000-8000-000000000004"
              as: NetworkOperator
              payload: {}
              captures: { e4: "$.data.error_id" }
            - call: "GET /exchange-network/exchange-requests/aaaaaaaa-0000-4000-8000-000000000005"
              as: NetworkOperator
              payload: {}
              captures: { e5: "$.data.error_id" }
            - call: "GET /exchange-network/confirmations/aaaaaaaa-0000-4000-8000-000000000006"
              as: NetworkOperator
              payload: {}
              captures: { e6: "$.data.error_id" }
            - call: "GET /exchange-network/getaway-offers/aaaaaaaa-0000-4000-8000-000000000007"
              as: NetworkOperator
              payload: {}
              captures: { e7: "$.data.error_id" }
            - call: "GET /exchange-network/disputes/aaaaaaaa-0000-4000-8000-000000000008"
              as: NetworkOperator
              payload: {}
              captures: { e8: "$.data.error_id" }
            - call: "GET /exchange-network/matching-runs/aaaaaaaa-0000-4000-8000-000000000009"
              as: NetworkOperator
              payload: {}
              captures: { e9: "$.data.error_id" }
            - call: "GET /exchange-network/resort-quality-reviews/aaaaaaaa-0000-4000-8000-000000000010"
              as: NetworkOperator
              payload: {}
              captures: { e10: "$.data.error_id" }
            - call: "GET /exchange-network/ledger-entries/aaaaaaaa-0000-4000-8000-000000000011"
              as: NetworkOperator
              payload: {}
              captures: { e11: "$.data.error_id" }
          assert:
            - "all eleven calls return HTTP 404 with the error envelope"
            - "the eleven error_id values are, in call order, ERR_TIER_NOT_FOUND, ERR_RESORT_NOT_FOUND, ERR_SEASON_BAND_NOT_FOUND, ERR_MEMBER_NOT_FOUND, ERR_EXCHANGE_REQUEST_NOT_FOUND, ERR_CONFIRMATION_NOT_FOUND, ERR_GETAWAY_OFFER_NOT_FOUND, ERR_DISPUTE_NOT_FOUND, ERR_MATCHING_RUN_NOT_FOUND, ERR_QUALITY_REVIEW_NOT_FOUND and ERR_LEDGER_ENTRY_NOT_FOUND"
            - "the eleven error_id values are pairwise distinct — no shared generic code"
            - "the matching collection reads all return HTTP 200 with total_count 0 rather than 404; absence of rows is not an error on a list"

      - name: insufficient_wallet_credit_rejects_the_exchange_request
        claim_type: violation_to_error
        grounds: ["validations[priority 32]", "errors[ERR_INSUFFICIENT_WALLET_CREDIT]", "calculations.exchange_charge"]
        distinguishing_aspect: >-
          The wallet gate is the last rule in the global order and it fires with 402 rather than 409 or
          422, on a member who is fully ACTIVE, fully paid and holding a valid funding deposit — the only
          thing wrong is that the quoted charge exceeds the balance. Because dues are withheld from the
          payment before the remainder becomes wallet credit, paying exactly the annual dues leaves a
          zero balance, which makes the shortfall exact rather than incidental.
        test_recipe:
          setup: >-
            Tier PLUS, Resort A affiliated with a GOLD band. Member M1 on PLUS pays exactly 19900 in
            dues with paid_through_date 2030-12-31: enrollment_status becomes ACTIVE, dues_paid_through
            is well past every date used below, and wallet_credit_cents is exactly 0. M1 banks a ONE_BR
            week checking in 2027-06-15 worth 82, giving power_budget 90.
          setup_api_calls:
            - call: "POST /exchange-network/membership-tiers"
              as: NetworkOperator
              payload: { tier_code: "PLUS", annual_dues_cents: 19900, base_exchange_fee_cents: 20900, priority_surcharge_cents: 2500, priority_window_days: 365, deposit_first_bonus_pct: 10, max_active_requests: 3, cancellation_fee_cents: 8900, reinstatement_fee_cents: 10900, extension_fee_cents_per_month: 3400 }
              captures: { plus_tier: "$.data.id" }
            - call: "POST /exchange-network/resorts"
              as: NetworkOperator
              payload: { name: "Aspen Ridge Club", region_code: "US-CO", required_annual_deposit_units: 2, initial_quality_rating: "GOLD_CROWN", units_per_size: 2, demand_index: 4 }
              captures: { resort_a: "$.data.id" }
            - call: "POST /exchange-network/season-bands"
              as: NetworkOperator
              payload: { resort_id: "${resort_a}", band_code: "GOLD", start_month_day: "04-01", end_month_day: "06-30" }
            - call: "POST /exchange-network/resorts/${resort_a}/affiliation"
              as: NetworkOperator
              payload: {}
            - call: "POST /exchange-network/members"
              as: NetworkOperator
              payload: { email: "m1@example.com", full_name: "Dana Oyelaran", tier_id: "${plus_tier}" }
              captures: { m1: "$.data.id", m1_v: "$.data.version" }
            - call: "POST /exchange-network/members/${m1}/dues-payments"
              as: Member
              as_user_id: "${m1}"
              payload: { amount_cents: 19900, paid_through_date: "2030-12-31", expected_member_version: "${m1_v}" }
            - call: "POST /exchange-network/deposits"
              as: Member
              as_user_id: "${m1}"
              payload: { member_id: "${m1}", resort_id: "${resort_a}", unit_size: "ONE_BR", check_in_date: "2027-06-15" }
              captures: { dep1: "$.data.id" }
          trigger:
            - call: "POST /exchange-network/exchange-requests"
              as: Member
              as_user_id: "${m1}"
              payload: { member_id: "${m1}", requested_resort_id: "${resort_a}", requested_unit_size: "ONE_BR", window_start_date: "2027-06-15", window_end_date: "2027-06-15", deposit_id: "${dep1}" }
              captures: { err: "$.data.error_id" }
          assert:
            - "before the trigger, GET /exchange-network/members/${m1} shows enrollment_status \"ACTIVE\", wallet_credit_cents 0 and trading_power_balance 82"
            - "HTTP 402 with error_id ERR_INSUFFICIENT_WALLET_CREDIT — not 409 ERR_MEMBER_NOT_ACTIVE, since the member is active, and not 409 ERR_DEPOSIT_NOT_AVAILABLE, since the deposit is BANKED and NOT_LISTED"
            - "the charge that could not be afforded is 23060 (subtotal 23400, credit 2340, processing fee 2000)"
            - "GET /exchange-network/exchange-requests — total_count == 0 and GET /exchange-network/members/${m1} — active_request_count still 0"
            - "GET /exchange-network/members/${m1} — wallet_credit_cents still 0, never driven negative"
            - "GET /exchange-network/ledger-entries?member_id=${m1}&entry_type=EXCHANGE_CHARGE — total_count == 0"

      - name: lapsed_member_cannot_file_an_exchange_request
        claim_type: violation_to_error
        excluded_because:
          difficulty_instance: lapsed_member_state_beats_wallet_fiscal_on_exchange_request
          rationale: >-
            ERR_MEMBER_NOT_ACTIVE is raised and asserted by the §1.8 priority_pair_validation_conflict
            instance, which lapses the member through a matching run and then files a request that also
            violates the wallet rule. That fixture subsumes the plain single-violation probe.

      - name: deposit_into_a_suspended_resort_is_rejected
        claim_type: violation_to_error
        excluded_because:
          difficulty_instance: deposit_create_blocked_by_resort_affiliation_status
          rationale: >-
            ERR_RESORT_NOT_AFFILIATED is exercised across PENDING_AFFILIATION, SUSPENDED and TERMINATED
            by the §1.8 cross_entity_state_dependency instance, which also confirms PROBATION still
            accepts deposits. A corner probe would test one of those four cases.

      - name: deposit_on_a_date_no_band_covers_is_rejected
        claim_type: violation_to_error
        excluded_because:
          difficulty_instance: suspended_resort_safety_beats_missing_season_band_referential_on_deposit
          rationale: >-
            ERR_NO_SEASON_BAND_FOR_DATE is the loser of the §1.8 priority_pair_validation_conflict pair
            and is asserted there in isolation once the resort is returned to ACTIVE, so both the error
            and its precedence are already pinned.

      - name: overlapping_season_band_is_rejected
        claim_type: violation_to_error
        excluded_because:
          difficulty_instance: season_band_closed_interval_overlap_rejected_adjacent_accepted
          rationale: >-
            ERR_SEASON_BAND_OVERLAP is the subject of the §1.8 resource_temporal_overlap instance, which
            additionally pins the inclusive-interval semantics by accepting an exactly adjacent band. A
            corner instance could only assert the rejecting half.

      - name: overlapping_occupancy_beyond_capacity_is_rejected
        claim_type: violation_to_error
        excluded_because:
          difficulty_instance: deposit_occupancy_halfopen_buffer_capacity_conflict
          rationale: >-
            ERR_UNIT_INVENTORY_CONFLICT is raised inside the §1.8 resource_temporal_overlap instance,
            which walks the half-open interval, the turnover buffer and the units_per_size aggregate in
            one fixture. Nothing is left for a separate probe.

      - name: expired_deposit_cannot_be_extended
        claim_type: violation_to_error
        excluded_because:
          difficulty_instance: dispute_power_grant_blocked_by_expired_deposit
          rationale: >-
            ERR_DEPOSIT_EXPIRED is asserted by the §1.8 cross_entity_state_dependency instance on the
            dispute-resolution path, which is the harder of the two routes to the same error because it
            requires the deposit to expire while a dispute is already open.

      - name: quality_review_before_the_stay_completes_is_rejected
        claim_type: violation_to_error
        excluded_because:
          difficulty_instance: quality_review_blocked_until_confirmation_completed
          rationale: >-
            ERR_STAY_NOT_COMPLETED is the entire subject of the §1.8 cross_entity_state_dependency
            instance, which also shows the same review succeeding once the completion sweep has run.

      - name: third_dispute_round_is_rejected
        claim_type: violation_to_error
        excluded_because:
          difficulty_instance: dispute_info_request_review_cycle_round_cap
          rationale: >-
            ERR_DISPUTE_ROUND_LIMIT terminates the cycle exercised by the §1.8 non_linear_state_machine
            instance, which drives the dispute around the UNDER_REVIEW / INFO_REQUESTED loop up to
            MAX_DISPUTE_ROUNDS before asserting the error.

  # ===========================================================================
  - section: rbac
    instances:

      - name: role_not_permitted_on_each_roles_exclusive_endpoints
        claim_type: per_role_exclusive
        grounds: ["validations[priority 3]", "errors[ERR_ROLE_NOT_PERMITTED]", "rbac_matrix"]
        distinguishing_aspect: >-
          The role model is peer_roles, not a hierarchy, so each of the four roles owns endpoints the
          other three cannot reach and no role is a superset of another. Because priority 3 precedes
          both the priority 5 identity binding and the priority 6 existence checks, every one of these
          calls must return 403 even with an obviously fabricated path id — which is exactly what proves
          the authorisation gate runs before any lookup.
        test_recipe:
          setup: ["A completely empty network at the default clock; no row is needed because authorisation precedes existence."]
          setup_api_calls: []
          trigger:
            - call: "POST /exchange-network/membership-tiers"
              as: Member
              as_user_id: "bbbbbbbb-0000-4000-8000-000000000001"
              payload: { tier_code: "PLUS", annual_dues_cents: 19900, base_exchange_fee_cents: 20900, priority_surcharge_cents: 2500, priority_window_days: 365, deposit_first_bonus_pct: 10, max_active_requests: 3, cancellation_fee_cents: 8900, reinstatement_fee_cents: 10900, extension_fee_cents_per_month: 3400 }
              captures: { e_operator_only: "$.data.error_id" }
            - call: "POST /exchange-network/matching-runs"
              as: ResortManager
              as_user_id: "bbbbbbbb-0000-4000-8000-000000000002"
              payload: { note: "not mine to run" }
              captures: { e_run: "$.data.error_id" }
            - call: "POST /exchange-network/disputes"
              as: DisputeAnalyst
              payload: { member_id: "bbbbbbbb-0000-4000-8000-000000000003", subject_type: "TRADING_POWER", narrative: "Filed by the wrong role." }
              captures: { e_file: "$.data.error_id" }
            - call: "POST /exchange-network/disputes/bbbbbbbb-0000-4000-8000-000000000004/resolution"
              as: Member
              as_user_id: "bbbbbbbb-0000-4000-8000-000000000005"
              payload: { outcome: "UPHELD", resolution_note: "I rule in my own favour." }
              captures: { e_resolve: "$.data.error_id" }
            - call: "POST /exchange-network/getaway-offers/bbbbbbbb-0000-4000-8000-000000000006/withdrawal"
              as: Member
              as_user_id: "bbbbbbbb-0000-4000-8000-000000000007"
              payload: {}
              captures: { e_withdraw: "$.data.error_id" }
          assert:
            - "all five calls return HTTP 403 with error_id ERR_ROLE_NOT_PERMITTED"
            - "call 1 — tier creation is NetworkOperator-only, so a Member is refused even though the body is a valid tier"
            - "call 2 — triggering a matching run is NetworkOperator-only, so a ResortManager is refused"
            - "call 3 — filing a dispute is Member-only, so the DisputeAnalyst who resolves disputes cannot open one; the roles are peers, not a chain"
            - "call 4 — resolving a dispute is DisputeAnalyst-only; the 403 arrives even though the dispute id does not exist, so priority 3 precedes priority 6"
            - "call 5 — withdrawing a getaway offer is NetworkOperator-only; the 403 arrives even though the offer id does not exist"
            - "GET /exchange-network/membership-tiers as NetworkOperator — total_count == 0; none of the refused calls wrote anything"

      - name: member_cannot_withdraw_another_members_deposit
        claim_type: violation_to_error
        grounds: ["validations[priority 8]", "errors[ERR_NOT_RESOURCE_OWNER]", "endpoints[POST /exchange-network/deposits/{deposit_id}/withdrawal]"]
        distinguishing_aspect: >-
          Withdrawal is permitted for the Member role, so the role check at priority 3 passes and the
          request is only stopped by the ownership check at priority 8 — a 403 that depends on comparing
          X-User-Id against Deposit.member_id rather than on the role name. It must not be reported as
          404, which would leak nothing but also hide the fact that the row exists.
        test_recipe:
          setup: >-
            Tier PLUS, Resort A affiliated with a GOLD band. Members M1 and M2 both on PLUS with dues
            paid. M1 banks a ONE_BR week checking in 2027-06-15 worth 82; M2 owns no deposit.
          setup_api_calls:
            - call: "POST /exchange-network/membership-tiers"
              as: NetworkOperator
              payload: { tier_code: "PLUS", annual_dues_cents: 19900, base_exchange_fee_cents: 20900, priority_surcharge_cents: 2500, priority_window_days: 365, deposit_first_bonus_pct: 10, max_active_requests: 3, cancellation_fee_cents: 8900, reinstatement_fee_cents: 10900, extension_fee_cents_per_month: 3400 }
              captures: { plus_tier: "$.data.id" }
            - call: "POST /exchange-network/resorts"
              as: NetworkOperator
              payload: { name: "Aspen Ridge Club", region_code: "US-CO", required_annual_deposit_units: 2, initial_quality_rating: "GOLD_CROWN", units_per_size: 2, demand_index: 4 }
              captures: { resort_a: "$.data.id" }
            - call: "POST /exchange-network/season-bands"
              as: NetworkOperator
              payload: { resort_id: "${resort_a}", band_code: "GOLD", start_month_day: "04-01", end_month_day: "06-30" }
            - call: "POST /exchange-network/resorts/${resort_a}/affiliation"
              as: NetworkOperator
              payload: {}
            - call: "POST /exchange-network/members"
              as: NetworkOperator
              payload: { email: "m1@example.com", full_name: "Dana Oyelaran", tier_id: "${plus_tier}" }
              captures: { m1: "$.data.id", m1_v: "$.data.version" }
            - call: "POST /exchange-network/members/${m1}/dues-payments"
              as: Member
              as_user_id: "${m1}"
              payload: { amount_cents: 100000, paid_through_date: "2030-12-31", expected_member_version: "${m1_v}" }
            - call: "POST /exchange-network/members"
              as: NetworkOperator
              payload: { email: "m2@example.com", full_name: "Ravi Bergqvist", tier_id: "${plus_tier}" }
              captures: { m2: "$.data.id", m2_v: "$.data.version" }
            - call: "POST /exchange-network/members/${m2}/dues-payments"
              as: Member
              as_user_id: "${m2}"
              payload: { amount_cents: 100000, paid_through_date: "2030-12-31", expected_member_version: "${m2_v}" }
            - call: "POST /exchange-network/deposits"
              as: Member
              as_user_id: "${m1}"
              payload: { member_id: "${m1}", resort_id: "${resort_a}", unit_size: "ONE_BR", check_in_date: "2027-06-15" }
              captures: { dep_m1: "$.data.id" }
          trigger:
            - call: "POST /exchange-network/deposits/${dep_m1}/withdrawal"
              as: Member
              as_user_id: "${m2}"
              payload: {}
              captures: { err: "$.data.error_id" }
            - call: "POST /exchange-network/deposits/${dep_m1}/withdrawal"
              as: Member
              as_user_id: "${m1}"
              payload: {}
          assert:
            - "call 1 — HTTP 403 with error_id ERR_NOT_RESOURCE_OWNER, not 404 ERR_DEPOSIT_NOT_FOUND and not 403 ERR_ROLE_NOT_PERMITTED"
            - "after call 1, GET /exchange-network/deposits/${dep_m1} — deposit_status still \"BANKED\" and remaining_power still 82"
            - "after call 1, GET /exchange-network/members/${m1} — trading_power_balance still 82; GET /exchange-network/members/${m2} — trading_power_balance still 0"
            - "call 2, the owner making the identical call — HTTP 200 with deposit_status \"WITHDRAWN\""
            - "after call 2, GET /exchange-network/members/${m1} — trading_power_balance == 0 and GET /exchange-network/resorts/${resort_a} — deposits_committed_count == 0 and committed_nights == 0"

      - name: resort_manager_cannot_read_another_resorts_compliance
        claim_type: violation_to_error
        grounds: ["validations[priority 9]", "errors[ERR_NOT_RESORT_MANAGER]", "endpoints[GET /exchange-network/resorts/{resort_id}/compliance]"]
        distinguishing_aspect: >-
          ResortManager identities bind to Resort rows, so scoping is a comparison between the path
          resort id and X-User-Id — a different 403 from the member-ownership one, with its own error_id.
          The same endpoint is unscoped for NetworkOperator, so the identical read succeeds for the
          operator, which shows the scope is per role rather than per endpoint.
        test_recipe:
          setup: >-
            Two resorts, each with a season band and each affiliated: Resort A "Aspen Ridge Club" and
            Resort B "Coral Bay Villas" (region MX-QR, units_per_size 1, demand_index 5,
            initial_quality_rating SILVER_CROWN). No deposits exist, so both compliance reads report
            zero counts.
          setup_api_calls:
            - call: "POST /exchange-network/resorts"
              as: NetworkOperator
              payload: { name: "Aspen Ridge Club", region_code: "US-CO", required_annual_deposit_units: 2, initial_quality_rating: "GOLD_CROWN", units_per_size: 2, demand_index: 4 }
              captures: { resort_a: "$.data.id" }
            - call: "POST /exchange-network/season-bands"
              as: NetworkOperator
              payload: { resort_id: "${resort_a}", band_code: "GOLD", start_month_day: "04-01", end_month_day: "06-30" }
            - call: "POST /exchange-network/resorts/${resort_a}/affiliation"
              as: NetworkOperator
              payload: {}
            - call: "POST /exchange-network/resorts"
              as: NetworkOperator
              payload: { name: "Coral Bay Villas", region_code: "MX-QR", required_annual_deposit_units: 1, initial_quality_rating: "SILVER_CROWN", units_per_size: 1, demand_index: 5 }
              captures: { resort_b: "$.data.id" }
            - call: "POST /exchange-network/season-bands"
              as: NetworkOperator
              payload: { resort_id: "${resort_b}", band_code: "PLATINUM", start_month_day: "01-01", end_month_day: "06-30" }
            - call: "POST /exchange-network/resorts/${resort_b}/affiliation"
              as: NetworkOperator
              payload: {}
          trigger:
            - call: "GET /exchange-network/resorts/${resort_a}/compliance"
              as: ResortManager
              as_user_id: "${resort_b}"
              payload: {}
              captures: { err: "$.data.error_id" }
            - call: "GET /exchange-network/resorts/${resort_a}/compliance"
              as: ResortManager
              as_user_id: "${resort_a}"
              payload: {}
            - call: "GET /exchange-network/resorts/${resort_a}/compliance"
              as: NetworkOperator
              payload: {}
          assert:
            - "call 1 — HTTP 403 with error_id ERR_NOT_RESORT_MANAGER, not ERR_NOT_RESOURCE_OWNER and not ERR_ROLE_NOT_PERMITTED"
            - "call 2, the manager of the resort in the path — HTTP 200 with obligation_units 2, counted_by_stay_year 0 and shortfall_by_stay_year 2"
            - "call 3, the operator — HTTP 200 with data identical to call 2; the operator is not resort-scoped"
            - "GET /exchange-network/resorts/${resort_b}/compliance as ResortManager with X-User-Id \"${resort_b}\" — HTTP 200 with obligation_units 1, so the manager sees exactly one resort"

      - name: deposit_creation_is_shared_between_member_and_network_operator
        claim_type: shared_role_access
        grounds: ["rbac_matrix", "endpoints[POST /exchange-network/deposits]", "roles"]
        distinguishing_aspect: >-
          POST /deposits is one of the few endpoints granted to two peer roles, and the operator route is
          not a self-service route: the operator supplies member_id for somebody else and there is no
          ownership check to satisfy. Both routes must land on identical valuation and identical ledger
          effects, so the role changes who may call, never what the call computes.
        test_recipe:
          setup: >-
            Tier PLUS, Resort A affiliated with a GOLD band, members M1 and M2 both on PLUS with dues
            paid, neither holding a deposit yet.
          setup_api_calls:
            - call: "POST /exchange-network/membership-tiers"
              as: NetworkOperator
              payload: { tier_code: "PLUS", annual_dues_cents: 19900, base_exchange_fee_cents: 20900, priority_surcharge_cents: 2500, priority_window_days: 365, deposit_first_bonus_pct: 10, max_active_requests: 3, cancellation_fee_cents: 8900, reinstatement_fee_cents: 10900, extension_fee_cents_per_month: 3400 }
              captures: { plus_tier: "$.data.id" }
            - call: "POST /exchange-network/resorts"
              as: NetworkOperator
              payload: { name: "Aspen Ridge Club", region_code: "US-CO", required_annual_deposit_units: 2, initial_quality_rating: "GOLD_CROWN", units_per_size: 2, demand_index: 4 }
              captures: { resort_a: "$.data.id" }
            - call: "POST /exchange-network/season-bands"
              as: NetworkOperator
              payload: { resort_id: "${resort_a}", band_code: "GOLD", start_month_day: "04-01", end_month_day: "06-30" }
            - call: "POST /exchange-network/resorts/${resort_a}/affiliation"
              as: NetworkOperator
              payload: {}
            - call: "POST /exchange-network/members"
              as: NetworkOperator
              payload: { email: "m1@example.com", full_name: "Dana Oyelaran", tier_id: "${plus_tier}" }
              captures: { m1: "$.data.id", m1_v: "$.data.version" }
            - call: "POST /exchange-network/members/${m1}/dues-payments"
              as: Member
              as_user_id: "${m1}"
              payload: { amount_cents: 100000, paid_through_date: "2030-12-31", expected_member_version: "${m1_v}" }
            - call: "POST /exchange-network/members"
              as: NetworkOperator
              payload: { email: "m2@example.com", full_name: "Ravi Bergqvist", tier_id: "${plus_tier}" }
              captures: { m2: "$.data.id", m2_v: "$.data.version" }
            - call: "POST /exchange-network/members/${m2}/dues-payments"
              as: Member
              as_user_id: "${m2}"
              payload: { amount_cents: 100000, paid_through_date: "2030-12-31", expected_member_version: "${m2_v}" }
          trigger:
            - call: "POST /exchange-network/deposits"
              as: Member
              as_user_id: "${m1}"
              payload: { member_id: "${m1}", resort_id: "${resort_a}", unit_size: "ONE_BR", check_in_date: "2027-06-15" }
              captures: { dep_self: "$.data.id" }
            - call: "POST /exchange-network/deposits"
              as: NetworkOperator
              payload: { member_id: "${m2}", resort_id: "${resort_a}", unit_size: "ONE_BR", check_in_date: "2027-06-25" }
              captures: { dep_proxy: "$.data.id" }
          assert:
            - "both calls return HTTP 201 with awarded_power 82 — the member's own route and the operator's proxy route value the week identically"
            - "the proxy deposit's member_id is \"${m2}\", not the operator, and its season_band_code is \"GOLD\""
            - "GET /exchange-network/members/${m1} — trading_power_balance 82; GET /exchange-network/members/${m2} — trading_power_balance 82"
            - "GET /exchange-network/ledger-entries?entry_type=DEPOSIT_CREDIT — total_count == 2, one row per member, each with power_delta 82"
            - "GET /exchange-network/resorts/${resort_a} — deposits_committed_count == 2 and committed_nights == 16"
            - "the identical proxy call as ResortManager or DisputeAnalyst returns 403 ERR_ROLE_NOT_PERMITTED; the endpoint is shared by exactly two roles"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: occ_stale_deposit_version_on_extension_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[OCC_DEPOSIT_EXTENSION]", "endpoints[POST /exchange-network/deposits/{deposit_id}/extensions]", "errors[ERR_STALE_VERSION]", "calculations.deposit_extension_cost"]
        distinguishing_aspect: >-
          Buying extension months is a legitimately repeatable operation, so the only thing standing
          between a replayed request and a double extension is the version compare. The rejection must
          be total: expires_at, extension_months_purchased, the wallet and the EXTENSION_FEE ledger row
          all stay exactly as the first purchase left them, and the very same body succeeds once the
          caller re-reads the version.
        test_recipe:
          setup: >-
            Tier PLUS, Resort A affiliated with a GOLD band, member M1 on PLUS with dues 100000 paid
            through 2030-12-31 leaving wallet 80100. M1 banks a ONE_BR week checking in 2027-06-15,
            worth 82, expiring 2029-06-14T00:00:00Z, whose version is captured from the 201. M1 then
            buys 3 extension months at 3400 each: expires_at moves out by 90 days to
            2029-09-12T00:00:00Z, extension_months_purchased becomes 3, the wallet drops to 69900 and
            the deposit's version moves on, making the captured value stale.
          setup_api_calls:
            - call: "POST /exchange-network/membership-tiers"
              as: NetworkOperator
              payload: { tier_code: "PLUS", annual_dues_cents: 19900, base_exchange_fee_cents: 20900, priority_surcharge_cents: 2500, priority_window_days: 365, deposit_first_bonus_pct: 10, max_active_requests: 3, cancellation_fee_cents: 8900, reinstatement_fee_cents: 10900, extension_fee_cents_per_month: 3400 }
              captures: { plus_tier: "$.data.id" }
            - call: "POST /exchange-network/resorts"
              as: NetworkOperator
              payload: { name: "Aspen Ridge Club", region_code: "US-CO", required_annual_deposit_units: 2, initial_quality_rating: "GOLD_CROWN", units_per_size: 2, demand_index: 4 }
              captures: { resort_a: "$.data.id" }
            - call: "POST /exchange-network/season-bands"
              as: NetworkOperator
              payload: { resort_id: "${resort_a}", band_code: "GOLD", start_month_day: "04-01", end_month_day: "06-30" }
            - call: "POST /exchange-network/resorts/${resort_a}/affiliation"
              as: NetworkOperator
              payload: {}
            - call: "POST /exchange-network/members"
              as: NetworkOperator
              payload: { email: "m1@example.com", full_name: "Dana Oyelaran", tier_id: "${plus_tier}" }
              captures: { m1: "$.data.id", m1_v: "$.data.version" }
            - call: "POST /exchange-network/members/${m1}/dues-payments"
              as: Member
              as_user_id: "${m1}"
              payload: { amount_cents: 100000, paid_through_date: "2030-12-31", expected_member_version: "${m1_v}" }
            - call: "POST /exchange-network/deposits"
              as: Member
              as_user_id: "${m1}"
              payload: { member_id: "${m1}", resort_id: "${resort_a}", unit_size: "ONE_BR", check_in_date: "2027-06-15" }
              captures: { dep1: "$.data.id", dep1_v0: "$.data.version" }
            - call: "POST /exchange-network/deposits/${dep1}/extensions"
              as: Member
              as_user_id: "${m1}"
              payload: { months: 3, expected_deposit_version: "${dep1_v0}" }
              captures: { dep1_v1: "$.data.version" }
          trigger:
            - call: "POST /exchange-network/deposits/${dep1}/extensions"
              as: Member
              as_user_id: "${m1}"
              payload: { months: 3, expected_deposit_version: "${dep1_v0}" }
              captures: { err: "$.data.error_id" }
            - call: "POST /exchange-network/deposits/${dep1}/extensions"
              as: Member
              as_user_id: "${m1}"
              payload: { months: 3, expected_deposit_version: "${dep1_v1}" }
          assert:
            - "the setup purchase returned HTTP 200 with expires_at \"2029-09-12T00:00:00Z\", extension_months_purchased 3 and a version strictly greater than ${dep1_v0}"
            - "trigger call 1 replaying ${dep1_v0} — HTTP 412 with error_id ERR_STALE_VERSION"
            - "after call 1, GET /exchange-network/deposits/${dep1} — expires_at still \"2029-09-12T00:00:00Z\" and extension_months_purchased still 3"
            - "after call 1, GET /exchange-network/members/${m1} — wallet_credit_cents still 69900"
            - "after call 1, GET /exchange-network/ledger-entries?member_id=${m1}&entry_type=EXTENSION_FEE — total_count == 1 with cash_delta_cents -10200"
            - "trigger call 2 with the refreshed version — HTTP 200, extension_months_purchased 6, expires_at \"2029-12-11T00:00:00Z\" and wallet_credit_cents 59700"
            - "GET /exchange-network/ledger-entries?member_id=${m1}&entry_type=EXTENSION_FEE — total_count == 2; the rejected replay never left a row behind"

      - name: occ_stale_member_version_on_dues_payment_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[OCC_MEMBER_DUES_PAYMENT]", "endpoints[POST /exchange-network/members/{member_id}/dues-payments]", "errors[ERR_STALE_VERSION]", "invariants[INV_CASH]"]
        distinguishing_aspect: >-
          A dues payment both credits the wallet and moves the paid-through date, so a replay is a
          double credit of real money rather than a harmless no-op. The version returned by the member
          create call is exactly the one a naive client keeps, which makes the second payment the
          natural mistake — and the rejection has to leave wallet_credit_cents, dues_paid_through and
          the LedgerEntry table completely untouched so that INV_CASH still holds.
        test_recipe:
          setup: >-
            Tier PLUS. Member M1 is created on PLUS in PENDING_PAYMENT, and the version from that 201
            is captured. M1 pays 100000 with paid_through_date 2030-12-31 using that version: the member
            becomes ACTIVE with wallet_credit_cents 80100 (100000 minus 19900 of dues withheld) and the
            captured version becomes stale.
          setup_api_calls:
            - call: "POST /exchange-network/membership-tiers"
              as: NetworkOperator
              payload: { tier_code: "PLUS", annual_dues_cents: 19900, base_exchange_fee_cents: 20900, priority_surcharge_cents: 2500, priority_window_days: 365, deposit_first_bonus_pct: 10, max_active_requests: 3, cancellation_fee_cents: 8900, reinstatement_fee_cents: 10900, extension_fee_cents_per_month: 3400 }
              captures: { plus_tier: "$.data.id" }
            - call: "POST /exchange-network/members"
              as: NetworkOperator
              payload: { email: "m1@example.com", full_name: "Dana Oyelaran", tier_id: "${plus_tier}" }
              captures: { m1: "$.data.id", m1_v0: "$.data.version" }
            - call: "POST /exchange-network/members/${m1}/dues-payments"
              as: Member
              as_user_id: "${m1}"
              payload: { amount_cents: 100000, paid_through_date: "2030-12-31", expected_member_version: "${m1_v0}" }
              captures: { m1_v1: "$.data.version" }
          trigger:
            - call: "POST /exchange-network/members/${m1}/dues-payments"
              as: Member
              as_user_id: "${m1}"
              payload: { amount_cents: 100000, paid_through_date: "2031-12-31", expected_member_version: "${m1_v0}" }
              captures: { err: "$.data.error_id" }
            - call: "POST /exchange-network/members/${m1}/dues-payments"
              as: Member
              as_user_id: "${m1}"
              payload: { amount_cents: 100000, paid_through_date: "2031-12-31", expected_member_version: "${m1_v1}" }
          assert:
            - "the setup payment returned HTTP 200 with enrollment_status \"ACTIVE\", dues_paid_through \"2030-12-31\", wallet_credit_cents 80100 and a version strictly greater than ${m1_v0}"
            - "trigger call 1 replaying ${m1_v0} — HTTP 412 with error_id ERR_STALE_VERSION, not 200 and not 409"
            - "after call 1, GET /exchange-network/members/${m1} — wallet_credit_cents still 80100 and dues_paid_through still \"2030-12-31\"; the 2031 date was not written"
            - "after call 1, GET /exchange-network/ledger-entries?member_id=${m1}&entry_type=DUES_PAYMENT — total_count == 1"
            - "trigger call 2 with the refreshed version — HTTP 200, dues_paid_through \"2031-12-31\" and wallet_credit_cents 160200"
            - "GET /exchange-network/ledger-entries?member_id=${m1}&entry_type=DUES_PAYMENT — total_count == 2, each with cash_delta_cents 80100, and their sum equals wallet_credit_cents per INV_CASH"

      - name: occ_stale_resort_version_on_quality_review_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[OCC_RESORT_QUALITY_REVIEW]", "endpoints[POST /exchange-network/resorts/{resort_id}/quality-reviews]", "errors[ERR_STALE_VERSION]", "validations[priority 10]", "validations[priority 14]"]
        distinguishing_aspect: >-
          The version compare sits at priority 10, ahead of the priority-14 stay-completion check, so a
          stale version on a review for a stay that has NOT happened yet must surface as 412 rather than
          the 409 the business rule would eventually produce. Ordering two rules that both reject the
          same call is the part an implementation gets wrong by validating business state first.
        test_recipe:
          setup: >-
            Tier PLUS, Resort A affiliated with a GOLD band; the resort version is captured from the
            creation 201, before affiliation and before any deposit touches its counters. Members M1 and
            M2 on PLUS with dues paid. M1 banks a ONE_BR week checking in 2027-06-15 worth 82; M2 banks
            a TWO_BR week checking in 2027-05-10 worth 107 and files a DEPOSIT_FIRST request for a
            ONE_BR at Resort A with the window pinned to 2027-06-15. A matching run matches it to M1's
            deposit, and M2 confirms — leaving a CONFIRMED, not COMPLETED, confirmation. The resort's
            current version is then read fresh.
          setup_api_calls:
            - call: "POST /exchange-network/membership-tiers"
              as: NetworkOperator
              payload: { tier_code: "PLUS", annual_dues_cents: 19900, base_exchange_fee_cents: 20900, priority_surcharge_cents: 2500, priority_window_days: 365, deposit_first_bonus_pct: 10, max_active_requests: 3, cancellation_fee_cents: 8900, reinstatement_fee_cents: 10900, extension_fee_cents_per_month: 3400 }
              captures: { plus_tier: "$.data.id" }
            - call: "POST /exchange-network/resorts"
              as: NetworkOperator
              payload: { name: "Aspen Ridge Club", region_code: "US-CO", required_annual_deposit_units: 2, initial_quality_rating: "GOLD_CROWN", units_per_size: 2, demand_index: 4 }
              captures: { resort_a: "$.data.id", ra_v0: "$.data.version" }
            - call: "POST /exchange-network/season-bands"
              as: NetworkOperator
              payload: { resort_id: "${resort_a}", band_code: "GOLD", start_month_day: "04-01", end_month_day: "06-30" }
            - call: "POST /exchange-network/resorts/${resort_a}/affiliation"
              as: NetworkOperator
              payload: {}
            - call: "POST /exchange-network/members"
              as: NetworkOperator
              payload: { email: "m1@example.com", full_name: "Dana Oyelaran", tier_id: "${plus_tier}" }
              captures: { m1: "$.data.id", m1_v: "$.data.version" }
            - call: "POST /exchange-network/members/${m1}/dues-payments"
              as: Member
              as_user_id: "${m1}"
              payload: { amount_cents: 100000, paid_through_date: "2030-12-31", expected_member_version: "${m1_v}" }
            - call: "POST /exchange-network/members"
              as: NetworkOperator
              payload: { email: "m2@example.com", full_name: "Ravi Bergqvist", tier_id: "${plus_tier}" }
              captures: { m2: "$.data.id", m2_v: "$.data.version" }
            - call: "POST /exchange-network/members/${m2}/dues-payments"
              as: Member
              as_user_id: "${m2}"
              payload: { amount_cents: 100000, paid_through_date: "2030-12-31", expected_member_version: "${m2_v}" }
            - call: "POST /exchange-network/deposits"
              as: Member
              as_user_id: "${m1}"
              payload: { member_id: "${m1}", resort_id: "${resort_a}", unit_size: "ONE_BR", check_in_date: "2027-06-15" }
              captures: { dep_m1: "$.data.id" }
            - call: "POST /exchange-network/deposits"
              as: Member
              as_user_id: "${m2}"
              payload: { member_id: "${m2}", resort_id: "${resort_a}", unit_size: "TWO_BR", check_in_date: "2027-05-10" }
              captures: { dep_m2: "$.data.id" }
            - call: "POST /exchange-network/exchange-requests"
              as: Member
              as_user_id: "${m2}"
              payload: { member_id: "${m2}", requested_resort_id: "${resort_a}", requested_unit_size: "ONE_BR", window_start_date: "2027-06-15", window_end_date: "2027-06-15", deposit_id: "${dep_m2}" }
              captures: { req2: "$.data.id" }
            - call: "POST /exchange-network/matching-runs"
              as: NetworkOperator
              payload: { note: "match the pinned window" }
            - call: "POST /exchange-network/confirmations"
              as: Member
              as_user_id: "${m2}"
              payload: { exchange_request_id: "${req2}" }
              captures: { conf2: "$.data.id" }
            - call: "GET /exchange-network/resorts/${resort_a}"
              as: NetworkOperator
              payload: {}
              captures: { ra_vnow: "$.data.version" }
          trigger:
            - call: "POST /exchange-network/resorts/${resort_a}/quality-reviews"
              as: Member
              as_user_id: "${m2}"
              payload: { confirmation_id: "${conf2}", cleanliness_score: 9, service_score: 8, amenities_score: 7, expected_resort_version: "${ra_v0}" }
              captures: { err: "$.data.error_id" }
            - call: "POST /exchange-network/resorts/${resort_a}/quality-reviews"
              as: Member
              as_user_id: "${m2}"
              payload: { confirmation_id: "${conf2}", cleanliness_score: 9, service_score: 8, amenities_score: 7, expected_resort_version: "${ra_vnow}" }
              captures: { err2: "$.data.error_id" }
          assert:
            - "GET /exchange-network/resorts/${resort_a} reports a version different from ${ra_v0} — affiliation and two deposits have moved the row on"
            - "GET /exchange-network/confirmations/${conf2} — status \"CONFIRMED\", so the priority-14 stay-completion rule would also reject this review"
            - "trigger call 1 — HTTP 412 with error_id ERR_STALE_VERSION; the priority-10 version compare wins over the priority-14 business rule"
            - "trigger call 2, same body with the current version — HTTP 409 with error_id ERR_STAY_NOT_COMPLETED, proving the first response was about the version and nothing else"
            - "GET /exchange-network/resort-quality-reviews?resort_id=${resort_a} — total_count == 0 after both calls"
            - "GET /exchange-network/resorts/${resort_a} — review_count 0, quality_rating still \"GOLD_CROWN\" and version unchanged from ${ra_vnow}; neither rejection wrote anything"

      - name: member_wallet_and_power_reconcile_with_the_ledger
        claim_type: derived_aggregate_consistency
        grounds: ["invariants[INV_CASH]", "invariants[INV_POWER]", "entities.Member.active_request_count", "entities.LedgerEntry", "state_machines.exchange_request_status"]
        distinguishing_aspect: >-
          wallet_credit_cents, trading_power_balance and active_request_count are all denormalised
          rollups, and the only way to prove they are maintained rather than guessed is to drive a
          member through several money-moving and count-moving operations and then reconcile all three
          against the ledger and the request list in one shot. A refund in particular has to both write
          a positive ledger row and decrement the count, and an implementation that decrements the count
          without the ledger row (or the reverse) survives every single-operation test.
        test_recipe:
          setup: >-
            Tier PLUS, Resort A affiliated with a GOLD band, and one member M2 on PLUS with dues 100000
            paid through 2030-12-31 leaving wallet 80100. M2 banks two TWO_BR weeks at Resort A,
            checking in 2027-05-10 and 2027-05-20, each worth 107 — occupancy windows [05-10, 05-18)
            and [05-20, 05-28) do not overlap, so both are accepted. trading_power_balance is 214.
          setup_api_calls:
            - call: "POST /exchange-network/membership-tiers"
              as: NetworkOperator
              payload: { tier_code: "PLUS", annual_dues_cents: 19900, base_exchange_fee_cents: 20900, priority_surcharge_cents: 2500, priority_window_days: 365, deposit_first_bonus_pct: 10, max_active_requests: 3, cancellation_fee_cents: 8900, reinstatement_fee_cents: 10900, extension_fee_cents_per_month: 3400 }
              captures: { plus_tier: "$.data.id" }
            - call: "POST /exchange-network/resorts"
              as: NetworkOperator
              payload: { name: "Aspen Ridge Club", region_code: "US-CO", required_annual_deposit_units: 2, initial_quality_rating: "GOLD_CROWN", units_per_size: 2, demand_index: 4 }
              captures: { resort_a: "$.data.id" }
            - call: "POST /exchange-network/season-bands"
              as: NetworkOperator
              payload: { resort_id: "${resort_a}", band_code: "GOLD", start_month_day: "04-01", end_month_day: "06-30" }
            - call: "POST /exchange-network/resorts/${resort_a}/affiliation"
              as: NetworkOperator
              payload: {}
            - call: "POST /exchange-network/members"
              as: NetworkOperator
              payload: { email: "m2@example.com", full_name: "Ravi Bergqvist", tier_id: "${plus_tier}" }
              captures: { m2: "$.data.id", m2_v: "$.data.version" }
            - call: "POST /exchange-network/members/${m2}/dues-payments"
              as: Member
              as_user_id: "${m2}"
              payload: { amount_cents: 100000, paid_through_date: "2030-12-31", expected_member_version: "${m2_v}" }
            - call: "POST /exchange-network/deposits"
              as: Member
              as_user_id: "${m2}"
              payload: { member_id: "${m2}", resort_id: "${resort_a}", unit_size: "TWO_BR", check_in_date: "2027-05-10" }
              captures: { dep_a: "$.data.id" }
            - call: "POST /exchange-network/deposits"
              as: Member
              as_user_id: "${m2}"
              payload: { member_id: "${m2}", resort_id: "${resort_a}", unit_size: "TWO_BR", check_in_date: "2027-05-20" }
              captures: { dep_b: "$.data.id" }
          trigger:
            - call: "POST /exchange-network/exchange-requests"
              as: Member
              as_user_id: "${m2}"
              payload: { member_id: "${m2}", requested_resort_id: "${resort_a}", requested_unit_size: "ONE_BR", window_start_date: "2027-06-15", window_end_date: "2027-06-15", deposit_id: "${dep_a}" }
              captures: { req_a: "$.data.id" }
            - call: "POST /exchange-network/exchange-requests"
              as: Member
              as_user_id: "${m2}"
              payload: { member_id: "${m2}", requested_resort_id: "${resort_a}", requested_unit_size: "ONE_BR", window_start_date: "2027-06-20", window_end_date: "2027-06-20", deposit_id: "${dep_b}" }
              captures: { req_b: "$.data.id" }
            - call: "POST /exchange-network/exchange-requests/${req_a}/cancellation"
              as: Member
              as_user_id: "${m2}"
              payload: {}
          assert:
            - "both requests quote quoted_charge_cents 23060 (power_budget 117, required_power_estimate 82, power_gap 0, subtotal 23400, credit 2340, processing fee 2000)"
            - "after call 2, GET /exchange-network/members/${m2} — active_request_count == 2 and wallet_credit_cents == 33980"
            - "after call 3, GET /exchange-network/exchange-requests/${req_a} — status \"CANCELLED\" and charge_refunded_cents == 23060"
            - "after call 3, GET /exchange-network/members/${m2} — active_request_count == 1, matching the one request still in {SUBMITTED, WAITLISTED, MATCHED}, and wallet_credit_cents == 57040"
            - "GET /exchange-network/exchange-requests?member_id=${m2}&status=SUBMITTED — total_count == 1; ?status=CANCELLED — total_count == 1"
            - "GET /exchange-network/ledger-entries?member_id=${m2} — total_count == 6 and the sum of cash_delta_cents is 80100 - 23060 - 23060 + 23060 == 57040, equal to wallet_credit_cents per INV_CASH"
            - "the same list's power_delta values sum to 107 + 107 == 214, equal to trading_power_balance per INV_POWER; the cash operations moved no power and the deposits moved no cash"
            - "GET /exchange-network/ledger-entries?member_id=${m2}&entry_type=EXCHANGE_CHARGE_REFUND — total_count == 1; the refund is a new row, not an edit of the charge row"

      - name: hold_expiry_in_step_two_frees_the_deposit_for_step_three
        claim_type: cascading_side_effects
        grounds: ["calculations.matching_run_step_order", "state_machines.deposit_status", "state_machines.exchange_request_status", "entities.MatchingRun"]
        distinguishing_aspect: >-
          Step 2 sweeps expired holds and step 3 runs the matching pass, in that order and inside a
          single run. The consequence is that inventory released by an expired hold becomes available to
          a waitlisted request in the very same run — one POST produces both an EXPIRED request and a
          newly MATCHED one over the same deposit. An implementation that matches before sweeping, or
          that sweeps in a separate pass, leaves the waitlisted request waiting for a second run.
        test_recipe:
          setup: >-
            Tier PLUS, Resort A affiliated with a GOLD band. Three members M1, M2, M3 on PLUS, each with
            dues 100000 paid through 2030-12-31 and wallet 80100. M1 banks a ONE_BR week checking in
            2027-06-15 worth 82 — the only ONE_BR inventory in the network. M2 banks a TWO_BR week
            checking in 2027-05-10 worth 107 and M3 banks a TWO_BR week checking in 2027-05-20 also
            worth 107. M2 files a DEPOSIT_FIRST request for a ONE_BR at Resort A pinned to 2027-06-15
            (budget 117, charge 23060, wallet 57040), then M3 files the identical request (budget 117,
            charge 23060, wallet 57040). A first run at the default clock 2026-08-01 matches M2's
            request to M1's deposit — both requests score 35, so created_at ASC breaks the tie in M2's
            favour — leaving M3's request WAITLISTED, M1's deposit RESERVED and the hold expiring at
            2026-08-03T00:00:00Z. The clock is then set to 2026-08-04T00:00:00Z, one day past the hold.
          setup_api_calls:
            - call: "POST /exchange-network/membership-tiers"
              as: NetworkOperator
              payload: { tier_code: "PLUS", annual_dues_cents: 19900, base_exchange_fee_cents: 20900, priority_surcharge_cents: 2500, priority_window_days: 365, deposit_first_bonus_pct: 10, max_active_requests: 3, cancellation_fee_cents: 8900, reinstatement_fee_cents: 10900, extension_fee_cents_per_month: 3400 }
              captures: { plus_tier: "$.data.id" }
            - call: "POST /exchange-network/resorts"
              as: NetworkOperator
              payload: { name: "Aspen Ridge Club", region_code: "US-CO", required_annual_deposit_units: 2, initial_quality_rating: "GOLD_CROWN", units_per_size: 2, demand_index: 4 }
              captures: { resort_a: "$.data.id" }
            - call: "POST /exchange-network/season-bands"
              as: NetworkOperator
              payload: { resort_id: "${resort_a}", band_code: "GOLD", start_month_day: "04-01", end_month_day: "06-30" }
            - call: "POST /exchange-network/resorts/${resort_a}/affiliation"
              as: NetworkOperator
              payload: {}
            - call: "POST /exchange-network/members"
              as: NetworkOperator
              payload: { email: "m1@example.com", full_name: "Dana Oyelaran", tier_id: "${plus_tier}" }
              captures: { m1: "$.data.id", m1_v: "$.data.version" }
            - call: "POST /exchange-network/members/${m1}/dues-payments"
              as: Member
              as_user_id: "${m1}"
              payload: { amount_cents: 100000, paid_through_date: "2030-12-31", expected_member_version: "${m1_v}" }
            - call: "POST /exchange-network/members"
              as: NetworkOperator
              payload: { email: "m2@example.com", full_name: "Ravi Bergqvist", tier_id: "${plus_tier}" }
              captures: { m2: "$.data.id", m2_v: "$.data.version" }
            - call: "POST /exchange-network/members/${m2}/dues-payments"
              as: Member
              as_user_id: "${m2}"
              payload: { amount_cents: 100000, paid_through_date: "2030-12-31", expected_member_version: "${m2_v}" }
            - call: "POST /exchange-network/members"
              as: NetworkOperator
              payload: { email: "m3@example.com", full_name: "Ines Kowalczyk", tier_id: "${plus_tier}" }
              captures: { m3: "$.data.id", m3_v: "$.data.version" }
            - call: "POST /exchange-network/members/${m3}/dues-payments"
              as: Member
              as_user_id: "${m3}"
              payload: { amount_cents: 100000, paid_through_date: "2030-12-31", expected_member_version: "${m3_v}" }
            - call: "POST /exchange-network/deposits"
              as: Member
              as_user_id: "${m1}"
              payload: { member_id: "${m1}", resort_id: "${resort_a}", unit_size: "ONE_BR", check_in_date: "2027-06-15" }
              captures: { dep_m1: "$.data.id" }
            - call: "POST /exchange-network/deposits"
              as: Member
              as_user_id: "${m2}"
              payload: { member_id: "${m2}", resort_id: "${resort_a}", unit_size: "TWO_BR", check_in_date: "2027-05-10" }
              captures: { dep_m2: "$.data.id" }
            - call: "POST /exchange-network/deposits"
              as: Member
              as_user_id: "${m3}"
              payload: { member_id: "${m3}", resort_id: "${resort_a}", unit_size: "TWO_BR", check_in_date: "2027-05-20" }
              captures: { dep_m3: "$.data.id" }
            - call: "POST /exchange-network/exchange-requests"
              as: Member
              as_user_id: "${m2}"
              payload: { member_id: "${m2}", requested_resort_id: "${resort_a}", requested_unit_size: "ONE_BR", window_start_date: "2027-06-15", window_end_date: "2027-06-15", deposit_id: "${dep_m2}" }
              captures: { req2: "$.data.id" }
            - call: "POST /exchange-network/exchange-requests"
              as: Member
              as_user_id: "${m3}"
              payload: { member_id: "${m3}", requested_resort_id: "${resort_a}", requested_unit_size: "ONE_BR", window_start_date: "2027-06-15", window_end_date: "2027-06-15", deposit_id: "${dep_m3}" }
              captures: { req3: "$.data.id" }
            - call: "POST /exchange-network/matching-runs"
              as: NetworkOperator
              payload: { note: "run 1 - match M2, waitlist M3" }
              captures: { run1: "$.data.id" }
            - call: "POST /exchange-network/_clock/set_current_utc"
              as: NetworkOperator
              payload: { to_iso8601: "2026-08-04T00:00:00Z" }
          trigger:
            - call: "POST /exchange-network/matching-runs"
              as: NetworkOperator
              payload: { note: "run 2 - sweep the stale hold then rematch" }
              captures: { run2: "$.data.id" }
          assert:
            - "after run 1, GET /exchange-network/exchange-requests/${req2} — status \"MATCHED\", matched_deposit_id \"${dep_m1}\" and matched_hold_expires_at \"2026-08-03T00:00:00Z\"; GET /exchange-network/exchange-requests/${req3} — status \"WAITLISTED\" with matched_deposit_id null"
            - "after run 1, GET /exchange-network/deposits/${dep_m1} — deposit_status \"RESERVED\""
            - "the run 2 response reports expired_request_count 1 and matched_count 1 — one POST, both effects"
            - "GET /exchange-network/exchange-requests/${req2} — status \"EXPIRED\", matched_deposit_id null, matched_hold_expires_at null and charge_refunded_cents 23060"
            - "GET /exchange-network/members/${m2} — wallet_credit_cents back to 80100 and active_request_count 0"
            - "GET /exchange-network/exchange-requests/${req3} — status \"MATCHED\", matched_deposit_id \"${dep_m1}\" and matched_hold_expires_at \"2026-08-06T00:00:00Z\" (48 hours after the run 2 clock)"
            - "GET /exchange-network/deposits/${dep_m1} — deposit_status \"RESERVED\" again, held for M3 this time; it was never left BANKED for a caller to observe"
            - "GET /exchange-network/members/${m3} — wallet_credit_cents still 57040 and active_request_count still 1; a re-match charges nothing further"
            - "run 2 reports lapsed_member_count 0, expired_deposit_count 0, denied_request_count 0, completed_confirmation_count 0 and listed_getaway_count 0 — only steps 2 and 3 did work"

      - name: deposits_list_filter_and_offset_interact_correctly
        claim_type: pagination_semantics
        grounds: ["endpoints[GET /exchange-network/deposits]", "response_envelope.pagination", "entities.Deposit.unit_size"]
        distinguishing_aspect: >-
          total_count must describe the filtered population, not the whole table, and has_more must be
          computed from offset plus the returned page against that filtered total — not from whether the
          page came back full. With four deposits of which three match the filter and a limit of 2, the
          two offsets give has_more true then false while total_count stays 3, which is the combination
          that catches both mistakes at once.
        test_recipe:
          setup: >-
            Tier PLUS, Resort A affiliated with a GOLD band, member M1 on PLUS with dues paid. M1 banks
            four weeks at Resort A: ONE_BR checking in 2027-05-10, 2027-06-15 and 2027-06-25 — each
            worth 82 and each in its own occupancy window — plus one TWO_BR checking in 2027-05-10 worth
            107, which the unit_size filter must exclude even though it shares a check-in date.
          setup_api_calls:
            - call: "POST /exchange-network/membership-tiers"
              as: NetworkOperator
              payload: { tier_code: "PLUS", annual_dues_cents: 19900, base_exchange_fee_cents: 20900, priority_surcharge_cents: 2500, priority_window_days: 365, deposit_first_bonus_pct: 10, max_active_requests: 3, cancellation_fee_cents: 8900, reinstatement_fee_cents: 10900, extension_fee_cents_per_month: 3400 }
              captures: { plus_tier: "$.data.id" }
            - call: "POST /exchange-network/resorts"
              as: NetworkOperator
              payload: { name: "Aspen Ridge Club", region_code: "US-CO", required_annual_deposit_units: 2, initial_quality_rating: "GOLD_CROWN", units_per_size: 2, demand_index: 4 }
              captures: { resort_a: "$.data.id" }
            - call: "POST /exchange-network/season-bands"
              as: NetworkOperator
              payload: { resort_id: "${resort_a}", band_code: "GOLD", start_month_day: "04-01", end_month_day: "06-30" }
            - call: "POST /exchange-network/resorts/${resort_a}/affiliation"
              as: NetworkOperator
              payload: {}
            - call: "POST /exchange-network/members"
              as: NetworkOperator
              payload: { email: "m1@example.com", full_name: "Dana Oyelaran", tier_id: "${plus_tier}" }
              captures: { m1: "$.data.id", m1_v: "$.data.version" }
            - call: "POST /exchange-network/members/${m1}/dues-payments"
              as: Member
              as_user_id: "${m1}"
              payload: { amount_cents: 100000, paid_through_date: "2030-12-31", expected_member_version: "${m1_v}" }
            - call: "POST /exchange-network/deposits"
              as: Member
              as_user_id: "${m1}"
              payload: { member_id: "${m1}", resort_id: "${resort_a}", unit_size: "ONE_BR", check_in_date: "2027-05-10" }
              captures: { d1: "$.data.id" }
            - call: "POST /exchange-network/deposits"
              as: Member
              as_user_id: "${m1}"
              payload: { member_id: "${m1}", resort_id: "${resort_a}", unit_size: "ONE_BR", check_in_date: "2027-06-15" }
              captures: { d2: "$.data.id" }
            - call: "POST /exchange-network/deposits"
              as: Member
              as_user_id: "${m1}"
              payload: { member_id: "${m1}", resort_id: "${resort_a}", unit_size: "ONE_BR", check_in_date: "2027-06-25" }
              captures: { d3: "$.data.id" }
            - call: "POST /exchange-network/deposits"
              as: Member
              as_user_id: "${m1}"
              payload: { member_id: "${m1}", resort_id: "${resort_a}", unit_size: "TWO_BR", check_in_date: "2027-05-10" }
              captures: { d4: "$.data.id" }
          trigger:
            - call: "GET /exchange-network/deposits?unit_size=ONE_BR&limit=2&offset=0"
              as: NetworkOperator
              payload: {}
            - call: "GET /exchange-network/deposits?unit_size=ONE_BR&limit=2&offset=1"
              as: NetworkOperator
              payload: {}
            - call: "GET /exchange-network/deposits?unit_size=ONE_BR&deposit_status=RESERVED"
              as: NetworkOperator
              payload: {}
          assert:
            - "all four deposits were accepted; the three ONE_BR weeks each report awarded_power 82 and the TWO_BR reports 107"
            - "call 1 — HTTP 200 with pagination.total_count == 3 (not 4), limit 2, offset 0, has_more true, and exactly 2 rows in data"
            - "call 2 — pagination.total_count == 3, limit 2, offset 1, has_more false, and exactly 2 rows in data; the page is full yet has_more is false because offset 1 plus 2 rows already covers the filtered total"
            - "the union of the ids across calls 1 and 2 is exactly {${d1}, ${d2}, ${d3}} and ${d4} appears in neither"
            - "call 3, filtering on two dimensions at once — pagination.total_count == 0 with data an empty list and has_more false; no deposit has been reserved"
            - "GET /exchange-network/deposits with no filter — pagination.total_count == 4, so the filter is what narrowed the total"

      - name: processing_fee_band_boundary_at_subtotal_fifteen_thousand
        claim_type: rate_threshold_triggers
        grounds: ["calculations.exchange_charge.constants[PROCESSING_FEE_BANDS]", "calculations.exchange_charge.band_selection_is_normative", "entities.ExchangeRequest.quoted_charge_cents"]
        distinguishing_aspect: >-
          The processing-fee bands are keyed on the pre-credit subtotal with inclusive upper bounds, so
          one extra cent of base fee at 15000 moves the fee from 1200 to 2000 — an 800-cent step for a
          one-cent input change. Crucially the deposit-first credit is applied AFTER the band is chosen:
          the 15000 subtotal nets to 14250 after its 750-cent credit, which would fall back into the
          1200 band if the server keyed the band on the post-credit amount, so that mistake produces
          15450 for both members instead of two different totals.
        test_recipe:
          setup: >-
            Two tiers differing by one cent of base fee: BASIC with base_exchange_fee_cents 14999 and
            PLUS with 15000, both with annual_dues_cents 0, priority_surcharge_cents 0,
            deposit_first_bonus_pct 10 and max_active_requests 3, so the subtotal is the base fee alone.
            Resort A (units_per_size 2) affiliated with a GOLD band. One member per tier pays 100000
            with nothing withheld, so both wallets start at 100000, and each banks a ONE_BR week
            checking in 2027-06-15 worth 82, giving power_budget floor(82 * 110 / 100) = 90. Both then
            file a DEPOSIT_FIRST request for a ONE_BR at Resort A pinned to the single day 2027-06-15,
            so required_power_estimate is 82 and power_gap is 0.
          setup_api_calls:
            - call: "POST /exchange-network/membership-tiers"
              as: NetworkOperator
              payload: { tier_code: "BASIC", annual_dues_cents: 0, base_exchange_fee_cents: 14999, priority_surcharge_cents: 0, priority_window_days: 365, deposit_first_bonus_pct: 10, max_active_requests: 3, cancellation_fee_cents: 0, reinstatement_fee_cents: 0, extension_fee_cents_per_month: 0 }
              captures: { basic_tier: "$.data.id" }
            - call: "POST /exchange-network/membership-tiers"
              as: NetworkOperator
              payload: { tier_code: "PLUS", annual_dues_cents: 0, base_exchange_fee_cents: 15000, priority_surcharge_cents: 0, priority_window_days: 365, deposit_first_bonus_pct: 10, max_active_requests: 3, cancellation_fee_cents: 0, reinstatement_fee_cents: 0, extension_fee_cents_per_month: 0 }
              captures: { plus_tier: "$.data.id" }
            - call: "POST /exchange-network/resorts"
              as: NetworkOperator
              payload: { name: "Aspen Ridge Club", region_code: "US-CO", required_annual_deposit_units: 2, initial_quality_rating: "GOLD_CROWN", units_per_size: 2, demand_index: 4 }
              captures: { resort_a: "$.data.id" }
            - call: "POST /exchange-network/season-bands"
              as: NetworkOperator
              payload: { resort_id: "${resort_a}", band_code: "GOLD", start_month_day: "04-01", end_month_day: "06-30" }
            - call: "POST /exchange-network/resorts/${resort_a}/affiliation"
              as: NetworkOperator
              payload: {}
            - call: "POST /exchange-network/members"
              as: NetworkOperator
              payload: { email: "under@example.com", full_name: "Yara Mbeki", tier_id: "${basic_tier}" }
              captures: { m_under: "$.data.id", m_under_v: "$.data.version" }
            - call: "POST /exchange-network/members/${m_under}/dues-payments"
              as: Member
              as_user_id: "${m_under}"
              payload: { amount_cents: 100000, paid_through_date: "2030-12-31", expected_member_version: "${m_under_v}" }
            - call: "POST /exchange-network/deposits"
              as: Member
              as_user_id: "${m_under}"
              payload: { member_id: "${m_under}", resort_id: "${resort_a}", unit_size: "ONE_BR", check_in_date: "2027-06-15" }
              captures: { dep_under: "$.data.id" }
            - call: "POST /exchange-network/members"
              as: NetworkOperator
              payload: { email: "over@example.com", full_name: "Piotr Sandoval", tier_id: "${plus_tier}" }
              captures: { m_over: "$.data.id", m_over_v: "$.data.version" }
            - call: "POST /exchange-network/members/${m_over}/dues-payments"
              as: Member
              as_user_id: "${m_over}"
              payload: { amount_cents: 100000, paid_through_date: "2030-12-31", expected_member_version: "${m_over_v}" }
            - call: "POST /exchange-network/deposits"
              as: Member
              as_user_id: "${m_over}"
              payload: { member_id: "${m_over}", resort_id: "${resort_a}", unit_size: "ONE_BR", check_in_date: "2027-06-15" }
              captures: { dep_over: "$.data.id" }
          trigger:
            - call: "POST /exchange-network/exchange-requests"
              as: Member
              as_user_id: "${m_under}"
              payload: { member_id: "${m_under}", requested_resort_id: "${resort_a}", requested_unit_size: "ONE_BR", window_start_date: "2027-06-15", window_end_date: "2027-06-15", deposit_id: "${dep_under}" }
              captures: { req_under: "$.data.id" }
            - call: "POST /exchange-network/exchange-requests"
              as: Member
              as_user_id: "${m_over}"
              payload: { member_id: "${m_over}", requested_resort_id: "${resort_a}", requested_unit_size: "ONE_BR", window_start_date: "2027-06-15", window_end_date: "2027-06-15", deposit_id: "${dep_over}" }
              captures: { req_over: "$.data.id" }
          assert:
            - "both requests report power_budget 90, required_power_estimate 82, power_gap 0 and funding_mode \"DEPOSIT_FIRST\""
            - "req_under: quoted_charge_cents == 15450 — subtotal 14999, credit floor(14999*5/100) = 749, processing fee 1200 because 14999 <= 14999"
            - "req_over: quoted_charge_cents == 16250 — subtotal 15000, credit floor(15000*5/100) = 750, processing fee 2000 because 15000 > 14999"
            - "the one-cent difference in base fee costs 800 cents more in total, and the post-credit amount of the second request (14250) would have selected the 1200 fee — so a server keying the band on the net amount cannot produce 16250"
            - "GET /exchange-network/members/${m_under} — wallet_credit_cents == 84550; GET /exchange-network/members/${m_over} — wallet_credit_cents == 83750"
            - "GET /exchange-network/ledger-entries?entry_type=EXCHANGE_CHARGE — total_count == 2 with cash_delta_cents -15450 and -16250"

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: deposit_creation_response_already_reflects_the_power_credit
        claim_type: read_your_write
        grounds: ["consistency_model", "endpoints[POST /exchange-network/deposits]", "calculations.deposit_trading_power", "invariants[INV_POWER]", "entities.Resort.deposits_committed_count"]
        distinguishing_aspect: >-
          The consistency model is fully synchronous: there is no queue, no eventual reconciliation and
          no deferred valuation job. A single deposit write must therefore land its own valuation, the
          owner's power balance, the resort's inventory counters and the ledger row all inside the 201,
          with every subsequent read agreeing immediately and no matching run needed to settle
          anything. An implementation that defers valuation or counter maintenance to the next run is
          only detectable by reading everything straight after the write.
        test_recipe:
          setup: >-
            Tier PLUS, Resort A affiliated with a GOLD band, member M1 on PLUS with dues 100000 paid
            through 2030-12-31 leaving wallet 80100, trading_power_balance 0 and the resort reporting
            deposits_committed_count 0 and committed_nights 0.
          setup_api_calls:
            - call: "POST /exchange-network/membership-tiers"
              as: NetworkOperator
              payload: { tier_code: "PLUS", annual_dues_cents: 19900, base_exchange_fee_cents: 20900, priority_surcharge_cents: 2500, priority_window_days: 365, deposit_first_bonus_pct: 10, max_active_requests: 3, cancellation_fee_cents: 8900, reinstatement_fee_cents: 10900, extension_fee_cents_per_month: 3400 }
              captures: { plus_tier: "$.data.id" }
            - call: "POST /exchange-network/resorts"
              as: NetworkOperator
              payload: { name: "Aspen Ridge Club", region_code: "US-CO", required_annual_deposit_units: 2, initial_quality_rating: "GOLD_CROWN", units_per_size: 2, demand_index: 4 }
              captures: { resort_a: "$.data.id" }
            - call: "POST /exchange-network/season-bands"
              as: NetworkOperator
              payload: { resort_id: "${resort_a}", band_code: "GOLD", start_month_day: "04-01", end_month_day: "06-30" }
            - call: "POST /exchange-network/resorts/${resort_a}/affiliation"
              as: NetworkOperator
              payload: {}
            - call: "POST /exchange-network/members"
              as: NetworkOperator
              payload: { email: "m1@example.com", full_name: "Dana Oyelaran", tier_id: "${plus_tier}" }
              captures: { m1: "$.data.id", m1_v: "$.data.version" }
            - call: "POST /exchange-network/members/${m1}/dues-payments"
              as: Member
              as_user_id: "${m1}"
              payload: { amount_cents: 100000, paid_through_date: "2030-12-31", expected_member_version: "${m1_v}" }
          trigger:
            - call: "POST /exchange-network/deposits"
              as: Member
              as_user_id: "${m1}"
              payload: { member_id: "${m1}", resort_id: "${resort_a}", unit_size: "ONE_BR", check_in_date: "2027-06-15" }
              captures: { dep1: "$.data.id" }
          assert:
            - "the 201 body itself already carries awarded_power 82, remaining_power 82, season_band_code \"GOLD\", deposit_status \"BANKED\", rental_status \"NOT_LISTED\" and expires_at \"2029-06-14T00:00:00Z\" — nothing is null pending a later pass"
            - "GET /exchange-network/deposits/${dep1} immediately afterwards returns exactly the same field values as the 201 body"
            - "GET /exchange-network/members/${m1} immediately afterwards — trading_power_balance == 82; the owner's rollup is not deferred"
            - "GET /exchange-network/resorts/${resort_a} immediately afterwards — deposits_committed_count == 1 and committed_nights == 8"
            - "GET /exchange-network/ledger-entries?member_id=${m1}&entry_type=DEPOSIT_CREDIT — total_count == 1 with power_delta 82 and cash_delta_cents 0"
            - "GET /exchange-network/deposits/${dep1}/valuation — awarded_unit_size_base 45, awarded_season_multiplier \"1.25\", awarded_demand_multiplier \"1.10\", awarded_quality_bonus 6, awarded_lead_time_days 318 and awarded_power 82, all present without any run having been triggered"
            - "GET /exchange-network/matching-runs — pagination.total_count == 0, proving none of the above required a run"
