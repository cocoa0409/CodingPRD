            - "ProductionLineAudit.${audit_b_id}.required_sample_size == 2 and failure_rate == 0.5000 with status == FAILED and failure_reason == FAILURE_RATE_EXCEEDED"
            - "after audit B, CertificationFamily.${fam_id}.status == AUDIT_HOLD and cumulative_audit_failures == 1"
            - "both audits reported max_measured_emission_g_per_kwh 5.60, which is below the 5.63 limit (certified 5.12 * 1.10), so EMISSION_LIMIT_EXCEEDED never applies"

      - name: allocatable_pool_boundary_zero_versus_one_released_unit
        grounds:
          - validations[priority=62]
          - calculations.channel_allocation_waterfall
          - errors[ERR_NO_ALLOCATABLE_UNITS]
          - entities.BuildOrder.fields.built_quantity
        distinguishing_aspect: |
          A third metric (the size of the allocatable released pool) at a third endpoint
          (POST /build-orders/{id}/allocations/run): built_quantity 0 is the empty-pool
          boundary and is rejected 422, while built_quantity 1 — the smallest workable
          pool — is allocated in full. The single unit also exercises the waterfall's
          remainder arm, where both floors are 0 and the leftover unit goes to the
          larger fractional part (dealer 0.55 vs mass retail 0.45).
        test_recipe:
          setup:
            - "Canonical prelude with the family CERTIFIED and order bo (planned 6) RELEASED."
            - "Unit SN-0001 is only STAGED, so built_quantity is 0 while staged_quantity is 1."
            - "The order version is read before the rejected allocation attempt and again after the unit is released, because releasing a unit rewrites the order."
          setup_api_calls:
            - *a_clock
            - *a_fam
            - *a_plat
            - *a_dur
            - *a_dur_complete
            - *a_submit
            - *a_certify
            - *a_model
            - *a_safety
            - *a_model_release
            - *a_line
            - *a_sup_carb
            - *a_lot_carb
            - *a_inspect_carb_clean
            - *a_sup_ign
            - *a_lot_ign
            - *a_inspect_ign_clean
            - *a_sup_cast
            - *a_lot_cast
            - *a_inspect_cast_clean
            - *a_mrun
            - *a_mrun_close
            - *a_bo
            - *a_bo_release
            - *a_u1_stage
            - call: "GET /build-orders/${bo_id}"
              payload: {}
              as: ProductionPlanner
              captures: { bo_v_empty: $.data.version }
          trigger:
            - call: "POST /build-orders/${bo_id}/allocations/run"
              payload: { expected_build_order_version: "${bo_v_empty}" }
              as: ProductionPlanner
            - *a_u1_torque
            - *a_u1_hot
            - *a_u1_release
            - call: "GET /build-orders/${bo_id}"
              payload: {}
              as: ProductionPlanner
              captures: { bo_v_one: $.data.version }
            - call: "POST /build-orders/${bo_id}/allocations/run"
              payload: { expected_build_order_version: "${bo_v_one}" }
              as: ProductionPlanner
          assert:
            - "the first allocation attempt returns 422 with error_id ERR_NO_ALLOCATABLE_UNITS (built_quantity 0 is below the pool floor of 1)"
            - "after the rejected attempt BuildOrder.${bo_id}.allocation_status == UNALLOCATED and allocation_run_at == null and unallocated_units == 0"
            - "the second allocation attempt succeeds with BuildOrder.${bo_id}.allocated_dealer_units == 1, allocated_mass_retail_units == 0, unallocated_units == 0"
            - "BuildOrder.${bo_id}.allocation_status == ALLOCATED and allocation_run_at == 2026-08-03T08:00:00Z"
            - "the remainder arm is the deciding step: dealer raw 1 * 0.55 = 0.55 -> floor 0, mass retail raw 0.45 -> floor 0, and the single remainder unit goes to the larger fractional part (dealer)"

      - name: torque_reading_inclusive_band_edges
        grounds:
          - calculations.torque_conformance
          - state_machines.EngineUnit.STAGED_to_ASSEMBLED
          - entities.EngineUnit.fields.out_of_spec_fastener_count
          - entities.EnginePlatform.fields.torque_tolerance_pct
        distinguishing_aspect: |
          A fourth metric (individual torque readings against the derived band) at a
          fourth endpoint (POST /engine-units/{id}/torque-record). The band is computed
          as 22.0 Nm +/- 5% = [20.90, 23.10] and both edges are INCLUSIVE: a unit whose
          readings sit exactly on 20.90 and 23.10 counts 0 out-of-spec fasteners, while
          the neighbouring unit at 20.89 and 23.11 counts exactly 2 — isolating the
          comparison operators from the rounding of the band itself.
        test_recipe:
          setup:
            - "Canonical prelude with the family CERTIFIED, order bo (planned 6) RELEASED and two STAGED units SN-0001 and SN-0002."
            - "Platform 208SS has torque_spec_nm 22.0, torque_tolerance_pct 0.05 and required_fastener_count 4."
          setup_api_calls:
            - *a_clock
            - *a_fam
            - *a_plat
            - *a_dur
            - *a_dur_complete
            - *a_submit
            - *a_certify
            - *a_model
            - *a_safety
            - *a_model_release
            - *a_line
            - *a_sup_carb
            - *a_lot_carb
            - *a_inspect_carb_clean
            - *a_sup_ign
            - *a_lot_ign
            - *a_inspect_ign_clean
            - *a_sup_cast
            - *a_lot_cast
            - *a_inspect_cast_clean
            - *a_mrun
            - *a_mrun_close
            - *a_bo
            - *a_bo_release
            - *a_u1_stage
            - *a_u2_stage
          trigger:
            - call: "POST /engine-units/${u1_id}/torque-record"
              payload: { torque_readings: [{ station: 1, torque_nm: 20.90 }, { station: 2, torque_nm: 23.10 }, { station: 3, torque_nm: 22.0 }, { station: 4, torque_nm: 22.0 }] }
              as: QualityEngineer
              as_user_id: "qe-mika"
            - call: "POST /engine-units/${u2_id}/torque-record"
              payload: { torque_readings: [{ station: 1, torque_nm: 20.89 }, { station: 2, torque_nm: 23.11 }, { station: 3, torque_nm: 22.0 }, { station: 4, torque_nm: 22.0 }] }
              as: QualityEngineer
              as_user_id: "qe-mika"
          assert:
            - "EngineUnit.${u1_id}.torque_lower_bound_nm == 20.90 and torque_upper_bound_nm == 23.10"
            - "EngineUnit.${u1_id}.out_of_spec_fastener_count == 0, build_state == ASSEMBLED, conformance_state == PENDING"
            - "EngineUnit.${u2_id}.out_of_spec_fastener_count == 2, build_state == ASSEMBLED, conformance_state == NONCONFORMING"
            - "the 0.01 Nm steps on either side of each edge are the only difference between the two units, so both comparisons are proven inclusive"
            - "BuildOrder.${bo_id}.staged_quantity == 2 and built_quantity == 0 (a torque record moves no unit out of the staged pool)"

  # ===========================================================================
  # Rule 7 — cross-entity state dependency over three different entity pairs
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: build_order_release_gated_by_engine_platform_posture
        grounds:
          - validations[priority=43]
          - calculations.platform_certification_posture
          - state_machines.BuildOrder.PLANNED_to_RELEASED
          - state_machines.CertificationFamily.SUBMITTED_to_CERTIFIED
        distinguishing_aspect: |
          Entity pair BuildOrder -> EnginePlatform. The order is internally flawless
          (PLANNED, RUNNING line, RELEASED model, valid certification) yet its release is
          refused purely because a THIRD entity two hops away — the EnginePlatform whose
          posture projects its family's status — is not OPEN. Nothing about the order
          changes between the failing and the succeeding call; only the family is
          certified in between.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T08:00:00Z; family 2027-EPA-208SS left in DRAFT so platform 208SS reads certification_posture PENDING."
            - "Model WM-21-BBC RELEASED behind a PASSED ANSI_B71_1 certification valid to 2027-07-15; line L1 RUNNING; PRE_SEASON order bo for week 2026-09-14 (span 2, planned 6) in PLANNED."
          setup_api_calls:
            - *a_clock
            - *a_fam
            - *a_plat
            - *a_model
            - *a_safety
            - *a_model_release
            - *a_line
            - *a_bo
          trigger:
            - call: "POST /build-orders/${bo_id}/release"
              payload: {}
              as: ProductionPlanner
            - *a_dur
            - *a_dur_complete
            - *a_submit
            - *a_certify
            - call: "POST /build-orders/${bo_id}/release"
              payload: {}
              as: ProductionPlanner
          assert:
            - "the first release returns 409 with error_id ERR_FAMILY_NOT_CERTIFIED while EnginePlatform.${plat_id}.certification_posture == PENDING"
            - "after the rejection BuildOrder.${bo_id}.status == PLANNED and released_at == null"
            - "after certification EnginePlatform.${plat_id}.certification_posture == OPEN and CertificationFamily.${fam_id}.status == CERTIFIED"
            - "the second, byte-identical release succeeds: BuildOrder.${bo_id}.status == RELEASED with released_at == 2026-08-03T08:00:00Z"
            - "ProductModel.${model_id}.status == RELEASED throughout (model release never consults the posture — only build-order release does)"

      - name: engine_unit_hot_test_gated_by_component_lot_state
        grounds:
          - validations[priority=41]
          - state_machines.ComponentLot.ACCEPTED_to_QUARANTINED
          - state_machines.EngineUnit.conformance_PENDING_to_QUARANTINED
          - state_machines.EngineUnit.ASSEMBLED_to_CANCELLED
        distinguishing_aspect: |
          A different entity pair, EngineUnit -> ComponentLot. The unit passed its own
          torque gate with zero out-of-spec fasteners, but a sibling lot's rejection
          quarantines the lot it was built from, which quarantines the unit, which makes
          its next own-entity transition (hot test) illegal. Cancellation stays legal
          because the cancel path is the only unit transition with no conformance gate.
        test_recipe:
          setup:
            - "Canonical prelude with the family CERTIFIED, order bo RELEASED and unit SN-0001 STAGED from CB-001 and IG-001."
            - "SN-0001 is torque-recorded in band -> build_state ASSEMBLED, conformance_state PENDING, out_of_spec_fastener_count 0."
            - "Lot CB-002 from the same supplier is then inspected with 2 defects -> REJECTED, which puts SUP-CARB on PROBATION and quarantines CB-001 and, through it, SN-0001."
          setup_api_calls:
            - *a_clock
            - *a_fam
            - *a_plat
            - *a_dur
            - *a_dur_complete
            - *a_submit
            - *a_certify
            - *a_model
            - *a_safety
            - *a_model_release
            - *a_line
            - *a_sup_carb
            - *a_lot_carb
            - *a_inspect_carb_clean
            - *a_sup_ign
            - *a_lot_ign
            - *a_inspect_ign_clean
            - *a_sup_cast
            - *a_lot_cast
            - *a_inspect_cast_clean
            - *a_mrun
            - *a_mrun_close
            - *a_bo
            - *a_bo_release
            - *a_u1_stage
            - *a_u1_torque
            - *a_lot_carb2
            - *a_inspect_carb2_reject
          trigger:
            - *a_u1_hot
            - call: "POST /engine-units/${u1_id}/cancel"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-mika"
          assert:
            - "the hot test returns 409 with error_id ERR_UNIT_NONCONFORMING even though the unit's own torque result was clean (out_of_spec_fastener_count == 0)"
            - "at the moment of that rejection EngineUnit.${u1_id}.build_state == ASSEMBLED and conformance_state == QUARANTINED and hot_test_emission_threshold == null"
            - "ComponentLot.${lot_carb_id}.status == QUARANTINED and ComponentLot.${lot_carb2_id}.status == REJECTED"
            - "ComponentLot.${lot_ign_id}.status == ACCEPTED — the ignition lot is fine, yet the unit is still blocked"
            - "the cancel succeeds: EngineUnit.${u1_id}.build_state == CANCELLED, and ComponentLot.${lot_carb_id} returns to consumed_qty 0 / remaining_qty 800 while ComponentLot.${lot_ign_id} returns to consumed_qty 0 / remaining_qty 800"
            - "BuildOrder.${bo_id}.staged_quantity == 0 and built_quantity == 0"

      - name: parts_request_gated_by_service_part_status
        grounds:
          - validations[priority=29]
          - state_machines.ServicePart.ACTIVE_to_SUPERSEDED
          - state_machines.PartsFulfillmentRequest.initial_FILLED
          - errors[ERR_PART_STATE_INVALID]
        distinguishing_aspect: |
          A third entity pair, PartsFulfillmentRequest -> ServicePart. Here the parent's
          status governs whether the child may be CREATED at all (rather than whether an
          existing child may advance): the identical request body is accepted while the
          part is ACTIVE, refused once it is SUPERSEDED even though that part still holds
          stock, and accepted again when re-pointed at the ACTIVE successor.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T08:00:00Z; family 2027-EPA-208SS with platform 208SS."
            - "Part PN-CARB-KIT-1 ACTIVE with on_hand_qty 3 (dealer lead 2 days) and its future successor PN-CARB-KIT-2 ACTIVE with on_hand_qty 5."
            - "Dealer request A for 1 piece is FILLED against PN-CARB-KIT-1, leaving on_hand_qty 2."
          setup_api_calls:
            - *a_clock
            - *a_fam
            - *a_plat
            - call: "POST /service-parts"
              payload: { engine_platform_id: "${plat_id}", part_number: "PN-CARB-KIT-1", category: "CARBURETOR_KIT", on_hand_qty: 3, committed_availability_years: 10, last_production_year: 2027, dealer_lead_time_days: 2, mass_retail_lead_time_days: 5 }
              as: PlantAdmin
              captures: { part_x_id: $.data.id }
            - call: "POST /service-parts"
              payload: { engine_platform_id: "${plat_id}", part_number: "PN-CARB-KIT-2", category: "CARBURETOR_KIT", on_hand_qty: 5, committed_availability_years: 10, last_production_year: 2027, dealer_lead_time_days: 2, mass_retail_lead_time_days: 5 }
              as: PlantAdmin
              captures: { part_y_id: $.data.id }
            - call: "POST /parts-requests"
              payload: { service_part_id: "${part_x_id}", requested_quantity: 1, channel: "DEALER" }
              as: ChannelPartner
              as_user_id: "cp-dealer-77"
              captures: { req_x1_id: $.data.id }
          trigger:
            - call: "POST /service-parts/${part_x_id}/supersede"
              payload: { successor_part_id: "${part_y_id}" }
              as: PlantAdmin
            - call: "POST /parts-requests"
              payload: { service_part_id: "${part_x_id}", requested_quantity: 1, channel: "DEALER" }
              as: ChannelPartner
              as_user_id: "cp-dealer-77"
            - call: "POST /parts-requests"
              payload: { service_part_id: "${part_y_id}", requested_quantity: 2, channel: "DEALER" }
              as: ChannelPartner
              as_user_id: "cp-dealer-77"
              captures: { req_y1_id: $.data.id }
          assert:
            - "PartsFulfillmentRequest.${req_x1_id}.status == FILLED with promised_ship_date == 2026-08-05 and shipped_from_part_id == ${part_x_id}"
            - "the second request returns 409 with error_id ERR_PART_STATE_INVALID because ServicePart.${part_x_id}.status == SUPERSEDED"
            - "ServicePart.${part_x_id}.on_hand_qty == 2 — the refusal is purely a status decision, not a stock-out"
            - "the third request, differing only in service_part_id, is accepted: PartsFulfillmentRequest.${req_y1_id}.status == FILLED with promised_ship_date == 2026-08-05"
            - "ServicePart.${part_y_id}.on_hand_qty == 3 and filled_request_count == 1 and fill_rate_pct == 100.00"
            - "ServicePart.${part_x_id}.filled_request_count == 1 and backordered_request_count == 0 (the rejected request is not recorded anywhere)"

  # ===========================================================================
  # Rule 8 — resource / temporal overlap under two different interval
  #          geometries on two different resource entities
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: platform_durability_windows_half_open_instants
        grounds:
          - validations[priority=50]
          - errors[ERR_PLATFORM_TEST_WINDOW_OVERLAP]
          - concurrency_rules[durability-create-stale-family]
          - state_machines.CertificationFamily.DURABILITY_TESTING_to_DURABILITY_TESTING
        distinguishing_aspect: |
          Resource = EnginePlatform, geometry = HALF-OPEN instant windows
          [scheduled_start_at, scheduled_end_at) tested PAIRWISE for exclusivity, so a
          window that starts exactly when another ends is legal while a window that
          intrudes by 24 hours is not. Each accepted run also bumps the family version,
          so the second and third creates must re-read it — the version arithmetic and
          the interval arithmetic are exercised by the same sequence.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T08:00:00Z; family 2027-EPA-208SS in DRAFT with platform 208SS."
            - "Run D1 scheduled over [2026-08-03T09:00:00Z, 2026-08-24T09:00:00Z), which moves the family to DURABILITY_TESTING and its version to 2."
          setup_api_calls:
            - *a_clock
            - *a_fam
            - *a_plat
            - *a_dur
          trigger:
            - call: "GET /certification-families/${fam_id}"
              payload: {}
              as: CertificationEngineer
              captures: { fam_v_after_d1: $.data.version }
            - call: "POST /durability-tests"
              payload: { certification_family_id: "${fam_id}", engine_platform_id: "${plat_id}", scheduled_start_at: "2026-08-24T09:00:00Z", scheduled_end_at: "2026-09-14T09:00:00Z", target_hours: 500, initial_emission_g_per_kwh: 5.00, expected_certification_family_version: "${fam_v_after_d1}" }
              as: CertificationEngineer
              as_user_id: "ce-hana"
              captures: { dur_d2_id: $.data.id }
            - call: "GET /certification-families/${fam_id}"
              payload: {}
              as: CertificationEngineer
              captures: { fam_v_after_d2: $.data.version }
            - call: "POST /durability-tests"
              payload: { certification_family_id: "${fam_id}", engine_platform_id: "${plat_id}", scheduled_start_at: "2026-08-23T09:00:00Z", scheduled_end_at: "2026-09-01T09:00:00Z", target_hours: 500, initial_emission_g_per_kwh: 5.00, expected_certification_family_version: "${fam_v_after_d2}" }
              as: CertificationEngineer
              as_user_id: "ce-hana"
          assert:
            - "D2 is accepted: DurabilityTestRun.${dur_d2_id}.status == SCHEDULED — its start instant equals D1's end instant, and touching windows do not overlap under half-open semantics"
            - "the third create returns 409 with error_id ERR_PLATFORM_TEST_WINDOW_OVERLAP: [2026-08-23T09:00:00Z, 2026-09-01T09:00:00Z) intrudes 24 hours into D1 and 8 days into D2"
            - "CertificationFamily.${fam_id}.status == DURABILITY_TESTING carrying exactly two SCHEDULED runs"
            - "GET /durability-tests?engine_platform_id=${plat_id} returns total_count == 2"
            - "the rejected create did not increment CertificationFamily.${fam_id}.version, so ${fam_v_after_d2} is still current"

      - name: assembly_line_week_capacity_inclusive_week_sets
        grounds:
          - validations[priority=59]
          - errors[ERR_LINE_CAPACITY_EXCEEDED]
          - entities.AssemblyLine.fields.weekly_capacity_units
          - entities.BuildOrder.fields.week_span
        distinguishing_aspect: |
          A different resource entity (AssemblyLine) under a different geometry: an
          INCLUSIVE set of discrete production weeks where overlap is not forbidden but
          AGGREGATED — each order contributes ceil(planned_quantity / week_span) to every
          week it occupies, and the sum per week must stay within the cap. Order X sits
          exactly at the cap in two weeks, a 2-unit order in a shared week tips it over,
          and an identical 500-unit order in a free week is admitted.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T08:00:00Z; family 2027-EPA-208SS in DRAFT (creation of build orders never consults the posture); model WM-21-BBC RELEASED behind a valid ANSI_B71_1 certification."
            - "Line L1 RUNNING with weekly_capacity_units 500 and changeover_gap_weeks 1, supporting WALK_MOWER and SNOW_THROWER."
            - "Order X: PRE_SEASON, week 2026-09-14, week_span 2, planned_quantity 1000 -> ceil(1000 / 2) = 500 in each of the weeks 2026-09-14 and 2026-09-21, exactly at the cap."
          setup_api_calls:
            - *a_clock
            - *a_fam
            - *a_plat
            - *a_model
            - *a_safety
            - *a_model_release
            - *a_line
            - call: "POST /build-orders"
              payload: { product_model_id: "${model_id}", assembly_line_id: "${line_id}", season: "PRE_SEASON", production_week: "2026-09-14", week_span: 2, planned_quantity: 1000 }
              as: ProductionPlanner
              captures: { bo_x_id: $.data.id }
          trigger:
            - call: "POST /build-orders"
              payload: { product_model_id: "${model_id}", assembly_line_id: "${line_id}", season: "PRE_SEASON", production_week: "2026-09-21", week_span: 1, planned_quantity: 2 }
              as: ProductionPlanner
            - call: "POST /build-orders"
              payload: { product_model_id: "${model_id}", assembly_line_id: "${line_id}", season: "PRE_SEASON", production_week: "2026-09-28", week_span: 1, planned_quantity: 500 }
              as: ProductionPlanner
              captures: { bo_z_id: $.data.id }
          assert:
            - "BuildOrder.${bo_x_id} exists in PLANNED with week_span 2 and planned_quantity 1000, occupying the inclusive week set {2026-09-14, 2026-09-21} at 500 units each"
            - "the 2-unit order is rejected 409 with error_id ERR_LINE_CAPACITY_EXCEEDED because week 2026-09-21 would carry 500 + ceil(2 / 1) = 502 > 500"
            - "no ERR_LINE_CHANGEOVER_CONFLICT is raised for that order — both orders are WALK_MOWER, so the changeover rule (which only fires across DIFFERENT product lines) is silent and the capacity rule is the sole violation"
            - "BuildOrder.${bo_z_id} is accepted in PLANNED: week 2026-09-28 is unoccupied, so 500 units land exactly at the cap"
            - "GET /build-orders?assembly_line_id=${line_id} returns total_count == 2"

  # ===========================================================================
  # Rule 9 — compensating invariants over two different conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: component_lot_piece_conservation_across_stage_and_cancel
        grounds:
          - entities.ComponentLot.fields.accepted_qty
          - entities.ComponentLot.fields.consumed_qty
          - entities.ComponentLot.fields.remaining_qty
          - state_machines.EngineUnit.STAGED_to_CANCELLED
          - calculations.lot_consumption_ledger
        distinguishing_aspect: |
          Conserved quantity #1 — component PIECES:
          accepted_qty == consumed_qty + remaining_qty must hold for every lot before and
          after the compensation. Staging a unit draws one piece from each of two lots and
          cancelling it returns both, so the identity is checked at 800 == 1 + 799 and
          again at 800 == 0 + 800 with no drift and no double-return.
        test_recipe:
          setup:
            - "Canonical prelude with the family CERTIFIED, order bo (planned 6) RELEASED and lots CB-001 / IG-001 ACCEPTED with accepted_qty 800 each."
            - "Unit SN-0001 staged from CB-001 and IG-001."
          setup_api_calls:
            - *a_clock
            - *a_fam
            - *a_plat
            - *a_dur
            - *a_dur_complete
            - *a_submit
            - *a_certify
            - *a_model
            - *a_safety
            - *a_model_release
            - *a_line
            - *a_sup_carb
            - *a_lot_carb
            - *a_inspect_carb_clean
            - *a_sup_ign
            - *a_lot_ign
            - *a_inspect_ign_clean
            - *a_sup_cast
            - *a_lot_cast
            - *a_inspect_cast_clean
            - *a_mrun
            - *a_mrun_close
            - *a_bo
            - *a_bo_release
            - *a_u1_stage
          trigger:
            - call: "POST /engine-units/${u1_id}/cancel"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-mika"
          assert:
            - "before the cancel: ComponentLot.${lot_carb_id}.accepted_qty == 800, consumed_qty == 1, remaining_qty == 799 (800 == 1 + 799)"
            - "after the cancel: ComponentLot.${lot_carb_id}.accepted_qty == 800, consumed_qty == 0, remaining_qty == 800 (800 == 0 + 800)"
            - "after the cancel: ComponentLot.${lot_ign_id}.accepted_qty == 800, consumed_qty == 0, remaining_qty == 800"
            - "EngineUnit.${u1_id}.build_state == CANCELLED with conformance_state PENDING and rework_count 0"
            - "BuildOrder.${bo_id}.staged_quantity == 0 and built_quantity == 0 and status == IN_PRODUCTION (the order does not fall back to RELEASED)"
            - "ComponentLot.${lot_cast_id}.consumed_qty is unchanged by the cancel (casting pieces are drawn by the machining run, not by the unit)"

      - name: build_order_unit_conservation_across_allocation_and_reset
        grounds:
          - entities.BuildOrder.fields.allocated_dealer_units
          - entities.BuildOrder.fields.allocated_mass_retail_units
          - entities.BuildOrder.fields.unallocated_units
          - calculations.channel_allocation_waterfall
          - state_machines.BuildOrder.allocation_ALLOCATED_to_UNALLOCATED
        distinguishing_aspect: |
          Conserved quantity #2 — released UNITS, a completely different ledger from
          instance 1's pieces:
          built_quantity == allocated_dealer_units + allocated_mass_retail_units +
          unallocated_units. The waterfall splits three units 2 / 1 / 0 and the reset
          collapses them to 0 / 0 / 3; the total is invariant while the buckets are not,
          and the compensation clears allocation_run_at without touching a single
          EngineUnit.
        test_recipe:
          setup:
            - "Canonical prelude with the family CERTIFIED and order bo (planned 6) holding three RELEASED units SN-0001..SN-0003 -> built_quantity 3."
            - "An allocation run against the freshly read order version splits the pool with dealer_share_pct 0.55 and caps 500 / 500: dealer floor(1.65) = 1, mass retail floor(1.35) = 1, remainder 1 to the larger fractional part (dealer 0.65 > 0.35) -> 2 / 1 / 0."
          setup_api_calls:
            - *a_clock
            - *a_fam
            - *a_plat
            - *a_dur
            - *a_dur_complete
            - *a_submit
            - *a_certify
            - *a_model
            - *a_safety
            - *a_model_release
            - *a_line
            - *a_sup_carb
            - *a_lot_carb
            - *a_inspect_carb_clean
            - *a_sup_ign
            - *a_lot_ign
            - *a_inspect_ign_clean
            - *a_sup_cast
            - *a_lot_cast
            - *a_inspect_cast_clean
            - *a_mrun
            - *a_mrun_close
            - *a_bo
            - *a_bo_release
            - *a_u1_stage
            - *a_u1_torque
            - *a_u1_hot
            - *a_u1_release
            - *a_u2_stage
            - *a_u2_torque
            - *a_u2_hot
            - *a_u2_release
            - *a_u3_stage
            - *a_u3_torque
            - *a_u3_hot
            - *a_u3_release
            - *a_bo_version_read
            - *a_alloc_run
          trigger:
            - call: "POST /build-orders/${bo_id}/allocations/reset"
              payload: {}
              as: ProductionPlanner
          assert:
            - "before the reset: BuildOrder.${bo_id}.built_quantity == 3 with allocated_dealer_units == 2, allocated_mass_retail_units == 1, unallocated_units == 0 (3 == 2 + 1 + 0) and allocation_status == ALLOCATED"
            - "after the reset: BuildOrder.${bo_id}.built_quantity == 3 with allocated_dealer_units == 0, allocated_mass_retail_units == 0, unallocated_units == 3 (3 == 0 + 0 + 3)"
            - "BuildOrder.${bo_id}.allocation_status == UNALLOCATED and allocation_run_at == null"
            - "EngineUnit.${u1_id}.build_state == RELEASED, EngineUnit.${u2_id}.build_state == RELEASED, EngineUnit.${u3_id}.build_state == RELEASED — the reset moves no unit"
            - "BuildOrder.${bo_id}.status == IN_PRODUCTION and planned_quantity == 6 (three of six built)"
