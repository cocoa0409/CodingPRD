            - { call: "POST /api/members", payload: { committee_id: "${comm_ab}", full_name: "AB2", email: "ab2@u.edu", service_start: "2026-01-01", service_end: "2026-12-31" }, as: ProvostOfficer, captures: { abm2: $.data.id } }
