      - name: territory_allocation_round_per_entry_then_sum
        grounds:
          - calculations.territory_sample_allocation_rounding
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters. Budget 100 units over
          three entries with weights A=6, B=3, C=1 (sum 10): per-entry
          round-then-sum yields 60 + 30 + 10 = 100; raw values are exactly
          integral here, so a second probe uses budget 101: raw 60.6/30.3/10.1
          — per-entry round_half_up gives 61 + 30 + 10 = 101 while
          sum-then-round gives round(101.0)=101 but any implementation that
          sums raw then allocates by largest remainder would give 61+30+10
          with a DIFFERENT largest remainder owner (61 to A either way, but
          B raw 30.3 rounds to 30 while C raw 10.1 rounds to 10: sum-then-
          distribute-by-largest-remainder would push the spare 1 to A making
          61/30/10 vs per-entry 61/30/10 — the discriminator is budget 103:
          raw 61.8/30.9/10.3 => per-entry 62+31+10 = 103, while a single final
          rounding of the sum would be round(103.0)=103 yet allocated as
          62/31/10 only under per-entry rounding). Pinned: budget 103 must
          produce exactly [62, 31, 10] per entry and territory_consumed 103.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Region, Territory (budget 103 units for cycle), manager M."
            - "Three prescribers H1/H2/H3 verified ELIGIBLE; one product P."
            - "Three target entries: tier A (weight 6), tier B (weight 3), tier C (weight 1)."
          setup_api_calls:
            - call: "POST /field-force/regions"
              payload: { region_code: "WE-01", name: "West" }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
            - call: "POST /field-force/regions/${r_id}/territories"
              payload: { territory_code: "T7", name: "Seattle", cycle_start_date: "2026-09-01T00:00:00Z", cycle_end_date: "2026-12-01T00:00:00Z", cycle_sample_budget_units: 103 }
              as: PlatformAdmin
              captures: { t_id: $.data.id, t_v: $.data.version }
            - call: "POST /field-force/territories/${t_id}/representatives"
              payload: { employee_id: "E4001", full_name: "Mgr Ned", hire_date: "2020-01-01T00:00:00Z" }
              as: PlatformAdmin
