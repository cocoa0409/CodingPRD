scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_client_minimal_required_fields_201
        claim_type: Creation
        grounds: [entities.Client, endpoints]
        distinguishing_aspect: "POST /clients with legal_name+state_code+retainer_tier returns 201 with onboarding_status=LEAD, engagement_status=PROSPECT, catchup_active=false, version=1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /clients"
              payload: { legal_name: "New Co", state_code: "CA", retainer_tier: "ESSENTIALS" }
              as: CFO
              captures: { cid: $.data.id }
          assert:
            - "response status == 201"
            - "Client.${cid}.onboarding_status == LEAD"
            - "Client.${cid}.engagement_status == PROSPECT"
            - "Client.${cid}.catchup_active == false"
            - "Client.${cid}.version == 1"

      - name: create_client_missing_required_retainer_tier_400
        claim_type: Required Fields
        grounds: ["entities.Client.fields.retainer_tier", "validations[priority=18]"]
        distinguishing_aspect: "POST /clients without retainer_tier returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /clients"
              payload: { legal_name: "No Tier Co", state_code: "CA" }
              as: CFO
          assert:
            - "response status == 400"
            - "error_id == ERR_INVALID_REQUEST"

      - name: create_client_invalid_tier_enum_400
        claim_type: Type Constraints
        grounds: ["entities.Client.fields.retainer_tier", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /clients with retainer_tier='PLATINUM' (not in {ESSENTIALS,GROWTH,CFO}) returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /clients"
              payload: { legal_name: "Bad Tier", state_code: "CA", retainer_tier: "PLATINUM" }
              as: CFO
          assert:
            - "response status == 400"
            - "error_id == ERR_INVALID_REQUEST"

      - name: get_client_not_found_404
        claim_type: Not Found
        grounds: ["endpoints", "validations[priority=3]"]
        distinguishing_aspect: "GET /clients/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /clients/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: CFO
          assert:
            - "response status == 404"
            - "error_id == ERR_NOT_FOUND"

      - name: client_covenant_floor_default_zero
        claim_type: Defaults
        grounds: [entities.Client.fields.covenant_floor_cents]
        distinguishing_aspect: "Omitting covenant_floor_cents on POST /clients applies the default 0."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /clients"
              payload: { legal_name: "Default Floor", state_code: "CA", retainer_tier: "GROWTH" }
              as: CFO
              captures: { cid: $.data.id }
          assert:
            - "Client.${cid}.covenant_floor_cents == 0"

      - name: client_included_txn_count_computed_from_tier
        claim_type: Computed Fields
        grounds: [entities.Client.fields.included_txn_count]
        distinguishing_aspect: "GROWTH tier yields included_txn_count=500 (computed; any client-supplied value ignored)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /clients"
              payload: { legal_name: "Growth Co", state_code: "CA", retainer_tier: "GROWTH" }
              as: CFO
              captures: { cid: $.data.id }
          assert:
            - "Client.${cid}.included_txn_count == 500"

      - name: create_close_task_negative_weight_422
        claim_type: Type Constraints
        grounds: ["entities.CloseTask.fields.weight", "errors[ERR_NEGATIVE_AMOUNT]"]
        distinguishing_aspect: "POST /monthly-closes/{id}/close-tasks with weight=0 returns ERR_NEGATIVE_AMOUNT (422)."
        test_recipe:
          setup: ["A client has an OPEN MonthlyClose."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "Wt Co", state_code: "CA", retainer_tier: "ESSENTIALS" }
              as: CFO
              captures: { cid: $.data.id }
            - call: "POST /clients/${cid}/monthly-closes"
              payload: { period_year: 2026, period_month: 1, txn_count: 10 }
              as: Bookkeeper
              captures: { mc: $.data.id }
          trigger:
            - call: "POST /monthly-closes/${mc}/close-tasks"
              payload: { name: "Bad", weight: 0 }
              as: Bookkeeper
          assert:
            - "response status == 422"
            - "error_id == ERR_NEGATIVE_AMOUNT"

      - name: create_monthly_close_bad_month_422
        claim_type: Type Constraints
        grounds: ["entities.MonthlyClose.fields.period_month", "errors[ERR_INVALID_PERIOD]"]
        distinguishing_aspect: "POST /clients/{id}/monthly-closes with period_month=13 returns ERR_INVALID_PERIOD (422)."
        test_recipe:
          setup: ["A client exists."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "Per Co", state_code: "CA", retainer_tier: "ESSENTIALS" }
              as: CFO
              captures: { cid: $.data.id }
          trigger:
            - call: "POST /clients/${cid}/monthly-closes"
              payload: { period_year: 2026, period_month: 13, txn_count: 5 }
              as: Bookkeeper
          assert:
            - "response status == 422"
            - "error_id == ERR_INVALID_PERIOD"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: schedule_kickoff_from_already_scheduled_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Client.LEAD_to_KICKOFF_SCHEDULED]
        distinguishing_aspect: "A client already in KICKOFF_SCHEDULED rejected on a second schedule-kickoff with ERR_INVALID_STATE (409); onboarding_status unchanged."
        test_recipe:
          setup: ["Client is in onboarding_status KICKOFF_SCHEDULED."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "Kick Co", state_code: "CA", retainer_tier: "GROWTH" }
              as: CFO
              captures: { cid: $.data.id }
            - call: "POST /clients/${cid}/schedule-kickoff"
              payload: {}
              as: CFO
          trigger:
            - call: "POST /clients/${cid}/schedule-kickoff"
              payload: {}
              as: CFO
          assert:
            - "response status == 409"
            - "error_id == ERR_INVALID_STATE"

      - name: finalize_close_before_review_approved_invalid_state
        claim_type: Precondition Enforcement
        grounds: [state_machines.MonthlyClose.READY_FOR_REVIEW_to_FINALIZED]
        distinguishing_aspect: "Finalizing a READY_FOR_REVIEW close whose review_status is UNDER_REVIEW (not APPROVED) returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A MonthlyClose is READY_FOR_REVIEW with review_status UNDER_REVIEW (all tasks DONE, review not yet approved)."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "Fin Co", state_code: "CA", retainer_tier: "GROWTH" }
              as: CFO
              captures: { cid: $.data.id }
            - call: "POST /clients/${cid}/monthly-closes"
              payload: { period_year: 2026, period_month: 2, txn_count: 20 }
              as: Bookkeeper
              captures: { mc: $.data.id }
            - call: "POST /monthly-closes/${mc}/close-tasks"
              payload: { name: "Reconcile", weight: 1 }
              as: Bookkeeper
              captures: { t1: $.data.id }
            - call: "POST /close-tasks/${t1}/transition"
              payload: { to_status: "DONE" }
              as: Bookkeeper
          trigger:
            - call: "POST /monthly-closes/${mc}/finalize"
              payload: {}
              as: CFO
          assert:
            - "response status == 409"
            - "error_id == ERR_INVALID_STATE"

      - name: close_auto_advances_to_ready_for_review_on_full_completion
        claim_type: Valid Transition
        grounds: [state_machines.MonthlyClose.IN_PROGRESS_to_READY_FOR_REVIEW, calculations.close_completion_pct]
        distinguishing_aspect: "When the only CloseTask moves to DONE (completion_pct==100.00) the close auto-transitions OPEN->IN_PROGRESS->READY_FOR_REVIEW and review_status becomes UNDER_REVIEW."
        test_recipe:
          setup: ["A MonthlyClose is OPEN with a single PENDING CloseTask weight 1."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "Auto Co", state_code: "CA", retainer_tier: "GROWTH" }
              as: CFO
              captures: { cid: $.data.id }
            - call: "POST /clients/${cid}/monthly-closes"
              payload: { period_year: 2026, period_month: 3, txn_count: 15 }
              as: Bookkeeper
              captures: { mc: $.data.id }
            - call: "POST /monthly-closes/${mc}/close-tasks"
              payload: { name: "Only", weight: 1 }
              as: Bookkeeper
              captures: { t1: $.data.id }
          trigger:
            - call: "POST /close-tasks/${t1}/transition"
              payload: { to_status: "DONE" }
              as: Bookkeeper
          assert:
            - "MonthlyClose.${mc}.completion_pct == 100.00"
            - "MonthlyClose.${mc}.status == READY_FOR_REVIEW"
            - "MonthlyClose.${mc}.review_status == UNDER_REVIEW"

      - name: close_provisional_vs_final_completion_diverge
        claim_type: Side Effect Execution
        grounds: [calculations.close_completion_pct, entities.MonthlyClose.fields.provisional_completion_pct]
        distinguishing_aspect: "With one DONE (weight 1) and one IN_REVIEW (weight 1) task, provisional_completion_pct==100.00 while completion_pct==50.00."
        test_recipe:
          setup: ["A MonthlyClose has two tasks each weight 1; one will be DONE and one IN_REVIEW."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "Prov Co", state_code: "CA", retainer_tier: "GROWTH" }
              as: CFO
              captures: { cid: $.data.id }
            - call: "POST /clients/${cid}/monthly-closes"
              payload: { period_year: 2026, period_month: 4, txn_count: 12 }
              as: Bookkeeper
              captures: { mc: $.data.id }
            - call: "POST /monthly-closes/${mc}/close-tasks"
              payload: { name: "A", weight: 1 }
              as: Bookkeeper
              captures: { t1: $.data.id }
            - call: "POST /monthly-closes/${mc}/close-tasks"
              payload: { name: "B", weight: 1 }
              as: Bookkeeper
              captures: { t2: $.data.id }
            - call: "POST /close-tasks/${t1}/transition"
              payload: { to_status: "DONE" }
              as: Bookkeeper
          trigger:
            - call: "POST /close-tasks/${t2}/transition"
              payload: { to_status: "IN_REVIEW" }
              as: Bookkeeper
          assert:
            - "MonthlyClose.${mc}.completion_pct == 50.00"
            - "MonthlyClose.${mc}.provisional_completion_pct == 100.00"

      - name: close_task_invalid_to_status_422
        claim_type: Invalid Transitions
        grounds: ["endpoints", "errors[ERR_INVALID_TASK_STATUS]"]
        distinguishing_aspect: "POST /close-tasks/{id}/transition with to_status='SHIPPED' (not a CloseTask status) returns ERR_INVALID_TASK_STATUS (422)."
        test_recipe:
          setup: ["A MonthlyClose has one PENDING task."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "TS Co", state_code: "CA", retainer_tier: "GROWTH" }
              as: CFO
              captures: { cid: $.data.id }
            - call: "POST /clients/${cid}/monthly-closes"
              payload: { period_year: 2026, period_month: 5, txn_count: 10 }
              as: Bookkeeper
              captures: { mc: $.data.id }
            - call: "POST /monthly-closes/${mc}/close-tasks"
              payload: { name: "X", weight: 1 }
              as: Bookkeeper
              captures: { t1: $.data.id }
          trigger:
            - call: "POST /close-tasks/${t1}/transition"
              payload: { to_status: "SHIPPED" }
              as: Bookkeeper
          assert:
            - "response status == 422"
            - "error_id == ERR_INVALID_TASK_STATUS"

      - name: terminal_offboarded_blocks_further_engagement_transitions
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Client.terminal_states, state_machines.Client.ACTIVE_to_PAUSED]
        distinguishing_aspect: "An OFFBOARDED client cannot be paused; pause-engagement returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A fully onboarded client is OFFBOARDED with no open closes and no catch-up."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "Off Co", state_code: "CA", retainer_tier: "GROWTH" }
              as: CFO
              captures: { cid: $.data.id }
            - call: "POST /clients/${cid}/schedule-kickoff"
              payload: {}
              as: CFO
            - call: "POST /clients/${cid}/start-ledger-setup"
              payload: {}
              as: Bookkeeper
            - call: "POST /clients/${cid}/ledger-accounts"
              payload: { account_code: "1000", account_type: "ASSET", name: "Cash" }
              as: Bookkeeper
              captures: { la: $.data.id }
            - call: "POST /clients/${cid}/complete-onboarding"
              payload: {}
              as: CFO
            - call: "POST /clients/${cid}/activate-engagement"
              payload: {}
              as: CFO
            - call: "POST /clients/${cid}/offboard"
              payload: {}
              as: CFO
          trigger:
            - call: "POST /clients/${cid}/pause-engagement"
              payload: {}
              as: CFO
          assert:
            - "response status == 409"
            - "error_id == ERR_INVALID_STATE"

      - name: ap_bill_dispute_resolve_round_trip
        claim_type: Valid Transition
        grounds: [state_machines.ARInvoice.DISPUTED_to_OPEN]
        distinguishing_aspect: "An OPEN AR invoice disputed then resolved returns to status OPEN."
        test_recipe:
          setup: ["A client has one OPEN AR invoice."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "Disp Co", state_code: "CA", retainer_tier: "GROWTH" }
              as: CFO
              captures: { cid: $.data.id }
            - call: "POST /clients/${cid}/ar-invoices"
              payload: { counterparty_name: "C", amount_cents: 100000, issue_date: "2026-03-01T00:00:00Z", due_date: "2026-03-31T00:00:00Z" }
              as: Bookkeeper
              captures: { ar: $.data.id }
            - call: "POST /ar-invoices/${ar}/dispute"
              payload: {}
              as: ClientContact
              as_user_id: "${cid}"
          trigger:
            - call: "POST /ar-invoices/${ar}/resolve-dispute"
              payload: {}
              as: Bookkeeper
          assert:
            - "ARInvoice.${ar}.status == OPEN"

      - name: catchup_invalid_from_draft_to_start_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.CatchupProject.SCOPED_to_IN_PROGRESS]
        distinguishing_aspect: "Starting a DRAFT (not SCOPED) CatchupProject returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A CatchupProject is in DRAFT (never scoped)."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "Draft Co", state_code: "CA", retainer_tier: "GROWTH" }
              as: CFO
              captures: { cid: $.data.id }
            - call: "POST /clients/${cid}/catchup-projects"
              payload: { months_behind: 2, quoted_fee_cents: 200000 }
              as: CFO
              captures: { cp: $.data.id }
          trigger:
            - call: "POST /catchup-projects/${cp}/start"
              payload: {}
              as: Bookkeeper
          assert:
            - "response status == 409"
            - "error_id == ERR_INVALID_STATE"

  # ===========================================================================
  - section: calculations
    instances:
      - name: forecast_chronological_running_balance_min
        claim_type: Correct Result
        grounds: [calculations.cash_flow_projection, entities.CashFlowForecast.fields.ending_balance_cents, entities.CashFlowForecast.fields.min_projected_balance_cents]
        distinguishing_aspect: "Opening 1000000 with OUTFLOW 1200000 (04-05), INFLOW 800000 (04-10), OUTFLOW 300000 (04-20), INFLOW 1500000 (04-25) yields ending_balance_cents=1800000 and min_projected_balance_cents=-200000, processed in effective_date order."
        test_recipe:
          setup: ["A DRAFT forecast opens at 1000000 with four out-of-order-created but date-ordered lines."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "FC Co", state_code: "CA", retainer_tier: "CFO" }
              as: CFO
              captures: { cid: $.data.id }
            - call: "POST /clients/${cid}/forecasts"
              payload: { opening_balance_cents: 1000000 }
              as: CFO
              captures: { f: $.data.id }
            - call: "POST /forecasts/${f}/lines"
              payload: { effective_date: "2026-04-25T00:00:00Z", direction: "INFLOW", amount_cents: 1500000 }
              as: CFO
            - call: "POST /forecasts/${f}/lines"
              payload: { effective_date: "2026-04-05T00:00:00Z", direction: "OUTFLOW", amount_cents: 1200000 }
              as: CFO
            - call: "POST /forecasts/${f}/lines"
              payload: { effective_date: "2026-04-20T00:00:00Z", direction: "OUTFLOW", amount_cents: 300000 }
              as: CFO
          trigger:
            - call: "POST /forecasts/${f}/lines"
              payload: { effective_date: "2026-04-10T00:00:00Z", direction: "INFLOW", amount_cents: 800000 }
              as: CFO
          assert:
            - "CashFlowForecast.${f}.ending_balance_cents == 1800000"
            - "CashFlowForecast.${f}.min_projected_balance_cents == -200000"

      - name: ar_payment_exact_total_marks_paid
        claim_type: Correct Result
        grounds: [state_machines.ARInvoice.OPEN_to_PAID, entities.ARInvoice.fields.paid_amount_cents]
        distinguishing_aspect: "Recording a payment exactly equal to amount_cents (100000) sets paid_amount_cents=100000 and status=PAID."
        test_recipe:
          setup: ["A client has one OPEN AR invoice of 100000."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "Pay Co", state_code: "CA", retainer_tier: "GROWTH" }
              as: CFO
              captures: { cid: $.data.id }
            - call: "POST /clients/${cid}/ar-invoices"
              payload: { counterparty_name: "C", amount_cents: 100000, issue_date: "2026-03-01T00:00:00Z", due_date: "2026-03-31T00:00:00Z" }
              as: Bookkeeper
              captures: { ar: $.data.id }
          trigger:
            - call: "POST /ar-invoices/${ar}/record-payment"
              payload: { payment_cents: 100000 }
              as: Bookkeeper
          assert:
            - "ARInvoice.${ar}.paid_amount_cents == 100000"
            - "ARInvoice.${ar}.status == PAID"

      - name: ar_payment_underpayment_rejected
        claim_type: Violation to Error
        grounds: ["validations[priority=15]", "errors[ERR_UNDERPAYMENT]"]
        distinguishing_aspect: "A payment of 99999 against a 100000 invoice returns ERR_UNDERPAYMENT (422); the invoice stays OPEN."
        test_recipe:
          setup: ["A client has one OPEN AR invoice of 100000."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "Under Co", state_code: "CA", retainer_tier: "GROWTH" }
              as: CFO
              captures: { cid: $.data.id }
            - call: "POST /clients/${cid}/ar-invoices"
              payload: { counterparty_name: "C", amount_cents: 100000, issue_date: "2026-03-01T00:00:00Z", due_date: "2026-03-31T00:00:00Z" }
              as: Bookkeeper
              captures: { ar: $.data.id }
          trigger:
            - call: "POST /ar-invoices/${ar}/record-payment"
              payload: { payment_cents: 99999 }
              as: Bookkeeper
          assert:
            - "response status == 422"
            - "error_id == ERR_UNDERPAYMENT"
            - "ARInvoice.${ar}.status == OPEN"

      - name: retainer_overage_only_growth_above_included
        claim_type: Correct Result
        grounds: [calculations.retainer_invoice_amount]
        distinguishing_aspect: "GROWTH tier, 650 txns, no catch-up yields base 300000 + overage 9000 + surcharge 0 = total 309000."
        test_recipe:
          setup: ["GROWTH client, no catch-up, MonthlyClose txn_count 650."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "Ov Co", state_code: "CA", retainer_tier: "GROWTH" }
              as: CFO
              captures: { cid: $.data.id }
            - call: "POST /clients/${cid}/monthly-closes"
              payload: { period_year: 2026, period_month: 6, txn_count: 650 }
              as: Bookkeeper
              captures: { mc: $.data.id }
            - call: "GET /clients/${cid}"
              payload: {}
              as: CFO
              captures: { cver: $.data.version }
          trigger:
            - call: "POST /clients/${cid}/retainer-invoices"
              payload: { monthly_close_id: "${mc}", expected_client_version: "${cver}" }
              as: CFO
              captures: { inv: $.data.id }
          assert:
            - "RetainerInvoice.${inv}.base_fee_cents == 300000"
            - "RetainerInvoice.${inv}.overage_cents == 9000"
            - "RetainerInvoice.${inv}.surcharge_cents == 0"
            - "RetainerInvoice.${inv}.total_cents == 309000"

  # ===========================================================================
  - section: validations
    instances:
      - name: activate_engagement_before_onboarded_409
        claim_type: Violation to Error
        grounds: ["validations[priority=5]", "errors[ERR_ONBOARDING_INCOMPLETE]"]
        distinguishing_aspect: "activate-engagement on a PROSPECT client whose onboarding_status is still LEAD returns ERR_ONBOARDING_INCOMPLETE (409)."
        test_recipe:
          setup: ["A brand-new client (onboarding_status LEAD, engagement_status PROSPECT)."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "Early Co", state_code: "CA", retainer_tier: "GROWTH" }
              as: CFO
              captures: { cid: $.data.id }
          trigger:
            - call: "POST /clients/${cid}/activate-engagement"
              payload: {}
              as: CFO
          assert:
            - "response status == 409"
            - "error_id == ERR_ONBOARDING_INCOMPLETE"

      - name: offboard_with_open_close_409
        claim_type: Cross-entity validation
        grounds: ["validations[priority=6]", "errors[ERR_OPEN_CLOSES_EXIST]", "entities.Client.fields.open_close_count"]
        distinguishing_aspect: "offboard on an ACTIVE client with one non-FINALIZED MonthlyClose (open_close_count==1) returns ERR_OPEN_CLOSES_EXIST (409)."
        test_recipe:
          setup: ["A fully onboarded ACTIVE client has one OPEN MonthlyClose (open_close_count==1)."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "OpenC Co", state_code: "CA", retainer_tier: "GROWTH" }
              as: CFO
              captures: { cid: $.data.id }
            - call: "POST /clients/${cid}/schedule-kickoff"
              payload: {}
              as: CFO
            - call: "POST /clients/${cid}/start-ledger-setup"
              payload: {}
              as: Bookkeeper
            - call: "POST /clients/${cid}/ledger-accounts"
              payload: { account_code: "1000", account_type: "ASSET", name: "Cash" }
              as: Bookkeeper
              captures: { la: $.data.id }
            - call: "POST /clients/${cid}/complete-onboarding"
              payload: {}
              as: CFO
            - call: "POST /clients/${cid}/activate-engagement"
              payload: {}
              as: CFO
            - call: "POST /clients/${cid}/monthly-closes"
              payload: { period_year: 2026, period_month: 1, txn_count: 10 }
              as: Bookkeeper
              captures: { mc: $.data.id }
          trigger:
