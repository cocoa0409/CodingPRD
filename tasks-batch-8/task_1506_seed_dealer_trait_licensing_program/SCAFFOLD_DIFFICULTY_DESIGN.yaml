  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (2 instances, different interval semantics)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: plot_field_occupancy_half_open_overlap_adjacency_allowed
        grounds:
          - validations[priority=11]
          - state_machines.PlotTrial
          - entities.PlotTrial.fields.planting_date
          - entities.PlotTrial.fields.expected_harvest_date
        distinguishing_aspect: |
          Interval semantics: half-open pairwise occupancy [planting_date,
          expected_harvest_date) on the Field resource. Interior overlap
          (2027-05-01..2027-09-01 inside 2027-04-15..2027-10-01) is rejected;
          exact adjacency (start == other's end) is NOT an overlap and succeeds.
          Different resource and semantics from the daily-capacity instance.
        test_recipe:
          setup:
            - "Program OPEN; field North 40; variety SOY-V2 LISTED"
            - "Plot A on the field occupies [2027-04-15, 2027-10-01) and is PLANTED"
          setup_api_calls:
            - call: "POST /dealer/programs"
              payload: { name: "2027 Seed Program", crop_year: 2027, early_order_tiers: [{cutoff_at: "2027-01-15T23:59:59Z", discount_bps: 600}], prepay_tiers: [{pay_by: "2026-12-20T23:59:59Z", discount_bps: 800}], return_window_end: "2027-06-30T23:59:59Z", return_restocking_bps: 1000, returns_untreated_only: true, replant_claim_window_days: 21, replant_replacement_discount_bps: 10000, daily_delivery_capacity_units: 100000, delivery_window_start: "2027-03-01T00:00:00Z", delivery_window_end: "2027-05-31T23:59:59Z", sales_close_at: "2027-03-15T23:59:59Z", commission_base_bps: 500, min_plot_replications: 2 }
              as: DealerAdmin
              captures: { prog: $.data.id }
            - call: "POST /dealer/programs/${prog}/open"
              as: DealerAdmin
            - call: "POST /dealer/growers"
              payload: { account_name: "Smith Farms", external_ref: "EXT-001", credit_limit_cents: 100000000 }
              as: SalesRep
              captures: { g: $.data.id }
            - call: "POST /dealer/fields"
              payload: { grower_id: "${g}", name: "North 40", acres: 100, soil_type: "LOAM", drainage: "WELL", irrigated: true, prev_crop: "SOYBEAN", maturity_zone: 11 }
              as: SalesRep
              captures: { f: $.data.id }
            - call: "POST /dealer/varieties"
              payload: { sku: "SOY-V2", crop: "SOYBEAN", relative_maturity_days: 118, base_price_cents_per_unit: 18000, seeds_per_unit: 140000, preferred_soils: ["CLAY", "LOAM"], min_drainage: "POOR" }
              as: DealerAdmin
              captures: { v2: $.data.id }
            - call: "POST /dealer/plot-trials"
              payload: { program_id: "${prog}", variety_id: "${v2}", field_id: "${f}", planting_date: "2027-04-15T00:00:00Z", expected_harvest_date: "2027-10-01T00:00:00Z", replication_index: 1 }
              as: Agronomist
              captures: { pa: $.data.id }
            - call: "POST /dealer/plot-trials/${pa}/record_planting"
              as: Agronomist
          trigger:
            - call: "POST /dealer/plot-trials"
              payload: { program_id: "${prog}", variety_id: "${v2}", field_id: "${f}", planting_date: "2027-05-01T00:00:00Z", expected_harvest_date: "2027-09-01T00:00:00Z", replication_index: 2 }
              as: Agronomist
              captures: { err: $.data.error_id }
            - call: "POST /dealer/plot-trials"
              payload: { program_id: "${prog}", variety_id: "${v2}", field_id: "${f}", planting_date: "2027-10-01T00:00:00Z", expected_harvest_date: "2028-04-15T00:00:00Z", replication_index: 2 }
              as: Agronomist
              captures: { pc_st: $.data.status }
          assert:
            - "interior overlap rejected: error_id == ERR_PLOT_WINDOW_OVERLAP"
            - "adjacent interval [2027-10-01, 2028-04-15) accepted: status == PLANNED (half-open semantics: a.end == c.start is not an overlap)"

      - name: delivery_daily_capacity_aggregate_boundary
        grounds:
          - calculations.daily_delivery_load
          - validations[priority=11]
          - entities.DeliveryTicket.fields.scheduled_date
        distinguishing_aspect: |
          Interval semantics: aggregate capacity over a closed UTC calendar date on the
          program's logistics resource — NOT pairwise interval overlap. Loads 60 then 40
          on the same date reach exactly 100 (== capacity, allowed); one more unit the
          same date is rejected, while the same unit on the next date succeeds.
        test_recipe:
          setup:
            - "Program with daily_delivery_capacity_units 100, OPEN; grower G; SOY-V2; lot 10000 units"
            - "Orders o1 (60 units), o2 (40 units), o3 (10 units) all CONFIRMED"
          setup_api_calls:
            - call: "POST /dealer/programs"
              payload: { name: "2027 Seed Program", crop_year: 2027, early_order_tiers: [{cutoff_at: "2027-01-15T23:59:59Z", discount_bps: 600}], prepay_tiers: [{pay_by: "2026-12-20T23:59:59Z", discount_bps: 800}], return_window_end: "2027-06-30T23:59:59Z", return_restocking_bps: 1000, returns_untreated_only: true, replant_claim_window_days: 21, replant_replacement_discount_bps: 10000, daily_delivery_capacity_units: 100, delivery_window_start: "2027-03-01T00:00:00Z", delivery_window_end: "2027-05-31T23:59:59Z", sales_close_at: "2027-03-15T23:59:59Z", commission_base_bps: 500, min_plot_replications: 2 }
              as: DealerAdmin
              captures: { prog: $.data.id }
            - call: "POST /dealer/programs/${prog}/open"
              as: DealerAdmin
            - call: "POST /dealer/growers"
              payload: { account_name: "Smith Farms", external_ref: "EXT-001", credit_limit_cents: 100000000 }
              as: SalesRep
              captures: { g: $.data.id }
            - call: "POST /dealer/varieties"
              payload: { sku: "SOY-V2", crop: "SOYBEAN", relative_maturity_days: 118, base_price_cents_per_unit: 18000, seeds_per_unit: 140000, preferred_soils: ["CLAY", "LOAM"], min_drainage: "POOR" }
              as: DealerAdmin
              captures: { v2: $.data.id }
            - call: "POST /dealer/inventory-lots"
              payload: { variety_id: "${v2}", warehouse_code: "WH1", received_units: 10000, expiry_date: "2027-12-31T00:00:00Z" }
              as: DealerAdmin
            - call: "POST /dealer/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-10T00:00:00Z" }
              as: DealerAdmin
            - call: "POST /dealer/orders"
              payload: { grower_id: "${g}", program_id: "${prog}" }
              as: SalesRep
              captures: { o1: $.data.id }
            - call: "POST /dealer/orders/${o1}/lines"
              payload: { variety_id: "${v2}", units: 60 }
              as: SalesRep
              captures: { ln1: $.data.id }
            - call: "POST /dealer/orders/${o1}/confirm"
              as: SalesRep
            - call: "POST /dealer/orders"
              payload: { grower_id: "${g}", program_id: "${prog}" }
              as: SalesRep
              captures: { o2: $.data.id }
            - call: "POST /dealer/orders/${o2}/lines"
              payload: { variety_id: "${v2}", units: 40 }
              as: SalesRep
              captures: { ln2: $.data.id }
            - call: "POST /dealer/orders/${o2}/confirm"
              as: SalesRep
            - call: "POST /dealer/orders"
              payload: { grower_id: "${g}", program_id: "${prog}" }
              as: SalesRep
              captures: { o3: $.data.id }
            - call: "POST /dealer/orders/${o3}/lines"
              payload: { variety_id: "${v2}", units: 10 }
              as: SalesRep
              captures: { ln3: $.data.id }
            - call: "POST /dealer/orders/${o3}/confirm"
              as: SalesRep
          trigger:
            - call: "POST /dealer/delivery-tickets"
              payload: { order_id: "${o1}", order_line_id: "${ln1}", type: "DELIVERY", scheduled_date: "2027-04-10T00:00:00Z", units: 60 }
              as: SalesRep
              captures: { t1: $.data.id, t1_st: $.data.status }
            - call: "POST /dealer/delivery-tickets"
              payload: { order_id: "${o2}", order_line_id: "${ln2}", type: "DELIVERY", scheduled_date: "2027-04-10T00:00:00Z", units: 40 }
              as: SalesRep
              captures: { t2_st: $.data.status }
            - call: "POST /dealer/delivery-tickets"
              payload: { order_id: "${o3}", order_line_id: "${ln3}", type: "PICKUP", scheduled_date: "2027-04-10T00:00:00Z", units: 1 }
              as: SalesRep
              captures: { err: $.data.error_id }
            - call: "POST /dealer/delivery-tickets"
              payload: { order_id: "${o3}", order_line_id: "${ln3}", type: "PICKUP", scheduled_date: "2027-04-11T00:00:00Z", units: 1 }
              as: SalesRep
              captures: { t4_st: $.data.status }
          assert:
            - "ticket 1 (60 units): status == SCHEDULED (load 60 <= 100)"
            - "ticket 2 (40 units): status == SCHEDULED (load exactly 100 == capacity: inclusive boundary)"
            - "ticket 3 (1 unit same date): error_id == ERR_DELIVERY_CAPACITY_EXCEEDED (101 > 100)"
            - "same unit on 2027-04-11: status == SCHEDULED (per-date aggregate resets)"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant (2 instances, different conserved quantities)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: lot_seed_units_conserved_through_reserve_deliver_return
        grounds:
          - calculations.grower_balances
          - state_machines.DeliveryTicket.SCHEDULED_to_COMPLETED
          - state_machines.SeedReturn.APPROVED_to_RECEIVED
          - entities.InventoryLot.fields.on_hand_units
        distinguishing_aspect: |
          Conserved quantity: PHYSICAL SEED UNITS per lot —
          received_units + returned_units == on_hand_units + delivered_units + written_off_units.
          Verified after the forward action (reserve+deliver) and after the compensating
          action (return restock): 500+0 == 460+40+0, then 500+10 == 470+40+0.
        test_recipe:
          setup:
            - "Program (capacity 100000) OPEN; grower G; SOY-V2; lot L received 500 units, expiry 2027-12-31"
            - "Order of 100 units CONFIRMED (reserved 100 on L)"
          setup_api_calls:
            - call: "POST /dealer/programs"
              payload: { name: "2027 Seed Program", crop_year: 2027, early_order_tiers: [{cutoff_at: "2027-01-15T23:59:59Z", discount_bps: 600}], prepay_tiers: [{pay_by: "2026-12-20T23:59:59Z", discount_bps: 800}], return_window_end: "2027-06-30T23:59:59Z", return_restocking_bps: 1000, returns_untreated_only: true, replant_claim_window_days: 21, replant_replacement_discount_bps: 10000, daily_delivery_capacity_units: 100000, delivery_window_start: "2027-03-01T00:00:00Z", delivery_window_end: "2027-05-31T23:59:59Z", sales_close_at: "2027-03-15T23:59:59Z", commission_base_bps: 500, min_plot_replications: 2 }
              as: DealerAdmin
              captures: { prog: $.data.id }
            - call: "POST /dealer/programs/${prog}/open"
              as: DealerAdmin
            - call: "POST /dealer/growers"
              payload: { account_name: "Smith Farms", external_ref: "EXT-001", credit_limit_cents: 100000000 }
              as: SalesRep
              captures: { g: $.data.id }
            - call: "POST /dealer/varieties"
              payload: { sku: "SOY-V2", crop: "SOYBEAN", relative_maturity_days: 118, base_price_cents_per_unit: 18000, seeds_per_unit: 140000, preferred_soils: ["CLAY", "LOAM"], min_drainage: "POOR" }
              as: DealerAdmin
              captures: { v2: $.data.id }
            - call: "POST /dealer/inventory-lots"
              payload: { variety_id: "${v2}", warehouse_code: "WH1", received_units: 500, expiry_date: "2027-12-31T00:00:00Z" }
              as: DealerAdmin
              captures: { lot: $.data.id }
            - call: "POST /dealer/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-10T00:00:00Z" }
              as: DealerAdmin
            - call: "POST /dealer/orders"
              payload: { grower_id: "${g}", program_id: "${prog}" }
              as: SalesRep
              captures: { o: $.data.id }
            - call: "POST /dealer/orders/${o}/lines"
              payload: { variety_id: "${v2}", units: 100 }
              as: SalesRep
              captures: { ln: $.data.id }
            - call: "POST /dealer/orders/${o}/confirm"
              as: SalesRep
          trigger:
            - call: "GET /dealer/inventory-lots/${lot}"
              as: DealerAdmin
              captures: { oh1: $.data.on_hand_units, res1: $.data.reserved_units, del1: $.data.delivered_units, ret1: $.data.returned_units }
            - call: "POST /dealer/delivery-tickets"
              payload: { order_id: "${o}", order_line_id: "${ln}", type: "DELIVERY", scheduled_date: "2027-04-10T00:00:00Z", units: 40 }
              as: SalesRep
              captures: { t: $.data.id }
            - call: "POST /dealer/_clock/set_current_utc"
              payload: { to_iso8601: "2027-04-10T12:00:00Z" }
              as: DealerAdmin
            - call: "POST /dealer/delivery-tickets/${t}/complete"
              as: SalesRep
            - call: "GET /dealer/inventory-lots/${lot}"
              as: DealerAdmin
              captures: { oh2: $.data.on_hand_units, res2: $.data.reserved_units, del2: $.data.delivered_units }
            - call: "POST /dealer/returns"
              payload: { order_id: "${o}", order_line_id: "${ln}", units: 10, reason: "OVERSTOCK" }
              as: SalesRep
              captures: { r: $.data.id }
            - call: "POST /dealer/returns/${r}/approve"
              as: DealerAdmin
            - call: "POST /dealer/returns/${r}/receive"
              as: DealerAdmin
            - call: "GET /dealer/inventory-lots/${lot}"
              as: DealerAdmin
              captures: { oh3: $.data.on_hand_units, res3: $.data.reserved_units, del3: $.data.delivered_units, ret3: $.data.returned_units }
          assert:
            - "after confirm: on_hand 500, reserved 100, delivered 0, returned 0 -> 500 + 0 == 500 + 0 + 0"
            - "after delivering 40: on_hand 460, reserved 60, delivered 40 -> 500 + 0 == 460 + 40 + 0"
            - "after receiving 10 returned: on_hand 470, delivered 40, returned 10 -> 500 + 10 == 470 + 40 + 0"
            - "written_off_units == 0 throughout (lot unexpired)"

      - name: prepay_ledger_conserved_through_prepay_refund_reprepay_settle
        grounds:
          - calculations.grower_balances
          - calculations.prepay_settlement
          - state_machines.SeedOrder.UNPAID_to_PREPAID
          - state_machines.SeedOrder.PREPAID_to_UNPAID
          - state_machines.SeedOrder.PREPAID_to_SETTLED
        distinguishing_aspect: |
          Conserved quantity: MONEY in the grower prepay ledger —
          prepay_balance_cents == sum(prepays) - sum(refunds) - sum(settle applications).
          Forward (prepay 582912) + compensating (refund 582912) + re-apply + settle
          leaves the balance at exactly 0 with no drift. Distinct quantity from the
          seed-units invariant.
        test_recipe:
          setup:
            - "Program (standard tiers incl. prepay 800bps by 2026-12-20, capacity 1000) OPEN; grower G; SOY-V2; lot 1000"
            - "Order of 40 units confirmed 2026-09-15 (1200bps -> per-unit 15840, gross 633600, rebate 0)"
          setup_api_calls:
            - call: "POST /dealer/programs"
              payload: { name: "2027 Seed Program", crop_year: 2027, early_order_tiers: [{cutoff_at: "2026-09-30T23:59:59Z", discount_bps: 1200}, {cutoff_at: "2026-11-15T23:59:59Z", discount_bps: 1000}, {cutoff_at: "2027-01-15T23:59:59Z", discount_bps: 600}], prepay_tiers: [{pay_by: "2026-12-20T23:59:59Z", discount_bps: 800}, {pay_by: "2027-02-15T23:59:59Z", discount_bps: 500}], volume_rebate_tiers: [{min_units: 500, rebate_bps: 500}], return_window_end: "2027-06-30T23:59:59Z", return_restocking_bps: 1000, returns_untreated_only: true, replant_claim_window_days: 21, replant_replacement_discount_bps: 10000, daily_delivery_capacity_units: 1000, delivery_window_start: "2027-03-01T00:00:00Z", delivery_window_end: "2027-05-31T23:59:59Z", sales_close_at: "2027-03-15T23:59:59Z", commission_base_bps: 500, commission_volume_tiers: [{min_net_units: 1000, bonus_bps: 100}], min_plot_replications: 2 }
              as: DealerAdmin
              captures: { prog: $.data.id }
            - call: "POST /dealer/programs/${prog}/open"
              as: DealerAdmin
            - call: "POST /dealer/growers"
              payload: { account_name: "Smith Farms", external_ref: "EXT-001", credit_limit_cents: 100000000 }
              as: SalesRep
              captures: { g: $.data.id }
            - call: "POST /dealer/varieties"
              payload: { sku: "SOY-V2", crop: "SOYBEAN", relative_maturity_days: 118, base_price_cents_per_unit: 18000, seeds_per_unit: 140000, preferred_soils: ["CLAY", "LOAM"], min_drainage: "POOR" }
              as: DealerAdmin
              captures: { v2: $.data.id }
            - call: "POST /dealer/inventory-lots"
              payload: { variety_id: "${v2}", warehouse_code: "WH1", received_units: 1000, expiry_date: "2027-12-31T00:00:00Z" }
              as: DealerAdmin
            - call: "POST /dealer/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: DealerAdmin
            - call: "POST /dealer/orders"
              payload: { grower_id: "${g}", program_id: "${prog}" }
              as: SalesRep
              captures: { o: $.data.id }
            - call: "POST /dealer/orders/${o}/lines"
              payload: { variety_id: "${v2}", units: 40 }
              as: SalesRep
            - call: "POST /dealer/orders/${o}/confirm"
              as: SalesRep
              captures: { net0: $.data.net_amount_cents }
            - call: "POST /dealer/_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-01T00:00:00Z" }
              as: DealerAdmin
          trigger:
            - call: "POST /dealer/orders/${o}/prepay"
              payload: { amount_cents: 582912 }
              as: SalesRep
            - call: "GET /dealer/growers/${g}"
              as: DealerAdmin
              captures: { pb1: $.data.prepay_balance_cents }
            - call: "POST /dealer/growers/${g}/refund_prepay"
              payload: { order_id: "${o}" }
              as: DealerAdmin
              captures: { pb2: $.data.prepay_balance_cents }
            - call: "GET /dealer/orders/${o}"
              as: SalesRep
              captures: { pay2: $.data.payment_status, net2: $.data.net_amount_cents, disc2: $.data.prepay_discount_cents }
            - call: "POST /dealer/orders/${o}/prepay"
              payload: { amount_cents: 582912 }
              as: SalesRep
              captures: { pay3: $.data.payment_status }
            - call: "GET /dealer/growers/${g}"
              as: DealerAdmin
              captures: { pb3: $.data.prepay_balance_cents }
            - call: "POST /dealer/_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-20T00:00:00Z" }
              as: DealerAdmin
            - call: "POST /dealer/programs/${prog}/close_sales"
