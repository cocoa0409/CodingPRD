            - { call: "POST /advisory/delivery-tickets/${tk_over}/confirm", as: CommodityAdvisor, captures: { err: $.data.error_id } }
            - { call: "GET /advisory/sales-contracts/${c1}", as: CommodityAdvisor, captures: { c1_fs: $.data.fulfillment_status, c1_del: $.data.delivered_bushels } }
          assert:
            - "Ticket with net_bushels == 10200.000 == floor(10000*1.02) confirms: status CONFIRMED, contract DELIVERED with delivered_bushels == 10200"
            - "Ticket with net 10201 (one bushel past tolerance) rejected with ERR_OVER_DELIVERY_EXCEEDED"
      - name: performance_report_empty_priced_set_nulls
        grounds:
          - calculations.performance_benchmark
          - "endpoints: GET /advisory/operations/{operationId}/performance-report"
        distinguishing_aspect: |
          Metric = empty-collection edge (zero priced contracts), via
          GET /advisory/operations/{id}/performance-report — a different metric and
          endpoint from the sibling's numeric tolerance. The report returns 200 with
          null weighted_avg_sale_price and null outperformance_bps instead of an
          error or a fabricated zero.
