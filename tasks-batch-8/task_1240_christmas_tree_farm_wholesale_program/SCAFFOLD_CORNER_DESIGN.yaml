      - name: survey_supersedes_prior_posted
        claim_type: valid_transition
        grounds: ["state_machines.InventorySurvey.POSTED_to_SUPERSEDED", "concurrency_rules[survey-post-stale-lot]"]
        distinguishing_aspect: "Posting survey B while survey A is POSTED flips A to SUPERSEDED and bumps CropLot.version again (OCC chaining works across two posts)."
        test_recipe:
          setup: ["season; lot H_6_7 300 (lot version 1); survey A posted (lot version 2); survey B drafted"]
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { year: 2026, booking_open_at: "2026-06-01T00:00:00Z", booking_close_at: "2026-08-31T23:59:59Z", harvest_window_start: "2026-11-01", harvest_window_end: "2026-11-25", shipping_window_start: "2026-11-15T00:00:00Z", shipping_window_end: "2026-12-10T23:59:59Z" }, as: Owner, captures: { s: $.data.id } }
