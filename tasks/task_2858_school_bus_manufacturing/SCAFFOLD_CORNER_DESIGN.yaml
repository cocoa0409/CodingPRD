            - call: "POST /dealers/${dealer_nv_id}/legacy-fleet-records"
              payload: { bus_model_id: "${model_c_id}", propulsion_package_id: "${pkg_dsl_id}", spec_profile_id: "${tx_id}", vin: "1TXDSL0000000601", delivered_at: "2026-06-02" }
              as: ContractsAdmin
