# =============================================================================
# Podiatry & Foot-Care Practice — benchmark seed tables (Expert band)
# §1.0–§1.7 only. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml,
# §1.9 in SCAFFOLD_CORNER_DESIGN.yaml.
# Flat topology: single /podiatry prefix, peer collections, FK references in
# bodies, reverse-reachability via filtered list endpoints.
# =============================================================================

scenario: |
  625. Podiatry & Foot-Care Practice: visit & exam, diabetic-foot risk &
  routine-care frequency rules (Medicare), orthotic Rx & lab order/L-code,
  nail/wound procedure, DME (boot/brace) dispensing, imaging & referral,
  prior-auth, recall

domain_name: podiatry-foot-care
api_prefix: /podiatry

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - dual_variant_calculation
    - rate_threshold_triggers
    - cascading_side_effects
    - optimistic_concurrency
    - derived_field_reconciliation
  entity_topology: flat
  # All entities are peer collections under /podiatry; relationships are FK
  # references carried in request bodies, discovered via filtered-list GETs.
  state_machine_shape: branching
  # Encounter: branching with revert (OPEN -> EXAM_DONE -> CODED -> {SUBMITTED -> ADJUDICATED} / VOIDED, CODED -> EXAM_DONE revert)
  # PriorAuthorization: branching (REQUESTED -> {APPROVED, DENIED}; APPROVED -> EXHAUSTED / EXPIRED)
  # OrthoticRx: cyclic (DRAFT -> PENDING_PA -> APPROVED -> DRAFT on payer revision loop)
  relationship_patterns:
    - one_to_many
    - cross_aggregate          # Encounter.provider_id -> Provider; ImagingOrder.modality_id -> Modality
  role_model: peer_roles
  # Podiatrist (clinical authorship, entity_backed:Provider), BillingSpecialist
  # (coding/submission), FrontDesk (scheduling/recall), PayerAgent (prior-auth &
  # adjudication), PracticeAdmin (provisioning + clock). Latter four are opaque.
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — emit verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Practice
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: name, type: string, source: input, description: "Practice name" }
      - { name: npi, type: string, source: input, description: "Group National Provider Identifier (10 digits)" }
      - { name: routine_care_min_interval_days, type: integer, source: input, default: 61, description: "Medicare-style minimum days between covered routine foot-care procedures (>= boundary)" }
      - { name: fee_split_medicare_pct, type: number, source: input, default: 0.80, description: "Fraction of allowed amount paid by payer on covered lines; patient pays remainder" }

  - name: Provider
    parent: null
    common_fields: true
    fields:
      - { name: practice_id, type: string, source: input, description: "FK -> Practice.id" }
      - { name: full_name, type: string, source: input, description: "Provider display name" }
      - { name: role_type, type: enum, source: input, description: "PODIATRIST | NP_PA", constraints: "one of PODIATRIST, NP_PA" }
      - { name: is_active, type: boolean, source: input, default: true, description: "Whether provider accepts new encounters" }

  - name: Modality
    parent: null
    common_fields: true
    fields:
      - { name: practice_id, type: string, source: input, description: "FK -> Practice.id" }
      - { name: name, type: string, source: input, description: "Imaging machine name (e.g., X-Ray Room 1, US Probe A)" }
      - { name: modality_type, type: enum, source: input, description: "XRAY | ULTRASOUND | MRI", constraints: "one of XRAY, ULTRASOUND, MRI" }
      - { name: cleanup_buffer_minutes, type: integer, source: input, default: 15, description: "Mandatory idle gap required after each imaging study before the next may start on this machine" }

  - name: Patient
    parent: null
    common_fields: true
    fields:
      - { name: practice_id, type: string, source: input, description: "FK -> Practice.id" }
      - { name: full_name, type: string, source: input, description: "Patient name" }
      - { name: date_of_birth, type: string, source: input, description: "ISO date (YYYY-MM-DD)" }
      - { name: has_diabetes_mellitus, type: boolean, source: input, default: false, description: "Qualifying systemic condition for routine foot care coverage" }
      - { name: has_loss_protective_sensation, type: boolean, source: input, default: false, description: "LOPS present on monofilament test (risk input)" }
      - { name: has_peripheral_arterial_disease, type: boolean, source: input, default: false, description: "PAD present (risk input)" }
      - { name: has_foot_deformity, type: boolean, source: input, default: false, description: "Structural foot deformity present (risk input)" }
      - { name: has_prior_ulcer_or_amputation, type: boolean, source: input, default: false, description: "History of foot ulcer or lower-extremity amputation (risk input)" }
      - { name: diabetic_foot_risk_category, type: integer, source: computed, default: 0, description: "Derived IWGDF-style category 0..3 from the four risk inputs; see calculations.diabetic_foot_risk_category" }
      - { name: last_covered_routine_care_date, type: string, source: computed, description: "ISO date of the most recent ADJUDICATED encounter line that was a COVERED routine-care procedure; null until first such line. Drives the frequency window." }

  - name: PriorAuthorization
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: service_category, type: enum, source: input, description: "DME | ORTHOTIC | IMAGING", constraints: "one of DME, ORTHOTIC, IMAGING" }
      - { name: hcpcs_code, type: string, source: input, description: "Authorized HCPCS/L-code (e.g., L4360 CAM boot, L3000 custom orthotic)" }
      - { name: authorized_units, type: integer, source: input, description: "Total units the payer authorized (>= 1)" }
      - { name: units_consumed, type: integer, source: computed, default: 0, description: "Running sum of units drawn down by DME dispenses / lab orders against this PA" }
      - { name: remaining_units, type: integer, source: computed, description: "= authorized_units - units_consumed" }
      - { name: valid_from_date, type: string, source: input, description: "ISO date; PA not usable before this date (inclusive)" }
      - { name: valid_through_date, type: string, source: input, description: "ISO date; PA not usable after this date (inclusive)" }
      - { name: status, type: enum, source: system, description: "REQUESTED -> APPROVED | DENIED; APPROVED -> EXHAUSTED (auto when remaining_units==0) | EXPIRED (auto when clock past valid_through_date)" }

  - name: Encounter
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: provider_id, type: string, source: input, description: "FK -> Provider.id; the rendering provider whose schedule this encounter occupies" }
      - { name: scheduled_start, type: datetime, source: input, description: "ISO 8601 UTC appointment start" }
      - { name: scheduled_end, type: datetime, source: input, description: "ISO 8601 UTC appointment end; must be after scheduled_start" }
      - { name: exam_billed_cents, type: integer, source: input, description: "Billed amount for the office visit/exam line (>= 0)" }
      - { name: exam_fee_cap_cents, type: integer, source: input, description: "Fee-schedule allowed cap for the exam line (>= 0)" }
      - { name: exam_coverage_decision, type: enum, source: computed, default: PENDING, description: "PENDING | COVERED; the exam is always COVERED at coding time (informational visit), set when coded" }
      - { name: total_medicare_pays_cents, type: integer, source: computed, default: 0, description: "Sum of payer portions across exam + all procedure lines after coding; see calculations.encounter_charge_split" }
      - { name: total_patient_resp_cents, type: integer, source: computed, default: 0, description: "Sum of patient portions across exam + all procedure lines after coding" }
      - { name: status, type: enum, source: system, description: "OPEN -> EXAM_DONE -> CODED -> SUBMITTED -> ADJUDICATED; CODED -> EXAM_DONE (recode revert); OPEN/EXAM_DONE/CODED -> VOIDED" }

  - name: Procedure
    parent: null
    common_fields: true
    fields:
      - { name: encounter_id, type: string, source: input, description: "FK -> Encounter.id" }
      - { name: patient_id, type: string, source: computed, description: "Denormalized owning patient id (copied from the encounter)" }
      - { name: procedure_kind, type: enum, source: input, description: "ROUTINE_NAIL_DEBRIDEMENT | ROUTINE_CALLUS_PARING | WOUND_DEBRIDEMENT | NAIL_AVULSION", constraints: "first two are routine foot care subject to the frequency rule; last two are non-routine and always coverable" }
      - { name: service_date, type: string, source: input, description: "ISO date the procedure was performed; used for the routine-care frequency window" }
      - { name: billed_cents, type: integer, source: input, description: "Billed amount for this procedure line (>= 0)" }
      - { name: fee_cap_cents, type: integer, source: input, description: "Fee-schedule allowed cap for this line (>= 0)" }
      - { name: coverage_decision, type: enum, source: computed, default: PENDING, description: "PENDING | COVERED | DENIED_FREQUENCY | DENIED_NO_QUALIFYING_DX; set when the parent encounter is coded; see calculations.procedure_coverage_decision" }
      - { name: medicare_pays_cents, type: integer, source: computed, default: 0, description: "Payer portion for this line once coded" }
      - { name: patient_resp_cents, type: integer, source: computed, default: 0, description: "Patient portion for this line once coded" }
      - { name: is_routine, type: boolean, source: computed, description: "True iff procedure_kind in {ROUTINE_NAIL_DEBRIDEMENT, ROUTINE_CALLUS_PARING}" }

  - name: OrthoticRx
    parent: null
    common_fields: true
    fields:
      - { name: encounter_id, type: string, source: input, description: "FK -> Encounter.id" }
      - { name: patient_id, type: string, source: computed, description: "Denormalized owning patient id (copied from the encounter)" }
      - { name: prior_authorization_id, type: string, source: input, description: "FK -> PriorAuthorization.id; the ORTHOTIC-category PA this Rx draws against" }
      - { name: l_code, type: string, source: input, description: "Orthotic L-code prescribed (e.g., L3000, L3020)" }
      - { name: foot_side, type: enum, source: input, description: "LEFT | RIGHT | BILATERAL" }
      - { name: status, type: enum, source: system, description: "DRAFT -> PENDING_PA -> APPROVED -> FULFILLED; PENDING_PA -> DRAFT (payer revision loop); APPROVED -> CANCELLED" }

  - name: LabOrder
    parent: null
    common_fields: true
    fields:
      - { name: orthotic_rx_id, type: string, source: input, description: "FK -> OrthoticRx.id" }
      - { name: lab_name, type: string, source: input, description: "Fabrication lab name" }
      - { name: line_items, type: array, source: input, description: "Array of objects {description, l_code, unit_price_cents (int), quantity (int >=1), discount_pct (0..1)}" }
      - { name: total_cents, type: integer, source: computed, default: 0, description: "Per-line-rounded sum of line charges; see calculations.lab_order_total" }
      - { name: units_drawn, type: integer, source: input, description: "Units this lab order draws from the linked PA (>= 1)" }
      - { name: status, type: enum, source: system, description: "QUEUED -> SHIPPED -> RECEIVED; QUEUED -> CANCELLED" }

  - name: DmeDispense
    parent: null
    common_fields: true
    fields:
      - { name: prior_authorization_id, type: string, source: input, description: "FK -> PriorAuthorization.id; the DME-category PA this dispense draws against" }
      - { name: encounter_id, type: string, source: input, description: "FK -> Encounter.id" }
      - { name: patient_id, type: string, source: computed, description: "Denormalized owning patient id (copied from the encounter)" }
      - { name: hcpcs_code, type: string, source: input, description: "Dispensed DME L-code (boot/brace, e.g., L4360, L1902)" }
      - { name: acquisition_mode, type: enum, source: input, description: "PURCHASE | RENTAL" }
      - { name: units, type: integer, source: input, description: "Units dispensed (>= 1); drawn down from the PA" }
      - { name: purchase_price_cents, type: integer, source: input, description: "Full purchase price for one unit (>= 0)" }
      - { name: monthly_rental_cents, type: integer, source: input, required: false, description: "Per-month rental charge when acquisition_mode==RENTAL" }
      - { name: cumulative_rental_paid_cents, type: integer, source: computed, default: 0, description: "Running rental paid to date for this device line" }
      - { name: this_period_charge_cents, type: integer, source: computed, default: 0, description: "Charge applied on this dispense; capped so cumulative rental never exceeds purchase_price_cents; see calculations.dme_rental_charge" }
      - { name: status, type: enum, source: system, description: "DISPENSED -> RETURNED; DISPENSED is terminal for PURCHASE" }

  - name: ImagingOrder
    parent: null
    common_fields: true
    fields:
      - { name: encounter_id, type: string, source: input, description: "FK -> Encounter.id" }
      - { name: patient_id, type: string, source: computed, description: "Denormalized owning patient id (copied from the encounter)" }
      - { name: modality_id, type: string, source: input, description: "FK -> Modality.id; the machine whose schedule this study occupies" }
      - { name: study_start, type: datetime, source: input, description: "ISO 8601 UTC study start" }
      - { name: study_end, type: datetime, source: input, description: "ISO 8601 UTC study end; must be after study_start" }
      - { name: status, type: enum, source: system, description: "SCHEDULED -> COMPLETED; SCHEDULED -> CANCELLED" }

  - name: Referral
    parent: null
    common_fields: true
    fields:
      - { name: encounter_id, type: string, source: input, description: "FK -> Encounter.id" }
      - { name: patient_id, type: string, source: computed, description: "Denormalized owning patient id (copied from the encounter)" }
      - { name: specialty, type: enum, source: input, description: "VASCULAR | ENDOCRINOLOGY | ORTHOPEDIC_SURGERY | WOUND_CARE" }
      - { name: reason, type: string, source: input, description: "Free-text referral reason" }
      - { name: status, type: enum, source: system, description: "SENT (terminal on create; informational referral record)" }

  - name: RecallSchedule
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: anchor_date, type: string, source: input, description: "ISO date the recall interval is measured from (typically the encounter service date)" }
      - { name: interval_days, type: integer, source: computed, description: "Recall cadence in days derived from the patient's diabetic_foot_risk_category at creation; see calculations.recall_due_date" }
      - { name: due_date, type: string, source: computed, description: "= anchor_date + interval_days" }
      - { name: status, type: enum, source: system, description: "PENDING -> COMPLETED; PENDING -> CANCELLED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Encounter
    initial_state: OPEN
    terminal_states: [ADJUDICATED, VOIDED]
    transitions:
      - from: OPEN
        to: EXAM_DONE
        trigger: "POST /podiatry/encounters/{encounterId}/complete-exam"
        actor: Podiatrist
        preconditions:
          - "Encounter.status == OPEN (else ERR_ENCOUNTER_BAD_STATE)"
          - "Acting Podiatrist is the encounter's rendering provider, i.e. X-User-ID == Encounter.provider_id (else ERR_NOT_RENDERING_PROVIDER)"
        side_effects:
          - "No charge computation yet; status -> EXAM_DONE"

      - from: EXAM_DONE
        to: CODED
        trigger: "POST /podiatry/encounters/{encounterId}/code"
        actor: BillingSpecialist
        preconditions:
          - "Encounter.status == EXAM_DONE (else ERR_ENCOUNTER_BAD_STATE)"
        side_effects:
          - "exam_coverage_decision set to COVERED"
          - "For EACH child Procedure (encounter_id == this encounter): run calculations.procedure_coverage_decision, setting coverage_decision in {COVERED, DENIED_FREQUENCY, DENIED_NO_QUALIFYING_DX}"
          - "For EACH child Procedure and the exam line: run calculations.encounter_charge_split, setting medicare_pays_cents / patient_resp_cents per line"
          - "Recompute Encounter.total_medicare_pays_cents and total_patient_resp_cents as the line sums (exam + procedures)"
          - "status -> CODED"

      - from: CODED
        to: EXAM_DONE
        trigger: "POST /podiatry/encounters/{encounterId}/recode"
        actor: BillingSpecialist
        preconditions:
          - "Encounter.status == CODED (else ERR_ENCOUNTER_BAD_STATE)"
        side_effects:
          - "Reset exam_coverage_decision -> PENDING; every child Procedure coverage_decision -> PENDING; all per-line medicare_pays_cents/patient_resp_cents -> 0; encounter totals -> 0"
          - "status -> EXAM_DONE (revision loop: corrected procedures may then be re-coded)"

      - from: CODED
        to: SUBMITTED
        trigger: "POST /podiatry/encounters/{encounterId}/submit"
        actor: BillingSpecialist
        preconditions:
          - "Encounter.status == CODED (else ERR_ENCOUNTER_BAD_STATE)"
        side_effects:
          - "status -> SUBMITTED (claim sent to payer)"

      - from: SUBMITTED
        to: ADJUDICATED
        trigger: "POST /podiatry/encounters/{encounterId}/adjudicate"
        actor: PayerAgent
        preconditions:
          - "Encounter.status == SUBMITTED (else ERR_ENCOUNTER_BAD_STATE)"
        side_effects:
          - "status -> ADJUDICATED"
          - "Cascade A (depth 3): for each child Procedure that is_routine AND coverage_decision==COVERED, set Patient.last_covered_routine_care_date = max(existing, that procedure's service_date); this Patient mutation in turn advances the patient's frequency window so any future encounter's coding sees the new last date"
          - "Patient mutation increments Patient.version"

      - from: OPEN
        to: VOIDED
        trigger: "POST /podiatry/encounters/{encounterId}/void"
        actor: BillingSpecialist
        preconditions:
          - "Encounter.status in {OPEN, EXAM_DONE, CODED} (else ERR_ENCOUNTER_BAD_STATE)"
        side_effects:
          - "status -> VOIDED; per-line and encounter charge fields reset to 0; coverage decisions reset to PENDING"
          - "Cancel any SCHEDULED child ImagingOrder (ImagingOrder.status -> CANCELLED), freeing its modality slot"

      - from: EXAM_DONE
        to: VOIDED
        trigger: "POST /podiatry/encounters/{encounterId}/void"
        actor: BillingSpecialist
        preconditions:
          - "Encounter.status in {OPEN, EXAM_DONE, CODED} (else ERR_ENCOUNTER_BAD_STATE)"
        side_effects:
          - "status -> VOIDED; per-line and encounter charge fields reset to 0; coverage decisions reset to PENDING"
          - "Cancel any SCHEDULED child ImagingOrder (ImagingOrder.status -> CANCELLED), freeing its modality slot"

      - from: CODED
        to: VOIDED
        trigger: "POST /podiatry/encounters/{encounterId}/void"
        actor: BillingSpecialist
        preconditions:
          - "Encounter.status in {OPEN, EXAM_DONE, CODED} (else ERR_ENCOUNTER_BAD_STATE)"
        side_effects:
          - "status -> VOIDED; per-line and encounter charge fields reset to 0; coverage decisions reset to PENDING"
          - "Cancel any SCHEDULED child ImagingOrder (ImagingOrder.status -> CANCELLED), freeing its modality slot"

  - entity: PriorAuthorization
    initial_state: REQUESTED
    terminal_states: [DENIED, EXPIRED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /podiatry/prior-authorizations/{paId}/approve"
        actor: PayerAgent
        preconditions:
          - "PA.status == REQUESTED (else ERR_PA_BAD_STATE)"
        side_effects:
          - "status -> APPROVED; units_consumed initialized to 0; remaining_units = authorized_units"

      - from: REQUESTED
        to: DENIED
        trigger: "POST /podiatry/prior-authorizations/{paId}/deny"
        actor: PayerAgent
        preconditions:
          - "PA.status == REQUESTED (else ERR_PA_BAD_STATE)"
        side_effects:
          - "status -> DENIED (terminal)"

      - from: APPROVED
        to: EXHAUSTED
        trigger: "system (automatic, bubble-up when a DmeDispense or LabOrder draws remaining_units to exactly 0)"
        actor: system
        preconditions:
          - "PA.status == APPROVED and remaining_units becomes 0 after a draw"
        side_effects:
          - "status -> EXHAUSTED; no further draws permitted (else ERR_PA_NOT_DRAWABLE)"

      - from: APPROVED
        to: EXPIRED
        trigger: "system (automatic, evaluated at draw time when logical clock date > valid_through_date)"
        actor: system
        preconditions:
          - "PA.status == APPROVED and current logical date > valid_through_date"
        side_effects:
          - "status -> EXPIRED (terminal); the attempted draw is rejected with ERR_PA_EXPIRED"

  - entity: OrthoticRx
    initial_state: DRAFT
    terminal_states: [FULFILLED, CANCELLED]
    transitions:
      - from: DRAFT
        to: PENDING_PA
        trigger: "POST /podiatry/orthotic-rxs/{rxId}/submit-to-payer"
        actor: Podiatrist
        preconditions:
          - "OrthoticRx.status == DRAFT (else ERR_RX_BAD_STATE)"
          - "Linked PriorAuthorization.service_category == ORTHOTIC (else ERR_PA_CATEGORY_MISMATCH)"
        side_effects:
          - "status -> PENDING_PA"

      - from: PENDING_PA
        to: APPROVED
        trigger: "POST /podiatry/orthotic-rxs/{rxId}/payer-decision (decision==APPROVE)"
        actor: PayerAgent
        preconditions:
          - "OrthoticRx.status == PENDING_PA (else ERR_RX_BAD_STATE)"
          - "Linked PriorAuthorization.status == APPROVED (else ERR_PA_NOT_DRAWABLE)"
        side_effects:
          - "status -> APPROVED"

      - from: PENDING_PA
        to: DRAFT
        trigger: "POST /podiatry/orthotic-rxs/{rxId}/payer-decision (decision==REVISE)"
        actor: PayerAgent
        preconditions:
          - "OrthoticRx.status == PENDING_PA (else ERR_RX_BAD_STATE)"
        side_effects:
          - "status -> DRAFT (cyclic revision loop; Rx may be edited and resubmitted)"

      - from: APPROVED
        to: FULFILLED
        trigger: "system (automatic, bubble-up when the Rx's LabOrder transitions to RECEIVED)"
        actor: system
        preconditions:
          - "OrthoticRx.status == APPROVED and its LabOrder.status becomes RECEIVED"
        side_effects:
          - "status -> FULFILLED (terminal)"

      - from: APPROVED
        to: CANCELLED
        trigger: "POST /podiatry/orthotic-rxs/{rxId}/cancel"
        actor: Podiatrist
        preconditions:
          - "OrthoticRx.status == APPROVED (else ERR_RX_BAD_STATE)"
          - "No LabOrder for this Rx in status SHIPPED or RECEIVED (else ERR_RX_BAD_STATE)"
        side_effects:
          - "status -> CANCELLED (terminal)"

  - entity: LabOrder
    initial_state: QUEUED
    terminal_states: [RECEIVED, CANCELLED]
    transitions:
      - from: QUEUED
        to: SHIPPED
        trigger: "POST /podiatry/lab-orders/{labOrderId}/ship"
        actor: BillingSpecialist
        preconditions:
          - "LabOrder.status == QUEUED (else ERR_LAB_ORDER_BAD_STATE)"
        side_effects:
          - "status -> SHIPPED"

      - from: SHIPPED
        to: RECEIVED
        trigger: "POST /podiatry/lab-orders/{labOrderId}/receive"
        actor: FrontDesk
        preconditions:
          - "LabOrder.status == SHIPPED (else ERR_LAB_ORDER_BAD_STATE)"
        side_effects:
          - "status -> RECEIVED"
          - "Cascade B (depth 2): bubble up to parent OrthoticRx -> FULFILLED (which is terminal)"

      - from: QUEUED
        to: CANCELLED
        trigger: "POST /podiatry/lab-orders/{labOrderId}/cancel"
        actor: BillingSpecialist
        preconditions:
          - "LabOrder.status == QUEUED (else ERR_LAB_ORDER_BAD_STATE)"
        side_effects:
          - "status -> CANCELLED (terminal)"
          - "Compensation: restore units to the linked PA — units_consumed -= units_drawn, remaining_units recomputed; if PA was EXHAUSTED and remaining_units becomes > 0, PA.status -> APPROVED"

  - entity: DmeDispense
    initial_state: DISPENSED
    terminal_states: [RETURNED]
    transitions:
      - from: DISPENSED
        to: RETURNED
        trigger: "POST /podiatry/dme-dispenses/{dispenseId}/return"
        actor: FrontDesk
        preconditions:
          - "DmeDispense.status == DISPENSED (else ERR_DME_BAD_STATE)"
        side_effects:
          - "status -> RETURNED"
          - "Compensation: restore units to the linked PA — units_consumed -= units, remaining_units recomputed; if PA was EXHAUSTED and remaining_units becomes > 0, PA.status -> APPROVED; PA.version increments"

  - entity: ImagingOrder
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /podiatry/imaging-orders/{imagingOrderId}/complete"
        actor: Podiatrist
        preconditions:
          - "ImagingOrder.status == SCHEDULED (else ERR_IMAGING_BAD_STATE)"
        side_effects:
          - "status -> COMPLETED (terminal)"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /podiatry/imaging-orders/{imagingOrderId}/cancel"
        actor: FrontDesk
        preconditions:
          - "ImagingOrder.status == SCHEDULED (else ERR_IMAGING_BAD_STATE)"
        side_effects:
          - "status -> CANCELLED (terminal); frees the modality interval it held"

  - entity: RecallSchedule
    initial_state: PENDING
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PENDING
        to: COMPLETED
        trigger: "POST /podiatry/recalls/{recallId}/complete"
        actor: FrontDesk
        preconditions:
          - "RecallSchedule.status == PENDING (else ERR_RECALL_BAD_STATE)"
        side_effects:
          - "status -> COMPLETED (terminal)"

      - from: PENDING
        to: CANCELLED
        trigger: "POST /podiatry/recalls/{recallId}/cancel"
        actor: FrontDesk
        preconditions:
          - "RecallSchedule.status == PENDING (else ERR_RECALL_BAD_STATE)"
        side_effects:
          - "status -> CANCELLED (terminal)"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version — true CREATE-with-supersede races only)
# =============================================================================
concurrency_rules:
  - rule_id: dme-dispense-stale-pa
    parent_entity: PriorAuthorization
    write_endpoint: "POST /podiatry/dme-dispenses"
    occ_field: "expected_prior_authorization_version"
    description: |
      Dispensing DME against a PriorAuthorization whose version has advanced
      since the client last observed it is rejected. A prior dispense (or a
      compensating return) legitimately drew down / restored remaining_units
      and bumped the PA version; a dispense carrying the stale version it last
      read is rejected so two independent draws cannot both believe they had
      the last unit.
    error_id: ERR_PA_VERSION_STALE
    http_status: 412

  - rule_id: imaging-order-stale-modality
    parent_entity: Modality
    write_endpoint: "POST /podiatry/imaging-orders"
    occ_field: "expected_modality_version"
    description: |
      Booking an imaging study on a Modality whose version has advanced since
      the client last observed it is rejected. A prior booking (which
      legitimately occupied an interval and bumped the modality version) leaves
      a later booking's view of the machine stale; the stale-version booking is
      rejected so two studies are never reasoned against an out-of-date view of
      the machine's occupied intervals.
    error_id: ERR_MODALITY_VERSION_STALE
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: diabetic_foot_risk_category
    trigger: "Patient create; Patient risk-factor update (PATCH risk-factors)"
    algorithm: weighted_scoring
    formula: |
      Inputs (all booleans on Patient):
        lops       = has_loss_protective_sensation
        pad        = has_peripheral_arterial_disease
        deformity  = has_foot_deformity
        prior      = has_prior_ulcer_or_amputation
      Evaluate in this fixed precedence (highest category wins):
        if prior:                          category = 3
        elif lops and (pad or deformity):  category = 2
        elif lops:                         category = 1
        else:                              category = 0
      Set Patient.diabetic_foot_risk_category = category.
    input_set: "The four risk booleans on the single Patient row; no cross-entity inputs."
    precision: "integer category 0..3"

  - name: recall_due_date
    trigger: "RecallSchedule create (recall queued for a patient)"
    algorithm: threshold
    formula: |
      cat = patient.diabetic_foot_risk_category (snapshot at recall create time)
      interval_days = RECALL_INTERVAL_BY_CATEGORY[cat]
      due_date = anchor_date + interval_days  (calendar-day addition on the ISO date)
      Store interval_days and due_date on the RecallSchedule.
    constants:
      RECALL_INTERVAL_BY_CATEGORY: { 0: 365, 1: 180, 2: 90, 3: 30 }
    input_set: "Patient.diabetic_foot_risk_category snapshotted at create; recall is NOT re-derived if the patient's risk later changes."
    precision: "integer days; date arithmetic in whole calendar days"

  - name: procedure_coverage_decision
    trigger: "Encounter coding (EXAM_DONE -> CODED transition), evaluated per child Procedure"
    algorithm: chronological
    formula: |
      For each Procedure p whose encounter_id == the encounter being coded:
        if not p.is_routine:
            p.coverage_decision = COVERED   # wound debridement / nail avulsion always coverable
        else:
            # routine foot care requires BOTH a qualifying systemic dx AND the frequency window
            if not patient.has_diabetes_mellitus:
                p.coverage_decision = DENIED_NO_QUALIFYING_DX
            else:
                last = patient.last_covered_routine_care_date   # null or ISO date
                if last is None:
                    eligible = true   # no prior covered routine care
                else:
                    gap = (p.service_date - last) in whole calendar days
                    eligible = (gap >= practice.routine_care_min_interval_days)   # >= boundary, default 61
                p.coverage_decision = COVERED if eligible else DENIED_FREQUENCY
      NOTE: last_covered_routine_care_date is the value as of coding time. It only
      advances when an encounter is ADJUDICATED (see Encounter SUBMITTED->ADJUDICATED
      side effect). Coding two routine procedures in the same un-adjudicated encounter
      both see the SAME pre-encounter last date.
    input_set: "patient.has_diabetes_mellitus, patient.last_covered_routine_care_date, practice.routine_care_min_interval_days, p.service_date, p.is_routine"
    constants:
      ROUTINE_KINDS: ["ROUTINE_NAIL_DEBRIDEMENT", "ROUTINE_CALLUS_PARING"]
    precision: "exact day difference; boundary is inclusive (gap == min_interval_days is COVERED)"
    variants:
      - name: covered_via_diabetes
        when: "patient.has_diabetes_mellitus == true and frequency window satisfied (gap >= min_interval_days or no prior)"
        difference: "routine care is COVERED — the systemic-condition coverage path"
      - name: denied_frequency
        when: "patient.has_diabetes_mellitus == true but gap < min_interval_days"
        difference: "routine care is DENIED_FREQUENCY — same patient/dx, different result because the temporal window blocks it; full billed becomes patient responsibility"

  - name: encounter_charge_split
    trigger: "Encounter coding (EXAM_DONE -> CODED), per line (exam line + each Procedure)"
    algorithm: tiered_pricing
    formula: |
      Evaluation order is PINNED to break the coverage<->charge circular look:
        STEP 1 (coverage first): coverage_decision is already set by
               calculations.procedure_coverage_decision (and exam is COVERED).
        STEP 2 (allowed amount): allowed_cents = min(billed_cents, fee_cap_cents)
        STEP 3 (split by coverage):
           if line is COVERED:
               medicare = round_half_up(allowed_cents * practice.fee_split_medicare_pct)
               patient  = allowed_cents - medicare
           else (DENIED_FREQUENCY or DENIED_NO_QUALIFYING_DX):
               medicare = 0
               patient  = billed_cents      # full billed, NOT capped allowed
      The exam line is always COVERED and uses exam_billed_cents / exam_fee_cap_cents.
      Encounter totals = sum of medicare across lines, sum of patient across lines.
    input_set: "Per line: billed_cents, fee_cap_cents, coverage_decision; practice.fee_split_medicare_pct"
    constants:
      ROUNDING: round_half_up
    precision: "integer cents; round half up on the payer portion ONLY, patient portion is the exact remainder"
    variants:
      - name: covered_split
        when: "line coverage_decision == COVERED"
        difference: "payer pays round_half_up(allowed * pct); patient pays allowed - payer (allowed = min(billed,cap))"
      - name: denied_full_patient
        when: "line coverage_decision in {DENIED_FREQUENCY, DENIED_NO_QUALIFYING_DX}"
        difference: "payer pays 0; patient pays the FULL billed_cents (uncapped) — a different formula on the same metric"

  - name: lab_order_total
    trigger: "LabOrder create"
    algorithm: aggregation
    formula: |
      Pinned rounding order: round EACH line to whole cents, THEN sum.
        total = 0
        for each item in line_items:
            raw_line = item.unit_price_cents * item.quantity * (1 - item.discount_pct)
            line_cents = round_half_up(raw_line)     # per-line rounding
            total += line_cents
        LabOrder.total_cents = total
      This differs from sum-then-round when two .5-cent fractions both round up.
    input_set: "LabOrder.line_items (unit_price_cents, quantity, discount_pct per item)"
    constants:
      ROUNDING: round_half_up
    precision: "integer cents; ROUND-PER-LINE-THEN-SUM is the pinned order (NOT sum-then-round)"

  - name: dme_rental_charge
    trigger: "DmeDispense create"
    algorithm: waterfall_allocation
    formula: |
      For acquisition_mode == PURCHASE:
        this_period_charge_cents = purchase_price_cents
        cumulative_rental_paid_cents = purchase_price_cents
      For acquisition_mode == RENTAL:
        prior_cum = sum of cumulative contributions of earlier RENTAL DmeDispense
                    lines for the same hcpcs_code under the same PA (chronological by
                    created_at ASC)
        remaining_to_cap = purchase_price_cents - prior_cum
        if remaining_to_cap <= 0:
            this_period_charge_cents = 0
        else:
            this_period_charge_cents = min(monthly_rental_cents, remaining_to_cap)
        cumulative_rental_paid_cents = prior_cum + this_period_charge_cents
    input_set: "purchase_price_cents, monthly_rental_cents, prior RENTAL dispense charges for same hcpcs_code+PA ordered by created_at ASC"
    constants:
      RENT_TO_OWN: true
    precision: "integer cents; rental never makes cumulative exceed purchase_price_cents"

  - name: pa_units_drawdown
    trigger: "DmeDispense create (units), LabOrder create (units_drawn); reversed on RETURNED / CANCELLED"
    algorithm: aggregation
    formula: |
      On draw:  PA.units_consumed += draw_qty;  PA.remaining_units = PA.authorized_units - PA.units_consumed
                if PA.remaining_units == 0: PA.status -> EXHAUSTED
      On reverse (DmeDispense return / LabOrder cancel):
                PA.units_consumed -= draw_qty;  PA.remaining_units recomputed
                if PA.status == EXHAUSTED and PA.remaining_units > 0: PA.status -> APPROVED
      A draw is rejected (ERR_PA_UNITS_EXCEEDED) when draw_qty > PA.remaining_units.
      INVARIANT: at all times PA.units_consumed == sum of units over all non-reversed
      DmeDispense(units) and non-cancelled LabOrder(units_drawn) linked to this PA, and
      PA.remaining_units == PA.authorized_units - PA.units_consumed.
    input_set: "All non-reversed DmeDispense.units and non-cancelled LabOrder.units_drawn linked to the PA"
    precision: "integer units; remaining_units floored at 0, never negative"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and X-User-Role is a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is permitted to perform this operation per §1.7"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Every resource id in the path exists"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all resource endpoints

  - priority: 4
    category: existence
    check: "Body foreign keys reference existing rows (practice_id, patient_id, provider_id, modality_id, encounter_id, prior_authorization_id, orthotic_rx_id)"
    error_id: ERR_FK_NOT_FOUND
    http_status: 404
    applies_to: "POST providers, modalities, patients, prior-authorizations, encounters, procedures, orthotic-rxs, lab-orders, dme-dispenses, imaging-orders, referrals, recalls"

  - priority: 5
    category: validation
    check: "Required body fields present with correct types; enums in allowed set; scheduled_end > scheduled_start; study_end > study_start; quantities/units >= 1; discount_pct in [0,1]; monthly_rental_cents present when acquisition_mode==RENTAL"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all write endpoints

  - priority: 6
    category: state
    check: "OCC: when expected_prior_authorization_version is supplied on dme-dispense it equals the live PA version; expected_modality_version on imaging-order equals the live Modality version"
    error_id: ERR_PA_VERSION_STALE
    http_status: 412
    applies_to: "POST dme-dispenses, POST imaging-orders"
    note: "Checked before business rules so a stale view never mutates; modality variant uses ERR_MODALITY_VERSION_STALE"

  - priority: 7
    category: state
    check: "Target entity is in a state from which the requested transition is legal"
    error_id: ERR_ENCOUNTER_BAD_STATE
    http_status: 409
    applies_to: "encounter lifecycle endpoints (and analogous ERR_*_BAD_STATE on PA/Rx/LabOrder/DME/Imaging/Recall)"

  - priority: 8
    category: state
    check: "Acting Podiatrist on complete-exam is the encounter's rendering provider (X-User-ID == Encounter.provider_id)"
    error_id: ERR_NOT_RENDERING_PROVIDER
    http_status: 403
    applies_to: "POST encounters/{id}/complete-exam"

  - priority: 9
    category: business_referential
    check: "Linked PriorAuthorization.service_category matches the operation (ORTHOTIC for orthotic-rx submit/lab-order; DME for dme-dispense)"
    error_id: ERR_PA_CATEGORY_MISMATCH
    http_status: 409
    applies_to: "POST orthotic-rxs/{id}/submit-to-payer, POST lab-orders, POST dme-dispenses"

  - priority: 10
    category: business_referential
    check: "Linked PriorAuthorization is in a drawable state (APPROVED) and not REQUESTED/DENIED/EXHAUSTED"
    error_id: ERR_PA_NOT_DRAWABLE
    http_status: 409
    applies_to: "POST dme-dispenses, POST lab-orders, POST orthotic-rxs/{id}/payer-decision (APPROVE branch)"

  - priority: 11
    category: business_temporal
    check: "At draw time the logical clock date is within [valid_from_date, valid_through_date]; past valid_through_date auto-expires the PA and rejects"
    error_id: ERR_PA_EXPIRED
    http_status: 409
    applies_to: "POST dme-dispenses, POST lab-orders"

  - priority: 12
    category: business_temporal
    check: "Provider schedule overlap — the new encounter's [scheduled_start, scheduled_end) must not overlap any non-VOIDED encounter on the same provider_id (half-open: back-to-back touching at the boundary is allowed)"
    error_id: ERR_PROVIDER_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST encounters"

  - priority: 13
    category: business_temporal
    check: "Modality schedule overlap — the new study's interval, EXPANDED by the modality cleanup_buffer_minutes after its end, must not overlap any non-CANCELLED study's buffered interval on the same modality_id (buffered/adjacency semantics)"
    error_id: ERR_MODALITY_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST imaging-orders"

  - priority: 14
    category: business_constraint
    check: "Draw quantity does not exceed PriorAuthorization.remaining_units"
    error_id: ERR_PA_UNITS_EXCEEDED
    http_status: 409
    applies_to: "POST dme-dispenses, POST lab-orders"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Test-driving logical clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock to an absolute instant. Server startup default is 2026-01-01T00:00:00Z; before any call here the logical clock reads exactly this default and never falls back to wall-clock time. All date/window/expiry rules read this clock."
    roles: [PracticeAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects: ["logical clock set to to_iso8601"]

  - method: GET
    path: "/_clock"
    description: "Read the current logical clock instant"
    roles: [PracticeAdmin, Podiatrist, BillingSpecialist, FrontDesk, PayerAgent]
    code: 200
    input: []
    output: "{ current_utc: datetime }"
    side_effects: []

  # ---- Practices ----
  - method: POST
    path: "/podiatry/practices"
    description: "Create a practice"
    roles: [PracticeAdmin]
    code: 201
    input: [name, npi, "routine_care_min_interval_days?", "fee_split_medicare_pct?"]
    output: Practice
    side_effects: ["defaults applied: routine_care_min_interval_days=61, fee_split_medicare_pct=0.80"]

  - method: GET
    path: "/podiatry/practices/{practiceId}"
    description: "Get a practice"
    roles: [PracticeAdmin, Podiatrist, BillingSpecialist, FrontDesk, PayerAgent]
    code: 200
    input: []
    output: Practice
    side_effects: []

  # ---- Providers ----
  - method: POST
    path: "/podiatry/providers"
    description: "Create a provider"
    roles: [PracticeAdmin]
    code: 201
    input: [practice_id, full_name, role_type, "is_active?"]
    output: Provider
    side_effects: []

  - method: GET
    path: "/podiatry/providers"
    description: "List providers, filterable by practice_id (reverse-reachability for Provider.practice_id)"
    roles: [PracticeAdmin, Podiatrist, BillingSpecialist, FrontDesk, PayerAgent]
    code: 200
    input: ["practice_id?"]
    output: "Provider[]"
    side_effects: []

  - method: GET
    path: "/podiatry/providers/{providerId}"
    description: "Get a provider"
    roles: [PracticeAdmin, Podiatrist, BillingSpecialist, FrontDesk, PayerAgent]
    code: 200
    input: []
    output: Provider
    side_effects: []

  # ---- Modalities ----
  - method: POST
    path: "/podiatry/modalities"
    description: "Create an imaging modality (machine) with a cleanup buffer"
    roles: [PracticeAdmin]
    code: 201
    input: [practice_id, name, modality_type, "cleanup_buffer_minutes?"]
    output: Modality
    side_effects: []

  - method: GET
    path: "/podiatry/modalities"
    description: "List modalities, filterable by practice_id (reverse-reachability for Modality.practice_id)"
    roles: [PracticeAdmin, Podiatrist, BillingSpecialist, FrontDesk, PayerAgent]
    code: 200
    input: ["practice_id?"]
    output: "Modality[]"
    side_effects: []

  - method: GET
    path: "/podiatry/modalities/{modalityId}"
    description: "Get a modality (exposes version for OCC)"
    roles: [PracticeAdmin, Podiatrist, BillingSpecialist, FrontDesk, PayerAgent]
    code: 200
    input: []
    output: Modality
    side_effects: []

  # ---- Patients ----
  - method: POST
    path: "/podiatry/patients"
    description: "Register a patient; risk category derived on create"
    roles: [FrontDesk]
    code: 201
    input: [practice_id, full_name, date_of_birth, "has_diabetes_mellitus?", "has_loss_protective_sensation?", "has_peripheral_arterial_disease?", "has_foot_deformity?", "has_prior_ulcer_or_amputation?"]
    output: Patient
    side_effects: ["diabetic_foot_risk_category computed; last_covered_routine_care_date = null"]

  - method: GET
    path: "/podiatry/patients"
    description: "List patients, filterable by practice_id (reverse-reachability for Patient.practice_id)"
    roles: [PracticeAdmin, Podiatrist, BillingSpecialist, FrontDesk, PayerAgent]
    code: 200
    input: ["practice_id?"]
    output: "Patient[]"
    side_effects: []

  - method: GET
    path: "/podiatry/patients/{patientId}"
    description: "Get a patient (exposes diabetic_foot_risk_category and last_covered_routine_care_date)"
    roles: [PracticeAdmin, Podiatrist, BillingSpecialist, FrontDesk, PayerAgent]
    code: 200
    input: []
    output: Patient
    side_effects: []

  - method: PATCH
    path: "/podiatry/patients/{patientId}/risk-factors"
    description: "Update a patient's risk booleans; recomputes diabetic_foot_risk_category"
    roles: [Podiatrist]
    code: 200
    input: ["has_diabetes_mellitus?", "has_loss_protective_sensation?", "has_peripheral_arterial_disease?", "has_foot_deformity?", "has_prior_ulcer_or_amputation?"]
    output: Patient
    side_effects: ["diabetic_foot_risk_category recomputed; Patient.version increments"]

  # ---- Prior Authorizations ----
  - method: POST
    path: "/podiatry/prior-authorizations"
    description: "Request a prior authorization for a patient"
    roles: [BillingSpecialist]
    code: 201
    input: [patient_id, service_category, hcpcs_code, authorized_units, valid_from_date, valid_through_date]
    output: PriorAuthorization
    side_effects: ["status = REQUESTED; units_consumed = 0; remaining_units = authorized_units"]

  - method: GET
    path: "/podiatry/prior-authorizations"
    description: "List prior authorizations, filterable by patient_id (reverse-reachability for PriorAuthorization.patient_id)"
    roles: [PracticeAdmin, Podiatrist, BillingSpecialist, FrontDesk, PayerAgent]
    code: 200
    input: ["patient_id?"]
    output: "PriorAuthorization[]"
    side_effects: []

  - method: GET
    path: "/podiatry/prior-authorizations/{paId}"
    description: "Get a prior authorization (exposes remaining_units, units_consumed, version, status)"
    roles: [PracticeAdmin, Podiatrist, BillingSpecialist, FrontDesk, PayerAgent]
    code: 200
    input: []
    output: PriorAuthorization
    side_effects: []

  - method: POST
    path: "/podiatry/prior-authorizations/{paId}/approve"
    description: "Payer approves a PA"
    roles: [PayerAgent]
    code: 200
    input: []
    output: PriorAuthorization
    side_effects: ["status REQUESTED -> APPROVED"]

  - method: POST
    path: "/podiatry/prior-authorizations/{paId}/deny"
    description: "Payer denies a PA"
    roles: [PayerAgent]
    code: 200
    input: []
    output: PriorAuthorization
    side_effects: ["status REQUESTED -> DENIED"]

  # ---- Encounters ----
  - method: POST
    path: "/podiatry/encounters"
    description: "Schedule an encounter on a provider; provider-schedule overlap enforced"
    roles: [FrontDesk]
    code: 201
    input: [patient_id, provider_id, scheduled_start, scheduled_end, exam_billed_cents, exam_fee_cap_cents]
    output: Encounter
    side_effects: ["status = OPEN; ERR_PROVIDER_DOUBLE_BOOKED on schedule overlap"]

  - method: GET
    path: "/podiatry/encounters"
    description: "List encounters, filterable by patient_id and/or provider_id (reverse-reachability for Encounter.patient_id and Encounter.provider_id)"
    roles: [PracticeAdmin, Podiatrist, BillingSpecialist, FrontDesk, PayerAgent]
    code: 200
    input: ["patient_id?", "provider_id?"]
    output: "Encounter[]"
    side_effects: []

  - method: GET
    path: "/podiatry/encounters/{encounterId}"
    description: "Get an encounter (exposes computed totals and status)"
    roles: [PracticeAdmin, Podiatrist, BillingSpecialist, FrontDesk, PayerAgent]
    code: 200
    input: []
    output: Encounter
    side_effects: []

  - method: POST
    path: "/podiatry/encounters/{encounterId}/complete-exam"
    description: "Podiatrist completes the exam (must be the rendering provider)"
    roles: [Podiatrist]
    code: 200
    input: []
    output: Encounter
    side_effects: ["status OPEN -> EXAM_DONE"]

  - method: POST
    path: "/podiatry/encounters/{encounterId}/code"
    description: "Code the encounter — runs procedure coverage decisions and charge split"
    roles: [BillingSpecialist]
    code: 200
    input: []
    output: Encounter
    side_effects: ["status EXAM_DONE -> CODED; per-line coverage + split computed; totals recomputed"]

  - method: POST
    path: "/podiatry/encounters/{encounterId}/recode"
    description: "Revert a coded encounter back to EXAM_DONE for correction"
    roles: [BillingSpecialist]
    code: 200
    input: []
    output: Encounter
    side_effects: ["status CODED -> EXAM_DONE; coverage/charge fields reset to PENDING/0"]

  - method: POST
    path: "/podiatry/encounters/{encounterId}/submit"
    description: "Submit the coded claim to the payer"
    roles: [BillingSpecialist]
    code: 200
    input: []
    output: Encounter
    side_effects: ["status CODED -> SUBMITTED"]

  - method: POST
    path: "/podiatry/encounters/{encounterId}/adjudicate"
    description: "Payer adjudicates the claim; advances patient frequency window"
    roles: [PayerAgent]
    code: 200
    input: []
    output: Encounter
    side_effects: ["status SUBMITTED -> ADJUDICATED; Patient.last_covered_routine_care_date advanced for COVERED routine lines; Patient.version increments"]

  - method: POST
    path: "/podiatry/encounters/{encounterId}/void"
    description: "Void an open/exam-done/coded encounter"
    roles: [BillingSpecialist]
    code: 200
    input: []
    output: Encounter
    side_effects: ["status -> VOIDED; charge fields reset; SCHEDULED child imaging orders cancelled"]

  # ---- Procedures ----
  - method: POST
    path: "/podiatry/procedures"
    description: "Add a procedure line to an OPEN or EXAM_DONE encounter"
    roles: [Podiatrist]
    code: 201
    input: [encounter_id, procedure_kind, service_date, billed_cents, fee_cap_cents]
    output: Procedure
    side_effects: ["patient_id copied from encounter; is_routine computed; coverage_decision = PENDING until coding"]

  - method: GET
    path: "/podiatry/procedures"
    description: "List procedures, filterable by encounter_id (reverse-reachability for Procedure.encounter_id)"
    roles: [PracticeAdmin, Podiatrist, BillingSpecialist, FrontDesk, PayerAgent]
    code: 200
    input: ["encounter_id?"]
    output: "Procedure[]"
    side_effects: []

  - method: GET
    path: "/podiatry/procedures/{procedureId}"
    description: "Get a procedure (exposes coverage_decision and per-line split)"
    roles: [PracticeAdmin, Podiatrist, BillingSpecialist, FrontDesk, PayerAgent]
    code: 200
    input: []
    output: Procedure
    side_effects: []

  # ---- Orthotic Rx ----
  - method: POST
    path: "/podiatry/orthotic-rxs"
    description: "Create an orthotic prescription tied to an ORTHOTIC-category PA"
    roles: [Podiatrist]
    code: 201
    input: [encounter_id, prior_authorization_id, l_code, foot_side]
    output: OrthoticRx
    side_effects: ["patient_id copied from encounter; status = DRAFT"]

  - method: GET
    path: "/podiatry/orthotic-rxs"
    description: "List orthotic Rxs, filterable by encounter_id and/or prior_authorization_id (reverse-reachability for OrthoticRx.encounter_id and OrthoticRx.prior_authorization_id)"
    roles: [PracticeAdmin, Podiatrist, BillingSpecialist, FrontDesk, PayerAgent]
    code: 200
    input: ["encounter_id?", "prior_authorization_id?"]
    output: "OrthoticRx[]"
    side_effects: []

  - method: GET
    path: "/podiatry/orthotic-rxs/{rxId}"
    description: "Get an orthotic Rx"
    roles: [PracticeAdmin, Podiatrist, BillingSpecialist, FrontDesk, PayerAgent]
    code: 200
    input: []
    output: OrthoticRx
    side_effects: []

  - method: POST
    path: "/podiatry/orthotic-rxs/{rxId}/submit-to-payer"
    description: "Submit an orthotic Rx for payer review"
    roles: [Podiatrist]
    code: 200
    input: []
    output: OrthoticRx
    side_effects: ["status DRAFT -> PENDING_PA; ERR_PA_CATEGORY_MISMATCH if linked PA not ORTHOTIC"]

  - method: POST
    path: "/podiatry/orthotic-rxs/{rxId}/payer-decision"
    description: "Payer approves or returns the Rx for revision"
    roles: [PayerAgent]
    code: 200
    input: [decision]
    output: OrthoticRx
    side_effects: ["decision==APPROVE -> APPROVED (requires linked PA APPROVED); decision==REVISE -> DRAFT (cyclic loop)"]

  - method: POST
    path: "/podiatry/orthotic-rxs/{rxId}/cancel"
    description: "Cancel an approved Rx that has no shipped/received lab order"
    roles: [Podiatrist]
    code: 200
    input: []
    output: OrthoticRx
    side_effects: ["status APPROVED -> CANCELLED"]

  # ---- Lab Orders ----
  - method: POST
    path: "/podiatry/lab-orders"
    description: "Create a fabrication lab order on an Rx; computes total (per-line round then sum); draws PA units"
    roles: [BillingSpecialist]
    code: 201
    input: [orthotic_rx_id, lab_name, line_items, units_drawn]
    output: LabOrder
    side_effects: ["total_cents computed; PA units drawn (ERR_PA_CATEGORY_MISMATCH / ERR_PA_UNITS_EXCEEDED / ERR_PA_EXPIRED / ERR_PA_NOT_DRAWABLE checked against the Rx's linked PA); PA may auto-EXHAUSTED; status = QUEUED"]

  - method: GET
    path: "/podiatry/lab-orders"
    description: "List lab orders, filterable by orthotic_rx_id (reverse-reachability for LabOrder.orthotic_rx_id)"
    roles: [PracticeAdmin, Podiatrist, BillingSpecialist, FrontDesk, PayerAgent]
    code: 200
    input: ["orthotic_rx_id?"]
    output: "LabOrder[]"
    side_effects: []

  - method: GET
    path: "/podiatry/lab-orders/{labOrderId}"
    description: "Get a lab order (exposes total_cents)"
    roles: [PracticeAdmin, Podiatrist, BillingSpecialist, FrontDesk, PayerAgent]
    code: 200
    input: []
    output: LabOrder
    side_effects: []

  - method: POST
    path: "/podiatry/lab-orders/{labOrderId}/ship"
    description: "Mark a lab order shipped"
    roles: [BillingSpecialist]
    code: 200
    input: []
    output: LabOrder
    side_effects: ["status QUEUED -> SHIPPED"]

  - method: POST
    path: "/podiatry/lab-orders/{labOrderId}/receive"
    description: "Mark a lab order received; bubbles parent Rx to FULFILLED"
    roles: [FrontDesk]
    code: 200
    input: []
    output: LabOrder
    side_effects: ["status SHIPPED -> RECEIVED; parent OrthoticRx -> FULFILLED"]

  - method: POST
    path: "/podiatry/lab-orders/{labOrderId}/cancel"
    description: "Cancel a queued lab order; restores PA units"
    roles: [BillingSpecialist]
    code: 200
    input: []
    output: LabOrder
    side_effects: ["status QUEUED -> CANCELLED; PA units_consumed restored; EXHAUSTED PA may revert to APPROVED"]

  # ---- DME Dispenses ----
  - method: POST
    path: "/podiatry/dme-dispenses"
    description: "Dispense DME against a DME-category PA; OCC on PA version; draws units; rental cap applied"
    roles: [FrontDesk]
    code: 201
    input: [prior_authorization_id, encounter_id, hcpcs_code, acquisition_mode, units, purchase_price_cents, "monthly_rental_cents?", expected_prior_authorization_version]
    output: DmeDispense
    side_effects: ["patient_id copied from encounter; this_period_charge_cents computed; PA units drawn; PA.version increments; PA may auto-EXHAUSTED; status = DISPENSED"]

  - method: GET
    path: "/podiatry/dme-dispenses"
    description: "List DME dispenses, filterable by prior_authorization_id and/or encounter_id (reverse-reachability for DmeDispense.prior_authorization_id and DmeDispense.encounter_id)"
    roles: [PracticeAdmin, Podiatrist, BillingSpecialist, FrontDesk, PayerAgent]
    code: 200
    input: ["prior_authorization_id?", "encounter_id?"]
    output: "DmeDispense[]"
    side_effects: []

  - method: GET
    path: "/podiatry/dme-dispenses/{dispenseId}"
    description: "Get a DME dispense"
    roles: [PracticeAdmin, Podiatrist, BillingSpecialist, FrontDesk, PayerAgent]
    code: 200
    input: []
    output: DmeDispense
    side_effects: []

  - method: POST
    path: "/podiatry/dme-dispenses/{dispenseId}/return"
    description: "Return a dispensed DME; restores PA units"
    roles: [FrontDesk]
    code: 200
    input: []
    output: DmeDispense
    side_effects: ["status DISPENSED -> RETURNED; PA units_consumed restored; EXHAUSTED PA may revert to APPROVED; PA.version increments"]

  # ---- Imaging Orders ----
  - method: POST
    path: "/podiatry/imaging-orders"
    description: "Order imaging on a modality; OCC on modality version; buffered-overlap enforced"
    roles: [Podiatrist]
    code: 201
    input: [encounter_id, modality_id, study_start, study_end, expected_modality_version]
    output: ImagingOrder
    side_effects: ["patient_id copied from encounter; status = SCHEDULED; Modality.version increments; ERR_MODALITY_DOUBLE_BOOKED on buffered overlap"]

  - method: GET
    path: "/podiatry/imaging-orders"
    description: "List imaging orders, filterable by encounter_id and/or modality_id (reverse-reachability for ImagingOrder.encounter_id and ImagingOrder.modality_id)"
    roles: [PracticeAdmin, Podiatrist, BillingSpecialist, FrontDesk, PayerAgent]
    code: 200
    input: ["encounter_id?", "modality_id?"]
    output: "ImagingOrder[]"
    side_effects: []

  - method: GET
    path: "/podiatry/imaging-orders/{imagingOrderId}"
    description: "Get an imaging order"
    roles: [PracticeAdmin, Podiatrist, BillingSpecialist, FrontDesk, PayerAgent]
    code: 200
    input: []
    output: ImagingOrder
    side_effects: []

  - method: POST
    path: "/podiatry/imaging-orders/{imagingOrderId}/complete"
    description: "Mark imaging study completed"
    roles: [Podiatrist]
    code: 200
    input: []
    output: ImagingOrder
    side_effects: ["status SCHEDULED -> COMPLETED"]

  - method: POST
    path: "/podiatry/imaging-orders/{imagingOrderId}/cancel"
    description: "Cancel a scheduled imaging study; frees the modality interval"
    roles: [FrontDesk]
    code: 200
    input: []
    output: ImagingOrder
    side_effects: ["status SCHEDULED -> CANCELLED"]

  # ---- Referrals ----
  - method: POST
    path: "/podiatry/referrals"
    description: "Create a referral record from an encounter"
    roles: [Podiatrist]
    code: 201
    input: [encounter_id, specialty, reason]
    output: Referral
    side_effects: ["patient_id copied from encounter; status = SENT"]

  - method: GET
    path: "/podiatry/referrals"
    description: "List referrals, filterable by encounter_id (reverse-reachability for Referral.encounter_id)"
    roles: [PracticeAdmin, Podiatrist, BillingSpecialist, FrontDesk, PayerAgent]
    code: 200
    input: ["encounter_id?"]
    output: "Referral[]"
    side_effects: []

  - method: GET
    path: "/podiatry/referrals/{referralId}"
    description: "Get a referral"
    roles: [PracticeAdmin, Podiatrist, BillingSpecialist, FrontDesk, PayerAgent]
    code: 200
    input: []
    output: Referral
    side_effects: []

  # ---- Recall Schedules ----
  - method: POST
    path: "/podiatry/recalls"
    description: "Queue a recall for a patient; interval derived from current risk category"
    roles: [FrontDesk]
    code: 201
    input: [patient_id, anchor_date]
    output: RecallSchedule
    side_effects: ["interval_days + due_date computed from patient.diabetic_foot_risk_category snapshot; status = PENDING"]

  - method: GET
    path: "/podiatry/recalls"
    description: "List recalls, filterable by patient_id (reverse-reachability for RecallSchedule.patient_id)"
    roles: [PracticeAdmin, Podiatrist, BillingSpecialist, FrontDesk, PayerAgent]
    code: 200
    input: ["patient_id?"]
    output: "RecallSchedule[]"
    side_effects: []

  - method: GET
    path: "/podiatry/recalls/{recallId}"
    description: "Get a recall (exposes due_date, interval_days)"
    roles: [PracticeAdmin, Podiatrist, BillingSpecialist, FrontDesk, PayerAgent]
    code: 200
    input: []
    output: RecallSchedule
    side_effects: []

  - method: POST
    path: "/podiatry/recalls/{recallId}/complete"
    description: "Mark a recall completed"
    roles: [FrontDesk]
    code: 200
    input: []
    output: RecallSchedule
    side_effects: ["status PENDING -> COMPLETED"]

  - method: POST
    path: "/podiatry/recalls/{recallId}/cancel"
    description: "Cancel a pending recall"
    roles: [FrontDesk]
    code: 200
    input: []
    output: RecallSchedule
    side_effects: ["status PENDING -> CANCELLED"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT, http: 401, condition: "X-User-ID or X-User-Role header missing or role not recognized" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A resource id in the path does not exist" }
  - { id: ERR_FK_NOT_FOUND, http: 404, condition: "A body foreign key (practice_id, patient_id, provider_id, modality_id, encounter_id, prior_authorization_id, orthotic_rx_id) references a non-existent row" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Missing/invalid body field, bad enum, end<=start interval, quantity/units<1, discount_pct outside [0,1], missing monthly_rental_cents for RENTAL" }
  - { id: ERR_NOT_RENDERING_PROVIDER, http: 403, condition: "Acting Podiatrist on complete-exam is not the encounter's rendering provider" }
  - { id: ERR_ENCOUNTER_BAD_STATE, http: 409, condition: "Encounter not in a legal state for the requested lifecycle transition" }
  - { id: ERR_PA_BAD_STATE, http: 409, condition: "PriorAuthorization not in a legal state for approve/deny" }
  - { id: ERR_RX_BAD_STATE, http: 409, condition: "OrthoticRx not in a legal state for the requested transition (includes cancel blocked by a SHIPPED/RECEIVED lab order)" }
  - { id: ERR_LAB_ORDER_BAD_STATE, http: 409, condition: "LabOrder not in a legal state for ship/receive/cancel" }
  - { id: ERR_DME_BAD_STATE, http: 409, condition: "DmeDispense not in a legal state for return" }
  - { id: ERR_IMAGING_BAD_STATE, http: 409, condition: "ImagingOrder not in a legal state for complete/cancel" }
  - { id: ERR_RECALL_BAD_STATE, http: 409, condition: "RecallSchedule not in a legal state for complete/cancel" }
  - { id: ERR_PA_CATEGORY_MISMATCH, http: 409, condition: "Linked PA service_category does not match the operation (ORTHOTIC vs DME)" }
  - { id: ERR_PA_NOT_DRAWABLE, http: 409, condition: "Linked PA is not APPROVED (REQUESTED/DENIED/EXHAUSTED) and cannot be drawn or approved-against" }
  - { id: ERR_PA_EXPIRED, http: 409, condition: "At draw time the logical clock date is past the PA valid_through_date" }
  - { id: ERR_PA_UNITS_EXCEEDED, http: 409, condition: "Draw quantity exceeds PA remaining_units" }
  - { id: ERR_PROVIDER_DOUBLE_BOOKED, http: 409, condition: "New encounter interval overlaps an existing non-VOIDED encounter on the same provider (half-open)" }
  - { id: ERR_MODALITY_DOUBLE_BOOKED, http: 409, condition: "New study's buffer-expanded interval overlaps an existing non-CANCELLED study on the same modality" }
  - { id: ERR_PA_VERSION_STALE, http: 412, condition: "expected_prior_authorization_version does not match live PA version (OCC)" }
  - { id: ERR_MODALITY_VERSION_STALE, http: 412, condition: "expected_modality_version does not match live Modality version (OCC)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PracticeAdmin
    description: "Operator who provisions practices, providers, and modalities and controls the logical clock. Not tied to a persisted clinical entity."
    identity: opaque
    exclusive_operations:
      - "POST /podiatry/practices — create practice"
      - "POST /podiatry/providers — create provider"
      - "POST /podiatry/modalities — create modality"
      - "POST /_clock/set_current_utc — set logical clock"
    shared_operations:
      - "All GET reads"

  - name: Podiatrist
    description: "Clinical author: completes exams (as rendering provider), adds procedures, writes orthotic Rx, orders imaging/referrals, updates risk factors. X-User-ID equals the acting Provider.id."
    identity: "entity_backed:Provider"
    exclusive_operations:
      - "POST /podiatry/encounters/{id}/complete-exam — complete exam (must be rendering provider)"
      - "PATCH /podiatry/patients/{id}/risk-factors — update risk factors"
      - "POST /podiatry/procedures — add procedure"
      - "POST /podiatry/orthotic-rxs — create Rx"
      - "POST /podiatry/orthotic-rxs/{id}/submit-to-payer — submit Rx"
      - "POST /podiatry/orthotic-rxs/{id}/cancel — cancel Rx"
      - "POST /podiatry/imaging-orders — order imaging"
      - "POST /podiatry/imaging-orders/{id}/complete — complete imaging"
      - "POST /podiatry/referrals — create referral"
    shared_operations:
      - "All GET reads"

  - name: BillingSpecialist
    description: "Revenue cycle: requests PAs, codes/submits/voids encounters, creates/ships/cancels lab orders. Operator identity, not a persisted entity."
    identity: opaque
    exclusive_operations:
      - "POST /podiatry/prior-authorizations — request PA"
      - "POST /podiatry/encounters/{id}/code — code encounter"
      - "POST /podiatry/encounters/{id}/recode — recode encounter"
      - "POST /podiatry/encounters/{id}/submit — submit claim"
      - "POST /podiatry/encounters/{id}/void — void encounter"
      - "POST /podiatry/lab-orders — create lab order"
      - "POST /podiatry/lab-orders/{id}/ship — ship lab order"
      - "POST /podiatry/lab-orders/{id}/cancel — cancel lab order"
    shared_operations:
      - "All GET reads"

  - name: FrontDesk
    description: "Scheduling and patient intake: registers patients, schedules encounters, dispenses/returns DME, receives lab orders, manages recalls, cancels imaging. Operator identity."
    identity: opaque
    exclusive_operations:
      - "POST /podiatry/patients — register patient"
      - "POST /podiatry/encounters — schedule encounter"
      - "POST /podiatry/dme-dispenses — dispense DME"
      - "POST /podiatry/dme-dispenses/{id}/return — return DME"
      - "POST /podiatry/lab-orders/{id}/receive — receive lab order"
      - "POST /podiatry/imaging-orders/{id}/cancel — cancel imaging"
      - "POST /podiatry/recalls — queue recall"
      - "POST /podiatry/recalls/{id}/complete — complete recall"
      - "POST /podiatry/recalls/{id}/cancel — cancel recall"
    shared_operations:
      - "All GET reads"

  - name: PayerAgent
    description: "Payer-side actor: approves/denies PAs, decides orthotic Rx, adjudicates claims. Operator identity."
    identity: opaque
    exclusive_operations:
      - "POST /podiatry/prior-authorizations/{id}/approve — approve PA"
      - "POST /podiatry/prior-authorizations/{id}/deny — deny PA"
      - "POST /podiatry/orthotic-rxs/{id}/payer-decision — decide Rx"
      - "POST /podiatry/encounters/{id}/adjudicate — adjudicate claim"
    shared_operations:
      - "All GET reads"
