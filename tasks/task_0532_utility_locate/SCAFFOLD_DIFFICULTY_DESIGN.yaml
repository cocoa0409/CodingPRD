          assert:
            - "at 2026-05-01T02:00:00Z: LocateTicket.${ticket_id}.status == 'SUBMITTED' and response_posture == 'AWAITING_RESPONSES'"
            - "at 2026-05-01T02:00:01Z: LocateTicket.${ticket_id}.status == 'EXPIRED' and response_posture == 'SLA_BREACHED'"

