# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3387_volunteer_home_repair_project_selection_trade_coordination
# 9 rules x >=2 instances = 20 instances. Every instance is replayable from
# empty-DB using only SCAFFOLD.yaml §1.5 endpoints.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: priority_score_standard_vs_hazard_mode_diverge
        grounds:
          - calculations.applicant_priority_score
          - entities.FundingCycle.fields.priority_mode
          - entities.HomeownerApplication.fields.priority_score
        distinguishing_aspect: |
          Identical household data on HomeownerApplication scores 81 under a
          STANDARD cycle but 100 under a HAZARD_PRIORITY cycle (hazard term
          10 * severity 4 added before rounding and clamping) — a dual-variant
          calculation on the application domain, distinct from the project
          cost-estimate variant pair.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Two cycles differing only in priority_mode; two identical older-adult veteran applicants, household_size 2, income 3000000 cents (tier TIER_LOW x1.25), each with a SCOPED assessment at hazard severity 4."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rebuild/funding-cycles"
              payload: { name: "FY27 Standard", fiscal_year: 2027, total_budget_cents: 2000000, priority_mode: "STANDARD" }
              as: PlatformAdmin
              captures: { cyc_std: $.data.id }
            - call: "POST /rebuild/funding-cycles"
              payload: { name: "FY27 Hazard", fiscal_year: 2027, total_budget_cents: 2000000, priority_mode: "HAZARD_PRIORITY" }
              as: PlatformAdmin
              captures: { cyc_hz: $.data.id }
            - call: "POST /rebuild/applications"
              payload: { funding_cycle_id: "${cyc_std}", homeowner_name: "Olga Older", date_of_birth: "1960-05-05", household_size: 2, household_income_cents: 3000000, is_veteran: true, has_disability: false, ownership_doc_provided: true, occupancy_doc_provided: true, address: "1 Pine St" }
              as: Anonymous
              captures: { app_std: $.data.id }
            - call: "PATCH /rebuild/applications/${app_std}"
              payload: { status: "UNDER_VERIFICATION" }
              as: AffiliateStaff
            - call: "PATCH /rebuild/applications/${app_std}"
              payload: { status: "VERIFIED" }
              as: AffiliateStaff
              captures: { score_std_pre: $.data.priority_score }
            - call: "POST /rebuild/assessments"
              payload: { application_id: "${app_std}", scheduled_on: "2026-09-02" }
              as: AffiliateStaff
              captures: { asm_std: $.data.id }
            - call: "POST /rebuild/assessments/${asm_std}/complete"
              payload: { safety_hazard_max_severity: 4, accessibility_needs_count: 1, scope_items: [{ category: "SAFETY", required_trade: "NONE", volunteer_performable: true, requires_permit: false, est_low_cents: 100000, est_high_cents: 200000, description: "grab bars" }] }
              as: Assessor
            - call: "PATCH /rebuild/assessments/${asm_std}"
              payload: { status: "SCOPED" }
              as: AffiliateStaff
            - call: "GET /rebuild/applications/${app_std}"
              payload: {}
              as: Any
              captures: { score_std_post: $.data.priority_score }
            - call: "POST /rebuild/applications"
              payload: { funding_cycle_id: "${cyc_hz}", homeowner_name: "Olga Older", date_of_birth: "1960-05-05", household_size: 2, household_income_cents: 3000000, is_veteran: true, has_disability: false, ownership_doc_provided: true, occupancy_doc_provided: true, address: "1 Pine St" }
              as: Anonymous
              captures: { app_hz: $.data.id }
            - call: "PATCH /rebuild/applications/${app_hz}"
              payload: { status: "UNDER_VERIFICATION" }
              as: AffiliateStaff
            - call: "PATCH /rebuild/applications/${app_hz}"
              payload: { status: "VERIFIED" }
              as: AffiliateStaff
              captures: { score_hz_pre: $.data.priority_score }
            - call: "POST /rebuild/assessments"
              payload: { application_id: "${app_hz}", scheduled_on: "2026-09-02" }
              as: AffiliateStaff
              captures: { asm_hz: $.data.id }
            - call: "POST /rebuild/assessments/${asm_hz}/complete"
              payload: { safety_hazard_max_severity: 4, accessibility_needs_count: 1, scope_items: [{ category: "SAFETY", required_trade: "NONE", volunteer_performable: true, requires_permit: false, est_low_cents: 100000, est_high_cents: 200000, description: "grab bars" }] }
              as: Assessor
            - call: "PATCH /rebuild/assessments/${asm_hz}"
              payload: { status: "SCOPED" }
              as: AffiliateStaff
            - call: "GET /rebuild/applications/${app_hz}"
              payload: {}
              as: Any
              captures: { score_hz_post: $.data.priority_score }
          trigger:
            - call: "GET /rebuild/applications/${app_std}"
              payload: {}
              as: Any
          assert:
            - "score_std_pre == 81 and score_hz_pre == 81 (before scope finalization the hazard term is 0 in both modes: round_half_up(65 * 1.25) = 81)"
            - "score_std_post == 81 (STANDARD mode ignores safety_hazard_max_severity 4)"
            - "score_hz_post == 100 (round_half_up(65 * 1.25 + 10 * 4) = 121, clamped to the 100 ceiling)"
            - "the two applicants carry byte-identical household inputs; only the cycle priority_mode differs"

      - name: project_cost_provisional_vs_reconciled_diverge
        grounds:
          - calculations.project_cost_estimate
          - entities.Project.fields.provisional_estimate_cents
          - entities.Project.fields.reconciled_cost_cents
        distinguishing_aspect: |
          On the Project domain, the PROVISIONAL variant (scope-item midpoints,
          450000) and the RECONCILED variant (actual invoice 210000 plus the
          surviving volunteer midpoint 300000, total 510000) diverge for the
          same scope once a trade invoice lands — different inputs included per
          variant, distinct metric from the priority-score pair.
        test_recipe:
          setup:
            - "Clock at 2026-09-01. One STANDARD cycle (budget 2000000), one selected project whose assessment has one ELECTRICAL permit item (100000..200000) and one volunteer item (200000..400000); the electrical item's work order is driven to INVOICED at 210000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rebuild/funding-cycles"
              payload: { name: "FY27", fiscal_year: 2027, total_budget_cents: 2000000 }
              as: PlatformAdmin
              captures: { cyc: $.data.id }
            - call: "POST /rebuild/applications"
              payload: { funding_cycle_id: "${cyc}", homeowner_name: "Vet Older", date_of_birth: "1960-05-05", household_size: 2, household_income_cents: 3000000, is_veteran: true, has_disability: false, ownership_doc_provided: true, occupancy_doc_provided: true, address: "9 Oak Ave" }
              as: Anonymous
              captures: { app: $.data.id }
            - call: "PATCH /rebuild/applications/${app}"
              payload: { status: "UNDER_VERIFICATION" }
              as: AffiliateStaff
            - call: "PATCH /rebuild/applications/${app}"
              payload: { status: "VERIFIED" }
              as: AffiliateStaff
            - call: "POST /rebuild/assessments"
              payload: { application_id: "${app}", scheduled_on: "2026-09-02" }
              as: AffiliateStaff
              captures: { asm: $.data.id }
            - call: "POST /rebuild/assessments/${asm}/complete"
              payload: { safety_hazard_max_severity: 1, accessibility_needs_count: 0, scope_items: [{ category: "CRITICAL_SYSTEMS", required_trade: "ELECTRICAL", volunteer_performable: false, requires_permit: true, est_low_cents: 100000, est_high_cents: 200000, description: "rewire panel" }, { category: "SAFETY", required_trade: "NONE", volunteer_performable: true, requires_permit: false, est_low_cents: 200000, est_high_cents: 400000, description: "build ramp" }] }
              as: Assessor
            - call: "PATCH /rebuild/assessments/${asm}"
              payload: { status: "SCOPED" }
              as: AffiliateStaff
            - call: "PATCH /rebuild/applications/${app}"
              payload: { status: "CANDIDATE" }
              as: AffiliateStaff
            - call: "PATCH /rebuild/funding-cycles/${cyc}"
              payload: { status: "SELECTION_OPEN" }
              as: PlatformAdmin
              captures: { cyc_v: $.data.version }
            - call: "POST /rebuild/funding-cycles/${cyc}/selection-runs"
              payload: { expected_funding_cycle_version: "${cyc_v}" }
              as: AffiliateStaff
              captures: { run: $.data.id }
            - call: "POST /rebuild/selection-runs/${run}/apply"
              payload: {}
              as: AffiliateStaff
            - call: "GET /rebuild/scope-items"
              payload: { assessment_id: "${asm}" }
              as: Any
              captures: { si_e: "$.data[0].id", si_v: "$.data[1].id" }
            - call: "GET /rebuild/projects"
              payload: { application_id: "${app}" }
              as: Any
              captures: { proj: "$.data[0].id" }
            - call: "GET /rebuild/projects/${proj}"
              payload: {}
              as: Any
              captures: { prov_before: $.data.provisional_estimate_cents, env_before: $.data.envelope_cents }
            - call: "POST /rebuild/trade-contractors"
              payload: { legal_name: "SparkPros", trade: "ELECTRICAL", license_number: "E-123", license_expires_on: "2028-01-01", insurance_expires_on: "2028-01-01" }
              as: PlatformAdmin
              captures: { contr: $.data.id }
            - call: "POST /rebuild/trade-work-orders"
              payload: { project_id: "${proj}", contractor_id: "${contr}", scope_item_ids: ["${si_e}"] }
              as: AffiliateStaff
              captures: { wo: $.data.id }
            - call: "PATCH /rebuild/trade-work-orders/${wo}"
              payload: { status: "QUOTED", quote_cents: 200000 }
              as: TradePartner
              as_user_id: "${contr}"
            - call: "PATCH /rebuild/trade-work-orders/${wo}"
              payload: { status: "APPROVED", permit_number: "PERMIT-77" }
              as: AffiliateStaff
            - call: "POST /rebuild/trade-work-orders/${wo}/schedule"
              payload: { visit_start: "2026-10-05T08:00:00Z", visit_end: "2026-10-05T12:00:00Z" }
              as: AffiliateStaff
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-05T08:30:00Z" }
              as: PlatformAdmin
            - call: "PATCH /rebuild/trade-work-orders/${wo}"
              payload: { status: "IN_PROGRESS" }
              as: AffiliateStaff
            - call: "PATCH /rebuild/trade-work-orders/${wo}"
              payload: { status: "PENDING_INSPECTION" }
              as: AffiliateStaff
            - call: "POST /rebuild/trade-work-orders/${wo}/inspect"
              payload: { outcome: "PASSED" }
              as: AffiliateStaff
          trigger:
            - call: "PATCH /rebuild/trade-work-orders/${wo}"
              payload: { status: "INVOICED", invoice_cents: 210000 }
              as: TradePartner
              as_user_id: "${contr}"
            - call: "GET /rebuild/projects/${proj}"
              payload: {}
              as: Any
              captures: { rec_after: $.data.reconciled_cost_cents, prov_after: $.data.provisional_estimate_cents }
          assert:
            - "prov_before == 450000 and prov_after == 450000 (midpoints 150000 + 300000; the provisional variant never observes invoices)"
            - "env_before == 517500 (round_half_up(450000 * 1.15), tier 0.15 because 450000 < 500000)"
            - "rec_after == 510000 (invoice 210000 + volunteer midpoint 300000)"
            - "TradeWorkOrder.${wo}.status == INVOICED and ScopeItem.${si_e}.status == COMPLETED"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: priority_score_tier_boundary_and_ceiling_clamp
        grounds:
          - calculations.applicant_priority_score
          - calculations.household_income_check
        distinguishing_aspect: |
          Mode (a): >= 3 inputs (three vulnerability flags, income tier,
          ceiling clamp) with non-linear interaction — a single cent of income
          at the TIER_DEEP boundary flips the multiplier from 1.5 to 1.25 and
          moves the score by 12 points (100 clamped vs 88).
        test_recipe:
          setup:
            - "Clock at 2026-09-01. One STANDARD cycle. Two older-adult disabled applicants, household_size 1 (AMI 5400000 cents): X at income 1620000 (exactly 30% of AMI), Y at 1620001."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rebuild/funding-cycles"
              payload: { name: "FY27", fiscal_year: 2027, total_budget_cents: 5000000 }
              as: PlatformAdmin
              captures: { cyc: $.data.id }
            - call: "POST /rebuild/applications"
              payload: { funding_cycle_id: "${cyc}", homeowner_name: "X Deep", date_of_birth: "1960-05-05", household_size: 1, household_income_cents: 1620000, is_veteran: false, has_disability: true, ownership_doc_provided: true, occupancy_doc_provided: true, address: "2 Elm St" }
              as: Anonymous
              captures: { app_x: $.data.id }
            - call: "PATCH /rebuild/applications/${app_x}"
              payload: { status: "UNDER_VERIFICATION" }
              as: AffiliateStaff
            - call: "PATCH /rebuild/applications/${app_x}"
              payload: { status: "VERIFIED" }
              as: AffiliateStaff
              captures: { score_x: $.data.priority_score }
            - call: "POST /rebuild/applications"
              payload: { funding_cycle_id: "${cyc}", homeowner_name: "Y Low", date_of_birth: "1960-05-05", household_size: 1, household_income_cents: 1620001, is_veteran: false, has_disability: true, ownership_doc_provided: true, occupancy_doc_provided: true, address: "3 Elm St" }
              as: Anonymous
              captures: { app_y: $.data.id }
            - call: "PATCH /rebuild/applications/${app_y}"
              payload: { status: "UNDER_VERIFICATION" }
              as: AffiliateStaff
          trigger:
            - call: "PATCH /rebuild/applications/${app_y}"
              payload: { status: "VERIFIED" }
              as: AffiliateStaff
              captures: { score_y: $.data.priority_score }
          assert:
            - "score_x == 100 (base 70 * 1.5 = 105, clamped to ceiling; 1620000 * 100 <= 30 * 5400000 holds with equality)"
            - "score_y == 88 (1620001 * 100 > 30 * 5400000, so TIER_LOW: round_half_up(70 * 1.25) = round_half_up(87.5) = 88)"
            - "one cent of income at the inclusive 30% boundary changes the multiplier and the score by 12"

      - name: material_total_per_line_rounding_then_fee
        grounds:
          - calculations.material_order_total
          - entities.MaterialOrder.fields.subtotal_cents
          - entities.MaterialOrder.fields.delivery_fee_cents
        distinguishing_aspect: |
          Mode (b): rounding order is pinned per-line-then-sum-then-fee —
          lines 1x10.005 and 1x7.255 dollars give subtotal 1727 cents
          (1001 + 726); a sum-then-round implementation yields 1726. The fee
          is computed on the rounded subtotal.
        test_recipe:
          setup:
            - "Clock at 2026-09-01. One cycle (budget 2000000), one selected project whose single volunteer scope item estimates 100000..100000 (envelope 115000)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rebuild/funding-cycles"
              payload: { name: "FY27", fiscal_year: 2027, total_budget_cents: 2000000 }
              as: PlatformAdmin
              captures: { cyc: $.data.id }
            - call: "POST /rebuild/applications"
              payload: { funding_cycle_id: "${cyc}", homeowner_name: "Mat Tester", date_of_birth: "1990-01-01", household_size: 1, household_income_cents: 1000000, is_veteran: false, has_disability: false, ownership_doc_provided: true, occupancy_doc_provided: true, address: "4 Birch Rd" }
              as: Anonymous
              captures: { app: $.data.id }
            - call: "PATCH /rebuild/applications/${app}"
              payload: { status: "UNDER_VERIFICATION" }
              as: AffiliateStaff
            - call: "PATCH /rebuild/applications/${app}"
              payload: { status: "VERIFIED" }
              as: AffiliateStaff
            - call: "POST /rebuild/assessments"
              payload: { application_id: "${app}", scheduled_on: "2026-09-02" }
              as: AffiliateStaff
              captures: { asm: $.data.id }
            - call: "POST /rebuild/assessments/${asm}/complete"
              payload: { safety_hazard_max_severity: 0, accessibility_needs_count: 1, scope_items: [{ category: "ACCESSIBILITY", required_trade: "NONE", volunteer_performable: true, requires_permit: false, est_low_cents: 100000, est_high_cents: 100000, description: "railing" }] }
              as: Assessor
            - call: "PATCH /rebuild/assessments/${asm}"
              payload: { status: "SCOPED" }
              as: AffiliateStaff
            - call: "PATCH /rebuild/applications/${app}"
              payload: { status: "CANDIDATE" }
              as: AffiliateStaff
            - call: "PATCH /rebuild/funding-cycles/${cyc}"
              payload: { status: "SELECTION_OPEN" }
              as: PlatformAdmin
              captures: { cyc_v: $.data.version }
            - call: "POST /rebuild/funding-cycles/${cyc}/selection-runs"
              payload: { expected_funding_cycle_version: "${cyc_v}" }
              as: AffiliateStaff
              captures: { run: $.data.id }
            - call: "POST /rebuild/selection-runs/${run}/apply"
              payload: {}
              as: AffiliateStaff
            - call: "GET /rebuild/projects"
              payload: { application_id: "${app}" }
              as: Any
              captures: { proj: "$.data[0].id" }
          trigger:
            - call: "POST /rebuild/material-orders"
              payload: { project_id: "${proj}", lines: [{ item_name: "brackets", quantity: 1, unit_price_dollars: 10.005 }, { item_name: "sealant", quantity: 1, unit_price_dollars: 7.255 }] }
              as: AffiliateStaff
              captures: { mo_sub: $.data.subtotal_cents, mo_fee: $.data.delivery_fee_cents, mo_tot: $.data.total_cents }
          assert:
            - "mo_sub == 1727 (per-line: round_half_up(1 * 10.005 * 100) = 1001; round_half_up(1 * 7.255 * 100) = 726; 1001 + 726)"
            - "mo_fee == 60 (round_half_up(1727 * 0.035) = round_half_up(60.445))"
            - "mo_tot == 1787"
            - "a sum-then-round implementation would produce subtotal 1726 and is non-conforming"

      - name: funding_envelope_contingency_tier_keyed_on_pre_contingency_estimate
        grounds:
          - calculations.funding_envelope
          - entities.Project.fields.envelope_cents
        distinguishing_aspect: |
          Mode (c): the circular-looking rule "envelope = estimate + tiered
          contingency" is pinned to key the tier on the PRE-contingency
          estimate — estimate 500000 exactly takes rate 0.10 (envelope 550000)
          while estimate 499999 takes 0.15 (envelope 574999), so the lower
          estimate produces the larger envelope.
        test_recipe:
          setup:
            - "Clock at 2026-09-01. One cycle (budget 5000000). Two candidates: A with midpoints 150000 + 350000 (estimate 500000), B with midpoints 199999 + 300000 (estimate 499999)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rebuild/funding-cycles"
              payload: { name: "FY27", fiscal_year: 2027, total_budget_cents: 5000000 }
              as: PlatformAdmin
              captures: { cyc: $.data.id }
            - call: "POST /rebuild/applications"
              payload: { funding_cycle_id: "${cyc}", homeowner_name: "A Tier", date_of_birth: "1960-05-05", household_size: 2, household_income_cents: 3000000, is_veteran: true, has_disability: false, ownership_doc_provided: true, occupancy_doc_provided: true, address: "5 Cedar Ln" }
              as: Anonymous
              captures: { app_a: $.data.id }
            - call: "PATCH /rebuild/applications/${app_a}"
              payload: { status: "UNDER_VERIFICATION" }
              as: AffiliateStaff
            - call: "PATCH /rebuild/applications/${app_a}"
              payload: { status: "VERIFIED" }
              as: AffiliateStaff
            - call: "POST /rebuild/assessments"
              payload: { application_id: "${app_a}", scheduled_on: "2026-09-02" }
              as: AffiliateStaff
              captures: { asm_a: $.data.id }
            - call: "POST /rebuild/assessments/${asm_a}/complete"
              payload: { safety_hazard_max_severity: 0, accessibility_needs_count: 0, scope_items: [{ category: "SAFETY", required_trade: "NONE", volunteer_performable: true, requires_permit: false, est_low_cents: 100000, est_high_cents: 200000, description: "item a1" }, { category: "GENERAL", required_trade: "NONE", volunteer_performable: true, requires_permit: false, est_low_cents: 300000, est_high_cents: 400000, description: "item a2" }] }
              as: Assessor
            - call: "PATCH /rebuild/assessments/${asm_a}"
              payload: { status: "SCOPED" }
              as: AffiliateStaff
            - call: "PATCH /rebuild/applications/${app_a}"
              payload: { status: "CANDIDATE" }
              as: AffiliateStaff
            - call: "POST /rebuild/applications"
              payload: { funding_cycle_id: "${cyc}", homeowner_name: "B Tier", date_of_birth: "1960-05-05", household_size: 2, household_income_cents: 3000000, is_veteran: false, has_disability: false, ownership_doc_provided: true, occupancy_doc_provided: true, address: "6 Cedar Ln" }
              as: Anonymous
              captures: { app_b: $.data.id }
            - call: "PATCH /rebuild/applications/${app_b}"
              payload: { status: "UNDER_VERIFICATION" }
              as: AffiliateStaff
            - call: "PATCH /rebuild/applications/${app_b}"
              payload: { status: "VERIFIED" }
              as: AffiliateStaff
            - call: "POST /rebuild/assessments"
              payload: { application_id: "${app_b}", scheduled_on: "2026-09-02" }
              as: AffiliateStaff
              captures: { asm_b: $.data.id }
            - call: "POST /rebuild/assessments/${asm_b}/complete"
              payload: { safety_hazard_max_severity: 0, accessibility_needs_count: 0, scope_items: [{ category: "SAFETY", required_trade: "NONE", volunteer_performable: true, requires_permit: false, est_low_cents: 199998, est_high_cents: 200000, description: "item b1" }, { category: "GENERAL", required_trade: "NONE", volunteer_performable: true, requires_permit: false, est_low_cents: 300000, est_high_cents: 300000, description: "item b2" }] }
              as: Assessor
            - call: "PATCH /rebuild/assessments/${asm_b}"
              payload: { status: "SCOPED" }
              as: AffiliateStaff
            - call: "PATCH /rebuild/applications/${app_b}"
              payload: { status: "CANDIDATE" }
              as: AffiliateStaff
            - call: "PATCH /rebuild/funding-cycles/${cyc}"
              payload: { status: "SELECTION_OPEN" }
              as: PlatformAdmin
              captures: { cyc_v: $.data.version }
            - call: "POST /rebuild/funding-cycles/${cyc}/selection-runs"
              payload: { expected_funding_cycle_version: "${cyc_v}" }
              as: AffiliateStaff
              captures: { run: $.data.id }
            - call: "POST /rebuild/selection-runs/${run}/apply"
              payload: {}
              as: AffiliateStaff
            - call: "GET /rebuild/projects"
              payload: { application_id: "${app_a}" }
              as: Any
              captures: { env_a: "$.data[0].envelope_cents", est_a: "$.data[0].provisional_estimate_cents" }
          trigger:
            - call: "GET /rebuild/projects"
              payload: { application_id: "${app_b}" }
              as: Any
              captures: { env_b: "$.data[0].envelope_cents", est_b: "$.data[0].provisional_estimate_cents" }
          assert:
            - "est_a == 500000 and env_a == 550000 (500000 is NOT < 500000, so the tier falls through to 0.10)"
            - "est_b == 499999 and env_b == 574999 (0.15 tier: round_half_up(499999 * 1.15) = round_half_up(574998.85))"
