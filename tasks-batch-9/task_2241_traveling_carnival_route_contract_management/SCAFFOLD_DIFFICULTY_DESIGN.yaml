            - "Before the trigger: RideAllocation.${alloc_p2}.occupation_end == 2026-09-08T12:00:00Z, so the gap to 2026-09-08T14:00:00Z is 2 hours, under the 4-hour transport buffer"
            - "The trigger returns HTTP 409 with error_id == ERR_RIDE_OUT_OF_SERVICE"
            - "The trigger does NOT return ERR_RIDE_DOUBLE_BOOKED even though rule 70 is independently violated"
            - "GET /ride-allocations?route_stop_id=${stop_p2b} returns 0 rows"
            - "RouteStop.${stop_p2b}.allocated_sqft_used == 0"

      - name: permit_state_44_beats_lead_time_72_on_a_resubmitted_permit
        grounds:
          - validations[priority=44]
          - validations[priority=72]
          - state_machines.PermitApplication.DRAFT_to_SUBMITTED
          - errors[ERR_PERMIT_STATE_INVALID]
          - errors[ERR_PERMIT_LEAD_TIME_VIOLATION]
        distinguishing_aspect: |
          Category pair STATE (44) vs BUSINESS_TEMPORAL (72) on POST /permit-applications/{id}/submit. The clock is
          advanced to 2026-09-02T00:00:00Z so floor((open_date - clock)/86400) == 2 < permit_lead_days 10 — rule 72
          is squarely violated — but the permit is already SUBMITTED, so the state check answers first with
          ERR_PERMIT_STATE_INVALID (409) and submitted_at keeps its original value 2026-08-01T00:00:00Z, proving the
          rejected call had no side effect.
        test_recipe:
          setup:
            - "Jurisdiction OH with permit_lead_days 10; Venue V1; Route R1 with one PLANNED stop whose open_date is 2026-09-04T12:00:00Z."
            - "One EVENT PermitApplication is submitted at clock 2026-08-01T00:00:00Z, when the lead-time floor is 34 days and the submission is admitted."
            - "The clock is then advanced past the lead-time deadline."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdictions"
