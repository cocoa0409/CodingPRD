  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_bed_version_on_confirm
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[confirm-stale-bed]", "errors[ERR_STALE_BED_VERSION]", "validations[priority=20]"]
        distinguishing_aspect: |
          OCC stale-version path: client captures Bed.version BEFORE a mutation bumps it, then confirms with
          the stale expected_bed_version (captured_version - 1 form is not needed; we capture an earlier
          version and let a real mutation advance it) → ERR_STALE_BED_VERSION (412). Two strictly sequential
          requests.
        test_recipe:
          setup: ["BedRequest R1 ASSIGNED to CLEAN bed B1; a block+unblock cycle advances B1.version after the client read."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-05T08:00:00Z" }
              as: FlowAdmin
            - call: "POST /units"
              payload: { name: "OcWard", unit_type: "MEDSURG" }
              as: FlowAdmin
              captures: { u1: $.data.id }
            - call: "POST /units/${u1}/beds"
              payload: { unit_id: "${u1}", label: "OC1" }
              as: ChargeNurse
              captures: { b1: $.data.id }
            - call: "POST /units/${u1}/beds/${b1}/mark-clean"
              payload: {}
              as: ChargeNurse
              captures: { b1_v_stale: $.data.version }
            - call: "POST /encounters"
              payload: { mrn: "MS15", sex: "MALE", origin: "ED" }
              as: BedControlCoordinator
              captures: { e1: $.data.id }
            - call: "POST /encounters/${e1}/admit-order"
              payload: {}
              as: BedControlCoordinator
            - call: "POST /bed-requests"
              payload: { encounter_id: "${e1}", preferred_unit_id: "${u1}" }
              as: TransferCenterAgent
              captures: { r1: $.data.id }
            - call: "POST /bed-requests/${r1}/assign"
              payload: { bed_id: "${b1}" }
              as: BedControlCoordinator
            - call: "POST /units/${u1}/beds/${b1}/block"
              payload: { blocked_reason: "MAINTENANCE" }
              as: ChargeNurse
            - call: "POST /units/${u1}/beds/${b1}/unblock"
              payload: {}
              as: ChargeNurse
            - call: "POST /units/${u1}/beds/${b1}/mark-clean"
              payload: {}
              as: ChargeNurse
          trigger:
            - call: "POST /bed-requests/${r1}/confirm"
              payload: { expected_bed_version: "${b1_v_stale}" }
              as: BedControlCoordinator
              captures: { eid: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_BED_VERSION"
            - "response code == 412"
            - "BedRequest.${r1}.status == ASSIGNED"

      - name: derived_field_reconciliation_unblock_restores_posture
        claim_type: derived_field_reconciliation
        grounds: [entities.Unit.fields.effective_posture, calculations.unit_posture, state_machines.Bed.BLOCKED_to_DIRTY]
        distinguishing_aspect: "After blocking the only staffed bed (posture CLOSED) then unblocking it, the Unit's derived_posture reconciles back to GREEN on the next read."
        test_recipe:
          setup: ["Unit U1 with one CLEAN bed B1; block it (CLOSED) then unblock (DIRTY)."]
          setup_api_calls:
            - call: "POST /units"
              payload: { name: "DfWard", unit_type: "MEDSURG" }
              as: FlowAdmin
              captures: { u1: $.data.id }
            - call: "POST /units/${u1}/beds"
              payload: { unit_id: "${u1}", label: "DF1" }
              as: ChargeNurse
              captures: { b1: $.data.id }
            - call: "POST /units/${u1}/beds/${b1}/mark-clean"
              payload: {}
              as: ChargeNurse
            - call: "POST /units/${u1}/beds/${b1}/block"
              payload: { blocked_reason: "STAFFING" }
              as: ChargeNurse
          trigger:
            - call: "POST /units/${u1}/beds/${b1}/unblock"
              payload: {}
              as: ChargeNurse
            - call: "GET /units/${u1}"
              payload: {}
              as: BedControlCoordinator
          assert:
            - "Unit.${u1}.staffed_bed_count == 1"
            - "Unit.${u1}.occupancy_pct == 0.0"
            - "Unit.${u1}.derived_posture == GREEN"

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_counts_visible_in_same_response
        claim_type: immediate
        grounds: [entities.Unit.fields.occupied_bed_count, state_machines.BedRequest.ASSIGNED_to_CONFIRMED]
        distinguishing_aspect: "Confirming a placement makes Unit.occupied_bed_count == 1 visible on the very next GET /units/{id} in the same request flow (immediate consistency)."
        test_recipe:
