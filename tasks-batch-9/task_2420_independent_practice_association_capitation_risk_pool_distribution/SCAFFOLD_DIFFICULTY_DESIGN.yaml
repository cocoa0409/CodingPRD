  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: pool_deficit_flag_strict_greater_at_9500_bps
        metric: "RiskPool.loss_ratio_bps against POOL_DEFICIT_LOSS_RATIO_BPS"
        endpoint: "POST /ipa/downstream-claims/{id}/state"
        grounds:
          - calculations.pool_loss_ratio_and_deficit
          - entities.RiskPool.fields.loss_ratio_bps
          - entities.RiskPool.fields.deficit_flag
          - state_machines.DownstreamClaim.ADJUDICATED_APPROVED_to_PAID
        distinguishing_aspect: |
          Metric under test: the pool loss ratio in basis points, walked across
          the 9500 bps deficit threshold by paying one extra CENT of claim
          (19000 -> 19001 on funded 20000, i.e. 9500 -> 9501 bps). The
          comparison is strictly greater, so exactly 9500 must NOT flag. The
          boundary is crossed through POST /ipa/downstream-claims/{id}/state
          — a different metric and a different endpoint from the stop-loss
          attachment boundary below.
        test_recipe:
          setup:
            - "Agreement AGR_B is ACTIVE with base_pmpm_cents 20000, quality_withhold_bps 0, professional_pool_share_bps 10000, institutional_pool_share_bps 0, stop_loss_attachment_cents 5000000, max_panel_size 5."
            - "One ACTIVE PRIMARY_CARE physician; one ADULT/HMO enrollee at risk_score_bps 10000 (gross 20000) assigned from 2026-01-01."
            - "A PROFESSIONAL RiskPool covers all of 2026; the 2026-07 file is POSTED so funded_cents is exactly 20000 and paid_claims_cents is 0."
            - "Two PROFESSIONAL claims sit in ADJUDICATED_APPROVED: CB1 with allowed_cents 19000 and CB2 with allowed_cents 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00Z" }
              as: IpaAdmin
            - call: "POST /ipa/delegation-agreements"
              payload: { payer_name: "Boundary Ratio Health", payer_tax_id: "94-1300013", delegation_scope: "FULL_RISK", base_pmpm_cents: 20000, reconciliation_method: "MEMBER_MONTHS_PRORATED", ibnr_method: "COMPLETION_FACTOR", ibnr_completion_factor_bps: 8000, target_claims_pmpm_cents: 15000, professional_pool_share_bps: 10000, institutional_pool_share_bps: 0, quality_withhold_bps: 0, stop_loss_attachment_cents: 5000000, reinsurance_recovery_bps: 9000, max_panel_size: 5, continuity_of_care_days: 90 }
              as: IpaAdmin
              captures: { agr_b: "$.data.id" }
            - call: "POST /ipa/delegation-agreements/${agr_b}/state"
              payload: { to_state: "ACTIVE" }
              as: IpaAdmin
            - call: "POST /ipa/delegation-agreements/${agr_b}/physicians"
              payload: { npi: "1300000001", full_name: "Bo Nakamura", specialty: "PRIMARY_CARE" }
              as: NetworkManager
              captures: { p_b: "$.data.id" }
            - call: "POST /ipa/physicians/${p_b}/state"
              payload: { to_state: "CREDENTIALED" }
              as: NetworkManager
            - call: "POST /ipa/physicians/${p_b}/state"
              payload: { to_state: "ACTIVE" }
              as: NetworkManager
            - call: "POST /ipa/delegation-agreements/${agr_b}/risk-pools"
              payload: { pool_type: "PROFESSIONAL", pool_year_start: "2026-01-01T00:00:00Z", pool_year_end: "2026-12-31T23:59:59Z" }
              as: IpaAdmin
              captures: { pool_b: "$.data.id" }
            - call: "POST /ipa/delegation-agreements/${agr_b}/enrollees"
              payload: { external_member_id: "B-0001", age_band: "ADULT", benefit_tier: "HMO", risk_score_bps: 10000, coverage_start_date: "2026-01-01T00:00:00Z" }
              as: IpaAdmin
              captures: { e_b: "$.data.id", e_b_v: "$.data.version" }
            - call: "POST /ipa/member-assignments"
              payload: { enrollee_id: "${e_b}", physician_id: "${p_b}", effective_date: "2026-01-01T00:00:00Z", assignment_source: "MANUAL", expected_enrollee_version: "${e_b_v}" }
              as: NetworkManager
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: IpaAdmin
            - call: "POST /ipa/delegation-agreements/${agr_b}/enrollment-files"
              payload: { coverage_month: "2026-07", payer_file_reference: "PFR-B-2026-07" }
              as: IpaAdmin
              captures: { file_b: "$.data.id" }
            - call: "POST /ipa/enrollment-files/${file_b}/rows"
              payload: { external_member_id: "B-0001", physician_npi: "1300000001", row_action: "ADD", claimed_capitation_cents: 20000, effective_date: "2026-07-01T00:00:00Z" }
              as: IpaAdmin
            - call: "POST /ipa/enrollment-files/${file_b}/state"
              payload: { to_state: "PARSED" }
              as: IpaAdmin
            - call: "POST /ipa/enrollment-files/${file_b}/state"
              payload: { to_state: "RECONCILED" }
              as: IpaAdmin
            - call: "POST /ipa/enrollment-files/${file_b}/state"
              payload: { to_state: "POSTED" }
              as: IpaAdmin
            - call: "POST /ipa/downstream-claims"
              payload: { agreement_id: "${agr_b}", enrollee_id: "${e_b}", attributed_physician_id: "${p_b}", pool_type: "PROFESSIONAL", downstream_provider_name: "Bitterroot Clinic", billed_cents: 19000, service_date: "2026-06-15T00:00:00Z" }
              as: ClaimsExaminer
              captures: { clm_b1: "$.data.id" }
            - call: "POST /ipa/downstream-claims/${clm_b1}/state"
              payload: { to_state: "ADJUDICATED_APPROVED", allowed_cents: 19000 }
              as: ClaimsExaminer
            - call: "POST /ipa/downstream-claims"
              payload: { agreement_id: "${agr_b}", enrollee_id: "${e_b}", attributed_physician_id: "${p_b}", pool_type: "PROFESSIONAL", downstream_provider_name: "Bitterroot Clinic", billed_cents: 1, service_date: "2026-06-16T00:00:00Z" }
              as: ClaimsExaminer
              captures: { clm_b2: "$.data.id" }
            - call: "POST /ipa/downstream-claims/${clm_b2}/state"
              payload: { to_state: "ADJUDICATED_APPROVED", allowed_cents: 1 }
              as: ClaimsExaminer
          trigger:
            - call: "POST /ipa/downstream-claims/${clm_b1}/state"
              payload: { to_state: "PAID" }
              as: ClaimsExaminer
            - call: "POST /ipa/downstream-claims/${clm_b2}/state"
              payload: { to_state: "PAID" }
              as: ClaimsExaminer
          assert:
            - "after call 1 RiskPool.${pool_b}.paid_claims_cents == 19000"
            - "after call 1 RiskPool.${pool_b}.loss_ratio_bps == 9500 exactly"
            - "after call 1 RiskPool.${pool_b}.deficit_flag == false — equality does NOT flag a deficit"
            - "after call 1 DelegationAgreement.${agr_b}.capitation_posture == \"CURRENT\""
            - "after call 1 PhysicianMember.${p_b}.panel_status == \"OPEN\""
            - "after call 2 RiskPool.${pool_b}.paid_claims_cents == 19001"
            - "after call 2 RiskPool.${pool_b}.loss_ratio_bps == 9501 (19001 * 10000 / 20000 == 9500.5, rounded half up)"
            - "after call 2 RiskPool.${pool_b}.deficit_flag == true"
            - "after call 2 DelegationAgreement.${agr_b}.capitation_posture == \"UNDER_REVIEW\""

      - name: stop_loss_attachment_rejected_at_exact_then_allowed_one_cent_above
        metric: "StopLossRecovery.eligible_paid_cents against DelegationAgreement.stop_loss_attachment_cents"
        endpoint: "POST /ipa/stop-loss-recoveries"
        grounds:
          - calculations.stop_loss_recovery
          - validations.priority_26_ERR_STOP_LOSS_NOT_ATTACHED
          - entities.StopLossRecovery.fields.excess_cents
          - entities.RiskPool.fields.stop_loss_eligible_enrollee_count
        distinguishing_aspect: |
          A different metric (an enrollee's cumulative PAID cents against the
          agreement's stop-loss attachment, in absolute cents rather than basis
          points) crossed through a different endpoint (POST
          /ipa/stop-loss-recoveries, a create rather than a state transition).
          Exactly at attachment the excess is 0 and the create is REJECTED; one
          cent above it succeeds with recovery_cents 1, which also exercises the
          round-half-up on 0.9 of a cent.
        test_recipe:
          setup:
            - "Agreement AGR_SL is ACTIVE with stop_loss_attachment_cents 100000 and reinsurance_recovery_bps 9000; no enrollment file is posted, so the pool's funded_cents stays 0 and loss_ratio_bps stays 0."
            - "One ACTIVE PRIMARY_CARE physician; one ADULT/HMO enrollee ESL assigned from 2026-01-01."
            - "A PROFESSIONAL RiskPool covers all of 2026; one PROFESSIONAL claim of exactly 100000 cents is already PAID, so ESL's cumulative_paid_claims_cents is exactly 100000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00Z" }
              as: IpaAdmin
            - call: "POST /ipa/delegation-agreements"
              payload: { payer_name: "Attachment Point Health", payer_tax_id: "94-1400014", delegation_scope: "FULL_RISK", base_pmpm_cents: 20000, reconciliation_method: "ROSTER_SNAPSHOT", ibnr_method: "COMPLETION_FACTOR", ibnr_completion_factor_bps: 8000, target_claims_pmpm_cents: 15000, professional_pool_share_bps: 10000, institutional_pool_share_bps: 0, quality_withhold_bps: 0, stop_loss_attachment_cents: 100000, reinsurance_recovery_bps: 9000, max_panel_size: 5, continuity_of_care_days: 90 }
              as: IpaAdmin
              captures: { agr_sl: "$.data.id" }
            - call: "POST /ipa/delegation-agreements/${agr_sl}/state"
              payload: { to_state: "ACTIVE" }
              as: IpaAdmin
            - call: "POST /ipa/delegation-agreements/${agr_sl}/physicians"
              payload: { npi: "1400000001", full_name: "Solveig Larsen", specialty: "PRIMARY_CARE" }
              as: NetworkManager
              captures: { p_sl: "$.data.id" }
            - call: "POST /ipa/physicians/${p_sl}/state"
              payload: { to_state: "CREDENTIALED" }
              as: NetworkManager
            - call: "POST /ipa/physicians/${p_sl}/state"
              payload: { to_state: "ACTIVE" }
              as: NetworkManager
            - call: "POST /ipa/delegation-agreements/${agr_sl}/risk-pools"
              payload: { pool_type: "PROFESSIONAL", pool_year_start: "2026-01-01T00:00:00Z", pool_year_end: "2026-12-31T23:59:59Z" }
              as: IpaAdmin
              captures: { pool_sl: "$.data.id" }
            - call: "POST /ipa/delegation-agreements/${agr_sl}/enrollees"
              payload: { external_member_id: "SL-0001", age_band: "ADULT", benefit_tier: "HMO", risk_score_bps: 10000, coverage_start_date: "2026-01-01T00:00:00Z" }
              as: IpaAdmin
              captures: { e_sl: "$.data.id", e_sl_v: "$.data.version" }
            - call: "POST /ipa/member-assignments"
              payload: { enrollee_id: "${e_sl}", physician_id: "${p_sl}", effective_date: "2026-01-01T00:00:00Z", assignment_source: "MANUAL", expected_enrollee_version: "${e_sl_v}" }
              as: NetworkManager
            - call: "POST /ipa/downstream-claims"
              payload: { agreement_id: "${agr_sl}", enrollee_id: "${e_sl}", attributed_physician_id: "${p_sl}", pool_type: "PROFESSIONAL", downstream_provider_name: "Skagit Regional", billed_cents: 100000, service_date: "2026-04-10T00:00:00Z" }
              as: ClaimsExaminer
              captures: { clm_sl1: "$.data.id" }
            - call: "POST /ipa/downstream-claims/${clm_sl1}/state"
              payload: { to_state: "ADJUDICATED_APPROVED", allowed_cents: 100000 }
              as: ClaimsExaminer
            - call: "POST /ipa/downstream-claims/${clm_sl1}/state"
              payload: { to_state: "PAID" }
              as: ClaimsExaminer
          trigger:
            - call: "POST /ipa/stop-loss-recoveries"
              payload: { pool_id: "${pool_sl}", enrollee_id: "${e_sl}" }
              as: ClaimsExaminer
              captures: { attach_error: "$.data.error_id" }
            - call: "POST /ipa/downstream-claims"
              payload: { agreement_id: "${agr_sl}", enrollee_id: "${e_sl}", attributed_physician_id: "${p_sl}", pool_type: "PROFESSIONAL", downstream_provider_name: "Skagit Regional", billed_cents: 1, service_date: "2026-04-11T00:00:00Z" }
              as: ClaimsExaminer
              captures: { clm_sl2: "$.data.id" }
            - call: "POST /ipa/downstream-claims/${clm_sl2}/state"
              payload: { to_state: "ADJUDICATED_APPROVED", allowed_cents: 1 }
              as: ClaimsExaminer
            - call: "POST /ipa/downstream-claims/${clm_sl2}/state"
              payload: { to_state: "PAID" }
              as: ClaimsExaminer
            - call: "POST /ipa/stop-loss-recoveries"
              payload: { pool_id: "${pool_sl}", enrollee_id: "${e_sl}" }
              as: ClaimsExaminer
              captures: { rec_sl: "$.data.id" }
          assert:
            - "before the trigger Enrollee.${e_sl}.cumulative_paid_claims_cents == 100000 and RiskPool.${pool_sl}.stop_loss_eligible_enrollee_count == 0 (equality is not strictly greater)"
            - "call 1 returns HTTP 422 and ${attach_error} == \"ERR_STOP_LOSS_NOT_ATTACHED\" — no StopLossRecovery row is created"
            - "after call 4 Enrollee.${e_sl}.cumulative_paid_claims_cents == 100001 and RiskPool.${pool_sl}.stop_loss_eligible_enrollee_count == 1"
            - "call 5 returns HTTP 201"
