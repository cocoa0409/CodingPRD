      - name: a_stale_driver_version_blocks_a_second_escrow_deduction_on_an_old_balance
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[driver-escrow-deduction-stale]
          - validations[priority=17]
          - errors[ERR_STALE_DRIVER_VERSION]
          - endpoints[POST /driver-pay/drivers/{id}/escrow/deductions]
          - entities.Driver.fields.escrow_balance_cents
        distinguishing_aspect: |
          Repeated escrow deductions against one driver are all legitimate, so nothing in the escrow axis blocks
          the second one - the operator's stale view of escrow_balance_cents can only be protected by the
          declared driver-escrow-deduction-stale rule. The first deduction of 1000 succeeds against version
          ${drv_occd_v1} and bumps the Driver version; replaying that same version for a 500 deduction returns
          412 ERR_STALE_DRIVER_VERSION even though 500 is comfortably inside the remaining 2686 balance and the
          reason code is permissible, and re-reading the version makes the identical 500 request succeed.
