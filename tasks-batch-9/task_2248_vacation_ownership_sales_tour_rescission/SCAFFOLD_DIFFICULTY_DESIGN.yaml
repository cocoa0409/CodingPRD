            - "Logical clock pinned to 2026-08-01T00:00:00Z."
            - "Two tours on the same 12500-gift channel, each checked in WITH the incentive gift issued, each driven to a CLEARED presentation."
            - "One FL and one TX agreement, both priced 3200000 with down_payment 320000, so escrow_collected_cents is 320000 on both."
            - "Both cancellation notices hand-delivered at 2026-08-14T09:00:00Z (inside both deadlines) and adjudicated VALIDATED by officer admin-adjudicator."
