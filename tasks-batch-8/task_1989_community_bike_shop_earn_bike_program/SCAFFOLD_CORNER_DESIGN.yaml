          trigger:
            - { call: "POST /bikes/${b1}/scrap-tickets", payload: { material: "ALUMINUM", weight_kg: 0, recycler_name: "R" }, as: ShopCoordinator, captures: { e0: $.data.error_id } }
            - { call: "POST /bikes/${b1}/scrap-tickets", payload: { material: "ALUMINUM", weight_kg: 100.5, recycler_name: "R" }, as: ShopCoordinator, captures: { e1005: $.data.error_id } }
            - { call: "POST /bikes/${b1}/scrap-tickets", payload: { material: "ALUMINUM", weight_kg: 100, recycler_name: "R" }, as: ShopCoordinator, captures: { tk: $.data.id, pay: $.data.payout_cents } }
            - { call: "POST /bikes/${b2}/harvest-logs", payload: { part_id: "${pt}", quantity: 0 }, as: Volunteer, as_user_id: "${v}", captures: { e_q: $.data.error_id } }
          assert:
            - "weight 0 -> ERR_WEIGHT_INVALID"
            - "weight 100.5 -> ERR_WEIGHT_INVALID"
            - "weight exactly 100 succeeds: payout_cents == 8500 (inclusive upper bound)"
            - "harvest quantity 0 -> ERR_QUANTITY_INVALID"

      - name: session_start_too_early_boundary
        claim_type: boundary_edge
        grounds: ["validations[priority=9]", "errors[ERR_START_TOO_EARLY]", state_machines.ToolSession.BOOKED_to_IN_USE]
        distinguishing_aspect: "Session start opens exactly at start_time - 10m: 09:49 for a 10:00 start fails ERR_START_TOO_EARLY; 09:50 succeeds (inclusive)."
        test_recipe:
          setup: ["membership with BOOKED session 2026-08-10 10:00-11:00"]
          setup_api_calls:
            - { call: "POST /memberships", payload: { member_name: "M E", member_email: "me@x.org", tier: "BASIC", end_date: "2026-12-31" }, as: ShopCoordinator, captures: { m: $.data.id } }
            - { call: "POST /memberships/${m}/sessions", payload: { stand_number: 1, start_time: "2026-08-10T10:00:00Z", end_time: "2026-08-10T11:00:00Z" }, as: Member, as_user_id: "${m}", captures: { se: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T09:49:00Z" }, as: ShopCoordinator }
          trigger:
            - { call: "POST /sessions/${se}/start", as: Member, as_user_id: "${m}", captures: { err: $.data.error_id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T09:50:00Z" }, as: ShopCoordinator }
            - { call: "POST /sessions/${se}/start", as: Member, as_user_id: "${m}", captures: { st: $.data.status } }
          assert:
            - "start at 09:49 -> ERR_START_TOO_EARLY"
            - "start at 09:50 succeeds: status == IN_USE and started_at set"

      - name: marks_incomplete_on_session_complete
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_ATTENDANCE_MARKS_INCOMPLETE]"]
        distinguishing_aspect: "Completing a session with two ENROLLED attendances but only one mark fails ERR_ATTENDANCE_MARKS_INCOMPLETE and transitions nothing."
        test_recipe:
          setup: ["session with two enrollees; clock past scheduled_end"]
          setup_api_calls:
            - { call: "POST /volunteers", payload: { full_name: "V 1", email: "v1@x.org" }, as: ShopCoordinator, captures: { v1: $.data.id } }
            - { call: "POST /volunteers", payload: { full_name: "V 2", email: "v2@x.org" }, as: ShopCoordinator, captures: { v2: $.data.id } }
            - { call: "POST /training-sessions", payload: { topic: "Brakes", level: "BASIC", scheduled_start: "2026-08-02T10:00:00Z", scheduled_end: "2026-08-02T11:00:00Z", credit_hours: 3, capacity: 5 }, as: ShopCoordinator, captures: { s1: $.data.id } }
            - { call: "POST /training-sessions/${s1}/enroll", payload: { volunteer_id: "${v1}" }, as: ShopCoordinator, captures: { a1: $.data.id } }
            - { call: "POST /training-sessions/${s1}/enroll", payload: { volunteer_id: "${v2}" }, as: ShopCoordinator, captures: { a2: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-07T00:00:00Z" }, as: ShopCoordinator }
          trigger:
            - { call: "POST /training-sessions/${s1}/complete", payload: { marks: [ { attendance_id: "${a1}", outcome: "ATTENDED" } ] }, as: ShopCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_ATTENDANCE_MARKS_INCOMPLETE"
            - "TrainingSession.${s1}.status == SCHEDULED (nothing transitioned)"
            - "both attendances remain ENROLLED"

      - name: hourlog_shift_not_creditable
        claim_type: cross_entity_validation
        grounds: ["validations[priority=11]", "errors[ERR_SHIFT_NOT_CREDITABLE]", entities.HourLog.fields.shift_id]
        distinguishing_aspect: "An hour log linked to a shift that is not COMPLETED (here still SCHEDULED) fails ERR_SHIFT_NOT_CREDITABLE — validity depends on a different entity's state."
        test_recipe:
          setup: ["participant; volunteer with a SCHEDULED future shift; clock 2026-08-07"]
          setup_api_calls:
            - { call: "POST /participants", payload: { full_name: "P SL", contact_email: "psl@x.org", age_group: "ADULT" }, as: ShopCoordinator, captures: { pa: $.data.id } }
            - { call: "POST /volunteers", payload: { full_name: "V SL", email: "vsl@x.org" }, as: ShopCoordinator, captures: { v: $.data.id } }
            - { call: "POST /shifts", payload: { volunteer_id: "${v}", shift_role: "MECHANIC", scheduled_start: "2026-08-05T09:00:00Z", scheduled_end: "2026-08-05T10:00:00Z" }, as: ShopCoordinator, captures: { sh: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-07T00:00:00Z" }, as: ShopCoordinator }
          trigger:
            - { call: "POST /participants/${pa}/hour-logs", payload: { work_date: "2026-08-05", hours: 2, activity_type: "SHOP_HELP", shift_id: "${sh}" }, as: Participant, as_user_id: "${pa}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SHIFT_NOT_CREDITABLE (shift SCHEDULED, not COMPLETED — and the past-due shift would sweep to NO_SHOW, never creditable)"

      - name: usage_skill_gate_and_lead_ineligible
        claim_type: conditional_validation
        grounds: ["validations[priority=8]", "errors[ERR_USAGE_SKILL_INSUFFICIENT]", "errors[ERR_LEAD_INELIGIBLE]"]
        distinguishing_aspect: "Skill gates are conditional on volunteer attributes: routing with a TRAINEE lead fails ERR_LEAD_INELIGIBLE; a TRAINEE logging usage on a refurb bike fails ERR_USAGE_SKILL_INSUFFICIENT."
        test_recipe:
