        distinguishing_aspect: "Three course-machine guards: activate without any APPROVED approval (ERR_COURSE_NOT_APPROVED_ANYWHERE); offering create on a DRAFT course (ERR_COURSE_NOT_ACTIVE); retire with an open offering (ERR_COURSE_HAS_OPEN_OFFERINGS)."
