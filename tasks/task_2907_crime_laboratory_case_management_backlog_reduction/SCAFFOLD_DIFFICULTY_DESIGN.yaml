            - "Proficiency test PT1 (cycle 2026-Q3, due 2026-09-01T00:00:00Z) has already been submitted and scored 50.00 -> FAIL, so consecutive_pt_failures == 1 and A1 is PROBATION; because Case C1 is P3_ROUTINE and training_hours_per_week 8.00 >= REMEDIATION_TRAINING_MIN_HOURS, PROBATION_RELEASE left the assignment ACTIVE."
