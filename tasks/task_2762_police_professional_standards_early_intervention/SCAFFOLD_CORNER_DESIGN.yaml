        claim_type: Error triggerable
        grounds:
          - errors.ERR_APPEAL_STATE_INVALID
          - errors.ERR_APPEAL_PENDING
          - errors.ERR_MODIFIED_DAYS_INVALID
          - errors.ERR_INVALID_INTERIM_EARNINGS
          - errors.ERR_REINSTATEMENT_ALREADY_FINALIZED
          - errors.ERR_SALARY_UNKNOWN
        distinguishing_aspect: |
          Six codes live past the appeal boundary and two of them are easy to leave unreachable.
          ERR_APPEAL_PENDING needs a complaint that is already CLOSED - otherwise the priority-8
          purge gate answers first - and needs an allegation set free of UNTRUTHFULNESS so the
          priority-9 credibility hold, which is checked before it, stays silent. ERR_SALARY_UNKNOWN
          needs a second subject officer whose annual_salary_cents is 0, which the field constraint
          permits, carried all the way through sustain, imposition, appeal and reversal so that a
          Reinstatement exists to finalize.
