scaffold_corner_design:

  # ==========================================================================
  - section: entities
    instances:
      - name: create_member_returns_defaults
        claim_type: Creation
        grounds: [entities.Member.member_type, entities.Member.wallet_credit_cents, entities.Member.loyalty_points]
        distinguishing_aspect: "POST /members returns 201 with member_type RETAIL, wallet_credit_cents 0, loyalty_points 0, and a server-minted id."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /api/members"
              payload: { email: "corner-mem@x.com", full_name: "Corner Mem" }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
          assert:
            - "Member.${m_id}.member_type == RETAIL"
            - "Member.${m_id}.wallet_credit_cents == 0"
            - "Member.${m_id}.loyalty_points == 0"
            - "Member.${m_id}.version == 1"

      - name: product_allergens_default_empty
        claim_type: Defaults
        grounds: [entities.Product.allergens]
        distinguishing_aspect: "Creating a product without an allergens field yields allergens == [] (empty list default)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /api/products"
              payload: { sku: "COR-NOALG", name: "Plain Bottle", product_type: "BOTTLE", unit_price_cents: 1000 }
              as: InventoryManager
              captures: { p_id: $.data.id }
          assert:
            - "Product.${p_id}.allergens == []"

      - name: fusti_best_by_date_computed_from_harvest
        claim_type: Computed Fields
        grounds: [entities.Fusti.best_by_date, entities.Fusti.is_past_best_by, entities.Product.shelf_life_days]
        distinguishing_aspect: "A fusti of a 540-day-shelf product with harvest_date 2026-01-01 gets best_by_date 2027-06-25 and is_past_best_by false at clock 2026-07-01."
        test_recipe:
          setup: ["A BULK_OIL product with shelf_life_days 540 and one fusti harvested 2026-01-01."]
          setup_api_calls:
            - call: "POST /api/products"
              payload: { sku: "COR-OILBB", name: "EVOO BB", product_type: "BULK_OIL", price_per_ml_cents: 0.30, shelf_life_days: 540 }
              as: InventoryManager
              captures: { p_oil: $.data.id }
          trigger:
            - call: "POST /api/fusti"
              payload: { product_id: "${p_oil}", capacity_ml: 10000, initial_volume_ml: 10000, reorder_point_ml: 2000, harvest_date: "2026-01-01T00:00:00Z" }
              as: InventoryManager
              captures: { f_id: $.data.id }
          assert:
            - "Fusti.${f_id}.best_by_date == 2027-06-25T00:00:00Z"
            - "Fusti.${f_id}.is_past_best_by == false"
            - "Fusti.${f_id}.status == IN_SERVICE"

      - name: fusti_created_below_reorder_starts_low
        claim_type: Computed Fields
        grounds: [entities.Fusti.status, entities.Fusti.reorder_point_ml]
        distinguishing_aspect: "A fusti created with initial_volume_ml (1500) <= reorder_point_ml (2000) starts in LOW, not IN_SERVICE."
        test_recipe:
          setup: ["A BULK_OIL product; a fusti created already at/below its reorder point."]
          setup_api_calls:
            - call: "POST /api/products"
              payload: { sku: "COR-OILLOW", name: "EVOO Low", product_type: "BULK_OIL", price_per_ml_cents: 0.30, shelf_life_days: 540 }
              as: InventoryManager
              captures: { p_oil: $.data.id }
          trigger:
            - call: "POST /api/fusti"
              payload: { product_id: "${p_oil}", capacity_ml: 10000, initial_volume_ml: 1500, reorder_point_ml: 2000, harvest_date: "2026-06-01T00:00:00Z" }
              as: InventoryManager
              captures: { f_id: $.data.id }
          assert:
            - "Fusti.${f_id}.status == LOW"

      - name: member_not_found_returns_404
        claim_type: Not Found
        grounds: ["errors[ERR_MEMBER_NOT_FOUND]"]
        distinguishing_aspect: "GET /members with a non-existent id returns ERR_MEMBER_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /api/members/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_MEMBER_NOT_FOUND"

      - name: fusti_create_unknown_product_returns_not_found
        claim_type: Parent Relationships
        grounds: ["errors[ERR_PRODUCT_NOT_FOUND]", entities.Fusti.product_id]
        distinguishing_aspect: "Creating a fusti whose product_id does not exist returns ERR_PRODUCT_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /api/fusti"
              payload: { product_id: "00000000-0000-0000-0000-000000000000", capacity_ml: 1000, initial_volume_ml: 1000, reorder_point_ml: 100, harvest_date: "2026-06-01T00:00:00Z" }
              as: InventoryManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_PRODUCT_NOT_FOUND"

      - name: product_component_immutable_no_version
        claim_type: Immutability
        grounds: [entities.ProductComponent.set_product_id, entities.ProductComponent.component_product_id]
        distinguishing_aspect: "A ProductComponent (common_fields:false) is created with id and created_at only and no version/update endpoint; its set_product_id and component_product_id match the request."
        test_recipe:
          setup: ["A GIFT_SET product and a BOTTLE component product."]
          setup_api_calls:
            - call: "POST /api/products"
              payload: { sku: "COR-GIFT", name: "Gift", product_type: "GIFT_SET" }
              as: InventoryManager
              captures: { gift_id: $.data.id }
            - call: "POST /api/products"
              payload: { sku: "COR-BOT", name: "Bottle", product_type: "BOTTLE", unit_price_cents: 1000 }
              as: InventoryManager
              captures: { bot_id: $.data.id }
          trigger:
            - call: "POST /api/products/${gift_id}/components"
              payload: { component_product_id: "${bot_id}", quantity: 2 }
              as: InventoryManager
              captures: { pc_id: $.data.id }
          assert:
            - "ProductComponent.${pc_id}.set_product_id == ${gift_id}"
            - "ProductComponent.${pc_id}.component_product_id == ${bot_id}"
            - "ProductComponent.${pc_id}.quantity == 2"

  # ==========================================================================
  - section: state_machines
    instances:
      - name: order_initial_state_unpaid_pending
        claim_type: Initial State
        grounds: [entities.Order.payment_status, entities.Order.fulfillment_status]
        distinguishing_aspect: "A freshly created order starts payment_status UNPAID and fulfillment_status PENDING."
        test_recipe:
          setup: ["A member and one BOTTLE product."]
          setup_api_calls:
            - call: "POST /api/members"
              payload: { email: "cor-init@x.com", full_name: "Init" }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /api/products"
              payload: { sku: "COR-INIT-BOT", name: "Bottle", product_type: "BOTTLE", unit_price_cents: 2000 }
              as: InventoryManager
              captures: { p_bot: $.data.id }
          trigger:
            - call: "POST /api/orders"
              payload: { lines: [ { line_type: "UNIT", product_id: "${p_bot}", quantity: 1 } ] }
              as: Customer
              as_user_id: "${m_id}"
              captures: { o_id: $.data.id }
          assert:
            - "Order.${o_id}.payment_status == UNPAID"
            - "Order.${o_id}.fulfillment_status == PENDING"

      - name: fulfill_unpaid_order_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Order.RESERVED_to_FULFILLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Fulfilling an order whose fulfillment_status is PENDING (never paid/reserved) returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["An unpaid, pending order."]
          setup_api_calls:
            - call: "POST /api/members"
              payload: { email: "cor-fu@x.com", full_name: "FU" }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /api/products"
              payload: { sku: "COR-FU-BOT", name: "Bottle", product_type: "BOTTLE", unit_price_cents: 2000 }
              as: InventoryManager
              captures: { p_bot: $.data.id }
            - call: "POST /api/orders"
              payload: { lines: [ { line_type: "UNIT", product_id: "${p_bot}", quantity: 1 } ] }
              as: Customer
              as_user_id: "${m_id}"
              captures: { o_id: $.data.id, o_v: $.data.version }
          trigger:
            - call: "POST /api/orders/${o_id}/fulfill"
              payload: { expected_order_version: "${o_v}" }
              as: ShopStaff
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"

      - name: resubmit_after_submitted_returns_invalid_state
        claim_type: Idempotency
        grounds: [state_machines.WholesaleAccount.DRAFT_to_SUBMITTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Submitting an already-SUBMITTED wholesale account (no CHANGES_REQUESTED in between) returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["A wholesale account submitted once."]
          setup_api_calls:
            - call: "POST /api/members"
              payload: { email: "cor-rs@x.com", full_name: "RS" }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /api/wholesale-accounts"
              payload: { business_name: "RS Co", tax_id: "TX-RS" }
              as: Customer
              as_user_id: "${m_id}"
              captures: { wa_id: $.data.id }
            - call: "POST /api/wholesale-accounts/${wa_id}/submit"
              payload: {}
              as: Customer
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /api/wholesale-accounts/${wa_id}/submit"
              payload: {}
              as: Customer
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"

      - name: cancelled_subscription_cannot_resume
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Subscription.PAUSED_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Resuming a CANCELLED (terminal) subscription returns ERR_INVALID_STATE; no transition leaves CANCELLED."
        test_recipe:
          setup: ["An ACTIVE subscription that is then cancelled."]
          setup_api_calls:
            - call: "POST /api/members"
              payload: { email: "cor-sub@x.com", full_name: "Sub" }
              as: PlatformAdmin
              captures: { m_id: $.data.id, m_v: $.data.version }
            - call: "POST /api/products"
              payload: { sku: "COR-SUB-BOT", name: "Bottle", product_type: "BOTTLE", unit_price_cents: 2000 }
              as: InventoryManager
              captures: { p_bot: $.data.id }
            - call: "POST /api/subscriptions"
              payload: { product_id: "${p_bot}", quantity: 1, cadence_days: 30, expected_member_version: "${m_v}" }
              as: Customer
              as_user_id: "${m_id}"
              captures: { s_id: $.data.id }
            - call: "POST /api/subscriptions/${s_id}/transition"
              payload: { action: "CANCEL" }
              as: Customer
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /api/subscriptions/${s_id}/transition"
              payload: { action: "RESUME" }
              as: Customer
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"

      - name: subscription_pause_then_resume_cycles_active
        claim_type: Valid Transition
        grounds: [state_machines.Subscription.ACTIVE_to_PAUSED, state_machines.Subscription.PAUSED_to_ACTIVE]
        distinguishing_aspect: "PAUSE then RESUME returns the subscription to ACTIVE, exercising the ACTIVE<->PAUSED cycle."
        test_recipe:
          setup: ["An ACTIVE subscription."]
          setup_api_calls:
            - call: "POST /api/members"
              payload: { email: "cor-pr@x.com", full_name: "PR" }
              as: PlatformAdmin
              captures: { m_id: $.data.id, m_v: $.data.version }
            - call: "POST /api/products"
              payload: { sku: "COR-PR-BOT", name: "Bottle", product_type: "BOTTLE", unit_price_cents: 2000 }
              as: InventoryManager
              captures: { p_bot: $.data.id }
            - call: "POST /api/subscriptions"
              payload: { product_id: "${p_bot}", quantity: 1, cadence_days: 30, expected_member_version: "${m_v}" }
              as: Customer
              as_user_id: "${m_id}"
              captures: { s_id: $.data.id }
            - call: "POST /api/subscriptions/${s_id}/transition"
              payload: { action: "PAUSE" }
              as: Customer
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /api/subscriptions/${s_id}/transition"
              payload: { action: "RESUME" }
              as: Customer
              as_user_id: "${m_id}"
          assert:
            - "Subscription.${s_id}.status == ACTIVE"

      - name: subscription_renew_creates_order_and_advances_counter
        claim_type: Side Effect Execution
        grounds: [state_machines.Subscription.ACTIVE_to_ACTIVE, entities.Subscription.renewals_count, entities.Subscription.last_order_id]
        distinguishing_aspect: "RENEW on a due ACTIVE subscription creates an Order, sets last_order_id, and increments renewals_count to 1 (bubble cascade renew -> Order)."
        test_recipe:
          setup: ["An ACTIVE subscription (cadence 30d, created at clock 2026-07-01 so next_renewal 2026-07-31); clock advanced to 2026-08-01."]
          setup_api_calls:
            - call: "POST /api/members"
              payload: { email: "cor-rn@x.com", full_name: "RN" }
              as: PlatformAdmin
              captures: { m_id: $.data.id, m_v: $.data.version }
            - call: "POST /api/products"
              payload: { sku: "COR-RN-BOT", name: "Bottle", product_type: "BOTTLE", unit_price_cents: 2000 }
              as: InventoryManager
              captures: { p_bot: $.data.id }
            - call: "POST /api/subscriptions"
              payload: { product_id: "${p_bot}", quantity: 1, cadence_days: 30, expected_member_version: "${m_v}" }
              as: Customer
              as_user_id: "${m_id}"
              captures: { s_id: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/subscriptions/${s_id}/transition"
              payload: { action: "RENEW" }
              as: ShopStaff
          assert:
            - "Subscription.${s_id}.renewals_count == 1"
            - "Subscription.${s_id}.status == ACTIVE"
            - "Subscription.${s_id}.last_order_id is a non-null Order id"

  # ==========================================================================
  - section: calculations
    instances:
      - name: refill_line_price_rounds_per_line
        claim_type: Correct Result
        grounds: [calculations.order_line_pricing]
        distinguishing_aspect: "A REFILL of 333ml at 0.30 cents/ml prices to round_half_up(99.9)=100 cents subtotal (per-line rounding), giving provisional_total 1095 with flat shipping."
        test_recipe:
          setup: ["A member and a 0.30-cent/ml BULK_OIL product with a stocked fusti; one 333ml REFILL order."]
          setup_api_calls:
            - call: "POST /api/members"
              payload: { email: "cor-rl@x.com", full_name: "RL" }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /api/products"
              payload: { sku: "COR-RL-OIL", name: "EVOO RL", product_type: "BULK_OIL", price_per_ml_cents: 0.30, shelf_life_days: 540 }
              as: InventoryManager
              captures: { p_oil: $.data.id }
            - call: "POST /api/fusti"
              payload: { product_id: "${p_oil}", capacity_ml: 10000, initial_volume_ml: 10000, reorder_point_ml: 2000, harvest_date: "2026-06-01T00:00:00Z" }
              as: InventoryManager
              captures: { f_id: $.data.id }
          trigger:
            - call: "POST /api/orders"
              payload: { lines: [ { line_type: "REFILL", product_id: "${p_oil}", quantity: 1, volume_ml: 333 } ] }
              as: Customer
              as_user_id: "${m_id}"
              captures: { o_id: $.data.id }
          assert:
            - "Order.${o_id}.provisional_subtotal_cents == 100"
            - "Order.${o_id}.provisional_total_cents == 1095"

      - name: fusti_freshness_unopened_sensory_equals_label
        claim_type: Variant Selection
        grounds: [calculations.fusti_freshness, entities.Fusti.first_draw_at]
        distinguishing_aspect: "While first_draw_at is null, sensory_freshness_score equals label_freshness_score (both 94.44 for a 30-day-old 540-shelf batch at clock 2026-07-01)."
        test_recipe:
          setup: ["An unopened BULK_OIL fusti harvested 2026-06-01 (shelf 540); clock at default 2026-07-01."]
          setup_api_calls:
            - call: "POST /api/products"
              payload: { sku: "COR-FR-OIL", name: "EVOO FR", product_type: "BULK_OIL", price_per_ml_cents: 0.30, shelf_life_days: 540 }
              as: InventoryManager
              captures: { p_oil: $.data.id }
            - call: "POST /api/fusti"
              payload: { product_id: "${p_oil}", capacity_ml: 10000, initial_volume_ml: 10000, reorder_point_ml: 2000, harvest_date: "2026-06-01T00:00:00Z" }
              as: InventoryManager
              captures: { f_id: $.data.id }
          trigger:
            - call: "GET /api/fusti/${f_id}"
              payload: {}
              as: InventoryManager
              captures: { lbl: $.data.label_freshness_score, sns: $.data.sensory_freshness_score }
          assert:
            - "Fusti.${f_id}.label_freshness_score == 94.44"
            - "Fusti.${f_id}.sensory_freshness_score == 94.44"

      - name: fulfill_freshness_markdown_refunds_delta_to_wallet
        claim_type: Reconciliation
        grounds: [calculations.order_line_pricing, entities.Member.wallet_credit_cents, entities.Order.final_total_cents]
        distinguishing_aspect: "When the final total (2270) is below the provisional total (2495) due to freshness markdown, fulfill refunds the 225-cent delta into the member's wallet_credit_cents."
        test_recipe:
          setup: ["Same as difficulty order_pricing_provisional_vs_final: a paid 5000ml REFILL order fulfilled at clock 2026-06-30 (label 66.67 < 70)."]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-29T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/members"
              payload: { email: "cor-rc@x.com", full_name: "RC" }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /api/products"
              payload: { sku: "COR-RC-OIL", name: "EVOO RC", product_type: "BULK_OIL", price_per_ml_cents: 0.30, shelf_life_days: 540 }
              as: InventoryManager
              captures: { p_oil: $.data.id }
            - call: "POST /api/fusti"
              payload: { product_id: "${p_oil}", capacity_ml: 10000, initial_volume_ml: 10000, reorder_point_ml: 2000, harvest_date: "2026-01-01T00:00:00Z" }
              as: InventoryManager
              captures: { f_id: $.data.id }
            - call: "POST /api/orders"
              payload: { lines: [ { line_type: "REFILL", product_id: "${p_oil}", quantity: 1, volume_ml: 5000 } ] }
              as: Customer
              as_user_id: "${m_id}"
              captures: { o_id: $.data.id, o_v: $.data.version }
            - call: "POST /api/orders/${o_id}/pay"
              payload: { expected_order_version: "${o_v}" }
              as: Customer
              as_user_id: "${m_id}"
              captures: { o_v2: $.data.version }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-30T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/orders/${o_id}/fulfill"
              payload: { expected_order_version: "${o_v2}" }
              as: ShopStaff
          assert:
            - "Order.${o_id}.final_total_cents == 2270"
            - "Member.${m_id}.wallet_credit_cents == 225"

  # ==========================================================================
  - section: validations
    instances:
      - name: zero_volume_refill_returns_invalid_quantity
        claim_type: Violation to Error
        grounds: ["validations[priority=9]", "errors[ERR_INVALID_QUANTITY]"]
        distinguishing_aspect: "A REFILL order line with volume_ml 0 is rejected at creation with ERR_INVALID_QUANTITY."
        test_recipe:
          setup: ["A member and a BULK_OIL product."]
          setup_api_calls:
            - call: "POST /api/members"
              payload: { email: "cor-zv@x.com", full_name: "ZV" }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /api/products"
              payload: { sku: "COR-ZV-OIL", name: "EVOO ZV", product_type: "BULK_OIL", price_per_ml_cents: 0.30, shelf_life_days: 540 }
              as: InventoryManager
              captures: { p_oil: $.data.id }
          trigger:
            - call: "POST /api/orders"
              payload: { lines: [ { line_type: "REFILL", product_id: "${p_oil}", quantity: 1, volume_ml: 0 } ] }
              as: Customer
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_QUANTITY"

      - name: duplicate_sku_returns_conflict
        claim_type: Violation to Error
        grounds: ["validations[priority=19]", "errors[ERR_DUPLICATE_SKU]"]
        distinguishing_aspect: "Creating a second product with an existing sku returns ERR_DUPLICATE_SKU (409)."
        test_recipe:
          setup: ["One product with sku COR-DUP already created."]
          setup_api_calls:
            - call: "POST /api/products"
              payload: { sku: "COR-DUP", name: "First", product_type: "BOTTLE", unit_price_cents: 1000 }
              as: InventoryManager
          trigger:
            - call: "POST /api/products"
              payload: { sku: "COR-DUP", name: "Second", product_type: "BOTTLE", unit_price_cents: 1500 }
              as: InventoryManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_DUPLICATE_SKU"

      - name: bundle_component_referencing_set_returns_invalid_component
        claim_type: Violation to Error
        grounds: ["validations[priority=10]", "errors[ERR_INVALID_COMPONENT]"]
        distinguishing_aspect: "Adding a component whose product is itself a GIFT_SET returns ERR_INVALID_COMPONENT."
        test_recipe:
          setup: ["Two GIFT_SET products; one is nested as a component of the other (illegal)."]
          setup_api_calls:
            - call: "POST /api/products"
              payload: { sku: "COR-SET-OUTER", name: "Outer Set", product_type: "GIFT_SET" }
              as: InventoryManager
              captures: { outer: $.data.id }
            - call: "POST /api/products"
              payload: { sku: "COR-SET-INNER", name: "Inner Set", product_type: "GIFT_SET" }
              as: InventoryManager
              captures: { inner: $.data.id }
          trigger:
            - call: "POST /api/products/${outer}/components"
              payload: { component_product_id: "${inner}", quantity: 1 }
              as: InventoryManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_COMPONENT"

      - name: book_session_in_past_returns_error
        claim_type: Temporal validation
        grounds: ["validations[priority=16]", "errors[ERR_SESSION_IN_PAST]"]
        distinguishing_aspect: "Booking a session whose start_at is before the logical clock returns ERR_SESSION_IN_PAST."
        test_recipe:
