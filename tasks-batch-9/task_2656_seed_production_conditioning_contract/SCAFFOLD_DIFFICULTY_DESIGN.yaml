      - name: tag_issuance_at_germination_validity_instant
        grounds:
          - validations.priority_49_ERR_GERMINATION_VALIDITY_EXPIRED
          - validations.priority_50_ERR_RETEST_NOT_DUE
          - calculations.carryover_retest_window
        distinguishing_aspect: |
          A DIFFERENT METRIC on DIFFERENT ENDPOINTS: the instant SeedLot.germination_valid_until
          (2026-09-14T00:00:00Z plus 270 days == 2027-06-11T00:00:00Z) measured on POST
          /seed-ops/certification-tags and POST /seed-ops/seed-lots/{seed_lot_id}/carryover. The same instant
          is inclusive for tagging (rule 49 fires only when now > valid_until) and exclusive for carryover
          (rule 50 requires now > valid_until), so at exactly 2027-06-11T00:00:00Z tagging succeeds while
          carryover is refused, and one day later carryover succeeds.
