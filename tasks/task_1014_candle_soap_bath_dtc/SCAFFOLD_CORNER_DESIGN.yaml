            - { call: "POST /skus/${s1}/batches", payload: { quantity_produced: 50, line_code: "OLL", cure_starts_at: "2026-06-01T00:00:00Z", cure_ends_at: "2026-06-05T00:00:00Z" }, as: MerchOps, captures: { b1: "$.data.id" } }
            - { call: "POST /batches/${b1}/release", payload: {}, as: MerchOps }
