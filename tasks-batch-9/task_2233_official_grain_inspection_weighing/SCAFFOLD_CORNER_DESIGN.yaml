            - "422 ERR_APPEAL_QUORUM_NOT_MET: votes_cast_count == 3 but effective_votes_count == 2 (the ABSTAIN is excluded) against required_panel_size 3"
            - "GET /grain-inspection/appeals/${ap} -> status still UNDER_REVIEW, decided_at == null, refund_cents == 0; GET /grain-inspection/certificates/${cert} -> status still UNDER_APPEAL"
            - "After V4 casts UPHOLD with a fresh expected_appeal_version, effective_votes_count == 3, revise_votes_count == 1 and abstain_votes_count == 1"
            - "The identical decide call then -> 200 with status DECIDED_UPHELD because 1 * 2 == 2 <= 3, even though the regrade assigned US_NO_2 / TEST_WEIGHT against the US_NO_1 snapshot"
            - "Side effects of the uphold: refund_cents == 0, Certificate.status back to ISSUED, grading_status back to GRADE_CERTIFIED, Sample.portions_retained back to 0, grade_revision_count still 0"
            - "GET /grain-inspection/inspectors/${i0} -> appeal_reversal_count == 0 and performance_score == 100: an upheld appeal never penalises the original inspector"
            - "GET /grain-inspection/applicants/${app} -> charges_total_cents == 30000 (10000 fee + 20000 deposit), credits_total_cents == 0, open_balance_cents == 30000"

