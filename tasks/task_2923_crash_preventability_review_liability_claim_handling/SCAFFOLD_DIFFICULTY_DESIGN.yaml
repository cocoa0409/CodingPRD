              as: Dispatcher
              as_user_id: "disp-001"
              captures: { e_cam_id: $.data.id }
            - call: "POST /crashes/${c_id}/evidence-items"
              payload: { kind: "ELD_LOG", source_device_id: "ELD-50110", window_start_at: "2026-07-30T13:00:00Z", window_end_at: "2026-07-30T15:00:00Z", retention_deadline_at: "2026-09-30T00:00:00Z" }
