              captures: { k_att_status: $.data.status, k_att_by: $.data.attested_by_clinician_id }
            - call: "POST /clinicians"
              payload: { full_name: "Dr Priya Venkat", npi: "2000000004", credential: "MD", injection_privilege: true, max_injections_per_day: 12 }
              as: PracticeAdmin
              captures: { k_cl4_id: $.data.id }
          trigger:
            - call: "POST /injection-encounters/${k_enc_np_id}/attest-wastage"
              payload: { attested_wasted_ml: 0.21 }
