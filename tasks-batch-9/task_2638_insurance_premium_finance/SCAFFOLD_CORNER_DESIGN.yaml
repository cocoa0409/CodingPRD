              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { xr_pol_c: "$.data.id" }
            - call: "GET /policies/${xr_pol_a}"
              payload: {}
              as: FinanceAnalyst
              captures: { xr_read_agr: "$.data.agreement_id", xr_read_ins: "$.data.insurer_id", xr_read_gross: "$.data.gross_premium_cents" }
            - call: "GET /policies"
              payload: { agreement_id: "${xr_agr}", limit: 50 }
              as: FinanceAnalyst
            - call: "GET /policies"
              payload: { insurer_id: "${xr_ins_a}", limit: 50 }
              as: FinanceAnalyst
            - call: "GET /policies"
              payload: { agreement_id: "${xr_agr}", insurer_id: "${xr_ins_b}", limit: 50 }
              as: FinanceAnalyst
              captures: { xr_ab_first: "$.data[0].id" }
            - call: "GET /agreements/${xr_agr}"
              payload: {}
              as: FinanceAnalyst
              captures: { xr_agr_pc: "$.data.policy_count", xr_agr_vpc: "$.data.verified_policy_count" }
            - call: "GET /agents/${xr_agent}"
              payload: {}
              as: FinanceAnalyst
              captures: { xr_agent_status: "$.data.status" }
          assert:
            - "MISSING PATH PARENT: ${xr_e_path} == 'ERR_AGREEMENT_NOT_FOUND' with HTTP 404, resolved at priority 3 before the body is inspected"
            - "MISSING BODY PARENT: ${xr_e_body} == 'ERR_INSURER_NOT_FOUND' with HTTP 404, resolved at priority 4 — the same call yields two different codes depending on which end is dangling"
            - "the link is written on both ends: ${xr_pol_a_agr} == ${xr_agr} and ${xr_pol_a_ins} == ${xr_ins_a}, with ${xr_pol_a_status} == 'PENDING_VERIFICATION'"
            - "the read-back agrees: ${xr_read_agr} == ${xr_agr}, ${xr_read_ins} == ${xr_ins_a} and ${xr_read_gross} == 600000"
            - "NAVIGABLE FROM THE NOTE: GET /policies?agreement_id=${xr_agr} returns total_count == 2 (${xr_pol_a} and ${xr_pol_b}) and excludes ${xr_pol_c}, which hangs off the other note"
            - "NAVIGABLE FROM THE CARRIER: GET /policies?insurer_id=${xr_ins_a} returns total_count == 2 (${xr_pol_a} and ${xr_pol_c}) and excludes ${xr_pol_b}, which names the other carrier"
            - "the two filters intersect: GET /policies?agreement_id=${xr_agr}&insurer_id=${xr_ins_b} returns total_count == 1 with ${xr_ab_first} == ${xr_pol_b} and ${xr_pol_b_ins} == ${xr_ins_b}"
            - "the derived counter followed the link: ${xr_agr_pc0} == 0 at creation and ${xr_agr_pc} == 2 afterwards, while ${xr_agr_vpc} == 0 because nothing has been attested"
            - "${xr_agent_status} == 'ACTIVE' — nothing about linking policies disturbed the third party named on the note"

      - name: computed_read_payoff_quote_recomputes_from_the_ledger_without_touching_it
        claim_type: computed_read
        grounds:
          - endpoints.GET_/agreements/{id}/payoff-quote
          - calculations.unearned_finance_charge_rebate.formula
          - entities.PremiumFinanceAgreement.fields.late_fee_balance_cents
        distinguishing_aspect: |
          The quote is a pure function of the ledger, and every one of its seven fields must be
          derivable by hand from the note: gross balance, the Rule-of-78s rebate on the unexpired term,
          the outstanding fee balance, unapplied credit, and the net that combines them. Two properties
          are asserted that implementations routinely get wrong. First, under RULE_OF_78 the rebate is
          driven by the COUNT of paid installments, not by the calendar, so overriding as_of_date moves
          only the echoed date and not a single cent. Second, the endpoint is read-only: repeated calls
          leave version, balances and statuses untouched, even though it runs a calculation rule.
        test_recipe:
