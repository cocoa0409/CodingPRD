            - "The file is submitted, so AppraisalReview.second_valuation_status is SECOND_REQUIRED."
            - "The primary appraisal is accepted at 55000000; because a second valuation is required the primary dimension stays PRIMARY_PENDING_REVIEW."
            - "The points-and-fees test (PASS, no fee items) and the ATR determination (EXEMPT, business purpose) are both run."
