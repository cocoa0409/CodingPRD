  - rule_id: non_linear_state_machine
    instances:
      - name: ad_creative_two_axes_advance_independently_with_destination_cycle
        grounds:
          - state_machines.AdCreative.destination_status
          - state_machines.AdCreative.review_status.PENDING_MANUAL_REVIEW_to_AUTO_APPROVED
          - calculations.destination_check_result
          - calculations.creative_risk_score
          - calculations.serving_eligibility_gate
        distinguishing_aspect: |
          AdCreative carries two parallel state dimensions on one row. The destination axis
          walks DESTINATION_PENDING -> MISMATCH_FLAGGED -> DESTINATION_CLEARED (a genuine
          cycle back into a state it already left) while review_status stays pinned at
          PENDING_MANUAL_REVIEW throughout, and the later review APPROVE moves only the
          review axis and leaves DESTINATION_CLEARED untouched. A single-axis
          implementation would either re-route the review axis on the mismatch or reset
          the destination axis on approval.
        test_recipe:
          setup:
            - "Rule ALC_SPIRITS (RESTRICTED, weight 6.00, requires_certification true, requires_disclaimer true, auto 0.90, manual 0.55, sla 48, default_queue REGULATED_CERT) with a US override RESTRICTED_CERT_REQUIRED, requires_license true, requires_disclaimer true, severity_multiplier 1.50."
            - "One advertiser with identity_status and business_standing_status both driven to VERIFIED."
            - "One reviewer with queue_specialties [REGULATED_CERT] and country_authorizations [US]."
            - "One creative targeting US only, display_url host www.northharbor.example, disclaimer_text present, political_flag false."
            - "The creative is submitted (destination_status -> DESTINATION_PENDING) and screened with ALC_SPIRITS at confidence 0.80, which is above the manual threshold and below the auto threshold, so it lands in PENDING_MANUAL_REVIEW with risk_score_provisional 7.20."
          setup_api_calls:
            - call: "POST /ad-policy/policy-rules"
              payload: { code: "ALC_SPIRITS", title: "Alcohol - spirits", category_class: "RESTRICTED", base_severity_weight: 6.00, requires_certification: true, requires_disclaimer: true, confidence_auto_disapprove_threshold: 0.90, confidence_manual_threshold: 0.55, review_sla_hours: 48, default_queue: "REGULATED_CERT" }
              as: PolicyAdmin
              captures: { alc_id: "$.data.id" }
            - call: "POST /ad-policy/policy-rules/${alc_id}/country-overrides"
              payload: { country_code: "US", disposition: "RESTRICTED_CERT_REQUIRED", requires_license: true, requires_disclaimer: true, severity_multiplier: 1.50 }
              as: PolicyAdmin
            - call: "POST /ad-policy/advertisers"
              payload: { legal_name: "North Harbor Spirits LLC", country_code: "US", industry_code: "ALCOHOL" }
              as: PolicyAdmin
              captures: { adv_id: "$.data.id" }
            - call: "POST /ad-policy/advertisers/${adv_id}/verifications"
