          trigger:
            - call: "POST /position-slots"
              payload: { plan_id: "${plan_id}", position_type_id: "${pt_id}", zone_code: "Z100", shift_start: "2026-09-20T14:00:00Z", shift_end: "2026-09-20T20:00:00Z" }
              as: StaffingCoordinator
              captures: { slot_id: $.data.id, derived: $.data.ratio_derived_headcount, required: $.data.required_headcount, cost: $.data.slot_labor_cost_cents }
            - call: "POST /staffing-plans/${plan_id}/activate"
              payload: { expected_event_version: "${ev_v1}" }
