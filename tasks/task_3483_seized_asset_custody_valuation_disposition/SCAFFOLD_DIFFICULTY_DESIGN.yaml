  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: expense_cost_reversal_invariant
        grounds:
          - entities.Asset.fields.accumulated_net_holding_cost_cents
          - entities.ExpenseEntry.fields.entry_kind
          - state_machines.ExpenseEntry
        distinguishing_aspect: "Conserved quantity = Asset.accumulated_net_holding_cost_cents: posting COST 30000 and then REVERSAL 30000 leaves the accumulator exactly at its pre-pair value 80000 (60000 + 40000 COST - 20000 REVENUE_OFFSET), and the ledger shows both compensating entries rather than an edit."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. Case open; one VEHICLE asset (legal SEIZED — no valuation needed for ledger posting)."
            - "Ledger seeded: COST 60000, COST 40000, REVENUE_OFFSET 20000 -> accumulated 80000."
          setup_api_calls:
            - call: "POST /custody/cases"
              payload: { case_number: "26-MJ-0017", judicial_district: "E.D. Mich.", forfeiture_type: "CIVIL", lead_agency_code: "DEA" }
              as: CaseAgent
              captures: { case17: $.data.id }
            - call: "POST /custody/assets"
              payload: { seizure_case_id: "${case17}", asset_type: "VEHICLE", description: "trailer", seized_on: "2026-09-01T00:00:00Z", seizure_condition_grade: "GOOD" }
              as: AssetCustodian
              captures: { la: $.data.id }
            - call: "POST /custody/expense-entries"
              payload: { asset_id: "${la}", entry_kind: "COST", expense_type: "STORAGE", amount_cents: 60000, incurred_on: "2026-09-02T00:00:00Z" }
              as: AssetCustodian
            - call: "POST /custody/expense-entries"
              payload: { asset_id: "${la}", entry_kind: "COST", expense_type: "MAINTENANCE", amount_cents: 40000, incurred_on: "2026-09-03T00:00:00Z" }
              as: AssetCustodian
            - call: "POST /custody/expense-entries"
              payload: { asset_id: "${la}", entry_kind: "REVENUE_OFFSET", expense_type: "MANAGEMENT_FEE", amount_cents: 20000, incurred_on: "2026-09-04T00:00:00Z" }
              as: AssetCustodian
            - call: "GET /custody/assets/${la}"
              payload: {}
              as: AssetCustodian
              as_user_id: "ac-dana"
              captures: { la_base: $.data.accumulated_net_holding_cost_cents }
          trigger:
            - call: "POST /custody/expense-entries"
              payload: { asset_id: "${la}", entry_kind: "COST", expense_type: "SECURITY", amount_cents: 30000, incurred_on: "2026-09-05T00:00:00Z" }
              as: AssetCustodian
            - call: "POST /custody/expense-entries"
              payload: { asset_id: "${la}", entry_kind: "REVERSAL", expense_type: "SECURITY", amount_cents: 30000, incurred_on: "2026-09-05T01:00:00Z" }
              as: AssetCustodian
            - call: "GET /custody/assets/${la}"
              payload: {}
              as: AssetCustodian
              as_user_id: "ac-dana"
            - call: "GET /custody/assets/${la}/expense-entries"
              payload: {}
              as: AssetCustodian
              as_user_id: "ac-dana"
          assert:
            - "la_base == 80000 before the compensating pair"
            - "after COST 30000 + REVERSAL 30000: Asset.${la}.accumulated_net_holding_cost_cents == 80000 — the pair conserves the accumulator"
            - "GET expense-entries lists 5 entries; the REVERSAL entry persists as its own row (no mutation of the original COST row)"

      - name: distribution_approve_rescind_pool_invariant
        grounds:
          - state_machines.Distribution
          - entities.SeizureCase.fields.available_proceeds_cents
        distinguishing_aspect: "Different conserved quantity from the expense invariant: SeizureCase.available_proceeds_cents. Approve (PAID) drops the pool 1530000 -> 1030000; the compensating rescind credits it back to exactly 1530000, and equitable_shares_paid_cents returns to 0."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. Case forfeited; VEHICLE asset appraised 2000000 EXCELLENT; SELL; authorized; sold at 2000000 (fee 170000, net 1830000); one VERIFIED lien of 300000 paid by the waterfall; no holding costs -> available_proceeds_cents == 1530000."
            - "EQUITABLE_SHARE distribution of 500000 created by FundAdministrator fa-lenovo."
          setup_api_calls:
            - call: "POST /custody/cases"
              payload: { case_number: "26-MJ-0018", judicial_district: "S.D. Tex.", forfeiture_type: "CRIMINAL", lead_agency_code: "FBI" }
