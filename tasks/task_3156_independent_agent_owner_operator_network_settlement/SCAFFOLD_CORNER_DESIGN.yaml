            - "the second call returns 201 and Load.${load_ok}.origin_state == \"OK\""
            - "the second call succeeds because OK is a member of territory_codes even though it is the second entry in the array"
            - "GET /network/loads?agent_id=${agent_id} returns exactly 1 row"

