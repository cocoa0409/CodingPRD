              captures: { e_zero: $.data.error_id }
            - call: "POST /chargemaster/code-update-cycles/${cycle}/entries"
              payload: { action: "REVISE", old_code_value: "93460", new_code_value: "93460A" }
              as: RevenueIntegrityAnalyst
              as_user_id: "ria_1"
              captures: { e2: $.data.id }
            - call: "POST /chargemaster/code-update-entries/${e2}/disposition"
              payload: { action: "MAP" }
              as: RevenueIntegrityAnalyst
