      - name: inventory_movement_rejects_a_witness_that_is_the_actor
        claim_type: conditional_action
        grounds:
          - endpoints.POST_/otp/inventory-transactions
          - validations[priority=17]
          - errors[ERR_WITNESS_REQUIRED]
        distinguishing_aspect: "The witness requirement is conditional on the movement type: a RECEIPT row needs no witness at all, while a DESTRUCTION row with a witness_staff_id equal to the acting X-User-ID is rejected at 422 ERR_WITNESS_REQUIRED."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One CA program and one METHADONE lot holding 500.0 mg."
          setup_api_calls:
            - *c_clock
            - *c_prog
            - call: "POST /otp/inventory-lots"
              payload: { program_id: "${prog_id}", medication: "METHADONE", lot_number: "LOT-W", expiration_date: "2027-06-30", quantity_received_mg: 500.0, dose_potency_mg_per_unit: 1.0, reusable_for_take_home: false }
              as: ProgramAdministrator
