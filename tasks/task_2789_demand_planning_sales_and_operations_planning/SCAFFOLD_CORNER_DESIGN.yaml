      - name: accuracy_record_ape_pct_is_null_when_actual_units_zero
        claim_type: Precision
        grounds:
          - calculations.calc_accuracy_record
          - calculations.calc_accuracy_rollup
          - entities.AccuracyRecord.fields.ape_pct
          - endpoints[GET /sop/planning-cycles/{cycle_id}/accuracy-summary]
        distinguishing_aspect: |
          A zero-actual line has no defined percentage error, so ape_pct is null rather than 0
          or an error. It still contributes its 500 units of absolute error to
          total_abs_error_units, but because total_actual_units is 0 both wmape_pct and bias_pct
          are null too, which forces accuracy_grade UNGRADED and bias_flag NONE — while
          scored_record_count still counts the row.
        test_recipe:
          setup:
            - "The base family and customer, one MATURE item, and a cycle over 2026-09..2026-09 with commitment 0 carrying one locked forecast of 500 units, walked all the way to PUBLISHED."
          setup_api_calls:
            - call: "POST /sop/product-families"
              payload: { family_code: "FAM-BASE", name: "Base Family", accountable_planner_user_id: "planner-1", units_per_hour: 100, max_monthly_hours: 800 }
              as: SopAdmin
              captures: { fam_id: $.data.id }
