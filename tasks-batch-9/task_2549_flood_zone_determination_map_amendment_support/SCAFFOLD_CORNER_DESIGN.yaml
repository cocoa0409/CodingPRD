            - call: "POST /flood-zone/determinations"
              payload: { loan_folio_id: "${f_a_id}", structure_id: "${st_a_id}", determination_type: "ORIGINATION", expected_loan_folio_version: "${f_a_v0}" }
              as: ProviderAnalyst
              as_user_id: "analyst-1"
              captures: { det_1_id: $.data.id }
          trigger:
            - call: "POST /flood-zone/determinations"
              payload: { loan_folio_id: "${f_a_id}", structure_id: "${st_a_id}", determination_type: "LIFE_OF_LOAN_REVIEW", expected_loan_folio_version: "${f_a_v0}" }
              as: ProviderAnalyst
              as_user_id: "analyst-1"
            - call: "GET /flood-zone/loan-folios/${f_a_id}"
              as: ProviderAnalyst
              captures: { f_a_v1: $.data.version, f_a_current_det: $.data.current_determination_id }
            - call: "POST /flood-zone/determinations"
              payload: { loan_folio_id: "${f_a_id}", structure_id: "${st_a_id}", determination_type: "LIFE_OF_LOAN_REVIEW", expected_loan_folio_version: "${f_a_v1}" }
              as: ProviderAnalyst
              as_user_id: "analyst-1"
              captures: { det_2_id: $.data.id, det_2_supersedes: $.data.supersedes_determination_id }
            - call: "GET /flood-zone/loan-folios/${f_a_id}"
              as: ProviderAnalyst
              captures: { f_a_v2: $.data.version }
          assert:
            - "the replay with ${f_a_v0} returns 412 with data.error_id == ERR_STALE_LOAN_FOLIO_VERSION, because the origination determination already advanced the folio to ${f_a_v1} == ${f_a_v0} + 1"
            - "the rejected write left no trace: GET /flood-zone/determinations?loan_folio_id=${f_a_id} still returns total_count == 1, LoanFolio.current_determination_id == ${det_1_id} and the version is unchanged at ${f_a_v1}"
