      - call: GET /tnr/clinic-days/${day_id}
        payload: {}
        as: ClinicStaff
        captures:
          day_v3: $.data.version
      - call: POST /tnr/appointments
        payload:
          cat_id: ${c3}
          clinic_slot_id: ${s4}
          trap_date: '2026-08-19T00:00:00Z'
          expected_clinic_day_version: ${day_v3}
        as: Caretaker
        as_user_id: ${ct_id}
        captures:
          ap4: $.data.id
      - call: POST /tnr/appointments/${ap4}/mark-trapped
        payload: {}
        as: Caretaker
        as_user_id: ${ct_id}
      - call: POST /tnr/appointments/${ap4}/check-in
