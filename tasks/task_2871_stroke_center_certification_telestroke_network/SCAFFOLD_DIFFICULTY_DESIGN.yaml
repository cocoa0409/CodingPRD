        payload:
          suspension_reason: state survey findings pending remediation
        as: CertificationReviewer
        as_user_id: cr_dana
      assert:
      - ${pre_state} == IN_CONSULT and ${pre_active} == 1 before the suspension
      - HOP 1 — StrokeCenter.${hub_id}.certification_status == SUSPENDED, suspension_reason is the supplied text, and ems_routing_posture == BYPASS (the BYPASS clause wins ahead of open_case_count)
      - HOP 2 — SpokeAgreement.${agr_id}.status == SUSPENDED with suspension_reason 'hub certification suspended'
      - HOP 3 — TelestrokeConsult.${tc_k}.status == CANCELLED with cancellation_reason 'agreement suspended', and assigned_neurologist_id is RETAINED as ${n1_id} for audit
      - HOP 4 — Neurologist.${n1_id}.on_call_state == ON_CALL and active_consult_count == 0
      - 'HOP 4 — Neurologist.${n1_id}.last_consult_completed_at == null and completed_consult_count == 0: a cancellation releases the neurologist WITHOUT recording a completion, so no cooldown is armed'
      - HOP 4 — exactly one SYSTEM_DETECTED ProtocolDeviation with deviation_type CONSULT_UNFILLED, severity MAJOR, opened_by_user_id 'system' and status OPEN exists on case ${tc_id}, so CodeStrokeCase.${tc_id}.deviation_count == 1
      - SpokeAgreement.${agr_id}.active_consult_count == 0
      - CodeStrokeCase.${tc_id}.status == CONSULT_IN_PROGRESS — the cascade stops at the consult and does not close or abort the case
      - 'StrokeCenter.${spoke_id}.certification_status == PROVISIONAL and ems_routing_posture == ROUTINE: the cascade follows the AGREEMENT, not the geography, so the untouched spoke keeps its own posture'
      - reversing hop order (cancelling consults before suspending the agreement) would leave SpokeAgreement.${agr_id}.active_consult_count stale at 1
  - name: handoff_settlement_cascades_case_closure_origin_release_and_deviation
    grounds:
    - 'state_machines.TransferDecision: ACCEPTED -> HANDOFF_COMPLETE (four-hop cascade)'
    - 'state_machines.CodeStrokeCase: TRANSFER_INITIATED -> CLOSED'
    - calculations.handoff_settlement_sequence
    - calculations.ems_routing_posture
    - calculations.projected_door_in_door_out
    - endpoints.POST /stroke-network/transfer-decisions/{id}/complete-handoff
    distinguishing_aspect: 'DEPTH 4 as well, but triggered by TransferDecision ACCEPTED -> HANDOFF_COMPLETE — a completely different transition, a different root entity and a different terminal quantity. Hop 1 settles the decision and computes door_in_door_out_minutes; hop 2 is the CodeStrokeCase TRANSFER_INITIATED -> CLOSED caused by hop 1; hop 3 is the ORIGIN centre''s open_case_count decrement and posture recomputation caused by hop 2 (note: the DESTINATION''s count is deliberately NOT released — the patient is now there); hop 4 is the DIDO_EXCEEDED deviation caused by hop 1''s computed interval. Hop 3 flips a threshold: 3 open cases -> 2 turns DIVERT_ADVISORY back into ROUTINE inside the same request.'
