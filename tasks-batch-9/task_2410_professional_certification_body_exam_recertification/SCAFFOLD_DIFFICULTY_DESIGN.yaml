    instances:

      - name: item_retirement_cascades_four_hops_item_to_form_to_registration_to_session_seats
        grounds:
          - state_machines.Item.OPERATIONAL_to_RETIRED
          - calculations.form_retirement_tolerance
          - state_machines.ExamForm.PUBLISHED_to_NEEDS_REBUILD
          - state_machines.ExamRegistration.SCHEDULED_to_UNSCHEDULED
          - calculations.session_seat_occupancy
          - calculations.blueprint_posture
          - entities.ExamRegistration.fields.form_reassignment_required
        distinguishing_aspect: |
          One POST /items/{id}/retire propagates through FOUR entities that the caller never
          names: the Item goes RETIRED, the form's retired_item_count rises to 1 which trips
          form_retirement_tolerance (1*100 = 100 > 10 * 1) and pushes the PUBLISHED form to
          NEEDS_REBUILD, which un-schedules the already-SCHEDULED registration and sets
          form_reassignment_required, which in turn releases the seat so the session's
          seats_reserved falls back to 0 — and the programme's blueprint_posture flips to
          DEFICIENT because operational_item_count drops to 0.
