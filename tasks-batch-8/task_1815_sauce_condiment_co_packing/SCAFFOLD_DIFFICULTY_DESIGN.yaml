            - { call: "POST /copack/kettle-lines", payload: { line_name: "Kettle-1", capacity_units: 100000 }, as: OpsAdmin, captures: { k1: "$.data.id"} }
            - { call: "POST /copack/packaging-components", payload: { component_name: "5oz bottle", component_type: "BOTTLE", unit_cost_cents: 10, initial_on_hand_units: 2000 }, as: OpsAdmin, captures: { bx: "$.data.id"} }
            - { call: "POST /copack/production-runs", payload: { formula_id: "${f2}", kettle_line_id: "${k1}", planned_units: 2000, scheduled_start: "2026-09-15T08:00:00Z", scheduled_end: "2026-09-15T12:00:00Z", packaging_requirements: [ { component_id: "${bx}", quantity_per_unit: 1 } ] }, as: OpsAdmin, captures: { r1: "$.data.id"} }
          trigger:
            - { call: "POST /copack/production-runs/${r1}/confirm", payload: {}, as: OpsAdmin }
            - { call: "GET /copack/packaging-components/${bx}", payload: {}, as: OpsAdmin, captures: { bx_res: "$.data.reserved_units", bx_avail: "$.data.available_units"} }
          assert:
            - "ProductionRun.${r1}.status == CONFIRMED (required 2000 == available 2000: boundary inclusive)"
