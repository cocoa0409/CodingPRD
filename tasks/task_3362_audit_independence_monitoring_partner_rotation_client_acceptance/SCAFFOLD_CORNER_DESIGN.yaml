            - call: "POST /audit/affiliate-attestations"
              payload: { affiliate_id: "${aff_s}", engagement_id: "${eng_be1}", breach_count: 19 }
              as: PlatformAdmin
              captures: { att_s1: $.data.id }
            - call: "POST /audit/affiliate-attestations"
              payload: { affiliate_id: "${aff_s}", engagement_id: "${eng_be2}", breach_count: 15 }
              as: PlatformAdmin
              captures: { att_s2: $.data.id }
            - call: "POST /audit/affiliate-attestations/${att_s1}/transitions"
              payload: { action: "ATTEST" }
              as: IndependenceOfficer
            - call: "POST /audit/affiliate-attestations/${att_s1}/transitions"
              payload: { action: "REPORT_BREACH" }
              as: IndependenceOfficer
            - call: "POST /audit/affiliate-attestations/${att_s2}/transitions"
              payload: { action: "ATTEST" }
