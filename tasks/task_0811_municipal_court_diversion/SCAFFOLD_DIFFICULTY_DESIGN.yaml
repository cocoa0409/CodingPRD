  # =================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =================================================================
  - rule_id: compensating_invariant
    instances:
      - name: payment_reverse_preserves_ledger_balance
        grounds:
          - state_machines.LedgerAccount.SETTLED_to_ASSESSED
          - calculations.payment_waterfall
          - entities.LedgerAccount.fields.balance
        distinguishing_aspect: "Conserved quantity = LedgerAccount money balance, pinned as balance == assessed_amount - sum(Payment.amount where reversed==false). A $200 payment then its reversal returns balance to 540.00 and collected_amount to 0.00 (no drift)."
        test_recipe:
          setup:
            - "Granted diversion with final assessed 540.00 (balance 540); a single $200 payment has been recorded (balance 340), and its id captured."
          setup_api_calls:
            - call: "POST /defendants"
              payload: { full_name: "Ray Money", date_of_birth: "1990-05-19", email: "ray@x.com" }
              as: CourtClerk
              captures: { def_id: $.data.id }
            - call: "POST /cases"
              payload: { defendant_id: "${def_id}", citation_number: "C-1018", offense_date: "2026-03-01" }
              as: CourtClerk
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/charges"
              payload: { offense_code: "MC-14", severity: "MISDEMEANOR", base_fine_amount: 200, is_diversion_eligible: true }
              as: CourtClerk
            - call: "POST /courtrooms"
              payload: { name: "Room Q", room_code: "Q" }
              as: CourtAdmin
              captures: { room_id: $.data.id }
            - call: "POST /cases/${case_id}/arraignments"
              payload: { courtroom_id: "${room_id}", scheduled_start: "2026-03-06T15:00:00Z", scheduled_end: "2026-03-06T15:30:00Z" }
              as: CourtClerk
              captures: { arr_id: $.data.id }
            - call: "POST /arraignments/${arr_id}/plea"
              payload: { plea: "GUILTY" }
              as: Defendant
              as_user_id: "${def_id}"
            - call: "POST /cases/${case_id}/diversion-agreements"
              payload: { mandated_service_hours: 0, required_class_sessions: 0, program_fee: 100, program_deadline: "2026-06-01T00:00:00Z" }
              as: Judge
              captures: { div_id: $.data.id }
            - call: "GET /cases/${case_id}/ledger-account"
              payload: {}
              as: Cashier
              captures: { acct_id: "$.data[0].id" }
            - call: "POST /ledger-accounts/${acct_id}/payments"
              payload: { amount: 200.00 }
              as: Cashier
              captures: { pay_id: $.data.id }
          trigger:
            - call: "POST /payments/${pay_id}/reverse"
              payload: {}
              as: Cashier
          assert:
            - "LedgerAccount.${acct_id}.balance == 540.00"
            - "LedgerAccount.${acct_id}.collected_amount == 0.00"
            - "invariant holds: balance == assessed_amount - sum(Payment.amount where reversed == false)"

      - name: waive_preserves_assigned_service_hours
        grounds:
          - state_machines.ServiceAssignment.ASSIGNED_to_WAIVED
          - entities.DiversionAgreement.fields.assigned_service_hours
        distinguishing_aspect: "Conserved quantity = DiversionAgreement.assigned_service_hours, pinned as sum(required_hours over non-WAIVED assignments). Adding assignment B (+4, total 10) then waiving B returns assigned_service_hours to 6.00 — a different conserved quantity (service hours) than the money balance."
        test_recipe:
          setup:
            - "Granted+accepted diversion (mandated 10); assignment A required_hours 6 exists (assigned_service_hours 6), then assignment B required_hours 4 is added (assigned_service_hours 10, B captured)."
          setup_api_calls:
            - call: "POST /defendants"
              payload: { full_name: "Sam Hours", date_of_birth: "1990-06-20", email: "sam@x.com" }
              as: CourtClerk
              captures: { def_id: $.data.id }
            - call: "POST /cases"
              payload: { defendant_id: "${def_id}", citation_number: "C-1019", offense_date: "2026-03-01" }
              as: CourtClerk
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/charges"
              payload: { offense_code: "MC-14", severity: "MISDEMEANOR", base_fine_amount: 200, is_diversion_eligible: true }
              as: CourtClerk
            - call: "POST /courtrooms"
              payload: { name: "Room R", room_code: "R" }
              as: CourtAdmin
              captures: { room_id: $.data.id }
            - call: "POST /cases/${case_id}/arraignments"
              payload: { courtroom_id: "${room_id}", scheduled_start: "2026-03-06T16:00:00Z", scheduled_end: "2026-03-06T16:30:00Z" }
              as: CourtClerk
              captures: { arr_id: $.data.id }
            - call: "POST /arraignments/${arr_id}/plea"
              payload: { plea: "GUILTY" }
              as: Defendant
              as_user_id: "${def_id}"
            - call: "POST /cases/${case_id}/diversion-agreements"
              payload: { mandated_service_hours: 10, required_class_sessions: 0, program_fee: 100, program_deadline: "2026-06-01T00:00:00Z" }
              as: Judge
              captures: { div_id: $.data.id }
            - call: "POST /diversion-agreements/${div_id}/accept"
              payload: {}
              as: Defendant
              as_user_id: "${def_id}"
            - call: "POST /service-sites"
              payload: { name: "Trailhead", site_type: "COMMUNITY_SERVICE", concurrent_capacity: 5 }
              as: CourtAdmin
              captures: { site_id: $.data.id }
            - call: "POST /diversion-agreements/${div_id}/service-assignments"
              payload: { service_site_id: "${site_id}", assignment_type: "COMMUNITY_SERVICE", required_hours: 6, session_start: "2026-03-22T09:00:00Z", session_end: "2026-03-22T15:00:00Z" }
              as: ProbationOfficer
              as_user_id: "po_1"
            - call: "POST /diversion-agreements/${div_id}/service-assignments"
              payload: { service_site_id: "${site_id}", assignment_type: "COMMUNITY_SERVICE", required_hours: 4, session_start: "2026-03-23T09:00:00Z", session_end: "2026-03-23T13:00:00Z" }
              as: ProbationOfficer
              as_user_id: "po_1"
              captures: { sa_b_id: $.data.id }
          trigger:
            - call: "POST /service-assignments/${sa_b_id}/waive"
              payload: {}
              as: Judge
          assert:
            - "DiversionAgreement.${div_id}.assigned_service_hours == 6.00"
            - "invariant holds: assigned_service_hours == sum(required_hours over ServiceAssignments where status != WAIVED)"

