- section: validations
  instances:
  - name: request_missing_auth_header_returns_400
    claim_type: violation_to_error
    grounds:
    - validations[priority=1]
    - errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]
    distinguishing_aspect: Any call without X-User-ID/X-User-Role is rejected 400
      before role, existence, or state checks run.
    test_recipe:
      setup:
      - empty DB (no fixture needed)
      setup_api_calls: []
      trigger:
      - call: GET /tc/files/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2
        payload: {}
      assert:
      - 'Response: http 400 with error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
        (not 404 — auth precedes existence)'
  - name: agent_cannot_create_file_forbidden
    claim_type: violation_to_error
    grounds:
    - validations[priority=2]
    - errors[ERR_INSUFFICIENT_PERMISSIONS]
    distinguishing_aspect: Agent role is absent from POST /tc/files roles; the role
      check fires even with a well-formed payload.
    test_recipe:
      setup:
      - Coordinator with agent on roster
      setup_api_calls:
      - call: POST /tc/coordinators
        payload:
          full_name: Casey Coord
          email: casey@tc.example
          license_number: TC-1001
        as: SystemAdmin
        captures:
          coord_id: $.data.id
      - call: POST /tc/agents
        payload:
          full_name: Seller Sam
          email: sam@ag.example
          brokerage: Berkshire
        as: Coordinator
        as_user_id: ${coord_id}
        captures:
          seller_id: $.data.id
      trigger:
      - call: POST /tc/files
        payload:
          billing_model: PER_FILE
          state_code: TX
          contract_type: LISTING_ONLY
          property_address: 1 Main St
          effective_date: '2026-08-03'
          closing_date: '2026-08-31'
          list_price_cents: 45000000
          seller_agent_id: ${seller_id}
        as: Agent
        as_user_id: ${seller_id}
      assert:
      - 'Response: http 403 with error_id == ERR_INSUFFICIENT_PERMISSIONS'
  - name: coordinator_cannot_mutate_other_coordinators_file
    claim_type: violation_to_error
    grounds:
    - validations[priority=4]
    - errors[ERR_RESOURCE_NOT_OWNED]
    distinguishing_aspect: 'Ownership chain: a coordinator whose X-User-ID differs
      from file.coordinator_id is denied with ERR_RESOURCE_NOT_OWNED even though the
      role is correct.'
    test_recipe:
      setup:
      - Coordinator 1 owns an ACTIVE file; coordinator 2 exists
      setup_api_calls:
      - call: POST /tc/coordinators
        payload:
          full_name: Casey Coord
          email: casey@tc.example
          license_number: TC-1001
        as: SystemAdmin
        captures:
          coord1: $.data.id
      - call: POST /tc/coordinators
        payload:
          full_name: Dana Coord
          email: dana@tc.example
          license_number: TC-2002
        as: SystemAdmin
        captures:
          coord2: $.data.id
      - call: POST /tc/agents
        payload:
          full_name: Seller Sam
          email: sam@ag.example
          brokerage: Berkshire
        as: Coordinator
        as_user_id: ${coord1}
        captures:
          seller_id: $.data.id
      - call: POST /tc/checklist-templates
        payload:
          state_code: TX
          contract_type: LISTING_ONLY
          milestone_defs:
          - name: Listing Paperwork
            offset_days: 5
            mandatory: false
          required_doc_types: []
        as: SystemAdmin
        captures:
          tmpl_id: $.data.id
      - call: POST /tc/checklist-templates/${tmpl_id}/publish
        payload: {}
        as: SystemAdmin
      - call: POST /tc/files
        payload:
          billing_model: PER_FILE
          state_code: TX
          contract_type: LISTING_ONLY
          property_address: 1 Main St
          effective_date: '2026-08-03'
          closing_date: '2026-08-31'
          list_price_cents: 45000000
          seller_agent_id: ${seller_id}
          inspection_offset_days: 7
          appraisal_offset_days: 14
        as: Coordinator
        as_user_id: ${coord1}
        captures:
          file_id: $.data.id
      - call: POST /tc/files/${file_id}/activate
        payload: {}
        as: Coordinator
        as_user_id: ${coord1}
      trigger:
      - call: POST /tc/files/${file_id}/terminate
        payload:
          reason: poach attempt
        as: Coordinator
        as_user_id: ${coord2}
      assert:
      - 'Response: http 403 with error_id == ERR_RESOURCE_NOT_OWNED'
      - TransactionFile.${file_id}.status remains ACTIVE
