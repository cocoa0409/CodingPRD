              payload: {}
              as: FranchiseOwner
              as_user_id: "${f1_id}"
          assert:
            - "the pre-trigger GET showed Territory.${t1_id}.status == RESERVED and version == 1"
            - "response status == 200"
            - "Club.${c1_id}.status == OPEN"
            - "Club.${c1_id}.version == 2"
            - "Territory.${t1_id}.status == ACTIVE"
            - "Territory.${t1_id}.version == 2"

      - name: corner_publishing_an_already_published_plan_template_is_rejected
        claim_type: idempotency
        grounds:
          - state_machines.MembershipPlanTemplate.DRAFT_to_PUBLISHED
          - errors[ERR_INVALID_PLAN_STATE]
          - validations[priority 7]
        distinguishing_aspect: "publish is not idempotent: the second call finds status PUBLISHED, fails the DRAFT precondition and returns 409 ERR_INVALID_PLAN_STATE, and the template's version stays at 2 rather than climbing with each retry."
        test_recipe:
          setup:
            - "One PUBLISHED CORE12 plan template."
          setup_api_calls:
            - call: "POST /franchise/plan-templates"
              payload: { code: "CORE12", monthly_dues_cents: 4500, initiation_fee_cents: 4900, term_months: 12, cancellation_notice_days: 30, floor_price_cents: 3600 }
