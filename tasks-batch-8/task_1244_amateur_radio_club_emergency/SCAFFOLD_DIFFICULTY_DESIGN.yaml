scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: field_day_provisional_vs_final_score
        grounds:
          - calculations.field_day_scores
          - entities.FieldDayEvent.fields.provisional_score
          - entities.FieldDayEvent.fields.final_score
        distinguishing_aspect: |
          On the FieldDayEvent domain, the provisional variant counts ALL contacts (duplicates included)
          while the final variant excludes is_duplicate == true contacts, so identical contact data yields
          two different scores; this is a different entity domain than member_readiness (Member domain).
        test_recipe:
          setup:
            - "One ACTIVE member K1AAA; one FieldDayEvent OPEN in its window; three contacts logged (CW/QRP/B2M = 10 pts, DIGITAL/LOW/B80M = 4 pts, PHONE/HIGH/B40M = 1 pt); the 4-point contact then marked duplicate."
          setup_api_calls:
            - call: "POST /members"
              payload: { callsign: "K1AAA", full_name: "Op One", license_class: "EXTRA", license_expires_at: "2030-01-01T00:00:00Z" }
              as: ClubAdmin
              captures: { m1: $.data.id }
            - call: "POST /members/${m1}/renew"
              payload: { periods: 1 }
              as: ClubAdmin
            - call: "POST /field-day-events"
              payload: { name: "FD 2026", start_at: "2026-05-01T00:00:00Z", end_at: "2026-05-03T00:00:00Z" }
              as: ClubAdmin
              captures: { ev: $.data.id }
            - call: "POST /field-day-events/${ev}/set-status"
              payload: { to: "OPEN" }
              as: ClubAdmin
            - call: "POST /field-day-contacts"
              payload: { event_id: "${ev}", worked_callsign: "W1AW", band: "B2M", mode: "CW", power_category: "QRP" }
              as: Member
              as_user_id: "${m1}"
            - call: "POST /field-day-contacts"
              payload: { event_id: "${ev}", worked_callsign: "N0CALL", band: "B80M", mode: "DIGITAL", power_category: "LOW" }
              as: Member
              as_user_id: "${m1}"
              captures: { c2: $.data.id }
            - call: "POST /field-day-contacts"
              payload: { event_id: "${ev}", worked_callsign: "K9XYZ", band: "B40M", mode: "PHONE", power_category: "HIGH" }
              as: Member
              as_user_id: "${m1}"
            - call: "POST /field-day-contacts/${c2}/set-duplicate"
              payload: { is_duplicate: true }
              as: ClubAdmin
          trigger:
            - call: "GET /field-day-events/${ev}"
              payload: {}
              as: ClubAdmin
          assert:
            - "FieldDayEvent.${ev}.provisional_score == 15"
            - "FieldDayEvent.${ev}.final_score == 11"
            - "FieldDayEvent.${ev}.contact_count == 3"

      - name: member_readiness_optimistic_vs_verified
        grounds:
          - calculations.member_readiness
          - entities.Member.fields.readiness_score
          - entities.Member.fields.readiness_score_optimistic
        distinguishing_aspect: |
          On the Member domain, the verified variant counts only check-ins on CLOSED nets while the
          optimistic variant also counts OPEN nets, so the same single check-in on a still-OPEN net yields
          readiness_score 20 vs readiness_score_optimistic 28; different entity domain than field_day_scores.
        test_recipe:
          setup:
            - "Operational repeater (site agreement ACTIVE + GRANTED coordination); net-control member W1NCS; member K1OPR checked into a net that is OPEN but not yet CLOSED."
          setup_api_calls:
            - call: "POST /antenna-site-agreements"
              payload: { site_name: "Hilltop", owner_name: "County", lease_start: "2026-01-01T00:00:00Z", lease_end: "2027-12-31T00:00:00Z" }
              as: ClubAdmin
              captures: { asa: $.data.id }
            - call: "POST /antenna-site-agreements/${asa}/set-status"
              payload: { to: "ACTIVE" }
              as: ClubAdmin
            - call: "POST /repeaters"
              payload: { callsign: "W1RPT", output_frequency_mhz: 146.94, site_agreement_id: "${asa}" }
              as: ClubAdmin
              captures: { rep: $.data.id, rep_ver: $.data.version }
            - call: "POST /coordination-requests"
              payload: { repeater_id: "${rep}", requested_frequency_mhz: 146.94, expected_repeater_version: "${rep_ver}" }
              as: ClubAdmin
              captures: { cr: $.data.id }
            - call: "POST /coordination-requests/${cr}/submit"
              payload: {}
              as: ClubAdmin
            - call: "POST /coordination-requests/${cr}/record-decision"
              payload: { outcome: "GRANTED", council_reference: "C-001" }
              as: ClubAdmin
            - call: "POST /repeaters/${rep}/set-status"
              payload: { to: "OPERATIONAL" }
              as: ClubAdmin
            - call: "POST /members"
              payload: { callsign: "W1NCS", full_name: "Net Control", license_class: "EXTRA", license_expires_at: "2030-01-01T00:00:00Z" }
              as: ClubAdmin
              captures: { nc: $.data.id }
            - call: "POST /members/${nc}/renew"
              payload: { periods: 1 }
              as: ClubAdmin
            - call: "POST /members"
              payload: { callsign: "K1OPR", full_name: "Operator", license_class: "EXTRA", license_expires_at: "2030-01-01T00:00:00Z" }
              as: ClubAdmin
              captures: { m: $.data.id }
            - call: "POST /members/${m}/renew"
              payload: { periods: 1 }
              as: ClubAdmin
            - call: "POST /net-sessions"
              payload: { name: "ARES Net 1", repeater_id: "${rep}", scheduled_start: "2026-05-01T00:00:00Z", scheduled_end: "2026-05-02T00:00:00Z" }
              as: NetControl
              as_user_id: "${nc}"
              captures: { net: $.data.id }
            - call: "POST /net-sessions/${net}/set-status"
              payload: { to: "OPEN" }
              as: NetControl
              as_user_id: "${nc}"
            - call: "POST /check-ins"
              payload: { net_session_id: "${net}" }
              as: Member
              as_user_id: "${m}"
          trigger:
            - call: "GET /members/${m}"
              payload: {}
              as: ClubAdmin
          assert:
            - "Member.${m}.readiness_score == 20"
            - "Member.${m}.readiness_score_optimistic == 28"
            - "Member.${m}.readiness_tier == INELIGIBLE"

  - rule_id: combinatorial_formula
    instances:
      - name: contact_points_cap_multiplier_and_band_branch
        grounds:
          - calculations.contact_points
          - entities.FieldDayContact.fields.points
        distinguishing_aspect: |
          Mode (a): >= 3 inputs (mode, power_category, band) with non-linear interaction — the min() cap
          binds for CW/QRP/B2M (raw 12 -> 10), the power multiplier branch separates CW/LOW/B2M (6), and
          the band-bonus branch separates PHONE/HIGH/B2M (3) from PHONE/HIGH/B40M (1).
        test_recipe:
          setup:
            - "ACTIVE member K1AAA; FieldDayEvent OPEN within its window."
          setup_api_calls:
            - call: "POST /members"
              payload: { callsign: "K1AAA", full_name: "Op One", license_class: "EXTRA", license_expires_at: "2030-01-01T00:00:00Z" }
              as: ClubAdmin
              captures: { m1: $.data.id }
            - call: "POST /members/${m1}/renew"
              payload: { periods: 1 }
              as: ClubAdmin
            - call: "POST /field-day-events"
              payload: { name: "FD 2026", start_at: "2026-05-01T00:00:00Z", end_at: "2026-05-03T00:00:00Z" }
              as: ClubAdmin
              captures: { ev: $.data.id }
            - call: "POST /field-day-events/${ev}/set-status"
              payload: { to: "OPEN" }
              as: ClubAdmin
          trigger:
            - call: "POST /field-day-contacts"
              payload: { event_id: "${ev}", worked_callsign: "W1AW", band: "B2M", mode: "CW", power_category: "QRP" }
              as: Member
              as_user_id: "${m1}"
              captures: { c1: $.data.id }
            - call: "POST /field-day-contacts"
              payload: { event_id: "${ev}", worked_callsign: "N0CALL", band: "B2M", mode: "CW", power_category: "LOW" }
              as: Member
              as_user_id: "${m1}"
              captures: { c2: $.data.id }
            - call: "POST /field-day-contacts"
              payload: { event_id: "${ev}", worked_callsign: "K9XYZ", band: "B2M", mode: "PHONE", power_category: "HIGH" }
              as: Member
              as_user_id: "${m1}"
              captures: { c3: $.data.id }
          assert:
            - "FieldDayContact.${c1}.points == 10"
            - "FieldDayContact.${c2}.points == 6"
            - "FieldDayContact.${c3}.points == 3"

      - name: late_fee_component_rounding_order
        grounds:
          - calculations.equipment_late_fee
          - entities.EquipmentLoan.fields.late_fee_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: each fee component is rounded half-up to whole cents BEFORE summing —
          round_half_up(1005 * 0.10) = 101 (half-even or truncation would give 100), so the pinned order
          and mode produce late_fee_cents 551, distinct from the mode-(a) contact_points instance.
        test_recipe:
          setup:
            - "ACTIVE member K1AAA with an ACTIVE loan (item HT-100, value 1005 cents, due 2026-05-02T00:00:00Z); logical clock advanced to 2026-05-05T00:00:00Z so the loan is exactly 3 days overdue (OVERDUE via system transition)."
          setup_api_calls:
            - call: "POST /members"
              payload: { callsign: "K1AAA", full_name: "Op One", license_class: "EXTRA", license_expires_at: "2030-01-01T00:00:00Z" }
              as: ClubAdmin
              captures: { m1: $.data.id }
            - call: "POST /members/${m1}/renew"
              payload: { periods: 1 }
              as: ClubAdmin
            - call: "POST /equipment-loans"
              payload: { item_tag: "HT-100", due_at: "2026-05-02T00:00:00Z", estimated_value_cents: 1005 }
              as: Member
              as_user_id: "${m1}"
              captures: { loan: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-05T00:00:00Z" }
              as: ClubAdmin
          trigger:
            - call: "POST /equipment-loans/${loan}/return"
              payload: { return_condition: "DAMAGED" }
              as: Member
              as_user_id: "${m1}"
          assert:
            - "EquipmentLoan.${loan}.status == RETURNED"
            - "EquipmentLoan.${loan}.late_fee_cents == 551"
            - "Member.${m1}.equipment_privilege == SUSPENDED"

  - rule_id: non_linear_state_machine
    instances:
      - name: coordination_request_revision_cycle
        grounds:
          - state_machines.CoordinationRequest.RETURNED_to_DRAFT
          - state_machines.CoordinationRequest.SUBMITTED_to_RETURNED
          - entities.CoordinationRequest.fields.revision_number
        distinguishing_aspect: |
          CoordinationRequest runs the cyclic revision loop DRAFT -> SUBMITTED -> RETURNED -> DRAFT ->
          SUBMITTED -> GRANTED with revision_number incrementing once per cycle; the second non-linear
          machine (drill_message_relay_self_loop) lives on a different entity, DrillMessage.
        test_recipe:
          setup:
            - "Repeater with ACTIVE site agreement; one CoordinationRequest created, submitted, and RETURNED by the council."
          setup_api_calls:
            - call: "POST /antenna-site-agreements"
              payload: { site_name: "Hilltop", owner_name: "County", lease_start: "2026-01-01T00:00:00Z", lease_end: "2027-12-31T00:00:00Z" }
              as: ClubAdmin
              captures: { asa: $.data.id }
            - call: "POST /antenna-site-agreements/${asa}/set-status"
              payload: { to: "ACTIVE" }
              as: ClubAdmin
            - call: "POST /repeaters"
              payload: { callsign: "W1RPT", output_frequency_mhz: 146.94, site_agreement_id: "${asa}" }
              as: ClubAdmin
              captures: { rep: $.data.id, rep_ver: $.data.version }
            - call: "POST /coordination-requests"
              payload: { repeater_id: "${rep}", requested_frequency_mhz: 146.94, expected_repeater_version: "${rep_ver}" }
              as: ClubAdmin
              captures: { cr: $.data.id }
            - call: "POST /coordination-requests/${cr}/submit"
              payload: {}
              as: ClubAdmin
            - call: "POST /coordination-requests/${cr}/record-decision"
              payload: { outcome: "RETURNED", council_reference: "C-101" }
              as: ClubAdmin
          trigger:
            - call: "POST /coordination-requests/${cr}/revise"
              payload: { requested_frequency_mhz: 146.95 }
              as: ClubAdmin
            - call: "POST /coordination-requests/${cr}/submit"
              payload: {}
              as: ClubAdmin
            - call: "POST /coordination-requests/${cr}/record-decision"
              payload: { outcome: "GRANTED", council_reference: "C-102" }
              as: ClubAdmin
          assert:
            - "CoordinationRequest.${cr}.revision_number == 1"
            - "CoordinationRequest.${cr}.status == GRANTED"
            - "CoordinationRequest.${cr}.council_reference == C-102"
            - "CoordinationRequest.${cr}.requested_frequency_mhz == 146.95"

      - name: drill_message_relay_self_loop
        grounds:
          - state_machines.DrillMessage.RELAYED_to_RELAYED
          - state_machines.DrillMessage.RELAYED_to_DELIVERED
          - entities.DrillMessage.fields.relay_count
          - entities.DrillMessage.fields.handling_seconds
        distinguishing_aspect: |
          DrillMessage is cyclic via the RELAYED -> RELAYED self-loop that increments relay_count on every
          hop (two relays -> relay_count 2) before DELIVERED; the other non-linear machine
          (coordination_request_revision_cycle) lives on a different entity, CoordinationRequest.
        test_recipe:
          setup:
            - "EC member W1EC; ACTIVE member K1OPR; drill IN_PROGRESS; one ORIGINATED message created at the default clock 2026-05-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /members"
              payload: { callsign: "W1EC", full_name: "EC One", license_class: "EXTRA", license_expires_at: "2030-01-01T00:00:00Z" }
              as: ClubAdmin
              captures: { ec: $.data.id }
            - call: "POST /members"
              payload: { callsign: "K1OPR", full_name: "Operator", license_class: "EXTRA", license_expires_at: "2030-01-01T00:00:00Z" }
              as: ClubAdmin
              captures: { m: $.data.id }
            - call: "POST /members/${m}/renew"
              payload: { periods: 1 }
              as: ClubAdmin
            - call: "POST /drills"
              payload: { title: "SET Drill", scheduled_start: "2026-05-01T00:00:00Z", scheduled_end: "2026-05-02T00:00:00Z" }
              as: EmergencyCoordinator
              as_user_id: "${ec}"
              captures: { dr: $.data.id }
            - call: "POST /drills/${dr}/set-status"
              payload: { to: "IN_PROGRESS" }
              as: EmergencyCoordinator
              as_user_id: "${ec}"
            - call: "POST /drill-messages"
              payload: { drill_id: "${dr}", precedence: "ROUTINE" }
              as: Member
              as_user_id: "${m}"
              captures: { msg: $.data.id }
          trigger:
            - call: "POST /drill-messages/${msg}/set-status"
              payload: { to: "RELAYED" }
              as: Member
              as_user_id: "${m}"
            - call: "POST /drill-messages/${msg}/set-status"
              payload: { to: "RELAYED" }
              as: Member
              as_user_id: "${m}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T01:00:00Z" }
              as: ClubAdmin
            - call: "POST /drill-messages/${msg}/set-status"
              payload: { to: "DELIVERED" }
              as: Member
              as_user_id: "${m}"
          assert:
            - "DrillMessage.${msg}.status == DELIVERED"
            - "DrillMessage.${msg}.relay_count == 2"
            - "DrillMessage.${msg}.handling_seconds == 3600"

  - rule_id: transitive_cascade
    instances:
      - name: site_expiry_cascade_to_member_readiness
        grounds:
          - state_machines.AntennaSiteAgreement.ACTIVE_to_EXPIRED
          - state_machines.Repeater.OPERATIONAL_to_OFFLINE
          - state_machines.NetSession.OPEN_to_CANCELLED
          - calculations.member_readiness
        distinguishing_aspect: |
          Depth-4 cascade triggered by POST /_clock/set_current_utc: agreement EXPIRED mutates Repeater to
          OFFLINE; that repeater mutation cancels the OPEN net; that net cancellation recomputes the
          checked-in member's readiness (optimistic 28 -> 20). The other cascade
          (damaged_return_privilege_cascade) originates from a different trigger (loan return).
        test_recipe:
          setup:
            - "Repeater OPERATIONAL under a site agreement with lease_end 2026-05-10T00:00:00Z; net OPEN on the repeater; member K1OPR checked in (readiness_score_optimistic 28)."
          setup_api_calls:
            - call: "POST /antenna-site-agreements"
              payload: { site_name: "Hilltop", owner_name: "County", lease_start: "2026-01-01T00:00:00Z", lease_end: "2026-05-10T00:00:00Z" }
              as: ClubAdmin
              captures: { asa: $.data.id }
            - call: "POST /antenna-site-agreements/${asa}/set-status"
              payload: { to: "ACTIVE" }
              as: ClubAdmin
            - call: "POST /repeaters"
              payload: { callsign: "W1RPT", output_frequency_mhz: 146.94, site_agreement_id: "${asa}" }
              as: ClubAdmin
              captures: { rep: $.data.id, rep_ver: $.data.version }
            - call: "POST /coordination-requests"
              payload: { repeater_id: "${rep}", requested_frequency_mhz: 146.94, expected_repeater_version: "${rep_ver}" }
              as: ClubAdmin
              captures: { cr: $.data.id }
            - call: "POST /coordination-requests/${cr}/submit"
              payload: {}
              as: ClubAdmin
            - call: "POST /coordination-requests/${cr}/record-decision"
              payload: { outcome: "GRANTED", council_reference: "C-001" }
              as: ClubAdmin
            - call: "POST /repeaters/${rep}/set-status"
              payload: { to: "OPERATIONAL" }
              as: ClubAdmin
            - call: "POST /members"
              payload: { callsign: "W1NCS", full_name: "Net Control", license_class: "EXTRA", license_expires_at: "2030-01-01T00:00:00Z" }
              as: ClubAdmin
              captures: { nc: $.data.id }
            - call: "POST /members/${nc}/renew"
              payload: { periods: 1 }
              as: ClubAdmin
            - call: "POST /members"
              payload: { callsign: "K1OPR", full_name: "Operator", license_class: "EXTRA", license_expires_at: "2030-01-01T00:00:00Z" }
              as: ClubAdmin
              captures: { m: $.data.id }
            - call: "POST /members/${m}/renew"
              payload: { periods: 1 }
              as: ClubAdmin
            - call: "POST /net-sessions"
              payload: { name: "ARES Net 1", repeater_id: "${rep}", scheduled_start: "2026-05-01T00:00:00Z", scheduled_end: "2026-05-02T00:00:00Z" }
              as: NetControl
              as_user_id: "${nc}"
              captures: { net: $.data.id }
            - call: "POST /net-sessions/${net}/set-status"
              payload: { to: "OPEN" }
              as: NetControl
              as_user_id: "${nc}"
            - call: "POST /check-ins"
              payload: { net_session_id: "${net}" }
              as: Member
              as_user_id: "${m}"
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-11T00:00:00Z" }
              as: ClubAdmin
          assert:
            - "AntennaSiteAgreement.${asa}.status == EXPIRED"
            - "Repeater.${rep}.status == OFFLINE"
            - "NetSession.${net}.status == CANCELLED"
            - "Member.${m}.readiness_score_optimistic == 20"
            - "Member.${m}.readiness_score == 20"

      - name: damaged_return_privilege_cascade
        grounds:
          - state_machines.EquipmentLoan.ACTIVE_to_RETURNED
          - state_machines.RosterEntry.CONFIRMED_to_WITHDRAWN
          - calculations.member_readiness
          - calculations.activation_staffing
        distinguishing_aspect: |
          Cascade triggered by POST /equipment-loans/{id}/return (DAMAGED): privilege SUSPENDED recomputes
          readiness (85 -> 35), the tier flip to INELIGIBLE withdraws the member's CONFIRMED roster entry,
          and that withdrawal recomputes the activation's confirmed_count (1 -> 0). Different trigger than
          the clock-driven site_expiry cascade.
        test_recipe:
          setup:
            - "Member K1OPR with 6 closed-net check-ins and 1 completed drill (readiness 85, ELIGIBLE), CONFIRMED on a STANDBY activation (required_operators 5, confirmed_count 1); member holds an ACTIVE loan (item HT-200, value 2000, due 2026-07-01)."
          setup_api_calls:
            - call: "POST /antenna-site-agreements"
              payload: { site_name: "Hilltop", owner_name: "County", lease_start: "2026-01-01T00:00:00Z", lease_end: "2027-12-31T00:00:00Z" }
              as: ClubAdmin
