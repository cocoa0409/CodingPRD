              captures: { e1: $.data.error_id }
            - call: "POST /emergency-events"
              payload: { storage_field_id: "${fa}", well_id: "${wb}", event_type: "LEAK", severity: "SERIOUS", detected_at: "2026-08-01T00:00:00Z" }
              as: FieldOperator
              captures: { e2: $.data.error_id }
            - call: "POST /wells"
              payload: { storage_field_id: "00000000-0000-4000-8000-000000000000", well_name: "ORPHAN", well_type: "INJECTION_WITHDRAWAL", rated_rate_dth_per_day: 600000, last_mit_passed_at: "2026-06-01T00:00:00Z" }
