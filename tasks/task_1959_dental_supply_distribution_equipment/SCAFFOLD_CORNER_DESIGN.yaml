scaffold_corner_design:
  - section: entities
    instances:
      - name: practice_create_applies_defaults
        claim_type: defaults
        grounds: [entities.Practice.fields.status, entities.Practice.fields.practice_tier, entities.Practice.fields.credit_available_cents]
        distinguishing_aspect: "A practice created with only required inputs gets status ACTIVE, practice_tier STANDARD, sterilization_compliant false, credit_available_cents == credit_limit_cents, version 1, server-minted UUID id."
        test_recipe:
          setup: ["Empty database; logical clock at default 2026-08-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/practices", payload: { name: "P Def", region: "R1", credit_limit_cents: 500000 }, as: DistributionAdmin, captures: { p: $.data.id, st: $.data.status, tier: $.data.practice_tier, avail: $.data.credit_available_cents, ster: $.data.sterilization_compliant, ver: $.data.version } }
          assert:
            - "status == ACTIVE, practice_tier == STANDARD, sterilization_compliant == false"
            - "credit_available_cents == 500000 (initialized from credit_limit_cents)"
            - "version == 1 and id is a server-minted UUID"

      - name: product_create_and_retrieval
        claim_type: creation
        grounds: [entities.Product, "endpoints[POST /api/products]", "endpoints[GET /api/products/{id}]"]
        distinguishing_aspect: "POST with all fields returns 201 with the stored entity; GET by id returns the same field values."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/products", payload: { sku: "RG-9", name: "Amalgam", kind: "REGULATED", unit_price_cents: 2500, manufacturer: "M", max_qty_per_order: 4, sterilization_cycle_required: true, warranty_months: 0 }, as: DistributionAdmin, captures: { prod: $.data.id } }
            - { call: "GET /api/products/${prod}", payload: {}, as: DistributionAdmin, captures: { sku: $.data.sku, kind: $.data.kind, ster: $.data.sterilization_cycle_required } }
          assert:
            - "GET returns sku == RG-9, kind == REGULATED, sterilization_cycle_required == true, unit_price_cents == 2500"

      - name: order_computed_and_system_fields_enforced
        claim_type: computed_fields
        grounds: [entities.Order.fields.subtotal_cents, entities.Order.fields.total_cents, calculations.order_volume_discount]
        distinguishing_aspect: "Order creation computes subtotal/volume discount/total from line snapshots; the client cannot inject status or totals (not in input schema)."
        test_recipe:
          setup: ["Practice P credit 10000000; product C price 10000"]
          setup_api_calls:
            - { call: "POST /api/practices", payload: { name: "P Comp", region: "R1", credit_limit_cents: 10000000 }, as: DistributionAdmin, captures: { p: $.data.id } }
            - { call: "POST /api/products", payload: { sku: "C-2", name: "Bibs", kind: "CONSUMABLE", unit_price_cents: 10000, manufacturer: "M" }, as: DistributionAdmin, captures: { c: $.data.id } }
          trigger:
            - { call: "POST /api/orders", payload: { practice_id: "${p}", kind: "MANUAL", lines: [ { product_id: "${c}", quantity: 3 } ] }, as: SalesRep, captures: { sub: $.data.subtotal_cents, vol: $.data.volume_discount_cents, tot: $.data.total_cents, st: $.data.status, ver: $.data.version } }
          assert:
            - "subtotal_cents == 30000, volume_discount_cents == 0 (below 200000 tier), total_cents == 30000"
            - "status == DRAFT (system), version == 1 (system); no client field can override either"

      - name: order_get_nonexistent_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_RESOURCE_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "GET with a well-formed but absent UUID returns 404 ERR_RESOURCE_NOT_FOUND."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/orders/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: DistributionAdmin, captures: { err: $.data.error_id } }
          assert:
            - "HTTP 404 with error_id == ERR_RESOURCE_NOT_FOUND"

      - name: practice_create_missing_required_credit_limit_returns_invalid_request
        claim_type: required_fields
        grounds: ["errors[ERR_INVALID_REQUEST]", "validations[priority=4]", entities.Practice.fields.credit_limit_cents]
        distinguishing_aspect: "Omitting the required input field credit_limit_cents yields 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/practices", payload: { name: "P Bad", region: "R1" }, as: DistributionAdmin, captures: { err: $.data.error_id } }
          assert:
            - "HTTP 400 with error_id == ERR_INVALID_REQUEST; no practice persisted"

      - name: product_create_invalid_enum_returns_invalid_request
        claim_type: type_constraints
        grounds: [entities.Product.fields.kind, "validations[priority=4]"]
        distinguishing_aspect: "An enum value outside {CONSUMABLE, EQUIPMENT, PART, REGULATED} is rejected with 400."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/products", payload: { sku: "X-1", name: "X", kind: "WIDGET", unit_price_cents: 100, manufacturer: "M" }, as: DistributionAdmin, captures: { err: $.data.error_id } }
          assert:
            - "HTTP 400 with error_id == ERR_INVALID_REQUEST"

      - name: usage_profile_upsert_supersedes_on_same_pair
        claim_type: creation
        grounds: [entities.UsageProfile, "concurrency_rules[usage-profile-upsert-stale-practice]"]
        distinguishing_aspect: "A second PUT for the same (practice_id, product_id) updates the existing profile row in place (same id) rather than creating a duplicate, provided the OCC version is fresh."
        test_recipe:
          setup: ["Practice P (version observed), product C"]
          setup_api_calls:
            - { call: "POST /api/practices", payload: { name: "P Up", region: "R1", credit_limit_cents: 1000000 }, as: DistributionAdmin, captures: { p: $.data.id, pv: $.data.version } }
            - { call: "POST /api/products", payload: { sku: "C-4", name: "Gauze", kind: "CONSUMABLE", unit_price_cents: 1000, manufacturer: "M" }, as: DistributionAdmin, captures: { c: $.data.id } }
            - { call: "PUT /api/usage-profiles", payload: { practice_id: "${p}", product_id: "${c}", reorder_point: 20, target_stock_level: 100, auto_replenish_enabled: true, expected_practice_version: "${pv}" }, as: PracticeManager, as_user_id: "${p}", captures: { prof: $.data.id } }
            - { call: "GET /api/practices/${p}", payload: {}, as: DistributionAdmin, captures: { pv2: $.data.version } }
          trigger:
            - { call: "PUT /api/usage-profiles", payload: { practice_id: "${p}", product_id: "${c}", reorder_point: 30, target_stock_level: 120, auto_replenish_enabled: true, expected_practice_version: "${pv2}" }, as: PracticeManager, as_user_id: "${p}", captures: { prof2: $.data.id, rp: $.data.reorder_point } }
          assert:
            - "Second PUT returns the same profile id (${prof2} == ${prof}) with reorder_point == 30"
            - "At most one UsageProfile row exists per (practice_id, product_id)"

  - section: state_machines
    instances:
      - name: order_initial_state_draft_on_create
        claim_type: initial_state
        grounds: [state_machines.Order]
        distinguishing_aspect: "Every newly created order starts in DRAFT regardless of kind."
        test_recipe:
          setup: ["Practice P; product C"]
          setup_api_calls:
            - { call: "POST /api/practices", payload: { name: "P Init", region: "R1", credit_limit_cents: 1000000 }, as: DistributionAdmin, captures: { p: $.data.id } }
            - { call: "POST /api/products", payload: { sku: "C-6", name: "Cups", kind: "CONSUMABLE", unit_price_cents: 500, manufacturer: "M" }, as: DistributionAdmin, captures: { c: $.data.id } }
          trigger:
            - { call: "POST /api/orders", payload: { practice_id: "${p}", kind: "MANUAL", lines: [ { product_id: "${c}", quantity: 1 } ] }, as: SalesRep, captures: { st: $.data.status } }
          assert:
            - "Order.status == DRAFT at creation"

      - name: order_deliver_from_draft_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Order.SUBMITTED_to_DELIVERED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "deliver is only defined from SUBMITTED; a DRAFT order rejects with ERR_INVALID_STATE and stays DRAFT."
        test_recipe:
          setup: ["Practice P; product C; DRAFT order O"]
          setup_api_calls:
            - { call: "POST /api/practices", payload: { name: "P D", region: "R1", credit_limit_cents: 1000000 }, as: DistributionAdmin, captures: { p: $.data.id } }
            - { call: "POST /api/products", payload: { sku: "C-8", name: "Cups", kind: "CONSUMABLE", unit_price_cents: 500, manufacturer: "M" }, as: DistributionAdmin, captures: { c: $.data.id } }
            - { call: "POST /api/orders", payload: { practice_id: "${p}", kind: "MANUAL", lines: [ { product_id: "${c}", quantity: 1 } ] }, as: SalesRep, captures: { o: $.data.id } }
          trigger:
            - { call: "POST /api/orders/${o}/deliver", payload: {}, as: DistributionAdmin, captures: { err: $.data.error_id } }
            - { call: "GET /api/orders/${o}", payload: {}, as: DistributionAdmin, captures: { st: $.data.status } }
          assert:
            - "error_id == ERR_INVALID_STATE; order remains DRAFT; no delivered_at set"

      - name: order_cancel_from_delivered_rejected_terminal
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Order, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "DELIVERED is terminal: cancel is rejected and the credit reservation is NOT touched."
        test_recipe:
          setup: ["Practice P credit 100000; product C price 1000; order submitted then delivered (credit_available 99000)"]
          setup_api_calls:
            - { call: "POST /api/practices", payload: { name: "P T", region: "R1", credit_limit_cents: 100000 }, as: DistributionAdmin, captures: { p: $.data.id } }
            - { call: "POST /api/products", payload: { sku: "C-10", name: "Cups", kind: "CONSUMABLE", unit_price_cents: 1000, manufacturer: "M" }, as: DistributionAdmin, captures: { c: $.data.id } }
            - { call: "POST /api/orders", payload: { practice_id: "${p}", kind: "MANUAL", lines: [ { product_id: "${c}", quantity: 1 } ] }, as: SalesRep, captures: { o: $.data.id } }
            - { call: "POST /api/orders/${o}/submit", payload: {}, as: SalesRep }
            - { call: "POST /api/orders/${o}/deliver", payload: {}, as: DistributionAdmin }
          trigger:
            - { call: "POST /api/orders/${o}/cancel", payload: {}, as: SalesRep, captures: { err: $.data.error_id } }
            - { call: "GET /api/practices/${p}", payload: {}, as: DistributionAdmin, captures: { avail: $.data.credit_available_cents } }
          assert:
            - "error_id == ERR_INVALID_STATE (terminal lockdown)"
            - "credit_available_cents remains 99000 (no compensation fired)"

      - name: equipment_sale_accept_from_quote_rejected
        claim_type: invalid_transition
        grounds: [state_machines.EquipmentSale.TRAINED_to_ACCEPTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "accept requires TRAINED; a QUOTE sale rejects with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Practice P; EQUIPMENT product; sale S in QUOTE"]
          setup_api_calls:
            - { call: "POST /api/practices", payload: { name: "P Q", region: "R1", credit_limit_cents: 10000000 }, as: DistributionAdmin, captures: { p: $.data.id } }
            - { call: "POST /api/products", payload: { sku: "EQ-11", name: "Chair", kind: "EQUIPMENT", unit_price_cents: 500000, manufacturer: "M", warranty_months: 12 }, as: DistributionAdmin, captures: { eq: $.data.id } }
            - { call: "POST /api/equipment-sales", payload: { practice_id: "${p}", product_id: "${eq}", sale_price_cents: 900000 }, as: SalesRep, captures: { s: $.data.id } }
          trigger:
            - { call: "POST /api/equipment-sales/${s}/accept", payload: {}, as: PracticeManager, as_user_id: "${p}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE; status remains QUOTE; no warranty agreement created"

      - name: service_ticket_dispatch_from_open_rejected
        claim_type: invalid_transition
        grounds: [state_machines.ServiceTicket.COVERAGE_ASSESSED_to_DISPATCHED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "dispatch requires COVERAGE_ASSESSED; an OPEN ticket (never assessed) rejects with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Full accepted-sale fixture with technician T1; ticket K in OPEN"]
          setup_api_calls:
            - { call: "POST /api/practices", payload: { name: "P S", region: "R1", credit_limit_cents: 10000000 }, as: DistributionAdmin, captures: { p: $.data.id } }
            - { call: "POST /api/products", payload: { sku: "EQ-12", name: "Chair", kind: "EQUIPMENT", unit_price_cents: 500000, manufacturer: "M", warranty_months: 12 }, as: DistributionAdmin, captures: { eq: $.data.id } }
            - { call: "POST /api/technicians", payload: { name: "T1", region: "R1", certifications: ["INSTALL", "REPAIR"] }, as: DistributionAdmin, captures: { t1: $.data.id } }
            - { call: "POST /api/equipment-sales", payload: { practice_id: "${p}", product_id: "${eq}", sale_price_cents: 900000 }, as: SalesRep, captures: { s: $.data.id } }
            - { call: "POST /api/equipment-sales/${s}/confirm", payload: {}, as: SalesRep }
            - { call: "POST /api/equipment-sales/${s}/schedule-install", payload: { technician_id: "${t1}", window_start: "2026-08-02T09:00:00Z", window_end: "2026-08-02T12:00:00Z" }, as: SalesRep }
            - { call: "POST /api/equipment-sales/${s}/complete-install", payload: {}, as: FieldTechnician, as_user_id: "${t1}" }
            - { call: "POST /api/equipment-sales/${s}/complete-training", payload: { training_minutes: 30 }, as: FieldTechnician, as_user_id: "${t1}" }
            - { call: "POST /api/equipment-sales/${s}/accept", payload: {}, as: PracticeManager, as_user_id: "${p}" }
            - { call: "POST /api/service-tickets", payload: { practice_id: "${p}", equipment_sale_id: "${s}", issue_description: "hum" }, as: ServiceDispatcher, captures: { k: $.data.id } }
          trigger:
            - { call: "POST /api/service-tickets/${k}/dispatch", payload: { scheduled_start: "2026-08-05T09:00:00Z", scheduled_end: "2026-08-05T10:00:00Z" }, as: ServiceDispatcher, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE; no DispatchJob created"

      - name: rebate_claim_settle_from_draft_rejected
        claim_type: invalid_transition
        grounds: [state_machines.RebateClaim.SUBMITTED_to_PAID, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "settle requires SUBMITTED; a DRAFT claim rejects with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Practice P; product C; rebate promotion; DRAFT claim CL on a delivered order"]
          setup_api_calls:
            - { call: "POST /api/practices", payload: { name: "P RC", region: "R1", credit_limit_cents: 1000000 }, as: DistributionAdmin, captures: { p: $.data.id } }
            - { call: "POST /api/products", payload: { sku: "C-11", name: "Floss", kind: "CONSUMABLE", unit_price_cents: 1000, manufacturer: "M" }, as: DistributionAdmin, captures: { c: $.data.id } }
            - { call: "POST /api/promotions", payload: { name: "RB", promo_kind: "MANUFACTURER_REBATE", eligible_product_ids: ["${c}"], rebate_per_unit_cents: 50, fund_total_cents: 10000, start_date: "2026-01-01T00:00:00Z", end_date: "2027-12-31T00:00:00Z" }, as: DistributionAdmin, captures: { promo: $.data.id } }
            - { call: "POST /api/orders", payload: { practice_id: "${p}", kind: "MANUAL", lines: [ { product_id: "${c}", quantity: 1 } ] }, as: PracticeManager, as_user_id: "${p}", captures: { o: $.data.id } }
            - { call: "POST /api/orders/${o}/submit", payload: {}, as: PracticeManager, as_user_id: "${p}" }
            - { call: "POST /api/orders/${o}/deliver", payload: {}, as: DistributionAdmin }
            - { call: "POST /api/rebate-claims", payload: { practice_id: "${p}", order_id: "${o}", promotion_id: "${promo}" }, as: PracticeManager, as_user_id: "${p}", captures: { cl: $.data.id } }
          trigger:
            - { call: "POST /api/rebate-claims/${cl}/settle", payload: {}, as: ManufacturerAgent, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE; claim remains DRAFT; paid_at null"

      - name: rebate_claim_paid_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.RebateClaim, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "PAID is terminal: deny after settle is rejected; paid_at and funds are untouched."
        test_recipe:
          setup: ["Claim CL driven DRAFT -> SUBMITTED -> PAID (fund debited at submit)"]
          setup_api_calls:
            - { call: "POST /api/practices", payload: { name: "P PL", region: "R1", credit_limit_cents: 1000000 }, as: DistributionAdmin, captures: { p: $.data.id } }
            - { call: "POST /api/products", payload: { sku: "C-12", name: "Floss", kind: "CONSUMABLE", unit_price_cents: 1000, manufacturer: "M" }, as: DistributionAdmin, captures: { c: $.data.id } }
            - { call: "POST /api/promotions", payload: { name: "RB", promo_kind: "MANUFACTURER_REBATE", eligible_product_ids: ["${c}"], rebate_per_unit_cents: 50, fund_total_cents: 10000, start_date: "2026-01-01T00:00:00Z", end_date: "2027-12-31T00:00:00Z" }, as: DistributionAdmin, captures: { promo: $.data.id } }
            - { call: "POST /api/orders", payload: { practice_id: "${p}", kind: "MANUAL", lines: [ { product_id: "${c}", quantity: 1 } ] }, as: PracticeManager, as_user_id: "${p}", captures: { o: $.data.id } }
            - { call: "POST /api/orders/${o}/submit", payload: {}, as: PracticeManager, as_user_id: "${p}" }
            - { call: "POST /api/orders/${o}/deliver", payload: {}, as: DistributionAdmin }
            - { call: "POST /api/rebate-claims", payload: { practice_id: "${p}", order_id: "${o}", promotion_id: "${promo}" }, as: PracticeManager, as_user_id: "${p}", captures: { cl: $.data.id } }
            - { call: "POST /api/rebate-claims/${cl}/submit", payload: {}, as: PracticeManager, as_user_id: "${p}" }
            - { call: "POST /api/rebate-claims/${cl}/settle", payload: {}, as: ManufacturerAgent }
          trigger:
            - { call: "POST /api/rebate-claims/${cl}/deny", payload: { denial_reason: "late" }, as: ManufacturerAgent, captures: { err: $.data.error_id } }
            - { call: "GET /api/rebate-claims/${cl}", payload: {}, as: DistributionAdmin, captures: { st: $.data.status } }
          assert:
            - "error_id == ERR_INVALID_STATE; claim remains PAID (deny cannot fire from a terminal state)"

      - name: trade_in_appraise_twice_rejected
        claim_type: invalid_transition
        grounds: [state_machines.TradeIn.REQUESTED_to_APPRAISED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "appraise is defined only from REQUESTED; an already-APPRAISED trade-in rejects with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Practice P; trade-in TI already APPRAISED"]
          setup_api_calls:
            - { call: "POST /api/practices", payload: { name: "P TI", region: "R1", credit_limit_cents: 1000000 }, as: DistributionAdmin, captures: { p: $.data.id } }
            - { call: "POST /api/trade-ins", payload: { practice_id: "${p}", description: "compressor", equipment_age_months: 24, condition: "NEEDS_REPAIR", category_base_value_cents: 500000 }, as: SalesRep, captures: { ti: $.data.id } }
            - { call: "POST /api/trade-ins/${ti}/appraise", payload: { valuation_method: "MARKET_VALUE" }, as: SalesRep }
          trigger:
            - { call: "POST /api/trade-ins/${ti}/appraise", payload: { valuation_method: "SCRAP_VALUE" }, as: SalesRep, captures: { err: $.data.error_id } }
            - { call: "GET /api/trade-ins/${ti}", payload: {}, as: DistributionAdmin, captures: { vm: $.data.valuation_method, av: $.data.appraised_value_cents } }
          assert:
            - "error_id == ERR_INVALID_STATE; valuation_method remains MARKET_VALUE and appraised_value_cents == 184734 (round_half_up(500000 x 0.98^24 x 0.6)) from the first appraisal"

      - name: warranty_created_on_equipment_accept
        claim_type: side_effect_execution
        grounds: [state_machines.EquipmentSale.TRAINED_to_ACCEPTED]
        excluded_because:
          difficulty_instance: equipment_sale_install_rework_cycle
          rationale: "The accept -> WARRANTY CoverageAgreement side effect (type, deductible, cap, end date) is asserted in the named difficulty instance."

      - name: credit_debit_side_effect_on_submit
        claim_type: side_effect_execution
        grounds: [state_machines.Order.DRAFT_to_SUBMITTED]
        excluded_because:
          difficulty_instance: credit_submit_cancel_conservation
          rationale: "Credit reservation on submit and restoration on cancel are asserted with exact balances in the named difficulty instance."

      - name: reopen_restores_van_parts
        claim_type: side_effect_execution
        grounds: [state_machines.ServiceTicket.RESOLVED_to_OPEN]
        excluded_because:
          difficulty_instance: van_stock_resolve_reopen_conservation
          rationale: "The parts-restore compensation side effect of reopen is asserted with exact van quantities in the named difficulty instance."

  - section: calculations
    instances:
      - name: usage_average_excludes_out_of_window_deliveries
        claim_type: input_set_filtering
        grounds: [calculations.usage_average]
        distinguishing_aspect: "The trailing-28-day input set excludes a delivery made 29 days ago: two 28-unit deliveries (2026-08-01 and 2026-08-30) yield average_daily_usage == 1.0, not 2.0."
        test_recipe:
          setup:
            - "Practice P; product C; UsageProfile with auto_replenish_enabled false"
            - "Order1 of C x 28 delivered at default clock 2026-08-01; clock then set to 2026-08-30"
          setup_api_calls:
            - { call: "POST /api/practices", payload: { name: "P Win", region: "R1", credit_limit_cents: 10000000 }, as: DistributionAdmin, captures: { p: $.data.id, pv: $.data.version } }
            - { call: "POST /api/products", payload: { sku: "C-13", name: "Gauze", kind: "CONSUMABLE", unit_price_cents: 1000, manufacturer: "M" }, as: DistributionAdmin, captures: { c: $.data.id } }
            - { call: "PUT /api/usage-profiles", payload: { practice_id: "${p}", product_id: "${c}", reorder_point: 5, target_stock_level: 50, auto_replenish_enabled: false, expected_practice_version: "${pv}" }, as: PracticeManager, as_user_id: "${p}", captures: { prof: $.data.id } }
            - { call: "POST /api/orders", payload: { practice_id: "${p}", kind: "MANUAL", lines: [ { product_id: "${c}", quantity: 28 } ] }, as: SalesRep, captures: { o1: $.data.id } }
            - { call: "POST /api/orders/${o1}/submit", payload: {}, as: SalesRep }
            - { call: "POST /api/orders/${o1}/deliver", payload: {}, as: DistributionAdmin }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-30T00:00:00Z" }, as: DistributionAdmin }
            - { call: "POST /api/orders", payload: { practice_id: "${p}", kind: "MANUAL", lines: [ { product_id: "${c}", quantity: 28 } ] }, as: SalesRep, captures: { o2: $.data.id } }
            - { call: "POST /api/orders/${o2}/submit", payload: {}, as: SalesRep }
          trigger:
            - { call: "POST /api/orders/${o2}/deliver", payload: {}, as: DistributionAdmin }
            - { call: "GET /api/usage-profiles/${prof}", payload: {}, as: DistributionAdmin, captures: { avg: $.data.average_daily_usage } }
          assert:
            - "average_daily_usage == 1.0 (only the 2026-08-30 delivery falls in [2026-08-02, 2026-08-30]; the 2026-08-01 delivery is out of window)"

      - name: repair_cost_billable_uses_labor_rate_and_part_snapshot
        claim_type: constants_applied
        grounds: [calculations.repair_cost]
        distinguishing_aspect: "BILLABLE variant: customer_due_cents == parts + labor_minutes x 200 exactly (2 x 15000 + 30 x 200 == 36000); the 200 cents/minute constant is observable."
        test_recipe:
          setup:
            - "Practice P region R1; EQUIPMENT product warranty_months 0 (warranty expires immediately after the acceptance instant); PART PT price 15000"
            - "Technician T1 (INSTALL+REPAIR, R1), van loaded PT x 5; sale ACCEPTED; clock advanced to 2026-08-02 so warranty is EXPIRED"
            - "Ticket assessed BILLABLE, estimate approved, dispatched to T1"
          setup_api_calls:
            - { call: "POST /api/practices", payload: { name: "P Bil", region: "R1", credit_limit_cents: 10000000 }, as: DistributionAdmin, captures: { p: $.data.id } }
            - { call: "POST /api/products", payload: { sku: "EQ-13", name: "Chair", kind: "EQUIPMENT", unit_price_cents: 500000, manufacturer: "M", warranty_months: 0 }, as: DistributionAdmin, captures: { eq: $.data.id } }
            - { call: "POST /api/products", payload: { sku: "PT-13", name: "Valve", kind: "PART", unit_price_cents: 15000, manufacturer: "M" }, as: DistributionAdmin, captures: { pt: $.data.id } }
            - { call: "POST /api/technicians", payload: { name: "T1", region: "R1", certifications: ["INSTALL", "REPAIR"] }, as: DistributionAdmin, captures: { t1: $.data.id } }
            - { call: "PUT /api/technicians/${t1}/van-stock", payload: { product_id: "${pt}", quantity_on_van: 5, min_quantity: 1 }, as: DistributionAdmin }
            - { call: "POST /api/equipment-sales", payload: { practice_id: "${p}", product_id: "${eq}", sale_price_cents: 900000 }, as: SalesRep, captures: { s: $.data.id } }
            - { call: "POST /api/equipment-sales/${s}/confirm", payload: {}, as: SalesRep }
            - { call: "POST /api/equipment-sales/${s}/schedule-install", payload: { technician_id: "${t1}", window_start: "2026-08-01T09:00:00Z", window_end: "2026-08-01T12:00:00Z" }, as: SalesRep }
            - { call: "POST /api/equipment-sales/${s}/complete-install", payload: {}, as: FieldTechnician, as_user_id: "${t1}" }
            - { call: "POST /api/equipment-sales/${s}/complete-training", payload: { training_minutes: 30 }, as: FieldTechnician, as_user_id: "${t1}" }
            - { call: "POST /api/equipment-sales/${s}/accept", payload: {}, as: PracticeManager, as_user_id: "${p}" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: DistributionAdmin }
            - { call: "POST /api/service-tickets", payload: { practice_id: "${p}", equipment_sale_id: "${s}", issue_description: "clank" }, as: ServiceDispatcher, captures: { k: $.data.id } }
            - { call: "POST /api/service-tickets/${k}/assess-coverage", payload: {}, as: ServiceDispatcher }
            - { call: "POST /api/service-tickets/${k}/approve-estimate", payload: {}, as: PracticeManager, as_user_id: "${p}" }
            - { call: "POST /api/service-tickets/${k}/dispatch", payload: { scheduled_start: "2026-08-03T09:00:00Z", scheduled_end: "2026-08-03T10:00:00Z" }, as: ServiceDispatcher, captures: { tech: $.data.technician_id } }
          trigger:
            - { call: "POST /api/service-tickets/${k}/resolve", payload: { parts_used: [ { product_id: "${pt}", quantity: 2 } ], labor_minutes: 30 }, as: FieldTechnician, as_user_id: "${tech}", captures: { due: $.data.customer_due_cents } }
          assert:
            - "customer_due_cents == 36000 (2 x 15000 parts + 30 x 200 labor, BILLABLE variant pays full gross)"

      - name: coverage_determination_prefers_warranty_over_plan
        claim_type: correct_result
        grounds: [calculations.coverage_determination]
        distinguishing_aspect: "When both an ACTIVE warranty and an ACTIVE service plan cover the same equipment, determination selects WARRANTY (manufacturer-first precedence)."
        test_recipe:
          setup:
            - "Practice P; EQUIPMENT warranty_months 12; technician T1; sale ACCEPTED at default clock (warranty ACTIVE 2026-08-01..2027-08-01)"
            - "SERVICE_PLAN agreement overlapping the same equipment (2026-08-01..2028-08-01)"
          setup_api_calls:
            - { call: "POST /api/practices", payload: { name: "P Pref", region: "R1", credit_limit_cents: 10000000 }, as: DistributionAdmin, captures: { p: $.data.id } }
            - { call: "POST /api/products", payload: { sku: "EQ-14", name: "Chair", kind: "EQUIPMENT", unit_price_cents: 500000, manufacturer: "M", warranty_months: 12 }, as: DistributionAdmin, captures: { eq: $.data.id } }
            - { call: "POST /api/technicians", payload: { name: "T1", region: "R1", certifications: ["INSTALL"] }, as: DistributionAdmin, captures: { t1: $.data.id } }
            - { call: "POST /api/equipment-sales", payload: { practice_id: "${p}", product_id: "${eq}", sale_price_cents: 900000 }, as: SalesRep, captures: { s: $.data.id } }
            - { call: "POST /api/equipment-sales/${s}/confirm", payload: {}, as: SalesRep }
            - { call: "POST /api/equipment-sales/${s}/schedule-install", payload: { technician_id: "${t1}", window_start: "2026-08-02T09:00:00Z", window_end: "2026-08-02T12:00:00Z" }, as: SalesRep }
            - { call: "POST /api/equipment-sales/${s}/complete-install", payload: {}, as: FieldTechnician, as_user_id: "${t1}" }
            - { call: "POST /api/equipment-sales/${s}/complete-training", payload: { training_minutes: 30 }, as: FieldTechnician, as_user_id: "${t1}" }
            - { call: "POST /api/equipment-sales/${s}/accept", payload: {}, as: PracticeManager, as_user_id: "${p}", captures: { war: $.data.warranty_agreement_id } }
            - { call: "POST /api/coverage-agreements", payload: { practice_id: "${p}", equipment_sale_id: "${s}", coverage_type: "SERVICE_PLAN", start_date: "2026-08-01T00:00:00Z", end_date: "2028-08-01T00:00:00Z", deductible_cents: 5000, coverage_cap_cents: 100000 }, as: SalesRep }
            - { call: "POST /api/service-tickets", payload: { practice_id: "${p}", equipment_sale_id: "${s}", issue_description: "hum" }, as: ServiceDispatcher, captures: { k: $.data.id } }
          trigger:
            - { call: "POST /api/service-tickets/${k}/assess-coverage", payload: {}, as: ServiceDispatcher, captures: { det: $.data.coverage_determination, ag: $.data.coverage_agreement_id, st: $.data.status } }
          assert:
            - "coverage_determination == WARRANTY and coverage_agreement_id == ${war} (the warranty row, not the plan)"
            - "Ticket status == COVERAGE_ASSESSED (covered branch of the fork)"

      - name: coverage_lazy_expiry_end_date_inclusive
        claim_type: precision
        grounds: [calculations.coverage_determination, state_machines.CoverageAgreement.ACTIVE_to_EXPIRED]
        distinguishing_aspect: "The coverage window [start_date, end_date] is inclusive: assessment at exactly end_date still selects WARRANTY; one second later the agreement lazily flips EXPIRED and the ticket goes BILLABLE."
        test_recipe:
          setup:
            - "Practice P; EQUIPMENT warranty_months 1; technician T1; sale ACCEPTED at 2026-08-01 -> warranty end_date 2026-09-01T00:00:00Z"
          setup_api_calls:
            - { call: "POST /api/practices", payload: { name: "P Exp", region: "R1", credit_limit_cents: 10000000 }, as: DistributionAdmin, captures: { p: $.data.id } }
            - { call: "POST /api/products", payload: { sku: "EQ-15", name: "Chair", kind: "EQUIPMENT", unit_price_cents: 500000, manufacturer: "M", warranty_months: 1 }, as: DistributionAdmin, captures: { eq: $.data.id } }
            - { call: "POST /api/technicians", payload: { name: "T1", region: "R1", certifications: ["INSTALL"] }, as: DistributionAdmin, captures: { t1: $.data.id } }
            - { call: "POST /api/equipment-sales", payload: { practice_id: "${p}", product_id: "${eq}", sale_price_cents: 900000 }, as: SalesRep, captures: { s: $.data.id } }
            - { call: "POST /api/equipment-sales/${s}/confirm", payload: {}, as: SalesRep }
            - { call: "POST /api/equipment-sales/${s}/schedule-install", payload: { technician_id: "${t1}", window_start: "2026-08-02T09:00:00Z", window_end: "2026-08-02T12:00:00Z" }, as: SalesRep }
            - { call: "POST /api/equipment-sales/${s}/complete-install", payload: {}, as: FieldTechnician, as_user_id: "${t1}" }
            - { call: "POST /api/equipment-sales/${s}/complete-training", payload: { training_minutes: 30 }, as: FieldTechnician, as_user_id: "${t1}" }
            - { call: "POST /api/equipment-sales/${s}/accept", payload: {}, as: PracticeManager, as_user_id: "${p}" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: DistributionAdmin }
            - { call: "POST /api/service-tickets", payload: { practice_id: "${p}", equipment_sale_id: "${s}", issue_description: "at boundary" }, as: ServiceDispatcher, captures: { k1: $.data.id } }
          trigger:
            - { call: "POST /api/service-tickets/${k1}/assess-coverage", payload: {}, as: ServiceDispatcher, captures: { det1: $.data.coverage_determination } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:01Z" }, as: DistributionAdmin }
            - { call: "POST /api/service-tickets", payload: { practice_id: "${p}", equipment_sale_id: "${s}", issue_description: "one second past" }, as: ServiceDispatcher, captures: { k2: $.data.id } }
            - { call: "POST /api/service-tickets/${k2}/assess-coverage", payload: {}, as: ServiceDispatcher, captures: { det2: $.data.coverage_determination, st2: $.data.status } }
          assert:
            - "At now == end_date exactly: determination == WARRANTY (inclusive bound)"
            - "At now == end_date + 1s: determination == BILLABLE and status == AWAITING_APPROVAL (agreement lazily EXPIRED)"

      - name: trade_in_market_value_floor_applies
        claim_type: correct_result
        grounds: [calculations.trade_in_valuation]
        distinguishing_aspect: "MARKET_VALUE floors at 10% of category base: age 600 months drives the raw value to 0.54 cents, so the floor binds and the appraisal is exactly 10000."
        test_recipe:
          setup: ["Practice P; trade-in age 600, condition WORKING, base 100000"]
          setup_api_calls:
            - { call: "POST /api/practices", payload: { name: "P Fl", region: "R1", credit_limit_cents: 1000000 }, as: DistributionAdmin, captures: { p: $.data.id } }
            - { call: "POST /api/trade-ins", payload: { practice_id: "${p}", description: "ancient drill", equipment_age_months: 600, condition: "WORKING", category_base_value_cents: 100000 }, as: SalesRep, captures: { ti: $.data.id } }
          trigger:
            - { call: "POST /api/trade-ins/${ti}/appraise", payload: { valuation_method: "MARKET_VALUE" }, as: SalesRep, captures: { av: $.data.appraised_value_cents } }
          assert:
            - "appraised_value_cents == 10000 (floor 0.10 x 100000 binds over raw 0.54)"

      - name: rebate_fund_released_on_deny_compensation
        claim_type: correct_result
        grounds: [state_machines.RebateClaim.SUBMITTED_to_DENIED, calculations.rebate_payout]
        distinguishing_aspect: "Denying a SUBMITTED claim credits the promotion fund back exactly (100000 -> 99874 at submit -> 100000 at deny) and the promotion stays ACTIVE."
        test_recipe:
          setup:
            - "ELITE practice PE; products P1, P2 price 1000; rebate promotion fund 100000, unit 50, eligible [P1, P2]"
            - "Delivered order [P1 x 1, P2 x 1]; claim (amount 126) SUBMITTED"
          setup_api_calls:
            - { call: "POST /api/practices", payload: { name: "P Den", region: "R1", practice_tier: "ELITE", credit_limit_cents: 10000000 }, as: DistributionAdmin, captures: { pe: $.data.id } }
            - { call: "POST /api/products", payload: { sku: "D-1", name: "D1", kind: "CONSUMABLE", unit_price_cents: 1000, manufacturer: "M" }, as: DistributionAdmin, captures: { p1: $.data.id } }
            - { call: "POST /api/products", payload: { sku: "D-2", name: "D2", kind: "CONSUMABLE", unit_price_cents: 1000, manufacturer: "M" }, as: DistributionAdmin, captures: { p2: $.data.id } }
            - { call: "POST /api/promotions", payload: { name: "RD", promo_kind: "MANUFACTURER_REBATE", eligible_product_ids: ["${p1}", "${p2}"], rebate_per_unit_cents: 50, fund_total_cents: 100000, start_date: "2026-01-01T00:00:00Z", end_date: "2027-12-31T00:00:00Z" }, as: DistributionAdmin, captures: { promo: $.data.id } }
            - { call: "POST /api/orders", payload: { practice_id: "${pe}", kind: "MANUAL", lines: [ { product_id: "${p1}", quantity: 1 }, { product_id: "${p2}", quantity: 1 } ] }, as: PracticeManager, as_user_id: "${pe}", captures: { o: $.data.id } }
            - { call: "POST /api/orders/${o}/submit", payload: {}, as: PracticeManager, as_user_id: "${pe}" }
            - { call: "POST /api/orders/${o}/deliver", payload: {}, as: DistributionAdmin }
            - { call: "POST /api/rebate-claims", payload: { practice_id: "${pe}", order_id: "${o}", promotion_id: "${promo}" }, as: PracticeManager, as_user_id: "${pe}", captures: { cl: $.data.id } }
            - { call: "POST /api/rebate-claims/${cl}/submit", payload: {}, as: PracticeManager, as_user_id: "${pe}" }
          trigger:
            - { call: "POST /api/rebate-claims/${cl}/deny", payload: { denial_reason: "paperwork" }, as: ManufacturerAgent, captures: { st: $.data.status } }
            - { call: "GET /api/promotions/${promo}", payload: {}, as: DistributionAdmin, captures: { fr: $.data.fund_remaining_cents, pst: $.data.status } }
          assert:
            - "Claim status == DENIED with denial_reason recorded"
            - "Promotion fund_remaining_cents == 100000 (reservation fully released) and status == ACTIVE"

  - section: validations
    instances:
      - name: practice_manager_cannot_touch_other_practice_order
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", "roles[PracticeManager]"]
        distinguishing_aspect: "Entity-backed ownership: a PracticeManager whose X-User-ID is practice B cannot submit practice A's order (403), even though PracticeManager is a listed role for the endpoint."
        test_recipe:
          setup: ["Practices PA and PB; product C; DRAFT order O belonging to PA"]
          setup_api_calls:
            - { call: "POST /api/practices", payload: { name: "PA", region: "R1", credit_limit_cents: 1000000 }, as: DistributionAdmin, captures: { pa: $.data.id } }
            - { call: "POST /api/practices", payload: { name: "PB", region: "R1", credit_limit_cents: 1000000 }, as: DistributionAdmin, captures: { pb: $.data.id } }
            - { call: "POST /api/products", payload: { sku: "C-14", name: "Cups", kind: "CONSUMABLE", unit_price_cents: 500, manufacturer: "M" }, as: DistributionAdmin, captures: { c: $.data.id } }
            - { call: "POST /api/orders", payload: { practice_id: "${pa}", kind: "MANUAL", lines: [ { product_id: "${c}", quantity: 1 } ] }, as: SalesRep, captures: { o: $.data.id } }
          trigger:
            - { call: "POST /api/orders/${o}/submit", payload: {}, as: PracticeManager, as_user_id: "${pb}", captures: { err: $.data.error_id } }
          assert:
            - "HTTP 403 with error_id == ERR_FORBIDDEN (order.practice_id != X-User-ID)"
            - "Order remains DRAFT"

      - name: practice_manager_cannot_create_products
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", "roles[DistributionAdmin]"]
        distinguishing_aspect: "Catalog management is exclusive to DistributionAdmin; PracticeManager gets 403 on POST /api/products."
        test_recipe:
          setup: ["Practice P exists"]
          setup_api_calls:
            - { call: "POST /api/practices", payload: { name: "P X", region: "R1", credit_limit_cents: 1000000 }, as: DistributionAdmin, captures: { p: $.data.id } }
          trigger:
            - { call: "POST /api/products", payload: { sku: "Z-1", name: "Z", kind: "CONSUMABLE", unit_price_cents: 100, manufacturer: "M" }, as: PracticeManager, as_user_id: "${p}", captures: { err: $.data.error_id } }
          assert:
            - "HTTP 403 with error_id == ERR_FORBIDDEN"

      - name: expired_promotion_rejected_on_order_create
        claim_type: temporal_validation
        grounds: ["validations[priority=14]", state_machines.Promotion.ACTIVE_to_EXPIRED]
        distinguishing_aspect: "A promotion whose end_date (2026-06-01) precedes the logical clock (2026-08-01) lazily flips to EXPIRED and attaching it to a new order fails with ERR_PROMOTION_INACTIVE."
        test_recipe:
          setup: ["Practice P; products PA/PB; BUNDLE_DISCOUNT promotion with window already past"]
          setup_api_calls:
            - { call: "POST /api/practices", payload: { name: "P Pr", region: "R1", credit_limit_cents: 10000000 }, as: DistributionAdmin, captures: { p: $.data.id } }
            - { call: "POST /api/products", payload: { sku: "PA-2", name: "A", kind: "CONSUMABLE", unit_price_cents: 60000, manufacturer: "M" }, as: DistributionAdmin, captures: { pa: $.data.id } }
            - { call: "POST /api/products", payload: { sku: "PB-2", name: "B", kind: "CONSUMABLE", unit_price_cents: 40000, manufacturer: "M" }, as: DistributionAdmin, captures: { pb: $.data.id } }
            - { call: "POST /api/promotions", payload: { name: "OLD", promo_kind: "BUNDLE_DISCOUNT", required_product_ids: ["${pa}", "${pb}"], discount_pct: 0.15, max_discount_cents: 20000, start_date: "2026-01-01T00:00:00Z", end_date: "2026-06-01T00:00:00Z" }, as: DistributionAdmin, captures: { promo: $.data.id } }
          trigger:
            - { call: "POST /api/orders", payload: { practice_id: "${p}", kind: "BUNDLE", promotion_id: "${promo}", lines: [ { product_id: "${pa}", quantity: 1 }, { product_id: "${pb}", quantity: 1 } ] }, as: SalesRep, captures: { err: $.data.error_id } }
            - { call: "GET /api/promotions/${promo}", payload: {}, as: DistributionAdmin, captures: { pst: $.data.status } }
          assert:
            - "error_id == ERR_PROMOTION_INACTIVE; no order created"
            - "Promotion status == EXPIRED after lazy evaluation"

      - name: bundle_incomplete_at_submit
        claim_type: violation_to_error
        grounds: ["validations[priority=16]", calculations.bundle_discount]
        distinguishing_aspect: "A BUNDLE order missing a required product is created with bundle_discount_cents == 0 but cannot be submitted: ERR_BUNDLE_INCOMPLETE."
        test_recipe:
          setup: ["Practice P; products PA/PB; BUNDLE_DISCOUNT promotion requiring [PA, PB]"]
          setup_api_calls:
            - { call: "POST /api/practices", payload: { name: "P Bnd", region: "R1", credit_limit_cents: 10000000 }, as: DistributionAdmin, captures: { p: $.data.id } }
            - { call: "POST /api/products", payload: { sku: "PA-3", name: "A", kind: "CONSUMABLE", unit_price_cents: 60000, manufacturer: "M" }, as: DistributionAdmin, captures: { pa: $.data.id } }
            - { call: "POST /api/products", payload: { sku: "PB-3", name: "B", kind: "CONSUMABLE", unit_price_cents: 40000, manufacturer: "M" }, as: DistributionAdmin, captures: { pb: $.data.id } }
            - { call: "POST /api/promotions", payload: { name: "BD", promo_kind: "BUNDLE_DISCOUNT", required_product_ids: ["${pa}", "${pb}"], discount_pct: 0.15, max_discount_cents: 20000, start_date: "2026-01-01T00:00:00Z", end_date: "2027-12-31T00:00:00Z" }, as: DistributionAdmin, captures: { promo: $.data.id } }
            - { call: "POST /api/orders", payload: { practice_id: "${p}", kind: "BUNDLE", promotion_id: "${promo}", lines: [ { product_id: "${pa}", quantity: 1 } ] }, as: SalesRep, captures: { o: $.data.id, bun0: $.data.bundle_discount_cents } }
          trigger:
            - { call: "POST /api/orders/${o}/submit", payload: {}, as: SalesRep, captures: { err: $.data.error_id } }
          assert:
            - "At creation bundle_discount_cents == 0 (required product PB absent)"
            - "Submit fails with ERR_BUNDLE_INCOMPLETE; order remains DRAFT"

      - name: startup_window_expired_after_90_days
        claim_type: temporal_validation
        grounds: ["validations[priority=11]", "errors[ERR_STARTUP_WINDOW_EXPIRED]"]
        distinguishing_aspect: "STARTUP orders are accepted only within 90 days of practice creation; at created_at + 91 days the creation fails with ERR_STARTUP_WINDOW_EXPIRED."
        test_recipe:
          setup: ["Practice P created at default clock 2026-08-01; product C; logical clock advanced to 2026-10-31 (91 days later)"]
          setup_api_calls:
            - { call: "POST /api/practices", payload: { name: "P St", region: "R1", credit_limit_cents: 10000000 }, as: DistributionAdmin, captures: { p: $.data.id } }
            - { call: "POST /api/products", payload: { sku: "C-15", name: "Kit", kind: "CONSUMABLE", unit_price_cents: 1000, manufacturer: "M" }, as: DistributionAdmin, captures: { c: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-10-31T00:00:00Z" }, as: DistributionAdmin }
          trigger:
            - { call: "POST /api/orders", payload: { practice_id: "${p}", kind: "STARTUP", lines: [ { product_id: "${c}", quantity: 1 } ] }, as: SalesRep, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_STARTUP_WINDOW_EXPIRED; no order created"

      - name: startup_package_one_per_practice
        claim_type: violation_to_error
        grounds: ["validations[priority=12]", "errors[ERR_STARTUP_PACKAGE_LIMIT]"]
        distinguishing_aspect: "A practice may hold at most one non-CANCELLED STARTUP order; the second creation fails with ERR_STARTUP_PACKAGE_LIMIT."
        test_recipe:
          setup: ["Practice P created at default clock; product C; one STARTUP order already created"]
          setup_api_calls:
            - { call: "POST /api/practices", payload: { name: "P S1", region: "R1", credit_limit_cents: 10000000 }, as: DistributionAdmin, captures: { p: $.data.id } }
            - { call: "POST /api/products", payload: { sku: "C-16", name: "Kit", kind: "CONSUMABLE", unit_price_cents: 1000, manufacturer: "M" }, as: DistributionAdmin, captures: { c: $.data.id } }
            - { call: "POST /api/orders", payload: { practice_id: "${p}", kind: "STARTUP", lines: [ { product_id: "${c}", quantity: 1 } ] }, as: SalesRep, captures: { o1: $.data.id } }
          trigger:
            - { call: "POST /api/orders", payload: { practice_id: "${p}", kind: "STARTUP", lines: [ { product_id: "${c}", quantity: 1 } ] }, as: SalesRep, captures: { err: $.data.error_id } }
          assert:
            - "First STARTUP order created successfully; second fails with ERR_STARTUP_PACKAGE_LIMIT"

      - name: equipment_line_rejected_on_manual_order
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_EQUIPMENT_NOT_ORDERABLE]"]
        distinguishing_aspect: "EQUIPMENT catalog items flow only through EquipmentSale (or STARTUP packages); a MANUAL order line with an EQUIPMENT product fails with ERR_EQUIPMENT_NOT_ORDERABLE."
        test_recipe:
          setup: ["Practice P; EQUIPMENT product EQ"]
          setup_api_calls:
            - { call: "POST /api/practices", payload: { name: "P EqL", region: "R1", credit_limit_cents: 10000000 }, as: DistributionAdmin, captures: { p: $.data.id } }
            - { call: "POST /api/products", payload: { sku: "EQ-16", name: "Chair", kind: "EQUIPMENT", unit_price_cents: 500000, manufacturer: "M", warranty_months: 12 }, as: DistributionAdmin, captures: { eq: $.data.id } }
          trigger:
            - { call: "POST /api/orders", payload: { practice_id: "${p}", kind: "MANUAL", lines: [ { product_id: "${eq}", quantity: 1 } ] }, as: SalesRep, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_EQUIPMENT_NOT_ORDERABLE; no order created"

      - name: regulated_qty_limit_with_valid_license
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_REGULATED_QTY_LIMIT]"]
        distinguishing_aspect: "With the safety check satisfied (valid license), the constraint check fires alone: quantity 5 against max_qty_per_order 2 yields ERR_REGULATED_QTY_LIMIT."
        test_recipe:
          setup: ["Practice P with regulated_license_expiry 2030-01-01; REGULATED product max 2"]
          setup_api_calls:
            - { call: "POST /api/practices", payload: { name: "P Lic", region: "R1", credit_limit_cents: 10000000, regulated_license_expiry: "2030-01-01T00:00:00Z" }, as: DistributionAdmin, captures: { p: $.data.id } }
            - { call: "POST /api/products", payload: { sku: "RG-2", name: "Amalgam", kind: "REGULATED", unit_price_cents: 1000, manufacturer: "M", max_qty_per_order: 2 }, as: DistributionAdmin, captures: { rg: $.data.id } }
          trigger:
            - { call: "POST /api/orders", payload: { practice_id: "${p}", kind: "MANUAL", lines: [ { product_id: "${rg}", quantity: 5 } ] }, as: SalesRep, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_REGULATED_QTY_LIMIT (license valid, so priority-7 passes and priority-9 fires)"

