              as: StationAdmin
            - call: "POST /station/pledge-drives/${drv_id}/schedule"
              payload: {}
              as: StationAdmin
            - call: "POST /station/pledge-drives/${drv_id}/go-live"
              payload: {}
              as: StationAdmin
          trigger:
            - call: "POST /station/pledges"
              payload: { donor_id: "${d1_id}", membership_id: "${m2_id}", drive_id: "${drv_id}", channel: "PHONE", kind: "ONE_TIME", amount_cents: 6000 }
