      - name: error_license_amendment_cycle_on_executed_license
        claim_type: cyclic
        grounds:
          - state_machines.LicenseAgreement.EXECUTED_to_AMENDMENT_PENDING
          - state_machines.LicenseAgreement.AMENDMENT_PENDING_to_EXECUTED
        excluded_because:
          difficulty_instance: non_linear_state_machine / license_amendment_round_trips_executed_to_amendment_pending_and_back_twice
          rationale: "The named §1.8 instance walks the loop twice and asserts amendment_round after each lap, which is exactly the cyclic-shape claim."

      - name: error_service_order_two_independent_state_dimensions
        claim_type: parallel
        grounds:
          - state_machines.ServiceOrder.approval_status
          - state_machines.ServiceOrder.billing_status
        excluded_because:
          difficulty_instance: non_linear_state_machine / service_order_billing_dimension_blocks_approval_dimension_cancellation
          rationale: "The named §1.8 instance drives both dimensions and asserts that one blocks the other, covering the independent-dimension claim."

      - name: error_confirm_definite_guarded_by_the_sibling_license_state
        claim_type: guarded_transitions
        grounds:
          - state_machines.EventBooking.TENTATIVE_to_DEFINITE
          - errors[ERR_LICENSE_STATE_INVALID]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / booking_cannot_be_confirmed_definite_while_license_is_only_issued
          rationale: "The named §1.8 instance is precisely the cross-entity guard on this edge."

      - name: error_settlement_finalize_bubbles_up_to_the_client_and_sideways_to_siblings
        claim_type: cross_entity
        grounds:
          - endpoints[POST /convention-center/settlements/{id}/finalize]
          - calculations.client_booking_standing
        excluded_because:
          difficulty_instance: transitive_cascade / settlement_finalize_cascades_client_standing_into_sibling_booking_order_lock
          rationale: "The named §1.8 instance follows the finalize cascade from settlement to client to a sibling booking's order_posture."

  - section: calculations
    instances:
      - name: contracted_rental_charge_applies_the_citywide_discount_to_the_gross
        claim_type: correct_result
        grounds:
          - calculations.contracted_rental_charge
          - entities.BookingPolicyWindow.fields.rental_discount_pct
        distinguishing_aspect: |
          Hall A at 4800000 per day over four show days, four move-in days and two
          move-out days gives billable_units 7 and a gross of 33600000; the citywide
          window's 0.25 discount must be applied to the gross and not to the daily rate,
          leaving contracted_rental_cents 25200000 and deposit_required_cents 6300000.
        test_recipe:
          setup:
            - "the CITYWIDE_CONVENTION window has rental_discount_pct 0.25"
            - "Hall A has daily_base_rate_cents 4800000"
            - "National Widget Association is a NATIONAL_ASSOCIATION projecting 3000 room nights"
          setup_api_calls:
            - call: "POST /convention-center/policy-windows"
              payload: { event_class: "CITYWIDE_CONVENTION", priority_rank: 1, open_months_before: 60, close_months_before: 18, max_holds_per_booking: 3, challenge_response_hours: 120, rental_discount_pct: 0.25, max_challenge_rounds: 2 }
              as: VenueAdmin
            - call: "POST /convention-center/spaces"
              payload: { name: "Hall A", space_class: "HALL", rentable_sqft: 200000, daily_base_rate_cents: 4800000, rigging_capable: true }
              as: VenueAdmin
              captures: { sp_ha_id: $.data.id }
            - call: "POST /convention-center/clients"
              payload: { legal_name: "National Widget Association", contact_email: "nwa@example.org", organization_type: "NATIONAL_ASSOCIATION" }
              as: VenueAdmin
              captures: { cl_nwa_id: $.data.id }
          trigger:
            - call: "POST /convention-center/bookings"
              payload: { client_id: "${cl_nwa_id}", space_id: "${sp_ha_id}", event_name: "National Widget Convention", event_class: "CITYWIDE_CONVENTION", move_in_start_date: "2028-05-10", show_start_date: "2028-05-14", show_end_date: "2028-05-17", move_out_end_date: "2028-05-19", projected_room_nights: 3000 }
              as: SalesManager
              captures: { bk_id: $.data.id }
          assert:
            - "the trigger returns 201"
            - "EventBooking.${bk_id}.gross_rental_cents == 33600000"
            - "EventBooking.${bk_id}.contracted_rental_cents == 25200000"
            - "EventBooking.${bk_id}.deposit_required_cents == 6300000"
            - "EventBooking.${bk_id}.space_days_committed == 10"
            - "SpaceUnit.${sp_ha_id}.committed_space_days == 10"

      - name: client_standing_ignores_a_settlement_that_is_only_issued
        claim_type: input_set_filtering
        grounds:
          - calculations.client_booking_standing
          - entities.Client.fields.outstanding_balance_cents
          - entities.EventSettlement.fields.status
        distinguishing_aspect: |
          The input set is FINAL settlements only. A settlement sitting at ISSUED with
          grand_total_cents 5350000 must contribute nothing: outstanding_balance_cents
          stays at 0 and standing stays GOOD, so no sibling booking is locked while the
          licensee still has a live dispute window.
        test_recipe:
          setup:
            - "the Ballroom C CONSUMER_SHOW booking is CLOSED with contracted_rental_cents 5000000"
