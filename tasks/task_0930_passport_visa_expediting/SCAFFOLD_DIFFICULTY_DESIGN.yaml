  # =======================================================================
  # Rule 4 — transitive cascades from DIFFERENT triggers (depth 5 and depth 4)
  # =======================================================================
  - rule_id: transitive_cascade
    instances:

      - name: agency_form_revision_regresses_five_entity_hops
        grounds:
          - state_machines.AgencyForm.DRAFT_to_ACTIVE
          - state_machines.PreparedForm.PREPARED_to_STALE
          - state_machines.Applicant.COMPLETE_to_PENDING
          - state_machines.Order.READY_FOR_SUBMISSION_to_INTAKE
          - state_machines.CourierLeg.CREATED_to_CANCELLED
        distinguishing_aspect: |
          Depth-5 chain rooted at POST /expediting/agency-forms/{id}/publish:
          AgencyForm rev1 -> SUPERSEDED causes PreparedForm -> STALE, which
          causes Applicant -> PENDING, which causes Order READY_FOR_SUBMISSION ->
          INTAKE, which causes the order's undispatched CourierLeg -> CANCELLED.
          Every hop is caused by the preceding hop, not by the publish request.
        test_recipe:
          setup:
            - "DS-160 revision 1 published and ACTIVE; DS-160 revision 2 registered but still DRAFT."
            - "A STANDARD single-applicant order in workflow_status READY_FOR_SUBMISSION with custody_holder SERVICE, the applicant COMPLETE against revision 1."
            - "A second CourierLeg (SERVICE -> AGENCY, leg_index 2) created but not dispatched."
          setup_api_calls:
            - call: "POST /expediting/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /expediting/agency-forms"
