      - name: no_role_reaches_another_roles_exclusive_operation_and_the_auth_band_answers_first
        claim_type: ERR_UNAUTHORIZED
        grounds:
          - validations[priority=1] ERR_MISSING_USER_ID
          - validations[priority=2] ERR_UNKNOWN_USER
          - validations[priority=3] ERR_UNAUTHORIZED
          - roles.*.exclusive_operations
        distinguishing_aspect: |
          The negative half of the matrix, and the ordering inside the auth band that a naive
          implementation gets wrong in three separate ways. A blank header is *absent*, not unknown,
          so priority 1 must answer before priority 2. An unknown identity must be rejected before
          the role table is consulted. And priority 3 must answer before any existence check, so an
          accountant poking at a nonexistent transaction's reverse endpoint learns only that the
          verb is not theirs — never that the row does not exist, which would leak the id space to
          an unauthorised caller. It also pins that PlatformAdmin is a registry operator, not a
          superuser: it cannot create a program even though it created the cedent the program would
          belong to.
