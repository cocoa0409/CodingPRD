            - "FinancialAidPackage.${pkg_id}.status == RETURNED (link 2')"
            - "FinancialAidPackage.${pkg_id} schedule entry 1 RETURNED, entry 2 CANCELLED, cancelled_cents == 369750 (link 3)"
