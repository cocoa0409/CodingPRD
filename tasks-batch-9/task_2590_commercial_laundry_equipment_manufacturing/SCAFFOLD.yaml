    error_id: ERR_PAYMENT_MODULE_NOT_SUPPORTED
    http_status: 422
    applies_to: "POST /clm/quotes/{id}/lines, POST /clm/machine-models"
  - priority: 43
    category: business_referential
    check: "the referenced AssemblyStation.station_state is OPEN; a station in MAINTENANCE accepts no station logs"
    error_id: ERR_STATION_UNAVAILABLE
    http_status: 409
    applies_to: "POST /clm/build-orders/{id}/station-logs"
  - priority: 44
    category: business_temporal
    check: "started_at < completed_at, and effective_from <= effective_to on a rebate program"
    error_id: ERR_INTERVAL_INVALID
    http_status: 400
    applies_to: "POST /clm/build-orders/{id}/station-logs, POST /clm/rebate-programs"
  - priority: 45
    category: business_temporal
    check: "the number of existing StationLog occupation windows at the same station that overlap the new occupation window (closed intervals, buffer included) is strictly less than AssemblyStation.parallel_capacity"
    error_id: ERR_STATION_CAPACITY_CONFLICT
    http_status: 409
    applies_to: "POST /clm/build-orders/{id}/station-logs"
  - priority: 46
    category: business_temporal
    check: "no existing StationLog of the same technician has a work interval [started_at, completed_at) overlapping the new one"
    error_id: ERR_TECHNICIAN_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /clm/build-orders/{id}/station-logs"
  - priority: 47
    category: business_temporal
    check: "for the same utility_code and program_class, the new [effective_from, effective_to] window is separated from every existing non-RETIRED program window by at least one full clear day; a conflict is declared when new.effective_from <= existing.effective_to + 1 day AND existing.effective_from <= new.effective_to + 1 day"
    error_id: ERR_PROGRAM_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /clm/rebate-programs"
  - priority: 48
    category: business_constraint
    check: "the submitted natural key is unique: MachineModel.model_code, RebateProgram.program_code, ServicePart.part_number, AssemblyStation.station_code, Technician.employee_code, Distributor.distributor_code, BuildOrder.serial_number"
    error_id: ERR_DUPLICATE_RESOURCE_CODE
    http_status: 409
    applies_to: "POST /clm/machine-models, POST /clm/rebate-programs, POST /clm/service-parts, POST /clm/assembly-stations, POST /clm/technicians, POST /clm/distributors, POST /clm/build-orders"
  - priority: 49
    category: business_constraint
    check: "capacity_rating_lb is inside the band its product_line allows (inclusive both ends): ON_PREMISES 20..200, VENDED 20..80, INDUSTRIAL_TUNNEL 150..600"
    error_id: ERR_CAPACITY_RATING_OUT_OF_BAND
    http_status: 422
    applies_to: "POST /clm/machine-models"
  - priority: 50
    category: business_constraint
    check: "the model has no CertificationDossier in IN_REVIEW, CERTIFIED or RESURVEY_REQUIRED"
    error_id: ERR_DOSSIER_ALREADY_OPEN
    http_status: 409
    applies_to: "POST /clm/machine-models/{id}/certification-dossiers"
  - priority: 51
    category: business_constraint
    check: "territory_exclusive is honored: creating a distributor with territory_exclusive == true is rejected when any non-TERMINATED distributor already holds that territory_code, and creating any distributor in a territory_code already held exclusively by a non-TERMINATED distributor is rejected"
    error_id: ERR_TERRITORY_EXCLUSIVITY_CONFLICT
    http_status: 409
    applies_to: "POST /clm/distributors"
  - priority: 52
    category: business_constraint
    check: "the key \"<technician_id>|<training_module>\" is not already present in Distributor.completed_training_keys"
    error_id: ERR_TRAINING_RECORD_DUPLICATE
    http_status: 409
    applies_to: "POST /clm/distributors/{id}/training-completions"
  - priority: 53
    category: business_constraint
    check: "the quote has at least one QuoteLine (line_count >= 1)"
    error_id: ERR_QUOTE_HAS_NO_LINES
    http_status: 422
    applies_to: "POST /clm/quotes/{id}/submit"
  - priority: 54
    category: business_fiscal
    check: "the acting or referenced Distributor.distributor_state is AUTHORIZED (quote submission and technician certification grants for distributor-employed technicians accept AUTHORIZED or PROBATION only as stated per endpoint)"
    error_id: ERR_DISTRIBUTOR_NOT_AUTHORIZED
    http_status: 409
    applies_to: "POST /clm/quotes/{id}/submit, POST /clm/technicians/{id}/certification-actions"
  - priority: 55
    category: business_fiscal
    check: "the claim is coverable: in_service_months <= ServicePart.warranty_months AND failure_cycle_count <= the computed effective_rated_cycles"
    error_id: ERR_CLAIM_NOT_COVERABLE
    http_status: 422
    applies_to: "POST /clm/warranty-claims/{id}/adjudicate"
  - priority: 56
    category: business_fiscal
    check: "ServicePart.on_hand_qty >= 1 for the claimed part at APPROVE time"
    error_id: ERR_INSUFFICIENT_PART_STOCK
    http_status: 409
    applies_to: "POST /clm/warranty-claims/{id}/adjudicate"
  - priority: 57
    category: business_fiscal
    check: "on_hand_qty + delta_qty >= 0"
    error_id: ERR_STOCK_ADJUSTMENT_NEGATIVE
    http_status: 422
    applies_to: "POST /clm/service-parts/{id}/stock-adjustments"

# Every path is prefixed with api_prefix `/clm`, except the single test-driving clock endpoint under `/_clock`.
# Every list endpoint accepts `limit?` and `offset?` and returns the §1.0 pagination envelope
# (limit default 10, min 1, max 100; offset default 0; meta carries limit, offset, total_count, has_more).
endpoints:
  # ---------- MachineModel ----------
  - method: POST
    path: "/clm/machine-models"
    description: "Register a machine model in DRAFT. capacity_rating_lb must sit inside its product line's band."
    roles: [ProductEngineer]
    code: 201
    input: [model_code, product_line, capacity_rating_lb, rated_water_gal_per_cwt, rated_kwh_per_cwt, drum_alloy_grade, payment_module_options, list_price_cents, "max_rework_cycles?", "min_first_pass_yield_pct?"]
    output: MachineModel
    side_effects:
      - "certification_state = DRAFT, suspended_reason = NONE"
      - "accepted_unit_count = 0, scrapped_unit_count = 0, quality_hold_unit_count = 0, first_pass_yield_pct = 0.00"
      - "rebate_program_codes = [], rebate_amount_cents = 0"
      - "max_rework_cycles defaults to 2 and min_first_pass_yield_pct defaults to 80.00 when omitted"
  - method: GET
    path: "/clm/machine-models/{id}"
    description: "Read one machine model with its certification, yield and rebate fields."
    roles: [ProductEngineer, ComplianceOfficer, PlantManager, TrainingAdministrator, ChannelManager, WarrantyAnalyst, Technician, QualityInspector, Distributor]
    code: 200
    input: []
    output: MachineModel
    side_effects: []
  - method: GET
    path: "/clm/machine-models"
    description: "List machine models, newest first by created_at DESC."
    roles: [ProductEngineer, ComplianceOfficer, PlantManager, ChannelManager, WarrantyAnalyst, Distributor]
    code: 200
    input: ["product_line?", "certification_state?", "limit?", "offset?"]
    output: MachineModel[]
    side_effects: []
  - method: POST
    path: "/clm/machine-models/{id}/lifecycle-actions"
    description: "Apply a manual lifecycle action to a model. action is RELEASE or SUSPEND."
    roles: [ProductEngineer]
    code: 200
    input: [action, "reason?"]
    output: MachineModel
    side_effects:
      - "drives state_machines.MachineModel CERTIFIED_to_RELEASED or RELEASED_to_SUSPENDED"
      - "SUSPEND sets suspended_reason = MANUAL and clears rebate_program_codes and rebate_amount_cents"
      - "increments MachineModel.version by 1"
  - method: GET
    path: "/clm/machine-models/{id}/warranty-analysis"
    description: "Computed read: warranty exposure for one model, broken down by component class and duty cycle class. Counts and money are aggregated over every WarrantyClaim whose BuildOrder belongs to this model; VOIDED claims are excluded from covered_amount_total_cents but counted in voided_claim_count."
    roles: [WarrantyAnalyst, ProductEngineer]
    code: 200
    input: ["duty_cycle_class?"]
    output: { model_id: string, claim_count: integer, approved_claim_count: integer, denied_claim_count: integer, blocked_claim_count: integer, voided_claim_count: integer, covered_amount_total_cents: integer, full_replacement_count: integer, pro_rata_count: integer, component_class_breakdown: string, duty_cycle_breakdown: string }
    side_effects: []

  # ---------- RebateProgram ----------
  - method: POST
    path: "/clm/rebate-programs"
    description: "Create a utility rebate program with its efficiency ceilings and validity window."
    roles: [ComplianceOfficer]
    code: 201
    input: [program_code, utility_code, program_class, eligible_product_lines, max_water_gal_per_cwt, max_kwh_per_cwt, min_capacity_rating_lb, rebate_base_cents, capacity_bonus_cents_per_10lb, rebate_cap_cents, effective_from, effective_to]
    output: RebateProgram
    side_effects:
      - "program_state = ACTIVE"
      - "rejects a window that is not separated from an existing same-utility, same-class window by at least one full clear day (ERR_PROGRAM_WINDOW_CONFLICT)"
  - method: GET
    path: "/clm/rebate-programs/{id}"
    description: "Read one rebate program."
    roles: [ComplianceOfficer, ProductEngineer, ChannelManager]
    code: 200
    input: []
    output: RebateProgram
    side_effects: []
  - method: GET
    path: "/clm/rebate-programs"
    description: "List rebate programs ordered by effective_from ASC then program_code ASC."
    roles: [ComplianceOfficer, ProductEngineer, ChannelManager]
    code: 200
    input: ["utility_code?", "program_state?", "limit?", "offset?"]
    output: RebateProgram[]
    side_effects: []

  # ---------- CertificationDossier ----------
  - method: POST
    path: "/clm/machine-models/{id}/certification-dossiers"
    description: "Open an efficiency and water-consumption certification dossier for a model. The acting officer becomes prepared_by_user_id and is therefore barred from reviewing it."
    roles: [ComplianceOfficer]
    code: 201
    input: [measured_water_gal_per_cwt, measured_kwh_per_cwt, test_cycle_count]
    output: CertificationDossier
    side_effects:
      - "model_id taken from the path; prepared_by_user_id = X-User-ID"
      - "dossier_state = IN_REVIEW, energy_review_state = PENDING, water_review_state = PENDING, resurvey_count = 0"
      - "rejected with ERR_DOSSIER_ALREADY_OPEN when the model already has a dossier in IN_REVIEW, CERTIFIED or RESURVEY_REQUIRED"
  - method: GET
    path: "/clm/certification-dossiers/{id}"
    description: "Read one certification dossier including both review dimensions and the qualified rebate programs."
    roles: [ComplianceOfficer, ProductEngineer, ChannelManager]
    code: 200
    input: []
    output: CertificationDossier
    side_effects: []
  - method: GET
    path: "/clm/machine-models/{id}/certification-dossiers"
    description: "FK reverse-reachability for CertificationDossier.model_id: every dossier of one model, created_at ASC."
    roles: [ComplianceOfficer, ProductEngineer, ChannelManager]
    code: 200
    input: ["dossier_state?", "limit?", "offset?"]
    output: CertificationDossier[]
    side_effects: []
  - method: POST
    path: "/clm/certification-dossiers/{id}/reviews"
    description: "Record one dimension's review decision. dimension is ENERGY or WATER; decision is APPROVE or REJECT."
    roles: [ComplianceOfficer]
    code: 200
    input: [dimension, decision, "note?"]
    output: CertificationDossier
    side_effects:
      - "drives state_machines.CertificationDossier IN_REVIEW_to_IN_REVIEW, IN_REVIEW_to_CERTIFIED or IN_REVIEW_to_REJECTED"
      - "on the second APPROVE: runs calculations.rebate_qualification, stamps certified_at, and cascades the parent MachineModel into CERTIFIED"
      - "increments CertificationDossier.version by 1"
  - method: POST
    path: "/clm/certification-dossiers/{id}/resurvey-submissions"
    description: "Submit fresh measurements for a dossier that was pushed back to RESURVEY_REQUIRED by a yield breach."
    roles: [ComplianceOfficer]
    code: 200
    input: [measured_water_gal_per_cwt, measured_kwh_per_cwt, test_cycle_count]
    output: CertificationDossier
    side_effects:
      - "drives state_machines.CertificationDossier RESURVEY_REQUIRED_to_IN_REVIEW"
      - "both review dimensions reset to PENDING, both reviewer ids cleared, prepared_by_user_id = X-User-ID"
      - "increments CertificationDossier.version by 1"

  # ---------- ServicePart ----------
  - method: POST
    path: "/clm/service-parts"
    description: "Create a service part with its fitment envelope, duty rating and warranty term. on_hand_qty starts at 0, so stock_state starts BACKORDERED."
    roles: [ProductEngineer]
    code: 201
    input: [part_number, component_class, fits_product_lines, fits_min_capacity_lb, fits_max_capacity_lb, rated_duty_cycles, warranty_months, unit_price_cents, requires_cert_scope, reorder_point_qty, "supersedes_part_id?"]
    output: ServicePart
    side_effects:
      - "on_hand_qty = 0, reserved_qty = 0, stock_state = BACKORDERED"
  - method: GET
    path: "/clm/service-parts/{id}"
    description: "Read one service part including its stock position."
    roles: [ProductEngineer, PlantManager, WarrantyAnalyst, ChannelManager, Technician, Distributor]
    code: 200
    input: []
    output: ServicePart
    side_effects: []
  - method: GET
    path: "/clm/service-parts"
    description: "List service parts, part_number ASC. FK reverse-reachability for ServicePart.supersedes_part_id via the supersedes_part_id filter."
    roles: [ProductEngineer, PlantManager, WarrantyAnalyst, Distributor]
    code: 200
    input: ["component_class?", "stock_state?", "supersedes_part_id?", "limit?", "offset?"]
    output: ServicePart[]
    side_effects: []
  - method: POST
    path: "/clm/service-parts/{id}/stock-adjustments"
    description: "Move a part's on-hand quantity by delta_qty (positive receipt or negative shrinkage)."
    roles: [PlantManager]
    code: 200
    input: [delta_qty, reason]
    output: ServicePart
    side_effects:
      - "on_hand_qty += delta_qty; rejected with ERR_STOCK_ADJUSTMENT_NEGATIVE when the result would be negative"
      - "runs calculations.part_stock_projection and applies the BACKORDERED entry/exit claim cascades"
      - "increments ServicePart.version by 1"

  # ---------- AssemblyStation ----------
  - method: POST
    path: "/clm/assembly-stations"
    description: "Create an assembly station with its parallel capacity and changeover buffer."
    roles: [PlantManager]
    code: 201
    input: [station_code, station_type, parallel_capacity, changeover_buffer_minutes, supported_product_lines, "station_state?"]
    output: AssemblyStation
    side_effects:
      - "station_state defaults to OPEN when omitted"
  - method: GET
    path: "/clm/assembly-stations/{id}"
    description: "Read one assembly station."
    roles: [PlantManager, ProductEngineer, Technician, QualityInspector]
    code: 200
    input: []
    output: AssemblyStation
    side_effects: []
  - method: GET
    path: "/clm/assembly-stations"
    description: "List assembly stations, station_code ASC."
    roles: [PlantManager, ProductEngineer, Technician, QualityInspector]
    code: 200
    input: ["station_type?", "station_state?", "limit?", "offset?"]
    output: AssemblyStation[]
    side_effects: []

  # ---------- Technician ----------
  - method: POST
    path: "/clm/technicians"
    description: "Register a technician, either factory-employed or employed by a distributor. Certification starts UNCERTIFIED with no scopes."
    roles: [TrainingAdministrator]
    code: 201
    input: [employee_code, full_name, employer, "distributor_id?"]
    output: Technician
    side_effects:
      - "cert_state = UNCERTIFIED, cert_scopes = [], cert_expires_on = null, revocation_count = 0"
      - "distributor_id required when employer == DISTRIBUTOR and must be null when employer == FACTORY"
  - method: GET
    path: "/clm/technicians/{id}"
    description: "Read one technician's certification record."
    roles: [TrainingAdministrator, PlantManager, ChannelManager, WarrantyAnalyst, Technician, QualityInspector, Distributor]
    code: 200
    input: []
    output: Technician
    side_effects: []
  - method: GET
    path: "/clm/technicians"
    description: "List technicians, employee_code ASC. FK reverse-reachability for Technician.distributor_id via the distributor_id filter."
    roles: [TrainingAdministrator, PlantManager, ChannelManager, WarrantyAnalyst, Distributor]
    code: 200
    input: ["distributor_id?", "cert_state?", "employer?", "limit?", "offset?"]
    output: Technician[]
    side_effects: []
  - method: POST
    path: "/clm/technicians/{id}/certification-actions"
    description: "GRANT, RENEW or REVOKE a technician's certification. scopes and expires_on are required for GRANT and RENEW; reason is required for REVOKE."
    roles: [TrainingAdministrator]
    code: 200
    input: [action, "scopes?", "expires_on?", "reason?"]
    output: Technician
    side_effects:
      - "drives state_machines.Technician transitions"
      - "REVOKE fires the four-hop certification-revocation cascade over BuildOrder, WarrantyClaim and Distributor"
      - "GRANT on a REVOKED technician fires the three-hop regrant cascade that lifts integrity holds and unblocks claims"
      - "increments Technician.version by 1"

  # ---------- BuildOrder ----------
  - method: POST
    path: "/clm/build-orders"
    description: "Open a serialized build order for a model in PLANNED."
    roles: [PlantManager]
    code: 201
    input: [model_id, serial_number, planned_start_at]
    output: BuildOrder
    side_effects:
      - "build_state = PLANNED, rework_count = 0, integrity_hold = false, labor_minutes_total = 0, station_pass_count = 0, scrap_reason = NONE"
  - method: GET
    path: "/clm/build-orders/{id}"
    description: "Read one build order with its rework, labor and hold fields."
    roles: [PlantManager, ProductEngineer, ComplianceOfficer, WarrantyAnalyst, Technician, QualityInspector, Distributor]
    code: 200
    input: []
    output: BuildOrder
    side_effects: []
  - method: GET
    path: "/clm/build-orders"
    description: "List build orders, created_at ASC. FK reverse-reachability for BuildOrder.model_id via the model_id filter."
    roles: [PlantManager, ProductEngineer, ComplianceOfficer, WarrantyAnalyst, Technician, QualityInspector]
    code: 200
    input: ["model_id?", "build_state?", "integrity_hold?", "limit?", "offset?"]
    output: BuildOrder[]
    side_effects: []
  - method: POST
    path: "/clm/build-orders/{id}/release-to-floor"
    description: "Release a PLANNED or REWORK unit to the floor. Requires the model to be CERTIFIED or RELEASED; a unit in QUALITY_HOLD cannot be released."
    roles: [PlantManager]
    code: 200
    input: []
    output: BuildOrder
    side_effects:
      - "drives state_machines.BuildOrder PLANNED_to_ON_FLOOR or REWORK_to_ON_FLOOR"
      - "increments BuildOrder.version by 1"
  - method: POST
    path: "/clm/build-orders/{id}/qa-signoff"
    description: "Final QA decision on a unit in QA_HOLD. decision is APPROVE or REJECT; defect_code is required for REJECT. The acting inspector must not have worked any station on this unit."
    roles: [QualityInspector]
    code: 200
    input: [decision, "defect_code?", "note?"]
    output: BuildOrder
    side_effects:
      - "drives state_machines.BuildOrder QA_HOLD_to_ACCEPTED or QA_HOLD_to_REWORK"
      - "recomputes MachineModel.accepted_unit_count / scrapped_unit_count / first_pass_yield_pct"
      - "a REJECT that exceeds max_rework_cycles fires the six-hop yield-breach cascade"
      - "increments BuildOrder.version by 1"

  # ---------- StationLog ----------
  - method: POST
    path: "/clm/build-orders/{id}/station-logs"
    description: "Record one station operation on a unit. technician_id is taken from the acting X-User-ID. bearing_preload_micron is required for BEARING_INSTALL and must be null otherwise; defect_code is required when outcome == FAIL."
    roles: [Technician]
    code: 201
    input: [station_id, station_type, started_at, completed_at, outcome, "defect_code?", "bearing_preload_micron?"]
    output: StationLog
    side_effects:
      - "runs calculations.station_occupation_window: occupation_from, occupation_to and labor_minutes are stored on the log"
      - "advances or reworks the BuildOrder per state_machines.BuildOrder"
      - "recomputes BuildOrder.labor_minutes_total and BuildOrder.station_pass_count"
      - "increments BuildOrder.version by 1"
  - method: GET
    path: "/clm/station-logs/{id}"
    description: "Read one station log including its occupation window."
    roles: [PlantManager, ProductEngineer, ComplianceOfficer, WarrantyAnalyst, Technician, QualityInspector]
    code: 200
    input: []
    output: StationLog
    side_effects: []
  - method: GET
    path: "/clm/station-logs"
    description: "List station logs, started_at ASC then created_at ASC. FK reverse-reachability for StationLog.build_order_id, station_id and technician_id via the three filters."
    roles: [PlantManager, ProductEngineer, ComplianceOfficer, WarrantyAnalyst, Technician, QualityInspector]
    code: 200
    input: ["build_order_id?", "station_id?", "technician_id?", "outcome?", "limit?", "offset?"]
    output: StationLog[]
    side_effects: []

  # ---------- Distributor ----------
  - method: POST
    path: "/clm/distributors"
    description: "Create a distributor in PENDING_TRAINING with a territory assignment that may be exclusive."
    roles: [ChannelManager]
    code: 201
    input: [distributor_code, legal_name, territory_code, territory_exclusive]
    output: Distributor
    side_effects:
      - "distributor_state = PENDING_TRAINING, installation_training_state = NOT_STARTED, probation_reason = NONE"
      - "completed_training_keys = [], trained_technician_count = 0, warranty_credit_cents = 0, open_claim_count = 0"
      - "rejected with ERR_TERRITORY_EXCLUSIVITY_CONFLICT per validations[priority=51]"
  - method: GET
    path: "/clm/distributors/{id}"
    description: "Read one distributor including training progress, warranty credit and open claim count."
    roles: [ChannelManager, TrainingAdministrator, WarrantyAnalyst, ProductEngineer, Distributor]
    code: 200
    input: []
    output: Distributor
    side_effects: []
  - method: GET
    path: "/clm/distributors"
    description: "List distributors, distributor_code ASC."
    roles: [ChannelManager, TrainingAdministrator, WarrantyAnalyst]
    code: 200
    input: ["territory_code?", "distributor_state?", "limit?", "offset?"]
    output: Distributor[]
    side_effects: []
  - method: POST
    path: "/clm/distributors/{id}/training-completions"
    description: "Record that one of the distributor's technicians completed one installation-training module. training_module is INSTALLATION, PAYMENT_SYSTEMS or DIAGNOSTICS."
    roles: [TrainingAdministrator]
    code: 200
    input: [technician_id, training_module, completed_on]
    output: Distributor
    side_effects:
      - "appends \"<technician_id>|<training_module>\" to completed_training_keys and recomputes trained_technician_count"
      - "drives state_machines.Distributor PENDING_TRAINING_to_PENDING_TRAINING or PENDING_TRAINING_to_AUTHORIZED"
      - "increments Distributor.version by 1"
  - method: POST
    path: "/clm/distributors/{id}/status-actions"
    description: "Channel action on a distributor. action is PROBATION, REINSTATE or TERMINATE; reason is required for PROBATION and TERMINATE."
    roles: [ChannelManager]
    code: 200
    input: [action, "reason?"]
    output: Distributor
    side_effects:
      - "drives state_machines.Distributor AUTHORIZED_to_PROBATION, PROBATION_to_AUTHORIZED or ANY_to_TERMINATED"
      - "PROBATION adds 150 bp to every subsequent financing computation for this distributor"
      - "increments Distributor.version by 1"

  # ---------- PackageQuote / QuoteLine ----------
  - method: POST
    path: "/clm/quotes"
    description: "Draft an equipment package quote for a laundromat customer. distributor_id must equal the acting Distributor X-User-ID."
    roles: [Distributor]
    code: 201
    input: [distributor_id, customer_name, laundromat_site_code, stated_credit_score, financing_program, down_payment_cents, package_discount_pct, freight_cents]
    output: PackageQuote
    side_effects:
      - "quote_state = DRAFT, revision_round = 0, line_count = 0, line_subtotal_cents = 0, discount_cents = 0"
      - "total_cents = freight_cents (calculations.quote_money_rollup over an empty line set)"
      - "verified_credit_score, provisional_apr_bp, provisional_monthly_payment_cents, final_apr_bp, monthly_payment_cents all null"
  - method: GET
    path: "/clm/quotes/{id}"
    description: "Read one quote with its money and financing fields. A Distributor may read only its own quotes."
    roles: [ChannelManager, Distributor]
    code: 200
    input: []
    output: PackageQuote
    side_effects: []
  - method: GET
    path: "/clm/quotes"
    description: "List quotes, created_at DESC. FK reverse-reachability for PackageQuote.distributor_id via the distributor_id filter."
    roles: [ChannelManager, Distributor]
    code: 200
    input: ["distributor_id?", "quote_state?", "limit?", "offset?"]
    output: PackageQuote[]
    side_effects: []
  - method: POST
    path: "/clm/quotes/{id}/lines"
    description: "Add a machine line to a DRAFT or REVISION_REQUESTED quote. Carries the OCC field expected_quote_version per concurrency_rules[quote-line-create-stale-quote]."
    roles: [Distributor]
    code: 201
    input: [model_id, quantity, payment_module, line_discount_pct, expected_quote_version]
    output: QuoteLine
    side_effects:
      - "snapshots MachineModel.list_price_cents into QuoteLine.unit_price_cents"
      - "runs calculations.quote_line_total then calculations.quote_money_rollup on the parent quote"
      - "increments PackageQuote.version by 1"
  - method: DELETE
    path: "/clm/quotes/{id}/lines/{line_id}"
    description: "Remove a line from a DRAFT or REVISION_REQUESTED quote and re-derive the quote money identity. Carries expected_quote_version and returns the updated parent quote."
    roles: [Distributor]
    code: 200
    input: [expected_quote_version]
    output: PackageQuote
    side_effects:
      - "deletes the QuoteLine row and re-runs calculations.quote_money_rollup"
      - "rejected with ERR_STALE_QUOTE_VERSION on a stale expected_quote_version"
      - "increments PackageQuote.version by 1"
  - method: GET
    path: "/clm/quote-lines/{id}"
    description: "Read one quote line including its surcharge and extended total."
    roles: [ChannelManager, Distributor]
    code: 200
    input: []
    output: QuoteLine
    side_effects: []
  - method: GET
    path: "/clm/quote-lines"
    description: "List quote lines, created_at ASC. FK reverse-reachability for QuoteLine.quote_id and QuoteLine.model_id via the two filters."
    roles: [ChannelManager, Distributor]
    code: 200
    input: ["quote_id?", "model_id?", "limit?", "offset?"]
    output: QuoteLine[]
    side_effects: []
  - method: POST
    path: "/clm/quotes/{id}/submit"
    description: "Submit a quote for channel decision. Computes the provisional financing terms from the distributor-stated credit score."
    roles: [Distributor]
    code: 200
    input: []
    output: PackageQuote
    side_effects:
      - "drives state_machines.PackageQuote DRAFT_to_SUBMITTED or REVISION_REQUESTED_to_SUBMITTED"
      - "runs calculations.financing_terms variant provisional and writes origination_fee_cents and financed_principal_cents"
      - "increments PackageQuote.version by 1"
  - method: POST
    path: "/clm/quotes/{id}/decision"
    description: "Channel decision on a SUBMITTED quote. decision is APPROVE, DECLINE or REQUEST_REVISION; verified_credit_score is required for APPROVE."
    roles: [ChannelManager]
    code: 200
    input: [decision, "verified_credit_score?", "note?"]
    output: PackageQuote
    side_effects:
      - "drives state_machines.PackageQuote SUBMITTED_to_APPROVED, SUBMITTED_to_DECLINED or SUBMITTED_to_REVISION_REQUESTED"
      - "APPROVE runs calculations.financing_terms variant final and writes final_apr_bp and monthly_payment_cents"
      - "increments PackageQuote.version by 1"

  # ---------- WarrantyClaim ----------
  - method: POST
    path: "/clm/warranty-claims"
    description: "File a warranty claim against an ACCEPTED unit for a failed service part. distributor_id must equal the acting Distributor X-User-ID and reported_by_technician_id must be one of that distributor's technicians."
    roles: [Distributor]
    code: 201
    input: [build_order_id, part_id, distributor_id, reported_by_technician_id, failure_cycle_count, in_service_months, duty_cycle_class, diagnostics_code]
    output: WarrantyClaim
    side_effects:
      - "claim_state = SUBMITTED, block_reason = NONE, coverage_variant = NONE, covered_amount_cents = 0"
      - "claim_state is SUBMITTED even when the claimed part is currently BACKORDERED or the claimed unit already carries integrity_hold: FULFILLMENT_BLOCKED is an event-driven consequence of a stock or integrity CHANGE, never a creation-time evaluation"
      - "effective_rated_cycles computed immediately per calculations.warranty_coverage"
      - "Distributor.open_claim_count recomputed"
  - method: GET
    path: "/clm/warranty-claims/{id}"
    description: "Read one warranty claim with its coverage decision and block reason."
    roles: [WarrantyAnalyst, ChannelManager, Distributor]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: []
  - method: GET
    path: "/clm/warranty-claims"
    description: "List warranty claims, created_at ASC. FK reverse-reachability for WarrantyClaim.build_order_id, part_id, distributor_id and reported_by_technician_id via the four filters."
    roles: [WarrantyAnalyst, ChannelManager, Distributor]
    code: 200
    input: ["build_order_id?", "part_id?", "distributor_id?", "reported_by_technician_id?", "claim_state?", "limit?", "offset?"]
    output: WarrantyClaim[]
    side_effects: []
  - method: POST
    path: "/clm/warranty-claims/{id}/adjudicate"
    description: "Adjudicate a SUBMITTED claim. decision is APPROVE or DENY; denial_reason is required for DENY. Carries the OCC field expected_part_version per concurrency_rules[claim-adjudicate-stale-part]."
    roles: [WarrantyAnalyst]
    code: 200
    input: [decision, "denial_reason?", expected_part_version]
    output: WarrantyClaim
    side_effects:
      - "APPROVE runs calculations.warranty_coverage, consumes one unit of the part and credits the distributor"
      - "APPROVE may cascade other SUBMITTED claims on the same part into FULFILLMENT_BLOCKED"
      - "increments ServicePart.version by 1 on both APPROVE and DENY"
      - "increments WarrantyClaim.version by 1"
  - method: POST
    path: "/clm/warranty-claims/{id}/void"
    description: "Void an APPROVED claim, returning the reserved unit to stock and reversing the distributor credit."
    roles: [WarrantyAnalyst]
    code: 200
    input: [reason]
    output: WarrantyClaim
    side_effects:
      - "drives state_machines.WarrantyClaim APPROVED_to_VOIDED"
      - "on_hand_qty += 1 and reserved_qty -= 1 on the part, conserving on_hand_qty + reserved_qty"
      - "Distributor.warranty_credit_cents -= covered_amount_cents"
      - "may unblock other FULFILLMENT_BLOCKED claims on the same part"
      - "increments ServicePart.version by 1 and WarrantyClaim.version by 1"

  # ---------- test-driving endpoint ----------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's logical clock. The server's startup default is exactly 2026-08-01T00:00:00Z and the logical clock never falls back to wall-clock time. Advancing the clock runs two sweeps in this order: (1) every Technician with cert_state == ACTIVE and cert_expires_on <= the new instant moves to EXPIRED with cert_scopes emptied, processed in Technician.created_at ASC order; (2) every RebateProgram with program_state == ACTIVE whose effective_to is strictly before the new instant's date moves to RETIRED, processed in RebateProgram.created_at ASC order. Expiry is not revocation: it fires no BuildOrder integrity cascade."
    roles: [ProductEngineer, ComplianceOfficer, PlantManager, TrainingAdministrator, ChannelManager, WarrantyAnalyst]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string, expired_technician_count: integer, retired_program_count: integer }
    side_effects:
      - "sets the logical clock to to_iso8601"
      - "drives state_machines.Technician ACTIVE_to_EXPIRED and RebateProgram ACTIVE_to_RETIRED"
      - "increments the version of every swept Technician and RebateProgram by 1"

errors:
  # ---- auth / schema ----
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID or X-User-Role header missing or empty"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "X-User-Role is unknown or is not listed in the endpoint's roles"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "malformed body, missing required field, undeclared enum member, out-of-range number, wrong decimal scale, or a conditionally required field omitted (defect_code on FAIL, bearing_preload_micron on BEARING_INSTALL, scopes/expires_on on GRANT, verified_credit_score on APPROVE, denial_reason on DENY)"
  - id: ERR_OWNERSHIP_VIOLATION
    http: 403
    condition: "a Distributor addresses a PackageQuote or WarrantyClaim whose distributor_id is not the acting X-User-ID, or submits a create body naming another distributor"
  # ---- existence ----
  - id: ERR_MODEL_NOT_FOUND
    http: 404
    condition: "path or body model_id does not resolve to a MachineModel"
  - id: ERR_PROGRAM_NOT_FOUND
    http: 404
    condition: "path id does not resolve to a RebateProgram"
  - id: ERR_DOSSIER_NOT_FOUND
    http: 404
    condition: "path id does not resolve to a CertificationDossier"
  - id: ERR_PART_NOT_FOUND
    http: 404
    condition: "path id, body part_id or body supersedes_part_id does not resolve to a ServicePart"
  - id: ERR_STATION_NOT_FOUND
    http: 404
    condition: "path id or body station_id does not resolve to an AssemblyStation"
  - id: ERR_TECHNICIAN_NOT_FOUND
    http: 404
    condition: "path id, body technician_id, body reported_by_technician_id, or the acting X-User-ID of a Technician / QualityInspector does not resolve to a Technician"
  - id: ERR_BUILD_NOT_FOUND
    http: 404
    condition: "path id or body build_order_id does not resolve to a BuildOrder"
  - id: ERR_LOG_NOT_FOUND
    http: 404
    condition: "path id does not resolve to a StationLog"
  - id: ERR_DISTRIBUTOR_NOT_FOUND
    http: 404
    condition: "path id, body distributor_id, or the acting Distributor X-User-ID does not resolve to a Distributor"
  - id: ERR_QUOTE_NOT_FOUND
    http: 404
    condition: "path id does not resolve to a PackageQuote"
  - id: ERR_QUOTE_LINE_NOT_FOUND
    http: 404
    condition: "path line_id does not resolve to a QuoteLine of the addressed quote"
  - id: ERR_CLAIM_NOT_FOUND
    http: 404
    condition: "path id does not resolve to a WarrantyClaim"
  # ---- state ----
  - id: ERR_MODEL_STATE_INVALID
    http: 409
    condition: "the model's certification_state does not permit the requested lifecycle action"
  - id: ERR_MODEL_NOT_CERTIFIED
    http: 409
    condition: "a release-to-floor is attempted while the model's certification_state is DRAFT or SUSPENDED"
  - id: ERR_DOSSIER_STATE_INVALID
    http: 409
    condition: "a review is submitted on a dossier that is not IN_REVIEW or on a dimension that is not PENDING, or a resurvey submission arrives on a dossier that is not RESURVEY_REQUIRED"
  - id: ERR_BUILD_STATE_INVALID
    http: 409
    condition: "the build_state does not permit the operation: release-to-floor outside PLANNED/REWORK (including a QUALITY_HOLD unit), qa-signoff outside QA_HOLD, a station log whose station_type is not the one the current state expects, or a warranty claim filed against a unit that is not ACCEPTED"
  - id: ERR_TECHNICIAN_STATE_INVALID
    http: 409
    condition: "the certification action is not legal from the technician's cert_state"
  - id: ERR_DISTRIBUTOR_STATE_INVALID
    http: 409
    condition: "the distributor_state does not permit the operation, including any operation against a TERMINATED distributor"
  - id: ERR_QUOTE_STATE_INVALID
    http: 409
    condition: "line edit or submit on a quote that is not DRAFT/REVISION_REQUESTED, or a decision on a quote that is not SUBMITTED"
  - id: ERR_CLAIM_STATE_INVALID
    http: 409
    condition: "adjudicate on a claim that is not SUBMITTED (including a FULFILLMENT_BLOCKED claim), or void on a claim that is not APPROVED"
  # ---- optimistic concurrency ----
  - id: ERR_STALE_QUOTE_VERSION
    http: 412
    condition: "expected_quote_version does not equal the current PackageQuote.version"
  - id: ERR_STALE_PART_VERSION
    http: 412
    condition: "expected_part_version does not equal the current ServicePart.version of the claimed part"
  # ---- business safety / compliance ----
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "a dossier preparer reviews own dossier, one officer clears both review dimensions, or a QualityInspector signs off a unit they worked a station on"
  - id: ERR_TECHNICIAN_NOT_CERTIFIED
    http: 422
    condition: "the acting technician is not ACTIVE, is past cert_expires_on, or lacks the cert scope the operation demands"
  - id: ERR_PRELOAD_OUT_OF_SPEC
    http: 422
    condition: "bearing_preload_micron falls outside the inclusive window for the model's drum_alloy_grade"
  # ---- business referential ----
  - id: ERR_PART_NOT_FITTED
    http: 422
    condition: "the claimed part's fitment envelope does not cover the built model's product_line or capacity_rating_lb"
  - id: ERR_STATION_TYPE_MISMATCH
    http: 422
    condition: "the submitted station_type differs from the referenced AssemblyStation.station_type"
  - id: ERR_STATION_LINE_UNSUPPORTED
    http: 422
    condition: "the built model's product_line is not in the station's supported_product_lines"
  - id: ERR_STATION_UNAVAILABLE
    http: 409
    condition: "a station log is submitted against an AssemblyStation whose station_state is MAINTENANCE"
  - id: ERR_TECHNICIAN_DISTRIBUTOR_MISMATCH
    http: 422
    condition: "the referenced technician is factory-employed or belongs to a different distributor than the one the operation addresses"
  - id: ERR_PAYMENT_MODULE_NOT_SUPPORTED
    http: 422
    condition: "the requested payment_module is not in the quoted model's payment_module_options"
  # ---- business temporal ----
  - id: ERR_INTERVAL_INVALID
    http: 400
    condition: "started_at is not strictly before completed_at, or effective_from is after effective_to"
  - id: ERR_STATION_CAPACITY_CONFLICT
    http: 409
    condition: "the new occupation window (work interval plus changeover buffer, closed at both ends) collides with parallel_capacity existing windows at the same station"
  - id: ERR_TECHNICIAN_DOUBLE_BOOKED
    http: 409
    condition: "the acting technician already has a station log whose half-open work interval overlaps the new one"
  - id: ERR_PROGRAM_WINDOW_CONFLICT
    http: 409
    condition: "the new rebate window is not separated by at least one full clear day from an existing non-RETIRED window of the same utility_code and program_class"
  # ---- business constraint ----
  - id: ERR_DUPLICATE_RESOURCE_CODE
    http: 409
    condition: "the submitted natural key (model_code, program_code, part_number, station_code, employee_code, distributor_code, serial_number) already exists"
  - id: ERR_CAPACITY_RATING_OUT_OF_BAND
    http: 422
    condition: "capacity_rating_lb lies outside the band its product_line allows"
  - id: ERR_DOSSIER_ALREADY_OPEN
    http: 409
    condition: "the model already has a dossier in IN_REVIEW, CERTIFIED or RESURVEY_REQUIRED"
  - id: ERR_TERRITORY_EXCLUSIVITY_CONFLICT
    http: 409
    condition: "an exclusive territory assignment collides with an existing non-TERMINATED distributor in that territory_code, in either direction"
  - id: ERR_TRAINING_RECORD_DUPLICATE
    http: 409
    condition: "the same technician has already been recorded for the same training_module at this distributor"
  - id: ERR_QUOTE_HAS_NO_LINES
    http: 422
    condition: "a quote with line_count == 0 is submitted"
  # ---- business fiscal ----
  - id: ERR_DISTRIBUTOR_NOT_AUTHORIZED
    http: 409
    condition: "quote submission by a distributor that is not AUTHORIZED, or a certification grant for a technician whose employing distributor is neither AUTHORIZED nor on PROBATION"
  - id: ERR_CLAIM_NOT_COVERABLE
    http: 422
    condition: "in_service_months exceeds the part's warranty_months, or failure_cycle_count exceeds the computed effective_rated_cycles"
  - id: ERR_INSUFFICIENT_PART_STOCK
    http: 409
    condition: "a claim approval is attempted while the part's on_hand_qty is 0"
  - id: ERR_STOCK_ADJUSTMENT_NEGATIVE
    http: 422
    condition: "a stock adjustment would drive on_hand_qty below 0"

roles:
  - name: ProductEngineer
    description: "Owns the product catalog: machine models, service parts and model lifecycle release/suspension."
    identity: opaque
    exclusive_operations:
      - "POST /clm/machine-models"
      - "POST /clm/machine-models/{id}/lifecycle-actions"
      - "POST /clm/service-parts"
    shared_operations:
      - "GET /clm/machine-models/{id}/warranty-analysis (with WarrantyAnalyst)"
      - "every catalog, build and dossier read"
      - "POST /_clock/set_current_utc"
  - name: ComplianceOfficer
    description: "Prepares and reviews efficiency and water-consumption certification dossiers and maintains utility rebate programs. Segregation of duties applies: the officer who prepared a dossier cannot review it, and one officer cannot clear both review dimensions."
    identity: opaque
    exclusive_operations:
      - "POST /clm/rebate-programs"
      - "POST /clm/machine-models/{id}/certification-dossiers"
      - "POST /clm/certification-dossiers/{id}/reviews"
      - "POST /clm/certification-dossiers/{id}/resurvey-submissions"
    shared_operations:
      - "dossier, program, model, build and station-log reads"
      - "POST /_clock/set_current_utc"
  - name: PlantManager
    description: "Runs the factory floor: assembly stations, build orders, floor releases and service-part stock movements."
    identity: opaque
    exclusive_operations:
      - "POST /clm/assembly-stations"
      - "POST /clm/build-orders"
      - "POST /clm/build-orders/{id}/release-to-floor"
      - "POST /clm/service-parts/{id}/stock-adjustments"
    shared_operations:
      - "build, station, station-log, part and technician reads"
      - "POST /_clock/set_current_utc"
  - name: TrainingAdministrator
    description: "Owns technician records, certification grants/renewals/revocations and distributor installation-training completions."
    identity: opaque
    exclusive_operations:
      - "POST /clm/technicians"
      - "POST /clm/technicians/{id}/certification-actions"
      - "POST /clm/distributors/{id}/training-completions"
    shared_operations:
      - "technician and distributor reads"
      - "POST /_clock/set_current_utc"
  - name: ChannelManager
    description: "Owns the distributor network and the channel side of quoting: territory assignment, probation/termination, and quote decisions including credit verification."
    identity: opaque
    exclusive_operations:
      - "POST /clm/distributors"
      - "POST /clm/distributors/{id}/status-actions"
      - "POST /clm/quotes/{id}/decision"
    shared_operations:
      - "quote, quote-line, claim, distributor, model and program reads (with Distributor, scoped)"
      - "POST /_clock/set_current_utc"
  - name: WarrantyAnalyst
    description: "Adjudicates and voids warranty claims and reads the per-model warranty analysis."
    identity: opaque
    exclusive_operations:
      - "POST /clm/warranty-claims/{id}/adjudicate"
      - "POST /clm/warranty-claims/{id}/void"
    shared_operations:
      - "GET /clm/machine-models/{id}/warranty-analysis (with ProductEngineer)"
      - "claim, part, build, station-log, technician and distributor reads"
      - "POST /_clock/set_current_utc"
  - name: Technician
    description: "Factory or distributor technician acting on the floor. X-User-ID is the Technician row id, which becomes StationLog.technician_id; certification scope and expiry gate every station log."
    identity: "entity_backed:Technician"
    exclusive_operations:
      - "POST /clm/build-orders/{id}/station-logs"
    shared_operations:
      - "build, station, station-log, part and model reads"
  - name: QualityInspector
    description: "A Technician holding the QA_SIGNOFF cert scope, acting in the final-inspection capacity. X-User-ID is the same Technician row id, which is exactly what makes the segregation-of-duties check meaningful: the inspector must not appear on any StationLog of the unit being signed off."
    identity: "entity_backed:Technician"
    exclusive_operations:
      - "POST /clm/build-orders/{id}/qa-signoff"
    shared_operations:
      - "build, station, station-log and model reads"
  - name: Distributor
    description: "Equipment distributor. X-User-ID is the Distributor row id; quotes and warranty claims are owned resources and a distributor may only read and act on its own."
    identity: "entity_backed:Distributor"
    exclusive_operations:
      - "POST /clm/quotes"
      - "POST /clm/quotes/{id}/lines"
      - "DELETE /clm/quotes/{id}/lines/{line_id}"
      - "POST /clm/quotes/{id}/submit"
      - "POST /clm/warranty-claims"
    shared_operations:
      - "own quote, own quote-line and own claim reads (with ChannelManager)"
      - "model, part, technician and distributor reads"
