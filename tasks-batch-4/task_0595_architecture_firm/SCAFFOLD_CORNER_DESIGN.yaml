            - "the bob execute returns HTTP 200 with ChangeOrder.${co}.status == EXECUTED and executed_by_user_id == \"principal-bob\""
            - "Contract.${ct}.total_fee_cents == 11000000"

      - name: consultant_rep_cannot_render_the_review_decision
