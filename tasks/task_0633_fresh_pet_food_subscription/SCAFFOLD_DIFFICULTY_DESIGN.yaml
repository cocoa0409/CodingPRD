            - call: "POST /api/pets"
              payload: { account_id: "${acc}", name: "Bo", species: "DOG", sex: "MALE", birth_date: "2022-01-01", initial_weight_kg: 20.0, ideal_weight_kg: 20.0, activity_level: "MODERATE", neutered: true, body_condition_goal: "MAINTAIN" }
              as: PetParent
              as_user_id: "${acc}"
              captures: { pet: $.data.id }
            - call: "POST /api/weight-logs"
              payload: { pet_id: "${pet}", weight_kg: 20.0, effective_date: "2026-01-05T00:00:00Z" }
              as: PetParent
              as_user_id: "${acc}"
              captures: { wl1: $.data.id }
          trigger:
            - call: "POST /api/weight-logs"
              payload: { pet_id: "${pet}", weight_kg: 24.0, effective_date: "2026-01-10T00:00:00Z" }
              as: PetParent
              as_user_id: "${acc}"
              captures: { wl2: $.data.id }
          assert:
            - "WeightLog.${wl2}.status == APPLIED and WeightLog.${wl1}.status == SUPERSEDED"
            - "Pet.${pet}.current_weight_kg == 24.0"
            - "Pet.${pet}.daily_calorie_target == 911"   # round(70*24^.75 *1.0*1.2*1.0*1.0)

      - name: shipment_transit_window_overlap_spoilage
        grounds:
          - state_machines.Shipment.DISPATCHED_to_DELIVERED
          - state_machines.Shipment.DISPATCHED_to_SPOILED
          - entities.Shipment.fields.dispatched_at
          - entities.Shipment.fields.transit_days
        distinguishing_aspect: |
          On the Shipment resource the interval semantics are a forward buffer of transit_days from
          dispatched_at: deliver with elapsed_days <= transit_days lands DELIVERED, but deliver where
          elapsed_days > transit_days overruns the buffer and lands SPOILED — a half-open transit
          window on a different resource entity than the WeightLog point-precedence.
        test_recipe:
          setup:
            - "Order PAID, Shipment DISPATCHED at 2026-01-01 with transit_days 2; clock advanced to 2026-01-05 (4 days > 2)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /api/accounts/register"
              payload: { email: "to-2@x.com", full_name: "TO2", country_code: "US" }
              as: Anonymous
              captures: { acc: $.data.id }
            - call: "POST /api/pets"
              payload: { account_id: "${acc}", name: "Bo", species: "DOG", sex: "MALE", birth_date: "2022-01-01", initial_weight_kg: 20.0, ideal_weight_kg: 20.0, activity_level: "MODERATE", neutered: true, body_condition_goal: "MAINTAIN" }
              as: PetParent
              as_user_id: "${acc}"
              captures: { pet: $.data.id }
            - call: "POST /api/recipes"
              payload: { name: "Turkey", species: "DOG", kcal_per_gram: 2.0, price_per_100g_cents: 80, availability_regions: ["US"], vet_formulated: true }
              as: NutritionVet
              captures: { rec: $.data.id }
            - call: "POST /api/recipes/${rec}/publish"
              payload: {}
              as: NutritionVet
            - call: "POST /api/subscriptions"
              payload: { account_id: "${acc}", pet_id: "${pet}", recipe_id: "${rec}", cadence_days: 28 }
              as: PetParent
              as_user_id: "${acc}"
              captures: { sub: $.data.id }
            - call: "POST /api/subscriptions/${sub}/activate"
              payload: {}
              as: PetParent
              as_user_id: "${acc}"
              captures: { v0: $.data.version }
            - call: "POST /api/subscriptions/${sub}/orders"
              payload: { expected_subscription_version: "${v0}" }
              as: BillingAdmin
              captures: { o1: $.data.id }
            - call: "POST /api/orders/${o1}/charge"
              payload: {}
              as: BillingAdmin
            - call: "POST /api/orders/${o1}/settle-charge"
              payload: { outcome: "SUCCEEDED" }
              as: BillingAdmin
            - call: "GET /api/shipments"
              payload: { order_id: "${o1}" }
              as: FulfillmentOps
              captures: { ship: "$.data[0].id" }
            - call: "POST /api/shipments/${ship}/dispatch"
              payload: {}
              as: FulfillmentOps
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: FulfillmentOps
          trigger:
            - call: "POST /api/shipments/${ship}/deliver"
              payload: {}
              as: FulfillmentOps
              captures: { st: $.data.status }
          assert:
            - "Shipment.${ship}.status == SPOILED (elapsed 4 days > transit_days 2)"
            - "a MAKE_GOOD ReferralCredit GRANTED row exists for account ${acc}"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: order_charge_settlement_conserves_gross
        grounds:
          - calculations.order_charge_settlement
          - entities.Order.fields.credit_applied_cents
          - entities.Order.fields.total_charged_cents
          - entities.Order.fields.food_subtotal_cents
          - entities.Order.fields.shipping_cents
        distinguishing_aspect: |
          Conserved quantity = gross (food_subtotal_cents + shipping_cents): for every charged order,
          total_charged_cents + credit_applied_cents == food_subtotal_cents + shipping_cents exactly.
          Cash collected plus wallet credit consumed always reconstitutes the gross.
        test_recipe:
          setup:
            - "Referred account F (wallet 2000 from a granted referral on order #1) with a second order to charge"
            - "MAIN pet, recipe P80 cad14 -> subtotal 4224, ship 999, gross 5223"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
