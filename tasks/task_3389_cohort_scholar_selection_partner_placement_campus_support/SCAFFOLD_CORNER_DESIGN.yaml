        grounds: [complexity_profile]
        distinguishing_aspect: "Consistency model is immediate: a created NominatingPartner is visible in the parent's sub-resource list within the same test step, with every stored field readable and nominations_used already computed at 0."
        test_recipe:
          setup: ["City program exists"]
          setup_api_calls:
            - { call: "POST /api/city-programs", payload: { code: "ATL", name: "Atlanta", admissions_cycle: "2027", nomination_window_opens_at: "2026-09-01T00:00:00Z", nomination_window_closes_at: "2026-11-30T23:59:59Z" }, as: ProgramAdmin, captures: { cp: $.data.id } }
