  # =================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: luxury_tax_zero_at_cap_two_at_cap_plus_one
        grounds:
          - calculations.luxury_tax
          - endpoints["GET /teams/{id}/payroll"]
        distinguishing_aspect: |
          Numeric threshold crossing on the luxury_tax metric via GET payroll:
          payroll exactly == cap (50000000) yields luxury_tax_cents == 0; payroll
          == cap+1 (50000001) yields luxury_tax_cents == 2 (round_half_up(1*1.5)).
        test_recipe:
          setup:
            - "Season salary_cap_cents=50000000; team T with one STANDARD contract base_salary_cents=50000001."
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "S", salary_cap_cents: 50000000 }
              as: LeagueCommissioner
              captures: { season_id: $.data.id }
            - call: "POST /teams"
              payload: { season_id: "${season_id}", name: "T", market_size_weight: 1 }
              as: LeagueCommissioner
              captures: { t_id: $.data.id }
            - call: "POST /players"
              payload: { season_id: "${season_id}", handle: "p" }
              as: LeagueCommissioner
              captures: { p_id: $.data.id }
            - call: "POST /contracts"
              payload: { team_id: "${t_id}", player_id: "${p_id}", base_salary_cents: 50000001, contract_type: "STANDARD", term_start: "2026-01-01T00:00:00.000Z", term_end: "2026-12-31T00:00:00.000Z" }
              as: TeamGM
              as_user_id: "${t_id}"
          trigger:
            - call: "GET /teams/${t_id}/payroll"
              as: TeamGM
              as_user_id: "${t_id}"
          assert:
            - "response.data.payroll_active_cents == 50000001"
            - "response.data.luxury_tax_cents == 2"
      - name: penalty_threshold_ge_flips_posture_at_exactly_threshold
        grounds:
          - validations[priority=13]
          - state_machines.Team.transitions.OPEN_to_RESTRICTED
          - entities.Season.fields.penalty_threshold
        distinguishing_aspect: |
          Different metric (cumulative penalty_points) on a different endpoint
          (POST /fines): with penalty_threshold=3, accumulating exactly 3 points
          flips posture to RESTRICTED (>= is inclusive at the boundary), whereas
          2 points leaves it OPEN.
        test_recipe:
          setup:
            - "Season penalty_threshold=3; team T OPEN; player P signed; one ASSESSED fine of 2 points (still OPEN)."
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "S", salary_cap_cents: 50000000, penalty_threshold: 3 }
              as: LeagueCommissioner
              captures: { season_id: $.data.id }
            - call: "POST /teams"
              payload: { season_id: "${season_id}", name: "T", market_size_weight: 1 }
              as: LeagueCommissioner
              captures: { t_id: $.data.id }
            - call: "POST /players"
              payload: { season_id: "${season_id}", handle: "p" }
              as: LeagueCommissioner
              captures: { p_id: $.data.id }
            - call: "POST /contracts"
              payload: { team_id: "${t_id}", player_id: "${p_id}", base_salary_cents: 5000000, contract_type: "STANDARD", term_start: "2026-01-01T00:00:00.000Z", term_end: "2026-12-31T00:00:00.000Z" }
              as: TeamGM
              as_user_id: "${t_id}"
            - call: "POST /fines"
              payload: { team_id: "${t_id}", player_id: "${p_id}", amount_cents: 100000, penalty_points: 2 }
              as: LeagueCommissioner
            - call: "GET /teams/${t_id}"
              as: LeagueCommissioner
              captures: { posture_at_2: $.data.posture }
          trigger:
            - call: "POST /fines"
              payload: { team_id: "${t_id}", player_id: "${p_id}", amount_cents: 100000, penalty_points: 1 }
              as: LeagueCommissioner
            - call: "GET /teams/${t_id}"
              as: LeagueCommissioner
              captures: { posture_at_3: $.data.posture }
          assert:
            - "at 2 points Team.${t_id}.posture == OPEN"
            - "at 3 points Team.${t_id}.posture == RESTRICTED"
            - "Team.${t_id}.penalty_points == 3"

