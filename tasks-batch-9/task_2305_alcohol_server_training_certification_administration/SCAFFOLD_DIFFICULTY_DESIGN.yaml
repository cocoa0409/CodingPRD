      - name: enrollment_retake_cycle_reenters_exam_in_progress_and_voided_attempt_costs_no_retake
        grounds:
          - state_machines.Enrollment.EXAM_IN_PROGRESS_to_EXAM_FAILED
          - state_machines.Enrollment.EXAM_FAILED_to_EXAM_IN_PROGRESS
          - state_machines.Enrollment.EXAM_IN_PROGRESS_to_EXAM_SCHEDULED
          - calculations.retake_gate_evaluation
          - entities.ExamAttempt.fields.attempt_number
        distinguishing_aspect: |
          The enrollment re-enters EXAM_IN_PROGRESS three times from two different
          predecessor states (EXAM_SCHEDULED then EXAM_FAILED then EXAM_SCHEDULED again
          after a void), and the voided middle attempt leaves attempt_count at 1 and
          reuses attempt_number 2 — so the cycle counter advances on outcome, not on row
          count.
