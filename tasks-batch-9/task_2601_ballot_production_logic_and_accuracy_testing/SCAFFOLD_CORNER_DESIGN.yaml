              payload: { reported_marks: [], reported_blank_count: 1, reported_overvote_count: 0 }
              as: VotingSystemTechnician
              as_user_id: "user-tech-2"
              captures: { s1_final: $.data.status, s1_disc: $.data.discrepancy_count }
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-09-01T20:00:00Z" }
              as: ElectionsDirector
            - call: "POST /la-test-sessions/${sess2}/start"
              payload: {}
              as: VotingSystemTechnician
              as_user_id: "user-tech-2"
              captures: { s2_status: $.data.status, s2_obs: $.data.observer_count }
            - call: "GET /tabulator-units/${tab}"
              payload: {}
              as: VotingSystemTechnician
              captures: { prog: $.data.program_status, sessions: $.data.la_session_count }
          assert:
            - "Call 2: HTTP 409 with ${err1} == \"ERR_INSUFFICIENT_OBSERVERS\" - observer_count 1 < MIN_PUBLIC_OBSERVERS 2; the session is still SCHEDULED, started_at null and DECK-A still DRAFT."
            - "Call 3: ${oc1} == 2, recomputed as the length of observer_names [\"Obs One\", \"Obs Two\"]."
            - "Call 4: HTTP 200 with ${s1_status} == \"IN_PROGRESS\", ${s1_started} == \"2026-09-01T14:00:00Z\", conducted_by_user_id \"user-tech-2\" and DECK-A now SEALED."
            - "Call 5: ${s1_final} == \"PASSED\" with ${s1_disc} == 0."
            - "Call 7: HTTP 200 with ${s2_status} == \"IN_PROGRESS\" while ${s2_obs} == 1 - the identical observer count that blocked the public session admits the audit session, because MIN_AUDIT_OBSERVERS is 1."
            - "${prog} == \"LA_PASSED\" and ${sessions} == 2: both sessions belong to the same unit, whose buffered windows [13:30, 18:30] and [19:30, 22:30] do not touch, which is why the second session could be scheduled at all."

      - name: val_session_state_beats_test_window_covered_by_difficulty_design
        claim_type: priority_conflict
        grounds:
          - validations.la-session-state-permits-operation
          - validations.session-started-inside-window
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / pp_session_state_beats_window_temporal"
          rationale: "The §1.8 instance already violates the state gate (priority 70) and the admission-window gate (priority 100) with one start call on an already IN_PROGRESS session after scheduled_end and asserts ERR_SESSION_STATE_INVALID, then isolates each rule on its own."
        distinguishing_aspect: "Both rules fire on POST /la-test-sessions/{id}/start and the state gate must answer first."

      - name: val_segregation_beats_observer_minimum_covered_by_difficulty_design
        claim_type: priority_conflict
        grounds:
          - validations.la-session-start-separation-of-duties
          - validations.observer-minimum-met
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / pp_segregation_beats_observer_constraint"
          rationale: "The §1.8 instance already starts a short-of-observers session as the very technician who programmed the unit and asserts ERR_SEGREGATION_OF_DUTIES (priority 80) rather than ERR_INSUFFICIENT_OBSERVERS (priority 110), then separates the two."
        distinguishing_aspect: "A self-conducted test that is also short of observers reports the duties breach, not the quorum breach."

      - name: val_lot_referential_beats_issue_quantity_covered_by_difficulty_design
        claim_type: priority_conflict
        grounds:
          - validations.lot-matches-precinct-style
          - validations.issue-quantity-within-receipt
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / pp_lot_referential_beats_fiscal_quantity"
          rationale: "The §1.8 instance already issues a wrong-style lot in an over-large quantity and asserts ERR_LOT_NOT_FOR_PRECINCT (priority 90) ahead of ERR_ISSUE_QUANTITY_EXCEEDS_RECEIPT (priority 120), then triggers each in isolation."
        distinguishing_aspect: "Referential legality of the pairing outranks the fiscal size of the movement."

      - name: val_press_capacity_is_an_aggregate_covered_by_difficulty_design
        claim_type: aggregate_validation
        grounds:
          - validations.press-window-capacity-available
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / rt_press_line_capacity_half_open_adjacency"
          rationale: "The §1.8 instance already fills both press lines with individually legal jobs, rejects the third overlapping job with ERR_PRESS_CAPACITY_EXCEEDED, and admits a job that starts exactly when another ends to pin the half-open interval."
        distinguishing_aspect: "Each overlap is legal on its own; only the count of concurrent jobs breaches the limit."

      - name: val_unit_window_exclusivity_covered_by_difficulty_design
        claim_type: temporal_validation
        grounds:
          - validations.unit-test-window-exclusive
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / rt_unit_test_window_buffered_closed_touch_conflict"
          rationale: "The §1.8 instance already schedules two sessions whose buffered windows touch at exactly one instant and asserts ERR_UNIT_TEST_WINDOW_CONFLICT, then moves one minute clear to admit the second."
        distinguishing_aspect: "The conflict window is the session window widened by SETUP_BUFFER_MINUTES on both sides and closed at both ends."

      - name: val_public_notice_lead_boundary_covered_by_difficulty_design
        claim_type: temporal_validation
        grounds:
          - validations.public-notice-lead-sufficient
        excluded_because:
          difficulty_instance: "boundary_precision_check / bp_public_notice_lead_exactly_48_hours"
          rationale: "The §1.8 instance already sits notice_lead_minutes at exactly la_notice_hours * 60 (2880) to admit the start and one minute below it to raise ERR_PUBLIC_NOTICE_TOO_LATE."
        distinguishing_aspect: "The comparison is strictly-less-than on whole minutes, so the exact boundary is admissible."

  - section: endpoints
    instances:
      - name: ep_deliver_manifest_creates_one_lot_per_line_in_lot_code_order
        claim_type: bulk_action
        grounds:
          - endpoints.POST /print-jobs/{id}/deliver
          - entities.BallotLot
          - calculations.print_job_invoice_total.variants
        distinguishing_aspect: "One call fans out into three BallotLot rows, and the manifest order is deliberately not the lot_code order: the created rows still list in lot_code ASC and the FINAL invoice still accumulates in lot_code ASC, so neither the listing nor the money depends on the order the vendor typed. The split chosen here divides evenly by 1000, so the round-then-sum subtotal equals the ESTIMATE subtotal and the only delta is a defect credit that lands exactly on a half cent."
        test_recipe:
          setup:
            - "A print job for 12500 ballots at 8450 cents per thousand, inspected once at 500/6 (cumulative defect_rate_bp 120) and therefore QC_PASSED, with committed_print_cents standing at the ESTIMATE total 150625."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: ElectionsDirector
