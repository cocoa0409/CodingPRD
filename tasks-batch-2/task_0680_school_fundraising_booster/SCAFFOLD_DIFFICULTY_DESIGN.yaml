# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# School Fundraising & Booster Programs — Expert
# 9 rule_ids x 2 instances = 18 instances
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      # --- #1: Campaign domain — forecast_gross vs final gross_collected ---
      - name: campaign_forecast_vs_final_gross_diverge
        grounds:
          - calculations.campaign_gross
          - calculations.campaign_gross.variants.provisional_forecast
          - entities.Campaign.fields.gross_collected_cents
          - entities.Campaign.fields.forecast_gross_cents
        distinguishing_aspect: |
          On the CAMPAIGN entity, forecast_gross_cents (adds PENDING orders +
          RECORDED pledges) strictly exceeds final gross_collected_cents (PAID +
          COLLECTED only) when one order is PENDING and one pledge is RECORDED.
        test_recipe:
          setup:
            - "ACTIVE CATALOG campaign with 1 seller, 1 product (price 2000, cost 800, stock 100), 1 prize tier."
            - "Order O1 PAID (5 units, total 10825). Order O2 PENDING (1 unit). Pledge P1 RECORDED (pledged 3000, not collected)."
          setup_api_calls:
            - call: "POST /fundraising/campaigns"
              payload: { name: "Spring Catalog", campaign_type: "CATALOG", goal_cents: 500000, profit_split_pct: 0.60, vendor_name: "Acme", starts_at: "2026-04-01T00:00:00Z", ends_at: "2026-05-01T00:00:00Z" }
              as: CampaignAdmin
              captures: { camp_id: $.data.id }
            - call: "POST /fundraising/prize-tiers"
              payload: { campaign_id: "${camp_id}", label: "SILVER", threshold_cents: 10000, prize_description: "Silver pin" }
              as: CampaignAdmin
            - call: "POST /fundraising/sellers"
              payload: { campaign_id: "${camp_id}", display_name: "Ava", guardian_email: "g@x.com" }
              as: CampaignAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /fundraising/products"
              payload: { campaign_id: "${camp_id}", sku: "WRAP", name: "Gift Wrap", unit_price_cents: 2000, unit_cost_cents: 800, stock_qty: 100 }
              as: CampaignAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /fundraising/campaigns/${camp_id}/activate"
              payload: {}
              as: CampaignAdmin
            - call: "POST /fundraising/orders"
              payload: { campaign_id: "${camp_id}", seller_id: "${seller_id}", buyer_name: "Bob", buyer_email: "b@x.com", lines: [ { product_id: "${prod_id}", quantity: 5 } ] }
              as: CampaignAdmin
              captures: { o1_id: $.data.id }
            - call: "POST /fundraising/orders/${o1_id}/pay"
              payload: {}
              as: CampaignAdmin
            - call: "POST /fundraising/orders"
              payload: { campaign_id: "${camp_id}", seller_id: "${seller_id}", buyer_name: "Cy", buyer_email: "c@x.com", lines: [ { product_id: "${prod_id}", quantity: 1 } ] }
              as: CampaignAdmin
              captures: { o2_id: $.data.id }
            - call: "POST /fundraising/pledges"
              payload: { campaign_id: "${camp_id}", seller_id: "${seller_id}", donor_name: "Deb", donor_email: "d@x.com", per_unit_cents: 0, flat_cents: 3000 }
              as: CampaignAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /fundraising/pledges/${p1_id}/record"
              payload: { units_recorded: 0 }
              as: CampaignAdmin
          trigger:
            - call: "GET /fundraising/campaigns/${camp_id}"
              payload: {}
              as: Treasurer
              captures: { gc: $.data.gross_collected_cents, fg: $.data.forecast_gross_cents }
          assert:
            - "Campaign.${camp_id}.gross_collected_cents == 10825"
            - "Campaign.${camp_id}.forecast_gross_cents == 13825"

      # --- #2: Seller domain — credited (final) vs forecast_credited ---
      - name: seller_credited_vs_forecast_diverge
        grounds:
          - calculations.seller_credited
          - calculations.seller_credited.variants.forecast_credited
          - entities.Seller.fields.credited_cents
          - endpoints./fundraising/sellers/{seller_id}/credit-forecast
        distinguishing_aspect: |
          On the SELLER entity (different domain from campaign_gross), final
          credited_cents counts only PAID orders + COLLECTED pledges, while the
          credit-forecast read adds PENDING orders + RECORDED pledges, so the
          two figures diverge for the same seller.
        test_recipe:
          setup:
            - "ACTIVE CATALOG campaign, 1 seller, 1 product (price 2000/cost 800/stock 100), 1 prize tier."
            - "Seller has: PAID order O1 (total 10825), PENDING order O2 (1299*3 + 750*2 = 5397 gross, tax 445, total 5842), RECORDED pledge P1 (pledged 3000), COLLECTED pledge P2 (collected 5000)."
          setup_api_calls:
            - call: "POST /fundraising/campaigns"
              payload: { name: "Spring", campaign_type: "CATALOG", goal_cents: 500000, profit_split_pct: 0.60, vendor_name: "Acme", starts_at: "2026-04-01T00:00:00Z", ends_at: "2026-05-01T00:00:00Z" }
              as: CampaignAdmin
              captures: { camp_id: $.data.id }
            - call: "POST /fundraising/prize-tiers"
              payload: { campaign_id: "${camp_id}", label: "SILVER", threshold_cents: 10000, prize_description: "pin" }
              as: CampaignAdmin
            - call: "POST /fundraising/sellers"
              payload: { campaign_id: "${camp_id}", display_name: "Ava", guardian_email: "g@x.com" }
              as: CampaignAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /fundraising/products"
              payload: { campaign_id: "${camp_id}", sku: "WRAP", name: "Wrap", unit_price_cents: 2000, unit_cost_cents: 800, stock_qty: 100 }
              as: CampaignAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /fundraising/products"
              payload: { campaign_id: "${camp_id}", sku: "MUG", name: "Mug", unit_price_cents: 1299, unit_cost_cents: 500, stock_qty: 100 }
              as: CampaignAdmin
              captures: { prod2_id: $.data.id }
            - call: "POST /fundraising/products"
              payload: { campaign_id: "${camp_id}", sku: "PEN", name: "Pen", unit_price_cents: 750, unit_cost_cents: 200, stock_qty: 100 }
              as: CampaignAdmin
              captures: { prod3_id: $.data.id }
            - call: "POST /fundraising/campaigns/${camp_id}/activate"
              payload: {}
              as: CampaignAdmin
            - call: "POST /fundraising/orders"
              payload: { campaign_id: "${camp_id}", seller_id: "${seller_id}", buyer_name: "B", buyer_email: "b@x.com", lines: [ { product_id: "${prod_id}", quantity: 5 } ] }
              as: CampaignAdmin
              captures: { o1_id: $.data.id }
            - call: "POST /fundraising/orders/${o1_id}/pay"
              payload: {}
              as: CampaignAdmin
            - call: "POST /fundraising/orders"
              payload: { campaign_id: "${camp_id}", seller_id: "${seller_id}", buyer_name: "C", buyer_email: "c@x.com", lines: [ { product_id: "${prod2_id}", quantity: 3 }, { product_id: "${prod3_id}", quantity: 2 } ] }
              as: CampaignAdmin
              captures: { o2_id: $.data.id }
            - call: "POST /fundraising/pledges"
              payload: { campaign_id: "${camp_id}", seller_id: "${seller_id}", donor_name: "D", donor_email: "d@x.com", per_unit_cents: 0, flat_cents: 3000 }
              as: CampaignAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /fundraising/pledges/${p1_id}/record"
              payload: { units_recorded: 0 }
              as: CampaignAdmin
            - call: "POST /fundraising/pledges"
              payload: { campaign_id: "${camp_id}", seller_id: "${seller_id}", donor_name: "E", donor_email: "e@x.com", per_unit_cents: 0, flat_cents: 5000 }
              as: CampaignAdmin
              captures: { p2_id: $.data.id }
            - call: "POST /fundraising/pledges/${p2_id}/record"
              payload: { units_recorded: 0 }
              as: CampaignAdmin
            - call: "POST /fundraising/pledges/${p2_id}/collect"
              payload: {}
              as: CampaignAdmin
          trigger:
            - call: "GET /fundraising/sellers/${seller_id}"
              payload: {}
              as: Treasurer
              captures: { final_credit: $.data.credited_cents }
            - call: "GET /fundraising/sellers/${seller_id}/credit-forecast"
              payload: {}
              as: Treasurer
              captures: { fc: $.data.credited_cents }
          assert:
            - "GET /fundraising/sellers/${seller_id} -> data.credited_cents == 15825"
            - "GET /fundraising/sellers/${seller_id}/credit-forecast -> data.credited_cents == 24667"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      # --- #1: mode (b) — nested rounding order pinned (SUM-THEN-ROUND) ---
      - name: order_tax_sum_then_round_not_round_then_sum
        grounds:
          - calculations.order_totals
          - entities.Order.fields.gross_cents
          - entities.Order.fields.tax_cents
          - entities.Order.fields.total_charged_cents
        distinguishing_aspect: |
          MODE (b): tax is rounded ONCE on the summed order gross. Lines
          (1299x3)+(750x2) give gross 5397; SUM-THEN-ROUND tax = round_half_up(
          5397*0.0825)=445, whereas ROUND-THEN-SUM would give 446 — the scaffold
          pins 445.
        test_recipe:
          setup:
            - "ACTIVE CATALOG campaign with 1 seller, 2 products (MUG price 1299, PEN price 750, ample stock), 1 prize tier."
          setup_api_calls:
            - call: "POST /fundraising/campaigns"
              payload: { name: "Round", campaign_type: "CATALOG", goal_cents: 100000, profit_split_pct: 0.50, vendor_name: "V", starts_at: "2026-04-01T00:00:00Z", ends_at: "2026-05-01T00:00:00Z" }
              as: CampaignAdmin
              captures: { camp_id: $.data.id }
            - call: "POST /fundraising/prize-tiers"
              payload: { campaign_id: "${camp_id}", label: "T1", threshold_cents: 5000, prize_description: "p" }
              as: CampaignAdmin
            - call: "POST /fundraising/sellers"
              payload: { campaign_id: "${camp_id}", display_name: "S", guardian_email: "g@x.com" }
              as: CampaignAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /fundraising/products"
              payload: { campaign_id: "${camp_id}", sku: "MUG", name: "Mug", unit_price_cents: 1299, unit_cost_cents: 500, stock_qty: 50 }
              as: CampaignAdmin
              captures: { mug_id: $.data.id }
            - call: "POST /fundraising/products"
              payload: { campaign_id: "${camp_id}", sku: "PEN", name: "Pen", unit_price_cents: 750, unit_cost_cents: 200, stock_qty: 50 }
              as: CampaignAdmin
              captures: { pen_id: $.data.id }
            - call: "POST /fundraising/campaigns/${camp_id}/activate"
              payload: {}
              as: CampaignAdmin
          trigger:
            - call: "POST /fundraising/orders"
              payload: { campaign_id: "${camp_id}", seller_id: "${seller_id}", buyer_name: "B", buyer_email: "b@x.com", lines: [ { product_id: "${mug_id}", quantity: 3 }, { product_id: "${pen_id}", quantity: 2 } ] }
              as: CampaignAdmin
              captures: { o_id: $.data.id }
          assert:
            - "Order.${o_id}.gross_cents == 5397"
            - "Order.${o_id}.tax_cents == 445"
            - "Order.${o_id}.total_charged_cents == 5842"

      # --- #2: mode (c) — circular-looking dependency, evaluation order pinned ---
      - name: profit_split_evaluation_order_pinned
        grounds:
          - calculations.profit_split_reconciliation
          - entities.Campaign.fields.school_profit_cents
          - entities.Campaign.fields.vendor_payable_cents
          - state_machines.Campaign.CLOSED_to_RECONCILED
        distinguishing_aspect: |
          MODE (c): split_base depends on gross net of vendor COGS, school_profit
          depends on split_base, vendor_payable depends on both COGS and the
          residual of split_base. With psp 0.60, product_revenue 10000, cogs
          4000, pledge_revenue 5000 => split_base 11000, school_profit 6600,
          vendor_payable 8400 — a single pinned evaluation order, not circular.
        test_recipe:
          setup:
            - "CLOSED campaign (psp 0.60). One PAID order (5 units @ price2000/cost800 => gross10000, tax825). One COLLECTED pledge (collected 5000)."
          setup_api_calls:
            - call: "POST /fundraising/campaigns"
              payload: { name: "Recon", campaign_type: "CATALOG", goal_cents: 100000, profit_split_pct: 0.60, vendor_name: "V", starts_at: "2026-04-01T00:00:00Z", ends_at: "2026-05-01T00:00:00Z" }
              as: CampaignAdmin
              captures: { camp_id: $.data.id }
            - call: "POST /fundraising/prize-tiers"
              payload: { campaign_id: "${camp_id}", label: "T1", threshold_cents: 5000, prize_description: "p" }
              as: CampaignAdmin
            - call: "POST /fundraising/sellers"
              payload: { campaign_id: "${camp_id}", display_name: "S", guardian_email: "g@x.com" }
              as: CampaignAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /fundraising/products"
              payload: { campaign_id: "${camp_id}", sku: "WRAP", name: "Wrap", unit_price_cents: 2000, unit_cost_cents: 800, stock_qty: 100 }
              as: CampaignAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /fundraising/campaigns/${camp_id}/activate"
              payload: {}
              as: CampaignAdmin
            - call: "POST /fundraising/orders"
              payload: { campaign_id: "${camp_id}", seller_id: "${seller_id}", buyer_name: "B", buyer_email: "b@x.com", lines: [ { product_id: "${prod_id}", quantity: 5 } ] }
              as: CampaignAdmin
              captures: { o_id: $.data.id }
            - call: "POST /fundraising/orders/${o_id}/pay"
              payload: {}
              as: CampaignAdmin
            - call: "POST /fundraising/pledges"
              payload: { campaign_id: "${camp_id}", seller_id: "${seller_id}", donor_name: "D", donor_email: "d@x.com", per_unit_cents: 0, flat_cents: 5000 }
              as: CampaignAdmin
              captures: { p_id: $.data.id }
            - call: "POST /fundraising/pledges/${p_id}/record"
              payload: { units_recorded: 0 }
              as: CampaignAdmin
            - call: "POST /fundraising/pledges/${p_id}/collect"
              payload: {}
              as: CampaignAdmin
            - call: "POST /fundraising/campaigns/${camp_id}/close"
              payload: {}
              as: CampaignAdmin
              captures: { ver: $.data.version }
          trigger:
            - call: "POST /fundraising/campaigns/${camp_id}/reconcile"
              payload: { expected_campaign_version: "${ver}" }
              as: Treasurer
              captures: { sp: $.data.school_profit_cents, vp: $.data.vendor_payable_cents }
          assert:
            - "Campaign.${camp_id}.school_profit_cents == 6600"
            - "Campaign.${camp_id}.vendor_payable_cents == 8400"
            - "Campaign.${camp_id}.posture == RECONCILED"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      # --- #1: Order parallel dimensions payment_status x fulfillment_status ---
      - name: order_parallel_payment_and_fulfillment_independent
        grounds:
          - state_machines.Order.PENDING_to_PAID
          - state_machines.Order.PLACED_to_CONFIRMED
          - entities.Order.fields.payment_status
          - entities.Order.fields.fulfillment_status
        distinguishing_aspect: |
          On ORDER, payment_status and fulfillment_status are two independent
          parallel dimensions: paying (PENDING->PAID) leaves fulfillment at
          PLACED; confirming (PLACED->CONFIRMED) leaves payment at PAID. The
          combined state evolves on two axes.
        test_recipe:
          setup:
            - "ACTIVE CATALOG campaign, 1 seller, 1 product (stock 100), 1 prize tier; one PLACED+PENDING order."
          setup_api_calls:
            - call: "POST /fundraising/campaigns"
              payload: { name: "Par", campaign_type: "CATALOG", goal_cents: 100000, profit_split_pct: 0.50, vendor_name: "V", starts_at: "2026-04-01T00:00:00Z", ends_at: "2026-05-01T00:00:00Z" }
              as: CampaignAdmin
              captures: { camp_id: $.data.id }
            - call: "POST /fundraising/prize-tiers"
              payload: { campaign_id: "${camp_id}", label: "T1", threshold_cents: 5000, prize_description: "p" }
              as: CampaignAdmin
            - call: "POST /fundraising/sellers"
              payload: { campaign_id: "${camp_id}", display_name: "S", guardian_email: "g@x.com" }
              as: CampaignAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /fundraising/products"
              payload: { campaign_id: "${camp_id}", sku: "WRAP", name: "Wrap", unit_price_cents: 2000, unit_cost_cents: 800, stock_qty: 100 }
              as: CampaignAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /fundraising/campaigns/${camp_id}/activate"
              payload: {}
              as: CampaignAdmin
            - call: "POST /fundraising/orders"
              payload: { campaign_id: "${camp_id}", seller_id: "${seller_id}", buyer_name: "B", buyer_email: "b@x.com", lines: [ { product_id: "${prod_id}", quantity: 5 } ] }
              as: CampaignAdmin
              captures: { o_id: $.data.id }
          trigger:
            - call: "POST /fundraising/orders/${o_id}/pay"
              payload: {}
              as: CampaignAdmin
            - call: "POST /fundraising/orders/${o_id}/confirm"
              payload: {}
              as: CampaignAdmin
              captures: { ps: $.data.payment_status, fs: $.data.fulfillment_status }
          assert:
            - "Order.${o_id}.payment_status == PAID"
            - "Order.${o_id}.fulfillment_status == CONFIRMED"

      # --- #2: Pledge cyclic revision loop RECORDED <-> PROMISED ---
      - name: pledge_record_revise_cycle
        grounds:
          - state_machines.Pledge.PROMISED_to_RECORDED
          - state_machines.Pledge.RECORDED_to_PROMISED
          - entities.Pledge.fields.status
          - entities.Pledge.fields.units_recorded
        distinguishing_aspect: |
          On PLEDGE (different entity from Order), the status cycles
          RECORDED -> PROMISED -> RECORDED: a revise resets units_recorded to 0
          and returns to PROMISED, then a second record sets units_recorded
          again. A pure linear pipeline cannot revisit PROMISED.
        test_recipe:
          setup:
            - "ACTIVE PLEDGE campaign, 1 seller, 1 prize tier; one PROMISED pledge (per_unit 250, flat 0)."
          setup_api_calls:
            - call: "POST /fundraising/campaigns"
              payload: { name: "Walk", campaign_type: "PLEDGE", goal_cents: 100000, profit_split_pct: 1.0, vendor_name: "Self", starts_at: "2026-04-01T00:00:00Z", ends_at: "2026-05-01T00:00:00Z" }
              as: CampaignAdmin
              captures: { camp_id: $.data.id }
            - call: "POST /fundraising/prize-tiers"
              payload: { campaign_id: "${camp_id}", label: "T1", threshold_cents: 1000, prize_description: "p" }
              as: CampaignAdmin
            - call: "POST /fundraising/sellers"
              payload: { campaign_id: "${camp_id}", display_name: "S", guardian_email: "g@x.com" }
              as: CampaignAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /fundraising/campaigns/${camp_id}/activate"
              payload: {}
              as: CampaignAdmin
            - call: "POST /fundraising/pledges"
              payload: { campaign_id: "${camp_id}", seller_id: "${seller_id}", donor_name: "D", donor_email: "d@x.com", per_unit_cents: 250, flat_cents: 0 }
              as: CampaignAdmin
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /fundraising/pledges/${p_id}/record"
              payload: { units_recorded: 30 }
              as: CampaignAdmin
            - call: "POST /fundraising/pledges/${p_id}/revise"
              payload: {}
              as: CampaignAdmin
              captures: { st_after_revise: $.data.status, u_after_revise: $.data.units_recorded }
            - call: "POST /fundraising/pledges/${p_id}/record"
              payload: { units_recorded: 12 }
              as: CampaignAdmin
              captures: { st2: $.data.status, u2: $.data.units_recorded, amt2: $.data.pledged_amount_cents }
          assert:
            - "after revise: Pledge.${p_id}.status == PROMISED AND units_recorded == 0"
            - "after second record: Pledge.${p_id}.status == RECORDED AND units_recorded == 12"
            - "Pledge.${p_id}.pledged_amount_cents == 3000"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      # --- #1: depth>=3 — campaign close -> order cancel -> reservation release -> product headroom ---
      - name: close_cascades_order_cancel_to_reservation_release
        grounds:
          - state_machines.Campaign.ACTIVE_to_CLOSED
          - state_machines.Order.PLACED_to_CANCELLED
          - calculations.product_reserved_qty
          - entities.Product.fields.reserved_qty
        distinguishing_aspect: |
          Depth-3 chain from CLOSE: campaign CLOSED (A) => the PENDING order's
          fulfillment_status PLACED->CANCELLED (B, caused by A) => that order
          cancellation releases its line reservation so product.reserved_qty
          drops from 5 to 0 (C, caused by B). Each link is caused by the prior.
        test_recipe:
          setup:
            - "ACTIVE CATALOG campaign, 1 seller, 1 product (stock 100), 1 prize tier; one PENDING+PLACED order reserving 5 units."
          setup_api_calls:
            - call: "POST /fundraising/campaigns"
              payload: { name: "Casc", campaign_type: "CATALOG", goal_cents: 100000, profit_split_pct: 0.50, vendor_name: "V", starts_at: "2026-04-01T00:00:00Z", ends_at: "2026-05-01T00:00:00Z" }
              as: CampaignAdmin
              captures: { camp_id: $.data.id }
            - call: "POST /fundraising/prize-tiers"
              payload: { campaign_id: "${camp_id}", label: "T1", threshold_cents: 5000, prize_description: "p" }
              as: CampaignAdmin
            - call: "POST /fundraising/sellers"
              payload: { campaign_id: "${camp_id}", display_name: "S", guardian_email: "g@x.com" }
              as: CampaignAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /fundraising/products"
              payload: { campaign_id: "${camp_id}", sku: "WRAP", name: "Wrap", unit_price_cents: 2000, unit_cost_cents: 800, stock_qty: 100 }
              as: CampaignAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /fundraising/campaigns/${camp_id}/activate"
              payload: {}
              as: CampaignAdmin
            - call: "POST /fundraising/orders"
              payload: { campaign_id: "${camp_id}", seller_id: "${seller_id}", buyer_name: "B", buyer_email: "b@x.com", lines: [ { product_id: "${prod_id}", quantity: 5 } ] }
              as: CampaignAdmin
              captures: { o_id: $.data.id }
          trigger:
            - call: "POST /fundraising/campaigns/${camp_id}/close"
              payload: {}
              as: CampaignAdmin
          assert:
            - "Order.${o_id}.fulfillment_status == CANCELLED"
            - "Campaign.${camp_id}.posture == CLOSED"
            - "GET /fundraising/products/${prod_id} -> data.reserved_qty == 0"

      # --- #2: depth>=2 — seller block -> pledge cancel (different trigger) ---
      - name: block_cascades_to_promised_pledge_cancel
        grounds:
          - state_machines.Seller.ACTIVE_to_BLOCKED
          - state_machines.Pledge.PROMISED_to_CANCELLED
          - entities.Pledge.fields.status
        distinguishing_aspect: |
          Depth-2 chain from a DIFFERENT trigger (seller block, not campaign
          close): blocking the seller (A) => every PROMISED pledge crediting
          that seller transitions PROMISED->CANCELLED (B, caused by A). Distinct
          propagation pattern from the close cascade above.
        test_recipe:
          setup:
            - "ACTIVE PLEDGE campaign, 1 ACTIVE seller, 1 prize tier; one PROMISED pledge for that seller."
          setup_api_calls:
            - call: "POST /fundraising/campaigns"
              payload: { name: "Block", campaign_type: "PLEDGE", goal_cents: 100000, profit_split_pct: 1.0, vendor_name: "Self", starts_at: "2026-04-01T00:00:00Z", ends_at: "2026-05-01T00:00:00Z" }
              as: CampaignAdmin
              captures: { camp_id: $.data.id }
            - call: "POST /fundraising/prize-tiers"
              payload: { campaign_id: "${camp_id}", label: "T1", threshold_cents: 1000, prize_description: "p" }
              as: CampaignAdmin
            - call: "POST /fundraising/sellers"
