      - name: parity_requires_both_the_hash_match_and_the_image_count_floor
        claim_type: threshold
        grounds:
          - calculations.content_parity_evaluation
          - endpoints[PATCH /distribution/channel-mappings/{id}/content]
        distinguishing_aspect: |
          Four successive content patches walk both halves of the AND: 5 images with the matching hash
          is IN_PARITY, 4 images is OUT_OF_PARITY, 6 images is IN_PARITY again because the count test
          is >= and not ==, and a stale hash with 6 images is still OUT_OF_PARITY - so neither
          condition alone decides the state.
        test_recipe:
          setup:
            - "Property HTL-SFO with required_image_count 5, room type KING with master_description_hash 'kingv1' and master_image_count 5."
            - "Channel OTA1 with a connection so a mapping may be created; mapping BAR x OTA1 x KING created with hash 'kingv1' and 5 images."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-25T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /distribution/properties"
              payload: { code: "HTL-SFO", name: "Harborview SFO", currency_code: "USD", overbooking_pct_bp: 1000, booking_horizon_days: 365, mix_window_days: 30, rate_mismatch_tolerance_cents: 200, required_image_count: 5 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /distribution/properties/${prop_id}/room-types"
              payload: { code: "KING", name: "King Room", physical_capacity_units: 10, master_description_hash: "kingv1", master_image_count: 5 }
              as: RevenueManager
              captures: { king_id: $.data.id }
            - call: "POST /distribution/properties/${prop_id}/channels"
              payload: { code: "OTA1", channel_kind: "OTA_PUBLIC", commission_bp: 1750 }
              as: PlatformAdmin
              captures: { ota1_id: $.data.id }
            - call: "POST /distribution/channels/${ota1_id}/connections"
              payload: { protocol: "JSON_PUSH", endpoint_url: "https://ota1.example.com/ari" }
              as: ChannelOpsEngineer
              captures: { conn_id: $.data.id }
            - call: "POST /distribution/properties/${prop_id}/rate-plans"
              payload: { code: "BAR", rate_class: "PUBLIC", base_amount_cents: 25000, floor_amount_cents: 18000, ceiling_amount_cents: 40000 }
              as: RevenueManager
              captures: { bar_id: $.data.id }
            - call: "POST /distribution/channel-mappings"
              payload: { rate_plan_id: "${bar_id}", channel_id: "${ota1_id}", room_type_id: "${king_id}", external_rate_code: "BAR-OTA1-KING", content_description_hash: "kingv1", content_image_count: 5 }
              as: ChannelOpsEngineer
              captures: { map_id: $.data.id }
          trigger:
            - call: "PATCH /distribution/channel-mappings/${map_id}/content"
              payload: { content_image_count: 4 }
              as: ChannelOpsEngineer
            - call: "PATCH /distribution/channel-mappings/${map_id}/content"
              payload: { content_image_count: 6 }
              as: ChannelOpsEngineer
            - call: "PATCH /distribution/channel-mappings/${map_id}/content"
              payload: { content_description_hash: "kingv2" }
              as: ChannelOpsEngineer
          assert:
            - "At creation: parity_state == IN_PARITY (hash 'kingv1' == master hash and 5 >= required 5) with version 1"
            - "After the 4-image patch: parity_state == OUT_OF_PARITY with version 2 - one image below the floor is enough"
            - "After the 6-image patch: parity_state == IN_PARITY with version 3 - the count test is >=, so being above required_image_count passes"
            - "After the hash patch to 'kingv2' (content_image_count untouched at 6): parity_state == OUT_OF_PARITY with version 4 - a plentiful image count cannot rescue a stale description hash"

