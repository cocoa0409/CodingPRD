            - "after OPS-RUN 1: Athlete.${ath_b_id}.registration_status == PENDING_PAYMENT (the ineligible candidate was skipped, not expired)"
            - "after B pays and is screened: Athlete.${ath_b_id}.registration_status == REGISTERED, Athlete.${ath_b_id}.fee_total_cents == 15500, Athlete.${ath_b_id}.medical_status == SCREENED_CLEARED"
            - "OPS-RUN 2 promotes exactly one entry: SportEntry.${en_b_id}.status == ACCEPTED, SportEvent.${ev_id}.accepted_entry_count == 2, SportEvent.${ev_id}.available_slots == 0, GamesEdition.${ed_id}.ops_epoch == 2"
            - "OPS-RUN 3 returns HTTP 200 and changes no entry: the event is skipped because available_slots == 0, SportEntry.${en_a_id}.status == ACCEPTED, SportEntry.${en_b_id}.status == ACCEPTED, SportEvent.${ev_id}.accepted_entry_count == 2"
            - "after OPS-RUN 3: GamesEdition.${ed_id}.ops_epoch == 3 and GamesEdition.${ed_id}.provisional_impact_cents == 600880 (2 registered heads, unchanged by the promotion)"
            - "GamesEdition.${ed_id}.status == REGISTRATION_OPEN after all three ops-runs, because the logical clock never reached 2026-08-25T23:59:59Z"

      - name: minimum_eligible_age_boundary_fifty_admitted_forty_nine_rejected
        grounds:
          - calculations.athlete_age_group_assignment
          - validations[priority=92]
          - entities.Athlete.fields.age_at_reference
          - entities.Athlete.fields.age_at_first_day
          - entities.Athlete.fields.age_group_code
          - errors[ERR_ATHLETE_UNDER_MINIMUM_AGE]
        distinguishing_aspect: |
          METRIC = AGE IN WHOLE YEARS AT MIN_ELIGIBLE_AGE, ENDPOINT = POST /athletes. On an edition
          with age_basis REFERENCE_DATE and age_reference_date 2026-12-31, a date_of_birth of
          1976-12-31 gives a basis age of exactly 50 and is ADMITTED into age_group_code "50-54",
          while 1977-01-01 - one calendar day later - gives 49 and is REJECTED with
          ERR_ATHLETE_UNDER_MINIMUM_AGE, so the >= comparison at MIN_ELIGIBLE_AGE is inclusive.
        test_recipe:
          setup:
            - "One GamesEdition in REGISTRATION_OPEN with age_basis REFERENCE_DATE, age_reference_date 2026-12-31, competition_start_date 2026-09-10 and registration_deadline_utc 2026-08-25T23:59:59Z."
            - "One LOW-contact TRACK sport with min_age 50 and one 50-54 MEN event T100M, so the edition can be opened for registration."
            - "The logical clock is at its 2026-08-01T00:00:00Z default, before the deadline, so no deadline rule competes."
            - "No athlete rows exist yet."
          setup_api_calls:
            - call: "POST /senior-games/games-editions"
              payload: { name: "Prairie Senior Games 2026", host_city: "Springfield", host_state_code: "IL", competition_start_date: "2026-09-10", competition_end_date: "2026-09-20", age_reference_date: "2026-12-31", registration_deadline_utc: "2026-08-25T23:59:59Z", age_basis: "REFERENCE_DATE" }
              as: GamesAdmin
              captures: { ed_id: $.data.id }
            - call: "POST /senior-games/sports"
              payload: { sport_code: "TRACK", name: "Track and Field", contact_class: "LOW", mark_direction: "LOWER_IS_BETTER", required_certification_level: 2, min_age: 50 }
              as: GamesAdmin
              captures: { sp_track_id: $.data.id }
            - call: "POST /senior-games/sport-events"
              payload: { sport_id: "${sp_track_id}", games_edition_id: "${ed_id}", event_code: "T100M", age_group_code: "50-54", gender_division: "MEN", entry_fee_cents: 6000, capacity: 8, min_entries_to_stage: 1 }
              as: GamesAdmin
              captures: { ev_id: $.data.id }
            - call: "POST /senior-games/games-editions/${ed_id}/open-registration"
              payload: {}
              as: GamesAdmin
          trigger:
            - call: "POST /senior-games/athletes"
              payload: { games_edition_id: "${ed_id}", full_name: "Tess Marlow", email: "tess.marlow@example.com", date_of_birth: "1976-12-31", residency_state_code: "IL" }
              as: RegistrationOfficer
              captures: { ath_ok_id: $.data.id }
            - call: "POST /senior-games/athletes"
              payload: { games_edition_id: "${ed_id}", full_name: "Uri Kessler", email: "uri.kessler@example.com", date_of_birth: "1977-01-01", residency_state_code: "IL" }
              as: RegistrationOfficer
          assert:
            - "AT THE BOUNDARY: the 1976-12-31 create returns HTTP 201 with Athlete.${ath_ok_id}.age_at_reference == 50, Athlete.${ath_ok_id}.age_at_first_day == 49 and Athlete.${ath_ok_id}.age_group_code == \"50-54\""
            - "Athlete.${ath_ok_id}.registration_status == PENDING_PAYMENT and Athlete.${ath_ok_id}.medical_status == NOT_SCREENED"
            - "ONE DAY BELOW: the 1977-01-01 create returns HTTP 422 with error_id == ERR_ATHLETE_UNDER_MINIMUM_AGE"
            - "no Athlete row with email \"uri.kessler@example.com\" exists after the rejected call"
            - "the admitted athlete's age_at_first_day of 49 does NOT trigger the rejection, proving the eligibility comparison reads the edition's age_basis (REFERENCE_DATE) and not the competition start date"


  # ===================================================================
  # RULE 7 - Cross-entity state dependencies over distinct entity pairs
  # ===================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: entry_acceptance_requires_athlete_registration_dimension
        grounds:
          - validations[priority=42]
          - state_machines.SportEntry.UNDER_REVIEW_to_ACCEPTED
          - state_machines.Athlete.PENDING_PAYMENT_to_REGISTERED
          - entities.Athlete.fields.registration_status
          - errors[ERR_ATHLETE_NOT_REGISTERED]
        distinguishing_aspect: |
          ENTITY PAIR = SportEntry depends on Athlete. The entry's own status is a perfectly legal
          UNDER_REVIEW and the event has 8 free slots, yet ACCEPT is refused with
          ERR_ATHLETE_NOT_REGISTERED (409) purely because the OTHER row's registration_status is
          PENDING_PAYMENT; paying the fee flips only the Athlete row and the identical ACCEPT then
          succeeds, proving the gate reads the parent athlete's state and nothing else.
        test_recipe:
          setup:
            - "One GamesEdition in REGISTRATION_OPEN, one LOW-contact TRACK sport with min_age 50, one 60-64 event T100M with capacity 8 and min_entries_to_stage 1."
            - "One athlete born 1966-03-02 (age_group_code 60-64) has NOT paid, so registration_status == PENDING_PAYMENT, but has a CLEARED screening (risk_score 7.5), so medical_status == SCREENED_CLEARED and the medical gate cannot fire."
            - "The athlete's single entry has been reviewed TAKE_UP, so SportEntry.status == UNDER_REVIEW, SportEvent.accepted_entry_count == 0 and SportEvent.available_slots == 8."
            - "The logical clock is at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /senior-games/games-editions"
              payload: { name: "Prairie Senior Games 2026", host_city: "Springfield", host_state_code: "IL", competition_start_date: "2026-09-10", competition_end_date: "2026-09-20", age_reference_date: "2026-12-31", registration_deadline_utc: "2026-08-25T23:59:59Z" }
              as: GamesAdmin
              captures: { ed_id: $.data.id }
            - call: "POST /senior-games/sports"
              payload: { sport_code: "TRACK", name: "Track and Field", contact_class: "LOW", mark_direction: "LOWER_IS_BETTER", required_certification_level: 2, min_age: 50 }
              as: GamesAdmin
              captures: { sp_track_id: $.data.id }
            - call: "POST /senior-games/sport-events"
              payload: { sport_id: "${sp_track_id}", games_edition_id: "${ed_id}", event_code: "T100M", age_group_code: "60-64", gender_division: "MEN", entry_fee_cents: 6000, capacity: 8, min_entries_to_stage: 1 }
              as: GamesAdmin
              captures: { ev_id: $.data.id }
            - call: "POST /senior-games/games-editions/${ed_id}/open-registration"
              payload: {}
              as: GamesAdmin
            - call: "POST /senior-games/athletes"
              payload: { games_edition_id: "${ed_id}", full_name: "Ada Frost", email: "ada.frost@example.com", date_of_birth: "1966-03-02", residency_state_code: "IL" }
              as: RegistrationOfficer
              captures: { ath_id: $.data.id }
            - call: "POST /senior-games/sport-entries"
              payload: { athlete_id: "${ath_id}", sport_event_id: "${ev_id}", qualification_source: "ORGANIZER_INVITE" }
              as: RegistrationOfficer
              captures: { en_id: $.data.id }
            - call: "POST /senior-games/medical-screenings"
              payload: { athlete_id: "${ath_id}", screened_by_user_id: "md-lopez", systolic_bp: 128, resting_hr: 70, prior_cardiac_event: false }
              as: MedicalDirector
              as_user_id: "md-lopez"
            - call: "POST /senior-games/sport-entries/${en_id}/review"
              payload: { decision: "TAKE_UP" }
              as: RegistrationOfficer
              as_user_id: "ro-diaz"
          trigger:
            - call: "POST /senior-games/sport-entries/${en_id}/review"
              payload: { decision: "ACCEPT" }
              as: RegistrationOfficer
              as_user_id: "ro-diaz"
            - call: "POST /senior-games/athletes/${ath_id}/pay-fees"
              payload: { amount_cents: 15500 }
              as: GamesAdmin
            - call: "POST /senior-games/sport-entries/${en_id}/review"
              payload: { decision: "ACCEPT" }
              as: RegistrationOfficer
              as_user_id: "ro-diaz"
          assert:
            - "the first ACCEPT returns HTTP 409 with error_id == ERR_ATHLETE_NOT_REGISTERED"
            - "after the first ACCEPT: SportEntry.${en_id}.status == UNDER_REVIEW (unchanged), SportEvent.${ev_id}.accepted_entry_count == 0, SportEvent.${ev_id}.available_slots == 8"
            - "the pay-fees call sets Athlete.${ath_id}.registration_status == REGISTERED and Athlete.${ath_id}.fee_total_cents == 15500 without touching SportEntry.${en_id}.status"
            - "the second ACCEPT returns HTTP 200 and SportEntry.${en_id}.status == ACCEPTED"
            - "after the second ACCEPT: SportEvent.${ev_id}.accepted_entry_count == 1 and SportEvent.${ev_id}.available_slots == 7"
            - "Athlete.${ath_id}.medical_status == SCREENED_CLEARED throughout, so ERR_ATHLETE_MEDICAL_HOLD never fires"

      - name: session_slot_placement_requires_venue_open_dimension
        grounds:
          - validations[priority=44]
          - state_machines.Venue.OPEN_to_CLOSED
          - state_machines.SessionSlot.SCHEDULED_to_DISPLACED
          - entities.Venue.fields.status
          - errors[ERR_VENUE_CLOSED]
        distinguishing_aspect: |
          ENTITY PAIR = SessionSlot depends on Venue (a different pair from the SportEntry/Athlete
          gate). The candidate interval, the event and the area capacity are all valid, yet
          POST /session-slots is refused with ERR_VENUE_CLOSED (409) solely because the referenced
          Venue.status == CLOSED; the identical payload aimed at an OPEN venue is accepted, and
          closing that second venue makes the very same endpoint start refusing it too.
        test_recipe:
          setup:
            - "One GamesEdition in REGISTRATION_OPEN, one LOW-contact TRACK sport, one 60-64 event T100M with capacity 8 and min_entries_to_stage 1 (status OPEN, never seeded)."
            - "Venue A (Eastside Field, competition_area_count 2, EP_ADVANCED, medical bay) has been closed for renovation, so Venue A.status == CLOSED with a closed_reason."
            - "Venue B (Rivergate Oval, competition_area_count 2, EP_ADVANCED, medical bay) is still OPEN and holds no slots."
            - "The logical clock is at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /senior-games/games-editions"
              payload: { name: "Prairie Senior Games 2026", host_city: "Springfield", host_state_code: "IL", competition_start_date: "2026-09-10", competition_end_date: "2026-09-20", age_reference_date: "2026-12-31", registration_deadline_utc: "2026-08-25T23:59:59Z" }
              as: GamesAdmin
              captures: { ed_id: $.data.id }
            - call: "POST /senior-games/sports"
              payload: { sport_code: "TRACK", name: "Track and Field", contact_class: "LOW", mark_direction: "LOWER_IS_BETTER", required_certification_level: 2, min_age: 50 }
              as: GamesAdmin
              captures: { sp_track_id: $.data.id }
            - call: "POST /senior-games/sport-events"
              payload: { sport_id: "${sp_track_id}", games_edition_id: "${ed_id}", event_code: "T100M", age_group_code: "60-64", gender_division: "MEN", entry_fee_cents: 6000, capacity: 8, min_entries_to_stage: 1 }
              as: GamesAdmin
              captures: { ev_id: $.data.id }
            - call: "POST /senior-games/games-editions/${ed_id}/open-registration"
              payload: {}
              as: GamesAdmin
            - call: "POST /senior-games/venues"
              payload: { games_edition_id: "${ed_id}", name: "Eastside Field", competition_area_count: 2, spectator_capacity: 400, emergency_protocol_code: "EP_ADVANCED", has_onsite_medical_bay: true }
              as: GamesAdmin
              captures: { vn_a_id: $.data.id }
            - call: "POST /senior-games/venues"
              payload: { games_edition_id: "${ed_id}", name: "Rivergate Oval", competition_area_count: 2, spectator_capacity: 300, emergency_protocol_code: "EP_ADVANCED", has_onsite_medical_bay: true }
              as: GamesAdmin
              captures: { vn_b_id: $.data.id }
            - call: "POST /senior-games/venues/${vn_a_id}/close"
              payload: { reason: "Track resurfacing runs past the games window." }
              as: GamesAdmin
          trigger:
            - call: "POST /senior-games/session-slots"
              payload: { venue_id: "${vn_a_id}", sport_event_id: "${ev_id}", start_utc: "2026-09-12T09:00:00Z", end_utc: "2026-09-12T10:00:00Z", teardown_buffer_minutes: 15, required_official_count: 1 }
              as: GamesAdmin
            - call: "POST /senior-games/session-slots"
              payload: { venue_id: "${vn_b_id}", sport_event_id: "${ev_id}", start_utc: "2026-09-12T09:00:00Z", end_utc: "2026-09-12T10:00:00Z", teardown_buffer_minutes: 15, required_official_count: 1 }
              as: GamesAdmin
              captures: { slot_b_id: $.data.id }
            - call: "POST /senior-games/venues/${vn_b_id}/close"
              payload: { reason: "Flood warning on the river frontage." }
              as: GamesAdmin
            - call: "POST /senior-games/session-slots"
              payload: { venue_id: "${vn_b_id}", sport_event_id: "${ev_id}", start_utc: "2026-09-13T09:00:00Z", end_utc: "2026-09-13T10:00:00Z", teardown_buffer_minutes: 15, required_official_count: 1 }
              as: GamesAdmin
          assert:
            - "the first POST /session-slots (closed Venue A) returns HTTP 409 with error_id == ERR_VENUE_CLOSED"
            - "no SessionSlot row references venue ${vn_a_id} after the refused call"
            - "the second POST /session-slots (open Venue B) returns HTTP 201 with SessionSlot.${slot_b_id}.status == SCHEDULED, SessionSlot.${slot_b_id}.confirmed_official_count == 0 and SessionSlot.${slot_b_id}.required_official_count == 1"
            - "the identical interval was accepted at Venue B and refused at Venue A, so the refusal is attributable to Venue.status alone and not to the interval, the event or the area capacity"
            - "after closing Venue B: Venue.${vn_b_id}.status == CLOSED and SessionSlot.${slot_b_id}.status == DISPLACED"
            - "the third POST /session-slots (now-closed Venue B) returns HTTP 409 with error_id == ERR_VENUE_CLOSED"
            - "SportEvent.${ev_id}.status == OPEN throughout, because the event was never seeded and SEEDED_to_SCHEDULE_HOLD therefore cannot apply"

