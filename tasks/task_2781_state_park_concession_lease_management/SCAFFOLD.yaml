    side_effects: ["contract_status PENDING_EXECUTION -> ACTIVE", "insurance_expires_on, carrier_name, agency_maintenance_scope persisted; executed_by_user_id = acting X-User-ID", "increments Lease.version by 1"]
  - method: POST
    path: "/leases/{id}/insurance-certificate"
    description: "Records the certificate of insurance currently on file. The agency records what the carrier files, including a certificate whose expiry has already passed (a lapse), so this is also how a lapse is registered."
    roles: [ContractingOfficer]
    code: 200
    input: [insurance_expires_on, "carrier_name?"]
    output: Lease
    side_effects: ["insurance_expires_on and carrier_name overwritten", "no status change on either Lease dimension", "increments Lease.version by 1"]
  - method: POST
    path: "/leases/{id}/enter-holdover"
    description: "Keeps the operating obligation alive past term_end while successor selection finishes."
    roles: [ContractingOfficer]
