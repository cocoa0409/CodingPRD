  - section: validations
    instances:
      - name: violation_to_error_highway_station_carrying_a_water_body_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_9
          - errors.ERR_STATION_SITING_INVALID
        distinguishing_aspect: "The siting coherence rule is two-sided: a HIGHWAY_CORRIDOR station that also names a water_body_id is rejected 422 ERR_STATION_SITING_INVALID, and so is a WATERBODY_ACCESS station that names no water body at all."
        test_recipe:
          setup:
            - "One water body exists so the foreign key resolves and only the coherence rule can fail."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /water-bodies"
              payload: { name: "Flathead Lake", state_code: "MT", water_body_class: "LAKE", risk_tier: "HIGH" }
              as: ProgramAdmin
              captures: { wb_id: $.data.id }
          trigger:
            - call: "POST /inspection-stations"
              payload: { name: "I-90 Haugan", station_type: "HIGHWAY_CORRIDOR", water_body_id: "${wb_id}", corridor_route_code: "I-90-EB" }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the trigger returns 422 with error_id ERR_STATION_SITING_INVALID"
            - "GET /inspection-stations returns meta.total_count == 0 - nothing was persisted"
            - "control: the same call without water_body_id returns 201 with corridor_route_code I-90-EB and water_body_id null"
            - "control: POST /inspection-stations with station_type WATERBODY_ACCESS and no water_body_id also returns 422 ERR_STATION_SITING_INVALID"

      - name: violation_to_error_drainage_correction_that_revisits_the_same_water_body
        claim_type: violation_to_error
        grounds:
          - validations.priority_10
          - errors.ERR_WATER_BODY_CYCLE
          - endpoints.PATCH_/water-bodies/{id}
        distinguishing_aspect: "A drainage cycle can only be formed by a correction, never by a creation, so PATCH is the reachable trigger: with B already draining into A, pointing A at B closes a two-hop loop and is rejected 422 ERR_WATER_BODY_CYCLE; pointing A at itself is rejected the same way."
        test_recipe:
          setup:
            - "A = Flathead Lake with no drainage parent; B = Flathead River draining into A."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /water-bodies"
              payload: { name: "Flathead Lake", state_code: "MT", water_body_class: "LAKE", risk_tier: "HIGH" }
              as: ProgramAdmin
              captures: { wb_a: $.data.id, wb_a_v: $.data.version }
            - call: "POST /water-bodies"
              payload: { name: "Flathead River", state_code: "MT", water_body_class: "RIVER", risk_tier: "MODERATE", downstream_of_water_body_id: "${wb_a}" }
              as: ProgramAdmin
              captures: { wb_b: $.data.id }
          trigger:
            - call: "PATCH /water-bodies/${wb_a}"
              payload: { downstream_of_water_body_id: "${wb_b}" }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the trigger returns 422 with error_id ERR_WATER_BODY_CYCLE"
            - "WaterBody.${wb_a}.downstream_of_water_body_id is still null and version == ${wb_a_v}"
            - "control: PATCH /water-bodies/${wb_a} with downstream_of_water_body_id ${wb_a} (self-reference) also returns 422 ERR_WATER_BODY_CYCLE"
            - "control: PATCH /water-bodies/${wb_a} with risk_tier MODERATE returns 200, bumps the version and leaves detection_count, live_detection_count and infestation_status untouched"

      - name: violation_to_error_duplicate_registration_number_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_11
          - errors.ERR_DUPLICATE_IDENTIFIER
        distinguishing_aspect: "Watercraft.registration_number is globally unique: a second vessel with the same number is rejected 409 ERR_DUPLICATE_IDENTIFIER even when every other field differs, and the same rule guards ReciprocityAgreement.partner_state_code."
        test_recipe:
          setup:
            - "One vessel MT-2001 registered."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /watercraft"
              payload: { registration_number: "MT-2001", home_state_code: "MT", vessel_type: "OPEN_HULL", hull_length_ft: 16 }
              as: ProgramAdmin
              captures: { wc_1: $.data.id }
            - call: "POST /reciprocity-agreements"
              payload: { partner_state_code: "ID", accepted_seal_prefix: "ID-", max_seal_age_hours: 72 }
              as: ProgramAdmin
              captures: { ra_1: $.data.id }
          trigger:
            - call: "POST /watercraft"
              payload: { registration_number: "MT-2001", home_state_code: "WY", vessel_type: "BALLASTED_WAKEBOAT", hull_length_ft: 24 }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the trigger returns 409 with error_id ERR_DUPLICATE_IDENTIFIER"
            - "GET /watercraft with registration_number MT-2001 returns meta.total_count == 1 and data[0].id == ${wc_1}"
            - "control: POST /reciprocity-agreements with partner_state_code ID again also returns 409 ERR_DUPLICATE_IDENTIFIER, so ${ra_1} stays the only ID agreement"

