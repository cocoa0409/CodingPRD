    errors: [ERR_MISSING_ROLE, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_GLASS_ORDER_NOT_FOUND, ERR_INVALID_STATE, ERR_COATING_REVISION_AFTER_RECEIPT]
