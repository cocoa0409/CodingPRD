  # ===========================================================================
  - section: endpoints
    instances:
      - name: company_projects_pagination_limit_offset
        claim_type: listing
        grounds: [response_envelope, entities.Project]
        distinguishing_aspect: "Pagination envelope is honored: limit=1 returns 1 row with total_count 2 and has_more true; offset=1 returns the second row with has_more false."
        test_recipe:
          setup: ["Company with exactly two projects (created P1 then P2)"]
          setup_api_calls:
            - { call: "POST /lien/companies", payload: { name: "PG Co", contact_email: "pg@x.com" }, as: PlatformAdmin, captures: { comp_id: $.data.id } }
            - { call: "POST /lien/projects", payload: { name: "P1", state_code: "CA", county: "Kern", project_type: "COMMERCIAL_PRIVATE", property_legal_description: "Lot 50", contract_value_cents: 100, approved_extras_cents: 0, retainage_held_cents: 0 }, as: CustomerAdmin, as_user_id: "${comp_id}", captures: { p1: $.data.id } }
            - { call: "POST /lien/projects", payload: { name: "P2", state_code: "CA", county: "Kern", project_type: "COMMERCIAL_PRIVATE", property_legal_description: "Lot 51", contract_value_cents: 100, approved_extras_cents: 0, retainage_held_cents: 0 }, as: CustomerAdmin, as_user_id: "${comp_id}", captures: { p2: $.data.id } }
          trigger:
            - { call: "GET /lien/companies/${comp_id}/projects?limit=1&offset=0", payload: {}, as: OpsAgent, captures: { first0: "$.data[0].id" } }
            - { call: "GET /lien/companies/${comp_id}/projects?limit=1&offset=1", payload: {}, as: OpsAgent, captures: { first1: "$.data[0].id" } }
          assert:
            - "Page 1: 1 row (id == ${p1}, creation order), total_count == 2, has_more == true"
            - "Page 2: 1 row (id == ${p2}), has_more == false"

      - name: success_envelope_shape_on_object_and_list
        claim_type: creation
        grounds: [response_envelope]
        distinguishing_aspect: "Every success response carries meta.api_request_id and meta.api_request_timestamp, with response_type 'object' for single GET and 'array' for list GET."
        test_recipe:
          setup: ["company + project"]
          setup_api_calls:
            - { call: "POST /lien/companies", payload: { name: "EV Co", contact_email: "ev@x.com" }, as: PlatformAdmin, captures: { comp_id: $.data.id } }
            - { call: "POST /lien/projects", payload: { name: "EV Job", state_code: "CA", county: "Kern", project_type: "COMMERCIAL_PRIVATE", property_legal_description: "Lot 52", contract_value_cents: 100, approved_extras_cents: 0, retainage_held_cents: 0 }, as: CustomerAdmin, as_user_id: "${comp_id}", captures: { proj_id: $.data.id } }
          trigger:
            - { call: "GET /lien/projects/${proj_id}", payload: {}, as: OpsAgent }
            - { call: "GET /lien/companies/${comp_id}/projects", payload: {}, as: OpsAgent }
          assert:
            - "Single GET: meta.api_request_id present, meta.api_request_timestamp present, response_type == 'object', data is an object"
            - "List GET: response_type == 'array' and pagination fields limit/offset/total_count/has_more present"

      - name: deadline_calendar_computed_read_fields
        claim_type: computed_read
        grounds: [calculations.deadline_calendar]
        distinguishing_aspect: "The calendar read returns all six declared fields for a project with an ACTIVE span under the CA rule."
        test_recipe:
          setup: ["CA project with ACTIVE BASE_CONTRACT span 2026-05-02..2026-06-10"]
          setup_api_calls:
            - { call: "POST /lien/companies", payload: { name: "CR Co", contact_email: "cr@x.com" }, as: PlatformAdmin, captures: { comp_id: $.data.id } }
            - { call: "POST /lien/jurisdiction-rules", payload: { state_code: "CA", project_type: "COMMERCIAL_PRIVATE", prelim_notice_required: true, prelim_days: 20, prelim_day_basis: "CALENDAR", refused_counts_as_served: false, allowed_delivery_methods: ["CERTIFIED_MAIL"], filing_window_days: 90, foreclosure_deadline_days: 90, stop_notice_days: 30, bond_claim_days: 45, counts_punch_list: false, retainage_claimable: false, cap_mode: "UNCAPPED", interest_annual_rate: 0.10, bond_pct: 1.25, effective_from: "2026-01-01" }, as: PlatformAdmin, captures: { rule_id: $.data.id } }
            - { call: "POST /lien/projects", payload: { name: "CR Job", state_code: "CA", county: "Kern", project_type: "COMMERCIAL_PRIVATE", property_legal_description: "Lot 53", contract_value_cents: 100000, approved_extras_cents: 0, retainage_held_cents: 0 }, as: CustomerAdmin, as_user_id: "${comp_id}", captures: { proj_id: $.data.id, pv0: $.data.version } }
            - { call: "POST /lien/furnishing-spans", payload: { project_id: "${proj_id}", span_kind: "BASE_CONTRACT", start_date: "2026-05-02", end_date: "2026-06-10", expected_project_version: "${pv0}" }, as: CustomerAdmin, as_user_id: "${comp_id}" }
          trigger:
            - { call: "GET /lien/projects/${proj_id}/deadline-calendar", payload: {}, as: OpsAgent, captures: { pnd: $.data.prelim_notice_deadline, fwe: $.data.filing_window_end, snd: $.data.stop_notice_deadline, ar: $.data.applied_rule_id, variant: $.data.last_furnishing_variant } }
          assert:
            - "prelim_notice_deadline == '2026-05-22', filing_window_end == '2026-09-08', stop_notice_deadline == '2026-07-10'"
            - "applied_rule_id == ${rule_id}, last_furnishing_date == '2026-06-10', last_furnishing_variant == 'strict'"
