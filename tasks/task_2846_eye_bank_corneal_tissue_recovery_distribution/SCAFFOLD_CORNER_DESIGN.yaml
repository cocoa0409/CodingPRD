          - state_machines.CorneaTissue.disposition_status
          - state_machines.CorneaTissue.custody_status
          - complexity_profile.state_machine_shape
        excluded_because:
          difficulty_instance: non_linear_state_machine / tissue_custody_and_disposition_advance_as_independent_dimensions
          rationale: "The named §1.8 instance walks dispatch/deliver/implant and asserts the two dimensions' independence (disposition ISSUED while custody moves IN_TRANSIT -> AT_SURGEON, then IMPLANTED with custody unchanged) on the same row."

      - name: donor_deferral_cycle_returns_the_donor_to_screening
        claim_type: cyclic_shape
        grounds:
          - state_machines.Donor.DEFERRED_to_SCREENING
          - "endpoints[POST /eye-bank/donors/{id}/reinstate]"
        excluded_because:
          difficulty_instance: non_linear_state_machine / donor_revisits_screening_through_the_deferral_cycle
          rationale: "The named §1.8 instance drives SCREENING -> DEFERRED -> SCREENING twice and asserts deferral_reason clearing plus consent retention on each lap."

      - name: substantiation_cascades_down_from_report_to_the_sibling_request
        claim_type: cascade_down
        grounds:
          - state_machines.AdverseReactionReport.SUBMITTED_to_SUBSTANTIATED
          - state_machines.LookbackInvestigation.null_to_OPEN
          - calculations.lookback_impact_set
        excluded_because:
          difficulty_instance: transitive_cascade / substantiated_serious_reaction_cascades_five_levels_to_the_sibling_request
          rationale: "The named §1.8 instance asserts the full five-level parent-to-child cascade and that already-terminal tissues are counted but not quarantined."

  - section: calculations
    instances:

      - name: donor_recovery_window_charges_the_slow_cooling_credit_and_the_age_penalty
        claim_type: constants_applied
        grounds:
          - calculations.donor_recovery_window
          - calculations.donor_recovery_window.constants
          - entities.Donor.fields.recovery_deadline_at
        distinguishing_aspect: |
          The middle cooling band and the age penalty fire together on one donor: PRONOUNCED base
          660, cooling delay 300 min (in (240, 480] so the credit is 120, not 240), age 75 (-60)
          => 720 minutes and deadline death_at + 12 h = 2026-08-03T08:00:00.000Z. Any
          implementation that applies the 240 credit or drops the age penalty misses by 120-240.
        test_recipe:
          setup:
            - "logical clock at 2026-08-03T06:00:00.000Z"
            - "death_at 2026-08-02T20:00:00.000Z and body_cooled_at 2026-08-03T01:00:00.000Z (both already in the past)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T06:00:00.000Z" }
              as: EyeBankCoordinator
          trigger:
            - call: "POST /eye-bank/donors"
              payload: { donor_code: "D-2846-K01", referral_source: "HOSPICE", death_at: "2026-08-02T20:00:00.000Z", death_time_basis: "PRONOUNCED", body_cooled_at: "2026-08-03T01:00:00.000Z", age_years: 75, cause_of_death_category: "NEUROLOGIC" }
              as: EyeBankCoordinator
              captures: { win: $.data.recovery_window_minutes, deadline: $.data.recovery_deadline_at }
          assert:
            - "HTTP 201"
            - "${win} == 720 (660 + 120 - 60)"
            - "${deadline} == \"2026-08-03T08:00:00.000Z\""

      - name: hemodilution_above_the_gate_forces_indeterminate_despite_four_clean_markers
        claim_type: correct_result
        grounds:
          - calculations.serology_overall_result
          - calculations.serology_overall_result.constants
          - entities.Donor.fields.serology_status
        distinguishing_aspect: |
          All four markers are NON_REACTIVE yet hemodilution_pct 55.00 exceeds the 50.00 gate, so
          overall_result is INDETERMINATE and the donor's serology_status maps to INDETERMINATE
          (not NEGATIVE) — the hemodilution gate is evaluated before marker indeterminacy and
          independently of the markers themselves.
        test_recipe:
          setup:
            - "logical clock at 2026-08-03T06:00:00.000Z"
            - "one donor in CONSENT_OBTAINED; one DRAWN panel with hemodilution_pct 55.00"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T06:00:00.000Z" }
              as: EyeBankCoordinator
            - call: "POST /eye-bank/donors"
              payload: { donor_code: "D-2846-K02", referral_source: "HOSPITAL", death_at: "2026-08-03T02:00:00.000Z", death_time_basis: "ASYSTOLE", age_years: 52, cause_of_death_category: "CARDIAC" }
              as: EyeBankCoordinator
              captures: { donor_id: $.data.id }
            - call: "POST /eye-bank/donors/${donor_id}/screening-records"
              payload: { question_code: "TATTOO_12M", response: "NO", historian_relationship: "SPOUSE" }
              as: EyeBankCoordinator
            - call: "POST /eye-bank/donors/${donor_id}/consent"
              payload: { consent_type: "FIRST_PERSON", consent_scope: "TRANSPLANT_ONLY", authorizing_party_name: "Registry Self-Consent" }
              as: EyeBankCoordinator
              captures: { donor_v1: $.data.version }
            - call: "POST /eye-bank/donors/${donor_id}/serology-panels"
              payload: { specimen_type: "POST_MORTEM", drawn_at: "2026-08-03T04:00:00.000Z", hemodilution_pct: 55.00, expected_donor_version: "${donor_v1}" }
              as: LabTechnician
              captures: { panel_id: $.data.id }
          trigger:
            - call: "POST /eye-bank/serology-panels/${panel_id}/results"
              payload: { hiv_result: "NON_REACTIVE", hbv_result: "NON_REACTIVE", hcv_result: "NON_REACTIVE", syphilis_result: "NON_REACTIVE" }
              as: LabTechnician
              captures: { overall: $.data.overall_result, st: $.data.status, resulted: $.data.resulted_at }
            - call: "GET /eye-bank/donors/${donor_id}"
              payload: {}
              as: LabTechnician
              captures: { sero: $.data.serology_status, dst: $.data.status }
          assert:
            - "HTTP 200"
            - "${overall} == \"INDETERMINATE\" and ${st} == \"RESULTED\" and ${resulted} == \"2026-08-03T06:00:00.000Z\""
            - "${sero} == \"INDETERMINATE\""
            - "${dst} == \"CONSENT_OBTAINED\" (an indeterminate panel does not rule the donor out)"

      - name: hemodilution_exactly_at_fifty_point_zero_zero_stays_non_reactive
        claim_type: precision
        grounds:
          - calculations.serology_overall_result
          - calculations.serology_overall_result.precision
          - "constants[HEMODILUTION_INDETERMINATE_PCT]"
        distinguishing_aspect: |
          The gate is strict `>`: hemodilution_pct of exactly 50.00 compared at two decimals does
          NOT trigger it, so the same four clean markers yield NON_REACTIVE and donor
          serology_status NEGATIVE. This is the off-by-one partner of the 55.00 case; a `>=`
          implementation flips both.
        test_recipe:
          setup:
            - "logical clock at 2026-08-03T06:00:00.000Z"
            - "one donor in CONSENT_OBTAINED; one DRAWN panel with hemodilution_pct exactly 50.00"
