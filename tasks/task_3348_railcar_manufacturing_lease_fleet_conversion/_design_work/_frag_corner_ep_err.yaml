      - name: error_endorsement_retry_exhausted_on_second_return_returns_409
        claim_type: Violation → Error
        grounds:
          - errors[ERR_ENDORSEMENT_RETRY_EXHAUSTED]
          - state_machines.SubstitutionEndorsement.REJECTED_to_PENDING
          - entities.SubstitutionEndorsement.fields.status
          - "PATCH /api/v1/substitution-endorsements/{id}"
        distinguishing_aspect: "The PATCH ladder reject, return-to-pending, reject all succeed with HTTP 200, but the second return to PENDING is rejected 409 ERR_ENDORSEMENT_RETRY_EXHAUSTED and the endorsement stays REJECTED — the retry budget is one round trip, not unlimited."
        test_recipe:
          setup:
            - "Empty DB; logical clock pinned to 2026-09-01T00:00:00Z."
            - "Car type CT-P (BOXCAR, build_hours 1, regulatory_life_years 25, line_count_family LINE-P) with WHEELSET WS-P at qty_per_car 2 and substitute WHEELSET WS-P2 available."
            - "One DRAFT order of 1 car stands at version 1 and carries a single PENDING endorsement raised by X-User-ID user-planner-p."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/car-types"
              payload: { model_code: "CT-P", car_class: "BOXCAR", build_hours: 1, regulatory_life_years: 25, line_count_family: "LINE-P" }
              as: ProductionPlanner
              captures: { ct_id: $.data.id }
            - call: "POST /api/v1/components"
              payload: { part_number: "WS-P", component_class: "WHEELSET", unit_cost_cents: 1000, lead_time_days: 5 }
              as: SupplyChainCoordinator
              captures: { ws_id: $.data.id }
            - call: "POST /api/v1/components"
              payload: { part_number: "WS-P2", component_class: "WHEELSET", unit_cost_cents: 1100, lead_time_days: 4 }
              as: SupplyChainCoordinator
              captures: { ws2_id: $.data.id }
            - call: "POST /api/v1/car-type-component-requirements"
              payload: { car_type_id: "${ct_id}", component_id: "${ws_id}", qty_per_car: 2 }
              as: ProductionPlanner
            - call: "POST /api/v1/production-orders"
              payload: { car_type_id: "${ct_id}", quantity: 1, planned_shop_days: 1, disposition: "SOLD", priority_rank: 1, order_date: "2026-09-01", required_delivery_date: "2026-12-01" }
              as: ProductionPlanner
              captures: { po_id: $.data.id, po_v: $.data.version }
            - call: "POST /api/v1/substitution-endorsements"
              payload: { production_order_id: "${po_id}", original_component_id: "${ws_id}", substitute_component_id: "${ws2_id}", substitute_qty_per_car: 2, decides_material: false, expected_production_order_version: "${po_v}" }
              as: ProductionPlanner
              as_user_id: "user-planner-p"
              captures: { se_id: $.data.id, se_status: $.data.status }
          trigger:
            - call: "PATCH /api/v1/substitution-endorsements/${se_id}"
              payload: { status: "REJECTED" }
              as: LeaseAdministrator
              as_user_id: "user-lease-p"
              captures: { r1_status: $.data.status }
            - call: "PATCH /api/v1/substitution-endorsements/${se_id}"
              payload: { status: "PENDING" }
              as: ProductionPlanner
              as_user_id: "user-planner-p"
              captures: { r2_status: $.data.status }
            - call: "PATCH /api/v1/substitution-endorsements/${se_id}"
              payload: { status: "REJECTED" }
              as: LeaseAdministrator
              as_user_id: "user-lease-p"
              captures: { r3_status: $.data.status }
            - call: "PATCH /api/v1/substitution-endorsements/${se_id}"
              payload: { status: "PENDING" }
              as: ProductionPlanner
              as_user_id: "user-planner-p"
              captures: { err_retry: $.data.error_id }
            - call: "GET /api/v1/substitution-endorsements/${se_id}"
              payload: {}
              as: PlatformAdmin
              captures: { se_after: $.data.status, se_version: $.data.version }
          assert:
            - "The endorsement started PENDING: status == ${se_status} == \"PENDING\""
            - "The first three PATCH calls all succeed: REJECTED -> ${r1_status} == \"REJECTED\", back to PENDING -> ${r2_status} == \"PENDING\", and rejected again -> ${r3_status} == \"REJECTED\""
            - "The second return to PENDING is refused: HTTP 409 with data.error_id == ${err_retry} == \"ERR_ENDORSEMENT_RETRY_EXHAUSTED\""
            - "The failed retry changed nothing: SubstitutionEndorsement.${se_id}.status == ${se_after} == \"REJECTED\""
            - "The precondition is counted in rejections, not in calls: the row has now been rejected twice, which is the terminal condition on the REJECTED_to_PENDING edge"
            - "The row is still readable and still carries its version == ${se_version}, so the exhausted endorsement remains auditable rather than being deleted"

