  # ===========================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: household_membership_conserved_across_survivor_transfer
        grounds:
          - state_machines.SurvivorSupportCase.OPEN_to_GRANTED
          - calculations.household_aggregate_recompute
        distinguishing_aspect: |
          Conserved quantity: total household membership. The survivor-grant
          forward action moves the beneficiary into the deceased member's
          household and its compensating counterpart (delink-household back to
          the original household) MUST leave the invariant
          count(Members with household_id == H_D) +
          count(Members with household_id == H_B) unchanged at 2 before and
          after the round trip — with aggregates recomputed identically at
          each end state (no drift).
        test_recipe:
          setup:
            - "Deceased member D in household H_D (membership: D). Beneficiary B (ACTIVE spouse) in household H_B (membership: B). Survivor case OPEN for B."
            - "Pinned pre-state: |H_D| = 1 (D, DECEASED), |H_B| = 1 (B), sum = 2."
          setup_api_calls:
            - call: "POST /membership/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /membership/eligibility-cases"
