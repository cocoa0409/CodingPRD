# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests) — task_3056
# Career Agency Field Force Recruiting & Advisor Validation
#
# Breadth probe over §1.1–§1.7. Corners §1.8 already exercises appear as
# `excluded_because:` stubs. Every `${var}` binds on an earlier `captures:`.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: district_office_create_returns_every_declared_field
        claim_type: Creation
        grounds:
          - entities.DistrictOffice
          - endpoints.POST_/agency/district-offices
        distinguishing_aspect: "A district office created with only office_code, name, region_code and state_code comes back 201 with status ACTIVE and version 1; override_rate_pct and override_cap_cents take their defaults rather than null."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. Empty database."]
          setup_api_calls:
            - &clock
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - &office_min
              call: "POST /agency/district-offices"
              payload: { office_code: "DO-C01", name: "Default District", region_code: "MW", state_code: "WI" }
              as: ManagingDirector
              captures: { office_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "DistrictOffice.${office_id}.status == ACTIVE and version == 1"
            - "DistrictOffice.${office_id}.override_rate_pct == 0.05"
            - "DistrictOffice.${office_id}.override_cap_cents == 300000"
            - "meta.api_request_id and meta.api_request_timestamp are present"

      - name: district_office_get_round_trips_the_stored_configuration
        claim_type: Retrieval
        grounds:
          - entities.DistrictOffice
          - endpoints.GET_/agency/district-offices/{id}
        distinguishing_aspect: "Every DistrictOffice field round-trips through GET unchanged, including the explicit override_rate_pct override and the non-default cap."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. One fully-specified district office."]
          setup_api_calls:
            - *clock
            - call: "POST /agency/district-offices"
              payload: { office_code: "DO-C02", name: "Round Trip District", region_code: "SE", state_code: "GA", override_rate_pct: 0.04, override_cap_cents: 750000 }
              as: ManagingDirector
              captures: { office_id: $.data.id }
          trigger:
            - call: "GET /agency/district-offices/${office_id}"
              payload: {}
              as: Any
          assert:
            - "the response status is 200"
            - "DistrictOffice.${office_id}.office_code == \"DO-C02\" and region_code == \"SE\" and state_code == \"GA\""
            - "DistrictOffice.${office_id}.override_rate_pct == 0.04 and override_cap_cents == 750000"
            - "DistrictOffice.${office_id}.override_paid_cents == 0"

      - name: advisors_list_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/agency/advisors
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three advisors on file, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true, and offset=2 returns the remaining row with has_more false."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. One office with three advisors."]
          setup_api_calls:
            - *clock
            - *office_min
            - call: "POST /agency/advisors"
              payload: { full_name: "Alpha Advisor", email: "alpha@agency.example", district_office_id: "${office_id}", rank: "REP" }
              as: ManagingDirector
            - call: "POST /agency/advisors"
              payload: { full_name: "Beta Advisor", email: "beta@agency.example", district_office_id: "${office_id}", rank: "REP" }
              as: ManagingDirector
            - call: "POST /agency/advisors"
              payload: { full_name: "Gamma Advisor", email: "gamma@agency.example", district_office_id: "${office_id}", rank: "REP" }
              as: ManagingDirector
          trigger:
            - call: "GET /agency/advisors"
              payload: { district_office_id: "${office_id}", limit: 2, offset: 0 }
              as: Any
          assert:
            - "the response status is 200 and response_type is array"
            - "the response returns exactly 2 rows with total_count == 3 and has_more == true"
            - "GET /agency/advisors?district_office_id=${office_id}&limit=2&offset=2 returns exactly 1 row with has_more == false"
            - "GET /agency/advisors?district_office_id=${office_id} with no limit returns 3 rows, limit defaulting to 10 and offset to 0"
            - "GET /agency/advisors?rank=REP returns 3 rows and GET /agency/advisors?rank=DISTRICT_DIRECTOR returns 0 rows"

      - name: policy_get_with_an_unknown_id_returns_policy_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/agency/policies/{id}
          - errors.ERR_POLICY_NOT_FOUND
          - validations[priority=3]
        distinguishing_aspect: "A syntactically valid but unallocated id on a path segment produces the entity-specific 404 ERR_POLICY_NOT_FOUND, not a generic error and not 400."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. No policy has been created."]
          setup_api_calls:
            - *clock
          trigger:
            - call: "GET /agency/policies/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Any
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_POLICY_NOT_FOUND"
            - "response_type is error and data carries both error_id and message"

      - name: employment_contract_create_missing_validation_requirement_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.EmploymentContract.fields.validation_requirement_cents
          - errors.ERR_INVALID_REQUEST
          - validations[priority=1]
        distinguishing_aspect: "validation_requirement_cents is a required input with no default, so omitting it is a 400 ERR_INVALID_REQUEST from the required-field check rather than a 404 or a 409."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. One office, one advisor and one OFFER_ACCEPTED candidate."]
          setup_api_calls:
            - *clock
            - *office_min
            - call: "POST /agency/advisors"
              payload: { full_name: "Dana Omission", email: "dana.omi@agency.example", district_office_id: "${office_id}", rank: "REP" }
              as: ManagingDirector
              captures: { adv_id: $.data.id }
            - call: "POST /agency/recruiting-candidates"
              payload: { full_name: "Dana Omission", source_channel: "REFERRAL", district_office_id: "${office_id}", notes: "omission arm" }
              as: RecruitingOfficer
              captures: { cand_id: $.data.id }
            - call: "POST /agency/recruiting-candidates/${cand_id}/screen"
              payload: {}
              as: RecruitingOfficer
            - call: "POST /agency/recruiting-candidates/${cand_id}/schedule-assessment"
              payload: { assessment_version: "V2", scheduled_date: "2026-09-02T00:00:00Z" }
              as: RecruitingOfficer
              captures: { asm_id: $.data.id }
            - call: "POST /agency/selection-assessments/${asm_id}/score"
              payload: { raw_score: 85, competency_scores: { MARKET_KNOWLEDGE: 8, RELATIONSHIP: 8, RESILIENCE: 7, ETHICS: 9 } }
              as: RecruitingOfficer
            - call: "POST /agency/recruiting-candidates/${cand_id}/advance-to-interview"
              payload: {}
              as: RecruitingOfficer
            - call: "POST /agency/recruiting-candidates/${cand_id}/extend-offer"
              payload: {}
              as: DistrictDirector
            - call: "POST /agency/recruiting-candidates/${cand_id}/accept-offer"
              payload: {}
              as: RecruitingOfficer
              captures: { cand_v: $.data.version }
          trigger:
            - call: "POST /agency/employment-contracts"
              payload: { advisor_id: "${adv_id}", candidate_id: "${cand_id}", contract_type: "FULL_TIME", start_date: "2026-09-03T00:00:00Z", training_allowance_total_cents: 1200000, training_allowance_mode: "FLAT_MONTHLY", expected_candidate_version: "${cand_v}" }
              as: ManagingDirector
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "GET /agency/employment-contracts?advisor_id=${adv_id} returns 0 rows"
            - "RecruitingCandidate.${cand_id}.stage == OFFER_ACCEPTED — the contract create did not consume the offer"

      - name: advisor_status_and_posture_are_computed_at_creation_and_input_ignored
        claim_type: Computed Fields
        grounds:
          - entities.Advisor.fields.validation_posture
          - entities.Advisor.fields.insurance_license_status
          - entities.Advisor.fields.team_production_cents
          - endpoints.POST_/agency/advisors
        distinguishing_aspect: "Advisor create is source:system for contract_status, validation_posture and the three licensing dimensions; a client that posts status fields the endpoint does not declare is ignored — the row is created NOT_CONTRACTED/VALIDATING with NONE dimensions and 0 balances."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. One office."]
          setup_api_calls:
            - *clock
            - *office_min
          trigger:
            - call: "POST /agency/advisors"
              payload: { full_name: "Evan Ignored", email: "evan.ign@agency.example", district_office_id: "${office_id}", rank: "REP", contract_status: "VALIDATED", validation_posture: "VALIDATED", version: 99 }
              as: ManagingDirector
              captures: { adv_id: $.data.id }
          assert:
            - "the response status is 201"
            - "Advisor.${adv_id}.contract_status == NOT_CONTRACTED"
            - "Advisor.${adv_id}.validation_posture == VALIDATING"
            - "Advisor.${adv_id}.insurance_license_status == NONE and securities_registration_status == NONE and appointment_status == NONE"
            - "Advisor.${adv_id}.team_production_cents == 0 and chargeback_balance_cents == 0 and renewal_commission_cents == 0"
            - "Advisor.${adv_id}.version == 1"

      - name: advisor_create_with_an_out_of_enum_rank_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.Advisor.fields.rank
          - errors.ERR_INVALID_REQUEST
          - validations[priority=1]
        distinguishing_aspect: "rank is a closed enum of REP, DISTRICT_DIRECTOR and MANAGING_DIRECTOR; a value such as EXECUTIVE_DIRECTOR is rejected with 400 ERR_INVALID_REQUEST rather than silently defaulting to REP."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. One office."]
          setup_api_calls:
            - *clock
            - *office_min
          trigger:
            - call: "POST /agency/advisors"
              payload: { full_name: "Fiona Bad Rank", email: "fiona.bad@agency.example", district_office_id: "${office_id}", rank: "EXECUTIVE_DIRECTOR" }
              as: ManagingDirector
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "GET /agency/advisors?district_office_id=${office_id} returns 0 rows"

      - name: advisor_sponsoring_chain_is_self_referential_and_cycle_rejected
        claim_type: Parent Relationships
        grounds:
          - entities.Advisor.fields.sponsoring_advisor_id
          - endpoints.POST_/agency/advisors
          - errors.ERR_SPONSORING_CYCLE_DETECTED
          - complexity_profile.relationship_patterns
        distinguishing_aspect: "The graph topology puts sponsoring_advisor_id on the advisor itself; a create whose sponsor chain already reaches the new advisor is refused with ERR_SPONSORING_CYCLE_DETECTED, while a legal downline link succeeds."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. One MD and one DD already in a legal sponsor chain."]
          setup_api_calls:
            - *clock
            - *office_min
            - call: "POST /agency/advisors"
              payload: { full_name: "Hank Sponsor", email: "hank.spo@agency.example", district_office_id: "${office_id}", rank: "MANAGING_DIRECTOR" }
              as: ManagingDirector
              captures: { adv_md_id: $.data.id }
            - call: "POST /agency/advisors"
              payload: { full_name: "Ivy Director", email: "ivy.dir@agency.example", district_office_id: "${office_id}", sponsoring_advisor_id: "${adv_md_id}", rank: "DISTRICT_DIRECTOR" }
              as: ManagingDirector
              captures: { adv_dd_id: $.data.id }
          trigger:
            - call: "POST /agency/advisors"
              payload: { full_name: "Jax Rep", email: "jax.rep@agency.example", district_office_id: "${office_id}", sponsoring_advisor_id: "${adv_dd_id}", rank: "REP" }
              as: ManagingDirector
              captures: { adv_rep_id: $.data.id }
            - call: "GET /agency/advisors/${adv_dd_id}/downline"
              payload: {}
              as: Any
          assert:
            - "the create returns 201 with Advisor.${adv_rep_id}.sponsoring_advisor_id == ${adv_dd_id}"
            - "the downline read returns exactly 1 row, the new REP"
            - "GET /agency/advisors/${adv_md_id}/downline returns exactly 1 row, the DD, and the REP is not in it (direct sponsorship only)"
            - "Advisor.${adv_md_id}.sponsoring_advisor_id is null"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: candidate_reject_from_offer_extended_is_allowed_and_invalidates_assessment
        claim_type: Invalid Transitions
        grounds:
          - state_machines.RecruitingCandidate.OFFER_EXTENDED_to_REJECTED
          - state_machines.RecruitingCandidate.ASSESSMENT_PENDING_to_REJECTED
          - endpoints.POST_/agency/recruiting-candidates/{id}/reject
        distinguishing_aspect: "reject is declared from ASSESSMENT_PENDING and from OFFER_EXTENDED but NOT from OFFER_ACCEPTED, so an accepted candidate's rejection is ERR_INVALID_STATE while the same trigger from OFFER_EXTENDED succeeds and invalidates the assessment."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. One office and one candidate in OFFER_EXTENDED with a SCORED assessment."]
          setup_api_calls:
            - *clock
            - *office_min
            - call: "POST /agency/recruiting-candidates"
              payload: { full_name: "Kara Reject", source_channel: "REFERRAL", district_office_id: "${office_id}", notes: "reject arm" }
              as: RecruitingOfficer
              captures: { cand_id: $.data.id }
            - call: "POST /agency/recruiting-candidates/${cand_id}/screen"
              payload: {}
              as: RecruitingOfficer
            - call: "POST /agency/recruiting-candidates/${cand_id}/schedule-assessment"
              payload: { assessment_version: "V2", scheduled_date: "2026-09-02T00:00:00Z" }
              as: RecruitingOfficer
              captures: { asm_id: $.data.id }
            - call: "POST /agency/selection-assessments/${asm_id}/score"
              payload: { raw_score: 85, competency_scores: { MARKET_KNOWLEDGE: 8, RELATIONSHIP: 8, RESILIENCE: 7, ETHICS: 9 } }
              as: RecruitingOfficer
            - call: "POST /agency/recruiting-candidates/${cand_id}/advance-to-interview"
              payload: {}
              as: RecruitingOfficer
            - call: "POST /agency/recruiting-candidates/${cand_id}/extend-offer"
              payload: {}
              as: DistrictDirector
          trigger:
            - call: "POST /agency/recruiting-candidates/${cand_id}/reject"
              payload: {}
              as: DistrictDirector
              captures: { cand_rejected_id: $.data.id }
          assert:
            - "the response status is 200 and RecruitingCandidate.${cand_rejected_id}.stage == REJECTED"
            - "SelectionAssessment.${asm_id}.status == INVALIDATED"
            - "POST /agency/recruiting-candidates/${cand_id}/reject called a second time returns 409 with ERR_ALREADY_TERMINAL"
            - "POST /agency/recruiting-candidates/${cand_id}/extend-offer returns 409 with ERR_INVALID_STATE"

      - name: terminal_candidate_admits_no_further_stage_change_except_reengagement
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.RecruitingCandidate.OFFER_EXTENDED_to_REJECTED
          - state_machines.RecruitingCandidate.OFFER_DECLINED_to_REENGAGED
          - errors.ERR_ALREADY_TERMINAL
        distinguishing_aspect: "OFFER_DECLINED is terminal for every stage-advance trigger but the dedicated reengage trigger, which is the only declared way out of a terminal candidate state."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. One office and one candidate parked in OFFER_DECLINED."]
          setup_api_calls:
            - *clock
            - *office_min
            - call: "POST /agency/recruiting-candidates"
              payload: { full_name: "Liam Terminal", source_channel: "REFERRAL", district_office_id: "${office_id}", notes: "terminal arm" }
              as: RecruitingOfficer
              captures: { cand_id: $.data.id }
            - call: "POST /agency/recruiting-candidates/${cand_id}/screen"
              payload: {}
              as: RecruitingOfficer
            - call: "POST /agency/recruiting-candidates/${cand_id}/schedule-assessment"
              payload: { assessment_version: "V2", scheduled_date: "2026-09-02T00:00:00Z" }
              as: RecruitingOfficer
              captures: { asm_id: $.data.id }
            - call: "POST /agency/selection-assessments/${asm_id}/score"
              payload: { raw_score: 85, competency_scores: { MARKET_KNOWLEDGE: 8, RELATIONSHIP: 8, RESILIENCE: 7, ETHICS: 9 } }
              as: RecruitingOfficer
            - call: "POST /agency/recruiting-candidates/${cand_id}/advance-to-interview"
              payload: {}
              as: RecruitingOfficer
            - call: "POST /agency/recruiting-candidates/${cand_id}/extend-offer"
              payload: {}
              as: DistrictDirector
            - call: "POST /agency/recruiting-candidates/${cand_id}/decline-offer"
              payload: {}
              as: RecruitingOfficer
          trigger:
            - call: "POST /agency/recruiting-candidates/${cand_id}/advance-to-interview"
              payload: {}
              as: RecruitingOfficer
              captures: { err_id: $.data.error_id }
            - call: "POST /agency/recruiting-candidates/${cand_id}/reengage"
              payload: {}
              as: RecruitingOfficer
              captures: { cand_re_id: $.data.id }
          assert:
            - "the stage advance returns 409 with error_id == ERR_INVALID_STATE"
            - "RecruitingCandidate.${cand_re_id}.stage == REENGAGED"
            - "RecruitingCandidate.${cand_re_id}.reengagement_count == 1"
            - "SelectionAssessment.${asm_id}.status == SUPERSEDED after re-engagement"

      - name: campus_candidate_cannot_be_screened_without_campus_name
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.RecruitingCandidate.SOURCED_to_SCREENED
          - errors.ERR_CAMPUS_NAME_REQUIRED
          - endpoints.POST_/agency/recruiting-candidates/{id}/screen
        distinguishing_aspect: "The SOURCED -> SCREENED precondition on campus_name applies only to CAMPUS-source candidates; the same trigger on a REFERRAL candidate with no campus_name succeeds."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. One office, one CAMPUS candidate with a null campus_name and one REFERRAL candidate."]
          setup_api_calls:
            - *clock
            - *office_min
            - call: "POST /agency/recruiting-candidates"
              payload: { full_name: "Mia Campus", source_channel: "CAMPUS", district_office_id: "${office_id}", notes: "no campus" }
              as: RecruitingOfficer
              captures: { cand_campus_id: $.data.id }
            - call: "POST /agency/recruiting-candidates"
              payload: { full_name: "Ned Referral", source_channel: "REFERRAL", district_office_id: "${office_id}", notes: "referral" }
              as: RecruitingOfficer
              captures: { cand_ref_id: $.data.id }
          trigger:
            - call: "POST /agency/recruiting-candidates/${cand_campus_id}/screen"
              payload: {}
              as: RecruitingOfficer
              captures: { err_id: $.data.error_id }
            - call: "POST /agency/recruiting-candidates/${cand_ref_id}/screen"
              payload: {}
              as: RecruitingOfficer
              captures: { cand_ref_sc_id: $.data.id }
          assert:
            - "the campus screen returns 400 with error_id == ERR_CAMPUS_NAME_REQUIRED"
            - "RecruitingCandidate.${cand_campus_id}.stage == SOURCED — the failed screen did not advance it"
            - "the referral screen returns 200 and RecruitingCandidate.${cand_ref_sc_id}.stage == SCREENED"
            - "RecruitingCandidate.${cand_ref_sc_id}.campus_name is null"

      - name: advance_to_interview_blocked_by_a_failing_latest_assessment
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.RecruitingCandidate.ASSESSED_to_INTERVIEW_READY
          - entities.SelectionAssessment.fields.outcome
          - errors.ERR_ASSESSMENT_NOT_PASSED
        distinguishing_aspect: "the ASSESSED -> INTERVIEW_READY precondition reads the candidate's LATEST SCORED assessment, so superseding a FAIL with a PASS opens the transition while superseding a PASS with a FAIL closes it."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. One office and one candidate whose first V1 assessment scored FAIL."]
          setup_api_calls:
            - *clock
            - *office_min
            - call: "POST /agency/recruiting-candidates"
              payload: { full_name: "Owen Fail", source_channel: "REFERRAL", district_office_id: "${office_id}", notes: "fail arm" }
              as: RecruitingOfficer
              captures: { cand_id: $.data.id }
            - call: "POST /agency/recruiting-candidates/${cand_id}/screen"
              payload: {}
              as: RecruitingOfficer
            - call: "POST /agency/recruiting-candidates/${cand_id}/schedule-assessment"
              payload: { assessment_version: "V1", scheduled_date: "2026-09-02T00:00:00Z" }
              as: RecruitingOfficer
              captures: { asm_fail_id: $.data.id }
            - call: "POST /agency/selection-assessments/${asm_fail_id}/score"
              payload: { raw_score: 30, competency_scores: { MARKET_KNOWLEDGE: 2, RELATIONSHIP: 3, RESILIENCE: 4, ETHICS: 3 } }
              as: RecruitingOfficer
          trigger:
            - call: "POST /agency/recruiting-candidates/${cand_id}/advance-to-interview"
              payload: {}
              as: RecruitingOfficer
              captures: { err_id: $.data.error_id }
          assert:
            - "SelectionAssessment.${asm_fail_id}.weighted_score == 3.07 and outcome == FAIL"
            - "the advance returns 409 with error_id == ERR_ASSESSMENT_NOT_PASSED"
            - "RecruitingCandidate.${cand_id}.stage == ASSESSED"

      - name: assessment_scoring_requires_all_four_competency_keys
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.SelectionAssessment.SCHEDULED_to_SCORED
          - errors.ERR_ASSESSMENT_INCOMPLETE_SCORES
          - entities.SelectionAssessment.fields.competency_scores
        distinguishing_aspect: "the scoring precondition requires exactly the four competency keys; a three-key payload is refused with ERR_ASSESSMENT_INCOMPLETE_SCORES and leaves the assessment SCHEDULED and the candidate ASSESSMENT_PENDING."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. One office and one candidate in ASSESSMENT_PENDING."]
          setup_api_calls:
            - *clock
            - *office_min
            - call: "POST /agency/recruiting-candidates"
              payload: { full_name: "Peta Keys", source_channel: "REFERRAL", district_office_id: "${office_id}", notes: "keys arm" }
              as: RecruitingOfficer
              captures: { cand_id: $.data.id }
            - call: "POST /agency/recruiting-candidates/${cand_id}/screen"
              payload: {}
              as: RecruitingOfficer
            - call: "POST /agency/recruiting-candidates/${cand_id}/schedule-assessment"
              payload: { assessment_version: "V2", scheduled_date: "2026-09-02T00:00:00Z" }
              as: RecruitingOfficer
              captures: { asm_id: $.data.id }
          trigger:
            - call: "POST /agency/selection-assessments/${asm_id}/score"
              payload: { raw_score: 70, competency_scores: { MARKET_KNOWLEDGE: 7, RELATIONSHIP: 7, RESILIENCE: 7 } }
              as: RecruitingOfficer
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_ASSESSMENT_INCOMPLETE_SCORES"
            - "SelectionAssessment.${asm_id}.status == SCHEDULED and weighted_score is null"
            - "RecruitingCandidate.${cand_id}.stage == ASSESSMENT_PENDING"

      - name: joint_work_case_submit_and_reopen_cycle
        claim_type: Valid Transition
        grounds:
          - state_machines.JointWorkCase.VOIDED_to_OPEN
