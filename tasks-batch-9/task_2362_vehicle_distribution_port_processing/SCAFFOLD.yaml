    roles: [DamageSurveyor]
    code: 201
    input: ["carrier_scac", "expected_damage_survey_version"]
    output: CarrierClaim
    side_effects:
      - "claim created in FILED with recoverable_basis := SURVEY_BASED and recoverable_amount_cents := calculations.carrier_claim_recoverable_amount"
      - "survey.status -> CLAIMED; survey.version += 1"

  - method: GET
    path: /vpc/carrier-claims/{claimId}
    description: "Read one carrier claim."
    roles: *ops_roles
    code: 200
    input: []
    output: CarrierClaim
    side_effects: []

  - method: GET
    path: /vpc/carrier-claims
    description: "List carrier claims, optionally filtered by originating survey, status or respondent."
    roles: *ops_roles
    code: 200
    input: ["damage_survey_id?", "status?", "carrier_scac?", "recoverable_basis?", "limit?", "offset?"]
    output: CarrierClaim[]
    side_effects: []

  - method: POST
    path: /vpc/carrier-claims/{claimId}/carrier-response
    description: "Record the carrier's response: ACCEPT, DISPUTE (with a conceded amount) or DENY."
    roles: [DistributionManager]
    code: 200
    input: ["outcome", "disputed_amount_cents?"]
    output: CarrierClaim
