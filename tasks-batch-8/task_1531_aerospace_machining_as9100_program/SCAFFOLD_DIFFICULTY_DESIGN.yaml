            - "After 4 measurements: spc_eval_status == MONITORING and cpk_provisional == null"
            - "After the 5th measurement: spc_eval_status == CAPABLE and cpk_provisional == 3.333"

  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: wo_release_requires_fai_approved
        grounds:
          - state_machines.WorkOrder.PLANNED_to_RELEASED
          - errors[ERR_FAI_REQUIRED]
        distinguishing_aspect: |
          Entity pair WorkOrder -> FirstArticleInspection: WO release is gated
          on an APPROVED FAI for (part_number, part_revision) when the PO
          carries AS9102_FAI; rejected before approval, permitted after.
        test_recipe:
          setup:
            - "LTA ACTIVE; PO PO-FAI (part P300 rev F, clause AS9102_FAI) RELEASED; WO qty 1 PLANNED; FAI for P300/F exists but is only SUBMITTED"
          setup_api_calls:
            - { call: "POST /api/ltas", payload: { customer_name: "ACME AEROSPACE", ceiling_cents: 100000000, pricing_tiers: [{min_qty: 1, unit_price_cents: 5000}, {min_qty: 100, unit_price_cents: 4500}, {min_qty: 500, unit_price_cents: 4000}], committed_monthly_rate_units: 100, escalation_pct_per_year: 0.05, award_year: 2026, rebate_tiers: [{min_invoiced_cents: 0, rebate_pct: 0}, {min_invoiced_cents: 10000000, rebate_pct: 0.02}, {min_invoiced_cents: 50000000, rebate_pct: 0.05}] }, as: ContractsManager, captures: { lta_id: $.data.id } }
            - { call: "POST /api/ltas/${lta_id}/activate", payload: {}, as: ContractsManager, captures: { lta_v: $.data.version } }
            - { call: "POST /api/purchase-orders", payload: { lta_id: "${lta_id}", po_number: "PO-FAI", part_number: "P300", part_revision: "F", quantity: 1, flowdown_clauses: ["AS9102_FAI"], requires_special_process: false, delivery_year: 2026, expected_lta_version: "${lta_v}" }, as: ContractsManager, captures: { po_id: $.data.id } }
            - { call: "POST /api/purchase-orders/${po_id}/accept", payload: {}, as: ContractsManager }
            - { call: "POST /api/purchase-orders/${po_id}/release", payload: {}, as: ContractsManager }
            - { call: "POST /api/work-orders", payload: { po_id: "${po_id}", quantity: 1, special_processes_required: [] }, as: ManufacturingPlanner, captures: { wo_id: $.data.id } }
            - { call: "POST /api/first-articles", payload: { part_number: "P300", part_revision: "F", fai_type: "FULL" }, as: QualityInspector, as_user_id: "insp-1", captures: { fai_id: $.data.id } }
            - { call: "POST /api/first-articles/${fai_id}/characteristics", payload: { balloon_number: 1, nominal: 5.0, tolerance_plus: 0.05, tolerance_minus: 0.05 }, as: QualityInspector, as_user_id: "insp-1", captures: { ch_id: $.data.id } }
            - { call: "POST /api/characteristics/${ch_id}/record-measurement", payload: { measured_value: 5.0 }, as: QualityInspector, as_user_id: "insp-1" }
            - { call: "POST /api/first-articles/${fai_id}/submit", payload: {}, as: QualityInspector, as_user_id: "insp-2" }
          trigger:
            - { call: "POST /api/work-orders/${wo_id}/release", payload: {}, as: ManufacturingPlanner, captures: { err: $.data.error_id } }
            - { call: "POST /api/first-articles/${fai_id}/approve", payload: {}, as: CustomerQualityRep, as_user_id: "cqr-1" }
            - { call: "POST /api/work-orders/${wo_id}/release", payload: {}, as: ManufacturingPlanner, captures: { wo_st: $.data.status } }
          assert:
            - "While FAI is SUBMITTED (not APPROVED): release fails with error_id == ERR_FAI_REQUIRED, http_status == 422"
            - "After FAI approval: release succeeds, WorkOrder.${wo_id}.status == RELEASED"

      - name: ncr_close_requires_escape_acknowledged
        grounds:
          - state_machines.NonconformanceReport.VERIFIED_to_CLOSED
          - errors[ERR_ESCAPE_NOT_ACKNOWLEDGED]
        distinguishing_aspect: |
          Entity pair NonconformanceReport -> EscapeReport (different pair
          from WO->FAI): a post-shipment NCR cannot close until its linked
          EscapeReport reaches ACKNOWLEDGED.
        test_recipe:
          setup:
            - "LTA ACTIVE; PO PO-ESC (qty 1, no AS9102_FAI) RELEASED; WO qty 1 COMPLETED; serial SN-0001 SHIPPED (PO auto-CLOSED)"
            - "NCR (detected_post_shipment true) VERIFIED with disposition USE_AS_IS and concession recorded; linked EscapeReport still DRAFT"
          setup_api_calls:
            - { call: "POST /api/ltas", payload: { customer_name: "ACME AEROSPACE", ceiling_cents: 100000000, pricing_tiers: [{min_qty: 1, unit_price_cents: 5000}, {min_qty: 100, unit_price_cents: 4500}, {min_qty: 500, unit_price_cents: 4000}], committed_monthly_rate_units: 100, escalation_pct_per_year: 0.05, award_year: 2026, rebate_tiers: [{min_invoiced_cents: 0, rebate_pct: 0}, {min_invoiced_cents: 10000000, rebate_pct: 0.02}, {min_invoiced_cents: 50000000, rebate_pct: 0.05}] }, as: ContractsManager, captures: { lta_id: $.data.id } }
            - { call: "POST /api/ltas/${lta_id}/activate", payload: {}, as: ContractsManager, captures: { lta_v: $.data.version } }
            - { call: "POST /api/purchase-orders", payload: { lta_id: "${lta_id}", po_number: "PO-ESC", part_number: "P310", part_revision: "A", quantity: 1, flowdown_clauses: ["AS9100D_QMS"], requires_special_process: false, delivery_year: 2026, expected_lta_version: "${lta_v}" }, as: ContractsManager, captures: { po_id: $.data.id } }
            - { call: "POST /api/purchase-orders/${po_id}/accept", payload: {}, as: ContractsManager }
            - { call: "POST /api/purchase-orders/${po_id}/release", payload: {}, as: ContractsManager }
            - { call: "POST /api/work-orders", payload: { po_id: "${po_id}", quantity: 1, special_processes_required: [] }, as: ManufacturingPlanner, captures: { wo_id: $.data.id } }
            - { call: "POST /api/work-orders/${wo_id}/release", payload: {}, as: ManufacturingPlanner }
            - { call: "POST /api/sources", payload: { supplier_code: "S-ESC", approval_scope: "RAW_MATERIAL", counterfeit_risk_rating: "LOW" }, as: SupplyChainManager, captures: { src_id: $.data.id } }
            - { call: "POST /api/sources/${src_id}/approve", payload: {}, as: SupplyChainManager }
            - { call: "POST /api/material-certs", payload: { source_id: "${src_id}", heat_number: "H-ESC", material_spec: "AMS 5643", quantity_received: 5 }, as: SupplyChainManager, as_user_id: "scm-1", captures: { cert_id: $.data.id } }
            - { call: "POST /api/material-certs/${cert_id}/accept", payload: {}, as: QualityInspector, as_user_id: "insp-1" }
            - { call: "POST /api/work-orders/${wo_id}/serials", payload: { material_cert_id: "${cert_id}", count: 1 }, as: ManufacturingPlanner, captures: { s1: $.data.0.id } }
            - { call: "POST /api/work-orders/${wo_id}/complete", payload: {}, as: ManufacturingPlanner }
            - { call: "POST /api/work-orders/${wo_id}/accept", payload: {}, as: CustomerQualityRep, as_user_id: "cqr-1" }
            - { call: "POST /api/serials/${s1}/ship", payload: {}, as: ManufacturingPlanner }
            - { call: "POST /api/ncrs", payload: { wo_id: "${wo_id}", defect_code: "FIELD_FAILURE", description: "customer reports crack", quantity_affected: 1, affected_serial_ids: ["${s1}"], detected_post_shipment: true }, as: QualityInspector, as_user_id: "insp-1", captures: { ncr_id: $.data.id } }
            - { call: "POST /api/ncrs/${ncr_id}/submit-mrb", payload: {}, as: QualityManager }
            - { call: "POST /api/ncrs/${ncr_id}/disposition", payload: { disposition: "USE_AS_IS", rework_hours_per_unit: 0.1, material_cost_per_unit_cents: 0 }, as: MRBMember, as_user_id: "mrb-1" }
            - { call: "POST /api/ncrs/${ncr_id}/customer-concession", payload: { concession_reference: "CONC-2026-001" }, as: CustomerQualityRep, as_user_id: "cqr-1" }
            - { call: "POST /api/ncrs/${ncr_id}/verify", payload: {}, as: QualityInspector, as_user_id: "insp-2" }
          trigger:
            - { call: "POST /api/ncrs/${ncr_id}/close", payload: {}, as: QualityManager, captures: { err: $.data.error_id } }
            - { call: "GET /api/escape-reports?ncr_id=${ncr_id}", payload: {}, as: QualityManager, captures: { er_id: $.data.0.id } }
            - { call: "POST /api/escape-reports/${er_id}/submit", payload: {}, as: QualityManager }
            - { call: "POST /api/escape-reports/${er_id}/acknowledge", payload: { acknowledgement_reference: "ACK-001" }, as: CustomerQualityRep, as_user_id: "cqr-1" }
            - { call: "POST /api/ncrs/${ncr_id}/close", payload: {}, as: QualityManager, captures: { ncr_st: $.data.status } }
          assert:
            - "While EscapeReport is DRAFT: close fails with error_id == ERR_ESCAPE_NOT_ACKNOWLEDGED, http_status == 409"
            - "After submit + acknowledge: close succeeds, NonconformanceReport.${ncr_id}.status == CLOSED"

  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: spa_half_open_adjacency
        grounds:
          - validations[priority=10]
          - errors[ERR_APPROVAL_WINDOW_OVERLAP]
          - entities.SpecialProcessApproval.fields.valid_from
        distinguishing_aspect: |
          Interval semantics: half-open [valid_from, valid_to) on
          SpecialProcessApproval — interior overlap is rejected but pure
          adjacency (new.valid_from == existing.valid_to) is allowed.
        test_recipe:
          setup:
            - "APPROVED source S-SPA with approval_scope SPECIAL_PROCESS"
          setup_api_calls:
            - { call: "POST /api/sources", payload: { supplier_code: "S-SPA", approval_scope: "SPECIAL_PROCESS", counterfeit_risk_rating: "LOW" }, as: SupplyChainManager, captures: { src_id: $.data.id } }
            - { call: "POST /api/sources/${src_id}/approve", payload: {}, as: SupplyChainManager }
          trigger:
            - { call: "POST /api/process-approvals", payload: { source_id: "${src_id}", process_code: "HEAT_TREAT", valid_from: "2026-01-01", valid_to: "2026-07-01", cert_reference: "NADCAP-HT-1" }, as: SupplyChainManager, captures: { pa1: $.data.id, pa1_st: $.data.status } }
            - { call: "POST /api/process-approvals", payload: { source_id: "${src_id}", process_code: "HEAT_TREAT", valid_from: "2026-06-01", valid_to: "2026-09-01", cert_reference: "NADCAP-HT-2" }, as: SupplyChainManager, captures: { err: $.data.error_id } }
            - { call: "POST /api/process-approvals", payload: { source_id: "${src_id}", process_code: "HEAT_TREAT", valid_from: "2026-07-01", valid_to: "2027-01-01", cert_reference: "NADCAP-HT-3" }, as: SupplyChainManager, captures: { pa3: $.data.id, pa3_st: $.data.status } }
          assert:
            - "SPA1 [2026-01-01, 2026-07-01) created, status == ACTIVE"
            - "SPA2 [2026-06-01, 2026-09-01) rejected: error_id == ERR_APPROVAL_WINDOW_OVERLAP, http_status == 409"
            - "SPA3 [2026-07-01, 2027-01-01) created, status == ACTIVE — adjacency at valid_from == existing valid_to is allowed (half-open)"

      - name: dia_closed_interval_overlap_and_cooling_off
        grounds:
          - validations[priority=10]
          - errors[ERR_DELEGATION_WINDOW_OVERLAP]
          - errors[ERR_DIA_COOLING_OFF]
          - entities.DelegatedInspectionAuthority.fields.revoked_at
        distinguishing_aspect: |
          Interval semantics: CLOSED [valid_from, valid_to] on
          DelegatedInspectionAuthority — touching endpoints DO conflict
          (unlike SPA half-open), and re-grant within 30 days of revocation is
          rejected by cooling-off. Different resource and different semantics
          from spa_half_open_adjacency.
        test_recipe:
          setup:
            - "LTA ACTIVE; PO PO-DIA RELEASED; logical clock at the 2026-08-01T00:00:00Z default"
          setup_api_calls:
            - { call: "POST /api/ltas", payload: { customer_name: "ACME AEROSPACE", ceiling_cents: 100000000, pricing_tiers: [{min_qty: 1, unit_price_cents: 5000}, {min_qty: 100, unit_price_cents: 4500}, {min_qty: 500, unit_price_cents: 4000}], committed_monthly_rate_units: 100, escalation_pct_per_year: 0.05, award_year: 2026, rebate_tiers: [{min_invoiced_cents: 0, rebate_pct: 0}, {min_invoiced_cents: 10000000, rebate_pct: 0.02}, {min_invoiced_cents: 50000000, rebate_pct: 0.05}] }, as: ContractsManager, captures: { lta_id: $.data.id } }
            - { call: "POST /api/ltas/${lta_id}/activate", payload: {}, as: ContractsManager, captures: { lta_v: $.data.version } }
            - { call: "POST /api/purchase-orders", payload: { lta_id: "${lta_id}", po_number: "PO-DIA", part_number: "P320", part_revision: "A", quantity: 1, flowdown_clauses: ["DELEGATED_INSPECTION_PERMITTED"], requires_special_process: false, delivery_year: 2026, expected_lta_version: "${lta_v}" }, as: ContractsManager, captures: { po_id: $.data.id } }
            - { call: "POST /api/purchase-orders/${po_id}/accept", payload: {}, as: ContractsManager }
            - { call: "POST /api/purchase-orders/${po_id}/release", payload: {}, as: ContractsManager }
          trigger:
            - { call: "POST /api/delegations", payload: { po_id: "${po_id}", inspector_user_id: "insp-9", valid_from: "2026-01-01", valid_to: "2026-12-31" }, as: CustomerQualityRep, as_user_id: "cqr-1", captures: { dia1: $.data.id, dia1_st: $.data.status } }
            - { call: "POST /api/delegations", payload: { po_id: "${po_id}", inspector_user_id: "insp-9", valid_from: "2026-12-31", valid_to: "2027-06-30" }, as: CustomerQualityRep, as_user_id: "cqr-1", captures: { err1: $.data.error_id } }
            - { call: "POST /api/delegations/${dia1}/revoke", payload: { reason: "customer withdrew delegation" }, as: CustomerQualityRep, as_user_id: "cqr-1" }
            - { call: "POST /api/delegations", payload: { po_id: "${po_id}", inspector_user_id: "insp-9", valid_from: "2026-08-15", valid_to: "2026-09-15" }, as: CustomerQualityRep, as_user_id: "cqr-1", captures: { err2: $.data.error_id } }
            - { call: "POST /api/delegations", payload: { po_id: "${po_id}", inspector_user_id: "insp-9", valid_from: "2026-08-31", valid_to: "2026-12-31" }, as: CustomerQualityRep, as_user_id: "cqr-1", captures: { dia4: $.data.id, dia4_st: $.data.status } }
          assert:
            - "DIA1 [2026-01-01, 2026-12-31] created ACTIVE"
            - "DIA2 touching at 2026-12-31 rejected: error_id == ERR_DELEGATION_WINDOW_OVERLAP (closed interval: shared endpoint conflicts), http_status == 409"
            - "DIA3 (valid_from 2026-08-15, within 30 days of the 2026-08-01 revocation) rejected: error_id == ERR_DIA_COOLING_OFF, http_status == 409"
            - "DIA4 (valid_from 2026-08-31 == revocation date + 30 days) created ACTIVE — cooling-off boundary is inclusive-allowed"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: po_quantity_conservation
        grounds:
          - entities.PurchaseOrder.fields.unreleased_quantity
          - state_machines.WorkOrder.PLANNED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity: units — PO.quantity == unreleased_quantity +
          sum(WO.quantity for non-CANCELLED WOs). The forward action (WO
          create) debits and its compensating action (WO cancel) restores, so
          the pair leaves unreleased_quantity unchanged.
        test_recipe:
          setup:
            - "LTA ACTIVE; PO PO-QTY (qty 10, no AS9102_FAI) RELEASED; unreleased_quantity == 10"
          setup_api_calls:
            - { call: "POST /api/ltas", payload: { customer_name: "ACME AEROSPACE", ceiling_cents: 100000000, pricing_tiers: [{min_qty: 1, unit_price_cents: 5000}, {min_qty: 100, unit_price_cents: 4500}, {min_qty: 500, unit_price_cents: 4000}], committed_monthly_rate_units: 100, escalation_pct_per_year: 0.05, award_year: 2026, rebate_tiers: [{min_invoiced_cents: 0, rebate_pct: 0}, {min_invoiced_cents: 10000000, rebate_pct: 0.02}, {min_invoiced_cents: 50000000, rebate_pct: 0.05}] }, as: ContractsManager, captures: { lta_id: $.data.id } }
            - { call: "POST /api/ltas/${lta_id}/activate", payload: {}, as: ContractsManager, captures: { lta_v: $.data.version } }
            - { call: "POST /api/purchase-orders", payload: { lta_id: "${lta_id}", po_number: "PO-QTY", part_number: "P330", part_revision: "A", quantity: 10, flowdown_clauses: ["AS9100D_QMS"], requires_special_process: false, delivery_year: 2026, expected_lta_version: "${lta_v}" }, as: ContractsManager, captures: { po_id: $.data.id } }
            - { call: "POST /api/purchase-orders/${po_id}/accept", payload: {}, as: ContractsManager }
            - { call: "POST /api/purchase-orders/${po_id}/release", payload: {}, as: ContractsManager }
          trigger:
            - { call: "POST /api/work-orders", payload: { po_id: "${po_id}", quantity: 6, special_processes_required: [] }, as: ManufacturingPlanner, captures: { wo1: $.data.id } }
            - { call: "POST /api/work-orders", payload: { po_id: "${po_id}", quantity: 4, special_processes_required: [] }, as: ManufacturingPlanner, captures: { wo2: $.data.id } }
            - { call: "GET /api/purchase-orders/${po_id}", payload: {}, as: ManufacturingPlanner, captures: { unrel_mid: $.data.unreleased_quantity } }
            - { call: "POST /api/work-orders/${wo1}/cancel", payload: {}, as: ManufacturingPlanner }
            - { call: "GET /api/purchase-orders/${po_id}", payload: {}, as: ManufacturingPlanner, captures: { unrel_end: $.data.unreleased_quantity } }
          assert:
            - "After creating WO1 (6) + WO2 (4): PurchaseOrder.${po_id}.unreleased_quantity == 0 (== 10 - 6 - 4)"
            - "After cancelling WO1: unreleased_quantity == 6 (== 10 - 4)"
            - "Invariant holds at every step: quantity (10) == unreleased_quantity + sum of non-CANCELLED WO quantities"

      - name: lta_ceiling_conservation
        grounds:
          - entities.LongTermAgreement.fields.remaining_ceiling_cents
          - state_machines.PurchaseOrder.RECEIVED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity: money in cents — LTA.ceiling_cents ==
          remaining_ceiling_cents + sum(PO.total_cents for non-CANCELLED POs).
          PO create debits 450000; its compensating cancel restores exactly.
          Different conserved quantity (money, not units) from
          po_quantity_conservation.
        test_recipe:
          setup:
            - "LTA ACTIVE with ceiling_cents 100000000; remaining_ceiling_cents == 100000000"
          setup_api_calls:
            - { call: "POST /api/ltas", payload: { customer_name: "ACME AEROSPACE", ceiling_cents: 100000000, pricing_tiers: [{min_qty: 1, unit_price_cents: 5000}, {min_qty: 100, unit_price_cents: 4500}, {min_qty: 500, unit_price_cents: 4000}], committed_monthly_rate_units: 100, escalation_pct_per_year: 0.05, award_year: 2026, rebate_tiers: [{min_invoiced_cents: 0, rebate_pct: 0}, {min_invoiced_cents: 10000000, rebate_pct: 0.02}, {min_invoiced_cents: 50000000, rebate_pct: 0.05}] }, as: ContractsManager, captures: { lta_id: $.data.id } }
            - { call: "POST /api/ltas/${lta_id}/activate", payload: {}, as: ContractsManager, captures: { lta_v: $.data.version } }
          trigger:
            - { call: "POST /api/purchase-orders", payload: { lta_id: "${lta_id}", po_number: "PO-CEIL", part_number: "P340", part_revision: "A", quantity: 100, flowdown_clauses: ["AS9100D_QMS"], requires_special_process: false, delivery_year: 2026, expected_lta_version: "${lta_v}" }, as: ContractsManager, captures: { po_id: $.data.id, po_tot: $.data.total_cents } }
            - { call: "GET /api/ltas/${lta_id}", payload: {}, as: ContractsManager, captures: { rem_mid: $.data.remaining_ceiling_cents } }
            - { call: "POST /api/purchase-orders/${po_id}/cancel", payload: {}, as: ContractsManager }
            - { call: "GET /api/ltas/${lta_id}", payload: {}, as: ContractsManager, captures: { rem_end: $.data.remaining_ceiling_cents } }
          assert:
            - "PO total_cents == 450000 (100 x 4500)"
            - "After create: LongTermAgreement.${lta_id}.remaining_ceiling_cents == 99550000 (100000000 - 450000)"
            - "After cancel: remaining_ceiling_cents == 100000000 — ceiling conserved exactly"
