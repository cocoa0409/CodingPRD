              payload: { full_name: "Pat", email: "pat@x.com" }
              as: Passenger
              captures: { p_id: $.data.id }
            - call: "POST /v1/bookings"
              payload: { passenger_id: "${p_id}", funding_kind: "CASH", legs: [ { service_date_id: "${sd1}", fare_class_id: "${fc_id}", leg_order: 1 } ] }
              as: Passenger
              as_user_id: "${p_id}"
              captures: { b_id: $.data.id }
            - call: "GET /v1/service-dates/${sd1}"
              payload: {}
              as: Passenger
              captures: { v1: $.data.version }
            - call: "POST /v1/bookings/${b_id}/confirm"
              payload: { expected_service_date_version: "${v1}" }
              as: Passenger
              as_user_id: "${p_id}"
            - call: "POST /v1/bookings/${b_id}/pay"
              payload: {}
              as: Passenger
              as_user_id: "${p_id}"
            - call: "GET /v1/bookings/${b_id}"
              payload: {}
              as: Passenger
              as_user_id: "${p_id}"
              captures: { b_v: $.data.version }
          trigger:
            - call: "POST /v1/bookings/${b_id}/exchange"
              payload: { target_service_date_id: "${sd2}", target_fare_class_id: "${fc_id}", expected_booking_version: "${b_v} - 1" }
              as: Passenger
              as_user_id: "${p_id}"
              captures: { err: $.data.error_id }
          assert:
            - "exchange returns error_id == ERR_STALE_VERSION; http 412; Booking.${b_id}.booking_status remains CONFIRMED"

      - name: version_increments_on_every_mutation
        claim_type: optimistic_concurrency
        grounds: [entities.ServiceDate.fields.version]
        distinguishing_aspect: "ServiceDate.version increments by exactly 1 per mutation: suspend-sales then resume-sales advances version by 2 from its post-create value."
        test_recipe:
          setup: ["Operator + PUBLISHED route + one ServiceDate (version 1)."]
          setup_api_calls:
            - call: "POST /v1/operators"
              payload: { name: "Coastliner", mode: "RAIL" }
              as: ScheduleManager
              captures: { op_id: $.data.id }
            - call: "POST /v1/routes"
              payload: { operator_id: "${op_id}", origin_code: "NYP", destination_code: "BOS", depart_minute_of_day: 540, arrive_minute_of_day: 780 }
              as: ScheduleManager
              captures: { rt_id: $.data.id }
            - call: "POST /v1/routes/${rt_id}/publish"
              payload: {}
              as: ScheduleManager
            - call: "POST /v1/service-dates"
              payload: { route_id: "${rt_id}", departure_date: "2026-06-15", seats_total: 10, base_fare_cents: 4000 }
              as: ScheduleManager
              captures: { sd_id: $.data.id }
            - call: "POST /v1/service-dates/${sd_id}/suspend-sales"
              payload: {}
              as: ScheduleManager
          trigger:
            - call: "POST /v1/service-dates/${sd_id}/resume-sales"
              payload: {}
              as: ScheduleManager
          assert:
            - "after create version==1, after suspend version==2, after resume version==3 (each mutation +1)"

      - name: derived_seat_counters_reconciled_after_hold
        claim_type: derived_field_reconciliation
        grounds: [calculations.seat_inventory, entities.ServiceDate.fields.seats_held, entities.ServiceDate.fields.seats_available]
        distinguishing_aspect: "After a single-leg hold, seats_held becomes 1 and seats_available becomes seats_total-1 immediately on the ServiceDate read (denormalized counters reconciled on write)."
        test_recipe:
          setup: ["ServiceDate seats_total=10; passenger places one HELD booking."]
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: SupportAgent
            - call: "POST /v1/operators"
              payload: { name: "Coastliner", mode: "BUS" }
              as: ScheduleManager
              captures: { op_id: $.data.id }
            - call: "POST /v1/fare-classes"
              payload: { operator_id: "${op_id}", code: "ECONOMY", seating_mode: "OPEN" }
              as: FareAnalyst
              captures: { fc_id: $.data.id }
            - call: "POST /v1/routes"
              payload: { operator_id: "${op_id}", origin_code: "NYP", destination_code: "BOS", depart_minute_of_day: 540, arrive_minute_of_day: 780 }
              as: ScheduleManager
              captures: { rt_id: $.data.id }
            - call: "POST /v1/routes/${rt_id}/publish"
              payload: {}
              as: ScheduleManager
            - call: "POST /v1/service-dates"
              payload: { route_id: "${rt_id}", departure_date: "2026-06-15", seats_total: 10, base_fare_cents: 4000 }
              as: ScheduleManager
              captures: { sd_id: $.data.id }
            - call: "POST /v1/passengers"
              payload: { full_name: "Pat", email: "pat@x.com" }
              as: Passenger
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /v1/bookings"
              payload: { passenger_id: "${p_id}", funding_kind: "CASH", legs: [ { service_date_id: "${sd_id}", fare_class_id: "${fc_id}", leg_order: 1 } ] }
              as: Passenger
              as_user_id: "${p_id}"
              captures: { b_id: $.data.id }
          assert:
            - "GET ServiceDate.${sd_id} shows seats_held == 1, seats_sold == 0, seats_available == 9 immediately after the hold"

  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: confirm_changes_visible_same_response
        claim_type: immediate
        grounds: [state_machines.Booking.booking_status.HELD_to_CONFIRMED]
        excluded_because:
          difficulty_instance: transitive_cascade / booking_confirm_depth2_ledger_and_ticket
          rationale: "The confirm response and immediate seat-counter / ticket visibility are asserted in that §1.8 depth-2 cascade instance (immediate consistency)."
