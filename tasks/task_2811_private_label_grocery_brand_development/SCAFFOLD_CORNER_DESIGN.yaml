      - name: locked_specification_keeps_its_pinned_versions_when_the_cost_model_moves
        claim_type: version_pinning_survives_a_later_write
        grounds:
          - complexity_profile.complexity_layers[version_pinning_on_approval]
          - entities.Specification.fields.pinned_cost_model_version
          - calculations.spec_lock_pricing
        distinguishing_aspect: |
          Approval pins values, not references: accepting a T1 non-substitution change request moves the cost model
          base 221 -> 225 and its audited landed cost 283 -> 287, but the LOCKED specification keeps
          pinned_cost_model_version at the version it observed and keeps slotting_fee_cents 266980, and the item keeps
          retail_price_cents 409. Only the pointer state changes: the specification becomes SUPERSEDE_PENDING. An
          implementation that recomputes the fee from the live cost model reports 271980 and drifts the ledger.
