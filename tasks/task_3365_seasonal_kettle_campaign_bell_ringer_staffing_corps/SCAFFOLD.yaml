scenario: "Seasonal Kettle Campaign, Bell Ringer Staffing & Corps Service Delivery (The Salvation Army): retail host site permissions negotiated for kettle placement with location schedules and exclusivity, bell ringer staffing across volunteers and paid seasonal workers with shift scheduling and background screening, kettle counting, deposit controls and location-level performance tracking with reallocation decisions, digital giving options at kettles with attribution to a location and unit, seasonal assistance programs including toy and food distribution with application intake and eligibility screening, corps community center program delivery across youth, senior and worship activities year round, disaster canteen deployment coordination with incident command structures, unit financial accountability and territorial oversight"
domain_name: "kettle-campaign-corps-service-delivery"
api_prefix: "/api"
complexity_profile:
  primary_archetype: posture_driven_gating
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
  entity_topology: graph
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
    - polymorphic
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Unit
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: display name of the corps, division, area command or territory
      - name: unit_type
        type: enum
        source: input
        description: organizational rank of the unit
        constraints: "one of CORPS, DIVISION, AREA_COMMAND, TERRITORY"
      - name: parent_unit_id
        type: string
        source: input
        description: "FK -> Unit.id; the supervising unit. Null only for a TERRITORY unit"
      - name: territory_code
        type: string
        source: input
        description: two-letter territorial oversight code (e.g. "NT", "ST")
      - name: canteen_pool_size
        type: integer
        source: input
        description: number of canteen assets the unit owns and may commit to deployments
        default: 0
      - name: committed_canteen_count
        type: integer
        source: computed
        description: sum of assigned_canteen_count over this unit's deployments in status APPROVED, STAGED or DEPLOYED
        default: 0
      - name: oversight_level
        type: integer
        source: computed
        description: depth of this unit in the Unit.parent_unit_id chain, TERRITORY = 0
        default: 0

  - name: Campaign
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: campaign display name, e.g. "2026 Christmas Kettle Campaign"
      - name: season_year
        type: integer
        source: input
        description: calendar year the campaign serves
      - name: starts_on
        type: datetime
        source: input
        description: first instant of the campaign window (inclusive)
      - name: ends_on
        type: datetime
        source: input
        description: last instant of the campaign window (inclusive)
      - name: status
        type: enum
        source: system
        description: campaign lifecycle posture; gates every write to its child resources
        constraints: "one of PLANNING, ACTIVE, CLOSED"
        default: PLANNING
      - name: goal_cents
        type: integer
        source: input
        description: territory-approved fundraising goal in cents
      - name: labor_budget_cents
        type: integer
        source: input
        description: ceiling on paid-seasonal labor cost for the campaign
        default: 0
      - name: total_raised_cents
        type: integer
        source: computed
        description: reconciled campaign total per calculation campaign_total_raised
        default: 0
      - name: labor_committed_cents
        type: integer
        source: computed
        description: sum of paid_amount_cents over the campaign's shifts in status COMPLETED
        default: 0
      - name: active_location_count
        type: integer
        source: computed
        description: count of KettleLocation rows for this campaign with status ACTIVE
        default: 0

  - name: HostSite
    parent: null
    common_fields: true
    fields:
      - name: campaign_id
        type: string
        source: input
        description: "FK -> Campaign.id; the campaign this host site permission belongs to"
      - name: retailer_name
        type: string
        source: input
        description: retail chain or business granting kettle placement permission
      - name: store_number
        type: string
        source: input
        description: retailer-assigned store identifier
      - name: city
        type: string
        source: input
        description: municipality of the store
      - name: state_code
        type: string
        source: input
        description: two-letter state code
      - name: permission_status
        type: enum
        source: system
        description: negotiated placement permission posture; gates kettle location activation
        constraints: "one of PENDING, APPROVED, DENIED, EXPIRED, REVOKED"
        default: PENDING
      - name: permission_starts_on
        type: datetime
        source: input
        description: first instant the negotiated permission is valid (inclusive)
      - name: permission_ends_on
        type: datetime
        source: input
        description: last instant the negotiated permission is valid (inclusive)
      - name: exclusivity_scope
        type: enum
        source: input
        description: whether the retailer granted exclusive kettle rights for the window
        constraints: "one of EXCLUSIVE, NON_EXCLUSIVE"
        default: NON_EXCLUSIVE
      - name: max_kettles
        type: integer
        source: input
        description: maximum simultaneous kettle locations this host site permits
        default: 1
      - name: active_kettle_count
        type: integer
        source: computed
        description: count of KettleLocation rows for this host site with status in ACTIVE or SUSPENDED
        default: 0

  - name: KettleLocation
    parent: null
    common_fields: true
    fields:
      - name: host_site_id
        type: string
        source: input
        description: "FK -> HostSite.id; the retail site where this kettle stands"
      - name: campaign_id
        type: string
        source: input
        description: "FK -> Campaign.id; owning campaign"
      - name: location_code
        type: string
        source: input
        description: operator-facing kettle code, unique within the campaign
      - name: placement
        type: enum
        source: input
        description: physical placement of the kettle at the host site
        constraints: "one of INDOOR, OUTDOOR, DRIVE_THROUGH"
      - name: status
        type: enum
        source: system
        description: kettle placement posture; only ACTIVE locations accept shifts and collections
        constraints: "one of DRAFT, ACTIVE, SUSPENDED, CLOSED"
        default: DRAFT
      - name: placement_starts_on
        type: datetime
        source: input
        description: first instant this kettle occupies the host site (inclusive)
      - name: placement_ends_on
        type: datetime
        source: input
        description: last instant this kettle occupies the host site (inclusive)
      - name: daily_required_minutes
        type: integer
        source: input
        description: minutes of bell ringing coverage this location is expected to staff per day
        default: 480
      - name: covered_minutes
        type: integer
        source: computed
        description: sum of COMPLETED shift durations in minutes for this location
        default: 0
      - name: location_total_cents
        type: integer
        source: computed
        description: reconciled kettle + digital proceeds attributed to this location
        default: 0
      - name: cents_per_hour
        type: integer
        source: computed
        description: location_total_cents divided by covered hours, floored
        default: 0
      - name: performance_tier
        type: enum
        source: computed
        description: tier assigned by calculation location_performance_index
        constraints: "one of UNRATED, BRONZE, SILVER, GOLD, PLATINUM"
        default: UNRATED

  - name: BellRinger
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: legal name of the volunteer or paid seasonal worker
      - name: email
        type: string
        source: input
        description: contact email, unique per campaign season
      - name: ringer_type
        type: enum
        source: input
        description: whether the ringer is an unpaid volunteer or a paid seasonal worker
        constraints: "one of VOLUNTEER, PAID_SEASONAL"
      - name: corps_id
        type: string
        source: input
        description: "FK -> Unit.id; the corps unit that recruited and supervises this ringer"
      - name: date_of_birth
        type: datetime
        source: input
        description: used for the minor-curfew safety rule
      - name: screening_status
        type: enum
        source: system
        description: background screening dimension; independent of engagement_status
        constraints: "one of NOT_STARTED, PENDING, CLEARED, FAILED, EXPIRED"
        default: NOT_STARTED
      - name: screening_expires_at
        type: datetime
        source: computed
        description: CLEARED screening expiry, 365 days after the completion instant
      - name: engagement_status
        type: enum
        source: system
        description: employment/volunteer dimension; independent of screening_status
        constraints: "one of ACTIVE, SUSPENDED, SEPARATED"
        default: ACTIVE
      - name: reliability_score
        type: integer
        source: computed
        description: score maintained by calculation bell_ringer_reliability_score, clamped 0..100
        default: 100
      - name: hourly_rate_cents
        type: integer
        source: input
        description: pay rate for PAID_SEASONAL ringers; ignored for VOLUNTEER
        default: 0
      - name: scheduled_hours
        type: number
        source: computed
        description: sum of scheduled durations over this ringer's shifts in status SCHEDULED or CONFIRMED
        default: 0

  - name: Shift
    parent: null
    common_fields: true
    fields:
      - name: kettle_location_id
        type: string
        source: input
        description: "FK -> KettleLocation.id; where the ringer stands"
      - name: bell_ringer_id
        type: string
        source: input
        description: "FK -> BellRinger.id; who stands the kettle"
      - name: starts_at
        type: datetime
        source: input
        description: shift start instant (inclusive)
      - name: ends_at
        type: datetime
        source: input
        description: shift end instant (exclusive)
      - name: break_minutes
        type: integer
        source: input
        description: unpaid break deducted from paid hours
        default: 0
      - name: shift_kind
        type: enum
        source: input
        description: scheduling classification of the shift
        constraints: "one of REGULAR, RELIEF, DOUBLE"
        default: REGULAR
      - name: status
        type: enum
        source: system
        description: shift lifecycle state
        constraints: "one of SCHEDULED, CONFIRMED, CHECKED_IN, COMPLETED, CANCELLED, NO_SHOW"
        default: SCHEDULED
      - name: paid_hours
        type: number
        source: computed
        description: payable hours per calculation shift_paid_amount
        default: 0
      - name: paid_amount_cents
        type: integer
        source: computed
        description: payable cents per calculation shift_paid_amount
        default: 0
      - name: checked_in_at
        type: datetime
        source: computed
        description: instant the ringer checked in, null before CHECKED_IN

  - name: KettleCollection
    parent: null
    common_fields: true
    fields:
      - name: kettle_location_id
        type: string
        source: input
        description: "FK -> KettleLocation.id; the kettle that was counted"
      - name: collected_on
        type: datetime
        source: input
        description: business date the kettle was pulled and counted
      - name: declared_cents
        type: integer
        source: input
        description: amount the bell ringer declared on the collection slip before teller count
      - name: coin_cents
        type: integer
        source: input
        description: teller-counted coin in cents
        default: 0
      - name: currency_cents
        type: integer
        source: input
        description: teller-counted paper currency in cents
        default: 0
      - name: check_cents
        type: integer
        source: input
        description: teller-counted cheque value in cents
        default: 0
      - name: counted_total_cents
        type: integer
        source: computed
        description: coin_cents + currency_cents + check_cents
        default: 0
      - name: variance_cents
        type: integer
        source: computed
        description: variance per calculation kettle_collection_variance (provisional then final variant)
        default: 0
      - name: handling_fee_cents
        type: integer
        source: computed
        description: per-denomination roll handling fee per calculation deposit_denomination_split
        default: 0
      - name: deposit_status
        type: enum
        source: system
        description: counting and deposit control posture
        constraints: "one of SUBMITTED, VERIFIED, VARIANCE_HOLD, DEPOSITED, RECONCILED"
        default: SUBMITTED
      - name: deposited_cents
        type: integer
        source: computed
        description: amount confirmed by the bank deposit, 0 until DEPOSITED
        default: 0
      - name: deposit_reference
        type: string
        source: computed
        description: bank-issued deposit reference stamped at deposit

  - name: DigitalGiving
    parent: null
    common_fields: true
    fields:
      - name: kettle_location_id
        type: string
        source: input
        description: "FK -> KettleLocation.id; the kettle the gift is credited to, empty until attributed"
      - name: campaign_id
        type: string
        source: input
        description: "FK -> Campaign.id; owning campaign"
      - name: unit_id
        type: string
        source: input
        description: "FK -> Unit.id; the corps unit credited with the gift"
      - name: amount_cents
        type: integer
        source: input
        description: gift value in cents
      - name: channel
        type: enum
        source: input
        description: digital giving channel used by the donor
        constraints: "one of QR, SMS, TERMINAL, ONLINE"
      - name: occurred_at
        type: datetime
        source: input
        description: instant the gift was captured by the payment channel
      - name: external_ref
        type: string
        source: input
        description: processor reference, unique across the campaign
      - name: attribution_status
        type: enum
        source: system
        description: attribution posture controlling whether the gift counts toward location and campaign totals
        constraints: "one of RECEIVED, UNATTRIBUTED, ATTRIBUTED, REVERSED"
        default: RECEIVED
      - name: attributed_cents
        type: integer
        source: computed
        description: cents currently counted toward the campaign total, 0 once REVERSED
        default: 0
      - name: reversed_reason
        type: string
        source: computed
        description: reason captured when the gift is reversed

  - name: AssistanceProgram
    parent: null
    common_fields: true
    fields:
      - name: campaign_id
        type: string
        source: input
        description: "FK -> Campaign.id; owning campaign"
      - name: name
        type: string
        source: input
        description: program name, e.g. "Christmas Toy Distribution"
      - name: program_type
        type: enum
        source: input
        description: kind of seasonal assistance distributed
        constraints: "one of TOY, FOOD, COAT, HYGIENE"
      - name: intake_opens_on
        type: datetime
        source: input
        description: first instant applications are accepted (inclusive)
      - name: intake_closes_on
        type: datetime
        source: input
        description: last instant applications are accepted (inclusive)
      - name: household_cap
        type: integer
        source: input
        description: maximum number of accepted applications for the program
      - name: per_household_limit_cents
        type: integer
        source: input
        description: maximum assistance value a single household may receive
        default: 0
      - name: status
        type: enum
        source: system
        description: intake posture; applications are only accepted while OPEN
        constraints: "one of DRAFT, OPEN, CLOSED"
        default: DRAFT
      - name: accepted_application_count
        type: integer
        source: computed
        description: count of applications in status ELIGIBLE, APPROVED, DISTRIBUTION_SCHEDULED or DISTRIBUTED
        default: 0

  - name: AssistanceApplication
    parent: null
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: "FK -> AssistanceProgram.id; the program applied to"
      - name: applicant_name
        type: string
        source: input
        description: name of the head of household
      - name: household_size
        type: integer
        source: input
        description: number of persons in the household, 1..12
      - name: annual_income_cents
        type: integer
        source: input
        description: self-reported annual household income in cents
      - name: verified_income_cents
        type: integer
        source: input
        description: caseworker-verified annual income, entered at screening
        default: 0
      - name: eligibility_status
        type: enum
        source: system
        description: application lifecycle state
        constraints: "one of SUBMITTED, SCREENING, ELIGIBLE, INELIGIBLE, WAITLISTED, APPROVED, DISTRIBUTION_SCHEDULED, DISTRIBUTED, NO_SHOW"
        default: SUBMITTED
      - name: provisional_score
        type: integer
        source: computed
        description: score computed at intake from self-reported income
        default: 0
      - name: eligibility_score
        type: integer
        source: computed
        description: score computed at screening from verified income
        default: 0
      - name: distribution_site_unit_id
        type: string
        source: input
        description: "FK -> Unit.id; the corps unit hosting the household's distribution appointment"
      - name: distribution_scheduled_at
        type: datetime
        source: computed
        description: instant of the household's distribution appointment
      - name: distribution_slot_minutes
        type: integer
        source: input
        description: length of the distribution appointment in minutes
        default: 30
      - name: distribution_status
        type: enum
        source: system
        description: appointment dimension, independent of eligibility_status
        constraints: "one of NOT_SCHEDULED, SCHEDULED, COMPLETED, NO_SHOW"
        default: NOT_SCHEDULED
      - name: pickup_code
        type: string
        source: computed
        description: short code the household presents at distribution

  - name: CorpsProgram
    parent: null
    common_fields: true
    fields:
      - name: unit_id
        type: string
        source: input
        description: "FK -> Unit.id; the corps community center delivering the program"
      - name: name
        type: string
        source: input
        description: program name, e.g. "Sunbeam Youth Club"
      - name: category
        type: enum
        source: input
        description: program stream
        constraints: "one of YOUTH, SENIOR, WORSHIP, COMMUNITY"
      - name: capacity
        type: integer
        source: input
        description: maximum number of enrolled participants
      - name: waitlist_enabled
        type: boolean
        source: input
        description: when true, over-capacity enrollments are waitlisted rather than rejected
        default: true
      - name: status
        type: enum
        source: system
        description: program lifecycle state
        constraints: "one of PLANNED, ACTIVE, SUSPENDED, COMPLETED"
        default: PLANNED
      - name: enrolled_count
        type: integer
        source: computed
        description: number of participants currently holding a seat
        default: 0
      - name: waitlist_count
        type: integer
        source: computed
        description: number of participants currently queued per calculation program_capacity_allocation
        default: 0
      - name: meeting_pattern
        type: string
        source: input
        description: human-readable meeting cadence, e.g. "Tuesdays 16:00"

  - name: DisasterDeployment
    parent: null
    common_fields: true
    fields:
      - name: unit_id
        type: string
        source: input
        description: "FK -> Unit.id; the unit committing canteen assets"
      - name: incident_name
        type: string
        source: input
        description: name of the disaster incident the canteen serves
      - name: incident_command_level
        type: enum
        source: input
        description: ICS-style incident complexity that sets the daily canteen cost tier
        constraints: "one of TYPE_1, TYPE_2, TYPE_3, TYPE_4, TYPE_5"
      - name: requested_canteens
        type: integer
        source: input
        description: number of canteen assets requested from the unit pool
      - name: command_authority
        type: string
        source: input
        description: name of the incident commander or EOC authority requesting the deployment
      - name: status
        type: enum
        source: system
        description: deployment lifecycle state
        constraints: "one of REQUESTED, APPROVED, STAGED, DEPLOYED, DEMOBILIZED, DENIED, CANCELLED"
        default: REQUESTED
      - name: assigned_canteen_count
        type: integer
        source: computed
        description: canteens actually committed, fixed at approval from the unit pool
        default: 0
      - name: deployed_at
        type: datetime
        source: computed
        description: instant the deployment moved to DEPLOYED
      - name: demobilized_at
        type: datetime
        source: computed
        description: instant the deployment moved to DEMOBILIZED
      - name: deployment_cost_cents
        type: integer
        source: computed
        description: cost per calculation canteen_deployment_cost
        default: 0

  - name: ReallocationDecision
    parent: null
    common_fields: true
    fields:
      - name: campaign_id
        type: string
        source: input
        description: "FK -> Campaign.id; owning campaign"
      - name: from_location_id
        type: string
        source: input
        description: "FK -> KettleLocation.id; the underperforming source kettle losing hours"
      - name: to_location_id
        type: string
        source: input
        description: "FK -> KettleLocation.id; the receiving kettle gaining hours"
      - name: moved_hours
        type: number
        source: input
        description: bell ringing hours moved from source to target
      - name: effective_on
        type: datetime
        source: input
        description: date the moved hours take effect
      - name: rationale
        type: string
        source: input
        description: operator justification recorded with the proposal
      - name: status
        type: enum
        source: system
        description: decision lifecycle state
        constraints: "one of PROPOSED, APPROVED, APPLIED, REJECTED"
        default: PROPOSED
      - name: expected_lift_cents
        type: integer
        source: computed
        description: lift per calculation reallocation_expected_lift, frozen at APPROVED
        default: 0
      - name: applied_at
        type: datetime
        source: computed
        description: instant the decision was applied to the locations

state_machines:
  - entity: Campaign
    initial_state: PLANNING
    terminal_states: [CLOSED]
    transitions:
      - from: PLANNING
        to: ACTIVE
        trigger: "POST /api/campaigns/{id}/activate"
        actor: TerritorialCommander
        preconditions:
          - "Campaign.status == PLANNING"
          - "at least one HostSite with campaign_id == Campaign.id has permission_status == APPROVED"
          - "Campaign.ends_on > current logical clock instant"
        side_effects:
          - "Campaign.status := ACTIVE"
          - "Campaign.updated_at refreshed"
          - "increments Campaign.version by 1"
      - from: ACTIVE
        to: CLOSED
        trigger: "system event: logical clock passes Campaign.ends_on (evaluated on any read of GET /api/campaigns/{id})"
        actor: system
        preconditions:
          - "Campaign.status == ACTIVE"
          - "current logical clock instant > Campaign.ends_on"
        side_effects:
          - "Campaign.status := CLOSED"
          - "every KettleLocation with campaign_id == Campaign.id and status in {ACTIVE, SUSPENDED} transitions to CLOSED"
          - "for each such KettleLocation, every Shift with kettle_location_id == that location and status in {SCHEDULED, CONFIRMED} transitions to CANCELLED"
          - "Campaign.updated_at refreshed; increments Campaign.version by 1"

  - entity: HostSite
    initial_state: PENDING
    terminal_states: [DENIED, REVOKED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /api/host-sites/{id}/approve"
        actor: KettleCoordinator
        preconditions:
          - "HostSite.permission_status == PENDING"
          - "HostSite.permission_ends_on > HostSite.permission_starts_on"
          - "the owning Campaign.status == ACTIVE or PLANNING"
        side_effects:
          - "HostSite.permission_status := APPROVED"
          - "increments HostSite.version by 1"
      - from: PENDING
        to: DENIED
        trigger: "POST /api/host-sites/{id}/approve with decision=DENY"
        actor: KettleCoordinator
        preconditions:
          - "HostSite.permission_status == PENDING"
        side_effects:
          - "HostSite.permission_status := DENIED"
          - "increments HostSite.version by 1"
      - from: APPROVED
        to: EXPIRED
        trigger: "system event: logical clock passes HostSite.permission_ends_on"
        actor: system
        preconditions:
          - "HostSite.permission_status == APPROVED"
          - "current logical clock instant > HostSite.permission_ends_on"
        side_effects:
          - "HostSite.permission_status := EXPIRED"
          - "every KettleLocation with host_site_id == HostSite.id and status == ACTIVE transitions to SUSPENDED"
          - "for each such KettleLocation, every Shift with status in {SCHEDULED, CONFIRMED} and starts_at after the expiry instant transitions to CANCELLED"
          - "increments HostSite.version by 1"
      - from: APPROVED
        to: REVOKED
        trigger: "POST /api/host-sites/{id}/approve with decision=REVOKE"
        actor: TerritorialCommander
        preconditions:
          - "HostSite.permission_status == APPROVED"
        side_effects:
          - "HostSite.permission_status := REVOKED"
          - "every KettleLocation with host_site_id == HostSite.id and status in {DRAFT, ACTIVE, SUSPENDED} transitions to CLOSED"
          - "increments HostSite.version by 1"
      - from: EXPIRED
        to: APPROVED
        trigger: "POST /api/host-sites/{id}/renew"
        actor: KettleCoordinator
        preconditions:
          - "HostSite.permission_status == EXPIRED"
          - "payload permission_ends_on > current logical clock instant"
          - "no other HostSite with the same retailer_name and store_number has permission_status == APPROVED with an overlapping permission window"
        side_effects:
          - "HostSite.permission_status := APPROVED"
          - "HostSite.permission_starts_on := current logical clock instant; HostSite.permission_ends_on := payload value"
          - "every KettleLocation with host_site_id == HostSite.id and status == SUSPENDED transitions back to ACTIVE when its placement window is still fully inside the renewed permission window"
          - "increments HostSite.version by 1"

  - entity: KettleLocation
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /api/kettle-locations/{id}/activate"
        actor: KettleCoordinator
        preconditions:
          - "KettleLocation.status == DRAFT"
          - "the HostSite referenced by host_site_id has permission_status == APPROVED"
          - "KettleLocation.placement_starts_on >= HostSite.permission_starts_on and KettleLocation.placement_ends_on <= HostSite.permission_ends_on"
          - "the owning Campaign.status == ACTIVE"
          - "count of KettleLocation rows with host_site_id == HostSite.id and status in {ACTIVE, SUSPENDED} < HostSite.max_kettles"
        side_effects:
          - "KettleLocation.status := ACTIVE"
          - "HostSite.active_kettle_count recomputed"
          - "Campaign.active_location_count recomputed"
          - "increments KettleLocation.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /api/kettle-locations/{id}/suspend"
        actor: KettleCoordinator
        preconditions:
          - "KettleLocation.status == ACTIVE"
        side_effects:
          - "KettleLocation.status := SUSPENDED"
          - "every Shift with kettle_location_id == KettleLocation.id and status == SCHEDULED transitions to CANCELLED"
          - "for each cancelled Shift, the owning BellRinger.scheduled_hours is reduced by the shift duration in hours"
          - "HostSite.active_kettle_count recomputed"
          - "increments KettleLocation.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /api/kettle-locations/{id}/activate"
        actor: KettleCoordinator
        preconditions:
          - "KettleLocation.status == SUSPENDED"
          - "the HostSite referenced by host_site_id has permission_status == APPROVED"
          - "the owning Campaign.status == ACTIVE"
        side_effects:
          - "KettleLocation.status := ACTIVE"
          - "Campaign.active_location_count recomputed"
          - "increments KettleLocation.version by 1"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /api/kettle-locations/{id}/close"
        actor: KettleCoordinator
        preconditions:
          - "KettleLocation.status == ACTIVE"
          - "no KettleCollection with kettle_location_id == KettleLocation.id has deposit_status in {SUBMITTED, VERIFIED, VARIANCE_HOLD}"
        side_effects:
          - "KettleLocation.status := CLOSED"
          - "every Shift with kettle_location_id == KettleLocation.id and status in {SCHEDULED, CONFIRMED} transitions to CANCELLED"
          - "HostSite.active_kettle_count recomputed; Campaign.active_location_count recomputed"
          - "increments KettleLocation.version by 1"
      - from: SUSPENDED
        to: CLOSED
        trigger: "POST /api/kettle-locations/{id}/close"
        actor: KettleCoordinator
        preconditions:
          - "KettleLocation.status == SUSPENDED"
          - "no KettleCollection with kettle_location_id == KettleLocation.id has deposit_status in {SUBMITTED, VERIFIED, VARIANCE_HOLD}"
        side_effects:
          - "KettleLocation.status := CLOSED"
          - "HostSite.active_kettle_count recomputed"
          - "increments KettleLocation.version by 1"

  - entity: BellRinger
    initial_state: "screening_status=NOT_STARTED, engagement_status=ACTIVE (two independent dimensions on one row)"
    terminal_states: ["engagement_status=SEPARATED"]
    transitions:
      - from: "screening_status=NOT_STARTED"
        to: "screening_status=PENDING"
        trigger: "POST /api/bell-ringers/{id}/screenings"
        actor: VolunteerCoordinator
        preconditions:
          - "BellRinger.screening_status == NOT_STARTED"
          - "BellRinger.engagement_status != SEPARATED"
        side_effects:
          - "BellRinger.screening_status := PENDING"
          - "increments BellRinger.version by 1"
      - from: "screening_status=EXPIRED"
        to: "screening_status=PENDING"
        trigger: "POST /api/bell-ringers/{id}/screenings"
        actor: VolunteerCoordinator
        preconditions:
          - "BellRinger.screening_status == EXPIRED"
          - "BellRinger.engagement_status != SEPARATED"
        side_effects:
          - "BellRinger.screening_status := PENDING"
          - "increments BellRinger.version by 1"
      - from: "screening_status=PENDING"
        to: "screening_status=CLEARED"
        trigger: "POST /api/bell-ringers/{id}/screenings/complete with result=CLEAR"
        actor: VolunteerCoordinator
        preconditions:
          - "BellRinger.screening_status == PENDING"
          - "payload completed_at <= current logical clock instant"
        side_effects:
          - "BellRinger.screening_status := CLEARED"
          - "BellRinger.screening_expires_at := completed_at + 365 days"
          - "increments BellRinger.version by 1"
      - from: "screening_status=PENDING"
        to: "screening_status=FAILED"
        trigger: "POST /api/bell-ringers/{id}/screenings/complete with result=FAIL"
        actor: VolunteerCoordinator
        preconditions:
          - "BellRinger.screening_status == PENDING"
        side_effects:
          - "BellRinger.screening_status := FAILED"
          - "BellRinger.engagement_status := SUSPENDED"
          - "every Shift with bell_ringer_id == BellRinger.id and status in {SCHEDULED, CONFIRMED} transitions to CANCELLED"
          - "increments BellRinger.version by 1"
      - from: "screening_status=CLEARED"
        to: "screening_status=EXPIRED"
        trigger: "system event: logical clock passes BellRinger.screening_expires_at"
        actor: system
        preconditions:
          - "BellRinger.screening_status == CLEARED"
          - "current logical clock instant > BellRinger.screening_expires_at"
        side_effects:
          - "BellRinger.screening_status := EXPIRED"
          - "every Shift with bell_ringer_id == BellRinger.id, status in {SCHEDULED, CONFIRMED} and starts_at after the expiry instant transitions to CANCELLED"
          - "increments BellRinger.version by 1"
      - from: "engagement_status=ACTIVE"
        to: "engagement_status=SUSPENDED"
        trigger: "system event: POST /api/shifts/{id}/no-show drives reliability_score below 60"
        actor: system
        preconditions:
          - "BellRinger.engagement_status == ACTIVE"
          - "BellRinger.reliability_score < 60 after the no-show recompute"
        side_effects:
          - "BellRinger.engagement_status := SUSPENDED"
          - "every Shift with bell_ringer_id == BellRinger.id, status == SCHEDULED and starts_at > current logical clock instant transitions to CANCELLED"
          - "for each such cancelled Shift, KettleLocation.covered_minutes is recomputed"
          - "increments BellRinger.version by 1"
      - from: "engagement_status=SUSPENDED"
        to: "engagement_status=ACTIVE"
        trigger: "POST /api/bell-ringers/{id}/screenings/complete with result=CLEAR while screening_status == PENDING"
        actor: VolunteerCoordinator
        preconditions:
          - "BellRinger.engagement_status == SUSPENDED"
          - "BellRinger.screening_status == PENDING"
        side_effects:
          - "BellRinger.engagement_status := ACTIVE"
          - "BellRinger.reliability_score := 60"
          - "increments BellRinger.version by 1"
      - from: "engagement_status=ACTIVE"
        to: "engagement_status=SEPARATED"
        trigger: "POST /api/bell-ringers/{id}/separate"
        actor: VolunteerCoordinator
        preconditions:
          - "BellRinger.engagement_status == ACTIVE"
          - "BellRinger.scheduled_hours == 0"
        side_effects:
          - "BellRinger.engagement_status := SEPARATED"
          - "increments BellRinger.version by 1"

  - entity: Shift
    initial_state: SCHEDULED
    terminal_states: [COMPLETED]
    transitions:
      - from: SCHEDULED
        to: CONFIRMED
        trigger: "POST /api/shifts/{id}/confirm"
        actor: VolunteerCoordinator
        preconditions:
          - "Shift.status == SCHEDULED"
          - "BellRinger.screening_status == CLEARED and screening_expires_at > Shift.starts_at"
          - "BellRinger.engagement_status == ACTIVE"
          - "KettleLocation.status == ACTIVE"
        side_effects:
          - "Shift.status := CONFIRMED"
          - "increments Shift.version by 1"
      - from: SCHEDULED
        to: CHECKED_IN
        trigger: "POST /api/shifts/{id}/check-in"
        actor: BellRinger
        preconditions:
          - "Shift.status == SCHEDULED"
          - "X-User-ID == Shift.bell_ringer_id"
          - "current logical clock instant >= Shift.starts_at - 15 minutes and <= Shift.ends_at"
        side_effects:
          - "Shift.status := CHECKED_IN"
          - "Shift.checked_in_at := current logical clock instant"
          - "increments Shift.version by 1"
      - from: CONFIRMED
        to: CHECKED_IN
        trigger: "POST /api/shifts/{id}/check-in"
        actor: BellRinger
        preconditions:
          - "Shift.status == CONFIRMED"
          - "X-User-ID == Shift.bell_ringer_id"
          - "current logical clock instant >= Shift.starts_at - 15 minutes and <= Shift.ends_at"
        side_effects:
          - "Shift.status := CHECKED_IN"
          - "Shift.checked_in_at := current logical clock instant"
          - "increments Shift.version by 1"
      - from: CHECKED_IN
        to: COMPLETED
        trigger: "POST /api/shifts/{id}/complete"
        actor: VolunteerCoordinator
        preconditions:
          - "Shift.status == CHECKED_IN"
        side_effects:
          - "Shift.status := COMPLETED"
          - "Shift.paid_hours and Shift.paid_amount_cents recomputed per calculation shift_paid_amount"
          - "KettleLocation.covered_minutes increased by the shift duration in minutes"
          - "KettleLocation.cents_per_hour and performance_tier recomputed per calculation location_performance_index"
          - "BellRinger.reliability_score recomputed per calculation bell_ringer_reliability_score"
          - "Campaign.labor_committed_cents recomputed"
          - "increments Shift.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /api/shifts/{id}/cancel"
        actor: VolunteerCoordinator
        preconditions:
          - "Shift.status == SCHEDULED"
        side_effects:
          - "Shift.status := CANCELLED"
          - "BellRinger.scheduled_hours reduced by the shift duration in hours"
          - "increments Shift.version by 1"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /api/shifts/{id}/cancel"
        actor: VolunteerCoordinator
        preconditions:
          - "Shift.status == CONFIRMED"
        side_effects:
          - "Shift.status := CANCELLED"
          - "BellRinger.scheduled_hours reduced by the shift duration in hours"
          - "BellRinger.reliability_score reduced by 5 per calculation bell_ringer_reliability_score (late cancellation)"
          - "increments Shift.version by 1"
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /api/shifts/{id}/no-show"
        actor: VolunteerCoordinator
        preconditions:
          - "Shift.status == SCHEDULED"
          - "current logical clock instant > Shift.ends_at"
        side_effects:
          - "Shift.status := NO_SHOW"
          - "BellRinger.scheduled_hours reduced by the shift duration in hours"
          - "BellRinger.reliability_score recomputed per calculation bell_ringer_reliability_score (no-show penalty)"
          - "if the recomputed BellRinger.reliability_score < 60 then BellRinger.engagement_status transitions ACTIVE -> SUSPENDED (see the BellRinger machine), which cancels every future SCHEDULED shift of that ringer and recomputes each affected KettleLocation.covered_minutes"
          - "increments Shift.version by 1"
      - from: NO_SHOW
        to: SCHEDULED
        trigger: "POST /api/shifts/{id}/rebook"
        actor: VolunteerCoordinator
        preconditions:
          - "Shift.status == NO_SHOW"
          - "BellRinger.engagement_status == ACTIVE"
        side_effects:
          - "Shift.status := SCHEDULED"
          - "BellRinger.scheduled_hours increased by the shift duration in hours"
          - "increments Shift.version by 1"
      - from: CANCELLED
        to: SCHEDULED
        trigger: "POST /api/shifts/{id}/rebook"
        actor: VolunteerCoordinator
        preconditions:
          - "Shift.status == CANCELLED"
          - "BellRinger.screening_status == CLEARED and screening_expires_at > Shift.starts_at"
          - "BellRinger.engagement_status == ACTIVE"
          - "KettleLocation.status == ACTIVE"
        side_effects:
          - "Shift.status := SCHEDULED"
          - "BellRinger.scheduled_hours increased by the shift duration in hours"
          - "increments Shift.version by 1"

  - entity: KettleCollection
    initial_state: SUBMITTED
    terminal_states: [RECONCILED]
    transitions:
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /api/kettle-collections/{id}/verify"
        actor: CountingRoomTeller
        preconditions:
          - "KettleCollection.deposit_status == SUBMITTED"
          - "|provisional variance_cents| <= 500"
        side_effects:
          - "KettleCollection.deposit_status := VERIFIED"
          - "KettleCollection.counted_total_cents := coin_cents + currency_cents + check_cents"
          - "KettleCollection.handling_fee_cents recomputed per calculation deposit_denomination_split"
          - "KettleCollection.variance_cents recomputed per calculation kettle_collection_variance (provisional variant)"
          - "increments KettleCollection.version by 1"
      - from: SUBMITTED
        to: VARIANCE_HOLD
        trigger: "POST /api/kettle-collections/{id}/verify"
        actor: CountingRoomTeller
        preconditions:
          - "KettleCollection.deposit_status == SUBMITTED"
          - "|provisional variance_cents| > 500"
        side_effects:
          - "KettleCollection.deposit_status := VARIANCE_HOLD"
          - "KettleCollection.variance_cents recomputed per calculation kettle_collection_variance (provisional variant)"
          - "KettleLocation.performance_tier downgraded one step per calculation location_performance_index"
          - "increments KettleCollection.version by 1"
      - from: VARIANCE_HOLD
        to: SUBMITTED
        trigger: "POST /api/kettle-collections/{id}/recount"
        actor: CountingRoomTeller
        preconditions:
          - "KettleCollection.deposit_status == VARIANCE_HOLD"
          - "payload coin_cents, currency_cents and check_cents are all >= 0"
        side_effects:
          - "KettleCollection.coin_cents, currency_cents and check_cents := payload values"
          - "KettleCollection.deposit_status := SUBMITTED"
          - "increments KettleCollection.version by 1"
      - from: VERIFIED
        to: DEPOSITED
        trigger: "POST /api/kettle-collections/{id}/deposit"
        actor: FinanceOfficer
        preconditions:
          - "KettleCollection.deposit_status == VERIFIED"
          - "payload deposited_cents == KettleCollection.counted_total_cents - KettleCollection.handling_fee_cents"
        side_effects:
          - "KettleCollection.deposit_status := DEPOSITED"
          - "KettleCollection.deposited_cents := payload deposited_cents"
          - "KettleCollection.deposit_reference := server-minted reference"
          - "KettleLocation.location_total_cents recomputed per calculation campaign_total_raised"
          - "Campaign.total_raised_cents recomputed per calculation campaign_total_raised"
          - "increments KettleCollection.version by 1"
      - from: DEPOSITED
        to: VARIANCE_HOLD
        trigger: "POST /api/kettle-collections/{id}/reconcile with matched=false"
        actor: FinanceOfficer
        preconditions:
          - "KettleCollection.deposit_status == DEPOSITED"
          - "the bank-confirmed amount differs from KettleCollection.deposited_cents"
        side_effects:
          - "KettleCollection.deposit_status := VARIANCE_HOLD"
          - "KettleLocation.location_total_cents recomputed; Campaign.total_raised_cents recomputed"
          - "increments KettleCollection.version by 1"
      - from: DEPOSITED
        to: RECONCILED
        trigger: "POST /api/kettle-collections/{id}/reconcile with matched=true"
        actor: FinanceOfficer
        preconditions:
          - "KettleCollection.deposit_status == DEPOSITED"
          - "the bank-confirmed amount equals KettleCollection.deposited_cents"
        side_effects:
          - "KettleCollection.deposit_status := RECONCILED"
          - "KettleCollection.variance_cents recomputed per calculation kettle_collection_variance (final variant)"
          - "KettleLocation.location_total_cents recomputed; Campaign.total_raised_cents recomputed"
          - "increments KettleCollection.version by 1"

  - entity: DigitalGiving
    initial_state: RECEIVED
    terminal_states: [REVERSED]
    transitions:
      - from: RECEIVED
        to: UNATTRIBUTED
        trigger: "system event: attribution pass finds no kettle_location_id and no eligible location for the unit"
        actor: system
        preconditions:
          - "DigitalGiving.attribution_status == RECEIVED"
          - "no KettleLocation with campaign_id == DigitalGiving.campaign_id and status == ACTIVE exists for the credited Unit"
        side_effects:
          - "DigitalGiving.attribution_status := UNATTRIBUTED"
          - "increments DigitalGiving.version by 1"
      - from: RECEIVED
        to: ATTRIBUTED
        trigger: "POST /api/digital-givings/{id}/attribute"
        actor: DigitalGivingProcessor
        preconditions:
          - "DigitalGiving.attribution_status == RECEIVED"
          - "the target KettleLocation.status == ACTIVE and its campaign_id == DigitalGiving.campaign_id"
        side_effects:
          - "DigitalGiving.attribution_status := ATTRIBUTED"
          - "DigitalGiving.kettle_location_id := payload kettle_location_id"
          - "DigitalGiving.attributed_cents := amount_cents"
          - "KettleLocation.location_total_cents recomputed per calculation campaign_total_raised"
          - "Campaign.total_raised_cents recomputed per calculation campaign_total_raised"
          - "increments DigitalGiving.version by 1"
      - from: UNATTRIBUTED
        to: ATTRIBUTED
        trigger: "POST /api/digital-givings/{id}/attribute"
        actor: DigitalGivingProcessor
        preconditions:
          - "DigitalGiving.attribution_status == UNATTRIBUTED"
          - "the target KettleLocation.status == ACTIVE and its campaign_id == DigitalGiving.campaign_id"
        side_effects:
          - "DigitalGiving.attribution_status := ATTRIBUTED"
          - "DigitalGiving.kettle_location_id := payload kettle_location_id"
          - "DigitalGiving.attributed_cents := amount_cents"
          - "KettleLocation.location_total_cents recomputed; Campaign.total_raised_cents recomputed"
          - "increments DigitalGiving.version by 1"
      - from: ATTRIBUTED
        to: REVERSED
        trigger: "POST /api/digital-givings/{id}/reverse"
        actor: DigitalGivingProcessor
        preconditions:
          - "DigitalGiving.attribution_status == ATTRIBUTED"
          - "payload reason is a non-empty string"
        side_effects:
          - "DigitalGiving.attribution_status := REVERSED"
          - "DigitalGiving.attributed_cents := 0"
          - "DigitalGiving.reversed_reason := payload reason"
          - "KettleLocation.location_total_cents recomputed; Campaign.total_raised_cents recomputed"
          - "increments DigitalGiving.version by 1"
      - from: RECEIVED
        to: REVERSED
        trigger: "POST /api/digital-givings/{id}/reverse"
        actor: DigitalGivingProcessor
        preconditions:
          - "DigitalGiving.attribution_status == RECEIVED"
          - "payload reason is a non-empty string"
        side_effects:
          - "DigitalGiving.attribution_status := REVERSED"
          - "DigitalGiving.attributed_cents := 0"
          - "DigitalGiving.reversed_reason := payload reason"
          - "increments DigitalGiving.version by 1"

  - entity: AssistanceApplication
    initial_state: SUBMITTED
    terminal_states: [DISTRIBUTED, INELIGIBLE]
    transitions:
      - from: SUBMITTED
        to: SCREENING
        trigger: "POST /api/assistance-applications/{id}/screen"
        actor: AssistanceCaseworker
        preconditions:
          - "AssistanceApplication.eligibility_status == SUBMITTED"
          - "the owning AssistanceProgram.status == OPEN or CLOSED"
        side_effects:
          - "AssistanceApplication.eligibility_status := SCREENING"
          - "AssistanceApplication.eligibility_score recomputed per calculation assistance_eligibility_score (final variant)"
          - "increments AssistanceApplication.version by 1"
      - from: SCREENING
        to: ELIGIBLE
        trigger: "system event: screening completes with eligibility_score >= 65"
        actor: system
        preconditions:
          - "AssistanceApplication.eligibility_status == SCREENING"
          - "AssistanceApplication.eligibility_score >= 65"
          - "AssistanceProgram.accepted_application_count < AssistanceProgram.household_cap"
        side_effects:
          - "AssistanceApplication.eligibility_status := ELIGIBLE"
          - "AssistanceProgram.accepted_application_count recomputed"
          - "increments AssistanceApplication.version by 1"
      - from: SCREENING
        to: WAITLISTED
        trigger: "system event: screening completes with eligibility_score >= 65 but the program is at cap"
        actor: system
        preconditions:
          - "AssistanceApplication.eligibility_status == SCREENING"
          - "AssistanceApplication.eligibility_score >= 65"
          - "AssistanceProgram.accepted_application_count >= AssistanceProgram.household_cap"
        side_effects:
          - "AssistanceApplication.eligibility_status := WAITLISTED"
          - "increments AssistanceApplication.version by 1"
      - from: SCREENING
        to: INELIGIBLE
        trigger: "system event: screening completes with eligibility_score < 65"
        actor: system
        preconditions:
          - "AssistanceApplication.eligibility_status == SCREENING"
          - "AssistanceApplication.eligibility_score < 65"
        side_effects:
          - "AssistanceApplication.eligibility_status := INELIGIBLE"
          - "increments AssistanceApplication.version by 1"
      - from: WAITLISTED
        to: ELIGIBLE
        trigger: "system event: a seat frees in the program (another application leaves ELIGIBLE, APPROVED, DISTRIBUTION_SCHEDULED or DISTRIBUTED)"
        actor: system
        preconditions:
          - "AssistanceApplication.eligibility_status == WAITLISTED"
          - "AssistanceProgram.accepted_application_count < AssistanceProgram.household_cap"
          - "this application has the earliest created_at among WAITLISTED applications of the same program"
        side_effects:
          - "AssistanceApplication.eligibility_status := ELIGIBLE"
          - "AssistanceProgram.accepted_application_count recomputed"
          - "increments AssistanceApplication.version by 1"
      - from: ELIGIBLE
        to: APPROVED
        trigger: "POST /api/assistance-applications/{id}/approve"
        actor: AssistanceCaseworker
        preconditions:
          - "AssistanceApplication.eligibility_status == ELIGIBLE"
          - "payload distribution_site_unit_id references a Unit whose unit_type == CORPS"
        side_effects:
          - "AssistanceApplication.eligibility_status := APPROVED"
          - "AssistanceApplication.distribution_site_unit_id := payload value"
          - "increments AssistanceApplication.version by 1"
      - from: APPROVED
        to: DISTRIBUTION_SCHEDULED
        trigger: "POST /api/assistance-applications/{id}/schedule-distribution"
        actor: AssistanceCaseworker
        preconditions:
          - "AssistanceApplication.eligibility_status == APPROVED"
          - "no other AssistanceApplication with distribution_site_unit_id == the same unit has a SCHEDULED appointment whose [distribution_scheduled_at, distribution_scheduled_at + distribution_slot_minutes) interval overlaps the requested interval"
          - "payload distribution_scheduled_at >= current logical clock instant"
        side_effects:
          - "AssistanceApplication.eligibility_status := DISTRIBUTION_SCHEDULED"
          - "AssistanceApplication.distribution_status := SCHEDULED"
          - "AssistanceApplication.distribution_scheduled_at := payload value"
          - "AssistanceApplication.pickup_code := server-minted 6-character code"
          - "increments AssistanceApplication.version by 1"
      - from: DISTRIBUTION_SCHEDULED
        to: DISTRIBUTED
        trigger: "POST /api/assistance-applications/{id}/distribution/complete"
        actor: AssistanceCaseworker
        preconditions:
          - "AssistanceApplication.eligibility_status == DISTRIBUTION_SCHEDULED"
          - "payload pickup_code equals AssistanceApplication.pickup_code"
        side_effects:
          - "AssistanceApplication.eligibility_status := DISTRIBUTED"
          - "AssistanceApplication.distribution_status := COMPLETED"
          - "increments AssistanceApplication.version by 1"
      - from: DISTRIBUTION_SCHEDULED
        to: NO_SHOW
        trigger: "POST /api/assistance-applications/{id}/distribution/no-show"
        actor: AssistanceCaseworker
        preconditions:
          - "AssistanceApplication.eligibility_status == DISTRIBUTION_SCHEDULED"
          - "current logical clock instant > AssistanceApplication.distribution_scheduled_at + distribution_slot_minutes"
        side_effects:
          - "AssistanceApplication.eligibility_status := WAITLISTED"
          - "AssistanceApplication.distribution_status := NO_SHOW"
          - "AssistanceProgram.accepted_application_count recomputed"
          - "the WAITLISTED application of the same program with the earliest created_at transitions to ELIGIBLE"
          - "increments AssistanceApplication.version by 1"

  - entity: CorpsProgram
    initial_state: PLANNED
    terminal_states: [COMPLETED]
    transitions:
      - from: PLANNED
        to: ACTIVE
        trigger: "POST /api/corps-programs/{id}/enroll with at least one enrollment, or POST /api/corps-programs/{id}/activate"
        actor: ProgramDirector
        preconditions:
          - "CorpsProgram.status == PLANNED"
          - "CorpsProgram.capacity >= 1"
        side_effects:
          - "CorpsProgram.status := ACTIVE"
          - "increments CorpsProgram.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /api/corps-programs/{id}/suspend"
        actor: ProgramDirector
        preconditions:
          - "CorpsProgram.status == ACTIVE"
        side_effects:
          - "CorpsProgram.status := SUSPENDED"
          - "increments CorpsProgram.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /api/corps-programs/{id}/resume"
        actor: ProgramDirector
        preconditions:
          - "CorpsProgram.status == SUSPENDED"
        side_effects:
          - "CorpsProgram.status := ACTIVE"
          - "increments CorpsProgram.version by 1"
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /api/corps-programs/{id}/complete"
        actor: ProgramDirector
        preconditions:
          - "CorpsProgram.status == ACTIVE"
          - "CorpsProgram.waitlist_count == 0"
        side_effects:
          - "CorpsProgram.status := COMPLETED"
          - "increments CorpsProgram.version by 1"

  - entity: DisasterDeployment
    initial_state: REQUESTED
    terminal_states: [DEMOBILIZED, DENIED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /api/disaster-deployments/{id}/approve"
        actor: TerritorialCommander
        preconditions:
          - "DisasterDeployment.status == REQUESTED"
          - "Unit.canteen_pool_size - Unit.committed_canteen_count >= DisasterDeployment.requested_canteens"
        side_effects:
          - "DisasterDeployment.status := APPROVED"
          - "DisasterDeployment.assigned_canteen_count := requested_canteens"
          - "Unit.committed_canteen_count recomputed"
          - "increments DisasterDeployment.version by 1"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /api/disaster-deployments/{id}/approve with decision=DENY"
        actor: TerritorialCommander
        preconditions:
          - "DisasterDeployment.status == REQUESTED"
        side_effects:
          - "DisasterDeployment.status := DENIED"
          - "increments DisasterDeployment.version by 1"
      - from: APPROVED
        to: STAGED
        trigger: "POST /api/disaster-deployments/{id}/stage"
        actor: DisasterServicesCoordinator
        preconditions:
          - "DisasterDeployment.status == APPROVED"
        side_effects:
          - "DisasterDeployment.status := STAGED"
          - "increments DisasterDeployment.version by 1"
      - from: STAGED
        to: DEPLOYED
        trigger: "POST /api/disaster-deployments/{id}/deploy"
        actor: DisasterServicesCoordinator
        preconditions:
          - "DisasterDeployment.status == STAGED"
          - "DisasterDeployment.assigned_canteen_count >= 1"
        side_effects:
          - "DisasterDeployment.status := DEPLOYED"
          - "DisasterDeployment.deployed_at := current logical clock instant"
          - "increments DisasterDeployment.version by 1"
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /api/disaster-deployments/{id}/cancel"
        actor: TerritorialCommander
        preconditions:
          - "DisasterDeployment.status == APPROVED"
        side_effects:
          - "DisasterDeployment.status := CANCELLED"
          - "DisasterDeployment.assigned_canteen_count := 0"
          - "Unit.committed_canteen_count recomputed"
          - "increments DisasterDeployment.version by 1"
      - from: STAGED
        to: CANCELLED
        trigger: "POST /api/disaster-deployments/{id}/cancel"
        actor: TerritorialCommander
        preconditions:
          - "DisasterDeployment.status == STAGED"
        side_effects:
          - "DisasterDeployment.status := CANCELLED"
          - "DisasterDeployment.assigned_canteen_count := 0"
          - "Unit.committed_canteen_count recomputed"
          - "increments DisasterDeployment.version by 1"
      - from: DEPLOYED
        to: DEMOBILIZED
        trigger: "POST /api/disaster-deployments/{id}/demobilize"
        actor: DisasterServicesCoordinator
        preconditions:
          - "DisasterDeployment.status == DEPLOYED"
          - "payload demobilized_at >= DisasterDeployment.deployed_at"
        side_effects:
          - "DisasterDeployment.status := DEMOBILIZED"
          - "DisasterDeployment.demobilized_at := payload value"
          - "DisasterDeployment.assigned_canteen_count := 0"
          - "Unit.committed_canteen_count recomputed"
          - "DisasterDeployment.deployment_cost_cents recomputed per calculation canteen_deployment_cost"
          - "increments DisasterDeployment.version by 1"

  - entity: ReallocationDecision
    initial_state: PROPOSED
    terminal_states: [APPLIED, REJECTED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /api/reallocation-decisions/{id}/approve"
        actor: TerritorialCommander
        preconditions:
          - "ReallocationDecision.status == PROPOSED"
          - "ReallocationDecision.from_location_id != ReallocationDecision.to_location_id"
          - "the target KettleLocation.status == ACTIVE"
        side_effects:
          - "ReallocationDecision.status := APPROVED"
          - "ReallocationDecision.expected_lift_cents recomputed and frozen per calculation reallocation_expected_lift"
          - "increments ReallocationDecision.version by 1"
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /api/reallocation-decisions/{id}/reject"
        actor: TerritorialCommander
        preconditions:
          - "ReallocationDecision.status == PROPOSED"
        side_effects:
          - "ReallocationDecision.status := REJECTED"
          - "increments ReallocationDecision.version by 1"
      - from: APPROVED
        to: PROPOSED
        trigger: "POST /api/reallocation-decisions/{id}/revise"
        actor: KettleCoordinator
        preconditions:
          - "ReallocationDecision.status == APPROVED"
          - "payload moved_hours > 0"
        side_effects:
          - "ReallocationDecision.status := PROPOSED"
          - "ReallocationDecision.moved_hours := payload value"
          - "increments ReallocationDecision.version by 1"
      - from: APPROVED
        to: APPLIED
        trigger: "POST /api/reallocation-decisions/{id}/apply"
        actor: KettleCoordinator
        preconditions:
          - "ReallocationDecision.status == APPROVED"
          - "current logical clock instant >= ReallocationDecision.effective_on"
          - "ReallocationDecision.moved_hours <= the source location's remaining scheduled hours for the campaign"
        side_effects:
          - "ReallocationDecision.status := APPLIED"
          - "ReallocationDecision.applied_at := current logical clock instant"
          - "the source KettleLocation.daily_required_minutes is reduced by moved_hours * 60 and the target KettleLocation.daily_required_minutes is increased by the same amount"
          - "both locations' performance_tier recomputed per calculation location_performance_index"
          - "increments ReallocationDecision.version by 1"

concurrency_rules:
  - rule_id: shift-create-stale-location
    parent_entity: KettleLocation
    write_endpoint: "POST /api/shifts"
    occ_field: "expected_kettle_location_version"
    description: |
      Creating a Shift against a KettleLocation whose version has advanced since
      the client last read it is rejected, because the location's posture,
      placement window or staffing expectations may have changed underneath the
      scheduler's view.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: collection-verify-stale-collection
    parent_entity: KettleCollection
    write_endpoint: "POST /api/kettle-collections/{id}/verify"
    occ_field: "expected_kettle_collection_version"
    description: |
      Verifying a teller count against a KettleCollection whose version has
      advanced since the client last read it is rejected, because a recount or
      deposit may already have moved the row.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: application-schedule-stale-application
    parent_entity: AssistanceApplication
    write_endpoint: "POST /api/assistance-applications/{id}/schedule-distribution"
    occ_field: "expected_assistance_application_version"
    description: |
      Scheduling a distribution appointment for an AssistanceApplication whose
      version has advanced since the caseworker last read it is rejected,
      because a prior screening or approval decision may have changed the
      application's posture.
    error_id: ERR_STALE_VERSION
    http_status: 412

calculations:
  - name: kettle_collection_variance
    trigger: "POST /api/kettle-collections/{id}/verify (provisional variant) and POST /api/kettle-collections/{id}/reconcile (final variant)"
    algorithm: dual_variant
    formula: |
      counted_total_cents = coin_cents + currency_cents + check_cents
      # PROVISIONAL variant — evaluated at VERIFY against the ringer's declared slip
      variance_cents = counted_total_cents - declared_cents
      # FINAL variant — evaluated at RECONCILE against the bank-confirmed deposit
      variance_cents = deposited_cents - (counted_total_cents - handling_fee_cents)
    input_set: "one KettleCollection row; the PROVISIONAL variant reads declared_cents, the FINAL variant reads deposited_cents and handling_fee_cents"
    constants:
      VARIANCE_TOLERANCE_CENTS: 500
    precision: "integer cents, exact; no rounding"
    variants:
      - name: provisional
        when: "evaluated when deposit_status moves SUBMITTED -> VERIFIED or SUBMITTED -> VARIANCE_HOLD"
        difference: "compares the teller count against the bell ringer's declared slip amount; a ringer who under-declares produces a positive variance even when the bank deposit matches exactly"
      - name: final
        when: "evaluated when deposit_status moves DEPOSITED -> RECONCILED"
        difference: "compares the bank-confirmed deposit against the counted total net of the roll handling fee; identical input data yields a different number than the provisional variant because handling_fee_cents is deducted and deposited_cents replaces declared_cents"

  - name: assistance_eligibility_score
    trigger: "POST /api/assistance-applications (provisional variant) and POST /api/assistance-applications/{id}/screen (final variant)"
    algorithm: dual_variant
    formula: |
      # PROVISIONAL variant — self-reported income, no deductions
      income_per_member_cents = floor(annual_income_cents / household_size)
      provisional_score = clamp(100 - floor(income_per_member_cents / 20000), 0, 100)
      # FINAL variant — verified income with a per-member asset deduction
      adjusted_income_cents = max(0, verified_income_cents - (ASSET_DEDUCTION_CENTS * household_size))
      income_per_member_cents = floor(adjusted_income_cents / household_size)
      eligibility_score = clamp(100 - floor(income_per_member_cents / 20000), 0, 100)
      eligible = eligibility_score >= ELIGIBILITY_THRESHOLD
    input_set: "one AssistanceApplication row plus its AssistanceProgram; INELIGIBLE and DISTRIBUTED applications are excluded from re-scoring"
    constants:
      ASSET_DEDUCTION_CENTS: 150000
      INCOME_DIVISOR_CENTS: 20000
      ELIGIBILITY_THRESHOLD: 65
    precision: "integer score 0..100; floor division, no rounding"
    variants:
      - name: provisional
        when: "computed at intake on POST /api/assistance-applications"
        difference: "uses the self-reported annual_income_cents and applies no asset deduction, so a household can score below the threshold at intake"
      - name: final
        when: "computed at screening on POST /api/assistance-applications/{id}/screen"
        difference: "uses caseworker-verified verified_income_cents and subtracts ASSET_DEDUCTION_CENTS per household member before dividing, so the same household can score above the threshold at screening"

  - name: location_performance_index
    trigger: "recomputed on Shift COMPLETED, Shift CANCELLED, KettleCollection VARIANCE_HOLD, and POST /api/reallocation-decisions/{id}/apply"
    algorithm: threshold
    formula: |
      covered_hours = floor(covered_minutes / 60)
      cents_per_hour = floor(location_total_cents / max(covered_hours, 1))
      disruption_count = cancelled_shift_count + no_show_shift_count
      disruption_rate_pct = floor(100 * disruption_count / max(completed_shift_count + disruption_count, 1))
      performance_index = floor(cents_per_hour * (100 - disruption_rate_pct) / 100)
      tier:
        if covered_hours < MIN_RATED_HOURS: UNRATED
        elif cents_per_hour < BRONZE_MAX_CENTS_PER_HOUR: BRONZE
        elif cents_per_hour < SILVER_MAX_CENTS_PER_HOUR: SILVER
        elif cents_per_hour < GOLD_MAX_CENTS_PER_HOUR: GOLD
        else: PLATINUM
      # conditional downgrade: a high disruption rate demotes one tier
      if tier != UNRATED and performance_index < DEMOTION_INDEX_FLOOR: tier := one step below tier
    input_set: "one KettleLocation row; Shift rows with kettle_location_id equal to it and status in {COMPLETED, CANCELLED, NO_SHOW}; KettleCollection rows with deposit_status in {DEPOSITED, RECONCILED}"
    constants:
      MIN_RATED_HOURS: 8
      BRONZE_MAX_CENTS_PER_HOUR: 4000
      SILVER_MAX_CENTS_PER_HOUR: 8000
      GOLD_MAX_CENTS_PER_HOUR: 12000
      DEMOTION_INDEX_FLOOR: 2000
    precision: "integer cents per hour and integer index; floor division"
    variants: []

  - name: deposit_denomination_split
    trigger: "POST /api/kettle-collections/{id}/verify"
    algorithm: aggregation
    formula: |
      # denomination split of the counted coin, largest denomination first
      quarters_cents = floor(coin_cents * 40 / 100)
      dimes_cents    = floor(coin_cents * 30 / 100)
      nickels_cents  = floor(coin_cents * 20 / 100)
      pennies_cents  = coin_cents - quarters_cents - dimes_cents - nickels_cents
      # rolls per denomination, then fee PER DENOMINATION (rounded down) and summed
      rolls_q = floor(quarters_cents / ROLL_QUARTER_CENTS); fee_q = floor(rolls_q * FEE_MILLS_PER_ROLL / 10)
      rolls_d = floor(dimes_cents   / ROLL_DIME_CENTS);    fee_d = floor(rolls_d * FEE_MILLS_PER_ROLL / 10)
      rolls_n = floor(nickels_cents / ROLL_NICKEL_CENTS);  fee_n = floor(rolls_n * FEE_MILLS_PER_ROLL / 10)
      rolls_p = floor(pennies_cents / ROLL_PENNY_CENTS);   fee_p = floor(rolls_p * FEE_MILLS_PER_ROLL / 10)
      fee_currency = floor(currency_cents * CURRENCY_FEE_PER_MILLE / 1000)
      fee_check    = floor(check_cents    * CHECK_FEE_PER_MILLE    / 1000)
      handling_fee_cents = fee_q + fee_d + fee_n + fee_p + fee_currency + fee_check
    input_set: "one KettleCollection row at the instant of verification; coin_cents, currency_cents and check_cents are the teller's counts"
    constants:
      ROLL_QUARTER_CENTS: 1000
      ROLL_DIME_CENTS: 500
      ROLL_NICKEL_CENTS: 200
      ROLL_PENNY_CENTS: 50
      FEE_MILLS_PER_ROLL: 12
      CURRENCY_FEE_PER_MILLE: 5
      CHECK_FEE_PER_MILLE: 8
    precision: "integer cents; every per-denomination fee is floored BEFORE summing, and the sum is NOT re-rounded"
    variants:
      - name: sum_then_round
        when: "explicitly NOT used — recorded so the rounding order is unambiguous"
        difference: "summing the un-rounded per-denomination fees and flooring once can differ by up to 5 cents from the pinned per-denomination-then-sum order; the scaffold pins per-denomination floor then sum"

  - name: shift_paid_amount
    trigger: "POST /api/shifts/{id}/complete"
    algorithm: threshold
    formula: |
      duration_minutes = (ends_at - starts_at) in minutes
      paid_minutes = max(0, duration_minutes - break_minutes)
      base_minutes = min(paid_minutes, OVERTIME_AFTER_MINUTES)   # 420 minutes = 7 hours
      overtime_minutes = max(0, paid_minutes - OVERTIME_AFTER_MINUTES)
      paid_hours = round_half_up(paid_minutes / 60, 2)
      paid_amount_cents = round_half_up((base_minutes / 60) * hourly_rate_cents
                                        + (overtime_minutes / 60) * hourly_rate_cents * OVERTIME_MULTIPLIER, 0)
    input_set: "one Shift row in status CHECKED_IN plus its BellRinger.hourly_rate_cents; a VOLUNTEER ringer has hourly_rate_cents 0 so paid_amount_cents is 0"
    constants:
      OVERTIME_AFTER_MINUTES: 420
      OVERTIME_MULTIPLIER: 1.5
      MAX_SHIFT_MINUTES: 480
    precision: "paid_hours 2 decimal places round_half_up; paid_amount_cents integer round_half_up"
    variants: []

  - name: campaign_total_raised
    trigger: "POST /api/kettle-collections/{id}/deposit, POST /api/kettle-collections/{id}/reconcile, POST /api/digital-givings/{id}/attribute, POST /api/digital-givings/{id}/reverse"
    algorithm: aggregation
    formula: |
      collections_total_cents = sum(counted_total_cents) over KettleCollection rows
          whose kettle_location_id belongs to a KettleLocation with campaign_id == C.id
          and whose deposit_status IN {DEPOSITED, RECONCILED}
      digital_total_cents = sum(attributed_cents) over DigitalGiving rows
          with campaign_id == C.id and attribution_status == ATTRIBUTED
      total_raised_cents = collections_total_cents + digital_total_cents
    input_set: "KettleCollection rows with deposit_status IN {DEPOSITED, RECONCILED} (SUBMITTED, VERIFIED and VARIANCE_HOLD are excluded); DigitalGiving rows with attribution_status == ATTRIBUTED (RECEIVED, UNATTRIBUTED and REVERSED are excluded)"
    constants:
      COUNTED_STATUSES: ["DEPOSITED", "RECONCILED"]
      COUNTED_ATTRIBUTION_STATUSES: ["ATTRIBUTED"]
    precision: "integer cents, exact; the roll handling fee is NOT deducted from the raised total"
    variants: []

  - name: bell_ringer_reliability_score
    trigger: "POST /api/shifts/{id}/complete, POST /api/shifts/{id}/cancel on a CONFIRMED shift, POST /api/shifts/{id}/no-show"
    algorithm: weighted_scoring
    formula: |
      score = BASE_SCORE
            + COMPLETED_COUNT      * COMPLETED_DELTA
            + LATE_CANCEL_COUNT    * LATE_CANCEL_DELTA
            + NO_SHOW_COUNT        * NO_SHOW_DELTA
      reliability_score = clamp(score, SCORE_FLOOR, SCORE_CEILING)
    input_set: "one BellRinger row; Shift rows with bell_ringer_id equal to it: COMPLETED shifts count as completed, CANCELLED shifts whose previous status was CONFIRMED count as late cancellations, NO_SHOW shifts count as no-shows; SCHEDULED and CANCELLED-from-SCHEDULED shifts are excluded"
    constants:
      BASE_SCORE: 100
      COMPLETED_DELTA: 1
      LATE_CANCEL_DELTA: -5
      NO_SHOW_DELTA: -15
      SCORE_FLOOR: 0
      SCORE_CEILING: 100
      SUSPENSION_THRESHOLD: 60
    precision: "integer score; clamped after summation"
    variants: []

  - name: reallocation_expected_lift
    trigger: "POST /api/reallocation-decisions (proposal preview) and POST /api/reallocation-decisions/{id}/approve (frozen value)"
    algorithm: combinatorial
    formula: |
      # evaluation order is pinned: both cents_per_hour values are read from the
      # pre-apply state, BEFORE daily_required_minutes is mutated by /apply
      source_cph = KettleLocation(from_location_id).cents_per_hour
      target_cph = KettleLocation(to_location_id).cents_per_hour
      expected_lift_cents = round_half_up(moved_hours * max(0, target_cph - source_cph), 0)
    input_set: "one ReallocationDecision row plus the two referenced KettleLocation rows read at their pre-apply values"
    constants:
      MIN_LIFT_CENTS: 0
    precision: "integer cents round_half_up; the value is frozen at APPROVED and is NOT recomputed by /apply"
    variants:
      - name: post_apply_recompute
        when: "explicitly NOT used — recorded so the evaluation order is unambiguous"
        difference: "recomputing after /apply reads the mutated daily_required_minutes of both locations and can produce a different, circular-looking number; the scaffold pins the pre-apply evaluation"

  - name: canteen_deployment_cost
    trigger: "POST /api/disaster-deployments/{id}/demobilize and any read of GET /api/disaster-deployments/{id}"
    algorithm: tiered_pricing
    formula: |
      if demobilized_at is set: billed_days = ceil((demobilized_at - deployed_at) / 86400 seconds)
      else:                     billed_days = ceil((current logical clock instant - deployed_at) / 86400 seconds)
      base_rate_cents = DAILY_RATE[incident_command_level]
      regular_days = min(billed_days, REGULAR_DAY_LIMIT)
      surge_days   = max(0, billed_days - REGULAR_DAY_LIMIT)
      deployment_cost_cents = round_half_up(assigned_canteen_count *
          (regular_days * base_rate_cents + surge_days * base_rate_cents * SURGE_MULTIPLIER), 0)
    input_set: "one DisasterDeployment row in status APPROVED, STAGED, DEPLOYED or DEMOBILIZED; DENIED and CANCELLED deployments cost 0"
    constants:
      DAILY_RATE_TYPE_1_CENTS: 95000
      DAILY_RATE_TYPE_2_CENTS: 72000
      DAILY_RATE_TYPE_3_CENTS: 48000
      DAILY_RATE_TYPE_4_CENTS: 30000
      DAILY_RATE_TYPE_5_CENTS: 18000
      REGULAR_DAY_LIMIT: 14
      SURGE_MULTIPLIER: 0.6
    precision: "integer cents round_half_up; marginal surge days are billed at 60% of the base rate"
    variants: []

  - name: program_capacity_allocation
    trigger: "POST /api/corps-programs/{id}/enroll, POST /api/corps-programs/{id}/withdraw"
    algorithm: waterfall_allocation
    formula: |
      entries = CorpsProgram.enrollment_log ordered by (enrolled_at ASC, participant_name ASC)
      enrolled_count = min(count(entries), capacity)
      waitlist_count = max(0, count(entries) - capacity)
      # the first `capacity` entries hold seats; the remainder are WAITLISTED
      # on withdraw: the withdrawn entry is removed, then the earliest WAITLISTED
      # entry (enrolled_at ASC, participant_name ASC) is promoted into the freed seat
    input_set: "the CorpsProgram.enrollment_log entries in state ENROLLED or WAITLISTED; withdrawn entries are removed from the log"
    constants:
      SEAT_ASSIGNMENT_ORDER: "enrolled_at ASC, then participant_name ASC"
    precision: "integer counts; the order is total because enrolled_at and participant_name cannot both tie for two distinct entries"
    variants: []

  - name: digital_giving_attribution_selector
    trigger: "POST /api/digital-givings/{id}/attribute when the payload omits kettle_location_id"
    algorithm: selector_ranking
    formula: |
      candidates = KettleLocation rows where
          campaign_id == DigitalGiving.campaign_id
          AND the Unit referenced by DigitalGiving.unit_id is the location's host site's campaign owner unit
          AND status == ACTIVE
          AND the HostSite referenced by host_site_id has permission_status == APPROVED
      ranking = covered_minutes DESC, then created_at ASC
      selected = candidates[0] after ranking
      if candidates is empty: reject with ERR_NO_ELIGIBLE_LOCATION and leave attribution_status UNATTRIBUTED
    input_set: "KettleLocation rows in status ACTIVE whose host site permission_status == APPROVED; DRAFT, SUSPENDED and CLOSED locations are excluded"
    constants:
      RANKING_KEY: "covered_minutes DESC"
      TIE_BREAK: "created_at ASC"
      EMPTY_POOL_BEHAVIOR: "ERR_NO_ELIGIBLE_LOCATION"
    precision: "integer ranking key; ties resolved by created_at, never by id"
    variants: []

  - name: shift_auto_assign_selector
    trigger: "POST /api/shifts/auto-assign"
    algorithm: selector_ranking
    formula: |
      candidates = BellRinger rows where
          engagement_status == ACTIVE
          AND screening_status == CLEARED
          AND screening_expires_at > requested starts_at
          AND no Shift with bell_ringer_id == the ringer has status in {SCHEDULED, CONFIRMED, CHECKED_IN}
              overlapping [starts_at, ends_at)
          AND no Shift with bell_ringer_id == the ringer has an adjacent boundary within REST_BUFFER_MINUTES
      ranking = reliability_score DESC, then scheduled_hours ASC, then created_at ASC
      selected = candidates[0] after ranking
      if candidates is empty: reject with ERR_NO_ELIGIBLE_RINGER and create no Shift
    input_set: "BellRinger rows with engagement_status ACTIVE and screening_status CLEARED whose screening_expires_at is later than the requested start; ringers with SEPARATED or SUSPENDED engagement, or with EXPIRED, FAILED, PENDING or NOT_STARTED screening, are excluded"
    constants:
      RANKING_KEY: "reliability_score DESC"
      TIE_BREAK_1: "scheduled_hours ASC"
      TIE_BREAK_2: "created_at ASC"
      REST_BUFFER_MINUTES: 30
      EMPTY_POOL_BEHAVIOR: "ERR_NO_ELIGIBLE_RINGER"
    precision: "integer ranking key; ties resolved by scheduled_hours then created_at, never by id"
    variants: []

  - name: shift_coverage_gap
    trigger: "GET /api/kettle-locations/{id}/performance and the reallocation target eligibility check"
    algorithm: threshold
    formula: |
      covered_minutes_for_date = sum of shift durations in minutes for KettleLocation.id on the evaluated date
          over Shift rows with status == COMPLETED
      coverage_pct = floor(100 * covered_minutes_for_date / max(KettleLocation.daily_required_minutes, 1))
      understaffed = coverage_pct < UNDERSTAFFED_THRESHOLD_PCT
    input_set: "Shift rows with status == COMPLETED for the location on the evaluated date; SCHEDULED, CONFIRMED, CHECKED_IN, CANCELLED and NO_SHOW shifts are excluded"
    constants:
      UNDERSTAFFED_THRESHOLD_PCT: 80
    precision: "integer percentage, floor division; a coverage of exactly 80 percent is NOT understaffed"
    variants: []

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "X-User-Role names a role declared in the RBAC matrix"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 3
    category: auth
    check: "the role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 4
    category: auth
    check: "when the role is entity_backed, X-User-ID equals the id of an existing instance of the backing entity, and for owner-scoped reads it equals the resource's owning foreign key"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /api/bell-ringers/{id}/screenings, POST /api/bell-ringers/{id}/screenings/complete, POST /api/shifts/{id}/check-in, GET /api/host-sites/{id}, GET /api/kettle-locations/{id}"
  - priority: 5
    category: business_constraint
    check: "request-shape check: the body carries every required input field declared for the endpoint and every supplied value matches its declared type; this precedes resource checks because a malformed body cannot be attributed to a resource"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with required body inputs"
  - priority: 6
    category: existence
    check: "the resource addressed by the path id exists"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "every endpoint with a path id"
  - priority: 7
    category: existence
    check: "every referenced parent resource in the path exists, validated left-to-right"
    error_id: ERR_PARENT_NOT_FOUND
    http_status: 404
    applies_to: "POST /api/bell-ringers/{id}/screenings, POST /api/bell-ringers/{id}/screenings/complete, POST /api/shifts/{id}/check-in, POST /api/corps-programs/{id}/enroll, POST /api/corps-programs/{id}/withdraw"
  - priority: 8
    category: business_referential
    check: "every body foreign key resolves to an existing row"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    applies_to: "POST /api/host-sites, POST /api/kettle-locations, POST /api/bell-ringers, POST /api/shifts, POST /api/kettle-collections, POST /api/digital-givings, POST /api/assistance-programs, POST /api/assistance-applications, POST /api/corps-programs, POST /api/disaster-deployments, POST /api/reallocation-decisions"
  - priority: 9
    category: business_referential
    check: "every body foreign key belongs to the same campaign or unit scope as the target resource (no cross-campaign or cross-unit references)"
    error_id: ERR_REFERENCE_SCOPE_MISMATCH
    http_status: 409
    applies_to: "POST /api/kettle-locations, POST /api/shifts, POST /api/kettle-collections, POST /api/digital-givings, POST /api/reallocation-decisions, POST /api/assistance-applications"
  - priority: 10
    category: state
    check: "the target resource is in a state that permits the requested operation"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "every action endpoint"
  - priority: 11
    category: state
    check: "the target resource is not in a terminal state"
    error_id: ERR_ALREADY_TERMINAL
    http_status: 409
    applies_to: "every action endpoint whose entity declares terminal_states"
  - priority: 12
    category: state
    check: "the owning Campaign.status == ACTIVE for any write to a campaign-scoped resource"
    error_id: ERR_CAMPAIGN_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /api/kettle-locations/{id}/activate, POST /api/shifts, POST /api/kettle-collections, POST /api/digital-givings, POST /api/reallocation-decisions/{id}/apply"
  - priority: 13
    category: state
    check: "the HostSite referenced by host_site_id has permission_status == APPROVED"
    error_id: ERR_HOST_SITE_NOT_PERMITTED
    http_status: 409
    applies_to: "POST /api/kettle-locations/{id}/activate, POST /api/shifts, POST /api/digital-givings/{id}/attribute"
  - priority: 14
    category: state
    check: "the KettleLocation referenced by kettle_location_id has status == ACTIVE"
    error_id: ERR_LOCATION_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /api/shifts, POST /api/kettle-collections, POST /api/digital-givings/{id}/attribute, POST /api/shifts/{id}/confirm, POST /api/shifts/{id}/rebook"
  - priority: 15
    category: state
    check: "the BellRinger referenced by bell_ringer_id has screening_status == CLEARED and screening_expires_at later than the shift start"
    error_id: ERR_SCREENING_NOT_CLEARED
    http_status: 409
    applies_to: "POST /api/shifts, POST /api/shifts/{id}/confirm, POST /api/shifts/{id}/rebook"
  - priority: 16
    category: state
    check: "the BellRinger referenced by bell_ringer_id has engagement_status == ACTIVE"
    error_id: ERR_RINGER_INACTIVE
    http_status: 409
    applies_to: "POST /api/shifts, POST /api/shifts/{id}/confirm, POST /api/shifts/{id}/rebook"
  - priority: 17
    category: state
    check: "the AssistanceProgram referenced by program_id has status == OPEN"
    error_id: ERR_INTAKE_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /api/assistance-applications"
  - priority: 18
    category: business_safety
    check: "shift duration (ends_at - starts_at) <= MAX_SHIFT_MINUTES; a duration of exactly 480 minutes is accepted, 481 is rejected"
    error_id: ERR_SHIFT_TOO_LONG
    http_status: 422
    applies_to: "POST /api/shifts, POST /api/shifts/{id}/rebook"
  - priority: 19
    category: business_safety
    check: "the gap between a ringer's consecutive shifts is >= REST_BUFFER_MINUTES; shifts separated by exactly the buffer are accepted, one minute less is rejected"
    error_id: ERR_RINGER_REST_BUFFER_VIOLATION
    http_status: 409
    applies_to: "POST /api/shifts, POST /api/shifts/{id}/rebook"
  - priority: 20
    category: business_safety
    check: "a ringer whose age at the shift start is under 18 may not be scheduled to end after MINOR_CURFEW_HOUR_LOCAL"
    error_id: ERR_MINOR_CURFEW_VIOLATION
    http_status: 422
    applies_to: "POST /api/shifts, POST /api/shifts/{id}/rebook"
  - priority: 21
    category: business_safety
    check: "a disaster deployment may not commit more canteens than the unit's uncommitted pool"
    error_id: ERR_CANTEEN_UNAVAILABLE
    http_status: 409
    applies_to: "POST /api/disaster-deployments/{id}/approve"
  - priority: 22
    category: business_constraint
    check: "no Shift for the same bell_ringer_id overlaps the requested [starts_at, ends_at) interval"
    error_id: ERR_SHIFT_OVERLAP
    http_status: 409
    applies_to: "POST /api/shifts, POST /api/shifts/{id}/rebook"
  - priority: 23
    category: business_constraint
    check: "the KettleLocation placement window is fully contained in the host site permission window (placement_starts_on >= permission_starts_on and placement_ends_on <= permission_ends_on)"
    error_id: ERR_PLACEMENT_WINDOW_OUTSIDE_PERMISSION
    http_status: 422
    applies_to: "POST /api/kettle-locations, POST /api/kettle-locations/{id}/activate"
  - priority: 24
    category: business_constraint
    check: "when a HostSite has exclusivity_scope == EXCLUSIVE, no second KettleLocation at the same retailer_name and store_number may hold an overlapping placement window; intervals that merely touch are also rejected for EXCLUSIVE sites"
    error_id: ERR_EXCLUSIVITY_CONFLICT
    http_status: 409
    applies_to: "POST /api/kettle-locations, POST /api/kettle-locations/{id}/activate"
  - priority: 25
    category: business_constraint
    check: "the number of KettleLocation rows for a host site in status ACTIVE or SUSPENDED is below HostSite.max_kettles"
    error_id: ERR_KETTLE_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /api/kettle-locations/{id}/activate"
  - priority: 26
    category: business_constraint
    check: "location_code is unique among KettleLocation rows of the same campaign_id"
    error_id: ERR_DUPLICATE_LOCATION_CODE
    http_status: 409
    applies_to: "POST /api/kettle-locations"
  - priority: 27
    category: business_constraint
    check: "external_ref is unique among DigitalGiving rows of the same campaign_id"
    error_id: ERR_DUPLICATE_EXTERNAL_REF
    http_status: 409
    applies_to: "POST /api/digital-givings"
  - priority: 28
    category: business_constraint
    check: "the number of applications in status ELIGIBLE, APPROVED, DISTRIBUTION_SCHEDULED or DISTRIBUTED is below the program's household_cap"
    error_id: ERR_PROGRAM_INTAKE_FULL
    http_status: 409
    applies_to: "POST /api/assistance-applications/{id}/screen"
  - priority: 29
    category: business_constraint
    check: "household_size is between 1 and 12 inclusive"
    error_id: ERR_HOUSEHOLD_SIZE_INVALID
    http_status: 422
    applies_to: "POST /api/assistance-applications"
  - priority: 30
    category: business_constraint
    check: "a CorpsProgram enrollment is rejected with ERR_PROGRAM_AT_CAPACITY only when waitlist_enabled is false; when waitlist_enabled is true the enrollment is waitlisted instead"
    error_id: ERR_PROGRAM_AT_CAPACITY
    http_status: 409
    applies_to: "POST /api/corps-programs/{id}/enroll"
  - priority: 31
    category: business_temporal
    check: "DigitalGiving.occurred_at falls inside the owning campaign's [starts_on, ends_on] window; both endpoints are inclusive"
    error_id: ERR_GIVING_OUTSIDE_CAMPAIGN_WINDOW
    http_status: 422
    applies_to: "POST /api/digital-givings"
  - priority: 32
    category: business_temporal
    check: "the current logical clock instant falls inside the program's [intake_opens_on, intake_closes_on] window; both endpoints are inclusive"
    error_id: ERR_OUTSIDE_INTAKE_WINDOW
    http_status: 409
    applies_to: "POST /api/assistance-applications"
  - priority: 33
    category: business_temporal
    check: "KettleCollection.collected_on falls inside the KettleLocation's [placement_starts_on, placement_ends_on] window; both endpoints are inclusive"
    error_id: ERR_COLLECTION_OUTSIDE_PLACEMENT_WINDOW
    http_status: 422
    applies_to: "POST /api/kettle-collections"
  - priority: 34
    category: business_temporal
    check: "a distribution appointment interval does not overlap another SCHEDULED appointment at the same distribution_site_unit_id; adjacent appointments are accepted, overlapping ones are rejected"
    error_id: ERR_DISTRIBUTION_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /api/assistance-applications/{id}/schedule-distribution"
  - priority: 35
    category: business_temporal
    check: "ReallocationDecision.effective_on falls inside the owning campaign window and is not earlier than the current logical clock instant at approval time"
    error_id: ERR_REALLOCATION_WINDOW_INVALID
    http_status: 422
    applies_to: "POST /api/reallocation-decisions, POST /api/reallocation-decisions/{id}/approve"
  - priority: 36
    category: business_fiscal
    check: "a bank-confirmed amount that differs from deposited_cents by more than VARIANCE_TOLERANCE_CENTS is rejected; a difference of exactly 500 cents reconciles, 501 is rejected"
    error_id: ERR_VARIANCE_EXCEEDS_TOLERANCE
    http_status: 409
    applies_to: "POST /api/kettle-collections/{id}/reconcile"
  - priority: 37
    category: business_fiscal
    check: "the deposit amount equals counted_total_cents minus handling_fee_cents"
    error_id: ERR_DEPOSIT_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /api/kettle-collections/{id}/deposit"
  - priority: 38
    category: business_fiscal
    check: "a PAID_SEASONAL shift whose paid_amount_cents would push Campaign.labor_committed_cents above Campaign.labor_budget_cents is rejected"
    error_id: ERR_LABOR_BUDGET_EXCEEDED
    http_status: 409
    applies_to: "POST /api/shifts/{id}/complete"
  - priority: 39
    category: business_fiscal
    check: "DigitalGiving.amount_cents is greater than 0 and at most MAX_DIGITAL_GIFT_CENTS"
    error_id: ERR_INVALID_GIFT_AMOUNT
    http_status: 422
    applies_to: "POST /api/digital-givings"
  - priority: 40
    category: business_fiscal
    check: "ReallocationDecision.moved_hours does not exceed the source location's remaining scheduled hours for the campaign"
    error_id: ERR_REALLOCATION_HOURS_EXCEED_SOURCE
    http_status: 409
    applies_to: "POST /api/reallocation-decisions/{id}/apply"
  - priority: 41
    category: business_fiscal
    check: "the sum of a household's assistance value does not exceed the program's per_household_limit_cents"
    error_id: ERR_HOUSEHOLD_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /api/assistance-applications/{id}/approve"

endpoints:
  - method: POST
    path: "/api/units"
    description: "create an organizational unit (corps, division, area command or territory)"
    roles: [PlatformAdmin, TerritorialCommander]
    code: 201
    input:
      - "name"
      - "unit_type"
      - "parent_unit_id?"
      - "territory_code"
      - "canteen_pool_size?"
    output: Unit
    side_effects: ["Unit.oversight_level computed from the parent chain"]
  - method: GET
    path: "/api/units"
    description: "list units filtered by type, parent or territory code"
    roles: [PlatformAdmin, TerritorialCommander, DivisionalOfficer, CorpsOfficer, ProgramDirector, DisasterServicesCoordinator]
    code: 200
    input:
      - "unit_type?"
      - "parent_unit_id?"
      - "territory_code?"
      - "limit?"
      - "offset?"
    output: Unit[]
    side_effects: []
  - method: GET
    path: "/api/units/{id}"
    description: "read one unit"
    roles: [PlatformAdmin, TerritorialCommander, DivisionalOfficer, CorpsOfficer, ProgramDirector, DisasterServicesCoordinator, AssistanceCaseworker]
    code: 200
    input: []
    output: Unit
    side_effects: []
  - method: POST
    path: "/api/campaigns"
    description: "create a seasonal kettle campaign in PLANNING"
    roles: [PlatformAdmin, TerritorialCommander]
    code: 201
    input:
      - "name"
      - "season_year"
      - "starts_on"
      - "ends_on"
      - "goal_cents"
      - "labor_budget_cents?"
    output: Campaign
    side_effects: []
  - method: GET
    path: "/api/campaigns"
    description: "list campaigns filtered by status or season year"
    roles: [PlatformAdmin, TerritorialCommander, DivisionalOfficer, CorpsOfficer, KettleCoordinator, FinanceOfficer, DigitalGivingProcessor, AssistanceCaseworker, HostSiteManager]
    code: 200
    input:
      - "status?"
      - "season_year?"
      - "limit?"
      - "offset?"
    output: Campaign[]
    side_effects: []
  - method: GET
    path: "/api/campaigns/{id}"
    description: "read one campaign; also evaluates the automatic ACTIVE -> CLOSED clock transition"
    roles: [PlatformAdmin, TerritorialCommander, DivisionalOfficer, CorpsOfficer, KettleCoordinator, FinanceOfficer, DigitalGivingProcessor, AssistanceCaseworker, HostSiteManager]
    code: 200
    input: []
    output: Campaign
    side_effects: ["may transition Campaign ACTIVE -> CLOSED when the logical clock has passed ends_on"]
  - method: POST
    path: "/api/campaigns/{id}/activate"
    description: "move a campaign from PLANNING to ACTIVE once at least one host site is approved"
    roles: [TerritorialCommander]
    code: 200
    input:
      - "expected_campaign_version"
    output: Campaign
    side_effects: ["Campaign.status := ACTIVE", "increments Campaign.version by 1"]
  - method: GET
    path: "/api/campaigns/{id}/summary"
    description: "computed campaign rollup: reconciled totals, attainment and labor commitment"
    roles: [PlatformAdmin, TerritorialCommander, DivisionalOfficer, FinanceOfficer, KettleCoordinator]
    code: 200
    input: []
    output: { campaign_id: string, status: string, goal_cents: integer, total_raised_cents: integer, collections_counted_cents: integer, digital_attributed_cents: integer, attainment_pct: integer, active_location_count: integer, labor_committed_cents: integer, labor_budget_cents: integer }
    side_effects: []
  - method: POST
    path: "/api/host-sites"
    description: "record a negotiated retail host site permission in PENDING"
    roles: [KettleCoordinator, PlatformAdmin]
    code: 201
    input:
      - "campaign_id"
      - "retailer_name"
      - "store_number"
      - "city"
      - "state_code"
      - "permission_starts_on"
      - "permission_ends_on"
      - "exclusivity_scope?"
      - "max_kettles?"
    output: HostSite
    side_effects: []
  - method: GET
    path: "/api/host-sites"
    description: "list host sites filtered by campaign, permission status or retailer"
    roles: [PlatformAdmin, KettleCoordinator, TerritorialCommander, DivisionalOfficer, CorpsOfficer, HostSiteManager]
    code: 200
    input:
      - "campaign_id?"
      - "permission_status?"
      - "retailer_name?"
      - "store_number?"
      - "limit?"
      - "offset?"
    output: HostSite[]
    side_effects: []
  - method: GET
    path: "/api/host-sites/{id}"
    description: "read one host site"
    roles: [PlatformAdmin, KettleCoordinator, TerritorialCommander, DivisionalOfficer, CorpsOfficer, HostSiteManager]
    code: 200
    input: []
    output: HostSite
    side_effects: []
  - method: POST
    path: "/api/host-sites/{id}/approve"
    description: "approve, deny or revoke a host site permission"
    roles: [KettleCoordinator, TerritorialCommander]
    code: 200
    input:
      - "decision?"
      - "expected_host_site_version?"
    output: HostSite
    side_effects: ["HostSite.permission_status updated", "cascades to the site's kettle locations and their shifts", "increments HostSite.version by 1"]
  - method: POST
    path: "/api/host-sites/{id}/renew"
    description: "renew an EXPIRED host site permission back to APPROVED with a new window"
    roles: [KettleCoordinator, TerritorialCommander]
    code: 200
    input:
      - "permission_starts_on"
      - "permission_ends_on"
    output: HostSite
    side_effects: ["HostSite.permission_status := APPROVED", "reinstates SUSPENDED kettle locations whose placement window still fits", "increments HostSite.version by 1"]
  - method: POST
    path: "/api/kettle-locations"
    description: "create a kettle placement in DRAFT at an approved host site"
    roles: [KettleCoordinator, CorpsOfficer]
    code: 201
    input:
      - "host_site_id"
      - "campaign_id"
      - "location_code"
      - "placement"
      - "placement_starts_on"
      - "placement_ends_on"
      - "daily_required_minutes?"
    output: KettleLocation
    side_effects: []
  - method: GET
    path: "/api/kettle-locations"
    description: "list kettle locations filtered by host site, campaign or status"
    roles: [PlatformAdmin, KettleCoordinator, CorpsOfficer, TerritorialCommander, DivisionalOfficer, HostSiteManager, FinanceOfficer, VolunteerCoordinator]
    code: 200
    input:
      - "host_site_id?"
      - "campaign_id?"
      - "status?"
      - "limit?"
      - "offset?"
    output: KettleLocation[]
    side_effects: []
  - method: GET
    path: "/api/kettle-locations/{id}"
    description: "read one kettle location"
    roles: [PlatformAdmin, KettleCoordinator, CorpsOfficer, TerritorialCommander, DivisionalOfficer, HostSiteManager, FinanceOfficer, VolunteerCoordinator]
    code: 200
    input: []
    output: KettleLocation
    side_effects: []
  - method: POST
    path: "/api/kettle-locations/{id}/activate"
    description: "move a kettle location from DRAFT or SUSPENDED to ACTIVE"
    roles: [KettleCoordinator, CorpsOfficer]
    code: 200
    input:
      - "expected_kettle_location_version?"
    output: KettleLocation
    side_effects: ["KettleLocation.status := ACTIVE", "HostSite.active_kettle_count recomputed", "Campaign.active_location_count recomputed", "increments KettleLocation.version by 1"]
  - method: POST
    path: "/api/kettle-locations/{id}/suspend"
    description: "suspend an ACTIVE kettle location and cancel its SCHEDULED shifts"
    roles: [KettleCoordinator, CorpsOfficer]
    code: 200
    input: []
    output: KettleLocation
    side_effects: ["KettleLocation.status := SUSPENDED", "cancels the location's SCHEDULED shifts", "increments KettleLocation.version by 1"]
  - method: POST
    path: "/api/kettle-locations/{id}/close"
    description: "close a kettle location once no collection is still in flight"
    roles: [KettleCoordinator, TerritorialCommander]
    code: 200
    input: []
    output: KettleLocation
    side_effects: ["KettleLocation.status := CLOSED", "cancels remaining SCHEDULED and CONFIRMED shifts", "increments KettleLocation.version by 1"]
  - method: GET
    path: "/api/kettle-locations/{id}/performance"
    description: "computed location performance: cents per hour, index, tier and coverage gap"
    roles: [PlatformAdmin, KettleCoordinator, CorpsOfficer, TerritorialCommander, DivisionalOfficer, HostSiteManager, FinanceOfficer]
    code: 200
    input:
      - "on_date?"
    output: { location_id: string, location_total_cents: integer, covered_minutes: integer, covered_hours: integer, cents_per_hour: integer, performance_index: integer, performance_tier: string, coverage_pct: integer, understaffed: boolean }
    side_effects: []
  - method: POST
    path: "/api/bell-ringers"
    description: "register a volunteer or paid seasonal bell ringer"
    roles: [VolunteerCoordinator, CorpsOfficer, PlatformAdmin]
    code: 201
    input:
      - "full_name"
      - "email"
      - "ringer_type"
      - "corps_id"
      - "date_of_birth"
      - "hourly_rate_cents?"
    output: BellRinger
    side_effects: []
  - method: GET
    path: "/api/bell-ringers"
    description: "list bell ringers filtered by corps, screening status, engagement status or type"
    roles: [PlatformAdmin, VolunteerCoordinator, CorpsOfficer, KettleCoordinator, TerritorialCommander, DivisionalOfficer, FinanceOfficer]
    code: 200
    input:
      - "corps_id?"
      - "screening_status?"
      - "engagement_status?"
      - "ringer_type?"
      - "limit?"
      - "offset?"
    output: BellRinger[]
    side_effects: []
  - method: GET
    path: "/api/bell-ringers/{id}"
    description: "read one bell ringer"
    roles: [PlatformAdmin, VolunteerCoordinator, CorpsOfficer, KettleCoordinator, TerritorialCommander, DivisionalOfficer, FinanceOfficer, BellRinger]
    code: 200
    input: []
    output: BellRinger
    side_effects: []
  - method: POST
    path: "/api/bell-ringers/{id}/screenings"
    description: "submit a background screening request, moving screening_status to PENDING"
    roles: [VolunteerCoordinator, CorpsOfficer, PlatformAdmin]
    code: 200
    input:
      - "vendor"
      - "package_level"
    output: BellRinger
    side_effects: ["BellRinger.screening_status := PENDING", "increments BellRinger.version by 1"]
  - method: POST
    path: "/api/bell-ringers/{id}/screenings/complete"
    description: "record the screening vendor result; a CLEAR result while SUSPENDED reinstates the ringer"
    roles: [VolunteerCoordinator, CorpsOfficer, PlatformAdmin]
    code: 200
    input:
      - "result"
      - "completed_at"
    output: BellRinger
    side_effects: ["BellRinger.screening_status updated", "screening_expires_at stamped on CLEAR", "a FAIL cancels the ringer's SCHEDULED and CONFIRMED shifts and suspends engagement", "increments BellRinger.version by 1"]
  - method: POST
    path: "/api/bell-ringers/{id}/separate"
    description: "end a ringer's engagement once no hours remain scheduled"
    roles: [VolunteerCoordinator, PlatformAdmin]
    code: 200
    input: []
    output: BellRinger
    side_effects: ["BellRinger.engagement_status := SEPARATED", "increments BellRinger.version by 1"]
  - method: POST
    path: "/api/shifts"
    description: "schedule a bell ringing shift at an active kettle location"
    roles: [VolunteerCoordinator, KettleCoordinator, CorpsOfficer]
    code: 201
    input:
      - "kettle_location_id"
      - "bell_ringer_id"
      - "starts_at"
      - "ends_at"
      - "break_minutes?"
      - "shift_kind?"
      - "expected_kettle_location_version"
    output: Shift
    side_effects: ["BellRinger.scheduled_hours increased by the shift duration", "increments KettleLocation.version by 1"]
  - method: GET
    path: "/api/shifts"
    description: "list shifts filtered by location, ringer or status"
    roles: [PlatformAdmin, VolunteerCoordinator, KettleCoordinator, CorpsOfficer, TerritorialCommander, DivisionalOfficer, FinanceOfficer, BellRinger]
    code: 200
    input:
      - "kettle_location_id?"
      - "bell_ringer_id?"
      - "status?"
      - "starts_at_from?"
      - "limit?"
      - "offset?"
    output: Shift[]
    side_effects: []
  - method: GET
    path: "/api/shifts/{id}"
    description: "read one shift"
    roles: [PlatformAdmin, VolunteerCoordinator, KettleCoordinator, CorpsOfficer, TerritorialCommander, DivisionalOfficer, FinanceOfficer, BellRinger]
    code: 200
    input: []
    output: Shift
    side_effects: []
  - method: POST
    path: "/api/shifts/{id}/confirm"
    description: "confirm a SCHEDULED shift after re-checking screening, engagement and location posture"
    roles: [VolunteerCoordinator, KettleCoordinator, CorpsOfficer]
    code: 200
    input: []
    output: Shift
    side_effects: ["Shift.status := CONFIRMED", "increments Shift.version by 1"]
  - method: POST
    path: "/api/shifts/{id}/check-in"
    description: "ringer self check-in within the 15 minute pre-shift window"
