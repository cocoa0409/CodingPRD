              captures: { e_site: $.data.error_id }
          assert:
            - "Trigger 1 HTTP status == 409 and ${e_state} == ERR_BUDGET_STATE_INVALID; SponsorBudget.${bg_id}.status == DRAFT and approved_operating_cost_cents == null afterwards"
            - "Trigger 3 HTTP status == 422 and ${e_ceiling} == ERR_APPROVED_CEILING_EXCEEDS_REQUEST (6000000 > the requested 5000000); SponsorBudget.${bg_id}.status == SUBMITTED afterwards"
            - "Trigger 4 HTTP status == 200 and ${bg_status} == APPROVED with approved_operating_cost_cents == 4500000 and approved_admin_cost_cents == 700000"
            - "Trigger 7 HTTP status == 422 and ${e_over} == ERR_APPROVED_EXCEEDS_REQUESTED (40000 > the requested 30000); AdvancePayment.${adv_id}.status == REQUESTED afterwards"
            - "Trigger 8 HTTP status == 200 and ${adv_status} == APPROVED with approved_amount_cents == 30000"
            - "Trigger 9 HTTP status == 409 and ${e_site} == ERR_NO_APPROVED_SITE"
            - "AdvancePayment.${adv_id}.status == APPROVED, outstanding_cents == 0 and Sponsor.${sp_id}.advance_paid_cents == 0 (the blocked disbursement moved no money)"

