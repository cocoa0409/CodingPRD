# ===========================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# Task 2783 — Duty-Free Retail Operations
#
# Every instance grounds only in elements already declared in SCAFFOLD.yaml
# §1.1-§1.7. All numeric asserts were executed against the declared
# calculations[].formula and constants and are written here as literals.
# The logical clock starts at its mandatory default 2026-08-01T00:00:00Z.
# ===========================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: concession_rent_provisional_proration_versus_final_full_minimum_guarantee
        grounds:
          - calculations.concession_rent_accrual
          - calculations.net_rent_settlement
          - state_machines.ConcessionAgreement.ACTIVE_to_CLOSED
          - entities.ConcessionAgreement.fields.rent_basis
        distinguishing_aspect: |
          The same gross_sales_cents of 24000 yields rent_basis PERCENTAGE under
          PROVISIONAL_PERIODIC (2880 beats the 5/31-day prorated guarantee of 1613) and
          rent_basis MINIMUM_GUARANTEE under FINAL_PERIOD_CLOSE (2880 loses to the full
          guarantee of 10000), so the two variants disagree on both the basis and the amount
          with no input field changing.
        test_recipe:
          setup:
            - "Terminal SIN in SG with sealed_bag_regime NONE"
            - "One LIQUOR product priced 8000 cents at 2400 bps combined levy, LISTED, with 10 units received into bonded stock"
            - "AU/LIQUOR arrival allowance of 3 units, so the whole 3-unit basket is exempt and gross_amount_cents is 24000"
            - "ConcessionAgreement 2026-08 over [2026-08-01T00:00:00Z, 2026-09-01T00:00:00Z) at 1200 bps with a 10000-cent minimum guarantee, ACTIVE"
            - "One scanned itinerary departing 2026-08-25T10:00:00Z to AU with no connection, whose sale has been picked up"
            - "Logical clock advanced to 2026-08-05T00:00:00Z (elapsed_days 5 of period_days 31)"
          setup_api_calls:
            - call: "POST /terminals"
              payload: { iata_code: "SIN", name: "Changi T3 Duty Free", country_code: "SG", sealed_bag_regime: "NONE", liquid_limit_ml: 3000 }
              as: TerminalAdmin
              captures: { t_sin: $.data.id }
            - call: "POST /brands"
              payload: { name: "Aurora Spirits", category: "LIQUOR" }
              as: TerminalAdmin
              captures: { b_aurora: $.data.id }
            - call: "POST /products"
              payload: { brand_id: "${b_aurora}", sku: "AUR-WHISKY-700", category: "LIQUOR", unit_price_cents: 8000, duty_rate_bps: 1500, vat_rate_bps: 900, is_liquid: true, liquid_ml: 700, target_nationality_code: "CN", required_nationality_share_bps: 0 }
              as: TerminalAdmin
              captures: { p_whisky: $.data.id }
            - call: "POST /products/${p_whisky}/list"
              payload: {}
              as: TerminalAdmin
            - call: "POST /allowance-rules"
              payload: { destination_country: "AU", category: "LIQUOR", allowance_units: 3, advisory_text: "Australia permits 2.25 L of alcohol per adult traveller." }
              as: TerminalAdmin
            - call: "POST /bonded-stock-items"
              payload: { terminal_id: "${t_sin}", product_id: "${p_whisky}" }
              as: StockController
              captures: { si_whisky: $.data.id }
            - call: "POST /bonded-movements"
              payload: { stock_item_id: "${si_whisky}", movement_type: "RECEIPT", qty_delta: 10 }
              as: StockController
            - call: "POST /concession-agreements"
              payload: { terminal_id: "${t_sin}", period_code: "2026-08", period_start_utc: "2026-08-01T00:00:00Z", period_end_utc: "2026-09-01T00:00:00Z", rent_pct_bps: 1200, minimum_guarantee_cents: 10000 }
              as: TerminalAdmin
              captures: { ag_aug: $.data.id }
            - call: "POST /concession-agreements/${ag_aug}/activate"
              payload: {}
              as: TerminalAdmin
            - call: "POST /itineraries"
              payload: { passenger_ref: "PAX-0001", nationality_code: "CN", boarding_pass_barcode: "BP-0001", departure_terminal_id: "${t_sin}", departure_utc: "2026-08-25T10:00:00Z", destination_country: "AU", final_destination_country: "AU", has_connection: false }
              as: SalesAssociate
              captures: { it_1: $.data.id }
            - call: "POST /itineraries/${it_1}/scan-boarding-pass"
              payload: { boarding_pass_barcode: "BP-0001" }
              as: SalesAssociate
            - call: "POST /sales"
              payload: { itinerary_id: "${it_1}", channel: "IN_STORE" }
              as: SalesAssociate
              captures: { sale_1: $.data.id, sale_1_v: $.data.version }
            - call: "POST /sales/${sale_1}/lines"
              payload: { product_id: "${p_whisky}", qty: 3, expected_sale_version: "${sale_1_v}" }
              as: SalesAssociate
            - call: "POST /sales/${sale_1}/clear-eligibility"
              payload: {}
              as: SalesAssociate
            - call: "POST /sales/${sale_1}/pickup"
              payload: {}
              as: SalesAssociate
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: TerminalAdmin
          trigger:
            - call: "GET /concession-agreements/${ag_aug}/rent-projection"
              as: TerminalAdmin
              captures: { proj_basis: $.data.rent_basis }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: TerminalAdmin
            - call: "POST /concession-agreements/${ag_aug}/close-period"
              payload: {}
              as: TerminalAdmin
          assert:
            - "rent-projection response data.gross_sales_cents == 24000"
            - "rent-projection response data.percentage_rent_cents == 2880"
            - "rent-projection response data.period_days == 31"
            - "rent-projection response data.elapsed_days == 5"
            - "rent-projection response data.prorated_minimum_guarantee_cents == 1613"
            - "rent-projection response data.provisional_rent_cents == 2880"
            - "rent-projection response data.rent_basis == PERCENTAGE"
            - "ConcessionAgreement.${ag_aug}.final_rent_cents == 10000"
            - "ConcessionAgreement.${ag_aug}.rent_basis == MINIMUM_GUARANTEE"
            - "ConcessionAgreement.${ag_aug}.marketing_credit_cents == 100"
            - "ConcessionAgreement.${ag_aug}.net_rent_cents == 9900"
            - "ConcessionAgreement.${ag_aug}.percentage_rent_cents == 2880"
            - "ConcessionAgreement.${ag_aug}.status == CLOSED"

      - name: duty_exemption_first_leg_estimate_versus_final_destination_confirmation
        grounds:
          - calculations.duty_exemption_accounting
          - state_machines.Sale.CART_to_ELIGIBILITY_CLEARED
          - state_machines.Sale.ELIGIBILITY_CLEARED_to_PICKED_UP
          - entities.Sale.fields.eligibility_variant
          - entities.Sale.fields.effective_destination_country
        distinguishing_aspect: |
          The identical 3-unit basket is priced against the FIRST-LEG country AU (allowance 1 unit,
          exempt 8000 cents, duty 3840 cents) under SUSPENDED_ESTIMATE and against the FINAL
          destination NZ (allowance 3 units, exempt 24000 cents, duty 0 cents) under
          EXEMPT_CONFIRMED_FINAL, so the connecting passenger's basket moves from partly dutiable
          to fully exempt with no input field changing.
        test_recipe:
          setup:
            - "Terminal HKG in HK under the ICAO_STEB sealed-bag regime with liquid_limit_ml 3000"
            - "One LIQUOR product priced 8000 cents at 2400 bps combined levy, is_liquid with liquid_ml 700, LISTED, 10 units in bonded stock"
            - "Arrival allowances AU/LIQUOR = 1 unit and NZ/LIQUOR = 3 units, both ACTIVE"
            - "ConcessionAgreement 2026-08 at HKG, ACTIVE"
            - "One scanned itinerary departing 2026-08-05T10:00:00Z to AU with a connection departing 2026-08-06T02:00:00Z and final destination NZ"
            - "A 3-unit basket cleared for eligibility, sealed into an intact-verified STEB"
            - "Logical clock left at its startup default 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /terminals"
              payload: { iata_code: "HKG", name: "Hong Kong T1 Duty Free", country_code: "HK", sealed_bag_regime: "ICAO_STEB", liquid_limit_ml: 3000 }
              as: TerminalAdmin
              captures: { t_hkg: $.data.id }
            - call: "POST /brands"
              payload: { name: "Aurora Spirits", category: "LIQUOR" }
              as: TerminalAdmin
              captures: { b_aurora: $.data.id }
            - call: "POST /products"
              payload: { brand_id: "${b_aurora}", sku: "AUR-WHISKY-700", category: "LIQUOR", unit_price_cents: 8000, duty_rate_bps: 1500, vat_rate_bps: 900, is_liquid: true, liquid_ml: 700, target_nationality_code: "CN", required_nationality_share_bps: 0 }
              as: TerminalAdmin
              captures: { p_whisky: $.data.id }
            - call: "POST /products/${p_whisky}/list"
              payload: {}
              as: TerminalAdmin
            - call: "POST /allowance-rules"
              payload: { destination_country: "AU", category: "LIQUOR", allowance_units: 1, advisory_text: "Australia: 2.25 L of alcohol per adult traveller." }
              as: TerminalAdmin
            - call: "POST /allowance-rules"
              payload: { destination_country: "NZ", category: "LIQUOR", allowance_units: 3, advisory_text: "New Zealand: 3 bottles of spirits per traveller." }
              as: TerminalAdmin
            - call: "POST /bonded-stock-items"
              payload: { terminal_id: "${t_hkg}", product_id: "${p_whisky}" }
              as: StockController
              captures: { si_whisky: $.data.id }
            - call: "POST /bonded-movements"
              payload: { stock_item_id: "${si_whisky}", movement_type: "RECEIPT", qty_delta: 10 }
              as: StockController
            - call: "POST /concession-agreements"
              payload: { terminal_id: "${t_hkg}", period_code: "2026-08", period_start_utc: "2026-08-01T00:00:00Z", period_end_utc: "2026-09-01T00:00:00Z", rent_pct_bps: 1200, minimum_guarantee_cents: 10000 }
              as: TerminalAdmin
              captures: { ag_aug: $.data.id }
            - call: "POST /concession-agreements/${ag_aug}/activate"
              payload: {}
              as: TerminalAdmin
            - call: "POST /itineraries"
              payload: { passenger_ref: "PAX-0002", nationality_code: "CN", boarding_pass_barcode: "BP-0002", departure_terminal_id: "${t_hkg}", departure_utc: "2026-08-05T10:00:00Z", destination_country: "AU", final_destination_country: "NZ", has_connection: true, connection_country: "AU", connection_departure_utc: "2026-08-06T02:00:00Z" }
              as: SalesAssociate
              captures: { it_2: $.data.id }
            - call: "POST /itineraries/${it_2}/scan-boarding-pass"
              payload: { boarding_pass_barcode: "BP-0002" }
              as: SalesAssociate
            - call: "POST /sales"
              payload: { itinerary_id: "${it_2}", channel: "IN_STORE" }
              as: SalesAssociate
              captures: { sale_2: $.data.id, sale_2_v: $.data.version }
            - call: "POST /sales/${sale_2}/lines"
              payload: { product_id: "${p_whisky}", qty: 3, expected_sale_version: "${sale_2_v}" }
              as: SalesAssociate
              captures: { line_2: $.data.id }
          trigger:
            - call: "POST /sales/${sale_2}/clear-eligibility"
              payload: {}
              as: SalesAssociate
            - call: "POST /sealed-bags"
              payload: { sale_id: "${sale_2}", seal_number: "STEB-0002" }
              as: SalesAssociate
              captures: { bag_2: $.data.id }
            - call: "POST /sealed-bags/${bag_2}/verify"
              payload: { outcome: "INTACT" }
              as: SalesAssociate
            - call: "POST /sales/${sale_2}/pickup"
              payload: {}
              as: SalesAssociate
          assert:
            - "immediately after clear-eligibility: Sale.${sale_2}.eligibility_variant == SUSPENDED_ESTIMATE"
            - "immediately after clear-eligibility: Sale.${sale_2}.effective_destination_country == AU"
            - "immediately after clear-eligibility: Sale.${sale_2}.exempt_amount_cents == 8000"
            - "immediately after clear-eligibility: Sale.${sale_2}.duty_liability_cents == 3840"
            - "immediately after clear-eligibility: Sale.${sale_2}.duty_status == SUSPENDED"
            - "immediately after clear-eligibility: Sale.${sale_2}.sealed_bag_required == true"
            - "immediately after clear-eligibility: SaleLine.${line_2}.allowance_excess_qty == 2"
            - "SealedBag.${bag_2}.total_liquid_ml == 2100"
            - "SealedBag.${bag_2}.expires_at == 2026-08-09T10:00:00Z"
            - "after pickup: Sale.${sale_2}.eligibility_variant == EXEMPT_CONFIRMED_FINAL"
            - "after pickup: Sale.${sale_2}.effective_destination_country == NZ"
            - "after pickup: Sale.${sale_2}.exempt_amount_cents == 24000"
            - "after pickup: Sale.${sale_2}.duty_liability_cents == 0"
            - "after pickup: Sale.${sale_2}.duty_status == EXEMPT_CONFIRMED"
            - "after pickup: SaleLine.${line_2}.allowance_excess_qty == 0"
            - "Sale.${sale_2}.gross_amount_cents == 24000 both before and after pickup"

  - rule_id: combinatorial_formula
    instances:
      - name: per_line_rounding_before_summation_beats_sum_then_round
        grounds:
          - calculations.duty_exemption_accounting
          - entities.SaleLine.fields.line_duty_cents
          - entities.Sale.fields.duty_liability_cents
          - state_machines.Sale.ELIGIBILITY_CLEARED_to_PICKED_UP
        distinguishing_aspect: |
          Mode (b): the ROUNDING ORDER is the trap. Two TOBACCO lines of 1 unit at 333 cents and
          1250 bps each round to 42 cents, summing to Sale.duty_liability_cents == 84, whereas
          summing the raw products first (2 * 333 * 0.125 == 83.25) and rounding once yields 83.
        test_recipe:
          setup:
            - "Terminal SIN in SG with sealed_bag_regime NONE"
            - "One TOBACCO product priced 333 cents at 800 + 450 = 1250 bps combined levy, LISTED, 10 units in bonded stock"
            - "AU/TOBACCO arrival allowance of 0 units, so every unit is dutiable"
            - "ConcessionAgreement 2026-08 at SIN at 1200 bps, ACTIVE"
            - "One scanned itinerary to AU with no connection, departing 2026-08-25T10:00:00Z"
            - "A basket holding TWO separate lines of qty 1 each (not one line of qty 2)"
            - "Logical clock left at its startup default 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /terminals"
              payload: { iata_code: "SIN", name: "Changi T3 Duty Free", country_code: "SG", sealed_bag_regime: "NONE", liquid_limit_ml: 3000 }
              as: TerminalAdmin
              captures: { t_sin: $.data.id }
            - call: "POST /brands"
              payload: { name: "Embassy Cigars", category: "TOBACCO" }
              as: TerminalAdmin
              captures: { b_embassy: $.data.id }
            - call: "POST /products"
              payload: { brand_id: "${b_embassy}", sku: "EMB-CIGAR-01", category: "TOBACCO", unit_price_cents: 333, duty_rate_bps: 800, vat_rate_bps: 450, target_nationality_code: "CN", required_nationality_share_bps: 0 }
              as: TerminalAdmin
              captures: { p_cigar: $.data.id }
            - call: "POST /products/${p_cigar}/list"
              payload: {}
              as: TerminalAdmin
            - call: "POST /allowance-rules"
              payload: { destination_country: "AU", category: "TOBACCO", allowance_units: 0, advisory_text: "Australia: no duty-free tobacco allowance beyond one open packet." }
              as: TerminalAdmin
            - call: "POST /bonded-stock-items"
              payload: { terminal_id: "${t_sin}", product_id: "${p_cigar}" }
              as: StockController
              captures: { si_cigar: $.data.id }
            - call: "POST /bonded-movements"
              payload: { stock_item_id: "${si_cigar}", movement_type: "RECEIPT", qty_delta: 10 }
              as: StockController
            - call: "POST /concession-agreements"
              payload: { terminal_id: "${t_sin}", period_code: "2026-08", period_start_utc: "2026-08-01T00:00:00Z", period_end_utc: "2026-09-01T00:00:00Z", rent_pct_bps: 1200, minimum_guarantee_cents: 10000 }
              as: TerminalAdmin
              captures: { ag_aug: $.data.id }
            - call: "POST /concession-agreements/${ag_aug}/activate"
              payload: {}
              as: TerminalAdmin
            - call: "POST /itineraries"
              payload: { passenger_ref: "PAX-0003", nationality_code: "CN", boarding_pass_barcode: "BP-0003", departure_terminal_id: "${t_sin}", departure_utc: "2026-08-25T10:00:00Z", destination_country: "AU", final_destination_country: "AU", has_connection: false }
              as: SalesAssociate
              captures: { it_3: $.data.id }
            - call: "POST /itineraries/${it_3}/scan-boarding-pass"
              payload: { boarding_pass_barcode: "BP-0003" }
              as: SalesAssociate
            - call: "POST /sales"
              payload: { itinerary_id: "${it_3}", channel: "IN_STORE" }
              as: SalesAssociate
              captures: { sale_3: $.data.id, sale_3_v0: $.data.version }
            - call: "POST /sales/${sale_3}/lines"
              payload: { product_id: "${p_cigar}", qty: 1, expected_sale_version: "${sale_3_v0}" }
              as: SalesAssociate
              captures: { line_3a: $.data.id }
            - call: "GET /sales/${sale_3}"
              as: SalesAssociate
              captures: { sale_3_v1: $.data.version }
            - call: "POST /sales/${sale_3}/lines"
              payload: { product_id: "${p_cigar}", qty: 1, expected_sale_version: "${sale_3_v1}" }
              as: SalesAssociate
              captures: { line_3b: $.data.id }
          trigger:
            - call: "POST /sales/${sale_3}/clear-eligibility"
              payload: {}
              as: SalesAssociate
            - call: "POST /sales/${sale_3}/pickup"
              payload: {}
              as: SalesAssociate
          assert:
            - "SaleLine.${line_3a}.line_duty_cents == 42"
            - "SaleLine.${line_3b}.line_duty_cents == 42"
            - "SaleLine.${line_3a}.allowance_excess_qty == 1"
            - "SaleLine.${line_3b}.allowance_excess_qty == 1"
            - "Sale.${sale_3}.duty_liability_cents == 84"
            - "Sale.${sale_3}.duty_liability_cents != 83"
            - "Sale.${sale_3}.exempt_amount_cents == 0"
            - "Sale.${sale_3}.gross_amount_cents == 666"
            - "Sale.${sale_3}.duty_status == DUTY_LIABLE"
            - "ConcessionAgreement.${ag_aug}.gross_sales_cents == 666"
            - "ConcessionAgreement.${ag_aug}.percentage_rent_cents == 80"

      - name: marketing_credit_tier_keyed_on_gross_rent_not_net_rent
        grounds:
          - calculations.net_rent_settlement
          - calculations.concession_rent_accrual
          - state_machines.ConcessionAgreement.ACTIVE_to_CLOSED
          - entities.ConcessionAgreement.fields.marketing_credit_cents
        distinguishing_aspect: |
          Mode (c): the EVALUATION ORDER of a circular-looking dependency. final_rent_cents settles
          at exactly the TIER_2_FLOOR_CENTS boundary of 2000000, so keying tier_bps on the gross
          figure gives 250 bps (credit 50000, net 1950000) while re-keying it on the resulting
          net_rent_cents of 1950000 would drop to 100 bps (credit 19500, net 1980500).
        test_recipe:
          setup:
            - "Terminal SIN in SG with sealed_bag_regime NONE"
            - "One ELECTRONICS product priced 20000 cents at 0 + 700 = 700 bps combined levy, LISTED, 20 units in bonded stock"
            - "AU/ELECTRONICS arrival allowance of 5 units, so the whole 5-unit basket is exempt"
            - "ConcessionAgreement 2026-08 at 1000 bps with a 2000000-cent minimum guarantee, ACTIVE"
            - "One picked-up 5-unit sale, so gross_sales_cents == 100000 and percentage_rent_cents == 10000"
            - "Logical clock advanced past period_end_utc to 2026-09-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /terminals"
              payload: { iata_code: "SIN", name: "Changi T3 Duty Free", country_code: "SG", sealed_bag_regime: "NONE", liquid_limit_ml: 3000 }
              as: TerminalAdmin
              captures: { t_sin: $.data.id }
            - call: "POST /brands"
              payload: { name: "Meridian Timepieces", category: "ELECTRONICS" }
              as: TerminalAdmin
              captures: { b_meridian: $.data.id }
            - call: "POST /products"
              payload: { brand_id: "${b_meridian}", sku: "MER-WATCH-01", category: "ELECTRONICS", unit_price_cents: 20000, duty_rate_bps: 0, vat_rate_bps: 700, target_nationality_code: "CN", required_nationality_share_bps: 0 }
              as: TerminalAdmin
              captures: { p_watch: $.data.id }
            - call: "POST /products/${p_watch}/list"
              payload: {}
              as: TerminalAdmin
            - call: "POST /allowance-rules"
              payload: { destination_country: "AU", category: "ELECTRONICS", allowance_units: 5, advisory_text: "Australia: AUD 900 general goods allowance per adult." }
              as: TerminalAdmin
            - call: "POST /bonded-stock-items"
              payload: { terminal_id: "${t_sin}", product_id: "${p_watch}" }
              as: StockController
              captures: { si_watch: $.data.id }
            - call: "POST /bonded-movements"
              payload: { stock_item_id: "${si_watch}", movement_type: "RECEIPT", qty_delta: 20 }
              as: StockController
            - call: "POST /concession-agreements"
              payload: { terminal_id: "${t_sin}", period_code: "2026-08", period_start_utc: "2026-08-01T00:00:00Z", period_end_utc: "2026-09-01T00:00:00Z", rent_pct_bps: 1000, minimum_guarantee_cents: 2000000 }
              as: TerminalAdmin
              captures: { ag_aug: $.data.id }
            - call: "POST /concession-agreements/${ag_aug}/activate"
              payload: {}
              as: TerminalAdmin
            - call: "POST /itineraries"
              payload: { passenger_ref: "PAX-0004", nationality_code: "CN", boarding_pass_barcode: "BP-0004", departure_terminal_id: "${t_sin}", departure_utc: "2026-08-25T10:00:00Z", destination_country: "AU", final_destination_country: "AU", has_connection: false }
              as: SalesAssociate
              captures: { it_4: $.data.id }
            - call: "POST /itineraries/${it_4}/scan-boarding-pass"
              payload: { boarding_pass_barcode: "BP-0004" }
              as: SalesAssociate
            - call: "POST /sales"
              payload: { itinerary_id: "${it_4}", channel: "IN_STORE" }
              as: SalesAssociate
              captures: { sale_4: $.data.id, sale_4_v: $.data.version }
            - call: "POST /sales/${sale_4}/lines"
              payload: { product_id: "${p_watch}", qty: 5, expected_sale_version: "${sale_4_v}" }
              as: SalesAssociate
            - call: "POST /sales/${sale_4}/clear-eligibility"
              payload: {}
              as: SalesAssociate
            - call: "POST /sales/${sale_4}/pickup"
              payload: {}
              as: SalesAssociate
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: TerminalAdmin
          trigger:
            - call: "POST /concession-agreements/${ag_aug}/close-period"
              payload: {}
              as: TerminalAdmin
          assert:
            - "ConcessionAgreement.${ag_aug}.gross_sales_cents == 100000"
            - "ConcessionAgreement.${ag_aug}.percentage_rent_cents == 10000"
            - "ConcessionAgreement.${ag_aug}.final_rent_cents == 2000000"
            - "ConcessionAgreement.${ag_aug}.rent_basis == MINIMUM_GUARANTEE"
            - "ConcessionAgreement.${ag_aug}.marketing_credit_cents == 50000"
            - "ConcessionAgreement.${ag_aug}.marketing_credit_cents != 19500"
            - "ConcessionAgreement.${ag_aug}.net_rent_cents == 1950000"
            - "ConcessionAgreement.${ag_aug}.status == CLOSED"

      - name: shrinkage_penalty_multiplier_after_third_submission_round
        grounds:
          - calculations.unaccounted_goods_duty_assessment
          - state_machines.CustomsAudit.SUBMITTED_to_CLOSED_ASSESSED
          - state_machines.CustomsAudit.INFO_REQUESTED_to_SUBMITTED
          - entities.CustomsAudit.fields.round_count
          - entities.Terminal.fields.unaccounted_duty_liability_cents
        distinguishing_aspect: |
          Mode (a): a THRESHOLD on an accumulated counter changes the formula's shape. round_count
          reaches AUDIT_PENALTY_ROUND_THRESHOLD == 3, so penalty_multiplier flips from 1 to 2 and
