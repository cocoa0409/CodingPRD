      - name: resume_sales_on_an_open_sailing_is_rejected
        claim_type: invalid_transitions
        grounds:
          - state_machines.Sailing.transitions
          - validations[priority=10]
          - errors[ERR_SAILING_NOT_SUSPENDED]
