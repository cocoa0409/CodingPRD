scenario: "Online Reputation & Reviews Management (Birdeye style): review-request campaign & SMS/email, multi-site (Google/Yelp/Facebook) aggregation, sentiment & rating dashboard, response/template & escalation, listing/NAP sync, survey & NPS, competitor benchmark, alert & website widget"
domain_name: "online-reputation-management"
api_prefix: "/reputation"

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - conditional_feature_flags
  entity_topology: hierarchical
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
  difficulty_level: Expert

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Business
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: legal/brand name of the tenant business
      - name: plan_tier
        type: enum
        source: input
        description: commercial plan of the tenant
        default: BASIC
        constraints: "one of {BASIC, PRO, ENTERPRISE}"
      - name: default_frequency_cap_days
        type: integer
        source: input
        description: per-contact review-request cooldown in days used by every campaign of this business
        default: 30
        constraints: ">= 1"
      - name: location_count
        type: integer
        source: computed
        description: number of Location rows whose business_id equals this Business.id
        default: 0

  - name: Location
    parent: Business
    common_fields: true
    fields:
      - name: business_id
        type: string
        source: input
        description: "FK -> Business.id"
      - name: name
        type: string
        source: input
        description: display name of the physical location
      - name: nap_name
        type: string
        source: input
        description: canonical Name part of the NAP record (source of truth pushed to listings)
      - name: nap_address
        type: string
        source: input
        description: canonical Address part of the NAP record
      - name: nap_phone
        type: string
        source: input
        description: canonical Phone part of the NAP record
      - name: compliance_hold
        type: boolean
        source: system
        description: set by PlatformAdmin via compliance-hold; forces posture FROZEN while true
        default: false
      - name: posture
        type: enum
        source: computed
        description: derived gating state recomputed by calculations.location_posture after every mutation that feeds it
        default: OPEN
        constraints: "one of {OPEN, RESTRICTED, FROZEN}"
      - name: review_count
        type: integer
        source: computed
        description: count of Review rows at this location with moderation_state IN {UNVERIFIED, VERIFIED}
        default: 0
      - name: avg_rating
        type: number
        source: computed
        description: mean Review.rating over moderation_state IN {UNVERIFIED, VERIFIED}, 2 dp round_half_up, 0.00 when the set is empty
        default: 0.00
      - name: responded_review_count
        type: integer
        source: computed
        description: count of Review rows at this location with moderation_state IN {UNVERIFIED, VERIFIED} AND response_state == RESPONDED
        default: 0
      - name: sentiment_positive_count
        type: integer
        source: computed
        description: count of Review rows with moderation_state IN {UNVERIFIED, VERIFIED} AND sentiment == POSITIVE
        default: 0
      - name: sentiment_neutral_count
        type: integer
        source: computed
        description: count of Review rows with moderation_state IN {UNVERIFIED, VERIFIED} AND sentiment == NEUTRAL
        default: 0
      - name: sentiment_negative_count
        type: integer
        source: computed
        description: count of Review rows with moderation_state IN {UNVERIFIED, VERIFIED} AND sentiment == NEGATIVE
        default: 0
      - name: reputation_score_provisional
        type: number
        source: computed
        description: PROVISIONAL variant of calculations.location_reputation_score; recomputed on every review/response/listing mutation; the ONLY score posture reads
        default: 0.00
      - name: reputation_score_certified
        type: number
        source: computed
        description: CERTIFIED variant of calculations.location_reputation_score; refreshed only by POST /reputation/locations/{id}/certify
        default: 0.00
      - name: certified_at
        type: datetime
        source: system
        description: logical-clock instant of the last certify checkpoint; null until first certify
      - name: listing_health_score
        type: number
        source: computed
        description: output of calculations.listing_health_score over this location's Listing rows, 2 dp
        default: 0.00
      - name: nps_score
        type: number
        source: computed
        description: output of calculations.nps_score over this location's SurveyResponse rows with status == SUBMITTED
        default: 0.00
      - name: open_escalation_count
        type: integer
        source: computed
        description: count of Escalation rows whose Review.location_id == this Location.id and whose state IN {OPEN, ACKNOWLEDGED}
        default: 0

  - name: Listing
    parent: Location
    common_fields: true
    fields:
      - name: location_id
        type: string
        source: input
        description: "FK -> Location.id"
      - name: site
        type: enum
        source: input
        description: external review site this listing lives on
        constraints: "one of {GOOGLE, YELP, FACEBOOK}; unique per (location_id, site)"
      - name: external_listing_id
        type: string
        source: input
        description: identifier of the listing on the external site
      - name: listed_nap_name
        type: string
        source: input
        description: Name currently published on the external site
      - name: listed_nap_address
        type: string
        source: input
        description: Address currently published on the external site
      - name: listed_nap_phone
        type: string
        source: input
        description: Phone currently published on the external site
      - name: sync_state
        type: enum
        source: system
        description: NAP sync lifecycle state
        default: PENDING_SYNC
        constraints: "one of {PENDING_SYNC, CONNECTED, SYNC_FAILED, DISCONNECTED}"
      - name: sync_failure_count
        type: integer
        source: system
        description: consecutive FAILURE outcomes; reset to 0 on a SUCCESS outcome
        default: 0
      - name: last_synced_at
        type: datetime
        source: system
        description: logical-clock instant of the last SUCCESS sync; null until the first success
      - name: nap_match_count
        type: integer
        source: computed
        description: number of the three NAP parts where listed_nap_* equals the parent Location's nap_* (case-sensitive exact string equality), 0..3
        default: 0

  - name: Competitor
    parent: Location
    common_fields: false
    fields:
      - name: location_id
        type: string
        source: input
        description: "FK -> Location.id"
      - name: name
        type: string
        source: input
        description: competitor business name
      - name: site
        type: enum
        source: input
        description: site the competitor snapshot was taken from
        constraints: "one of {GOOGLE, YELP, FACEBOOK}"
      - name: avg_rating
        type: number
        source: input
        description: competitor's average star rating on that site
        constraints: ">= 1.00 and <= 5.00"
      - name: review_count
        type: integer
        source: input
        description: competitor's total review volume on that site
        constraints: ">= 0"

  - name: Contact
    parent: Business
    common_fields: true
    fields:
      - name: business_id
        type: string
        source: input
        description: "FK -> Business.id"
      - name: full_name
        type: string
        source: input
        description: contact's display name
      - name: email
        type: string
        source: input
        description: email address; required when a campaign targets this contact over EMAIL
      - name: phone
        type: string
        source: input
        description: E.164 phone; required when a campaign targets this contact over SMS
      - name: sms_consent
        type: boolean
        source: input
        description: explicit SMS marketing consent
        default: false
      - name: email_consent
        type: boolean
        source: input
        description: explicit email marketing consent
        default: true
      - name: opted_out
        type: boolean
        source: system
        description: global opt-out flag set by POST /reputation/contacts/{id}/opt-out
        default: false
      - name: last_requested_at
        type: datetime
        source: system
        description: logical-clock instant at which the most recent ReviewRequest for this contact was enqueued; anchors the frequency-cap window
      - name: request_count
        type: integer
        source: system
        description: total ReviewRequest rows ever enqueued for this contact
        default: 0

  - name: ResponseTemplate
    parent: Business
    common_fields: true
    fields:
      - name: business_id
        type: string
        source: input
        description: "FK -> Business.id"
      - name: name
        type: string
        source: input
        description: template display name
      - name: body
        type: string
        source: input
        description: default response text seeded into a new ReviewResponse
      - name: min_rating
        type: integer
        source: input
        description: lowest Review.rating this template may be applied to
        constraints: ">= 1 and <= 5"
      - name: max_rating
        type: integer
        source: input
        description: highest Review.rating this template may be applied to
        constraints: ">= min_rating and <= 5"
      - name: requires_approval
        type: boolean
        source: input
        description: conditional feature flag; when false a ReviewResponse built from this template skips PENDING_APPROVAL on submit and lands directly in APPROVED
        default: true

  - name: Campaign
    parent: Location
    common_fields: true
    fields:
      - name: location_id
        type: string
        source: input
        description: "FK -> Location.id"
      - name: name
        type: string
        source: input
        description: campaign display name
      - name: channel
        type: enum
        source: input
        description: delivery channel for every ReviewRequest of this campaign
        constraints: "one of {SMS, EMAIL}"
      - name: message_body
        type: string
        source: input
        description: message text sent to contacts
      - name: send_window_start
        type: string
        source: input
        description: daily send-window open time, "HH:MM" 24h UTC
        constraints: "matches ^([01][0-9]|2[0-3]):[0-5][0-9]$"
      - name: send_window_end
        type: string
        source: input
        description: daily send-window close time, "HH:MM" 24h UTC
        constraints: "matches ^([01][0-9]|2[0-3]):[0-5][0-9]$; minutes-since-midnight(send_window_end) > minutes-since-midnight(send_window_start)"
      - name: daily_send_cap
        type: integer
        source: input
        description: maximum number of ReviewRequests this campaign may move to SENT per UTC calendar day
        constraints: ">= 1"
      - name: credits_allocated
        type: integer
        source: input
        description: total message credits granted to this campaign
        constraints: ">= 0"
      - name: credits_reserved
        type: integer
        source: computed
        description: credits currently held by QUEUED ReviewRequests of this campaign
        default: 0
      - name: credits_consumed
        type: integer
        source: computed
        description: credits burnt by ReviewRequests of this campaign that reached SENT
        default: 0
      - name: credits_released
        type: integer
        source: computed
        description: credits given back by ReviewRequests of this campaign that ended SUPPRESSED
        default: 0
      - name: status
        type: enum
        source: system
        description: campaign lifecycle state
        default: DRAFT
        constraints: "one of {DRAFT, SCHEDULED, RUNNING, PAUSED, COMPLETED}"
      - name: activated_at
        type: datetime
        source: system
        description: logical-clock instant of the first DRAFT-chain entry into RUNNING; anchors the BROAD attribution window; null before first activation
      - name: sent_count
        type: integer
        source: computed
        description: count of this campaign's ReviewRequest rows whose status IN {SENT, DELIVERED, CLICKED, CONVERTED, FAILED}
        default: 0
      - name: billing_cost
        type: number
        source: computed
        description: output of calculations.campaign_billing_cost, 2 dp
        default: 0.00

  - name: ReviewRequest
    parent: Campaign
    common_fields: true
    fields:
      - name: campaign_id
        type: string
        source: input
        description: "FK -> Campaign.id"
      - name: contact_id
        type: string
        source: input
        description: "FK -> Contact.id"
      - name: channel
        type: enum
        source: system
        description: copied from the parent Campaign.channel at enqueue time
        constraints: "one of {SMS, EMAIL}"
      - name: status
        type: enum
        source: system
        description: request delivery lifecycle state
        default: QUEUED
        constraints: "one of {QUEUED, SENT, DELIVERED, CLICKED, CONVERTED, FAILED, SUPPRESSED}"
      - name: send_index
        type: integer
        source: system
        description: 1-based billable index within the parent campaign, assigned in created_at ASC order at the moment the request enters SENT; null while QUEUED or SUPPRESSED
      - name: unit_cost
        type: number
        source: computed
        description: per-message cost of this request from calculations.campaign_billing_cost, rounded to 2 dp round_half_up; null while QUEUED or SUPPRESSED
      - name: sent_at
        type: datetime
        source: system
        description: logical-clock instant this request entered SENT; anchors the STRICT attribution window
      - name: converted_review_id
        type: string
        source: system
        description: id of the Review that attributed to this request; identity only, never a decision input

  - name: Review
    parent: Location
    common_fields: true
    fields:
      - name: location_id
        type: string
        source: input
        description: "FK -> Location.id"
      - name: review_request_id
        type: string
        source: input
        description: "FK -> ReviewRequest.id; null for organic reviews that no campaign produced"
      - name: site
        type: enum
        source: input
        description: site the review was aggregated from
        constraints: "one of {GOOGLE, YELP, FACEBOOK}"
      - name: external_review_id
        type: string
        source: input
        description: site-native review identifier; unique per (location_id, site)
      - name: author_name
        type: string
        source: input
        description: reviewer display name as published on the site
      - name: text
        type: string
        source: input
        description: review body text
      - name: rating
        type: integer
        source: input
        description: star rating
        constraints: ">= 1 and <= 5"
      - name: posted_at
        type: datetime
        source: input
        description: instant the review was published on the external site; input to the CERTIFIED decay weight and to both attribution windows
      - name: sentiment
        type: enum
        source: computed
        description: output of calculations.review_sentiment, assigned at ingest and never recomputed
        constraints: "one of {POSITIVE, NEUTRAL, NEGATIVE}"
      - name: moderation_state
        type: enum
        source: system
        description: first parallel state dimension - authenticity moderation
        default: UNVERIFIED
        constraints: "one of {UNVERIFIED, VERIFIED, FLAGGED}"
      - name: response_state
        type: enum
        source: system
        description: second parallel state dimension - reply workflow, driven by the ReviewResponse state machine
        default: NONE
        constraints: "one of {NONE, DRAFTED, AWAITING_APPROVAL, APPROVED, RESPONDED}"

  - name: ReviewResponse
    parent: Review
    common_fields: true
    fields:
      - name: review_id
        type: string
        source: input
        description: "FK -> Review.id"
      - name: template_id
        type: string
        source: input
        description: "FK -> ResponseTemplate.id; null for a free-form response that no template backs"
      - name: body
        type: string
        source: input
        description: reply text that will be published to the site
      - name: state
        type: enum
        source: system
        description: reply approval lifecycle, cyclic through REJECTED -> DRAFT
        default: DRAFT
        constraints: "one of {DRAFT, PENDING_APPROVAL, APPROVED, REJECTED, PUBLISHED}"
      - name: drafted_by_user_id
        type: string
        source: system
        description: X-User-ID of the actor who created this response; the segregation-of-duties comparison key
      - name: approved_by_user_id
        type: string
        source: system
        description: X-User-ID of the actor who approved this response; null until APPROVED
      - name: rejection_reason
        type: string
        source: system
        description: free text supplied at reject; null unless the response has been rejected at least once
      - name: revision_count
        type: integer
        source: system
        description: number of REJECTED -> DRAFT revise transitions this response has gone through
        default: 0
      - name: published_at
        type: datetime
        source: system
        description: logical-clock instant this response reached PUBLISHED; null otherwise

  - name: Escalation
    parent: Review
    common_fields: true
    fields:
      - name: review_id
        type: string
        source: input
        description: "FK -> Review.id"
      - name: reason
        type: enum
        source: system
        description: why the escalation opened
        default: NEGATIVE_SENTIMENT
        constraints: "one of {NEGATIVE_SENTIMENT}"
      - name: state
        type: enum
        source: system
        description: escalation lifecycle state
        default: OPEN
        constraints: "one of {OPEN, ACKNOWLEDGED, RESOLVED, CANCELLED}"
      - name: acknowledged_by_user_id
        type: string
        source: system
        description: X-User-ID of the actor who acknowledged; null until ACKNOWLEDGED
      - name: resolved_at
        type: datetime
        source: system
        description: logical-clock instant of RESOLVED; null otherwise

  - name: SurveyResponse
    parent: Location
    common_fields: true
    fields:
      - name: location_id
        type: string
        source: input
        description: "FK -> Location.id"
      - name: contact_id
        type: string
        source: input
        description: "FK -> Contact.id"
      - name: status
        type: enum
        source: system
        description: survey lifecycle state
        default: PENDING
        constraints: "one of {PENDING, SUBMITTED}"
      - name: nps_score
        type: integer
        source: input
        description: NPS answer supplied at submit; null while PENDING
        constraints: ">= 0 and <= 10"
      - name: nps_category
        type: enum
        source: computed
        description: output of calculations.nps_score's bucketing step; null while PENDING
        constraints: "one of {PROMOTER, PASSIVE, DETRACTOR}"
      - name: comment
        type: string
        source: input
        description: optional free-text comment supplied at submit
      - name: submitted_at
        type: datetime
        source: system
        description: logical-clock instant of submit; null while PENDING
      - name: expires_at
        type: datetime
        source: system
        description: created_at + SURVEY_TTL_DAYS (14 days); submit at or after this instant is rejected

  - name: Widget
    parent: Location
    common_fields: true
    fields:
      - name: location_id
        type: string
        source: input
        description: "FK -> Location.id; at most one Widget row per Location"
      - name: min_rating
        type: integer
        source: input
        description: lowest Review.rating the public widget feed will display
        default: 4
        constraints: ">= 1 and <= 5"
      - name: max_reviews
        type: integer
        source: input
        description: maximum number of reviews the public widget feed will display
        default: 10
        constraints: ">= 1 and <= 50"
      - name: status
        type: enum
        source: system
        description: widget publication state
        default: DRAFT
        constraints: "one of {DRAFT, PUBLISHED}"
      - name: embed_token
        type: string
        source: system
        description: opaque token embedded in the customer's website; identity only, never a decision input
      - name: published_at
        type: datetime
        source: system
        description: logical-clock instant of publish; null while DRAFT

  - name: Alert
    parent: Location
    common_fields: false
    fields:
      - name: location_id
        type: string
        source: input
        description: "FK -> Location.id"
      - name: alert_type
        type: enum
        source: system
        description: what fired the alert
        constraints: "one of {NEGATIVE_REVIEW, POSTURE_CHANGED, LISTING_SYNC_FAILED, NPS_DETRACTOR, SEND_CAP_REACHED}"
      - name: severity
        type: enum
        source: system
        description: alert severity, fixed per alert_type - NEGATIVE_REVIEW/LISTING_SYNC_FAILED/NPS_DETRACTOR -> WARNING, POSTURE_CHANGED -> CRITICAL, SEND_CAP_REACHED -> INFO
        constraints: "one of {INFO, WARNING, CRITICAL}"
      - name: message
        type: string
        source: system
        description: human-readable alert text
      - name: payload_ref_id
        type: string
        source: system
        description: id of the entity that triggered the alert; identity only, never a decision input

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  # --- Location: posture_driven derived gate -------------------------------
  - entity: Location
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: RESTRICTED
        trigger: "system: calculations.location_posture re-evaluates to RESTRICTED after any of POST /reputation/locations/{id}/reviews, POST /reputation/reviews/{id}/flag, POST /reputation/reviews/{id}/verify, POST /reputation/review-responses/{id}/publish, POST /reputation/listings/{id}/sync, PUT /reputation/locations/{id}/nap, POST /reputation/escalations/{id}/acknowledge, POST /reputation/escalations/{id}/resolve"
        actor: system
        preconditions:
          - "compliance_hold == false"
          - "(review_count >= 3 AND reputation_score_provisional < 60.00) OR open_escalation_count >= 3 OR listing_health_score < 40.00"
        side_effects:
          - "CASCADE LINK 2 of the review-ingest chain: every Campaign of this Location with status == RUNNING is transitioned RUNNING -> PAUSED by the system (see Campaign machine), which in turn drives CASCADE LINK 3"
          - "append Alert{alert_type: POSTURE_CHANGED, severity: CRITICAL, payload_ref_id: Location.id, message: 'posture OPEN -> RESTRICTED'}"
          - "Location.version += 1; Location.updated_at := current_utc"
        note: "Boundary is inclusive on the score side: with review_count >= 3, reputation_score_provisional == 60.00 stays OPEN while 59.99 restricts. Below 3 reviews the score predicate is not armed at all."
      - from: RESTRICTED
        to: OPEN
        trigger: "system: calculations.location_posture re-evaluates to OPEN after the same set of mutations listed on OPEN -> RESTRICTED"
        actor: system
        preconditions:
          - "compliance_hold == false"
          - "(review_count < 3 OR reputation_score_provisional >= 60.00) AND open_escalation_count < 3 AND listing_health_score >= 40.00"
        side_effects:
          - "append Alert{alert_type: POSTURE_CHANGED, severity: CRITICAL, payload_ref_id: Location.id, message: 'posture RESTRICTED -> OPEN'}"
          - "Campaigns paused by the system are NOT auto-resumed; a LocationManager must call POST /reputation/campaigns/{id}/activate again"
          - "Location.version += 1; Location.updated_at := current_utc"
      - from: OPEN
        to: FROZEN
        trigger: "POST /reputation/locations/{id}/compliance-hold with on_hold == true"
        actor: PlatformAdmin
        preconditions:
          - "compliance_hold == false"
        side_effects:
          - "compliance_hold := true"
          - "every Campaign of this Location with status == RUNNING is transitioned RUNNING -> PAUSED by the system"
          - "every Widget of this Location with status == PUBLISHED is reverted to DRAFT and published_at := null"
          - "append Alert{alert_type: POSTURE_CHANGED, severity: CRITICAL, payload_ref_id: Location.id}"
          - "Location.version += 1"
      - from: RESTRICTED
        to: FROZEN
        trigger: "POST /reputation/locations/{id}/compliance-hold with on_hold == true"
        actor: PlatformAdmin
        preconditions:
          - "compliance_hold == false"
        side_effects:
          - "same side effects as OPEN -> FROZEN"
      - from: FROZEN
        to: OPEN
        trigger: "POST /reputation/locations/{id}/compliance-hold with on_hold == false, when calculations.location_posture then yields OPEN"
        actor: PlatformAdmin
        preconditions:
          - "compliance_hold == true"
          - "after clearing the hold: (review_count < 3 OR reputation_score_provisional >= 60.00) AND open_escalation_count < 3 AND listing_health_score >= 40.00"
        side_effects:
          - "compliance_hold := false"
          - "append Alert{alert_type: POSTURE_CHANGED, severity: CRITICAL, payload_ref_id: Location.id}"
          - "Location.version += 1"
      - from: FROZEN
        to: RESTRICTED
        trigger: "POST /reputation/locations/{id}/compliance-hold with on_hold == false, when calculations.location_posture then yields RESTRICTED"
        actor: PlatformAdmin
        preconditions:
          - "compliance_hold == true"
          - "after clearing the hold: (review_count >= 3 AND reputation_score_provisional < 60.00) OR open_escalation_count >= 3 OR listing_health_score < 40.00"
        side_effects:
          - "compliance_hold := false"
          - "append Alert{alert_type: POSTURE_CHANGED, severity: CRITICAL, payload_ref_id: Location.id}"
          - "Location.version += 1"

  # --- Listing: cyclic NAP sync --------------------------------------------
  - entity: Listing
    initial_state: PENDING_SYNC
    terminal_states: [DISCONNECTED]
    transitions:
      - from: PENDING_SYNC
        to: CONNECTED
        trigger: "POST /reputation/listings/{id}/sync with outcome == SUCCESS"
        actor: BusinessOwner
        preconditions:
          - "Location.posture != FROZEN"
        side_effects:
          - "listed_nap_name := Location.nap_name; listed_nap_address := Location.nap_address; listed_nap_phone := Location.nap_phone; nap_match_count := 3"
          - "last_synced_at := current_utc; sync_failure_count := 0"
          - "recompute Location.listing_health_score, then Location.reputation_score_provisional, then Location.posture"
      - from: SYNC_FAILED
        to: CONNECTED
        trigger: "POST /reputation/listings/{id}/sync with outcome == SUCCESS"
        actor: BusinessOwner
        preconditions:
          - "Location.posture != FROZEN"
          - "sync_failure_count < 3"
        side_effects:
          - "same side effects as PENDING_SYNC -> CONNECTED"
      - from: PENDING_SYNC
        to: SYNC_FAILED
        trigger: "POST /reputation/listings/{id}/sync with outcome == FAILURE"
        actor: BusinessOwner
        preconditions:
          - "Location.posture != FROZEN"
        side_effects:
          - "sync_failure_count += 1; listed_nap_* left untouched"
          - "append Alert{alert_type: LISTING_SYNC_FAILED, severity: WARNING, payload_ref_id: Listing.id}"
          - "recompute Location.listing_health_score, then Location.reputation_score_provisional, then Location.posture"
      - from: SYNC_FAILED
        to: SYNC_FAILED
        trigger: "POST /reputation/listings/{id}/sync with outcome == FAILURE and resulting sync_failure_count < 3"
        actor: BusinessOwner
        preconditions:
          - "Location.posture != FROZEN"
          - "sync_failure_count < 2 (so the increment keeps it below MAX_SYNC_FAILURES)"
        side_effects:
          - "sync_failure_count += 1"
          - "append Alert{alert_type: LISTING_SYNC_FAILED, severity: WARNING, payload_ref_id: Listing.id}"
          - "recompute Location.listing_health_score, then Location.reputation_score_provisional, then Location.posture"
      - from: SYNC_FAILED
        to: DISCONNECTED
        trigger: "POST /reputation/listings/{id}/sync with outcome == FAILURE where the increment makes sync_failure_count reach MAX_SYNC_FAILURES (3)"
        actor: BusinessOwner
        preconditions:
          - "Location.posture != FROZEN"
          - "sync_failure_count == 2"
        side_effects:
          - "sync_failure_count := 3"
          - "append Alert{alert_type: LISTING_SYNC_FAILED, severity: WARNING, payload_ref_id: Listing.id}"
          - "recompute Location.listing_health_score (DISCONNECTED contributes state_factor 0.0), then Location.reputation_score_provisional, then Location.posture"
        note: "DISCONNECTED is terminal: further sync calls are rejected with ERR_INVALID_STATE."
      - from: CONNECTED
        to: PENDING_SYNC
        trigger: "system: PUT /reputation/locations/{id}/nap changed at least one nap_* part"
        actor: system
        preconditions:
          - "Listing.sync_state == CONNECTED"
        side_effects:
          - "listed_nap_* left at their old site values, so nap_match_count drops for every part that changed"
          - "recompute Location.listing_health_score, then Location.reputation_score_provisional, then Location.posture"

  # --- Review: PARALLEL state dimensions (moderation_state x response_state)
  - entity: Review
    initial_state: UNVERIFIED
    terminal_states: []
    transitions:
      # dimension 1: moderation_state
      - from: UNVERIFIED
        to: VERIFIED
        trigger: "POST /reputation/reviews/{id}/verify"
        actor: LocationManager
        preconditions:
          - "moderation_state == UNVERIFIED"
          - "Location.posture != FROZEN"
        side_effects:
          - "moderation_state := VERIFIED; response_state is untouched (independent dimension)"
          - "recompute Location.reputation_score_provisional (input set unchanged) and Location.posture"
      - from: FLAGGED
        to: VERIFIED
        trigger: "POST /reputation/reviews/{id}/verify (reinstatement after a false flag)"
        actor: LocationManager
        preconditions:
          - "moderation_state == FLAGGED"
          - "Location.posture != FROZEN"
        side_effects:
          - "moderation_state := VERIFIED; the review re-enters Location.review_count / avg_rating / sentiment_* counters"
          - "if sentiment == NEGATIVE: a fresh Escalation{state: OPEN, reason: NEGATIVE_SENTIMENT} is appended and Location.open_escalation_count += 1"
          - "recompute Location.reputation_score_provisional and Location.posture"
        note: "FLAGGED -> VERIFIED closes the moderation cycle UNVERIFIED -> FLAGGED -> VERIFIED."
      - from: UNVERIFIED
        to: FLAGGED
        trigger: "POST /reputation/reviews/{id}/flag"
        actor: LocationManager
        preconditions:
          - "moderation_state == UNVERIFIED"
          - "Location.posture != FROZEN"
        side_effects:
          - "moderation_state := FLAGGED; the review leaves every Location counter and both score input sets"
          - "every Escalation of this review whose state IN {OPEN, ACKNOWLEDGED} -> CANCELLED; Location.open_escalation_count -= 1 per cancelled escalation"
          - "recompute Location.review_count, avg_rating, sentiment_* counters, reputation_score_provisional, then Location.posture"
      - from: VERIFIED
        to: FLAGGED
        trigger: "POST /reputation/reviews/{id}/flag"
        actor: LocationManager
        preconditions:
          - "moderation_state == VERIFIED"
          - "Location.posture != FROZEN"
        side_effects:
          - "same side effects as UNVERIFIED -> FLAGGED"
      # dimension 2: response_state
      - from: NONE
        to: DRAFTED
        trigger: "POST /reputation/reviews/{id}/responses"
        actor: ResponseAgent
        preconditions:
          - "response_state == NONE"
          - "moderation_state != FLAGGED"
        side_effects:
          - "response_state := DRAFTED; moderation_state is untouched (independent dimension)"
          - "Review.version += 1 (the OCC counter the response-create endpoint checks)"
      - from: DRAFTED
        to: AWAITING_APPROVAL
        trigger: "POST /reputation/review-responses/{id}/submit where the response has template_id == null OR ResponseTemplate.requires_approval == true"
        actor: ResponseAgent
        preconditions:
          - "response_state == DRAFTED"
        side_effects:
          - "response_state := AWAITING_APPROVAL"
      - from: DRAFTED
        to: APPROVED
        trigger: "POST /reputation/review-responses/{id}/submit where the response has a template_id whose ResponseTemplate.requires_approval == false"
        actor: ResponseAgent
        preconditions:
          - "response_state == DRAFTED"
        side_effects:
          - "response_state := APPROVED (the conditional feature flag skips the approval hop)"
      - from: AWAITING_APPROVAL
        to: APPROVED
        trigger: "POST /reputation/review-responses/{id}/approve"
        actor: ComplianceOfficer
        preconditions:
          - "response_state == AWAITING_APPROVAL"
        side_effects:
          - "response_state := APPROVED"
      - from: AWAITING_APPROVAL
        to: DRAFTED
        trigger: "POST /reputation/review-responses/{id}/reject followed by POST /reputation/review-responses/{id}/revise"
        actor: ResponseAgent
        preconditions:
          - "response_state == AWAITING_APPROVAL"
        side_effects:
          - "response_state := DRAFTED (the reply-workflow revision cycle)"
      - from: APPROVED
        to: RESPONDED
        trigger: "POST /reputation/review-responses/{id}/publish"
        actor: ComplianceOfficer
        preconditions:
          - "response_state == APPROVED"
          - "the Listing for (Review.location_id, Review.site) exists and has sync_state == CONNECTED"
        side_effects:
          - "response_state := RESPONDED"
          - "CASCADE LINK 2 of the publish chain: every Escalation of this Review whose state IN {OPEN, ACKNOWLEDGED} -> RESOLVED (see Escalation machine), which in turn drives CASCADE LINK 3"
          - "recompute Location.responded_review_count, then Location.reputation_score_provisional, then Location.posture"

  # --- ReviewResponse: cyclic approval loop ---------------------------------
  - entity: ReviewResponse
    initial_state: DRAFT
    terminal_states: [PUBLISHED]
    transitions:
      - from: DRAFT
        to: PENDING_APPROVAL
        trigger: "POST /reputation/review-responses/{id}/submit"
        actor: ResponseAgent
        preconditions:
          - "state == DRAFT"
          - "template_id == null OR ResponseTemplate.requires_approval == true"
          - "Location.posture != FROZEN"
        side_effects:
          - "Review.response_state := AWAITING_APPROVAL"
      - from: DRAFT
        to: APPROVED
        trigger: "POST /reputation/review-responses/{id}/submit"
        actor: ResponseAgent
        preconditions:
          - "state == DRAFT"
          - "template_id != null AND ResponseTemplate.requires_approval == false"
          - "Location.posture != FROZEN"
        side_effects:
          - "approved_by_user_id := null (auto-approval carries no human approver)"
          - "Review.response_state := APPROVED"
        note: "Conditional feature flag: requires_approval == false collapses submit+approve into one hop and bypasses the segregation-of-duties check entirely."
      - from: PENDING_APPROVAL
        to: APPROVED
        trigger: "POST /reputation/review-responses/{id}/approve"
        actor: ComplianceOfficer
        preconditions:
          - "state == PENDING_APPROVAL"
          - "X-User-ID != drafted_by_user_id (segregation of duties)"
          - "Location.posture != FROZEN"
        side_effects:
          - "approved_by_user_id := X-User-ID"
          - "Review.response_state := APPROVED"
      - from: PENDING_APPROVAL
        to: REJECTED
        trigger: "POST /reputation/review-responses/{id}/reject"
        actor: ComplianceOfficer
        preconditions:
          - "state == PENDING_APPROVAL"
          - "X-User-ID != drafted_by_user_id (segregation of duties)"
          - "Location.posture != FROZEN"
        side_effects:
          - "rejection_reason := input rejection_reason"
          - "Review.response_state stays AWAITING_APPROVAL until the response is revised"
      - from: REJECTED
        to: DRAFT
        trigger: "POST /reputation/review-responses/{id}/revise"
        actor: ResponseAgent
        preconditions:
          - "state == REJECTED"
          - "Location.posture != FROZEN"
        side_effects:
          - "body := input body; revision_count += 1"
          - "Review.response_state := DRAFTED"
        note: "Closes the cycle DRAFT -> PENDING_APPROVAL -> REJECTED -> DRAFT."
      - from: APPROVED
        to: PUBLISHED
        trigger: "POST /reputation/review-responses/{id}/publish"
        actor: ComplianceOfficer
        preconditions:
          - "state == APPROVED"
          - "Location.posture != FROZEN"
          - "the Listing for (Review.location_id, Review.site) exists and has sync_state == CONNECTED, else ERR_LISTING_NOT_CONNECTED"
        side_effects:
          - "published_at := current_utc"
          - "CASCADE LINK 1 of the publish chain: Review.response_state := RESPONDED"
          - "which drives CASCADE LINK 2 (open/acknowledged Escalations of that Review -> RESOLVED) and CASCADE LINK 3 (Location.open_escalation_count -= 1, recompute reputation_score_provisional, recompute posture)"

  # --- Escalation: branching ------------------------------------------------
  - entity: Escalation
    initial_state: OPEN
    terminal_states: [RESOLVED, CANCELLED]
    transitions:
      - from: OPEN
        to: ACKNOWLEDGED
        trigger: "POST /reputation/escalations/{id}/acknowledge"
        actor: LocationManager
        preconditions:
          - "state == OPEN"
          - "Location.posture != FROZEN"
        side_effects:
          - "acknowledged_by_user_id := X-User-ID"
          - "Location.open_escalation_count is unchanged (ACKNOWLEDGED still counts as open)"
      - from: OPEN
        to: RESOLVED
        trigger: "POST /reputation/escalations/{id}/resolve"
        actor: LocationManager
        preconditions:
          - "state == OPEN"
          - "Review.response_state == RESPONDED, else ERR_REVIEW_NOT_RESPONDED"
          - "Location.posture != FROZEN"
        side_effects:
          - "resolved_at := current_utc"
          - "Location.open_escalation_count -= 1; recompute Location.posture"
      - from: ACKNOWLEDGED
        to: RESOLVED
        trigger: "POST /reputation/escalations/{id}/resolve, or system cascade from POST /reputation/review-responses/{id}/publish"
        actor: LocationManager
        preconditions:
          - "state == ACKNOWLEDGED"
          - "Review.response_state == RESPONDED for the manual trigger; the system cascade sets RESPONDED itself"
        side_effects:
          - "resolved_at := current_utc"
          - "CASCADE LINK 3 of the publish chain: Location.open_escalation_count -= 1, then recompute Location.reputation_score_provisional, then recompute Location.posture (RESTRICTED -> OPEN when all three posture predicates clear)"
      - from: OPEN
        to: CANCELLED
        trigger: "system cascade from POST /reputation/reviews/{id}/flag"
        actor: system
        preconditions:
          - "state == OPEN"
          - "Review.moderation_state transitioned to FLAGGED"
        side_effects:
          - "Location.open_escalation_count -= 1; recompute Location.posture"
        note: "Compensating action for the ingest-time auto-escalation; restores open_escalation_count to its pre-ingest value."
      - from: ACKNOWLEDGED
        to: CANCELLED
        trigger: "system cascade from POST /reputation/reviews/{id}/flag"
        actor: system
        preconditions:
          - "state == ACKNOWLEDGED"
          - "Review.moderation_state transitioned to FLAGGED"
        side_effects:
          - "Location.open_escalation_count -= 1; recompute Location.posture"

  # --- Campaign: cyclic RUNNING <-> PAUSED ----------------------------------
  - entity: Campaign
    initial_state: DRAFT
    terminal_states: [COMPLETED]
    transitions:
      - from: DRAFT
        to: SCHEDULED
        trigger: "POST /reputation/campaigns/{id}/schedule"
        actor: LocationManager
        preconditions:
          - "status == DRAFT"
          - "Location.posture != FROZEN"
          - "no other Campaign at the same Location with the same channel and status IN {SCHEDULED, RUNNING, PAUSED} has a buffered send-window collision (see validations priority 21)"
        side_effects:
          - "status := SCHEDULED"
      - from: SCHEDULED
        to: RUNNING
        trigger: "POST /reputation/campaigns/{id}/activate"
        actor: LocationManager
        preconditions:
          - "status == SCHEDULED"
          - "Location.posture == OPEN, else ERR_LOCATION_RESTRICTED (RESTRICTED) / ERR_LOCATION_FROZEN (FROZEN)"
        side_effects:
          - "status := RUNNING; if activated_at == null then activated_at := current_utc (anchors the BROAD attribution window; a later re-activation does not move it)"
      - from: PAUSED
        to: RUNNING
        trigger: "POST /reputation/campaigns/{id}/activate"
        actor: LocationManager
        preconditions:
          - "status == PAUSED"
          - "Location.posture == OPEN"
        side_effects:
          - "status := RUNNING; activated_at is NOT moved"
        note: "Closes the cycle RUNNING -> PAUSED -> RUNNING."
      - from: RUNNING
        to: PAUSED
        trigger: "POST /reputation/campaigns/{id}/pause"
        actor: LocationManager
        preconditions:
          - "status == RUNNING"
        side_effects:
          - "status := PAUSED; QUEUED ReviewRequests are left QUEUED and their credits stay reserved"
      - from: RUNNING
        to: PAUSED
        trigger: "system cascade: Location.posture left OPEN (OPEN -> RESTRICTED or OPEN/RESTRICTED -> FROZEN)"
        actor: system
        preconditions:
          - "status == RUNNING"
        side_effects:
          - "status := PAUSED"
          - "CASCADE LINK 3 of the review-ingest chain: every ReviewRequest of this campaign with status == QUEUED -> SUPPRESSED; per suppressed request Campaign.credits_reserved -= 1 and Campaign.credits_released += 1"
        note: "A system pause (unlike the manual pause) empties the queue, so the ingest cascade reaches depth 3: Review -> Location -> Campaign -> ReviewRequest."
      - from: RUNNING
        to: COMPLETED
        trigger: "POST /reputation/campaigns/{id}/complete"
        actor: LocationManager
        preconditions:
          - "status == RUNNING"
          - "Location.posture != FROZEN"
        side_effects:
          - "status := COMPLETED"
          - "every ReviewRequest of this campaign with status == QUEUED -> SUPPRESSED; per suppressed request credits_reserved -= 1 and credits_released += 1"
      - from: PAUSED
        to: COMPLETED
        trigger: "POST /reputation/campaigns/{id}/complete"
        actor: LocationManager
        preconditions:
          - "status == PAUSED"
          - "Location.posture != FROZEN"
        side_effects:
          - "same side effects as RUNNING -> COMPLETED"

  # --- ReviewRequest: linear with branch-outs --------------------------------
  - entity: ReviewRequest
    initial_state: QUEUED
    terminal_states: [CONVERTED, FAILED, SUPPRESSED]
    transitions:
      - from: QUEUED
        to: SENT
        trigger: "POST /reputation/campaigns/{id}/send-batch"
        actor: LocationManager
        preconditions:
          - "Campaign.status == RUNNING"
          - "Location.posture != FROZEN"
          - "Campaign.credits_allocated - Campaign.credits_consumed >= 1"
          - "the count of this campaign's requests already moved to SENT on the current UTC calendar day is < Campaign.daily_send_cap"
        side_effects:
          - "send_index := (max send_index already assigned in this campaign) + 1, assigned across the batch in created_at ASC order"
          - "unit_cost := round_half_up(BASE_RATE[channel] * VOLUME_DISCOUNT(send_index), 2); Campaign.billing_cost := sum of the rounded unit_cost values"
          - "sent_at := current_utc"
          - "Campaign.credits_reserved -= 1; Campaign.credits_consumed += 1; Campaign.sent_count += 1"
          - "Contact of this request: no change (last_requested_at was already stamped at enqueue)"
          - "when the daily cap is reached exactly by this batch: append Alert{alert_type: SEND_CAP_REACHED, severity: INFO, payload_ref_id: Campaign.id}"
      - from: SENT
        to: DELIVERED
        trigger: "POST /reputation/review-requests/{id}/events with event_type == DELIVERED"
        actor: PlatformAdmin
        preconditions:
          - "status == SENT"
        side_effects: []
      - from: DELIVERED
        to: CLICKED
        trigger: "POST /reputation/review-requests/{id}/events with event_type == CLICKED"
        actor: PlatformAdmin
        preconditions:
          - "status == DELIVERED"
        side_effects: []
      - from: SENT
        to: FAILED
        trigger: "POST /reputation/review-requests/{id}/events with event_type == FAILED"
        actor: PlatformAdmin
        preconditions:
          - "status == SENT"
        side_effects:
          - "credits stay consumed: a failed delivery is billable"
      - from: SENT
        to: CONVERTED
        trigger: "system cascade: POST /reputation/locations/{id}/reviews carrying review_request_id == this request"
        actor: system
        preconditions:
          - "status IN {SENT, DELIVERED, CLICKED}"
          - "the ingested Review.posted_at is inside [sent_at, sent_at + 14 days) (half-open ATTRIBUTION window)"
        side_effects:
          - "converted_review_id := the new Review.id"
      - from: DELIVERED
        to: CONVERTED
        trigger: "system cascade: POST /reputation/locations/{id}/reviews carrying review_request_id == this request"
        actor: system
        preconditions:
          - "status == DELIVERED"
          - "the ingested Review.posted_at is inside [sent_at, sent_at + 14 days)"
        side_effects:
          - "converted_review_id := the new Review.id"
      - from: CLICKED
        to: CONVERTED
        trigger: "system cascade: POST /reputation/locations/{id}/reviews carrying review_request_id == this request"
        actor: system
        preconditions:
          - "status == CLICKED"
          - "the ingested Review.posted_at is inside [sent_at, sent_at + 14 days)"
        side_effects:
          - "converted_review_id := the new Review.id"
      - from: QUEUED
        to: SUPPRESSED
        trigger: "POST /reputation/review-requests/{id}/cancel, or system cascade from a Campaign system-pause / complete"
        actor: LocationManager
        preconditions:
          - "status == QUEUED"
        side_effects:
          - "Campaign.credits_reserved -= 1; Campaign.credits_released += 1 (compensating action; the conserved quantity credits_allocated - credits_reserved - credits_consumed returns to its pre-enqueue value)"
          - "Contact.last_requested_at is NOT rolled back: the frequency-cap window survives cancellation"

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC only)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: campaign-create-stale-location
    parent_entity: Location
    write_endpoint: "POST /reputation/locations/{id}/campaigns"
    occ_field: "expected_location_version"
    description: |
      Creating a Campaign against a Location whose version has advanced since the
      client last read it is rejected. A campaign's send-window admissibility and
      its activation gate are both functions of the Location's posture and of the
      other campaigns already attached to it, so a create carrying a stale
      location version is acting on a view of the Location that no longer holds.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: response-create-stale-review
    parent_entity: Review
    write_endpoint: "POST /reputation/reviews/{id}/responses"
    occ_field: "expected_review_version"
    description: |
      Creating a ReviewResponse against a Review whose version has advanced since
      the client last read it is rejected. A newly drafted response legitimately
      supersedes the reply workflow on that Review (it flips response_state to
      DRAFTED), so a second create carrying the version the client observed before
      the first draft existed is acting on a stale Review.
    error_id: ERR_STALE_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: review_sentiment
    trigger: "POST /reputation/locations/{id}/reviews (ingest); assigned once, never recomputed"
    algorithm: threshold
    formula: |
      if rating >= POSITIVE_MIN_RATING:      sentiment = POSITIVE
      elif rating <= NEGATIVE_MAX_RATING:    sentiment = NEGATIVE
      else:                                  sentiment = NEUTRAL
      # rating == 3 is the only NEUTRAL value: 4,5 -> POSITIVE; 1,2 -> NEGATIVE
      if sentiment == NEGATIVE:
          append Escalation{review_id: review.id, reason: NEGATIVE_SENTIMENT, state: OPEN}
          Location.open_escalation_count += 1
          append Alert{alert_type: NEGATIVE_REVIEW, severity: WARNING, payload_ref_id: review.id}
    input_set: "the single Review being ingested"
    constants:
      POSITIVE_MIN_RATING: 4
      NEGATIVE_MAX_RATING: 2
    precision: "integer comparison; no rounding"

  - name: listing_health_score
    trigger: "recomputed on POST /reputation/locations/{id}/listings, POST /reputation/listings/{id}/sync, PUT /reputation/locations/{id}/nap"
    algorithm: weighted_scoring
    formula: |
      # Per-site score; the three sites are ALWAYS weighted, so a site with no
      # Listing row contributes 0 for its weight (absence is penalised).
      def site_score(L):                       # L = the Listing for that site, or None
          if L is None: return 0.0
          nap_match = (1 if L.listed_nap_name    == Location.nap_name    else 0) \
                    + (1 if L.listed_nap_address == Location.nap_address else 0) \
                    + (1 if L.listed_nap_phone   == Location.nap_phone   else 0)
          site_base = (nap_match / 3) * 100                       # exact, no intermediate rounding
          state_factor = {CONNECTED: 1.0, PENDING_SYNC: 0.6,
                          SYNC_FAILED: 0.3, DISCONNECTED: 0.0}[L.sync_state]
          staleness_days = STALE_MAX_DAYS if L.last_synced_at is None \
                           else floor((current_utc - L.last_synced_at) / 86400 seconds)
          staleness_penalty = min(30, 2 * max(0, staleness_days - STALE_GRACE_DAYS))
          return max(0.0, min(100.0, site_base * state_factor - staleness_penalty))

      listing_health_score = round_half_up(
            0.5 * site_score(listing_for(GOOGLE))
          + 0.3 * site_score(listing_for(YELP))
          + 0.2 * site_score(listing_for(FACEBOOK)), 2)
    input_set: "every Listing row of the Location, keyed by site; a site with no row scores 0.0"
    constants:
      SITE_WEIGHT_GOOGLE: 0.5
      SITE_WEIGHT_YELP: 0.3
      SITE_WEIGHT_FACEBOOK: 0.2
      STALE_GRACE_DAYS: 7
      STALE_MAX_DAYS: 365
      MAX_STALENESS_PENALTY: 30
    precision: "2 decimal places, round_half_up, applied ONCE at the very end; site_base and state_factor products are kept exact"

  - name: location_reputation_score
    trigger: "PROVISIONAL variant recomputed on POST /reputation/locations/{id}/reviews, POST /reputation/reviews/{id}/verify, POST /reputation/reviews/{id}/flag, POST /reputation/review-responses/{id}/publish, POST /reputation/listings/{id}/sync, PUT /reputation/locations/{id}/nap, POST /reputation/escalations/{id}/resolve; CERTIFIED variant recomputed ONLY on POST /reputation/locations/{id}/certify"
    algorithm: weighted_scoring
    formula: |
      # Shared shape; the VARIANT decides the input set, the weighting and the response denominator.
      rating_component  = (avg_rating_of_variant / 5) * 60
      response_component = response_rate_of_variant * 25
      listing_component  = (Location.listing_health_score / 100) * 15
      score = round_half_up(rating_component + response_component + listing_component, 2)
      # avg_rating_of_variant  == 0 when the variant's review set is empty -> rating_component 0
      # response_rate_of_variant == 0 when the variant's review set is empty -> response_component 0
    input_set: "see variants; FLAGGED reviews are excluded from BOTH variants"
    constants:
      RATING_WEIGHT: 60
      RESPONSE_WEIGHT: 25
      LISTING_WEIGHT: 15
      DECAY_PER_30_DAYS: 0.02
      DECAY_FLOOR: 0.5
    precision: "2 decimal places, round_half_up, applied once at the end of the sum"
    variants:
      - name: PROVISIONAL
        when: "written to Location.reputation_score_provisional after every review / response / listing mutation; this is the ONLY score calculations.location_posture reads"
        difference: |
          Review set S = {Review at this location with moderation_state IN {UNVERIFIED, VERIFIED}}.
          avg_rating_of_variant = mean(r.rating for r in S), 0 when S is empty. No recency weighting.
          response_rate_of_variant = count(r in S with response_state == RESPONDED) / |S|, 0 when S is empty.
      - name: CERTIFIED
        when: "written to Location.reputation_score_certified only by POST /reputation/locations/{id}/certify (audit checkpoint), together with certified_at := current_utc"
        difference: |
          Review set S = {Review at this location with moderation_state == VERIFIED} — UNVERIFIED reviews are dropped.
          Each review carries a recency weight:
            age_days = floor((current_utc - r.posted_at) / 86400 seconds)
            w(r)     = max(DECAY_FLOOR, 1 - DECAY_PER_30_DAYS * floor(age_days / 30))
          avg_rating_of_variant = sum(w(r) * r.rating for r in S) / sum(w(r) for r in S), 0 when S is empty.
          response_rate_of_variant = count(r in S with response_state == RESPONDED) / |S|, 0 when S is empty.
          Same data therefore yields a different number than PROVISIONAL whenever S differs or any review is older than 30 days.

  - name: location_posture
    trigger: "re-evaluated immediately after every mutation that changes compliance_hold, reputation_score_provisional, open_escalation_count or listing_health_score"
    algorithm: constraint_propagation
    formula: |
      if Location.compliance_hold == true:
          posture = FROZEN
      elif ((Location.review_count >= MIN_REVIEWS_FOR_SCORE_GATE
             and Location.reputation_score_provisional < POSTURE_MIN_SCORE)
            or Location.open_escalation_count >= ESCALATION_POSTURE_LIMIT
            or Location.listing_health_score < LISTING_MIN_HEALTH):
          posture = RESTRICTED
      else:
          posture = OPEN
      # The score predicate is armed only once the location has at least
      # MIN_REVIEWS_FOR_SCORE_GATE (3) non-flagged reviews: a thin sample must
      # never gate the business. The listing-health and escalation predicates
      # are always armed.
      # Evaluation order is pinned: listing_health_score is refreshed first,
      # then reputation_score_provisional (which consumes it), then posture
      # (which consumes both). No fixed-point iteration is needed.
    input_set: "the Location's own compliance_hold plus its three derived fields"
    constants:
      POSTURE_MIN_SCORE: 60.00
      ESCALATION_POSTURE_LIMIT: 3
      LISTING_MIN_HEALTH: 40.00
      MIN_REVIEWS_FOR_SCORE_GATE: 3
    precision: "comparisons on 2-dp values; once review_count >= 3, reputation_score_provisional == 60.00 exactly is OPEN (>=) while 59.99 is RESTRICTED"

  - name: campaign_billing_cost
    trigger: "recomputed on POST /reputation/campaigns/{id}/send-batch; read by GET /reputation/campaigns/{id}/metrics"
    algorithm: tiered_pricing
    formula: |
      # Billable requests, in chronological send order (created_at ASC within the campaign).
      # send_index is 1-based across the whole campaign lifetime.
      def volume_discount(i):
          if i <= 100:  return 1.00
          if i <= 500:  return 0.90
          return 0.80

      # ROUNDING ORDER IS PINNED: round EACH line to 2 dp (round_half_up) FIRST,
      # then sum the rounded lines. Summing the raw products and rounding once at
      # the end is a DIFFERENT (wrong) number - e.g. 3 SMS lines:
      #   pinned : round(0.075,2)*3 = 0.08 + 0.08 + 0.08 = 0.24
      #   wrong  : round(0.075*3, 2) = round(0.225, 2) = 0.23
      for each billable request r (status IN {SENT, DELIVERED, CLICKED, CONVERTED, FAILED}):
          r.unit_cost = round_half_up(BASE_RATE[campaign.channel] * volume_discount(r.send_index), 2)
      campaign_billing_cost = sum(r.unit_cost for r in billable requests)   # already-rounded lines
    input_set: "ReviewRequest rows of the campaign with status IN {SENT, DELIVERED, CLICKED, CONVERTED, FAILED}, ordered by created_at ASC (ties impossible: created_at is unique per row within a campaign because enqueue is serialized); QUEUED and SUPPRESSED rows are excluded"
    constants:
      BASE_RATE_SMS: 0.075
      BASE_RATE_EMAIL: 0.012
      TIER1_MAX_INDEX: 100
      TIER1_DISCOUNT: 1.00
      TIER2_MAX_INDEX: 500
      TIER2_DISCOUNT: 0.90
      TIER3_DISCOUNT: 0.80
    precision: "each line rounded to 2 dp round_half_up, THEN summed (round-then-sum, never sum-then-round)"

  - name: campaign_conversion_rate
    trigger: "GET /reputation/campaigns/{id}/metrics"
    algorithm: aggregation
    formula: |
      D = [r for r in campaign.review_requests
           if r.status IN {SENT, DELIVERED, CLICKED, CONVERTED, FAILED}]      # billable denominator
      denominator = len(D)
      if denominator == 0:
          conversion_rate_strict = 0.00
          conversion_rate_broad  = 0.00
      else:
          strict_num = count(Review v where v.review_request_id IN {r.id for r in D}
                                       and v.moderation_state == VERIFIED
                                       and r.sent_at <= v.posted_at < r.sent_at + ATTRIBUTION_DAYS)
          broad_num  = count(Review v where v.location_id == campaign.location_id
                                       and v.moderation_state IN {UNVERIFIED, VERIFIED}
                                       and campaign.activated_at <= v.posted_at
                                                                  < campaign.activated_at + ATTRIBUTION_DAYS)
          conversion_rate_strict = min(100.00, round_half_up(strict_num / denominator * 100, 2))
          conversion_rate_broad  = min(100.00, round_half_up(broad_num  / denominator * 100, 2))
    input_set: "STRICT counts only VERIFIED reviews explicitly linked to a billable request of THIS campaign, windowed on that request's sent_at; BROAD counts every non-FLAGGED review at the campaign's location inside the campaign's own activation window, linked or not (halo attribution)"
    constants:
      ATTRIBUTION_DAYS: 14
    precision: "2 decimal places, round_half_up; both rates capped at 100.00; both are 0.00 when denominator == 0"
    variants:
      - name: STRICT
        when: "surfaced as conversion_rate_strict; the number the platform bills marketing performance on"
        difference: "requires an explicit ReviewRequest link AND moderation_state == VERIFIED AND the review to sit inside [request.sent_at, request.sent_at + 14d)"
      - name: BROAD
        when: "surfaced as conversion_rate_broad; the halo number shown to the customer"
        difference: "ignores the request link and the verification state; windows on [campaign.activated_at, campaign.activated_at + 14d) instead of per-request sent_at. Same data therefore yields a different percentage than STRICT."

  - name: nps_score
    trigger: "recomputed on POST /reputation/surveys/{id}/submit; read by GET /reputation/locations/{id}/dashboard"
    algorithm: aggregation
    formula: |
      S = [s for s in location.survey_responses if s.status == SUBMITTED]
      # bucketing (also written onto SurveyResponse.nps_category at submit):
      #   nps_score >= 9            -> PROMOTER
      #   nps_score <= 6            -> DETRACTOR
      #   otherwise (7 or 8)        -> PASSIVE
      if len(S) == 0:
          nps_score = 0.00
      else:
          promoters  = count(s in S if s.nps_score >= NPS_PROMOTER_MIN)
          detractors = count(s in S if s.nps_score <= NPS_DETRACTOR_MAX)
          nps_score  = round_half_up(promoters / len(S) * 100 - detractors / len(S) * 100, 2)
      # a DETRACTOR submission also appends
      #   Alert{alert_type: NPS_DETRACTOR, severity: WARNING, payload_ref_id: survey.id}
    input_set: "SurveyResponse rows of the location with status == SUBMITTED; PENDING rows are excluded; empty set -> 0.00"
    constants:
      NPS_PROMOTER_MIN: 9
      NPS_DETRACTOR_MAX: 6
    precision: "2 decimal places, round_half_up; the two percentage terms are subtracted before the single rounding"

  - name: competitor_benchmark
    trigger: "GET /reputation/locations/{id}/dashboard"
    algorithm: aggregation
    formula: |
      C = [c for c in location.competitors]                 # every Competitor row, all sites
      if len(C) == 0:
          competitor_avg_rating = 0.00
          rating_delta          = round_half_up(Location.avg_rating, 2)
          review_volume_delta   = Location.review_count
      else:
          competitor_avg_rating = round_half_up(sum(c.avg_rating for c in C) / len(C), 2)
          rating_delta          = round_half_up(Location.avg_rating - competitor_avg_rating, 2)
          review_volume_delta   = Location.review_count
                                  - floor(sum(c.review_count for c in C) / len(C))
    input_set: "every Competitor row of the Location (Competitor is an immutable snapshot entity); empty set -> competitor_avg_rating 0.00"
    constants: {}
    precision: "2 decimal places, round_half_up for the rating terms; review_volume_delta is an integer using floor on the competitor mean"

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (ordered by priority; lowest number wins)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; X-User-Role is one of the six declared roles. Endpoints whose roles list contains Anonymous accept a request with X-User-Role: Anonymous and no X-User-ID."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role appears in the target endpoint's roles list in §1.5"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: "Tenant scoping: when X-User-Role == BusinessOwner, X-User-ID MUST equal the Business.id that owns the target resource (walk child -> Location -> Business). When X-User-Role == LocationManager, X-User-ID MUST equal the Location.id that owns the target resource."
    error_id: ERR_CROSS_TENANT_ACCESS
    http_status: 403
    applies_to: "every endpoint whose roles list contains BusinessOwner or LocationManager"

  - priority: 4
    category: existence
    check: "Every id in the path resolves, validated left-to-right"
    error_id: "ERR_BUSINESS_NOT_FOUND | ERR_LOCATION_NOT_FOUND | ERR_LISTING_NOT_FOUND | ERR_CAMPAIGN_NOT_FOUND | ERR_REQUEST_NOT_FOUND | ERR_REVIEW_NOT_FOUND | ERR_RESPONSE_NOT_FOUND | ERR_ESCALATION_NOT_FOUND | ERR_SURVEY_NOT_FOUND | ERR_WIDGET_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path parameters"

  - priority: 5
    category: existence
    check: "Every id referenced in the request BODY resolves and belongs to the same tenant: contact_id -> Contact of the same Business; template_id -> ResponseTemplate of the same Business; review_request_id -> ReviewRequest whose Campaign.location_id equals the ingest location"
    error_id: "ERR_CONTACT_NOT_FOUND | ERR_TEMPLATE_NOT_FOUND | ERR_REQUEST_NOT_FOUND"
    http_status: 404
    applies_to: "POST /reputation/campaigns/{id}/requests, POST /reputation/locations/{id}/surveys, POST /reputation/reviews/{id}/responses, POST /reputation/locations/{id}/reviews"

  - priority: 6
    category: business_constraint
    check: "Request body well-formed: every required input field present, types correct, enum members valid, rating within 1..5, nps_score within 0..10, send_window_* match HH:MM and end > start, limit within 1..100, offset >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 7
    category: state
    check: "OCC: expected_location_version equals Location.version (campaign create) / expected_review_version equals Review.version (response create)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /reputation/locations/{id}/campaigns, POST /reputation/reviews/{id}/responses"

  - priority: 8
    category: state
    check: "Location.posture != FROZEN. FROZEN gates EVERY mutating operation on the location and on every entity beneath it (listings, campaigns, requests, reviews, responses, escalations, surveys, widget), including reads-with-side-effects such as certify. The only mutations that remain legal are POST /reputation/locations/{id}/compliance-hold and POST /reputation/contacts/{id}/opt-out."
    error_id: ERR_LOCATION_FROZEN
    http_status: 409
    applies_to: "every mutating endpoint under a Location"

  - priority: 9
    category: state
    check: "Location.posture == OPEN is required to activate a campaign or publish a widget. Posture RESTRICTED rejects these two operations only (all other child operations remain legal under RESTRICTED)."
    error_id: ERR_LOCATION_RESTRICTED
    http_status: 409
    applies_to: "POST /reputation/campaigns/{id}/activate, POST /reputation/widgets/{id}/publish"

  - priority: 10
    category: state
    check: "The requested transition is declared in §1.2 for the entity's current state (includes: sync on a DISCONNECTED listing, verify on an already VERIFIED review, submit on a non-DRAFT response, approve on a non-PENDING_APPROVAL response, resolve on a terminal escalation, activate on a DRAFT campaign, send-batch on a non-RUNNING campaign, cancel on a non-QUEUED request, submit on an already SUBMITTED survey, second response draft on a Review whose response_state != NONE)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "every action endpoint"

  - priority: 11
    category: business_temporal
    check: "SurveyResponse.submit: current_utc < expires_at (created_at + 14 days). At exactly expires_at the survey is already expired (>= is a rejection)."
    error_id: ERR_SURVEY_EXPIRED
    http_status: 409
    applies_to: "POST /reputation/surveys/{id}/submit"

  - priority: 12
    category: business_safety
    check: "Contact consent: Contact.opted_out == false AND (Campaign.channel == SMS -> Contact.sms_consent == true AND Contact.phone != null) AND (Campaign.channel == EMAIL -> Contact.email_consent == true AND Contact.email != null). Compliance beats every commercial rule below it."
    error_id: ERR_CONTACT_OPTED_OUT
    http_status: 403
    applies_to: "POST /reputation/campaigns/{id}/requests"

  - priority: 13
    category: business_safety
    check: "Segregation of duties: on approve and on reject, X-User-ID MUST differ from ReviewResponse.drafted_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /reputation/review-responses/{id}/approve, POST /reputation/review-responses/{id}/reject"

  - priority: 14
    category: business_referential
    check: "When a ReviewResponse is created with a non-null template_id: ResponseTemplate.min_rating <= Review.rating <= ResponseTemplate.max_rating"
    error_id: ERR_TEMPLATE_RATING_MISMATCH
    http_status: 422
    applies_to: "POST /reputation/reviews/{id}/responses"

  - priority: 15
    category: business_referential
    check: "Publish requires a live channel: a Listing with location_id == Review.location_id AND site == Review.site exists and its sync_state == CONNECTED"
    error_id: ERR_LISTING_NOT_CONNECTED
    http_status: 409
    applies_to: "POST /reputation/review-responses/{id}/publish"

  - priority: 16
    category: business_referential
    check: "Manual escalation resolve requires the underlying Review.response_state == RESPONDED"
    error_id: ERR_REVIEW_NOT_RESPONDED
    http_status: 409
    applies_to: "POST /reputation/escalations/{id}/resolve"

  - priority: 17
    category: business_constraint
    check: "Listing uniqueness: at most one Listing per (location_id, site)"
    error_id: ERR_DUPLICATE_LISTING
    http_status: 409
    applies_to: "POST /reputation/locations/{id}/listings"

  - priority: 18
    category: business_constraint
    check: "Review uniqueness: at most one Review per (location_id, site, external_review_id)"
    error_id: ERR_DUPLICATE_EXTERNAL_REVIEW
    http_status: 409
    applies_to: "POST /reputation/locations/{id}/reviews"

  - priority: 19
    category: business_constraint
    check: "Widget uniqueness: at most one Widget per Location"
    error_id: ERR_WIDGET_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /reputation/locations/{id}/widget"

  - priority: 20
    category: business_temporal
    check: |
      Buffered send-window collision on a Location. Let A be the campaign being scheduled and B any OTHER campaign with
      B.location_id == A.location_id AND B.channel == A.channel AND B.status IN {SCHEDULED, RUNNING, PAUSED}.
      Work in minutes-since-midnight. A collides with B iff
          (A.start - CHANNEL_BUFFER_MINUTES) <= B.end  AND  (A.end + CHANNEL_BUFFER_MINUTES) >= B.start
      i.e. CLOSED intervals expanded by a symmetric 15-minute buffer: touching exactly at the buffer edge IS a collision.
    error_id: ERR_SEND_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /reputation/campaigns/{id}/schedule"

  - priority: 21
    category: business_temporal
    check: |
      Per-contact frequency cap. Let T = Contact.last_requested_at. If T is null the enqueue is always allowed.
      Otherwise the cooldown occupies the HALF-OPEN interval [T, T + Business.default_frequency_cap_days days).
      An enqueue at current_utc is rejected iff T <= current_utc < T + cap_days. An enqueue at exactly
      T + cap_days is allowed (the interval end is exclusive).
    error_id: ERR_FREQUENCY_CAP_ACTIVE
    http_status: 409
    applies_to: "POST /reputation/campaigns/{id}/requests"

  - priority: 22
    category: business_fiscal
    check: "Credit availability at enqueue: Campaign.credits_allocated - Campaign.credits_reserved - Campaign.credits_consumed >= 1"
    error_id: ERR_INSUFFICIENT_CREDITS
    http_status: 402
    applies_to: "POST /reputation/campaigns/{id}/requests"

  - priority: 23
    category: business_fiscal
    check: "Daily send cap at send-batch: the number of this campaign's requests already moved to SENT on the current UTC calendar day, plus the number this batch would send, MUST be <= Campaign.daily_send_cap. The whole batch is rejected; nothing is partially sent."
    error_id: ERR_SEND_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /reputation/campaigns/{id}/send-batch"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:
  # --- Business ------------------------------------------------------------
  - method: POST
    path: "/reputation/businesses"
    description: "Register a tenant business"
    roles: [PlatformAdmin]
    code: 201
    input: [name, "plan_tier?", "default_frequency_cap_days?"]
    output: Business
    side_effects: ["Business created with location_count = 0"]

  - method: GET
    path: "/reputation/businesses/{id}"
    description: "Read a business"
    roles: [PlatformAdmin, BusinessOwner]
    code: 200
    input: []
    output: Business
    side_effects: []

  - method: POST
    path: "/reputation/businesses/{id}/locations"
    description: "Create a location under a business with its canonical NAP record"
    roles: [PlatformAdmin, BusinessOwner]
    code: 201
    input: [name, nap_name, nap_address, nap_phone]
    output: Location
    side_effects:
      - "Location created with posture OPEN, listing_health_score 0.00, reputation_score_provisional 0.00"
      - "Business.location_count += 1"
    note: "A brand-new Location starts OPEN; calculations.location_posture is first evaluated on the next mutation that feeds it, at which point listing_health_score 0.00 (< 40.00) will drive it to RESTRICTED until listings are attached and synced."

  - method: GET
    path: "/reputation/businesses/{id}/locations"
    description: "List the locations of a business (FK reverse-reachability for Location.business_id)"
    roles: [PlatformAdmin, BusinessOwner]
    code: 200
    input: ["posture?", "limit?", "offset?"]
    output: Location[]
    side_effects: []

  - method: POST
    path: "/reputation/businesses/{id}/contacts"
    description: "Create a marketing contact under a business"
    roles: [PlatformAdmin, BusinessOwner, LocationManager]
    code: 201
    input: [full_name, "email?", "phone?", "sms_consent?", "email_consent?"]
    output: Contact
    side_effects: ["Contact created with opted_out=false, request_count=0, last_requested_at=null"]

  - method: GET
    path: "/reputation/businesses/{id}/contacts"
    description: "List the contacts of a business (FK reverse-reachability for Contact.business_id)"
    roles: [PlatformAdmin, BusinessOwner, LocationManager]
    code: 200
    input: ["opted_out?", "limit?", "offset?"]
    output: Contact[]
    side_effects: []

  - method: POST
    path: "/reputation/businesses/{id}/templates"
    description: "Create a response template; requires_approval is the conditional feature flag that governs the approval hop"
    roles: [PlatformAdmin, BusinessOwner]
    code: 201
    input: [name, body, min_rating, max_rating, "requires_approval?"]
    output: ResponseTemplate
    side_effects: []

  - method: GET
    path: "/reputation/businesses/{id}/templates"
    description: "List the response templates of a business (FK reverse-reachability for ResponseTemplate.business_id)"
    roles: [PlatformAdmin, BusinessOwner, ResponseAgent]
    code: 200
    input: ["limit?", "offset?"]
    output: ResponseTemplate[]
    side_effects: []

  # --- Location ------------------------------------------------------------
  - method: GET
    path: "/reputation/locations/{id}"
    description: "Read a location including its derived posture and scores"
    roles: [PlatformAdmin, BusinessOwner, LocationManager, ResponseAgent, ComplianceOfficer]
    code: 200
    input: []
    output: Location
    side_effects: []

  - method: PUT
    path: "/reputation/locations/{id}/nap"
    description: "Replace the location's canonical NAP record"
    roles: [PlatformAdmin, BusinessOwner]
    code: 200
    input: [nap_name, nap_address, nap_phone]
    output: Location
    side_effects:
      - "every Listing of this Location with sync_state == CONNECTED -> PENDING_SYNC (listed_nap_* keep their old site values)"
      - "recompute listing_health_score, then reputation_score_provisional, then posture"
      - "increments Location.version by 1"

  - method: POST
    path: "/reputation/locations/{id}/compliance-hold"
    description: "Place or clear a compliance hold; while held the location's posture is FROZEN"
    roles: [PlatformAdmin]
    code: 200
    input: [on_hold]
    output: Location
    side_effects:
      - "compliance_hold := on_hold; posture recomputed (FROZEN when true)"
      - "on_hold true: RUNNING campaigns -> PAUSED, PUBLISHED widget -> DRAFT, Alert POSTURE_CHANGED appended"
      - "increments Location.version by 1"

  - method: POST
    path: "/reputation/locations/{id}/certify"
    description: "Audit checkpoint: recompute the CERTIFIED variant of location_reputation_score and stamp certified_at"
    roles: [PlatformAdmin, BusinessOwner]
    code: 200
    input: []
    output: Location
    side_effects:
      - "reputation_score_certified := CERTIFIED variant of calculations.location_reputation_score"
      - "certified_at := current_utc; reputation_score_provisional and posture are NOT touched"

  - method: GET
    path: "/reputation/locations/{id}/dashboard"
    description: "Sentiment & rating dashboard, NPS, listing health and competitor benchmark for one location"
    roles: [PlatformAdmin, BusinessOwner, LocationManager]
    code: 200
    input: []
    output: "{ posture: string, review_count: integer, avg_rating: number, sentiment_positive_count: integer, sentiment_neutral_count: integer, sentiment_negative_count: integer, reputation_score_provisional: number, reputation_score_certified: number, listing_health_score: number, nps_score: number, open_escalation_count: integer, responded_review_count: integer, competitor_avg_rating: number, rating_delta: number, review_volume_delta: integer }"
    side_effects: ["runs calculations.competitor_benchmark on read; persists nothing"]

  - method: GET
    path: "/reputation/locations/{id}/alerts"
    description: "Alert feed for a location (FK reverse-reachability for Alert.location_id)"
    roles: [PlatformAdmin, BusinessOwner, LocationManager]
    code: 200
    input: ["alert_type?", "limit?", "offset?"]
    output: Alert[]
    side_effects: []

  # --- Listings / NAP sync ---------------------------------------------------
  - method: POST
    path: "/reputation/locations/{id}/listings"
    description: "Attach an external site listing to the location; it starts in PENDING_SYNC"
    roles: [PlatformAdmin, BusinessOwner]
    code: 201
    input: [site, external_listing_id, listed_nap_name, listed_nap_address, listed_nap_phone]
    output: Listing
    side_effects:
      - "Listing created with sync_state PENDING_SYNC, sync_failure_count 0, last_synced_at null"
      - "recompute Location.listing_health_score, then reputation_score_provisional, then posture"

  - method: GET
    path: "/reputation/locations/{id}/listings"
    description: "List the listings of a location (FK reverse-reachability for Listing.location_id)"
    roles: [PlatformAdmin, BusinessOwner, LocationManager]
    code: 200
    input: ["limit?", "offset?"]
    output: Listing[]
    side_effects: []

  - method: POST
    path: "/reputation/listings/{id}/sync"
    description: "Push the location's canonical NAP to the site connector and record the connector's outcome"
    roles: [PlatformAdmin, BusinessOwner]
    code: 200
    input: [outcome]
    output: Listing
    side_effects:
      - "SUCCESS: listed_nap_* := Location.nap_*, nap_match_count := 3, last_synced_at := current_utc, sync_failure_count := 0, sync_state := CONNECTED"
      - "FAILURE: sync_failure_count += 1, sync_state := SYNC_FAILED (or DISCONNECTED at 3 failures), Alert LISTING_SYNC_FAILED appended"
      - "recompute Location.listing_health_score, then reputation_score_provisional, then posture"

  # --- Competitors ------------------------------------------------------------
  - method: POST
    path: "/reputation/locations/{id}/competitors"
    description: "Record an immutable competitor snapshot for benchmarking"
    roles: [PlatformAdmin, BusinessOwner, LocationManager]
    code: 201
    input: [name, site, avg_rating, review_count]
    output: Competitor
    side_effects: []

  - method: GET
    path: "/reputation/locations/{id}/competitors"
    description: "List competitor snapshots (FK reverse-reachability for Competitor.location_id)"
    roles: [PlatformAdmin, BusinessOwner, LocationManager]
    code: 200
    input: ["limit?", "offset?"]
    output: Competitor[]
    side_effects: []

  # --- Widget -----------------------------------------------------------------
  - method: POST
    path: "/reputation/locations/{id}/widget"
    description: "Create the location's website review widget (at most one per location); it starts in DRAFT"
    roles: [PlatformAdmin, BusinessOwner, LocationManager]
    code: 201
    input: ["min_rating?", "max_reviews?"]
    output: Widget
    side_effects: ["Widget created with status DRAFT and a server-minted embed_token"]

  - method: GET
    path: "/reputation/locations/{id}/widget"
    description: "Read the location's widget (FK reverse-reachability for Widget.location_id; array of 0 or 1)"
    roles: [PlatformAdmin, BusinessOwner, LocationManager]
    code: 200
    input: []
    output: Widget[]
    side_effects: []

  - method: POST
    path: "/reputation/widgets/{id}/publish"
    description: "Publish the widget on the customer's website; requires posture OPEN"
    roles: [PlatformAdmin, BusinessOwner, LocationManager]
    code: 200
    input: []
    output: Widget
    side_effects: ["status := PUBLISHED; published_at := current_utc"]

  # --- Contacts ----------------------------------------------------------------
  - method: POST
    path: "/reputation/contacts/{id}/opt-out"
    description: "Global opt-out for a contact; legal even while the location is FROZEN"
    roles: [PlatformAdmin, BusinessOwner, LocationManager, Anonymous]
    code: 200
    input: []
    output: Contact
    side_effects: ["opted_out := true"]

  # --- Campaigns ----------------------------------------------------------------
  - method: POST
    path: "/reputation/locations/{id}/campaigns"
    description: "Create a review-request campaign on a location (OCC on Location.version)"
    roles: [PlatformAdmin, BusinessOwner, LocationManager]
    code: 201
    input: [name, channel, message_body, send_window_start, send_window_end, daily_send_cap, credits_allocated, expected_location_version]
    output: Campaign
    side_effects:
      - "Campaign created in DRAFT with credits_reserved/consumed/released = 0"
      - "increments Location.version by 1"

  - method: GET
    path: "/reputation/locations/{id}/campaigns"
    description: "List the campaigns of a location (FK reverse-reachability for Campaign.location_id)"
    roles: [PlatformAdmin, BusinessOwner, LocationManager]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Campaign[]
    side_effects: []

  - method: GET
    path: "/reputation/campaigns/{id}"
    description: "Read a campaign including its credit ledger"
    roles: [PlatformAdmin, BusinessOwner, LocationManager]
    code: 200
    input: []
    output: Campaign
    side_effects: []

  - method: POST
    path: "/reputation/campaigns/{id}/schedule"
    description: "DRAFT -> SCHEDULED; runs the buffered send-window collision check"
    roles: [PlatformAdmin, BusinessOwner, LocationManager]
    code: 200
    input: []
    output: Campaign
    side_effects: ["status := SCHEDULED"]

  - method: POST
    path: "/reputation/campaigns/{id}/activate"
    description: "SCHEDULED/PAUSED -> RUNNING; requires Location.posture == OPEN"
    roles: [PlatformAdmin, BusinessOwner, LocationManager]
    code: 200
    input: []
    output: Campaign
    side_effects: ["status := RUNNING; activated_at stamped on the first activation only"]

  - method: POST
    path: "/reputation/campaigns/{id}/pause"
    description: "RUNNING -> PAUSED (manual pause keeps QUEUED requests and their reserved credits)"
    roles: [PlatformAdmin, BusinessOwner, LocationManager]
    code: 200
    input: []
    output: Campaign
    side_effects: ["status := PAUSED"]

  - method: POST
    path: "/reputation/campaigns/{id}/complete"
    description: "RUNNING/PAUSED -> COMPLETED; suppresses every QUEUED request and releases their credits"
    roles: [PlatformAdmin, BusinessOwner, LocationManager]
    code: 200
    input: []
    output: Campaign
    side_effects:
      - "status := COMPLETED"
      - "QUEUED requests -> SUPPRESSED; credits_reserved -= 1 and credits_released += 1 per request"

  - method: POST
    path: "/reputation/campaigns/{id}/requests"
    description: "Enqueue one review request for a contact; reserves one credit and stamps the frequency-cap anchor"
    roles: [PlatformAdmin, BusinessOwner, LocationManager]
    code: 201
    input: [contact_id]
    output: ReviewRequest
    side_effects:
      - "ReviewRequest created QUEUED with channel copied from the campaign"
      - "Campaign.credits_reserved += 1"
      - "Contact.last_requested_at := current_utc; Contact.request_count += 1"

  - method: POST
    path: "/reputation/campaigns/{id}/send-batch"
    description: "Move up to batch_size QUEUED requests to SENT in created_at ASC order, assigning send_index and unit_cost"
    roles: [PlatformAdmin, BusinessOwner, LocationManager]
    code: 200
    input: [batch_size]
    output: "{ sent_count: integer, remaining_queued: integer, billing_cost: number, campaign_status: string }"
    side_effects:
      - "per sent request: send_index assigned, unit_cost computed, sent_at := current_utc, credits_reserved -= 1, credits_consumed += 1"
      - "Campaign.billing_cost := calculations.campaign_billing_cost; Campaign.sent_count updated"
      - "Alert SEND_CAP_REACHED appended when the batch consumes the last unit of daily_send_cap"

  - method: GET
    path: "/reputation/campaigns/{id}/metrics"
    description: "Campaign performance: both conversion-rate variants, billing cost and remaining credits"
    roles: [PlatformAdmin, BusinessOwner, LocationManager]
    code: 200
    input: []
    output: "{ sent_count: integer, conversion_rate_strict: number, conversion_rate_broad: number, billing_cost: number, credits_available: integer }"
    side_effects: []

  # --- Review requests -----------------------------------------------------------
  - method: GET
    path: "/reputation/review-requests"
    description: "Filtered list of review requests (FK reverse-reachability for ReviewRequest.campaign_id and ReviewRequest.contact_id)"
    roles: [PlatformAdmin, BusinessOwner, LocationManager]
    code: 200
    input: ["campaign_id?", "contact_id?", "status?", "limit?", "offset?"]
    output: ReviewRequest[]
    side_effects: []

  - method: GET
    path: "/reputation/review-requests/{id}"
    description: "Read one review request"
    roles: [PlatformAdmin, BusinessOwner, LocationManager]
    code: 200
    input: []
    output: ReviewRequest
    side_effects: []

  - method: POST
    path: "/reputation/review-requests/{id}/events"
    description: "Delivery-connector callback: DELIVERED / CLICKED / FAILED"
    roles: [PlatformAdmin]
    code: 200
    input: [event_type]
    output: ReviewRequest
    side_effects: ["status advances per the ReviewRequest machine; a FAILED delivery stays billable"]

  - method: POST
    path: "/reputation/review-requests/{id}/cancel"
    description: "QUEUED -> SUPPRESSED; compensating action that releases the reserved credit"
    roles: [PlatformAdmin, BusinessOwner, LocationManager]
    code: 200
    input: []
    output: ReviewRequest
    side_effects:
      - "status := SUPPRESSED"
      - "Campaign.credits_reserved -= 1; Campaign.credits_released += 1"

  # --- Reviews ---------------------------------------------------------------------
  - method: POST
    path: "/reputation/locations/{id}/reviews"
    description: "Site-connector ingest of one aggregated review from Google/Yelp/Facebook"
    roles: [PlatformAdmin]
    code: 201
    input: [site, external_review_id, author_name, rating, text, posted_at, "review_request_id?"]
    output: Review
    side_effects:
      - "Review created UNVERIFIED / response_state NONE; sentiment assigned by calculations.review_sentiment"
      - "NEGATIVE sentiment: an Escalation{OPEN} is appended, Location.open_escalation_count += 1, Alert NEGATIVE_REVIEW appended"
      - "when review_request_id is supplied and posted_at falls inside [request.sent_at, request.sent_at + 14d): the request -> CONVERTED and converted_review_id is stamped"
      - "CASCADE LINK 1: recompute Location.review_count, avg_rating, sentiment_* counters, reputation_score_provisional, then posture (which may drive LINK 2 and LINK 3)"

  - method: GET
    path: "/reputation/reviews"
    description: "Filtered review list (FK reverse-reachability for Review.location_id and Review.review_request_id)"
    roles: [PlatformAdmin, BusinessOwner, LocationManager, ResponseAgent, ComplianceOfficer]
    code: 200
    input: ["location_id?", "review_request_id?", "moderation_state?", "sentiment?", "limit?", "offset?"]
    output: Review[]
    side_effects: []

  - method: GET
    path: "/reputation/reviews/{id}"
    description: "Read one review with both of its parallel state dimensions"
    roles: [PlatformAdmin, BusinessOwner, LocationManager, ResponseAgent, ComplianceOfficer]
    code: 200
    input: []
    output: Review
    side_effects: []

  - method: POST
    path: "/reputation/reviews/{id}/verify"
    description: "moderation_state -> VERIFIED (from UNVERIFIED, or reinstating a FLAGGED review)"
    roles: [PlatformAdmin, LocationManager]
    code: 200
    input: []
    output: Review
    side_effects:
      - "moderation_state := VERIFIED; response_state untouched"
      - "reinstatement from FLAGGED re-opens an Escalation when sentiment == NEGATIVE"
      - "recompute Location counters, reputation_score_provisional, posture"

  - method: POST
    path: "/reputation/reviews/{id}/flag"
    description: "moderation_state -> FLAGGED; compensating action that removes the review from every counter and cancels its escalations"
    roles: [PlatformAdmin, LocationManager]
    code: 200
    input: ["reason?"]
    output: Review
    side_effects:
      - "moderation_state := FLAGGED"
      - "Escalations of this review in {OPEN, ACKNOWLEDGED} -> CANCELLED; Location.open_escalation_count -= 1 each"
      - "recompute Location counters, reputation_score_provisional, posture"

  - method: GET
    path: "/reputation/reviews/{id}/escalations"
    description: "Escalations of a review (FK reverse-reachability for Escalation.review_id)"
    roles: [PlatformAdmin, BusinessOwner, LocationManager, ComplianceOfficer]
    code: 200
    input: []
    output: Escalation[]
    side_effects: []

  # --- Review responses ------------------------------------------------------------
  - method: POST
    path: "/reputation/reviews/{id}/responses"
    description: "Draft a reply to a review (OCC on Review.version)"
    roles: [PlatformAdmin, ResponseAgent]
    code: 201
    input: [body, "template_id?", expected_review_version]
    output: ReviewResponse
    side_effects:
      - "ReviewResponse created in DRAFT; drafted_by_user_id := X-User-ID"
      - "Review.response_state := DRAFTED; increments Review.version by 1"

  - method: GET
    path: "/reputation/review-responses"
    description: "Filtered response list (FK reverse-reachability for ReviewResponse.review_id and ReviewResponse.template_id)"
    roles: [PlatformAdmin, BusinessOwner, LocationManager, ResponseAgent, ComplianceOfficer]
    code: 200
    input: ["review_id?", "template_id?", "state?", "limit?", "offset?"]
    output: ReviewResponse[]
    side_effects: []

  - method: GET
    path: "/reputation/review-responses/{id}"
    description: "Read one review response"
    roles: [PlatformAdmin, BusinessOwner, LocationManager, ResponseAgent, ComplianceOfficer]
    code: 200
    input: []
    output: ReviewResponse
    side_effects: []

  - method: POST
    path: "/reputation/review-responses/{id}/submit"
    description: "DRAFT -> PENDING_APPROVAL, or straight to APPROVED when the backing template has requires_approval == false"
    roles: [PlatformAdmin, ResponseAgent]
    code: 200
    input: []
    output: ReviewResponse
    side_effects: ["Review.response_state := AWAITING_APPROVAL (or APPROVED under the flag)"]

  - method: POST
    path: "/reputation/review-responses/{id}/approve"
    description: "PENDING_APPROVAL -> APPROVED; the approver MUST NOT be the drafter"
    roles: [PlatformAdmin, ComplianceOfficer]
    code: 200
    input: []
    output: ReviewResponse
    side_effects: ["approved_by_user_id := X-User-ID; Review.response_state := APPROVED"]

  - method: POST
    path: "/reputation/review-responses/{id}/reject"
    description: "PENDING_APPROVAL -> REJECTED; the rejecter MUST NOT be the drafter"
    roles: [PlatformAdmin, ComplianceOfficer]
    code: 200
    input: [rejection_reason]
    output: ReviewResponse
    side_effects: ["rejection_reason stored; Review.response_state stays AWAITING_APPROVAL"]

  - method: POST
    path: "/reputation/review-responses/{id}/revise"
    description: "REJECTED -> DRAFT with a new body; closes the approval cycle"
    roles: [PlatformAdmin, ResponseAgent]
    code: 200
    input: [body]
    output: ReviewResponse
    side_effects: ["body replaced; revision_count += 1; Review.response_state := DRAFTED"]

  - method: POST
    path: "/reputation/review-responses/{id}/publish"
    description: "APPROVED -> PUBLISHED; requires the review's site listing to be CONNECTED"
    roles: [PlatformAdmin, ComplianceOfficer]
    code: 200
    input: []
    output: ReviewResponse
    side_effects:
      - "published_at := current_utc"
      - "CASCADE LINK 1: Review.response_state := RESPONDED"
      - "CASCADE LINK 2: Escalations of that Review in {OPEN, ACKNOWLEDGED} -> RESOLVED"
      - "CASCADE LINK 3: Location.open_escalation_count -= 1, recompute reputation_score_provisional, recompute posture"

  # --- Escalations --------------------------------------------------------------------
  - method: POST
    path: "/reputation/escalations/{id}/acknowledge"
    description: "OPEN -> ACKNOWLEDGED (still counts as open)"
    roles: [PlatformAdmin, LocationManager]
    code: 200
    input: []
    output: Escalation
    side_effects: ["acknowledged_by_user_id := X-User-ID"]

  - method: POST
    path: "/reputation/escalations/{id}/resolve"
    description: "OPEN/ACKNOWLEDGED -> RESOLVED; requires the review to have been RESPONDED"
    roles: [PlatformAdmin, LocationManager]
    code: 200
    input: []
    output: Escalation
    side_effects:
      - "resolved_at := current_utc"
      - "Location.open_escalation_count -= 1; recompute posture"

  # --- Surveys / NPS ---------------------------------------------------------------------
  - method: POST
    path: "/reputation/locations/{id}/surveys"
    description: "Issue an NPS survey to a contact; expires 14 days after creation"
    roles: [PlatformAdmin, BusinessOwner, LocationManager]
    code: 201
    input: [contact_id]
    output: SurveyResponse
    side_effects: ["SurveyResponse created PENDING with expires_at := created_at + 14 days"]

  - method: GET
    path: "/reputation/surveys"
    description: "Filtered survey list (FK reverse-reachability for SurveyResponse.location_id and SurveyResponse.contact_id)"
    roles: [PlatformAdmin, BusinessOwner, LocationManager]
    code: 200
    input: ["location_id?", "contact_id?", "status?", "limit?", "offset?"]
    output: SurveyResponse[]
    side_effects: []

  - method: GET
    path: "/reputation/surveys/{id}"
    description: "Read one survey"
    roles: [PlatformAdmin, BusinessOwner, LocationManager, Anonymous]
    code: 200
    input: []
    output: SurveyResponse
    side_effects: []

  - method: POST
    path: "/reputation/surveys/{id}/submit"
    description: "Public NPS submission; buckets the score and refreshes Location.nps_score"
    roles: [Anonymous, PlatformAdmin]
    code: 200
    input: [nps_score, "comment?"]
    output: SurveyResponse
    side_effects:
      - "status := SUBMITTED; submitted_at := current_utc; nps_category assigned"
      - "recompute Location.nps_score"
      - "DETRACTOR submission appends Alert NPS_DETRACTOR"

  # --- Test-driving clock -------------------------------------------------------------------
  - method: POST
    path: "/reputation/_clock/set_current_utc"
    description: "Set the server's logical clock. The clock's startup default is exactly 2026-05-01T00:00:00Z; before any call to this endpoint every timestamp the server stamps (created_at, sent_at, last_synced_at, published_at, expires_at, ...) and every window/decay/expiry comparison uses that default instant, never the real wall clock."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["the logical clock jumps to to_iso8601; no entity is mutated and no deferred action fires"]

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID missing, or X-User-Role is not one of the six declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed in the endpoint's roles"
  - id: ERR_CROSS_TENANT_ACCESS
    http: 403
    condition: "a BusinessOwner's X-User-ID is not the owning Business.id, or a LocationManager's X-User-ID is not the owning Location.id"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "approve or reject issued with X-User-ID equal to ReviewResponse.drafted_by_user_id"
  - id: ERR_CONTACT_OPTED_OUT
    http: 403
    condition: "enqueue targets a Contact with opted_out == true, or without consent/identifier for the campaign's channel"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, wrong type, unknown enum member, rating outside 1..5, nps_score outside 0..10, malformed HH:MM window, send_window_end <= send_window_start, limit outside 1..100"
  - id: ERR_BUSINESS_NOT_FOUND
    http: 404
    condition: "business_id in the path does not resolve"
  - id: ERR_LOCATION_NOT_FOUND
    http: 404
    condition: "location_id in the path (or in a reviews filter) does not resolve"
  - id: ERR_LISTING_NOT_FOUND
    http: 404
    condition: "listing_id in the path does not resolve"
  - id: ERR_CONTACT_NOT_FOUND
    http: 404
    condition: "contact_id in the path or body does not resolve, or belongs to a different Business"
  - id: ERR_TEMPLATE_NOT_FOUND
    http: 404
    condition: "template_id in the response body does not resolve, or belongs to a different Business"
  - id: ERR_CAMPAIGN_NOT_FOUND
    http: 404
    condition: "campaign_id in the path does not resolve"
  - id: ERR_REQUEST_NOT_FOUND
    http: 404
    condition: "request_id in the path, or review_request_id in an ingest body, does not resolve"
  - id: ERR_REVIEW_NOT_FOUND
    http: 404
    condition: "review_id in the path does not resolve"
  - id: ERR_RESPONSE_NOT_FOUND
    http: 404
    condition: "response_id in the path does not resolve"
  - id: ERR_ESCALATION_NOT_FOUND
    http: 404
    condition: "escalation_id in the path does not resolve"
  - id: ERR_SURVEY_NOT_FOUND
    http: 404
    condition: "survey_id in the path does not resolve"
  - id: ERR_WIDGET_NOT_FOUND
    http: 404
    condition: "widget_id in the path does not resolve"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_location_version != Location.version on campaign create, or expected_review_version != Review.version on response create"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "the requested transition is not declared in §1.2 from the entity's current state"
  - id: ERR_LOCATION_FROZEN
    http: 409
    condition: "a mutating operation under a Location whose posture is FROZEN (compliance hold)"
  - id: ERR_LOCATION_RESTRICTED
    http: 409
    condition: "campaign activate or widget publish while the Location's posture is RESTRICTED"
  - id: ERR_SURVEY_EXPIRED
    http: 409
    condition: "survey submit at or after expires_at (created_at + 14 days)"
  - id: ERR_LISTING_NOT_CONNECTED
    http: 409
    condition: "publishing a response while the Listing for (Review.location_id, Review.site) is missing or not CONNECTED"
  - id: ERR_REVIEW_NOT_RESPONDED
    http: 409
    condition: "manual escalation resolve while the underlying Review.response_state != RESPONDED"
  - id: ERR_TEMPLATE_RATING_MISMATCH
    http: 422
    condition: "the chosen ResponseTemplate's [min_rating, max_rating] band does not contain the Review's rating"
  - id: ERR_DUPLICATE_LISTING
    http: 409
    condition: "a Listing already exists for this (location_id, site)"
  - id: ERR_DUPLICATE_EXTERNAL_REVIEW
    http: 409
    condition: "a Review already exists for this (location_id, site, external_review_id)"
  - id: ERR_WIDGET_ALREADY_EXISTS
    http: 409
    condition: "the Location already has a Widget"
  - id: ERR_SEND_WINDOW_CONFLICT
    http: 409
    condition: "scheduling a campaign whose 15-minute-buffered send window collides with another SCHEDULED/RUNNING/PAUSED campaign of the same channel at the same location"
  - id: ERR_FREQUENCY_CAP_ACTIVE
    http: 409
    condition: "enqueueing a request for a Contact still inside its half-open [last_requested_at, last_requested_at + cap_days) cooldown"
  - id: ERR_INSUFFICIENT_CREDITS
    http: 402
    condition: "enqueue when credits_allocated - credits_reserved - credits_consumed < 1"
  - id: ERR_SEND_CAP_EXCEEDED
    http: 422
    condition: "a send-batch whose size would push today's SENT count past the campaign's daily_send_cap"

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix (segregation of duties)
# ---------------------------------------------------------------------------
roles:
  - name: PlatformAdmin
    description: "Operator of the reputation platform; superset of every other role, plus the connector and clock surfaces. Still bound by the segregation-of-duties check: a PlatformAdmin who drafted a response cannot approve or reject it."
    identity: "opaque"
    exclusive_operations:
      - "POST /reputation/businesses"
      - "POST /reputation/locations/{id}/compliance-hold"
      - "POST /reputation/locations/{id}/reviews (site-connector ingest)"
      - "POST /reputation/review-requests/{id}/events (delivery-connector callback)"
      - "POST /reputation/_clock/set_current_utc"
    shared_operations:
      - "every other endpoint in §1.5"

  - name: BusinessOwner
    description: "Owns one Business; manages its locations, contacts, templates, listings, competitors, widget and campaigns."
    identity: "entity_backed:Business"
    exclusive_operations: []
    shared_operations:
      - "GET /reputation/businesses/{id}"
      - "POST|GET /reputation/businesses/{id}/locations"
      - "POST|GET /reputation/businesses/{id}/contacts"
      - "POST|GET /reputation/businesses/{id}/templates"
      - "GET /reputation/locations/{id}, /dashboard, /alerts"
      - "PUT /reputation/locations/{id}/nap"
      - "POST /reputation/locations/{id}/certify"
      - "POST|GET /reputation/locations/{id}/listings; POST /reputation/listings/{id}/sync"
      - "POST|GET /reputation/locations/{id}/competitors"
      - "POST|GET /reputation/locations/{id}/widget; POST /reputation/widgets/{id}/publish"
      - "the whole campaign, review-request, survey and read surface"

  - name: LocationManager
    description: "Runs one Location day to day: campaigns, sends, review moderation, escalations, surveys, widget."
    identity: "entity_backed:Location"
    exclusive_operations: []
    shared_operations:
      - "POST /reputation/campaigns/{id}/schedule|activate|pause|complete|requests|send-batch"
      - "POST /reputation/review-requests/{id}/cancel"
      - "POST /reputation/reviews/{id}/verify|flag"
      - "POST /reputation/escalations/{id}/acknowledge|resolve"
      - "POST /reputation/locations/{id}/surveys"
      - "POST /reputation/locations/{id}/widget; POST /reputation/widgets/{id}/publish"
      - "POST|GET /reputation/locations/{id}/competitors; GET dashboard/alerts/listings/campaigns"
      - "POST|GET /reputation/businesses/{id}/contacts"
    note: "Cannot create a Business or a Location, cannot ingest reviews, cannot draft/approve responses."

  - name: ResponseAgent
    description: "Drafts, submits and revises replies to reviews. Never approves, rejects or publishes them."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /reputation/reviews/{id}/responses"
      - "POST /reputation/review-responses/{id}/submit"
      - "POST /reputation/review-responses/{id}/revise"
      - "GET /reputation/reviews, /reviews/{id}, /review-responses, /review-responses/{id}, /businesses/{id}/templates, /locations/{id}"
    note: "Segregation of duties by role: approve, reject and publish are all closed to ResponseAgent."

  - name: ComplianceOfficer
    description: "Approves, rejects and publishes drafted replies. Never drafts or revises them."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /reputation/review-responses/{id}/approve"
      - "POST /reputation/review-responses/{id}/reject"
      - "POST /reputation/review-responses/{id}/publish"
      - "GET /reputation/reviews, /reviews/{id}, /reviews/{id}/escalations, /review-responses, /review-responses/{id}, /locations/{id}"
    note: "Segregation of duties by user id as well: even a ComplianceOfficer whose X-User-ID equals drafted_by_user_id is rejected with ERR_SEGREGATION_OF_DUTIES."

  - name: Anonymous
    description: "Unauthenticated public visitor arriving from a survey link or an unsubscribe link."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /reputation/surveys/{id}/submit"
      - "GET /reputation/surveys/{id}"
      - "POST /reputation/contacts/{id}/opt-out"
    note: "X-User-ID is optional for Anonymous; when absent the server treats the actor as an unidentified public visitor."
