    roles: [PlatformAdmin]
    code: 201
    input: [period_start, period_end]
    output: RecurringRental
    side_effects: ["current rental -> EXPIRED; create new ACTIVE RecurringRental for the requested period"]

  - method: POST
    path: "/fee-invoices/{id}/payments"
    description: "record a payment against an invoice (OCC on invoice version)"
    roles: [Applicant]
    code: 201
    input: [amount_cents, "payment_type?", expected_fee_invoice_version]
    output: Payment
    side_effects: ["create CAPTURED Payment", "paid_amount_cents += amount_cents (PAYMENT); recompute outstanding; status PAID when outstanding == 0", "increments FeeInvoice.version by 1"]

  - method: GET
