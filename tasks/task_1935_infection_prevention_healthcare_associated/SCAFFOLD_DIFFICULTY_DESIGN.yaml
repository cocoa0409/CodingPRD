- rule_id: combinatorial_formula
  instances:
  - name: ssi_predicted_risk_tier_mix_drives_sir
    grounds:
    - calculations.predicted_infections_and_sir
    - entities.SurgicalProcedure.fields.asa_score
    - entities.SurgicalProcedure.fields.wound_class
    distinguishing_aspect: 'Mode (a) — a >= 3-input non-linear formula: predicted_ssi combines

      ssi_baseline_per_procedure with a piecewise risk_weight tier lookup

      over (asa_score, wound_class, implant-independent wound rules) and a

      conditional NOT_CALCULATED branch at predicted < 1.0; the LOW/MEDIUM/

      HIGH tier mix (1.0 + 1.5 + 2.0 = 4.5) produces predicted_ssi = 1.125

      and sir_ssi = 0.889, which no linear count-only formula reproduces.

      '
    test_recipe:
      setup:
      - 'Facility ssi baseline 0.25; OR unit with 3 procedures in 2026-08: LOW (ASA 2, CLEAN), MEDIUM (ASA 3, CLEAN), HIGH (ASA 4, CONTAMINATED)'
      - One SSI case linked to the LOW procedure, adjudicated ADJUDICATED_HAI with DOE 2026-08-10
      - MonthlySummary (OR unit, 2026-08) created afterwards
      setup_api_calls:
      - call: POST /api/facilities
        payload:
          name: F1
          nhsn_org_id: ORG-1
          clabsi_baseline_per_1000: 2.0
          cauti_baseline_per_1000: 1.5
          ssi_baseline_per_procedure: 0.25
        as: PlatformAdmin
        captures:
          fac_id: $.data.id
      - call: POST /api/units
        payload:
          facility_id: ${fac_id}
          name: OR-1
          unit_type: OR
          nhsn_location_code: OR1
        as: PlatformAdmin
        captures:
          unit_id: $.data.id
      - call: POST /api/patients
        payload:
          mrn: MRN-S1
          admitted_at: '2026-08-01T08:00:00Z'
          unit_id: ${unit_id}
        as: UnitNurseManager
        captures:
          pat_1: $.data.id
      - call: POST /api/patients
        payload:
          mrn: MRN-S2
          admitted_at: '2026-08-01T08:00:00Z'
          unit_id: ${unit_id}
        as: UnitNurseManager
        captures:
          pat_2: $.data.id
      - call: POST /api/patients
        payload:
          mrn: MRN-S3
          admitted_at: '2026-08-01T08:00:00Z'
          unit_id: ${unit_id}
        as: UnitNurseManager
        captures:
          pat_3: $.data.id
      - call: POST /api/surgical-procedures
        payload:
          patient_id: ${pat_1}
          procedure_code: COLO
          performed_at: '2026-08-03T09:00:00Z'
          duration_minutes: 60
          asa_score: 2
          wound_class: CLEAN
        as: UnitNurseManager
        captures:
          proc_1: $.data.id
      - call: POST /api/surgical-procedures
        payload:
          patient_id: ${pat_2}
          procedure_code: HYST
          performed_at: '2026-08-04T09:00:00Z'
          duration_minutes: 90
          asa_score: 3
          wound_class: CLEAN
        as: UnitNurseManager
      - call: POST /api/surgical-procedures
        payload:
          patient_id: ${pat_3}
          procedure_code: CRAN
          performed_at: '2026-08-05T09:00:00Z'
          duration_minutes: 120
          asa_score: 4
          wound_class: CONTAMINATED
        as: UnitNurseManager
      - call: POST /api/infection-cases
        payload:
          patient_id: ${pat_1}
          case_type: SSI
          suspected_organism: Staphylococcus aureus
          first_positive_specimen_at: '2026-08-10T09:00:00Z'
          surgical_procedure_id: ${proc_1}
        as: InfectionPreventionist
        captures:
          case_id: $.data.id
      - call: POST /api/infection-cases/${case_id}/begin-review
        payload: {}
        as: InfectionPreventionist
      - call: POST /api/infection-cases/${case_id}/adjudicate
        payload:
          outcome: ADJUDICATED_HAI
          date_of_event: '2026-08-10T00:00:00Z'
          ssi_depth: DEEP
          rationale: deep incisional SSI within 30d
        as: InfectionPreventionist
      - call: POST /api/monthly-summaries
        payload:
          unit_id: ${unit_id}
          month: 2026-08
        as: InfectionPreventionist
        captures:
          sum_id: $.data.id
      trigger:
      - call: GET /api/monthly-summaries/${sum_id}
        payload: {}
        as: InfectionPreventionist
      assert:
      - MonthlySummary.${sum_id}.procedure_count == 3
      - MonthlySummary.${sum_id}.predicted_ssi == 1.125 (0.25 * (1.0 + 1.5 + 2.0))
      - MonthlySummary.${sum_id}.ssi_count == 1
      - MonthlySummary.${sum_id}.sir_ssi == 0.889 (1 / 1.125 rounded 3dp half-up)
      - MonthlySummary.${sum_id}.sir_flag == NORMAL
  - name: hand_hygiene_aggregate_then_round_beats_weekly_average
    grounds:
    - calculations.hand_hygiene_compliance_rate
    distinguishing_aspect: 'Mode (b) — nested-rounding order: the scaffold pins aggregate-then-round

      (sum the month, round once) which yields 33.3, while the alternative

