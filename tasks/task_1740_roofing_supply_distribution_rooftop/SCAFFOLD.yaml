    roles: [SalesRep]
    code: 200
    input: []
    output: MaterialTakeoff
    side_effects: []

  - method: POST
    path: "/roofing/takeoffs/{id}/convert"
    description: "Convert QUOTED takeoff into an Order"
    roles: [Contractor]
    code: 201
    input: [branch_id]
    output: Order
    side_effects:
      - "Creates Order in QUOTED with OrderLines from estimate"
      - "Takeoff.status = CONVERTED"

  # --- Order ---
  - method: GET
    path: "/roofing/orders"
    description: "List orders"
    roles: [PlatformAdmin, BranchManager, SalesRep, CreditAnalyst, Dispatcher]
    code: 200
    input: ["limit?", "offset?", "status?", "job_account_id?", "takeoff_id?", "branch_id?", "storm_surge_event_id?"]
    output: "Order[]"
    side_effects: []

  - method: GET
    path: "/roofing/orders/{id}"
    description: "Get one order"
    roles: [PlatformAdmin, BranchManager, SalesRep, CreditAnalyst, Dispatcher, Contractor]
    code: 200
    input: []
    output: Order
    side_effects: []

  - method: POST
    path: "/roofing/orders/{id}/confirm"
    description: "Confirm an order: pick lots, lock prices, reserve inventory, place credit hold"
    roles: [Contractor]
    code: 200
    input: [expected_contractor_account_version]
    output: Order
    side_effects:
      - "OrderLines get inventory_lot_id and locked unit_price_cents"
      - "InventoryLot.reserved_bundles incremented per line"
      - "order_pricing computes subtotal/discount/surge_premium/total"
      - "ContractorAccount.pending_delivery_hold_cents += total_cents"
      - "increments ContractorAccount.version by 1"
      - "Allocation.consumed_bundles incremented when storm_surge_event_id set"

  - method: POST
    path: "/roofing/orders/{id}/cancel"
    description: "Cancel a QUOTED or CONFIRMED order"
    roles: [Contractor, SalesRep]
    code: 200
    input: []
    output: Order
    side_effects: ["Release reservations and credit holds per state machine"]

  - method: POST
    path: "/roofing/orders/{id}/invoice"
    description: "Invoice a delivered order (UNPAID -> INVOICED)"
    roles: [CreditAnalyst]
    code: 200
    input: []
    output: Order
    side_effects:
      - "payment_status = INVOICED"
      - "ContractorAccount.pending_delivery_hold_cents -= total_cents; open_balance_cents += total_cents"
      - "JobAccount.job_balance_cents += total_cents"

  - method: POST
    path: "/roofing/orders/{id}/close"
    description: "Close an order once delivered and paid"
    roles: [SalesRep]
    code: 200
    input: []
    output: Order
    side_effects: ["status = CLOSED"]

  - method: GET
    path: "/roofing/orders/{id}/lines"
    description: "List order lines"
    roles: [PlatformAdmin, BranchManager, SalesRep, CreditAnalyst, Dispatcher, Contractor, WarehouseClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: "OrderLine[]"
    side_effects: []

  - method: GET
    path: "/roofing/order-lines"
    description: "List order lines across orders with optional filters"
    roles: [PlatformAdmin, BranchManager, SalesRep, CreditAnalyst, Dispatcher, WarehouseClerk]
    code: 200
    input: ["limit?", "offset?", "product_id?", "inventory_lot_id?", "order_id?"]
    output: "OrderLine[]"
    side_effects: []

  - method: GET
    path: "/roofing/order-lines/{id}"
    description: "Get one order line"
    roles: [PlatformAdmin, BranchManager, SalesRep, CreditAnalyst, Dispatcher, WarehouseClerk]
    code: 200
    input: []
    output: OrderLine
    side_effects: []

  # --- DeliverySlot ---
  - method: POST
    path: "/roofing/branches/{id}/delivery-slots"
    description: "Create a delivery slot"
    roles: [Dispatcher, PlatformAdmin]
    code: 201
    input: [slot_date, window, equipment_type, capacity]
    output: DeliverySlot
    side_effects: ["booked_count = 0"]

  - method: GET
    path: "/roofing/branches/{id}/delivery-slots"
    description: "List slots at a branch"
    roles: [PlatformAdmin, BranchManager, Dispatcher, Contractor]
    code: 200
    input: ["limit?", "offset?", "slot_date?", "equipment_type?"]
    output: "DeliverySlot[]"
    side_effects: []

  - method: GET
    path: "/roofing/delivery-slots/{id}"
    description: "Get one slot"
    roles: [PlatformAdmin, BranchManager, Dispatcher, Contractor]
    code: 200
    input: []
    output: DeliverySlot
    side_effects: []

  # --- Delivery ---
  - method: POST
    path: "/roofing/orders/{id}/deliveries"
    description: "Schedule a delivery into a slot. Order must be in QUOTED or CONFIRMED; when QUOTED the fee accrues into the order total before the confirmation credit check."
    roles: [Dispatcher]
    code: 201
    input: [delivery_slot_id, equipment_type]
    output: Delivery
    side_effects:
      - "slot.booked_count += 1"
      - "fee_cents computed per delivery_fee; Order.delivery_fee_cents += fee_cents; total recomputed"

  - method: GET
    path: "/roofing/orders/{id}/deliveries"
    description: "List deliveries for an order"
    roles: [PlatformAdmin, BranchManager, Dispatcher, Contractor, ClaimsAdjuster]
    code: 200
    input: ["limit?", "offset?"]
    output: "Delivery[]"
    side_effects: []


  - method: GET
    path: "/roofing/deliveries"
    description: "List deliveries with optional slot filter"
    roles: [PlatformAdmin, BranchManager, Dispatcher, Contractor, ClaimsAdjuster]
    code: 200
    input: ["limit?", "offset?", "delivery_slot_id?", "status?"]
    output: "Delivery[]"
    side_effects: []
  - method: GET
    path: "/roofing/deliveries/{id}"
    description: "Get one delivery"
    roles: [PlatformAdmin, BranchManager, Dispatcher, Contractor, ClaimsAdjuster]
    code: 200
    input: []
    output: Delivery
    side_effects: []

  - method: POST
    path: "/roofing/deliveries/{id}/dispatch"
    description: "Dispatch a scheduled delivery"
    roles: [Dispatcher]
    code: 200
    input: []
    output: Delivery
    side_effects: ["status = EN_ROUTE; lot on_hand/reserved decremented"]

  - method: POST
    path: "/roofing/deliveries/{id}/complete"
    description: "Complete a delivery"
    roles: [Dispatcher]
    code: 200
    input: []
    output: Delivery
    side_effects: ["status = DELIVERED; OrderLine.delivered_bundles updated; order fulfillment recomputed"]

  - method: POST
    path: "/roofing/deliveries/{id}/fail"
    description: "Mark an en-route delivery failed"
    roles: [Dispatcher]
    code: 200
    input: []
    output: Delivery
    side_effects: ["status = FAILED; inventory restored"]

  - method: POST
    path: "/roofing/deliveries/{id}/reschedule"
    description: "Reschedule a failed delivery into a new slot"
    roles: [Dispatcher]
    code: 200
    input: [delivery_slot_id]
    output: Delivery
    side_effects: ["status = RESCHEDULED; slots adjusted; fee recomputed"]

  - method: POST
    path: "/roofing/deliveries/{id}/reconfirm"
    description: "Reconfirm a rescheduled delivery"
    roles: [Dispatcher]
    code: 200
    input: []
    output: Delivery
    side_effects: ["status = SCHEDULED"]

  - method: POST
    path: "/roofing/deliveries/{id}/cancel"
    description: "Cancel a scheduled delivery"
    roles: [Dispatcher]
    code: 200
    input: []
    output: Delivery
    side_effects: ["status = CANCELLED; slot.booked_count -= 1; order delivery_fee reduced"]

  # --- StormSurgeEvent ---
  - method: POST
    path: "/roofing/branches/{id}/surge-events"
    description: "Declare a storm surge event"
    roles: [BranchManager, PlatformAdmin]
    code: 201
    input: [event_name, starts_at, ends_at, surge_multiplier_pct, allocation_pool_bundles]
    output: StormSurgeEvent
    side_effects: ["status = DECLARED"]

  - method: GET
    path: "/roofing/branches/{id}/surge-events"
    description: "List surge events at a branch"
    roles: [PlatformAdmin, BranchManager, SalesRep, Contractor]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "StormSurgeEvent[]"
    side_effects: []

  - method: GET
    path: "/roofing/surge-events/{id}"
    description: "Get one surge event"
    roles: [PlatformAdmin, BranchManager, SalesRep, Contractor]
    code: 200
    input: []
    output: StormSurgeEvent
    side_effects: []

  - method: POST
    path: "/roofing/surge-events/{id}/close"
    description: "Close a surge event early"
    roles: [BranchManager]
    code: 200
    input: []
    output: StormSurgeEvent
    side_effects: ["status = CLOSED; allocations expired/revoked; branch surge_mode = NORMAL"]

  # --- Allocation ---
  - method: POST
    path: "/roofing/surge-events/{id}/allocations"
    description: "Request a surge allocation"
    roles: [Contractor]
    code: 201
    input: [contractor_account_id, product_id, requested_bundles]
    output: Allocation
    side_effects: ["status = PENDING"]

  - method: GET
    path: "/roofing/surge-events/{id}/allocations"
    description: "List allocations for an event"
    roles: [PlatformAdmin, BranchManager, Contractor]
    code: 200
    input: ["limit?", "offset?", "contractor_account_id?"]
    output: "Allocation[]"
    side_effects: []


  - method: GET
    path: "/roofing/allocations"
    description: "List allocations across events with optional filters"
    roles: [PlatformAdmin, BranchManager, Contractor]
    code: 200
    input: ["limit?", "offset?", "contractor_account_id?", "product_id?", "storm_surge_event_id?", "status?"]
    output: "Allocation[]"
    side_effects: []
  - method: GET
    path: "/roofing/allocations/{id}"
    description: "Get one allocation"
    roles: [PlatformAdmin, BranchManager, Contractor]
    code: 200
    input: []
    output: Allocation
    side_effects: []

  - method: POST
    path: "/roofing/allocations/{id}/grant"
    description: "Grant a pending allocation per waterfall"
    roles: [BranchManager]
    code: 200
    input: [expected_storm_surge_event_version]
    output: Allocation
    side_effects:
      - "granted_bundles computed per storm_surge_allocation"
      - "StormSurgeEvent.allocated_bundles += granted_bundles"
      - "increments StormSurgeEvent.version by 1"
      - "status = GRANTED"

  - method: POST
    path: "/roofing/allocations/{id}/revoke"
    description: "Revoke an unconsumed allocation"
    roles: [BranchManager]
    code: 200
    input: []
    output: Allocation
    side_effects: ["status = REVOKED; event.allocated_bundles released"]

  # --- Return ---
  - method: POST
    path: "/roofing/orders/{id}/returns"
    description: "Request a return against an order line"
    roles: [Contractor]
    code: 201
    input: [order_line_id, quantity_bundles, "opened_bundles?"]
    output: Return
    side_effects: ["status = REQUESTED"]

  - method: GET
    path: "/roofing/orders/{id}/returns"
    description: "List returns for an order"
    roles: [PlatformAdmin, BranchManager, WarehouseClerk, Contractor]
    code: 200
    input: ["limit?", "offset?"]
    output: "Return[]"
    side_effects: []


  - method: GET
    path: "/roofing/returns"
    description: "List returns across orders with optional filters"
    roles: [PlatformAdmin, BranchManager, WarehouseClerk, Contractor]
    code: 200
    input: ["limit?", "offset?", "order_line_id?", "order_id?", "status?"]
    output: "Return[]"
    side_effects: []
  - method: GET
    path: "/roofing/returns/{id}"
    description: "Get one return"
    roles: [PlatformAdmin, BranchManager, WarehouseClerk, Contractor]
    code: 200
    input: []
    output: Return
    side_effects: []

  - method: POST
    path: "/roofing/returns/{id}/approve"
    description: "Approve a return, computing credit"
    roles: [BranchManager]
    code: 200
    input: []
    output: Return
    side_effects: ["credit_amount_cents computed per return_credit"]

  - method: POST
    path: "/roofing/returns/{id}/receive"
    description: "Receive returned bundles; verifies lot match and restocks"
    roles: [WarehouseClerk]
    code: 200
    input: [returned_lot_code]
    output: Return
    side_effects: ["restock unopened bundles; credit posted; fulfillment_status = RETURN_ADJUSTED"]

  - method: POST
    path: "/roofing/returns/{id}/reject"
    description: "Reject a return"
    roles: [BranchManager]
    code: 200
    input: []
    output: Return
    side_effects: []

  # --- DamageClaim ---
  - method: POST
    path: "/roofing/deliveries/{id}/damage-claims"
    description: "File a damage claim on a delivery"
    roles: [Contractor]
    code: 201
    input: [claimed_bundles, evidence_note]
    output: DamageClaim
    side_effects: ["claim_amount_cents computed from affected lines"]

  - method: GET
    path: "/roofing/deliveries/{id}/damage-claims"
    description: "List claims for a delivery"
    roles: [PlatformAdmin, BranchManager, ClaimsAdjuster, CreditAnalyst, Contractor]
    code: 200
    input: ["limit?", "offset?"]
    output: "DamageClaim[]"
    side_effects: []

  - method: GET
    path: "/roofing/damage-claims/{id}"
    description: "Get one claim"
    roles: [PlatformAdmin, BranchManager, ClaimsAdjuster, CreditAnalyst, Contractor]
    code: 200
    input: []
    output: DamageClaim
    side_effects: []

  - method: POST
    path: "/roofing/damage-claims/{id}/start-review"
    description: "Start reviewing a claim (from FILED or DISPUTED)"
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: DamageClaim
    side_effects: ["review_round += 1 when re-entering from DISPUTED"]

  - method: POST
    path: "/roofing/damage-claims/{id}/approve"
    description: "Approve a claim with an approved amount"
    roles: [ClaimsAdjuster]
    code: 200
    input: [approved_amount_cents]
    output: DamageClaim
    side_effects: ["status = APPROVED"]

  - method: POST
    path: "/roofing/damage-claims/{id}/reject"
    description: "Reject a claim"
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: DamageClaim
    side_effects: ["status = REJECTED"]

  - method: POST
    path: "/roofing/damage-claims/{id}/credit"
    description: "Credit an approved claim to the contractor account (SoD enforced)"
    roles: [CreditAnalyst]
    code: 200
    input: []
    output: DamageClaim
    side_effects: ["ContractorAccount.open_balance_cents -= approved_amount_cents (floor 0)"]

  - method: POST
    path: "/roofing/damage-claims/{id}/dispute"
    description: "Contractor disputes an approved claim amount"
    roles: [Contractor]
    code: 200
    input: []
    output: DamageClaim
    side_effects: ["status = DISPUTED"]

  # --- WarrantyRegistration ---
  - method: POST
    path: "/roofing/orders/{id}/warranty-registrations"
    description: "Register manufacturer warranty for a delivered order"
    roles: [Contractor]
    code: 201
    input: []
    output: WarrantyRegistration
    side_effects: ["certification_verified per validation; registered_bundles = delivered - returned"]

  - method: GET
    path: "/roofing/orders/{id}/warranty-registrations"
    description: "List warranty registrations for an order"
    roles: [PlatformAdmin, BranchManager, Contractor]
    code: 200
    input: ["limit?", "offset?"]
    output: "WarrantyRegistration[]"
    side_effects: []

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing/empty" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted, or Contractor acting on another contractor's resource" }
  - { id: ERR_BRANCH_NOT_FOUND, http: 404, condition: "Branch id does not exist" }
  - { id: ERR_PRODUCT_NOT_FOUND, http: 404, condition: "Product id does not exist" }
  - { id: ERR_LOT_NOT_FOUND, http: 404, condition: "InventoryLot id does not exist" }
  - { id: ERR_ACCOUNT_NOT_FOUND, http: 404, condition: "ContractorAccount id does not exist" }
  - { id: ERR_JOB_ACCOUNT_NOT_FOUND, http: 404, condition: "JobAccount id does not exist" }
  - { id: ERR_TAKEOFF_NOT_FOUND, http: 404, condition: "MaterialTakeoff id does not exist" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "Order id does not exist" }
  - { id: ERR_DELIVERY_NOT_FOUND, http: 404, condition: "Delivery id does not exist" }
  - { id: ERR_SLOT_NOT_FOUND, http: 404, condition: "DeliverySlot id does not exist" }
  - { id: ERR_SURGE_NOT_FOUND, http: 404, condition: "StormSurgeEvent id does not exist" }
  - { id: ERR_ALLOCATION_NOT_FOUND, http: 404, condition: "Allocation id does not exist" }
  - { id: ERR_RETURN_NOT_FOUND, http: 404, condition: "Return id does not exist" }
  - { id: ERR_CLAIM_NOT_FOUND, http: 404, condition: "DamageClaim id does not exist" }
  - { id: ERR_TAKEOFF_NOT_DRAFT, http: 409, condition: "Takeoff not in DRAFT for quote" }
  - { id: ERR_TAKEOFF_NOT_QUOTED, http: 409, condition: "Takeoff not in QUOTED for convert/revise" }
  - { id: ERR_ORDER_NOT_QUOTED, http: 409, condition: "Order not in QUOTED for confirm" }
  - { id: ERR_ORDER_NOT_CONFIRMED, http: 409, condition: "Order not in CONFIRMED for dispatch/close" }
  - { id: ERR_ORDER_NOT_CANCELLABLE, http: 409, condition: "Order not in QUOTED/CONFIRMED for cancel" }
  - { id: ERR_ORDER_NOT_FULLY_DELIVERED, http: 409, condition: "Order close requires fulfillment_status DELIVERED or RETURN_ADJUSTED" }
  - { id: ERR_ORDER_UNPAID, http: 409, condition: "Order close requires payment_status PAID or CREDITED" }
  - { id: ERR_OPEN_CLAIMS_EXIST, http: 409, condition: "Order close blocked by non-terminal DamageClaim" }
  - { id: ERR_OPEN_RETURNS_EXIST, http: 409, condition: "Order close blocked by non-terminal Return" }
  - { id: ERR_ACTIVE_DELIVERY_EXISTS, http: 409, condition: "Order cancel blocked by SCHEDULED/EN_ROUTE delivery" }
