            - "the metrics read reports raw_missed_count_window 13, adjusted_missed_count_window 13, missed_treatments_per_referral_x100 == 1300 and same_day_honor_rate_pct == 0"
            - "creating referral B still succeeds under suspension (intake is never blocked) and rescores to the same 48 with referral_volume_window 2, raw 13; the facility is already SUSPENDED so no transition and no cascade fires and B stays SUBMITTED"
            - "triaging referral B returns 422 with data.error_id == ERR_FACILITY_SUSPENDED at priority 22, even though the access has a qualifying reading, so priority 23 is provably not the cause"
            - "Referral.${ref_b}.status is still SUBMITTED and VascularAccess.${acc_b}.status is still IN_USE after the refusal"

