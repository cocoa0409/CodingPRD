# =============================================================================
# §1.8 Scaffold Difficulty Design — task_2280 Elite Athlete Field & Prize Purse
# 9 rule_ids x >= 2 instances = 23 instances
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  # RULE 1 — dual_variant_calc (2 instances, different entity domains)
  # ===========================================================================

  - rule_id: dual_variant_calc
    instances:
      - name: dual_variant_invitation_package_guaranteed_vs_full_exposure
        grounds:
          - calculations.invitation_package_valuation
          - entities.Invitation.fields.guaranteed_commitment_cents
          - entities.Invitation.fields.full_exposure_cents
          - state_machines.RaceEdition.FIELD_OPEN_to_FIELD_LOCKED
          - validations[priority=16]
        distinguishing_aspect: >-
          One calculation values the same accepted invitation twice: the `guaranteed` variant
          (3,782,000 cents) is what is debited from the appearance budget at ACCEPT, while the
          `full_exposure` variant (6,282,000 cents) adds the largest matching TIME_BONUS line and the
          RECORD_BONUS line and is what the lock-field ceiling tests. Falsifiable in one sentence: an
          implementation that computes a single number will either lock the 3-athlete field
          successfully (if it used `guaranteed`: 11,346,000 <= 18,000,000) or debit 6,282,000 per
          accept from the appearance budget (if it used `full_exposure`), so it cannot simultaneously
          report appearance_committed_cents == 11346000 AND reject lock-field at 18,846,000.
        test_recipe:
          setup: >-
            Edition with appearance_budget_cents = 12,000,000 and bonus_pool_cap_cents = 6,000,000, so
            the lock-field exposure ceiling is 18,000,000. One OVERALL purse line, one TIME_BONUS line
            of 1,000,000 (ELITE/MALE) and one RECORD_BONUS line of 1,500,000 (ELITE/MALE); no course
            record on file, so every athlete is a record threat and record exposure counts. Three
            athletes, one agent, identical offered terms: appearance_fee 3,000,000 + BUSINESS air
            540,000 + hotel_nights 9 clamped to MAX_HOTEL_NIGHTS 7 (7 x 32,000 = 224,000) + ground
            18,000 => guaranteed 3,782,000; full_exposure 3,782,000 + 1,000,000 + 1,500,000 =
            6,282,000. All three accept: 3 x 3,782,000 = 11,346,000 <= 12,000,000.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ElitesDirector
            - call: POST /race-editions
              payload:
                name: "Metro Marathon 2026"
                city: "Metro City"
                race_date: "2026-11-01"
                appearance_budget_cents: 12000000
                total_purse_cents: 10000000
                bonus_pool_cap_cents: 6000000
              as: ElitesDirector
              captures: { ed_id: "$.data.id" }
            - call: POST /division-standards
              payload:
                race_edition_id: "${ed_id}"
                division: ELITE
                gender: MALE
                max_qualifying_seconds: 8100
                bib_range_start: 11
                bib_range_end: 20
              as: ElitesDirector
            - call: POST /purse-lines
              payload:
                race_edition_id: "${ed_id}"
                category: OVERALL
                gender: MALE
                place: 1
                amount_cents: 5000000
              as: ElitesDirector
            - call: POST /purse-lines
              payload:
                race_edition_id: "${ed_id}"
                category: TIME_BONUS
                division: ELITE
                gender: MALE
                threshold_seconds: 7600
                amount_cents: 1000000
              as: ElitesDirector
            - call: POST /purse-lines
              payload:
                race_edition_id: "${ed_id}"
                category: RECORD_BONUS
                division: ELITE
                gender: MALE
                amount_cents: 1500000
              as: ElitesDirector
            - call: POST /race-editions/${ed_id}/open-field
              as: ElitesDirector
            - call: POST /rep-agents
              payload: { agency_name: "Apex Track Management", license_code: "AGT-APEX-1" }
              as: ElitesDirector
              captures: { agt1_id: "$.data.id" }
            - call: POST /athletes
              payload:
                full_name: "Runner Alpha"
                country_code: KEN
                gender: MALE
                birth_date: "1998-03-04"
                whereabouts_filed: true
              as: ElitesDirector
              captures: { ath1_id: "$.data.id" }
            - call: POST /athletes
              payload:
                full_name: "Runner Bravo"
                country_code: ETH
                gender: MALE
                birth_date: "1997-05-06"
                whereabouts_filed: true
              as: ElitesDirector
              captures: { ath2_id: "$.data.id" }
            - call: POST /athletes
              payload:
                full_name: "Runner Charlie"
                country_code: USA
                gender: MALE
                birth_date: "1996-07-08"
                whereabouts_filed: true
              as: ElitesDirector
              captures: { ath3_id: "$.data.id" }
            - call: POST /performance-records
              payload:
                athlete_id: "${ath1_id}"
                race_name: "Prior Marathon A"
                performance_date: "2026-04-01"
                performance_seconds: 7900
                division: ELITE
                sanctioning_ref: "SB-A-1"
                chip_timed: true
              as: AthleteAgent
              as_user_id: "${agt1_id}"
              captures: { pr1_id: "$.data.id" }
            - call: POST /performance-records/${pr1_id}/verification
              payload: { decision: VERIFIED, official_seconds: 7900 }
              as: TechnicalOfficial
            - call: POST /performance-records
              payload:
                athlete_id: "${ath2_id}"
                race_name: "Prior Marathon B"
                performance_date: "2026-04-02"
                performance_seconds: 7950
                division: ELITE
                sanctioning_ref: "SB-B-1"
                chip_timed: true
              as: AthleteAgent
              as_user_id: "${agt1_id}"
              captures: { pr2_id: "$.data.id" }
            - call: POST /performance-records/${pr2_id}/verification
              payload: { decision: VERIFIED, official_seconds: 7950 }
              as: TechnicalOfficial
            - call: POST /performance-records
              payload:
                athlete_id: "${ath3_id}"
                race_name: "Prior Marathon C"
                performance_date: "2026-04-03"
                performance_seconds: 8000
                division: ELITE
                sanctioning_ref: "SB-C-1"
                chip_timed: true
              as: AthleteAgent
              as_user_id: "${agt1_id}"
              captures: { pr3_id: "$.data.id" }
            - call: POST /performance-records/${pr3_id}/verification
              payload: { decision: VERIFIED, official_seconds: 8000 }
              as: TechnicalOfficial
            - call: POST /invitations
              payload:
                race_edition_id: "${ed_id}"
                athlete_id: "${ath1_id}"
                agent_id: "${agt1_id}"
                qualifying_performance_id: "${pr1_id}"
                division: ELITE
              as: ElitesDirector
              captures: { inv1_id: "$.data.id" }
            - call: POST /invitations
              payload:
                race_edition_id: "${ed_id}"
                athlete_id: "${ath2_id}"
                agent_id: "${agt1_id}"
                qualifying_performance_id: "${pr2_id}"
                division: ELITE
              as: ElitesDirector
              captures: { inv2_id: "$.data.id" }
            - call: POST /invitations
              payload:
                race_edition_id: "${ed_id}"
                athlete_id: "${ath3_id}"
                agent_id: "${agt1_id}"
                qualifying_performance_id: "${pr3_id}"
                division: ELITE
              as: ElitesDirector
              captures: { inv3_id: "$.data.id" }
            - call: POST /invitations/${inv1_id}/offer
              payload: { appearance_fee_cents: 3000000, air_class: BUSINESS, hotel_nights: 9, ground_transport: true }
              as: ElitesDirector
            - call: POST /invitations/${inv2_id}/offer
              payload: { appearance_fee_cents: 3000000, air_class: BUSINESS, hotel_nights: 9, ground_transport: true }
              as: ElitesDirector
            - call: POST /invitations/${inv3_id}/offer
              payload: { appearance_fee_cents: 3000000, air_class: BUSINESS, hotel_nights: 9, ground_transport: true }
              as: ElitesDirector
            - call: POST /invitations/${inv1_id}/respond
              payload: { decision: ACCEPT }
              as: AthleteAgent
              as_user_id: "${agt1_id}"
            - call: POST /invitations/${inv2_id}/respond
              payload: { decision: ACCEPT }
              as: AthleteAgent
              as_user_id: "${agt1_id}"
            - call: POST /invitations/${inv3_id}/respond
              payload: { decision: ACCEPT }
              as: AthleteAgent
              as_user_id: "${agt1_id}"
            - call: GET /invitations/${inv1_id}
              as: ElitesDirector
              captures: { inv1_guaranteed: "$.data.guaranteed_commitment_cents" }
            - call: GET /race-editions/${ed_id}
              as: ElitesDirector
              captures: { committed_before_lock: "$.data.appearance_committed_cents" }
          trigger:
            - call: POST /race-editions/${ed_id}/lock-field
              as: ElitesDirector
            - call: POST /invitations/${inv3_id}/withdraw
              payload: { reason: "exposure ceiling rebalance" }
              as: ElitesDirector
            - call: POST /race-editions/${ed_id}/lock-field
              as: ElitesDirector
            - call: GET /invitations/${inv1_id}
              as: ElitesDirector
            - call: GET /race-editions/${ed_id}
              as: ElitesDirector
          assert:
            - "setup GET /invitations/${inv1_id} returns guaranteed_commitment_cents == 3782000 (3,000,000 fee + 540,000 BUSINESS + 224,000 hotel (min(9,7) x 32,000) + 18,000 ground) and full_exposure_cents == 0 (not stamped until lock-field)"
            - "setup GET /race-editions/${ed_id} returns appearance_committed_cents == 11346000 and appearance_uncommitted_cents == 654000, proving the `guaranteed` variant drove the budget ledger"
            - "trigger call 1 returns 422 with error_id ERR_FIELD_LOCK_EXPOSURE_EXCEEDED because 3 x 6,282,000 = 18,846,000 > 12,000,000 + 6,000,000 = 18,000,000"
            - "after trigger call 1 the edition status is still FIELD_OPEN and no invitation has a non-zero full_exposure_cents (no partial stamping)"
            - "trigger call 2 returns 200 with status == WITHDRAWN and guaranteed_commitment_cents == 0"
            - "trigger call 3 returns 200 with status == FIELD_LOCKED because 2 x 6,282,000 = 12,564,000 <= 18,000,000"
            - "trigger call 4 returns full_exposure_cents == 6282000 and guaranteed_commitment_cents == 3782000 on the same invitation — the two variants coexist, with a delta of 2,500,000 cents"
            - "trigger call 5 returns appearance_committed_cents == 7564000 (2 x 3,782,000) and appearance_uncommitted_cents == 4436000"

      - name: dual_variant_withholding_per_award_vs_aggregated
        grounds:
          - calculations.withholding_computation
          - entities.Athlete.fields.w8ben_on_file
          - entities.PrizeAward.fields.withholding_cents
          - entities.PrizeAward.fields.withholding_variant
          - state_machines.PrizeAward.COMPUTED_to_VOID
        distinguishing_aspect: >-
          With the treaty rate deliberately set equal to the statutory rate (3000 bps), the identical
          gross pair 250,000 / 50,000 withholds 75,000 in total under PER_AWARD (the 50,000 award is
          below DE_MINIMIS_AWARD_CENTS 60,000 and escapes entirely) but 90,000 under AGGREGATED (the
          300,000 aggregate clears AGGREGATE_DE_MINIMIS_CENTS 150,000, so both awards are withheld on).
          Falsifiable in one sentence: an implementation that applies one rate to every award without
          variant-specific de-minimis screening reports 15,000 on the small award in both modes, so the
          PER_AWARD assertion `withholding_cents == 0` fails.
        test_recipe:
          setup: >-
            BASE lifecycle with one foreign (KEN) ELITE MALE finisher who has w8ben_on_file = true and
            treaty_withholding_bps = 3000, and exactly two purse lines that pay him: OVERALL place 1 =
            250,000 and DIVISION ELITE place 1 = 50,000. Run compute-awards once in the PER_AWARD
            variant and read both awards.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ElitesDirector
            - call: POST /race-editions
              payload:
                name: "Withholding Variant Marathon"
                city: "Metro City"
                race_date: "2026-11-01"
                appearance_budget_cents: 10000000
                total_purse_cents: 10000000
                bonus_pool_cap_cents: 0
              as: ElitesDirector
              captures: { ed_id: "$.data.id" }
            - call: POST /division-standards
              payload:
                race_edition_id: "${ed_id}"
                division: ELITE
                gender: MALE
                max_qualifying_seconds: 8100
                bib_range_start: 11
                bib_range_end: 20
              as: ElitesDirector
            - call: POST /purse-lines
              payload:
                race_edition_id: "${ed_id}"
                category: OVERALL
                gender: MALE
                place: 1
                amount_cents: 250000
              as: ElitesDirector
            - call: POST /purse-lines
              payload:
                race_edition_id: "${ed_id}"
                category: DIVISION
                division: ELITE
                gender: MALE
                place: 1
                amount_cents: 50000
              as: ElitesDirector
            - call: POST /race-editions/${ed_id}/open-field
              as: ElitesDirector
            - call: POST /rep-agents
              payload: { agency_name: "Global Miles Agency", license_code: "AGT-GM-1" }
              as: ElitesDirector
              captures: { agt1_id: "$.data.id" }
            - call: POST /athletes
              payload:
                full_name: "Foreign Winner"
                country_code: KEN
                gender: MALE
                birth_date: "1998-03-04"
                tax_residency_country: KEN
                w8ben_on_file: true
                treaty_withholding_bps: 3000
                whereabouts_filed: true
              as: ElitesDirector
              captures: { ath1_id: "$.data.id" }
            - call: POST /performance-records
              payload:
                athlete_id: "${ath1_id}"
                race_name: "Prior Marathon"
                performance_date: "2026-04-01"
                performance_seconds: 7900
                division: ELITE
                sanctioning_ref: "SB-W-1"
                chip_timed: true
              as: AthleteAgent
              as_user_id: "${agt1_id}"
              captures: { pr1_id: "$.data.id" }
            - call: POST /performance-records/${pr1_id}/verification
              payload: { decision: VERIFIED, official_seconds: 7900 }
              as: TechnicalOfficial
            - call: POST /invitations
              payload:
                race_edition_id: "${ed_id}"
                athlete_id: "${ath1_id}"
                agent_id: "${agt1_id}"
                qualifying_performance_id: "${pr1_id}"
                division: ELITE
              as: ElitesDirector
              captures: { inv1_id: "$.data.id" }
            - call: POST /invitations/${inv1_id}/offer
              payload: { appearance_fee_cents: 1000000, air_class: ECONOMY, hotel_nights: 3, ground_transport: false }
              as: ElitesDirector
            - call: POST /invitations/${inv1_id}/respond
              payload: { decision: ACCEPT }
              as: AthleteAgent
              as_user_id: "${agt1_id}"
            - call: POST /invitations/${inv1_id}/assign-bib
              as: ElitesDirector
            - call: POST /race-editions/${ed_id}/lock-field
              as: ElitesDirector
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-11-01T09:00:00Z" }
              as: TechnicalOfficial
            - call: POST /race-editions/${ed_id}/mark-raced
              as: TechnicalOfficial
            - call: POST /race-results
              payload:
                race_edition_id: "${ed_id}"
                invitation_id: "${inv1_id}"
                gun_seconds: 7500
                net_seconds: 7498
              as: TechnicalOfficial
              captures: { res1_id: "$.data.id" }
            - call: POST /race-results/${res1_id}/certify
              as: TechnicalOfficial
            - call: POST /race-editions/${ed_id}/certify-results
              as: TechnicalOfficial
              captures: { ed_v: "$.data.version" }
            - call: POST /race-editions/${ed_id}/compute-awards
              payload: { expected_race_edition_version: "${ed_v}" }
              as: FinanceOfficer
              captures: { ed_v2: "$.data.version" }
            - call: GET /prize-awards
              payload: { race_edition_id: "${ed_id}", category: OVERALL, status: COMPUTED }
              as: FinanceOfficer
              captures: { award_overall_id: "$.data[0].id" }
            - call: GET /prize-awards
              payload: { race_edition_id: "${ed_id}", category: DIVISION, status: COMPUTED }
              as: FinanceOfficer
              captures: { award_division_id: "$.data[0].id" }
          trigger:
            - call: GET /prize-awards/${award_overall_id}
              as: FinanceOfficer
            - call: GET /prize-awards/${award_division_id}
              as: FinanceOfficer
            - call: PATCH /athletes/${ath1_id}/tax-profile
              payload: { w8ben_on_file: false }
              as: FinanceOfficer
            - call: POST /race-editions/${ed_id}/compute-awards
              payload: { expected_race_edition_version: "${ed_v2}" }
              as: FinanceOfficer
            - call: GET /prize-awards/${award_division_id}
              as: FinanceOfficer
            - call: GET /prize-awards
              payload: { race_edition_id: "${ed_id}", category: DIVISION, status: COMPUTED }
              as: FinanceOfficer
          assert:
            - "trigger call 1 returns gross_amount_cents == 250000, withholding_variant == PER_AWARD, withholding_bps == 3000, withholding_cents == 75000, net_amount_cents == 175000"
            - "trigger call 2 returns gross_amount_cents == 50000, withholding_variant == PER_AWARD, withholding_cents == 0, net_amount_cents == 50000 because 50,000 < DE_MINIMIS_AWARD_CENTS 60,000"
            - "PER_AWARD total withholding over the athlete's two awards == 75000"
            - "trigger call 3 returns 200 with w8ben_on_file == false"
            - "trigger call 4 returns 200 and purse_allocated_cents == 300000 (the new COMPUTED set, the old pair having gone VOID)"
            - "trigger call 5 shows the first-run DIVISION award now has status == VOID and its withholding_cents is unchanged at 0 (a PATCH to the tax profile never re-withholds an existing award)"
            - "trigger call 6 returns exactly 1 row with gross_amount_cents == 50000, withholding_variant == AGGREGATED, withholding_bps == 3000 and withholding_cents == 15000, because the 300,000 aggregate clears AGGREGATE_DE_MINIMIS_CENTS 150,000"
            - "AGGREGATED total withholding over the athlete's two awards == 90000 (75,000 + 15,000), a delta of 15000 versus PER_AWARD at an identical 3000 bps rate"

  # ===========================================================================
  # RULE 2 — combinatorial_formula (3 instances, one per mode a / b / c)
  # ===========================================================================

  - rule_id: combinatorial_formula
    instances:
      - name: combinatorial_bonus_nested_max_supersede_then_min_headroom_cap
        grounds:
          - calculations.bonus_determination
          - calculations.prize_award_generation
          - entities.RaceEdition.fields.bonus_pool_cap_cents
          - entities.RaceEdition.fields.bonus_pool_consumed_cents
          - state_machines.RaceResult.SUBMITTED_to_RATIFIED
        distinguishing_aspect: >-
          Mode (a): the bonus amount is a non-linear nest of three inputs —
          min(max(rec_cand, time_cand), max(0, bonus_pool_cap_cents - consumed)) — so the ratified
          record bonus of 1,500,000 SUPERSEDES (never adds to) the 500,000 time bonus and is then
          clipped to the 1,200,000 pool headroom, and the second finisher's own 500,000 time bonus
          collapses to no award at all because headroom is exactly 0. Falsifiable in one sentence: any
          implementation that adds instead of supersedes reports 2,000,000, any implementation that
          omits the headroom clip reports 1,500,000, and any implementation that skips the second
          athlete's headroom recheck creates a third bonus award — the correct nest yields exactly one
          bonus award of 1,200,000.
        test_recipe:
          setup: >-
            Edition with bonus_pool_cap_cents = 1,200,000 and course_record_male_seconds = 7600. Purse
            lines: OVERALL/MALE place 1 = 1,000,000 and place 2 = 500,000; TIME_BONUS ELITE/MALE with
            threshold_seconds 7600 = 500,000; RECORD_BONUS ELITE/MALE = 1,500,000. Two domestic (USA)
            ELITE MALE athletes so withholding is the NONE variant and gross == net. Both finish under
            the record (7500 and 7550) and are certified; the faster claim is submitted and RATIFIED,
            which pushes the edition record to 7500 and rejects the slower CLAIMED result.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ElitesDirector
            - call: POST /race-editions
              payload:
                name: "Bonus Nest Marathon"
                city: "Metro City"
                race_date: "2026-11-01"
                appearance_budget_cents: 10000000
                total_purse_cents: 10000000
                bonus_pool_cap_cents: 1200000
                course_record_male_seconds: 7600
              as: ElitesDirector
              captures: { ed_id: "$.data.id" }
            - call: POST /division-standards
              payload: { race_edition_id: "${ed_id}", division: ELITE, gender: MALE, max_qualifying_seconds: 8100, bib_range_start: 11, bib_range_end: 20 }
              as: ElitesDirector
            - call: POST /purse-lines
              payload: { race_edition_id: "${ed_id}", category: OVERALL, gender: MALE, place: 1, amount_cents: 1000000 }
              as: ElitesDirector
            - call: POST /purse-lines
              payload: { race_edition_id: "${ed_id}", category: OVERALL, gender: MALE, place: 2, amount_cents: 500000 }
              as: ElitesDirector
            - call: POST /purse-lines
              payload: { race_edition_id: "${ed_id}", category: TIME_BONUS, division: ELITE, gender: MALE, threshold_seconds: 7600, amount_cents: 500000 }
              as: ElitesDirector
            - call: POST /purse-lines
              payload: { race_edition_id: "${ed_id}", category: RECORD_BONUS, division: ELITE, gender: MALE, amount_cents: 1500000 }
              as: ElitesDirector
            - call: POST /race-editions/${ed_id}/open-field
              as: ElitesDirector
            - call: POST /rep-agents
              payload: { agency_name: "Nest Sports", license_code: "AGT-NEST-1" }
              as: ElitesDirector
              captures: { agt1_id: "$.data.id" }
            - call: POST /athletes
              payload: { full_name: "Record Breaker", country_code: USA, gender: MALE, birth_date: "1998-03-04", whereabouts_filed: true }
              as: ElitesDirector
              captures: { ath1_id: "$.data.id" }
            - call: POST /athletes
              payload: { full_name: "Fast Second", country_code: USA, gender: MALE, birth_date: "1997-05-06", whereabouts_filed: true }
              as: ElitesDirector
              captures: { ath2_id: "$.data.id" }
            - call: POST /performance-records
              payload: { athlete_id: "${ath1_id}", race_name: "Prior A", performance_date: "2026-04-01", performance_seconds: 7900, division: ELITE, sanctioning_ref: "SB-N-1", chip_timed: true }
              as: AthleteAgent
              as_user_id: "${agt1_id}"
              captures: { pr1_id: "$.data.id" }
            - call: POST /performance-records/${pr1_id}/verification
              payload: { decision: VERIFIED, official_seconds: 7900 }
              as: TechnicalOfficial
            - call: POST /performance-records
              payload: { athlete_id: "${ath2_id}", race_name: "Prior B", performance_date: "2026-04-02", performance_seconds: 7950, division: ELITE, sanctioning_ref: "SB-N-2", chip_timed: true }
              as: AthleteAgent
              as_user_id: "${agt1_id}"
              captures: { pr2_id: "$.data.id" }
            - call: POST /performance-records/${pr2_id}/verification
              payload: { decision: VERIFIED, official_seconds: 7950 }
              as: TechnicalOfficial
            - call: POST /invitations
              payload: { race_edition_id: "${ed_id}", athlete_id: "${ath1_id}", agent_id: "${agt1_id}", qualifying_performance_id: "${pr1_id}", division: ELITE }
              as: ElitesDirector
              captures: { inv1_id: "$.data.id" }
            - call: POST /invitations
              payload: { race_edition_id: "${ed_id}", athlete_id: "${ath2_id}", agent_id: "${agt1_id}", qualifying_performance_id: "${pr2_id}", division: ELITE }
              as: ElitesDirector
              captures: { inv2_id: "$.data.id" }
            - call: POST /invitations/${inv1_id}/offer
              payload: { appearance_fee_cents: 1000000, air_class: ECONOMY, hotel_nights: 3, ground_transport: false }
              as: ElitesDirector
            - call: POST /invitations/${inv2_id}/offer
              payload: { appearance_fee_cents: 1000000, air_class: ECONOMY, hotel_nights: 3, ground_transport: false }
              as: ElitesDirector
            - call: POST /invitations/${inv1_id}/respond
              payload: { decision: ACCEPT }
              as: AthleteAgent
              as_user_id: "${agt1_id}"
            - call: POST /invitations/${inv2_id}/respond
              payload: { decision: ACCEPT }
              as: AthleteAgent
              as_user_id: "${agt1_id}"
            - call: POST /invitations/${inv1_id}/assign-bib
              as: ElitesDirector
            - call: POST /invitations/${inv2_id}/assign-bib
