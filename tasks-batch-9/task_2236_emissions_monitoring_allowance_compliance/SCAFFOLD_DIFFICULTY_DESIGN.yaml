      - name: boundary_rolling_window_one_sample_short_returns_insufficient_data
        grounds:
          - calculations.rolling_average_limit_check
          - calculations.excess_event_penalty_debit
          - entities.PermitLimit.fields.window_sample_count
          - entities.PermitLimit.fields.evaluation_status
          - endpoints[POST /emissions/permit-limits/{id}/evaluate]
          - state_machines.ExcessEmissionEvent.DETECTED_to_WITHDRAWN
        distinguishing_aspect: |
          Boundary on the WINDOW-SAMPLE-COUNT metric at the permit-limit
          evaluate endpoint (a third metric at a third endpoint): 2 samples is
          one short of MIN_WINDOW_SAMPLES and yields INSUFFICIENT_DATA with a
          null rolling value, and the same instant re-evaluated after the count
          reaches 3 exceeds a 250.0 lb/hr limit — while a limit set exactly at
          the observed 292.2 stays IN_COMPLIANCE.
        test_recipe:
          setup:
            - "logical clock at 2026-04-02T00:00:00Z"
            - "unit U1 with a CERTIFIED, CAL_CURRENT SO2 CEM and three identical MEASURED CEMS hours at 00:00 / 01:00 / 02:00, each so2_mass_lbs 292.2"
            - "three SO2 ROLLING_3_HOUR LB_PER_HR permit limits differing only in limit_value and effective_from_utc: L1 250.0 (2026-01-01), L2 292.2 (2026-01-02), L3 292.1 (2026-01-03)"
          setup_api_calls:
            - call: "POST /emissions/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-02T00:00:00Z" }
              as: RegulatoryReviewer
            - call: "POST /emissions/facilities"
              payload: { name: "Kestrel Generating Station", orispl_code: "7101", state_code: "OH", operator_org: "op_alpha", programs: ["ARP_SO2"], true_up_deadline_utc: "2027-03-01T00:00:00Z" }
              as: RegulatoryReviewer
              captures: { fac_id: $.data.id }
            - call: "POST /emissions/facilities/${fac_id}/units"
              payload: { unit_identifier: "U1", primary_fuel: "COAL", nameplate_capacity_mw: 600, max_rated_heat_input_mmbtu_hr: 6000, control_device: "FGD" }
              as: RegulatoryReviewer
              captures: { unit_id: $.data.id }
            - call: "POST /emissions/units/${unit_id}/monitoring-systems"
              payload: { parameter: "SO2", system_type: "CEM", span_value: 400.0, calibration_error_spec_pct: 2.5 }
              as: QAAnalyst
              captures: { cem_id: $.data.id, cem_v1: $.data.version }
            - call: "POST /emissions/monitoring-systems/${cem_id}/daily-calibrations"
              payload: { expected_monitoring_system_version: "${cem_v1}", calibration_utc: "2026-04-01T00:00:00Z", zero_reference_value: 0.0, zero_measured_value: 0.0, span_reference_value: 360.0, span_measured_value: 368.0 }
              as: QAAnalyst
            - call: "POST /emissions/monitoring-systems/${cem_id}/qa-status"
              payload: { action: "CERTIFY" }
              as: QAAnalyst
            - call: "POST /emissions/units/${unit_id}/quarterly-reports"
              payload: { year: 2026, quarter: 2 }
              as: EmissionsReportPreparer
              as_user_id: "prep_1"
              captures: { q2_id: $.data.id, q2_v1: $.data.version }
            - call: "POST /emissions/units/${unit_id}/operating-hours/bulk"
              payload: { expected_quarterly_report_version: "${q2_v1}", hours: [{ hour_begin_utc: "2026-04-01T00:00:00Z", op_time_fraction: 1.0, heat_input_method: "CEMS_FLOW_CO2", flow_scfh: 8000000.0, co2_conc_pct: 12.5, so2_conc_ppm: 220.0, nox_rate_lb_mmbtu: 0.180 }, { hour_begin_utc: "2026-04-01T01:00:00Z", op_time_fraction: 1.0, heat_input_method: "CEMS_FLOW_CO2", flow_scfh: 8000000.0, co2_conc_pct: 12.5, so2_conc_ppm: 220.0, nox_rate_lb_mmbtu: 0.180 }, { hour_begin_utc: "2026-04-01T02:00:00Z", op_time_fraction: 1.0, heat_input_method: "CEMS_FLOW_CO2", flow_scfh: 8000000.0, co2_conc_pct: 12.5, so2_conc_ppm: 220.0, nox_rate_lb_mmbtu: 0.180 }] }
              as: EmissionsReportPreparer
              as_user_id: "prep_1"
            - call: "POST /emissions/units/${unit_id}/permit-limits"
              payload: { pollutant: "SO2", limit_value: 250.0, limit_units: "LB_PER_HR", averaging_basis: "ROLLING_3_HOUR", effective_from_utc: "2026-01-01T00:00:00Z" }
              as: RegulatoryReviewer
              captures: { l1_id: $.data.id }
            - call: "POST /emissions/units/${unit_id}/permit-limits"
              payload: { pollutant: "SO2", limit_value: 292.2, limit_units: "LB_PER_HR", averaging_basis: "ROLLING_3_HOUR", effective_from_utc: "2026-01-02T00:00:00Z" }
              as: RegulatoryReviewer
              captures: { l2_id: $.data.id }
            - call: "POST /emissions/units/${unit_id}/permit-limits"
              payload: { pollutant: "SO2", limit_value: 292.1, limit_units: "LB_PER_HR", averaging_basis: "ROLLING_3_HOUR", effective_from_utc: "2026-01-03T00:00:00Z" }
              as: RegulatoryReviewer
              captures: { l3_id: $.data.id }
          trigger:
            - call: "POST /emissions/permit-limits/${l1_id}/evaluate"
              payload: { anchor_utc: "2026-04-01T02:00:00Z" }
              as: RegulatoryReviewer
            - call: "POST /emissions/permit-limits/${l1_id}/evaluate"
              payload: { anchor_utc: "2026-04-01T03:00:00Z" }
              as: RegulatoryReviewer
            - call: "POST /emissions/permit-limits/${l2_id}/evaluate"
              payload: { anchor_utc: "2026-04-01T03:00:00Z" }
              as: RegulatoryReviewer
            - call: "POST /emissions/permit-limits/${l3_id}/evaluate"
              payload: { anchor_utc: "2026-04-01T03:00:00Z" }
              as: RegulatoryReviewer
            - call: "POST /emissions/permit-limits/${l1_id}/evaluate"
              payload: { anchor_utc: "2026-04-01T02:00:00Z" }
              as: RegulatoryReviewer
          assert:
            - "after trigger 1: PermitLimit.${l1_id}.window_sample_count == 2 (hours 00:00 and 01:00 only — the anchor is exclusive)"
            - "after trigger 1: PermitLimit.${l1_id}.evaluation_status == INSUFFICIENT_DATA and PermitLimit.${l1_id}.current_rolling_value == null"
            - "after trigger 1: no ExcessEmissionEvent exists"
            - "after trigger 2: PermitLimit.${l1_id}.window_sample_count == 3 and PermitLimit.${l1_id}.current_rolling_value == 292.2"
            - "after trigger 2: PermitLimit.${l1_id}.evaluation_status == EXCEEDED and exactly one DETECTED ExcessEmissionEvent exists for ${l1_id}"
            - "that event has observed_value == 292.2, limit_value_snapshot == 250.0, exceedance_magnitude == 42.2, penalty_allowance_debit_tons == 17"
            - "after trigger 3: PermitLimit.${l2_id}.current_rolling_value == 292.2 and evaluation_status == IN_COMPLIANCE  # equal to the limit is not an exceedance"
            - "after trigger 3: still exactly one ExcessEmissionEvent in the system"
            - "after trigger 4: PermitLimit.${l3_id}.evaluation_status == EXCEEDED with exceedance_magnitude == 0.1 and penalty_allowance_debit_tons == 1  # MIN_PENALTY_DEBIT_TONS floors ceil(0.0342)"
            - "after trigger 5: PermitLimit.${l1_id}.evaluation_status == INSUFFICIENT_DATA and its DETECTED event is now WITHDRAWN"
            - "after trigger 5: the ExcessEmissionEvent of ${l3_id} is still DETECTED — withdrawal is scoped to the re-evaluated limit"

  # ===========================================================================
  # RULE 7 — cross_entity_state_dependency
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: cross_entity_rata_runs_require_unit_online
        grounds:
          - state_machines.RataTest.SCHEDULED_to_RUNS_RECORDED
          - validations[priority=235]
          - errors[ERR_UNIT_NOT_ONLINE]
          - entities.Unit.fields.dispatch_state
          - endpoints[POST /emissions/rata-tests/{id}/runs]
        distinguishing_aspect: |
          RataTest depends on Unit: recording RATA runs is refused with
          ERR_UNIT_NOT_ONLINE while the unit is OFFLINE and again while it is
          RESERVE_SHUTDOWN, and the identical payload succeeds once the unit is
          ONLINE — the run data itself never changes.
        test_recipe:
          setup:
            - "logical clock at 2026-04-02T00:00:00Z"
            - "unit U1 in its initial OFFLINE dispatch state"
            - "one NOX_RATE CEM on the unit with one SCHEDULED RataTest window [2026-04-03, 2026-04-04)"
          setup_api_calls:
            - call: "POST /emissions/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-02T00:00:00Z" }
              as: RegulatoryReviewer
            - call: "POST /emissions/facilities"
              payload: { name: "Kestrel Generating Station", orispl_code: "7101", state_code: "OH", operator_org: "op_alpha", programs: ["ARP_SO2"], true_up_deadline_utc: "2027-03-01T00:00:00Z" }
              as: RegulatoryReviewer
              captures: { fac_id: $.data.id }
            - call: "POST /emissions/facilities/${fac_id}/units"
              payload: { unit_identifier: "U1", primary_fuel: "COAL", nameplate_capacity_mw: 600, max_rated_heat_input_mmbtu_hr: 6000, control_device: "SCR" }
              as: RegulatoryReviewer
              captures: { unit_id: $.data.id }
            - call: "POST /emissions/units/${unit_id}/monitoring-systems"
              payload: { parameter: "NOX_RATE", system_type: "CEM", span_value: 0.800, calibration_error_spec_pct: 2.5 }
              as: QAAnalyst
              captures: { nox_sys_id: $.data.id }
            - call: "POST /emissions/monitoring-systems/${nox_sys_id}/rata-tests"
              payload: { window_start_utc: "2026-04-03T00:00:00Z", window_end_utc: "2026-04-04T00:00:00Z" }
              as: QAAnalyst
              captures: { rt_id: $.data.id }
          trigger:
            - call: "POST /emissions/rata-tests/${rt_id}/runs"
              payload: { runs: [{ reference_value: 0.262, cems_value: 0.248 }, { reference_value: 0.266, cems_value: 0.240 }, { reference_value: 0.268, cems_value: 0.234 }, { reference_value: 0.270, cems_value: 0.252 }, { reference_value: 0.270, cems_value: 0.256 }, { reference_value: 0.272, cems_value: 0.252 }, { reference_value: 0.274, cems_value: 0.240 }, { reference_value: 0.274, cems_value: 0.260 }, { reference_value: 0.274, cems_value: 0.251 }] }
              as: QAAnalyst
              captures: { error_id: $.data.error_id }
            - call: "PATCH /emissions/units/${unit_id}/dispatch"
              payload: { dispatch_state: "RESERVE_SHUTDOWN" }
              as: FacilityOperator
              as_user_id: "op_alpha"
            - call: "POST /emissions/rata-tests/${rt_id}/runs"
              payload: { runs: [{ reference_value: 0.262, cems_value: 0.248 }, { reference_value: 0.266, cems_value: 0.240 }, { reference_value: 0.268, cems_value: 0.234 }, { reference_value: 0.270, cems_value: 0.252 }, { reference_value: 0.270, cems_value: 0.256 }, { reference_value: 0.272, cems_value: 0.252 }, { reference_value: 0.274, cems_value: 0.240 }, { reference_value: 0.274, cems_value: 0.260 }, { reference_value: 0.274, cems_value: 0.251 }] }
              as: QAAnalyst
              captures: { second_error_id: $.data.error_id }
            - call: "PATCH /emissions/units/${unit_id}/dispatch"
              payload: { dispatch_state: "ONLINE" }
              as: FacilityOperator
              as_user_id: "op_alpha"
            - call: "POST /emissions/rata-tests/${rt_id}/runs"
              payload: { runs: [{ reference_value: 0.262, cems_value: 0.248 }, { reference_value: 0.266, cems_value: 0.240 }, { reference_value: 0.268, cems_value: 0.234 }, { reference_value: 0.270, cems_value: 0.252 }, { reference_value: 0.270, cems_value: 0.256 }, { reference_value: 0.272, cems_value: 0.252 }, { reference_value: 0.274, cems_value: 0.240 }, { reference_value: 0.274, cems_value: 0.260 }, { reference_value: 0.274, cems_value: 0.251 }] }
              as: QAAnalyst
          assert:
            - "trigger 1 returns HTTP 409 with error_id == ERR_UNIT_NOT_ONLINE and RataTest.${rt_id}.status stays SCHEDULED with run_count == 0"
            - "trigger 3 returns HTTP 409 with error_id == ERR_UNIT_NOT_ONLINE — RESERVE_SHUTDOWN is not ONLINE either"
            - "trigger 5 returns HTTP 200, RataTest.${rt_id}.status == RUNS_RECORDED and RataTest.${rt_id}.run_count == 9"
            - "after trigger 5: RataTest.${rt_id}.relative_accuracy_pct == null — recording runs does not evaluate them"
            - "Unit.${unit_id}.dispatch_state == ONLINE and Unit.${unit_id}.version == 3 after the two dispatch patches"

      - name: cross_entity_report_validate_blocked_by_invalidated_fuel_sample
        grounds:
          - validations[priority=255]
          - validations[priority=260]
          - state_machines.FuelSample.ANALYZED_to_INVALIDATED
          - state_machines.FuelSample.INVALIDATED_to_ANALYZED
          - state_machines.QuarterlyReport.DRAFT_to_VALIDATED
          - errors[ERR_FUEL_ANALYSIS_INVALIDATED]
          - errors[ERR_FUEL_SAMPLE_NOT_ANALYZED]
        distinguishing_aspect: |
          A DIFFERENT entity pair — QuarterlyReport depends on FuelSample —
          reached through the referencing OperatingHour rows: invalidating an
          already-consumed sample blocks validation with
          ERR_FUEL_ANALYSIS_INVALIDATED without rewriting any stored heat input,
          and re-analysing the same sample unblocks it.
        test_recipe:
          setup:
            - "logical clock at 2026-04-02T00:00:00Z"
            - "unit U1 with one CERTIFIED CO2 EXCEPTED_APPENDIX_D system (span 20)"
            - "FuelSample A is ANALYZED (gcv 12500, sulfur 0.85); FuelSample B is left PENDING"
            - "a DRAFT 2026 Q2 report carrying three APPENDIX_D hours (fuel_flow_lbs 45000 each) that all reference FuelSample A"
          setup_api_calls:
            - call: "POST /emissions/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-02T00:00:00Z" }
              as: RegulatoryReviewer
            - call: "POST /emissions/facilities"
              payload: { name: "Kestrel Generating Station", orispl_code: "7101", state_code: "OH", operator_org: "op_alpha", programs: ["ARP_SO2"], true_up_deadline_utc: "2027-03-01T00:00:00Z" }
              as: RegulatoryReviewer
              captures: { fac_id: $.data.id }
            - call: "POST /emissions/facilities/${fac_id}/units"
              payload: { unit_identifier: "U1", primary_fuel: "COAL", nameplate_capacity_mw: 600, max_rated_heat_input_mmbtu_hr: 6000, control_device: "FGD" }
              as: RegulatoryReviewer
              captures: { unit_id: $.data.id }
            - call: "POST /emissions/units/${unit_id}/monitoring-systems"
              payload: { parameter: "CO2", system_type: "EXCEPTED_APPENDIX_D", span_value: 20.0, calibration_error_spec_pct: 2.5 }
              as: QAAnalyst
              captures: { appd_id: $.data.id, appd_v1: $.data.version }
            - call: "POST /emissions/monitoring-systems/${appd_id}/daily-calibrations"
              payload: { expected_monitoring_system_version: "${appd_v1}", calibration_utc: "2026-04-01T00:00:00Z", zero_reference_value: 0.0, zero_measured_value: 0.0, span_reference_value: 18.0, span_measured_value: 18.1 }
              as: QAAnalyst
            - call: "POST /emissions/monitoring-systems/${appd_id}/qa-status"
              payload: { action: "CERTIFY" }
              as: QAAnalyst
            - call: "POST /emissions/units/${unit_id}/fuel-samples"
              payload: { sample_utc: "2026-04-01T00:00:00Z", fuel_type: "COAL", lot_identifier: "LOT-A" }
              as: FacilityOperator
