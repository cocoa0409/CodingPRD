      - name: archival_check_create_with_the_observed_version_succeeds_and_bumps_it
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.archival-check-create-stale-subscription
          - entities.Subscription.fields.version
          - endpoints.POST_/erm/subscriptions/{id}/archival-checks
        distinguishing_aspect: |
          The happy path of the same OCC rule: the freshly observed version is accepted with 201, the
          check lands in PENDING, and the write bumps Subscription.version so the client's captured value
          is now stale for any follow-up write - version increments on every write, which is what makes
          the stale-version test meaningful.
