  - rule_id: non_linear_state_machine
    instances:

      - name: assessment_revision_cycle_voids_on_fourth_return
        grounds:
          - state_machines.RiskAssessment.SUBMITTED_to_RETURNED
          - state_machines.RiskAssessment.RETURNED_to_SUBMITTED
          - state_machines.RiskAssessment.SUBMITTED_to_VOIDED
          - entities.RiskAssessment.fields.revision_round
          - calculations.composite_risk_score
          - errors.ERR_ASSESSMENT_INVALID_STATE
        distinguishing_aspect: |
          Cyclic dimension on RiskAssessment.status: SUBMITTED -> RETURNED -> SUBMITTED is
          a genuine loop, and the loop is bounded by MAX_REVISION_ROUNDS == 3 rather than
          by the graph. The same endpoint and payload (review with outcome RETURN) lands
          in RETURNED for revision_round 1, 2 and 3 but in the terminal VOIDED on the 4th,
          and a signal added mid-cycle proves the loop re-derives composite_risk_score
          instead of memoising it (11.00 on rounds 1-2, 18.00 on rounds 3-4).
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z, never advanced"
            - "one TIER_3 executive, residential survey COMPLETE with residential_component 10.00, no exposure signals initially"
            - "one DRAFT assessment authored by the analyst with threat_monitoring_score 20.00"
            - "the director who reviews is a different staff row from the author, so validations[priority=18] never fires"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemOperator
              as_user_id: "ops-1"
