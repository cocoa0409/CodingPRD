              as: CaseManager
              captures: { err_after: $.data.error_id }
            - call: "POST /debtor-examinations"
              payload: { judgment_id: "${jud_id}", scheduled_at: "2026-08-03T15:00:00Z" }
              as: CaseManager
              captures: { err_before: $.data.error_id }
            - call: "POST /debtor-examinations"
              payload: { judgment_id: "${jud_id}", scheduled_at: "2026-10-01T15:00:00Z" }
              as: CaseManager
              captures: { ex2_id: $.data.id, ex2_status: $.data.status, ex2_deadline: $.data.subpoena_service_deadline_on }
          assert:
