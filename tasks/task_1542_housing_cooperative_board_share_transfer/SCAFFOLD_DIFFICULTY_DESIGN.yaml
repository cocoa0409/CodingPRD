            - call: "POST /cooperatives/${coop_id}/share-ledger-entries"
              payload: { unit_id: "${unit_id}", shareholder_id: "${sh_id}", shares_held: 100 }
              as: BoardOfficer
            - call: "GET /cooperatives/${coop_id}"
              as: PlatformAdmin
              captures: { coop_v: $.data.version }
            - call: "POST /cooperatives/${coop_id}/charge-schedules"
              payload: { fiscal_year: 2026, annual_operating_budget_cents: 1200000, allocation_method: "PRO_RATA_SHARES", effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-08-01T00:00:00Z", expected_cooperative_version: "${coop_v}" }
              as: BoardOfficer
              captures: { cs_id: $.data.id }
            - call: "POST /cooperatives/${coop_id}/resolutions"
              payload: { resolution_kind: "APPROVE_SCHEDULE", subject_entity_kind: "ChargeSchedule", subject_entity_id: "${cs_id}", payload_json: {} }
              as: BoardOfficer
              captures: { res_id: $.data.id }
            - call: "POST /cooperatives/${coop_id}/resolutions/${res_id}/vote"
              payload: { vote_choice: "FOR" }
              as: BoardMember
              as_user_id: "bm-1"
            - call: "POST /cooperatives/${coop_id}/resolutions/${res_id}/vote"
              payload: { vote_choice: "FOR" }
              as: BoardMember
              as_user_id: "bm-2"
            - call: "POST /cooperatives/${coop_id}/resolutions/${res_id}/vote"
              payload: { vote_choice: "FOR" }
              as: BoardMember
              as_user_id: "bm-3"
            - call: "POST /cooperatives/${coop_id}/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-07T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /cooperatives/${coop_id}/maintenance-charges"
              as: ManagingAgent
              captures: { mc_id: "$.data[0].id" }
            - call: "GET /cooperatives/${coop_id}/maintenance-charges/${mc_id}"
              as: ManagingAgent
              captures: { pre_out: $.data.outstanding_cents, pre_paid: $.data.paid_cents }
          trigger:
            - call: "POST /cooperatives/${coop_id}/maintenance-charges/${mc_id}/payments"
              payload: { shareholder_id: "${sh_id}", amount_cents: 50000 }
              as: ManagingAgent
              captures: { pay_id: $.data.id }
            - call: "GET /cooperatives/${coop_id}/maintenance-charges/${mc_id}"
              as: ManagingAgent
              captures: { mid_out: $.data.outstanding_cents, mid_paid: $.data.paid_cents }
            - call: "POST /cooperatives/${coop_id}/payments/${pay_id}/void"
              payload: {}
              as: ManagingAgent
            - call: "GET /cooperatives/${coop_id}/maintenance-charges/${mc_id}"
              as: ManagingAgent
              captures: { post_out: $.data.outstanding_cents, post_paid: $.data.paid_cents }
          assert:
            - "Initial: outstanding_cents == 105000 (base 100000 + late_fee 5000 + interest 0 - paid 0)"
            - "After payment of 50000: paid_cents == 50000, outstanding_cents == 55000"
            - "After void: paid_cents == 0, outstanding_cents == 105000 (exactly restored)"
            - "Conservation law holds: outstanding == base + late_fee + interest - paid at every step"
            - "Forward + compensating action leave the ledger unchanged (no drift)"
