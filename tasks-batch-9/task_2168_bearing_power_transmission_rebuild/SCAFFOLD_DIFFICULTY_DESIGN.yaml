              as: ReliabilityEngineer
              captures: { z139: $.data.iso_zone }
          assert:
            - "the 4.50 mm/s reading has iso_zone == D"
            - "the 4.49 mm/s reading has iso_zone == C"
            - "the 2.80 mm/s reading has iso_zone == C"
            - "the 1.39 mm/s reading has iso_zone == A"
            - "the 4.50 mm/s reading has defect_ratio_outer == 1.000000 and defect_ratio_inner == 1.000000"

      - name: inspection_submit_with_empty_measurement_set_is_rejected
        grounds:
          - validations[priority=12]
          - errors[ERR_MEASUREMENTS_INCOMPLETE]
          - state_machines.Inspection.DRAFT_to_SUBMITTED
          - entities.ClearanceStandard.fields.required_feature_codes
        distinguishing_aspect: |
          The empty-collection boundary on a third endpoint
          (POST /shop/inspections/{id}/advance): an inspection carrying zero
          measurements has an empty governing set, so SUBMIT is rejected with
          ERR_MEASUREMENTS_INCOMPLETE (422) and no grading field is written -
          the vibration link is present precisely so the earlier priority-12
          check cannot mask this one.
        test_recipe:
          setup:
            - "A DRAFT inspection with a valid linked vibration reading and no measurements at all, on a standard whose required_feature_codes is [\"BORE\"]."
          setup_api_calls:
            - call: "POST /shop/customers"
