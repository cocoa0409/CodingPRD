            - "err1 == ERR_OWNERSHIP_MISMATCH (other child blocked)"
            - "err2 == ERR_FORBIDDEN_ROLE (list not in guardian's operations)"

  # ===========================================================================
  # Section: cross_cutting_layers
  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_stale_version_on_rtp_supersede
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[rtp-create-stale-injury]
          - entities.InjuryEvaluation.fields.version
        distinguishing_aspect: "OCC on InjuryEvaluation.version: after protocol P1 is created (injury version 2 -> 3), a second create carrying the stale expected_injury_version 2 is rejected 412 ERR_STALE_VERSION; retrying with the current version legitimately supersedes P1 (P1 -> TERMINATED, P2 ACTIVE)."
        test_recipe:
          setup: ["Cleared athlete; SPRAIN/MINOR injury; begin-care (version 2); protocol P1 created with expected_injury_version 2 (injury now version 3)"]
          setup_api_calls:
            - { call: "POST /staff", payload: { full_name: "Trainer One", role_type: ATHLETIC_TRAINER }, as: SystemAdmin, captures: { tr1: $.data.id } }
            - { call: "POST /staff", payload: { full_name: "Nurse Nia", role_type: SCHOOL_NURSE }, as: SystemAdmin, captures: { nr1: $.data.id } }
            - { call: "POST /athletes", payload: { full_name: "Athlete A", date_of_birth: "2009-05-01", grade: 11, sex: M, primary_sport: SOCCER, team_level: VARSITY, guardian_name: "GA", guardian_user_id: "g-9801", guardian_email: "ga@x.com" }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { a1: $.data.id } }
            - { call: "POST /physicals", payload: { athlete_id: "${a1}", exam_date: "2026-07-01", examining_physician_name: "Dr X", outcome: CLEARED, validity_policy: DISTRICT_13MO }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { ph1: $.data.id } }
            - { call: "POST /physicals/${ph1}/verify", payload: {}, as: SchoolNurse, as_user_id: "${nr1}" }
            - { call: "POST /baseline-tests", payload: { athlete_id: "${a1}", test_date: "2026-07-15", instrument: SCAT6, symptom_score: 0, memory_index: 95.0, reaction_time_ms: 250.0, balance_errors: 1 }, as: AthleticTrainer, as_user_id: "${tr1}" }
            - { call: "POST /injuries", payload: { athlete_id: "${a1}", body_region: KNEE, injury_type: SPRAIN, severity: MINOR, mechanism: "cut", evaluated_at: "2026-07-31T10:00:00Z", restricted_activities: [PRACTICE] }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { inj: $.data.id } }
            - { call: "POST /injuries/${inj}/begin-care", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}", captures: { inj_v2: $.data.version } }
            - { call: "POST /injuries/${inj}/rtp-protocols", payload: { protocol_type: GRADUATED_6_STAGE, expected_injury_version: "${inj_v2}" }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { p1: $.data.id } }
          trigger:
            - { call: "POST /injuries/${inj}/rtp-protocols", payload: { protocol_type: GRADUATED_6_STAGE, expected_injury_version: "${inj_v2}" }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { err: $.data.error_id } }
            - { call: "GET /injuries/${inj}", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}", captures: { inj_v3: $.data.version, inj_s: $.data.status } }
            - { call: "POST /injuries/${inj}/rtp-protocols", payload: { protocol_type: GRADUATED_6_STAGE, expected_injury_version: "${inj_v3}" }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { p2: $.data.id, p2_s: $.data.status } }
            - { call: "GET /rtp-protocols/${p1}", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}", captures: { p1_s: $.data.status } }
          assert:
            - "err == ERR_STALE_VERSION (http 412) — the create that bumped the injury to version 3 invalidated the stale expected version 2"
            - "inj_v3 == 3 and inj_s == RTP_IN_PROGRESS"
            - "p2_s == ACTIVE with the current version"
            - "p1_s == TERMINATED (superseded by P2)"

      - name: occ_stale_version_on_eap_activate
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[eap-activate-stale-venue]
          - entities.Venue.fields.version
        distinguishing_aspect: "OCC on Venue.version: after EAP1's activation bumps the venue to version 2, activating EAP2 with the stale expected_venue_version 1 fails 412; re-reading the venue and resubmitting with version 2 succeeds."
        test_recipe:
          setup: ["Venue V (version 1); EAP1 ACTIVE (venue -> 2); EAP2 APPROVED"]
          setup_api_calls:
            - { call: "POST /staff", payload: { full_name: "Trainer One", role_type: ATHLETIC_TRAINER }, as: SystemAdmin, captures: { tr1: $.data.id } }
            - { call: "POST /staff", payload: { full_name: "Director Dee", role_type: ATHLETIC_DIRECTOR }, as: SystemAdmin, captures: { ad: $.data.id } }
            - { call: "POST /venues", payload: { venue_name: "Stadium", venue_type: OUTDOOR, surface: GRASS, address: "1 Rd" }, as: SystemAdmin, captures: { v1: $.data.id, v_v0: $.data.version } }
            - { call: "POST /emergency-action-plans", payload: { venue_id: "${v1}", version_label: "v1", evacuation_route: "Gate A", aed_location: "Lobby", ems_contact: "911", nearest_hospital: "General" }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { eap1: $.data.id } }
            - { call: "POST /emergency-action-plans/${eap1}/submit", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}" }
            - { call: "POST /emergency-action-plans/${eap1}/approve", payload: {}, as: AthleticDirector, as_user_id: "${ad}" }
            - { call: "POST /emergency-action-plans/${eap1}/activate", payload: { expected_venue_version: "${v_v0}" }, as: AthleticDirector, as_user_id: "${ad}" }
            - { call: "POST /emergency-action-plans", payload: { venue_id: "${v1}", version_label: "v2", evacuation_route: "Gate B", aed_location: "Lobby", ems_contact: "911", nearest_hospital: "General", supersedes_eap_id: "${eap1}" }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { eap2: $.data.id } }
            - { call: "POST /emergency-action-plans/${eap2}/submit", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}" }
            - { call: "POST /emergency-action-plans/${eap2}/approve", payload: {}, as: AthleticDirector, as_user_id: "${ad}" }
          trigger:
            - { call: "POST /emergency-action-plans/${eap2}/activate", payload: { expected_venue_version: "${v_v0}" }, as: AthleticDirector, as_user_id: "${ad}", captures: { err: $.data.error_id } }
            - { call: "GET /venues/${v1}", payload: {}, as: SystemAdmin, captures: { v_v1: $.data.version } }
            - { call: "POST /emergency-action-plans/${eap2}/activate", payload: { expected_venue_version: "${v_v1}" }, as: AthleticDirector, as_user_id: "${ad}", captures: { e2_s: $.data.status } }
          assert:
            - "err == ERR_STALE_VERSION (http 412) — EAP1's activation moved the venue to version 2, invalidating the stale 1"
            - "v_v1 == 2"
            - "e2_s == ACTIVE after re-reading the current version"

      - name: derived_field_reconciliation_on_threshold_edit
        claim_type: derived_field_reconciliation
        grounds:
          - calculations.inventory_stock
          - entities.SupplyItem.fields.stock_status
        distinguishing_aspect: "stock_status is reconciled against a CHANGED threshold, not only against ledger appends: stock 10 with threshold 15 reads LOW_STOCK; PATCH threshold to 3 flips it to IN_STOCK with no new transactions; raising to 20 flips it back."
        test_recipe:
          setup: ["Item I (par 50, threshold 15) with stock 10 (one RESTOCK 10@100); clock 12:00"]
          setup_api_calls:
            - { call: "POST /staff", payload: { full_name: "Trainer One", role_type: ATHLETIC_TRAINER }, as: SystemAdmin, captures: { tr1: $.data.id } }
            - { call: "POST /supply-items", payload: { item_name: "Tape", category: TAPE, unit: ROLL, par_level: 50, reorder_threshold: 15, unit_cost_cents: 100 }, as: SystemAdmin, captures: { item: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T12:00:00Z" }, as: SystemAdmin }
            - { call: "POST /inventory-transactions", payload: { supply_item_id: "${item}", txn_type: RESTOCK, quantity: 10, unit_cost_cents: 100, occurred_at: "2026-08-01T09:00:00Z" }, as: AthleticTrainer, as_user_id: "${tr1}" }
            - { call: "GET /supply-items/${item}", payload: {}, as: SystemAdmin, captures: { s0: $.data.stock_status } }
          trigger:
            - { call: "PATCH /supply-items/${item}", payload: { reorder_threshold: 3 }, as: SystemAdmin, captures: { s1: $.data.stock_status, v1: $.data.version } }
            - { call: "PATCH /supply-items/${item}", payload: { reorder_threshold: 20 }, as: SystemAdmin, captures: { s2: $.data.stock_status } }
          assert:
            - "s0 == LOW_STOCK (10 <= 15)"
            - "s1 == IN_STOCK (10 > 3) and v1 bumps on the PATCH"
            - "s2 == LOW_STOCK (10 <= 20)"

      - name: event_cancel_leaves_terminal_assignments_untouched
        claim_type: cascading_side_effects
        grounds:
          - state_machines.AthleticEvent.SCHEDULED_to_CANCELLED
          - state_machines.CoverageAssignment.ASSIGNED_to_DECLINED
          - state_machines.CoverageAssignment.ASSIGNED_to_CANCELLED
        distinguishing_aspect: "Conditional cascade: cancelling the event cascades only to non-terminal assignments — the DECLINED assignment keeps its terminal state while the still-ASSIGNED one is CANCELLED."
        test_recipe:
          setup: ["FOOTBALL HOME_GAME (required 2) with ca1 (T1 PRIMARY, ASSIGNED) and ca2 (T2 SECONDARY, DECLINED) — event back to SCHEDULED after the decline"]
          setup_api_calls:
            - { call: "POST /staff", payload: { full_name: "Trainer One", role_type: ATHLETIC_TRAINER }, as: SystemAdmin, captures: { tr1: $.data.id } }
            - { call: "POST /staff", payload: { full_name: "Trainer Two", role_type: ATHLETIC_TRAINER }, as: SystemAdmin, captures: { tr2: $.data.id } }
            - { call: "POST /staff", payload: { full_name: "Director Dee", role_type: ATHLETIC_DIRECTOR }, as: SystemAdmin, captures: { ad: $.data.id } }
            - { call: "POST /venues", payload: { venue_name: "Stadium", venue_type: OUTDOOR, surface: GRASS, address: "1 Rd" }, as: SystemAdmin, captures: { v1: $.data.id } }
            - { call: "POST /events", payload: { event_name: "Game", sport: FOOTBALL, team_level: VARSITY, event_type: HOME_GAME, venue_id: "${v1}", scheduled_start: "2026-08-02T14:00:00Z", scheduled_end: "2026-08-02T17:00:00Z", expected_attendance: 500 }, as: AthleticDirector, as_user_id: "${ad}", captures: { ev: $.data.id } }
            - { call: "POST /coverage-assignments", payload: { event_id: "${ev}", staff_id: "${tr1}", coverage_role: PRIMARY }, as: AthleticDirector, as_user_id: "${ad}", captures: { ca1: $.data.id } }
            - { call: "POST /coverage-assignments", payload: { event_id: "${ev}", staff_id: "${tr2}", coverage_role: SECONDARY }, as: AthleticDirector, as_user_id: "${ad}", captures: { ca2: $.data.id } }
            - { call: "POST /coverage-assignments/${ca2}/decline", payload: {}, as: AthleticTrainer, as_user_id: "${tr2}", captures: { ca2_s: $.data.status } }
          trigger:
            - { call: "POST /events/${ev}/cancel", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}", captures: { ev_s: $.data.status } }
            - { call: "GET /coverage-assignments/${ca1}", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}", captures: { ca1_s: $.data.status } }
            - { call: "GET /coverage-assignments/${ca2}", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}", captures: { ca2_after: $.data.status } }
          assert:
            - "ca2_s == DECLINED (pre-cancel)"
            - "ev_s == CANCELLED"
            - "ca1_s == CANCELLED (non-terminal child cascaded)"
            - "ca2_after == DECLINED (terminal child untouched by the cascade)"

      - name: low_stock_boundary_at_threshold
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.inventory_stock
          - entities.SupplyItem.fields.stock_status
        distinguishing_aspect: "LOW_STOCK's upper edge is inclusive: stock exactly == reorder_threshold (15) reads LOW_STOCK; one more unit (16) reads IN_STOCK."
        test_recipe:
          setup: ["Item I (par 50, threshold 15); RESTOCK 15 @ 100; clock 12:00"]
          setup_api_calls:
            - { call: "POST /staff", payload: { full_name: "Trainer One", role_type: ATHLETIC_TRAINER }, as: SystemAdmin, captures: { tr1: $.data.id } }
            - { call: "POST /supply-items", payload: { item_name: "Tape", category: TAPE, unit: ROLL, par_level: 50, reorder_threshold: 15, unit_cost_cents: 100 }, as: SystemAdmin, captures: { item: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T12:00:00Z" }, as: SystemAdmin }
            - { call: "POST /inventory-transactions", payload: { supply_item_id: "${item}", txn_type: RESTOCK, quantity: 15, unit_cost_cents: 100, occurred_at: "2026-08-01T09:00:00Z" }, as: AthleticTrainer, as_user_id: "${tr1}" }
          trigger:
            - { call: "GET /supply-items/${item}", payload: {}, as: SystemAdmin, captures: { s15: $.data.stock_status, q15: $.data.current_stock } }
            - { call: "POST /inventory-transactions", payload: { supply_item_id: "${item}", txn_type: RESTOCK, quantity: 1, unit_cost_cents: 100, occurred_at: "2026-08-01T10:00:00Z" }, as: AthleticTrainer, as_user_id: "${tr1}" }
            - { call: "GET /supply-items/${item}", payload: {}, as: SystemAdmin, captures: { s16: $.data.stock_status, q16: $.data.current_stock } }
          assert:
            - "q15 == 15 and s15 == LOW_STOCK (threshold inclusive)"
            - "q16 == 16 and s16 == IN_STOCK"

      - name: notification_escalation_at_24h_boundary
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.notification_escalation_window
          - state_machines.GuardianNotification.SENT_to_ESCALATED
          - state_machines.GuardianNotification.ESCALATED_to_ACKNOWLEDGED
        distinguishing_aspect: "Escalation fires at now >= sent_at + 24h (inclusive): at +23:59:59 the notification is still SENT; at exactly +24:00:00 the clock sweep marks it ESCALATED; an ESCALATED notification remains acknowledgeable."
        test_recipe:
          setup: ["Athlete A (guardian_email set); injury -> INJURY_INITIAL notification; sent at clock 2026-08-02T09:00:00Z"]
          setup_api_calls:
            - { call: "POST /staff", payload: { full_name: "Trainer One", role_type: ATHLETIC_TRAINER }, as: SystemAdmin, captures: { tr1: $.data.id } }
            - { call: "POST /athletes", payload: { full_name: "Athlete A", date_of_birth: "2009-05-01", grade: 10, sex: F, primary_sport: SOCCER, team_level: JV, guardian_name: "Guard A", guardian_user_id: "g-9802", guardian_email: "ga@x.com" }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { a1: $.data.id } }
            - { call: "POST /injuries", payload: { athlete_id: "${a1}", body_region: KNEE, injury_type: SPRAIN, severity: MINOR, mechanism: "cut", evaluated_at: "2026-07-31T10:00:00Z", restricted_activities: [PRACTICE] }, as: AthleticTrainer, as_user_id: "${tr1}" }
            - { call: "GET /guardian-notifications", payload: { athlete_id: "${a1}" }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { n1: "$.data[0].id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T09:00:00Z" }, as: SystemAdmin }
            - { call: "POST /guardian-notifications/${n1}/send", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}", captures: { n_sent: $.data.sent_at } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T08:59:59Z" }, as: SystemAdmin }
            - { call: "GET /guardian-notifications/${n1}", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}", captures: { s_before: $.data.status } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:00:00Z" }, as: SystemAdmin }
            - { call: "GET /guardian-notifications/${n1}", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}", captures: { s_at: $.data.status } }
            - { call: "POST /guardian-notifications/${n1}/acknowledge", payload: {}, as: ParentGuardian, as_user_id: "g-9802", captures: { s_ack: $.data.status } }
          assert:
            - "n_sent == 2026-08-02T09:00:00Z"
            - "s_before == SENT (one second before the window)"
            - "s_at == ESCALATED at exactly sent_at + 24h (inclusive boundary)"
            - "s_ack == ACKNOWLEDGED (escalation does not close the ack path)"

      - name: cascading_side_effects_covered_by_difficulty
        claim_type: cascading_side_effects
        grounds:
          - state_machines.ReturnToPlayProtocol.ACTIVE_to_ACTIVE
          - state_machines.PhysicianReferral.SCHEDULED_to_COMPLETED
        excluded_because:
          difficulty_instance: referral_not_cleared_three_hop_cascade
          rationale: "Multi-hop cascades are asserted end-to-end by §1.8 instances referral_not_cleared_three_hop_cascade (depth 3), rtp_regress_injury_posture_cascade (depth 2), and restock_receive_ledger_budget_cascade (depth 2)."

      - name: dual_variant_calculation_covered_by_difficulty
        claim_type: dual_variant_calculation
        grounds:
          - calculations.inventory_valuation
          - calculations.heat_activity_tier
        excluded_because:
          difficulty_instance: inventory_fifo_vs_wac_running_same_ledger
          rationale: "Both-variant selection and divergence are asserted by §1.8 dual_variant_calc instances (heat policy, inventory valuation, physical expiry)."

  # ===========================================================================
  # Section: consistency_model (immediate)
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_on_create_and_mutation
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - entities.AthleticEvent.fields.required_trainer_count
          - entities.SupplyItem.fields.current_stock
        distinguishing_aspect: "Immediate consistency: the event creation response already carries the computed required_trainer_count (no re-read needed), and a read of the supply item in the request immediately after a ledger append reflects the new stock."
        test_recipe:
          setup: ["Director AD; venue V; item I"]
          setup_api_calls:
            - { call: "POST /staff", payload: { full_name: "Director Dee", role_type: ATHLETIC_DIRECTOR }, as: SystemAdmin, captures: { ad: $.data.id } }
            - { call: "POST /staff", payload: { full_name: "Trainer One", role_type: ATHLETIC_TRAINER }, as: SystemAdmin, captures: { tr1: $.data.id } }
            - { call: "POST /venues", payload: { venue_name: "Stadium", venue_type: OUTDOOR, surface: GRASS, address: "1 Rd" }, as: SystemAdmin, captures: { v1: $.data.id } }
            - { call: "POST /supply-items", payload: { item_name: "Tape", category: TAPE, unit: ROLL, par_level: 50, reorder_threshold: 15, unit_cost_cents: 100 }, as: SystemAdmin, captures: { item: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T12:00:00Z" }, as: SystemAdmin }
          trigger:
            - { call: "POST /events", payload: { event_name: "Game", sport: FOOTBALL, team_level: VARSITY, event_type: HOME_GAME, venue_id: "${v1}", scheduled_start: "2026-08-02T14:00:00Z", scheduled_end: "2026-08-02T17:00:00Z", expected_attendance: 500 }, as: AthleticDirector, as_user_id: "${ad}", captures: { ev_req: $.data.required_trainer_count, ev_s: $.data.status } }
            - { call: "POST /inventory-transactions", payload: { supply_item_id: "${item}", txn_type: RESTOCK, quantity: 5, unit_cost_cents: 100, occurred_at: "2026-08-01T09:00:00Z" }, as: AthleticTrainer, as_user_id: "${tr1}" }
            - { call: "GET /supply-items/${item}", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}", captures: { stock: $.data.current_stock, stock_s: $.data.stock_status } }
          assert:
            - "ev_req == 2 computed inside the creation response (HIGH-contact HOME_GAME base 2, no modifiers)"
            - "ev_s == SCHEDULED in the same response"
            - "stock == 5 and stock_s == LOW_STOCK on the immediate read-after-write"
