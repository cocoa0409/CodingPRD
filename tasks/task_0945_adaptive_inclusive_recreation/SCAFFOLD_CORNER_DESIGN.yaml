        grounds:
          - concurrency_rules[booking-create-stale-transport-run]
          - validations[priority=25]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "The run carries two independent counters, so a booking reusing the pre-booking run version is rejected with 412 rather than being allowed to compete for whichever pool it assumed was free."
