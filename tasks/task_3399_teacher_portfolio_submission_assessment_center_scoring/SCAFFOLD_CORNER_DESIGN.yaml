        distinguishing_aspect: "Every resource-specific 404 in the catalog is triggerable: unknown path ids return the matching ERR_*_NOT_FOUND, body-referenced ids (center_id, cycle_id, benchmark_id) likewise, and booking create without an open ASSESSMENT attempt returns ERR_SUBMISSION_NOT_FOUND."
        test_recipe:
          setup: ["Clock 2027-01-10; cycle NB-2027 OPEN; center exists; candidate A ELIGIBLE (no CKA submission); candidate B ELIGIBLE WITH an IN_PROGRESS CKA submission."]
          setup_api_calls:
