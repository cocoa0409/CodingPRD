            - "Visit.${v1}.admission_status remains CANCELLED"

      - name: cafe_allergen_safety_beats_points_fiscal
        grounds:
          - validations[priority=5]
          - validations[priority=8]
          - errors[ERR_ALLERGEN_CONFLICT]
          - errors[ERR_INSUFFICIENT_POINTS]
        distinguishing_aspect: |
          Error-category pair business_safety vs business_fiscal (different
          pair from checkin_state_beats_waiver_safety): an order whose lines
          conflict with a listed child's MILK allergy AND whose
          points_to_redeem exceeds the guardian's zero balance MUST return
          ERR_ALLERGEN_CONFLICT because safety (p5) precedes fiscal (p8).
        test_recipe:
          setup:
