      - name: plan_adoption_gated_on_commitment_activation_state
        grounds:
          - validations[priority=56]
          - state_machines.ServiceCommitment.DRAFT_to_ACTIVE
          - state_machines.ServiceCommitment.ACTIVE_to_FULFILLED
          - state_machines.PlanOfServices.DRAFT_to_ADOPTED
          - calculations.plan_service_readiness
        distinguishing_aspect: |
          Entity pair PlanOfServices <- ServiceCommitment: adoption depends on the *commitment's*
          state, not on the plan's own fields — while the POLICE commitment is DRAFT the plan's
          covered_service_types is empty and adopt fails with ERR_SERVICE_TYPE_NOT_COVERED, and
          activating that commitment (a write to a different entity) is what makes the identical
          adopt call succeed.
