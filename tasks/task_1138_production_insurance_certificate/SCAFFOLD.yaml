    description: "Create a renewal offer; auto-supersedes any prior OFFERED offer for the policy"
    roles: [UnderwriterAgent]
    code: 201
    input: [renewal_term_months]
    output: RenewalOffer
    side_effects: ["loss_ratio_pct computed", "offered_premium_cents computed", "prior OFFERED offers transition to SUPERSEDED", "offer_expires_at := created_at + 14 days"]

  - method: GET
    path: "/productions/{id}/policies/{pid}/renewal-offers"
    description: "List renewal offers"
    roles: [BrokerAgent, ProductionManager, UnderwriterAgent, PlatformOperator]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: RenewalOffer[]
    side_effects: []

