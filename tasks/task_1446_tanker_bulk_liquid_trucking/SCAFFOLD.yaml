# =============================================================================
# PRD Benchmark Scaffold — Tanker & Bulk Liquid Trucking
# Bulk liquid tank carrier: product compatibility & prior-load restriction,
# tank wash certificate & scheduling, loading rack access & meter ticket,
# hazmat placarding & driver endorsement, weight distribution & axle
# compliance, delivery metering & retain sample, spill response plan &
# incident reporting, dedicated-trailer program per customer.
# =============================================================================

scenario: |
  Tanker & Bulk Liquid Trucking (bulk liquid tank carrier): product
  compatibility & prior-load restriction, tank wash certificate & scheduling,
  loading rack access & meter ticket, hazmat placarding & driver endorsement,
  weight distribution & axle compliance, delivery metering & retain sample,
  spill response plan & incident reporting, dedicated-trailer program per
  customer

domain_name: tanker-bulk-liquid-trucking
api_prefix: /bulk-liquid

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
  entity_topology: flat            # peer entities joined by FK references; no URL nesting for CRUD
  state_machine_shape: cyclic      # Shipment LOADING->PLANNED loop; SpillIncident REPORTED<->UNDER_REVIEW + CLOSED->UNDER_REVIEW; SpillResponsePlan APPROVED<->SUSPENDED
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties  # meter-closer != weight-verifier; incident-closer != reopener
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Customer (shipper) legal name" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Maximum allowed credit exposure in cents" }
      - { name: dedicated_program_enrolled, type: boolean, source: input, default: false, description: "Whether customer participates in the dedicated-trailer program" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED (initial ACTIVE)" }
      - { name: exposure_cents, type: integer, source: computed, default: 0, description: "Read-only credit exposure per calculation customer_credit_exposure" }

  - name: Product
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Product name (e.g. Diesel ULSD)" }
      - { name: compatibility_group, type: enum, source: input, description: "PETROLEUM | SOLVENT | ACID | CAUSTIC | VEG_OIL | FOOD_GRADE | LATEX" }
      - { name: hazmat_class, type: enum, source: input, description: "NONE | CLASS_3_FLAMMABLE | CLASS_8_CORROSIVE | CLASS_6_TOXIC" }
      - { name: packing_group, type: enum, source: input, description: "NONE | I | II | III" }
      - { name: density_lb_per_gal, type: number, source: input, description: "Product density in pounds per gallon at 60F" }
      - { name: temp_coeff_per_degF, type: number, source: input, description: "Volumetric temperature correction coefficient per degree F" }
      - { name: placard_code, type: string, source: input, description: "Required DOT placard/UN code; 'NONE' for non-hazmat" }

  - name: CompatibilityRule
    parent: null
    common_fields: true
    fields:
      - { name: prior_group, type: enum, source: input, description: "Compatibility group of the trailer's previous load; same enum as Product.compatibility_group" }
      - { name: next_group, type: enum, source: input, description: "Compatibility group of the product to be loaded next" }
      - { name: required_wash_level, type: enum, source: input, description: "NONE | FLUSH | DETERGENT_WASH | CHEMICAL_KOSHER — minimum wash level required before loading next_group after prior_group" }
      - { name: forbidden, type: boolean, source: input, default: false, description: "If true, the pair may never be hauled consecutively regardless of wash", constraints: "(prior_group, next_group) pair is unique across all rules" }

  - name: TankTrailer
    parent: null
    common_fields: true
    fields:
      - { name: unit_number, type: string, source: input, description: "Fleet unit number", constraints: "unique across all trailers" }
      - { name: capacity_gallons, type: integer, source: input, description: "Maximum product capacity in gallons" }
      - { name: tare_weight_lb, type: integer, source: input, description: "Empty trailer+tractor tare weight; MUST equal tare_steer_lb + tare_drive_lb + tare_trailer_lb" }
      - { name: tare_steer_lb, type: integer, source: input, description: "Tare weight carried on steer axle" }
      - { name: tare_drive_lb, type: integer, source: input, description: "Tare weight carried on drive axles" }
      - { name: tare_trailer_lb, type: integer, source: input, description: "Tare weight carried on trailer axles" }
      - { name: steer_axle_rating_lb, type: integer, source: input, description: "Legal maximum load on steer axle (inclusive bound)" }
      - { name: drive_axle_rating_lb, type: integer, source: input, description: "Legal maximum load on drive axles (inclusive bound)" }
      - { name: trailer_axle_rating_lb, type: integer, source: input, description: "Legal maximum load on trailer axles (inclusive bound)" }
      - { name: gvwr_lb, type: integer, source: input, description: "Gross vehicle weight rating (inclusive bound on total)" }
      - { name: last_product_group, type: enum, source: computed, description: "Compatibility group of last completed load; null until first close-meter; set from shipment product at close-meter" }
      - { name: last_wash_cert_id, type: string, source: system, description: "FK -> TankWashCertificate.id; most recent certificate that reached CERTIFIED for this trailer; null allowed" }
      - { name: dedicated_customer_id, type: string, source: system, description: "FK -> Customer.id; set by DedicatedTrailerAgreement activate, cleared by terminate; null allowed" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | ASSIGNED (initial AVAILABLE; ASSIGNED while a PLANNED..DELIVERING shipment references it)" }

  - name: Driver
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Driver full name" }
      - { name: cdl_number, type: string, source: input, description: "CDL license number", constraints: "unique across all drivers" }
      - { name: tanker_endorsement, type: boolean, source: input, description: "N (tank vehicle) endorsement held" }
      - { name: hazmat_endorsement, type: boolean, source: input, description: "H (hazardous materials) endorsement held" }
      - { name: endorsement_expires_on, type: string, source: input, description: "ISO date YYYY-MM-DD; endorsements valid through this date inclusive" }
      - { name: status, type: enum, source: system, description: "ACTIVE | INACTIVE (initial ACTIVE)" }

  - name: WashBay
    parent: null
    common_fields: true
    fields:
      - { name: bay_code, type: string, source: input, description: "Wash bay identifier", constraints: "unique across all wash bays" }
      - { name: supported_wash_levels, type: array, source: input, description: "Array of wash levels this bay can perform: subset of FLUSH | DETERGENT_WASH | CHEMICAL_KOSHER" }
      - { name: cleanup_buffer_minutes, type: integer, source: input, default: 30, description: "Mandatory turnaround gap appended after each booking window on this bay" }

  - name: TankWashCertificate
    parent: null
    common_fields: true
    fields:
      - { name: trailer_id, type: string, source: input, description: "FK -> TankTrailer.id; trailer being washed" }
      - { name: wash_bay_id, type: string, source: input, description: "FK -> WashBay.id; bay where the wash is booked" }
      - { name: wash_level, type: enum, source: input, description: "FLUSH | DETERGENT_WASH | CHEMICAL_KOSHER" }
      - { name: window_start, type: datetime, source: input, description: "Scheduled wash window start (ISO 8601 UTC)" }
      - { name: window_end, type: datetime, source: input, description: "Scheduled wash window end (ISO 8601 UTC); must be > window_start" }
      - { name: certified_at, type: datetime, source: system, description: "Set to logical clock when certify action runs; null until then" }
      - { name: expires_at, type: datetime, source: computed, description: "certified_at + WASH_VALIDITY_HOURS[wash_level]; null until certified" }
      - { name: consumed_by_shipment_id, type: string, source: system, description: "FK -> Shipment.id; set when the holding shipment completes close-meter; null otherwise" }
      - { name: status, type: enum, source: system, description: "SCHEDULED -> CERTIFIED -> HELD -> CONSUMED; VOIDED (revoke/cancel-booking); EXPIRED (lazy, on read, when logical clock > expires_at)" }

  - name: LoadingRack
    parent: null
    common_fields: true
    fields:
      - { name: rack_code, type: string, source: input, description: "Rack identifier", constraints: "unique across all racks" }
      - { name: terminal_name, type: string, source: input, description: "Terminal facility name" }
      - { name: authorized_groups, type: array, source: input, description: "Compatibility groups this rack may load; subset of the Product.compatibility_group enum" }
      - { name: open_hour, type: integer, source: input, description: "Operating window open hour (0-23, UTC)" }
      - { name: close_hour, type: integer, source: input, description: "Operating window close hour (0-23, UTC); must be > open_hour" }
      - { name: meter_id, type: string, source: input, description: "Custody-transfer meter identifier" }

  - name: Shipment
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; shipper" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; product to haul" }
      - { name: ordered_gallons, type: integer, source: input, description: "Ordered quantity in gallons" }
      - { name: route_miles, type: integer, source: input, description: "One-way route distance in miles (drives allowed in-transit loss)" }
      - { name: rate_per_gal_cents, type: integer, source: input, description: "Freight rate in cents per gallon" }
      - { name: trailer_id, type: string, source: system, description: "FK -> TankTrailer.id; assigned at plan; null in DRAFT; cleared on unplan/cancel" }
      - { name: driver_id, type: string, source: system, description: "FK -> Driver.id; assigned at plan; null in DRAFT; cleared on unplan/cancel" }
      - { name: rack_id, type: string, source: system, description: "FK -> LoadingRack.id; assigned at plan; null in DRAFT; cleared on unplan/cancel" }
      - { name: wash_cert_id, type: string, source: system, description: "FK -> TankWashCertificate.id; attached at plan (optional when requirement NONE); cleared on unplan/cancel/revoke-cascade" }
      - { name: rack_window_start, type: datetime, source: system, description: "Reserved rack window start; null in DRAFT" }
      - { name: rack_window_end, type: datetime, source: system, description: "Reserved rack window end; null in DRAFT" }
      - { name: weights_verified_at, type: datetime, source: system, description: "Set when record-weights succeeds; null until then" }
      - { name: placards_confirmed, type: boolean, source: system, default: false, description: "True after confirm-placards succeeds" }
      - { name: provisional_total_cents, type: integer, source: computed, description: "Provisional billing total computed at close-meter (observed-gallon basis); null until LOADED" }
      - { name: final_total_cents, type: integer, source: computed, description: "Final billing total computed at reconcile (delivered net-60 basis minus shortage credit); null until RECONCILED" }
      - { name: reconciled_at, type: datetime, source: system, description: "Set at reconcile; null until then" }
      - { name: resolution_note, type: string, source: system, description: "Recorded by resolve-variance; null until then" }
      - { name: status, type: enum, source: system, description: "DRAFT -> PLANNED -> LOADING -> LOADED -> IN_TRANSIT -> DELIVERING -> DELIVERED -> RECONCILED; VARIANCE_REVIEW (from DELIVERING); CANCELLED (from DRAFT/PLANNED); LOADING -> PLANNED via abort-loading" }

  - name: MeterTicket
    parent: null
    common_fields: true
    fields:
      - { name: shipment_id, type: string, source: system, description: "FK -> Shipment.id; owning shipment (1 active ticket per shipment; history kept on VOIDED)" }
      - { name: rack_id, type: string, source: system, description: "FK -> LoadingRack.id; copied from shipment at check-in" }
      - { name: opened_at, type: datetime, source: system, description: "Logical clock at check-in" }
      - { name: closed_at, type: datetime, source: system, description: "Logical clock at close-meter; null while OPEN" }
      - { name: meter_start_gal, type: number, source: input, description: "Meter reading before loading (supplied at close-meter)" }
      - { name: meter_end_gal, type: number, source: input, description: "Meter reading after loading (supplied at close-meter)" }
      - { name: observed_temp_F, type: number, source: input, description: "Observed product temperature in deg F at the rack" }
      - { name: observed_gallons, type: number, source: computed, description: "meter_end_gal - meter_start_gal; 1 decimal, round_half_up" }
      - { name: net60_gallons, type: number, source: computed, description: "Temperature-corrected net gallons at 60F per calculation net60_temperature_correction; 1 decimal, round_half_up" }
      - { name: closed_by_user_id, type: string, source: system, description: "X-User-ID of the TerminalOperator who ran close-meter (segregation-of-duties anchor)" }
      - { name: status, type: enum, source: system, description: "OPEN -> CLOSED (close-meter) | VOIDED (abort-loading)" }

  - name: DeliveryTicket
    parent: null
    common_fields: true
    fields:
      - { name: shipment_id, type: string, source: system, description: "FK -> Shipment.id; owning shipment" }
      - { name: opened_at, type: datetime, source: system, description: "Logical clock at start-delivery" }
      - { name: closed_at, type: datetime, source: system, description: "Logical clock at delivery close; null while OPEN" }
      - { name: delivered_observed_gal, type: number, source: input, description: "Metered gallons delivered (observed basis)" }
      - { name: delivered_temp_F, type: number, source: input, description: "Observed temperature at delivery in deg F" }
      - { name: delivered_net60_gal, type: number, source: computed, description: "Temperature-corrected delivered gallons at 60F; 1 decimal, round_half_up" }
      - { name: loaded_net60_gal, type: number, source: system, description: "Snapshot of shipment's meter ticket net60_gallons at close" }
      - { name: allowed_loss_gal, type: number, source: computed, description: "Allowed in-transit loss per calculation allowed_delivery_loss" }
      - { name: variance_gallons, type: number, source: computed, description: "loaded_net60_gal - delivered_net60_gal (positive = shortage)" }
      - { name: closed_by_driver_id, type: string, source: system, description: "X-User-ID of the Driver who closed the ticket" }
      - { name: status, type: enum, source: system, description: "OPEN -> CLOSED_ACCEPTED | CLOSED_VARIANCE" }

  - name: RetainSample
    parent: null
    common_fields: true
    fields:
      - { name: shipment_id, type: string, source: system, description: "FK -> Shipment.id" }
      - { name: delivery_ticket_id, type: string, source: system, description: "FK -> DeliveryTicket.id; ticket whose close created this sample" }
      - { name: quantity_ml, type: integer, source: input, description: "Retain sample volume in milliliters (from delivery close retain_sample_ml)" }
      - { name: taken_at, type: datetime, source: system, description: "Logical clock at delivery close" }
      - { name: retain_until, type: datetime, source: computed, description: "taken_at + RETAIN_SAMPLE_DAYS (90)" }
      - { name: status, type: enum, source: system, description: "RETAINED -> DISPOSED (dispose allowed only when logical clock > retain_until)" }

  - name: SpillResponsePlan
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; plan owner" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; product covered" }
      - { name: equipment_checklist, type: array, source: input, description: "Array of strings listing spill kit equipment" }
      - { name: approved_at, type: datetime, source: system, description: "Logical clock at approve; null until APPROVED" }
      - { name: expires_at, type: datetime, source: computed, description: "approved_at + SPILL_PLAN_VALIDITY_DAYS (365); null until APPROVED" }
      - { name: status, type: enum, source: system, description: "DRAFT -> SUBMITTED -> APPROVED | REJECTED; APPROVED -> SUSPENDED -> APPROVED (cycle); EXPIRED (lazy, on read, when logical clock > expires_at)" }

  - name: SpillIncident
    parent: null
    common_fields: true
    fields:
      - { name: shipment_id, type: string, source: system, description: "FK -> Shipment.id; shipment during which the spill occurred" }
      - { name: reported_by_driver_id, type: string, source: system, description: "FK -> Driver.id; equals X-User-ID of the reporting Driver" }
      - { name: occurred_at, type: datetime, source: input, description: "When the spill occurred (ISO 8601 UTC)" }
      - { name: reported_at, type: datetime, source: system, description: "Logical clock at report creation" }
      - { name: gallons_spilled, type: number, source: input, description: "Estimated gallons spilled" }
      - { name: severity, type: enum, source: computed, description: "MINOR | MAJOR | REPORTABLE per calculation spill_severity_classification" }
      - { name: closed_by_user_id, type: string, source: system, description: "X-User-ID of the SafetyOfficer who closed the incident; null until CLOSED" }
      - { name: status, type: enum, source: system, description: "REPORTED -> UNDER_REVIEW -> REPORTED (request-info cycle) -> CLOSED; CLOSED -> UNDER_REVIEW (reopen)" }

  - name: DedicatedTrailerAgreement
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; must have dedicated_program_enrolled = true" }
      - { name: trailer_id, type: string, source: input, description: "FK -> TankTrailer.id; trailer dedicated to the customer" }
      - { name: committed_loads_per_month, type: integer, source: input, description: "Committed loads per calendar month" }
      - { name: effective_from, type: datetime, source: input, description: "Agreement period start (inclusive)" }
      - { name: effective_to, type: datetime, source: input, description: "Agreement period end (inclusive); must be >= effective_from" }
      - { name: flagged_shipment_count, type: integer, source: computed, default: 0, description: "Count of this (customer, trailer) shipments that entered VARIANCE_REVIEW while agreement ACTIVE; increments cascade" }
      - { name: last_settled_month, type: string, source: system, description: "Last settlement_month (YYYY-MM) processed by close-month; null until first close" }
      - { name: shortfall_events, type: integer, source: computed, default: 0, description: "Number of settled months with a shortfall fee" }
      - { name: shortfall_fees_total_cents, type: integer, source: computed, default: 0, description: "Cumulative shortfall fees assessed" }
      - { name: status, type: enum, source: system, description: "PENDING -> ACTIVE -> TERMINATED; ACTIVE -> SUSPENDED (cascade when flagged_shipment_count reaches FLAG_SUSPEND_THRESHOLD)" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Customer
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /bulk-liquid/customers/{customerId}/suspend"
        actor: FleetAdmin
        preconditions:
          - "Customer must be ACTIVE (else ERR_CUSTOMER_NOT_ACTIVE)"
        side_effects: []
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /bulk-liquid/customers/{customerId}/reactivate"
        actor: FleetAdmin
        preconditions:
          - "Customer must be SUSPENDED (else ERR_INVALID_REQUEST)"
        side_effects: []

  - entity: Driver
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: INACTIVE
        trigger: "POST /bulk-liquid/drivers/{driverId}/deactivate"
        actor: FleetAdmin
        preconditions:
          - "Driver must be ACTIVE (else ERR_DRIVER_NOT_ACTIVE)"
        side_effects: []

  - entity: TankTrailer
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: ASSIGNED
        trigger: "system (during POST /bulk-liquid/shipments/{id}/plan)"
        actor: system
        preconditions:
          - "Trailer must be AVAILABLE (else ERR_TRAILER_NOT_AVAILABLE)"
        side_effects: []
      - from: ASSIGNED
        to: AVAILABLE
        trigger: "system (during unplan, cancel, wash-cert revoke cascade, or delivery-ticket close)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: TankWashCertificate
    initial_state: SCHEDULED
    terminal_states: [CONSUMED, VOIDED, EXPIRED]
    transitions:
      - from: SCHEDULED
        to: CERTIFIED
        trigger: "POST /bulk-liquid/tank-wash-certificates/{certId}/certify"
        actor: WashOperator
        preconditions:
          - "Certificate must be SCHEDULED (else ERR_CERT_INVALID_STATE)"
        side_effects:
          - "certified_at = logical clock; expires_at = certified_at + WASH_VALIDITY_HOURS[wash_level]"
          - "TankTrailer.last_wash_cert_id = this certificate id"
      - from: SCHEDULED
        to: VOIDED
        trigger: "POST /bulk-liquid/tank-wash-certificates/{certId}/cancel-booking"
        actor: WashOperator
        preconditions:
          - "Certificate must be SCHEDULED (else ERR_CERT_INVALID_STATE)"
        side_effects: []
      - from: CERTIFIED
        to: HELD
        trigger: "system (during POST /bulk-liquid/shipments/{id}/plan when wash_cert_id references it)"
        actor: system
        preconditions:
          - "Certificate must be CERTIFIED and expires_at > logical clock (else ERR_CERT_INVALID_STATE / ERR_WASH_CERT_EXPIRED)"
        side_effects: []
      - from: HELD
        to: CERTIFIED
        trigger: "system (during shipment unplan, cancel, or wash-cert revoke cascade compensation)"
        actor: system
        preconditions: []
        side_effects:
          - "compensating release: certificate returns to the available pool unchanged"
      - from: HELD
        to: CONSUMED
        trigger: "system (during POST /bulk-liquid/shipments/{id}/close-meter)"
        actor: system
        preconditions: []
        side_effects:
          - "consumed_by_shipment_id = shipment id"
      - from: CERTIFIED
        to: VOIDED
        trigger: "POST /bulk-liquid/tank-wash-certificates/{certId}/revoke"
        actor: SafetyOfficer
        preconditions:
          - "Certificate must be CERTIFIED or HELD (else ERR_CERT_INVALID_STATE)"
        side_effects: []
      - from: HELD
        to: VOIDED
        trigger: "POST /bulk-liquid/tank-wash-certificates/{certId}/revoke"
        actor: SafetyOfficer
        preconditions:
          - "Certificate must be CERTIFIED or HELD (else ERR_CERT_INVALID_STATE)"
        side_effects:
          - "CASCADE hop 1: the holding Shipment (wash_cert_id == this cert, status PLANNED) reverts PLANNED -> DRAFT with wash_cert_id, trailer_id, driver_id, rack_id, rack_window_start, rack_window_end all cleared"
          - "CASCADE hop 2 (caused by hop 1's shipment revert): the released TankTrailer transitions ASSIGNED -> AVAILABLE"
      - from: CERTIFIED
        to: EXPIRED
        trigger: "system (lazy: fires on GET reads when logical clock > expires_at; plan-time use of an expired cert instead fails with ERR_WASH_CERT_EXPIRED without mutating the cert)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Shipment
    initial_state: DRAFT
    terminal_states: [RECONCILED, CANCELLED]
    transitions:
      - from: DRAFT
        to: PLANNED
        trigger: "POST /bulk-liquid/shipments/{shipmentId}/plan"
        actor: Dispatcher
        preconditions:
          - "Shipment must be DRAFT (else ERR_SHIPMENT_INVALID_STATE)"
          - "Compatibility: rule for (trailer.last_product_group, product.compatibility_group) must exist (ERR_COMPATIBILITY_RULE_MISSING) and not be forbidden (ERR_PRODUCT_INCOMPATIBILITY_FORBIDDEN); skipped when trailer.last_product_group is null"
          - "If required_wash_level != NONE or wash_cert_id supplied: certificate must be CERTIFIED (ERR_CERT_INVALID_STATE), unexpired (ERR_WASH_CERT_EXPIRED), level rank >= required rank (ERR_WASH_LEVEL_INSUFFICIENT), and cert.trailer_id == shipment trailer"
          - "Driver must be ACTIVE (ERR_DRIVER_NOT_ACTIVE), hold tanker endorsement, and hazmat endorsement when product.hazmat_class != NONE (ERR_DRIVER_ENDORSEMENT_MISSING), endorsements unexpired (ERR_DRIVER_ENDORSEMENT_EXPIRED)"
          - "Rack window within rack operating hours same UTC day (ERR_WINDOW_OUTSIDE_OPERATING_HOURS); no half-open overlap with other PLANNED/LOADING/LOADED shipments on same rack (ERR_RACK_WINDOW_CONFLICT)"
          - "Trailer AVAILABLE (ERR_TRAILER_NOT_AVAILABLE); trailer dedication matches customer (ERR_TRAILER_DEDICATION_MISMATCH); ordered_gallons <= trailer.capacity_gallons (ERR_CAPACITY_EXCEEDED)"
          - "Credit: customer.exposure_cents + provisional_estimate_cents <= customer.credit_limit_cents (ERR_CREDIT_LIMIT_EXCEEDED)"
        side_effects:
          - "Trailer AVAILABLE -> ASSIGNED"
          - "Attached wash certificate CERTIFIED -> HELD"
          - "Customer.exposure_cents recomputed"
      - from: PLANNED
        to: DRAFT
        trigger: "POST /bulk-liquid/shipments/{shipmentId}/unplan"
        actor: Dispatcher
        preconditions:
          - "Shipment must be PLANNED (else ERR_SHIPMENT_INVALID_STATE)"
        side_effects:
          - "Trailer ASSIGNED -> AVAILABLE; held cert HELD -> CERTIFIED; assignment fields cleared; Customer.exposure_cents recomputed"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /bulk-liquid/shipments/{shipmentId}/cancel"
        actor: Dispatcher
        preconditions:
          - "Shipment must be DRAFT or PLANNED (else ERR_SHIPMENT_INVALID_STATE)"
        side_effects: []
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /bulk-liquid/shipments/{shipmentId}/cancel"
        actor: Dispatcher
        preconditions:
          - "Shipment must be DRAFT or PLANNED (else ERR_SHIPMENT_INVALID_STATE)"
        side_effects:
          - "Trailer ASSIGNED -> AVAILABLE; held cert HELD -> CERTIFIED; assignment fields cleared; Customer.exposure_cents recomputed"
      - from: PLANNED
        to: LOADING
        trigger: "POST /bulk-liquid/shipments/{shipmentId}/check-in"
        actor: TerminalOperator
        preconditions:
          - "Shipment must be PLANNED (else ERR_SHIPMENT_INVALID_STATE)"
          - "Re-validation on state change: driver still ACTIVE and endorsements still valid (ERR_DRIVER_NOT_ACTIVE / ERR_DRIVER_ENDORSEMENT_MISSING / ERR_DRIVER_ENDORSEMENT_EXPIRED)"
          - "Logical clock within [rack_window_start, rack_window_end) (else ERR_RACK_WINDOW_NOT_ACTIVE)"
        side_effects:
          - "Creates MeterTicket (status OPEN, opened_at = clock, rack_id copied)"
      - from: LOADING
        to: PLANNED
        trigger: "POST /bulk-liquid/shipments/{shipmentId}/abort-loading"
        actor: TerminalOperator
        preconditions:
          - "Shipment must be LOADING (else ERR_SHIPMENT_INVALID_STATE)"
        side_effects:
          - "The OPEN MeterTicket -> VOIDED (ticket history retained)"
      - from: LOADING
        to: LOADED
        trigger: "POST /bulk-liquid/shipments/{shipmentId}/close-meter"
        actor: TerminalOperator
        preconditions:
          - "Shipment must be LOADING (else ERR_SHIPMENT_INVALID_STATE)"
          - "meter_end_gal > meter_start_gal (else ERR_INVALID_REQUEST)"
        side_effects:
          - "MeterTicket OPEN -> CLOSED: observed_gallons and net60_gallons computed; closed_by_user_id recorded"
          - "TankTrailer.last_product_group = product.compatibility_group"
          - "Held wash certificate HELD -> CONSUMED with consumed_by_shipment_id set"
          - "provisional_total_cents computed (observed-gallon variant of billing_totals)"
          - "Customer.exposure_cents recomputed"
      - from: LOADED
        to: LOADED
        trigger: "POST /bulk-liquid/shipments/{shipmentId}/record-weights (self-transition setting weights_verified_at)"
        actor: TerminalOperator
        preconditions:
          - "Shipment must be LOADED (else ERR_SHIPMENT_INVALID_STATE)"
          - "weights_verified_at must be null (else ERR_WEIGHTS_ALREADY_VERIFIED)"
          - "Segregation of duties: X-User-ID must differ from the meter ticket's closed_by_user_id (else ERR_SAME_OPERATOR_SEGREGATION)"
          - "Each measured axle <= its rating, equality allowed (else ERR_AXLE_LIMIT_EXCEEDED); sum <= gvwr_lb (else ERR_GVWR_EXCEEDED); sum within +/-3% of expected gross (else ERR_WEIGHT_SUM_INCONSISTENT)"
        side_effects:
          - "weights_verified_at = logical clock"
      - from: LOADED
        to: LOADED
        trigger: "POST /bulk-liquid/shipments/{shipmentId}/confirm-placards (self-transition setting placards_confirmed)"
        actor: TerminalOperator
        preconditions:
          - "Shipment must be LOADED (else ERR_SHIPMENT_INVALID_STATE)"
          - "observed_placard_code must equal product.placard_code (else ERR_PLACARD_MISMATCH)"
        side_effects:
          - "placards_confirmed = true"
      - from: LOADED
        to: IN_TRANSIT
        trigger: "POST /bulk-liquid/shipments/{shipmentId}/depart"
        actor: Dispatcher
        preconditions:
          - "Shipment must be LOADED (else ERR_SHIPMENT_INVALID_STATE)"
          - "weights_verified_at != null (else ERR_WEIGHTS_NOT_VERIFIED)"
          - "placards_confirmed == true (else ERR_PLACARDS_NOT_CONFIRMED)"
          - "A SpillResponsePlan for (customer_id, product_id) must be APPROVED with expires_at > logical clock (else ERR_SPILL_PLAN_NOT_APPROVED)"
        side_effects: []
      - from: IN_TRANSIT
        to: DELIVERING
        trigger: "POST /bulk-liquid/shipments/{shipmentId}/start-delivery"
        actor: Driver
        preconditions:
          - "Shipment must be IN_TRANSIT (else ERR_SHIPMENT_INVALID_STATE)"
          - "X-User-ID must equal shipment.driver_id (else ERR_INSUFFICIENT_PERMISSIONS)"
        side_effects:
          - "Creates DeliveryTicket (status OPEN, opened_at = clock)"
      - from: DELIVERING
        to: DELIVERED
        trigger: "system (during POST /bulk-liquid/delivery-tickets/{ticketId}/close when variance_gallons <= allowed_loss_gal, equality accepted)"
        actor: system
        preconditions: []
        side_effects:
          - "Trailer ASSIGNED -> AVAILABLE"
      - from: DELIVERING
        to: VARIANCE_REVIEW
        trigger: "system (during delivery-ticket close when variance_gallons > allowed_loss_gal)"
        actor: system
        preconditions: []
        side_effects:
          - "Trailer ASSIGNED -> AVAILABLE"
          - "CASCADE hop 1: DedicatedTrailerAgreement (customer_id, trailer_id) in ACTIVE has flagged_shipment_count += 1"
          - "CASCADE hop 2 (caused by hop 1's counter increment): if flagged_shipment_count >= FLAG_SUSPEND_THRESHOLD (2), agreement ACTIVE -> SUSPENDED"
      - from: VARIANCE_REVIEW
        to: DELIVERED
        trigger: "POST /bulk-liquid/shipments/{shipmentId}/resolve-variance"
        actor: SafetyOfficer
        preconditions:
          - "Shipment must be VARIANCE_REVIEW (else ERR_SHIPMENT_INVALID_STATE)"
        side_effects:
          - "resolution_note recorded"
      - from: DELIVERED
        to: RECONCILED
        trigger: "POST /bulk-liquid/shipments/{shipmentId}/reconcile"
        actor: FleetAdmin
        preconditions:
          - "Shipment must be DELIVERED (else ERR_SHIPMENT_INVALID_STATE)"
          - "No SpillIncident for this shipment in REPORTED or UNDER_REVIEW (else ERR_OPEN_INCIDENT)"
        side_effects:
          - "final_total_cents computed (net-60 variant of billing_totals with shortage credit)"
          - "reconciled_at = logical clock"
          - "Customer.exposure_cents recomputed"

  - entity: MeterTicket
    initial_state: OPEN
    terminal_states: [CLOSED, VOIDED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "system (during POST /bulk-liquid/shipments/{id}/close-meter)"
        actor: system
        preconditions: []
        side_effects:
          - "observed_gallons, net60_gallons computed; closed_at set"
      - from: OPEN
        to: VOIDED
        trigger: "system (during POST /bulk-liquid/shipments/{id}/abort-loading)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: DeliveryTicket
    initial_state: OPEN
    terminal_states: [CLOSED_ACCEPTED, CLOSED_VARIANCE]
    transitions:
      - from: OPEN
        to: CLOSED_ACCEPTED
        trigger: "POST /bulk-liquid/delivery-tickets/{ticketId}/close (variance_gallons <= allowed_loss_gal)"
        actor: Driver
        preconditions:
          - "Ticket must be OPEN (else ERR_DELIVERY_TICKET_NOT_OPEN)"
          - "X-User-ID must equal shipment.driver_id (else ERR_INSUFFICIENT_PERMISSIONS)"
        side_effects:
          - "delivered_net60_gal, allowed_loss_gal, variance_gallons computed; RetainSample created (RETAINED); shipment DELIVERING -> DELIVERED"
      - from: OPEN
        to: CLOSED_VARIANCE
        trigger: "POST /bulk-liquid/delivery-tickets/{ticketId}/close (variance_gallons > allowed_loss_gal)"
        actor: Driver
        preconditions:
          - "Ticket must be OPEN (else ERR_DELIVERY_TICKET_NOT_OPEN)"
        side_effects:
          - "Same computed fields and RetainSample creation; shipment DELIVERING -> VARIANCE_REVIEW with agreement flag cascade"

  - entity: RetainSample
    initial_state: RETAINED
    terminal_states: [DISPOSED]
    transitions:
      - from: RETAINED
        to: DISPOSED
        trigger: "POST /bulk-liquid/retain-samples/{sampleId}/dispose"
        actor: SafetyOfficer
        preconditions:
          - "Sample must be RETAINED (else ERR_SAMPLE_NOT_RETAINED)"
          - "Logical clock > retain_until (else ERR_SAMPLE_STILL_IN_RETENTION)"
        side_effects: []

  - entity: SpillResponsePlan
    initial_state: DRAFT
    terminal_states: [REJECTED, EXPIRED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /bulk-liquid/spill-response-plans/{planId}/submit"
        actor: CustomerRep
        preconditions:
          - "Plan must be DRAFT (else ERR_SPILL_PLAN_INVALID_STATE)"
          - "X-User-ID must equal plan.customer_id (else ERR_INSUFFICIENT_PERMISSIONS)"
        side_effects: []
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /bulk-liquid/spill-response-plans/{planId}/approve"
        actor: SafetyOfficer
        preconditions:
          - "Plan must be SUBMITTED (else ERR_SPILL_PLAN_INVALID_STATE)"
        side_effects:
          - "approved_at = clock; expires_at = approved_at + 365 days"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /bulk-liquid/spill-response-plans/{planId}/reject"
        actor: SafetyOfficer
        preconditions:
          - "Plan must be SUBMITTED (else ERR_SPILL_PLAN_INVALID_STATE)"
        side_effects: []
      - from: APPROVED
        to: SUSPENDED
        trigger: "POST /bulk-liquid/spill-response-plans/{planId}/suspend"
        actor: SafetyOfficer
        preconditions:
          - "Plan must be APPROVED (else ERR_SPILL_PLAN_INVALID_STATE)"
        side_effects: []
      - from: SUSPENDED
        to: APPROVED
        trigger: "POST /bulk-liquid/spill-response-plans/{planId}/reinstate"
        actor: SafetyOfficer
        preconditions:
          - "Plan must be SUSPENDED (else ERR_SPILL_PLAN_INVALID_STATE)"
        side_effects:
          - "expires_at unchanged from original approval"
      - from: APPROVED
        to: EXPIRED
        trigger: "system (lazy, on read, when logical clock > expires_at)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: SpillIncident
    initial_state: REPORTED
    terminal_states: [CLOSED]
    transitions:
      - from: REPORTED
        to: UNDER_REVIEW
        trigger: "POST /bulk-liquid/spill-incidents/{incidentId}/start-review"
        actor: SafetyOfficer
        preconditions:
          - "Incident must be REPORTED (else ERR_INCIDENT_INVALID_STATE)"
        side_effects: []
      - from: UNDER_REVIEW
        to: REPORTED
        trigger: "POST /bulk-liquid/spill-incidents/{incidentId}/request-info"
        actor: SafetyOfficer
        preconditions:
          - "Incident must be UNDER_REVIEW (else ERR_INCIDENT_INVALID_STATE)"
        side_effects: []
      - from: UNDER_REVIEW
        to: CLOSED
        trigger: "POST /bulk-liquid/spill-incidents/{incidentId}/close"
        actor: SafetyOfficer
        preconditions:
          - "Incident must be UNDER_REVIEW (else ERR_INCIDENT_INVALID_STATE)"
          - "Shipment must be in DELIVERED, VARIANCE_REVIEW, RECONCILED, or CANCELLED (else ERR_SHIPMENT_NOT_DELIVERED)"
        side_effects:
          - "closed_by_user_id = X-User-ID"
      - from: CLOSED
        to: UNDER_REVIEW
        trigger: "POST /bulk-liquid/spill-incidents/{incidentId}/reopen"
        actor: SafetyOfficer
        preconditions:
          - "Incident must be CLOSED (else ERR_INCIDENT_INVALID_STATE)"
          - "Segregation of duties: X-User-ID must differ from closed_by_user_id (else ERR_SAME_OPERATOR_SEGREGATION)"
        side_effects:
          - "closed_by_user_id cleared"

  - entity: DedicatedTrailerAgreement
    initial_state: PENDING
    terminal_states: [TERMINATED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /bulk-liquid/dedicated-trailer-agreements/{agreementId}/activate"
        actor: FleetAdmin
        preconditions:
          - "Agreement must be PENDING (else ERR_AGREEMENT_INVALID_STATE)"
          - "Trailer must not already be dedicated (trailer.dedicated_customer_id null, else ERR_TRAILER_ALREADY_DEDICATED)"
        side_effects:
          - "TankTrailer.dedicated_customer_id = agreement.customer_id"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (cascade: flagged_shipment_count reaches FLAG_SUSPEND_THRESHOLD of 2)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /bulk-liquid/dedicated-trailer-agreements/{agreementId}/terminate"
        actor: FleetAdmin
        preconditions:
          - "Agreement must be ACTIVE or SUSPENDED (else ERR_AGREEMENT_INVALID_STATE)"
        side_effects:
          - "TankTrailer.dedicated_customer_id cleared (compensating release)"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /bulk-liquid/dedicated-trailer-agreements/{agreementId}/terminate"
        actor: FleetAdmin
        preconditions:
          - "Agreement must be ACTIVE or SUSPENDED (else ERR_AGREEMENT_INVALID_STATE)"
        side_effects:
          - "TankTrailer.dedicated_customer_id cleared (compensating release)"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: shipment-patch-stale-version
    parent_entity: Shipment
    write_endpoint: "PATCH /bulk-liquid/shipments/{shipmentId}"
    occ_field: expected_shipment_version
    description: |
      Revising a DRAFT shipment's commercial terms with an
      expected_shipment_version that no longer matches the shipment's current
      version is rejected: another writer has already advanced the shipment
      (e.g., a prior accepted revision), so the current writer's view is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: agreement-patch-stale-version
    parent_entity: DedicatedTrailerAgreement
    write_endpoint: "PATCH /bulk-liquid/dedicated-trailer-agreements/{agreementId}"
    occ_field: expected_agreement_version
    description: |
      Revising a PENDING dedicated-trailer agreement's committed volume with an
      expected_agreement_version that no longer matches the agreement's current
      version is rejected: the agreement has been mutated since the client last
      observed it, so the client's base revision is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: net60_temperature_correction
    trigger: "close-meter (MeterTicket) and delivery-ticket close (DeliveryTicket)"
    algorithm: linear_correction
    formula: |
      observed = meter_end_gal - meter_start_gal              (meter ticket)
      observed = delivered_observed_gal                        (delivery ticket)
      net60 = round_half_up_1dp( observed * (1 - product.temp_coeff_per_degF * (observed_temp_F - 60)) )
      At exactly 60F the two bases coincide; off 60F they diverge.
    input_set: "The single MeterTicket/DeliveryTicket being closed; product via shipment.product_id"
    constants:
      REFERENCE_TEMP_F: 60
    precision: "1 decimal place, round_half_up"
    variants:
      - name: observed_basis
        when: "provisional billing at close-meter"
        difference: "uses raw observed gallons with NO temperature correction"
      - name: net60_basis
        when: "delivery variance and final billing at reconcile"
        difference: "uses temperature-corrected net-60 gallons"

  - name: billing_totals
    trigger: "provisional at close-meter; final at reconcile"
    algorithm: aggregation
    formula: |
      Pinned evaluation order (circular-free, per-line rounding — round each
      line to integer cents BEFORE summing; sum-first-then-round is WRONG):
        product_charge_cents = round_half_up(basis_gallons * rate_per_gal_cents)
        fuel_surcharge_cents = round_half_up(FUEL_SURCHARGE_PCT * product_charge_cents)
        total_cents = product_charge_cents + fuel_surcharge_cents + RACK_FEE_CENTS - shortage_credit_cents
      Provisional (close-meter): basis_gallons = MeterTicket.observed_gallons; shortage_credit_cents = 0.
      Final (reconcile): basis_gallons = DeliveryTicket.delivered_net60_gal;
        shortage_credit_cents = round_half_up(max(0, loaded_net60_gal - delivered_net60_gal - allowed_loss_gal) * rate_per_gal_cents).
    input_set: "Shipment row + its CLOSED MeterTicket + its CLOSED_* DeliveryTicket"
    constants:
      RACK_FEE_CENTS: 15000
      FUEL_SURCHARGE_PCT: 0.04
    precision: "integer cents, round_half_up per line"
    variants:
      - name: provisional_billing
        when: "close-meter"
        difference: "observed-gallon basis, no shortage credit -> stored in provisional_total_cents"
      - name: final_billing
        when: "reconcile"
        difference: "net-60 delivered basis minus shortage credit -> stored in final_total_cents; differs from provisional for identical route data whenever temperature or shortage is non-zero"

  - name: allowed_delivery_loss
    trigger: "delivery-ticket close"
    algorithm: threshold
    formula: |
      allowed_loss_gal = min(LOSS_CAP_GAL, LOSS_BASE_GAL + LOSS_PER_MILE_GAL * route_miles)
      variance_gallons   = loaded_net60_gal - delivered_net60_gal
      if variance_gallons <= allowed_loss_gal:  CLOSED_ACCEPTED   (equality ACCEPTS)
      else:                                     CLOSED_VARIANCE   (strictly greater rejects)
    input_set: "DeliveryTicket being closed; route_miles from its Shipment"
    constants:
      LOSS_BASE_GAL: 5.0
      LOSS_PER_MILE_GAL: 0.02
      LOSS_CAP_GAL: 50.0
    precision: "1 decimal place, round_half_up"

  - name: axle_load_compliance
    trigger: "record-weights"
    algorithm: constraint_propagation
    formula: |
      product_weight_lb  = round_half_up_0dp(net60_gallons * product.density_lb_per_gal)
      expected_gross_lb  = trailer.tare_weight_lb + product_weight_lb
      Checks, IN THIS ORDER:
        1. steer_lb  <= trailer.steer_axle_rating_lb   (equality PASSES)
        2. drive_lb  <= trailer.drive_axle_rating_lb
        3. trailer_lb <= trailer.trailer_axle_rating_lb
        4. steer_lb + drive_lb + trailer_lb <= trailer.gvwr_lb
        5. abs(sum - expected_gross_lb) <= 0.03 * expected_gross_lb   (boundary 3% inclusive)
    input_set: "Shipment in LOADED, its CLOSED MeterTicket, its TankTrailer, its Product"
    constants:
      WEIGHT_SUM_TOLERANCE_PCT: 0.03
    precision: "integer pounds"

  - name: wash_requirement_resolution
    trigger: "plan"
    algorithm: constraint_propagation
    formula: |
      level_rank = { NONE: 0, FLUSH: 1, DETERGENT_WASH: 2, CHEMICAL_KOSHER: 3 }
      if trailer.last_product_group is null: requirement = NONE (no rule lookup)
      else:
        rule = CompatibilityRule[prior=trailer.last_product_group, next=product.compatibility_group]
        missing rule      -> ERR_COMPATIBILITY_RULE_MISSING
        rule.forbidden    -> ERR_PRODUCT_INCOMPATIBILITY_FORBIDDEN
        requirement = rule.required_wash_level
      if requirement == NONE: wash cert optional; if one is attached it must still be CERTIFIED and unexpired
      else: attached cert required, level_rank[cert.wash_level] >= level_rank[requirement],
            cert CERTIFIED, cert.expires_at > clock, cert.trailer_id == shipment.trailer_id
    input_set: "Shipment being planned, its TankTrailer, its Product, matching CompatibilityRule, attached TankWashCertificate"
    constants:
      WASH_VALIDITY_HOURS: { FLUSH: 48, DETERGENT_WASH: 96, CHEMICAL_KOSHER: 168 }

  - name: customer_credit_exposure
    trigger: "plan (check + recompute), close-meter, reconcile, unplan, cancel"
    algorithm: aggregation
    formula: |
      exposure_cents =
          sum(provisional_total_cents) over shipments of customer with status IN
              {PLANNED, LOADING, LOADED, IN_TRANSIT, DELIVERING, DELIVERED, VARIANCE_REVIEW}
              -- for PLANNED shipments (no meter ticket yet) use the plan-time estimate
              -- estimate = round(ordered_gallons*rate) + round(0.04*that) + 15000
        + sum(final_total_cents)     over shipments of customer with status = RECONCILED
      DRAFT and CANCELLED shipments contribute 0.
      Plan gate: exposure_cents + new_estimate_cents <= credit_limit_cents (equality ALLOWED).
    input_set: "All shipments of the customer in the listed statuses"
    constants:
      RACK_FEE_CENTS: 15000
      FUEL_SURCHARGE_PCT: 0.04
    precision: "integer cents"

  - name: dedicated_shortfall_settlement
    trigger: "POST /bulk-liquid/dedicated-trailer-agreements/{id}/close-month"
    algorithm: threshold
    formula: |
      completed = count of shipments with shipment.customer_id = agreement.customer_id
                  AND shipment.trailer_id = agreement.trailer_id
                  AND status = RECONCILED
                  AND reconciled_at IN [settlement_month-01T00:00:00Z, next_month-01T00:00:00Z)   (half-open month window)
      floor_loads = ceil(COMMITMENT_FLOOR_PCT * committed_loads_per_month)
      if completed < floor_loads:
          fee = (floor_loads - completed) * SHORTFALL_FEE_PER_LOAD_CENTS
          shortfall_fees_total_cents += fee; shortfall_events += 1
      else: no fee (completed == floor_loads is COMPLIANT — strict less-than triggers)
      last_settled_month = settlement_month
    input_set: "Agreement + shipments of (customer, trailer) reconciled in the target month"
    constants:
      COMMITMENT_FLOOR_PCT: 0.8
      SHORTFALL_FEE_PER_LOAD_CENTS: 25000
    precision: "integer cents; ceil for floor_loads"

  - name: spill_severity_classification
    trigger: "spill incident creation"
    algorithm: threshold
    formula: |
      if gallons_spilled < 10:            severity = MINOR
      elif gallons_spilled < 100:         severity = MAJOR      (10.0 exactly -> MAJOR)
      else:                               severity = REPORTABLE (100.0 exactly -> REPORTABLE)
      REPORTABLE incidents must be reported within REPORTABLE_DEADLINE_HOURS of occurred_at:
        reported_at - occurred_at <= 12h  (equality ALLOWED), else ERR_REPORT_DEADLINE_MISSED
    input_set: "The SpillIncident being created"
    constants:
      MAJOR_THRESHOLD_GAL: 10
      REPORTABLE_THRESHOLD_GAL: 100
      REPORTABLE_DEADLINE_HOURS: 12
    precision: "gallons as given"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and role is a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per RBAC; identity match for entity-backed roles (Driver must equal shipment.driver_id; CustomerRep must equal customer_id)"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path ids then body-reference ids exist, validated left-to-right"
    error_id: "ERR_<RESOURCE>_NOT_FOUND"
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: business_constraint
    check: "Request shape: required fields present, enum members valid, scalar ranges sane (window_end > window_start, close_hour > open_hour, quantities > 0); unknown body fields rejected; tare_steer+tare_drive+tare_trailer == tare_weight on trailer create (ERR_TARE_AXLE_MISMATCH)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 5
    category: state
    check: "OCC: expected_<parent>_version matches current entity version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "PATCH /bulk-liquid/shipments/{id}, PATCH /bulk-liquid/dedicated-trailer-agreements/{id}"
  - priority: 6
    category: state
    check: "Target entity in the required from-state for the requested transition; referenced-entity state gates (customer ACTIVE, driver ACTIVE, trailer AVAILABLE, ticket OPEN)"
    error_id: "ERR_SHIPMENT_INVALID_STATE | ERR_CERT_INVALID_STATE | ERR_DELIVERY_TICKET_NOT_OPEN | ERR_SAMPLE_NOT_RETAINED | ERR_SPILL_PLAN_INVALID_STATE | ERR_INCIDENT_INVALID_STATE | ERR_AGREEMENT_INVALID_STATE | ERR_CUSTOMER_NOT_ACTIVE | ERR_TRAILER_NOT_AVAILABLE | ERR_DRIVER_NOT_ACTIVE | ERR_WEIGHTS_ALREADY_VERIFIED | ERR_WEIGHTS_NOT_VERIFIED | ERR_PLACARDS_NOT_CONFIRMED"
    http_status: 409  # all state errors are 409
    applies_to: "all state-transition endpoints"
  - priority: 7
    category: business_safety
    check: "Compatibility pair not forbidden / rule exists; wash level rank sufficient; driver endorsements present; placard code matches product; axle/gvwr/weight-sum compliance; approved spill response plan present at depart"
    error_id: "ERR_PRODUCT_INCOMPATIBILITY_FORBIDDEN | ERR_COMPATIBILITY_RULE_MISSING | ERR_WASH_LEVEL_INSUFFICIENT | ERR_DRIVER_ENDORSEMENT_MISSING | ERR_PLACARD_MISMATCH | ERR_AXLE_LIMIT_EXCEEDED | ERR_GVWR_EXCEEDED | ERR_WEIGHT_SUM_INCONSISTENT | ERR_SPILL_PLAN_NOT_APPROVED"
    http_status: 422
    applies_to: "plan, check-in, confirm-placards, record-weights, depart"
  - priority: 8
    category: business_temporal
    check: "Temporal rules: rack window within operating hours; rack window overlap (half-open, zero buffer); wash-bay window overlap (cleanup buffer appended); wash cert expired; endorsement expiry; spill report deadline; sample retention; agreement period overlap; settlement month ordering"
    error_id: "ERR_WINDOW_OUTSIDE_OPERATING_HOURS | ERR_RACK_WINDOW_CONFLICT(409) | ERR_WASH_BAY_WINDOW_CONFLICT(409) | ERR_WASH_CERT_EXPIRED | ERR_DRIVER_ENDORSEMENT_EXPIRED | ERR_RACK_WINDOW_NOT_ACTIVE | ERR_REPORT_DEADLINE_MISSED | ERR_SAMPLE_STILL_IN_RETENTION | ERR_AGREEMENT_PERIOD_CONFLICT(409) | ERR_MONTH_NOT_CLOSABLE"
    http_status: 422  # 422 unless marked (409) inline; authoritative codes in §1.6
    applies_to: "plan, cert create, check-in, incident create, sample dispose, agreement create, close-month"
  - priority: 9
    category: business_constraint
    check: "Uniqueness (unit_number, cdl_number, rule pair); capacity; dedication match; segregation of duties"
    error_id: "ERR_DUPLICATE_UNIT_NUMBER(409) | ERR_DUPLICATE_CDL_NUMBER(409) | ERR_DUPLICATE_COMPATIBILITY_RULE(409) | ERR_CAPACITY_EXCEEDED | ERR_TRAILER_DEDICATION_MISMATCH | ERR_TRAILER_ALREADY_DEDICATED(409) | ERR_SAME_OPERATOR_SEGREGATION(403) | ERR_NOT_PROGRAM_ENROLLED"
    http_status: 422  # 422 unless marked (409)/(403) inline; authoritative codes in §1.6
    applies_to: "create endpoints, plan, record-weights, incident reopen, agreement activate"
  - priority: 10
    category: business_referential
    check: "Cross-entity referential gates: rack authorized for product group; no open spill incident at reconcile"
    error_id: "ERR_RACK_NOT_AUTHORIZED_FOR_PRODUCT | ERR_OPEN_INCIDENT(409)"
    http_status: 422  # 422 unless marked (409) inline; authoritative codes in §1.6
    applies_to: "plan, reconcile"
  - priority: 11
    category: business_fiscal
    check: "Credit exposure gate at plan: exposure_cents + provisional_estimate_cents <= credit_limit_cents"
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 402
    applies_to: "plan"

# =============================================================================
# §1.5 API Endpoint Table
# (flat topology; all list endpoints return results ordered by created_at ASC
#  and support limit/offset pagination per §1.0)
# =============================================================================
endpoints:
  # --- logical clock (test-driving) ---
  - { method: POST, path: "/bulk-liquid/_clock/set_current_utc", description: "Set the server logical clock. Startup default (before any call) is exactly 2026-08-01T00:00:00Z and MUST NOT fall back to wall-clock time.", roles: [FleetAdmin], code: 200, input: [to_iso8601], output: null, side_effects: ["lazy EXPIRED transitions re-evaluate on subsequent reads"] }

  # --- Customer ---
  - { method: POST, path: "/bulk-liquid/customers", description: "Create customer", roles: [FleetAdmin], code: 201, input: [name, credit_limit_cents, "dedicated_program_enrolled?"], output: Customer, side_effects: ["status=ACTIVE, exposure_cents=0"] }
  - { method: GET, path: "/bulk-liquid/customers", description: "List customers", roles: [FleetAdmin, Dispatcher, TerminalOperator, WashOperator, SafetyOfficer, Driver, CustomerRep], code: 200, input: ["limit?", "offset?", "status?"], output: "Customer[]", side_effects: [] }
  - { method: GET, path: "/bulk-liquid/customers/{customerId}", description: "Get customer", roles: [FleetAdmin, Dispatcher, TerminalOperator, WashOperator, SafetyOfficer, Driver, CustomerRep], code: 200, input: [], output: Customer, side_effects: [] }
  - { method: POST, path: "/bulk-liquid/customers/{customerId}/suspend", description: "Suspend customer", roles: [FleetAdmin], code: 200, input: [], output: Customer, side_effects: ["status -> SUSPENDED"] }
  - { method: POST, path: "/bulk-liquid/customers/{customerId}/reactivate", description: "Reactivate customer", roles: [FleetAdmin], code: 200, input: [], output: Customer, side_effects: ["status -> ACTIVE"] }

  # --- Product ---
  - { method: POST, path: "/bulk-liquid/products", description: "Create product", roles: [FleetAdmin], code: 201, input: [name, compatibility_group, hazmat_class, packing_group, density_lb_per_gal, temp_coeff_per_degF, placard_code], output: Product, side_effects: [] }
  - { method: GET, path: "/bulk-liquid/products", description: "List products", roles: [FleetAdmin, Dispatcher, TerminalOperator, WashOperator, SafetyOfficer, Driver, CustomerRep], code: 200, input: ["limit?", "offset?", "compatibility_group?"], output: "Product[]", side_effects: [] }
  - { method: GET, path: "/bulk-liquid/products/{productId}", description: "Get product", roles: [FleetAdmin, Dispatcher, TerminalOperator, WashOperator, SafetyOfficer, Driver, CustomerRep], code: 200, input: [], output: Product, side_effects: [] }

  # --- CompatibilityRule ---
  - { method: POST, path: "/bulk-liquid/compatibility-rules", description: "Create prior-load compatibility rule; (prior_group,next_group) unique", roles: [FleetAdmin], code: 201, input: [prior_group, next_group, required_wash_level, "forbidden?"], output: CompatibilityRule, side_effects: [] }
  - { method: GET, path: "/bulk-liquid/compatibility-rules", description: "List compatibility rules", roles: [FleetAdmin, Dispatcher, TerminalOperator, WashOperator, SafetyOfficer, Driver, CustomerRep], code: 200, input: ["limit?", "offset?", "prior_group?", "next_group?"], output: "CompatibilityRule[]", side_effects: [] }
  - { method: GET, path: "/bulk-liquid/compatibility-rules/{ruleId}", description: "Get compatibility rule", roles: [FleetAdmin, Dispatcher, TerminalOperator, WashOperator, SafetyOfficer, Driver, CustomerRep], code: 200, input: [], output: CompatibilityRule, side_effects: [] }

  # --- TankTrailer ---
  - { method: POST, path: "/bulk-liquid/trailers", description: "Create tank trailer; tare axles must sum to tare weight", roles: [FleetAdmin], code: 201, input: [unit_number, capacity_gallons, tare_weight_lb, tare_steer_lb, tare_drive_lb, tare_trailer_lb, steer_axle_rating_lb, drive_axle_rating_lb, trailer_axle_rating_lb, gvwr_lb], output: TankTrailer, side_effects: ["status=AVAILABLE, last_product_group=null"] }
  - { method: GET, path: "/bulk-liquid/trailers", description: "List trailers", roles: [FleetAdmin, Dispatcher, TerminalOperator, WashOperator, SafetyOfficer, Driver, CustomerRep], code: 200, input: ["limit?", "offset?", "status?", "dedicated_customer_id?", "last_wash_cert_id?"], output: "TankTrailer[]", side_effects: [] }
  - { method: GET, path: "/bulk-liquid/trailers/{trailerId}", description: "Get trailer", roles: [FleetAdmin, Dispatcher, TerminalOperator, WashOperator, SafetyOfficer, Driver, CustomerRep], code: 200, input: [], output: TankTrailer, side_effects: [] }

  # --- Driver ---
  - { method: POST, path: "/bulk-liquid/drivers", description: "Create driver", roles: [FleetAdmin], code: 201, input: [full_name, cdl_number, tanker_endorsement, hazmat_endorsement, endorsement_expires_on], output: Driver, side_effects: ["status=ACTIVE"] }
  - { method: GET, path: "/bulk-liquid/drivers", description: "List drivers", roles: [FleetAdmin, Dispatcher, TerminalOperator, WashOperator, SafetyOfficer, Driver, CustomerRep], code: 200, input: ["limit?", "offset?", "status?"], output: "Driver[]", side_effects: [] }
  - { method: GET, path: "/bulk-liquid/drivers/{driverId}", description: "Get driver", roles: [FleetAdmin, Dispatcher, TerminalOperator, WashOperator, SafetyOfficer, Driver, CustomerRep], code: 200, input: [], output: Driver, side_effects: [] }
  - { method: POST, path: "/bulk-liquid/drivers/{driverId}/deactivate", description: "Deactivate driver", roles: [FleetAdmin], code: 200, input: [], output: Driver, side_effects: ["status -> INACTIVE"] }

  # --- WashBay ---
  - { method: POST, path: "/bulk-liquid/wash-bays", description: "Create wash bay", roles: [FleetAdmin], code: 201, input: [bay_code, supported_wash_levels, "cleanup_buffer_minutes?"], output: WashBay, side_effects: [] }
  - { method: GET, path: "/bulk-liquid/wash-bays", description: "List wash bays", roles: [FleetAdmin, Dispatcher, TerminalOperator, WashOperator, SafetyOfficer, Driver, CustomerRep], code: 200, input: ["limit?", "offset?"], output: "WashBay[]", side_effects: [] }
  - { method: GET, path: "/bulk-liquid/wash-bays/{washBayId}", description: "Get wash bay", roles: [FleetAdmin, Dispatcher, TerminalOperator, WashOperator, SafetyOfficer, Driver, CustomerRep], code: 200, input: [], output: WashBay, side_effects: [] }

  # --- TankWashCertificate ---
  - { method: POST, path: "/bulk-liquid/tank-wash-certificates", description: "Book a wash window on a bay; buffered-overlap enforced", roles: [WashOperator], code: 201, input: [trailer_id, wash_bay_id, wash_level, window_start, window_end], output: TankWashCertificate, side_effects: ["status=SCHEDULED"] }
  - { method: GET, path: "/bulk-liquid/tank-wash-certificates", description: "List wash certificates", roles: [FleetAdmin, Dispatcher, TerminalOperator, WashOperator, SafetyOfficer, Driver, CustomerRep], code: 200, input: ["limit?", "offset?", "trailer_id?", "wash_bay_id?", "consumed_by_shipment_id?", "status?"], output: "TankWashCertificate[]", side_effects: [] }
  - { method: GET, path: "/bulk-liquid/tank-wash-certificates/{certId}", description: "Get wash certificate (lazy EXPIRED evaluation)", roles: [FleetAdmin, Dispatcher, TerminalOperator, WashOperator, SafetyOfficer, Driver, CustomerRep], code: 200, input: [], output: TankWashCertificate, side_effects: [] }
  - { method: POST, path: "/bulk-liquid/tank-wash-certificates/{certId}/certify", description: "Mark scheduled wash complete; issues certificate with validity window", roles: [WashOperator], code: 200, input: [], output: TankWashCertificate, side_effects: ["status -> CERTIFIED; certified_at/expires_at set; trailer.last_wash_cert_id updated"] }
  - { method: POST, path: "/bulk-liquid/tank-wash-certificates/{certId}/revoke", description: "Revoke a certified/held certificate (contamination discovered); cascades to holding shipment and trailer", roles: [SafetyOfficer], code: 200, input: [], output: TankWashCertificate, side_effects: ["status -> VOIDED; PLANNED shipment -> DRAFT with cleared assignments; trailer -> AVAILABLE"] }
  - { method: POST, path: "/bulk-liquid/tank-wash-certificates/{certId}/cancel-booking", description: "Cancel a scheduled (not yet certified) wash booking", roles: [WashOperator], code: 200, input: [], output: TankWashCertificate, side_effects: ["SCHEDULED -> VOIDED"] }

  # --- LoadingRack ---
  - { method: POST, path: "/bulk-liquid/loading-racks", description: "Create loading rack", roles: [FleetAdmin], code: 201, input: [rack_code, terminal_name, authorized_groups, open_hour, close_hour, meter_id], output: LoadingRack, side_effects: [] }
  - { method: GET, path: "/bulk-liquid/loading-racks", description: "List loading racks", roles: [FleetAdmin, Dispatcher, TerminalOperator, WashOperator, SafetyOfficer, Driver, CustomerRep], code: 200, input: ["limit?", "offset?"], output: "LoadingRack[]", side_effects: [] }
  - { method: GET, path: "/bulk-liquid/loading-racks/{rackId}", description: "Get loading rack", roles: [FleetAdmin, Dispatcher, TerminalOperator, WashOperator, SafetyOfficer, Driver, CustomerRep], code: 200, input: [], output: LoadingRack, side_effects: [] }

  # --- Shipment ---
  - { method: POST, path: "/bulk-liquid/shipments", description: "Create shipment request in DRAFT; customer must be ACTIVE; CustomerRep callers must set customer_id to their own id", roles: [Dispatcher, CustomerRep], code: 201, input: [customer_id, product_id, ordered_gallons, route_miles, rate_per_gal_cents], output: Shipment, side_effects: ["status=DRAFT"] }
  - { method: GET, path: "/bulk-liquid/shipments", description: "List shipments", roles: [FleetAdmin, Dispatcher, TerminalOperator, WashOperator, SafetyOfficer, Driver, CustomerRep], code: 200, input: ["limit?", "offset?", "customer_id?", "product_id?", "trailer_id?", "driver_id?", "rack_id?", "wash_cert_id?", "status?"], output: "Shipment[]", side_effects: [] }
  - { method: GET, path: "/bulk-liquid/shipments/{shipmentId}", description: "Get shipment", roles: [FleetAdmin, Dispatcher, TerminalOperator, WashOperator, SafetyOfficer, Driver, CustomerRep], code: 200, input: [], output: Shipment, side_effects: [] }
  - { method: PATCH, path: "/bulk-liquid/shipments/{shipmentId}", description: "Revise DRAFT shipment commercial terms; OCC via expected_shipment_version; increments Shipment.version by 1", roles: [Dispatcher], code: 200, input: ["ordered_gallons?", "route_miles?", "rate_per_gal_cents?", expected_shipment_version], output: Shipment, side_effects: ["increments Shipment.version by 1"] }
  - { method: POST, path: "/bulk-liquid/shipments/{shipmentId}/plan", description: "Assign trailer+driver+rack window (+optional wash cert) and reserve window; full compatibility/wash/endorsement/temporal/fiscal validation chain", roles: [Dispatcher], code: 200, input: [trailer_id, driver_id, rack_id, rack_window_start, rack_window_end, "wash_cert_id?"], output: Shipment, side_effects: ["DRAFT -> PLANNED; trailer -> ASSIGNED; cert -> HELD; exposure recompute"] }
  - { method: POST, path: "/bulk-liquid/shipments/{shipmentId}/unplan", description: "Return PLANNED shipment to DRAFT, releasing trailer, cert hold, and rack window", roles: [Dispatcher], code: 200, input: [], output: Shipment, side_effects: ["PLANNED -> DRAFT; compensating releases"] }
  - { method: POST, path: "/bulk-liquid/shipments/{shipmentId}/cancel", description: "Cancel a DRAFT or PLANNED shipment", roles: [Dispatcher, CustomerRep], code: 200, input: [], output: Shipment, side_effects: ["-> CANCELLED; compensating releases when PLANNED"] }
  - { method: POST, path: "/bulk-liquid/shipments/{shipmentId}/check-in", description: "Driver check-in at rack; opens meter ticket; re-validates endorsements and window", roles: [TerminalOperator], code: 200, input: [], output: Shipment, side_effects: ["PLANNED -> LOADING; MeterTicket created OPEN"] }
  - { method: POST, path: "/bulk-liquid/shipments/{shipmentId}/abort-loading", description: "Abort loading, return to PLANNED; voids open meter ticket", roles: [TerminalOperator], code: 200, input: [], output: Shipment, side_effects: ["LOADING -> PLANNED; MeterTicket OPEN -> VOIDED"] }
  - { method: POST, path: "/bulk-liquid/shipments/{shipmentId}/close-meter", description: "Close rack meter ticket; computes observed/net60 gallons, provisional billing; consumes wash cert; stamps trailer last_product_group", roles: [TerminalOperator], code: 200, input: [meter_start_gal, meter_end_gal, observed_temp_F], output: MeterTicket, side_effects: ["LOADING -> LOADED; ticket CLOSED; cert CONSUMED; provisional_total_cents; exposure recompute"] }
  - { method: POST, path: "/bulk-liquid/shipments/{shipmentId}/record-weights", description: "Record measured axle weights; SoD vs meter closer; axle/gvwr/sum compliance", roles: [TerminalOperator], code: 200, input: [steer_lb, drive_lb, trailer_lb], output: Shipment, side_effects: ["weights_verified_at set"] }
  - { method: POST, path: "/bulk-liquid/shipments/{shipmentId}/confirm-placards", description: "Confirm applied placards match product placard code", roles: [TerminalOperator], code: 200, input: [observed_placard_code], output: Shipment, side_effects: ["placards_confirmed = true"] }
  - { method: POST, path: "/bulk-liquid/shipments/{shipmentId}/depart", description: "Depart terminal; requires verified weights, confirmed placards, approved spill plan", roles: [Dispatcher], code: 200, input: [], output: Shipment, side_effects: ["LOADED -> IN_TRANSIT"] }
  - { method: POST, path: "/bulk-liquid/shipments/{shipmentId}/start-delivery", description: "Begin delivery at consignee; opens delivery ticket; caller must be the assigned driver", roles: [Driver], code: 200, input: [], output: Shipment, side_effects: ["IN_TRANSIT -> DELIVERING; DeliveryTicket created OPEN"] }
  - { method: POST, path: "/bulk-liquid/shipments/{shipmentId}/resolve-variance", description: "Accept an out-of-tolerance delivery after review", roles: [SafetyOfficer], code: 200, input: [resolution_note], output: Shipment, side_effects: ["VARIANCE_REVIEW -> DELIVERED"] }
  - { method: POST, path: "/bulk-liquid/shipments/{shipmentId}/reconcile", description: "Finalize billing (net-60 basis, shortage credit); blocked by open spill incidents", roles: [FleetAdmin], code: 200, input: [], output: Shipment, side_effects: ["DELIVERED -> RECONCILED; final_total_cents; reconciled_at; exposure recompute"] }

  # --- MeterTicket / DeliveryTicket / RetainSample ---
  - { method: GET, path: "/bulk-liquid/meter-tickets", description: "List meter tickets", roles: [FleetAdmin, Dispatcher, TerminalOperator, WashOperator, SafetyOfficer, Driver, CustomerRep], code: 200, input: ["limit?", "offset?", "shipment_id?", "rack_id?"], output: "MeterTicket[]", side_effects: [] }
  - { method: GET, path: "/bulk-liquid/meter-tickets/{ticketId}", description: "Get meter ticket", roles: [FleetAdmin, Dispatcher, TerminalOperator, WashOperator, SafetyOfficer, Driver, CustomerRep], code: 200, input: [], output: MeterTicket, side_effects: [] }
  - { method: GET, path: "/bulk-liquid/delivery-tickets", description: "List delivery tickets", roles: [FleetAdmin, Dispatcher, TerminalOperator, WashOperator, SafetyOfficer, Driver, CustomerRep], code: 200, input: ["limit?", "offset?", "shipment_id?"], output: "DeliveryTicket[]", side_effects: [] }
  - { method: GET, path: "/bulk-liquid/delivery-tickets/{ticketId}", description: "Get delivery ticket", roles: [FleetAdmin, Dispatcher, TerminalOperator, WashOperator, SafetyOfficer, Driver, CustomerRep], code: 200, input: [], output: DeliveryTicket, side_effects: [] }
  - { method: POST, path: "/bulk-liquid/delivery-tickets/{ticketId}/close", description: "Close delivery ticket with metered delivery + retain sample; computes variance; may cascade to VARIANCE_REVIEW and agreement flag", roles: [Driver], code: 200, input: [delivered_observed_gal, delivered_temp_F, retain_sample_ml], output: DeliveryTicket, side_effects: ["ticket CLOSED_ACCEPTED|CLOSED_VARIANCE; shipment -> DELIVERED|VARIANCE_REVIEW; RetainSample created; trailer -> AVAILABLE; agreement flag cascade"] }
  - { method: GET, path: "/bulk-liquid/retain-samples", description: "List retain samples", roles: [FleetAdmin, Dispatcher, TerminalOperator, WashOperator, SafetyOfficer, Driver, CustomerRep], code: 200, input: ["limit?", "offset?", "shipment_id?", "delivery_ticket_id?"], output: "RetainSample[]", side_effects: [] }
  - { method: GET, path: "/bulk-liquid/retain-samples/{sampleId}", description: "Get retain sample", roles: [FleetAdmin, Dispatcher, TerminalOperator, WashOperator, SafetyOfficer, Driver, CustomerRep], code: 200, input: [], output: RetainSample, side_effects: [] }
  - { method: POST, path: "/bulk-liquid/retain-samples/{sampleId}/dispose", description: "Dispose of sample after retention period", roles: [SafetyOfficer], code: 200, input: [], output: RetainSample, side_effects: ["RETAINED -> DISPOSED"] }

  # --- SpillResponsePlan ---
  - { method: POST, path: "/bulk-liquid/spill-response-plans", description: "Create spill response plan (DRAFT); CustomerRep caller must own customer_id", roles: [CustomerRep, FleetAdmin], code: 201, input: [customer_id, product_id, equipment_checklist], output: SpillResponsePlan, side_effects: ["status=DRAFT"] }
  - { method: GET, path: "/bulk-liquid/spill-response-plans", description: "List spill response plans", roles: [FleetAdmin, Dispatcher, TerminalOperator, WashOperator, SafetyOfficer, Driver, CustomerRep], code: 200, input: ["limit?", "offset?", "customer_id?", "product_id?", "status?"], output: "SpillResponsePlan[]", side_effects: [] }
  - { method: GET, path: "/bulk-liquid/spill-response-plans/{planId}", description: "Get spill response plan (lazy EXPIRED evaluation)", roles: [FleetAdmin, Dispatcher, TerminalOperator, WashOperator, SafetyOfficer, Driver, CustomerRep], code: 200, input: [], output: SpillResponsePlan, side_effects: [] }
  - { method: POST, path: "/bulk-liquid/spill-response-plans/{planId}/submit", description: "Submit plan for approval", roles: [CustomerRep], code: 200, input: [], output: SpillResponsePlan, side_effects: ["DRAFT -> SUBMITTED"] }
  - { method: POST, path: "/bulk-liquid/spill-response-plans/{planId}/approve", description: "Approve plan; sets 365-day validity", roles: [SafetyOfficer], code: 200, input: [], output: SpillResponsePlan, side_effects: ["SUBMITTED -> APPROVED; approved_at/expires_at set"] }
  - { method: POST, path: "/bulk-liquid/spill-response-plans/{planId}/reject", description: "Reject plan", roles: [SafetyOfficer], code: 200, input: ["reason?"], output: SpillResponsePlan, side_effects: ["SUBMITTED -> REJECTED"] }
  - { method: POST, path: "/bulk-liquid/spill-response-plans/{planId}/suspend", description: "Suspend an approved plan", roles: [SafetyOfficer], code: 200, input: [], output: SpillResponsePlan, side_effects: ["APPROVED -> SUSPENDED"] }
  - { method: POST, path: "/bulk-liquid/spill-response-plans/{planId}/reinstate", description: "Reinstate a suspended plan (expires_at unchanged)", roles: [SafetyOfficer], code: 200, input: [], output: SpillResponsePlan, side_effects: ["SUSPENDED -> APPROVED"] }

  # --- SpillIncident ---
  - { method: POST, path: "/bulk-liquid/shipments/{shipmentId}/spill-incidents", description: "Report a spill during IN_TRANSIT/DELIVERING; severity computed; REPORTABLE deadline enforced", roles: [Driver], code: 201, input: [occurred_at, gallons_spilled], output: SpillIncident, side_effects: ["status=REPORTED; reported_by_driver_id = caller"] }
  - { method: GET, path: "/bulk-liquid/spill-incidents", description: "List spill incidents", roles: [FleetAdmin, Dispatcher, TerminalOperator, WashOperator, SafetyOfficer, Driver, CustomerRep], code: 200, input: ["limit?", "offset?", "shipment_id?", "reported_by_driver_id?", "status?"], output: "SpillIncident[]", side_effects: [] }
  - { method: GET, path: "/bulk-liquid/spill-incidents/{incidentId}", description: "Get spill incident", roles: [FleetAdmin, Dispatcher, TerminalOperator, WashOperator, SafetyOfficer, Driver, CustomerRep], code: 200, input: [], output: SpillIncident, side_effects: [] }
  - { method: POST, path: "/bulk-liquid/spill-incidents/{incidentId}/start-review", description: "Open incident review", roles: [SafetyOfficer], code: 200, input: [], output: SpillIncident, side_effects: ["REPORTED -> UNDER_REVIEW"] }
  - { method: POST, path: "/bulk-liquid/spill-incidents/{incidentId}/request-info", description: "Return incident to reporter for more info", roles: [SafetyOfficer], code: 200, input: [], output: SpillIncident, side_effects: ["UNDER_REVIEW -> REPORTED"] }
  - { method: POST, path: "/bulk-liquid/spill-incidents/{incidentId}/close", description: "Close incident; requires shipment past transit", roles: [SafetyOfficer], code: 200, input: [], output: SpillIncident, side_effects: ["UNDER_REVIEW -> CLOSED; closed_by_user_id recorded"] }
  - { method: POST, path: "/bulk-liquid/spill-incidents/{incidentId}/reopen", description: "Reopen a closed incident; must be a different SafetyOfficer than the closer", roles: [SafetyOfficer], code: 200, input: [], output: SpillIncident, side_effects: ["CLOSED -> UNDER_REVIEW"] }

  # --- DedicatedTrailerAgreement ---
  - { method: POST, path: "/bulk-liquid/dedicated-trailer-agreements", description: "Create dedicated-trailer agreement (PENDING); customer must be enrolled; overlapping periods on same trailer rejected", roles: [FleetAdmin], code: 201, input: [customer_id, trailer_id, committed_loads_per_month, effective_from, effective_to], output: DedicatedTrailerAgreement, side_effects: ["status=PENDING"] }
  - { method: GET, path: "/bulk-liquid/dedicated-trailer-agreements", description: "List dedicated-trailer agreements", roles: [FleetAdmin, Dispatcher, TerminalOperator, WashOperator, SafetyOfficer, Driver, CustomerRep], code: 200, input: ["limit?", "offset?", "customer_id?", "trailer_id?", "status?"], output: "DedicatedTrailerAgreement[]", side_effects: [] }
  - { method: GET, path: "/bulk-liquid/dedicated-trailer-agreements/{agreementId}", description: "Get agreement", roles: [FleetAdmin, Dispatcher, TerminalOperator, WashOperator, SafetyOfficer, Driver, CustomerRep], code: 200, input: [], output: DedicatedTrailerAgreement, side_effects: [] }
  - { method: PATCH, path: "/bulk-liquid/dedicated-trailer-agreements/{agreementId}", description: "Revise committed volume while PENDING; OCC via expected_agreement_version; increments version by 1", roles: [FleetAdmin], code: 200, input: ["committed_loads_per_month?", expected_agreement_version], output: DedicatedTrailerAgreement, side_effects: ["increments DedicatedTrailerAgreement.version by 1"] }
  - { method: POST, path: "/bulk-liquid/dedicated-trailer-agreements/{agreementId}/activate", description: "Activate agreement; dedicates trailer to customer", roles: [FleetAdmin], code: 200, input: [], output: DedicatedTrailerAgreement, side_effects: ["PENDING -> ACTIVE; trailer.dedicated_customer_id set"] }
  - { method: POST, path: "/bulk-liquid/dedicated-trailer-agreements/{agreementId}/terminate", description: "Terminate agreement; releases trailer dedication", roles: [FleetAdmin], code: 200, input: [], output: DedicatedTrailerAgreement, side_effects: ["ACTIVE|SUSPENDED -> TERMINATED; trailer.dedicated_customer_id cleared"] }
  - { method: POST, path: "/bulk-liquid/dedicated-trailer-agreements/{agreementId}/close-month", description: "Settle a past calendar month: count reconciled dedicated loads, assess shortfall fee", roles: [FleetAdmin], code: 200, input: [settlement_month], output: DedicatedTrailerAgreement, side_effects: ["shortfall counters updated; last_settled_month set"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth / request ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or role unknown" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not allowed on endpoint, or entity-backed identity mismatch (Driver != shipment.driver_id; CustomerRep != customer_id)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum member, non-positive quantity, window_end <= window_start, close_hour <= open_hour, or unknown body field" }
  # --- not found ---
  - { id: ERR_CUSTOMER_NOT_FOUND, http: 404, condition: "customer id does not exist" }
  - { id: ERR_PRODUCT_NOT_FOUND, http: 404, condition: "product id does not exist" }
  - { id: ERR_COMPATIBILITY_RULE_NOT_FOUND, http: 404, condition: "compatibility rule id does not exist" }
  - { id: ERR_TRAILER_NOT_FOUND, http: 404, condition: "trailer id does not exist" }
  - { id: ERR_DRIVER_NOT_FOUND, http: 404, condition: "driver id does not exist" }
  - { id: ERR_WASH_BAY_NOT_FOUND, http: 404, condition: "wash bay id does not exist" }
  - { id: ERR_WASH_CERT_NOT_FOUND, http: 404, condition: "tank wash certificate id does not exist" }
  - { id: ERR_RACK_NOT_FOUND, http: 404, condition: "loading rack id does not exist" }
  - { id: ERR_SHIPMENT_NOT_FOUND, http: 404, condition: "shipment id does not exist" }
  - { id: ERR_METER_TICKET_NOT_FOUND, http: 404, condition: "meter ticket id does not exist" }
  - { id: ERR_DELIVERY_TICKET_NOT_FOUND, http: 404, condition: "delivery ticket id does not exist" }
  - { id: ERR_RETAIN_SAMPLE_NOT_FOUND, http: 404, condition: "retain sample id does not exist" }
  - { id: ERR_SPILL_PLAN_NOT_FOUND, http: 404, condition: "spill response plan id does not exist" }
  - { id: ERR_SPILL_INCIDENT_NOT_FOUND, http: 404, condition: "spill incident id does not exist" }
  - { id: ERR_AGREEMENT_NOT_FOUND, http: 404, condition: "dedicated-trailer agreement id does not exist" }
  # --- concurrency ---
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the entity's current version (OCC)" }
  # --- state ---
  - { id: ERR_CUSTOMER_NOT_ACTIVE, http: 409, condition: "Shipment create requires customer ACTIVE; suspend requires ACTIVE" }
  - { id: ERR_TRAILER_NOT_AVAILABLE, http: 409, condition: "Plan requires trailer AVAILABLE" }
  - { id: ERR_DRIVER_NOT_ACTIVE, http: 409, condition: "Plan/check-in requires driver ACTIVE; deactivate requires ACTIVE" }
  - { id: ERR_SHIPMENT_INVALID_STATE, http: 409, condition: "Shipment not in the required from-state for the requested action" }
  - { id: ERR_CERT_INVALID_STATE, http: 409, condition: "Certificate not in the required state (SCHEDULED for certify/cancel-booking; CERTIFIED for plan attach; CERTIFIED|HELD for revoke)" }
  - { id: ERR_DELIVERY_TICKET_NOT_OPEN, http: 409, condition: "Delivery close requires ticket OPEN" }
  - { id: ERR_SAMPLE_NOT_RETAINED, http: 409, condition: "Dispose requires sample RETAINED" }
  - { id: ERR_SPILL_PLAN_INVALID_STATE, http: 409, condition: "Spill plan not in required state for submit/approve/reject/suspend/reinstate" }
  - { id: ERR_INCIDENT_INVALID_STATE, http: 409, condition: "Incident not in required state for start-review/request-info/close/reopen" }
  - { id: ERR_AGREEMENT_INVALID_STATE, http: 409, condition: "Agreement not in required state (PENDING for activate/patch; ACTIVE|SUSPENDED for terminate; ACTIVE for close-month)" }
  - { id: ERR_WEIGHTS_ALREADY_VERIFIED, http: 409, condition: "record-weights called after weights_verified_at already set" }
  - { id: ERR_WEIGHTS_NOT_VERIFIED, http: 409, condition: "depart requires weights_verified_at set" }
  - { id: ERR_PLACARDS_NOT_CONFIRMED, http: 409, condition: "depart requires placards_confirmed = true" }
  - { id: ERR_OPEN_INCIDENT, http: 409, condition: "reconcile blocked by a SpillIncident in REPORTED or UNDER_REVIEW on this shipment" }
  - { id: ERR_SHIPMENT_NOT_DELIVERED, http: 409, condition: "incident close requires shipment in DELIVERED, VARIANCE_REVIEW, RECONCILED, or CANCELLED" }
  # --- business safety ---
  - { id: ERR_PRODUCT_INCOMPATIBILITY_FORBIDDEN, http: 422, condition: "Compatibility rule marks (prior_group, next_group) as forbidden" }
  - { id: ERR_COMPATIBILITY_RULE_MISSING, http: 422, condition: "No compatibility rule exists for (trailer.last_product_group, product.compatibility_group)" }
  - { id: ERR_WASH_LEVEL_INSUFFICIENT, http: 422, condition: "Attached certificate wash level rank below required level rank" }
  - { id: ERR_WASH_CERT_EXPIRED, http: 422, condition: "Attached certificate expires_at <= logical clock at plan time" }
  - { id: ERR_DRIVER_ENDORSEMENT_MISSING, http: 422, condition: "Driver lacks tanker endorsement, or hazmat endorsement when product.hazmat_class != NONE" }
  - { id: ERR_DRIVER_ENDORSEMENT_EXPIRED, http: 422, condition: "Driver endorsement_expires_on is before the current logical date" }
  - { id: ERR_PLACARD_MISMATCH, http: 422, condition: "observed_placard_code != product.placard_code" }
  - { id: ERR_AXLE_LIMIT_EXCEEDED, http: 422, condition: "A measured axle weight exceeds its rating (bound is inclusive)" }
  - { id: ERR_GVWR_EXCEEDED, http: 422, condition: "Sum of measured axle weights exceeds gvwr_lb (bound is inclusive)" }
  - { id: ERR_WEIGHT_SUM_INCONSISTENT, http: 422, condition: "Sum of measured axle weights deviates from expected gross (tare + net60*density) by more than 3%" }
  - { id: ERR_SPILL_PLAN_NOT_APPROVED, http: 422, condition: "No APPROVED, unexpired spill response plan for (customer_id, product_id) at depart" }
  # --- business temporal ---
  - { id: ERR_WINDOW_OUTSIDE_OPERATING_HOURS, http: 422, condition: "Rack window not within [open_hour, close_hour] on a single UTC day" }
  - { id: ERR_RACK_WINDOW_CONFLICT, http: 409, condition: "Rack window overlaps (half-open, zero buffer) another PLANNED/LOADING/LOADED shipment on the same rack" }
  - { id: ERR_WASH_BAY_WINDOW_CONFLICT, http: 409, condition: "Wash window on same bay violates cleanup buffer: new.start < existing.end + buffer AND existing.start < new.end + buffer, among SCHEDULED/CERTIFIED bookings" }
  - { id: ERR_RACK_WINDOW_NOT_ACTIVE, http: 422, condition: "Check-in logical clock outside [rack_window_start, rack_window_end)" }
  - { id: ERR_REPORT_DEADLINE_MISSED, http: 422, condition: "REPORTABLE spill reported more than 12h after occurred_at" }
  - { id: ERR_SAMPLE_STILL_IN_RETENTION, http: 422, condition: "Dispose before retain_until" }
  - { id: ERR_AGREEMENT_PERIOD_CONFLICT, http: 409, condition: "Overlapping [effective_from, effective_to] (inclusive both ends) with another PENDING/ACTIVE agreement on the same trailer" }
  - { id: ERR_MONTH_NOT_CLOSABLE, http: 422, condition: "settlement_month must be strictly before the current clock month and strictly after last_settled_month" }
  # --- business constraint ---
  - { id: ERR_DUPLICATE_UNIT_NUMBER, http: 409, condition: "trailer unit_number already exists" }
  - { id: ERR_DUPLICATE_CDL_NUMBER, http: 409, condition: "driver cdl_number already exists" }
  - { id: ERR_DUPLICATE_COMPATIBILITY_RULE, http: 409, condition: "(prior_group, next_group) rule already exists" }
  - { id: ERR_TARE_AXLE_MISMATCH, http: 422, condition: "tare_steer+tare_drive+tare_trailer != tare_weight_lb" }
  - { id: ERR_CAPACITY_EXCEEDED, http: 422, condition: "ordered_gallons > trailer.capacity_gallons" }
  - { id: ERR_TRAILER_DEDICATION_MISMATCH, http: 422, condition: "Trailer dedicated to a different customer than the shipment's" }
  - { id: ERR_TRAILER_ALREADY_DEDICATED, http: 409, condition: "Agreement activate: trailer.dedicated_customer_id already set" }
  - { id: ERR_SAME_OPERATOR_SEGREGATION, http: 403, condition: "Segregation of duties: weight verifier equals meter closer, or incident reopener equals incident closer" }
  - { id: ERR_NOT_PROGRAM_ENROLLED, http: 422, condition: "Agreement create: customer.dedicated_program_enrolled is false" }
  # --- referential / fiscal ---
  - { id: ERR_RACK_NOT_AUTHORIZED_FOR_PRODUCT, http: 422, condition: "product.compatibility_group not in rack.authorized_groups" }
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 402, condition: "Plan would push customer exposure above credit_limit_cents" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: FleetAdmin
    description: "Carrier back-office administrator: master data, fleet, reconcile, agreements, month close, logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /bulk-liquid/customers, /customers/{id}/suspend, /customers/{id}/reactivate"
      - "POST /bulk-liquid/products, /compatibility-rules, /trailers, /drivers, /drivers/{id}/deactivate, /wash-bays, /loading-racks"
      - "POST /bulk-liquid/shipments/{id}/reconcile"
      - "POST+PATCH /bulk-liquid/dedicated-trailer-agreements incl. activate/terminate/close-month"
      - "POST /bulk-liquid/_clock/set_current_utc"
    shared_operations: ["GET any resource"]
  - name: Dispatcher
    description: "Load planner: creates and plans shipments, departs loads"
    identity: opaque
    exclusive_operations:
      - "PATCH /bulk-liquid/shipments/{id}"
      - "POST /bulk-liquid/shipments/{id}/plan, /unplan, /depart"
    shared_operations: ["POST /bulk-liquid/shipments", "POST /bulk-liquid/shipments/{id}/cancel", "GET any resource"]
  - name: TerminalOperator
    description: "Loading-rack operator: check-in, abort, close-meter, record-weights, confirm-placards (weights must be a different operator than meter closer)"
    identity: opaque
    exclusive_operations:
      - "POST /bulk-liquid/shipments/{id}/check-in, /abort-loading, /close-meter, /record-weights, /confirm-placards"
    shared_operations: ["GET any resource"]
  - name: WashOperator
    description: "Tank wash facility operator: books and certifies washes"
    identity: opaque
    exclusive_operations:
      - "POST /bulk-liquid/tank-wash-certificates, /tank-wash-certificates/{id}/certify, /tank-wash-certificates/{id}/cancel-booking"
    shared_operations: ["GET any resource"]
  - name: SafetyOfficer
    description: "HSE officer: spill plan approval lifecycle, incident review lifecycle, cert revocation, sample disposal, variance resolution"
    identity: opaque
    exclusive_operations:
      - "POST /bulk-liquid/tank-wash-certificates/{id}/revoke"
      - "POST /bulk-liquid/spill-response-plans/{id}/approve, /reject, /suspend, /reinstate"
      - "POST /bulk-liquid/spill-incidents/{id}/start-review, /request-info, /close, /reopen"
      - "POST /bulk-liquid/retain-samples/{id}/dispose"
      - "POST /bulk-liquid/shipments/{id}/resolve-variance"
    shared_operations: ["GET any resource"]
  - name: Driver
    description: "CDL driver; identity equals a Driver entity id; performs start-delivery, delivery close, spill reports on own shipments"
    identity: "entity_backed:Driver"
    exclusive_operations:
      - "POST /bulk-liquid/shipments/{id}/start-delivery"
      - "POST /bulk-liquid/delivery-tickets/{id}/close"
      - "POST /bulk-liquid/shipments/{id}/spill-incidents"
    shared_operations: ["GET any resource"]
  - name: CustomerRep
    description: "Customer representative; identity equals a Customer entity id; creates shipment requests and spill response plans for own customer"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /bulk-liquid/spill-response-plans, /spill-response-plans/{id}/submit"
    shared_operations: ["POST /bulk-liquid/shipments", "POST /bulk-liquid/shipments/{id}/cancel", "GET any resource"]
