        distinguishing_aspect: "POST /ops/units/{id}/menu-activations/deactivate with the current unit version ends the ACTIVE activation (ENDED, ended_at = now) and bumps Unit.version by exactly 1; a stale version returns 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["Clock 2026-09-10T08:00:00Z. Storm WATCH; unit U power DOWN with TIER1 activation. Unit version captured from GET (1 create + 1 report cascade = 2)."]
          setup_api_calls:
