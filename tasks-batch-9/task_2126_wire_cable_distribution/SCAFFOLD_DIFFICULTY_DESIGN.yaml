        grounds:
          - state_machines.SalesOrder.STAGED_to_DELIVERED
          - state_machines.SalesOrder.UNBILLED_to_INVOICED
          - state_machines.SalesOrder.INVOICED_to_CREDITED
          - entities.SalesOrder.fields.fulfillment_status
          - entities.SalesOrder.fields.billing_status
        distinguishing_aspect: |
          PARALLEL dimensions on the SalesOrder entity: fulfillment_status stops
          at DELIVERED and never moves again, while billing_status independently
          advances UNBILLED -> INVOICED -> CREDITED on the very same row driven by
          a different trigger (the reel return), proving the two axes are not a
          single linear pipeline.
