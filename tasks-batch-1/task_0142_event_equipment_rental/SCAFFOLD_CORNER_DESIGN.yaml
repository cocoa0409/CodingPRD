        claim_type: peer_roles
        grounds: [roles, "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "Customer calling POST /catalog-items (RentalAgent-exclusive) → ERR_UNAUTHORIZED 403."
        test_recipe:
          setup: ["Customer C43 exists."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "c43@x.com", full_name: "C FortyThree", phone: "555-0043" }
              as: RentalAgent
              captures: { c43_id: $.data.id }
          trigger:
            - call: "POST /catalog-items"
              payload: { sku: "X-1", name: "X", category: "CHAIR", total_units: 5, daily_rate_cents: 100 }
              as: Customer
              as_user_id: "${c43_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 403"
            - "response.data.error_id == ERR_UNAUTHORIZED"

