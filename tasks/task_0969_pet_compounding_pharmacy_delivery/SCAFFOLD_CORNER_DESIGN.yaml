            - { call: "GET /controlled-substance-entries?lot_id=${lot}", payload: {}, as: ComplianceOfficer, captures: { d0: "$.data[0].qty_delta", b0: "$.data[0].running_balance", d1: "$.data[1].qty_delta", b1: "$.data[1].running_balance", d2: "$.data[2].qty_delta", b2: "$.data[2].running_balance" } }
          assert:
            - "entries replay RECEIVE +60 -> 60, WASTE -5 -> 55, DISPENSE -10 -> 45"
            - "final running_balance 45 == Lot.${lot}.qty_on_hand (45) + qty_reserved (0)"
            - "Lot.${lot}.qty_dispensed == 10 and qty_wasted == 5"

