              as: DispatchOperator
            - call: "POST /tour-departures/${dep_id}/lock"
              payload: {}
              as: DispatchOperator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-22T09:15:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /tour-departures/${dep_id}/depart"
              payload: {}
              as: Guide
              as_user_id: "${guide_id}"
          assert:
            - "TourDeparture.${dep_id}.status == DEPARTED"
            - "Reservation.${res_id}.reservation_status == CHECKED_OUT"
            - "Unit.${unit_id}.status == OUT"
            - "GearItem.${helmet_id}.status == OUT"
            - "GearItem.${suit_id}.status == OUT"

  # =================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =================================================================
